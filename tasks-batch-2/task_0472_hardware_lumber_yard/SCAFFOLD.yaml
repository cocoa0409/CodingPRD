scenario: |
  472. Hardware Store & Lumber Yard (Ace style): SKU & bin/aisle, lumber by-the-foot & cut,
  rental & propane exchange, key-cutting/paint-mix service, contractor account & net terms,
  special order & vendor drop-ship, loyalty & co-op buying, inventory/reorder

domain_name: hardware-lumber-yard
api_prefix: /            # flat top-level resource API (vendors, products, sales-orders, rentals, ...)

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation          # finite on-hand inventory + credit pool competed for, committed, released
  secondary_archetype: pricing_engine          # lumber by-the-foot, cut fees, loyalty/co-op tiers, net-term pricing
  complexity_layers:
    - cascading_side_effects                   # fulfill -> line -> on_hand -> reorder flag (depth 3); special-order confirm -> order -> balance
    - dual_variant_calculation                 # provisional vs final order total; committed vs settled credit-available
    - derived_field_reconciliation             # ContractorAccount.balance_cents / loyalty_points; Product.reorder_needed
    - optimistic_concurrency                   # OCC on SalesOrder.version (place against stale order) and ContractorAccount.version

  entity_topology: hybrid                       # SalesOrder->OrderLine tree + flat FK web (Product, Vendor, ContractorAccount, RentalAsset, ServiceStation)
  state_machine_shape: parallel                 # SalesOrder payment_status x fulfillment_status; SpecialOrder cyclic
  relationship_patterns:
    - one_to_many                               # SalesOrder -> OrderLine; ContractorAccount -> LoyaltyLedger
    - cross_aggregate                           # OrderLine -> Product; RentalAgreement -> RentalAsset; SpecialOrder -> Vendor
  role_model: peer_roles                        # SalesAssociate / RentalClerk / AccountsManager / InventoryManager / Contractor
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Vendor display name
        constraints: non-empty
      - name: drop_ship_capable
        type: boolean
        source: input
        description: Whether the vendor fulfills SpecialOrders by drop-ship
        default: false
      - name: coop_rebate_pct
        type: number
        source: input
        description: Co-op buying rebate fraction applied to PurchaseOrder subtotals at this vendor (0..0.25)
        default: 0
        constraints: "0 <= coop_rebate_pct <= 0.25"
      - name: status
        type: enum
        source: system
        description: Vendor lifecycle state
        default: ACTIVE
        constraints: "one of ACTIVE, INACTIVE"

  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: Stock-keeping unit code; unique across all Products
        constraints: "unique; non-empty"
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; primary supplier of this SKU"
      - name: sell_mode
        type: enum
        source: input
        description: Pricing mode; EACH = discrete units, BY_FOOT = lumber sold by the linear foot
        constraints: "one of EACH, BY_FOOT"
      - name: aisle
        type: string
        source: input
        description: Aisle label of the bin location
        constraints: non-empty
      - name: bin
        type: string
        source: input
        description: Bin label within the aisle; (aisle, bin) pair is unique across Products
        constraints: "(aisle, bin) unique"
      - name: list_price_cents
        type: integer
        source: input
        description: Per-unit list price in cents (used when sell_mode == EACH)
        constraints: ">= 0"
      - name: price_per_foot_cents
        type: integer
        source: input
        description: Per-linear-foot price in cents (used when sell_mode == BY_FOOT)
        default: 0
        constraints: ">= 0"
      - name: cut_fee_cents
        type: integer
        source: input
        description: Flat fee in cents charged per cut on BY_FOOT lumber
        default: 0
        constraints: ">= 0"
      - name: on_hand
        type: number
        source: system
        description: Current physical stock; whole units when EACH, linear feet when BY_FOOT
        default: 0
        constraints: ">= 0"
      - name: reorder_point
        type: number
        source: input
        description: Stock level at or below which reorder_needed flips true
        constraints: ">= 0"
      - name: reorder_qty
        type: number
        source: input
        description: Suggested replenishment quantity when a reorder is needed
        constraints: "> 0"
      - name: reorder_needed
        type: boolean
        source: computed
        description: Derived flag — true when on_hand <= reorder_point (recomputed on every on_hand change)
        default: false
      - name: status
        type: enum
        source: system
        description: Catalog lifecycle state
        default: ACTIVE
        constraints: "one of ACTIVE, DISCONTINUED"

  - name: ContractorAccount
    parent: null
    common_fields: true
    fields:
      - name: business_name
        type: string
        source: input
        description: Contractor business name
        constraints: non-empty
      - name: credit_limit_cents
        type: integer
        source: input
        description: Maximum outstanding net-term balance permitted
        constraints: ">= 0"
      - name: net_terms_days
        type: integer
        source: input
        description: Net-payment window in days (e.g. 30 for NET-30)
        constraints: "one of 0, 15, 30, 45, 60"
      - name: balance_cents
        type: integer
        source: computed
        description: Settled outstanding balance = sum of Invoice.amount_cents for Invoices with status == ISSUED on this account
        default: 0
      - name: committed_cents
        type: integer
        source: computed
        description: Provisional exposure = balance_cents + sum of SalesOrder.total_cents for orders with fulfillment_status == PLACED and payment_status == UNBILLED on this account
        default: 0
      - name: loyalty_points
        type: integer
        source: computed
        description: Sum of LoyaltyLedger.delta_points across this account's ledger entries
        default: 0
      - name: status
        type: enum
        source: system
        description: Account lifecycle state; SUSPENDED blocks new net-term orders
        default: ACTIVE
        constraints: "one of ACTIVE, SUSPENDED"

  - name: SalesOrder
    parent: null
    common_fields: true
    fields:
      - name: contractor_account_id
        type: string
        source: input
        description: "FK -> ContractorAccount.id; null for cash sale (loyalty and net terms then do not apply)"
        default: null
      - name: fulfillment_status
        type: enum
        source: system
        description: Fulfillment dimension of the order lifecycle
        default: DRAFT
        constraints: "one of DRAFT, PLACED, FULFILLED, CANCELLED"
      - name: payment_status
        type: enum
        source: system
        description: Payment dimension; evolves independently of fulfillment_status
        default: UNBILLED
        constraints: "one of UNBILLED, INVOICED, PAID, VOIDED"
      - name: pricing_mode
        type: enum
        source: computed
        description: PROVISIONAL while DRAFT/PLACED, FINAL once FULFILLED — selects the total variant
        default: PROVISIONAL
        constraints: "one of PROVISIONAL, FINAL"
      - name: subtotal_cents
        type: integer
        source: computed
        description: Sum of OrderLine.line_total_cents over this order's non-RESTOCKED lines (per-line rounding already applied)
        default: 0
      - name: loyalty_discount_cents
        type: integer
        source: computed
        description: Tiered loyalty discount keyed on subtotal_cents tier (0 for cash sales)
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: subtotal_cents - loyalty_discount_cents (floored at 0)
        default: 0
      - name: points_accrued
        type: integer
        source: system
        description: Loyalty points minted to the account on FULFILLED (0 until fulfilled / for cash sales)
        default: 0

  - name: OrderLine
    parent: SalesOrder
    common_fields: true
    fields:
      - name: sales_order_id
        type: string
        source: system
        description: "FK -> SalesOrder.id; owning order"
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the SKU on this line"
      - name: qty
        type: number
        source: input
        description: Quantity — whole units when product is EACH, linear feet when BY_FOOT
        constraints: "> 0"
      - name: cut_count
        type: integer
        source: input
        description: Number of cuts requested on BY_FOOT lumber (0 for EACH; cut fee charged per cut)
        default: 0
        constraints: ">= 0"
      - name: line_total_cents
        type: integer
        source: computed
        description: Per-line charge in cents, rounded to the cent at the line level before order subtotal sums it
        default: 0
      - name: status
        type: enum
        source: system
        description: Line lifecycle within the order
        default: PENDING
        constraints: "one of PENDING, FULFILLED, RESTOCKED"

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: sales_order_id
        type: string
        source: system
        description: "FK -> SalesOrder.id; the order this invoice bills"
      - name: contractor_account_id
        type: string
        source: system
        description: "FK -> ContractorAccount.id; the billed account"
      - name: amount_cents
        type: integer
        source: system
        description: Invoiced amount, copied from SalesOrder.total_cents at INVOICED time
        default: 0
      - name: due_at
        type: datetime
        source: system
        description: Payment due date = invoice issue clock time + ContractorAccount.net_terms_days days
      - name: status
        type: enum
        source: system
        description: Invoice lifecycle state
        default: ISSUED
        constraints: "one of ISSUED, PAID, VOID"

  - name: RentalAsset
    parent: null
    common_fields: true
    fields:
      - name: asset_tag
        type: string
        source: input
        description: Physical asset tag; unique across RentalAssets
        constraints: "unique; non-empty"
      - name: category
        type: string
        source: input
        description: Equipment category label (e.g. AUGER, TILLER)
        constraints: non-empty
      - name: daily_rate_cents
        type: integer
        source: input
        description: Rental price in cents per started rental day
        constraints: "> 0"
      - name: deposit_cents
        type: integer
        source: input
        description: Refundable deposit held during a rental
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Asset availability state; MAINTENANCE assets cannot be reserved
        default: AVAILABLE
        constraints: "one of AVAILABLE, RENTED, MAINTENANCE"

  - name: RentalAgreement
    parent: null
    common_fields: true
    fields:
      - name: rental_asset_id
        type: string
        source: input
        description: "FK -> RentalAsset.id; the reserved unit"
      - name: contractor_account_id
        type: string
        source: input
        description: "FK -> ContractorAccount.id; renter (null for cash renter)"
        default: null
      - name: start_at
        type: datetime
        source: input
        description: Reservation start instant (inclusive)
      - name: due_at
        type: datetime
        source: input
        description: Reservation end instant (exclusive); occupies the half-open interval [start_at, due_at)
        constraints: "due_at > start_at"
      - name: returned_at
        type: datetime
        source: system
        description: Actual return instant (set on RETURNED)
        default: null
      - name: rental_charge_cents
        type: integer
        source: computed
        description: Rental charge in cents — daily_rate_cents * billed_days where billed_days counts each started UTC calendar day
        default: 0
      - name: status
        type: enum
        source: system
        description: Rental lifecycle state
        default: RESERVED
        constraints: "one of RESERVED, CHECKED_OUT, RETURNED, CANCELLED"

  - name: ServiceStation
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Bench/station name (e.g. PAINT-MIX-1, KEY-1)
        constraints: non-empty
      - name: buffer_minutes
        type: integer
        source: input
        description: Mandatory clean-down buffer in minutes that must separate two ServiceTickets on this station
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Station availability; OFFLINE stations cannot accept new tickets
        default: ACTIVE
        constraints: "one of ACTIVE, OFFLINE"

  - name: ServiceTicket
    parent: null
    common_fields: true
    fields:
      - name: service_station_id
        type: string
        source: input
        description: "FK -> ServiceStation.id; station performing the service"
      - name: contractor_account_id
        type: string
        source: input
        description: "FK -> ContractorAccount.id; null for cash customer"
        default: null
      - name: service_type
        type: enum
        source: input
        description: Service performed at this ticket
        constraints: "one of KEY_CUT, PAINT_MIX, PROPANE_EXCHANGE"
      - name: cylinder_certified
        type: boolean
        source: input
        description: Whether the customer-supplied propane cylinder passed certification (required true for PROPANE_EXCHANGE)
        default: false
      - name: scheduled_start
        type: datetime
        source: input
        description: Appointment start instant (inclusive)
      - name: scheduled_end
        type: datetime
        source: input
        description: Appointment end instant (exclusive); occupies closed-with-buffer interval — see overlap rule
        constraints: "scheduled_end > scheduled_start"
      - name: fee_cents
        type: integer
        source: computed
        description: Service fee in cents computed from service_type and station base fees
        default: 0
      - name: status
        type: enum
        source: system
        description: Ticket lifecycle state
        default: BOOKED
        constraints: "one of BOOKED, IN_PROGRESS, COMPLETED, CANCELLED"

  - name: SpecialOrder
    parent: null
    common_fields: true
    fields:
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the drop-ship vendor"
      - name: contractor_account_id
        type: string
        source: input
        description: "FK -> ContractorAccount.id; account placing the special order"
      - name: description
        type: string
        source: input
        description: Free-text description of the special-ordered item
        constraints: non-empty
      - name: quoted_unit_cents
        type: integer
        source: input
        description: Vendor-quoted unit price in cents; set on each QUOTED transition
        default: 0
        constraints: ">= 0"
      - name: qty
        type: integer
        source: input
        description: Quantity special-ordered
        constraints: "> 0"
      - name: revision_count
        type: integer
        source: system
        description: Number of times the quote was revised (incremented on each REVISION_REQUESTED -> QUOTED loop)
        default: 0
      - name: confirmed_total_cents
        type: integer
        source: computed
        description: quoted_unit_cents * qty plus drop-ship surcharge, locked at CONFIRMED time
        default: 0
      - name: status
        type: enum
        source: system
        description: Special-order lifecycle state (cyclic via revision loop)
        default: DRAFT
        constraints: "one of DRAFT, QUOTED, REVISION_REQUESTED, CONFIRMED, RECEIVED, CANCELLED"

  - name: PurchaseOrder
    parent: null
    common_fields: true
    fields:
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; supplier the PO is raised against"
      - name: lines
        type: array
        source: input
        description: Array of { product_id, qty, unit_cost_cents } objects; product_id must reference a Product supplied by vendor_id
      - name: gross_cents
        type: integer
        source: computed
        description: Sum over lines of (qty * unit_cost_cents)
        default: 0
      - name: coop_rebate_cents
        type: integer
        source: computed
        description: Co-op rebate = round(gross_cents * Vendor.coop_rebate_pct) when gross_cents >= COOP_MIN_GROSS_CENTS, else 0
        default: 0
      - name: net_cost_cents
        type: integer
        source: computed
        description: gross_cents - coop_rebate_cents
        default: 0
      - name: status
        type: enum
        source: system
        description: Purchase-order lifecycle state
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, RECEIVED, CANCELLED"

  - name: LoyaltyLedger
    parent: ContractorAccount
    common_fields: false
    fields:
      - name: contractor_account_id
        type: string
        source: system
        description: "FK -> ContractorAccount.id; owning account"
      - name: delta_points
        type: integer
        source: system
        description: Signed point change — positive on accrual, negative on reversal
      - name: reason
        type: enum
        source: system
        description: Why the entry was minted
        constraints: "one of ORDER_ACCRUAL, ORDER_REVERSAL"
      - name: sales_order_id
        type: string
        source: system
        description: "FK -> SalesOrder.id; the order that generated this entry"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SalesOrder
    initial_state: "fulfillment_status=DRAFT, payment_status=UNBILLED"
    terminal_states: ["fulfillment_status=CANCELLED", "payment_status=PAID", "payment_status=VOIDED"]
    note: |
      Parallel state dimensions. fulfillment_status (DRAFT->PLACED->FULFILLED, plus CANCELLED) and
      payment_status (UNBILLED->INVOICED->PAID, plus VOIDED) evolve on independent axes of the same row.
    transitions:
      - from: "fulfillment_status=DRAFT"
        to: "fulfillment_status=PLACED"
        trigger: "POST /sales-orders/{id}/place"
        actor: SalesAssociate
        preconditions:
          - "order has >= 1 OrderLine in status PENDING (empty order rejected ERR_EMPTY_ORDER)"
          - "every line's Product.status == ACTIVE (else ERR_PRODUCT_DISCONTINUED)"
          - "if contractor_account_id set: ContractorAccount.status == ACTIVE (else ERR_ACCOUNT_SUSPENDED)"
          - "if contractor_account_id set: committed_cents projection (balance_cents + this order's total_cents) <= credit_limit_cents (else ERR_CREDIT_LIMIT_EXCEEDED)"
          - "expected_sales_order_version matches SalesOrder.version (else ERR_STALE_ORDER_VERSION)"
        side_effects:
          - "recompute subtotal_cents (sum of PENDING line_total_cents), loyalty_discount_cents, total_cents (calc order_total_provisional)"
          - "pricing_mode stays PROVISIONAL"
          - "increments SalesOrder.version by 1"
          - "if contractor_account_id set: ContractorAccount.committed_cents recomputed (derived)"
      - from: "fulfillment_status=PLACED"
        to: "fulfillment_status=FULFILLED"
        trigger: "POST /sales-orders/{id}/fulfill"
        actor: SalesAssociate
        preconditions:
          - "payment_status != VOIDED"
          - "every line's Product.status == ACTIVE (cross-entity: ERR_PRODUCT_DISCONTINUED)"
          - "for each PENDING line, Product.on_hand >= line qty (else ERR_INSUFFICIENT_STOCK)"
          - "expected_sales_order_version matches SalesOrder.version (else ERR_STALE_ORDER_VERSION)"
        side_effects:
          - "pricing_mode set FINAL; recompute total via calc order_total_final"
          - "CASCADE depth-3: each line -> status FULFILLED; that flips line -> debits Product.on_hand by qty; that on_hand change flips Product.reorder_needed when on_hand <= reorder_point (calc reorder_flag)"
          - "if contractor_account_id set: mint LoyaltyLedger ORDER_ACCRUAL with delta_points = floor(total_cents/100) (calc loyalty_accrual); set SalesOrder.points_accrued to that value; ContractorAccount.loyalty_points recomputed (derived)"
          - "increments SalesOrder.version by 1"
      - from: "fulfillment_status=PLACED"
        to: "fulfillment_status=CANCELLED"
        trigger: "POST /sales-orders/{id}/cancel"
        actor: SalesAssociate
        preconditions:
          - "payment_status == UNBILLED (a billed order cannot be cancelled: ERR_ORDER_ALREADY_BILLED)"
        side_effects:
          - "all lines -> status RESTOCKED (no on_hand change since PLACED never debited)"
          - "if contractor_account_id set: ContractorAccount.committed_cents recomputed (order no longer PLACED)"
          - "increments SalesOrder.version by 1"
      - from: "fulfillment_status=FULFILLED"
        to: "fulfillment_status=CANCELLED"
        trigger: "POST /sales-orders/{id}/cancel"
        actor: SalesAssociate
        preconditions:
          - "payment_status == UNBILLED (else ERR_ORDER_ALREADY_BILLED)"
        side_effects:
          - "COMPENSATION (inventory invariant): each FULFILLED line -> RESTOCKED; restores Product.on_hand by qty exactly; Product.reorder_needed recomputed"
          - "COMPENSATION (loyalty): if points were accrued, mint LoyaltyLedger ORDER_REVERSAL with delta_points = -points_accrued; ContractorAccount.loyalty_points recomputed; SalesOrder.points_accrued reset to 0"
          - "increments SalesOrder.version by 1"
      - from: "payment_status=UNBILLED"
        to: "payment_status=INVOICED"
        trigger: "POST /sales-orders/{id}/invoice"
        actor: AccountsManager
        preconditions:
          - "fulfillment_status == FULFILLED (cannot invoice an unfulfilled order: ERR_ORDER_NOT_FULFILLED)"
          - "contractor_account_id is set (cash sales are never invoiced: ERR_NOT_NET_TERM_ORDER)"
        side_effects:
          - "create Invoice with amount_cents = total_cents, due_at = clock now + net_terms_days, status ISSUED"
          - "CASCADE depth-2: Invoice ISSUED -> ContractorAccount.balance_cents recomputed (derived sum of ISSUED invoices)"
          - "increments SalesOrder.version by 1"
      - from: "payment_status=INVOICED"
        to: "payment_status=PAID"
        trigger: "POST /sales-orders/{id}/pay"
        actor: AccountsManager
        preconditions:
          - "an Invoice with status ISSUED exists for this order (else ERR_INVOICE_NOT_FOUND)"
        side_effects:
          - "Invoice.status -> PAID; ContractorAccount.balance_cents recomputed (invoice leaves the ISSUED sweep)"
          - "increments SalesOrder.version by 1"
      - from: "payment_status=INVOICED"
        to: "payment_status=VOIDED"
        trigger: "POST /sales-orders/{id}/void-invoice"
        actor: AccountsManager
        preconditions:
          - "an Invoice with status ISSUED exists for this order (else ERR_INVOICE_NOT_FOUND)"
        side_effects:
          - "COMPENSATION (money invariant): Invoice.status -> VOID; ContractorAccount.balance_cents recomputed back to pre-invoice value exactly"
          - "increments SalesOrder.version by 1"

  - entity: RentalAgreement
    initial_state: RESERVED
    terminal_states: [RETURNED, CANCELLED]
    transitions:
      - from: RESERVED
        to: CHECKED_OUT
        trigger: "POST /rental-agreements/{id}/check-out"
        actor: RentalClerk
        preconditions:
          - "RentalAsset.status == AVAILABLE (cross-entity: ERR_ASSET_UNAVAILABLE)"
          - "clock now >= start_at (else ERR_RENTAL_NOT_STARTED)"
        side_effects:
          - "RentalAsset.status -> RENTED (cross-entity)"
      - from: CHECKED_OUT
        to: RETURNED
        trigger: "POST /rental-agreements/{id}/return"
        actor: RentalClerk
        preconditions:
          - "returned_at (clock now) >= start_at"
        side_effects:
          - "set returned_at = clock now; compute rental_charge_cents (calc rental_charge over billed started days)"
          - "RentalAsset.status -> AVAILABLE (cross-entity, frees the interval)"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /rental-agreements/{id}/cancel"
        actor: RentalClerk
        preconditions:
          - "status == RESERVED (a checked-out rental cannot be cancelled: ERR_INVALID_STATE)"
        side_effects:
          - "frees the reserved [start_at, due_at) interval on the asset"

  - entity: ServiceTicket
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED]
    note: "Branching from BOOKED: start (->IN_PROGRESS) or cancel (->CANCELLED) with divergent side-effect sets."
    transitions:
      - from: BOOKED
        to: IN_PROGRESS
        trigger: "POST /service-tickets/{id}/start"
        actor: SalesAssociate
        preconditions:
          - "ServiceStation.status == ACTIVE (cross-entity: ERR_STATION_OFFLINE)"
          - "service_type != PROPANE_EXCHANGE OR cylinder_certified == true (safety: ERR_CYLINDER_NOT_CERTIFIED)"
        side_effects:
          - "compute fee_cents (calc service_fee)"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /service-tickets/{id}/complete"
        actor: SalesAssociate
        preconditions:
          - "status == IN_PROGRESS"
        side_effects:
          - "if contractor_account_id set: fee_cents contributes to a follow-on cash settlement (no balance impact; loyalty not minted for services)"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /service-tickets/{id}/cancel"
        actor: SalesAssociate
        preconditions:
          - "status == BOOKED"
        side_effects:
          - "frees the [scheduled_start - buffer, scheduled_end + buffer) reservation window on the station"

  - entity: SpecialOrder
    initial_state: DRAFT
    terminal_states: [RECEIVED, CANCELLED]
    note: "Cyclic — QUOTED <-> REVISION_REQUESTED revision loop before CONFIRMED."
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /special-orders/{id}/quote"
        actor: SalesAssociate
        preconditions:
          - "Vendor.status == ACTIVE AND Vendor.drop_ship_capable == true (cross-entity: ERR_VENDOR_NOT_DROP_SHIP)"
          - "quoted_unit_cents provided and >= 0"
        side_effects:
          - "store quoted_unit_cents"
      - from: QUOTED
        to: REVISION_REQUESTED
        trigger: "POST /special-orders/{id}/request-revision"
        actor: Contractor
        preconditions:
          - "status == QUOTED"
        side_effects:
          - "no charge yet"
      - from: REVISION_REQUESTED
        to: QUOTED
        trigger: "POST /special-orders/{id}/quote"
        actor: SalesAssociate
        preconditions:
          - "Vendor.status == ACTIVE AND Vendor.drop_ship_capable == true (ERR_VENDOR_NOT_DROP_SHIP)"
        side_effects:
          - "increment revision_count by 1; store new quoted_unit_cents"
      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /special-orders/{id}/confirm"
        actor: Contractor
        preconditions:
          - "ContractorAccount.status == ACTIVE (cross-entity: ERR_ACCOUNT_SUSPENDED)"
          - "balance_cents + confirmed_total projection <= credit_limit_cents (fiscal: ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "compute confirmed_total_cents (calc special_order_total)"
          - "CASCADE depth-2: SpecialOrder CONFIRMED -> create an Invoice (amount_cents = confirmed_total_cents, status ISSUED) -> ContractorAccount.balance_cents recomputed (derived)"
      - from: CONFIRMED
        to: RECEIVED
        trigger: "POST /special-orders/{id}/receive"
        actor: InventoryManager
        preconditions:
          - "status == CONFIRMED"
        side_effects:
          - "no inventory change (drop-ship goes direct to contractor)"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /special-orders/{id}/cancel"
        actor: Contractor
        preconditions:
          - "status in {DRAFT, QUOTED, REVISION_REQUESTED} (a CONFIRMED order cannot be cancelled: ERR_INVALID_STATE)"
        side_effects: []
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /special-orders/{id}/cancel"
        actor: Contractor
        preconditions:
          - "status in {DRAFT, QUOTED, REVISION_REQUESTED}"
        side_effects: []

  - entity: PurchaseOrder
    initial_state: DRAFT
    terminal_states: [RECEIVED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /purchase-orders/{id}/submit"
        actor: InventoryManager
        preconditions:
          - "Vendor.status == ACTIVE (cross-entity: ERR_VENDOR_INACTIVE)"
          - "lines is non-empty (else ERR_EMPTY_PURCHASE_ORDER)"
        side_effects:
          - "recompute gross_cents, coop_rebate_cents, net_cost_cents (calc coop_rebate)"
      - from: SUBMITTED
        to: RECEIVED
        trigger: "POST /purchase-orders/{id}/receive"
        actor: InventoryManager
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "for each line: Product.on_hand += qty; recompute Product.reorder_needed (calc reorder_flag) — restock may clear the flag"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /purchase-orders/{id}/cancel"
        actor: InventoryManager
        preconditions:
          - "status in {DRAFT, SUBMITTED}"
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: order-place-stale-version
    parent_entity: SalesOrder
    write_endpoint: "POST /sales-orders/{id}/place"
    occ_field: "expected_sales_order_version"
    description: |
      Placing a SalesOrder while carrying an expected_sales_order_version that is older than the
      order's current version is rejected. The version the client supplies must equal the version it
      last read on the order; a stale value (e.g. one captured before another writer advanced the
      order's lifecycle) means the placing client's credit-exposure projection was computed against an
      out-of-date view, so the place is refused.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

  - rule_id: order-fulfill-stale-version
    parent_entity: SalesOrder
    write_endpoint: "POST /sales-orders/{id}/fulfill"
    occ_field: "expected_sales_order_version"
    description: |
      Fulfilling a SalesOrder whose version has advanced since the client last read it is
      rejected. A prior mutation (e.g. the order was just placed, or another fulfill attempt
      already debited stock) advances the version, so the current writer's stock-availability
      view is stale and the fulfill is refused.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: line_total
    trigger: "On OrderLine create and on every order recompute (place, fulfill)"
    algorithm: tiered_pricing
    formula: |
      # Per-line charge, ROUNDED TO THE CENT AT THE LINE LEVEL (pinned order: round-per-line).
      # >= 3 inputs with conditional branch on Product.sell_mode (combinatorial mode (a)).
      if Product.sell_mode == EACH:
          raw_cents = Product.list_price_cents * qty            # qty is whole units
      else:  # BY_FOOT
          lumber_cents = Product.price_per_foot_cents * qty     # qty is linear feet (may be fractional)
          cut_cents    = Product.cut_fee_cents * cut_count
          raw_cents    = lumber_cents + cut_cents
      line_total_cents = round_half_up(raw_cents)               # round at the line, BEFORE the order sums lines
    input_set: "Single OrderLine plus its referenced Product."
    constants: {}
    precision: "integer cents, round_half_up at the LINE level (pinned: per-line rounding, then sum)"

  - name: reorder_flag
    trigger: "On every Product.on_hand change (product create, adjust-stock, order fulfill cascade, order cancel restock, PO receive)"
    algorithm: threshold
    formula: |
      # Inclusive boundary: reorder is needed when stock has fallen TO OR BELOW the reorder point.
      reorder_needed = (on_hand <= reorder_point)
    input_set: "Single Product's on_hand and reorder_point."
    constants: {}
    precision: "boolean; comparison is <= (inclusive at the reorder_point)"

  - name: order_total_provisional
    trigger: "POST /sales-orders/{id}/place (pricing_mode == PROVISIONAL)"
    algorithm: aggregation
    formula: |
      # subtotal = SUM over lines with status == PENDING of line_total_cents
      #   (each already rounded per line by `line_total` — combinatorial mode (b): per-line round THEN sum)
      subtotal_cents = sum(line.line_total_cents for line in order.lines if line.status == 'PENDING')
      loyalty_discount_cents = loyalty_discount(subtotal_cents, account)   # see calc loyalty_discount
      total_cents = max(0, subtotal_cents - loyalty_discount_cents)
    input_set: "OrderLines in status PENDING only (RESTOCKED/FULFILLED excluded). Provisional uses list/by-foot pricing."
    constants: {}
    precision: "integer cents; subtotal is an exact sum of already-rounded line totals"
    variants:
      - name: provisional
        when: "fulfillment_status in {DRAFT, PLACED}"
        difference: "Sums PENDING lines (the projected order). Loyalty discount estimated from PENDING subtotal."

  - name: order_total_final
    trigger: "POST /sales-orders/{id}/fulfill (pricing_mode flips to FINAL)"
    algorithm: aggregation
    formula: |
      # FINAL variant: subtotal = SUM over lines with status == FULFILLED of line_total_cents
      subtotal_cents = sum(line.line_total_cents for line in order.lines if line.status == 'FULFILLED')
      loyalty_discount_cents = loyalty_discount(subtotal_cents, account)
      total_cents = max(0, subtotal_cents - loyalty_discount_cents)
    input_set: "OrderLines in status FULFILLED only. Same per-line totals, but inclusion set differs (FULFILLED vs PENDING)."
    constants: {}
    precision: "integer cents"
    variants:
      - name: final
        when: "fulfillment_status == FULFILLED"
        difference: |
          DUAL-VARIANT vs order_total_provisional: identical line data can yield a different total when
          some lines never reach FULFILLED (e.g. a discontinued-product line dropped at fulfill), because
          the inclusion set is FULFILLED lines rather than PENDING lines.

  - name: loyalty_discount
    trigger: "Inside order_total_provisional / order_total_final and special_order_total"
    algorithm: threshold
    formula: |
      # CIRCULAR-LOOKING dependency pinned by evaluation order (combinatorial mode (c)):
      #   total = subtotal - loyalty_discount, BUT loyalty_discount's tier is keyed on the
      #   PRE-DISCOUNT subtotal_cents. Pinned order: tier is selected from subtotal_cents FIRST,
      #   discount computed, THEN subtracted. The discount NEVER re-tiers off the post-discount total.
      if account is None:                       # cash sale
          return 0
      if   subtotal_cents >= TIER2_MIN_CENTS:   # >= 100000  -> 5%
          rate = 0.05
      elif subtotal_cents >= TIER1_MIN_CENTS:   # >=  50000  -> 2%
          rate = 0.02
      else:
          rate = 0.0
      loyalty_discount_cents = round_half_up(subtotal_cents * rate)
    input_set: "subtotal_cents (pre-discount) of the order plus the owning ContractorAccount (None for cash)."
    constants:
      TIER1_MIN_CENTS: 50000
      TIER2_MIN_CENTS: 100000
      TIER1_RATE: 0.02
      TIER2_RATE: 0.05
    precision: "integer cents, round_half_up"

  - name: loyalty_accrual
    trigger: "POST /sales-orders/{id}/fulfill (account orders only)"
    algorithm: aggregation
    formula: |
      # 1 point per whole dollar of total_cents (drop fractional cents). Cash sales accrue 0.
      points = floor(total_cents / 100)
    input_set: "Fulfilled SalesOrder.total_cents (FINAL) for accounts; cash sales excluded."
    constants:
      POINTS_PER_DOLLAR: 1
    precision: "integer points (floor)"

  - name: rental_charge
    trigger: "POST /rental-agreements/{id}/return"
    algorithm: threshold
    formula: |
      # billed_days = number of distinct started UTC calendar days the asset was out.
      # Pinned: count each calendar date touched by [start_at, returned_at]; a same-day return
      # bills 1 day; crossing midnight bills 2; a zero-length window (returned_at == start_at) bills 1 (minimum).
      billed_days = max(1, (date(returned_at) - date(start_at)).days + 1)
      rental_charge_cents = RentalAsset.daily_rate_cents * billed_days
    input_set: "One RentalAgreement plus its RentalAsset daily_rate_cents."
    constants:
      MIN_BILLED_DAYS: 1
    precision: "integer cents (exact)"

  - name: service_fee
    trigger: "POST /service-tickets/{id}/start"
    algorithm: tiered_pricing
    formula: |
      base = SERVICE_BASE_CENTS[service_type]   # KEY_CUT=300, PAINT_MIX=800, PROPANE_EXCHANGE=2499
      fee_cents = base
    input_set: "ServiceTicket.service_type and the SERVICE_BASE_CENTS table."
    constants:
      KEY_CUT_CENTS: 300
      PAINT_MIX_CENTS: 800
      PROPANE_EXCHANGE_CENTS: 2499
    precision: "integer cents (exact)"

  - name: special_order_total
    trigger: "POST /special-orders/{id}/confirm"
    algorithm: tiered_pricing
    formula: |
      # >= 3 inputs, conditional surcharge branch (combinatorial mode (a) on a different entity).
      goods_cents = quoted_unit_cents * qty
      if goods_cents >= DROP_SHIP_FREE_THRESHOLD_CENTS:   # >= 50000 ships free
          surcharge_cents = 0
      else:
          surcharge_cents = DROP_SHIP_SURCHARGE_CENTS
      confirmed_total_cents = goods_cents + surcharge_cents
    input_set: "SpecialOrder.quoted_unit_cents, qty, drop-ship surcharge constants."
    constants:
      DROP_SHIP_SURCHARGE_CENTS: 1500
      DROP_SHIP_FREE_THRESHOLD_CENTS: 50000
    precision: "integer cents (exact)"

  - name: coop_rebate
    trigger: "POST /purchase-orders/{id}/submit"
    algorithm: threshold
    formula: |
      gross_cents = sum(line.qty * line.unit_cost_cents for line in po.lines)
      if gross_cents >= COOP_MIN_GROSS_CENTS:    # >= 200000 qualifies for co-op rebate
          coop_rebate_cents = round_half_up(gross_cents * Vendor.coop_rebate_pct)
      else:
          coop_rebate_cents = 0
      net_cost_cents = gross_cents - coop_rebate_cents
    input_set: "PurchaseOrder.lines and the Vendor.coop_rebate_pct."
    constants:
      COOP_MIN_GROSS_CENTS: 200000
    precision: "integer cents, round_half_up on the rebate"

  - name: account_credit_available
    trigger: "On read GET /contractor-accounts/{id}; and inside place/confirm credit checks"
    algorithm: aggregation
    formula: |
      # DUAL-VARIANT on ContractorAccount (different entity domain than order totals):
      #   settled_available  = credit_limit_cents - balance_cents
      #   committed_available = credit_limit_cents - committed_cents
      # where balance_cents = sum(Invoice.amount_cents where status == ISSUED)
      #       committed_cents = balance_cents + sum(SalesOrder.total_cents where fulfillment_status == PLACED and payment_status == UNBILLED)
      balance_cents   = sum(inv.amount_cents for inv in account.invoices if inv.status == 'ISSUED')
      committed_cents = balance_cents + sum(o.total_cents for o in account.orders
                                            if o.fulfillment_status == 'PLACED' and o.payment_status == 'UNBILLED')
      settled_available   = account.credit_limit_cents - balance_cents
      committed_available = account.credit_limit_cents - committed_cents
    input_set: "All Invoices (status ISSUED) and PLACED+UNBILLED SalesOrders for the account."
    constants: {}
    precision: "integer cents (exact)"
    variants:
      - name: settled
        when: "GET read / pay & invoice fiscal checks"
        difference: "Only ISSUED invoices count; uses balance_cents."
      - name: committed
        when: "place / confirm credit-limit precondition"
        difference: |
          DUAL-VARIANT: also counts PLACED-but-unbilled order totals as exposure, so committed_available
          can be strictly less than settled_available for identical account data — the place check uses
          the committed view, while pay-time fiscal checks use the settled view.

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for the operation per §1.7 RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path/body referenced resource exists (validated left-to-right in the path), e.g. SalesOrder, Product, Vendor, ContractorAccount, RentalAsset, ServiceStation"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body required fields present and well-typed; enum values legal; numeric ranges (qty > 0, cents >= 0) satisfied; pagination params in range (1 <= limit <= 100, offset >= 0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 5
    category: business_constraint
    check: "Product.sku unique; (aisle, bin) unique; RentalAsset.asset_tag unique on create"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /products, POST /rental-assets"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 7
    category: state
    check: "Order cannot be cancelled once billed (payment_status != UNBILLED)"
    error_id: ERR_ORDER_ALREADY_BILLED
    http_status: 409
    applies_to: "POST /sales-orders/{id}/cancel"

  - priority: 8
    category: state
    check: "Order must be FULFILLED before it can be invoiced"
    error_id: ERR_ORDER_NOT_FULFILLED
    http_status: 409
    applies_to: "POST /sales-orders/{id}/invoice"

  - priority: 9
    category: state
    check: "Service ticket may only start when its ServiceStation.status == ACTIVE (cross-entity state guard)"
    error_id: ERR_STATION_OFFLINE
    http_status: 409
    applies_to: "POST /service-tickets/{id}/start"

  - priority: 10
    category: business_constraint
    check: "Order has at least one PENDING line at place time"
    error_id: ERR_EMPTY_ORDER
    http_status: 409
    applies_to: "POST /sales-orders/{id}/place"

  - priority: 11
    category: business_safety
    check: "PROPANE_EXCHANGE ticket may only start when cylinder_certified == true"
    error_id: ERR_CYLINDER_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /service-tickets/{id}/start"

  - priority: 12
    category: business_referential
    check: "SpecialOrder quote vendor must be ACTIVE and drop_ship_capable -> ERR_VENDOR_NOT_DROP_SHIP. On PurchaseOrder submit, the PO vendor must be ACTIVE and every PO line's product must be supplied by that vendor -> ERR_VENDOR_INACTIVE. (Same business_referential priority; the endpoint determines which error_id applies.)"
    error_id: ERR_VENDOR_NOT_DROP_SHIP
    http_status: 409
    applies_to: "POST /special-orders/{id}/quote, POST /special-orders/{id}/confirm, POST /purchase-orders/{id}/submit"

  - priority: 13
    category: business_referential
    check: "Every order line's Product is ACTIVE when placing or fulfilling; a DISCONTINUED product blocks the transition"
    error_id: ERR_PRODUCT_DISCONTINUED
    http_status: 409
    applies_to: "POST /sales-orders/{id}/place, POST /sales-orders/{id}/fulfill"

  - priority: 14
    category: business_referential
    check: "Acting account (ContractorAccount) must be ACTIVE for new net-term orders / confirms"
    error_id: ERR_ACCOUNT_SUSPENDED
    http_status: 409
    applies_to: "POST /sales-orders/{id}/place, POST /special-orders/{id}/confirm"

  - priority: 15
    category: business_temporal
    check: "Requested RentalAgreement [start_at, due_at) does not overlap any non-terminal agreement on the same asset (half-open; back-to-back allowed)"
    error_id: ERR_RENTAL_OVERLAP
    http_status: 409
    applies_to: "POST /rental-agreements"

  - priority: 16
    category: business_temporal
    check: "Requested ServiceTicket window, expanded by station buffer_minutes on both ends, does not overlap any non-terminal ticket on the same station"
    error_id: ERR_STATION_BOOKING_CONFLICT
    http_status: 409
    applies_to: "POST /service-tickets"

  - priority: 17
    category: state
    check: "Fulfill requires Product.on_hand >= line qty for every PENDING line"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 409
    applies_to: "POST /sales-orders/{id}/fulfill"

  - priority: 18
    category: business_fiscal
    check: "Net-term order place / special-order confirm must not push committed exposure above credit_limit_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /sales-orders/{id}/place, POST /special-orders/{id}/confirm"

  - priority: 19
    category: state
    check: "OCC: expected_sales_order_version must equal current SalesOrder.version on place/fulfill"
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
    applies_to: "POST /sales-orders/{id}/place, POST /sales-orders/{id}/fulfill"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Vendor ---
  - method: POST
    path: "/vendors"
    description: "Create a vendor"
    roles: [InventoryManager]
    code: 201
    input: ["name", "drop_ship_capable?", "coop_rebate_pct?"]
    output: Vendor
    side_effects: ["Vendor created with status ACTIVE"]
  - method: GET
    path: "/vendors/{id}"
    description: "Fetch a vendor"
    roles: [InventoryManager, SalesAssociate, AccountsManager, RentalClerk]
    code: 200
    input: []
    output: Vendor
    side_effects: []
  - method: POST
    path: "/vendors/{id}/deactivate"
    description: "Set vendor status INACTIVE"
    roles: [InventoryManager]
    code: 200
    input: []
    output: Vendor
    side_effects: ["Vendor.status -> INACTIVE"]

  # --- Product ---
  - method: POST
    path: "/products"
    description: "Create a SKU at a bin/aisle"
    roles: [InventoryManager]
    code: 201
    input: ["sku", "vendor_id", "sell_mode", "aisle", "bin", "list_price_cents?", "price_per_foot_cents?", "cut_fee_cents?", "reorder_point", "reorder_qty"]
    output: Product
    side_effects: ["Product created status ACTIVE; on_hand 0; reorder_needed recomputed (calc reorder_flag)"]
  - method: GET
    path: "/products/{id}"
    description: "Fetch a product (includes on_hand, reorder_needed)"
    roles: [InventoryManager, SalesAssociate, AccountsManager, RentalClerk]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: GET
    path: "/products"
    description: "List/filter products (by vendor_id, reorder_needed, status)"
    roles: [InventoryManager, SalesAssociate]
    code: 200
    input: ["vendor_id?", "reorder_needed?", "status?", "limit?", "offset?"]
    output: Product[]
    side_effects: []
  - method: POST
    path: "/products/{id}/adjust-stock"
    description: "Manually set/adjust on_hand (receiving, shrink, audit)"
    roles: [InventoryManager]
    code: 200
    input: ["delta"]
    output: Product
    side_effects: ["Product.on_hand += delta (floored at 0); recompute reorder_needed (calc reorder_flag)"]
  - method: POST
    path: "/products/{id}/discontinue"
    description: "Set product status DISCONTINUED"
    roles: [InventoryManager]
    code: 200
    input: []
    output: Product
    side_effects: ["Product.status -> DISCONTINUED"]

  # --- ContractorAccount ---
  - method: POST
    path: "/contractor-accounts"
    description: "Open a contractor net-terms account"
    roles: [AccountsManager]
    code: 201
    input: ["business_name", "credit_limit_cents", "net_terms_days"]
    output: ContractorAccount
    side_effects: ["Account created status ACTIVE; balance_cents/committed_cents/loyalty_points 0"]
  - method: GET
    path: "/contractor-accounts/{id}"
    description: "Fetch account with derived balance_cents, committed_cents, loyalty_points"
    roles: [AccountsManager, SalesAssociate, Contractor]
    code: 200
    input: []
    output: ContractorAccount
    side_effects: ["recompute derived balance_cents/committed_cents/loyalty_points (calc account_credit_available)"]
  - method: POST
    path: "/contractor-accounts/{id}/suspend"
    description: "Suspend an account (blocks new net-term orders)"
    roles: [AccountsManager]
    code: 200
    input: []
    output: ContractorAccount
    side_effects: ["ContractorAccount.status -> SUSPENDED"]
  - method: GET
    path: "/contractor-accounts/{id}/loyalty-ledger"
    description: "List the account's loyalty ledger entries (reverse-reachability for LoyaltyLedger)"
    roles: [AccountsManager, Contractor]
    code: 200
    input: ["limit?", "offset?"]
    output: LoyaltyLedger[]
    side_effects: []
  - method: GET
    path: "/contractor-accounts/{id}/invoices"
    description: "List invoices billed to this account (reverse-reachability for Invoice by account)"
    roles: [AccountsManager, Contractor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  # --- SalesOrder + OrderLine ---
  - method: POST
    path: "/sales-orders"
    description: "Create a DRAFT sales order (cash or net-term)"
    roles: [SalesAssociate]
    code: 201
    input: ["contractor_account_id?"]
    output: SalesOrder
    side_effects: ["Order created fulfillment_status DRAFT, payment_status UNBILLED, pricing_mode PROVISIONAL"]
  - method: GET
    path: "/sales-orders/{id}"
    description: "Fetch a sales order with computed subtotal/total"
    roles: [SalesAssociate, AccountsManager, Contractor]
    code: 200
    input: []
    output: SalesOrder
    side_effects: []
  - method: GET
    path: "/sales-orders"
    description: "List/filter sales orders by contractor_account_id (reverse-reachability for SalesOrder by account)"
    roles: [SalesAssociate, AccountsManager, Contractor]
    code: 200
    input: ["contractor_account_id?", "fulfillment_status?", "payment_status?", "limit?", "offset?"]
    output: SalesOrder[]
    side_effects: []
  - method: POST
    path: "/sales-orders/{id}/lines"
    description: "Add an order line (product, qty, optional cut_count)"
    roles: [SalesAssociate]
    code: 201
    input: ["product_id", "qty", "cut_count?"]
    output: OrderLine
    side_effects: ["OrderLine created PENDING; compute line_total_cents (calc line_total); recompute order subtotal_cents/loyalty_discount_cents/total_cents (provisional). Does NOT change SalesOrder.version — only the state-transition action endpoints (place/fulfill/cancel/invoice/pay/void-invoice) bump version, so the version observed at order create remains valid through the first place."]
    note: "Only allowed while fulfillment_status == DRAFT (adding a line to a PLACED+ order is rejected ERR_INVALID_STATE)."
  - method: GET
    path: "/sales-orders/{id}/lines"
    description: "List the order's lines (reverse-reachability for OrderLine by sales_order_id)"
    roles: [SalesAssociate, AccountsManager, Contractor]
    code: 200
    input: ["limit?", "offset?"]
    output: OrderLine[]
    side_effects: []
  - method: GET
    path: "/order-lines/{id}"
    description: "Fetch a single order line"
    roles: [SalesAssociate, AccountsManager, Contractor]
    code: 200
    input: []
    output: OrderLine
    side_effects: []
  - method: GET
    path: "/order-lines"
    description: "List/filter order lines by product_id or sales_order_id (reverse-reachability for OrderLine by product)"
    roles: [SalesAssociate, AccountsManager, InventoryManager]
    code: 200
    input: ["product_id?", "sales_order_id?", "limit?", "offset?"]
    output: OrderLine[]
    side_effects: []
  - method: POST
    path: "/sales-orders/{id}/place"
    description: "Place a DRAFT order (locks credit exposure)"
    roles: [SalesAssociate]
    code: 200
    input: ["expected_sales_order_version"]
    output: SalesOrder
    side_effects: ["fulfillment_status DRAFT->PLACED; recompute total (calc order_total_provisional); increments SalesOrder.version by 1; ContractorAccount.committed_cents recomputed"]
  - method: POST
    path: "/sales-orders/{id}/fulfill"
    description: "Fulfill a PLACED order — debit stock, accrue loyalty"
    roles: [SalesAssociate]
    code: 200
    input: ["expected_sales_order_version"]
    output: SalesOrder
    side_effects: ["fulfillment_status PLACED->FULFILLED; pricing_mode FINAL; recompute total (calc order_total_final); cascade lines FULFILLED -> Product.on_hand debit -> Product.reorder_needed; mint LoyaltyLedger ORDER_ACCRUAL (calc loyalty_accrual); increments SalesOrder.version by 1"]
  - method: POST
    path: "/sales-orders/{id}/cancel"
    description: "Cancel a PLACED or FULFILLED unbilled order (compensating restock + loyalty reversal)"
    roles: [SalesAssociate]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["fulfillment_status -> CANCELLED; lines -> RESTOCKED; if FULFILLED restore Product.on_hand + reorder_needed; loyalty reversal entry; increments SalesOrder.version by 1"]
  - method: POST
    path: "/sales-orders/{id}/invoice"
    description: "Issue a net-term invoice for a fulfilled order"
    roles: [AccountsManager]
    code: 201
    input: []
    output: Invoice
    side_effects: ["payment_status UNBILLED->INVOICED; create Invoice ISSUED; ContractorAccount.balance_cents recomputed; increments SalesOrder.version by 1"]
  - method: POST
    path: "/sales-orders/{id}/pay"
    description: "Mark the order's issued invoice paid"
    roles: [AccountsManager]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["payment_status INVOICED->PAID; Invoice.status PAID; ContractorAccount.balance_cents recomputed; increments SalesOrder.version by 1"]
  - method: POST
    path: "/sales-orders/{id}/void-invoice"
    description: "Void the order's issued invoice (compensating money invariant)"
    roles: [AccountsManager]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["payment_status INVOICED->VOIDED; Invoice.status VOID; ContractorAccount.balance_cents restored exactly; increments SalesOrder.version by 1"]

  # --- Invoice ---
  - method: GET
    path: "/invoices/{id}"
    description: "Fetch an invoice"
    roles: [AccountsManager, Contractor]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/invoices"
    description: "List/filter invoices by sales_order_id (reverse-reachability for Invoice by order)"
    roles: [AccountsManager, Contractor]
    code: 200
    input: ["sales_order_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  # --- LoyaltyLedger ---
  - method: GET
    path: "/loyalty-ledger/{id}"
    description: "Fetch a single loyalty-ledger entry"
    roles: [AccountsManager, Contractor]
    code: 200
    input: []
    output: LoyaltyLedger
    side_effects: []
  - method: GET
    path: "/loyalty-ledger"
    description: "List/filter loyalty-ledger entries by contractor_account_id or sales_order_id (reverse-reachability for LoyaltyLedger by order)"
    roles: [AccountsManager, Contractor]
    code: 200
    input: ["contractor_account_id?", "sales_order_id?", "limit?", "offset?"]
    output: LoyaltyLedger[]
    side_effects: []

  # --- RentalAsset + RentalAgreement ---
  - method: POST
    path: "/rental-assets"
    description: "Register a rentable asset"
    roles: [RentalClerk, InventoryManager]
    code: 201
    input: ["asset_tag", "category", "daily_rate_cents", "deposit_cents"]
    output: RentalAsset
    side_effects: ["Asset created AVAILABLE"]
  - method: GET
    path: "/rental-assets/{id}"
    description: "Fetch a rental asset"
    roles: [RentalClerk, InventoryManager]
    code: 200
    input: []
    output: RentalAsset
    side_effects: []
  - method: POST
    path: "/rental-assets/{id}/set-maintenance"
    description: "Flag an asset for maintenance (blocks reservation)"
    roles: [RentalClerk, InventoryManager]
    code: 200
    input: ["maintenance"]
    output: RentalAsset
    side_effects: ["RentalAsset.status -> MAINTENANCE (or AVAILABLE when maintenance=false and not RENTED)"]
  - method: POST
    path: "/rental-agreements"
    description: "Reserve an asset for [start_at, due_at)"
    roles: [RentalClerk]
    code: 201
    input: ["rental_asset_id", "contractor_account_id?", "start_at", "due_at"]
    output: RentalAgreement
    side_effects: ["Agreement RESERVED; overlap-checked against the asset's non-terminal agreements"]
  - method: GET
    path: "/rental-agreements/{id}"
    description: "Fetch a rental agreement"
    roles: [RentalClerk, Contractor]
    code: 200
    input: []
    output: RentalAgreement
    side_effects: []
  - method: GET
    path: "/rental-agreements"
    description: "List/filter agreements by rental_asset_id or contractor_account_id (reverse-reachability)"
    roles: [RentalClerk, Contractor]
    code: 200
    input: ["rental_asset_id?", "contractor_account_id?", "limit?", "offset?"]
    output: RentalAgreement[]
    side_effects: []
  - method: POST
    path: "/rental-agreements/{id}/check-out"
    description: "Check out a reserved asset"
    roles: [RentalClerk]
    code: 200
    input: []
    output: RentalAgreement
    side_effects: ["RESERVED->CHECKED_OUT; RentalAsset.status RENTED"]
  - method: POST
    path: "/rental-agreements/{id}/return"
    description: "Return a checked-out asset; bill rental_charge"
    roles: [RentalClerk]
    code: 200
    input: []
    output: RentalAgreement
    side_effects: ["CHECKED_OUT->RETURNED; set returned_at; compute rental_charge_cents (calc rental_charge); RentalAsset.status AVAILABLE"]
  - method: POST
    path: "/rental-agreements/{id}/cancel"
    description: "Cancel a reservation before checkout"
    roles: [RentalClerk]
    code: 200
    input: []
    output: RentalAgreement
    side_effects: ["RESERVED->CANCELLED; frees interval"]

  # --- ServiceStation + ServiceTicket ---
  - method: POST
    path: "/service-stations"
    description: "Create a key-cut / paint-mix / propane service station"
    roles: [InventoryManager]
    code: 201
    input: ["name", "buffer_minutes?"]
    output: ServiceStation
    side_effects: ["Station created ACTIVE"]
  - method: GET
    path: "/service-stations/{id}"
    description: "Fetch a service station"
    roles: [InventoryManager, SalesAssociate]
    code: 200
    input: []
    output: ServiceStation
    side_effects: []
  - method: POST
    path: "/service-stations/{id}/set-offline"
    description: "Take a station offline / back online"
    roles: [InventoryManager]
    code: 200
    input: ["offline"]
    output: ServiceStation
    side_effects: ["ServiceStation.status -> OFFLINE (or ACTIVE when offline=false)"]
  - method: POST
    path: "/service-tickets"
    description: "Book a service ticket on a station"
    roles: [SalesAssociate]
    code: 201
    input: ["service_station_id", "contractor_account_id?", "service_type", "cylinder_certified?", "scheduled_start", "scheduled_end"]
    output: ServiceTicket
    side_effects: ["Ticket BOOKED; buffer-expanded overlap check on the station"]
  - method: GET
    path: "/service-tickets/{id}"
    description: "Fetch a service ticket"
    roles: [SalesAssociate, Contractor]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: []
  - method: GET
    path: "/service-tickets"
    description: "List/filter tickets by service_station_id or contractor_account_id (reverse-reachability)"
    roles: [SalesAssociate, Contractor]
    code: 200
    input: ["service_station_id?", "contractor_account_id?", "limit?", "offset?"]
    output: ServiceTicket[]
    side_effects: []
  - method: POST
    path: "/service-tickets/{id}/start"
    description: "Start service (safety check for propane)"
    roles: [SalesAssociate]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["BOOKED->IN_PROGRESS; compute fee_cents (calc service_fee)"]
  - method: POST
    path: "/service-tickets/{id}/complete"
    description: "Complete a service ticket"
    roles: [SalesAssociate]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["IN_PROGRESS->COMPLETED"]
  - method: POST
    path: "/service-tickets/{id}/cancel"
    description: "Cancel a booked ticket"
    roles: [SalesAssociate]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["BOOKED->CANCELLED; frees window"]

  # --- SpecialOrder ---
  - method: POST
    path: "/special-orders"
    description: "Open a drop-ship special order in DRAFT"
    roles: [SalesAssociate, Contractor]
    code: 201
    input: ["vendor_id", "contractor_account_id", "description", "qty"]
    output: SpecialOrder
    side_effects: ["SpecialOrder created DRAFT"]
  - method: GET
    path: "/special-orders/{id}"
    description: "Fetch a special order"
    roles: [SalesAssociate, Contractor, InventoryManager]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: []
  - method: GET
    path: "/special-orders"
    description: "List/filter special orders by vendor_id or contractor_account_id (reverse-reachability)"
    roles: [SalesAssociate, Contractor, InventoryManager]
    code: 200
    input: ["vendor_id?", "contractor_account_id?", "limit?", "offset?"]
    output: SpecialOrder[]
    side_effects: []
  - method: POST
    path: "/special-orders/{id}/quote"
    description: "Vendor quote (DRAFT or REVISION_REQUESTED -> QUOTED)"
    roles: [SalesAssociate]
    code: 200
    input: ["quoted_unit_cents"]
    output: SpecialOrder
    side_effects: ["-> QUOTED; if from REVISION_REQUESTED increment revision_count"]
  - method: POST
    path: "/special-orders/{id}/request-revision"
    description: "Contractor requests a re-quote (QUOTED -> REVISION_REQUESTED)"
    roles: [Contractor]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["QUOTED->REVISION_REQUESTED"]
  - method: POST
    path: "/special-orders/{id}/confirm"
    description: "Confirm a quote — locks total, bills the account"
    roles: [Contractor]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["QUOTED->CONFIRMED; compute confirmed_total_cents (calc special_order_total); create Invoice ISSUED; ContractorAccount.balance_cents recomputed"]
  - method: POST
    path: "/special-orders/{id}/receive"
    description: "Mark drop-ship received"
    roles: [InventoryManager]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["CONFIRMED->RECEIVED"]
  - method: POST
    path: "/special-orders/{id}/cancel"
    description: "Cancel a non-confirmed special order"
    roles: [Contractor]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["-> CANCELLED"]

  # --- PurchaseOrder (reorder / co-op buying) ---
  - method: POST
    path: "/purchase-orders"
    description: "Draft a reorder / co-op PO against a vendor"
    roles: [InventoryManager]
    code: 201
    input: ["vendor_id", "lines"]
    output: PurchaseOrder
    side_effects: ["PO created DRAFT"]
  - method: GET
    path: "/purchase-orders/{id}"
    description: "Fetch a purchase order with gross/rebate/net"
    roles: [InventoryManager]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: []
  - method: GET
    path: "/purchase-orders"
    description: "List/filter POs by vendor_id (reverse-reachability for PurchaseOrder)"
    roles: [InventoryManager]
    code: 200
    input: ["vendor_id?", "status?", "limit?", "offset?"]
    output: PurchaseOrder[]
    side_effects: []
  - method: POST
    path: "/purchase-orders/{id}/submit"
    description: "Submit a PO to the vendor (locks co-op rebate)"
    roles: [InventoryManager]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: ["DRAFT->SUBMITTED; compute gross/coop_rebate/net (calc coop_rebate)"]
  - method: POST
    path: "/purchase-orders/{id}/receive"
    description: "Receive a submitted PO — restock products"
    roles: [InventoryManager]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: ["SUBMITTED->RECEIVED; for each line Product.on_hand += qty; recompute Product.reorder_needed (calc reorder_flag)"]
  - method: POST
    path: "/purchase-orders/{id}/cancel"
    description: "Cancel a draft/submitted PO"
    roles: [InventoryManager]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: ["-> CANCELLED"]

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock for deterministic temporal rules. Server startup default is 2026-01-01T00:00:00Z; before any set_current_utc the clock reads exactly this default and never falls back to wall-clock time."
    roles: [InventoryManager, AccountsManager, RentalClerk, SalesAssociate]
    code: 200
    input: ["to_iso8601"]
    output: null
    side_effects: ["logical clock advanced to to_iso8601; affects rental day counting, invoice due dates, rental-start gating"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Acting role not permitted for the operation"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource does not exist"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing/malformed field, illegal enum, out-of-range number"
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "Product.sku, (aisle,bin), or RentalAsset.asset_tag already in use"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Transition not defined from the resource's current state"
  - id: ERR_ORDER_ALREADY_BILLED
    http: 409
    condition: "Cancel attempted on an order whose payment_status != UNBILLED"
  - id: ERR_ORDER_NOT_FULFILLED
    http: 409
    condition: "Invoice attempted before fulfillment_status == FULFILLED"
  - id: ERR_NOT_NET_TERM_ORDER
    http: 409
    condition: "Invoice attempted on a cash order (no contractor_account_id)"
  - id: ERR_EMPTY_ORDER
    http: 409
    condition: "Place attempted on an order with no PENDING lines"
  - id: ERR_CYLINDER_NOT_CERTIFIED
    http: 409
    condition: "PROPANE_EXCHANGE ticket started with cylinder_certified == false"
  - id: ERR_STATION_OFFLINE
    http: 409
    condition: "Service ticket started on an OFFLINE station"
  - id: ERR_VENDOR_NOT_DROP_SHIP
    http: 409
    condition: "Special order quoted against a vendor that is INACTIVE or not drop_ship_capable"
  - id: ERR_VENDOR_INACTIVE
    http: 409
    condition: "Purchase order submitted against an INACTIVE vendor, or a PO line product not supplied by the vendor"
  - id: ERR_PRODUCT_DISCONTINUED
    http: 409
    condition: "Place/fulfill blocked because a line's Product is DISCONTINUED"
  - id: ERR_ACCOUNT_SUSPENDED
    http: 409
    condition: "Net-term order placed / special order confirmed on a SUSPENDED account"
  - id: ERR_RENTAL_OVERLAP
    http: 409
    condition: "Requested rental interval overlaps an existing non-terminal agreement on the asset"
  - id: ERR_RENTAL_NOT_STARTED
    http: 409
    condition: "Check-out attempted before the clock reaches start_at"
  - id: ERR_ASSET_UNAVAILABLE
    http: 409
    condition: "Check-out attempted on an asset not in AVAILABLE status"
  - id: ERR_STATION_BOOKING_CONFLICT
    http: 409
    condition: "Requested service window (buffer-expanded) overlaps another ticket on the station"
  - id: ERR_INSUFFICIENT_STOCK
    http: 409
    condition: "Fulfill blocked because Product.on_hand < line qty"
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 409
    condition: "Place/confirm would push committed exposure above credit_limit_cents"
  - id: ERR_INVOICE_NOT_FOUND
    http: 409
    condition: "Pay/void attempted when no ISSUED invoice exists for the order"
  - id: ERR_EMPTY_PURCHASE_ORDER
    http: 409
    condition: "Submit attempted on a PO with no lines"
  - id: ERR_STALE_ORDER_VERSION
    http: 412
    condition: "OCC: expected_sales_order_version != current SalesOrder.version on place/fulfill"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SalesAssociate
    description: "Runs the front counter — builds and processes sales orders, books and runs service tickets, drafts special orders and vendor quotes"
    identity: "opaque"
    exclusive_operations:
      - "POST /sales-orders, /sales-orders/{id}/lines, /place, /fulfill, /cancel"
      - "POST /service-tickets, /start, /complete, /cancel (service)"
      - "POST /special-orders/{id}/quote"
    shared_operations:
      - "GET reads on products, orders, vendors, service stations, special orders"
      - "POST /special-orders (shared with Contractor)"

  - name: RentalClerk
    description: "Manages the tool-rental desk — assets and agreements"
    identity: "opaque"
    exclusive_operations:
      - "POST /rental-agreements, /check-out, /return, /cancel (rental)"
      - "POST /rental-assets/{id}/set-maintenance"
    shared_operations:
      - "POST /rental-assets (shared with InventoryManager)"
      - "GET reads on rental assets/agreements"

  - name: AccountsManager
    description: "Owns contractor accounts and net-term billing — invoicing, payments, voids, suspensions"
    identity: "opaque"
    exclusive_operations:
      - "POST /contractor-accounts, /suspend"
      - "POST /sales-orders/{id}/invoice, /pay, /void-invoice"
    shared_operations:
      - "GET reads on accounts, invoices, orders"

  - name: InventoryManager
    description: "Owns the catalog, vendors, stock, service stations, and reorder/co-op purchasing"
    identity: "opaque"
    exclusive_operations:
      - "POST /products, /adjust-stock, /discontinue"
      - "POST /vendors, /deactivate"
      - "POST /service-stations, /set-offline"
      - "POST /purchase-orders, /submit, /receive, /cancel (PO)"
      - "POST /special-orders/{id}/receive"
    shared_operations:
      - "POST /rental-assets (shared with RentalClerk)"
      - "GET reads on products, vendors, special orders, purchase orders"

  - name: Contractor
    description: "A net-terms account holder acting on their own special orders and viewing their own account"
    identity: "entity_backed:ContractorAccount"
    exclusive_operations:
      - "POST /special-orders/{id}/request-revision, /confirm, /cancel (special order)"
    shared_operations:
      - "POST /special-orders (shared with SalesAssociate)"
      - "GET reads on own account, invoices, loyalty-ledger, special orders, sales orders"
