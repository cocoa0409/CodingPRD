              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/confirm"
              as: CaseManager
              as_user_id: "${mgr1_id}"
          trigger:
            - call: "POST /cases/${case_id}/privacy"
              payload: { to_posture: "SEALED", reason: "court order" }
              as: CenterAdmin
            - call: "GET /referrals/${ref_id}"
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { ref_stat: $.data.status, ref_reason: $.data.suspension_reason }
