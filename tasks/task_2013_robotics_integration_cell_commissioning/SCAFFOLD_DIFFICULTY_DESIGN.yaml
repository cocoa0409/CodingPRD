              as_user_id: "${prog_id}"
              captures: { rel2_rev: $.data.release_revision, rel2_dev: $.data.dev_status, rel2_sim: $.data.sim_status }
          assert:
            - "rel1_rev == 1"
            - "rel2_rev == 2 (forward+rework+forward conserves cumulative release count)"
            - "CellProject.${proj_id}.rework_count == 1 (never reverted by the second release)"
            - "rel2_dev == RELEASED and rel2_sim == SIM_PASSED (sim axis untouched by rework)"
