# =============================================================================
# WIOA Workforce & Job-Training (One-Stop) — seed tables (Expert)
# =============================================================================

scenario: |
  WIOA Workforce & Job-Training (One-Stop): participant intake & eligibility,
  assessment & IEP/career plan, training-provider (ETPL) voucher (ITA),
  job-referral & placement, supportive-service payment, measurable-skill-gain &
  credential, employer & OJT contract, performance reporting.

domain_name: wioa-workforce-job-training
api_prefix: /wioa

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency        # OCC on LocalArea.version at ITA obligation
    - cascading_side_effects        # exit -> plan close -> voucher cancel -> fund release
    - dual_variant_calculation      # obligated-vs-expended; raw-vs-exclusion-adjusted rate
    - rate_threshold_triggers       # ITA cap, supportive cap, OJT reimbursement-rate ceilings

  entity_topology: flat
  # flat: peer entities under a single API root (/wioa) linked by explicit FKs;
  # no deep ownership nesting in URLs — every resource has a top-level collection.

  state_machine_shape: cyclic
  # CareerPlan is cyclic (ACTIVE <-> UNDER_REVISION revision loop); Participant
  # carries two independent parallel dimensions (eligibility_status x
  # enrollment_status) that advance on their own triggers.

  relationship_patterns:
    - one_to_many                   # LocalArea -> Participants; Participant -> Vouchers
    - cross_aggregate               # ITAVoucher references TrainingProgram + CareerPlan

  role_model: segregation_of_duties
  # CaseManager requests supportive-service payments; FiscalOfficer alone
  # approves/pays them. Peer split: StateAdmin owns ETPL; BusinessServicesRep
  # owns employers/OJT/referrals; CaseManager owns participant/plan/voucher.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: LocalArea
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Local workforce area name" }
      - { name: program_year, type: integer, source: input, description: "PY (e.g., 2026)" }
      - { name: ita_budget_total_cents, type: integer, source: input, description: "Total Individual Training Account budget for the PY (immutable ceiling)" }
      - { name: ita_individual_cap_cents, type: integer, source: input, description: "Per-voucher ITA authorization ceiling policy" }
      - { name: supportive_annual_cap_cents, type: integer, source: input, description: "Per-participant annual supportive-service ceiling policy" }
      - { name: ita_budget_available_cents, type: integer, source: system, default: 0, description: "Unobligated, unspent ITA dollars (initialized to ita_budget_total_cents)" }
      - { name: ita_budget_obligated_cents, type: integer, source: system, default: 0, description: "ITA dollars committed to OBLIGATED vouchers but not yet expended" }
      - { name: ita_budget_expended_cents, type: integer, source: system, default: 0, description: "ITA dollars actually disbursed" }

  - name: Participant
    parent: null
    common_fields: true
    fields:
      - { name: local_area_id, type: string, source: system, description: "FK -> LocalArea.id; owning local workforce area" }
      - { name: full_name, type: string, source: input, description: "Participant full name" }
      - { name: funding_stream, type: enum, source: input, description: "ADULT | DISLOCATED_WORKER | YOUTH" }
      - { name: veteran, type: boolean, source: input, default: false, description: "Veteran status (priority of service)" }
      - { name: low_income, type: boolean, source: input, default: false, description: "Low-income status (priority of service)" }
      - { name: basic_skills_deficient, type: boolean, source: input, default: false, description: "Basic-skills-deficient flag captured at intake assessment" }
      - { name: priority_of_service, type: enum, source: computed, description: "PRIORITY | NON_PRIORITY — derived at intake (see calc priority_of_service)" }
      - { name: eligibility_status, type: enum, source: system, default: "PENDING", description: "PENDING | ELIGIBLE | INELIGIBLE (parallel dimension 1)" }
      - { name: enrollment_status, type: enum, source: system, default: "NOT_ENROLLED", description: "NOT_ENROLLED | ENROLLED | EXITED (parallel dimension 2)" }
      - { name: exit_date, type: datetime, source: system, default: null, description: "Logical-clock timestamp set on exit" }
      - { name: exit_exclusion, type: boolean, source: system, default: false, description: "WIOA performance exclusion recorded at exit (removes participant from adjusted denominators)" }
      - { name: supportive_available_cents, type: integer, source: system, default: 0, description: "Unobligated supportive dollars (initialized to LocalArea.supportive_annual_cap_cents)" }
      - { name: supportive_obligated_cents, type: integer, source: system, default: 0, description: "Supportive dollars committed to APPROVED payments not yet paid" }
      - { name: supportive_expended_cents, type: integer, source: system, default: 0, description: "Supportive dollars actually paid" }
      - { name: credential_attained, type: boolean, source: system, default: false, description: "Set true when a linked ITAVoucher completes with credential_earned=true" }
      - { name: msg_attained, type: boolean, source: system, default: false, description: "Measurable skill gain recorded (set on ITAVoucher completion)" }

  - name: CareerPlan
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id; the plan owner" }
      - { name: goal_occupation, type: string, source: input, description: "Target occupation / SOC goal" }
      - { name: service_track, type: enum, source: input, description: "TRAINING | JOB_READY | OJT" }
      - { name: supportive_need_documented, type: boolean, source: input, default: false, description: "Whether a supportive-service need is documented in the plan" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Number of completed revision cycles" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | ACTIVE | UNDER_REVISION | CLOSED (cyclic ACTIVE<->UNDER_REVISION)" }

  - name: TrainingProvider
    parent: null
    common_fields: true
    fields:
      - { name: local_area_id, type: string, source: system, description: "FK -> LocalArea.id; area that maintains this ETPL listing" }
      - { name: name, type: string, source: input, description: "Provider name" }
      - { name: etpl_status, type: enum, source: system, default: "APPLIED", description: "APPLIED | ELIGIBLE | SUSPENDED" }

  - name: TrainingProgram
    parent: null
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: system, description: "FK -> TrainingProvider.id; offering provider" }
      - { name: name, type: string, source: input, description: "Program name" }
      - { name: cip_code, type: string, source: input, description: "Classification of Instructional Programs code" }
      - { name: total_cost_cents, type: integer, source: input, description: "Full program cost" }
      - { name: credential_type, type: enum, source: input, description: "DEGREE | CERTIFICATE | LICENSE | NONE" }
      - { name: in_demand, type: boolean, source: input, default: true, description: "On the local in-demand occupation list" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED — mirrors provider suspension cascade" }

  - name: ITAVoucher
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id; voucher holder" }
      - { name: program_id, type: string, source: input, description: "FK -> TrainingProgram.id; the ETPL program funded" }
      - { name: career_plan_id, type: string, source: input, description: "FK -> CareerPlan.id; plan authorizing the training" }
      - { name: authorized_cost_cents, type: integer, source: input, description: "ITA amount to obligate (<= program cost and <= ita_individual_cap_cents)" }
      - { name: planned_start_date, type: datetime, source: input, description: "Planned training start (half-open interval start)" }
      - { name: planned_end_date, type: datetime, source: input, description: "Planned training end (half-open interval end, exclusive)" }
      - { name: amount_obligated_cents, type: integer, source: system, default: 0, description: "Forward-looking commitment = authorized_cost_cents at obligation" }
      - { name: amount_expended_cents, type: integer, source: system, default: 0, description: "Chronological running sum of posted ITADisbursement.amount_cents" }
      - { name: credential_earned, type: boolean, source: system, default: false, description: "Set at completion" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | OBLIGATED | COMPLETED | CANCELLED" }

  - name: ITADisbursement
    parent: null
    common_fields: false
    fields:
      - { name: voucher_id, type: string, source: system, description: "FK -> ITAVoucher.id; parent voucher" }
      - { name: amount_cents, type: integer, source: input, description: "Disbursed amount (must be > 0)" }
      - { name: note, type: string, source: input, default: null, description: "Optional memo" }

  - name: SupportiveServicePayment
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id; recipient" }
      - { name: service_type, type: enum, source: input, description: "MILEAGE | CHILDCARE | TOOLS | OTHER" }
      - { name: amount_cents, type: integer, source: input, default: null, description: "Requested amount for non-MILEAGE types (must be > 0 when provided)" }
      - { name: trips, type: array, source: input, default: null, description: "For MILEAGE: array of per-trip mileage (whole miles > 0); computed_amount derived via mileage_reimbursement" }
      - { name: computed_amount_cents, type: integer, source: computed, description: "Final obligation amount (mileage: per-trip rounded then summed; else amount_cents)" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED | APPROVED | PAID | VOIDED" }

  - name: Employer
    parent: null
    common_fields: true
    fields:
      - { name: local_area_id, type: string, source: system, description: "FK -> LocalArea.id; partnering area" }
      - { name: name, type: string, source: input, description: "Employer name" }
      - { name: size, type: enum, source: input, description: "SMALL | LARGE — SMALL (<50 employees) permits OJT reimbursement up to 75%" }
      - { name: max_concurrent_ojt_slots, type: integer, source: input, description: "Aggregate cap on simultaneously ACTIVE OJT contract periods" }

  - name: OJTContract
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: system, description: "FK -> Employer.id; contracting employer" }
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; OJT trainee" }
      - { name: reimbursement_rate, type: number, source: input, description: "Fraction of wages reimbursed (0 < rate <= size ceiling: SMALL 0.75, LARGE 0.50)" }
      - { name: wage_cents_per_hour, type: integer, source: input, description: "Trainee hourly wage in cents" }
      - { name: planned_hours, type: integer, source: input, description: "Planned OJT hours" }
      - { name: obligated_amount_cents, type: integer, source: input, description: "Total OJT reimbursement obligation ceiling" }
      - { name: amount_expended_cents, type: integer, source: system, default: 0, description: "Running sum of reimbursements paid" }
      - { name: start_date, type: datetime, source: input, description: "Contract period start (half-open interval start)" }
      - { name: end_date, type: datetime, source: input, description: "Contract period end (half-open interval end, exclusive)" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | ACTIVE | COMPLETED | TERMINATED" }

  - name: JobReferral
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id; referred jobseeker" }
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id; hiring employer" }
      - { name: job_title, type: string, source: input, description: "Referred job title" }
      - { name: offered_wage_cents_per_hour, type: integer, source: input, default: null, description: "Advertised wage (optional)" }
      - { name: placement_wage_cents_per_hour, type: integer, source: system, default: null, description: "Confirmed placement wage (set on place)" }
      - { name: placement_date, type: datetime, source: system, default: null, description: "Logical-clock timestamp set on placement" }
      - { name: status, type: enum, source: system, default: "REFERRED", description: "REFERRED | PLACED | REJECTED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Participant
    initial_state: "eligibility_status=PENDING, enrollment_status=NOT_ENROLLED"
    terminal_states: [INELIGIBLE, EXITED]
    note: "Two independent parallel dimensions on one row: eligibility_status and enrollment_status."
    transitions:
      - from: "eligibility_status=PENDING"
        to: "eligibility_status=ELIGIBLE"
        trigger: "POST /wioa/participants/{id}/determine-eligibility {decision: ELIGIBLE}"
        actor: CaseManager
        preconditions: ["eligibility_status == PENDING (else ERR_INVALID_STATE)"]
        side_effects: ["priority_of_service already computed at intake; no further change"]

      - from: "eligibility_status=PENDING"
        to: "eligibility_status=INELIGIBLE"
        trigger: "POST /wioa/participants/{id}/determine-eligibility {decision: INELIGIBLE}"
        actor: CaseManager
        preconditions: ["eligibility_status == PENDING (else ERR_INVALID_STATE)"]
        side_effects: []

      - from: "enrollment_status=NOT_ENROLLED"
        to: "enrollment_status=ENROLLED"
        trigger: "POST /wioa/participants/{id}/enroll"
        actor: CaseManager
        preconditions:
          - "eligibility_status == ELIGIBLE (cross-dimension guard; else ERR_PARTICIPANT_NOT_ELIGIBLE)"
          - "enrollment_status == NOT_ENROLLED (else ERR_INVALID_STATE)"
        side_effects: []

      - from: "enrollment_status=ENROLLED"
        to: "enrollment_status=EXITED"
        trigger: "POST /wioa/participants/{id}/exit"
        actor: CaseManager
        preconditions: ["enrollment_status == ENROLLED (else ERR_INVALID_STATE)"]
        side_effects:
          - "set exit_date = current logical clock; set exit_exclusion = request exit_exclusion (default false)"
          - "CASCADE hop 1: every CareerPlan of this participant in {ACTIVE, UNDER_REVISION} transitions to CLOSED"
          - "(fan-out, not part of the counted chain) every SupportiveServicePayment in {REQUESTED, APPROVED} transitions to VOIDED, restoring supportive_available_cents"

  - entity: CareerPlan
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /wioa/career-plans/{id}/activate"
        actor: CaseManager
        preconditions:
          - "status == DRAFT (else ERR_INVALID_STATE)"
          - "participant.eligibility_status == ELIGIBLE (else ERR_PARTICIPANT_NOT_ELIGIBLE)"
        side_effects: []

      - from: ACTIVE
        to: UNDER_REVISION
        trigger: "POST /wioa/career-plans/{id}/request-revision"
        actor: CaseManager
        preconditions: ["status == ACTIVE (else ERR_INVALID_STATE)"]
        side_effects: []

      - from: UNDER_REVISION
        to: ACTIVE
        trigger: "POST /wioa/career-plans/{id}/approve-revision"
        actor: CaseManager
        preconditions: ["status == UNDER_REVISION (else ERR_INVALID_STATE)"]
        side_effects: ["revision_count += 1"]
        note: "Cyclic: ACTIVE -> UNDER_REVISION -> ACTIVE may repeat any number of times."

      - from: ACTIVE
        to: CLOSED
        trigger: "system (Participant exit cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE hop 2: every ITAVoucher of the participant that references this plan and is OBLIGATED transitions to CANCELLED"

      - from: UNDER_REVISION
        to: CLOSED
        trigger: "system (Participant exit cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE hop 2: every OBLIGATED ITAVoucher referencing this plan transitions to CANCELLED"

  - entity: TrainingProvider
    initial_state: APPLIED
    terminal_states: [SUSPENDED]
    transitions:
      - from: APPLIED
        to: ELIGIBLE
        trigger: "POST /wioa/training-providers/{id}/approve"
        actor: StateAdmin
        preconditions: ["etpl_status == APPLIED (else ERR_INVALID_STATE)"]
        side_effects: []

      - from: ELIGIBLE
        to: SUSPENDED
        trigger: "POST /wioa/training-providers/{id}/suspend"
        actor: StateAdmin
        preconditions: ["etpl_status == ELIGIBLE (else ERR_INVALID_STATE)"]
        side_effects:
          - "CASCADE hop 1: every TrainingProgram of this provider transitions ACTIVE -> SUSPENDED"

  - entity: TrainingProgram
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (TrainingProvider suspend cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE hop 2: every ITAVoucher referencing this program that is DRAFT transitions to CANCELLED"

  - entity: ITAVoucher
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OBLIGATED
        trigger: "POST /wioa/ita-vouchers/{id}/obligate"
        actor: CaseManager
        preconditions:
          - "status == DRAFT (else ERR_INVALID_STATE)"
          - "participant.enrollment_status == ENROLLED (else ERR_PARTICIPANT_NOT_ENROLLED)"
          - "referenced CareerPlan.status == ACTIVE (else ERR_NO_ACTIVE_CAREER_PLAN)"
          - "referenced TrainingProgram.status == ACTIVE (else ERR_PROGRAM_NOT_ELIGIBLE)"
          - "no other OBLIGATED ITAVoucher of this participant has a training period overlapping [planned_start_date, planned_end_date) (else ERR_TRAINING_PERIOD_OVERLAP)"
          - "authorized_cost_cents <= ita_individual_cap_cents (else ERR_ITA_CAP_EXCEEDED)"
          - "authorized_cost_cents <= LocalArea.ita_budget_available_cents (else ERR_ITA_BUDGET_EXCEEDED)"
          - "expected_local_area_version == LocalArea.version (else ERR_STALE_LOCAL_AREA_VERSION, checked last)"
        side_effects:
          - "amount_obligated_cents = authorized_cost_cents"
          - "LocalArea.ita_budget_available_cents -= authorized_cost_cents; LocalArea.ita_budget_obligated_cents += authorized_cost_cents"
          - "increments LocalArea.version by 1"

      - from: OBLIGATED
        to: COMPLETED
        trigger: "POST /wioa/ita-vouchers/{id}/complete {credential_earned}"
        actor: CaseManager
        preconditions: ["status == OBLIGATED (else ERR_INVALID_STATE)"]
        side_effects:
          - "credential_earned = request credential_earned"
          - "release remainder R = amount_obligated_cents - amount_expended_cents: LocalArea.ita_budget_obligated_cents -= R; LocalArea.ita_budget_available_cents += R; increments LocalArea.version by 1"
          - "participant.credential_attained = credential_earned; participant.msg_attained = true"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /wioa/ita-vouchers/{id}/cancel OR system (TrainingProgram suspend cascade)"
        actor: CaseManager | system
        preconditions: ["status == DRAFT (else ERR_INVALID_STATE)"]
        side_effects: ["no fund movement (DRAFT vouchers hold no obligation)"]

      - from: OBLIGATED
        to: CANCELLED
        trigger: "POST /wioa/ita-vouchers/{id}/cancel OR system (CareerPlan close cascade)"
        actor: CaseManager | system
        preconditions: ["status == OBLIGATED (else ERR_INVALID_STATE)"]
        side_effects:
          - "CASCADE hop 3: release remainder R = amount_obligated_cents - amount_expended_cents: LocalArea.ita_budget_obligated_cents -= R; LocalArea.ita_budget_available_cents += R; increments LocalArea.version by 1"

  - entity: SupportiveServicePayment
    initial_state: REQUESTED
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /wioa/supportive-services/{id}/approve"
        actor: FiscalOfficer
        preconditions:
          - "status == REQUESTED (else ERR_INVALID_STATE)"
          - "participant has a CareerPlan in status ACTIVE with supportive_need_documented == true (else ERR_NO_ACTIVE_CAREER_PLAN)"
          - "computed_amount_cents <= participant.supportive_available_cents (else ERR_SUPPORTIVE_CAP_EXCEEDED)"
        side_effects:
          - "participant.supportive_available_cents -= computed_amount_cents; participant.supportive_obligated_cents += computed_amount_cents"

      - from: APPROVED
        to: PAID
        trigger: "POST /wioa/supportive-services/{id}/pay"
        actor: FiscalOfficer
        preconditions: ["status == APPROVED (else ERR_INVALID_STATE)"]
        side_effects:
          - "participant.supportive_obligated_cents -= computed_amount_cents; participant.supportive_expended_cents += computed_amount_cents"

      - from: REQUESTED
        to: VOIDED
        trigger: "POST /wioa/supportive-services/{id}/void OR system (participant exit)"
        actor: FiscalOfficer | system
        preconditions: ["status == REQUESTED (else ERR_INVALID_STATE)"]
        side_effects: ["no fund movement (REQUESTED holds no obligation)"]

      - from: APPROVED
        to: VOIDED
        trigger: "POST /wioa/supportive-services/{id}/void OR system (participant exit)"
        actor: FiscalOfficer | system
        preconditions: ["status == APPROVED (else ERR_INVALID_STATE)"]
        side_effects:
          - "COMPENSATION: participant.supportive_obligated_cents -= computed_amount_cents; participant.supportive_available_cents += computed_amount_cents"

  - entity: OJTContract
    initial_state: DRAFT
    terminal_states: [COMPLETED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /wioa/ojt-contracts/{id}/activate"
        actor: BusinessServicesRep
        preconditions:
          - "status == DRAFT (else ERR_INVALID_STATE)"
          - "participant.eligibility_status == ELIGIBLE AND participant.enrollment_status == ENROLLED (else ERR_PARTICIPANT_NOT_ELIGIBLE)"
          - "count of employer's OJT contracts already ACTIVE whose [start_date,end_date) overlaps this contract's [start_date,end_date) is < employer.max_concurrent_ojt_slots (else ERR_OJT_CAPACITY_EXCEEDED)"
        side_effects: []

      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /wioa/ojt-contracts/{id}/complete"
        actor: BusinessServicesRep
        preconditions: ["status == ACTIVE (else ERR_INVALID_STATE)"]
        side_effects: []

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /wioa/ojt-contracts/{id}/terminate"
        actor: BusinessServicesRep
        preconditions: ["status == ACTIVE (else ERR_INVALID_STATE)"]
        side_effects: []

  - entity: JobReferral
    initial_state: REFERRED
    terminal_states: [PLACED, REJECTED]
    transitions:
      - from: REFERRED
        to: PLACED
        trigger: "POST /wioa/job-referrals/{id}/place {placement_wage_cents_per_hour}"
        actor: BusinessServicesRep
        preconditions:
          - "status == REFERRED (else ERR_INVALID_STATE)"
          - "participant.enrollment_status IN {ENROLLED, EXITED} (else ERR_PARTICIPANT_NOT_ENROLLED)"
        side_effects: ["placement_wage_cents_per_hour set; placement_date = current logical clock"]

      - from: REFERRED
        to: REJECTED
        trigger: "POST /wioa/job-referrals/{id}/reject"
        actor: BusinessServicesRep
        preconditions: ["status == REFERRED (else ERR_INVALID_STATE)"]
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: ita-obligate-stale-local-area
    parent_entity: LocalArea
    write_endpoint: "POST /wioa/ita-vouchers/{id}/obligate"
    occ_field: "expected_local_area_version"
    description: |
      Obligating an ITAVoucher draws its authorized_cost_cents down from the
      shared LocalArea ITA budget. A client that obligates against a
      LocalArea whose version has advanced since it last read the budget is
      rejected: another voucher obligation has already drawn the pool down, so
      the client's view of ita_budget_available_cents is stale. This is a true
      create-with-draw race — the second obligation targets a different DRAFT
      voucher whose own state is valid and whose authorized cost still fits the
      pre-draw budget, so absent OCC it would legitimately succeed.
    error_id: ERR_STALE_LOCAL_AREA_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: priority_of_service
    trigger: "participant intake"
    algorithm: derived
    formula: |
      if funding_stream == ADULT and (veteran or low_income or basic_skills_deficient):
        PRIORITY
      elif veteran:
        PRIORITY            # veterans receive priority of service across streams
      else:
        NON_PRIORITY
    input_set: "single Participant's intake fields"
    precision: "n/a (enum)"

  - name: ita_voucher_ledger
    trigger: "ITAVoucher obligate / disburse"
    algorithm: aggregation
    formula: |
      # DUAL-VARIANT on the SAME voucher, two different algorithms:
      amount_obligated_cents (forward_looking) = authorized_cost_cents, fixed at obligation
      amount_expended_cents (chronological)    = running sum over ITADisbursement rows
                                                  of this voucher in creation order
      # These diverge whenever the voucher is not yet fully disbursed.
    input_set: "one ITAVoucher and its ITADisbursement children (all rows, creation order)"
    constants: {}
    precision: "integer cents"
    variants:
      - name: obligated_forward_looking
        when: "at and after obligation"
        difference: "commits the full authorized_cost_cents up front regardless of what is later disbursed"
      - name: expended_chronological
        when: "as disbursements post"
        difference: "accumulates only actually-posted disbursement amounts in creation order"

  - name: ojt_reimbursement
    trigger: "POST /wioa/ojt-contracts/{id}/reimburse"
    algorithm: threshold
    formula: |
      # mode (a): >=3 inputs, conditional rate ceiling, nested min
      rate  = contract.reimbursement_rate          # validated <= size ceiling at create
      gross = round_half_up(rate * wage_cents_per_hour * hours_worked)
      remaining = contract.obligated_amount_cents - contract.amount_expended_cents
      reimbursement_cents = min(gross, remaining)
      contract.amount_expended_cents += reimbursement_cents
    input_set: "one OJTContract; hours_worked from the request"
    constants:
      SMALL_EMPLOYER_RATE_CEILING: 0.75
      LARGE_EMPLOYER_RATE_CEILING: 0.50
    precision: "round_half_up to whole cents on the gross term, before the min"

  - name: mileage_reimbursement
    trigger: "SupportiveServicePayment create (service_type == MILEAGE)"
    algorithm: aggregation
    formula: |
      # mode (b): rounding order is pinned — round EACH trip, THEN sum
      computed_amount_cents = sum over trips of round_half_up(miles_i * MILEAGE_RATE_CENTS_PER_MILE)
      # NOT round_half_up( sum(miles_i) * rate ) — the two orders differ (e.g. trips [5,5,5]
      # give 328+328+328 = 984, whereas sum-then-round gives round(982.5) = 983).
    input_set: "the trips array on one SupportiveServicePayment"
    constants:
      MILEAGE_RATE_CENTS_PER_MILE: 65.5
    precision: "round_half_up per trip, then integer-sum"

  - name: supportive_amount
    trigger: "SupportiveServicePayment create (non-MILEAGE)"
    algorithm: derived
    formula: |
      computed_amount_cents = amount_cents        # for CHILDCARE | TOOLS | OTHER
    input_set: "one SupportiveServicePayment"
    precision: "integer cents"

  - name: ita_budget_conservation
    trigger: "any ITAVoucher obligate/disburse/complete/cancel"
    algorithm: aggregation
    formula: |
      INVARIANT (conserved quantity = ITA training dollars):
        ita_budget_available_cents + ita_budget_obligated_cents + ita_budget_expended_cents
          == ita_budget_total_cents      # holds after every transition
      A forward obligate (available -= C, obligated += C) paired with its compensating
      cancel of a never-disbursed voucher (obligated -= C, available += C) restores
      ita_budget_available_cents to its pre-obligation value with zero drift.
    input_set: "one LocalArea and all its ITAVouchers/ITADisbursements"
    precision: "integer cents"

  - name: supportive_budget_conservation
    trigger: "any SupportiveServicePayment approve/pay/void"
    algorithm: aggregation
    formula: |
      INVARIANT (conserved quantity = supportive-service dollars, distinct pool):
        supportive_available_cents + supportive_obligated_cents + supportive_expended_cents
          == supportive_annual_cap_cents (the participant's initialized cap)
      A forward approve (available -= A, obligated += A) paired with its compensating void
      from APPROVED (obligated -= A, available += A) restores supportive_available_cents
      with zero drift.
    input_set: "one Participant and all its SupportiveServicePayments"
    precision: "integer cents"

  - name: performance_summary
    trigger: "GET /wioa/local-areas/{id}/performance-summary"
    algorithm: aggregation
    formula: |
      exiters        = Participants of this LocalArea with enrollment_status == EXITED
      exiter_count   = count(exiters)
      excluded       = exiters with exit_exclusion == true
      excluded_count = count(excluded)
      included       = exiters with exit_exclusion == false
      included_count = count(included)
      credential_count = count(included with credential_attained == true)
      placement_count  = count(included that have a JobReferral in status PLACED)
      # DUAL-VARIANT on the credential metric (two denominators):
      raw_credential_rate      = credential_count / exiter_count      (raw denominator)
      adjusted_credential_rate = credential_count / included_count    (exclusion-adjusted)
      placement_rate           = placement_count / included_count
      # Empty-set rule: when a denominator is 0, the rate is 0.0 (never divide by zero).
    input_set: "all EXITED Participants of the LocalArea and their JobReferrals"
    constants: {}
    precision: "rate rounded to 4 decimal places, round_half_up; 0.0 when denominator == 0"

  - name: training_period_overlap
    trigger: "ITAVoucher obligate (temporal precondition)"
    algorithm: interval_merge
    formula: |
      Reject obligation when this voucher's [planned_start_date, planned_end_date)
      intersects the half-open period of ANY already-OBLIGATED voucher of the SAME
      participant. Half-open semantics: back-to-back periods where one ends exactly
      when the next begins (end == start) do NOT overlap and are allowed.
      Overlap condition: a.start < b.end AND b.start < a.end.
    input_set: "the OBLIGATED ITAVouchers of one participant (the resource = participant training timeline)"
    precision: "n/a"

  - name: ojt_slot_capacity
    trigger: "OJTContract activate (temporal precondition)"
    algorithm: interval_merge
    formula: |
      Reject activation when, counting all of the EMPLOYER's currently-ACTIVE OJT
      contracts whose [start_date,end_date) intersects this contract's period, the
      number that overlap is >= employer.max_concurrent_ojt_slots. Aggregate-capacity
      semantics (interval stabbing): this is a count of simultaneous occupations, not a
      pairwise ban — up to max_concurrent_ojt_slots periods may overlap. Half-open;
      adjacency (end == start) is not an overlap.
    input_set: "the ACTIVE OJTContracts of one employer (the resource = employer OJT capacity)"
    precision: "n/a"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "Path and referenced FK resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: business_constraint
    check: "Body well-formed: required fields present, enums valid, amounts/miles > 0, dates parse, end > start"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all mutating endpoints

  - priority: 5
    category: state
    check: "Target resource (and, for enroll, the eligibility dimension) is in a state permitting the transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 5
    category: state
    check: "Participant.enrollment_status == ENROLLED where the operation requires an enrolled participant"
    error_id: ERR_PARTICIPANT_NOT_ENROLLED
    http_status: 409
    applies_to: "ITAVoucher obligate; JobReferral place"

  - priority: 5
    category: state
    check: "Participant.eligibility_status == ELIGIBLE (and enrolled for OJT) where required"
    error_id: ERR_PARTICIPANT_NOT_ELIGIBLE
    http_status: 409
    applies_to: "Participant enroll; CareerPlan activate; OJTContract activate"

  - priority: 6
    category: business_referential
    check: "Referenced CareerPlan is ACTIVE (obligate) / participant has an ACTIVE plan with documented supportive need (supportive approve)"
    error_id: ERR_NO_ACTIVE_CAREER_PLAN
    http_status: 409
    applies_to: "ITAVoucher obligate; SupportiveServicePayment approve"

  - priority: 7
    category: business_constraint
    check: "Referenced TrainingProgram.status == ACTIVE (provider ETPL-eligible)"
    error_id: ERR_PROGRAM_NOT_ELIGIBLE
    http_status: 409
    applies_to: "ITAVoucher obligate"

  - priority: 7
    category: business_constraint
    check: "OJT reimbursement_rate <= employer size ceiling (SMALL 0.75, LARGE 0.50)"
    error_id: ERR_OJT_RATE_EXCEEDED
    http_status: 409
    applies_to: "OJTContract create"

  - priority: 8
    category: business_temporal
    check: "ITA training period does not overlap another OBLIGATED voucher of the participant (half-open)"
    error_id: ERR_TRAINING_PERIOD_OVERLAP
    http_status: 409
    applies_to: "ITAVoucher obligate"

  - priority: 8
    category: business_temporal
    check: "Activating this OJT contract does not push the employer's overlapping-ACTIVE count to/over max_concurrent_ojt_slots"
    error_id: ERR_OJT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "OJTContract activate"

  - priority: 9
    category: business_fiscal
    check: "authorized_cost_cents <= ita_individual_cap_cents"
    error_id: ERR_ITA_CAP_EXCEEDED
    http_status: 409
    applies_to: "ITAVoucher obligate"

  - priority: 9
    category: business_fiscal
    check: "authorized_cost_cents <= LocalArea.ita_budget_available_cents"
    error_id: ERR_ITA_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "ITAVoucher obligate"

  - priority: 9
    category: business_fiscal
    check: "computed_amount_cents <= participant.supportive_available_cents"
    error_id: ERR_SUPPORTIVE_CAP_EXCEEDED
    http_status: 409
    applies_to: "SupportiveServicePayment approve"

  - priority: 9
    category: business_fiscal
    check: "disbursement amount_cents <= (amount_obligated_cents - amount_expended_cents)"
    error_id: ERR_DISBURSEMENT_EXCEEDS_OBLIGATION
    http_status: 409
    applies_to: "ITAVoucher disburse"

  - priority: 10
    category: state
    check: "expected_local_area_version matches LocalArea.version (OCC, evaluated last)"
    error_id: ERR_STALE_LOCAL_AREA_VERSION
    http_status: 412
    applies_to: "ITAVoucher obligate"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving clock ---
  - method: POST
    path: "/wioa/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any call here the clock reads exactly that default (never wall-clock)."
    roles: [StateAdmin]
    code: 200
    input: [to_iso8601]
    output: "null"
    side_effects: ["logical clock set to to_iso8601"]

  # --- LocalArea ---
  - method: POST
    path: "/wioa/local-areas"
    description: "Create a local workforce area"
    roles: [StateAdmin]
    code: 201
    input: [name, program_year, ita_budget_total_cents, ita_individual_cap_cents, supportive_annual_cap_cents]
    output: LocalArea
    side_effects: ["ita_budget_available_cents = ita_budget_total_cents; obligated=expended=0; version=1"]

  - method: GET
    path: "/wioa/local-areas/{id}"
    description: "Get a local area (includes ITA budget ledger + version)"
    roles: [Any]
    code: 200
    input: []
    output: LocalArea
    side_effects: []

  - method: GET
    path: "/wioa/local-areas/{id}/participants"
    description: "List participants of a local area"
    roles: [Any]
    code: 200
    input: ["funding_stream?", "eligibility_status?", "enrollment_status?"]
    output: "Participant[]"
    side_effects: []

  - method: GET
    path: "/wioa/local-areas/{id}/performance-summary"
    description: "Computed WIOA performance summary (raw vs exclusion-adjusted credential rate, placement rate)"
    roles: [Any]
    code: 200
    input: []
    output: { raw_credential_rate: number, adjusted_credential_rate: number, placement_rate: number, exiter_count: integer, excluded_count: integer, included_count: integer, credential_count: integer, placement_count: integer }
    side_effects: []

  # --- Participant ---
  - method: POST
    path: "/wioa/local-areas/{id}/participants"
    description: "Intake a participant (computes priority_of_service; eligibility PENDING, enrollment NOT_ENROLLED)"
    roles: [CaseManager]
    code: 201
    input: [full_name, funding_stream, "veteran?", "low_income?", "basic_skills_deficient?"]
    output: Participant
    side_effects: ["priority_of_service computed; supportive_available_cents = LocalArea.supportive_annual_cap_cents"]

  - method: GET
    path: "/wioa/participants/{id}"
    description: "Get a participant (includes both status dimensions + supportive ledger)"
    roles: [Any]
    code: 200
    input: []
    output: Participant
    side_effects: []

  - method: POST
    path: "/wioa/participants/{id}/determine-eligibility"
    description: "Record eligibility determination"
    roles: [CaseManager]
    code: 200
    input: [decision]
    output: Participant
    side_effects: ["eligibility_status -> ELIGIBLE | INELIGIBLE"]

  - method: POST
    path: "/wioa/participants/{id}/enroll"
    description: "Enroll an eligible participant"
    roles: [CaseManager]
    code: 200
    input: []
    output: Participant
    side_effects: ["enrollment_status -> ENROLLED"]

  - method: POST
    path: "/wioa/participants/{id}/exit"
    description: "Exit a participant (triggers plan-close -> voucher-cancel -> fund-release cascade)"
    roles: [CaseManager]
    code: 200
    input: ["exit_exclusion?"]
    output: Participant
    side_effects:
      - "enrollment_status -> EXITED; exit_date set; exit_exclusion recorded"
      - "cascade: ACTIVE/UNDER_REVISION CareerPlans -> CLOSED -> OBLIGATED vouchers CANCELLED -> ITA funds released"
      - "REQUESTED/APPROVED SupportiveServicePayments -> VOIDED (supportive funds restored)"

  # --- CareerPlan ---
  - method: POST
    path: "/wioa/participants/{id}/career-plans"
    description: "Create a career plan (IEP) for a participant"
    roles: [CaseManager]
    code: 201
    input: [goal_occupation, service_track, "supportive_need_documented?"]
    output: CareerPlan
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/wioa/participants/{id}/career-plans"
    description: "List a participant's career plans"
    roles: [Any]
    code: 200
    input: ["status?"]
    output: "CareerPlan[]"
    side_effects: []

  - method: GET
    path: "/wioa/career-plans/{id}"
    description: "Get a career plan"
    roles: [Any]
    code: 200
    input: []
    output: CareerPlan
    side_effects: []

  - method: POST
    path: "/wioa/career-plans/{id}/activate"
    description: "Activate a DRAFT plan"
    roles: [CaseManager]
    code: 200
    input: []
    output: CareerPlan
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/wioa/career-plans/{id}/request-revision"
    description: "Move an ACTIVE plan into revision"
    roles: [CaseManager]
    code: 200
    input: []
    output: CareerPlan
    side_effects: ["status -> UNDER_REVISION"]

  - method: POST
    path: "/wioa/career-plans/{id}/approve-revision"
    description: "Return an UNDER_REVISION plan to ACTIVE (cyclic)"
    roles: [CaseManager]
    code: 200
    input: []
    output: CareerPlan
    side_effects: ["status -> ACTIVE; revision_count += 1"]

  # --- TrainingProvider (ETPL) ---
  - method: POST
    path: "/wioa/local-areas/{id}/training-providers"
    description: "Register a training provider (ETPL application)"
    roles: [StateAdmin]
    code: 201
    input: [name]
    output: TrainingProvider
    side_effects: ["etpl_status = APPLIED"]

  - method: GET
    path: "/wioa/training-providers/{id}"
    description: "Get a training provider"
    roles: [Any]
    code: 200
    input: []
    output: TrainingProvider
    side_effects: []

  - method: GET
    path: "/wioa/training-providers"
    description: "List training providers (filter by local_area_id)"
    roles: [Any]
    code: 200
    input: ["local_area_id?", "etpl_status?"]
    output: "TrainingProvider[]"
    side_effects: []

  - method: POST
    path: "/wioa/training-providers/{id}/approve"
    description: "Approve provider onto the ETPL"
    roles: [StateAdmin]
    code: 200
    input: []
    output: TrainingProvider
    side_effects: ["etpl_status -> ELIGIBLE"]

  - method: POST
    path: "/wioa/training-providers/{id}/suspend"
    description: "Suspend a provider (cascades to its programs and DRAFT vouchers)"
    roles: [StateAdmin]
    code: 200
    input: []
    output: TrainingProvider
    side_effects: ["etpl_status -> SUSPENDED; cascade: programs -> SUSPENDED -> DRAFT vouchers CANCELLED"]

  # --- TrainingProgram ---
  - method: POST
    path: "/wioa/training-providers/{id}/programs"
    description: "Add a program to a provider"
    roles: [StateAdmin]
    code: 201
    input: [name, cip_code, total_cost_cents, credential_type, "in_demand?"]
    output: TrainingProgram
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/wioa/training-programs/{id}"
    description: "Get a training program"
    roles: [Any]
    code: 200
    input: []
    output: TrainingProgram
    side_effects: []

  - method: GET
    path: "/wioa/training-providers/{id}/programs"
    description: "List a provider's programs"
    roles: [Any]
    code: 200
    input: ["status?"]
    output: "TrainingProgram[]"
    side_effects: []

  # --- ITAVoucher ---
  - method: POST
    path: "/wioa/participants/{id}/ita-vouchers"
    description: "Create a DRAFT ITA voucher referencing a program + career plan"
    roles: [CaseManager]
    code: 201
    input: [program_id, career_plan_id, authorized_cost_cents, planned_start_date, planned_end_date]
    output: ITAVoucher
    side_effects: ["status = DRAFT; amount_obligated_cents = amount_expended_cents = 0"]

  - method: GET
    path: "/wioa/ita-vouchers/{id}"
    description: "Get an ITA voucher (obligated vs expended ledger)"
    roles: [Any]
    code: 200
    input: []
    output: ITAVoucher
    side_effects: []

  - method: GET
    path: "/wioa/ita-vouchers"
    description: "List ITA vouchers (filter by participant_id / program_id / career_plan_id)"
    roles: [Any]
    code: 200
    input: ["participant_id?", "program_id?", "career_plan_id?", "status?"]
    output: "ITAVoucher[]"
    side_effects: []

  - method: POST
    path: "/wioa/ita-vouchers/{id}/obligate"
    description: "Obligate a DRAFT voucher (OCC on LocalArea.version; draws ITA budget)"
    roles: [CaseManager]
    code: 200
    input: [expected_local_area_version]
    output: ITAVoucher
    side_effects:
      - "status -> OBLIGATED; amount_obligated_cents = authorized_cost_cents"
      - "LocalArea available -= cost; obligated += cost; increments LocalArea.version by 1"

  - method: POST
    path: "/wioa/ita-vouchers/{id}/disburse"
    description: "Post a training disbursement against an OBLIGATED voucher"
    roles: [FiscalOfficer]
    code: 201
    input: [amount_cents, "note?"]
    output: ITADisbursement
    side_effects:
      - "creates ITADisbursement; amount_expended_cents += amount_cents"
      - "LocalArea obligated -= amount; expended += amount; increments LocalArea.version by 1"

  - method: GET
    path: "/wioa/ita-vouchers/{id}/disbursements"
    description: "List disbursements posted against a voucher"
    roles: [Any]
    code: 200
    input: []
    output: "ITADisbursement[]"
    side_effects: []

  - method: POST
    path: "/wioa/ita-vouchers/{id}/complete"
    description: "Complete training on an OBLIGATED voucher; records credential/MSG; deobligates remainder"
    roles: [CaseManager]
    code: 200
    input: [credential_earned]
    output: ITAVoucher
    side_effects:
      - "status -> COMPLETED; credential_earned set"
      - "participant.credential_attained = credential_earned; participant.msg_attained = true"
      - "LocalArea available += remainder; obligated -= remainder; increments LocalArea.version by 1"

  - method: POST
    path: "/wioa/ita-vouchers/{id}/cancel"
    description: "Cancel a DRAFT or OBLIGATED voucher; releases any remaining obligation"
    roles: [CaseManager]
    code: 200
    input: []
    output: ITAVoucher
    side_effects: ["status -> CANCELLED; if OBLIGATED, release remainder to LocalArea available; increments LocalArea.version by 1 when funds move"]

  # --- SupportiveServicePayment ---
  - method: POST
    path: "/wioa/participants/{id}/supportive-services"
    description: "Request a supportive-service payment (MILEAGE computes from trips)"
    roles: [CaseManager]
    code: 201
    input: [service_type, "amount_cents?", "trips?"]
    output: SupportiveServicePayment
    side_effects: ["status = REQUESTED; computed_amount_cents derived"]

  - method: GET
    path: "/wioa/supportive-services/{id}"
    description: "Get a supportive-service payment"
    roles: [Any]
    code: 200
    input: []
    output: SupportiveServicePayment
    side_effects: []

  - method: GET
    path: "/wioa/participants/{id}/supportive-services"
    description: "List a participant's supportive-service payments"
    roles: [Any]
    code: 200
    input: ["status?", "service_type?"]
    output: "SupportiveServicePayment[]"
    side_effects: []

  - method: POST
    path: "/wioa/supportive-services/{id}/approve"
    description: "Approve a REQUESTED payment (obligates supportive funds) — FiscalOfficer only (SoD)"
    roles: [FiscalOfficer]
    code: 200
    input: []
    output: SupportiveServicePayment
    side_effects: ["status -> APPROVED; supportive_available -= amount; supportive_obligated += amount"]

  - method: POST
    path: "/wioa/supportive-services/{id}/pay"
    description: "Pay an APPROVED payment"
    roles: [FiscalOfficer]
    code: 200
    input: []
    output: SupportiveServicePayment
    side_effects: ["status -> PAID; supportive_obligated -= amount; supportive_expended += amount"]

  - method: POST
    path: "/wioa/supportive-services/{id}/void"
    description: "Void a REQUESTED/APPROVED payment (restores obligated funds)"
    roles: [FiscalOfficer]
    code: 200
    input: []
    output: SupportiveServicePayment
    side_effects: ["status -> VOIDED; if APPROVED, supportive_obligated -= amount; supportive_available += amount"]

  # --- Employer ---
  - method: POST
    path: "/wioa/local-areas/{id}/employers"
    description: "Register an employer partner"
    roles: [BusinessServicesRep]
    code: 201
    input: [name, size, max_concurrent_ojt_slots]
    output: Employer
    side_effects: []

  - method: GET
    path: "/wioa/employers/{id}"
    description: "Get an employer"
    roles: [Any]
    code: 200
    input: []
    output: Employer
    side_effects: []

  - method: GET
    path: "/wioa/employers"
    description: "List employers (filter by local_area_id)"
    roles: [Any]
    code: 200
    input: ["local_area_id?", "size?"]
    output: "Employer[]"
    side_effects: []

  # --- OJTContract ---
  - method: POST
    path: "/wioa/employers/{id}/ojt-contracts"
    description: "Create an OJT contract (validates reimbursement_rate vs employer size ceiling)"
    roles: [BusinessServicesRep]
    code: 201
    input: [participant_id, reimbursement_rate, wage_cents_per_hour, planned_hours, obligated_amount_cents, start_date, end_date]
    output: OJTContract
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/wioa/ojt-contracts/{id}"
    description: "Get an OJT contract"
    roles: [Any]
    code: 200
    input: []
    output: OJTContract
    side_effects: []

  - method: GET
    path: "/wioa/ojt-contracts"
    description: "List OJT contracts (filter by participant_id / employer_id)"
    roles: [Any]
    code: 200
    input: ["participant_id?", "employer_id?", "status?"]
    output: "OJTContract[]"
    side_effects: []

  - method: POST
    path: "/wioa/ojt-contracts/{id}/activate"
    description: "Activate a DRAFT OJT contract (participant eligible/enrolled + employer capacity)"
    roles: [BusinessServicesRep]
    code: 200
    input: []
    output: OJTContract
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/wioa/ojt-contracts/{id}/reimburse"
    description: "Post an employer reimbursement against an ACTIVE contract (min of computed gross and remaining obligation)"
    roles: [FiscalOfficer]
    code: 200
    input: [hours_worked]
    output: OJTContract
    side_effects: ["amount_expended_cents += reimbursement_cents"]

  - method: POST
    path: "/wioa/ojt-contracts/{id}/complete"
    description: "Complete an ACTIVE OJT contract"
    roles: [BusinessServicesRep]
    code: 200
    input: []
    output: OJTContract
    side_effects: ["status -> COMPLETED"]

  - method: POST
    path: "/wioa/ojt-contracts/{id}/terminate"
    description: "Terminate an ACTIVE OJT contract"
    roles: [BusinessServicesRep]
    code: 200
    input: []
    output: OJTContract
    side_effects: ["status -> TERMINATED"]

  # --- JobReferral ---
  - method: POST
    path: "/wioa/participants/{id}/job-referrals"
    description: "Refer a participant to an employer job opening"
    roles: [BusinessServicesRep, CaseManager]
    code: 201
    input: [employer_id, job_title, "offered_wage_cents_per_hour?"]
    output: JobReferral
    side_effects: ["status = REFERRED"]

  - method: GET
    path: "/wioa/job-referrals/{id}"
    description: "Get a job referral"
    roles: [Any]
    code: 200
    input: []
    output: JobReferral
    side_effects: []

  - method: GET
    path: "/wioa/job-referrals"
    description: "List job referrals (filter by participant_id / employer_id)"
    roles: [Any]
    code: 200
    input: ["participant_id?", "employer_id?", "status?"]
    output: "JobReferral[]"
    side_effects: []

  - method: POST
    path: "/wioa/job-referrals/{id}/place"
    description: "Record a placement"
    roles: [BusinessServicesRep]
    code: 200
    input: ["placement_wage_cents_per_hour?"]
    output: JobReferral
    side_effects: ["status -> PLACED; placement_date set"]

  - method: POST
    path: "/wioa/job-referrals/{id}/reject"
    description: "Record that the referral did not result in hire"
    roles: [BusinessServicesRep]
    code: 200
    input: []
    output: JobReferral
    side_effects: ["status -> REJECTED"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing or malformed"
  - id: ERR_FORBIDDEN_FOR_ROLE
    http: 403
    condition: "Caller role is valid but not permitted for this endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path or referenced FK resource does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body: missing required field, bad enum, non-positive amount/miles, unparsable/inverted dates, or authorized_cost_cents > program.total_cost_cents"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state permitting the requested transition"
  - id: ERR_PARTICIPANT_NOT_ELIGIBLE
    http: 409
    condition: "Operation requires eligibility_status == ELIGIBLE (and ENROLLED for OJT activation)"
  - id: ERR_PARTICIPANT_NOT_ENROLLED
    http: 409
    condition: "Operation requires the participant to be ENROLLED"
  - id: ERR_NO_ACTIVE_CAREER_PLAN
    http: 409
    condition: "Referenced career plan is not ACTIVE, or no ACTIVE plan documents the supportive need"
  - id: ERR_PROGRAM_NOT_ELIGIBLE
    http: 409
    condition: "Referenced TrainingProgram is SUSPENDED (provider not ETPL-eligible)"
  - id: ERR_OJT_RATE_EXCEEDED
    http: 409
    condition: "OJT reimbursement_rate exceeds the employer size ceiling (SMALL 0.75, LARGE 0.50)"
  - id: ERR_TRAINING_PERIOD_OVERLAP
    http: 409
    condition: "Voucher training period overlaps another OBLIGATED voucher of the same participant"
  - id: ERR_OJT_CAPACITY_EXCEEDED
    http: 409
    condition: "Activating this OJT contract would meet/exceed the employer's max_concurrent_ojt_slots for overlapping periods"
  - id: ERR_ITA_CAP_EXCEEDED
    http: 409
    condition: "authorized_cost_cents exceeds LocalArea.ita_individual_cap_cents"
  - id: ERR_ITA_BUDGET_EXCEEDED
    http: 409
    condition: "authorized_cost_cents exceeds LocalArea.ita_budget_available_cents"
  - id: ERR_SUPPORTIVE_CAP_EXCEEDED
    http: 409
    condition: "computed_amount_cents exceeds participant.supportive_available_cents"
  - id: ERR_DISBURSEMENT_EXCEEDS_OBLIGATION
    http: 409
    condition: "Disbursement amount exceeds the voucher's unexpended obligation"
  - id: ERR_STALE_LOCAL_AREA_VERSION
    http: 412
    condition: "expected_local_area_version does not match LocalArea.version at obligation time"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: StateAdmin
    description: "State/local board operator: manages ETPL providers/programs, local areas, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /wioa/local-areas — create local area"
      - "POST /wioa/local-areas/{id}/training-providers — register provider"
      - "POST /wioa/training-providers/{id}/approve — ETPL approve"
      - "POST /wioa/training-providers/{id}/suspend — ETPL suspend (cascade)"
      - "POST /wioa/training-providers/{id}/programs — add program"
      - "POST /wioa/_clock/set_current_utc — set logical clock"
    shared_operations: []

  - name: CaseManager
    description: "Front-line case manager: participant intake/eligibility/enroll/exit, career plans, ITA vouchers"
    identity: opaque
    exclusive_operations:
      - "POST /wioa/local-areas/{id}/participants — intake"
      - "POST /wioa/participants/{id}/determine-eligibility"
      - "POST /wioa/participants/{id}/enroll"
      - "POST /wioa/participants/{id}/exit"
      - "POST /wioa/participants/{id}/career-plans and activate/request-revision/approve-revision"
      - "POST /wioa/participants/{id}/ita-vouchers and obligate/complete/cancel"
    shared_operations:
      - "POST /wioa/participants/{id}/job-referrals (with BusinessServicesRep)"
      - "POST /wioa/participants/{id}/supportive-services — request supportive payment (approval/pay reserved to FiscalOfficer)"

  - name: FiscalOfficer
    description: "Fiscal role: approves/pays/voids supportive payments, posts ITA disbursements and OJT reimbursements (segregation of duties from requesters)"
    identity: opaque
    exclusive_operations:
      - "POST /wioa/supportive-services/{id}/approve"
      - "POST /wioa/supportive-services/{id}/pay"
      - "POST /wioa/supportive-services/{id}/void"
      - "POST /wioa/ita-vouchers/{id}/disburse"
      - "POST /wioa/ojt-contracts/{id}/reimburse"
    shared_operations: []

  - name: BusinessServicesRep
    description: "Employer-facing role: employers, OJT contracts, job referrals and placements"
    identity: opaque
    exclusive_operations:
      - "POST /wioa/local-areas/{id}/employers"
      - "POST /wioa/employers/{id}/ojt-contracts and activate/complete/terminate"
      - "POST /wioa/job-referrals/{id}/place and reject"
    shared_operations:
      - "POST /wioa/participants/{id}/job-referrals (with CaseManager)"

  - name: Any
    description: "Pseudo-role for read (GET) endpoints — any authenticated role may read"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints"
