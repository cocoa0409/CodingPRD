# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3442_site_industrial_gas_plants_take_or_pay
#
# Depth probe: 2 instances per §0.5 rule. Every instance grounds in
# SCAFFOLD.yaml §1.1–§1.7 and replays from empty-DB via §1.5 endpoints only.
# All formula-derived asserts are pre-computed literals.
#
# Shared fixture math (verified by hand-executing the §1.3 formulas):
#   K_FAB: start 2026-10-01, term 120 -> end 2036-10-01; renewal opens
#          2036-07-03 (end - 90d). min 2,000,000 nm3 @ 12c; fee 500,000c;
#          esc 3%; base index 0.08; 0.42 kWh/nm3; cap 10%.
#   Period 2027-12: months_elapsed 14 -> 1 year -> mult 1.0300 -> fee 515,000.
#     FINAL metered 1,500,000 @0.10: billable 2,000,000 -> 24,000,000;
#     passthrough round(1,500,000*0.42*0.02) = 12,600; capital 1,000,000;
#     subtotal 25,527,600; shortfall 500,000 -> grant 3,600,000 (cap
#     28,800,000); total 25,527,600; balance 3,600,000.
#     PROVISIONAL projected 1,800,000: 24,000,000 + 0 + 515,000 + 1,000,000
#     = 25,515,000; grant estimate 1,440,000; no ledger mutation.
#   Period 2028-01: months_elapsed 15 -> 1 year -> fee 515,000.
#     FINAL metered 2,100,000 @0.10: billable 2,100,000 -> 25,200,000;
#     passthrough 17,640; +capital 1,000,000 -> subtotal 26,732,640;
#     apply 1,000,000 -> total 25,732,640; grant 0; balance 2,600,000.
#   Period 2028-11: months_elapsed 25 -> 2 years -> mult round(1.03^2 per-year
#     rounding,4) = 1.0609 -> fee 530,450 (K_FAB); for fee 375,000 @2.5%:
#     mult 1.0506 -> fee 393,975 (single-shot 1.025^2 would give 393,984).
#   Tank runout: readings 40,000 ->(+10h) 37,000 ->(+10h) 35,000 L:
#     burns 300 then 200 L/h; instant 200; wma 0.5*200+0.25*300 = 175.
#     runout from 2026-10-01T20:00:00Z, safety 5,000:
#     instant (35,000-5,000)/200 = 150h -> 2026-10-08T02:00:00Z;
#     wma 30,000/175 h = 617,142.857s -> round_half_up 617,143s
#     -> 2026-10-08T23:25:43Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: settlement_provisional_final_divergence
        grounds:
          - calculations.settlement_invoice
          - entities.SettlementStatement.fields.total_due_cents
          - endpoints.POST_/gas-supply/supply-contracts/{id}/settlements
        distinguishing_aspect: |
          Fiscal domain (SupplyContract billing): the SAME period 2027-12 yields
          total_due_cents 25,515,000 under the PROVISIONAL variant (projected
          volume, zero passthrough, no ledger mutation) vs 25,527,600 under the
          FINAL variant (metered volume, actual index) — a 12,600-cent delta on
          identical contract terms, and only FINAL moves the makeup bank.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Customer Fabrikam (PRIME) with ACCEPTED ONSITE_PLANT evaluation, ACTIVE contract K_FAB (start 2026-10-01, term 120, min 2,000,000, price 12c, fee 500,000c, esc 3%, base index 0.08, 0.42 kWh/nm3) and an OPERATING plant with capital_cost_cents 120,000,000."
          setup_api_calls:
            - &clock_init
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &mk_cust_fab
              call: "POST /gas-supply/customers"
              payload: { name: "Fabrikam Chips", segment: "ELECTRONICS", credit_standing: "PRIME" }
              as: PlatformAdmin
              captures: { c_fab: $.data.id }
            - &mk_eval_fab
              call: "POST /gas-supply/supply-mode-evaluations"
              payload: { customer_id: "${c_fab}", site_label: "FAB-1", demand_avg_nm3h: 5000, demand_peak_nm3h: 7000, required_purity_percent: 99.999, required_product: "N2", pipeline_available: true }
              as: SupplyPlanner
              captures: { e_fab: $.data.id }
            - &accept_eval_fab
              call: "POST /gas-supply/supply-mode-evaluations/${e_fab}/accept"
              payload: {}
              as: CustomerOps
              as_user_id: "${c_fab}"
            - &mk_contract_fab
              call: "POST /gas-supply/supply-contracts"
              payload: { customer_id: "${c_fab}", evaluation_id: "${e_fab}", term_months: 120, start_date: "2026-10-01", min_monthly_volume_nm3: 2000000, unit_price_cents_per_nm3: 12, monthly_facility_fee_cents: 500000, facility_fee_escalation_pct_annual: 0.03, base_power_index: 0.08, power_kwh_per_nm3: 0.42 }
              as: SupplyPlanner
              captures: { k_fab: $.data.id }
            - &activate_fab
              call: "POST /gas-supply/supply-contracts/${k_fab}/activate"
              payload: {}
              as: SupplyPlanner
              captures: { kfab_v0: $.data.version }
            - &mk_plant_fab
              call: "POST /gas-supply/onsite-plants"
              payload: { contract_id: "${k_fab}", name: "FAB-1 ASU", nameplate_capacity_nm3h: 6000, capital_cost_cents: 120000000, power_kwh_per_nm3: 0.42 }
              as: PlantOperator
              captures: { p_fab: $.data.id }
            - &adv_fab_1
              call: "POST /gas-supply/onsite-plants/${p_fab}/advance"
              payload: {}
              as: PlantOperator
            - &adv_fab_2
              call: "POST /gas-supply/onsite-plants/${p_fab}/advance"
              payload: {}
              as: PlantOperator
            - &adv_fab_3
              call: "POST /gas-supply/onsite-plants/${p_fab}/advance"
              payload: {}
              as: PlantOperator
          trigger:
            - call: "POST /gas-supply/supply-contracts/${k_fab}/settlements"
              payload: { period_month: "2027-12", variant: "PROVISIONAL", projected_volume_nm3: 1800000 }
              as: BillingSpecialist
              captures: { s_prov: $.data.total_due_cents, s_prov_grant: $.data.makeup_credit_granted_cents }
            - call: "POST /gas-supply/supply-contracts/${k_fab}/settlements"
              payload: { period_month: "2027-12", variant: "FINAL", metered_volume_nm3: 1500000, power_index_actual: 0.10 }
              as: BillingSpecialist
              captures: { s_fin: $.data.total_due_cents }
            - call: "GET /gas-supply/supply-contracts/${k_fab}"
              payload: {}
              as: BillingSpecialist
              captures: { k_bal: $.data.makeup_credit_balance_cents }
          assert:
            - "PROVISIONAL: SettlementStatement.total_due_cents == 25515000 and power_passthrough_cents == 0 and makeup_credit_granted_cents == 1440000 (estimate only)"
            - "FINAL: SettlementStatement.total_due_cents == 25527600 and power_passthrough_cents == 12600 and makeup_credit_granted_cents == 3600000"
            - "${s_fin} - ${s_prov} == 12600 (variant divergence on identical contract terms)"
            - "after FINAL: SupplyContract.${k_fab}.makeup_credit_balance_cents == 3600000 (PROVISIONAL left it at 0)"
            - "GET settlements list: the PROVISIONAL statement for 2027-12 has status SUPERSEDED, the FINAL has status FINAL"

      - name: tank_runout_instant_vs_wma_divergence
        grounds:
          - calculations.tank_burn_rate_and_runout
          - entities.StorageTank.fields.projected_runout_wma_at
          - endpoints.POST_/gas-supply/storage-tanks/{id}/telemetry
        distinguishing_aspect: |
          Logistics domain (StorageTank telemetry, a different entity domain
          than SupplyContract billing): the same three readings yield
          burn_rate_instant_lph 200 vs burn_rate_wma_lph 175 and runout
          projections 2026-10-08T02:00:00Z vs 2026-10-08T23:25:43Z — two valid
          algorithms, two different observable timestamps.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Customer Fabrikam. Tank T_RUN: capacity 50,000, reorder 20,000, safety 5,000."
          setup_api_calls:
            - *clock_init
            - *mk_cust_fab
            - call: "POST /gas-supply/storage-tanks"
              payload: { customer_id: "${c_fab}", site_label: "FAB-1", product: "N2", capacity_liters: 50000, reorder_point_liters: 20000, safety_stock_liters: 5000, required_purity_percent: 99.9, max_impurity_ppm: 50 }
              as: PlantOperator
              captures: { t_run: $.data.id }
          trigger:
            - call: "POST /gas-supply/storage-tanks/${t_run}/telemetry"
              payload: { measured_at: "2026-10-01T00:00:00Z", level_liters: 40000 }
              as: TelemetryGateway
            - call: "POST /gas-supply/storage-tanks/${t_run}/telemetry"
              payload: { measured_at: "2026-10-01T10:00:00Z", level_liters: 37000 }
              as: TelemetryGateway
            - call: "POST /gas-supply/storage-tanks/${t_run}/telemetry"
              payload: { measured_at: "2026-10-01T20:00:00Z", level_liters: 35000 }
              as: TelemetryGateway
              captures: { lvl: $.data.current_level_liters, bi: $.data.burn_rate_instant_lph, bw: $.data.burn_rate_wma_lph }
          assert:
            - "StorageTank.${t_run}.current_level_liters == 35000"
            - "StorageTank.${t_run}.burn_rate_instant_lph == 200"
            - "StorageTank.${t_run}.burn_rate_wma_lph == 175"
            - "StorageTank.${t_run}.projected_runout_instant_at == \"2026-10-08T02:00:00Z\""
            - "StorageTank.${t_run}.projected_runout_wma_at == \"2026-10-08T23:25:43Z\""
            - "StorageTank.${t_run}.status == NORMAL (35000 > reorder 20000, no delivery created)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: settlement_invoice_max_and_conditional_capital
        grounds:
          - calculations.settlement_invoice
          - entities.SettlementStatement.fields.capital_recovery_cents
        distinguishing_aspect: |
          Mode (a) combinatorial: >=3 inputs with non-linear interaction —
          max(metered, min) at exact equality, a conditional capital-recovery
          branch keyed on plant existence, and a signed passthrough term all
          combine: metered == min 2,000,000 yields billable 2,000,000, capital
          1,000,000 (plant branch taken), passthrough 8,400, total 25,538,850.
        test_recipe:
          setup:
            - "K_FAB ACTIVE with OPERATING plant (capital 120,000,000) as in settlement_provisional_final_divergence."
          setup_api_calls:
            - *clock_init
            - *mk_cust_fab
            - *mk_eval_fab
            - *accept_eval_fab
            - *mk_contract_fab
            - *activate_fab
            - *mk_plant_fab
            - *adv_fab_1
            - *adv_fab_2
            - *adv_fab_3
          trigger:
            - call: "POST /gas-supply/supply-contracts/${k_fab}/settlements"
              payload: { period_month: "2028-11", variant: "FINAL", metered_volume_nm3: 2000000, power_index_actual: 0.09 }
              as: BillingSpecialist
              captures: { s_tot: $.data.total_due_cents, s_bill: $.data.billable_volume_nm3, s_cap: $.data.capital_recovery_cents, s_fee: $.data.facility_fee_cents }
          assert:
            - "SettlementStatement.billable_volume_nm3 == 2000000 (max branch at exact equality metered == min)"
            - "SettlementStatement.volume_charge_cents == 24000000"
            - "SettlementStatement.power_passthrough_cents == 8400 (round(2000000*0.42*(0.09-0.08)))"
            - "SettlementStatement.facility_fee_cents == 530450 (mult 1.0609 at 25 months)"
            - "SettlementStatement.capital_recovery_cents == 1000000 (conditional branch: OPERATING plant exists)"
            - "SettlementStatement.total_due_cents == 25538850"

      - name: facility_fee_per_year_rounding
        grounds:
          - calculations.facility_fee_escalation
          - entities.SettlementStatement.fields.escalation_multiplier
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters (different mode than
          settlement_invoice's (a)): per-year multiplier rounding gives
          round(1.025*1.025, 4) = 1.0506 and fee 393,975, whereas rounding once
          at the end (1.025^2 = 1.050625) would give 393,984 — the scaffold
          pins per-year rounding, so 393,975 is the only conformant answer.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Customer Cryo Med (MEDICAL, STANDARD) with ACCEPTED CYLINDER evaluation (avg 50 nm3/h) and ACTIVE contract K_CYL: start 2026-10-01, term 120, min 10,000, price 20c, fee 375,000c, esc 2.5%, base 0.08, 0.10 kWh/nm3. No plant (mode CYLINDER -> capital branch not taken)."
          setup_api_calls:
            - *clock_init
            - call: "POST /gas-supply/customers"
              payload: { name: "Cryo Med", segment: "MEDICAL" }
              as: PlatformAdmin
              captures: { c_med: $.data.id }
            - call: "POST /gas-supply/supply-mode-evaluations"
              payload: { customer_id: "${c_med}", site_label: "MED-1", demand_avg_nm3h: 50, demand_peak_nm3h: 90, required_purity_percent: 99.999, required_product: "O2", pipeline_available: false }
              as: SupplyPlanner
              captures: { e_med: $.data.id }
            - call: "POST /gas-supply/supply-mode-evaluations/${e_med}/accept"
              payload: {}
              as: CustomerOps
              as_user_id: "${c_med}"
            - call: "POST /gas-supply/supply-contracts"
              payload: { customer_id: "${c_med}", evaluation_id: "${e_med}", term_months: 120, start_date: "2026-10-01", min_monthly_volume_nm3: 10000, unit_price_cents_per_nm3: 20, monthly_facility_fee_cents: 375000, facility_fee_escalation_pct_annual: 0.025, base_power_index: 0.08, power_kwh_per_nm3: 0.10 }
              as: SupplyPlanner
              captures: { k_cyl: $.data.id }
            - call: "POST /gas-supply/supply-contracts/${k_cyl}/activate"
              payload: {}
              as: SupplyPlanner
          trigger:
            - call: "POST /gas-supply/supply-contracts/${k_cyl}/settlements"
              payload: { period_month: "2028-11", variant: "FINAL", metered_volume_nm3: 12000, power_index_actual: 0.09 }
              as: BillingSpecialist
              captures: { s_fee2: $.data.facility_fee_cents, s_mult: $.data.escalation_multiplier }
          assert:
            - "SettlementStatement.escalation_multiplier == 1.0506 (per-year rounded, not 1.050625)"
            - "SettlementStatement.facility_fee_cents == 393975 (NOT 393984 — the single-shot value is non-conformant)"
            - "SettlementStatement.capital_recovery_cents == 0 (no plant for CYLINDER mode)"
            - "SettlementStatement.power_passthrough_cents == 12 (round(12000*0.10*(0.09-0.08)))"
            - "SettlementStatement.total_due_cents == 633987 (240000 + 12 + 393975 + 0)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: contract_renewal_cycle
        grounds:
          - state_machines.SupplyContract.ACTIVE_to_RENEWAL_OPEN
          - state_machines.SupplyContract.RENEWAL_OPEN_to_ACTIVE
          - concurrency_rules[contract-amendment-stale-version]
        distinguishing_aspect: |
          SupplyContract is cyclic (ACTIVE -> RENEWAL_OPEN -> ACTIVE), not a
          linear pipeline: the clock sweep opens the renewal window at exactly
          end_date - 90d and an OCC-guarded RENEWAL amendment returns the
          contract to ACTIVE with an extended end_date and repriced fee.
        test_recipe:
          setup:
            - "K_FAB ACTIVE (no plant needed). end_date 2036-10-01."
          setup_api_calls:
            - *clock_init
            - *mk_cust_fab
            - *mk_eval_fab
            - *accept_eval_fab
            - *mk_contract_fab
            - *activate_fab
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2036-07-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /gas-supply/supply-contracts/${k_fab}"
              payload: {}
              as: SupplyPlanner
              captures: { k_stat: $.data.status, k_v: $.data.version }
          trigger:
            - call: "POST /gas-supply/supply-contracts/${k_fab}/amendments"
              payload: { kind: "RENEWAL", expected_contract_version: "${k_v}", new_end_date: "2041-10-01", new_monthly_facility_fee_cents: 550000 }
              as: SupplyPlanner
              captures: { k_v2: $.data.version }
          assert:
            - "before renewal: SupplyContract.${k_fab}.status == RENEWAL_OPEN (sweep fired at exactly end_date - 90d, 2036-07-03)"
            - "after renewal: status == ACTIVE (cycle closed back to ACTIVE)"
            - "SupplyContract.${k_fab}.end_date == \"2041-10-01\" and monthly_facility_fee_cents == 550000"
            - "SupplyContract.${k_fab}.version == ${k_v} + 1"

      - name: delivery_parallel_transport_quality
        grounds:
          - state_machines.Delivery
          - entities.Delivery.fields.transport_status
          - entities.Delivery.fields.quality_status
        distinguishing_aspect: |
          Delivery carries two INDEPENDENT state dimensions (different
          non-linear shape than SupplyContract's cycle): confirm-delivery moves
          transport SCHEDULED->DELIVERED while quality stays QC_PENDING; only
          the certificate decision moves quality — observable mid-state
          DELIVERED/QC_PENDING proves the dimensions evolve independently.
        test_recipe:
          setup:
            - "Customer Fabrikam; tank T_PAR capacity 50,000, reorder 20,000, safety 5,000, purity 99.999, max impurity 10 ppm. Telemetry 25,000 then 20,000 L triggers TELEMETRY delivery D1 (qty 30,000)."
          setup_api_calls:
            - *clock_init
            - *mk_cust_fab
            - call: "POST /gas-supply/storage-tanks"
              payload: { customer_id: "${c_fab}", site_label: "FAB-1", product: "N2", capacity_liters: 50000, reorder_point_liters: 20000, safety_stock_liters: 5000, required_purity_percent: 99.999, max_impurity_ppm: 10 }
              as: PlantOperator
              captures: { t_par: $.data.id }
            - call: "POST /gas-supply/storage-tanks/${t_par}/telemetry"
              payload: { measured_at: "2026-10-01T00:00:00Z", level_liters: 25000 }
              as: TelemetryGateway
            - call: "POST /gas-supply/storage-tanks/${t_par}/telemetry"
              payload: { measured_at: "2026-10-01T05:00:00Z", level_liters: 20000 }
              as: TelemetryGateway
            - call: "GET /gas-supply/deliveries"
              payload: { tank_id: "${t_par}" }
              as: PipelineDispatcher
              captures: { d1: "$.data[0].id" }
          trigger:
            - call: "POST /gas-supply/deliveries/${d1}/confirm-delivery"
              payload: { delivered_quantity_liters: 30000 }
              as: PipelineDispatcher
              captures: { d1_trans: $.data.transport_status, d1_qual: $.data.quality_status }
            - call: "POST /gas-supply/deliveries/${d1}/quality-certificates"
              payload: { sampled_at: "2026-10-01T08:00:00Z", measured_purity_percent: 99.9995, measured_impurity_ppm: 5 }
              as: QualityAnalyst
              as_user_id: "qa-1"
              captures: { qc1: $.data.id }
            - call: "POST /gas-supply/quality-certificates/${qc1}/certify"
              payload: { decision: "CERTIFIED" }
              as: QualityCertifier
              as_user_id: "qc-9"
          assert:
            - "mid-state: Delivery.${d1}.transport_status == DELIVERED while quality_status == QC_PENDING (dimensions independent)"
            - "after certification: Delivery.${d1}.transport_status == COMPLETED and quality_status == CERTIFIED"
            - "Delivery.${d1}.delivered_quantity_liters == 30000"
            - "no replacement delivery created on success: GET /gas-supply/deliveries?tank_id=${t_par} returns exactly 1 row"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: turnaround_start_failover_cascade
        grounds:
          - state_machines.Turnaround.SCHEDULED_to_IN_PROGRESS
          - state_machines.OnsitePlant.OPERATING_to_TURNAROUND
          - entities.SupplyContract.fields.failover_active
        distinguishing_aspect: |
          Depth-3+ transitive chain from ONE trigger (turnaround start):
          Turnaround -> IN_PROGRESS mutates OnsitePlant -> TURNAROUND
          (capacity 0), whose mutation sets SupplyContract.failover_active =
          true, whose failover creates BACKUP Deliveries, whose creation
          recomputes stop_sequence — each link caused by the previous link.
        test_recipe:
          setup:
            - "K_FAB ACTIVE with OPERATING plant P_FAB. Tank T_BK (product N2, capacity 50,000, reorder 8,000, safety 2,000) at level 12,000 (NORMAL — no telemetry delivery pending). Turnaround TA window [2026-10-10T00:00:00Z, 2026-10-14T00:00:00Z) proposed, AGREED, SCHEDULED. Clock advanced to window start."
          setup_api_calls:
            - *clock_init
            - *mk_cust_fab
            - *mk_eval_fab
            - *accept_eval_fab
            - *mk_contract_fab
            - *activate_fab
            - *mk_plant_fab
            - *adv_fab_1
            - *adv_fab_2
            - *adv_fab_3
            - call: "POST /gas-supply/storage-tanks"
              payload: { customer_id: "${c_fab}", site_label: "FAB-1", product: "N2", capacity_liters: 50000, reorder_point_liters: 8000, safety_stock_liters: 2000, required_purity_percent: 99.999, max_impurity_ppm: 10 }
              as: PlantOperator
              captures: { t_bk: $.data.id }
            - call: "POST /gas-supply/storage-tanks/${t_bk}/telemetry"
              payload: { measured_at: "2026-10-05T00:00:00Z", level_liters: 12000 }
              as: TelemetryGateway
            - call: "POST /gas-supply/onsite-plants/${p_fab}/turnarounds"
              payload: { window_start: "2026-10-10T00:00:00Z", window_end: "2026-10-14T00:00:00Z", scope: "Cold box re-liquefier overhaul" }
              as: PlantOperator
              captures: { ta1: $.data.id, ta1_v: $.data.version }
            - call: "POST /gas-supply/turnarounds/${ta1}/respond"
              payload: { decision: "AGREE", expected_turnaround_version: "${ta1_v}" }
              as: CustomerOps
              as_user_id: "${c_fab}"
            - call: "POST /gas-supply/turnarounds/${ta1}/schedule"
              payload: {}
              as: PlantOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /gas-supply/turnarounds/${ta1}/start"
              payload: {}
              as: PlantOperator
            - call: "GET /gas-supply/onsite-plants/${p_fab}"
              payload: {}
              as: PlantOperator
              captures: { p_stat: $.data.status, p_cap: $.data.effective_capacity_nm3h }
            - call: "GET /gas-supply/supply-contracts/${k_fab}"
              payload: {}
              as: PlantOperator
              captures: { k_fo: $.data.failover_active }
            - call: "GET /gas-supply/deliveries"
              payload: { tank_id: "${t_bk}" }
              as: PlantOperator
              captures: { bk_id: "$.data[0].id", bk_trig: "$.data[0].triggered_by", bk_qty: "$.data[0].quantity_liters", bk_seq: "$.data[0].stop_sequence" }
          assert:
            - "Turnaround.${ta1}.status == IN_PROGRESS"
            - "link 1: OnsitePlant.${p_fab}.status == TURNAROUND and effective_capacity_nm3h == 0"
            - "link 2: SupplyContract.${k_fab}.failover_active == true"
            - "link 3: exactly one Delivery for tank ${t_bk} with triggered_by == BACKUP and quantity_liters == 38000 (capacity 50000 - level 12000)"
            - "link 4: that Delivery.stop_sequence == 1 (route recompute for its route_date)"

      - name: quality_fail_redelivery_cascade
        grounds:
          - state_machines.QualityCertificate.RECORDED_to_FAILED
          - state_machines.Delivery
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (certificate certification,
          not turnaround start): certify FAILED mutates QualityCertificate ->
          FAILED, whose mutation flips Delivery -> REJECTED/FAILED, whose
          mutation creates a REDELIVERY replacement Delivery sized from the
          unchanged tank level.
        test_recipe:
          setup:
            - "Customer Fabrikam; tank T_QL capacity 50,000, reorder 20,000, safety 5,000, purity 99.999, max impurity 10. Telemetry 25,000 then 20,000 L -> TELEMETRY delivery D1 qty 30,000; D1 confirmed with exactly the headroom 30,000; certificate recorded with FAILING purity 99.99."
          setup_api_calls:
            - *clock_init
            - *mk_cust_fab
            - call: "POST /gas-supply/storage-tanks"
              payload: { customer_id: "${c_fab}", site_label: "FAB-1", product: "N2", capacity_liters: 50000, reorder_point_liters: 20000, safety_stock_liters: 5000, required_purity_percent: 99.999, max_impurity_ppm: 10 }
              as: PlantOperator
              captures: { t_ql: $.data.id }
            - call: "POST /gas-supply/storage-tanks/${t_ql}/telemetry"
              payload: { measured_at: "2026-10-01T00:00:00Z", level_liters: 25000 }
              as: TelemetryGateway
            - call: "POST /gas-supply/storage-tanks/${t_ql}/telemetry"
              payload: { measured_at: "2026-10-01T05:00:00Z", level_liters: 20000 }
              as: TelemetryGateway
            - call: "GET /gas-supply/deliveries"
              payload: { tank_id: "${t_ql}" }
              as: PipelineDispatcher
              captures: { d1q: "$.data[0].id" }
            - call: "POST /gas-supply/deliveries/${d1q}/confirm-delivery"
              payload: { delivered_quantity_liters: 30000 }
              as: PipelineDispatcher
            - call: "POST /gas-supply/deliveries/${d1q}/quality-certificates"
              payload: { sampled_at: "2026-10-01T08:00:00Z", measured_purity_percent: 99.99, measured_impurity_ppm: 14 }
              as: QualityAnalyst
              as_user_id: "qa-1"
              captures: { qc_fail: $.data.id }
          trigger:
            - call: "POST /gas-supply/quality-certificates/${qc_fail}/certify"
              payload: { decision: "FAILED" }
              as: QualityCertifier
              as_user_id: "qc-9"
            - call: "GET /gas-supply/deliveries/${d1q}"
              payload: {}
              as: QualityCertifier
              captures: { d1q_trans: $.data.transport_status, d1q_qual: $.data.quality_status }
            - call: "GET /gas-supply/deliveries"
              payload: { tank_id: "${t_ql}" }
              as: QualityCertifier
              captures: { d2_trig: "$.data[1].triggered_by", d2_qty: "$.data[1].quantity_liters" }
          assert:
            - "link 1: QualityCertificate.${qc_fail}.result == FAILED"
            - "Delivery.${d1q}.transport_status == REJECTED and quality_status == FAILED"
            - "link 2: a second Delivery exists for tank ${t_ql} with triggered_by == REDELIVERY and quantity_liters == 30000 (level unchanged at 20000 — deliveries never mutate tank level)"
            - "StorageTank.${t_ql}.current_level_liters == 20000 and status == REORDER_DUE"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: activate_state_beats_fiscal
        grounds:
          - validations[priority=4]
          - validations[priority=8]
          - errors[ERR_EVALUATION_NOT_ACCEPTED]
          - errors[ERR_CUSTOMER_CREDIT_WATCH]
        distinguishing_aspect: |
          Category pair state-vs-business_fiscal: the activation request
          violates BOTH ERR_EVALUATION_NOT_ACCEPTED (priority 4, state) and
          ERR_CUSTOMER_CREDIT_WATCH (priority 8, fiscal); the state error must
          win — a fiscal-first implementation returns the wrong error_id.
        test_recipe:
          setup:
            - "Customer WatchCo with credit_standing WATCH. Evaluation E1 (ONSITE) accepted; contract K_W created against E1; then E2 created and accepted for the same site, superseding E1."
          setup_api_calls:
            - *clock_init
            - call: "POST /gas-supply/customers"
              payload: { name: "WatchCo", segment: "METALS", credit_standing: "WATCH" }
              as: PlatformAdmin
              captures: { c_w: $.data.id }
            - call: "POST /gas-supply/supply-mode-evaluations"
              payload: { customer_id: "${c_w}", site_label: "MILL-1", demand_avg_nm3h: 5000, demand_peak_nm3h: 7000, required_purity_percent: 99.9, required_product: "H2", pipeline_available: true }
              as: SupplyPlanner
              captures: { e_w1: $.data.id }
            - call: "POST /gas-supply/supply-mode-evaluations/${e_w1}/accept"
              payload: {}
              as: CustomerOps
              as_user_id: "${c_w}"
            - call: "POST /gas-supply/supply-contracts"
              payload: { customer_id: "${c_w}", evaluation_id: "${e_w1}", term_months: 120, start_date: "2026-10-01", min_monthly_volume_nm3: 2000000, unit_price_cents_per_nm3: 12, monthly_facility_fee_cents: 500000, facility_fee_escalation_pct_annual: 0.03, base_power_index: 0.08, power_kwh_per_nm3: 0.42 }
              as: SupplyPlanner
              captures: { k_w: $.data.id }
            - call: "POST /gas-supply/supply-mode-evaluations"
              payload: { customer_id: "${c_w}", site_label: "MILL-1", demand_avg_nm3h: 5200, demand_peak_nm3h: 7200, required_purity_percent: 99.9, required_product: "H2", pipeline_available: true }
              as: SupplyPlanner
              captures: { e_w2: $.data.id }
            - call: "POST /gas-supply/supply-mode-evaluations/${e_w2}/accept"
              payload: {}
              as: CustomerOps
              as_user_id: "${c_w}"
          trigger:
            - call: "POST /gas-supply/supply-contracts/${k_w}/activate"
              payload: {}
              as: SupplyPlanner
              captures: { err_act: $.data.error_id }
          assert:
            - "the response is 409 with ${err_act} == ERR_EVALUATION_NOT_ACCEPTED (state, priority 4)"
            - "the response is NOT ERR_CUSTOMER_CREDIT_WATCH even though credit_standing == WATCH also fails (fiscal, priority 8)"
            - "SupplyContract.${k_w}.status remains DRAFT"

      - name: settlement_temporal_beats_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_PERIOD_OUT_OF_TERM]
          - errors[ERR_MAKEUP_CREDIT_EXCEEDED]
        distinguishing_aspect: |
          A DIFFERENT category pair — business_temporal vs business_fiscal:
          the settlement request violates BOTH ERR_PERIOD_OUT_OF_TERM (period
          2040-01 beyond end 2036-10) and ERR_MAKEUP_CREDIT_EXCEEDED
          (apply 9,999,999 > balance 3,600,000); the temporal error must win.
        test_recipe:
          setup:
            - "K_FAB ACTIVE with OPERATING plant; FINAL settlement for 2027-12 (metered 1,500,000 @ 0.10) already run, so makeup_credit_balance_cents == 3,600,000."
          setup_api_calls:
            - *clock_init
            - *mk_cust_fab
            - *mk_eval_fab
            - *accept_eval_fab
            - *mk_contract_fab
            - *activate_fab
            - *mk_plant_fab
            - *adv_fab_1
            - *adv_fab_2
            - *adv_fab_3
            - call: "POST /gas-supply/supply-contracts/${k_fab}/settlements"
              payload: { period_month: "2027-12", variant: "FINAL", metered_volume_nm3: 1500000, power_index_actual: 0.10 }
              as: BillingSpecialist
          trigger:
            - call: "POST /gas-supply/supply-contracts/${k_fab}/settlements"
              payload: { period_month: "2040-01", variant: "FINAL", metered_volume_nm3: 1000000, power_index_actual: 0.10, apply_makeup_cents: 9999999 }
              as: BillingSpecialist
              captures: { err_set: $.data.error_id }
          assert:
            - "the response is 422 with ${err_set} == ERR_PERIOD_OUT_OF_TERM (temporal, priority 6)"
            - "the response is NOT ERR_MAKEUP_CREDIT_EXCEEDED even though apply_makeup_cents 9999999 > balance 3600000 also fails (fiscal, priority 8)"
            - "SupplyContract.${k_fab}.makeup_credit_balance_cents still == 3600000"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: mode_threshold_exact_boundary
        grounds:
          - calculations.mode_recommendation
          - endpoints.POST_/gas-supply/supply-mode-evaluations
        distinguishing_aspect: |
          Metric: hourly demand at the ONSITE threshold — demand_avg_nm3h
          exactly 4000 takes ONSITE_PLANT (>= boundary) while 3999.99 falls to
          PIPELINE; reachable through POST /gas-supply/supply-mode-evaluations.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Customer Fabrikam exists."
          setup_api_calls:
            - *clock_init
            - *mk_cust_fab
          trigger:
            - call: "POST /gas-supply/supply-mode-evaluations"
              payload: { customer_id: "${c_fab}", site_label: "S-HI", demand_avg_nm3h: 4000, demand_peak_nm3h: 5000, required_purity_percent: 99.9, required_product: "N2", pipeline_available: true }
              as: SupplyPlanner
              captures: { e_hi_mode: $.data.recommended_mode }
            - call: "POST /gas-supply/supply-mode-evaluations"
              payload: { customer_id: "${c_fab}", site_label: "S-LO", demand_avg_nm3h: 3999.99, demand_peak_nm3h: 5000, required_purity_percent: 99.9, required_product: "N2", pipeline_available: true }
              as: SupplyPlanner
              captures: { e_lo_mode: $.data.recommended_mode }
          assert:
            - "${e_hi_mode} == ONSITE_PLANT (demand exactly at 4000 threshold, >= semantics)"
            - "${e_lo_mode} == PIPELINE (3999.99 < 4000 and pipeline_available with >= 1500)"

      - name: tank_reorder_point_exact_trigger
        grounds:
          - calculations.delivery_auto_trigger
          - entities.StorageTank.fields.reorder_point_liters
        distinguishing_aspect: |
          A DIFFERENT metric (tank level liters, not demand nm3/h) reachable
          through a DIFFERENT endpoint (POST telemetry): level exactly equal to
          reorder_point_liters triggers (<= semantics) while one liter above
          does not.
        test_recipe:
          setup:
            - "Customer Fabrikam; tanks T_EQ and T_GT both capacity 50,000, reorder 20,000, safety 5,000."
          setup_api_calls:
            - *clock_init
            - *mk_cust_fab
            - call: "POST /gas-supply/storage-tanks"
              payload: { customer_id: "${c_fab}", site_label: "FAB-1", product: "N2", capacity_liters: 50000, reorder_point_liters: 20000, safety_stock_liters: 5000, required_purity_percent: 99.9, max_impurity_ppm: 50 }
              as: PlantOperator
              captures: { t_eq: $.data.id }
            - call: "POST /gas-supply/storage-tanks"
              payload: { customer_id: "${c_fab}", site_label: "FAB-1", product: "N2", capacity_liters: 50000, reorder_point_liters: 20000, safety_stock_liters: 5000, required_purity_percent: 99.9, max_impurity_ppm: 50 }
              as: PlantOperator
              captures: { t_gt: $.data.id }
            - call: "POST /gas-supply/storage-tanks/${t_eq}/telemetry"
              payload: { measured_at: "2026-10-01T00:00:00Z", level_liters: 25000 }
              as: TelemetryGateway
            - call: "POST /gas-supply/storage-tanks/${t_gt}/telemetry"
              payload: { measured_at: "2026-10-01T00:00:00Z", level_liters: 25000 }
              as: TelemetryGateway
          trigger:
            - call: "POST /gas-supply/storage-tanks/${t_eq}/telemetry"
              payload: { measured_at: "2026-10-01T05:00:00Z", level_liters: 20000 }
              as: TelemetryGateway
              captures: { eq_status: $.data.status }
            - call: "POST /gas-supply/storage-tanks/${t_gt}/telemetry"
              payload: { measured_at: "2026-10-01T05:00:00Z", level_liters: 20001 }
              as: TelemetryGateway
              captures: { gt_status: $.data.status }
          assert:
            - "StorageTank.${t_eq}.status == REORDER_DUE at level exactly 20000 (<= triggers)"
            - "a TELEMETRY Delivery exists for ${t_eq} with quantity_liters == 30000"
            - "StorageTank.${t_gt}.status == NORMAL at 20001 and GET /gas-supply/deliveries?tank_id=${t_gt} returns 0 rows"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: activate_requires_evaluation_accepted
        grounds:
          - state_machines.SupplyContract.DRAFT_to_ACTIVE
          - state_machines.SupplyModeEvaluation.ACCEPTED_to_SUPERSEDED
        distinguishing_aspect: |
          Entity pair SupplyContract <-> SupplyModeEvaluation: activation of a
          contract is gated on the CURRENT state of a different entity (its
          evaluation); superseding the evaluation after contract creation
          makes a previously-valid contract non-activatable.
        test_recipe:
          setup:
            - "Customer Fabrikam PRIME (credit fine). E1 accepted, K_X created against E1, then E2 accepted superseding E1."
          setup_api_calls:
            - *clock_init
            - *mk_cust_fab
            - *mk_eval_fab
            - *accept_eval_fab
            - *mk_contract_fab
            - call: "POST /gas-supply/supply-mode-evaluations"
              payload: { customer_id: "${c_fab}", site_label: "FAB-1", demand_avg_nm3h: 5100, demand_peak_nm3h: 7100, required_purity_percent: 99.999, required_product: "N2", pipeline_available: true }
              as: SupplyPlanner
              captures: { e_fab2: $.data.id }
            - call: "POST /gas-supply/supply-mode-evaluations/${e_fab2}/accept"
              payload: {}
              as: CustomerOps
              as_user_id: "${c_fab}"
          trigger:
            - call: "POST /gas-supply/supply-contracts/${k_fab}/activate"
              payload: {}
              as: SupplyPlanner
              captures: { err_x: $.data.error_id }
          assert:
            - "SupplyModeEvaluation.${e_fab}.status == SUPERSEDED (accepting the sibling superseded it)"
            - "activation rejected: ${err_x} == ERR_EVALUATION_NOT_ACCEPTED"
            - "SupplyContract.${k_fab}.status remains DRAFT"

      - name: plant_create_requires_active_contract
        grounds:
          - state_machines.OnsitePlant
          - validations[priority=4]
          - errors[ERR_CONTRACT_NOT_ACTIVE]
        distinguishing_aspect: |
          A DIFFERENT entity pair — OnsitePlant <-> SupplyContract: plant
          creation is gated on the contract's state, so the same plant payload
          succeeds after activation but fails while the contract is DRAFT.
        test_recipe:
          setup:
            - "Customer Fabrikam; evaluation accepted; contract K_FAB created but NEVER activated (still DRAFT)."
          setup_api_calls:
            - *clock_init
            - *mk_cust_fab
            - *mk_eval_fab
            - *accept_eval_fab
            - *mk_contract_fab
          trigger:
            - call: "POST /gas-supply/onsite-plants"
              payload: { contract_id: "${k_fab}", name: "FAB-1 ASU", nameplate_capacity_nm3h: 6000, capital_cost_cents: 120000000, power_kwh_per_nm3: 0.42 }
              as: PlantOperator
              captures: { err_pl: $.data.error_id }
          assert:
            - "plant creation rejected: ${err_pl} == ERR_CONTRACT_NOT_ACTIVE"
            - "GET /gas-supply/onsite-plants?contract_id=${k_fab} returns 0 rows"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: turnaround_halfopen_adjacency_allowed
        grounds:
          - state_machines.Turnaround.AGREED_to_SCHEDULED
          - errors[ERR_TURNAROUND_OVERLAP]
        distinguishing_aspect: |
          Resource OnsitePlant with HALF-OPEN interval semantics: a turnaround
          starting exactly when another ends (end == start) does NOT overlap
          and schedules, while one overlapping by one hour is rejected with
          ERR_TURNAROUND_OVERLAP.
        test_recipe:
          setup:
            - "K_FAB ACTIVE, P_FAB OPERATING. TA1 [2026-11-01T00:00:00Z, 2026-11-05T00:00:00Z) SCHEDULED."
          setup_api_calls:
            - *clock_init
            - *mk_cust_fab
            - *mk_eval_fab
            - *accept_eval_fab
            - *mk_contract_fab
            - *activate_fab
            - *mk_plant_fab
            - *adv_fab_1
            - *adv_fab_2
            - *adv_fab_3
            - call: "POST /gas-supply/onsite-plants/${p_fab}/turnarounds"
              payload: { window_start: "2026-11-01T00:00:00Z", window_end: "2026-11-05T00:00:00Z", scope: "TA1 exchanger" }
              as: PlantOperator
              captures: { ta_a: $.data.id, ta_a_v: $.data.version }
            - call: "POST /gas-supply/turnarounds/${ta_a}/respond"
              payload: { decision: "AGREE", expected_turnaround_version: "${ta_a_v}" }
              as: CustomerOps
              as_user_id: "${c_fab}"
            - call: "POST /gas-supply/turnarounds/${ta_a}/schedule"
              payload: {}
              as: PlantOperator
          trigger:
            - call: "POST /gas-supply/onsite-plants/${p_fab}/turnarounds"
              payload: { window_start: "2026-11-05T00:00:00Z", window_end: "2026-11-09T00:00:00Z", scope: "TA2 adjacent turbine" }
              as: PlantOperator
              captures: { ta_b: $.data.id, ta_b_v: $.data.version }
            - call: "POST /gas-supply/turnarounds/${ta_b}/respond"
              payload: { decision: "AGREE", expected_turnaround_version: "${ta_b_v}" }
              as: CustomerOps
              as_user_id: "${c_fab}"
            - call: "POST /gas-supply/turnarounds/${ta_b}/schedule"
              payload: {}
              as: PlantOperator
              captures: { ta_b_stat: $.data.status }
            - call: "POST /gas-supply/onsite-plants/${p_fab}/turnarounds"
              payload: { window_start: "2026-11-04T00:00:00Z", window_end: "2026-11-06T00:00:00Z", scope: "TA3 overlapping" }
              as: PlantOperator
              captures: { ta_c: $.data.id, ta_c_v: $.data.version }
            - call: "POST /gas-supply/turnarounds/${ta_c}/respond"
              payload: { decision: "AGREE", expected_turnaround_version: "${ta_c_v}" }
              as: CustomerOps
              as_user_id: "${c_fab}"
            - call: "POST /gas-supply/turnarounds/${ta_c}/schedule"
              payload: {}
              as: PlantOperator
              captures: { err_ov: $.data.error_id }
          assert:
            - "adjacent TA2 scheduled: Turnaround.${ta_b}.status == SCHEDULED (half-open [start,end): end == start is NOT an overlap)"
            - "overlapping TA3 rejected: ${err_ov} == ERR_TURNAROUND_OVERLAP"
            - "Turnaround.${ta_c}.status remains AGREED"

      - name: pipeline_aggregate_capacity_exact_fit
        grounds:
          - calculations.pipeline_capacity_aggregation
          - errors[ERR_PIPELINE_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          A DIFFERENT resource (PipelineNetwork) with DIFFERENT interval
          semantics — aggregate capacity, not geometric intervals: connections
          freely 'overlap' in time and coexist until the SUM of reserved flows
          reaches nameplate; exact fit (reserved == nameplate) is admitted and
          one unit over is rejected.
        test_recipe:
          setup:
            - "Network N_MAIN nameplate 10,000. K_MET (PIPELINE contract for customer MetCo, min 800,000) DRAFT with PRIMARY connection 6,000 then ACTIVE. K_FAB DRAFT."
          setup_api_calls:
            - *clock_init
            - &mk_network_main
              call: "POST /gas-supply/pipeline-networks"
              payload: { name: "Gulf Coast N2", nameplate_capacity_nm3h: 10000 }
              as: PlatformAdmin
              captures: { n_main: $.data.id }
            - &mk_cust_met
              call: "POST /gas-supply/customers"
              payload: { name: "MetCo", segment: "METALS", credit_standing: "PRIME" }
              as: PlatformAdmin
              captures: { c_met: $.data.id }
            - &mk_eval_met
              call: "POST /gas-supply/supply-mode-evaluations"
              payload: { customer_id: "${c_met}", site_label: "MILL-9", demand_avg_nm3h: 2000, demand_peak_nm3h: 2600, required_purity_percent: 99.9, required_product: "N2", pipeline_available: true }
              as: SupplyPlanner
              captures: { e_met: $.data.id }
            - &accept_eval_met
              call: "POST /gas-supply/supply-mode-evaluations/${e_met}/accept"
              payload: {}
              as: CustomerOps
              as_user_id: "${c_met}"
            - &mk_contract_met
              call: "POST /gas-supply/supply-contracts"
              payload: { customer_id: "${c_met}", evaluation_id: "${e_met}", term_months: 120, start_date: "2026-10-01", min_monthly_volume_nm3: 800000, unit_price_cents_per_nm3: 10, monthly_facility_fee_cents: 200000, facility_fee_escalation_pct_annual: 0.02, base_power_index: 0.08, power_kwh_per_nm3: 0.30 }
              as: SupplyPlanner
              captures: { k_met: $.data.id }
            - &conn_pri_met
              call: "POST /gas-supply/pipeline-connections"
              payload: { network_id: "${n_main}", contract_id: "${k_met}", reserved_flow_nm3h: 6000, purpose: "PRIMARY" }
              as: PipelineDispatcher
              captures: { cn_pri: $.data.id }
            - call: "POST /gas-supply/supply-contracts/${k_met}/activate"
              payload: {}
              as: SupplyPlanner
            - *mk_cust_fab
            - *mk_eval_fab
            - *accept_eval_fab
            - *mk_contract_fab
          trigger:
            - call: "POST /gas-supply/pipeline-connections"
              payload: { network_id: "${n_main}", contract_id: "${k_fab}", reserved_flow_nm3h: 4000, purpose: "BACKUP" }
              as: PipelineDispatcher
              captures: { cn_bak: $.data.id }
            - call: "GET /gas-supply/pipeline-networks/${n_main}"
              payload: {}
              as: PipelineDispatcher
              captures: { n_res: $.data.reserved_capacity_nm3h, n_avail: $.data.available_capacity_nm3h }
            - call: "POST /gas-supply/pipeline-connections"
              payload: { network_id: "${n_main}", contract_id: "${k_fab}", reserved_flow_nm3h: 1, purpose: "BACKUP" }
              as: PipelineDispatcher
              captures: { err_cap: $.data.error_id }
          assert:
            - "exact fit admitted: BACKUP 4000 on top of PRIMARY 6000 succeeds (6000 + 4000 == nameplate 10000)"
            - "after exact fit: PipelineNetwork.${n_main}.reserved_capacity_nm3h == 10000 and available_capacity_nm3h == 0"
            - "one unit over rejected: ${err_cap} == ERR_PIPELINE_CAPACITY_EXCEEDED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: pipeline_capacity_conservation
        grounds:
          - calculations.pipeline_capacity_aggregation
          - state_machines.PipelineConnection.ACTIVE_to_RELEASED
        distinguishing_aspect: |
          Conserved quantity: network capacity — the forward action (connection
          create +6000, +4000) paired with its compensating action (release
          -6000) leaves reserved + available == nameplate == 10000 at every
          observed step; a cascade that drifted would break the equality.
        test_recipe:
          setup:
            - "N_MAIN 10,000; K_MET ACTIVE with PRIMARY connection 6,000; K_FAB DRAFT with BACKUP connection 4,000."
          setup_api_calls:
            - *clock_init
            - *mk_network_main
            - *mk_cust_met
            - *mk_eval_met
            - *accept_eval_met
            - *mk_contract_met
            - *conn_pri_met
            - call: "POST /gas-supply/supply-contracts/${k_met}/activate"
              payload: {}
              as: SupplyPlanner
            - *mk_cust_fab
            - *mk_eval_fab
            - *accept_eval_fab
            - *mk_contract_fab
            - call: "POST /gas-supply/pipeline-connections"
              payload: { network_id: "${n_main}", contract_id: "${k_fab}", reserved_flow_nm3h: 4000, purpose: "BACKUP" }
              as: PipelineDispatcher
              captures: { cn_bak2: $.data.id }
          trigger:
            - call: "POST /gas-supply/pipeline-connections/${cn_pri}/release"
              payload: {}
              as: PipelineDispatcher
              captures: { cn_pri_stat: $.data.status }
            - call: "GET /gas-supply/pipeline-networks/${n_main}"
              payload: {}
              as: PipelineDispatcher
              captures: { n_res2: $.data.reserved_capacity_nm3h, n_avail2: $.data.available_capacity_nm3h }
          assert:
            - "PipelineConnection.${cn_pri}.status == RELEASED (compensating action applied)"
            - "after release: reserved_capacity_nm3h == 4000 and available_capacity_nm3h == 6000"
            - "invariant: ${n_res2} + ${n_avail2} == 10000 == nameplate (unchanged by the create/release pair)"
            - "BACKUP connection ${cn_bak2} remains ACTIVE"

      - name: makeup_credit_bank_conservation
        grounds:
          - calculations.makeup_credit_ledger
          - entities.SupplyContract.fields.makeup_credit_balance_cents
        distinguishing_aspect: |
          A DIFFERENT conserved quantity — makeup credit cents: across two
          FINAL settlements, sum(granted) == sum(applied) + current bank
          balance, i.e. 3,600,000 == 1,000,000 + 2,600,000; the period that
          grants (shortfall) and the period that applies (draw-down) are the
          forward/compensating pair.
        test_recipe:
          setup:
            - "K_FAB ACTIVE with OPERATING plant."
          setup_api_calls:
            - *clock_init
            - *mk_cust_fab
            - *mk_eval_fab
            - *accept_eval_fab
            - *mk_contract_fab
            - *activate_fab
            - *mk_plant_fab
            - *adv_fab_1
            - *adv_fab_2
            - *adv_fab_3
          trigger:
            - call: "POST /gas-supply/supply-contracts/${k_fab}/settlements"
              payload: { period_month: "2027-12", variant: "FINAL", metered_volume_nm3: 1500000, power_index_actual: 0.10 }
              as: BillingSpecialist
              captures: { st1_grant: $.data.makeup_credit_granted_cents, st1_applied: $.data.makeup_credit_applied_cents }
            - call: "POST /gas-supply/supply-contracts/${k_fab}/settlements"
              payload: { period_month: "2028-01", variant: "FINAL", metered_volume_nm3: 2100000, power_index_actual: 0.10, apply_makeup_cents: 1000000 }
              as: BillingSpecialist
              captures: { st2_grant: $.data.makeup_credit_granted_cents, st2_applied: $.data.makeup_credit_applied_cents, st2_total: $.data.total_due_cents }
            - call: "GET /gas-supply/supply-contracts/${k_fab}"
              payload: {}
              as: BillingSpecialist
              captures: { k_bal2: $.data.makeup_credit_balance_cents }
          assert:
            - "period 2027-12: makeup_credit_granted_cents == 3600000 and applied == 0"
            - "period 2028-01: granted == 0, applied == 1000000, total_due_cents == 25732640"
            - "final bank: SupplyContract.${k_fab}.makeup_credit_balance_cents == 2600000"
            - "invariant: (${st1_grant} + ${st2_grant}) == (${st1_applied} + ${st2_applied}) + ${k_bal2}  ->  3600000 == 1000000 + 2600000"
