  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: auditor_calendar_half_open_overlap
        grounds:
          - calculations.auditor_calendar_overlap
          - errors[ERR_APPOINTMENT_OVERLAP]
        distinguishing_aspect: |
          Half-open interval semantics on the Auditor resource: an appointment starting exactly at another's end
          ([09:00,11:00) vs [11:00,12:00)) is allowed; one minute of true intersection (10:30 start) is rejected
          with ERR_APPOINTMENT_OVERLAP.
        test_recipe:
          setup:
            - "three PHYSICAL work orders (policies WC-1600A/B/C, terms 2026-01-01..2026-07-31) all assigned to one auditor; work order A holds appointment 2026-08-10T09:00-11:00Z"
