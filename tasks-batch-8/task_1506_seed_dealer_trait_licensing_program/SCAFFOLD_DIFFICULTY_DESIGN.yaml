              captures: { pay3: $.data.payment_status, ful3: $.data.fulfillment_status }
          assert:
            - "at confirm: payment_status == UNPAID and fulfillment_status == NONE"
            - "after prepay 582912 (= 633600 - round_half_up(633600 x 0.08)): payment_status == PREPAID and fulfillment_status == NONE"
            - "after first completion (25 of 40): fulfillment_status == PARTIAL while payment_status == PREPAID"
            - "after second completion (15): fulfillment_status == DELIVERED while payment_status == PREPAID (delivery never touches the payment axis)"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (2 instances, different triggers, depth >= 3 and >= 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: agreement_suspend_cascades_order_hold_reservation_release_statement_drop
        grounds:
          - state_machines.TraitAgreement.ACTIVE_to_SUSPENDED
          - state_machines.SeedOrder.CONFIRMED_to_COMPLIANCE_HOLD
          - calculations.commission_accrual
          - entities.OrderLine.fields.reserved_units
          - entities.InventoryLot.fields.reserved_units
        distinguishing_aspect: |
          Trigger: POST /dealer/trait-agreements/{id}/suspend. Depth-4 chain, each link
          caused by the previous: agreement SUSPENDED -> order COMPLIANCE_HOLD -> line
          reservations released -> lot reserved_units drops -> commission provisional
          inclusion set loses the order (recompute yields net_sales 0). Distinct trigger
          and propagation pattern from the replant-approval cascade.
        test_recipe:
          setup:
            - "Program OPEN; grower G with SIGNED VT2P agreement; traited variety CORN-V1 @25000 (trait_package VT2P)"
            - "Lot of 500 untreated CORN-V1 units"
            - "Order with 100 units of CORN-V1 confirmed 2027-01-10 (tier-3 600bps -> per-unit 23500, net 2350000); lot reserved_units == 100"
