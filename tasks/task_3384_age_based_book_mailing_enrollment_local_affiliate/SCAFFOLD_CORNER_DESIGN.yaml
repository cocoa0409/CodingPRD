  # ===========================================================================
  - section: validations
    instances:
      - name: coordinator_approve_unknown_agreement_returns_forbidden
        claim_type: Priority Ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "Role authorization (p2) beats existence (p3): a coordinator approving a non-existent agreement gets 403 ERR_FORBIDDEN, never a 404 that would leak existence."
        test_recipe:
          setup: ["Clock set; program; affiliate (no agreements)."]
          setup_api_calls:
            - *c_sep
            - *prog
            - *aff_a
          trigger:
            - call: "POST /library/agreements/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/approve"
              payload: {}
              as: AffiliateCoordinator
              as_user_id: "${aff_a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "status 403 and data.error_id == \"ERR_FORBIDDEN\""

      - name: approve_unknown_agreement_returns_not_found
        claim_type: Priority Ordering
        grounds:
          - validations[priority=3]
          - errors.ERR_AGREEMENT_NOT_FOUND
        distinguishing_aspect: "Existence (p3) beats state (p7): a properly-roled officer approving a non-existent agreement gets 404 ERR_AGREEMENT_NOT_FOUND, not ERR_INVALID_STATE."
        test_recipe:
          setup: ["Clock set; program."]
          setup_api_calls:
            - *c_sep
            - *prog
          trigger:
            - call: "POST /library/agreements/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/approve"
              payload: {}
              as: StateProgramOfficer
              as_user_id: "${prog_id}"
              captures: { err: $.data.error_id }
          assert:
            - "status 404 and data.error_id == \"ERR_AGREEMENT_NOT_FOUND\""

      - name: duplicate_registration_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=10]
          - errors.ERR_DUPLICATE_REGISTRATION
        distinguishing_aspect: "Same (affiliate, birth_date, postal_prefix, case-insensitive family_name) as a non-terminal child -> 409; the duplicate detector fires even when the family name's letter case differs."
        test_recipe:
          setup: ["Bootstrap core; c1 registered (Barnes, 2026-05-10, 37201)."]
          setup_api_calls:
            - *c_sep
            - *prog
            - *aff_a
            - *agr_a
            - *agr_a_ok
            - *c1
          trigger:
            - call: "POST /library/children"
              payload: { affiliate_id: "${aff_a_id}", full_name: "Ada BARNES", family_name: "barnes", birth_date: "2026-05-10T00:00:00Z", mailing_address: { line1: "99 Other St", city: "Nashville", region: "TN", postal_code: "37201", country: "US" } }
              as: AffiliateCoordinator
              as_user_id: "${aff_a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "status 409 and data.error_id == \"ERR_DUPLICATE_REGISTRATION\""
            - "Affiliate.${aff_a_id}.enrolled_count remains 1"

      - name: registration_address_outside_geography_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=11]
          - errors.ERR_ADDRESS_NOT_COVERED
        distinguishing_aspect: "postal_prefix derived from the mailing address must be a member of the affiliate's postal_prefixes array; 99999 -> \"999\" is not in [\"372\",\"370\"]."
        test_recipe:
          setup: ["Bootstrap core; affiliate A operative."]
          setup_api_calls:
            - *c_sep
            - *prog
            - *aff_a
            - *agr_a
            - *agr_a_ok
          trigger:
            - call: "POST /library/children"
              payload: { affiliate_id: "${aff_a_id}", full_name: "Far Away", family_name: "Away", birth_date: "2026-03-01T00:00:00Z", mailing_address: { line1: "1 Far St", city: "Nowhere", region: "AK", postal_code: "99999", country: "US" } }
              as: AffiliateCoordinator
              as_user_id: "${aff_a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "status 422 and data.error_id == \"ERR_ADDRESS_NOT_COVERED\""

      - name: registration_without_active_agreement_rejected
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=11]
          - errors.ERR_AFFILIATE_NOT_OPERATIVE
          - entities.Affiliate.fields.operative
        distinguishing_aspect: "Registration requires the affiliate's agreement to be ACTIVE and covering the current logical month; a never-approved agreement leaves the affiliate non-operative and registration fails 409."
        test_recipe:
          setup: ["Clock set; program; affiliate with agreement created but never approved."]
          setup_api_calls:
            - *c_sep
            - *prog
            - *aff_a
            - *agr_a
          trigger:
            - call: "POST /library/children"
              payload: { affiliate_id: "${aff_a_id}", full_name: "Too Early", family_name: "Early", birth_date: "2026-03-01T00:00:00Z", mailing_address: { line1: "1 Oak St", city: "Nashville", region: "TN", postal_code: "37201", country: "US" } }
              as: AffiliateCoordinator
              as_user_id: "${aff_a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "status 409 and data.error_id == \"ERR_AFFILIATE_NOT_OPERATIVE\""
            - "Affiliate.${aff_a_id}.operative == false"

      - name: selection_outside_title_window_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=11]
          - errors.ERR_TITLE_UNAVAILABLE_MONTH
        distinguishing_aspect: "The title's availability window is inclusive: a title available 2026-01..2026-06 accepts a 2026-06 selection but rejects 2026-08 with 422."
        test_recipe:
          setup: ["Clock set; short-window title."]
          setup_api_calls:
            - *c_sep
            - call: "POST /library/titles"
              payload: { title_name: "Short Run Book", author: "S Short", age_band: "TWO", available_from_month: "2026-01", available_until_month: "2026-06" }
              as: PlatformAdmin
              captures: { t_short: $.data.id }
          trigger:
            - call: "POST /library/selections"
              payload: { mailing_month: "2026-08", age_band: "TWO", title_id: "${t_short}" }
              as: AdvisoryCommitteeMember
              as_user_id: "acm-ada"
              captures: { err: $.data.error_id }
          assert:
            - "status 422 and data.error_id == \"ERR_TITLE_UNAVAILABLE_MONTH\""
            - "a selection for 2026-06 (window edge, inclusive) would succeed"

      - name: wave_for_past_month_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=9]
          - errors.ERR_WAVE_MONTH_PAST
        distinguishing_aspect: "Wave mailing_month must be >= the current logical month; 2026-08 at clock 2026-09-01 fails 422."
        test_recipe:
          setup: ["Clock set 2026-09-01."]
          setup_api_calls:
            - *c_sep
          trigger:
            - call: "POST /library/waves"
              payload: { mailing_month: "2026-08" }
              as: MailOps
              captures: { err: $.data.error_id }
          assert:
            - "status 422 and data.error_id == \"ERR_WAVE_MONTH_PAST\""

      - name: agreement_window_inverted_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=9]
          - errors.ERR_AGREEMENT_WINDOW_INVALID
        distinguishing_aspect: "effective_to must be strictly after effective_from; an inverted (or empty) window fails 422 at creation."
        test_recipe:
          setup: ["Clock set; program; affiliate."]
          setup_api_calls:
            - *c_sep
            - *prog
            - *aff_a
          trigger:
            - call: "POST /library/affiliates/${aff_a_id}/agreements"
              payload: { effective_from: "2027-01-01T00:00:00Z", effective_to: "2026-01-01T00:00:00Z", local_fundraising_commitment_cents: 100, expected_affiliate_version: "${aff_a_v}" }
              as: AffiliateCoordinator
              as_user_id: "${aff_a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "status 422 and data.error_id == \"ERR_AGREEMENT_WINDOW_INVALID\""
            - "Affiliate.${aff_a_id}.version remains 1 (failed create must not bump the OCC version)"

      - name: selection_self_approval_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=8]
          - errors.ERR_SELF_APPROVAL_FORBIDDEN
        distinguishing_aspect: "Segregation of duties: the proposer's own X-User-ID on the approve call fails 403 ERR_SELF_APPROVAL_FORBIDDEN even though the role is correct."
        test_recipe:
          setup: ["Clock set; title; selection proposed by acm-ada."]
          setup_api_calls:
            - *c_sep
            - *t_inf
            - call: "POST /library/selections"
              payload: { mailing_month: "2026-10", age_band: "INFANT", title_id: "${t_inf}" }
              as: AdvisoryCommitteeMember
              as_user_id: "acm-ada"
              captures: { sel_self: $.data.id }
          trigger:
            - call: "POST /library/selections/${sel_self}/approve"
              payload: {}
              as: AdvisoryCommitteeMember
              as_user_id: "acm-ada"
              captures: { err: $.data.error_id }
          assert:
            - "status 403 and data.error_id == \"ERR_SELF_APPROVAL_FORBIDDEN\""
            - "AgeBandSelection.${sel_self}.status remains PROPOSED and approved_by is null"

      - name: manifest_with_insufficient_stock_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=12]
          - errors.ERR_INVENTORY_SHORTFALL
        distinguishing_aspect: "All five bands are LOCKED but the INFANT title has only 1 unit confirmed against a demand of 2 — manifest fails 409 ERR_INVENTORY_SHORTFALL and creates no items at all."
        test_recipe:
          setup: ["Bootstrap core; five 2026-10 selections approved; INFANT print order qty 1 confirmed; other four bands qty 6000 confirmed; children c1 and c2 (both INFANT band)."]
          setup_api_calls:
            - *c_sep
            - *prog
            - *aff_a
            - *agr_a
            - *agr_a_ok
            - *t_inf
            - *t_tod
            - *t_two
            - *t_three
            - *t_four
            - *s_inf_o
            - *s_inf_o_ok
            - *s_tod_o
            - *s_tod_o_ok
            - *s_two_o
            - *s_two_o_ok
            - *s_three_o
            - *s_three_o_ok
            - *s_four_o
            - *s_four_o_ok
            - call: "POST /library/print-orders"
              payload: { selection_id: "${sel_inf_o}", quantity: 1, is_reprint: false }
              as: PublisherOps
              captures: { po_tiny: $.data.id }
            - call: "POST /library/print-orders/${po_tiny}/confirm"
              payload: {}
              as: PublisherOps
            - *p_tod_o
            - *p_tod_o_ok
            - *p_two_o
            - *p_two_o_ok
            - *p_three_o
            - *p_three_o_ok
            - *p_four_o
            - *p_four_o_ok
            - *c1
            - *c2
            - *wave_o
          trigger:
            - call: "POST /library/waves/${wave_o_id}/manifest"
              payload: {}
              as: MailOps
              captures: { err: $.data.error_id }
          assert:
            - "status 409 and data.error_id == \"ERR_INVENTORY_SHORTFALL\""
            - "MailingWave.${wave_o_id}.status remains SCHEDULED and manifested_item_count == 0"
            - "Title.${t_inf}.stock_on_hand remains 1 (no partial debit)"

      - name: dispute_credit_above_gross_rejected
        claim_type: Violation → Error
        grounds:
          - state_machines.AffiliateInvoice.DISPUTED_to_ADJUSTED
          - errors.ERR_CREDIT_EXCEEDS_GROSS
        distinguishing_aspect: "RESOLVE_UPHELD requires 0 < credit_amount_cents <= gross_cents; 673 against a 672 gross fails 422 and the invoice stays DISPUTED."
        test_recipe:
          setup: ["Full bootstrap through reconcile; invoice issued then disputed (OPEN)."]
          setup_api_calls:
            - *c_sep
            - *prog
            - *aff_a
            - *agr_a
            - *agr_a_ok
            - *t_inf
            - *t_tod
            - *t_two
            - *t_three
            - *t_four
            - *s_inf_o
            - *s_inf_o_ok
            - *s_tod_o
            - *s_tod_o_ok
            - *s_two_o
            - *s_two_o_ok
            - *s_three_o
            - *s_three_o_ok
            - *s_four_o
            - *s_four_o_ok
            - *p_inf_o
            - *p_inf_o_ok
            - *p_tod_o
            - *p_tod_o_ok
            - *p_two_o
            - *p_two_o_ok
            - *p_three_o
            - *p_three_o_ok
            - *p_four_o
            - *p_four_o_ok
            - *c1
            - *c2
            - *c3
            - *wave_o
            - *wave_o_go
            - *wave_o_rec
            - *inv_o
            - call: "POST /library/invoices/${inv_o_id}/issue"
              payload: {}
              as: PlatformAdmin
            - call: "POST /library/invoices/${inv_o_id}/dispute"
              payload: { outcome: "OPEN" }
              as: AffiliateCoordinator
              as_user_id: "${aff_a_id}"
          trigger:
