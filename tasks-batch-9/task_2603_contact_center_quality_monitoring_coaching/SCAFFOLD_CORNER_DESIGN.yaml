              as: Agent
              as_user_id: "${ag2}"
            - call: "POST /disputes"
              payload: { evaluation_id: "${e1}", disputed_behavior_codes: ["RESOLVE"], rationale: "The next step was agreed with the customer.", expected_evaluation_version: "${e1v}" }
              as: Agent
              as_user_id: "${ag1}"
              captures: { d1: $.data.id }
            - call: "POST /disputes/${d1}/review"
              payload: {}
              as: QualityEvaluator
              as_user_id: "${ev1}"
            - call: "POST /disputes/${d1}/review"
              payload: {}
              as: QualityEvaluator
              as_user_id: "${ev2}"
            - call: "POST /disputes/${d1}/resolve"
              payload: { outcome: "REJECTED", outcome_note: "Resolved by the author." }
              as: QualityEvaluator
              as_user_id: "${ev1}"
            - call: "POST /disputes/${d1}/resolve"
              payload: { outcome: "REJECTED", outcome_note: "The transcript shows no next step was agreed." }
              as: QualityEvaluator
              as_user_id: "${ev2}"
            - call: "POST /evaluations"
              payload: { selection_id: "${sel2}" }
              as: QualityEvaluator
              as_user_id: "${ev1}"
              captures: { e2: $.data.id }
          assert:
            - "trigger 1 -> HTTP 403 ERR_NOT_RESOURCE_OWNER: ${sel2}.assigned_evaluator_id is ${ev1}, so Ravi may not open the evaluation despite holding the right role; no Evaluation row is created"
            - "trigger 2 -> HTTP 403 ERR_NOT_RESOURCE_OWNER: ${e1}.agent_id is ${ag1}, so Ben cannot acknowledge Ada's scorecard, and Evaluation.${e1}.feedback_status stays DELIVERED with agreement null"
            - "trigger 3 -> HTTP 403 ERR_NOT_RESOURCE_OWNER -- NOT 422 and NOT 409: ownership at priority 6 is decided before the dispute window at 48 and the duplicate rule at 41, and GET /disputes?evaluation_id=${e1} still returns total_count 0"
            - "trigger 4 -> HTTP 201 for the owning agent: Dispute.${d1}.status == SUBMITTED and agent_id == ${ag1}"
            - "trigger 5 -> HTTP 403 ERR_SEGREGATION_OF_DUTIES: ${ev1} authored ${e1}; the dispute is SUBMITTED and therefore perfectly reviewable, so only the identity rule can be refusing it, and reviewer_evaluator_id stays null"
            - "trigger 6 -> HTTP 200: the independent ${ev2} takes it, status == UNDER_REVIEW and reviewer_evaluator_id == ${ev2}"
            - "trigger 7 -> HTTP 403 ERR_SEGREGATION_OF_DUTIES: the author cannot resolve either, and Dispute.${d1}.status is still UNDER_REVIEW"
            - "trigger 8 -> HTTP 200: Dispute.${d1}.status == REJECTED with the reviewer's note, and Evaluation.${e1}.weighted_score is still 82.00 with adjusted_weighted_score null"
            - "trigger 9 -> HTTP 201: the assignee ${ev1} opens the very selection Ravi was refused in trigger 1, so Evaluation.${e2}.evaluator_id == ${ev1} and review_status == DRAFT"

  # =========================================================================
  # 8. From Table 8 (Cross-Cutting Complexity Layers)
  # =========================================================================
  - section: complexity_layers
    instances:
      - name: complexity_occ_interaction_version_rejects_stale_scan_then_supersedes
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.optimistic_concurrency[0]
          - errors[ERR_STALE_INTERACTION_VERSION]
          - validations[priority=8]
          - endpoints[POST /analytics-scans]
          - state_machines.AnalyticsScan
        distinguishing_aspect: "The interaction's version is moved by a foreign write -- the ComplianceAuditor's consent review -- so the version the scanner read at creation is already stale before it ever posts, and the retry must re-read. Then the successful scan itself bumps the same counter, so replaying the exact payload that just worked fails with the identical error, and only after a fresh read does the second scan land and supersede the first. The screening queue therefore never silently overwrites a concurrent scan."
        test_recipe:
          setup:
            - "clock pinned; no plan or evaluation is needed -- this corner is entirely on the Interaction version counter"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: QualityManager
            - call: "POST /agents"
              payload: { external_ref: "A-1001", full_name: "Ada Agent", team_code: "TEAM-A", hire_date: "2025-03-01T00:00:00Z" }
              as: QualityManager
              captures: { ag1: $.data.id }
            - call: "POST /interactions"
              payload: { agent_id: "${ag1}", channel: "VOICE", started_at: "2026-08-03T10:00:00Z", ended_at: "2026-08-03T10:10:00Z", required_disclosures: ["RECORDING"], customer_flagged: false, csat_score: 4, repeat_contact_within_72h: false }
              as: QualityManager
              captures: { i1: $.data.id, iv0: $.data.version }
            - call: "POST /interactions/${i1}/consent-review"
              payload: { consent_outcome: "VERIFIED", captured_disclosures: ["RECORDING"] }
              as: ComplianceAuditor
              captures: { iv1: $.data.version }
          trigger:
            - call: "POST /analytics-scans"
              payload: { interaction_id: "${i1}", silence_pct: 30.00, sentiment_delta: -0.40, flagged_categories: ["NO_DISCLOSURE"], expected_interaction_version: "${iv0}" }
              as: ComplianceAuditor
            - call: "POST /analytics-scans"
              payload: { interaction_id: "${i1}", silence_pct: 30.00, sentiment_delta: -0.40, flagged_categories: ["NO_DISCLOSURE"], expected_interaction_version: "${iv1}" }
              as: ComplianceAuditor
              captures: { sc1: $.data.id }
            - call: "POST /analytics-scans"
              payload: { interaction_id: "${i1}", silence_pct: 30.00, sentiment_delta: -0.40, flagged_categories: ["NO_DISCLOSURE"], expected_interaction_version: "${iv1}" }
              as: ComplianceAuditor
            - call: "GET /interactions/${i1}"
              payload: {}
              as: ComplianceAuditor
              captures: { iv2: $.data.version }
            - call: "POST /analytics-scans"
              payload: { interaction_id: "${i1}", silence_pct: 55.00, sentiment_delta: -0.60, flagged_categories: ["NO_DISCLOSURE", "ESCALATION_REQUEST"], expected_interaction_version: "${iv2}" }
              as: ComplianceAuditor
              captures: { sc2: $.data.id }
          assert:
            - "setup sanity -- ${iv0} == 1 at creation and ${iv1} == 2 after the consent review, so the consent write alone invalidated the scanner's read"
            - "trigger 1 -> HTTP 412 ERR_STALE_INTERACTION_VERSION: the payload is otherwise perfectly valid, and GET /analytics-scans?interaction_id=${i1} still returns total_count 0"
            - "trigger 2 -> HTTP 201 with AnalyticsScan.${sc1}.risk_score == 69.00, priority_tier == P2 and status == CURRENT (30.00*0.45 + 0.40*100*0.35 + 30 = 57.50, times the VOICE multiplier 1.20; no disclosure-gap bonus because captured_disclosures already covers RECORDING)"
            - "trigger 3 -> HTTP 412 ERR_STALE_INTERACTION_VERSION for the byte-identical payload that just succeeded: the success in trigger 2 bumped Interaction.${i1}.version to 3, which is the whole point of the guard"
            - "trigger 4 -> ${iv2} == 3, confirming exactly one bump per successful scan and none for the two rejections"
            - "trigger 5 -> HTTP 201 with AnalyticsScan.${sc2}.risk_score == 100.00 and priority_tier == P1 (55.00*0.45 + 0.60*100*0.35 + 30 + 15 = 90.75, times 1.20 = 108.90, clamped to 100.00), and now AnalyticsScan.${sc1}.status == SUPERSEDED"
            - "GET /analytics-scans?interaction_id=${i1}&status=CURRENT returns total_count 1 and data[0].id == ${sc2}; the default ordering (risk_score DESC) puts ${sc2} first in the unfiltered list"
            - "Interaction.${i1}.version == 4 at the end -- two successful scans over the consent review's 2, and no version movement from either 412"
      - name: complexity_occ_agent_and_evaluation_versions_reject_stale_writes
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.optimistic_concurrency[1]
          - complexity_profile.optimistic_concurrency[2]
          - errors[ERR_STALE_AGENT_VERSION]
          - errors[ERR_STALE_EVALUATION_VERSION]
          - validations[priority=8]
          - endpoints[POST /coaching-plans]
          - endpoints[POST /disputes]
        distinguishing_aspect: "Two different parents are guarded on the same submit cascade: the evaluator's submit bumps BOTH Agent.version and Evaluation.version, so the supervisor's coaching-plan write and the agent's dispute write are each stale from the moment they were prepared. The guard also sits ahead of every business rule -- a stale expected_evaluation_version paired with a behavior code that is not on the form still answers 412, not the behavior-code error -- and each successful write bumps its own parent again, so the second coaching plan off the same read fails too."
