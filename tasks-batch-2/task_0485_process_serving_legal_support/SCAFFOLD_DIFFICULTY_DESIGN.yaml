  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: cancel_request_depth4_void_stakeout_line_recompute_fee
        grounds:
          - state_machines.ServiceRequest.ASSIGNED_to_CANCELLED
          - state_machines.Assignment.ACTIVE_to_CANCELLED
          - state_machines.Stakeout.SCHEDULED_to_CANCELLED
          - entities.InvoiceLine.fields.voided
          - entities.ServiceRequest.fields.final_fee_cents
        distinguishing_aspect: |
          Depth-4 chain from POST /service-requests/{id}/cancel: (L1) Assignment ACTIVE
          -> CANCELLED, which (L2) cancels its SCHEDULED Stakeout, which (L3) voids the
          STAKEOUT InvoiceLine, which (L4) recomputes final_fee_cents from 19575 down to
          7575. Each hop is caused by the previous, not by the cancel directly.
        test_recipe:
          setup:
            - "Non-rush 3-page request ASSIGNED to S; 1 stakeout SCHEDULED, 0 attempts; final_fee=19575 (base 7500 + printing 75 + stakeout 12000)."
          setup_api_calls:
            - call: "POST /counties"
              payload: { name: "Lake", state_code: "CA", e_file_enabled: false, min_diligent_attempts: 1 }
              as: Admin
              captures: { county_id: $.data.id }
