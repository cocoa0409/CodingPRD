  - section: calculations
    instances:
      - name: proration_partial_certificate
        claim_type: correct_result
        grounds: [calculations.subcontractor_inclusion, entities.SubcontractorExposure.fields.included_dollars]
        distinguishing_aspect: "Partial certificate coverage prorates inclusion by uncovered days: 20000 payments, cert covering 2026-03-01..2026-07-31 of the 212-day audit period -> round_half_up(20000*59/212) = 5566, status PARTIAL_INCLUDED."
