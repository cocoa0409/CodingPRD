    claim_type: idempotency
    grounds:
    - endpoints[POST /streetlights/tariff-accounts/{id}/generate-lines]
    - errors[ERR_NO_EFFECTIVE_RATE_SCHEDULE]
    distinguishing_aspect: 'generate-lines is phase-ordered and idempotent: with no EFFECTIVE schedule it fails atomically ERR_NO_EFFECTIVE_RATE_SCHEDULE (zero lines created); after filing+activation it
      creates exactly one line (1800); a second identical call creates 0 and skips 1 — no duplicate lines, totals unchanged.'
