          assert:
            - "Market.${mkt}.status == FROZEN (link 1)"
            - "IncentiveProgram.${prog}.status == PAUSED (link 2, cascade from freeze)"
            - "Market.${mkt}.budget_reserved_cents == 0 (link 3, released by the pause) and budget_available_cents == 1000000"
            - "IncentiveProgram.${prog}.promised_make_up_max_cents == 0 while paused"

      - name: rate_ineligible_cascades_enrollment_cancel_capacity_release
        grounds:
          - state_machines.Driver
          - state_machines.IncentiveEnrollment.ACTIVE_to_CANCELLED
          - calculations.rate_posture_derivation
        distinguishing_aspect: |
          Depth-3 cascade from trigger POST /drivers/{id}/rate-events: the batch
          (link 1) derives rate_posture INELIGIBLE (link 2), which CANCELS the
          driver's ACTIVE zone enrollment (link 3), releasing the capacity-1
