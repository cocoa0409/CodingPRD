          trigger:
            - call: "POST /calendar-events"
              payload: { matter_id: "${m1_id}", event_type: "FACILITY_VISIT", starts_at_utc: "2026-09-03T00:00:00.000Z", ends_at_utc: "2026-09-03T01:00:00.000Z", location_code: "ELPFAC", assigned_representative_id: "${rep_v1_id}", facility_id: "${f1_id}" }
              as: ProgramDirector
            - call: "POST /calendar-events"
              payload: { matter_id: "${m1_id}", event_type: "FACILITY_VISIT", starts_at_utc: "2026-09-03T14:00:00.000Z", ends_at_utc: "2026-09-03T15:00:00.000Z", location_code: "ELPFAC", assigned_representative_id: "${rep_v2_id}", facility_id: "${f1_id}" }
              as: ProgramDirector
            - call: "POST /calendar-events"
              payload: { matter_id: "${m1_id}", event_type: "FACILITY_VISIT", starts_at_utc: "2026-09-05T09:00:00.000Z", ends_at_utc: "2026-09-05T10:00:00.000Z", location_code: "ELOYFAC", assigned_representative_id: "${rep_v2_id}", facility_id: "${f0_id}" }
              as: ProgramDirector
            - call: "POST /calendar-events"
              payload: { matter_id: "${m1_id}", event_type: "FACILITY_VISIT", starts_at_utc: "2026-09-02T23:59:59.999Z", ends_at_utc: "2026-09-03T00:59:59.999Z", location_code: "ELPFAC", assigned_representative_id: "${rep_v3_id}", facility_id: "${f1_id}", client_conflict_waived: true }
              as: ProgramDirector
          assert:
            - "step 1 returns HTTP 201: starts_at_utc 2026-09-03T00:00:00.000Z is EXACTLY visit_lead_time_hours (48) after the logical clock 2026-09-01T00:00:00.000Z, and same_day count at ${f1_id} for 2026-09-03 was 0 which is not >= max_daily_visit_slots 1; the row has status 'SCHEDULED', travel_buffer_minutes == 90, reschedule_count == 0, coverage_gap_flag == false."
            - "step 2 returns HTTP 409 with error_id 'ERR_FACILITY_VISIT_SLOTS_EXHAUSTED': the aggregate is per UTC calendar date, so 14:00 on the same date collides with the 00:00 visit even though the intervals are 13 hours apart (same_day 1 >= 1). Geometry A is silent because ${rep_v2_id} holds no events; geometry B is silent because 14:00-15:00 does not touch 00:00-01:00."
            - "step 3 returns HTTP 409 with error_id 'ERR_FACILITY_VISIT_SLOTS_EXHAUSTED' at facility ${f0_id} where same_day is 0 and max_daily_visit_slots is 0, so 0 >= 0 rejects the FIRST visit ever booked there; the lead time (24 h before 2026-09-05T09:00:00.000Z) is amply satisfied, proving the failure is the degenerate ceiling and not timing."
            - "step 4 returns HTTP 422 with error_id 'ERR_FACILITY_LEAD_TIME_NOT_MET': starts_at_utc 2026-09-02T23:59:59.999Z is exactly one millisecond short of the 48-hour boundary. It is NOT 'ERR_FACILITY_VISIT_SLOTS_EXHAUSTED' because the visit falls on UTC date 2026-09-02 where same_day is 0 < 1, and NOT 'ERR_CLIENT_CALENDAR_CONFLICT' because client_conflict_waived is true."
            - "Exactly one CalendarEvent exists at the end: GET /calendar-events?matter_id=${m1_id} returns total_count 1 with that row's starts_at_utc == '2026-09-03T00:00:00.000Z'."

  # =====================================================================
  # RULE 7 - cross_entity_state_dependency
  # Instance 1: Declaration <- InterpretationSession (readback binding).
  # Instance 2: CaseAssignment <- OrganizationRecognition (authorization).
  # Two disjoint entity pairs, two different dependency directions.
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: declaration_certification_blocked_until_readback_session_completes
        grounds:
          - state_machines.Declaration.IN_REVIEW_to_CERTIFIED
          - state_machines.InterpretationSession.SCHEDULED_to_COMPLETED
          - state_machines.InterpretationSession.SCHEDULED_to_CANCELLED
          - validations[priority=29]
          - calculations.interpretation_cost_rollup
          - entities.Declaration.fields.readback_session_id
        distinguishing_aspect: |
          The Declaration is in IN_REVIEW and every other CERTIFY precondition is satisfied, yet
          the transition must fail with ERR_READBACK_NOT_COMPLETED / 409 purely because a
          DIFFERENT entity - an InterpretationSession with purpose DECLARATION_READBACK - has
          not reached COMPLETED; the declaration was legally submitted without any session
          because language_code equalled Client.preferred_language_code, so readback_completed
          stayed false (the binding side effect fires only when a qualifying COMPLETED session
          exists). Completing the session then flips readback_completed on the OTHER entity and
          unblocks CERTIFY, and cancelling a SECOND, unbound readback session must NOT clear it,
          because the clearing rule is keyed on readback_session_id identity.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-09-01T00:00:00.000Z."
            - "Client with preferred_language_code 'hy' (not in COMMON_LANGUAGES) and interpreter_required true, so priority 29 is in force."
            - "Matter STAFFED by an ACTIVE LEAD (preparer rep_p) plus an ACTIVE CO_COUNSEL (reviewer rep_r); both are STAFF_ATTORNEY with a bar_number, hence authorization_status 'AUTHORIZED_ATTORNEY', and they are distinct rows so segregation of duties is satisfied."
            - "Declaration drafted in 'hy' by the preparer's assignment and submitted for review while NO interpretation session exists."
            - "Two CONTRACT DECLARATION_READBACK sessions in 'hy' are scheduled: S1 on 2026-09-04T10:00-11:00 and S2 on 2026-09-08T10:00-11:00. interpreter_representative_id is omitted because CONTRACT requires it to be null."
            - "No EvidenceItem is ever created, so the INCONSISTENT_WITH_DECLARATION precondition is vacuously satisfied."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00.000Z" }
              as: ProgramDirector
            - call: "POST /capacity-cycles"
              payload: { cycle_label: "FY27-Q1", period_start_date: "2026-08-01", period_end_date: "2026-12-31", total_case_slots: 20, reserved_detained_slots: 4 }
              as: ProgramDirector
              captures: { cycle_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Nadia Okonjo", rep_type: "STAFF_ATTORNEY", languages: ["en"], max_case_load: 25, max_supervisees: 6, weekly_capacity_hours: 40, bar_number: "TX-990001" }
              as: ProgramDirector
              captures: { screener_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Petros Sarkissian", rep_type: "STAFF_ATTORNEY", languages: ["en", "hy"], max_case_load: 10, max_supervisees: 4, weekly_capacity_hours: 40, bar_number: "TX-990002" }
              as: ProgramDirector
              captures: { rep_p_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Rina Castellanos", rep_type: "STAFF_ATTORNEY", languages: ["en"], max_case_load: 10, max_supervisees: 4, weekly_capacity_hours: 40, bar_number: "TX-990003" }
              as: ProgramDirector
              captures: { rep_r_id: "$.data.id" }
            - call: "POST /clients"
              payload: { full_name: "Anahit Grigoryan", preferred_language_code: "hy", country_of_birth_code: "AM", date_of_birth: "1988-08-08", household_size: 2, annual_household_income_cents: 2400000, confidentiality_consent_scope: "PROGRAM_ONLY", interpreter_required: true }
              as: ProgramDirector
              captures: { client_id: "$.data.id" }
            - call: "PATCH /clients/${client_id}"
              payload: { status: "ACTIVE" }
              as: ProgramDirector
            - call: "POST /intake-screenings"
              payload: { client_id: "${client_id}", cycle_id: "${cycle_id}", case_type: "ASYLUM", detained: false, one_year_bar_applies: false, prior_removal_order: false }
              as: ProgramDirector
              captures: { intake_id: "$.data.id" }
            - call: "POST /intake-screenings/${intake_id}/screen"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
            - call: "POST /intake-screenings/${intake_id}/decide"
              payload: { decision: "ACCEPT", decision_reason_code: "ACCEPTED_ON_MERIT" }
              as: SupervisingAttorney
              as_user_id: "${rep_r_id}"
            - call: "GET /case-matters"
              payload: { intake_id: "${intake_id}" }
              as: ProgramDirector
              captures: { matter_id: "$.data[0].id", m_ver1: "$.data[0].version" }
            - call: "POST /case-assignments"
              payload: { matter_id: "${matter_id}", representative_id: "${rep_p_id}", role_on_case: "LEAD", expected_matter_version: "${m_ver1}" }
              as: ProgramDirector
              captures: { asg_p_id: "$.data.id" }
            - call: "POST /case-assignments/${asg_p_id}/transition"
              payload: { action: "ACTIVATE" }
              as: ProgramDirector
            - call: "GET /case-matters/${matter_id}"
              payload: {}
              as: ProgramDirector
              captures: { m_ver2: "$.data.version" }
            - call: "POST /case-assignments"
              payload: { matter_id: "${matter_id}", representative_id: "${rep_r_id}", role_on_case: "CO_COUNSEL", expected_matter_version: "${m_ver2}" }
              as: ProgramDirector
              captures: { asg_r_id: "$.data.id" }
            - call: "POST /case-assignments/${asg_r_id}/transition"
              payload: { action: "ACTIVATE" }
              as: ProgramDirector
            - call: "POST /declarations"
              payload: { matter_id: "${matter_id}", preparer_assignment_id: "${asg_p_id}", language_code: "hy", word_count: 1800 }
              as: CaseRepresentative
              as_user_id: "${rep_p_id}"
              captures: { decl_id: "$.data.id" }
            - call: "POST /declarations/${decl_id}/transition"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: CaseRepresentative
              as_user_id: "${rep_p_id}"
            - call: "POST /interpretation-sessions"
              payload: { matter_id: "${matter_id}", language_code: "hy", interpreter_source: "CONTRACT", purpose: "DECLARATION_READBACK", scheduled_start_utc: "2026-09-04T10:00:00.000Z", scheduled_end_utc: "2026-09-04T11:00:00.000Z" }
              as: ProgramDirector
              captures: { s1_id: "$.data.id" }
            - call: "POST /interpretation-sessions"
              payload: { matter_id: "${matter_id}", language_code: "hy", interpreter_source: "CONTRACT", purpose: "DECLARATION_READBACK", scheduled_start_utc: "2026-09-08T10:00:00.000Z", scheduled_end_utc: "2026-09-08T11:00:00.000Z" }
              as: ProgramDirector
              captures: { s2_id: "$.data.id" }
          trigger:
            - call: "POST /declarations/${decl_id}/transition"
              payload: { action: "CERTIFY", reviewer_assignment_id: "${asg_r_id}" }
              as: SupervisingAttorney
              as_user_id: "${rep_r_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T11:05:00.000Z" }
              as: ProgramDirector
            - call: "POST /interpretation-sessions/${s1_id}/transition"
              payload: { action: "COMPLETE", actual_minutes: 45 }
              as: CaseRepresentative
              as_user_id: "${rep_p_id}"
            - call: "POST /interpretation-sessions/${s2_id}/transition"
              payload: { action: "CANCEL", closure_reason_code: "INTERPRETER_UNAVAILABLE" }
              as: CaseRepresentative
              as_user_id: "${rep_p_id}"
            - call: "POST /declarations/${decl_id}/transition"
              payload: { action: "CERTIFY", reviewer_assignment_id: "${asg_r_id}" }
              as: SupervisingAttorney
              as_user_id: "${rep_r_id}"
          assert:
            - "After setup: Declaration ${decl_id}.status == 'IN_REVIEW', readback_completed == false and readback_session_id == null - SUBMIT_FOR_REVIEW passed on the language_code branch and had no COMPLETED session to bind."
            - "trigger step 1 returns HTTP 409 with error_id 'ERR_READBACK_NOT_COMPLETED'; it is NOT 'ERR_SEGREGATION_OF_DUTIES' because ${rep_r_id} != ${rep_p_id} and ${rep_r_id} is a STAFF_ATTORNEY with authorization_status 'AUTHORIZED_ATTORNEY' holding an ACTIVE assignment on the same matter. Declaration ${decl_id}.status stays 'IN_REVIEW' and certified_at_utc stays null."
            - "trigger step 3 returns HTTP 200: InterpretationSession ${s1_id}.status == 'COMPLETED', actual_minutes == 45, billed_minutes == 45 (max(30, ceil(45/15)*15) == 45) and billable_cents == 8194 (9500 * 45/60 * 1.15 == 8193.75, round_half_up)."
            - "trigger step 3 also flipped the OTHER entity: Declaration ${decl_id}.readback_completed == true and readback_session_id == ${s1_id}; CaseMatter ${matter_id}.interpretation_cost_cents == 8194."
            - "trigger step 4 returns HTTP 200 with InterpretationSession ${s2_id}.status == 'CANCELLED', billed_minutes == 0 and billable_cents == 0, and Declaration ${decl_id}.readback_completed is STILL true with readback_session_id still ${s1_id}, because the clearing side effect only touches declarations whose readback_session_id == ${s2_id}."
            - "CaseMatter ${matter_id}.interpretation_cost_cents is still exactly 8194 after step 4 (a CANCELLED session contributes 0)."
