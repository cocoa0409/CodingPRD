          (2) that flag suspends the ACTIVE opioid Rx->SUSPENDED; (3) the suspension moves MED 20.00 from ledger
          total_active_med_mg to suspended_med_mg and recomputes Patient.current_daily_med_mg to 0.00. Each link is
          caused by the previous, not directly by the result call.
