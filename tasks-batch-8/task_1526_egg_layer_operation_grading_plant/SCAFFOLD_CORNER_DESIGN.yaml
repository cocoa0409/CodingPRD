  # ---------------------------------------------------------- consistency_model
  - section: consistency_model
    instances:
      - name: immediate_consistency_of_cascaded_writes
        claim_type: immediate_visibility
        grounds: [complexity_profile, entities.Flock.fields.ungraded_egg_pool]
        distinguishing_aspect: "Immediate consistency: the POST /api/production-days response already carries computed fields (feed_cost_cents, hens_at_start), and the very next GET /api/flocks/{id} reflects the updated cumulative_eggs and ungraded_egg_pool — no lag."
        test_recipe:
          setup: ["farm; LAYING flock of 1000 hens"]
          setup_api_calls:
            - call: "POST /api/farms"
              payload: { name: "Imm Farm", certification_program: "CONVENTIONAL", daily_overhead_cents: 12000 }
              as: PlatformAdmin
              captures: { farm_id: "$.data.id" }
            - call: "POST /api/houses"
              payload: { farm_id: "${farm_id}", house_code: "H1", environment_type: "CAGED", capacity_hens: 2000 }
              as: FarmManager
              captures: { house_id: "$.data.id" }
            - call: "POST /api/flocks"
              payload: { house_id: "${house_id}", breed_code: "HYLINE_BROWN", breed_peak_rate_pct: 95.0, placement_date: "2026-01-05", initial_hen_count: 1000, pullet_cost_cents: 420000 }
              as: FarmManager
              captures: { flock_id: "$.data.id" }
            - call: "POST /api/ops/run-daily"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /api/production-days"
              payload: { flock_id: "${flock_id}", lay_date: "2026-07-31", eggs_collected: 240, rejected_eggs: 12, feed_issued_kg: 0, mortality_count: 2 }
              as: FarmManager
              captures: { pd_id: "$.data.id" }
            - call: "GET /api/flocks/${flock_id}"
              payload: {}
              as: FarmManager
          assert:
            - "ProductionDay.${pd_id} response already shows hens_at_start == 1000, feed_cost_cents == 0, lay_rate_pct == 24.00"
            - "immediate GET: Flock.${flock_id}.cumulative_eggs == 240, current_hen_count == 998, ungraded_egg_pool == 228 (240 - 12 rejects)"

  # ---------------------------------------------------------- errors
  - section: errors
    instances:
      - name: error_house_not_empty_on_second_placement
        claim_type: violation_to_error
        grounds: ["errors[ERR_HOUSE_NOT_EMPTY]"]
        excluded_because:
          difficulty_instance: flock_placement_requires_house_empty
          rationale: "Asserted as the failure path of the named §1.8 instance (cross_entity_state_dependency)."
      - name: error_farm_suspended_blocks_release
        claim_type: violation_to_error
        grounds: ["errors[ERR_FARM_SUSPENDED]"]
        excluded_because:
          difficulty_instance: lot_release_requires_farm_not_suspended
          rationale: "Asserted as the failure path of the named §1.8 instance."
      - name: error_contract_window_overlap
        claim_type: violation_to_error
        grounds: ["errors[ERR_CONTRACT_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: contract_windows_half_open_touching_allowed
          rationale: "Asserted as the failure path of the named §1.8 instance."
      - name: error_audit_interval_too_soon
        claim_type: violation_to_error
        grounds: ["errors[ERR_AUDIT_INTERVAL_TOO_SOON]"]
        excluded_because:
          difficulty_instance: audit_calendar_minimum_30_day_buffer
          rationale: "Asserted as the failure path of the named §1.8 instance."
      - name: error_molt_age_ineligible
        claim_type: violation_to_error
        grounds: ["errors[ERR_MOLT_AGE_INELIGIBLE]"]
        excluded_because:
          difficulty_instance: molt_eligibility_at_exactly_60_weeks
          rationale: "Asserted as the failure path of the named §1.8 instance."
      - name: error_molt_limit_reached
        claim_type: violation_to_error
        grounds: ["errors[ERR_MOLT_LIMIT_REACHED]"]
        excluded_because:
          difficulty_instance: flock_molt_cycle_returns_to_laying_then_caps
          rationale: "Asserted as the failure path of the named §1.8 instance."
      - name: error_shelf_life_exceeded
        claim_type: violation_to_error
        grounds: ["errors[ERR_SHELF_LIFE_EXCEEDED]"]
        excluded_because:
          difficulty_instance: ship_on_exactly_sell_by_date
          rationale: "Asserted as the failure path of the named §1.8 instance (and the priority-pair instance ship_held_expired_lot_safety_beats_temporal)."
      - name: error_lot_quality_held
        claim_type: violation_to_error
        grounds: ["errors[ERR_LOT_QUALITY_HELD]"]
        excluded_because:
