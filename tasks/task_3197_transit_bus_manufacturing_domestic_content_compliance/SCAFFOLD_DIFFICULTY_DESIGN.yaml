  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_on_exercise
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - state_machines.OptionOrder.AVAILABLE_to_EXPIRED
        distinguishing_aspect: |
          Pair (state, business_temporal): with the logical clock beyond the
          exercise deadline the option has auto-EXPIRED, so exercise fails
          priority-4 ERR_INVALID_STATE (409) — the priority-9
          ERR_DEADLINE_PASSED must NOT win even though the deadline also lapsed.
        test_recipe:
          setup:
            - "ACTIVE contract; option year 1 AVAILABLE with exercise_deadline = awarded_at + 365d; clock advanced to awarded_at + 366d (option auto-EXPIRED)"
          setup_api_calls:
