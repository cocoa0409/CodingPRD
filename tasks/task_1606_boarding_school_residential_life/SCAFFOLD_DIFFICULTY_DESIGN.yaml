            - { call: "GET /reslife/medication-orders/${order}", payload: {}, as: Nurse, as_user_id: "${nurse}", captures: { rem2: "$.data.doses_remaining", st2: "$.data.status" } }
            - { call: "POST /reslife/medication-orders/${order}/administrations", payload: { scheduled_date: "2026-09-03", outcome: "ADMINISTERED" }, as: Nurse, as_user_id: "${nurse}", captures: { err: "$.data.error_id" } }
          assert:
