          rationale: "adjustment_cents==0 when every line preference_verified is asserted by the named §1.8 instance."

  - section: state_machines
    instances:
      - name: pga_hold_to_may_proceed_cyclic_recovery_stub
        claim_type: cyclic
        grounds:
          - state_machines.PGAReview.PENDING_to_HOLD
          - state_machines.PGAReview.HOLD_to_MAY_PROCEED
        excluded_because:
          difficulty_instance: non_linear_state_machine / pga_review_cyclic_hold_then_may_proceed
          rationale: "The PENDING->HOLD->MAY_PROCEED cyclic recovery is the core assertion of the named §1.8 non-linear instance."

      - name: entry_filed_to_hold_exam_branch_divergence_stub
        claim_type: branching
        grounds:
          - state_machines.CustomsEntry.FILED_to_HOLD_EXAM
          - state_machines.CustomsEntry.HOLD_EXAM_to_RELEASED
        excluded_because:
          difficulty_instance: non_linear_state_machine / entry_branching_filed_to_hold_then_release_divergent_effects
          rationale: "FILED->HOLD_EXAM vs RELEASE divergent side-effect sets (statement_id null on hold) are asserted by the named §1.8 instance."

      - name: psc_grant_desaturates_bond_cascade_stub
        claim_type: Ledger sync
        grounds:
          - state_machines.PostSummaryCorrection.SUBMITTED_to_GRANTED
          - state_machines.Bond.SATURATED_to_ACTIVE
          - entities.Bond.fields.outstanding_liability_cents
        excluded_because:
          difficulty_instance: transitive_cascade / psc_refund_cascade_entry_to_bond_liability_to_bond_desaturate
          rationale: "Grant->entry->bond->SATURATED-to-ACTIVE depth-3 cascade is the core assertion of the named §1.8 transitive-cascade instance."

      - name: release_schedules_onto_statement_cascade_stub
        claim_type: Cross-entity
        grounds:
          - state_machines.CustomsEntry.FILED_to_RELEASED
          - entities.MonthlyStatement.fields.statement_total_cents
          - entities.MonthlyStatement.fields.entry_count
        excluded_because:
          difficulty_instance: transitive_cascade / release_cascade_entry_to_statement_schedule_to_total_recompute
          rationale: "Release->statement schedule->total recompute depth-2 cascade is asserted by the named §1.8 instance."

  - section: validations
    instances:
      - name: segregation_beats_pga_priority_conflict_stub
        claim_type: Priority conflict
        grounds:
          - validations[priority=6]
          - validations[priority=8]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / segregation_beats_pga_not_cleared_on_review
          rationale: "ERR_SEGREGATION_OF_DUTIES winning over ERR_PGA_NOT_CLEARED is asserted by the named §1.8 priority-conflict instance."

      - name: isf_not_filed_beats_bond_saturated_priority_conflict_stub
        claim_type: Priority conflict
        grounds:
