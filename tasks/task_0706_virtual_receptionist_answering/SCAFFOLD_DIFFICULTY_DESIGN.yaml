              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /va/calendar-slots"
              payload: { account_id: "${acct_id}", window_start: "2026-03-02T09:00:00Z", window_end: "2026-03-02T17:00:00Z", buffer_minutes: 0, capacity: 1 }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /va/appointments"
              payload: { account_id: "${acct_id}", slot_id: "${slot_id}", start_at: "2026-03-02T10:00:00Z", end_at: "2026-03-02T10:30:00Z", expected_slot_version: "${slot_v}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { appt_id: $.data.id }
            - call: "POST /va/calendar-slots/${slot_id}/close"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /va/appointments/${appt_id}/confirm"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "CalendarSlot.${slot_id}.status == \"CLOSED\" before confirm"
            - "confirm response status == 409"
            - "confirm error_id == \"ERR_INVALID_STATE\" (slot not OPEN; cross-entity precondition fails)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      # ---- Instance 1: Appointment half-open [start,end) with buffer_minutes gap (CalendarSlot resource)
      - name: appointment_buffer_aware_overlap_on_slot
        grounds:
          - validations[priority=10]
          - entities.CalendarSlot.fields.buffer_minutes
          - entities.Appointment.fields.start_at
          - entities.Appointment.fields.end_at
          - errors[ERR_SLOT_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: half-open [start_at, end_at) PLUS a mandatory clear
          buffer_minutes gap. With buffer 15, a 10:30-end appointment forbids a new
          start before 10:45; 10:30-11:00 (gap 0 < 15) is rejected. Resource:
          CalendarSlot. (Distinct from instance 2's closed-interval, adjacency-OK,
          zero-buffer arithmetic.)
        test_recipe:
          setup:
            - "OPEN slot capacity 2, buffer_minutes=15; one CONFIRMED appointment 10:00-10:30."
            - "A new booking requests 10:30-11:00 -> gap is exactly 0 < 15 buffer -> ERR_SLOT_OVERLAP."
          setup_api_calls:
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /va/service-plans"
              payload: { name: "PCbuf", billing_model: "PER_CALL", base_fee_cents: 0, overage_rate_cents: 50, overage_tier2_rate_cents: 50, hard_cap_overage_cents: 100000, included_calls: 100, overage_tier2_threshold: 100 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /va/accounts"
              payload: { business_name: "Omicron", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /va/calendar-slots"
              payload: { account_id: "${acct_id}", window_start: "2026-03-02T09:00:00Z", window_end: "2026-03-02T17:00:00Z", buffer_minutes: 15, capacity: 2 }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
            - call: "POST /va/appointments"
              payload: { account_id: "${acct_id}", slot_id: "${slot_id}", start_at: "2026-03-02T10:00:00Z", end_at: "2026-03-02T10:30:00Z", expected_slot_version: "${slot_v0}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { appt1: $.data.id }
            - call: "POST /va/appointments/${appt1}/confirm"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "GET /va/calendar-slots/${slot_id}"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { slot_v1: $.data.version }
          trigger:
            - call: "POST /va/appointments"
              payload: { account_id: "${acct_id}", slot_id: "${slot_id}", start_at: "2026-03-02T10:30:00Z", end_at: "2026-03-02T11:00:00Z", expected_slot_version: "${slot_v1}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "second booking response status == 409"
            - "second booking error_id == \"ERR_SLOT_OVERLAP\" (gap 0 < buffer 15)"
            - "CalendarSlot.${slot_id}.booked_count == 1 (rejected booking did not consume capacity)"

      # ---- Instance 2: AvailabilityWindow closed interval [start,end], adjacency allowed (Receptionist resource)
      - name: availability_window_closed_interval_adjacency_ok
        grounds:
          - validations[priority=11]
          - entities.AvailabilityWindow.fields.start_minute
          - entities.AvailabilityWindow.fields.end_minute
          - errors[ERR_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Different interval semantics from instance 1: closed interval
          [start_minute, end_minute] with adjacency (end==start) explicitly ALLOWED
          and zero buffer. Window [540,600] permits an adjacent [600,660] but
          rejects [599,660] (599 < 600). Resource: Receptionist (different entity
          from instance 1's CalendarSlot).
        test_recipe:
          setup:
            - "A receptionist with one ACTIVE window [540,600]. Add an adjacent [600,660] (allowed), then an overlapping [599,660] (rejected)."
          setup_api_calls:
            - call: "POST /va/receptionists"
              payload: { display_name: "Win", languages: ["EN"], max_concurrent_calls: 1 }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /va/receptionists/${rec_id}/availability-windows"
              payload: { start_minute: 540, end_minute: 600 }
              as: Receptionist
              as_user_id: "${rec_id}"
              captures: { w1: $.data.id }
            - call: "POST /va/receptionists/${rec_id}/availability-windows"
              payload: { start_minute: 600, end_minute: 660 }
              as: Receptionist
              as_user_id: "${rec_id}"
              captures: { w2: $.data.id, w2_status: $.data.status }
          trigger:
            - call: "POST /va/receptionists/${rec_id}/availability-windows"
              payload: { start_minute: 599, end_minute: 660 }
              as: Receptionist
              as_user_id: "${rec_id}"
              captures: { err: $.data.error_id }
          assert:
            - "adjacent window [600,660] created with status 201 and status == \"ACTIVE\""
            - "overlapping window [599,660] response status == 409"
            - "overlapping window error_id == \"ERR_WINDOW_OVERLAP\""

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      # ---- Instance 1: minutes-ledger invariant on adjust (BillingPeriod.consumed_units conserved)
      - name: adjust_preserves_consumed_units_ledger_invariant
        grounds:
          - state_machines.Call.billing_status.DISPUTED_to_ADJUSTED
          - entities.BillingPeriod.fields.consumed_units
          - entities.Call.fields.billed_units
          - calculations.billing_overage
        distinguishing_aspect: |
          Conserved quantity #1: BillingPeriod.consumed_units MUST equal the sum of
          billed_units across its BILLED/ADJUSTED calls at all times. Forward action
          (complete adds 3) paired with compensating action (adjust to 1 subtracts
          old-new = 2) leaves the invariant exact: consumed_units == sum(billed_units)
          == 1, no drift.
        test_recipe:
          setup:
            - "PER_MINUTE plan included_minutes=100 (no overage noise), R1=100, hard_cap 100000."
            - "One 121s call completed -> billed_units 3, consumed_units 3. AccountOwner disputes it; PlatformAdmin adjusts to 1 unit."
