  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_beats_safety_on_assign_tote
        grounds:
          - validations[priority=11]
          - validations[priority=14]
          - validations[priority=30]
          - errors.ERR_INVALID_STATE
          - errors.ERR_TEMPERATURE_ZONE_MISMATCH
        distinguishing_aspect: |
          A single assign-tote call violates three rules at once: the task is COMPLETED rather than
          QUEUED (priority 11), the tote is AMBIENT while the SKU is CHILLED (priority 14), and the
          task already holds a tote (priority 30). Only ERR_INVALID_STATE (409) may be returned;
          an implementation that checks cold-chain segregation first returns
          ERR_TEMPERATURE_ZONE_MISMATCH (422) and fails.
        test_recipe:
          setup:
            - "One CHILLED zone with one CHILLED SKU; one station whose temperature_zone_capability is [CHILLED, AMBIENT] and max_concurrent_totes 4."
            - "An order with one CHILLED line of ordered_qty 2 is CONFIRMED, waved and picking."
            - "The single PickTask has already been bound to a CHILLED tote, retrieved and COMPLETED with a full pick."
            - "A second, still-OPEN AMBIENT tote exists at the same station."
          setup_api_calls:
            - call: "POST /delivery-routes"
              payload: { route_code: "R1", service_area_name: "North", van_capacity_totes: 40, base_delivery_fee_cents: 599, per_km_cost_cents: 150 }
