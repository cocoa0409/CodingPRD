          trigger:
            - call: "POST /studio/talent-bookings"
              payload: { session_id: "${sesA_id}", talent_id: "${md_id}", role_on_set: "MODEL", call_time: "2026-08-03T14:00:00Z", wrap_time: "2026-08-03T18:00:00Z", expected_session_version: "${sesA_v2}" }
              as: Producer
              captures: { bkA2_id: $.data.id }
          assert:
            - "response status == 201"
            - "TalentBooking.${bkA2_id}.booked_minutes == 240"
            - "TalentBooking.${bkA2_id}.regular_minutes == 240"
            - "TalentBooking.${bkA2_id}.overtime_minutes == 0"
            - "TalentBooking.${bkA2_id}.charge_cents == 100000"
            - "TalentBooking.${bkA1_id}.booking_state == \"CANCELLED\""

      - name: overtime_multiplier_constant_prices_the_second_leg_at_one_and_a_half
        claim_type: constants_applied
