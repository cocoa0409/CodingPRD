  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: interviewer_calendar_is_half_open_so_adjacent_windows_are_allowed
        grounds:
          - validations[priority=14]
          - errors.ERR_INTERVIEWER_DOUBLE_BOOKED
          - entities.Interview.fields.scheduled_start_at
          - entities.Interview.fields.scheduled_end_at
        distinguishing_aspect: |
          Resource: an interviewer's calendar. Interval semantics: half-open
          [start, end) with zero buffer, so a window starting exactly when another ends is
          legal while a 30-minute straddle is not. The same interviewer int-7 is the contended
          resource in both attempts, isolating the interval comparison from any capacity or
          separation logic.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; StateRule CA present; AuditProject in FIELDWORK with one JobFamily and one Position."
            - "Interviewer int-7 already holds a SCHEDULED MANAGER interview over [2026-09-10T14:00:00Z, 2026-09-10T15:00:00Z)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /state-rules"
              payload: { state_code: "CA", min_weekly_salary_cents: 132000, duties_test_variant: "QUANTITATIVE_50PCT", ic_test: "ABC", hce_shortcut_recognized: false, liquidated_damages_multiplier: 1.0, reclass_notice_days: 7, back_wage_lookback_weeks_override: 156 }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /audit-projects"
              payload: { name: "FY26 Classification Audit", fiscal_year: 2026, lookback_policy: "STANDARD_2Y" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { proj_id: $.data.id }
            - call: "POST /job-families"
              payload: { audit_project_id: "${proj_id}", name: "Operations Leadership", code: "OPS-LEAD" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { fam_id: $.data.id }
            - call: "POST /audit-projects/${proj_id}/status"
              payload: { target_status: "FIELDWORK" }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /positions"
              payload: { job_family_id: "${fam_id}", title: "Shift Supervisor", job_code: "SS-100", current_fls_status: "EXEMPT", claimed_exemption_test: "EXECUTIVE", annual_salary_cents: 5500000, salary_basis: "SALARY", work_state_code: "CA", incumbent_count: 2, avg_weekly_hours: 47, requires_advanced_degree: false, works_primarily_offsite: false }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { pos_id: $.data.id }
            - call: "POST /interviews"
              payload: { position_id: "${pos_id}", respondent_type: "MANAGER", respondent_ref: "MGR-1", interviewer_user_id: "int-7", scheduled_start_at: "2026-09-10T14:00:00Z", scheduled_end_at: "2026-09-10T15:00:00Z" }
              as: ComplianceAnalyst
              as_user_id: "ca-1"
              captures: { iv_hold_id: $.data.id }
          trigger:
            - call: "POST /interviews"
              payload: { position_id: "${pos_id}", respondent_type: "INCUMBENT", respondent_ref: "INC-1", interviewer_user_id: "int-7", scheduled_start_at: "2026-09-10T14:30:00Z", scheduled_end_at: "2026-09-10T15:30:00Z" }
              as: ComplianceAnalyst
              as_user_id: "ca-1"
            - call: "POST /interviews"
              payload: { position_id: "${pos_id}", respondent_type: "INCUMBENT", respondent_ref: "INC-1", interviewer_user_id: "int-7", scheduled_start_at: "2026-09-10T15:00:00Z", scheduled_end_at: "2026-09-10T16:00:00Z" }
              as: ComplianceAnalyst
              as_user_id: "ca-1"
              captures: { iv_adjacent_id: $.data.id }
          assert:
            - "the 14:30-15:30 attempt returns 409 with error_id ERR_INTERVIEWER_DOUBLE_BOOKED"
            - "the 15:00-16:00 attempt returns 201 because the shared endpoint is excluded by the half-open comparison"
            - "Interview.${iv_adjacent_id}.status == SCHEDULED"
            - "Interview.${iv_hold_id}.status == SCHEDULED"
            - "exactly two Interview rows exist for Position ${pos_id}"
            - "Position.${pos_id}.duties_validation_status == PENDING (booking alone validates nothing)"

      - name: reclassification_window_uses_closed_intervals_with_a_fourteen_day_separation
        grounds:
          - validations[priority=15]
          - errors.ERR_RECLASS_WINDOW_CONFLICT
          - constants.RECLASS_WINDOW_BUFFER_DAYS
          - entities.ReclassificationCase.fields.effective_date
        distinguishing_aspect: |
          A different resource (one Position's reclassification calendar) and different interval
          semantics from the interviewer case: closed date intervals that must be separated by
          strictly more than 14 days, so the failure is a gap measurement rather than an
          intersection. A gap of exactly 14 days is rejected and 15 days is accepted, which also
