      - name: catalog_item_scan_lines_reverse_reachability
        claim_type: listing
        grounds: [endpoints, entities.ScanLine.fields.catalog_item_id]
        distinguishing_aspect: "Recall-audit sub-resource GET /catalog-items/{id}/scan-lines returns the ScanLine rows referencing that item (FK reverse reachability for ScanLine.catalog_item_id)."
