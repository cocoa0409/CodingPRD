            - "SegmentAssignment.${seg2}.connection_minutes == 720 and required_welfare_check_count == 4 with completed_welfare_check_count 0"
            - "AnimalIncident.${inc1}.preliminary_severity_score == 62, from base 40 plus IN_TRANSIT_ADDER 10 plus the capped welfare component 12 rather than the raw 24"
