          assert:
            - "i3_status == \"PAID\"  # link 1: allocation covered installment 3"
            - "pledge_status == \"FULFILLED\"  # link 2: caused by installment 3 reaching PAID"
            - "fund_balance == 3000000  # link 3 input: pledge payments credited the pledge's fund"
            - "fund_status == \"ACTIVE\"  # link 3: balance crossed minimum_activation_cents 2500000"
            - "Pledge.${pl_id}.outstanding_cents == 0"

      - name: writeoff_approval_pledge_campaign_recognition_cascade
        grounds:
          - state_machines.PledgeWriteOff.PENDING_to_APPROVED
          - state_machines.Pledge.ACTIVE_to_WRITTEN_OFF
