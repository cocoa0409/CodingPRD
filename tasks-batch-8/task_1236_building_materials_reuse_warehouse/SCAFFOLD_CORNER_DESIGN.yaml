        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_SPLIT_INVALID_QUANTITY]"]
        distinguishing_aspect: "split_qty >= measure_qty (or <= 0) fails with 422 ERR_SPLIT_INVALID_QUANTITY."
        test_recipe:
          setup: ["item with measure_qty 12 SQFT in BACKROOM"]
          setup_api_calls:
            - call: "POST /reuse/categories"
              payload: { code: "SPLCAT", display_name: "Split Cat", pricing_model: "PER_SQFT", base_rate_cents: 200, hazmat_risk_flag: false, markdown_after_days: 30, markdown_step_pct: 0.20, markdown_interval_days: 15, max_markdown_steps: 2, floor_price_pct: 0.40, target_turn_days: 45 }
