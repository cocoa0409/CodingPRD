        test_recipe:
          setup: ["two applicants household_size 1, incomes 2000000 and 2000001"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /sites"
