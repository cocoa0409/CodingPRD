      - name: locker_aggregate_capacity_exhausted
        grounds:
          - validations[priority=10]
          - entities.Store.fields.locker_count
        distinguishing_aspect: >-
          Aggregate-capacity interval semantics on Store lockers (a different resource and different
          arithmetic than per-slot capacity): non-terminal LOCKER orders are counted store-wide against
          locker_count; the (locker_count+1)-th concurrent LOCKER order is rejected ERR_NO_LOCKER_AVAILABLE.
