        distinguishing_aspect: "Eight cross-role attempts covering all six roles each return 403 ERR_UNAUTHORIZED, and the ones aimed at a non-existent path id still return 403 rather than 404 - proving the role membership check at priority 2 runs before the path lookup at priority 3 and that no row is ever written."
