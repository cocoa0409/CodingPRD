          - errors[ERR_SWITCHING_NOT_EXECUTED]
        distinguishing_aspect: |
          Entity pair WorkOrder -> SwitchingOrder: the work order's DISPATCHED -> IN_PROGRESS
          transition is legal only while the linked SwitchingOrder sits in EXECUTED. Tested both
          closed (APPROVED: rejected) and open (EXECUTED: succeeds). Different entity pair from the
          Outage -> Outage instance.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; event ACTIVE; feeder; outage confirmed {20, EQUIPMENT}; assessment (repair 30, requires_switching) accepted"
            - "Work order requires_switching_order=true: READY -> DISPATCHED (LINE crew) -> crew ON_SITE. Switching order ISSUED by op-1 and APPROVED by op-2, but NOT executed"
