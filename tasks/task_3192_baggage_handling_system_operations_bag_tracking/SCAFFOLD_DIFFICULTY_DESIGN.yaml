        distinguishing_aspect: "The cross-entity pair is Bag over Flight: the Bag's own state is fine in both readings, and the outcome turns entirely on the Flight's status and its clock-derived sortation window — no other entity pair in this scaffold has that shape."
        test_recipe:
          setup:
            - "clock 2026-09-01T07:00:00Z; station SEA capacity 60 with make-up area MA-3 (2 slots) and lane EDS-2; airline DL; flight DL1423 departs 2026-09-01T15:00:00Z so its window is [13:00, 14:15]"
