              as: LandAgent
              as_user_id: "la-user-01"
              captures: { b3_retry_id: "$.data.id", b3_retry_status: "$.data.status" }
          assert:
            - "${b1_status} == BOOKED and ${b2_status} == BOOKED — each is individually admissible and together they sit exactly at the cap of 3 over 12:00-16:00"
            - "B3 is refused with HTTP 409 and ${b3_error} == ERR_CREW_CAPACITY_EXCEEDED: its window 14:00-18:00 intersects both B1 and B2, so the aggregate would be 1 + 2 + 1 == 4 > 3"
            - "B4 is admitted with ${b4_status} == BOOKED even though it asks for the full capacity of 3: its window_start 2026-08-10T20:00:00Z equals B2's window_end exactly, and half-open intervals that abut do not intersect, so the aggregate over its window is 0 + 3 == 3"
            - "${b2_status_after} == CANCELLED and ${b2_cancelled_at} == 2026-08-01T00:00:00Z"
            - "the retry of the byte-identical B3 request now succeeds: ${b3_retry_status} == BOOKED, because the aggregate over 14:00-18:00 is now B1's 1 crew plus the requested 1 == 2 <= 3"
            - "the cancelled B2 contributes 0 to the aggregate, and B4's 3 crews are not counted either because 20:00 is not inside 14:00-18:00"
            - "Parcel ${p_at_id} ends with four SiteAccessBooking rows: ${b1_id} BOOKED, ${b2_id} CANCELLED, ${b4_id} BOOKED and ${b3_retry_id} BOOKED"

  # ==========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: option_payment_ledger_restored_by_withdraw_refund
        invariant: "Landowner.total_paid_cents == SUM(amount_cents of DEBIT_DEVELOPER OptionPayment rows) - SUM(amount_cents of CREDIT_DEVELOPER OptionPayment rows), and after a withdraw-with-refund the agreement's total_option_paid_cents equals exactly its post-execution value"
        grounds:
          - state_machines.OptionAgreement.EXECUTED_to_WITHDRAWN
          - calculations.option_fee_schedule
          - calculations.landowner_paid_ledger
          - entities.OptionPayment
          - entities.OptionAgreement.fields.total_option_paid_cents
        distinguishing_aspect: |
          A money-ledger invariant restored by an append-only reversal: the
          compensating action does not delete or mutate the two EXTENSION_FEE rows,
          it mints a fourth immutable OptionPayment row of the opposite
          ledger_direction whose amount is exactly their sum (375000 + 431250 =
          806250), returning total_option_paid_cents to 312500 — its value the
          instant after execution — while the audit trail still shows all four
          movements. The instance also pins the step-up arithmetic that makes the
          two extension fees unequal.
        test_recipe:
          setup:
            - "One Landowner 'Caprock Ranch Holdings LLC' with payment_hold false, three 48453 SetbackRule rows and the 125.00-acre Parcel with buildable_acres 100.00, QUALIFIED."
            - "One OptionAgreement with option_fee_per_acre_cents 2500, extension_fee_per_acre_cents 3000 and extension_count_allowed 2; sent, accepted and executed by pm-user-01, minting OptionPayment sequence_no 1 of 312500 (INITIAL_OPTION_FEE, DEBIT_DEVELOPER) and driving the parcel to OPTIONED and the landowner to UNDER_OPTION."
            - "Both extensions taken: sequence_no 2 of 375000 (3000 cents per acre on 125.00 gross acres) and sequence_no 3 of 431250 (3450 cents per acre after the 1500 bps step-up), so total_option_paid_cents is 1118750 and extensions_used is 2."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Caprock Ranch Holdings LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "land@caprock.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l1_id: "$.data.id", paid0: "$.data.total_paid_cents" }
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48453", rule_type: "PROPERTY_LINE", setback_feet: 150, encumbrance_rate_per_acre: 0.06, consent_waivable: true }
              as: TitleCounsel
              as_user_id: "tc-user-01"
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48453", rule_type: "OCCUPIED_DWELLING", setback_feet: 500, encumbrance_rate_per_acre: 0.10, consent_waivable: true }
              as: TitleCounsel
              as_user_id: "tc-user-01"
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48453", rule_type: "PUBLIC_ROAD", setback_feet: 100, encumbrance_rate_per_acre: 0.04, consent_waivable: false }
              as: TitleCounsel
              as_user_id: "tc-user-01"
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-1188-004", county_fips: "48453", landowner_id: "${l1_id}", gross_acres: 125.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_at_id: "$.data.id", p_at_v: "$.data.version" }
            - call: "POST /land-origination/option-agreements"
              payload: { parcel_id: "${p_at_id}", landowner_id: "${l1_id}", expected_parcel_version: "${p_at_v}", option_term_days: 365, option_fee_per_acre_cents: 2500, extension_count_allowed: 2, extension_fee_per_acre_cents: 3000, rent_structure_type: "PER_ACRE", base_rent_per_acre_cents: 120000, royalty_rate_bps: 0, escalator_pct_bps: 200, escalator_mode: "SIMPLE" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { opt_id: "$.data.id" }
            - call: "POST /land-origination/option-agreements/${opt_id}/send"
              payload: {}
              as: LandAgent
              as_user_id: "la-user-01"
            - call: "POST /land-origination/option-agreements/${opt_id}/accept"
              payload: {}
              as: Landowner
              as_user_id: "${l1_id}"
            - call: "POST /land-origination/option-agreements/${opt_id}/execute"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-user-01"
              captures: { paid_after_exec: "$.data.total_option_paid_cents" }
            - call: "POST /land-origination/option-agreements/${opt_id}/extend"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-user-01"
              captures: { paid_after_ext1: "$.data.total_option_paid_cents" }
            - call: "POST /land-origination/option-agreements/${opt_id}/extend"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-user-01"
              captures: { paid_after_ext2: "$.data.total_option_paid_cents", used2: "$.data.extensions_used" }
            - call: "GET /land-origination/option-payments"
              payload: { option_agreement_id: "${opt_id}" }
              as: PaymentAdministrator
              as_user_id: "pa-user-01"
              captures: { last_seq_before: "$.data[2].sequence_no", last_kind_before: "$.data[2].payment_kind" }
          trigger:
            - call: "POST /land-origination/option-agreements/${opt_id}/withdraw"
              payload: { withdraw_reason: "interconnection queue position lost; releasing the parcel", refund_extension_fees: true }
              as: PortfolioManager
              as_user_id: "pm-user-01"
              captures: { paid_after_withdraw: "$.data.total_option_paid_cents", opt_status: "$.data.status" }
            - call: "GET /land-origination/option-payments"
              payload: { option_agreement_id: "${opt_id}" }
              as: PaymentAdministrator
              as_user_id: "pa-user-01"
              captures: { last_seq_after: "$.data[3].sequence_no", last_kind_after: "$.data[3].payment_kind" }
          assert:
            - "${paid0} == 0 at registration"
            - "${paid_after_exec} == 312500, ${paid_after_ext1} == 687500, ${paid_after_ext2} == 1118750, ${used2} == 2"
            - "before the withdraw the ledger holds exactly 3 rows (meta.total_count == 3) whose last row is ${last_seq_before} == 3 with ${last_kind_before} == EXTENSION_FEE; afterwards it holds exactly 4 (meta.total_count == 4) with ${last_seq_after} == 4 and ${last_kind_after} == REFUND_REVERSAL — the reversal is appended, never destructive, and rows 1-3 are byte-identical across the two reads; OptionPayment rows are immutable (common_fields false, no version, no update endpoint)"
            - "the fourth row has sequence_no 4, payment_kind REFUND_REVERSAL, ledger_direction CREDIT_DEVELOPER, amount_cents 806250 (375000 + 431250) and acres_basis 0.00"
            - "${paid_after_withdraw} == 312500 — exactly the post-execution value, restoring the invariant"
            - "Landowner.${l1_id}.total_paid_cents == 312500"
            - "${opt_status} == WITHDRAWN with withdraw_reason stored, extensions_used still 2 (the counter is history, not state to unwind)"
            - "Parcel.${p_at_id}.status == QUALIFIED and Landowner.${l1_id}.status == ENGAGED"
            - "no LeaseAgreement row exists for OptionAgreement ${opt_id}"

      - name: acreage_conservation_restored_by_consent_revoke
        invariant: "Parcel.gross_acres == Parcel.slope_excluded_acres + Parcel.setback_encumbered_acres + Parcel.buildable_acres at every instant, with setback_encumbered_acres == raw_setback_acres - consent_released_acres"
        grounds:
          - state_machines.NeighborConsent.GRANTED_to_REVOKED
          - calculations.buildable_acres_derivation
          - state_machines.Parcel.QUALIFIED_to_SCREENING
          - state_machines.Landowner.ENGAGED_to_PROSPECT
          - entities.NeighborConsent.fields.revoked_at
        distinguishing_aspect: |
          A physical-quantity invariant rather than a money one, and the
          compensation is destructive-in-place rather than append-only: revoking the
          consent zeroes its released_acres and returns every derived acreage figure
          to its exact pre-grant value (16.00 -> 0.00 released, 19.00 -> 35.00
          encumbered, 81.00 -> 65.00 buildable), which also unwinds the two cascade
          hops the grant had produced, dropping the parcel back to SCREENING and the
          landowner back to PROSPECT. No ledger row is minted anywhere.
        test_recipe:
          setup:
            - "One Landowner 'Trinity Draw Family Trust' in PROSPECT."
            - "Exactly two SetbackRule rows for jurisdiction_code 48375: PROPERTY_LINE at 0.2000 with consent_waivable true and OCCUPIED_DWELLING at 0.1500 with consent_waivable false."
            - "One Parcel of 100.00 gross acres in county 48375 with slope 4.0: raw_setback_acres 35.00, buildable_acres 65.00, status SCREENING."
            - "One NeighborConsent against the waivable rule, granted, so released_acres is 16.00, setback_encumbered_acres is 19.00, buildable_acres is 81.00, the parcel is QUALIFIED and the landowner is ENGAGED."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Trinity Draw Family Trust", entity_type: "TRUST", mailing_state: "TX", contact_email: "trustee@trinitydraw.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l4_id: "$.data.id" }
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48375", rule_type: "PROPERTY_LINE", setback_feet: 200, encumbrance_rate_per_acre: 0.2000, consent_waivable: true }
              as: TitleCounsel
              as_user_id: "tc-user-01"
              captures: { sr_w_id: "$.data.id" }
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48375", rule_type: "OCCUPIED_DWELLING", setback_feet: 600, encumbrance_rate_per_acre: 0.1500, consent_waivable: false }
              as: TitleCounsel
              as_user_id: "tc-user-01"
              captures: { sr_nw_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-2375-901", county_fips: "48375", landowner_id: "${l4_id}", gross_acres: 100.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_cons_id: "$.data.id", raw0: "$.data.raw_setback_acres", enc0: "$.data.setback_encumbered_acres", build0: "$.data.buildable_acres" }
            - call: "POST /land-origination/neighbor-consents"
              payload: { parcel_id: "${p_cons_id}", setback_rule_id: "${sr_w_id}", neighbor_name: "H. Alvarado", consent_expiry_days: 60 }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { nc_id: "$.data.id" }
            - call: "POST /land-origination/neighbor-consents/${nc_id}/grant"
              payload: {}
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { rel1: "$.data.released_acres" }
            - call: "GET /land-origination/parcels/${p_cons_id}"
              payload: {}
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { enc1: "$.data.setback_encumbered_acres", build1: "$.data.buildable_acres", pstatus1: "$.data.status" }
          trigger:
            - call: "POST /land-origination/neighbor-consents/${nc_id}/revoke"
              payload: {}
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { nc_status: "$.data.status", rel2: "$.data.released_acres", revoked_at: "$.data.revoked_at" }
          assert:
            - "pre-grant: ${raw0} == 35.00, ${enc0} == 35.00, ${build0} == 65.00, and 100.00 == 0.00 + 35.00 + 65.00"
            - "post-grant: ${rel1} == 16.00, ${enc1} == 19.00, ${build1} == 81.00, ${pstatus1} == QUALIFIED, and 100.00 == 0.00 + 19.00 + 81.00"
            - "${nc_status} == REVOKED, ${rel2} == 0.00 and ${revoked_at} == 2026-08-01T00:00:00Z"
            - "post-revoke the derived figures return to their exact pre-grant values: Parcel.${p_cons_id}.consent_released_acres == 0.00, setback_encumbered_acres == 35.00, buildable_acres == 65.00"
            - "Parcel.${p_cons_id}.raw_setback_acres == 35.00 throughout (the raw figure is never disturbed by grant or revoke)"
            - "the invariant holds again after the compensation: 100.00 == 0.00 + 35.00 + 65.00, with no drift of even 0.01 acre"
            - "the cascade unwinds: Parcel.${p_cons_id}.status == SCREENING and Landowner.${l4_id}.status == PROSPECT"
            - "NeighborConsent.${nc_id}.granted_at is still 2026-08-01T00:00:00Z — the grant is not erased from the record, only compensated"
