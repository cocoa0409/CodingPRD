              payload: { production_id: "${prod_b}", truck_count: 4, install_crew_hours: 16, depart_at: "2026-09-11T00:00:00Z", arrive_at: "2026-09-13T00:00:00Z" }
              as: TransportCoordinator
              captures: { err_blocked: $.data.error_id }
            - call: "POST /scenic/transport-plans/${tp_a}/cancel"
              payload: {}
              as: TransportCoordinator
            - call: "POST /scenic/transport-plans"
              payload: { production_id: "${prod_b}", truck_count: 4, install_crew_hours: 16, depart_at: "2026-09-11T00:00:00Z", arrive_at: "2026-09-13T00:00:00Z" }
              as: TransportCoordinator
              captures: { tp_b: $.data.id }
            - call: "POST /scenic/transport-plans/${tp_a}/cancel"
              payload: {}
              as: TransportCoordinator
              captures: { err_again: $.data.error_id }
          assert:
            - "while A is PLANNED: B fails with ERR_FLEET_OVER_COMMITTED (4 + 4 > 6)"
            - "after A -> CANCELLED: identical B succeeds (HTTP 201), TransportPlan.${tp_b}.status == PLANNED   # CANCELLED excluded from the fleet sum"
            - "second cancel of A fails with ERR_INVALID_STATE (HTTP 409)   # CANCELLED is terminal"

      - name: withdraw_proposed_change_order_leaves_production_untouched
        claim_type: valid_transition
        grounds:
          - state_machines.ChangeOrder.PROPOSED_to_WITHDRAWN
        distinguishing_aspect: "Estimator withdraw of a PROPOSED CO succeeds (WITHDRAWN terminal); like a rejection it applies nothing — production price/deadline/hours unchanged — and a later client approve fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["production SCHEDULED (price 900000, deadline 2026-09-26, hours 100); package revision 2 CURRENT; CO PROPOSED (dm 1000, dh 1, dd 0)"]
          setup_api_calls:
            - call: "POST /scenic/shops"
              payload: { name: "Metro Scenic", weekly_crew_hours_capacity: 100, horizon_weeks: 4, bay_count: 2, truck_fleet_size: 6, labor_rate_cents_per_hour: 8000, overtime_multiplier_bp: 15000, overhead_pct_bp: 1000, margin_pct_bp: 2000 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /scenic/clients"
              payload: { shop_id: "${shop_id}", company_name: "Northlight Productions", contact_email: "pm@northlight.example", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /scenic/design-packages"
              payload: { client_id: "${cl_id}", show_title: "Hamlet", venue: "Lyric Theatre", load_in_at: "2026-09-26T00:00:00Z", strike_at: "2026-10-10T00:00:00Z" }
              as: ClientPM
              as_user_id: "${cl_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /scenic/bids"
              payload: { client_id: "${cl_id}", design_package_id: "${pkg_id}", pricing_variant: "ROM", has_automation_scope: false, bays_required: 1, build_start_at: "2026-09-01T00:00:00Z", validity_days: 30, floor_area_sqft: 100, complexity_class: "A_SIMPLE", estimated_crew_hours: 100 }
              as: Estimator
              captures: { bid_id: $.data.id }
            - call: "POST /scenic/bids/${bid_id}/submit"
              payload: {}
              as: Estimator
            - call: "POST /scenic/bids/${bid_id}/accept"
              payload: {}
              as: ClientPM
              as_user_id: "${cl_id}"
              captures: { prod_id: $.data.production_id }
            - call: "POST /scenic/design-packages"
              payload: { client_id: "${cl_id}", show_title: "Hamlet", venue: "Lyric Theatre", load_in_at: "2026-09-26T00:00:00Z", strike_at: "2026-10-10T00:00:00Z" }
              as: ClientPM
              as_user_id: "${cl_id}"
            - call: "GET /scenic/productions/${prod_id}"
              payload: {}
              as: Estimator
              captures: { prod_v: $.data.version }
            - call: "POST /scenic/change-orders"
              payload: { production_id: "${prod_id}", expected_production_version: "${prod_v}", new_drawing_revision: 2, delta_materials_cents: 1000, delta_labor_hours: 1, delta_load_in_days: 0 }
              as: Estimator
              captures: { co_id: $.data.id }
          trigger:
            - call: "POST /scenic/change-orders/${co_id}/withdraw"
              payload: {}
              as: Estimator
            - call: "POST /scenic/change-orders/${co_id}/approve"
              payload: {}
              as: ClientPM
              as_user_id: "${cl_id}"
              captures: { err: $.data.error_id }
          assert:
            - "withdraw succeeds: ChangeOrder.${co_id}.status == WITHDRAWN"
            - "approve after withdraw fails with ERR_INVALID_STATE (HTTP 409)   # terminal lockdown"
            - "Production.${prod_id}.current_price_cents == 900000 and load_in_deadline_at == 2026-09-26T00:00:00Z and committed_crew_hours == 100"
