          Priority 10 is only reachable on the rerun: sustaining a determinative objection SUPERSEDES the
          accepted list, and the replacement list becomes the only acceptable source of voter entries.
          Challenging a voter by their round-1 entry id is then refused with 409 - not with 404 and not with
          ERR_CROSS_PETITION_REFERENCE, because the row exists and belongs to the right petition - while the
