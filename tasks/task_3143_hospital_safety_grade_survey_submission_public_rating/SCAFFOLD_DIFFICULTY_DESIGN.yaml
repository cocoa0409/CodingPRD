            - "the stored Grade composite is 60.38 and P7's reliability_weight is 1.0000, so no downgrade is in force"
            - "ReanalysisRequest.${rq7_id}.adjusted_delta == 4.38, the signed forward movement the request carried"
            - "after the compensating refresh, Grade.composite_score == 60.38 again, so the composite returns to the baseline with zero drift"
            - "the invariant is composite_after_refresh - baseline == 0.00, not merely close"
            - "the compensated composite restores Grade.letter_grade == D, the letter 60.38 maps to"

      - name: employer_network_relisting_restores_hospital_count
        grounds:
          - state_machines.Employer.ACTIVE_to_ACTIVE
          - calculations.employer_utilization_index
          - entities.Employer.fields.network_hospital_count
          - validations[priority=7]
        distinguishing_aspect: |
          A conserved COUNT QUANTITY: adding a listing then re-listing the
          original set moves network_hospital_count forward and back by exactly
          the number of added hospitals, and a refused listing moves it by
          zero — the pinned invariant is
          network_hospital_count_after == count_before + added - removed, a
          different type of conserved quantity from the composite-point
          conservation the first instance carries.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Employer E1 lists three hospitals; a fourth listing attempt carries one unknown id."
          setup_api_calls:
            - *k_clock
            - *k_meth_main
            - *k_meth_b0
            - *k_meth_mg
            - *k_hp0
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/methodology-versions"
