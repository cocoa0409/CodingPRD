  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: revision_resolve_to_room_rework_to_moodboard_superseded
        grounds:
          - state_machines.RevisionRequest.SUBMITTED_to_RESOLVED
          - state_machines.Room.APPROVED_to_REWORK
          - state_machines.MoodBoard.PRESENTED_to_SUPERSEDED
          - entities.Room.fields.approved_moodboard_id
        distinguishing_aspect: "Depth-3 cascade: resolving a ROOM-targeted RevisionRequest (A) reverts the APPROVED Room to REWORK (B), and that Room revert itself cascades the ACCEPTED MoodBoard to SUPERSEDED (C); each hop is caused by the previous hop, not by the resolve call directly."
        test_recipe:
          setup:
            - "Project IN_DESIGN; a Room APPROVED with an ACCEPTED moodboard; a SUBMITTED ROOM-target revision on that room."
          setup_api_calls:
            - { call: "POST /clients", payload: { display_name: "Gus", email: "gus1@x.com" }, as: StudioAdmin, captures: { cid: $.data.id } }
            - { call: "POST /projects", payload: { client_name: "Gus", client_user_id: "${cid}", brief_summary: "c", budget_cents: 10000000, fee_model: "FLAT", flat_fee_cents: 100000 }, as: StudioAdmin, captures: { pid: $.data.id } }
            - { call: "POST /projects/${pid}/rooms", payload: { name: "R1", scope_note: "s", room_budget_cents: 0 }, as: Designer, captures: { rid: $.data.id } }
            - { call: "POST /rooms/${rid}/moodboards", payload: { title: "mb", palette: ["x"] }, as: Designer, captures: { mb: $.data.id } }
            - { call: "POST /moodboards/${mb}/present", payload: {}, as: Designer }
            - { call: "POST /rooms/${rid}/present-moodboard", payload: {}, as: Designer }
            - { call: "POST /rooms/${rid}/approve", payload: {}, as: Client, as_user_id: "${cid}" }
            - { call: "POST /projects/${pid}/advance", payload: { to: "IN_DESIGN" }, as: Designer }
            - { call: "POST /projects/${pid}/revisions", payload: { target_kind: "ROOM", target_id: "${rid}", note: "redo palette" }, as: Client, as_user_id: "${cid}", captures: { rev: $.data.id } }
            - { call: "POST /revisions/${rev}/submit", payload: {}, as: Client, as_user_id: "${cid}" }
          trigger:
            - { call: "POST /revisions/${rev}/resolve", payload: {}, as: Designer }
          assert:
            - "RevisionRequest.${rev}.status == RESOLVED (hop A)"
            - "Room.${rid}.status == REWORK and Room.${rid}.approved_moodboard_id == null (hop B)"
            - "MoodBoard.${mb}.status == SUPERSEDED (hop C, caused by the Room revert)"

      - name: order_return_to_selection_revert_and_punch_waive
        grounds:
          - state_machines.ProcurementOrder.DELIVERED_to_RETURNED
          - state_machines.PunchListItem.OPEN_to_WAIVED
          - state_machines.DesignSelection.status
          - entities.Project.fields.committed_cents
        distinguishing_aspect: "Depth-2+ cascade from a different trigger (order return): returning a DELIVERED order (A) waives its OPEN punch items (B) and reverts attached selections ORDERED->SPECIFIED (B'), which removes the order from the committed set so committed_cents recomputes (C). Originates from a different transition than the revision-resolve cascade."
        test_recipe:
          setup:
            - "A DELIVERED order with one BLOCKING OPEN punch item on a FLAT project; the order carries one selection."
          setup_api_calls:
            - { call: "POST /clients", payload: { display_name: "Hal", email: "hal1@x.com" }, as: StudioAdmin, captures: { cid: $.data.id } }
            - { call: "POST /projects", payload: { client_name: "Hal", client_user_id: "${cid}", brief_summary: "c", budget_cents: 100000000, fee_model: "FLAT", flat_fee_cents: 100000 }, as: StudioAdmin, captures: { pid: $.data.id } }
            - { call: "POST /vendors", payload: { name: "V", trade: "SUPPLIER" }, as: ProcurementCoordinator, captures: { vid: $.data.id } }
            - { call: "POST /ffe-items", payload: { sku: "RT-A", name: "Sofa", category: "FURNITURE", list_unit_cost_cents: 20000, lead_time_days: 3 }, as: StudioAdmin, captures: { f1: $.data.id } }
