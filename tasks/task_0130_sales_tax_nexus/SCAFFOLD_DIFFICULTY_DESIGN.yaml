              as_user_id: "${s_id}"
            - call: "POST /tax-returns"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}", period_start: "2026-02-01T00:00:00Z", period_end: "2026-03-01T00:00:00Z" }
              as: TaxPreparer
              as_user_id: "user-U"
              captures: { ret_id: $.data.id }
          trigger:
            - call: "POST /tax-returns/${ret_id}/accept"
              payload: {}
              as: TaxApprover
              as_user_id: "user-U"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_SEGREGATION_OF_DUTIES"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: nexus_sales_threshold_inclusive_at_exact_value
        grounds:
          - calculations.nexus_status
          - state_machines.NexusProfile.NO_NEXUS_to_THRESHOLD_MET
          - entities.TaxJurisdiction.fields.economic_nexus_sales_threshold
          - entities.NexusProfile.fields.nexus_status
        distinguishing_aspect: |
          Numeric inclusive-threshold boundary on the SETTLE endpoint: cumulative_taxable_sales reaching
          EXACTLY 100000.00 (threshold 100000.00) crosses because the test is >= (inclusive), flipping to
          THRESHOLD_MET; a settle to 99999.99 would stay NO_NEXUS.
        test_recipe:
          setup:
            - "CA jurisdiction sales threshold 100000.00; seller s with CA NexusProfile NO_NEXUS."
            - "PENDING CA transaction with one TANGIBLE line qty 1 @ 100000.00."
          setup_api_calls:
            - call: "POST /tax-jurisdictions"
              payload: { state_code: "CA", sourcing_rule: "DESTINATION", state_rate: 0.0725, local_rate: 0.0100, reduced_rate: 0.02, economic_nexus_sales_threshold: 100000.00, economic_nexus_txn_threshold: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ca_id: $.data.id }
            - call: "POST /product-categories"
              payload: { jurisdiction_id: "${ca_id}", category_code: "TANGIBLE", taxability: "FULL" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /sellers"
              payload: { legal_name: "S", origin_state_code: "CA" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s_id: $.data.id }
            - call: "POST /nexus-profiles"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { np_id: $.data.id }
            - call: "POST /transactions"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}", customer_ref: "b1", customer_exempt_requested: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { t_id: $.data.id }
            - call: "POST /line-items"
              payload: { transaction_id: "${t_id}", category_code: "TANGIBLE", quantity: 1, unit_price: 100000.00 }
              as: Seller
              as_user_id: "${s_id}"
          trigger:
            - call: "POST /transactions/${t_id}/settle"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "GET /nexus-profiles/${np_id}"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
