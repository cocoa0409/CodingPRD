              as: ComplianceOfficer
              as_user_id: "u-co-01"
              captures: { err: $.data.error_id }
            - call: "POST /clm/rebate-programs"
              payload: { program_code: "UTIL-A-W3", utility_code: "UTIL-A", program_class: "COMBINED", eligible_product_lines: ["ON_PREMISES"], max_water_gal_per_cwt: 1.00, max_kwh_per_cwt: 0.40, min_capacity_rating_lb: 40, rebate_base_cents: 50000, capacity_bonus_cents_per_10lb: 4000, rebate_cap_cents: 80000, effective_from: "2027-01-02T00:00:00Z", effective_to: "2027-06-30T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "u-co-01"
              captures: { r3: $.data.id }
          assert:
            - "the first trigger call returns HTTP 409"
            - "${err} == ERR_PROGRAM_WINDOW_CONFLICT"
