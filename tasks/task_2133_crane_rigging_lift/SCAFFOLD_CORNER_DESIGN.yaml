        distinguishing_aspect: "A review may be opened against any plan, but the stamp is gated on the LiftPlan being PENDING_ENGINEERING: stamping a review whose plan is only SURVEYED returns ERR_PLAN_NOT_PENDING_ENGINEERING (409)."
        test_recipe:
          setup: ["A SURVEYED (never configured) plan has an EngineeringReview UNDER_REVIEW authored by Engineer A."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_name: "Northgate Industrial" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
