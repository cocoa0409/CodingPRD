  # =========================================================================
  # Excluded corners already covered by §1.8 difficulty instances
  # =========================================================================
  - section: errors
    instances:
      - name: error_route_weight_exceeded_on_add_stop
        claim_type: Violation to Error
        grounds: ["errors[ERR_ROUTE_WEIGHT_EXCEEDED]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / route_weight_capacity_boundary
          rationale: "The 501>500 weight boundary rejection with ERR_ROUTE_WEIGHT_EXCEEDED is asserted by that §1.8 instance."
      - name: error_dock_slot_conflict_on_book
        claim_type: Violation to Error
        grounds: ["errors[ERR_DOCK_SLOT_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / dock_appointment_buffer_overlap
          rationale: "The buffer-gap dock conflict with ERR_DOCK_SLOT_CONFLICT is asserted by that §1.8 instance."
      - name: error_team_window_conflict_on_reserve
        claim_type: Violation to Error
        grounds: ["errors[ERR_TEAM_WINDOW_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / team_window_overlap_halfopen
          rationale: "The overlapping team-window rejection with ERR_TEAM_WINDOW_CONFLICT is asserted by that §1.8 instance."
      - name: error_max_reattempts_on_reschedule
        claim_type: Violation to Error
        grounds: ["errors[ERR_MAX_REATTEMPTS]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / max_reattempts_count_boundary
          rationale: "The reattempt_count==2 reschedule rejection with ERR_MAX_REATTEMPTS is asserted by that §1.8 instance."

  - section: state_machines
    instances:
      - name: refusal_cascade_releases_route_capacity
        claim_type: Cross-entity
        grounds: [state_machines.DeliveryOrder.OUT_FOR_DELIVERY_to_REFUSED_RETRY]
        excluded_because:
          difficulty_instance: transitive_cascade / refusal_depth3_cascade
          rationale: "The attempt->order->stop->route capacity-release cascade is asserted by that §1.8 instance."
      - name: dock_close_releases_appointment_and_route
        claim_type: Cross-entity
        grounds: [state_machines.Dock.OPEN_to_CLOSED]
        excluded_because:
          difficulty_instance: transitive_cascade / dock_close_depth2_cascade
          rationale: "The dock->appointment->route dock_ready cascade is asserted by that §1.8 instance."
