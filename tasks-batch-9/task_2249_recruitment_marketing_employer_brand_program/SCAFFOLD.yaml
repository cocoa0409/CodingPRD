scenario: |
  2249. Recruitment Marketing & Employer Brand Program (talent acquisition marketing team): candidate persona development by job family with channel preference research, career site content, job description optimization and application conversion measurement, paid media allocation across job boards, social and programmatic with cost-per-qualified-applicant targets, employer review platform monitoring and response strategy, talent community nurture campaigns with consent and communication frequency management, event and campus brand presence coordination, source-of-hire attribution across touchpoints with multi-touch modeling, compliance with advertising accuracy and equal opportunity statements

domain_name: recruitment-marketing-employer-brand
api_prefix: ""

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a peer collection at the URL root; parentage is expressed
  # exclusively through FK fields, never through nested URL segments.

  state_machine_shape: parallel
  # JobPosting carries two independent dimensions (content_status x compliance_status);
  # TalentCommunityMember, CandidatePersona and EmployerReview add revision cycles;
  # Application and NurtureCampaign add branching forks with divergent side effects.

  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic

  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Employer brand program name.
        constraints: 1-160 chars, required.
      - name: fiscal_year
        type: integer
        source: input
        description: Fiscal year the media budget belongs to.
        constraints: 2000-2100.
      - name: attribution_model
        type: enum
        source: input
        description: Multi-touch model used by calculations.application_touch_credit.
        default: LINEAR
        constraints: "LINEAR | POSITION_BASED"
      - name: pool_job_board_cents
        type: integer
        source: input
        description: Channel-type media pool reserved for channel_type JOB_BOARD.
        default: 0
        constraints: ">= 0"
      - name: pool_social_cents
        type: integer
        source: input
        description: Channel-type media pool reserved for channel_type SOCIAL.
        default: 0
        constraints: ">= 0"
      - name: pool_programmatic_cents
        type: integer
        source: input
        description: Channel-type media pool reserved for channel_type PROGRAMMATIC.
        default: 0
        constraints: ">= 0"
      - name: flex_reserve_cents
        type: integer
        source: input
        description: Last-resort waterfall bucket usable by any channel type and by event presences.
        default: 0
        constraints: ">= 0"
      - name: send_quota_total
        type: integer
        source: input
        description: Nurture sends the program may dispatch in the fiscal year.
        default: 0
        constraints: ">= 0"
      - name: send_quota_used
        type: integer
        source: computed
        description: Count of NurtureSend rows with outcome SENT whose campaign_id belongs to this program.
        default: 0
      - name: committed_budget_cents
        type: integer
        source: computed
        description: Sum of BudgetLedgerEntry.delta_cents over all entries with program_id equal to this Program (RESERVE entries positive, RELEASE entries negative).
        default: 0
      - name: available_budget_cents
        type: integer
        source: computed
        description: "(pool_job_board_cents + pool_social_cents + pool_programmatic_cents + flex_reserve_cents + sum of JobFamily.dedicated_budget_cents over JobFamily rows with program_id equal to this Program) - committed_budget_cents."
      - name: brand_health_score
        type: number
        source: computed
        description: Output of calculations.program_brand_health_score, 2 decimal places, range 0.00-100.00.
        default: 100.00
      - name: last_attribution_recompute_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent application_touch_credit run for this program; null before the first run.

  - name: JobFamily
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> Program.id; the program that funds this job family.
      - name: name
        type: string
        source: input
        description: Job family display name.
        constraints: 1-120 chars.
      - name: code
        type: string
        source: input
        description: Short job family code.
        constraints: 2-12 chars, uppercase, unique per program_id.
      - name: cpqa_target_cents
        type: integer
        source: input
        description: Target cost per qualified applicant for this family, in cents.
        constraints: ">= 1"
      - name: dedicated_budget_cents
        type: integer
        source: input
        description: First waterfall bucket - money earmarked for this family only.
        default: 0
        constraints: ">= 0"
      - name: priority_rank
        type: integer
        source: input
        description: Lower rank wins deterministic ordering among families of one program.
        constraints: ">= 1, unique per program_id"
      - name: reserved_cents
        type: integer
        source: computed
        description: Sum of BudgetLedgerEntry.delta_cents over entries with job_family_id equal to this JobFamily and bucket equal to FAMILY_DEDICATED.
        default: 0
      - name: dedicated_available_cents
        type: integer
        source: computed
        description: dedicated_budget_cents - reserved_cents.

  - name: Channel
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> Program.id; owning program.
      - name: name
        type: string
        source: input
        description: Channel display name.
        constraints: 1-120 chars.
      - name: channel_type
        type: enum
        source: input
        description: Channel family; only JOB_BOARD, SOCIAL and PROGRAMMATIC may carry a MediaFlight.
        constraints: "JOB_BOARD | SOCIAL | PROGRAMMATIC | CAREER_SITE | EVENT | EMAIL"
      - name: daily_capacity_cents
        type: integer
        source: input
        description: Maximum sum of daily_cap_cents across intersecting non-terminal MediaFlight rows on this channel.
        default: 0
        constraints: ">= 0"
      - name: min_flight_days
        type: integer
        source: input
        description: Minimum MediaFlight.flight_days accepted on this channel.
        default: 1
        constraints: ">= 1"
      - name: spent_cents
        type: integer
        source: computed
        description: Sum of MediaFlight.spent_cents over MediaFlight rows with channel_id equal to this Channel in any state.
        default: 0
      - name: credited_qualified_bp
        type: integer
        source: computed
        description: Sum of Touchpoint.credit_bp over Touchpoint rows with channel_id equal to this Channel whose Application.status is QUALIFIED.
        default: 0
      - name: blended_target_cents
        type: integer
        source: computed
        description: Output of calculations.channel_blended_cpqa_target; null when credited_qualified_bp is 0.
      - name: cpqa_cents
        type: integer
        source: computed
        description: Output of calculations.channel_cpqa; null when credited_qualified_bp is 0.
      - name: pacing_status
        type: enum
        source: computed
        description: Pacing verdict maintained by calculations.channel_cpqa and by the flight-suspension cascade.
        default: PACING_UNKNOWN
        constraints: "PACING_UNKNOWN | ON_TARGET | THROTTLED | IDLE"
      - name: active_flight_count
        type: integer
        source: computed
        description: Count of MediaFlight rows with channel_id equal to this Channel and state equal to ACTIVE.
        default: 0
      - name: idle_since
        type: datetime
        source: system
        description: Logical-clock instant at which pacing_status became IDLE; null otherwise.

  - name: CandidatePersona
    parent: null
    common_fields: true
    fields:
      - name: job_family_id
        type: string
        source: input
        description: FK -> JobFamily.id; the family this persona describes.
      - name: name
        type: string
        source: input
        description: Persona display name.
        constraints: 1-120 chars.
      - name: mix_method
        type: enum
        source: input
        description: Variant selector for calculations.persona_channel_mix.
        default: SURVEY_WEIGHTED
        constraints: "SURVEY_WEIGHTED | ENGAGEMENT_WEIGHTED"
      - name: research_window_days
        type: integer
        source: input
        description: Signal recency window used by calculations.persona_channel_mix.
        default: 180
        constraints: ">= 1"
      - name: state
        type: enum
        source: computed
        description: Persona lifecycle state driven by state_machines.CandidatePersona.
        default: DRAFT
        constraints: "DRAFT | IN_REVIEW | APPROVED | RETIRED"
      - name: channel_mix
        type: array
        source: computed
        description: Array of objects { channel_id, share_bp } produced by calculations.persona_channel_mix; empty array when no in-window signal exists.
        default: []
      - name: mix_confidence_pct
        type: integer
        source: computed
        description: Output of calculations.persona_channel_mix, range 0-100.
        default: 0
      - name: signal_count
        type: integer
        source: computed
        description: Count of ChannelPreferenceSignal rows with persona_id equal to this persona whose collected_at is inside the research window.
        default: 0
      - name: revision_count
        type: integer
        source: computed
        description: Number of times state moved IN_REVIEW -> DRAFT for this persona.
        default: 0
      - name: drafted_by_user_id
        type: string
        source: system
        description: X-User-ID of the PersonaResearcher that created the persona; used by the segregation-of-duties check on review.
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor that last reviewed the persona; null before the first review.
      - name: last_review_note
        type: string
        source: input
        description: Note recorded by the most recent review decision; null before the first review.

  - name: ChannelPreferenceSignal
    parent: null
    common_fields: false
    fields:
      - name: persona_id
        type: string
        source: input
        description: FK -> CandidatePersona.id; persona this research signal informs.
      - name: channel_id
        type: string
        source: input
        description: FK -> Channel.id; channel the signal scores.
      - name: preference_score
        type: integer
        source: input
        description: Stated channel preference score from the research instrument.
        constraints: 0-100.
      - name: sample_size
        type: integer
        source: input
        description: Respondent count behind this signal; weight under the SURVEY_WEIGHTED variant.
        constraints: ">= 1"
      - name: engagement_events
        type: integer
        source: input
        description: Observed engagement events behind this signal; weight under the ENGAGEMENT_WEIGHTED variant.
        default: 0
        constraints: ">= 0"
      - name: collected_at
        type: datetime
        source: input
        description: Instant the signal was collected; drives the research window filter and the ENGAGEMENT_WEIGHTED recency decay.

  - name: JobPosting
    parent: null
    common_fields: true
    fields:
      - name: job_family_id
        type: string
        source: input
        description: FK -> JobFamily.id; family this posting recruits for.
      - name: title
        type: string
        source: input
        description: Job title as advertised.
        constraints: 1-200 chars.
      - name: title_word_count
        type: integer
        source: computed
        description: Count of whitespace-delimited tokens in title.
      - name: responsibility_count
        type: integer
        source: input
        description: Number of responsibility bullets in the description body.
        default: 0
        constraints: 0-40.
      - name: benefit_count
        type: integer
        source: input
        description: Number of benefit bullets in the description body.
        default: 0
        constraints: 0-40.
      - name: pay_range_min_cents
        type: integer
        source: input
        description: Advertised annual pay range floor in cents; null when undisclosed.
        constraints: ">= 0 when present"
      - name: pay_range_max_cents
        type: integer
        source: input
        description: Advertised annual pay range ceiling in cents; null when undisclosed.
        constraints: ">= pay_range_min_cents when both present"
      - name: eeo_statement_included
        type: boolean
        source: input
        description: True when the equal opportunity statement is present in the posting body.
        default: false
      - name: superlative_claim_included
        type: boolean
        source: input
        description: True when the posting body advertises a superlative employer claim requiring substantiation.
        default: false
      - name: substantiation_url
        type: string
        source: input
        description: Public evidence URL substantiating the superlative claim; null when absent.
      - name: content_status
        type: enum
        source: computed
        description: Content dimension of state_machines.JobPosting.
        default: DRAFT
        constraints: "DRAFT | OPTIMIZED | PUBLISHED | SUSPENDED | ARCHIVED"
      - name: compliance_status
        type: enum
        source: computed
        description: Compliance dimension of state_machines.JobPosting, independent of content_status.
        default: UNREVIEWED
        constraints: "UNREVIEWED | CLEARED | FLAGGED"
      - name: optimization_score
        type: integer
        source: computed
        description: Output of calculations.posting_optimization_score, range 0-100; 0 until the first optimize call.
        default: 0
      - name: apply_start_count
        type: integer
        source: computed
        description: Count of Application rows with job_posting_id equal to this posting in any status.
        default: 0
      - name: submitted_count
        type: integer
        source: computed
        description: Count of Application rows with job_posting_id equal to this posting whose status is in {SUBMITTED, SCREENED, QUALIFIED, DISQUALIFIED}.
        default: 0
      - name: qualified_count
        type: integer
        source: computed
        description: Count of Application rows with job_posting_id equal to this posting whose status is QUALIFIED.
        default: 0
      - name: conversion_rate_bp
        type: integer
        source: computed
        description: Output of calculations.posting_conversion_metrics; null when apply_start_count is 0.
      - name: optimized_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor that last ran optimize; null before the first optimize.
      - name: cleared_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceReviewer that last set compliance_status to CLEARED; null otherwise.
      - name: suspended_reason
        type: enum
        source: system
        description: Why content_status became SUSPENDED; null while not suspended.
        constraints: "COMPLIANCE_FLAG"

  - name: MediaFlight
    parent: null
    common_fields: true
    fields:
      - name: channel_id
        type: string
        source: input
        description: FK -> Channel.id; channel the flight buys.
      - name: job_family_id
        type: string
        source: input
        description: FK -> JobFamily.id; family the flight recruits for.
      - name: job_posting_id
        type: string
        source: input
        description: FK -> JobPosting.id; posting the flight drives traffic to.
      - name: start_date
        type: string
        source: input
        description: Inclusive first day of the flight window, format YYYY-MM-DD.
      - name: end_date
        type: string
        source: input
        description: Exclusive last day of the flight window, format YYYY-MM-DD; window arithmetic is half-open [start_date, end_date).
      - name: daily_cap_cents
        type: integer
        source: input
        description: Daily spend cap requested for the flight.
        constraints: ">= 1"
      - name: flight_days
        type: integer
        source: computed
        description: Whole days between start_date and end_date, exclusive of end_date.
      - name: base_gross_cents
        type: integer
        source: computed
        description: Step 1 of calculations.flight_gross_cost - daily_cap_cents * flight_days.
      - name: cost_tier
        type: enum
        source: computed
        description: Step 2 of calculations.flight_gross_cost, derived from base_gross_cents only.
        constraints: "TIER_1 | TIER_2 | TIER_3"
      - name: volume_discount_cents
        type: integer
        source: computed
        description: Step 3 of calculations.flight_gross_cost.
      - name: platform_fee_cents
        type: integer
        source: computed
        description: Step 5 of calculations.flight_gross_cost.
      - name: total_cost_cents
        type: integer
        source: computed
        description: Step 6 of calculations.flight_gross_cost - the amount the reservation waterfall must fund.
      - name: reserved_cents
        type: integer
        source: computed
        description: Currently reserved amount; equals total_cost_cents while state is in {RESERVED, ACTIVE, PAUSED_PACING, SUSPENDED_CONTENT} and 0 once the reservation is released.
        default: 0
      - name: spent_cents
        type: integer
        source: computed
        description: Cumulative amount recorded by POST /media-flights/{id}/spend.
        default: 0
      - name: state
        type: enum
        source: computed
        description: Flight lifecycle state driven by state_machines.MediaFlight.
        default: RESERVED
        constraints: "RESERVED | ACTIVE | PAUSED_PACING | SUSPENDED_CONTENT | COMPLETED | CANCELLED"
      - name: qualified_credit_bp
        type: integer
        source: computed
        description: Sum of Touchpoint.credit_bp over Touchpoint rows with media_flight_id equal to this flight whose Application.status is QUALIFIED.
        default: 0
      - name: release_reason
        type: enum
        source: system
        description: Why the reservation was released; null while reserved_cents is greater than 0.
        constraints: "CANCELLED | COMPLETED | PACING_THROTTLE | COMPLIANCE_SUSPENSION"
      - name: activated_at
        type: datetime
        source: system
        description: Logical-clock instant of the RESERVED -> ACTIVE transition; null before activation.

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: job_posting_id
        type: string
        source: input
        description: FK -> JobPosting.id; posting applied to.
      - name: candidate_email
        type: string
        source: input
        description: Applicant email address.
        constraints: RFC-5322 shape, 1-200 chars.
      - name: status
        type: enum
        source: computed
        description: Application lifecycle state driven by state_machines.Application.
        default: STARTED
        constraints: "STARTED | SUBMITTED | SCREENED | QUALIFIED | DISQUALIFIED"
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of the STARTED -> SUBMITTED transition; anchors the attribution lookback window; null while STARTED.
      - name: screened_at
        type: datetime
        source: system
        description: Logical-clock instant of the SUBMITTED -> SCREENED transition; null before screening.
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent SCREENED/QUALIFIED -> QUALIFIED or DISQUALIFIED transition; null before the first decision.
      - name: attributed_credit_bp_total
        type: integer
        source: computed
        description: Sum of Touchpoint.credit_bp over this application's touchpoints; 10000 while status is QUALIFIED, 0 otherwise.
        default: 0
      - name: eligible_touch_count
        type: integer
        source: computed
        description: Count of touchpoints selected by the attribution input set at the most recent QUALIFIED transition; 0 before any.
        default: 0
      - name: attribution_model_applied
        type: enum
        source: computed
        description: Program.attribution_model value frozen at the most recent QUALIFIED transition; null otherwise.
        constraints: "LINEAR | POSITION_BASED"

  - name: Touchpoint
    parent: null
    common_fields: false
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> Application.id; application this touch belongs to.
      - name: channel_id
        type: string
        source: input
        description: FK -> Channel.id; channel the touch happened on.
      - name: media_flight_id
        type: string
        source: input
        description: FK -> MediaFlight.id; paid flight the touch is billed to; null for organic touches.
      - name: touch_type
        type: enum
        source: input
        description: Interaction kind.
        constraints: "IMPRESSION | CLICK | ORGANIC_VISIT | EVENT_SCAN | EMAIL_CLICK | REFERRAL"
      - name: occurred_at
        type: datetime
        source: input
        description: Instant the touch happened; drives the attribution lookback filter and the credit ordering.
      - name: media_cost_cents
        type: integer
        source: input
        description: Media cost booked against this touch.
        default: 0
        constraints: ">= 0"
      - name: credit_bp
        type: integer
        source: computed
        description: Basis points of qualified-applicant credit assigned by calculations.application_touch_credit; 0 until the owning application reaches QUALIFIED.
        default: 0

  - name: TalentCommunityMember
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> Program.id; program whose talent community the member joined.
      - name: interest_job_family_id
        type: string
        source: input
        description: FK -> JobFamily.id; family the member opted into; null when the member expressed no family preference.
      - name: email
        type: string
        source: input
        description: Member email address, unique per program_id.
        constraints: RFC-5322 shape, 1-200 chars.
      - name: consent_status
        type: enum
        source: computed
        description: Consent state driven by state_machines.TalentCommunityMember.
        default: PENDING_CONFIRMATION
        constraints: "PENDING_CONFIRMATION | SUBSCRIBED | PAUSED | UNSUBSCRIBED"
      - name: consent_token
        type: string
        source: system
        description: Server-issued double opt-in token echoed on the registration response and consumed by POST /talent-community-members/{id}/confirm-consent.
      - name: frequency_cap_per_30d
        type: integer
        source: input
        description: Maximum SENT nurture sends allowed inside the trailing 30-day window.
        default: 4
        constraints: ">= 1"
      - name: sent_count_total
        type: integer
        source: computed
        description: Count of NurtureSend rows with member_id equal to this member and outcome SENT.
        default: 0
      - name: last_sent_at
        type: datetime
        source: system
        description: sent_at of the most recent NurtureSend with outcome SENT for this member; null when none.
      - name: consent_confirmed_at
        type: datetime
        source: system
        description: Logical-clock instant of the PENDING_CONFIRMATION -> SUBSCRIBED transition; null before confirmation.
      - name: consent_changed_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent SUBSCRIBED/PAUSED/UNSUBSCRIBED transition; null before the first change.

  - name: NurtureCampaign
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> Program.id; program the campaign belongs to.
      - name: job_family_id
        type: string
        source: input
        description: FK -> JobFamily.id; family filter for the audience selector; null targets every member of the program.
      - name: name
        type: string
        source: input
        description: Campaign display name.
        constraints: 1-160 chars.
      - name: max_sends
        type: integer
        source: input
        description: Upper bound on SENT+SUPPRESSED evaluations this campaign may perform, and the quantity checked against Program.send_quota_total.
        constraints: ">= 1"
      - name: state
        type: enum
        source: computed
        description: Campaign lifecycle state driven by state_machines.NurtureCampaign.
        default: DRAFT
        constraints: "DRAFT | SCHEDULED | DISPATCHED | CANCELLED"
      - name: scheduled_for
        type: datetime
        source: input
        description: Requested dispatch instant supplied on schedule; null while DRAFT.
      - name: dispatched_at
        type: datetime
        source: system
        description: Logical-clock instant of the SCHEDULED -> DISPATCHED transition; null otherwise.
      - name: audience_size
        type: integer
        source: computed
        description: Count of NurtureSend rows with campaign_id equal to this campaign in any outcome.
        default: 0
      - name: sent_count
        type: integer
        source: computed
        description: Count of NurtureSend rows for this campaign with outcome SENT.
        default: 0
      - name: suppressed_consent_count
        type: integer
        source: computed
        description: Count of NurtureSend rows for this campaign with outcome SUPPRESSED_CONSENT.
        default: 0
      - name: suppressed_frequency_count
        type: integer
        source: computed
        description: Count of NurtureSend rows for this campaign with outcome SUPPRESSED_FREQUENCY.
        default: 0

  - name: NurtureSend
    parent: null
    common_fields: false
    fields:
      - name: campaign_id
        type: string
        source: input
        description: FK -> NurtureCampaign.id; dispatch that produced this row.
      - name: member_id
        type: string
        source: input
        description: FK -> TalentCommunityMember.id; member evaluated by the dispatch.
      - name: outcome
        type: enum
        source: computed
        description: Per-member dispatch verdict from calculations.nurture_dispatch_selection.
        constraints: "SENT | SUPPRESSED_CONSENT | SUPPRESSED_FREQUENCY"
      - name: evaluated_at
        type: datetime
        source: system
        description: Logical-clock instant at which the dispatch evaluated this member.
      - name: sent_at
        type: datetime
        source: system
        description: Logical-clock instant the message went out; equals evaluated_at when outcome is SENT and null otherwise.
      - name: window_send_count_at_eval
        type: integer
        source: computed
        description: Value of the trailing 30-day SENT count for this member at evaluation time, before this row was written.
      - name: sequence_no
        type: integer
        source: system
        description: 1-based position of this row inside its campaign's dispatch order.

  - name: EmployerReview
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> Program.id; program the review is about.
      - name: platform
        type: enum
        source: input
        description: Employer review platform the item was scraped from.
        constraints: "GLASSDOOR | INDEED | COMPARABLY"
      - name: external_ref
        type: string
        source: input
        description: Platform-side identifier, unique per platform.
        constraints: 1-80 chars.
      - name: rating
        type: integer
        source: input
        description: Star rating as published.
        constraints: 1-5.
      - name: posted_at
        type: datetime
        source: input
        description: Instant the review was published on the platform; anchors the SLA deadline and the brand-health recency weight.
      - name: response_due_at
        type: datetime
        source: computed
        description: Output of calculations.review_response_deadline.
      - name: state
        type: enum
        source: computed
        description: Review handling state driven by state_machines.EmployerReview.
        default: NEW
        constraints: "NEW | TRIAGED | DRAFTING | LEGAL_REVIEW | RESPONSE_PUBLISHED | CLOSED_NO_RESPONSE"
      - name: response_body
        type: string
        source: input
        description: Draft or published response text; null before the first draft.
        constraints: 1-2000 chars when present.
      - name: sla_status
        type: enum
        source: computed
        description: PENDING while unresolved and response_due_at is in the future; MET when RESPONSE_PUBLISHED or CLOSED_NO_RESPONSE was reached at or before response_due_at; BREACHED once the logical clock passes response_due_at without resolution, or when resolution happened after it.
        default: PENDING
        constraints: "PENDING | MET | BREACHED"
      - name: rejection_count
        type: integer
        source: computed
        description: Number of times state moved LEGAL_REVIEW -> DRAFTING for this review.
        default: 0
      - name: drafted_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor that last drafted the response; used by the segregation-of-duties check on legal review.
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceReviewer that approved the published response; null otherwise.
      - name: responded_at
        type: datetime
        source: system
        description: Logical-clock instant the response was published or the review was closed without response; null otherwise.

  - name: EventPresence
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> Program.id; program funding the presence.
      - name: job_family_id
        type: string
        source: input
        description: FK -> JobFamily.id; family whose recruiter team staffs the presence; the overlap resource is this family.
      - name: venue_code
        type: string
        source: input
        description: Campus or venue code.
        constraints: 2-40 chars.
      - name: start_at
        type: datetime
        source: input
        description: Inclusive start of the on-site occupation interval.
      - name: end_at
        type: datetime
        source: input
        description: Inclusive end of the on-site occupation interval; intervals are closed on both ends.
      - name: booth_cost_cents
        type: integer
        source: input
        description: Amount the presence reserves from the budget waterfall on confirmation.
        constraints: ">= 1"
      - name: state
        type: enum
        source: computed
        description: Presence lifecycle state driven by state_machines.EventPresence.
        default: PLANNED
        constraints: "PLANNED | CONFIRMED | COMPLETED | CANCELLED"
      - name: reserved_cents
        type: integer
        source: computed
        description: booth_cost_cents while state is in {CONFIRMED, COMPLETED}; 0 while PLANNED or once released by cancellation.
        default: 0
      - name: confirmed_at
        type: datetime
        source: system
        description: Logical-clock instant of the PLANNED -> CONFIRMED transition; null before confirmation.

  - name: BudgetLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> Program.id; program whose budget moved.
      - name: job_family_id
        type: string
        source: input
        description: FK -> JobFamily.id; family the moving money is attributed to.
      - name: bucket
        type: enum
        source: computed
        description: Waterfall bucket the delta was drawn from or returned to.
        constraints: "FAMILY_DEDICATED | POOL_JOB_BOARD | POOL_SOCIAL | POOL_PROGRAMMATIC | FLEX_RESERVE"
      - name: entry_type
        type: enum
        source: computed
        description: RESERVE for positive deltas, RELEASE for negative deltas.
        constraints: "RESERVE | RELEASE"
      - name: delta_cents
        type: integer
        source: computed
        description: Signed amount; positive for RESERVE and negative for RELEASE.
      - name: source_type
        type: enum
        source: computed
        description: Kind of object that moved the money; resolves the polymorphic source_id.
        constraints: "MEDIA_FLIGHT | EVENT_PRESENCE"
      - name: source_id
        type: string
        source: computed
        description: Polymorphic reference resolved by source_type - MediaFlight.id when source_type is MEDIA_FLIGHT, EventPresence.id when source_type is EVENT_PRESENCE.
      - name: reason
        type: enum
        source: computed
        description: Business reason for the movement.
        constraints: "FLIGHT_RESERVATION | FLIGHT_CANCELLED | FLIGHT_COMPLETED | FLIGHT_PACING_THROTTLE | FLIGHT_COMPLIANCE_SUSPENSION | EVENT_RESERVATION | EVENT_CANCELLED"
      - name: sequence_no
        type: integer
        source: system
        description: 1-based monotonically increasing position of this entry inside its program's ledger; the deterministic replay order for budget reconciliation.

state_machines:
  - entity: CandidatePersona
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /candidate-personas/{personaId}/submit"
        actor: PersonaResearcher
        preconditions:
          - "state == DRAFT (else ERR_PERSONA_NOT_DRAFT)"
          - "signal_count >= 1 after re-running calculations.persona_channel_mix (else ERR_NO_RESEARCH_SIGNALS)"
          - "mix_confidence_pct >= 40 after re-running calculations.persona_channel_mix (else ERR_INSUFFICIENT_RESEARCH_CONFIDENCE)"
        side_effects:
          - "Re-run calculations.persona_channel_mix - overwrite channel_mix, mix_confidence_pct and signal_count."
          - "Set updated_at and increment version by 1."
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /candidate-personas/{personaId}/review with decision APPROVE"
        actor: BrandProgramLead
        preconditions:
          - "state == IN_REVIEW (else ERR_PERSONA_NOT_IN_REVIEW)"
          - "X-User-ID != drafted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "channel_mix is a non-empty array (else ERR_NO_RESEARCH_SIGNALS)"
        side_effects:
          - "Set reviewed_by_user_id to the acting X-User-ID and last_review_note to the request note."
          - "Set updated_at and increment version by 1."
      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /candidate-personas/{personaId}/review with decision REQUEST_REVISION"
        actor: BrandProgramLead
        preconditions:
          - "state == IN_REVIEW (else ERR_PERSONA_NOT_IN_REVIEW)"
          - "X-User-ID != drafted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Increment revision_count by 1."
          - "Set reviewed_by_user_id and last_review_note; set updated_at and increment version by 1."
        note: "Revision cycle - DRAFT and IN_REVIEW form a loop bounded only by the reviewer's decisions."
      - from: APPROVED
        to: RETIRED
        trigger: "POST /candidate-personas/{personaId}/retire"
        actor: PersonaResearcher
        preconditions:
          - "state == APPROVED (else ERR_PERSONA_NOT_APPROVED)"
          - "No other CandidatePersona with the same job_family_id is in state APPROVED, AND at least one JobPosting with that job_family_id has content_status in {PUBLISHED, SUSPENDED} -> reject with ERR_PERSONA_IN_USE"
        side_effects:
          - "Set updated_at and increment version by 1."

  - entity: JobPosting
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: OPTIMIZED
        trigger: "POST /job-postings/{postingId}/optimize"
        actor: BrandProgramLead
        preconditions:
          - "content_status in {DRAFT, OPTIMIZED} (else ERR_POSTING_NOT_OPTIMIZABLE)"
          - "expected_posting_version == version (else ERR_STALE_POSTING_VERSION, see concurrency_rules.posting-optimize-stale-posting)"
          - "pay_range_max_cents >= pay_range_min_cents whenever both are present (else ERR_PAY_RANGE_INVALID)"
        side_effects:
          - "Recompute title_word_count and calculations.posting_optimization_score into optimization_score."
          - "Set optimized_by_user_id to the acting X-User-ID."
          - "Set compliance_status to UNREVIEWED when it was CLEARED, because the cleared text was superseded by this revision."
          - "Set updated_at and increment version by 1."
        note: "Self-transition OPTIMIZED -> OPTIMIZED is legal - each call is a new optimization revision that supersedes the prior one."
      - from: OPTIMIZED
        to: PUBLISHED
        trigger: "POST /job-postings/{postingId}/publish"
        actor: BrandProgramLead
        preconditions:
          - "content_status in {OPTIMIZED, SUSPENDED} (else ERR_POSTING_NOT_PUBLISHABLE)"
          - "At least one CandidatePersona with job_family_id == this posting's job_family_id has state APPROVED (else ERR_NO_APPROVED_PERSONA)"
          - "optimization_score >= 70 (else ERR_OPTIMIZATION_SCORE_TOO_LOW)"
          - "eeo_statement_included == true (else ERR_EEO_STATEMENT_MISSING)"
          - "pay_range_min_cents and pay_range_max_cents are both present (else ERR_PAY_RANGE_INVALID)"
          - "compliance_status == CLEARED (else ERR_POSTING_COMPLIANCE_NOT_CLEARED)"
        side_effects:
          - "Set suspended_reason to null."
          - "Set updated_at and increment version by 1."
      - from: SUSPENDED
        to: PUBLISHED
        trigger: "POST /job-postings/{postingId}/publish"
        actor: BrandProgramLead
        preconditions:
          - "content_status == SUSPENDED and compliance_status == CLEARED after a new compliance review (else ERR_POSTING_COMPLIANCE_NOT_CLEARED)"
          - "optimization_score >= 70 (else ERR_OPTIMIZATION_SCORE_TOO_LOW)"
        side_effects:
          - "Set suspended_reason to null; MediaFlight rows are NOT auto-resumed - resumption is an explicit POST /media-flights/{flightId}/resume."
          - "Set updated_at and increment version by 1."
      - from: PUBLISHED
        to: SUSPENDED
        trigger: "system - hop 2 of the compliance-flag cascade fired by POST /job-postings/{postingId}/compliance-review with decision FLAG"
        actor: system
        preconditions:
          - "compliance_status just moved to FLAGGED in this request"
          - "content_status == PUBLISHED"
        side_effects:
          - "Set suspended_reason to COMPLIANCE_FLAG."
          - "Hop 3 - because this posting is now SUSPENDED, every MediaFlight with job_posting_id equal to it whose state is in {ACTIVE, PAUSED_PACING} moves to SUSPENDED_CONTENT with release_reason COMPLIANCE_SUSPENSION and reserved_cents set to 0."
          - "Hop 4 - because those flights left ACTIVE, Channel.active_flight_count is decremented for each of their channels; a channel whose count reaches 0 and whose pacing_status was not set to THROTTLED earlier in this same request moves to pacing_status IDLE with idle_since set to the logical clock."
          - "Hop 5 - because each flight released its reservation, one RELEASE BudgetLedgerEntry is written per original RESERVE entry of that flight (mirroring bucket and amount, ascending sequence_no of the original RESERVE entries), which lowers Program.committed_budget_cents and raises Program.available_budget_cents."
          - "Set updated_at and increment version by 1 on the posting, on every mutated flight, on every mutated channel and on the program."
      - from: OPTIMIZED
        to: ARCHIVED
        trigger: "POST /job-postings/{postingId}/archive"
        actor: BrandProgramLead
        preconditions:
          - "content_status in {DRAFT, OPTIMIZED, PUBLISHED, SUSPENDED} (else ERR_POSTING_ALREADY_ARCHIVED)"
        side_effects:
          - "Every MediaFlight with job_posting_id equal to this posting whose state is in {RESERVED, ACTIVE, PAUSED_PACING, SUSPENDED_CONTENT} moves to CANCELLED with release_reason CANCELLED and reserved_cents 0, each release writing mirroring RELEASE BudgetLedgerEntry rows and lowering Program.committed_budget_cents."
          - "Channel.active_flight_count is decremented for each cancelled flight that was ACTIVE; IDLE resolution follows the same precedence rule as the compliance cascade."
          - "Set updated_at and increment version by 1."
      - from: UNREVIEWED
        to: CLEARED
        trigger: "POST /job-postings/{postingId}/compliance-review with decision CLEAR"
        actor: ComplianceReviewer
        preconditions:
          - "compliance_status in {UNREVIEWED, FLAGGED} (else ERR_POSTING_ALREADY_CLEARED)"
          - "content_status != ARCHIVED (else ERR_POSTING_ALREADY_ARCHIVED)"
          - "X-User-ID != optimized_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "eeo_statement_included == true (else ERR_EEO_STATEMENT_MISSING)"
          - "superlative_claim_included == false OR substantiation_url is present (else ERR_UNSUBSTANTIATED_CLAIM)"
        side_effects:
          - "Set cleared_by_user_id to the acting X-User-ID."
          - "Set updated_at and increment version by 1."
        note: "Compliance dimension is independent of the content dimension - clearing does not move content_status."
      - from: CLEARED
        to: FLAGGED
        trigger: "POST /job-postings/{postingId}/compliance-review with decision FLAG"
        actor: ComplianceReviewer
        preconditions:
          - "compliance_status in {UNREVIEWED, CLEARED} (else ERR_POSTING_ALREADY_FLAGGED)"
          - "content_status != ARCHIVED (else ERR_POSTING_ALREADY_ARCHIVED)"
          - "X-User-ID != optimized_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Hop 1 of the compliance-flag cascade - compliance_status becomes FLAGGED and cleared_by_user_id is set to null."
          - "When content_status == PUBLISHED this triggers the PUBLISHED -> SUSPENDED transition above, which in turn triggers hops 3, 4 and 5 documented there."
          - "Set updated_at and increment version by 1."
      - from: FLAGGED
        to: CLEARED
        trigger: "POST /job-postings/{postingId}/compliance-review with decision CLEAR"
        actor: ComplianceReviewer
        preconditions:
          - "compliance_status == FLAGGED"
          - "X-User-ID != optimized_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "eeo_statement_included == true (else ERR_EEO_STATEMENT_MISSING)"
          - "superlative_claim_included == false OR substantiation_url is present (else ERR_UNSUBSTANTIATED_CLAIM)"
        side_effects:
          - "Set cleared_by_user_id; content_status stays SUSPENDED until an explicit publish call."
          - "Set updated_at and increment version by 1."

  - entity: MediaFlight
    initial_state: RESERVED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: null
        to: RESERVED
        trigger: "POST /media-flights"
        actor: MediaBuyer
        preconditions:
          - "expected_program_version == Program.version (else ERR_STALE_PROGRAM_VERSION, see concurrency_rules.flight-create-stale-program)"
          - "Channel.channel_type in {JOB_BOARD, SOCIAL, PROGRAMMATIC} (else ERR_CHANNEL_NOT_PAYABLE)"
          - "flight_days >= Channel.min_flight_days (else ERR_FLIGHT_TOO_SHORT)"
          - "No MediaFlight with the same channel_id AND the same job_family_id whose state is in {RESERVED, ACTIVE, PAUSED_PACING, SUSPENDED_CONTENT} has a half-open window [start_date, end_date) intersecting this one (else ERR_FLIGHT_WINDOW_OVERLAP)"
          - "daily_cap_cents + sum of daily_cap_cents over every MediaFlight on the same channel_id whose state is in {RESERVED, ACTIVE, PAUSED_PACING, SUSPENDED_CONTENT} and whose half-open window intersects this one <= Channel.daily_capacity_cents (else ERR_CHANNEL_DAILY_CAPACITY_EXCEEDED)"
          - "calculations.media_budget_waterfall can fund total_cost_cents in full (else ERR_MEDIA_BUDGET_EXHAUSTED)"
        side_effects:
          - "Compute flight_days, then calculations.flight_gross_cost into base_gross_cents, cost_tier, volume_discount_cents, platform_fee_cents and total_cost_cents."
          - "Run calculations.media_budget_waterfall - write one RESERVE BudgetLedgerEntry per drawn bucket in bucket order with ascending sequence_no, set reserved_cents to total_cost_cents."
          - "Raise Program.committed_budget_cents by total_cost_cents, lower Program.available_budget_cents by the same amount, and increment Program.version by 1."
          - "Raise JobFamily.reserved_cents by the amount drawn from the FAMILY_DEDICATED bucket."
      - from: RESERVED
        to: ACTIVE
        trigger: "POST /media-flights/{flightId}/activate"
        actor: MediaBuyer
        preconditions:
          - "state == RESERVED (else ERR_FLIGHT_NOT_RESERVED)"
          - "JobPosting.content_status == PUBLISHED (else ERR_POSTING_NOT_PUBLISHED)"
          - "JobPosting.compliance_status == CLEARED (else ERR_POSTING_COMPLIANCE_NOT_CLEARED)"
          - "Program.brand_health_score >= 55.00 (else ERR_BRAND_HEALTH_GATE)"
        side_effects:
          - "Set activated_at to the logical clock."
          - "Increment Channel.active_flight_count by 1, clear Channel.idle_since to null, and re-run calculations.channel_cpqa which rewrites blended_target_cents, cpqa_cents and pacing_status."
          - "Set updated_at and increment version by 1 on the flight and on the channel."
      - from: ACTIVE
        to: PAUSED_PACING
        trigger: "system - hop 4 of the qualification cascade, or of the spend-recording cascade, once Channel.pacing_status becomes THROTTLED"
        actor: system
        preconditions:
          - "state == ACTIVE"
          - "Channel.pacing_status was just set to THROTTLED in this request"
        side_effects:
          - "Set release_reason to PACING_THROTTLE and reserved_cents to 0."
          - "Hop 5 - write one RELEASE BudgetLedgerEntry per original RESERVE entry of this flight (same bucket, negated delta_cents, ascending sequence_no of the originals), lowering Program.committed_budget_cents and JobFamily.reserved_cents."
          - "Decrement Channel.active_flight_count by 1; the channel stays THROTTLED because a THROTTLED verdict computed earlier in the same request outranks the IDLE verdict."
          - "Set updated_at and increment version by 1 on the flight, the channel and the program."
      - from: PAUSED_PACING
        to: ACTIVE
        trigger: "POST /media-flights/{flightId}/resume"
        actor: MediaBuyer
        preconditions:
          - "state in {PAUSED_PACING, SUSPENDED_CONTENT} (else ERR_FLIGHT_NOT_RESUMABLE)"
          - "Channel.pacing_status != THROTTLED (else ERR_CHANNEL_THROTTLED)"
          - "JobPosting.content_status == PUBLISHED and JobPosting.compliance_status == CLEARED (else ERR_POSTING_NOT_PUBLISHED / ERR_POSTING_COMPLIANCE_NOT_CLEARED)"
          - "calculations.media_budget_waterfall can re-fund total_cost_cents in full (else ERR_MEDIA_BUDGET_EXHAUSTED)"
        side_effects:
          - "Re-run calculations.media_budget_waterfall for total_cost_cents, writing fresh RESERVE BudgetLedgerEntry rows, and set reserved_cents back to total_cost_cents."
          - "Set release_reason to null, increment Channel.active_flight_count by 1, clear idle_since, and re-run calculations.channel_cpqa."
          - "Set updated_at and increment version by 1 on the flight, the channel and the program."
      - from: ACTIVE
        to: SUSPENDED_CONTENT
        trigger: "system - hop 3 of the compliance-flag cascade"
        actor: system
        preconditions:
          - "state in {ACTIVE, PAUSED_PACING}"
          - "JobPosting.content_status just moved to SUSPENDED in this request"
        side_effects:
          - "Set release_reason to COMPLIANCE_SUSPENSION and reserved_cents to 0."
          - "Write mirroring RELEASE BudgetLedgerEntry rows, lowering Program.committed_budget_cents and JobFamily.reserved_cents."
          - "Decrement Channel.active_flight_count by 1 when the flight was ACTIVE."
          - "Set updated_at and increment version by 1 on the flight, the channel and the program."
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /media-flights/{flightId}/complete"
        actor: MediaBuyer
        preconditions:
          - "state in {ACTIVE, PAUSED_PACING} (else ERR_FLIGHT_NOT_COMPLETABLE)"
          - "The logical clock is at or after end_date T00:00:00Z (else ERR_FLIGHT_WINDOW_OPEN)"
        side_effects:
          - "Set release_reason to COMPLETED and reserved_cents to 0; write mirroring RELEASE BudgetLedgerEntry rows for whatever is still reserved."
          - "Decrement Channel.active_flight_count by 1 when the flight was ACTIVE; apply the same IDLE precedence rule."
          - "Set updated_at and increment version by 1 on the flight, the channel and the program."
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /media-flights/{flightId}/cancel"
        actor: MediaBuyer
        preconditions:
          - "state in {RESERVED, ACTIVE, PAUSED_PACING, SUSPENDED_CONTENT} (else ERR_FLIGHT_ALREADY_TERMINAL)"
        side_effects:
          - "Set release_reason to CANCELLED and reserved_cents to 0."
          - "Write one RELEASE BudgetLedgerEntry per outstanding RESERVE entry of this flight (same bucket, negated delta_cents, ascending sequence_no of the originals) so that Program.committed_budget_cents and JobFamily.reserved_cents return to their pre-reservation values."
          - "Decrement Channel.active_flight_count by 1 when the flight was ACTIVE, applying the IDLE precedence rule."
          - "Set updated_at and increment version by 1 on the flight, the channel and the program."

  - entity: Application
    initial_state: STARTED
    terminal_states: [DISQUALIFIED]
    transitions:
      - from: STARTED
        to: SUBMITTED
        trigger: "POST /applications/{applicationId}/submit"
        actor: Anonymous
        preconditions:
          - "status == STARTED (else ERR_APPLICATION_NOT_STARTED)"
          - "JobPosting.content_status == PUBLISHED (else ERR_POSTING_NOT_PUBLISHED)"
          - "JobPosting.compliance_status == CLEARED (else ERR_POSTING_COMPLIANCE_NOT_CLEARED)"
        side_effects:
          - "Set submitted_at to the logical clock - this is the anchor of the attribution lookback window."
          - "Raise JobPosting.submitted_count by 1 and re-run calculations.posting_conversion_metrics."
          - "Set updated_at and increment version by 1 on the application and the posting."
      - from: SUBMITTED
        to: SCREENED
        trigger: "POST /applications/{applicationId}/screen"
        actor: RecruitingOps
        preconditions:
          - "status == SUBMITTED (else ERR_APPLICATION_NOT_SUBMITTED)"
        side_effects:
          - "Set screened_at to the logical clock."
          - "Set updated_at and increment version by 1."
      - from: SCREENED
        to: QUALIFIED
        trigger: "POST /applications/{applicationId}/decide with outcome QUALIFIED"
        actor: RecruitingOps
        preconditions:
          - "status == SCREENED (else ERR_APPLICATION_NOT_SCREENED)"
          - "At least one Touchpoint satisfies the attribution input set of calculations.application_touch_credit (else ERR_NO_ELIGIBLE_TOUCHPOINT)"
        side_effects:
          - "Hop 1 - run calculations.application_touch_credit and write credit_bp on every eligible Touchpoint; set eligible_touch_count, attribution_model_applied, attributed_credit_bp_total to 10000 and decided_at."
          - "Hop 2 - because those touchpoint credits changed, raise Channel.credited_qualified_bp by the credit_bp of each touchpoint on that channel and raise MediaFlight.qualified_credit_bp for touchpoints whose media_flight_id is not null."
          - "Hop 3 - because Channel.credited_qualified_bp changed, re-run calculations.channel_blended_cpqa_target and calculations.channel_cpqa on each affected channel, rewriting blended_target_cents, cpqa_cents and pacing_status (THROTTLED when cpqa_cents exceeds the pacing threshold)."
          - "Hop 4 - because a channel became THROTTLED, every MediaFlight on it whose state is ACTIVE moves to PAUSED_PACING with release_reason PACING_THROTTLE and reserved_cents 0."
          - "Hop 5 - because those flights released their reservations, mirroring RELEASE BudgetLedgerEntry rows are written, lowering Program.committed_budget_cents and JobFamily.reserved_cents and raising Program.available_budget_cents."
          - "Raise JobPosting.qualified_count by 1; set Program.last_attribution_recompute_at to the logical clock."
          - "Set updated_at and increment version by 1 on every mutated entity."
      - from: SCREENED
        to: DISQUALIFIED
        trigger: "POST /applications/{applicationId}/decide with outcome DISQUALIFIED"
        actor: RecruitingOps
        preconditions:
          - "status in {SCREENED, QUALIFIED} (else ERR_APPLICATION_NOT_DECIDABLE)"
        side_effects:
          - "No attribution credit is assigned - every Touchpoint of this application keeps credit_bp 0 and no channel counter moves. This branch's side-effect set is deliberately disjoint from the QUALIFIED branch."
          - "Set decided_at; set updated_at and increment version by 1."
      - from: QUALIFIED
        to: DISQUALIFIED
        trigger: "POST /applications/{applicationId}/decide with outcome DISQUALIFIED"
        actor: RecruitingOps
        preconditions:
          - "status == QUALIFIED (else ERR_APPLICATION_NOT_DECIDABLE)"
        side_effects:
          - "Compensating action - set credit_bp to 0 on every Touchpoint of this application and lower Channel.credited_qualified_bp and MediaFlight.qualified_credit_bp by exactly the amounts removed, so the global identity sum(Channel.credited_qualified_bp) == 10000 * count(Application where status == QUALIFIED) still holds."
          - "Set attributed_credit_bp_total to 0 and attribution_model_applied to null; lower JobPosting.qualified_count by 1."
          - "Re-run calculations.channel_cpqa on every affected channel - a channel whose credited_qualified_bp returns to 0 goes back to pacing_status PACING_UNKNOWN with cpqa_cents and blended_target_cents null."
          - "Flights already moved to PAUSED_PACING stay PAUSED_PACING - reservations are not re-created by this compensation, they require an explicit resume."
          - "Set decided_at; set updated_at and increment version by 1 on every mutated entity."

  - entity: TalentCommunityMember
    initial_state: PENDING_CONFIRMATION
    terminal_states: [UNSUBSCRIBED]
    transitions:
      - from: PENDING_CONFIRMATION
        to: SUBSCRIBED
        trigger: "POST /talent-community-members/{memberId}/confirm-consent"
        actor: Anonymous
        preconditions:
          - "consent_status == PENDING_CONFIRMATION (else ERR_CONSENT_ALREADY_RESOLVED)"
          - "Request consent_token equals the stored consent_token (else ERR_CONSENT_TOKEN_INVALID)"
        side_effects:
          - "Set consent_confirmed_at and consent_changed_at to the logical clock."
          - "Set updated_at and increment version by 1."
      - from: SUBSCRIBED
        to: PAUSED
        trigger: "POST /talent-community-members/{memberId}/consent-change with action PAUSE"
        actor: Candidate
        preconditions:
          - "consent_status == SUBSCRIBED (else ERR_CONSENT_TRANSITION_INVALID)"
          - "The acting Candidate's X-User-ID equals this member's id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "Set consent_changed_at to the logical clock."
          - "Set updated_at and increment version by 1."
      - from: PAUSED
        to: SUBSCRIBED
        trigger: "POST /talent-community-members/{memberId}/consent-change with action RESUME"
        actor: Candidate
        preconditions:
          - "consent_status == PAUSED (else ERR_CONSENT_TRANSITION_INVALID)"
          - "The acting Candidate's X-User-ID equals this member's id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "Set consent_changed_at to the logical clock."
          - "Set updated_at and increment version by 1."
        note: "SUBSCRIBED and PAUSED form an unbounded consent cycle."
      - from: SUBSCRIBED
        to: UNSUBSCRIBED
        trigger: "POST /talent-community-members/{memberId}/consent-change with action UNSUBSCRIBE"
        actor: Candidate
        preconditions:
          - "consent_status in {PENDING_CONFIRMATION, SUBSCRIBED, PAUSED} (else ERR_CONSENT_ALREADY_RESOLVED)"
          - "The acting Candidate's X-User-ID equals this member's id, or the actor is a CommunityManager (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "Set consent_changed_at to the logical clock; the member is permanently excluded from every future dispatch audience."
          - "Set updated_at and increment version by 1."

  - entity: NurtureCampaign
    initial_state: DRAFT
    terminal_states: [DISPATCHED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /nurture-campaigns/{campaignId}/schedule"
        actor: CommunityManager
        preconditions:
          - "state == DRAFT (else ERR_CAMPAIGN_NOT_DRAFT)"
          - "Request scheduled_for is at or after the logical clock (else ERR_SCHEDULE_IN_PAST)"
        side_effects:
          - "Store scheduled_for; set updated_at and increment version by 1."
      - from: SCHEDULED
        to: DISPATCHED
        trigger: "POST /nurture-campaigns/{campaignId}/dispatch"
        actor: CommunityManager
        preconditions:
          - "state == SCHEDULED (else ERR_CAMPAIGN_NOT_SCHEDULED)"
          - "The logical clock is at or after scheduled_for (else ERR_DISPATCH_TOO_EARLY)"
          - "The eligibility filter of calculations.nurture_dispatch_selection yields at least one TalentCommunityMember with consent_status SUBSCRIBED (else ERR_NO_CONSENTED_AUDIENCE)"
          - "max_sends <= Program.send_quota_total - Program.send_quota_used (else ERR_SEND_QUOTA_EXCEEDED)"
        side_effects:
          - "Run calculations.nurture_dispatch_selection - write one NurtureSend per evaluated member in the pinned order with sequence_no 1..N and outcome SENT, SUPPRESSED_CONSENT or SUPPRESSED_FREQUENCY."
          - "For each SENT row raise TalentCommunityMember.sent_count_total by 1 and set last_sent_at to the logical clock."
          - "Raise Program.send_quota_used by the number of SENT rows; set dispatched_at; recompute audience_size, sent_count, suppressed_consent_count and suppressed_frequency_count."
          - "Set updated_at and increment version by 1 on the campaign, on every mutated member and on the program."
        note: "Branching fork - DISPATCHED and CANCELLED carry disjoint side-effect sets; CANCELLED writes no NurtureSend row and never touches send_quota_used."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /nurture-campaigns/{campaignId}/cancel"
        actor: CommunityManager
        preconditions:
          - "state in {DRAFT, SCHEDULED} (else ERR_CAMPAIGN_ALREADY_TERMINAL)"
        side_effects:
          - "No NurtureSend row is written and Program.send_quota_used is unchanged."
          - "Set updated_at and increment version by 1."

  - entity: EmployerReview
    initial_state: NEW
    terminal_states: [RESPONSE_PUBLISHED, CLOSED_NO_RESPONSE]
    transitions:
      - from: NEW
        to: TRIAGED
        trigger: "POST /employer-reviews/{reviewId}/triage"
        actor: CommunityManager
        preconditions:
          - "state == NEW (else ERR_REVIEW_NOT_NEW)"
        side_effects:
          - "Re-evaluate sla_status against response_due_at and the logical clock."
          - "Set updated_at and increment version by 1."
      - from: TRIAGED
        to: DRAFTING
        trigger: "POST /employer-reviews/{reviewId}/draft-response"
        actor: CommunityManager
        preconditions:
          - "state in {TRIAGED, DRAFTING} (else ERR_REVIEW_NOT_DRAFTABLE)"
        side_effects:
          - "Store response_body and set drafted_by_user_id to the acting X-User-ID."
          - "Set updated_at and increment version by 1."
      - from: DRAFTING
        to: LEGAL_REVIEW
        trigger: "POST /employer-reviews/{reviewId}/submit-legal"
        actor: CommunityManager
        preconditions:
          - "state == DRAFTING (else ERR_REVIEW_NOT_DRAFTING)"
          - "response_body is present (else ERR_RESPONSE_BODY_MISSING)"
        side_effects:
          - "Set updated_at and increment version by 1."
      - from: LEGAL_REVIEW
        to: RESPONSE_PUBLISHED
        trigger: "POST /employer-reviews/{reviewId}/legal-review with decision APPROVE"
        actor: ComplianceReviewer
        preconditions:
          - "state == LEGAL_REVIEW (else ERR_REVIEW_NOT_IN_LEGAL_REVIEW)"
          - "X-User-ID != drafted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Set approved_by_user_id and responded_at; set sla_status to MET when responded_at <= response_due_at and to BREACHED otherwise."
          - "Re-run calculations.program_brand_health_score and store it on Program.brand_health_score."
          - "Set updated_at and increment version by 1 on the review and the program."
      - from: LEGAL_REVIEW
        to: DRAFTING
        trigger: "POST /employer-reviews/{reviewId}/legal-review with decision REJECT"
        actor: ComplianceReviewer
        preconditions:
          - "state == LEGAL_REVIEW (else ERR_REVIEW_NOT_IN_LEGAL_REVIEW)"
          - "X-User-ID != drafted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Increment rejection_count by 1; response_body is retained for editing."
          - "Set updated_at and increment version by 1."
        note: "Rejection cycle - DRAFTING, LEGAL_REVIEW and back to DRAFTING may repeat without bound."
      - from: TRIAGED
        to: CLOSED_NO_RESPONSE
        trigger: "POST /employer-reviews/{reviewId}/close"
        actor: CommunityManager
        preconditions:
          - "state == TRIAGED (else ERR_REVIEW_NOT_CLOSABLE)"
          - "rating >= 4 (else ERR_RESPONSE_REQUIRED)"
        side_effects:
          - "Set responded_at and sla_status (MET when responded_at <= response_due_at, BREACHED otherwise)."
          - "Re-run calculations.program_brand_health_score and store it on Program.brand_health_score."
          - "Set updated_at and increment version by 1 on the review and the program."

  - entity: EventPresence
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: CONFIRMED
        trigger: "POST /event-presences/{presenceId}/confirm"
        actor: MediaBuyer
        preconditions:
          - "state == PLANNED (else ERR_PRESENCE_NOT_PLANNED)"
          - "For every other EventPresence with the same job_family_id whose state is CONFIRMED or COMPLETED, this presence satisfies start_at >= other.end_at + 48h OR end_at + 48h <= other.start_at, treating both intervals as closed on both ends (else ERR_EVENT_BUFFER_CONFLICT)"
          - "calculations.media_budget_waterfall can fund booth_cost_cents in full from the FAMILY_DEDICATED then FLEX_RESERVE buckets (else ERR_MEDIA_BUDGET_EXHAUSTED)"
        side_effects:
          - "Run the event variant of calculations.media_budget_waterfall - write one RESERVE BudgetLedgerEntry per drawn bucket with source_type EVENT_PRESENCE and reason EVENT_RESERVATION; set reserved_cents to booth_cost_cents and confirmed_at to the logical clock."
          - "Raise Program.committed_budget_cents and JobFamily.reserved_cents; increment Program.version by 1."
          - "Set updated_at and increment version by 1."
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /event-presences/{presenceId}/complete"
        actor: MediaBuyer
        preconditions:
          - "state == CONFIRMED (else ERR_PRESENCE_NOT_CONFIRMED)"
          - "The logical clock is strictly after end_at (else ERR_EVENT_WINDOW_OPEN)"
        side_effects:
          - "reserved_cents stays at booth_cost_cents - completion converts the reservation into spend and writes no ledger entry."
          - "Set updated_at and increment version by 1."
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /event-presences/{presenceId}/cancel"
        actor: MediaBuyer
        preconditions:
          - "state in {PLANNED, CONFIRMED} (else ERR_PRESENCE_ALREADY_TERMINAL)"
        side_effects:
          - "When the presence was CONFIRMED, write one RELEASE BudgetLedgerEntry per outstanding RESERVE entry of this presence (same bucket, negated delta_cents, ascending sequence_no of the originals, reason EVENT_CANCELLED) and set reserved_cents to 0, restoring Program.committed_budget_cents and JobFamily.reserved_cents to their pre-confirmation values."
          - "When the presence was PLANNED, no ledger entry is written."
          - "Set updated_at and increment version by 1 on the presence and, when money moved, on the program."

concurrency_rules:
  - rule_id: flight-create-stale-program
    parent_entity: Program
    write_endpoint: "POST /media-flights"
    occ_field: "expected_program_version"
    description: |
      Creating a MediaFlight against a Program whose version has advanced since
      the client last read it is rejected. The product deliberately allows a new
      flight to draw from the same waterfall buckets as an earlier one, so the
      second create would otherwise succeed against a budget picture the client
      never saw - the stale-version check forces the buyer to re-read the
      program's remaining budget before committing more money.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412

  - rule_id: posting-optimize-stale-posting
    parent_entity: JobPosting
    write_endpoint: "POST /job-postings/{postingId}/optimize"
    occ_field: "expected_posting_version"
    description: |
      Re-running optimization against a JobPosting whose version has advanced
      since the client last read it is rejected. Each optimize call legitimately
      supersedes the previous optimization revision and resets compliance_status
      to UNREVIEWED, so an optimize built on a stale copy of the posting would
      silently discard a newer revision; the stale-version check turns that into
      a 412 the client must resolve by re-reading the posting.
    error_id: ERR_STALE_POSTING_VERSION
    http_status: 412

calculations:
  - name: application_touch_credit
    trigger: "state_machines.Application transition SCREENED -> QUALIFIED (POST /applications/{applicationId}/decide with outcome QUALIFIED); reversed by the QUALIFIED -> DISQUALIFIED compensation."
    algorithm: weighted_scoring
    formula: |
      # Step 1 - input set (eligible touchpoints)
      T = [ t in Touchpoint
            where t.application_id == app.id
              and t.occurred_at >  app.submitted_at - ATTRIBUTION_LOOKBACK_DAYS days   # lower bound EXCLUSIVE
              and t.occurred_at <= app.submitted_at ]                                  # upper bound INCLUSIVE
      order T by (occurred_at ASC, created_at ASC)        # never by id
      n = count(T)
      if n == 0: reject ERR_NO_ELIGIBLE_TOUCHPOINT

      # Step 2 - weights, selected by Program.attribution_model
      if Program.attribution_model == LINEAR:
          w[i] = 1                       for every i in 0..n-1
      else:                              # POSITION_BASED
          if n == 1: w = [1]
          elif n == 2: w = [1, 1]
          else:
              w[0]   = FIRST_TOUCH_WEIGHT_BP            # 4000
              w[n-1] = LAST_TOUCH_WEIGHT_BP             # 4000
              w[i]   = MIDDLE_TOUCH_POOL_BP / (n - 2)   # exact rational, 2000 / middles
      # Step 3 - allocate exactly 10000 bp, PINNED ORDER: floor first, then remainder
      exact[i]    = 10000 * w[i] / sum(w)      # exact rational, NOT rounded here
      floor_bp[i] = floor(exact[i])
      R           = 10000 - sum(floor_bp)
      frac[i]     = exact[i] - floor_bp[i]
      award 1 extra bp to the R entries with the largest frac[i];
        ties on frac[i] are broken by occurred_at ASC, then created_at ASC
      credit_bp[i] = floor_bp[i] + (1 if entry i was awarded else 0)
      # Forbidden alternative: rounding each exact[i] half-up independently, which
      # can sum to 10001 or 9999. The floor-then-largest-remainder order is normative.
    input_set: "Touchpoint rows of the deciding Application whose occurred_at lies in the half-open lookback window (app.submitted_at - 30d, app.submitted_at]; touchpoints of any touch_type and of any media_flight_id including null are included; touchpoints outside the window are excluded and keep credit_bp 0."
    constants:
      ATTRIBUTION_LOOKBACK_DAYS: 30
      TOTAL_CREDIT_BP: 10000
      FIRST_TOUCH_WEIGHT_BP: 4000
      LAST_TOUCH_WEIGHT_BP: 4000
      MIDDLE_TOUCH_POOL_BP: 2000
    precision: "Integer basis points; exactly 10000 bp distributed per QUALIFIED application, floor-then-largest-remainder."
    variants:
      - name: linear_multi_touch
        when: "Program.attribution_model == LINEAR"
        difference: "Every eligible touchpoint carries weight 1, so credit is spread evenly and the remainder lands on the earliest touchpoints; with n=3 the credits are 3334/3333/3333."
      - name: position_based_multi_touch
        when: "Program.attribution_model == POSITION_BASED"
        difference: "First and last touch each take 4000 bp and the middle touches share 2000 bp; with n=3 the credits are 4000/2000/4000 - the same touchpoints, the same application, different per-channel credit."

  - name: channel_blended_cpqa_target
    trigger: "Every recompute of Channel.credited_qualified_bp - the qualification cascade hop 3, the QUALIFIED -> DISQUALIFIED compensation, POST /media-flights/{flightId}/activate, POST /media-flights/{flightId}/resume and POST /media-flights/{flightId}/spend."
    algorithm: aggregation
    formula: |
      # bp contributed to this channel by each job family
      for each JobFamily f of the channel's program:
          bp[f] = sum of t.credit_bp over Touchpoint t
                  where t.channel_id == channel.id
                    and Application(t.application_id).status == QUALIFIED
                    and JobPosting(Application(t.application_id).job_posting_id).job_family_id == f.id
      TOTAL = sum over f of bp[f]
      if TOTAL == 0:
          blended_target_cents = null
      else:
          blended_target_cents = round_half_up( sum over f of (f.cpqa_target_cents * bp[f]) / TOTAL )
          # single division and a single rounding at the very end; per-family terms are
          # accumulated as exact integers (cents * bp) and never rounded individually
    input_set: "Touchpoint rows on this channel whose owning Application.status is QUALIFIED; touchpoints of applications in any other status contribute 0."
    constants: {}
    precision: "Integer cents, round_half_up, applied once after the division."

  - name: channel_cpqa
    trigger: "Same triggers as channel_blended_cpqa_target - it always runs immediately after it, on the same channel, in the same request."
    algorithm: threshold
    formula: |
      if channel.credited_qualified_bp == 0:
          cpqa_cents = null
          blended_target_cents = null
          pacing_status = PACING_UNKNOWN            # IDLE is only set by the flight-departure rule below
      else:
          cpqa_cents = round_half_up( channel.spent_cents * TOTAL_CREDIT_BP / channel.credited_qualified_bp )
          pacing_threshold_cents = round_half_up( channel.blended_target_cents * PACING_TOLERANCE_NUM / PACING_TOLERANCE_DEN )
          pacing_status = THROTTLED if cpqa_cents >  pacing_threshold_cents else ON_TARGET
          # STRICTLY greater: cpqa_cents == pacing_threshold_cents stays ON_TARGET
      # IDLE precedence: when a flight departure in the same request drives
      # Channel.active_flight_count to 0, pacing_status becomes IDLE ONLY IF this
      # calculation did not set THROTTLED earlier in the same request.
    input_set: "channel.spent_cents is the sum of MediaFlight.spent_cents over every flight on the channel in any state, including CANCELLED and COMPLETED ones; credited_qualified_bp counts only touchpoints of QUALIFIED applications."
    constants:
      TOTAL_CREDIT_BP: 10000
      PACING_TOLERANCE_NUM: 12
      PACING_TOLERANCE_DEN: 10
    precision: "Integer cents, round_half_up on both the CPQA and the threshold."

  - name: flight_gross_cost
    trigger: "POST /media-flights (creation of a MediaFlight); the stored outputs are never recomputed afterwards."
    algorithm: tiered_pricing
    formula: |
      # PINNED EVALUATION ORDER - the tier is fixed by step 2 from base_gross_cents and is
      # NOT re-derived from the post-discount amount; the fee base IS the post-discount amount.
      flight_days           = (end_date - start_date) in whole days      # half-open window
      base_gross_cents      = daily_cap_cents * flight_days                       # step 1
      cost_tier             = TIER_1 if base_gross_cents <  TIER_2_FLOOR_CENTS    # step 2
                              else TIER_2 if base_gross_cents < TIER_3_FLOOR_CENTS
                              else TIER_3
      volume_discount_cents = floor( base_gross_cents * DISCOUNT_RATE[cost_tier] )  # step 3, FLOOR
      net_media_cents       = base_gross_cents - volume_discount_cents            # step 4
      platform_fee_cents    = round_half_up( net_media_cents
                                             * FEE_RATE[channel.channel_type][cost_tier] )  # step 5
      total_cost_cents      = net_media_cents + platform_fee_cents                # step 6
      # Two wrong readings this pins away from:
      #   (i)  re-deriving the tier from net_media_cents (a discount can push a TIER_2
      #        flight below TIER_2_FLOOR_CENTS, which would pick a TIER_1 fee rate);
      #   (ii) charging the platform fee on base_gross_cents instead of net_media_cents.
    input_set: "A single MediaFlight and its Channel; no other rows participate."
    constants:
      TIER_2_FLOOR_CENTS: 500000
      TIER_3_FLOOR_CENTS: 2000000
      DISCOUNT_RATE: { TIER_1: 0.00, TIER_2: 0.05, TIER_3: 0.08 }
      FEE_RATE:
        JOB_BOARD: { TIER_1: 0.03, TIER_2: 0.03, TIER_3: 0.02 }
        SOCIAL: { TIER_1: 0.06, TIER_2: 0.05, TIER_3: 0.04 }
        PROGRAMMATIC: { TIER_1: 0.10, TIER_2: 0.09, TIER_3: 0.07 }
    precision: "Integer cents; floor on the volume discount, round_half_up on the platform fee, no other rounding."

  - name: media_budget_waterfall
    trigger: "POST /media-flights, POST /media-flights/{flightId}/resume (re-reservation of total_cost_cents) and POST /event-presences/{presenceId}/confirm (reservation of booth_cost_cents)."
    algorithm: waterfall_allocation
    formula: |
      need = total_cost_cents (MediaFlight) or booth_cost_cents (EventPresence)
      buckets = [ FAMILY_DEDICATED ]
      if source is a MediaFlight:
          buckets += [ POOL_JOB_BOARD    if channel.channel_type == JOB_BOARD
                       else POOL_SOCIAL  if channel.channel_type == SOCIAL
                       else POOL_PROGRAMMATIC ]        # exactly one channel-type pool
      buckets += [ FLEX_RESERVE ]                      # EventPresence skips the pool step entirely
      available(FAMILY_DEDICATED) = JobFamily.dedicated_budget_cents - JobFamily.reserved_cents
      available(POOL_X)           = Program.pool_x_cents
                                   - sum of BudgetLedgerEntry.delta_cents over entries
                                     of this program with bucket == POOL_X
      available(FLEX_RESERVE)     = Program.flex_reserve_cents
                                   - sum of BudgetLedgerEntry.delta_cents over entries
                                     of this program with bucket == FLEX_RESERVE
      draws = []
      for bucket in buckets:                            # strict bucket order, no re-visits
          if need == 0: break
          draw = max(0, min(need, available(bucket)))
          if draw > 0:
              draws.append((bucket, draw)); need -= draw
      if need > 0:
          reject ERR_MEDIA_BUDGET_EXHAUSTED and persist nothing   # all-or-nothing
      emit one RESERVE BudgetLedgerEntry per draw, in bucket order, with ascending sequence_no
    input_set: "Only BudgetLedgerEntry rows of the same program participate in the availability sums; RELEASE entries are negative and therefore restore availability automatically."
    constants: {}
    precision: "Integer cents; every draw is exact, no rounding and no remainder."

  - name: persona_channel_mix
    trigger: "POST /channel-preference-signals (recompute for the signal's persona) and state_machines.CandidatePersona transition DRAFT -> IN_REVIEW."
    algorithm: weighted_scoring
    formula: |
      now = logical clock
      S = [ s in ChannelPreferenceSignal
            where s.persona_id == persona.id
              and s.collected_at >  now - persona.research_window_days days   # lower bound EXCLUSIVE
              and s.collected_at <= now ]                                     # upper bound INCLUSIVE
      signal_count = count(S)
      if signal_count == 0:
          channel_mix = []; mix_confidence_pct = 0; return

      # per-signal weight, selected by persona.mix_method
      if persona.mix_method == SURVEY_WEIGHTED:
          w[s] = s.sample_size
      else:                                    # ENGAGEMENT_WEIGHTED
          age_days[s]  = floor( (now - s.collected_at) / 86400 seconds )
          decay_pct[s] = max( DECAY_FLOOR_PCT, 100 - DECAY_STEP_PCT * floor(age_days[s] / DECAY_STEP_DAYS) )
          w[s]         = s.engagement_events * decay_pct[s] / 100          # exact rational

      score[c] = sum over s in S with s.channel_id == c of ( w[s] * s.preference_score )   # exact rational
      TOTAL    = sum over c of score[c]
      if TOTAL == 0:
          channel_mix = []; mix_confidence_pct = min(100, floor(sum of s.sample_size / SAMPLE_PER_CONFIDENCE_PCT)); return

      # allocate exactly 10000 bp with the same floor-then-largest-remainder order as
      # application_touch_credit; candidate order for the remainder is
      # (Channel.created_at ASC, Channel.name ASC) - never Channel.id
      exact[c]    = 10000 * score[c] / TOTAL
      floor_bp[c] = floor(exact[c])
      R           = 10000 - sum(floor_bp)
      award 1 extra bp to the R channels with the largest fractional part,
        ties broken by Channel.created_at ASC then Channel.name ASC
      share_bp[c] = floor_bp[c] + (1 if awarded else 0)
      channel_mix = [ { channel_id: c, share_bp: share_bp[c] } for every c with score[c] > 0 ],
                    ordered by share_bp DESC, then Channel.created_at ASC
      mix_confidence_pct = min( 100, floor( sum over s in S of s.sample_size / SAMPLE_PER_CONFIDENCE_PCT ) )
    input_set: "ChannelPreferenceSignal rows of this persona whose collected_at is inside the half-open research window (now - research_window_days, now]; channels with score 0 are omitted from channel_mix but their signals still count towards mix_confidence_pct."
    constants:
      SAMPLE_PER_CONFIDENCE_PCT: 10
      DECAY_STEP_DAYS: 30
      DECAY_STEP_PCT: 10
      DECAY_FLOOR_PCT: 10
      MIN_CONFIDENCE_TO_SUBMIT_PCT: 40
    precision: "Integer basis points summing to exactly 10000 whenever TOTAL > 0; mix_confidence_pct is an integer 0-100 (floor)."
    variants:
      - name: survey_weighted_mix
        when: "persona.mix_method == SURVEY_WEIGHTED"
        difference: "Weights are raw sample_size values with no time decay, so an old high-sample survey can dominate the mix."
        
      - name: engagement_weighted_mix
        when: "persona.mix_method == ENGAGEMENT_WEIGHTED"
        difference: "Weights are engagement_events scaled by a 10-percent-per-30-days step decay floored at 10 percent, so the identical signal set yields a different share_bp split - and a signal with engagement_events 0 contributes nothing at all."

  - name: nurture_dispatch_selection
    trigger: "state_machines.NurtureCampaign transition SCHEDULED -> DISPATCHED (POST /nurture-campaigns/{campaignId}/dispatch)."
    algorithm: chronological
    formula: |
      now = logical clock
      # (a) eligibility filter - explicit enum predicate, no fuzzy adjectives
      A = [ m in TalentCommunityMember
            where m.program_id == campaign.program_id
              and m.consent_status in { SUBSCRIBED, PAUSED }
              and ( campaign.job_family_id is null
                    or m.interest_job_family_id == campaign.job_family_id ) ]
      # (b) ranking expression - creation order; (c) tie-break: none needed, created_at is
      #     unique per member because ids are minted sequentially in time; a genuine
      #     collision is resolved by email ASC.  id is NEVER used.
      order A by (created_at ASC, email ASC)
      # (d) empty-candidate fallback
      if no member of A has consent_status == SUBSCRIBED: reject ERR_NO_CONSENTED_AUDIENCE
      E = first campaign.max_sends members of A          # evaluated set, may be shorter than max_sends
      seq = 0
      for m in E:                                        # strict order
          seq += 1
          window_send_count = count( s in NurtureSend
                                     where s.member_id == m.id
                                       and s.outcome == SENT
                                       and s.sent_at > now - FREQUENCY_WINDOW_DAYS days )   # STRICTLY greater
          # PINNED CHECK ORDER: consent before frequency
          if m.consent_status != SUBSCRIBED:
              outcome = SUPPRESSED_CONSENT
          elif window_send_count >= m.frequency_cap_per_30d:      # >= , not >
              outcome = SUPPRESSED_FREQUENCY
          else:
              outcome = SENT
          write NurtureSend { campaign_id, member_id: m.id, outcome, sequence_no: seq,
                              evaluated_at: now, sent_at: (now if outcome == SENT else null),
                              window_send_count_at_eval: window_send_count }
    input_set: "Members with consent_status PENDING_CONFIRMATION or UNSUBSCRIBED are outside the audience and receive no NurtureSend row at all; PAUSED members are inside the audience and are logged as SUPPRESSED_CONSENT."
    constants:
      FREQUENCY_WINDOW_DAYS: 30
      DEFAULT_FREQUENCY_CAP: 4
    precision: "Integer counts; a send at exactly now - 30 days is OUTSIDE the window (lower bound exclusive)."

  - name: posting_optimization_score
    trigger: "state_machines.JobPosting transition DRAFT -> OPTIMIZED and the OPTIMIZED -> OPTIMIZED self-transition (POST /job-postings/{postingId}/optimize)."
    algorithm: weighted_scoring
    formula: |
      title_word_count = number of whitespace-delimited tokens in title
      w_title = 25 if 3 <= title_word_count <= 12
                else 10 if title_word_count <= 20
                else 0
      w_resp  = 20 if responsibility_count >= 5 else 4 * responsibility_count
      w_pay   = 15 if pay_range_min_cents is not null
                     and pay_range_max_cents is not null
                     and pay_range_max_cents >= pay_range_min_cents
                else 0
      w_eeo   = 15 if eeo_statement_included == true else 0
      w_benef = 5 * min(5, benefit_count)
      optimization_score = w_title + w_resp + w_pay + w_eeo + w_benef      # 0..100, integer
    input_set: "Only the posting's own input fields; no cross-entity data."
    constants:
      MIN_SCORE_TO_PUBLISH: 70
    precision: "Integer 0-100; publish requires optimization_score >= 70, so exactly 70 publishes."

  - name: posting_conversion_metrics
    trigger: "POST /applications (apply_start_count), state_machines.Application transition STARTED -> SUBMITTED (submitted_count) and every decide transition (qualified_count)."
    algorithm: aggregation
    formula: |
      apply_start_count = count( a in Application where a.job_posting_id == posting.id )   # any status
      submitted_count   = count( a where a.status in { SUBMITTED, SCREENED, QUALIFIED, DISQUALIFIED } )
      qualified_count   = count( a where a.status == QUALIFIED )
      conversion_rate_bp = null if apply_start_count == 0
                           else floor( 10000 * submitted_count / apply_start_count )
    input_set: "Every Application of the posting including STARTED ones; STARTED applications raise the denominator but not the numerator."
    constants: {}
    precision: "Integer basis points, floor."

  - name: review_response_deadline
    trigger: "POST /employer-reviews (creation of an EmployerReview)."
    algorithm: threshold
    formula: |
      sla_hours = SLA_HOURS_LOW      if rating <= 2      # 24
                  else SLA_HOURS_MID if rating == 3      # 72
                  else SLA_HOURS_HIGH                    # 168
      response_due_at = posted_at + sla_hours hours
    input_set: "A single EmployerReview row."
    constants:
      SLA_HOURS_LOW: 24
      SLA_HOURS_MID: 72
      SLA_HOURS_HIGH: 168
    precision: "Exact ISO 8601 instants with three fractional digits."

  - name: program_brand_health_score
    trigger: "POST /employer-reviews, the EmployerReview transitions LEGAL_REVIEW -> RESPONSE_PUBLISHED and TRIAGED -> CLOSED_NO_RESPONSE, and POST /_clock/set_current_utc (which re-evaluates sla_status and the 90-day window for every program)."
    algorithm: decay_function
    formula: |
      now = logical clock
      W = [ r in EmployerReview
            where r.program_id == program.id
              and r.posted_at >  now - HEALTH_WINDOW_DAYS days     # lower bound EXCLUSIVE
              and r.posted_at <= now ]
      age_days(r)        = floor( (now - r.posted_at) / 86400 seconds )
      recency_weight(r)  = 1.00 if age_days(r) <= 30
                           else 0.50 if age_days(r) <= 60
                           else 0.25
      rating_penalty     = sum over r in W of max(0, 3 - r.rating) * RATING_PENALTY_PER_STAR * recency_weight(r)
      sla_penalty        = SLA_BREACH_PENALTY * count( r in W where r.sla_status == BREACHED )
      brand_health_score = round_half_up( max(0, min(100, 100 - rating_penalty - sla_penalty)), 2 )
      # exact decimal arithmetic throughout; the single round_half_up happens at the end
    input_set: "EmployerReview rows of the program whose posted_at is inside the half-open 90-day window; reviews outside it contribute nothing regardless of state."
    constants:
      HEALTH_WINDOW_DAYS: 90
      RATING_PENALTY_PER_STAR: 2.5
      SLA_BREACH_PENALTY: 5.0
      FLIGHT_ACTIVATION_MIN_HEALTH: 55.00
    precision: "Number with 2 decimal places, round_half_up, clamped to [0.00, 100.00]."

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and non-empty on every endpoint whose roles list does not contain Anonymous."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of the eight roles declared in the RBAC matrix."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "The acting role appears in the called endpoint's roles list."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 4
    category: business_constraint
    check: "Request body conforms to the endpoint's input schema - required fields present, types correct, enum members valid, integer ranges respected, ISO 8601 datetimes well formed."
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints"
  - priority: 5
    category: business_constraint
    check: "limit is an integer in [1, 100] and offset is an integer >= 0."
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"
  - priority: 6
    category: existence
    check: "Every path id resolves, validated left to right - programs -> ERR_PROGRAM_NOT_FOUND, job-families -> ERR_JOB_FAMILY_NOT_FOUND, channels -> ERR_CHANNEL_NOT_FOUND, candidate-personas -> ERR_PERSONA_NOT_FOUND, job-postings -> ERR_POSTING_NOT_FOUND, media-flights -> ERR_FLIGHT_NOT_FOUND, applications -> ERR_APPLICATION_NOT_FOUND, talent-community-members -> ERR_MEMBER_NOT_FOUND, nurture-campaigns -> ERR_CAMPAIGN_NOT_FOUND, employer-reviews -> ERR_REVIEW_NOT_FOUND, event-presences -> ERR_PRESENCE_NOT_FOUND, channel-preference-signals / touchpoints / nurture-sends / budget-ledger-entries -> ERR_RECORD_NOT_FOUND."
    error_id: ERR_POSTING_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 7
    category: existence
    check: "Every foreign key supplied in a request body resolves to an existing row of the declared parent entity, validated in the order the fields appear in the endpoint's input list."
    error_id: ERR_JOB_FAMILY_NOT_FOUND
    http_status: 404
    applies_to: "all write endpoints carrying FK fields"
  - priority: 8
    category: auth
    check: "A Candidate may only act on the TalentCommunityMember whose id equals the acting X-User-ID."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /talent-community-members/{memberId}/consent-change"
  - priority: 9
    category: business_safety
    check: "Segregation of duties - the acting X-User-ID must differ from the id that performed the paired upstream step - persona review vs CandidatePersona.drafted_by_user_id, posting compliance review vs JobPosting.optimized_by_user_id, review legal decision vs EmployerReview.drafted_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /candidate-personas/{personaId}/review, POST /job-postings/{postingId}/compliance-review, POST /employer-reviews/{reviewId}/legal-review"
  - priority: 10
    category: business_constraint
    check: "Scoped uniqueness - JobFamily.code unique per program_id (ERR_DUPLICATE_FAMILY_CODE), TalentCommunityMember.email unique per program_id (ERR_DUPLICATE_MEMBER_EMAIL), EmployerReview.external_ref unique per platform (ERR_DUPLICATE_REVIEW_REF)."
    error_id: ERR_DUPLICATE_FAMILY_CODE
    http_status: 409
    applies_to: "POST /job-families, POST /talent-community-members, POST /employer-reviews"
  - priority: 11
    category: state
    check: "expected_program_version equals Program.version."
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
    applies_to: "POST /media-flights"
  - priority: 12
    category: state
    check: "expected_posting_version equals JobPosting.version."
    error_id: ERR_STALE_POSTING_VERSION
    http_status: 412
    applies_to: "POST /job-postings/{postingId}/optimize"
  - priority: 13
    category: state
    check: "CandidatePersona is in the state the requested transition departs from - submit needs DRAFT (ERR_PERSONA_NOT_DRAFT), review needs IN_REVIEW (ERR_PERSONA_NOT_IN_REVIEW), retire needs APPROVED (ERR_PERSONA_NOT_APPROVED)."
    error_id: ERR_PERSONA_NOT_DRAFT
    http_status: 409
    applies_to: "POST /candidate-personas/{personaId}/submit, /review, /retire"
  - priority: 14
    category: state
    check: "JobPosting.content_status permits the requested content transition - optimize needs DRAFT or OPTIMIZED (ERR_POSTING_NOT_OPTIMIZABLE), publish needs OPTIMIZED or SUSPENDED (ERR_POSTING_NOT_PUBLISHABLE), archive needs a non-ARCHIVED posting (ERR_POSTING_ALREADY_ARCHIVED)."
    error_id: ERR_POSTING_NOT_PUBLISHABLE
    http_status: 409
    applies_to: "POST /job-postings/{postingId}/optimize, /publish, /archive"
  - priority: 15
    category: state
    check: "JobPosting.compliance_status permits the requested compliance decision - CLEAR needs UNREVIEWED or FLAGGED (ERR_POSTING_ALREADY_CLEARED), FLAG needs UNREVIEWED or CLEARED (ERR_POSTING_ALREADY_FLAGGED)."
    error_id: ERR_POSTING_ALREADY_CLEARED
    http_status: 409
    applies_to: "POST /job-postings/{postingId}/compliance-review"
  - priority: 16
    category: state
    check: "MediaFlight.state permits the requested transition - activate needs RESERVED (ERR_FLIGHT_NOT_RESERVED), resume needs PAUSED_PACING or SUSPENDED_CONTENT (ERR_FLIGHT_NOT_RESUMABLE), complete needs ACTIVE or PAUSED_PACING (ERR_FLIGHT_NOT_COMPLETABLE), cancel needs a non-terminal flight (ERR_FLIGHT_ALREADY_TERMINAL), spend needs ACTIVE or PAUSED_PACING and is rejected on COMPLETED or CANCELLED flights (ERR_FLIGHT_ALREADY_TERMINAL)."
    error_id: ERR_FLIGHT_NOT_RESERVED
    http_status: 409
    applies_to: "POST /media-flights/{flightId}/activate, /resume, /complete, /cancel, /spend"
  - priority: 17
    category: state
    check: "Application.status permits the requested transition - submit needs STARTED (ERR_APPLICATION_NOT_STARTED), screen needs SUBMITTED (ERR_APPLICATION_NOT_SUBMITTED), decide QUALIFIED needs SCREENED (ERR_APPLICATION_NOT_SCREENED), decide DISQUALIFIED needs SCREENED or QUALIFIED (ERR_APPLICATION_NOT_DECIDABLE)."
    error_id: ERR_APPLICATION_NOT_SCREENED
    http_status: 409
    applies_to: "POST /applications/{applicationId}/submit, /screen, /decide"
  - priority: 18
    category: state
    check: "TalentCommunityMember.consent_status permits the requested action - confirm-consent needs PENDING_CONFIRMATION (ERR_CONSENT_ALREADY_RESOLVED), PAUSE needs SUBSCRIBED and RESUME needs PAUSED (ERR_CONSENT_TRANSITION_INVALID), UNSUBSCRIBE needs a non-UNSUBSCRIBED member (ERR_CONSENT_ALREADY_RESOLVED)."
    error_id: ERR_CONSENT_TRANSITION_INVALID
    http_status: 409
    applies_to: "POST /talent-community-members/{memberId}/confirm-consent, /consent-change"
  - priority: 19
    category: state
    check: "NurtureCampaign.state permits the requested transition - schedule needs DRAFT (ERR_CAMPAIGN_NOT_DRAFT), dispatch needs SCHEDULED (ERR_CAMPAIGN_NOT_SCHEDULED), cancel needs DRAFT or SCHEDULED (ERR_CAMPAIGN_ALREADY_TERMINAL)."
    error_id: ERR_CAMPAIGN_NOT_SCHEDULED
    http_status: 409
    applies_to: "POST /nurture-campaigns/{campaignId}/schedule, /dispatch, /cancel"
  - priority: 20
    category: state
    check: "EmployerReview.state permits the requested transition - triage needs NEW (ERR_REVIEW_NOT_NEW), draft-response needs TRIAGED or DRAFTING (ERR_REVIEW_NOT_DRAFTABLE), submit-legal needs DRAFTING (ERR_REVIEW_NOT_DRAFTING), legal-review needs LEGAL_REVIEW (ERR_REVIEW_NOT_IN_LEGAL_REVIEW), close needs TRIAGED (ERR_REVIEW_NOT_CLOSABLE)."
    error_id: ERR_REVIEW_NOT_IN_LEGAL_REVIEW
    http_status: 409
    applies_to: "POST /employer-reviews/{reviewId}/triage, /draft-response, /submit-legal, /legal-review, /close"
  - priority: 21
    category: state
    check: "EventPresence.state permits the requested transition - confirm needs PLANNED (ERR_PRESENCE_NOT_PLANNED), complete needs CONFIRMED (ERR_PRESENCE_NOT_CONFIRMED), cancel needs PLANNED or CONFIRMED (ERR_PRESENCE_ALREADY_TERMINAL)."
    error_id: ERR_PRESENCE_NOT_PLANNED
    http_status: 409
    applies_to: "POST /event-presences/{presenceId}/confirm, /complete, /cancel"
  - priority: 22
    category: business_safety
    check: "The supplied consent_token equals TalentCommunityMember.consent_token."
    error_id: ERR_CONSENT_TOKEN_INVALID
    http_status: 422
    applies_to: "POST /talent-community-members/{memberId}/confirm-consent"
  - priority: 23
    category: business_safety
    check: "JobPosting.eeo_statement_included is true before a compliance CLEAR decision and before publishing."
    error_id: ERR_EEO_STATEMENT_MISSING
    http_status: 409
    applies_to: "POST /job-postings/{postingId}/compliance-review, POST /job-postings/{postingId}/publish"
  - priority: 24
    category: business_safety
    check: "When JobPosting.superlative_claim_included is true, substantiation_url must be present before a compliance CLEAR decision."
    error_id: ERR_UNSUBSTANTIATED_CLAIM
    http_status: 409
    applies_to: "POST /job-postings/{postingId}/compliance-review"
  - priority: 25
    category: business_safety
    check: "JobPosting.compliance_status is CLEARED before publishing the posting, before activating or resuming a flight that points at it, and before an application on it is submitted."
    error_id: ERR_POSTING_COMPLIANCE_NOT_CLEARED
    http_status: 409
    applies_to: "POST /job-postings/{postingId}/publish, POST /media-flights/{flightId}/activate, POST /media-flights/{flightId}/resume, POST /applications/{applicationId}/submit"
  - priority: 26
    category: business_safety
    check: "At least one member of the dispatch audience has consent_status SUBSCRIBED."
    error_id: ERR_NO_CONSENTED_AUDIENCE
    http_status: 409
    applies_to: "POST /nurture-campaigns/{campaignId}/dispatch"
  - priority: 27
    category: business_safety
    check: "Program.brand_health_score >= 55.00 before a flight may be activated."
    error_id: ERR_BRAND_HEALTH_GATE
    http_status: 409
    applies_to: "POST /media-flights/{flightId}/activate"
  - priority: 28
    category: business_referential
    check: "At least one CandidatePersona with the posting's job_family_id is in state APPROVED."
    error_id: ERR_NO_APPROVED_PERSONA
    http_status: 409
    applies_to: "POST /job-postings/{postingId}/publish"
  - priority: 29
    category: business_referential
    check: "Retiring the last APPROVED persona of a family is rejected while that family still has a JobPosting whose content_status is PUBLISHED or SUSPENDED."
    error_id: ERR_PERSONA_IN_USE
    http_status: 409
    applies_to: "POST /candidate-personas/{personaId}/retire"
  - priority: 30
    category: business_referential
    check: "Channel.channel_type is one of JOB_BOARD, SOCIAL, PROGRAMMATIC for a paid flight."
    error_id: ERR_CHANNEL_NOT_PAYABLE
    http_status: 409
    applies_to: "POST /media-flights"
  - priority: 31
    category: business_referential
    check: "JobPosting.content_status is PUBLISHED before a flight on it is activated or resumed and before an application on it is submitted."
    error_id: ERR_POSTING_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /media-flights/{flightId}/activate, POST /media-flights/{flightId}/resume, POST /applications/{applicationId}/submit"
  - priority: 32
    category: business_constraint
    check: "JobPosting.optimization_score >= 70 before publishing."
    error_id: ERR_OPTIMIZATION_SCORE_TOO_LOW
    http_status: 409
    applies_to: "POST /job-postings/{postingId}/publish"
  - priority: 33
    category: business_constraint
    check: "pay_range_min_cents and pay_range_max_cents are both present and pay_range_max_cents >= pay_range_min_cents (advertising accuracy)."
    error_id: ERR_PAY_RANGE_INVALID
    http_status: 409
    applies_to: "POST /job-postings/{postingId}/optimize, POST /job-postings/{postingId}/publish"
  - priority: 34
    category: business_constraint
    check: "MediaFlight.flight_days >= Channel.min_flight_days."
    error_id: ERR_FLIGHT_TOO_SHORT
    http_status: 409
    applies_to: "POST /media-flights"
  - priority: 35
    category: business_constraint
    check: "At least one Touchpoint of the application falls inside the attribution lookback window."
    error_id: ERR_NO_ELIGIBLE_TOUCHPOINT
    http_status: 409
    applies_to: "POST /applications/{applicationId}/decide with outcome QUALIFIED"
  - priority: 36
    category: business_constraint
    check: "CandidatePersona.signal_count >= 1 inside the research window when submitting for review."
    error_id: ERR_NO_RESEARCH_SIGNALS
    http_status: 409
    applies_to: "POST /candidate-personas/{personaId}/submit, POST /candidate-personas/{personaId}/review"
  - priority: 37
    category: business_constraint
    check: "CandidatePersona.mix_confidence_pct >= 40 when submitting for review."
    error_id: ERR_INSUFFICIENT_RESEARCH_CONFIDENCE
    http_status: 409
    applies_to: "POST /candidate-personas/{personaId}/submit"
  - priority: 38
    category: business_constraint
    check: "Closing a review without a response requires rating >= 4."
    error_id: ERR_RESPONSE_REQUIRED
    http_status: 409
    applies_to: "POST /employer-reviews/{reviewId}/close"
  - priority: 39
    category: business_constraint
    check: "EmployerReview.response_body is present before submitting the response to legal review."
    error_id: ERR_RESPONSE_BODY_MISSING
    http_status: 409
    applies_to: "POST /employer-reviews/{reviewId}/submit-legal"
  - priority: 40
    category: business_temporal
    check: "No other non-terminal MediaFlight on the same channel_id AND job_family_id has a half-open [start_date, end_date) window intersecting the requested one; touching windows (previous.end_date == new.start_date) are allowed."
    error_id: ERR_FLIGHT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /media-flights"
  - priority: 41
    category: business_temporal
    check: "Every other CONFIRMED or COMPLETED EventPresence of the same job_family_id is separated from this one by at least 48 hours measured between the closed intervals [start_at, end_at]; a gap of exactly 48 hours is allowed."
    error_id: ERR_EVENT_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /event-presences/{presenceId}/confirm"
  - priority: 42
    category: business_temporal
    check: "scheduled_for is at or after the logical clock."
    error_id: ERR_SCHEDULE_IN_PAST
    http_status: 409
    applies_to: "POST /nurture-campaigns/{campaignId}/schedule"
  - priority: 43
    category: business_temporal
    check: "The logical clock is at or after NurtureCampaign.scheduled_for."
    error_id: ERR_DISPATCH_TOO_EARLY
    http_status: 409
    applies_to: "POST /nurture-campaigns/{campaignId}/dispatch"
  - priority: 44
    category: business_temporal
    check: "The logical clock is at or after MediaFlight.end_date T00:00:00Z."
    error_id: ERR_FLIGHT_WINDOW_OPEN
    http_status: 409
    applies_to: "POST /media-flights/{flightId}/complete"
  - priority: 45
    category: business_temporal
    check: "The logical clock is strictly after EventPresence.end_at."
    error_id: ERR_EVENT_WINDOW_OPEN
    http_status: 409
    applies_to: "POST /event-presences/{presenceId}/complete"
  - priority: 46
    category: business_temporal
    check: "Channel.pacing_status is not THROTTLED when resuming a flight on it."
    error_id: ERR_CHANNEL_THROTTLED
    http_status: 409
    applies_to: "POST /media-flights/{flightId}/resume"
  - priority: 47
    category: business_fiscal
    check: "daily_cap_cents plus the sum of daily_cap_cents over every non-terminal MediaFlight on the same channel whose half-open window intersects the requested one is <= Channel.daily_capacity_cents."
    error_id: ERR_CHANNEL_DAILY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /media-flights"
  - priority: 48
    category: business_fiscal
    check: "calculations.media_budget_waterfall funds the requested amount in full from the ordered buckets."
    error_id: ERR_MEDIA_BUDGET_EXHAUSTED
    http_status: 409
    applies_to: "POST /media-flights, POST /media-flights/{flightId}/resume, POST /event-presences/{presenceId}/confirm"
  - priority: 49
    category: business_fiscal
    check: "NurtureCampaign.max_sends <= Program.send_quota_total - Program.send_quota_used."
    error_id: ERR_SEND_QUOTA_EXCEEDED
    http_status: 409
    applies_to: "POST /nurture-campaigns/{campaignId}/dispatch"
  - priority: 50
    category: business_fiscal
    check: "MediaFlight.spent_cents plus the recorded amount_cents <= MediaFlight.total_cost_cents."
    error_id: ERR_SPEND_EXCEEDS_RESERVATION
    http_status: 409
    applies_to: "POST /media-flights/{flightId}/spend"

endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint that sets the server logical clock used by every deadline, window and decay rule. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [RecruitingOps]
    code: 200
    input: ["current_utc"]
    output: "null"
    side_effects:
      - "Re-evaluates EmployerReview.sla_status for every review - PENDING becomes BREACHED when the clock passes response_due_at while state is not in {RESPONSE_PUBLISHED, CLOSED_NO_RESPONSE}."
      - "Recomputes calculations.program_brand_health_score for every Program because the 90-day window and the recency weights moved."
  - method: POST
    path: "/programs"
    description: "Create a recruitment-marketing program with its paid-media pools, flex reserve and annual send quota."
    roles: [BrandProgramLead]
    code: 201
    input: ["name", "fiscal_year", "attribution_model?", "pool_job_board_cents?", "pool_social_cents?", "pool_programmatic_cents?", "flex_reserve_cents?", "send_quota_total?"]
    output: Program
    side_effects:
      - "Sets committed_budget_cents 0, send_quota_used 0, brand_health_score 100.00 and available_budget_cents to pool_job_board_cents + pool_social_cents + pool_programmatic_cents + flex_reserve_cents."
  - method: PATCH
    path: "/programs/{programId}"
    description: "Adjust program level funding, attribution model or send quota. Every successful call advances Program.version, which is what the media-flight OCC guard observes."
    roles: [BrandProgramLead]
    code: 200
    input: ["attribution_model?", "pool_job_board_cents?", "pool_social_cents?", "pool_programmatic_cents?", "flex_reserve_cents?", "send_quota_total?"]
    output: Program
    side_effects:
      - "Recomputes available_budget_cents as pool_job_board_cents + pool_social_cents + pool_programmatic_cents + flex_reserve_cents - committed_budget_cents."
      - "Sets updated_at and increments Program.version by 1."
  - method: GET
    path: "/programs/{programId}"
    description: "Read one program including committed_budget_cents, available_budget_cents, send_quota_used and brand_health_score."
    roles: [BrandProgramLead, PersonaResearcher, ComplianceReviewer, MediaBuyer, CommunityManager, RecruitingOps]
    code: 200
    input: []
    output: Program
    side_effects: []
  - method: GET
