          - errors.ERR_CLAIM_WINDOW_EXPIRED
        distinguishing_aspect: "Error-category pair business_referential vs business_temporal: a claim item whose sku is unknown AND whose pull_date is past the stale window returns 422 ERR_SKU_UNKNOWN, never ERR_CLAIM_WINDOW_EXPIRED — the referential check is ordered first."
        test_recipe:
