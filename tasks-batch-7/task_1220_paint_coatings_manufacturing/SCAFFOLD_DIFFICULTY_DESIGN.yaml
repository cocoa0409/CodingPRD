          - entities.Formula.fields.min_batch_gallons
        distinguishing_aspect: |
          Volume metric at the exact minimum: a custom line of exactly 50 gal is
          accepted (>= semantics) while 49 gal fails; under rush_flag the floor
          rises to 100, so a 99-gal rush custom line fails while 100 passes.
