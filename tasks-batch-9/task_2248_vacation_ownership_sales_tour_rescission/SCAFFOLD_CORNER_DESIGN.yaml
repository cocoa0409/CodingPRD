          - entities.PurchaseAgreement.rescission_status
        distinguishing_aspect: "The sweep expires only agreements strictly behind the clock and nothing else: at 2026-08-20T00:00:00Z it reports swept_count 1 with expired_agreement_ids [the NV agreement whose deadline was 2026-08-19T23:59:59.999Z], an immediate replay reports swept_count 0, and only after the clock reaches 2026-08-25T00:00:00Z does the FL agreement with the 2026-08-24T23:59:59.999Z deadline sweep -- fulfillment_status stays AWAITING_FUNDING throughout."
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z."
            - "The same prospect tours twice with the one representative: 2026-08-14T07:00:00Z produces an NV agreement executed 2026-08-14T09:00:00Z (deadline 2026-08-19T23:59:59.999Z) and 2026-08-15T07:00:00Z produces an FL agreement executed 2026-08-15T09:00:00Z (deadline 2026-08-25T23:59:59.999Z)."
