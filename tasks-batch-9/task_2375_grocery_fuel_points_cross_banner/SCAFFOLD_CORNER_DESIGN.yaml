          - entities.Banner.fields.min_points_per_redemption
          - errors[ERR_BELOW_MIN_REDEMPTION]
        distinguishing_aspect: "The minimum is inclusive at exactly min_points_per_redemption: 99 points is refused 422 ERR_BELOW_MIN_REDEMPTION while 100 points is authorised for 10 cents off, and the refusal is not swallowed by the block-flooring rule that would otherwise turn 99 into zero blocks."
        test_recipe:
          setup:
            - "Banner CORE (min_points_per_redemption 100) with cycles, grocery site, owned fuel centre and a member holding 300 points; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
