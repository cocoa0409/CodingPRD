scenario: "Wholesale Marketplace Net-60 Terms & Retailer Credit Underwriting (Faire): retail buyer verification requiring proof of an active storefront and resale certificate, credit line assignment with underwriting on store type, order history and payment behavior, net-60 terms with free returns on opening orders and brand protection against return abuse, brand onboarding with minimum order value, case pack and lead-time configuration, exclusivity and territory rules limiting nearby retailers carrying the same brand, commission tiering that differs for marketplace-sourced versus brand-referred retailers, fraud screening for straw storefronts and resale to consumers, payout timing to brands decoupled from retailer collection risk"

domain_name: wholesale-marketplace-credit
api_prefix: /wholesale

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Retailer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered legal name of the retail business"
      - name: store_type
        type: enum
        source: input
        description: "Storefront category; enum: BRICK_AND_MORTAR | ONLINE | HYBRID"
      - name: address
        type: string
        source: input
        description: "Street address of the storefront"
      - name: lat
        type: number
        source: input
        description: "Latitude of the storefront; used for territory distance checks"
      - name: lng
        type: number
        source: input
        description: "Longitude of the storefront; used for territory distance checks"
      - name: storefront_proof_url
        type: string
        source: input
        description: "URL of uploaded proof of an active storefront (photo, lease, or live web shop)"
      - name: resale_certificate_no
        type: string
        source: input
        description: "State resale certificate / seller's permit number"
      - name: storefront_proof_status
        type: enum
        source: system
        description: "Verification sub-state of the storefront proof document; enum: PENDING | CONFIRMED | REJECTED"
        default: PENDING
      - name: resale_cert_status
        type: enum
        source: system
        description: "Verification sub-state of the resale certificate; enum: PENDING | CONFIRMED | REJECTED"
        default: PENDING
      - name: verification_status
        type: enum
        source: system
        description: "Overall verification state machine; enum: PENDING | MORE_INFO_REQUESTED | VERIFIED | REJECTED | SUSPENDED"
        default: PENDING
      - name: verification_resubmission_count
        type: integer
        source: system
        description: "Number of times the retailer resubmitted verification after MORE_INFO_REQUESTED; increments on each resubmit"
        default: 0
      - name: risk_tier
        type: enum
        source: computed
        description: "Underwriting risk tier derived from store type, order history and payment behavior; enum: LOW | MEDIUM | HIGH"
      - name: return_rate
        type: number
        source: computed
        description: "Returned units divided by net sold units across all of this retailer's orders (any status except CANCELLED), recomputed on every unit-affecting mutation; 4 decimal places"
        default: 0

  - name: Brand
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Brand display name"
      - name: contact_email
        type: string
        source: input
        description: "Brand owner contact email"
      - name: onboarding_status
        type: enum
        source: system
        description: "Brand onboarding state machine; enum: DRAFT | ACTIVE | SUSPENDED"
        default: DRAFT
      - name: min_order_value_cents
        type: integer
        source: input
        description: "Minimum order value (cents) the brand accepts per order"
      - name: default_case_pack_size
        type: integer
        source: input
        description: "Default case pack size for the brand's products; every order line quantity must be a multiple of this"
      - name: lead_time_days
        type: integer
        source: input
        description: "Days between order placement and earliest allowed shipment"
      - name: payout_delay_days
        type: integer
        source: input
        description: "Fixed days after shipment when the brand's payout falls due; independent of retailer payment"
      - name: referral_code
        type: string
        source: system
        description: "Server-minted referral code the brand shares with retailers it recruits"
      - name: payout_balance_cents
        type: integer
        source: computed
        description: "Running brand ledger: net payout amount (after commission) accrued on shipment, debited on payout completion; may go negative after abuse assessments"
        default: 0
      - name: abuse_flags
        type: integer
        source: computed
        description: "Count of return-abuse assessments charged against this brand; reaching 5 auto-suspends the brand"
        default: 0

  - name: CreditAccount
    parent: null
    common_fields: true
    fields:
      - name: retailer_id
        type: string
        source: input
        description: "FK -> Retailer.id; the retailer this credit account belongs to (1:1)"
      - name: limit_cents
        type: integer
        source: computed
        description: "Credit ceiling in cents, assigned by the credit limit underwriting calculation at account opening and each limit review"
        default: 0
      - name: available_cents
        type: integer
        source: computed
        description: "limit_cents minus the sum of current outstanding invoice balances for this retailer"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Credit account state machine; enum: ACTIVE | FROZEN | CLOSED"
        default: ACTIVE

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: retailer_id
        type: string
        source: input
        description: "FK -> Retailer.id; purchasing retailer"
      - name: brand_id
        type: string
        source: input
        description: "FK -> Brand.id; selling brand"
      - name: attribution
        type: enum
        source: computed
        description: "Order channel attribution fixed at placement: MARKETPLACE if the retailer was marketplace-sourced, BRAND_REFERRED if the retailer registered with this brand's referral code; enum: MARKETPLACE | BRAND_REFERRED"
      - name: order_seq
        type: integer
        source: computed
        description: "1-based sequence of this order within the (retailer_id, brand_id) pair, ordered by created_at ASC; order_seq == 1 marks the opening order eligible for free returns"
      - name: subtotal_cents
        type: integer
        source: computed
        description: "Sum of order line amount_cents after per-line rounding"
      - name: status
        type: enum
        source: system
        description: "Fulfillment dimension state machine; enum: PLACED | SHIPPED | DELIVERED | PARTIALLY_RETURNED | RETURNED | CANCELLED"
        default: PLACED

  - name: OrderLine
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the order this line belongs to"
      - name: sku
        type: string
        source: input
        description: "Brand's SKU for the product"
      - name: unit_price_cents
        type: integer
        source: input
        description: "Wholesale unit price in cents"
      - name: qty
        type: integer
        source: input
        description: "Ordered quantity; must be a positive multiple of the brand's default_case_pack_size"
      - name: amount_cents
        type: integer
        source: computed
        description: "qty * unit_price_cents, rounded to whole cents half-up (exact product, always integral)"
      - name: net_sold_qty
        type: integer
        source: computed
        description: "qty minus delivered-returned units; used by the return-rate calculation"

  - name: Invoice
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; exactly one invoice per order (1:1), issued at shipment"
      - name: amount_due_cents
        type: integer
        source: computed
        description: "Order subtotal_cents at issuance, reduced by credits for accepted return units; never below 0"
      - name: due_date
        type: datetime
        source: computed
        description: "shipped_at + 60 days (net-60 terms)"
      - name: paid_amount_cents
        type: integer
        source: computed
        description: "Sum of retailer payment allocations to this invoice"
        default: 0
      - name: balance_cents
        type: integer
        source: computed
        description: "amount_due_cents - paid_amount_cents; the outstanding amount"
      - name: status
        type: enum
        source: system
        description: "Collection dimension state machine; enum: OPEN | PAID | OVERDUE | WRITTEN_OFF"
        default: OPEN

  - name: Payment
    parent: null
    common_fields: false
    fields:
      - name: invoice_id
        type: string
        source: input
        description: "FK -> Invoice.id; the invoice this payment is allocated to"
      - name: amount_cents
        type: integer
        source: input
        description: "Payment amount in cents; must not exceed the invoice balance"
      - name: paid_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when the payment was recorded"

  - name: ReturnAuthorization
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the order being returned"
      - name: is_opening_order
        type: boolean
        source: computed
        description: "True iff the referenced order has order_seq == 1 for its (retailer, brand) pair; opening orders return free"
      - name: return_fee_cents
        type: integer
        source: computed
        description: "0 for opening-order returns; 15% of returned merchandise value (cents, rounded half-up) otherwise"
      - name: credit_cents
        type: integer
        source: computed
        description: "Invoice credit granted on receipt: sum of returned units x unit price minus return_fee_cents, floored at 0"
      - name: status
        type: enum
        source: system
        description: "Return authorization state machine; enum: REQUESTED | APPROVED | REJECTED | RECEIVED"
        default: REQUESTED

  - name: ReturnLine
    parent: ReturnAuthorization
    common_fields: true
    fields:
      - name: return_auth_id
        type: string
        source: input
        description: "FK -> ReturnAuthorization.id; the authorization this return line belongs to"
      - name: order_line_id
        type: string
        source: input
        description: "FK -> OrderLine.id; the order line units are returned against"
      - name: qty
        type: integer
        source: input
        description: "Units returned; cumulative received returns per order line must not exceed that line's net_sold_qty"

  - name: Payout
    parent: null
    common_fields: true
    fields:
      - name: brand_id
        type: string
        source: input
        description: "FK -> Brand.id; the brand being paid"
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the shipped order whose proceeds fund this payout"
      - name: gross_cents
        type: integer
        source: computed
        description: "Order subtotal_cents at payout computation"
      - name: commission_bps
        type: integer
        source: computed
        description: "Commission rate applied: opening MARKETPLACE order 2500 bps, reorder MARKETPLACE order 1500 bps, any BRAND_REFERRED order 0 bps"
      - name: commission_cents
        type: integer
        source: computed
        description: "gross_cents x commission_bps / 10000, rounded half-up to whole cents"
      - name: net_cents
        type: integer
        source: computed
        description: "gross_cents - commission_cents"
      - name: scheduled_date
        type: datetime
        source: computed
        description: "shipped_at + brand.payout_delay_days; fixed at computation and independent of invoice collection"
      - name: status
        type: enum
        source: system
        description: "Payout state machine; enum: SCHEDULED | PROCESSING | PAID | FAILED"
        default: SCHEDULED

  - name: ExclusivityGrant
    parent: null
    common_fields: true
    fields:
      - name: brand_id
        type: string
        source: input
        description: "FK -> Brand.id; the brand granting exclusivity"
      - name: retailer_id
        type: string
        source: input
        description: "FK -> Retailer.id; the retailer holding the exclusive territory"
      - name: center_lat
        type: number
        source: input
        description: "Latitude of the territory center"
      - name: center_lng
        type: number
        source: input
        description: "Longitude of the territory center"
      - name: radius_km
        type: number
        source: input
        description: "Territory radius in kilometers; default 5"
        default: 5
      - name: starts_at
        type: datetime
        source: input
        description: "Grant effective timestamp (inclusive)"
      - name: ends_at
        type: datetime
        source: input
        description: "Grant expiry timestamp (exclusive); must be after starts_at"
      - name: status
        type: enum
        source: system
        description: "Grant state machine; enum: ACTIVE | REVOKED | EXPIRED"
        default: ACTIVE

  - name: FraudFlag
    parent: null
    common_fields: true
    fields:
      - name: retailer_id
        type: string
        source: input
        description: "FK -> Retailer.id; the retailer flagged"
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; nullable-style optional reference to the order that triggered the flag; empty string when not order-linked"
      - name: flag_type
        type: enum
        source: input
        description: "enum: STRAW_STOREFRONT | CONSUMER_RESELLER | RETURN_ABUSE"
      - name: status
        type: enum
        source: system
        description: "Flag review state machine; enum: OPEN | CONFIRMED | DISMISSED"
        default: OPEN

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Retailer
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /retailers/{id}/verify"
        actor: PlatformAdmin
        preconditions:
          - "Retailer.verification_status == PENDING"
          - "Retailer.storefront_proof_status == CONFIRMED"
          - "Retailer.resale_cert_status == CONFIRMED"
        side_effects:
          - "Retailer.verification_status := VERIFIED; Retailer.version += 1"
        # violates the document preconditions -> ERR_VERIFICATION_INCOMPLETE (422)
        note: "PlatformAdmin must first confirm BOTH verification sub-states via /wholesale/retailers/{id}/documents/review; the overall verify is rejected with ERR_VERIFICATION_INCOMPLETE (422) while either document is unconfirmed"
      - from: PENDING
        to: REJECTED
        trigger: "POST /retailers/{id}/verify"
        actor: PlatformAdmin
        preconditions:
          - "Retailer.verification_status == PENDING"
          - "verification decision payload is reject"
        side_effects:
          - "Retailer.verification_status := REJECTED; Retailer.version += 1"
      - from: PENDING
        to: MORE_INFO_REQUESTED
        trigger: "POST /retailers/{id}/request-more-info"
        actor: PlatformAdmin
        preconditions:
          - "Retailer.verification_status == PENDING"
        side_effects:
          - "Retailer.verification_status := MORE_INFO_REQUESTED; Retailer.version += 1"
      - from: MORE_INFO_REQUESTED
        to: PENDING
        trigger: "POST /retailers/{id}/verification/resubmit"
        actor: Retailer
        preconditions:
          - "Retailer.verification_status == MORE_INFO_REQUESTED"
          - "X-User-ID == this Retailer.id"
          - "Retailer.verification_resubmission_count < 3"
        side_effects:
          - "Retailer.verification_status := PENDING"
          - "Retailer.storefront_proof_status := PENDING; Retailer.resale_cert_status := PENDING"
          - "Retailer.verification_resubmission_count += 1; Retailer.version += 1"
        note: "cyclic verification loop; resubmission count guards the cycle and ERR_RESUBMISSION_LIMIT fires at 3"
      - from: VERIFIED
        to: SUSPENDED
        trigger: "POST /fraud-flags/{id}/confirm"
        actor: PlatformAdmin
        preconditions:
          - "FraudFlag.status == OPEN"
          - "Retailer.verification_status == VERIFIED"
        side_effects:
          - "Retailer.verification_status := SUSPENDED; Retailer.version += 1"
          - "linked CreditAccount (CreditAccount.retailer_id == Retailer.id) transitions ACTIVE -> FROZEN"
          - "every Order of this retailer with status == PLACED transitions PLACED -> CANCELLED, and each such cancellation issues a compensating Payout (status PAID, commission 0 bps, net_cents == gross_cents) to the order's Brand, incrementing Brand.payout_balance_cents by that net_cents"

  - entity: Brand
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /brands/{id}/activate"
        actor: Brand
        preconditions:
          - "Brand.onboarding_status == DRAFT"
          - "X-User-ID == this Brand.id"
          - "min_order_value_cents > 0"
          - "default_case_pack_size >= 1"
          - "lead_time_days >= 0"
          - "payout_delay_days >= 1"
        side_effects:
          - "Brand.onboarding_status := ACTIVE; Brand.version += 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: Brand.abuse_flags reaches 5 after a RETURN_ABUSE FraudFlag confirmation (see FraudFlag OPEN -> CONFIRMED with flag_type == RETURN_ABUSE)"
        actor: system
        preconditions:
          - "Brand.onboarding_status == ACTIVE"
          - "Brand.abuse_flags >= 5 after the increment"
        side_effects:
          - "Brand.onboarding_status := SUSPENDED; Brand.version += 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /brands/{id}/reinstate"
        actor: PlatformAdmin
        preconditions:
          - "Brand.onboarding_status == SUSPENDED"
        side_effects:
          - "Brand.onboarding_status := ACTIVE; Brand.version += 1"
        note: "reversible suspension — brand can be reinstated by an admin after remediation"

  - entity: CreditAccount
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: FROZEN
        trigger: "system: linked Retailer transitions VERIFIED -> SUSPENDED"
        actor: system
        preconditions:
          - "CreditAccount.status == ACTIVE"
          - "linked Retailer (CreditAccount.retailer_id) verification_status transitions to SUSPENDED"
        side_effects:
          - "CreditAccount.status := FROZEN; CreditAccount.version += 1"
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /credit-accounts/{id}/unfreeze"
        actor: PlatformAdmin
        preconditions:
          - "CreditAccount.status == FROZEN"
          - "linked Retailer.verification_status == VERIFIED"
        side_effects:
          - "CreditAccount.status := ACTIVE; CreditAccount.version += 1"
      - from: FROZEN
        to: CLOSED
        trigger: "POST /credit-accounts/{id}/close"
        actor: PlatformAdmin
        preconditions:
          - "CreditAccount.status == FROZEN"
          - "no Invoice with Invoice.order_id in this retailer's orders has status == OVERDUE"
        side_effects:
          - "CreditAccount.status := CLOSED; CreditAccount.version += 1"

  - entity: Order
    initial_state: PLACED
    terminal_states: [CANCELLED, RETURNED]
    transitions:
      - from: PLACED
        to: SHIPPED
        trigger: "POST /orders/{id}/ship"
        actor: Brand
        preconditions:
          - "Order.status == PLACED"
          - "X-User-ID == Order.brand_id"
          - "Brand.onboarding_status == ACTIVE"
          - "linked Retailer.verification_status == VERIFIED"
          - "logical clock now >= Order.created_at + Brand.lead_time_days"
        side_effects:
          - "creates the order's Invoice (amount_due_cents = Order.subtotal_cents, due_date = now + 60 days, status OPEN)"
          - "creates the order's Payout via the payout computation (scheduled_date = now + Brand.payout_delay_days, status SCHEDULED) and credits Brand.payout_balance_cents by payout.net_cents"
          - "Order.version += 1"
        note: "brand not ACTIVE -> ERR_BRAND_SUSPENDED (422); lead time not yet met -> ERR_LEAD_TIME_NOT_MET (422)"
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /orders/{id}/deliver"
        actor: Brand
        preconditions:
          - "Order.status == SHIPPED"
          - "X-User-ID == Order.brand_id"
        side_effects:
          - "Order.version += 1"
      - from: DELIVERED
        to: PARTIALLY_RETURNED
        trigger: "POST /return-authorizations/{id}/receive"
        actor: PlatformAdmin
        preconditions:
          - "ReturnAuthorization.status == APPROVED"
          - "referenced Order.status == DELIVERED"
          - "after applying these return lines, at least one order line still has net_sold_qty > 0"
        side_effects:
          - "ReturnAuthorization transitions APPROVED -> RECEIVED"
          - "Order.status := PARTIALLY_RETURNED; Order.version += 1"
      - from: DELIVERED
        to: RETURNED
        trigger: "POST /return-authorizations/{id}/receive"
        actor: PlatformAdmin
        preconditions:
          - "ReturnAuthorization.status == APPROVED"
          - "referenced Order.status == DELIVERED"
          - "after applying these return lines, every order line has net_sold_qty == 0"
        side_effects:
          - "ReturnAuthorization transitions APPROVED -> RECEIVED"
          - "Order.status := RETURNED; Order.version += 1"
      - from: PARTIALLY_RETURNED
        to: PARTIALLY_RETURNED
        trigger: "POST /return-authorizations/{id}/receive"
        actor: PlatformAdmin
        preconditions:
          - "ReturnAuthorization.status == APPROVED"
          - "referenced Order.status == PARTIALLY_RETURNED"
          - "after applying these return lines, at least one order line still has net_sold_qty > 0"
        side_effects:
          - "ReturnAuthorization transitions APPROVED -> RECEIVED"
          - "Order.version += 1"
      - from: PARTIALLY_RETURNED
        to: RETURNED
        trigger: "POST /return-authorizations/{id}/receive"
        actor: PlatformAdmin
        preconditions:
          - "ReturnAuthorization.status == APPROVED"
          - "referenced Order.status == PARTIALLY_RETURNED"
          - "after applying these return lines, every order line has net_sold_qty == 0"
        side_effects:
          - "ReturnAuthorization transitions APPROVED -> RECEIVED"
          - "Order.status := RETURNED; Order.version += 1"
      - from: PLACED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Retailer
        preconditions:
          - "Order.status == PLACED"
          - "X-User-ID == Order.retailer_id"
        side_effects:
          - "Order.status := CANCELLED; Order.version += 1"
      - from: PLACED
        to: CANCELLED
        trigger: "system: linked Retailer transitions VERIFIED -> SUSPENDED (fraud confirm cascade)"
        actor: system
        preconditions:
          - "Order.status == PLACED"
          - "Order.retailer_id == the suspended Retailer.id"
        side_effects:
          - "Order.status := CANCELLED; Order.version += 1"
          - "issues a compensating Payout (status PAID, commission 0 bps, net_cents == Order.subtotal_cents) to Order.brand_id, incrementing Brand.payout_balance_cents by net_cents"

  - entity: Invoice
    initial_state: OPEN
    terminal_states: [PAID, WRITTEN_OFF]
    transitions:
      - from: OPEN
        to: OVERDUE
        trigger: "system: POST /_clock/set_current_utc advances the logical clock to > Invoice.due_date while balance_cents > 0 (lazy evaluation on the next read or write touching the invoice)"
        actor: system
        preconditions:
          - "Invoice.status == OPEN"
          - "logical clock now > Invoice.due_date"
          - "Invoice.balance_cents > 0"
        side_effects:
          - "Invoice.status := OVERDUE; Invoice.version += 1"
      - from: OPEN
        to: PAID
        trigger: "POST /invoices/{id}/payments"
        actor: Retailer
        preconditions:
          - "Invoice.status == OPEN"
          - "payment allocation brings Invoice.balance_cents to 0"
        side_effects:
          - "Invoice.status := PAID; Invoice.version += 1"
      - from: OVERDUE
        to: PAID
        trigger: "POST /invoices/{id}/payments"
        actor: Retailer
        preconditions:
          - "Invoice.status == OVERDUE"
          - "payment allocation brings Invoice.balance_cents to 0"
        side_effects:
          - "Invoice.status := PAID; Invoice.version += 1"
      - from: OVERDUE
        to: WRITTEN_OFF
        trigger: "POST /invoices/{id}/write-off"
        actor: PlatformAdmin
        preconditions:
          - "Invoice.status == OVERDUE"
          - "logical clock now >= Invoice.due_date + 30 days (earlier attempts fail with ERR_WRITE_OFF_TOO_EARLY, 422)"
        side_effects:
          - "Invoice.status := WRITTEN_OFF; Invoice.version += 1"
          - "Brand.payout_balance_cents is NOT debited (collection risk stays with the platform)"
          - "Retailer.risk_tier recomputed (late-paid-and-written-off history feeds the underwriting calculation)"

  - entity: ReturnAuthorization
    initial_state: REQUESTED
    terminal_states: [REJECTED, RECEIVED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /return-authorizations/{id}/review"
        actor: Brand
        preconditions:
          - "ReturnAuthorization.status == REQUESTED"
          - "X-User-ID == the brand_id of the referenced Order"
          - "referenced Order.status IN {DELIVERED, PARTIALLY_RETURNED}"
          - "Retailer.return_rate < 0.20"
        side_effects:
          - "ReturnAuthorization.status := APPROVED; ReturnAuthorization.version += 1"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /return-authorizations/{id}/review"
        actor: Brand
        preconditions:
          - "ReturnAuthorization.status == REQUESTED"
          - "X-User-ID == the brand_id of the referenced Order"
        side_effects:
          - "ReturnAuthorization.status := REJECTED; ReturnAuthorization.version += 1"
      - from: APPROVED
        to: RECEIVED
        trigger: "POST /return-authorizations/{id}/receive"
        actor: PlatformAdmin
        preconditions:
          - "ReturnAuthorization.status == APPROVED"
          - "every ReturnLine cumulative received qty does not exceed its OrderLine.net_sold_qty"
        side_effects:
          - "each ReturnLine reduces its OrderLine.net_sold_qty by qty"
          - "Invoice of the referenced Order: amount_due_cents -= ReturnAuthorization.credit_cents (floor 0); balance_cents recomputed"
          - "Invoice status re-evaluated: if balance_cents reaches 0 and status IN {OPEN, OVERDUE} -> PAID"
          - "referenced Order.status transitions per the Order machine (DELIVERED/PARTIALLY_RETURNED -> PARTIALLY_RETURNED or RETURNED)"
          - "Retailer.return_rate recomputed via the return_rate calculation"
          - "ReturnAuthorization.status := RECEIVED; ReturnAuthorization.version += 1"

  - entity: Payout
    initial_state: SCHEDULED
    terminal_states: [PAID]
    transitions:
      - from: SCHEDULED
        to: PROCESSING
        trigger: "POST /payouts/process-due"
        actor: PlatformAdmin
        preconditions:
          - "Payout.status == SCHEDULED"
          - "logical clock now >= Payout.scheduled_date"
        side_effects:
          - "Payout.status := PROCESSING; Payout.version += 1"
          - "Brand.payout_balance_cents -= Payout.net_cents (floor applied by the balance rule; the debit is recorded even if it would take the balance negative)"
      - from: PROCESSING
        to: PAID
        trigger: "POST /payouts/{id}/complete"
        actor: PlatformAdmin
        preconditions:
          - "Payout.status == PROCESSING"
        side_effects:
          - "Payout.status := PAID; Payout.version += 1"
      - from: PROCESSING
        to: SCHEDULED
        trigger: "POST /payouts/{id}/fail"
        actor: PlatformAdmin
        preconditions:
          - "Payout.status == PROCESSING"
        side_effects:
          - "Payout.status := SCHEDULED; Payout.version += 1"
          - "Brand.payout_balance_cents += Payout.net_cents (compensating reversal of the PROCESSING debit)"
        note: "failed transfers return to SCHEDULED so the next process-due run retries; the balance credit exactly undoes the debit"

  - entity: ExclusivityGrant
    initial_state: ACTIVE
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /exclusivity-grants/{id}/revoke"
        actor: Brand
        preconditions:
          - "ExclusivityGrant.status == ACTIVE"
          - "X-User-ID == ExclusivityGrant.brand_id"
        side_effects:
          - "ExclusivityGrant.status := REVOKED; ExclusivityGrant.version += 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: POST /_clock/set_current_utc advances the logical clock to >= ExclusivityGrant.ends_at (lazy evaluation on the next read or order placement touching the grant)"
        actor: system
        preconditions:
          - "ExclusivityGrant.status == ACTIVE"
          - "logical clock now >= ExclusivityGrant.ends_at"
        side_effects:
          - "ExclusivityGrant.status := EXPIRED; ExclusivityGrant.version += 1"

  - entity: FraudFlag
    initial_state: OPEN
    terminal_states: [CONFIRMED, DISMISSED]
    transitions:
      - from: OPEN
        to: CONFIRMED
        trigger: "POST /fraud-flags/{id}/confirm"
        actor: PlatformAdmin
        preconditions:
          - "FraudFlag.status == OPEN"
        side_effects:
          - "FraudFlag.status := CONFIRMED; FraudFlag.version += 1"
          - "if flag_type IN {STRAW_STOREFRONT, CONSUMER_RESELLER}: linked Retailer transitions VERIFIED -> SUSPENDED, which cascades (CreditAccount ACTIVE -> FROZEN; each PLACED Order -> CANCELLED with a compensating Payout to the order's Brand)"
          - "if flag_type == RETURN_ABUSE: Brand of the linked Order (FraudFlag.order_id -> Order.brand_id) has abuse_flags += 1 and payout_balance_cents -= 5000; if abuse_flags reaches 5 the Brand auto-transitions ACTIVE -> SUSPENDED"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /fraud-flags/{id}/dismiss"
        actor: PlatformAdmin
        preconditions:
          - "FraudFlag.status == OPEN"
        side_effects:
          - "FraudFlag.status := DISMISSED; FraudFlag.version += 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: credit-review-stale-account
    parent_entity: CreditAccount
    write_endpoint: "POST /credit-accounts/{id}/limit-review"
    occ_field: "expected_credit_account_version"
    description: |
      A limit review submitted against a CreditAccount whose version has advanced
      since the reviewer last observed it is rejected. This captures the case where
      a payment, shipment, or return has since mutated the account's derived
      fields (each bumping version), so the reviewer's view of the account is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: exclusivity-create-stale-brand
    parent_entity: Brand
    write_endpoint: "POST /exclusivity-grants"
    occ_field: "expected_brand_version"
    description: |
      Creating an ExclusivityGrant against a Brand whose version has advanced since
      the client last observed it is rejected. This captures the case where another
      writer has just mutated the brand (a new grant, a payout accrual, an abuse
      assessment) and the current writer's view of the brand's territory posture is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: credit_limit_underwriting
    trigger: "on CreditAccount opening (POST /credit-accounts with expected_credit_account_version) and on each limit review (POST /credit-accounts/{id}/limit-review)"
    algorithm: threshold
    formula: |
      base =
        store_type == BRICK_AND_MORTAR -> 250000
        store_type == ONLINE           -> 150000
        store_type == HYBRID           -> 200000
      H = set of this retailer's Invoices, ordered by invoice created_at ASC
        (tie-break: due_date ASC), excluding none (all statuses considered
        except invoices whose order was CANCELLED before shipment, which never
        produce an invoice)
      paid_on_time_count = |{ i in H : i.status == PAID and last payment
        (Payment.paid_at of the payment that drove balance to 0) <= i.due_date }|
      late_or_wo_count   = |{ i in H : i.status == WRITTEN_OFF, or (i.status ==
        PAID and last payment paid_at > i.due_date) }|
      limit = base + paid_on_time_count * 50000 - late_or_wo_count * 100000
      limit = max(50000, min(1000000, limit))
      risk_tier = (limit <= 100000) -> HIGH
                  (100000 < limit <= 400000) -> MEDIUM
                  (limit > 400000) -> LOW
    input_set: "All Invoices of the retailer (via Order.retailer_id), every status; bounded below by FLOOR 50000 and above by CAP 1000000"
    constants:
      BASE_BRICK_AND_MORTAR: 250000
      BASE_ONLINE: 150000
      BASE_HYBRID: 200000
      ON_TIME_STEP: 50000
      LATE_STEP: 100000
      FLOOR: 50000
      CAP: 1000000
      TIER_HIGH_MAX: 100000
      TIER_MEDIUM_MAX: 400000
    precision: "integer cents, no rounding needed"
    variants:
      - name: provisional
        when: "CreditAccount opening — the retailer has no invoice history yet"
        difference: "H is empty so paid_on_time_count == late_or_wo_count == 0; limit == base for the store_type and risk_tier derives from base"
      - name: behavioral
        when: "limit review after history exists"
        difference: "paid/late counters from H adjust the base before the floor/cap clamp; the same store_type can yield a different limit than the provisional variant"

  - name: return_rate
    trigger: "on ReturnAuthorization receive, on ReturnAuthorization approve-read (validation read), and on any OrderLine unit change"
    algorithm: aggregation
    formula: |
      returned_units = sum over this retailer's ReturnLines (via
        ReturnAuthorization.status == RECEIVED only, all orders) of qty
      net_sold_units = sum over this retailer's OrderLines whose Order.status
        != CANCELLED of net_sold_qty
      return_rate = net_sold_units == 0 ? 0 : returned_units / net_sold_units
    input_set: "ReturnLines of RECEIVED ReturnAuthorizations only; OrderLines of non-CANCELLED orders only"
    constants:
      ABUSE_THRESHOLD: 0.20
    precision: "4 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "used as the gate on ReturnAuthorization approval (pre-receive snapshot)"
        difference: "computed from currently RECEIVED returns before the pending authorization is received; a retailer sitting exactly at the boundary can be approved and then cross the threshold with this very return"
      - name: final
        when: "persisted Retailer.return_rate after a receive commits"
        difference: "includes the just-received return; subsequent authorizations are gated on the updated value"

  - name: commission_calc
    trigger: "on Payout computation at order shipment and on compensating payouts at fraud cancellation"
    algorithm: tiered_pricing
    formula: |
      if Order.attribution == BRAND_REFERRED: rate_bps = 0
      elif Order.order_seq == 1:              rate_bps = 2500
      else:                                   rate_bps = 1500
      commission_cents = round_half_up(gross_cents * rate_bps / 10000)
      net_cents = gross_cents - commission_cents
    input_set: "The single shipped order being paid out; gross_cents == Order.subtotal_cents at shipment"
    constants:
      OPENING_MARKETPLACE_BPS: 2500
      REORDER_MARKETPLACE_BPS: 1500
      BRAND_REFERRED_BPS: 0
    precision: "integer cents, round_half_up"
    variants:
      - name: marketplace_sourced
        when: "retailer registered without a referral code (attribution MARKETPLACE)"
        difference: "opening order pays 25% commission; reorders pay 15%"
      - name: brand_referred
        when: "retailer registered with this brand's referral_code (attribution BRAND_REFERRED)"
        difference: "0% commission on every order from this retailer, including the opening order"

  - name: return_credit_calc
    trigger: "on ReturnAuthorization receive"
    algorithm: waterfall_allocation
    formula: |
      merchandise_cents = sum over the authorization's ReturnLines of
        (qty * OrderLine.unit_price_cents)
      fee_cents = is_opening_order ? 0 : round_half_up(merchandise_cents * 0.15)
      raw_credit = merchandise_cents - fee_cents
      credit_cents = min(raw_credit, Invoice.amount_due_cents)
      evaluation order is pinned: merchandise first, fee second (fee computed
      from merchandise, never from the invoice balance), credit clamp last
    input_set: "The ReturnLines of the single ReturnAuthorization being received; the referenced order's Invoice"
    constants:
      NON_OPENING_FEE_BPS: 1500
    precision: "integer cents, round_half_up on the fee"
    variants:
      - name: opening_order_free
        when: "referenced Order.order_seq == 1 for its (retailer, brand) pair"
        difference: "fee_cents == 0 — free return on the opening order"
      - name: reorder_fee
        when: "referenced Order.order_seq >= 2"
        difference: "15% restocking fee deducted from the invoice credit"

  - name: territory_conflict_check
    trigger: "on Order placement (POST /orders) when any ExclusivityGrant exists for the order's brand"
    algorithm: constraint_propagation
    formula: |
      A grant g conflicts with an order placement iff ALL hold:
        g.brand_id == order.brand_id
        g.status == ACTIVE  (grants whose ends_at <= now are first flipped to
          EXPIRED by lazy evaluation and no longer block)
        g.starts_at <= now < g.ends_at
        retailer.id != g.retailer_id
        haversine_km(g.center_lat, g.center_lng, retailer.lat, retailer.lng)
          < g.radius_km   (strictly less; a storefront exactly ON the boundary
          circle is NOT blocked)
      If any grant conflicts -> ERR_TERRITORY_CONFLICT
    input_set: "ExclusivityGrants with brand_id == order.brand_id, evaluated at the logical-clock now"
    constants:
      EARTH_RADIUS_KM: 6371.0
    precision: "distance computed in double precision; comparison is strict <"
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a declared role; X-User-ID header present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is in the endpoint's roles list (RBAC denial)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Ownership: for entity-backed roles acting on owned resources, X-User-ID matches the resource's owner FK (e.g. Retailer placing an order must be Order.retailer_id; Brand shipping must be Order.brand_id)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all role-scoped action endpoints"
  - priority: 4
    category: existence
    check: "Every path-parameter and body-reference id resolves to an existing entity, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: existence
    check: "Request body shape: required fields present, types correct, enum members valid"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version on OCC-guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /credit-accounts/{id}/limit-review, POST /exclusivity-grants"
  - priority: 7
    category: state
    check: "State-machine precondition: the target entity's current state permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 8
    category: business_safety
    check: "Fraud gate: on POST /orders and POST /return-authorizations the acting retailer has no FraudFlag with status == OPEN; on POST /orders the acting Retailer.verification_status == VERIFIED"
    error_id: ERR_FRAUD_HOLD
    http_status: 422
    applies_to: "POST /orders, POST /return-authorizations"
  - priority: 9
    category: business_safety
    check: "Return-abuse gate: on POST /return-authorizations/{id}/review (approve), Retailer.return_rate (provisional variant) < 0.20"
    error_id: ERR_RETURN_ABUSE_GUARD
    http_status: 422
    applies_to: "POST /return-authorizations/{id}/review"
  - priority: 10
    category: business_safety
    check: "Resubmission cap: Retailer.verification_resubmission_count < 3 on verification resubmit"
    error_id: ERR_RESUBMISSION_LIMIT
    http_status: 422
    applies_to: "POST /retailers/{id}/verification/resubmit"
  - priority: 11
    category: business_constraint
    check: "Brand config: on POST /orders the Brand.onboarding_status == ACTIVE and every line qty is a positive multiple of Brand.default_case_pack_size"
    error_id: ERR_CASE_PACK_VIOLATION
    http_status: 422
    applies_to: "POST /orders"
  - priority: 12
    category: business_constraint
    check: "Territory: territory_conflict_check finds no conflicting ACTIVE grant for the order's brand at the retailer's location at the current logical time"
    error_id: ERR_TERRITORY_CONFLICT
    http_status: 422
    applies_to: "POST /orders"
  - priority: 13
    category: business_constraint
    check: "Grant interval well-formedness: on POST /exclusivity-grants, ends_at > starts_at; no pair of grants for the same brand_id and same retailer_id may have overlapping [starts_at, ends_at) intervals while both are ACTIVE (touching endpoints allowed)"
    error_id: ERR_GRANT_OVERLAP
    http_status: 422
    applies_to: "POST /exclusivity-grants"
  - priority: 14
    category: business_constraint
    check: "Return quantity integrity: on receive, cumulative received qty per OrderLine must not exceed that line's net_sold_qty"
    error_id: ERR_RETURN_QTY_EXCEEDED
    http_status: 422
    applies_to: "POST /return-authorizations/{id}/receive"
  - priority: 15
    category: business_fiscal
    check: "Minimum order value: on POST /orders, subtotal_cents >= Brand.min_order_value_cents"
    error_id: ERR_MIN_ORDER_VALUE
    http_status: 422
    applies_to: "POST /orders"
  - priority: 16
    category: business_fiscal
    check: "Credit gate: on POST /orders, the retailer's CreditAccount.status == ACTIVE and CreditAccount.available_cents >= subtotal_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /orders"
  - priority: 17
    category: business_fiscal
    check: "Payment bounds: on POST /invoices/{id}/payments, amount_cents > 0 and amount_cents <= Invoice.balance_cents"
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST /invoices/{id}/payments"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the logical clock. Default startup time before any call is exactly 2026-09-01T00:00:00Z; the logical clock NEVER falls back to wall-clock time. Triggers lazy evaluation of invoice overdue flips and exclusivity-grant expirations on subsequent reads/writes."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ now_iso8601: string }"
    side_effects:
      - "lazy re-evaluation armed for Invoice OPEN->OVERDUE and ExclusivityGrant ACTIVE->EXPIRED"

  # --- Retailers ---
  - method: POST
    path: "/wholesale/retailers"
    description: "Register a retail buyer with storefront proof and resale certificate references"
    roles: [Anonymous]
    code: 201
    input: [legal_name, store_type, address, lat, lng, storefront_proof_url, resale_certificate_no, "referral_code?"]
    output: Retailer
    side_effects:
      - "Retailer created in PENDING with both document sub-states PENDING"
      - "if referral_code matches a Brand.referral_code, the registration is bound to that brand for order attribution"
  - method: GET
    path: "/wholesale/retailers"
    description: "List retailers with pagination and optional filters"
    roles: [PlatformAdmin, RiskAnalyst, Retailer, Brand]
    code: 200
    input: ["verification_status?", "store_type?", "limit?", "offset?"]
    output: Retailer[]
    side_effects: []
  - method: GET
    path: "/wholesale/retailers/{id}"
    description: "Fetch one retailer including verification sub-states, risk_tier, return_rate"
    roles: [PlatformAdmin, RiskAnalyst, Retailer, Brand]
    code: 200
    input: []
    output: Retailer
    side_effects: []
  - method: POST
    path: "/wholesale/retailers/{id}/documents/review"
    description: "Confirm or reject one verification document (storefront proof or resale certificate)"
    roles: [PlatformAdmin]
    code: 200
    input: [document_type, decision]
    output: Retailer
    side_effects:
      - "storefront_proof_status or resale_cert_status set to CONFIRMED or REJECTED; Retailer.version += 1"
  - method: POST
    path: "/wholesale/retailers/{id}/verify"
    description: "Overall verification decision; approve requires both documents CONFIRMED"
    roles: [PlatformAdmin]
    code: 200
    input: [decision]
    output: Retailer
    side_effects:
      - "verification_status PENDING -> VERIFIED or PENDING -> REJECTED; Retailer.version += 1"
  - method: POST
    path: "/wholesale/retailers/{id}/request-more-info"
    description: "Move a pending retailer into MORE_INFO_REQUESTED"
    roles: [PlatformAdmin]
    code: 200
    input: ["reason?"]
    output: Retailer
    side_effects:
      - "verification_status PENDING -> MORE_INFO_REQUESTED; Retailer.version += 1"
  - method: POST
    path: "/wholesale/retailers/{id}/verification/resubmit"
    description: "Retailer resubmits verification documents after MORE_INFO_REQUESTED"
    roles: [Retailer]
    code: 200
    input: [storefront_proof_url, resale_certificate_no]
    output: Retailer
    side_effects:
      - "verification_status MORE_INFO_REQUESTED -> PENDING; both document sub-states reset to PENDING; verification_resubmission_count += 1; Retailer.version += 1"

  # --- Brands ---
  - method: POST
    path: "/wholesale/brands"
    description: "Create a brand in DRAFT with its commercial configuration"
    roles: [Brand]
    code: 201
    input: [name, contact_email, min_order_value_cents, default_case_pack_size, lead_time_days, payout_delay_days]
    output: Brand
    side_effects:
      - "Brand created in DRAFT with server-minted referral_code"
  - method: GET
    path: "/wholesale/brands"
    description: "List brands with pagination and optional filters"
    roles: [PlatformAdmin, RiskAnalyst, Retailer, Brand]
    code: 200
    input: ["onboarding_status?", "limit?", "offset?"]
    output: Brand[]
    side_effects: []
  - method: GET
    path: "/wholesale/brands/{id}"
    description: "Fetch one brand including payout_balance_cents and abuse_flags"
    roles: [PlatformAdmin, RiskAnalyst, Retailer, Brand]
    code: 200
    input: []
    output: Brand
    side_effects: []
  - method: POST
    path: "/wholesale/brands/{id}/activate"
    description: "Activate a fully-configured brand (DRAFT -> ACTIVE)"
    roles: [Brand]
    code: 200
    input: []
    output: Brand
    side_effects:
      - "Brand.onboarding_status := ACTIVE; Brand.version += 1"
  - method: POST
    path: "/wholesale/brands/{id}/reinstate"
    description: "Reinstate a suspended brand (SUSPENDED -> ACTIVE)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Brand
    side_effects:
      - "Brand.onboarding_status := ACTIVE; Brand.version += 1"

  # --- Credit accounts ---
  - method: POST
    path: "/wholesale/credit-accounts"
    description: "Open a credit account for a VERIFIED retailer; runs the provisional underwriting variant to set the initial limit"
    roles: [PlatformAdmin]
    code: 201
    input: [retailer_id]
    output: CreditAccount
    side_effects:
      - "credit_limit_underwriting (provisional) computes limit_cents; available_cents := limit_cents; status ACTIVE"
  - method: GET
    path: "/wholesale/credit-accounts"
    description: "List credit accounts; filter by retailer_id (FK reverse-reachability)"
    roles: [PlatformAdmin, RiskAnalyst]
    code: 200
    input: ["retailer_id?", "status?", "limit?", "offset?"]
    output: CreditAccount[]
    side_effects: []
  - method: GET
    path: "/wholesale/credit-accounts/{id}"
    description: "Fetch one credit account"
    roles: [PlatformAdmin, RiskAnalyst]
    code: 200
    input: []
    output: CreditAccount
    side_effects: []
  - method: POST
    path: "/wholesale/credit-accounts/{id}/limit-review"
    description: "Re-run underwriting (behavioral variant) and set a new limit; OCC-guarded on the account version"
    roles: [PlatformAdmin]
    code: 200
    input: [expected_credit_account_version]
    output: CreditAccount
    side_effects:
      - "credit_limit_underwriting (behavioral) recomputes limit_cents; available_cents := limit_cents - outstanding balances; linked Retailer.risk_tier recomputed; increments CreditAccount.version by 1"
  - method: POST
    path: "/wholesale/credit-accounts/{id}/unfreeze"
    description: "Unfreeze a FROZEN account once the retailer is VERIFIED again"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: CreditAccount
    side_effects:
      - "CreditAccount FROZEN -> ACTIVE; CreditAccount.version += 1"
  - method: POST
    path: "/wholesale/credit-accounts/{id}/close"
    description: "Close a FROZEN account with no overdue invoices"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: CreditAccount
    side_effects:
      - "CreditAccount FROZEN -> CLOSED; CreditAccount.version += 1"

  # --- Orders & lines ---
  - method: POST
    path: "/wholesale/orders"
    description: "Place a wholesale order with line items; runs the full validation ladder including territory and credit gates"
    roles: [Retailer]
    code: 201
    input: [retailer_id, brand_id, lines]
    output: Order
    side_effects:
      - "attribution fixed from the retailer's registration binding; order_seq assigned; subtotal_cents computed from lines"
      - "OrderLines created (amount_cents per line)"
  - method: GET
    path: "/wholesale/orders"
    description: "List orders; filter by retailer_id or brand_id (FK reverse-reachability)"
    roles: [PlatformAdmin, RiskAnalyst, Retailer, Brand]
    code: 200
    input: ["retailer_id?", "brand_id?", "status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []
  - method: GET
    path: "/wholesale/orders/{id}"
    description: "Fetch one order"
    roles: [PlatformAdmin, RiskAnalyst, Retailer, Brand]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/wholesale/orders/{id}/lines"
    description: "List an order's lines"
    roles: [PlatformAdmin, RiskAnalyst, Retailer, Brand]
    code: 200
    input: ["limit?", "offset?"]
    output: OrderLine[]
    side_effects: []
  - method: GET
    path: "/wholesale/orders/{id}/invoice"
    description: "Fetch the order's invoice (array of 0 or 1)"
    roles: [PlatformAdmin, RiskAnalyst, Retailer, Brand]
    code: 200
    input: []
    output: Invoice[]
    side_effects: []
  - method: GET
    path: "/wholesale/orders/{id}/return-authorizations"
    description: "List return authorizations for the order"
    roles: [PlatformAdmin, RiskAnalyst, Retailer, Brand]
    code: 200
    input: ["limit?", "offset?"]
    output: ReturnAuthorization[]
    side_effects: []
  - method: POST
    path: "/wholesale/orders/{id}/ship"
    description: "Ship a placed order after the brand lead time; issues the invoice and computes the payout"
    roles: [Brand]
    code: 200
    input: []
    output: Order
    side_effects:
      - "Order PLACED -> SHIPPED; Invoice created (OPEN, due now + 60d); Payout computed per commission_calc and created SCHEDULED; Brand.payout_balance_cents += payout.net_cents; Order.version += 1"
  - method: POST
    path: "/wholesale/orders/{id}/deliver"
    description: "Mark a shipped order delivered"
    roles: [Brand]
    code: 200
    input: []
    output: Order
    side_effects:
      - "Order SHIPPED -> DELIVERED; Order.version += 1"
  - method: POST
    path: "/wholesale/orders/{id}/cancel"
    description: "Retailer cancels a still-placed order"
    roles: [Retailer]
    code: 200
    input: []
    output: Order
    side_effects:
      - "Order PLACED -> CANCELLED; Order.version += 1"

  # --- Invoices & payments ---
  - method: GET
    path: "/wholesale/invoices/{id}"
    description: "Fetch one invoice (lazy overdue evaluation applied on read)"
    roles: [PlatformAdmin, RiskAnalyst, Retailer, Brand]
    code: 200
    input: []
    output: Invoice
    side_effects:
      - "if OPEN and now > due_date and balance_cents > 0: flips to OVERDUE before responding"
  - method: POST
    path: "/wholesale/invoices/{id}/payments"
    description: "Record a retailer payment against an invoice balance"
    roles: [Retailer]
    code: 201
    input: [amount_cents]
    output: Payment
    side_effects:
      - "Payment created; Invoice.paid_amount_cents += amount_cents; balance_cents recomputed; if balance reaches 0 Invoice -> PAID; CreditAccount.available_cents recomputed"
  - method: GET
    path: "/wholesale/invoices/{id}/payments"
    description: "List payments allocated to an invoice"
    roles: [PlatformAdmin, RiskAnalyst, Retailer, Brand]
    code: 200
    input: ["limit?", "offset?"]
    output: Payment[]
    side_effects: []
  - method: POST
    path: "/wholesale/invoices/{id}/write-off"
    description: "Write off an overdue invoice at least 30 days past due; the brand's payout is NOT clawed back"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects:
      - "Invoice OVERDUE -> WRITTEN_OFF; CreditAccount.available_cents recomputed (balance no longer outstanding); Retailer.risk_tier recomputed"

  # --- Returns ---
  - method: POST
    path: "/wholesale/return-authorizations"
    description: "Request a return authorization against a delivered order"
    roles: [Retailer]
    code: 201
    input: [order_id, lines]
    output: ReturnAuthorization
    side_effects:
      - "ReturnAuthorization created REQUESTED with its ReturnLines; is_opening_order fixed from the order's order_seq"
  - method: GET
    path: "/wholesale/return-authorizations/{id}"
    description: "Fetch one return authorization"
    roles: [PlatformAdmin, RiskAnalyst, Retailer, Brand]
    code: 200
    input: []
    output: ReturnAuthorization
    side_effects: []
  - method: GET
    path: "/wholesale/return-authorizations/{id}/lines"
    description: "List a return authorization's lines"
    roles: [PlatformAdmin, RiskAnalyst, Retailer, Brand]
    code: 200
    input: ["limit?", "offset?"]
    output: ReturnLine[]
    side_effects: []
  - method: GET
    path: "/wholesale/order-lines/{id}"
    description: "Fetch one order line (anchors the order-lines collection for reverse-reachability)"
    roles: [PlatformAdmin, RiskAnalyst, Retailer, Brand]
    code: 200
    input: []
    output: OrderLine
    side_effects: []
  - method: GET
    path: "/wholesale/order-lines/{id}/return-lines"
    description: "List return lines recorded against an order line"
    roles: [PlatformAdmin, RiskAnalyst, Retailer, Brand]
    code: 200
    input: ["limit?", "offset?"]
    output: ReturnLine[]
    side_effects: []
  - method: POST
    path: "/wholesale/return-authorizations/{id}/review"
    description: "Brand approves or rejects a requested return; approval is gated on the retailer's provisional return rate"
    roles: [Brand]
    code: 200
    input: [decision]
    output: ReturnAuthorization
    side_effects:
      - "ReturnAuthorization REQUESTED -> APPROVED or REQUESTED -> REJECTED; ReturnAuthorization.version += 1"
  - method: POST
    path: "/wholesale/return-authorizations/{id}/receive"
    description: "Record physical receipt of an approved return; applies credits, order state, and return-rate recompute"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ReturnAuthorization
    side_effects:
      - "return_credit_calc computes return_fee_cents and credit_cents"
      - "OrderLine.net_sold_qty reduced; Invoice.amount_due_cents credited (floor 0) and status re-evaluated; Order -> PARTIALLY_RETURNED or RETURNED; Retailer.return_rate recomputed (final variant)"

  # --- Payouts ---
  - method: GET
    path: "/wholesale/payouts"
    description: "List payouts; filter by brand_id or order_id (FK reverse-reachability)"
    roles: [PlatformAdmin, RiskAnalyst, Brand]
    code: 200
    input: ["brand_id?", "order_id?", "status?", "limit?", "offset?"]
    output: Payout[]
    side_effects: []
  - method: GET
    path: "/wholesale/payouts/{id}"
    description: "Fetch one payout"
    roles: [PlatformAdmin, RiskAnalyst, Brand]
    code: 200
    input: []
    output: Payout
    side_effects: []
  - method: POST
    path: "/wholesale/payouts/process-due"
    description: "Batch-process all SCHEDULED payouts whose scheduled_date <= now; each moves to PROCESSING and debits the brand balance"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Payout[]
    side_effects:
      - "each due Payout SCHEDULED -> PROCESSING; Brand.payout_balance_cents -= net_cents per payout"
  - method: POST
    path: "/wholesale/payouts/{id}/complete"
    description: "Mark a processing payout paid"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Payout
    side_effects:
      - "Payout PROCESSING -> PAID; Payout.version += 1"
  - method: POST
    path: "/wholesale/payouts/{id}/fail"
    description: "Fail a processing payout back to SCHEDULED with a compensating balance credit"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Payout
    side_effects:
      - "Payout PROCESSING -> SCHEDULED; Brand.payout_balance_cents += net_cents (compensation)"

  # --- Exclusivity ---
  - method: POST
    path: "/wholesale/exclusivity-grants"
    description: "Brand grants a retailer an exclusive territory; OCC-guarded on the brand version"
    roles: [Brand]
    code: 201
    input: [brand_id, retailer_id, center_lat, center_lng, "radius_km?", starts_at, ends_at, expected_brand_version]
    output: ExclusivityGrant
    side_effects:
      - "ExclusivityGrant created ACTIVE; increments Brand.version by 1"
  - method: GET
    path: "/wholesale/exclusivity-grants"
    description: "List grants; filter by brand_id or retailer_id (FK reverse-reachability); lazy expiry applied on read"
    roles: [PlatformAdmin, RiskAnalyst, Retailer, Brand]
    code: 200
    input: ["brand_id?", "retailer_id?", "status?", "limit?", "offset?"]
    output: ExclusivityGrant[]
    side_effects:
      - "grants whose ends_at <= now flip ACTIVE -> EXPIRED before responding"
  - method: GET
    path: "/wholesale/exclusivity-grants/{id}"
    description: "Fetch one grant"
    roles: [PlatformAdmin, RiskAnalyst, Retailer, Brand]
    code: 200
    input: []
    output: ExclusivityGrant
    side_effects: []
  - method: POST
    path: "/wholesale/exclusivity-grants/{id}/revoke"
    description: "Brand revokes an active grant"
    roles: [Brand]
    code: 200
    input: []
    output: ExclusivityGrant
    side_effects:
      - "ExclusivityGrant ACTIVE -> REVOKED; ExclusivityGrant.version += 1"

  # --- Fraud ---
  - method: POST
    path: "/wholesale/fraud-flags"
    description: "Risk team raises a fraud flag on a retailer, optionally linked to an order"
    roles: [RiskAnalyst]
    code: 201
    input: [retailer_id, flag_type, "order_id?"]
    output: FraudFlag
    side_effects:
      - "FraudFlag created OPEN; subsequent orders/returns by the retailer are blocked by the fraud gate"
  - method: GET
    path: "/wholesale/fraud-flags"
    description: "List fraud flags; filter by retailer_id or order_id (FK reverse-reachability)"
    roles: [PlatformAdmin, RiskAnalyst]
    code: 200
    input: ["retailer_id?", "order_id?", "status?", "limit?", "offset?"]
    output: FraudFlag[]
    side_effects: []
  - method: GET
    path: "/wholesale/fraud-flags/{id}"
    description: "Fetch one fraud flag"
    roles: [PlatformAdmin, RiskAnalyst]
    code: 200
    input: []
    output: FraudFlag
    side_effects: []
  - method: POST
    path: "/wholesale/fraud-flags/{id}/confirm"
    description: "Confirm an open flag; fires the full fraud cascade (retailer suspension path or brand abuse path)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: FraudFlag
    side_effects:
      - "FraudFlag OPEN -> CONFIRMED; cascade per the FraudFlag state machine (Retailer -> SUSPENDED + CreditAccount -> FROZEN + PLACED orders -> CANCELLED with compensating payouts, or Brand.abuse_flags += 1 and payout_balance_cents -= 5000 with possible auto-suspension)"
  - method: POST
    path: "/wholesale/fraud-flags/{id}/dismiss"
    description: "Dismiss an open flag with no cascade"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: FraudFlag
    side_effects:
      - "FraudFlag OPEN -> DISMISSED; FraudFlag.version += 1"

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or invalid X-User-Role / X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Acting role is not in the endpoint's roles list"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Entity-backed caller does not own the target resource (X-User-ID mismatch with owner FK)"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path or body-referenced entity id does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required field missing, wrong type, or invalid enum member in the request body"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent entity's current version on an OCC-guarded write"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target entity's current state does not permit the requested transition (includes terminal-state lockdown and already-in-target-state repeats)"
  - id: ERR_VERIFICATION_INCOMPLETE
    http: 422
    condition: "Overall verify attempted while storefront_proof_status or resale_cert_status is not CONFIRMED"
  - id: ERR_RESUBMISSION_LIMIT
    http: 422
    condition: "Retailer.verification_resubmission_count has reached 3; further resubmits rejected"
  - id: ERR_FRAUD_HOLD
    http: 422
    condition: "Acting retailer has an OPEN FraudFlag, or is not VERIFIED, when placing an order or requesting a return"
  - id: ERR_RETURN_ABUSE_GUARD
    http: 422
    condition: "Return approval blocked: retailer provisional return_rate >= 0.20"
  - id: ERR_CASE_PACK_VIOLATION
    http: 422
    condition: "Order line qty is not a positive multiple of the brand's default_case_pack_size (or brand not ACTIVE)"
  - id: ERR_TERRITORY_CONFLICT
    http: 422
    condition: "An ACTIVE exclusivity grant for this brand covers the retailer's storefront location at the current time"
  - id: ERR_GRANT_OVERLAP
    http: 422
    condition: "Grant interval malformed (ends_at <= starts_at) or overlaps another ACTIVE grant for the same brand and retailer"
  - id: ERR_RETURN_QTY_EXCEEDED
    http: 422
    condition: "Cumulative received return quantity for an order line would exceed that line's net_sold_qty"
  - id: ERR_MIN_ORDER_VALUE
    http: 422
    condition: "Order subtotal_cents is below the brand's min_order_value_cents"
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 422
    condition: "Retailer credit account is not ACTIVE or available_cents is below the order subtotal"
  - id: ERR_OVERPAYMENT
    http: 422
    condition: "Payment amount is non-positive or exceeds the invoice balance_cents"
  - id: ERR_WRITE_OFF_TOO_EARLY
    http: 422
    condition: "Write-off attempted before due_date + 30 days or on a non-OVERDUE invoice"
  - id: ERR_BRAND_SUSPENDED
    http: 422
    condition: "Brand.onboarding_status is SUSPENDED or DRAFT where ACTIVE is required (e.g. ship)"
  - id: ERR_LEAD_TIME_NOT_MET
    http: 422
    condition: "Ship attempted before order created_at + brand lead_time_days"

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated registration caller"
    identity: opaque
    exclusive_operations:
      - "POST /retailers"
    shared_operations: []
  - name: PlatformAdmin
    description: "Marketplace operator: verification decisions, credit administration, returns receipt, payout operations, fraud adjudication, clock control"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /retailers/{id}/documents/review"
      - "POST /retailers/{id}/verify"
      - "POST /retailers/{id}/request-more-info"
      - "POST /brands/{id}/reinstate"
      - "POST /credit-accounts"
      - "POST /credit-accounts/{id}/limit-review"
      - "POST /credit-accounts/{id}/unfreeze"
      - "POST /credit-accounts/{id}/close"
      - "POST /invoices/{id}/write-off"
      - "POST /return-authorizations/{id}/receive"
      - "POST /payouts/process-due"
      - "POST /payouts/{id}/complete"
      - "POST /payouts/{id}/fail"
      - "POST /fraud-flags/{id}/confirm"
      - "POST /fraud-flags/{id}/dismiss"
    shared_operations:
      - "GET list/detail endpoints"
  - name: RiskAnalyst
    description: "Risk team member: raises fraud flags, reads credit and fraud posture"
    identity: opaque
    exclusive_operations:
      - "POST /fraud-flags"
    shared_operations:
      - "GET list/detail endpoints"
  - name: Retailer
    description: "Verified retail buyer acting as its Retailer entity"
    identity: "entity_backed:Retailer"
    exclusive_operations:
      - "POST /retailers/{id}/verification/resubmit"
      - "POST /orders"
      - "POST /orders/{id}/cancel"
      - "POST /invoices/{id}/payments"
      - "POST /return-authorizations"
    shared_operations:
      - "GET list/detail endpoints"
  - name: Brand
    description: "Selling brand acting as its Brand entity"
    identity: "entity_backed:Brand"
    exclusive_operations:
      - "POST /brands"
      - "POST /brands/{id}/activate"
      - "POST /orders/{id}/ship"
      - "POST /orders/{id}/deliver"
      - "POST /return-authorizations/{id}/review"
      - "POST /exclusivity-grants"
      - "POST /exclusivity-grants/{id}/revoke"
    shared_operations:
      - "GET list/detail endpoints"
