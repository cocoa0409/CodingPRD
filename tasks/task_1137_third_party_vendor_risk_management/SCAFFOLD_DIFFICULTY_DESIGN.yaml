              as: RiskOfficer
              captures: { score_after_reopen: $.data.composite_risk_score }
            # close again via a new plan
            - call: "POST /tprm/incidents/${i_inv}/remediation-plans"
              payload: { plan_summary: "Fix again", committed_completion_date: "2026-06-15T00:00:00Z" }
              as: RiskOfficer
              captures: { plan_inv2: $.data.id }
            - call: "POST /tprm/remediation-plans/${plan_inv2}/submit"
              payload: {}
              as: RiskOfficer
            - call: "POST /tprm/remediation-plans/${plan_inv2}/approve"
              payload: {}
              as: RiskOfficer
            - call: "POST /tprm/remediation-plans/${plan_inv2}/submit-verification"
              payload: { verification_evidence_uri: "s3://evidence/y" }
              as: RiskOfficer
            - call: "POST /tprm/remediation-plans/${plan_inv2}/verify"
              payload: {}
              as: BusinessUnitOwner
          trigger:
            - call: "GET /tprm/vendors/${v_inv}"
              payload: {}
              as: RiskOfficer
              captures: { score_after_close_2: $.data.composite_risk_score }
          assert:
            - "score_after_close_1 == 0  # after first close, score restored to baseline"
            - "score_after_reopen == 8  # after reopen, SEV_3 contributes 8 * 1.0 = 8"
            - "score_after_close_2 == 0  # after second close, score restored to baseline again"

      - name: concentration_assessment_publish_supersede_invariant
        grounds:
          - state_machines.ConcentrationAssessment.transitions
        distinguishing_aspect: |
          Conserved quantity = count of PUBLISHED ConcentrationAssessments per
          grouping_dimension. Forward action: publish assessment A1 on REGION.
          Compensating action: publish a newer A2 on REGION → A1 flips to
          SUPERSEDED. Invariant: at any instant, at most one PUBLISHED
          assessment exists per grouping_dimension. Test publishes A1, then A2,
          then asserts A1.status == SUPERSEDED, A2.status == PUBLISHED, and
          count(PUBLISHED on REGION) == 1.
        test_recipe:
          setup:
            - "One ACTIVE engagement (so publish has non-trivial work). Two ConcentrationAssessments on REGION in COMPUTING."
          setup_api_calls:
            - call: "POST /tprm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tprm/vendors"
              payload: { legal_name: "Supersede Vendor", headquarters_region: "NA", service_category: "BPO" }
              as: VendorRelationshipManager
              captures: { v_sup: $.data.id }
            - call: "POST /tprm/vendors/${v_sup}/engagements"
              payload: { engagement_code: "SUP-E1", service_summary: "BPO", annual_spend_cents: 100, data_sensitivity: "INTERNAL" }
              as: VendorRelationshipManager
              captures: { e_sup: $.data.id }
            - call: "POST /tprm/engagements/${e_sup}/due-diligence-packages"
              payload: { financial_review_score: 90, security_review_score: 90, compliance_review_score: 90, financial_reviewer_id: "u_f27", security_reviewer_id: "u_s27", compliance_reviewer_id: "u_c27" }
              as: VendorRelationshipManager
              captures: { p_sup: $.data.id }
            - call: "POST /tprm/due-diligence-packages/${p_sup}/submit"
              payload: {}
              as: VendorRelationshipManager
            - call: "POST /tprm/due-diligence-packages/${p_sup}/begin-review"
              payload: {}
              as: RiskOfficer
            - call: "GET /tprm/engagements/${e_sup}"
              payload: {}
              as: RiskOfficer
              captures: { e_sup_v: $.data.version }
            - call: "POST /tprm/due-diligence-packages/${p_sup}/approve"
              payload: { expected_engagement_version: "${e_sup_v}" }
              as: RiskOfficer
            - call: "POST /tprm/engagements/${e_sup}/contracts"
              payload: { contract_reference: "SUP-C1", effective_date: "2026-05-01T00:00:00Z", expiry_date: "2027-05-01T00:00:00Z", has_right_to_audit_clause: false, has_sla_terms: true, has_exit_plan_section: false, sla_uptime_pct: 99.5, breach_cure_window_days: 30, renewal_notice_days: 60 }
              as: VendorRelationshipManager
              captures: { c_sup: $.data.id }
            - call: "GET /tprm/engagements/${e_sup}"
              payload: {}
              as: RiskOfficer
              captures: { e_sup_v2: $.data.version }
            - call: "POST /tprm/contracts/${c_sup}/execute"
              payload: { expected_engagement_version: "${e_sup_v2}" }
              as: RiskOfficer
            - call: "POST /tprm/concentration-assessments"
              payload: { assessment_window_start: "2026-05-01T00:00:00Z", assessment_window_end: "2026-05-15T00:00:00Z", grouping_dimension: "REGION" }
              as: ComplianceDirector
              captures: { a1: $.data.id }
            - call: "POST /tprm/concentration-assessments"
              payload: { assessment_window_start: "2026-05-15T00:00:00Z", assessment_window_end: "2026-06-01T00:00:00Z", grouping_dimension: "REGION" }
              as: ComplianceDirector
              captures: { a2: $.data.id }
          trigger:
            - call: "POST /tprm/concentration-assessments/${a1}/publish"
              payload: {}
              as: ComplianceDirector
            - call: "POST /tprm/concentration-assessments/${a2}/publish"
              payload: {}
              as: ComplianceDirector
          assert:
            - "ConcentrationAssessment.${a1}.status == SUPERSEDED"
            - "ConcentrationAssessment.${a2}.status == PUBLISHED"
            - "count of ConcentrationAssessment rows with grouping_dimension == REGION AND status == PUBLISHED == 1  # invariant restored"
