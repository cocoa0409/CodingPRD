# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7; setup chains replay from
# empty DB. Default logical clock at boot: 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: warranty_settlement_provisional_diverges_from_final
        grounds:
          - calculations.calc_warranty_settlement
          - state_machines.WarrantyClaim.UNDER_REVIEW_to_ESCALATED
          - state_machines.WarrantyClaim.ESCALATED_to_APPROVED
          - state_machines.WarrantyClaim.APPROVED_to_SETTLED
        distinguishing_aspect: |
          Warranty-domain dual variant: the PROVISIONAL variant prices the claim
          from the catalog schedule (PART_COST 4800 + LABOR_ALLOWANCE 7500 =
          12300) while the FINAL variant prices the identical claim from actuals
          (resolved part 4800 + actual labor 9000 = 13800) — same claim, two
          sanctioned algorithms, a delta of exactly 1500 cents.
        test_recipe:
          setup:
            - "Season 2026 in IN_SEASON (clock 2026-04-01); model GX-100 ACTIVE; HOME_CENTER channel BigBox with an ACCEPTED allocation of 10 units from a 50-unit lot"
            - "Sale REGISTERED (proof at creation) for 1 unit against that allocation"
            - "Part IGN-9 (ELECTRONICS, compatible with GX-100, cost 4800, stock 5) in the catalog"
            - "Claim on the sale for component ELECTRONICS, moved SUBMITTED -> UNDER_REVIEW -> ESCALATED (provisional 12300 exceeds GOODWILL_CAP_CENTS 10000, so direct approval from UNDER_REVIEW is blocked)"
          setup_api_calls:
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons", payload: { name: "Grilling Season 2026", year: 2026, build_start: "2026-01-05T00:00:00Z", allocation_open: "2026-02-01T00:00:00Z", in_season_start: "2026-03-01T00:00:00Z", clearance_start: "2026-08-01T00:00:00Z", season_end: "2026-09-30T00:00:00Z", demand_forecast_units: 1000 }, as: PlannerAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /grillops/models", payload: { model_code: "GX-100", model_family: "GX", model_year: 2026, base_price_cents: 100000, demand_share_bp: 5000 }, as: PlannerAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /grillops/channels", payload: { name: "BigBox", channel_type: "HOME_CENTER", allocation_priority: 10, credit_limit_cents: 100000000 }, as: PlannerAdmin, captures: { ch_id: "$.data.id" } }
            - { call: "POST /grillops/seasons/${s_id}/lots", payload: { model_id: "${m_id}", build_week: "2026-W06", units_built: 50 }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "BUILD" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "ALLOCATION" }, as: PlannerAdmin }
            - { call: "GET /grillops/seasons/${s_id}", as: PlannerAdmin, captures: { s_v2: "$.data.version" } }
            - { call: "POST /grillops/allocations", payload: { season_id: "${s_id}", channel_account_id: "${ch_id}", model_id: "${m_id}", allocated_units: 10, expected_season_version: "${s_v2}" }, as: PlannerAdmin, captures: { a_id: "$.data.id", a_v: "$.data.version" } }
            - { call: "POST /grillops/allocations/${a_id}/respond", payload: { action: "ACCEPT", expected_allocation_version: "${a_v}" }, as: ChannelRep, as_user_id: "${ch_id}" }
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2026-04-01T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "IN_SEASON" }, as: PlannerAdmin }
            - { call: "POST /grillops/sales", payload: { season_id: "${s_id}", model_id: "${m_id}", channel_account_id: "${ch_id}", quantity: 1, proof_of_purchase_token: "RCPT-1001" }, as: ChannelRep, as_user_id: "${ch_id}", captures: { sale_id: "$.data.id" } }
            - { call: "POST /grillops/parts", payload: { part_number: "IGN-9", component: "ELECTRONICS", compatible_model_codes: ["GX-100"], supersession_chain_id: "CH-IGN", chain_position: 1, unit_cost_cents: 4800, stock_quantity: 5 }, as: PlannerAdmin }
            - { call: "POST /grillops/warranty-claims", payload: { sale_id: "${sale_id}", component: "ELECTRONICS", failure_description: "Igniter sparks but no flame" }, as: ServiceAgent, captures: { cl_id: "$.data.id" } }
            - { call: "POST /grillops/warranty-claims/${cl_id}/adjudicate", payload: { action: "REVIEW" }, as: ServiceAgent }
            - { call: "POST /grillops/warranty-claims/${cl_id}/adjudicate", payload: { action: "ESCALATE" }, as: ServiceAgent }
          trigger:
            - { call: "POST /grillops/warranty-claims/${cl_id}/adjudicate", payload: { action: "APPROVE" }, as: ServiceAgent, captures: { prov: "$.data.provisional_settlement_cents" } }
            - { call: "POST /grillops/warranty-claims/${cl_id}/adjudicate", payload: { action: "SETTLE", actual_labor_cents: 9000 }, as: ServiceAgent, captures: { fin: "$.data.final_settlement_cents", po_id: "$.data.settlement_parts_order_id" } }
            - { call: "GET /grillops/parts-orders/${po_id}", as: ServiceAgent, captures: { po_cost: "$.data.total_cost_cents", po_free: "$.data.free_of_charge" } }
          assert:
            - "captured prov == 12300 (PART_COST_ELECTRONICS_CENTS 4800 + LABOR_ALLOWANCE_ELECTRONICS_CENTS 7500)"
            - "captured fin == 13800 (resolved part 4800 + actual_labor_cents 9000)"
            - "WarrantyClaim.${cl_id}.settlement_delta_cents == 1500"
            - "captured po_cost == 4800 and po_free == true (WARRANTY fulfillment, model obligation open)"
            - "prov != fin for identical claim data — variant selection is pinned by adjudication state, not by input"

      - name: assembler_quality_official_diverges_from_provisional
        grounds:
          - calculations.calc_assembler_quality
          - entities.Assembler.fields.no_show_history
          - entities.Assembler.fields.completion_history
        distinguishing_aspect: |
          Assembler-domain dual variant (different entity domain from the
          warranty settlement variant): OFFICIAL counts every no-show forever
          (10000 - 1200*2 = 7600) while PROVISIONAL forgives the 111-day-old
          no-show and credits three recent completions (10000 - 1200*1 + 25*3 =
          8875) — identical event history, two sanctioned windows, different
          scores.
        test_recipe:
          setup:
            - "Season 2026 IN_SEASON; DIRECT channel WebDirect with ACCEPTED allocation of 20 units from a 100-unit lot of GX-100"
            - "Assembler ASM-Q CERTIFIED with default max_concurrent_jobs 4"
            - "No-show #1 recorded at clock 2026-03-01; clock advanced 111 days to 2026-06-20; no-show #2 plus three completed jobs recorded at the new clock"
