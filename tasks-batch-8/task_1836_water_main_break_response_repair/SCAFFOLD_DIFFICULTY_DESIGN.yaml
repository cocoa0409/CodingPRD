              captures: { c2: $.data.consecutive_pass_count }
          assert:
            - "Test 1 (chlorine 0.20) test_outcome == PASS and advisory.consecutive_pass_count == 1"
            - "Test 2 (chlorine 0.19) test_outcome == FAIL and advisory.consecutive_pass_count == 0 (reset)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: dispatch_gated_on_break_isolated
        grounds:
          - state_machines.WorkOrder.DRAFT_to_DISPATCHED
          - validations[priority=9]
          - errors[ERR_BREAK_NOT_ISOLATED]
        distinguishing_aspect: |
          WorkOrder dispatch depends on BreakReport state (WorkOrder -> BreakReport
          pair): dispatch while the break is merely CONFIRMED is rejected with
          ERR_BREAK_NOT_ISOLATED; after the isolation executes (break ISOLATED) the
          same dispatch succeeds.
        test_recipe:
          setup:
            - "Segment MAIN-8-OAK, valve Z1/100; break confirmed CIRCUMFERENTIAL; LIGHT crew 6000; work order DRAFT"
          setup_api_calls:
            - call: "POST /pipe-segments"
              payload: { segment_ref: "MAIN-8-OAK", material: DUCTILE_IRON, diameter_inches: 8, install_year: 1978 }
              as: PublicWorksEngineer
              captures: { seg: $.data.id }
            - call: "POST /valves"
              payload: { valve_code: "V-OAK-9", pipe_segment_id: "${seg}", coverage_zone: "Z1", customers_served: 100 }
              as: PublicWorksEngineer
              captures: { v1: $.data.id }
            - call: "POST /crews"
              payload: { crew_name: "Crew Oak", crew_size: 3, equipment_class: LIGHT, hourly_rate_cents: 6000 }
              as: Dispatcher
              captures: { cr: $.data.id }
            - call: "POST /break-reports"
              payload: { location_description: "400 Oak St", source: CUSTOMER_CALL }
              as: Dispatcher
              captures: { br: $.data.id }
            - call: "POST /break-reports/${br}/confirm"
              payload: { pipe_segment_id: "${seg}", break_type: CIRCUMFERENTIAL, severity: MEDIUM }
              as: Dispatcher
              captures: { br_v: $.data.version }
            - call: "POST /work-orders"
              payload: { break_report_id: "${br}", est_pipe_length_ft: 4 }
              as: Dispatcher
              captures: { wo: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo}/dispatch"
              payload: { crew_id: "${cr}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
            - call: "POST /isolation-events"
              payload: { break_report_id: "${br}", valve_ids: ["${v1}"], expected_break_report_version: "${br_v}" }
              as: Dispatcher
              captures: { iso: $.data.id }
            - call: "POST /isolation-events/${iso}/execute"
              as: Dispatcher
            - call: "POST /work-orders/${wo}/dispatch"
              payload: { crew_id: "${cr}" }
              as: Dispatcher
              captures: { st: $.data.work_status }
          assert:
            - "First dispatch (break CONFIRMED) returns error_id ERR_BREAK_NOT_ISOLATED (http 409)"
            - "After isolation execute, the same dispatch succeeds: WorkOrder.${wo}.work_status == DISPATCHED"

      - name: schedule_gated_on_permit_approved
        grounds:
          - state_machines.RestorationJob.PENDING_to_SCHEDULED
          - validations[priority=5]
          - errors[ERR_PERMIT_NOT_APPROVED]
        distinguishing_aspect: |
          RestorationJob scheduling depends on TrafficPermit state (RestorationJob
          -> TrafficPermit pair, different from WorkOrder -> BreakReport): a permit
          still in APPLIED blocks scheduling with ERR_PERMIT_NOT_APPROVED; approving
          the same permit lets the identical schedule call succeed.
        test_recipe:
          setup:
            - "Break A fully repaired (RestorationJob PENDING); permit for break A covering 2026-08-10 window in APPLIED"
          setup_api_calls:
            - call: "POST /pipe-segments"
              payload: { segment_ref: "MAIN-8-ELM", material: CAST_IRON, diameter_inches: 8, install_year: 1962 }
              as: PublicWorksEngineer
              captures: { seg: $.data.id }
            - call: "POST /valves"
              payload: { valve_code: "V-ELM-1", pipe_segment_id: "${seg}", coverage_zone: "Z1", customers_served: 100 }
              as: PublicWorksEngineer
              captures: { v1: $.data.id }
            - call: "POST /crews"
              payload: { crew_name: "Crew Beta", crew_size: 3, equipment_class: LIGHT, hourly_rate_cents: 6000 }
              as: Dispatcher
              captures: { cr: $.data.id }
            - call: "POST /break-reports"
              payload: { location_description: "100 Elm St", source: CUSTOMER_CALL }
              as: Dispatcher
              captures: { brA: $.data.id }
            - call: "POST /break-reports/${brA}/confirm"
              payload: { pipe_segment_id: "${seg}", break_type: CIRCUMFERENTIAL, severity: MEDIUM }
              as: Dispatcher
              captures: { brA_v: $.data.version }
            - call: "POST /isolation-events"
              payload: { break_report_id: "${brA}", valve_ids: ["${v1}"], expected_break_report_version: "${brA_v}" }
              as: Dispatcher
              captures: { isoA: $.data.id }
            - call: "POST /isolation-events/${isoA}/execute"
              as: Dispatcher
            - call: "POST /work-orders"
              payload: { break_report_id: "${brA}", est_pipe_length_ft: 4 }
              as: Dispatcher
              captures: { woA: $.data.id }
            - call: "POST /work-orders/${woA}/dispatch"
              payload: { crew_id: "${cr}" }
              as: Dispatcher
            - call: "POST /work-orders/${woA}/arrive"
              as: CrewLead
              as_user_id: "${cr}"
            - call: "POST /work-orders/${woA}/complete"
              payload: { actual_pipe_length_ft: 4, labor_hours: 1, materials_used: [] }
              as: CrewLead
              as_user_id: "${cr}"
            - call: "GET /restoration-jobs?work_order_id=${woA}"
              as: Dispatcher
              captures: { rjA: "$.data[0].id" }
            - call: "POST /traffic-permits"
              payload: { break_report_id: "${brA}", street_block: "ELM-100-BLK", valid_from: "2026-08-10T00:00:00Z", valid_to: "2026-08-12T00:00:00Z", control_plan: LANE_CLOSURE }
              as: Dispatcher
              captures: { permA: $.data.id }
          trigger:
            - call: "POST /restoration-jobs/${rjA}/schedule"
              payload: { scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T16:00:00Z", traffic_permit_id: "${permA}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
            - call: "POST /traffic-permits/${permA}/approve"
              as: PublicWorksEngineer
            - call: "POST /restoration-jobs/${rjA}/schedule"
              payload: { scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T16:00:00Z", traffic_permit_id: "${permA}" }
              as: Dispatcher
              captures: { st: $.data.restoration_status }
          assert:
            - "Schedule with APPLIED permit returns error_id ERR_PERMIT_NOT_APPROVED (http 409)"
            - "After permit approval the identical schedule succeeds: RestorationJob.${rjA}.restoration_status == SCHEDULED"

  - rule_id: resource_temporal_overlap
    instances:
      - name: permit_half_open_overlap_semantics
        grounds:
          - calculations.permit_overlap
          - errors[ERR_PERMIT_OVERLAP]
        distinguishing_aspect: |
          Resource = street_block, interval semantics = half-open [valid_from,
          valid_to): a permit starting exactly when another ends (adjacent,
          2026-08-12T00:00:00Z) is accepted, while one overlapping by an hour is
          rejected with ERR_PERMIT_OVERLAP.
        test_recipe:
          setup:
            - "Break confirmed on segment MAIN-8-OAK"
            - "Permit P1 on OAK-100-BLK valid [2026-08-10T00:00:00Z, 2026-08-12T00:00:00Z)"
          setup_api_calls:
            - call: "POST /pipe-segments"
              payload: { segment_ref: "MAIN-8-OAK", material: DUCTILE_IRON, diameter_inches: 8, install_year: 1978 }
              as: PublicWorksEngineer
              captures: { seg: $.data.id }
            - call: "POST /break-reports"
              payload: { location_description: "400 Oak St", source: CUSTOMER_CALL }
              as: Dispatcher
              captures: { br: $.data.id }
            - call: "POST /break-reports/${br}/confirm"
              payload: { pipe_segment_id: "${seg}", break_type: CIRCUMFERENTIAL, severity: MEDIUM }
              as: Dispatcher
            - call: "POST /traffic-permits"
              payload: { break_report_id: "${br}", street_block: "OAK-100-BLK", valid_from: "2026-08-10T00:00:00Z", valid_to: "2026-08-12T00:00:00Z", control_plan: LANE_CLOSURE }
              as: Dispatcher
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /traffic-permits"
              payload: { break_report_id: "${br}", street_block: "OAK-100-BLK", valid_from: "2026-08-12T00:00:00Z", valid_to: "2026-08-14T00:00:00Z", control_plan: FULL_CLOSURE }
              as: Dispatcher
              captures: { p2: $.data.id, p2_st: $.data.permit_status }
            - call: "POST /traffic-permits"
              payload: { break_report_id: "${br}", street_block: "OAK-100-BLK", valid_from: "2026-08-11T00:00:00Z", valid_to: "2026-08-13T00:00:00Z", control_plan: FLAGGING }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "Adjacent permit P2 [08-12, 08-14) is created with permit_status APPLIED (half-open: P1 ends exactly at 08-12T00:00:00Z)"
            - "Overlapping permit P3 [08-11, 08-13) is rejected with error_id ERR_PERMIT_OVERLAP (http 409)"

      - name: crew_window_buffer_overlap_semantics
        grounds:
          - calculations.crew_window_overlap
          - errors[ERR_CREW_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Different resource (Crew, not street_block) and different interval
          semantics (closed start + 60-minute trailing buffer, not half-open
          adjacency): dispatching the same crew at window_end+30min is rejected
          ERR_CREW_DOUBLE_BOOKED, while dispatch exactly at window_end+60min is
          accepted.
        test_recipe:
          setup:
            - "Segment MAIN-8-OAK with valves v1/Z1 and v2/Z2 (100 customers each)"
            - "Break A: confirmed CIRCUMFERENTIAL (est_hours 4), isolated with v1, work order dispatched to Crew Oak at 2026-08-01T00:00:00Z (window [00:00, 04:00], occupied until 05:00)"
            - "Break B: confirmed CIRCUMFERENTIAL, isolated with v2, work order DRAFT awaiting dispatch"
          setup_api_calls:
            - call: "POST /pipe-segments"
              payload: { segment_ref: "MAIN-8-OAK", material: DUCTILE_IRON, diameter_inches: 8, install_year: 1978 }
              as: PublicWorksEngineer
              captures: { seg: $.data.id }
            - call: "POST /valves"
              payload: { valve_code: "V-OAK-1", pipe_segment_id: "${seg}", coverage_zone: "Z1", customers_served: 100 }
              as: PublicWorksEngineer
              captures: { v1: $.data.id }
            - call: "POST /valves"
              payload: { valve_code: "V-OAK-2", pipe_segment_id: "${seg}", coverage_zone: "Z2", customers_served: 100 }
              as: PublicWorksEngineer
              captures: { v2: $.data.id }
            - call: "POST /crews"
              payload: { crew_name: "Crew Oak", crew_size: 3, equipment_class: LIGHT, hourly_rate_cents: 6000 }
              as: Dispatcher
              captures: { cr: $.data.id }
            - call: "POST /break-reports"
              payload: { location_description: "400 Oak St", source: CUSTOMER_CALL }
              as: Dispatcher
              captures: { brA: $.data.id }
            - call: "POST /break-reports/${brA}/confirm"
              payload: { pipe_segment_id: "${seg}", break_type: CIRCUMFERENTIAL, severity: MEDIUM }
              as: Dispatcher
              captures: { brA_v: $.data.version }
            - call: "POST /isolation-events"
              payload: { break_report_id: "${brA}", valve_ids: ["${v1}"], expected_break_report_version: "${brA_v}" }
              as: Dispatcher
              captures: { isoA: $.data.id }
            - call: "POST /isolation-events/${isoA}/execute"
              as: Dispatcher
            - call: "POST /work-orders"
              payload: { break_report_id: "${brA}", est_pipe_length_ft: 4 }
              as: Dispatcher
              captures: { woA: $.data.id }
            - call: "POST /work-orders/${woA}/dispatch"
              payload: { crew_id: "${cr}" }
              as: Dispatcher
            - call: "POST /break-reports"
              payload: { location_description: "975 Oak St", source: CUSTOMER_CALL }
              as: Dispatcher
              captures: { brB: $.data.id }
            - call: "POST /break-reports/${brB}/confirm"
              payload: { pipe_segment_id: "${seg}", break_type: CIRCUMFERENTIAL, severity: LOW }
              as: Dispatcher
              captures: { brB_v: $.data.version }
            - call: "POST /isolation-events"
              payload: { break_report_id: "${brB}", valve_ids: ["${v2}"], expected_break_report_version: "${brB_v}" }
              as: Dispatcher
              captures: { isoB: $.data.id }
            - call: "POST /isolation-events/${isoB}/execute"
              as: Dispatcher
            - call: "POST /work-orders"
              payload: { break_report_id: "${brB}", est_pipe_length_ft: 4 }
              as: Dispatcher
              captures: { woB: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T04:30:00Z" }
              as: System
            - call: "POST /work-orders/${woB}/dispatch"
              payload: { crew_id: "${cr}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T05:00:00Z" }
              as: System
            - call: "POST /work-orders/${woB}/dispatch"
              payload: { crew_id: "${cr}" }
              as: Dispatcher
              captures: { st: $.data.work_status }
          assert:
            - "Dispatch at 04:30 (inside 60-minute buffer after window end 04:00) returns error_id ERR_CREW_DOUBLE_BOOKED (http 409)"
            - "Dispatch at 05:00 == window_end + 60min exactly is accepted: WorkOrder.${woB}.work_status == DISPATCHED (availability boundary inclusive)"

  - rule_id: compensating_invariant
    instances:
      - name: execute_restore_conserves_open_valves
        grounds:
          - state_machines.IsolationEvent.PLANNED_to_EXECUTED
          - state_machines.IsolationEvent.EXECUTED_to_RESTORED
          - state_machines.Valve.OPEN_to_CLOSED
          - state_machines.Valve.CLOSED_to_OPEN
        distinguishing_aspect: |
          Conserved quantity = count of OPEN valves on the segment (physical
          plant): the forward action (execute) closes v1+v2 and sets
          customers_out_of_service to 550; the compensating action (repair
          completion, which restores the isolation) must return the open-valve
          count to exactly its pre-execute value and customers_out_of_service to 0.
        test_recipe:
          setup:
            - "Segment MAIN-8-CEDAR with v1/Z1/300 and v2/Z2/250, both OPEN (open-valve count 2)"
            - "Break confirmed CIRCUMFERENTIAL; isolation plan for both valves"
          setup_api_calls:
            - call: "POST /pipe-segments"
              payload: { segment_ref: "MAIN-8-CEDAR", material: DUCTILE_IRON, diameter_inches: 8, install_year: 1970 }
              as: PublicWorksEngineer
              captures: { seg: $.data.id }
            - call: "POST /valves"
              payload: { valve_code: "V-CED-1", pipe_segment_id: "${seg}", coverage_zone: "Z1", customers_served: 300 }
              as: PublicWorksEngineer
              captures: { v1: $.data.id }
            - call: "POST /valves"
              payload: { valve_code: "V-CED-2", pipe_segment_id: "${seg}", coverage_zone: "Z2", customers_served: 250 }
              as: PublicWorksEngineer
              captures: { v2: $.data.id }
            - call: "POST /break-reports"
              payload: { location_description: "5 Cedar Rd", source: SENSOR_SCADA }
              as: Dispatcher
              captures: { br: $.data.id }
            - call: "POST /break-reports/${br}/confirm"
              payload: { pipe_segment_id: "${seg}", break_type: CIRCUMFERENTIAL, severity: HIGH }
              as: Dispatcher
              captures: { br_v: $.data.version }
            - call: "POST /isolation-events"
              payload: { break_report_id: "${br}", valve_ids: ["${v1}", "${v2}"], expected_break_report_version: "${br_v}" }
              as: Dispatcher
              captures: { iso: $.data.id }
            - call: "POST /crews"
              payload: { crew_name: "Crew Cedar", crew_size: 4, equipment_class: LIGHT, hourly_rate_cents: 6000 }
              as: Dispatcher
              captures: { cr: $.data.id }
            - call: "POST /work-orders"
              payload: { break_report_id: "${br}", est_pipe_length_ft: 4 }
              as: Dispatcher
              captures: { wo: $.data.id }
          trigger:
            - call: "POST /isolation-events/${iso}/execute"
              as: Dispatcher
              captures: { ext: $.data.outage_extent_customers }
            - call: "GET /break-reports/${br}"
              as: Dispatcher
              captures: { oos_mid: $.data.customers_out_of_service }
            - call: "POST /work-orders/${wo}/dispatch"
              payload: { crew_id: "${cr}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo}/arrive"
              as: CrewLead
              as_user_id: "${cr}"
            - call: "POST /work-orders/${wo}/complete"
              payload: { actual_pipe_length_ft: 4, labor_hours: 1, materials_used: [] }
              as: CrewLead
              as_user_id: "${cr}"
            - call: "GET /pipe-segments/${seg}/valves"
              as: Dispatcher
              captures: { vv1: "$.data[0].valve_status", vv2: "$.data[1].valve_status" }
            - call: "GET /break-reports/${br}"
              as: Dispatcher
              captures: { oos_end: $.data.customers_out_of_service }
            - call: "GET /break-reports/${br}/isolation-events"
              as: Dispatcher
              captures: { iso_st: "$.data[0].isolation_status" }
          assert:
            - "Open-valve count before execute == 2 (both OPEN at setup)"
            - "During isolation: customers_out_of_service == 550 and both valves CLOSED"
            - "After repair completion (compensating action): both valves OPEN again (count back to 2), customers_out_of_service == 0, isolation_status == RESTORED"

      - name: claim_approve_void_conserves_money
        grounds:
          - state_machines.DamageClaim.SUBMITTED_to_APPROVED
          - state_machines.DamageClaim.APPROVED_to_VOIDED
          - calculations.break_cost_rollup
          - entities.BreakReport.fields.claims_liability_cents
        distinguishing_aspect: |
          Conserved quantity = break money fields (fiscal, different from the
          open-valve count): approve(60000) followed by void must leave
          claims_liability_cents, total_claims_paid_cents, and total_cost_cents
          exactly at their pre-approve values (61000 repair cost unchanged, paid 0).
        test_recipe:
          setup:
            - "Break fully repaired on segment MAIN-8-PINE; actual repair cost 61000 (labor 6000 + one materials line 50000 x 1.10 = 55000)"
            - "Damage claim for 100000 filed within the 90-day window"
          setup_api_calls:
            - call: "POST /pipe-segments"
              payload: { segment_ref: "MAIN-8-PINE", material: DUCTILE_IRON, diameter_inches: 8, install_year: 1975 }
              as: PublicWorksEngineer
              captures: { seg: $.data.id }
            - call: "POST /valves"
              payload: { valve_code: "V-PINE-8", pipe_segment_id: "${seg}", coverage_zone: "Z1", customers_served: 100 }
              as: PublicWorksEngineer
              captures: { v1: $.data.id }
            - call: "POST /crews"
              payload: { crew_name: "Crew Pine", crew_size: 3, equipment_class: LIGHT, hourly_rate_cents: 6000 }
              as: Dispatcher
              captures: { cr: $.data.id }
            - call: "POST /break-reports"
              payload: { location_description: "9 Pine Ct", source: CUSTOMER_CALL }
              as: Dispatcher
              captures: { br: $.data.id }
            - call: "POST /break-reports/${br}/confirm"
              payload: { pipe_segment_id: "${seg}", break_type: CIRCUMFERENTIAL, severity: MEDIUM }
              as: Dispatcher
              captures: { br_v: $.data.version }
            - call: "POST /isolation-events"
              payload: { break_report_id: "${br}", valve_ids: ["${v1}"], expected_break_report_version: "${br_v}" }
              as: Dispatcher
              captures: { iso: $.data.id }
            - call: "POST /isolation-events/${iso}/execute"
              as: Dispatcher
            - call: "POST /work-orders"
              payload: { break_report_id: "${br}", est_pipe_length_ft: 4 }
              as: Dispatcher
              captures: { wo: $.data.id }
            - call: "POST /work-orders/${wo}/dispatch"
              payload: { crew_id: "${cr}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo}/arrive"
              as: CrewLead
              as_user_id: "${cr}"
            - call: "POST /work-orders/${wo}/complete"
              payload: { actual_pipe_length_ft: 4, labor_hours: 1, materials_used: [ { item_code: "PIPE-8IN", quantity: 1, unit_price_cents: 50000 } ] }
              as: CrewLead
              as_user_id: "${cr}"
            - call: "POST /damage-claims"
              payload: { break_report_id: "${br}", claimant_name: "J. Homeowner", claimed_amount_cents: 100000 }
              as: Dispatcher
              captures: { cl: $.data.id }
            - call: "POST /damage-claims/${cl}/approve"
              payload: { approved_amount_cents: 60000 }
              as: ClaimsAdjuster
            - call: "GET /break-reports/${br}"
              as: Dispatcher
              captures: { liab1: $.data.claims_liability_cents, cost1: $.data.total_cost_cents }
          trigger:
            - call: "POST /damage-claims/${cl}/void"
              as: ClaimsAdjuster
            - call: "GET /break-reports/${br}"
              as: Dispatcher
              captures: { liab2: $.data.claims_liability_cents, paid2: $.data.total_claims_paid_cents, cost2: $.data.total_cost_cents }
          assert:
            - "After approve: claims_liability_cents == 60000 and total_cost_cents == 61000 (liability is not part of total cost)"
            - "After void (compensating action): claims_liability_cents == 0, total_claims_paid_cents == 0, total_cost_cents == 61000 — identical to pre-approve state"
