          Depth-3 chain from the substantiate trigger: complaint SUBSTANTIATED
          mutates Applicator points (hop 1); the recomputed rolling score
          crossing 10 flips Applicator SUSPENDED -> REVOKED (hop 2, caused by
          hop 1); revocation reverts the applicator's SCHEDULED WO_C to DRAFT
          (hop 3, caused by hop 2). Also voids WO_B's DRAFT invoice.
