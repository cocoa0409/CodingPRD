            - "the RightsAdministrator creation returns 403 with data.error_id == \"ERR_FORBIDDEN_ROLE\""
            - "GET /carriage/distributors as NetworkAdmin with limit=10 returns total_count == 2, containing ${d_admin_id} and ${d_sales_id} and no Pinhole Cable"
            - "the same creation as RevenueAccountant returns 403 with data.error_id == \"ERR_FORBIDDEN_ROLE\" — sharing this write does not extend to the accountant"

      - name: credit_review_peers_share_it_and_auditor_cannot_use_it
        claim_type: peer_roles
        grounds:
