# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_3009_closeout_sourcing_deal_driven_store_set
# 9 rules x 2 instances = 18 instances (combinatorial_formula carries a 3rd).
# Every setup chain replays against SCAFFOLD.yaml §1.2/§1.4/§1.5 from empty DB.
# Logical clock default before any set call: 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: landed_cost_provisional_vs_final_variant
        grounds:
          - calculations.landed_unit_cost
          - entities.BuyLot.fields.landed_unit_cost_cents
          - state_machines.BuyLot.SCREENING_to_CLEARED
        distinguishing_aspect: |
          Dual-variant cost accounting on the BuyLot domain: identical lot cost
          data yields 2000 cents under the provisional variant (est_sellable_qty)
          and 1190 cents under the final variant (grade-weighted effective qty).
        test_recipe:
          setup:
            - "Vendor and CA jurisdiction exist"
            - "Lot L: quantity_total 100, total_cost_cents 100000, est_sellable_qty 50, created by buyer-1"
            - "Screening round opened by a different user (so-1) and completed PASSED with grades 50/20/30"
          setup_api_calls:
            - call: "POST /jurisdiction-rules"
              payload: { jurisdiction_code: "CA", comparison_rule: "WAS_NOW_WINDOW", window_days: 90, required_offer_days: 30, max_advertised_discount_pct: 70, member_discount_cap_pct: 30 }
              as: PricingLead
              captures: { jur_ca: $.data.id }
            - call: "POST /vendors"
              payload: { name: "Acme Closeouts", vendor_code: "ACME" }
              as: SourcingBuyer
              as_user_id: buyer-1
              captures: { ven1: $.data.id }
            - call: "POST /lots"
              payload: { vendor_id: "${ven1}", home_jurisdiction_id: "${jur_ca}", title: "Widget Lot", source_type: "MFR_OVERRUN", condition_grade: "A", quantity_total: 100, total_cost_cents: 100000, est_sellable_qty: 50, comparison_price_cents: 10000, vendor_msrp_cents: 10000, pace_target_units_per_week: 10 }
              as: SourcingBuyer
              as_user_id: buyer-1
              captures: { lot1: $.data.id, landed_prov: $.data.landed_unit_cost_cents }
            - call: "POST /lots/${lot1}/screenings"
              payload: {}
              as: SafetyOfficer
              as_user_id: so-1
              captures: { scr1: $.data.id }
          trigger:
            - call: "POST /lots/${lot1}/screenings/${scr1}/complete"
              payload: { recall_check: "PASS", expiration_check: "PASS", condition_verified: true, qty_grade_a: 50, qty_grade_b: 20, qty_grade_c: 30 }
              as: SafetyOfficer
              as_user_id: so-1
            - call: "GET /lots/${lot1}"
              payload: {}
              as: Admin
              captures: { landed_final: $.data.landed_unit_cost_cents }
          assert:
            - "${landed_prov} == 2000 (provisional: round_half_up(100000/50))"
            - "${landed_final} == 1190 (final: round_half_up(100000/84), effective = 50*1.0 + 20*0.8 + 30*0.6 = 84)"
            - "BuyLot.${lot1}.sellable_qty_confirmed == 100"
            - "BuyLot.${lot1}.commercial_status == CLEARED and safety_status == CLEARED"

      - name: member_price_event_vs_standard_variant
        grounds:
          - calculations.member_price
          - entities.Purchase.fields.pricing_variant
          - state_machines.EarlyAccessEvent.SCHEDULED_to_ACTIVE
        distinguishing_aspect: |
          Dual-variant pricing on the Purchase domain (distinct from BuyLot cost
          accounting): same member, lot, and qty price at 3400 cents/unit under
          the STANDARD variant and 3000 cents/unit under the EVENT variant once
          the early-access window activates.
        test_recipe:
          setup:
            - "CA store S1 with lot priced at retail 4000 and 60 units on hand"
            - "GOLD member M1; signage limit 10"
            - "Purchase P1 happens before the event window (STANDARD)"
            - "Event (min_tier GOLD, extra 10 pct) scheduled 2026-09-02T10:00 to 12:00 and clock advanced into the window"
          setup_api_calls:
            - call: "POST /jurisdiction-rules"
              payload: { jurisdiction_code: "CA", comparison_rule: "WAS_NOW_WINDOW", window_days: 90, required_offer_days: 30, max_advertised_discount_pct: 70, member_discount_cap_pct: 30 }
              as: PricingLead
              captures: { jur_ca: $.data.id }
            - call: "POST /vendors"
              payload: { name: "Acme Closeouts", vendor_code: "ACME" }
              as: SourcingBuyer
              as_user_id: buyer-1
              captures: { ven1: $.data.id }
            - call: "POST /stores"
              payload: { name: "Store One", store_code: "S1", jurisdiction_id: "${jur_ca}", performance_tier: "TIER_1" }
              as: Admin
              captures: { st1: $.data.id, st1_v: $.data.version }
            - call: "POST /lots"
              payload: { vendor_id: "${ven1}", home_jurisdiction_id: "${jur_ca}", title: "Widget Lot", source_type: "MFR_OVERRUN", condition_grade: "A", quantity_total: 100, total_cost_cents: 100000, est_sellable_qty: 50, comparison_price_cents: 10000, vendor_msrp_cents: 10000, pace_target_units_per_week: 10 }
              as: SourcingBuyer
              as_user_id: buyer-1
              captures: { lot1: $.data.id }
            - call: "POST /lots/${lot1}/screenings"
              payload: {}
              as: SafetyOfficer
              as_user_id: so-1
              captures: { scr1: $.data.id }
            - call: "POST /lots/${lot1}/screenings/${scr1}/complete"
              payload: { recall_check: "PASS", expiration_check: "PASS", condition_verified: true, qty_grade_a: 50, qty_grade_b: 20, qty_grade_c: 30 }
              as: SafetyOfficer
              as_user_id: so-1
            - call: "POST /lots/${lot1}/price"
              payload: { retail_price_cents: 4000, advertises_comparison: true }
              as: PricingLead
            - call: "POST /lots/${lot1}/allocations"
              payload: { store_id: "${st1}", qty_requested: 60 }
              as: AllocationManager
              captures: { al1: $.data.id }
            - call: "POST /lots/${lot1}/allocations/commit"
              payload: {}
              as: AllocationManager
            - call: "POST /lots/${lot1}/allocations/${al1}/ship"
              payload: {}
              as: AllocationManager
            - call: "POST /lots/${lot1}/allocations/${al1}/receive"
              payload: {}
              as: AllocationManager
            - call: "POST /stores/${st1}/aisle-assignments"
              payload: { lot_id: "${lot1}", aisle_code: "A1", daily_unit_limit: 10, expected_store_version: "${st1_v}" }
              as: StoreManager
            - call: "POST /members"
              payload: { member_code: "M-GOLD", tier: "GOLD", home_store_id: "${st1}" }
              as: Anonymous
              captures: { mem1: $.data.id }
            - call: "POST /lots/${lot1}/early-access-events"
              payload: { starts_at: "2026-09-02T10:00:00Z", ends_at: "2026-09-02T12:00:00Z", min_tier: "GOLD", extra_discount_pct: 10 }
              as: PricingLead
              captures: { ev1: $.data.id }
          trigger:
            - call: "POST /stores/${st1}/purchases"
              payload: { lot_id: "${lot1}", qty: 2, member_id: "${mem1}" }
              as: ClubMember
              as_user_id: "${mem1}"
              captures: { unit_std: $.data.unit_price_cents, total_std: $.data.line_total_cents, variant_std: $.data.pricing_variant }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T11:00:00Z" }
              as: Admin
            - call: "POST /stores/${st1}/purchases"
              payload: { lot_id: "${lot1}", qty: 2, member_id: "${mem1}" }
              as: ClubMember
              as_user_id: "${mem1}"
              captures: { unit_evt: $.data.unit_price_cents, total_evt: $.data.line_total_cents, variant_evt: $.data.pricing_variant }
          assert:
            - "${variant_std} == STANDARD and ${unit_std} == 3400 and ${total_std} == 6800 (GOLD 15 pct off 4000)"
            - "${variant_evt} == EVENT and ${unit_evt} == 3000 and ${total_evt} == 6000 (15 + 10 = 25 pct off 4000)"
            - "EarlyAccessEvent.${ev1}.status == ACTIVE at the second purchase"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: advertised_price_legality_branching
        grounds:
          - calculations.advertised_price_legality
          - "validations[priority=17]"
          - "validations[priority=18]"
          - "validations[priority=19]"
          - "validations[priority=20]"
        distinguishing_aspect: |
          Mode (a): >=3 inputs with conditional branches on the jurisdiction's
          comparison_rule — WAS_NOW_WINDOW enforces the anchor premium first and
          the discount depth second; MSRP_REFERENCE enforces MSRP equality;
          COMPARISON_PROHIBITED forbids comparison advertising entirely.
        test_recipe:
          setup:
            - "CA jurisdiction (WAS_NOW_WINDOW, max discount 70) and TX jurisdiction (MSRP_REFERENCE) exist"
            - "Lot A cleared in CA with comparison 10000 / msrp 10000; Lot B cleared in TX with comparison 9000 but msrp 10000"
          setup_api_calls:
            - call: "POST /jurisdiction-rules"
              payload: { jurisdiction_code: "CA", comparison_rule: "WAS_NOW_WINDOW", window_days: 90, required_offer_days: 30, max_advertised_discount_pct: 70, member_discount_cap_pct: 30 }
              as: PricingLead
              captures: { jur_ca: $.data.id }
            - call: "POST /jurisdiction-rules"
              payload: { jurisdiction_code: "TX", comparison_rule: "MSRP_REFERENCE", max_advertised_discount_pct: 90, member_discount_cap_pct: 40 }
              as: PricingLead
              captures: { jur_tx: $.data.id }
            - call: "POST /vendors"
              payload: { name: "Acme Closeouts", vendor_code: "ACME" }
              as: SourcingBuyer
              as_user_id: buyer-1
              captures: { ven1: $.data.id }
            - call: "POST /lots"
              payload: { vendor_id: "${ven1}", home_jurisdiction_id: "${jur_ca}", title: "Lot A", source_type: "PACKAGE_CHANGE", condition_grade: "A", quantity_total: 100, total_cost_cents: 100000, est_sellable_qty: 50, comparison_price_cents: 10000, vendor_msrp_cents: 10000, pace_target_units_per_week: 10 }
              as: SourcingBuyer
              as_user_id: buyer-1
              captures: { lotA: $.data.id }
            - call: "POST /lots"
              payload: { vendor_id: "${ven1}", home_jurisdiction_id: "${jur_tx}", title: "Lot B", source_type: "MFR_OVERRUN", condition_grade: "B", quantity_total: 10, total_cost_cents: 9000, est_sellable_qty: 10, comparison_price_cents: 9000, vendor_msrp_cents: 10000, pace_target_units_per_week: 10 }
              as: SourcingBuyer
              as_user_id: buyer-1
              captures: { lotB: $.data.id }
            - call: "POST /lots/${lotA}/screenings"
              payload: {}
              as: SafetyOfficer
              as_user_id: so-1
              captures: { scrA: $.data.id }
            - call: "POST /lots/${lotA}/screenings/${scrA}/complete"
              payload: { recall_check: "PASS", expiration_check: "NA", condition_verified: true, qty_grade_a: 100, qty_grade_b: 0, qty_grade_c: 0 }
              as: SafetyOfficer
              as_user_id: so-1
            - call: "POST /lots/${lotB}/screenings"
              payload: {}
              as: SafetyOfficer
              as_user_id: so-1
              captures: { scrB: $.data.id }
            - call: "POST /lots/${lotB}/screenings/${scrB}/complete"
              payload: { recall_check: "PASS", expiration_check: "PASS", condition_verified: true, qty_grade_a: 0, qty_grade_b: 10, qty_grade_c: 0 }
              as: SafetyOfficer
              as_user_id: so-1
          trigger:
            - call: "POST /lots/${lotA}/price"
              payload: { retail_price_cents: 2000, advertises_comparison: true }
              as: PricingLead
              captures: { err1: $.data.error_id }
            - call: "POST /lots/${lotA}/price"
              payload: { retail_price_cents: 9000, advertises_comparison: true }
              as: PricingLead
              captures: { err2: $.data.error_id }
            - call: "POST /lots/${lotB}/price"
              payload: { retail_price_cents: 5000, advertises_comparison: true }
              as: PricingLead
              captures: { err3: $.data.error_id }
            - call: "POST /lots/${lotA}/price"
              payload: { retail_price_cents: 4000, advertises_comparison: true }
              as: PricingLead
          assert:
            - "${err1} == ERR_ADVERTISED_DISCOUNT_TOO_DEEP (discount 80 pct > 70; anchor 2400 <= 10000 passes first)"
            - "${err2} == ERR_ANCHOR_PREMIUM_INSUFFICIENT (anchor round(9000*1.2)=10800 > 10000; anchor checked before discount)"
            - "${err3} == ERR_COMPARISON_NOT_MSRP (9000 != 10000 under MSRP_REFERENCE)"
            - "final price attempt succeeds: BuyLot.${lotA}.commercial_status == PRICED and retail_price_cents == 4000"

      - name: member_price_nested_rounding_order
        grounds:
          - calculations.member_price
          - entities.Purchase.fields.unit_price_cents
          - entities.Purchase.fields.line_total_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned per-unit-first — with retail
          3999 and 20 pct off, per-unit rounding yields 3199 and a line total of
          9597, whereas line-level rounding would yield 9598; the scaffold pins 9597.
        test_recipe:
          setup:
            - "CA store S1 with lot priced at retail 3999 (comparison 4800), 60 units on hand"
            - "SILVER member M2; event active with extra_discount_pct 10 (combined 20 pct, under cap 30)"
            - "signage limit 10"
          setup_api_calls:
            - call: "POST /jurisdiction-rules"
              payload: { jurisdiction_code: "CA", comparison_rule: "WAS_NOW_WINDOW", window_days: 90, required_offer_days: 30, max_advertised_discount_pct: 70, member_discount_cap_pct: 30 }
              as: PricingLead
              captures: { jur_ca: $.data.id }
            - call: "POST /vendors"
              payload: { name: "Acme Closeouts", vendor_code: "ACME" }
              as: SourcingBuyer
              as_user_id: buyer-1
              captures: { ven1: $.data.id }
            - call: "POST /stores"
              payload: { name: "Store One", store_code: "S1", jurisdiction_id: "${jur_ca}", performance_tier: "TIER_1" }
              as: Admin
              captures: { st1: $.data.id, st1_v: $.data.version }
            - call: "POST /lots"
              payload: { vendor_id: "${ven1}", home_jurisdiction_id: "${jur_ca}", title: "Odd Price Lot", source_type: "MFR_OVERRUN", condition_grade: "A", quantity_total: 100, total_cost_cents: 50000, est_sellable_qty: 50, comparison_price_cents: 4800, vendor_msrp_cents: 4800, pace_target_units_per_week: 10 }
              as: SourcingBuyer
              as_user_id: buyer-1
              captures: { lot1: $.data.id }
            - call: "POST /lots/${lot1}/screenings"
              payload: {}
              as: SafetyOfficer
              as_user_id: so-1
              captures: { scr1: $.data.id }
            - call: "POST /lots/${lot1}/screenings/${scr1}/complete"
              payload: { recall_check: "PASS", expiration_check: "PASS", condition_verified: true, qty_grade_a: 100, qty_grade_b: 0, qty_grade_c: 0 }
              as: SafetyOfficer
              as_user_id: so-1
            - call: "POST /lots/${lot1}/price"
              payload: { retail_price_cents: 3999, advertises_comparison: true }
              as: PricingLead
            - call: "POST /lots/${lot1}/allocations"
              payload: { store_id: "${st1}", qty_requested: 60 }
              as: AllocationManager
              captures: { al1: $.data.id }
            - call: "POST /lots/${lot1}/allocations/commit"
              payload: {}
              as: AllocationManager
            - call: "POST /lots/${lot1}/allocations/${al1}/ship"
              payload: {}
              as: AllocationManager
            - call: "POST /lots/${lot1}/allocations/${al1}/receive"
              payload: {}
              as: AllocationManager
            - call: "POST /stores/${st1}/aisle-assignments"
              payload: { lot_id: "${lot1}", aisle_code: "A1", daily_unit_limit: 10, expected_store_version: "${st1_v}" }
              as: StoreManager
            - call: "POST /members"
              payload: { member_code: "M-SILVER", tier: "SILVER", home_store_id: "${st1}" }
              as: Anonymous
              captures: { mem2: $.data.id }
            - call: "POST /lots/${lot1}/early-access-events"
              payload: { starts_at: "2026-09-02T10:00:00Z", ends_at: "2026-09-02T12:00:00Z", min_tier: "BRONZE", extra_discount_pct: 10 }
              as: PricingLead
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T11:00:00Z" }
              as: Admin
          trigger:
            - call: "POST /stores/${st1}/purchases"
              payload: { lot_id: "${lot1}", qty: 3, member_id: "${mem2}" }
              as: ClubMember
              as_user_id: "${mem2}"
              captures: { unit_p: $.data.unit_price_cents, total_p: $.data.line_total_cents, pct_p: $.data.discount_pct_applied }
          assert:
            - "${pct_p} == 20 (SILVER 10 + event extra 10)"
            - "${unit_p} == 3199 (round_half_up(3999 * 80 / 100) = round_half_up(3199.2))"
            - "${total_p} == 9597 (3199 * 3; NOT 9598 which line-level rounding would give)"

      - name: pacing_evaluation_order_eligibility_gate
        grounds:
          - calculations.sell_through_pacing
          - state_machines.BuyLot.ON_SALE_to_DISPOSITION_REVIEW
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned by evaluation order —
          selling_days is computed first and gates eligibility, so at 2 selling
          days with zero sales the lot stays ON_SALE even though 0 * 2 < target,
          and only at 3 selling days does the same ratio flip it to
          DISPOSITION_REVIEW.
        test_recipe:
          setup:
            - "Lot ON_SALE since 2026-09-01T00:00:00Z with pace_target_units_per_week 10 and zero sales"
          setup_api_calls:
            - call: "POST /jurisdiction-rules"
              payload: { jurisdiction_code: "CA", comparison_rule: "WAS_NOW_WINDOW", window_days: 90, required_offer_days: 30, max_advertised_discount_pct: 70, member_discount_cap_pct: 30 }
              as: PricingLead
              captures: { jur_ca: $.data.id }
            - call: "POST /vendors"
              payload: { name: "Acme Closeouts", vendor_code: "ACME" }
              as: SourcingBuyer
              as_user_id: buyer-1
              captures: { ven1: $.data.id }
            - call: "POST /stores"
              payload: { name: "Store One", store_code: "S1", jurisdiction_id: "${jur_ca}", performance_tier: "TIER_1" }
              as: Admin
              captures: { st1: $.data.id }
            - call: "POST /lots"
              payload: { vendor_id: "${ven1}", home_jurisdiction_id: "${jur_ca}", title: "Slow Lot", source_type: "INSURANCE_SALVAGE", condition_grade: "B", quantity_total: 100, total_cost_cents: 100000, est_sellable_qty: 100, comparison_price_cents: 10000, vendor_msrp_cents: 10000, pace_target_units_per_week: 10 }
              as: SourcingBuyer
              as_user_id: buyer-1
              captures: { lot1: $.data.id }
            - call: "POST /lots/${lot1}/screenings"
              payload: {}
              as: SafetyOfficer
              as_user_id: so-1
              captures: { scr1: $.data.id }
            - call: "POST /lots/${lot1}/screenings/${scr1}/complete"
              payload: { recall_check: "PASS", expiration_check: "PASS", condition_verified: true, qty_grade_a: 100, qty_grade_b: 0, qty_grade_c: 0 }
              as: SafetyOfficer
              as_user_id: so-1
            - call: "POST /lots/${lot1}/price"
              payload: { retail_price_cents: 4000, advertises_comparison: true }
              as: PricingLead
            - call: "POST /lots/${lot1}/allocations"
              payload: { store_id: "${st1}", qty_requested: 60 }
              as: AllocationManager
              captures: { al1: $.data.id }
            - call: "POST /lots/${lot1}/allocations/commit"
              payload: {}
              as: AllocationManager
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: Admin
            - call: "GET /lots/${lot1}"
              payload: {}
              as: Admin
              captures: { status_day2: $.data.commercial_status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00Z" }
              as: Admin
            - call: "GET /lots/${lot1}"
              payload: {}
              as: Admin
              captures: { status_day3: $.data.commercial_status }
          assert:
            - "${status_day2} == ON_SALE (selling_days = 2 < MIN_SELLING_DAYS 3: not yet eligible despite 0 sales)"
            - "${status_day3} == DISPOSITION_REVIEW (selling_days = 3 and 0 * 2 < 10)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: lot_condition_failure_regrade_loop
        grounds:
          - state_machines.BuyLot.SCREENING_to_SOURCED
          - state_machines.BuyLot.SOURCED_to_SCREENING
          - entities.SafetyScreening.fields.round_number
        distinguishing_aspect: |
          Cyclic machine on BuyLot: SOURCED -> SCREENING -> (FAILED_CONDITION)
          -> regrade -> SOURCED -> SCREENING -> CLEARED; the loop is observable
          via screening round_number incrementing to 2 and safety_status
          resetting to PENDING_SCREEN between rounds.
        test_recipe:
          setup:
            - "Lot with quantity_total 100 created by buyer-1"
            - "Round 1 completed with condition_verified=false (FAILED_CONDITION), recall and expiration PASS"
          setup_api_calls:
            - call: "POST /jurisdiction-rules"
              payload: { jurisdiction_code: "CA", comparison_rule: "WAS_NOW_WINDOW", window_days: 90, required_offer_days: 30, max_advertised_discount_pct: 70, member_discount_cap_pct: 30 }
              as: PricingLead
              captures: { jur_ca: $.data.id }
            - call: "POST /vendors"
              payload: { name: "Acme Closeouts", vendor_code: "ACME" }
              as: SourcingBuyer
              as_user_id: buyer-1
              captures: { ven1: $.data.id }
            - call: "POST /lots"
              payload: { vendor_id: "${ven1}", home_jurisdiction_id: "${jur_ca}", title: "Salvage Lot", source_type: "INSURANCE_SALVAGE", condition_grade: "A", quantity_total: 100, total_cost_cents: 100000, est_sellable_qty: 100, comparison_price_cents: 10000, vendor_msrp_cents: 10000, pace_target_units_per_week: 10 }
              as: SourcingBuyer
              as_user_id: buyer-1
              captures: { lot1: $.data.id }
            - call: "POST /lots/${lot1}/screenings"
              payload: {}
              as: SafetyOfficer
              as_user_id: so-1
              captures: { scr1: $.data.id, round1: $.data.round_number }
            - call: "POST /lots/${lot1}/screenings/${scr1}/complete"
              payload: { recall_check: "PASS", expiration_check: "PASS", condition_verified: false, qty_grade_a: 40, qty_grade_b: 30, qty_grade_c: 30 }
              as: SafetyOfficer
              as_user_id: so-1
              captures: { result1: $.data.result }
          trigger:
            - call: "POST /lots/${lot1}/regrade"
              payload: { condition_grade: "MIXED" }
              as: SourcingBuyer
              as_user_id: buyer-1
              captures: { status_regraded: $.data.commercial_status, safety_regraded: $.data.safety_status }
            - call: "POST /lots/${lot1}/screenings"
              payload: {}
              as: SafetyOfficer
              as_user_id: so-1
              captures: { scr2: $.data.id, round2: $.data.round_number }
            - call: "POST /lots/${lot1}/screenings/${scr2}/complete"
              payload: { recall_check: "PASS", expiration_check: "PASS", condition_verified: true, qty_grade_a: 40, qty_grade_b: 30, qty_grade_c: 30 }
              as: SafetyOfficer
              as_user_id: so-1
