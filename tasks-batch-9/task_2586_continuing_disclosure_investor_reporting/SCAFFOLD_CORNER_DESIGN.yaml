      - name: late_filing_count_is_monotone_while_delinquent_cycle_count_is_live
        claim_type: aggregation
        grounds:
          - calculations.undertaking_delinquency_counters
          - calculations.undertaking_disclosure_risk_score
        distinguishing_aspect: >-
          The three counters that feed the risk score have DIFFERENT reversal semantics on the very
          same undertaking: late_filing_count is a running total over recorded FailureToFileEvent
          rows and therefore never decreases, while delinquent_cycle_count is a live COUNT over
          current cycle statuses and drops the instant the cycle leaves DELINQUENT. Assembling the
          delinquent cycle must lower the score without erasing the recorded failure, so an
          implementation that recomputes both from live state (or freezes both at first
          computation) lands on the wrong score, the wrong tier and the wrong posture.
        test_recipe:
          setup:
            - "One OUTSTANDING BondIssue with an ACTIVE Undertaking (FYE 06-30) and a single 10000-bp OPERATING_DATA_TABLE requirement."
            - "One FY2026 cycle (period 2025-07-01..2026-06-30, due 2027-01-26) left in DRAFTING."
          setup_api_calls:
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CIVICCENTER", series_designation: "2026A", security_type: "REVENUE", dated_date: "2024-04-01", final_maturity_date: "2056-04-01", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_id: "$.data.id" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue_id}", fiscal_year_end_month_day: "06-30" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_id: "$.data.id", score0: "$.data.disclosure_risk_score", tier0: "$.data.remediation_tier", posture0: "$.data.compliance_posture" }
            - call: "POST /disclosure/content-requirements"
              payload: { undertaking_id: "${und_id}", kind: "OPERATING_DATA_TABLE", label: "Operating Data Tables", weight_bp: 10000 }
              as: DisclosureOfficer
              as_user_id: "off-prep"
            - call: "POST /disclosure/annual-report-cycles"
              payload: { undertaking_id: "${und_id}", fiscal_year_label: "FY2026", period_start_date: "2025-07-01", period_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { cycle_id: "$.data.id", due: "$.data.due_date" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-01T00:00:00Z" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { clock1: "$.data.current_utc" }
            - call: "POST /disclosure/calendar-sweeps"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { swept_delinquent: "$.data.delinquent_cycle_count", swept_failures: "$.data.failure_event_created_count", swept_matured: "$.data.matured_issue_count" }
            - call: "GET /disclosure/undertakings/${und_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { late_a: "$.data.late_filing_count", missed_a: "$.data.missed_event_count", delq_a: "$.data.delinquent_cycle_count", score_a: "$.data.disclosure_risk_score", tier_a: "$.data.remediation_tier", posture_a: "$.data.compliance_posture" }
            - call: "GET /disclosure/failure-to-file-events?undertaking_id=${und_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { fail_kind: "$.data[0].kind", fail_sev: "$.data[0].severity", fail_days: "$.data[0].days_late", fail_total: "$.total_count" }
            - call: "GET /disclosure/cycle-content-items?cycle_id=${cycle_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { item_id: "$.data[0].id" }
            - call: "PATCH /disclosure/cycle-content-items/${item_id}"
              payload: { data_as_of_date: "2026-06-30", source_document_ref: "OPDATA-FY2026.xlsx" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
            - call: "POST /disclosure/cycle-content-items/${item_id}/attest"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
            - call: "POST /disclosure/annual-report-cycles/${cycle_id}/assemble"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-asm"
              captures: { cyc_status: "$.data.status" }
            - call: "GET /disclosure/undertakings/${und_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { late_b: "$.data.late_filing_count", delq_b: "$.data.delinquent_cycle_count", score_b: "$.data.disclosure_risk_score", tier_b: "$.data.remediation_tier", posture_b: "$.data.compliance_posture", status_b: "$.data.status" }
            - call: "GET /disclosure/failure-to-file-events?undertaking_id=${und_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { fail_total_after: "$.total_count", fail_status_after: "$.data[0].status" }
          assert:
            - "${score0} == 0.0, ${tier0} == TIER_0 and ${posture0} == COMPLIANT on a fresh undertaking"
            - "${due} == \"2027-01-26\" and ${clock1} echoes 2027-02-01T00:00:00Z"
            - "${swept_delinquent} == 1, ${swept_failures} == 1, ${swept_matured} == 0"
            - "${fail_total} == 1 with ${fail_kind} == ANNUAL_REPORT_MISSED, ${fail_sev} == MAJOR and ${fail_days} == 6 (2027-01-26 to 2027-02-01)"
            - "${late_a} == 1, ${missed_a} == 0, ${delq_a} == 1 — an ANNUAL_REPORT_MISSED failure belongs to late_filing_count, NOT to missed_event_count, which only counts MATERIAL_EVENT_MISSED"
            - "${score_a} == 27.00 — base 12*1 + 20*0 + 15*1 = 27, times the prior TIER_0 multiplier 1.00"
            - "${tier_a} == TIER_1 and ${posture_a} == DELINQUENT — the posture is forced by delinquent_cycle_count >= 1, not by the score band"
            - "${cyc_status} == READY_TO_FILE"
            - "${delq_b} == 0 — the live counter releases the moment the cycle leaves DELINQUENT"
            - "${late_b} == 1 — the monotone counter does NOT release; the recorded failure survives the recovery"
            - "${score_b} == 13.20 — base 12*1 + 0 + 0 = 12, times the PERSISTED prior tier multiplier 1.10"
            - "${tier_b} == TIER_0 and ${posture_b} == COMPLIANT — the score fell out of the WATCH band and no delinquent cycle remains"
            - "${status_b} == ACTIVE — the undertaking's own lifecycle status never moved while its posture went COMPLIANT -> DELINQUENT -> COMPLIANT"
            - "${fail_total_after} == 1 and ${fail_status_after} == OPEN — recovery neither deletes nor closes the failure event; only remediation does"

