  # ==========================================================================
  # Section: consistency_model
  # ==========================================================================
  - section: consistency_model
    instances:
      - name: completion_effects_visible_immediately
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - state_machines.BookingRequest.CONFIRMED_to_COMPLETED
        distinguishing_aspect: "Immediate consistency: the complete response's FlightLeg and a follow-up GET of the share/aircraft reflect the reconciliation (hours delta, total_hours_flown) with no delay."
        test_recipe:
          setup: ["Owner with ACTIVE 1/4 MID share; booking est 2.00h confirmed+assigned; completed with actual 2.50h"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "FJX-CM1", currency: "USD", contract_year_start_month: 8, peak_day_calendar: [] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /aircraft-classes"
              payload: { program_id: "${prog_id}", class_code: "MID", hourly_rate_cents: 450000, interchange_upgrade_multiplier_bp: 12500, monthly_fee_base_cents: 2500000, seats: 8 }
              as: ProgramAdmin
              captures: { cls_mid: $.data.id }
            - call: "POST /owners"
              payload: { program_id: "${prog_id}", legal_name: "CM1 Owner", initial_deposit_cents: 0 }
              as: ProgramAdmin
              captures: { own_id: $.data.id }
            - call: "POST /shares"
              payload: { owner_id: "${own_id}", class_id: "${cls_mid}", fraction_numerator: 1, fraction_denominator: 4, purchase_price_cents: 24000000, schedule_method: "STRAIGHT_LINE", recovery_years: 5 }
              as: ProgramAdmin
              captures: { share_id: $.data.id }
            - call: "POST /shares/${share_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { share_v: $.data.version }
            - call: "POST /aircraft"
              payload: { program_id: "${prog_id}", tail_number: "N888CM", class_id: "${cls_mid}" }
              as: FleetOps
              captures: { tail_id: $.data.id }
            - call: "POST /bookings"
              payload: { share_id: "${share_id}", requested_class_id: "${cls_mid}", scheduled_departure_utc: "2026-09-10T15:00:00Z", estimated_block_hours: 2.00, expected_share_version: "${share_v}" }
              as: Owner
              as_user_id: "${own_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/confirm"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
            - call: "POST /bookings/${bk_id}/assign"
              payload: { aircraft_id: "${tail_id}" }
              as: FleetOps
          trigger:
            - call: "POST /bookings/${bk_id}/complete"
              payload: { actual_block_hours: 2.50 }
              as: FleetOps
              captures: { leg_id: $.data.id }
            - call: "GET /shares/${share_id}"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
              captures: { hrs: $.data.hours_remaining_cy }
            - call: "GET /aircraft/${tail_id}"
              payload: {}
              as: FleetOps
              captures: { flown: $.data.total_hours_flown }
          assert:
            - "Share.hours_remaining_cy == 199.50 immediately (200.00 − 2.50 actual after delta reconciliation)"
            - "Aircraft.total_hours_flown == 2.50 immediately"
            - "BookingRequest.${bk_id}.billing_status == FINALLY_BILLED in the same read epoch"
