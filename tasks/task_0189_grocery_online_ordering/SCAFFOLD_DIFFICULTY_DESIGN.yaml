  - rule_id: boundary_precision_check
    instances:
      - name: bpc_slot_capacity_strict_less_than
        grounds:
          - calculations.slot_capacity
          - validations[priority=6]
          - state_machines.FulfillmentSlot.OPEN_to_FULL
          - entities.FulfillmentSlot.fields.booked_count
        distinguishing_aspect: |
          Numeric threshold metric on POST /v1/orders: placement admitted iff booked_count < capacity (strict <).
          With capacity 1, the first placement (booked_count 0 < 1) succeeds and drives booked_count to 1 / slot
          FULL; the second placement (booked_count 1, not < 1) is rejected ERR_SLOT_FULL. Distinct metric and
          endpoint from the cold-chain temporal boundary.
        test_recipe:
          setup:
            - "Store, two Customers C1/C2, slot cap 1, UNIT product A(349)."
            - "C1 places an order on the slot (booked_count 0 -> 1, slot FULL, slot.version 1 -> 2)."
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { name: "S", ebt_enabled: true }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /v1/customers"
              payload: { email: "c11a@x.com", full_name: "C1", date_of_birth: "1990-01-01" }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /v1/customers"
              payload: { email: "c11b@x.com", full_name: "C2", date_of_birth: "1990-01-01" }
              as: PlatformAdmin
              captures: { c2_id: $.data.id }
            - call: "POST /v1/products"
              payload: { store_id: "${s_id}", sku: "A", name: "A", pricing_mode: "UNIT", unit_price_cents: 349 }
              as: StoreOps
              captures: { a_id: $.data.id }
            - call: "POST /v1/slots"
              payload: { store_id: "${s_id}", slot_type: "PICKUP", window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T11:00:00Z", capacity: 1 }
              as: StoreOps
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /v1/orders"
              payload: { store_id: "${s_id}", customer_id: "${c1_id}", slot_id: "${slot_id}", expected_slot_version: "${slot_v}", lines: [ { product_id: "${a_id}", requested_qty: 1 } ] }
              as: Customer
              as_user_id: "${c1_id}"
              captures: { o1_id: $.data.id }
            - call: "GET /v1/slots/${slot_id}"
              payload: {}
              as: StoreOps
              captures: { slot_v2: $.data.version, slot_status: $.data.status }
          trigger:
            - call: "POST /v1/orders"
              payload: { store_id: "${s_id}", customer_id: "${c2_id}", slot_id: "${slot_id}", expected_slot_version: "${slot_v2}", lines: [ { product_id: "${a_id}", requested_qty: 1 } ] }
              as: Customer
              as_user_id: "${c2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_SLOT_FULL"
            - "FulfillmentSlot.${slot_id}.booked_count == 1"
            - "FulfillmentSlot.${slot_id}.status == FULL"

