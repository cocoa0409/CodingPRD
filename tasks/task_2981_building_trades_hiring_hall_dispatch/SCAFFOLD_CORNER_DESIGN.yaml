              captures: { ref_total: $.meta.total_count }
          assert:
            - "${jr_v1} == 1 and ${jr_open1} == 3; the first issuance sends ${ref1_member} == ${m_tova_id}"
            - "${jr_v2} == 2 and ${jr_open2} == 2 — every successful write increments version by exactly 1"
            - "HTTP 412 with ${err} == ERR_STALE_JOB_REQUEST_VERSION when version 1 is replayed"
            - "${jr_v_after_412} == 2 and ${jr_open_after_412} == 2 — the rejected replay neither bumped the version nor consumed a slot"
            - "The refreshed call returns 201 with ${ref2_member} == ${m_uri_id}, ${jr_v3} == 3 and ${ref_total} == 2"
      - name: cascading_side_effect_chains_are_already_walked_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: contractor_delinquency_withdrawal_cascade_depth_four
          rationale: "That §1.8 instance walks the full Contractor -> JobRequest -> Referral -> Registration -> OutOfWorkList chain and asserts every level plus the ledger, and three_strike_refusal_cascade_depth_four does the same for the refusal chain; a third walk in this section would re-assert the same depth with no new ordering claim."
      - name: dual_variant_calculations_are_already_diverged_and_reconciled
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.back_pay_make_whole.variants
          - calculations.dispatch_order_ranking.variants
        excluded_because:
          difficulty_instance: back_pay_variant_diverges_on_dispatch_status
          rationale: "Both variant pairs already have dedicated §1.8 instances — back_pay_variant_diverges_on_dispatch_status for the SCHEDULED_HOURS/ACTUAL_HOURS money delta and dispatch_order_variant_diverges_on_short_call for the ranking pair — and this file's calculations section adds the selection and reconciliation legs, so the layer is fully covered."
  - section: consistency_model
    instances:
      - name: every_effect_of_an_acceptance_is_visible_immediately
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints["POST /hiring-hall/referrals/{id}/accept"]
          - state_machines.Referral.ISSUED_to_ACCEPTED
        distinguishing_aspect: "The declared model is immediate, so the single accept response and the reads that follow it in the same test show every declared side effect already applied — dispatch created, referral ACCEPTED, registration DISPATCHED_OUT, list count decremented, request counters and version advanced and the ledger row appended — with no settling step anywhere."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00.000Z; GROUP_1 (requires 4000); ACTIVE policy; journeyworkers Wren Castellan (9000 h) and Yuki Ferrante (8000 h) registered, so registered_count is 2; SIGNATORY contractor files a LONG_CALL request for 2 journeyworkers with report_at 2026-09-25T07:00:00.000Z; the LIST_ORDER referral is issued to Wren."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: HallAdmin
            - call: "POST /hiring-hall/locals"
              payload: { local_number: 512, name: "Local 512 (home)", kind: "HOME", reciprocity_factor_bp: 0 }
              as: HallAdmin
              captures: { home_local_id: $.data.id }
            - call: "POST /hiring-hall/out-of-work-lists"
              payload: { group_code: "GROUP_1", priority_rank: 1, ordering_policy: "SENIORITY", requires_local_hours: 4000, accepts_travelers: false }
              as: HallAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /hiring-hall/ratio-policies"
              payload: { policy_code: "STD-2026", first_apprentice_at_jw_count: 1, then_every_n_jw: 4, effective_from: "2026-01-01T00:00:00.000Z" }
              as: HallAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /hiring-hall/members"
              payload: { full_name: "Wren Castellan", home_local_id: "${home_local_id}", classification: "JOURNEYWORKER", local_hours_in_trade: 9000 }
              as: HallAdmin
              captures: { m_wren_id: $.data.id }
            - call: "POST /hiring-hall/members"
              payload: { full_name: "Yuki Ferrante", home_local_id: "${home_local_id}", classification: "JOURNEYWORKER", local_hours_in_trade: 8000 }
              as: HallAdmin
              captures: { m_yuki_id: $.data.id }
            - call: "POST /hiring-hall/registrations"
              payload: { member_id: "${m_wren_id}", list_id: "${g1_id}" }
              as: Dispatcher
              captures: { reg_wren_id: $.data.id }
            - call: "POST /hiring-hall/registrations"
              payload: { member_id: "${m_yuki_id}", list_id: "${g1_id}" }
              as: Dispatcher
              captures: { reg_yuki_id: $.data.id }
            - call: "GET /hiring-hall/out-of-work-lists/${g1_id}"
              payload: {}
              as: Dispatcher
              captures: { list_count_before: $.data.registered_count }
            - call: "POST /hiring-hall/contractors"
              payload: { name: "Northline Mechanical", agreement_expires_at: "2027-06-30T00:00:00.000Z", signatory_status: "SIGNATORY" }
              as: HallAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hiring-hall/job-requests"
              payload: { contractor_id: "${c_id}", job_site: "Unit 4 Outage", journeyworkers_requested: 2, apprentices_requested: 0, expected_duration_days: 30, report_at: "2026-09-25T07:00:00.000Z", hourly_rate_cents: 5000 }
              as: ContractorRep
              as_user_id: "${c_id}"
              captures: { jr_id: $.data.id, jr_v1: $.data.version }
            - call: "POST /hiring-hall/job-requests/${jr_id}/referrals"
              payload: { slot_kind: "JOURNEYWORKER", referral_kind: "LIST_ORDER", expected_job_request_version: "${jr_v1}" }
              as: Dispatcher
              as_user_id: "disp-01"
              captures: { ref_id: $.data.id }
            - call: "GET /hiring-hall/job-requests/${jr_id}"
              payload: {}
              as: Dispatcher
              captures: { jr_v2: $.data.version, jr_accepted_before: $.data.accepted_journeyworker_count }
          trigger:
            - call: "POST /hiring-hall/referrals/${ref_id}/accept"
              payload: {}
              as: Member
              as_user_id: "${m_wren_id}"
              captures: { d_id: $.data.id, d_status: $.data.status, d_start: $.data.start_at, d_member: $.data.member_id, d_jr: $.data.job_request_id }
            - call: "GET /hiring-hall/referrals/${ref_id}"
              payload: {}
              as: Dispatcher
              captures: { ref_status_after: $.data.status }
            - call: "GET /hiring-hall/registrations/${reg_wren_id}"
              payload: {}
              as: Dispatcher
              captures: { reg_status_after: $.data.status }
            - call: "GET /hiring-hall/out-of-work-lists/${g1_id}"
              payload: {}
              as: Dispatcher
              captures: { list_count_after: $.data.registered_count }
            - call: "GET /hiring-hall/job-requests/${jr_id}"
              payload: {}
              as: Dispatcher
              captures: { jr_accepted_after: $.data.accepted_journeyworker_count, jr_open_after: $.data.open_journeyworker_slots, jr_status_after: $.data.status, jr_v3: $.data.version }
            - call: "GET /hiring-hall/ledger-entries"
              payload: { referral_id: "${ref_id}", event_code: "REFERRAL_ACCEPTED" }
              as: HallAdmin
              captures: { led_total: $.meta.total_count, led_recorded: "$.data[0].recorded_at" }
          assert:
            - "${list_count_before} == 2, ${jr_v2} == 2 and ${jr_accepted_before} == 0"
            - "The accept response itself already carries the finished dispatch: ${d_status} == WORKING, ${d_member} == ${m_wren_id}, ${d_jr} == ${jr_id} and ${d_start} == 2026-09-25T07:00:00.000Z"
            - "${ref_status_after} == ACCEPTED and ${reg_status_after} == DISPATCHED_OUT on the immediately following reads — no re-read delay is needed"
            - "${list_count_after} == 1, ${jr_accepted_after} == 1, ${jr_open_after} == 1, ${jr_status_after} == PARTIALLY_FILLED and ${jr_v3} == 3"
            - "${led_total} == 1 with ${led_recorded} == 2026-09-01T00:00:00.000Z — the audit row is written in the same transaction, not settled later"
