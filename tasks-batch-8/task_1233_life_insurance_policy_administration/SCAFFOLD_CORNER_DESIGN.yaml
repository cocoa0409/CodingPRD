scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: insured_person_creation_required_fields
        claim_type: creation
        grounds: [entities.InsuredPerson]
        distinguishing_aspect: "POST /insured-persons with all required fields returns 201 with system-stamped id, created_at, updated_at, version=1."
        test_recipe:
          setup: ["Empty DB; clock at default"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /insured-persons"
              payload: { full_name: "Carl C", date_of_birth: "1990-01-01T00:00:00Z", tobacco_user: false, gender: "MALE" }
              as: Agent
              captures: { ip_c: $.data.id, ip_c_ver: $.data.version }
          assert:
            - "response code == 201"
            - "InsuredPerson.${ip_c}.version == 1"
            - "InsuredPerson.${ip_c}.id is a UUID without type prefix"

      - name: insured_person_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.InsuredPerson]
        distinguishing_aspect: "Missing required date_of_birth returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /insured-persons"
              payload: { full_name: "NoDOB", tobacco_user: false, gender: "MALE" }
              as: Agent
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: policy_computed_field_paid_to_date_ignored_input
        claim_type: computed_fields
        grounds: [entities.Policy.fields.paid_to_date]
        distinguishing_aspect: "Policy.paid_to_date is computed; client-supplied value in any body is ignored."
        excluded_because:
          difficulty_instance: dual_variant_calc / coi_end_of_month_vs_beginning_of_month
          rationale: "Computed-field behavior exercised via cash_value_cents in the dual-variant CoI test."

      - name: entity_not_found_returns_404
        claim_type: not_found
        grounds: ["\"errors[ERR_POLICY_NOT_FOUND\"]"]
        distinguishing_aspect: "GET /policies/{unknown-uuid} returns ERR_POLICY_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /policies/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Agent
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_POLICY_NOT_FOUND"

      - name: pagination_defaults_applied_on_list
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "GET /policies without limit/offset returns the default pagination (limit=10, offset=0) and includes total_count and has_more."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /policies"
              payload: {}
              as: Agent
          assert:
            - "response has meta.api_request_id"
            - "response.response_type == 'array'"
            - "response.data is array"
            - "response includes limit, offset, total_count, has_more (default limit=10, offset=0)"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: approve_submitted_application_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.PolicyApplication]
        distinguishing_aspect: "POST /applications/{id}/approve from SUBMITTED (not UNDER_REVIEW) fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Application in SUBMITTED (no begin-review called)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insured-persons"
              payload: { full_name: "Dave D", date_of_birth: "1988-05-05T00:00:00Z", tobacco_user: false, gender: "MALE" }
              as: Agent
              captures: { ip_d: $.data.id }
            - call: "POST /product-templates"
              payload: { product_code: "WL-D", product_type: "WHOLE_LIFE_NON_PARTICIPATING", participating: false, allows_policy_loans: true, min_face_amount_cents: 1000000, max_face_amount_cents: 100000000, base_monthly_premium_rate_per_thousand_cents: 50, coi_rate_table: [], surrender_charge_schedule: [] }
              as: PlatformAdmin
              captures: { tpl_d: $.data.id }
            - call: "POST /applications"
              payload: { insured_person_id: "${ip_d}", product_template_id: "${tpl_d}", requested_face_amount_cents: 10000000, premium_mode: "MONTHLY" }
              as: Agent
              captures: { app_d: $.data.id }
          trigger:
            - call: "POST /applications/${app_d}/approve"
              payload: { underwriting_class: "STANDARD_NON_TOBACCO" }
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: decline_issued_application_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.PolicyApplication]
        distinguishing_aspect: "Once ISSUED (terminal), no further transitions possible."
        test_recipe:
          setup: ["Application ISSUED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insured-persons"
              payload: { full_name: "Erin E", date_of_birth: "1987-01-15T00:00:00Z", tobacco_user: false, gender: "FEMALE" }
              as: Agent
              captures: { ip_e: $.data.id }
            - call: "POST /product-templates"
              payload: { product_code: "WL-E", product_type: "WHOLE_LIFE_NON_PARTICIPATING", participating: false, allows_policy_loans: true, min_face_amount_cents: 1000000, max_face_amount_cents: 100000000, base_monthly_premium_rate_per_thousand_cents: 50, coi_rate_table: [], surrender_charge_schedule: [] }
              as: PlatformAdmin
              captures: { tpl_e: $.data.id }
            - call: "POST /applications"
              payload: { insured_person_id: "${ip_e}", product_template_id: "${tpl_e}", requested_face_amount_cents: 10000000, premium_mode: "MONTHLY" }
              as: Agent
              captures: { app_e: $.data.id }
            - call: "POST /applications/${app_e}/begin-review"
              payload: {}
              as: Underwriter
            - call: "POST /applications/${app_e}/approve"
              payload: { underwriting_class: "STANDARD_NON_TOBACCO" }
              as: Underwriter
            - call: "POST /applications/${app_e}/issue"
              payload: {}
              as: PolicyIssuer
          trigger:
            - call: "POST /applications/${app_e}/decline"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: repay_already_repaid_loan_returns_already_terminal
        claim_type: invalid_transition
        grounds: [state_machines.PolicyLoan, "\"errors[ERR_ALREADY_TERMINAL\"]"]
        distinguishing_aspect: "Repaying a REPAID loan returns ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["Loan originated and fully repaid"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insured-persons"
              payload: { full_name: "Frank F", date_of_birth: "1976-04-04T00:00:00Z", tobacco_user: false, gender: "MALE" }
              as: Agent
              captures: { ip_f: $.data.id }
            - call: "POST /product-templates"
              payload: { product_code: "WL-F", product_type: "WHOLE_LIFE_NON_PARTICIPATING", participating: false, allows_policy_loans: true, min_face_amount_cents: 1000000, max_face_amount_cents: 100000000, base_monthly_premium_rate_per_thousand_cents: 50, coi_rate_table: [], surrender_charge_schedule: [] }
              as: PlatformAdmin
              captures: { tpl_f: $.data.id }
            - call: "POST /applications"
              payload: { insured_person_id: "${ip_f}", product_template_id: "${tpl_f}", requested_face_amount_cents: 10000000, premium_mode: "ANNUAL" }
              as: Agent
              captures: { app_f: $.data.id }
            - call: "POST /applications/${app_f}/begin-review"
              payload: {}
              as: Underwriter
            - call: "POST /applications/${app_f}/approve"
              payload: { underwriting_class: "STANDARD_NON_TOBACCO" }
              as: Underwriter
            - call: "POST /applications/${app_f}/issue"
              payload: {}
              as: PolicyIssuer
              captures: { pol_f: $.data.id }
            - call: "POST /policies/${pol_f}/premium-payments"
              payload: { amount_cents: 10000000 }
              as: Agent
            - call: "POST /policies/${pol_f}/loans"
              payload: { requested_amount_cents: 1000000 }
              as: Policyholder
              as_user_id: "${ip_f}"
              captures: { loan_f: $.data.id }
            - call: "POST /policies/${pol_f}/loans/${loan_f}/repayments"
              payload: { amount_cents: 2000000 }
              as: Policyholder
              as_user_id: "${ip_f}"
          trigger:
            - call: "POST /policies/${pol_f}/loans/${loan_f}/repayments"
              payload: { amount_cents: 100 }
              as: Policyholder
              as_user_id: "${ip_f}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ALREADY_TERMINAL"

      - name: terminal_rider_terminate_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Rider]
        distinguishing_aspect: "Terminating an EXERCISED rider fails (terminal state lockdown)."
        test_recipe:
          setup: ["Policy with WAIVER_OF_PREMIUM rider EXERCISED (policy CURRENT, rider exercised)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insured-persons"
              payload: { full_name: "Grace G", date_of_birth: "1983-09-09T00:00:00Z", tobacco_user: false, gender: "FEMALE" }
              as: Agent
              captures: { ip_g: $.data.id }
            - call: "POST /product-templates"
              payload: { product_code: "WL-G", product_type: "WHOLE_LIFE_NON_PARTICIPATING", participating: false, allows_policy_loans: false, min_face_amount_cents: 1000000, max_face_amount_cents: 100000000, base_monthly_premium_rate_per_thousand_cents: 50, coi_rate_table: [], surrender_charge_schedule: [] }
              as: PlatformAdmin
              captures: { tpl_g: $.data.id }
            - call: "POST /applications"
              payload: { insured_person_id: "${ip_g}", product_template_id: "${tpl_g}", requested_face_amount_cents: 10000000, premium_mode: "MONTHLY" }
              as: Agent
              captures: { app_g: $.data.id }
            - call: "POST /applications/${app_g}/begin-review"
              payload: {}
              as: Underwriter
            - call: "POST /applications/${app_g}/approve"
              payload: { underwriting_class: "STANDARD_NON_TOBACCO" }
              as: Underwriter
            - call: "POST /applications/${app_g}/issue"
              payload: {}
              as: PolicyIssuer
              captures: { pol_g: $.data.id }
            - call: "POST /policies/${pol_g}/riders"
              payload: { rider_type: "WAIVER_OF_PREMIUM", rider_face_amount_cents: 0 }
              as: Agent
              captures: { rider_g: $.data.id }
            - call: "POST /policies/${pol_g}/riders/${rider_g}/exercise"
              payload: {}
              as: Agent
          trigger:
            - call: "POST /policies/${pol_g}/riders/${rider_g}/terminate"
              payload: {}
              as: Agent
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ALREADY_TERMINAL"

      - name: policy_initial_state_is_current_in_force
        claim_type: initial_state
        grounds: [state_machines.Policy]
        distinguishing_aspect: "A newly issued policy starts in premium_payment_status=CURRENT, form_status=IN_FORCE."
        test_recipe:
          setup: ["Application approved"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insured-persons"
              payload: { full_name: "Henry H", date_of_birth: "1984-10-10T00:00:00Z", tobacco_user: false, gender: "MALE" }
              as: Agent
              captures: { ip_h: $.data.id }
            - call: "POST /product-templates"
              payload: { product_code: "WL-H", product_type: "WHOLE_LIFE_NON_PARTICIPATING", participating: false, allows_policy_loans: false, min_face_amount_cents: 1000000, max_face_amount_cents: 100000000, base_monthly_premium_rate_per_thousand_cents: 50, coi_rate_table: [], surrender_charge_schedule: [] }
              as: PlatformAdmin
              captures: { tpl_h: $.data.id }
            - call: "POST /applications"
              payload: { insured_person_id: "${ip_h}", product_template_id: "${tpl_h}", requested_face_amount_cents: 10000000, premium_mode: "MONTHLY" }
              as: Agent
              captures: { app_h: $.data.id }
            - call: "POST /applications/${app_h}/begin-review"
              payload: {}
              as: Underwriter
            - call: "POST /applications/${app_h}/approve"
              payload: { underwriting_class: "STANDARD_NON_TOBACCO" }
              as: Underwriter
          trigger:
            - call: "POST /applications/${app_h}/issue"
              payload: {}
              as: PolicyIssuer
              captures: { pol_h: $.data.id, pol_h_pps: $.data.premium_payment_status, pol_h_fs: $.data.form_status }
          assert:
            - "Policy.${pol_h}.premium_payment_status == CURRENT"
            - "Policy.${pol_h}.form_status == IN_FORCE"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: back_premium_due_computed_correctly
        claim_type: correct_result
        grounds: [calculations.back_premium_due]
        distinguishing_aspect: "Computed back_premium_due_cents equals sum of unpaid modal premiums + 6% interest from each due date to request date."
        excluded_because:
          difficulty_instance: non_linear_state_machine / reinstatement_request_evidence_cycle
          rationale: "Reinstatement flow already covered; the calculation's correctness is verified through that test's side effects."

      - name: cash_surrender_waterfall_order
        claim_type: correct_result
        grounds: [calculations.cash_surrender_value]
        distinguishing_aspect: "Waterfall: gross cash value → loan principal → accrued interest → surrender charge → payout. Order matters because each step depends on the prior step's remainder."
        test_recipe:
          setup:
            - "UNIVERSAL_LIFE policy with cash_value = 100_000_00, outstanding_loan_principal = 30_000_00, accrued_loan_interest = 5_000_00, surrender_charge_schedule = [{policy_year_min_inclusive:1, surrender_charge_pct_bps:1000}] (10%)"
            - "policy_year = 1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insured-persons"
              payload: { full_name: "Ivy I", date_of_birth: "1980-01-01T00:00:00Z", tobacco_user: false, gender: "FEMALE" }
              as: Agent
              captures: { ip_i: $.data.id }
            - call: "POST /product-templates"
              payload: { product_code: "UL-I", product_type: "UNIVERSAL_LIFE", participating: false, allows_policy_loans: true, min_face_amount_cents: 1000000, max_face_amount_cents: 100000000, base_monthly_premium_rate_per_thousand_cents: 100, coi_rate_table: [{ attained_age: 40, monthly_rate_per_thousand_cents: 15 }], surrender_charge_schedule: [{ policy_year_min_inclusive: 1, surrender_charge_pct_bps: 1000 }] }
              as: PlatformAdmin
              captures: { tpl_i: $.data.id }
            - call: "POST /applications"
              payload: { insured_person_id: "${ip_i}", product_template_id: "${tpl_i}", requested_face_amount_cents: 20000000, premium_mode: "ANNUAL" }
              as: Agent
              captures: { app_i: $.data.id }
            - call: "POST /applications/${app_i}/begin-review"
              payload: {}
              as: Underwriter
            - call: "POST /applications/${app_i}/approve"
              payload: { underwriting_class: "STANDARD_NON_TOBACCO" }
              as: Underwriter
            - call: "POST /applications/${app_i}/issue"
              payload: {}
              as: PolicyIssuer
              captures: { pol_i: $.data.id }
            - call: "POST /policies/${pol_i}/premium-payments"
              payload: { amount_cents: 10000000 }
              as: Agent
            - call: "POST /policies/${pol_i}/loans"
              payload: { requested_amount_cents: 3000000 }
              as: Policyholder
              as_user_id: "${ip_i}"
              captures: { loan_i: $.data.id }
            # Accrue some interest
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /policies/${pol_i}/loans/${loan_i}/accrue-interest"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /policies/${pol_i}/nonforfeiture-elections"
              payload: { election_type: "CASH_SURRENDER" }
              as: Policyholder
              as_user_id: "${ip_i}"
              captures: { elect_i: $.data.id, payout_i: $.data.payout_cents }
          assert:
            - "NonforfeitureElection.${elect_i}.payout_cents is computed by waterfall: cash_value - loan_principal - accrued_interest - surrender_charge, floor at 0"
            - "NonforfeitureElection.${elect_i}.surrender_charge_cents == round_half_up(cash_value * 0.10)"

  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_returns_400
        claim_type: violation_to_error
        grounds: ["\"validations[priority=1\"]"]
        distinguishing_aspect: "Missing X-User-ID or X-User-Role header returns ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /policies"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: insufficient_permissions_returns_403
        claim_type: violation_to_error
        grounds: ["\"validations[priority=2\"]"]
        distinguishing_aspect: "Policyholder attempting POST /product-templates (admin-only) returns ERR_INSUFFICIENT_PERMISSIONS (403)."
        test_recipe:
          setup: ["InsuredPerson created"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insured-persons"
              payload: { full_name: "Jack J", date_of_birth: "1990-01-01T00:00:00Z", tobacco_user: false, gender: "MALE" }
              as: Agent
              captures: { ip_j: $.data.id }
          trigger:
            - call: "POST /product-templates"
              payload: { product_code: "X", product_type: "WHOLE_LIFE_NON_PARTICIPATING", participating: false, allows_policy_loans: false, min_face_amount_cents: 1, max_face_amount_cents: 100, base_monthly_premium_rate_per_thousand_cents: 1, coi_rate_table: [], surrender_charge_schedule: [] }
              as: Policyholder
              as_user_id: "${ip_j}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS"

      - name: class_tobacco_mismatch
        claim_type: violation_to_error
        grounds: ["\"validations[priority=9\"]"]
        distinguishing_aspect: "Approving with class=PREFERRED_TOBACCO when insured.tobacco_user=false returns ERR_CLASS_TOBACCO_MISMATCH (422)."
        test_recipe:
          setup: ["Application in UNDER_REVIEW for non-tobacco insured"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insured-persons"
              payload: { full_name: "Karen K", date_of_birth: "1992-03-03T00:00:00Z", tobacco_user: false, gender: "FEMALE" }
              as: Agent
              captures: { ip_k: $.data.id }
            - call: "POST /product-templates"
              payload: { product_code: "WL-K", product_type: "WHOLE_LIFE_NON_PARTICIPATING", participating: false, allows_policy_loans: false, min_face_amount_cents: 1000000, max_face_amount_cents: 100000000, base_monthly_premium_rate_per_thousand_cents: 50, coi_rate_table: [], surrender_charge_schedule: [] }
              as: PlatformAdmin
              captures: { tpl_k: $.data.id }
            - call: "POST /applications"
              payload: { insured_person_id: "${ip_k}", product_template_id: "${tpl_k}", requested_face_amount_cents: 10000000, premium_mode: "MONTHLY" }
              as: Agent
              captures: { app_k: $.data.id }
            - call: "POST /applications/${app_k}/begin-review"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /applications/${app_k}/approve"
              payload: { underwriting_class: "PREFERRED_TOBACCO" }
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CLASS_TOBACCO_MISMATCH"

      - name: face_amount_below_template_min
        claim_type: violation_to_error
        grounds: ["\"validations[priority=8\"]"]
        distinguishing_aspect: "requested_face_amount_cents < template.min_face_amount_cents returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Template with min_face_amount_cents=5_000_00; application requests 1_00"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insured-persons"
              payload: { full_name: "Liam L", date_of_birth: "1991-04-04T00:00:00Z", tobacco_user: false, gender: "MALE" }
              as: Agent
              captures: { ip_l: $.data.id }
            - call: "POST /product-templates"
              payload: { product_code: "WL-L", product_type: "WHOLE_LIFE_NON_PARTICIPATING", participating: false, allows_policy_loans: false, min_face_amount_cents: 500000, max_face_amount_cents: 100000000, base_monthly_premium_rate_per_thousand_cents: 50, coi_rate_table: [], surrender_charge_schedule: [] }
              as: PlatformAdmin
              captures: { tpl_l: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { insured_person_id: "${ip_l}", product_template_id: "${tpl_l}", requested_face_amount_cents: 100, premium_mode: "MONTHLY" }
              as: Agent
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: segregation_of_duties_issue_after_own_approval
        claim_type: violation_to_error
        grounds: ["\"validations[priority=5\"]"]
        distinguishing_aspect: "Underwriter U1 (X-User-ID=u1) approves application; same X-User-ID=u1 attempts to issue → ERR_SEGREGATION_OF_DUTIES_VIOLATION (403)."
        test_recipe:
          setup: ["Application approved by underwriter 'u1'; issuer attempts issue with X-User-ID=u1"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insured-persons"
              payload: { full_name: "Mia M2", date_of_birth: "1986-07-07T00:00:00Z", tobacco_user: false, gender: "FEMALE" }
              as: Agent
              captures: { ip_m2: $.data.id }
            - call: "POST /product-templates"
              payload: { product_code: "WL-M2", product_type: "WHOLE_LIFE_NON_PARTICIPATING", participating: false, allows_policy_loans: false, min_face_amount_cents: 1000000, max_face_amount_cents: 100000000, base_monthly_premium_rate_per_thousand_cents: 50, coi_rate_table: [], surrender_charge_schedule: [] }
              as: PlatformAdmin
              captures: { tpl_m2: $.data.id }
            - call: "POST /applications"
              payload: { insured_person_id: "${ip_m2}", product_template_id: "${tpl_m2}", requested_face_amount_cents: 10000000, premium_mode: "MONTHLY" }
              as: Agent
              captures: { app_m2: $.data.id }
            - call: "POST /applications/${app_m2}/begin-review"
              payload: {}
              as: Underwriter
            - call: "POST /applications/${app_m2}/approve"
              payload: { underwriting_class: "STANDARD_NON_TOBACCO" }
              as: Underwriter
          trigger:
            # Same X-User-ID is simulated here by attaching a recognizable
            # X-User-ID. The test harness must issue the approve call with
            # X-User-ID=u1 and then issue with X-User-ID=u1.
            - call: "POST /applications/${app_m2}/issue"
              payload: {}
              as: PolicyIssuer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SEGREGATION_OF_DUTIES_VIOLATION"

