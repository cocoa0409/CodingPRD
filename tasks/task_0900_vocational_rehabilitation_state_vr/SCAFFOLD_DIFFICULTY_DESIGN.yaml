# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Vocational Rehabilitation (State VR) — Expert
# 9 rule_ids x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: case_fund_obligation_vs_expenditure
        grounds:
          - calculations.case_fund_ledger
          - entities.Case.fields.funds_committed_cents
          - entities.Case.fields.funds_paid_cents
          - state_machines.ServiceAuthorization.REQUESTED_to_APPROVED
          - state_machines.Payment.PENDING_to_ISSUED
        distinguishing_aspect: |
          On the Case (money domain), total_obligation = funds_committed_cents + funds_paid_cents
          (360000) diverges from total_expenditure = funds_paid_cents (100000) for the identical
          set of authorizations/payments.
        test_recipe:
          setup:
            - "Provider, MSD category (cap 5), counselor, supervisor bootstrapped; clock at default 2026-05-01."
            - "Case: monthly_income 300000 (tier 0.10), budget 1,000,000; taken to SERVICES_ACTIVE via approved IPE."
            - "Authorization authorized 500000, comparable 100000 -> agency_share 360000; APPROVED (committed 360000)."
            - "One payment of 100000 created and issued (committed -> paid)."
          setup_api_calls:
            - call: "POST /vr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: VRAdmin
            - call: "POST /vr/counselors"
              payload: { name: "C1", email: "c1@vr.gov", unit: "U1" }
              as: VRAdmin
              captures: { counselor_id: $.data.id }
            - call: "POST /vr/supervisors"
              payload: { name: "S1", email: "s1@vr.gov" }
              as: VRAdmin
              captures: { supervisor_id: $.data.id }
            - call: "POST /vr/providers"
              payload: { name: "P1", service_categories: ["TRAINING", "ASSISTIVE_TECH"], max_concurrent_authorizations: 5 }
              as: VRAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /vr/priority-categories"
              payload: { rank: 1, label: "MSD", slot_capacity: 5 }
              as: VRAdmin
              captures: { cat1_id: $.data.id }
            - call: "POST /vr/cases"
              payload: { consumer_full_name: "Ann Ray", consumer_dob: "1990-01-01", disability_type: "PHYSICAL", referral_source: "DR", monthly_income_cents: 300000, budget_allocated_cents: 1000000 }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { case_id: $.data.id }
            - call: "POST /vr/cases/${case_id}/application"
              payload: {}
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/cases/${case_id}/eligibility"
              payload: { decision: "ELIGIBLE", disability_significance: "MSD" }
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/ipes"
              payload: { case_id: "${case_id}", employment_goal: "Clerk", goal_wage_target_cents: 60000 }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { ipe_id: $.data.id }
            - call: "POST /vr/ipes/${ipe_id}/submit"
              payload: {}
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/ipes/${ipe_id}/approve"
              payload: {}
              as: Supervisor
              as_user_id: "${supervisor_id}"
            - call: "POST /vr/authorizations"
              payload: { case_id: "${case_id}", ipe_id: "${ipe_id}", provider_id: "${provider_id}", service_category: "TRAINING", authorized_amount_cents: 500000, comparable_benefit_cents: 100000, service_period_start: "2026-05-01", service_period_end: "2026-05-31" }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { auth_id: $.data.id }
            - call: "GET /vr/cases/${case_id}"
              payload: {}
              as: Supervisor
              as_user_id: "${supervisor_id}"
              captures: { case_v: $.data.version }
            - call: "POST /vr/authorizations/${auth_id}/approve"
              payload: { expected_case_version: "${case_v}" }
              as: Supervisor
              as_user_id: "${supervisor_id}"
            - call: "POST /vr/payments"
              payload: { authorization_id: "${auth_id}", amount_cents: 100000 }
              as: FiscalOfficer
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /vr/payments/${pay_id}/issue"
              payload: {}
              as: FiscalOfficer
          assert:
            - "Case.${case_id}.funds_committed_cents == 260000"
            - "Case.${case_id}.funds_paid_cents == 100000"
            - "Case.${case_id}.funds_available_cents == 640000"
            - "total_obligation (committed+paid == 360000) != total_expenditure (paid == 100000)"

      - name: verified_vs_projected_weekly_wage
        grounds:
          - calculations.verified_average_weekly_wage
          - entities.Placement.fields.weekly_wage_cents
          - entities.Placement.fields.verified_avg_weekly_wage_cents
          - state_machines.Placement.STABILIZING_to_STABLE
        distinguishing_aspect: |
          On the Placement (earnings domain), verified_avg_weekly_wage_cents (48000, averaged over
          three ProgressReviews) diverges from projected weekly_wage_cents (50000) supplied at hire.
        test_recipe:
          setup:
            - "Case taken to EMPLOYED via approved IPE and a COMPETITIVE_INTEGRATED placement (projected wage 50000)."
            - "Stabilization begun at 2026-05-01; three ProgressReviews 40000@05-10, 60000@06-10, 44000@07-10."
            - "Clock advanced to 2026-07-30 (exactly 90 days)."
          setup_api_calls:
            - call: "POST /vr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: VRAdmin
            - call: "POST /vr/counselors"
              payload: { name: "C1", email: "c1@vr.gov", unit: "U1" }
              as: VRAdmin
              captures: { counselor_id: $.data.id }
            - call: "POST /vr/supervisors"
              payload: { name: "S1", email: "s1@vr.gov" }
              as: VRAdmin
              captures: { supervisor_id: $.data.id }
            - call: "POST /vr/priority-categories"
              payload: { rank: 1, label: "MSD", slot_capacity: 5 }
              as: VRAdmin
              captures: { cat1_id: $.data.id }
            - call: "POST /vr/cases"
              payload: { consumer_full_name: "Ben Ray", consumer_dob: "1988-02-02", disability_type: "SENSORY", referral_source: "SELF", monthly_income_cents: 150000, budget_allocated_cents: 500000 }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { case_id: $.data.id }
            - call: "POST /vr/cases/${case_id}/application"
              payload: {}
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/cases/${case_id}/eligibility"
              payload: { decision: "ELIGIBLE", disability_significance: "MSD" }
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/ipes"
              payload: { case_id: "${case_id}", employment_goal: "Analyst", goal_wage_target_cents: 60000 }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { ipe_id: $.data.id }
            - call: "POST /vr/ipes/${ipe_id}/submit"
              payload: {}
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/ipes/${ipe_id}/approve"
              payload: {}
              as: Supervisor
              as_user_id: "${supervisor_id}"
            - call: "POST /vr/placements"
              payload: { case_id: "${case_id}", ipe_id: "${ipe_id}", employer_name: "Acme", placement_date: "2026-05-01", weekly_wage_cents: 50000, hours_per_week: 40, employment_type: "COMPETITIVE_INTEGRATED" }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { placement_id: $.data.id }
            - call: "POST /vr/placements/${placement_id}/begin-stabilization"
              payload: {}
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/progress-reviews"
              payload: { placement_id: "${placement_id}", review_date: "2026-05-10", reported_weekly_wage_cents: 40000 }
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/progress-reviews"
              payload: { placement_id: "${placement_id}", review_date: "2026-06-10", reported_weekly_wage_cents: 60000 }
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/progress-reviews"
              payload: { placement_id: "${placement_id}", review_date: "2026-07-10", reported_weekly_wage_cents: 44000 }
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-30T00:00:00Z" }
              as: VRAdmin
          trigger:
            - call: "POST /vr/placements/${placement_id}/verify-stability"
              payload: {}
              as: Counselor
              as_user_id: "${counselor_id}"
          assert:
            - "Placement.${placement_id}.status == STABLE"
            - "Placement.${placement_id}.verified_avg_weekly_wage_cents == 48000"
            - "Placement.${placement_id}.weekly_wage_cents == 50000"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: cost_share_tiered_offset_mode_a
        grounds:
          - calculations.service_cost_share
          - entities.ServiceAuthorization.fields.consumer_share_cents
          - entities.ServiceAuthorization.fields.agency_share_cents
          - entities.Case.fields.monthly_income_cents
        distinguishing_aspect: |
          Mode (a): three inputs (authorized 500000, comparable 100000, income 300000) with nested
          max()/min() and a tiered participation branch; consumer_share == 40000, agency_share == 360000.
        test_recipe:
          setup:
            - "Case at PLAN_DEVELOPMENT (income 300000 -> tier 0.10), a DRAFT IPE exists for the FK."
          setup_api_calls:
            - call: "POST /vr/counselors"
              payload: { name: "C1", email: "c1@vr.gov", unit: "U1" }
              as: VRAdmin
              captures: { counselor_id: $.data.id }
            - call: "POST /vr/providers"
              payload: { name: "P1", service_categories: ["TRAINING"], max_concurrent_authorizations: 5 }
              as: VRAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /vr/priority-categories"
              payload: { rank: 1, label: "MSD", slot_capacity: 5 }
              as: VRAdmin
              captures: { cat1_id: $.data.id }
            - call: "POST /vr/cases"
              payload: { consumer_full_name: "Cy Ray", consumer_dob: "1991-03-03", disability_type: "PHYSICAL", referral_source: "DR", monthly_income_cents: 300000, budget_allocated_cents: 1000000 }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { case_id: $.data.id }
            - call: "POST /vr/cases/${case_id}/application"
              payload: {}
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/cases/${case_id}/eligibility"
              payload: { decision: "ELIGIBLE", disability_significance: "MSD" }
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/ipes"
              payload: { case_id: "${case_id}", employment_goal: "Clerk", goal_wage_target_cents: 60000 }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { ipe_id: $.data.id }
          trigger:
            - call: "POST /vr/authorizations"
              payload: { case_id: "${case_id}", ipe_id: "${ipe_id}", provider_id: "${provider_id}", service_category: "TRAINING", authorized_amount_cents: 500000, comparable_benefit_cents: 100000, service_period_start: "2026-05-01", service_period_end: "2026-05-31" }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { auth_id: $.data.id }
          assert:
            - "ServiceAuthorization.${auth_id}.consumer_share_cents == 40000"
            - "ServiceAuthorization.${auth_id}.agency_share_cents == 360000"

      - name: payment_federal_split_round_then_sum_mode_b
        grounds:
          - calculations.payment_federal_state_split
          - entities.Payment.fields.federal_share_cents
          - state_machines.Payment.PENDING_to_ISSUED
          - endpoints./vr/cases/{case_id}/rsa911
        distinguishing_aspect: |
          Mode (b): rounding order pinned round-per-payment-then-sum. Two 100-cent payments each
          round to federal 79; RSA-911 total_federal == 158, NOT sum-then-round round(200*0.787) == 157.
        test_recipe:
          setup:
            - "Case to SERVICES_ACTIVE (income 150000 tier 0.0), authorization authorized 200000 comparable 0 -> agency 200000, APPROVED."
            - "Two payments of 100 cents each created and issued."
          setup_api_calls:
            - call: "POST /vr/counselors"
              payload: { name: "C1", email: "c1@vr.gov", unit: "U1" }
              as: VRAdmin
              captures: { counselor_id: $.data.id }
            - call: "POST /vr/supervisors"
              payload: { name: "S1", email: "s1@vr.gov" }
              as: VRAdmin
              captures: { supervisor_id: $.data.id }
            - call: "POST /vr/providers"
              payload: { name: "P1", service_categories: ["TRAINING"], max_concurrent_authorizations: 5 }
              as: VRAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /vr/priority-categories"
              payload: { rank: 1, label: "MSD", slot_capacity: 5 }
              as: VRAdmin
              captures: { cat1_id: $.data.id }
            - call: "POST /vr/cases"
              payload: { consumer_full_name: "Di Ray", consumer_dob: "1992-04-04", disability_type: "COGNITIVE", referral_source: "DR", monthly_income_cents: 150000, budget_allocated_cents: 500000 }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { case_id: $.data.id }
            - call: "POST /vr/cases/${case_id}/application"
              payload: {}
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/cases/${case_id}/eligibility"
              payload: { decision: "ELIGIBLE", disability_significance: "MSD" }
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/ipes"
              payload: { case_id: "${case_id}", employment_goal: "Clerk", goal_wage_target_cents: 60000 }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { ipe_id: $.data.id }
            - call: "POST /vr/ipes/${ipe_id}/submit"
              payload: {}
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/ipes/${ipe_id}/approve"
              payload: {}
              as: Supervisor
              as_user_id: "${supervisor_id}"
            - call: "POST /vr/authorizations"
              payload: { case_id: "${case_id}", ipe_id: "${ipe_id}", provider_id: "${provider_id}", service_category: "TRAINING", authorized_amount_cents: 200000, comparable_benefit_cents: 0, service_period_start: "2026-05-01", service_period_end: "2026-05-31" }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { auth_id: $.data.id }
            - call: "GET /vr/cases/${case_id}"
              payload: {}
              as: Supervisor
              as_user_id: "${supervisor_id}"
              captures: { case_v: $.data.version }
            - call: "POST /vr/authorizations/${auth_id}/approve"
              payload: { expected_case_version: "${case_v}" }
              as: Supervisor
              as_user_id: "${supervisor_id}"
            - call: "POST /vr/payments"
              payload: { authorization_id: "${auth_id}", amount_cents: 100 }
              as: FiscalOfficer
              captures: { pay1_id: $.data.id }
            - call: "POST /vr/payments/${pay1_id}/issue"
              payload: {}
              as: FiscalOfficer
            - call: "POST /vr/payments"
              payload: { authorization_id: "${auth_id}", amount_cents: 100 }
              as: FiscalOfficer
              captures: { pay2_id: $.data.id }
            - call: "POST /vr/payments/${pay2_id}/issue"
              payload: {}
              as: FiscalOfficer
          trigger:
            - call: "GET /vr/cases/${case_id}/rsa911"
              payload: {}
              as: Supervisor
              as_user_id: "${supervisor_id}"
          assert:
            - "Payment.${pay1_id}.federal_share_cents == 79"
            - "Payment.${pay2_id}.federal_share_cents == 79"
            - "rsa911(${case_id}).total_federal_expenditure_cents == 158"
            - "rsa911(${case_id}).total_state_expenditure_cents == 42"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: ipe_amendment_cycle
        grounds:
          - state_machines.IPE.APPROVED_to_AMENDING
          - state_machines.IPE.AMENDING_to_APPROVED
          - entities.IPE.fields.status
        distinguishing_aspect: |
          IPE returns to APPROVED via APPROVED -> AMENDING -> APPROVED, a cycle no linear pipeline
          admits; approved_plan_version increases across the re-approval.
        test_recipe:
          setup:
            - "Case to SERVICES_ACTIVE with its IPE APPROVED."
          setup_api_calls:
            - call: "POST /vr/counselors"
              payload: { name: "C1", email: "c1@vr.gov", unit: "U1" }
              as: VRAdmin
              captures: { counselor_id: $.data.id }
            - call: "POST /vr/supervisors"
              payload: { name: "S1", email: "s1@vr.gov" }
              as: VRAdmin
              captures: { supervisor_id: $.data.id }
            - call: "POST /vr/priority-categories"
              payload: { rank: 1, label: "MSD", slot_capacity: 5 }
              as: VRAdmin
              captures: { cat1_id: $.data.id }
            - call: "POST /vr/cases"
              payload: { consumer_full_name: "Ed Ray", consumer_dob: "1993-05-05", disability_type: "PHYSICAL", referral_source: "DR", monthly_income_cents: 150000, budget_allocated_cents: 500000 }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { case_id: $.data.id }
            - call: "POST /vr/cases/${case_id}/application"
              payload: {}
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/cases/${case_id}/eligibility"
              payload: { decision: "ELIGIBLE", disability_significance: "MSD" }
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/ipes"
              payload: { case_id: "${case_id}", employment_goal: "Clerk", goal_wage_target_cents: 60000 }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { ipe_id: $.data.id }
            - call: "POST /vr/ipes/${ipe_id}/submit"
              payload: {}
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/ipes/${ipe_id}/approve"
              payload: {}
              as: Supervisor
              as_user_id: "${supervisor_id}"
          trigger:
            - call: "POST /vr/ipes/${ipe_id}/amend"
              payload: {}
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/ipes/${ipe_id}/approve"
              payload: {}
              as: Supervisor
              as_user_id: "${supervisor_id}"
          assert:
            - "IPE.${ipe_id}.status == APPROVED"
            - "IPE.${ipe_id} passed through AMENDING between the two APPROVED states (cycle closed)"

      - name: placement_destabilize_resume_cycle
        grounds:
          - state_machines.Placement.STABILIZING_to_DESTABILIZED
          - state_machines.Placement.DESTABILIZED_to_STABILIZING
          - entities.Placement.fields.stabilization_start_date
        distinguishing_aspect: |
          Placement loops STABILIZING -> DESTABILIZED -> STABILIZING; resume RESETS
          stabilization_start_date to 2026-06-15 (not the original 2026-05-01), proving the loop side effect.
        test_recipe:
          setup:
            - "Case to EMPLOYED with a SUPPORTED placement; stabilization begun at clock 2026-05-01."
          setup_api_calls:
            - call: "POST /vr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: VRAdmin
            - call: "POST /vr/counselors"
              payload: { name: "C1", email: "c1@vr.gov", unit: "U1" }
              as: VRAdmin
              captures: { counselor_id: $.data.id }
            - call: "POST /vr/supervisors"
              payload: { name: "S1", email: "s1@vr.gov" }
              as: VRAdmin
              captures: { supervisor_id: $.data.id }
            - call: "POST /vr/priority-categories"
              payload: { rank: 1, label: "MSD", slot_capacity: 5 }
              as: VRAdmin
              captures: { cat1_id: $.data.id }
            - call: "POST /vr/cases"
              payload: { consumer_full_name: "Fay Ray", consumer_dob: "1994-06-06", disability_type: "PSYCHIATRIC", referral_source: "DR", monthly_income_cents: 150000, budget_allocated_cents: 500000 }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { case_id: $.data.id }
            - call: "POST /vr/cases/${case_id}/application"
              payload: {}
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/cases/${case_id}/eligibility"
              payload: { decision: "ELIGIBLE", disability_significance: "MSD" }
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/ipes"
              payload: { case_id: "${case_id}", employment_goal: "Aide", goal_wage_target_cents: 45000 }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { ipe_id: $.data.id }
            - call: "POST /vr/ipes/${ipe_id}/submit"
              payload: {}
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/ipes/${ipe_id}/approve"
              payload: {}
              as: Supervisor
              as_user_id: "${supervisor_id}"
            - call: "POST /vr/placements"
              payload: { case_id: "${case_id}", ipe_id: "${ipe_id}", employer_name: "Acme", placement_date: "2026-05-01", weekly_wage_cents: 40000, hours_per_week: 30, employment_type: "SUPPORTED" }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { placement_id: $.data.id }
            - call: "POST /vr/placements/${placement_id}/begin-stabilization"
              payload: {}
              as: Counselor
              as_user_id: "${counselor_id}"
          trigger:
            - call: "POST /vr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: VRAdmin
            - call: "POST /vr/placements/${placement_id}/report-loss"
              payload: {}
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: VRAdmin
            - call: "POST /vr/placements/${placement_id}/resume"
              payload: {}
              as: Counselor
              as_user_id: "${counselor_id}"
          assert:
            - "Placement.${placement_id}.status == STABILIZING"
            - "Placement.${placement_id}.stabilization_start_date == 2026-06-15"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: case_close_cancel_auth_void_payment_decrement_provider
        grounds:
          - state_machines.Case.SERVICES_ACTIVE_to_CLOSED_OTHER
          - state_machines.ServiceAuthorization.APPROVED_to_CANCELLED
          - state_machines.Payment.PENDING_to_VOIDED
          - entities.Provider.fields.pending_disbursement_cents
        distinguishing_aspect: |
          Depth-4 chain Case -> ServiceAuthorization -> Payment -> Provider: closing the case cancels
          the APPROVED authorization, whose cancellation voids the PENDING payment, whose void decrements
          Provider.pending_disbursement_cents to 0. Each hop is caused by the previous hop.
        test_recipe:
          setup:
            - "Case SERVICES_ACTIVE, authorization authorized 300000 comparable 0 -> agency 300000 APPROVED (committed 300000)."
            - "One PENDING payment of 120000 (Provider.pending_disbursement_cents == 120000)."
