scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: per_diem_budget_provisional_vs_final
        grounds:
          - calculations.trip_budget_estimate
          - entities.Trip.fields.estimated_budget_cents
          - entities.Trip.fields.pinned_per_diem_rate_id
          - state_machines.Trip.DRAFT_to_SUBMITTED
          - state_machines.Trip.SUBMITTED_to_APPROVED
          - endpoints[POST /trips/{id}/submit]
          - endpoints[POST /per-diem-rates]
          - endpoints[POST /expense-reports/{id}/approve]
        distinguishing_aspect: |
          Operates on the Trip entity. Provisional variant runs at /submit using the
          PerDiemRate row resolved live; final variant runs at expense-report /approve
          using Trip.pinned_per_diem_rate_id. When the admin edits the pinned row's
          lodging_cap_cents between trip approval and report approval, the two
          variants produce different cents — proving the calculation must read the
          pinned-row state, not just re-resolve by city/date.
        test_recipe:
          setup:
            - "Create Employee traveler T (role TRAVELER, manager M) and Employee manager M."
            - "POST /per-diem-rates {city='Boston', state='MA', effective_from='2025-06-01T00:00:00Z', effective_to='2025-07-01T00:00:00Z', lodging_cap_cents=28800, mie_cap_cents=8000, is_high_cost_locality=false} → rate_id R1."
            - "Traveler creates Trip to Boston MA, start_date='2025-06-02T00:00:00Z', end_date='2025-06-04T00:00:00Z' (nights=2, mie_days=3)."
            - "POST /trips/{id}/submit → estimated_budget_cents = 28800*2 + 2*6000 + 1*8000 = 77600 (provisional)."
            - "Manager POST /trips/{id}/approve → pinned_per_diem_rate_id = R1."
            - "Admin PATCH /per-diem-rates updates R1.lodging_cap_cents to 30000 (or POST a corrected row that supersedes — implementation may either way; what matters is the pinned row now reads 30000)."
          trigger:
            - "Traveler POST /expense-reports for the trip, adds one LODGING line per night within trip dates with no over-cap, submits."
            - "FINANCE_REVIEWER POST /expense-reports/{id}/claim then /approve (triggers final variant)."
          assert:
            - "Trip.estimated_budget_cents == 77600 (provisional, unchanged)."
            - "After /approve, ExpenseReport.total_reimbursable_cents reflects the FINAL run using lodging_cap_cents=30000 → recomputed budget = 30000*2 + 2*6000 + 1*8000 = 80000."
            - "Trip.estimated_budget_cents != recomputed_final_budget (77600 != 80000) — divergence pinned."

      - name: flight_llf_forward_looking_vs_chronological
        grounds:
          - calculations.lowest_logical_fare_variance
          - entities.ExpenseLine.fields.amount_reimbursable_cents
          - entities.ExpenseLine.fields.policy_status
          - endpoints[POST /expense-reports/{report_id}/lines]
          - endpoints[POST /expense-reports/{id}/approve]
          - state_machines.ExpenseReport.IN_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Operates on the ExpenseLine entity (a different domain from
          per_diem_budget_provisional_vs_final, which operates on Trip).
          forward_looking_at_booking pins variance against the rate live at the
          flight's expense_date; chronological_at_approval re-evaluates against
          Trip.pinned_per_diem_rate_id whose effective window may NOT cover the
          flight's expense_date. The two produce different policy_status outcomes
          for the same identical inputs.
        test_recipe:
          setup:
            - "Two adjacent PerDiemRate rows for Boston MA: R1 (effective 2025-06-01 → 2025-07-01, lodging_cap=28800, mie_cap=8000) and R2 (effective 2025-07-01 → 2025-08-01, lodging_cap=40000, mie_cap=10000)."
            - "Trip Boston MA, start='2025-06-29T00:00:00Z', end='2025-07-03T00:00:00Z' (spans both windows)."
            - "Trip submitted and approved → pinned_per_diem_rate_id = R1 (resolved against start_date)."
            - "Create an ExpenseReport; add a FLIGHT line on expense_date='2025-07-02T00:00:00Z' (falls inside R2), amount_claimed_cents=55000."
          trigger:
            - "Line creation triggers forward_looking_at_booking using R2 → llf=40000+10000=50000, variance=5000 ≤ 10000 → policy_status=IN_POLICY, amount_reimbursable=55000."
            - "Submit report; FINANCE_REVIEWER claims and POSTs /expense-reports/{id}/approve, triggering chronological_at_approval using R1 → llf=28800+8000=36800, variance=18200 > 10000."
          assert:
            - "Before /approve: line.policy_status == IN_POLICY and amount_reimbursable_cents == 55000."
            - "After /approve: line.policy_status == OUT_OF_POLICY and amount_reimbursable_cents == 36800."
            - "Same line row, same claimed amount, two different reimbursable values pinned by which rate row the calc reads."

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: mileage_rental_overlap_three_input_nonlinear
        grounds:
          - calculations.mileage_reimbursement
          - entities.ExpenseLine.fields.miles_driven
          - entities.ExpenseLine.fields.category
          - endpoints[POST /expense-reports/{report_id}/lines]
        distinguishing_aspect: |
          Mode (a) — three inputs (miles_driven, same-date RENTAL_CAR existence,
          MILEAGE_OVERLAP_THRESHOLD) interacting non-linearly. The result is not a
          simple linear function of miles_driven: below 30 miles or without a same-
          date rental, the formula uses a single rate; above 30 miles WITH a
          rental, the rate is a piecewise tiered_pricing formula.
        test_recipe:
          setup:
            - "Trip Boston, dates 2025-06-02 to 2025-06-04 (approved as in instance 1)."
            - "Per-diem rates exist for Boston MA."
            - "ExpenseReport created in DRAFT."
            - "Add RENTAL_CAR line on expense_date 2025-06-03, rental_days=1, amount_claimed_cents=5000, cdw_purchased=false."
          trigger:
            - "Add MILEAGE line on expense_date 2025-06-03 with miles_driven=80.0."
          assert:
            - "MILEAGE line.amount_reimbursable_cents == 3060."
            - "Formula breakdown: base = round_half_up(30.0 * 67) = 2010; excess = round_half_up(50.0 * 21) = 1050; total = 3060."
            - "Replacing miles_driven with 30.0 (boundary): line.amount_reimbursable_cents == 2010 (no excess)."

      - name: mileage_per_leg_rounding_order_pinned
        grounds:
          - calculations.mileage_reimbursement
          - entities.ExpenseLine.fields.miles_driven
          - endpoints[POST /expense-reports/{report_id}/lines]
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. The scaffold pins
          "round each leg to nearest cent, then sum" (per-leg-round-then-sum) as
          opposed to "sum then round". With miles_driven=80.0 and the rental
          overlap branch, per-leg-round gives 2010 + 1050 = 3060 cents, while
          sum-then-round would multiply 30*67 + 50*21 = 2010 + 1050 = also 3060
          for integer rates — so use a half-cent boundary instance: miles 30.5
          (no overlap) where 30.5 * 67 = 2043.5 → round_half_up → 2044, NOT 2043.
        test_recipe:
          setup:
            - "Trip and ExpenseReport DRAFT as in previous instance, NO rental car line."
          trigger:
            - "Add MILEAGE line on expense_date 2025-06-03 with miles_driven=30.5 (single leg, half-cent boundary)."
          assert:
            - "line.amount_reimbursable_cents == 2044 (30.5 * 67 = 2043.5 → round_half_up → 2044)."
            - "Negative check: 2043 (round-half-down) is wrong; the scaffold pins round_half_up."

      - name: per_diem_budget_pinned_evaluation_order
        grounds:
          - calculations.trip_budget_estimate
          - entities.Trip.fields.pinned_per_diem_rate_id
          - state_machines.Trip.SUBMITTED_to_APPROVED
          - state_machines.ExpenseReport.IN_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency. The final per-diem budget is
          a function of the pinned rate, but the pinned rate is itself a function
          of trip approval (which fires only after submission, which fires only
          after the provisional budget is computed). The scaffold pins the
          evaluation order: provisional budget computed FIRST at /submit, pinned-
          rate-id stored SECOND at /approve, final budget computed THIRD at
          report /approve using the pinned id. Skipping any step or changing the
          order produces different cents.
        test_recipe:
          setup:
            - "Two PerDiemRate rows for the same city/state with overlapping windows but different caps; the resolver returns the latest-effective_from when ambiguous (tie-break)."
            - "Insert row R_old (effective_from=2025-05-01, lodging_cap=20000) BEFORE the trip; insert row R_new (effective_from=2025-06-01, lodging_cap=30000) AFTER trip /submit but BEFORE /approve."
          trigger:
            - "Trip start=2025-06-02; POST /submit → provisional uses R_new at submit-time → estimated_budget_cents reflects R_new."
            - "POST /trips/{id}/approve → pinned_per_diem_rate_id = R_new."
            - "POST another rate row R_newer (effective_from=2025-06-01, lodging_cap=35000) AFTER approval."
            - "Report /approve uses pinned id (still R_new), NOT R_newer."
          assert:
            - "Trip.pinned_per_diem_rate_id == R_new (not R_newer)."
            - "ExpenseReport final-budget cents derived from R_new.lodging_cap_cents=30000, not R_newer.lodging_cap_cents=35000 — confirming the pinned-id read order is final."

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: expense_report_changes_requested_cycle
        grounds:
          - state_machines.ExpenseReport.IN_REVIEW_to_CHANGES_REQUESTED
          - state_machines.ExpenseReport.CHANGES_REQUESTED_to_DRAFT
          - state_machines.ExpenseReport.DRAFT_to_SUBMITTED
          - endpoints[POST /expense-reports/{id}/request-changes]
          - endpoints[PATCH /expense-reports/{id}]
        distinguishing_aspect: |
          Cyclic shape on ExpenseReport: SUBMITTED → IN_REVIEW → CHANGES_REQUESTED
          → DRAFT → SUBMITTED → IN_REVIEW → … The same report can traverse
          IN_REVIEW twice, observable by reviewer_id being cleared on each
          CHANGES_REQUESTED → DRAFT hop and rebound on re-claim.
        test_recipe:
          setup:
            - "Trip approved, ExpenseReport created with at least one ACTIVE line meeting receipt rules."
            - "FINANCE_REVIEWER F1 and F2."
          trigger:
            - "Traveler /submit → SUBMITTED."
            - "F1 /claim → IN_REVIEW, reviewer_id=F1."
            - "F1 /request-changes → CHANGES_REQUESTED."
            - "Traveler PATCH report (version) → DRAFT, reviewer_id cleared."
            - "Traveler /submit again → SUBMITTED."
            - "F2 /claim → IN_REVIEW, reviewer_id=F2."
          assert:
            - "After first /claim, ExpenseReport.reviewer_id == F1."
            - "After CHANGES_REQUESTED → DRAFT cycle, ExpenseReport.reviewer_id is null."
            - "After second /claim, ExpenseReport.reviewer_id == F2 (different reviewer)."
            - "ExpenseReport.version > version at first SUBMITTED — incremented on each mutation."

      - name: expense_line_parallel_policy_and_ocr_dimensions
        grounds:
          - entities.ExpenseLine.fields.policy_status
          - entities.ExpenseLine.fields.ocr_status
          - state_machines.ExpenseLine
          - endpoints[POST /expense-lines/{id}/attach-receipt]
          - endpoints[POST /oop-approvals/{id}/l2-approve]
        distinguishing_aspect: |
          Parallel dimensions on ExpenseLine: policy_status and ocr_status evolve
          INDEPENDENTLY. A line can be (OUT_OF_POLICY, OCR_VERIFIED), or
          (IN_POLICY, OCR_MISMATCH), or (OOP_APPROVED, NO_RECEIPT) — each pair
          observable through different endpoints. Different entity from the cyclic
          ExpenseReport above.
        test_recipe:
          setup:
            - "Trip approved, ExpenseReport DRAFT. Per-diem rate Boston MA as in instance 1."
            - "Receipt uploaded with merchant_total_cents=2500, ocr_confidence=0.95."
          trigger:
            - "Add a MEAL line, meal_type=BREAKFAST, per_diem_method=ACTUAL, amount_claimed_cents=2500 → policy: 2500 > per_meal_cap(8000*0.25=2000), policy_status=OUT_OF_POLICY; ocr: NO_RECEIPT."
            - "POST /expense-lines/{id}/attach-receipt → ocr advances NO_RECEIPT → PENDING_OCR → OCR_VERIFIED (totals match)."
            - "Observe state."
          assert:
            - "Line.policy_status == OUT_OF_POLICY AND line.ocr_status == OCR_VERIFIED simultaneously — two dimensions co-occupied in non-adjacent values."
            - "Subsequent OOP approval flow (open OOP, L1 approve, L2 approve — line is meal so requires_final_escalation=false) transitions policy_status to OOP_APPROVED while ocr_status remains OCR_VERIFIED — proving independence."

      - name: virtual_card_active_locked_cycle
        grounds:
          - state_machines.VirtualCard.ACTIVE_to_LOCKED
          - state_machines.VirtualCard.LOCKED_to_ACTIVE
          - endpoints[POST /virtual-cards/{id}/lock]
          - endpoints[POST /virtual-cards/{id}/unlock]
        distinguishing_aspect: |
          Cyclic shape on VirtualCard (a third, different entity): ACTIVE ↔ LOCKED
          can be traversed repeatedly. locked_reason is set on each LOCK and
          cleared on each UNLOCK, observable across iterations.
        test_recipe:
          setup:
            - "Trip APPROVED. VirtualCard requested, issued, activated."
          trigger:
            - "POST /lock with locked_reason='suspicious_charge' → LOCKED."
            - "POST /unlock → ACTIVE, locked_reason cleared."
            - "POST /lock again with locked_reason='manual_audit' → LOCKED."
          assert:
            - "After first lock: status=LOCKED, locked_reason='suspicious_charge'."
            - "After unlock: status=ACTIVE, locked_reason is null."
            - "After second lock: status=LOCKED, locked_reason='manual_audit' (different value, proving cycle works)."
            - "VirtualCard.version increments by 3 across the three hops."

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: trip_reject_to_card_close_to_report_reject_depth3
        grounds:
          - state_machines.Trip.SUBMITTED_to_REJECTED
          - state_machines.VirtualCard.REQUESTED_to_CLOSED
          - state_machines.ExpenseReport
          - endpoints[POST /trips/{id}/reject]
        distinguishing_aspect: |
          Depth-3 transitive cascade from a Trip rejection: A (POST /reject)
          mutates Trip.status=REJECTED → that mutation triggers VirtualCard
          (status=REQUESTED) to auto-transition to CLOSED → that VirtualCard
          closure triggers any ExpenseReport on this trip to transition to
          REJECTED. Each link is caused by the previous link, not by the
          original action.
        test_recipe:
          setup:
            - "Trip in SUBMITTED state."
            - "VirtualCard in REQUESTED state with trip_id == Trip.id (a card was requested before trip approval — allowed by /virtual-cards which requires trip exist but not APPROVED for create)."
            - "Note: card create currently requires APPROVED; alternative — start trip APPROVED, create card REQUESTED, then move trip back. Use the supported path: trip in APPROVED, card REQUESTED, ExpenseReport created in DRAFT, then admin re-submits a scenario where trip rolled back via /cancel — adjust to test cascade from /cancel which has the same fan-out."
            - "Adjusted setup: Trip APPROVED, VirtualCard REQUESTED, ExpenseReport in DRAFT (no lines yet — DRAFT report exists)."
          trigger:
            - "POST /trips/{id}/cancel by traveler (analogous cascade trigger; cancel triggers identical VirtualCard closure for non-CLOSED cards)."
          assert:
            - "Hop 1: Trip.status == CANCELLED."
            - "Hop 2: VirtualCard.status == CLOSED (cascaded from cancel)."
            - "Hop 3: ExpenseReport.status remains DRAFT iff no submit happened; for cascade from REJECTION path, with trip SUBMITTED and an existing ExpenseReport in DRAFT (via prior trip approval that was later rolled back), the depth-3 chain hits report rejection. The test verifies the documented depth-3 chain by running /trips/{id}/reject on a trip that has both card REQUESTED and existing report SUBMITTED."
            - "Chain depth >= 3 with each hop caused by the previous, not directly by /reject."

      - name: report_reject_to_line_void_to_card_deauth_depth3
        grounds:
          - state_machines.ExpenseReport.IN_REVIEW_to_REJECTED
          - state_machines.ExpenseLine.line_status_ACTIVE_to_VOIDED
          - entities.VirtualCard.fields.authorized_amount_cents
          - state_machines.OutOfPolicyApproval
          - endpoints[POST /expense-reports/{id}/reject]
        distinguishing_aspect: |
          Different originating trigger (report rejection, not trip rejection).
          Depth-3 chain: A (POST /reports/{id}/reject) mutates ExpenseReport.status
          → that mutation transitions every ACTIVE child ExpenseLine to VOIDED →
          for each VOIDED line whose virtual_card_id is non-null, VirtualCard.
          authorized_amount_cents is decremented (deauthorization). Each hop is
          caused by the previous, not by the original /reject.
        test_recipe:
          setup:
            - "Trip APPROVED; ExpenseReport with 2 ACTIVE lines (a LODGING and a MEAL) where the LODGING line has virtual_card_id=VC1 with line.amount_reimbursable_cents=10000."
            - "VirtualCard VC1 status=ACTIVE, authorized_amount_cents=10000."
            - "Report SUBMITTED, then /claimed → IN_REVIEW."
          trigger:
            - "FINANCE_REVIEWER POST /expense-reports/{id}/reject."
          assert:
            - "Hop 1: ExpenseReport.status == REJECTED."
            - "Hop 2: both ExpenseLine.line_status == VOIDED."
            - "Hop 3: VirtualCard.authorized_amount_cents == 0 (decremented by 10000 due to the VOIDED line carrying virtual_card_id=VC1)."
            - "Counter-check: if hop 2 had been skipped, hop 3 would never fire — proving each link causes the next."

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_vs_business_fiscal_card_issue
        grounds:
          - validations[priority=5]
          - validations[priority=14]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CARD_LIMIT_EXCEEDS_BUDGET]
          - endpoints[POST /virtual-cards/{id}/issue]
        distinguishing_aspect: |
          A dual-failure scenario for /virtual-cards/{id}/issue where the card is
          BOTH in the wrong state (already ISSUED) AND credit_limit_cents exceeds
          Trip.estimated_budget_cents. Priority ordering: state (priority 5,
          category=state) wins over business_fiscal (priority 14). Error pair:
          {state, business_fiscal}.
        test_recipe:
          setup:
            - "Trip APPROVED with estimated_budget_cents=50000."
            - "VirtualCard requested with credit_limit_cents=80000 (over budget — should have failed at create, but admin bypass: set credit_limit_cents=40000 at create, then PATCH to 80000 via direct DB seed). Cleaner: card created with credit_limit_cents=40000 (valid), issued. Now card.status=ISSUED. Admin manually bumps credit_limit_cents to 80000 (over budget). Test attempts /issue again."
          trigger:
            - "POST /virtual-cards/{id}/issue on an already-ISSUED card whose credit_limit_cents now exceeds budget."
          assert:
            - "Response status 409 with error_id == ERR_INVALID_STATE (the state check wins)."
            - "Response is NOT ERR_CARD_LIMIT_EXCEEDS_BUDGET (the fiscal check is lower priority)."

      - name: business_safety_vs_business_referential_attach_receipt
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_RECEIPT_ALREADY_USED]
          - endpoints[POST /expense-lines/{id}/attach-receipt]
        distinguishing_aspect: |
          Different error-category pair from the first instance: {business_safety,
          business_referential}. Construct a scenario where (a) the acting user is
          not the traveler (segregation-of-duties violation — priority 7) AND
          (b) the receipt is already bound to another line (priority 8). Priority
          ordering: business_safety (priority 7) wins; ERR_SEGREGATION_OF_DUTIES
          returned.
        test_recipe:
          setup:
            - "Traveler T's Trip APPROVED, ExpenseReport in DRAFT, ExpenseLine L1 with no receipt."
            - "Receipt R bound to a DIFFERENT line L2 (different traveler T2)."
            - "Another traveler T3 (not T) attempts to call attach-receipt on L1 with receipt R."
          trigger:
            - "POST /expense-lines/L1/attach-receipt {receipt_id: R} as user T3 with role TRAVELER but T3 != T."
          assert:
            - "Response status 403 with error_id == ERR_SEGREGATION_OF_DUTIES (or the equivalent ownership-check error if not modelled as SoD; the priority-7 check wins regardless)."
            - "Response is NOT ERR_RECEIPT_ALREADY_USED — even though that would also be true, it is priority 8 and never reached."

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: llf_variance_tolerance_inclusive_boundary
        grounds:
          - calculations.lowest_logical_fare_variance
          - constants.LLF_VARIANCE_TOLERANCE_CENTS
          - endpoints[POST /expense-reports/{report_id}/lines]
        distinguishing_aspect: |
          Numeric threshold boundary on the FLIGHT category: variance_cents <=
          LLF_VARIANCE_TOLERANCE_CENTS (10000) is IN_POLICY (inclusive); variance
          == 10001 is OUT_OF_POLICY. Different endpoint and different metric from
          the empty-set instance below.
        test_recipe:
          setup:
            - "Trip Boston MA approved; PerDiemRate R: lodging_cap_cents=28800, mie_cap_cents=8000; llf_cents = 36800."
            - "ExpenseReport in DRAFT."
          trigger:
            - "Add FLIGHT line A on expense_date in trip window, amount_claimed_cents = 36800 + 10000 = 46800 (variance exactly 10000)."
            - "Add FLIGHT line B with amount_claimed_cents = 36800 + 10001 = 46801 (variance 10001)."
          assert:
            - "Line A.policy_status == IN_POLICY and amount_reimbursable_cents == 46800 (inclusive boundary)."
            - "Line B.policy_status == OUT_OF_POLICY and amount_reimbursable_cents == 36800 (capped at llf_cents)."
            - "Confirms `<=` not `<` at the threshold boundary."

      - name: empty_active_line_set_on_submit
        grounds:
          - validations[priority=5]
          - state_machines.ExpenseReport.DRAFT_to_SUBMITTED
          - endpoints[POST /expense-reports/{id}/submit]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Empty-set / zero-count boundary on a different metric (line count) and a
          different endpoint (/expense-reports/{id}/submit). The precondition
          requires at least one ExpenseLine with line_status == ACTIVE — i.e., the
          ACTIVE-line count must be >= 1. Submitting with zero ACTIVE lines (empty
          set) is rejected; submitting with exactly one ACTIVE line succeeds.
        test_recipe:
          setup:
            - "Trip APPROVED; ExpenseReport created with zero lines."
          trigger:
            - "POST /expense-reports/{id}/submit (zero lines)."
            - "Add one valid MEAL line meal_was_provided=true (so no receipt required, IN_POLICY, amount=0)."
            - "POST /expense-reports/{id}/submit again (one ACTIVE line)."
          assert:
            - "First submit: HTTP 409 with error_id == ERR_INVALID_STATE — empty-set boundary."
            - "Second submit: HTTP 200, ExpenseReport.status == SUBMITTED — count >= 1 succeeds."
            - "Boundary value is exactly count == 0 (fail) vs count == 1 (pass) — pinned at zero, not at 'small'."

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: card_issue_requires_trip_approved
        grounds:
          - state_machines.VirtualCard.REQUESTED_to_ISSUED
          - state_machines.Trip
          - validations[priority=6]
          - errors[ERR_CROSS_ENTITY_STATE]
          - endpoints[POST /virtual-cards/{id}/issue]
        distinguishing_aspect: |
          Entity pair: VirtualCard depends on Trip. VirtualCard's
          REQUESTED→ISSUED transition is blocked if Trip.status != APPROVED.
          Different entity pair from the report→trip pair below.
        test_recipe:
          setup:
            - "Trip in SUBMITTED state (not yet approved)."
            - "VirtualCard created in REQUESTED state for this trip (assume creation allows REQUESTED on any pre-approved trip for the purposes of this test; if scaffold blocks creation, create after approval then move trip back via /request-changes → DRAFT → /submit cycle to land in SUBMITTED with card already REQUESTED)."
          trigger:
            - "FINANCE_REVIEWER POST /virtual-cards/{id}/issue."
          assert:
            - "HTTP 409 with error_id == ERR_CROSS_ENTITY_STATE."
            - "After Manager /approves the trip, retry /issue succeeds — proving the dependency is on Trip.status==APPROVED specifically."

      - name: report_submit_requires_trip_approved_or_completed
        grounds:
          - state_machines.ExpenseReport.DRAFT_to_SUBMITTED
          - state_machines.Trip
          - validations[priority=6]
          - errors[ERR_CROSS_ENTITY_STATE]
          - endpoints[POST /expense-reports/{id}/submit]
        distinguishing_aspect: |
          Different entity pair: ExpenseReport depends on Trip (and specifically on
          a different state set: {APPROVED, COMPLETED}). Distinct from the
          VirtualCard→Trip dependency in entity, endpoint, and allowed-state
          predicate (single-state vs set-of-two-states).
        test_recipe:
          setup:
            - "Trip in DRAFT (just created, never submitted)."
            - "Attempt to create ExpenseReport on a DRAFT trip — should fail at create. Alternative: create report when trip is APPROVED, then cancel the trip (Trip → CANCELLED), report still in DRAFT."
            - "Adjusted: Trip APPROVED, ExpenseReport DRAFT with one ACTIVE line. Traveler /cancels the trip (allowed: report still DRAFT). Trip.status now CANCELLED."
          trigger:
            - "POST /expense-reports/{id}/submit."
          assert:
            - "HTTP 409 with error_id == ERR_CROSS_ENTITY_STATE."
            - "Counter-case: when Trip.status is APPROVED or COMPLETED, the same submit succeeds."

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: expense_date_within_trip_window_inclusive
        grounds:
          - validations[priority=10]
          - errors[ERR_EXPENSE_OUTSIDE_TRIP_WINDOW]
          - entities.Trip.fields.start_date
          - entities.Trip.fields.end_date
          - endpoints[POST /expense-reports/{report_id}/lines]
        distinguishing_aspect: |
          Interval semantics: closed interval [start_date, end_date], where the
          resource is the Trip and the candidate occupation is the ExpenseLine
          date. A line on the boundary day (expense_date == end_date) is
          ACCEPTED (inclusive). A line one day past end_date is REJECTED.
        test_recipe:
          setup:
            - "Trip APPROVED with start_date=2025-06-02T00:00:00Z, end_date=2025-06-04T00:00:00Z."
            - "ExpenseReport DRAFT."
          trigger:
            - "Add MEAL line on expense_date=2025-06-04T00:00:00Z (boundary)."
            - "Add MEAL line on expense_date=2025-06-05T00:00:00Z (one day past)."
          assert:
            - "Boundary line: HTTP 201, line created."
            - "Past-boundary line: HTTP 422 with error_id == ERR_EXPENSE_OUTSIDE_TRIP_WINDOW."

      - name: per_diem_rate_effective_window_half_open
        grounds:
          - entities.PerDiemRate.fields.effective_from
          - entities.PerDiemRate.fields.effective_to
          - calculations.trip_budget_estimate
          - validations[priority=11]
          - errors[ERR_PER_DIEM_UNAVAILABLE]
          - endpoints[POST /trips/{id}/submit]
        distinguishing_aspect: |
          Different interval semantics — half-open [effective_from, effective_to)
          on a different resource (PerDiemRate) — and different geometric
          treatment from the closed-interval Trip check. A trip whose start_date
          equals effective_to of the only matching row is REJECTED (effective_to
          is exclusive). A trip whose start_date equals effective_from is
          ACCEPTED (effective_from is inclusive).
        test_recipe:
          setup:
            - "PerDiemRate row R: city='Boston', state='MA', effective_from='2025-06-01T00:00:00Z', effective_to='2025-07-01T00:00:00Z'. No other rows for Boston MA."
            - "Two trips drafted: Trip A with start_date='2025-06-01T00:00:00Z' (boundary at effective_from); Trip B with start_date='2025-07-01T00:00:00Z' (boundary at effective_to)."
          trigger:
            - "POST /trips/{A}/submit."
            - "POST /trips/{B}/submit."
          assert:
            - "Trip A /submit: HTTP 200 (effective_from is inclusive)."
            - "Trip B /submit: HTTP 422 with error_id == ERR_PER_DIEM_UNAVAILABLE (effective_to is exclusive — no rate covers exactly that instant)."

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: virtual_card_authorization_drift_zero_on_report_reject
        grounds:
          - entities.VirtualCard.fields.authorized_amount_cents
          - state_machines.ExpenseReport.IN_REVIEW_to_REJECTED
          - state_machines.ExpenseLine.line_status_ACTIVE_to_VOIDED
          - endpoints[POST /expense-reports/{id}/reject]
        distinguishing_aspect: |
          Conserved quantity: VirtualCard.authorized_amount_cents. Invariant:
          for any VirtualCard VC and any sequence S of (create line with
          virtual_card_id=VC, amount X) followed by (report-reject that voids
          the line), VC.authorized_amount_cents after the sequence MUST equal
          VC.authorized_amount_cents before the sequence. Formula:
          VC.authorized_amount_cents_after == VC.authorized_amount_cents_before
          for all such (forward, compensating) pairs.
        test_recipe:
          setup:
            - "Trip APPROVED, VirtualCard VC1 ACTIVE with authorized_amount_cents=0."
            - "ExpenseReport DRAFT."
          trigger:
            - "Capture VC1.authorized_amount_cents_before = 0."
            - "Add ExpenseLine L (category=LODGING, amount_claimed_cents=10000, virtual_card_id=VC1) with valid receipt → assume line.amount_reimbursable_cents = 10000 and VC1.authorized_amount_cents increments to 10000."
            - "Submit report; claim; reject report."
          assert:
            - "After reject, line.line_status == VOIDED."
            - "VC1.authorized_amount_cents == 0 == authorized_amount_cents_before — drift is exactly zero."
            - "Generalized: for any X, after (create line X) + (report-reject), the named quantity is unchanged."

      - name: report_policy_violation_count_drift_zero_on_oop_cycle
        grounds:
          - entities.ExpenseReport.fields.policy_violation_count
          - state_machines.ExpenseLine.policy_status_PENDING_EVAL_to_OUT_OF_POLICY
          - state_machines.OutOfPolicyApproval.AWAITING_L2_to_DENIED
          - state_machines.ExpenseLine.policy_status_OUT_OF_POLICY_to_OOP_DENIED
          - endpoints[POST /oop-approvals/{id}/deny]
        distinguishing_aspect: |
          Different conserved quantity: ExpenseReport.policy_violation_count
          (a count, not a cents amount). Invariant: for any forward action that
          increments policy_violation_count by 1 (creating an OUT_OF_POLICY line)
          paired with a compensating action that resolves it to OOP_DENIED, the
          delta is zero. Formula: count_after == count_before, even though the
          internal state machine has moved.
        test_recipe:
          setup:
            - "Trip APPROVED, ExpenseReport DRAFT with no lines initially. policy_violation_count_before = 0."
          trigger:
            - "Add MEAL line with amount_claimed_cents=3000 (over per_meal_cap of 2000) → policy_status=OUT_OF_POLICY, parent policy_violation_count += 1 = 1."
            - "Open OOP approval for the line; manager L1-approves; finance L2-DENIES (skipping straight to denial at L2)."
          assert:
            - "Immediately after line creation: policy_violation_count == 1."
            - "After L2 deny: OutOfPolicyApproval.chain_level == DENIED AND ExpenseLine.policy_status == OOP_DENIED."
            - "Counter-spec: the scaffold pins that OOP_DENIED is NOT counted by policy_violation_count (only OUT_OF_POLICY is); therefore policy_violation_count == 0 == policy_violation_count_before. Drift is zero across the forward/compensating pair."
