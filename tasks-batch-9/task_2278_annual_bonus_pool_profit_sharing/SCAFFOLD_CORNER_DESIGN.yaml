            - "ParticipantAward.${aw_ada}.final_award_cents == 4000000"
            - "BusinessUnitPool.${pool_id}.allocated_cents == 4000000"
            - "BusinessUnitPool.${pool_id}.distribution_status == WITHIN_GUIDELINES"

      - name: error_accrual_period_gap_is_returned_by_the_tiling_probe
        claim_type: Violation → Error
        grounds:
          - errors.ERR_ACCRUAL_PERIOD_GAP
        excluded_because:
          difficulty_instance: resource_temporal_overlap / accrual_periods_must_tile_closed_inclusive_with_no_gap_and_no_overlap
          rationale: "The gap branch of the closed-inclusive accrual tiling is asserted there as the second attempt of that instance."

      - name: error_accrual_period_overlap_is_returned_by_the_tiling_probe
        claim_type: Violation → Error
        grounds:
          - errors.ERR_ACCRUAL_PERIOD_OVERLAP
        excluded_because:
          difficulty_instance: resource_temporal_overlap / accrual_periods_must_tile_closed_inclusive_with_no_gap_and_no_overlap
          rationale: "The one-day overlap branch of the same tiling probe returns this error there."

      - name: error_deferred_awards_pending_at_settlement
        claim_type: Violation → Error
        grounds:
          - errors.ERR_DEFERRED_AWARDS_PENDING
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / settlement_blocked_while_a_dispute_holds_an_award_deferred
          rationale: "Settlement is refused there while one award still sits at payment_status DEFERRED behind a live dispute."

      - name: error_funding_multiplier_zero_below_the_curve_floor
        claim_type: Violation → Error
        grounds:
          - errors.ERR_FUNDING_MULTIPLIER_ZERO
        excluded_because:
          difficulty_instance: boundary_precision_check / funding_curve_floor_at_blended_eighty_versus_seventy_nine_point_nine_nine
          rationale: "The 79.99 side of the floor boundary returns this error there, one hundredth of a point below the 80.00 side that funds."

      - name: error_pool_calibration_pending_at_plan_lock
        claim_type: Violation → Error
        grounds:
          - errors.ERR_POOL_CALIBRATION_PENDING
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / plan_lock_requires_every_sibling_pool_calibrated
          rationale: "The lock is refused there because a sibling pool has not reached CALIBRATED."

      - name: error_award_not_eligible_for_allocation
        claim_type: Violation → Error
        grounds:
          - errors.ERR_AWARD_NOT_ELIGIBLE
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / allocation_refused_because_participant_left_as_bad_leaver
          rationale: "Allocation to an award whose eligibility_status became INELIGIBLE_BAD_LEAVER returns this error there."

      - name: error_guideline_ratio_breach_on_allocation
        claim_type: Violation → Error
        grounds:
          - errors.ERR_GUIDELINE_RATIO_BREACH
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / guideline_ratio_breach_wins_over_pool_funds_exceeded
          rationale: "The guideline band breach is the returned error of that priority pair."

      - name: error_leave_interval_overlap_on_eligibility_event
        claim_type: Violation → Error
        grounds:
          - errors.ERR_LEAVE_INTERVAL_OVERLAP
        excluded_because:
          difficulty_instance: resource_temporal_overlap / adjacent_leave_allowed_but_overlapping_leave_rejected_half_open
          rationale: "The overlapping-leave branch returns this error there, against an adjacent-leave control that is accepted."

      - name: error_plan_not_in_allocation_on_allocation_write
        claim_type: Violation → Error
        grounds:
          - errors.ERR_PLAN_NOT_IN_ALLOCATION
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / plan_phase_state_error_wins_over_pool_funds_exceeded
          rationale: "The plan-phase gate is the returned error of that priority pair."

      - name: error_pool_not_within_guidelines_at_calibration_submission
        claim_type: Violation → Error
        grounds:
          - errors.ERR_POOL_NOT_WITHIN_GUIDELINES
        excluded_because:
          difficulty_instance: boundary_precision_check / under_utilization_floor_cent_at_calibration_submission
          rationale: "The one-cent-below-floor side of the utilization boundary returns this error there."

  - section: rbac
    instances:
      - name: committee_only_operations_attempted_by_other_roles_rejected
        claim_type: Cannot perform other roles' exclusive_operations
        grounds:
          - roles.CompensationCommittee
          - validations.priority_20
          - errors.ERR_UNAUTHORIZED
          - endpoints."POST /bonus-plans/{planId}/certification-decision"
          - endpoints."POST /bonus-plans/{planId}/fund-pool"
        distinguishing_aspect: |
          Certification and funding are the committee's exclusive operations, and
          priority 20 sits above every state and business rule: the FinanceController
          attempt is refused with 403 even though the plan is genuinely certifiable,
          and the PlanAdmin attempt to mint the money is refused with 403 rather
          than the ERR_PLAN_STATE_INVALID that the same call would earn from an
          authorized actor in this state. The committee then performs the same
          certification successfully, proving the denials were about the role, not
          about the request.
        test_recipe:
          setup:
            - "Plan PENDING_CERTIFICATION with all metric actuals filed and the single pool scorecard certified."
          setup_api_calls:
            - call: "POST /business-units"
              payload: { unit_code: "K5", name: "Unit K5" }
              as: PlanAdmin
              captures: { unit_id: "$.data.id" }
            - call: "POST /bonus-plans"
              payload: { plan_year: 2026, plan_name: "FY26 Role Boundary Plan", plan_period_start: "2026-01-01", plan_period_end: "2027-01-01", payment_date: "2027-03-15", company_weight_pct: 50.00, business_unit_weight_pct: 30.00, individual_weight_pct: 20.00 }
              as: PlanAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /job-level-targets"
              payload: { plan_id: "${plan_id}", job_level: "L5", target_bonus_pct: 20.00, guideline_min_ratio: 0.25, guideline_max_ratio: 2.00 }
              as: PlanAdmin
            - call: "POST /company-metrics"
              payload: { plan_id: "${plan_id}", metric_code: "REVENUE", weight_pct: 100.00, threshold_value: 900, target_value: 1000, max_value: 1200 }
              as: PlanAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /bu-pools"
              payload: { plan_id: "${plan_id}", business_unit_id: "${unit_id}" }
              as: PlanAdmin
              captures: { pool_id: "$.data.id" }
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", business_unit_id: "${unit_id}", employee_code: "E951", full_name: "Ada Long", job_level: "L5", base_salary_cents: 20000000, hire_date: "2025-03-01" }
              as: PlanAdmin
              captures: { p_ada: "$.data.id" }
            - call: "POST /company-metrics/${m_id}/actual"
              payload: { actual_value: 1000, source_note: "audited revenue" }
              as: PlanAdmin
            - call: "POST /bu-pools/${pool_id}/submit-scorecard"
              payload: { bu_metric_achievement_pct: 100.00, scorecard_narrative: "unit result filed" }
              as: BusinessUnitManager
              as_user_id: "${unit_id}"
            - call: "POST /bu-pools/${pool_id}/scorecard-decision"
              payload: { decision: "CERTIFY" }
              as: CompensationCommittee
              as_user_id: "cc_scorecard"
            - call: "POST /bonus-plans/${plan_id}/target-assignments"
              payload: {}
              as: PlanAdmin
            - call: "POST /bonus-plans/${plan_id}/submit-for-certification"
              payload: {}
              as: PlanAdmin
          trigger:
            - call: "POST /bonus-plans/${plan_id}/certification-decision"
              payload: { decision: "CERTIFY", decision_note: "finance tries to certify" }
              as: FinanceController
              as_user_id: "fc_1"
            - call: "POST /bonus-plans/${plan_id}/fund-pool"
              payload: {}
              as: PlanAdmin
            - call: "POST /bonus-plans/${plan_id}/certification-decision"
              payload: { decision: "CERTIFY", decision_note: "committee certifies" }
              as: CompensationCommittee
              as_user_id: "cc_certifier"
          assert:
            - "Attempt 1 (FinanceController certifying): HTTP 403, error_id == ERR_UNAUTHORIZED"
            - "Attempt 2 (PlanAdmin funding): HTTP 403, error_id == ERR_UNAUTHORIZED"
            - "Attempt 2 does NOT return ERR_PLAN_STATE_INVALID — priority 20 outranks the phase gate at 60"
            - "After both denials BonusPlan.${plan_id}.status == PENDING_CERTIFICATION and BonusPlan.${plan_id}.certified_by_user_id is null"
            - "Attempt 3 (CompensationCommittee certifying): HTTP 200, BonusPlan.${plan_id}.status == CERTIFIED"
            - "BonusPlan.${plan_id}.certified_by_user_id == 'cc_certifier'"
            - "BonusPlan.${plan_id}.funded_pool_cents == 0"
            - "BonusPlan.${plan_id}.funding_multiplier == 1.0000"

      - name: manager_of_another_unit_cannot_touch_this_pool_rejected
        claim_type: peer_roles
        grounds:
          - roles.BusinessUnitManager
          - validations.priority_55
          - errors.ERR_FORBIDDEN_RESOURCE_OWNERSHIP
          - endpoints."POST /participant-awards/{awardId}/propose-allocation"
          - endpoints."POST /bu-pools/{poolId}/submit-calibration"
        distinguishing_aspect: |
          BusinessUnitManager is entity_backed:BusinessUnit, so the acting
          X-User-ID must equal the resource's business_unit_id. The intruding
          manager holds a real, existing unit id (K7) and sends a request that
          would be legal for the owning manager — an at-target amount with the
          current pool version — so the refusal is ownership (55), not
