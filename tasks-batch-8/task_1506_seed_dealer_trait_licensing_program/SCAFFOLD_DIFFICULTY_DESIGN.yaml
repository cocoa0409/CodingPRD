  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (2 instances, different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: trait_agreement_active_suspended_cycle_twice
        grounds:
          - state_machines.TraitAgreement.ACTIVE_to_SUSPENDED
          - state_machines.TraitAgreement.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          TraitAgreement is cyclic (ACTIVE <-> SUSPENDED via suspend/reinstate), unlike the
          sibling instance's parallel dimensions on SeedOrder. The cycle is traversed twice
          (ACTIVE -> SUSPENDED -> ACTIVE -> SUSPENDED) and every hop is observable.
        test_recipe:
          setup:
            - "Grower G (ACTIVE) and trait package VT2P (LISTED, requires agreement) exist"
            - "Agreement A for (G, VT2P), window [2026-08-01, 2027-12-31], created with OCC on grower version and signed (default clock 2026-08-01T00:00:00Z is inside the window)"
          setup_api_calls:
            - call: "POST /dealer/growers"
              payload: { account_name: "Smith Farms", external_ref: "EXT-001", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { g: $.data.id, gver: $.data.version }
            - call: "POST /dealer/trait-packages"
              payload: { code: "VT2P", description: "VT Double PRO", requires_stewardship_agreement: true, refuge_required_bps: 500 }
              as: DealerAdmin
              captures: { tp: $.data.id }
            - call: "POST /dealer/trait-agreements"
              payload: { grower_id: "${g}", trait_package_id: "${tp}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-12-31T23:59:59Z", expected_grower_version: "${gver}" }
              as: DealerAdmin
              captures: { a: $.data.id }
            - call: "POST /dealer/trait-agreements/${a}/sign"
              as: DealerAdmin
              captures: { st1: $.data.status }
          trigger:
            - call: "POST /dealer/trait-agreements/${a}/suspend"
              payload: { reason: "STEWARDSHIP_VIOLATION" }
              as: DealerAdmin
              captures: { st2: $.data.status }
            - call: "POST /dealer/trait-agreements/${a}/reinstate"
              as: DealerAdmin
              captures: { st3: $.data.status }
            - call: "POST /dealer/trait-agreements/${a}/suspend"
              payload: { reason: "PAPERWORK" }
              as: DealerAdmin
              captures: { st4: $.data.status, reason4: $.data.suspension_reason }
          assert:
            - "after sign: status == ACTIVE"
            - "after first suspend: status == SUSPENDED"
            - "after reinstate: status == ACTIVE (loop closed)"
            - "after second suspend: status == SUSPENDED with suspension_reason == PAPERWORK (cycle repeatable, reason refreshed)"

      - name: order_payment_and_fulfillment_dimensions_evolve_independently
        grounds:
          - state_machines.SeedOrder.UNPAID_to_PREPAID
          - state_machines.DeliveryTicket.SCHEDULED_to_COMPLETED
          - entities.SeedOrder.fields.payment_status
          - entities.SeedOrder.fields.fulfillment_status
        distinguishing_aspect: |
          SeedOrder carries parallel state dimensions: payment_status (UNPAID -> PREPAID)
          advances while fulfillment_status stays NONE, then two delivery completions move
          fulfillment NONE -> PARTIAL -> DELIVERED while payment_status stays PREPAID.
          Unlike the sibling's single cyclic axis, neither dimension gates the other.
        test_recipe:
          setup:
            - "Program (standard tiers, capacity 1000) OPEN; grower G ACTIVE; SOY-V2 @18000; lot 1000 units"
            - "Order of 40 units confirmed 2026-09-15 (tier-1 1200bps -> per-unit 15840, gross 633600, rebate 0)"
