          setup:
            - "Logical clock 2026-09-10T14:00:00Z. Site SITE-A; AGE_RESTRICTED product SKU-BEER-A 999 stocked 10; adult customer; pickers Pat/Sam; driver Dee (run 4); order sealed to AWAITING_HANDOFF; bag created and assigned."
