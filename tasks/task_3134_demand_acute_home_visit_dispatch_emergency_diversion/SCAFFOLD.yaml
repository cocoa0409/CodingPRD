    input: [outcome]
    output: TriageAssessment
    side_effects: ["outcome set", "submitted_at = now", "VisitRequest status cascades; on EMERGENCY_DIVERTED an EmsHandoff row is created"]
  - method: GET
    path: "/dh/triage-assessments/{id}/ems-handoff"
    description: "Fetch the EMS handoff for a diverted triage (0 or 1 row)"
    roles: [PlatformAdmin, TriageNurse, Dispatcher]
    code: 200
    input: []
    output: "EmsHandoff[]"
    side_effects: []

  # --- DispatchAssignment ---
  - method: GET
    path: "/dh/dispatch-assignments"
    description: "List dispatch assignments (filtered)"
    roles: [PlatformAdmin, Dispatcher, TriageNurse]
    code: 200
    input: ["care_team_id?", "vehicle_shift_id?", "visit_request_id?", "status?", "limit?", "offset?"]
    output: "DispatchAssignment[]"
    side_effects: []
  - method: GET
    path: "/dh/dispatch-assignments/{id}"
    description: "Get one dispatch assignment"
    roles: [PlatformAdmin, Dispatcher, TriageNurse, CareTeamMember]
    code: 200
    input: []
    output: DispatchAssignment
    side_effects: []
  - method: POST
    path: "/dh/dispatch-assignments/{id}/accept"
    description: "Care team accepts an OFFERED dispatch"
    roles: [CareTeamMember]
    code: 200
    input: []
    output: DispatchAssignment
    side_effects: ["status → EN_ROUTE (composite)", "accepted_at = now", "VisitRequest.sla_deadline_at computed", "VisitRequest.status → EN_ROUTE"]
  - method: POST
    path: "/dh/dispatch-assignments/{id}/reject"
    description: "Care team rejects an OFFERED dispatch (returns VisitRequest to TRIAGED)"
    roles: [CareTeamMember]
    code: 200
    input: []
    output: DispatchAssignment
    side_effects: ["status → REJECTED", "VisitRequest.status → TRIAGED", "CareTeam counters updated"]
  - method: POST
    path: "/dh/dispatch-assignments/{id}/cancel"
    description: "Dispatcher cancels an OFFERED dispatch"
    roles: [Dispatcher]
    code: 200
    input: []
    output: DispatchAssignment
    side_effects: ["status → CANCELLED", "VisitRequest.status → TRIAGED"]
  - method: POST
    path: "/dh/dispatch-assignments/{id}/arrive"
    description: "Mark arrival on scene; creates OnSiteEncounter"
    roles: [CareTeamMember]
    code: 200
    input: []
    output: OnSiteEncounter
    side_effects: ["DispatchAssignment.status → ARRIVED", "OnSiteEncounter created (status=STARTED)", "VisitRequest.status → ON_SCENE", "sla_breached latched"]

  # --- OnSiteEncounter ---
  - method: GET
    path: "/dh/encounters"
    description: "List encounters (filtered)"
    roles: [PlatformAdmin, Dispatcher, TriageNurse, AdvancedPracticeProvider]
    code: 200
    input: ["visit_request_id?", "dispatch_assignment_id?", "status?", "limit?", "offset?"]
    output: "OnSiteEncounter[]"
    side_effects: []
  - method: GET
    path: "/dh/encounters/{id}"
    description: "Get one encounter"
    roles: [PlatformAdmin, Dispatcher, TriageNurse, AdvancedPracticeProvider, SupervisingPhysician]
    code: 200
    input: []
    output: OnSiteEncounter
    side_effects: []
  - method: GET
    path: "/dh/encounters/{id}/diagnostic-orders"
    description: "List diagnostic orders under an encounter (sub-resource reverse-reachability)"
    roles: [PlatformAdmin, AdvancedPracticeProvider, FieldTechnician, SupervisingPhysician, BillingSpecialist]
    code: 200
    input: []
    output: "DiagnosticOrder[]"
    side_effects: []
  - method: POST
    path: "/dh/encounters/{id}/diagnostic-orders"
    description: "Create a diagnostic order"
    roles: [AdvancedPracticeProvider]
    code: 201
    input: [order_kind, code, units, "physician_preauth_obtained?", "physician_preauth_by?"]
    output: DiagnosticOrder
    side_effects: ["status = ORDERED", "OnSiteEncounter.status: STARTED → DIAGNOSTICS (first order only)"]
  - method: POST
    path: "/dh/encounters/{id}/begin-disposition-review"
    description: "Move encounter to DISPOSITION_REVIEW"
    roles: [AdvancedPracticeProvider]
    code: 200
    input: []
    output: OnSiteEncounter
    side_effects: ["status → DISPOSITION_REVIEW"]
  - method: POST
    path: "/dh/encounters/{id}/disposition-decisions"
    description: "Record disposition (DISCHARGE_HOME | ESCALATE_TO_FACILITY)"
    roles: [AdvancedPracticeProvider]
    code: 201
    input: [disposition, rationale, "receiving_facility_id?"]
    output: DispositionDecision
    side_effects: ["Encounter ends; Claim auto-created (DRAFT); on DISCHARGE_HOME, MonitoringCheckIn schedule initialized; on ESCALATE_TO_FACILITY, FacilityTransport row created"]
  - method: POST
    path: "/dh/encounters/{id}/abort"
    description: "Abort an encounter with zero orders"
    roles: [AdvancedPracticeProvider]
    code: 200
    input: []
    output: OnSiteEncounter
    side_effects: ["status → ABORTED", "VisitRequest.status → TRIAGED"]
  - method: GET
    path: "/dh/encounters/{id}/disposition-decisions"
    description: "List disposition decisions for the encounter (0 or 1)"
    roles: [PlatformAdmin, TriageNurse, AdvancedPracticeProvider]
    code: 200
    input: []
    output: "DispositionDecision[]"
    side_effects: []

  # --- DiagnosticOrder ---
  - method: GET
    path: "/dh/diagnostic-orders/{id}"
    description: "Get one diagnostic order"
    roles: [PlatformAdmin, AdvancedPracticeProvider, FieldTechnician, SupervisingPhysician, BillingSpecialist]
    code: 200
    input: []
    output: DiagnosticOrder
    side_effects: []
  - method: POST
    path: "/dh/diagnostic-orders/{id}/collect"
    description: "Field tech collects the specimen / performs imaging"
    roles: [FieldTechnician]
    code: 200
    input: []
    output: DiagnosticOrder
    side_effects: ["status → COLLECTED"]
  - method: POST
    path: "/dh/diagnostic-orders/{id}/result"
    description: "Field tech results the order (computes line_amount_cents)"
    roles: [FieldTechnician]
    code: 200
    input: [result_value]
    output: DiagnosticOrder
    side_effects: ["status → RESULTED", "line_amount_cents computed", "Claim totals recomputed if claim exists"]
  - method: POST
    path: "/dh/diagnostic-orders/{id}/verify"
    description: "Supervising physician verifies the result (SoD: != result actor)"
    roles: [SupervisingPhysician]
    code: 200
    input: []
    output: DiagnosticOrder
    side_effects: ["status → VERIFIED"]
  - method: POST
    path: "/dh/diagnostic-orders/{id}/amend"
    description: "Field tech amends a RESULTED order (cyclic RESULTED → AMENDED)"
    roles: [FieldTechnician]
    code: 200
    input: [result_value]
    output: DiagnosticOrder
    side_effects: ["status → AMENDED", "result_value updated"]
  - method: POST
    path: "/dh/diagnostic-orders/{id}/cancel"
    description: "APP cancels an ORDERED diagnostic"
    roles: [AdvancedPracticeProvider]
    code: 200
    input: []
    output: DiagnosticOrder
    side_effects: ["status → CANCELLED", "Claim.provisional_total_cents recomputed"]

  - method: GET
    path: "/dh/diagnostic-orders/{id}/claim-lines"
    description: "List claim lines referencing this diagnostic order (sub-resource reverse-reachability)"
    roles: [PlatformAdmin, BillingSpecialist, PayerAdjudicator]
    code: 200
    input: []
    output: "ClaimLine[]"
    side_effects: []

  # --- DispositionDecision / FacilityTransport ---
  - method: GET
    path: "/dh/disposition-decisions/{id}"
    description: "Get one disposition decision"
    roles: [PlatformAdmin, TriageNurse, AdvancedPracticeProvider]
    code: 200
    input: []
    output: DispositionDecision
    side_effects: []
  - method: GET
    path: "/dh/disposition-decisions/{id}/facility-transport"
    description: "Get the FacilityTransport for an ESCALATE_TO_FACILITY decision (0 or 1)"
    roles: [PlatformAdmin, Dispatcher, TriageNurse]
    code: 200
    input: []
    output: "FacilityTransport[]"
    side_effects: []
  - method: POST
    path: "/dh/facility-transports/{id}/mark-arrived"
    description: "Mark facility transport arrived"
    roles: [Dispatcher]
    code: 200
    input: []
    output: FacilityTransport
    side_effects: ["status → ARRIVED_AT_FACILITY", "VisitRequest.status → CLAIM_DRAFT"]
  - method: POST
    path: "/dh/facility-transports/{id}/cancel"
    description: "Cancel a DISPATCHED transport (escalation reversed)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: FacilityTransport
    side_effects: ["status → CANCELLED", "VisitRequest.status → ON_SCENE"]

  # --- Claim / ClaimLine ---
  - method: GET
    path: "/dh/claims"
    description: "List claims"
    roles: [PlatformAdmin, BillingSpecialist, PayerAdjudicator]
    code: 200
    input: ["visit_request_id?", "payer_contract_id?", "status?", "limit?", "offset?"]
    output: "Claim[]"
    side_effects: []
  - method: GET
    path: "/dh/claims/{id}"
    description: "Get one claim"
    roles: [PlatformAdmin, BillingSpecialist, PayerAdjudicator]
    code: 200
    input: []
    output: Claim
    side_effects: []
  - method: GET
    path: "/dh/claims/{id}/claim-lines"
    description: "List claim lines under a claim (sub-resource reverse-reachability)"
    roles: [PlatformAdmin, BillingSpecialist, PayerAdjudicator]
    code: 200
    input: []
    output: "ClaimLine[]"
    side_effects: []
  - method: POST
    path: "/dh/claims/{id}/submit"
    description: "Submit a DRAFT claim"
    roles: [BillingSpecialist]
    code: 200
    input: [expected_visit_request_version]
    output: Claim
    side_effects: ["status → SUBMITTED", "submitted_at = now", "VisitRequest.status → CLAIM_SUBMITTED", "VisitRequest.version += 1"]
  - method: POST
    path: "/dh/claims/{id}/adjudicate"
    description: "Payer adjudicates a SUBMITTED claim"
    roles: [PayerAdjudicator]
    code: 200
    input: [outcome]
    output: Claim
    side_effects: ["status → ADJUDICATED_PAID | ADJUDICATED_DENIED", "adjudicated_at = now"]
  - method: POST
    path: "/dh/claims/{id}/appeal"
    description: "Appeal a DENIED claim"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Claim
    side_effects: ["status → APPEALED"]
  - method: POST
    path: "/dh/claims/{id}/resubmit"
    description: "Resubmit an APPEALED claim (cycle; max 2 appeals)"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Claim
    side_effects: ["status → SUBMITTED", "submitted_at = now"]

  # --- FollowUpNotice ---
  - method: GET
    path: "/dh/follow-up-notices/{id}"
    description: "Get one follow-up notice"
    roles: [PlatformAdmin, TriageNurse]
    code: 200
    input: []
    output: FollowUpNotice
    side_effects: []
  - method: POST
    path: "/dh/follow-up-notices/{id}/mark-sent"
    description: "Mark a QUEUED notice as SENT"
    roles: [TriageNurse]
    code: 200
    input: []
    output: FollowUpNotice
    side_effects: ["status → SENT", "sent_at = now"]
  - method: POST
    path: "/dh/follow-up-notices/{id}/mark-failed"
    description: "Mark a QUEUED notice as FAILED"
    roles: [TriageNurse]
    code: 200
    input: []
    output: FollowUpNotice
    side_effects: ["status → FAILED"]

  # --- MonitoringCheckIn ---
  - method: GET
    path: "/dh/monitoring-checkins/{id}"
    description: "Get one monitoring check-in"
    roles: [PlatformAdmin, TriageNurse]
    code: 200
    input: []
    output: MonitoringCheckIn
    side_effects: []
  - method: POST
    path: "/dh/monitoring-checkins/{id}/complete"
    description: "Complete a check-in (outcome STABLE|WORSENING|EMERGENT; EMERGENT spawns new VisitRequest)"
    roles: [TriageNurse]
    code: 200
    input: [outcome]
    output: MonitoringCheckIn
    side_effects: ["status → COMPLETED", "completed_at = now", "if outcome=EMERGENT: new VisitRequest auto-created"]
  - method: POST
    path: "/dh/monitoring-checkins/{id}/escalate"
    description: "Escalate a MISSED check-in (spawns new VisitRequest)"
    roles: [TriageNurse]
    code: 200
    input: []
    output: MonitoringCheckIn
    side_effects: ["status → ESCALATED", "new VisitRequest auto-created"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not resolve" }
  - { id: ERR_FK_NOT_FOUND, http: 404, condition: "Body FK (patient_id, market_id, care_team_id, etc.) does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, type mismatch, enum violation, or shape violation" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_visit_request_version does not match current VisitRequest.version (OCC)" }
  - { id: ERR_VR_INVALID_STATE, http: 409, condition: "VisitRequest not in a state from which the requested transition is defined" }
  - { id: ERR_TRIAGE_NOT_DRAFT, http: 409, condition: "TriageAssessment.outcome != DRAFT at submit" }
  - { id: ERR_TRIAGE_ALREADY_EXISTS, http: 409, condition: "Second TriageAssessment for the same VisitRequest" }
  - { id: ERR_RED_FLAG_REQUIRES_EMS, http: 422, condition: "Red-flag symptom present but outcome != EMERGENCY_DIVERTED" }
  - { id: ERR_ACUITY_TOO_HIGH_FOR_DECLINE, http: 422, condition: "outcome=INAPPROPRIATE but acuity_score >= 30" }
  - { id: ERR_ACUITY_TOO_LOW_FOR_DIVERSION, http: 422, condition: "outcome=EMERGENCY_DIVERTED but acuity_score < 80 and no red-flag" }
  - { id: ERR_MARKET_INACTIVE, http: 409, condition: "MarketCoverageArea.is_active == false on intake or dispatch" }
  - { id: ERR_OUT_OF_COVERAGE, http: 422, condition: "Patient home_address_geo lies outside the chosen market polygon" }
  - { id: ERR_NO_AVAILABLE_CARE_TEAM, http: 409, condition: "Dispatch selector found zero eligible CareTeams" }
  - { id: ERR_SHIFT_NOT_OPERATIONAL, http: 409, condition: "VehicleShift not in SCHEDULED/ACTIVE, or logical clock outside [window_start, window_end)" }
  - { id: ERR_SHIFT_WINDOW_NOT_OPEN, http: 409, condition: "VehicleShift start: logical clock not in [window_start, window_end)" }
  - { id: ERR_SHIFT_WINDOW_INVALID, http: 400, condition: "VehicleShift window_end <= window_start" }
  - { id: ERR_TEAM_HAS_ACTIVE_DISPATCH, http: 409, condition: "CareTeam go-off-duty or shift close attempted with active_dispatch_count > 0" }
  - { id: ERR_NOT_ASSIGNED_TEAM_MEMBER, http: 403, condition: "Acting user is not app_user_id or tech_user_id of the assigned CareTeam" }
  - { id: ERR_DISPATCH_INVALID_STATE, http: 409, condition: "DispatchAssignment not in the from-state for the action" }
  - { id: ERR_ENCOUNTER_INVALID_STATE, http: 409, condition: "OnSiteEncounter not in the from-state for the action" }
  - { id: ERR_ENCOUNTER_HAS_ORDERS, http: 409, condition: "Encounter abort attempted with >= 1 DiagnosticOrder" }
  - { id: ERR_UNRESOLVED_DIAGNOSTICS, http: 409, condition: "begin-disposition-review or disposition with any order in {ORDERED, COLLECTED}" }
  - { id: ERR_FORMULARY_CAP_EXCEEDED, http: 422, condition: "IV_INFUSION units for the encounter exceed FormularyEntry.max_units_per_visit" }
  - { id: ERR_PREAUTH_REQUIRED, http: 422, condition: "IV drug requires physician preauth; missing or wrong physician id" }
  - { id: ERR_RESULT_REQUIRED, http: 400, condition: "DiagnosticOrder result: result_value missing" }
  - { id: ERR_AMEND_NO_CHANGE, http: 422, condition: "DiagnosticOrder amend: new result_value identical to current" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "DiagnosticOrder verify: actor is the same user who resulted the order" }
  - { id: ERR_FACILITY_REQUIRED, http: 400, condition: "Disposition ESCALATE_TO_FACILITY missing receiving_facility_id" }
  - { id: ERR_RATIONALE_TOO_SHORT, http: 400, condition: "Disposition rationale shorter than 20 characters" }
  - { id: ERR_CLAIM_INVALID_STATE, http: 409, condition: "Claim not in the from-state for the action" }
  - { id: ERR_CLAIM_CAP_EXCEEDED, http: 422, condition: "Claim final_total_cents > PayerContract.max_claim_cents" }
  - { id: ERR_CONTRACT_NOT_IN_FORCE, http: 422, condition: "PayerContract not ACTIVE or effective window does not contain encounter.ended_at" }
  - { id: ERR_CONTRACT_WINDOW_INVALID, http: 400, condition: "PayerContract effective_from >= effective_to" }
  - { id: ERR_APPEAL_LIMIT_REACHED, http: 422, condition: "Claim resubmit: appeal round already at 2" }
  - { id: ERR_CHECKIN_NOT_DUE, http: 409, condition: "MonitoringCheckIn complete before scheduled_at" }
  - { id: ERR_CHECKIN_INVALID_STATE, http: 409, condition: "MonitoringCheckIn not in the from-state for the action" }
  - { id: ERR_PCP_MISMATCH, http: 422, condition: "FollowUpNotice pcp_npi does not match Patient.pcp_npi" }
  - { id: ERR_TRANSPORT_INVALID_STATE, http: 409, condition: "FacilityTransport not in DISPATCHED for the action" }
  - { id: ERR_NOTICE_INVALID_STATE, http: 409, condition: "FollowUpNotice not in QUEUED for the action" }
  - { id: ERR_CONTRACT_INVALID_STATE, http: 409, condition: "PayerContract not in the from-state for the action" }
  - { id: ERR_TEAM_INVALID_STATE, http: 409, condition: "CareTeam not in the from-state for the action" }
  - { id: ERR_MARKET_CODE_TAKEN, http: 409, condition: "MarketCoverageArea.market_code must be unique" }
  - { id: ERR_SHIFT_OVERLAP, http: 409, condition: "VehicleShift for the same care_team overlaps an existing shift window (half-open [start,end) intersection)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operational administrator; manages markets, payer contracts, formulary, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /dh/_clock/set_current_utc"
      - "POST /dh/markets"
      - "POST /dh/payer-contracts, /activate, /terminate"
      - "POST /dh/payer-contracts/{id}/formulary-entries"
    shared_operations:
      - "GET endpoints for read-only inspection"
      - "POST /dh/patients"

  - name: TriageNurse
    description: "Registered nurse performing intake triage and post-visit follow-up"
    identity: opaque
    exclusive_operations:
      - "POST /dh/visit-requests"
      - "POST /dh/visit-requests/{id}/triage-assessments"
      - "POST /dh/triage-assessments/{id}/submit"
      - "POST /dh/visit-requests/{id}/follow-up-notices"
      - "POST /dh/visit-requests/{id}/monitoring-checkins"
      - "POST /dh/monitoring-checkins/{id}/complete, /escalate"
      - "POST /dh/follow-up-notices/{id}/mark-sent, /mark-failed"
    shared_operations:
      - "GET endpoints for read-only inspection"
      - "POST /dh/patients"

  - name: Dispatcher
    description: "Dispatch operator; manages care teams, vehicle shifts, dispatch offers, transports"
    identity: opaque
    exclusive_operations:
      - "POST /dh/care-teams, /go-available, /go-off-duty"
      - "POST /dh/vehicle-shifts, /start, /extend, /close, /cancel"
      - "POST /dh/visit-requests/{id}/dispatch-offers"
      - "POST /dh/dispatch-assignments/{id}/cancel"
      - "POST /dh/facility-transports/{id}/mark-arrived, /cancel"
    shared_operations:
      - "GET endpoints"
      - "POST /dh/visit-requests (facility-side intake)"

  - name: CareTeamMember
    description: "An APP or FieldTechnician acting on their own dispatch assignment (X-User-ID must match the team's app_user_id or tech_user_id)"
    identity: opaque
    exclusive_operations:
      - "POST /dh/dispatch-assignments/{id}/accept"
      - "POST /dh/dispatch-assignments/{id}/reject"
      - "POST /dh/dispatch-assignments/{id}/arrive"
    shared_operations:
      - "GET /dh/dispatch-assignments/{id}"

  - name: AdvancedPracticeProvider
    description: "APP on the care team; creates diagnostic orders, records dispositions"
    identity: opaque
    exclusive_operations:
      - "POST /dh/encounters/{id}/diagnostic-orders"
      - "POST /dh/encounters/{id}/begin-disposition-review"
      - "POST /dh/encounters/{id}/disposition-decisions"
      - "POST /dh/encounters/{id}/abort"
      - "POST /dh/diagnostic-orders/{id}/cancel"
    shared_operations:
      - "GET endpoints"

  - name: FieldTechnician
    description: "Field tech on the care team; collects and results diagnostic orders"
    identity: opaque
    exclusive_operations:
      - "POST /dh/diagnostic-orders/{id}/collect"
      - "POST /dh/diagnostic-orders/{id}/result"
      - "POST /dh/diagnostic-orders/{id}/amend"
    shared_operations:
      - "GET endpoints"

  - name: SupervisingPhysician
    description: "Remote physician overseeing the care team; verifies diagnostic orders (SoD-separated from FieldTechnician)"
    identity: opaque
    exclusive_operations:
      - "POST /dh/diagnostic-orders/{id}/verify"
    shared_operations:
      - "GET endpoints"

  - name: BillingSpecialist
    description: "Billing staff; submits and appeals claims"
    identity: opaque
    exclusive_operations:
      - "POST /dh/claims/{id}/submit"
      - "POST /dh/claims/{id}/appeal"
      - "POST /dh/claims/{id}/resubmit"
    shared_operations:
      - "GET endpoints"

  - name: PayerAdjudicator
    description: "Payer-side adjudicator; adjudicates submitted claims"
    identity: opaque
    exclusive_operations:
      - "POST /dh/claims/{id}/adjudicate"
    shared_operations:
      - "GET endpoints"
