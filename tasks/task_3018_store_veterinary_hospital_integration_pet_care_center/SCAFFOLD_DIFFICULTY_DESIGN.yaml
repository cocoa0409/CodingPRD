# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3018_store_veterinary_hospital_integration_pet_care_center
#
# Machine-readable index of every §0.5 difficulty feature this scaffold
# exhibits, cross-referenced from §1.1–§1.7. Nine rule_id blocks, 2 instances
# each = 18 instances. Every test_recipe is a structured, call-by-call chain
# replayable against SCAFFOLD.yaml §1.5 from empty-DB.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: package_cycle_credit_tax_order_dual_variant
        grounds:
          - calculations.package_cycle_total_cents
          - calculations.package_cycle_total_cents.variants
          - validations[priority=14]
          - endpoints.POST_/stores/{storeId}/members/{memberId}/service-packages/{packageId}/billing-cycles
        distinguishing_aspect: "The base and credit_tax_exempt variants of package_cycle_total_cents differ only in the order of the overage-credit deduction and the tax application: for the same 2-grooming-plus-1-vet cycle they produce 16387.50 versus 16433.75, so the two valid readings of 'credit applied to the billing cycle' are numerically distinguishable."
        test_recipe:
          setup:
            - "Logical clock 2026-06-01T00:00:00Z, then 2026-07-01T00:00:00Z for the cycle advance"
            - "Store ST-0301 in state CA with hospital_capacity 6"
            - "Member Dana with home store ST-0301, status ACTIVE"
            - "ServicePackage at tier PLUS, billing_cycle_count 3, state_sales_tax_rate 0.0925, monthly_fee_cents 0 (so the PLUS default 6999 applies)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "ST-0301", city: "Sacramento", state_code: "CA", service_bay_count: 4, hospital_capacity: 6 }
              as: PlatformAdmin
              captures: { store_a_id: $.data.id }
            - call: "POST /stores/members"
              payload: { full_name: "Dana Alvarez", email: "dana@example.com", state_code: "CA", home_store_id: "${store_a_id}" }
              as: StoreManager
              captures: { member_id: $.data.id }
            - call: "POST /stores/${store_a_id}/members/${member_id}/service-packages"
              payload: { tier: "PLUS", member_state_code: "CA", state_sales_tax_rate: 0.0925, billing_cycle_count: 3, monthly_fee_cents: 0 }
              as: StoreManager
              captures: { package_id: $.data.id, package_v: $.data.version }
            - call: "GET /stores/service-packages/${package_id}"
              payload: {}
              as: Any
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /stores/${store_a_id}/members/${member_id}/service-packages/${package_id}/billing-cycles"
              payload: { expected_package_version: "${package_v}", grooming_visits_consumed: 2, vet_visits_consumed: 1, vaccine_visits_consumed: 0 }
              as: StoreManager
              captures: { cycle_id: $.data.id }
          assert:
            - "the billing cycle created by the trigger has cycle_total_cents == 16387.50"
            - "the same figure under the credit_tax_exempt variant would be 16433.75, so the two variants are distinguishable on this single input"
            - "PackageBillingCycle.tax_cents == 1387.50 and cycle_total_cents - tax_cents == 15000.00"
            - "ServicePackage.consumed_visits == 3 and ServicePackage.cycles_consumed == 1"

      - name: dispensing_price_dual_variant_on_encounter_charge
        grounds:
          - calculations.encounter_charge_reconciliation
          - calculations.encounter_charge_reconciliation.variants
          - entities.PrescriptionAuthorization.fields.price_at_authorization_cents
          - endpoints.GET_/stores/{storeId}/veterinary-encounters/{encounterId}/charge-summary
        distinguishing_aspect: "The provisional capture of the encounter charge and the finalized on-read reconciliation price the same dispensed pharmacy order from two different source fields — the frozen price_at_authorization_cents versus the live PrescriptionAuthorization.unit_price_cents — so raising the live unit price after authorisation makes the two variants disagree by exactly that delta."
        test_recipe:
          setup:
            - "Logical clock 2026-06-01T00:00:00Z"
            - "Store ST-0302 in CA with hospital_capacity 4; one GROOMING bay and one VETERINARY bay"
            - "Member Elena, pet Biscuit (CANINE, Labrador Retriever, 28.0 kg)"
            - "A VETERINARY booking already driven to IN_SERVICE, with encounter E scheduled on 2026-06-02 and checked in, so the exam can start"
            - "A DIET prescription of 2 units at unit_price_cents 6000 raised against E while E is SCHEDULED, so it starts PENDING_EXAM"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "ST-0302", city: "Fresno", state_code: "CA", service_bay_count: 2, hospital_capacity: 4 }
              as: PlatformAdmin
              captures: { store_b_id: $.data.id }
            - call: "POST /stores/members"
              payload: { full_name: "Elena Novak", email: "elena@example.com", state_code: "CA", home_store_id: "${store_b_id}" }
              as: StoreManager
              captures: { member_b_id: $.data.id }
            - call: "POST /stores/pets"
              payload: { member_id: "${member_b_id}", name: "Biscuit", species: "CANINE", breed: "Labrador Retriever", weight_kg: 28.0 }
              as: GroomingStaff
              captures: { pet_b_id: $.data.id , pet_v: $.data.version }
            - call: "POST /stores/${store_b_id}/service-bays"
              payload: { bay_code: "VETERINARY" }
              as: StoreManager
              captures: { vbay_id: $.data.id }
            - call: "POST /stores/${store_b_id}/service-bookings"
              payload: { bay_id: "${vbay_id}", pet_id: "${pet_b_id}", service_type: "VETERINARY", starts_at: "2026-06-02T09:00:00Z", expected_pet_version: "${pet_b_id_v}", ends_at: "2026-06-02T10:00:00Z" }
              as: GroomingStaff
              captures: { booking_b_id: $.data.id, booking_b_v: $.data.version }
            - call: "POST /stores/${store_b_id}/service-bookings/${booking_b_id}/confirm-bay"
              payload: { expected_booking_version: "${booking_b_v}", expected_pet_version: "${pet_b_v}" }
              as: StoreManager
              captures: { booking_b_v2: $.data.version }
            - call: "POST /stores/${store_b_id}/service-bookings/${booking_b_id}/start-service"
              payload: { expected_booking_version: "${booking_b_v2}" }
              as: GroomingStaff
            - call: "POST /stores/${store_b_id}/veterinary-encounters"
              payload: { pet_id: "${pet_b_id}", clinician_name: "Dr. Imani Cole", scheduled_at: "2026-06-02T09:15:00Z", booking_id: "${booking_b_id}" }
              as: VeterinaryStaff
              captures: { encounter_id: $.data.id, encounter_v: $.data.version }
            - call: "POST /stores/${store_b_id}/prescription-authorizations"
              payload: { pet_id: "${pet_b_id}", encounter_id: "${encounter_id}", item_type: "DIET", item_name: "Renal Support K/D", sku: "SKU-DIET-77", unit_price_cents: 6000, quantity: 2 }
              as: VeterinaryStaff
              captures: { auth_id: $.data.id }
            - call: "POST /stores/${store_b_id}/veterinary-encounters/${encounter_id}/check-in"
              payload: { expected_encounter_version: "${encounter_v}" }
              as: VeterinaryStaff
              captures: { encounter_v2: $.data.version }
            - call: "POST /stores/${store_b_id}/veterinary-encounters/${encounter_id}/start-exam"
              payload: { expected_encounter_version: "${encounter_v2}" }
              as: VeterinaryStaff
          trigger:
            - call: "POST /stores/${store_b_id}/veterinary-encounters/${encounter_id}/complete-exam"
              payload: { expected_encounter_version: "${encounter_v}" }
              as: VeterinaryStaff
          assert:
            - "the complete-exam response reports charge_total_cents == 20500, being EXAM_CHARGE_CENTS 8500 plus price_at_authorization_cents 12000"
            - "PrescriptionAuthorization.${auth_id}.status == AUTHORIZED and its price_at_authorization_cents == 12000"
            - "PrescriptionAuthorization.${auth_id}.unit_price_cents remains 6000, so the frozen price term and the live price term are different fields"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: grooming_screening_score_nested_caps
        grounds:
          - calculations.grooming_screening_score
          - calculations.grooming_handling_level
          - entities.BreedHandlingRule
          - state_machines.ServiceBooking.REQUESTED_to_SCREENED
        distinguishing_aspect: "Instance (a): grooming_screening_score has four inputs with two nested ceilings — pet_risk_points capped at 100 and breed_risk_points conditionally capped at 25 when it exceeds 25 — so a pet with 40 accumulated risk points and a HIGH_RISK breed rule scores 80, below the 105 that an uncapped sum would give and below the 160 hard ceiling."
        test_recipe:
          setup:
            - "Logical clock 2026-06-01T00:00:00Z"
            - "Store ST-0303 in CA; one GROOMING bay"
            - "Member Rosa, pet Rex (CANINE, German Shepherd, 38.0 kg, so 5 weight-band points and NOT the 40 kg tier)"
            - "BreedHandlingRule for German Shepherd / CANINE with risk_points 30, handling_tier HIGH_RISK, allowed_for_grooming true"
            - "Rex accumulates 40 risk points from two earlier incident claims of 25 and 15 points"
            - "A grooming booking for Rex whose pet risk and breed rule are both in place before screening"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "ST-0303", city: "Long Beach", state_code: "CA", service_bay_count: 3, hospital_capacity: 5 }
              as: PlatformAdmin
              captures: { store_c_id: $.data.id }
            - call: "POST /stores/members"
              payload: { full_name: "Rosa Ferrer", email: "rosa@example.com", state_code: "CA", home_store_id: "${store_c_id}" }
              as: StoreManager
              captures: { member_c_id: $.data.id }
            - call: "POST /breed-handling-rules"
              payload: { breed: "German Shepherd", species: "CANINE", risk_points: 30, handling_tier: "HIGH_RISK", allowed_for_grooming: true }
              as: PlatformAdmin
              captures: { rule_c_id: $.data.id }
            - call: "POST /stores/pets"
              payload: { member_id: "${member_c_id}", name: "Rex", species: "CANINE", breed: "German Shepherd", weight_kg: 38.0 }
              as: GroomingStaff
              captures: { pet_c_id: $.data.id , pet_v: $.data.version }
            - call: "POST /stores/${store_c_id}/service-bays"
              payload: { bay_code: "GROOMING" }
              as: StoreManager
              captures: { gbay_c_id: $.data.id }
            - call: "POST /stores/${store_c_id}/service-bookings"
              payload: { bay_id: "${gbay_c_id}", pet_id: "${pet_c_id}", service_type: "GROOMING", starts_at: "2026-06-02T09:00:00Z", expected_pet_version: "${pet_c_id_v}", ends_at: "2026-06-02T10:00:00Z" }
              as: GroomingStaff
              captures: { booking_c_id: $.data.id }
          trigger:
            - call: "POST /stores/${store_c_id}/service-bookings/${booking_c_id}/screen"
              payload: { health_condition_points: 0, aggression_acknowledged: true, expected_pet_version: "${pet_c_id}" }
              as: GroomingStaff
          assert:
            - "the screening response reports screening_score == 35, being min(0, 100) pet points plus the breed rule capped at min(30, 25) plus 5 weight-band points for 38.0 kg (which is below the 40.0 kg tier) plus 0 condition points"
            - "handling_level == HIGH_RISK because the matched breed's handling_tier is HIGH_RISK, even though screening_score 35 is far below the 70 score threshold"
            - "ServiceBooking.${booking_c_id}.status == SCREENED and one GroomingRiskScreening row exists for it with risk_total == 35"

      - name: monthly_membership_rounding_order
        grounds:
          - calculations.package_tier_included_credits
          - calculations.outstanding_balance_ledger
          - calculations.outstanding_balance_ledger.variants
          - endpoints.POST_/stores/{storeId}/members/{memberId}/service-packages
        distinguishing_aspect: "Instance (b): nested rounding with a pinned order — the PLUS monthly fee is rounded to a whole 7646.41 cent before multiplying by billing_cycle_count 3, giving total_price_cents 22939.23; rounding the three-cycle product afterwards yields 22939.22, so the pinned order is observable in a single cent."
        test_recipe:
          setup:
            - "Logical clock 2026-06-01T00:00:00Z"
            - "Store ST-0304 in CA; member Priya with home store ST-0304"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "ST-0304", city: "San Jose", state_code: "CA", service_bay_count: 3, hospital_capacity: 5 }
              as: PlatformAdmin
              captures: { store_d_id: $.data.id }
            - call: "POST /stores/members"
              payload: { full_name: "Priya Raman", email: "priya@example.com", state_code: "CA", home_store_id: "${store_d_id}" }
              as: StoreManager
              captures: { member_d_id: $.data.id }
          trigger:
            - call: "POST /stores/${store_d_id}/members/${member_d_id}/service-packages"
              payload: { tier: "PLUS", member_state_code: "CA", state_sales_tax_rate: 0.0925, billing_cycle_count: 3, monthly_fee_cents: 0 }
              as: StoreManager
              captures: { package_d_id: $.data.id }
          assert:
            - "ServicePackage.${package_d_id}.monthly_total_cents == 7646.41, being round_half_up(6999 * 1.0925, 2)"
            - "ServicePackage.${package_d_id}.total_price_cents == 22939.23, which is monthly_total_cents * 3 and NOT round_half_up(6999 * 1.0925 * 3, 2) == 22939.22"
            - "ServicePackage.${package_d_id}.grooming_visits_included == 2 and vet_visits_included == 1 and vaccine_visits_included == 1, so included_visits_total == 4"
            - "Member.${member_d_id}.outstanding_balance_cents == 22939.23"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: service_bay_freeze_thaw_cycle
        grounds:
          - state_machines.ServiceBay.ACTIVE_to_FROZEN
          - state_machines.ServiceBay.FROZEN_to_ACTIVE
          - state_machines.ServiceBay.ACTIVE_to_DISABLED
          - state_machines.Store.RESTRICTED_to_FROZEN
        distinguishing_aspect: "ServiceBay's lifecycle is cyclic rather than a pipeline: ACTIVE → FROZEN → ACTIVE is reachable any number of times through the parent store's posture, so a bay that has been frozen and thawed must still be schedulable afterwards and DISABLED remains the only exit."
        test_recipe:
          setup:
            - "Logical clock 2026-06-01T00:00:00Z"
            - "Store ST-0305 in CA with hospital_capacity 5; one GROOMING bay"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "ST-0305", city: "Modesto", state_code: "CA", service_bay_count: 2, hospital_capacity: 5 }
              as: PlatformAdmin
              captures: { store_e_id: $.data.id, store_e_v: $.data.version }
            - call: "POST /stores/${store_e_id}/service-bays"
              payload: { bay_code: "GROOMING" }
              as: StoreManager
              captures: { bay_e_id: $.data.id }
            - call: "POST /stores/${store_e_id}/freeze-hospital"
              payload: { expected_store_version: "${store_e_v}" }
              as: PlatformAdmin
          trigger:
            - call: "POST /stores/${store_e_id}/reopen-hospital"
              payload: { expected_store_version: "${store_e_v}" }
              as: PlatformAdmin
          assert:
            - "ServiceBay.${bay_e_id}.status == ACTIVE again after the thaw, proving the ACTIVE → FROZEN → ACTIVE cycle closes"
            - "ServiceBay.${bay_e_id}.is_frozen == false and version has advanced by exactly one per state change"

      - name: service_booking_parallel_screening_and_occupancy_dimensions
        grounds:
          - state_machines.ServiceBooking.REQUESTED_to_SCREENED
          - state_machines.ServiceBooking.SCREENED_to_REQUESTED
          - state_machines.ServiceBooking.BAY_CONFIRMED_to_BAY_CONFIRMED
          - state_machines.ServiceBooking.REQUESTED_to_BAY_CONFIRMED
          - calculations.hospital_occupancy_posture
        distinguishing_aspect: "ServiceBooking carries two independent progression axes on one row: the screening axis (REQUESTED → SCREENED → REQUESTED on validity lapse) and the occupancy axis (REQUESTED → BAY_CONFIRMED with a BAY_CONFIRMED → BAY_CONFIRMED self-loop for window widening), and a non-grooming booking enters the occupancy axis directly from REQUESTED without ever touching the screening axis."
        test_recipe:
          setup:
            - "Logical clock 2026-06-01T00:00:00Z"
            - "Store ST-0306 in CA; member Sela; pet Mango (CANINE, Beagle, 12.0 kg); one GROOMING bay and one TRAINING bay"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "ST-0306", city: "Bakersfield", state_code: "CA", service_bay_count: 2, hospital_capacity: 5 }
              as: PlatformAdmin
              captures: { store_f_id: $.data.id }
            - call: "POST /stores/members"
              payload: { full_name: "Sela Whitfield", email: "sela@example.com", state_code: "CA", home_store_id: "${store_f_id}" }
              as: StoreManager
              captures: { member_f_id: $.data.id }
            - call: "POST /stores/pets"
              payload: { member_id: "${member_f_id}", name: "Mango", species: "CANINE", breed: "Beagle", weight_kg: 12.0 }
              as: GroomingStaff
              captures: { pet_f_id: $.data.id , pet_v: $.data.version }
            - call: "POST /stores/${store_f_id}/service-bays"
              payload: { bay_code: "TRAINING" }
              as: StoreManager
              captures: { tbay_f_id: $.data.id }
          trigger:
            - call: "POST /stores/${store_f_id}/service-bookings"
              payload: { bay_id: "${tbay_f_id}", pet_id: "${pet_f_id}", service_type: "TRAINING", starts_at: "2026-06-03T09:00:00Z", expected_pet_version: "${pet_f_id_v}", ends_at: "2026-06-03T10:00:00Z" }
              as: GroomingStaff
              captures: { booking_f_id: $.data.id, booking_f_v: $.data.version, booking_f_petv: $.data.pet_version }
          assert:
            - "ServiceBooking.${booking_f_id}.status == REQUESTED and status is never SCREENED for a TRAINING booking"
            - "the screening axis is untouched: the booking has screening_score == 0 and handling_level is null"
            - "POST /stores/${store_f_id}/service-bookings/${booking_f_id}/confirm-bay with expected_booking_version ${booking_f_v} is admissible directly from REQUESTED for a non-grooming booking, which is the branch that does not exist for grooming"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: clinic_freeze_blocks_visits_and_invalidates_certificates
        grounds:
          - state_machines.Store.OPEN_to_RESTRICTED
          - state_machines.Store.RESTRICTED_to_FROZEN
          - state_machines.VaccinationClinic.OPEN_to_FROZEN
          - state_machines.VaccinationVisit.CERTIFICATE_ISSUED_to_BLOCKED
          - calculations.pet_rabies_expiry_reconciliation
        distinguishing_aspect: "Depth-3 chain C-b: the store's posture change mutates each VaccinationVisit (REGISTERED or CERTIFICATE_ISSUED → BLOCKED), and that visit mutation is what independently flips the RabiesCertificate's is_effective and then nulls Pet.rabies_vaccination_expires_at — hop 3 is caused by the visit's change, not by the store's."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T09:00:00Z, a Monday"
            - "Store ST-0401 in CA with hospital_capacity 5; member Theo; pet Juniper (CANINE, Beagle, 11.0 kg)"
            - "An OPEN vaccination clinic on 2026-09-21 with open_time 09:00 and close_time 17:00, coverage not required"
            - "A walk-in visit for Juniper that has already been issued a CA rabies certificate, so the certificate is effective and Pet.rabies_vaccination_expires_at is 2029-09-20T09:00:00Z"
            - "An OPEN→RESTRICTED escalation is admissible only at occupancy >= capacity, so a store with 6 bays and 5 capacity must first be saturated through the occupancy bump endpoint to reach the RESTRICTED posture"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "ST-0401", city: "Riverside", state_code: "CA", service_bay_count: 2, hospital_capacity: 1 }
              as: PlatformAdmin
              captures: { store_g_id: $.data.id, store_g_v: $.data.version }
            - call: "POST /stores/members"
              payload: { full_name: "Theo Bright", email: "theo@example.com", state_code: "CA", home_store_id: "${store_g_id}" }
              as: StoreManager
              captures: { member_g_id: $.data.id }
            - call: "POST /stores/pets"
              payload: { member_id: "${member_g_id}", name: "Juniper", species: "CANINE", breed: "Beagle", weight_kg: 11.0 }
              as: GroomingStaff
              captures: { pet_g_id: $.data.id , pet_v: $.data.version }
            - call: "POST /stores/${store_g_id}/vaccination-clinics"
              payload: { clinic_date: "2026-09-21T00:00:00Z", open_time: "2026-09-21T09:00:00Z", close_time: "2026-09-21T17:00:00Z" }
              as: VaccinationStaff
              captures: { clinic_g_id: $.data.id, clinic_g_v: $.data.version }
            - call: "POST /stores/${store_g_id}/vaccination-clinics/${clinic_g_id}/open-walk-ins"
              payload: { expected_clinic_version: "${clinic_g_v}" }
              as: VaccinationStaff
            - call: "POST /stores/${store_g_id}/vaccination-visits"
              payload: { clinic_id: "${clinic_g_id}", pet_id: "${pet_g_id}", vaccine_type: "RABIES" }
              as: VaccinationStaff
              captures: { visit_g_id: $.data.id, visit_g_v: $.data.version }
            - call: "POST /stores/${store_g_id}/vaccination-visits/${visit_g_id}/issue-certificate"
              payload: { expected_visit_version: "${visit_g_v}" }
              as: VaccinationStaff
          trigger:
            - call: "POST /stores/${store_g_id}/restrict"
              payload: { expected_store_version: "${store_g_v}" }
              as: PlatformAdmin
          assert:
            - "VaccinationVisit.${visit_g_id}.status == BLOCKED, the depth-1 hop"
            - "GET /stores/pets/${pet_g_id} reports rabies_vaccination_expires_at == null because the certificate hop flipped is_effective to false and no other effective certificate exists for Juniper, the depth-3 hop"
            - "GET /stores/vaccination-visits/${visit_g_id}/rabies-certificate returns one certificate whose is_effective == false and whose expires_at is still 2029-09-20T09:00:00Z"

      - name: exam_completion_authorizes_prescriptions_and_raises_pharmacy_orders
        grounds:
          - state_machines.VeterinaryEncounter.IN_EXAM_to_COMPLETED
          - state_machines.PrescriptionAuthorization.PENDING_EXAM_to_AUTHORIZED
          - state_machines.PharmacyOrder.REQUESTED_to_AUTHORIZED
          - state_machines.VeterinaryEncounter.SCHEDULED_to_CHECKED_IN
        distinguishing_aspect: "Depth-3 chain C-c: completing the exam authorizes each PrescriptionAuthorization, and that authorization is what releases each PharmacyOrder from REQUESTED to AUTHORIZED — the pharmacy hop is caused by the authorization's change rather than directly by the exam, and the pharmacy hop is suppressed while the store's pharmacy_hold_until is in the future."
        test_recipe:
          setup:
            - "Logical clock 2026-06-01T00:00:00Z"
