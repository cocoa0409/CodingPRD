            - "captured l_bal == 40000 (5000 + 10000 royalties + 25000 fee)"
      - name: minimum_floor_equality_no_double_count
        claim_type: precision
        grounds: ["calculations.royalty_due_calculation"]
        distinguishing_aspect: "Boundary of max(): computed royalty exactly equal to the floor (10000 == min 10000) yields final 10000 once — the floor adds nothing when it merely ties."
        test_recipe:
