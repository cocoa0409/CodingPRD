  # ---------------------------------------------------------------------------
  - section: cross_cutting
    instances:
      - name: occ_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[plan-change-stale-subscription]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Plan-change with expected_subscription_version one behind current (${v} - 1) returns 412 ERR_STALE_VERSION; the same call with the current version succeeds."
        test_recipe:
          setup: ["PLATFORM ACTIVE DPLUS_ADS subscription at version v; HULU_ADS plan exists"]
          setup_api_calls:
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /streaming/plans"
              payload: { plan_code: "DPLUS_ADS", plan_kind: "STANDALONE", service_scope: ["DPLUS"], ad_tier: "AD_SUPPORTED", monthly_price_cents: 799, allow_app_store_billing: true, allow_distributor_billing: true }
              as: PlatformAdmin
            - call: "POST /streaming/plans"
              payload: { plan_code: "HULU_ADS", plan_kind: "STANDALONE", service_scope: ["HULU"], ad_tier: "AD_SUPPORTED", monthly_price_cents: 899, allow_app_store_billing: true, allow_distributor_billing: true }
              as: PlatformAdmin
            - call: "POST /streaming/subscriber-accounts"
              payload: { email: "cc1@x.com", full_name: "CC One" }
              as: Anonymous
              captures: { sa_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/billing-accounts"
              payload: { biller_type: "PLATFORM", biller_reference: "platform" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { ba_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/service-profiles"
              payload: { service: "DPLUS" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { prof_dplus: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/service-profiles"
              payload: { service: "HULU" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { prof_hulu: $.data.id }
            - call: "POST /streaming/subscriptions"
              payload: { subscriber_account_id: "${sa_id}", billing_account_id: "${ba_id}", plan_code: "DPLUS_ADS", dplus_service_profile_id: "${prof_dplus}" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { sub_id: $.data.id, sub_v: $.data.version }
            - call: "POST /streaming/subscriptions/${sub_id}/plan-change"
              payload: { new_plan_code: "HULU_ADS", expected_subscription_version: "${sub_v} - 1" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { err: $.data.error_id }
          trigger:
            - call: "POST /streaming/subscriptions/${sub_id}/plan-change"
              payload: { new_plan_code: "HULU_ADS", expected_subscription_version: "${sub_v}" }
              as: Subscriber
              as_user_id: "${sa_id}"
          assert:
            - "stale call returned HTTP 412 with error_id == ERR_STALE_VERSION"
            - "current-version call returns HTTP 200"
            - "Subscription.${sub_id}.plan_code == HULU_ADS"
            - "Subscription.${sub_id}.version == ${sub_v} + 1"

      - name: occ_migration_confirm_stale_after_requote
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[migration-confirm-stale-migration]
        distinguishing_aspect: "Confirm carrying a Migration version one behind (${mig_v} - 1) returns 412 ERR_STALE_VERSION; with the exact current version the confirm succeeds — OCC on the migration resource."
        test_recipe:
