          - errors[ERR_DUPLICATE_TARIFF_CODE]
          - endpoints[POST /servicing/utility-tariffs]
        distinguishing_aspect: "The uniqueness key is the PAIR (utility_code, tariff_code): re-publishing PGE/NEM2-ETOUC is refused, while SCE/NEM2-ETOUC is a legitimately distinct tariff and must be accepted."
        test_recipe:
