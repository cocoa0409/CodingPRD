  - rule_id: boundary_precision_check
    instances:

      - name: petition_weighted_support_rounds_onto_the_threshold_and_qualifies
        grounds:
          - calculations.petition_support
          - entities.PetitionDrive.fields.weighted_support_pct
          - entities.PetitionDrive.fields.short_reason
          - state_machines.PetitionDrive.OPEN_to_QUALIFIED
        distinguishing_aspect: |
          Support of 59,995,000 out of 100,000,000 is 0.59995 in exact arithmetic — below the 0.6000
          threshold — but the single pinned round_half_up to four decimals lifts it to exactly 0.6000
          and the >= comparison qualifies the drive. One thousand cents less, 59,994,000, rounds to
          0.5999 and fails. The pair pins both the rounding direction and the inclusivity of >=.
        test_recipe:
          setup:
            - "district X in PETITION_CIRCULATING with three assessable properties whose prior-year revenue sums to exactly 100,000,000 and whose largest holds 59,995,000"
            - "district Y identical except the largest property holds 59,994,000, the other two making up the same 100,000,000 total"
            - "one FORMATION drive per district, each signed only by the largest property"
          setup_api_calls:
            - *k_clock_form
            - call: "POST /districts"
              payload: { name: "Bayfront Tourism Improvement District", assessment_method: "PCT_OF_ROOM_REVENUE", included_zones: ["ZONE_CORE"], formation_threshold_pct: 0.6000, renewal_threshold_pct: 0.6500, renewal_headcount_threshold_pct: 0.7500, term_years: 1, current_fiscal_year: 2027 }
