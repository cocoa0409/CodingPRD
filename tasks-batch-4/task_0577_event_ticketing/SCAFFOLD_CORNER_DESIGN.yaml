  # ---------------------------------------------------------------------------
  # Corners already exercised by §1.8 difficulty instances (stubs, no test_recipe)
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: order_service_fee_rounding_order
        claim_type: Correct Result
        grounds: [calculations.order_service_fee]
        excluded_because:
          difficulty_instance: combinatorial_formula / order_service_fee_round_per_seat_then_sum
          rationale: "Per-seat-then-sum rounding of the service fee is asserted (3998 vs 3997) by the named §1.8 instance."
      - name: dynamic_price_platinum_floor_clamp
        claim_type: Constants Applied
        grounds: [calculations.dynamic_seat_price]
        excluded_because:
          difficulty_instance: combinatorial_formula / dynamic_seat_price_tiered_platinum_clamp
          rationale: "Platinum floor + tier + clamp interaction (20000) is asserted by the named §1.8 instance."
      - name: settlement_gross_vs_net_variants
        claim_type: Variant Divergence
        grounds: [calculations.settlement_net_to_promoter]
        excluded_because:
          difficulty_instance: dual_variant_calc / settlement_gross_vs_net_to_promoter
          rationale: "gross_face_cents vs net_to_promoter_cents divergence asserted by the named §1.8 instance."
      - name: seat_price_locked_vs_current_variant
        claim_type: Variant Selection
        grounds: [calculations.dynamic_seat_price]
        excluded_because:
          difficulty_instance: dual_variant_calc / seat_price_locked_final_vs_current_dynamic
          rationale: "Locked-final vs current-dynamic price divergence asserted by the named §1.8 instance."
      - name: buyer_credit_conservation
        claim_type: Correct Result
        grounds: [calculations.buyer_credit_ledger]
        excluded_because:
          difficulty_instance: compensating_invariant / money_conservation_credit_refund_equals_amount
          rationale: "CREDIT refund raises credit_balance_cents by exactly amount_cents in the named §1.8 instance."
      - name: seat_inventory_conservation
        claim_type: Correct Result
        grounds: [calculations.seat_inventory_counts]
        excluded_because:
          difficulty_instance: compensating_invariant / seat_count_conservation_hold_then_release
          rationale: "seats_available+held+sold==total_capacity conservation asserted by the named §1.8 instance."

  - section: state_machines
    instances:
      - name: ticket_dimensions_parallel_deliver_scan
        claim_type: parallel
        grounds: [state_machines.Ticket.transitions.deliver, state_machines.Ticket.transitions.scan]
        excluded_because:
          difficulty_instance: non_linear_state_machine / ticket_parallel_dimensions_independent
          rationale: "Independent delivery/scan/validity dimensions asserted by the named §1.8 instance."
      - name: event_reschedule_cycle
        claim_type: cyclic
        grounds: [state_machines.Event.transitions.POSTPONED_to_ONSALE]
        excluded_because:
          difficulty_instance: non_linear_state_machine / event_onsale_postpone_onsale_cycle
          rationale: "ONSALE->POSTPONED->ONSALE cycle asserted by the named §1.8 instance."
      - name: event_cancel_cascade_down
        claim_type: Cascade down
        grounds: [state_machines.Event.transitions.to_CANCELED]
        excluded_because:
          difficulty_instance: transitive_cascade / event_cancel_cascades_order_ticket_seat
          rationale: "Event->Order->Ticket->Seat cascade asserted by the named §1.8 instance."
      - name: pay_cascade_hold_seat
        claim_type: Cross-entity
        grounds: [state_machines.Order.transitions.PENDING_to_PAID]
        excluded_because:
          difficulty_instance: transitive_cascade / pay_cascades_hold_converted_seat_sold
          rationale: "Order->Hold->Seat cascade asserted by the named §1.8 instance."

  - section: validations
    instances:
      - name: empty_seat_selection_rejected
        claim_type: Violation to Error
        grounds: ["errors[ERR_EMPTY_SEAT_SELECTION]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / empty_seat_ids_rejected_on_hold_create
          rationale: "Empty seat_ids -> ERR_EMPTY_SEAT_SELECTION asserted by the named §1.8 instance."
      - name: seat_unavailable_overlap_rejected
        claim_type: Cross-entity validation
        grounds: ["errors[ERR_SEAT_UNAVAILABLE]"]
        excluded_because:
