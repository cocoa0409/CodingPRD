      - name: paid_insertion_count_conserved_skip_then_makegood
        grounds:
          - state_machines.Insertion.SCHEDULED_to_SKIPPED
          - state_machines.Insertion.SCHEDULED_to_PUBLISHED
          - entities.Notice.fields.paid_insertion_count
          - entities.Insertion.fields.is_make_good
        distinguishing_aspect: |
          Conserved quantity = COUNT (notice.paid_insertion_count = number of PUBLISHED non-make-good
          insertions). Skipping insertion 1 (forward) and fulfilling it via a free make-good
