scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_reconciliation_carrier_vs_agency_basis
        grounds:
          - calculations.reconciliation_billing
          - entities.Invoice.fields.billing_basis
          - entities.InvoiceLineItem.fields.billed_amount_cents
          - state_machines.Invoice.SUBMITTED_to_RECONCILED
        distinguishing_aspect: |
          Dual-variant calculation on the INVOICE domain (billing): identical carrier
          flight data (50 tenths at 300000 cents/h) bills 1500000 cents under the
          PROVISIONAL carrier basis but 1470000 cents under the RECONCILED agency
          basis (agency record 49 tenths, within the 1-tenth match tolerance), and the
          variant switch happens only at the reconcile transition.
        test_recipe:
          setup:
            - "EU contract (rate 300000 cents/h), one carded aircraft, one carded pilot"
            - "dispatch order (qty 1) ACCEPTED; assignment planned 2026-08-02T08:00:00Z-10:00:00Z launched and on-incident"
            - "one flight log on 2026-08-02, hobbs 0.0 -> 5.0 (50 tenths, billable 1500000)"
            - "invoice for period 2026-08-02..2026-08-02 created DRAFT and SUBMITTED by CarrierFinance cf_1 after clock advanced to 2026-08-09"
            - "agency record for (assignment, 2026-08-02) of 49 tenths imported"
          setup_api_calls:
            - { call: "POST /contracts", payload: { contract_number: "EU-2026-001", agency: "USFS", contract_type: "EXCLUSIVE_USE", daily_availability_rate_cents: 500000, flight_hour_rate_cents: 300000, season_start_date: "2026-06-01", season_end_date: "2026-09-30", min_daily_available_minutes: 570, season_flight_hour_cap_tenths: 20000, acceptance_window_minutes: 30 }, as: CarrierOps, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/activate", payload: {}, as: CarrierOps }
            - { call: "POST /aircraft", payload: { tail_number: "N100AF", model: "AT-802F", tank_capacity_gallons: 800, contract_id: "${c_id}" }, as: CarrierOps, captures: { ac_id: $.data.id } }
            - { call: "POST /crew-members", payload: { full_name: "Pat Reed", crew_role: "PIC", contract_id: "${c_id}", qualified_aircraft_models: ["AT-802F"] }, as: CarrierOps, captures: { p_id: $.data.id } }
            - { call: "POST /carding-inspections", payload: { subject_aircraft_id: "${ac_id}", scheduled_for: "2026-07-15T08:00:00Z", valid_days: 365 }, as: CardingInspector, captures: { i_ac: $.data.id } }
            - { call: "POST /carding-inspections/${i_ac}/complete", payload: { result: "PASSED", completed_at: "2026-07-15T09:00:00Z" }, as: CardingInspector }
            - { call: "POST /carding-inspections", payload: { subject_crew_member_id: "${p_id}", scheduled_for: "2026-07-15T08:00:00Z", valid_days: 365 }, as: CardingInspector, captures: { i_pl: $.data.id } }
            - { call: "POST /carding-inspections/${i_pl}/complete", payload: { result: "PASSED", completed_at: "2026-07-15T09:00:00Z" }, as: CardingInspector }
            - { call: "POST /incidents", payload: { incident_number: "USFS-2026-0801", name: "Ridge Fire", location: "39.5,-121.5", agency: "USFS", priority: "EXTENDED_ATTACK" }, as: AgencyDispatcher, captures: { inc_id: $.data.id } }
            - { call: "POST /dispatch-orders", payload: { order_number: "O-1001", contract_id: "${c_id}", incident_id: "${inc_id}", aircraft_quantity: 1, required_model: "AT-802F" }, as: AgencyDispatcher, captures: { do_id: $.data.id } }
            - { call: "POST /dispatch-orders/${do_id}/accept", payload: {}, as: CarrierOps }
            - { call: "GET /dispatch-orders/${do_id}", as: CarrierOps, captures: { do_v: $.data.version } }
            - { call: "POST /dispatch-orders/${do_id}/assignments", payload: { aircraft_id: "${ac_id}", pilot_id: "${p_id}", planned_start: "2026-08-02T08:00:00Z", planned_end: "2026-08-02T10:00:00Z", expected_dispatch_order_version: "${do_v}" }, as: CarrierOps, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/launch", payload: {}, as: Pilot, as_user_id: "${p_id}" }
            - { call: "POST /assignments/${asg_id}/arrive", payload: {}, as: Pilot, as_user_id: "${p_id}" }
            - { call: "POST /assignments/${asg_id}/flight-logs", payload: { logged_date: "2026-08-02", hobbs_start: 0.0, hobbs_stop: 5.0 }, as: Pilot, as_user_id: "${p_id}", captures: { fl_tenths: $.data.flight_hours_tenths, fl_cents: $.data.billable_cents } }
            - { call: "GET /contracts/${c_id}", as: CarrierFinance, captures: { c_v: $.data.version } }
            - { call: "POST /contracts/${c_id}/invoices", payload: { period_start: "2026-08-02", period_end: "2026-08-02", expected_contract_version: "${c_v}" }, as: CarrierFinance, captures: { inv_id: $.data.id, inv_flight0: $.data.flight_subtotal_cents, inv_net0: $.data.net_cents } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /invoices/${inv_id}/submit", payload: {}, as: CarrierFinance, as_user_id: "cf_1" }
            - { call: "POST /agency-records", payload: { contract_id: "${c_id}", assignment_id: "${asg_id}", record_date: "2026-08-02", agency_flight_hours_tenths: 49 }, as: AgencyFinance, as_user_id: "af_1" }
          trigger:
            - { call: "POST /invoices/${inv_id}/reconcile", payload: {}, as: AgencyFinance, as_user_id: "af_1", captures: { r_status: $.data.status, r_basis: $.data.billing_basis, r_flight: $.data.flight_subtotal_cents, r_net: $.data.net_cents } }
          assert:
            - "FlightLog flight_hours_tenths == 50 and billable_cents == 1500000 (per-sortie rounding)"
            - "Invoice before reconcile: flight_subtotal_cents == 1500000, net_cents == 1500000 (PROVISIONAL carrier basis)"
            - "After reconcile: status == RECONCILED because |50 - 49| == 1 <= MATCH_TOLERANCE_TENTHS"
            - "After reconcile: billing_basis == RECONCILED, flight_subtotal_cents == 1470000, net_cents == 1470000 (agency basis 49 tenths * 300000/10)"
            - "The two variants differ by exactly 30000 cents for identical carrier logs"

      - name: crew_duty_projection_vs_chronological_actuals
        grounds:
          - calculations.crew_duty_projection
          - entities.CrewDutyDay.fields.flown_tenths
          - entities.CrewDutyDay.fields.projected_tenths
        distinguishing_aspect: |
          Dual-variant calculation on the CREW-DUTY domain (fatigue safety), a different
          entity domain than invoice billing: with identical logs (75 flown tenths) and
          one not-yet-launched 1.0 h assignment, the chronological variant reports
          flown_tenths == 75 while the forward-looking variant reports
          projected_tenths == 85, and only the forward-looking variant gates assignment
          creation (a further 0.5 h assignment is rejected at 90 > 80).
        test_recipe:
          setup:
            - "EU contract, one carded aircraft, one carded pilot P1"
            - "order1 (qty 2) ACCEPTED; assignment A (2026-08-02 08:00-09:00) ON_INCIDENT; assignment D (2026-08-02 14:00-15:00, 10 tenths) still ASSIGNED"
            - "flight log of 7.5 h on 2026-08-02 (hobbs 300.0 -> 307.5 = 75 tenths) recorded on A"
            - "order2 (qty 1) ACCEPTED, ready for a new assignment attempt"
          setup_api_calls:
            - { call: "POST /contracts", payload: { contract_number: "EU-2026-001", agency: "USFS", contract_type: "EXCLUSIVE_USE", daily_availability_rate_cents: 500000, flight_hour_rate_cents: 300000, season_start_date: "2026-06-01", season_end_date: "2026-09-30", min_daily_available_minutes: 570, season_flight_hour_cap_tenths: 20000, acceptance_window_minutes: 30 }, as: CarrierOps, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/activate", payload: {}, as: CarrierOps }
            - { call: "POST /aircraft", payload: { tail_number: "N100AF", model: "AT-802F", tank_capacity_gallons: 800, contract_id: "${c_id}" }, as: CarrierOps, captures: { ac_id: $.data.id } }
            - { call: "POST /crew-members", payload: { full_name: "Pat Reed", crew_role: "PIC", contract_id: "${c_id}", qualified_aircraft_models: ["AT-802F"] }, as: CarrierOps, captures: { p_id: $.data.id } }
            - { call: "POST /carding-inspections", payload: { subject_aircraft_id: "${ac_id}", scheduled_for: "2026-07-15T08:00:00Z", valid_days: 365 }, as: CardingInspector, captures: { i_ac: $.data.id } }
            - { call: "POST /carding-inspections/${i_ac}/complete", payload: { result: "PASSED", completed_at: "2026-07-15T09:00:00Z" }, as: CardingInspector }
            - { call: "POST /carding-inspections", payload: { subject_crew_member_id: "${p_id}", scheduled_for: "2026-07-15T08:00:00Z", valid_days: 365 }, as: CardingInspector, captures: { i_pl: $.data.id } }
            - { call: "POST /carding-inspections/${i_pl}/complete", payload: { result: "PASSED", completed_at: "2026-07-15T09:00:00Z" }, as: CardingInspector }
            - { call: "POST /incidents", payload: { incident_number: "USFS-2026-0801", name: "Ridge Fire", location: "39.5,-121.5", agency: "USFS", priority: "EXTENDED_ATTACK" }, as: AgencyDispatcher, captures: { inc_id: $.data.id } }
            - { call: "POST /dispatch-orders", payload: { order_number: "O-1001", contract_id: "${c_id}", incident_id: "${inc_id}", aircraft_quantity: 2, required_model: "AT-802F" }, as: AgencyDispatcher, captures: { do1_id: $.data.id } }
            - { call: "POST /dispatch-orders/${do1_id}/accept", payload: {}, as: CarrierOps }
            - { call: "GET /dispatch-orders/${do1_id}", as: CarrierOps, captures: { do1_v: $.data.version } }
            - { call: "POST /dispatch-orders/${do1_id}/assignments", payload: { aircraft_id: "${ac_id}", pilot_id: "${p_id}", planned_start: "2026-08-02T08:00:00Z", planned_end: "2026-08-02T09:00:00Z", expected_dispatch_order_version: "${do1_v}" }, as: CarrierOps, captures: { a_id: $.data.id } }
            - { call: "GET /dispatch-orders/${do1_id}", as: CarrierOps, captures: { do1_v2: $.data.version } }
            - { call: "POST /dispatch-orders/${do1_id}/assignments", payload: { aircraft_id: "${ac_id}", pilot_id: "${p_id}", planned_start: "2026-08-02T14:00:00Z", planned_end: "2026-08-02T15:00:00Z", expected_dispatch_order_version: "${do1_v2}" }, as: CarrierOps, captures: { d_id: $.data.id } }
            - { call: "POST /assignments/${a_id}/launch", payload: {}, as: Pilot, as_user_id: "${p_id}" }
            - { call: "POST /assignments/${a_id}/arrive", payload: {}, as: Pilot, as_user_id: "${p_id}" }
            - { call: "POST /assignments/${a_id}/flight-logs", payload: { logged_date: "2026-08-02", hobbs_start: 300.0, hobbs_stop: 307.5 }, as: Pilot, as_user_id: "${p_id}" }
            - { call: "POST /dispatch-orders", payload: { order_number: "O-1002", contract_id: "${c_id}", incident_id: "${inc_id}", aircraft_quantity: 1 }, as: AgencyDispatcher, captures: { do2_id: $.data.id } }
            - { call: "POST /dispatch-orders/${do2_id}/accept", payload: {}, as: CarrierOps }
            - { call: "GET /dispatch-orders/${do2_id}", as: CarrierOps, captures: { do2_v: $.data.version } }
          trigger:
            - { call: "GET /crew-members/${p_id}/duty-days", as: CarrierOps, captures: { dd_flown: "$.data[0].flown_tenths", dd_proj: "$.data[0].projected_tenths" } }
            - { call: "POST /dispatch-orders/${do2_id}/assignments", payload: { aircraft_id: "${ac_id}", pilot_id: "${p_id}", planned_start: "2026-08-02T16:00:00Z", planned_end: "2026-08-02T16:30:00Z", expected_dispatch_order_version: "${do2_v}" }, as: CarrierOps, captures: { err2: $.data.error_id } }
          assert:
            - "CrewDutyDay.flown_tenths == 75 (chronological variant: only recorded sorties)"
            - "CrewDutyDay.projected_tenths == 85 (forward-looking variant: 75 flown + 10 planned of the still-ASSIGNED assignment D)"
            - "The two variants diverge by exactly 10 tenths for identical flight logs"
            - "New 0.5 h assignment rejected with ERR_FLIGHT_HOUR_LIMIT_EXCEEDED because 75 + 10 + 5 == 90 > 80 under the forward-looking gate, while the chronological log gate would still permit up to 80"

  - rule_id: combinatorial_formula
    instances:
      - name: availability_charge_eu_prorate_vs_cwn_flat
        grounds:
          - calculations.availability_charge
          - entities.AvailabilityPeriod.fields.availability_charge_cents
          - state_machines.AvailabilityPeriod.OFFERED_to_CONFIRMED
        distinguishing_aspect: |
          Mode (a) combinatorial formula: the charge depends on >= 3 inputs with
          non-linear interaction (contract_type branch, min() threshold at
          min_daily_available_minutes with inclusive >=, status gate). EU day at
          exactly 570 minutes bills full 500000; at 569 it prorates to 499123; a CWN
          day bills 0 while OFFERED and a flat 600000 once CONFIRMED regardless of minutes.
        test_recipe:
          setup:
            - "EU contract c1 (daily rate 500000, min 570) ACTIVE with aircraft ac1; CWN contract c2 (daily rate 600000) ACTIVE with aircraft ac2"
            - "logical clock at the default 2026-08-01T00:00:00Z (before every service date)"
          setup_api_calls:
            - { call: "POST /contracts", payload: { contract_number: "EU-2026-001", agency: "USFS", contract_type: "EXCLUSIVE_USE", daily_availability_rate_cents: 500000, flight_hour_rate_cents: 300000, season_start_date: "2026-06-01", season_end_date: "2026-09-30", min_daily_available_minutes: 570, season_flight_hour_cap_tenths: 20000, acceptance_window_minutes: 30 }, as: CarrierOps, captures: { c1: $.data.id } }
            - { call: "POST /contracts/${c1}/activate", payload: {}, as: CarrierOps }
            - { call: "POST /contracts", payload: { contract_number: "CWN-2026-002", agency: "CAL_FIRE", contract_type: "CALL_WHEN_NEEDED", daily_availability_rate_cents: 600000, flight_hour_rate_cents: 320000, season_start_date: "2026-06-01", season_end_date: "2026-09-30", min_daily_available_minutes: 570, season_flight_hour_cap_tenths: 5000, acceptance_window_minutes: 120 }, as: CarrierOps, captures: { c2: $.data.id } }
            - { call: "POST /contracts/${c2}/activate", payload: {}, as: CarrierOps }
            - { call: "POST /aircraft", payload: { tail_number: "N100AF", model: "AT-802F", tank_capacity_gallons: 800, contract_id: "${c1}" }, as: CarrierOps, captures: { ac1: $.data.id } }
            - { call: "POST /aircraft", payload: { tail_number: "N200CF", model: "S-70I", tank_capacity_gallons: 1000, contract_id: "${c2}" }, as: CarrierOps, captures: { ac2: $.data.id } }
          trigger:
            - { call: "POST /contracts/${c1}/availability-periods", payload: { aircraft_id: "${ac1}", service_date: "2026-08-03", available_start: "2026-08-03T07:00:00Z", available_end: "2026-08-03T16:30:00Z" }, as: CarrierOps, captures: { p1_status: $.data.status, p1_min: $.data.available_minutes, p1_charge: $.data.availability_charge_cents } }
            - { call: "POST /contracts/${c1}/availability-periods", payload: { aircraft_id: "${ac1}", service_date: "2026-08-04", available_start: "2026-08-04T07:00:00Z", available_end: "2026-08-04T16:29:00Z" }, as: CarrierOps, captures: { p2_min: $.data.available_minutes, p2_charge: $.data.availability_charge_cents } }
            - { call: "POST /contracts/${c2}/availability-periods", payload: { aircraft_id: "${ac2}", service_date: "2026-08-03", available_start: "2026-08-03T07:00:00Z", available_end: "2026-08-03T16:30:00Z" }, as: CarrierOps, captures: { p3: $.data.id, p3_status: $.data.status, p3_charge: $.data.availability_charge_cents } }
            - { call: "POST /availability-periods/${p3}/confirm", payload: {}, as: AgencyDispatcher, captures: { p3_status2: $.data.status, p3_charge2: $.data.availability_charge_cents } }
          assert:
            - "EU period at exactly 570 minutes: status CONFIRMED at creation, available_minutes == 570, availability_charge_cents == 500000 (inclusive >= boundary bills full)"
            - "EU period at 569 minutes: availability_charge_cents == 499123 (round_half_up(500000 * 569 / 570))"
            - "CWN period while OFFERED: availability_charge_cents == 0"
            - "CWN period after confirm: status CONFIRMED and availability_charge_cents == 600000 (flat, minutes-independent)"

      - name: flight_billing_per_sortie_then_sum_rounding
        grounds:
          - calculations.flight_sortie_billing
          - entities.FlightLog.fields.billable_cents
          - entities.Invoice.fields.flight_subtotal_cents
        distinguishing_aspect: |
          Mode (b) nested-rounding formula (different mode than availability_charge's
          mode (a)): rounding order is pinned as round-per-sortie-THEN-sum. Sorties of
          1.05 h and 0.65 h at 300000 cents/h bill 330000 + 210000 = 540000 cents,
          while the forbidden sum-then-round order would give 510000 cents.
        test_recipe:
          setup:
            - "EU contract (300000 cents/h) ACTIVE; carded aircraft + pilot; order qty 1 ACCEPTED; assignment planned 2026-08-02 08:00-10:00 ON_INCIDENT"
          setup_api_calls:
            - { call: "POST /contracts", payload: { contract_number: "EU-2026-001", agency: "USFS", contract_type: "EXCLUSIVE_USE", daily_availability_rate_cents: 500000, flight_hour_rate_cents: 300000, season_start_date: "2026-06-01", season_end_date: "2026-09-30", min_daily_available_minutes: 570, season_flight_hour_cap_tenths: 20000, acceptance_window_minutes: 30 }, as: CarrierOps, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/activate", payload: {}, as: CarrierOps }
            - { call: "POST /aircraft", payload: { tail_number: "N100AF", model: "AT-802F", tank_capacity_gallons: 800, contract_id: "${c_id}" }, as: CarrierOps, captures: { ac_id: $.data.id } }
            - { call: "POST /crew-members", payload: { full_name: "Pat Reed", crew_role: "PIC", contract_id: "${c_id}", qualified_aircraft_models: ["AT-802F"] }, as: CarrierOps, captures: { p_id: $.data.id } }
            - { call: "POST /carding-inspections", payload: { subject_aircraft_id: "${ac_id}", scheduled_for: "2026-07-15T08:00:00Z", valid_days: 365 }, as: CardingInspector, captures: { i_ac: $.data.id } }
            - { call: "POST /carding-inspections/${i_ac}/complete", payload: { result: "PASSED", completed_at: "2026-07-15T09:00:00Z" }, as: CardingInspector }
            - { call: "POST /carding-inspections", payload: { subject_crew_member_id: "${p_id}", scheduled_for: "2026-07-15T08:00:00Z", valid_days: 365 }, as: CardingInspector, captures: { i_pl: $.data.id } }
            - { call: "POST /carding-inspections/${i_pl}/complete", payload: { result: "PASSED", completed_at: "2026-07-15T09:00:00Z" }, as: CardingInspector }
            - { call: "POST /incidents", payload: { incident_number: "USFS-2026-0801", name: "Ridge Fire", location: "39.5,-121.5", agency: "USFS", priority: "EXTENDED_ATTACK" }, as: AgencyDispatcher, captures: { inc_id: $.data.id } }
            - { call: "POST /dispatch-orders", payload: { order_number: "O-1001", contract_id: "${c_id}", incident_id: "${inc_id}", aircraft_quantity: 1 }, as: AgencyDispatcher, captures: { do_id: $.data.id } }
            - { call: "POST /dispatch-orders/${do_id}/accept", payload: {}, as: CarrierOps }
            - { call: "GET /dispatch-orders/${do_id}", as: CarrierOps, captures: { do_v: $.data.version } }
            - { call: "POST /dispatch-orders/${do_id}/assignments", payload: { aircraft_id: "${ac_id}", pilot_id: "${p_id}", planned_start: "2026-08-02T08:00:00Z", planned_end: "2026-08-02T10:00:00Z", expected_dispatch_order_version: "${do_v}" }, as: CarrierOps, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/launch", payload: {}, as: Pilot, as_user_id: "${p_id}" }
            - { call: "POST /assignments/${asg_id}/arrive", payload: {}, as: Pilot, as_user_id: "${p_id}" }
          trigger:
            - { call: "POST /assignments/${asg_id}/flight-logs", payload: { logged_date: "2026-08-02", hobbs_start: 100.0, hobbs_stop: 101.05 }, as: Pilot, as_user_id: "${p_id}", captures: { l1_tenths: $.data.flight_hours_tenths, l1_cents: $.data.billable_cents } }
            - { call: "POST /assignments/${asg_id}/flight-logs", payload: { logged_date: "2026-08-02", hobbs_start: 200.0, hobbs_stop: 200.65 }, as: Pilot, as_user_id: "${p_id}", captures: { l2_tenths: $.data.flight_hours_tenths, l2_cents: $.data.billable_cents } }
            - { call: "GET /contracts/${c_id}", as: CarrierFinance, captures: { c_v: $.data.version } }
            - { call: "POST /contracts/${c_id}/invoices", payload: { period_start: "2026-08-02", period_end: "2026-08-02", expected_contract_version: "${c_v}" }, as: CarrierFinance, captures: { inv_flight: $.data.flight_subtotal_cents, inv_net: $.data.net_cents } }
          assert:
            - "Sortie 1: flight_hours_tenths == 11 (round_half_up(1.05 * 10)) and billable_cents == 330000"
            - "Sortie 2: flight_hours_tenths == 7 (round_half_up(0.65 * 10)) and billable_cents == 210000"
            - "Invoice flight_subtotal_cents == 540000 and net_cents == 540000 (per-sortie-then-sum); the sum-then-round alternative 510000 is NOT produced"

  - rule_id: non_linear_state_machine
    instances:
      - name: invoice_dispute_resubmit_cycle
        grounds:
          - state_machines.Invoice.SUBMITTED_to_DISPUTED
          - state_machines.Invoice.DISPUTED_to_SUBMITTED
          - calculations.season_billed_invariant
        distinguishing_aspect: |
          Cyclic machine on Invoice: SUBMITTED -> DISPUTED -> SUBMITTED is a negotiation
          loop (not a linear pipeline); each pass restamps submitted_by/submitted_at and
          the invoice remains inside the season_billed invariant set throughout the loop.
        test_recipe:
          setup:
            - "EU contract ACTIVE with one CONFIRMED availability day 2026-08-03 (570 min, 500000 cents)"
            - "invoice for 2026-08-03..2026-08-03 created DRAFT (net 500000); clock advanced to 2026-08-09 so the period is closed"
          setup_api_calls:
            - { call: "POST /contracts", payload: { contract_number: "EU-2026-001", agency: "USFS", contract_type: "EXCLUSIVE_USE", daily_availability_rate_cents: 500000, flight_hour_rate_cents: 300000, season_start_date: "2026-06-01", season_end_date: "2026-09-30", min_daily_available_minutes: 570, season_flight_hour_cap_tenths: 20000, acceptance_window_minutes: 30 }, as: CarrierOps, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/activate", payload: {}, as: CarrierOps }
            - { call: "POST /aircraft", payload: { tail_number: "N100AF", model: "AT-802F", tank_capacity_gallons: 800, contract_id: "${c_id}" }, as: CarrierOps, captures: { ac_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/availability-periods", payload: { aircraft_id: "${ac_id}", service_date: "2026-08-03", available_start: "2026-08-03T07:00:00Z", available_end: "2026-08-03T16:30:00Z" }, as: CarrierOps }
            - { call: "GET /contracts/${c_id}", as: CarrierFinance, captures: { c_v: $.data.version } }
            - { call: "POST /contracts/${c_id}/invoices", payload: { period_start: "2026-08-03", period_end: "2026-08-03", expected_contract_version: "${c_v}" }, as: CarrierFinance, captures: { inv_id: $.data.id, inv_v1: $.data.version, inv_net: $.data.net_cents } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /invoices/${inv_id}/submit", payload: {}, as: CarrierFinance, as_user_id: "cf_1", captures: { s1: $.data.status, v2: $.data.version } }
            - { call: "POST /invoices/${inv_id}/dispute", payload: { dispute_reason: "agency hours mismatch" }, as: AgencyFinance, as_user_id: "af_1", captures: { s2: $.data.status, v3: $.data.version } }
            - { call: "POST /invoices/${inv_id}/resubmit", payload: {}, as: CarrierFinance, as_user_id: "cf_1", captures: { s3: $.data.status, v4: $.data.version } }
            - { call: "GET /contracts/${c_id}", as: CarrierFinance, captures: { billed: $.data.season_billed_cents } }
          assert:
            - "status sequence DRAFT -> SUBMITTED -> DISPUTED -> SUBMITTED with version 1 -> 2 -> 3 -> 4 (loop re-entry is legal)"
            - "Invoice.net_cents == 500000 throughout the loop"
            - "Contract.season_billed_cents == 500000 after the full loop (SUBMITTED and DISPUTED both belong to the invariant set; dispute and resubmit never double-debit)"

      - name: aircraft_carding_suspend_recard_cycle
        grounds:
          - state_machines.Aircraft.CARDED_to_SUSPENDED
          - state_machines.Aircraft.SUSPENDED_to_CARDED
          - state_machines.CardingInspection.COMPLETED_to_SCHEDULED
        distinguishing_aspect: |
          Cyclic machine on Aircraft (a different entity than the Invoice cycle):
          UNCARDED -> CARDED -> SUSPENDED -> CARDED via fail-then-reinspect, with the
          CardingInspection itself looping COMPLETED(FAILED) -> SCHEDULED -> COMPLETED
          and carded_until recomputed from each pass (2027-07-15 then 2027-08-03).
        test_recipe:
          setup:
            - "EU contract ACTIVE; aircraft registered (UNCARDED); first inspection passed on 2026-07-15 (valid_days 365)"
          setup_api_calls:
            - { call: "POST /contracts", payload: { contract_number: "EU-2026-001", agency: "USFS", contract_type: "EXCLUSIVE_USE", daily_availability_rate_cents: 500000, flight_hour_rate_cents: 300000, season_start_date: "2026-06-01", season_end_date: "2026-09-30", min_daily_available_minutes: 570, season_flight_hour_cap_tenths: 20000, acceptance_window_minutes: 30 }, as: CarrierOps, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/activate", payload: {}, as: CarrierOps }
            - { call: "POST /aircraft", payload: { tail_number: "N100AF", model: "AT-802F", tank_capacity_gallons: 800, contract_id: "${c_id}" }, as: CarrierOps, captures: { ac_id: $.data.id } }
            - { call: "POST /carding-inspections", payload: { subject_aircraft_id: "${ac_id}", scheduled_for: "2026-07-15T08:00:00Z", valid_days: 365 }, as: CardingInspector, captures: { i1: $.data.id } }
            - { call: "POST /carding-inspections/${i1}/complete", payload: { result: "PASSED", completed_at: "2026-07-15T09:00:00Z" }, as: CardingInspector }
            - { call: "POST /carding-inspections", payload: { subject_aircraft_id: "${ac_id}", scheduled_for: "2026-08-01T08:00:00Z", valid_days: 365 }, as: CardingInspector, captures: { i2: $.data.id } }
          trigger:
            - { call: "GET /aircraft/${ac_id}", as: CarrierOps, captures: { st0: $.data.carding_status, cu0: $.data.carded_until } }
            - { call: "POST /carding-inspections/${i2}/complete", payload: { result: "FAILED", completed_at: "2026-08-02T09:00:00Z" }, as: CardingInspector }
            - { call: "GET /aircraft/${ac_id}", as: CarrierOps, captures: { st1: $.data.carding_status, cu1: $.data.carded_until } }
            - { call: "POST /carding-inspections/${i2}/reschedule", payload: { scheduled_for: "2026-08-03T08:00:00Z" }, as: CardingInspector, captures: { i2_st: $.data.status, i2_res: $.data.result } }
            - { call: "POST /carding-inspections/${i2}/complete", payload: { result: "PASSED", completed_at: "2026-08-03T09:00:00Z" }, as: CardingInspector }
            - { call: "GET /aircraft/${ac_id}", as: CarrierOps, captures: { st2: $.data.carding_status, cu2: $.data.carded_until } }
          assert:
            - "Aircraft carding_status: CARDED (after first pass, carded_until == '2027-07-15') -> SUSPENDED after FAILED (carded_until == null) -> CARDED after re-pass (carded_until == '2027-08-03')"
            - "Inspection i2 after reschedule: status == SCHEDULED and result reset to PENDING (revision loop)"
            - "The loop closes on the same aircraft and the same inspection record — no new entity needed"

  - rule_id: transitive_cascade
    instances:
      - name: inspection_fail_three_link_cascade
        grounds:
          - state_machines.Aircraft.CARDED_to_SUSPENDED
          - state_machines.AvailabilityPeriod.CONFIRMED_to_UNAVAILABLE
          - calculations.invoice_net_composition
          - entities.Invoice.fields.net_cents
        distinguishing_aspect: |
          Depth-3 cascade triggered by an inspection completion (a different trigger
          than the flight-log cascade): inspection FAILED -> Aircraft SUSPENDED (link 1)
          -> CONFIRMED future AvailabilityPeriod flips to UNAVAILABLE/CARDING (link 2,
          caused by the suspension, not by the inspection directly) -> the covering
          DRAFT invoice is re-derived with availability_subtotal_cents 500000 -> 0 and
          net_cents 500000 -> 0 (link 3, caused by the period flip).
        test_recipe:
          setup:
            - "EU contract ACTIVE; aircraft carded on 2026-07-15; one CONFIRMED availability period on 2026-08-05 (570 min, charge 500000)"
            - "DRAFT invoice covering 2026-08-01..2026-08-31 already exists with availability_subtotal_cents == 500000, penalty_cents == 0, net_cents == 500000"
            - "a second inspection of the same aircraft is SCHEDULED"
          setup_api_calls:
            - { call: "POST /contracts", payload: { contract_number: "EU-2026-001", agency: "USFS", contract_type: "EXCLUSIVE_USE", daily_availability_rate_cents: 500000, flight_hour_rate_cents: 300000, season_start_date: "2026-06-01", season_end_date: "2026-09-30", min_daily_available_minutes: 570, season_flight_hour_cap_tenths: 20000, acceptance_window_minutes: 30 }, as: CarrierOps, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/activate", payload: {}, as: CarrierOps }
            - { call: "POST /aircraft", payload: { tail_number: "N100AF", model: "AT-802F", tank_capacity_gallons: 800, contract_id: "${c_id}" }, as: CarrierOps, captures: { ac_id: $.data.id } }
            - { call: "POST /carding-inspections", payload: { subject_aircraft_id: "${ac_id}", scheduled_for: "2026-07-15T08:00:00Z", valid_days: 365 }, as: CardingInspector, captures: { i1: $.data.id } }
            - { call: "POST /carding-inspections/${i1}/complete", payload: { result: "PASSED", completed_at: "2026-07-15T09:00:00Z" }, as: CardingInspector }
            - { call: "POST /contracts/${c_id}/availability-periods", payload: { aircraft_id: "${ac_id}", service_date: "2026-08-05", available_start: "2026-08-05T07:00:00Z", available_end: "2026-08-05T16:30:00Z" }, as: CarrierOps, captures: { ap_id: $.data.id } }
            - { call: "GET /contracts/${c_id}", as: CarrierFinance, captures: { c_v: $.data.version } }
            - { call: "POST /contracts/${c_id}/invoices", payload: { period_start: "2026-08-01", period_end: "2026-08-31", expected_contract_version: "${c_v}" }, as: CarrierFinance, captures: { inv_id: $.data.id, inv_sub0: $.data.availability_subtotal_cents, inv_net0: $.data.net_cents } }
            - { call: "POST /carding-inspections", payload: { subject_aircraft_id: "${ac_id}", scheduled_for: "2026-08-01T08:00:00Z", valid_days: 365 }, as: CardingInspector, captures: { i2: $.data.id } }
          trigger:
            - { call: "POST /carding-inspections/${i2}/complete", payload: { result: "FAILED", completed_at: "2026-08-02T09:00:00Z" }, as: CardingInspector }
            - { call: "GET /aircraft/${ac_id}", as: CarrierOps, captures: { ac_st: $.data.carding_status } }
            - { call: "GET /availability-periods/${ap_id}", as: CarrierOps, captures: { ap_st: $.data.status, ap_reason: $.data.excuse_reason, ap_charge: $.data.availability_charge_cents } }
            - { call: "GET /invoices/${inv_id}", as: CarrierFinance, captures: { inv_sub1: $.data.availability_subtotal_cents, inv_pen1: $.data.penalty_cents, inv_net1: $.data.net_cents } }
          assert:
            - "Before: invoice availability_subtotal_cents == 500000 and net_cents == 500000"
            - "Link 1: Aircraft.carding_status == SUSPENDED"
            - "Link 2: AvailabilityPeriod 2026-08-05 (>= failed inspection's 2026-08-02) is UNAVAILABLE with excuse_reason == CARDING and availability_charge_cents == 0"
            - "Link 3: DRAFT invoice re-derived — availability_subtotal_cents == 0, net_cents == 0 (penalty_cents == 0 because 5% of a zero subtotal is zero even though compliance 0/1 < 0.98)"

      - name: flight_log_fatigue_four_link_cascade
        grounds:
          - state_machines.CrewMember.AVAILABLE_to_FATIGUE_HOLD
          - state_machines.Assignment.ASSIGNED_to_RELEASED
          - state_machines.DispatchOrder.FILLED_to_PARTIALLY_FILLED
          - calculations.filled_count_invariant
          - entities.CrewDutyDay.fields.flown_tenths
        distinguishing_aspect: |
          Depth-4 cascade triggered by a flight-log creation (a different trigger than
          the inspection cascade): log pushing the duty day to 80 tenths -> CrewDutyDay
          accumulated (link 1) -> CrewMember FATIGUE_HOLD (link 2) -> only the pilot's
          ASSIGNED assignment B flips to RELEASED/FATIGUE while the ON_INCIDENT
          assignment A is untouched (link 3, conditional) -> B's FILLED dispatch order
          drops to filled_count 0 and auto-reverts to ACCEPTED (link 4, bubble-up).
        test_recipe:
          setup:
            - "EU contract ACTIVE; aircraft and pilot carded"
            - "order1 (qty 1) ACCEPTED with assignment A planned 2026-08-02 08:00-10:00, ON_INCIDENT"
            - "order2 (qty 1) ACCEPTED with assignment B (same pilot, same aircraft) planned 2026-08-03 08:00-09:00, ASSIGNED; order2 status FILLED"
            - "79 tenths already logged for the pilot on 2026-08-02 (hobbs 100.0 -> 107.9)"
          setup_api_calls:
            - { call: "POST /contracts", payload: { contract_number: "EU-2026-001", agency: "USFS", contract_type: "EXCLUSIVE_USE", daily_availability_rate_cents: 500000, flight_hour_rate_cents: 300000, season_start_date: "2026-06-01", season_end_date: "2026-09-30", min_daily_available_minutes: 570, season_flight_hour_cap_tenths: 20000, acceptance_window_minutes: 30 }, as: CarrierOps, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/activate", payload: {}, as: CarrierOps }
            - { call: "POST /aircraft", payload: { tail_number: "N100AF", model: "AT-802F", tank_capacity_gallons: 800, contract_id: "${c_id}" }, as: CarrierOps, captures: { ac_id: $.data.id } }
            - { call: "POST /crew-members", payload: { full_name: "Pat Reed", crew_role: "PIC", contract_id: "${c_id}", qualified_aircraft_models: ["AT-802F"] }, as: CarrierOps, captures: { p_id: $.data.id } }
            - { call: "POST /carding-inspections", payload: { subject_aircraft_id: "${ac_id}", scheduled_for: "2026-07-15T08:00:00Z", valid_days: 365 }, as: CardingInspector, captures: { i_ac: $.data.id } }
            - { call: "POST /carding-inspections/${i_ac}/complete", payload: { result: "PASSED", completed_at: "2026-07-15T09:00:00Z" }, as: CardingInspector }
            - { call: "POST /carding-inspections", payload: { subject_crew_member_id: "${p_id}", scheduled_for: "2026-07-15T08:00:00Z", valid_days: 365 }, as: CardingInspector, captures: { i_pl: $.data.id } }
            - { call: "POST /carding-inspections/${i_pl}/complete", payload: { result: "PASSED", completed_at: "2026-07-15T09:00:00Z" }, as: CardingInspector }
            - { call: "POST /incidents", payload: { incident_number: "USFS-2026-0801", name: "Ridge Fire", location: "39.5,-121.5", agency: "USFS", priority: "EXTENDED_ATTACK" }, as: AgencyDispatcher, captures: { inc_id: $.data.id } }
            - { call: "POST /dispatch-orders", payload: { order_number: "O-1001", contract_id: "${c_id}", incident_id: "${inc_id}", aircraft_quantity: 1 }, as: AgencyDispatcher, captures: { do1: $.data.id } }
            - { call: "POST /dispatch-orders/${do1}/accept", payload: {}, as: CarrierOps }
            - { call: "GET /dispatch-orders/${do1}", as: CarrierOps, captures: { do1_v: $.data.version } }
            - { call: "POST /dispatch-orders/${do1}/assignments", payload: { aircraft_id: "${ac_id}", pilot_id: "${p_id}", planned_start: "2026-08-02T08:00:00Z", planned_end: "2026-08-02T10:00:00Z", expected_dispatch_order_version: "${do1_v}" }, as: CarrierOps, captures: { a_id: $.data.id } }
            - { call: "POST /dispatch-orders", payload: { order_number: "O-1002", contract_id: "${c_id}", incident_id: "${inc_id}", aircraft_quantity: 1 }, as: AgencyDispatcher, captures: { do2: $.data.id } }
            - { call: "POST /dispatch-orders/${do2}/accept", payload: {}, as: CarrierOps }
            - { call: "GET /dispatch-orders/${do2}", as: CarrierOps, captures: { do2_v: $.data.version } }
            - { call: "POST /dispatch-orders/${do2}/assignments", payload: { aircraft_id: "${ac_id}", pilot_id: "${p_id}", planned_start: "2026-08-03T08:00:00Z", planned_end: "2026-08-03T09:00:00Z", expected_dispatch_order_version: "${do2_v}" }, as: CarrierOps, captures: { b_id: $.data.id } }
            - { call: "POST /assignments/${a_id}/launch", payload: {}, as: Pilot, as_user_id: "${p_id}" }
            - { call: "POST /assignments/${a_id}/arrive", payload: {}, as: Pilot, as_user_id: "${p_id}" }
            - { call: "POST /assignments/${a_id}/flight-logs", payload: { logged_date: "2026-08-02", hobbs_start: 100.0, hobbs_stop: 107.9 }, as: Pilot, as_user_id: "${p_id}" }
          trigger:
            - { call: "POST /assignments/${a_id}/flight-logs", payload: { logged_date: "2026-08-02", hobbs_start: 107.9, hobbs_stop: 108.0 }, as: Pilot, as_user_id: "${p_id}" }
            - { call: "GET /crew-members/${p_id}", as: CarrierOps, captures: { p_duty: $.data.duty_status } }
            - { call: "GET /assignments/${b_id}", as: CarrierOps, captures: { b_st: $.data.status, b_rr: $.data.release_reason } }
            - { call: "GET /assignments/${a_id}", as: CarrierOps, captures: { a_st: $.data.status } }
            - { call: "GET /dispatch-orders/${do2}", as: CarrierOps, captures: { do2_st: $.data.status, do2_fc: $.data.filled_count } }
          assert:
            - "The 0.1 h log is accepted (79 + 1 == 80 <= 80; the limit is inclusive)"
            - "Link 2: CrewMember.duty_status == FATIGUE_HOLD (flown_tenths reached 80 >= 80)"
            - "Link 3 (conditional): assignment B status == RELEASED with release_reason == FATIGUE, while ON_INCIDENT assignment A status stays ON_INCIDENT"
            - "Link 4 (bubble-up): order2 status == ACCEPTED and filled_count == 0 (FILLED -> PARTIALLY_FILLED -> ACCEPTED collapse as filled_count hits 0)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: dispatch_create_state_beats_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=13]
          - errors[ERR_CONTRACT_NOT_ACTIVE]
          - errors[ERR_SEASON_FLIGHT_CAP_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair (state, business_fiscal): the contract is SUSPENDED
          (state, priority 7) AND its season flight-hour cap is already exhausted
          (fiscal, priority 13) at dispatch creation; the response must be
          ERR_CONTRACT_NOT_ACTIVE, never ERR_SEASON_FLIGHT_CAP_EXCEEDED.
        test_recipe:
          setup:
            - "EU contract with season_flight_hour_cap_tenths == 10; carded aircraft + pilot"
            - "order1 accepted, assignment launched/on-incident, one 1.0 h log (10 tenths) brings season_flight_hours_tenths to exactly 10 (cap reached, not exceeded)"
            - "contract then SUSPENDED"
          setup_api_calls:
            - { call: "POST /contracts", payload: { contract_number: "EU-2026-001", agency: "USFS", contract_type: "EXCLUSIVE_USE", daily_availability_rate_cents: 500000, flight_hour_rate_cents: 300000, season_start_date: "2026-06-01", season_end_date: "2026-09-30", min_daily_available_minutes: 570, season_flight_hour_cap_tenths: 10, acceptance_window_minutes: 30 }, as: CarrierOps, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/activate", payload: {}, as: CarrierOps }
            - { call: "POST /aircraft", payload: { tail_number: "N100AF", model: "AT-802F", tank_capacity_gallons: 800, contract_id: "${c_id}" }, as: CarrierOps, captures: { ac_id: $.data.id } }
            - { call: "POST /crew-members", payload: { full_name: "Pat Reed", crew_role: "PIC", contract_id: "${c_id}", qualified_aircraft_models: ["AT-802F"] }, as: CarrierOps, captures: { p_id: $.data.id } }
            - { call: "POST /carding-inspections", payload: { subject_aircraft_id: "${ac_id}", scheduled_for: "2026-07-15T08:00:00Z", valid_days: 365 }, as: CardingInspector, captures: { i_ac: $.data.id } }
            - { call: "POST /carding-inspections/${i_ac}/complete", payload: { result: "PASSED", completed_at: "2026-07-15T09:00:00Z" }, as: CardingInspector }
            - { call: "POST /carding-inspections", payload: { subject_crew_member_id: "${p_id}", scheduled_for: "2026-07-15T08:00:00Z", valid_days: 365 }, as: CardingInspector, captures: { i_pl: $.data.id } }
            - { call: "POST /carding-inspections/${i_pl}/complete", payload: { result: "PASSED", completed_at: "2026-07-15T09:00:00Z" }, as: CardingInspector }
            - { call: "POST /incidents", payload: { incident_number: "USFS-2026-0801", name: "Ridge Fire", location: "39.5,-121.5", agency: "USFS", priority: "EXTENDED_ATTACK" }, as: AgencyDispatcher, captures: { inc_id: $.data.id } }
            - { call: "POST /dispatch-orders", payload: { order_number: "O-1001", contract_id: "${c_id}", incident_id: "${inc_id}", aircraft_quantity: 1 }, as: AgencyDispatcher, captures: { do1: $.data.id } }
            - { call: "POST /dispatch-orders/${do1}/accept", payload: {}, as: CarrierOps }
            - { call: "GET /dispatch-orders/${do1}", as: CarrierOps, captures: { do1_v: $.data.version } }
            - { call: "POST /dispatch-orders/${do1}/assignments", payload: { aircraft_id: "${ac_id}", pilot_id: "${p_id}", planned_start: "2026-08-02T08:00:00Z", planned_end: "2026-08-02T09:00:00Z", expected_dispatch_order_version: "${do1_v}" }, as: CarrierOps, captures: { a_id: $.data.id } }
            - { call: "POST /assignments/${a_id}/launch", payload: {}, as: Pilot, as_user_id: "${p_id}" }
            - { call: "POST /assignments/${a_id}/arrive", payload: {}, as: Pilot, as_user_id: "${p_id}" }
            - { call: "POST /assignments/${a_id}/flight-logs", payload: { logged_date: "2026-08-02", hobbs_start: 0.0, hobbs_stop: 1.0 }, as: Pilot, as_user_id: "${p_id}" }
            - { call: "POST /contracts/${c_id}/suspend", payload: {}, as: CarrierOps }
          trigger:
            - { call: "POST /dispatch-orders", payload: { order_number: "O-1002", contract_id: "${c_id}", incident_id: "${inc_id}", aircraft_quantity: 1 }, as: AgencyDispatcher, captures: { err: $.data.error_id } }
          assert:
            - "Response error_id == ERR_CONTRACT_NOT_ACTIVE (state, priority 7) even though season_flight_hours_tenths == 10 >= cap 10 would also justify ERR_SEASON_FLIGHT_CAP_EXCEEDED (fiscal, priority 13)"

      - name: assignment_create_safety_beats_referential
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - errors[ERR_CREW_ON_FATIGUE_HOLD]
          - errors[ERR_PILOT_NOT_ON_CONTRACT]
        distinguishing_aspect: |
          Error-category pair (business_safety, business_referential) — different from
          the (state, business_fiscal) pairing of dispatch_create_state_beats_fiscal:
          the pilot is on FATIGUE_HOLD (safety, priority 8) AND belongs to a different
          contract than the order's (referential, priority 11); the response must be
          ERR_CREW_ON_FATIGUE_HOLD, never ERR_PILOT_NOT_ON_CONTRACT.
        test_recipe:
