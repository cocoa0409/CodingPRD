              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /offers/${offer_id}/activate"
              payload: {}
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "POST /digital-clips"
              payload: { offer_id: "${offer_id}", consumer_ref: "consumer-771" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { clip1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "POST /digital-clips"
              payload: { offer_id: "${offer_id}", consumer_ref: "consumer-771" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { clip2_id: $.data.id }
          trigger:
            - call: "POST /digital-clips"
              payload: { offer_id: "${offer_id}", consumer_ref: "consumer-771" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-16T00:00:00Z" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "POST /digital-clips"
              payload: { offer_id: "${offer_id}", consumer_ref: "consumer-771" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { clip3_id: $.data.id }
            - call: "POST /digital-clips"
              payload: { offer_id: "${offer_id}", consumer_ref: "consumer-771" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
          assert:
            - "DigitalClip.${clip1_id}.clip_expires_at == 2026-08-15 (2026-08-01 + 14 days, well inside the offer-last date 2027-01-30)"
            - "DigitalClip.${clip2_id}.clip_expires_at == 2026-08-19 (2026-08-05 + 14 days)"
            - "aggregate refusal: trigger call 1 returns 409 ERR_CLIP_CONCURRENCY_LIMIT while both clips are CLIPPED and live"
            - "slot release: trigger call 2 returns expired_clip_count == 1 — only clip 1 has clip_expires_at < 2026-08-16"
            - "DigitalClip.${clip1_id}.status == EXPIRED_UNUSED and DigitalClip.${clip2_id}.status == CLIPPED"
            - "same request now legal: trigger call 3 returns 201 with DigitalClip.${clip3_id}.clip_expires_at == 2026-08-30"
            - "capacity refilled: trigger call 4 returns 409 ERR_CLIP_CONCURRENCY_LIMIT (clips 2 and 3 are both live)"
            - "GET /digital-clips?offer_id=${offer_id} returns exactly 3 rows, so neither refused call created anything"

  # =====================================================================
  - rule_id: compensating_invariant
    instances:

      - name: dispute_overturn_conserves_adjudicated_face_value
        grounds:
          - entities.Submission.fields.adjudicated_face_value_cents
          - state_machines.SubmissionLot.DISPUTED_to_REINSTATED
          - state_machines.CouponItem.REJECTED_MISREDEEMED_to_REINSTATED
          - calculations.lot_gross_face_value
          - calculations.retailer_fraud_score
        distinguishing_aspect: |
          The conserved quantity is Submission.adjudicated_face_value_cents: the
          total face value of every item that has left CAPTURED. Rejection,
          dispute and overturn move value between accepted_item_face_value_cents
          and rejected_item_face_value_cents but must never change their sum, and
          the identity accepted + rejected == adjudicated must hold at every
          checkpoint. The overturn is a full compensation: lot Y's gross and fee
          are re-derived from scratch (100 and 14, exactly what a clean
          finalization would have produced), the Offer's redemption counter
          advances by the newly cleared units rather than being recomputed from
          zero, and a rescore afterwards drops every fraud rate back to 0.00
          because REINSTATED items count in the denominator but in no numerator.
          Any drift — a double-counted reinstatement, a fee left at 0, an
          adjudicated total that moves — is caught by an exact literal.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z default; manufacturer dispute_window_days 45, CONTRACT_RATE 7 cents; retailer STANDARD"
            - "submission verified 4 with lot X (2 items, purchase records present, VALIDATED) and lot Y (2 items whose POS refs have no record, both REJECTED_MISREDEEMED, LOT_REJECTED)"
