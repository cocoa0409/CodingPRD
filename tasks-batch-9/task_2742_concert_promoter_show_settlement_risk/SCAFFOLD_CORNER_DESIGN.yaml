          Thirteen probes, one per machine-and-trigger pair that has NO declared edge from the row's
          current state, all against freshly created rows sitting in their initial states. Each must be
          ERR_INVALID_STATE 409 — not 404, not 422, and not ERR_ALREADY_TERMINAL, because none of these
          rows is in a terminal state. The convert-to-comp probe is the subtle one: the hold IS in HELD,
