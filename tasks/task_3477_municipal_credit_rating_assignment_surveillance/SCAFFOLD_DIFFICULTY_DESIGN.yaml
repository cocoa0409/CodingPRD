          - calculations.surveillance_posture_derivation
        distinguishing_aspect: "Parallel state dimensions on Rating (a different entity than RatingEngagement): the publication axis stays PUBLISHED while the surveillance_posture axis independently walks CURRENT -> GRACE -> CURRENT as the obligation goes OVERDUE then SUBMITTED_LATE."
