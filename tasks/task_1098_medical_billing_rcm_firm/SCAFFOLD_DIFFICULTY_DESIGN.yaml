        grounds:
          - validations[priority=9]
          - entities.PayerEnrollment.fields.effective_date
          - entities.PayerEnrollment.fields.termination_date
        distinguishing_aspect: "Half-open interval semantics on PayerEnrollment: E1 [2026-01-01, 2026-06-01) terminates exclusive of 2026-06-01, so creating E2 [2026-06-01, open) for the same (provider,payer) does NOT overlap and is accepted — the opposite outcome from the closed-closed fee-schedule shared endpoint."
        test_recipe:
