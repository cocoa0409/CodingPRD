              as: Patient
              as_user_id: "${pat_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/intake-records"
              payload: { channel: "IMPRESSION_KIT", quality_score: 0.5, kit_tracking_number: "TLQ" }
              as: Patient
              as_user_id: "${pat_id}"
          trigger:
            - call: "POST /cases/${case_id}/submit-for-review"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INTAKE_NOT_USABLE"
            - "TreatmentCase.${case_id}.status == INTAKE_PENDING"

