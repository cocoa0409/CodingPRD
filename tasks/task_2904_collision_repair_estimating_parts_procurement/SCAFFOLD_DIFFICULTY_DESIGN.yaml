  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_cannot_reach_ready_for_qc_until_the_adas_record_is_passed
        grounds:
          - state_machines.RepairOrder.REFINISH_CALIBRATION_to_READY_FOR_QC
          - state_machines.ProcedureRecord.SCHEDULED_to_FAILED
          - state_machines.ProcedureRecord.FAILED_to_SCHEDULED
          - validations.priority_50
          - errors.ERR_CALIBRATION_NOT_VERIFIED
        distinguishing_aspect: |
          Entity pair RepairOrder -> ProcedureRecord: the order's own stage precondition is satisfied,
          yet the hop is refused purely because a row on a different entity is not PASSED. The gate is
          re-tested through the calibration cycle - REQUIRED refused, SCHEDULED refused, FAILED refused,
          PASSED allowed - so it is the child's state, not the child's existence, that decides.
        test_recipe:
          setup:
            - "A STATIC calibration bay with concurrent_capacity 2, a BODY stall and a PAINT stall."
            - "A repair order (deductible 25000, initial authorisation 400000) whose teardown finding has adas_component_touched true, so blueprinting already demands an ADAS procedure record."
            - "One ADAS ProcedureRecord with requires_calibration true and calibration_type STATIC (calibration_status REQUIRED), with adherence_documented patched to true so rule 52 cannot mask rule 50."
            - "One BODY 4.5 h line; the order is locked and walked to REFINISH_CALIBRATION with a REPAIR assignment (08:00-12:00) and a REFINISH_CALIBRATION assignment (13:00-15:00)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Rosa Lim", phone: "555-0222", email: "rosa@example.com" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /insurers"
              payload: { insurer_code: "NRTH-15", name: "Northline Mutual", rate_ceiling_cents: { BODY: 6000, FRAME: 8000, REFINISH: 5800, MECHANICAL: 11000, ALUMINUM_BODY: 8800 } }
              as: ShopAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /calibration-bays"
              payload: { name: "Bay B", supported_types: ["STATIC"], concurrent_capacity: 2 }
              as: ShopAdmin
              captures: { bay_id: $.data.id }
            - call: "POST /stalls"
              payload: { name: "Body 4", stall_type: "BODY" }
              as: ShopAdmin
              captures: { stall_body_id: $.data.id }
            - call: "POST /stalls"
              payload: { name: "Paint 4", stall_type: "PAINT" }
              as: ShopAdmin
              captures: { stall_paint_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_id}", insurer_id: "${ins_id}", claim_number: "CLM-77152", vehicle_vin: "1HGCV1F30LA000126", vehicle_model_year: 2019, vehicle_make_model: "Honda Accord", initial_authorized_cents: 400000, deductible_cents: 25000 }
              as: ShopAdmin
              captures: { ro_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/teardown-findings"
              payload: { panel_code: "FRT-BUMPER", severity: "MODERATE", adas_component_touched: true }
              as: Estimator
              as_user_id: "est-001"
              captures: { dl1_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/procedure-records"
              payload: { procedure_code: "ADAS-CAL-2", source: "OEM_PORTAL", operation_scope: "ADAS", requires_calibration: true, calibration_type: "STATIC" }
              as: Estimator
              as_user_id: "est-001"
              captures: { pr_id: $.data.id }
            - call: "PATCH /procedure-records/${pr_id}"
              payload: { adherence_documented: true, adherence_doc_ref: "DOC-2" }
              as: Technician
              as_user_id: "tech-001"
            - call: "POST /repair-orders/${ro_id}/estimate-lines"
              payload: { damage_line_id: "${dl1_id}", operation_code: "BDY-1", labor_type: "BODY", guide_hours: 4.5 }
              as: Estimator
              as_user_id: "est-001"
              captures: { el_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/blueprint"
              payload: {}
              as: Estimator
              as_user_id: "est-001"
            - call: "POST /repair-orders/${ro_id}/estimate/lock"
              payload: {}
              as: Estimator
              as_user_id: "est-001"
            - call: "POST /repair-orders/${ro_id}/stage-advance"
              payload: { to_stage: "PARTS_STAGED" }
              as: Technician
              as_user_id: "tech-001"
            - call: "POST /repair-orders/${ro_id}/stage-assignments"
              payload: { stall_id: "${stall_body_id}", stage: "REPAIR", window_start: "2026-08-01T08:00:00Z", window_end: "2026-08-01T12:00:00Z" }
              as: Technician
              as_user_id: "tech-001"
              captures: { sa_repair_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/stage-advance"
              payload: { to_stage: "REPAIR" }
              as: Technician
              as_user_id: "tech-001"
            - call: "POST /repair-orders/${ro_id}/stage-assignments"
              payload: { stall_id: "${stall_paint_id}", stage: "REFINISH_CALIBRATION", window_start: "2026-08-01T13:00:00Z", window_end: "2026-08-01T15:00:00Z" }
              as: Technician
              as_user_id: "tech-001"
              captures: { sa_paint_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/stage-advance"
              payload: { to_stage: "REFINISH_CALIBRATION" }
              as: Technician
              as_user_id: "tech-001"
          trigger:
            - call: "POST /repair-orders/${ro_id}/stage-advance"
              payload: { to_stage: "READY_FOR_QC" }
              as: Technician
              as_user_id: "tech-001"
          assert:
            - "the trigger is refused ERR_CALIBRATION_NOT_VERIFIED (422) while ProcedureRecord.${pr_id}.calibration_status == REQUIRED, and RepairOrder.${ro_id}.stage stays REFINISH_CALIBRATION"
            - "after POST /procedure-records/${pr_id}/calibration-schedule into ${bay_id} for 16:00-17:00 the record is SCHEDULED and the identical advance is still refused ERR_CALIBRATION_NOT_VERIFIED"
            - "after POST /procedure-records/${pr_id}/calibration-result with result FAIL and post_scan_dtc_count 3 the record is FAILED with bay_id, window_start and window_end cleared, CalibrationBay.${bay_id}.scheduled_window_count == 0, and the advance is still refused"
            - "after a re-schedule and POST /procedure-records/${pr_id}/calibration-result with PASS and 0 DTCs the record is PASSED and the same advance succeeds: RepairOrder.${ro_id}.stage == READY_FOR_QC and StageAssignment.${sa_paint_id}.status == COMPLETED"

