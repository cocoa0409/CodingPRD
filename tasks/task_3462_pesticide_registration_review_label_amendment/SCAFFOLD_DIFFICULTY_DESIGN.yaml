            - call: "POST /pesticide-registry/study-submissions/${s3}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: RiskAssessor
              as_user_id: "ra-2"
          assert:
            - "after first respond: DataCallIn.${dci}.status == RESPONDED, satisfied_study_types == [], pending_study_types == [\"TOXICOLOGY\"], outstanding_study_types == [\"RESIDUE_CHEMISTRY\"] — partition holds (2)"
            - "after the rejection (compensating hop): status == DEFICIENT, satisfied == [], pending == [], outstanding == [\"TOXICOLOGY\", \"RESIDUE_CHEMISTRY\"] — the obligation bounced back, nothing created or lost"
            - "after the second respond: status == RESPONDED, satisfied == [], pending == [\"TOXICOLOGY\", \"RESIDUE_CHEMISTRY\"], outstanding == [] — but NOT SATISFIED, because pending is not satisfied"
            - "after accepting the residue study only: status still RESPONDED with satisfied == [\"RESIDUE_CHEMISTRY\"]"
            - "after accepting the toxicology study: status == SATISFIED and RegistrationReviewCase.${case1}.status == UNDER_REVIEW"
            - "INVARIANT at every hop: required_study_types (2) == |satisfied| + |pending| + |outstanding| as a set partition"
