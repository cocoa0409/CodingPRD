          difficulty_instance: priority_pair_validation_conflict / approve_state_error_precedes_exposure_cap_fiscal_error
          rationale: "That §1.8 instance already violates the underwriting-state rule and the exposure-cap rule in one call and asserts the priority 28 error wins over the priority 63 error."
      - name: exposure_cap_is_an_aggregate_of_every_servicing_loan
        claim_type: aggregate_validation
        grounds:
