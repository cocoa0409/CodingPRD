      - name: depositing_twice_returns_the_running_rebuilder_balance
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /v1/rebuilders/{id}/deposits]
          - entities.Rebuilder.fields.fee_balance_cents
          - entities.Rebuilder.fields.fees_deposited_cents
        distinguishing_aspect: "The deposit action returns the updated Rebuilder aggregate rather than a receipt entity, and the two ledger columns move together: 500000 then 250000 leave fees_deposited_cents and fee_balance_cents both at 750000 with nothing escrowed or consumed, and the entity version advances once per deposit."
        test_recipe:
          setup: ["a newly licensed rebuilder with an empty fee ledger at version 1"]
          setup_api_calls:
            - call: "POST /v1/rebuilders"
              payload: { legal_name: "Sierra Rebuilders LLC", license_number: "RB-9318", license_expires_at: "2027-06-30T00:00:00Z", bond_amount_cents: 2500000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { rb_id: $.data.id, rb_v: $.data.version }
          trigger:
            - call: "POST /v1/rebuilders/${rb_id}/deposits"
              payload: { amount_cents: 500000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /v1/rebuilders/${rb_id}/deposits"
              payload: { amount_cents: 250000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
          assert:
            - "both responses have status 200 and the body is the Rebuilder aggregate"
            - "${rb_v} == 1 at creation and Rebuilder.${rb_id}.version == 3 after the second deposit"
            - "Rebuilder.${rb_id}.fees_deposited_cents == 750000 and fee_balance_cents == 750000"
            - "Rebuilder.${rb_id}.escrowed_fee_total_cents == 0 and fees_consumed_cents == 0"
            - "Rebuilder.${rb_id}.license_status == ACTIVE"

      - name: rescheduling_after_a_failure_recharges_the_program_total
        claim_type: conditional_action
        grounds:
          - endpoints[POST /v1/applications/{id}/inspections]
          - calculations.total_program_charge
        distinguishing_aspect: "Scheduling a second attempt is a conditional action that also recomputes the program charge by adding REINSPECTION_FEE_CENTS to the subtotal."
        excluded_because:
          difficulty_instance: expedite_tier_keyed_on_subtotal_not_on_running_total
          rationale: "The §1.8 instance already schedules the re-inspection from FAILED and asserts the recomputed subtotal, expedite band and total, so a separate corner would repeat the same call sequence and the same pre-computed literals."

  # ===========================================================================
  # Error-catalog coverage note (§1.6 has 55 codes; every code is triggered by at
  # least one instance across SCAFFOLD_DIFFICULTY_DESIGN.yaml and this file):
  #   401/403/400 plumbing codes and all fourteen 404 codes .... this errors section
  #   ERR_DUPLICATE_NATURAL_KEY, ERR_NOT_RESOURCE_OWNER, ERR_SUBMISSION_WINDOW_EXPIRED,
  #   ERR_INSPECTION_SLOT_IN_PAST, ERR_STATION_NOT_FLOOD_CAPABLE,
  #   ERR_DUPLICATE_ACTIVE_APPLICATION, ERR_TRANSFER_PREDATES_TITLE, ERR_VIN_MISMATCH,
  #   ERR_BRAND_ESCALATION_FORBIDDEN, ERR_INSUFFICIENT_FEE_BALANCE,
  #   ERR_RECORDKEEPING_SCORE_BLOCKS_ACTION, ERR_PHOTO_SET_INCOMPLETE ...... §1.9 validations
  #   ERR_APPLICATION_NOT_DRAFT, ERR_INSPECTION_NOT_SCHEDULED,
  #   ERR_INVALID_APPLICATION_STATE, ERR_TITLE_NOT_ACTIVE, ERR_APPEAL_STATE_INVALID ... §1.9 state_machines
  #   ERR_STALE_APPLICATION_VERSION, ERR_STALE_TITLE_VERSION ....... §1.9 cross_cutting_complexity_layers
  #   ERR_VEHICLE_FRAUD_HOLD, ERR_REBUILDER_LICENSE_INACTIVE,
  #   ERR_INSPECTOR_CREDENTIAL_EXPIRED, ERR_INSPECTOR_INTERVAL_CONFLICT,
  #   ERR_STATION_CAPACITY_EXCEEDED, ERR_ATTEMPT_LIMIT_EXCEEDED,
  #   ERR_STOLEN_COMPONENT_UNRESOLVED, ERR_DOCUMENTATION_INCOMPLETE ..... §1.8 instances
  #   ERR_SEGREGATION_OF_DUTIES, ERR_ROLE_NOT_PERMITTED (role matrix) ....... §1.9 rbac
  #   ERR_NON_REPAIRABLE_BRAND, ERR_SALVAGE_TITLE_REQUIRED, ERR_DONOR_TITLE_NOT_TRACEABLE,
  #   ERR_APPEAL_PENDING_BLOCKS_SCHEDULING, ERR_APPEAL_WINDOW_CLOSED,
  #   ERR_INSPECTION_NOT_IN_PROGRESS, ERR_PARTS_DOCUMENT_STATE_INVALID,
  #   ERR_REFERRAL_STATE_INVALID, ERR_LICENSE_ACTION_INVALID,
  #   ERR_RECOGNITION_ALREADY_DECIDED ......................... this errors section
  - section: errors
    instances:
      - name: writes_without_identity_headers_are_unauthenticated
        claim_type: error_triggerable
        grounds:
          - validations[priority=10]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Priority 10 outranks every other check, so an omitted X-User-ID header and an undeclared X-User-Role both produce ERR_UNAUTHENTICATED (401) even when the body is malformed and the path id does not exist."
        test_recipe:
          setup:
            - "no fixtures are needed; the first call omits the X-User-ID header, the second sends the undeclared role Auditor"
          setup_api_calls: []
          trigger:
            - call: "POST /v1/vehicles"
              payload: { vin: "1HGCM82633A0073XX", model_year: 2019, make: "Honda", model: "Accord", body_class: "NOT_A_CLASS", registered_state_code: "NV" }
              as: StateTitleClerk
              captures: { err_a: $.data.error_id }
            - call: "GET /v1/applications/00000000-0000-0000-0000-000000009999"
              payload: { }
              as: Auditor
              as_user_id: "aud-01"
              captures: { err_b: $.data.error_id }
          assert:
            - "the first call omits X-User-ID entirely, returns 401 and error_id == ERR_UNAUTHENTICATED, and the malformed body is never reported"
            - "the second call sends X-User-Role Auditor, returns 401 and error_id == ERR_UNAUTHENTICATED rather than a 404"
            - "no Vehicle row was created"
            - "both bodies carry exactly the error envelope fields error_id and message"

      - name: rebuilder_calling_a_clerk_only_write_is_forbidden
        claim_type: error_triggerable
        grounds:
          - validations[priority=20]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - endpoints[POST /v1/vehicles]
        distinguishing_aspect: "Priority 20 runs before the path and body checks: a Rebuilder posting to the clerk-only vehicle registry receives ERR_ROLE_NOT_PERMITTED (403), and the same role posting to a nonexistent application id still receives the role error rather than ERR_APPLICATION_NOT_FOUND."
        test_recipe:
          setup: ["one licensed rebuilder so the acting X-User-ID resolves"]
          setup_api_calls:
            - call: "POST /v1/rebuilders"
              payload: { legal_name: "Sierra Rebuilders LLC", license_number: "RB-9319", license_expires_at: "2027-06-30T00:00:00Z", bond_amount_cents: 2500000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { rb_id: $.data.id }
          trigger:
            - call: "POST /v1/vehicles"
              payload: { vin: "1HGCM82633A007319", model_year: 2019, make: "Honda", model: "Accord", body_class: "SEDAN", registered_state_code: "NV" }
              as: Rebuilder
              as_user_id: "${rb_id}"
              captures: { err_a: $.data.error_id }
            - call: "POST /v1/applications/00000000-0000-0000-0000-000000009999/docs-review"
              payload: { decision: "OPEN", review_note: "not my endpoint" }
              as: Rebuilder
              as_user_id: "${rb_id}"
              captures: { err_b: $.data.error_id }
          assert:
            - "both responses have status 403 and error_id == ERR_ROLE_NOT_PERMITTED"
            - "the second response is NOT ERR_APPLICATION_NOT_FOUND, proving priority 20 precedes priority 30"
            - "no Vehicle row exists with vin 1HGCM82633A007319"

      - name: unknown_ids_on_every_read_path_return_not_found
        claim_type: error_triggerable
        grounds:
