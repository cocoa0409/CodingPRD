    code: 200
    input: ["limit?", "offset?"]
    output: DiagnosticTool[]
    side_effects: []
  - method: POST
    path: "/emissions/diagnostic-tools/{id}/recalibrate"
    description: "RECAL_DUE -> CALIBRATED_ACTIVE; extends validity from the current clock"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: DiagnosticTool
    side_effects: ["calibration_valid_until = clock + 365 days; version += 1"]

  # ==========================================================================
  # MODULE warranty (extended emissions warranty claims)
  # ==========================================================================
  - method: POST
    path: "/emissions/warranty-claims"
    description: "File an emissions warranty claim. Stamps coverage_variant via warranty_coverage_determination (ERR_COVERAGE_EXPIRED when neither window is open). Validation order: unit IN_SERVICE, filer fleet ACTIVE, center AUTHORIZED, coverage."
    roles: [FleetManager, ServiceAdvisor]
    code: 201
    input: [engine_unit_id, service_center_id, failed_component_class, failure_code, claimed_amount_cents]
    output: WarrantyClaim
    side_effects: ["coverage_variant stamped; submitted_by_role/user_id captured; status SUBMITTED"]
  - method: GET
    path: "/emissions/warranty-claims/{id}"
    description: "Get a warranty claim"
    roles: [PlatformAdmin, CertificationEngineer, RegulatoryOfficer, FleetManager, ServiceAdvisor, WarrantyAdjudicator, RemanPlanner]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: GET
    path: "/emissions/warranty-claims"
    description: "List warranty claims with filters and pagination"
    roles: [PlatformAdmin, CertificationEngineer, RegulatoryOfficer, FleetManager, ServiceAdvisor, WarrantyAdjudicator, RemanPlanner]
    code: 200
    input: ["engine_unit_id?", "service_center_id?", "status?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []
  - method: POST
    path: "/emissions/warranty-claims/{id}/start-review"
    description: "SUBMITTED -> UNDER_REVIEW"
    roles: [WarrantyAdjudicator]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["version += 1"]
  - method: POST
    path: "/emissions/warranty-claims/{id}/request-info"
    description: "UNDER_REVIEW -> INFO_REQUESTED; at most MAX_REVIEW_ROUNDS (2) rounds per claim"
    roles: [WarrantyAdjudicator]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["review_round += 1; version += 1"]
  - method: POST
    path: "/emissions/warranty-claims/{id}/resubmit"
    description: "INFO_REQUESTED -> UNDER_REVIEW; only the filing fleet may resubmit"
    roles: [FleetManager, ServiceAdvisor]
    code: 200
    input: [supplemental_note]
    output: WarrantyClaim
    side_effects: ["version += 1"]
  - method: POST
    path: "/emissions/warranty-claims/{id}/adjudicate"
    description: "UNDER_REVIEW -> APPROVED_FULL / APPROVED_PARTIAL / DENIED_NEGLECT per decision, consistent with the computed neglect_score band. PARTIAL runs partial_claim_proration (variant by coverage_variant). DENY_NEGLECT increments the fleet's neglect_denial_count and suspends the fleet at 3."
    roles: [WarrantyAdjudicator]
    code: 200
    input: [decision]
    output: WarrantyClaim
    side_effects: ["neglect_score computed; approved_amount_cents + customer_share_cents set; decided_by_user_id = X-User-ID; DENY_NEGLECT cascades to Fleet (count += 1, SUSPENDED at >= 3)"]
  - method: POST
    path: "/emissions/warranty-claims/{id}/pay"
    description: "APPROVED_FULL or APPROVED_PARTIAL -> PAID"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["paid_at stamped; version += 1"]

  # ==========================================================================
  # MODULE campaigns (recall / field campaign execution)
  # ==========================================================================
  - method: POST
    path: "/emissions/field-campaigns"
    description: "Declare a field campaign (DRAFT) for a family in CERTIFIED, IN_PRODUCTION or COMPLIANCE_HOLD"
    roles: [RegulatoryOfficer]
    code: 201
    input: [engine_family_id, campaign_code, campaign_type, defect_summary, remedy_description, remedy_bay_days, "completion_threshold?"]
    output: FieldCampaign
    side_effects: ["completion_threshold defaults to 0.95; counters zeroed"]
  - method: GET
    path: "/emissions/field-campaigns/{id}"
    description: "Get a field campaign"
    roles: [PlatformAdmin, CertificationEngineer, RegulatoryOfficer, FleetManager, ServiceAdvisor, WarrantyAdjudicator, RemanPlanner]
    code: 200
    input: []
    output: FieldCampaign
    side_effects: []
  - method: POST
    path: "/emissions/field-campaigns/{id}/announce"
    description: "DRAFT -> ANNOUNCED; RECALL requires NON_CONFORMING latest in-use status. Cascades: family -> COMPLIANCE_HOLD; in-service units -> CAMPAIGN_OPEN; notified_unit_count stamped."
    roles: [RegulatoryOfficer]
    code: 200
    input: []
    output: FieldCampaign
    side_effects: ["family COMPLIANCE_HOLD; units flagged; notified_unit_count set; announced_at stamped; version += 1"]
  - method: POST
    path: "/emissions/field-campaigns/{id}/begin-execution"
    description: "ANNOUNCED -> IN_PROGRESS; requires notified_unit_count > 0"
    roles: [RegulatoryOfficer]
    code: 200
    input: []
    output: FieldCampaign
    side_effects: ["version += 1"]
  - method: POST
    path: "/emissions/field-campaigns/{id}/completion-review"
    description: "IN_PROGRESS -> COMPLETION_REVIEW; when completion_rate >= threshold the campaign closes in the same request (family exits COMPLIANCE_HOLD if no other open campaign)"
    roles: [RegulatoryOfficer]
    code: 200
    input: []
    output: FieldCampaign
    side_effects: ["completion_rate recomputed; conditional close cascade per state machine"]
  - method: POST
    path: "/emissions/field-campaigns/{id}/resume-execution"
    description: "COMPLETION_REVIEW -> IN_PROGRESS (revert loop when completion is below threshold)"
    roles: [RegulatoryOfficer]
    code: 200
    input: []
    output: FieldCampaign
    side_effects: ["version += 1"]

  # ==========================================================================
  # MODULE campaign-work-orders (shop capacity consumption)
  # ==========================================================================
  - method: POST
    path: "/emissions/field-campaigns/{campaignId}/work-orders"
    description: "Schedule a unit remedy at a center. Gates: campaign IN_PROGRESS; unit CAMPAIGN_OPEN; center AUTHORIZED; technician qualified (center membership, CERT_ACTIVE, endorsed, LEVEL_2+ when bay_days >= 3); bay capacity per day-bucket."
    roles: [ServiceAdvisor]
    code: 201
    input: [engine_unit_id, service_center_id, assigned_technician_id, scheduled_start_day, bay_days]
    output: CampaignWorkOrder
    side_effects: ["occupies one bay per day in [scheduled_start_day, +bay_days); status SCHEDULED"]
  - method: GET
    path: "/emissions/campaign-work-orders/{id}"
    description: "Get a campaign work order"
    roles: [PlatformAdmin, CertificationEngineer, RegulatoryOfficer, FleetManager, ServiceAdvisor, WarrantyAdjudicator, RemanPlanner]
    code: 200
    input: []
    output: CampaignWorkOrder
    side_effects: []
  - method: GET
    path: "/emissions/campaign-work-orders"
    description: "List campaign work orders with filters and pagination"
    roles: [PlatformAdmin, CertificationEngineer, RegulatoryOfficer, FleetManager, ServiceAdvisor, WarrantyAdjudicator, RemanPlanner]
    code: 200
    input: ["campaign_id?", "engine_unit_id?", "service_center_id?", "assigned_technician_id?", "status?", "limit?", "offset?"]
    output: CampaignWorkOrder[]
    side_effects: []
  - method: POST
    path: "/emissions/campaign-work-orders/{id}/start"
    description: "SCHEDULED -> IN_BAY; requires the center to hold >= 1 CALIBRATED_ACTIVE diagnostic tool"
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: CampaignWorkOrder
    side_effects: ["version += 1"]
  - method: POST
    path: "/emissions/campaign-work-orders/{id}/complete"
    description: "IN_BAY -> COMPLETED"
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: CampaignWorkOrder
    side_effects: ["completed_at stamped; version += 1"]
  - method: POST
    path: "/emissions/campaign-work-orders/{id}/verify"
    description: "COMPLETED -> VERIFIED. Cascade: unit CAMPAIGN_OPEN -> REMEDIED; campaign counters recomputed; campaign in COMPLETION_REVIEW at/above threshold closes; last-campaign close releases the family from COMPLIANCE_HOLD."
    roles: [RegulatoryOfficer]
    code: 200
    input: []
    output: CampaignWorkOrder
    side_effects: ["4-hop cascade per state machine; version += 1"]
  - method: POST
    path: "/emissions/campaign-work-orders/{id}/cancel"
    description: "SCHEDULED -> CANCELLED; releases occupied bay-days (capacity invariant)"
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: CampaignWorkOrder
    side_effects: ["bay occupancy released; version += 1"]

  # ==========================================================================
  # MODULE reman (remanufactured engines/components + core credits)
  # ==========================================================================
  - method: POST
    path: "/emissions/reman-orders"
    description: "Quote a remanufacture order (QUOTED). OCC: expected_engine_unit_version must equal the unit's current version; the create increments EngineUnit.version by 1. Unit must be IN_SERVICE; center AUTHORIZED."
    roles: [ServiceAdvisor]
    code: 201
    input: [engine_unit_id, service_center_id, reman_scope, spec_level, quoted_price_cents, quoted_core_value_cents, expected_core_return_by, expected_engine_unit_version, "component_type?"]
    output: RemanOrder
    side_effects: ["provisional_core_credit_cents + spec_level_surcharge_cents computed; increments EngineUnit.version by 1"]
  - method: GET
    path: "/emissions/reman-orders/{id}"
    description: "Get a reman order"
    roles: [PlatformAdmin, CertificationEngineer, RegulatoryOfficer, FleetManager, ServiceAdvisor, WarrantyAdjudicator, RemanPlanner]
    code: 200
    input: []
    output: RemanOrder
    side_effects: []
  - method: GET
    path: "/emissions/reman-orders"
    description: "List reman orders with filters and pagination"
    roles: [PlatformAdmin, CertificationEngineer, RegulatoryOfficer, FleetManager, ServiceAdvisor, WarrantyAdjudicator, RemanPlanner]
    code: 200
    input: ["engine_unit_id?", "service_center_id?", "status?", "limit?", "offset?"]
    output: RemanOrder[]
    side_effects: []
  - method: POST
    path: "/emissions/reman-orders/{id}/confirm"
    description: "QUOTED -> AWAITING_CORE; posts the provisional core credit to the center ledger"
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: RemanOrder
    side_effects: ["center.core_credit_balance_cents += provisional_core_credit_cents; version += 1"]
  - method: POST
    path: "/emissions/reman-orders/{id}/receive-core"
    description: "AWAITING_CORE -> CORE_RECEIVED; only on or before expected_core_return_by (inclusive boundary)"
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: RemanOrder
    side_effects: ["core_returned_at stamped; version += 1"]
  - method: POST
    path: "/emissions/reman-orders/{id}/grade-core"
    description: "CORE_RECEIVED -> CREDIT_ISSUED (grade A/B/C) or -> CORE_REJECTED (grade REJECT). Computes final credit with the 40%-of-effective-price cap, posts the delta vs provisional, counts reversals, suspends the center at 2 reversals."
    roles: [RemanPlanner]
    code: 200
    input: [core_grade]
    output: RemanOrder
    side_effects: ["final_core_credit_cents + invoice_total_cents computed on A/B/C; center ledger delta + reversal cascade per state machine; version += 1"]
  - method: POST
    path: "/emissions/reman-orders/{id}/forfeit-core"
    description: "AWAITING_CORE -> CORE_FORFEIT; only after expected_core_return_by has passed; reverses the provisional credit"
    roles: [ServiceAdvisor, RemanPlanner]
    code: 200
    input: []
    output: RemanOrder
    side_effects: ["final_core_credit_cents = 0; center ledger reversal + reversal-count cascade; version += 1"]
  - method: POST
    path: "/emissions/reman-orders/{id}/close"
    description: "CREDIT_ISSUED -> CLOSED"
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: RemanOrder
    side_effects: ["version += 1"]

  # ==========================================================================
  # MODULE in-use-compliance (in-use testing obligations)
  # ==========================================================================
  - method: POST
    path: "/emissions/engine-families/{familyId}/in-use-results"
    description: "Record an in-use compliance result for an IN_PRODUCTION family; computes conformity_ratio and outcome; stamps the family's in_use_compliance_status (latest per test_period_label wins)"
    roles: [RegulatoryOfficer]
    code: 201
    input: [test_period_label, sample_size, passing_units]
    output: InUseComplianceResult
    side_effects: ["conformity_ratio + outcome computed; family.in_use_compliance_status stamped; family.version += 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role name unknown" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role is valid but not in the endpoint's roles list" }
  - { id: ERR_FLEET_MISMATCH, http: 403, condition: "FleetManager X-User-ID does not equal the fleet_id owning the target unit" }
  - { id: ERR_CENTER_MISMATCH, http: 403, condition: "ServiceAdvisor X-User-ID does not equal the service_center_id the action names" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Certify attempted by the same X-User-ID that submitted the family for review" }
  # --- existence / shape ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK id does not resolve (checked left-to-right)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum member, out-of-range integer, passing_units > sample_size, or component_type present iff reman_scope == COMPONENT violated" }
  # --- OCC ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not equal the parent's current version" }
  # --- regulation standards ---
  - { id: ERR_DUPLICATE_STANDARD_CODE, http: 409, condition: "Standard code already exists" }
  - { id: ERR_STANDARD_WINDOW_OVERLAP, http: 409, condition: "Publish would create two PUBLISHED standards with overlapping model-year windows" }
  - { id: ERR_STANDARD_NOT_PUBLISHED, http: 409, condition: "Referenced standard is not PUBLISHED (family create, certify, supersede successor)" }
  - { id: ERR_SUPERSESSION_WINDOW_INVALID, http: 409, condition: "Successor's first model year is not strictly later than the superseded standard's" }
  - { id: ERR_MODEL_YEAR_OUTSIDE_STANDARD_WINDOW, http: 422, condition: "Engine family model_year outside [effective_model_year_first, effective_model_year_last]" }
  # --- certification ---
  - { id: ERR_DUPLICATE_FAMILY_CODE, http: 409, condition: "family_code already exists for the same model_year" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Generic: trigger not allowed from the resource's current state" }
  - { id: ERR_NO_ACTIVE_AFTERTREATMENT_SPEC, http: 409, condition: "begin-testing without an ACTIVE aftertreatment spec" }
  - { id: ERR_SPEC_NOT_CALIBRATED, http: 409, condition: "activate with calibration_status UNCALIBRATED" }
  - { id: ERR_FAMILY_NOT_IN_DESIGN_OR_TESTING, http: 409, condition: "Spec create/activate while the family is past TESTING" }
  - { id: ERR_REQUIRED_TEST_MISSING, http: 409, condition: "submit-review or certify without ACCEPTED runs for each of FTP, RMC, SET" }
  - { id: ERR_TEST_RESULT_NOT_PASS, http: 409, condition: "review decision=ACCEPT on a run whose result is FAIL" }
  - { id: ERR_LAB_WINDOW_OVERLAP, http: 409, condition: "New run's half-open window overlaps another SCHEDULED/COMPLETED run in the same lab" }
  # --- fleet / units ---
  - { id: ERR_DUPLICATE_SERIAL_NUMBER, http: 409, condition: "serial_number already exists within the family" }
  - { id: ERR_FAMILY_NOT_IN_PRODUCTION, http: 409, condition: "Unit create or in-use result requires family IN_PRODUCTION" }
  - { id: ERR_IN_SERVICE_DATE_IN_FUTURE, http: 422, condition: "in_service_date is strictly after the logical clock" }
  - { id: ERR_UNIT_NOT_IN_SERVICE, http: 409, condition: "Operation requires the unit's lifecycle to be IN_SERVICE" }
  - { id: ERR_WORK_ORDERS_OUTSTANDING, http: 409, condition: "Decommission blocked by work orders in SCHEDULED or IN_BAY" }
  - { id: ERR_REMAN_ORDER_OPEN, http: 409, condition: "Decommission blocked by reman orders in QUOTED, AWAITING_CORE or CORE_RECEIVED" }
  - { id: ERR_ODOMETER_EXCEEDS_UNIT, http: 422, condition: "Maintenance record odometer exceeds the unit's accumulated miles" }
  - { id: ERR_NON_MONOTONIC_ODOMETER, http: 409, condition: "Snapshot odometer_miles or engine_hours below the unit's accumulated values" }
  - { id: ERR_NON_MONOTONIC_TELEMATICS, http: 409, condition: "Snapshot recorded_at not strictly after unit.last_snapshot_at" }
  - { id: ERR_FLEET_SUSPENDED, http: 409, condition: "FleetManager of a SUSPENDED fleet may not file claims or maintenance records" }
  # --- service network ---
  - { id: ERR_DUPLICATE_BADGE_ID, http: 409, condition: "badge_id already exists within the center" }
  - { id: ERR_DUPLICATE_TOOL_SERIAL, http: 409, condition: "tool_serial already exists program-wide" }
  - { id: ERR_NO_QUALIFIED_TECHNICIAN, http: 409, condition: "Center authorize requires at least one CERT_ACTIVE emissions-endorsed technician" }
  - { id: ERR_CENTER_NOT_AUTHORIZED, http: 409, condition: "Operation requires the center's auth_status to be AUTHORIZED" }
  - { id: ERR_TECHNICIAN_NOT_QUALIFIED, http: 409, condition: "Assigned technician is not of the center, not CERT_ACTIVE, not endorsed, or below LEVEL_2 for bay_days >= 3" }
  - { id: ERR_TOOL_NOT_CALIBRATED, http: 409, condition: "Work-order start requires a CALIBRATED_ACTIVE diagnostic tool at the center" }
  # --- warranty ---
  - { id: ERR_COVERAGE_EXPIRED, http: 409, condition: "Neither extended (emissions classes) nor base warranty window is open at claim time" }
  - { id: ERR_REVIEW_ROUNDS_EXHAUSTED, http: 409, condition: "request-info with review_round already at 2" }
  - { id: ERR_DECISION_INCONSISTENT_WITH_SCORE, http: 422, condition: "Adjudication decision does not match the computed neglect_score band" }
  # --- campaigns ---
  - { id: ERR_DUPLICATE_CAMPAIGN_CODE, http: 409, condition: "campaign_code already exists within the family" }
  - { id: ERR_RECALL_REQUIRES_NON_CONFORMANCE, http: 409, condition: "RECALL announce requires the family's latest in_use_compliance_status to be NON_CONFORMING" }
  - { id: ERR_CAMPAIGN_HAS_NO_UNITS, http: 409, condition: "begin-execution with notified_unit_count == 0" }
  - { id: ERR_CAMPAIGN_NOT_IN_PROGRESS, http: 409, condition: "Work-order create requires the campaign to be IN_PROGRESS" }
  - { id: ERR_CAMPAIGN_STILL_OPEN, http: 409, condition: "Phase-out blocked by a campaign in ANNOUNCED, IN_PROGRESS or COMPLETION_REVIEW" }
  - { id: ERR_UNIT_CAMPAIGN_NOT_OPEN, http: 409, condition: "Work-order create for a unit whose campaign_compliance is not CAMPAIGN_OPEN" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 409, condition: "Some day in the work order's span would exceed the center's bay_capacity_per_day" }
  # --- reman ---
  - { id: ERR_CORE_RETURN_WINDOW_CLOSED, http: 409, condition: "receive-core after expected_core_return_by" }
  - { id: ERR_CORE_NOT_YET_LATE, http: 409, condition: "forfeit-core on or before expected_core_return_by" }
  # --- in-use compliance ---
  - { id: ERR_SAMPLE_SIZE_TOO_SMALL, http: 422, condition: "In-use result sample_size < 5" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "OEM program administrator: owns reference data, network administration, telematics ingest, payouts, and all test-driving endpoints"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /emissions/regulation-standards"
      - "POST /emissions/fleets, POST /emissions/fleets/{id}/reinstate"
      - "POST /emissions/engine-units, POST /emissions/engine-units/{id}/decommission"
      - "POST /emissions/engine-units/{unitId}/telematics-snapshots"
      - "POST /emissions/service-centers/* (audit, authorize, suspend, reinstate, revoke)"
      - "POST /emissions/service-centers/{id}/technicians, POST /emissions/technicians/{id}/recertify"
      - "POST /emissions/service-centers/{id}/diagnostic-tools, POST /emissions/diagnostic-tools/{id}/recalibrate"
      - "POST /emissions/warranty-claims/{id}/pay"
    shared_operations:
      - "all GET endpoints"
      - "POST /emissions/engine-units/{id}/maintenance-records (shared with FleetManager)"

  - name: CertificationEngineer
    description: "Powertrain certification engineer: designs engine families and aftertreatment systems, runs regulatory test programs"
    identity: opaque
    exclusive_operations:
      - "POST /emissions/engine-families and family lifecycle: begin-testing, submit-review, return-to-testing"
      - "POST /emissions/engine-families/{id}/aftertreatment-specs, calibrate, activate"
      - "POST /emissions/engine-families/{id}/test-runs, record-results"
    shared_operations:
      - "all GET endpoints"

  - name: RegulatoryOfficer
    description: "Compliance authority liaison: publishes/supersedes standards, certifies families (never the submitter), declares and closes campaigns, verifies remedies, records in-use results"
    identity: opaque
    exclusive_operations:
      - "POST /emissions/regulation-standards/{id}/publish, supersede"
      - "POST /emissions/engine-families/{id}/certify, enter-production, phase-out"
      - "POST /emissions/test-runs/{id}/review, invalidate"
      - "POST /emissions/field-campaigns and campaign lifecycle: announce, begin-execution, completion-review, resume-execution"
      - "POST /emissions/campaign-work-orders/{id}/verify"
      - "POST /emissions/engine-families/{id}/in-use-results"
    shared_operations:
      - "all GET endpoints"

  - name: FleetManager
    description: "Fleet operator: maintains its own fleet's units, files warranty claims, answers info requests"
    identity: "entity_backed:Fleet"
    exclusive_operations:
      - "POST /emissions/warranty-claims/{id}/resubmit (filing fleet only)"
    shared_operations:
      - "all GET endpoints"
      - "POST /emissions/warranty-claims (own fleet's units; shared with ServiceAdvisor)"
      - "POST /emissions/engine-units/{id}/maintenance-records (own fleet's units; shared with PlatformAdmin)"

  - name: ServiceAdvisor
    description: "Authorized service center operator: runs campaign work orders, files claims as the repairing center, runs the reman/core pipeline"
    identity: "entity_backed:ServiceCenter"
    exclusive_operations:
      - "POST /emissions/field-campaigns/{id}/work-orders"
      - "POST /emissions/campaign-work-orders/{id}/start, complete, cancel"
      - "POST /emissions/reman-orders and confirm, receive-core, close"
    shared_operations:
      - "all GET endpoints"
      - "POST /emissions/warranty-claims (as the repairing center; shared with FleetManager)"
      - "POST /emissions/warranty-claims/{id}/resubmit (shared with FleetManager)"
      - "POST /emissions/reman-orders/{id}/forfeit-core (shared with RemanPlanner)"

  - name: WarrantyAdjudicator
    description: "Warranty claim adjudicator: reviews claims, requests information, decides coverage vs maintenance neglect; never files claims"
    identity: opaque
    exclusive_operations:
      - "POST /emissions/warranty-claims/{id}/start-review, request-info, adjudicate"
    shared_operations:
      - "all GET endpoints"

  - name: RemanPlanner
    description: "Remanufacturing program planner: grades returned cores and issues final credits"
    identity: opaque
    exclusive_operations:
      - "POST /emissions/reman-orders/{id}/grade-core"
    shared_operations:
      - "all GET endpoints"
      - "POST /emissions/reman-orders/{id}/forfeit-core (shared with ServiceAdvisor)"
