              payload: {}
              as: Courier
              as_user_id: "${c_id}"
            - call: "GET /delivery-orders/${o1}"
              payload: {}
              as: Merchant
              as_user_id: "${m_id}"
          assert:
            - "DeliveryOrder.${o1}.quoted_fee_cents == 1000 (base 500 + surge component 500 at quote-time surge 2.0)"
            - "DeliveryOrder.${o1}.final_fee_cents == 500 (surge component 0 at dispatch-time surge 1.0)"
            - "DeliveryOrder.${o1}.merchant_invoice_cents == 500 (floored at base_total; uncapped formula would give 250)"

      - name: sla_report_excludes_out_of_window_deliveries
