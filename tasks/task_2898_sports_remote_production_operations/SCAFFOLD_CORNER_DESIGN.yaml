              payload: { outcome: "PASS" }
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "POST /broadcast-ops/system-preps"
              payload: { production_id: "${prod_id}", data_feed_id: "${feed_id}", system_kind: "GRAPHICS" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { prep_id: $.data.id }
            - call: "POST /broadcast-ops/system-preps/${prep_id}/validate-feed"
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { prep_status: $.data.status }
            - call: "POST /broadcast-ops/rehearsals"
              payload: { production_id: "${prod_id}", scheduled_start_utc: "2026-08-15T16:00:00Z" }
              as: TechnicalDirector
