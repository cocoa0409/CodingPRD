  - rule_id: non_linear_state_machine
    instances:
      - name: visit_install_and_education_axes_terminate_in_either_order
        grounds:
          - state_machines.HomeSafetyVisit.install_status
          - state_machines.HomeSafetyVisit.education_status
          - state_machines.HomeSafetyVisit.visit_status
          - entities.HomeSafetyVisit.fields.visit_status
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          Non-linearity on HomeSafetyVisit: two independent axes on the same row. Visit V1 finishes
          education first (SURVEYED + DELIVERED -> AWAITING_INSTALL_OUTCOME -> COMPLETED) while visit
          V2 finishes the install axis first (INSTALL_COMPLETE + PENDING -> AWAITING_EDUCATION ->
          COMPLETED). Both orderings converge on COMPLETED without either axis being skipped.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One TIER_2 zone with exactly two households, each 1 sleeping area / 1 storey and no fuel-burning appliance, so required smoke coverage is 2 and required CO coverage is 0."
            - "One PUBLISHED route with 2 slots; visit V1 at 14:00Z (demand 35, ends 14:35) and visit V2 at 14:45Z, which clears the 5-minute same-route buffer."
            - "Both visits arrived with 2 pre-existing working smoke alarms, so placement standards are already satisfied and no installation is needed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crr/zones"
              payload: { zone_code: "Z-B54", name: "Birchwood Leaf", occupied_units: 2000, structure_fire_count_5yr: 15, fire_injury_count_5yr: 2, pre_1980_unit_pct: 40.0, senior_household_pct: 20.0, under5_household_pct: 8.0, disability_household_pct: 4.0, assumed_alarm_absence_pct: 50.0, daily_visit_cap: 12 }
              as: RiskAnalyst
              captures: { z_b_id: $.data.id, z_b_v0: $.data.version }
            - call: "POST /crr/zones/${z_b_id}/assessments"
              payload: { basis: "PROVISIONAL", expected_zone_version: "${z_b_v0}" }
              as: RiskAnalyst
            - call: "POST /crr/crews"
              payload: { crew_code: "CREW-B1", member_count: 2, certification_level: "ADVANCED", max_daily_minutes: 480 }
              as: ProgramAdmin
              captures: { crew_b_id: $.data.id }
            - call: "POST /crr/households"
              payload: { zone_id: "${z_b_id}", address_line: "1 Birch Road", occupant_count: 2, sleeping_areas_count: 1, storeys: 1 }
              as: CanvassCoordinator
              captures: { hh1_id: $.data.id }
            - call: "POST /crr/households"
              payload: { zone_id: "${z_b_id}", address_line: "2 Birch Road", occupant_count: 2, sleeping_areas_count: 1, storeys: 1 }
              as: CanvassCoordinator
              captures: { hh2_id: $.data.id }
            - call: "POST /crr/routes"
              payload: { zone_id: "${z_b_id}", crew_id: "${crew_b_id}", service_date: "2026-08-03", window_start_utc: "2026-08-03T13:00:00Z", window_end_utc: "2026-08-03T21:00:00Z", planned_slots: 2 }
              as: CanvassCoordinator
              captures: { r_b_id: $.data.id }
            - call: "POST /crr/routes/${r_b_id}/publish"
              payload: {}
              as: CanvassCoordinator
            - call: "POST /crr/visits"
              payload: { household_id: "${hh1_id}", route_id: "${r_b_id}", scheduled_start_utc: "2026-08-03T14:00:00Z", appointment_option: "SCHEDULED_APPOINTMENT" }
              as: CanvassCoordinator
              captures: { v1_id: $.data.id }
            - call: "POST /crr/visits"
              payload: { household_id: "${hh2_id}", route_id: "${r_b_id}", scheduled_start_utc: "2026-08-03T14:45:00Z", appointment_option: "SCHEDULED_APPOINTMENT" }
              as: CanvassCoordinator
              captures: { v2_id: $.data.id }
            - call: "POST /crr/visits/${v1_id}/arrive"
              payload: { occupant_present: true, pre_existing_working_smoke_alarms: 2, pre_existing_working_co_alarms: 0 }
              as: CrrTechnician
              as_user_id: "${crew_b_id}"
            - call: "POST /crr/visits/${v2_id}/arrive"
              payload: { occupant_present: true, pre_existing_working_smoke_alarms: 2, pre_existing_working_co_alarms: 0 }
              as: CrrTechnician
              as_user_id: "${crew_b_id}"
          trigger:
            - call: "POST /crr/visits/${v1_id}/education"
              payload: { education_outcome: "DELIVERED", topics_covered: ["ALARM_TESTING", "ESCAPE_PLANNING"], escape_plan_walkthrough: true }
              as: CrrTechnician
