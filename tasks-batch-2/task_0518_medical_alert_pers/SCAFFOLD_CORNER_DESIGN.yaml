scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_monitoring_plan_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.MonitoringPlan, endpoints]
        distinguishing_aspect: "POST /pers/monitoring-plans with all required fields returns 201 and echoes tier/monthly_fee_cents; archived defaults false."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /pers/monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 3000, fall_detection_addon_cents: 0, included_test_interval_days: 30, response_sla_seconds: 60, early_termination_fee_cents: 0, min_commitment_months: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id, arch: $.data.archived }
          assert:
            - "response.status == 201"
            - "MonitoringPlan.${plan_id}.tier == BASIC"
            - "MonitoringPlan.${plan_id}.archived == false"

      - name: create_subscriber_missing_email_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Subscriber.fields.email, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /pers/subscribers without email (a required input field) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /pers/subscribers"
              payload: { full_name: "No Email", residence_address: "1 St", phone: "555" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: device_fall_detection_default_false
        claim_type: Defaults
        grounds: [entities.Device.fields.fall_detection_enabled]
        distinguishing_aspect: "POST /pers/devices omitting fall_detection_enabled defaults it to false; device starts status REGISTERED, battery_pct 100, battery_health GOOD."
        test_recipe:
          setup: ["One BASIC plan, subscriber, contract."]
          setup_api_calls:
            - call: "POST /pers/monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 3000, fall_detection_addon_cents: 0, included_test_interval_days: 30, response_sla_seconds: 60, early_termination_fee_cents: 0, min_commitment_months: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pers/subscribers"
              payload: { full_name: "Sub N1", email: "n1@x.com", residence_address: "1 N St", phone: "555-1" }
              as: PlatformAdmin
              captures: { sub_n: $.data.id }
            - call: "POST /pers/contracts"
              payload: { subscriber_id: "${sub_n}", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { ctr_n: $.data.id }
          trigger:
            - call: "POST /pers/devices"
              payload: { contract_id: "${ctr_n}", serial_number: "SN-N1", device_type: "PENDANT" }
              as: Subscriber
              as_user_id: "${sub_n}"
              captures: { dev_n: $.data.id, fd: $.data.fall_detection_enabled, st: $.data.status }
          assert:
            - "Device.${dev_n}.fall_detection_enabled == false"
            - "Device.${dev_n}.status == REGISTERED"
            - "Device.${dev_n}.battery_health == GOOD"

      - name: get_subscriber_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Subscriber, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /pers/subscribers/{id} with an unknown UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /pers/subscribers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: system_fields_server_minted_on_create
        claim_type: System Fields
        grounds: [entities.Subscriber.fields.status]
        distinguishing_aspect: "POST /pers/subscribers ignores any client-sent status/id; server mints id and sets status ACTIVE, version 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /pers/subscribers"
              payload: { full_name: "Sub Sys", email: "sys@x.com", residence_address: "1 Sys", phone: "555-9" }
              as: PlatformAdmin
              captures: { sub_id: $.data.id, st: $.data.status, v: $.data.version }
          assert:
            - "Subscriber.${sub_id}.status == ACTIVE"
            - "Subscriber.${sub_id}.version == 1"

      - name: device_invalid_device_type_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Device.fields.device_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /pers/devices with device_type not in the enum returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["One BASIC plan, subscriber, contract."]
          setup_api_calls:
            - call: "POST /pers/monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 3000, fall_detection_addon_cents: 0, included_test_interval_days: 30, response_sla_seconds: 60, early_termination_fee_cents: 0, min_commitment_months: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pers/subscribers"
              payload: { full_name: "Sub N2", email: "n2@x.com", residence_address: "2 N St", phone: "555-2" }
              as: PlatformAdmin
              captures: { sub_n2: $.data.id }
            - call: "POST /pers/contracts"
              payload: { subscriber_id: "${sub_n2}", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { ctr_n2: $.data.id }
          trigger:
            - call: "POST /pers/devices"
              payload: { contract_id: "${ctr_n2}", serial_number: "SN-N2", device_type: "SMARTWATCH" }
              as: Subscriber
              as_user_id: "${sub_n2}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: device_test_battery_out_of_range_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.DeviceTest.fields.reported_battery_pct, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /pers/devices/{id}/tests with reported_battery_pct=150 (outside 0..100) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["One BASIC plan, subscriber, contract, REGISTERED device."]
          setup_api_calls:
            - call: "POST /pers/monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 3000, fall_detection_addon_cents: 0, included_test_interval_days: 30, response_sla_seconds: 60, early_termination_fee_cents: 0, min_commitment_months: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pers/subscribers"
              payload: { full_name: "Sub N3", email: "n3@x.com", residence_address: "3 N St", phone: "555-3" }
              as: PlatformAdmin
              captures: { sub_n3: $.data.id }
            - call: "POST /pers/contracts"
              payload: { subscriber_id: "${sub_n3}", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { ctr_n3: $.data.id }
            - call: "POST /pers/devices"
              payload: { contract_id: "${ctr_n3}", serial_number: "SN-N3", device_type: "PENDANT" }
              as: Subscriber
              as_user_id: "${sub_n3}"
              captures: { dev_n3: $.data.id }
          trigger:
            - call: "POST /pers/devices/${dev_n3}/tests"
              payload: { reported_battery_pct: 150, signal_ok: true }
              as: Subscriber
              as_user_id: "${sub_n3}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: contract_pins_plan_fees_on_activation_computed_field
        claim_type: Computed Fields
        grounds: [entities.Contract.fields.pinned_monthly_fee_cents, state_machines.Contract.PENDING_ACTIVATION_to_ACTIVE]
        distinguishing_aspect: "On activate, Contract.pinned_monthly_fee_cents == plan.monthly_fee_cents (4500) even if the plan is later edited; the pinned value is server-computed."
        test_recipe:
          setup: ["PLUS-ish plan monthly 4500; activated contract with one device."]
          setup_api_calls:
            - call: "POST /pers/monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 4500, fall_detection_addon_cents: 0, included_test_interval_days: 30, response_sla_seconds: 60, early_termination_fee_cents: 0, min_commitment_months: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pers/subscribers"
              payload: { full_name: "Sub N4", email: "n4@x.com", residence_address: "4 N St", phone: "555-4" }
              as: PlatformAdmin
              captures: { sub_n4: $.data.id }
            - call: "POST /pers/contracts"
              payload: { subscriber_id: "${sub_n4}", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { ctr_n4: $.data.id }
            - call: "POST /pers/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pers/devices"
              payload: { contract_id: "${ctr_n4}", serial_number: "SN-N4", device_type: "PENDANT" }
              as: Subscriber
              as_user_id: "${sub_n4}"
              captures: { dev_n4: $.data.id }
            - call: "POST /pers/devices/${dev_n4}/tests"
              payload: { reported_battery_pct: 90, signal_ok: true }
              as: Subscriber
              as_user_id: "${sub_n4}"
            - call: "POST /pers/devices/${dev_n4}/enroll"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_n4}"
          trigger:
            - call: "POST /pers/contracts/${ctr_n4}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { pinned: $.data.pinned_monthly_fee_cents }
          assert:
            - "Contract.${ctr_n4}.pinned_monthly_fee_cents == 4500"

      - name: duplicate_device_serial_returns_duplicate
        claim_type: Type Constraints
        grounds: [entities.Device.fields.serial_number, "errors[ERR_DUPLICATE]", "validations[priority=16]"]
        distinguishing_aspect: "Two devices with the same serial_number: the second POST returns ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["Plan, subscriber, contract, one device with serial SN-DUP."]
          setup_api_calls:
            - call: "POST /pers/monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 3000, fall_detection_addon_cents: 0, included_test_interval_days: 30, response_sla_seconds: 60, early_termination_fee_cents: 0, min_commitment_months: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pers/subscribers"
              payload: { full_name: "Sub N5", email: "n5@x.com", residence_address: "5 N St", phone: "555-5" }
              as: PlatformAdmin
              captures: { sub_n5: $.data.id }
            - call: "POST /pers/contracts"
              payload: { subscriber_id: "${sub_n5}", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { ctr_n5: $.data.id }
            - call: "POST /pers/devices"
              payload: { contract_id: "${ctr_n5}", serial_number: "SN-DUP", device_type: "PENDANT" }
              as: Subscriber
              as_user_id: "${sub_n5}"
              captures: { dev_n5: $.data.id }
          trigger:
            - call: "POST /pers/devices"
              payload: { contract_id: "${ctr_n5}", serial_number: "SN-DUP", device_type: "WRISTBAND" }
              as: Subscriber
              as_user_id: "${sub_n5}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: activate_already_active_contract_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Contract.PENDING_ACTIVATION_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Activating an already-ACTIVE contract returns ERR_INVALID_STATE (409); no side effects fire."
        test_recipe:
          setup: ["Activated BASIC contract with one device."]
          setup_api_calls:
            - call: "POST /pers/monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 3000, fall_detection_addon_cents: 0, included_test_interval_days: 30, response_sla_seconds: 60, early_termination_fee_cents: 0, min_commitment_months: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pers/subscribers"
              payload: { full_name: "Sub O1", email: "o1@x.com", residence_address: "1 O St", phone: "556-1" }
              as: PlatformAdmin
              captures: { sub_o1: $.data.id }
            - call: "POST /pers/contracts"
              payload: { subscriber_id: "${sub_o1}", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { ctr_o1: $.data.id }
            - call: "POST /pers/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pers/devices"
              payload: { contract_id: "${ctr_o1}", serial_number: "SN-O1", device_type: "PENDANT" }
              as: Subscriber
              as_user_id: "${sub_o1}"
              captures: { dev_o1: $.data.id }
            - call: "POST /pers/devices/${dev_o1}/tests"
              payload: { reported_battery_pct: 90, signal_ok: true }
              as: Subscriber
              as_user_id: "${sub_o1}"
            - call: "POST /pers/devices/${dev_o1}/enroll"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_o1}"
            - call: "POST /pers/contracts/${ctr_o1}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /pers/contracts/${ctr_o1}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: suspend_active_but_current_billing_returns_invalid_state
        claim_type: precondition_violation
        grounds: [state_machines.Contract.ACTIVE_to_SUSPENDED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Suspend requires billing_status==PAST_DUE; suspending an ACTIVE+CURRENT contract returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Activated BASIC contract (billing CURRENT) with one device; no mark-past-due."]
          setup_api_calls:
            - call: "POST /pers/monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 3000, fall_detection_addon_cents: 0, included_test_interval_days: 30, response_sla_seconds: 60, early_termination_fee_cents: 0, min_commitment_months: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pers/subscribers"
              payload: { full_name: "Sub O2", email: "o2@x.com", residence_address: "2 O St", phone: "556-2" }
              as: PlatformAdmin
              captures: { sub_o2: $.data.id }
            - call: "POST /pers/contracts"
              payload: { subscriber_id: "${sub_o2}", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { ctr_o2: $.data.id }
            - call: "POST /pers/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pers/devices"
              payload: { contract_id: "${ctr_o2}", serial_number: "SN-O2", device_type: "PENDANT" }
              as: Subscriber
              as_user_id: "${sub_o2}"
              captures: { dev_o2: $.data.id }
            - call: "POST /pers/devices/${dev_o2}/tests"
              payload: { reported_battery_pct: 90, signal_ok: true }
              as: Subscriber
              as_user_id: "${sub_o2}"
            - call: "POST /pers/devices/${dev_o2}/enroll"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_o2}"
            - call: "POST /pers/contracts/${ctr_o2}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /pers/contracts/${ctr_o2}/suspend"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: cancel_shift_already_cancelled_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.AgentShift.SCHEDULED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling an already-CANCELLED AgentShift (terminal) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["One SCHEDULED shift for agent-z, then cancelled."]
          setup_api_calls:
            - call: "POST /pers/agent-shifts"
              payload: { agent_user_id: "agent-z", starts_at: "2026-06-01T00:00:00Z", ends_at: "2026-06-01T08:00:00Z" }
              as: PlatformAdmin
              captures: { sh_z: $.data.id }
            - call: "POST /pers/agent-shifts/${sh_z}/cancel"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /pers/agent-shifts/${sh_z}/cancel"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: enroll_device_initial_state_registered
        claim_type: initial_state
        grounds: [state_machines.Device.REGISTERED_to_ENROLLED, entities.Device.fields.status]
        distinguishing_aspect: "A newly created device starts in REGISTERED; enroll after a PASS test moves it to ENROLLED."
        test_recipe:
          setup: ["Plan, subscriber, contract, device with a PASS test."]
          setup_api_calls:
            - call: "POST /pers/monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 3000, fall_detection_addon_cents: 0, included_test_interval_days: 30, response_sla_seconds: 60, early_termination_fee_cents: 0, min_commitment_months: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pers/subscribers"
              payload: { full_name: "Sub O3", email: "o3@x.com", residence_address: "3 O St", phone: "556-3" }
              as: PlatformAdmin
              captures: { sub_o3: $.data.id }
            - call: "POST /pers/contracts"
              payload: { subscriber_id: "${sub_o3}", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { ctr_o3: $.data.id }
            - call: "POST /pers/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pers/devices"
              payload: { contract_id: "${ctr_o3}", serial_number: "SN-O3", device_type: "PENDANT" }
              as: Subscriber
              as_user_id: "${sub_o3}"
              captures: { dev_o3: $.data.id }
            - call: "POST /pers/devices/${dev_o3}/tests"
              payload: { reported_battery_pct: 90, signal_ok: true }
              as: Subscriber
              as_user_id: "${sub_o3}"
          trigger:
            - call: "POST /pers/devices/${dev_o3}/enroll"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_o3}"
              captures: { st: $.data.status }
          assert:
            - "Device.${dev_o3}.status == ENROLLED"

      - name: device_needs_test_auto_transition_on_overdue_test
        claim_type: auto_transition
        grounds: [state_machines.Device.ACTIVE_to_NEEDS_TEST, state_machines.Device.NEEDS_TEST_to_ACTIVE, entities.Device.fields.next_test_due_at]
        distinguishing_aspect: "An ACTIVE device past next_test_due_at auto-flags NEEDS_TEST then a PASS test returns it to ACTIVE; verifies the maintenance cycle and clock-gated auto-transition."
        test_recipe:
          setup: ["Activated device (interval 30d, next_test_due 2026-07-01); clock advanced to 2026-07-05; a PASS test is submitted."]
          setup_api_calls:
            - call: "POST /pers/monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 3000, fall_detection_addon_cents: 0, included_test_interval_days: 30, response_sla_seconds: 60, early_termination_fee_cents: 0, min_commitment_months: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pers/subscribers"
              payload: { full_name: "Sub O4", email: "o4@x.com", residence_address: "4 O St", phone: "556-4" }
              as: PlatformAdmin
              captures: { sub_o4: $.data.id }
            - call: "POST /pers/contracts"
              payload: { subscriber_id: "${sub_o4}", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { ctr_o4: $.data.id }
            - call: "POST /pers/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pers/devices"
              payload: { contract_id: "${ctr_o4}", serial_number: "SN-O4", device_type: "PENDANT" }
              as: Subscriber
              as_user_id: "${sub_o4}"
              captures: { dev_o4: $.data.id }
            - call: "POST /pers/devices/${dev_o4}/tests"
              payload: { reported_battery_pct: 90, signal_ok: true }
              as: Subscriber
              as_user_id: "${sub_o4}"
            - call: "POST /pers/devices/${dev_o4}/enroll"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_o4}"
            - call: "POST /pers/contracts/${ctr_o4}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /pers/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /pers/devices/${dev_o4}/tests"
              payload: { reported_battery_pct: 88, signal_ok: true }
              as: Subscriber
              as_user_id: "${sub_o4}"
              captures: { res: $.data.result }
            - call: "GET /pers/devices/${dev_o4}"
              payload: {}
              as: PlatformAdmin
              captures: { st: $.data.status }
          assert:
            - "Device.${dev_o4}.status == ACTIVE"

      - name: false_alarm_branch_distinct_side_effects
        claim_type: side_effect_execution
        grounds: [state_machines.AlarmEvent.CONTACTING_SUBSCRIBER_to_FALSE_ALARM, entities.Device.fields.open_alarm_count]
        distinguishing_aspect: "MARK_FALSE_ALARM moves the alarm to FALSE_ALARM, sets resolved_at, decrements Device.open_alarm_count to 0, and fires NO 911/escalation side effects."
        test_recipe:
          setup: ["ACTIVE device with an alarm; agent shift; alarm assigned and subscriber contacted."]
          setup_api_calls:
            - call: "POST /pers/monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 3000, fall_detection_addon_cents: 0, included_test_interval_days: 30, response_sla_seconds: 60, early_termination_fee_cents: 0, min_commitment_months: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pers/subscribers"
              payload: { full_name: "Sub O5", email: "o5@x.com", residence_address: "5 O St", phone: "556-5" }
              as: PlatformAdmin
              captures: { sub_o5: $.data.id }
            - call: "POST /pers/contracts"
              payload: { subscriber_id: "${sub_o5}", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { ctr_o5: $.data.id }
            - call: "POST /pers/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
