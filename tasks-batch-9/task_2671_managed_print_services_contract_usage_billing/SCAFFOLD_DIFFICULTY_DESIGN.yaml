  - rule_id: cross_entity_state_dependency
    instances:
      - name: device_activation_gated_on_site_secure_release_state
        grounds:
          - state_machines.Device.NETWORKED_to_ACTIVE
          - state_machines.Site.UNCONFIGURED_to_PENDING_VALIDATION
          - state_machines.Site.UNCONFIGURED_to_CONFIGURED
          - validations.priority_14_business_safety_ERR_SECURE_RELEASE_NOT_CONFIGURED
          - validations.priority_18_business_referential_ERR_DEVICE_NOT_METERABLE
        distinguishing_aspect: |
          Entity pair (Device, Site). The Device's NETWORKED -> ACTIVE transition is legal on the Device's
          own machine yet must be refused while the *Site* row sits in PENDING_VALIDATION, and the refusal
          propagates one entity further: meter intake for that device is impossible too. Flipping the Site
          to CONFIGURED - a write on a different entity, with no Device call in between - is what unblocks
          both. Implementations that only inspect device.lifecycle_state pass the first probe wrongly.
        test_recipe:
          setup:
            - "ACTIVE contract (MONO 1..null @9375, minimums 0) and a site whose secure print release was probed with DEFERRED, leaving secure_release_state == PENDING_VALIDATION with release_method PIN and network_vlan_tag 2001"
            - "one device PLACED then NETWORKED at that site (so it is one legal transition away from ACTIVE)"
            - "OPEN BillingPeriod 2026-08-01 .. 2026-09-01; logical clock at 2026-08-16T00:00:00Z"
