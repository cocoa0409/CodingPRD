scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: tuition_provisional_vs_invoiced_snapshot
        grounds:
          - calculations.tuition_monthly_charge
          - entities.Enrollment.fields.monthly_charge_cents
          - entities.Invoice.fields.tuition_cents
          - state_machines.Enrollment.CONFIRMED_to_DROPPED
        distinguishing_aspect: |
          The provisional variant lives on Enrollment.monthly_charge_cents and changes when a sibling
          enrollment drops; the invoiced_snapshot variant is frozen into Invoice.tuition_cents at
          generation and does NOT change when that same enrollment later drops — different fields,
          different entity (Enrollment vs Invoice).
        test_recipe:
          setup:
            - "Term OPEN with monthly_billing_day=15; one Room cap 20; one Instructor."
            - "Two OPEN sections in the term: classA monthly_tuition 10000, classB monthly_tuition 7000."
            - "Family with ONE student (level ELITE, age within both bands) CONFIRMED in both classes."
            - "Provisional charges: classA=10000 (1st), classB=6300 (2nd, mc10%); family 1 student so no family pct."
            - "Invoice for 2026-03 generated snapshotting tuition_cents=16300."
          setup_api_calls:
            - call: "POST /terms"
              payload: { name: "Spring 2026", start_date: "2026-02-01", end_date: "2026-06-30", age_cutoff_date: "2026-02-01", monthly_billing_day: 15 }
              as: StudioAdmin
              captures: { term_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "Studio A", capacity: 20 }
              as: StudioAdmin
              captures: { room_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Ms Lee", email: "lee@x.com", max_weekly_sessions: 30 }
              as: StudioAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /sections"
              payload: { term_id: "${term_id}", room_id: "${room_id}", instructor_id: "${inst_id}", discipline: "JAZZ", required_level: "PETITE", min_age: 5, max_age: 18, monthly_tuition_cents: 10000, capacity_cap: 20 }
              as: StudioAdmin
              captures: { secA_id: $.data.id }
            - call: "POST /sections/${secA_id}/sessions"
              payload: { day_of_week: 0, start_minute: 600, end_minute: 660 }
              as: StudioAdmin
            - call: "POST /sections"
              payload: { term_id: "${term_id}", room_id: "${room_id}", instructor_id: "${inst_id}", discipline: "TAP", required_level: "PETITE", min_age: 5, max_age: 18, monthly_tuition_cents: 7000, capacity_cap: 20 }
              as: StudioAdmin
              captures: { secB_id: $.data.id }
            - call: "POST /sections/${secB_id}/sessions"
              payload: { day_of_week: 0, start_minute: 700, end_minute: 760 }
              as: StudioAdmin
            - call: "POST /terms/${term_id}/open"
              payload: {}
              as: StudioAdmin
            - call: "POST /families"
              payload: { email: "fam1@x.com", family_name: "Alpha" }
              as: StudioAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/students"
              payload: { full_name: "Ada", birth_date: "2014-05-01", level: "ELITE" }
              as: StudioAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", section_id: "${secA_id}" }
              as: StudioAdmin
              captures: { enrA_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", section_id: "${secB_id}" }
              as: StudioAdmin
              captures: { enrB_id: $.data.id }
            - call: "POST /invoices/generate"
              payload: { family_id: "${fam_id}", term_id: "${term_id}", billing_month: "2026-03" }
              as: StudioAdmin
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${enrB_id}/drop"
              payload: {}
              as: StudioAdmin
          assert:
            - "Enrollment.${enrA_id}.monthly_charge_cents == 10000"
            - "Invoice.${inv_id}.tuition_cents == 16300"
            - "Invoice.${inv_id}.status == OPEN"

      - name: chaperone_threshold_vs_tuition_tier_distinct_domains
        grounds:
          - calculations.chaperone_requirement
          - calculations.tuition_monthly_charge
          - state_machines.TravelTrip.PROPOSED_to_CONFIRMED
        distinguishing_aspect: |
          chaperone_requirement is a ceil-threshold over TravelTrip participant counts (TravelTrip domain),
          whereas tuition_monthly_charge is a tiered-discount over Enrollment/Family billing (Family domain) —
          two valid calc shapes on entirely different entities, not a repeat of the same provisional/final shape.
        test_recipe:
          setup:
            - "A LOCKED team with min_level NOVICE; a PROPOSED trip ratio 4, chaperone_count 1, 4 participants GOING."
            - "ceil(4/4)=1 <= 1 chaperone, so trip can confirm; the chaperone calc is independent of any tuition tier."
          setup_api_calls:
            - call: "POST /teams"
              payload: { name: "Comp A", min_level: "NOVICE", roster_cap: 10 }
              as: StudioAdmin
              captures: { team_id: $.data.id, team_v0: $.data.version }
            - call: "POST /families"
              payload: { email: "fam2@x.com", family_name: "Beta" }
              as: StudioAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/students"
              payload: { full_name: "Bo", birth_date: "2010-01-01", level: "ELITE" }
              as: StudioAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /teams/${team_id}/memberships"
              payload: { student_id: "${s1_id}", expected_team_version: "${team_v0}" }
              as: StudioAdmin
              captures: { m1_id: $.data.id, team_v1: $.data.version }
            - call: "POST /families/${fam_id}/students"
              payload: { full_name: "Cy", birth_date: "2010-02-01", level: "ELITE" }
              as: StudioAdmin
              captures: { s2_id: $.data.id }
            - call: "POST /teams/${team_id}/memberships"
              payload: { student_id: "${s2_id}", expected_team_version: "${team_v1}" }
              as: StudioAdmin
              captures: { m2_id: $.data.id, team_v2: $.data.version }
            - call: "POST /families/${fam_id}/students"
              payload: { full_name: "Di", birth_date: "2010-03-01", level: "ELITE" }
              as: StudioAdmin
              captures: { s3_id: $.data.id }
            - call: "POST /teams/${team_id}/memberships"
              payload: { student_id: "${s3_id}", expected_team_version: "${team_v2}" }
              as: StudioAdmin
              captures: { m3_id: $.data.id, team_v3: $.data.version }
            - call: "POST /families/${fam_id}/students"
              payload: { full_name: "Ev", birth_date: "2010-04-01", level: "ELITE" }
              as: StudioAdmin
              captures: { s4_id: $.data.id }
            - call: "POST /teams/${team_id}/memberships"
              payload: { student_id: "${s4_id}", expected_team_version: "${team_v3}" }
              as: StudioAdmin
              captures: { m4_id: $.data.id }
            - call: "POST /teams/${team_id}/lock"
              payload: {}
              as: StudioAdmin
            - call: "POST /teams/${team_id}/trips"
              payload: { destination: "Nationals", depart_date: "2026-07-01", return_date: "2026-07-04", per_member_cost_cents: 50000, chaperone_ratio: 4, chaperone_count: 1 }
              as: StudioAdmin
              captures: { trip_id: $.data.id }
            - call: "POST /trips/${trip_id}/participants"
              payload: { membership_id: "${m1_id}" }
              as: StudioAdmin
            - call: "POST /trips/${trip_id}/participants"
              payload: { membership_id: "${m2_id}" }
              as: StudioAdmin
            - call: "POST /trips/${trip_id}/participants"
              payload: { membership_id: "${m3_id}" }
              as: StudioAdmin
            - call: "POST /trips/${trip_id}/participants"
              payload: { membership_id: "${m4_id}" }
              as: StudioAdmin
          trigger:
            - call: "POST /trips/${trip_id}/confirm"
              payload: {}
              as: StudioAdmin
          assert:
            - "TravelTrip.${trip_id}.status == CONFIRMED"
            - "TravelTrip.${trip_id}.participant_count == 4"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tuition_rounding_order_pinned_per_line   # mode (b): nested rounding order
        grounds:
          - calculations.tuition_monthly_charge
          - entities.Enrollment.fields.monthly_charge_cents
          - entities.Family.fields.sibling_count
        distinguishing_aspect: |
          For classB base 5005 as a 2nd class (mc 10%) in a 2-student family (family 5%), the PINNED order
          round-after-multiclass(=4505) then round-after-family yields 4280, whereas single-round at the end
          would yield 4279 — proving the per-line rounding order is the deciding factor (mode b).
        test_recipe:
          setup:
            - "Term OPEN; Room cap 20; Instructor."
            - "Family with TWO students; sibling_count=2 -> family discount 5%."
            - "Student1 CONFIRMED in classA (9000, 1st) and classB (5005, 2nd, mc10%); Student2 CONFIRMED in classC (7000, 1st)."
            - "classB per-line pinned = round(round(5005*0.9)=4505 *0.95)=4280."
          setup_api_calls:
            - call: "POST /terms"
              payload: { name: "Round Term", start_date: "2026-02-01", end_date: "2026-06-30", age_cutoff_date: "2026-02-01", monthly_billing_day: 10 }
              as: StudioAdmin
              captures: { term_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "Studio R", capacity: 20 }
              as: StudioAdmin
              captures: { room_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Mr Cy", email: "cy@x.com" }
              as: StudioAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /sections"
              payload: { term_id: "${term_id}", room_id: "${room_id}", instructor_id: "${inst_id}", discipline: "BALLET", required_level: "PETITE", min_age: 5, max_age: 18, monthly_tuition_cents: 9000, capacity_cap: 20 }
              as: StudioAdmin
              captures: { secA_id: $.data.id }
            - call: "POST /sections/${secA_id}/sessions"
              payload: { day_of_week: 1, start_minute: 600, end_minute: 660 }
              as: StudioAdmin
            - call: "POST /sections"
              payload: { term_id: "${term_id}", room_id: "${room_id}", instructor_id: "${inst_id}", discipline: "TAP", required_level: "PETITE", min_age: 5, max_age: 18, monthly_tuition_cents: 5005, capacity_cap: 20 }
              as: StudioAdmin
              captures: { secB_id: $.data.id }
            - call: "POST /sections/${secB_id}/sessions"
              payload: { day_of_week: 1, start_minute: 700, end_minute: 760 }
              as: StudioAdmin
            - call: "POST /sections"
              payload: { term_id: "${term_id}", room_id: "${room_id}", instructor_id: "${inst_id}", discipline: "JAZZ", required_level: "PETITE", min_age: 5, max_age: 18, monthly_tuition_cents: 7000, capacity_cap: 20 }
              as: StudioAdmin
              captures: { secC_id: $.data.id }
            - call: "POST /sections/${secC_id}/sessions"
              payload: { day_of_week: 1, start_minute: 800, end_minute: 860 }
              as: StudioAdmin
            - call: "POST /terms/${term_id}/open"
              payload: {}
              as: StudioAdmin
            - call: "POST /families"
              payload: { email: "fam3@x.com", family_name: "Gamma" }
              as: StudioAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/students"
              payload: { full_name: "S One", birth_date: "2014-01-01", level: "ELITE" }
              as: StudioAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /families/${fam_id}/students"
              payload: { full_name: "S Two", birth_date: "2014-02-01", level: "ELITE" }
              as: StudioAdmin
              captures: { s2_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${s1_id}", section_id: "${secA_id}" }
              as: StudioAdmin
              captures: { enrA_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${s2_id}", section_id: "${secC_id}" }
              as: StudioAdmin
              captures: { enrC_id: $.data.id }
          trigger:
            - call: "POST /enrollments"
              payload: { student_id: "${s1_id}", section_id: "${secB_id}" }
              as: StudioAdmin
              captures: { enrB_id: $.data.id }
          assert:
            - "Enrollment.${enrB_id}.monthly_charge_cents == 4280"
            - "Enrollment.${enrA_id}.monthly_charge_cents == 8550"
            - "Enrollment.${enrC_id}.monthly_charge_cents == 6650"

      - name: tuition_nonlinear_multiclass_family_interaction   # mode (a): >=3 inputs non-linear
        grounds:
          - calculations.tuition_monthly_charge
          - entities.Enrollment.fields.monthly_charge_cents
          - entities.Family.fields.sibling_count
        distinguishing_aspect: |
          The per-enrollment charge depends non-linearly on THREE inputs — the class's rank within the
          student's enrollments (multi-class tier), the family sibling_count (family tier), and the base
          tuition — combined as base*(1-mc)*(1-fam) with rank-by-tuition-DESC ordering, not a flat rate (mode a).
        test_recipe:
          setup:
            - "Term OPEN; one family with ONE student CONFIRMED in THREE classes (12000, 9000, 6000)."
            - "Ranked by tuition DESC: 12000(1st,0%), 9000(2nd,mc10%)->8100, 6000(3rd,mc20%)->4800; family 1 student 0%."
          setup_api_calls:
            - call: "POST /terms"
              payload: { name: "NL Term", start_date: "2026-02-01", end_date: "2026-06-30", age_cutoff_date: "2026-02-01", monthly_billing_day: 10 }
              as: StudioAdmin
              captures: { term_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "Studio NL", capacity: 20 }
              as: StudioAdmin
              captures: { room_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Mr NL", email: "nl@x.com" }
              as: StudioAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /sections"
              payload: { term_id: "${term_id}", room_id: "${room_id}", instructor_id: "${inst_id}", discipline: "BALLET", required_level: "PETITE", min_age: 5, max_age: 18, monthly_tuition_cents: 12000, capacity_cap: 20 }
              as: StudioAdmin
              captures: { secA_id: $.data.id }
            - call: "POST /sections/${secA_id}/sessions"
              payload: { day_of_week: 2, start_minute: 600, end_minute: 660 }
              as: StudioAdmin
            - call: "POST /sections"
              payload: { term_id: "${term_id}", room_id: "${room_id}", instructor_id: "${inst_id}", discipline: "JAZZ", required_level: "PETITE", min_age: 5, max_age: 18, monthly_tuition_cents: 9000, capacity_cap: 20 }
              as: StudioAdmin
              captures: { secB_id: $.data.id }
            - call: "POST /sections/${secB_id}/sessions"
              payload: { day_of_week: 2, start_minute: 700, end_minute: 760 }
              as: StudioAdmin
            - call: "POST /sections"
              payload: { term_id: "${term_id}", room_id: "${room_id}", instructor_id: "${inst_id}", discipline: "TAP", required_level: "PETITE", min_age: 5, max_age: 18, monthly_tuition_cents: 6000, capacity_cap: 20 }
              as: StudioAdmin
              captures: { secC_id: $.data.id }
            - call: "POST /sections/${secC_id}/sessions"
              payload: { day_of_week: 2, start_minute: 800, end_minute: 860 }
              as: StudioAdmin
            - call: "POST /terms/${term_id}/open"
              payload: {}
              as: StudioAdmin
            - call: "POST /families"
              payload: { email: "fam4@x.com", family_name: "Delta" }
              as: StudioAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/students"
              payload: { full_name: "Only Child", birth_date: "2014-01-01", level: "ELITE" }
              as: StudioAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", section_id: "${secA_id}" }
              as: StudioAdmin
              captures: { enrA_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", section_id: "${secB_id}" }
              as: StudioAdmin
              captures: { enrB_id: $.data.id }
          trigger:
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", section_id: "${secC_id}" }
              as: StudioAdmin
              captures: { enrC_id: $.data.id }
          assert:
            - "Enrollment.${enrA_id}.monthly_charge_cents == 12000"
            - "Enrollment.${enrB_id}.monthly_charge_cents == 8100"
            - "Enrollment.${enrC_id}.monthly_charge_cents == 4800"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: section_cyclic_open_full_open
        grounds:
          - state_machines.ClassSection.OPEN_to_FULL
          - state_machines.ClassSection.FULL_to_OPEN
          - entities.ClassSection.fields.enrolled_count
        distinguishing_aspect: |
          ClassSection cycles OPEN->FULL (cap reached on confirm) then FULL->OPEN (a confirmed drop with no
          waitlist to promote) — a genuine cycle on the same entity, not a one-way pipeline.
        test_recipe:
          setup:
            - "Term OPEN; section with capacity_cap=1 (Room cap 20 so effective cap=1)."
            - "Family F1 student CONFIRMED -> section FULL."
          setup_api_calls:
            - call: "POST /terms"
              payload: { name: "Cyc Term", start_date: "2026-02-01", end_date: "2026-06-30", age_cutoff_date: "2026-02-01", monthly_billing_day: 10 }
              as: StudioAdmin
              captures: { term_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "Studio C", capacity: 20 }
              as: StudioAdmin
              captures: { room_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Mr C", email: "c@x.com" }
              as: StudioAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /sections"
              payload: { term_id: "${term_id}", room_id: "${room_id}", instructor_id: "${inst_id}", discipline: "JAZZ", required_level: "PETITE", min_age: 5, max_age: 18, monthly_tuition_cents: 8000, capacity_cap: 1 }
              as: StudioAdmin
              captures: { sec_id: $.data.id }
            - call: "POST /sections/${sec_id}/sessions"
              payload: { day_of_week: 3, start_minute: 600, end_minute: 660 }
              as: StudioAdmin
            - call: "POST /terms/${term_id}/open"
              payload: {}
              as: StudioAdmin
            - call: "POST /families"
              payload: { email: "fc@x.com", family_name: "Cyc" }
              as: StudioAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/students"
              payload: { full_name: "First", birth_date: "2014-01-01", level: "ELITE" }
              as: StudioAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", section_id: "${sec_id}" }
              as: StudioAdmin
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr_id}/drop"
              payload: {}
              as: StudioAdmin
          assert:
            - "ClassSection.${sec_id}.status == OPEN"
            - "ClassSection.${sec_id}.enrolled_count == 0"

      - name: enrollment_parallel_placement_vs_billing
        grounds:
          - state_machines.Enrollment.CONFIRMED_to_CONFIRMED
          - entities.Enrollment.fields.placement_status
          - entities.Enrollment.fields.billing_status
        distinguishing_aspect: |
          Enrollment carries two independent state dimensions: placement_status stays CONFIRMED while
          billing_status toggles BILLING_ACTIVE -> BILLING_PAUSED -> BILLING_ACTIVE — parallel dimensions
          on a different entity than the ClassSection cycle.
        test_recipe:
          setup:
            - "Term OPEN; section cap 20; family student CONFIRMED (placement CONFIRMED, billing BILLING_ACTIVE)."
          setup_api_calls:
            - call: "POST /terms"
              payload: { name: "Par Term", start_date: "2026-02-01", end_date: "2026-06-30", age_cutoff_date: "2026-02-01", monthly_billing_day: 10 }
              as: StudioAdmin
              captures: { term_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "Studio P", capacity: 20 }
              as: StudioAdmin
              captures: { room_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Mr P", email: "p@x.com" }
              as: StudioAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /sections"
              payload: { term_id: "${term_id}", room_id: "${room_id}", instructor_id: "${inst_id}", discipline: "HIPHOP", required_level: "PETITE", min_age: 5, max_age: 18, monthly_tuition_cents: 8000, capacity_cap: 20 }
              as: StudioAdmin
              captures: { sec_id: $.data.id }
            - call: "POST /sections/${sec_id}/sessions"
              payload: { day_of_week: 4, start_minute: 600, end_minute: 660 }
              as: StudioAdmin
            - call: "POST /terms/${term_id}/open"
              payload: {}
              as: StudioAdmin
            - call: "POST /families"
              payload: { email: "fp@x.com", family_name: "Par" }
              as: StudioAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/students"
              payload: { full_name: "Pat", birth_date: "2014-01-01", level: "ELITE" }
              as: StudioAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", section_id: "${sec_id}" }
              as: StudioAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/pause-billing"
              payload: {}
              as: StudioAdmin
          trigger:
            - call: "POST /enrollments/${enr_id}/resume-billing"
              payload: {}
              as: StudioAdmin
          assert:
            - "Enrollment.${enr_id}.placement_status == CONFIRMED"
            - "Enrollment.${enr_id}.billing_status == BILLING_ACTIVE"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: drop_promote_recompute_chain_depth3
        grounds:
          - state_machines.Enrollment.CONFIRMED_to_DROPPED
          - state_machines.Enrollment.WAITLISTED_to_WAITLIST_PROMOTED
          - calculations.tuition_monthly_charge
          - entities.Enrollment.fields.monthly_charge_cents
        distinguishing_aspect: |
          Depth-3 chain: dropping the CONFIRMED enrollment (A) frees a slot which promotes the waitlisted
          enrollment (B); B's promotion itself flips B.billing_status to BILLING_ACTIVE which itself triggers
          a tuition recompute on B's family's enrollments (C) — each hop caused by the previous, not the drop.
        test_recipe:
          setup:
            - "Section capacity_cap=1. Family F1 has student confirmed (occupying the 1 slot)."
            - "Family F2 has TWO students: studentX waitlisted in this section (rank 1), studentY confirmed in another class."
            - "F2 before promotion: studentY's class is its only BILLING_ACTIVE enrollment, family 1 active student-> family 0%; studentY charge un-discounted."
          setup_api_calls:
            - call: "POST /terms"
              payload: { name: "Casc Term", start_date: "2026-02-01", end_date: "2026-06-30", age_cutoff_date: "2026-02-01", monthly_billing_day: 10 }
              as: StudioAdmin
              captures: { term_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "Studio Casc", capacity: 20 }
