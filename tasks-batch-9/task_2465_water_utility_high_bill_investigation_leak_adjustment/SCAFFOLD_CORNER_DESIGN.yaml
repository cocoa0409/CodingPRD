  - section: calculations
    instances:

      - name: corner_calc_correct_result_sewer_cap_binds_exactly_at_twelve_thousand_gallons
        claim_type: correct_result
        grounds:
          - calculations.sewer_charge_with_submeter_credit
          - calculations.tiered_water_charge
          - endpoints[POST /bills]
        distinguishing_aspect: |
          A 12000-gallon SUMMER bill sits exactly on sewer_cap_gallons, so min(12000, 12000) is a
          no-op and the sewer charge is the full 7320 cents, while the same volume straddles all
          three water tiers (3000 + 7000 + 2000) and lands on 7937 cents for a 15257-cent total.
          Every number here is pinned by the two formulas rather than by any state machine, so an
          off-by-one cap (11999 or 12001 gallons billable) or a mis-split tier is immediately
          visible.
        test_recipe:
          setup:
            - "RS-STD-2026 and BillingPeriod 2025-06 (SUMMER) exist; the clock is 2026-08-01T00:00:00Z."
            - "ServiceAccount ACC-3001 has one POTABLE_MASTER meter with no submeters, and reads 100000 at 2025-05-31 and 112000 at 2025-06-30 give exactly 12000 gallons."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
