# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2769 — Public Access Television Studio Operations
#
# Nine §0.5 rule_ids x 2 instances = 18 instances. Every `grounds:` entry
# resolves into SCAFFOLD.yaml §1.1-§1.7; every setup chain drives an empty
# database into the described state using only §1.5 endpoints; every numeric
# assert below was produced by executing the §1.3 formula it belongs to.
#
# Fixed reference data used across instances (server default clock is
# 2026-08-01T00:00:00Z):
#   TV-101 BASIC   grants [STUDIO_FLOOR, EDIT_SUITE]  session 2026-08-05 17:00-21:00Z
#   TV-201 ADVANCED grants [CONTROL_ROOM]             session 2026-08-07 17:00-21:00Z
#   TV-301 LIVE    grants [LIVE_SWITCHER]             session 2026-08-09 17:00-21:00Z
#   PATV1 / PATV2  PUBLIC channels, window 1080..1380, buffer 120 s
#   STUDIO-A       base_deposit 12345, replacement 900000, needs STUDIO_FLOOR
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: franchise_allocation_accrual_vs_cash_diverges_on_funding_period
        grounds:
          - calculations.franchise_fee_allocation
          - entities.FundingPeriod.fields.basis
          - entities.FundingPeriod.fields.admin_reserve_cents
          - entities.FundingPeriod.fields.capital_allocation_cents
          - entities.FundingPeriod.fields.operating_allocation_cents
          - state_machines.FundingPeriod.DRAFT_to_SUBMITTED
          - state_machines.FundingPeriod.RETURNED_FOR_REVISION_to_DRAFT
        distinguishing_aspect: |
          This dual-variant calculation lives in the municipal money domain on
          FundingPeriod: the same three raw figures recognised on an ACCRUAL
          basis yield admin_reserve_cents 250000 / capital 1762500 / operating
          3087500, and on a CASH basis 384000 / 1645600 / 2870400 — a 134000-cent
          divergence in the administrative reserve alone.
        test_recipe:
          setup:
            - "One FundingPeriod for fiscal_year 2026 quarter 3 in report_status DRAFT, basis ACCRUAL, service_period_earned_cents 5000000, remittance_received_cents 4800000, capital_grant_cents 100000."
            - "No other funding period exists, so the (fiscal_year, quarter) natural key is free."
          setup_api_calls:
            - call: "POST /funding-periods"
              payload: {fiscal_year: 2026, quarter: 3, basis: "ACCRUAL", gross_franchise_fee_cents: 5200000, service_period_earned_cents: 5000000, remittance_received_cents: 4800000, capital_grant_cents: 100000}
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: {fp_id: $.data.id}
          trigger:
            - call: "POST /funding-periods/${fp_id}/report-submit"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: {accrual_admin: $.data.admin_reserve_cents, accrual_capital: $.data.capital_allocation_cents, accrual_operating: $.data.operating_allocation_cents}
            - call: "POST /funding-periods/${fp_id}/report-decision"
              payload: {decision: "RETURN", reason: "Restate the quarter on a cash basis"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "GET /funding-periods/${fp_id}"
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: {fp_v: $.data.version}
            - call: "POST /funding-periods/${fp_id}/revise"
              payload: {expected_funding_period_version: "${fp_v}", basis: "CASH"}
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: {cash_admin: $.data.admin_reserve_cents, cash_capital: $.data.capital_allocation_cents, cash_operating: $.data.operating_allocation_cents}
          assert:
            - "After report-submit: FundingPeriod.${fp_id}.allocable_base_cents == 5000000 (ACCRUAL selects service_period_earned_cents)"
            - "${accrual_admin} == 250000 (base >= HIGH_TIER_THRESHOLD_CENTS so admin_bp is 500, not 800)"
            - "${accrual_capital} == 1762500 (ROUND_HALF_UP(4750000 * 0.35) = 1662500, plus the 100000 capital grant)"
            - "${accrual_operating} == 3087500"
            - "250000 + 1762500 + 3087500 == 5100000 == FundingPeriod.${fp_id}.total_program_funds_cents at submit time"
            - "After revise to CASH: FundingPeriod.${fp_id}.allocable_base_cents == 4800000"
            - "${cash_admin} == 384000 (base < 5000000 so admin_bp falls back to 800)"
            - "${cash_capital} == 1645600 and ${cash_operating} == 2870400"
            - "384000 + 1645600 + 2870400 == 4900000 == FundingPeriod.${fp_id}.total_program_funds_cents after revise"
            - "The ACCRUAL-vs-CASH admin delta is exactly 384000 - 250000 == 134000 on identical raw inputs"
            - "FundingPeriod.${fp_id}.report_status == DRAFT and revision_round == 1 after the revise"

      - name: impact_index_provisional_vs_final_diverges_on_archive_asset
        grounds:
          - calculations.community_impact_index
          - entities.ArchiveAsset.fields.impact_variant
          - entities.ArchiveAsset.fields.community_impact_index
          - entities.ArchiveAsset.fields.volunteer_hours_tenths
          - state_machines.PlaybackSlot.SCHEDULED_to_AIRED
          - state_machines.ArchiveAsset.PENDING_to_PUBLISHED
        distinguishing_aspect: |
          The second dual-variant calculation sits in a different entity domain —
          community-impact scoring on ArchiveAsset, not money on FundingPeriod:
          the PROVISIONAL variant scores the same aired broadcast at 32.00 by
          forcing views and volunteer tenths to zero, while the FINAL variant
          scores 33.20 on publication and 48.20 once 250 on-demand views land.
        test_recipe:
          setup:
            - "Producer P is ACTIVE with certification_level BASIC and competency_codes [STUDIO_FLOOR, EDIT_SUITE]."
            - "Producer V is ACTIVE (certification_level NONE) and serves as the CAMERA volunteer."
            - "Program PR (runtime_seconds 1800, is_live false, required_crew_roles [CAMERA]) is APPROVED and CLEARED."
            - "Channel PATV1 carries a SCHEDULED slot at 2026-08-20T18:00:00Z with occupied_seconds 1920 and staffing_status READY."
            - "The clock stands at 2026-08-20T18:00:00Z so the slot may air."
          setup_api_calls:
            - call: "POST /producers"
              payload: {legal_name: "Ada Lovelace", email: "ada@patv.example"}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {p_id: $.data.id}
            - call: "POST /producers/${p_id}/residency-verification"
              payload: {document_reference: "UTIL-2026-0001"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /training-courses"
              payload: {course_code: "TV-101", title: "Studio Basics", tier: "BASIC", grants_competency_codes: ["STUDIO_FLOOR", "EDIT_SUITE"], seat_capacity: 12, session_start_at: "2026-08-05T17:00:00Z", session_end_at: "2026-08-05T21:00:00Z"}
              as: TrainingCoordinator
              as_user_id: "trn-1"
              captures: {c_basic_id: $.data.id}
            - call: "POST /course-enrollments"
              payload: {producer_id: "${p_id}", course_id: "${c_basic_id}"}
              as: Producer
              as_user_id: "${p_id}"
              captures: {e_basic_id: $.data.id}
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-06T00:00:00Z"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /course-enrollments/${e_basic_id}/attendance"
              payload: {attended: true}
              as: TrainingCoordinator
              as_user_id: "trn-1"
            - call: "POST /course-enrollments/${e_basic_id}/grade"
              payload: {practical_score: 88}
              as: TrainingCoordinator
              as_user_id: "trn-1"
            - call: "POST /producers"
              payload: {legal_name: "Vera Rubin", email: "vera@patv.example"}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {v_id: $.data.id}
            - call: "POST /producers/${v_id}/residency-verification"
              payload: {document_reference: "UTIL-2026-0002"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /channels"
              payload: {call_sign: "PATV1", tier: "PUBLIC", daily_window_start_minute: 1080, daily_window_end_minute: 1380, inter_program_buffer_seconds: 120, preemption_enabled: true}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {ch_id: $.data.id}
            - call: "POST /programs"
              payload: {producer_id: "${p_id}", title: "Neighborhood Notes", runtime_seconds: 1800, is_live: false, required_crew_roles: ["CAMERA"]}
              as: Producer
              as_user_id: "${p_id}"
              captures: {prog_id: $.data.id}
            - call: "POST /programs/${prog_id}/attestations"
              payload: {attestation_kind: "INDEMNIFICATION", statement_version: "2026.1", third_party_material: false}
              as: Producer
              as_user_id: "${p_id}"
            - call: "POST /programs/${prog_id}/attestations"
              payload: {attestation_kind: "COPYRIGHT_CLEARANCE", statement_version: "2026.1", third_party_material: false}
              as: Producer
              as_user_id: "${p_id}"
            - call: "POST /programs/${prog_id}/attestations"
              payload: {attestation_kind: "CONTENT_POLICY", statement_version: "2026.1", third_party_material: false}
              as: Producer
              as_user_id: "${p_id}"
            - call: "POST /programs/${prog_id}/submit"
              payload: {}
              as: Producer
              as_user_id: "${p_id}"
            - call: "POST /programs/${prog_id}/review-claim"
              payload: {}
              as: ContentReviewer
              as_user_id: "rev-1"
            - call: "POST /programs/${prog_id}/review-decision"
              payload: {decision: "APPROVE"}
              as: ContentReviewer
              as_user_id: "rev-1"
            - call: "POST /playback-slots"
              payload: {channel_id: "${ch_id}", program_id: "${prog_id}", start_at: "2026-08-20T18:00:00Z"}
              as: SchedulingCoordinator
              as_user_id: "sch-1"
              captures: {slot_id: $.data.id}
            - call: "POST /crew-assignments"
              payload: {slot_id: "${slot_id}", volunteer_producer_id: "${v_id}", crew_role: "CAMERA"}
              as: SchedulingCoordinator
              as_user_id: "sch-1"
              captures: {ca_id: $.data.id}
            - call: "POST /crew-assignments/${ca_id}/confirm"
              payload: {}
              as: Producer
              as_user_id: "${v_id}"
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-20T18:00:00Z"}
              as: CenterAdmin
              as_user_id: "adm-1"
          trigger:
            - call: "POST /playback-slots/${slot_id}/air"
              payload: {measured_households: 640}
              as: SchedulingCoordinator
              as_user_id: "sch-1"
            - call: "GET /archive-assets"
              payload: {source_slot_id: "${slot_id}"}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {asset_id: "$.data[0].id", prov_index: "$.data[0].community_impact_index", prov_variant: "$.data[0].impact_variant", asset_tenths: "$.data[0].volunteer_hours_tenths"}
            - call: "POST /archive-assets/${asset_id}/publish"
              payload: {retention_class: "STANDARD_24M"}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {final_index_at_publish: $.data.community_impact_index, final_variant: $.data.impact_variant, retain_until: $.data.retain_until}
            - call: "POST /archive-assets/${asset_id}/record-views"
              payload: {on_demand_views: 250}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {final_index_with_views: $.data.community_impact_index}
          assert:
            - "${prov_variant} == PROVISIONAL and ${prov_index} == 32.00 (100 * 0.5 * min(1, 640/1000), with views and volunteer tenths forced to 0)"
            - "${asset_tenths} == 6 — the CAMERA volunteer's credited_hours_tenths ceil(1920/360) is already stored on the asset, so the 32.00 is a variant choice and not missing data"
            - "${final_variant} == FINAL and ${final_index_at_publish} == 33.20 (32.00 + 100 * 0.2 * 0.06)"
            - "${final_index_with_views} == 48.20 (32.00 + 100 * 0.3 * 0.5 + 1.20)"
            - "The PROVISIONAL -> FINAL delta on the identical broadcast is exactly 33.20 - 32.00 == 1.20"
            - "${retain_until} == 2028-08-20T18:00:00Z (24 calendar months after published_at)"
            - "ArchiveAsset.${asset_id}.measured_households == 640 and on_demand_views == 250"
            - "CrewAssignment.${ca_id}.status == COMPLETED and credited_hours_tenths == 6"
            - "Producer.${v_id}.volunteer_hours_tenths == 6 and confirmed_crew_commitments == 0"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: deposit_hold_per_line_rounding_beats_combined_rate_mode_b
        grounds:
          - calculations.reservation_deposit_hold
          - entities.Reservation.fields.risk_bp
          - entities.Reservation.fields.deposit_hold_cents
          - entities.StudioResource.fields.base_deposit_cents
          - state_machines.Reservation.REQUESTED_to_CONFIRMED
          - state_machines.DamageAssessment.FILED_to_FINALIZED
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order matters: rounding the risk
          line and the duration line separately and then summing yields
          14197 + 1235 = 15432 cents, whereas summing the basis points to 2500 bp
          and rounding once yields 15431; the scaffold pins per-line rounding, so
          15431 is a wrong answer and not a tolerance.
        test_recipe:
          setup:
            - "Producer P is ACTIVE with certification_level BASIC and competency_codes [STUDIO_FLOOR, EDIT_SUITE]."
            - "StudioResource STUDIO-A has base_deposit_cents 12345, replacement_value_cents 900000, capacity_slots 1, turnaround_minutes 30 and requires STUDIO_FLOOR."
            - "P carries exactly 1 suspension point from a FINALIZED MINOR assessment (repair 40000 < REPAIR_ESCALATION_CENTS so no escalation, 1 < SUSPENSION_THRESHOLD_POINTS so P stays ACTIVE)."
            - "P holds no other CONFIRMED reservation, so deposit_held_cents is 0 and the deposit cap is not in play."
            - "A second reservation on STUDIO-A spans 2026-08-07T09:00:00Z to 2026-08-07T12:00:00Z (3 started hours) in status REQUESTED."
          setup_api_calls:
            - call: "POST /producers"
              payload: {legal_name: "Ada Lovelace", email: "ada@patv.example"}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {p_id: $.data.id}
            - call: "POST /producers/${p_id}/residency-verification"
              payload: {document_reference: "UTIL-2026-0001"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /training-courses"
              payload: {course_code: "TV-101", title: "Studio Basics", tier: "BASIC", grants_competency_codes: ["STUDIO_FLOOR", "EDIT_SUITE"], seat_capacity: 12, session_start_at: "2026-08-05T17:00:00Z", session_end_at: "2026-08-05T21:00:00Z"}
              as: TrainingCoordinator
              as_user_id: "trn-1"
              captures: {c_basic_id: $.data.id}
            - call: "POST /course-enrollments"
              payload: {producer_id: "${p_id}", course_id: "${c_basic_id}"}
              as: Producer
              as_user_id: "${p_id}"
              captures: {e_basic_id: $.data.id}
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-06T00:00:00Z"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /course-enrollments/${e_basic_id}/attendance"
              payload: {attended: true}
              as: TrainingCoordinator
              as_user_id: "trn-1"
            - call: "POST /course-enrollments/${e_basic_id}/grade"
              payload: {practical_score: 88}
              as: TrainingCoordinator
              as_user_id: "trn-1"
            - call: "POST /studio-resources"
              payload: {resource_code: "STUDIO-A", resource_class: "STUDIO", required_competency_code: "STUDIO_FLOOR", capacity_slots: 1, turnaround_minutes: 30, base_deposit_cents: 12345, replacement_value_cents: 900000}
              as: FacilitiesManager
              as_user_id: "fac-1"
              captures: {res_id: $.data.id}
            - call: "POST /reservations"
              payload: {producer_id: "${p_id}", resource_id: "${res_id}", start_at: "2026-08-06T10:00:00Z", end_at: "2026-08-06T12:00:00Z"}
              as: Producer
              as_user_id: "${p_id}"
              captures: {resa_id: $.data.id}
            - call: "POST /reservations/${resa_id}/confirm"
              payload: {}
              as: FacilitiesManager
              as_user_id: "fac-1"
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-06T10:00:00Z"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /reservations/${resa_id}/checkout"
              payload: {condition_notes: "Tripod head intact at handover"}
              as: FacilitiesManager
              as_user_id: "fac-1"
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-06T11:00:00Z"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /reservations/${resa_id}/return"
              payload: {damage_observed: true, severity: "MINOR", repair_estimate_cents: 40000, damage_notes: "Scuffed tripod head"}
              as: FacilitiesManager
              as_user_id: "fac-1"
            - call: "GET /damage-assessments"
              payload: {reservation_id: "${resa_id}"}
              as: FacilitiesManager
              as_user_id: "fac-1"
              captures: {da_id: "$.data[0].id"}
            - call: "POST /damage-assessments/${da_id}/finalize"
              payload: {}
              as: FacilitiesManager
              as_user_id: "fac-1"
            - call: "POST /reservations"
              payload: {producer_id: "${p_id}", resource_id: "${res_id}", start_at: "2026-08-07T09:00:00Z", end_at: "2026-08-07T12:00:00Z"}
              as: Producer
              as_user_id: "${p_id}"
              captures: {resb_id: $.data.id}
          trigger:
            - call: "POST /reservations/${resb_id}/confirm"
              payload: {}
              as: FacilitiesManager
              as_user_id: "fac-1"
              captures: {hold_b: $.data.deposit_hold_cents, risk_b: $.data.risk_bp}
          assert:
            - "Producer.${p_id}.suspension_points == 1 and Producer.${p_id}.status == ACTIVE before the trigger"
            - "${risk_b} == 1500 (1 point * RISK_BP_PER_SUSPENSION_POINT, well under RISK_BP_CAP)"
            - "${hold_b} == 15432 — line_risk ROUND_HALF_UP(12345 * 11500 / 10000) = 14197 plus line_duration ROUND_HALF_UP(12345 * 1000 / 10000) = 1235"
            - "${hold_b} != 15431, the value produced by summing 1500 bp + 1000 bp first and rounding 12345 * 12500 / 10000 once"
            - "Reservation.${resb_id}.status == CONFIRMED and Producer.${p_id}.deposit_held_cents == 15432"
            - "StudioResource.${res_id}.open_reservation_count == 1 (the settled first reservation no longer counts)"
            - "Reservation.${resa_id}.deposit_forfeited_cents == 12962, deposit_refunded_cents == 0 and uncovered_liability_cents == 27038"

      - name: franchise_pinned_evaluation_order_low_tier_mode_c
        grounds:
          - calculations.franchise_fee_allocation
          - entities.FundingPeriod.fields.allocable_base_cents
          - entities.FundingPeriod.fields.capital_allocation_cents
          - entities.FundingPeriod.fields.total_program_funds_cents
          - validations[priority=41]
          - state_machines.FundingPeriod.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency whose evaluation order the
          scaffold pins: the administrative reserve rate is keyed on the
          allocable base, the capital share is keyed on the post-reserve
          distributable, and the operating share is the residual, so the only
          well-defined answer at base 4999999 is 400000 / 1610000 / 2989999;
          taking the capital share off the base instead would give 1750000.
        test_recipe:
          setup:
            - "One FundingPeriod for fiscal_year 2026 quarter 4 in report_status DRAFT, basis ACCRUAL, service_period_earned_cents 4999999 (one cent under HIGH_TIER_THRESHOLD_CENTS), capital_grant_cents 0."
          setup_api_calls:
            - call: "POST /funding-periods"
              payload: {fiscal_year: 2026, quarter: 4, basis: "ACCRUAL", gross_franchise_fee_cents: 5100000, service_period_earned_cents: 4999999, remittance_received_cents: 4700000, capital_grant_cents: 0}
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: {fp_id: $.data.id}
          trigger:
            - call: "POST /funding-periods/${fp_id}/report-submit"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: {base: $.data.allocable_base_cents, admin: $.data.admin_reserve_cents, capital: $.data.capital_allocation_cents, operating: $.data.operating_allocation_cents, total: $.data.total_program_funds_cents}
          assert:
            - "${base} == 4999999 (ACCRUAL basis selects service_period_earned_cents)"
            - "${admin} == 400000 — step 2 selects ADMIN_RESERVE_BP_BASE 800 because 4999999 < 5000000, then step 3 rounds 399999.92 half-up"
            - "${capital} == 1610000 — step 4 takes 35% of the post-reserve distributable 4599999, i.e. ROUND_HALF_UP(1609999.65), plus a zero grant"
            - "${capital} != 1750000, the value obtained by taking 35% of the allocable base before the reserve is deducted"
            - "${operating} == 2989999 as the residual 4599999 - 1610000, so no cent is created or lost"
            - "${admin} + ${capital} + ${operating} == ${total} == 4999999"
            - "FundingPeriod.${fp_id}.report_status == SUBMITTED and submitted_by_user_id == fin-1"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: program_review_cycle_loops_and_revision_limit_terminates_it
        grounds:
          - state_machines.Program.UNDER_REVIEW_to_CHANGES_REQUESTED
          - state_machines.Program.CHANGES_REQUESTED_to_SUBMITTED
          - state_machines.Program.SUBMITTED_to_UNDER_REVIEW
          - entities.Program.fields.revision_round
          - entities.Program.fields.reviewed_by_user_id
          - validations[priority=22]
          - errors[ERR_REVISION_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Program's review dimension is cyclic, not a pipeline: UNDER_REVIEW ->
          CHANGES_REQUESTED -> SUBMITTED -> UNDER_REVIEW traverses the same three
          states three times, each pass clearing reviewed_by_user_id so a
          different reviewer may claim it, and MAX_REVISION_ROUNDS is what
          terminates the loop at revision_round 3 rather than any state ordering.
        test_recipe:
          setup:
            - "Producer P is ACTIVE with certification_level BASIC."
            - "Program PR (runtime_seconds 1800, is_live false, required_crew_roles []) has clearance_status CLEARED via all three current-version attestations and review_status DRAFT."
            - "The clock stands at 2026-08-06T00:00:00Z, so P's indemnification (2027-08-06T00:00:00Z) is in force for every resubmission."
          setup_api_calls:
            - call: "POST /producers"
              payload: {legal_name: "Ada Lovelace", email: "ada@patv.example"}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {p_id: $.data.id}
            - call: "POST /producers/${p_id}/residency-verification"
              payload: {document_reference: "UTIL-2026-0001"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /training-courses"
              payload: {course_code: "TV-101", title: "Studio Basics", tier: "BASIC", grants_competency_codes: ["STUDIO_FLOOR", "EDIT_SUITE"], seat_capacity: 12, session_start_at: "2026-08-05T17:00:00Z", session_end_at: "2026-08-05T21:00:00Z"}
              as: TrainingCoordinator
              as_user_id: "trn-1"
              captures: {c_basic_id: $.data.id}
            - call: "POST /course-enrollments"
