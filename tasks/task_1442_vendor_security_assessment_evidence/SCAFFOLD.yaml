scenario: |
  Vendor Security Assessment & Evidence Management (third-party security risk team): assessment tier by data sensitivity & access, questionnaire issuance & response scoring, SOC 2/ISO report review & exception analysis, remediation plan & risk acceptance approval, contract security addendum requirement, continuous monitoring alerts & re-assessment cadence, subprocessor disclosure & approval, offboarding data return/destruction attestation

domain_name: vendor-security-assessment
api_prefix: /vsa

# =============================================================================
# Complexity Profile (§0.1–§0.4)
# Expert band, upper edge. Primary archetype: compliance/audit.
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval
    - scheduled_deferred_actions
    - optimistic_concurrency

  entity_topology: hybrid
  state_machine_shape: cyclic

  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - self_referential

  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Vendor legal entity name" }
      - { name: data_sensitivity, type: enum, source: input, description: "Highest sensitivity of data shared with vendor", constraints: "PUBLIC | INTERNAL | CONFIDENTIAL | REGULATED" }
      - { name: access_level, type: enum, source: input, description: "Breadth of system/facility access granted", constraints: "NONE | READ_ONLY | OPERATOR | PRIVILEGED" }
      - { name: criticality, type: enum, source: input, description: "Business criticality if vendor fails", constraints: "LOW | MEDIUM | HIGH | MISSION_CRITICAL" }
      - { name: current_tier, type: enum, source: computed, description: "Assessment tier derived by tier_assignment from sensitivity+access+criticality", constraints: "TIER_1 | TIER_2 | TIER_3 | TIER_4" }
      - { name: posture, type: enum, source: computed, description: "Aggregate vendor security posture gating child operations", constraints: "ONBOARDING | ASSESSING | APPROVED | CONDITIONAL | SUSPENDED | OFFBOARDING | OFFBOARDED" }
      - { name: active_cycle_id, type: string, source: system, description: "FK -> AssessmentCycle.id; the cycle currently in flight, null when none" , default: null}
      - { name: risk_score, type: number, source: computed, description: "Composite risk score per vendor_risk_score calculation; 0.00–100.00" }
      - { name: next_reassessment_due, type: datetime, source: computed, description: "Clock time when next AssessmentCycle must be ISSUED; tier-derived cadence from last APPROVED cycle" }
      - { name: offboarding_deadline, type: datetime, source: computed, description: "Clock time by which OffboardingAttestation must reach VERIFIED once posture=OFFBOARDING; null otherwise", default: null }

  - name: AssessmentTierPolicy
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Human-readable policy name" }
      - { name: active, type: boolean, source: input, description: "Exactly one active policy is used by tier_assignment", default: true }
      - { name: tier_matrix, type: object, source: input, description: "Mapping of (data_sensitivity, access_level, criticality) triple to TIER_1..TIER_4; incomplete triples fall back per tier_assignment" }
      - { name: tier1_reassessment_months, type: integer, source: input, description: "Re-assessment cadence months for TIER_1", default: 36 }
      - { name: tier2_reassessment_months, type: integer, source: input, description: "Re-assessment cadence months for TIER_2", default: 24 }
      - { name: tier3_reassessment_months, type: integer, source: input, description: "Re-assessment cadence months for TIER_3", default: 12 }
      - { name: tier4_reassessment_months, type: integer, source: input, description: "Re-assessment cadence months for TIER_4", default: 6 }

  - name: QuestionnaireTemplate
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Template title" }
      - { name: applies_to_tiers, type: array, source: input, description: "List of TIER_x this template is eligible for; tier_assignment picks highest-priority eligible template" }
      - { name: items, type: array, source: input, description: "Ordered list of {item_key, prompt, weight, control_domain}; weight positive number, sums arbitrary" }
      - { name: status, type: enum, source: computed, description: "Template lifecycle", constraints: "DRAFT | PUBLISHED | RETIRED" }
      - { name: published_version, type: integer, source: computed, description: "Monotonic publication counter; only the latest PUBLISHED version is issuable" }

  - name: AssessmentCycle
    parent: Vendor
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: system, description: "FK -> Vendor.id; owning vendor" }
      - { name: template_id, type: string, source: system, description: "FK -> QuestionnaireTemplate.id; template pinned at issuance" }
      - { name: template_version, type: integer, source: system, description: "QuestionnaireTemplate.published_version pinned at issuance; later template re-publication does not affect this cycle" }
      - { name: tier_at_issue, type: enum, source: computed, description: "Vendor.current_tier snapshot at issuance", constraints: "TIER_1 | TIER_2 | TIER_3 | TIER_4" }
      - { name: status, type: enum, source: computed, description: "Cycle status", constraints: "DRAFT | ISSUED | RESPONSE_RECEIVED | SCORED | EVIDENCE_REVIEW | REMEDIATION | RISK_ACCEPTANCE_REVIEW | APPROVED | REJECTED | EXPIRED" }
      - { name: issued_at, type: datetime, source: system, description: "Clock time of issuance", default: null }
      - { name: response_due_at, type: datetime, source: computed, description: "issued_at + tier response window (days per tier_response_window)" }
      - { name: questionnaire_score, type: number, source: computed, description: "Per questionnaire_response_score; null until SCORED", default: null }
      - { name: evidence_score, type: number, source: computed, description: "Per evidence_review_score; null until EVIDENCE_REVIEW completes", default: null }
      - { name: composite_score, type: number, source: computed, description: "Per composite_cycle_score; null until both component scores present", default: null }
      - { name: open_exception_count, type: integer, source: computed, description: "Count of ExceptionFinding in {OPEN, IN_REMEDIATION} for this cycle" }
      - { name: acceptance_required, type: boolean, source: computed, description: "True when composite_score < tier pass threshold OR any HIGH/CRITICAL exception closed via RiskAcceptance" }

  - name: QuestionnaireResponse
    parent: AssessmentCycle
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: system, description: "FK -> AssessmentCycle.id; owning cycle" }
      - { name: submitted_by, type: string, source: input, description: "Vendor contact identifier recorded at submission" }
      - { name: answers, type: array, source: input, description: "List of {item_key, answer_value, na_justification?}; item_key must exist in pinned template version" }
      - { name: status, type: enum, source: computed, description: "Response lifecycle", constraints: "DRAFT | SUBMITTED | RETURNED | ACCEPTED" }
      - { name: submitted_at, type: datetime, source: system, description: "Clock time of first submission", default: null }
      - { name: raw_score, type: number, source: computed, description: "Per questionnaire_response_score before na-adjustment; null until scored", default: null }
      - { name: revision_count, type: integer, source: computed, description: "Number of RETURNED -> SUBMITTED cycles", default: 0 }

  - name: EvidenceArtifact
    parent: AssessmentCycle
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: system, description: "FK -> AssessmentCycle.id; owning cycle" }
      - { name: kind, type: enum, source: input, description: "Report kind", constraints: "SOC2_TYPE1 | SOC2_TYPE2 | ISO27001 | PENTEST | OTHER" }
      - { name: period_start, type: datetime, source: input, description: "Coverage period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Coverage period end (exclusive)" }
      - { name: issued_by, type: string, source: input, description: "Auditor/firm name" }
      - { name: status, type: enum, source: computed, description: "Review lifecycle", constraints: "RECEIVED | UNDER_REVIEW | REVIEWED_CLEAN | REVIEWED_WITH_EXCEPTIONS | REJECTED" }
      - { name: coverage_gap_days, type: integer, source: computed, description: "Days between period_end and cycle.issued_at; used by evidence_review_score" }

  - name: ExceptionFinding
    parent: AssessmentCycle
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: system, description: "FK -> AssessmentCycle.id; owning cycle" }
      - { name: source, type: enum, source: input, description: "Where the exception was found", constraints: "QUESTIONNAIRE | EVIDENCE | MONITORING" }
      - { name: evidence_artifact_id, type: string, source: input, description: "FK -> EvidenceArtifact.id; required iff source=EVIDENCE", default: null }
      - { name: severity, type: enum, source: input, description: "Exception severity", constraints: "LOW | MEDIUM | HIGH | CRITICAL" }
      - { name: description, type: string, source: input, description: "Narrative of the gap" }
      - { name: status, type: enum, source: computed, description: "Exception lifecycle", constraints: "OPEN | IN_REMEDIATION | CLOSED_REMEDIATED | CLOSED_ACCEPTED | CLOSED_FALSE_POSITIVE" }
      - { name: closure_reason, type: string, source: input, description: "Required on closure transitions", default: null }

  - name: RemediationPlan
    parent: AssessmentCycle
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: system, description: "FK -> AssessmentCycle.id; owning cycle" }
      - { name: exception_ids, type: array, source: input, description: "Non-empty list of ExceptionFinding.id this plan addresses; every referenced exception must be OPEN" }
      - { name: tasks, type: array, source: input, description: "List of {task_key, description, due_at, owner}" }
      - { name: status, type: enum, source: computed, description: "Plan lifecycle", constraints: "PROPOSED | ACCEPTED | IN_PROGRESS | COMPLETED | VERIFIED | REJECTED" }
      - { name: approved_by, type: string, source: system, description: "X-User-ID of accepting RiskAnalyst", default: null }
      - { name: completed_task_keys, type: array, source: input, description: "Task keys reported complete by vendor", default: [] }
      - { name: verified_at, type: datetime, source: system, description: "Clock time when verification passed", default: null }

  - name: RiskAcceptance
    parent: AssessmentCycle
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: system, description: "FK -> AssessmentCycle.id; owning cycle" }
      - { name: exception_ids, type: array, source: input, description: "Non-empty list of ExceptionFinding.id accepted as residual risk; every referenced exception must be OPEN or IN_REMEDIATION" }
      - { name: justification, type: string, source: input, description: "Business justification text" }
      - { name: compensating_controls, type: array, source: input, description: "List of compensating control descriptions" }
      - { name: expires_at, type: datetime, source: input, description: "Expiry after which acceptance lapses and exceptions reopen" }
      - { name: status, type: enum, source: computed, description: "Acceptance lifecycle", constraints: "REQUESTED | APPROVED | REJECTED | EXPIRED" }
      - { name: decided_by, type: string, source: system, description: "X-User-ID of deciding SecurityApprover", default: null }

  - name: ContractAddendum
    parent: Vendor
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: system, description: "FK -> Vendor.id; owning vendor" }
      - { name: cycle_id, type: string, source: system, description: "FK -> AssessmentCycle.id; cycle that generated the requirement" }
      - { name: clause_set, type: array, source: computed, description: "Required clause keys derived per addendum_requirement from tier + exceptions" }
      - { name: status, type: enum, source: computed, description: "Addendum lifecycle", constraints: "REQUIRED | DRAFTED | SIGNED | WAIVED" }
      - { name: signed_at, type: datetime, source: input, description: "Execution timestamp on sign", default: null }
      - { name: waived_reason, type: string, source: input, description: "Required iff status=WAIVED", default: null }

  - name: MonitoringAlert
    parent: Vendor
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: system, description: "FK -> Vendor.id; vendor under monitoring" }
      - { name: signal, type: enum, source: input, description: "Signal class", constraints: "BREACH_REPORT | CERT_LAPSE | FINANCIAL_DISTRESS | NEGATIVE_NEWS | SCAN_FINDING" }
      - { name: severity, type: enum, source: input, description: "Alert severity", constraints: "LOW | MEDIUM | HIGH | CRITICAL" }
      - { name: detected_at, type: datetime, source: input, description: "Clock time of detection" }
      - { name: status, type: enum, source: computed, description: "Alert lifecycle", constraints: "OPEN | ACKNOWLEDGED | DISMISSED | ESCALATED" }
      - { name: disposition, type: string, source: input, description: "Analyst note on acknowledge/dismiss", default: null }

  - name: SubprocessorDisclosure
    parent: Vendor
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: system, description: "FK -> Vendor.id; disclosing vendor" }
      - { name: subprocessor_name, type: string, source: input, description: "Legal name of subprocessor" }
      - { name: data_categories, type: array, source: input, description: "Data categories exposed" }
      - { name: region, type: string, source: input, description: "Processing region" }
      - { name: status, type: enum, source: computed, description: "Disclosure lifecycle", constraints: "DISCLOSED | UNDER_REVIEW | APPROVED | REJECTED | WITHDRAWN" }
      - { name: decided_by, type: string, source: system, description: "X-User-ID of deciding SecurityApprover", default: null }

  - name: OffboardingAttestation
    parent: Vendor
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: system, description: "FK -> Vendor.id; offboarding vendor" }
      - { name: data_returned, type: boolean, source: input, description: "Vendor asserts all data returned" }
      - { name: data_destroyed, type: boolean, source: input, description: "Vendor asserts residual copies destroyed" }
      - { name: destruction_method, type: string, source: input, description: "Method description; required iff data_destroyed=true" }
      - { name: attested_by, type: string, source: input, description: "Vendor signatory" }
      - { name: status, type: enum, source: computed, description: "Attestation lifecycle", constraints: "REQUESTED | SUBMITTED | VERIFIED | REJECTED" }
      - { name: submitted_at, type: datetime, source: system, description: "Clock time of submission", default: null }

  - name: ReassessmentSchedule
    parent: Vendor
    common_fields: false
    fields:
      - { name: vendor_id, type: string, source: system, description: "FK -> Vendor.id; vendor this event belongs to" }
      - { name: kind, type: enum, source: system, description: "Why the schedule moved", constraints: "TIER_CADENCE | ALERT_ESCALATION | ACCEPTANCE_EXPIRY | OFFBOARDING_SLIP" }
      - { name: previous_due, type: datetime, source: system, description: "Vendor.next_reassessment_due before mutation" }
      - { name: new_due, type: datetime, source: system, description: "Vendor.next_reassessment_due after mutation" }
      - { name: reason_ref, type: string, source: system, description: "Polymorphic reference: MonitoringAlert.id or RiskAcceptance.id or null" }

  - name: VendorContact
    parent: Vendor
    common_fields: false
    fields:
      - { name: vendor_id, type: string, source: system, description: "FK -> Vendor.id; owning vendor" }
      - { name: email, type: string, source: input, description: "Contact email; unique per vendor" }
      - { name: full_name, type: string, source: input, description: "Contact display name" }
      - { name: is_primary, type: boolean, source: input, description: "Exactly one primary contact per vendor", default: false }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: QuestionnaireTemplate
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /vsa/questionnaire-templates/{id}/publish"
        actor: RiskAnalyst
        preconditions:
          - "template.status == DRAFT"
          - "items non-empty and every item.weight > 0"
          - "no other PUBLISHED template covers an identical applies_to_tiers set (uniqueness per tier-set)"
        side_effects:
          - "template.published_version increments by 1"
          - "increments template.version by 1"
      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /vsa/questionnaire-templates/{id}/retire"
        actor: RiskAnalyst
        preconditions:
          - "template.status == PUBLISHED"
          - "no AssessmentCycle references this template with status in {DRAFT, ISSUED, RESPONSE_RECEIVED, SCORED, EVIDENCE_REVIEW, REMEDIATION, RISK_ACCEPTANCE_REVIEW}"
        side_effects:
          - "increments template.version by 1"
      - from: PUBLISHED
        to: DRAFT
        trigger: "POST /vsa/questionnaire-templates/{id}/revise"
        actor: RiskAnalyst
        preconditions:
          - "template.status == PUBLISHED"
        side_effects:
          - "creates a new DRAFT QuestionnaireTemplate row copying items with parent published_version+0 (revision cycle)"
          - "increments template.version by 1"

  - entity: AssessmentCycle
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED, EXPIRED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /vsa/vendors/{vendor_id}/cycles/{id}/issue"
        actor: RiskAnalyst
        preconditions:
          - "vendor.posture == ONBOARDING or vendor.posture == APPROVED or vendor.posture == CONDITIONAL"
          - "vendor.active_cycle_id == this cycle"
          - "cycle.template status == PUBLISHED at issue time (template pinned)"
          - "no other cycle for this vendor in {DRAFT, ISSUED, RESPONSE_RECEIVED, SCORED, EVIDENCE_REVIEW, REMEDIATION, RISK_ACCEPTANCE_REVIEW}"
        side_effects:
          - "sets issued_at = current clock"
          - "sets response_due_at = issued_at + tier_response_window(tier_at_issue) days"
          - "sets cycle.template_id and cycle.template_version = template.published_version (version-pinning)"
          - "vendor.posture -> ASSESSING"
          - "increments cycle.version and vendor.version by 1"
      - from: ISSUED
        to: RESPONSE_RECEIVED
        trigger: "POST /vsa/vendors/{vendor_id}/cycles/{cycle_id}/responses (QuestionnaireResponse reaches SUBMITTED)"
        actor: VendorContact
        preconditions:
          - "cycle.status == ISSUED"
          - "current clock <= response_due_at (else EXPIRED auto-fires first)"
        side_effects:
          - "response.status -> SUBMITTED, submitted_at set"
          - "increments cycle.version by 1"
      - from: ISSUED
        to: EXPIRED
        trigger: "system clock sweep when current clock > response_due_at and no SUBMITTED response exists"
        actor: system
        preconditions:
          - "cycle.status == ISSUED"
          - "current clock > cycle.response_due_at"
        side_effects:
          - "vendor.posture -> SUSPENDED"
          - "vendor.active_cycle_id -> null"
          - "appends ReassessmentSchedule(kind=ALERT_ESCALATION, previous_due=vendor.next_reassessment_due, new_due=current clock + tier4_reassessment_months months)"
          - "vendor.next_reassessment_due recomputed"
          - "increments vendor.version by 1"
      - from: RESPONSE_RECEIVED
        to: SCORED
        trigger: "POST /vsa/vendors/{vendor_id}/cycles/{id}/score with questionnaire_score >= tier pass threshold"
        actor: RiskAnalyst
        preconditions:
          - "cycle.status == RESPONSE_RECEIVED"
          - "response.status == SUBMITTED"
          - "computed questionnaire_score >= tier pass threshold (else the fail branch fires)"
        side_effects:
          - "runs questionnaire_response_score; sets response.raw_score and cycle.questionnaire_score"
          - "response.status -> ACCEPTED"
          - "increments cycle.version by 1"
      - from: RESPONSE_RECEIVED
        to: RESPONSE_RECEIVED
        trigger: "POST /vsa/vendors/{vendor_id}/cycles/{id}/score with questionnaire_score < tier pass threshold (fail branch: response returned for revision)"
        actor: RiskAnalyst
        preconditions:
          - "cycle.status == RESPONSE_RECEIVED"
          - "response.status == SUBMITTED"
          - "computed questionnaire_score < tier pass threshold"
        side_effects:
          - "runs questionnaire_response_score; sets response.raw_score and cycle.questionnaire_score"
          - "response.status -> RETURNED; response.revision_count += 1"
          - "cycle remains RESPONSE_RECEIVED awaiting resubmission"
          - "increments cycle.version by 1"
      - from: RESPONSE_RECEIVED
        to: RESPONSE_RECEIVED
        trigger: "POST /vsa/vendors/{vendor_id}/cycles/{cycle_id}/responses/{id}/return (revision loop)"
        actor: RiskAnalyst
        preconditions:
          - "cycle.status == RESPONSE_RECEIVED"
          - "response.status == SUBMITTED"
        side_effects:
          - "response.status -> RETURNED; response.revision_count += 1"
          - "vendor must resubmit; cycle stays RESPONSE_RECEIVED until score"
      - from: SCORED
        to: EVIDENCE_REVIEW
        trigger: "POST /vsa/vendors/{vendor_id}/cycles/{id}/evidence (first EvidenceArtifact created)"
        actor: VendorContact
        preconditions:
          - "cycle.status == SCORED"
          - "response.status == ACCEPTED"
        side_effects:
          - "artifact.status -> RECEIVED"
          - "increments cycle.version by 1"
      - from: EVIDENCE_REVIEW
        to: REMEDIATION
        trigger: "POST /vsa/vendors/{vendor_id}/cycles/{id}/evidence-review/complete with open exceptions found"
        actor: RiskAnalyst
        preconditions:
          - "cycle.status == EVIDENCE_REVIEW"
          - "every EvidenceArtifact for cycle in {REVIEWED_CLEAN, REVIEWED_WITH_EXCEPTIONS, REJECTED}"
          - "cycle.open_exception_count > 0"
        side_effects:
          - "runs evidence_review_score; sets cycle.evidence_score"
          - "runs composite_cycle_score; sets cycle.composite_score"
          - "creates ContractAddendum(status=REQUIRED) per addendum_requirement when required"
          - "increments cycle.version by 1"
      - from: EVIDENCE_REVIEW
        to: RISK_ACCEPTANCE_REVIEW
        trigger: "POST /vsa/vendors/{vendor_id}/cycles/{id}/evidence-review/complete with composite below threshold but zero open exceptions (all accepted)"
        actor: RiskAnalyst
        preconditions:
          - "cycle.status == EVIDENCE_REVIEW"
          - "every EvidenceArtifact for cycle in {REVIEWED_CLEAN, REVIEWED_WITH_EXCEPTIONS, REJECTED}"
          - "cycle.open_exception_count == 0"
          - "cycle.acceptance_required == true"
        side_effects:
          - "runs evidence_review_score and composite_cycle_score"
          - "increments cycle.version by 1"
      - from: EVIDENCE_REVIEW
        to: APPROVED
        trigger: "POST /vsa/vendors/{vendor_id}/cycles/{id}/evidence-review/complete clean pass"
        actor: RiskAnalyst
        preconditions:
          - "cycle.status == EVIDENCE_REVIEW"
          - "every EvidenceArtifact for cycle == REVIEWED_CLEAN"
          - "cycle.open_exception_count == 0"
          - "cycle.composite_score >= tier pass threshold"
          - "no REQUIRED or DRAFTED ContractAddendum outstanding for this cycle"
        side_effects:
          - "runs composite_cycle_score"
          - "vendor.posture -> APPROVED"
          - "vendor.next_reassessment_due = current clock + active policy cadence months for vendor.current_tier"
          - "appends ReassessmentSchedule(kind=TIER_CADENCE)"
          - "vendor.active_cycle_id -> null"
          - "increments vendor.version by 1"
      - from: REMEDIATION
        to: RISK_ACCEPTANCE_REVIEW
        trigger: "POST /vsa/vendors/{vendor_id}/cycles/{id}/remediation/resolve (all plans VERIFIED and any residual exceptions covered by APPROVED RiskAcceptance)"
        actor: RiskAnalyst
        preconditions:
          - "cycle.status == REMEDIATION"
          - "every RemediationPlan for cycle in {VERIFIED, REJECTED}"
          - "cycle.open_exception_count == 0"
        side_effects:
          - "re-runs composite_cycle_score"
          - "increments cycle.version by 1"
      - from: RISK_ACCEPTANCE_REVIEW
        to: APPROVED
        trigger: "POST /vsa/vendors/{vendor_id}/cycles/{id}/approve"
        actor: SecurityApprover
        preconditions:
          - "cycle.status == RISK_ACCEPTANCE_REVIEW"
          - "cycle.open_exception_count == 0"
          - "every RiskAcceptance for cycle in {APPROVED, REJECTED}"
          - "no REQUIRED or DRAFTED ContractAddendum outstanding for this cycle (SIGNED or WAIVED only)"
          - "approver X-User-ID != RiskAnalyst X-User-ID who triggered evidence-review completion (segregation of duties)"
        side_effects:
          - "vendor.posture -> CONDITIONAL when any APPROVED RiskAcceptance exists else APPROVED"
          - "vendor.next_reassessment_due recomputed per cadence (CONDITIONAL halves the interval)"
          - "appends ReassessmentSchedule(kind=TIER_CADENCE)"
          - "vendor.active_cycle_id -> null"
          - "increments vendor.version by 1"
      - from: RISK_ACCEPTANCE_REVIEW
        to: REJECTED
        trigger: "POST /vsa/vendors/{vendor_id}/cycles/{id}/reject"
        actor: SecurityApprover
        preconditions:
          - "cycle.status == RISK_ACCEPTANCE_REVIEW"
        side_effects:
          - "vendor.posture -> SUSPENDED"
          - "vendor.active_cycle_id -> null"
          - "increments vendor.version by 1"

  - entity: QuestionnaireResponse
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /vsa/vendors/{vendor_id}/cycles/{cycle_id}/responses/{id}/submit"
        actor: VendorContact
        preconditions:
          - "cycle.status == ISSUED"
          - "every item_key in pinned template answered or na_justification provided"
          - "current clock <= cycle.response_due_at"
        side_effects:
          - "sets submitted_at"
          - "cycle.status -> RESPONSE_RECEIVED"
          - "increments cycle.version by 1"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /vsa/vendors/{vendor_id}/cycles/{cycle_id}/responses/{id}/return"
        actor: RiskAnalyst
        preconditions:
          - "response.status == SUBMITTED"
          - "cycle.status == RESPONSE_RECEIVED"
        side_effects:
          - "revision_count += 1"
          - "increments response.version by 1"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /vsa/vendors/{vendor_id}/cycles/{cycle_id}/responses/{id}/submit (resubmission)"
        actor: VendorContact
        preconditions:
          - "response.status == RETURNED"
          - "cycle.status == RESPONSE_RECEIVED"
        side_effects:
          - "increments response.version by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /vsa/vendors/{vendor_id}/cycles/{cycle_id}/score with score >= threshold"
        actor: RiskAnalyst
        preconditions:
          - "response.status == SUBMITTED"
          - "questionnaire_score >= tier pass threshold"
        side_effects:
          - "cycle.status -> SCORED"
          - "increments response.version by 1"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /vsa/vendors/{vendor_id}/cycles/{cycle_id}/score with score < threshold (fail branch)"
        actor: RiskAnalyst
        preconditions:
          - "response.status == SUBMITTED"
          - "questionnaire_score < tier pass threshold"
        side_effects:
          - "revision_count += 1"
          - "cycle stays RESPONSE_RECEIVED"
          - "increments response.version by 1"

  - entity: EvidenceArtifact
    initial_state: RECEIVED
    terminal_states: [REVIEWED_CLEAN, REJECTED]
    transitions:
      - from: RECEIVED
        to: UNDER_REVIEW
        trigger: "POST /vsa/vendors/{vendor_id}/cycles/{cycle_id}/evidence/{id}/start-review"
        actor: RiskAnalyst
        preconditions:
          - "artifact.status == RECEIVED"
          - "cycle.status == EVIDENCE_REVIEW"
        side_effects:
          - "increments artifact.version by 1"
      - from: UNDER_REVIEW
        to: REVIEWED_CLEAN
        trigger: "POST /vsa/vendors/{vendor_id}/cycles/{cycle_id}/evidence/{id}/complete-review with zero exceptions"
        actor: RiskAnalyst
        preconditions:
          - "artifact.status == UNDER_REVIEW"
          - "no ExceptionFinding created against this artifact remains OPEN"
        side_effects:
          - "computes artifact.coverage_gap_days"
          - "increments artifact.version by 1"
      - from: UNDER_REVIEW
        to: REVIEWED_WITH_EXCEPTIONS
        trigger: "POST /vsa/vendors/{vendor_id}/cycles/{cycle_id}/evidence/{id}/complete-review with exceptions attached"
        actor: RiskAnalyst
        preconditions:
          - "artifact.status == UNDER_REVIEW"
          - "at least one ExceptionFinding with evidence_artifact_id == this artifact"
        side_effects:
          - "computes artifact.coverage_gap_days"
          - "increments artifact.version by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /vsa/vendors/{vendor_id}/cycles/{cycle_id}/evidence/{id}/reject"
        actor: RiskAnalyst
        preconditions:
          - "artifact.status == UNDER_REVIEW"
          - "artifact.coverage_gap_days > 180 OR period_end <= period_start (invalid report)"
        side_effects:
          - "creates ExceptionFinding(source=EVIDENCE, severity=HIGH, description=auto rejection rationale, status=OPEN)"
          - "increments artifact.version by 1"

  - entity: ExceptionFinding
    initial_state: OPEN
    terminal_states: [CLOSED_REMEDIATED, CLOSED_ACCEPTED, CLOSED_FALSE_POSITIVE]
    transitions:
      - from: OPEN
        to: IN_REMEDIATION
        trigger: "POST /vsa/vendors/{vendor_id}/cycles/{cycle_id}/remediation-plans (plan accepted links exception)"
        actor: RiskAnalyst
        preconditions:
          - "exception.status == OPEN"
          - "cycle.status == REMEDIATION"
        side_effects:
          - "cycle.open_exception_count unchanged (still open)"
          - "increments exception.version by 1"
      - from: IN_REMEDIATION
        to: CLOSED_REMEDIATED
        trigger: "POST /vsa/vendors/{vendor_id}/cycles/{cycle_id}/remediation-plans/{plan_id}/verify (plan VERIFIED covers exception)"
        actor: RiskAnalyst
        preconditions:
          - "exception.status == IN_REMEDIATION"
          - "plan.status == COMPLETED and plan verification passes"
        side_effects:
          - "sets closure_reason from plan verification note"
          - "cycle.open_exception_count -= 1"
          - "increments exception.version and cycle.version by 1"
      - from: OPEN
        to: CLOSED_ACCEPTED
        trigger: "POST /vsa/vendors/{vendor_id}/cycles/{cycle_id}/risk-acceptances/{id}/approve"
        actor: SecurityApprover
        preconditions:
          - "exception.status == OPEN"
          - "risk_acceptance.status -> APPROVED and exception.id in risk_acceptance.exception_ids"
        side_effects:
          - "cycle.open_exception_count -= 1"
          - "cycle.acceptance_required = true"
          - "increments exception.version and cycle.version by 1"
      - from: IN_REMEDIATION
        to: CLOSED_ACCEPTED
        trigger: "POST /vsa/vendors/{vendor_id}/cycles/{cycle_id}/risk-acceptances/{id}/approve"
        actor: SecurityApprover
        preconditions:
          - "exception.status == IN_REMEDIATION"
          - "risk_acceptance.status -> APPROVED and exception.id in risk_acceptance.exception_ids"
        side_effects:
          - "cycle.open_exception_count -= 1"
          - "cycle.acceptance_required = true"
          - "increments exception.version and cycle.version by 1"
      - from: OPEN
        to: CLOSED_FALSE_POSITIVE
        trigger: "POST /vsa/vendors/{vendor_id}/cycles/{cycle_id}/exceptions/{id}/mark-false-positive"
        actor: RiskAnalyst
        preconditions:
          - "exception.status == OPEN"
          - "closure_reason non-empty"
        side_effects:
          - "cycle.open_exception_count -= 1"
          - "increments exception.version and cycle.version by 1"

  - entity: RemediationPlan
    initial_state: PROPOSED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /vsa/vendors/{vendor_id}/cycles/{cycle_id}/remediation-plans/{id}/accept"
        actor: RiskAnalyst
        preconditions:
          - "plan.status == PROPOSED"
          - "cycle.status == REMEDIATION"
          - "every exception_id currently OPEN"
        side_effects:
          - "sets approved_by = X-User-ID"
          - "every linked exception.status -> IN_REMEDIATION"
          - "increments plan.version by 1"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /vsa/vendors/{vendor_id}/cycles/{cycle_id}/remediation-plans/{id}/reject"
        actor: RiskAnalyst
        preconditions:
          - "plan.status == PROPOSED"
        side_effects:
          - "increments plan.version by 1"
      - from: ACCEPTED
        to: IN_PROGRESS
        trigger: "POST /vsa/vendors/{vendor_id}/cycles/{cycle_id}/remediation-plans/{id}/progress"
        actor: VendorContact
        preconditions:
          - "plan.status == ACCEPTED"
          - "completed_task_keys non-empty and subset of tasks[].task_key"
        side_effects:
          - "increments plan.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /vsa/vendors/{vendor_id}/cycles/{cycle_id}/remediation-plans/{id}/progress with all task keys"
        actor: VendorContact
        preconditions:
          - "plan.status == IN_PROGRESS or plan.status == ACCEPTED"
          - "completed_task_keys == set(tasks[].task_key)"
        side_effects:
          - "increments plan.version by 1"
      - from: COMPLETED
        to: VERIFIED
        trigger: "POST /vsa/vendors/{vendor_id}/cycles/{cycle_id}/remediation-plans/{id}/verify"
        actor: RiskAnalyst
        preconditions:
          - "plan.status == COMPLETED"
          - "verifier X-User-ID != plan.approved_by (segregation of duties)"
        side_effects:
          - "sets verified_at"
          - "every linked exception.status -> CLOSED_REMEDIATED (cascade)"
          - "cycle.open_exception_count -= count(linked exceptions)"
          - "increments plan.version and cycle.version by 1"
      - from: COMPLETED
        to: REJECTED
        trigger: "POST /vsa/vendors/{vendor_id}/cycles/{cycle_id}/remediation-plans/{id}/verify with reject=true"
        actor: RiskAnalyst
        preconditions:
          - "plan.status == COMPLETED"
        side_effects:
          - "every linked exception.status -> OPEN (compensation)"
          - "cycle.open_exception_count unchanged"
          - "increments plan.version by 1"

  - entity: RiskAcceptance
    initial_state: REQUESTED
    terminal_states: [APPROVED, REJECTED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /vsa/vendors/{vendor_id}/cycles/{cycle_id}/risk-acceptances/{id}/approve"
        actor: SecurityApprover
        preconditions:
          - "risk_acceptance.status == REQUESTED"
          - "approver X-User-ID != requester X-User-ID (segregation of duties)"
          - "every referenced exception in {OPEN, IN_REMEDIATION}"
          - "expires_at > current clock"
        side_effects:
          - "sets decided_by"
          - "every referenced exception.status -> CLOSED_ACCEPTED (cascade)"
          - "cycle.open_exception_count -= count(referenced exceptions)"
          - "cycle.acceptance_required = true"
          - "increments acceptance.version and cycle.version by 1"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /vsa/vendors/{vendor_id}/cycles/{cycle_id}/risk-acceptances/{id}/reject"
        actor: SecurityApprover
        preconditions:
          - "risk_acceptance.status == REQUESTED"
          - "approver X-User-ID != requester X-User-ID"
        side_effects:
          - "sets decided_by"
          - "increments acceptance.version by 1"
      - from: APPROVED
        to: EXPIRED
        trigger: "system clock sweep when current clock > expires_at"
        actor: system
        preconditions:
          - "risk_acceptance.status == APPROVED"
          - "current clock > risk_acceptance.expires_at"
        side_effects:
          - "every exception closed by this acceptance re-opens (status -> OPEN, closure_reason='ACCEPTANCE_EXPIRED')"
          - "cycle.open_exception_count += count(re-opened exceptions) when cycle non-terminal"
          - "vendor.next_reassessment_due = min(existing, current clock + 30 days)"
          - "appends ReassessmentSchedule(kind=ACCEPTANCE_EXPIRY, reason_ref=this acceptance)"
          - "increments vendor.version by 1"

  - entity: ContractAddendum
    initial_state: REQUIRED
    terminal_states: [SIGNED, WAIVED]
    transitions:
      - from: REQUIRED
        to: DRAFTED
        trigger: "POST /vsa/vendors/{vendor_id}/addenda/{id}/draft"
        actor: RiskAnalyst
        preconditions:
          - "addendum.status == REQUIRED"
        side_effects:
          - "increments addendum.version by 1"
      - from: DRAFTED
        to: SIGNED
        trigger: "POST /vsa/vendors/{vendor_id}/addenda/{id}/sign"
        actor: VendorContact
        preconditions:
          - "addendum.status == DRAFTED"
          - "signed_at non-empty and signed_at <= current clock"
        side_effects:
          - "increments addendum.version by 1"
      - from: REQUIRED
        to: WAIVED
        trigger: "POST /vsa/vendors/{vendor_id}/addenda/{id}/waive"
        actor: SecurityApprover
        preconditions:
          - "addendum.status == REQUIRED"
          - "waived_reason non-empty"
        side_effects:
          - "increments addendum.version by 1"

  - entity: MonitoringAlert
    initial_state: OPEN
    terminal_states: [DISMISSED, ESCALATED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /vsa/vendors/{vendor_id}/monitoring-alerts/{id}/acknowledge"
        actor: RiskAnalyst
        preconditions:
          - "alert.status == OPEN"
        side_effects:
          - "increments alert.version by 1"
      - from: ACKNOWLEDGED
        to: DISMISSED
        trigger: "POST /vsa/vendors/{vendor_id}/monitoring-alerts/{id}/dismiss"
        actor: RiskAnalyst
        preconditions:
          - "alert.status == ACKNOWLEDGED"
          - "disposition non-empty"
        side_effects:
          - "increments alert.version by 1"
      - from: ACKNOWLEDGED
        to: ESCALATED
        trigger: "POST /vsa/vendors/{vendor_id}/monitoring-alerts/{id}/escalate"
        actor: RiskAnalyst
        preconditions:
          - "alert.status == ACKNOWLEDGED"
          - "alert.severity in {HIGH, CRITICAL}"
          - "vendor.posture in {APPROVED, CONDITIONAL}"
        side_effects:
          - "vendor.next_reassessment_due = min(existing, current clock + escalation_pull_forward_days(severity))"
          - "appends ReassessmentSchedule(kind=ALERT_ESCALATION, reason_ref=this alert)"
          - "vendor.posture -> ASSESSING"
          - "creates new AssessmentCycle(status=DRAFT) as vendor.active_cycle_id"
          - "increments alert.version and vendor.version by 1"

  - entity: SubprocessorDisclosure
    initial_state: DISCLOSED
    terminal_states: [APPROVED, REJECTED, WITHDRAWN]
    transitions:
      - from: DISCLOSED
        to: UNDER_REVIEW
        trigger: "POST /vsa/vendors/{vendor_id}/subprocessors/{id}/start-review"
        actor: RiskAnalyst
        preconditions:
          - "disclosure.status == DISCLOSED"
        side_effects:
          - "increments disclosure.version by 1"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /vsa/vendors/{vendor_id}/subprocessors/{id}/approve"
        actor: SecurityApprover
        preconditions:
          - "disclosure.status == UNDER_REVIEW"
          - "vendor.posture in {APPROVED, CONDITIONAL, ASSESSING}"
          - "approver X-User-ID != RiskAnalyst who started review (segregation of duties)"
        side_effects:
          - "sets decided_by"
          - "increments disclosure.version by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /vsa/vendors/{vendor_id}/subprocessors/{id}/reject"
        actor: SecurityApprover
        preconditions:
          - "disclosure.status == UNDER_REVIEW"
        side_effects:
          - "sets decided_by"
          - "increments disclosure.version by 1"
      - from: DISCLOSED
        to: WITHDRAWN
        trigger: "POST /vsa/vendors/{vendor_id}/subprocessors/{id}/withdraw"
        actor: VendorContact
        preconditions:
          - "disclosure.status == DISCLOSED"
        side_effects:
          - "increments disclosure.version by 1"

  - entity: OffboardingAttestation
    initial_state: REQUESTED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: REQUESTED
        to: SUBMITTED
        trigger: "POST /vsa/vendors/{vendor_id}/offboarding-attestations/{id}/submit"
        actor: VendorContact
        preconditions:
          - "attestation.status == REQUESTED"
          - "vendor.posture == OFFBOARDING"
          - "data_returned == true OR data_destroyed == true"
          - "data_destroyed == true implies destruction_method non-empty"
        side_effects:
          - "sets submitted_at"
          - "increments attestation.version by 1"
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /vsa/vendors/{vendor_id}/offboarding-attestations/{id}/verify"
        actor: RiskAnalyst
        preconditions:
          - "attestation.status == SUBMITTED"
          - "no AssessmentCycle for vendor in non-terminal state"
          - "no MonitoringAlert for vendor with status in {OPEN, ACKNOWLEDGED}"
        side_effects:
          - "vendor.posture -> OFFBOARDED"
          - "increments attestation.version and vendor.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /vsa/vendors/{vendor_id}/offboarding-attestations/{id}/reject"
        actor: RiskAnalyst
        preconditions:
          - "attestation.status == SUBMITTED"
        side_effects:
          - "creates new OffboardingAttestation(status=REQUESTED) for vendor (compensation loop)"
          - "vendor.offboarding_deadline extends by 30 days"
          - "appends ReassessmentSchedule(kind=OFFBOARDING_SLIP, previous_due=old deadline, new_due=extended deadline, reason_ref=this attestation)"
          - "increments vendor.version by 1"

  - entity: Vendor
    initial_state: ONBOARDING
    terminal_states: [OFFBOARDED]
    transitions:
      - from: ONBOARDING
        to: ASSESSING
        trigger: "POST /vsa/vendors/{id}/cycles + issue (first cycle issuance)"
        actor: RiskAnalyst
        preconditions:
          - "vendor.posture == ONBOARDING"
        side_effects:
          - "vendor.active_cycle_id set"
          - "runs tier_assignment; sets vendor.current_tier"
          - "runs vendor_risk_score refresh"
      - from: ASSESSING
        to: APPROVED
        trigger: "cycle reaches APPROVED with no accepted exceptions"
        actor: SecurityApprover
        preconditions:
          - "cycle.status -> APPROVED"
          - "no APPROVED RiskAcceptance for cycle"
        side_effects:
          - "runs vendor_risk_score refresh"
          - "vendor.next_reassessment_due set per tier cadence"
      - from: ASSESSING
        to: CONDITIONAL
        trigger: "cycle reaches APPROVED with at least one APPROVED RiskAcceptance"
        actor: SecurityApprover
        preconditions:
          - "cycle.status -> APPROVED"
          - "at least one APPROVED RiskAcceptance exists for cycle"
        side_effects:
          - "runs vendor_risk_score refresh"
          - "vendor.next_reassessment_due set per tier cadence halved (conditional)"
      - from: ASSESSING
        to: SUSPENDED
        trigger: "cycle REJECTED or cycle EXPIRED"
        actor: system
        preconditions:
          - "cycle.status in {REJECTED, EXPIRED}"
        side_effects:
          - "vendor.active_cycle_id -> null"
          - "runs vendor_risk_score refresh"
      - from: APPROVED
        to: ASSESSING
        trigger: "monitoring alert escalated or reassessment due reached"
        actor: system
        preconditions:
          - "vendor.posture == APPROVED"
        side_effects:
          - "creates new AssessmentCycle(status=DRAFT) as vendor.active_cycle_id"
      - from: CONDITIONAL
        to: ASSESSING
        trigger: "monitoring alert escalated or reassessment due reached"
        actor: system
        preconditions:
          - "vendor.posture == CONDITIONAL"
        side_effects:
          - "creates new AssessmentCycle(status=DRAFT) as vendor.active_cycle_id"
      - from: APPROVED
        to: OFFBOARDING
        trigger: "POST /vsa/vendors/{id}/offboard"
        actor: RiskAnalyst
        preconditions:
          - "vendor.posture == APPROVED"
          - "no active cycle"
        side_effects:
          - "creates OffboardingAttestation(status=REQUESTED)"
          - "sets vendor.offboarding_deadline = current clock + 90 days"
      - from: ONBOARDING
        to: OFFBOARDING
        trigger: "POST /vsa/vendors/{id}/offboard"
        actor: RiskAnalyst
        preconditions:
          - "vendor.posture == ONBOARDING"
          - "no active cycle"
        side_effects:
          - "creates OffboardingAttestation(status=REQUESTED)"
          - "sets vendor.offboarding_deadline = current clock + 90 days"
      - from: CONDITIONAL
        to: OFFBOARDING
        trigger: "POST /vsa/vendors/{id}/offboard"
        actor: RiskAnalyst
        preconditions:
          - "vendor.posture == CONDITIONAL"
          - "no active cycle"
        side_effects:
          - "creates OffboardingAttestation(status=REQUESTED)"
          - "sets vendor.offboarding_deadline = current clock + 90 days"
      - from: SUSPENDED
        to: OFFBOARDING
        trigger: "POST /vsa/vendors/{id}/offboard"
        actor: RiskAnalyst
        preconditions:
          - "vendor.posture == SUSPENDED"
        side_effects:
          - "creates OffboardingAttestation(status=REQUESTED)"
          - "sets vendor.offboarding_deadline = current clock + 90 days"
      - from: OFFBOARDING
        to: OFFBOARDED
        trigger: "OffboardingAttestation reaches VERIFIED"
        actor: RiskAnalyst
        preconditions:
          - "attestation.status -> VERIFIED"
        side_effects:
          - "vendor.active_cycle_id -> null"
          - "vendor.next_reassessment_due -> null"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: cycle-issue-stale-vendor
    parent_entity: Vendor
    write_endpoint: "POST /vsa/vendors/{id}/cycles"
    occ_field: "expected_vendor_version"
    description: |
      Creating an AssessmentCycle against a Vendor whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just issued or closed a cycle (which
      legitimately mutates vendor.posture and vendor.active_cycle_id) and the
      current writer's view of the vendor is therefore stale.
    error_id: ERR_STALE_VENDOR_VERSION
    http_status: 412
  - rule_id: risk-acceptance-approve-stale-cycle
    parent_entity: AssessmentCycle
    write_endpoint: "POST /vsa/vendors/{vendor_id}/cycles/{cycle_id}/risk-acceptances/{id}/approve"
    occ_field: "expected_cycle_version"
    description: |
      Approving a RiskAcceptance against a cycle whose version has advanced
      since the approver last observed it is rejected. A concurrent
      remediation verification or exception closure mutates
      cycle.open_exception_count and cycle.version; the approver's decision
      was made against a stale open-exception set and MUST be redone.
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: tier_assignment
    trigger: "on Vendor create, on Vendor PATCH of data_sensitivity/access_level/criticality, and on cycle issuance"
    algorithm: constraint_propagation
    formula: |
      # tier_order: TIER_4 < TIER_3 < TIER_2 < TIER_1 in strictness (TIER_4 strictest).
      # severity_rank: PUBLIC=0, INTERNAL=1, CONFIDENTIAL=2, REGULATED=3
      # access_rank:   NONE=0, READ_ONLY=1, OPERATOR=2, PRIVILEGED=3
      # crit_rank:     LOW=0, MEDIUM=1, HIGH=2, MISSION_CRITICAL=3
      policy = active AssessmentTierPolicy
      key = (vendor.data_sensitivity, vendor.access_level, vendor.criticality)
      if key in policy.tier_matrix: return policy.tier_matrix[key]
      # fallback: computed tier from ranks
      score = severity_rank + access_rank + crit_rank      # 0..9
      if score >= 7: return TIER_4
      if score >= 5: return TIER_3
      if score >= 3: return TIER_2
      return TIER_1
    input_set: "single Vendor; the one AssessmentTierPolicy with active=true"
    constants:
      TIER4_CUTOFF: 7
      TIER3_CUTOFF: 5
      TIER2_CUTOFF: 3
    precision: "integer rank arithmetic, no rounding"
    variants:
      - name: matrix_override
        when: "explicit (sensitivity, access, criticality) triple present in policy.tier_matrix"
        difference: "matrix wins over rank-sum fallback even when ranks would produce a different tier"
      - name: rank_fallback
        when: "triple absent from matrix"
        difference: "computed from severity+access+criticality rank sum"

  - name: questionnaire_response_score
    trigger: "POST /vsa/vendors/{vendor_id}/cycles/{id}/score"
    algorithm: weighted_scoring
    formula: |
      # Items from cycle's PINNED template version (cycle.template_version), not latest.
      # Per item: earned = weight * answer_score(answer_value); answer_score: YES=1.0, PARTIAL=0.5, NO=0.0, NA=excluded.
      # na_items excluded from BOTH numerator and denominator (na-adjustment).
      earned_sum   = sum(earned_i for i in items where answer_i != NA)
      possible_sum = sum(weight_i for i in items where answer_i != NA)
      if possible_sum == 0: raw = 0.0
      else: raw = round(100.0 * earned_sum / possible_sum, 2)   # round_half_up
      # revision penalty: subtract REVISION_PENALTY_PCT of raw per revision_count, capped
      penalty = min(raw * REVISION_PENALTY_PCT * response.revision_count, REVISION_PENALTY_CAP)
      questionnaire_score = round(raw - penalty, 2)             # round_half_up
    input_set: "QuestionnaireResponse.answers joined to pinned QuestionnaireTemplate.items by item_key; only the response in status SUBMITTED for this cycle"
    constants:
      REVISION_PENALTY_PCT: 0.05
      REVISION_PENALTY_CAP: 20.0
      YES_SCORE: 1.0
      PARTIAL_SCORE: 0.5
      NO_SCORE: 0.0
    precision: "2 decimal places, round_half_up; per-item products NOT rounded (sum then round final only)"
    variants:
      - name: provisional_at_submission
        when: "computed on SUBMITTED before analyst scoring"
        difference: "no revision penalty applied; raw only"
      - name: final_at_scoring
        when: "computed by analyst score endpoint"
        difference: "revision penalty applied using response.revision_count at scoring time"

  - name: evidence_review_score
    trigger: "POST /vsa/vendors/{vendor_id}/cycles/{id}/evidence-review/complete"
    algorithm: aggregation
    formula: |
      # Per-artifact base by kind: SOC2_TYPE2=100, ISO27001=95, SOC2_TYPE1=80, PENTEST=70, OTHER=50
      # Penalty per artifact: coverage_gap_days penalty = min(gap_days, 365) / 365 * GAP_PENALTY_MAX
      # Severity deductions over ExceptionFindings for this cycle with source=EVIDENCE:
      #   CRITICAL=25, HIGH=15, MEDIUM=8, LOW=3, summed, only status in {OPEN, IN_REMEDIATION}
      # evidence_score = max(0, round(avg(adjusted_artifact_scores) - severity_deductions, 2))
      # REJECTED artifacts excluded from average entirely.
      artifacts = [a for a in cycle.evidence if a.status in {REVIEWED_CLEAN, REVIEWED_WITH_EXCEPTIONS}]
      if artifacts empty: evidence_score = 0.0
      adjusted_i = base(kind_i) - min(gap_i, 365)/365 * GAP_PENALTY_MAX
      avg_adj = sum(adjusted_i) / len(artifacts)
      deductions = sum(severity_weight(e) for e in cycle.exceptions if e.source==EVIDENCE and e.status in {OPEN, IN_REMEDIATION})
      evidence_score = max(0.0, round(avg_adj - deductions, 2))
    input_set: "EvidenceArtifacts for cycle in {REVIEWED_CLEAN, REVIEWED_WITH_EXCEPTIONS}; ExceptionFindings for cycle with source=EVIDENCE and status in {OPEN, IN_REMEDIATION}"
    constants:
      GAP_PENALTY_MAX: 30.0
      BASE_SOC2_TYPE2: 100.0
      BASE_ISO27001: 95.0
      BASE_SOC2_TYPE1: 80.0
      BASE_PENTEST: 70.0
      BASE_OTHER: 50.0
      SEV_CRITICAL: 25.0
      SEV_HIGH: 15.0
      SEV_MEDIUM: 8.0
      SEV_LOW: 3.0
    precision: "2 decimal places, round_half_up; per-artifact adjusted values NOT rounded before averaging"
    variants:
      - name: strict_window
        when: "cycle.tier_at_issue in {TIER_3, TIER_4}"
        difference: "coverage_gap_days penalty uses min(gap,180)/180 * GAP_PENALTY_MAX (steeper for high tiers)"
      - name: standard_window
        when: "cycle.tier_at_issue in {TIER_1, TIER_2}"
        difference: "365-day normalisation"

  - name: composite_cycle_score
    trigger: "evidence-review completion and remediation resolution"
    algorithm: weighted_scoring
    formula: |
      # composite = round(W_Q * questionnaire_score + W_E * evidence_score, 2)
      # acceptance_required = composite < tier_pass_threshold(tier_at_issue)
      #                       OR exists exception CLOSED_ACCEPTED in this cycle
      # tier_pass_threshold: TIER_1=60, TIER_2=70, TIER_3=80, TIER_4=90
      composite = round(0.40 * questionnaire_score + 0.60 * evidence_score, 2)
    input_set: "cycle.questionnaire_score (final variant) and cycle.evidence_score; both must be non-null"
    constants:
      W_Q: 0.40
      W_E: 0.60
      PASS_TIER1: 60.0
      PASS_TIER2: 70.0
      PASS_TIER3: 80.0
      PASS_TIER4: 90.0
    precision: "2 decimal places, round_half_up"

  - name: vendor_risk_score
    trigger: "on vendor posture change, cycle closure, alert escalation, acceptance expiry"
    algorithm: threshold
    formula: |
      # Base by posture: ONBOARDING=50, ASSESSING=60, APPROVED=20, CONDITIONAL=45, SUSPENDED=85, OFFBOARDING=70, OFFBOARDED=10
      # Modifiers:
      #   + 5 per OPEN/ACKNOWLEDGED MonitoringAlert with severity HIGH; +10 per CRITICAL
      #   + 3 per exception CLOSED_ACCEPTED in the latest APPROVED cycle (residual risk)
      #   + 8 per RiskAcceptance APPROVED whose expires_at < now + 30 days (imminent expiry)
      # Clamp to [0, 100]; round_half_up to 2 dp.
      risk = clamp(base(posture) + alert_mod + accepted_mod + expiry_mod, 0, 100)
    input_set: "Vendor posture; MonitoringAlerts for vendor in {OPEN, ACKNOWLEDGED}; latest terminal AssessmentCycle; RiskAcceptances APPROVED for vendor"
    constants:
      BASE_ONBOARDING: 50.0
      BASE_ASSESSING: 60.0
      BASE_APPROVED: 20.0
      BASE_CONDITIONAL: 45.0
      BASE_SUSPENDED: 85.0
      BASE_OFFBOARDING: 70.0
      BASE_OFFBOARDED: 10.0
      ALERT_HIGH: 5.0
      ALERT_CRITICAL: 10.0
      ACCEPTED_PER: 3.0
      EXPIRY_IMMINENT: 8.0
      EXPIRY_WINDOW_DAYS: 30
    precision: "2 decimal places, round_half_up"

  - name: addendum_requirement
    trigger: "evidence-review completion (REMEDIATION path) and cycle approval"
    algorithm: constraint_propagation
    formula: |
      # clause_set = base_clauses(tier_at_issue) UNION exception_clauses
      # base: TIER_1={C_DPA}; TIER_2={C_DPA, C_BREACH_NOTIFY}; TIER_3={C_DPA, C_BREACH_NOTIFY, C_AUDIT_RIGHT};
      #       TIER_4={C_DPA, C_BREACH_NOTIFY, C_AUDIT_RIGHT, C_ENCRYPTION, C_SUBPROCESSOR_FLOWDOWN}
      # exception_clauses: any HIGH exception adds C_REMEDIATION_TIMELINE; any CRITICAL adds C_TERMINATION_RIGHT
      # a ContractAddendum row is REQUIRED iff clause_set non-empty; TIER always >= 1 so always non-empty.
      clause_set = sorted(base_clauses(tier) union exception_clauses(exceptions))
    input_set: "cycle.tier_at_issue; ExceptionFindings for cycle with severity in {HIGH, CRITICAL} regardless of status"
    constants: {}
    precision: "set semantics, no numeric rounding"

  - name: tier_response_window
    trigger: "cycle issuance"
    algorithm: threshold
    formula: |
      # response window in days by tier: TIER_1=45, TIER_2=30, TIER_3=21, TIER_4=14
      response_due_at = issued_at + WINDOW_DAYS[tier_at_issue] days
    input_set: "cycle.tier_at_issue"
    constants:
      WINDOW_TIER1: 45
      WINDOW_TIER2: 30
      WINDOW_TIER3: 21
      WINDOW_TIER4: 14
    precision: "datetime arithmetic, day granularity"

  - name: escalation_pull_forward
    trigger: "monitoring alert escalation and acceptance expiry"
    algorithm: threshold
    formula: |
      # CRITICAL alert: pull next_reassessment_due forward to now + 14 days if later than that
      # HIGH alert: pull forward to now + 30 days if later
      # acceptance expiry: pull to now + 30 days if later
      # never moves the date LATER than existing value (min semantics)
      new_due = min(existing_due, now + DELTA[severity])
    input_set: "alert.severity or acceptance expiry event; vendor.next_reassessment_due"
    constants:
      DELTA_CRITICAL_DAYS: 14
      DELTA_HIGH_DAYS: 30
      DELTA_ACCEPTANCE_EXPIRY_DAYS: 30
    precision: "datetime arithmetic, day granularity"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is declared", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted for this endpoint per §1.7", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path resources exist, validated left-to-right (vendor, cycle, child)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: state, check: "Target resource in a state that permits this transition per §1.2", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 5, category: business_safety, check: "Segregation of duties: actor X-User-ID differs from the user who performed the prior gated step (requester vs approver, plan acceptor vs verifier, review starter vs subprocessor approver, evidence-review completer vs cycle approver)", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 422, applies_to: ["POST /vsa/vendors/{vid}/cycles/{cid}/risk-acceptances/{id}/approve", "POST /vsa/vendors/{vid}/cycles/{cid}/risk-acceptances/{id}/reject", "POST /vsa/vendors/{vid}/cycles/{cid}/remediation-plans/{id}/verify", "POST /vsa/vendors/{vid}/subprocessors/{id}/approve", "POST /vsa/vendors/{vid}/cycles/{cid}/approve"] }
  - { priority: 6, category: business_safety, check: "OCC: expected_vendor_version matches Vendor.version on cycle create (ERR_STALE_VENDOR_VERSION); expected_cycle_version matches AssessmentCycle.version on risk-acceptance approve (ERR_STALE_CYCLE_VERSION); ERR_STALE_VERSION is the fallback for any future OCC-guarded write without a specific id", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /vsa/vendors/{id}/cycles", "POST /vsa/vendors/{vid}/cycles/{cid}/risk-acceptances/{id}/approve"] }
  - { priority: 7, category: business_temporal, check: "Clock-dependent deadline: response submitted before response_due_at; attestation before offboarding_deadline; acceptance expires_at in future", error_id: ERR_DEADLINE_PASSED, http_status: 422, applies_to: ["POST /vsa/vendors/{vid}/cycles/{cid}/responses/{id}/submit", "POST /vsa/vendors/{vid}/offboarding-attestations/{id}/submit", "POST /vsa/vendors/{vid}/cycles/{cid}/risk-acceptances"] }
  - { priority: 8, category: business_constraint, check: "Enum membership and required-field presence (item_key exists in pinned template, destruction_method iff data_destroyed, severity in enum, kind in enum); attestation semantic completeness (data_returned or data_destroyed must be true) yields ERR_ATTESTATION_INCOMPLETE", error_id: ERR_INVALID_REQUEST, http_status: 422, applies_to: "all" }
  - { priority: 8, category: business_constraint, check: "Attestation submit requires data_returned=true OR data_destroyed=true", error_id: ERR_ATTESTATION_INCOMPLETE, http_status: 422, applies_to: ["POST /vsa/vendors/{id}/offboarding-attestations/{aid}/submit"] }
  - { priority: 9, category: business_constraint, check: "Uniqueness: at most one non-terminal cycle per vendor (ERR_CYCLE_ALREADY_ACTIVE on POST /vsa/vendors/{id}/cycles); at most one primary VendorContact per vendor and at most one active AssessmentTierPolicy (ERR_UNIQUENESS_VIOLATION)", error_id: ERR_UNIQUENESS_VIOLATION, http_status: 409, applies_to: ["POST /vsa/vendors/{id}/cycles", "POST /vsa/vendors/{id}/contacts", "POST /vsa/tier-policies"] }
  - { priority: 10, category: business_referential, check: "Referenced children exist and belong to the path parent (exception_ids belong to cycle; plan.exception_ids all OPEN; acceptance.exception_ids all OPEN or IN_REMEDIATION; evidence_artifact_id required and valid iff source=EVIDENCE)", error_id: ERR_REFERENTIAL_INTEGRITY, http_status: 422, applies_to: ["POST /vsa/vendors/{vid}/cycles/{cid}/remediation-plans", "POST /vsa/vendors/{vid}/cycles/{cid}/risk-acceptances", "POST /vsa/vendors/{vid}/cycles/{cid}/exceptions"] }
  - { priority: 11, category: business_constraint, check: "Aggregate gate: cycle approve requires open_exception_count == 0, every RiskAcceptance decided, no outstanding REQUIRED/DRAFTED ContractAddendum", error_id: ERR_OPEN_ITEMS_OUTSTANDING, http_status: 422, applies_to: ["POST /vsa/vendors/{vid}/cycles/{cid}/approve", "POST /vsa/vendors/{vid}/cycles/{cid}/evidence-review/complete"] }
  - { priority: 12, category: business_fiscal, check: "Score thresholds: questionnaire_score >= tier pass threshold for response acceptance; composite threshold gates clean approval", error_id: ERR_SCORE_BELOW_THRESHOLD, http_status: 422, applies_to: ["POST /vsa/vendors/{vid}/cycles/{cid}/score", "POST /vsa/vendors/{vid}/cycles/{cid}/evidence-review/complete"] }
  - { priority: 13, category: business_temporal, check: "Evidence coverage validity: period_end > period_start; artifact rejected when coverage_gap_days > 180", error_id: ERR_EVIDENCE_COVERAGE_INVALID, http_status: 422, applies_to: ["POST /vsa/vendors/{vid}/cycles/{cid}/evidence", "POST /vsa/vendors/{vid}/cycles/{cid}/evidence/{id}/complete-review"] }
  - { priority: 14, category: business_constraint, check: "Subprocessor approval requires vendor.posture in {APPROVED, CONDITIONAL, ASSESSING}", error_id: ERR_VENDOR_POSTURE_BLOCKS, http_status: 422, applies_to: ["POST /vsa/vendors/{vid}/subprocessors/{id}/approve", "POST /vsa/vendors/{vid}/cycles", "POST /vsa/vendors/{vid}/subprocessors"] }
  - { priority: 15, category: business_constraint, check: "Template state gates: issue requires PUBLISHED template (ERR_TEMPLATE_NOT_PUBLISHED); retire blocked while non-terminal cycles reference it (ERR_TEMPLATE_IN_USE)", error_id: ERR_TEMPLATE_NOT_PUBLISHED, http_status: 422, applies_to: ["POST /vsa/vendors/{vid}/cycles/{id}/issue", "POST /vsa/questionnaire-templates/{id}/retire"] }
  - { priority: 16, category: business_constraint, check: "Response submit requires every pinned-template item answered or na_justified", error_id: ERR_RESPONSE_INCOMPLETE, http_status: 422, applies_to: ["POST /vsa/vendors/{vid}/cycles/{cid}/responses/{id}/submit"] }
  - { priority: 17, category: business_constraint, check: "Plan verify requires completed_task_keys == full task key set when not rejecting", error_id: ERR_PLAN_TASKS_INCOMPLETE, http_status: 422, applies_to: ["POST /vsa/vendors/{vid}/cycles/{cid}/remediation-plans/{id}/verify"] }
  - { priority: 18, category: business_constraint, check: "evidence-review/complete blocked while any artifact in {RECEIVED, UNDER_REVIEW}", error_id: ERR_EVIDENCE_PENDING_REVIEW, http_status: 422, applies_to: ["POST /vsa/vendors/{vid}/cycles/{cid}/evidence-review/complete"] }
  - { priority: 19, category: business_temporal, check: "Decision on a RiskAcceptance whose expires_at has passed (sweep has not yet fired)", error_id: ERR_ACCEPTANCE_EXPIRED, http_status: 422, applies_to: ["POST /vsa/vendors/{vid}/cycles/{cid}/risk-acceptances/{id}/approve", "POST /vsa/vendors/{vid}/cycles/{cid}/risk-acceptances/{id}/reject"] }
  - { priority: 20, category: business_constraint, check: "Alert escalation requires severity in {HIGH, CRITICAL} and vendor posture in {APPROVED, CONDITIONAL}", error_id: ERR_ALERT_NOT_ESCALATABLE, http_status: 422, applies_to: ["POST /vsa/vendors/{id}/monitoring-alerts/{aid}/escalate"] }
  - { priority: 21, category: business_constraint, check: "Cycle approval blocked by REQUIRED/DRAFTED addendum", error_id: ERR_ADDENDUM_OUTSTANDING, http_status: 422, applies_to: ["POST /vsa/vendors/{vid}/cycles/{cid}/approve"] }
  - { priority: 22, category: business_constraint, check: "Attestation verify blocked while vendor has non-terminal cycle or OPEN/ACKNOWLEDGED alerts", error_id: ERR_OFFBOARDING_BLOCKED, http_status: 422, applies_to: ["POST /vsa/vendors/{id}/offboarding-attestations/{aid}/verify"] }
  - { priority: 23, category: business_constraint, check: "limit/offset outside envelope bounds (1..100 / >=0)", error_id: ERR_PAGINATION_INVALID, http_status: 422, applies_to: "all list endpoints" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- clock (test-driving; mandatory default) ---
  - method: POST
    path: /vsa/_clock/set_current_utc
    description: "Test-driving endpoint: set logical clock. Server startup default time is 2026-08-01T00:00:00Z; before any set_current_utc call the clock reads exactly this default and never falls back to wall-clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["fires any due auto-transitions (cycle EXPIRED sweep, RiskAcceptance EXPIRED sweep)"]

  # --- tier policies ---
  - method: POST
    path: /vsa/tier-policies
    description: "Create AssessmentTierPolicy"
    roles: [PlatformAdmin]
    code: 201
    input: [name, "active?", tier_matrix, "tier1_reassessment_months?", "tier2_reassessment_months?", "tier3_reassessment_months?", "tier4_reassessment_months?"]
    output: AssessmentTierPolicy
    side_effects: ["if active=true, deactivates any previously active policy"]
  - method: GET
    path: /vsa/tier-policies
    description: "List tier policies"
    roles: [PlatformAdmin, RiskAnalyst, SecurityApprover]
    code: 200
    input: ["limit?", "offset?", "active?"]
    output: AssessmentTierPolicy[]
    side_effects: []
  - method: GET
    path: /vsa/tier-policies/{id}
    description: "Get one tier policy"
    roles: [PlatformAdmin, RiskAnalyst, SecurityApprover]
    code: 200
    input: []
    output: AssessmentTierPolicy
    side_effects: []

  # --- questionnaire templates ---
  - method: POST
    path: /vsa/questionnaire-templates
    description: "Create template in DRAFT"
    roles: [RiskAnalyst]
    code: 201
    input: [title, applies_to_tiers, items]
    output: QuestionnaireTemplate
    side_effects: []
  - method: GET
    path: /vsa/questionnaire-templates
    description: "List templates"
    roles: [RiskAnalyst, SecurityApprover, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: QuestionnaireTemplate[]
    side_effects: []
  - method: GET
    path: /vsa/questionnaire-templates/{id}
    description: "Get template"
    roles: [RiskAnalyst, SecurityApprover, PlatformAdmin]
    code: 200
    input: []
    output: QuestionnaireTemplate
    side_effects: []
  - method: POST
    path: /vsa/questionnaire-templates/{id}/publish
    description: "Publish DRAFT template"
    roles: [RiskAnalyst]
    code: 200
    input: []
    output: QuestionnaireTemplate
    side_effects: ["published_version += 1"]
  - method: POST
    path: /vsa/questionnaire-templates/{id}/retire
    description: "Retire PUBLISHED template"
    roles: [RiskAnalyst]
    code: 200
    input: []
    output: QuestionnaireTemplate
    side_effects: []
  - method: POST
    path: /vsa/questionnaire-templates/{id}/revise
    description: "Create revised DRAFT copy from PUBLISHED template"
    roles: [RiskAnalyst]
    code: 201
    input: []
    output: QuestionnaireTemplate
    side_effects: ["new DRAFT row created copying items"]
  - method: GET
    path: /vsa/questionnaire-templates/{id}/cycles
    description: "List assessment cycles issued against this template (reverse reachability for AssessmentCycle.template_id)"
    roles: [RiskAnalyst, SecurityApprover, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: AssessmentCycle[]
    side_effects: []

  # --- vendors ---
  - method: POST
    path: /vsa/vendors
    description: "Register vendor; runs tier_assignment"
    roles: [RiskAnalyst]
    code: 201
    input: [legal_name, data_sensitivity, access_level, criticality]
    output: Vendor
    side_effects: ["runs tier_assignment -> current_tier", "runs vendor_risk_score"]
  - method: GET
    path: /vsa/vendors
    description: "List vendors"
    roles: [RiskAnalyst, SecurityApprover, PlatformAdmin, VendorContact]
    code: 200
    input: ["limit?", "offset?", "posture?", "current_tier?", "active_cycle_id?"]
    output: Vendor[]
    side_effects: []
  - method: GET
    path: /vsa/vendors/{id}
    description: "Get vendor"
    roles: [RiskAnalyst, SecurityApprover, PlatformAdmin, VendorContact]
    code: 200
    input: []
    output: Vendor
    side_effects: []
  - method: PATCH
    path: /vsa/vendors/{id}
    description: "Update vendor attributes; re-runs tier_assignment"
    roles: [RiskAnalyst]
    code: 200
    input: ["legal_name?", "data_sensitivity?", "access_level?", "criticality?"]
    output: Vendor
    side_effects: ["runs tier_assignment", "runs vendor_risk_score", "increments vendor.version by 1"]
  - method: POST
    path: /vsa/vendors/{id}/offboard
    description: "Move vendor to OFFBOARDING; create attestation"
    roles: [RiskAnalyst]
    code: 200
    input: []
    output: Vendor
    side_effects: ["creates OffboardingAttestation(REQUESTED)", "sets offboarding_deadline", "increments vendor.version by 1"]

  # --- vendor contacts ---
  - method: POST
    path: /vsa/vendors/{id}/contacts
    description: "Add vendor contact"
    roles: [RiskAnalyst]
    code: 201
    input: [email, full_name, "is_primary?"]
    output: VendorContact
    side_effects: ["if is_primary=true, demotes any existing primary"]
  - method: GET
    path: /vsa/vendors/{id}/contacts
    description: "List vendor contacts"
    roles: [RiskAnalyst, SecurityApprover, VendorContact]
    code: 200
    input: ["limit?", "offset?"]
    output: VendorContact[]
    side_effects: []

  # --- assessment cycles ---
  - method: POST
    path: /vsa/vendors/{id}/cycles
    description: "Create AssessmentCycle (DRAFT) for vendor; OCC-guarded"
    roles: [RiskAnalyst]
    code: 201
    input: [template_id, expected_vendor_version]
    output: AssessmentCycle
    side_effects: ["sets vendor.active_cycle_id", "increments vendor.version by 1"]
  - method: GET
    path: /vsa/vendors/{id}/cycles
    description: "List vendor cycles"
    roles: [RiskAnalyst, SecurityApprover, VendorContact]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: AssessmentCycle[]
    side_effects: []
  - method: GET
    path: /vsa/cycles/{id}
    description: "Get cycle by id"
    roles: [RiskAnalyst, SecurityApprover, VendorContact]
    code: 200
    input: []
    output: AssessmentCycle
    side_effects: []
  - method: GET
    path: /vsa/cycles/{id}/responses
    description: "List questionnaire responses for cycle (reverse reachability for QuestionnaireResponse.cycle_id)"
    roles: [RiskAnalyst, SecurityApprover, VendorContact]
    code: 200
    input: ["limit?", "offset?"]
    output: QuestionnaireResponse[]
    side_effects: []
  - method: GET
    path: /vsa/cycles/{id}/evidence
    description: "List evidence artifacts for cycle (reverse reachability for EvidenceArtifact.cycle_id)"
    roles: [RiskAnalyst, SecurityApprover, VendorContact]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: EvidenceArtifact[]
    side_effects: []
  - method: GET
    path: /vsa/cycles/{id}/exceptions
    description: "List exception findings for cycle (reverse reachability for ExceptionFinding.cycle_id)"
    roles: [RiskAnalyst, SecurityApprover, VendorContact]
    code: 200
    input: ["limit?", "offset?", "status?", "severity?", "evidence_artifact_id?"]
    output: ExceptionFinding[]
    side_effects: []
  - method: GET
    path: /vsa/cycles/{id}/remediation-plans
    description: "List remediation plans for cycle (reverse reachability for RemediationPlan.cycle_id)"
    roles: [RiskAnalyst, SecurityApprover, VendorContact]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: RemediationPlan[]
    side_effects: []
  - method: GET
    path: /vsa/cycles/{id}/risk-acceptances
    description: "List risk acceptances for cycle (reverse reachability for RiskAcceptance.cycle_id)"
    roles: [RiskAnalyst, SecurityApprover]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: RiskAcceptance[]
    side_effects: []
  - method: POST
    path: /vsa/vendors/{vid}/cycles/{id}/issue
    description: "Issue cycle; pins template version; vendor -> ASSESSING"
    roles: [RiskAnalyst]
    code: 200
    input: []
    output: AssessmentCycle
    side_effects: ["pins template_id/template_version", "sets issued_at/response_due_at", "vendor.posture -> ASSESSING", "increments vendor.version by 1"]
  - method: POST
    path: /vsa/vendors/{vid}/cycles/{id}/score
    description: "Score submitted questionnaire response"
    roles: [RiskAnalyst]
    code: 200
    input: []
    output: AssessmentCycle
    side_effects: ["runs questionnaire_response_score (final variant)", "response ACCEPTED or RETURNED", "increments cycle.version by 1"]
  - method: POST
    path: /vsa/vendors/{vid}/cycles/{id}/evidence-review/complete
    description: "Complete evidence review; runs evidence_review_score + composite; may create addendum"
    roles: [RiskAnalyst]
    code: 200
    input: []
    output: AssessmentCycle
    side_effects: ["runs evidence_review_score", "runs composite_cycle_score", "runs addendum_requirement", "increments cycle.version by 1"]
  - method: POST
    path: /vsa/vendors/{vid}/cycles/{id}/remediation/resolve
    description: "Resolve remediation phase; re-runs composite"
    roles: [RiskAnalyst]
    code: 200
    input: []
    output: AssessmentCycle
    side_effects: ["runs composite_cycle_score", "increments cycle.version by 1"]
  - method: POST
    path: /vsa/vendors/{vid}/cycles/{id}/approve
    description: "Approve cycle (RISK_ACCEPTANCE_REVIEW -> APPROVED)"
    roles: [SecurityApprover]
    code: 200
    input: []
    output: AssessmentCycle
    side_effects: ["vendor.posture -> APPROVED or CONDITIONAL", "sets next_reassessment_due", "appends ReassessmentSchedule", "increments vendor.version by 1"]
  - method: POST
    path: /vsa/vendors/{vid}/cycles/{id}/reject
    description: "Reject cycle"
    roles: [SecurityApprover]
    code: 200
    input: []
    output: AssessmentCycle
    side_effects: ["vendor.posture -> SUSPENDED", "increments vendor.version by 1"]

  # --- questionnaire responses ---
  - method: POST
    path: /vsa/vendors/{vid}/cycles/{cid}/responses
    description: "Create DRAFT response for issued cycle"
    roles: [VendorContact]
    code: 201
    input: [submitted_by, answers]
    output: QuestionnaireResponse
    side_effects: []
  - method: POST
    path: /vsa/vendors/{vid}/cycles/{cid}/responses/{id}/submit
    description: "Submit (or resubmit) response"
    roles: [VendorContact]
    code: 200
    input: []
    output: QuestionnaireResponse
    side_effects: ["sets submitted_at", "cycle.status -> RESPONSE_RECEIVED", "increments cycle.version by 1"]
  - method: POST
    path: /vsa/vendors/{vid}/cycles/{cid}/responses/{id}/return
    description: "Return response for revision"
    roles: [RiskAnalyst]
    code: 200
    input: []
    output: QuestionnaireResponse
    side_effects: ["revision_count += 1", "increments response.version by 1"]

  # --- evidence ---
  - method: POST
    path: /vsa/vendors/{vid}/cycles/{cid}/evidence
    description: "Upload evidence artifact"
    roles: [VendorContact]
    code: 201
    input: [kind, period_start, period_end, issued_by]
    output: EvidenceArtifact
    side_effects: ["first artifact moves cycle SCORED -> EVIDENCE_REVIEW", "increments cycle.version by 1"]
  - method: POST
    path: /vsa/vendors/{vid}/cycles/{cid}/evidence/{id}/start-review
    description: "Start review of artifact"
    roles: [RiskAnalyst]
    code: 200
    input: []
    output: EvidenceArtifact
    side_effects: ["increments artifact.version by 1"]
  - method: POST
    path: /vsa/vendors/{vid}/cycles/{cid}/evidence/{id}/complete-review
    description: "Complete review; with or without exceptions"
    roles: [RiskAnalyst]
    code: 200
    input: []
    output: EvidenceArtifact
    side_effects: ["computes coverage_gap_days", "increments artifact.version by 1"]
  - method: POST
    path: /vsa/vendors/{vid}/cycles/{cid}/evidence/{id}/reject
    description: "Reject artifact; auto-creates HIGH exception"
    roles: [RiskAnalyst]
    code: 200
    input: []
    output: EvidenceArtifact
    side_effects: ["creates ExceptionFinding(EVIDENCE, HIGH, OPEN)", "increments artifact.version and cycle.version by 1"]

  # --- flat exceptions read surface (reverse reachability for ExceptionFinding.evidence_artifact_id) ---
  - method: GET
    path: /vsa/exceptions/{id}
    description: "Get a single exception finding by id"
    roles: [RiskAnalyst, SecurityApprover, VendorContact]
    code: 200
    input: []
    output: ExceptionFinding
    side_effects: []
  - method: GET
    path: /vsa/exceptions
    description: "Flat filtered list of exception findings across cycles"
    roles: [RiskAnalyst, SecurityApprover, VendorContact]
    code: 200
    input: ["limit?", "offset?", "status?", "severity?", "evidence_artifact_id?", "cycle_id?"]
    output: ExceptionFinding[]
    side_effects: []

  # --- exceptions ---
  - method: POST
    path: /vsa/vendors/{vid}/cycles/{cid}/exceptions
    description: "Create exception finding"
    roles: [RiskAnalyst]
    code: 201
    input: [source, severity, description, "evidence_artifact_id?"]
    output: ExceptionFinding
    side_effects: ["cycle.open_exception_count += 1", "increments cycle.version by 1"]
  - method: POST
    path: /vsa/vendors/{vid}/cycles/{cid}/exceptions/{id}/mark-false-positive
    description: "Close exception as false positive"
    roles: [RiskAnalyst]
    code: 200
    input: [closure_reason]
    output: ExceptionFinding
    side_effects: ["cycle.open_exception_count -= 1", "increments cycle.version by 1"]

  # --- remediation plans ---
  - method: POST
    path: /vsa/vendors/{vid}/cycles/{cid}/remediation-plans
    description: "Propose remediation plan covering OPEN exceptions"
    roles: [RiskAnalyst]
    code: 201
    input: [exception_ids, tasks]
    output: RemediationPlan
    side_effects: []
  - method: POST
    path: /vsa/vendors/{vid}/cycles/{cid}/remediation-plans/{id}/accept
    description: "Accept plan; linked exceptions -> IN_REMEDIATION"
    roles: [RiskAnalyst]
    code: 200
    input: []
    output: RemediationPlan
    side_effects: ["sets approved_by", "linked exceptions -> IN_REMEDIATION", "increments plan.version by 1"]
  - method: POST
    path: /vsa/vendors/{vid}/cycles/{cid}/remediation-plans/{id}/reject
    description: "Reject PROPOSED plan"
    roles: [RiskAnalyst]
    code: 200
    input: []
    output: RemediationPlan
    side_effects: ["increments plan.version by 1"]
  - method: POST
    path: /vsa/vendors/{vid}/cycles/{cid}/remediation-plans/{id}/progress
    description: "Vendor reports task progress"
    roles: [VendorContact]
    code: 200
    input: [completed_task_keys]
    output: RemediationPlan
    side_effects: ["plan ACCEPTED -> IN_PROGRESS or -> COMPLETED", "increments plan.version by 1"]
  - method: POST
    path: /vsa/vendors/{vid}/cycles/{cid}/remediation-plans/{id}/verify
    description: "Verify (or reject) completed plan; verifier != plan approver"
    roles: [RiskAnalyst]
    code: 200
    input: ["reject?"]
    output: RemediationPlan
    side_effects: ["VERIFIED: linked exceptions -> CLOSED_REMEDIATED, open_exception_count decremented", "REJECTED: linked exceptions -> OPEN (compensation)", "increments plan.version and cycle.version by 1"]

  # --- risk acceptances ---
  - method: POST
    path: /vsa/vendors/{vid}/cycles/{cid}/risk-acceptances
    description: "Request risk acceptance over exceptions"
    roles: [RiskAnalyst]
    code: 201
    input: [exception_ids, justification, compensating_controls, expires_at]
    output: RiskAcceptance
    side_effects: []
  - method: POST
    path: /vsa/vendors/{vid}/cycles/{cid}/risk-acceptances/{id}/approve
    description: "Approve risk acceptance; OCC-guarded on cycle; SoD vs requester"
    roles: [SecurityApprover]
    code: 200
    input: [expected_cycle_version]
    output: RiskAcceptance
    side_effects: ["referenced exceptions -> CLOSED_ACCEPTED", "cycle.open_exception_count decremented", "cycle.acceptance_required = true", "increments cycle.version by 1"]
  - method: POST
    path: /vsa/vendors/{vid}/cycles/{cid}/risk-acceptances/{id}/reject
    description: "Reject risk acceptance"
    roles: [SecurityApprover]
    code: 200
    input: []
    output: RiskAcceptance
    side_effects: ["increments acceptance.version by 1"]

  # --- contract addenda ---
  - method: GET
    path: /vsa/vendors/{id}/addenda
    description: "List addenda for vendor"
    roles: [RiskAnalyst, SecurityApprover, VendorContact]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: ContractAddendum[]
    side_effects: []
  - method: GET
    path: /vsa/cycles/{id}/addenda
    description: "List addenda generated by a cycle (reverse reachability for ContractAddendum.cycle_id)"
    roles: [RiskAnalyst, SecurityApprover, VendorContact]
    code: 200
    input: ["limit?", "offset?"]
    output: ContractAddendum[]
    side_effects: []
  - method: POST
    path: /vsa/vendors/{id}/addenda/{aid}/draft
    description: "Draft a REQUIRED addendum"
    roles: [RiskAnalyst]
    code: 200
    input: []
    output: ContractAddendum
    side_effects: ["increments addendum.version by 1"]
  - method: POST
    path: /vsa/vendors/{id}/addenda/{aid}/sign
    description: "Vendor signs addendum"
    roles: [VendorContact]
    code: 200
    input: [signed_at]
    output: ContractAddendum
    side_effects: ["increments addendum.version by 1"]
  - method: POST
    path: /vsa/vendors/{id}/addenda/{aid}/waive
    description: "Waive addendum"
    roles: [SecurityApprover]
    code: 200
    input: [waived_reason]
    output: ContractAddendum
    side_effects: ["increments addendum.version by 1"]

  # --- monitoring alerts ---
  - method: POST
    path: /vsa/vendors/{id}/monitoring-alerts
    description: "Record monitoring alert"
    roles: [PlatformAdmin]
    code: 201
    input: [signal, severity, detected_at]
    output: MonitoringAlert
    side_effects: ["runs vendor_risk_score", "increments vendor.version by 1"]
  - method: GET
    path: /vsa/vendors/{id}/monitoring-alerts
    description: "List alerts for vendor"
    roles: [RiskAnalyst, SecurityApprover, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: MonitoringAlert[]
    side_effects: []
  - method: POST
    path: /vsa/vendors/{id}/monitoring-alerts/{aid}/acknowledge
    description: "Acknowledge alert"
    roles: [RiskAnalyst]
    code: 200
    input: ["disposition?"]
    output: MonitoringAlert
    side_effects: ["increments alert.version by 1"]
  - method: POST
    path: /vsa/vendors/{id}/monitoring-alerts/{aid}/dismiss
    description: "Dismiss alert"
    roles: [RiskAnalyst]
    code: 200
    input: [disposition]
    output: MonitoringAlert
    side_effects: ["runs vendor_risk_score", "increments alert.version and vendor.version by 1"]
  - method: POST
    path: /vsa/vendors/{id}/monitoring-alerts/{aid}/escalate
    description: "Escalate alert; pulls reassessment forward and opens new cycle"
    roles: [RiskAnalyst]
    code: 200
    input: ["disposition?"]
    output: MonitoringAlert
    side_effects: ["pulls next_reassessment_due forward", "appends ReassessmentSchedule", "creates new DRAFT cycle as active", "vendor.posture -> ASSESSING", "increments alert.version and vendor.version by 1"]

  # --- subprocessors ---
  - method: POST
    path: /vsa/vendors/{id}/subprocessors
    description: "Disclose subprocessor"
    roles: [VendorContact]
    code: 201
    input: [subprocessor_name, data_categories, region]
    output: SubprocessorDisclosure
    side_effects: []
  - method: GET
    path: /vsa/vendors/{id}/subprocessors
    description: "List subprocessor disclosures"
    roles: [RiskAnalyst, SecurityApprover, VendorContact]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: SubprocessorDisclosure[]
    side_effects: []
  - method: POST
    path: /vsa/vendors/{id}/subprocessors/{sid}/start-review
    description: "Start review"
    roles: [RiskAnalyst]
    code: 200
    input: []
    output: SubprocessorDisclosure
    side_effects: ["increments disclosure.version by 1"]
  - method: POST
    path: /vsa/vendors/{id}/subprocessors/{sid}/approve
    description: "Approve subprocessor; SoD vs review starter"
    roles: [SecurityApprover]
    code: 200
    input: []
    output: SubprocessorDisclosure
    side_effects: ["sets decided_by", "increments disclosure.version by 1"]
  - method: POST
    path: /vsa/vendors/{id}/subprocessors/{sid}/reject
    description: "Reject subprocessor"
    roles: [SecurityApprover]
    code: 200
    input: []
    output: SubprocessorDisclosure
    side_effects: ["sets decided_by", "increments disclosure.version by 1"]
  - method: POST
    path: /vsa/vendors/{id}/subprocessors/{sid}/withdraw
    description: "Withdraw disclosure"
    roles: [VendorContact]
    code: 200
    input: []
    output: SubprocessorDisclosure
    side_effects: ["increments disclosure.version by 1"]

  # --- offboarding attestations ---
  - method: GET
    path: /vsa/vendors/{id}/offboarding-attestations
    description: "List attestations for vendor"
    roles: [RiskAnalyst, SecurityApprover, VendorContact]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: OffboardingAttestation[]
    side_effects: []
  - method: POST
    path: /vsa/vendors/{id}/offboarding-attestations/{aid}/submit
    description: "Vendor submits attestation"
    roles: [VendorContact]
    code: 200
    input: [data_returned, data_destroyed, "destruction_method?", attested_by]
    output: OffboardingAttestation
    side_effects: ["sets submitted_at", "increments attestation.version by 1"]
  - method: POST
    path: /vsa/vendors/{id}/offboarding-attestations/{aid}/verify
    description: "Verify attestation; vendor -> OFFBOARDED"
    roles: [RiskAnalyst]
    code: 200
    input: []
    output: OffboardingAttestation
    side_effects: ["vendor.posture -> OFFBOARDED", "increments attestation.version and vendor.version by 1"]
  - method: POST
    path: /vsa/vendors/{id}/offboarding-attestations/{aid}/reject
    description: "Reject attestation; creates fresh REQUESTED attestation"
    roles: [RiskAnalyst]
    code: 200
    input: []
    output: OffboardingAttestation
    side_effects: ["creates new REQUESTED attestation", "extends offboarding_deadline by 30 days", "increments vendor.version by 1"]

  # --- reassessment schedule (audit log) ---
  - method: GET
    path: /vsa/vendors/{id}/reassessment-schedule
    description: "List reassessment schedule events for vendor"
    roles: [RiskAnalyst, SecurityApprover, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "kind?"]
    output: ReassessmentSchedule[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource does not exist (vendor, cycle, child)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state permitting the requested transition" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Schema/enum/required-field violation (item_key unknown, destruction_method missing, bad enum)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "Same X-User-ID attempted both halves of a gated pair (requester/approver, acceptor/verifier, review-starter/approver, evidence-completer/cycle-approver)" }
  - { id: ERR_STALE_VENDOR_VERSION, http: 412, condition: "expected_vendor_version mismatch on cycle creation (OCC)" }
  - { id: ERR_STALE_CYCLE_VERSION, http: 412, condition: "expected_cycle_version mismatch on risk-acceptance approval (OCC)" }
  - { id: ERR_STALE_VERSION, http: 422, condition: "Generic stale-write guard where a specific OCC error is not declared" }
  - { id: ERR_DEADLINE_PASSED, http: 422, condition: "Action attempted after its deadline (response_due_at, offboarding_deadline, acceptance expires_at in past)" }
  - { id: ERR_CYCLE_ALREADY_ACTIVE, http: 409, condition: "Vendor already has a non-terminal AssessmentCycle" }
  - { id: ERR_UNIQUENESS_VIOLATION, http: 409, condition: "Unique-constraint breach (active tier policy, primary contact, active cycle)" }
  - { id: ERR_TEMPLATE_NOT_PUBLISHED, http: 422, condition: "Cycle issuance against a template not in PUBLISHED state" }
  - { id: ERR_TEMPLATE_IN_USE, http: 409, condition: "Retire attempted while non-terminal cycles reference the template" }
  - { id: ERR_RESPONSE_INCOMPLETE, http: 422, condition: "Submission missing answers for pinned template items without na_justification" }
  - { id: ERR_SCORE_BELOW_THRESHOLD, http: 422, condition: "Score below tier pass threshold where the endpoint demands a pass (clean approval path)" }
  - { id: ERR_OPEN_ITEMS_OUTSTANDING, http: 422, condition: "Cycle approval blocked by open exceptions, undecided acceptances, or outstanding addenda" }
  - { id: ERR_REFERENTIAL_INTEGRITY, http: 422, condition: "Referenced child ids do not exist, do not belong to the path parent, or are in the wrong state" }
  - { id: ERR_PLAN_TASKS_INCOMPLETE, http: 422, condition: "Verification attempted while completed_task_keys != full task key set" }
  - { id: ERR_EVIDENCE_COVERAGE_INVALID, http: 422, condition: "period_end <= period_start, or coverage_gap_days > 180 on completion" }
  - { id: ERR_EVIDENCE_PENDING_REVIEW, http: 422, condition: "evidence-review/complete attempted while some artifact still in {RECEIVED, UNDER_REVIEW}" }
  - { id: ERR_ACCEPTANCE_EXPIRED, http: 422, condition: "Decision attempted on a RiskAcceptance whose expires_at has passed" }
  - { id: ERR_VENDOR_POSTURE_BLOCKS, http: 422, condition: "Vendor posture does not permit the operation (e.g., subprocessor approval while SUSPENDED/OFFBOARDING, cycle creation while OFFBOARDED)" }
  - { id: ERR_ATTESTATION_INCOMPLETE, http: 422, condition: "Attestation submitted with data_returned=false and data_destroyed=false" }
  - { id: ERR_ALERT_NOT_ESCALATABLE, http: 422, condition: "Escalation requires severity in {HIGH, CRITICAL} and vendor posture in {APPROVED, CONDITIONAL}" }
  - { id: ERR_ADDENDUM_OUTSTANDING, http: 422, condition: "Cycle approval blocked by REQUIRED or DRAFTED ContractAddendum" }
  - { id: ERR_OFFBOARDING_BLOCKED, http: 422, condition: "Verify attestation while vendor has non-terminal cycle or unresolved alerts" }
  - { id: ERR_PAGINATION_INVALID, http: 422, condition: "limit/offset outside envelope bounds" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operational administrator; owns tier policies, monitoring alert ingestion, and the logical clock"
    identity: "opaque"
    exclusive_operations: ["POST /vsa/tier-policies", "POST /vsa/_clock/set_current_utc", "POST /vsa/vendors/{id}/monitoring-alerts"]
    shared_operations: ["GET endpoints"]
  - name: RiskAnalyst
    description: "Third-party security risk analyst; drives assessments, scoring, evidence review, remediation verification"
    identity: "opaque"
    exclusive_operations: ["vendor CRUD", "template CRUD/publish/retire/revise", "cycle issue/score/evidence-review/remediation-resolve", "exception create/mark-false-positive", "remediation-plan propose/accept/reject/verify", "risk-acceptance request", "addendum draft", "alert acknowledge/dismiss/escalate", "subprocessor start-review", "offboard", "attestation verify/reject"]
    shared_operations: ["GET endpoints"]
  - name: SecurityApprover
    description: "Senior security approver; decides risk acceptances, cycle approval, subprocessor approval, addendum waivers; segregated from RiskAnalyst actions"
    identity: "opaque"
    exclusive_operations: ["cycle approve/reject", "risk-acceptance approve/reject", "subprocessor approve/reject", "addendum waive"]
    shared_operations: ["GET endpoints"]
  - name: VendorContact
    description: "Vendor-side respondent; submits questionnaire responses, evidence, remediation progress, subprocessor disclosures, addendum signatures, offboarding attestations"
    identity: "entity_backed:VendorContact"
    exclusive_operations: ["response create/submit", "evidence upload", "remediation progress", "subprocessor disclose/withdraw", "addendum sign", "attestation submit"]
    shared_operations: ["GET endpoints scoped to own vendor"]
