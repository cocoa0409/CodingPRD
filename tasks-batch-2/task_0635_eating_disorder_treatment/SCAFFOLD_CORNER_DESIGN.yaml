  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_correct_patient_version_finalize_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[assessment-finalize-stale-patient]
          - state_machines.Assessment.DRAFT_to_FINALIZED
        distinguishing_aspect: "Finalize with expected_patient_version matching the patient's current version (1) succeeds: assessment -> FINALIZED, Patient.version -> 2, active_assessment_id set."
        test_recipe:
          setup: ["A DRAFT assessment on a patient at version 1."]
          setup_api_calls:
            - call: "POST /edt/facilities"
              payload: { name: "Cedar EDT" }
              as: Admin
              captures: { fid: $.data.id }
            - call: "POST /edt/patients"
              payload: { facility_id: "${fid}", full_name: "Pat LL", age_band: "ADULT", bmi: 17.0 }
              as: Intake
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /edt/assessments"
              payload: { patient_id: "${pid}", facility_id: "${fid}", medical_severity: 5, behavioral_severity: 5, psychiatric_severity: 4, motivation_level: 6 }
              as: Clinician
              captures: { asid: $.data.id }
          trigger:
            - call: "POST /edt/assessments/${asid}/finalize"
              payload: { expected_patient_version: "${pv}" }
              as: Clinician
          assert:
            - "Assessment.${asid}.status == FINALIZED"
            - "Patient.${pid}.version == 2"
            - "Patient.${pid}.active_assessment_id == ${asid}"

      - name: occ_stale_patient_version_finalize_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[assessment-finalize-stale-patient]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "After one finalize bumps Patient.version to 2, a second finalize on a new DRAFT assessment carrying the stale version (${pv0}=1) is rejected ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A patient whose version was advanced to 2 by a first finalize; a second DRAFT assessment exists."]
          setup_api_calls:
            - call: "POST /edt/facilities"
              payload: { name: "Cedar EDT" }
              as: Admin
              captures: { fid: $.data.id }
            - call: "POST /edt/patients"
              payload: { facility_id: "${fid}", full_name: "Pat MM", age_band: "ADULT", bmi: 17.0 }
              as: Intake
              captures: { pid: $.data.id, pv0: $.data.version }
            - call: "POST /edt/assessments"
              payload: { patient_id: "${pid}", facility_id: "${fid}", medical_severity: 5, behavioral_severity: 5, psychiatric_severity: 4, motivation_level: 6 }
              as: Clinician
              captures: { asid1: $.data.id }
            - call: "POST /edt/assessments/${asid1}/finalize"
              payload: { expected_patient_version: "${pv0}" }
              as: Clinician
            - call: "POST /edt/assessments"
              payload: { patient_id: "${pid}", facility_id: "${fid}", medical_severity: 6, behavioral_severity: 6, psychiatric_severity: 5, motivation_level: 5 }
              as: Clinician
              captures: { asid2: $.data.id }
          trigger:
            - call: "POST /edt/assessments/${asid2}/finalize"
              payload: { expected_patient_version: "${pv0}" }
              as: Clinician
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"
            - "Assessment.${asid2}.status == DRAFT"

      - name: occ_treatment_plan_revise_stale_admission_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[treatment-plan-revise-stale-admission]
          - errors[ERR_STALE_VERSION]
          - state_machines.TreatmentPlan.ACTIVE_to_REVISION
        distinguishing_aspect: "Revising an ACTIVE plan with an Admission.version one less than current (${av} - 1) is rejected ERR_STALE_VERSION (412); the plan stays ACTIVE."
        test_recipe:
          setup: ["An ADMITTED admission with an ACTIVE treatment plan; admission version captured at admission creation."]
          setup_api_calls:
            - call: "POST /edt/facilities"
              payload: { name: "Cedar EDT" }
              as: Admin
              captures: { fid: $.data.id }
            - call: "POST /edt/programs"
              payload: { facility_id: "${fid}", level_of_care: "RESIDENTIAL", bed_capacity: 5 }
              as: Admin
              captures: { pgid: $.data.id }
            - call: "POST /edt/cohorts"
              payload: { program_id: "${pgid}", facility_id: "${fid}", name: "Adult AM", age_band: "ADULT", slot_capacity: 5 }
              as: Admin
              captures: { cid: $.data.id }
            - call: "POST /edt/patients"
              payload: { facility_id: "${fid}", full_name: "Pat NN", age_band: "ADULT", bmi: 17.0 }
              as: Intake
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /edt/assessments"
              payload: { patient_id: "${pid}", facility_id: "${fid}", medical_severity: 5, behavioral_severity: 5, psychiatric_severity: 4, motivation_level: 6 }
              as: Clinician
              captures: { asid: $.data.id }
            - call: "POST /edt/assessments/${asid}/finalize"
              payload: { expected_patient_version: "${pv}" }
              as: Clinician
            - call: "POST /edt/admissions"
              payload: { patient_id: "${pid}", facility_id: "${fid}", program_id: "${pgid}", cohort_id: "${cid}", requested_length_of_stay_days: 14 }
              as: Intake
              captures: { aid: $.data.id, av: $.data.version }
            - call: "POST /edt/authorizations"
              payload: { admission_id: "${aid}", facility_id: "${fid}", payer_name: "BlueCo", daily_rate_cents: 100000, coinsurance_pct: 0.20 }
              as: UtilizationReviewer
              captures: { authid: $.data.id }
            - call: "POST /edt/reviews"
              payload: { authorization_id: "${authid}", facility_id: "${fid}", decision: "APPROVE", window_start_iso: "2026-01-01T00:00:00Z", window_end_iso: "2026-01-15T00:00:00Z" }
              as: UtilizationReviewer
            - call: "POST /edt/admissions/${aid}/promote"
              as: Intake
            - call: "POST /edt/admissions/${aid}/admit"
              as: Intake
            - call: "POST /edt/treatment-plans"
              payload: { admission_id: "${aid}", facility_id: "${fid}", goals_total: 3 }
              as: Clinician
              captures: { tpid: $.data.id }
            - call: "POST /edt/treatment-plans/${tpid}/sign"
              payload: { discipline: "THERAPY" }
              as: Clinician
            - call: "POST /edt/treatment-plans/${tpid}/sign"
              payload: { discipline: "MEDICAL" }
              as: Clinician
            - call: "POST /edt/treatment-plans/${tpid}/sign"
              payload: { discipline: "DIETITIAN" }
              as: Dietitian
            - call: "POST /edt/treatment-plans/${tpid}/activate"
              as: Clinician
          trigger:
            - call: "POST /edt/treatment-plans/${tpid}/revise"
              payload: { expected_admission_version: "${av} - 1" }
              as: Clinician
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"
            - "TreatmentPlan.${tpid}.status == ACTIVE"

      - name: waitlist_promotion_cascade_on_discharge_from_full_program
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Admission.DISCHARGE_PENDING_to_DISCHARGED
          - state_machines.Admission.WAITLISTED_to_PENDING_ADMISSION
          - entities.Admission.fields.waitlist_promoted
        distinguishing_aspect: "Discharging the sole occupant of a capacity-1 program (posture flips FULL->OPEN) auto-promotes the earliest WAITLISTED admission in that program to PENDING_ADMISSION with waitlist_promoted=true."
        test_recipe:
          setup: ["Capacity-1 program full with admission X (ready to discharge) and a WAITLISTED admission Y in the same program."]
          setup_api_calls:
            - call: "POST /edt/facilities"
