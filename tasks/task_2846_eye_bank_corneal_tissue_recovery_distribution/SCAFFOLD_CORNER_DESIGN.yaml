      - name: a_stale_expected_donor_version_on_the_second_serology_panel_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[serology-panel-create-stale-donor]"
          - "errors[ERR_STALE_DONOR_VERSION]"
          - "endpoints[POST /eye-bank/donors/{id}/serology-panels]"
        distinguishing_aspect: |
          Donor.version advances on the screening record, on consent and again on the first panel, so
          the version the lab captured at consent time is two writes behind by the time a second
          specimen is drawn. Re-drawing with that captured value must return 412
          ERR_STALE_DONOR_VERSION — which is exactly the write that would otherwise silently
          INVALIDATE a panel the lab never saw — while the value echoed from the first panel's
          donor_version_after succeeds.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z"
            - "one CONSENTED donor whose version is 3 after referral, screening and consent"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
