  - rule_id: compensating_invariant
    instances:
      - name: failed_payout_reversal_restores_ledger_and_fund_credit_exactly
        conserved_quantity: "Creator.ledger_balance_cents, and separately Creator.fund_credit_balance_cents"
        invariant_formula: |
          I1: Creator.ledger_balance_cents == SUM(LedgerEntry.amount_cents) over all
              of that creator's entries, at every observable point.
          I1b: for one payout that is created and then FAILS,
              PAYOUT_DEBIT + PAYOUT_FEE + PAYOUT_REVERSAL == 0, i.e.
              (-amount_cents) + (-fee_cents) + (amount_cents + fee_cents) == 0,
              so ledger_balance_cents returns to its exact pre-payout value.
          I1c: fund_credit_balance_cents is decremented by fund_credit_cents on
              payout creation and incremented by the same fund_credit_cents on
              reversal, so it also returns to its exact pre-payout value.
        grounds:
          - entities.Creator.fields.ledger_balance_cents
          - entities.Creator.fields.fund_credit_balance_cents
          - entities.Payout.fields.fund_credit_cents
          - entities.Payout.fields.fee_cents
          - entities.Payout.fields.amount_cents
          - entities.LedgerEntry.fields.entry_type
          - entities.LedgerEntry.fields.amount_cents
          - "state_machines.Payout.transitions[PROCESSING -> FAILED]"
          - calculations.payout_fee_and_amount
          - calculations.creator_balance_projection
        distinguishing_aspect: |
          The failure path must be a perfect compensating transaction across TWO
          independently tracked pools at once. A payout is funded from a mixture
          of statement payable (20000) and disbursed fund credit (5000), so
          creation writes a PAYOUT_DEBIT of -24800 plus a PAYOUT_FEE of -200 AND
          zeroes fund_credit_balance_cents. The single PAYOUT_REVERSAL on failure
          must be +25000 - the fee INCLUDED, not just the amount - and must
          simultaneously hand the 5000 of fund credit back to
          fund_credit_balance_cents rather than folding it into the ledger twice.
          An implementation that reverses only amount_cents leaves the creator
          200 short; one that credits the fund portion to both pools leaves
          available_balance_cents 5000 too high. Both errors are visible only
          because the pre-payout and post-failure balances are compared exactly.
        test_recipe:
          setup:
            - "One US Creator, payout_method BANK_TRANSFER (default payout_threshold_cents 10000), follower_count 10000, watch_time_minutes_365d 240000, evaluated ELIGIBLE, with a VERIFIED W9 TaxProfile (tin_provided true) so the resolved withholding rate is 0 bps and net_payable_cents == creator_share_cents."
            - "One TIPS RevenueProduct (5000/5000, min_payable_cents 0); one event of gross 40000 in period 2026-07 gives creator_share_cents 20000."
            - "Period 2026-07 is CLOSED and its single statement FINALIZED with withholding_cents 0 and net_payable_cents 20000, so statement_payable_cents == 20000 and ledger holds ACCRUAL +20000."
            - "One CreatorFund on the CLOSED 2026-07 period: total_pool_cents 5000, PRO_RATA_WATCH_TIME, min_watch_time_minutes 0, allocated then DISBURSED, giving the sole candidate the whole pool: FUND_CREDIT +5000 and fund_credit_balance_cents 5000."
            - "Pre-payout snapshot: ledger_balance_cents 25000, fund_credit_balance_cents 5000, available_balance_cents 20000 + 5000 - 0 == 25000."
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Hal Rev", country_code: "US", follower_count: 10000, watch_time_minutes_365d: 240000, payout_method: "BANK_TRANSFER" }
              as: PlatformAdmin
              captures: { cr_id: "$.data.id" }
            - call: "POST /monetization/creators/${cr_id}/evaluate"
              payload: {}
              as: FinanceOperator
              captures: { cr_v2: "$.data.version" }
            - call: "POST /monetization/tax-profiles"
              payload: { creator_id: "${cr_id}", form_type: "W9", country_code: "US", tin_provided: true, treaty_claimed: false, expected_creator_version: "${cr_v2}" }
              as: FinanceOperator
              captures: { tp_id: "$.data.id" }
            - call: "POST /monetization/tax-profiles/${tp_id}/submit"
              payload: {}
              as: Creator
              as_user_id: "${cr_id}"
            - call: "POST /monetization/tax-profiles/${tp_id}/verify"
              payload: { decision: "VERIFY" }
              as: FinanceOperator
            - call: "POST /monetization/revenue-products"
              payload: { product_type: "TIPS", name: "Tips Flat", creator_share_bps: 5000, platform_fee_bps: 5000, min_payable_cents: 0 }
              as: PlatformAdmin
              captures: { tips_id: "$.data.id" }
            - call: "POST /monetization/earnings-periods"
              payload: { label: "2026-07", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { p1_id: "$.data.id" }
            - call: "POST /monetization/revenue-events"
              payload: { creator_id: "${cr_id}", product_id: "${tips_id}", gross_amount_cents: 40000, occurred_at: "2026-07-05T00:00:00Z" }
              as: FinanceOperator
            - call: "POST /monetization/earnings-periods/${p1_id}/close"
              payload: {}
              as: FinanceOperator
            - call: "GET /monetization/earnings-statements"
              payload: { creator_id: "${cr_id}", period_id: "${p1_id}" }
              as: FinanceOperator
              captures: { s1_id: "$.data[0].id" }
            - call: "POST /monetization/earnings-statements/${s1_id}/finalize"
              payload: {}
              as: FinanceOperator
            - call: "POST /monetization/creator-funds"
              payload: { name: "July Bonus", period_id: "${p1_id}", total_pool_cents: 5000, methodology: "PRO_RATA_WATCH_TIME", min_watch_time_minutes: 0 }
              as: PlatformAdmin
              captures: { f1_id: "$.data.id", f1_v1: "$.data.version" }
            - call: "POST /monetization/creator-funds/${f1_id}/allocate"
              payload: { expected_fund_version: "${f1_v1}" }
              as: PlatformAdmin
              captures: { f1_alloc: "$.data.allocated_cents", f1_rem: "$.data.unallocated_remainder_cents" }
            - call: "POST /monetization/creator-funds/${f1_id}/disburse"
              payload: {}
              as: FinanceOperator
              captures: { f1_status: "$.data.status" }
            - call: "GET /monetization/creators/${cr_id}"
              payload: {}
              as: FinanceOperator
              captures: { pre_ledger: "$.data.ledger_balance_cents", pre_credit: "$.data.fund_credit_balance_cents", pre_avail: "$.data.available_balance_cents", pre_stmt: "$.data.statement_payable_cents" }
          trigger:
            - call: "POST /monetization/payouts"
              payload: { creator_id: "${cr_id}" }
              as: FinanceOperator
              captures: { po_id: "$.data.id", po_payable: "$.data.payable_before_fee_cents", po_fee: "$.data.fee_cents", po_amount: "$.data.amount_cents", po_fund: "$.data.fund_credit_cents" }
            - call: "GET /monetization/creators/${cr_id}"
              payload: {}
              as: FinanceOperator
              captures: { mid_ledger: "$.data.ledger_balance_cents", mid_credit: "$.data.fund_credit_balance_cents", mid_avail: "$.data.available_balance_cents" }
            - call: "POST /monetization/payouts/${po_id}/submit"
              payload: {}
              as: FinanceOperator
            - call: "POST /monetization/payouts/${po_id}/record-settlement"
              payload: { outcome: "FAILED", failure_code: "BANK_REJECTED" }
              as: FinanceOperator
              captures: { po_state: "$.data.state", po_retries: "$.data.retry_count" }
            - call: "GET /monetization/creators/${cr_id}"
              payload: {}
              as: FinanceOperator
              captures: { post_ledger: "$.data.ledger_balance_cents", post_credit: "$.data.fund_credit_balance_cents", post_avail: "$.data.available_balance_cents", post_stmt: "$.data.statement_payable_cents", post_state: "$.data.payout_state", post_fails: "$.data.consecutive_payment_failures" }
          assert:
            - "${f1_alloc} == 5000 and ${f1_rem} == 0 and ${f1_status} == DISBURSED"
            - "${pre_ledger} == 25000 and ${pre_credit} == 5000 and ${pre_avail} == 25000 and ${pre_stmt} == 20000"
            - "${po_payable} == 25000 and ${po_fund} == 5000"
            - "${po_fee} == 200 (BANK_TRANSFER: 200 + ceil(25000*0/10000) == 200; volume tier T1 mult 10000 leaves 200; cap 1500 not binding; 200 < 25000)"
            - "${po_amount} == 24800"
            - "${mid_ledger} == 0 and ${mid_credit} == 0 and ${mid_avail} == 0"
            - "${po_state} == FAILED and ${po_retries} == 0 (0 < MAX_PAYOUT_RETRIES 2, so FAILED not ABANDONED)"
            - "${post_ledger} == 25000 - exactly ${pre_ledger}, so PAYOUT_DEBIT -24800 + PAYOUT_FEE -200 + PAYOUT_REVERSAL +25000 == 0"
            - "${post_credit} == 5000 - exactly ${pre_credit}, the fund credit is returned to its own pool and not double-counted"
            - "${post_avail} == 25000 and ${post_stmt} == 20000 (the statement was detached back to FINALIZED)"
            - "${post_state} == ACCRUING and ${post_fails} == 1"
            - "GET /monetization/creators/${cr_id}/ledger-entries returns total_count 5 with amounts summing to 25000: ACCRUAL +20000, FUND_CREDIT +5000, PAYOUT_DEBIT -24800, PAYOUT_FEE -200, PAYOUT_REVERSAL +25000"
            - "GET /monetization/creators/${cr_id}/ledger-entries?entry_type=PAYOUT_REVERSAL returns exactly one row with amount_cents == 25000 (NOT 24800)"
            - "EarningsStatement.${s1_id}.status == FINALIZED and payout_id == null"

      - name: fund_pool_conserved_across_allocate_supersede_and_void
        conserved_quantity: "CreatorFund.total_pool_cents, partitioned into allocated_cents + unallocated_remainder_cents"
        invariant_formula: |
          I2: CreatorFund.allocated_cents + CreatorFund.unallocated_remainder_cents
              == CreatorFund.total_pool_cents, after every allocate, supersede
              re-allocate and void-allocations call, with no drift.
          I2b: CreatorFund.allocated_cents == SUM(FundAllocation.amount_cents) over
              that fund's ACTIVE allocations only (VOIDED rows must be excluded
              from the sum but must remain on record).
          I2c: after void-allocations there are zero ACTIVE rows, so
              allocated_cents == 0 and unallocated_remainder_cents ==
              total_pool_cents.
        grounds:
          - entities.CreatorFund.fields.total_pool_cents
          - entities.CreatorFund.fields.allocated_cents
          - entities.CreatorFund.fields.unallocated_remainder_cents
          - entities.CreatorFund.fields.allocation_run_count
          - entities.FundAllocation.fields.amount_cents
          - entities.FundAllocation.fields.status
          - entities.FundAllocation.fields.void_reason
          - calculations.fund_allocation
          - "endpoints.POST /monetization/creator-funds/{fund_id}/allocate"
          - "endpoints.POST /monetization/creator-funds/{fund_id}/void-allocations"
          - concurrency_rules.fund-allocate-stale-fund
        distinguishing_aspect: |
          A DIFFERENT conserved quantity from I1 - a fixed pool being partitioned
          rather than a balance being moved - and the hard part is that the
          partition must survive being computed THREE times over a changing
          candidate set. Run 1 divides 100000 by watch times 500000/300000/200000
          and lands on 50000/30000/20000 with remainder 0. Correcting one
          creator's watch time to 400000 and re-allocating makes the floors sum
          to 99999, so the single leftover cent must be pushed to the
          highest-watch-time creator (41667, not 41666) or the invariant breaks
          by one cent. Voiding then has to zero allocated_cents while leaving all
          six historical rows queryable, which forbids the natural
          implementation of recomputing allocated_cents from every row rather
          than from ACTIVE rows only.
        test_recipe:
          setup:
            - "Three GB Creators, all evaluated to ELIGIBLE, with watch_time_minutes_365d 500000 (c1), 300000 (c2) and 200000 (c3) and follower_count 10000 each; none has a TaxProfile, none is under investigation."
            - "One OPEN EarningsPeriod [2026-07-01T00:00:00Z, 2026-08-01T00:00:00Z) and no revenue events (fund allocation depends on watch time, not on accruals)."
            - "One CreatorFund on that period: total_pool_cents 100000, methodology PRO_RATA_WATCH_TIME, min_watch_time_minutes 0, max_allocation_cents left at its 2000000 default so no cap can bind; status ALLOCATABLE, allocated_cents 0, unallocated_remainder_cents 100000, version v1."
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Ida Pool", country_code: "GB", follower_count: 10000, watch_time_minutes_365d: 500000 }
              as: PlatformAdmin
              captures: { c1_id: "$.data.id" }
            - call: "POST /monetization/creators"
              payload: { display_name: "Jon Pool", country_code: "GB", follower_count: 10000, watch_time_minutes_365d: 300000 }
              as: PlatformAdmin
              captures: { c2_id: "$.data.id" }
            - call: "POST /monetization/creators"
              payload: { display_name: "Kim Pool", country_code: "GB", follower_count: 10000, watch_time_minutes_365d: 200000 }
              as: PlatformAdmin
              captures: { c3_id: "$.data.id" }
            - call: "POST /monetization/creators/${c1_id}/evaluate"
              payload: {}
              as: FinanceOperator
            - call: "POST /monetization/creators/${c2_id}/evaluate"
              payload: {}
              as: FinanceOperator
            - call: "POST /monetization/creators/${c3_id}/evaluate"
              payload: {}
              as: FinanceOperator
            - call: "POST /monetization/earnings-periods"
              payload: { label: "2026-07", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { p1_id: "$.data.id" }
            - call: "POST /monetization/creator-funds"
              payload: { name: "Q3 Creator Fund", period_id: "${p1_id}", total_pool_cents: 100000, methodology: "PRO_RATA_WATCH_TIME", min_watch_time_minutes: 0 }
              as: PlatformAdmin
              captures: { f_id: "$.data.id", f_v1: "$.data.version", f_pool: "$.data.total_pool_cents", f_rem0: "$.data.unallocated_remainder_cents", f_max: "$.data.max_allocation_cents" }
          trigger:
            - call: "POST /monetization/creator-funds/${f_id}/allocate"
              payload: { expected_fund_version: "${f_v1}" }
              as: PlatformAdmin
              captures: { r1_alloc: "$.data.allocated_cents", r1_rem: "$.data.unallocated_remainder_cents", r1_runs: "$.data.allocation_run_count", f_v2: "$.data.version" }
            - call: "GET /monetization/creator-funds/${f_id}/fund-allocations"
              payload: { status: "ACTIVE", creator_id: "${c1_id}" }
              as: PlatformAdmin
              captures: { a1_amount: "$.data[0].amount_cents", a1_rank: "$.data[0].rank" }
            - call: "PATCH /monetization/creators/${c3_id}/metrics"
              payload: { watch_time_minutes_365d: 400000 }
              as: PlatformAdmin
              captures: { c3_wt: "$.data.watch_time_minutes_365d" }
            - call: "POST /monetization/creator-funds/${f_id}/allocate"
              payload: { expected_fund_version: "${f_v2}" }
              as: PlatformAdmin
              captures: { r2_alloc: "$.data.allocated_cents", r2_rem: "$.data.unallocated_remainder_cents", r2_runs: "$.data.allocation_run_count", f_v3: "$.data.version" }
            - call: "GET /monetization/creator-funds/${f_id}/fund-allocations"
              payload: { status: "ACTIVE", creator_id: "${c1_id}" }
              as: PlatformAdmin
              captures: { a1b_amount: "$.data[0].amount_cents" }
            - call: "GET /monetization/creator-funds/${f_id}/fund-allocations"
              payload: { status: "VOIDED", creator_id: "${c1_id}" }
              as: PlatformAdmin
              captures: { a1v_reason: "$.data[0].void_reason" }
            - call: "POST /monetization/creator-funds/${f_id}/void-allocations"
              payload: { expected_fund_version: "${f_v3}", reason: "Programme cancelled by Finance." }
              as: PlatformAdmin
              captures: { r3_alloc: "$.data.allocated_cents", r3_rem: "$.data.unallocated_remainder_cents", r3_runs: "$.data.allocation_run_count", r3_status: "$.data.status", f_v4: "$.data.version" }
            - call: "POST /monetization/creator-funds/${f_id}/allocate"
              payload: { expected_fund_version: "${f_v3}" }
              as: PlatformAdmin
          assert:
            - "${f_pool} == 100000 and ${f_rem0} == 100000 and ${f_max} == 2000000"
            - "${r1_alloc} == 100000 and ${r1_rem} == 0 and ${r1_alloc} + ${r1_rem} == 100000 and ${r1_runs} == 1"
            - "run 1 ACTIVE rows are exactly 3: c1 50000, c2 30000, c3 20000 (floor(100000*wt/1000000), remainder 0 so no leftover pass)"
            - "${a1_amount} == 50000 and ${a1_rank} == 1"
            - "${c3_wt} == 400000 and Creator.${c3_id}.eligibility_status == ELIGIBLE (a metrics patch does not re-open review)"
            - "${r2_alloc} == 100000 and ${r2_rem} == 0 and ${r2_alloc} + ${r2_rem} == 100000 and ${r2_runs} == 2"
            - "run 2 ACTIVE rows are exactly 3: c1 41667, c3 33333, c2 25000 - the floors are 41666/33333/25000 summing to 99999, and the single leftover cent goes to the FundAllocation with rank 1 (c1, 500000 watch minutes)"
            - "${a1b_amount} == 41667 (NOT 41666: dropping the leftover cent would leave allocated_cents 99999 and break I2)"
            - "${a1v_reason} == SUPERSEDED_BY_REALLOCATION (run 1's rows are voided with the reserved reason, not with a caller-supplied one)"
            - "${r3_alloc} == 0 and ${r3_rem} == 100000 and ${r3_alloc} + ${r3_rem} == 100000"
            - "${r3_runs} == 2 and ${r3_status} == ALLOCATABLE (voiding is not an allocation run and does not retire the fund)"
            - "GET /monetization/creator-funds/${f_id}/fund-allocations?status=ACTIVE returns total_count 0"
            - "GET /monetization/creator-funds/${f_id}/fund-allocations?status=VOIDED returns total_count 6, three with void_reason SUPERSEDED_BY_REALLOCATION and three with void_reason 'Programme cancelled by Finance.'"
            - "GET /monetization/creator-funds/${f_id}/fund-allocations returns total_count 6 while allocated_cents is 0, proving allocated_cents sums ACTIVE rows only"
            - "trigger step 8 returns HTTP 409 with error_id ERR_STALE_FUND_VERSION (${f_v3} was consumed by void-allocations, which bumped the fund to ${f_v4})"
            - "GET /monetization/creators/${c1_id}/ledger-entries returns total_count 0 (allocation writes no FUND_CREDIT until disburse)"
            - "Creator.${c1_id}.fund_credit_balance_cents == 0 and Creator.${c1_id}.available_balance_cents == 0"

      - name: rejected_dispute_round_trip_restores_statement_payable_with_no_ledger_movement
        conserved_quantity: "Creator.statement_payable_cents, and the count of that creator's LedgerEntry rows"
        invariant_formula: |
          I4: for a statement that is disputed and whose dispute is then REJECTED
              with adjustment_cents == 0, statement_payable_cents returns to its
              exact pre-dispute value and the creator's LedgerEntry row count is
              unchanged - the round trip is value-conserving AND
              entry-conserving.
          I4b: withholding_cents + net_payable_cents == creator_share_cents holds
              on the statement before, during and after the dispute, because a
              REJECTED dispute records dispute_adjustment_cents 0 and rewrites
              no money field.
        grounds:
          - entities.Creator.fields.statement_payable_cents
          - entities.EarningsStatement.fields.dispute_claimed_amount_cents
          - entities.EarningsStatement.fields.dispute_adjustment_cents
          - entities.EarningsStatement.fields.dispute_resolution
          - entities.EarningsStatement.fields.net_payable_cents
          - "state_machines.EarningsStatement.transitions[status IN {FINALIZED, ADJUSTED} -> UNDER_DISPUTE]"
          - "state_machines.EarningsStatement.transitions[UNDER_DISPUTE -> FINALIZED]"
          - calculations.creator_balance_projection
          - validations.priority_77
          - errors.ERR_DISPUTE_AMOUNT_EXCEEDS_STATEMENT
        distinguishing_aspect: |
          A third conserved quantity - the payable projected from statements,
          together with the ledger ROW COUNT - and the only invariant here whose
          compensation must be a no-op rather than an equal-and-opposite entry.
          Moving a statement to UNDER_DISPUTE withdraws its full 3800 from
          statement_payable_cents even though the claim is only 1000, so a
          rejected dispute must restore the whole 3800 and not merely the
          claimed 1000, must leave withholding_cents at 1200 untouched, and must
          write NO ledger row at all: the two-row ledger from accrual and
          withholding is exactly what the creator ends with. A DISPUTE_ADJUSTMENT
          entry of 0, or a restore of 2800, would each pass a naive
          balance-only check while breaking this invariant.
        test_recipe:
          setup:
            - "One GB Creator (follower_count 10000, watch_time_minutes_365d 240000) evaluated to ELIGIBLE with NO TaxProfile, so withholding_rate_resolution yields BACKUP_WITHHOLDING_BPS 2400."
            - "One TIPS RevenueProduct (5000/5000, min_payable_cents 0); one event of gross 10000 in period 2026-07 gives creator_share_cents 5000."
            - "Period 2026-07 CLOSED then the statement FINALIZED: withholding_cents ROUND_HALF_UP(5000*2400/10000) == 1200, net_payable_cents 3800, ledger holds exactly ACCRUAL +5000 and WITHHOLDING -1200 (the PROVISIONAL and FINAL variants agree on a single-event statement, so no WITHHOLDING_TRUE_UP row is written)."
            - "Pre-dispute snapshot: statement_payable_cents 3800, ledger_balance_cents 3800, ledger row count 2."
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Lev Claim", country_code: "GB", follower_count: 10000, watch_time_minutes_365d: 240000 }
              as: PlatformAdmin
              captures: { cr_id: "$.data.id" }
            - call: "POST /monetization/creators/${cr_id}/evaluate"
              payload: {}
              as: FinanceOperator
            - call: "POST /monetization/revenue-products"
              payload: { product_type: "TIPS", name: "Tips Flat", creator_share_bps: 5000, platform_fee_bps: 5000, min_payable_cents: 0 }
              as: PlatformAdmin
              captures: { tips_id: "$.data.id" }
            - call: "POST /monetization/earnings-periods"
              payload: { label: "2026-07", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { p1_id: "$.data.id" }
            - call: "POST /monetization/revenue-events"
              payload: { creator_id: "${cr_id}", product_id: "${tips_id}", gross_amount_cents: 10000, occurred_at: "2026-07-05T00:00:00Z" }
              as: FinanceOperator
              captures: { ev_share: "$.data.creator_share_cents" }
            - call: "POST /monetization/earnings-periods/${p1_id}/close"
              payload: {}
              as: FinanceOperator
            - call: "GET /monetization/earnings-statements"
              payload: { creator_id: "${cr_id}", period_id: "${p1_id}" }
              as: FinanceOperator
              captures: { s1_id: "$.data[0].id" }
            - call: "POST /monetization/earnings-statements/${s1_id}/finalize"
              payload: {}
              as: FinanceOperator
              captures: { s1_wh: "$.data.withholding_cents", s1_net: "$.data.net_payable_cents", s1_variant: "$.data.withholding_variant" }
            - call: "GET /monetization/creators/${cr_id}"
              payload: {}
              as: FinanceOperator
              captures: { pre_stmt: "$.data.statement_payable_cents", pre_ledger: "$.data.ledger_balance_cents", pre_avail: "$.data.available_balance_cents" }
          trigger:
            - call: "POST /monetization/earnings-statements/${s1_id}/dispute"
              payload: { dispute_reason: "Two tips from the 5th were mine, not a co-host's.", dispute_claimed_amount_cents: 3801 }
              as: Creator
              as_user_id: "${cr_id}"
            - call: "POST /monetization/earnings-statements/${s1_id}/dispute"
              payload: { dispute_reason: "Two tips from the 5th were mine, not a co-host's.", dispute_claimed_amount_cents: 1000 }
              as: Creator
              as_user_id: "${cr_id}"
              captures: { d_status: "$.data.status", d_claim: "$.data.dispute_claimed_amount_cents", d_net: "$.data.net_payable_cents", d_wh: "$.data.withholding_cents" }
            - call: "GET /monetization/creators/${cr_id}"
              payload: {}
              as: FinanceOperator
              captures: { mid_stmt: "$.data.statement_payable_cents", mid_ledger: "$.data.ledger_balance_cents", mid_avail: "$.data.available_balance_cents" }
            - call: "POST /monetization/earnings-statements/${s1_id}/resolve-dispute"
              payload: { decision: "REJECTED", adjustment_cents: 0 }
              as: FinanceOperator
              captures: { r_status: "$.data.status", r_res: "$.data.dispute_resolution", r_adj: "$.data.dispute_adjustment_cents", r_net: "$.data.net_payable_cents", r_wh: "$.data.withholding_cents" }
            - call: "GET /monetization/creators/${cr_id}"
              payload: {}
              as: FinanceOperator
              captures: { post_stmt: "$.data.statement_payable_cents", post_ledger: "$.data.ledger_balance_cents", post_avail: "$.data.available_balance_cents" }
          assert:
            - "${ev_share} == 5000 and ${s1_wh} == 1200 and ${s1_net} == 3800 and ${s1_variant} == FINAL"
            - "${pre_stmt} == 3800 and ${pre_ledger} == 3800 and ${pre_avail} == 3800"
            - "trigger step 1 returns HTTP 409 with error_id ERR_DISPUTE_AMOUNT_EXCEEDS_STATEMENT (3801 > net_payable_cents 3800) and leaves the statement FINALIZED"
            - "trigger step 2 returns HTTP 200 with ${d_status} == UNDER_DISPUTE, ${d_claim} == 1000, ${d_net} == 3800 and ${d_wh} == 1200 (disputing rewrites no money field on the statement)"
            - "${mid_stmt} == 0 - the FULL 3800 is withdrawn from the projection, not just the claimed 1000"
            - "${mid_ledger} == 3800 (unchanged; the projection changed, the ledger did not) and ${mid_avail} == 0"
            - "${r_status} == FINALIZED and ${r_res} == REJECTED and ${r_adj} == 0"
            - "${r_net} == 3800 and ${r_wh} == 1200 and ${r_wh} + ${r_net} == 5000 == ${ev_share}"
            - "${post_stmt} == 3800 == ${pre_stmt} - the whole withheld amount is restored, not 2800"
            - "${post_ledger} == 3800 == ${pre_ledger} and ${post_avail} == 3800 == ${pre_avail}"
            - "GET /monetization/creators/${cr_id}/ledger-entries returns total_count 2 (ACCRUAL +5000, WITHHOLDING -1200) - the same rows as before the dispute"
            - "GET /monetization/creators/${cr_id}/ledger-entries?entry_type=DISPUTE_ADJUSTMENT returns total_count 0 (a rejected dispute writes no entry, not even a zero one)"
            - "GET /monetization/creators/${cr_id}/ledger-entries?entry_type=WITHHOLDING_TRUE_UP returns total_count 0"
            - "EarningsPeriod.${p1_id}.status == FINALIZED and finalized_statement_count == 1"
