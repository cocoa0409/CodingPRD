scaffold_difficulty_design:

  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: claim_line_allowed_provisional_vs_final
        grounds:
          - calculations.claim_line_allowed
          - state_machines.ClaimLine.SUBMITTED_to_ADJUDICATED
          - endpoints["GET /op/device-orders/{id}/billing-summary"]
        distinguishing_aspect: |
          On a GA-modifier ClaimLine domain: the provisional variant (billing-summary preview)
          reports the full billed amount fee_schedule_cents*billed_units with NO 0.80 reduction,
          while the final variant (after adjudicate) writes allowed_cents = round_half_up(base*0.80);
          identical inputs, different cents.
        test_recipe:
          setup:
            - "Patient (COMMERCIAL), Physician (pecos), Supplier accredited+bonded, SIGNED Rx (LOWER_EXTREMITY_ORTHOSIS, no prior-auth), DeviceOrder at INTAKE."
            - "One DRAFT ClaimLine with modifier=GA, billed_units=1, fee_schedule_cents=30000."
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /op/physicians"
              payload: { full_name: "Dr Rx", npi: "1111111111", pecos_enrolled: true }
              as: ComplianceOfficer
              captures: { rx_phys_id: $.data.id }
            - call: "POST /op/physicians"
              payload: { full_name: "Tech Fit", npi: "2222222222", pecos_enrolled: true }
              as: ComplianceOfficer
              captures: { fit_id: $.data.id }
            - call: "POST /op/suppliers"
              payload: { legal_name: "Acme O&P", accreditation_expiry: "2027-01-01T00:00:00Z", surety_bond_active: true }
              as: ComplianceOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /op/patients"
              payload: { full_name: "Pat One", date_of_birth: "1960-01-01", payer_type: "COMMERCIAL" }
              as: BillingSpecialist
              captures: { pat_id: $.data.id }
            - call: "POST /op/prescriptions"
              payload: { patient_id: "${pat_id}", physician_id: "${rx_phys_id}", device_category: "LOWER_EXTREMITY_ORTHOSIS", primary_diagnosis_code: "M21.6X1", face_to_face_date: "2026-05-20" }
              as: Physician
              as_user_id: "${rx_phys_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /op/prescriptions/${rx_id}/sign"
              payload: {}
              as: Physician
              as_user_id: "${rx_phys_id}"
            - call: "POST /op/device-orders"
              payload: { prescription_id: "${rx_id}", supplier_id: "${sup_id}", fitting_practitioner_id: "${fit_id}" }
              as: BillingSpecialist
              captures: { ord_id: $.data.id }
            - call: "POST /op/claim-lines"
              payload: { device_order_id: "${ord_id}", l_code: "L1960", modifier: "GA", billed_units: 1, fee_schedule_cents: 30000 }
              as: BillingSpecialist
              captures: { cl_id: $.data.id }
          trigger:
            - call: "POST /op/claim-lines/${cl_id}/adjudicate"
              payload: {}
              as: BillingSpecialist
              captures: { final_allowed: $.data.allowed_cents }
          assert:
            - "ClaimLine.${cl_id}.allowed_cents == 24000"
            - "Provisional billing-summary for the line reported 30000 (full billed) before adjudication; final allowed_cents == 24000."

      - name: order_allowed_total_estimate_vs_ledger
        grounds:
          - calculations.order_allowed_total
          - calculations.claim_line_allowed
          - entities.DeviceOrder.fields.allowed_total_cents
        distinguishing_aspect: |
          On the DeviceOrder domain (distinct from the ClaimLine domain of the prior instance): the
          provisional_estimate sums billed amounts over SUBMITTED lines (130000) while the
          final_ledger sums final allowed_cents over only ADJUDICATED lines (124000) — same lines,
          different total because the GA line drops to 80% and a GZ line drops to 0.
        test_recipe:
          setup:
            - "Delivered order with three SUBMITTED claim lines: L1 KX fee 50000 x2; L2 GA fee 30000 x1; L3 GZ fee 10000 x1."
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /op/physicians"
              payload: { full_name: "Dr Rx", npi: "1111111111", pecos_enrolled: true }
              as: ComplianceOfficer
              captures: { rx_phys_id: $.data.id }
            - call: "POST /op/physicians"
              payload: { full_name: "Tech Fit", npi: "2222222222", pecos_enrolled: true }
              as: ComplianceOfficer
              captures: { fit_id: $.data.id }
            - call: "POST /op/suppliers"
              payload: { legal_name: "Acme O&P", accreditation_expiry: "2027-01-01T00:00:00Z", surety_bond_active: true }
              as: ComplianceOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /op/patients"
              payload: { full_name: "Pat Two", date_of_birth: "1960-01-01", payer_type: "COMMERCIAL" }
              as: BillingSpecialist
              captures: { pat_id: $.data.id }
            - call: "POST /op/prescriptions"
              payload: { patient_id: "${pat_id}", physician_id: "${rx_phys_id}", device_category: "LOWER_EXTREMITY_ORTHOSIS", primary_diagnosis_code: "M21.6X1", face_to_face_date: "2026-05-20" }
              as: Physician
              as_user_id: "${rx_phys_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /op/prescriptions/${rx_id}/sign"
              payload: {}
              as: Physician
              as_user_id: "${rx_phys_id}"
            - call: "POST /op/device-orders"
              payload: { prescription_id: "${rx_id}", supplier_id: "${sup_id}", fitting_practitioner_id: "${fit_id}" }
              as: BillingSpecialist
              captures: { ord_id: $.data.id, ord_v: $.data.version }
            - call: "POST /op/claim-lines"
              payload: { device_order_id: "${ord_id}", l_code: "L5301", modifier: "KX", billed_units: 2, fee_schedule_cents: 50000 }
              as: BillingSpecialist
              captures: { kx_id: $.data.id }
            - call: "POST /op/claim-lines"
              payload: { device_order_id: "${ord_id}", l_code: "L1960", modifier: "GA", billed_units: 1, fee_schedule_cents: 30000 }
              as: BillingSpecialist
              captures: { ga_id: $.data.id }
            - call: "POST /op/claim-lines"
              payload: { device_order_id: "${ord_id}", l_code: "L1970", modifier: "GZ", billed_units: 1, fee_schedule_cents: 10000 }
              as: BillingSpecialist
              captures: { gz_id: $.data.id }
            - call: "POST /op/device-orders/${ord_id}/fabrication-milestones"
              payload: { step: "ASSEMBLY", weight: 1 }
              as: Practitioner
              as_user_id: "${fit_id}"
              captures: { ms_id: $.data.id }
            - call: "POST /op/device-orders/${ord_id}/start-fabrication"
              payload: {}
              as: Practitioner
              as_user_id: "${fit_id}"
            - call: "POST /op/fabrication-milestones/${ms_id}/complete"
              payload: {}
              as: Practitioner
              as_user_id: "${fit_id}"
              captures: { ord_v2: $.data.id }
            - call: "GET /op/device-orders/${ord_id}"
              payload: {}
              as: Practitioner
              as_user_id: "${fit_id}"
              captures: { ord_ver_ready: $.data.version }
            - call: "POST /op/device-orders/${ord_id}/deliver"
              payload: { expected_device_order_version: "${ord_ver_ready}" }
              as: Practitioner
              as_user_id: "${fit_id}"
          trigger:
            - call: "POST /op/claim-lines/${kx_id}/adjudicate"
              payload: {}
              as: BillingSpecialist
            - call: "POST /op/claim-lines/${ga_id}/adjudicate"
              payload: {}
              as: BillingSpecialist
            - call: "POST /op/claim-lines/${gz_id}/deny"
              payload: {}
              as: BillingSpecialist
            - call: "GET /op/device-orders/${ord_id}"
              payload: {}
              as: BillingSpecialist
              captures: { ledger: $.data.allowed_total_cents }
          assert:
            - "DeviceOrder.${ord_id}.allowed_total_cents == 124000"
            - "Provisional billing-summary before adjudication summed 130000 (KX 100000 + GA billed 30000); final ledger == 124000 (KX 100000 + GA 24000 + GZ excluded)."

  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: claim_line_allowed_modifier_branch_mode_a
        grounds:
          - calculations.claim_line_allowed
          - entities.ClaimLine.fields.modifier
          - validations[priority=11]
        distinguishing_aspect: |
          Mode (a): claim_line_allowed branches on >=3 inputs (modifier, fee_schedule_cents,
          billed_units) plus the owning order's prior-auth presence; the KX path keeps full base
          ONLY when a covering APPROVED PriorAuth exists, otherwise adjudication is rejected
          ERR_KX_WITHOUT_AUTH — a non-linear conditional interaction, not a single tiered table.
        test_recipe:
          setup:
            - "Medicare LOWER_LIMB_PROSTHETIC order (requires_prior_auth=true) with an APPROVED PriorAuth, delivered; one SUBMITTED KX line fee 50000 x2."
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /op/physicians"
              payload: { full_name: "Dr Rx", npi: "1111111111", pecos_enrolled: true }
              as: ComplianceOfficer
              captures: { rx_phys_id: $.data.id }
            - call: "POST /op/physicians"
              payload: { full_name: "Tech Fit", npi: "2222222222", pecos_enrolled: true }
              as: ComplianceOfficer
              captures: { fit_id: $.data.id }
            - call: "POST /op/suppliers"
              payload: { legal_name: "Acme O&P", accreditation_expiry: "2027-01-01T00:00:00Z", surety_bond_active: true }
              as: ComplianceOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /op/patients"
              payload: { full_name: "Med Pat", date_of_birth: "1955-01-01", payer_type: "MEDICARE", medicare_beneficiary_id: "1EG4TE5MK72", functional_k_level: 3 }
              as: BillingSpecialist
              captures: { pat_id: $.data.id }
            - call: "POST /op/prescriptions"
              payload: { patient_id: "${pat_id}", physician_id: "${rx_phys_id}", device_category: "LOWER_LIMB_PROSTHETIC", primary_diagnosis_code: "Z89.511", face_to_face_date: "2026-05-20" }
              as: Physician
              as_user_id: "${rx_phys_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /op/prescriptions/${rx_id}/sign"
              payload: {}
              as: Physician
              as_user_id: "${rx_phys_id}"
            - call: "POST /op/device-orders"
              payload: { prescription_id: "${rx_id}", supplier_id: "${sup_id}", fitting_practitioner_id: "${fit_id}" }
              as: BillingSpecialist
              captures: { ord_id: $.data.id }
            - call: "POST /op/claim-lines"
              payload: { device_order_id: "${ord_id}", l_code: "L5301", modifier: "KX", billed_units: 2, fee_schedule_cents: 50000 }
              as: BillingSpecialist
              captures: { kx_id: $.data.id }
            - call: "POST /op/device-orders/${ord_id}/fabrication-milestones"
              payload: { step: "ASSEMBLY", weight: 1 }
              as: Practitioner
              as_user_id: "${fit_id}"
              captures: { ms_id: $.data.id }
            - call: "POST /op/device-orders/${ord_id}/submit-auth"
              payload: {}
              as: BillingSpecialist
              captures: { pa_id: $.data.id }
            - call: "POST /op/prior-auths/${pa_id}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /op/fabrication-milestones/${ms_id}/complete"
              payload: {}
              as: Practitioner
              as_user_id: "${fit_id}"
            - call: "GET /op/device-orders/${ord_id}"
              payload: {}
              as: BillingSpecialist
              captures: { ord_ver_ready: $.data.version }
            - call: "POST /op/device-orders/${ord_id}/deliver"
              payload: { expected_device_order_version: "${ord_ver_ready}" }
              as: Practitioner
              as_user_id: "${fit_id}"
          trigger:
            - call: "POST /op/claim-lines/${kx_id}/adjudicate"
              payload: {}
              as: BillingSpecialist
              captures: { allowed: $.data.allowed_cents }
          assert:
            - "ClaimLine.${kx_id}.allowed_cents == 100000"
            - "KX with covering APPROVED PriorAuth keeps full base (50000*2); no reduction."

      - name: order_allowed_total_rounding_order_mode_b
        grounds:
          - calculations.order_allowed_total
          - calculations.claim_line_allowed
          - entities.DeviceOrder.fields.allowed_total_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned to ROUND-PER-LINE-THEN-SUM. Two GA lines
          fee=13c and fee=14c each x1: per-line round_half_up(13*0.8)+round_half_up(14*0.8)=10+11=21,
          whereas sum-then-round round_half_up((13+14)*0.8)=round(21.6)=22. The scaffold pins the
          per-line order, so allowed_total_cents==21 (NOT 22).
        test_recipe:
          setup:
            - "Delivered COMMERCIAL orthosis order with two SUBMITTED GA lines fee_schedule_cents 13 and 14, each billed_units 1."
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /op/physicians"
              payload: { full_name: "Dr Rx", npi: "1111111111", pecos_enrolled: true }
              as: ComplianceOfficer
              captures: { rx_phys_id: $.data.id }
            - call: "POST /op/physicians"
              payload: { full_name: "Tech Fit", npi: "2222222222", pecos_enrolled: true }
              as: ComplianceOfficer
              captures: { fit_id: $.data.id }
            - call: "POST /op/suppliers"
              payload: { legal_name: "Acme O&P", accreditation_expiry: "2027-01-01T00:00:00Z", surety_bond_active: true }
              as: ComplianceOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /op/patients"
              payload: { full_name: "Pat Rnd", date_of_birth: "1960-01-01", payer_type: "COMMERCIAL" }
              as: BillingSpecialist
              captures: { pat_id: $.data.id }
            - call: "POST /op/prescriptions"
              payload: { patient_id: "${pat_id}", physician_id: "${rx_phys_id}", device_category: "LOWER_EXTREMITY_ORTHOSIS", primary_diagnosis_code: "M21.6X1", face_to_face_date: "2026-05-20" }
              as: Physician
              as_user_id: "${rx_phys_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /op/prescriptions/${rx_id}/sign"
              payload: {}
              as: Physician
              as_user_id: "${rx_phys_id}"
            - call: "POST /op/device-orders"
              payload: { prescription_id: "${rx_id}", supplier_id: "${sup_id}", fitting_practitioner_id: "${fit_id}" }
              as: BillingSpecialist
              captures: { ord_id: $.data.id }
            - call: "POST /op/claim-lines"
              payload: { device_order_id: "${ord_id}", l_code: "L1960", modifier: "GA", billed_units: 1, fee_schedule_cents: 13 }
              as: BillingSpecialist
              captures: { ga1_id: $.data.id }
            - call: "POST /op/claim-lines"
              payload: { device_order_id: "${ord_id}", l_code: "L1960", modifier: "GA", billed_units: 1, fee_schedule_cents: 14 }
              as: BillingSpecialist
              captures: { ga2_id: $.data.id }
            - call: "POST /op/device-orders/${ord_id}/fabrication-milestones"
              payload: { step: "ASSEMBLY", weight: 1 }
              as: Practitioner
              as_user_id: "${fit_id}"
              captures: { ms_id: $.data.id }
            - call: "POST /op/device-orders/${ord_id}/start-fabrication"
              payload: {}
              as: Practitioner
              as_user_id: "${fit_id}"
            - call: "POST /op/fabrication-milestones/${ms_id}/complete"
              payload: {}
              as: Practitioner
              as_user_id: "${fit_id}"
            - call: "GET /op/device-orders/${ord_id}"
              payload: {}
              as: Practitioner
              as_user_id: "${fit_id}"
              captures: { ord_ver_ready: $.data.version }
            - call: "POST /op/device-orders/${ord_id}/deliver"
              payload: { expected_device_order_version: "${ord_ver_ready}" }
              as: Practitioner
              as_user_id: "${fit_id}"
          trigger:
            - call: "POST /op/claim-lines/${ga1_id}/adjudicate"
              payload: {}
              as: BillingSpecialist
            - call: "POST /op/claim-lines/${ga2_id}/adjudicate"
              payload: {}
              as: BillingSpecialist
            - call: "GET /op/device-orders/${ord_id}"
              payload: {}
              as: BillingSpecialist
              captures: { ledger: $.data.allowed_total_cents }
          assert:
            - "ClaimLine.${ga1_id}.allowed_cents == 10"
            - "ClaimLine.${ga2_id}.allowed_cents == 11"
            - "DeviceOrder.${ord_id}.allowed_total_cents == 21"

  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: prior_auth_pend_resubmit_cycle
        grounds:
          - state_machines.PriorAuth.SUBMITTED_to_PENDED
          - state_machines.PriorAuth.PENDED_to_SUBMITTED
          - entities.PriorAuth.fields.submission_round
        distinguishing_aspect: |
          PriorAuth (entity 1) has a true cycle SUBMITTED->PENDED->SUBMITTED; each resubmit
          increments submission_round (1 -> 2) and resets decision_deadline — the same state is
          re-entered, proving non-linear (cyclic) shape, not an A->B->C pipeline.
        test_recipe:
          setup:
            - "Medicare LOWER_LIMB_PROSTHETIC order with a PriorAuth that has been PENDED once."
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /op/physicians"
              payload: { full_name: "Dr Rx", npi: "1111111111", pecos_enrolled: true }
              as: ComplianceOfficer
              captures: { rx_phys_id: $.data.id }
            - call: "POST /op/physicians"
              payload: { full_name: "Tech Fit", npi: "2222222222", pecos_enrolled: true }
              as: ComplianceOfficer
              captures: { fit_id: $.data.id }
            - call: "POST /op/suppliers"
              payload: { legal_name: "Acme O&P", accreditation_expiry: "2027-01-01T00:00:00Z", surety_bond_active: true }
              as: ComplianceOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /op/patients"
              payload: { full_name: "Med Pat", date_of_birth: "1955-01-01", payer_type: "MEDICARE", medicare_beneficiary_id: "1EG4TE5MK72", functional_k_level: 3 }
              as: BillingSpecialist
              captures: { pat_id: $.data.id }
            - call: "POST /op/prescriptions"
              payload: { patient_id: "${pat_id}", physician_id: "${rx_phys_id}", device_category: "LOWER_LIMB_PROSTHETIC", primary_diagnosis_code: "Z89.511", face_to_face_date: "2026-05-20" }
              as: Physician
              as_user_id: "${rx_phys_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /op/prescriptions/${rx_id}/sign"
              payload: {}
              as: Physician
              as_user_id: "${rx_phys_id}"
            - call: "POST /op/device-orders"
              payload: { prescription_id: "${rx_id}", supplier_id: "${sup_id}", fitting_practitioner_id: "${fit_id}" }
              as: BillingSpecialist
              captures: { ord_id: $.data.id }
            - call: "POST /op/device-orders/${ord_id}/submit-auth"
              payload: {}
              as: BillingSpecialist
              captures: { pa_id: $.data.id }
            - call: "POST /op/prior-auths/${pa_id}/pend"
              payload: {}
              as: ComplianceOfficer
              captures: { pa_v: $.data.version }
          trigger:
            - call: "POST /op/prior-auths/${pa_id}/resubmit"
              payload: { expected_prior_auth_version: "${pa_v}" }
              as: BillingSpecialist
              captures: { rd: $.data.submission_round }
          assert:
            - "PriorAuth.${pa_id}.status == SUBMITTED"
            - "PriorAuth.${pa_id}.submission_round == 2"
            - "PriorAuth.${pa_id}.decision_deadline == 2026-06-15T00:00:00Z"

      - name: claim_line_parallel_adjudication_appeal_dimensions
        grounds:
          - state_machines.ClaimLine.SUBMITTED_to_DENIED
          - state_machines.ClaimLine.DENIED_to_ADJUDICATED
          - entities.ClaimLine.fields.appeal_status
        distinguishing_aspect: |
          ClaimLine (entity 2, different from PriorAuth) carries two independent state dimensions:
          adjudication_status (DRAFT->SUBMITTED->DENIED->ADJUDICATED) and appeal_status
          (NONE->APPEALED->APPEAL_OVERTURNED). The appeal dimension advances while adjudication is
          DENIED, then drives adjudication back to ADJUDICATED — parallel dimensions on one row.
        test_recipe:
          setup:
            - "Delivered COMMERCIAL orthosis order with one DENIED claim line (fee 30000 x1, modifier NONE) that has been APPEALED."
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /op/physicians"
              payload: { full_name: "Dr Rx", npi: "1111111111", pecos_enrolled: true }
