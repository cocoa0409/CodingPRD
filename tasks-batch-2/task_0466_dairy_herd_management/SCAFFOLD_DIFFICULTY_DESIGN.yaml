          assert:
            - "MilkCheck.${mc_id}.weighted_scc_thousands == 200.00"
            - "Herd.${h_id}.milk_quality_status == GOOD"

      - name: parlor_shift_adjacency_at_turnaround_boundary_allowed
        grounds:
          - validations[priority=10]
          - entities.Parlor.fields.turnaround_minutes
          - entities.MilkingShift.fields.start_at
        distinguishing_aspect: |
          On a DIFFERENT endpoint (POST /herds/milking-shifts) and DIFFERENT metric (time adjacency): a
          second shift whose start_at == prior.end_at + turnaround_minutes (exactly the buffer boundary) is
          ALLOWED; one minute earlier would be ERR_PARLOR_SHIFT_OVERLAP.
        test_recipe:
          setup:
            - "Parlor with turnaround_minutes 30; a LOGGED shift 04:00-07:00 UTC on 2026-06-01."
          setup_api_calls:
            - call: "POST /herds"
              payload: { name: "Parlor Boundary Dairy", federal_order_number: "30" }
