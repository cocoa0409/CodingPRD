            - call: "POST /licensing/agreements/${agr_id}/deployments"
              payload: { product_id: "${prod_id}", scope: "USER", deployment_date: "2026-09-02", user_count: 7, hosting: "ON_PREMISES" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
            - call: "POST /licensing/agreements/${agr_id}/true-up-reports"
