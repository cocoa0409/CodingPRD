              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /cleaning-jobs/${job_one}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /cleaning-jobs/${job_one}/book"
              payload: { crew_id: "${crew_id}", start_minute: 600, end_minute: 720, expected_crew_version: "${crew_v}" }
              as: Dispatcher
            - call: "POST /cleaning-jobs"
              payload: { customer_id: "${cust_id}", service_catalog_id: "${cat_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_two: $.data.id }
            - call: "POST /cleaning-jobs/${job_two}/rooms"
              payload: { area_label: "Rm2", area_sqft: 100, soiling_level: "LIGHT" }
