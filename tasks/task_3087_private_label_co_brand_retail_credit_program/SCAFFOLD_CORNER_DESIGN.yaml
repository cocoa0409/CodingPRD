  # ===========================================================================
  - section: cross_cutting
    instances:

      - name: occ_agreement_execute_rejects_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[agreement-execute-stale-agreement]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "Executing with expected_agreement_version one behind the observed version is rejected 412 and leaves the agreement unchanged."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One partner and one NEGOTIATION agreement."
          setup_api_calls:
            - *c_clock
            - *c_partner_b
            - *c_agreement
            - *c_neg
          trigger:
            - call: "POST /servicing/agreements/${ag_id}/execute"
              payload: { expected_agreement_version: "${ag_v_neg} - 1" }
              as: ProgramAdmin
              captures: { error_id: "$.data.error_id" }
          assert:
            - "the response status is 412 and error_id == ERR_STALE_VERSION"
            - "ProgramAgreement.${ag_id}.agreement_status == NEGOTIATION"
            - "ProgramAgreement.${ag_id}.version == ${ag_v_neg}"

      - name: occ_agreement_execute_advances_version_on_success
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[agreement-execute-stale-agreement]
          - entities.ProgramAgreement.fields.version
        distinguishing_aspect: "The matching version succeeds and the write advances ProgramAgreement.version by exactly one, so a subsequent stale replay is detectable."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One partner and one NEGOTIATION agreement."
          setup_api_calls:
            - *c_clock
            - *c_partner_b
            - *c_agreement
            - *c_neg
          trigger:
            - call: "POST /servicing/agreements/${ag_id}/execute"
              payload: { expected_agreement_version: "${ag_v_neg}" }
              as: ProgramAdmin
              captures: { ag_after: "$.data.version" }
          assert:
            - "the response status is 200 and agreement_status == ACTIVE"
            - "ProgramAgreement.${ag_id}.version == ${ag_v_neg} + 1"
            - "replaying execute with expected_agreement_version ${ag_v_neg} now returns 412 ERR_STALE_VERSION"

      - name: cascade_dispute_fan_out_charges_back_the_transaction_set
        claim_type: cascading_side_effects
        grounds:
          - state_machines.DisputeCase.transitions.UNDER_REVIEW_to_RESOLVED_FAVOR_CARDHOLDER
          - calculations.promo_subsidy_at_risk
          - entities.DisputeCase.fields.chargeback_amount_cents
        distinguishing_aspect: "The cardholder resolution fans out to the transaction, its promo plan and the program exposure in one request — a different fan-out surface from the loyalty/clawback cascade owned by §1.8."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One program, account and 120000-cent promo purchase with exposure 5756."
          setup_api_calls:
            - *c_clock
            - *c_partner_b
            - *c_agreement
            - *c_neg
            - *c_exec
            - *c_program
            - *c_app
            - *c_decide
            - *c_acct
            - call: "POST /servicing/transactions"
              payload: { account_id: "${acct_id}", merchant_name: "Coldgate Driftwood", amount_cents: 120000, transaction_channel: "IN_STORE", promo_requested: true, promo_term_months: 12 }
              as: Cardholder
              as_user_id: "${acct_id}"
              captures: { tx_id: "$.data.id" }
            - call: "GET /servicing/promo-plans?transaction_id=${tx_id}"
              payload: {}
              as: ProgramAdmin
              captures: { pp_id: "$.data[0].id" }
          trigger:
            - call: "POST /servicing/disputes"
              payload: { transaction_id: "${tx_id}", account_id: "${acct_id}", dispute_reason: "FRAUD" }
              as: CardholderService
              captures: { d_id: "$.data.id" }
            - call: "POST /servicing/disputes/${d_id}/review"
              payload: {}
              as: CardholderService
            - call: "POST /servicing/disputes/${d_id}/resolve"
              payload: { resolution_outcome: "CARDHOLDER" }
              as: CardholderService
              captures: { cb: "$.data.chargeback_amount_cents" }
          assert:
            - "DisputeCase.${d_id}.chargeback_amount_cents == 120000"
            - "Transaction.${tx_id}.transaction_status == POSTED"
            - "PromoPlan.${pp_id}.subsidy_at_risk_cents == 0"
            - "GET /servicing/credit-programs/${g_id}/summary free_look_exposure_cents == 0"

      - name: derived_field_program_receivable_recomputes_on_balance_rows
        claim_type: derived_field_reconciliation
        grounds:
          - entities.CreditProgram.fields.outstanding_receivable_cents
          - entities.Account.fields.outstanding_balance_cents
          - endpoints.POST_/servicing/accounts/{id}/balances
        distinguishing_aspect: "CreditProgram.outstanding_receivable_cents tracks the sum of the account's ScheduledBalance rows, moving from 100000 to 150000 when a second slice is recorded."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One program and account with a single 100000-cent principal row."
          setup_api_calls:
            - *c_clock
            - *c_partner_b
            - *c_agreement
            - *c_neg
            - *c_exec
            - *c_program
            - *c_app
            - *c_decide
            - *c_acct
            - call: "POST /servicing/accounts/${acct_id}/balances"
              payload: { principal_balance_cents: 100000, balance_bucket: "PRINCIPAL" }
              as: ProgramAdmin
          trigger:
            - call: "POST /servicing/accounts/${acct_id}/balances"
              payload: { principal_balance_cents: 50000, balance_bucket: "PRINCIPAL" }
              as: ProgramAdmin
              captures: { sb_id: "$.data.id" }
          assert:
            - "Account.${acct_id}.outstanding_balance_cents == 150000"
            - "GET /servicing/credit-programs/${g_id}/summary outstanding_receivable_cents == 150000"
            - "GET /servicing/accounts/${acct_id}/balances returns 2 rows"

      - name: derived_field_program_exposure_recomputes_on_settlement
        claim_type: derived_field_reconciliation
        grounds:
          - entities.CreditProgram.fields.free_look_exposure_cents
          - calculations.promo_subsidy_settlement
        distinguishing_aspect: "The program exposure denormalization survives settlement unchanged at 10432 rather than being zeroed, because the settlement does not expire the plans."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One program, account and two promo plans with exposure 10432."
          setup_api_calls:
            - *c_clock
            - *c_partner_b
            - *c_agreement
            - *c_neg
            - *c_exec
            - *c_program
            - *c_app
            - *c_decide
            - *c_acct
            - call: "POST /servicing/transactions"
              payload: { account_id: "${acct_id}", merchant_name: "Coldgate Seaweed", amount_cents: 120000, transaction_channel: "IN_STORE", promo_requested: true, promo_term_months: 12 }
              as: Cardholder
              as_user_id: "${acct_id}"
            - call: "POST /servicing/transactions"
              payload: { account_id: "${acct_id}", merchant_name: "Coldgate Fathoms", amount_cents: 240000, transaction_channel: "DIGITAL", promo_requested: true, promo_term_months: 6 }
              as: Cardholder
              as_user_id: "${acct_id}"
            - call: "POST /servicing/settlement-batches"
              payload: { agreement_id: "${ag_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", settlement_method: "AS_CHARGED", reconciliation_method: "PROJECTED" }
              as: ProgramAdmin
              captures: { b_id: "$.data.id" }
          trigger:
            - call: "POST /servicing/settlement-batches/${b_id}/finalize"
              payload: {}
              as: ProgramAdmin
          assert:
            - "GET /servicing/credit-programs/${g_id}/summary free_look_exposure_cents == 10432"
            - "GET /servicing/credit-programs/${g_id}/summary outstanding_receivable_cents == 0"
            - "the exposure did not drift to 0 on settlement because both plans remain ACTIVE"

      - name: selector_program_lookup_is_an_explicit_fk_filter
        claim_type: selector_policy
        grounds:
          - endpoints.GET_/servicing/credit-programs
          - entities.CreditProgram.fields.partner_id
        distinguishing_aspect: "Program selection is never a ranked guess: GET /credit-programs?partner_id returns exactly the programs whose partner_id equals the supplied id, and a second partner's program never leaks in."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Partner A with one program; partner B with none."
          setup_api_calls:
            - *c_clock
            - *c_partner_b
            - *c_agreement
            - *c_neg
            - *c_exec
            - *c_program
            - call: "POST /servicing/partners"
              payload: { retailer_name: "Merrivale Optics", loyalty_program_code: "MERRIVALE" }
              as: ProgramAdmin
              captures: { p_other: "$.data.id" }
          trigger:
            - call: "GET /servicing/credit-programs"
              payload: { partner_id: "${p_id}" }
              as: ProgramAdmin
          assert:
            - "the response returns exactly 1 row, the program for partner ${p_id}"
            - "GET /servicing/credit-programs?partner_id=${p_other} returns 0 rows"
            - "GET /servicing/credit-programs with no filter returns 1 row and total_count 1"

  # ===========================================================================
  - section: consistency
    instances:

      - name: immediate_payment_balance_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - entities.Account.fields.outstanding_balance_cents
          - endpoints.POST_/servicing/accounts/{id}/post-payment
        distinguishing_aspect: "The payment response itself carries the post-payment balance 60000, so the write is visible without a follow-up read."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One program and account carrying 100000 principal."
          setup_api_calls:
            - *c_clock
            - *c_partner_b
            - *c_agreement
            - *c_neg
            - *c_exec
            - *c_program
            - *c_app
            - *c_decide
            - *c_acct
            - call: "POST /servicing/accounts/${acct_id}/balances"
              payload: { principal_balance_cents: 100000, balance_bucket: "PRINCIPAL" }
              as: ProgramAdmin
          trigger:
            - call: "POST /servicing/accounts/${acct_id}/post-payment"
              payload: { payment_amount_cents: 40000 }
              as: Cardholder
              as_user_id: "${acct_id}"
              captures: { bal: "$.data.outstanding_balance_cents" }
          assert:
            - "the response status is 200 and outstanding_balance_cents == 60000"
            - "GET /servicing/accounts/${acct_id} returns outstanding_balance_cents == 60000"
            - "Account status remains ACTIVE"

      - name: immediate_charge_off_and_cascade_visible_on_read
        claim_type: immediate
        grounds:
          - state_machines.Account.transitions.DELINQUENT_to_CHARGED_OFF
          - entities.PromoPlan.fields.plan_status
        distinguishing_aspect: "The charge-off response reports CHARGED_OFF and a read immediately after shows the cascaded PromoPlan expiry, with no asynchronous lag."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One program and account with a 12-month promo plan and a payment due 2026-09-10."
          setup_api_calls:
            - *c_clock
            - *c_partner_b
            - *c_agreement
            - *c_neg
            - *c_exec
            - *c_program
            - *c_app
            - *c_decide
            - *c_acct
            - call: "POST /servicing/accounts/${acct_id}/schedule-payment"
              payload: { due_date: "2026-09-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /servicing/transactions"
              payload: { account_id: "${acct_id}", merchant_name: "Coldgate Pilings", amount_cents: 120000, transaction_channel: "IN_STORE", promo_requested: true, promo_term_months: 12 }
              as: Cardholder
              as_user_id: "${acct_id}"
              captures: { tx_id: "$.data.id" }
            - call: "GET /servicing/promo-plans?transaction_id=${tx_id}"
              payload: {}
              as: ProgramAdmin
              captures: { pp_id: "$.data[0].id" }
            - call: "POST /servicing/_clock/advance"
              payload: { days: 200 }
              as: ProgramAdmin
          trigger:
            - call: "POST /servicing/accounts/${acct_id}/charge-off"
              payload: {}
              as: ProgramAdmin
              captures: { a_status: "$.data.account_status" }
          assert:
            - "the response status is 200 and account_status == CHARGED_OFF"
            - "immediately after, PromoPlan.${pp_id}.plan_status == EXPIRED"
            - "GET /servicing/credit-programs/${g_id}/summary outstanding_receivable_cents == 0"
