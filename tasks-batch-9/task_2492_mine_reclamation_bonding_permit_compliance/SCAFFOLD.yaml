    roles: [ProgramDirector]
    input: [permit_id, initiation_reason]
    output: ForfeitureProceeding
    side_effects: ["status INITIATED; contest_deadline set to now + CONTEST_WINDOW_DAYS; permit.compliance_posture FORFEITURE_PENDING; open release applications suspended"]
    errors: [ERR_MISSING_AUTH_HEADERS, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_PERMIT_NOT_FOUND, ERR_PERMIT_STATE_INVALID, ERR_PERMIT_HAS_OPEN_PROCEEDING]

  - method: GET
    path: /mining/forfeiture-proceedings/{id}
    roles: [Operator, PermitReviewer, BondSpecialist, ProgramDirector, PublicParticipant]
    input: []
    output: ForfeitureProceeding
    errors: [ERR_MISSING_AUTH_HEADERS, ERR_UNAUTHORIZED, ERR_PROCEEDING_NOT_FOUND]

  - method: GET
    path: /mining/forfeiture-proceedings
    roles: [Operator, PermitReviewer, BondSpecialist, ProgramDirector, PublicParticipant]
    input: ["permit_id?", "status?", "limit?", "offset?"]
    output: ForfeitureProceeding[]
    errors: [ERR_MISSING_AUTH_HEADERS, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  - method: POST
    path: /mining/forfeiture-proceedings/{id}/contest
    roles: [Operator]
    input: [contest_note]
    output: ForfeitureProceeding
    side_effects: ["status CONTESTED; contest_note stored"]
    errors: [ERR_MISSING_AUTH_HEADERS, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_PROCEEDING_NOT_FOUND, ERR_NOT_PERMIT_OPERATOR, ERR_PROCEEDING_STATE_INVALID, ERR_CONTEST_WINDOW_CLOSED]

  - method: POST
    path: /mining/forfeiture-proceedings/{id}/finalize
    roles: [ProgramDirector]
    input: [state_reclamation_cost_estimate]
    output: ForfeitureProceeding
    side_effects: ["status FINAL; forfeited_bond_amount and deficiency_amount computed; four-link cascade: permit FORFEITED with instruments FORFEITED and scheduled inspections CANCELLED, operator DISQUALIFIED with forfeiture_count incremented, the operator's other SELF_BOND instruments driven to SUBSTITUTION_REQUIRED and those permits driven to BOND_DEFICIENT"]
    errors: [ERR_MISSING_AUTH_HEADERS, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_PROCEEDING_NOT_FOUND, ERR_PROCEEDING_STATE_INVALID, ERR_CONTEST_WINDOW_OPEN]

  - method: POST
    path: /mining/forfeiture-proceedings/{id}/record-state-reclamation
    roles: [ProgramDirector]
    input: [actual_cost_incurred, completion_pct]
    output: ForfeitureProceeding
    side_effects: ["actual_cost_incurred and completion_pct stored; at completion_pct 100 the proceeding becomes COMPLETED, the settlement is split into deficiency_amount and surplus_amount, operator.refund_due_amount grows by any surplus, and a remaining deficiency reclassifies the MineSite as ABANDONED_LEGACY / NOMINATED with a computed legacy_priority_score"]
    errors: [ERR_MISSING_AUTH_HEADERS, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_PROCEEDING_NOT_FOUND, ERR_PROCEEDING_STATE_INVALID]

  # --------------------------------------------------------------- logical clock
  - method: POST
    path: /mining/_clock/set_current_utc
    roles: [Operator, PermitReviewer, BondSpecialist, Inspector, ProgramDirector, PublicParticipant]
    input: [current_utc]
    output: { current_utc: string }
    note: |
      Test-driving endpoint. Sets the logical clock that every temporal rule and
      every *_at / *_deadline stamp reads. Default value before any call:
      2026-08-01T00:00:00Z.
    errors: [ERR_MISSING_AUTH_HEADERS, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

# =============================================================================
# 1.6 Error Catalog
# =============================================================================
errors:
  - { error_id: ERR_MISSING_AUTH_HEADERS, http_status: 401, trigger: "X-Role or X-User-ID header absent or empty" }
  - { error_id: ERR_UNAUTHORIZED, http_status: 403, trigger: "X-Role is not in the endpoint's roles list" }
  - { error_id: ERR_INVALID_REQUEST, http_status: 422, trigger: "Missing required body field, wrong type, unknown enum member, or numeric/date constraint violated" }
  - { error_id: ERR_OPERATOR_NOT_FOUND, http_status: 404, trigger: "operator id in the path or in operator_id does not resolve" }
  - { error_id: ERR_MINE_SITE_NOT_FOUND, http_status: 404, trigger: "mine site id in the path or in mine_site_id does not resolve" }
  - { error_id: ERR_INSPECTOR_PROFILE_NOT_FOUND, http_status: 404, trigger: "inspector profile id in the path or in inspector_id does not resolve" }
  - { error_id: ERR_PERMIT_NOT_FOUND, http_status: 404, trigger: "permit id in the path or in permit_id does not resolve" }
  - { error_id: ERR_ESTIMATE_NOT_FOUND, http_status: 404, trigger: "reclamation cost estimate id in the path does not resolve" }
  - { error_id: ERR_INSTRUMENT_NOT_FOUND, http_status: 404, trigger: "bond instrument id in the path or in replaces_instrument_id does not resolve" }
  - { error_id: ERR_RELEASE_APPLICATION_NOT_FOUND, http_status: 404, trigger: "bond release application id in the path does not resolve" }
  - { error_id: ERR_INSPECTION_NOT_FOUND, http_status: 404, trigger: "inspection id in the path or in inspection_id does not resolve" }
  - { error_id: ERR_VIOLATION_NOTICE_NOT_FOUND, http_status: 404, trigger: "violation notice id in the path does not resolve" }
  - { error_id: ERR_REVISION_NOT_FOUND, http_status: 404, trigger: "permit revision id in the path does not resolve" }
  - { error_id: ERR_PROCEEDING_NOT_FOUND, http_status: 404, trigger: "forfeiture proceeding id in the path does not resolve" }
  - { error_id: ERR_NOT_PERMIT_OPERATOR, http_status: 403, trigger: "X-Role Operator whose X-User-ID is not the permit's operator_id" }
  - { error_id: ERR_NOT_ASSIGNED_INSPECTOR, http_status: 403, trigger: "X-Role Inspector whose X-User-ID is not the inspection's inspector_id" }
  - { error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 409, trigger: "The bond specialist deciding a release is the same user id that accepted a currently ACCEPTED instrument on that permit" }
  - { error_id: ERR_STALE_PERMIT_VERSION, http_status: 412, trigger: "expected_permit_version does not equal the permit's current version" }
  - { error_id: ERR_PERMIT_STATE_INVALID, http_status: 409, trigger: "The permit's status does not admit the requested operation (own-state or cross-entity)" }
  - { error_id: ERR_ESTIMATE_STATE_INVALID, http_status: 409, trigger: "The estimate is not SUBMITTED when acceptance is attempted" }
  - { error_id: ERR_INSTRUMENT_STATE_INVALID, http_status: 409, trigger: "The instrument is not PROPOSED when acceptance is attempted" }
  - { error_id: ERR_RELEASE_STATE_INVALID, http_status: 409, trigger: "The release application's status does not admit the requested operation" }
  - { error_id: ERR_INSPECTION_STATE_INVALID, http_status: 409, trigger: "The inspection is not SCHEDULED when a result is recorded" }
  - { error_id: ERR_NOTICE_STATE_INVALID, http_status: 409, trigger: "The notice's notice_status does not admit the requested operation" }
  - { error_id: ERR_PENALTY_STATE_INVALID, http_status: 409, trigger: "The notice's penalty_status does not admit the requested operation (assessing twice, paying an unassessed penalty, vacating a PAID penalty)" }
  - { error_id: ERR_REVISION_STATE_INVALID, http_status: 409, trigger: "The revision's status does not admit the requested operation" }
  - { error_id: ERR_PROCEEDING_STATE_INVALID, http_status: 409, trigger: "The proceeding's status does not admit the requested operation" }
  - { error_id: ERR_SITE_FUNDING_STATE_INVALID, http_status: 409, trigger: "The mine site's funding_status does not admit nomination or award" }
  - { error_id: ERR_OPERATOR_DISQUALIFIED, http_status: 409, trigger: "The operator's registry_status is DISQUALIFIED" }
  - { error_id: ERR_NO_ACCEPTED_ESTIMATE, http_status: 409, trigger: "No ACCEPTED ReclamationCostEstimate exists for the permit" }
  - { error_id: ERR_ESTIMATE_EXPIRED, http_status: 422, trigger: "estimate_effective_date is more than ESTIMATE_MAX_AGE_DAYS before the logical clock" }
  - { error_id: ERR_ESTIMATE_DATE_IN_FUTURE, http_status: 422, trigger: "estimate_effective_date is after the logical clock's current instant" }
  - { error_id: ERR_BOND_BELOW_REQUIRED, http_status: 409, trigger: "Issuing a permit whose bond_held_amount is below bond_required_amount" }
  - { error_id: ERR_SELF_BOND_NOT_QUALIFIED, http_status: 409, trigger: "Accepting a SELF_BOND instrument for an operator whose self_bond_status is not QUALIFIED" }
  - { error_id: ERR_SELF_BOND_CAPACITY_EXCEEDED, http_status: 409, trigger: "A SELF_BOND face amount exceeds the operator's remaining self-bond headroom" }
  - { error_id: ERR_SURETY_RATING_INELIGIBLE, http_status: 422, trigger: "A SURETY instrument's surety_naic_rating is outside the eligible set" }
  - { error_id: ERR_COLLATERAL_DETAILS_REQUIRED, http_status: 422, trigger: "Instrument-type-conditional fields are missing or supplied for the wrong type" }
  - { error_id: ERR_SUBSTITUTION_TARGET_INVALID, http_status: 409, trigger: "replaces_instrument_id points at another permit's instrument, at a terminal instrument, or at one already replaced" }
  - { error_id: ERR_PERMIT_NOT_COMPLIANT, http_status: 409, trigger: "The permit's compliance_posture is outside {COMPLIANT, NOTICE_ACTIVE} for an operation that requires standing" }
  - { error_id: ERR_UNABATED_VIOLATION, http_status: 409, trigger: "Deciding a bond release while a notice on the permit is ISSUED or CESSATION_ORDERED" }
  - { error_id: ERR_NOTICE_PERIOD_NOT_ELAPSED, http_status: 409, trigger: "Deciding a bond release at or before the application's notice_end_date" }
  - { error_id: ERR_NOTICE_WINDOW_CONFLICT, http_status: 409, trigger: "A new public notice window falls within NOTICE_GAP_DAYS of another window on the same permit" }
  - { error_id: ERR_OBJECTIONS_UNRESOLVED, http_status: 409, trigger: "Approving a release with objection_count > 0 and objections_resolved false" }
  - { error_id: ERR_INSPECTION_NOT_ELIGIBLE, http_status: 409, trigger: "The cited inspection has the wrong permit, type, status or result for the operation" }
  - { error_id: ERR_INSPECTOR_DOUBLE_BOOKED, http_status: 409, trigger: "A new inspection overlaps another SCHEDULED inspection for the same inspector" }
  - { error_id: ERR_RELEASE_EXCEEDS_AVAILABLE, http_status: 422, trigger: "The requested release amount exceeds the held bond above the phase retention floor at decision time" }
  - { error_id: ERR_ACRES_EXCEED_DISTURBED, http_status: 422, trigger: "Requested phase acreage plus already-released phase acreage exceeds disturbed_acres" }
  - { error_id: ERR_RESCISSION_WINDOW_CLOSED, http_status: 409, trigger: "Rescinding an approval more than RESCISSION_WINDOW_DAYS after approved_at" }
  - { error_id: ERR_CESSATION_CRITERIA_NOT_MET, http_status: 409, trigger: "Ordering cessation on a notice that meets no cessation criterion" }
  - { error_id: ERR_REVISION_ROUND_LIMIT, http_status: 409, trigger: "Resubmitting a revision that has already used REVISION_ROUND_CAP rounds" }
  - { error_id: ERR_REVISION_FIELDS_MISMATCH, http_status: 422, trigger: "Revision-type-conditional fields are missing or supplied for the wrong type" }
  - { error_id: ERR_CONTEST_WINDOW_CLOSED, http_status: 409, trigger: "Contesting a proceeding after contest_deadline" }
  - { error_id: ERR_CONTEST_WINDOW_OPEN, http_status: 409, trigger: "Finalizing a proceeding at or before contest_deadline" }
  - { error_id: ERR_PENALTY_AMOUNT_MISMATCH, http_status: 422, trigger: "amount_paid differs from the assessed penalty_amount" }
  - { error_id: ERR_FUNDING_QUEUE_ORDER, http_status: 409, trigger: "Awarding legacy funding to a site that is not the head of the funding queue" }
  - { error_id: ERR_LEGACY_FUND_CAP_EXCEEDED, http_status: 409, trigger: "A legacy award would push cumulative awards past LEGACY_FUND_ANNUAL_CAP" }
  - { error_id: ERR_PERMIT_HAS_OPEN_PROCEEDING, http_status: 409, trigger: "Initiating a second forfeiture proceeding on the same permit" }
  - { error_id: ERR_DECISION_REASON_REQUIRED, http_status: 422, trigger: "decision == DENY without denial_reason, or denial_reason supplied on a non-DENY decision" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - role: Operator
    identity:
      kind: entity_backed
      entity: Operator
      header: X-User-ID
      binding: "X-User-ID is the Operator.id of the acting company; every operator-scoped write is ownership-checked against permit.operator_id at validation priority 6"
    exclusive_operations:
      - "POST /mining/permits"
      - "POST /mining/reclamation-cost-estimates"
      - "POST /mining/bond-instruments"
      - "POST /mining/bond-release-applications"
      - "POST /mining/permit-revisions"
      - "POST /mining/permit-revisions/{id}/resubmit"
      - "POST /mining/permits/{id}/cease-mining"
      - "PATCH /mining/permits/{id}/disturbance"
      - "POST /mining/violation-notices/{id}/abate"
      - "POST /mining/violation-notices/{id}/pay-penalty"
      - "POST /mining/forfeiture-proceedings/{id}/contest"
    shared_operations: ["every GET listed in §1.5 whose roles include Operator", "POST /mining/_clock/set_current_utc"]

  - role: PermitReviewer
    identity:
      kind: opaque
      header: X-User-ID
      binding: "Any non-empty user id; no entity row backs a reviewer, and no ownership rule reads this id"
    exclusive_operations:
      - "POST /mining/permits/{id}/decide"
      - "POST /mining/reclamation-cost-estimates/{id}/accept"
      - "POST /mining/permit-revisions/{id}/request-info"
      - "POST /mining/permit-revisions/{id}/decide"
    shared_operations: ["every GET listed in §1.5 whose roles include PermitReviewer", "POST /mining/_clock/set_current_utc"]

  - role: BondSpecialist
    identity:
      kind: opaque
      header: X-User-ID
      binding: |
        Any non-empty user id, but the id is RECORDED: an acceptance writes
        BondInstrument.accepted_by_user_id and a release decision writes
        BondReleaseApplication.decided_by_user_id. The segregation-of-duties rule
        at validation priority 7 compares the two, so two distinct specialist ids
        are required to complete a bond-then-release lifecycle.
    exclusive_operations:
      - "POST /mining/operators/{id}/financial-test"
      - "POST /mining/permits/{id}/recalculate-bond"
      - "POST /mining/bond-instruments/{id}/accept"
      - "POST /mining/bond-release-applications/{id}/publish-notice"
      - "POST /mining/bond-release-applications/{id}/resolve-objections"
      - "POST /mining/bond-release-applications/{id}/decide"
      - "POST /mining/bond-release-applications/{id}/reinstate"
    shared_operations: ["every GET listed in §1.5 whose roles include BondSpecialist", "POST /mining/_clock/set_current_utc"]

  - role: Inspector
    identity:
      kind: entity_backed
      entity: InspectorProfile
      header: X-User-ID
      binding: "X-User-ID is the InspectorProfile.id of the acting inspector; recording a result and issuing a notice are checked against inspection.inspector_id at validation priority 6"
    exclusive_operations:
      - "POST /mining/inspections/{id}/record-result"
      - "POST /mining/violation-notices"
      - "POST /mining/violation-notices/{id}/order-cessation"
    shared_operations: ["every GET listed in §1.5 whose roles include Inspector", "POST /mining/_clock/set_current_utc"]

  - role: ProgramDirector
    identity:
      kind: opaque
      header: X-User-ID
      binding: "Any non-empty user id; no entity row backs a director, and no ownership rule reads this id"
    exclusive_operations:
      - "POST /mining/operators"
      - "PATCH /mining/operators/{id}/financials"
      - "POST /mining/mine-sites"
      - "POST /mining/mine-sites/{id}/nominate-legacy"
      - "POST /mining/mine-sites/{id}/award-legacy-funding"
      - "POST /mining/inspector-profiles"
      - "POST /mining/inspections"
      - "POST /mining/violation-notices/{id}/vacate"
      - "POST /mining/violation-notices/{id}/assess-penalty"
      - "POST /mining/bond-release-applications/{id}/rescind"
      - "POST /mining/forfeiture-proceedings"
      - "POST /mining/forfeiture-proceedings/{id}/finalize"
      - "POST /mining/forfeiture-proceedings/{id}/record-state-reclamation"
    shared_operations: ["every GET listed in §1.5 whose roles include ProgramDirector", "POST /mining/_clock/set_current_utc"]

  - role: PublicParticipant
    identity:
      kind: opaque
      header: X-User-ID
      binding: "Any non-empty user id representing a member of the public; comments are counted, not attributed to a stored row"
    exclusive_operations:
      - "POST /mining/bond-release-applications/{id}/comment"
    shared_operations: ["every GET listed in §1.5 whose roles include PublicParticipant", "POST /mining/_clock/set_current_utc"]
