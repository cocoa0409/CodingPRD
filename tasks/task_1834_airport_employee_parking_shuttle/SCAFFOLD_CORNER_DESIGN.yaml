            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B002", full_name: "Two", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e2: $.data.id } }
