        claim_type: Violation to Error
        grounds:
          - errors[ERR_STALE_VERSION]
          - concurrency_rules[brand-onboard-stale-program]
          - endpoints.POST_/v1/brand-partners
        distinguishing_aspect: "A brand onboarding submitted with the program version the client first read is refused with ERR_STALE_VERSION (412) once an oversight review has advanced that version, and no BrandPartner row is created."
        test_recipe:
          setup:
