              as: Guest
              captures: { donor_id: $.data.id }
            - call: "POST /beneficiaries/${ben_id}/withdrawal-setup"
              payload: { stripe_account_ref: "acct_test" }
              as: Beneficiary
              as_user_id: "${ben_id}"
            - call: "POST /beneficiaries/${ben_id}/submit-verification"
              payload: {}
              as: Beneficiary
              as_user_id: "${ben_id}"
          trigger:
            - call: "POST /beneficiaries/${ben_id}/approve-verification"
              payload: {}
              as: Donor
              as_user_id: "${donor_id}"
              captures: { err: $.data.error_id }
          assert:
