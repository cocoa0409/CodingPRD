              as: AuctionAdmin
            - call: "POST /auction/lots"
              payload: { sale_id: "${sale_id}", consignment_id: "${cons_id}", lane_id: "${lane_id}", run_number: 1, slot_start_minute: 0, slot_end_minute: 10, starting_bid_cents: 400000 }
              as: AuctionAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /auction/sales/${sale_id}/open"
              payload: {}
              as: AuctionAdmin
            - call: "POST /auction/sales/${sale_id}/start"
              payload: {}
              as: AuctionAdmin
            - call: "POST /auction/lots/${lot_id}/open-bidding"
              payload: {}
              as: AuctionAdmin
              captures: { v0: $.data.version }
            - call: "POST /auction/lots/${lot_id}/bids"
              payload: { buyer_id: "${b1_id}", bid_type: "PROXY", amount_cents: 800000, channel: "LANE", expected_lot_version: "${v0}" }
