      - name: leakage_test_window_buffered_closed_interval_conflict
        grounds:
          - validations[priority=110]
          - errors.ERR_TEST_WINDOW_CONFLICT
          - entities.LeakageTest.fields.window_start_at
          - entities.LeakageTest.fields.window_end_at
        distinguishing_aspect: |
          Opposite interval semantics from the technician-schedule instance: the LeakageTest resource uses
          a CLOSED interval inflated by STABILIZATION_BUFFER_MINUTES = 30 on BOTH ends, so touching
          endpoints DO conflict. Test A 13:00-15:00 buffers to [12:30, 15:30]; test B 16:00-17:00 buffers
          to [15:30, 17:30] and is rejected purely on the shared 15:30 instant, while shifting the start
          by a single minute to 16:01 makes the identical request succeed. The contended resource is a
          duct system, not a technician.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z"
            - "One certified technician, one project, one ELIGIBLE duct system"
            - "A first PRE LeakageTest already exists on that duct system with window 2026-08-01T13:00:00Z..15:00:00Z (status SCHEDULED, i.e. non-REJECTED)"
          setup_api_calls:
