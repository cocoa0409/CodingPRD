  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: place_on_already_placed_order_with_elapsed_window_yields_order_not_draft
        grounds:
          - validations[priority=11]
          - validations[priority=35]
          - errors[ERR_ORDER_NOT_DRAFT]
          - errors[ERR_PICKUP_WINDOW_ELAPSED]
          - state_machines.Order.DRAFT_to_PLACED
        distinguishing_aspect: |
          Category pair STATE (priority 11) vs BUSINESS_TEMPORAL (priority 35): a second place on an order
          that is already PLACED and whose 13:00-13:30 window expired at clock 14:00 violates both rules,
          and the response must be ERR_ORDER_NOT_DRAFT (409), never ERR_PICKUP_WINDOW_ELAPSED - the state
          gate outranks the temporal gate by 24 priority levels.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T11:00:00Z, store in the LUNCH daypart with a PUBLISHED staffing plan for 2026-08-01"
            - "one MOBILE_PREORDER order for the 13:00-13:30 window with one Italian Hoagie line, already successfully placed"
            - "the clock is then advanced to 2026-08-01T14:00:00Z, still inside the LUNCH daypart, so the window has elapsed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: false }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/daypart-transitions"
              payload: { to_daypart: "LUNCH" }
              as: StoreManager
            - call: "GET /stores/${store_id}"
              payload: {}
              as: StoreManager
              captures: { st_v: $.data.version }
            - call: "POST /stores/${store_id}/staffing-plans"
              payload: { service_date: "2026-08-01", daypart: "LUNCH", forecast_txn_count: 300, mto_share_bp: 5000, expected_store_version: "${st_v}" }
              as: StoreManager
              captures: { plan_id: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/publish"
              payload: {}
              as: StoreManager
            - call: "POST /menu-items"
              payload: { sku: "HOAGIE-ITAL", name: "Italian Hoagie", station: "SANDWICH", fulfillment_mode: "MADE_TO_ORDER", base_price_cents: 899, unit_food_cost_cents: 300, prep_seconds: 180, valid_dayparts: ["BREAKFAST", "LUNCH", "DINNER", "OVERNIGHT"], included_premium_count: 1, is_catering_eligible: true }
              as: ChainAdmin
              captures: { hoagie_id: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel: "MOBILE_PREORDER", pickup_window_start: "2026-08-01T13:00:00Z", pickup_window_end: "2026-08-01T13:30:00Z" }
              as: StoreTerminal
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { menu_item_id: "${hoagie_id}", qty: 1 }
              as: StoreTerminal
            - call: "POST /orders/${order_id}/place"
              payload: {}
              as: StoreTerminal
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T14:00:00Z" }
              as: ChainAdmin
          trigger:
            - call: "POST /orders/${order_id}/place"
              payload: {}
              as: StoreTerminal
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_ORDER_NOT_DRAFT"
            - "${err_id} != ERR_PICKUP_WINDOW_ELAPSED"
            - "HTTP status == 409"
            - "Order.${order_id}.production_status == PLACED"
            - "Order.${order_id}.settlement_status == UNPAID"

      - name: batch_plan_into_impaired_unit_reports_safety_error_before_slot_conflict
        grounds:
          - validations[priority=16]
          - validations[priority=25]
          - errors[ERR_HOLDING_UNIT_NOT_OPERATIONAL]
          - errors[ERR_UNIT_SLOT_CONFLICT]
          - calculations.slot_occupancy_conflict
          - state_machines.HoldingUnit.IMPAIRED_to_OPERATIONAL
        distinguishing_aspect: |
          Category pair BUSINESS_SAFETY (priority 16) vs BUSINESS_CONSTRAINT (priority 25): planning a
          batch into slot 1 of an IMPAIRED unit at 09:00, while a PLANNED batch already occupies that slot
          until 12:40, violates both rules and must return ERR_HOLDING_UNIT_NOT_OPERATIONAL. Clearing the
          unit with a verified corrective action and replaying the identical request then returns
          ERR_UNIT_SLOT_CONFLICT, proving the lower-priority violation was present all along.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z; store still in its initial BREAKFAST daypart"
            - "one BAKERY_CASE unit BC-1 with 2 slots; one pretzel batch left in PLANNED in slot 1 with bake_start_at 08:00 and occupancy_end_at 12:40, so it never enters the impairment sweep"
            - "associate assoc-1 has logged a 120 F reading, driving the unit OPERATIONAL -> IMPAIRED with no batches swept"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: false }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/holding-units"
              payload: { unit_code: "BC-1", unit_type: "BAKERY_CASE", min_temp_f: 135, max_temp_f: 185, slot_count: 2 }
              as: StoreManager
              captures: { unit_id: $.data.id }
            - call: "POST /menu-items"
              payload: { sku: "PRETZEL-SOFT", name: "Soft Pretzel", station: "BAKERY", fulfillment_mode: "PAR_BAKED_CASE", base_price_cents: 199, unit_food_cost_cents: 40, bake_minutes: 25, hold_minutes: 240, valid_dayparts: ["BREAKFAST", "LUNCH"], is_catering_eligible: true }
              as: ChainAdmin
              captures: { pretzel_id: $.data.id }
            - call: "POST /production-batches"
              payload: { store_id: "${store_id}", menu_item_id: "${pretzel_id}", holding_unit_id: "${unit_id}", slot_index: 1, planned_qty: 40, bake_start_at: "2026-08-01T08:00:00Z" }
              as: KitchenAssociate
              captures: { batch_a: $.data.id, occ_end: $.data.occupancy_end_at }
            - call: "POST /holding-units/${unit_id}/temperature-logs"
              payload: { reading_f: 120 }
              as: KitchenAssociate
              as_user_id: "assoc-1"
              captures: { log_id: $.data.id }
          trigger:
            - call: "POST /production-batches"
              payload: { store_id: "${store_id}", menu_item_id: "${pretzel_id}", holding_unit_id: "${unit_id}", slot_index: 1, planned_qty: 24, bake_start_at: "2026-08-01T09:00:00Z" }
              as: KitchenAssociate
              captures: { err_first: $.data.error_id }
            - call: "POST /corrective-actions"
              payload: { temperature_log_id: "${log_id}", action_taken: "REPLACED_CASE_THERMOSTAT" }
              as: ShiftLead
              as_user_id: "lead-1"
              captures: { ca_id: $.data.id }
            - call: "POST /corrective-actions/${ca_id}/verify"
              payload: {}
              as: ShiftLead
              as_user_id: "lead-1"
            - call: "POST /production-batches"
              payload: { store_id: "${store_id}", menu_item_id: "${pretzel_id}", holding_unit_id: "${unit_id}", slot_index: 1, planned_qty: 24, bake_start_at: "2026-08-01T09:00:00Z" }
              as: KitchenAssociate
              captures: { err_second: $.data.error_id }
          assert:
            - "${occ_end} == 2026-08-01T12:40:00Z"
            - "${err_first} == ERR_HOLDING_UNIT_NOT_OPERATIONAL"
            - "${err_first} != ERR_UNIT_SLOT_CONFLICT"
            - "first trigger HTTP status == 409"
            - "HoldingUnit.${unit_id}.status == OPERATIONAL"
            - "HoldingUnit.${unit_id}.consecutive_out_of_range_count == 0"
            - "CorrectiveAction.${ca_id}.status == VERIFIED"
            - "${err_second} == ERR_UNIT_SLOT_CONFLICT"
            - "second trigger HTTP status == 409"
            - "ProductionBatch.${batch_a}.status == PLANNED"

  # =========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: peak_multiplier_engages_at_exactly_400_forecast_transactions
        grounds:
          - calculations.staffing_labor_minutes
          - calculations.staffing_labor_minutes.constants.PEAK_TXN_THRESHOLD
          - calculations.staffing_labor_minutes.constants.PEAK_MULTIPLIER_BP
          - entities.StaffingPlan.fields.planned_labor_minutes
          - entities.StaffingPlan.fields.peak_multiplier_bp
        distinguishing_aspect: |
          The >= threshold is probed at exactly PEAK_TXN_THRESHOLD and one below it with inputs chosen so
          that the raw station sum is IDENTICAL (900 minutes) on both sides: at mto_share_bp 4000 both 399
          and 400 ceil to 160 made-to-order transactions, and the grab-and-go terms 239 and 240 both ceil
          to 6 labor hours. So planned_labor_minutes 900 vs 1035 isolates the multiplier alone - an
          implementation using > instead of >= returns 900 for both, and one that rounds mto_txn down
          returns 840 for 399.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T11:00:00Z, store WAWA-0101 transitioned into LUNCH"
            - "two plans are created on DIFFERENT service dates so neither supersedes the other"
            - "each create re-reads Store.version because a plan create bumps it"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: false }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/daypart-transitions"
              payload: { to_daypart: "LUNCH" }
              as: StoreManager
            - call: "GET /stores/${store_id}"
              payload: {}
              as: StoreManager
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /stores/${store_id}/staffing-plans"
              payload: { service_date: "2026-08-01", daypart: "LUNCH", forecast_txn_count: 399, mto_share_bp: 4000, expected_store_version: "${v1}" }
              as: StoreManager
              captures: { below_id: $.data.id, below_minutes: $.data.planned_labor_minutes, below_mult: $.data.peak_multiplier_bp }
            - call: "GET /stores/${store_id}"
              payload: {}
              as: StoreManager
              captures: { v2: $.data.version }
            - call: "POST /stores/${store_id}/staffing-plans"
              payload: { service_date: "2026-08-02", daypart: "LUNCH", forecast_txn_count: 400, mto_share_bp: 4000, expected_store_version: "${v2}" }
              as: StoreManager
              captures: { at_id: $.data.id, at_minutes: $.data.planned_labor_minutes, at_mult: $.data.peak_multiplier_bp }
          assert:
            - "${below_mult} == 10000"
            - "${below_minutes} == 900"
            - "${at_mult} == 11500"
            - "${at_minutes} == 1035"
            - "${at_minutes} - ${below_minutes} == 135"
            - "StaffingPlan.${below_id}.status == DRAFT"
            - "StaffingPlan.${at_id}.status == DRAFT"
            - "StaffingPlan.${below_id}.forecast_txn_count == 399"
            - "StaffingPlan.${at_id}.forecast_txn_count == 400"

      - name: fefo_excludes_a_batch_whose_hold_expires_exactly_at_the_clock
        grounds:
          - calculations.batch_selection_fefo
          - entities.ProductionBatch.fields.hold_expires_at
          - entities.OrderLine.fields.fulfillment_batch_id
          - entities.OrderLine.fields.reserved_qty
          - state_machines.Order.DRAFT_to_PLACED
        distinguishing_aspect: |
          The FEFO filter is `hold_expires_at > clock`, STRICTLY greater. Batch A expires at exactly
          15:00:00Z and batch B at 18:00:00Z; placing at exactly 15:00:00Z must reserve from B. This is the
          adversarial case for FEFO because A is the first-expiring candidate and would win the ranking if
          the boundary were inclusive - so a `>=` implementation picks A and inverts the answer, while an
          off-by-one on the hold window (241 or 239 minutes) shifts A's expiry away from the boundary and
          hides the bug entirely.
        test_recipe:
          setup:
            - "logical clock starts at 2026-08-01T11:00:00Z, store in LUNCH with a PUBLISHED plan for 2026-08-01"
            - "batch A: 40 pretzels pulled at 11:00 in slot 1, so hold_expires_at is 2026-08-01T15:00:00Z"
            - "batch B: 40 pretzels pulled at 14:00 in slot 2, so hold_expires_at is 2026-08-01T18:00:00Z"
            - "the clock is then moved to exactly 2026-08-01T15:00:00Z and a touchscreen order carries a 5-unit pretzel line plus a coffee line that keeps the order in PLACED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
