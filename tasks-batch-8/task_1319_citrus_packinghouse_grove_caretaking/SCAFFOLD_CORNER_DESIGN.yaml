            - { call: "POST /packinghouse/degreening-sessions/${er4_s1}/release", payload: {}, as: LineOperator, as_user_id: "op_er4", captures: { er4_e1: "$.data.error_id" } }
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T12:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/degreening-sessions/${er4_s1}/release", payload: {}, as: LineOperator, as_user_id: "op_er4" }
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T01:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/degreening-sessions/${er4_s2}/release", payload: { override_approved: true }, as: LineOperator, as_user_id: "op_er4", captures: { er4_e2: "$.data.error_id" } }
