scenario: |
  Generate task harder than expert level!

  2701. Warewashing Chemical & Dish Machine Service Program (Ecolab): machine placement with chemical
  supply agreement and minimum term, dispenser calibration and concentration verification on service
  visits, telemetry on cycle counts, temperature and rinse pressure with alerts, service dispatch
  prioritization for down machines in operating hours, product usage versus expected consumption
  variance and theft/dilution investigation, sanitizer efficacy testing and health-inspection support
  documentation, energy and water savings reporting for customer sustainability goals, contract renewal
  and equipment retrieval
domain_name: warewashing-chemical-service-program
api_prefix: "/warewashing"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by explicit foreign keys; only three read paths are nested
  # (telemetry-readings under a placement, calibration-records under a visit and under a
  # dispenser) because those children are append-only evidence records with no standalone
  # identity in the product surface. Every other resource is addressed as a flat collection
  # with FK query filters.

  state_machine_shape: parallel
  # MachinePlacement carries TWO independent state axes on one row: placement_status
  # (PENDING_INSTALL -> INSTALLED -> RETRIEVAL_SCHEDULED -> RETRIEVED) and operational_status
  # (UP <-> DEGRADED <-> DOWN -> OFFLINE), which evolve independently. ServiceAgreement is
  # cyclic (ACTIVE -> RENEWAL_PENDING -> ACTIVE), InvestigationCase is cyclic
  # (EVIDENCE_GATHERING -> PENDING_REVIEW -> EVIDENCE_GATHERING), ServiceVisit is branching
  # (SUBMITTED -> {VERIFIED, REJECTED} with disjoint side-effect sets).

  relationship_patterns:
    - one_to_many
    - self_referential      # ServiceVisit.follow_up_to_visit_id -> ServiceVisit.id
    - cross_aggregate       # UsageVarianceReview spans Site x ChemicalProduct x telemetry x deliveries

  role_model: segregation_of_duties
  # The QualityAuditor who authors a UsageVarianceReview may not publish it, and the auditor who
  # opens an InvestigationCase may not adjudicate it. Field work (ServiceTechnician) and evidence
  # adjudication (QualityAuditor) are strictly separated; commercial actions (AccountManager) can
  # touch neither.

  consistency_model: immediate

entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: legal name of the foodservice account
        constraints: 1..120 chars, required
      - name: billing_status
        type: enum
        source: input
        description: commercial standing gate for equipment placement and chemical delivery
        default: CURRENT
        constraints: "one of {CURRENT, CREDIT_HOLD}"
      - name: sustainability_goal_water_l
        type: integer
        source: input
        description: annual water-reduction goal in litres used as the denominator of goal attainment
        constraints: ">= 1, required"
      - name: equipment_on_placement_value_cents
        type: integer
        source: computed
        description: |
          Conserved equipment ledger. Equals SUM over MachinePlacement rows of this customer whose
          placement_status IN {PENDING_INSTALL, INSTALLED, RETRIEVAL_SCHEDULED} of
          MachineModel.equipment_value_cents. Credited back on retrieval completion.
        default: 0
      - name: active_agreement_count
        type: integer
        source: computed
        description: count of ServiceAgreement rows of this customer whose status IN {ACTIVE, RENEWAL_PENDING}
        default: 0

  - name: Site
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: FK -> Customer.id; owning account, immutable after creation
      - name: name
        type: string
        source: input
        description: kitchen / location label
        constraints: 1..120 chars, required
      - name: region_code
        type: string
        source: input
        description: dispatch region; a technician is eligible only when Technician.region_code equals this value
        constraints: "2..4 uppercase chars, required"
      - name: priority_tier
        type: enum
        source: input
        description: contractual service tier feeding the dispatch priority score
        default: STANDARD
        constraints: "one of {STANDARD, PREMIUM}"
      - name: operating_window_start_minute_utc
        type: integer
        source: input
        description: inclusive start of the daily operating window, minutes after 00:00 UTC
        constraints: "0..1439, required"
      - name: operating_window_end_minute_utc
        type: integer
        source: input
        description: |
          exclusive end of the daily operating window, minutes after 00:00 UTC. When end <= start the
          window wraps past midnight and membership is (minute >= start OR minute < end).
        constraints: "0..1439, required, may be <= start (wrapping window)"
      - name: baseline_water_l_per_rack
        type: number
        source: input
        description: pre-program litres of water per rack, the sustainability comparison baseline
        constraints: "> 0, 2 decimals"
      - name: baseline_kwh_per_rack
        type: number
        source: input
        description: pre-program kWh per rack, the sustainability comparison baseline
        constraints: "> 0, 2 decimals"
      - name: water_cost_cents_per_1000l
        type: integer
        source: input
        description: customer water tariff used to monetise litres saved
        constraints: ">= 0"
      - name: energy_cost_cents_per_kwh
        type: integer
        source: input
        description: customer energy tariff used to monetise kWh saved
        constraints: ">= 0"
      - name: service_posture
        type: enum
        source: computed
        description: |
          Derived gate gating variance publication. CRITICAL when at least one ServiceTicket of this
          site has status IN {QUEUED, DISPATCHED, ON_SITE, PENDING_VERIFICATION} and priority_score
          >= 700; else ELEVATED when at least one such ticket exists; else NORMAL.
        default: NORMAL
        constraints: "one of {NORMAL, ELEVATED, CRITICAL}"
      - name: open_ticket_count
        type: integer
        source: computed
        description: count of ServiceTicket rows on this site's placements with status IN {QUEUED, DISPATCHED, ON_SITE, PENDING_VERIFICATION}
        default: 0
      - name: status
        type: enum
        source: input
        description: site lifecycle
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED, CLOSED}"

  - name: ChemicalProduct
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: unique product code
        constraints: "unique across ChemicalProduct, required"
      - name: product_type
        type: enum
        source: input
        description: role of the chemical in the wash cycle
        constraints: "one of {DETERGENT, RINSE_AID, SANITIZER}, required"
      - name: concentration_target_ppm
        type: integer
        source: input
        description: label target concentration used as the drift denominator
        constraints: "> 0, required"
      - name: concentration_tolerance_pct
        type: number
        source: input
        description: absolute drift percentage still counted as PASS on a calibration record
        default: 10.00
        constraints: "> 0, 2 decimals"
      - name: spec_dose_ml_per_rack
        type: number
        source: input
        description: nameplate dose per rack used by the NAMEPLATE consumption variant
        constraints: "> 0, 2 decimals, required"
      - name: unit_size_ml
        type: integer
        source: input
        description: millilitres per shipped container
        constraints: "> 0, required"
      - name: unit_price_cents
        type: integer
        source: input
        description: undiscounted price per container
        constraints: ">= 0, required"
      - name: sanitizer_min_ppm
        type: integer
        source: input
        description: minimum efficacy concentration; required when product_type is SANITIZER, otherwise must be omitted
        constraints: "> 0 when present"
      - name: sanitizer_max_ppm
        type: integer
        source: input
        description: maximum efficacy concentration; required when product_type is SANITIZER, otherwise must be omitted
        constraints: "> sanitizer_min_ppm when present"
      - name: min_contact_seconds
        type: integer
        source: input
        description: minimum sanitizer contact time for an efficacy PASS; required when product_type is SANITIZER
        default: 7
        constraints: ">= 1 when present"

  - name: MachineModel
    parent: null
    common_fields: true
    fields:
      - name: model_code
        type: string
        source: input
        description: unique machine model code
        constraints: "unique across MachineModel, required"
      - name: machine_class
        type: enum
        source: input
        description: machine family
        constraints: "one of {UNDERCOUNTER, DOOR_TYPE, CONVEYOR}, required"
      - name: racks_per_hour
        type: integer
        source: input
        description: rated throughput; the HIGH_CYCLE_RATE alert fires above 1.10x this rate
        constraints: "> 0, required"
      - name: rated_water_l_per_rack
        type: number
        source: input
        description: nameplate litres per rack, used by the RATED sustainability basis
        constraints: "> 0, 2 decimals, required"
      - name: rated_kwh_per_rack
        type: number
        source: input
        description: nameplate kWh per rack
        constraints: "> 0, 2 decimals, required"
      - name: min_final_rinse_temp_f
        type: integer
        source: input
        description: minimum sanitising final-rinse temperature in Fahrenheit
        constraints: "> 0, required"
      - name: min_wash_temp_f
        type: integer
        source: input
        description: minimum wash-tank temperature in Fahrenheit
        constraints: "> 0, required"
      - name: min_rinse_pressure_psi
        type: integer
        source: input
        description: minimum final-rinse line pressure in psi
        constraints: "> 0, required"
      - name: max_rinse_pressure_psi
        type: integer
        source: input
        description: maximum final-rinse line pressure in psi
        constraints: "> min_rinse_pressure_psi, required"
      - name: equipment_value_cents
        type: integer
        source: input
        description: book value of the placed machine; drives the unamortized-equipment termination variant
        constraints: "> 0, required"
      - name: max_cycles_between_calibrations
        type: integer
        source: input
        description: cycle budget after which a CALIBRATION_OVERDUE alert fires
        constraints: "> 0, required"

  - name: ServiceAgreement
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: FK -> Customer.id; account the chemical supply agreement belongs to
      - name: agreement_code
        type: string
        source: input
        description: unique contract number
        constraints: "unique across ServiceAgreement, required"
      - name: start_date
        type: string
        source: input
        description: ISO date (YYYY-MM-DD) the minimum term starts counting from
        constraints: "required, YYYY-MM-DD"
      - name: minimum_term_months
        type: integer
        source: input
        description: contractual minimum term in whole months; also the amortization denominator
        constraints: ">= 1, required"
      - name: term_end_date
        type: string
        source: computed
        description: |
          start_date advanced by minimum_term_months calendar months (same day-of-month, clamped to the
          last day of the target month) at activation; each renewal advances it by the renewal term_months.
      - name: monthly_minimum_spend_cents
        type: integer
        source: input
        description: committed monthly chemical spend feeding the remaining-minimum termination variant
        constraints: ">= 0, required"
      - name: covered_product_ids
        type: array
        source: input
        description: |
          ChemicalProduct.id values the agreement supplies. A Dispenser may only be created for a
          product whose id appears here.
        constraints: "non-empty array of existing ChemicalProduct ids"
      - name: renewal_notice_days
        type: integer
        source: input
        description: how many days before term_end_date the renewal window opens
        default: 60
        constraints: ">= 1"
      - name: auto_renew
        type: boolean
        source: input
        description: informational flag surfaced on renewal notices; does not itself renew the agreement
        default: false
      - name: status
        type: enum
        source: system
        description: agreement lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, RENEWAL_PENDING, EXPIRED, TERMINATED, VOID}"
      - name: renewal_count
        type: integer
        source: computed
        description: number of accepted renewals
        default: 0
      - name: placement_count
        type: integer
        source: computed
        description: count of MachinePlacement rows on this agreement whose placement_status IN {PENDING_INSTALL, INSTALLED, RETRIEVAL_SCHEDULED}
        default: 0
      - name: early_termination_fee_cents
        type: integer
        source: computed
        description: fee stamped at termination by the early_termination_fee calculation; null until TERMINATED
      - name: termination_effective_date
        type: string
        source: computed
        description: ISO date the termination takes effect; null until TERMINATED

  - name: MachinePlacement
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: FK -> Site.id; kitchen the machine is installed in
      - name: agreement_id
        type: string
        source: input
        description: FK -> ServiceAgreement.id; agreement financing the placement
      - name: machine_model_id
        type: string
        source: input
        description: FK -> MachineModel.id; rated specification of the placed machine
      - name: asset_tag
        type: string
        source: input
        description: asset label, unique across all MachinePlacement rows whose placement_status != RETRIEVED
        constraints: "required, 1..40 chars"
      - name: placement_status
        type: enum
        source: system
        description: lifecycle axis of the placement, independent of operational_status
        default: PENDING_INSTALL
        constraints: "one of {PENDING_INSTALL, INSTALLED, RETRIEVAL_SCHEDULED, RETRIEVED, CANCELLED}"
      - name: operational_status
        type: enum
        source: system
        description: health axis of the placement, independent of placement_status
        default: UP
        constraints: "one of {UP, DEGRADED, DOWN, OFFLINE}"
      - name: installed_at
        type: datetime
        source: system
        description: logical-clock instant of installation; null before install
      - name: initial_cycle_count
        type: integer
        source: input
        description: odometer reading captured at install; the first telemetry delta is measured against it
        default: 0
        constraints: ">= 0"
      - name: last_cycle_count
        type: integer
        source: computed
        description: cycle_count_total of the latest DEVICE TelemetryReading of this placement, else initial_cycle_count
        default: 0
      - name: cycles_since_calibration
        type: integer
        source: computed
        description: last_cycle_count minus the last_cycle_count observed when the most recent CalibrationRecord of this placement was applied
        default: 0
      - name: open_alert_count
        type: integer
        source: computed
        description: count of TelemetryAlert rows of this placement with status IN {OPEN, ACKNOWLEDGED}
        default: 0
      - name: retrieval_due_date
        type: string
        source: system
        description: ISO date retrieval is due; set when placement_status becomes RETRIEVAL_SCHEDULED
      - name: retrieved_at
        type: datetime
        source: system
        description: logical-clock instant retrieval completed; null until RETRIEVED

  - name: Dispenser
    parent: null
    common_fields: true
    fields:
      - name: placement_id
        type: string
        source: input
        description: FK -> MachinePlacement.id; machine the dispenser is plumbed into
      - name: product_id
        type: string
        source: input
        description: FK -> ChemicalProduct.id; product this dispenser meters
      - name: dispenser_status
        type: enum
        source: system
        description: dispenser lifecycle
        default: ACTIVE
        constraints: "one of {ACTIVE, LOCKED_OUT, REMOVED}"
      - name: calibrated_dose_ml_per_rack
        type: number
        source: input
        description: dose per rack currently in effect; supplied as initial_dose_ml_per_rack at creation
        constraints: "> 0, 2 decimals"
      - name: prior_dose_ml_per_rack
        type: number
        source: system
        description: dose in effect before the most recently applied calibration; restored when a visit is REJECTED
      - name: dose_effective_at
        type: datetime
        source: system
        description: logical-clock instant calibrated_dose_ml_per_rack took effect; equals created_at until a calibration is applied
      - name: last_calibrated_at
        type: datetime
        source: system
        description: logical-clock instant of the most recently applied CalibrationRecord; null when never calibrated
      - name: last_drift_pct
        type: number
        source: system
        description: drift_pct of the most recently applied CalibrationRecord; null when never calibrated
      - name: lockout_reason
        type: enum
        source: system
        description: why the dispenser is LOCKED_OUT; null when not locked out
        constraints: "one of {EFFICACY_FAILURE, AGREEMENT_ENDED, INVESTIGATION_HOLD}"

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: field technician name
        constraints: "1..120 chars, required"
      - name: region_code
        type: string
        source: input
        description: dispatch region the technician serves
        constraints: "2..4 uppercase chars, required"
      - name: certification_level
        type: enum
        source: input
        description: capability tier; SANITATION_CERTIFIED is mandatory for sanitation tickets
        constraints: "one of {L1, L2, SANITATION_CERTIFIED}, required"
      - name: status
        type: enum
        source: input
        description: dispatch availability
        default: AVAILABLE
        constraints: "one of {AVAILABLE, OFF_DUTY, SUSPENDED}"
      - name: open_ticket_count
        type: integer
        source: computed
        description: |
          Conserved workload counter. Count of ServiceTicket rows assigned to this technician whose
          status IN {DISPATCHED, ON_SITE, PENDING_VERIFICATION}.
        default: 0
      - name: quality_flag_count
        type: integer
        source: computed
        description: number of this technician's ServiceVisit rows that ended in visit_status REJECTED
        default: 0

  - name: TelemetryReading
    parent: null
    common_fields: false
    fields:
      - name: placement_id
        type: string
        source: input
        description: FK -> MachinePlacement.id; machine that emitted the reading
      - name: reading_at
        type: datetime
        source: input
        description: instant the machine sampled the cycle; must be >= MachinePlacement.installed_at
        constraints: "ISO 8601 UTC, required"
      - name: cycle_count_total
        type: integer
        source: input
        description: cumulative rack odometer; must be >= MachinePlacement.last_cycle_count
        constraints: ">= 0, monotonic per placement"
      - name: wash_temp_f
        type: integer
        source: input
        description: wash-tank temperature at the sampled cycle
        constraints: "0..250, required"
      - name: final_rinse_temp_f
        type: integer
        source: input
        description: final-rinse temperature at the sampled cycle
        constraints: "0..250, required"
      - name: rinse_pressure_psi
        type: integer
        source: input
        description: final-rinse line pressure at the sampled cycle
        constraints: "0..80, required"
      - name: source
        type: enum
        source: input
        description: |
          DEVICE readings are the only ones that feed rack counts, consumption expectations and
          sustainability averages; MANUAL_AUDIT readings are recorded for the inspection dossier only.
        default: DEVICE
        constraints: "one of {DEVICE, MANUAL_AUDIT}"
      - name: cycle_delta
        type: integer
        source: computed
        description: |
          cycle_count_total minus the cycle_count_total of the immediately preceding DEVICE reading of
          the same placement (greatest reading_at strictly less than this reading_at; tie-break
          created_at ASC). When no preceding DEVICE reading exists, minus MachinePlacement.initial_cycle_count.
        default: 0
      - name: triggered_alert_types
        type: array
        source: computed
        description: alert_type values of the TelemetryAlert rows this reading opened, in the fixed evaluation order

  - name: TelemetryAlert
    parent: null
    common_fields: true
    fields:
      - name: placement_id
        type: string
        source: input
        description: FK -> MachinePlacement.id; machine the alert belongs to
      - name: triggering_reading_id
        type: string
        source: system
        description: FK -> TelemetryReading.id; reading whose values breached a threshold
      - name: alert_type
        type: enum
        source: system
        description: which threshold was breached
        constraints: "one of {LOW_FINAL_RINSE_TEMP, LOW_WASH_TEMP, LOW_RINSE_PRESSURE, HIGH_RINSE_PRESSURE, HIGH_CYCLE_RATE, CALIBRATION_OVERDUE}"
      - name: severity
        type: enum
        source: computed
        description: CRITICAL alerts take the machine DOWN; WARNING alerts only degrade it
        constraints: "one of {WARNING, CRITICAL}"
      - name: status
        type: enum
        source: system
        description: alert lifecycle
        default: OPEN
        constraints: "one of {OPEN, ACKNOWLEDGED, RESOLVED, SUPPRESSED}"
      - name: opened_at
        type: datetime
        source: system
        description: logical-clock instant the alert was opened
      - name: acknowledged_by_user_id
        type: string
        source: system
        description: X-User-ID of the ServiceTechnician who acknowledged the alert; null while OPEN
      - name: measured_value
        type: number
        source: system
        description: the breaching value copied from the triggering reading (temperature, psi or racks/hour)

  - name: ServiceTicket
    parent: null
    common_fields: true
    fields:
      - name: placement_id
        type: string
        source: input
        description: FK -> MachinePlacement.id; machine needing service
      - name: alert_id
        type: string
        source: system
        description: FK -> TelemetryAlert.id; alert that auto-raised the ticket; null for customer reports
      - name: assigned_technician_id
        type: string
        source: system
        description: FK -> Technician.id; technician chosen by the dispatch selector; null while QUEUED
      - name: origin
        type: enum
        source: system
        description: how the ticket entered the queue
        constraints: "one of {CUSTOMER_REPORT, TELEMETRY_AUTO}"
      - name: reported_symptom
        type: enum
        source: input
        description: symptom driving the base priority component
        constraints: "one of {MACHINE_DOWN, LOW_TEMP, NO_CHEMICAL, LEAK, RACK_QUALITY}, required for customer reports"
      - name: requires_sanitation_cert
        type: boolean
        source: computed
        description: |
          true when reported_symptom IN {LOW_TEMP, NO_CHEMICAL} or the linked alert_id has alert_type
          LOW_FINAL_RINSE_TEMP; restricts the eligible technician pool to certification_level SANITATION_CERTIFIED
        default: false
      - name: priority_score
        type: integer
        source: computed
        description: dispatch priority stamped once at ticket creation by the dispatch_priority_score calculation
      - name: response_deadline_at
        type: datetime
        source: computed
        description: creation instant plus the SLA minutes selected by the priority_score band
      - name: status
        type: enum
        source: system
        description: ticket lifecycle
        default: QUEUED
        constraints: "one of {QUEUED, DISPATCHED, ON_SITE, PENDING_VERIFICATION, CLOSED, CANCELLED}"
      - name: sla_breached
        type: boolean
        source: computed
        description: set true when the logical clock advances past response_deadline_at while status IN {QUEUED, DISPATCHED, ON_SITE}
        default: false
      - name: escalation_level
        type: integer
        source: computed
        description: incremented once each time a clock advance first observes the ticket past its response_deadline_at
        default: 0
      - name: reported_by_user_id
        type: string
        source: system
        description: X-User-ID of the reporter; the Customer id for CUSTOMER_REPORT, null for TELEMETRY_AUTO

  - name: ServiceVisit
    parent: null
    common_fields: true
    fields:
      - name: ticket_id
        type: string
        source: input
        description: FK -> ServiceTicket.id; ticket the visit services
      - name: technician_id
        type: string
        source: input
        description: FK -> Technician.id; technician performing the visit
      - name: follow_up_to_visit_id
        type: string
        source: input
        description: FK -> ServiceVisit.id; prior REJECTED visit this visit re-does; null for a first visit
      - name: scheduled_start_at
        type: datetime
        source: input
        description: inclusive start of the booked on-site window
        constraints: "ISO 8601 UTC, required"
      - name: scheduled_end_at
        type: datetime
        source: input
        description: exclusive end of the booked on-site window; must be > scheduled_start_at
        constraints: "ISO 8601 UTC, required"
      - name: visit_status
        type: enum
        source: system
        description: visit lifecycle
        default: SCHEDULED
        constraints: "one of {SCHEDULED, IN_PROGRESS, SUBMITTED, VERIFIED, REJECTED, CANCELLED}"
      - name: arrival_at
        type: datetime
        source: system
        description: logical-clock instant the technician arrived; null until IN_PROGRESS
      - name: repair_confirmed
        type: boolean
        source: input
        description: technician's assertion at submit that the machine is operable again
        default: false
      - name: rejection_reason
        type: string
        source: system
        description: auditor's reason when visit_status is REJECTED
      - name: calibration_record_count
        type: integer
        source: computed
        description: count of CalibrationRecord rows attached to this visit
        default: 0
      - name: verified_by_user_id
        type: string
        source: system
        description: X-User-ID of the QualityAuditor who adjudicated the visit; null until VERIFIED or REJECTED

  - name: CalibrationRecord
    parent: null
    common_fields: false
    fields:
      - name: visit_id
        type: string
        source: input
        description: FK -> ServiceVisit.id; visit during which the reading was taken
      - name: dispenser_id
        type: string
        source: input
        description: FK -> Dispenser.id; dispenser measured
      - name: measured_ppm
        type: integer
        source: input
        description: titrated concentration measured at the machine
        constraints: ">= 0, required"
      - name: measured_dose_ml_per_rack
        type: number
        source: input
        description: dose the dispenser actually delivered per rack, measured by draw-down
        constraints: "> 0, 2 decimals, required"
      - name: adjusted_dose_ml_per_rack
        type: number
        source: input
        description: dose the technician set the dispenser to; required when the verdict is ADJUSTED
        constraints: "> 0, 2 decimals when present"
      - name: contact_seconds
        type: integer
        source: input
        description: measured sanitizer contact time; required when the dispenser's product_type is SANITIZER
        constraints: ">= 0 when present"
      - name: drift_pct
        type: number
        source: computed
        description: signed percentage deviation of measured_ppm from the product's concentration_target_ppm, 2 decimals
      - name: calibration_verdict
        type: enum
        source: computed
        description: verdict from the concentration_drift_verdict calculation
        constraints: "one of {PASS, ADJUSTED, FAIL}"
      - name: efficacy_result
        type: enum
        source: computed
        description: sanitizer efficacy outcome; NOT_APPLICABLE for non-sanitizer products
        constraints: "one of {PASS, FAIL, NOT_APPLICABLE}"
      - name: applied
        type: boolean
        source: computed
        description: true once the owning visit reached VERIFIED and the adjusted dose was written to the dispenser
        default: false
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the ServiceTechnician who recorded the measurement

  - name: ChemicalDelivery
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: FK -> Site.id; kitchen the product was dropped at
      - name: product_id
        type: string
        source: input
        description: FK -> ChemicalProduct.id; product delivered
      - name: delivered_at
        type: datetime
        source: input
        description: instant of delivery; used to place the delivery inside a variance period
        constraints: "ISO 8601 UTC, required"
      - name: unit_count
        type: integer
        source: input
        description: number of containers dropped
        constraints: ">= 1, required"
      - name: quantity_ml
        type: integer
        source: computed
        description: unit_count multiplied by ChemicalProduct.unit_size_ml
      - name: amount_cents
        type: integer
        source: computed
        description: billed amount from the delivery_amount calculation (per-unit discount rounded, then multiplied)
      - name: status
        type: enum
        source: system
        description: delivery lifecycle
        default: DELIVERED
        constraints: "one of {DELIVERED, VOIDED}"

  - name: UsageVarianceReview
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: FK -> Site.id; kitchen whose consumption is reviewed
      - name: product_id
        type: string
        source: input
        description: FK -> ChemicalProduct.id; product whose consumption is reviewed
      - name: period_start
        type: datetime
        source: input
        description: inclusive start of the review window
        constraints: "ISO 8601 UTC, required"
      - name: period_end
        type: datetime
        source: input
        description: exclusive end of the review window; must be > period_start
        constraints: "ISO 8601 UTC, required"
      - name: basis
        type: enum
        source: input
        description: which expected-consumption variant to evaluate
        constraints: "one of {NAMEPLATE, AS_CALIBRATED}, required"
      - name: opening_inventory_ml
        type: integer
        source: input
        description: counted stock on hand at period_start
        constraints: ">= 0, required"
      - name: ending_inventory_ml
        type: integer
        source: input
        description: counted stock on hand at period_end
        constraints: ">= 0, required"
      - name: rack_count_in_period
        type: integer
        source: computed
        description: sum of cycle_delta over DEVICE TelemetryReading rows of this site's placements with reading_at in [period_start, period_end)
        default: 0
      - name: expected_consumption_ml
        type: integer
        source: computed
        description: output of the expected_chemical_consumption calculation under the selected basis
      - name: actual_consumption_ml
        type: integer
        source: computed
        description: opening_inventory_ml plus delivered millilitres inside the window minus ending_inventory_ml
      - name: variance_pct
        type: number
        source: computed
        description: signed percentage of actual over expected, 2 decimals; null when expected_consumption_ml is 0
      - name: classification
        type: enum
        source: computed
        description: output of the usage_variance_classification calculation
        constraints: "one of {WITHIN_TOLERANCE, OVERUSE, UNDERUSE, DILUTION_SUSPECT, THEFT_SUSPECT, INSUFFICIENT_DATA}"
      - name: status
        type: enum
        source: system
        description: review lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, PUBLISHED, ESCALATED, CLOSED}"
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the QualityAuditor who drafted the review
      - name: published_by_user_id
        type: string
        source: system
        description: X-User-ID of the QualityAuditor who published the review; must differ from created_by_user_id

  - name: InvestigationCase
    parent: null
    common_fields: true
    fields:
      - name: variance_review_id
        type: string
        source: input
        description: FK -> UsageVarianceReview.id; published review that justifies the investigation
      - name: opened_reason
        type: enum
        source: input
        description: hypothesis under investigation
        constraints: "one of {SUSPECTED_THEFT, SUSPECTED_DILUTION, DISPENSER_FAULT}, required"
      - name: case_status
        type: enum
        source: system
        description: investigation lifecycle with an evidence-return cycle
        default: EVIDENCE_GATHERING
        constraints: "one of {EVIDENCE_GATHERING, PENDING_REVIEW, SUBSTANTIATED, UNSUBSTANTIATED}"
      - name: evidence_item_count
        type: integer
        source: computed
        description: cumulative number of evidence items submitted across all submit-for-review calls
        default: 0
      - name: return_count
        type: integer
        source: computed
        description: number of times adjudication returned the case for more evidence
        default: 0
      - name: remediation
        type: enum
        source: system
        description: remediation ordered at adjudication; NONE when the case is UNSUBSTANTIATED
        default: NONE
        constraints: "one of {NONE, TRAINING, DISPENSER_REPLACEMENT, CHARGEBACK}"
      - name: chargeback_cents
        type: integer
        source: computed
        description: output of the theft_chargeback calculation; 0 unless the case is SUBSTANTIATED with remediation CHARGEBACK
        default: 0
      - name: opened_by_user_id
        type: string
        source: system
        description: X-User-ID of the QualityAuditor who opened the case
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the QualityAuditor who adjudicated the case; must differ from opened_by_user_id
      - name: finding_note
        type: string
        source: system
        description: adjudication note captured at review time

state_machines:
  - entity: ServiceAgreement
    dimension: status
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED, VOID]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /warewashing/service-agreements/{agreement_id}/activate"
        actor: AccountManager
        preconditions:
          - "status == DRAFT"
          - "every id in covered_product_ids resolves to an existing ChemicalProduct"
        side_effects:
          - "term_end_date = start_date advanced by minimum_term_months calendar months (same day-of-month, clamped to the last day of the target month)"
          - "Customer.active_agreement_count recomputed (+1)"
          - "increments ServiceAgreement.version by 1"
      - from: DRAFT
        to: VOID
        trigger: "POST /warewashing/service-agreements/{agreement_id}/terminate"
        actor: AccountManager
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "early_termination_fee_cents = 0 (an unactivated agreement carries no fee)"
          - "termination_effective_date = request effective_date"
          - "increments ServiceAgreement.version by 1"
        note: "Terminating a DRAFT agreement voids it instead of terminating it; no placement cascade runs because a DRAFT agreement cannot carry placements."
      - from: ACTIVE
        to: RENEWAL_PENDING
        trigger: "system: POST /warewashing/_clock/set_current_utc advances the clock into the renewal notice window"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "days_until(term_end_date) <= renewal_notice_days"
          - "current_utc < term_end_date at 00:00:00Z"
        side_effects:
          - "increments ServiceAgreement.version by 1"
        note: "days_until(d) = floor((d at 00:00:00Z - current_utc) / 86400 seconds). Evaluated for every ACTIVE agreement in created_at ASC order on each clock advance."
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /warewashing/service-agreements/{agreement_id}/renewal"
        actor: AccountManager
        preconditions:
          - "status == ACTIVE"
          - "days_until(term_end_date) <= renewal_notice_days, else ERR_RENEWAL_WINDOW_NOT_OPEN"
        side_effects:
          - "term_end_date advanced by the request's term_months calendar months"
          - "renewal_count incremented by 1"
          - "increments ServiceAgreement.version by 1"
        note: "Self-loop: renewing inside the window while still ACTIVE keeps the status and only extends the term."
      - from: RENEWAL_PENDING
        to: ACTIVE
        trigger: "POST /warewashing/service-agreements/{agreement_id}/renewal"
        actor: AccountManager
        preconditions:
          - "status == RENEWAL_PENDING"
        side_effects:
          - "term_end_date advanced by the request's term_months calendar months"
          - "renewal_count incremented by 1"
          - "increments ServiceAgreement.version by 1"
        note: "Closes the ACTIVE -> RENEWAL_PENDING -> ACTIVE cycle; no window check is needed because the clock already opened the window."
      - from: RENEWAL_PENDING
        to: EXPIRED
        trigger: "system: POST /warewashing/_clock/set_current_utc advances the clock past term_end_date"
        actor: system
        preconditions:
          - "status == RENEWAL_PENDING"
          - "current_utc >= term_end_date at 00:00:00Z"
        side_effects:
          - "CASCADE alpha link 1: Customer.active_agreement_count recomputed (-1)"
          - "CASCADE alpha link 2 (caused by the agreement reaching EXPIRED): every MachinePlacement of this agreement with placement_status == INSTALLED transitions to RETRIEVAL_SCHEDULED with retrieval_due_date = date(current_utc) + 30 days, processed in placement created_at ASC order"
          - "CASCADE alpha link 3 (caused by each placement reaching RETRIEVAL_SCHEDULED): every Dispenser of that placement with dispenser_status == ACTIVE becomes LOCKED_OUT with lockout_reason AGREEMENT_ENDED"
          - "CASCADE alpha link 4 (caused by each dispenser lockout): every TelemetryAlert of that placement with status IN {OPEN, ACKNOWLEDGED} becomes SUPPRESSED"
          - "every ServiceTicket of those placements with status == QUEUED becomes CANCELLED"
          - "increments ServiceAgreement.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: POST /warewashing/_clock/set_current_utc advances the clock past term_end_date"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "current_utc >= term_end_date at 00:00:00Z"
        side_effects:
          - "identical CASCADE alpha links 1-4 as the RENEWAL_PENDING -> EXPIRED transition"
          - "increments ServiceAgreement.version by 1"
        note: "Reachable when a single clock advance jumps past both the notice window and term_end_date; the RENEWAL_PENDING hop is skipped."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /warewashing/service-agreements/{agreement_id}/terminate"
        actor: AccountManager
        preconditions:
          - "status IN {ACTIVE, RENEWAL_PENDING}"
          - "request effective_date >= date(current_utc)"
        side_effects:
          - "early_termination_fee_cents = early_termination_fee calculation output"
          - "termination_effective_date = request effective_date"
          - "Customer.active_agreement_count recomputed (-1)"
          - "CASCADE alpha links 2-4 run identically (placements to RETRIEVAL_SCHEDULED, dispensers LOCKED_OUT with lockout_reason AGREEMENT_ENDED, open alerts SUPPRESSED, QUEUED tickets CANCELLED)"
          - "increments ServiceAgreement.version by 1"
      - from: RENEWAL_PENDING
        to: TERMINATED
        trigger: "POST /warewashing/service-agreements/{agreement_id}/terminate"
        actor: AccountManager
        preconditions:
          - "status IN {ACTIVE, RENEWAL_PENDING}"
          - "request effective_date >= date(current_utc)"
        side_effects:
          - "identical to the ACTIVE -> TERMINATED transition"
          - "increments ServiceAgreement.version by 1"

  - entity: MachinePlacement
    dimension: placement_status
    initial_state: PENDING_INSTALL
    terminal_states: [RETRIEVED, CANCELLED]
    transitions:
      - from: PENDING_INSTALL
        to: INSTALLED
        trigger: "POST /warewashing/machine-placements/{placement_id}/install"
        actor: ServiceTechnician
        preconditions:
          - "placement_status == PENDING_INSTALL"
          - "ServiceAgreement(agreement_id).status == ACTIVE, else ERR_AGREEMENT_NOT_ACTIVE"
          - "Site(site_id).status == ACTIVE"
        side_effects:
          - "installed_at = current_utc"
          - "last_cycle_count stays at initial_cycle_count (supplied at placement creation, default 0); cycles_since_calibration stays 0"
          - "operational_status unchanged (stays UP): the two axes are independent"
      - from: PENDING_INSTALL
        to: CANCELLED
        trigger: "POST /warewashing/machine-placements/{placement_id}/retrieval-order"
        actor: AccountManager
        preconditions:
          - "placement_status == PENDING_INSTALL"
        side_effects:
          - "operational_status = OFFLINE"
          - "Customer.equipment_on_placement_value_cents recomputed (-MachineModel.equipment_value_cents)"
          - "ServiceAgreement.placement_count recomputed (-1); increments ServiceAgreement.version by 1"
        note: "A never-installed placement is cancelled rather than scheduled for retrieval; the equipment ledger is credited back at once."
      - from: INSTALLED
        to: RETRIEVAL_SCHEDULED
        trigger: "POST /warewashing/machine-placements/{placement_id}/retrieval-order, or CASCADE alpha link 2 from an agreement reaching EXPIRED or TERMINATED"
        actor: AccountManager | system
        preconditions:
          - "placement_status == INSTALLED"
        side_effects:
          - "retrieval_due_date = request retrieval_due_date when supplied by an AccountManager, else date(current_utc) + 30 days when driven by CASCADE alpha"
          - "every Dispenser of this placement with dispenser_status == ACTIVE becomes LOCKED_OUT with lockout_reason AGREEMENT_ENDED"
          - "caused by each dispenser lockout: every TelemetryAlert of this placement with status IN {OPEN, ACKNOWLEDGED} becomes SUPPRESSED"
          - "every ServiceTicket of this placement with status == QUEUED becomes CANCELLED (their scheduled ServiceVisit rows become CANCELLED)"
          - "Site.service_posture and Site.open_ticket_count recomputed"
      - from: RETRIEVAL_SCHEDULED
        to: RETRIEVED
        trigger: "POST /warewashing/machine-placements/{placement_id}/retrieval-completion"
        actor: ServiceTechnician
        preconditions:
          - "placement_status == RETRIEVAL_SCHEDULED"
          - "no ServiceTicket of this placement has status IN {DISPATCHED, ON_SITE, PENDING_VERIFICATION}, else ERR_OPEN_TICKET_BLOCKS_RETRIEVAL"
        side_effects:
          - "retrieved_at = current_utc"
          - "operational_status = OFFLINE"
          - "every Dispenser of this placement becomes REMOVED with lockout_reason cleared to null"
          - "Customer.equipment_on_placement_value_cents recomputed (-MachineModel.equipment_value_cents), restoring the conserved equipment ledger to its pre-placement value"
          - "ServiceAgreement.placement_count recomputed (-1); increments ServiceAgreement.version by 1"

  - entity: MachinePlacement
    dimension: operational_status
    initial_state: UP
    terminal_states: [OFFLINE]
    transitions:
      - from: UP
        to: DEGRADED
        trigger: "system: a TelemetryAlert with severity WARNING is opened by POST /warewashing/machine-placements/{placement_id}/telemetry-readings, or a Dispenser of this placement becomes LOCKED_OUT with lockout_reason INVESTIGATION_HOLD"
        actor: system
        preconditions:
          - "operational_status == UP"
          - "placement_status == INSTALLED"
        side_effects:
          - "no change to placement_status: the axes are independent"
      - from: UP
        to: DOWN
        trigger: "system: a TelemetryAlert with severity CRITICAL is opened, or a CalibrationRecord with efficacy_result FAIL locks the sanitizer dispenser out, or POST /warewashing/service-tickets is filed with reported_symptom MACHINE_DOWN"
        actor: system
        preconditions:
          - "operational_status IN {UP, DEGRADED}"
          - "placement_status == INSTALLED"
        side_effects:
          - "CASCADE beta link 3 (caused by the placement reaching DOWN): a ServiceTicket is auto-created with origin TELEMETRY_AUTO when no ServiceTicket of this placement has status IN {QUEUED, DISPATCHED, ON_SITE, PENDING_VERIFICATION}"
      - from: DEGRADED
        to: DOWN
        trigger: "system: a TelemetryAlert with severity CRITICAL is opened, or a sanitizer efficacy FAIL locks the dispenser out"
        actor: system
        preconditions:
          - "operational_status == DEGRADED"
          - "placement_status == INSTALLED"
        side_effects:
          - "same auto-ticket rule as UP -> DOWN"
      - from: DOWN
        to: UP
        trigger: "system: a ServiceVisit on this placement's ticket reaches VERIFIED with repair_confirmed true"
        actor: system
        preconditions:
          - "operational_status == DOWN"
          - "after the visit's alert-resolution side effect, this placement has no TelemetryAlert with status IN {OPEN, ACKNOWLEDGED}"
          - "no Dispenser of this placement has dispenser_status == LOCKED_OUT"
        side_effects:
          - "Site.service_posture recomputed"
      - from: DOWN
        to: DEGRADED
        trigger: "system: a ServiceVisit on this placement's ticket reaches VERIFIED with repair_confirmed true while a WARNING alert or a dispenser lockout remains"
        actor: system
        preconditions:
          - "operational_status == DOWN"
          - "at least one TelemetryAlert with status IN {OPEN, ACKNOWLEDGED} remains, or at least one Dispenser is LOCKED_OUT"
        side_effects:
          - "Site.service_posture recomputed"
        note: "Together with DEGRADED -> DOWN this closes the DOWN <-> DEGRADED cycle on the health axis."
      - from: DEGRADED
        to: UP
        trigger: "system: a ServiceVisit on this placement's ticket reaches VERIFIED with repair_confirmed true and no alert or lockout remains"
        actor: system
        preconditions:
          - "operational_status == DEGRADED"
          - "no TelemetryAlert with status IN {OPEN, ACKNOWLEDGED} remains and no Dispenser is LOCKED_OUT"
        side_effects:
          - "Site.service_posture recomputed"
      - from: UP
        to: OFFLINE
        trigger: "POST /warewashing/machine-placements/{placement_id}/retrieval-order on a PENDING_INSTALL placement, or POST /warewashing/machine-placements/{placement_id}/retrieval-completion"
        actor: AccountManager | ServiceTechnician
        preconditions:
          - "placement_status transitions to CANCELLED or RETRIEVED in the same request"
        side_effects:
          - "the placement stops accepting telemetry: POST telemetry-readings is rejected with ERR_PLACEMENT_NOT_INSTALLED"
      - from: DOWN
        to: OFFLINE
        trigger: "POST /warewashing/machine-placements/{placement_id}/retrieval-completion"
        actor: ServiceTechnician
        preconditions:
          - "placement_status transitions to RETRIEVED in the same request"
        side_effects:
          - "Site.service_posture recomputed"
      - from: DEGRADED
        to: OFFLINE
        trigger: "POST /warewashing/machine-placements/{placement_id}/retrieval-completion"
        actor: ServiceTechnician
        preconditions:
          - "placement_status transitions to RETRIEVED in the same request"
        side_effects:
          - "Site.service_posture recomputed"

  - entity: Dispenser
    dimension: dispenser_status
    initial_state: ACTIVE
    terminal_states: [REMOVED]
    transitions:
      - from: ACTIVE
        to: LOCKED_OUT
        trigger: "system: POST /warewashing/service-visits/{visit_id}/calibration-records produces efficacy_result FAIL, or CASCADE alpha link 3 (agreement ended), or CASCADE gamma link 3 (investigation closed SUBSTANTIATED with remediation DISPENSER_REPLACEMENT)"
        actor: system
        preconditions:
          - "dispenser_status == ACTIVE"
        side_effects:
          - "lockout_reason = EFFICACY_FAILURE | AGREEMENT_ENDED | INVESTIGATION_HOLD depending on the trigger"
          - "caused by the lockout: MachinePlacement.operational_status becomes DOWN when lockout_reason == EFFICACY_FAILURE, or DEGRADED when lockout_reason == INVESTIGATION_HOLD"
          - "caused by an AGREEMENT_ENDED lockout: every TelemetryAlert of the placement with status IN {OPEN, ACKNOWLEDGED} becomes SUPPRESSED"
          - "increments Dispenser.version by 1"
      - from: LOCKED_OUT
        to: ACTIVE
        trigger: "system: a later CalibrationRecord on this dispenser reaches efficacy_result PASS inside a visit that reaches VERIFIED"
        actor: system
        preconditions:
          - "dispenser_status == LOCKED_OUT"
          - "lockout_reason == EFFICACY_FAILURE (AGREEMENT_ENDED and INVESTIGATION_HOLD lockouts are not cleared by re-testing)"
        side_effects:
          - "lockout_reason = null"
          - "increments Dispenser.version by 1"
        note: "Closes the ACTIVE -> LOCKED_OUT -> ACTIVE cycle used to resolve a sanitizer efficacy failure."
      - from: ACTIVE
        to: REMOVED
        trigger: "POST /warewashing/machine-placements/{placement_id}/retrieval-completion"
        actor: ServiceTechnician
        preconditions:
          - "the owning MachinePlacement transitions to RETRIEVED in the same request"
        side_effects:
          - "lockout_reason = null"
          - "increments Dispenser.version by 1"
      - from: LOCKED_OUT
        to: REMOVED
        trigger: "POST /warewashing/machine-placements/{placement_id}/retrieval-completion"
        actor: ServiceTechnician
        preconditions:
          - "the owning MachinePlacement transitions to RETRIEVED in the same request"
        side_effects:
          - "lockout_reason = null"
          - "increments Dispenser.version by 1"

  - entity: TelemetryAlert
    dimension: status
    initial_state: OPEN
    terminal_states: [RESOLVED, SUPPRESSED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /warewashing/telemetry-alerts/{alert_id}/acknowledge"
        actor: ServiceTechnician
        preconditions:
          - "status == OPEN"
        side_effects:
          - "acknowledged_by_user_id = X-User-ID"
          - "MachinePlacement.open_alert_count unchanged (ACKNOWLEDGED still counts as open)"
      - from: OPEN
        to: RESOLVED
        trigger: "system: a ServiceVisit on this placement's ticket reaches VERIFIED with repair_confirmed true"
        actor: system
        preconditions:
          - "status IN {OPEN, ACKNOWLEDGED}"
        side_effects:
          - "MachinePlacement.open_alert_count recomputed"
      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "system: a ServiceVisit on this placement's ticket reaches VERIFIED with repair_confirmed true"
        actor: system
        preconditions:
          - "status IN {OPEN, ACKNOWLEDGED}"
        side_effects:
          - "MachinePlacement.open_alert_count recomputed"
      - from: OPEN
        to: SUPPRESSED
        trigger: "system: CASCADE alpha link 4 - a Dispenser of this placement was locked out with lockout_reason AGREEMENT_ENDED"
        actor: system
        preconditions:
          - "status IN {OPEN, ACKNOWLEDGED}"
        side_effects:
          - "MachinePlacement.open_alert_count recomputed"
      - from: ACKNOWLEDGED
        to: SUPPRESSED
        trigger: "system: CASCADE alpha link 4 - a Dispenser of this placement was locked out with lockout_reason AGREEMENT_ENDED"
        actor: system
        preconditions:
          - "status IN {OPEN, ACKNOWLEDGED}"
        side_effects:
          - "MachinePlacement.open_alert_count recomputed"

  - entity: ServiceTicket
    dimension: status
    initial_state: QUEUED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: QUEUED
        to: DISPATCHED
        trigger: "POST /warewashing/service-tickets/{ticket_id}/dispatch"
        actor: PlatformAdmin
        preconditions:
          - "status == QUEUED, else ERR_TICKET_NOT_DISPATCHABLE"
          - "the dispatch_technician_selection candidate set is non-empty, else ERR_NO_ELIGIBLE_TECHNICIAN and no state changes"
        side_effects:
          - "assigned_technician_id = the technician chosen by dispatch_technician_selection"
          - "Technician.open_ticket_count recomputed (+1) for the chosen technician"
      - from: DISPATCHED
        to: ON_SITE
        trigger: "POST /warewashing/service-visits/{visit_id}/arrive"
        actor: ServiceTechnician
        preconditions:
          - "status == DISPATCHED"
          - "the arriving ServiceVisit.technician_id == assigned_technician_id"
        side_effects:
          - "Technician.open_ticket_count unchanged (DISPATCHED and ON_SITE both count as open workload)"
      - from: ON_SITE
        to: PENDING_VERIFICATION
        trigger: "POST /warewashing/service-visits/{visit_id}/submit"
        actor: ServiceTechnician
        preconditions:
          - "status == ON_SITE"
        side_effects:
          - "Technician.open_ticket_count unchanged"
      - from: PENDING_VERIFICATION
        to: CLOSED
        trigger: "system: POST /warewashing/service-visits/{visit_id}/verify with decision VERIFIED"
        actor: system
        preconditions:
          - "status == PENDING_VERIFICATION"
        side_effects:
          - "Technician.open_ticket_count recomputed (-1)"
          - "Site.open_ticket_count and Site.service_posture recomputed"
      - from: PENDING_VERIFICATION
        to: QUEUED
        trigger: "system: POST /warewashing/service-visits/{visit_id}/verify with decision REJECTED"
        actor: system
        preconditions:
          - "status == PENDING_VERIFICATION"
        side_effects:
          - "assigned_technician_id = null"
          - "Technician.open_ticket_count recomputed (-1) for the rejected visit's technician, restoring the conserved workload identity"
          - "Technician.quality_flag_count recomputed (+1)"
          - "priority_score and response_deadline_at are NOT recomputed: both are stamped once at ticket creation"
        note: "Closes the QUEUED -> DISPATCHED -> ON_SITE -> PENDING_VERIFICATION -> QUEUED cycle; the ticket can be re-dispatched to a different technician."
      - from: QUEUED
        to: CANCELLED
        trigger: "system: the owning MachinePlacement transitions to RETRIEVAL_SCHEDULED or CANCELLED"
        actor: system
        preconditions:
          - "status == QUEUED"
        side_effects:
          - "every ServiceVisit of this ticket with visit_status == SCHEDULED becomes CANCELLED"
          - "Site.open_ticket_count and Site.service_posture recomputed"

  - entity: ServiceVisit
    dimension: visit_status
    initial_state: SCHEDULED
    terminal_states: [VERIFIED, REJECTED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /warewashing/service-visits/{visit_id}/arrive"
        actor: ServiceTechnician
        preconditions:
          - "visit_status == SCHEDULED"
          - "ServiceTicket(ticket_id).status == DISPATCHED and its assigned_technician_id == this visit's technician_id"
        side_effects:
          - "arrival_at = current_utc"
          - "ServiceTicket(ticket_id).status becomes ON_SITE"
      - from: IN_PROGRESS
        to: SUBMITTED
        trigger: "POST /warewashing/service-visits/{visit_id}/submit"
        actor: ServiceTechnician
        preconditions:
          - "visit_status == IN_PROGRESS, else ERR_VISIT_NOT_IN_PROGRESS"
          - "calibration_record_count >= 1"
          - "for every Dispenser measured in this visit, the latest CalibrationRecord on that dispenser in this visit does not have efficacy_result == FAIL, else ERR_EFFICACY_FAILURE_UNRESOLVED"
        side_effects:
          - "repair_confirmed = request repair_confirmed"
          - "ServiceTicket(ticket_id).status becomes PENDING_VERIFICATION"
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /warewashing/service-visits/{visit_id}/verify with decision VERIFIED"
        actor: QualityAuditor
        preconditions:
          - "visit_status == SUBMITTED"
          - "ServiceTicket(ticket_id).status == PENDING_VERIFICATION"
        side_effects:
          - "verified_by_user_id = X-User-ID"
          - "BRANCH A: every CalibrationRecord of this visit with calibration_verdict IN {PASS, ADJUSTED} gets applied = true; for each such record Dispenser.prior_dose_ml_per_rack = current calibrated_dose_ml_per_rack, then calibrated_dose_ml_per_rack = adjusted_dose_ml_per_rack when the verdict is ADJUSTED (unchanged when PASS), dose_effective_at = current_utc, last_calibrated_at = current_utc, last_drift_pct = record.drift_pct, cycles_since_calibration reset to 0, and Dispenser.version incremented by 1; records with calibration_verdict FAIL are never applied"
          - "BRANCH A: a dispenser LOCKED_OUT with lockout_reason EFFICACY_FAILURE whose latest record in this visit has efficacy_result PASS returns to ACTIVE"
          - "BRANCH A: when repair_confirmed is true, every TelemetryAlert of the placement with status IN {OPEN, ACKNOWLEDGED} becomes RESOLVED, then MachinePlacement.operational_status is re-derived (UP when nothing remains, DEGRADED when a lockout or alert remains)"
          - "BRANCH A: ServiceTicket becomes CLOSED, Technician.open_ticket_count recomputed (-1), Site.open_ticket_count and Site.service_posture recomputed"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /warewashing/service-visits/{visit_id}/verify with decision REJECTED"
        actor: QualityAuditor
        preconditions:
          - "visit_status == SUBMITTED"
          - "request rejection_reason is present"
        side_effects:
          - "verified_by_user_id = X-User-ID; rejection_reason = request rejection_reason"
          - "BRANCH B: no CalibrationRecord of this visit is applied - every Dispenser keeps its calibrated_dose_ml_per_rack, prior_dose_ml_per_rack, dose_effective_at, last_calibrated_at and last_drift_pct exactly as before the visit"
          - "BRANCH B: no TelemetryAlert changes status and MachinePlacement.operational_status is unchanged"
          - "BRANCH B: ServiceTicket returns to QUEUED with assigned_technician_id cleared, Technician.open_ticket_count recomputed (-1), Technician.quality_flag_count recomputed (+1)"
        note: "The VERIFIED and REJECTED branches share a source state but have disjoint side-effect sets; REJECTED is the compensating branch that leaves the dose ledger and the alert set untouched."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: the owning ServiceTicket becomes CANCELLED because its placement was scheduled for retrieval"
        actor: system
        preconditions:
          - "visit_status == SCHEDULED"
        side_effects:
          - "the technician's booked window is released, so it no longer participates in technician_visit_window_overlap detection"

  - entity: UsageVarianceReview
    dimension: status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /warewashing/usage-variance-reviews/{review_id}/publish"
        actor: QualityAuditor
        preconditions:
          - "status == DRAFT, else ERR_REVIEW_NOT_DRAFT"
          - "X-User-ID != created_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "Site(site_id).service_posture != CRITICAL, else ERR_SITE_POSTURE_CRITICAL"
          - "classification != INSUFFICIENT_DATA, else ERR_INSUFFICIENT_TELEMETRY"
        side_effects:
          - "published_by_user_id = X-User-ID"
          - "expected_consumption_ml, actual_consumption_ml, variance_pct and classification are frozen at their DRAFT values and are never recomputed afterwards"
      - from: PUBLISHED
        to: ESCALATED
        trigger: "system: POST /warewashing/investigation-cases opens a case against this review"
        actor: system
        preconditions:
          - "status == PUBLISHED"
        side_effects:
          - "increments UsageVarianceReview.version by 1"
      - from: PUBLISHED
        to: CLOSED
        trigger: "POST /warewashing/usage-variance-reviews/{review_id}/close"
        actor: QualityAuditor
        preconditions:
          - "status == PUBLISHED"
          - "classification NOT IN {THEFT_SUSPECT, DILUTION_SUSPECT}, else the review must be escalated to an InvestigationCase first (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "increments UsageVarianceReview.version by 1"
      - from: ESCALATED
        to: CLOSED
        trigger: "system: CASCADE gamma link 2 - the InvestigationCase of this review reaches SUBSTANTIATED or UNSUBSTANTIATED"
        actor: system
        preconditions:
          - "status == ESCALATED"
        side_effects:
          - "CASCADE gamma link 3 (caused by the review reaching CLOSED with the case's remediation): when remediation == DISPENSER_REPLACEMENT, every Dispenser of this site metering this review's product_id whose dispenser_status == ACTIVE becomes LOCKED_OUT with lockout_reason INVESTIGATION_HOLD, processed in dispenser created_at ASC order"
          - "CASCADE gamma link 4 (caused by each INVESTIGATION_HOLD lockout): that dispenser's MachinePlacement.operational_status becomes DEGRADED when it was UP"
          - "increments UsageVarianceReview.version by 1"

  - entity: InvestigationCase
    dimension: case_status
    initial_state: EVIDENCE_GATHERING
    terminal_states: [SUBSTANTIATED, UNSUBSTANTIATED]
    transitions:
      - from: EVIDENCE_GATHERING
        to: PENDING_REVIEW
        trigger: "POST /warewashing/investigation-cases/{case_id}/submit-for-review"
        actor: QualityAuditor
        preconditions:
          - "case_status == EVIDENCE_GATHERING"
          - "the request's evidence_types array is non-empty"
        side_effects:
          - "evidence_item_count incremented by the length of the request's evidence_types array"
      - from: PENDING_REVIEW
        to: EVIDENCE_GATHERING
        trigger: "POST /warewashing/investigation-cases/{case_id}/review with decision RETURN"
        actor: QualityAuditor
        preconditions:
          - "case_status == PENDING_REVIEW, else ERR_CASE_NOT_IN_REVIEW"
          - "X-User-ID is neither opened_by_user_id nor the linked UsageVarianceReview.published_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "return_count incremented by 1"
          - "finding_note = request finding_note"
          - "the linked UsageVarianceReview stays ESCALATED"
        note: "Closes the EVIDENCE_GATHERING -> PENDING_REVIEW -> EVIDENCE_GATHERING cycle; the case may loop any number of times."
      - from: PENDING_REVIEW
        to: SUBSTANTIATED
        trigger: "POST /warewashing/investigation-cases/{case_id}/review with decision SUBSTANTIATE"
        actor: QualityAuditor
        preconditions:
          - "case_status == PENDING_REVIEW, else ERR_CASE_NOT_IN_REVIEW"
          - "X-User-ID is neither opened_by_user_id nor the linked UsageVarianceReview.published_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "evidence_item_count >= 2"
        side_effects:
          - "reviewed_by_user_id = X-User-ID; remediation = request remediation; finding_note = request finding_note"
          - "chargeback_cents = theft_chargeback calculation output when remediation == CHARGEBACK, else 0"
          - "CASCADE gamma link 2 (caused by the case reaching a terminal state): the linked UsageVarianceReview transitions ESCALATED -> CLOSED, which in turn fires CASCADE gamma links 3 and 4"
      - from: PENDING_REVIEW
        to: UNSUBSTANTIATED
        trigger: "POST /warewashing/investigation-cases/{case_id}/review with decision DISMISS"
        actor: QualityAuditor
        preconditions:
          - "case_status == PENDING_REVIEW, else ERR_CASE_NOT_IN_REVIEW"
          - "X-User-ID is neither opened_by_user_id nor the linked UsageVarianceReview.published_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "reviewed_by_user_id = X-User-ID; remediation = NONE; chargeback_cents = 0; finding_note = request finding_note"
          - "CASCADE gamma link 2: the linked UsageVarianceReview transitions ESCALATED -> CLOSED; because remediation is NONE, links 3 and 4 do not fire and every Dispenser keeps dispenser_status ACTIVE"

  - entity: ChemicalDelivery
    dimension: status
    initial_state: DELIVERED
    terminal_states: [VOIDED]
    transitions:
      - from: DELIVERED
        to: VOIDED
        trigger: "POST /warewashing/chemical-deliveries/{delivery_id}/void"
        actor: AccountManager
        preconditions:
          - "status == DELIVERED, else ERR_INVALID_STATE_TRANSITION (a delivery cannot be voided twice)"
          - "no UsageVarianceReview of the same (site_id, product_id) with status IN {PUBLISHED, ESCALATED, CLOSED} has a window containing delivered_at, else ERR_DELIVERY_IN_CLOSED_PERIOD - a published variance figure may not be rewritten under itself. A DRAFT review does not block the void."
        side_effects:
          - "the delivery leaves every aggregate that filters on status == DELIVERED: usage_variance_classification's delivered_ml, theft_chargeback's inputs through the review it feeds, and sustainability_savings' chemical_spend_cents. A review created after the void therefore reports a different actual_consumption_ml over the same window, while a review published before the void keeps its frozen figures."
          - "increments Site.version by 1"

concurrency_rules:
  - rule_id: placement-create-stale-agreement
    parent_entity: ServiceAgreement
    write_endpoint: "POST /warewashing/machine-placements"
    occ_field: "expected_agreement_version"
    description: |
      Creating a MachinePlacement against a ServiceAgreement whose version has advanced since the
      client last observed it is rejected. Placing a second machine on the same agreement is itself
      legitimate, so the request cannot be refused by any state precondition; the stale version is the
      only signal that the client's view of the agreement (its term, its covered products, its
      placement ledger) predates another accepted write.
    error_id: ERR_STALE_PARENT_VERSION
    http_status: 412

  - rule_id: delivery-create-stale-site
    parent_entity: Site
    write_endpoint: "POST /warewashing/chemical-deliveries"
    occ_field: "expected_site_version"
    description: |
      Recording a ChemicalDelivery against a Site whose version has advanced since the client last
      observed it is rejected. Repeated deliveries of the same product to the same site are legitimate,
      so no state precondition can refuse the second write; the stale version means the delivery was
      priced against an out-of-date view of the site's inventory ledger.
    error_id: ERR_STALE_PARENT_VERSION
    http_status: 412

  - rule_id: calibration-record-stale-dispenser
    parent_entity: Dispenser
    write_endpoint: "POST /warewashing/service-visits/{visit_id}/calibration-records"
    occ_field: "expected_dispenser_version"
    description: |
      Recording a CalibrationRecord against a Dispenser whose version has advanced since the client
      last observed it is rejected. A later record on the same dispenser legitimately supersedes the
      earlier one (that is how an efficacy failure is cleared), so the write cannot be refused on
      state grounds; the stale version means the technician measured against a dose that has since
      been superseded.
    error_id: ERR_STALE_PARENT_VERSION
    http_status: 412

calculations:
  - name: rack_count_in_period
    trigger: "on POST /warewashing/usage-variance-reviews (stamped into rack_count_in_period), and on every read of GET /warewashing/sites/{site_id}/sustainability-report and GET /warewashing/sites/{site_id}/inspection-dossier"
    algorithm: aggregation
    formula: |
      # Per placement p of the site (placement_status IN {INSTALLED, RETRIEVAL_SCHEDULED, RETRIEVED}):
      #   readings(p) = TelemetryReading rows with placement_id == p.id
      #                 AND source == DEVICE
      #                 AND period_start <= reading_at < period_end        # half-open window
      #   racks(p) = SUM over readings(p) of reading.cycle_delta
      # racks_total = SUM over placements p of racks(p)
      #
      # cycle_delta of a reading r is fixed at insert time:
      #   prev(r) = the TelemetryReading with the same placement_id, source == DEVICE and the greatest
      #             reading_at strictly less than r.reading_at; when two candidates share that
      #             reading_at, the one with the smaller created_at wins.
      #   cycle_delta = r.cycle_count_total - (prev(r).cycle_count_total if prev(r) exists
      #                                        else MachinePlacement.initial_cycle_count)
      # A reading whose reading_at falls outside the window contributes nothing even when the cycles it
      # counts were partly accrued inside the window: attribution is by reading_at, not by interpolation.
    input_set: "DEVICE readings only; MANUAL_AUDIT readings are excluded from every rack count. Placements with placement_status IN {PENDING_INSTALL, CANCELLED} contribute nothing."
    constants: {}
    precision: "integer racks, no rounding"

  - name: expected_chemical_consumption
    trigger: "on POST /warewashing/usage-variance-reviews, stamped into UsageVarianceReview.expected_consumption_ml"
    algorithm: forward_looking
    formula: |
      # dispensers(product) = Dispenser rows whose product_id == review.product_id, whose placement_id
      #   belongs to review.site_id, and whose dispenser_status IN {ACTIVE, LOCKED_OUT}
      #   (REMOVED dispensers are excluded).
      # For each such dispenser d, racks(d) = racks(d.placement) from rack_count_in_period.
      #
      # variant NAMEPLATE:
      #   expected_exact = SUM over d of racks(d) * ChemicalProduct.spec_dose_ml_per_rack
      #
      # variant AS_CALIBRATED:
      #   For each DEVICE reading r inside the window on d's placement, the dose in effect at
      #   r.reading_at is:
      #     dose_at(d, t) = the adjusted_dose_ml_per_rack of the CalibrationRecord on d with
      #                     applied == true and the greatest applied_at <= t,
      #                     where applied_at is the ServiceVisit's verification instant;
      #                     when no such record exists, d.calibrated_dose_ml_per_rack as it stood at
      #                     d.dose_effective_at, i.e. the dispenser's creation dose.
      #   expected_exact = SUM over d, SUM over readings r of r.cycle_delta * dose_at(d, r.reading_at)
      #
      # expected_consumption_ml = round_half_up(expected_exact, 0)      # rounded ONCE, at the very end
    input_set: "Dispensers with dispenser_status IN {ACTIVE, LOCKED_OUT} on placements of the review's site; DEVICE readings with reading_at in [period_start, period_end)."
    constants: {}
    precision: "per-dispenser and per-reading products are kept exact; a single round_half_up to whole millilitres is applied to the site-level sum (deliberately the opposite order from early_termination_fee)"
    variants:
      - name: NAMEPLATE
        when: "review.basis == NAMEPLATE"
        difference: "prices every rack at ChemicalProduct.spec_dose_ml_per_rack, ignoring the dispenser's calibration history"
      - name: AS_CALIBRATED
        when: "review.basis == AS_CALIBRATED"
        difference: "prices each reading's cycle_delta at the dose that was in effect at that reading's reading_at, so an applied mid-period calibration splits the period into differently-priced segments"

  - name: usage_variance_classification
    trigger: "on POST /warewashing/usage-variance-reviews, stamped into UsageVarianceReview.variance_pct and classification"
    algorithm: threshold
    formula: |
      delivered_ml = SUM over ChemicalDelivery rows with site_id == review.site_id
                     AND product_id == review.product_id AND status == DELIVERED
                     AND period_start <= delivered_at < period_end          # half-open window
                     of quantity_ml
      actual_consumption_ml = opening_inventory_ml + delivered_ml - ending_inventory_ml
      variance_pct = round_half_up((actual_consumption_ml - expected_consumption_ml)
                                   / expected_consumption_ml * 100, 2)      # null when expected == 0
      # classification, evaluated strictly in this order; the FIRST matching branch wins:
      #   1. expected_consumption_ml == 0                              -> INSUFFICIENT_DATA
      #   2. variance_pct > 25.00 AND delivered_ml > 0                 -> THEFT_SUSPECT
      #   3. variance_pct < -15.00 AND dilution_evidence               -> DILUTION_SUSPECT
      #   4. variance_pct > 8.00                                       -> OVERUSE
      #   5. variance_pct < -8.00                                      -> UNDERUSE
      #   6. otherwise                                                 -> WITHIN_TOLERANCE
      # dilution_evidence = there exists a CalibrationRecord with applied == true on a Dispenser of this
      #   site metering review.product_id whose owning ServiceVisit reached VERIFIED at an instant in
      #   [period_start, period_end) and whose drift_pct <= -10.00
    input_set: "Deliveries with status DELIVERED only (VOIDED deliveries are excluded); applied calibration records inside the window only."
    constants:
      THEFT_VARIANCE_PCT: 25.00
      DILUTION_VARIANCE_PCT: -15.00
      OVERUSE_VARIANCE_PCT: 8.00
      UNDERUSE_VARIANCE_PCT: -8.00
      DILUTION_DRIFT_PCT: -10.00
    precision: "variance_pct to 2 decimals, round_half_up; comparisons use the rounded value"

  - name: early_termination_fee
    trigger: "on POST /warewashing/service-agreements/{agreement_id}/terminate from status IN {ACTIVE, RENEWAL_PENDING}, stamped into ServiceAgreement.early_termination_fee_cents"
    algorithm: waterfall_allocation
    formula: |
      remaining_months = ceil(days_between(termination_effective_date, term_end_date) / 30)   # 0 when <= 0
      # termination_effective_date is the `effective_date` supplied on the terminate request and stamped
      # onto the agreement; term_end_date is the agreement's computed end (extended by any renewal).
      #
      # variant REMAINING_MINIMUM (chronological commitment view):
      #   variant_a_cents = round_half_up(remaining_months * monthly_minimum_spend_cents
      #                                  * SHORTFALL_RATE, 0)
      #
      # variant UNAMORTIZED_EQUIPMENT (asset recovery view):
      #   placements = MachinePlacement rows of this agreement with placement_status IN
      #                {PENDING_INSTALL, INSTALLED, RETRIEVAL_SCHEDULED}, in created_at ASC order
      #   PER-PLACEMENT ROUNDING IS PINNED: each placement's unamortized value is rounded to whole
      #   cents FIRST, then the rounded values are summed. Summing exact fractions and rounding once
      #   at the end is WRONG and can differ by one or more cents.
      #   variant_b_cents = SUM over placements p of
      #       round_half_up(MachineModel.equipment_value_cents
      #                     * remaining_months / minimum_term_months, 0)
      #
      # early_termination_fee_cents = max(variant_a_cents, variant_b_cents)
    input_set: "Placements whose placement_status IN {PENDING_INSTALL, INSTALLED, RETRIEVAL_SCHEDULED}; RETRIEVED and CANCELLED placements are excluded."
    constants:
      SHORTFALL_RATE: 0.60
      DAYS_PER_BILLING_MONTH: 30
    precision: "whole cents, round_half_up, applied per placement inside variant_b BEFORE summation"
    variants:
      - name: REMAINING_MINIMUM
        when: "always evaluated"
        difference: "recovers the unspent chemical commitment: remaining months times the monthly minimum times SHORTFALL_RATE"
      - name: UNAMORTIZED_EQUIPMENT
        when: "always evaluated"
        difference: "recovers the unamortized book value of every machine still on site; wins whenever equipment value dominates the chemical commitment"

  - name: dispatch_priority_score
    trigger: "on ServiceTicket creation - both POST /warewashing/service-tickets and the auto-ticket created by CASCADE beta link 3 - stamped once into priority_score and response_deadline_at"
    algorithm: weighted_scoring
    formula: |
      # EVALUATION ORDER IS PINNED: every component is read from the state as it stands BEFORE this
      # ticket row is inserted. In particular the ticket being created never counts towards
      # posture_component, and a CUSTOMER_REPORT with reported_symptom MACHINE_DOWN scores against the
      # placement's PRE-REQUEST operational_status (the request's own UP -> DOWN side effect is applied
      # only after the score is stamped).
      base = { MACHINE_DOWN: 400, LOW_TEMP: 300, NO_CHEMICAL: 250, LEAK: 200, RACK_QUALITY: 100 }[reported_symptom]
      if placement.operational_status == DOWN:
          down_component = 300 if in_operating_window(current_utc, site) else 90
      elif placement.operational_status == DEGRADED:
          down_component = 60
      else:
          down_component = 0
      tier_component = 120 if site.priority_tier == PREMIUM else 0
      sanitation_component = 200 if EXISTS TelemetryAlert with placement_id == ticket.placement_id
                                   AND status IN {OPEN, ACKNOWLEDGED}
                                   AND alert_type == LOW_FINAL_RINSE_TEMP else 0
      posture_component = 80 if site.service_posture == ELEVATED else 0
      priority_score = min(base + down_component + tier_component
                           + sanitation_component + posture_component, SCORE_CEILING)
      #
      # in_operating_window(t, site):
      #   m = (t.hour * 60 + t.minute)
      #   if site.operating_window_start_minute_utc < site.operating_window_end_minute_utc:
      #       return start <= m < end
      #   else:                                     # wrapping window
      #       return m >= start or m < end
      #
      # SLA band selection (>= is inclusive at every boundary):
      #   priority_score >= 700 -> 120 minutes
      #   priority_score >= 400 -> 240 minutes
      #   otherwise             -> 480 minutes
      # response_deadline_at = current_utc + sla_minutes
    input_set: "The placement's operational_status and the site's service_posture as of the instant before insertion; alerts with status IN {OPEN, ACKNOWLEDGED} only."
    constants:
      SCORE_CEILING: 1000
      DOWN_IN_HOURS: 300
      DOWN_OUT_OF_HOURS: 90
      DEGRADED_COMPONENT: 60
      PREMIUM_TIER_COMPONENT: 120
      SANITATION_COMPONENT: 200
      ELEVATED_POSTURE_COMPONENT: 80
      SLA_BAND_HIGH_SCORE: 700
      SLA_BAND_HIGH_MINUTES: 120
      SLA_BAND_MID_SCORE: 400
      SLA_BAND_MID_MINUTES: 240
      SLA_BAND_LOW_MINUTES: 480
    precision: "integer score; response_deadline_at is an ISO 8601 UTC instant of the form YYYY-MM-DDTHH:MM:SSZ, exactly sla_minutes after the creation instant"

  - name: dispatch_technician_selection
    trigger: "on POST /warewashing/service-tickets/{ticket_id}/dispatch when the request omits override_technician_id"
    algorithm: constraint_propagation
    formula: |
      # (a) ELIGIBILITY FILTER - candidate set:
      #     Technician.status == AVAILABLE
      #     AND Technician.region_code == Site(ticket.placement.site_id).region_code
      #     AND (Technician.certification_level == SANITATION_CERTIFIED
      #          OR ticket.requires_sanitation_cert == false)
      #     AND Technician.open_ticket_count < MAX_OPEN_TICKETS_PER_TECH
      # (b) RANKING EXPRESSION - order candidates by:
      #     1. open_ticket_count ASC
      #     2. cert_rank DESC where cert_rank = { SANITATION_CERTIFIED: 3, L2: 2, L1: 1 }
      # (c) TIE-BREAK: created_at ASC (the longest-tenured technician wins). Entity id is never used.
      # (d) EMPTY CANDIDATE SET: the request fails with ERR_NO_ELIGIBLE_TECHNICIAN (409) and NOTHING is
      #     mutated - the ticket stays QUEUED with assigned_technician_id null and escalation_level
      #     unchanged.
      # When override_technician_id IS supplied, the selector is skipped, but the named technician must
      # still satisfy the whole eligibility filter (region mismatch -> ERR_TECHNICIAN_REGION_MISMATCH,
      # any other eligibility failure -> ERR_NO_ELIGIBLE_TECHNICIAN).
    input_set: "Technician rows with status == AVAILABLE only; OFF_DUTY and SUSPENDED technicians never enter the candidate set."
    constants:
      MAX_OPEN_TICKETS_PER_TECH: 3
      CERT_RANK_SANITATION_CERTIFIED: 3
      CERT_RANK_L2: 2
      CERT_RANK_L1: 1
    precision: "not applicable"

  - name: concentration_drift_verdict
    trigger: "on POST /warewashing/service-visits/{visit_id}/calibration-records, stamped into CalibrationRecord.drift_pct and calibration_verdict"
    algorithm: threshold
    formula: |
      target = ChemicalProduct(dispenser.product_id).concentration_target_ppm
      drift_pct = round_half_up((measured_ppm - target) / target * 100, 2)
      tol = ChemicalProduct.concentration_tolerance_pct              # default 10.00
      # verdict, evaluated strictly in this order; the FIRST matching branch wins:
      #   1. efficacy_result == FAIL                       -> FAIL
      #   2. abs(drift_pct) > HARD_FAIL_DRIFT_PCT          -> FAIL
      #   3. abs(drift_pct) > tol                          -> ADJUSTED   (adjusted_dose_ml_per_rack required)
      #   4. otherwise                                     -> PASS
      # Boundaries are inclusive on the passing side: abs(drift_pct) == tol is PASS and
      # abs(drift_pct) == HARD_FAIL_DRIFT_PCT is ADJUSTED, not FAIL.
    input_set: "The single CalibrationRecord being created and its dispenser's product."
    constants:
      HARD_FAIL_DRIFT_PCT: 25.00
    precision: "drift_pct to 2 decimals, round_half_up; the rounded value is what the thresholds compare"

  - name: sanitizer_efficacy_verdict
    trigger: "on POST /warewashing/service-visits/{visit_id}/calibration-records, stamped into CalibrationRecord.efficacy_result"
    algorithm: threshold
    formula: |
      product = ChemicalProduct(dispenser.product_id)
      if product.product_type != SANITIZER:
          efficacy_result = NOT_APPLICABLE          # contact_seconds must be omitted
      else:
          efficacy_result = PASS when
              product.sanitizer_min_ppm <= measured_ppm <= product.sanitizer_max_ppm
              AND contact_seconds >= product.min_contact_seconds
              AND the latest DEVICE TelemetryReading of the dispenser's placement (greatest reading_at,
                  tie-break created_at ASC) has final_rinse_temp_f >= MachineModel.min_final_rinse_temp_f
                  (when the placement has no DEVICE reading yet this clause is treated as satisfied)
          else FAIL
      # A FAIL locks the dispenser out immediately (Dispenser ACTIVE -> LOCKED_OUT, lockout_reason
      # EFFICACY_FAILURE), which drives the placement's health axis to DOWN.
    input_set: "The record being created, its product's sanitizer window, and the placement's latest DEVICE reading."
    constants: {}
    precision: "not applicable"

  - name: telemetry_alert_evaluation
    trigger: "on POST /warewashing/machine-placements/{placement_id}/telemetry-readings with source == DEVICE"
    algorithm: threshold
    formula: |
      model = MachineModel(placement.machine_model_id)
      # Alert types are evaluated in this fixed order and every breach opens its own TelemetryAlert;
      # triggered_alert_types records them in the same order.
      #  1. LOW_FINAL_RINSE_TEMP : final_rinse_temp_f < model.min_final_rinse_temp_f
      #        severity = CRITICAL when final_rinse_temp_f <= model.min_final_rinse_temp_f - 5 else WARNING
      #  2. LOW_WASH_TEMP        : wash_temp_f < model.min_wash_temp_f
      #        severity = CRITICAL when wash_temp_f <= model.min_wash_temp_f - 10 else WARNING
      #  3. LOW_RINSE_PRESSURE   : rinse_pressure_psi < model.min_rinse_pressure_psi
      #        severity = CRITICAL when rinse_pressure_psi <= model.min_rinse_pressure_psi - 3 else WARNING
      #  4. HIGH_RINSE_PRESSURE  : rinse_pressure_psi > model.max_rinse_pressure_psi, severity WARNING
      #  5. HIGH_CYCLE_RATE      : a preceding DEVICE reading exists AND
      #        cycle_delta / hours_since_prev > model.racks_per_hour * CYCLE_RATE_TOLERANCE,
      #        where hours_since_prev = (reading_at - prev.reading_at) in exact hours;
      #        severity WARNING. With no preceding DEVICE reading this alert can never fire.
      #  6. CALIBRATION_OVERDUE  : placement.cycles_since_calibration (after this reading is applied)
      #        >= model.max_cycles_between_calibrations, severity WARNING, and only when no
      #        CALIBRATION_OVERDUE alert of this placement is already in status IN {OPEN, ACKNOWLEDGED}
      # De-duplication: an alert of the same alert_type already in status IN {OPEN, ACKNOWLEDGED} on this
      # placement suppresses opening a second one; measured_value on the existing alert is NOT updated.
      # Health axis: the most severe alert opened by this reading drives the placement - CRITICAL sends
      # it to DOWN, WARNING sends UP to DEGRADED and leaves DOWN untouched.
    input_set: "Only source == DEVICE readings evaluate alerts; MANUAL_AUDIT readings open none."
    constants:
      CRITICAL_FINAL_RINSE_MARGIN_F: 5
      CRITICAL_WASH_MARGIN_F: 10
      CRITICAL_PRESSURE_MARGIN_PSI: 3
      CYCLE_RATE_TOLERANCE: 1.10
    precision: "cycle rate compared as an exact rational; no rounding before comparison"

  - name: delivery_amount
    trigger: "on POST /warewashing/chemical-deliveries, stamped into ChemicalDelivery.quantity_ml and amount_cents"
    algorithm: tiered_pricing
    formula: |
      quantity_ml = unit_count * ChemicalProduct.unit_size_ml
      discount_rate = 0.12 if unit_count >= 25 else (0.05 if unit_count >= 10 else 0.00)
      # PER-UNIT ROUNDING IS PINNED: the discounted unit price is rounded to whole cents FIRST and the
      # rounded unit price is then multiplied by unit_count. Multiplying first and rounding the total
      # once is WRONG.
      unit_price_after_discount_cents = round_half_up(ChemicalProduct.unit_price_cents
                                                     * (1 - discount_rate), 0)
      amount_cents = unit_price_after_discount_cents * unit_count
    input_set: "The single delivery being created and its product's list price."
    constants:
      TIER_1_MIN_UNITS: 10
      TIER_1_DISCOUNT: 0.05
      TIER_2_MIN_UNITS: 25
      TIER_2_DISCOUNT: 0.12
    precision: "whole cents, round_half_up, applied to the unit price BEFORE multiplication"

  - name: theft_chargeback
    trigger: "on POST /warewashing/investigation-cases/{case_id}/review with decision SUBSTANTIATE and remediation CHARGEBACK, stamped into InvestigationCase.chargeback_cents"
    algorithm: aggregation
    formula: |
      review = UsageVarianceReview(case.variance_review_id)
      excess_ml = max(review.actual_consumption_ml - review.expected_consumption_ml, 0)
      units = ceil(excess_ml / ChemicalProduct(review.product_id).unit_size_ml)
      chargeback_cents = units * ChemicalProduct.unit_price_cents      # list price, no volume discount
    input_set: "The frozen expected/actual figures of the linked review; never recomputed from telemetry at adjudication time."
    constants: {}
    precision: "whole cents; units are rounded UP to the next whole container"

  - name: sustainability_savings
    trigger: "on every GET /warewashing/sites/{site_id}/sustainability-report request; nothing is persisted"
    algorithm: projection
    formula: |
      # Per placement p of the site with placement_status IN {INSTALLED, RETRIEVAL_SCHEDULED, RETRIEVED}:
      #   racks(p) from rack_count_in_period
      #   basis RATED             : eff_water(p) = MachineModel.rated_water_l_per_rack
      #   basis TELEMETRY_MEASURED: pressure_factor(p) = round_half_up(
      #                                 avg(rinse_pressure_psi over DEVICE readings of p inside the
      #                                     window) / MachineModel.min_rinse_pressure_psi, 4)
      #                             eff_water(p) = MachineModel.rated_water_l_per_rack * pressure_factor(p)
      #                             (with no DEVICE reading inside the window, pressure_factor = 1.0000)
      # water_saved_l    = SUM over p of racks(p) * (site.baseline_water_l_per_rack - eff_water(p))
      # energy_saved_kwh = SUM over p of racks(p) * (site.baseline_kwh_per_rack
      #                                             - MachineModel.rated_kwh_per_rack)
      # Both may be negative; they are NOT floored at zero.
      # water_savings_cents  = round_half_up(water_saved_l / 1000 * site.water_cost_cents_per_1000l, 0)
      # energy_savings_cents = round_half_up(energy_saved_kwh * site.energy_cost_cents_per_kwh, 0)
      # gross_savings_cents  = water_savings_cents + energy_savings_cents
      #
      # EVALUATION ORDER IS PINNED (the fee tier looks circular but is not):
      #   step 1: chemical_spend_cents = SUM of ChemicalDelivery.amount_cents for this site with
      #           status == DELIVERED and period_start <= delivered_at < period_end
      #   step 2: gross_program_cost_cents = chemical_spend_cents + BASE_SERVICE_FEE_CENTS
      #   step 3: service_fee_rate = 0.08 if gross_program_cost_cents < 200000
      #                              else 0.06 if gross_program_cost_cents < 500000
      #                              else 0.04
      #   step 4: service_fee_cents = round_half_up(chemical_spend_cents * service_fee_rate, 0)
      #   step 5: sustainability_credit_cents = 0 when gross_savings_cents <= 0, else
      #           min(round_half_up(gross_savings_cents * CREDIT_RATE, 0), CREDIT_CAP_CENTS)
      #   step 6: net_program_cost_cents = chemical_spend_cents + BASE_SERVICE_FEE_CENTS
      #                                   + service_fee_cents - sustainability_credit_cents
      #   The credit MUST NOT feed back into step 2 or step 3 - the tier is chosen from the PRE-credit
      #   program cost, and net_program_cost_cents is the last value computed.
      # goal_attainment_pct = round_half_up(water_saved_l / Customer.sustainability_goal_water_l * 100, 2)
    input_set: "DEVICE readings and DELIVERED deliveries inside [period_start, period_end); placements with placement_status IN {INSTALLED, RETRIEVAL_SCHEDULED, RETRIEVED}."
    constants:
      BASE_SERVICE_FEE_CENTS: 25000
      CREDIT_RATE: 0.05
      CREDIT_CAP_CENTS: 15000
      FEE_TIER_MID_CENTS: 200000
      FEE_TIER_HIGH_CENTS: 500000
    precision: "litres and kWh kept as exact decimals; every *_cents output is round_half_up to whole cents exactly once; goal_attainment_pct to 2 decimals"
    variants:
      - name: RATED
        when: "query parameter basis == RATED"
        difference: "uses the machine's nameplate litres per rack, so savings depend only on rack counts"
      - name: TELEMETRY_MEASURED
        when: "query parameter basis == TELEMETRY_MEASURED"
        difference: "inflates nameplate water by the observed rinse-pressure factor, so the same racks and the same tariffs yield a smaller water saving and a smaller credit"

  - name: inspection_dossier_readiness
    trigger: "on every GET /warewashing/sites/{site_id}/inspection-dossier request; nothing is persisted"
    algorithm: aggregation
    formula: |
      # Only evidence from ServiceVisit rows with visit_status == VERIFIED counts. Records attached to
      # SCHEDULED, IN_PROGRESS, SUBMITTED, REJECTED or CANCELLED visits are excluded entirely.
      # records = CalibrationRecord rows whose dispenser's placement belongs to this site AND whose
      #           visit_status == VERIFIED AND whose visit's verification instant is in
      #           [period_start, period_end)
      # sanitizer_tests_total  = count of records whose efficacy_result != NOT_APPLICABLE
      # sanitizer_tests_passed = count of records whose efficacy_result == PASS
      # latest_efficacy_result = efficacy_result of the record with the greatest visit verification
      #                          instant (tie-break: record created_at ASC, last one wins) among records
      #                          whose efficacy_result != NOT_APPLICABLE; NOT_APPLICABLE when none
      # calibration_records_total = count of records
      # final_rinse_temp_readings_total = count of DEVICE TelemetryReading rows of this site's placements
      #                          inside the window
      # final_rinse_temp_exceptions = count of those readings whose final_rinse_temp_f <
      #                          MachineModel.min_final_rinse_temp_f
      # open_critical_alert_count = count of TelemetryAlert rows of this site's placements with
      #                          status IN {OPEN, ACKNOWLEDGED} AND severity == CRITICAL (as of now,
      #                          not window-filtered)
      # dossier_status = READY when sanitizer_tests_total >= 1
      #                       AND latest_efficacy_result == PASS
      #                       AND final_rinse_temp_exceptions == 0
      #                       AND open_critical_alert_count == 0
      #                  else DEFICIENT
    input_set: "VERIFIED visits only; DEVICE readings only; alerts with status IN {OPEN, ACKNOWLEDGED}."
    constants: {}
    precision: "integer counts"

validations:
  - name: authentication_required
    priority: 10
    category: auth
    rule: "Every endpoint under /warewashing except POST /warewashing/_clock/set_current_utc requires both X-User-ID and X-User-Role headers; either header missing or empty is rejected before any other check."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - name: role_permitted_for_endpoint
    priority: 12
    category: role
    rule: "The X-User-Role value must be one of the endpoint's declared roles. Checked before the request body is parsed, so a forbidden role with a malformed body still yields the role error."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - name: customer_contact_scope
    priority: 14
    category: ownership
    rule: "When X-User-Role is CustomerContact, X-User-ID must equal the Customer.id that owns the addressed resource (resolved through Site.customer_id or MachinePlacement -> Site -> customer_id or ServiceAgreement.customer_id). A CustomerContact of another customer is rejected even when the resource exists. When X-User-Role is ServiceTechnician, X-User-ID must equal the Technician.id being acted for on POST /warewashing/service-visits (technician_id) and on POST /warewashing/service-visits/{visit_id}/submit."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all CustomerContact-readable endpoints; POST /warewashing/service-visits; POST /warewashing/service-visits/{visit_id}/submit"

  - name: request_shape_valid
    priority: 16
    category: request_shape
    rule: "Body must be a JSON object; every required field present and non-null; every field of the declared JSON type; enum fields one of the declared members; monetary and count fields integers >= 0; percentage tolerances numeric > 0; timestamps ISO 8601 UTC; unknown fields ignored. Interval fields must satisfy start < end (period_start < period_end, scheduled_start_at < scheduled_end_at). measured_ppm must be > 0. On POST /warewashing/chemical-products, sanitizer_min_ppm and sanitizer_max_ppm are required when product_type == SANITIZER and must satisfy sanitizer_min_ppm <= concentration_target_ppm <= sanitizer_max_ppm; on a DETERGENT or RINSE_AID product they must be omitted. covered_product_ids must be a non-empty array of distinct strings. On POST /warewashing/service-agreements the request carries no term_end_date - it is computed as start_date plus minimum_term_months."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST and PATCH endpoints"

  - name: pagination_bounds
    priority: 18
    category: pagination
    rule: "limit must be an integer in [1, 100] (default 10) and offset an integer >= 0 (default 0); non-integer, out-of-range or negative values are rejected rather than clamped."
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

  - name: path_resource_exists
    priority: 20
    category: existence
    rule: "Every {id} path segment must resolve to an existing row of the expected entity type; an id of the wrong entity type is treated as not found."
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - name: body_reference_exists
    priority: 22
    category: reference
    rule: "Every foreign key supplied in a request body (customer_id, site_id, product_id, machine_model_id, agreement_id, placement_id, dispenser_id, technician_id, ticket_id, visit_id, variance_review_id, follow_up_to_visit_id, override_technician_id) must resolve to an existing row."
    error_id: ERR_UNKNOWN_REFERENCE
    http_status: 422
    applies_to: "all POST and PATCH endpoints carrying foreign keys"

  - name: parent_version_current
    priority: 24
    category: concurrency
    rule: "For every write declared in concurrency_rules, expected_<parent>_version must equal the parent's current version. Checked after existence and reference resolution but before any state, safety, uniqueness or temporal rule, so a stale version masks every downstream violation."
    error_id: ERR_STALE_PARENT_VERSION
    http_status: 412
    applies_to: "POST /warewashing/machine-placements; POST /warewashing/chemical-deliveries; POST /warewashing/service-visits/{visit_id}/calibration-records"

  - name: transition_legal_for_current_state
    priority: 30
    category: state
    rule: "The addressed entity must be in a state from which the requested trigger is declared in its state machine; a trigger fired from any other state (including a terminal state, and including firing the same trigger twice) is rejected."
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints"

  - name: agreement_must_be_active
    priority: 30
    category: state
    rule: "MachinePlacement creation requires ServiceAgreement.status == ACTIVE. DRAFT, RENEWAL_PENDING, EXPIRED, TERMINATED and VOID agreements cannot take new placements."
    error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /warewashing/machine-placements"

  - name: placement_must_be_installed
    priority: 30
    category: state
    rule: "Dispenser creation, telemetry ingest and ServiceTicket creation all require the placement's placement_status == INSTALLED. A PENDING_INSTALL, RETRIEVAL_SCHEDULED, RETRIEVED or CANCELLED placement is rejected."
    error_id: ERR_PLACEMENT_NOT_INSTALLED
    http_status: 409
    applies_to: "POST /warewashing/dispensers; POST /warewashing/machine-placements/{placement_id}/telemetry-readings; POST /warewashing/service-tickets"

  - name: visit_must_be_in_progress
    priority: 30
    category: state
    rule: "CalibrationRecord creation requires ServiceVisit.visit_status == IN_PROGRESS. Records cannot be attached to a SCHEDULED, SUBMITTED, VERIFIED, REJECTED or CANCELLED visit."
    error_id: ERR_VISIT_NOT_IN_PROGRESS
    http_status: 409
    applies_to: "POST /warewashing/service-visits/{visit_id}/calibration-records"

  - name: review_must_be_draft
    priority: 30
    category: state
    rule: "Publishing a UsageVarianceReview requires status == DRAFT; a PUBLISHED, ESCALATED or CLOSED review cannot be published again."
    error_id: ERR_REVIEW_NOT_DRAFT
    http_status: 409
    applies_to: "POST /warewashing/usage-variance-reviews/{review_id}/publish"

  - name: review_must_be_published
    priority: 30
    category: state
    rule: "Opening an InvestigationCase requires the linked UsageVarianceReview.status == PUBLISHED, and closing a review requires PUBLISHED as well. A DRAFT review must be published before it can be escalated, and an ESCALATED review is closed only by its case's adjudication."
    error_id: ERR_REVIEW_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /warewashing/investigation-cases; POST /warewashing/usage-variance-reviews/{review_id}/close"

  - name: case_must_be_in_review
    priority: 30
    category: state
    rule: "Adjudicating an InvestigationCase requires case_status == PENDING_REVIEW, and submitting for review requires case_status == EVIDENCE_GATHERING. A case returned to EVIDENCE_GATHERING must be re-submitted before it can be adjudicated again."
    error_id: ERR_CASE_NOT_IN_REVIEW
    http_status: 409
    applies_to: "POST /warewashing/investigation-cases/{case_id}/review; POST /warewashing/investigation-cases/{case_id}/submit-for-review"

  - name: ticket_must_be_dispatchable
    priority: 30
    category: state
    rule: "Dispatch requires ServiceTicket.status == QUEUED; a DISPATCHED, ON_SITE, PENDING_VERIFICATION, CLOSED or CANCELLED ticket cannot be dispatched. A ticket sent back to QUEUED by a rejected visit is dispatchable again."
    error_id: ERR_TICKET_NOT_DISPATCHABLE
    http_status: 409
    applies_to: "POST /warewashing/service-tickets/{ticket_id}/dispatch"

  - name: retrieval_blocked_by_open_ticket
    priority: 30
    category: state
    rule: "Completing equipment retrieval requires that the placement have no ServiceTicket in status IN {DISPATCHED, ON_SITE, PENDING_VERIFICATION}. QUEUED tickets do not block: they were auto-cancelled when the retrieval order was raised."
    error_id: ERR_OPEN_TICKET_BLOCKS_RETRIEVAL
    http_status: 409
    applies_to: "POST /warewashing/machine-placements/{placement_id}/retrieval-completion"

  - name: segregation_of_duties
    priority: 34
    category: segregation_of_duties
    rule: "Adjudicating an InvestigationCase requires an X-User-ID that is neither the case's opened_by_user_id nor the published_by_user_id of the UsageVarianceReview the case was opened against. Two independent auditors are therefore needed to convert a variance into a chargeback. Evaluated after every state rule, so a wrongly-staged case reports its state error first."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /warewashing/investigation-cases/{case_id}/review"

  - name: sanitizer_lockout_blocks_operation
    priority: 40
    category: safety
    rule: "A Dispenser with dispenser_status == LOCKED_OUT and lockout_reason IN {AGREEMENT_ENDED, INVESTIGATION_HOLD} accepts no new CalibrationRecord - those lockouts are not clearable by re-calibration. A lockout_reason EFFICACY_FAILURE dispenser DOES accept new records, which is the only recovery path back to ACTIVE."
    error_id: ERR_SANITIZER_LOCKOUT_ACTIVE
    http_status: 409
    applies_to: "POST /warewashing/service-visits/{visit_id}/calibration-records"

  - name: efficacy_failure_must_be_resolved
    priority: 40
    category: safety
    rule: "A ServiceVisit cannot be submitted while any CalibrationRecord attached to it has efficacy_result == FAIL and no later record on the same dispenser within the same visit has efficacy_result == PASS."
    error_id: ERR_EFFICACY_FAILURE_UNRESOLVED
    http_status: 409
    applies_to: "POST /warewashing/service-visits/{visit_id}/submit"

  - name: site_posture_critical_blocks_publish
    priority: 40
    category: safety
    rule: "A UsageVarianceReview cannot be published while its Site.service_posture == CRITICAL; the site's open ticket backlog must be worked down first. Evaluated before the telemetry-sufficiency rule."
    error_id: ERR_SITE_POSTURE_CRITICAL
    http_status: 409
    applies_to: "POST /warewashing/usage-variance-reviews/{review_id}/publish"

  - name: product_must_be_on_agreement
    priority: 50
    category: referential
    rule: "A Dispenser's product_id and a ChemicalDelivery's product_id must appear in the covering ServiceAgreement.covered_product_ids (for a delivery, the agreement is the ACTIVE or RENEWAL_PENDING agreement of the site's customer)."
    error_id: ERR_PRODUCT_NOT_ON_AGREEMENT
    http_status: 422
    applies_to: "POST /warewashing/dispensers; POST /warewashing/chemical-deliveries"

  - name: dispenser_belongs_to_visit_placement
    priority: 50
    category: referential
    rule: "A CalibrationRecord's dispenser_id must reference a Dispenser whose placement_id equals the owning ServiceVisit's placement_id."
    error_id: ERR_DISPENSER_PLACEMENT_MISMATCH
    http_status: 422
    applies_to: "POST /warewashing/service-visits/{visit_id}/calibration-records"

  - name: technician_region_matches_site
    priority: 50
    category: referential
    rule: "A ServiceVisit's technician and a dispatch's override_technician_id must have region_code equal to the Site.region_code of the placement being serviced. Evaluated before any schedule-overlap check."
    error_id: ERR_TECHNICIAN_REGION_MISMATCH
    http_status: 422
    applies_to: "POST /warewashing/service-visits; POST /warewashing/service-tickets/{ticket_id}/dispatch"

  - name: dispenser_product_unique_per_placement
    priority: 55
    category: uniqueness
    rule: "At most one Dispenser with dispenser_status IN {ACTIVE, LOCKED_OUT} may meter a given product_id on a given placement_id; a REMOVED dispenser frees the slot."
    error_id: ERR_DUPLICATE_DISPENSER_PRODUCT
    http_status: 409
    applies_to: "POST /warewashing/dispensers"

  - name: one_open_ticket_per_symptom
    priority: 55
    category: uniqueness
    rule: "A placement may not have two ServiceTicket rows with the same reported_symptom in status IN {QUEUED, DISPATCHED, ON_SITE, PENDING_VERIFICATION}. The auto-ticket of CASCADE beta obeys the same rule and is silently skipped rather than erroring."
    error_id: ERR_DUPLICATE_OPEN_TICKET
    http_status: 409
    applies_to: "POST /warewashing/service-tickets"

  - name: asset_tag_unique
    priority: 55
    category: uniqueness
    rule: "MachinePlacement.asset_tag is globally unique across placements with placement_status != CANCELLED."
    error_id: ERR_ASSET_TAG_TAKEN
    http_status: 409
    applies_to: "POST /warewashing/machine-placements"

  - name: cycle_count_monotonic
    priority: 55
    category: constraint
    rule: "A DEVICE TelemetryReading's cycle_count_total must be >= the cycle_count_total of the preceding DEVICE reading on that placement (or >= MachinePlacement.initial_cycle_count when none exists). Equality is allowed and yields cycle_delta 0."
    error_id: ERR_NON_MONOTONIC_CYCLE_COUNT
    http_status: 422
    applies_to: "POST /warewashing/machine-placements/{placement_id}/telemetry-readings"

  - name: adjusted_dose_required_when_out_of_tolerance
    priority: 55
    category: constraint
    rule: "When concentration_drift_verdict yields ADJUSTED, adjusted_dose_ml_per_rack must be present and > 0; when the verdict is PASS an adjusted_dose_ml_per_rack may still be supplied and is honored."
    error_id: ERR_ADJUSTED_DOSE_REQUIRED
    http_status: 422
    applies_to: "POST /warewashing/service-visits/{visit_id}/calibration-records"

  - name: telemetry_sufficient_for_publish
    priority: 55
    category: constraint
    rule: "A UsageVarianceReview may only be published when rack_count_in_period > 0 and expected_consumption_ml > 0; a review over a window with no DEVICE readings cannot be published."
    error_id: ERR_INSUFFICIENT_TELEMETRY
    http_status: 422
    applies_to: "POST /warewashing/usage-variance-reviews/{review_id}/publish"

  - name: eligible_technician_exists
    priority: 55
    category: constraint
    rule: "Dispatch requires a non-empty candidate set from dispatch_technician_selection; when every technician is filtered out the request fails with no state change."
    error_id: ERR_NO_ELIGIBLE_TECHNICIAN
    http_status: 409
    applies_to: "POST /warewashing/service-tickets/{ticket_id}/dispatch"

  - name: technician_schedule_no_overlap
    priority: 60
    category: temporal
    rule: "A new ServiceVisit window must not overlap any existing visit of the same technician in visit_status IN {SCHEDULED, IN_PROGRESS, SUBMITTED, VERIFIED} once a TRAVEL_BUFFER_MINUTES pad is applied to both sides: reject when new.scheduled_start_at < existing.scheduled_end_at + 30min AND existing.scheduled_start_at < new.scheduled_end_at + 30min. A visit starting exactly 30 minutes after an existing visit ends is accepted; 29 minutes after is rejected."
    error_id: ERR_TECHNICIAN_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /warewashing/service-visits"

  - name: review_period_no_overlap
    priority: 60
    category: temporal
    rule: "For a given (site_id, product_id), a new or newly-published UsageVarianceReview window must not overlap any review already in status IN {PUBLISHED, ESCALATED, CLOSED}. Windows are half-open [period_start, period_end) and carry NO buffer, so a window starting exactly at another's period_end is accepted. DRAFT reviews never block anything - a draft is a what-if computation, and two drafts may cover the same window (that is how the NAMEPLATE and AS_CALIBRATED bases are compared side by side); publication is what claims a window, so the same check runs again at publish time."
    error_id: ERR_REVIEW_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /warewashing/usage-variance-reviews; POST /warewashing/usage-variance-reviews/{review_id}/publish"

  - name: renewal_window_open
    priority: 60
    category: temporal
    rule: "A ServiceAgreement may only be renewed when current_utc >= term_end_date minus renewal_notice_days AND current_utc < term_end_date. Renewing earlier than the notice window, or after the term has already lapsed, is rejected."
    error_id: ERR_RENEWAL_WINDOW_NOT_OPEN
    http_status: 409
    applies_to: "POST /warewashing/service-agreements/{agreement_id}/renewal"

  - name: period_within_agreement_term
    priority: 60
    category: temporal
    rule: "A UsageVarianceReview window must lie inside [start_date, term_end_date] of the covering ServiceAgreement of the site's customer (the agreement with status IN {ACTIVE, RENEWAL_PENDING}, or the most recently terminated/expired one when none is live)."
    error_id: ERR_PERIOD_OUTSIDE_AGREEMENT_TERM
    http_status: 422
    applies_to: "POST /warewashing/usage-variance-reviews"

  - name: reading_after_install
    priority: 60
    category: temporal
    rule: "A TelemetryReading's reading_at must be >= MachinePlacement.installed_at and <= current_utc; back-dated and future readings are rejected."
    error_id: ERR_READING_BEFORE_INSTALL
    http_status: 422
    applies_to: "POST /warewashing/machine-placements/{placement_id}/telemetry-readings"

  - name: delivery_period_not_closed
    priority: 60
    category: temporal
    rule: "A ChemicalDelivery may only be voided while no UsageVarianceReview of the same (site_id, product_id) in status IN {PUBLISHED, ESCALATED, CLOSED} covers its delivered_at instant. Window containment is half-open [period_start, period_end), so a delivery stamped exactly at a published review's period_end is still voidable."
    error_id: ERR_DELIVERY_IN_CLOSED_PERIOD
    http_status: 409
    applies_to: "POST /warewashing/chemical-deliveries/{delivery_id}/void"

  - name: customer_not_on_credit_hold
    priority: 70
    category: fiscal
    rule: "Customer.billing_status must be CURRENT to create a MachinePlacement or a ChemicalDelivery. Lowest-priority rule in the ladder: a credit hold is reported only when the request is otherwise entirely valid."
    error_id: ERR_CUSTOMER_CREDIT_HOLD
    http_status: 402
    applies_to: "POST /warewashing/machine-placements; POST /warewashing/chemical-deliveries"

endpoints:
  - method: POST
    path: "/warewashing/_clock/set_current_utc"
    description: "Test-driving endpoint that sets the server's logical clock. The clock's startup default is exactly 2026-08-01T00:00:00Z: before any call to this endpoint the logical clock reads 2026-08-01T00:00:00Z and never falls back to real wall-clock time. Every timestamp the system stamps (installed_at, opened_at, response_deadline_at, retrieved_at, verification instants) is read from this clock. Advancing the clock is the only way to age an agreement into its renewal window, past its term_end_date, or a ticket past its SLA deadline."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime, agreements_moved_to_renewal_pending: integer, agreements_expired: integer, tickets_escalated: integer }
    side_effects:
      - "current_utc must be >= the clock's present value, else ERR_INVALID_REQUEST - the clock never runs backwards"
      - "every ServiceAgreement with status ACTIVE whose term_end_date minus renewal_notice_days <= new current_utc < term_end_date transitions ACTIVE -> RENEWAL_PENDING"
      - "every ServiceAgreement with status IN {ACTIVE, RENEWAL_PENDING} whose term_end_date <= new current_utc transitions to EXPIRED, firing CASCADE alpha links 2-4 (placements RETRIEVAL_SCHEDULED, dispensers LOCKED_OUT with lockout_reason AGREEMENT_ENDED, alerts SUPPRESSED)"
      - "every ServiceTicket with status IN {QUEUED, DISPATCHED, ON_SITE} whose response_deadline_at < new current_utc and sla_breached false gets sla_breached true and escalation_level incremented by 1; a further advance does not increment it again"
      - "counts of what moved are returned so a test can assert the sweep ran"

  - method: POST
    path: "/warewashing/customers"
    description: "Register a foodservice account. billing_status may be seeded to CREDIT_HOLD at creation."
    roles: [AccountManager]
    code: 201
    input: [name, sustainability_goal_water_l, "billing_status?"]
    output: Customer
    side_effects:
      - "equipment_on_placement_value_cents = 0 and active_agreement_count = 0"
      - "billing_status defaults to CURRENT when omitted"

  - method: GET
    path: "/warewashing/customers/{customer_id}"
    description: "Read one account, including its conserved equipment ledger."
    roles: [AccountManager, CustomerContact]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/warewashing/sites"
    description: "Register a kitchen location under an account, with its dispatch region, operating window and utility tariffs."
    roles: [AccountManager]
    code: 201
    input: [customer_id, name, region_code, operating_window_start_minute_utc, operating_window_end_minute_utc, baseline_water_l_per_rack, baseline_kwh_per_rack, water_cost_cents_per_1000l, energy_cost_cents_per_kwh, "priority_tier?", "status?"]
    output: Site
    side_effects:
      - "service_posture = NORMAL and open_ticket_count = 0"
      - "priority_tier defaults to STANDARD, status defaults to ACTIVE"

  - method: GET
    path: "/warewashing/sites/{site_id}"
    description: "Read one site, including its derived service_posture and open_ticket_count."
    roles: [AccountManager, CustomerContact, ServiceTechnician, QualityAuditor]
    code: 200
    input: []
    output: Site
    side_effects: []

  - method: GET
    path: "/warewashing/sites"
    description: "List sites, filterable by owning account, dispatch region and derived posture."
    roles: [AccountManager, QualityAuditor]
    code: 200
    input: ["customer_id?", "region_code?", "service_posture?", "limit?", "offset?"]
    output: Site[]
    side_effects: []

  - method: POST
    path: "/warewashing/chemical-products"
    description: "Define a chemical in the catalog. sanitizer_min_ppm, sanitizer_max_ppm and min_contact_seconds are required for a SANITIZER and must be omitted otherwise."
    roles: [PlatformAdmin]
    code: 201
    input: [sku, product_type, concentration_target_ppm, spec_dose_ml_per_rack, unit_size_ml, unit_price_cents, "concentration_tolerance_pct?", "sanitizer_min_ppm?", "sanitizer_max_ppm?", "min_contact_seconds?"]
    output: ChemicalProduct
    side_effects:
      - "concentration_tolerance_pct defaults to 10.00 and min_contact_seconds to 7"

  - method: GET
    path: "/warewashing/chemical-products/{product_id}"
    description: "Read one catalog chemical with its concentration target, tolerance and container economics."
    roles: [PlatformAdmin, AccountManager, ServiceTechnician, QualityAuditor]
    code: 200
    input: []
    output: ChemicalProduct
    side_effects: []

  - method: POST
    path: "/warewashing/machine-models"
    description: "Define a dish machine model with its nameplate consumption, temperature and pressure limits, book value and calibration interval."
    roles: [PlatformAdmin]
    code: 201
    input: [model_code, machine_class, racks_per_hour, rated_water_l_per_rack, rated_kwh_per_rack, min_final_rinse_temp_f, min_wash_temp_f, min_rinse_pressure_psi, max_rinse_pressure_psi, equipment_value_cents, max_cycles_between_calibrations]
    output: MachineModel
    side_effects:
      - "min_rinse_pressure_psi must be < max_rinse_pressure_psi, else ERR_INVALID_REQUEST"

  - method: GET
    path: "/warewashing/machine-models/{model_id}"
    description: "Read one machine model, including the thresholds every telemetry reading is judged against."
    roles: [PlatformAdmin, AccountManager, ServiceTechnician, QualityAuditor]
    code: 200
    input: []
    output: MachineModel
    side_effects: []

  - method: POST
    path: "/warewashing/technicians"
    description: "Add a field technician to the dispatch roster."
    roles: [PlatformAdmin]
    code: 201
    input: [name, region_code, certification_level, "status?"]
    output: Technician
    side_effects:
      - "status defaults to AVAILABLE; open_ticket_count = 0 and quality_flag_count = 0"

  - method: GET
    path: "/warewashing/technicians/{technician_id}"
    description: "Read one technician, including the live open_ticket_count the dispatch selector ranks on."
    roles: [PlatformAdmin, AccountManager, ServiceTechnician, QualityAuditor]
    code: 200
    input: []
    output: Technician
    side_effects: []

  - method: PATCH
    path: "/warewashing/technicians/{technician_id}"
    description: "Update roster attributes: take a technician off duty or on duty, or record a certification change. open_ticket_count and quality_flag_count are computed and cannot be written."
    roles: [PlatformAdmin]
    code: 200
    input: ["status?", "certification_level?"]
    output: Technician
    side_effects:
      - "increments Technician.version by 1"
      - "an OFF_DUTY or SUSPENDED technician leaves the dispatch candidate set immediately but keeps every visit already SCHEDULED"

  - method: POST
    path: "/warewashing/service-agreements"
    description: "Draft a chemical supply agreement with a minimum term, a monthly minimum spend and the list of covered products. term_end_date is computed as start_date plus minimum_term_months."
    roles: [AccountManager]
    code: 201
    input: [customer_id, agreement_code, start_date, minimum_term_months, monthly_minimum_spend_cents, covered_product_ids, "renewal_notice_days?", "auto_renew?"]
    output: ServiceAgreement
    side_effects:
      - "status = DRAFT; renewal_count = 0; placement_count = 0; early_termination_fee_cents = null"
      - "renewal_notice_days defaults to 60 and auto_renew to false"
      - "every id in covered_product_ids must resolve to a ChemicalProduct, else ERR_UNKNOWN_REFERENCE"

  - method: GET
    path: "/warewashing/service-agreements/{agreement_id}"
    description: "Read one agreement with its computed term_end_date, renewal_count, placement_count and any early termination fee."
    roles: [AccountManager, CustomerContact, QualityAuditor]
    code: 200
    input: []
    output: ServiceAgreement
    side_effects: []

  - method: GET
    path: "/warewashing/service-agreements"
    description: "List agreements, filterable by account and lifecycle status."
    roles: [AccountManager, QualityAuditor]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: ServiceAgreement[]
    side_effects: []

  - method: POST
    path: "/warewashing/service-agreements/{agreement_id}/activate"
    description: "Activate a DRAFT agreement so machines can be placed against it."
    roles: [AccountManager]
    code: 200
    input: []
    output: ServiceAgreement
    side_effects:
      - "status DRAFT -> ACTIVE; increments Customer.active_agreement_count by 1"
      - "increments ServiceAgreement.version by 1"

  - method: POST
    path: "/warewashing/service-agreements/{agreement_id}/renewal"
    description: "Renew an agreement inside its notice window, extending term_end_date. Callable from ACTIVE or RENEWAL_PENDING; a RENEWAL_PENDING agreement returns to ACTIVE."
    roles: [AccountManager]
    code: 200
    input: ["renewal_term_months?"]
    output: ServiceAgreement
    side_effects:
      - "term_end_date = old term_end_date plus renewal_term_months (defaulting to minimum_term_months) months"
      - "status -> ACTIVE; renewal_count incremented by 1"
      - "increments ServiceAgreement.version by 1"

  - method: POST
    path: "/warewashing/service-agreements/{agreement_id}/terminate"
    description: "Terminate an agreement early. From DRAFT the agreement becomes VOID with no fee; from ACTIVE or RENEWAL_PENDING it becomes TERMINATED and the early_termination_fee calculation is stamped."
    roles: [AccountManager]
    code: 200
    input: [effective_date]
    output: ServiceAgreement
    side_effects:
      - "termination_effective_date = request effective_date; early_termination_fee_cents = early_termination_fee output (0 from DRAFT)"
      - "from ACTIVE or RENEWAL_PENDING: CASCADE alpha links 2-4 fire (placements RETRIEVAL_SCHEDULED, dispensers LOCKED_OUT AGREEMENT_ENDED, alerts SUPPRESSED) and Customer.active_agreement_count is decremented by 1"
      - "increments ServiceAgreement.version by 1"

  - method: POST
    path: "/warewashing/machine-placements"
    description: "Place a machine at a site under an ACTIVE agreement. Carries the agreement OCC token; the placement is created PENDING_INSTALL and immediately capitalises the machine's book value onto the customer's equipment ledger."
    roles: [AccountManager]
    code: 201
    input: [site_id, agreement_id, machine_model_id, asset_tag, expected_agreement_version, "initial_cycle_count?"]
    output: MachinePlacement
    side_effects:
      - "placement_status = PENDING_INSTALL, operational_status = UP, installed_at = null"
      - "initial_cycle_count defaults to 0; last_cycle_count = initial_cycle_count; cycles_since_calibration = 0"
      - "adds MachineModel.equipment_value_cents to Customer.equipment_on_placement_value_cents (INVARIANT A)"
      - "increments ServiceAgreement.placement_count by 1"
      - "increments ServiceAgreement.version by 1"
      - "the site's customer must own the agreement, else ERR_UNKNOWN_REFERENCE"

  - method: GET
    path: "/warewashing/machine-placements/{placement_id}"
    description: "Read one placement with both of its independent status axes and its cycle counters."
    roles: [AccountManager, ServiceTechnician, QualityAuditor, CustomerContact]
    code: 200
    input: []
    output: MachinePlacement
    side_effects: []

  - method: GET
    path: "/warewashing/machine-placements"
    description: "List placements, filterable by site, agreement, model and either status axis."
    roles: [AccountManager, ServiceTechnician, QualityAuditor]
    code: 200
    input: ["site_id?", "agreement_id?", "machine_model_id?", "placement_status?", "operational_status?", "limit?", "offset?"]
    output: MachinePlacement[]
    side_effects: []

  - method: POST
    path: "/warewashing/machine-placements/{placement_id}/install"
    description: "Record physical installation. Stamps installed_at from the logical clock, which becomes the earliest admissible reading_at for telemetry."
    roles: [ServiceTechnician]
    code: 200
    input: []
    output: MachinePlacement
    side_effects:
      - "placement_status PENDING_INSTALL -> INSTALLED; installed_at = current_utc"
      - "increments MachinePlacement.version by 1"

  - method: POST
    path: "/warewashing/machine-placements/{placement_id}/retrieval-order"
    description: "Raise an equipment retrieval order. A PENDING_INSTALL placement is cancelled outright; an INSTALLED one is scheduled for retrieval and its queued tickets are cancelled."
    roles: [AccountManager]
    code: 200
    input: ["retrieval_due_date?"]
    output: MachinePlacement
    side_effects:
      - "placement_status PENDING_INSTALL -> CANCELLED, or INSTALLED -> RETRIEVAL_SCHEDULED with retrieval_due_date set (defaulting to date(current_utc) plus 14 days)"
      - "from PENDING_INSTALL: operational_status -> OFFLINE and the customer's equipment ledger is credited back immediately"
      - "every ServiceTicket of this placement with status QUEUED transitions to CANCELLED, and each such ticket's SCHEDULED ServiceVisit transitions to CANCELLED"
      - "increments MachinePlacement.version by 1"

  - method: POST
    path: "/warewashing/machine-placements/{placement_id}/retrieval-completion"
    description: "Confirm the machine has left the site. Removes every dispenser, drives the health axis to OFFLINE and restores the customer's equipment ledger exactly."
    roles: [ServiceTechnician]
    code: 200
    input: []
    output: MachinePlacement
    side_effects:
      - "placement_status RETRIEVAL_SCHEDULED -> RETRIEVED; retrieved_at = current_utc; operational_status -> OFFLINE"
      - "every Dispenser of this placement transitions ACTIVE or LOCKED_OUT -> REMOVED"
      - "subtracts MachineModel.equipment_value_cents from Customer.equipment_on_placement_value_cents, restoring INVARIANT A to its pre-placement value"
      - "increments MachinePlacement.version by 1"

  - method: POST
    path: "/warewashing/dispensers"
    description: "Fit a chemical dispenser to an INSTALLED placement, metering one covered product at an initial calibrated dose."
    roles: [ServiceTechnician]
    code: 201
    input: [placement_id, product_id, calibrated_dose_ml_per_rack]
    output: Dispenser
    side_effects:
      - "dispenser_status = ACTIVE; dose_effective_at = created_at; prior_dose_ml_per_rack = null; last_calibrated_at = null; last_drift_pct = null; lockout_reason = null"
      - "the product must appear in the covering agreement's covered_product_ids, else ERR_PRODUCT_NOT_ON_AGREEMENT"

  - method: GET
    path: "/warewashing/dispensers/{dispenser_id}"
    description: "Read one dispenser with its live dose, its previous dose and its lockout reason."
    roles: [ServiceTechnician, AccountManager, QualityAuditor]
    code: 200
    input: []
    output: Dispenser
    side_effects: []

  - method: GET
    path: "/warewashing/dispensers"
    description: "List dispensers, filterable by placement, metered product and lifecycle status."
    roles: [ServiceTechnician, QualityAuditor, AccountManager]
    code: 200
    input: ["placement_id?", "product_id?", "dispenser_status?", "limit?", "offset?"]
    output: Dispenser[]
    side_effects: []

  - method: GET
    path: "/warewashing/calibration-records/{record_id}"
    description: "Read one immutable calibration record with its drift, its concentration verdict, its efficacy verdict and whether the owning visit was verified (applied)."
    roles: [ServiceTechnician, QualityAuditor, AccountManager]
    code: 200
    input: []
    output: CalibrationRecord
    side_effects: []

  - method: GET
    path: "/warewashing/calibration-records"
    description: "Reverse-reachability read for calibration records, filterable by the visit that produced them, by dispenser, by whether they were applied and by verdict. Records are created nested under a visit but read flat, and records of a rejected visit remain visible with applied false."
    roles: [ServiceTechnician, QualityAuditor, AccountManager]
    code: 200
    input: ["visit_id?", "dispenser_id?", "applied?", "calibration_verdict?", "efficacy_result?", "limit?", "offset?"]
    output: CalibrationRecord[]
    side_effects: []

  - method: POST
    path: "/warewashing/machine-placements/{placement_id}/telemetry-readings"
    description: "Ingest one telemetry sample for an INSTALLED placement. Computes cycle_delta against the preceding DEVICE reading, then runs telemetry_alert_evaluation, which may open alerts, drive the health axis and auto-raise a ticket (CASCADE beta)."
    roles: [PlatformAdmin]
    code: 201
    input: [reading_at, cycle_count_total, wash_temp_f, final_rinse_temp_f, rinse_pressure_psi, "source?"]
    output: TelemetryReading
    side_effects:
      - "source defaults to DEVICE; cycle_delta computed per rack_count_in_period's prev() rule; triggered_alert_types lists the alert types this reading opened, in evaluation order"
      - "updates MachinePlacement.last_cycle_count and cycles_since_calibration"
      - "CASCADE beta link 1 -> 2: each breach opens a TelemetryAlert (de-duplicated against an existing OPEN or ACKNOWLEDGED alert of the same type) and increments MachinePlacement.open_alert_count"
      - "CASCADE beta link 2 -> 3: the most severe alert opened drives operational_status (CRITICAL -> DOWN, WARNING -> DEGRADED from UP)"
      - "CASCADE beta link 3 -> 4: a placement driven to DOWN auto-raises a TELEMETRY_AUTO ServiceTicket with reported_symptom MACHINE_DOWN, alert_id set to the triggering alert, and a dispatch_priority_score stamped from the post-alert state; the ticket is skipped when an open MACHINE_DOWN ticket already exists"
      - "CASCADE beta link 4 -> 5: Site.open_ticket_count and Site.service_posture are re-derived"
      - "increments MachinePlacement.version by 1"

  - method: GET
    path: "/warewashing/telemetry-readings/{reading_id}"
    description: "Read one immutable telemetry sample, including the cycle_delta computed at ingest and the alert types it triggered. Immutable row: no version field, no update endpoint."
    roles: [PlatformAdmin, ServiceTechnician, QualityAuditor]
    code: 200
    input: []
    output: TelemetryReading
    side_effects: []

  - method: GET
    path: "/warewashing/telemetry-readings"
    description: "Reverse-reachability read for the immutable telemetry stream, filterable by placement and source, ordered by reading_at ascending then created_at ascending. Readings are ingested nested under a placement but read flat."
    roles: [PlatformAdmin, ServiceTechnician, QualityAuditor]
    code: 200
    input: ["placement_id?", "source?", "limit?", "offset?"]
    output: TelemetryReading[]
    side_effects: []

  - method: GET
    path: "/warewashing/telemetry-alerts/{alert_id}"
    description: "Read one alert with its severity, the reading that triggered it and its acknowledgement trail."
    roles: [ServiceTechnician, QualityAuditor, AccountManager]
    code: 200
    input: []
    output: TelemetryAlert
    side_effects: []

  - method: GET
    path: "/warewashing/telemetry-alerts"
    description: "List alerts, filterable by placement, by the reading that triggered them, and by type, severity or status. The only discovery channel for cascade-created alerts."
    roles: [ServiceTechnician, QualityAuditor, AccountManager]
    code: 200
    input: ["placement_id?", "triggering_reading_id?", "alert_type?", "severity?", "status?", "limit?", "offset?"]
    output: TelemetryAlert[]
    side_effects: []

  - method: POST
    path: "/warewashing/telemetry-alerts/{alert_id}/acknowledge"
    description: "Acknowledge an OPEN alert. Acknowledgement is bookkeeping only: it does not clear the alert, does not change the placement's health axis and does not stop the alert from feeding the dispatch score."
    roles: [ServiceTechnician]
    code: 200
    input: []
    output: TelemetryAlert
    side_effects:
      - "status OPEN -> ACKNOWLEDGED; acknowledged_by_user_id = X-User-ID"
      - "MachinePlacement.open_alert_count is unchanged - it counts OPEN and ACKNOWLEDGED alike"
      - "increments TelemetryAlert.version by 1"

  - method: POST
    path: "/warewashing/service-tickets"
    description: "File a customer-reported service ticket against an INSTALLED placement. Stamps priority_score and response_deadline_at once, from the state as it stands before the ticket row is inserted."
    roles: [CustomerContact, AccountManager]
    code: 201
    input: [placement_id, reported_symptom]
    output: ServiceTicket
    side_effects:
      - "origin = CUSTOMER_REPORT; reported_by_user_id = X-User-ID; alert_id = null; status = QUEUED; assigned_technician_id = null; sla_breached = false; escalation_level = 0"
      - "requires_sanitation_cert = true when reported_symptom IN {LOW_TEMP, NO_CHEMICAL}"
      - "priority_score and response_deadline_at = dispatch_priority_score outputs"
      - "when reported_symptom == MACHINE_DOWN the placement's operational_status is driven to DOWN AFTER the score is stamped, so the score reflects the pre-request health axis"
      - "Site.open_ticket_count and Site.service_posture are re-derived after insertion"

  - method: GET
    path: "/warewashing/service-tickets/{ticket_id}"
    description: "Read one ticket with its stamped priority, its SLA deadline and its breach/escalation counters."
    roles: [AccountManager, ServiceTechnician, QualityAuditor, CustomerContact]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: []

  - method: GET
    path: "/warewashing/service-tickets"
    description: "List tickets, filterable by placement, by the alert that raised them, by assigned technician and by status. The only discovery channel for cascade-created auto-tickets."
    roles: [AccountManager, ServiceTechnician, QualityAuditor]
    code: 200
    input: ["placement_id?", "alert_id?", "assigned_technician_id?", "status?", "origin?", "limit?", "offset?"]
    output: ServiceTicket[]
    side_effects: []

  - method: POST
    path: "/warewashing/service-tickets/{ticket_id}/dispatch"
    description: "Dispatch a QUEUED ticket. With no override the dispatch_technician_selection selector picks the technician; with override_technician_id the named technician must still pass the whole eligibility filter."
    roles: [PlatformAdmin]
    code: 200
    input: ["override_technician_id?"]
    output: ServiceTicket
    side_effects:
      - "status QUEUED -> DISPATCHED; assigned_technician_id = selected technician"
      - "increments the selected Technician.open_ticket_count by 1 (INVARIANT B)"
      - "on an empty candidate set nothing is mutated at all - the ticket stays QUEUED"
      - "increments ServiceTicket.version by 1"

  - method: POST
    path: "/warewashing/service-visits"
    description: "Schedule a visit window for a DISPATCHED ticket. Enforces the technician's region and a 30-minute travel buffer against every other visit of that technician."
    roles: [ServiceTechnician]
    code: 201
    input: [ticket_id, technician_id, scheduled_start_at, scheduled_end_at, "follow_up_to_visit_id?"]
    output: ServiceVisit
    side_effects:
      - "visit_status = SCHEDULED; arrival_at = null; calibration_record_count = 0; repair_confirmed defaults to false"
      - "the ticket must be in status DISPATCHED and technician_id must equal ticket.assigned_technician_id, else ERR_INVALID_STATE_TRANSITION"
      - "follow_up_to_visit_id, when supplied, must reference a REJECTED visit of the same ticket, else ERR_UNKNOWN_REFERENCE"

  - method: GET
    path: "/warewashing/service-visits/{visit_id}"
    description: "Read one visit with its lifecycle, arrival instant, rejection reason and record count."
    roles: [ServiceTechnician, QualityAuditor, AccountManager]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: []

  - method: GET
    path: "/warewashing/service-visits"
    description: "List visits, filterable by ticket, technician, the visit they follow up on, and status."
    roles: [ServiceTechnician, QualityAuditor, AccountManager]
    code: 200
    input: ["ticket_id?", "technician_id?", "follow_up_to_visit_id?", "visit_status?", "limit?", "offset?"]
    output: ServiceVisit[]
    side_effects: []

  - method: POST
    path: "/warewashing/service-visits/{visit_id}/arrive"
    description: "Record arrival on site, opening the window in which calibration records may be taken."
    roles: [ServiceTechnician]
    code: 200
    input: []
    output: ServiceVisit
    side_effects:
      - "visit_status SCHEDULED -> IN_PROGRESS; arrival_at = current_utc"
      - "the owning ServiceTicket transitions DISPATCHED -> ON_SITE"
      - "increments ServiceVisit.version by 1"

  - method: POST
    path: "/warewashing/service-visits/{visit_id}/submit"
    description: "Submit the visit for audit. Blocked while any record on the visit still stands at efficacy_result FAIL with no later PASS on the same dispenser inside the visit."
    roles: [ServiceTechnician]
    code: 200
    input: ["repair_confirmed?"]
    output: ServiceVisit
    side_effects:
      - "visit_status IN_PROGRESS -> SUBMITTED; repair_confirmed = request value (default false)"
      - "the owning ServiceTicket transitions ON_SITE -> PENDING_VERIFICATION"
      - "increments ServiceVisit.version by 1"

  - method: POST
    path: "/warewashing/service-visits/{visit_id}/verify"
    description: "Audit a SUBMITTED visit. VERIFIED applies every calibration record on the visit (applied = true), resolves the placement's alerts when repair_confirmed and re-derives the health axis; REJECTED rolls every dose back to prior_dose_ml_per_rack and returns the ticket to the queue."
    roles: [QualityAuditor]
    code: 200
    input: [decision, "rejection_reason?"]
    output: ServiceVisit
    side_effects:
      - "decision must be VERIFIED or REJECTED, else ERR_INVALID_REQUEST; rejection_reason is required when decision == REJECTED"
      - "verified_by_user_id = X-User-ID"
      - "on VERIFIED: every CalibrationRecord of the visit gets applied = true, and each dispenser's calibrated_dose_ml_per_rack, prior_dose_ml_per_rack, dose_effective_at, last_calibrated_at and last_drift_pct are updated from the last record of that dispenser within the visit; a LOCKED_OUT dispenser whose final record PASSed returns to ACTIVE; MachinePlacement.cycles_since_calibration resets to 0"
      - "on VERIFIED with repair_confirmed true: every TelemetryAlert of the placement in status OPEN or ACKNOWLEDGED becomes RESOLVED, open_alert_count returns to 0, the ticket becomes CLOSED, the assigned technician's open_ticket_count is decremented by 1, and operational_status is re-derived (UP when no alert and no lockout remains, else DEGRADED)"
      - "on REJECTED: every CalibrationRecord of the visit keeps applied = false, each affected dispenser's calibrated_dose_ml_per_rack is restored from prior_dose_ml_per_rack, the ticket returns to QUEUED with assigned_technician_id cleared, the technician's open_ticket_count is decremented by 1 (INVARIANT B restored) and quality_flag_count is incremented by 1"
      - "Site.open_ticket_count and Site.service_posture are re-derived; increments ServiceVisit.version by 1"

  - method: POST
    path: "/warewashing/service-visits/{visit_id}/calibration-records"
    description: "Record a concentration verification on one dispenser during an IN_PROGRESS visit. Carries the dispenser OCC token. Computes drift_pct, the calibration verdict and the sanitizer efficacy verdict; the new dose does not take effect until the visit is verified."
    roles: [ServiceTechnician]
    code: 201
    input: [dispenser_id, measured_ppm, measured_dose_ml_per_rack, expected_dispenser_version, "adjusted_dose_ml_per_rack?", "contact_seconds?"]
    output: CalibrationRecord
    side_effects:
      - "drift_pct, calibration_verdict and efficacy_result are stamped by concentration_drift_verdict and sanitizer_efficacy_verdict; applied = false; recorded_by_user_id = X-User-ID"
      - "on efficacy_result FAIL the dispenser transitions ACTIVE -> LOCKED_OUT with lockout_reason EFFICACY_FAILURE and the placement's health axis is driven to DOWN immediately, before the visit is submitted"
      - "increments ServiceVisit.calibration_record_count by 1 and Dispenser.version by 1"
      - "immutable row: no version field, no update endpoint"

  - method: POST
    path: "/warewashing/chemical-deliveries"
    description: "Record a chemical delivery to a site. Carries the site OCC token. Prices the delivery through delivery_amount's volume tiers with per-unit rounding."
    roles: [AccountManager]
    code: 201
    input: [site_id, product_id, delivered_at, unit_count, expected_site_version]
    output: ChemicalDelivery
    side_effects:
      - "status = DELIVERED; quantity_ml and amount_cents = delivery_amount outputs"
      - "unit_count must be >= 1, else ERR_INVALID_REQUEST"
      - "increments Site.version by 1"

  - method: GET
    path: "/warewashing/chemical-deliveries/{delivery_id}"
    description: "Read one delivery with its computed volume and discounted amount."
    roles: [AccountManager, QualityAuditor, CustomerContact]
    code: 200
    input: []
    output: ChemicalDelivery
    side_effects: []

  - method: GET
    path: "/warewashing/chemical-deliveries"
    description: "List deliveries, filterable by site, product and status. VOIDED deliveries are returned but are excluded from every aggregate."
    roles: [AccountManager, QualityAuditor, CustomerContact]
    code: 200
    input: ["site_id?", "product_id?", "status?", "limit?", "offset?"]
    output: ChemicalDelivery[]
    side_effects: []

  - method: POST
    path: "/warewashing/chemical-deliveries/{delivery_id}/void"
    description: "Void a mis-keyed delivery. Refused while a published variance review already covers the delivery's instant, so a published figure can never be rewritten under itself."
    roles: [AccountManager]
    code: 200
    input: []
    output: ChemicalDelivery
    side_effects:
      - "status DELIVERED -> VOIDED; the delivery leaves delivered_ml, chemical_spend_cents and every other status-filtered aggregate"
      - "increments Site.version by 1"

  - method: POST
    path: "/warewashing/usage-variance-reviews"
    description: "Open a DRAFT product-usage variance review over a half-open window for one site and product. Stamps rack_count_in_period, expected_consumption_ml (per the requested basis), actual_consumption_ml, variance_pct and the classification at creation time; the figures are frozen from then on."
    roles: [QualityAuditor]
    code: 201
    input: [site_id, product_id, period_start, period_end, basis, opening_inventory_ml, ending_inventory_ml]
    output: UsageVarianceReview
    side_effects:
      - "status = DRAFT; created_by_user_id = X-User-ID; published_by_user_id = null"
      - "rack_count_in_period, expected_consumption_ml, actual_consumption_ml, variance_pct and classification are stamped by rack_count_in_period, expected_chemical_consumption and usage_variance_classification"
      - "basis must be NAMEPLATE or AS_CALIBRATED, else ERR_INVALID_REQUEST"

  - method: GET
    path: "/warewashing/usage-variance-reviews/{review_id}"
    description: "Read one review with its frozen expected/actual figures, variance percentage and classification."
    roles: [QualityAuditor, AccountManager]
    code: 200
    input: []
    output: UsageVarianceReview
    side_effects: []

  - method: GET
    path: "/warewashing/usage-variance-reviews"
    description: "List reviews, filterable by site, product, status and classification."
    roles: [QualityAuditor, AccountManager]
    code: 200
    input: ["site_id?", "product_id?", "status?", "classification?", "limit?", "offset?"]
    output: UsageVarianceReview[]
    side_effects: []

  - method: POST
    path: "/warewashing/usage-variance-reviews/{review_id}/publish"
    description: "Publish a DRAFT review, making its figures the account's official variance record and unlocking escalation. Blocked while the site's posture is CRITICAL and blocked when the window carries no usable telemetry."
    roles: [QualityAuditor]
    code: 200
    input: []
    output: UsageVarianceReview
    side_effects:
      - "status DRAFT -> PUBLISHED; published_by_user_id = X-User-ID"
      - "the frozen figures are NOT recomputed at publish time, even if telemetry or deliveries have changed since creation"
      - "increments UsageVarianceReview.version by 1"

  - method: POST
    path: "/warewashing/usage-variance-reviews/{review_id}/close"
    description: "Close a PUBLISHED review with no investigation. An ESCALATED review cannot be closed here - only its case's adjudication closes it."
    roles: [QualityAuditor]
    code: 200
    input: []
    output: UsageVarianceReview
    side_effects:
      - "status PUBLISHED -> CLOSED"
      - "increments UsageVarianceReview.version by 1"

  - method: POST
    path: "/warewashing/investigation-cases"
    description: "Open a theft/dilution investigation against a PUBLISHED review, which escalates the review in the same request."
    roles: [QualityAuditor]
    code: 201
    input: [variance_review_id, opened_reason]
    output: InvestigationCase
    side_effects:
      - "case_status = EVIDENCE_GATHERING; opened_by_user_id = X-User-ID; evidence_item_count = 0; return_count = 0; remediation = NONE; chargeback_cents = 0"
      - "the linked UsageVarianceReview transitions PUBLISHED -> ESCALATED"
      - "at most one case may exist per review, else ERR_INVALID_STATE_TRANSITION"

  - method: GET
    path: "/warewashing/investigation-cases/{case_id}"
    description: "Read one case with its evidence and return counters, remediation and chargeback."
    roles: [QualityAuditor, AccountManager]
    code: 200
    input: []
    output: InvestigationCase
    side_effects: []

  - method: GET
    path: "/warewashing/investigation-cases"
    description: "List cases, filterable by the review they were opened against and by status."
    roles: [QualityAuditor, AccountManager]
    code: 200
    input: ["variance_review_id?", "case_status?", "limit?", "offset?"]
    output: InvestigationCase[]
    side_effects: []

  - method: POST
    path: "/warewashing/investigation-cases/{case_id}/submit-for-review"
    description: "Attach evidence and submit the case for adjudication. Callable again after a RETURN decision; evidence_item_count accumulates across submissions."
    roles: [QualityAuditor]
    code: 200
    input: [evidence_types]
    output: InvestigationCase
    side_effects:
      - "case_status EVIDENCE_GATHERING -> PENDING_REVIEW; evidence_item_count += length(evidence_types)"
      - "evidence_types must be a non-empty array of members of {DELIVERY_LOG, TELEMETRY_EXPORT, CALIBRATION_HISTORY, INVENTORY_COUNT, CCTV_REVIEW, STAFF_INTERVIEW}, else ERR_INVALID_REQUEST"
      - "increments InvestigationCase.version by 1"

  - method: POST
    path: "/warewashing/investigation-cases/{case_id}/review"
    description: "Adjudicate a PENDING_REVIEW case. RETURN sends it back for more evidence; SUBSTANTIATE or DISMISS is terminal and closes the linked review (CASCADE gamma). Requires an auditor who neither opened the case nor published the review."
    roles: [QualityAuditor]
    code: 200
    input: [decision, "remediation?", "finding_note?"]
    output: InvestigationCase
    side_effects:
      - "decision must be SUBSTANTIATE, DISMISS or RETURN, else ERR_INVALID_REQUEST"
      - "on RETURN: case_status -> EVIDENCE_GATHERING and return_count += 1; the linked review stays ESCALATED"
      - "on SUBSTANTIATE: remediation = request remediation (one of CHARGEBACK, DISPENSER_REPLACEMENT, TRAINING); chargeback_cents = theft_chargeback output when remediation == CHARGEBACK else 0; adjudication requires evidence_item_count >= 2"
      - "on SUBSTANTIATE or DISMISS: CASCADE gamma links 2-4 fire - the review moves ESCALATED -> CLOSED, and only when remediation == DISPENSER_REPLACEMENT do the site's dispensers metering the reviewed product move ACTIVE -> LOCKED_OUT with lockout_reason INVESTIGATION_HOLD and their placements' health axis to DEGRADED"
      - "increments InvestigationCase.version by 1"

  - method: GET
    path: "/warewashing/sites/{site_id}/sustainability-report"
    description: "Computed read: water and energy savings against the site's pre-program baselines over a half-open window, priced at the site's tariffs, with the program's service fee tier and sustainability credit. basis selects the RATED or TELEMETRY_MEASURED variant. Nothing is persisted."
    roles: [AccountManager, CustomerContact, QualityAuditor]
    code: 200
    input: [period_start, period_end, basis]
    output: { site_id: string, basis: string, period_start: datetime, period_end: datetime, rack_count: integer, water_saved_l: number, energy_saved_kwh: number, water_savings_cents: integer, energy_savings_cents: integer, gross_savings_cents: integer, chemical_spend_cents: integer, gross_program_cost_cents: integer, service_fee_rate: number, service_fee_cents: integer, sustainability_credit_cents: integer, net_program_cost_cents: integer, goal_attainment_pct: number }
    side_effects:
      - "basis must be RATED or TELEMETRY_MEASURED, else ERR_INVALID_REQUEST"
      - "no state is mutated and no version is incremented"

  - method: GET
    path: "/warewashing/sites/{site_id}/inspection-dossier"
    description: "Computed read: the health-inspection evidence pack for a half-open window - sanitizer efficacy tests, calibration records and final-rinse temperature exceptions - counting only evidence from VERIFIED visits. Nothing is persisted."
    roles: [QualityAuditor, AccountManager, CustomerContact]
    code: 200
    input: [period_start, period_end]
    output: { site_id: string, period_start: datetime, period_end: datetime, calibration_records_total: integer, sanitizer_tests_total: integer, sanitizer_tests_passed: integer, latest_efficacy_result: string, final_rinse_temp_readings_total: integer, final_rinse_temp_exceptions: integer, open_critical_alert_count: integer, dossier_status: string }
    side_effects:
      - "no state is mutated and no version is incremented"

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing or empty on any endpoint other than POST /warewashing/_clock/set_current_utc"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "X-User-Role is not among the addressed endpoint's declared roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a CustomerContact addresses a resource belonging to another Customer, or a ServiceTechnician schedules or submits a visit for another Technician"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the adjudicating auditor's X-User-ID equals the case's opened_by_user_id or the reviewed review's published_by_user_id"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing required field, wrong type, unknown enum member, negative money or count, inverted interval, clock set backwards, sanitizer window supplied on a non-sanitizer product, or an unknown decision / remediation / basis / evidence type"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside [1, 100] or offset negative or non-integer on a list endpoint"
  - id: ERR_CUSTOMER_CREDIT_HOLD
    http: 402
    condition: "Customer.billing_status is CREDIT_HOLD when placing a machine or recording a delivery, and the request is otherwise entirely valid"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "a path {id} segment does not resolve to a row of the expected entity type"
  - id: ERR_UNKNOWN_REFERENCE
    http: 422
    condition: "a foreign key in the request body does not resolve, a covered_product_ids member is unknown, the agreement does not belong to the site's customer, or follow_up_to_visit_id is not a REJECTED visit of the same ticket"
  - id: ERR_STALE_PARENT_VERSION
    http: 412
    condition: "expected_agreement_version, expected_site_version or expected_dispenser_version does not equal the parent's current version"
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the requested trigger is not declared from the entity's current state - including a repeat of the same trigger, a trigger fired from a terminal state, scheduling a visit for a ticket that is not DISPATCHED, or opening a second investigation against one review"
  - id: ERR_AGREEMENT_NOT_ACTIVE
    http: 409
    condition: "a machine placement is created against an agreement whose status is not ACTIVE"
  - id: ERR_PLACEMENT_NOT_INSTALLED
    http: 409
    condition: "a dispenser, a telemetry reading or a service ticket is created against a placement whose placement_status is not INSTALLED"
  - id: ERR_VISIT_NOT_IN_PROGRESS
    http: 409
    condition: "a calibration record is attached to a visit whose visit_status is not IN_PROGRESS"
  - id: ERR_TICKET_NOT_DISPATCHABLE
    http: 409
    condition: "dispatch is requested for a ticket whose status is not QUEUED"
  - id: ERR_NO_ELIGIBLE_TECHNICIAN
    http: 409
    condition: "the dispatch eligibility filter yields an empty candidate set, or the named override technician fails it for a reason other than region"
  - id: ERR_OPEN_TICKET_BLOCKS_RETRIEVAL
    http: 409
    condition: "retrieval completion is requested while a ticket of the placement is DISPATCHED, ON_SITE or PENDING_VERIFICATION"
  - id: ERR_REVIEW_NOT_DRAFT
    http: 409
    condition: "publication is requested for a review whose status is not DRAFT"
  - id: ERR_REVIEW_NOT_PUBLISHED
    http: 409
    condition: "an investigation is opened against, or a close is requested for, a review whose status is not PUBLISHED"
  - id: ERR_CASE_NOT_IN_REVIEW
    http: 409
    condition: "adjudication is requested for a case that is not PENDING_REVIEW, or submit-for-review is requested for a case that is not EVIDENCE_GATHERING"
  - id: ERR_SANITIZER_LOCKOUT_ACTIVE
    http: 409
    condition: "a calibration record is recorded against a dispenser locked out with lockout_reason AGREEMENT_ENDED or INVESTIGATION_HOLD"
  - id: ERR_EFFICACY_FAILURE_UNRESOLVED
    http: 409
    condition: "a visit is submitted while one of its records still stands at efficacy_result FAIL with no later PASS on that dispenser inside the visit"
  - id: ERR_SITE_POSTURE_CRITICAL
    http: 409
    condition: "a variance review is published while its site's service_posture is CRITICAL"
  - id: ERR_PRODUCT_NOT_ON_AGREEMENT
    http: 422
    condition: "a dispenser or a delivery names a product absent from the covering agreement's covered_product_ids"
  - id: ERR_DISPENSER_PLACEMENT_MISMATCH
    http: 422
    condition: "a calibration record names a dispenser fitted to a placement other than the visit's placement"
  - id: ERR_TECHNICIAN_REGION_MISMATCH
    http: 422
    condition: "the technician's region_code differs from the serviced site's region_code, on visit scheduling or on an override dispatch"
  - id: ERR_DUPLICATE_DISPENSER_PRODUCT
    http: 409
    condition: "a second ACTIVE or LOCKED_OUT dispenser is fitted for the same product on the same placement"
  - id: ERR_DUPLICATE_OPEN_TICKET
    http: 409
    condition: "a customer files a second ticket with the same reported_symptom while one is still open on that placement"
  - id: ERR_ASSET_TAG_TAKEN
    http: 409
    condition: "asset_tag is already held by a placement whose placement_status is not CANCELLED"
  - id: ERR_NON_MONOTONIC_CYCLE_COUNT
    http: 422
    condition: "a DEVICE reading's cycle_count_total is below the preceding DEVICE reading's total, or below the placement's initial_cycle_count"
  - id: ERR_ADJUSTED_DOSE_REQUIRED
    http: 422
    condition: "the concentration verdict is ADJUSTED but adjusted_dose_ml_per_rack is absent or not greater than zero"
  - id: ERR_INSUFFICIENT_TELEMETRY
    http: 422
    condition: "publication is requested for a review whose rack_count_in_period or expected_consumption_ml is zero"
  - id: ERR_TECHNICIAN_SCHEDULE_CONFLICT
    http: 409
    condition: "the proposed visit window overlaps another visit of the same technician once the 30-minute travel buffer is applied to both sides"
  - id: ERR_REVIEW_PERIOD_OVERLAP
    http: 409
    condition: "the proposed review window overlaps a live review of the same site and product; exact adjacency at period_end is allowed"
  - id: ERR_RENEWAL_WINDOW_NOT_OPEN
    http: 409
    condition: "renewal is requested before term_end_date minus renewal_notice_days, or at or after term_end_date"
  - id: ERR_DELIVERY_IN_CLOSED_PERIOD
    http: 409
    condition: "a void is requested for a delivery whose delivered_at falls inside the window of a PUBLISHED, ESCALATED or CLOSED variance review of the same site and product"
  - id: ERR_PERIOD_OUTSIDE_AGREEMENT_TERM
    http: 422
    condition: "a review window falls outside [start_date, term_end_date] of the covering agreement"
  - id: ERR_READING_BEFORE_INSTALL
    http: 422
    condition: "a reading's reading_at precedes the placement's installed_at or exceeds the logical clock's current value"

roles:
  - name: AccountManager
    description: "Commercial owner of the account: registers customers and sites, drafts, activates, renews and terminates supply agreements, places and retrieves machines, and records chemical deliveries."
    identity: "opaque"
    exclusive_operations:
      - "POST /warewashing/customers"
      - "POST /warewashing/sites"
      - "POST /warewashing/service-agreements"
      - "POST /warewashing/service-agreements/{agreement_id}/activate"
      - "POST /warewashing/service-agreements/{agreement_id}/renewal"
      - "POST /warewashing/service-agreements/{agreement_id}/terminate"
      - "POST /warewashing/machine-placements"
      - "POST /warewashing/machine-placements/{placement_id}/retrieval-order"
      - "POST /warewashing/chemical-deliveries"
      - "POST /warewashing/chemical-deliveries/{delivery_id}/void"
    shared_operations:
      - "POST /warewashing/service-tickets (with CustomerContact)"
      - "GET on customers, sites, agreements, placements, dispensers, alerts, tickets, visits, deliveries, reviews and cases"
      - "GET /warewashing/sites/{site_id}/sustainability-report and GET /warewashing/sites/{site_id}/inspection-dossier (with CustomerContact and QualityAuditor)"

  - name: ServiceTechnician
    description: "Field technician: installs and retrieves machines, fits dispensers, acknowledges alerts, schedules and works service visits, and records concentration and efficacy verifications."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /warewashing/machine-placements/{placement_id}/install"
      - "POST /warewashing/machine-placements/{placement_id}/retrieval-completion"
      - "POST /warewashing/dispensers"
      - "POST /warewashing/telemetry-alerts/{alert_id}/acknowledge"
      - "POST /warewashing/service-visits"
      - "POST /warewashing/service-visits/{visit_id}/arrive"
      - "POST /warewashing/service-visits/{visit_id}/submit"
      - "POST /warewashing/service-visits/{visit_id}/calibration-records"
    shared_operations:
      - "GET on sites, products, models, technicians, placements, dispensers, telemetry readings (GET /warewashing/telemetry-readings and GET /warewashing/telemetry-readings/{reading_id}), alerts, tickets, visits and calibration records (GET /warewashing/calibration-records and GET /warewashing/calibration-records/{record_id})"

  - name: QualityAuditor
    description: "Independent compliance reviewer: audits submitted visits, builds and publishes usage-variance reviews, opens and adjudicates theft/dilution investigations, and assembles health-inspection dossiers. Two distinct auditors are required to turn a variance into a chargeback."
    identity: "opaque"
    exclusive_operations:
      - "POST /warewashing/service-visits/{visit_id}/verify"
      - "POST /warewashing/usage-variance-reviews"
      - "POST /warewashing/usage-variance-reviews/{review_id}/publish"
      - "POST /warewashing/usage-variance-reviews/{review_id}/close"
      - "POST /warewashing/investigation-cases"
      - "POST /warewashing/investigation-cases/{case_id}/submit-for-review"
      - "POST /warewashing/investigation-cases/{case_id}/review"
    shared_operations:
      - "GET on sites, products, models, technicians, agreements, placements, dispensers, telemetry readings, alerts, tickets, visits, calibration records, deliveries, reviews and cases"
      - "GET /warewashing/sites/{site_id}/inspection-dossier and GET /warewashing/sites/{site_id}/sustainability-report (with AccountManager and CustomerContact)"

  - name: CustomerContact
    description: "Kitchen-side contact for one account: reports machine problems and reads that account's own equipment, delivery, savings and inspection data. X-User-ID is the Customer id, so every read is scoped to that account."
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "POST /warewashing/service-tickets (with AccountManager)"
      - "GET /warewashing/customers/{customer_id}, GET /warewashing/sites/{site_id}, GET /warewashing/service-agreements/{agreement_id}, GET /warewashing/machine-placements/{placement_id}, GET /warewashing/service-tickets/{ticket_id}, GET /warewashing/chemical-deliveries and GET /warewashing/chemical-deliveries/{delivery_id} - all restricted to its own account"
      - "GET /warewashing/sites/{site_id}/sustainability-report and GET /warewashing/sites/{site_id}/inspection-dossier - own account only"

  - name: PlatformAdmin
    description: "Operator of the platform itself: maintains the chemical and machine catalogs and the technician roster, ingests device telemetry, runs the dispatch selector, and drives the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /warewashing/_clock/set_current_utc"
      - "POST /warewashing/chemical-products"
      - "POST /warewashing/machine-models"
      - "POST /warewashing/technicians"
      - "PATCH /warewashing/technicians/{technician_id}"
      - "POST /warewashing/machine-placements/{placement_id}/telemetry-readings"
      - "POST /warewashing/service-tickets/{ticket_id}/dispatch"
    shared_operations:
      - "GET /warewashing/chemical-products/{product_id}, GET /warewashing/machine-models/{model_id}, GET /warewashing/technicians/{technician_id}, GET /warewashing/telemetry-readings and GET /warewashing/telemetry-readings/{reading_id}"
