              as: QueueAdministrator
              captures: { cg_id: $.data.id }
          trigger:
            - call: "POST /interconnection/projects"
              payload: { developer_id: "${dev_id}", cluster_group_id: "${cg_id}", project_name: "At20", technology: "SOLAR", capacity_mw: 20, service_type: "ENERGY_ONLY", point_of_interconnection: "SUB-20" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p_at: $.data.id }
            - call: "POST /interconnection/projects"
              payload: { developer_id: "${dev_id}", cluster_group_id: "${cg_id}", project_name: "Over20", technology: "SOLAR", capacity_mw: 20.5, service_type: "ENERGY_ONLY", point_of_interconnection: "SUB-21" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p_over: $.data.id }
          assert:
            - "Project.${p_at}.deposit_required_cents == 2000000 (exactly 20 * 100000; zero tier-2 MW)"
            - "Project.${p_over}.deposit_required_cents == 2125000 (2000000 + 0.5 * 250000)"

      - name: execution_deadline_exact_timestamp
        grounds:
          - calculations.agreement_execution_deadline
          - state_machines.InterconnectionAgreement.ISSUED_to_EXECUTED
        distinguishing_aspect: |
          Metric is a timestamp on POST /agreements/{id}/execute (distinct endpoint and
          metric from the deposit MW boundary): executing at exactly the
          execution_deadline is permitted (inclusive <=), one second later is rejected
          and expires the agreement.
