      - name: existence_check_precedes_request_shape_check_not_found
        claim_type: Priority Ordering
        grounds:
          - validations[priority=3]
          - validations[priority=12]
          - validations[priority=16]
          - errors.ERR_PLAN_YEAR_NOT_FOUND
        distinguishing_aspect: |
          One call violates three rules at once - unknown plan_year_id (priority
          3), an undeclared to_status enum member (priority 12) and an illegal
          transition (priority 16) - and must surface the lowest-numbered rule's
          error, ERR_PLAN_YEAR_NOT_FOUND with 404. The same bad enum against a
          real plan year then yields ERR_INVALID_REQUEST with 400, proving 12
          precedes 16 as well.
        test_recipe:
          setup:
            - "One PlanYear 2027 in status DRAFT."
            - "The id 00000000-0000-0000-0000-000000000000 belongs to no PlanYear."
          setup_api_calls:
            - call: "POST /retiree-benefits/plan-years"
              payload: { year: 2027, open_enrollment_start: "2026-10-15T00:00:00Z", open_enrollment_end: "2026-11-15T00:00:00Z", coverage_start: "2027-01-01T00:00:00Z", hra_credit_pre_medicare_cents: 185000, hra_credit_medicare_cents: 209500, carryover_cap_pct: 0.5, discount_rate_bps: 500, assumed_annual_subsidy_cents: 240000, assumed_payment_years: 20 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { py_id: $.data.id }
          trigger:
            - call: "POST /retiree-benefits/plan-years/00000000-0000-0000-0000-000000000000/status"
              payload: { to_status: "SUSPENDED" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { err_missing: $.data.error_id }
            - call: "POST /retiree-benefits/plan-years/${py_id}/status"
              payload: { to_status: "SUSPENDED" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { err_enum: $.data.error_id }
          assert:
            - "UNKNOWN ID PLUS BAD ENUM: HTTP 404 with data.error_id == ERR_PLAN_YEAR_NOT_FOUND"
            - "UNKNOWN ID PLUS BAD ENUM: the response is not 400 ERR_INVALID_REQUEST and not 409 ERR_INVALID_PLAN_YEAR_TRANSITION"
            - "REAL ID PLUS BAD ENUM: HTTP 400 with data.error_id == ERR_INVALID_REQUEST, so priority 12 outranks priority 16"
            - "PlanYear.${py_id}.status is still DRAFT with version 1"

