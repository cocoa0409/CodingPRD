        distinguishing_aspect: "MailJob declares cancel edges only from RECEIVED and HYGIENE_CLEARED. A POOLED job is already contributing pieces to a batch's total_piece_count, so cancelling it from POOLED would silently desynchronise the batch ledger; the transition must be refused with ERR_INVALID_JOB_STATE and the ledger left intact. Removing the member first makes the same cancel legal."
        test_recipe:
          setup:
            - "Client PIVOT is ACTIVE with an ACTIVE permit account and one hygiene-cleared MARKETING_MAIL/LETTERS job of 1200 accepted pieces."
