        grounds:
          - validations[priority=4]
          - validations[priority=5]
        distinguishing_aspect: |
          Pair = business_referential (priority 4, ERR_NOT_ORDER_OWNER) vs state
          (priority 5, ERR_INVALID_STATE). A non-owner customer confirms an
          already-CONFIRMED order: both checks would fail, owner check (higher
          priority) wins -> ERR_NOT_ORDER_OWNER, not ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Order owned by customer A, already CONFIRMED. A second customer B exists in the same shop."
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Prio Shop", tax_rate_bps: 0, rush_surcharge_bps: 0, rush_cutoff_hour_utc: 23, standard_turnaround_days: 3, rush_turnaround_days: 1, daily_unit_capacity: 100 }
