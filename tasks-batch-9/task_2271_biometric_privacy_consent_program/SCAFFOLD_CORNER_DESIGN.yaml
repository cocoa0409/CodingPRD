scaffold_corner_design:
  - section: entities
    instances:
      - name: program_creation_returns_envelope_and_all_declared_fields
        claim_type: creation
        grounds:
          - entities.ComplianceProgram
          - endpoints["POST /programs"]
          - response_envelope
        distinguishing_aspect: "POST /programs with all three required inputs returns 201, the meta/response_type/data envelope, and every declared field including the computed posture OPEN and inventory_completeness_pct 100.00 for an empty inventory."
        test_recipe:
          setup:
            - "Empty database; the logical clock sits at its default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: 1093750 }
              as: SystemOperator
              captures: { prog_id: $.data.id }
          assert:
            - "HTTP 201 with response_type == object and meta.api_request_id present"
            - "data.org_name == Northline Retail Group, data.org_type == HYBRID, data.exposure_ceiling_cents == 1093750"
            - "data.posture == OPEN, data.consent_gap_count == 0, data.gated_asset_count == 0, data.open_deletion_obligation_count == 0, data.pra_exposure_cents == 0"
            - "data.inventory_completeness_pct == 100.00 (empty-inventory convention)"
            - "data.version == 1, data.created_at == 2026-08-01T00:00:00.000Z and data.updated_at == 2026-08-01T00:00:00.000Z"

      - name: jurisdiction_retrieval_returns_stored_state_profile
        claim_type: retrieval
        grounds:
          - entities.Jurisdiction
          - endpoints["GET /jurisdictions/{jurisdiction_id}"]
        distinguishing_aspect: "GET /jurisdictions/{jurisdiction_id} echoes every stored statutory parameter, including the optional statutory_cap_cents left at its null default, and reports version 1 for an untouched row."
        test_recipe:
          setup:
            - "One ComplianceProgram with a single Jurisdiction WA created with statutory_cap_cents omitted."
          setup_api_calls:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: 1093750 }
              as: SystemOperator
              captures: { prog_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { program_id: "${prog_id}", state_code: "WA", statute_name: "My Health My Data", private_right_of_action: "LIMITED", damages_model: "STATUTORY_PER_VIOLATION", requires_written_release: false, translation_required: false, required_locales: ["en"], retention_max_days: 730, notice_lead_days: 0, per_violation_negligent_cents: 50000, per_violation_reckless_cents: 200000, cure_period_days: 30 }
              as: SystemOperator
              captures: { wa_id: $.data.id }
          trigger:
            - call: "GET /jurisdictions/${wa_id}"
              as: PrivacyOfficer
              as_user_id: "po-1"
          assert:
            - "HTTP 200 with data.id == ${wa_id} and data.program_id == ${prog_id}"
            - "data.state_code == WA, data.private_right_of_action == LIMITED, data.damages_model == STATUTORY_PER_VIOLATION"
            - "data.retention_max_days == 730, data.notice_lead_days == 0, data.cure_period_days == 30"
            - "data.statutory_cap_cents == null (omitted optional input keeps its declared default)"
            - "data.version == 1"

      - name: biometric_asset_listing_paginates_and_filters_by_status
        claim_type: listing
        grounds:
          - endpoints["GET /biometric-assets"]
          - response_envelope.pagination_fields
          - entities.BiometricAsset.fields.status
        distinguishing_aspect: "GET /biometric-assets combines a status filter with limit/offset and returns the four pagination fields; total_count reflects the filtered set, not the whole table, and has_more flips with offset."
        test_recipe:
          setup:
            - "One ComplianceProgram with Jurisdiction IL and three BiometricAsset rows: two advanced to CLASSIFIED and one left in DISCOVERED."
          setup_api_calls:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: 1093750 }
              as: SystemOperator
              captures: { prog_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { program_id: "${prog_id}", state_code: "IL", statute_name: "BIPA", private_right_of_action: "FULL", damages_model: "STATUTORY_PER_VIOLATION", requires_written_release: true, translation_required: true, required_locales: ["en", "es"], retention_max_days: 1095, notice_lead_days: 14, per_violation_negligent_cents: 100000, per_violation_reckless_cents: 500000, cure_period_days: 0 }
              as: SystemOperator
              captures: { il_id: $.data.id }
            - call: "POST /biometric-assets"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", system_category: "TIMEKEEPING", modality: "FINGERPRINT", subject_class: "EMPLOYEE", template_storage_location: "tk-vault-01", declared_retention_days: 30, retention_basis: "SCHEDULE_ONLY" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { a1_id: $.data.id }
            - call: "POST /biometric-assets"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", system_category: "ACCESS_CONTROL", modality: "HAND_GEOMETRY", subject_class: "EMPLOYEE", template_storage_location: "door-vault-01", declared_retention_days: 30, retention_basis: "SCHEDULE_ONLY" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { a2_id: $.data.id }
            - call: "POST /biometric-assets"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", system_category: "SECURITY_CAMERA", modality: "FACE_GEOMETRY", subject_class: "EMPLOYEE", template_storage_location: "cam-vault-01", declared_retention_days: 30, retention_basis: "SCHEDULE_ONLY" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { a3_id: $.data.id }
            - call: "POST /biometric-assets/${a1_id}/transitions"
              payload: { to_status: "CLASSIFIED" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /biometric-assets/${a2_id}/transitions"
              payload: { to_status: "CLASSIFIED" }
              as: PrivacyOfficer
              as_user_id: "po-1"
          trigger:
            - call: "GET /biometric-assets"
              payload: { program_id: "${prog_id}", status: "CLASSIFIED", limit: 1, offset: 0 }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "GET /biometric-assets"
              payload: { program_id: "${prog_id}", status: "CLASSIFIED", limit: 1, offset: 1 }
              as: PrivacyOfficer
              as_user_id: "po-1"
          assert:
            - "First page: HTTP 200, response_type == array, limit == 1, offset == 0, total_count == 2, has_more == true, and exactly one asset row is returned"
            - "Second page: limit == 1, offset == 1, total_count == 2, has_more == false"
            - "The DISCOVERED asset ${a3_id} appears in neither page (the status filter excludes it)"
            - "Rows are returned in created_at ASC order, so the first page holds ${a1_id} and the second holds ${a2_id}"

      - name: get_program_with_unknown_id_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_PROGRAM_NOT_FOUND]
          - endpoints["GET /programs/{program_id}"]
        distinguishing_aspect: "A syntactically valid but unknown program id returns the error envelope with ERR_PROGRAM_NOT_FOUND and HTTP 404 rather than an empty object or a 200."
        test_recipe:
          setup:
            - "One ComplianceProgram exists, so the table is non-empty and the 404 cannot be an artifact of an empty store."
          setup_api_calls:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: 1093750 }
              as: SystemOperator
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /programs/00000000-0000-4000-8000-000000000000"
              as: SystemOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with response_type == error and data.error_id == ERR_PROGRAM_NOT_FOUND"
            - "data.message is a non-empty string"
            - "The existing program ${prog_id} is unaffected and still readable"

      - name: jurisdiction_missing_required_field_returns_400
        claim_type: required_fields
        grounds:
          - entities.Jurisdiction.fields.damages_model
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=3]
        distinguishing_aspect: "Omitting the required input damages_model (a field with source: input and no declared default) yields ERR_INVALID_REQUEST 400 at priority 3, before any existence or state check runs."
        test_recipe:
          setup:
            - "One ComplianceProgram exists."
          setup_api_calls:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: 1093750 }
              as: SystemOperator
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /jurisdictions"
              payload: { program_id: "${prog_id}", state_code: "IL", statute_name: "BIPA", private_right_of_action: "FULL", requires_written_release: true, translation_required: true, required_locales: ["en", "es"], retention_max_days: 1095, notice_lead_days: 14, per_violation_negligent_cents: 100000, per_violation_reckless_cents: 500000, cure_period_days: 0 }
              as: SystemOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "No Jurisdiction row is created: GET /jurisdictions with program_id ${prog_id} returns total_count 0"
            - "ComplianceProgram.${prog_id}.version is still 1 (a rejected child create does not touch the parent)"

      - name: notice_packet_optional_inputs_take_declared_defaults
        claim_type: defaults
        grounds:
          - entities.NoticePacket.fields.effective_to
          - entities.NoticePacket.fields.status
          - entities.NoticePacket.fields.consent_eligible_from
        distinguishing_aspect: "Creating a NoticePacket without effective_to leaves it null (an open-ended window), status defaults to DRAFT and consent_eligible_from stays null until publication stamps published_at."
        test_recipe:
          setup:
            - "One ComplianceProgram with Jurisdiction IL and one PUBLISHED policy v1.0 scoped to IL."
          setup_api_calls:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: 1093750 }
              as: SystemOperator
              captures: { prog_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { program_id: "${prog_id}", state_code: "IL", statute_name: "BIPA", private_right_of_action: "FULL", damages_model: "STATUTORY_PER_VIOLATION", requires_written_release: true, translation_required: true, required_locales: ["en", "es"], retention_max_days: 1095, notice_lead_days: 14, per_violation_negligent_cents: 100000, per_violation_reckless_cents: 500000, cure_period_days: 0 }
              as: SystemOperator
              captures: { il_id: $.data.id }
            - call: "POST /policies"
              payload: { program_id: "${prog_id}", version_label: "v1.0", retention_days: 30, destruction_trigger: "FIXED_SCHEDULE", release_language_included: true, jurisdiction_scope: ["${il_id}"] }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { pol1_id: $.data.id }
            - call: "POST /policies/${pol1_id}/transitions"
              payload: { to_status: "IN_REVIEW" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "GET /programs/${prog_id}"
              as: ComplianceApprover
              as_user_id: "ca-1"
              captures: { prog_v1: $.data.version }
            - call: "POST /policies/${pol1_id}/publish"
              payload: { expected_program_version: "${prog_v1}" }
              as: ComplianceApprover
              as_user_id: "ca-1"
          trigger:
            - call: "POST /notice-packets"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", policy_id: "${pol1_id}", audience: "EMPLOYEE", locales: ["en", "es"], accommodation_channel: "privacy@northline.example", effective_from: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { np1_id: $.data.id }
          assert:
            - "HTTP 201 with data.effective_to == null"
            - "data.status == DRAFT, data.published_at == null and data.consent_eligible_from == null"
            - "data.version == 1 and data.created_at == 2026-08-01T00:00:00.000Z"

      - name: vendor_risk_score_computed_client_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Vendor.fields.risk_score
          - calculations.vendor_risk_score
          - endpoints["POST /vendors"]
        distinguishing_aspect: "risk_score is source: computed — a client-supplied risk_score in the create body is discarded and the server writes 40 from the formula (base 20 + NOT_REQUESTED 20)."
        test_recipe:
          setup:
            - "One ComplianceProgram exists."
          setup_api_calls:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: 1093750 }
              as: SystemOperator
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /vendors"
              payload: { program_id: "${prog_id}", name: "ClockPoint Systems", sells_biometric_data: false, subprocessor_count: 0, deletion_sla_days: 15, subprocessor_disclosure_complete: true, risk_score: 0 }
              as: VendorManager
              as_user_id: "vm-1"
              captures: { v1_id: $.data.id }
          assert:
            - "data.risk_score == 40, not the client-supplied 0"
            - "data.attestation_status == NOT_REQUESTED (declared default)"
            - "data.version == 1"

      - name: program_system_fields_generated_and_client_input_ignored
        claim_type: system_fields
        grounds:
          - entities.ComplianceProgram
          - endpoints["POST /programs"]
        distinguishing_aspect: "id, created_at, updated_at and version are system-minted: values supplied for them in the request body are ignored, id is a bare UUID with no type prefix, and version starts at 1."
        test_recipe:
          setup:
            - "Empty database; the logical clock sits at its default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "EMPLOYER", exposure_ceiling_cents: 500000, id: "prog_client_supplied", version: 99, created_at: "2020-01-01T00:00:00Z" }
              as: SystemOperator
              captures: { prog_id: $.data.id }
          assert:
            - "data.id != prog_client_supplied and is a bare UUID with no type prefix"
            - "data.version == 1, not 99"
            - "data.created_at == 2026-08-01T00:00:00.000Z, not 2020-01-01T00:00:00.000Z"
            - "data.updated_at == data.created_at"

      - name: program_invalid_enum_org_type_rejected
        claim_type: type_constraints
        grounds:
          - entities.ComplianceProgram.fields.org_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "org_type is constrained to EMPLOYER/RETAILER/HYBRID; a value outside that set is refused with ERR_INVALID_REQUEST 400, and a negative exposure_ceiling_cents is refused by the same rule."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "NONPROFIT", exposure_ceiling_cents: 1093750 }
              as: SystemOperator
              captures: { err: $.data.error_id }
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: -1 }
              as: SystemOperator
              captures: { err2: $.data.error_id }
          assert:
            - "First trigger: HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "Second trigger: HTTP 400 with data.error_id == ERR_INVALID_REQUEST (exposure_ceiling_cents must be >= 0)"
            - "No ComplianceProgram row exists after either call"

      - name: jurisdiction_with_unknown_program_id_returns_404
        claim_type: parent_relationships
        grounds:
          - entities.Jurisdiction.fields.program_id
          - errors[ERR_PROGRAM_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "A child create whose declared parent FK does not resolve fails with the parent's own 404 error at priority 4, ahead of any business rule; the body is otherwise fully valid."
        test_recipe:
          setup:
            - "One unrelated ComplianceProgram exists so the parent table is non-empty."
          setup_api_calls:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: 1093750 }
              as: SystemOperator
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /jurisdictions"
              payload: { program_id: "00000000-0000-4000-8000-000000000000", state_code: "IL", statute_name: "BIPA", private_right_of_action: "FULL", damages_model: "STATUTORY_PER_VIOLATION", requires_written_release: true, translation_required: true, required_locales: ["en", "es"], retention_max_days: 1095, notice_lead_days: 14, per_violation_negligent_cents: 100000, per_violation_reckless_cents: 500000, cure_period_days: 0 }
              as: SystemOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with data.error_id == ERR_PROGRAM_NOT_FOUND"
            - "GET /jurisdictions with program_id ${prog_id} returns total_count 0"

      - name: asset_creation_with_cross_program_jurisdiction_returns_404
        claim_type: parent_relationships
        grounds:
          - entities.BiometricAsset.fields.jurisdiction_id
          - errors[ERR_JURISDICTION_NOT_FOUND]
          - complexity_profile.entity_topology
        distinguishing_aspect: "Flat-topology FK integrity: a Jurisdiction id that exists but belongs to a different ComplianceProgram is not a valid reference for this program's asset, so the create is refused with ERR_JURISDICTION_NOT_FOUND rather than silently linking across programs."
        test_recipe:
          setup:
            - "Two ComplianceProgram rows: P1 (Northline Retail Group) and P2 (Southgate Grocers), each with its own Jurisdiction IL row."
          setup_api_calls:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: 1093750 }
              as: SystemOperator
              captures: { p1_id: $.data.id }
            - call: "POST /programs"
              payload: { org_name: "Southgate Grocers", org_type: "RETAILER", exposure_ceiling_cents: 500000 }
              as: SystemOperator
              captures: { p2_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { program_id: "${p2_id}", state_code: "IL", statute_name: "BIPA", private_right_of_action: "FULL", damages_model: "STATUTORY_PER_VIOLATION", requires_written_release: true, translation_required: true, required_locales: ["en", "es"], retention_max_days: 1095, notice_lead_days: 14, per_violation_negligent_cents: 100000, per_violation_reckless_cents: 500000, cure_period_days: 0 }
              as: SystemOperator
              captures: { il_p2_id: $.data.id }
          trigger:
            - call: "POST /biometric-assets"
              payload: { program_id: "${p1_id}", jurisdiction_id: "${il_p2_id}", system_category: "TIMEKEEPING", modality: "FINGERPRINT", subject_class: "EMPLOYEE", template_storage_location: "tk-vault-01", declared_retention_days: 30, retention_basis: "SCHEDULE_ONLY" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with data.error_id == ERR_JURISDICTION_NOT_FOUND"
            - "GET /biometric-assets with program_id ${p1_id} returns total_count 0"
            - "ComplianceProgram.${p1_id}.inventory_completeness_pct is still 100.00 (nothing entered the inventory)"

  - section: state_machines
    instances:
      - name: newly_created_rows_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.BiometricPolicy
          - state_machines.BiometricAsset
          - state_machines.VendorContract
          - state_machines.IncidentCase
        distinguishing_aspect: "Every lifecycle entity is born in the initial_state its §1.2 machine declares — policy DRAFT, asset DISCOVERED, contract DRAFT — and IncidentCase is born in DETECTED on the containment dimension and PENDING on the notification dimension at the same instant."
        test_recipe:
          setup:
            - "One ComplianceProgram with Jurisdiction IL."
          setup_api_calls:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: 1093750 }
              as: SystemOperator
              captures: { prog_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { program_id: "${prog_id}", state_code: "IL", statute_name: "BIPA", private_right_of_action: "FULL", damages_model: "STATUTORY_PER_VIOLATION", requires_written_release: true, translation_required: true, required_locales: ["en", "es"], retention_max_days: 1095, notice_lead_days: 14, per_violation_negligent_cents: 100000, per_violation_reckless_cents: 500000, cure_period_days: 0 }
              as: SystemOperator
              captures: { il_id: $.data.id }
          trigger:
            - call: "POST /policies"
              payload: { program_id: "${prog_id}", version_label: "v1.0", retention_days: 30, destruction_trigger: "FIXED_SCHEDULE", release_language_included: true, jurisdiction_scope: ["${il_id}"] }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { pol1_id: $.data.id }
            - call: "POST /biometric-assets"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", system_category: "TIMEKEEPING", modality: "FINGERPRINT", subject_class: "EMPLOYEE", template_storage_location: "tk-vault-01", declared_retention_days: 30, retention_basis: "SCHEDULE_ONLY" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { asset_id: $.data.id }
            - call: "POST /vendors"
              payload: { program_id: "${prog_id}", name: "ClockPoint Systems", sells_biometric_data: false, subprocessor_count: 0, deletion_sla_days: 15, subprocessor_disclosure_complete: true }
              as: VendorManager
              as_user_id: "vm-1"
              captures: { v1_id: $.data.id }
            - call: "POST /vendor-contracts"
              payload: { vendor_id: "${v1_id}", prohibits_sale: true, restricts_disclosure: true, requires_deletion_on_termination: true, deletion_deadline_days: 30, indemnity_cap_cents: 5000000, effective_from: "2026-08-01T00:00:00Z" }
              as: VendorManager
              as_user_id: "vm-1"
              captures: { k1_id: $.data.id }
          assert:
            - "BiometricPolicy.${pol1_id}.status == DRAFT with revision_count 0, submitted_by_user_id null and published_at null"
            - "BiometricAsset.${asset_id}.status == DISCOVERED with pinned_policy_id null, collection_started_at null and destruction_due_at null"
            - "VendorContract.${k1_id}.status == DRAFT with drafted_by_user_id == vm-1 and approved_by_user_id null"
            - "ComplianceProgram.${prog_id}.inventory_completeness_pct == 0.00 after the asset create (one row in scope, none documented)"

      - name: policy_retire_from_draft_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.BiometricPolicy
          - errors[ERR_INVALID_TRANSITION]
          - validations[priority=8]
        distinguishing_aspect: "DRAFT -> RETIRED is not a declared edge (RETIRED is only reachable from SUPERSEDED), so the request is refused with ERR_INVALID_TRANSITION 409 and the row keeps every field it had."
        test_recipe:
          setup:
            - "One ComplianceProgram with Jurisdiction IL and one BiometricPolicy v1.0 in DRAFT."
          setup_api_calls:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: 1093750 }
              as: SystemOperator
              captures: { prog_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { program_id: "${prog_id}", state_code: "IL", statute_name: "BIPA", private_right_of_action: "FULL", damages_model: "STATUTORY_PER_VIOLATION", requires_written_release: true, translation_required: true, required_locales: ["en", "es"], retention_max_days: 1095, notice_lead_days: 14, per_violation_negligent_cents: 100000, per_violation_reckless_cents: 500000, cure_period_days: 0 }
              as: SystemOperator
              captures: { il_id: $.data.id }
            - call: "POST /policies"
              payload: { program_id: "${prog_id}", version_label: "v1.0", retention_days: 30, destruction_trigger: "FIXED_SCHEDULE", release_language_included: true, jurisdiction_scope: ["${il_id}"] }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { pol1_id: $.data.id }
          trigger:
