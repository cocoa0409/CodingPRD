          A claim filed against a nonexistent bond WITH a nonsense expected_bond_version must report
          404 ERR_BOND_NOT_FOUND, not 412 ERR_STALE_VERSION: there is no row whose version could be
          compared. Once the bond id is real but the version is stale, the same shape yields 412 —
          so the two rules are separable only by this ordering.
        test_recipe:
