            - { call: "POST /lab/recalls", payload: { product_id: "${prod_id}", scope_type: "PRODUCT_ALL", severity_class: "CLASS_III", reason: "Label defect" }, as: QualityManager, captures: { recall_id: "$.data.id" } }
          trigger:
