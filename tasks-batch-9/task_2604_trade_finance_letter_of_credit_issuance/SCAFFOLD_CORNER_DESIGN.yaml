          rationale: |
            The 1.8 priority_pair_validation_conflict instance already builds a
            credit that violates BOTH the priority-4 state rung and the
            priority-26 headroom rung on the same call and asserts that the
            response is ERR_CREDIT_NOT_APPROVED rather than
