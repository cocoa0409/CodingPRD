            - "Enrollment.${enr_id}.logged_road_hours == 0.5"
            - "Enrollment.${enr_id}.status == TEST_READY"

      - name: sponsorship_offer_empty_set_accept_allowed
        grounds:
          - validations[priority=15]
          - state_machines.SponsorshipOffer.OFFERED_to_ACCEPTED
          - errors[ERR_SPONSORSHIP_CONFLICT]
        distinguishing_aspect: |
          Empty-collection edge on a DIFFERENT metric and endpoint: accepting the FIRST offer succeeds because
          the set of other ACCEPTED offers for the enrollment is empty (count == 0); the conflict only arises
          when that set is non-empty, so the boundary is the zero-count case.
        test_recipe:
          setup:
            - "Enrollment E with exactly one OFFERED SponsorshipOffer and no ACCEPTED offer."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", cdl_class: "CLASS_B", classroom_required_hours: 1, range_required_hours: 1, road_required_hours: 1, tuition_cents: 700000 }
              as: SchoolAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /carriers"
              payload: { name: "BigHaul", commitment_months: 12, reimbursement_cents: 600000 }
              as: SchoolAdmin
