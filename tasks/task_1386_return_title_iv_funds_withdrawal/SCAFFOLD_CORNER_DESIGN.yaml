              captures: { ctc: $.data.id }
          trigger:
            - call: "POST /r2t4/withdrawal-cases/${ctc}/calculate"
              payload: {}
              as: FinancialAidOfficer
              as_user_id: "officer-1"
              captures: { ctc_school: $.data.school_return_cents }
            - call: "GET /r2t4/enrollments/${etc}"
              payload: {}
              as: FinancialAidOfficer
              captures: { etc_bal: $.data.balance_cents, etc_notif: $.data.balance_notification_sent }
          assert:
            - "WithdrawalCase.${ctc}.school_return_cents == 80000 (min(round(600000 * 0.400), 80000))"
            - "Immediately after: Enrollment.${etc}.balance_cents == 480000 (600000 - 200000 + 80000) and balance_notification_sent == true"
