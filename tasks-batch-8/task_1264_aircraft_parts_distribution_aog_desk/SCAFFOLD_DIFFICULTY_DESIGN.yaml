  - rule_id: cross_entity_state_dependency
    instances:
      - name: tender_blocked_until_compliance_cleared
        grounds:
          - state_machines.Shipment.DRAFT_to_TENDERED
          - state_machines.SalesOrder
          - errors[ERR_COMPLIANCE_NOT_CLEARED]
        distinguishing_aspect: |
          Entity pair Shipment -> SalesOrder: the Shipment's DRAFT->TENDERED
          transition is gated on the OWNING ORDER's compliance_status; both the
          PENDING_SCREENING and the EXPORT_HELD states reject with
          ERR_COMPLIANCE_NOT_CLEARED, and only the cross-entity transition to
          CLEARED (by a different role) unblocks tender.
        test_recipe:
          setup:
            - "Fully allocated order whose compliance_status is PENDING_SCREENING; shipment exists in DRAFT"
          setup_api_calls:
