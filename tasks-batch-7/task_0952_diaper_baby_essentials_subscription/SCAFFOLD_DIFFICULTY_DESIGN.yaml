scaffold_difficulty_design:

  # =======================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # =======================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: cancel_refund_dispatched_prorated_vs_undispatched_full
        grounds:
          - calculations.cancel_refund_cents
          - calculations.proration_used_fraction
          - entities.Cycle.fields.charged_cash_cents
          - entities.Refund.fields.restock_fee_cents
          - state_machines.Cycle.DISPATCHED_to_DELIVERED
        distinguishing_aspect: |
          This dual variant lives on the Cycle money domain: the SAME charged_cash_cents of 2999
          yields 2999 under the undispatched variant and 1649 under the dispatched variant
          (round_half_up(2999 * 0.75) = 2249, minus the 600 restock fee), so the two variants
          differ by 1350 cents on identical inputs.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z, then advanced to 2026-06-13T00:00:00Z."
            - "One verified ACTIVE account with a payment method, one S2 child, one ACTIVE subscription with cadence_interval_days 20."
            - "Cycle 1 allocated at 2400 subtotal + 599 shipping, charged for 2999 cash, dispatched on 2026-06-08T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Plan", default_pack_count: 2, promo_discount_pct: 0, allows_hypoallergenic: true }
              as: OpsAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /skus"
              payload: { code: "S2-STD-60", name: "Stage 2 Standard 60", stage: "S2", line: "STANDARD", pack_price_cents: 1200, pack_size_units: 60, allergen_tags: [], stock_packs: 50 }
              as: OpsAdmin
              captures: { sku_std: $.data.id }
            - call: "POST /accounts"
              payload: { email: "h1@example.com", full_name: "Household One", payment_method_on_file: true }
              as: Anonymous
              captures: { acct_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /accounts/${acct_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /children"
              payload: { account_id: "${acct_id}", name: "Rin", birth_date: "2025-11-01", weight_grams: 7000 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { child_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acct_id}", plan_id: "${plan_id}", child_id: "${child_id}", consumption_rate_per_day: 6, pack_count: 2 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct_id}"
            - call: "POST /subscriptions/${sub_id}/cycles"
              payload: {}
              as: OpsAdmin
              captures: { c1: $.data.id }
            - call: "POST /cycles/${c1}/allocate"
              payload: {}
              as: OpsAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-08T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /cycles/${c1}/lock"
              payload: {}
              as: OpsAdmin
            - call: "POST /cycles/${c1}/charge"
              payload: {}
              as: OpsAdmin
            - call: "POST /cycles/${c1}/dispatch"
              payload: { service_level: "STANDARD" }
              as: OpsAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-13T00:00:00Z" }
              as: OpsAdmin
          trigger:
            - call: "POST /cycles/${c1}/refund-requests"
              payload: { reason: "CANCEL" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { refund_id: $.data.id }
          assert:
            - "Cycle.${c1}.charged_cash_cents == 2999"
            - "Refund.${refund_id}.requested_cents == 1649"
            - "Refund.${refund_id}.restock_fee_cents == 600"
            - "Refund.${refund_id}.status == REQUESTED"

      - name: referral_credit_promo_window_doubles_at_vesting_instant
        grounds:
          - calculations.referral_credit_amount_cents
          - state_machines.Referral.PENDING_to_VESTED
          - entities.Referral.fields.credit_cents
          - entities.Credit.fields.issued_cents
        distinguishing_aspect: |
          This dual variant lives on the Referral domain, not on cycle money: the SAME referral
          row yields 1500 cents under the standard variant and 3000 cents under the promo variant,
          selected purely by whether the VESTING instant (2026-11-02T00:00:00Z) — not the signup
          instant (2026-10-20T00:00:00Z) — falls inside [2026-11-01Z, 2026-12-01Z).
        test_recipe:
          setup:
            - "Referrer account A verified on 2026-10-20T00:00:00Z holding its own referral_code."
            - "Referee account B signed up with referred_by_code = A's code, creating a PENDING Referral."
            - "B has an ACTIVE subscription whose first cycle is allocated and charged, and is delivered on 2026-11-02T00:00:00Z — inside the promotional window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Plan", default_pack_count: 2, promo_discount_pct: 0, allows_hypoallergenic: true }
              as: OpsAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /skus"
              payload: { code: "S2-STD-60", name: "Stage 2 Standard 60", stage: "S2", line: "STANDARD", pack_price_cents: 1200, pack_size_units: 60, allergen_tags: [], stock_packs: 50 }
              as: OpsAdmin
              captures: { sku_std: $.data.id }
            - call: "POST /accounts"
              payload: { email: "referrer@example.com", full_name: "Referrer A", payment_method_on_file: true }
              as: Anonymous
              captures: { a_id: $.data.id, a_tok: $.data.verification_token, a_code: $.data.referral_code }
            - call: "POST /accounts/${a_id}/verify"
              payload: { verification_token: "${a_tok}" }
              as: Anonymous
            - call: "POST /accounts"
              payload: { email: "referee@example.com", full_name: "Referee B", payment_method_on_file: true, referred_by_code: "${a_code}" }
              as: Anonymous
              captures: { b_id: $.data.id, b_tok: $.data.verification_token }
            - call: "POST /accounts/${b_id}/verify"
              payload: { verification_token: "${b_tok}" }
              as: Anonymous
            - call: "POST /children"
              payload: { account_id: "${b_id}", name: "Kai", birth_date: "2026-02-01", weight_grams: 7000 }
              as: AccountHolder
              as_user_id: "${b_id}"
              captures: { child_b: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${b_id}", plan_id: "${plan_id}", child_id: "${child_b}", consumption_rate_per_day: 6, pack_count: 2 }
              as: AccountHolder
              as_user_id: "${b_id}"
              captures: { sub_b: $.data.id }
            - call: "POST /subscriptions/${sub_b}/activate"
              payload: {}
              as: AccountHolder
              as_user_id: "${b_id}"
            - call: "POST /subscriptions/${sub_b}/cycles"
              payload: {}
              as: OpsAdmin
              captures: { cb1: $.data.id }
            - call: "POST /cycles/${cb1}/allocate"
              payload: {}
              as: OpsAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-02T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /cycles/${cb1}/lock"
              payload: {}
              as: OpsAdmin
            - call: "POST /cycles/${cb1}/charge"
              payload: {}
              as: OpsAdmin
            - call: "POST /cycles/${cb1}/dispatch"
              payload: { service_level: "STANDARD" }
              as: OpsAdmin
          trigger:
            - call: "POST /cycles/${cb1}/deliver"
              payload: {}
              as: OpsAdmin
          assert:
            - "Referral(referee_account_id == ${b_id}).status == VESTED"
            - "Referral(referee_account_id == ${b_id}).credit_cents == 3000"
            - "Referral(referee_account_id == ${b_id}).vesting_cycle_id == ${cb1}"
            - "Credit(account_id == ${a_id} AND credit_type == REFERRAL).issued_cents == 3000"
            - "Credit(account_id == ${a_id} AND credit_type == REFERRAL).refundable == true"
            - "Account.${a_id}.available_credit_cents == 3000"

      - name: cadence_manual_override_suppresses_recomputation
        grounds:
          - calculations.cadence_interval_days
          - entities.Subscription.fields.cadence_override_days
          - entities.Subscription.fields.cadence_interval_days
        distinguishing_aspect: |
          This dual variant lives on the Subscription scheduling domain: with
          consumption_rate_per_day changed from 6 to 12, the derived variant would clamp to 14
          days, but the manual_override variant holds the interval at 35 until the override is
          deleted, at which point the very same subscription snaps to 14.
        test_recipe:
          setup:
            - "One verified ACTIVE account with an ACTIVE subscription at pack_count 2 and consumption_rate_per_day 6, so the derived cadence is 120 / 6 = 20 days."
            - "A manual cadence override of 35 days is then pinned on that subscription."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Plan", default_pack_count: 2, promo_discount_pct: 0, allows_hypoallergenic: true }
              as: OpsAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "cad@example.com", full_name: "Cadence Household", payment_method_on_file: true }
              as: Anonymous
              captures: { acct_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /accounts/${acct_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /children"
              payload: { account_id: "${acct_id}", name: "Rin", birth_date: "2025-11-01", weight_grams: 7000 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { child_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acct_id}", plan_id: "${plan_id}", child_id: "${child_id}", consumption_rate_per_day: 6, pack_count: 2 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct_id}"
            - call: "POST /subscriptions/${sub_id}/cadence-override"
              payload: { cadence_override_days: 35 }
              as: AccountHolder
              as_user_id: "${acct_id}"
          trigger:
            - call: "PATCH /subscriptions/${sub_id}"
              payload: { consumption_rate_per_day: 12 }
              as: AccountHolder
              as_user_id: "${acct_id}"
            - call: "DELETE /subscriptions/${sub_id}/cadence-override"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { cadence_after_clear: $.data.cadence_interval_days }
          assert:
            - "After the PATCH, Subscription.${sub_id}.cadence_interval_days == 35"
            - "After the DELETE, Subscription.${sub_id}.cadence_interval_days == 14"
            - "Subscription.${sub_id}.cadence_override_days == null"
            - "${cadence_after_clear} == 14"

  # =======================================================================
  # Rule 2 — combinatorial formulas across different modes
  # =======================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: promo_rounding_per_line_then_sum
        grounds:
          - calculations.promo_discount_cents
          - calculations.cycle_subtotal_cents
          - calculations.line_quantity_allocation
          - entities.Cycle.fields.promo_discount_cents
        distinguishing_aspect: |
          MODE (b) — nested rounding whose ORDER is observable. Two lines of 1010 cents at a
          promo_discount_pct of 0.15 give round_half_up(151.5) = 152 twice = 304 under the pinned
          per-line-then-sum order, while sum-then-round would give round_half_up(303.0) = 303.
          The scaffold pins 304.
        test_recipe:
          setup:
            - "Plan with promo_discount_pct 0.15."
            - "Two S2 STANDARD SKUs priced identically at 1010 cents with identical pack_size_units 60; the first created has stock 1, the second has stock 5."
            - "Subscription at pack_count 2, so the waterfall takes 1 pack from each SKU and produces exactly two lines of 1010 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /plans"
              payload: { code: "PROMO15", name: "Promo 15", default_pack_count: 2, promo_discount_pct: 0.15, allows_hypoallergenic: true }
              as: OpsAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /skus"
              payload: { code: "S2-A", name: "Stage 2 A", stage: "S2", line: "STANDARD", pack_price_cents: 1010, pack_size_units: 60, allergen_tags: [], stock_packs: 1 }
              as: OpsAdmin
              captures: { sku_a: $.data.id }
            - call: "POST /skus"
              payload: { code: "S2-B", name: "Stage 2 B", stage: "S2", line: "STANDARD", pack_price_cents: 1010, pack_size_units: 60, allergen_tags: [], stock_packs: 5 }
              as: OpsAdmin
              captures: { sku_b: $.data.id }
            - call: "POST /accounts"
              payload: { email: "promo@example.com", full_name: "Promo Household", payment_method_on_file: true }
              as: Anonymous
              captures: { acct_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /accounts/${acct_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /children"
              payload: { account_id: "${acct_id}", name: "Rin", birth_date: "2025-11-01", weight_grams: 7000 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { child_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acct_id}", plan_id: "${plan_id}", child_id: "${child_id}", consumption_rate_per_day: 6, pack_count: 2 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct_id}"
            - call: "POST /subscriptions/${sub_id}/cycles"
              payload: {}
              as: OpsAdmin
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /cycles/${c1}/allocate"
              payload: {}
              as: OpsAdmin
              captures: { promo: $.data.promo_discount_cents, due: $.data.total_due_cents }
          assert:
            - "Cycle.${c1}.subtotal_cents == 2020"
            - "Cycle.${c1}.shipping_cents == 599"
            - "Cycle.${c1}.promo_discount_cents == 304"
            - "Cycle.${c1}.total_due_cents == 2315"
            - "exactly 2 CycleLine rows exist for cycle ${c1}, each with quantity_packs == 1 and line_total_cents == 1010"

      - name: shipping_decided_before_discount_evaluation_order
        grounds:
          - calculations.total_due_cents
          - calculations.shipping_cents
          - calculations.promo_discount_cents
          - entities.Cycle.fields.shipping_cents
        distinguishing_aspect: |
          MODE (c) — a circular-looking dependency pinned by evaluation order. shipping_cents is
          waived because the PRE-discount subtotal 5000 >= 4900, and the 1250-cent promotional
          discount then drops the payable amount to 3750 — below the free-shipping threshold —
          yet shipping_cents STAYS 0 because step 2 is never re-run after step 8.
        test_recipe:
          setup:
            - "Plan with promo_discount_pct 0.25."
            - "One S2 STANDARD SKU priced at 2500 cents with stock 10; subscription at pack_count 2 gives a 5000-cent subtotal."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /plans"
              payload: { code: "PROMO25", name: "Promo 25", default_pack_count: 2, promo_discount_pct: 0.25, allows_hypoallergenic: true }
              as: OpsAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /skus"
              payload: { code: "S2-MID", name: "Stage 2 Mid", stage: "S2", line: "STANDARD", pack_price_cents: 2500, pack_size_units: 60, allergen_tags: [], stock_packs: 10 }
              as: OpsAdmin
              captures: { sku_mid: $.data.id }
            - call: "POST /accounts"
              payload: { email: "order@example.com", full_name: "Order Household", payment_method_on_file: true }
              as: Anonymous
              captures: { acct_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /accounts/${acct_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /children"
              payload: { account_id: "${acct_id}", name: "Rin", birth_date: "2025-11-01", weight_grams: 7000 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { child_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acct_id}", plan_id: "${plan_id}", child_id: "${child_id}", consumption_rate_per_day: 6, pack_count: 2 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct_id}"
            - call: "POST /subscriptions/${sub_id}/cycles"
              payload: {}
              as: OpsAdmin
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /cycles/${c1}/allocate"
              payload: {}
              as: OpsAdmin
          assert:
            - "Cycle.${c1}.subtotal_cents == 5000"
            - "Cycle.${c1}.shipping_cents == 0"
            - "Cycle.${c1}.promo_discount_cents == 1250"
            - "Cycle.${c1}.total_due_cents == 3750"

      - name: shipping_three_input_nonlinear_heavy_surcharge
        grounds:
          - calculations.shipping_cents
          - entities.Sku.fields.pack_size_units
          - entities.Subscription.fields.free_shipping_eligible
        distinguishing_aspect: |
          MODE (a) — a formula with three inputs interacting non-linearly. With
          free_shipping_eligible false, a subtotal of 1200 (below the 4900 waiver) and 300 total
          units (above the 240 heavy threshold), shipping is 599 + 250 = 849; changing any one of
          the three inputs alone changes the branch taken.
        test_recipe:
          setup:
            - "Plan with promo_discount_pct 0."
            - "One S2 STANDARD SKU priced at 400 cents with pack_size_units 100 and stock 10; subscription at pack_count 3 gives 1200 subtotal and 300 units."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Plan", default_pack_count: 3, promo_discount_pct: 0, allows_hypoallergenic: true }
              as: OpsAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /skus"
              payload: { code: "S2-BULK", name: "Stage 2 Bulk", stage: "S2", line: "STANDARD", pack_price_cents: 400, pack_size_units: 100, allergen_tags: [], stock_packs: 10 }
              as: OpsAdmin
              captures: { sku_bulk: $.data.id }
            - call: "POST /accounts"
              payload: { email: "heavy@example.com", full_name: "Heavy Household", payment_method_on_file: true }
              as: Anonymous
              captures: { acct_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /accounts/${acct_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /children"
              payload: { account_id: "${acct_id}", name: "Rin", birth_date: "2025-11-01", weight_grams: 7000 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { child_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acct_id}", plan_id: "${plan_id}", child_id: "${child_id}", consumption_rate_per_day: 6, pack_count: 3 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct_id}"
            - call: "POST /subscriptions/${sub_id}/cycles"
              payload: {}
              as: OpsAdmin
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /cycles/${c1}/allocate"
              payload: {}
              as: OpsAdmin
          assert:
            - "Cycle.${c1}.subtotal_cents == 1200"
            - "Cycle.${c1}.shipping_cents == 849"
            - "Cycle.${c1}.total_due_cents == 2049"
            - "Subscription.${sub_id}.free_shipping_eligible == false"

  # =======================================================================
  # Rule 3 — non-linear state-machine shape on different entities
  # =======================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: child_stage_axis_moves_up_then_back_down
        grounds:
          - state_machines.Child.stage
          - calculations.stage_from_weight
          - calculations.resize_period_usage
          - calculations.resize_target_cycle
          - entities.ResizeEvent.fields.status
        distinguishing_aspect: |
          The Child.stage axis is BIDIRECTIONAL and re-entrant on the Child entity: S2 -> S3 -> S2
          is a legal sequence driven by two weight measurements, producing exactly two AUTO
          ResizeEvent rows, which is precisely the 90-day cap.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One verified ACTIVE account with an S2 child (7000 g) and one ACTIVE subscription."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Plan", default_pack_count: 2, promo_discount_pct: 0, allows_hypoallergenic: true }
              as: OpsAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /skus"
              payload: { code: "S2-STD-60", name: "Stage 2 Standard 60", stage: "S2", line: "STANDARD", pack_price_cents: 1200, pack_size_units: 60, allergen_tags: [], stock_packs: 50 }
              as: OpsAdmin
              captures: { sku_std: $.data.id }
            - call: "POST /accounts"
              payload: { email: "stage@example.com", full_name: "Stage Household", payment_method_on_file: true }
              as: Anonymous
              captures: { acct_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /accounts/${acct_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /children"
              payload: { account_id: "${acct_id}", name: "Rin", birth_date: "2025-11-01", weight_grams: 7000 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { child_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acct_id}", plan_id: "${plan_id}", child_id: "${child_id}", consumption_rate_per_day: 6, pack_count: 2 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/activate"
