  - rule_id: resource_temporal_overlap
    instances:
      - name: turn_windows_adjacent_at_the_shared_boundary_are_accepted_but_overlap_is_rejected
        grounds:
          - validations.priority_64_turn_windows_may_not_overlap
          - validations.priority_67_same_scope_rework_buffer
          - calculations.turn_cost_allocation
          - entities.TurnWorkOrder.fields.window_start
          - errors.ERR_TURN_WINDOW_OVERLAP
          - errors.ERR_TURN_REWORK_BUFFER
        distinguishing_aspect: |
          Turn windows are half-open, so a DETACHED_YARD_RESTORE order beginning at exactly
          2026-10-03T00:00:00Z — the instant the MAKE_READY order ends — must be accepted, while an
          order starting twelve hours earlier must be refused. The same chain then separates the two
          temporal rules that both guard the boundary: a MAKE_READY window that overlaps the yard order
          returns ERR_TURN_WINDOW_OVERLAP (priority 64) even though it also breaches the 48-hour
          same-scope rework buffer, a non-overlapping MAKE_READY window 24 hours after the first order's
          end returns ERR_TURN_REWORK_BUFFER (priority 67), and a MAKE_READY window beginning exactly 48
          hours after that end is accepted because the buffer boundary is inclusive.
