        PROVISIONAL
      - snapshot_fee_schedule_id == ${fs_id}, placement_status == PENDING_ACCEPTANCE, billing_status ==
        UNBILLED
      - separation_date == null, void_reason == null and version == 1
  - name: candidate_system_fields_are_server_generated_and_the_version_starts_at_one
    claim_type: system_fields
    grounds: entities.Candidate common_fields (id, created_at, version); endpoints.POST /candidates
    distinguishing_aspect: id and created_at are stamped by the server and created_at equals the logical
      clock, not wall time; version starts at 1.
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-05T12:00:00Z'
      trigger:
      - call: POST /candidates
        as: VettingSpecialist
        as_user: u_vet_1
        payload:
          full_name: P. Danvers
          contact_email: pdanvers@mail.example
          primary_role_type: HOUSEKEEPER
          years_experience: 10
          live_in_willing: true
      asserts:
      - the trigger returns 201 with a server-generated id that the caller never supplied
      - created_at == 2026-08-05T12:00:00Z, matching the logical clock set in setup
      - version == 1
  - name: ledger_entries_are_append_only_and_carry_no_version_field
    claim_type: immutability
    grounds: 'entities.LedgerEntry (common_fields: false, sequence_no, entry_type, related_ref_type, balance_after_cents);
      endpoints.POST /clients/{id}/ledger-adjustments'
    distinguishing_aspect: A LedgerEntry is stamped with its running balance at append time and exposes
      no version field, and there is no endpoint that mutates a stored row.
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      - call: POST /clients
        as: AgencyPrincipal
        payload:
          household_name: Ashworth Mews
          primary_contact_email: ops@ashworth.example
          region_code: NY
        captures:
          client_id: $.data.id
      - call: POST /clients/${client_id}/confidentiality-agreement
        as: Client
        payload:
          action: SIGN
          signatory_name: L. Ashworth
