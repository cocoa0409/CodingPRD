      - name: stainless_scrap_value_selects_the_latest_index_at_or_before_today
        claim_type: Input Set Filtering
        grounds:
          - calculations.stainless_scrap_value
          - entities.CommodityIndex.fields.effective_date
          - entities.Keg.fields.stainless_scrap_value_cents
          - endpoints[GET /kegs/{keg_id}]
        distinguishing_aspect: "With three index rows on file (400 c/kg from 2026-06-01, 480 from 2026-07-01, 600 from 2026-09-01) a keg read on 2026-08-01 values at 3900 using the 480 row — the future-dated 600 row is never selected — and the same keg re-read after the clock passes 2026-09-01 values at 4875, because the scrap value is recomputed on read rather than frozen at import."
        test_recipe:
          setup:
            - "Clock 2026-08-01T23:00:00Z; pool HB-50L with stainless_weight_kg 12.5; three CommodityIndex rows including one dated in the future."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /commodity-index"
              payload: { effective_date: "2026-06-01", usd_cents_per_kg: 400, source: "LME_SS304" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /commodity-index"
              payload: { effective_date: "2026-07-01", usd_cents_per_kg: 480, source: "LME_SS304" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /commodity-index"
              payload: { effective_date: "2026-09-01", usd_cents_per_kg: 600, source: "LME_SS304" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools"
              payload: { pool_code: "HB-50L", size_liters: 50, stainless_weight_kg: 12.5, replacement_cost_cents: 23500, region_code: "CO" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { p1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0001" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k1_id: "$.data.id" }
          trigger:
            - call: "GET /kegs/${k1_id}"
              payload: {}
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "GET /kegs/${k1_id}"
              payload: {}
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-1"
          assert:
            - "the first read returns Keg.${k1_id}.stainless_scrap_value_cents == 3900 == round_half_up(12.5 x 480 x 0.65) — the 2026-07-01 row, not the older 400 row and not the future 600 row"
            - "the clock write returns current_utc == 2026-09-02T00:00:00Z and previous_utc == 2026-08-01T23:00:00Z"
            - "the second read returns Keg.${k1_id}.stainless_scrap_value_cents == 4875 == round_half_up(12.5 x 600 x 0.65) — the 2026-09-01 row is now effective"
            - "Keg.${k1_id}.version is unchanged across both reads (recomputing a derived read value is not a write)"
            - "GET /commodity-index returns total_count 3 and every row's version field is absent (CommodityIndex declares common_fields false)"

