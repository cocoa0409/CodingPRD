  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: disposition_state_beats_safety_returns_invalid_state
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_UNSAFE_DISPOSITION]
        distinguishing_aspect: |
          A HOME_MANAGEMENT disposition referencing a COMPLETED (not FINALIZED) assessment whose
          risk_tier is SEVERE fails both the state precondition (priority 5) and the safety gate
          (priority 7); the response is ERR_INVALID_STATE, proving state precedes business_safety.
        test_recipe:
          setup:
            - "SEVERE case (exposure dose 3000 -> 1.00) triaged with a COMPLETED (un-finalized) RiskAssessment."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /substances"
              payload: { name: "acetaminophen", category: "ANALGESIC", toxic_dose_mg_per_kg: 150, onset_hours: 4, reference_route: "INGESTION" }
              as: SystemAdmin
              captures: { sub_apap: $.data.id }
            - call: "POST /specialists"
              payload: { full_name: "Sam SPI", credential: "SPI" }
              as: SystemAdmin
              captures: { spi: $.data.id }
            - call: "POST /exposure-cases"
              payload: { patient_age_years: 6, patient_weight_kg: 20, patient_sex: "MALE", chief_complaint: "large ingestion" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { case: $.data.id }
            - call: "POST /exposure-cases/${case}/exposures"
              payload: { substance_id: "${sub_apap}", route: "INGESTION", dose_range_low_mg: 3000, dose_range_high_mg: 3000, time_since_exposure_hours: 2 }
              as: Specialist
              as_user_id: "${spi}"
            - call: "POST /exposure-cases/${case}/triage"
              payload: {}
              as: Specialist
              as_user_id: "${spi}"
              captures: { case_v: $.data.version }
            - call: "POST /exposure-cases/${case}/risk-assessments"
              payload: { expected_case_version: "${case_v}" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { ra: $.data.id }
          trigger:
            - call: "POST /exposure-cases/${case}/dispositions"
              payload: { risk_assessment_id: "${ra}", disposition_type: "HOME_MANAGEMENT" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_STATE (409), NOT ERR_UNSAFE_DISPOSITION"

      - name: finalize_auth_beats_state_returns_unauthorized
        grounds:
          - validations[priority=2]
          - validations[priority=5]
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          A finalize posted by SurveillanceOfficer (role denied) on an already-FINALIZED
          RiskAssessment fails both authorization (priority 2) and state (priority 5); the
          response is ERR_UNAUTHORIZED, an auth-vs-state pair distinct from the state-vs-safety
          conflict.
        test_recipe:
          setup:
            - "MODERATE case with a FINALIZED RiskAssessment."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /substances"
              payload: { name: "acetaminophen", category: "ANALGESIC", toxic_dose_mg_per_kg: 150, onset_hours: 4, reference_route: "INGESTION" }
              as: SystemAdmin
              captures: { sub_apap: $.data.id }
            - call: "POST /protocols"
              payload: { risk_tier: "MODERATE", management_setting: "HOME", followup_count: 1, followup_interval_hours: 24, requires_toxicologist: false }
              as: SystemAdmin
            - call: "POST /specialists"
              payload: { full_name: "Sam SPI", credential: "SPI" }
              as: SystemAdmin
              captures: { spi: $.data.id }
            - call: "POST /exposure-cases"
              payload: { patient_age_years: 6, patient_weight_kg: 20, patient_sex: "MALE", chief_complaint: "ingestion" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { case: $.data.id }
            - call: "POST /exposure-cases/${case}/exposures"
              payload: { substance_id: "${sub_apap}", route: "INGESTION", dose_range_low_mg: 1200, dose_range_high_mg: 1500, time_since_exposure_hours: 2 }
              as: Specialist
              as_user_id: "${spi}"
            - call: "POST /exposure-cases/${case}/triage"
              payload: {}
              as: Specialist
              as_user_id: "${spi}"
              captures: { case_v: $.data.version }
            - call: "POST /exposure-cases/${case}/risk-assessments"
              payload: { expected_case_version: "${case_v}" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { ra: $.data.id }
            - call: "POST /risk-assessments/${ra}/finalize"
              payload: {}
              as: Specialist
