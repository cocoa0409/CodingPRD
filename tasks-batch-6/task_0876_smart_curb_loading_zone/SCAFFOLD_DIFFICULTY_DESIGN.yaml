  - rule_id: cross_entity_state_dependency
    instances:
      - name: confirm_requires_permit_active
        grounds:
          - state_machines.Reservation.PENDING_to_CONFIRMED
          - state_machines.CurbPermit.SUBMITTED_to_UNDER_REVIEW
          - errors[ERR_PERMIT_NOT_ACTIVE]
        distinguishing_aspect: "Reservation.PENDING->CONFIRMED depends on CurbPermit state (pair Reservation->CurbPermit): a SUBMITTED (not ACTIVE) permit blocks confirm with ERR_PERMIT_NOT_ACTIVE even though the zone is ACTIVE and uncontended."
        test_recipe:
          setup:
            - "Zone Z1 ACTIVE; permit only SUBMITTED (never approved); reservation R [08:00Z,08:45Z) PENDING on Z1"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /curb/pricing-policies", payload: { name: "P1", base_rate_cents_per_15min: 200, peak_multiplier_bps: 15000, peak_start_hour: 7, peak_end_hour: 10, surge_tier1_ratio_bps: 5000, surge_tier1_mult_bps: 12500, surge_tier2_ratio_bps: 8000, surge_tier2_mult_bps: 15000 }, as: CurbPlanner, captures: { pol_id: $.data.id } }
