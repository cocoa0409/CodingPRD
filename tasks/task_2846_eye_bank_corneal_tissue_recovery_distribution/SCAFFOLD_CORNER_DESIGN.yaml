              payload: { hiv_result: "NON_REACTIVE", hbv_result: "NON_REACTIVE", hcv_result: "NON_REACTIVE", syphilis_result: "NON_REACTIVE" }
              as: LabTechnician
              captures: { e_panel: $.data.error_id }
            - call: "GET /eye-bank/recoveries/00000000-0000-0000-0000-000000000004"
