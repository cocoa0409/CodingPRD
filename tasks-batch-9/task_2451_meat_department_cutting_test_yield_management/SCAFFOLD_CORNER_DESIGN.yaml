        distinguishing_aspect: "Four writes declared shared in §1.7 behave identically under either holder — primal-purchase receiving under MeatCutter and MeatManager, item creation under StoreAdmin and MeatManager, temperature readings under MeatCutter and ServiceClerk, pre-orders under ServiceClerk and MeatManager — and the stored row is identical whichever holder writes it — the role never enters the computation."
