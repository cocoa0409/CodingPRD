              as: ProgramDirector
            - call: "POST /declarations"
              payload: { matter_id: "${m_id}", preparer_assignment_id: "${asg_a_id}", language_code: "en", word_count: 900 }
              as: ProgramDirector
              captures: { dec_id: "$.data.id" }
            - call: "POST /declarations/${dec_id}/transition"
              payload: { action: "SUBMIT_FOR_REVIEW", word_count: 900 }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /calendar-events"
              payload: { matter_id: "${m_id}", event_type: "BIOMETRICS", starts_at_utc: "2026-09-10T14:00:00.000Z", ends_at_utc: "2026-09-10T15:00:00.000Z", location_code: "USCISPHX", assigned_representative_id: "${atty_a_id}" }
              as: ProgramDirector
              captures: { ce_near_id: "$.data.id" }
