        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / certify_member_batch_state_conflict_beats_deadline_conflict
          rationale: "The named difficulty instance reopens a SUBMITTED member quarter and asserts ERR_MEMBER_BATCH_NOT_VALIDATED at 409."

      - name: a_draft_assessment_returns_assessment_not_approved
        claim_type: error_triggerable
        grounds:
          - errors.ERR_ASSESSMENT_NOT_APPROVED
        excluded_because:
