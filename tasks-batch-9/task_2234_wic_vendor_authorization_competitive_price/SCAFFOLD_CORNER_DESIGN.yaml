      - name: reauthorization_cycle_loops_back_to_authorized
        claim_type: cyclic_shape
        grounds:
          - "state_machines.Vendor[AUTHORIZED -> REAUTH_PENDING]"
          - "state_machines.Vendor[REAUTH_PENDING -> AUTHORIZED]"
          - "calculations.reauthorization_and_training_dates"
        excluded_because:
          difficulty_instance: vendor_reauthorization_cycle_returns_to_authorized
          rationale: |
            The guide's `cyclic` row asks that the entity loop back and that the loop's
            termination/advance condition be respected. The §1.8 instance already drives
            AUTHORIZED -> REAUTH_PENDING -> AUTHORIZED twice and pins the anchoring rule
            that makes the loop non-drifting (due date advanced from its own previous
            value 2029-08-01 -> 2032-08-01, not from the logical clock), which is a
            strictly stronger claim than "the loop closes".

      - name: sanction_case_fork_branches_both_work
        claim_type: branching_shape
        grounds:
          - "state_machines.SanctionCase[NOTICE_SERVED -> CMP_ELECTED]"
          - "state_machines.SanctionCase[NOTICE_SERVED -> DISQUALIFICATION_IMPOSED]"
          - "state_machines.Vendor[AUTHORIZED -> DISQUALIFIED]"
        excluded_because:
          difficulty_instance: sanction_case_forks_to_cmp_or_disqualification_with_divergent_effects
          rationale: |
            The guide's `branching` row asks that each fork path work and that the join
            point behave correctly. The §1.8 instance runs both NOTICE_SERVED branches on
            twin vendors and reconciles their divergent side-effect sets (member_count,
            visit cancellation, submission voiding, sanction-point timing) at the shared
            CLOSED join, so a separate per-branch smoke test would only re-assert a subset.

      - name: failed_visit_cascade_down_side_effects
        claim_type: cascade_down_side_effects
        grounds:
          - "state_machines.MonitoringVisit[SCHEDULED -> FAILED]"
          - "entities.Vendor.fields.open_finding_count"
          - "entities.Vendor.fields.compliance_buy_required"
          - "entities.Vendor.fields.reauthorization_hold"
        excluded_because:
          difficulty_instance: visit_failure_cascades_to_compliance_buy_and_reauth_hold
          rationale: |
            The guide's `Cascade down` and `Conditional cascade` rows both apply to the
            MonitoringVisit SCHEDULED -> FAILED transition. The §1.8 instance verifies all
            four hops end to end and, in the same recipe, verifies that the first failing
            visit stops after hop 1 because the HIGH_RISK_FINDING_THRESHOLD is not yet
            crossed — that is exactly the conditional-cascade claim.

  # ===========================================================================
  # From Table 3 (Calculations) — §1.3
  # ===========================================================================
  - section: calculations
    instances:

      - name: minimum_stock_verification_ceils_required_units_and_computes_pct
        claim_type: correct_result
        grounds:
          - calculations.minimum_stock_verification
          - entities.MonitoringVisit.fields.stock_findings
          - entities.PeerGroup.fields.min_stock_multiplier
          - endpoints[POST /monitoring-visits/{id}/observations]
        distinguishing_aspect: |
          required_units is ceil(min_stock_units * min_stock_multiplier) per category,
          so with multiplier 1.5 MILK needs ceil(6.0) == 6 and BREAD needs ceil(4.5)
          == 5; observing exactly 6 milk units passes (the test is `<`, not `<=`) while
          4 bread units is BELOW_UNITS, giving stock_compliance_pct 50.0 and outcome
          FAIL_BELOW_MINIMUM rather than FAIL_MISSING_CATEGORY.
        test_recipe:
          setup:
            - "CHAIN A: vendor v1 AUTHORIZED in PG-SUPER-A (min_stock_multiplier 1.5) with an ACTIVE milk ceiling of 336"
            - "A second stock-required category BREAD (min_stock_units 3, min_variety_count 1) with no items on the authorized food list"
            - "One SCHEDULED ROUTINE visit carrying observations for both categories"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /peer-groups"
              payload: { code: "PG-SUPER-A", store_type: "SUPERMARKET", min_monthly_redemption_cents: 5000000, max_monthly_redemption_cents: 20000000, mar_method: "PEER_MEDIAN", competitive_allowance_pct: 0.05, min_submissions_for_ceiling: 3, min_stock_multiplier: 1.5 }
              as: VendorUnitSupervisor
              captures: { pg_a: $.data.id }
            - call: "POST /food-categories"
              payload: { code: "MILK", name: "Milk gallon", is_formula: false, formula_restriction_level: "NONE", min_stock_units: 4, min_variety_count: 2, max_units_per_transaction: 6, stock_required: true }
              as: VendorUnitSupervisor
              captures: { cat_milk: $.data.id }
            - call: "POST /food-categories"
              payload: { code: "BREAD", name: "Whole grain bread", is_formula: false, formula_restriction_level: "NONE", min_stock_units: 3, min_variety_count: 1, max_units_per_transaction: 4, stock_required: true }
              as: VendorUnitSupervisor
              captures: { cat_bread: $.data.id }
            - call: "POST /authorized-food-items"
              payload: { food_category_id: "${cat_milk}", upc: "00011122233", brand: "Statewide Dairy", container_size_oz: 128, contract_brand: false, required_for_authorization: true }
              as: VendorUnitSupervisor
