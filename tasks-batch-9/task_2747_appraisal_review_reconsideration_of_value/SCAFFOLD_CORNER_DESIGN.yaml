        distinguishing_aspect: "The uniqueness key is (appraisal_id, dispute_basis) over unresolved cases only: a second COMP_SELECTION dispute on the same report is refused even with a non-overlapping review slot, while an ADJUSTMENT_SUPPORT dispute on that same report in that same slot is accepted."
