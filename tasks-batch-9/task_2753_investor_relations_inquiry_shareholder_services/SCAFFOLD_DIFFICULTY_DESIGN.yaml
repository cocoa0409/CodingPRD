  - rule_id: priority_pair_validation_conflict
    instances:
      - name: execute_state_check_outranks_dividend_reserve_shortfall
        grounds:
          - validations[priority=8]
          - validations[priority=17]
          - errors[ERR_INSTRUCTION_NOT_ACKNOWLEDGED]
          - errors[ERR_DIVIDEND_RESERVE_INSUFFICIENT]
          - endpoints[POST /transfer-agent-instructions/{id}/execute]
        distinguishing_aspect: |
          One execute call violates both the priority-8 `state` rule (instruction still SUBMITTED)
          and the priority-17 `business_fiscal` rule (payout 500000 cents against a 100-cent reserve);
          the response is ERR_INSTRUCTION_NOT_ACKNOWLEDGED, and only after the instruction is
          acknowledged does the same call surface ERR_DIVIDEND_RESERVE_INSUFFICIENT — the pair is
          state vs business_fiscal.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, advanced to 2026-08-25T00:00:00Z so payable_date is reached."
            - "Issuer SHT with 1,000,000 shares outstanding and a dividend_reserve_cents of 100."
            - "One INSTITUTIONAL_HOLDER contact with 1000 shares."
            - "One DIVIDEND_PAYMENT instruction, DECLARED_RATE at 500 cents per share (payout 500000 cents), record_date 2026-08-15, payable_date 2026-08-25, still in status SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
            - call: "POST /companies"
              payload: { ticker: "SHT", legal_name: "Short Reserve Corp", shares_outstanding: 1000000, dividend_reserve_cents: 100 }
