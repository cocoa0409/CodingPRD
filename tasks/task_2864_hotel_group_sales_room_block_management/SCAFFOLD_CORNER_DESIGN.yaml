  - name: displacement_variants_diverge_on_the_same_inventory
    claim_type: variant_divergence
    grounds:
    - calculations.displacement_cost.variants
    excluded_because:
      difficulty_instance: dual_variant_calc / displacement_forecast_series_versus_historical_series
      rationale: The named §1.8 instance runs both analysis_variant values against identical InventoryDay
        rows and asserts the different displaced_room_nights, displaced_revenue_cents and verdict, which
        is exactly the divergence claim.
  - name: attrition_basis_selects_the_variant_from_the_contract
    claim_type: variant_selection
    grounds:
    - calculations.attrition_liability.variants
    - entities.GroupContract.fields.attrition_basis
    excluded_because:
      difficulty_instance: dual_variant_calc / attrition_basis_room_nights_versus_peak_night
      rationale: Variant selection is driven by contract.attrition_basis and the named §1.8 instance builds
        two contracts over the same pickup pattern to show ROOM_NIGHTS and PEAK_NIGHT produce different
        shortfalls and damages.
  - name: settlement_fills_its_buckets_in_the_normative_order
    claim_type: waterfall_allocation
    grounds:
    - calculations.settlement_waterfall
    excluded_because:
      difficulty_instance: combinatorial_formula / settlement_waterfall_six_step_order_with_incentive_keyed_on_step_three
      rationale: The six-step waterfall, the rebate cap, the size bonus floor and the rule that the incentive
        rate is keyed on step 3 rather than on the total are all asserted by the named §1.8 instance.
  - name: effective_rate_rounds_each_component_before_subtracting
    claim_type: precision
    grounds:
    - calculations.effective_net_rate.precision
    excluded_because:
      difficulty_instance: boundary_precision_check / effective_net_rate_component_rounding_order
      rationale: The named §1.8 instance pins ROUND_EACH_COMPONENT_THEN_SUBTRACT against the round-once-at-the-end
        alternative on a base rate chosen so the two orders differ by a cent.
  - name: attrition_threshold_is_inclusive_at_the_commitment
    claim_type: threshold
    grounds:
    - calculations.attrition_liability
    excluded_because:
      difficulty_instance: boundary_precision_check / attrition_actualized_exactly_at_commitment_yields_zero_damages
      rationale: The threshold-boundary claim (at, one below, one above the commitment) is the named §1.8
        instance, which walks actualized room nights to exactly the ceil'd commitment and asserts zero
        damages.
  - name: qualification_score_weights_do_not_drift_at_the_floor
    claim_type: weighted_scoring
    grounds:
    - calculations.lead_qualification_score
    excluded_because:
      difficulty_instance: boundary_precision_check / qualification_score_exactly_at_floor_qualifies_one_below_turns_down
      rationale: 'The weighted-scoring claim is the named §1.8 instance: it lands the four weighted components
        plus the segment multiplier exactly on QUALIFICATION_FLOOR and one point below it.'
  - name: block_pickup_aggregates_survive_add_and_reversal
    claim_type: aggregation
    grounds:
    - calculations.block_pickup
    - calculations.sub_block_allocation
    excluded_because:
      difficulty_instance: compensating_invariant / block_night_room_conservation_survives_cancel_then_cutoff
      rationale: The aggregation claims (running total correct after add, correct after reversal) are
        the named §1.8 instance, which asserts the rooms_allotted conservation identity after a cancel
        and again after the cutoff release.
