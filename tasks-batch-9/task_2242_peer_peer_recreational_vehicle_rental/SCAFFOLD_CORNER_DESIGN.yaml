              as_user_id: "${owner_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response 409"
            - "data.error_id == 'ERR_ASSIGNMENT_STATE_INVALID'"
            - "GET /rv-marketplace/delivery-assignments/${assign1_id} returns data.status == 'VOIDED'"
            - "GET /rv-marketplace/campgrounds/${camp_id} returns data.scheduled_assignment_count == 0"
            - "GET /rv-marketplace/bookings/${booking_d_id} returns data.delivery_fee_cents == 0 and data.quoted_total_cents == 146063"

      - name: scheduling_an_assignment_rewrites_the_bookings_quote
        claim_type: cross_entity
        grounds:
          - state_machines.DeliveryAssignment.transitions.REQUESTED_to_SCHEDULED
          - calculations.delivery_fee
          - calculations.booking_quote_total
          - entities.Campground.fields.scheduled_assignment_count
        distinguishing_aspect: >-
          One write to DeliveryAssignment moves three other rows: the assignment
          lands SCHEDULED with delivery_fee_cents 15500 (12000 + 10*350 + 0),
          Campground.scheduled_assignment_count goes 0 → 1, and the Booking's
          whole quote is rebuilt — delivery_fee_cents 15500 pushes
          pre_discount_cents to 151347 which crosses LOYALTY_TIER_2, so
          loyalty_discount_cents 10594, service_fee_cents 16890 and
          quoted_total_cents 157643.
        test_recipe:
          setup: >-
            Full canonical marketplace, the Cascade Bend campground, and an
            OWNER_APPROVED CAMPGROUND_DROPOFF booking with no assignment yet
            (delivery_fee_cents 0, quoted_total_cents 146063).
          setup_api_calls:
            - *k_clock
            - *k_owner
            - *k_renter
            - *k_season_peak
            - *k_season_shoulder
