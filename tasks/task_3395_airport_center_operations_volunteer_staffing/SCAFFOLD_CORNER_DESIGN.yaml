            - call: "POST /screenings/${s_id}/claim"
              as: CenterManager
              as_user_id: "mgr-1"
            - call: "POST /screenings/${s_id}/decide"
              payload: { verdict: "CLEARED" }
              as: CenterManager
              as_user_id: "mgr-2"
            - call: "POST /centers/${c_id}/shifts"
              payload: { start_at: "2026-09-01T06:00:00Z", end_at: "2026-09-01T08:00:00Z", role_required: "DESK", capacity: 1 }
