  # ===========================================================================
  # excluded_because stubs — corners already covered by §1.8 instances
  # ===========================================================================
  - section: state_machines
    instances:
      - name: proposal_cycle_revision_round_increments
        claim_type: cyclic
        grounds:
          - state_machines.Proposal.IN_REVIEW_to_DRAFTING
        excluded_because:
          difficulty_instance: proposal_revision_cycle_in_review_back_to_drafting
          rationale: "The Proposal DRAFTING<->IN_REVIEW cycle with revision_round incrementing is the §1.8 non_linear_state_machine instance #1."
      - name: deliverable_parallel_dimensions_combined_state
        claim_type: parallel
        grounds:
          - state_machines.Deliverable.content_status=OUTLINE_to_content_status=DRAFTED
        excluded_because:
          difficulty_instance: deliverable_parallel_content_and_approval_axes_evolve_independently
          rationale: "The Deliverable parallel content/approval axes are the §1.8 non_linear_state_machine instance #2."
      - name: submission_withdraw_cross_entity_cascade
        claim_type: Cross-entity
        grounds:
          - state_machines.Submission.FILED_to_WITHDRAWN
        excluded_because:
          difficulty_instance: submission_withdraw_cascades_proposal_then_client_counter_depth3
          rationale: "Submission withdraw cascading to Proposal then Client counter is the §1.8 transitive_cascade instance #1."

  - section: calculations
    instances:
      - name: invoice_hourly_variant_correct_result
        claim_type: Variant Divergence
        grounds:
          - calculations.invoice_total
        excluded_because:
          difficulty_instance: invoice_total_hourly_vs_retainer_diverge_on_engagement
          rationale: "HOURLY vs RETAINER variant divergence on the same swept time is the §1.8 dual_variant_calc instance #1."
      - name: budget_total_rounding_order_pinned
        claim_type: Precision
        grounds:
          - calculations.budget_total
        excluded_because:
          difficulty_instance: budget_total_round_per_indirect_line_then_sum_mode_b
          rationale: "The pinned per-line floor-then-sum rounding order is the §1.8 combinatorial_formula instance #1."

  - section: cross_cutting_complexity_layers
    instances:
      - name: invoice_void_compensation_no_drift
        claim_type: cascading_side_effects
        grounds:
          - endpoints.POST /grant-desk/invoices/{id}/void
        excluded_because:
          difficulty_instance: invoice_void_restores_logged_time_minutes_conserved
          rationale: "Invoice void restoring LOGGED time with no drift is the §1.8 compensating_invariant instance #1."
