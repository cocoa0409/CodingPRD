  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_role_header_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Request without X-User-Role header returns 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /reman/customers/11111111-2222-4333-8444-555555555555"
              payload: {}
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED"
            - "http status == 401"

      - name: existence_checked_before_state
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "start-teardown on a non-existent order id returns 404 ERR_NOT_FOUND (existence, priority 3) even though the operation would also be a state violation — left-to-right path existence wins."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /reman/orders/11111111-2222-4333-8444-555555555555/start-teardown"
              payload: {}
              as: RemanEngineer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"
            - "http status == 404"

      - name: invalid_enum_value_rejected
        claim_type: violation_to_error
        grounds: ["entities.ComponentDecision.fields.action", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Decision action 'WELD_IT' (not in enum) returns 400 ERR_INVALID_REQUEST."
        test_recipe:
