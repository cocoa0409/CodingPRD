      - name: endpoint_action_notification_carries_the_full_transparency_payload
        claim_type: computed_read
        grounds:
          - "endpoints[GET /sellers/{id}/notifications]"
          - "entities.Notification.fields.policy_rule_code"
          - "entities.Notification.fields.severity_points_disclosed"
          - "entities.Notification.fields.appeal_deadline_at"
          - "entities.Notification.fields.evidence_reference"
        distinguishing_aspect: |
          The seller-facing notice is a derived read: every ACTION_ISSUED field is copied from a
          different source row — policy_rule_code from the PolicyRule, severity_points_disclosed from
          the EnforcementAction's own computed points, appeal_deadline_at from issued_at +
          APPEAL_WINDOW_DAYS, evidence_reference from the Violation — and the notice must be visible
          to the SELLER, not only to operators. amount_cents and decision_rationale stay null on this
          template, which is what separates it from the funds and decision notices.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
