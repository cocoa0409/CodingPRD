# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
#
# Enumerates the testable claims from §1.1–§1.7 NOT already covered by §1.8.
# Breadth probe; taxonomy from references/claim-extraction-guide.md.
# =============================================================================

scaffold_corner_design:

  # -----------------------------------------------------------------
  # Section 1: From Table 1 (Entities)
  # -----------------------------------------------------------------
  - section: entities
    instances:
      - name: district_program_create_returns_defaults
        claim_type: creation_with_defaults
        grounds: [entities.DistrictProgram.fields.loaner_pool_threshold_pct, entities.DistrictProgram.fields.status]
        distinguishing_aspect: "POST /program without loaner_pool_threshold_pct → default 0.10 applied; status initialized to DRAFT"
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { program_name: "P", school_year: "2026-2027" }
              as: DistrictAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /api/programs/${prog_id}"
              payload: {}
              as: DistrictAdmin
          assert:
            - "DistrictProgram.${prog_id}.loaner_pool_threshold_pct == 0.10"
            - "DistrictProgram.${prog_id}.status == DRAFT"

      - name: student_account_free_lunch_default_false
        claim_type: defaults_applied
        grounds: [entities.StudentAccount.fields.free_lunch_eligible]
        distinguishing_aspect: "free_lunch_eligible omitted → false"
        test_recipe:
          setup: ["Program exists"]
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { program_name: "P", school_year: "2026-2027" }
              as: DistrictAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets"
              payload: { fleet_name: "F", asset_class: "DEVICE", unit_replacement_cost_cents: 100000, salvage_value_cents: 10000, useful_life_months: 36, in_service_date: "2025-09-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: DistrictAdmin
          trigger:
            - call: "POST /api/programs/${prog_id}/students"
              payload: { student_external_id: "SIS-DFT", full_name: "Dft", grade_level: 9 }
              as: Registrar
              captures: { student_id: $.data.id, fl: $.data.free_lunch_eligible }
          assert:
            - "StudentAccount.${student_id}.free_lunch_eligible == false"
            - "StudentAccount.${student_id}.family_agreement_status == PENDING"
            - "StudentAccount.${student_id}.financial_posture == CLEAR"
            - "StudentAccount.${student_id}.insurance_enrolled == false"
            - "StudentAccount.${student_id}.lifetime_damage_count == 0"

      - name: asset_unit_initial_lifecycle_ready_and_depreciated_value_computed
        claim_type: computed_fields
        grounds: [entities.AssetUnit.fields.lifecycle_status, entities.AssetUnit.fields.depreciated_value_cents, entities.AssetUnit.fields.months_in_service]
        distinguishing_aspect: "AssetUnit create → lifecycle_status=READY, depreciated_value_cents computed from fleet formula at intake"
        test_recipe:
          setup: ["Program ACTIVE, fleet DEVICE with replacement=100000, salvage=10000, useful_life=36, in_service=2026-05-01"]
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { program_name: "P", school_year: "2026-2027" }
              as: DistrictAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets"
              payload: { fleet_name: "F", asset_class: "DEVICE", unit_replacement_cost_cents: 100000, salvage_value_cents: 10000, useful_life_months: 36, in_service_date: "2026-05-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: DistrictAdmin
          trigger:
            - call: "POST /api/programs/${prog_id}/fleets/${fleet_id}/asset-units"
              payload: { asset_tag_barcode: "BC-CMP", serial_number: "SN-CMP" }
              as: SiteTechnician
              captures: { asset_id: $.data.id, status: $.data.lifecycle_status, dep: $.data.depreciated_value_cents, grade: $.data.condition_grade }
          assert:
            - "AssetUnit.${asset_id}.lifecycle_status == READY"
            - "AssetUnit.${asset_id}.condition_grade == A (default)"
            - "AssetUnit.${asset_id}.depreciated_value_cents == 100000 (months_in_service == 0 → no depreciation)"
            - "AssetUnit.${asset_id}.months_in_service == 0"

      - name: asset_unit_required_field_missing_rejected
        claim_type: required_field_missing
        grounds: [entities.AssetUnit.fields.asset_tag_barcode, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST asset-units without asset_tag_barcode → 400 ERR_INVALID_REQUEST"
        test_recipe:
          setup: ["Program ACTIVE with fleet"]
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { program_name: "P", school_year: "2026-2027" }
              as: DistrictAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets"
              payload: { fleet_name: "F", asset_class: "DEVICE", unit_replacement_cost_cents: 100000, salvage_value_cents: 10000, useful_life_months: 36, in_service_date: "2025-09-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: DistrictAdmin
          trigger:
            - call: "POST /api/programs/${prog_id}/fleets/${fleet_id}/asset-units"
              payload: { serial_number: "SN-NOBC" }
              as: SiteTechnician
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: family_agreement_auto_created_on_student_enroll
        claim_type: creation_cascade
        grounds: [entities.FamilyAgreement, state_machines.FamilyAgreement, "endpoints: POST /program/{progId}/students"]
        distinguishing_aspect: "POST /students auto-creates a FamilyAgreement row with signature_state=PENDING"
        test_recipe:
          setup: ["Program ACTIVE"]
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { program_name: "P", school_year: "2026-2027" }
              as: DistrictAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets"
              payload: { fleet_name: "F", asset_class: "DEVICE", unit_replacement_cost_cents: 100000, salvage_value_cents: 10000, useful_life_months: 36, in_service_date: "2025-09-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: DistrictAdmin
          trigger:
            - call: "POST /api/programs/${prog_id}/students"
              payload: { student_external_id: "SIS-FA", full_name: "Fa", grade_level: 9 }
              as: Registrar
              captures: { student_id: $.data.id }
            - call: "GET /api/programs/${prog_id}/students/${student_id}/family-agreement"
              payload: {}
              as: Registrar
              captures: { fa_state: "$.data[0].signature_state" }
          assert:
            - "FamilyAgreement for ${student_id} exists"
            - "FamilyAgreement.signature_state == PENDING"

      - name: common_fields_present_and_id_is_uuid
        claim_type: system_fields
        grounds: [entities.DistrictProgram]
        distinguishing_aspect: "id is a UUID without type prefix; created_at is ISO8601 UTC with 3 fractional digits; version starts at 1"
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/programs"
              payload: { program_name: "P", school_year: "2026-2027" }
              as: DistrictAdmin
              captures: { pid: $.data.id, cat: $.data.created_at, uat: $.data.updated_at, ver: $.data.version }
          assert:
            - "id matches UUID format and has no 'prog_' prefix"
            - "created_at is ISO8601 with millisecond precision"
            - "version == 1"

      - name: list_pagination_envelope
        claim_type: listing_with_pagination
        grounds: [response_envelope]
        distinguishing_aspect: "GET /program returns { meta, response_type='array', data: [...] } with limit/offset/total_count/has_more"
        test_recipe:
          setup: ["Create 3 programs"]
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { program_name: "P1", school_year: "2026-2027" }
              as: DistrictAdmin
            - call: "POST /api/programs"
              payload: { program_name: "P2", school_year: "2026-2027" }
              as: DistrictAdmin
            - call: "POST /api/programs"
              payload: { program_name: "P3", school_year: "2026-2027" }
              as: DistrictAdmin
          trigger:
            - call: "GET /api/programs?limit=2&offset=0"
              payload: {}
              as: DistrictAdmin
          assert:
            - "response_type == 'array'"
            - "data has 2 items"
            - "meta exposes limit=2, offset=0, total_count=3, has_more=true"

  # -----------------------------------------------------------------
  # Section 2: From Table 2 (State Machines) — invalid-from rejections,
  # terminal lockdown, initial-state, idempotency
  # -----------------------------------------------------------------
  - section: state_machines
    instances:
      - name: program_close_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.DistrictProgram, "errors[ERR_PROGRAM_STATE_FORBIDS]"]
        distinguishing_aspect: "POST /program/{id}/close while status=DRAFT → 409 ERR_PROGRAM_STATE_FORBIDS"
        test_recipe:
          setup: ["Program in DRAFT"]
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { program_name: "P", school_year: "2026-2027" }
              as: DistrictAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /api/programs/${prog_id}/close"
              payload: {}
              as: DistrictAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_PROGRAM_STATE_FORBIDS"

      - name: activate_program_with_no_fleet_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.DistrictProgram.DRAFT_to_ACTIVE, "errors[ERR_PROGRAM_HAS_NO_FLEET]"]
        distinguishing_aspect: "POST /program/{id}/activate with zero fleets → 409 ERR_PROGRAM_HAS_NO_FLEET"
        test_recipe:
          setup: ["Program in DRAFT, no fleets"]
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { program_name: "P", school_year: "2026-2027" }
              as: DistrictAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: DistrictAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_PROGRAM_HAS_NO_FLEET"

      - name: withdraw_with_open_assignment_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.StudentAccount.ENROLLED_to_WITHDRAWN, "errors[ERR_OPEN_ASSIGNMENTS]"]
        distinguishing_aspect: "Student with an ACTIVE Assignment cannot withdraw"
        test_recipe:
          setup: ["Student has one ACTIVE Assignment"]
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { program_name: "P", school_year: "2026-2027" }
              as: DistrictAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets"
              payload: { fleet_name: "F", asset_class: "DEVICE", unit_replacement_cost_cents: 100000, salvage_value_cents: 10000, useful_life_months: 36, in_service_date: "2025-09-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets/${fleet_id}/asset-units"
              payload: { asset_tag_barcode: "BC-WO", serial_number: "SN-WO" }
              as: SiteTechnician
              captures: { asset_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: DistrictAdmin
            - call: "POST /api/programs/${prog_id}/students"
              payload: { student_external_id: "SIS-WO", full_name: "Wo", grade_level: 9 }
              as: Registrar
              captures: { student_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/family-agreement/sign"
              payload: { acceptable_use_version: "AUP-2026.v3", signed_by_guardian_name: "G" }
              as: Family
              as_user_id: "${student_id}"
            - call: "GET /api/programs/${prog_id}/students/${student_id}"
              payload: {}
              as: Registrar
              captures: { sv: $.data.version }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/assignments"
              payload: { asset_unit_id: "${asset_id}", expected_return_date: "2027-06-01T00:00:00Z", expected_student_version: "${sv}" }
              as: Registrar
          trigger:
            - call: "POST /api/programs/${prog_id}/students/${student_id}/withdraw"
              payload: {}
              as: Registrar
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_OPEN_ASSIGNMENTS"

      - name: double_sign_family_agreement_rejected
        claim_type: invalid_transition_idempotency
        grounds: [state_machines.FamilyAgreement, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "FamilyAgreement already SIGNED — second sign call rejected"
        test_recipe:
          setup: ["Student with signed agreement"]
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { program_name: "P", school_year: "2026-2027" }
              as: DistrictAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets"
              payload: { fleet_name: "F", asset_class: "DEVICE", unit_replacement_cost_cents: 100000, salvage_value_cents: 10000, useful_life_months: 36, in_service_date: "2025-09-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: DistrictAdmin
            - call: "POST /api/programs/${prog_id}/students"
              payload: { student_external_id: "SIS-DS", full_name: "Ds", grade_level: 9 }
              as: Registrar
              captures: { student_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/family-agreement/sign"
              payload: { acceptable_use_version: "AUP-2026.v3", signed_by_guardian_name: "G" }
              as: Family
              as_user_id: "${student_id}"
          trigger:
            - call: "POST /api/programs/${prog_id}/students/${student_id}/family-agreement/sign"
              payload: { acceptable_use_version: "AUP-2026.v3", signed_by_guardian_name: "G" }
              as: Family
              as_user_id: "${student_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: retire_terminal_disposed_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.AssetUnit]
        distinguishing_aspect: "AssetUnit in DISPOSED rejects further transitions (e.g., donate)"
        test_recipe:
          setup: ["AssetUnit DISPOSED"]
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { program_name: "P", school_year: "2026-2027" }
              as: DistrictAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets"
              payload: { fleet_name: "F", asset_class: "DEVICE", unit_replacement_cost_cents: 100000, salvage_value_cents: 10000, useful_life_months: 12, in_service_date: "2025-05-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets/${fleet_id}/asset-units"
              payload: { asset_tag_barcode: "BC-TL", serial_number: "SN-TL" }
              as: SiteTechnician
              captures: { asset_id: $.data.id, asset_v0: $.data.version }
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: DistrictAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "GET /api/programs/${prog_id}/asset-units/${asset_id}"
              payload: {}
              as: DistrictAdmin
              captures: { asset_v: $.data.version }
            - call: "POST /api/programs/${prog_id}/asset-units/${asset_id}/retire"
              payload: { expected_asset_unit_version: "${asset_v}" }
              as: DistrictAdmin
            - call: "POST /api/programs/${prog_id}/asset-units/${asset_id}/dispose"
              payload: {}
              as: DistrictAdmin
          trigger:
            - call: "POST /api/programs/${prog_id}/asset-units/${asset_id}/donate"
              payload: {}
              as: DistrictAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE (DISPOSED is terminal)"

      - name: confirm_draft_damage_report_rejected
        claim_type: invalid_transition
        grounds: [state_machines.DamageReport, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /confirm on a DRAFT DamageReport (must be SUBMITTED) → 409"
        test_recipe:
          setup: ["DamageReport in DRAFT"]
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { program_name: "P", school_year: "2026-2027" }
              as: DistrictAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets"
              payload: { fleet_name: "F", asset_class: "DEVICE", unit_replacement_cost_cents: 100000, salvage_value_cents: 10000, useful_life_months: 36, in_service_date: "2025-09-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets/${fleet_id}/asset-units"
              payload: { asset_tag_barcode: "BC-CF", serial_number: "SN-CF" }
              as: SiteTechnician
              captures: { asset_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: DistrictAdmin
            - call: "POST /api/programs/${prog_id}/students"
              payload: { student_external_id: "SIS-CF", full_name: "Cf", grade_level: 9 }
              as: Registrar
              captures: { student_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/family-agreement/sign"
              payload: { acceptable_use_version: "AUP-2026.v3", signed_by_guardian_name: "G" }
              as: Family
              as_user_id: "${student_id}"
            - call: "GET /api/programs/${prog_id}/students/${student_id}"
              payload: {}
              as: Registrar
              captures: { sv: $.data.version }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/assignments"
              payload: { asset_unit_id: "${asset_id}", expected_return_date: "2027-06-01T00:00:00Z", expected_student_version: "${sv}" }
              as: Registrar
              captures: { as_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/assignments/${as_id}/damage-reports"
              payload: { damage_category: "COSMETIC", observed_condition_grade: "B" }
              as: Family
              as_user_id: "${student_id}"
              captures: { dr_id: $.data.id }
          trigger:
            - call: "POST /api/programs/${prog_id}/students/${student_id}/assignments/${as_id}/damage-reports/${dr_id}/confirm"
              payload: {}
              as: SiteTechnician
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE (DRAFT cannot be CONFIRMED directly)"

      - name: settle_already_settled_fee_rejected
        claim_type: invalid_transition_idempotency
        grounds: [state_machines.FeeAssessment]
        distinguishing_aspect: "FeeAssessment in SETTLED rejects further settle calls"
        test_recipe:
          setup: ["Fee settled"]
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { program_name: "P", school_year: "2026-2027" }
              as: DistrictAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets"
              payload: { fleet_name: "F", asset_class: "DEVICE", unit_replacement_cost_cents: 100000, salvage_value_cents: 10000, useful_life_months: 36, in_service_date: "2025-09-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets/${fleet_id}/asset-units"
              payload: { asset_tag_barcode: "BC-ST", serial_number: "SN-ST" }
              as: SiteTechnician
              captures: { asset_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: DistrictAdmin
            - call: "POST /api/programs/${prog_id}/students"
              payload: { student_external_id: "SIS-ST", full_name: "St", grade_level: 9 }
              as: Registrar
              captures: { student_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/family-agreement/sign"
              payload: { acceptable_use_version: "AUP-2026.v3", signed_by_guardian_name: "G" }
              as: Family
              as_user_id: "${student_id}"
            - call: "GET /api/programs/${prog_id}/students/${student_id}"
              payload: {}
              as: Registrar
              captures: { sv: $.data.version }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/assignments"
              payload: { asset_unit_id: "${asset_id}", expected_return_date: "2027-06-01T00:00:00Z", expected_student_version: "${sv}" }
              as: Registrar
              captures: { as_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/assignments/${as_id}/damage-reports"
              payload: { damage_category: "COSMETIC", observed_condition_grade: "A" }
              as: Family
              as_user_id: "${student_id}"
              captures: { dr_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/assignments/${as_id}/damage-reports/${dr_id}/submit"
              payload: {}
              as: Family
              as_user_id: "${student_id}"
            - call: "POST /api/programs/${prog_id}/students/${student_id}/assignments/${as_id}/damage-reports/${dr_id}/confirm"
              payload: {}
              as: SiteTechnician
            - call: "GET /api/programs/${prog_id}/students/${student_id}/fees"
              payload: {}
              as: DistrictAdmin
              captures: { fee_id: "$.data[0].id" }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/fees/${fee_id}/settle"
              payload: { payment_cents: 10000 }
              as: DistrictAdmin
          trigger:
            - call: "POST /api/programs/${prog_id}/students/${student_id}/fees/${fee_id}/settle"
              payload: { payment_cents: 100 }
              as: DistrictAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE"

  # -----------------------------------------------------------------
  # Section 3: From Table 3 (Calculations) — input-set filtering, constants
  # -----------------------------------------------------------------
  - section: calculations
    instances:
      - name: financial_posture_excludes_terminal_fees
        claim_type: input_set_filtering
        grounds: [calculations.financial_posture_derivation]
        distinguishing_aspect: "posture derivation sums only FeeAssessment with status IN {ASSESSED, APPEALED}; SETTLED / WAIVED / WRITTEN_OFF are excluded"
        test_recipe:
          setup: ["Student with one SETTLED fee (paid 10000) and one ASSESSED fee of 5000"]
          setup_api_calls:
