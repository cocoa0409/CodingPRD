      - name: delisted_publisher_is_locked_against_every_further_status_change
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Publisher.ACTIVE_to_DELISTED
          - state_machines.Publisher.terminal_states
          - errors[ERR_PUBLISHER_DELISTED]
        distinguishing_aspect: |
          DELISTED is the Publisher machine's only terminal state and the
          lockdown must answer with the dedicated ERR_PUBLISHER_DELISTED for
          EVERY requested target - including a repeat of DELISTED itself and
          including ACTIVE, which is a legal target from RESTRICTED. A generic
          state error would let an operator believe reinstatement is merely
          out of order rather than impossible.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; one ACTIVE publisher that is then delisted by the platform."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /publishers"
              payload: { name: "Beacon Digital", primary_domain: "beacon.example.com", sourced_traffic_pct: 0.40 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /publishers/${pub_id}/status"
              payload: { new_status: "DELISTED", reason: "Repeated policy breach" }
              as: PlatformAdmin
          trigger:
            - call: "POST /publishers/${pub_id}/status"
              payload: { new_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { err_reinstate: $.data.error_id }
            - call: "POST /publishers/${pub_id}/status"
              payload: { new_status: "DELISTED" }
              as: PlatformAdmin
              captures: { err_redelist: $.data.error_id }
            - call: "POST /publishers/${pub_id}/status"
              payload: { new_status: "RESTRICTED" }
              as: PlatformAdmin
              captures: { err_restrict: $.data.error_id }
          assert:
            - "Before the trigger: Publisher.${pub_id}.publisher_status == DELISTED, status_reason == ADMIN_ACTION, version == 2"
            - "All three triggers: HTTP 409 with ${err_reinstate} == ${err_redelist} == ${err_restrict} == ERR_PUBLISHER_DELISTED"
            - "Publisher.${pub_id}.publisher_status is still DELISTED and version is still 2 (no refused call bumped it)"
            - "Publisher.${pub_id}.status_reason is still ADMIN_ACTION"

      - name: appeal_overturn_cascade_vacates_the_classification_and_auto_rejects_the_claim
        claim_type: cross_entity
        grounds:
          - state_machines.Page.APPEALED_to_RECLASSIFIED
          - state_machines.PageClassification.CONFIRMED_to_VACATED
          - state_machines.Appeal.FILED_to_OVERTURNED
          - state_machines.RefundClaim.SUBMITTED_to_REJECTED_system
          - calculations.page_suitability_tier
          - calculations.claim_gross_credit_cents
          - calculations.claim_net_credit_cents
