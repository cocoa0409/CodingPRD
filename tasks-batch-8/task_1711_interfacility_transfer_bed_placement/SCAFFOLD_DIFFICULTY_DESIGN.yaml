# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN — §1.8 Test Targeting Index
# Interfacility Transfer & Bed Placement
# Logical clock default: 2026-08-01T00:00:00Z (no set_current_utc call needed
# to sit at this instant). All timestamps cited below derive from it.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: ett_optimistic_vs_conservative_air_dispatch
        grounds:
          - calculations.transport_ett_estimate
          - entities.TransportDispatch.fields.estimated_minutes_optimistic
          - entities.TransportDispatch.fields.estimated_minutes_conservative
        distinguishing_aspect: |
          Dual-variant calculation on the TransportDispatch domain: one dispatch
          creation stores BOTH ETT variants computed from identical inputs;
          optimistic (70) != conservative (102) because only conservative carries
          ceil(base*1.25), the CCT crew buffer and the CRITICAL acuity surcharge.
        test_recipe:
          setup:
            - "Sending facility SND (TRAUMA capability) and receiving facility RCV (CARDIAC_CATH, TRAUMA); RCV has one AVAILABLE ICU bed"
            - "phys_s at SND (sending), phys_r at RCV (receiving)"
            - "CRITICAL ICU case, requires_isolation false, required_capability CARDIAC_CATH; screening EMC stable -> certified (EMTALA_APPLIES) at 2026-08-01T00:00:00Z"
            - "request-acceptance to RCV/phys_r -> AWAITING_ACCEPTANCE; accept -> ACCEPTED, hold expires 2026-08-01T01:00:00Z (CRITICAL=60min)"
            - "packet required [H_AND_P], no imaging; H_AND_P uploaded -> READY"
            - "insurance notification created and notified at 00:00:00Z (on time, sla_due_at 01:00:00Z)"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Sending General", facility_code: "SND", trauma_level: "LEVEL_3", capabilities: ["TRAUMA"] }
              as: TransferCoordinator
              captures: { fac_s: $.data.id }
            - call: "POST /facilities"
              payload: { name: "Receiving Trauma Center", facility_code: "RCV", trauma_level: "LEVEL_1", capabilities: ["CARDIAC_CATH", "TRAUMA"] }
              as: TransferCoordinator
              captures: { fac_r: $.data.id }
            - call: "POST /facilities/${fac_r}/beds"
              payload: { bed_code: "ICU-01", unit_type: "ICU", isolation_capable: false }
              as: BedManager
              as_user_id: "${fac_r}"
            - call: "POST /physicians"
              payload: { full_name: "Dr Send", facility_id: "${fac_s}", specialty: "EMERGENCY" }
              as: TransferCoordinator
              captures: { phys_s: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Recv", facility_id: "${fac_r}", specialty: "INTENSIVIST" }
              as: TransferCoordinator
              captures: { phys_r: $.data.id }
            - call: "POST /transfer-cases"
              payload: { patient_ref: "PT-ETT-1", sending_facility_id: "${fac_s}", sending_physician_id: "${phys_s}", acuity_level: "CRITICAL", required_unit_type: "ICU", requires_isolation: false, required_capability: "CARDIAC_CATH" }
              as: TransferCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /transfer-cases/${case_id}/emtala-screening"
              payload: { has_emergency_medical_condition: true, is_stabilized: true }
              as: SendingPhysician
              as_user_id: "${phys_s}"
            - call: "POST /transfer-cases/${case_id}/emtala-screening/certify"
              payload: {}
              as: SendingPhysician
              as_user_id: "${phys_s}"
            - call: "POST /transfer-cases/${case_id}/request-acceptance"
              payload: { receiving_facility_id: "${fac_r}", receiving_physician_id: "${phys_r}", contact_method: "PHONE" }
              as: TransferCoordinator
            - call: "POST /transfer-cases/${case_id}/accept"
              payload: {}
              as: ReceivingPhysician
              as_user_id: "${phys_r}"
            - call: "POST /transfer-cases/${case_id}/clinical-packet"
              payload: { required_documents: ["H_AND_P"] }
              as: SendingPhysician
              as_user_id: "${phys_s}"
              captures: { pkt_id: $.data.id, pkt_v: $.data.version }
            - call: "POST /clinical-packets/${pkt_id}/documents"
              payload: { documents: ["H_AND_P"], expected_clinical_packet_version: "${pkt_v}" }
              as: SendingPhysician
              as_user_id: "${phys_s}"
            - call: "POST /transfer-cases/${case_id}/insurance-notifications"
              payload: { payer_id: "PAYER-9", channel: "PORTAL" }
              as: TransferCoordinator
              captures: { notif_id: $.data.id }
            - call: "POST /insurance-notifications/${notif_id}/notify"
              payload: {}
              as: TransferCoordinator
          trigger:
            - call: "POST /transfer-cases/${case_id}/dispatch"
              payload: { mode: "AIR_ROTOR", crew_capability: "CCT", distance_miles: 90 }
              as: TransferCoordinator
              captures: { disp_opt: $.data.estimated_minutes_optimistic, disp_cons: $.data.estimated_minutes_conservative, disp_status: $.data.status }
          assert:
            - "TransportDispatch.estimated_minutes_optimistic == 70  (ceil(90/120*60)=45 base + 25 rotor overhead)"
            - "TransportDispatch.estimated_minutes_conservative == 102  (ceil(45*1.25)=57 + 25 + 10 CCT buffer + 10 CRITICAL surcharge)"
            - "TransportDispatch.estimated_minutes_optimistic != TransportDispatch.estimated_minutes_conservative for identical dispatch inputs"
            - "TransportDispatch.status == DISPATCHED and TransferCase.${case_id}.status == TRANSPORT_ARRANGED"

      - name: clinical_intent_vs_operational_duration_split
        grounds:
          - calculations.transfer_duration_measurement
          - entities.TransferOutcome.fields.door_to_arrival_minutes
          - entities.TransportDispatch.fields.actual_duration_minutes
        distinguishing_aspect: |
          Dual-variant duration on the TransferOutcome domain (different entity
          domain from ett_optimistic_vs_conservative_air_dispatch): the same
          completed transfer yields door_to_arrival_minutes == 300 measured from
          EMTALA determination, but actual_duration_minutes == 60 measured from
          departure — two valid measures, different numbers.
        test_recipe:
          setup:
            - "Facilities SND/RCV (RCV has CARDIAC_CATH), one AVAILABLE ICU bed at RCV; phys_s at SND, phys_r at RCV"
            - "EMERGENT ICU case; screening EMC stable -> EMTALA_APPLIES certified at 2026-08-01T00:00:00Z"
            - "request-acceptance + accept at 00:00 (EMERGENT hold expires 02:00:00Z)"
            - "packet required [H_AND_P] uploaded -> READY; insurance notified at 00:00 (on time)"
            - "dispatch GROUND_ALS / ALS / 90 miles at 00:00 (passes hold-expiry check: 00:00 < 02:00)"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Sending General", facility_code: "SND", trauma_level: "LEVEL_3", capabilities: ["TRAUMA"] }
              as: TransferCoordinator
              captures: { fac_s: $.data.id }
            - call: "POST /facilities"
              payload: { name: "Receiving Trauma Center", facility_code: "RCV", trauma_level: "LEVEL_1", capabilities: ["CARDIAC_CATH", "TRAUMA"] }
              as: TransferCoordinator
              captures: { fac_r: $.data.id }
            - call: "POST /facilities/${fac_r}/beds"
              payload: { bed_code: "ICU-01", unit_type: "ICU" }
              as: BedManager
              as_user_id: "${fac_r}"
            - call: "POST /physicians"
              payload: { full_name: "Dr Send", facility_id: "${fac_s}", specialty: "EMERGENCY" }
              as: TransferCoordinator
              captures: { phys_s: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Recv", facility_id: "${fac_r}", specialty: "INTENSIVIST" }
              as: TransferCoordinator
              captures: { phys_r: $.data.id }
            - call: "POST /transfer-cases"
              payload: { patient_ref: "PT-DUR-1", sending_facility_id: "${fac_s}", sending_physician_id: "${phys_s}", acuity_level: "EMERGENT", required_unit_type: "ICU", requires_isolation: false, required_capability: "CARDIAC_CATH" }
              as: TransferCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /transfer-cases/${case_id}/emtala-screening"
              payload: { has_emergency_medical_condition: true, is_stabilized: true }
              as: SendingPhysician
              as_user_id: "${phys_s}"
            - call: "POST /transfer-cases/${case_id}/emtala-screening/certify"
              payload: {}
              as: SendingPhysician
              as_user_id: "${phys_s}"
            - call: "POST /transfer-cases/${case_id}/request-acceptance"
              payload: { receiving_facility_id: "${fac_r}", receiving_physician_id: "${phys_r}", contact_method: "SECURE_MESSAGE" }
              as: TransferCoordinator
            - call: "POST /transfer-cases/${case_id}/accept"
              payload: {}
              as: ReceivingPhysician
              as_user_id: "${phys_r}"
            - call: "POST /transfer-cases/${case_id}/clinical-packet"
              payload: { required_documents: ["H_AND_P"] }
              as: SendingPhysician
              as_user_id: "${phys_s}"
              captures: { pkt_id: $.data.id, pkt_v: $.data.version }
            - call: "POST /clinical-packets/${pkt_id}/documents"
              payload: { documents: ["H_AND_P"], expected_clinical_packet_version: "${pkt_v}" }
              as: SendingPhysician
              as_user_id: "${phys_s}"
            - call: "POST /transfer-cases/${case_id}/insurance-notifications"
              payload: { payer_id: "PAYER-9", channel: "PHONE" }
              as: TransferCoordinator
              captures: { notif_id: $.data.id }
            - call: "POST /insurance-notifications/${notif_id}/notify"
              payload: {}
              as: TransferCoordinator
            - call: "POST /transfer-cases/${case_id}/dispatch"
              payload: { mode: "GROUND_ALS", crew_capability: "ALS", distance_miles: 90 }
              as: TransferCoordinator
              captures: { disp_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T04:00:00Z" }
              as: TransferCoordinator
            - call: "POST /transfer-cases/${case_id}/depart"
              payload: {}
              as: TransferCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T05:00:00Z" }
              as: TransferCoordinator
          trigger:
            - call: "POST /transfer-cases/${case_id}/arrive"
              payload: { arrival_condition: "STABLE", deterioration_en_route: false, receiving_physician_confirmed: true }
              as: TransferCoordinator
            - call: "GET /transfer-cases/${case_id}/outcome"
              as: Any
              captures: { out_minutes: "$.data[0].door_to_arrival_minutes" }
            - call: "GET /transport-dispatches/${disp_id}"
              as: Any
              captures: { disp_actual: $.data.actual_duration_minutes }
          assert:
            - "TransferOutcome.door_to_arrival_minutes == 300  (floor((05:00 - 00:00) = 300 min) — clinical_intent variant)"
            - "TransportDispatch.${disp_id}.actual_duration_minutes == 60  (05:00 - 04:00 — operational variant)"
            - "door_to_arrival_minutes (300) != actual_duration_minutes (60) for the same arrival event"
            - "TransferCase.${case_id}.status == ARRIVED"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: ett_mode_crew_acuity_nonlinear_interaction
        grounds:
          - calculations.transport_ett_estimate
          - state_machines.TransportDispatch.DISPATCHED_to_CANCELLED
        distinguishing_aspect: |
          Mode (a) — a >=3-input formula with non-linear interaction: dispatching
          the same 90-mile CRITICAL case first by AIR_ROTOR/CCT (70/102) and then,
          after dispatch cancel reversion, by GROUND_ALS/CCT (130/180) shows the
          mode branch, ceil inflation and conditional crew+acuity buffers do not
          compose additively (optimistic delta 60 vs conservative delta 78).
        test_recipe:
          setup:
            - "Same fixture family as ett_optimistic_vs_conservative_air_dispatch: CRITICAL ICU case ACCEPTED with READY packet and NOTIFIED insurance, hold valid (CRITICAL, expires 01:00:00Z, clock still 00:00)"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Sending General", facility_code: "SND", trauma_level: "LEVEL_3", capabilities: ["TRAUMA"] }
              as: TransferCoordinator
              captures: { fac_s: $.data.id }
            - call: "POST /facilities"
              payload: { name: "Receiving Trauma Center", facility_code: "RCV", trauma_level: "LEVEL_1", capabilities: ["CARDIAC_CATH", "TRAUMA"] }
              as: TransferCoordinator
              captures: { fac_r: $.data.id }
            - call: "POST /facilities/${fac_r}/beds"
              payload: { bed_code: "ICU-01", unit_type: "ICU" }
              as: BedManager
              as_user_id: "${fac_r}"
            - call: "POST /physicians"
              payload: { full_name: "Dr Send", facility_id: "${fac_s}", specialty: "EMERGENCY" }
              as: TransferCoordinator
              captures: { phys_s: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Recv", facility_id: "${fac_r}", specialty: "INTENSIVIST" }
              as: TransferCoordinator
              captures: { phys_r: $.data.id }
            - call: "POST /transfer-cases"
              payload: { patient_ref: "PT-COMB-1", sending_facility_id: "${fac_s}", sending_physician_id: "${phys_s}", acuity_level: "CRITICAL", required_unit_type: "ICU", requires_isolation: false, required_capability: "CARDIAC_CATH" }
              as: TransferCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /transfer-cases/${case_id}/emtala-screening"
              payload: { has_emergency_medical_condition: true, is_stabilized: true }
              as: SendingPhysician
              as_user_id: "${phys_s}"
            - call: "POST /transfer-cases/${case_id}/emtala-screening/certify"
              payload: {}
              as: SendingPhysician
              as_user_id: "${phys_s}"
            - call: "POST /transfer-cases/${case_id}/request-acceptance"
              payload: { receiving_facility_id: "${fac_r}", receiving_physician_id: "${phys_r}", contact_method: "PHONE" }
              as: TransferCoordinator
            - call: "POST /transfer-cases/${case_id}/accept"
              payload: {}
              as: ReceivingPhysician
              as_user_id: "${phys_r}"
            - call: "POST /transfer-cases/${case_id}/clinical-packet"
              payload: { required_documents: ["H_AND_P"] }
              as: SendingPhysician
              as_user_id: "${phys_s}"
              captures: { pkt_id: $.data.id, pkt_v: $.data.version }
            - call: "POST /clinical-packets/${pkt_id}/documents"
              payload: { documents: ["H_AND_P"], expected_clinical_packet_version: "${pkt_v}" }
              as: SendingPhysician
              as_user_id: "${phys_s}"
            - call: "POST /transfer-cases/${case_id}/insurance-notifications"
              payload: { payer_id: "PAYER-9", channel: "PORTAL" }
              as: TransferCoordinator
              captures: { notif_id: $.data.id }
            - call: "POST /insurance-notifications/${notif_id}/notify"
              payload: {}
              as: TransferCoordinator
          trigger:
            - call: "POST /transfer-cases/${case_id}/dispatch"
              payload: { mode: "AIR_ROTOR", crew_capability: "CCT", distance_miles: 90 }
              as: TransferCoordinator
              captures: { air_id: $.data.id, air_opt: $.data.estimated_minutes_optimistic, air_cons: $.data.estimated_minutes_conservative }
            - call: "POST /transport-dispatches/${air_id}/cancel"
              payload: {}
              as: TransferCoordinator
            - call: "POST /transfer-cases/${case_id}/dispatch"
              payload: { mode: "GROUND_ALS", crew_capability: "CCT", distance_miles: 90 }
              as: TransferCoordinator
              captures: { gnd_opt: $.data.estimated_minutes_optimistic, gnd_cons: $.data.estimated_minutes_conservative }
          assert:
            - "air dispatch: estimated_minutes_optimistic == 70 and estimated_minutes_conservative == 102"
            - "dispatch cancel reverts TransferCase.${case_id}.status to ACCEPTED (cyclic re-selection)"
            - "ground dispatch after re-dispatch: estimated_minutes_optimistic == 130 (base ceil(90/45*60)=120 + 10 overhead) and estimated_minutes_conservative == 180 (ceil(120*1.25)=150 + 10 overhead + 10 CCT + 10 CRITICAL)"
            - "non-linearity: conservative gap (180-102=78) != optimistic gap (130-70=60) for the identical distance"

      - name: quality_composite_dimension_rounding_order_pinned
        grounds:
          - calculations.quality_composite_score
          - entities.QualityReview.fields.composite_score
        distinguishing_aspect: |
          Mode (b) — nested rounding order: the scaffold pins round-each-dimension-
          to-integer-THEN-weighted-sum; on a REFUSAL_RISK review with 1-of-3
          documents the pinned order yields composite 31.55 while the forbidden
          sum-then-round order yields 31.67, and only 31.55 is correct.
        test_recipe:
          setup:
            - "EMTALA_APPLIES case in AWAITING_ACCEPTANCE at RCV; phys_q is a third physician (reviewer, not a case physician)"
            - "packet requires [H_AND_P, LABS, MED_RECONCILIATION]; only H_AND_P uploaded (documentation raw 33.333...)"
            - "no notification created (no is_late), no holds (no EXPIRED): protocol raw = 100 - 20*1 = 80"
            - "case never arrived: timeliness raw = 0"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Sending General", facility_code: "SND", trauma_level: "LEVEL_3", capabilities: ["TRAUMA"] }
              as: TransferCoordinator
              captures: { fac_s: $.data.id }
            - call: "POST /facilities"
              payload: { name: "Receiving Trauma Center", facility_code: "RCV", trauma_level: "LEVEL_1", capabilities: ["CARDIAC_CATH", "TRAUMA"] }
              as: TransferCoordinator
              captures: { fac_r: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Send", facility_id: "${fac_s}", specialty: "EMERGENCY" }
              as: TransferCoordinator
              captures: { phys_s: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Recv", facility_id: "${fac_r}", specialty: "INTENSIVIST" }
              as: TransferCoordinator
              captures: { phys_r: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Quality", facility_id: "${fac_r}", specialty: "GENERAL" }
              as: TransferCoordinator
              captures: { phys_q: $.data.id }
            - call: "POST /transfer-cases"
              payload: { patient_ref: "PT-QR-1", sending_facility_id: "${fac_s}", sending_physician_id: "${phys_s}", acuity_level: "URGENT", required_unit_type: "TELEMETRY", requires_isolation: false, required_capability: "CARDIAC_CATH" }
              as: TransferCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /transfer-cases/${case_id}/emtala-screening"
              payload: { has_emergency_medical_condition: true, is_stabilized: true }
              as: SendingPhysician
              as_user_id: "${phys_s}"
            - call: "POST /transfer-cases/${case_id}/emtala-screening/certify"
              payload: {}
              as: SendingPhysician
              as_user_id: "${phys_s}"
            - call: "POST /transfer-cases/${case_id}/request-acceptance"
              payload: { receiving_facility_id: "${fac_r}", receiving_physician_id: "${phys_r}", contact_method: "PHONE" }
              as: TransferCoordinator
            - call: "POST /transfer-cases/${case_id}/clinical-packet"
              payload: { required_documents: ["H_AND_P", "LABS", "MED_RECONCILIATION"] }
              as: SendingPhysician
              as_user_id: "${phys_s}"
              captures: { pkt_id: $.data.id, pkt_v: $.data.version }
            - call: "POST /clinical-packets/${pkt_id}/documents"
              payload: { documents: ["H_AND_P"], expected_clinical_packet_version: "${pkt_v}" }
              as: SendingPhysician
              as_user_id: "${phys_s}"
            - call: "POST /transfer-cases/${case_id}/refuse"
              payload: { refusal_category: "NO_BED_AVAILABLE", narrative: "No monitored telemetry bed available for the next six hours; documented per policy." }
              as: ReceivingPhysician
              as_user_id: "${phys_r}"
            - call: "GET /quality-reviews?transfer_case_id=${case_id}"
              as: Any
              captures: { rev_id: "$.data[0].id", rev_trigger: "$.data[0].trigger" }
            - call: "POST /quality-reviews/${rev_id}/begin"
              payload: {}
              as: QualityReviewer
              as_user_id: "${phys_q}"
          trigger:
            - call: "POST /quality-reviews/${rev_id}/close"
              payload: { outcome: "MINOR_VARIANCE", findings: "Refusal documentation adequate; capacity escalation pathway was followed correctly." }
              as: QualityReviewer
              as_user_id: "${phys_q}"
              captures: { rev_comp: $.data.composite_score, rev_doc: $.data.documentation_score }
          assert:
            - "QualityReview.${rev_id}.trigger == REFUSAL_RISK (auto-created by the refuse cascade)"
            - "timeliness_score == 0 (case never produced a TransferOutcome)"
            - "documentation_score == 33 (100*1/3 = 33.333..., rounded to 0dp half-up and STORED)"
            - "protocol_score == 80 (100 - 20*refusal_count(1), no late notification, no expired hold)"
            - "composite_score == 31.55 (pinned order: 0.40*0 + 0.35*33 + 0.25*80 = 31.55; sum-then-round would give 31.67 and MUST NOT)"
            - "QualityReview.${rev_id}.status == CLOSED"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: case_refusal_rerequest_cycle
        grounds:
          - state_machines.TransferCase.REFUSED_to_AWAITING_ACCEPTANCE
          - state_machines.TransferCase.AWAITING_ACCEPTANCE_to_REFUSED
          - entities.TransferCase.fields.negotiation_round
        distinguishing_aspect: |
          TransferCase is cyclic: AWAITING_ACCEPTANCE -> REFUSED -> (re-request)
          -> AWAITING_ACCEPTANCE a second time, with negotiation_round advancing
          1 -> 2 and the refusal history (refusal_count == 1) preserved — not a
          linear pipeline.
        test_recipe:
          setup:
            - "Two receiving facilities RCV1 and RCV2 (both CARDIAC_CATH), receiving physicians phys_r1 / phys_r2"
            - "EMTALA_APPLIES case refused by RCV1 in round 1"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Sending General", facility_code: "SND", trauma_level: "LEVEL_3", capabilities: ["TRAUMA"] }
              as: TransferCoordinator
              captures: { fac_s: $.data.id }
            - call: "POST /facilities"
              payload: { name: "Receiving One", facility_code: "RCV1", trauma_level: "LEVEL_1", capabilities: ["CARDIAC_CATH"] }
              as: TransferCoordinator
              captures: { fac_r1: $.data.id }
            - call: "POST /facilities"
              payload: { name: "Receiving Two", facility_code: "RCV2", trauma_level: "LEVEL_1", capabilities: ["CARDIAC_CATH"] }
              as: TransferCoordinator
              captures: { fac_r2: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Send", facility_id: "${fac_s}", specialty: "EMERGENCY" }
              as: TransferCoordinator
              captures: { phys_s: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr RecvOne", facility_id: "${fac_r1}", specialty: "CARDIOLOGY" }
              as: TransferCoordinator
              captures: { phys_r1: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr RecvTwo", facility_id: "${fac_r2}", specialty: "CARDIOLOGY" }
              as: TransferCoordinator
              captures: { phys_r2: $.data.id }
            - call: "POST /transfer-cases"
              payload: { patient_ref: "PT-CYC-1", sending_facility_id: "${fac_s}", sending_physician_id: "${phys_s}", acuity_level: "URGENT", required_unit_type: "TELEMETRY", requires_isolation: false, required_capability: "CARDIAC_CATH" }
              as: TransferCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /transfer-cases/${case_id}/emtala-screening"
              payload: { has_emergency_medical_condition: true, is_stabilized: true }
              as: SendingPhysician
              as_user_id: "${phys_s}"
            - call: "POST /transfer-cases/${case_id}/emtala-screening/certify"
              payload: {}
              as: SendingPhysician
              as_user_id: "${phys_s}"
            - call: "POST /transfer-cases/${case_id}/request-acceptance"
              payload: { receiving_facility_id: "${fac_r1}", receiving_physician_id: "${phys_r1}", contact_method: "PHONE" }
              as: TransferCoordinator
            - call: "POST /transfer-cases/${case_id}/refuse"
              payload: { refusal_category: "CAPACITY_EXCEEDED", narrative: "All telemetry beds occupied and boarding exceeds safe threshold tonight." }
              as: ReceivingPhysician
              as_user_id: "${phys_r1}"
          trigger:
            - call: "POST /transfer-cases/${case_id}/re-request"
              payload: { receiving_facility_id: "${fac_r2}", receiving_physician_id: "${phys_r2}", contact_method: "TELEMEDICINE" }
              as: TransferCoordinator
            - call: "GET /communications?transfer_case_id=${case_id}&to_physician_id=${phys_r2}"
              as: Any
              captures: { comm2_round: "$.data[0].round", comm2_outcome: "$.data[0].outcome" }
          assert:
            - "TransferCase.${case_id}.status == AWAITING_ACCEPTANCE after re-request (cycle REFUSED -> AWAITING_ACCEPTANCE)"
            - "TransferCase.${case_id}.negotiation_round == 2"
            - "TransferCase.${case_id}.refusal_count == 1 (history preserved across the loop)"
            - "TransferCase.${case_id}.receiving_facility_id == ${fac_r2} (re-targeted)"
            - "new PhysicianCommunication.round == 2 and outcome == PENDING"

      - name: screening_certify_amend_recertify_loop
        grounds:
          - state_machines.EmtalaScreening.CERTIFIED_to_AMENDED
          - state_machines.EmtalaScreening.AMENDED_to_CERTIFIED
          - state_machines.TransferCase.EMTALA_DETERMINED_to_INTAKE
        distinguishing_aspect: |
          EmtalaScreening is cyclic on a DIFFERENT entity than TransferCase's
          negotiation loop: CERTIFIED -> AMENDED -> CERTIFIED, and the amendment
          cascades a case revert (EMTALA_DETERMINED -> INTAKE) that clears
          emtala_obligation to UNDETERMINED; re-certification with flipped
          is_stabilized changes the determination to EMERGENCY_EXCEPTION.
        test_recipe:
          setup:
            - "Case with screening has_emergency_medical_condition=true, is_stabilized=true, certified (EMTALA_APPLIES)"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Sending General", facility_code: "SND", trauma_level: "LEVEL_3", capabilities: ["TRAUMA"] }
              as: TransferCoordinator
              captures: { fac_s: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Send", facility_id: "${fac_s}", specialty: "EMERGENCY" }
              as: TransferCoordinator
              captures: { phys_s: $.data.id }
            - call: "POST /transfer-cases"
              payload: { patient_ref: "PT-SCR-1", sending_facility_id: "${fac_s}", sending_physician_id: "${phys_s}", acuity_level: "EMERGENT", required_unit_type: "ICU", requires_isolation: false, required_capability: "TRAUMA" }
              as: TransferCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /transfer-cases/${case_id}/emtala-screening"
              payload: { has_emergency_medical_condition: true, is_stabilized: true }
              as: SendingPhysician
              as_user_id: "${phys_s}"
            - call: "POST /transfer-cases/${case_id}/emtala-screening/certify"
              payload: {}
              as: SendingPhysician
              as_user_id: "${phys_s}"
          trigger:
            - call: "POST /transfer-cases/${case_id}/emtala-screening/amend"
              payload: { is_stabilized: false, benefits_outweigh_risks: true, physician_certification: "Patient requires emergent cath lab; benefits of transfer outweigh transport risks." }
              as: SendingPhysician
              as_user_id: "${phys_s}"
            - call: "GET /transfer-cases/${case_id}"
              as: Any
              captures: { mid_status: $.data.status, mid_obl: $.data.emtala_obligation }
            - call: "POST /transfer-cases/${case_id}/emtala-screening/certify"
              payload: {}
              as: SendingPhysician
              as_user_id: "${phys_s}"
              captures: { scr_status: $.data.status, scr_det: $.data.determination, scr_amend: $.data.amendment_count }
            - call: "GET /transfer-cases/${case_id}"
              as: Any
              captures: { end_obl: $.data.emtala_obligation, end_status: $.data.status }
          assert:
            - "after amend: TransferCase.${case_id}.status == INTAKE and emtala_obligation == UNDETERMINED (cascade revert)"
            - "after re-certify: EmtalaScreening.status == CERTIFIED, amendment_count == 1, determination == EMERGENCY_EXCEPTION"
            - "after re-certify: TransferCase.${case_id}.status == EMTALA_DETERMINED and emtala_obligation == EMERGENCY_EXCEPTION (determination flipped by amended inputs)"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; one depth >= 3, others >= 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: accept_cascade_hold_bed_saturation_diversion
        grounds:
          - state_machines.TransferCase.AWAITING_ACCEPTANCE_to_ACCEPTED
          - state_machines.Bed.AVAILABLE_to_HELD
          - calculations.facility_occupancy
          - calculations.occupancy_saturation_rule
        distinguishing_aspect: |
          Depth-3 transitive cascade from the ACCEPT trigger: accept creates the
          BedHold (link 1); the hold's creation flips the Bed AVAILABLE -> HELD
          (link 2); the bed flip recomputes facility occupancy to 100.0 which
          crosses >= 95.0 and auto-creates an ACTIVE ALL_UNITS DiversionEvent
          (link 3) — each link caused by the previous one, not by accept directly.
        test_recipe:
          setup:
            - "Receiving facility RCV with 10 ICU beds: 9 marked OCCUPIED via housekeeping, 1 AVAILABLE (ICU-10)"
            - "CRITICAL ICU EMTALA_APPLIES case in AWAITING_ACCEPTANCE at RCV (certified at clock default 00:00)"
            - "Pre-accept: occupancy_pct == 90.0, no DiversionEvent exists"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Sending General", facility_code: "SND", trauma_level: "LEVEL_3", capabilities: ["TRAUMA"] }
              as: TransferCoordinator
