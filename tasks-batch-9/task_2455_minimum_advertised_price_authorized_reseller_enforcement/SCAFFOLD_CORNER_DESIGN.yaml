            - "${dc} == 0"
            - "${pp} == 0"
            - "${vid} == null"

      - name: violation_points_provisional_and_final_variants_diverge
        claim_type: variant_divergence
        grounds: ["calculations.violation_points"]
        distinguishing_aspect: "PROVISIONAL_AT_DETECTION uses the 15000 floor in force at observed_at and stores 3; FINAL_AT_NOTICE re-reads the floor at issuance, where a retroactively approved 14500 exception shrinks the deviation to 500 (pct 0.0345, base 1) and stores 2."
        test_recipe:
          setup: ["Violation V1 DETECTED with provisional_points 3 from a 14000 MARKETPLACE listing; a PROMOTIONAL_EVENT exception at 14500 covering [2026-08-10, 2026-08-25) approved AFTER detection but BEFORE issuance (14000 is still below 14500, so the violation is not voided)."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - &EXC14500
              call: "POST /pricing-exceptions"
              payload: { product_id: "${prod}", exception_type: "PROMOTIONAL_EVENT", starts_at: "2026-08-10T00:00:00Z", ends_at: "2026-08-25T00:00:00Z", channel_scope: "ALL", requested_override_floor_cents: 14500, dealer_input_source: "BRAND_MARKETING_PLAN" }
              as: BrandChannelManager
              as_user_id: "bcm-1"
              captures: { exc145: $.data.id }
            - call: "POST /pricing-exceptions/${exc145}/decision"
              payload: { decision: "APPROVE", decision_reason: "Late campaign registration" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
            - *GETRESV
          trigger:
            - *NOTICE1
          assert:
            - "HTTP 201"
            - "Violation.${vio}.provisional_points == 3"
            - "Violation.${vio}.assessed_points == 2"
            - "Violation.${vio}.assessed_floor_cents == 14500"
            - "Violation.${vio}.status == NOTICED"
            - "EnforcementNotice.${not1}.assessed_points == 2"
            - "EnforcementNotice.${not1}.rung == WARNING"
            - "Reseller.${res}.violation_points_total == 2"

      - name: violation_points_variant_is_chosen_by_the_triggering_endpoint
        claim_type: variant_selection
        grounds: ["calculations.violation_points"]
        distinguishing_aspect: "Variant selection is positional, not a request parameter: evaluate always writes provisional_points and notice issuance always writes assessed_points, so with an unchanged floor the two land on the same 3 and the notice snapshot agrees."
        test_recipe:
          setup: ["Reseller Acme AUTHORIZED; a 14000 MARKETPLACE listing; no exception is approved between detection and issuance."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
          trigger:
            - *NOTICE1
          assert:
            - "HTTP 201"
            - "Violation.${vio}.provisional_points == 3"
            - "Violation.${vio}.assessed_points == 3"
            - "Violation.${vio}.assessed_floor_cents == 15000"
            - "EnforcementNotice.${not1}.assessed_points == 3"
            - "EnforcementNotice.${not1}.cumulative_points_at_issue == 3"

      # --- ladder_rung_selection --------------------------------------------
      - name: ladder_first_notice_is_a_warning
        claim_type: correct_result
        grounds: ["calculations.ladder_rung_selection"]
        distinguishing_aspect: "With cumulative 3 points below suspension_points_threshold 6 the points-rung is WARNING and max_next_rung is also WARNING, so both bounds agree."
        test_recipe:
          setup: ["Reseller Acme AUTHORIZED at 0 points; violation V1 DETECTED at 3 points."]
          setup_api_calls:
