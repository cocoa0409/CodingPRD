              captures: { pj_4: $.data.id, pj_4_status: $.data.status, pj_4_scope: $.data.scope_code }
          assert:
            - "${g4_bucket} == \"TIER_LOW\" - four 200,000-cent awards total 800,000, inside both the 1,200,000 TIER_LOW cap and the 2,000,000 pool"
            - "${open_3} == 3 after three SCHEDULED projects"
            - "${cap_err} == \"ERR_CONTRACTOR_PROJECT_CAP\" with HTTP 409 - MAX_OPEN_PROJECTS_PER_CONTRACTOR is 3"
            - "${ab_status} == \"ABANDONED\" and ${open_2} == 2 - abandonment leaves the census, so the cap is a live count"
            - "${pj_4} is created with ${pj_4_status} == \"SCHEDULED\" and ${pj_4_scope} == \"CRIPPLE_WALL_BRACING\" copied from the grant"

      - name: reserve_funds_priority_between_duty_segregation_and_the_tier_cap
        claim_type: priority_ordering
        grounds:
          - validations.ERR_SOD_GRANT_REVIEWER_CONFLICT
          - validations.ERR_GRANT_TIER_CAP_EXHAUSTED
        excluded_because:
          difficulty_instance: sod_reviewer_conflict_outranks_tier_cap_exhausted_on_reserve_funds
          rationale: "That §1.8 priority_pair_validation_conflict instance already sets up a single reserve-funds call that violates both rules, asserts the priority-7 ERR_SOD_GRANT_REVIEWER_CONFLICT wins over the priority-72 ERR_GRANT_TIER_CAP_EXHAUSTED, and then repairs each violation in turn to show the loser surfacing."

      - name: claim_filing_priority_between_event_state_and_policy_state
        claim_type: priority_ordering
        grounds:
          - validations.ERR_EVENT_NOT_DECLARED
          - validations.ERR_POLICY_NOT_IN_FORCE_AT_EVENT
        excluded_because:
          difficulty_instance: event_not_declared_outranks_policy_not_in_force_at_event_on_fnol
          rationale: "That §1.8 priority_pair_validation_conflict instance already files one claim that violates both rules and asserts ERR_EVENT_NOT_DECLARED (priority 28) is returned rather than ERR_POLICY_NOT_IN_FORCE_AT_EVENT (priority 69), then fixes each side separately."

      - name: inspection_scheduling_priority_between_certification_and_calendar
        claim_type: priority_ordering
        grounds:
          - validations.ERR_CONTRACTOR_NOT_CERTIFIED
          - validations.ERR_INSPECTION_SLOT_OVERLAP
        excluded_because:
          difficulty_instance: contractor_not_certified_outranks_inspection_slot_overlap
          rationale: "That §1.8 priority_pair_validation_conflict instance already schedules one inspection that both names a SUSPENDED contractor and collides with that contractor's existing buffered window, and asserts the priority-39 ERR_CONTRACTOR_NOT_CERTIFIED is returned ahead of the priority-60 ERR_INSPECTION_SLOT_OVERLAP."

  - section: endpoints
    instances:
      - name: reinsurance_layer_create_read_update_status_and_filtered_list
        claim_type: standard_crud
        grounds:
          - endpoints.POST_/eqp/reinsurance-layers
          - endpoints.GET_/eqp/reinsurance-layers/{id}
          - endpoints.GET_/eqp/reinsurance-layers
          - endpoints.POST_/eqp/reinsurance-layers/{id}/status
        distinguishing_aspect: "The layer tower is the one entity whose whole surface is create / read / list / status-update, and the list must honour treaty_year and status together so a LAPSED 2026 layer and an ACTIVE 2025 layer both drop out of a treaty_year=2026, status=ACTIVE query."
        test_recipe:
          setup:
            - "Nothing but the layers themselves is required"
          setup_api_calls:
            - call: "POST /eqp/reinsurance-layers"
              payload: { treaty_year: 2025, layer_index: 1, attachment_point_cents: 80000000, limit_cents: 40000000, ceded_pct: 0.50 }
              as: ProgramAdmin
              captures: { old_id: $.data.id }
          trigger:
            - call: "POST /eqp/reinsurance-layers"
              payload: { treaty_year: 2026, layer_index: 1, attachment_point_cents: 100000000, limit_cents: 50000000, ceded_pct: 0.90 }
              as: ProgramAdmin
              captures: { l1: $.data.id, l1_status: $.data.status, l1_ceded: $.data.ceded_cents, l1_pct: $.data.ceded_pct, l1_v: $.data.version }
            - call: "POST /eqp/reinsurance-layers"
              payload: { treaty_year: 2026, layer_index: 2, attachment_point_cents: 150000000, limit_cents: 100000000, ceded_pct: 0.80 }
              as: ProgramAdmin
              captures: { l2: $.data.id, l2_attach: $.data.attachment_point_cents }
            - call: "GET /eqp/reinsurance-layers/${l1}"
              payload: {}
              as: ParticipatingInsurer
              captures: { r1_year: $.data.treaty_year, r1_idx: $.data.layer_index, r1_limit: $.data.limit_cents }
            - call: "GET /eqp/reinsurance-layers"
              payload: { treaty_year: 2026 }
              as: ProgramAdmin
              captures: { f1: "$.data[0].layer_index", f2: "$.data[1].layer_index" }
            - call: "POST /eqp/reinsurance-layers/${l2}/status"
              payload: { status: "LAPSED" }
              as: ProgramAdmin
              captures: { l2_status: $.data.status, l2_v: $.data.version }
            - call: "GET /eqp/reinsurance-layers"
              payload: { treaty_year: 2026, status: "ACTIVE" }
              as: ParticipatingInsurer
              captures: { g1: "$.data[0].id" }
          assert:
            - "both creates return HTTP 201 with ${l1_status} == \"ACTIVE\", ${l1_ceded} == 0, ${l1_pct} == 0.90 and ${l1_v} == 1"
            - "${l2_attach} == 150000000 is accepted because it is exactly the previous layer's 100000000 + 50000000 - no attachment gap violation"
            - "the read echoes the stored row: ${r1_year} == 2026, ${r1_idx} == 1, ${r1_limit} == 50000000"
            - "the treaty_year=2026 list has total_count == 2 with has_more false, ordered by layer_index: ${f1} == 1 and ${f2} == 2 - the 2025 layer is filtered out"
            - "${l2_status} == \"LAPSED\" and ${l2_v} == 2 - the status endpoint is the layer's only mutation and it bumps the version"
            - "the treaty_year=2026 + status=ACTIVE list has total_count == 1 with ${g1} == \"${l1}\""

      - name: insurer_compliance_action_walks_the_whole_compliance_ladder
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/eqp/insurers/{id}/compliance-action
          - state_machines.ParticipatingInsurer.compliance_status
          - state_machines.ParticipatingInsurer.status
          - validations.ERR_INSURER_NOT_SANCTIONED
          - validations.ERR_INSURER_ALREADY_WITHDRAWN
        distinguishing_aspect: "Each of the three compliance actions has its own precondition on a different dimension: SANCTION needs compliance_status UNDER_REVIEW, REINSTATE needs SANCTIONED, and WITHDRAW needs the independent status dimension to be ACTIVE - so a COMPLIANT insurer is refused a SANCTION and a WITHDRAWN insurer is refused a second WITHDRAW."
        test_recipe:
          setup:
            - "One insurer with five offers in the 2026-08 window: one ACCEPTED and four DECLINED with decline_documented true"
            - "take_up_rate_bp is therefore 2000 (1/5) on considered 5, which is below TAKE_UP_FLOOR_BP 2500 and at or above MIN_OFFER_SAMPLE 4, and undocumented_decline_count stays 0 so the sanction path cannot fire"
