            - call: "POST /vehicles/${v_id}/photos"
              payload: { photo_type: ODOMETER, image_ref: "img://od", captured_at: "2026-09-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ph_od: $.data.id }
            - call: "POST /vehicles/${v_id}/photos/${ph_front}/review"
              payload: { decision: ACCEPT }
              as: Underwriter
            - call: "POST /vehicles/${v_id}/photos/${ph_rear}/review"
              payload: { decision: ACCEPT }
              as: Underwriter
            - call: "POST /vehicles/${v_id}/photos/${ph_ds}/review"
              payload: { decision: ACCEPT }
              as: Underwriter
            - call: "POST /vehicles/${v_id}/photos/${ph_ps}/review"
              payload: { decision: ACCEPT }
              as: Underwriter
            - call: "POST /vehicles/${v_id}/photos/${ph_in}/review"
              payload: { decision: ACCEPT }
              as: Underwriter
            - call: "POST /vehicles/${v_id}/photos/${ph_en}/review"
              payload: { decision: ACCEPT }
              as: Underwriter
            - call: "POST /vehicles/${v_id}/photos/${ph_od}/review"
              payload: { decision: ACCEPT }
              as: Underwriter
            - call: "POST /vehicles/${v_id}/photos"
              payload: { photo_type: VIN_PLATE, image_ref: "img://vp", captured_at: "2026-09-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ph_vp: $.data.id }
          trigger:
            - call: "GET /vehicles/${v_id}"
              payload: {}
              as: Underwriter
              captures: { doc_before: $.data.documentation_status, cnt_before: $.data.accepted_photo_count }
            - call: "POST /vehicles/${v_id}/photos/${ph_vp}/review"
              payload: { decision: ACCEPT }
              as: Underwriter
            - call: "GET /vehicles/${v_id}"
              payload: {}
              as: Underwriter
              captures: { doc_after: $.data.documentation_status, cnt_after: $.data.accepted_photo_count }
          assert:
            - "before 8th acceptance: documentation_status == INCOMPLETE, accepted_photo_count == 7"
            - "after 8th acceptance: documentation_status == COMPLETE, accepted_photo_count == 8"
      - name: claim_reopen_after_total_loss_rejected
        claim_type: invalid_transition
        grounds: ['state_machines.Claim.PAID_to_UNDER_INVESTIGATION']
        distinguishing_aspect: "Total-loss settlements are final: reopen from PAID with settlement_variant TOTAL_LOSS fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE policy; claim settled as TOTAL_LOSS (declared by adj-1, settled by adj-2)"]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Xiu", email: "xiu@x.com", has_daily_driver: true, driving_record_status: CLEAN }
