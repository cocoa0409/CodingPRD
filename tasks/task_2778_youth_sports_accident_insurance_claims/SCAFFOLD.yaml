# ============================================================================
# SCAFFOLD.yaml — Youth Sports Accident Insurance Claims
# Sections §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml
# and corner design in SCAFFOLD_CORNER_DESIGN.yaml.
# ============================================================================

scenario: |
  2778. Youth Sports Accident Insurance Claims (youth sports accident insurance program):
  league policy enrollment with participant counts, sport classification and coverage limits,
  coverage structure as excess over other insurance with deductible and benefit schedules,
  injury report submission with league official verification and timeline requirements,
  claim adjudication against covered activities including practices, games and sanctioned travel,
  coordination with family health insurance and explanation of benefits collection,
  provider billing, allowed amount determination and balance protection for families,
  catastrophic injury coverage layers and lifetime benefit provisions,
  loss experience and premium adjustment at renewal by league

domain_name: youth-sports-accident-insurance-claims

# Resources are mounted flat at the API root: "/leagues", "/league-policies",
# "/claims", "/provider-bills", ... There is no nesting of collections in URL
# paths; peer entities are joined by explicit foreign keys and reached through
# filtered list endpoints (see §1.5).
api_prefix: "/"

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: graph
  # Participant <-> LeaguePolicy is a true many-to-many through Enrollment; a
  # single Participant can be enrolled under several sport policies at once, and
  # SanctionedActivity conflict detection must traverse Participant -> Enrollment
  # -> LeaguePolicy -> SanctionedActivity across policy boundaries.
  # CoordinationRecord.superseded_by_record_id is self-referential.

  state_machine_shape: parallel
  # Claim carries two independent state axes on one row:
  #   adjudication_status (PENDING_COORDINATION -> UNDER_ADJUDICATION -> APPROVED
  #                        -> PAID | DENIED | WITHDRAWN, with PAID -> APPROVED reopen)
  #   coordination_status (NOT_STARTED -> EOB_REQUESTED -> EOB_RECEIVED | EOB_WAIVED,
  #                        NOT_STARTED -> NO_OTHER_COVERAGE_CONFIRMED)
  # InjuryReport is cyclic (PENDING_VERIFICATION <-> RETURNED_FOR_CORRECTION);
  # LeaguePolicy.status is linear but its coverage_posture is a compound field
  # derived from the aggregate state of its Claims and its League.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # Peer ownership across six roles (carrier program staff vs league staff vs
  # field officials vs claims staff vs medical review vs family portal), plus a
  # hard segregation rule: the LeagueOfficial who sanctioned an activity may not
  # be the LeagueOfficial who verifies an injury report arising from it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

global_constants:
  LOGICAL_CLOCK_DEFAULT_UTC: "2026-08-01T00:00:00Z"
  PREMIUM_BAND_1_CAP: 75
  PREMIUM_BAND_2_CAP: 400
  PREMIUM_BAND_1_FACTOR: 1.0000
  PREMIUM_BAND_2_FACTOR: 0.9250
  PREMIUM_BAND_3_FACTOR: 0.8500
  HAZARD_LOAD_BPS: { CLASS_1_LOW: 0, CLASS_2_MODERATE: 1150, CLASS_3_HIGH: 2625, CLASS_4_CONTACT: 4075 }
  CAT_LAYER_RATE_BPS: 850
  VOLUME_CREDIT_TIERS_BPS: "subtotal <  500000 -> 0 | 500000..1499999 -> 300 | 1500000..4999999 -> 550 | >= 5000000 -> 800"
  MIN_ANNUAL_PREMIUM_CENTS: 25000
  OON_FEE_SCHEDULE_MULTIPLIER_BPS: 14000
  OON_FAMILY_SHARE_CAP_CENTS: 15000
  SEVERITY_CAP_FACTOR_BPS: { MINOR: 10000, MODERATE: 10000, SEVERE: 11500, CATASTROPHIC: 12500 }
  FULL_EXCESS_DEDUCTIBLE_FACTOR_BPS: 20000
  RESERVE_BY_SEVERITY_CENTS: { MINOR: 50000, MODERATE: 250000, SEVERE: 1500000, CATASTROPHIC: 7500000 }
  EXPERIENCE_TIER_BANDS_BPS: "ratio < 3500 -> PREFERRED | 3500..6499 -> STANDARD | 6500..9999 -> ADVERSE | >= 10000 -> DECLINE"
  EXPERIENCE_MODIFIER_BPS: { PREFERRED: -1500, STANDARD: 0, ADVERSE: 2750, DECLINE: 6000 }
  FILING_WINDOW_DAYS: 90
  VERIFICATION_WINDOW_DAYS: 30
  EOB_WINDOW_DAYS: 45
  MAX_CORRECTION_ROUNDS: 2
  POSTURE_CLAIMS_REVIEW_OPEN_CLAIMS: 3
  POSTURE_CLAIMS_REVIEW_LOSS_RATIO_BPS: 6500
  COVERED_ACTIVITY_TYPES: [PRACTICE, GAME, SANCTIONED_TRAVEL, TRYOUT]
  MONEY_ROUNDING: "all money is integer cents; every intermediate division/multiplication rounds half-up to whole cents at the point named by the formula"

# ============================================================================
# §1.1 Entity-Relationship Table
# ============================================================================
entities:

  - name: League
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: legal name of the youth sports league
      - name: league_code
        type: string
        source: input
        description: short operator-assigned code for the league
        constraints: "unique across all League rows; 3-16 chars, uppercase letters/digits/hyphen"
      - name: state_code
        type: string
        source: input
        description: two-letter US state code where the league operates
        constraints: "exactly 2 uppercase letters"
      - name: governing_body_code
        type: string
        source: input
        description: code of the national governing body that sanctions the league
      - name: contact_email
        type: string
        source: input
        description: league administrator contact email
      - name: sanctioning_status
        type: enum
        source: input
        description: whether the governing body currently sanctions this league
        default: SANCTIONED
        constraints: "one of {SANCTIONED, PROBATION, SUSPENDED}; SANCTIONED at create, PROBATION/SUSPENDED written only by POST /leagues/{id}/sanctioning-status"
      - name: in_force_policy_count
        type: integer
        source: computed
        description: "count of LeaguePolicy rows with league_id == this League.id and status IN {BOUND, ACTIVE, RUN_OFF}"

  - name: SportClassification
    parent: null
    common_fields: true
    fields:
      - name: sport_code
        type: string
        source: input
        description: operator-assigned code identifying the sport/age band
        constraints: "unique across all SportClassification rows"
      - name: sport_name
        type: string
        source: input
        description: human-readable sport and age band
      - name: hazard_class
        type: enum
        source: input
        description: underwriting hazard class of the sport
        constraints: "one of {CLASS_1_LOW, CLASS_2_MODERATE, CLASS_3_HIGH, CLASS_4_CONTACT}"
      - name: base_rate_per_participant_cents
        type: integer
        source: input
        description: manual annual rate per participant before banding and hazard load
        constraints: ">= 1"
      - name: deductible_cents
        type: integer
        source: input
        description: per-claim deductible applied when the program pays excess of other insurance
        constraints: ">= 0"
      - name: per_injury_limit_cents
        type: integer
        source: input
        description: base-layer maximum benefit payable for one injury
        constraints: ">= 1"
      - name: cat_attachment_point_cents
        type: integer
        source: input
        description: benefit amount above which the catastrophic layer attaches; may exceed per_injury_limit_cents, in which case the corridor between the two is uninsured
        constraints: ">= per_injury_limit_cents"
      - name: aggregate_limit_cents
        type: integer
        source: input
        description: policy-term aggregate incurred-loss ceiling for one LeaguePolicy
        constraints: ">= per_injury_limit_cents"
      - name: cat_lifetime_max_cents
        type: integer
        source: input
        description: lifetime catastrophic-layer maximum per Enrollment
        constraints: ">= 0"
      - name: minimum_participants
        type: integer
        source: input
        description: minimum declared participant count the program will write for this sport
        constraints: ">= 1"
      - name: travel_buffer_minutes
        type: integer
        source: input
        description: default travel buffer applied on both sides of an activity window when detecting participant activity conflicts
        constraints: ">= 0"
      - name: service_category_caps
        type: object
        source: input
        description: "benefit schedule: mapping from service_category enum member to the maximum allowed amount in cents for that category"
        constraints: "keys MUST be a subset of {EMERGENCY_ROOM, SURGERY, DIAGNOSTIC_IMAGING, PHYSICAL_THERAPY, DENTAL, AMBULANCE, PHYSICIAN_OFFICE}; every value an integer >= 0; a service_category absent from this map is not scheduled"
      - name: hazard_load_bps
        type: integer
        source: computed
        description: "HAZARD_LOAD_BPS[hazard_class]; echoed for readability"

  - name: LeaguePolicy
    parent: null
    common_fields: true
    fields:
      - name: league_id
        type: string
        source: input
        description: "FK -> League.id; the league that holds this policy term"
      - name: sport_classification_id
        type: string
        source: input
        description: "FK -> SportClassification.id; fixes the rating basis and every coverage limit for this term"
      - name: term_effective_date
        type: datetime
        source: input
        description: inclusive start of the policy term (ISO 8601 UTC instant)
      - name: term_expiration_date
        type: datetime
        source: input
        description: exclusive end of the policy term; the term is the half-open interval [term_effective_date, term_expiration_date)
      - name: enrolled_participant_count
        type: integer
        source: input
        description: declared participant count used for rating; independent of the number of Enrollment rows
        constraints: ">= 1"
      - name: coverage_basis_election
        type: enum
        source: input
        description: whether the league is permitted to run a claim on a full-excess (program-primary) basis when no family coverage exists
        default: EXCESS_ONLY
        constraints: "one of {EXCESS_ONLY, FULL_EXCESS_PERMITTED}"
      - name: cat_layer_elected
        type: boolean
        source: input
        description: whether the catastrophic excess layer is purchased for this term
        default: false
      - name: status
        type: enum
        source: system
        description: policy lifecycle state
        default: QUOTED
        constraints: "one of {QUOTED, BOUND, ACTIVE, RUN_OFF, CLOSED, CANCELLED}"
      - name: coverage_posture
        type: enum
        source: computed
        description: derived operating posture recomputed on every change to this policy, its League, or any of its Claims; gates child creation and payment issuance
        constraints: "one of {OPEN, CLAIMS_REVIEW, FROZEN}"
      - name: cancel_reason
        type: string
        source: system
        description: free-text reason captured by POST /league-policies/{id}/cancel; null otherwise
      - name: gross_premium_cents
        type: integer
        source: computed
        description: sum of the per-band premium line items (each rounded half-up before summation) per calculations.policy_gross_premium_banded
      - name: cat_layer_charge_cents
        type: integer
        source: computed
        description: catastrophic layer charge; 0 when cat_layer_elected is false
      - name: premium_subtotal_cents
        type: integer
        source: computed
        description: gross_premium_cents + cat_layer_charge_cents; the value the volume-credit tier is keyed on
      - name: volume_credit_bps
        type: integer
        source: computed
        description: volume credit basis points selected from VOLUME_CREDIT_TIERS_BPS using premium_subtotal_cents
      - name: volume_credit_cents
        type: integer
        source: computed
        description: premium_subtotal_cents * volume_credit_bps / 10000, rounded half-up
      - name: annual_premium_cents
        type: integer
        source: computed
        description: final term premium after volume credit and the MIN_ANNUAL_PREMIUM_CENTS floor; also the earned-premium denominator for loss experience
      - name: deductible_cents
        type: integer
        source: computed
        description: mirror of the linked SportClassification.deductible_cents
      - name: per_injury_limit_cents
        type: integer
        source: computed
        description: mirror of the linked SportClassification.per_injury_limit_cents
      - name: cat_attachment_point_cents
        type: integer
        source: computed
        description: mirror of the linked SportClassification.cat_attachment_point_cents
      - name: aggregate_limit_cents
        type: integer
        source: computed
        description: mirror of the linked SportClassification.aggregate_limit_cents
      - name: cat_lifetime_max_cents
        type: integer
        source: computed
        description: mirror of the linked SportClassification.cat_lifetime_max_cents
      - name: paid_loss_cents
        type: integer
        source: computed
        description: sum of BenefitPayment.amount_cents with status == ISSUED over every Claim whose league_policy_id == this policy
      - name: reserve_cents
        type: integer
        source: computed
        description: "sum of Claim.reserve_amount_cents over Claims of this policy whose adjudication_status IN {PENDING_COORDINATION, UNDER_ADJUDICATION, APPROVED}"
      - name: incurred_loss_cents
        type: integer
        source: computed
        description: paid_loss_cents + reserve_cents
      - name: open_claim_count
        type: integer
        source: computed
        description: "count of Claims of this policy whose adjudication_status IN {PENDING_COORDINATION, UNDER_ADJUDICATION, APPROVED}"
      - name: incurred_loss_ratio_bps
        type: integer
        source: computed
        description: incurred_loss_cents * 10000 / annual_premium_cents, rounded half-up
      - name: paid_loss_ratio_bps
        type: integer
        source: computed
        description: paid_loss_cents * 10000 / annual_premium_cents, rounded half-up
      - name: experience_tier
        type: enum
        source: computed
        description: tier selected from EXPERIENCE_TIER_BANDS_BPS using incurred_loss_ratio_bps
        constraints: "one of {PREFERRED, STANDARD, ADVERSE, DECLINE}"
      - name: renewal_quote_status
        type: enum
        source: system
        description: renewal-quote lifecycle on this policy
        default: NONE
        constraints: "one of {NONE, QUOTED, ACCEPTED}"
      - name: renewal_loss_experience_basis
        type: enum
        source: system
        description: loss basis elected at quote time; drives which loss ratio variant sets the experience modifier
        constraints: "null until quoted, then one of {INCURRED, PAID_ONLY}"
      - name: renewal_quote_effective_date
        type: datetime
        source: system
        description: effective date of the renewal term being quoted; null until quoted
      - name: renewal_enrolled_participant_count
        type: integer
        source: system
        description: declared participant count for the renewal term; null until quoted
      - name: renewal_loss_ratio_bps
        type: integer
        source: computed
        description: the loss ratio under renewal_loss_experience_basis, frozen at quote time; null until quoted
      - name: renewal_experience_tier
        type: enum
        source: computed
        description: tier derived from renewal_loss_ratio_bps; null until quoted
        constraints: "one of {PREFERRED, STANDARD, ADVERSE, DECLINE}"
      - name: renewal_experience_modifier_bps
        type: integer
        source: computed
        description: EXPERIENCE_MODIFIER_BPS[renewal_experience_tier]; null until quoted
      - name: renewal_base_premium_cents
        type: integer
        source: computed
        description: annual premium recomputed from scratch on renewal_enrolled_participant_count before the experience modifier; null until quoted
      - name: renewal_quoted_premium_cents
        type: integer
        source: computed
        description: final quoted renewal premium after the experience modifier and the MIN_ANNUAL_PREMIUM_CENTS floor; null until quoted

  - name: Participant
    parent: null
    common_fields: true
    fields:
      - name: league_id
        type: string
        source: input
        description: "FK -> League.id; the league whose roster carries this athlete"
      - name: first_name
        type: string
        source: input
        description: athlete given name
      - name: last_name
        type: string
        source: input
        description: athlete family name
      - name: date_of_birth
        type: datetime
        source: input
        description: athlete date of birth as an ISO 8601 UTC instant at 00:00:00Z
      - name: guardian_email
        type: string
        source: input
        description: parent/guardian email of record
      - name: guardian_phone
        type: string
        source: input
        description: parent/guardian phone; optional
      - name: roster_status
        type: enum
        source: computed
        description: "ROSTERED while at least one Enrollment of this Participant has status == ENROLLED; INACTIVE once every Enrollment is WITHDRAWN; ROSTERED (initial) when the Participant has no Enrollment rows yet"
        constraints: "one of {ROSTERED, INACTIVE}"
      - name: enrolled_policy_count
        type: integer
        source: computed
        description: count of Enrollment rows for this Participant with status == ENROLLED

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id"
      - name: league_policy_id
        type: string
        source: input
        description: "FK -> LeaguePolicy.id; the sport policy this athlete is covered under"
      - name: enrolled_on_date
        type: datetime
        source: input
        description: date the athlete joined this policy's roster; must fall inside the policy's half-open term
      - name: status
        type: enum
        source: system
        description: enrollment lifecycle
        default: ENROLLED
        constraints: "one of {ENROLLED, WITHDRAWN}"
      - name: withdrawn_on_date
        type: datetime
        source: system
        description: logical-clock instant at which POST /enrollments/{id}/withdraw ran; null while ENROLLED
      - name: lifetime_cat_benefit_used_cents
        type: integer
        source: computed
        description: sum of BenefitPayment.amount_cents with layer == CATASTROPHIC and status == ISSUED across every Claim whose enrollment_id == this Enrollment
        default: 0
      - name: coverage_status
        type: enum
        source: computed
        description: "WITHDRAWN_NO_COVERAGE when status == WITHDRAWN; else LIFETIME_EXHAUSTED when lifetime_cat_benefit_used_cents >= LeaguePolicy.cat_lifetime_max_cents; else COVERED"
        constraints: "one of {COVERED, LIFETIME_EXHAUSTED, WITHDRAWN_NO_COVERAGE}"

  - name: FamilyHealthPlan
    parent: null
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the athlete this family health coverage belongs to"
      - name: carrier_name
        type: string
        source: input
        description: family health insurance carrier name
      - name: policy_number
        type: string
        source: input
        description: family health plan policy number
      - name: plan_type
        type: enum
        source: input
        description: family plan type
        constraints: "one of {HMO, PPO, HDHP, MEDICAID, TRICARE}"
      - name: individual_deductible_cents
        type: integer
        source: input
        description: the family plan's own individual deductible, recorded for file completeness
        constraints: ">= 0"
      - name: coinsurance_bps
        type: integer
        source: input
        description: the family plan's coinsurance share in basis points, recorded for file completeness
        constraints: "0..10000"
      - name: effective_date
        type: datetime
        source: input
        description: inclusive start of the family plan's coverage
      - name: termination_date
        type: datetime
        source: input
        description: exclusive end of the family plan's coverage; null means open-ended
      - name: coverage_state
        type: enum
        source: computed
        description: "ACTIVE when effective_date <= logical clock AND (termination_date is null OR logical clock < termination_date); TERMINATED otherwise"
        constraints: "one of {ACTIVE, TERMINATED}"
      - name: verification_status
        type: enum
        source: system
        description: whether a claims examiner has verified the coverage with the carrier
        default: UNVERIFIED
        constraints: "one of {UNVERIFIED, VERIFIED, NO_COVERAGE_ATTESTED}"
      - name: verified_at
        type: datetime
        source: system
        description: logical-clock instant of the verify call; null while UNVERIFIED
      - name: verified_by_user_id
        type: string
        source: system
        description: X-User-ID of the ClaimsExaminer who verified; null while UNVERIFIED

  - name: SanctionedActivity
    parent: null
    common_fields: true
    fields:
      - name: league_policy_id
        type: string
        source: input
        description: "FK -> LeaguePolicy.id; the policy whose roster attends this activity"
      - name: activity_type
        type: enum
        source: input
        description: kind of team activity
        constraints: "one of {PRACTICE, GAME, SANCTIONED_TRAVEL, TRYOUT, TEAM_SOCIAL}"
      - name: venue_name
        type: string
        source: input
        description: venue or travel description
      - name: starts_at
        type: datetime
        source: input
        description: inclusive start of the activity window
      - name: ends_at
        type: datetime
        source: input
        description: inclusive end of the activity window; the activity occupies the CLOSED interval [starts_at, ends_at]
      - name: travel_buffer_minutes
        type: integer
        source: input
        description: buffer applied on both sides of the closed window for conflict detection; defaults to the linked SportClassification.travel_buffer_minutes when omitted
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: sanctioning lifecycle
        default: PENDING_SANCTION
        constraints: "one of {PENDING_SANCTION, SANCTIONED, REJECTED}"
      - name: sanctioning_official_id
        type: string
        source: system
        description: X-User-ID of the LeagueOfficial whose sanction-decision set status to SANCTIONED; null otherwise
      - name: rejection_reason
        type: enum
        source: system
        description: why the activity ended REJECTED; null otherwise
        constraints: "one of {OFFICIAL_DECLINED, POLICY_FROZEN}"
      - name: is_covered_activity
        type: boolean
        source: computed
        description: true when activity_type is a member of COVERED_ACTIVITY_TYPES (that is, every type except TEAM_SOCIAL)

  - name: InjuryReport
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the covered athlete-policy pairing the injury is reported under"
      - name: sanctioned_activity_id
        type: string
        source: input
        description: "FK -> SanctionedActivity.id; the activity during which the injury occurred"
      - name: injury_datetime
        type: datetime
        source: input
        description: instant of injury; must fall inside the activity's closed window
      - name: body_part
        type: enum
        source: input
        description: injured body region
        constraints: "one of {HEAD_NECK, SHOULDER_ARM, HAND_WRIST, TORSO, HIP_GROIN, KNEE, ANKLE_FOOT, DENTAL, OTHER}"
      - name: injury_description
        type: string
        source: input
        description: narrative description of the mechanism of injury
      - name: severity_tier
        type: enum
        source: input
        description: severity classification driving the benefit-schedule severity factor and the claim reserve
        constraints: "one of {MINOR, MODERATE, SEVERE, CATASTROPHIC}"
      - name: reported_on_date
        type: datetime
        source: system
        description: logical-clock instant at which the report was created, truncated to 00:00:00Z of that UTC calendar date
      - name: days_to_report
        type: integer
        source: computed
        description: whole UTC calendar days from the injury_datetime date to reported_on_date, per calculations.injury_report_timeliness
      - name: status
        type: enum
        source: system
        description: verification lifecycle
        default: PENDING_VERIFICATION
        constraints: "one of {PENDING_VERIFICATION, RETURNED_FOR_CORRECTION, VERIFIED, REJECTED}"
      - name: correction_round_count
        type: integer
        source: system
        description: number of times a LeagueOfficial has returned this report for correction
        default: 0
      - name: correction_note
        type: string
        source: system
        description: most recent correction note from the returning official; null when never returned
      - name: verifying_official_id
        type: string
        source: system
        description: X-User-ID of the LeagueOfficial who issued the verification decision; null before decision
      - name: verified_at
        type: datetime
        source: system
        description: logical-clock instant of the VERIFY decision; null unless VERIFIED
      - name: official_attestation
        type: string
        source: system
        description: attestation text supplied with the VERIFY decision; null unless VERIFIED
      - name: rejection_reason
        type: enum
        source: system
        description: why the report ended REJECTED; null otherwise
        constraints: "one of {OFFICIAL_DECLINED, LIFETIME_BENEFIT_EXHAUSTED, ACTIVITY_NOT_SANCTIONED}"

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - name: injury_report_id
        type: string
        source: system
        description: "FK -> InjuryReport.id; the verified report this claim was opened from"
      - name: league_policy_id
        type: string
        source: system
        description: "FK -> LeaguePolicy.id; copied from the report's Enrollment at claim creation"
      - name: enrollment_id
        type: string
        source: system
        description: "FK -> Enrollment.id; copied from the report at claim creation, so lifetime catastrophic accumulation is addressable without traversing InjuryReport"
      - name: adjudication_status
        type: enum
        source: system
        description: adjudication axis; evolves independently of coordination_status on the same row
        default: PENDING_COORDINATION
        constraints: "one of {PENDING_COORDINATION, UNDER_ADJUDICATION, APPROVED, PAID, DENIED, WITHDRAWN}"
      - name: coordination_status
        type: enum
        source: system
        description: family-health-insurance coordination axis; evolves independently of adjudication_status on the same row
        default: NOT_STARTED
        constraints: "one of {NOT_STARTED, EOB_REQUESTED, EOB_RECEIVED, NO_OTHER_COVERAGE_CONFIRMED, EOB_WAIVED}"
      - name: eob_requested_at
        type: datetime
        source: system
        description: logical-clock instant of POST /claims/{id}/request-eob; the EOB_WINDOW_DAYS auto-waiver clock starts here; null before request
      - name: coordination_basis
        type: enum
        source: computed
        description: "FULL_EXCESS when coordination_status == NO_OTHER_COVERAGE_CONFIRMED; EXCESS_OF_OTHER when coordination_status IN {EOB_RECEIVED, EOB_WAIVED}; null while coordination_status IN {NOT_STARTED, EOB_REQUESTED}"
        constraints: "one of {EXCESS_OF_OTHER, FULL_EXCESS}"
      - name: reserve_amount_cents
        type: integer
        source: computed
        description: case reserve set at claim creation and re-set whenever the report's severity_tier changes, per calculations.claim_reserve_amount
      - name: allowed_amount_total_cents
        type: integer
        source: computed
        description: sum of ProviderBill.allowed_amount_cents over this claim's bills with status IN {REPRICED, ADJUDICATED}
      - name: other_insurance_paid_cents
        type: integer
        source: computed
        description: sum of CoordinationRecord.other_plan_paid_cents with status == ACTIVE whose provider_bill_id is one of this claim's bills with status IN {REPRICED, ADJUDICATED}
      - name: deductible_applied_cents
        type: integer
        source: computed
        description: deductible actually absorbed on this claim; depends on coordination_basis per calculations.claim_benefit_determination
      - name: benefit_before_limit_cents
        type: integer
        source: computed
        description: allowed net of other insurance and deductible, before any layer limit is applied
      - name: base_layer_benefit_cents
        type: integer
        source: computed
        description: portion of benefit_before_limit_cents payable from the base layer, capped at LeaguePolicy.per_injury_limit_cents
      - name: cat_layer_benefit_cents
        type: integer
        source: computed
        description: portion payable from the catastrophic layer; 0 unless the layer is elected and this claim is CERTIFIED
      - name: benefit_payable_cents
        type: integer
        source: computed
        description: base_layer_benefit_cents + cat_layer_benefit_cents
      - name: paid_base_cents
        type: integer
        source: computed
        description: sum of BenefitPayment.amount_cents with layer == BASE and status == ISSUED on this claim
      - name: paid_cat_cents
        type: integer
        source: computed
        description: sum of BenefitPayment.amount_cents with layer == CATASTROPHIC and status == ISSUED on this claim
      - name: paid_to_date_cents
        type: integer
        source: computed
        description: paid_base_cents + paid_cat_cents
      - name: balance_billed_total_cents
        type: integer
        source: computed
        description: sum of ProviderBill.balance_billed_cents over this claim's bills with status IN {REPRICED, ADJUDICATED}
      - name: family_responsibility_total_cents
        type: integer
        source: computed
        description: sum of ProviderBill.family_responsibility_cents over this claim's bills with status IN {REPRICED, ADJUDICATED}; the balance-protection figure disclosed to the family
      - name: cat_certification_status
        type: enum
        source: system
        description: catastrophic medical-review certification state for this claim
        default: NONE
        constraints: "one of {NONE, CERTIFIED, REVOKED}"
      - name: cat_certified_at
        type: datetime
        source: system
        description: logical-clock instant of certification; null unless certified at least once
      - name: cat_certified_by_user_id
        type: string
        source: system
        description: X-User-ID of the MedicalReviewer who certified; null unless certified
      - name: cat_certification_note
        type: string
        source: system
        description: medical reviewer note; null unless certified
      - name: cat_revocation_reason
        type: string
        source: system
        description: free-text reason captured by POST /claims/{id}/cat-certification-revocation; null unless revoked
      - name: adjudicated_at
        type: datetime
        source: system
        description: logical-clock instant at which adjudication produced APPROVED or DENIED; null before
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: X-User-ID of the ClaimsExaminer who adjudicated; null before
      - name: denial_reason
        type: enum
        source: system
        description: why adjudication branched to DENIED; null otherwise
        constraints: "one of {NO_BENEFIT_PAYABLE, ENROLLMENT_WITHDRAWN}"
      - name: withdrawal_reason
        type: string
        source: system
        description: free-text reason captured by POST /claims/{id}/withdraw; null otherwise

  - name: ProviderBill
    parent: null
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: "FK -> Claim.id; the claim this provider charge belongs to"
      - name: provider_npi
        type: string
        source: input
        description: national provider identifier of the billing provider
        constraints: "exactly 10 digits"
      - name: provider_name
        type: string
        source: input
        description: billing provider name
      - name: network_status
        type: enum
        source: input
        description: whether the provider participates in the program network
        constraints: "one of {IN_NETWORK, OUT_OF_NETWORK}"
      - name: service_category
        type: enum
        source: input
        description: benefit-schedule service category of the charge
        constraints: "one of {EMERGENCY_ROOM, SURGERY, DIAGNOSTIC_IMAGING, PHYSICAL_THERAPY, DENTAL, AMBULANCE, PHYSICIAN_OFFICE}"
      - name: service_date
        type: datetime
        source: input
        description: date of service; must fall inside the policy's half-open term
      - name: billed_charge_cents
        type: integer
        source: input
        description: gross amount the provider billed
        constraints: ">= 1"
      - name: fee_schedule_amount_cents
        type: integer
        source: input
        description: program fee-schedule amount for this service
        constraints: ">= 0"
      - name: negotiated_amount_cents
        type: integer
        source: computed
        description: network-dependent negotiated amount computed at reprice, per calculations.provider_bill_allowed_amount
      - name: scheduled_cap_cents
        type: integer
        source: computed
        description: severity-adjusted benefit-schedule cap for this service_category, computed at reprice
      - name: allowed_amount_cents
        type: integer
        source: computed
        description: final allowed amount; 0 until repriced
        default: 0
      - name: balance_billed_cents
        type: integer
        source: computed
        description: billed_charge_cents - allowed_amount_cents, floored at 0
      - name: family_responsibility_cents
        type: integer
        source: computed
        description: the family's protected share of the balance; always 0 in network, capped at OON_FAMILY_SHARE_CAP_CENTS out of network
      - name: other_plan_paid_cents
        type: integer
        source: computed
        description: sum of CoordinationRecord.other_plan_paid_cents with status == ACTIVE and provider_bill_id == this bill
      - name: status
        type: enum
        source: system
        description: bill lifecycle
        default: SUBMITTED
        constraints: "one of {SUBMITTED, REPRICED, ADJUDICATED, DENIED, VOIDED}"
      - name: repriced_at
        type: datetime
        source: system
        description: logical-clock instant of reprice; null while SUBMITTED
      - name: repriced_by_user_id
        type: string
        source: system
        description: X-User-ID of the ClaimsExaminer who repriced; null while SUBMITTED
      - name: void_reason
        type: string
        source: system
        description: free-text reason captured by POST /provider-bills/{id}/void; null otherwise

  - name: CoordinationRecord
    parent: null
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: "FK -> Claim.id; the claim whose coordination file this explanation-of-benefits belongs to"
      - name: provider_bill_id
        type: string
        source: input
        description: "FK -> ProviderBill.id; the specific charge the family plan adjudicated"
      - name: family_health_plan_id
        type: string
        source: input
        description: "FK -> FamilyHealthPlan.id; the family plan that issued this explanation of benefits"
      - name: eob_received_date
        type: datetime
        source: input
        description: date the explanation of benefits was received by the program
      - name: other_plan_allowed_cents
        type: integer
        source: input
        description: amount the family plan allowed
        constraints: ">= 0"
      - name: other_plan_paid_cents
        type: integer
        source: input
        description: amount the family plan actually paid
        constraints: ">= 0 and <= other_plan_allowed_cents"
      - name: patient_responsibility_cents
        type: integer
        source: input
        description: amount the family plan assigned to the patient
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: whether this record is the operative explanation of benefits for its (provider_bill_id, family_health_plan_id) pair
        default: ACTIVE
        constraints: "one of {ACTIVE, SUPERSEDED}"
      - name: superseded_by_record_id
        type: string
        source: system
        description: "FK -> CoordinationRecord.id; set on the prior ACTIVE record for the same (provider_bill_id, family_health_plan_id) pair when a corrected explanation of benefits is filed; null while ACTIVE"

  - name: BenefitPayment
    parent: null
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: "FK -> Claim.id; the claim this benefit dollar is drawn against"
      - name: provider_bill_id
        type: string
        source: input
        description: "FK -> ProviderBill.id; the charge being satisfied"
      - name: payee_type
        type: enum
        source: input
        description: who receives the payment
        constraints: "one of {PROVIDER, FAMILY_REIMBURSEMENT}"
      - name: layer
        type: enum
        source: input
        description: which coverage layer the dollars are drawn from; catastrophic-layer dollars accumulate against the Enrollment lifetime maximum
        constraints: "one of {BASE, CATASTROPHIC}"
      - name: amount_cents
        type: integer
        source: input
        description: payment amount
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: payment lifecycle
        default: ISSUED
        constraints: "one of {ISSUED, VOIDED}"
      - name: issued_at
        type: datetime
        source: system
        description: logical-clock instant of issuance
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the ClaimsExaminer who issued the payment
      - name: void_reason
        type: string
        source: system
        description: free-text reason captured by POST /benefit-payments/{id}/void; null while ISSUED
      - name: voided_at
        type: datetime
        source: system
        description: logical-clock instant of the void; null while ISSUED

# ============================================================================
# §1.2 State Machine Table
# ============================================================================
state_machines:

  - entity: League
    initial_state: SANCTIONED
    terminal_states: []
    note: "the state field is League.sanctioning_status; there is no separate League.status"
    transitions:
      - from: SANCTIONED
        to: PROBATION
        trigger: "POST /leagues/{league_id}/sanctioning-status with sanctioning_status=PROBATION"
        actor: ProgramAdministrator
        preconditions: ["sanctioning_status == SANCTIONED"]
        side_effects: ["recomputes coverage_posture on every LeaguePolicy of this league (PROBATION alone does not force FROZEN)"]
      - from: SANCTIONED
        to: SUSPENDED
        trigger: "POST /leagues/{league_id}/sanctioning-status with sanctioning_status=SUSPENDED"
        actor: ProgramAdministrator
        preconditions: ["sanctioning_status == SANCTIONED"]
        side_effects:
          - "CASCADE D link 2: every LeaguePolicy of this league recomputes coverage_posture, which becomes FROZEN because the holding League is SUSPENDED"
          - "CASCADE D link 3: caused by link 2 alone — for every LeaguePolicy that just became FROZEN, each of its SanctionedActivity rows with status == PENDING_SANCTION transitions to REJECTED with rejection_reason = POLICY_FROZEN"
          - "CASCADE D link 4: caused by link 3 alone — each InjuryReport whose sanctioned_activity_id points at an activity that just became REJECTED and whose own status IN {PENDING_VERIFICATION, RETURNED_FOR_CORRECTION} transitions to REJECTED with rejection_reason = ACTIVITY_NOT_SANCTIONED"
      - from: PROBATION
        to: SUSPENDED
        trigger: "POST /leagues/{league_id}/sanctioning-status with sanctioning_status=SUSPENDED"
        actor: ProgramAdministrator
        preconditions: ["sanctioning_status == PROBATION"]
        side_effects: ["identical cascade to the SANCTIONED -> SUSPENDED transition (links 2, 3, 4)"]
      - from: PROBATION
        to: SANCTIONED
        trigger: "POST /leagues/{league_id}/sanctioning-status with sanctioning_status=SANCTIONED"
        actor: ProgramAdministrator
        preconditions: ["sanctioning_status == PROBATION"]
        side_effects: ["recomputes coverage_posture on every LeaguePolicy of this league"]
      - from: SUSPENDED
        to: SANCTIONED
        trigger: "POST /leagues/{league_id}/sanctioning-status with sanctioning_status=SANCTIONED"
        actor: ProgramAdministrator
        preconditions: ["sanctioning_status == SUSPENDED"]
        side_effects:
          - "recomputes coverage_posture on every LeaguePolicy of this league; a policy leaves FROZEN unless its own incurred_loss_cents >= aggregate_limit_cents"
          - "already-REJECTED SanctionedActivity and InjuryReport rows are NOT revived; reinstatement is forward-only"

  - entity: LeaguePolicy
    initial_state: QUOTED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: QUOTED
        to: BOUND
        trigger: "POST /league-policies/{league_policy_id}/bind"
        actor: ProgramAdministrator
        preconditions:
          - "status == QUOTED"
          - "League.sanctioning_status == SANCTIONED"
          - "enrolled_participant_count >= SportClassification.minimum_participants"
          - "no other LeaguePolicy with the same (league_id, sport_classification_id) and status IN {BOUND, ACTIVE, RUN_OFF} whose half-open term intersects this policy's half-open term"
        side_effects:
          - "recomputes gross_premium_cents, cat_layer_charge_cents, premium_subtotal_cents, volume_credit_bps, volume_credit_cents, annual_premium_cents"
          - "increments League.in_force_policy_count by 1"
          - "recomputes coverage_posture"
      - from: BOUND
        to: ACTIVE
        trigger: "POST /league-policies/{league_policy_id}/activate"
        actor: ProgramAdministrator
        preconditions:
          - "status == BOUND"
          - "logical clock >= term_effective_date"
        side_effects: ["recomputes coverage_posture"]
      - from: ACTIVE
        to: RUN_OFF
        trigger: "POST /league-policies/{league_policy_id}/run-off"
        actor: ProgramAdministrator
        preconditions:
          - "status == ACTIVE"
          - "logical clock >= term_expiration_date"
        side_effects:
          - "no new Enrollment, SanctionedActivity or InjuryReport may be created under this policy; existing Claims continue to adjudicate and pay"
          - "if open_claim_count == 0 at this instant, the system RUN_OFF -> CLOSED transition fires in the same request"
      - from: RUN_OFF
        to: CLOSED
        trigger: "system: re-evaluated at the end of every write that changes this policy's open_claim_count, and at RUN_OFF entry"
        actor: system
        preconditions:
          - "status == RUN_OFF"
          - "open_claim_count == 0"
        side_effects:
          - "decrements League.in_force_policy_count by 1"
          - "coverage_posture becomes FROZEN (a CLOSED policy accepts no further child writes)"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /league-policies/{league_policy_id}/cancel"
        actor: ProgramAdministrator
        preconditions: ["status == QUOTED"]
        side_effects: ["sets cancel_reason", "coverage_posture becomes FROZEN"]
      - from: BOUND
        to: CANCELLED
        trigger: "POST /league-policies/{league_policy_id}/cancel"
        actor: ProgramAdministrator
        preconditions: ["status == BOUND", "open_claim_count == 0"]
        side_effects: ["sets cancel_reason", "decrements League.in_force_policy_count by 1", "coverage_posture becomes FROZEN"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /league-policies/{league_policy_id}/cancel"
        actor: ProgramAdministrator
        preconditions: ["status == ACTIVE", "open_claim_count == 0"]
        side_effects: ["sets cancel_reason", "decrements League.in_force_policy_count by 1", "coverage_posture becomes FROZEN", "every SanctionedActivity of this policy with status == PENDING_SANCTION transitions to REJECTED with rejection_reason = POLICY_FROZEN"]

  - entity: Enrollment
    initial_state: ENROLLED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /enrollments/{enrollment_id}/withdraw"
        actor: LeagueAdministrator
        preconditions:
          - "status == ENROLLED"
          - "no Claim with enrollment_id == this Enrollment has adjudication_status IN {PENDING_COORDINATION, UNDER_ADJUDICATION, APPROVED}"
        side_effects:
          - "sets withdrawn_on_date to the logical clock"
          - "coverage_status becomes WITHDRAWN_NO_COVERAGE"
          - "recomputes Participant.enrolled_policy_count and Participant.roster_status"

  - entity: FamilyHealthPlan
    initial_state: UNVERIFIED
    terminal_states: [VERIFIED, NO_COVERAGE_ATTESTED]
    note: "the state field is FamilyHealthPlan.verification_status; coverage_state is a separate clock-derived computed field, not a state-machine state"
    transitions:
      - from: UNVERIFIED
        to: VERIFIED
        trigger: "POST /family-health-plans/{family_health_plan_id}/verification with decision=VERIFIED"
        actor: ClaimsExaminer
        preconditions: ["verification_status == UNVERIFIED"]
        side_effects: ["sets verified_at to the logical clock and verified_by_user_id to X-User-ID"]
      - from: UNVERIFIED
        to: NO_COVERAGE_ATTESTED
        trigger: "POST /family-health-plans/{family_health_plan_id}/verification with decision=NO_COVERAGE_ATTESTED"
        actor: ClaimsExaminer
        preconditions: ["verification_status == UNVERIFIED"]
        side_effects:
          - "sets verified_at to the logical clock and verified_by_user_id to X-User-ID"
          - "this plan stops counting as other coverage on file, so POST /claims/{id}/confirm-no-other-coverage becomes available for the participant"

  - entity: SanctionedActivity
    initial_state: PENDING_SANCTION
    terminal_states: [SANCTIONED, REJECTED]
    transitions:
      - from: PENDING_SANCTION
        to: SANCTIONED
        trigger: "POST /sanctioned-activities/{sanctioned_activity_id}/sanction-decision with decision=SANCTION"
        actor: LeagueOfficial
        preconditions:
          - "status == PENDING_SANCTION"
          - "LeaguePolicy.status IN {BOUND, ACTIVE}"
          - "LeaguePolicy.coverage_posture != FROZEN"
        side_effects: ["sets sanctioning_official_id to X-User-ID; this id is later barred from verifying injury reports arising from this activity"]
      - from: PENDING_SANCTION
        to: REJECTED
        trigger: "POST /sanctioned-activities/{sanctioned_activity_id}/sanction-decision with decision=REJECT"
        actor: LeagueOfficial
        preconditions: ["status == PENDING_SANCTION"]
        side_effects: ["sets rejection_reason = OFFICIAL_DECLINED"]
      - from: PENDING_SANCTION
        to: REJECTED
        trigger: "system: the owning LeaguePolicy's coverage_posture becomes FROZEN (CASCADE A link 5 / CASCADE D link 3)"
        actor: system
        preconditions: ["status == PENDING_SANCTION"]
        side_effects:
          - "sets rejection_reason = POLICY_FROZEN"
          - "each InjuryReport pointing at this activity whose status IN {PENDING_VERIFICATION, RETURNED_FOR_CORRECTION} transitions to REJECTED with rejection_reason = ACTIVITY_NOT_SANCTIONED"

  - entity: InjuryReport
    initial_state: PENDING_VERIFICATION
    terminal_states: [VERIFIED, REJECTED]
    note: "cyclic: PENDING_VERIFICATION <-> RETURNED_FOR_CORRECTION, bounded by MAX_CORRECTION_ROUNDS"
    transitions:
      - from: PENDING_VERIFICATION
        to: RETURNED_FOR_CORRECTION
        trigger: "POST /injury-reports/{injury_report_id}/return-for-correction"
        actor: LeagueOfficial
        preconditions:
          - "status == PENDING_VERIFICATION"
          - "correction_round_count < MAX_CORRECTION_ROUNDS"
        side_effects: ["increments correction_round_count by 1", "sets correction_note"]
      - from: RETURNED_FOR_CORRECTION
        to: PENDING_VERIFICATION
        trigger: "POST /injury-reports/{injury_report_id}/resubmit"
        actor: LeagueAdministrator
        preconditions:
          - "status == RETURNED_FOR_CORRECTION"
          - "logical clock - created_at <= VERIFICATION_WINDOW_DAYS days"
        side_effects: ["overwrites injury_description and severity_tier with the resubmitted values", "correction_round_count is NOT reset"]
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /injury-reports/{injury_report_id}/verification-decision with decision=VERIFY"
        actor: LeagueOfficial
        preconditions:
          - "status == PENDING_VERIFICATION"
          - "SanctionedActivity.status == SANCTIONED"
          - "SanctionedActivity.is_covered_activity == true"
          - "X-User-ID != SanctionedActivity.sanctioning_official_id"
          - "logical clock - created_at <= VERIFICATION_WINDOW_DAYS days"
          - "Enrollment.coverage_status != LIFETIME_EXHAUSTED"
          - "LeaguePolicy.coverage_posture != FROZEN"
        side_effects:
          - "CASCADE A link 1: sets verified_at, verifying_official_id, official_attestation"
          - "CASCADE A link 2: caused by link 1 alone — creates one Claim in adjudication_status PENDING_COORDINATION / coordination_status NOT_STARTED, copying league_policy_id and enrollment_id, with reserve_amount_cents from calculations.claim_reserve_amount"
          - "CASCADE A link 3: caused by link 2 alone — the new Claim joins the open set, so LeaguePolicy.reserve_cents, incurred_loss_cents, incurred_loss_ratio_bps, open_claim_count and experience_tier are recomputed"
          - "CASCADE A link 4: caused by link 3 alone — LeaguePolicy.coverage_posture is recomputed from the new open_claim_count / incurred figures and may become CLAIMS_REVIEW or FROZEN"
          - "CASCADE A link 5: caused by link 4 alone — if coverage_posture became FROZEN, every SanctionedActivity of that policy still in PENDING_SANCTION transitions to REJECTED with rejection_reason = POLICY_FROZEN"
      - from: PENDING_VERIFICATION
        to: REJECTED
        trigger: "POST /injury-reports/{injury_report_id}/verification-decision with decision=REJECT"
        actor: LeagueOfficial
        preconditions:
          - "status == PENDING_VERIFICATION"
          - "X-User-ID != SanctionedActivity.sanctioning_official_id"
        side_effects: ["sets rejection_reason = OFFICIAL_DECLINED, verifying_official_id = X-User-ID", "no Claim is created"]
      - from: PENDING_VERIFICATION
        to: REJECTED
        trigger: "system: the Enrollment's coverage_status becomes LIFETIME_EXHAUSTED (CASCADE B link 4), or the linked SanctionedActivity is system-REJECTED (CASCADE D link 4)"
        actor: system
        preconditions: ["status == PENDING_VERIFICATION"]
        side_effects: ["sets rejection_reason = LIFETIME_BENEFIT_EXHAUSTED or ACTIVITY_NOT_SANCTIONED respectively", "no Claim is created"]
      - from: RETURNED_FOR_CORRECTION
        to: REJECTED
        trigger: "system: same two causes as the PENDING_VERIFICATION -> REJECTED system transition (CASCADE B link 4 / CASCADE D link 4)"
        actor: system
        preconditions: ["status == RETURNED_FOR_CORRECTION"]
        side_effects: ["sets rejection_reason = LIFETIME_BENEFIT_EXHAUSTED or ACTIVITY_NOT_SANCTIONED respectively", "no Claim is created"]

  - entity: Claim
    initial_state: PENDING_COORDINATION
    terminal_states: [DENIED, WITHDRAWN]
    note: |
      Two independent state axes live on one Claim row.
      Axis 1 `adjudication_status`: PENDING_COORDINATION -> UNDER_ADJUDICATION -> APPROVED <-> PAID,
        with DENIED and WITHDRAWN as terminal exits. Axis 1 is advanced by provider-bill repricing,
        adjudication and payment activity.
      Axis 2 `coordination_status`: NOT_STARTED -> EOB_REQUESTED -> EOB_RECEIVED | EOB_WAIVED, and
        NOT_STARTED -> NO_OTHER_COVERAGE_CONFIRMED. Axis 2 is advanced by explanation-of-benefits
        collection and is untouched by anything on axis 1.
      The axes are independent everywhere except at one declared join: the
      UNDER_ADJUDICATION -> {APPROVED, DENIED} transition requires axis 2 to have reached a settled
      value. Every other transition on either axis is legal from any value of the other axis.
      `initial_state` / `terminal_states` above describe axis 1; axis 2's initial value is
      NOT_STARTED and its settled values are EOB_RECEIVED, EOB_WAIVED and NO_OTHER_COVERAGE_CONFIRMED.
    transitions:
      - from: NOT_STARTED
        to: EOB_REQUESTED
        trigger: "POST /claims/{claim_id}/request-eob"
        actor: ClaimsExaminer
        preconditions:
          - "coordination_status == NOT_STARTED"
          - "adjudication_status IN {PENDING_COORDINATION, UNDER_ADJUDICATION}"
          - "at least one FamilyHealthPlan of this claim's Participant has coverage_state == ACTIVE and verification_status != NO_COVERAGE_ATTESTED"
        side_effects: ["sets eob_requested_at to the logical clock, starting the EOB_WINDOW_DAYS waiver clock"]
        note: "axis 2 transition; leaves adjudication_status untouched"
      - from: NOT_STARTED
        to: NO_OTHER_COVERAGE_CONFIRMED
        trigger: "POST /claims/{claim_id}/confirm-no-other-coverage"
        actor: ClaimsExaminer
        preconditions:
          - "coordination_status == NOT_STARTED"
          - "adjudication_status IN {PENDING_COORDINATION, UNDER_ADJUDICATION}"
          - "the set of FamilyHealthPlan rows of this claim's Participant with coverage_state == ACTIVE and verification_status != NO_COVERAGE_ATTESTED is EMPTY"
          - "LeaguePolicy.coverage_basis_election == FULL_EXCESS_PERMITTED"
        side_effects: ["coordination_basis becomes FULL_EXCESS, which doubles the deductible per calculations.claim_benefit_determination"]
        note: "axis 2 transition; leaves adjudication_status untouched"
      - from: EOB_REQUESTED
        to: EOB_RECEIVED
        trigger: "system: a CoordinationRecord is created for this claim via POST /coordination-records"
        actor: system
        preconditions: ["coordination_status == EOB_REQUESTED"]
        side_effects: ["coordination_basis becomes EXCESS_OF_OTHER", "recomputes other_insurance_paid_cents and the whole benefit determination"]
      - from: EOB_REQUESTED
        to: EOB_WAIVED
        trigger: "system: lazily evaluated at the start of every read or write that touches this Claim, when (logical clock - eob_requested_at) > EOB_WINDOW_DAYS whole days"
        actor: system
        preconditions: ["coordination_status == EOB_REQUESTED", "eob_requested_at is not null"]
        side_effects: ["coordination_basis becomes EXCESS_OF_OTHER with other_insurance_paid_cents = 0", "no CoordinationRecord may be filed afterwards"]
      - from: PENDING_COORDINATION
        to: UNDER_ADJUDICATION
        trigger: "system: the first successful POST /provider-bills/{provider_bill_id}/reprice on a bill of this claim"
        actor: system
        preconditions: ["adjudication_status == PENDING_COORDINATION"]
        side_effects: ["recomputes allowed_amount_total_cents, balance_billed_total_cents, family_responsibility_total_cents and the benefit determination"]
        note: "axis 1 transition; fires from any value of coordination_status"
      - from: UNDER_ADJUDICATION
        to: APPROVED
        trigger: "POST /claims/{claim_id}/adjudicate"
        actor: ClaimsExaminer
        preconditions:
          - "adjudication_status == UNDER_ADJUDICATION"
          - "coordination_status IN {EOB_RECEIVED, EOB_WAIVED, NO_OTHER_COVERAGE_CONFIRMED} (the single declared join between the two axes)"
          - "LeaguePolicy.status IN {ACTIVE, RUN_OFF}"
          - "LeaguePolicy.coverage_posture != FROZEN"
          - "Enrollment.status == ENROLLED"
          - "benefit_payable_cents >= 1"
          - "if the determination puts any amount above cat_attachment_point_cents into cat_layer_benefit_cents, then cat_certification_status == CERTIFIED"
        side_effects:
          - "sets adjudicated_at, adjudicated_by_user_id and freezes deductible_applied_cents, benefit_before_limit_cents, base_layer_benefit_cents, cat_layer_benefit_cents, benefit_payable_cents"
          - "every ProviderBill of this claim with status == REPRICED transitions to ADJUDICATED"
      - from: UNDER_ADJUDICATION
        to: DENIED
        trigger: "POST /claims/{claim_id}/adjudicate"
        actor: ClaimsExaminer
        preconditions:
          - "adjudication_status == UNDER_ADJUDICATION"
          - "coordination_status IN {EOB_RECEIVED, EOB_WAIVED, NO_OTHER_COVERAGE_CONFIRMED}"
          - "LeaguePolicy.status IN {ACTIVE, RUN_OFF}"
          - "LeaguePolicy.coverage_posture != FROZEN"
          - "exactly one of: Enrollment.status == WITHDRAWN (denial_reason = ENROLLMENT_WITHDRAWN), or benefit_payable_cents == 0 (denial_reason = NO_BENEFIT_PAYABLE); the WITHDRAWN test is evaluated first"
        side_effects:
          - "sets adjudicated_at, adjudicated_by_user_id and denial_reason"
          - "every ProviderBill of this claim with status == REPRICED transitions to DENIED"
          - "the Claim leaves the open set, so LeaguePolicy.reserve_cents, incurred_loss_cents, open_claim_count, coverage_posture and experience_tier are recomputed"
      - from: APPROVED
        to: PAID
        trigger: "system: re-evaluated at the end of every POST /benefit-payments and every POST /benefit-payments/{id}/void on this claim"
        actor: system
        preconditions: ["adjudication_status == APPROVED", "paid_to_date_cents >= benefit_payable_cents"]
        side_effects: ["the Claim leaves the open set, so LeaguePolicy.reserve_cents, incurred_loss_cents, open_claim_count, coverage_posture and experience_tier are recomputed"]
      - from: PAID
        to: APPROVED
        trigger: "system: re-evaluated at the end of every POST /benefit-payments/{benefit_payment_id}/void on this claim"
        actor: system
        preconditions: ["adjudication_status == PAID", "paid_to_date_cents < benefit_payable_cents"]
        side_effects: ["the Claim re-joins the open set, so LeaguePolicy.reserve_cents, incurred_loss_cents, open_claim_count, coverage_posture and experience_tier are recomputed"]
        note: "this is the reopen leg that makes axis 1 non-linear (APPROVED <-> PAID)"
      - from: PENDING_COORDINATION
        to: WITHDRAWN
        trigger: "POST /claims/{claim_id}/withdraw"
        actor: LeagueAdministrator
        preconditions: ["adjudication_status == PENDING_COORDINATION", "paid_to_date_cents == 0"]
        side_effects: ["sets withdrawal_reason", "the Claim leaves the open set, so LeaguePolicy.reserve_cents, incurred_loss_cents, open_claim_count, coverage_posture and experience_tier are recomputed"]
      - from: UNDER_ADJUDICATION
        to: WITHDRAWN
        trigger: "POST /claims/{claim_id}/withdraw"
        actor: LeagueAdministrator
        preconditions: ["adjudication_status == UNDER_ADJUDICATION", "paid_to_date_cents == 0"]
        side_effects: ["sets withdrawal_reason", "every ProviderBill of this claim with status IN {SUBMITTED, REPRICED} transitions to VOIDED with void_reason = CLAIM_WITHDRAWN", "the Claim leaves the open set, so LeaguePolicy.reserve_cents, incurred_loss_cents, open_claim_count, coverage_posture and experience_tier are recomputed"]
      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /claims/{claim_id}/withdraw"
        actor: LeagueAdministrator
        preconditions: ["adjudication_status == APPROVED", "paid_to_date_cents == 0"]
        side_effects: ["sets withdrawal_reason", "every ProviderBill of this claim with status IN {SUBMITTED, REPRICED, ADJUDICATED} transitions to VOIDED with void_reason = CLAIM_WITHDRAWN", "the Claim leaves the open set, so LeaguePolicy.reserve_cents, incurred_loss_cents, open_claim_count, coverage_posture and experience_tier are recomputed"]

  - entity: ProviderBill
    initial_state: SUBMITTED
    terminal_states: [VOIDED]
    transitions:
      - from: SUBMITTED
        to: REPRICED
        trigger: "POST /provider-bills/{provider_bill_id}/reprice"
        actor: ClaimsExaminer
        preconditions:
          - "status == SUBMITTED"
          - "service_category is a declared key of the linked SportClassification.service_category_caps"
          - "Claim.adjudication_status IN {PENDING_COORDINATION, UNDER_ADJUDICATION}"
          - "LeaguePolicy.coverage_posture != FROZEN"
        side_effects:
          - "computes negotiated_amount_cents, scheduled_cap_cents, allowed_amount_cents, balance_billed_cents, family_responsibility_cents per calculations.provider_bill_allowed_amount"
          - "sets repriced_at and repriced_by_user_id"
          - "recomputes the parent Claim's allowed_amount_total_cents, balance_billed_total_cents, family_responsibility_total_cents and benefit determination"
          - "if the parent Claim is in PENDING_COORDINATION, drives it to UNDER_ADJUDICATION"
      - from: REPRICED
        to: ADJUDICATED
        trigger: "system: the parent Claim transitions UNDER_ADJUDICATION -> APPROVED"
        actor: system
        preconditions: ["status == REPRICED"]
        side_effects: ["the bill becomes payable by POST /benefit-payments"]
      - from: REPRICED
        to: DENIED
        trigger: "system: the parent Claim transitions UNDER_ADJUDICATION -> DENIED"
        actor: system
        preconditions: ["status == REPRICED"]
        side_effects: []
      - from: SUBMITTED
        to: VOIDED
        trigger: "POST /provider-bills/{provider_bill_id}/void"
        actor: ClaimsExaminer
        preconditions: ["status == SUBMITTED"]
        side_effects: ["sets void_reason"]
      - from: REPRICED
        to: VOIDED
        trigger: "POST /provider-bills/{provider_bill_id}/void"
        actor: ClaimsExaminer
        preconditions: ["status == REPRICED", "no BenefitPayment with status == ISSUED references this bill"]
        side_effects: ["sets void_reason", "recomputes the parent Claim's allowed_amount_total_cents, balance_billed_total_cents, family_responsibility_total_cents and benefit determination"]
      - from: ADJUDICATED
        to: VOIDED
        trigger: "POST /provider-bills/{provider_bill_id}/void"
        actor: ClaimsExaminer
        preconditions: ["status == ADJUDICATED", "no BenefitPayment with status == ISSUED references this bill"]
        side_effects: ["sets void_reason", "the parent Claim's frozen determination is NOT recomputed once adjudicated; only balance_billed_total_cents and family_responsibility_total_cents are recomputed"]

  - entity: BenefitPayment
    initial_state: ISSUED
    terminal_states: [VOIDED]
    transitions:
      - from: ISSUED
        to: VOIDED
        trigger: "POST /benefit-payments/{benefit_payment_id}/void"
        actor: ClaimsExaminer
        preconditions: ["status == ISSUED"]
        side_effects:
          - "CASCADE C link 1: sets void_reason and voided_at"
          - "CASCADE C link 2: caused by link 1 alone — the parent Claim recomputes paid_base_cents, paid_cat_cents and paid_to_date_cents, and if it was PAID and paid_to_date_cents is now < benefit_payable_cents it transitions PAID -> APPROVED"
          - "CASCADE C link 3: caused by link 2 alone — the Claim re-joining the open set forces LeaguePolicy.paid_loss_cents, reserve_cents, incurred_loss_cents, open_claim_count, incurred_loss_ratio_bps, paid_loss_ratio_bps, experience_tier and coverage_posture to be recomputed"
          - "when layer == CATASTROPHIC, the Enrollment's lifetime_cat_benefit_used_cents is also recomputed downward and coverage_status may leave LIFETIME_EXHAUSTED"

# ============================================================================
# §1.2.1 Concurrency Rules
# ============================================================================
concurrency_rules:

  - rule_id: coordination-record-create-stale-claim
    parent_entity: Claim
    write_endpoint: "POST /coordination-records"
    occ_field: "expected_claim_version"
    description: |
      Filing an explanation of benefits against a Claim whose version has advanced
      since the client last read it is rejected. A corrected explanation of benefits
      legitimately supersedes the prior ACTIVE CoordinationRecord for the same
      (provider_bill_id, family_health_plan_id) pair and rewrites the claim's
      other_insurance_paid_cents, so a writer holding a stale view of the claim would
      supersede a record it never saw. The stale expected_claim_version is the
      deterministic signal for that.
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412

  - rule_id: renewal-quote-stale-policy
    parent_entity: LeaguePolicy
    write_endpoint: "POST /league-policies/{league_policy_id}/renewal-quote"
    occ_field: "expected_league_policy_version"
    description: |
      Producing a renewal quote against a LeaguePolicy whose version has advanced
      since the client last read it is rejected. A new quote legitimately overwrites
      the prior renewal_* block, and the loss experience it is rated from moves on
      every claim, payment and reserve change, so a writer holding a stale view of
      the policy would publish a quote priced off superseded loss figures.
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412

# ============================================================================
# §1.3 Calculation Rules Table
# ============================================================================
calculations:

  - name: policy_gross_premium_banded
    trigger: "on POST /league-policies (QUOTED figures) and recomputed on POST /league-policies/{league_policy_id}/bind"
    algorithm: tiered_pricing
    formula: |
      # inputs: n = LeaguePolicy.enrolled_participant_count
      #         base = SportClassification.base_rate_per_participant_cents
      #         hz   = HAZARD_LOAD_BPS[SportClassification.hazard_class]
      #
      # The participant count is sliced into three cumulative volume bands:
      #   BAND_1 : participants 1        .. PREMIUM_BAND_1_CAP (75)   factor 1.0000
      #   BAND_2 : participants 76       .. PREMIUM_BAND_2_CAP (400)  factor 0.9250
      #   BAND_3 : participants 401      .. n                         factor 0.8500
      #
      # PINNED ROUNDING ORDER (mode (b) of §0.5 Rule 2) — ROUND PER BAND LINE,
      # THEN SUM. The hazard load is folded into each band line BEFORE that line
      # is rounded; it is NOT applied to the summed total.
      #
      n_band_1 = max(0, min(n, 75) - 0)
      n_band_2 = max(0, min(n, 400) - 75)
      n_band_3 = max(0, n - 400)
      band_line_cents(n_band, factor) =
          round_half_up( n_band * base * factor * (10000 + hz) / 10000 )
      gross_premium_cents =   band_line_cents(n_band_1, 1.0000)
                            + band_line_cents(n_band_2, 0.9250)
                            + band_line_cents(n_band_3, 0.8500)
      #
      # EXPLICITLY REJECTED ALTERNATIVE (produces a different cents figure and is
      # WRONG under this scaffold):
      #   round_half_up( n_band_1*base*1.0000*(10000+hz)/10000
      #                + n_band_2*base*0.9250*(10000+hz)/10000
      #                + n_band_3*base*0.8500*(10000+hz)/10000 )
      # Worked divergence: base=1850, hz=1150 (CLASS_2_MODERATE), n=404 gives
      #   band lines 154706.25 / 620114.21875 / 7013.35
      #   round-per-band-then-sum = 154706 + 620114 + 7013 = 781833   <- CORRECT
      #   sum-then-round          = round_half_up(781833.81875) = 781834  <- WRONG
    input_set: "the single LeaguePolicy being quoted or bound, plus its linked SportClassification"
    constants:
      PREMIUM_BAND_1_CAP: 75
      PREMIUM_BAND_2_CAP: 400
      PREMIUM_BAND_1_FACTOR: 1.0000
      PREMIUM_BAND_2_FACTOR: 0.9250
      PREMIUM_BAND_3_FACTOR: 0.8500
      HAZARD_LOAD_BPS: { CLASS_1_LOW: 0, CLASS_2_MODERATE: 1150, CLASS_3_HIGH: 2625, CLASS_4_CONTACT: 4075 }
    precision: "integer cents; round_half_up applied once per band line and never to the summed total"

  - name: policy_annual_premium_assembly
    trigger: "immediately after policy_gross_premium_banded, on POST /league-policies and on POST /league-policies/{league_policy_id}/bind"
    algorithm: constraint_propagation
    formula: |
      # This is mode (c) of §0.5 Rule 2: the volume credit is keyed on a subtotal
      # that already contains a catastrophic-layer charge derived from the gross
      # premium, and the final premium is the subtotal net of that credit. The
      # dependency looks circular, so the evaluation order is PINNED to exactly
      # these six steps, in this order, and no other:
      #
      # step 1  gross_premium_cents        = policy_gross_premium_banded
      # step 2  cat_layer_charge_cents     = cat_layer_elected
      #                                       ? round_half_up(gross_premium_cents * CAT_LAYER_RATE_BPS / 10000)
      #                                       : 0
      # step 3  premium_subtotal_cents     = gross_premium_cents + cat_layer_charge_cents
      # step 4  volume_credit_bps          = tier selected from VOLUME_CREDIT_TIERS_BPS
      #                                       KEYED ON premium_subtotal_cents (step 3),
      #                                       never on gross_premium_cents and never on
      #                                       annual_premium_cents:
      #                                         premium_subtotal_cents <  500000            ->   0
      #                                         500000  <= subtotal <  1500000              -> 300
      #                                         1500000 <= subtotal <  5000000              -> 550
      #                                         subtotal >= 5000000                         -> 800
      # step 5  volume_credit_cents        = round_half_up(premium_subtotal_cents * volume_credit_bps / 10000)
      # step 6  annual_premium_cents       = max(MIN_ANNUAL_PREMIUM_CENTS,
      #                                          premium_subtotal_cents - volume_credit_cents)
      #
      # EXPLICITLY REJECTED ALTERNATIVES:
      #   (i)  keying volume_credit_bps on gross_premium_cents (step 1) instead of the
      #        subtotal — this drops the catastrophic charge out of the tier decision;
      #   (ii) keying volume_credit_bps on annual_premium_cents (step 6) — genuinely
      #        circular and therefore undefined;
      #   (iii) applying the MIN_ANNUAL_PREMIUM_CENTS floor before the credit.
      # Worked divergence for (i): BASEBALL_U12 (base 1850, CLASS_2_MODERATE) at
      #   n = 800 gives gross_premium_cents = 1476155.
      #   cat_layer_elected = true  -> cat 125473, subtotal 1601628 -> tier 550 bps
      #                             -> credit  88090 -> annual 1513538
      #   cat_layer_elected = false -> cat      0,   subtotal 1476155 -> tier 300 bps
      #                             -> credit  44285 -> annual 1431870
      #   Electing the catastrophic layer moves the volume tier, so the credit rate
      #   itself changes; keying on gross would have left both at 300 bps.
    input_set: "the single LeaguePolicy being quoted or bound"
    constants:
      CAT_LAYER_RATE_BPS: 850
      VOLUME_CREDIT_TIERS_BPS: { "0..499999": 0, "500000..1499999": 300, "1500000..4999999": 550, "5000000+": 800 }
      MIN_ANNUAL_PREMIUM_CENTS: 25000
    precision: "integer cents, round_half_up at steps 2 and 5 only"

  - name: provider_bill_allowed_amount
    trigger: "on POST /provider-bills/{provider_bill_id}/reprice"
    algorithm: threshold
    formula: |
      # Mode (a) of §0.5 Rule 2: five inputs, nested min/max, a branch on the
      # bill's network_status and a severity factor pulled from the linked
      # InjuryReport, so the schedule cap itself is state-dependent.
      #
      # inputs: billed = ProviderBill.billed_charge_cents
      #         sched  = ProviderBill.fee_schedule_amount_cents
      #         net    = ProviderBill.network_status
      #         cap    = SportClassification.service_category_caps[ProviderBill.service_category]
      #         sev    = InjuryReport.severity_tier of the claim's report
      #
      if net == IN_NETWORK:
          negotiated_amount_cents = min(billed, sched)
      else:                       # OUT_OF_NETWORK
          negotiated_amount_cents = min(billed,
                                        round_half_up(sched * OON_FEE_SCHEDULE_MULTIPLIER_BPS / 10000))
      scheduled_cap_cents   = round_half_up(cap * SEVERITY_CAP_FACTOR_BPS[sev] / 10000)
      allowed_amount_cents  = max(0, min(negotiated_amount_cents, scheduled_cap_cents))
      balance_billed_cents  = max(0, billed - allowed_amount_cents)
      # Balance protection for families: an in-network provider may bill the
      # family nothing above the allowed amount; an out-of-network provider's
      # balance is shared with the family only up to a hard cap.
      if net == IN_NETWORK:
          family_responsibility_cents = 0
      else:
          family_responsibility_cents = min(balance_billed_cents, OON_FAMILY_SHARE_CAP_CENTS)
    input_set: "the single ProviderBill being repriced, its Claim's InjuryReport, and the SportClassification of the Claim's LeaguePolicy"
    constants:
      OON_FEE_SCHEDULE_MULTIPLIER_BPS: 14000
      OON_FAMILY_SHARE_CAP_CENTS: 15000
      SEVERITY_CAP_FACTOR_BPS: { MINOR: 10000, MODERATE: 10000, SEVERE: 11500, CATASTROPHIC: 12500 }
    precision: "integer cents, round_half_up on the out-of-network multiplier and on the severity-adjusted cap"

  - name: claim_benefit_determination
    trigger: "recomputed on every POST /provider-bills/{provider_bill_id}/reprice, POST /provider-bills/{provider_bill_id}/void, POST /coordination-records, POST /claims/{claim_id}/request-eob, POST /claims/{claim_id}/confirm-no-other-coverage, POST /claims/{claim_id}/cat-certification and POST /claims/{claim_id}/cat-certification-revocation; frozen at POST /claims/{claim_id}/adjudicate"
    algorithm: waterfall_allocation
    formula: |
      allowed_amount_total_cents = sum(ProviderBill.allowed_amount_cents
                                       for bills of this Claim with status IN {REPRICED, ADJUDICATED})
      other_insurance_paid_cents = sum(CoordinationRecord.other_plan_paid_cents
                                       for records of this Claim with status == ACTIVE
                                       whose provider_bill_id is one of those bills)
      # variant-dependent step, see `variants:` below
      offset_cents      = (coordination_basis == EXCESS_OF_OTHER) ? other_insurance_paid_cents : 0
      deductible_basis  = (coordination_basis == EXCESS_OF_OTHER)
                            ? LeaguePolicy.deductible_cents
                            : round_half_up(LeaguePolicy.deductible_cents
                                            * FULL_EXCESS_DEDUCTIBLE_FACTOR_BPS / 10000)
      net_after_other_cents      = max(0, allowed_amount_total_cents - offset_cents)
      deductible_applied_cents   = min(net_after_other_cents, deductible_basis)
      benefit_before_limit_cents = max(0, net_after_other_cents - deductible_applied_cents)
      # waterfall across the two coverage layers
      base_layer_benefit_cents   = min(benefit_before_limit_cents,
                                       LeaguePolicy.per_injury_limit_cents)
      cat_eligible_cents         = max(0, benefit_before_limit_cents
                                          - LeaguePolicy.cat_attachment_point_cents)
      cat_lifetime_remaining     = max(0, LeaguePolicy.cat_lifetime_max_cents
                                          - Enrollment.lifetime_cat_benefit_used_cents)
      if LeaguePolicy.cat_layer_elected and Claim.cat_certification_status == CERTIFIED:
          cat_layer_benefit_cents = min(cat_eligible_cents, cat_lifetime_remaining)
      else:
          cat_layer_benefit_cents = 0
      benefit_payable_cents      = base_layer_benefit_cents + cat_layer_benefit_cents
      #
      # NOTE ON THE UNINSURED CORRIDOR: cat_attachment_point_cents may exceed
      # per_injury_limit_cents. When it does, benefit amounts strictly between the
      # two are payable by NEITHER layer and stay with the family. The formula
      # deliberately does not close that corridor.
      # NOTE ON CERTIFICATION: when cat_layer_elected is true, benefit_before_limit_cents
      # exceeds cat_attachment_point_cents and cat_certification_status != CERTIFIED,
      # POST /claims/{claim_id}/adjudicate is refused with ERR_CAT_CERTIFICATION_REQUIRED
      # rather than silently paying the base layer only.
    input_set: "the Claim's ProviderBill rows with status IN {REPRICED, ADJUDICATED}, its ACTIVE CoordinationRecord rows, its LeaguePolicy limit mirror fields, and its Enrollment's lifetime catastrophic usage"
    constants:
      FULL_EXCESS_DEDUCTIBLE_FACTOR_BPS: 20000
    precision: "integer cents, round_half_up on the full-excess deductible basis only"
    variants:
      - name: EXCESS_OF_OTHER
        when: "coordination_status IN {EOB_RECEIVED, EOB_WAIVED} — the family carries other coverage (or the explanation-of-benefits window lapsed), so the program pays excess of it"
        difference: "offset_cents = other_insurance_paid_cents and deductible_basis = LeaguePolicy.deductible_cents at face value"
      - name: FULL_EXCESS
        when: "coordination_status == NO_OTHER_COVERAGE_CONFIRMED — no other coverage exists, so the program is effectively primary"
        difference: "offset_cents = 0 but the deductible basis is doubled (FULL_EXCESS_DEDUCTIBLE_FACTOR_BPS = 20000 bps), which lowers benefit_payable_cents relative to EXCESS_OF_OTHER whenever other_insurance_paid_cents is 0"

  - name: claim_reserve_amount
    trigger: "on Claim creation (the InjuryReport PENDING_VERIFICATION -> VERIFIED cascade) and re-set whenever POST /injury-reports/{injury_report_id}/resubmit changes the report's severity_tier before verification"
    algorithm: threshold
    formula: |
      exposure_cap_cents = LeaguePolicy.per_injury_limit_cents
                           + (LeaguePolicy.cat_layer_elected
                                ? LeaguePolicy.cat_lifetime_max_cents : 0)
      reserve_amount_cents = min(RESERVE_BY_SEVERITY_CENTS[InjuryReport.severity_tier],
                                 exposure_cap_cents)
    input_set: "the newly created Claim's InjuryReport severity_tier and its LeaguePolicy limit mirror fields"
    constants:
      RESERVE_BY_SEVERITY_CENTS: { MINOR: 50000, MODERATE: 250000, SEVERE: 1500000, CATASTROPHIC: 7500000 }
    precision: "integer cents, no rounding required"

  - name: policy_loss_experience
    trigger: "recomputed at the end of every write that changes a Claim of this policy, a BenefitPayment of one of those Claims, or the policy's own annual_premium_cents; readable via GET /league-policies/{league_policy_id}/loss-experience"
    algorithm: aggregation
    formula: |
      open_set = Claims of this policy with adjudication_status IN
                 {PENDING_COORDINATION, UNDER_ADJUDICATION, APPROVED}
      paid_loss_cents   = sum(BenefitPayment.amount_cents
                              for payments with status == ISSUED
                              over EVERY Claim of this policy, open or not)
      reserve_cents     = sum(Claim.reserve_amount_cents for Claim in open_set)
      incurred_loss_cents = paid_loss_cents + reserve_cents
      open_claim_count    = count(open_set)
      incurred_loss_ratio_bps = round_half_up(incurred_loss_cents * 10000 / annual_premium_cents)
      paid_loss_ratio_bps     = round_half_up(paid_loss_cents     * 10000 / annual_premium_cents)
      # tier is selected from the variant-selected ratio, see `variants:` below
      experience_tier = band of incurred_loss_ratio_bps in EXPERIENCE_TIER_BANDS_BPS:
                          ratio <  3500  -> PREFERRED
                          3500  <= ratio <  6500  -> STANDARD
                          6500  <= ratio < 10000  -> ADVERSE
                          ratio >= 10000 -> DECLINE
    input_set: "every Claim of this LeaguePolicy and every ISSUED BenefitPayment of those Claims; VOIDED payments, DENIED/WITHDRAWN/PAID claims contribute no reserve but their ISSUED payments still contribute paid loss"
    constants:
      EXPERIENCE_TIER_BANDS_BPS: { PREFERRED: "< 3500", STANDARD: "3500..6499", ADVERSE: "6500..9999", DECLINE: ">= 10000" }
    precision: "integer basis points, round_half_up"
    variants:
      - name: INCURRED
        when: "POST /league-policies/{league_policy_id}/renewal-quote is called with loss_experience_basis = INCURRED"
        difference: "the renewal experience tier is banded from incurred_loss_ratio_bps, which includes open-claim case reserves that have not been paid"
      - name: PAID_ONLY
        when: "POST /league-policies/{league_policy_id}/renewal-quote is called with loss_experience_basis = PAID_ONLY"
        difference: "the renewal experience tier is banded from paid_loss_ratio_bps, which ignores every case reserve; on a policy whose losses are all still reserved this reads 0 bps where the incurred basis reads a positive ratio, so the two bases select different tiers and different modifiers from identical data"

  - name: policy_coverage_posture
    trigger: "recomputed at the end of every write that changes this LeaguePolicy, its League's sanctioning_status, or any Claim / BenefitPayment beneath it"
    algorithm: threshold
    formula: |
      # FIRST MATCH WINS — evaluated strictly top to bottom.
      if status IN {CLOSED, CANCELLED}:                                 -> FROZEN
      elif League.sanctioning_status == SUSPENDED:                      -> FROZEN
      elif incurred_loss_cents >= aggregate_limit_cents:                -> FROZEN
      elif open_claim_count >= POSTURE_CLAIMS_REVIEW_OPEN_CLAIMS:       -> CLAIMS_REVIEW
      elif incurred_loss_ratio_bps >= POSTURE_CLAIMS_REVIEW_LOSS_RATIO_BPS: -> CLAIMS_REVIEW
      else:                                                             -> OPEN
    input_set: "this LeaguePolicy's own status and loss aggregates plus its League's sanctioning_status"
    constants:
      POSTURE_CLAIMS_REVIEW_OPEN_CLAIMS: 3
      POSTURE_CLAIMS_REVIEW_LOSS_RATIO_BPS: 6500
    precision: "no arithmetic; the aggregate test is >= (an incurred loss exactly equal to aggregate_limit_cents FREEZES the policy)"

  - name: renewal_quoted_premium
    trigger: "on POST /league-policies/{league_policy_id}/renewal-quote"
    algorithm: tiered_pricing
    formula: |
      # step 1: freeze the loss ratio under the elected basis
      renewal_loss_ratio_bps = (loss_experience_basis == INCURRED)
                                 ? incurred_loss_ratio_bps
                                 : paid_loss_ratio_bps
      # step 2: band it
      renewal_experience_tier = band of renewal_loss_ratio_bps in EXPERIENCE_TIER_BANDS_BPS
      renewal_experience_modifier_bps = EXPERIENCE_MODIFIER_BPS[renewal_experience_tier]
      # step 3: re-rate from scratch on the renewal head count, reusing
      #         policy_gross_premium_banded then policy_annual_premium_assembly
      #         with n = renewal_enrolled_participant_count and the SAME
      #         SportClassification and cat_layer_elected as the expiring term
      renewal_base_premium_cents = annual_premium_cents that
          policy_annual_premium_assembly yields for n = renewal_enrolled_participant_count
      # step 4: apply the experience modifier, then the floor
      renewal_quoted_premium_cents =
          max(MIN_ANNUAL_PREMIUM_CENTS,
              round_half_up(renewal_base_premium_cents
                            * (10000 + renewal_experience_modifier_bps) / 10000))
      # A DECLINE tier does NOT block the quote; it prices at +6000 bps. The
      # league may still refuse it by never calling renewal-acceptance.
    input_set: "this LeaguePolicy's frozen loss aggregates at quote time plus the requested renewal head count"
    constants:
      EXPERIENCE_MODIFIER_BPS: { PREFERRED: -1500, STANDARD: 0, ADVERSE: 2750, DECLINE: 6000 }
      MIN_ANNUAL_PREMIUM_CENTS: 25000
    precision: "integer cents, round_half_up once at step 4 (the step-3 re-rate keeps its own per-band rounding)"

  - name: injury_report_timeliness
    trigger: "on POST /injury-reports (sets reported_on_date and days_to_report) and re-checked on POST /injury-reports/{injury_report_id}/resubmit and POST /injury-reports/{injury_report_id}/verification-decision"
    algorithm: chronological
    formula: |
      reported_on_date = UTC calendar date of the logical clock, at 00:00:00Z
      injury_on_date   = UTC calendar date of injury_datetime, at 00:00:00Z
      days_to_report   = whole days from injury_on_date to reported_on_date
      # filing window, checked on POST /injury-reports:
      #   days_to_report <= FILING_WINDOW_DAYS (90)   -> timely
      #   days_to_report >  FILING_WINDOW_DAYS        -> ERR_FILING_WINDOW_EXPIRED
      # verification window, checked on resubmit and on verification-decision:
      #   whole days from the report's created_at date to the logical clock date
      #   must be <= VERIFICATION_WINDOW_DAYS (30), else ERR_VERIFICATION_WINDOW_EXPIRED
      # explanation-of-benefits waiver window, checked lazily on every touch of a Claim:
      #   whole days from eob_requested_at to the logical clock
      #   >  EOB_WINDOW_DAYS (45)  -> coordination_status EOB_REQUESTED becomes EOB_WAIVED
      #   <= EOB_WINDOW_DAYS       -> stays EOB_REQUESTED
    input_set: "the single InjuryReport (or Claim) being written and the logical clock"
    constants:
      FILING_WINDOW_DAYS: 90
      VERIFICATION_WINDOW_DAYS: 30
      EOB_WINDOW_DAYS: 45
    precision: "whole UTC calendar days; all three windows are inclusive on the day-count value itself (<= is timely, the first day beyond is late)"

  - name: enrollment_lifetime_cat_benefit
    trigger: "recomputed at the end of every POST /benefit-payments and POST /benefit-payments/{benefit_payment_id}/void whose Claim belongs to this Enrollment"
    algorithm: aggregation
    formula: |
      lifetime_cat_benefit_used_cents =
          sum(BenefitPayment.amount_cents
              for payments with layer == CATASTROPHIC and status == ISSUED
              across EVERY Claim whose enrollment_id == this Enrollment,
              regardless of that Claim's adjudication_status)
      if status == WITHDRAWN:                                                 coverage_status = WITHDRAWN_NO_COVERAGE
      elif lifetime_cat_benefit_used_cents >= LeaguePolicy.cat_lifetime_max_cents: coverage_status = LIFETIME_EXHAUSTED
      else:                                                                   coverage_status = COVERED
    input_set: "every ISSUED catastrophic-layer BenefitPayment across every Claim of this Enrollment"
    constants: {}
    precision: "integer cents; the exhaustion test is >=, so paying exactly cat_lifetime_max_cents exhausts the enrollment"

  - name: participant_activity_conflict_window
    trigger: "on POST /sanctioned-activities, before the row is created"
    algorithm: interval_merge
    formula: |
      # The candidate activity occupies a CLOSED interval, symmetrically widened
      # by its own travel buffer:
      candidate_window = [ starts_at - travel_buffer_minutes minutes ,
                           ends_at   + travel_buffer_minutes minutes ]
      # Every already-recorded activity is widened by ITS OWN buffer, not the
      # candidate's:
      existing_window(a) = [ a.starts_at - a.travel_buffer_minutes minutes ,
                             a.ends_at   + a.travel_buffer_minutes minutes ]
      # Comparison set: every SanctionedActivity `a` with status IN
      # {PENDING_SANCTION, SANCTIONED} whose league_policy_id is a policy under
      # which SOME Participant is ENROLLED who is ALSO ENROLLED under the
      # candidate's league_policy_id. This traverses
      #   candidate policy -> Enrollment -> Participant -> Enrollment -> other policy
      # so the conflict is a per-athlete conflict, not a per-policy one, and it
      # crosses policy (and sport) boundaries.
      # CLOSED-INTERVAL INTERSECTION (touching endpoints DO collide):
      conflict(a) = (candidate_window.start <= existing_window(a).end)
                    and (existing_window(a).start <= candidate_window.end)
      # any conflict -> ERR_PARTICIPANT_ACTIVITY_CONFLICT (409)
      #
      # Contrast with policy terms, which are HALF-OPEN
      # [term_effective_date, term_expiration_date): two terms that merely touch
      # at an endpoint do NOT overlap and both may be bound.
    input_set: "the candidate activity, plus every PENDING_SANCTION/SANCTIONED activity of every LeaguePolicy that shares at least one ENROLLED Participant with the candidate's policy"
    constants: {}
    precision: "minute arithmetic on ISO 8601 UTC instants; closed intervals on both sides, so an expanded start exactly equal to an expanded end is a conflict"

# ============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# Evaluation is strictly by ascending `priority`. The FIRST violated rule
# determines the response; later rules are not evaluated. Domain ordering:
# auth -> authorization -> ownership -> request shape -> existence ->
# referential scope -> own state -> governing-policy state -> concurrency ->
# safety/compliance -> temporal -> constraint -> fiscal.
# ============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role names a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the supplied X-User-Role appears in the called endpoint's `roles:` list in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "for entity_backed roles the caller owns the addressed resource: LeagueAdministrator's X-User-ID must equal the League.id reached from the addressed resource (League -> LeaguePolicy.league_id, Participant.league_id, Enrollment -> LeaguePolicy -> League, SanctionedActivity -> LeaguePolicy -> League, InjuryReport -> Enrollment -> LeaguePolicy -> League, Claim.league_policy_id -> League); GuardianPortal's X-User-ID must equal the Participant.id reached from the addressed resource (Participant, FamilyHealthPlan.participant_id, Claim -> Enrollment.participant_id)"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "every endpoint whose roles include LeagueAdministrator or GuardianPortal"

  - priority: 4
    category: schema
    check: "request shape: every required `input:` field is present and non-null, no enum carries a value outside its declared member set, every integer honours its declared constraint (>= 0, >= 1, 0..10000, 10-digit NPI, 2-letter state code), datetimes parse as ISO 8601 UTC instants, `limit` is within 1..100 and `offset` >= 0, and undeclared body fields as well as computed/system fields sent by the client are ignored rather than honoured"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 5
    category: existence
    check: "every templated id in the path resolves to a live row, validated left to right"
    error_id: "ERR_LEAGUE_NOT_FOUND | ERR_SPORT_CLASSIFICATION_NOT_FOUND | ERR_LEAGUE_POLICY_NOT_FOUND | ERR_PARTICIPANT_NOT_FOUND | ERR_ENROLLMENT_NOT_FOUND | ERR_FAMILY_HEALTH_PLAN_NOT_FOUND | ERR_SANCTIONED_ACTIVITY_NOT_FOUND | ERR_INJURY_REPORT_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_PROVIDER_BILL_NOT_FOUND | ERR_COORDINATION_RECORD_NOT_FOUND | ERR_BENEFIT_PAYMENT_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a templated path segment"

  - priority: 6
    category: existence
    check: "every foreign key supplied in the request body resolves to a live row, validated in the field order declared by the endpoint's `input:`"
    error_id: "the ERR_<ENTITY>_NOT_FOUND code of the missing parent (same catalog as priority 5)"
    http_status: 404
    applies_to: "POST /league-policies, POST /participants, POST /enrollments, POST /family-health-plans, POST /sanctioned-activities, POST /injury-reports, POST /provider-bills, POST /coordination-records, POST /benefit-payments"

  - priority: 7
    category: business_referential
    check: "body foreign keys are mutually in scope: Enrollment.participant_id's Participant.league_id equals the LeaguePolicy's league_id; InjuryReport's SanctionedActivity.league_policy_id equals its Enrollment.league_policy_id; ProviderBill's claim_id and CoordinationRecord's claim_id/provider_bill_id refer to the same Claim; CoordinationRecord's FamilyHealthPlan.participant_id equals the Claim's Enrollment.participant_id; BenefitPayment's provider_bill_id belongs to its claim_id"
    error_id: ERR_SCOPE_MISMATCH
    http_status: 422
    applies_to: "POST /enrollments, POST /injury-reports, POST /provider-bills, POST /coordination-records, POST /benefit-payments"

  - priority: 8
    category: state
    check: "the addressed resource's own state permits the operation, per the §1.2 transition's `from:` set (policy status, enrollment status, family-plan verification_status, activity status, report status, claim adjudication_status and coordination_status, bill status, payment status)"
    error_id: "ERR_INVALID_POLICY_STATE | ERR_INVALID_ENROLLMENT_STATE | ERR_INVALID_FAMILY_PLAN_STATE | ERR_INVALID_ACTIVITY_STATE | ERR_INVALID_REPORT_STATE | ERR_INVALID_CLAIM_STATE | ERR_INVALID_COORDINATION_STATE | ERR_INVALID_BILL_STATE | ERR_INVALID_PAYMENT_STATE"
    http_status: 409
    applies_to: "every action endpoint and every child-creating POST"

  - priority: 9
    category: state
    check: "the governing LeaguePolicy.status is in force for the operation: BOUND or ACTIVE to create Enrollment / SanctionedActivity / to take a sanction decision; ACTIVE to create an InjuryReport or take a verification decision; ACTIVE or RUN_OFF to reprice a bill, adjudicate a claim, file a coordination record, issue a payment or quote a renewal"
    error_id: ERR_POLICY_NOT_IN_FORCE
    http_status: 409
    applies_to: "POST /enrollments, POST /sanctioned-activities, POST /sanctioned-activities/{sanctioned_activity_id}/sanction-decision, POST /injury-reports, POST /injury-reports/{injury_report_id}/return-for-correction, POST /injury-reports/{injury_report_id}/resubmit, POST /injury-reports/{injury_report_id}/verification-decision, POST /provider-bills, POST /provider-bills/{provider_bill_id}/reprice, POST /coordination-records, POST /claims/{claim_id}/request-eob, POST /claims/{claim_id}/confirm-no-other-coverage, POST /claims/{claim_id}/adjudicate, POST /benefit-payments, POST /league-policies/{league_policy_id}/renewal-quote"

  - priority: 10
    category: state
    check: "the governing League.sanctioning_status == SANCTIONED"
    error_id: ERR_LEAGUE_NOT_SANCTIONED
    http_status: 409
    applies_to: "POST /league-policies/{league_policy_id}/bind, POST /enrollments, POST /sanctioned-activities, POST /injury-reports, POST /league-policies/{league_policy_id}/renewal-quote"

  - priority: 11
    category: state
    check: "the governing LeaguePolicy.coverage_posture != FROZEN"
    error_id: ERR_POLICY_FROZEN
    http_status: 409
    applies_to: "POST /enrollments, POST /sanctioned-activities, POST /sanctioned-activities/{sanctioned_activity_id}/sanction-decision, POST /injury-reports, POST /injury-reports/{injury_report_id}/resubmit, POST /injury-reports/{injury_report_id}/verification-decision, POST /provider-bills, POST /provider-bills/{provider_bill_id}/reprice, POST /coordination-records, POST /claims/{claim_id}/request-eob, POST /claims/{claim_id}/confirm-no-other-coverage, POST /claims/{claim_id}/adjudicate, POST /benefit-payments, POST /league-policies/{league_policy_id}/renewal-quote"

  - priority: 12
    category: state
    check: "the governing LeaguePolicy.coverage_posture != CLAIMS_REVIEW; a policy under claims review may not take on new covered lives until its loss position clears"
    error_id: ERR_POLICY_UNDER_CLAIMS_REVIEW
    http_status: 409
    applies_to: "POST /enrollments"

  - priority: 13
    category: state
    check: "expected_claim_version equals the addressed Claim's current version (§1.2.1 coordination-record-create-stale-claim)"
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412
    applies_to: "POST /coordination-records"

  - priority: 14
    category: state
    check: "expected_league_policy_version equals the addressed LeaguePolicy's current version (§1.2.1 renewal-quote-stale-policy)"
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412
    applies_to: "POST /league-policies/{league_policy_id}/renewal-quote"

  - priority: 15
    category: business_safety
    check: "the referenced SanctionedActivity.is_covered_activity == true, i.e. its activity_type is one of COVERED_ACTIVITY_TYPES {PRACTICE, GAME, SANCTIONED_TRAVEL, TRYOUT}; TEAM_SOCIAL is never a covered activity"
    error_id: ERR_ACTIVITY_NOT_COVERED
    http_status: 422
    applies_to: "POST /injury-reports, POST /injury-reports/{injury_report_id}/verification-decision"

  - priority: 16
    category: business_safety
    check: "the referenced SanctionedActivity.status is acceptable for the operation: != REJECTED to file an injury report, == SANCTIONED to issue a VERIFY verification decision"
    error_id: ERR_ACTIVITY_NOT_SANCTIONED
    http_status: 422
    applies_to: "POST /injury-reports, POST /injury-reports/{injury_report_id}/verification-decision"

  - priority: 17
    category: business_safety
    check: "segregation of duties: the acting LeagueOfficial's X-User-ID must differ from the linked SanctionedActivity.sanctioning_official_id; the official who sanctioned an activity may not decide an injury report arising from it"
    error_id: ERR_OFFICIAL_SEGREGATION_VIOLATION
    http_status: 422
    applies_to: "POST /injury-reports/{injury_report_id}/verification-decision, POST /injury-reports/{injury_report_id}/return-for-correction"

  - priority: 18
    category: business_safety
    check: "catastrophic certification may only be issued or revoked on a Claim whose InjuryReport.severity_tier == CATASTROPHIC"
    error_id: ERR_SEVERITY_NOT_CATASTROPHIC
    http_status: 422
    applies_to: "POST /claims/{claim_id}/cat-certification, POST /claims/{claim_id}/cat-certification-revocation"

  - priority: 19
    category: business_safety
    check: "when LeaguePolicy.cat_layer_elected is true and benefit_before_limit_cents > cat_attachment_point_cents, the Claim's cat_certification_status must be CERTIFIED before adjudication may proceed"
    error_id: ERR_CAT_CERTIFICATION_REQUIRED
    http_status: 422
    applies_to: "POST /claims/{claim_id}/adjudicate"

  - priority: 20
    category: business_temporal
    check: "injury_datetime falls inside the referenced activity's CLOSED window [starts_at, ends_at] (endpoints inclusive)"
    error_id: ERR_INJURY_OUTSIDE_ACTIVITY_WINDOW
    http_status: 422
    applies_to: "POST /injury-reports"

  - priority: 21
    category: business_temporal
    check: "days_to_report <= FILING_WINDOW_DAYS (90), per calculations.injury_report_timeliness"
    error_id: ERR_FILING_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /injury-reports"

  - priority: 22
    category: business_temporal
    check: "whole UTC days from the InjuryReport's created_at to the logical clock <= VERIFICATION_WINDOW_DAYS (30)"
    error_id: ERR_VERIFICATION_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /injury-reports/{injury_report_id}/resubmit, POST /injury-reports/{injury_report_id}/verification-decision"

  - priority: 23
    category: business_temporal
    check: "the activity's unbuffered closed window [starts_at, ends_at] lies inside the governing policy's half-open term [term_effective_date, term_expiration_date), and starts_at <= ends_at"
    error_id: ERR_ACTIVITY_OUTSIDE_TERM
    http_status: 422
    applies_to: "POST /sanctioned-activities"

  - priority: 24
    category: business_temporal
    check: "enrolled_on_date lies inside the governing policy's half-open term [term_effective_date, term_expiration_date)"
    error_id: ERR_ENROLLMENT_OUTSIDE_TERM
    http_status: 422
    applies_to: "POST /enrollments"

  - priority: 25
    category: business_temporal
    check: "service_date lies inside the governing policy's half-open term [term_effective_date, term_expiration_date)"
    error_id: ERR_SERVICE_DATE_OUTSIDE_TERM
    http_status: 422
    applies_to: "POST /provider-bills"

  - priority: 26
    category: business_temporal
    check: "term_effective_date < term_expiration_date on policy creation; on renewal quoting, renewal_effective_date >= the expiring term's term_expiration_date (the renewal term may abut the expiring term but may not reach back into it)"
    error_id: ERR_TERM_DATES_INVALID
    http_status: 422
    applies_to: "POST /league-policies, POST /league-policies/{league_policy_id}/renewal-quote"

  - priority: 27
    category: business_temporal
    check: "coordination is settled: coordination_status IN {EOB_RECEIVED, EOB_WAIVED, NO_OTHER_COVERAGE_CONFIRMED}. Evaluated AFTER the lazy EOB_REQUESTED -> EOB_WAIVED sweep, so a claim whose explanation-of-benefits request is more than EOB_WINDOW_DAYS old passes this check"
    error_id: ERR_COORDINATION_INCOMPLETE
    http_status: 422
    applies_to: "POST /claims/{claim_id}/adjudicate"

  - priority: 28
    category: business_constraint
    check: "no other LeaguePolicy with the same (league_id, sport_classification_id) and status IN {BOUND, ACTIVE, RUN_OFF} has a half-open term that intersects this policy's half-open term; terms that merely abut (previous term_expiration_date == this term_effective_date) do NOT intersect and are allowed"
    error_id: ERR_POLICY_TERM_OVERLAP
    http_status: 409
    applies_to: "POST /league-policies/{league_policy_id}/bind"

  - priority: 29
    category: business_constraint
    check: "no buffered closed-interval collision exists per calculations.participant_activity_conflict_window against activities of every policy that shares an ENROLLED Participant with this one"
    error_id: ERR_PARTICIPANT_ACTIVITY_CONFLICT
    http_status: 409
    applies_to: "POST /sanctioned-activities"

  - priority: 30
    category: business_constraint
    check: "no existing Enrollment with status == ENROLLED already pairs this participant_id with this league_policy_id"
    error_id: ERR_DUPLICATE_ENROLLMENT
    http_status: 409
    applies_to: "POST /enrollments"

  - priority: 31
    category: business_constraint
    check: "correction_round_count < MAX_CORRECTION_ROUNDS (2); an official may return a report for correction at most twice"
    error_id: ERR_CORRECTION_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /injury-reports/{injury_report_id}/return-for-correction"

  - priority: 32
    category: business_constraint
    check: "the bill's service_category is a declared key of the governing SportClassification.service_category_caps benefit schedule"
    error_id: ERR_SERVICE_CATEGORY_NOT_SCHEDULED
    http_status: 422
    applies_to: "POST /provider-bills/{provider_bill_id}/reprice"

  - priority: 33
    category: business_constraint
    check: "league_code is unique across League rows; sport_code is unique across SportClassification rows"
    error_id: "ERR_DUPLICATE_LEAGUE_CODE | ERR_DUPLICATE_SPORT_CODE"
    http_status: 409
    applies_to: "POST /leagues, POST /sport-classifications"

  - priority: 34
    category: business_constraint
    check: "the set of FamilyHealthPlan rows of the claim's Participant with coverage_state == ACTIVE and verification_status != NO_COVERAGE_ATTESTED is EMPTY; any single such plan is other coverage on file"
    error_id: ERR_OTHER_COVERAGE_ON_FILE
    http_status: 409
    applies_to: "POST /claims/{claim_id}/confirm-no-other-coverage"

  - priority: 35
    category: business_constraint
    check: "the governing LeaguePolicy.coverage_basis_election == FULL_EXCESS_PERMITTED; a policy written on an EXCESS_ONLY basis may never run a claim as program-primary"
    error_id: ERR_FULL_EXCESS_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /claims/{claim_id}/confirm-no-other-coverage"

  - priority: 36
    category: business_constraint
    check: "at least one FamilyHealthPlan of the claim's Participant has coverage_state == ACTIVE and verification_status != NO_COVERAGE_ATTESTED; there is nothing to request an explanation of benefits from otherwise"
    error_id: ERR_NO_OTHER_COVERAGE_ON_FILE
    http_status: 409
    applies_to: "POST /claims/{claim_id}/request-eob"

  - priority: 37
    category: business_constraint
    check: "no BenefitPayment with status == ISSUED references the resource being voided or withdrawn"
    error_id: ERR_PAYMENT_ON_FILE
    http_status: 409
    applies_to: "POST /provider-bills/{provider_bill_id}/void, POST /claims/{claim_id}/withdraw"

  - priority: 38
    category: business_fiscal
    check: "enrolled_participant_count >= SportClassification.minimum_participants"
    error_id: ERR_MINIMUM_PARTICIPANTS_NOT_MET
    http_status: 422
    applies_to: "POST /league-policies/{league_policy_id}/bind"

  - priority: 39
    category: business_fiscal
    check: "the governing Enrollment.coverage_status != LIFETIME_EXHAUSTED"
    error_id: ERR_LIFETIME_BENEFIT_EXHAUSTED
    http_status: 422
    applies_to: "POST /injury-reports, POST /injury-reports/{injury_report_id}/verification-decision"

  - priority: 40
    category: business_fiscal
    check: "no open Claim (adjudication_status IN {PENDING_COORDINATION, UNDER_ADJUDICATION, APPROVED}) hangs off the resource being closed out"
    error_id: "ERR_OPEN_CLAIMS_ON_ENROLLMENT | ERR_OPEN_CLAIMS_ON_POLICY"
    http_status: 409
    applies_to: "POST /enrollments/{enrollment_id}/withdraw, POST /league-policies/{league_policy_id}/cancel (run-off deliberately does NOT carry this check: running a term off is exactly how open claims are allowed to finish)"

  - priority: 41
    category: business_fiscal
    check: "the payment does not overdraw its layer: for layer == BASE, paid_base_cents + amount_cents <= base_layer_benefit_cents; for layer == CATASTROPHIC, paid_cat_cents + amount_cents <= cat_layer_benefit_cents"
    error_id: ERR_PAYMENT_EXCEEDS_BENEFIT
    http_status: 422
    applies_to: "POST /benefit-payments"

  - priority: 42
    category: business_fiscal
    check: "the policy's paid_loss_cents + amount_cents <= aggregate_limit_cents; the term aggregate is a hard ceiling on cash out the door"
    error_id: ERR_AGGREGATE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /benefit-payments"

# ============================================================================
# §1.5 API Endpoint Table
# All collections are mounted flat at the API root (api_prefix "/").
# ============================================================================
endpoints:

  # ---- test-driving surface -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock to an arbitrary ISO 8601 UTC instant. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time; every filing, verification and explanation-of-benefits window in this scaffold is measured against this logical clock."
    roles: [ProgramAdministrator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "re-evaluates every FamilyHealthPlan.coverage_state against the new instant"
      - "re-evaluates the lazy Claim EOB_REQUESTED -> EOB_WAIVED sweep on the next touch of each claim"

  # ---- League ---------------------------------------------------------------
  - method: POST
    path: "/leagues"
    description: "Register a youth sports league. sanctioning_status starts at SANCTIONED."
    roles: [ProgramAdministrator]
    code: 201
    input: [name, league_code, state_code, governing_body_code, contact_email]
    output: League
    side_effects: ["sets in_force_policy_count to 0"]

  - method: GET
    path: "/leagues/{league_id}"
    description: "Read one league."
    roles: [ProgramAdministrator, LeagueAdministrator]
    code: 200
    input: []
    output: League
    side_effects: []

  - method: GET
    path: "/leagues"
    description: "List leagues."
    roles: [ProgramAdministrator]
    code: 200
    input: ["state_code?", "sanctioning_status?", "limit?", "offset?"]
    output: League[]
    side_effects: []

  - method: POST
    path: "/leagues/{league_id}/sanctioning-status"
    description: "Record a governing-body sanctioning decision on the league."
    roles: [ProgramAdministrator]
    code: 200
    input: [sanctioning_status, reason]
    output: League
    side_effects:
      - "increments League.version by 1"
      - "recomputes coverage_posture on every LeaguePolicy of this league"
      - "on SUSPENDED, runs CASCADE D: policies FROZEN -> their PENDING_SANCTION activities REJECTED (rejection_reason POLICY_FROZEN) -> injury reports on those activities that are still PENDING_VERIFICATION or RETURNED_FOR_CORRECTION become REJECTED (rejection_reason ACTIVITY_NOT_SANCTIONED)"

  # ---- SportClassification --------------------------------------------------
  - method: POST
    path: "/sport-classifications"
    description: "Create a sport/age-band classification: hazard class, manual rate, every coverage limit and the benefit schedule."
    roles: [ProgramAdministrator]
    code: 201
    input: [sport_code, sport_name, hazard_class, base_rate_per_participant_cents, deductible_cents, per_injury_limit_cents, cat_attachment_point_cents, aggregate_limit_cents, cat_lifetime_max_cents, minimum_participants, travel_buffer_minutes, service_category_caps]
    output: SportClassification
    side_effects: ["sets hazard_load_bps from HAZARD_LOAD_BPS[hazard_class]"]

  - method: GET
    path: "/sport-classifications/{sport_classification_id}"
    description: "Read one sport classification."
    roles: [ProgramAdministrator, LeagueAdministrator, ClaimsExaminer]
    code: 200
    input: []
    output: SportClassification
    side_effects: []

  - method: GET
    path: "/sport-classifications"
    description: "List sport classifications."
    roles: [ProgramAdministrator, LeagueAdministrator]
    code: 200
    input: ["hazard_class?", "limit?", "offset?"]
    output: SportClassification[]
    side_effects: []

  # ---- LeaguePolicy ---------------------------------------------------------
  - method: POST
    path: "/league-policies"
    description: "Quote a policy term for one league on one sport classification. Premium fields are computed immediately so the league can see the quote before binding."
    roles: [ProgramAdministrator]
    code: 201
    input: [league_id, sport_classification_id, term_effective_date, term_expiration_date, enrolled_participant_count, "coverage_basis_election?", "cat_layer_elected?"]
    output: LeaguePolicy
    side_effects:
      - "status = QUOTED, renewal_quote_status = NONE"
      - "mirrors deductible_cents, per_injury_limit_cents, cat_attachment_point_cents, aggregate_limit_cents and cat_lifetime_max_cents from the SportClassification"
      - "runs calculations.policy_gross_premium_banded then calculations.policy_annual_premium_assembly"
      - "runs calculations.policy_coverage_posture"

  - method: GET
    path: "/league-policies/{league_policy_id}"
    description: "Read one policy including its premium build-up, loss aggregates and renewal block."
    roles: [ProgramAdministrator, LeagueAdministrator, ClaimsExaminer]
    code: 200
    input: []
    output: LeaguePolicy
    side_effects: []

  - method: GET
    path: "/league-policies"
    description: "List policies, filterable by holding league, sport classification and lifecycle state."
    roles: [ProgramAdministrator, LeagueAdministrator, ClaimsExaminer]
    code: 200
    input: ["league_id?", "sport_classification_id?", "status?", "coverage_posture?", "limit?", "offset?"]
    output: LeaguePolicy[]
    side_effects: []

  - method: POST
    path: "/league-policies/{league_policy_id}/bind"
    description: "Bind the quoted term. Re-rates the premium, enforces the minimum head count and the no-overlapping-term rule."
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: LeaguePolicy
    side_effects:
      - "status QUOTED -> BOUND; increments LeaguePolicy.version by 1"
      - "re-runs calculations.policy_gross_premium_banded and calculations.policy_annual_premium_assembly"
      - "increments League.in_force_policy_count by 1"

  - method: POST
    path: "/league-policies/{league_policy_id}/activate"
    description: "Put the bound term on risk once the logical clock has reached its effective date."
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: LeaguePolicy
    side_effects: ["status BOUND -> ACTIVE; increments LeaguePolicy.version by 1", "recomputes coverage_posture"]

  - method: POST
    path: "/league-policies/{league_policy_id}/run-off"
    description: "Move an expired term into run-off so its open claims can finish while no new exposure is written."
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: LeaguePolicy
    side_effects:
      - "status ACTIVE -> RUN_OFF; increments LeaguePolicy.version by 1"
      - "if open_claim_count is already 0, the system RUN_OFF -> CLOSED transition fires in the same request and League.in_force_policy_count is decremented"

  - method: POST
    path: "/league-policies/{league_policy_id}/cancel"
    description: "Cancel a policy term that carries no open claims."
    roles: [ProgramAdministrator]
    code: 200
    input: [cancel_reason]
    output: LeaguePolicy
    side_effects:
      - "status -> CANCELLED; increments LeaguePolicy.version by 1; coverage_posture becomes FROZEN"
      - "from BOUND or ACTIVE, decrements League.in_force_policy_count by 1"
      - "from ACTIVE, every PENDING_SANCTION SanctionedActivity of this policy becomes REJECTED with rejection_reason POLICY_FROZEN"

  - method: POST
    path: "/league-policies/{league_policy_id}/renewal-quote"
    description: "Quote the following term off this term's loss experience. The loss basis is elected by the underwriter and decides which loss ratio sets the experience modifier."
    roles: [ProgramAdministrator]
    code: 200
    input: [loss_experience_basis, renewal_effective_date, renewal_enrolled_participant_count, expected_league_policy_version]
    output: LeaguePolicy
    side_effects:
      - "increments LeaguePolicy.version by 1"
      - "renewal_quote_status -> QUOTED; overwrites any previous renewal block"
      - "runs calculations.renewal_quoted_premium, freezing renewal_loss_ratio_bps, renewal_experience_tier, renewal_experience_modifier_bps, renewal_base_premium_cents and renewal_quoted_premium_cents"

  - method: POST
    path: "/league-policies/{league_policy_id}/renewal-acceptance"
    description: "The league accepts the quoted renewal terms."
    roles: [LeagueAdministrator]
    code: 200
    input: []
    output: LeaguePolicy
    side_effects: ["renewal_quote_status QUOTED -> ACCEPTED; increments LeaguePolicy.version by 1"]

  - method: GET
    path: "/league-policies/{league_policy_id}/loss-experience"
    description: "Computed read of the policy's loss position: paid loss, case reserves, incurred loss, both loss ratios, the open-claim count, the experience tier and the current coverage posture."
    roles: [ProgramAdministrator, LeagueAdministrator, ClaimsExaminer]
    code: 200
    input: []
    output: LeaguePolicy
    side_effects: []

  # ---- Participant ----------------------------------------------------------
  - method: POST
    path: "/participants"
    description: "Add an athlete to a league roster."
    roles: [LeagueAdministrator]
    code: 201
    input: [league_id, first_name, last_name, date_of_birth, guardian_email, "guardian_phone?"]
    output: Participant
    side_effects: ["roster_status = ROSTERED, enrolled_policy_count = 0"]

  - method: GET
    path: "/participants/{participant_id}"
    description: "Read one athlete."
    roles: [ProgramAdministrator, LeagueAdministrator, ClaimsExaminer, GuardianPortal]
    code: 200
    input: []
    output: Participant
    side_effects: []

  - method: GET
    path: "/participants"
    description: "List athletes, filterable by holding league."
    roles: [ProgramAdministrator, LeagueAdministrator]
    code: 200
    input: ["league_id?", "roster_status?", "limit?", "offset?"]
    output: Participant[]
    side_effects: []

  # ---- Enrollment -----------------------------------------------------------
  - method: POST
    path: "/enrollments"
    description: "Enrol an athlete under a sport policy. One athlete may be enrolled under several policies at once."
    roles: [LeagueAdministrator]
    code: 201
    input: [participant_id, league_policy_id, enrolled_on_date]
    output: Enrollment
    side_effects:
      - "status = ENROLLED, lifetime_cat_benefit_used_cents = 0, coverage_status = COVERED"
      - "recomputes Participant.enrolled_policy_count and Participant.roster_status"

  - method: GET
    path: "/enrollments/{enrollment_id}"
    description: "Read one enrollment including its lifetime catastrophic usage."
    roles: [ProgramAdministrator, LeagueAdministrator, ClaimsExaminer]
    code: 200
    input: []
    output: Enrollment
    side_effects: []

  - method: GET
    path: "/enrollments"
    description: "List enrollments, filterable by athlete and by policy."
    roles: [ProgramAdministrator, LeagueAdministrator, ClaimsExaminer]
    code: 200
    input: ["participant_id?", "league_policy_id?", "status?", "coverage_status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []

  - method: POST
    path: "/enrollments/{enrollment_id}/withdraw"
    description: "Withdraw an athlete from a policy roster."
    roles: [LeagueAdministrator]
    code: 200
    input: [withdrawal_note]
    output: Enrollment
    side_effects:
      - "status ENROLLED -> WITHDRAWN; increments Enrollment.version by 1"
      - "sets withdrawn_on_date to the logical clock; coverage_status becomes WITHDRAWN_NO_COVERAGE"
      - "recomputes Participant.enrolled_policy_count and Participant.roster_status"

  # ---- FamilyHealthPlan -----------------------------------------------------
  - method: POST
    path: "/family-health-plans"
    description: "Record the family's other health coverage for an athlete. coverage_state is derived from the logical clock against effective_date and termination_date."
    roles: [GuardianPortal, ClaimsExaminer]
    code: 201
    input: [participant_id, carrier_name, policy_number, plan_type, individual_deductible_cents, coinsurance_bps, effective_date, "termination_date?"]
    output: FamilyHealthPlan
    side_effects: ["verification_status = UNVERIFIED", "computes coverage_state from the logical clock"]

  - method: GET
    path: "/family-health-plans/{family_health_plan_id}"
    description: "Read one family health plan."
    roles: [ProgramAdministrator, ClaimsExaminer, GuardianPortal]
    code: 200
    input: []
    output: FamilyHealthPlan
    side_effects: []

  - method: GET
    path: "/family-health-plans"
    description: "List family health plans, filterable by athlete."
    roles: [ProgramAdministrator, ClaimsExaminer, GuardianPortal]
    code: 200
    input: ["participant_id?", "verification_status?", "coverage_state?", "limit?", "offset?"]
    output: FamilyHealthPlan[]
    side_effects: []

  - method: POST
    path: "/family-health-plans/{family_health_plan_id}/verification"
    description: "Record the carrier verification outcome. NO_COVERAGE_ATTESTED removes the plan from the other-coverage-on-file set."
    roles: [ClaimsExaminer]
    code: 200
    input: [decision, note]
    output: FamilyHealthPlan
    side_effects:
      - "verification_status UNVERIFIED -> VERIFIED or NO_COVERAGE_ATTESTED; increments FamilyHealthPlan.version by 1"
      - "sets verified_at to the logical clock and verified_by_user_id to X-User-ID"

  # ---- SanctionedActivity ---------------------------------------------------
  - method: POST
    path: "/sanctioned-activities"
    description: "Schedule a team activity under a policy. Runs the per-athlete buffered closed-interval conflict check across every policy that shares an enrolled athlete."
    roles: [LeagueAdministrator]
    code: 201
    input: [league_policy_id, activity_type, venue_name, starts_at, ends_at, "travel_buffer_minutes?"]
    output: SanctionedActivity
    side_effects:
      - "status = PENDING_SANCTION"
      - "travel_buffer_minutes defaults to the governing SportClassification.travel_buffer_minutes when omitted"
      - "computes is_covered_activity from activity_type"

  - method: GET
    path: "/sanctioned-activities/{sanctioned_activity_id}"
    description: "Read one activity."
    roles: [ProgramAdministrator, LeagueAdministrator, LeagueOfficial, ClaimsExaminer]
    code: 200
    input: []
    output: SanctionedActivity
    side_effects: []

  - method: GET
    path: "/sanctioned-activities"
    description: "List activities, filterable by policy."
    roles: [ProgramAdministrator, LeagueAdministrator, LeagueOfficial, ClaimsExaminer]
    code: 200
    input: ["league_policy_id?", "status?", "activity_type?", "limit?", "offset?"]
    output: SanctionedActivity[]
    side_effects: []

  - method: POST
    path: "/sanctioned-activities/{sanctioned_activity_id}/sanction-decision"
    description: "A league official sanctions or declines a scheduled activity. SANCTION records the official's id, which then bars that official from deciding injury reports arising from the activity."
    roles: [LeagueOfficial]
    code: 200
    input: [decision, "reason?"]
    output: SanctionedActivity
    side_effects:
      - "status PENDING_SANCTION -> SANCTIONED (decision=SANCTION) or -> REJECTED with rejection_reason OFFICIAL_DECLINED (decision=REJECT); increments SanctionedActivity.version by 1"
      - "on SANCTION, sets sanctioning_official_id to X-User-ID"

  # ---- InjuryReport ---------------------------------------------------------
  - method: POST
    path: "/injury-reports"
    description: "File an injury report against a covered activity for an enrolled athlete. Stamps reported_on_date from the logical clock and enforces the 90-day filing window."
    roles: [LeagueAdministrator]
    code: 201
    input: [enrollment_id, sanctioned_activity_id, injury_datetime, body_part, injury_description, severity_tier]
    output: InjuryReport
    side_effects:
      - "status = PENDING_VERIFICATION, correction_round_count = 0"
      - "stamps reported_on_date and computes days_to_report per calculations.injury_report_timeliness"

  - method: GET
    path: "/injury-reports/{injury_report_id}"
    description: "Read one injury report."
    roles: [ProgramAdministrator, LeagueAdministrator, LeagueOfficial, ClaimsExaminer, MedicalReviewer]
    code: 200
    input: []
    output: InjuryReport
    side_effects: []

  - method: GET
    path: "/injury-reports"
    description: "List injury reports, filterable by enrollment and by activity."
    roles: [ProgramAdministrator, LeagueAdministrator, LeagueOfficial, ClaimsExaminer, MedicalReviewer]
    code: 200
    input: ["enrollment_id?", "sanctioned_activity_id?", "status?", "severity_tier?", "limit?", "offset?"]
    output: InjuryReport[]
    side_effects: []

  - method: POST
    path: "/injury-reports/{injury_report_id}/return-for-correction"
    description: "A league official returns an incomplete report to the league. Allowed at most MAX_CORRECTION_ROUNDS times."
    roles: [LeagueOfficial]
    code: 200
    input: [correction_note]
    output: InjuryReport
    side_effects:
      - "status PENDING_VERIFICATION -> RETURNED_FOR_CORRECTION; increments InjuryReport.version by 1"
      - "increments correction_round_count by 1 and stores correction_note"

  - method: POST
    path: "/injury-reports/{injury_report_id}/resubmit"
    description: "The league resubmits a corrected report. correction_round_count is NOT reset."
    roles: [LeagueAdministrator]
    code: 200
    input: [injury_description, severity_tier]
    output: InjuryReport
    side_effects:
      - "status RETURNED_FOR_CORRECTION -> PENDING_VERIFICATION; increments InjuryReport.version by 1"
      - "overwrites injury_description and severity_tier"

  - method: POST
    path: "/injury-reports/{injury_report_id}/verification-decision"
    description: "A league official verifies or rejects the report. VERIFY opens the claim (CASCADE A, five hops). The deciding official may not be the official who sanctioned the activity."
    roles: [LeagueOfficial]
    code: 200
    input: [decision, "official_attestation?", "reason?"]
    output: InjuryReport
    side_effects:
      - "status PENDING_VERIFICATION -> VERIFIED (decision=VERIFY) or -> REJECTED with rejection_reason OFFICIAL_DECLINED (decision=REJECT); increments InjuryReport.version by 1"
      - "on VERIFY, CASCADE A link 2: creates one Claim (adjudication_status PENDING_COORDINATION, coordination_status NOT_STARTED) with reserve_amount_cents from calculations.claim_reserve_amount. The Claim is NOT in this response body; discover it with GET /claims?injury_report_id=..."
      - "on VERIFY, CASCADE A links 3-5: LeaguePolicy loss aggregates and coverage_posture are recomputed and, if the policy becomes FROZEN, its PENDING_SANCTION activities are REJECTED"

  # ---- Claim ----------------------------------------------------------------
  - method: GET
    path: "/claims/{claim_id}"
    description: "Read one claim: both state axes, the whole benefit determination, payment totals and the family's protected balance."
    roles: [ProgramAdministrator, LeagueAdministrator, ClaimsExaminer, MedicalReviewer, GuardianPortal]
    code: 200
    input: []
    output: Claim
    side_effects: ["runs the lazy EOB_REQUESTED -> EOB_WAIVED sweep for this claim before rendering"]

  - method: GET
    path: "/claims"
    description: "List claims, filterable by originating report, policy and enrollment. This is the only discovery channel for a cascade-created Claim."
    roles: [ProgramAdministrator, LeagueAdministrator, ClaimsExaminer, MedicalReviewer, GuardianPortal]
    code: 200
    input: ["injury_report_id?", "league_policy_id?", "enrollment_id?", "adjudication_status?", "coordination_status?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []

  - method: POST
    path: "/claims/{claim_id}/request-eob"
    description: "Request the explanation of benefits from the family's other carrier, starting the 45-day waiver clock."
    roles: [ClaimsExaminer]
    code: 200
    input: ["note?"]
    output: Claim
    side_effects:
      - "coordination_status NOT_STARTED -> EOB_REQUESTED; increments Claim.version by 1"
      - "sets eob_requested_at to the logical clock"

  - method: POST
    path: "/claims/{claim_id}/confirm-no-other-coverage"
    description: "Confirm the athlete carries no other coverage, putting the claim on a full-excess (program-primary) footing with a doubled deductible."
    roles: [ClaimsExaminer]
    code: 200
    input: [attestation_note]
    output: Claim
    side_effects:
      - "coordination_status NOT_STARTED -> NO_OTHER_COVERAGE_CONFIRMED; increments Claim.version by 1"
      - "coordination_basis becomes FULL_EXCESS and the benefit determination is recomputed with a doubled deductible basis"

  - method: POST
    path: "/claims/{claim_id}/cat-certification"
    description: "A medical reviewer certifies the injury as catastrophic, unlocking the catastrophic excess layer."
    roles: [MedicalReviewer]
    code: 200
    input: [certification_note]
    output: Claim
    side_effects:
      - "cat_certification_status -> CERTIFIED; increments Claim.version by 1"
      - "sets cat_certified_at, cat_certified_by_user_id and cat_certification_note"
      - "recomputes calculations.claim_benefit_determination, which may raise cat_layer_benefit_cents above 0"

  - method: POST
    path: "/claims/{claim_id}/cat-certification-revocation"
    description: "A medical reviewer revokes a catastrophic certification issued in error."
    roles: [MedicalReviewer]
    code: 200
    input: [revocation_reason]
    output: Claim
    side_effects:
      - "cat_certification_status CERTIFIED -> REVOKED; increments Claim.version by 1"
      - "sets cat_revocation_reason"
      - "recomputes calculations.claim_benefit_determination, dropping cat_layer_benefit_cents back to 0"

  - method: POST
    path: "/claims/{claim_id}/adjudicate"
    description: "Adjudicate the claim against the covered activity and the settled coordination position. Freezes the benefit determination and branches to APPROVED or DENIED."
    roles: [ClaimsExaminer]
    code: 200
    input: [examiner_note]
    output: Claim
    side_effects:
      - "adjudication_status UNDER_ADJUDICATION -> APPROVED, or -> DENIED with denial_reason ENROLLMENT_WITHDRAWN or NO_BENEFIT_PAYABLE; increments Claim.version by 1"
      - "sets adjudicated_at and adjudicated_by_user_id and freezes the determination fields"
      - "every REPRICED ProviderBill of this claim becomes ADJUDICATED (on APPROVED) or DENIED (on DENIED)"
      - "on DENIED, the claim leaves the open set and the policy's loss aggregates, experience_tier and coverage_posture are recomputed"

  - method: POST
    path: "/claims/{claim_id}/withdraw"
    description: "The league withdraws a claim that has had no benefit dollars paid on it."
    roles: [LeagueAdministrator]
    code: 200
    input: [withdrawal_reason]
    output: Claim
    side_effects:
      - "adjudication_status -> WITHDRAWN; increments Claim.version by 1"
      - "every SUBMITTED, REPRICED or ADJUDICATED ProviderBill of this claim becomes VOIDED with void_reason CLAIM_WITHDRAWN"
      - "the claim leaves the open set, so LeaguePolicy.reserve_cents, incurred_loss_cents, open_claim_count, both loss ratios, experience_tier and coverage_posture are recomputed"

  # ---- ProviderBill ---------------------------------------------------------
  - method: POST
    path: "/provider-bills"
    description: "Record a provider charge against a claim."
    roles: [ClaimsExaminer]
    code: 201
    input: [claim_id, provider_npi, provider_name, network_status, service_category, service_date, billed_charge_cents, fee_schedule_amount_cents]
    output: ProviderBill
    side_effects: ["status = SUBMITTED, allowed_amount_cents = 0; no repricing happens at create time"]

  - method: GET
    path: "/provider-bills/{provider_bill_id}"
    description: "Read one provider bill including its allowed amount, balance billed and the family's protected share."
    roles: [ProgramAdministrator, ClaimsExaminer, GuardianPortal]
    code: 200
    input: []
    output: ProviderBill
    side_effects: []

  - method: GET
    path: "/provider-bills"
    description: "List provider bills, filterable by claim."
    roles: [ProgramAdministrator, ClaimsExaminer, GuardianPortal]
    code: 200
    input: ["claim_id?", "status?", "network_status?", "service_category?", "limit?", "offset?"]
    output: ProviderBill[]
    side_effects: []

  - method: POST
    path: "/provider-bills/{provider_bill_id}/reprice"
    description: "Reprice the charge to an allowed amount against the network status, the fee schedule and the severity-adjusted benefit schedule cap."
    roles: [ClaimsExaminer]
    code: 200
    input: []
    output: ProviderBill
    side_effects:
      - "status SUBMITTED -> REPRICED; increments ProviderBill.version by 1"
      - "runs calculations.provider_bill_allowed_amount, setting negotiated_amount_cents, scheduled_cap_cents, allowed_amount_cents, balance_billed_cents and family_responsibility_cents"
      - "sets repriced_at and repriced_by_user_id"
      - "recomputes the parent Claim's totals and calculations.claim_benefit_determination, and drives the Claim PENDING_COORDINATION -> UNDER_ADJUDICATION if it is the first reprice"

  - method: POST
    path: "/provider-bills/{provider_bill_id}/void"
    description: "Void a provider charge that carries no issued benefit payment."
    roles: [ClaimsExaminer]
    code: 200
    input: [void_reason]
    output: ProviderBill
    side_effects:
      - "status -> VOIDED; increments ProviderBill.version by 1"
      - "from SUBMITTED or REPRICED, recomputes the parent Claim's totals and benefit determination; from ADJUDICATED, only the balance and family-responsibility totals are recomputed because the determination is frozen"

  # ---- CoordinationRecord ---------------------------------------------------
  - method: POST
    path: "/coordination-records"
    description: "File an explanation of benefits from the family's carrier against one provider charge. A corrected explanation of benefits supersedes the prior ACTIVE record for the same (provider_bill_id, family_health_plan_id) pair, so the write is guarded by optimistic concurrency on the claim."
    roles: [ClaimsExaminer]
    code: 201
    input: [claim_id, provider_bill_id, family_health_plan_id, eob_received_date, other_plan_allowed_cents, other_plan_paid_cents, patient_responsibility_cents, expected_claim_version]
    output: CoordinationRecord
    side_effects:
      - "status = ACTIVE; increments Claim.version by 1"
      - "any prior ACTIVE CoordinationRecord for the same (provider_bill_id, family_health_plan_id) pair becomes SUPERSEDED with superseded_by_record_id set to this new record"
      - "drives the Claim coordination_status EOB_REQUESTED -> EOB_RECEIVED on the first record"
      - "recomputes the Claim's other_insurance_paid_cents and calculations.claim_benefit_determination"

  - method: GET
    path: "/coordination-records/{coordination_record_id}"
    description: "Read one explanation-of-benefits record."
    roles: [ProgramAdministrator, ClaimsExaminer]
    code: 200
    input: []
    output: CoordinationRecord
    side_effects: []

  - method: GET
    path: "/coordination-records"
    description: "List explanation-of-benefits records, filterable by claim, by provider bill, by family plan and by the record they superseded."
    roles: [ProgramAdministrator, ClaimsExaminer]
    code: 200
    input: ["claim_id?", "provider_bill_id?", "family_health_plan_id?", "superseded_by_record_id?", "status?", "limit?", "offset?"]
    output: CoordinationRecord[]
    side_effects: []

  # ---- BenefitPayment ------------------------------------------------------
  - method: POST
    path: "/benefit-payments"
    description: "Issue a benefit payment from a named coverage layer against an adjudicated charge. Catastrophic-layer dollars accumulate against the enrollment's lifetime maximum (CASCADE B, four hops)."
    roles: [ClaimsExaminer]
    code: 201
    input: [claim_id, provider_bill_id, payee_type, layer, amount_cents]
    output: BenefitPayment
    side_effects:
      - "status = ISSUED; sets issued_at to the logical clock and issued_by_user_id to X-User-ID"
      - "CASCADE B link 2: recomputes the Claim's paid_base_cents, paid_cat_cents and paid_to_date_cents and drives APPROVED -> PAID once paid_to_date_cents >= benefit_payable_cents"
      - "CASCADE B link 3: recomputes calculations.enrollment_lifetime_cat_benefit on the Enrollment, which may flip coverage_status to LIFETIME_EXHAUSTED"
      - "CASCADE B link 4: every InjuryReport of that Enrollment still PENDING_VERIFICATION or RETURNED_FOR_CORRECTION becomes REJECTED with rejection_reason LIFETIME_BENEFIT_EXHAUSTED"
      - "recomputes the LeaguePolicy's paid_loss_cents, reserve_cents, incurred_loss_cents, both loss ratios, open_claim_count, experience_tier and coverage_posture"

  - method: GET
    path: "/benefit-payments/{benefit_payment_id}"
    description: "Read one benefit payment."
    roles: [ProgramAdministrator, ClaimsExaminer, GuardianPortal]
    code: 200
    input: []
    output: BenefitPayment
    side_effects: []

  - method: GET
    path: "/benefit-payments"
    description: "List benefit payments, filterable by claim and by provider bill."
    roles: [ProgramAdministrator, ClaimsExaminer, GuardianPortal]
    code: 200
    input: ["claim_id?", "provider_bill_id?", "layer?", "payee_type?", "status?", "limit?", "offset?"]
    output: BenefitPayment[]
    side_effects: []

  - method: POST
    path: "/benefit-payments/{benefit_payment_id}/void"
    description: "Void an issued benefit payment. The compensating action for POST /benefit-payments; it must leave LeaguePolicy.paid_loss_cents exactly where it stood before the payment (CASCADE C)."
    roles: [ClaimsExaminer]
    code: 200
    input: [void_reason]
    output: BenefitPayment
    side_effects:
      - "status ISSUED -> VOIDED; increments BenefitPayment.version by 1; sets voided_at and void_reason"
      - "CASCADE C link 2: recomputes the Claim's payment totals and drives PAID -> APPROVED when paid_to_date_cents falls below benefit_payable_cents"
      - "CASCADE C link 3: recomputes the LeaguePolicy's paid_loss_cents, reserve_cents, incurred_loss_cents, both loss ratios, open_claim_count, experience_tier and coverage_posture"
      - "when layer == CATASTROPHIC, recomputes calculations.enrollment_lifetime_cat_benefit, which may lift coverage_status out of LIFETIME_EXHAUSTED"

# ============================================================================
# §1.6 Error Code Catalog
# ============================================================================
errors:

  # ---- authentication / authorization --------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or X-User-Role is not one of the six declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the authenticated role is not listed in the target endpoint's roles"
  - id: ERR_OWNERSHIP_MISMATCH
    http: 403
    condition: "an entity-backed caller reaches outside its own subtree: LeagueAdministrator whose X-User-ID is not the League that owns the addressed participant, enrollment, activity, injury report or claim; GuardianPortal whose X-User-ID is not the Participant behind the addressed family health plan, claim, provider bill or benefit payment"

  # ---- request schema -------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body; missing required field; wrong JSON type; unknown enum member; negative money or count where a non-negative integer is required; money sent as a decimal rather than integer cents; unparseable ISO 8601 date or datetime; service_category_caps missing an entry for a member of the service-category enum"

  # ---- existence ------------------------------------------------------------
  - id: ERR_LEAGUE_NOT_FOUND
    http: 404
    condition: "no League with the addressed or referenced id"
  - id: ERR_SPORT_CLASSIFICATION_NOT_FOUND
    http: 404
    condition: "no SportClassification with the addressed or referenced id"
  - id: ERR_LEAGUE_POLICY_NOT_FOUND
    http: 404
    condition: "no LeaguePolicy with the addressed or referenced id"
  - id: ERR_PARTICIPANT_NOT_FOUND
    http: 404
    condition: "no Participant with the addressed or referenced id"
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "no Enrollment with the addressed or referenced id"
  - id: ERR_FAMILY_HEALTH_PLAN_NOT_FOUND
    http: 404
    condition: "no FamilyHealthPlan with the addressed or referenced id"
  - id: ERR_SANCTIONED_ACTIVITY_NOT_FOUND
    http: 404
    condition: "no SanctionedActivity with the addressed or referenced id"
  - id: ERR_INJURY_REPORT_NOT_FOUND
    http: 404
    condition: "no InjuryReport with the addressed or referenced id"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "no Claim with the addressed or referenced id"
  - id: ERR_PROVIDER_BILL_NOT_FOUND
    http: 404
    condition: "no ProviderBill with the addressed or referenced id"
  - id: ERR_COORDINATION_RECORD_NOT_FOUND
    http: 404
    condition: "no CoordinationRecord with the addressed id"
  - id: ERR_BENEFIT_PAYMENT_NOT_FOUND
    http: 404
    condition: "no BenefitPayment with the addressed id"

  # ---- referential scope ----------------------------------------------------
  - id: ERR_SCOPE_MISMATCH
    http: 422
    condition: "two referenced entities exist but do not belong to the same aggregate: enrollment's participant is not on the policy's league; activity is not on the enrollment's policy; provider bill is not on the referenced claim; family health plan is not the claim participant's plan; benefit payment's bill is not on its claim"

  # ---- entity lifecycle state ---------------------------------------------
  - id: ERR_INVALID_POLICY_STATE
    http: 409
    condition: "the LeaguePolicy is not in a state that admits the requested transition (bind from other than QUOTED, activate from other than BOUND, run-off from other than ACTIVE, cancel from CLOSED/CANCELLED/RUN_OFF, renewal-quote from other than ACTIVE or RUN_OFF, renewal-acceptance when renewal_quote_status is not QUOTED)"
  - id: ERR_INVALID_ENROLLMENT_STATE
    http: 409
    condition: "the Enrollment is not ENROLLED where the operation requires it (withdraw of an already WITHDRAWN enrollment; filing an injury report against a WITHDRAWN enrollment)"
  - id: ERR_INVALID_FAMILY_PLAN_STATE
    http: 409
    condition: "verification requested on a FamilyHealthPlan whose verification_status is not UNVERIFIED"
  - id: ERR_INVALID_ACTIVITY_STATE
    http: 409
    condition: "sanction-decision on a SanctionedActivity that is not PENDING_SANCTION"
  - id: ERR_INVALID_REPORT_STATE
    http: 409
    condition: "the InjuryReport is not in a state that admits the request (return-for-correction or verification-decision from other than PENDING_VERIFICATION; resubmit from other than RETURNED_FOR_CORRECTION)"
  - id: ERR_INVALID_CLAIM_STATE
    http: 409
    condition: "the Claim's adjudication_status does not admit the request (adjudicate from other than UNDER_ADJUDICATION; withdraw from PAID, DENIED or WITHDRAWN; cat-certification from a terminal adjudication state; cat-certification-revocation when cat_certification_status is not CERTIFIED; benefit payment against a claim that is not APPROVED)"
  - id: ERR_INVALID_COORDINATION_STATE
    http: 409
    condition: "the Claim's coordination_status does not admit the request (request-eob from other than NOT_STARTED; confirm-no-other-coverage from other than NOT_STARTED; coordination record filed when coordination_status is neither EOB_REQUESTED nor EOB_RECEIVED)"
  - id: ERR_INVALID_BILL_STATE
    http: 409
    condition: "the ProviderBill does not admit the request (reprice from other than SUBMITTED; void from VOIDED or DENIED; benefit payment against a bill that is not ADJUDICATED)"
  - id: ERR_INVALID_PAYMENT_STATE
    http: 409
    condition: "void requested on a BenefitPayment that is not ISSUED"
  - id: ERR_POLICY_NOT_IN_FORCE
    http: 409
    condition: "an exposure-writing or claim-handling operation addresses a policy whose status is not ACTIVE (or not ACTIVE/RUN_OFF for claim handling): enrolling, scheduling an activity, filing or verifying a report, repricing, coordinating, adjudicating or paying"
  - id: ERR_LEAGUE_NOT_SANCTIONED
    http: 409
    condition: "the owning League's sanctioning_status is not SANCTIONED where the operation requires standing (binding a policy, adding a participant, enrolling, scheduling an activity)"
  - id: ERR_POLICY_FROZEN
    http: 409
    condition: "the policy's coverage_posture is FROZEN because incurred_loss_cents has reached aggregate_limit_cents, or because the policy is CANCELLED, or because the owning League.sanctioning_status is SUSPENDED; no new exposure or claim-advancing write is accepted"
  - id: ERR_POLICY_UNDER_CLAIMS_REVIEW
    http: 409
    condition: "POST /enrollments against a policy whose coverage_posture is CLAIMS_REVIEW (three or more open claims, or an incurred loss ratio at or above 6500 bps); existing exposure keeps running but no new enrollment is written"
  - id: ERR_STALE_CLAIM_VERSION
    http: 412
    condition: "expected_claim_version does not equal the addressed Claim's current version"
  - id: ERR_STALE_POLICY_VERSION
    http: 412
    condition: "expected_league_policy_version does not equal the addressed LeaguePolicy's current version"

  # ---- coverage safety -----------------------------------------------------
  - id: ERR_ACTIVITY_NOT_COVERED
    http: 422
    condition: "the injury arose on an activity whose activity_type is outside COVERED_ACTIVITY_TYPES (TEAM_SOCIAL is the only such member of the activity_type enum), so is_covered_activity is false"
  - id: ERR_ACTIVITY_NOT_SANCTIONED
    http: 422
    condition: "the activity behind the report is not in status SANCTIONED at the moment verification is attempted"
  - id: ERR_OFFICIAL_SEGREGATION_VIOLATION
    http: 422
    condition: "the league official deciding the injury report's verification is the same user id recorded as the activity's sanctioning_official_id"
  - id: ERR_SEVERITY_NOT_CATASTROPHIC
    http: 422
    condition: "catastrophic certification attempted on a claim whose originating report's severity_tier is not CATASTROPHIC"
  - id: ERR_CAT_CERTIFICATION_REQUIRED
    http: 422
    condition: "adjudication would push benefit_before_limit_cents above the policy's cat_attachment_point_cents on a cat-elected policy while cat_certification_status is not CERTIFIED"

  # ---- temporal ------------------------------------------------------------
  - id: ERR_INJURY_OUTSIDE_ACTIVITY_WINDOW
    http: 422
    condition: "injury_datetime falls outside the activity's buffer-expanded closed interval [starts_at - travel_buffer_minutes, ends_at + travel_buffer_minutes]"
  - id: ERR_FILING_WINDOW_EXPIRED
    http: 422
    condition: "the logical clock stands more than FILING_WINDOW_DAYS (90) days after injury_datetime's calendar date"
  - id: ERR_VERIFICATION_WINDOW_EXPIRED
    http: 422
    condition: "verification-decision, return-for-correction or resubmit attempted more than VERIFICATION_WINDOW_DAYS (30) days after the report's created_at"
  - id: ERR_ACTIVITY_OUTSIDE_TERM
    http: 422
    condition: "the activity's starts_at or ends_at falls outside the policy's half-open term [term_effective_date, term_expiration_date)"
  - id: ERR_ENROLLMENT_OUTSIDE_TERM
    http: 422
    condition: "enrolled_on_date falls outside the policy's half-open term"
  - id: ERR_SERVICE_DATE_OUTSIDE_TERM
    http: 422
    condition: "a provider bill's service_date falls outside the policy's half-open term, or precedes the injury_datetime's calendar date"
  - id: ERR_TERM_DATES_INVALID
    http: 422
    condition: "term_expiration_date is not strictly after term_effective_date, or a renewal_effective_date is earlier than the current term's term_expiration_date"
  - id: ERR_COORDINATION_INCOMPLETE
    http: 422
    condition: "adjudication attempted while coordination_status is NOT_STARTED, or while it is EOB_REQUESTED and the 45-day EOB waiver window has not yet elapsed"

  # ---- business constraint -------------------------------------------------
  - id: ERR_POLICY_TERM_OVERLAP
    http: 409
    condition: "binding would leave the same (league_id, sport_classification_id) pair with two non-CANCELLED terms whose half-open date ranges intersect; abutting terms that merely share an endpoint do not overlap"
  - id: ERR_PARTICIPANT_ACTIVITY_CONFLICT
    http: 409
    condition: "a scheduled activity's buffer-expanded closed interval touches or overlaps the expanded interval of another non-REJECTED activity that shares at least one enrolled participant, across every policy that participant is enrolled under"
  - id: ERR_DUPLICATE_ENROLLMENT
    http: 409
    condition: "the participant already holds an ENROLLED enrollment on the same policy"
  - id: ERR_CORRECTION_ROUNDS_EXHAUSTED
    http: 409
    condition: "return-for-correction attempted when correction_round_count already equals MAX_CORRECTION_ROUNDS (2)"
  - id: ERR_SERVICE_CATEGORY_NOT_SCHEDULED
    http: 422
    condition: "a provider bill's service_category has no entry in the governing SportClassification.service_category_caps"
  - id: ERR_DUPLICATE_LEAGUE_CODE
    http: 409
    condition: "league_code is already registered"
  - id: ERR_DUPLICATE_SPORT_CODE
    http: 409
    condition: "sport_code is already registered"
  - id: ERR_OTHER_COVERAGE_ON_FILE
    http: 409
    condition: "confirm-no-other-coverage attempted while the claim's participant holds at least one FamilyHealthPlan whose verification_status is UNVERIFIED or VERIFIED and whose coverage_state is ACTIVE"
  - id: ERR_NO_OTHER_COVERAGE_ON_FILE
    http: 409
    condition: "request-eob or a coordination record filed while the claim's participant holds no FamilyHealthPlan with an ACTIVE coverage_state"
  - id: ERR_FULL_EXCESS_NOT_PERMITTED
    http: 422
    condition: "the policy's coverage_basis_election is EXCESS_ONLY, which forbids the claim ever moving onto a FULL_EXCESS coordination_basis"
  - id: ERR_PAYMENT_ON_FILE
    http: 409
    condition: "an operation that must not destroy paid benefit dollars is attempted while an ISSUED BenefitPayment exists: voiding a provider bill, or withdrawing a claim"

  # ---- fiscal / limits -----------------------------------------------------
  - id: ERR_MINIMUM_PARTICIPANTS_NOT_MET
    http: 422
    condition: "binding a policy whose enrolled_participant_count is below the SportClassification.minimum_participants"
  - id: ERR_LIFETIME_BENEFIT_EXHAUSTED
    http: 422
    condition: "the enrollment's coverage_status is LIFETIME_EXHAUSTED because lifetime_cat_benefit_used_cents has reached cat_lifetime_max_cents"
  - id: ERR_OPEN_CLAIMS_ON_ENROLLMENT
    http: 409
    condition: "withdrawing an enrollment that still carries a claim in PENDING_COORDINATION, UNDER_ADJUDICATION or APPROVED"
  - id: ERR_OPEN_CLAIMS_ON_POLICY
    http: 409
    condition: "cancelling a policy whose open_claim_count is greater than zero; run-off is the sanctioned path for a term with open claims"
  - id: ERR_PAYMENT_EXCEEDS_BENEFIT
    http: 422
    condition: "the payment would drive the claim's paid_to_date_cents above benefit_payable_cents, or drive the layer's paid total above that layer's determined benefit (base_layer_benefit_cents or cat_layer_benefit_cents), or exceed the bill's allowed_amount_cents"
  - id: ERR_AGGREGATE_LIMIT_EXCEEDED
    http: 422
    condition: "the payment would drive the policy's paid_loss_cents above aggregate_limit_cents"

# ============================================================================
# §1.7 RBAC Matrix
# ============================================================================
roles:

  - name: ProgramAdministrator
    description: "The accident program's underwriting desk. Owns the master data (leagues, sport classifications) and the whole policy lifecycle including renewal quoting, plus the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /leagues"
      - "POST /leagues/{league_id}/sanctioning-status"
      - "POST /sport-classifications"
      - "POST /league-policies"
      - "POST /league-policies/{league_policy_id}/bind"
      - "POST /league-policies/{league_policy_id}/activate"
      - "POST /league-policies/{league_policy_id}/run-off"
      - "POST /league-policies/{league_policy_id}/cancel"
      - "POST /league-policies/{league_policy_id}/renewal-quote"
      - "GET /leagues"
      - "GET /sport-classifications"
    shared_operations:
      - "GET /leagues/{league_id}"
      - "GET /sport-classifications/{sport_classification_id}"
      - "GET /league-policies/{league_policy_id}"
      - "GET /league-policies"
      - "GET /league-policies/{league_policy_id}/loss-experience"
      - "GET /participants/{participant_id}"
      - "GET /participants"
      - "GET /enrollments/{enrollment_id}"
      - "GET /enrollments"
      - "GET /family-health-plans/{family_health_plan_id}"
      - "GET /family-health-plans"
      - "GET /sanctioned-activities/{sanctioned_activity_id}"
      - "GET /sanctioned-activities"
      - "GET /injury-reports/{injury_report_id}"
      - "GET /injury-reports"
      - "GET /claims/{claim_id}"
      - "GET /claims"
      - "GET /provider-bills/{provider_bill_id}"
      - "GET /provider-bills"
      - "GET /coordination-records/{coordination_record_id}"
      - "GET /coordination-records"
      - "GET /benefit-payments/{benefit_payment_id}"
      - "GET /benefit-payments"

  - name: LeagueAdministrator
    description: "The league's own administrator. Builds the roster, enrols athletes, schedules activities, files injury reports, accepts renewal terms and may withdraw a claim the league no longer wishes to pursue. X-User-ID is the id of the League acted for; every write is confined to that league's own subtree."
    identity: "entity_backed:League"
    exclusive_operations:
      - "POST /participants"
      - "POST /enrollments"
      - "POST /enrollments/{enrollment_id}/withdraw"
      - "POST /sanctioned-activities"
      - "POST /injury-reports"
      - "POST /injury-reports/{injury_report_id}/resubmit"
      - "POST /claims/{claim_id}/withdraw"
      - "POST /league-policies/{league_policy_id}/renewal-acceptance"
    shared_operations:
      - "GET /leagues/{league_id}"
      - "GET /sport-classifications/{sport_classification_id}"
      - "GET /sport-classifications"
      - "GET /league-policies/{league_policy_id}"
      - "GET /league-policies"
      - "GET /league-policies/{league_policy_id}/loss-experience"
      - "GET /participants/{participant_id}"
      - "GET /participants"
      - "GET /enrollments/{enrollment_id}"
      - "GET /enrollments"
      - "GET /sanctioned-activities/{sanctioned_activity_id}"
      - "GET /sanctioned-activities"
      - "GET /injury-reports/{injury_report_id}"
      - "GET /injury-reports"
      - "GET /claims/{claim_id}"
      - "GET /claims"

  - name: LeagueOfficial
    description: "A credentialed official of the governing body. Sanctions scheduled activities and independently verifies injury reports. The official who sanctioned an activity is barred from verifying reports arising from it, so at least two distinct official user ids are needed to move any claim forward."
    identity: "opaque"
    exclusive_operations:
      - "POST /sanctioned-activities/{sanctioned_activity_id}/sanction-decision"
      - "POST /injury-reports/{injury_report_id}/return-for-correction"
      - "POST /injury-reports/{injury_report_id}/verification-decision"
    shared_operations:
      - "GET /sanctioned-activities/{sanctioned_activity_id}"
      - "GET /sanctioned-activities"
      - "GET /injury-reports/{injury_report_id}"
      - "GET /injury-reports"

  - name: ClaimsExaminer
    description: "The program's claims desk. Verifies other coverage, prices provider charges, collects explanations of benefits, adjudicates the claim and issues benefit payments. Cannot certify a catastrophic injury and cannot touch the policy lifecycle."
    identity: "opaque"
    exclusive_operations:
      - "POST /family-health-plans/{family_health_plan_id}/verification"
      - "POST /claims/{claim_id}/request-eob"
      - "POST /claims/{claim_id}/confirm-no-other-coverage"
      - "POST /claims/{claim_id}/adjudicate"
      - "POST /provider-bills"
      - "POST /provider-bills/{provider_bill_id}/reprice"
      - "POST /provider-bills/{provider_bill_id}/void"
      - "POST /coordination-records"
      - "POST /benefit-payments"
      - "POST /benefit-payments/{benefit_payment_id}/void"
    shared_operations:
      - "POST /family-health-plans"
      - "GET /sport-classifications/{sport_classification_id}"
      - "GET /league-policies/{league_policy_id}"
      - "GET /league-policies"
      - "GET /league-policies/{league_policy_id}/loss-experience"
      - "GET /participants/{participant_id}"
      - "GET /enrollments/{enrollment_id}"
      - "GET /enrollments"
      - "GET /family-health-plans/{family_health_plan_id}"
      - "GET /family-health-plans"
      - "GET /sanctioned-activities/{sanctioned_activity_id}"
      - "GET /sanctioned-activities"
      - "GET /injury-reports/{injury_report_id}"
      - "GET /injury-reports"
      - "GET /claims/{claim_id}"
      - "GET /claims"
      - "GET /provider-bills/{provider_bill_id}"
      - "GET /provider-bills"
      - "GET /coordination-records/{coordination_record_id}"
      - "GET /coordination-records"
      - "GET /benefit-payments/{benefit_payment_id}"
      - "GET /benefit-payments"

  - name: MedicalReviewer
    description: "An independent medical reviewer who alone may certify - or revoke certification of - a catastrophic injury, gating the catastrophic excess layer. Deliberately cannot adjudicate or pay, so the dollars-unlocking decision and the dollars-releasing decision sit with different people."
    identity: "opaque"
    exclusive_operations:
      - "POST /claims/{claim_id}/cat-certification"
      - "POST /claims/{claim_id}/cat-certification-revocation"
    shared_operations:
      - "GET /injury-reports/{injury_report_id}"
      - "GET /injury-reports"
      - "GET /claims/{claim_id}"
      - "GET /claims"

  - name: GuardianPortal
    description: "A parent or guardian acting for one athlete. Files the family's other health coverage and reads that athlete's claims, bills and payments so the family can see its protected balance. X-User-ID is the id of the Participant acted for."
    identity: "entity_backed:Participant"
    exclusive_operations: []
    shared_operations:
      - "POST /family-health-plans"
      - "GET /participants/{participant_id}"
      - "GET /family-health-plans/{family_health_plan_id}"
      - "GET /family-health-plans"
      - "GET /claims/{claim_id}"
      - "GET /claims"
      - "GET /provider-bills/{provider_bill_id}"
      - "GET /provider-bills"
      - "GET /benefit-payments/{benefit_payment_id}"
      - "GET /benefit-payments"
