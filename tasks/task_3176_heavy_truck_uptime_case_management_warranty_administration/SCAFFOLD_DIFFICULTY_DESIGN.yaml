              payload: { dealer_id: "${dealer_id}", bay_id: "${bay_id}", scheduled_start_at: "2026-09-01T17:00:00Z", scheduled_end_at: "2026-09-01T19:00:00Z", expected_truck_version: "${truck_v_c}" }
              as: UptimeCoordinator
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases"
              payload: { fault_code: "SPN3216_FMI4" }
              as: UptimeCoordinator
              captures: { case_d_id: $.data.id }
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_d_id}/triage"
              payload: {}
