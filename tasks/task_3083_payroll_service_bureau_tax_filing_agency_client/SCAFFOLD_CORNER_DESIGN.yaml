# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3083_payroll_service_bureau_tax_filing_agency_client
#
# Breadth probe over §1.1–§1.7 claims not exercised by §1.8. Anchors below
# define the canonical setup chains; every test starts from empty-DB with the
# logical clock at its 2026-09-01T00:00:00Z default unless a recipe sets it.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: e_jurisdiction_create_returns_declared_fields
        claim_type: creation
        grounds: [entities.Jurisdiction, endpoints.POST_/jurisdictions]
        distinguishing_aspect: "A jurisdiction created without the optional active flag returns 201 with active defaulted to true, version 1, system id/created_at/updated_at, and the response envelope carries meta.api_request_id."
        test_recipe:
          setup: ["Clock at default. Empty database."]
          setup_api_calls: []
          trigger:
            - &ck_jfed
              call: "POST /jurisdictions"
              payload: { code: "FED-941", name: "IRS Form 941", deposit_frequency: "SEMIWEEKLY", penalty_tier1_rate: 0.02, penalty_tier2_rate: 0.05, penalty_tier3_rate: 0.10, underpayment_threshold_cents: 250000 }
              as: BureauCompliance
              captures: { cj_fed: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Jurisdiction.${cj_fed}.active == true (default applied)"
            - "Jurisdiction.${cj_fed}.version == 1 and deposit_frequency == SEMIWEEKLY"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: e_payroll_run_get_round_trips_and_computes_impound_amount
        claim_type: retrieval
        grounds: [entities.PayrollRun, "endpoints.GET_/payroll-runs/{runId}", calculations.impound_amount]
        distinguishing_aspect: "GET returns the stored row with impound_amount_cents computed as gross + tax (1200000 = 1000000 + 200000), status DRAFT, version 1."
        test_recipe:
          setup: ["Clock at default. Client exists (PROSPECT is sufficient for run creation is NOT — client must be ACTIVE for submit, but run creation only requires existence and role; the run here is created against an ACTIVE client)."]
          setup_api_calls:
            - *ck_jfed
            - &ck_client
              call: "POST /clients"
              payload: { legal_name: "Corner Co", ein: "00-0000001" }
              as: BureauOnboarder
              captures: { ck_cl: $.data.id }
            - &ck_onboard
              call: "POST /clients/${ck_cl}/begin-onboarding"
              payload: {}
              as: BureauOnboarder
            - &ck_reg_fed
              call: "POST /clients/${ck_cl}/registrations"
              payload: { jurisdiction_id: "${cj_fed}", agency_account_number: "EFTPS-CK", poa_document_ref: "POA-CK" }
              as: BureauOnboarder
              captures: { ck_reg: $.data.id }
            - &ck_verify
              call: "POST /registrations/${ck_reg}/verify"
              payload: {}
              as: BureauOnboarder
            - &ck_activate
              call: "POST /clients/${ck_cl}/activate"
              payload: {}
              as: BureauOnboarder
            - &ck_run
              call: "POST /payroll-runs"
              payload: { client_id: "${ck_cl}", pay_date: "2026-09-04T00:00:00Z", period_start: "2026-08-22T00:00:00Z", period_end: "2026-09-04T00:00:00Z", gross_pay_cents: 1000000, total_tax_cents: 200000 }
              as: ClientPayrollAdmin
              as_user_id: "${ck_cl}"
              captures: { ck_run: $.data.id }
          trigger:
            - call: "GET /payroll-runs/${ck_run}"
              payload: {}
              as: BureauTaxFiler
          assert:
            - "PayrollRun.${ck_run}.gross_pay_cents == 1000000 and total_tax_cents == 200000"
            - "PayrollRun.${ck_run}.impound_amount_cents == 1200000"
            - "PayrollRun.${ck_run}.status == DRAFT and version == 1"

      - name: e_clients_list_paginates_total_count_and_has_more
        claim_type: listing
        grounds: [endpoints.GET_/clients, response_envelope.pagination_fields, response_envelope.pagination_defaults]
        distinguishing_aspect: "With three clients, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false — total_count counts the whole set, not the page."
        test_recipe:
          setup: ["Clock at default. Three clients created."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Page One", ein: "00-0000010" }
              as: BureauOnboarder
            - call: "POST /clients"
              payload: { legal_name: "Page Two", ein: "00-0000011" }
              as: BureauOnboarder
            - call: "POST /clients"
              payload: { legal_name: "Page Three", ein: "00-0000012" }
              as: BureauOnboarder
          trigger:
            - call: "GET /clients"
              payload: { limit: 2, offset: 0 }
              as: BureauCompliance
            - call: "GET /clients"
              payload: { limit: 2, offset: 2 }
              as: BureauCompliance
          assert:
            - "first page returns exactly 2 rows with total_count == 3 and has_more == true"
            - "second page returns exactly 1 row with total_count == 3 and has_more == false"

      - name: e_deposit_get_unknown_id_returns_not_found
        claim_type: not_found
        grounds: ["endpoints.GET_/deposits/{depositId}", errors.ERR_NOT_FOUND, "validations[priority=4]"]
        distinguishing_aspect: "A syntactically valid but unallocated deposit id produces 404 ERR_NOT_FOUND before any state logic runs."
        test_recipe:
          setup: ["Clock at default. Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /deposits/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BureauTaxFiler
              captures: { err_nf: $.data.error_id }
          assert:
            - "the response status is 404 and err_nf == ERR_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: e_run_create_missing_total_tax_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.PayrollRun.fields.total_tax_cents, errors.ERR_INVALID_REQUEST, "validations[priority=5]"]
        distinguishing_aspect: "total_tax_cents is required with no default; omitting it is a 400 ERR_INVALID_REQUEST, not a silent zero."
        test_recipe:
          setup: ["Clock at default. Client ACTIVE with verified FED registration."]
          setup_api_calls:
            - *ck_jfed
            - *ck_client
            - *ck_onboard
            - *ck_reg_fed
            - *ck_verify
            - *ck_activate
          trigger:
            - call: "POST /payroll-runs"
              payload: { client_id: "${ck_cl}", pay_date: "2026-09-04T00:00:00Z", period_start: "2026-08-22T00:00:00Z", period_end: "2026-09-04T00:00:00Z", gross_pay_cents: 1000000 }
              as: ClientPayrollAdmin
              as_user_id: "${ck_cl}"
              captures: { err_req: $.data.error_id }
          assert:
            - "the response status is 400 and err_req == ERR_INVALID_REQUEST"
            - "GET /payroll-runs?client_id=${ck_cl} returns 0 rows"

      - name: e_run_create_impound_amount_input_ignored
        claim_type: computed_fields
        grounds: [entities.PayrollRun.fields.impound_amount_cents, calculations.impound_amount]
        distinguishing_aspect: "impound_amount_cents is computed-only; a client-supplied value of 999 is ignored and the stored value is gross + tax (1200000)."
        test_recipe:
          setup: ["Clock at default. Client ACTIVE with verified FED registration."]
          setup_api_calls:
            - *ck_jfed
            - *ck_client
            - *ck_onboard
            - *ck_reg_fed
            - *ck_verify
            - *ck_activate
          trigger:
            - call: "POST /payroll-runs"
              payload: { client_id: "${ck_cl}", pay_date: "2026-09-04T00:00:00Z", period_start: "2026-08-22T00:00:00Z", period_end: "2026-09-04T00:00:00Z", gross_pay_cents: 1000000, total_tax_cents: 200000, impound_amount_cents: 999 }
              as: ClientPayrollAdmin
              as_user_id: "${ck_cl}"
              captures: { ck_run2: $.data.id }
          assert:
            - "the response status is 201"
            - "PayrollRun.${ck_run2}.impound_amount_cents == 1200000, not 999"

      - name: e_statement_create_status_input_ignored
        claim_type: system_fields
        grounds: [entities.WageStatement.fields.status, entities.WageStatement.fields.statement_kind]
        distinguishing_aspect: "status and statement_kind are system-owned; a create that smuggles status ISSUED is persisted as DRAFT with statement_kind ORIGINAL and version 1."
        test_recipe:
          setup: ["Clock at default. Client ACTIVE."]
          setup_api_calls:
            - *ck_jfed
            - *ck_client
            - *ck_onboard
            - *ck_reg_fed
            - *ck_verify
            - *ck_activate
          trigger:
            - call: "POST /wage-statements"
              payload: { client_id: "${ck_cl}", tax_year: 2026, employee_ref: "E-9", wages_cents: 100000, withheld_cents: 20000, status: "ISSUED", version: 42 }
              as: BureauTaxFiler
              captures: { ws_sys: $.data.id }
          assert:
            - "the response status is 201"
            - "WageStatement.${ws_sys}.status == DRAFT and statement_kind == ORIGINAL and version == 1"

      - name: e_run_create_inverted_period_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.PayrollRun.fields.period_end, "validations[priority=5]", errors.ERR_INVALID_REQUEST]
        distinguishing_aspect: "period_end earlier than period_start violates the declared constraint and is rejected 400 before the run is persisted."
        test_recipe:
          setup: ["Clock at default. Client ACTIVE."]
          setup_api_calls:
            - *ck_jfed
            - *ck_client
            - *ck_onboard
            - *ck_reg_fed
            - *ck_verify
            - *ck_activate
          trigger:
            - call: "POST /payroll-runs"
              payload: { client_id: "${ck_cl}", pay_date: "2026-09-04T00:00:00Z", period_start: "2026-09-04T00:00:00Z", period_end: "2026-08-22T00:00:00Z", gross_pay_cents: 1000000, total_tax_cents: 200000 }
              as: ClientPayrollAdmin
              as_user_id: "${ck_cl}"
              captures: { err_per: $.data.error_id }
          assert:
            - "the response status is 400 and err_per == ERR_INVALID_REQUEST"
            - "GET /payroll-runs?client_id=${ck_cl} returns 0 rows"

      - name: e_deposit_create_bogus_jurisdiction_returns_not_found
        claim_type: parent_relationships
        grounds: [entities.TaxDeposit.fields.jurisdiction_id, "validations[priority=4]", errors.ERR_NOT_FOUND]
        distinguishing_aspect: "The body foreign key jurisdiction_id is existence-checked: an unknown jurisdiction id yields 404 ERR_NOT_FOUND even when the run in the path is real and SETTLED."
        test_recipe:
          setup: ["Clock at default. Client ACTIVE; run submitted, impounded, SETTLED."]
          setup_api_calls:
            - *ck_jfed
            - *ck_client
            - *ck_onboard
            - *ck_reg_fed
            - *ck_verify
            - *ck_activate
            - *ck_run
            - &ck_submit
              call: "POST /payroll-runs/${ck_run}/submit"
              payload: {}
              as: ClientPayrollAdmin
              as_user_id: "${ck_cl}"
            - &ck_clv
              call: "GET /clients/${ck_cl}"
              payload: {}
              as: BureauCompliance
              captures: { ck_clv: $.data.version }
            - &ck_impound
              call: "POST /payroll-runs/${ck_run}/initiate-impound"
              payload: { expected_client_version: "${ck_clv}" }
              as: ClientPayrollAdmin
              as_user_id: "${ck_cl}"
              captures: { ck_imp: $.data.id }
            - &ck_settle
              call: "POST /impounds/${ck_imp}/settle"
              payload: {}
              as: BureauTreasury
            - &ck_runv
              call: "GET /payroll-runs/${ck_run}"
              payload: {}
              as: BureauTaxFiler
              captures: { ck_runv: $.data.version }
          trigger:
            - call: "POST /payroll-runs/${ck_run}/deposits"
              payload: { jurisdiction_id: "00000000-0000-4000-8000-000000000000", amount_cents: 100000, expected_payroll_run_version: "${ck_runv}" }
              as: BureauTaxFiler
              captures: { err_fk: $.data.error_id }
          assert:
            - "the response status is 404 and err_fk == ERR_NOT_FOUND"
            - "GET /deposits?payroll_run_id=${ck_run} returns 0 rows"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: sm_client_onboarding_happy_path
        claim_type: valid_transition
        grounds: [state_machines.Client, state_machines.JurisdictionRegistration.PENDING_to_VERIFIED]
        distinguishing_aspect: "PROSPECT -> ONBOARDING -> ACTIVE is reachable exactly when a registration is VERIFIED; onboarded_at is stamped at activation."
        test_recipe:
          setup: ["Clock at default. Jurisdiction FED-941 exists."]
          setup_api_calls:
            - *ck_jfed
          trigger:
            - call: "POST /clients"
              payload: { legal_name: "Happy Path Co", ein: "00-0000020" }
              as: BureauOnboarder
              captures: { hp_cl: $.data.id, hp_s0: $.data.status }
            - call: "POST /clients/${hp_cl}/begin-onboarding"
              payload: {}
              as: BureauOnboarder
              captures: { hp_s1: $.data.status }
            - call: "POST /clients/${hp_cl}/registrations"
              payload: { jurisdiction_id: "${cj_fed}", agency_account_number: "EFTPS-HP", poa_document_ref: "POA-HP" }
              as: BureauOnboarder
              captures: { hp_reg: $.data.id }
            - call: "POST /registrations/${hp_reg}/verify"
              payload: {}
              as: BureauOnboarder
            - call: "POST /clients/${hp_cl}/activate"
              payload: {}
              as: BureauOnboarder
              captures: { hp_s2: $.data.status, hp_onb: $.data.onboarded_at }
          assert:
            - "hp_s0 == PROSPECT and hp_s1 == ONBOARDING and hp_s2 == ACTIVE"
            - "hp_onb is non-null"
            - "Client.${hp_cl}.risk_posture == NORMAL and funding_failure_count == 0 and credit_hold == false"

      - name: sm_activate_without_verified_registration_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Client.ONBOARDING_to_ACTIVE, errors.ERR_NO_VERIFIED_JURISDICTION, "validations[priority=22]"]
        distinguishing_aspect: "Activation with only a PENDING registration fails 422 ERR_NO_VERIFIED_JURISDICTION; the client stays ONBOARDING."
        test_recipe:
          setup: ["Clock at default. Client ONBOARDING with a PENDING registration."]
          setup_api_calls:
            - *ck_jfed
            - call: "POST /clients"
              payload: { legal_name: "No Reg Co", ein: "00-0000021" }
              as: BureauOnboarder
              captures: { nr_cl: $.data.id }
            - call: "POST /clients/${nr_cl}/begin-onboarding"
              payload: {}
              as: BureauOnboarder
            - call: "POST /clients/${nr_cl}/registrations"
              payload: { jurisdiction_id: "${cj_fed}", agency_account_number: "EFTPS-NR", poa_document_ref: "POA-NR" }
              as: BureauOnboarder
          trigger:
            - call: "POST /clients/${nr_cl}/activate"
              payload: {}
              as: BureauOnboarder
              captures: { err_nvr: $.data.error_id }
          assert:
            - "the response status is 422 and err_nvr == ERR_NO_VERIFIED_JURISDICTION"
            - "Client.${nr_cl}.status == ONBOARDING"

      - name: sm_cancel_settled_run_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.PayrollRun, errors.ERR_INVALID_STATE, "validations[priority=6]"]
        distinguishing_aspect: "Cancel is defined only from SUBMITTED; a SETTLED run rejects cancel with 409 ERR_INVALID_STATE and no side effects fire."
        test_recipe:
          setup: ["Clock at default. Client ACTIVE; run SETTLED via the canonical impound chain."]
          setup_api_calls:
            - *ck_jfed
            - *ck_client
            - *ck_onboard
            - *ck_reg_fed
            - *ck_verify
            - *ck_activate
            - *ck_run
            - *ck_submit
            - *ck_clv
            - *ck_impound
            - *ck_settle
          trigger:
            - call: "POST /payroll-runs/${ck_run}/cancel"
              payload: {}
              as: ClientPayrollAdmin
              as_user_id: "${ck_cl}"
              captures: { err_inv: $.data.error_id }
          assert:
            - "the response status is 409 and err_inv == ERR_INVALID_STATE"
            - "PayrollRun.${ck_run}.status == SETTLED (unchanged)"

      - name: sm_failed_impound_rejects_settle_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Impound, errors.ERR_INVALID_STATE]
        distinguishing_aspect: "FAILED is terminal for an impound: settle after fail returns 409 ERR_INVALID_STATE and the strike state is untouched."
        test_recipe:
          setup: ["Clock at default. Client ACTIVE; run IMPOUNDED; impound then FAILED via bank NSF."]
          setup_api_calls:
            - *ck_jfed
            - *ck_client
            - *ck_onboard
            - *ck_reg_fed
            - *ck_verify
            - *ck_activate
            - *ck_run
            - *ck_submit
            - *ck_clv
            - *ck_impound
            - call: "POST /impounds/${ck_imp}/fail"
              payload: {}
              as: BureauTreasury
          trigger:
            - call: "POST /impounds/${ck_imp}/settle"
              payload: {}
              as: BureauTreasury
              captures: { err_tl: $.data.error_id }
          assert:
            - "the response status is 409 and err_tl == ERR_INVALID_STATE"
            - "Impound.${ck_imp}.status == FAILED"
            - "Client.${ck_cl}.funding_failure_count == 1 (unchanged by the rejected settle)"

      - name: sm_notice_escalation_loop_returns_to_in_review
        claim_type: cyclic_loop
        grounds: [state_machines.AgencyNotice]
        distinguishing_aspect: "OPEN -> IN_REVIEW -> ESCALATED -> IN_REVIEW -> RESOLVED_NO_CHANGE -> CLOSED walks the full escalation loop and lands CLOSED with adjustment_amount_cents 0."
        test_recipe:
          setup: ["Clock at default. Client ACTIVE; a DRAFT return exists to anchor the notice."]
          setup_api_calls:
            - *ck_jfed
            - *ck_client
            - *ck_onboard
            - *ck_reg_fed
            - *ck_verify
            - *ck_activate
            - *ck_clv
            - call: "POST /returns"
              payload: { client_id: "${ck_cl}", jurisdiction_id: "${cj_fed}", period: "2026-Q3", expected_client_version: "${ck_clv}" }
              as: BureauTaxFiler
              captures: { nt_ret: $.data.id }
            - call: "POST /notices"
              payload: { client_id: "${ck_cl}", jurisdiction_id: "${cj_fed}", return_id: "${nt_ret}", notice_type: "BALANCE_DUE", claimed_amount_cents: 50000, received_at: "2026-10-10T00:00:00Z", response_due_at: "2026-11-10T00:00:00Z" }
              as: BureauTaxFiler
              captures: { nt_id: $.data.id, nt_s0: $.data.status }
          trigger:
            - call: "POST /notices/${nt_id}/start-review"
              payload: {}
              as: BureauTaxFiler
              captures: { nt_s1: $.data.status }
            - call: "POST /notices/${nt_id}/escalate"
              payload: {}
              as: BureauTaxFiler
              captures: { nt_s2: $.data.status }
            - call: "POST /notices/${nt_id}/start-review"
              payload: {}
              as: BureauTaxFiler
              captures: { nt_s3: $.data.status }
            - call: "POST /notices/${nt_id}/resolve"
              payload: { resolution: "NO_CHANGE", resolution_note: "Agency figure matched bureau books" }
              as: BureauTaxFiler
              captures: { nt_s4: $.data.status, nt_adj: $.data.adjustment_amount_cents }
            - call: "POST /notices/${nt_id}/close"
              payload: {}
              as: BureauTaxFiler
              captures: { nt_s5: $.data.status }
          assert:
            - "nt_s0 == OPEN, nt_s1 == IN_REVIEW, nt_s2 == ESCALATED, nt_s3 == IN_REVIEW, nt_s4 == RESOLVED_NO_CHANGE, nt_s5 == CLOSED"
            - "nt_adj == 0"

      - name: sm_amendment_reject_redraft_loop
        claim_type: cyclic_loop
        grounds: [state_machines.ReturnAmendment]
        distinguishing_aspect: "DRAFT -> FILED -> REJECTED -> DRAFT -> FILED -> ACCEPTED completes the amendment loop on a RECONCILED parent return (also exercising the RECONCILED -> AMENDED edge); filer-alpha files, filer-beta accepts per SoD."
        test_recipe:
          setup: ["Clock at 2026-10-20. CA-DE9 QUARTERLY jurisdiction. Client ACTIVE with verified CA registration; one SETTLED Q3 run (tax 300000) with CONFIRMED deposit; return filed, accepted, reconciled."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "CA-DE9", name: "CA EDD DE9", deposit_frequency: "QUARTERLY", penalty_tier1_rate: 0.02, penalty_tier2_rate: 0.05, penalty_tier3_rate: 0.10, underpayment_threshold_cents: 250000 }
              as: BureauCompliance
              captures: { ca_j: $.data.id }
            - call: "POST /clients"
              payload: { legal_name: "Loop Amend Co", ein: "00-0000022" }
              as: BureauOnboarder
              captures: { ca_cl: $.data.id }
            - call: "POST /clients/${ca_cl}/begin-onboarding"
              payload: {}
              as: BureauOnboarder
            - call: "POST /clients/${ca_cl}/registrations"
              payload: { jurisdiction_id: "${ca_j}", agency_account_number: "EDD-LA", poa_document_ref: "POA-LA" }
              as: BureauOnboarder
              captures: { ca_reg: $.data.id }
            - call: "POST /registrations/${ca_reg}/verify"
              payload: {}
              as: BureauOnboarder
            - call: "POST /clients/${ca_cl}/activate"
              payload: {}
              as: BureauOnboarder
            - call: "POST /payroll-runs"
              payload: { client_id: "${ca_cl}", pay_date: "2026-08-17T00:00:00Z", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-15T00:00:00Z", gross_pay_cents: 1500000, total_tax_cents: 300000 }
              as: ClientPayrollAdmin
              as_user_id: "${ca_cl}"
              captures: { ca_run: $.data.id }
            - call: "POST /payroll-runs/${ca_run}/submit"
              payload: {}
              as: ClientPayrollAdmin
              as_user_id: "${ca_cl}"
            - call: "GET /clients/${ca_cl}"
              payload: {}
              as: BureauCompliance
              captures: { ca_clv: $.data.version }
            - call: "POST /payroll-runs/${ca_run}/initiate-impound"
              payload: { expected_client_version: "${ca_clv}" }
              as: ClientPayrollAdmin
              as_user_id: "${ca_cl}"
              captures: { ca_imp: $.data.id }
            - call: "POST /impounds/${ca_imp}/settle"
              payload: {}
              as: BureauTreasury
            - call: "GET /payroll-runs/${ca_run}"
              payload: {}
              as: BureauTaxFiler
              captures: { ca_runv: $.data.version }
            - call: "POST /payroll-runs/${ca_run}/deposits"
              payload: { jurisdiction_id: "${ca_j}", amount_cents: 300000, expected_payroll_run_version: "${ca_runv}" }
              as: BureauTaxFiler
              captures: { ca_dep: $.data.id }
            - call: "POST /deposits/${ca_dep}/submit"
              payload: {}
              as: BureauTaxFiler
            - call: "POST /deposits/${ca_dep}/confirm"
              payload: {}
              as: BureauTaxFiler
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-20T00:00:00Z" }
              as: BureauCompliance
            - call: "GET /clients/${ca_cl}"
              payload: {}
              as: BureauCompliance
              captures: { ca_clv2: $.data.version }
            - call: "POST /returns"
              payload: { client_id: "${ca_cl}", jurisdiction_id: "${ca_j}", period: "2026-Q3", expected_client_version: "${ca_clv2}" }
              as: BureauTaxFiler
              captures: { ca_ret: $.data.id }
            - call: "POST /returns/${ca_ret}/file"
              payload: {}
              as: BureauTaxFiler
              as_user_id: "filer-alpha"
            - call: "POST /returns/${ca_ret}/accept"
              payload: {}
              as: BureauTaxFiler
              as_user_id: "filer-beta"
