            - call: "POST /public-art/funding-pools"
              payload: { pool_code: "END-2026", pool_type: "ENDOWMENT", fiscal_year: 2026, principal_cents: 400000000, draw_rate_bps: 450 }
              as: PublicArtManager
              as_user_id: "mgr-1"
              captures: { e_pool_write: $.data.error_id }
            - call: "GET /public-art/funding-pools/${pool_id}"
              payload: {}
              as: MaintenanceCrew
              as_user_id: "crew-1"
