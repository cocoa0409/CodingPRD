          rationale: "Which variant governs which field, and the DESKTOP worst-case substitution, are asserted by the named §1.8 instance."

      - name: schedule_posture_recomputed_when_the_deadline_moves
        claim_type: correct_result
        grounds:
          - calculations.project_schedule_posture.trigger
        excluded_because:
          difficulty_instance: transitive_cascade / second_granted_intervention_cascades_deadline_to_right_of_way_hold
          rationale: "The 90-day suspension, the 124-day slack and the AT_RISK/right_of_way_hold recomputation are asserted by the named §1.8 instance."

  # ===========================================================================
  - section: validations
    instances:

      - name: alternative_on_unknown_study_id_not_found
        claim_type: violation_to_error
        grounds:
          - validations[ERR_REFERENCE_NOT_FOUND].check
          - endpoints[POST /siting/alternatives].input
        distinguishing_aspect: "A body FK that resolves to no row is caught at priority 4 with ERR_REFERENCE_NOT_FOUND (404) — distinct from the priority 3 path-id check, and it fires before any shape or business rule on the alternative."
        test_recipe:
          setup:
            - "One project in stage PLANNING; no PlanningStudy rows exist"
          setup_api_calls:
            - *c01
          trigger:
            - call: "POST /siting/alternatives"
              payload: { study_id: "00000000-0000-4000-8000-0000000000be", kind: "TRANSMISSION", description: "Ghost study alternative", capex_cents: 80000000000, deliverable_mw: 400 }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_REFERENCE_NOT_FOUND"
            - "Alternative count == 0"

      - name: comment_on_unpublished_route_rejected
        claim_type: violation_to_error
        grounds:
          - validations[ERR_ROUTE_NOT_PUBLISHED].check
          - endpoints[POST /siting/public-comments]
        distinguishing_aspect: "Comment intake is gated on the route being PUBLISHED_FOR_COMMENT: a DRAFT route yields ERR_ROUTE_NOT_PUBLISHED (409) at priority 12 and no PublicComment row is written."
        test_recipe:
          setup:
            - "Route A in status DRAFT with two segments and no publication"
          setup_api_calls:
            - *c01
            - *c08
            - *c09
            - *c10
          trigger:
            - call: "POST /siting/public-comments"
              payload: { route_id: "${routeA}", commenter_kind: "PUBLIC", commenter_name: "Nell Ford", body: "Please avoid the school road", materiality: "GENERAL" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ROUTE_NOT_PUBLISHED"
            - "PublicComment count for route ${routeA} == 0"
            - "Route.${routeA}.status == DRAFT"

      - name: comment_at_window_close_instant_rejected
        claim_type: violation_to_error
        grounds:
          - validations[ERR_COMMENT_WINDOW_CLOSED].check
          - entities.Route.fields.comment_window_closes_at
        distinguishing_aspect: "The window test is logical_now >= comment_window_closes_at, so intake at the closing instant itself (2026-08-31T00:00:00Z for a 30-day window opened at the 2026-08-01 default) is already refused with ERR_COMMENT_WINDOW_CLOSED (422)."
        test_recipe:
          setup:
            - "Route A PUBLISHED_FOR_COMMENT with a 30-day window closing 2026-08-31T00:00:00Z"
            - "Logical clock advanced to exactly 2026-08-31T00:00:00Z"
          setup_api_calls:
            - *c01
            - *c08
            - *c09
            - *c10
            - *c11
            - *c12
            - *c18
            - *c21
          trigger:
            - call: "POST /siting/public-comments"
              payload: { route_id: "${routeA}", commenter_kind: "AGENCY", commenter_name: "KY Heritage Council", body: "Late filing on the cultural survey", materiality: "GENERAL" }
              as: CommissionStaff
              as_user_id: "staff-lin"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_COMMENT_WINDOW_CLOSED"
            - "Route.${routeA}.comment_window_closes_at == 2026-08-31T00:00:00Z"
            - "PublicComment count for route ${routeA} == 0"

      - name: nomination_before_window_close_rejected
        claim_type: violation_to_error
        grounds:
          - validations[ERR_COMMENT_WINDOW_OPEN].check
          - state_machines.Route.PUBLISHED_FOR_COMMENT_to_NOMINATED
        distinguishing_aspect: "Mirror of the intake gate on the same field: while logical_now is still before comment_window_closes_at the PROPOSED route cannot be nominated (ERR_COMMENT_WINDOW_OPEN, 422) even though both open houses are already recorded."
        test_recipe:
          setup:
            - "Route A PUBLISHED_FOR_COMMENT with a window closing 2026-08-31 and two open houses in two counties"
            - "Logical clock left at the 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - *c01
            - *c08
            - *c09
            - *c10
            - *c11
            - *c12
            - *c18
            - *c19
            - *c20
          trigger:
            - call: "POST /siting/routes/${routeA}/nomination"
              payload: { nomination_note: "Filing early" }
              as: Developer
              as_user_id: "dev-nora"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_COMMENT_WINDOW_OPEN"
            - "Route.${routeA}.status == PUBLISHED_FOR_COMMENT"
            - "Route.${routeA}.open_house_held_count == 2"

      - name: nomination_with_open_material_comment_rejected
        claim_type: violation_to_error
        grounds:
          - validations[ERR_MATERIAL_COMMENTS_OPEN].check
          - entities.RouteSegment.fields.material_comment_count
        distinguishing_aspect: "Priority 48 gate: the window has closed and the open-house coverage is satisfied, so the only failing condition is the one MATERIAL comment still in status RECEIVED on segment 1."
        test_recipe:
          setup:
            - "Route A PUBLISHED_FOR_COMMENT, two open houses in two counties, window closed"
            - "One MATERIAL comment in status RECEIVED naming segment 1"
          setup_api_calls:
            - *c01
            - *c08
            - *c09
            - *c10
            - *c11
            - *c12
            - *c18
            - *c19
            - *c20
            - &c37
              call: "POST /siting/public-comments"
              payload: { route_id: "${routeA}", segment_id: "${seg1}", commenter_kind: "PUBLIC", commenter_name: "Nell Ford", body: "Shift the alignment off the ridge above the school", materiality: "MATERIAL" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { cmt1: "$.data.id" }
            - *c21
          trigger:
            - call: "POST /siting/routes/${routeA}/nomination"
              payload: { nomination_note: "Nominating with comments outstanding" }
              as: Developer
              as_user_id: "dev-nora"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_MATERIAL_COMMENTS_OPEN"
            - "PublicComment.${cmt1}.status == RECEIVED"
            - "RouteSegment.${seg1}.material_comment_count == 1"
            - "Route.${routeA}.status == PUBLISHED_FOR_COMMENT"

      - name: nomination_with_single_county_open_house_rejected
        claim_type: violation_to_error
        grounds:
          - validations[ERR_OPEN_HOUSE_COVERAGE_INSUFFICIENT].check
          - entities.Route.fields.open_house_counties
        distinguishing_aspect: "Coverage is counted two ways and both must hold: one open house in one county fails at priority 47 with ERR_OPEN_HOUSE_COVERAGE_INSUFFICIENT (422) before the material-comment gate at 48 is consulted."
        test_recipe:
          setup:
            - "Route A PUBLISHED_FOR_COMMENT with exactly one open house (Harlan) and no comments"
            - "Logical clock at 2026-08-31, so the window has closed"
          setup_api_calls:
            - *c01
            - *c08
            - *c09
            - *c10
            - *c11
            - *c12
            - *c18
            - *c19
            - *c21
          trigger:
            - call: "POST /siting/routes/${routeA}/nomination"
              payload: { nomination_note: "One meeting held" }
              as: Developer
              as_user_id: "dev-nora"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_OPEN_HOUSE_COVERAGE_INSUFFICIENT"
            - "Route.${routeA}.open_house_held_count == 1"
            - "Route.${routeA}.open_house_counties == [Harlan]"
            - "Route.${routeA}.status == PUBLISHED_FOR_COMMENT"

      - name: nomination_with_density_above_limit_rejected
        claim_type: violation_to_error
        grounds:
          - validations[ERR_CONSTRAINT_DENSITY_EXCEEDED].check
          - calculations.route_constraint_score.variants
        distinguishing_aspect: "The certified variant charges every DESKTOP segment at the worst-case rating, so leaving segment 1 unsurveyed lifts constraint_score_certified to 82.23 and the density to 4.11, tripping the 4.00 ceiling at priority 46 while the preliminary score stays 67.28."
        test_recipe:
          setup:
            - "Route A with segment 1 left at survey_status DESKTOP (10.0mi, 3/4/2/3), segment 2 (6.0mi) and segment 3 (4.0mi) as usual"
            - "Route PUBLISHED_FOR_COMMENT, two open houses in two counties, window closed, no comments"
          setup_api_calls:
            - *c01
            - *c08
            - &c09d
              call: "POST /siting/route-segments"
              payload: { route_id: "${routeA}", sequence_index: 1, miles: 10.0, land_use_rating: 3, environmental_rating: 4, cultural_rating: 2, engineering_rating: 3, county: "Harlan", crew_capacity: 12, survey_status: "DESKTOP", habitat_blackout: true, federal_crossing_kind: "NONE" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { seg1: "$.data.id" }
            - *c10
            - *c11
            - *c12
            - *c18
            - *c19
            - *c20
            - *c21
          trigger:
            - call: "POST /siting/routes/${routeA}/nomination"
              payload: { nomination_note: "Nominating on desktop data" }
              as: Developer
              as_user_id: "dev-nora"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_CONSTRAINT_DENSITY_EXCEEDED"
            - "Route.${routeA}.constraint_score_preliminary == 67.28"
            - "Route.${routeA}.constraint_score_certified == 82.23"
            - "Route.${routeA}.constraint_density_certified == 4.11"
            - "Route.${routeA}.unsurveyed_segment_count == 2"
            - "Route.${routeA}.status == PUBLISHED_FOR_COMMENT"

      - name: comment_by_a_landowner_for_another_landowner_rejected
        claim_type: violation_to_error
        grounds:
          - validations[ERR_NOT_RESOURCE_OWNER].check
          - rbac.Landowner.entity_backed
        distinguishing_aspect: "Peer-role isolation at priority 6: the acting Landowner's X-User-ID must equal commenter_landowner_id, so filing on a neighbour's behalf returns ERR_NOT_RESOURCE_OWNER (403) — after authorization at 2 but before the window and materiality rules."
        test_recipe:
          setup:
            - "Route A PUBLISHED_FOR_COMMENT with an open window"
            - "Two registered landowners"
          setup_api_calls:
            - *c01
            - *c08
            - *c09
            - *c10
            - *c11
            - *c12
            - *c18
            - *c32
            - &c38
              call: "POST /siting/landowners"
              payload: { name: "Ivor Nance", email: "ivor@example.com", mailing_address: "44 Boone Pike, Boone KY" }
              as: Developer
              as_user_id: "dev-nora"
              captures: { lo2: "$.data.id" }
          trigger:
            - call: "POST /siting/public-comments"
              payload: { route_id: "${routeA}", segment_id: "${seg1}", commenter_kind: "LANDOWNER", commenter_name: "Ada Wren", body: "Filed by a neighbour", materiality: "MATERIAL", commenter_landowner_id: "${lo1}" }
              as: Landowner
              as_user_id: "${lo2}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_NOT_RESOURCE_OWNER"
            - "PublicComment count for route ${routeA} == 0"
            - "RouteSegment.${seg1}.material_comment_count == 0"

      - name: refinement_without_a_material_comment_rejected
        claim_type: violation_to_error
        grounds:
          - calculations.refinement_target_selection.selector_policy.empty_pool_fallback
          - validations[ERR_NO_REFINEMENT_TARGET].check
        distinguishing_aspect: "Selector empty-pool fallback: with only a GENERAL comment on file no segment has material_comment_count >= 1, so refinement is refused with ERR_NO_REFINEMENT_TARGET (409) and refinement_round stays 0 rather than defaulting to segment 1."
        test_recipe:
          setup:
            - "Route A PUBLISHED_FOR_COMMENT carrying one GENERAL comment on segment 2"
          setup_api_calls:
            - *c01
            - *c08
            - *c09
            - *c10
            - *c11
            - *c12
            - *c18
            - call: "POST /siting/public-comments"
              payload: { route_id: "${routeA}", segment_id: "${seg2}", commenter_kind: "PUBLIC", commenter_name: "Odis Bray", body: "General support for the rebuild", materiality: "GENERAL" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { cmt_gen: "$.data.id" }
          trigger:
            - call: "POST /siting/routes/${routeA}/refinements"
              payload: { refinement_note: "Refine on the general comment" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_NO_REFINEMENT_TARGET"
            - "Route.${routeA}.refinement_round == 0"
            - "Route.${routeA}.refinement_target_segment_id == null"
            - "Route.${routeA}.status == PUBLISHED_FOR_COMMENT"
            - "RouteSegment.${seg2}.survey_status == FIELD_VERIFIED"

      - name: fourth_refinement_round_rejected
        claim_type: violation_to_error
        grounds:
          - validations[ERR_REFINEMENT_LIMIT_REACHED].check
          - state_machines.Route.PUBLISHED_FOR_COMMENT_to_REFINING
        distinguishing_aspect: "The REFINING -> CONSTRAINT_MAPPED -> PUBLISHED_FOR_COMMENT cycle is bounded by MAX_REFINEMENT_ROUNDS 3: after three complete loops a fourth attempt with a fresh MATERIAL comment still fails with ERR_REFINEMENT_LIMIT_REACHED (409) at priority 30."
        test_recipe:
          setup:
            - "Route A PUBLISHED_FOR_COMMENT"
            - "Three completed refinement loops, each opened by one MATERIAL comment on segment 3 and closed by a re-map and a re-publication"
          setup_api_calls:
            - *c01
            - *c08
            - *c09
            - *c10
            - *c11
            - *c12
            - *c18
            - &c39
              call: "POST /siting/public-comments"
              payload: { route_id: "${routeA}", segment_id: "${seg3}", commenter_kind: "PUBLIC", commenter_name: "Nell Ford", body: "Move the alignment off the burial ground", materiality: "MATERIAL" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { cmt_r1: "$.data.id" }
            - &c40
              call: "POST /siting/routes/${routeA}/refinements"
              payload: { refinement_note: "Round 1 shift" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
            - *c12
            - *c18
            - *c39
            - *c40
            - *c12
            - *c18
            - *c39
            - *c40
            - *c12
            - *c18
            - *c39
          trigger:
            - call: "POST /siting/routes/${routeA}/refinements"
              payload: { refinement_note: "Round 4 shift" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_REFINEMENT_LIMIT_REACHED"
            - "Route.${routeA}.refinement_round == 3"
            - "Route.${routeA}.status == PUBLISHED_FOR_COMMENT"
            - "RouteSegment.${seg3}.refinement_count == 3"
            - "RouteSegment.${seg3}.material_comment_count == 1"

      - name: duplicate_sequence_index_on_a_route_rejected
        claim_type: violation_to_error
        grounds:
          - validations[ERR_SEGMENT_SEQUENCE_DUPLICATE].check
          - entities.RouteSegment.fields.sequence_index
        distinguishing_aspect: "Uniqueness is scoped to the route, not global: re-using sequence_index 1 on Route A fails with ERR_SEGMENT_SEQUENCE_DUPLICATE (409) at priority 30 while the same index on Route B is accepted."
        test_recipe:
          setup:
            - "Route A with segments at sequence_index 1 and 2"
            - "Route B (ALTERNATE) with a segment at sequence_index 1"
          setup_api_calls:
            - *c01
            - *c08
            - *c09
            - *c10
            - *c13
            - *c14
          trigger:
            - call: "POST /siting/route-segments"
              payload: { route_id: "${routeA}", sequence_index: 1, miles: 3.0, land_use_rating: 1, environmental_rating: 1, cultural_rating: 1, engineering_rating: 1, county: "Harlan", crew_capacity: 8, survey_status: "FIELD_VERIFIED", habitat_blackout: false, federal_crossing_kind: "NONE" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SEGMENT_SEQUENCE_DUPLICATE"
            - "Route.${routeA}.segment_count == 2"
            - "Route.${routeB}.segment_count == 1"

      - name: zero_deliverable_alternative_rejected
        claim_type: violation_to_error
        grounds:
          - validations[ERR_ZERO_DELIVERABLE].check
          - calculations.alternative_levelized_cost
        distinguishing_aspect: "The guard exists so the levelized-cost division is always defined: deliverable_mw 0 is refused at priority 45 with ERR_ZERO_DELIVERABLE (422) rather than surfacing a divide-by-zero, and the study's screened-in count is untouched."
        test_recipe:
          setup:
            - "One DRAFT planning study"
          setup_api_calls:
            - *c01
            - *c02
          trigger:
            - call: "POST /siting/alternatives"
              payload: { study_id: "${study}", kind: "NON_TRANSMISSION", description: "Efficiency program with no firm capacity", capex_cents: 1200000000, deliverable_mw: 0 }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_ZERO_DELIVERABLE"
            - "Alternative count for study ${study} == 0"
            - "PlanningStudy.${study}.status == DRAFT"

      - name: self_certification_of_the_authored_study_rejected
        claim_type: violation_to_error
        grounds:
          - validations[ERR_SELF_CERTIFICATION].check
          - entities.PlanningStudy.fields.authored_by_user_id
        distinguishing_aspect: "Segregation of duties on X-User-ID: dev-nora authored the study, so dev-nora certifying it is refused at priority 25 with ERR_SELF_CERTIFICATION (403) even though the Developer role is authorized and every substantive gate would pass for dev-milo."
        test_recipe:
          setup:
            - "Study authored by dev-nora with two SCREEN_IN alternatives, one of them NON_TRANSMISSION"
          setup_api_calls:
            - *c01
            - *c02
            - *c03
            - *c04
            - *c05
            - *c06
          trigger:
            - call: "POST /siting/planning-studies/${study}/sufficiency-certification"
              payload: { attestation_note: "Self review" }
              as: Developer
              as_user_id: "dev-nora"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_SELF_CERTIFICATION"
            - "PlanningStudy.${study}.status == ALTERNATIVES_ANALYZED"
            - "PlanningStudy.${study}.need_margin_ratio == null"
            - "PlanningStudy.${study}.certified_by_user_id == null"

      - name: certification_with_one_screened_alternative_rejected
        claim_type: violation_to_error
        grounds:
          - validations[ERR_INSUFFICIENT_ALTERNATIVES].check
          - entities.PlanningStudy.fields.alternatives_screened_in_count
        distinguishing_aspect: "Screening one alternative in is enough to leave DRAFT but not to certify: with alternatives_screened_in_count 1 certification fails at priority 46 with ERR_INSUFFICIENT_ALTERNATIVES (422), which outranks the non-wires selector check at 45 only when that pool is also empty — here the count gate is the binding one because the single screened-in candidate is NON_TRANSMISSION."
        test_recipe:
          setup:
            - "Study in ALTERNATIVES_ANALYZED with exactly one SCREENED_IN alternative (NON_TRANSMISSION 46000000000/200) and one SUBMITTED alternative"
          setup_api_calls:
            - *c01
            - *c02
            - *c03
            - *c04
            - *c06
          trigger:
            - call: "POST /siting/planning-studies/${study}/sufficiency-certification"
              payload: { attestation_note: "Certifying on the non-wires screen alone" }
              as: Developer
              as_user_id: "dev-milo"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INSUFFICIENT_ALTERNATIVES"
            - "PlanningStudy.${study}.alternatives_screened_in_count == 1"
            - "Alternative.${alt1}.screening_status == SUBMITTED"
            - "PlanningStudy.${study}.status == ALTERNATIVES_ANALYZED"

      - name: certification_without_a_non_transmission_candidate_rejected
        claim_type: violation_to_error
        grounds:
          - calculations.need_justification_margin.selector_policy.empty_pool_fallback
          - validations[ERR_NO_NONTRANSMISSION_ALTERNATIVE].check
        distinguishing_aspect: "Two TRANSMISSION alternatives satisfy the count gate at 46, so the empty non-wires pool is what fails, at priority 45 with ERR_NO_NONTRANSMISSION_ALTERNATIVE (422); selected_nta_alternative_id stays null and no margin is written."
        test_recipe:
          setup:
            - "Study in ALTERNATIVES_ANALYZED with two SCREENED_IN alternatives, both of kind TRANSMISSION"
          setup_api_calls:
            - *c01
            - *c02
            - *c03
            - call: "POST /siting/alternatives"
              payload: { study_id: "${study}", kind: "TRANSMISSION", description: "Reconductor the parallel 138kV path", capex_cents: 52000000000, deliverable_mw: 260 }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { alt_wires2: "$.data.id" }
            - *c05
            - call: "POST /siting/alternatives/${alt_wires2}/screening"
              payload: { decision: "SCREEN_IN", screen_reason: "Wires option worth carrying" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
          trigger:
            - call: "POST /siting/planning-studies/${study}/sufficiency-certification"
              payload: { attestation_note: "Wires-only screening" }
              as: Developer
              as_user_id: "dev-milo"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_NO_NONTRANSMISSION_ALTERNATIVE"
            - "PlanningStudy.${study}.alternatives_screened_in_count == 2"
            - "PlanningStudy.${study}.selected_nta_alternative_id == null"
            - "PlanningStudy.${study}.need_margin_ratio == null"
            - "PlanningStudy.${study}.status == ALTERNATIVES_ANALYZED"

      - name: duplicate_open_application_on_the_project_rejected
        claim_type: violation_to_error
        grounds:
          - validations[ERR_DUPLICATE_APPLICATION].check
          - endpoints[POST /siting/applications]
        distinguishing_aspect: "Uniqueness is on the open docket, not the docket number: a second filing on the same project while the first is ACCEPTED (neither GRANTED nor DENIED) fails at priority 30 with ERR_DUPLICATE_APPLICATION (409) even under a fresh docket number."
