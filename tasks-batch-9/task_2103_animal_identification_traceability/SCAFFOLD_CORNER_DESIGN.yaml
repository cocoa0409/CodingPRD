              as_user_id: "admin-reg"
          trigger:
            - call: "POST /producers"
              payload: { legal_name: "No Auth Co", contact_email: "x@x.example", state_code: "CO" }
              as: MISSING
              captures: { err_auth: $.data.error_id }
          assert:
            - "${err_auth} == ERR_UNAUTHENTICATED"
            - "HTTP status is 401"
            - "The same call with a valid ProgramAdmin identity returns 201"

