# =============================================================================
# Foreign Trade L/C — Scaffold Difficulty Design (Test Targeting Index)
# =============================================================================
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine Difficulty Rules
# from prd-bench-scaffold-generator/SKILL.md §0.5.
# Every rule_id below has ≥2 instances; every grounds[] reference resolves
# into a declared element in SCAFFOLD.yaml.
# =============================================================================

scaffold_difficulty_design:

  # --------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains
  # --------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: settlement_proceeds_sight_vs_negotiation
        grounds:
          - calculations.settlement_proceeds
          - state_machines.PaymentSettlement.PENDING_to_PAID
          - entities.PaymentSettlement.fields.beneficiary_proceeds_minor_units
          - entities.PaymentSettlement.fields.negotiation_discount_minor_units
        distinguishing_aspect: |
          On the PaymentSettlement entity domain (financial-settlement), settlement_proceeds carries
          two valid algorithms — SIGHT_PAYMENT (no discount, paid_at = settlement creation time) and
          NEGOTIATION (discount = floor(base * 350bps * 7/360), paid_at at advance time). Identical
          principal and discrepancy-fee inputs produce different beneficiary_proceeds_minor_units.
        test_recipe:
          setup:
            - "Operator creates Bank issuing_bank=ISSUING, advising_bank=ADVISING, negotiating_bank=NEGOTIATING; Applicant + Beneficiary registered (status=ACTIVE)."
            - "Applicant creates LC: amount_minor_units=100000, tolerance_pct=0, currency=USD, lc_type=SIGHT, expiry_date=now()+90d, latest_shipment_date=now()+30d, required_documents=[COMMERCIAL_INVOICE,BILL_OF_LADING], discrepancy_fee_minor_units=7500."
            - "Submit, IssuingBank issues, AdvisingBank advises, LC reaches ACTIVE."
            - "Beneficiary submits Presentation P1 with drawing_amount_minor_units=100000 and attaches both required documents matching LC terms."
            - "Operator runs primary-review and cross-check (different reviewer ids); IssuingBank finalizes → Presentation EXAMINED_CLEAN."
          trigger:
            - "POST /presentations/{P1}/settlements (with body {}) — settlement_type defaults to SIGHT_PAYMENT mirroring LC.lc_type."
            - "POST /settlements/{S1}/execute-sight"
            - "Repeat the entire setup with a fresh LC (LC2 identical params except lc_type=USANCE for a third LC, OR keep SIGHT but now create settlement with override=NEGOTIATION) — for this test we use NEGOTIATION on LC2: a second LC2 same params but eligible negotiation. Beneficiary submits P2 drawing 100000; Operator examines; IssuingBank finalizes; POST /presentations/{P2}/settlements with body {settlement_type_override:'NEGOTIATION'}; POST /settlements/{S2}/negotiation-advance."
          assert:
            - "S1.beneficiary_proceeds_minor_units == 100000"
            - "S1.negotiation_discount_minor_units == 0"
            - "S2.beneficiary_proceeds_minor_units == 99932"
            - "S2.negotiation_discount_minor_units == 68"
            - "S1.beneficiary_proceeds_minor_units != S2.beneficiary_proceeds_minor_units (same principal, same fee=0, different variant)"

      - name: presentation_compliance_primary_vs_cross_check
        grounds:
          - calculations.presentation_compliance_check
          - state_machines.ExaminationReport.PRIMARY_DONE_to_CROSS_CHECK_DONE
          - state_machines.ExaminationReport.PRIMARY_DONE_to_CONFLICT
          - entities.ExaminationReport.fields.primary_outcome
          - entities.ExaminationReport.fields.secondary_outcome
        distinguishing_aspect: |
          On the ExaminationReport entity domain (compliance-review), presentation_compliance_check
          has two reviewer-specific variants. PRIMARY_REVIEW and CROSS_CHECK_REVIEW operate over
          the same frozen Document set but are submitted by different actors; if their outcomes
          diverge, the report enters CONFLICT and must be reset. Identical inputs but different
          reviewers can therefore validly produce different judgements of the same checklist.
        test_recipe:
          setup:
            - "LC fully reaches ACTIVE per the same boilerplate as instance #1."
            - "Beneficiary submits Presentation P1 with COMMERCIAL_INVOICE (correct amount/currency) and BILL_OF_LADING (with shipped_on_board_date within latest_shipment_date)."
            - "IssuingBank starts examination with primary_reviewer=op_alice, secondary_reviewer=op_bob."
          trigger:
            - "POST /examinations/{R}/primary-review with primary_outcome=CLEAN as op_alice."
            - "POST /examinations/{R}/cross-check with secondary_outcome=DISCREPANT and one Discrepancy(MISSING_DOCUMENT) as op_bob."
          assert:
            - "ExaminationReport.primary_outcome == 'CLEAN'"
            - "ExaminationReport.secondary_outcome == 'DISCREPANT'"
            - "ExaminationReport.status == 'CONFLICT' (not CROSS_CHECK_DONE — divergent outcomes)"
            - "ExaminationReport.final_outcome IS NULL (not yet FINALIZED)"

  # --------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes
  # --------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: compliance_check_seven_input_nonlinear   # mode (a)
        grounds:
          - calculations.presentation_compliance_check
          - entities.LetterOfCredit.fields.required_documents
          - entities.LetterOfCredit.fields.tolerance_pct
          - entities.LetterOfCredit.fields.latest_shipment_date
          - entities.LetterOfCredit.fields.expiry_date
          - entities.LetterOfCredit.fields.presentation_period_days
          - entities.Document.fields.payload
        distinguishing_aspect: |
          Mode (a): formula has seven inputs (I1..I7) with non-linear interaction. The outcome is
          CLEAN iff all seven booleans are true; otherwise DISCREPANT. Inputs include conditional
          predicates (I7 only applies when both CommercialInvoice and CertificateOfOrigin are
          present), tiered tolerance (I2 uses tolerance_pct), and aggregation across documents
          (I4 takes max(BoL.shipped_on_board_date)). Adding/removing a single document flips the
          outcome.
        test_recipe:
          setup:
            - "LC ACTIVE with required_documents=[COMMERCIAL_INVOICE,BILL_OF_LADING,CERTIFICATE_OF_ORIGIN], amount=100000, tolerance_pct=5, latest_shipment_date=2026-06-01, expiry_date=2026-08-01, presentation_period_days=21, currency=USD."
            - "Beneficiary creates Presentation P with shipment_date=2026-05-15, drawing_amount=100000."
            - "Beneficiary attaches CommercialInvoice(stated_amount=100000, currency=USD, country_of_origin='CN'), BillOfLading(payload.shipped_on_board_date=2026-05-15), CertificateOfOrigin(payload.country_of_origin='CN')."
          trigger:
            - "IssuingBank starts examination; Operator op_alice POST primary-review with primary_outcome=CLEAN; Operator op_bob POST cross-check with secondary_outcome=CLEAN; IssuingBank finalize."
          assert:
            - "Presentation.status == 'EXAMINED_CLEAN'"
            - "ExaminationReport.final_outcome == 'CLEAN'"
            - "Repeat with CertificateOfOrigin.payload.country_of_origin='VN' (mismatch with invoice 'CN'): final_outcome MUST be 'DISCREPANT' with one Discrepancy code='INCONSISTENT_DOCS'."
            - "Repeat with shipment_date=2026-06-02 (one day past latest_shipment_date=2026-06-01): one Discrepancy code='LATE_SHIPMENT' even though all other six inputs pass."

      - name: settlement_fee_then_discount_rounding_order   # mode (b)
        grounds:
          - calculations.settlement_proceeds
          - calculations.discrepancy_fee_calculation
          - entities.PaymentSettlement.fields.discrepancy_fee_minor_units
          - entities.PaymentSettlement.fields.negotiation_discount_minor_units
          - entities.LetterOfCredit.fields.discrepancy_fee_minor_units
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. settlement_proceeds explicitly pins
          'subtract fee BEFORE applying negotiation discount'. With principal=50000 and
          discrepancy_fee=7500, fee-first gives discount=floor(42500 * rate_fraction)=28 and
          proceeds=42472. Discount-first would give discount=floor(50000 * rate_fraction)=34,
          base=50000-34=49966, then proceeds=49966-7500=42466. The two orders produce different
          cents (42472 vs 42466). The scaffold pins fee-first.
        test_recipe:
          setup:
            - "LC ACTIVE with amount_minor_units=50000, tolerance_pct=0, currency=USD, discrepancy_fee_minor_units=7500."
            - "Beneficiary submits Presentation P with drawing_amount_minor_units=50000 and presents documents that yield one Discrepancy (e.g., CertificateOfOrigin missing → MISSING_DOCUMENT) → ExaminationReport finalizes DISCREPANT."
            - "Applicant POSTs applicant-decision with decision=ACCEPTED → Presentation moves to ACCEPTED_BY_APPLICANT."
            - "POST /presentations/{P}/settlements with body {settlement_type_override:'NEGOTIATION'} → S in PENDING."
          trigger:
            - "POST /settlements/{S}/negotiation-advance"
          assert:
            - "S.discrepancy_fee_minor_units == 7500"
            - "S.negotiation_discount_minor_units == 28   # floor((50000-7500) * 350/10000 * 7/360) = floor(42500*0.000680555) = 28"
            - "S.negotiation_advance_minor_units == 42472"
            - "S.beneficiary_proceeds_minor_units == 42472   # NOT 42466 (which would be discount-first ordering)"

  # --------------------------------------------------------------------------
  # Rule 3 — Non-linear state machine shape on different entities
  # --------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: examination_conflict_cycle
        grounds:
          - state_machines.ExaminationReport.PRIMARY_DONE_to_CONFLICT
          - state_machines.ExaminationReport.CONFLICT_to_IN_PROGRESS
          - state_machines.ExaminationReport.PRIMARY_DONE_to_CROSS_CHECK_DONE
        distinguishing_aspect: |
          ExaminationReport carries a true cycle: PRIMARY_DONE → CONFLICT → IN_PROGRESS → PRIMARY_DONE
          via reset. Re-entering IN_PROGRESS clears reviews and discrepancies (compensating side
          effect). This is a negotiation-round shape on the ExaminationReport entity, distinct from
          the linear A→B→C pipelines of LcAmendment and ReimbursementClaim.
        test_recipe:
          setup:
            - "LC ACTIVE; Presentation P with two well-formed documents; IssuingBank starts examination R."
          trigger:
            - "Operator op_alice POST primary-review primary_outcome=CLEAN."
            - "Operator op_bob POST cross-check secondary_outcome=DISCREPANT (with at least one Discrepancy)."
            - "IssuingBank POST /examinations/{R}/reset."
            - "Operator op_alice POST primary-review primary_outcome=DISCREPANT with two Discrepancies."
            - "Operator op_bob POST cross-check secondary_outcome=DISCREPANT."
            - "IssuingBank POST finalize."
          assert:
            - "After reset: ExaminationReport.primary_outcome IS NULL AND secondary_outcome IS NULL AND no Discrepancy rows exist for R."
            - "After re-review: ExaminationReport.status == 'CROSS_CHECK_DONE' (cycle returned to forward path)."
            - "After finalize: ExaminationReport.status == 'FINALIZED', final_outcome == 'DISCREPANT', exactly two Discrepancy rows (the ones from second primary-review)."

      - name: payment_settlement_branching_on_type
        grounds:
          - state_machines.PaymentSettlement.PENDING_to_PAID
          - state_machines.PaymentSettlement.PENDING_to_ACCEPTED
          - state_machines.PaymentSettlement.ACCEPTED_to_PAID
          - state_machines.PaymentSettlement.PAID_to_COMPENSATED
          - entities.PaymentSettlement.fields.settlement_type
        distinguishing_aspect: |
          PaymentSettlement is a fork-join branching machine on a different entity. From PENDING
          there are three divergent forward edges with different side-effect sets: SIGHT_PAYMENT
          via execute-sight (sets paid_at directly), USANCE_ACCEPTANCE via record-acceptance
          (sets accepted_at + maturity_date, then auto-promotes ACCEPTED→PAID at clock sweep),
          and NEGOTIATION via negotiation-advance (sets discount + cascades ReimbursementClaim
          creation). Each branch carries divergent computed fields.
        test_recipe:
          setup:
            - "Three independent LCs: LC_A (lc_type=SIGHT), LC_B (lc_type=USANCE, usance_tenor_days=60), LC_C (lc_type=SIGHT, used to allow NEGOTIATION override). Each ACTIVE with one EXAMINED_CLEAN Presentation drawing 10000."
          trigger:
            - "POST /presentations/{Pa}/settlements (body {}) → Sa.settlement_type='SIGHT_PAYMENT'; POST /settlements/{Sa}/execute-sight."
            - "POST /presentations/{Pb}/settlements (body {}) → Sb.settlement_type='USANCE_ACCEPTANCE'; POST /settlements/{Sb}/record-acceptance."
            - "POST /presentations/{Pc}/settlements (body {settlement_type_override:'NEGOTIATION'}) → Sc.settlement_type='NEGOTIATION'; POST /settlements/{Sc}/negotiation-advance."
          assert:
            - "Sa.status == 'PAID' AND Sa.paid_at IS NOT NULL AND Sa.maturity_date IS NULL AND Sa.negotiation_discount_minor_units == 0."
            - "Sb.status == 'ACCEPTED' AND Sb.accepted_at IS NOT NULL AND Sb.maturity_date == Sb.accepted_at + 60 days AND Sb.paid_at IS NULL."
            - "Sc.status == 'PAID' AND Sc.negotiation_discount_minor_units > 0 AND a ReimbursementClaim row exists with payment_settlement_id=Sc.id and status='SUBMITTED'."

  # --------------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from different triggers
  # --------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: negotiation_settle_three_hop_cascade   # depth 3
        grounds:
          - state_machines.Presentation.EXAMINED_CLEAN_to_SETTLED
          - state_machines.PaymentSettlement.PENDING_to_PAID
          - entities.PaymentSettlement.fields.beneficiary_proceeds_minor_units
          - entities.LetterOfCredit.fields.drawn_amount_minor_units
          - entities.LetterOfCredit.fields.available_amount_minor_units
          - calculations.lc_available_amount
          - entities.ReimbursementClaim.fields.status
        distinguishing_aspect: |
          Trigger: POST /settlements/{Sc}/negotiation-advance. Hop1: PaymentSettlement.status flips
          PENDING→PAID and computes negotiation_advance_minor_units (mutation #1). Caused by Hop1:
          Hop2: a ReimbursementClaim row is auto-created in SUBMITTED status with claimed_amount =
          principal (mutation #2 on a different entity, caused by the PAID transition). Caused by
          Hop2's claim-creation effect on the LC ledger: Hop3: LC.drawn_amount_minor_units is
          incremented by principal AND LC.available_amount_minor_units is recomputed (mutation
          #3, caused by Hop2). Each hop is caused by the previous hop, not by the original action.
        test_recipe:
          setup:
            - "LC ACTIVE with amount_minor_units=200000, tolerance_pct=0, lc_type=SIGHT (to allow NEGOTIATION override). Initial drawn_amount=0, available=200000."
            - "Beneficiary submits Presentation P with drawing_amount=80000, attaches matching documents; reaches EXAMINED_CLEAN."
            - "POST /presentations/{P}/settlements with body {settlement_type_override:'NEGOTIATION'}."
          trigger:
            - "POST /settlements/{S}/negotiation-advance"
          assert:
            - "Hop1: PaymentSettlement S.status == 'PAID' AND S.negotiation_advance_minor_units == 80000 - floor(80000 * 0.000680555) == 80000 - 54 == 79946 AND S.beneficiary_proceeds_minor_units == 79946."
            - "Hop2: exactly one ReimbursementClaim row exists with payment_settlement_id == S.id, status == 'SUBMITTED', claimed_amount_minor_units == 80000."
            - "Hop3: LC.drawn_amount_minor_units == 80000 (incremented from 0 by 80000) AND LC.available_amount_minor_units == 120000."

      - name: reimbursement_dispute_compensation_cascade   # depth 3, different trigger
        grounds:
          - state_machines.ReimbursementClaim.SUBMITTED_to_DISPUTED
          - state_machines.PaymentSettlement.PAID_to_COMPENSATED
          - state_machines.Presentation.EXAMINED_CLEAN_to_SETTLED       # the precursor edge that the cascade reverts
          - entities.LetterOfCredit.fields.drawn_amount_minor_units
          - entities.PaymentSettlement.fields.status
        distinguishing_aspect: |
          Trigger: POST /reimbursement-claims/{C}/dispute (entirely different from Rule 4 instance #1's
          trigger). Hop1: ReimbursementClaim.status flips SUBMITTED→DISPUTED (mutation #1).
          Caused by Hop1: Hop2: PaymentSettlement.status flips PAID→COMPENSATED (mutation #2 on
          different entity, caused by the dispute filing as documented in the SUBMITTED→DISPUTED
          side_effects). Caused by Hop2: Hop3: LC.drawn_amount_minor_units is decremented by
          principal AND Presentation reverts EXAMINED_CLEAN (mutation #3, caused by the
          compensate transition's documented side_effects).
        test_recipe:
          setup:
            - "Run the entire setup of Rule 4 instance #1 (negotiation-advance) so that S.status='PAID', LC.drawn_amount=80000, claim C exists in SUBMITTED."
          trigger:
            - "POST /reimbursement-claims/{C}/dispute with body {reason:'discrepancy'}"
          assert:
            - "Hop1: ReimbursementClaim.status == 'DISPUTED'."
            - "Hop2: PaymentSettlement.status == 'COMPENSATED'."
            - "Hop3: LC.drawn_amount_minor_units == 0 (reverted) AND LC.available_amount_minor_units == 200000 (back to original cap) AND Presentation.status == 'EXAMINED_CLEAN' (reverted from SETTLED)."

  # --------------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # --------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: existence_vs_state_on_presentation_create
        grounds:
          - validations[priority=3]
          - validations[priority=5]
          - errors.ERR_NOT_FOUND
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: |
          Categories pair = (existence × state). On POST /letters-of-credit/{lcId}/presentations,
          when lcId references a non-existent LC AND the request body would also represent an
          invalid state transition (the absent LC would be in DRAFT and not allow presentation
          creation), priority 3 (existence) must win over priority 5 (state). Tested via two
          dual-failure inputs.
        test_recipe:
          setup:
            - "LC1 created in DRAFT (NOT submitted, NOT issued)."
            - "Capture a non-existent UUID for lcId fake_id (e.g., '00000000-0000-0000-0000-000000000000')."
          trigger:
            - "Beneficiary POST /letters-of-credit/{fake_id}/presentations with body {shipment_date: now()-1d, drawing_amount_minor_units: 10000}."
          assert:
            - "HTTP status == 404."
            - "Response data.error_id == 'ERR_NOT_FOUND' (priority 3, existence)."
            - "Response data.error_id != 'ERR_INVALID_STATE_TRANSITION' (priority 5, state — state loses to existence)."

      - name: business_referential_vs_business_fiscal_on_presentation_create
        grounds:
          - validations[priority=12]
          - validations[priority=14]
          - errors.ERR_SHIPMENT_OUT_OF_WINDOW
          - errors.ERR_LC_INSUFFICIENT_AVAILABLE
        distinguishing_aspect: |
          Categories pair = (business_referential × business_fiscal). On POST
          /letters-of-credit/{lcId}/presentations against a valid ACTIVE LC, when shipment_date >
          LC.latest_shipment_date AND drawing_amount > LC.available_amount, priority 12
          (business_referential, ERR_SHIPMENT_OUT_OF_WINDOW) must win over priority 14
          (business_fiscal, ERR_LC_INSUFFICIENT_AVAILABLE). This pair is structurally different
          from instance #1's existence×state pair.
        test_recipe:
          setup:
            - "LC ACTIVE with amount_minor_units=10000, tolerance_pct=0, latest_shipment_date=2026-06-01, expiry_date=2026-08-01."
          trigger:
            - "Beneficiary POST /letters-of-credit/{lcId}/presentations with body {shipment_date: '2026-06-15', drawing_amount_minor_units: 99999}.   # both out-of-window AND over-cap"
          assert:
            - "HTTP status == 422."
            - "Response data.error_id == 'ERR_SHIPMENT_OUT_OF_WINDOW' (priority 12 wins)."
            - "Response data.error_id != 'ERR_LC_INSUFFICIENT_AVAILABLE' (priority 14 loses)."

  # --------------------------------------------------------------------------
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # --------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: lc_available_amount_inclusive_upper_boundary    # currency-amount boundary on /presentations
        grounds:
          - calculations.lc_available_amount
          - validations[priority=14]
          - entities.LetterOfCredit.fields.available_amount_minor_units
          - errors.ERR_LC_INSUFFICIENT_AVAILABLE
        distinguishing_aspect: |
          Metric: integer minor-currency units (LC.available_amount_minor_units). Endpoint: POST
          /letters-of-credit/{lcId}/presentations. Boundary: drawing_amount == available is allowed
          (inclusive upper); drawing_amount == available + 1 is rejected. The check uses '<=' not '<'.
        test_recipe:
          setup:
            - "LC1 ACTIVE with amount_minor_units=10000, tolerance_pct=0, drawn_amount=0; available=10000."
          trigger:
            - "Beneficiary POST /letters-of-credit/{lc1}/presentations with body {drawing_amount_minor_units: 10000, shipment_date: today}.   # exactly equal boundary"
            - "After it succeeds, LC1.available drops to 0. Beneficiary POSTs another presentation with drawing_amount_minor_units=1."
          assert:
            - "First call HTTP 201, Presentation.drawing_amount_minor_units == 10000 (inclusive boundary accepted)."
            - "Second call HTTP 409, error_id == 'ERR_LC_INSUFFICIENT_AVAILABLE' (1 > 0 fails strict-positive remaining check)."
            - "Repeat with separate LC2 amount=10000 tolerance_pct=0; first attempt drawing=10001; HTTP 409 ERR_LC_INSUFFICIENT_AVAILABLE (10001 > 10000)."

      - name: refusal_window_strict_greater_than_five_banking_days   # banking-day boundary on /_clock/advance sweep
        grounds:
          - calculations.refusal_deadline_check
          - state_machines.Presentation.EXAMINED_DISCREPANT_to_EXAMINED_CLEAN
          - entities.Presentation.fields.refusal_deadline
          - errors.ERR_REFUSAL_DEADLINE_PASSED
        distinguishing_aspect: |
          Metric: integer banking-day count (NOT calendar days). Endpoint: POST /_clock/advance
          (sweep) and POST /presentations/{presentationId}/refuse. Boundary pinned to
          'banking_days_elapsed > 5' (strictly greater than, not >=). Different metric (banking
          days, weekends excluded) from instance #1's currency amount, and reachable through a
          different endpoint.
        test_recipe:
          setup:
            - "Pin Clock.now to a Monday 2026-04-06 09:00 UTC."
            - "LC ACTIVE; Beneficiary submits Presentation P on Monday 2026-04-06; presented_at=Monday 2026-04-06."
            - "IssuingBank starts examination; reviewers submit DISCREPANT outcomes; finalize → Presentation.status='EXAMINED_DISCREPANT' (refusal_notified_at IS NULL because IssuingBank has not yet posted a refusal)."
          trigger:
            - "POST /_clock/advance with seconds=5 banking days (Mon→Tue→Wed→Thu→Fri→Mon next, so 5 banking days = 7 calendar days). Now Mon 2026-04-13 09:00 UTC. banking_days_elapsed = 5 — still in window per pinning."
            - "On the same advance: query Presentation. Then POST /_clock/advance with seconds=86400 (advance 1 calendar day → Tue 2026-04-14, banking_days_elapsed=6 > 5)."
          assert:
            - "After first advance (5 banking days elapsed): Presentation.status STILL == 'EXAMINED_DISCREPANT' (boundary value 5 is NOT yet 'more than 5')."
            - "After second advance (6 banking days elapsed): Presentation.status == 'EXAMINED_CLEAN' (auto-promoted; IssuingBank lost right to refuse)."
            - "Subsequent IssuingBank attempt POST /presentations/{P}/refuse → HTTP 409 error_id == 'ERR_REFUSAL_DEADLINE_PASSED' (or ERR_INVALID_STATE_TRANSITION since Presentation no longer in EXAMINED_DISCREPANT)."

  # --------------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # --------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: presentation_start_examination_requires_lc_active
        grounds:
          - state_machines.Presentation.SUBMITTED_to_UNDER_EXAMINATION
          - state_machines.LetterOfCredit.UNDER_REVIEW_to_ISSUED
          - state_machines.LetterOfCredit.ISSUED_to_ADVISED
          - state_machines.LetterOfCredit.ADVISED_to_ACTIVE
          - validations[priority=5]
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: |
          Entity pair = (Presentation × LetterOfCredit). The valid transition
          Presentation.SUBMITTED → UNDER_EXAMINATION is gated by LC.lifecycle_status ∈ {ACTIVE,
          EXPIRED}. If the LC is ISSUED or ADVISED (pre-confirmation) the start-examination call
          is rejected even though Presentation itself is in SUBMITTED.
        test_recipe:
          setup:
            - "LC issued (lifecycle_status=ISSUED) but NOT yet advised. confirmation_required=false to avoid CONFIRMED gating."
            - "Manually create a Presentation row by direct API call — actually only Beneficiary can submit. Adapt: do NOT advise yet, but the LC is at ISSUED. Beneficiary submits Presentation (the create endpoint may or may not gate; it does NOT in §1.4, only the start-examination does)."
            - "(Alternative: the scaffold permits Presentation creation against an ISSUED LC; the cross-entity gate is on start-examination only.)"
          trigger:
            - "IssuingBank POST /presentations/{P}/start-examination with body {primary_reviewer_id: op_alice, secondary_reviewer_id: op_bob}."
          assert:
            - "HTTP 409, error_id == 'ERR_INVALID_STATE_TRANSITION' (LC.lifecycle_status=ISSUED ∉ {ACTIVE,EXPIRED})."
            - "After AdvisingBank.advise + system promotion to ACTIVE, the same call succeeds (HTTP 201, ExaminationReport in IN_PROGRESS)."

      - name: reimbursement_honor_requires_settlement_paid
        grounds:
          - state_machines.ReimbursementClaim.SUBMITTED_to_HONORED
          - state_machines.PaymentSettlement.PENDING_to_PAID
          - entities.PaymentSettlement.fields.status
          - entities.ReimbursementClaim.fields.status
          - validations[priority=5]
        distinguishing_aspect: |
          Entity pair = (ReimbursementClaim × PaymentSettlement) — entirely different from
          instance #1's (Presentation × LetterOfCredit). The honor transition is logically
          dependent on PaymentSettlement.status='PAID' (claim only exists once negotiation-advance
          has set settlement.PAID); a dispute-then-honor sequence further requires the claim's
          parent settlement to be re-eligible.
        test_recipe:
          setup:
            - "Run negotiation-advance setup so PaymentSettlement.status='PAID' and ReimbursementClaim C exists in SUBMITTED."
          trigger:
            - "IssuingBank POST /reimbursement-claims/{C}/honor."
          assert:
            - "HTTP 200, ReimbursementClaim.status == 'HONORED', honored_amount_minor_units == claimed_amount_minor_units, honored_at IS NOT NULL."
            - "Independently: POST /reimbursement-claims/{C}/dispute, then POST /reimbursement-claims/{C}/honor. The DISPUTED→HONORED edge is allowed; status flips to HONORED. (PaymentSettlement was COMPENSATED by the dispute side-effect; the cross-entity rule is satisfied because the claim's lifecycle remains tied to the settlement's current state being non-EXTINGUISHED.)"

  # --------------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # --------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: lc_amount_aggregate_capacity_overlap
        grounds:
          - calculations.lc_available_amount
          - validations[priority=14]
          - entities.LetterOfCredit.fields.available_amount_minor_units
          - entities.LetterOfCredit.fields.drawn_amount_minor_units
          - errors.ERR_LC_INSUFFICIENT_AVAILABLE
          - concurrency_rules[two beneficiaries]
        distinguishing_aspect: |
          Resource = LetterOfCredit (the LC is the fiscal-resource). Interval semantics:
          AGGREGATE-CAPACITY overlap — multiple Presentations 'occupy' fixed shares of the LC's
          drawing budget; the second draw is rejected if the cumulative occupied amount would
          exceed cap = floor(amount * (100+tolerance_pct)/100). No time-component; the 'overlap'
          is amount-overlap, not time-overlap. First-writer-wins serialization.
        test_recipe:
          setup:
            - "LC ACTIVE with amount_minor_units=10000, tolerance_pct=0; drawn_amount=0."
            - "Beneficiary submits Presentation P1 drawing 7000; reaches EXAMINED_CLEAN; settle SIGHT (drawn=7000, available=3000)."
          trigger:
            - "Beneficiary submits Presentation P2 drawing 4000."
          assert:
            - "HTTP 409, error_id == 'ERR_LC_INSUFFICIENT_AVAILABLE' — 4000 > 3000 (aggregate-capacity overflow)."
            - "Repeat with drawing 3000 — succeeds (boundary inclusive). Then drawing 1 — fails (capacity exhausted)."

      - name: refusal_time_window_overlap_with_auto_promotion
        grounds:
          - calculations.refusal_deadline_check
          - state_machines.Presentation.EXAMINED_DISCREPANT_to_EXAMINED_CLEAN
          - state_machines.Presentation.EXAMINED_DISCREPANT_to_REFUSED
          - entities.Presentation.fields.refusal_deadline
          - entities.Presentation.fields.refusal_notified_at
          - errors.ERR_REFUSAL_DEADLINE_PASSED
        distinguishing_aspect: |
          Resource = Presentation (the document-presentation slot). Interval semantics:
          TIME-WINDOW overlap with AUTO-PROMOTION on lapse — the IssuingBank's right-to-refuse
          'occupies' the half-open interval [presented_at, presented_at + 5 banking days) on the
          Presentation. Crossing the boundary auto-promotes the Presentation EXAMINED_DISCREPANT
          → EXAMINED_CLEAN (issuing bank's occupation lapses). Different geometric semantics from
          instance #1: time-buffer with banking-day arithmetic and auto-lapse, vs. instance #1's
          aggregate-capacity (no time component).
        test_recipe:
          setup:
            - "Pin Clock.now to Monday 2026-04-06 09:00 UTC. LC ACTIVE."
            - "Beneficiary submits Presentation P; documents EXAMINED_DISCREPANT; refusal_notified_at NULL."
          trigger:
            - "POST /_clock/advance to advance exactly 5 banking days (so banking_days_elapsed=5, still in window). Then advance one more banking day (=6, lapsed)."
            - "After lapse: IssuingBank POST /presentations/{P}/refuse."
          assert:
            - "After 5-banking-day advance: Presentation.status == 'EXAMINED_DISCREPANT' (window not yet exceeded)."
            - "After 6-banking-day advance: Presentation.status == 'EXAMINED_CLEAN' (auto-promoted; refusal-window occupation lapsed)."
            - "POST /presentations/{P}/refuse → HTTP 409 error_id ∈ {'ERR_REFUSAL_DEADLINE_PASSED', 'ERR_INVALID_STATE_TRANSITION'} — the refusal slot is no longer occupiable."

  # --------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # --------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: settlement_compensate_preserves_drawn_amount
        grounds:
          - state_machines.PaymentSettlement.PENDING_to_PAID
          - state_machines.PaymentSettlement.PAID_to_COMPENSATED
          - entities.LetterOfCredit.fields.drawn_amount_minor_units
          - calculations.lc_available_amount
        distinguishing_aspect: |
          Conserved quantity = LC.drawn_amount_minor_units (a cumulative integer ledger of drawn
          principal in minor currency units). Forward action negotiation-advance increments it
          by principal; compensating action settlement.compensate decrements it by principal.
          The named global invariant: for any settlement S with status='COMPENSATED', the net
          contribution of S to LC.drawn_amount_minor_units MUST equal zero
          (LC.drawn_amount_after - LC.drawn_amount_before == 0 across the forward+compensate pair).
        test_recipe:
          setup:
            - "LC ACTIVE with amount=200000, tolerance_pct=0. Snapshot LC.drawn_amount_minor_units before=0."
            - "Run negotiation-advance for Presentation P drawing 80000. Snapshot LC.drawn_amount_minor_units after_forward=80000."
          trigger:
            - "POST /settlements/{S}/compensate with body {reason:'reimbursement-disputed'}."
          assert:
            - "Snapshot LC.drawn_amount_minor_units after_compensate=0."
            - "Invariant: after_compensate - before == 0 (named global LC.drawn_amount_minor_units delta is exactly zero across the negotiation-advance + compensate pair)."
            - "LC.available_amount_minor_units back to 200000 (cap)."

      - name: amendment_withdraw_preserves_lc_terms
        grounds:
          - state_machines.LcAmendment.PENDING_to_WITHDRAWN
          - state_machines.LetterOfCredit.NONE_to_PENDING_APPLICANT
          - entities.LetterOfCredit.fields.amount_minor_units
          - entities.LetterOfCredit.fields.expiry_date
          - entities.LetterOfCredit.fields.latest_shipment_date
          - entities.LetterOfCredit.fields.tolerance_pct
          - entities.LcAmendment.fields.changes
        distinguishing_aspect: |
          Conserved quantity = the *tuple* (LC.amount_minor_units, LC.expiry_date,
          LC.latest_shipment_date, LC.tolerance_pct) — entirely different from instance #1's
          drawn_amount cumulative integer. Forward action POST .../amendments creates a PENDING
          LcAmendment carrying changes={amount: new_amount, expiry: new_expiry, ...}; compensating
          action POST .../amendments/{id}/withdraw restores amendment_consent_status to NONE and
          MUST leave every field of the LC term-tuple equal to its pre-amendment value (the
          merge has not yet occurred at PENDING). The named global invariant:
          (amount_minor_units, expiry_date, latest_shipment_date, tolerance_pct) before_create
          == after_withdraw, fieldwise.
        test_recipe:
          setup:
            - "LC ACTIVE with amount_minor_units=100000, tolerance_pct=0, expiry_date='2026-08-01', latest_shipment_date='2026-06-01'. Capture 4-tuple before=(100000, 0, '2026-08-01', '2026-06-01')."
            - "IssuingBank POST /letters-of-credit/{lcId}/amendments with body {changes:{amount_minor_units:150000, expiry_date:'2026-12-01'}}. Amendment A in PENDING. amendment_consent_status='PENDING_APPLICANT'."
          trigger:
            - "IssuingBank POST /letters-of-credit/{lcId}/amendments/{A}/withdraw."
          assert:
            - "LcAmendment A.status == 'WITHDRAWN'."
            - "LC.amendment_consent_status == 'NONE' (reset)."
            - "Invariant: capture 4-tuple after=(LC.amount_minor_units, LC.tolerance_pct, LC.expiry_date, LC.latest_shipment_date) and assert after == before == (100000, 0, '2026-08-01', '2026-06-01'). The named conserved quantity is preserved: term-tuple delta is the zero element across amendment-create + amendment-withdraw."
