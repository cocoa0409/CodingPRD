  # ===========================================================================
  - section: errors
    instances:
      - name: unauthenticated_request_returns_400
        claim_type: violation_to_error
        grounds:
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
          - validations[priority=1]
        distinguishing_aspect: "A request carrying no X-User-Role header is rejected 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any routing or existence check — even against a non-existent resource id."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /rail/yards/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response status 400 and err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (auth precedes existence)"

      - name: forbidden_role_returns_403
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
          - validations[priority=2]
        distinguishing_aspect: "CrewDispatcher attempting POST /rail/train-plans is rejected 403 ERR_INSUFFICIENT_PERMISSIONS — authorization precedes body validation, so even a malformed body yields 403 not 400."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /rail/train-plans"
              payload: {}
              as: CrewDispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response status 403 and err == ERR_INSUFFICIENT_PERMISSIONS (not 400 ERR_INVALID_REQUEST)"

      - name: missing_required_field_returns_400
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Yard creation without classification_capacity_cars returns 400 ERR_INVALID_REQUEST; the same is true for a non-positive dwell_benchmark_hours — required-field and domain-range violations share the request-shape error."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /rail/yards"
              payload: { yard_code: "VF-1", dwell_benchmark_hours: 10 }
              as: NetworkPlanner
              captures: { err: $.data.error_id }
          assert:
            - "response status 400 and err == ERR_INVALID_REQUEST"
            - "GET /rail/yards returns total_count 0 (nothing persisted)"

      - name: disjoint_trip_chain_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_TRIP_PLAN_DISJOINT]
          - validations[priority=6]
        distinguishing_aspect: "An itinerary whose second leg's origin yard differs from the first leg's destination yard is rejected 422 ERR_TRIP_PLAN_DISJOINT — the chain check is referential, evaluated before posture or pickup-window gates."
        test_recipe:
          setup:
            - "Yards VF-A, VF-B, VF-C, VF-D; ACTIVE plans VF-P1 (A->B) and VF-P2 (C->D); customer; shipment VF-S origin VF-A destination VF-D."
          setup_api_calls:
            - call: "POST /rail/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T06:00:00Z" }
              as: NetworkPlanner
            - call: "POST /rail/yards"
              payload: { yard_code: "VF-A", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yA: $.data.id }
            - call: "POST /rail/yards"
              payload: { yard_code: "VF-B", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yB: $.data.id }
            - call: "POST /rail/yards"
              payload: { yard_code: "VF-C", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yC: $.data.id }
            - call: "POST /rail/yards"
              payload: { yard_code: "VF-D", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yD: $.data.id }
            - call: "POST /rail/train-plans"
              payload: { train_symbol: "VF-P1", origin_yard_id: "${yA}", destination_yard_id: "${yB}", scheduled_departure_utc: "2026-09-02T08:00:00Z", cutoff_minutes: 60, frequency_mask: ["WED"], route_distance_miles: 300, dwell_benchmark_hours: 10 }
              as: NetworkPlanner
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /rail/train-plans"
              payload: { train_symbol: "VF-P2", origin_yard_id: "${yC}", destination_yard_id: "${yD}", scheduled_departure_utc: "2026-09-03T08:00:00Z", cutoff_minutes: 60, frequency_mask: ["THU"], route_distance_miles: 300, dwell_benchmark_hours: 10 }
              as: NetworkPlanner
              captures: { p2: $.data.id, p2_v: $.data.version }
            - call: "POST /rail/train-plans/${p1}/activate"
              payload: { expected_train_plan_version: "${p1_v}" }
              as: NetworkPlanner
            - call: "POST /rail/train-plans/${p2}/activate"
              payload: { expected_train_plan_version: "${p2_v}" }
              as: NetworkPlanner
            - call: "POST /rail/customers"
              payload: { customer_code: "VF-CU", name: "Disjoint Shipper" }
              as: ServiceManager
              captures: { cu: $.data.id }
            - call: "POST /rail/shipments"
              payload: { customer_id: "${cu}", origin_yard_id: "${yA}", destination_yard_id: "${yD}", car_count: 1, first_mile_pickup_by: "2026-09-02T06:00:00Z", last_mile_delivery_by: "2026-09-06T00:00:00Z", committed_route_miles: 600 }
              as: ServiceManager
              captures: { s: $.data.id, s_v: $.data.version }
          trigger:
            - call: "POST /rail/shipments/${s}/trip-legs"
              payload: { expected_shipment_version: "${s_v}", legs: [{ train_plan_id: "${p1}", leg_sequence: 1 }, { train_plan_id: "${p2}", leg_sequence: 2 }] }
              as: NetworkPlanner
              captures: { err: $.data.error_id }
          assert:
            - "response status 422 and err == ERR_TRIP_PLAN_DISJOINT (B != C breaks the chain)"
            - "Shipment.${s}.trip_plan_status == UNASSIGNED and no TripLeg persisted for ${s}"

  # ===========================================================================
  - section: rbac
    instances:
      - name: service_manager_cannot_write_plans
        claim_type: role_exclusive_denial
        grounds:
          - roles.ServiceManager
          - roles.NetworkPlanner
        distinguishing_aspect: "ServiceManager is denied every NetworkPlanner exclusive write (plan create, activate, retire, trip-leg assignment, clock set) with 403 — peer-role isolation, not a hierarchy."
        test_recipe:
          setup:
            - "Yards RB-A, RB-B; plan RB-P exists (DRAFT)."
          setup_api_calls:
            - call: "POST /rail/yards"
              payload: { yard_code: "RB-A", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yA: $.data.id }
            - call: "POST /rail/yards"
              payload: { yard_code: "RB-B", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yB: $.data.id }
            - call: "POST /rail/train-plans"
              payload: { train_symbol: "RB-P", origin_yard_id: "${yA}", destination_yard_id: "${yB}", scheduled_departure_utc: "2026-09-02T08:00:00Z", cutoff_minutes: 60, frequency_mask: ["WED"], route_distance_miles: 300, dwell_benchmark_hours: 10 }
              as: NetworkPlanner
              captures: { p: $.data.id, p_v: $.data.version }
          trigger:
            - call: "POST /rail/train-plans/${p}/activate"
              payload: { expected_train_plan_version: "${p_v}" }
              as: ServiceManager
              captures: { err: $.data.error_id }
          assert:
            - "response status 403 and err == ERR_INSUFFICIENT_PERMISSIONS"
            - "TrainPlan.${p}.status == DRAFT (unchanged)"

      - name: terminal_superintendent_cannot_triage_but_reads_everything
        claim_type: role_shared_allowed
        grounds:
          - roles.TerminalSuperintendent
          - roles.ServiceManager
        distinguishing_aspect: "TerminalSuperintendent is denied POST /rail/service-exceptions/{id}/triage (ServiceManager exclusive) yet every role — including TerminalSuperintendent — can GET all resources, proving the shared read surface."
        test_recipe:
          setup:
            - "Yards RB2-A, RB2-B exist; no exceptions exist."
          setup_api_calls:
            - call: "POST /rail/yards"
              payload: { yard_code: "RB2-A", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yA: $.data.id }
            - call: "POST /rail/yards"
              payload: { yard_code: "RB2-B", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yB: $.data.id }
          trigger:
            - call: "POST /rail/service-exceptions/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/triage"
              payload: { triage_notes: "x", root_cause_code: "OTHER" }
              as: TerminalSuperintendent
              captures: { err: $.data.error_id }
            - call: "GET /rail/yards/${yA}"
              payload: {}
              as: Any
              captures: { code: $.data.yard_code }
          assert:
            - "triage attempt: response status 403 and err == ERR_INSUFFICIENT_PERMISSIONS (auth precedes the 404 that the unknown id would otherwise yield)"
            - "read: code == \"RB2-A\" — the shared GET surface works for the same role"

      - name: network_planner_cannot_operate_departures
        claim_type: role_exclusive_denial
        grounds:
          - roles.NetworkPlanner
          - roles.TerminalSuperintendent
        distinguishing_aspect: "NetworkPlanner (the most powerful design role) is still denied TerminalSuperintendent's operational writes — POST /rail/train-departures, finalize, cancel, and car-events all return 403 for it."
        test_recipe:
          setup:
            - "Yards RB3-A, RB3-B; ACTIVE plan RB3-P; pool; AVAILABLE locomotive at RB3-A."
          setup_api_calls:
            - call: "POST /rail/yards"
              payload: { yard_code: "RB3-A", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yA: $.data.id }
            - call: "POST /rail/yards"
              payload: { yard_code: "RB3-B", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yB: $.data.id }
            - call: "POST /rail/train-plans"
              payload: { train_symbol: "RB3-P", origin_yard_id: "${yA}", destination_yard_id: "${yB}", scheduled_departure_utc: "2026-09-01T08:00:00Z", cutoff_minutes: 60, frequency_mask: ["TUE"], route_distance_miles: 300, dwell_benchmark_hours: 10 }
              as: NetworkPlanner
              captures: { p: $.data.id, p_v: $.data.version }
            - call: "POST /rail/train-plans/${p}/activate"
              payload: { expected_train_plan_version: "${p_v}" }
              as: NetworkPlanner
            - call: "POST /rail/crew-pools"
              payload: { home_yard_id: "${yA}", craft: "CONDUCTOR", service_date: "2026-09-01", crews_available: 2 }
              as: CrewDispatcher
              captures: { pool: $.data.id }
            - call: "POST /rail/locomotives"
              payload: { unit_number: "RB3-UP1", current_yard_id: "${yA}", horsepower: 4400 }
              as: PowerPlanner
              captures: { loco: $.data.id }
          trigger:
            - call: "POST /rail/train-departures"
              payload: { train_plan_id: "${p}", service_date: "2026-09-01", crew_pool_id: "${pool}", locomotive_id: "${loco}", car_count_planned: 5, crew_hours_estimated: 6 }
              as: NetworkPlanner
              captures: { err: $.data.error_id }
          assert:
            - "response status 403 and err == ERR_INSUFFICIENT_PERMISSIONS"
            - "Locomotive.${loco}.status == AVAILABLE and GET /rail/train-departures returns total_count 0"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_on_plan_activate
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[train-plan-activate-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "The client reads version 1, a first activation advances the plan to version 2, and the client's second activation still carrying expected_train_plan_version 1 is rejected 412 ERR_STALE_VERSION — two strictly sequential requests deterministically exercise the OCC path."
        test_recipe:
          setup:
            - "Yards OC-A, OC-B; DRAFT plan OC-P at version 1."
          setup_api_calls:
            - call: "POST /rail/yards"
              payload: { yard_code: "OC-A", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yA: $.data.id }
            - call: "POST /rail/yards"
              payload: { yard_code: "OC-B", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yB: $.data.id }
            - call: "POST /rail/train-plans"
              payload: { train_symbol: "OC-P", origin_yard_id: "${yA}", destination_yard_id: "${yB}", scheduled_departure_utc: "2026-09-02T08:00:00Z", cutoff_minutes: 60, frequency_mask: ["WED"], route_distance_miles: 300, dwell_benchmark_hours: 10 }
              as: NetworkPlanner
              captures: { p: $.data.id, p_v: $.data.version }
          trigger:
            - call: "POST /rail/train-plans/${p}/activate"
              payload: { expected_train_plan_version: "${p_v}" }
              as: NetworkPlanner
            - call: "POST /rail/train-plans/${p}/activate"
              payload: { expected_train_plan_version: "${p_v} - 1" }
              as: NetworkPlanner
              captures: { err: $.data.error_id }
          assert:
            - "first activate succeeds (plan ACTIVE, version 2)"
            - "second activate with the stale version: response status 412 and err == ERR_STALE_VERSION"
            - "TrainPlan.${p}.version == 2 (the rejected write did not bump it)"

      - name: occ_stale_version_on_trip_plan_assignment
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[trip-plan-assign-stale-shipment]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "A replan carrying the pre-assignment shipment version is rejected 412: the first assignment bumped Shipment.version from 1 to 2, so the client's stale expected_shipment_version 1 fails OCC even though the replan itself is otherwise legal."
        test_recipe:
          setup:
            - "Yards OC2-A, OC2-B; ACTIVE plan OC2-P dep 2026-09-02T08:00:00Z WED; customer; shipment OC2-S (version 1 captured at creation). Clock 2026-09-01T07:00:00Z (before pickup_by 2026-09-02T06:00:00Z)."
          setup_api_calls:
            - call: "POST /rail/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T07:00:00Z" }
              as: NetworkPlanner
            - call: "POST /rail/yards"
              payload: { yard_code: "OC2-A", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yA: $.data.id }
            - call: "POST /rail/yards"
              payload: { yard_code: "OC2-B", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yB: $.data.id }
            - call: "POST /rail/train-plans"
              payload: { train_symbol: "OC2-P", origin_yard_id: "${yA}", destination_yard_id: "${yB}", scheduled_departure_utc: "2026-09-02T08:00:00Z", cutoff_minutes: 60, frequency_mask: ["WED"], route_distance_miles: 300, dwell_benchmark_hours: 10 }
              as: NetworkPlanner
              captures: { p: $.data.id, p_v: $.data.version }
            - call: "POST /rail/train-plans/${p}/activate"
              payload: { expected_train_plan_version: "${p_v}" }
              as: NetworkPlanner
            - call: "POST /rail/customers"
              payload: { customer_code: "OC2-CU", name: "OCC Shipper" }
              as: ServiceManager
              captures: { cu: $.data.id }
            - call: "POST /rail/shipments"
              payload: { customer_id: "${cu}", origin_yard_id: "${yA}", destination_yard_id: "${yB}", car_count: 1, first_mile_pickup_by: "2026-09-02T06:00:00Z", last_mile_delivery_by: "2026-09-05T00:00:00Z", committed_route_miles: 300 }
              as: ServiceManager
              captures: { s: $.data.id, s_v: $.data.version }
          trigger:
            - call: "POST /rail/shipments/${s}/trip-legs"
              payload: { expected_shipment_version: "${s_v}", legs: [{ train_plan_id: "${p}", leg_sequence: 1 }] }
              as: NetworkPlanner
            - call: "POST /rail/shipments/${s}/trip-legs"
              payload: { expected_shipment_version: "${s_v}", legs: [{ train_plan_id: "${p}", leg_sequence: 1 }] }
              as: NetworkPlanner
              captures: { err: $.data.error_id }
          assert:
            - "first assignment succeeds (trip_plan_status ASSIGNED, Shipment.version == 2)"
            - "second assignment with the stale version: response status 412 and err == ERR_STALE_VERSION"

      - name: version_increments_on_every_mutation
        claim_type: derived_field_reconciliation
        grounds:
          - entities.TrainPlan.fields
        distinguishing_aspect: "common_fields versioning: a plan's version walks 1 (create) -> 2 (activate) -> 3 (retire) and updated_at refreshes at each hop — every mutation, and only mutations, advance the counter."
        test_recipe:
          setup:
            - "Yards OC3-A, OC3-B; plan OC3-P created at clock 2026-09-01T06:00:00Z; no departures or legs reference it."
          setup_api_calls:
            - call: "POST /rail/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T06:00:00Z" }
              as: NetworkPlanner
            - call: "POST /rail/yards"
              payload: { yard_code: "OC3-A", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yA: $.data.id }
            - call: "POST /rail/yards"
              payload: { yard_code: "OC3-B", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yB: $.data.id }
            - call: "POST /rail/train-plans"
              payload: { train_symbol: "OC3-P", origin_yard_id: "${yA}", destination_yard_id: "${yB}", scheduled_departure_utc: "2026-09-02T08:00:00Z", cutoff_minutes: 60, frequency_mask: ["WED"], route_distance_miles: 300, dwell_benchmark_hours: 10 }
              as: NetworkPlanner
              captures: { p: $.data.id, v1: $.data.version, u1: $.data.updated_at }
          trigger:
            - call: "POST /rail/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T07:00:00Z" }
              as: NetworkPlanner
            - call: "POST /rail/train-plans/${p}/activate"
              payload: { expected_train_plan_version: "${v1}" }
              as: NetworkPlanner
              captures: { v2: $.data.version, u2: $.data.updated_at }
            - call: "POST /rail/train-plans/${p}/retire"
              payload: { expected_train_plan_version: "${v2}" }
              as: NetworkPlanner
              captures: { v3: $.data.version, st3: $.data.status }
          assert:
            - "v1 == 1 and v2 == 2 and v3 == 3"
            - "u2 (2026-09-01T07:00:00Z) is strictly later than u1 (2026-09-01T06:00:00Z)"
            - "st3 == RETIRED"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: cascade_visible_in_same_request_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/rail/train-departures/{id}/cancel
        distinguishing_aspect: "Immediate consistency: the cancel response itself carries status CANCELLED, and a follow-up GET in the same test (no wait, no epoch) observes the locomotive AVAILABLE and the leg MISSED — side effects are committed with the triggering request."
        test_recipe:
          setup:
            - "Yards IM-A, IM-B; ACTIVE plan IM-P; customer; shipment IM-S assigned [IM-P]; pool; locomotive IM-L1; SCHEDULED departure IM-D."
          setup_api_calls:
            - call: "POST /rail/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T06:00:00Z" }
              as: NetworkPlanner
            - call: "POST /rail/yards"
              payload: { yard_code: "IM-A", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yA: $.data.id }
            - call: "POST /rail/yards"
              payload: { yard_code: "IM-B", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yB: $.data.id }
            - call: "POST /rail/train-plans"
              payload: { train_symbol: "IM-P", origin_yard_id: "${yA}", destination_yard_id: "${yB}", scheduled_departure_utc: "2026-09-01T08:00:00Z", cutoff_minutes: 60, frequency_mask: ["TUE"], route_distance_miles: 300, dwell_benchmark_hours: 10 }
              as: NetworkPlanner
              captures: { p: $.data.id, p_v: $.data.version }
            - call: "POST /rail/train-plans/${p}/activate"
              payload: { expected_train_plan_version: "${p_v}" }
              as: NetworkPlanner
            - call: "POST /rail/customers"
              payload: { customer_code: "IM-CU", name: "Immediate Shipper" }
              as: ServiceManager
              captures: { cu: $.data.id }
            - call: "POST /rail/shipments"
              payload: { customer_id: "${cu}", origin_yard_id: "${yA}", destination_yard_id: "${yB}", car_count: 1, first_mile_pickup_by: "2026-09-01T07:30:00Z", last_mile_delivery_by: "2026-09-04T00:00:00Z", committed_route_miles: 300 }
              as: ServiceManager
              captures: { s: $.data.id, s_v: $.data.version }
            - call: "POST /rail/shipments/${s}/trip-legs"
              payload: { expected_shipment_version: "${s_v}", legs: [{ train_plan_id: "${p}", leg_sequence: 1 }] }
              as: NetworkPlanner
            - call: "POST /rail/crew-pools"
              payload: { home_yard_id: "${yA}", craft: "CONDUCTOR", service_date: "2026-09-01", crews_available: 2 }
              as: CrewDispatcher
              captures: { pool: $.data.id }
            - call: "POST /rail/locomotives"
              payload: { unit_number: "IM-UP1", current_yard_id: "${yA}", horsepower: 4400 }
              as: PowerPlanner
              captures: { loco: $.data.id }
            - call: "POST /rail/train-departures"
              payload: { train_plan_id: "${p}", service_date: "2026-09-01", crew_pool_id: "${pool}", locomotive_id: "${loco}", car_count_planned: 1, crew_hours_estimated: 6 }
              as: TerminalSuperintendent
              captures: { dep: $.data.id }
          trigger:
            - call: "POST /rail/train-departures/${dep}/cancel"
              payload: {}
              as: TerminalSuperintendent
              captures: { dst: $.data.status, dver: $.data.version }
            - call: "GET /rail/locomotives/${loco}"
              payload: {}
              as: Any
              captures: { lst: $.data.status }
            - call: "GET /rail/shipments/${s}"
              payload: {}
              as: Any
              captures: { mc: $.data.total_missed_connections }
          assert:
            - "dst == CANCELLED and dver == 2 in the cancel response itself"
            - "lst == AVAILABLE (locomotive release visible on the very next read)"
            - "mc == 1 (miss cascade visible immediately)"

      - name: rejected_write_leaves_no_partial_state
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/rail/train-departures
        distinguishing_aspect: "Atomicity: a departure scheduling attempt rejected for ERR_UNIT_WRONG_YARD leaves zero residue — no departure row, locomotive still AVAILABLE at its original yard, pool crews_booked still 0."
        test_recipe:
          setup:
            - "Yards IM2-A, IM2-B, IM2-C; ACTIVE plan IM2-P (IM2-A -> IM2-B); pool; locomotive IM2-L1 positioned at IM2-C (wrong yard for this plan)."
          setup_api_calls:
            - call: "POST /rail/yards"
              payload: { yard_code: "IM2-A", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yA: $.data.id }
            - call: "POST /rail/yards"
              payload: { yard_code: "IM2-B", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yB: $.data.id }
            - call: "POST /rail/yards"
              payload: { yard_code: "IM2-C", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yC: $.data.id }
            - call: "POST /rail/train-plans"
              payload: { train_symbol: "IM2-P", origin_yard_id: "${yA}", destination_yard_id: "${yB}", scheduled_departure_utc: "2026-09-01T08:00:00Z", cutoff_minutes: 60, frequency_mask: ["TUE"], route_distance_miles: 300, dwell_benchmark_hours: 10 }
              as: NetworkPlanner
              captures: { p: $.data.id, p_v: $.data.version }
            - call: "POST /rail/train-plans/${p}/activate"
              payload: { expected_train_plan_version: "${p_v}" }
              as: NetworkPlanner
            - call: "POST /rail/crew-pools"
              payload: { home_yard_id: "${yA}", craft: "CONDUCTOR", service_date: "2026-09-01", crews_available: 2 }
              as: CrewDispatcher
              captures: { pool: $.data.id }
            - call: "POST /rail/locomotives"
              payload: { unit_number: "IM2-UP1", current_yard_id: "${yC}", horsepower: 4400 }
              as: PowerPlanner
              captures: { loco: $.data.id }
          trigger:
            - call: "POST /rail/train-departures"
              payload: { train_plan_id: "${p}", service_date: "2026-09-01", crew_pool_id: "${pool}", locomotive_id: "${loco}", car_count_planned: 5, crew_hours_estimated: 6 }
              as: TerminalSuperintendent
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNIT_WRONG_YARD (409)"
            - "GET /rail/train-departures returns total_count 0"
            - "Locomotive.${loco}.status == AVAILABLE and current_yard_id == ${yC}; CrewPool.${pool}.crews_booked == 0"
