# =============================================================================
# PRD Benchmark Seed Tables — task_2269
# Home Electrification Assessment & Panel Upgrade Rebate
# (state home energy rebate administrator)
# §1.0–§1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2269. Home Electrification Assessment & Panel Upgrade Rebate (state home energy rebate administrator): household income tier verification and rebate cap assignment, pre-installation assessment and eligible-measure list, contractor enrollment, quality install standards and spot inspections, measure-level incentive calculation with combined-measure caps, panel/service upgrade eligibility tied to a qualifying appliance measure, rebate reservation, expiration and project extension, utility program and federal tax credit stacking limits, post-installation verification and clawback on failed inspection

domain_name: home-electrification-rebates

# Flat topology: every entity is a root-level collection joined by explicit
# foreign keys; there is no single owning URL ancestor, so the api prefix is the
# service root and child discovery happens through filtered lists and
# sub-resource lists (see §1.5).
api_prefix: "/"

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  state_machine_shape: cyclic
  # RebateProject is cyclic (INCOMPLETE→SUBMITTED revision loop and
  # INSPECTION_FAILED→REMEDIATION→INSTALLED re-inspection loop); Inspection is
  # branching fork-join (SCHEDULED→{PASSED, CONDITIONAL_PASS, FAILED} with
  # divergent side-effect sets); ProjectMeasure carries two independent state
  # dimensions (install_status × verification_status) on the same row.

  relationship_patterns:
    - one_to_many          # Program -> MeasureCatalogItem / Household / Contractor / Inspector
    - self_referential     # MeasureCatalogItem.prerequisite_measure_code -> MeasureCatalogItem.measure_code
    - cross_aggregate      # Reservation spans RebateProject and Program budget; ClawbackAction spans Inspection, Reservation, Program, Household
    - polymorphic          # Inspection.inspection_type SPOT vs POST_INSTALL gates different project states

  role_model: segregation_of_duties
  # The ProgramReviewer who recorded the project review decision may not create
  # that project's Reservation; the FieldInspector who recorded a SPOT result on
  # a project may not record that project's POST_INSTALL result.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 14 entities / 52 endpoints / 48 error codes / 7 state machines /
  # 13 calculations (2 carrying variants) / 22 ordered validation rules.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Program
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Program name as published by the state administrator.
      - name: state_code
        type: string
        source: input
        description: Two-letter state code that owns the program.
        constraints: exactly 2 uppercase letters
      - name: program_year
        type: integer
        source: input
        description: Funding year the program draws from.
        default: 2026
      - name: status
        type: enum
        source: system
        description: Lifecycle state; gates every reservation and payment.
        default: DRAFT
        constraints: DRAFT | OPEN | SUSPENDED | CLOSED
      - name: budget_total_cents
        type: integer
        source: input
        description: Total appropriation available to reserve and commit.
        constraints: ">= 0"
      - name: budget_available_cents
        type: integer
        source: computed
        description: Unencumbered appropriation; budget_total_cents at creation, moved by reserve/release/commit/clawback.
      - name: budget_reserved_cents
        type: integer
        source: computed
        description: Sum of reserved_amount_cents over Reservations with status == RESERVED.
        default: 0
      - name: budget_committed_cents
        type: integer
        source: computed
        description: Sum of reserved_amount_cents over Reservations with status == COMMITTED.
        default: 0
      - name: budget_clawed_back_cents
        type: integer
        source: computed
        description: Cumulative counter of recovered_cents across ClawbackActions of this program; a counter, NOT a budget bucket.
        default: 0
      - name: reservation_ttl_days
        type: integer
        source: input
        description: Days from reservation creation until Reservation.expires_at.
        default: 120
      - name: extension_window_days
        type: integer
        source: input
        description: Days before expires_at during which an extension may be granted.
        default: 30
      - name: max_extension_days
        type: integer
        source: input
        description: Maximum additional_days accepted on a single extension.
        default: 60
      - name: max_extensions_per_reservation
        type: integer
        source: input
        description: Maximum number of extensions a Reservation may receive.
        default: 1
      - name: low_tier_cap_cents
        type: integer
        source: input
        description: Household lifetime rebate cap for income_tier LOW.
        default: 1400000
      - name: moderate_tier_cap_cents
        type: integer
        source: input
        description: Household lifetime rebate cap for income_tier MODERATE.
        default: 800000
      - name: standard_tier_cap_cents
        type: integer
        source: input
        description: Household lifetime rebate cap for income_tier STANDARD.
        default: 300000
      - name: low_tier_cost_share_pct
        type: number
        source: input
        description: Fraction of a measure's cost the program will cover at income_tier LOW.
        default: 1.00
      - name: moderate_tier_cost_share_pct
        type: number
        source: input
        description: Fraction of a measure's cost covered at income_tier MODERATE.
        default: 0.50
      - name: standard_tier_cost_share_pct
        type: number
        source: input
        description: Fraction of a measure's cost covered at income_tier STANDARD.
        default: 0.30
      - name: ami_low_threshold_pct
        type: number
        source: input
        description: Rounded ami_percent at or below which a household is LOW tier.
        default: 80.0
      - name: ami_moderate_threshold_pct
        type: number
        source: input
        description: Rounded ami_percent at or below which a household is MODERATE tier (above ami_low_threshold_pct).
        default: 150.0
      - name: group_cap_cents
        type: integer
        source: input
        description: Combined-measure cap applied to the sum of incentives inside one combined_cap_group on one project.
        default: 800000
      - name: panel_upgrade_cap_cents
        type: integer
        source: input
        description: Per-line ceiling applied to any measure with is_panel_upgrade == true.
        default: 400000
      - name: federal_credit_pct
        type: number
        source: input
        description: Fraction of net project cost claimable as a federal tax credit in the stacking calculation.
        default: 0.30
      - name: federal_credit_cap_cents
        type: integer
        source: input
        description: Ceiling on the allowed federal credit in the stacking calculation.
        default: 200000
      - name: max_combined_benefit_pct
        type: number
        source: input
        description: Fraction of project cost that state rebate + utility rebate + federal credit may not exceed.
        default: 1.00
      - name: max_remediations_per_project
        type: integer
        source: input
        description: Number of remediation cycles a project may take after a failed post-install inspection.
        default: 1
      - name: quality_suspension_threshold
        type: integer
        source: input
        description: quality_score_rolling strictly below this value auto-suspends a Contractor.
        default: 70
      - name: recertification_threshold
        type: integer
        source: input
        description: quality_score_weighted at or above this value keeps a Contractor recertification-eligible.
        default: 75

  - name: MeasureCatalogItem
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> Program.id; program whose catalog this item belongs to.
      - name: measure_code
        type: string
        source: input
        description: Business key for the measure, unique per program_id.
        constraints: uppercase alphanumeric with hyphens; unique within program_id
      - name: measure_name
        type: string
        source: input
        description: Human-readable measure name.
      - name: category
        type: enum
        source: input
        description: Measure family used for reporting and tier gating.
        constraints: HVAC | WATER_HEATING | APPLIANCE | ENVELOPE | ELECTRICAL_INFRASTRUCTURE
      - name: unit_incentive_cents
        type: integer
        source: input
        description: Incentive per installed unit before any cap.
        constraints: ">= 0"
      - name: max_quantity
        type: integer
        source: input
        description: Units per project beyond which quantity is clamped.
        default: 1
        constraints: ">= 1"
      - name: measure_cap_cents
        type: integer
        source: input
        description: Per-line ceiling for this measure on one project.
        constraints: ">= 0"
      - name: combined_cap_group
        type: enum
        source: input
        description: Group whose summed incentives are limited by Program.group_cap_cents.
        constraints: HVAC_GROUP | WATER_GROUP | APPLIANCE_GROUP | ELECTRICAL_GROUP | NONE
      - name: required_panel_capacity_amps
        type: integer
        source: input
        description: Minimum electrical service capacity (amps) the dwelling must have for this measure to qualify.
        default: 0
      - name: upgraded_capacity_amps
        type: integer
        source: input
        description: Service capacity (amps) the dwelling has after this item is installed; only meaningful when is_panel_upgrade is true.
        default: 0
      - name: is_panel_upgrade
        type: boolean
        source: input
        description: True when the item is a panel/service upgrade, subjecting it to panel_upgrade_cap_cents and anchor gating.
        default: false
      - name: requires_qualifying_appliance
        type: boolean
        source: input
        description: True when the item only qualifies if the same assessment proposes a qualifying appliance anchor measure.
        default: false
      - name: qualifies_as_appliance_anchor
        type: boolean
        source: input
        description: True when the item can serve as the qualifying appliance anchor for a panel/service upgrade.
        default: false
      - name: prerequisite_measure_code
        type: string
        source: input
        description: Self-referential business-key dependency; when set, names another MeasureCatalogItem.measure_code in the same program that must also be proposed and qualified.
        default: null
      - name: standard_tier_eligible
        type: boolean
        source: input
        description: True when a household at income_tier STANDARD may receive this measure.
        default: false
      - name: sort_order
        type: integer
        source: input
        description: Deterministic ordering key for cap proration and eligible-measure evaluation.
        constraints: ">= 0"
      - name: active
        type: boolean
        source: input
        description: False marks a retired catalog item that no longer qualifies.
        default: true

  - name: Household
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> Program.id; program the household applies under.
      - name: applicant_name
        type: string
        source: input
        description: Name of record for the applying household.
      - name: email
        type: string
        source: input
        description: Contact email for the applicant.
      - name: service_address_line1
        type: string
        source: input
        description: Dwelling street address receiving the measures.
      - name: county_code
        type: string
        source: input
        description: County code used to select the median-income benchmark.
      - name: utility_territory_code
        type: string
        source: input
        description: Utility territory code used when stacking a utility program rebate.
      - name: household_size
        type: integer
        source: input
        description: Occupant count on the intake record.
        constraints: ">= 1"
      - name: existing_panel_amps
        type: integer
        source: input
        description: Electrical service capacity reported at intake, before any assessment.
        constraints: ">= 0"
      - name: ami_percent
        type: number
        source: computed
        description: Rounded percent of area median income from the VERIFIED IncomeVerification; null until verification.
        default: null
      - name: income_tier
        type: enum
        source: computed
        description: Income tier assigned by income_tier_assignment; null until verification.
        default: null
        constraints: LOW | MODERATE | STANDARD | null
      - name: rebate_cap_cents
        type: integer
        source: computed
        description: Lifetime rebate cap assigned from income_tier.
        default: 0
      - name: lifetime_cap_remaining_cents
        type: integer
        source: computed
        description: Unencumbered portion of rebate_cap_cents; debited on reservation, restored on release/expiry/clawback and on commit-time downward reconciliation.
        default: 0
      - name: encumbered_cents
        type: integer
        source: computed
        description: Sum of Reservation.reserved_amount_cents over Reservations whose project.household_id == this household and status IN {RESERVED, COMMITTED}.
        default: 0

  - name: IncomeVerification
    parent: null
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: FK -> Household.id; household whose income is being verified.
      - name: annual_household_income_cents
        type: integer
        source: input
        description: Gross annual household income from the submitted documentation.
        constraints: ">= 0"
      - name: county_median_income_cents
        type: integer
        source: input
        description: County median income benchmark for a four-person household.
        constraints: "> 0"
      - name: household_size_attested
        type: integer
        source: input
        description: Occupant count attested on the documentation; drives the size adjustment factor (NOT Household.household_size).
        constraints: ">= 1"
      - name: document_reference
        type: string
        source: input
        description: Document bundle reference for the audit trail.
      - name: status
        type: enum
        source: system
        description: Verification lifecycle state.
        default: SUBMITTED
        constraints: SUBMITTED | VERIFIED | REJECTED
      - name: computed_ami_percent
        type: number
        source: computed
        description: ami_percent computed at verification; null while SUBMITTED or REJECTED.
        default: null
      - name: assigned_income_tier
        type: enum
        source: computed
        description: Tier computed at verification; null while SUBMITTED or REJECTED.
        default: null
        constraints: LOW | MODERATE | STANDARD | null
      - name: assigned_cap_cents
        type: integer
        source: computed
        description: Household cap copied from the program tier cap at verification.
        default: 0
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID that filed the verification; the segregation-of-duties check compares it to the verifier.
      - name: verified_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProgramReviewer who recorded the decision.
        default: null
      - name: verified_at
        type: datetime
        source: system
        description: Logical-clock instant the decision was recorded.
        default: null
      - name: reviewer_notes
        type: string
        source: input
        description: Free-text reviewer note recorded with the decision.
        default: null

  - name: Contractor
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> Program.id; program the contractor is enrolled in.
      - name: business_name
        type: string
        source: input
        description: Legal business name of the installer.
      - name: license_number
        type: string
        source: input
        description: State contractor license number.
      - name: license_expires_on
        type: string
        source: input
        description: Date (YYYY-MM-DD) the contractor license lapses.
      - name: insurance_expires_on
        type: string
        source: input
        description: Date (YYYY-MM-DD) the liability insurance lapses.
      - name: crew_capacity
        type: integer
        source: input
        description: Number of install windows the contractor may have open on overlapping calendar dates.
        default: 2
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: Enrollment lifecycle state.
        default: PENDING_ENROLLMENT
        constraints: PENDING_ENROLLMENT | ENROLLED_ACTIVE | SUSPENDED | ENROLLMENT_REJECTED
      - name: quality_score_rolling
        type: integer
        source: computed
        description: Rolling-window quality score from contractor_quality_score (rolling_window variant); gates auto-suspension.
        default: 100
      - name: completed_inspection_count
        type: integer
        source: computed
        description: Count of Inspections on this contractor's projects whose status IN {PASSED, CONDITIONAL_PASS, FAILED}.
        default: 0
      - name: suspension_reason
        type: enum
        source: system
        description: Why the contractor is suspended; null when not suspended.
        default: null
        constraints: QUALITY_SCORE | ADMIN_ACTION | null
      - name: enrollment_decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProgramReviewer who decided enrollment.
        default: null

  - name: Inspector
    parent: null
    common_fields: false
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> Program.id; program the inspector works for.
      - name: inspector_name
        type: string
        source: input
        description: Inspector name of record.
      - name: certification_id
        type: string
        source: input
        description: State inspection certification identifier.
      - name: certification_expires_on
        type: string
        source: input
        description: Date (YYYY-MM-DD) the certification lapses.

  - name: Assessment
    parent: null
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: FK -> Household.id; dwelling that was assessed.
      - name: contractor_id
        type: string
        source: input
        description: FK -> Contractor.id; enrolled contractor who performed the pre-installation assessment.
      - name: assessed_panel_amps
        type: integer
        source: input
        description: Electrical service capacity measured on site.
        constraints: ">= 0"
      - name: effective_panel_amps
        type: integer
        source: computed
        description: Capacity used for panel-capacity gating; equals assessed_panel_amps unless a qualified panel-upgrade measure raises it (see eligible_measure_qualification stage C).
      - name: status
        type: enum
        source: system
        description: Review lifecycle state.
        default: PENDING_REVIEW
        constraints: PENDING_REVIEW | APPROVED | REJECTED | SUPERSEDED
      - name: qualified_measure_count
        type: integer
        source: computed
        description: Count of child EligibleMeasures with qualified == true.
        default: 0
      - name: estimated_total_incentive_cents
        type: integer
        source: computed
        description: Sum of EligibleMeasure.estimated_incentive_cents over qualified rows after group and household cap allocation.
        default: 0
      - name: assessment_notes
        type: string
        source: input
        description: Assessor note recorded with the assessment.
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProgramReviewer who approved or rejected the assessment.
        default: null

  - name: EligibleMeasure
    parent: null
    common_fields: false
    fields:
      - name: assessment_id
        type: string
        source: input
        description: FK -> Assessment.id; assessment that produced this eligible-measure row.
      - name: measure_code
        type: string
        source: input
        description: MeasureCatalogItem.measure_code proposed for this dwelling (business key, resolved within the assessment's program).
      - name: proposed_quantity
        type: integer
        source: input
        description: Units the assessor proposes to install.
        constraints: ">= 1"
      - name: estimated_cost_cents
        type: integer
        source: input
        description: Assessor's estimated installed cost for this line.
        constraints: ">= 0"
      - name: qualified
        type: boolean
        source: computed
        description: True when the line survives every stage of eligible_measure_qualification.
      - name: disqualification_reason
        type: enum
        source: computed
        description: Why the line failed qualification; null when qualified is true.
        default: null
        constraints: RETIRED_CATALOG_ITEM | TIER_INELIGIBLE | PANEL_CAPACITY_INSUFFICIENT | ANCHOR_MISSING | PREREQUISITE_MISSING | null
      - name: estimated_incentive_cents
        type: integer
        source: computed
        description: Estimated incentive for this line after measure/cost-share caps and after group and household cap allocation; 0 when not qualified.
        default: 0
      - name: evaluation_order
        type: integer
        source: computed
        description: 1-based position of this line in the pinned evaluation order (MeasureCatalogItem.sort_order ASC, then EligibleMeasure.created_at ASC).

  - name: RebateProject
    parent: null
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: FK -> Household.id; household claiming the rebate.
      - name: assessment_id
        type: string
        source: input
        description: FK -> Assessment.id; APPROVED assessment the selected measures come from.
      - name: contractor_id
        type: string
        source: input
        description: FK -> Contractor.id; installer of record, copied from the assessment.
      - name: income_verification_id
        type: string
        source: input
        description: FK -> IncomeVerification.id; the VERIFIED verification that set the household tier and cap.
      - name: status
        type: enum
        source: system
        description: Project lifecycle state.
        default: DRAFT
        constraints: DRAFT | SUBMITTED | INCOMPLETE | REJECTED | APPROVED | RESERVED | CONTRACTOR_HOLD | INSTALLED | INSPECTION_FAILED | REMEDIATION | VERIFIED | PAID | EXPIRED | FAILED_FINAL | CLAWED_BACK
      - name: estimated_project_cost_cents
        type: integer
        source: input
        description: Total estimated project cost used for the provisional cost-share caps and the stacking limit before installation.
        constraints: "> 0"
      - name: actual_project_cost_cents
        type: integer
        source: input
        description: Invoiced project cost reported at installation; null until then.
        default: null
      - name: provisional_total_incentive_cents
        type: integer
        source: computed
        description: Project total from measure_incentive_allocation (provisional variant); pinned at project creation and refreshed on resubmission.
        default: 0
      - name: final_total_incentive_cents
        type: integer
        source: computed
        description: Project total from measure_incentive_allocation (final variant); null until a post-install inspection is PASSED or CONDITIONAL_PASS.
        default: null
      - name: stacking_adjusted_state_incentive_cents
        type: integer
        source: computed
        description: State incentive after benefit_stacking_limit; null until an ACTIVE StackingDeclaration exists.
        default: null
      - name: disbursed_amount_cents
        type: integer
        source: computed
        description: Amount actually paid at the payment transition; 0 before payment and after clawback recovery.
        default: 0
      - name: install_start_date
        type: string
        source: input
        description: First calendar date (YYYY-MM-DD) of the install window; null until installation is reported.
        default: null
      - name: install_end_date
        type: string
        source: input
        description: Last calendar date (YYYY-MM-DD) of the install window, inclusive; null until installation is reported.
        default: null
      - name: installed_panel_amps
        type: integer
        source: input
        description: Service capacity after installation, attested by the contractor; checked against the installed measures' required_panel_capacity_amps.
        default: null
      - name: conditional_pass_flag
        type: boolean
        source: computed
        description: True when the passing post-install inspection was CONDITIONAL_PASS, which applies the conditional reduction to every final line.
        default: false
      - name: remediation_count
        type: integer
        source: computed
        description: Number of remediation cycles consumed.
        default: 0
      - name: submission_count
        type: integer
        source: computed
        description: Number of times the project has been submitted for review.
        default: 0
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProgramReviewer who recorded the latest review decision; used by the reservation segregation-of-duties check.
        default: null
      - name: review_notes
        type: string
        source: input
        description: Reviewer note recorded with the latest review decision.
        default: null
      - name: incomplete_reason
        type: string
        source: input
        description: Reason returned to the applicant when the review decision is RETURN_INCOMPLETE.
        default: null

  - name: ProjectMeasure
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> RebateProject.id; project this measure line belongs to.
      - name: measure_code
        type: string
        source: input
        description: MeasureCatalogItem.measure_code for this line (business key resolved within the project's program).
      - name: planned_quantity
        type: integer
        source: input
        description: Units selected at project creation.
        constraints: ">= 1"
      - name: pinned_unit_incentive_cents
        type: integer
        source: system
        description: MeasureCatalogItem.unit_incentive_cents copied at project creation; later catalog edits never change this line.
      - name: pinned_measure_cap_cents
        type: integer
        source: system
        description: MeasureCatalogItem.measure_cap_cents copied at project creation.
      - name: pinned_max_quantity
        type: integer
        source: system
        description: MeasureCatalogItem.max_quantity copied at project creation.
      - name: pinned_sort_order
        type: integer
        source: system
        description: MeasureCatalogItem.sort_order copied at project creation; the proration order key.
      - name: pinned_combined_cap_group
        type: enum
        source: system
        description: MeasureCatalogItem.combined_cap_group copied at project creation.
        constraints: HVAC_GROUP | WATER_GROUP | APPLIANCE_GROUP | ELECTRICAL_GROUP | NONE
      - name: pinned_is_panel_upgrade
        type: boolean
        source: system
        description: MeasureCatalogItem.is_panel_upgrade copied at project creation.
      - name: estimated_cost_cents
        type: integer
        source: input
        description: Estimated installed cost for this line, used by the provisional variant.
        constraints: ">= 0"
      - name: actual_cost_cents
        type: integer
        source: input
        description: Invoiced installed cost reported at installation, used by the final variant; null until then.
        default: null
      - name: verified_quantity
        type: integer
        source: input
        description: Units confirmed by the inspector at post-install verification; null until then.
        default: null
      - name: provisional_incentive_cents
        type: integer
        source: computed
        description: Line incentive under the provisional variant after group and household cap allocation.
        default: 0
      - name: final_incentive_cents
        type: integer
        source: computed
        description: Line incentive under the final variant after group and household cap allocation; null until verification.
        default: null
      - name: install_status
        type: enum
        source: system
        description: Physical installation dimension of this line.
        default: PLANNED
        constraints: PLANNED | INSTALLED | VOID
      - name: verification_status
        type: enum
        source: system
        description: Verification dimension of this line, independent of install_status.
        default: PENDING
        constraints: PENDING | VERIFIED | REJECTED | CLAWED_BACK
      - name: rejection_reason
        type: enum
        source: system
        description: Why the line was rejected at verification; null otherwise.
        default: null
        constraints: INSPECTION_DEFICIENCY | ANCHOR_REJECTED | null

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> RebateProject.id; project holding the funds.
      - name: program_id
        type: string
        source: input
        description: FK -> Program.id; program whose appropriation is encumbered.
      - name: reserved_amount_cents
        type: integer
        source: computed
        description: Currently encumbered amount; equals the project provisional total at creation and is reconciled to disbursed_amount_cents at commit.
      - name: initial_reserved_amount_cents
        type: integer
        source: system
        description: Amount encumbered at creation; never mutated, used to prove the budget invariant across reconciliation.
      - name: status
        type: enum
        source: system
        description: Reservation lifecycle state.
        default: RESERVED
        constraints: RESERVED | COMMITTED | EXPIRED | RELEASED | CLAWED_BACK
      - name: reserved_at
        type: datetime
        source: system
        description: Logical-clock instant the reservation was created.
      - name: expires_at
        type: datetime
        source: system
        description: reserved_at plus Program.reservation_ttl_days, pushed out by granted extensions.
      - name: extension_count
        type: integer
        source: computed
        description: Number of extensions granted on this reservation.
        default: 0
      - name: extension_days_granted
        type: integer
        source: computed
        description: Cumulative additional_days granted on this reservation.
        default: 0
      - name: committed_at
        type: datetime
        source: system
        description: Logical-clock instant the reservation was committed at payment; null before.
        default: null
      - name: release_reason
        type: enum
        source: system
        description: Why the reservation left RESERVED without commitment, or why a committed reservation was clawed back.
        default: null
        constraints: EXPIRY | FAILED_REINSPECTION | CLAWBACK | null
      - name: reservation_notes
        type: string
        source: input
        description: Reviewer note recorded at reservation creation.
        default: null

  - name: StackingDeclaration
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> RebateProject.id; project whose combined public benefit is being declared.
      - name: utility_program_name
        type: string
        source: input
        description: Name of the utility program paying an additional rebate.
      - name: utility_rebate_cents
        type: integer
        source: input
        description: Utility program rebate the household will receive.
        constraints: ">= 0"
      - name: federal_credit_claimed_cents
        type: integer
        source: input
        description: Federal tax credit the household intends to claim; recorded for audit, never used as an input to the allowed amounts.
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: ACTIVE for the authoritative declaration; SUPERSEDED once a newer declaration is created for the same project.
        default: ACTIVE
        constraints: ACTIVE | SUPERSEDED
      - name: computed_state_incentive_before_cents
        type: integer
        source: computed
        description: State incentive fed into benefit_stacking_limit as S0 (final total when present, otherwise provisional total).
      - name: allowed_state_incentive_cents
        type: integer
        source: computed
        description: State incentive after the single-pass stacking reduction (S1).
      - name: allowed_federal_credit_cents
        type: integer
        source: computed
        description: Federal credit recomputed exactly once from the reduced state incentive (F_final).
      - name: combined_benefit_limit_cents
        type: integer
        source: computed
        description: floor(project cost basis * Program.max_combined_benefit_pct).
      - name: residual_overage_cents
        type: integer
        source: computed
        description: Amount by which the single-pass result still exceeds combined_benefit_limit_cents; recorded, never iterated away.
        default: 0

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> RebateProject.id; project being inspected.
      - name: inspector_id
        type: string
        source: input
        description: FK -> Inspector.id; assigned field inspector.
      - name: inspection_type
        type: enum
        source: input
        description: SPOT is a quality-standards audit; POST_INSTALL is the verification gate for payment.
        constraints: SPOT | POST_INSTALL
      - name: scheduled_start
        type: datetime
        source: input
        description: Inclusive start of the inspector's on-site window.
      - name: scheduled_end
        type: datetime
        source: input
        description: Exclusive end of the inspector's on-site window.
      - name: status
        type: enum
        source: system
        description: Inspection lifecycle state; the three result states carry divergent side-effect sets.
        default: SCHEDULED
        constraints: SCHEDULED | PASSED | CONDITIONAL_PASS | FAILED | CANCELLED
      - name: result_recorded_at
        type: datetime
        source: system
        description: Logical-clock instant the result was recorded; the ordering key for the rolling quality window.
        default: null
      - name: deficiency_count
        type: integer
        source: input
        description: Number of install deficiencies found; the weight driver for the severity-weighted quality score.
        default: 0
      - name: deficiency_severity_max
        type: integer
        source: input
        description: Highest deficiency severity found, 0 (none) through 5 (life safety).
        default: 0
        constraints: 0..5
      - name: rejected_measure_codes
        type: array
        source: input
        description: measure_codes the inspector rejects; each maps to a ProjectMeasure whose verification_status becomes REJECTED.
        default: []
      - name: notes
        type: string
        source: input
        description: Inspector note recorded with the result.
        default: null
      - name: scheduled_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProgramReviewer who scheduled the inspection.
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID (Inspector id) of the FieldInspector who recorded the result; used by the inspection segregation-of-duties check.
        default: null

  - name: ClawbackAction
    parent: null
    common_fields: false
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> RebateProject.id; project the recovery applies to.
      - name: reservation_id
        type: string
        source: input
        description: FK -> Reservation.id; reservation whose funds were released or recovered.
      - name: triggered_by_inspection_id
        type: string
        source: input
        description: FK -> Inspection.id; the failed inspection that triggered the action.
      - name: reason
        type: enum
        source: system
        description: FAILED_REINSPECTION releases a still-reserved amount; POST_PAYMENT_INSPECTION_FAILURE recovers a disbursed amount.
        constraints: FAILED_REINSPECTION | POST_PAYMENT_INSPECTION_FAILURE
      - name: disbursed_before_cents
        type: integer
        source: system
        description: RebateProject.disbursed_amount_cents immediately before the action.
      - name: recovered_cents
        type: integer
        source: computed
        description: Amount recovered from the household; equals disbursed_before_cents for POST_PAYMENT_INSPECTION_FAILURE and 0 for FAILED_REINSPECTION.
      - name: released_reservation_cents
        type: integer
        source: computed
        description: Amount returned to Program.budget_available_cents by this action.
      - name: program_budget_available_after_cents
        type: integer
        source: computed
        description: Program.budget_available_cents immediately after the action, for audit reconciliation.
      - name: household_cap_remaining_after_cents
        type: integer
        source: computed
        description: Household.lifetime_cap_remaining_cents immediately after the action.
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor whose request produced the cascade.

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Program
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /programs/{id}/status with new_status=OPEN"
        actor: ProgramAdmin
        preconditions: ["program.status == DRAFT", "program.budget_total_cents > 0"]
        side_effects: ["sets budget_available_cents = budget_total_cents", "increments Program.version by 1"]
      - from: OPEN
        to: SUSPENDED
        trigger: "POST /programs/{id}/status with new_status=SUSPENDED"
        actor: ProgramAdmin
        preconditions: ["program.status == OPEN"]
        side_effects: ["existing Reservations keep their expires_at (suspension does not pause the clock)", "increments Program.version by 1"]
        note: "While SUSPENDED, reservation creation and payment are rejected with ERR_PROGRAM_NOT_OPEN; sweep still runs."
      - from: SUSPENDED
        to: OPEN
        trigger: "POST /programs/{id}/status with new_status=OPEN"
        actor: ProgramAdmin
        preconditions: ["program.status == SUSPENDED"]
        side_effects: ["increments Program.version by 1"]
        note: "OPEN -> SUSPENDED -> OPEN makes this machine cyclic."
      - from: OPEN
        to: CLOSED
        trigger: "POST /programs/{id}/status with new_status=CLOSED"
        actor: ProgramAdmin
        preconditions: ["program.status == OPEN", "no Reservation of this program has status == RESERVED"]
        side_effects: ["increments Program.version by 1"]
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /programs/{id}/status with new_status=CLOSED"
        actor: ProgramAdmin
        preconditions: ["program.status == SUSPENDED", "no Reservation of this program has status == RESERVED"]
        side_effects: ["increments Program.version by 1"]

  - entity: Contractor
    initial_state: PENDING_ENROLLMENT
    terminal_states: [ENROLLMENT_REJECTED]
    transitions:
      - from: PENDING_ENROLLMENT
        to: ENROLLED_ACTIVE
        trigger: "POST /contractors/{id}/enrollment-decision with decision=APPROVE"
        actor: ProgramReviewer
        preconditions:
          - "contractor.status == PENDING_ENROLLMENT"
          - "contractor.license_expires_on > clock_now date"
          - "contractor.insurance_expires_on > clock_now date"
        side_effects: ["sets enrollment_decided_by_user_id", "sets quality_score_rolling = 100", "increments Contractor.version by 1"]
      - from: PENDING_ENROLLMENT
        to: ENROLLMENT_REJECTED
        trigger: "POST /contractors/{id}/enrollment-decision with decision=REJECT"
        actor: ProgramReviewer
        preconditions: ["contractor.status == PENDING_ENROLLMENT"]
        side_effects: ["sets enrollment_decided_by_user_id", "increments Contractor.version by 1"]
      - from: ENROLLED_ACTIVE
        to: SUSPENDED
        trigger: "POST /contractors/{id}/suspension with action=SUSPEND, or system cascade when contractor_quality_score (rolling_window variant) drops below Program.quality_suspension_threshold after an inspection result is recorded"
        actor: ProgramAdmin | system
        preconditions: ["contractor.status == ENROLLED_ACTIVE"]
        side_effects:
          - "sets suspension_reason = ADMIN_ACTION (admin path) or QUALITY_SCORE (cascade path)"
          - "CASCADE HOP: every other RebateProject of this contractor whose status == RESERVED transitions RESERVED -> CONTRACTOR_HOLD (caused by this suspension, not by the inspection request itself)"
          - "increments Contractor.version by 1"
      - from: SUSPENDED
        to: ENROLLED_ACTIVE
        trigger: "POST /contractors/{id}/suspension with action=REINSTATE"
        actor: ProgramAdmin
        preconditions: ["contractor.status == SUSPENDED", "contractor.license_expires_on > clock_now date"]
        side_effects:
          - "CASCADE HOP: every RebateProject of this contractor whose status == CONTRACTOR_HOLD transitions CONTRACTOR_HOLD -> RESERVED"
          - "increments Contractor.version by 1"
        note: "ENROLLED_ACTIVE -> SUSPENDED -> ENROLLED_ACTIVE makes this machine cyclic."

  - entity: Assessment
    initial_state: PENDING_REVIEW
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /assessments/{id}/approve with decision=APPROVE"
        actor: ProgramReviewer
        preconditions:
          - "assessment.status == PENDING_REVIEW"
          - "assessment.qualified_measure_count >= 1"
          - "contractor.status == ENROLLED_ACTIVE"
        side_effects: ["sets approved_by_user_id", "increments Assessment.version by 1"]
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /assessments/{id}/approve with decision=REJECT"
        actor: ProgramReviewer
        preconditions: ["assessment.status == PENDING_REVIEW"]
        side_effects: ["sets approved_by_user_id", "increments Assessment.version by 1"]
      - from: PENDING_REVIEW
        to: SUPERSEDED
        trigger: "POST /assessments (a newer assessment is created for the same household_id)"
        actor: system
        preconditions: ["the new assessment passes every validation", "expected_household_version matches household.version"]
        side_effects: ["increments Assessment.version by 1 on the superseded row"]
      - from: APPROVED
        to: SUPERSEDED
        trigger: "POST /assessments (a newer assessment is created for the same household_id)"
        actor: system
        preconditions: ["no RebateProject referencing this assessment has status IN {RESERVED, CONTRACTOR_HOLD, INSTALLED, INSPECTION_FAILED, REMEDIATION, VERIFIED, PAID}"]
        side_effects: ["increments Assessment.version by 1 on the superseded row"]

  - entity: RebateProject
    initial_state: DRAFT
    terminal_states: [REJECTED, PAID, EXPIRED, FAILED_FINAL, CLAWED_BACK]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /rebate-projects/{id}/submit"
        actor: Applicant | Contractor
        preconditions: ["project.status == DRAFT", "acting Applicant id == project.household_id or acting Contractor id == project.contractor_id", "at least one ProjectMeasure exists"]
        side_effects: ["increments submission_count by 1", "increments RebateProject.version by 1"]
      - from: INCOMPLETE
        to: SUBMITTED
        trigger: "POST /rebate-projects/{id}/submit"
        actor: Applicant | Contractor
        preconditions: ["project.status == INCOMPLETE", "acting Applicant id == project.household_id or acting Contractor id == project.contractor_id"]
        side_effects:
          - "increments submission_count by 1"
          - "recomputes provisional_incentive_cents on every ProjectMeasure and provisional_total_incentive_cents via measure_incentive_allocation (provisional variant) against the household's current lifetime_cap_remaining_cents"
          - "clears incomplete_reason"
          - "increments RebateProject.version by 1"
        note: "INCOMPLETE -> SUBMITTED closes the review revision loop, making this machine cyclic."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /rebate-projects/{id}/review with decision=APPROVE"
        actor: ProgramReviewer
        preconditions: ["project.status == SUBMITTED", "contractor.status == ENROLLED_ACTIVE", "household.income_tier is not null"]
        side_effects: ["sets reviewed_by_user_id to the acting X-User-ID", "increments RebateProject.version by 1"]
      - from: SUBMITTED
        to: INCOMPLETE
        trigger: "POST /rebate-projects/{id}/review with decision=RETURN_INCOMPLETE"
        actor: ProgramReviewer
        preconditions: ["project.status == SUBMITTED", "incomplete_reason supplied"]
        side_effects: ["sets reviewed_by_user_id", "stores incomplete_reason", "increments RebateProject.version by 1"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /rebate-projects/{id}/review with decision=REJECT"
        actor: ProgramReviewer
        preconditions: ["project.status == SUBMITTED"]
        side_effects: ["sets reviewed_by_user_id", "sets every ProjectMeasure.install_status = VOID", "increments RebateProject.version by 1"]
      - from: APPROVED
        to: RESERVED
        trigger: "POST /rebate-projects/{id}/reservations"
        actor: ProgramReviewer
        preconditions:
          - "project.status == APPROVED"
          - "program.status == OPEN"
          - "contractor.status == ENROLLED_ACTIVE"
          - "acting X-User-ID != project.reviewed_by_user_id (segregation of duties)"
          - "household.lifetime_cap_remaining_cents >= project.provisional_total_incentive_cents"
          - "program.budget_available_cents >= project.provisional_total_incentive_cents"
          - "expected_program_version == program.version"
        side_effects:
          - "creates Reservation with status RESERVED, reserved_amount_cents = initial_reserved_amount_cents = project.provisional_total_incentive_cents, reserved_at = clock_now, expires_at = clock_now + program.reservation_ttl_days days"
          - "debits Program.budget_available_cents and credits Program.budget_reserved_cents by the reserved amount; increments Program.version by 1"
          - "debits Household.lifetime_cap_remaining_cents and credits Household.encumbered_cents by the reserved amount; increments Household.version by 1"
          - "increments RebateProject.version by 1"
      - from: RESERVED
        to: CONTRACTOR_HOLD
        trigger: "system cascade from Contractor ENROLLED_ACTIVE -> SUSPENDED"
        actor: system
        preconditions: ["project.status == RESERVED", "project.contractor_id == the suspended contractor"]
        side_effects: ["increments RebateProject.version by 1"]
        note: "Hop 3 of the failed-inspection cascade; caused by the contractor suspension, not by the inspection result request."
      - from: CONTRACTOR_HOLD
        to: RESERVED
        trigger: "system cascade from Contractor SUSPENDED -> ENROLLED_ACTIVE"
        actor: system
        preconditions: ["project.status == CONTRACTOR_HOLD", "the reservation of this project still has status == RESERVED"]
        side_effects: ["increments RebateProject.version by 1"]
      - from: RESERVED
        to: INSTALLED
        trigger: "POST /rebate-projects/{id}/installation"
        actor: Contractor
        preconditions:
          - "project.status == RESERVED"
          - "acting Contractor id == project.contractor_id"
          - "reservation.status == RESERVED and clock_now < reservation.expires_at"
          - "contractor.status == ENROLLED_ACTIVE and license_expires_on >= clock_now date and insurance_expires_on >= clock_now date"
          - "install_end_date >= install_start_date"
          - "contractor install-window overlap count < contractor.crew_capacity (see install_window_capacity)"
          - "installed_panel_amps >= max(required_panel_capacity_amps) over the reported installed measures"
        side_effects:
          - "records actual_project_cost_cents, install_start_date, install_end_date, installed_panel_amps"
          - "sets each reported ProjectMeasure.install_status = INSTALLED and stores actual_cost_cents"
          - "increments RebateProject.version by 1"
      - from: RESERVED
        to: EXPIRED
        trigger: "system cascade from Reservation RESERVED -> EXPIRED during POST /programs/{id}/sweep"
        actor: system
        preconditions: ["project.status == RESERVED", "its reservation transitioned to EXPIRED in this sweep"]
        side_effects:
          - "CASCADE HOP: sets every ProjectMeasure of this project install_status = VOID"
          - "CASCADE HOP: sets every Inspection of this project whose status == SCHEDULED to CANCELLED"
          - "increments RebateProject.version by 1"
      - from: CONTRACTOR_HOLD
        to: EXPIRED
        trigger: "system cascade from Reservation RESERVED -> EXPIRED during POST /programs/{id}/sweep"
        actor: system
        preconditions: ["project.status == CONTRACTOR_HOLD", "its reservation transitioned to EXPIRED in this sweep"]
        side_effects: ["same cascade hops as RESERVED -> EXPIRED", "increments RebateProject.version by 1"]
      - from: INSTALLED
        to: VERIFIED
        trigger: "POST /inspections/{id}/result with inspection_type=POST_INSTALL and result IN {PASS, CONDITIONAL_PASS}"
        actor: FieldInspector
        preconditions: ["project.status == INSTALLED", "the inspection is this project's POST_INSTALL inspection with status == SCHEDULED"]
        side_effects:
          - "sets each ProjectMeasure.verification_status = VERIFIED and verified_quantity from the result payload"
          - "sets conditional_pass_flag = true when result == CONDITIONAL_PASS"
          - "computes final_incentive_cents per line and final_total_incentive_cents via measure_incentive_allocation (final variant)"
          - "recomputes the ACTIVE StackingDeclaration (if any) and project.stacking_adjusted_state_incentive_cents via benefit_stacking_limit"
          - "recomputes Contractor.quality_score_rolling and completed_inspection_count"
          - "increments RebateProject.version by 1"
      - from: INSTALLED
        to: INSPECTION_FAILED
        trigger: "POST /inspections/{id}/result with inspection_type=POST_INSTALL and result=FAIL while project.remediation_count < program.max_remediations_per_project"
        actor: FieldInspector
        preconditions: ["project.status == INSTALLED", "project.remediation_count < program.max_remediations_per_project"]
        side_effects:
          - "CASCADE HOP: every ProjectMeasure named in rejected_measure_codes moves verification_status PENDING -> REJECTED with rejection_reason = INSPECTION_DEFICIENCY"
          - "CASCADE HOP: caused by the previous hop, every ProjectMeasure whose pinned_is_panel_upgrade == true and whose qualifying appliance anchor line is now REJECTED moves verification_status PENDING -> REJECTED with rejection_reason = ANCHOR_REJECTED"
          - "CASCADE HOP: caused by the previous hop, final_total_incentive_cents is recomputed over the lines still VERIFIED-eligible via measure_incentive_allocation (final variant), so the project total drops by the rejected lines' allocation"
          - "recomputes Contractor.quality_score_rolling, which may itself trigger Contractor ENROLLED_ACTIVE -> SUSPENDED"
          - "increments RebateProject.version by 1"
      - from: INSPECTION_FAILED
        to: REMEDIATION
        trigger: "POST /rebate-projects/{id}/remediation"
        actor: Contractor
        preconditions:
          - "project.status == INSPECTION_FAILED"
          - "acting Contractor id == project.contractor_id"
          - "project.remediation_count < program.max_remediations_per_project"
          - "reservation.status == RESERVED and clock_now < reservation.expires_at"
        side_effects:
          - "increments remediation_count by 1"
          - "resets every ProjectMeasure whose verification_status == REJECTED back to PENDING and clears rejection_reason"
          - "increments RebateProject.version by 1"
      - from: REMEDIATION
        to: INSTALLED
        trigger: "POST /inspections with inspection_type=POST_INSTALL for this project"
        actor: ProgramReviewer
        preconditions: ["project.status == REMEDIATION", "no Inspection of this project has status == SCHEDULED"]
        side_effects: ["creates the re-inspection in SCHEDULED", "increments RebateProject.version by 1"]
        note: "INSTALLED -> INSPECTION_FAILED -> REMEDIATION -> INSTALLED is the re-inspection cycle."
      - from: INSTALLED
        to: FAILED_FINAL
        trigger: "POST /inspections/{id}/result with inspection_type=POST_INSTALL and result=FAIL while project.remediation_count >= program.max_remediations_per_project"
        actor: FieldInspector
        preconditions: ["project.status == INSTALLED", "project.remediation_count >= program.max_remediations_per_project"]
        side_effects:
          - "CASCADE HOP: the project's Reservation moves RESERVED -> RELEASED with release_reason = FAILED_REINSPECTION"
          - "CASCADE HOP: caused by the release, Program.budget_reserved_cents is debited and budget_available_cents credited by reserved_amount_cents (Program.version incremented), and Household.lifetime_cap_remaining_cents is credited / encumbered_cents debited by the same amount (Household.version incremented)"
          - "CASCADE HOP: caused by the release, a ClawbackAction is appended with reason = FAILED_REINSPECTION, recovered_cents = 0, released_reservation_cents = the released amount"
          - "sets every ProjectMeasure install_status = VOID and verification_status = REJECTED"
          - "recomputes Contractor.quality_score_rolling"
          - "increments RebateProject.version by 1"
      - from: VERIFIED
        to: PAID
        trigger: "POST /rebate-projects/{id}/payment"
        actor: "ProgramReviewer | ProgramAdmin"
        preconditions:
          - "project.status == VERIFIED"
          - "program.status == OPEN"
          - "reservation.status == RESERVED"
          - "no Inspection of this project has status == SCHEDULED"
          - "acting X-User-ID != project.reviewed_by_user_id (segregation of duties)"
        side_effects:
          - "computes disbursed_amount_cents via disbursement_reconciliation"
          - "reservation moves RESERVED -> COMMITTED, reserved_amount_cents is reconciled to disbursed_amount_cents, committed_at = clock_now"
          - "Program.budget_reserved_cents is debited by initial_reserved_amount_cents, budget_committed_cents credited by disbursed_amount_cents, and budget_available_cents credited by the difference (Program.version incremented)"
          - "Household.encumbered_cents is reconciled to disbursed_amount_cents and lifetime_cap_remaining_cents is credited by the difference (Household.version incremented)"
          - "increments RebateProject.version by 1"
      - from: PAID
        to: CLAWED_BACK
        trigger: "POST /inspections/{id}/result with inspection_type=SPOT and result=FAIL on a PAID project"
        actor: FieldInspector
        preconditions: ["project.status == PAID", "the inspection is a SPOT inspection of this project with status == SCHEDULED"]
        side_effects:
          - "CASCADE HOP: the project's Reservation moves COMMITTED -> CLAWED_BACK with release_reason = CLAWBACK"
          - "CASCADE HOP: caused by the reservation clawback, Program.budget_committed_cents is debited by reserved_amount_cents, budget_available_cents credited by the same amount, and budget_clawed_back_cents incremented by the same amount (Program.version incremented)"
          - "CASCADE HOP: caused by the reservation clawback, Household.encumbered_cents is debited and lifetime_cap_remaining_cents credited by the recovered amount (Household.version incremented)"
          - "CASCADE HOP: caused by the reservation clawback, a ClawbackAction is appended with reason = POST_PAYMENT_INSPECTION_FAILURE, recovered_cents = disbursed_before_cents"
          - "sets every ProjectMeasure.verification_status = CLAWED_BACK"
          - "sets disbursed_amount_cents = 0"
          - "recomputes Contractor.quality_score_rolling"
          - "increments RebateProject.version by 1"

  - entity: Reservation
    initial_state: RESERVED
    terminal_states: [COMMITTED, EXPIRED, RELEASED, CLAWED_BACK]
    transitions:
      - from: RESERVED
        to: COMMITTED
        trigger: "POST /rebate-projects/{id}/payment"
        actor: "ProgramReviewer | ProgramAdmin"
        preconditions: ["reservation.status == RESERVED", "project.status == VERIFIED"]
        side_effects: ["reconciles reserved_amount_cents to project.disbursed_amount_cents", "sets committed_at", "increments Reservation.version by 1"]
      - from: RESERVED
        to: EXPIRED
        trigger: "POST /programs/{id}/sweep"
        actor: ProgramAdmin
        preconditions: ["reservation.status == RESERVED", "reservation.expires_at <= clock_now"]
        side_effects:
          - "sets release_reason = EXPIRY"
          - "CASCADE HOP: Program.budget_reserved_cents debited and budget_available_cents credited by reserved_amount_cents (Program.version incremented)"
          - "CASCADE HOP: Household.encumbered_cents debited and lifetime_cap_remaining_cents credited by reserved_amount_cents (Household.version incremented)"
          - "CASCADE HOP: the project moves RESERVED|CONTRACTOR_HOLD -> EXPIRED, which itself voids the project's measures and cancels its SCHEDULED inspections"
          - "increments Reservation.version by 1"
      - from: RESERVED
        to: RELEASED
        trigger: "system cascade from RebateProject INSTALLED -> FAILED_FINAL"
        actor: system
        preconditions: ["reservation.status == RESERVED"]
        side_effects: ["sets release_reason = FAILED_REINSPECTION", "releases budget and household cap as described on the project transition", "increments Reservation.version by 1"]
      - from: COMMITTED
        to: CLAWED_BACK
        trigger: "system cascade from RebateProject PAID -> CLAWED_BACK"
        actor: system
        preconditions: ["reservation.status == COMMITTED"]
        side_effects: ["sets release_reason = CLAWBACK", "moves the committed amount back to available and increments budget_clawed_back_cents", "increments Reservation.version by 1"]

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [PASSED, CONDITIONAL_PASS, FAILED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /inspections/{id}/result with result=PASS"
        actor: FieldInspector
        preconditions:
          - "inspection.status == SCHEDULED"
          - "acting Inspector id == inspection.inspector_id"
          - "for POST_INSTALL: no earlier SPOT Inspection of the same project has recorded_by_user_id == acting X-User-ID (segregation of duties)"
          - "for POST_INSTALL: every ProjectMeasure of the project has install_status == INSTALLED and carries the verified_quantity and actual_cost_cents reported by POST /rebate-projects/{id}/installation"
        side_effects:
          - "sets result_recorded_at = clock_now and recorded_by_user_id"
          - "BRANCH SIDE-EFFECT SET (PASS): the project moves INSTALLED -> VERIFIED with full final incentives; on a PAID project a passing SPOT inspection changes no money"
          - "recomputes Contractor.quality_score_rolling and completed_inspection_count"
          - "increments Inspection.version by 1"
      - from: SCHEDULED
        to: CONDITIONAL_PASS
        trigger: "POST /inspections/{id}/result with result=CONDITIONAL_PASS"
        actor: FieldInspector
        preconditions: ["inspection.status == SCHEDULED", "acting Inspector id == inspection.inspector_id", "deficiency_severity_max <= 2"]
        side_effects:
          - "sets result_recorded_at = clock_now and recorded_by_user_id"
          - "BRANCH SIDE-EFFECT SET (CONDITIONAL_PASS): the project moves INSTALLED -> VERIFIED, conditional_pass_flag = true, and every final line is reduced by CONDITIONAL_REDUCTION_PCT before cap allocation"
          - "recomputes Contractor.quality_score_rolling and completed_inspection_count"
          - "increments Inspection.version by 1"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /inspections/{id}/result with result=FAIL"
        actor: FieldInspector
        preconditions: ["inspection.status == SCHEDULED", "acting Inspector id == inspection.inspector_id"]
        side_effects:
          - "sets result_recorded_at = clock_now and recorded_by_user_id"
          - "BRANCH SIDE-EFFECT SET (FAIL): POST_INSTALL on a project with remediation_count < cap moves the project to INSPECTION_FAILED and rejects the named measure lines; POST_INSTALL at the remediation cap moves it to FAILED_FINAL and releases the reservation; SPOT on a PAID project moves it to CLAWED_BACK and recovers the disbursed amount"
          - "recomputes Contractor.quality_score_rolling, which may cascade into Contractor suspension and CONTRACTOR_HOLD on that contractor's other reserved projects"
          - "increments Inspection.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /inspections/{id}/cancellation, or system cascade when the inspection's project moves to EXPIRED, FAILED_FINAL or CLAWED_BACK"
        actor: "ProgramReviewer | ProgramAdmin | system"
        preconditions: ["inspection.status == SCHEDULED"]
        side_effects: ["frees the inspector's window for overlap purposes", "increments Inspection.version by 1"]

  - entity: ProjectMeasure
    initial_state: "install_status=PLANNED, verification_status=PENDING"
    terminal_states: ["install_status=VOID", "verification_status=CLAWED_BACK"]
    transitions:
      - from: "install_status=PLANNED"
        to: "install_status=INSTALLED"
        trigger: "POST /rebate-projects/{id}/installation naming this measure_code"
        actor: Contractor
        preconditions: ["install_status == PLANNED", "project.status == RESERVED"]
        side_effects: ["stores actual_cost_cents", "increments ProjectMeasure.version by 1"]
        note: "install_status evolves independently of verification_status; a line can be INSTALLED while still PENDING verification."
      - from: "install_status=PLANNED|INSTALLED"
        to: "install_status=VOID"
        trigger: "system cascade from RebateProject -> REJECTED, EXPIRED or FAILED_FINAL"
        actor: system
        preconditions: ["install_status != VOID"]
        side_effects: ["increments ProjectMeasure.version by 1"]
      - from: "verification_status=PENDING"
        to: "verification_status=VERIFIED"
        trigger: "POST /inspections/{id}/result with POST_INSTALL result IN {PASS, CONDITIONAL_PASS}"
        actor: FieldInspector
        preconditions: ["verification_status == PENDING", "install_status == INSTALLED", "this measure_code is not in rejected_measure_codes"]
        side_effects: ["stores verified_quantity", "computes final_incentive_cents", "increments ProjectMeasure.version by 1"]
      - from: "verification_status=PENDING"
        to: "verification_status=REJECTED"
        trigger: "POST /inspections/{id}/result with POST_INSTALL result=FAIL naming this measure_code, or the anchor-rejection cascade hop"
        actor: FieldInspector | system
        preconditions: ["verification_status == PENDING"]
        side_effects: ["sets rejection_reason = INSPECTION_DEFICIENCY (named directly) or ANCHOR_REJECTED (cascade hop)", "sets final_incentive_cents = 0", "increments ProjectMeasure.version by 1"]
      - from: "verification_status=REJECTED"
        to: "verification_status=PENDING"
        trigger: "POST /rebate-projects/{id}/remediation"
        actor: Contractor
        preconditions: ["verification_status == REJECTED", "project.status == INSPECTION_FAILED"]
        side_effects: ["clears rejection_reason", "increments ProjectMeasure.version by 1"]
        note: "REJECTED -> PENDING closes the verification-dimension cycle."
      - from: "verification_status=VERIFIED"
        to: "verification_status=CLAWED_BACK"
        trigger: "system cascade from RebateProject PAID -> CLAWED_BACK"
        actor: system
        preconditions: ["verification_status == VERIFIED"]
        side_effects: ["increments ProjectMeasure.version by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules  (OCC on the parent entity's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: reservation-create-stale-program
    parent_entity: Program
    write_endpoint: "POST /rebate-projects/{id}/reservations"
    occ_field: "expected_program_version"
    description: |
      Creating a Reservation against a Program whose version has advanced since
      the client last read it is rejected. Reserving funds for a second approved
      project is legitimate on its own terms, so the request cannot be refused by
      any state precondition; the stale version is what tells the reviewer their
      view of budget_available_cents predates another reservation.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412

  - rule_id: assessment-create-stale-household
    parent_entity: Household
    write_endpoint: "POST /assessments"
    occ_field: "expected_household_version"
    description: |
      Creating an Assessment for a Household whose version has advanced since the
      client last read it is rejected. A new assessment legitimately supersedes
      the prior PENDING_REVIEW or APPROVED assessment, so a second create would
      otherwise succeed; the stale version is what tells the contractor their view
      of the household's income tier, cap remaining and prior assessment is out of
      date.
    error_id: ERR_STALE_HOUSEHOLD_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: income_tier_assignment
    trigger: "POST /income-verifications/{id}/verify with decision=VERIFY (IncomeVerification SUBMITTED -> VERIFIED)"
    algorithm: threshold
    formula: |
      size = IncomeVerification.household_size_attested
      factor = SIZE_ADJUSTMENT[min(size, 7)]        # 7+ all use the size-7 factor
      adjusted_median = IncomeVerification.county_median_income_cents * factor
      ami_raw = (IncomeVerification.annual_household_income_cents / adjusted_median) * 100
      ami_percent = round_half_up(ami_raw, 1)       # ROUNDED FIRST — the tier test uses the rounded value
      if   ami_percent <= program.ami_low_threshold_pct:      tier = LOW
      elif ami_percent <= program.ami_moderate_threshold_pct: tier = MODERATE
      else:                                                  tier = STANDARD
      cap_cents = { LOW: program.low_tier_cap_cents,
                    MODERATE: program.moderate_tier_cap_cents,
                    STANDARD: program.standard_tier_cap_cents }[tier]
      cost_share_pct = { LOW: program.low_tier_cost_share_pct,
                         MODERATE: program.moderate_tier_cost_share_pct,
                         STANDARD: program.standard_tier_cost_share_pct }[tier]
      writes IncomeVerification.computed_ami_percent / assigned_income_tier / assigned_cap_cents
      writes Household.ami_percent / income_tier / rebate_cap_cents
      writes Household.lifetime_cap_remaining_cents = cap_cents - Household.encumbered_cents
    input_set: "Exactly the IncomeVerification being verified; the household's own household_size field is NOT used. A household may hold at most one VERIFIED IncomeVerification."
    constants:
      SIZE_ADJUSTMENT: { 1: 0.70, 2: 0.80, 3: 0.90, 4: 1.00, 5: 1.08, 6: 1.16, 7: 1.24 }
    precision: "ami_percent rounded to 1 decimal place, round_half_up, BEFORE the threshold comparison; cents are integers"
    variants: []

  - name: eligible_measure_qualification
    trigger: "POST /assessments (creates one EligibleMeasure per proposed measure)"
    algorithm: constraint_propagation
    formula: |
      Lines are evaluated in a pinned order: MeasureCatalogItem.sort_order ASC,
      then EligibleMeasure.created_at ASC. evaluation_order is that 1-based rank.
      Stage A (catalog + tier, ignoring panel capacity):
        if catalog item missing or item.active == false -> RETIRED_CATALOG_ITEM
        elif household.income_tier == STANDARD and item.standard_tier_eligible == false -> TIER_INELIGIBLE
        else tentative_qualified = true
      Stage B (panel-upgrade anchor):
        for each line whose item.requires_qualifying_appliance == true:
          if NO tentative_qualified line has item.qualifies_as_appliance_anchor == true
             -> ANCHOR_MISSING
      Stage C (capacity propagation):
        effective_panel_amps = assessment.assessed_panel_amps
        if any line with item.is_panel_upgrade == true survived Stage B:
          effective_panel_amps = max(effective_panel_amps,
                                     max(item.upgraded_capacity_amps of those lines))
      Stage D (capacity gate, panel-upgrade lines exempt):
        for each surviving line with item.is_panel_upgrade == false:
          if item.required_panel_capacity_amps > effective_panel_amps
             -> PANEL_CAPACITY_INSUFFICIENT
      Stage E (prerequisite by business key):
        for each surviving line whose item.prerequisite_measure_code is not null:
          if that measure_code is absent from this assessment, or its line did not
             survive Stage D -> PREREQUISITE_MISSING
      qualified = (disqualification_reason is null)
      writes Assessment.effective_panel_amps, qualified_measure_count
    input_set: "Only the measure lines proposed on this assessment; measures on prior (now SUPERSEDED) assessments are excluded."
    constants: {}
    precision: "integer amps; stage order is normative and never re-run to a fixed point"
    variants: []
    note: |
      The anchor and the capacity gate are mutually entangled: the panel upgrade
      needs an anchor appliance, and the anchor appliance may itself need the
      capacity the panel upgrade provides. The stage order resolves it: an anchor
      that is tentatively qualified in Stage A (catalog + tier only) is enough to
      qualify the panel upgrade in Stage B, and the raised capacity from Stage C
      then rescues the anchor in Stage D.

  - name: measure_line_incentive
    trigger: "POST /rebate-projects (provisional), POST /assessments (estimate), POST /inspections/{id}/result with POST_INSTALL result IN {PASS, CONDITIONAL_PASS} (final)"
    algorithm: tiered_pricing
    formula: |
      unit  = ProjectMeasure.pinned_unit_incentive_cents
      maxq  = ProjectMeasure.pinned_max_quantity
      mcap  = ProjectMeasure.pinned_measure_cap_cents
      share = cost_share_pct for household.income_tier (see income_tier_assignment)
      qty   = provisional: ProjectMeasure.planned_quantity
              final:       ProjectMeasure.verified_quantity
      cost  = provisional: ProjectMeasure.estimated_cost_cents
              final:       ProjectMeasure.actual_cost_cents
      raw            = unit * min(qty, maxq)
      cost_share_cap = floor(cost * share)
      line = min(raw, mcap, cost_share_cap)
      if ProjectMeasure.pinned_is_panel_upgrade:
          line = min(line, program.panel_upgrade_cap_cents)
      if project.conditional_pass_flag and this is the final variant:
          line = floor(line * (1 - CONDITIONAL_REDUCTION_PCT))
      if ProjectMeasure.verification_status == REJECTED: line = 0
    input_set: "One ProjectMeasure row at a time; rates come from the pinned_* fields captured at project creation, never from the live MeasureCatalogItem."
    constants:
      CONDITIONAL_REDUCTION_PCT: 0.10
    precision: "integer cents; every intermediate product is floored to whole cents before the min() chain"
    variants: []

  - name: measure_incentive_allocation
    trigger: "POST /rebate-projects, POST /rebate-projects/{id}/submit (from INCOMPLETE), POST /inspections/{id}/result with POST_INSTALL result IN {PASS, CONDITIONAL_PASS}, and the anchor-rejection cascade hop of the INSTALLED -> INSPECTION_FAILED transition"
    algorithm: waterfall_allocation
    formula: |
      Stage 1 — per-line: line[i] = measure_line_incentive(i)   (integer cents)
      Stage 2 — combined-measure cap, group by group:
        for each group g in {HVAC_GROUP, WATER_GROUP, APPLIANCE_GROUP, ELECTRICAL_GROUP}
        (NONE is never prorated), taken in that fixed group order:
          members = lines with pinned_combined_cap_group == g, ordered by
                    (pinned_sort_order ASC, ProjectMeasure.created_at ASC)
          S = sum(line[i] for members)
          if S > program.group_cap_cents:          # strictly greater — S == cap does NOT prorate
            for every member except the LAST in that order:
                line[i] = floor(line[i] * program.group_cap_cents / S)
            line[last] = program.group_cap_cents - sum(the floored members)
      Stage 3 — household lifetime cap, applied AFTER stage 2 and never before:
        T = household.lifetime_cap_remaining_cents + already_encumbered_by_this_project
            (already_encumbered_by_this_project = this project's Reservation
             reserved_amount_cents when a RESERVED reservation exists, else 0)
        members = ALL lines of the project, ordered by
                  (pinned_sort_order ASC, ProjectMeasure.created_at ASC)
        S2 = sum(line[i])
        if S2 > T:
          for every member except the LAST in that order: line[i] = floor(line[i] * T / S2)
          line[last] = T - sum(the floored members)
      total = sum(line[i])                          # equals the binding cap exactly
      writes ProjectMeasure.provisional_incentive_cents / final_incentive_cents and
             RebateProject.provisional_total_incentive_cents / final_total_incentive_cents
    input_set: "Every ProjectMeasure of the project whose install_status != VOID and verification_status != REJECTED; VOID and REJECTED lines contribute 0 and are excluded from the proration order."
    constants: {}
    precision: |
      Round-then-sum, never sum-then-round: each prorated line is FLOORED to whole
      cents and the residual cents are assigned to the LAST line in the pinned
      order, so the stage total equals the cap exactly. Applying the two stages in
      the reverse order, or flooring every line including the last, produces a
      different per-line split and a total short of the cap.
    variants:
      - name: provisional
        when: "At project creation, at resubmission from INCOMPLETE, and as the reservation amount"
        difference: "qty = planned_quantity and cost = estimated_cost_cents; T excludes this project's own reservation because none exists yet; writes provisional_incentive_cents / provisional_total_incentive_cents"
      - name: final
        when: "At post-install verification (POST_INSTALL PASS or CONDITIONAL_PASS) and on the anchor-rejection cascade hop"
        difference: "qty = verified_quantity and cost = actual_cost_cents; T adds back this project's own reserved_amount_cents so its own encumbrance does not squeeze its own final total; a CONDITIONAL_PASS additionally reduces every line by CONDITIONAL_REDUCTION_PCT in Stage 1; writes final_incentive_cents / final_total_incentive_cents"

  - name: benefit_stacking_limit
    trigger: "POST /rebate-projects/{id}/stacking-declarations, and re-run on POST /inspections/{id}/result when final_total_incentive_cents changes while an ACTIVE StackingDeclaration exists"
    algorithm: constraint_propagation
    formula: |
      Evaluation order is pinned and executed exactly once — no iteration:
      1. cost = project.actual_project_cost_cents if not null else project.estimated_project_cost_cents
      2. U   = StackingDeclaration.utility_rebate_cents
      3. S0  = project.final_total_incentive_cents if not null else project.provisional_total_incentive_cents
      4. F   = min(program.federal_credit_cap_cents,
                   max(0, floor(program.federal_credit_pct * (cost - S0 - U))))
      5. TB  = S0 + U + F
         LIMIT = floor(cost * program.max_combined_benefit_pct)
      6. if TB > LIMIT: S1 = max(0, S0 - (TB - LIMIT))   else: S1 = S0
      7. F_final = min(program.federal_credit_cap_cents,
                       max(0, floor(program.federal_credit_pct * (cost - S1 - U))))
         # recomputed EXACTLY ONCE from S1; the larger net cost can make F_final
         # exceed F, and the scaffold does NOT loop back to step 6.
      8. residual_overage_cents = max(0, S1 + U + F_final - LIMIT)
      writes StackingDeclaration.computed_state_incentive_before_cents = S0,
             allowed_state_incentive_cents = S1,
             allowed_federal_credit_cents = F_final,
             combined_benefit_limit_cents = LIMIT,
             residual_overage_cents,
             and RebateProject.stacking_adjusted_state_incentive_cents = S1
    input_set: "The single StackingDeclaration with status == ACTIVE for the project (at most one); federal_credit_claimed_cents is recorded for audit and never enters the formula."
    constants: {}
    precision: "integer cents; every percentage product is floored"
    variants: []

  - name: contractor_quality_score
    trigger: "POST /inspections/{id}/result (rolling_window variant, writes Contractor.quality_score_rolling and completed_inspection_count) and GET /contractors/{id}/quality-review (severity_weighted variant, computed on read)"
    algorithm: weighted_scoring
    formula: |
      POINTS = { PASSED: 100, CONDITIONAL_PASS: 70, FAILED: 0 }
      candidates = Inspections whose project.contractor_id == this contractor and
                   status IN {PASSED, CONDITIONAL_PASS, FAILED}
                   ordered by result_recorded_at DESC, then created_at DESC
      rolling_window:   window = first ROLLING_WINDOW candidates
                        score  = round_half_up( sum(POINTS[s]) / count )
      severity_weighted: window = candidates whose result_recorded_at >=
                                  clock_now - WEIGHTED_WINDOW_DAYS days
                        w[i]   = 1 + Inspection.deficiency_count
                        score  = round_half_up( sum(w[i]*POINTS[s_i]) / sum(w[i]) )
      empty window -> score = 100 for both variants
      rolling_window side effect: score < program.quality_suspension_threshold
        triggers Contractor ENROLLED_ACTIVE -> SUSPENDED with suspension_reason = QUALITY_SCORE
      severity_weighted side effect: none; recertification_eligible =
        (score >= program.recertification_threshold)
    input_set: "Inspections of every project of this contractor regardless of project state; CANCELLED and SCHEDULED inspections are excluded."
    constants:
      ROLLING_WINDOW: 10
      WEIGHTED_WINDOW_DAYS: 365
    precision: "integer score, round_half_up on the final quotient only (no per-term rounding)"
    variants:
      - name: rolling_window
        when: "Persisted on Contractor.quality_score_rolling every time an inspection result is recorded; the suspension gate reads this variant"
        difference: "Counts at most the 10 most recent results, weights every result equally, and ignores deficiency_count and the 365-day horizon entirely"
      - name: severity_weighted
        when: "Computed on demand by GET /contractors/{id}/quality-review; the recertification gate reads this variant"
        difference: "Counts every result inside a 365-day window with no cap on count, and weights each by 1 + deficiency_count, so a single failure with many deficiencies dominates — the same inspection history yields a different integer than rolling_window"

  - name: disbursement_reconciliation
    trigger: "POST /rebate-projects/{id}/payment (RebateProject VERIFIED -> PAID)"
    algorithm: aggregation
    formula: |
      basis = project.stacking_adjusted_state_incentive_cents
              if an ACTIVE StackingDeclaration exists for the project
              else project.final_total_incentive_cents
      disbursed = min(basis, reservation.initial_reserved_amount_cents)
      release_delta = reservation.initial_reserved_amount_cents - disbursed
      writes RebateProject.disbursed_amount_cents = disbursed
             Reservation.reserved_amount_cents = disbursed
             Program.budget_reserved_cents  -= initial_reserved_amount_cents
             Program.budget_committed_cents += disbursed
             Program.budget_available_cents += release_delta
             Household.encumbered_cents = ... - initial_reserved_amount_cents + disbursed
             Household.lifetime_cap_remaining_cents += release_delta
    input_set: "The project's single Reservation with status == RESERVED and the project's ACTIVE StackingDeclaration if one exists."
    constants: {}
    precision: "integer cents; release_delta is never negative because disbursed is capped by the initial reservation"
    variants: []

  - name: inspector_window_conflict
    trigger: "POST /inspections"
    algorithm: interval_merge
    formula: |
      new_start, new_end are the requested half-open window [start, end).
      occupied = Inspections of the SAME inspector_id whose status IN
                 {SCHEDULED, PASSED, CONDITIONAL_PASS, FAILED}   # CANCELLED frees the slot
      buffer = TRAVEL_BUFFER_MINUTES
      conflict(existing) :=  new_start < existing.scheduled_end   + buffer
                        AND existing.scheduled_start < new_end    + buffer
      if any conflict -> ERR_INSPECTOR_WINDOW_CONFLICT
      Capacity is exactly 1: a single conflicting window is enough to reject.
    input_set: "All inspections of that one inspector across every program and project; the candidate project is irrelevant."
    constants:
      TRAVEL_BUFFER_MINUTES: 45
    precision: "minute-resolution UTC timestamps; the interval is half-open on the right, so a window starting exactly buffer minutes after another ends is accepted"
    variants: []

  - name: install_window_capacity
    trigger: "POST /rebate-projects/{id}/installation"
    algorithm: interval_merge
    formula: |
      new window is the CLOSED calendar-date interval [install_start_date, install_end_date]
      occupied = other RebateProjects with the same contractor_id whose status IN
                 {INSTALLED, INSPECTION_FAILED, REMEDIATION, VERIFIED, PAID}
                 and whose install_start_date / install_end_date are both non-null
      overlaps(existing) := new_start <= existing.install_end_date
                        AND existing.install_start_date <= new_end
                        # closed on BOTH ends: sharing a single date is an overlap
      if count(overlapping) >= contractor.crew_capacity
         -> ERR_CONTRACTOR_CREW_CAPACITY_EXCEEDED
      Capacity is aggregate: overlaps are permitted up to crew_capacity - 1.
    input_set: "Only that contractor's projects in the listed states; DRAFT/SUBMITTED/APPROVED/RESERVED projects have no install window yet and EXPIRED/FAILED_FINAL/CLAWED_BACK/REJECTED windows are released."
    constants: {}
    precision: "whole calendar dates (YYYY-MM-DD), closed on both ends, compared as dates not timestamps"
    variants: []

  - name: reservation_expiry_sweep
    trigger: "POST /programs/{id}/sweep"
    algorithm: chronological
    formula: |
      due = Reservations with program_id == this program, status == RESERVED and
            expires_at <= clock_now          # inclusive: expiring exactly now expires
      process due in order expires_at ASC, then created_at ASC
      for each: Reservation RESERVED -> EXPIRED with the cascade declared on that
                transition (budget release, household cap restore, project ->
                EXPIRED, measures VOID, SCHEDULED inspections CANCELLED)
      returns swept_reservation_count, expired_project_ids (in processing order),
              released_cents (sum of the released reserved_amount_cents),
              program_budget_available_cents (after the sweep)
    input_set: "Only RESERVED reservations of the swept program; COMMITTED, RELEASED, EXPIRED and CLAWED_BACK reservations are skipped, and a SUSPENDED or CLOSED program is still swept."
    constants: {}
    precision: "expires_at comparison is inclusive (<=); ordering never uses id"
    variants: []

  - name: reservation_extension_expiry
    trigger: "POST /reservations/{id}/extensions"
    algorithm: threshold
    formula: |
      window_opens_at = reservation.expires_at - program.extension_window_days days
      require clock_now >= window_opens_at          # inclusive lower bound
      require clock_now <  reservation.expires_at
      require reservation.extension_count < program.max_extensions_per_reservation
      require additional_days <= program.max_extension_days and additional_days >= 1
      new_expires_at = reservation.expires_at + additional_days days
      writes Reservation.expires_at, extension_count += 1,
             extension_days_granted += additional_days
    input_set: "The single reservation named in the path; the project must be in status RESERVED or CONTRACTOR_HOLD."
    constants: {}
    precision: "day arithmetic on UTC instants; the window lower bound is inclusive so an extension exactly extension_window_days before expiry is accepted"
    variants: []

  - name: program_budget_conservation
    trigger: "Invariant checked after every mutation that touches Program budget fields (reservation create, sweep, payment, failed-reinspection release, post-payment clawback)"
    algorithm: aggregation
    formula: |
      program.budget_total_cents ==
          program.budget_available_cents
        + program.budget_reserved_cents
        + program.budget_committed_cents
      and
      program.budget_reserved_cents  == sum(Reservation.reserved_amount_cents
                                            where program_id == program.id
                                              and status == RESERVED)
      program.budget_committed_cents == sum(Reservation.reserved_amount_cents
                                            where program_id == program.id
                                              and status == COMMITTED)
      program.budget_clawed_back_cents == sum(ClawbackAction.recovered_cents
                                              over this program's projects)
    input_set: "All Reservations of the program; budget_clawed_back_cents is a cumulative counter and is deliberately NOT one of the three conserved buckets."
    constants: {}
    precision: "exact integer cents; a reserve followed by its compensating action (expiry, failed-reinspection release, or post-payment clawback) must return budget_available_cents to its pre-reservation value with zero drift"
    variants: []

  - name: household_cap_conservation
    trigger: "Invariant checked after every mutation that touches Household cap fields (income verification, reservation create, sweep, payment reconciliation, release, clawback)"
    algorithm: aggregation
    formula: |
      household.rebate_cap_cents ==
          household.lifetime_cap_remaining_cents + household.encumbered_cents
      and
      household.encumbered_cents == sum(Reservation.reserved_amount_cents
                                        for reservations whose project.household_id
                                        == household.id and status IN {RESERVED, COMMITTED})
    input_set: "Every Reservation reachable through this household's projects; EXPIRED, RELEASED and CLAWED_BACK reservations are excluded from encumbered_cents."
    constants: {}
    precision: "exact integer cents; the conserved quantity is the household's lifetime entitlement, a different quantity from the program appropriation, and commit-time downward reconciliation must credit the difference back rather than leaving it encumbered"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#      the FIRST violated rule determines the response and no later rule runs)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-ID header present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
    description: "Identity header missing. Precedes every other check including malformed bodies."

  - priority: 2
    category: auth
    check: "X-User-Role header present and permitted for the endpoint per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
    description: "Role not in the endpoint's allowed roles. Beats body validation: a Contractor posting a malformed payment body gets 403, never 400."

  - priority: 3
    category: validation
    check: "Body/query parses, required fields present, types and enums valid, numeric ranges respected, date/datetime ranges ordered (start <= end)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
    description: "Structural validation of the request itself. Runs before any database lookup, so a malformed body on a non-existent parent returns 400 not 404."

  - priority: 4
    category: validation
    check: "limit within [1, 100] and offset >= 0 when supplied"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"
    description: "Pagination arguments are validated separately from the rest of the body so the caller can distinguish the two."

  - priority: 5
    category: existence
    check: "Path-parameter entities exist, resolved LEFT TO RIGHT along the path"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_HOUSEHOLD_NOT_FOUND | ERR_CONTRACTOR_NOT_FOUND | ERR_INSPECTOR_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_INCOME_VERIFICATION_NOT_FOUND | ERR_PROJECT_NOT_FOUND | ERR_RESERVATION_NOT_FOUND | ERR_INSPECTION_NOT_FOUND | ERR_CLAWBACK_ACTION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"
    description: "For a nested path such as POST /rebate-projects/{id}/reservations the project is resolved first; the error names the leftmost missing segment."

  - priority: 6
    category: existence
    check: "Body-referenced entities exist and belong to the same program: program_id, household_id, contractor_id, inspector_id, assessment_id, income_verification_id, project_id, and every measure_code resolving to a MeasureCatalogItem of that program"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_HOUSEHOLD_NOT_FOUND | ERR_CONTRACTOR_NOT_FOUND | ERR_INSPECTOR_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_INCOME_VERIFICATION_NOT_FOUND | ERR_PROJECT_NOT_FOUND | ERR_MEASURE_CODE_NOT_IN_CATALOG"
    http_status: 404
    applies_to: "POST /assessments, POST /rebate-projects, POST /inspections, POST /households, POST /contractors, POST /inspectors, POST /programs/{id}/measure-catalog-items"
    description: "Body references are resolved after path references, in declaration order of the request body. A measure_code that exists in another program's catalog is treated as absent."

  - priority: 7
    category: rbac
    check: "For entity_backed roles, the acting X-User-ID equals the id of the entity the resource belongs to: Applicant -> the addressed Household.id (or project.household_id); Contractor -> the addressed Contractor.id (or project.contractor_id / assessment.contractor_id); FieldInspector -> the addressed Inspector.id (or inspection.inspector_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /households/{id}/income-verifications, POST /rebate-projects, POST /rebate-projects/{id}/submit, POST /rebate-projects/{id}/installation, POST /rebate-projects/{id}/stacking-declarations, POST /rebate-projects/{id}/remediation, POST /inspections/{id}/result, GET /households/{id}, GET /rebate-projects/{id}"
    description: "Right role, wrong tenant. Deliberately AFTER existence so probing for foreign ids yields 404 vs 403 consistently with the id actually existing."

  - priority: 8
    category: state
    check: "Source entity is in a state from which the requested transition is declared in §1.2, and the enclosing program is OPEN where required"
    error_id: "ERR_INVALID_STATE_TRANSITION | ERR_PROGRAM_NOT_OPEN | ERR_ASSESSMENT_NOT_APPROVED | ERR_PROJECT_NOT_APPROVED_FOR_RESERVATION | ERR_RESERVATION_NOT_ACTIVE | ERR_RESERVATION_EXPIRED | ERR_INSPECTION_ALREADY_RECORDED | ERR_OPEN_INSPECTION_PENDING | ERR_INCOME_TIER_ALREADY_VERIFIED"
    http_status: 409
    applies_to: "all transition endpoints"
    description: "The umbrella state gate. A terminal-state entity (PAID, EXPIRED, FAILED_FINAL, CLAWED_BACK) always fails here. When the blocking condition is a sibling Inspection still in SCHEDULED (payment, or scheduling a re-inspection out of REMEDIATION), the specific error_id is ERR_OPEN_INSPECTION_PENDING rather than the generic ERR_INVALID_STATE_TRANSITION."

  - priority: 9
    category: concurrency
    check: "expected_<parent>_version equals the current parent version (see §1.2.1)"
    error_id: "ERR_STALE_PROGRAM_VERSION | ERR_STALE_HOUSEHOLD_VERSION"
    http_status: 412
    applies_to: "POST /rebate-projects/{id}/reservations, POST /assessments"
    description: "Optimistic concurrency token check. Placed after the state gate so a caller holding a stale token on an already-terminal entity learns about the state problem first."

  - priority: 10
    category: rbac
    check: "Segregation of duties: the X-User-ID recording a decision differs from the X-User-ID that produced the artifact being decided"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /income-verifications/{id}/verify, POST /rebate-projects/{id}/reservations, POST /rebate-projects/{id}/payment, POST /inspections/{id}/result"
    description: "The reviewer who returned the project review decision may not also encumber budget for it; the admin who pays may not be that reviewer; the inspector who recorded a SPOT result on a project may not record its POST_INSTALL result; the user who filed an income verification may not verify it."

  - priority: 11
    category: business_safety
    check: "The contractor attached to the operation is ENROLLED_ACTIVE and its license_expires_on / insurance_expires_on are both >= clock_now date"
    error_id: "ERR_CONTRACTOR_NOT_ACTIVE | ERR_CONTRACTOR_CREDENTIAL_EXPIRED"
    http_status: 409
    applies_to: "POST /assessments, POST /rebate-projects, POST /rebate-projects/{id}/submit, POST /rebate-projects/{id}/installation, POST /rebate-projects/{id}/remediation"
    description: "Installer fitness. ERR_CONTRACTOR_NOT_ACTIVE is checked before credential expiry: a SUSPENDED contractor with expired paperwork reports the suspension."

  - priority: 12
    category: business_safety
    check: "Electrical safety: every non-panel measure line's required_panel_capacity_amps <= the project's effective panel capacity (assessment.effective_panel_amps, or installed_panel_amps once installation is recorded)"
    error_id: ERR_PANEL_CAPACITY_INSUFFICIENT
    http_status: 422
    applies_to: "POST /rebate-projects, POST /rebate-projects/{id}/submit, POST /rebate-projects/{id}/installation"
    description: "Physical safety outranks program bookkeeping: an unpowerable appliance is rejected before any referential or fiscal reasoning."

  - priority: 13
    category: business_referential
    check: "Measure-set coherence: a panel/service upgrade line requires at least one qualifying appliance anchor line on the same project, and every line whose catalog item declares prerequisite_measure_code has that measure present and qualified on the same project"
    error_id: "ERR_PANEL_UPGRADE_ANCHOR_MISSING | ERR_PREREQUISITE_MEASURE_MISSING"
    http_status: 422
    applies_to: "POST /rebate-projects, POST /rebate-projects/{id}/submit"
    description: "The anchor rule is evaluated first, then prerequisites, matching the pinned stage order of eligible_measure_qualification."

  - priority: 14
    category: business_referential
    check: "The measure set is non-empty: the request carries at least one measure line, and the linked assessment has qualified_measure_count >= 1"
    error_id: ERR_NO_ELIGIBLE_MEASURES
    http_status: 422
    applies_to: "POST /rebate-projects, POST /rebate-projects/{id}/submit, POST /assessments/{id}/approve"
    description: "Empty-set guard for the allocation calculation, which is undefined on zero lines. An empty measures array is STRUCTURALLY valid (priority 3 accepts it) and is rejected here as a business empty set, so the zero-line edge is observable as ERR_NO_ELIGIBLE_MEASURES rather than ERR_INVALID_REQUEST. Ordered before the per-line checks so a zero-qualified assessment reports the set-level failure, not a per-line one."

  - priority: 15
    category: business_referential
    check: "Every requested measure_code appears on the linked assessment as an EligibleMeasure with qualified == true, and no measure_code is repeated within one request"
    error_id: "ERR_MEASURE_NOT_ELIGIBLE | ERR_DUPLICATE_MEASURE_LINE"
    http_status: 422
    applies_to: "POST /rebate-projects, POST /rebate-projects/{id}/submit"
    description: "Ineligibility is reported before duplication, so a repeated ineligible code reports ERR_MEASURE_NOT_ELIGIBLE."

  - priority: 16
    category: business_temporal
    check: "The requested inspector window does not conflict with that inspector's other live windows once TRAVEL_BUFFER_MINUTES is applied (see inspector_window_conflict)"
    error_id: ERR_INSPECTOR_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /inspections"
    description: "Single-capacity half-open interval check with a 45-minute travel buffer."

  - priority: 17
    category: business_temporal
    check: "The contractor's overlapping live install windows number fewer than crew_capacity (see install_window_capacity)"
    error_id: ERR_CONTRACTOR_CREW_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /rebate-projects/{id}/installation"
    description: "Aggregate-capacity closed-interval check. A different interval semantics and a different resource from priority 16."

  - priority: 18
    category: business_temporal
    check: "Extension request is inside the extension window, within the per-reservation extension limit, and within max_extension_days"
    error_id: "ERR_EXTENSION_WINDOW_NOT_OPEN | ERR_EXTENSION_LIMIT_REACHED | ERR_EXTENSION_DAYS_EXCEEDED"
    http_status: 422
    applies_to: "POST /reservations/{id}/extensions"
    description: "Window membership is checked before the count limit, and the count limit before the length limit."

  - priority: 19
    category: business_fiscal
    check: "The household has a VERIFIED IncomeVerification, so income_tier and rebate_cap_cents are assigned"
    error_id: ERR_INCOME_TIER_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /rebate-projects, POST /rebate-projects/{id}/reservations"
    description: "Guards the tier-dependent cost-share factor. Unverified households can still hold assessments."

  - priority: 20
    category: business_fiscal
    check: "household.lifetime_cap_remaining_cents >= 1 at reservation time"
    error_id: ERR_HOUSEHOLD_CAP_EXHAUSTED
    http_status: 422
    applies_to: "POST /rebate-projects/{id}/reservations"
    description: "A fully encumbered household cannot open a second reservation, even though allocation would clamp the amount to zero."

  - priority: 21
    category: business_fiscal
    check: "Declared utility rebate plus federal credit plus state incentive leaves a non-negative allowed state incentive; a declaration that would drive allowed_state_incentive_cents to 0 is rejected rather than recorded"
    error_id: ERR_STACKING_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /rebate-projects/{id}/stacking-declarations"
    description: "Runs after all referential checks: the stacking arithmetic needs a settled measure set."

  - priority: 22
    category: business_fiscal
    check: "program.budget_available_cents >= the amount to be reserved"
    error_id: ERR_PROGRAM_BUDGET_EXHAUSTED
    http_status: 422
    applies_to: "POST /rebate-projects/{id}/reservations"
    description: "The last gate in the whole ladder. Appropriation scarcity is reported only when every other aspect of the request is sound."

validation_priority_conflicts:
  - pair: "priority 8 state (ERR_PROJECT_NOT_APPROVED_FOR_RESERVATION) vs priority 22 business_fiscal (ERR_PROGRAM_BUDGET_EXHAUSTED)"
    endpoint: "POST /rebate-projects/{id}/reservations"
    setup: "A project still in SUBMITTED inside a program whose budget_available_cents is 0"
    expected: "ERR_PROJECT_NOT_APPROVED_FOR_RESERVATION (409) — the state gate wins by 14 priority levels"
  - pair: "priority 11 business_safety (ERR_CONTRACTOR_NOT_ACTIVE) vs priority 13 business_referential (ERR_PANEL_UPGRADE_ANCHOR_MISSING)"
    endpoint: "POST /rebate-projects"
    setup: "A SUSPENDED contractor and a measure set containing a panel upgrade with no qualifying appliance anchor"
    expected: "ERR_CONTRACTOR_NOT_ACTIVE (409) — installer fitness outranks measure-set coherence"

# =============================================================================
# §1.5 API Endpoint Table
#
# Path convention: the FIRST path parameter of every path is literally `{id}`
# and addresses the collection named by the first segment, so sub-resource
# reverse-reachability GETs read `/<parent-collection>/{id}/<child-segment>`.
# =============================================================================
endpoints:

  # ---------------------------------------------------------------- Program --
  - method: POST
    path: "/programs"
    description: "Create a rebate program in DRAFT with its full parameter set; every tier cap, threshold and window is overridable so tests can pin arithmetic."
    roles: [ProgramAdmin]
    code: 201
    input: [name, state_code, budget_total_cents, "program_year?", "reservation_ttl_days?", "extension_window_days?", "max_extension_days?", "max_extensions_per_reservation?", "low_tier_cap_cents?", "moderate_tier_cap_cents?", "standard_tier_cap_cents?", "low_tier_cost_share_pct?", "moderate_tier_cost_share_pct?", "standard_tier_cost_share_pct?", "ami_low_threshold_pct?", "ami_moderate_threshold_pct?", "group_cap_cents?", "panel_upgrade_cap_cents?", "federal_credit_pct?", "federal_credit_cap_cents?", "max_combined_benefit_pct?", "max_remediations_per_project?", "quality_suspension_threshold?", "recertification_threshold?"]
    output: Program
    side_effects: ["sets status = DRAFT", "sets budget_available_cents = budget_total_cents and the other three budget buckets to 0"]

  - method: GET
    path: "/programs/{id}"
    description: "Read one program including its four budget buckets and version."
    roles: [Applicant, Contractor, FieldInspector, ProgramReviewer, ProgramAdmin]
    code: 200
    input: []
    output: Program
    side_effects: []

  - method: GET
    path: "/programs"
    description: "List programs with optional status / state filters and pagination."
    roles: [ProgramReviewer, ProgramAdmin]
    code: 200
    input: ["status?", "state_code?", "limit?", "offset?"]
    output: Program[]
    side_effects: []

  - method: POST
    path: "/programs/{id}/status"
    description: "Drive the program lifecycle (DRAFT -> OPEN -> SUSPENDED -> OPEN -> CLOSED)."
    roles: [ProgramAdmin]
    code: 200
    input: [new_status, "status_note?"]
    output: Program
    side_effects: ["applies the Program transition declared in §1.2", "increments Program.version by 1"]

  - method: POST
    path: "/programs/{id}/sweep"
    description: "Expire every RESERVED reservation of this program whose expires_at <= the logical clock, in expires_at ASC then created_at ASC order, cascading to projects, measures and scheduled inspections."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: "{ program_id: string, swept_reservation_count: integer, released_cents: integer, expired_project_ids: string[], program_budget_available_cents: integer }"
    side_effects: ["runs reservation_expiry_sweep", "moves each due Reservation RESERVED -> EXPIRED with its declared cascade", "restores Program budget_available_cents and Household lifetime_cap_remaining_cents", "increments Program.version by 1 per released reservation"]

  - method: POST
    path: "/programs/{id}/measure-catalog-items"
    description: "Add a measure to the program catalog, including panel-upgrade items and items with a prerequisite measure code."
    roles: [ProgramAdmin]
    code: 201
    input: [measure_code, measure_name, category, unit_incentive_cents, measure_cap_cents, combined_cap_group, sort_order, "max_quantity?", "required_panel_capacity_amps?", "upgraded_capacity_amps?", "is_panel_upgrade?", "requires_qualifying_appliance?", "qualifies_as_appliance_anchor?", "prerequisite_measure_code?", "standard_tier_eligible?", "active?"]
    output: MeasureCatalogItem
    side_effects: ["measure_code is unique within the program"]

  - method: GET
    path: "/programs/{id}/measure-catalog-items"
    description: "List the program's catalog items; the reverse-reachability read for MeasureCatalogItem.program_id."
    roles: [Applicant, Contractor, FieldInspector, ProgramReviewer, ProgramAdmin]
    code: 200
    input: ["active?", "category?", "combined_cap_group?", "limit?", "offset?"]
    output: MeasureCatalogItem[]
    side_effects: []

  - method: POST
    path: "/programs/{id}/measure-catalog-items/{item_id}/retirement"
    description: "Retire a catalog item (active = false) without deleting it, so already-pinned project lines keep their rates while new assessments disqualify the measure as RETIRED_CATALOG_ITEM."
    roles: [ProgramAdmin]
    code: 200
    input: ["retirement_note?"]
    output: MeasureCatalogItem
    side_effects: ["sets active = false", "increments MeasureCatalogItem.version by 1", "does NOT touch any existing ProjectMeasure pinned_* field"]

  - method: GET
    path: "/programs/{id}/households"
    description: "List the program's households; the reverse-reachability read for Household.program_id."
    roles: [ProgramReviewer, ProgramAdmin]
    code: 200
    input: ["income_tier?", "county_code?", "limit?", "offset?"]
    output: Household[]
    side_effects: []

  - method: GET
    path: "/programs/{id}/contractors"
    description: "List the program's contractors; the reverse-reachability read for Contractor.program_id."
    roles: [ProgramReviewer, ProgramAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Contractor[]
    side_effects: []

  - method: GET
    path: "/programs/{id}/inspectors"
    description: "List the program's inspectors; the reverse-reachability read for Inspector.program_id."
    roles: [ProgramReviewer, ProgramAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Inspector[]
    side_effects: []

  # -------------------------------------------------------------- Household --
  - method: POST
    path: "/households"
    description: "Register a household applicant. The returned id is the value the Applicant role sends as X-User-ID from then on."
    roles: [Applicant, ProgramAdmin]
    code: 201
    input: [program_id, applicant_name, email, service_address_line1, county_code, utility_territory_code, household_size, existing_panel_amps]
    output: Household
    side_effects: ["income_tier, rebate_cap_cents and lifetime_cap_remaining_cents stay unset/0 until an income verification is verified"]

  - method: GET
    path: "/households/{id}"
    description: "Read one household including its tier, cap and encumbrance."
    roles: [Applicant, Contractor, ProgramReviewer, ProgramAdmin]
    code: 200
    input: []
    output: Household
    side_effects: []

  - method: POST
    path: "/households/{id}/income-verifications"
    description: "File an income verification packet for the household; recorded as SUBMITTED with no tier assigned yet."
    roles: [Applicant, ProgramAdmin]
    code: 201
    input: [annual_household_income_cents, county_median_income_cents, household_size_attested, "document_reference?"]
    output: IncomeVerification
    side_effects: ["sets status = SUBMITTED and submitted_by_user_id = acting X-User-ID"]

  - method: GET
    path: "/households/{id}/income-verifications"
    description: "List the household's income verifications; the reverse-reachability read for IncomeVerification.household_id."
    roles: [Applicant, ProgramReviewer, ProgramAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: IncomeVerification[]
    side_effects: []

  - method: POST
    path: "/income-verifications/{id}/verify"
    description: "Record the reviewer decision on an income verification; VERIFY runs income_tier_assignment and stamps the household's tier and cap."
    roles: [ProgramReviewer]
    code: 200
    input: [decision, "reviewer_notes?"]
    output: IncomeVerification
    side_effects: ["decision=VERIFY: runs income_tier_assignment, sets status = VERIFIED, computed_ami_percent, assigned_income_tier, assigned_cap_cents, verified_by_user_id, verified_at; writes Household.ami_percent / income_tier / rebate_cap_cents / lifetime_cap_remaining_cents and increments Household.version by 1", "decision=REJECT: sets status = REJECTED and leaves the household untouched"]

  # ------------------------------------------------------------- Contractor --
  - method: POST
    path: "/contractors"
    description: "Apply for contractor enrollment; created PENDING_ENROLLMENT. The returned id is the value the Contractor role sends as X-User-ID."
    roles: [Contractor, ProgramAdmin]
    code: 201
    input: [program_id, business_name, license_number, license_expires_on, insurance_expires_on, "crew_capacity?"]
    output: Contractor
    side_effects: ["sets status = PENDING_ENROLLMENT and quality_score_rolling = 100"]

  - method: GET
    path: "/contractors/{id}"
    description: "Read one contractor including enrollment status and rolling quality score."
    roles: [Applicant, Contractor, ProgramReviewer, ProgramAdmin]
    code: 200
    input: []
    output: Contractor
    side_effects: []

  - method: POST
    path: "/contractors/{id}/enrollment-decision"
    description: "Approve or reject a pending contractor enrollment."
    roles: [ProgramReviewer]
    code: 200
    input: [decision, "decision_notes?"]
    output: Contractor
    side_effects: ["applies the Contractor transition declared in §1.2", "sets enrollment_decided_by_user_id", "increments Contractor.version by 1"]

  - method: POST
    path: "/contractors/{id}/suspension"
    description: "Suspend or reinstate an enrolled contractor; cascades onto that contractor's RESERVED / CONTRACTOR_HOLD projects."
    roles: [ProgramAdmin]
    code: 200
    input: [action, "suspension_reason?"]
    output: Contractor
    side_effects: ["action=SUSPEND cascades every RESERVED project of the contractor to CONTRACTOR_HOLD", "action=REINSTATE cascades every CONTRACTOR_HOLD project whose reservation is still RESERVED back to RESERVED", "increments Contractor.version by 1"]

  - method: GET
    path: "/contractors/{id}/quality-review"
    description: "Computed read exposing both variants of contractor_quality_score side by side over the same inspection history."
    roles: [Contractor, ProgramReviewer, ProgramAdmin]
    code: 200
    input: []
    output: "{ contractor_id: string, rolling_window_score: integer, severity_weighted_score: integer, rolling_window_inspection_count: integer, weighted_inspection_count: integer, suspension_threshold: integer, recertification_threshold: integer, recertification_eligible: boolean }"
    side_effects: ["computes contractor_quality_score in both the rolling_window and severity_weighted variants; persists neither"]

  # -------------------------------------------------------------- Inspector --
  - method: POST
    path: "/inspectors"
    description: "Register a field inspector. The returned id is the value the FieldInspector role sends as X-User-ID."
    roles: [ProgramAdmin]
    code: 201
    input: [program_id, inspector_name, certification_id, "certification_expires_on?"]
    output: Inspector
    side_effects: ["immutable record: no version field and no update endpoint"]

  - method: GET
    path: "/inspectors/{id}"
    description: "Read one inspector."
    roles: [FieldInspector, ProgramReviewer, ProgramAdmin]
    code: 200
    input: []
    output: Inspector
    side_effects: []

  # ------------------------------------------------------------- Assessment --
  - method: POST
    path: "/assessments"
    description: "Record a pre-installation assessment with its proposed measure list; every proposed measure is evaluated by eligible_measure_qualification and stored as an EligibleMeasure. Supersedes the household's previous live assessment."
    roles: [Contractor, ProgramAdmin]
    code: 201
    input: [household_id, contractor_id, assessed_panel_amps, measures, expected_household_version, "assessment_notes?"]
    output: Assessment
    side_effects: ["creates one immutable EligibleMeasure per entry of measures (each entry is { measure_code, proposed_quantity, estimated_cost_cents })", "runs eligible_measure_qualification and writes effective_panel_amps, qualified_measure_count, estimated_total_incentive_cents", "moves the household's prior PENDING_REVIEW or APPROVED assessment to SUPERSEDED", "increments Household.version by 1"]

  - method: GET
    path: "/assessments/{id}"
    description: "Read one assessment including its propagated effective_panel_amps."
    roles: [Applicant, Contractor, ProgramReviewer, ProgramAdmin]
    code: 200
    input: []
    output: Assessment
    side_effects: []

  - method: GET
    path: "/assessments"
    description: "List assessments filtered by household, contractor or status; the reverse-reachability read for Assessment.household_id and Assessment.contractor_id."
    roles: [Contractor, ProgramReviewer, ProgramAdmin]
    code: 200
    input: ["household_id?", "contractor_id?", "status?", "limit?", "offset?"]
    output: Assessment[]
    side_effects: []

  - method: GET
    path: "/assessments/{id}/eligible-measures"
    description: "List the assessment's eligible-measure evaluations in evaluation_order; the reverse-reachability read for EligibleMeasure.assessment_id."
    roles: [Applicant, Contractor, ProgramReviewer, ProgramAdmin]
    code: 200
    input: ["qualified?", "limit?", "offset?"]
    output: EligibleMeasure[]
    side_effects: []

  - method: POST
    path: "/assessments/{id}/approve"
    description: "Approve or reject an assessment; only an APPROVED assessment can back a rebate project."
    roles: [ProgramReviewer]
    code: 200
    input: [decision, "review_notes?"]
    output: Assessment
    side_effects: ["applies the Assessment transition declared in §1.2", "sets approved_by_user_id", "increments Assessment.version by 1"]

  # ----------------------------------------------------------- RebateProject --
  - method: POST
    path: "/rebate-projects"
    description: "Open a rebate project in DRAFT from an APPROVED assessment and a VERIFIED income verification, pinning every catalog rate onto its ProjectMeasure lines and computing the provisional allocation."
    roles: [Applicant, Contractor, ProgramAdmin]
    code: 201
    input: [household_id, assessment_id, contractor_id, income_verification_id, estimated_project_cost_cents, measures]
    output: RebateProject
    side_effects: ["creates one ProjectMeasure per entry of measures (each entry is { measure_code, planned_quantity, estimated_cost_cents }) with install_status = PLANNED and verification_status = PENDING", "pins pinned_unit_incentive_cents / pinned_measure_cap_cents / pinned_max_quantity / pinned_sort_order / pinned_combined_cap_group / pinned_is_panel_upgrade from the live MeasureCatalogItem", "runs measure_incentive_allocation (provisional variant) and writes provisional_incentive_cents per line plus provisional_total_incentive_cents", "sets status = DRAFT and submission_count = 0"]

  - method: GET
    path: "/rebate-projects/{id}"
    description: "Read one rebate project including both incentive totals and the stacking-adjusted amount."
    roles: [Applicant, Contractor, FieldInspector, ProgramReviewer, ProgramAdmin]
    code: 200
    input: []
    output: RebateProject
    side_effects: []

  - method: GET
    path: "/rebate-projects"
    description: "List rebate projects; the reverse-reachability read for RebateProject.household_id, .assessment_id, .contractor_id and .income_verification_id."
    roles: [ProgramReviewer, ProgramAdmin]
    code: 200
    input: ["household_id?", "assessment_id?", "contractor_id?", "income_verification_id?", "status?", "limit?", "offset?"]
    output: RebateProject[]
    side_effects: []

  - method: GET
    path: "/rebate-projects/{id}/measures"
    description: "List the project's measure lines with their pinned rates and both incentive amounts, ordered by pinned_sort_order ASC then created_at ASC; the reverse-reachability read for ProjectMeasure.project_id."
    roles: [Applicant, Contractor, FieldInspector, ProgramReviewer, ProgramAdmin]
    code: 200
    input: ["install_status?", "verification_status?", "limit?", "offset?"]
    output: ProjectMeasure[]
    side_effects: []

  - method: POST
    path: "/rebate-projects/{id}/submit"
    description: "Submit a DRAFT project, or resubmit one returned INCOMPLETE, optionally replacing the measure set; re-runs the full eligibility, safety, referential and provisional-allocation chain."
    roles: [Applicant, Contractor]
    code: 200
    input: ["measures?", "estimated_project_cost_cents?"]
    output: RebateProject
    side_effects: ["replaces the ProjectMeasure set and re-pins rates when measures is supplied", "re-runs measure_incentive_allocation (provisional variant)", "increments submission_count by 1", "moves status DRAFT|INCOMPLETE -> SUBMITTED", "increments RebateProject.version by 1"]

  - method: POST
    path: "/rebate-projects/{id}/review"
    description: "Record the program review decision on a SUBMITTED project: APPROVE, RETURN_INCOMPLETE (revision loop) or REJECT."
    roles: [ProgramReviewer]
    code: 200
    input: [decision, "incomplete_reason?", "review_notes?"]
    output: RebateProject
    side_effects: ["applies the RebateProject transition declared in §1.2", "sets reviewed_by_user_id to the acting X-User-ID", "decision=REJECT voids every ProjectMeasure", "increments RebateProject.version by 1"]

  - method: GET
    path: "/rebate-projects/{id}/incentive-quote"
    description: "Computed read that replays measure_incentive_allocation over the project's current lines and exposes each cap stage, so the group-cap and household-cap proration are observable without a state change. Each entry of `lines` is { measure_code, raw_incentive_cents, cost_share_cap_cents, capped_line_cents, allocated_cents } in pinned_sort_order ASC then created_at ASC order."
    roles: [Applicant, Contractor, ProgramReviewer, ProgramAdmin]
    code: 200
    input: ["variant?"]
    output: "{ project_id: string, variant: string, lines: object[], group_capped_total_cents: integer, household_cap_limit_cents: integer, total_incentive_cents: integer, group_cap_applied: boolean, household_cap_applied: boolean, residual_cents_assigned_to_measure_code: string }"
    side_effects: ["runs measure_incentive_allocation in the requested variant (default provisional); persists nothing"]

  - method: POST
    path: "/rebate-projects/{id}/reservations"
    description: "Encumber program budget and household cap for an APPROVED project. Requires the program version the caller last observed."
    roles: [ProgramReviewer]
    code: 201
    input: [expected_program_version, "reservation_notes?"]
    output: Reservation
    side_effects: ["creates the Reservation as declared in §1.2 (reserved_amount_cents = project.provisional_total_incentive_cents, expires_at = clock_now + program.reservation_ttl_days days)", "debits Program.budget_available_cents and credits budget_reserved_cents; increments Program.version by 1", "debits Household.lifetime_cap_remaining_cents and credits encumbered_cents; increments Household.version by 1", "moves the project APPROVED -> RESERVED and increments RebateProject.version by 1"]

  - method: GET
    path: "/reservations/{id}"
    description: "Read one reservation including expires_at and extension counters."
    roles: [Applicant, Contractor, ProgramReviewer, ProgramAdmin]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: GET
    path: "/reservations"
    description: "List reservations; the reverse-reachability read for Reservation.project_id and Reservation.program_id."
    roles: [ProgramReviewer, ProgramAdmin]
    code: 200
    input: ["project_id?", "program_id?", "status?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []

  - method: POST
    path: "/reservations/{id}/extensions"
    description: "Extend a live reservation's expires_at, allowed only inside the extension window and within the per-reservation extension and day limits."
    roles: [Applicant, Contractor, ProgramAdmin]
    code: 200
    input: [additional_days, "extension_reason?"]
    output: Reservation
    side_effects: ["runs reservation_extension_expiry", "advances expires_at, increments extension_count by 1 and adds to extension_days_granted", "increments Reservation.version by 1"]

  - method: POST
    path: "/rebate-projects/{id}/installation"
    description: "Report completed installation with per-measure verified quantities and actual costs; enforces the crew-capacity overlap rule and the installed panel capacity."
    roles: [Contractor]
    code: 200
    input: [install_start_date, install_end_date, installed_panel_amps, actual_project_cost_cents, measure_results]
    output: RebateProject
    side_effects: ["runs install_window_capacity", "sets each named ProjectMeasure install_status = INSTALLED with verified_quantity and actual_cost_cents (each measure_results entry is { measure_code, verified_quantity, actual_cost_cents })", "moves status RESERVED -> INSTALLED", "increments RebateProject.version by 1"]

  - method: POST
    path: "/rebate-projects/{id}/stacking-declarations"
    description: "Declare the utility rebate and federal credit the household intends to claim; runs benefit_stacking_limit and supersedes any prior declaration."
    roles: [Applicant, Contractor, ProgramAdmin]
    code: 201
    input: [utility_program_name, utility_rebate_cents, "federal_credit_claimed_cents?"]
    output: StackingDeclaration
    side_effects: ["moves any prior ACTIVE declaration of the project to SUPERSEDED", "runs benefit_stacking_limit and writes computed_state_incentive_before_cents, allowed_state_incentive_cents, allowed_federal_credit_cents, combined_benefit_limit_cents, residual_overage_cents", "writes RebateProject.stacking_adjusted_state_incentive_cents and increments RebateProject.version by 1"]

  - method: GET
    path: "/rebate-projects/{id}/stacking-declarations"
    description: "List the project's stacking declarations, ACTIVE and SUPERSEDED; the reverse-reachability read for StackingDeclaration.project_id."
    roles: [Applicant, Contractor, ProgramReviewer, ProgramAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: StackingDeclaration[]
    side_effects: []

  - method: POST
    path: "/rebate-projects/{id}/remediation"
    description: "Open a remediation cycle on a project that failed post-install inspection, resetting the rejected measure lines so a re-inspection can be scheduled."
    roles: [Contractor]
    code: 200
    input: ["remediation_notes?", "measure_results?"]
    output: RebateProject
    side_effects: ["increments remediation_count by 1", "resets every REJECTED ProjectMeasure to verification_status = PENDING and clears rejection_reason", "moves status INSPECTION_FAILED -> REMEDIATION", "increments RebateProject.version by 1"]

  - method: POST
    path: "/rebate-projects/{id}/payment"
    description: "Disburse a VERIFIED project: reconciles the reservation to the actual disbursement and moves the encumbrance from reserved to committed."
    roles: [ProgramReviewer, ProgramAdmin]
    code: 200
    input: ["payment_reference?"]
    output: RebateProject
    side_effects: ["runs disbursement_reconciliation", "moves the Reservation RESERVED -> COMMITTED and reconciles reserved_amount_cents down to disbursed_amount_cents", "moves Program budget from reserved to committed and credits the difference back to available; increments Program.version by 1", "reconciles Household.encumbered_cents and credits the difference to lifetime_cap_remaining_cents; increments Household.version by 1", "moves status VERIFIED -> PAID and increments RebateProject.version by 1"]

  # -------------------------------------------------------------- Inspection --
  - method: POST
    path: "/inspections"
    description: "Schedule a SPOT or POST_INSTALL inspection window for a project; enforces the inspector travel-buffer conflict rule. Scheduling a POST_INSTALL inspection on a REMEDIATION project returns it to INSTALLED for re-inspection."
    roles: [ProgramReviewer, ProgramAdmin]
    code: 201
    input: [project_id, inspector_id, inspection_type, scheduled_start, scheduled_end]
    output: Inspection
    side_effects: ["runs inspector_window_conflict", "sets status = SCHEDULED and scheduled_by_user_id", "moves a REMEDIATION project back to INSTALLED when inspection_type = POST_INSTALL"]

  - method: GET
    path: "/inspections/{id}"
    description: "Read one inspection including its recorded result and deficiency data."
    roles: [Contractor, FieldInspector, ProgramReviewer, ProgramAdmin]
    code: 200
    input: []
    output: Inspection
    side_effects: []

  - method: GET
    path: "/inspections"
    description: "List inspections; the reverse-reachability read for Inspection.project_id and Inspection.inspector_id."
    roles: [FieldInspector, ProgramReviewer, ProgramAdmin]
    code: 200
    input: ["project_id?", "inspector_id?", "inspection_type?", "status?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []

  - method: POST
    path: "/inspections/{id}/result"
    description: "Record the inspection outcome (PASS, CONDITIONAL_PASS or FAIL). Each branch fires a different side-effect set: verification and final allocation, conditional reduction, the failure cascade, or the post-payment clawback."
    roles: [FieldInspector]
    code: 200
    input: [result, "deficiency_count?", "deficiency_severity_max?", "rejected_measure_codes?", "notes?"]
    output: Inspection
    side_effects: ["applies the Inspection transition declared in §1.2 and the matching RebateProject / ProjectMeasure cascade", "recomputes Contractor.quality_score_rolling and completed_inspection_count, which may suspend the contractor", "on POST_INSTALL PASS/CONDITIONAL_PASS runs measure_incentive_allocation (final variant) and re-runs benefit_stacking_limit", "on SPOT FAIL against a PAID project appends a ClawbackAction and moves the project to CLAWED_BACK", "increments Inspection.version by 1"]

  - method: POST
    path: "/inspections/{id}/cancellation"
    description: "Cancel a scheduled inspection, freeing the inspector's window."
    roles: [ProgramReviewer, ProgramAdmin]
    code: 200
    input: ["cancellation_reason?"]
    output: Inspection
    side_effects: ["moves status SCHEDULED -> CANCELLED", "the cancelled window no longer participates in inspector_window_conflict", "increments Inspection.version by 1"]

  # ---------------------------------------------------------- ClawbackAction --
  - method: GET
    path: "/clawback-actions/{id}"
    description: "Read one clawback action with the recovered amount and the post-action budget and cap balances."
    roles: [ProgramReviewer, ProgramAdmin]
    code: 200
    input: []
    output: ClawbackAction
    side_effects: []

  - method: GET
    path: "/clawback-actions"
    description: "List clawback actions; the reverse-reachability read for ClawbackAction.project_id, .reservation_id and .triggered_by_inspection_id."
    roles: [ProgramReviewer, ProgramAdmin]
    code: 200
    input: ["project_id?", "reservation_id?", "triggered_by_inspection_id?", "reason?", "limit?", "offset?"]
    output: ClawbackAction[]
    side_effects: []

  # -------------------------------------------------------- test-driving API --
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock to an arbitrary UTC instant so reservation expiry, extension windows and the 365-day quality horizon are deterministic. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string, previous_utc: string }"
    side_effects: ["changes no entity; every subsequent clock_now read returns this instant"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- auth / request shape -------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID header missing or empty on any endpoint."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "X-User-Role is absent, unknown, or not listed in the endpoint's roles."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity_backed role acts on a resource belonging to a different Household / Contractor / Inspector than its own id."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting X-User-ID already performed the incompatible prior step: reviewed the project it is now reserving or paying, filed the income verification it is now verifying, or recorded this project's SPOT inspection and is now recording its POST_INSTALL result."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong type, unknown enum value, negative money or quantity, or an end date/datetime earlier than its start."
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside [1, 100] or offset below 0 on a list endpoint."

  # --- existence ------------------------------------------------------------
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "program_id in the path or body matches no Program."
  - id: ERR_MEASURE_CATALOG_ITEM_NOT_FOUND
    http: 404
    condition: "item_id in POST /programs/{id}/measure-catalog-items/{item_id}/retirement matches no catalog item of that program."
  - id: ERR_HOUSEHOLD_NOT_FOUND
    http: 404
    condition: "household_id in the path or body matches no Household."
  - id: ERR_INCOME_VERIFICATION_NOT_FOUND
    http: 404
    condition: "The income verification id in the path or income_verification_id in the body matches no IncomeVerification."
  - id: ERR_CONTRACTOR_NOT_FOUND
    http: 404
    condition: "contractor_id in the path or body matches no Contractor."
  - id: ERR_INSPECTOR_NOT_FOUND
    http: 404
    condition: "inspector_id in the path or body matches no Inspector."
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "assessment_id in the path or body matches no Assessment."
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "The rebate-project id in the path or project_id in the body matches no RebateProject."
  - id: ERR_RESERVATION_NOT_FOUND
    http: 404
    condition: "The reservation id in the path matches no Reservation."
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "The inspection id in the path matches no Inspection."
  - id: ERR_CLAWBACK_ACTION_NOT_FOUND
    http: 404
    condition: "The clawback-action id in the path matches no ClawbackAction."
  - id: ERR_MEASURE_CODE_NOT_IN_CATALOG
    http: 404
    condition: "A measure_code in an assessment or project payload resolves to no MeasureCatalogItem of the enclosing program, including the case where it exists only in another program's catalog."

  # --- state ----------------------------------------------------------------
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "The requested transition is not declared in §1.2 for the entity's current state, including every attempt from a terminal state (PAID, EXPIRED, FAILED_FINAL, CLAWED_BACK, REJECTED, CLOSED, ENROLLMENT_REJECTED, SUPERSEDED)."
  - id: ERR_PROGRAM_NOT_OPEN
    http: 409
    condition: "Program.status is not OPEN when reserving, submitting, installing or paying."
  - id: ERR_ASSESSMENT_NOT_APPROVED
    http: 409
    condition: "The assessment backing a project is not in status APPROVED (still PENDING_REVIEW, or REJECTED / SUPERSEDED)."
  - id: ERR_PROJECT_NOT_APPROVED_FOR_RESERVATION
    http: 409
    condition: "A reservation is requested for a project whose status is not APPROVED."
  - id: ERR_RESERVATION_NOT_ACTIVE
    http: 409
    condition: "The project's reservation is not in status RESERVED when installing, remediating, extending or paying."
  - id: ERR_RESERVATION_EXPIRED
    http: 409
    condition: "clock_now >= reservation.expires_at when installing, remediating or extending, before the sweep has run."
  - id: ERR_INSPECTION_ALREADY_RECORDED
    http: 409
    condition: "A result is recorded on an inspection whose status is no longer SCHEDULED — the idempotency guard on POST /inspections/{id}/result."
  - id: ERR_OPEN_INSPECTION_PENDING
    http: 409
    condition: "A project still has an inspection in status SCHEDULED when scheduling a re-inspection or requesting payment."
  - id: ERR_INCOME_TIER_ALREADY_VERIFIED
    http: 409
    condition: "An income verification is filed or verified for a household that already holds a VERIFIED IncomeVerification."
  - id: ERR_DUPLICATE_MEASURE_CODE
    http: 409
    condition: "A catalog item is created with a measure_code already present in that program's catalog."
  - id: ERR_CONTRACTOR_NOT_ACTIVE
    http: 409
    condition: "The contractor attached to the assessment, project, installation or remediation is not ENROLLED_ACTIVE."
  - id: ERR_CONTRACTOR_CREDENTIAL_EXPIRED
    http: 409
    condition: "The contractor is ENROLLED_ACTIVE but license_expires_on or insurance_expires_on is before the logical clock date."
  - id: ERR_INSPECTOR_WINDOW_CONFLICT
    http: 409
    condition: "The requested inspection window overlaps another live window of the same inspector once the 45-minute travel buffer is applied."
  - id: ERR_CONTRACTOR_CREW_CAPACITY_EXCEEDED
    http: 409
    condition: "The contractor already has crew_capacity install windows overlapping the requested closed date interval."

  # --- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_PROGRAM_VERSION
    http: 412
    condition: "expected_program_version on POST /rebate-projects/{id}/reservations does not equal the program's current version."
  - id: ERR_STALE_HOUSEHOLD_VERSION
    http: 412
    condition: "expected_household_version on POST /assessments does not equal the household's current version."

  # --- business ------------------------------------------------------------
  - id: ERR_PANEL_CAPACITY_INSUFFICIENT
    http: 422
    condition: "A non-panel measure line requires more service amps than the project's effective panel capacity (assessment.effective_panel_amps, or installed_panel_amps at installation)."
  - id: ERR_PANEL_UPGRADE_ANCHOR_MISSING
    http: 422
    condition: "A panel/service-upgrade line is requested without a qualifying appliance anchor line on the same project."
  - id: ERR_PREREQUISITE_MEASURE_MISSING
    http: 422
    condition: "A line whose catalog item declares prerequisite_measure_code has that measure absent or unqualified on the same project."
  - id: ERR_MEASURE_NOT_ELIGIBLE
    http: 422
    condition: "A requested measure_code is not a qualified EligibleMeasure of the linked assessment."
  - id: ERR_DUPLICATE_MEASURE_LINE
    http: 422
    condition: "The same measure_code appears twice in one assessment or project measure list."
  - id: ERR_NO_ELIGIBLE_MEASURES
    http: 422
    condition: "A project is opened or resubmitted with an empty measures array, or an assessment whose qualified_measure_count == 0 is approved or used to open a project."
  - id: ERR_MEASURE_NOT_ON_PROJECT
    http: 422
    condition: "An installation report or inspection result names a measure_code that is not one of the project's ProjectMeasure lines."
  - id: ERR_EXTENSION_WINDOW_NOT_OPEN
    http: 422
    condition: "An extension is requested more than extension_window_days before expires_at, or at/after expires_at."
  - id: ERR_EXTENSION_LIMIT_REACHED
    http: 422
    condition: "extension_count already equals max_extensions_per_reservation."
  - id: ERR_EXTENSION_DAYS_EXCEEDED
    http: 422
    condition: "additional_days exceeds program.max_extension_days."
  - id: ERR_INCOME_TIER_NOT_VERIFIED
    http: 422
    condition: "A project or reservation is requested for a household with no VERIFIED IncomeVerification, so no income_tier or cap exists."
  - id: ERR_HOUSEHOLD_CAP_EXHAUSTED
    http: 422
    condition: "household.lifetime_cap_remaining_cents is 0 when a reservation is requested."
  - id: ERR_STACKING_LIMIT_EXCEEDED
    http: 422
    condition: "The declared utility rebate and federal credit would drive allowed_state_incentive_cents to 0."
  - id: ERR_PROGRAM_BUDGET_EXHAUSTED
    http: 422
    condition: "program.budget_available_cents is less than the amount to be reserved."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - name: Applicant
    description: "The homeowner applying for the rebate. Owns the household record, files income documentation, opens and submits projects, declares stacked benefits and requests reservation extensions."
    identity: "entity_backed:Household"
    exclusive_operations:
      - "POST /households/{id}/income-verifications (shared with ProgramAdmin, but only the Applicant can file for its own household)"
    shared_operations:
      - "POST /households"
      - "POST /rebate-projects"
      - "POST /rebate-projects/{id}/submit"
      - "POST /rebate-projects/{id}/stacking-declarations"
      - "POST /reservations/{id}/extensions"
      - "GET /households/{id}"
      - "GET /households/{id}/income-verifications"
      - "GET /assessments/{id}"
      - "GET /assessments/{id}/eligible-measures"
      - "GET /rebate-projects/{id}"
      - "GET /rebate-projects/{id}/measures"
      - "GET /rebate-projects/{id}/incentive-quote"
      - "GET /rebate-projects/{id}/stacking-declarations"
      - "GET /reservations/{id}"
      - "GET /programs/{id}"
      - "GET /programs/{id}/measure-catalog-items"
      - "GET /contractors/{id}"

  - name: Contractor
    description: "The enrolled installation contractor. Performs pre-installation assessments, may open and submit projects on the household's behalf, reports installation and opens remediation cycles."
    identity: "entity_backed:Contractor"
    exclusive_operations:
      - "POST /assessments"
      - "POST /rebate-projects/{id}/installation"
      - "POST /rebate-projects/{id}/remediation"
    shared_operations:
      - "POST /contractors"
      - "POST /rebate-projects"
      - "POST /rebate-projects/{id}/submit"
      - "POST /rebate-projects/{id}/stacking-declarations"
      - "POST /reservations/{id}/extensions"
      - "GET /contractors/{id}"
      - "GET /contractors/{id}/quality-review"
      - "GET /assessments"
      - "GET /assessments/{id}"
      - "GET /assessments/{id}/eligible-measures"
      - "GET /rebate-projects/{id}"
      - "GET /rebate-projects/{id}/measures"
      - "GET /rebate-projects/{id}/incentive-quote"
