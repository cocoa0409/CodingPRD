      - name: weekly_load_inclusive_cap_boundary
        grounds:
          - calculations.volunteer_weekly_load
          - errors[ERR_WEEKLY_LOAD_EXCEEDED]
        distinguishing_aspect: |
          Metric: volunteer ISO-week assigned minutes (inclusive <= cap) exercised via POST
          call-assignments — third distinct metric and endpoint. With cap 225 and 45-minute slots
          (30 + 15 buffer), the 5th assignment lands exactly at 225 and is ACCEPTED; the 6th at 270
          is rejected. Different from temporal_conflict_beats_capacity_constraint because there the
          load breach is shadowed; here it is the observable winner.
        test_recipe:
          setup:
            - "Program; enrolled participant with MON-FRI 09:00-11:00 schedules; volunteer max_weekly_minutes 225, availability MON-FRI"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AAA", total_capacity: 5, current_policy_version: "v2026.1", max_reserve_slots: 0 }, as: ProgramCoordinator }
