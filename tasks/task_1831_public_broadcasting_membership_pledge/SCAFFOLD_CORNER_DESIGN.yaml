  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_drive_version_on_break_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[break-create-stale-drive]", "errors[ERR_STALE_DRIVE_VERSION]"]
        distinguishing_aspect: "Break creation with a stale expected_drive_version (drive bumped by a prior break creation) is rejected with 412 ERR_STALE_DRIVE_VERSION; the correct current version succeeds."
        test_recipe:
          setup: ["Level BASIC; drive DRV DRAFT; one break already added (drive.version advanced from creation)"]
          setup_api_calls:
            - call: "POST /station/membership-levels"
              payload: { code: "BASIC", min_annual_cents: 6000, min_monthly_sustainer_cents: 500 }
              as: StationAdmin
            - call: "POST /station/pledge-drives"
              payload: { name: "Fall 2026", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-15T00:00:00Z", goal_cents: 100000 }
              as: StationAdmin
              captures: { drv_id: $.data.id, drv_v: $.data.version }
            - call: "POST /station/pledge-drives/${drv_id}/breaks"
              payload: { starts_at: "2026-08-02T18:00:00Z", ends_at: "2026-08-02T18:20:00Z", program_title: "Evening Pledge", pitch_level_code: "BASIC", expected_drive_version: "${drv_v}" }
              as: StationAdmin
          trigger:
            - call: "POST /station/pledge-drives/${drv_id}/breaks"
              payload: { starts_at: "2026-08-02T19:00:00Z", ends_at: "2026-08-02T19:20:00Z", program_title: "Night Pledge", pitch_level_code: "BASIC", expected_drive_version: "${drv_v}" }
              as: StationAdmin
              captures: { err_code: $.data.error_id }
          assert:
            - "${err_code} == ERR_STALE_DRIVE_VERSION (${drv_v} is stale: first break creation bumped drive.version)"
            - "no second break is persisted"

      - name: occ_stale_pledge_version_on_payment
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[payment-post-stale-pledge]", "errors[ERR_STALE_PLEDGE_VERSION]"]
        distinguishing_aspect: "A second payment carrying the pledge's pre-first-payment version is rejected with 412 ERR_STALE_PLEDGE_VERSION — the stale writer's remaining-balance check would otherwise be computed against the wrong baseline."
