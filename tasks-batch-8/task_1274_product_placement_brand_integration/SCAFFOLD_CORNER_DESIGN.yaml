        distinguishing_aspect: "List endpoint without explicit pagination params applies defaults: limit 10, offset 0, with total_count and has_more in the envelope."
        test_recipe:
          setup: ["One series with two episodes"]
          setup_api_calls:
            - { call: "POST /series", payload: { name: "Night Shift", network_name: "NBN", clearance_policy: "STANDARD" }, as: AgencyAdmin, captures: { s_id: $.data.id } }
