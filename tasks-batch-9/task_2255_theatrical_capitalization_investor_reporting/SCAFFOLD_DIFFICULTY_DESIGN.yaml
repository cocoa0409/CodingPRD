- rule_id: transitive_cascade
  applies: true
  rationale: |
    Three write operations in §1.2 carry cascades of depth 4 or more that cross entity
    boundaries: certifying a wrap (wrap -> allocations -> participant cumulative ->
    production recoupment -> investor accounts), settling a closing notice (notice ->
    reserve budget line -> production ledger -> recoupment status -> operating_status
    CLOSED), and accepting a subscription (subscription -> investor account -> production
    capital -> ownership re-proration across every account).
  instances:
  - name: certify_wrap_five_hop_cascade_flips_recoupment_and_investor_basis
    grounds:
    - §1.2 WeeklyWrap SUBMITTED -> CERTIFIED side effects (5-hop cascade)
    - §1.3 royalty_pool_split, recoupment_progress
    - §1.1 RoyaltyParticipant.cumulative_pool_paid_cents
    - §1.1 InvestorAccount.distribution_basis, .recoupment_credited_cents
    - §1.1 Production.recoupment_status, .recouped_amount_cents, .recoupment_pct
    distinguishing_aspect: |
      One certify call must propagate five levels deep. The capitalization target is set
      to exactly 18,362,500 so the single wrap's profit both creates three
      RoyaltyAllocations, advances RP1's cumulative pool paid to 4,394,445, drives
      recouped_amount_cents to 18,362,500 with recoupment_pct 1.0000, flips
      recoupment_status to RECOUPED, and finally flips the InvestorAccount's
      distribution_basis from RECOUPMENT_RETURN to NET_PROFIT with
      recoupment_credited_cents 18,362,500. An implementation that stops at hop 3
      (production ledger) leaves the investor account on RECOUPMENT_RETURN; one that
      stops at hop 2 never flips recoupment_status.
    test_recipe:
