        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[proof-approve-stale-order]
          - errors[ERR_STALE_ORDER_VERSION]
          - entities.Order.fields.version
        distinguishing_aspect: "Two SUBMITTED proofs on one order: approving proof A with expected_order_version 1 succeeds and bumps Order.version to 2; approving proof B still carrying expected_order_version 1 (stale) returns ERR_STALE_ORDER_VERSION (412)."
        test_recipe:
          setup: ["Order with two SUBMITTED proofs A and B; order version read as 1 from create."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Ink Co" }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", name: "Acme", email: "a@x.com" }
