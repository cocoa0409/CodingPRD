      - name: sweep_second_run_idempotent
        claim_type: idempotency
        grounds: ["calculations.late_fee_assessment", "endpoints['POST /api/delinquency-runs']"]
        distinguishing_aspect: "One LATE_FEE per (lease, period): the first sweep at 2026-08-07 assesses 4000; a second sweep at the same clock assesses 0 and creates no duplicate charge."
        test_recipe:
          setup: ["property PA, ACTIVE lease (FLAT 4000, grace 5), RENT 200000 due 2026-08-01 unpaid; clock 2026-08-07"]
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { lease: $.data.id } }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "RENT", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 200000 }, as: LeasingAgent }
            - { call: "POST /api/leases/${lease}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T00:00:00Z" }, as: SystemOps }
          trigger:
            - { call: "POST /api/delinquency-runs", as: SystemOps, captures: { r1: $.data.late_fees_assessed_count } }
            - { call: "POST /api/delinquency-runs", as: SystemOps, captures: { r2: $.data.late_fees_assessed_count } }
            - { call: "GET /api/leases/${lease}/charges", payload: { kind: "LATE_FEE" }, as: PropertyManager }
          assert:
            - "captured r1 == 1 and r2 == 0 (second run is a no-op at an unchanged clock)"
            - "exactly one LATE_FEE charge exists on the lease"

      - name: notice_cured_by_full_payment_before_deadline
        claim_type: valid_transition
        grounds: ["state_machines.DelinquencyNotice.ISSUED_to_CURED", "calculations.plan_installment_evaluation"]
        distinguishing_aspect: "An ISSUED notice whose covered charge is fully paid before the cure deadline flips to CURED at the next sweep (notices_cured_count == 1); the frozen demand stays 204000."
        test_recipe:
          setup: ["property PA, ACTIVE lease, RENT 200000 due 2026-08-01; notice ISSUED 2026-08-01 (deadline 2026-08-11); clock 2026-08-05; payment 200000 posted 2026-08-05"]
