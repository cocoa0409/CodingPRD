            - "the adjacent dispatch (start 2026-09-24T04:00:00Z, exactly the buffered end of the 14-day window plus 4 hours) succeeds with 201"
            - "LoanerSystemDispatch.${first}.reservation_status == PROGRAMMED and LoanerSystemDispatch.${second}.reservation_status == PROGRAMMED"
            - "a third dispatch for LOAN-77 starting 2026-10-08T04:00:00Z minus one minute is rejected with 409 ERR_LOANER_WINDOW_CONFLICT"
            - "a dispatch for a different unit LOAN-88 with an identical window succeeds, proving the resource key is the loaner unit not the system"

      - name: transfer_validity_window_closed_dates_with_three_day_merge_grace
        grounds:
          - calculations.transfer_window_overlap
          - validations[priority=22]
          - validations[priority=37]
          - errors.ERR_TRANSFER_WINDOW_CONFLICT
          - endpoints.POST_/api/utilisation-transfer-transactions
        distinguishing_aspect: "Day-granular, both-endpoints-inclusive window semantics with a merge grace rather than a buffer: a candidate starting the day after an existing window's inclusive end merges into it and is accepted, while one starting the same day is a conflict — the mirror image of the loaner rule's strict half-open arithmetic."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Two accounts in IDN-ZEPHYR: the source with a consumption ledger and maximum_procedure_commitment 12, and the destination."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/accounts"
              payload: { account_name: "Zephyr Group North", idn_group_code: "IDN-ZEPHYR", region_code: "SOUTH", placement_cap: 4, maximum_procedure_commitment: 12 }
              as: RegionalSalesDirector
              captures: { src: $.data.id }
            - call: "POST /api/accounts"
              payload: { account_name: "Zephyr Group South", idn_group_code: "IDN-ZEPHYR", region_code: "SOUTH", placement_cap: 4, maximum_procedure_commitment: 12 }
              as: RegionalSalesDirector
              captures: { dst: $.data.id }
            - call: "POST /api/accounts/${src}/consumption-ledgers"
              payload: { maximum_procedure_commitment: 12 }
              as: IDNCoordinator
              captures: { src_led: $.data.id }
            - call: "POST /api/accounts/${dst}/consumption-ledgers"
              payload: { maximum_procedure_commitment: 12 }
              as: IDNCoordinator
              captures: { dst_led: $.data.id }
            - call: "POST /api/utilisation-transfer-transactions"
              payload: { source_account_id: "${src}", destination_account_id: "${dst}", procedure_units: 5, transfer_window_start_utc: "2026-09-01T00:00:00Z", transfer_window_end_utc: "2026-09-10T00:00:00Z" }
              as: IDNCoordinator
              captures: { first: $.data.id }
          trigger:
            - call: "POST /api/utilisation-transfer-transactions"
              payload: { source_account_id: "${src}", destination_account_id: "${dst}", procedure_units: 4, transfer_window_start_utc: "2026-09-11T00:00:00Z", transfer_window_end_utc: "2026-09-20T00:00:00Z" }
              as: IDNCoordinator
              captures: { second: $.data.id }
          assert:
            - "the candidate starting 2026-09-11T00:00:00Z (the day after the existing inclusive end date 2026-09-10) merges into the existing window and succeeds with 201"
            - "UtilisationTransferTransaction.${second}.transaction_status == COMMITTED"
            - "a third transfer on the same destination with window 2026-09-05T00:00:00Z to 2026-09-08T00:00:00Z is rejected with 409 ERR_TRANSFER_WINDOW_CONFLICT because its closed date range sits inside the existing window"
            - "UtilisationConsumptionLedger.${src_led}.remaining_credit_units == 2 after the first transfer consumed 5 of 12 less the 5 supplied"

  # ===========================================================================
  # Rule 9 — compensating_invariant  (≥2, different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: instrument_lives_conserved_after_case_cancellation
        grounds:
          - calculations.instrument_lives_remaining
          - calculations.accessory_lives_billing
          - entities.RobotSystem.fields.instrument_lives_remaining
          - endpoints.POST_/api/procedure-cases/{caseId}/cancel
        distinguishing_aspect: "Conserved quantity is the accessory set's life count on a RobotSystem: booking a case debits lives and cancelling that same case credits exactly the same number back, so instrument_lives_remaining returns to its pre-booking value with zero drift — a compensating pair, not a one-way decrement."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One account, one configuration with max_instrument_lives 3, one PASSED review, one credentialed surgeon, one PURCHASE agreement, one commissioned system."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/accounts"
              payload: { account_name: "Alder Creek Surgical", idn_group_code: "IDN-ALDERC", region_code: "WEST", placement_cap: 4, maximum_procedure_commitment: 30 }
              as: RegionalSalesDirector
              captures: { acct: $.data.id, acct_v: $.data.version }
            - call: "POST /api/system-configurations"
              payload: { model_code: "DA_V1", base_placement_fee_cents: 4800000, max_instrument_lives: 3, feature_entitlements: [], requires_dark_fiber: false, requires_dedicated_power_circuit: false, integration_tier: 1, min_operating_room_length_cm: 780, min_operating_room_width_cm: 700, min_table_throw_radius_cm: 320, min_ceiling_clearance_cm: 280 }
              as: PlatformAdmin
              captures: { cfg: $.data.id }
            - call: "POST /api/accounts/${acct}/readiness-reviews"
              payload: { site_code: "AC-1", operating_room_length_cm: 900, operating_room_width_cm: 800, table_throw_radius_cm: 400, ceiling_clearance_cm: 300, has_dedicated_power_circuit: true, has_dark_fiber_run: true, evaluated_configuration_id: "${cfg}" }
              as: ClinicalOperationsLead
              captures: { rev: $.data.id, rev_v: $.data.version }
            - call: "POST /api/account-readiness-reviews/${rev}/submit-verdict"
              payload: { verdict: "PASSED", expected_review_version: "${rev_v}" }
              as: ClinicalOperationsLead
            - call: "POST /api/accounts/${acct}/training-records"
              payload: { surgeon_name: "Dr. Alder", simulation_modules_completed: 3, required_proctored_cases: 1 }
              as: ClinicalOperationsLead
              captures: { tr: $.data.id }
            - call: "POST /api/placement-agreements"
              payload: { hospital_account_id: "${acct}", system_configuration_id: "${cfg}", site_readiness_review_id: "${rev}", arrangement_type: "PURCHASE", base_monthly_fee_cents: 200000, minimum_procedures_per_cycle: 0, interval_months: 1, placement_fee_cents: 6000000 }
              as: RegionalSalesDirector
              captures: { agr: $.data.id, agr_v: $.data.version }
            - call: "POST /api/placement-agreements/${agr}/submit"
              payload: { expected_agreement_version: "${agr_v}" }
              as: RegionalSalesDirector
              captures: { agr_v: $.data.version }
            - call: "POST /api/placement-agreements/${agr}/accept"
              payload: { expected_agreement_version: "${agr_v}", expected_hospital_account_version: "${acct_v}" }
              as: HospitalProcurementOfficer
              captures: { sys: $.data.synthesized_system_id, sys_v: $.data.synthesized_system_version }
            - call: "POST /api/robot-systems/${sys}/install"
              payload: { expected_robot_system_version: "${sys_v}" }
              as: ClinicalOperationsLead
              captures: { sys_v: $.data.version }
            - call: "POST /api/robot-systems/${sys}/commission"
              payload: { expected_robot_system_version: "${sys_v}" }
              as: ClinicalOperationsLead
              captures: { sys_v: $.data.version, lives_after_commission: $.data.instrument_lives_remaining }
            - call: "POST /api/robot-systems/${sys}/procedure-cases"
              payload: { training_record_id: "${tr}", procedure_family: "UROLOGY", case_started_at: "2026-09-10T08:00:00Z", duration_minutes: 90, instrument_load: 2, is_emergency: false }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { booked: $.data.id, booked_v: $.data.version }
            - call: "GET /api/robot-systems/${sys}"
              payload: {}
              as: ServiceEngineer
              captures: { lives_after_booking: $.data.instrument_lives_remaining }
          trigger:
            - call: "POST /api/procedure-cases/${booked}/cancel"
              payload: { expected_case_version: "${booked_v}" }
              as: HospitalProcurementOfficer
              as_user_id: "hpo-1"
          assert:
            - "RobotSystem.${sys}.instrument_lives_remaining before booking == 3"
            - "RobotSystem.${sys}.instrument_lives_remaining after booking a load of 2 == 1"
            - "RobotSystem.${sys}.instrument_lives_remaining after cancelling the same case == 3, exactly the pre-booking value"
            - "ProcedureCase.${booked}.case_status == CANCELLED and its released load does not appear in any later SUM of approved load"

      - name: idn_procedure_unit_pool_conserved_after_transfer_reversal
        grounds:
          - calculations.idn_pool_subscription
          - entities.UtilisationConsumptionLedger.fields.remaining_credit_units
          - endpoints.POST_/api/utilisation-transfer-transactions/{transactionId}/reverse
        distinguishing_aspect: "Conserved quantity is the IDN committed-procedure pool across two accounts: reversing a COMMITTED transfer restores both accounts' ledgers and leaves every named quantity (remaining_credit_units on both sides, idn_pool_subscription on both sides) exactly as it was before the transfer — a same-account and cross-account conservation law, not a single ledger balance."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Two accounts in IDN-BOREAL, each with a consumption ledger of maximum_procedure_commitment 30, and one agreement on the destination account with minimum_procedures_per_cycle 4."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/accounts"
              payload: { account_name: "Boreal Health East", idn_group_code: "IDN-BOREAL", region_code: "EAST", placement_cap: 4, maximum_procedure_commitment: 30 }
              as: RegionalSalesDirector
              captures: { src: $.data.id }
            - call: "POST /api/accounts"
              payload: { account_name: "Boreal Health West", idn_group_code: "IDN-BOREAL", region_code: "EAST", placement_cap: 4, maximum_procedure_commitment: 30 }
              as: RegionalSalesDirector
              captures: { dst: $.data.id }
            - call: "POST /api/accounts/${src}/consumption-ledgers"
              payload: { maximum_procedure_commitment: 30 }
              as: IDNCoordinator
              captures: { src_led: $.data.id }
            - call: "POST /api/accounts/${dst}/consumption-ledgers"
              payload: { maximum_procedure_commitment: 30 }
              as: IDNCoordinator
              captures: { dst_led: $.data.id }
            - call: "POST /api/utilisation-transfer-transactions"
              payload: { source_account_id: "${src}", destination_account_id: "${dst}", procedure_units: 6, transfer_window_start_utc: "2026-09-01T00:00:00Z", transfer_window_end_utc: "2026-09-15T00:00:00Z" }
              as: IDNCoordinator
              captures: { txn: $.data.id, txn_v: $.data.version }
          trigger:
            - call: "POST /api/utilisation-transfer-transactions/${txn}/reverse"
              payload: { reversal_reason: "Destination site closed its service line." }
              as: IDNCoordinator
              captures: { txn_v: $.data.version }
          assert:
            - "UtilisationTransferTransaction.${txn}.transaction_status == REVERSED"
            - "UtilisationConsumptionLedger.${src_led}.remaining_credit_units == 30 and supplied_procedure_units == 0"
            - "UtilisationConsumptionLedger.${dst_led}.remaining_credit_units == 30 and consumed_procedure_units == 0"
            - "the sum of both accounts' remaining_credit_units + supplied_procedure_units + consumed_procedure_units is 60 before the transfer, after the transfer, and after the reversal — zero drift"
            - "lift_status(UtilisationConsumptionLedger.${dst_led}) == LIFTED because consumed_procedure_units fell back to 0"