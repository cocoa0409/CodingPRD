            - "trigger 4 responds 200 with status IN_REVIEW: only LicensorRep may start a review, and only the rep named on the agreement"
            - "trigger 5 responds 201 and trigger 8 responds 200: slot design and slot release are ExperienceProducer exclusives"
            - "trigger 6 responds 201: only SafetyOfficer may book an inspection, and the ACCESSIBILITY type is accepted alongside EGRESS, CAPACITY and SENSORY"
            - "trigger 7 responds 201: only GuestServicesAgent may open a guest account"
            - "trigger 9 responds 201 and trigger 11 responds 200: the Guest role has an EMPTY exclusive_operations list, yet it may create and cancel its own order through the shared operations, so an empty exclusive list must not be implemented as no access"
            - "trigger 10 responds 200: price-quote is shared by ExperienceProducer, GuestServicesAgent and Guest"
            - "trigger 12 responds 200: GuestServicesAgent may READ the venue it can never write"
            - "trigger 13 responds 200 with total_count == 1: LicensorRep may read royalty statements it cannot create, which is what makes the licensor's audit right meaningful"

      - name: unauthenticated_and_unauthorized_calls_are_rejected_in_priority_order
        claim_type: role_operations_forbidden
        grounds:
          - roles.Guest
          - roles.LicensorRep
          - roles.ExperienceProducer
          - roles.GuestServicesAgent
          - validations[priority 10]
          - validations[priority 20]
          - validations[priority 90]
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_UNAUTHORIZED
          - errors.ERR_LICENSOR_REP_MISMATCH
          - errors.ERR_GUEST_OWNERSHIP_MISMATCH
        distinguishing_aspect: |
          Three different 4xx families sit on top of each other here and the ORDER decides which one
          the caller sees. A role string that is not declared in §1.7 at all is 401 by P10, not 403 by
          P20, so an implementation that resolves the role to 'unknown' and then asks 'is unknown in
          the endpoint's roles list' returns the wrong status. P20 also outranks P30, so a wrong-role
          call against a path id that does not exist is 403 and NOT 404 - the API must not leak
          whether a resource exists to a caller who has no business on the endpoint. And P90 is
          strictly LAST: the identity gates (rep-on-its-own-agreement, guest-on-its-own-order) only
          fire for a caller whose ROLE was already accepted, which is why a Guest touching another
          guest's order is ERR_GUEST_OWNERSHIP_MISMATCH while a Guest touching the accounts endpoint
          is plain ERR_UNAUTHORIZED.
