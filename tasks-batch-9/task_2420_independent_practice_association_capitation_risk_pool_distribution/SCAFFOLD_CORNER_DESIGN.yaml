          - state_machines.PhysicianMember.ACTIVE_to_NOTICE_GIVEN
        distinguishing_aspect: |
          Giving notice on 2026-03-01 with continuity_of_care_days 90 stamps
          continuity_of_care_until at 2026-05-30T00:00:00Z. A TERMINATED
          transition at 2026-05-29T00:00:00Z must be refused with
          ERR_CONTINUITY_OF_CARE_ACTIVE, and the identical request at exactly
          2026-05-30T00:00:00Z must succeed because the guard is >= on the
          logical clock. An implementation using a strict > on the boundary
          instant, or one that ignores the physician's continuity stamp, diverges
          on one of the two calls.
