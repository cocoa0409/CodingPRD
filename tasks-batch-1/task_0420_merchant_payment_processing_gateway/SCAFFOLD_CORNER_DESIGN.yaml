          - calculations.processing_fee.variants.interchange_plus_fee
        excluded_because:
          difficulty_instance: flat_vs_interchange_plus_fee_on_identical_capture
          rationale: "The §1.8 instance already drives an identical 10000 capture under both FLAT (320) and INTERCHANGE_PLUS (215) plans and asserts the divergence — a corner Variant-Divergence test would duplicate it."

