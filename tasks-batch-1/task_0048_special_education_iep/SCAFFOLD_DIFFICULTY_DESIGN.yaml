          The reevaluation interval is a forward-open 3-year (1095-day) window anchored at the latest
          FINALIZED Evaluation's finalized_at; finalizing on 2026-03-01T09:00:00Z sets
          next_reeval_due_date to 2029-02-28T09:00:00Z (finalized_at + 1095 days; 2028 is a leap
          year so the 1095-day window lands one day before the calendar anniversary) — an
          instant-anchored, forward-extending
          interval on the Student/Evaluation resource.
