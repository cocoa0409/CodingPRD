# =============================================================================
# Task 1259 — Petroleum Jobber & Branded Fuel Supply
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  1259. Petroleum Jobber & Branded Fuel Supply (branded fuel jobber): supply
  agreement & branded volume commitment, rack price & daily posting to dealers,
  transport dispatch & drop planning by tank level, inventory & drive-off/loss
  reconciliation, fuel tax remittance by jurisdiction, image/brand compliance
  obligation for stations, credit terms & EFT draft, contract renewal & buyout

domain_name: petroleum-jobber-branded-fuel
api_prefix: /api

complexity_profile:
  primary_archetype: ledger_reconciliation       # book vs physical inventory, credit exposure vs invoice ledger
  secondary_archetype: pricing_engine            # daily rack postings, tiered freight, buyout formulas
  complexity_layers:
    - cascading_side_effects                     # reconcile -> tank book -> recon variance -> flag -> auto loss event
    - dual_variant_calculation                   # buyout base methods; gross vs temperature-corrected variance
    - rate_threshold_triggers                    # freight tiers, credit WATCH band, renewal fulfillment threshold
    - optimistic_concurrency                     # OCC on agreement amend, posting supersede, drop replan
  entity_topology: flat                          # peer resources joined by FK references, flat /api/<resource> URLs
  state_machine_shape: branching                 # cycles on agreement renewal & drop replan; parallel dims on station
  relationship_patterns:
    - one_to_many
    - cross_aggregate                            # drop -> agreement gate; recon -> loss event gate; draft -> invoice gate
  role_model: segregation_of_duties              # reconciliation resolver must differ from opener; desk/dispatch/credit split
  consistency_model: immediate                   # all mutations + cascades visible in the same request's reads

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# Global conventions referenced throughout:
#   - All money is integer cents (…_cents). All per-gallon prices/rates are integer
#     tenths-of-a-cent per gallon (…_tc_per_gal): 2000 tc = $2.000/gal.
#   - All rounding is round_half_up; multi-component money calculations round each
#     named component to cents BEFORE summing (see calculations[]).
#   - A logical clock governs all date/datetime semantics. It starts at
#     2026-05-01T00:00:00Z and advances only via POST /api/_clock/set_current_utc.
#   - "Current rack price" for (product, terminal) on date D = the POSTED posting
#     with the greatest effective_date <= D; ties broken by latest created_at.

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: product_code, type: string, source: input, description: "Unique product code, e.g. REGULAR_87", constraints: "unique across Products" }
      - { name: display_name, type: string, source: input, description: "Human-readable product name" }
      - { name: category, type: enum, source: input, description: "GASOLINE | DIESEL — drives federal excise and tax-line grouping" }
      - { name: federal_excise_tc_per_gal, type: integer, source: input, description: "Federal excise in tenths-of-a-cent per gallon (gasoline 184, diesel 244)" }
      - { name: temp_coeff, type: number, source: input, description: "Thermal expansion coefficient per degF (gasoline 0.00065, diesel 0.00040)", constraints: "> 0" }

  - name: DealerStation
    parent: null
    common_fields: true
    fields:
      - { name: station_name, type: string, source: input, description: "Station display name" }
      - { name: state_code, type: string, source: input, description: "Two-letter state; tax jurisdiction key" }
      - { name: home_terminal_code, type: string, source: input, description: "Rack terminal code used for price lookup on this station's drops" }
      - { name: state_excise_tc_per_gal, type: integer, source: input, description: "State excise rate in tc/gal for this station's jurisdiction" }
      - { name: local_option_tc_per_gal, type: integer, source: input, default: 0, description: "Local option tax in tc/gal" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum allowed outstanding invoice exposure", constraints: ">= 0" }
      - { name: credit_terms_days, type: integer, source: input, default: 10, description: "Days from invoice_date to due_date", constraints: ">= 1" }
      - { name: current_exposure_cents, type: integer, source: computed, description: "Sum of total_cents over this station's Invoices with status IN {ISSUED, OVERDUE}" }
      - { name: operating_status, type: enum, source: system, description: "ONBOARDING | ACTIVE | SUSPENDED | TERMINATED" }
      - { name: credit_status, type: enum, source: system, description: "GOOD_STANDING | WATCH | HOLD — parallel dimension" }
      - { name: compliance_status, type: enum, source: system, description: "COMPLIANT | CURE_PERIOD | DEFAULT — parallel dimension" }
      - { name: cure_started_at, type: datetime, source: system, description: "Clock instant when CURE_PERIOD began; null otherwise" }

  - name: SupplyAgreement
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> DealerStation.id; the branded dealer" }
      - { name: term_start_date, type: string, source: input, description: "ISO date, inclusive term start" }
      - { name: term_end_date, type: string, source: input, description: "ISO date, inclusive term end; must be > term_start_date" }
      - { name: committed_gallons, type: integer, source: input, description: "Branded volume commitment for the term", constraints: "> 0" }
      - { name: fulfilled_gallons, type: integer, source: computed, description: "Computed on read: sum of delivered_gallons over RECONCILED TransportDrops for this station whose delivery clock-date falls in [term_start_date, term_end_date] inclusive" }
      - { name: imaging_allowance_cents, type: integer, source: input, description: "Brand imaging allowance advanced at signing; basis of UNAMORTIZED_DISCOUNT buyout", constraints: ">= 0" }
      - { name: margin_tc_per_gal, type: integer, source: input, description: "Expected margin in tc/gal; basis of LOST_MARGIN buyout", constraints: ">= 0" }
      - { name: shortfall_penalty_tc_per_gal, type: integer, source: input, description: "Penalty in tc/gal on unfulfilled committed gallons, netted against buyout base", constraints: ">= 0" }
      - { name: buyout_method, type: enum, source: input, description: "UNAMORTIZED_DISCOUNT | LOST_MARGIN — selects buyout base variant" }
      - { name: renewal_count, type: integer, source: system, default: 0, description: "Number of completed renewals" }
      - { name: renewal_credit_cents, type: integer, source: system, default: 0, description: "Volume incentive credit granted at the most recent renewal (0 if none)" }
      - { name: buyout_settlement_cents, type: integer, source: system, description: "Net settlement recorded at execute-buyout; null until BOUGHT_OUT" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RENEWAL_PENDING | DEFAULT_NOTICE | BUYOUT_PENDING | EXPIRED | TERMINATED | BOUGHT_OUT" }

  - name: RackPricePosting
    parent: null
    common_fields: true
    fields:
      - { name: terminal_code, type: string, source: input, description: "Rack terminal code" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: effective_date, type: string, source: input, description: "ISO date the price takes effect; must be >= current clock date at create" }
      - { name: price_tc_per_gal, type: integer, source: input, description: "Rack price in tenths-of-a-cent per gallon", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | POSTED | SUPERSEDED | DISCARDED — at most one POSTED per (terminal_code, product_id, effective_date)" }

  - name: StorageTank
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> DealerStation.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: capacity_gallons, type: integer, source: input, description: "Nameplate capacity", constraints: "> 0" }
      - { name: safe_fill_pct, type: number, source: input, default: 0.95, description: "Maximum allowed fill fraction for drop planning", constraints: "0 < safe_fill_pct <= 1" }
      - { name: opening_physical_gallons, type: integer, source: input, description: "Physical gallons at tank commissioning; seeds both physical and book", constraints: ">= 0" }
      - { name: physical_gallons, type: number, source: system, description: "Latest gauged physical gallons (starts at opening_physical_gallons)" }
      - { name: physical_temp_f, type: number, source: system, description: "Observed temperature of latest gauge; null until first gauge reading" }
      - { name: book_inventory_gallons, type: number, source: computed, description: "opening_physical_gallons + RECONCILED delivered gallons - all metered gallons - gallons of losses in {VERIFIED, WRITTEN_OFF}" }

  - name: Truck
    parent: null
    common_fields: true
    fields:
      - { name: truck_code, type: string, source: input, description: "Unique tractor/trailer code", constraints: "unique across Trucks" }
      - { name: capacity_gallons, type: integer, source: input, description: "Maximum planned gallons per drop", constraints: "> 0" }

  - name: TransportDrop
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> DealerStation.id" }
      - { name: tank_id, type: string, source: input, description: "FK -> StorageTank.id; receiving tank" }
      - { name: truck_id, type: string, source: input, description: "FK -> Truck.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; must equal tank's product" }
      - { name: planned_gallons, type: integer, source: input, description: "Planned drop size", constraints: "> 0" }
      - { name: window_start, type: datetime, source: input, description: "Planned delivery window start (UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Planned delivery window end (UTC); must be > window_start" }
      - { name: delivered_gallons, type: integer, source: system, description: "Actual gallons recorded at deliver; null until DELIVERED" }
      - { name: delivered_at, type: datetime, source: system, description: "Logical clock instant of delivery; null until DELIVERED" }
      - { name: estimated_amount_cents, type: integer, source: computed, description: "Projected invoice total at create/replan using current POSTED price and planned_gallons (fuel+freight+tax components, each rounded)" }
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id; set at deliver, null otherwise" }
      - { name: failure_count, type: integer, source: system, default: 0, description: "Number of EN_ROUTE -> DELIVERY_FAILED transitions" }
      - { name: failure_reason, type: string, source: system, description: "Reason recorded on the most recent fail; null otherwise" }
      - { name: status, type: enum, source: system, description: "PLANNED | SCHEDULED | EN_ROUTE | DELIVERED | DELIVERY_FAILED | RECONCILED | CANCELLED" }

  - name: MeterReading
    parent: null
    common_fields: false
    fields:
      - { name: tank_id, type: string, source: input, description: "FK -> StorageTank.id" }
      - { name: reading_at, type: datetime, source: input, description: "Timestamp the totalizer was read" }
      - { name: totalizer_gallons, type: integer, source: input, description: "Cumulative meter totalizer value", constraints: ">= 0" }
      - { name: metered_gallons, type: integer, source: computed, description: "totalizer_gallons minus chronological predecessor's totalizer for the same tank (0 if first); recomputed on out-of-order insert" }

  - name: LossEvent
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> DealerStation.id" }
      - { name: tank_id, type: string, source: input, description: "FK -> StorageTank.id; optional for station-level events such as DRIVE_OFF" , default: null }
      - { name: reconciliation_id, type: string, source: system, description: "FK -> InventoryReconciliation.id; set only on auto-generated shrinkage events, null otherwise" }
      - { name: loss_type, type: enum, source: input, description: "DRIVE_OFF | SHRINKAGE | SPILL | THEFT" }
      - { name: gallons, type: integer, source: input, description: "Lost gallons", constraints: "> 0" }
      - { name: occurred_at, type: datetime, source: input, description: "When the loss occurred" }
      - { name: auto_generated, type: boolean, source: system, default: false, description: "True when created by a reconciliation variance flag" }
      - { name: status, type: enum, source: system, description: "REPORTED | VERIFIED | DISPUTED | WRITTEN_OFF | VOIDED" }

  - name: InventoryReconciliation
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> DealerStation.id" }
      - { name: period_start, type: string, source: input, description: "ISO date, inclusive" }
      - { name: period_end, type: string, source: input, description: "ISO date, inclusive; must be >= period_start" }
      - { name: threshold_gallons, type: integer, source: input, default: 130, description: "Absolute net variance that flags the reconciliation", constraints: "> 0" }
      - { name: book_gallons, type: number, source: computed, description: "Sum of book_inventory_gallons over the station's tanks at last recompute" }
      - { name: physical_gross_gallons, type: number, source: computed, description: "Sum of physical_gallons over the station's tanks at last recompute" }
      - { name: variance_gross_gallons, type: number, source: computed, description: "physical_gross_gallons - book_gallons" }
      - { name: variance_net_gallons, type: number, source: computed, description: "Sum over tanks of round_half_up(physical_gallons * (1 + temp_coeff * (physical_temp_f - 60))) minus book_gallons; tanks never gauged use temp 60" }
      - { name: status, type: enum, source: system, description: "OPEN | VARIANCE_FLAGGED | RESOLVED — auto-flips OPEN<->VARIANCE_FLAGGED on recompute vs threshold_gallons (flag when abs(variance_net_gallons) > threshold)" }
      - { name: opener_user_id, type: string, source: system, description: "X-User-ID of the creator; resolver must differ (segregation of duties)" }
      - { name: resolver_user_id, type: string, source: system, description: "X-User-ID of resolver; null until RESOLVED" }
      - { name: resolution_note, type: string, source: system, description: "Note recorded at resolve; null until RESOLVED" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: system, description: "FK -> DealerStation.id" }
      - { name: drop_id, type: string, source: system, description: "FK -> TransportDrop.id; one invoice per drop" }
      - { name: product_id, type: string, source: system, description: "FK -> Product.id" }
      - { name: gallons_delivered, type: integer, source: system, description: "Delivered gallons billed" }
      - { name: price_tc_per_gal, type: integer, source: system, description: "POSTED rack price applied (max effective_date <= delivery date, tie-break latest created_at)" }
      - { name: fuel_amount_cents, type: integer, source: computed, description: "round_half_up(gallons_delivered * price_tc_per_gal / 10)" }
      - { name: freight_amount_cents, type: integer, source: computed, description: "Tiered freight: <=2000 gal flat 15000; 2001-6000 -> 40 tc/gal on all gallons; >6000 -> 32 tc/gal on all gallons; per-gallon tiers rounded half-up" }
      - { name: tax_amount_cents, type: integer, source: computed, description: "round_half_up(gallons_delivered * (federal + state_excise + local_option) tc / 10)" }
      - { name: total_cents, type: integer, source: computed, description: "fuel_amount_cents + freight_amount_cents + tax_amount_cents (components pre-rounded)" }
      - { name: invoice_date, type: string, source: system, description: "Logical clock date at delivery" }
      - { name: due_date, type: string, source: computed, description: "invoice_date + station.credit_terms_days" }
      - { name: status, type: enum, source: system, description: "ISSUED | OVERDUE | PAID | VOID" }

  - name: EFTDraft
    parent: null
    common_fields: true
    fields:
      - { name: invoice_id, type: string, source: input, description: "FK -> Invoice.id" }
      - { name: station_id, type: string, source: system, description: "FK -> DealerStation.id; copied from invoice" }
      - { name: scheduled_date, type: string, source: input, description: "ISO date the draft may execute" }
      - { name: amount_cents, type: integer, source: system, description: "Invoice total_cents at schedule time" }
      - { name: attempts, type: integer, source: system, default: 0, description: "Number of execute calls that reached a terminal draft outcome" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | SETTLED | FAILED | CANCELLED" }

  - name: TaxRemittance
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "Jurisdiction (state) being remitted" }
      - { name: period_start, type: string, source: input, description: "ISO date, inclusive" }
      - { name: period_end, type: string, source: input, description: "ISO date, inclusive; must be >= period_start" }
      - { name: due_date, type: string, source: computed, description: "period_end + 20 days" }
      - { name: gasoline_gallons, type: integer, source: computed, description: "Sum of gallons_delivered over included invoices whose product category is GASOLINE" }
      - { name: diesel_gallons, type: integer, source: computed, description: "Sum of gallons_delivered over included invoices whose product category is DIESEL" }
      - { name: tax_amount_cents, type: integer, source: computed, description: "Per category line: round_half_up(line_gallons * station state_excise tc / 10); total = sum of rounded lines (rounding order pinned: per-line then sum)" }
      - { name: late_penalty_cents, type: integer, source: computed, description: "round_half_up(0.05 * tax_amount_cents) when filed with clock date > due_date, else 0" }
      - { name: total_due_cents, type: integer, source: computed, description: "tax_amount_cents + late_penalty_cents" }
      - { name: filed_at, type: datetime, source: system, description: "Clock instant of filing; null until FILED" }
      - { name: status, type: enum, source: system, description: "ACCRUING | FILED | PAID" }

  - name: BrandComplianceAudit
    parent: null
    common_fields: false
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> DealerStation.id" }
      - { name: audit_date, type: string, source: input, description: "ISO date of the inspection" }
      - { name: score, type: integer, source: input, description: "Image/brand score 0-100", constraints: "0 <= score <= 100" }
      - { name: deficiencies, type: array, source: input, description: "List of deficiency codes; may be empty" , default: [] }
      - { name: result, type: enum, source: computed, description: "PASS when score >= 70 else FAIL" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: DealerStation
    note: "Three parallel dimensions: operating_status, credit_status, compliance_status evolve independently on one row."
    initial_state: "operating_status=ONBOARDING, credit_status=GOOD_STANDING, compliance_status=COMPLIANT"
    terminal_states: ["operating_status=TERMINATED", "compliance_status=DEFAULT"]
    transitions:
      - from: operating_status=ONBOARDING
        to: operating_status=ACTIVE
        trigger: POST /api/dealer-stations/{id}/activate
        actor: JobberAdmin
        preconditions: ["operating_status == ONBOARDING (ERR_INVALID_STATE)"]
        side_effects: []
      - from: operating_status=ACTIVE
        to: operating_status=SUSPENDED
        trigger: POST /api/dealer-stations/{id}/suspend
        actor: JobberAdmin
        preconditions: ["operating_status == ACTIVE (ERR_INVALID_STATE)"]
        side_effects: []
      - from: operating_status=SUSPENDED
        to: operating_status=ACTIVE
        trigger: POST /api/dealer-stations/{id}/reactivate
        actor: JobberAdmin
        preconditions: ["operating_status == SUSPENDED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: operating_status=ACTIVE
        to: operating_status=TERMINATED
        trigger: POST /api/dealer-stations/{id}/terminate
        actor: JobberAdmin
        preconditions:
          - "operating_status IN {ACTIVE, SUSPENDED} (ERR_INVALID_STATE)"
          - "No SupplyAgreement for this station in {DRAFT, ACTIVE, RENEWAL_PENDING, DEFAULT_NOTICE, BUYOUT_PENDING} (ERR_INVALID_STATE)"
        side_effects: []
      - from: operating_status=SUSPENDED
        to: operating_status=TERMINATED
        trigger: POST /api/dealer-stations/{id}/terminate
        actor: JobberAdmin
        preconditions: ["same as ACTIVE -> TERMINATED"]
        side_effects: []
      - from: credit_status=GOOD_STANDING
        to: credit_status=WATCH
        trigger: "system (on current_exposure_cents recompute: invoice create/void, draft settle)"
        actor: system
        preconditions: ["current_exposure_cents >= 0.8 * credit_limit_cents (boundary inclusive)"]
        side_effects: []
      - from: credit_status=WATCH
        to: credit_status=GOOD_STANDING
        trigger: "system (on current_exposure_cents recompute)"
        actor: system
        preconditions: ["current_exposure_cents < 0.8 * credit_limit_cents"]
        side_effects: []
      - from: credit_status=GOOD_STANDING
        to: credit_status=HOLD
        trigger: "system (EFTDraft execute with outcome FAILED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: credit_status=WATCH
        to: credit_status=HOLD
        trigger: "system (EFTDraft execute with outcome FAILED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: credit_status=HOLD
        to: credit_status=GOOD_STANDING
        trigger: POST /api/dealer-stations/{id}/restore-credit
        actor: CreditManager
        preconditions: ["credit_status == HOLD (ERR_INVALID_STATE)"]
        side_effects: ["credit band re-evaluated from current_exposure_cents (may land on WATCH instead when exposure >= 80% of limit — applied as GOOD_STANDING only when exposure < 80%, else stays WATCH)"]
        note: "restore-credit lands on GOOD_STANDING if exposure < 80% of limit, otherwise WATCH."
      - from: compliance_status=COMPLIANT
        to: compliance_status=CURE_PERIOD
        trigger: "system (POST /api/brand-compliance-audits with result FAIL)"
        actor: system
        preconditions: []
        side_effects:
          - "cure_started_at = current logical clock instant"
      - from: compliance_status=CURE_PERIOD
        to: compliance_status=COMPLIANT
        trigger: "system (POST /api/brand-compliance-audits with result PASS)"
        actor: system
        preconditions: []
        side_effects: ["cure_started_at = null"]
      - from: compliance_status=CURE_PERIOD
        to: compliance_status=DEFAULT
        trigger: "system (POST /api/brand-compliance-audits with result FAIL while in CURE_PERIOD, OR logical clock advancing past cure_started_at + 30 days)"
        actor: system
        preconditions: []
        side_effects:
          - "Every SupplyAgreement of this station in status ACTIVE -> DEFAULT_NOTICE (cross-entity cascade hop)"
          - "cure_started_at = null"

  - entity: SupplyAgreement
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED, BOUGHT_OUT]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: POST /api/supply-agreements/{id}/activate
        actor: JobberAdmin
        preconditions:
          - "status == DRAFT (ERR_INVALID_STATE)"
          - "station operating_status == ACTIVE (ERR_STATION_NOT_ACTIVE)"
        side_effects: []
      - from: ACTIVE
        to: RENEWAL_PENDING
        trigger: POST /api/supply-agreements/{id}/start-renewal
        actor: JobberAdmin
        preconditions:
          - "status == ACTIVE (ERR_INVALID_STATE)"
          - "current clock date within [term_end_date - 90 days, term_end_date] inclusive (ERR_RENEWAL_WINDOW_NOT_OPEN)"
        side_effects: []
      - from: RENEWAL_PENDING
        to: ACTIVE
        trigger: POST /api/supply-agreements/{id}/renew
        actor: JobberAdmin
        preconditions:
          - "status == RENEWAL_PENDING (ERR_INVALID_STATE)"
          - "station compliance_status == COMPLIANT (ERR_CURE_PERIOD_ACTIVE)"
          - "No Invoice for this station with status OVERDUE (ERR_OVERDUE_INVOICES_EXIST)"
        side_effects:
          - "term_start_date/term_end_date replaced by payload new term; committed_gallons replaced when new_committed_gallons supplied"
          - "fulfillment evaluation: pct = 100 * fulfilled_gallons / committed_gallons over the ENDING term; when pct >= 95.00 set renewal_credit_cents = round_half_up(0.01 * imaging_allowance_cents), else 0"
          - "renewal_count += 1"
      - from: ACTIVE
        to: DEFAULT_NOTICE
        trigger: "system (cascade from station compliance_status -> DEFAULT)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DEFAULT_NOTICE
        to: TERMINATED
        trigger: POST /api/supply-agreements/{id}/terminate
        actor: JobberAdmin
        preconditions:
          - "status == DEFAULT_NOTICE (ERR_INVALID_STATE)"
          - "No TransportDrop for this station in {PLANNED, SCHEDULED, EN_ROUTE} (ERR_AGREEMENT_HAS_OPEN_DROPS)"
        side_effects: []
      - from: ACTIVE
        to: BUYOUT_PENDING
        trigger: POST /api/supply-agreements/{id}/initiate-buyout
        actor: JobberAdmin
        preconditions:
          - "status == ACTIVE (ERR_INVALID_STATE)"
          - "station operating_status == ACTIVE (ERR_STATION_NOT_ACTIVE)"
        side_effects: []
      - from: BUYOUT_PENDING
        to: BOUGHT_OUT
        trigger: POST /api/supply-agreements/{id}/execute-buyout
        actor: JobberAdmin
        preconditions: ["status == BUYOUT_PENDING (ERR_INVALID_STATE)"]
        side_effects:
          - "compute buyout base per buyout_method variant (calculations.buyout_base_cents), then net settlement (calculations.buyout_net_settlement_cents)"
          - "buyout_settlement_cents = net settlement"
      - from: BUYOUT_PENDING
        to: ACTIVE
        trigger: POST /api/supply-agreements/{id}/cancel-buyout
        actor: JobberAdmin
        preconditions: ["status == BUYOUT_PENDING (ERR_INVALID_STATE)"]
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (logical clock advances past term_end_date)"
        actor: system
        preconditions: ["current clock date > term_end_date"]
        side_effects: []
      - from: RENEWAL_PENDING
        to: EXPIRED
        trigger: "system (logical clock advances past term_end_date)"
        actor: system
        preconditions: ["current clock date > term_end_date"]
        side_effects: []

  - entity: RackPricePosting
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, DISCARDED]
    transitions:
      - from: DRAFT
        to: POSTED
        trigger: POST /api/rack-price-postings/{id}/post
        actor: PricingDesk
        preconditions:
          - "status == DRAFT (ERR_INVALID_STATE)"
          - "No other POSTED posting for the same (terminal_code, product_id, effective_date) (ERR_PRICE_POSTING_CONFLICT — use supersede instead)"
        side_effects: []
      - from: POSTED
        to: SUPERSEDED
        trigger: POST /api/rack-price-postings/{id}/supersede
        actor: PricingDesk
        preconditions:
          - "status == POSTED (ERR_INVALID_STATE)"
          - "expected_superseded_posting_version == current version (ERR_STALE_VERSION)"
          - "payload effective_date == this posting's effective_date (ERR_VALIDATION_FAILED)"
        side_effects:
          - "A new RackPricePosting is created with status POSTED, same (terminal_code, product_id, effective_date), price_tc_per_gal = payload new_price_tc_per_gal"
          - "This posting's version increments by 1"
      - from: DRAFT
        to: DISCARDED
        trigger: POST /api/rack-price-postings/{id}/discard
        actor: PricingDesk
        preconditions: ["status == DRAFT (ERR_INVALID_STATE)"]
        side_effects: []

  - entity: TransportDrop
    initial_state: PLANNED
    terminal_states: [RECONCILED, CANCELLED]
    transitions:
      - from: PLANNED
        to: SCHEDULED
        trigger: POST /api/transport-drops/{id}/schedule
        actor: Dispatcher
        preconditions: ["status == PLANNED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: SCHEDULED
        to: EN_ROUTE
        trigger: POST /api/transport-drops/{id}/dispatch
        actor: Dispatcher
        preconditions: ["status == SCHEDULED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: EN_ROUTE
        to: DELIVERED
        trigger: POST /api/transport-drops/{id}/deliver
        actor: Dispatcher
        preconditions: ["status == EN_ROUTE (ERR_INVALID_STATE)"]
        side_effects:
          - "delivered_gallons = payload; delivered_at = current logical clock"
          - "Invoice created (status ISSUED, invoice_date = clock date) priced via calculations.invoice_total_cents using the POSTED posting for (product, station.home_terminal_code) with max effective_date <= delivery date, tie-break latest created_at (none -> ERR_PRICE_NOT_POSTED)"
          - "invoice_id set on this drop"
          - "station.current_exposure_cents recomputed (adds the new invoice)"
          - "station credit band re-evaluated (GOOD_STANDING<->WATCH)"
      - from: EN_ROUTE
        to: DELIVERY_FAILED
        trigger: POST /api/transport-drops/{id}/fail
        actor: Dispatcher
        preconditions: ["status == EN_ROUTE (ERR_INVALID_STATE)"]
        side_effects:
          - "failure_count += 1; failure_reason = payload reason"
      - from: DELIVERY_FAILED
        to: PLANNED
        trigger: POST /api/transport-drops/{id}/replan
        actor: Dispatcher
        preconditions:
          - "status == DELIVERY_FAILED (ERR_INVALID_STATE)"
          - "expected_drop_version == current version (ERR_STALE_VERSION)"
          - "new window/truck re-validated: truck capacity, truck half-open window conflict, tank settle buffer, safe fill (same error ids as create)"
        side_effects:
          - "window_start/window_end/truck_id replaced"
          - "estimated_amount_cents recomputed against current POSTED price"
          - "version increments by 1"
      - from: DELIVERED
        to: RECONCILED
        trigger: POST /api/transport-drops/{id}/reconcile
        actor: Dispatcher
        preconditions: ["status == DELIVERED (ERR_INVALID_STATE)"]
        side_effects:
          - "tank.book_inventory_gallons recomputed (adds delivered_gallons) — cascade hop 1"
          - "Any InventoryReconciliation for this station in {OPEN, VARIANCE_FLAGGED} recomputes book/physical/variance fields — cascade hop 2"
          - "That reconciliation flips OPEN -> VARIANCE_FLAGGED when abs(variance_net_gallons) > threshold_gallons (or back when within) — cascade hop 3"
          - "On transition INTO VARIANCE_FLAGGED an auto LossEvent (loss_type SHRINKAGE, gallons = abs(round(variance_net_gallons)), status REPORTED, auto_generated = true, reconciliation_id set) is created — cascade hop 4"
      - from: PLANNED
        to: CANCELLED
        trigger: POST /api/transport-drops/{id}/cancel
        actor: Dispatcher
        preconditions: ["status IN {PLANNED, SCHEDULED} (ERR_INVALID_STATE)"]
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: POST /api/transport-drops/{id}/cancel
        actor: Dispatcher
        preconditions: ["status IN {PLANNED, SCHEDULED} (ERR_INVALID_STATE)"]
        side_effects: []

  - entity: LossEvent
    initial_state: REPORTED
    terminal_states: [WRITTEN_OFF, VOIDED]
    transitions:
      - from: REPORTED
        to: VERIFIED
        trigger: POST /api/loss-events/{id}/verify
        actor: JobberAdmin
        preconditions: ["status IN {REPORTED, DISPUTED} (ERR_INVALID_STATE)"]
        side_effects: ["tank.book_inventory_gallons recomputed (deducts gallons) when tank_id present; owning station's open reconciliation recomputes (same cascade as drop reconcile hops 2-4)"]
      - from: DISPUTED
        to: VERIFIED
        trigger: POST /api/loss-events/{id}/verify
        actor: JobberAdmin
        preconditions: ["status IN {REPORTED, DISPUTED} (ERR_INVALID_STATE)"]
        side_effects: ["same as REPORTED -> VERIFIED"]
      - from: REPORTED
        to: DISPUTED
        trigger: POST /api/loss-events/{id}/dispute
        actor: DealerOperator
        preconditions:
          - "status == REPORTED (ERR_INVALID_STATE)"
          - "acting DealerOperator owns the event's station (ERR_STATION_OWNERSHIP_MISMATCH)"
        side_effects: []
      - from: VERIFIED
        to: WRITTEN_OFF
        trigger: POST /api/loss-events/{id}/write-off
        actor: JobberAdmin
        preconditions: ["status == VERIFIED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: VERIFIED
        to: VOIDED
        trigger: POST /api/loss-events/{id}/void
        actor: JobberAdmin
        preconditions: ["status == VERIFIED (ERR_INVALID_STATE)"]
        side_effects: ["tank.book_inventory_gallons recomputed (restores gallons) — compensating action for verify; open reconciliation recomputes"]

  - entity: InventoryReconciliation
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: VARIANCE_FLAGGED
        trigger: "system (recompute after drop reconcile, loss verify/void, gauge reading, or meter reading: abs(variance_net_gallons) > threshold_gallons)"
        actor: system
        preconditions: []
        side_effects: ["auto LossEvent (SHRINKAGE, REPORTED, auto_generated, reconciliation_id set, gallons = abs(round(variance_net_gallons))) created"]
      - from: VARIANCE_FLAGGED
        to: OPEN
        trigger: "system (recompute: abs(variance_net_gallons) <= threshold_gallons)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: RESOLVED
        trigger: POST /api/inventory-reconciliations/{id}/resolve
        actor: JobberAdmin
        preconditions:
          - "status IN {OPEN, VARIANCE_FLAGGED} (ERR_INVALID_STATE)"
          - "resolver X-User-ID != opener_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "Every LossEvent with reconciliation_id == this id has status IN {WRITTEN_OFF, VOIDED} (ERR_LINKED_LOSS_NOT_WRITTEN_OFF)"
        side_effects: ["resolver_user_id = acting X-User-ID; resolution_note = payload"]
      - from: VARIANCE_FLAGGED
        to: RESOLVED
        trigger: POST /api/inventory-reconciliations/{id}/resolve
        actor: JobberAdmin
        preconditions: ["same as OPEN -> RESOLVED"]
        side_effects: ["resolver_user_id = acting X-User-ID; resolution_note = payload"]

  - entity: Invoice
    initial_state: ISSUED
    terminal_states: [PAID, VOID]
    transitions:
      - from: ISSUED
        to: OVERDUE
        trigger: "system (logical clock advances past due_date)"
        actor: system
        preconditions: ["current clock date > due_date"]
        side_effects: []
      - from: ISSUED
        to: PAID
        trigger: "system (EFTDraft execute with outcome SUCCEEDED)"
        actor: system
        preconditions: []
        side_effects:
          - "station.current_exposure_cents recomputed (removes this invoice)"
          - "station credit band re-evaluated"
      - from: OVERDUE
        to: PAID
        trigger: "system (EFTDraft execute with outcome SUCCEEDED)"
        actor: system
        preconditions: []
        side_effects: ["same as ISSUED -> PAID"]
      - from: ISSUED
        to: VOID
        trigger: POST /api/invoices/{id}/void
        actor: CreditManager
        preconditions: ["status IN {ISSUED, OVERDUE} (ERR_INVALID_STATE)"]
        side_effects:
          - "station.current_exposure_cents recomputed (removes this invoice) — compensating action for invoice issuance"
          - "station credit band re-evaluated"
          - "Any EFTDraft for this invoice in SCHEDULED -> CANCELLED"
      - from: OVERDUE
        to: VOID
        trigger: POST /api/invoices/{id}/void
        actor: CreditManager
        preconditions: ["status IN {ISSUED, OVERDUE} (ERR_INVALID_STATE)"]
        side_effects: ["same as ISSUED -> VOID"]

  - entity: EFTDraft
    initial_state: SCHEDULED
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: SETTLED
        trigger: POST /api/eft-drafts/{id}/execute with outcome SUCCEEDED
        actor: CreditManager
        preconditions:
          - "status == SCHEDULED (ERR_INVALID_STATE)"
          - "current clock date >= scheduled_date (ERR_DRAFT_NOT_EXECUTABLE)"
        side_effects:
          - "attempts += 1"
          - "Invoice -> PAID; station.current_exposure_cents recomputed; credit band re-evaluated"
      - from: SCHEDULED
        to: FAILED
        trigger: POST /api/eft-drafts/{id}/execute with outcome FAILED
        actor: CreditManager
        preconditions: ["same as SCHEDULED -> SETTLED"]
        side_effects:
          - "attempts += 1"
          - "Invoice remains ISSUED/OVERDUE (exposure unchanged)"
          - "station credit_status -> HOLD"
      - from: FAILED
        to: SCHEDULED
        trigger: POST /api/eft-drafts/{id}/retry
        actor: CreditManager
        preconditions: ["status == FAILED (ERR_INVALID_STATE)"]
        side_effects: ["scheduled_date = payload scheduled_date"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/eft-drafts/{id}/cancel, or system (invoice voided)"
        actor: CreditManager
        preconditions: ["status == SCHEDULED (ERR_INVALID_STATE)"]
        side_effects: []

  - entity: TaxRemittance
    initial_state: ACCRUING
    terminal_states: [PAID]
    transitions:
      - from: ACCRUING
        to: FILED
        trigger: POST /api/tax-remittances/{id}/file
        actor: TaxAccountant
        preconditions: ["status == ACCRUING (ERR_INVALID_STATE)"]
        side_effects:
          - "compute calculations.tax_remittance_amount (gallons by category, per-line rounded tax, late penalty vs due_date)"
          - "filed_at = current logical clock"
      - from: FILED
        to: PAID
        trigger: POST /api/tax-remittances/{id}/pay
        actor: TaxAccountant
        preconditions: ["status == FILED (ERR_INVALID_STATE)"]
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: agreement-amend-stale-version
    parent_entity: SupplyAgreement
    write_endpoint: "PATCH /api/supply-agreements/{id}"
    occ_field: expected_agreement_version
    description: |
      Amending a SupplyAgreement whose version has advanced since the client
      last observed it is rejected. The client's terms are derived from a stale
      snapshot of the agreement and would silently overwrite the intervening
      amendment.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: posting-supersede-stale-version
    parent_entity: RackPricePosting
    write_endpoint: "POST /api/rack-price-postings/{id}/supersede"
    occ_field: expected_superseded_posting_version
    description: |
      Superseding a POSTED posting whose version has advanced since the client
      last observed it is rejected. Supersede creates a replacement posting for
      the same (terminal, product, effective_date); a stale base version means
      the client is superseding a posting it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: drop-replan-stale-version
    parent_entity: TransportDrop
    write_endpoint: "POST /api/transport-drops/{id}/replan"
    occ_field: expected_drop_version
    description: |
      Replanning a failed drop whose version has advanced since the client last
      observed it is rejected. The replan writes a fresh window and truck against
      a drop the client may no longer recognize (e.g. another dispatcher has
      already replanned it and it has since been re-failed).
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: invoice_total_cents
    trigger: "TransportDrop deliver (creates Invoice); TransportDrop create/replan (estimated_amount_cents with planned_gallons and current POSTED price)"
    algorithm: tiered_pricing
    formula: |
      price_tc = POSTED posting for (drop.product_id, station.home_terminal_code)
                 with max effective_date <= relevant date, tie-break latest created_at.
                 (delivery date for invoices; current clock date for estimates)
      fuel_amount_cents    = round_half_up(gallons * price_tc / 10)
      freight_amount_cents = 15000                                    when gallons <= 2000
                           = round_half_up(gallons * 40 / 10)         when 2001 <= gallons <= 6000
                           = round_half_up(gallons * 32 / 10)         when gallons > 6000
      tax_amount_cents     = round_half_up(gallons *
                               (product.federal_excise_tc_per_gal
                                + station.state_excise_tc_per_gal
                                + station.local_option_tc_per_gal) / 10)
      total_cents = fuel_amount_cents + freight_amount_cents + tax_amount_cents
      Each of the three components is rounded to integer cents BEFORE the sum.
    input_set: "the delivered (or planned) gallons, the resolved POSTED posting, the product's federal excise, the station's state/local rates; diesel vs gasoline branch enters via product.federal_excise_tc_per_gal"
    constants:
      FREIGHT_FLAT_MAX_GALLONS: 2000
      FREIGHT_FLAT_CENTS: 15000
      FREIGHT_MID_MAX_GALLONS: 6000
      FREIGHT_MID_TC_PER_GAL: 40
      FREIGHT_HIGH_TC_PER_GAL: 32
    precision: "integer cents, round_half_up per component, then sum"

  - name: tax_remittance_amount
    trigger: "TaxRemittance file"
    algorithm: aggregation
    formula: |
      included invoices = Invoice where station.state_code == remittance.state_code
        AND invoice.status IN {ISSUED, OVERDUE, PAID}   -- VOID excluded
        AND period_start <= invoice.invoice_date <= period_end (inclusive both ends)
      for each category in {GASOLINE, DIESEL}:
        line_gallons = sum(gallons_delivered over included invoices of that category)
        line_cents   = round_half_up(line_gallons * state_excise_tc_per_gal / 10)
      -- rounding order is pinned: round each category line, THEN sum
      tax_amount_cents = line_cents(GASOLINE) + line_cents(DIESEL)
      late_penalty_cents = round_half_up(0.05 * tax_amount_cents)
                           when clock date at file > due_date else 0
      total_due_cents = tax_amount_cents + late_penalty_cents
    input_set: "invoices filtered by station jurisdiction, status set, and inclusive date window"
    constants:
      LATE_PENALTY_RATE: 0.05
      DUE_DATE_LAG_DAYS: 20
    precision: "integer cents, round_half_up; per-line rounding BEFORE summing (sum-then-round is a different, incorrect result)"

  - name: buyout_base_cents
    trigger: "SupplyAgreement buyout-quote and execute-buyout"
    algorithm: forward_looking
    formula: |
      total_days     = (term_end_date - term_start_date).days
      remaining_days = max(0, (term_end_date - current clock date).days)
      unfulfilled    = max(0, committed_gallons - fulfilled_gallons)
      variant UNAMORTIZED_DISCOUNT:
        base = round_half_up(imaging_allowance_cents * remaining_days / total_days)
      variant LOST_MARGIN:
        base = round_half_up(unfulfilled * margin_tc_per_gal / 10)
    input_set: "agreement terms, logical clock date, fulfilled_gallons (RECONCILED drops in term)"
    precision: "integer cents, round_half_up"
    variants:
      - name: unamortized_discount
        when: "buyout_method == UNAMORTIZED_DISCOUNT"
        difference: "base is the pro-rata unearned imaging allowance; ignores volume performance"
      - name: lost_margin
        when: "buyout_method == LOST_MARGIN"
        difference: "base is expected margin on unfulfilled committed gallons; ignores allowance and calendar"
    note: "buyout-quote returns both the method-selected base_cents and alternate_base_cents (the other variant) so the divergence is observable on one agreement"

  - name: buyout_net_settlement_cents
    trigger: "SupplyAgreement execute-buyout (and buyout-quote, which projects it)"
    algorithm: constraint_propagation
    formula: |
      Evaluation order is pinned (the terms are interdependent-looking):
      1. base    = buyout_base_cents per agreement.buyout_method
      2. penalty = round_half_up(max(0, committed_gallons - fulfilled_gallons)
                                 * shortfall_penalty_tc_per_gal / 10)
      3. net     = max(0, base - penalty)   -- floor at zero; never negative
    input_set: "same as buyout_base_cents"
    precision: "integer cents, round_half_up; penalty rounded before subtraction"

  - name: inventory_variance_gallons
    trigger: "InventoryReconciliation create; recompute on drop reconcile, loss verify/void, gauge reading, meter reading while status IN {OPEN, VARIANCE_FLAGGED}"
    algorithm: aggregation
    formula: |
      Per station, over all its StorageTanks:
      book_gallons    = sum(book_inventory_gallons)
      physical_gross  = sum(physical_gallons)
      variance_gross_gallons = physical_gross - book_gallons
      Per tank corrected physical:
        temp = physical_temp_f when a gauge reading exists else 60
        corrected = round_half_up(physical_gallons * (1 + temp_coeff * (temp - 60)))
      variance_net_gallons = sum(corrected) - book_gallons
      Flagging uses ONLY variance_net_gallons:
        status = VARIANCE_FLAGGED when abs(variance_net_gallons) > threshold_gallons
                 else OPEN   (boundary: exactly equal to threshold stays OPEN)
    input_set: "all tanks of the station; per-tank latest gauge temperature"
    precision: "gallons rounded to integers (round_half_up) per corrected tank before summing"
    variants:
      - name: gross
        when: "reported as variance_gross_gallons"
        difference: "raw physical minus book; NOT used for flagging"
      - name: net_temperature_corrected
        when: "reported as variance_net_gallons and used for threshold flagging"
        difference: "temperature-corrected physical minus book; diverges from gross whenever observed temp != 60F"

  - name: book_inventory_gallons
    trigger: "StorageTank create; drop reconcile; meter reading create (incl. out-of-order recompute); loss verify/void"
    algorithm: chronological
    formula: |
      book_inventory_gallons =
          opening_physical_gallons
        + sum(delivered_gallons of RECONCILED drops into this tank)
        - sum(metered_gallons of ALL MeterReadings for this tank)
        - sum(gallons of LossEvents for this tank with status IN {VERIFIED, WRITTEN_OFF})
      Tank-level losses (tank_id set) deduct from that tank; station-level losses
      (tank_id null) do not touch any tank book (they still appear in reports).
    input_set: "state-filtered sets pinned in formula (RECONCILED drops; VERIFIED/WRITTEN_OFF losses; all readings)"
    precision: "gallons, integer arithmetic"

  - name: metered_gallons_delta
    trigger: "MeterReading create (including out-of-order inserts)"
    algorithm: chronological
    formula: |
      Order the tank's readings by (reading_at ASC, created_at ASC).
      For each reading: metered_gallons = totalizer_gallons - predecessor.totalizer_gallons,
      or 0 for the first reading.
      An out-of-order insert recomputes its own delta AND its chronological
      successor's delta. Validation ERR_METER_READING_REGRESSION when the new
      totalizer is below its chronological predecessor's or above its successor's.
    input_set: "all MeterReadings of the tank"
    precision: "integer gallons"

  - name: credit_exposure_cents
    trigger: "invoice create (deliver), invoice void, EFT draft settle"
    algorithm: aggregation
    formula: |
      current_exposure_cents = sum(total_cents of Invoices for the station
                               with status IN {ISSUED, OVERDUE})
      Credit band on every recompute:
        exposure >= 0.8 * credit_limit_cents  -> WATCH   (boundary inclusive)
        exposure <  0.8 * credit_limit_cents  -> GOOD_STANDING
      HOLD is never entered/exited by the band: HOLD is entered only on EFT
      failure and exited only via restore-credit (which then applies the band).
    input_set: "station's invoices filtered by status"
    precision: "integer cents; band comparison in exact integer arithmetic (exposure * 5 >= limit * 4)"

  - name: projected_credit_check
    trigger: "TransportDrop create and replan"
    algorithm: threshold
    formula: |
      projected = station.current_exposure_cents + drop.estimated_amount_cents
      reject with ERR_CREDIT_LIMIT_EXCEEDED when projected > credit_limit_cents
      -- boundary: projected == credit_limit_cents is ALLOWED
    input_set: "station exposure, drop estimate, station limit"
    precision: "integer cents"

  - name: volume_fulfillment_pct
    trigger: "SupplyAgreement renew (incentive evaluation)"
    algorithm: threshold
    formula: |
      fulfilled_gallons = sum(delivered_gallons of RECONCILED drops for the
        station with delivery clock-date in [term_start_date, term_end_date] inclusive)
      pct = round_half_up(100 * fulfilled_gallons / committed_gallons, 2 decimals)
      incentive: pct >= 95.00 -> renewal_credit_cents =
                 round_half_up(0.01 * imaging_allowance_cents); else 0
      -- boundary: exactly 95.00 qualifies
    input_set: "RECONCILED drops of the station within the ending term"
    constants:
      RENEWAL_INCENTIVE_PCT: 0.01
      FULFILLMENT_THRESHOLD_PCT: 95.00
    precision: "pct to 2 decimal places, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "Request body shape: all required fields present, no unknown fields, types valid, enum members valid, window_start < window_end, term_end_date > term_start_date, period_end >= period_start, score within 0-100"
    error_id: ERR_VALIDATION_FAILED
    http_status: 400
    applies_to: all
  - priority: 4
    category: existence
    check: "Path identifiers exist (left-to-right); body foreign keys exist (station_id, tank_id, truck_id, product_id, invoice_id). Resource-specific 404 per target type: ERR_PRODUCT_NOT_FOUND, ERR_DEALER_STATION_NOT_FOUND, ERR_SUPPLY_AGREEMENT_NOT_FOUND, ERR_RACK_PRICE_POSTING_NOT_FOUND, ERR_STORAGE_TANK_NOT_FOUND, ERR_TRUCK_NOT_FOUND, ERR_TRANSPORT_DROP_NOT_FOUND, ERR_METER_READING_NOT_FOUND, ERR_LOSS_EVENT_NOT_FOUND, ERR_INVENTORY_RECONCILIATION_NOT_FOUND, ERR_INVOICE_NOT_FOUND, ERR_EFT_DRAFT_NOT_FOUND, ERR_TAX_REMITTANCE_NOT_FOUND, ERR_BRAND_AUDIT_NOT_FOUND"
    error_id: ERR_DEALER_STATION_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 5
    category: auth
    check: "DealerOperator may only act on resources of the DealerStation whose id == X-User-ID (tank gauge/meter via tank.station_id; loss events via station_id)"
    error_id: ERR_STATION_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "DealerOperator write endpoints and single-resource GETs"
  - priority: 6
    category: state
    check: "State-machine from-state preconditions and cross-entity state gates: drop create needs station operating ACTIVE (ERR_STATION_NOT_ACTIVE) and an ACTIVE agreement (ERR_AGREEMENT_NOT_ACTIVE); transition-specific errors per state_machines; posting supersede/posting OCC version match (ERR_STALE_VERSION)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all action endpoints
  - priority: 7
    category: business_safety
    check: "Drop safety: planned_gallons <= truck.capacity_gallons (ERR_TRUCK_CAPACITY_EXCEEDED); planned_gallons + tank.physical_gallons <= tank.capacity_gallons * safe_fill_pct, equality allowed (ERR_SAFE_FILL_EXCEEDED)"
    error_id: ERR_SAFE_FILL_EXCEEDED
    http_status: 422
    applies_to: "POST /api/transport-drops, POST /api/transport-drops/{id}/replan"
  - priority: 8
    category: business_temporal
    check: "Truck half-open window overlap [window_start, window_end) among drops in {PLANNED, SCHEDULED, EN_ROUTE} — adjacency allowed (ERR_TRUCK_WINDOW_CONFLICT); same-tank drops in {PLANNED, SCHEDULED, EN_ROUTE} require >= 4h gap between earlier end and later start (ERR_TANK_SETTLE_WINDOW); posting effective_date >= clock date at create (ERR_EFFECTIVE_DATE_IN_PAST); meter totalizer between chronological neighbors (ERR_METER_READING_REGRESSION); draft execute requires clock date >= scheduled_date (ERR_DRAFT_NOT_EXECUTABLE); renewal window (ERR_RENEWAL_WINDOW_NOT_OPEN)"
    error_id: ERR_TRUCK_WINDOW_CONFLICT
    http_status: 409
    applies_to: "drop create/replan, posting create, meter create, draft execute, start-renewal"
  - priority: 9
    category: business_constraint
    check: "Uniqueness & integrity: product_code/truck_code unique (ERR_VALIDATION_FAILED 400 on conflict); at most one POSTED posting per (terminal, product, effective_date) (ERR_PRICE_POSTING_CONFLICT); no second InventoryReconciliation while one is OPEN/VARIANCE_FLAGGED for the station (ERR_RECONCILIATION_OPEN_EXISTS); no TaxRemittance for a state with a period-overlapping existing remittance in any status (ERR_TAX_PERIOD_ALREADY_FILED); no second SCHEDULED draft per invoice (ERR_DRAFT_ALREADY_SCHEDULED); resolver != opener (ERR_SEGREGATION_OF_DUTIES); renew blocked in cure (ERR_CURE_PERIOD_ACTIVE) or with overdue invoices (ERR_OVERDUE_INVOICES_EXIST); no POSTED price for drop pricing (ERR_PRICE_NOT_POSTED); linked losses written off before recon resolve (ERR_LINKED_LOSS_NOT_WRITTEN_OFF); open drops block agreement terminate (ERR_AGREEMENT_HAS_OPEN_DROPS)"
    error_id: ERR_PRICE_POSTING_CONFLICT
    http_status: 409
    applies_to: various
  - priority: 10
    category: business_fiscal
    check: "Projected credit check: exposure + estimated_amount_cents > credit_limit_cents -> reject (equality allowed)"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /api/transport-drops, POST /api/transport-drops/{id}/replan"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- catalog / stations ---
  - { method: POST, path: "/api/products", description: "Create product", roles: [JobberAdmin], code: 201, input: [product_code, display_name, category, federal_excise_tc_per_gal, temp_coeff], output: Product, side_effects: [] }
