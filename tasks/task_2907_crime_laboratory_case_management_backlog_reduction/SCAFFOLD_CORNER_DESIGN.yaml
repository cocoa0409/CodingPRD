            - "fourteenth trigger: HTTP status == 409 and ${e_wrong_state} == ERR_ANALYST_INVALID_QUALIFICATION_STATE (PROBATION is not SUSPENDED) and Analyst.${a1}.qualification_state == PROBATION"

      - name: a_decertified_analyst_is_rejected_for_both_assignment_and_reinstatement
        claim_type: violation_to_error
