            - "GET /arbitration/sales/${sale2_id}/ledger-entries now returns exactly 2 SALE_PROCEEDS rows, (SELLER +900000) and (BUYER -900000), summing to 0"
            - "the reinstate did not restore the seller's scorecard — GET /arbitration/sellers/${seller_id}/scorecard still returns rolling_arbitration_rate_bps == 2500 with policy_tier == \"PROBATION\", proving the tier is now sticky against the rate rather than recomputed"

      - name: psi_findings_waive_one_defect_class_but_not_another
        grounds:
          - validations[priority=31]
          - errors.ERR_PSI_WAIVED_RIGHTS
          - entities.PostSaleInspection.fields.findings
          - entities.ArbitrationPolicy.fields.psi_clean_waives_rights
          - calculations.arbitration_window_evaluation
        distinguishing_aspect: |
          The gate depends on a THREE-entity conjunction — the PostSaleInspection's status
          and findings, the ArbitrationPolicy's psi_clean_waives_rights flag, and the
          claimed defect_class — and the same inspection row produces opposite answers for
          two claims filed seconds apart on the SAME sale by the SAME buyer. Only the
          policy the defect_class resolves to differs, so an implementation that treats a
          clean inspection as a blanket waiver fails the FRAME_DAMAGE probe.
        test_recipe:
          setup:
            - "one Seller, one Buyer and one AuctionSale at hammer_time_utc 2026-08-01T00:00:00Z, announced_odometer_miles 84000, still UNSETTLED"
            - "TWO policies: MECHANICAL with psi_clean_waives_rights true and psi_extension_hours 96, and FRAME_DAMAGE with psi_clean_waives_rights false and psi_extension_hours 72"
            - "a STANDARD PostSaleInspection requested on the sale at 2026-08-01T00:00:00Z"
            - "the clock advanced to 2026-08-01T01:00:00Z and the inspection COMPLETED by insp-01 with an EMPTY findings array — a clean inspection"
          setup_api_calls:
            - call: "POST /arbitration/sellers"
              payload: { name: "Ridgeline Motors", dealer_license_no: "SL-1001" }
              as: AuctionAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /arbitration/buyers"
              payload: { name: "Harbor Auto Group", dealer_license_no: "BL-2001" }
              as: AuctionAdmin
              captures: { buyer_id: $.data.id }
            - call: "POST /arbitration/policies"
              payload: { defect_class: "MECHANICAL", window_hours: 48, mileage_limit: 250, min_claim_amount_cents: 60000, requires_third_party_verification: false, max_allowance_bps: 2000, psi_extension_hours: 96, psi_clean_waives_rights: true }
              as: AuctionAdmin
            - call: "POST /arbitration/policies"
              payload: { defect_class: "FRAME_DAMAGE", window_hours: 168, mileage_limit: 1000, min_claim_amount_cents: 50000, requires_third_party_verification: true, max_allowance_bps: 3000, psi_extension_hours: 72, psi_clean_waives_rights: false }
              as: AuctionAdmin
            - call: "POST /arbitration/sales"
              payload: { vin: "1FTFW1E50JKE12345", seller_id: "${seller_id}", buyer_id: "${buyer_id}", sale_price_cents: 1450000, hammer_time_utc: "2026-08-01T00:00:00Z", announced_odometer_miles: 84000, light_channel: "YELLOW", title_status: "CLEAN" }
              as: BlockClerk
              captures: { sale_id: $.data.id }
            - call: "POST /arbitration/post-sale-inspections"
              payload: { sale_id: "${sale_id}", program_tier: "STANDARD" }
              as: BuyerRep
              as_user_id: "${buyer_id}"
              captures: { psi_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T01:00:00Z" }
              as: AuctionAdmin
            - call: "POST /arbitration/post-sale-inspections/${psi_id}/complete"
              payload: { findings: [] }
              as: Inspector
              as_user_id: "insp-01"
          trigger:
            - call: "POST /arbitration/cases"
              payload: { sale_id: "${sale_id}", defect_class: "MECHANICAL", claim_amount_cents: 100000, odometer_at_claim: 84010, complaint_text: "Transmission slips despite the clean inspection" }
              as: BuyerRep
              as_user_id: "${buyer_id}"
            - call: "POST /arbitration/cases"
              payload: { sale_id: "${sale_id}", defect_class: "FRAME_DAMAGE", claim_amount_cents: 285000, odometer_at_claim: 84010, complaint_text: "Frame rail repair the inspection did not cover" }
              as: BuyerRep
              as_user_id: "${buyer_id}"
              captures: { frame_case_id: $.data.id }
          assert:
            - "the setup complete call returns HTTP 200 with status == \"COMPLETED\", findings == [], fee_cents == 12500 and completed_at_utc == \"2026-08-01T01:00:00Z\""
            - "probe 1 (MECHANICAL) — HTTP 409 with response.data.error_id == \"ERR_PSI_WAIVED_RIGHTS\", because the policy waives rights on a clean inspection"
            - "probe 2 (FRAME_DAMAGE) — HTTP 201 on the same sale and the same inspection, because that policy's psi_clean_waives_rights is false"
            - "probe 2 applied no extension — GET /arbitration/cases/${frame_case_id} returns psi_extension_applied_hours == 0 and effective_window_hours == 168, since the empty findings array does not contain FRAME_DAMAGE"
            - "probe 2 — hours_elapsed_at_claim == 1.0 and window_eligible == true"
            - "GET /arbitration/sales/${sale_id} returns arbitration_status == \"ACTIVE\" and open_case_count == 1 — the refused MECHANICAL probe incremented nothing"
            - "GET /arbitration/buyers/${buyer_id} returns lifetime_claim_count == 1 and open_claim_count == 1"
            - "GET /arbitration/cases?sale_id=${sale_id} returns exactly 1 row and its defect_class is \"FRAME_DAMAGE\""

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: psi_window_half_open_rejects_at_minus_1s_and_admits_at_the_endpoint
        grounds:
          - validations[priority=32]
          - errors.ERR_PSI_WINDOW_OVERLAP
          - entities.PostSaleInspection.fields.window_end_utc
          - state_machines.PostSaleInspection.REQUESTED_to_EXPIRED_by_sweep
          - calculations.sweep_processing
        distinguishing_aspect: |
          A HALF-OPEN interval [requested_at_utc, window_end_utc): a second request one
          second before the incumbent's endpoint overlaps and is refused, while a request
          at exactly the endpoint is adjacent with gap 0 and is admitted. The incumbent is
          still REQUESTED at that instant — expiry is the sweep's job, not the clock's —
          so the overlap check must reason about the interval rather than about the row's
          status, and the trailing sweep proves the two facts are independent.
        test_recipe:
          setup:
