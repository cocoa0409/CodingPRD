              as: GamesAdmin
              captures: { stay_dov_id: $.data.id }
          assert:
            - "ONE FULL NIGHT SINKS THE WHOLE STAY: Cleo's 2026-09-11 -> 2026-09-16 request returns HTTP 409 with error_id == ERR_BLOCK_NIGHT_FULL, because night 09-11 already has occupancy 2 == bed_capacity even though nights 09-13, 09-14 and 09-15 are completely empty"
            - "a merged-window or first-night-only reading of the same request would have found free beds, so the refusal is attributable to the per-night decomposition"
            - "DROPPING ONLY THE FULL NIGHT SUCCEEDS: Cleo's 2026-09-12 -> 2026-09-16 request returns HTTP 201 with VillageStay.${stay_cleo_id}.status == RESERVED, nights == 4 and total_charge_cents == 40000, because night 09-12 carries occupancy 1 and nights 09-13 through 09-15 carry 0"
            - "HALF-OPEN ON DATES: Dov's 2026-09-13 -> 2026-09-14 request returns HTTP 201 with VillageStay.${stay_dov_id}.status == RESERVED, nights == 1 and total_charge_cents == 10000, because Ada's stay with check_out_date 2026-09-13 does NOT occupy the night of 09-13, leaving occupancy 1 from Cleo alone"
            - "AccommodationBlock.${blk_id}.reserved_bed_nights == 9, summing Ada 3 + Ben 1 + Cleo 4 + Dov 1 and excluding the refused request entirely"
