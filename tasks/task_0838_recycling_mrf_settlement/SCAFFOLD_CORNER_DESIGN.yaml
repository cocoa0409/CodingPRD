        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[statement-create-stale-municipality]", "errors[ERR_STALE_MUNICIPALITY_VERSION]", entities.Municipality.fields.version]
        distinguishing_aspect: "After one statement create advances Municipality.version, a second create still carrying the pre-advance expected_municipality_version is rejected with ERR_STALE_MUNICIPALITY_VERSION (412)."
        test_recipe:
          setup: ["A municipality at version 1 (freshly created); first statement create uses expected_municipality_version=1 and advances version to 2."]
          setup_api_calls:
            - call: "POST /mrf/municipalities"
              payload: { name: "City A", revenue_share_pct: 0.50 }
              as: SettlementClerk
              captures: { m_id: $.data.id, m_ver: $.data.version }
            - call: "POST /mrf/municipal-statements"
              payload: { municipality_id: "${m_id}", period_start: "2026-03-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", expected_municipality_version: "${m_ver}" }
              as: SettlementClerk
              captures: { st1_id: $.data.id }
          trigger:
            - call: "POST /mrf/municipal-statements"
              payload: { municipality_id: "${m_id}", period_start: "2026-03-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", expected_municipality_version: "${m_ver}" }
              as: SettlementClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_MUNICIPALITY_VERSION"
            - "http_status == 412"

      - name: corner_statement_create_supersedes_prior_open
        claim_type: cascading_side_effects
        grounds: [state_machines.MunicipalStatement.OPEN_to_SUPERSEDED, "concurrency_rules[statement-create-stale-municipality]"]
        distinguishing_aspect: "Creating a second statement (with the up-to-date expected version) sets the prior OPEN statement to SUPERSEDED."
        test_recipe:
          setup: ["Municipality with one OPEN statement; municipality version re-read before the second create."]
          setup_api_calls:
            - call: "POST /mrf/municipalities"
              payload: { name: "City A", revenue_share_pct: 0.50 }
              as: SettlementClerk
              captures: { m_id: $.data.id, m_ver1: $.data.version }
            - call: "POST /mrf/municipal-statements"
              payload: { municipality_id: "${m_id}", period_start: "2026-03-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", expected_municipality_version: "${m_ver1}" }
              as: SettlementClerk
              captures: { st1_id: $.data.id }
            - call: "GET /mrf/municipalities/${m_id}"
              payload: {}
              as: SettlementClerk
              captures: { m_ver2: $.data.version }
          trigger:
            - call: "POST /mrf/municipal-statements"
              payload: { municipality_id: "${m_id}", period_start: "2026-03-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", expected_municipality_version: "${m_ver2}" }
              as: SettlementClerk
              captures: { st2_id: $.data.id }
          assert:
            - "MunicipalStatement.${st1_id}.status == SUPERSEDED"
            - "MunicipalStatement.${st2_id}.status == OPEN"

