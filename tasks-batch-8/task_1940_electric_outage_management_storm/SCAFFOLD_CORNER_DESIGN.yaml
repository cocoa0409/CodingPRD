      - name: ready_without_accepted_assessment_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ASSESSMENT_REQUIRED]
          - state_machines.WorkOrder.CREATED_to_READY
        distinguishing_aspect: "A REPAIR work order on a CONFIRMED outage with no ACCEPTED assessment is rejected with ERR_ASSESSMENT_REQUIRED; an ASSESSMENT-type work order on the same outage is allowed (conditional validation)."
        test_recipe:
          setup: ["Outage CONFIRMED only (no assessments); two work orders: WO_FIX (REPAIR) and WO_CHECK (ASSESSMENT)"]
          setup_api_calls:
