          A different metric on a different endpoint: the zero/empty-set edge of the blocking-finding
          count rather than a numeric score threshold. Two OBSERVATION findings make nc_total_count 2
          and nc_observation_count 2 while nc_blocking_open_count stays 0, and OBSERVATION carries no
          due date at all (OBSERVATION_HAS_DUE_DATE false), so close-assessment must take the
