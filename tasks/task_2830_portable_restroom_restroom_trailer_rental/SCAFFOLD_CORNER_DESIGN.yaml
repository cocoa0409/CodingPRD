  # ===========================================================================
  - section: consistency_model
    instances:
      - name: every_derived_value_is_visible_in_the_same_response_or_the_next_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model (immediate)
          - calculations.unit_mix_quote
          - calculations.schedule_units_on_route
          - calculations.route_density_score
          - calculations.damage_tip_over_charge
          - calculations.site_permit_posture
        distinguishing_aspect: "Nothing in this API lags: the writing response itself already carries every field derived from that write (quote returns quoted_cents and net_billable_cents, the schedule returns units_on_route, the charge returns amount_cents), and the very first read of a NEIGHBOURING aggregate after each write already shows the recomputed value — no second read, no retry and no reconciliation sweep is permitted to be necessary."
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z. Account, site with a PLACEMENT permit created but not yet submitted, MON route capacity 20, one STANDARD_PORTABLE asset."
            - "CONSTRUCTION contract 60 / freq 2 / ada true in DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rental-accounts"
              payload: { legal_name: "Wolvercote Civil Works", account_type: "CONSTRUCTION", credit_terms_days: 30 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /service-sites"
              payload: { account_id: "${acct_id}", site_label: "Wolvercote Cut", jurisdiction_code: "KS-JO-CITY", access_class: "OPEN_LOT", right_of_way_required: false, gate_open_minute: 360, gate_close_minute: 1080, max_truck_length_ft: 40 }
              as: SalesRep
              captures: { site_id: $.data.id, posture_at_create: $.data.site_posture, permit_status_at_create: $.data.permit_status, deployed_at_create: $.data.deployed_unit_count }
            - call: "POST /placement-permits"
              payload: { site_id: "${site_id}", permit_kind: "PLACEMENT", authority_ref: "PL-12501", effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: PermitCoordinator
              captures: { permit_id: $.data.id }
            - call: "POST /asset-units"
              payload: { asset_tag: "SP-1801", unit_class: "STANDARD_PORTABLE", yard_code: "YD-18", tare_length_ft: 8 }
              as: PlatformAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /routes"
              payload: { route_code: "RT-MON-163", service_day: "MON", truck_capacity_units: 20, waste_capacity_gallons: 3000 }
