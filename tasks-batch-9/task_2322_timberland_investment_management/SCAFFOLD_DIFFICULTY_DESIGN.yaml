# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 for task_2322_timberland_investment_management
# 9 rule_ids × (2..4) instances = 27 instances. Every numeric literal in `assert:` was
# produced by executing the §1.3 formula with Decimal/ROUND_HALF_UP against the pinned
# inputs in `setup:`. The logical clock is always pinned to 2026-08-01T00:00:00Z first.
scaffold_difficulty_design:
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: underwriting_growth_variant_yield_table_vs_mai_linear_diverges
        grounds:
          - calculations.underwritten_value
          - calculations.growth_projection_volume
          - entities.UnderwritingCase.fields.growth_variant
          - entities.UnderwritingCase.fields.underwritten_value_usd
          - concurrency_rules[underwriting-case-create-stale-property]
        distinguishing_aspect: |
          Two UnderwritingCase rows on the SAME property and the SAME 1860.00-acre
          72030.36-ton inventory differ ONLY in growth_variant, and the geometric
          YIELD_TABLE path yields underwritten_value_usd 3233360.64 while the arithmetic
          MAI_LINEAR path yields 3293063.46 — a 59702.82 delta driven purely by the
          three period volumes, with identical hbu_premium_usd and rec_income_pv_usd.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Fund with committed_capital_usd 500000.00, target_cash_yield_bps 0, opening_cash_usd 400000.00."
            - "Property 'Big Thicket Tract' in SOUTH, total_acres 2000.00, haul_distance_miles 62 (TIER_B, 4.5% discount), hbu_acres 40.00 at 3000.00/acre, annual_rec_income_usd 18000.00, certification_scheme SFI."
            - "One LOBLOLLY_PINE stand of 1860.00 acres with the canonical five cruise plots, cruise closed: mean_net_tons_per_acre 38.726, net_merch_tons 72030.36, cruise_confidence NORMAL."
          setup_api_calls:
            - call: "POST /timberland/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FundAdmin
            - call: "POST /timberland/funds"
              payload: { name: "Longleaf Timber Fund I", vintage_year: 2025, committed_capital_usd: 500000.00, target_cash_yield_bps: 0, opening_cash_usd: 400000.00 }
              as: FundAdmin
              captures: { fund_id: "$.data.id" }
            - call: "POST /timberland/properties"
              payload: { fund_id: "${fund_id}", name: "Big Thicket Tract", region_code: "SOUTH", total_acres: 2000.00, haul_distance_miles: 62, insured_value_usd: 4200000.00, hbu_acres: 40.00, hbu_price_per_acre_usd: 3000.00, annual_rec_income_usd: 18000.00, certification_scheme: "SFI" }
              as: AcquisitionAnalyst
              captures: { prop_id: "$.data.id" }
            - call: "POST /timberland/stands"
              payload: { property_id: "${prop_id}", stand_code: "BT-01", acres: 1860.00, species_code: "LOBLOLLY_PINE", age_years: 22, site_index: 78 }
              as: ForestManager
              captures: { stand_id: "$.data.id" }
            - call: "POST /timberland/cruise-plots"
              payload: { stand_id: "${stand_id}", plot_number: 1, tons_per_acre: 41.37, defect_pct: 6.5, measured_at: "2026-07-15T00:00:00Z" }
              as: ForestManager
            - call: "POST /timberland/cruise-plots"
              payload: { stand_id: "${stand_id}", plot_number: 2, tons_per_acre: 38.94, defect_pct: 4.25, measured_at: "2026-07-15T00:00:00Z" }
              as: ForestManager
            - call: "POST /timberland/cruise-plots"
              payload: { stand_id: "${stand_id}", plot_number: 3, tons_per_acre: 44.06, defect_pct: 9.75, measured_at: "2026-07-15T00:00:00Z" }
              as: ForestManager
            - call: "POST /timberland/cruise-plots"
              payload: { stand_id: "${stand_id}", plot_number: 4, tons_per_acre: 39.51, defect_pct: 3.5, measured_at: "2026-07-15T00:00:00Z" }
              as: ForestManager
            - call: "POST /timberland/cruise-plots"
              payload: { stand_id: "${stand_id}", plot_number: 5, tons_per_acre: 42.88, defect_pct: 7.25, measured_at: "2026-07-15T00:00:00Z" }
              as: ForestManager
            - call: "POST /timberland/stands/${stand_id}/cruise-close"
              payload: {}
              as: ForestManager
            - call: "GET /timberland/properties/${prop_id}"
              payload: {}
              as: AcquisitionAnalyst
              captures: { prop_v1: "$.data.version" }
          trigger:
            - call: "POST /timberland/underwriting-cases"
              payload: { property_id: "${prop_id}", growth_variant: "YIELD_TABLE", discount_rate_bps: 800, stumpage_price_usd_per_ton: 60.50, bid_price_usd: 100000.00, expected_property_version: "${prop_v1}" }
              as: AcquisitionAnalyst
              as_user_id: "analyst-1"
              captures: { case_yt_id: "$.data.id" }
            - call: "GET /timberland/properties/${prop_id}"
              payload: {}
              as: AcquisitionAnalyst
              captures: { prop_v2: "$.data.version" }
            - call: "POST /timberland/underwriting-cases"
              payload: { property_id: "${prop_id}", growth_variant: "MAI_LINEAR", discount_rate_bps: 800, stumpage_price_usd_per_ton: 60.50, bid_price_usd: 100000.00, expected_property_version: "${prop_v2}" }
              as: AcquisitionAnalyst
              as_user_id: "analyst-1"
              captures: { case_mai_id: "$.data.id" }
          assert:
            - "Stand.${stand_id}.net_merch_tons == 72030.36"
            - "UnderwritingCase.${case_yt_id}.timber_pv_usd == 3020794.10"
            - "UnderwritingCase.${case_yt_id}.pre_fee_value_usd == 3257794.10"
            - "UnderwritingCase.${case_yt_id}.underwritten_value_usd == 3233360.64"
            - "UnderwritingCase.${case_mai_id}.timber_pv_usd == 3080948.07"
            - "UnderwritingCase.${case_mai_id}.pre_fee_value_usd == 3317948.07"
            - "UnderwritingCase.${case_mai_id}.underwritten_value_usd == 3293063.46"
            - "UnderwritingCase.${case_yt_id}.hbu_premium_usd == 120000.00 and UnderwritingCase.${case_mai_id}.hbu_premium_usd == 120000.00"
            - "UnderwritingCase.${case_yt_id}.rec_income_pv_usd == 117000.00 and UnderwritingCase.${case_mai_id}.rec_income_pv_usd == 117000.00"
            - "UnderwritingCase.${case_mai_id}.underwritten_value_usd - UnderwritingCase.${case_yt_id}.underwritten_value_usd == 59702.82"

      - name: insurance_premium_actuarial_vs_experience_rated_diverges
        grounds:
          - calculations.insurance_premium_and_risk_score
          - entities.Property.fields.insurance_rating_basis
          - entities.Property.fields.insurance_premium_usd
          - entities.Property.fields.composite_risk_score
          - state_machines.HazardEvent.REPORTED_to_SETTLED
        distinguishing_aspect: |
          On ONE property with fixed hazard indices (wildfire 72.00, insect 64.00,
          weather 48.00) the ACTUARIAL basis prices the policy off composite_risk_score
          66.48 giving 26570.21, while EXPERIENCE_RATED ignores that score entirely and
          prices off loss_ratio 0.0739 (310500.00 settled claims / 4200000.00 insured)
          giving 17139.44 — composite_risk_score stays 66.48 in both, so the divergence
          can only come from the variant selector, not from any input change.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Fund with committed_capital_usd 500000.00, target_cash_yield_bps 0, opening_cash_usd 400000.00."
            - "Property in SOUTH insured for 4200000.00 with one LOBLOLLY_PINE stand of 1860.00 acres (dominant species multiplier 1.15), cruise closed at 72030.36 tons."
            - "One WILDFIRE HazardEvent of 23000.00 damaged tons occurred_at 2026-07-01 (inside the 1095-day trailing window), SETTLED for exactly its 310500.00 indemnity ceiling."
          setup_api_calls:
            - call: "POST /timberland/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FundAdmin
            - call: "POST /timberland/funds"
              payload: { name: "Longleaf Timber Fund I", vintage_year: 2025, committed_capital_usd: 500000.00, target_cash_yield_bps: 0, opening_cash_usd: 400000.00 }
              as: FundAdmin
              captures: { fund_id: "$.data.id" }
            - call: "POST /timberland/properties"
              payload: { fund_id: "${fund_id}", name: "Big Thicket Tract", region_code: "SOUTH", total_acres: 2000.00, haul_distance_miles: 62, insured_value_usd: 4200000.00, hbu_acres: 40.00, hbu_price_per_acre_usd: 3000.00, annual_rec_income_usd: 18000.00, certification_scheme: "SFI" }
              as: AcquisitionAnalyst
              captures: { prop_id: "$.data.id" }
            - call: "POST /timberland/stands"
              payload: { property_id: "${prop_id}", stand_code: "BT-01", acres: 1860.00, species_code: "LOBLOLLY_PINE", age_years: 22, site_index: 78 }
              as: ForestManager
              captures: { stand_id: "$.data.id" }
            - call: "POST /timberland/cruise-plots"
              payload: { stand_id: "${stand_id}", plot_number: 1, tons_per_acre: 41.37, defect_pct: 6.5, measured_at: "2026-07-15T00:00:00Z" }
              as: ForestManager
            - call: "POST /timberland/cruise-plots"
              payload: { stand_id: "${stand_id}", plot_number: 2, tons_per_acre: 38.94, defect_pct: 4.25, measured_at: "2026-07-15T00:00:00Z" }
              as: ForestManager
            - call: "POST /timberland/cruise-plots"
              payload: { stand_id: "${stand_id}", plot_number: 3, tons_per_acre: 44.06, defect_pct: 9.75, measured_at: "2026-07-15T00:00:00Z" }
              as: ForestManager
            - call: "POST /timberland/cruise-plots"
              payload: { stand_id: "${stand_id}", plot_number: 4, tons_per_acre: 39.51, defect_pct: 3.5, measured_at: "2026-07-15T00:00:00Z" }
              as: ForestManager
            - call: "POST /timberland/cruise-plots"
              payload: { stand_id: "${stand_id}", plot_number: 5, tons_per_acre: 42.88, defect_pct: 7.25, measured_at: "2026-07-15T00:00:00Z" }
              as: ForestManager
            - call: "POST /timberland/stands/${stand_id}/cruise-close"
              payload: {}
              as: ForestManager
            - call: "POST /timberland/properties/${prop_id}/risk-review"
              payload: { insurance_rating_basis: "ACTUARIAL", wildfire_hazard_index: 72.00, insect_hazard_index: 64.00, weather_hazard_index: 48.00 }
              as: FundAdmin
            - call: "POST /timberland/hazard-events"
              payload: { stand_id: "${stand_id}", event_type: "WILDFIRE", occurred_at: "2026-07-01T00:00:00Z", damaged_tons: 23000.00 }
              as: ForestManager
              captures: { hz_id: "$.data.id" }
            - call: "POST /timberland/hazard-events/${hz_id}/salvage-settle"
              payload: { settled_claim_usd: 310500.00, salvage_sold_tons: 8050.00 }
              as: FundAdmin
          trigger:
            - call: "POST /timberland/properties/${prop_id}/risk-review"
              payload: { insurance_rating_basis: "EXPERIENCE_RATED", wildfire_hazard_index: 72.00, insect_hazard_index: 64.00, weather_hazard_index: 48.00 }
              as: FundAdmin
          assert:
            - "HazardEvent.${hz_id}.salvageable_tons == 8050.00"
            - "HazardEvent.${hz_id}.insurance_claim_usd == 310500.00"
            - "Property.${prop_id}.composite_risk_score == 66.48"
            - "Property.${prop_id}.insurance_premium_usd == 17139.44"
            - "the ACTUARIAL review in setup wrote Property.${prop_id}.insurance_premium_usd == 26570.21, so the EXPERIENCE_RATED premium is 9430.77 lower on identical hazard indices"
            - "Fund.${fund_id}.cash_balance_usd == 666790.35"
            - "Fund.${fund_id}.net_operating_cash_usd == 266790.35"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cruise_expansion_pins_per_plot_rounding_before_the_mean
        grounds:
          - calculations.stand_cruise_volume
          - entities.CruisePlot.fields.net_tons_per_acre
          - entities.Stand.fields.mean_net_tons_per_acre
          - entities.Stand.fields.gross_merch_tons
          - state_machines.Stand.CRUISE_OPEN_to_INVENTORIED
        distinguishing_aspect: |
          Three chained rounding steps (per-plot net tons per acre at 3 dp, then the
          plot mean at 3 dp, then the acre expansion at 2 dp) compose to
          gross_merch_tons 4647.12; averaging the raw tons_per_acre (41.352) and the
          raw defect_pct (6.250) first and only then netting gives 4652.16, so the
          5.04-ton gap falsifies any implementation that re-orders the composition.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Fund with committed_capital_usd 500000.00, target_cash_yield_bps 0, opening_cash_usd 400000.00."
            - "Property 'Piney Creek Tract' in SOUTH, total_acres 1200.00, haul_distance_miles 62, no HBU or recreational assumptions, certification_scheme SFI."
            - "Stand PC-01 of exactly 120.00 LOBLOLLY_PINE acres carrying the five canonical plots (41.37/6.5, 38.94/4.25, 44.06/9.75, 39.51/3.5, 42.88/7.25), cruise still open."
          setup_api_calls:
            - call: "POST /timberland/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FundAdmin
            - call: "POST /timberland/funds"
              payload: { name: "Longleaf Timber Fund I", vintage_year: 2025, committed_capital_usd: 500000.00, target_cash_yield_bps: 0, opening_cash_usd: 400000.00 }
              as: FundAdmin
              captures: { fund_id: "$.data.id" }
            - call: "POST /timberland/properties"
              payload: { fund_id: "${fund_id}", name: "Piney Creek Tract", region_code: "SOUTH", total_acres: 1200.00, haul_distance_miles: 62, insured_value_usd: 4200000.00, hbu_acres: 0.00, hbu_price_per_acre_usd: 0.00, annual_rec_income_usd: 0.00, certification_scheme: "SFI" }
              as: AcquisitionAnalyst
              captures: { prop_id: "$.data.id" }
            - call: "POST /timberland/stands"
              payload: { property_id: "${prop_id}", stand_code: "PC-01", acres: 120.00, species_code: "LOBLOLLY_PINE", age_years: 22, site_index: 78 }
              as: ForestManager
              captures: { stand_id: "$.data.id" }
            - call: "POST /timberland/cruise-plots"
              payload: { stand_id: "${stand_id}", plot_number: 1, tons_per_acre: 41.37, defect_pct: 6.5, measured_at: "2026-07-15T00:00:00Z" }
              as: ForestManager
              captures: { plot1_id: "$.data.id" }
            - call: "POST /timberland/cruise-plots"
              payload: { stand_id: "${stand_id}", plot_number: 2, tons_per_acre: 38.94, defect_pct: 4.25, measured_at: "2026-07-15T00:00:00Z" }
              as: ForestManager
              captures: { plot2_id: "$.data.id" }
            - call: "POST /timberland/cruise-plots"
              payload: { stand_id: "${stand_id}", plot_number: 3, tons_per_acre: 44.06, defect_pct: 9.75, measured_at: "2026-07-15T00:00:00Z" }
              as: ForestManager
              captures: { plot3_id: "$.data.id" }
            - call: "POST /timberland/cruise-plots"
              payload: { stand_id: "${stand_id}", plot_number: 4, tons_per_acre: 39.51, defect_pct: 3.5, measured_at: "2026-07-15T00:00:00Z" }
              as: ForestManager
              captures: { plot4_id: "$.data.id" }
            - call: "POST /timberland/cruise-plots"
              payload: { stand_id: "${stand_id}", plot_number: 5, tons_per_acre: 42.88, defect_pct: 7.25, measured_at: "2026-07-15T00:00:00Z" }
              as: ForestManager
              captures: { plot5_id: "$.data.id" }
          trigger:
            - call: "POST /timberland/stands/${stand_id}/cruise-close"
              payload: {}
              as: ForestManager
          assert:
            - "CruisePlot.${plot1_id}.net_tons_per_acre == 38.681"
            - "CruisePlot.${plot2_id}.net_tons_per_acre == 37.285"
            - "CruisePlot.${plot3_id}.net_tons_per_acre == 39.764"
            - "CruisePlot.${plot4_id}.net_tons_per_acre == 38.127"
            - "CruisePlot.${plot5_id}.net_tons_per_acre == 39.771"
            - "Stand.${stand_id}.mean_net_tons_per_acre == 38.726"
            - "Stand.${stand_id}.gross_merch_tons == 4647.12"
            - "Stand.${stand_id}.gross_merch_tons != 4652.16"
            - "Stand.${stand_id}.cruise_confidence == NORMAL"
            - "Stand.${stand_id}.net_merch_tons == 4647.12"
            - "Stand.${stand_id}.available_tons == 4647.12"
            - "Stand.${stand_id}.reserved_tons == 0.00 and Stand.${stand_id}.committed_tons == 0.00 and Stand.${stand_id}.dedicated_tons == 0.00 and Stand.${stand_id}.hbu_withdrawn_tons == 0.00"
            - "Stand.${stand_id}.status == INVENTORIED"
            - "Stand.${stand_id}.plot_count == 5"

      - name: acquisition_fee_tier_keyed_on_pre_fee_value_not_post_fee
        grounds:
          - calculations.underwritten_value
          - entities.UnderwritingCase.fields.pre_fee_value_usd
          - entities.UnderwritingCase.fields.acquisition_fee_pct
          - entities.UnderwritingCase.fields.acquisition_fee_usd
          - concurrency_rules[underwriting-case-create-stale-property]
        distinguishing_aspect: |
          pre_fee_value_usd 3257794.10 sits 7794.10 ABOVE the ACQ_FEE_BREAK_2 breakpoint
          of 3250000.00, so acquisition_fee_pct is 0.75 and underwritten_value_usd is
          3233360.64 — which falls back BELOW the breakpoint; keying the tier on the
          post-fee value instead selects 1.00% and yields 3225216.16, an 8144.48 error
          that only this straddling configuration exposes.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Fund with committed_capital_usd 500000.00, target_cash_yield_bps 0, opening_cash_usd 400000.00."
            - "Property 'Big Thicket Tract' in SOUTH, total_acres 2000.00, haul_distance_miles 62 (TIER_B 4.5%), hbu_acres 40.00 at 3000.00/acre, annual_rec_income_usd 18000.00, certification_scheme SFI."
            - "One LOBLOLLY_PINE stand of 1860.00 acres cruise-closed at net_merch_tons 72030.36 (NORMAL confidence)."
          setup_api_calls:
            - call: "POST /timberland/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FundAdmin
            - call: "POST /timberland/funds"
              payload: { name: "Longleaf Timber Fund I", vintage_year: 2025, committed_capital_usd: 500000.00, target_cash_yield_bps: 0, opening_cash_usd: 400000.00 }
              as: FundAdmin
              captures: { fund_id: "$.data.id" }
            - call: "POST /timberland/properties"
              payload: { fund_id: "${fund_id}", name: "Big Thicket Tract", region_code: "SOUTH", total_acres: 2000.00, haul_distance_miles: 62, insured_value_usd: 4200000.00, hbu_acres: 40.00, hbu_price_per_acre_usd: 3000.00, annual_rec_income_usd: 18000.00, certification_scheme: "SFI" }
              as: AcquisitionAnalyst
              captures: { prop_id: "$.data.id" }
            - call: "POST /timberland/stands"
              payload: { property_id: "${prop_id}", stand_code: "BT-01", acres: 1860.00, species_code: "LOBLOLLY_PINE", age_years: 22, site_index: 78 }
              as: ForestManager
              captures: { stand_id: "$.data.id" }
            - call: "POST /timberland/cruise-plots"
              payload: { stand_id: "${stand_id}", plot_number: 1, tons_per_acre: 41.37, defect_pct: 6.5, measured_at: "2026-07-15T00:00:00Z" }
              as: ForestManager
            - call: "POST /timberland/cruise-plots"
              payload: { stand_id: "${stand_id}", plot_number: 2, tons_per_acre: 38.94, defect_pct: 4.25, measured_at: "2026-07-15T00:00:00Z" }
              as: ForestManager
            - call: "POST /timberland/cruise-plots"
              payload: { stand_id: "${stand_id}", plot_number: 3, tons_per_acre: 44.06, defect_pct: 9.75, measured_at: "2026-07-15T00:00:00Z" }
              as: ForestManager
            - call: "POST /timberland/cruise-plots"
              payload: { stand_id: "${stand_id}", plot_number: 4, tons_per_acre: 39.51, defect_pct: 3.5, measured_at: "2026-07-15T00:00:00Z" }
              as: ForestManager
            - call: "POST /timberland/cruise-plots"
              payload: { stand_id: "${stand_id}", plot_number: 5, tons_per_acre: 42.88, defect_pct: 7.25, measured_at: "2026-07-15T00:00:00Z" }
              as: ForestManager
            - call: "POST /timberland/stands/${stand_id}/cruise-close"
              payload: {}
              as: ForestManager
            - call: "GET /timberland/properties/${prop_id}"
              payload: {}
              as: AcquisitionAnalyst
              captures: { prop_v: "$.data.version" }
          trigger:
            - call: "POST /timberland/underwriting-cases"
              payload: { property_id: "${prop_id}", growth_variant: "YIELD_TABLE", discount_rate_bps: 800, stumpage_price_usd_per_ton: 60.50, bid_price_usd: 100000.00, expected_property_version: "${prop_v}" }
              as: AcquisitionAnalyst
              as_user_id: "analyst-1"
              captures: { case_id: "$.data.id" }
          assert:
            - "UnderwritingCase.${case_id}.timber_pv_usd == 3020794.10"
            - "UnderwritingCase.${case_id}.hbu_premium_usd == 120000.00"
            - "UnderwritingCase.${case_id}.rec_income_pv_usd == 117000.00"
            - "UnderwritingCase.${case_id}.pre_fee_value_usd == 3257794.10"
            - "UnderwritingCase.${case_id}.acquisition_fee_pct == 0.75"
            - "UnderwritingCase.${case_id}.acquisition_fee_usd == 24433.46"
            - "UnderwritingCase.${case_id}.underwritten_value_usd == 3233360.64"
            - "UnderwritingCase.${case_id}.acquisition_fee_usd != 32577.94"
            - "UnderwritingCase.${case_id}.underwritten_value_usd != 3225216.16"
            - "UnderwritingCase.${case_id}.status == DRAFT"

      - name: harvest_revenue_nests_haul_mile_cap_inside_severance_floor
        grounds:
          - calculations.harvest_block_net_revenue
          - calculations.growth_projection_volume
          - entities.HarvestBlock.fields.provisional_net_revenue_usd
          - entities.HarvestBlock.fields.severance_tax_usd
          - entities.HarvestBlock.fields.projected_available_tons
          - validations[priority=64]
        distinguishing_aspect: |
          Two blocks on ONE stand compose the two nested clamps in opposite directions:
          block X (1000.00 tons, MIXED, index 1.05, 140 haul miles) is capped at 90
          billable miles giving haul 13050.00 and net 22889.55 (an uncapped 140-mile
          haul would give 15639.55), while block Y (150.00 tons, PULPWOOD, 45 miles)
          has gross 5535.75 whose 2.5% severance of 138.39 is lifted to the 250.00
          floor, giving net 2394.50 — one formula, two different active clamps.
        test_recipe:
          setup:
