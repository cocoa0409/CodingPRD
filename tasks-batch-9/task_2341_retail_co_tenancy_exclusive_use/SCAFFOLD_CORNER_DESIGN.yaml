      - call: POST /tenants
        payload:
          legal_name: Halcyon Optical LLC
          notice_email: legal@halcyonoptical.example
          primary_use_code: OPTICAL
          is_national_chain: false
        as: LeaseAdministrator
        as_user_id: la-admin-1
        captures:
          t_x: $.data.id
      trigger:
      - call: POST /centers/${ctr}/leases
        payload:
          tenant_id: ${t_x}
          suite_code: I9
          gla_sqft: 2200
          parcel_kind: INLINE
          primary_use_code: OPTICAL
          base_rent_monthly_cents: 500000
          commencement_date: '2026-09-01'
          expiration_date: '2036-08-31'
          id: 11111111-1111-4111-8111-111111111111
          version: 77
          premises_status: OPEN
          total_abated_cents: 999999
        as: LeaseAdministrator
        as_user_id: la-admin-1
        captures:
          l_x: $.data.id
      assert:
      - response.http_status == 201
      - Lease.${l_x}.id != 11111111-1111-4111-8111-111111111111
      - Lease.${l_x}.version == 1
      - Lease.${l_x}.premises_status == DRAFT
      - Lease.${l_x}.total_abated_cents == 0
      - ShoppingCenter.${ctr}.occupied_gla_sqft == 0
