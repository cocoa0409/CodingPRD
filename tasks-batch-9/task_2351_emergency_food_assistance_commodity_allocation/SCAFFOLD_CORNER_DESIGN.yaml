        grounds:
          - endpoints.POST_/efap/commodity-orders/{order_id}/approve
          - calculations.order_line_pound_conversion
          - entities.OrderLine.fields.cases_approved
        distinguishing_aspect: "line_adjustments is a partial bulk edit: naming only the rice line (10 -> 6) must trim that line and leave the chicken line at its requested 3 cases, so the order settles at total_cases_approved 9 against total_cases_requested 13 with total_pounds 120.00 + 90.38 == 210.38, and each lot is committed at the approved (not requested) quantity."
