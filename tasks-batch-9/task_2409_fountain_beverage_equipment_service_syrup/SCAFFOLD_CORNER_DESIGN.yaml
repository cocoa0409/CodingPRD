            - call: "POST /fountain-network/maintenance-tasks"
              payload: { dispenser_unit_id: "${du}", task_type: "PREVENTIVE", due_at: "2026-08-05T00:00:00Z" }
              as: ComplianceOfficer
              captures: { mt: $.data.id }
            - call: "POST /fountain-network/maintenance-tasks/${mt}/evaluate-due"
              payload: {}
              as: ComplianceOfficer
