            - "Supplier.${sup_id}.quality_score == 85.00 (the SAFETY weight 15.0 survives the close) and supplier_status == ACTIVE"
            - "ComponentLot.${lot_id}.quantity_available is still 0 — remediation never returns quarantined pieces"

