              as: RecallCoordinator
              captures: { lot: $.data.id }
            - call: "POST /recalls"
              payload: { product_id: "${prod}", reason: "overheat", hazard_severity: "SERIOUS", injury_reported: false }
              as: RecallCoordinator
              captures: { rc: $.data.id, rc_v0: $.data.version }
            - call: "POST /recalls/${rc}/affected-lots"
              payload: { lot_id: "${lot}", expected_recall_version: "${rc_v0}" }
              as: RecallCoordinator
            - call: "POST /recalls/${rc}/classify"
              payload: {}
              as: RecallCoordinator
              as_user_id: "user-c1"
            - call: "POST /regulatory-reports"
              payload: { recall_id: "${rc}", report_kind: "INITIAL" }
              as: RecallCoordinator
              captures: { rep: $.data.id }
          trigger:
            - call: "POST /recalls/${rc}/announce"
              payload: {}
              as: QualityOfficer
              as_user_id: "user-c2"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INITIAL_REPORT_REQUIRED"

      # --- Disposition open depends on Recall state --------------------------
      - name: disposition_open_requires_recall_announced
        grounds:
          - state_machines.Disposition.logistics:PENDING_to_logistics:RETURNED
          - entities.Recall.fields.status
          - validations[priority=17]
        distinguishing_aspect: >
          Opening a Disposition is rejected when the owning Recall is still
          CLASSIFIED (not ANNOUNCED/MONITORING) — Disposition validity depends on
          Recall state, the (Disposition, Recall) entity pair, different from the
          (Recall, RegulatoryReport) pair above.
        test_recipe:
          setup:
            - "Recall CLASSIFIED (not announced); one affected unit exists but recall not open for disposition."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-CE2", name: "Seat", regulator: "CPSC", unit_list_price_cents: 4000 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
