            - call: "POST /retail/audits"
              payload: { sales_report_id: "${r2_id}", audit_window_start: "2027-01-05T00:00:00Z", audit_window_end: "2027-01-20T00:00:00Z" }
              as: Auditor
              as_user_id: "auditor-1"
              captures: { audit2_id: $.data.id }
          assert:
            - "The 2026-12-20 request returns HTTP 409 with data.error_id == \"ERR_AUDIT_WINDOW_CONFLICT\""
            - "SalesReport.${r2_id}.status was still ACCEPTED after that rejection"
            - "The 2027-01-05 request returns HTTP 201 and SalesAudit.${audit2_id}.status == OPEN"
