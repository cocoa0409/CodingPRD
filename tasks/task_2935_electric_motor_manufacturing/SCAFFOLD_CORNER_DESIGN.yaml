# Scaffold Corner Design (§1.9) — Coverage Index for Non-Difficulty Tests
# Domain: electric-motor-manufacturing (task_2935_electric_motor_manufacturing)
#
# Breadth probe over the claim-extraction-guide's nine sections against this
# scaffold's own §1.1-§1.7. Every instance grounds in elements already declared in
# SCAFFOLD.yaml; deleting this file leaves the scaffold's declared behaviour
# identical. Corners already asserted by §1.8 carry an `excluded_because:` stub
# naming the difficulty instance instead of a duplicate recipe.
#
# Shared fixture vocabulary (identical literals to SCAFFOLD_DIFFICULTY_DESIGN.yaml):
#   logical clock default ......... 2026-08-01T00:00:00.000Z (server startup default)
#   design D1 ..................... WM-132M-7K5-IE3: 4-pole, 7.5 kW, 400 V, target IE3,
#                                   M330_35A, stack 180 mm, copper 12.0 kg, LAP, class F,
#                                   bore 135.400, gap 0.450 +/- 0.050, DIE_CAST_ALUMINUM,
#                                   34 bars, shaft 38.000 k6, GREASE_REGREASABLE, S1, IP55, B3
#                                   -> loss 479.7, predicted 93.99 (IE4), guaranteed 93.09 (IE3)
#   design D2 ..................... WM-132M-7K5-IE4C: as D1 but M235_35A, stack 200 mm,
#                                   copper 14.5 kg, FABRICATED_COPPER, 40 bars, target IE4
#                                   -> loss 388.8, predicted 95.07 (IE5), guaranteed 94.33 (IE4)
#   design D3 ..................... WM-132S-7K5-IE3B: as D1 but M400_50A, stack 160 mm
#                                   -> loss 525.9, predicted 93.45, guaranteed 92.47 (IE3)
#   work order D1 x 12 ............ per-unit direct 149600, direct 1795200, band COMPLEX,
#                                   overhead 556512, standard 2351712, unit standard 195976
#   user ids ...................... u_eng_1 / u_eng_2 (DesignEngineer), u_rev_1 (DesignReviewer),
#                                   u_plan_1 (ProductionPlanner), u_tech_1 / u_tech_2
#                                   (BuildTechnician), u_test_1 / u_test_2 (TestEngineer),
#                                   u_cert_1 (QualityCertifier), u_comp_1 (ComplianceOfficer),
#                                   u_admin_1 (PlantAdmin); the Distributor role authenticates
#                                   as the Distributor row's own id.

scaffold_corner_design:

  # ===========================================================================
  # Table 1 (Entities) — 13 peer collections, entity_topology flat
  # ===========================================================================
  - section: entities
    instances:

      - name: motor_design_creation_returns_computed_loss_model_and_both_classes
        claim_type: creation
        grounds:
          - entities.MotorDesign
          - endpoints[POST /motor-designs]
          - calculations.design_predicted_efficiency
        distinguishing_aspect: |
          A single POST with every required input present must come back 201 carrying all 24
          submitted fields verbatim PLUS the five computed loss-model outputs and the three
          system fields — creation is not merely persistence, it runs the loss model once.
        test_recipe:
          setup:
            - "Empty DB; logical clock at the 2026-08-01T00:00:00.000Z startup default."
          setup_api_calls: []
          trigger:
            - call: "POST /motor-designs"
              payload: { model_code: "WM-132M-7K5-IE3", frame_size: "132M", poles: 4, rated_output_kw: 7.5, rated_voltage_v: 400, target_efficiency_class: "IE3", lamination_grade: "M330_35A", lamination_stack_length_mm: 180, winding_copper_kg: 12.0, winding_type: "LAP", insulation_class: "F", stator_bore_id_mm: 135.400, design_air_gap_mm: 0.450, air_gap_tolerance_mm: 0.050, rotor_construction: "DIE_CAST_ALUMINUM", rotor_bar_count: 34, shaft_diameter_mm: 38.000, shaft_tolerance_class: "k6", bearing_spec_de: "6208-2Z", bearing_spec_nde: "6206-2Z", lubrication_spec: "GREASE_REGREASABLE", duty_type: "S1", enclosure: "IP55", mounting: "B3" }
              as: DesignEngineer
              as_user_id: "u_eng_1"
              captures: { d1_id: $.data.id }
          assert:
            - "HTTP 201"
            - "MotorDesign.${d1_id}.model_code == WM-132M-7K5-IE3 and frame_size == 132M and poles == 4"
            - "MotorDesign.${d1_id}.rated_output_kw == 7.5 and rated_voltage_v == 400"
            - "MotorDesign.${d1_id}.total_predicted_loss_w == 479.7"
            - "MotorDesign.${d1_id}.predicted_efficiency_pct == 93.99"
            - "MotorDesign.${d1_id}.guaranteed_efficiency_pct == 93.09"
            - "MotorDesign.${d1_id}.design_estimate_class == IE4"
            - "MotorDesign.${d1_id}.predicted_class == IE3"
            - "MotorDesign.${d1_id}.status == DRAFT"
            - "MotorDesign.${d1_id}.revision_index == 0 and review_round == 0"
            - "MotorDesign.${d1_id}.created_by_user_id == u_eng_1"
            - "MotorDesign.${d1_id}.released_by_user_id == null and released_at == null"
            - "MotorDesign.${d1_id}.supersedes_design_id == null"
            - "MotorDesign.${d1_id}.version == 1"

      - name: motor_design_retrieval_matches_stored_row_and_success_envelope
        claim_type: retrieval
        grounds:
          - entities.MotorDesign
          - endpoints[GET /motor-designs/{id}]
          - response_envelope.success
        distinguishing_aspect: |
          GET /{id} returns byte-identical field values to the create response and wraps them in
          the declared success envelope: meta.api_request_id, meta.api_request_timestamp,
          response_type "object" and a `data` object — the entity is never returned bare.
        test_recipe:
          setup:
            - "One DRAFT MotorDesign (D1 fixture) created by u_eng_1."
          setup_api_calls:
            - call: "POST /motor-designs"
              payload: { model_code: "WM-132M-7K5-IE3", frame_size: "132M", poles: 4, rated_output_kw: 7.5, rated_voltage_v: 400, target_efficiency_class: "IE3", lamination_grade: "M330_35A", lamination_stack_length_mm: 180, winding_copper_kg: 12.0, winding_type: "LAP", insulation_class: "F", stator_bore_id_mm: 135.400, design_air_gap_mm: 0.450, air_gap_tolerance_mm: 0.050, rotor_construction: "DIE_CAST_ALUMINUM", rotor_bar_count: 34, shaft_diameter_mm: 38.000, shaft_tolerance_class: "k6", bearing_spec_de: "6208-2Z", bearing_spec_nde: "6206-2Z", lubrication_spec: "GREASE_REGREASABLE", duty_type: "S1", enclosure: "IP55", mounting: "B3" }
              as: DesignEngineer
              as_user_id: "u_eng_1"
              captures: { d1_id: $.data.id, d1_created: $.data.created_at }
          trigger:
            - call: "GET /motor-designs/${d1_id}"
              payload: {}
              as: DesignReviewer
              as_user_id: "u_rev_1"
          assert:
            - "HTTP 200"
            - "response body has meta.api_request_id and meta.api_request_timestamp"
            - "response_type == object"
            - "data.id == ${d1_id} and data.created_at == ${d1_created}"
            - "data.total_predicted_loss_w == 479.7 and data.guaranteed_efficiency_pct == 93.09"
            - "data.status == DRAFT and data.version == 1"

      - name: motor_design_listing_paginates_and_filters_by_status
        claim_type: listing
        grounds:
          - endpoints[GET /motor-designs]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Three designs exist; limit/offset windows the array while total_count stays 3 and
          has_more flips true -> false at the last page, and a status filter narrows the set
          before pagination is applied rather than after.
        test_recipe:
          setup:
            - "Three MotorDesign rows: D1 (target IE3, moved to IN_REVIEW), D2 (target IE4, DRAFT), D3 (target IE3, DRAFT)."
          setup_api_calls:
            - call: "POST /motor-designs"
              payload: { model_code: "WM-132M-7K5-IE3", frame_size: "132M", poles: 4, rated_output_kw: 7.5, rated_voltage_v: 400, target_efficiency_class: "IE3", lamination_grade: "M330_35A", lamination_stack_length_mm: 180, winding_copper_kg: 12.0, winding_type: "LAP", insulation_class: "F", stator_bore_id_mm: 135.400, design_air_gap_mm: 0.450, air_gap_tolerance_mm: 0.050, rotor_construction: "DIE_CAST_ALUMINUM", rotor_bar_count: 34, shaft_diameter_mm: 38.000, shaft_tolerance_class: "k6", bearing_spec_de: "6208-2Z", bearing_spec_nde: "6206-2Z", lubrication_spec: "GREASE_REGREASABLE", duty_type: "S1", enclosure: "IP55", mounting: "B3" }
              as: DesignEngineer
              as_user_id: "u_eng_1"
              captures: { d1_id: $.data.id }
            - call: "POST /motor-designs/${d1_id}/submit-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "u_eng_1"
            - call: "POST /motor-designs"
              payload: { model_code: "WM-132M-7K5-IE4C", frame_size: "132M", poles: 4, rated_output_kw: 7.5, rated_voltage_v: 400, target_efficiency_class: "IE4", lamination_grade: "M235_35A", lamination_stack_length_mm: 200, winding_copper_kg: 14.5, winding_type: "LAP", insulation_class: "F", stator_bore_id_mm: 135.400, design_air_gap_mm: 0.450, air_gap_tolerance_mm: 0.050, rotor_construction: "FABRICATED_COPPER", rotor_bar_count: 40, shaft_diameter_mm: 38.000, shaft_tolerance_class: "k6", bearing_spec_de: "6208-2Z", bearing_spec_nde: "6206-2Z", lubrication_spec: "GREASE_REGREASABLE", duty_type: "S1", enclosure: "IP55", mounting: "B3" }
              as: DesignEngineer
              as_user_id: "u_eng_1"
              captures: { d2_id: $.data.id }
            - call: "POST /motor-designs"
              payload: { model_code: "WM-132S-7K5-IE3B", frame_size: "132S", poles: 4, rated_output_kw: 7.5, rated_voltage_v: 400, target_efficiency_class: "IE3", lamination_grade: "M400_50A", lamination_stack_length_mm: 160, winding_copper_kg: 12.0, winding_type: "LAP", insulation_class: "F", stator_bore_id_mm: 135.400, design_air_gap_mm: 0.450, air_gap_tolerance_mm: 0.050, rotor_construction: "DIE_CAST_ALUMINUM", rotor_bar_count: 34, shaft_diameter_mm: 38.000, shaft_tolerance_class: "k6", bearing_spec_de: "6208-2Z", bearing_spec_nde: "6206-2Z", lubrication_spec: "GREASE_REGREASABLE", duty_type: "S1", enclosure: "IP55", mounting: "B3" }
              as: DesignEngineer
              as_user_id: "u_eng_1"
              captures: { d3_id: $.data.id }
          trigger:
            - call: "GET /motor-designs"
              payload: { limit: 2, offset: 0 }
              as: ProductionPlanner
              as_user_id: "u_plan_1"
            - call: "GET /motor-designs"
              payload: { limit: 2, offset: 2 }
              as: ProductionPlanner
              as_user_id: "u_plan_1"
            - call: "GET /motor-designs"
              payload: { status: "IN_REVIEW" }
              as: ProductionPlanner
              as_user_id: "u_plan_1"
            - call: "GET /motor-designs"
              payload: { target_efficiency_class: "IE4" }
              as: ProductionPlanner
              as_user_id: "u_plan_1"
          assert:
            - "trigger 1: response_type == array, data length == 2, total_count == 3, limit == 2, offset == 0, has_more == true"
            - "trigger 2: data length == 1, total_count == 3, offset == 2, has_more == false"
            - "trigger 3: data length == 1, data[0].id == ${d1_id}, total_count == 1, has_more == false"
            - "trigger 4: data length == 1, data[0].id == ${d2_id}, data[0].predicted_class == IE4, total_count == 1"
            - "MotorDesign.${d3_id}.status == DRAFT (untouched by the filtered reads)"

      - name: every_path_id_collection_returns_its_own_not_found_error
        claim_type: not_found
        grounds:
          - validations[priority=20]
          - errors[ERR_DESIGN_NOT_FOUND]
          - errors[ERR_ORDER_NOT_FOUND]
          - errors[ERR_WORK_ORDER_NOT_FOUND]
          - errors[ERR_SUBASSEMBLY_NOT_FOUND]
          - errors[ERR_ASSEMBLY_RECORD_NOT_FOUND]
          - errors[ERR_PERFORMANCE_TEST_NOT_FOUND]
          - errors[ERR_NAMEPLATE_NOT_FOUND]
          - errors[ERR_WARRANTY_CLAIM_NOT_FOUND]
          - errors[ERR_DISTRIBUTOR_NOT_FOUND]
          - errors[ERR_OVEN_NOT_FOUND]
          - errors[ERR_TEST_CELL_NOT_FOUND]
          - errors[ERR_STANDARD_NOT_FOUND]
        distinguishing_aspect: |
          Twelve collections each own a DISTINCT 404 error id; a single generic 404 for every
          path would pass a naive test. Both StatorBuild and RotorBuild deliberately share
          ERR_SUBASSEMBLY_NOT_FOUND, so the assertion set is 13 calls over 12 error ids.
        test_recipe:
          setup:
            - "Empty DB — no row of any kind exists, so every id below is unknown."
          setup_api_calls: []
          trigger:
            - call: "GET /motor-designs/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: PlantAdmin
              as_user_id: "u_admin_1"
              captures: { e_design: $.data.error_id }
            - call: "GET /customer-orders/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: PlantAdmin
              as_user_id: "u_admin_1"
              captures: { e_order: $.data.error_id }
            - call: "GET /work-orders/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: PlantAdmin
              as_user_id: "u_admin_1"
              captures: { e_wo: $.data.error_id }
            - call: "GET /stator-builds/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: PlantAdmin
              as_user_id: "u_admin_1"
              captures: { e_stator: $.data.error_id }
            - call: "GET /rotor-builds/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: PlantAdmin
              as_user_id: "u_admin_1"
              captures: { e_rotor: $.data.error_id }
            - call: "GET /assembly-records/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: PlantAdmin
              as_user_id: "u_admin_1"
              captures: { e_asm: $.data.error_id }
            - call: "GET /performance-tests/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: PlantAdmin
              as_user_id: "u_admin_1"
              captures: { e_test: $.data.error_id }
            - call: "GET /nameplates/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: PlantAdmin
              as_user_id: "u_admin_1"
              captures: { e_np: $.data.error_id }
            - call: "GET /warranty-claims/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: PlantAdmin
              as_user_id: "u_admin_1"
              captures: { e_claim: $.data.error_id }
            - call: "GET /distributors/00000000-0000-4000-8000-00000000000a"
              payload: {}
              as: PlantAdmin
              as_user_id: "u_admin_1"
              captures: { e_dist: $.data.error_id }
            - call: "GET /curing-ovens/00000000-0000-4000-8000-00000000000b"
              payload: {}
              as: PlantAdmin
              as_user_id: "u_admin_1"
              captures: { e_oven: $.data.error_id }
            - call: "GET /test-cells/00000000-0000-4000-8000-00000000000c"
              payload: {}
              as: PlantAdmin
              as_user_id: "u_admin_1"
              captures: { e_cell: $.data.error_id }
            - call: "GET /regulatory-standards/00000000-0000-4000-8000-00000000000d"
              payload: {}
              as: PlantAdmin
              as_user_id: "u_admin_1"
              captures: { e_std: $.data.error_id }
          assert:
            - "every trigger call returns HTTP 404 with response_type == error"
            - "${e_design} == ERR_DESIGN_NOT_FOUND"
            - "${e_order} == ERR_ORDER_NOT_FOUND"
            - "${e_wo} == ERR_WORK_ORDER_NOT_FOUND"
            - "${e_stator} == ERR_SUBASSEMBLY_NOT_FOUND"
            - "${e_rotor} == ERR_SUBASSEMBLY_NOT_FOUND"
            - "${e_asm} == ERR_ASSEMBLY_RECORD_NOT_FOUND"
            - "${e_test} == ERR_PERFORMANCE_TEST_NOT_FOUND"
            - "${e_np} == ERR_NAMEPLATE_NOT_FOUND"
            - "${e_claim} == ERR_WARRANTY_CLAIM_NOT_FOUND"
            - "${e_dist} == ERR_DISTRIBUTOR_NOT_FOUND"
            - "${e_oven} == ERR_OVEN_NOT_FOUND"
            - "${e_cell} == ERR_TEST_CELL_NOT_FOUND"
            - "${e_std} == ERR_STANDARD_NOT_FOUND"

      - name: missing_required_fields_are_rejected_before_any_row_is_created
        claim_type: required_fields
        grounds:
          - validations[priority=10]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /motor-designs]
          - endpoints[POST /distributors]
          - endpoints[POST /regulatory-standards]
        distinguishing_aspect: |
          Every `source: input` field without a `default` is mandatory, and the rejection is
          total: after three malformed creates the collections are still empty, so no partial
          row is persisted and no id is minted.
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /motor-designs"
              payload: { frame_size: "132M", poles: 4, rated_output_kw: 7.5, rated_voltage_v: 400, target_efficiency_class: "IE3", lamination_grade: "M330_35A", lamination_stack_length_mm: 180, winding_copper_kg: 12.0, winding_type: "LAP", insulation_class: "F", stator_bore_id_mm: 135.400, design_air_gap_mm: 0.450, air_gap_tolerance_mm: 0.050, rotor_construction: "DIE_CAST_ALUMINUM", rotor_bar_count: 34, shaft_diameter_mm: 38.000, shaft_tolerance_class: "k6", bearing_spec_de: "6208-2Z", bearing_spec_nde: "6206-2Z", lubrication_spec: "GREASE_REGREASABLE", duty_type: "S1", enclosure: "IP55", mounting: "B3" }
              as: DesignEngineer
              as_user_id: "u_eng_1"
              captures: { e_no_model_code: $.data.error_id }
            - call: "POST /distributors"
              payload: { name: "Nordwind Antriebe", jurisdiction: "EU" }
              as: PlantAdmin
              as_user_id: "u_admin_1"
              captures: { e_no_tier: $.data.error_id }
            - call: "POST /regulatory-standards"
              payload: { standard_code: "EU-2019-1781-IE3-4P", jurisdiction: "EU", efficiency_class: "IE3", poles: 4, rated_output_kw_min: 5.5, rated_output_kw_max: 11.0, minimum_efficiency_pct: 89.60 }
              as: PlantAdmin
              as_user_id: "u_admin_1"
              captures: { e_no_effective_from: $.data.error_id }
            - call: "GET /motor-designs"
              payload: {}
              as: PlantAdmin
              as_user_id: "u_admin_1"
          assert:
            - "${e_no_model_code} == ERR_INVALID_REQUEST with HTTP 400 (model_code omitted)"
            - "${e_no_tier} == ERR_INVALID_REQUEST with HTTP 400 (tier omitted)"
            - "${e_no_effective_from} == ERR_INVALID_REQUEST with HTTP 400 (effective_from omitted)"
            - "trigger 4: data length == 0 and total_count == 0 — no MotorDesign row was created"

      - name: omitted_optional_inputs_fall_back_to_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Distributor.fields.stocking_program_enrolled
          - entities.Distributor.fields.committed_annual_units
          - entities.Distributor.fields.stock_buffer_units
          - entities.CuringOven.fields.status
          - entities.TestCell.fields.status
          - entities.RegulatoryStandard.fields.tolerance_pct
          - entities.CustomerOrder.fields.special_requirements
          - entities.MotorDesign.fields.supersedes_design_id
        distinguishing_aspect: |
          Six creates omit every optional input at once. Each default must be the DECLARED one,
          not a null: booleans default false, counters default 0/0.0, resource status defaults
          AVAILABLE, tolerance_pct defaults 0.0 and special_requirements defaults an empty
          object that contributes zero lead-time adders.
        test_recipe:
          setup:
            - "Empty DB; logical clock at the 2026-08-01T00:00:00.000Z startup default."
          setup_api_calls:
            - call: "POST /motor-designs"
              payload: { model_code: "WM-132M-7K5-IE3", frame_size: "132M", poles: 4, rated_output_kw: 7.5, rated_voltage_v: 400, target_efficiency_class: "IE3", lamination_grade: "M330_35A", lamination_stack_length_mm: 180, winding_copper_kg: 12.0, winding_type: "LAP", insulation_class: "F", stator_bore_id_mm: 135.400, design_air_gap_mm: 0.450, air_gap_tolerance_mm: 0.050, rotor_construction: "DIE_CAST_ALUMINUM", rotor_bar_count: 34, shaft_diameter_mm: 38.000, shaft_tolerance_class: "k6", bearing_spec_de: "6208-2Z", bearing_spec_nde: "6206-2Z", lubrication_spec: "GREASE_REGREASABLE", duty_type: "S1", enclosure: "IP55", mounting: "B3" }
              as: DesignEngineer
              as_user_id: "u_eng_1"
              captures: { d1_id: $.data.id }
          trigger:
            - call: "POST /distributors"
              payload: { name: "Sparse Partner", tier: "SILVER", jurisdiction: "EU" }
              as: PlantAdmin
              as_user_id: "u_admin_1"
              captures: { dist_bare_id: $.data.id }
            - call: "POST /curing-ovens"
              payload: { oven_code: "OVEN-D", max_temp_c: 180.0, cooldown_buffer_minutes: 45 }
              as: PlantAdmin
              as_user_id: "u_admin_1"
              captures: { oven_bare_id: $.data.id }
            - call: "POST /test-cells"
              payload: { cell_code: "DYNO-D", max_concurrent_kw: 20.0 }
              as: PlantAdmin
              as_user_id: "u_admin_1"
              captures: { cell_bare_id: $.data.id }
            - call: "POST /regulatory-standards"
              payload: { standard_code: "EU-2019-1781-IE3-4P", jurisdiction: "EU", efficiency_class: "IE3", poles: 4, rated_output_kw_min: 5.5, rated_output_kw_max: 11.0, minimum_efficiency_pct: 89.60, effective_from: "2021-07-01" }
              as: PlantAdmin
              as_user_id: "u_admin_1"
              captures: { std_bare_id: $.data.id }
            - call: "POST /customer-orders"
              payload: { distributor_id: "${dist_bare_id}", design_id: "${d1_id}", order_type: "MADE_TO_ORDER", quantity: 4, requested_ship_date: "2026-12-01", jurisdiction: "EU" }
              as: ProductionPlanner
              as_user_id: "u_plan_1"
              captures: { o_bare_id: $.data.id }
          assert:
            - "Distributor.${dist_bare_id}.stocking_program_enrolled == false"
            - "Distributor.${dist_bare_id}.committed_annual_units == 0 and stock_buffer_units == 0"
            - "Distributor.${dist_bare_id}.units_outstanding == 0 and stock_allowance_remaining_units == 0"
            - "Distributor.${dist_bare_id}.warranty_credit_balance_cents == 0 and open_presumed_defect_count == 0"
            - "CuringOven.${oven_bare_id}.status == AVAILABLE and booked_minutes == 0"
            - "TestCell.${cell_bare_id}.status == AVAILABLE and peak_reserved_kw == 0.0"
            - "RegulatoryStandard.${std_bare_id}.tolerance_pct == 0.0"
            - "CustomerOrder.${o_bare_id}.special_requirements == {} (empty object, not null)"
            - "CustomerOrder.${o_bare_id}.promised_lead_time_days == 31 (28 base + 0 special + 3 EU - 0 SILVER)"
            - "CustomerOrder.${o_bare_id}.promised_ship_date == 2026-09-01"
            - "MotorDesign.${d1_id}.supersedes_design_id == null"

      - name: system_fields_are_server_minted_and_version_increments_on_each_mutation
        claim_type: system_fields
        grounds:
          - entities.MotorDesign.fields.status
          - entities.MotorDesign.fields.created_by_user_id
          - entities.MotorDesign.fields.revision_index
          - endpoints[POST /motor-designs/{id}/submit-review]
          - endpoints[POST /motor-designs/{id}/review-decision]
        distinguishing_aspect: |
          id/created_at/updated_at/version are minted by the server and cannot be supplied;
          version advances by exactly 1 per successful mutation (1 -> 2 on submit-review, 2 -> 3
          on the approve decision) while created_at never moves and updated_at does.
        test_recipe:
          setup:
