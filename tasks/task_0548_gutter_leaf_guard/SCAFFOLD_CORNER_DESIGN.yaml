# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 0548 — Gutter Installation & Leaf-Guard
# Breadth probe: every testable claim §1.1-§1.7 surfaces that §1.8 does not
# already cover. excluded_because stubs point at the §1.8 instance that covers.
# =============================================================================
scaffold_corner_design:

  # ------------------------------------------------------------ ENTITIES
  - section: entities
    instances:
      - name: product_creation_returns_201_and_echoes_fields
        claim_type: creation
        grounds: [entities.Product.fields.base_rate_cents_per_foot, endpoints]
        distinguishing_aspect: "POST /api/products with all required fields returns 201, echoes name/category/base_rate, and system-mints id/created_at/version."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/products"
              payload: { name: "MicroMesh", category: "LEAF_GUARD", base_rate_cents_per_foot: 3000, available_colors: ["WHITE","COPPER"], premium_colors: ["COPPER"], color_surcharge_cents_per_foot: 500 }
              as: Admin
              captures: { pid: "$.data.id", ver: "$.data.version" }
          assert:
            - "HTTP 201; data.base_rate_cents_per_foot == 3000 and data.category == LEAF_GUARD"
            - "pid is a server-minted UUID and ver == 1"

      - name: lead_system_fields_generated_status_new
        claim_type: system_fields
        grounds: [entities.Lead.fields.status, entities.Lead.fields.no_show_strikes, entities.Lead.fields.credit_balance_cents]
        distinguishing_aspect: "On POST /api/leads the server sets status=NEW, no_show_strikes=0, credit_balance_cents=0, version=1 regardless of any client-supplied values for those fields."
        test_recipe:
          setup: ["A SalesRep exists"]
          setup_api_calls:
            - call: "POST /api/sales-reps"
              payload: { full_name: "Rep A", region: "NE" }
              as: Admin
              captures: { rep: "$.data.id" }
          trigger:
            - call: "POST /api/leads"
              payload: { full_name: "HO", address: "1 St", phone: "555-0001", region: "NE", sales_rep_id: "${rep}" }
              as: Admin
              captures: { lid: "$.data.id", st: "$.data.status", strikes: "$.data.no_show_strikes", credit: "$.data.credit_balance_cents", ver: "$.data.version" }
          assert:
            - "st == NEW; strikes == 0; credit == 0; ver == 1"

      - name: quote_downspout_count_defaults_zero
        claim_type: defaults
        grounds: [entities.Quote.fields.downspout_count]
        distinguishing_aspect: "Omitting downspout_count on POST /api/quotes applies default 0 (no downspout add-on in the subtotal)."
        test_recipe:
          setup: ["Product, rep, lead, booked appointment"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { name: "MicroMesh", category: "LEAF_GUARD", base_rate_cents_per_foot: 3000, available_colors: ["WHITE","COPPER"], premium_colors: ["COPPER"], color_surcharge_cents_per_foot: 500 }
              as: Admin
              captures: { pid: "$.data.id" }
            - call: "POST /api/sales-reps"
              payload: { full_name: "Rep A", region: "NE" }
              as: Admin
              captures: { rep: "$.data.id" }
            - call: "POST /api/leads"
              payload: { full_name: "HO", address: "2 St", phone: "555-0002", region: "NE", sales_rep_id: "${rep}" }
              as: Admin
              captures: { lead: "$.data.id" }
            - call: "POST /api/appointments"
              payload: { lead_id: "${lead}", sales_rep_id: "${rep}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Admin
              captures: { appt: "$.data.id" }
            - call: "GET /api/leads/${lead}"
              payload: {}
              as: Admin
              captures: { lv: "$.data.version" }
          trigger:
            - call: "POST /api/quotes"
              payload: { lead_id: "${lead}", appointment_id: "${appt}", sales_rep_id: "${rep}", product_id: "${pid}", color: "WHITE", estimated_linear_feet: 100, discount_pct: 0, expected_lead_version: "${lv}" }
              as: Admin
              captures: { qid: "$.data.id", ds: "$.data.downspout_count", sub: "$.data.subtotal_cents" }
          assert:
            - "ds == 0 (default applied)"
            - "sub == 300000 (feet 100 T1 rate 3000, no color, no downspout)"

      - name: product_category_bad_enum_returns_400
        claim_type: type_constraints
        grounds: [entities.Product.fields.category, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /api/products with category not in {GUTTER, LEAF_GUARD, DOWNSPOUT} is rejected with ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/products"
              payload: { name: "X", category: "SIDING", base_rate_cents_per_foot: 3000, available_colors: ["WHITE"], premium_colors: [] }
              as: Admin
          assert:
            - "HTTP 400 ERR_VALIDATION (unknown category enum)"

      - name: quote_missing_required_color_returns_validation
        claim_type: required_fields
        grounds: [entities.Quote.fields.color, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /api/quotes without the required color field is rejected with ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Product, rep, lead, appointment"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { name: "MicroMesh", category: "LEAF_GUARD", base_rate_cents_per_foot: 3000, available_colors: ["WHITE","COPPER"], premium_colors: ["COPPER"], color_surcharge_cents_per_foot: 500 }
              as: Admin
              captures: { pid: "$.data.id" }
            - call: "POST /api/sales-reps"
              payload: { full_name: "Rep A", region: "NE" }
              as: Admin
              captures: { rep: "$.data.id" }
            - call: "POST /api/leads"
              payload: { full_name: "HO", address: "3 St", phone: "555-0003", region: "NE", sales_rep_id: "${rep}" }
              as: Admin
              captures: { lead: "$.data.id" }
            - call: "POST /api/appointments"
              payload: { lead_id: "${lead}", sales_rep_id: "${rep}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Admin
              captures: { appt: "$.data.id" }
            - call: "GET /api/leads/${lead}"
              payload: {}
              as: Admin
              captures: { lv: "$.data.version" }
          trigger:
            - call: "POST /api/quotes"
              payload: { lead_id: "${lead}", appointment_id: "${appt}", sales_rep_id: "${rep}", product_id: "${pid}", estimated_linear_feet: 100, expected_lead_version: "${lv}" }
              as: Admin
          assert:
            - "HTTP 400 ERR_VALIDATION (color required)"

      - name: quote_appointment_fk_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Quote.fields.appointment_id, "errors[ERR_APPOINTMENT_NOT_FOUND]"]
        distinguishing_aspect: "POST /api/quotes with an appointment_id that does not exist returns ERR_APPOINTMENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Product, rep, lead (no appointment)"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { name: "MicroMesh", category: "LEAF_GUARD", base_rate_cents_per_foot: 3000, available_colors: ["WHITE","COPPER"], premium_colors: ["COPPER"], color_surcharge_cents_per_foot: 500 }
              as: Admin
              captures: { pid: "$.data.id" }
            - call: "POST /api/sales-reps"
              payload: { full_name: "Rep A", region: "NE" }
              as: Admin
              captures: { rep: "$.data.id" }
            - call: "POST /api/leads"
              payload: { full_name: "HO", address: "4 St", phone: "555-0004", region: "NE", sales_rep_id: "${rep}" }
              as: Admin
              captures: { lead: "$.data.id" }
            - call: "GET /api/leads/${lead}"
              payload: {}
              as: Admin
              captures: { lv: "$.data.version" }
          trigger:
            - call: "POST /api/quotes"
              payload: { lead_id: "${lead}", appointment_id: "00000000-0000-4000-8000-000000000000", sales_rep_id: "${rep}", product_id: "${pid}", color: "WHITE", estimated_linear_feet: 100, expected_lead_version: "${lv}" }
              as: Admin
          assert:
            - "HTTP 404 ERR_APPOINTMENT_NOT_FOUND"

      - name: crew_fk_reverse_reachable_jobs_by_crew
        claim_type: parent_relationships
        grounds: [entities.Job.fields.crew_id, endpoints]
        distinguishing_aspect: "GET /api/jobs?crew_id={id} returns the Job[] assigned to that crew (FK reverse-reachability for Job.crew_id -> Crew.id)."
        test_recipe:
          setup: ["A crew with no jobs assigned yet"]
          setup_api_calls:
            - call: "POST /api/crews"
              payload: { name: "Crew C", region: "NE", is_certified_leaf_guard: true }
              as: Admin
              captures: { crew: "$.data.id" }
          trigger:
            - call: "GET /api/jobs"
              payload: { crew_id: "${crew}" }
              as: Admin
          assert:
            - "HTTP 200; response_type array; data == [] (no jobs yet); total_count == 0"

  # ------------------------------------------------------ STATE MACHINES
  - section: state_machines
    instances:
      - name: lead_initial_state_is_new
        claim_type: initial_state
        grounds: [state_machines.Lead, entities.Lead.fields.status]
        distinguishing_aspect: "A freshly created Lead is in status NEW (state machine initial_state)."
        test_recipe:
          setup: ["A SalesRep exists"]
          setup_api_calls:
            - call: "POST /api/sales-reps"
              payload: { full_name: "Rep A", region: "NE" }
              as: Admin
              captures: { rep: "$.data.id" }
          trigger:
            - call: "POST /api/leads"
              payload: { full_name: "HO", address: "5 St", phone: "555-0005", region: "NE", sales_rep_id: "${rep}" }
              as: Admin
              captures: { st: "$.data.status" }
          assert:
            - "st == NEW"

      - name: cancel_appointment_from_completed_is_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Appointment.SCHEDULED_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A COMPLETED (terminal) Appointment cannot be transitioned to CANCELED; the second transition returns ERR_INVALID_STATE with no side effects."
        test_recipe:
          setup: ["An appointment that has been COMPLETED"]
          setup_api_calls:
            - call: "POST /api/sales-reps"
              payload: { full_name: "Rep A", region: "NE" }
              as: Admin
              captures: { rep: "$.data.id" }
            - call: "POST /api/leads"
              payload: { full_name: "HO", address: "6 St", phone: "555-0006", region: "NE", sales_rep_id: "${rep}" }
              as: Admin
              captures: { lead: "$.data.id" }
            - call: "POST /api/appointments"
              payload: { lead_id: "${lead}", sales_rep_id: "${rep}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Admin
              captures: { appt: "$.data.id" }
            - call: "POST /api/appointments/${appt}/transition"
              payload: { to_status: "COMPLETED", measured_linear_feet: 150 }
              as: Admin
          trigger:
            - call: "POST /api/appointments/${appt}/transition"
              payload: { to_status: "CANCELED" }
              as: Admin
          assert:
            - "HTTP 409 ERR_INVALID_STATE; appointment stays COMPLETED"

      - name: quote_terminal_accepted_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Quote.PRESENTED_to_ACCEPTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "An ACCEPTED (terminal) Quote rejects any further transition (e.g. to DECLINED) with ERR_INVALID_STATE."
        test_recipe:
          setup: ["An ACCEPTED quote (accept cascade already fired)"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { name: "MicroMesh", category: "LEAF_GUARD", base_rate_cents_per_foot: 3000, available_colors: ["WHITE","COPPER"], premium_colors: ["COPPER"], color_surcharge_cents_per_foot: 500 }
              as: Admin
              captures: { pid: "$.data.id" }
            - call: "POST /api/sales-reps"
              payload: { full_name: "Rep A", region: "NE" }
              as: Admin
              captures: { rep: "$.data.id" }
            - call: "POST /api/leads"
              payload: { full_name: "HO", address: "7 St", phone: "555-0007", region: "NE", sales_rep_id: "${rep}" }
              as: Admin
              captures: { lead: "$.data.id" }
            - call: "POST /api/appointments"
              payload: { lead_id: "${lead}", sales_rep_id: "${rep}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Admin
              captures: { appt: "$.data.id" }
            - call: "POST /api/appointments/${appt}/transition"
              payload: { to_status: "COMPLETED", measured_linear_feet: 200 }
              as: Admin
            - call: "GET /api/leads/${lead}"
              payload: {}
              as: Admin
              captures: { lv: "$.data.version" }
            - call: "POST /api/quotes"
              payload: { lead_id: "${lead}", appointment_id: "${appt}", sales_rep_id: "${rep}", product_id: "${pid}", color: "WHITE", estimated_linear_feet: 200, downspout_count: 0, discount_pct: 0, expected_lead_version: "${lv}" }
              as: Admin
              captures: { qid: "$.data.id" }
            - call: "POST /api/quotes/${qid}/present"
              payload: {}
              as: Admin
            - call: "POST /api/quotes/${qid}/transition"
              payload: { to_status: "ACCEPTED" }
              as: Admin
          trigger:
            - call: "POST /api/quotes/${qid}/transition"
              payload: { to_status: "DECLINED" }
              as: Admin
          assert:
            - "HTTP 409 ERR_INVALID_STATE; quote stays ACCEPTED"

      - name: present_twice_second_is_invalid_state
        claim_type: idempotency
        grounds: [state_machines.Quote.DRAFT_to_PRESENTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Presenting the same quote twice: the first succeeds (DRAFT->PRESENTED), the second fails ERR_INVALID_STATE (no longer DRAFT)."
        test_recipe:
          setup: ["A quote whose appointment is COMPLETED"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { name: "MicroMesh", category: "LEAF_GUARD", base_rate_cents_per_foot: 3000, available_colors: ["WHITE","COPPER"], premium_colors: ["COPPER"], color_surcharge_cents_per_foot: 500 }
              as: Admin
              captures: { pid: "$.data.id" }
            - call: "POST /api/sales-reps"
              payload: { full_name: "Rep A", region: "NE" }
              as: Admin
              captures: { rep: "$.data.id" }
            - call: "POST /api/leads"
              payload: { full_name: "HO", address: "8 St", phone: "555-0008", region: "NE", sales_rep_id: "${rep}" }
              as: Admin
              captures: { lead: "$.data.id" }
            - call: "POST /api/appointments"
              payload: { lead_id: "${lead}", sales_rep_id: "${rep}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Admin
              captures: { appt: "$.data.id" }
            - call: "POST /api/appointments/${appt}/transition"
              payload: { to_status: "COMPLETED", measured_linear_feet: 200 }
              as: Admin
            - call: "GET /api/leads/${lead}"
              payload: {}
              as: Admin
              captures: { lv: "$.data.version" }
            - call: "POST /api/quotes"
              payload: { lead_id: "${lead}", appointment_id: "${appt}", sales_rep_id: "${rep}", product_id: "${pid}", color: "WHITE", estimated_linear_feet: 200, downspout_count: 0, discount_pct: 0, expected_lead_version: "${lv}" }
              as: Admin
              captures: { qid: "$.data.id" }
            - call: "POST /api/quotes/${qid}/present"
              payload: {}
              as: Admin
          trigger:
            - call: "POST /api/quotes/${qid}/present"
              payload: {}
              as: Admin
          assert:
            - "HTTP 409 ERR_INVALID_STATE (quote already PRESENTED)"

      - name: financing_accept_requires_quote_accepted
        claim_type: precondition_enforcement
        grounds: [state_machines.FinancingPlan.OFFERED_to_ACCEPTED, "errors[ERR_QUOTE_NOT_ACCEPTED]"]
        distinguishing_aspect: "Accepting a financing plan whose backing Quote is only PRESENTED (not ACCEPTED) returns ERR_QUOTE_NOT_ACCEPTED — a third cross-entity gate (FinancingPlan<-Quote)."
        test_recipe:
          setup: ["A financing plan OFFERED on a PRESENTED (not accepted) quote"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { name: "MicroMesh", category: "LEAF_GUARD", base_rate_cents_per_foot: 3000, available_colors: ["WHITE","COPPER"], premium_colors: ["COPPER"], color_surcharge_cents_per_foot: 500 }
              as: Admin
              captures: { pid: "$.data.id" }
            - call: "POST /api/sales-reps"
              payload: { full_name: "Rep A", region: "NE" }
              as: Admin
              captures: { rep: "$.data.id" }
            - call: "POST /api/leads"
              payload: { full_name: "HO", address: "9 St", phone: "555-0009", region: "NE", sales_rep_id: "${rep}" }
              as: Admin
              captures: { lead: "$.data.id" }
            - call: "POST /api/appointments"
              payload: { lead_id: "${lead}", sales_rep_id: "${rep}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Admin
              captures: { appt: "$.data.id" }
            - call: "POST /api/appointments/${appt}/transition"
              payload: { to_status: "COMPLETED", measured_linear_feet: 200 }
              as: Admin
            - call: "GET /api/leads/${lead}"
              payload: {}
              as: Admin
              captures: { lv: "$.data.version" }
            - call: "POST /api/quotes"
              payload: { lead_id: "${lead}", appointment_id: "${appt}", sales_rep_id: "${rep}", product_id: "${pid}", color: "WHITE", estimated_linear_feet: 200, downspout_count: 0, discount_pct: 0, expected_lead_version: "${lv}" }
              as: Admin
              captures: { qid: "$.data.id" }
            - call: "POST /api/quotes/${qid}/present"
              payload: {}
              as: Admin
            - call: "POST /api/financing-plans"
              payload: { quote_id: "${qid}", plan_type: "DEFERRED_INTEREST", apr_bps: 0, term_months: 12, promo_window_days: 365 }
              as: Admin
              captures: { fp: "$.data.id" }
          trigger:
            - call: "POST /api/financing-plans/${fp}/transition"
              payload: { to_status: "ACCEPTED" }
              as: Admin
          assert:
            - "HTTP 409 ERR_QUOTE_NOT_ACCEPTED (quote is PRESENTED, not ACCEPTED)"

      - name: quote_accept_after_expiry_returns_expired
        claim_type: precondition_enforcement
        grounds: [state_machines.Quote.PRESENTED_to_ACCEPTED, "errors[ERR_QUOTE_EXPIRED]", entities.Quote.fields.presented_at]
        distinguishing_aspect: "Accepting a quote more than QUOTE_VALIDITY_DAYS (30) after presented_at returns ERR_QUOTE_EXPIRED; the logical clock is advanced past the window."
        test_recipe:
          setup: ["A PRESENTED quote stamped presented_at at the default clock 2026-05-01T00:00:00Z; clock then advanced to 2026-06-15"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { name: "MicroMesh", category: "LEAF_GUARD", base_rate_cents_per_foot: 3000, available_colors: ["WHITE","COPPER"], premium_colors: ["COPPER"], color_surcharge_cents_per_foot: 500 }
              as: Admin
              captures: { pid: "$.data.id" }
            - call: "POST /api/sales-reps"
              payload: { full_name: "Rep A", region: "NE" }
              as: Admin
              captures: { rep: "$.data.id" }
            - call: "POST /api/leads"
              payload: { full_name: "HO", address: "10 St", phone: "555-0010", region: "NE", sales_rep_id: "${rep}" }
              as: Admin
              captures: { lead: "$.data.id" }
            - call: "POST /api/appointments"
              payload: { lead_id: "${lead}", sales_rep_id: "${rep}", scheduled_start: "2026-04-10T10:00:00Z", scheduled_end: "2026-04-10T11:00:00Z" }
              as: Admin
              captures: { appt: "$.data.id" }
            - call: "POST /api/appointments/${appt}/transition"
              payload: { to_status: "COMPLETED", measured_linear_feet: 200 }
              as: Admin
            - call: "GET /api/leads/${lead}"
              payload: {}
              as: Admin
              captures: { lv: "$.data.version" }
            - call: "POST /api/quotes"
              payload: { lead_id: "${lead}", appointment_id: "${appt}", sales_rep_id: "${rep}", product_id: "${pid}", color: "WHITE", estimated_linear_feet: 200, downspout_count: 0, discount_pct: 0, expected_lead_version: "${lv}" }
              as: Admin
              captures: { qid: "$.data.id" }
            - call: "POST /api/quotes/${qid}/present"
              payload: {}
              as: Admin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: Admin
          trigger:
            - call: "POST /api/quotes/${qid}/transition"
              payload: { to_status: "ACCEPTED" }
              as: Admin
          assert:
            - "HTTP 409 ERR_QUOTE_EXPIRED (2026-06-15 > presented_at 2026-05-01 + 30d)"

      - name: weather_hold_cycle_recovers_to_scheduled
        claim_type: side_effect_execution
        grounds: [state_machines.Job.SCHEDULED_to_WEATHER_HOLD, state_machines.Job.WEATHER_HOLD_to_SCHEDULED, entities.Crew.fields.booked_days]
        distinguishing_aspect: "SCHEDULED->WEATHER_HOLD releases the crew-day reservation (booked_days 2->0); rescheduling WEATHER_HOLD->SCHEDULED re-reserves (0->2), closing the cycle."
        test_recipe:
          setup: ["A SCHEDULED job1 (install_days 2) on crew C, booked_days == 2"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { name: "MicroMesh", category: "LEAF_GUARD", base_rate_cents_per_foot: 3000, available_colors: ["WHITE","COPPER"], premium_colors: ["COPPER"], color_surcharge_cents_per_foot: 500 }
              as: Admin
              captures: { pid: "$.data.id" }
            - call: "POST /api/sales-reps"
              payload: { full_name: "Rep A", region: "NE" }
              as: Admin
              captures: { rep: "$.data.id" }
            - call: "POST /api/crews"
              payload: { name: "Crew C", region: "NE", is_certified_leaf_guard: true }
              as: Admin
              captures: { crew: "$.data.id" }
            - call: "POST /api/leads"
              payload: { full_name: "HO", address: "11 St", phone: "555-0011", region: "NE", sales_rep_id: "${rep}" }
              as: Admin
              captures: { lead: "$.data.id" }
            - call: "POST /api/appointments"
              payload: { lead_id: "${lead}", sales_rep_id: "${rep}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Admin
              captures: { appt: "$.data.id" }
            - call: "POST /api/appointments/${appt}/transition"
              payload: { to_status: "COMPLETED", measured_linear_feet: 210 }
              as: Admin
            - call: "GET /api/leads/${lead}"
              payload: {}
              as: Admin
              captures: { lv: "$.data.version" }
            - call: "POST /api/quotes"
              payload: { lead_id: "${lead}", appointment_id: "${appt}", sales_rep_id: "${rep}", product_id: "${pid}", color: "WHITE", estimated_linear_feet: 210, downspout_count: 0, discount_pct: 0, expected_lead_version: "${lv}" }
              as: Admin
              captures: { qid: "$.data.id" }
            - call: "POST /api/quotes/${qid}/present"
              payload: {}
              as: Admin
            - call: "POST /api/quotes/${qid}/transition"
              payload: { to_status: "ACCEPTED" }
              as: Admin
