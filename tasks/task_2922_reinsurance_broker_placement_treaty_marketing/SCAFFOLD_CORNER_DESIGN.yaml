      - name: the_identity_that_books_a_fiduciary_movement_can_never_approve_it
        claim_type: Segregation of duties
        grounds:
          - validations[priority=42] ERR_SEGREGATION_OF_DUTIES
          - state_machines.FiduciaryTransaction PENDING -> APPROVED
          - roles.BrokerAccountant.shared_operations
          - roles.ComplianceOfficer.shared_operations
        distinguishing_aspect: |
          The check compares X-User-ID against created_by_user_id, so it is about identities and not
          about roles — which is exactly what an implementation that guards the approve endpoint by
          role instead of by user gets wrong in both directions. acct-1 must be refused on its own
          booking even though BrokerAccountant is on the endpoint's roles list, and acct-2 must be
          allowed on acct-1's booking even though it wears the same role. The duty separated is the
          approval alone: the booker may still settle what someone else approved. And once the row
          has moved on, the state band at priority 29 answers before the segregation check at 42, so
          a second self-approval attempt reports the wrong state rather than the wrong person.
        test_recipe:
          setup:
            - "One cedent and one program. Two accounting identities exist: acct-1 and acct-2. One compliance identity: compl-1."
            - "No documentation is filed, which is deliberate: CEDENT_RECEIPT inflows are not gated by contract certainty, so nothing but the duty rules is in play."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /cedents"
              payload: { name: "Fourfold Mutual", domicile_code: "USNYC", financial_rating: "A" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ced_id: $.data.id }
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Fourfold Property CAT 2026", line_of_business: "PROPERTY", underwriting_year: 2026, inception_date: "2026-01-01T00:00:00.000Z", expiry_date: "2027-01-01T00:00:00.000Z", estimated_premium_income_minor: 500000000, brokerage_pct: 2.5000 }
              as: BrokerPlacementLead
              as_user_id: "lead-1"
              captures: { prog_id: $.data.id }
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: BrokerAccountant
              as_user_id: "acct-1"
              captures: { pv1: $.data.version }
            - call: "POST /programs/${prog_id}/fiduciary-transactions"
              payload: { txn_type: "CEDENT_RECEIPT", amount_minor: 50000000, expected_program_version: "${pv1}" }
              as: BrokerAccountant
              as_user_id: "acct-1"
              captures: { txn1: $.data.id, txn1_booker: $.data.created_by_user_id, txn1_state0: $.data.status }
          trigger:
            - call: "POST /fiduciary-transactions/${txn1}/approve"
              payload: {}
              as: BrokerAccountant
              as_user_id: "acct-1"
              captures: { e_self: $.data.error_id }
            - call: "GET /fiduciary-transactions/${txn1}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compl-1"
              captures: { txn1_state1: $.data.status, txn1_appr1: $.data.approved_by_user_id }
            - call: "POST /fiduciary-transactions/${txn1}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compl-1"
              captures: { txn1_state2: $.data.status, txn1_appr2: $.data.approved_by_user_id }
            - call: "POST /fiduciary-transactions/${txn1}/approve"
              payload: {}
              as: BrokerAccountant
              as_user_id: "acct-1"
              captures: { e_self_again: $.data.error_id }
            - call: "POST /fiduciary-transactions/${txn1}/settle"
              payload: {}
              as: BrokerAccountant
              as_user_id: "acct-1"
              captures: { txn1_state3: $.data.status }
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: BrokerAccountant
              as_user_id: "acct-1"
              captures: { pv2: $.data.version, hold1: $.data.fiduciary_holding_minor }
            - call: "POST /programs/${prog_id}/fiduciary-transactions"
              payload: { txn_type: "CEDENT_RECEIPT", amount_minor: 20000000, expected_program_version: "${pv2}" }
              as: BrokerAccountant
              as_user_id: "acct-1"
              captures: { txn2: $.data.id }
            - call: "POST /fiduciary-transactions/${txn2}/approve"
              payload: {}
              as: BrokerAccountant
              as_user_id: "acct-1"
              captures: { e_self2: $.data.error_id }
            - call: "POST /fiduciary-transactions/${txn2}/approve"
              payload: {}
              as: BrokerAccountant
              as_user_id: "acct-2"
              captures: { txn2_state1: $.data.status, txn2_appr: $.data.approved_by_user_id }
            - call: "POST /fiduciary-transactions/${txn2}/settle"
              payload: {}
              as: BrokerAccountant
              as_user_id: "acct-1"
              captures: { txn2_state2: $.data.status }
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: BrokerAccountant
              as_user_id: "acct-1"
              captures: { hold2: $.data.fiduciary_holding_minor }
            - call: "GET /programs/${prog_id}/fiduciary-transactions"
              payload: { status: "SETTLED" }
              as: ComplianceOfficer
              as_user_id: "compl-1"
              captures: { first_settled: "$.data[0].id" }
          assert:
            - "${txn1_booker} == acct-1 and ${txn1_state0} == PENDING"
            - "${e_self} == ERR_SEGREGATION_OF_DUTIES with HTTP 422, and ${txn1_state1} == PENDING with ${txn1_appr1} == null — the refusal is total, not a soft warning that still stamps the approver"
            - "${txn1_state2} == APPROVED with ${txn1_appr2} == compl-1 — a different identity clears the same row"
            - "${e_self_again} == ERR_TRANSACTION_STATE_INVALID, not ERR_SEGREGATION_OF_DUTIES — the state band at priority 29 answers before the duty check at 42, so the booker retrying learns the row has moved on"
            - "${txn1_state3} == SETTLED with ${hold1} == 50000000 — the duty separated is approval alone, so the booker may still move the money"
            - "${e_self2} == ERR_SEGREGATION_OF_DUTIES — the rule is per row, not a one-off"
            - "${txn2_state1} == APPROVED with ${txn2_appr} == acct-2 — a second identity of the *same* role is a valid second pair of eyes, proving the check compares X-User-ID against created_by_user_id and not role against role"
            - "${txn2_state2} == SETTLED, ${hold2} == 70000000, and the SETTLED-filtered ledger returns 2 rows with total_count 2 whose first row ${first_settled} == ${txn1}"

  - section: cross_cutting_complexity_layers
    instances:
      - name: firm_order_optimistic_concurrency_on_the_layer_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.firm-order-stale-layer
          - validations[priority=35] ERR_STALE_LAYER_VERSION
          - endpoints POST /quotes/{quote_id}/firm-order (expected_layer_version)
        distinguishing_aspect: |
          Oversubscription is legitimate here, so a second firm order on the same layer is a valid
          business act — which means the stale-version check is the *only* signal that the layer's
          placed capacity moved under the broker's feet, and an implementation that quietly ignores
          expected_layer_version still passes every placement test. The corner therefore pins three
          things at once: a version read before another broker's firm order is refused with 412 and
          mutates nothing; a version from the future is refused just as hard (the check is equality,
          not "at least"); and the version advances only on writes that actually touch the Layer row,
          so the second market submission on an already-IN_MARKET layer leaves it alone. It also
          pins where 412 sits in the ladder: after shape and existence, and after the quote's own
          state check, so a lapsed quote reports its state rather than the version.
        test_recipe:
          setup:
