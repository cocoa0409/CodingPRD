          setup:
            - "advertiser (AUTOMOTIVE to avoid separation interplay), program (weekday 6), week, unit (2026-08-08, 120s)"
            - "approved order line 30s x 2 (guarantee 0); spots s1, s2 pending; unit version captured at creation"
          setup_api_calls:
            - call: "POST /traffic/advertisers"
              payload: { name: "OCC2", product_category: "AUTOMOTIVE", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { adv_id: "$.data.id"}
            - call: "POST /traffic/programs"
              payload: { title: "OCC2 P", daypart_code: "PRIME", airs_weekday: 6, start_time_local: "20:00", duration_minutes: 60, rating_estimate: 5.0 }
              as: TrafficManager
              captures: { prog_id: "$.data.id"}
            - call: "POST /traffic/avail-weeks"
