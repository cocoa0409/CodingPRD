        excluded_because:
          difficulty_instance: corridor_priority_score_screening_vs_programming_variant_divergence
          rationale: "corridor_avg_plan_age_days and corridor_priority_score share one variant switch (BLOCKED members excluded under screening, included under programming). That §1.8 dual_variant_calc instance drives both variants over the same corridor and asserts the two different scores plus the priority_score_variant label, which is exactly the Variant Divergence and Variant Selection claim for this pair of calculations."

      - name: performance_metrics_variant_selection_and_included_run_set
        claim_type: variant_selection
        excluded_because:
          difficulty_instance: performance_evaluation_provisional_unweighted_vs_certified_weighted_variants
          rationale: "corridor_performance_metrics is the scaffold's other dual-variant calculation: the provisional variant admits every AFTER run while the certified variant admits only runs recorded at or after last_tuning_completed_at. That §1.8 instance certifies an evaluation over a deliberately mixed run set and asserts both the metric deltas and included_after_run_count, consuming the Variant Selection and Reconciliation rows together."

      - name: split_rescale_residual_lands_on_one_phase_only
        claim_type: correct_result
        excluded_because:
          difficulty_instance: split_rescale_round_each_phase_then_apply_single_residual
          rationale: "timing_plan_split_rescale is a waterfall_allocation whose whole difficulty is the pinned round-each-phase-then-single-residual order and the greatest-min_green residual recipient. That §1.8 combinatorial_formula instance already contrasts the correct order against both wrong orders on a 4-phase and a 2-phase plan; the offset instance above independently re-checks the negative-residual case."

      - name: pedestrian_clearance_boundary_and_pinned_sub_check_order
        claim_type: precision
        excluded_because:
          difficulty_instance: pedestrian_clearance_tenth_of_a_second_equality_passes_one_tenth_below_fails
          rationale: "pedestrian_clearance_requirement's ceiling-to-the-tenth, its equality-passes semantics and the PED_CLEAR_SHORT -> WALK_SHORT -> PHASE_TOO_SHORT ordering are the entire content of that §1.8 boundary_precision_check instance, which tests 17.8 exactly, 17.7 one tenth low, and the APS-driven walk requirement."

      - name: coordinate_pipeline_step_ordering_is_observable
        claim_type: correct_result
        excluded_because:
          difficulty_instance: coordinate_pipeline_step3_then_step4_then_step6_order_flips_ped_result
          rationale: "The eight-step coordinate pipeline's cross-calculation ordering (cycle overwrite feeds the rescale, whose effective splits feed the pedestrian evaluation) is the subject of that §1.8 combinatorial_formula instance, which shows the same inputs producing COMPLIANT under the correct order and NON_COMPLIANT when the pedestrian check is run against the drafted splits instead."

  # =============================================================================================
  # SECTION 4 — validations
  # Walks Table-4's Violation -> Error, Satisfaction -> Pass and Priority Ordering rows plus the
  # cross-entity, temporal, aggregate and conditional validation patterns over §1.4's 35
  # priority-ordered entries.
  # =============================================================================================
  - section: validations
    instances:
      - name: gate_ladder_from_auth_to_pagination_rejected_in_priority_order
        claim_type: priority_ordering
        grounds:
          - validations[priority 1 ERR_UNAUTHENTICATED]
          - validations[priority 2 ERR_UNKNOWN_ROLE]
          - validations[priority 10 ERR_ROLE_NOT_PERMITTED]
          - validations[priority 20 ERR_*_NOT_FOUND]
          - validations[priority 30 ERR_INVALID_REQUEST]
          - validations[priority 35 ERR_INVALID_PAGINATION]
        distinguishing_aspect: "Every request in the trigger violates at least two gates at once, and the answer is always the numerically lower priority: a headerless request with limit 0 is ERR_UNAUTHENTICATED not ERR_INVALID_PAGINATION, an unknown role with limit 0 is ERR_UNKNOWN_ROLE, a forbidden role with a malformed body is ERR_ROLE_NOT_PERMITTED not ERR_INVALID_REQUEST, and an unknown parent id with both a bad body and a bad limit is the 404. The last two calls pin ERR_INVALID_PAGINATION's own boundaries (limit 100 and offset 0 are legal; limit 101 is not)."
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "One corridor exists so that the legal list call has something to return."
          setup_api_calls:
            - call: "POST /signal-ops/corridors"
              payload: { name: "Main St 1st-3rd", jurisdiction_class: "ARTERIAL", annual_volume_change_pct: 20.0 }
              as: SignalOpsAdmin
              captures: { c1_id: $.data.id }
          trigger:
            - call: "GET /signal-ops/corridors"
              payload: { limit: 0 }
              as: "(no X-User-Role / X-User-ID headers sent)"
              captures: { e_unauth: $.data.error_id }
            - call: "GET /signal-ops/corridors"
              payload: { limit: 0 }
              as: "TrafficIntern (not one of the six declared roles)"
              captures: { e_unknown_role: $.data.error_id }
            - call: "POST /signal-ops/corridors"
              payload: { name: "Second St", annual_volume_change_pct: "not-a-number" }
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { e_role: $.data.error_id }
            - call: "GET /signal-ops/corridors/11111111-1111-4111-8111-111111111111/members"
              payload: { limit: 0 }
              as: SignalOpsAdmin
              captures: { e_404_over_pagination: $.data.error_id }
            - call: "POST /signal-ops/corridors/11111111-1111-4111-8111-111111111111/members"
              payload: { sequence_index: "one" }
              as: SignalOpsAdmin
              captures: { e_404_over_body: $.data.error_id }
            - call: "POST /signal-ops/corridors"
              payload: { name: "Third St", jurisdiction_class: "BOULEVARD", annual_volume_change_pct: 5.0 }
              as: SignalOpsAdmin
              captures: { e_invalid: $.data.error_id }
            - call: "GET /signal-ops/corridors"
              payload: { limit: 101 }
              as: SignalOpsAdmin
              captures: { e_pag_high: $.data.error_id }
            - call: "GET /signal-ops/corridors"
              payload: { offset: -1 }
              as: SignalOpsAdmin
              captures: { e_pag_offset: $.data.error_id }
            - call: "GET /signal-ops/corridors"
              payload: { limit: 100, offset: 0 }
              as: SignalOpsAdmin
              captures: { ok_total: $.total_count, ok_first: "$.data[0].id" }
          assert:
            - "${e_unauth} == ERR_UNAUTHENTICATED with HTTP 401 — priority 1 pre-empts the pagination gate at 35"
            - "${e_unknown_role} == ERR_UNKNOWN_ROLE with HTTP 401 — priority 2 pre-empts 35"
            - "${e_role} == ERR_ROLE_NOT_PERMITTED with HTTP 403 — priority 10 pre-empts the missing jurisdiction_class and the non-numeric volume at 30"
            - "${e_404_over_pagination} == ERR_CORRIDOR_NOT_FOUND with HTTP 404 — priority 20 pre-empts 35"
            - "${e_404_over_body} == ERR_CORRIDOR_NOT_FOUND with HTTP 404 — priority 20 pre-empts 30, so the missing intersection_id is never reported"
            - "${e_invalid} == ERR_INVALID_REQUEST with HTTP 422 — BOULEVARD is outside the jurisdiction_class enum"
            - "${e_pag_high} == ERR_INVALID_PAGINATION and ${e_pag_offset} == ERR_INVALID_PAGINATION, both HTTP 422"
            - "the limit 100 / offset 0 call returns HTTP 200 with ${ok_total} == 1 and ${ok_first} == ${c1_id} — both values sit exactly on the legal edge of the pagination contract"

      - name: min_green_gate_passes_at_exact_equality_then_fails_after_a_half_second_patch
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority 58 ERR_MIN_GREEN_VIOLATION]
          - endpoints[POST /signal-ops/timing-plans/{id}/submit]
          - endpoints[POST /signal-ops/timing-plans/{id}/return]
          - endpoints[PATCH /signal-ops/phase-splits/{id}]
        distinguishing_aspect: "The min-green gate compares the EFFECTIVE split against min_green + yellow + red_clearance with a >= test: phase 1's effective 24 s exactly equals its 20 + 3.0 + 1.0 requirement, so the submit is accepted; after the plan is returned to DRAFT and yellow is nudged to 3.5 the requirement becomes 24.5 against the same effective 24 and the identical submit is refused. An implementation that compared against the drafted 21 s split, or that used a strict >, would reject the first submit too."
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "CHAIN-IMPL through coordinate: i1 (max_cycle_length_sec 150) is the sole member of SELECTED corridor c1, project p1 is in PLAN_DEVELOPMENT, plan tp1 is MASTER with drafted cycle 90 and phases 1/2/4/6 at 21/30/22/22, phase 1 carrying the largest min_green (20 s) so it also receives the rescale residual."
          setup_api_calls:
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Main St @ 1st Ave", controller_type: "TS2_CABINET", max_cycle_length_sec: 150 }
              as: SignalOpsAdmin
              captures: { i1_id: $.data.id }
            - call: "POST /signal-ops/corridors"
              payload: { name: "Main St 1st-3rd", jurisdiction_class: "ARTERIAL", annual_volume_change_pct: 20.0 }
              as: SignalOpsAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /signal-ops/corridors/${c1_id}/members"
              payload: { intersection_id: "${i1_id}", sequence_index: 1, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c1_id}/screen"
              payload: {}
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c1_id}/selection-decision"
              payload: { decision: "SELECT", rationale: "Programme corridor" }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/retiming-projects"
              payload: { corridor_id: "${c1_id}", study_window_start_at: "2026-07-01T00:00:00Z", study_window_days: 180, lead_engineer_user_id: "eng-1" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { p1_id: $.data.id }
            - call: "POST /signal-ops/intersections/${i1_id}/turning-movement-counts"
              payload: { project_id: "${p1_id}", study_role: "BEFORE", count_date: "2026-07-15T00:00:00Z", period: "AM_PEAK", phase_volumes: { "1": 350, "2": 500, "4": 250, "6": 180 } }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/travel-time-runs"
              payload: { study_role: "BEFORE", direction: "NB", started_at: "2026-07-15T09:00:00Z", duration_sec: 320, stops_count: 5, arrivals_on_green_count: 4, total_arrivals: 12 }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/advance"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { p1_v_adv: $.data.version }
            - call: "POST /signal-ops/timing-plans"
              payload: { project_id: "${p1_id}", intersection_id: "${i1_id}", tod_period: "AM_PEAK", tod_start_min: 360, tod_end_min: 540, cycle_length_sec: 90, coordination_ref: "MASTER", expected_project_version: "${p1_v_adv}" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { tp1_id: $.data.id }
            - call: "POST /signal-ops/timing-plans/${tp1_id}/phase-splits"
              payload: { phase_number: 1, split_sec: 21, min_green_sec: 20, yellow_sec: 3.0, red_clearance_sec: 1.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { ps1_id: $.data.id }
            - call: "POST /signal-ops/timing-plans/${tp1_id}/phase-splits"
              payload: { phase_number: 2, split_sec: 30, min_green_sec: 15, yellow_sec: 3.0, red_clearance_sec: 1.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/timing-plans/${tp1_id}/phase-splits"
              payload: { phase_number: 4, split_sec: 22, min_green_sec: 10, yellow_sec: 3.0, red_clearance_sec: 1.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/timing-plans/${tp1_id}/phase-splits"
              payload: { phase_number: 6, split_sec: 22, min_green_sec: 10, yellow_sec: 3.0, red_clearance_sec: 1.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/coordinate"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "GET /signal-ops/timing-plans/${tp1_id}/phase-splits"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { eff_p1_before: "$.data[0].effective_split_sec" }
          trigger:
            - call: "POST /signal-ops/timing-plans/${tp1_id}/submit"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { st_ok: $.data.status, ped_ok: $.data.ped_compliance_state }
            - call: "POST /signal-ops/timing-plans/${tp1_id}/return"
              payload: { reason: "Nudge the phase 1 yellow interval." }
              as: CertifyingEngineer
              as_user_id: "cert-1"
              captures: { st_returned: $.data.status, cyc_returned: $.data.cycle_length_sec, ret_count: $.data.return_count }
            - call: "PATCH /signal-ops/phase-splits/${ps1_id}"
              payload: { yellow_sec: 3.5 }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { ps1_yellow: $.data.yellow_sec, ps1_eff_after_patch: $.data.effective_split_sec }
            - call: "POST /signal-ops/retiming-projects/${p1_id}/coordinate"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/timing-plans/${tp1_id}/submit"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { e_min_green: $.data.error_id }
            - call: "GET /signal-ops/timing-plans/${tp1_id}"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { st_after_reject: $.data.status }
          assert:
            - "${eff_p1_before} == 24 — 21 * 105 / 95 == 23.2105 rounds to 23 and the +1 residual lands on phase 1 as the greatest-min_green phase"
            - "${st_ok} == SUBMITTED and ${ped_ok} == COMPLIANT — the satisfaction case: 24 >= 20 + 3.0 + 1.0 holds with equality, and no pedestrian phase means an empty check set is compliant"
            - "${st_returned} == DRAFT, ${cyc_returned} == 90 and ${ret_count} == 1 — the return compensates the pipeline so the split may be patched"
            - "${ps1_yellow} == 3.5 and ${ps1_eff_after_patch} == 21 — the PATCH resets effective_split_sec to the drafted split"
            - "the second submit returns HTTP 422 with ${e_min_green} == ERR_MIN_GREEN_VIOLATION: the re-coordinated effective 24 is now below the 24.5 requirement"
            - "${st_after_reject} == COORDINATED — a rejected submit writes nothing, so the plan does not advance and TimingPlan.version does not move for the failed call"

      - name: before_study_completeness_is_an_aggregate_over_every_eligible_member
        claim_type: aggregate_validation
        grounds:
          - validations[priority 60 ERR_BEFORE_STUDY_INCOMPLETE]
          - endpoints[POST /signal-ops/retiming-projects/{id}/advance]
          - entities.RetimingProject.fields.eligible_member_count
        distinguishing_aspect: "The gate is a universally quantified aggregate, not an existence check: with two eligible members and a BEFORE count on only one of them the advance is refused even though counts and runs both exist, and a BEFORE run with study_role AFTER does not satisfy the run half of the predicate either. Only once every eligible member has a BEFORE count AND at least one BEFORE run exists does the same call succeed."
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "Corridor c1 (ARTERIAL) holds two READY members i1 and i2; the corridor is SELECTED and project p1 is in DATA_COLLECTION."
          setup_api_calls:
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Main St @ 1st Ave", controller_type: "TS2_CABINET", max_cycle_length_sec: 150 }
              as: SignalOpsAdmin
              captures: { i1_id: $.data.id }
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Main St @ 3rd Ave", controller_type: "TS2_CABINET", max_cycle_length_sec: 150 }
              as: SignalOpsAdmin
              captures: { i2_id: $.data.id }
            - call: "POST /signal-ops/corridors"
              payload: { name: "Main St 1st-3rd", jurisdiction_class: "ARTERIAL", annual_volume_change_pct: 20.0 }
              as: SignalOpsAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /signal-ops/corridors/${c1_id}/members"
              payload: { intersection_id: "${i1_id}", sequence_index: 1, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c1_id}/members"
              payload: { intersection_id: "${i2_id}", sequence_index: 2, distance_from_prev_ft: 2640 }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c1_id}/screen"
              payload: {}
              as: SignalOpsAdmin
              captures: { mc: $.data.member_count }
            - call: "POST /signal-ops/corridors/${c1_id}/selection-decision"
              payload: { decision: "SELECT", rationale: "Programme corridor" }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/retiming-projects"
              payload: { corridor_id: "${c1_id}", study_window_start_at: "2026-07-01T00:00:00Z", study_window_days: 180, lead_engineer_user_id: "eng-1" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { p1_id: $.data.id, p1_status0: $.data.status, elig: $.data.eligible_member_count }
          trigger:
            - call: "POST /signal-ops/retiming-projects/${p1_id}/advance"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { e_empty: $.data.error_id }
            - call: "POST /signal-ops/intersections/${i1_id}/turning-movement-counts"
              payload: { project_id: "${p1_id}", study_role: "BEFORE", count_date: "2026-07-15T00:00:00Z", period: "AM_PEAK", phase_volumes: { "1": 350, "2": 500, "4": 250, "6": 180 } }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/travel-time-runs"
              payload: { study_role: "AFTER", direction: "NB", started_at: "2026-07-15T09:00:00Z", duration_sec: 300, stops_count: 3, arrivals_on_green_count: 8, total_arrivals: 12 }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/advance"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { e_one_member: $.data.error_id }
            - call: "POST /signal-ops/intersections/${i2_id}/turning-movement-counts"
              payload: { project_id: "${p1_id}", study_role: "BEFORE", count_date: "2026-07-16T00:00:00Z", period: "AM_PEAK", phase_volumes: { "1": 350, "2": 500, "4": 250, "6": 180 } }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/advance"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { e_no_before_run: $.data.error_id }
            - call: "POST /signal-ops/retiming-projects/${p1_id}/travel-time-runs"
              payload: { study_role: "BEFORE", direction: "NB", started_at: "2026-07-16T09:00:00Z", duration_sec: 320, stops_count: 5, arrivals_on_green_count: 4, total_arrivals: 12 }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/advance"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { st_final: $.data.status, v_final: $.data.version }
          assert:
            - "${mc} == 2 on the corridor and ${elig} == 2 frozen onto the project at creation, with ${p1_status0} == DATA_COLLECTION"
            - "${e_empty} == ERR_BEFORE_STUDY_INCOMPLETE with HTTP 409 — nothing has been collected"
            - "${e_one_member} == ERR_BEFORE_STUDY_INCOMPLETE — i2 still has no BEFORE count, so the per-member universal quantifier fails even though one count exists"
            - "${e_no_before_run} == ERR_BEFORE_STUDY_INCOMPLETE — both members are now covered, but the only run is study_role AFTER, so the run predicate is unsatisfied"
            - "${st_final} == PLAN_DEVELOPMENT and ${v_final} == 2 — the satisfaction case advances the project exactly once; the three refused calls left version at 1"

      - name: study_window_expiry_is_inclusive_at_the_boundary_instant
        claim_type: temporal_validation
        grounds:
          - validations[priority 65 ERR_STUDY_WINDOW_EXPIRED]
          - errors.ERR_STUDY_WINDOW_EXPIRED
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "The window closes AT study_window_start_at + study_window_days, not after it: with a 10-day window opening 2026-08-01T00:00:00Z, an advance at 2026-08-10T23:59:59Z succeeds and the identical advance on an identical sibling project at 2026-08-11T00:00:00Z is refused. Two parallel projects on two corridors isolate the two clock readings from each other, so the difference cannot be explained by the first project having already advanced."
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "Two ARTERIAL corridors cA and cB each hold the same READY intersection iShared (the graph topology permits it); both are SELECTED and each carries one project with study_window_start_at 2026-08-01T00:00:00Z and study_window_days 10."
            - "Both projects have a complete BEFORE study so that the priority-60 gate is satisfied and only the priority-65 temporal gate can speak."
          setup_api_calls:
            - call: "POST /signal-ops/intersections"
