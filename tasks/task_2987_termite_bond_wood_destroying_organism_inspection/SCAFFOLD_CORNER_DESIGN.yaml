          difficulty_instance: cross_entity_state_dependency / bond_issuance_gated_on_treatment_plan_reaching_completed
          rationale: "That instance already drives POST /bonds against PROPOSED, APPROVED and ABANDONED plans and pins the 409 ERR_PLAN_NOT_COMPLETED for each, then shows the same call succeeding once the plan reaches COMPLETED."

      - name: second_bond_on_a_property_that_already_holds_one
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DUPLICATE_ACTIVE_BOND]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / property_bond_coverage_occupancy_persists_through_lapse
          rationale: "That instance pins ERR_DUPLICATE_ACTIVE_BOND for both occupancy states — ACTIVE and LAPSED — and shows the slot freeing only on TERMINATED."

      - name: station_service_and_reinstatement_codes_are_each_reachable_on_one_bond
        claim_type: error_triggerable
        grounds:
          - errors[ERR_SERVICE_TIME_INVALID]
          - errors[ERR_INVALID_STATION_STATE]
          - errors[ERR_REINSTATEMENT_PAYMENT_INSUFFICIENT]
          - errors[ERR_REINSTATEMENT_INSPECTION_STALE]
          - errors[ERR_REINSTATEMENT_WINDOW_EXPIRED]
          - validations[priority=115]
          - validations[priority=116]
          - validations[priority=118]
        distinguishing_aspect: >-
          Four codes with four different statuses (422 / 409 / 402 / 422) fire on the SAME bond as the
          logical clock walks forward, and the last pair proves the priority order: at 2027-12-05 the
          graph is BOTH stale and the window BOTH closed, and the answer is the window code (115)
          rather than the staleness code (116). ERR_SERVICE_TIME_INVALID is reachable on the very
          first service because last_serviced_at is seeded from the plan's completion instant, not
          left null.
        test_recipe:
          setup:
            - "P1 SLAB / FL with a COMPLETED BAIT_STATION plan and its installed stations; clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { address_line1: "9 Marsh Lane", state_code: "FL", construction_type: "SLAB", square_footage: 1800, linear_footage: 160, year_built: 2001 }
              as: ComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Rosa Vance", license_number: "FL-10001", license_state: "FL", license_categories: ["WDO_INSPECTOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { i1: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Dale Ortiz", license_number: "FL-10002", license_state: "FL", license_categories: ["TERMITE_APPLICATOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { a1: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${i1}", purpose: "INITIAL", scheduled_start_at: "2026-08-01T13:00:00Z", scheduled_end_at: "2026-08-01T15:00:00Z" }
              as: FieldInspector
              as_user_id: "${i1}"
              captures: { ins1: $.data.id }
            - call: "POST /inspections/${ins1}/graph-complete"
              payload: { no_findings_attested: true }
              as: FieldInspector
              as_user_id: "${i1}"
            - call: "POST /treatment-plans"
              payload: { property_id: "${p1}", inspection_id: "${ins1}", applicator_id: "${a1}", method: "BAIT_STATION", chemical_product_code: "HEXA_BAIT_2" }
              as: BranchManager
              captures: { pl1: $.data.id }
            - call: "POST /treatment-plans/${pl1}/approve"
              payload: {}
              as: BranchManager
            - call: "GET /treatment-plans/${pl1}"
              payload: {}
              as: BranchManager
              captures: { v1: $.data.version }
            - call: "POST /treatment-plans/${pl1}/applications"
