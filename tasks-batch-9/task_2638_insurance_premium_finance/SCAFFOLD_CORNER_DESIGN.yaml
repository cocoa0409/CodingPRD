  - section: state_machines
    instances:

      - name: valid_transition_draft_to_pending_verification_on_submit
        claim_type: valid_transition
        grounds:
          - state_machines.PremiumFinanceAgreement.DRAFT_to_PENDING_VERIFICATION
          - endpoints.POST_agreements_agreement_id_submit
          - calculations.finance_charge_and_amount_financed
        distinguishing_aspect: |
          The declared happy-path transition fires and writes its whole side-effect list in one call:
          status DRAFT -> PENDING_VERIFICATION, the provisional quote, quote_basis = PROVISIONAL, the
          StateRateRule counter, and the version bump. The probe is that NO Installment row exists
          yet — the schedule is a side effect of ACTIVATION, not of submission, so an implementation
          that generates it early is caught here rather than at payment time.
        test_recipe:
          setup:
            - "the canonical TX regime with an effective License, one Insured, one ProducerAgent, one Insurer"
            - "one DRAFT agreement carrying the 600k note's parameters and one PENDING_VERIFICATION 600000 policy"
