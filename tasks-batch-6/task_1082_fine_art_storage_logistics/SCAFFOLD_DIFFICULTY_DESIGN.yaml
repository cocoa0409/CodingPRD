              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CREW_UNAVAILABLE"
            - "response.http_status == 409"

      - name: room_halfopen_adjacency
        grounds:
          - validations[priority=18]
          - entities.ViewingBooking.fields.viewing_room_id
          - state_machines.ViewingBooking.REQUESTED_to_CONFIRMED
        distinguishing_aspect: |
          ViewingRoom overlap uses half-open [start, end) intervals with NO buffer: booking1
          14:00-15:00 CONFIRMED and booking2 15:00-16:00 are adjacent (end==start), which is NOT
          an overlap, so confirming booking2 succeeds — distinct interval semantics from the crew.
        test_recipe:
