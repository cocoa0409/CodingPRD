          - errors.ERR_CREW_TIER_INSUFFICIENT
          - errors.ERR_CREW_DEALER_MISMATCH
          - calculations.crew_certification_envelope
        distinguishing_aspect: |
          A different error-category pair - business_safety (priority 12) versus
          business_referential (priority 16) - and both errors carry HTTP 422, so the status code
          cannot distinguish them and only error_id can. One assign-crew request violates both: a
          T1 crew (max_diameter_m 9.5) is offered for a 15.5 m bin AND that crew belongs to a
          different dealership. The safety envelope wins. Swapping in a T3 crew of the same wrong
          dealership repairs only priority 12 and surfaces ERR_CREW_DEALER_MISMATCH.
        test_recipe:
          setup:
            - "Jurisdiction NE-WEST (seal_required false), GrainProfile CORN, CoatingSpec G115, engineer PE-1001."
            - "Dealer Alpha (NE-01) and Dealer Pinnacle (NE-02), both with credit_limit_cents 900000000."
