            - { call: "POST /api/flush-records", payload: { line_id: "${line_id}", flush_material_ingredient_id: "${hulls_id}", quantity_tons: 0.4 }, as: Operator, as_user_id: "${op_id}", captures: { err_qty: $.data.error_id } }
            - { call: "POST /api/flush-records", payload: { line_id: "${line_id}", flush_material_ingredient_id: "${hulls_id}", quantity_tons: 0.5 }, as: Operator, as_user_id: "${op_id}", captures: { fl_id: $.data.id } }
