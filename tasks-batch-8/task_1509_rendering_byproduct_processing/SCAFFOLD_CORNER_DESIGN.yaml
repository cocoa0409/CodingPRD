            - { call: "POST /rendering/inbound-batches", payload: { plant_id: "${plant_id}", supplier_id: "${sup_id}", agreement_id: "${agr_id}", species: "OVINE", weight_lbs: 3000, temperature_f: 60.0, received_at: "2026-08-03T09:00:00Z" }, as: ScalehouseOperator, as_user_id: "sh-1", captures: { b_ovi: $.data.id } }
