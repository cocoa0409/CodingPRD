# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Actuarial Reserving & Loss Triangle Analysis
# Breadth walk over §1.1–§1.7 per references/claim-extraction-guide.md.
# Corners already exercised by §1.8 appear as excluded_because stubs.
# "Main Book shared fixture" refers to the arithmetic documented at the top of
# SCAFFOLD_DIFFICULTY_DESIGN.yaml (claims C-A/C-B/C-D, factors [1.25, 1.25]).
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  # From Table 1 (Entities)
  # ===========================================================================
  - section: entities
    instances:
      - name: segment_creation_applies_defaults
        claim_type: creation_and_defaults
        grounds:
          - entities.ReservingSegment
          - entities.ReservingSegment.fields.last_closed_quarter
        distinguishing_aspect: "A newly created segment carries last_closed_quarter == null (no study approved yet) and version == 1; all five input fields echo back."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /actuarial/segments"
              payload: { name: "New Book", line_of_business: "PROPERTY", large_loss_threshold_cents: 250000, max_range_width_pct: 0.8, benchmark_open_severity_cents: 30000 }
              as: AppointedActuary
              captures: { seg: $.data.id, closed_q: $.data.last_closed_quarter, ver: $.data.version }
          assert:
            - "ReservingSegment.${seg}.last_closed_quarter == null"
            - "ReservingSegment.${seg}.version == 1 and created_at is server-stamped"
            - "Response code 201"
      - name: claim_create_missing_required_field_returns_400
        claim_type: required_fields
        grounds:
          - entities.Claim.fields.accident_date
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=3]
        distinguishing_aspect: "Omitting required accident_date is rejected with ERR_INVALID_REQUEST (400) before any existence or state check."
        test_recipe:
          setup: ["Segment exists"]
          setup_api_calls:
            - call: "POST /actuarial/segments"
              payload: { name: "Req Book", line_of_business: "PROPERTY", large_loss_threshold_cents: 250000, max_range_width_pct: 0.8, benchmark_open_severity_cents: 30000 }
              as: AppointedActuary
              captures: { seg: $.data.id }
          trigger:
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "C-X", report_date: "2025-01-20" }
              as: ClaimsExaminer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST and HTTP status 400"
      - name: claim_create_with_server_managed_field_returns_400
        claim_type: computed_fields_server_authoritative
        grounds:
          - entities.Claim.fields.paid_to_date_cents
          - validations[priority=3]
        distinguishing_aspect: "Supplying the computed field paid_to_date_cents in a create body is rejected (server-managed fields are not client-writable), rather than silently honored."
        test_recipe:
          setup: ["Segment exists"]
          setup_api_calls:
            - call: "POST /actuarial/segments"
              payload: { name: "Req Book", line_of_business: "PROPERTY", large_loss_threshold_cents: 250000, max_range_width_pct: 0.8, benchmark_open_severity_cents: 30000 }
              as: AppointedActuary
              captures: { seg: $.data.id }
          trigger:
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "C-X", accident_date: "2025-01-15", report_date: "2025-01-20", paid_to_date_cents: 999999 }
              as: ClaimsExaminer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST and HTTP status 400"
      - name: claim_get_nonexistent_id_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "GET on a well-formed but absent claim id returns ERR_NOT_FOUND (404), not an empty object."
        test_recipe:
          setup: ["Nothing required beyond a valid role"]
          setup_api_calls: []
          trigger:
            - call: "GET /actuarial/claims/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: ActuarialAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND and HTTP status 404"
      - name: claim_transaction_is_append_only_event
        claim_type: immutability
        grounds:
          - entities.ClaimTransaction
        distinguishing_aspect: "ClaimTransaction has common_fields: false — its response carries id and created_at but no version or updated_at, and no update/delete endpoint exists for it."
        test_recipe:
          setup: ["Segment and claim exist"]
          setup_api_calls:
            - call: "POST /actuarial/segments"
              payload: { name: "Evt Book", line_of_business: "PROPERTY", large_loss_threshold_cents: 250000, max_range_width_pct: 0.8, benchmark_open_severity_cents: 30000 }
              as: AppointedActuary
              captures: { seg: $.data.id }
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "C-E", accident_date: "2025-01-15", report_date: "2025-01-20" }
              as: ClaimsExaminer
              captures: { cl_e: $.data.id }
          trigger:
            - call: "POST /actuarial/claims/${cl_e}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-02-01T00:00:00Z", amount_cents: 100000 }
              as: ClaimsExaminer
              captures: { txn: $.data.id, eff_q: $.data.effective_quarter }
          assert:
            - "ClaimTransaction.${txn}.effective_quarter == 2025-Q1 (derived from transaction_date)"
            - "Response contains id and created_at but no version and no updated_at (append-only event, common_fields: false)"
      - name: claims_list_pagination_and_status_filter
        claim_type: listing_pagination
        grounds:
          - response_envelope.pagination_defaults
          - endpoints GET /actuarial/claims
        distinguishing_aspect: "Pagination defaults (limit 10) and explicit limit/offset interact with the status filter: 3 claims, limit 2 -> page 1 has 2 rows with has_more true and total_count 3; filtering by status=CLOSED returns exactly the closed claim."
        test_recipe:
          setup: ["Segment with three claims; claim C-P1 closed (case is 0)"]
          setup_api_calls:
            - call: "POST /actuarial/segments"
              payload: { name: "Page Book", line_of_business: "PROPERTY", large_loss_threshold_cents: 250000, max_range_width_pct: 0.8, benchmark_open_severity_cents: 30000 }
              as: AppointedActuary
              captures: { seg: $.data.id }
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "C-P1", accident_date: "2025-01-15", report_date: "2025-01-20" }
              as: ClaimsExaminer
              captures: { cl_p1: $.data.id }
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "C-P2", accident_date: "2025-02-15", report_date: "2025-02-20" }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "C-P3", accident_date: "2025-03-15", report_date: "2025-03-20" }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims/${cl_p1}/status"
              payload: { target_status: "CLOSED" }
              as: ClaimsExaminer
          trigger:
            - call: "GET /actuarial/claims"
              payload: { segment_id: "${seg}", limit: 2, offset: 0 }
              as: ActuarialAnalyst
            - call: "GET /actuarial/claims"
              payload: { segment_id: "${seg}", status: "CLOSED" }
              as: ActuarialAnalyst
              captures: { closed_id: "$.data[0].id" }
          assert:
            - "Page 1 (limit 2, offset 0) returns exactly 2 claims with total_count == 3 and has_more == true"
            - "status=CLOSED filter returns exactly one claim and closed_id == ${cl_p1}"
  # ===========================================================================
  # From Table 2 (State Machines)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: claim_close_from_closed_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Claim
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "CLOSED is a valid from-state only for REOPENED: a second close on an already-CLOSED claim is rejected and no side effects fire."
        test_recipe:
          setup: ["Segment; claim with zero case outstanding, already CLOSED"]
          setup_api_calls:
            - call: "POST /actuarial/segments"
              payload: { name: "SM Book", line_of_business: "PROPERTY", large_loss_threshold_cents: 250000, max_range_width_pct: 0.8, benchmark_open_severity_cents: 30000 }
              as: AppointedActuary
              captures: { seg: $.data.id }
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "C-S", accident_date: "2025-01-15", report_date: "2025-01-20" }
              as: ClaimsExaminer
              captures: { cl_s: $.data.id }
            - call: "POST /actuarial/claims/${cl_s}/status"
              payload: { target_status: "CLOSED" }
              as: ClaimsExaminer
          trigger:
            - call: "POST /actuarial/claims/${cl_s}/status"
              payload: { target_status: "CLOSED" }
              as: ClaimsExaminer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (CLOSED -> CLOSED is not a declared transition)"
            - "Claim.${cl_s}.status == CLOSED and version unchanged by the rejected call"
      - name: claim_reopen_from_open_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Claim
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "REOPENED is reachable only from CLOSED; reopening an OPEN claim fails."
        test_recipe:
          setup: ["Segment; claim freshly created (OPEN)"]
          setup_api_calls:
            - call: "POST /actuarial/segments"
              payload: { name: "SM Book", line_of_business: "PROPERTY", large_loss_threshold_cents: 250000, max_range_width_pct: 0.8, benchmark_open_severity_cents: 30000 }
              as: AppointedActuary
              captures: { seg: $.data.id }
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "C-S", accident_date: "2025-01-15", report_date: "2025-01-20" }
              as: ClaimsExaminer
              captures: { cl_s: $.data.id }
          trigger:
            - call: "POST /actuarial/claims/${cl_s}/status"
              payload: { target_status: "REOPENED" }
              as: ClaimsExaminer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (OPEN -> REOPENED undeclared)"
      - name: study_withdrawn_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.ReservingStudy
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "WITHDRAWN is terminal: submit on a withdrawn study is rejected; no transition list contains WITHDRAWN as a from-state."
        test_recipe:
          setup: ["Main Book fixture through fresh CL run; study created and withdrawn while DRAFT"]
          setup_api_calls:
            - call: "POST /actuarial/segments"
              payload: { name: "Main Book", line_of_business: "COMMERCIAL_AUTO", large_loss_threshold_cents: 400000, max_range_width_pct: 0.5, benchmark_open_severity_cents: 50000 }
              as: AppointedActuary
              captures: { seg: $.data.id }
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "C-A", accident_date: "2025-01-15", report_date: "2025-01-20" }
              as: ClaimsExaminer
              captures: { cl_a: $.data.id }
            - call: "POST /actuarial/claims/${cl_a}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-02-01T00:00:00Z", amount_cents: 100000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/triangles"
              payload: { segment_id: "${seg}", basis: "PAID", valuation_quarter: "2025-Q2" }
              as: ActuarialAnalyst
            - call: "POST /actuarial/development-patterns"
              payload: { segment_id: "${seg}", basis: "PAID", valuation_quarter: "2025-Q2", effective_from_quarter: "2025-Q2", effective_to_quarter: "2026-Q1" }
              as: ActuarialAnalyst
              captures: { pat: $.data.id }
            - call: "POST /actuarial/development-patterns/${pat}/select"
              as: ActuarialAnalyst
            - call: "POST /actuarial/studies"
              payload: { segment_id: "${seg}", valuation_quarter: "2025-Q2", selected_method: "CHAIN_LADDER", selected_basis: "PAID" }
              as: ActuarialAnalyst
              as_user_id: "analyst-1"
              captures: { st: $.data.id }
            - call: "POST /actuarial/studies/${st}/withdraw"
              as: ActuarialAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /actuarial/studies/${st}/submit"
              as: ActuarialAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (WITHDRAWN is terminal)"
            - "ReservingStudy.${st}.status == WITHDRAWN"
      - name: opinion_sign_twice_returns_invalid_state
        claim_type: idempotency_and_terminal
        grounds:
          - state_machines.ActuarialOpinion
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "SIGNED is terminal; a second sign call on the same opinion is rejected even with a fresh, non-conflicting signer."
        test_recipe:
          setup:
            - "Main Book full chain: approved study (CL, PAID, 2025-Q3), DRAFT opinion by aa-1, study attached, clock 2025-10-15; opinion signed by aa-2"
          setup_api_calls:
            - call: "POST /actuarial/segments"
              payload: { name: "Main Book", line_of_business: "COMMERCIAL_AUTO", large_loss_threshold_cents: 400000, max_range_width_pct: 0.5, benchmark_open_severity_cents: 50000 }
              as: AppointedActuary
              captures: { seg: $.data.id }
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "C-A", accident_date: "2025-01-15", report_date: "2025-01-20" }
              as: ClaimsExaminer
              captures: { cl_a: $.data.id }
            - call: "POST /actuarial/claims/${cl_a}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-02-01T00:00:00Z", amount_cents: 100000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims/${cl_a}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-05-01T00:00:00Z", amount_cents: 100000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims/${cl_a}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-09-01T00:00:00Z", amount_cents: 50000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "C-B", accident_date: "2025-04-10", report_date: "2025-04-12" }
              as: ClaimsExaminer
              captures: { cl_b: $.data.id }
            - call: "POST /actuarial/claims/${cl_b}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-05-15T00:00:00Z", amount_cents: 200000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims/${cl_b}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-08-10T00:00:00Z", amount_cents: 100000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/triangles"
              payload: { segment_id: "${seg}", basis: "PAID", valuation_quarter: "2025-Q3" }
              as: ActuarialAnalyst
            - call: "POST /actuarial/development-patterns"
              payload: { segment_id: "${seg}", basis: "PAID", valuation_quarter: "2025-Q3", effective_from_quarter: "2025-Q3", effective_to_quarter: "2026-Q2" }
              as: ActuarialAnalyst
              captures: { pat: $.data.id }
            - call: "POST /actuarial/development-patterns/${pat}/select"
              as: ActuarialAnalyst
            - call: "POST /actuarial/reserve-runs"
              payload: { segment_id: "${seg}", valuation_quarter: "2025-Q3", method: "CHAIN_LADDER", basis: "PAID" }
              as: ActuarialAnalyst
            - call: "POST /actuarial/studies"
              payload: { segment_id: "${seg}", valuation_quarter: "2025-Q3", selected_method: "CHAIN_LADDER", selected_basis: "PAID" }
              as: ActuarialAnalyst
              as_user_id: "analyst-1"
              captures: { st: $.data.id }
            - call: "POST /actuarial/studies/${st}/submit"
              as: ActuarialAnalyst
              as_user_id: "analyst-1"
            - call: "POST /actuarial/studies/${st}/review"
              payload: { decision: "APPROVE", chief_actuary_override: true }
              as: PeerReviewer
              as_user_id: "reviewer-1"
            - call: "POST /actuarial/_clock/set_current_utc"
              payload: { to_iso8601: "2025-10-15T00:00:00Z" }
              as: AppointedActuary
            - call: "POST /actuarial/opinions"
              payload: { statement_date: "2025-09-30", opinion_scope: "REASONABLE" }
              as: AppointedActuary
              as_user_id: "aa-1"
              captures: { op: $.data.id }
            - call: "POST /actuarial/opinions/${op}/attach-study"
              payload: { study_id: "${st}" }
              as: AppointedActuary
              as_user_id: "aa-1"
            - call: "POST /actuarial/opinions/${op}/sign"
              as: AppointedActuary
              as_user_id: "aa-2"
          trigger:
            - call: "POST /actuarial/opinions/${op}/sign"
              as: AppointedActuary
              as_user_id: "aa-3"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (SIGNED is terminal)"
            - "ActuarialOpinion.${op}.signed_by_user_id == aa-2 (unchanged by the rejected second sign)"
      - name: pattern_select_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.DevelopmentPattern
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "SELECTED has only the WITHDRAWN exit; selecting an already-SELECTED pattern fails instead of being a no-op."
        test_recipe:
          setup: ["Segment with one claim and one payment; triangle @2025-Q2; pattern created and selected"]
          setup_api_calls:
            - call: "POST /actuarial/segments"
              payload: { name: "Pat Book", line_of_business: "PROPERTY", large_loss_threshold_cents: 250000, max_range_width_pct: 0.8, benchmark_open_severity_cents: 30000 }
              as: AppointedActuary
              captures: { seg: $.data.id }
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "C-1", accident_date: "2025-01-15", report_date: "2025-01-20" }
              as: ClaimsExaminer
              captures: { cl_1: $.data.id }
            - call: "POST /actuarial/claims/${cl_1}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-02-01T00:00:00Z", amount_cents: 100000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/triangles"
              payload: { segment_id: "${seg}", basis: "PAID", valuation_quarter: "2025-Q2" }
              as: ActuarialAnalyst
            - call: "POST /actuarial/development-patterns"
              payload: { segment_id: "${seg}", basis: "PAID", valuation_quarter: "2025-Q2", effective_from_quarter: "2025-Q2", effective_to_quarter: "2026-Q1" }
              as: ActuarialAnalyst
              captures: { pat: $.data.id }
            - call: "POST /actuarial/development-patterns/${pat}/select"
              as: ActuarialAnalyst
          trigger:
            - call: "POST /actuarial/development-patterns/${pat}/select"
              as: ActuarialAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (SELECTED -> SELECTED undeclared)"
      - name: guarded_transition_submit_gate
        claim_type: guarded_transition
        grounds:
          - state_machines.ReservingStudy.DRAFT_to_IN_REVIEW
        excluded_because:
          difficulty_instance: study_submit_gated_on_run_freshness
          rationale: "The cross-entity guard on submit (matched run exists and is fresh) is exercised as the failure path of the named §1.8 instance."
      - name: guarded_transition_opinion_sign_gate
        claim_type: guarded_transition
        grounds:
          - state_machines.ActuarialOpinion.DRAFT_to_SIGNED
        excluded_because:
          difficulty_instance: opinion_attach_gated_on_study_approved
          rationale: "The opinion->study state guard is exercised by the named §1.8 instance (attach rejected for a DRAFT study)."
  # From Table 3 (Calculations)
  # ===========================================================================
  - section: calculations
    instances:
      - name: triangle_aggregation_computes_cumulative_cells
        claim_type: correct_result_and_input_set
        grounds:
          - calculations.triangle_aggregation
          - entities.LossTriangle.fields.cells
        distinguishing_aspect: "Cell-level correctness of the shared fixture: cumulative paid cells at 2025-Q3 are exactly AQ1=[100000,200000,250000] and AQ2=[300000,300000], claims contribute regardless of OPEN/CLOSED status, and the diagonal cut omits dev columns beyond the valuation quarter."
        test_recipe:
          setup:
            - "Main Book fixture: claims C-A (AQ1: 100000/100000/50000 at dev 0/1/2), C-B (AQ2: 200000/100000 at dev 0/1), C-D (AQ2: 100000 at dev 0); no segregated claims"
          setup_api_calls:
            - call: "POST /actuarial/segments"
              payload: { name: "Main Book", line_of_business: "COMMERCIAL_AUTO", large_loss_threshold_cents: 400000, max_range_width_pct: 0.5, benchmark_open_severity_cents: 50000 }
              as: AppointedActuary
              captures: { seg: $.data.id }
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "C-A", accident_date: "2025-01-15", report_date: "2025-01-20" }
              as: ClaimsExaminer
              captures: { cl_a: $.data.id }
            - call: "POST /actuarial/claims/${cl_a}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-02-01T00:00:00Z", amount_cents: 100000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims/${cl_a}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-05-01T00:00:00Z", amount_cents: 100000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims/${cl_a}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-09-01T00:00:00Z", amount_cents: 50000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "C-B", accident_date: "2025-04-10", report_date: "2025-04-12" }
              as: ClaimsExaminer
              captures: { cl_b: $.data.id }
            - call: "POST /actuarial/claims/${cl_b}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-05-15T00:00:00Z", amount_cents: 200000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims/${cl_b}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-08-10T00:00:00Z", amount_cents: 100000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "C-D", accident_date: "2025-04-10", report_date: "2025-04-15" }
              as: ClaimsExaminer
              captures: { cl_d: $.data.id }
            - call: "POST /actuarial/claims/${cl_d}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-05-01T00:00:00Z", amount_cents: 100000 }
              as: ClaimsExaminer
          trigger:
            - call: "POST /actuarial/triangles"
              payload: { segment_id: "${seg}", basis: "PAID", valuation_quarter: "2025-Q3" }
              as: ActuarialAnalyst
              captures: { tri: $.data.id, cells: $.data.cells }
          assert:
            - "cells contains {accident_quarter: 2025-Q1, dev_quarter: 0, amount_cents: 100000}, {2025-Q1, 1, 200000}, {2025-Q1, 2, 250000}"
            - "cells contains {accident_quarter: 2025-Q2, dev_quarter: 0, amount_cents: 300000} and {2025-Q2, 1, amount_cents: 300000} (C-B and C-D pooled)"
