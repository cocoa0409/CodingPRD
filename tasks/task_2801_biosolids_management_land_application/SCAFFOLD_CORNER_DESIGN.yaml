  - section: endpoints
    instances:
      - name: ep_clock_starts_at_the_seed_instant_and_advances_on_write
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/_clock/set_current_utc
          - entities.TreatmentFacility.common_fields
        distinguishing_aspect: "On a fresh server the logical clock reads 2026-08-01T00:00:00Z without any clock call, so the first facility is stamped 2026-08-01T00:00:00.000Z; the clock write then reports the new instant and expired_agreement_count 0, and the next facility is stamped 2026-09-10T12:00:00.000Z."
        test_recipe:
          setup:
            - "Empty database and an untouched logical clock. One facility is created before the clock is ever written."
          setup_api_calls:
            - call: "POST /treatment-facilities"
              payload: { name: "North Water Reclamation Plant", npdes_permit_number: "NP-1001", storage_capacity_wet_tons: 5000.00, daily_production_wet_tons: 40.00, loadout_bay_count: 2 }
              as: FacilityOperator
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-09-10T12:00:00Z" }
              as: ComplianceOfficer
              captures: { now: $.data.now, expired: $.data.expired_agreement_count }
            - call: "POST /treatment-facilities"
              payload: { name: "South Water Reclamation Plant", npdes_permit_number: "NP-1002", storage_capacity_wet_tons: 5000.00, daily_production_wet_tons: 40.00, loadout_bay_count: 2 }
              as: FacilityOperator
              captures: { fac2_id: $.data.id }
          assert:
            - "TreatmentFacility.${fac_id}.created_at == \"2026-08-01T00:00:00.000Z\""
            - "${now} == \"2026-09-10T12:00:00Z\""
            - "${expired} == 0"
            - "TreatmentFacility.${fac2_id}.created_at == \"2026-09-10T12:00:00.000Z\""
            - "TreatmentFacility.${fac2_id}.version == 1"

