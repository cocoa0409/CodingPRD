      - name: second_executed_contract_for_one_vendor_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DUPLICATE_EXECUTED_CONTRACT]
          - state_machines.VendorContract.APPROVED_to_EXECUTED
        distinguishing_aspect: "A vendor may hold many drafts and approvals but only one EXECUTED contract at a time; the second execution is refused even though its own compliance_score is above the floor, and it stays APPROVED so it can be executed later."
        test_recipe:
          setup:
            - "One ComplianceProgram, one Vendor at attestation RECEIVED, and two fully compliant contracts both advanced to APPROVED (drafted by vm-1, approved by ca-1)."
          setup_api_calls:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: 1093750 }
              as: SystemOperator
              captures: { prog_id: $.data.id }
            - call: "POST /vendors"
              payload: { program_id: "${prog_id}", name: "ClockPoint Systems", sells_biometric_data: false, subprocessor_count: 0, deletion_sla_days: 15, subprocessor_disclosure_complete: true }
              as: VendorManager
              as_user_id: "vm-1"
              captures: { v1_id: $.data.id }
            - call: "POST /vendors/${v1_id}/attestations"
              payload: { attestation_status: "REQUESTED" }
              as: VendorManager
              as_user_id: "vm-1"
            - call: "POST /vendors/${v1_id}/attestations"
              payload: { attestation_status: "RECEIVED" }
              as: VendorManager
              as_user_id: "vm-1"
            - call: "POST /vendor-contracts"
              payload: { vendor_id: "${v1_id}", prohibits_sale: true, restricts_disclosure: true, requires_deletion_on_termination: true, deletion_deadline_days: 30, indemnity_cap_cents: 5000000, effective_from: "2026-08-01T00:00:00Z" }
              as: VendorManager
              as_user_id: "vm-1"
              captures: { k1_id: $.data.id }
            - call: "POST /vendor-contracts"
              payload: { vendor_id: "${v1_id}", prohibits_sale: true, restricts_disclosure: true, requires_deletion_on_termination: true, deletion_deadline_days: 15, indemnity_cap_cents: 7500000, effective_from: "2026-08-01T00:00:00Z" }
              as: VendorManager
              as_user_id: "vm-1"
              captures: { k2_id: $.data.id }
            - call: "POST /vendor-contracts/${k1_id}/transitions"
              payload: { to_status: "APPROVED" }
              as: ComplianceApprover
              as_user_id: "ca-1"
            - call: "POST /vendor-contracts/${k2_id}/transitions"
              payload: { to_status: "APPROVED" }
              as: ComplianceApprover
              as_user_id: "ca-1"
            - call: "POST /vendor-contracts/${k1_id}/transitions"
              payload: { to_status: "EXECUTED" }
              as: VendorManager
              as_user_id: "vm-1"
          trigger:
            - call: "POST /vendor-contracts/${k2_id}/transitions"
              payload: { to_status: "EXECUTED" }
              as: VendorManager
              as_user_id: "vm-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_DUPLICATE_EXECUTED_CONTRACT"
            - "VendorContract ${k2_id} is still APPROVED with compliance_score 100.00 — the refusal is about the sibling, not the score"
            - "VendorContract ${k1_id} is still EXECUTED"
            - "GET /vendor-contracts with vendor_id ${v1_id} and status EXECUTED returns total_count 1"

      - name: closing_out_a_contract_after_the_deletion_deadline_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DELETION_DEADLINE_MISSED]
          - state_machines.VendorContract.TERMINATED_to_CLOSED_OUT
          - entities.VendorContract.fields.deletion_deadline_at
        distinguishing_aspect: "The deletion obligation has a hard clock: deletion_deadline_at is stamped as terminated_at + deletion_deadline_days, and a certificate presented one day past that instant is refused, leaving the contract stuck in TERMINATED as a permanent audit finding."
        test_recipe:
          setup:
            - "One ComplianceProgram and one Vendor at attestation RECEIVED holding one fully compliant contract with deletion_deadline_days 30, executed and then terminated at the default clock 2026-08-01 (so deletion_deadline_at is 2026-08-31)."
            - "The clock is then advanced to 2026-09-01, one day past the deadline."
          setup_api_calls:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: 1093750 }
              as: SystemOperator
              captures: { prog_id: $.data.id }
            - call: "POST /vendors"
              payload: { program_id: "${prog_id}", name: "ClockPoint Systems", sells_biometric_data: false, subprocessor_count: 0, deletion_sla_days: 15, subprocessor_disclosure_complete: true }
              as: VendorManager
              as_user_id: "vm-1"
              captures: { v1_id: $.data.id }
            - call: "POST /vendors/${v1_id}/attestations"
              payload: { attestation_status: "REQUESTED" }
              as: VendorManager
              as_user_id: "vm-1"
            - call: "POST /vendors/${v1_id}/attestations"
              payload: { attestation_status: "RECEIVED" }
              as: VendorManager
              as_user_id: "vm-1"
            - call: "POST /vendor-contracts"
              payload: { vendor_id: "${v1_id}", prohibits_sale: true, restricts_disclosure: true, requires_deletion_on_termination: true, deletion_deadline_days: 30, indemnity_cap_cents: 5000000, effective_from: "2026-08-01T00:00:00Z" }
              as: VendorManager
              as_user_id: "vm-1"
              captures: { k1_id: $.data.id }
            - call: "POST /vendor-contracts/${k1_id}/transitions"
              payload: { to_status: "APPROVED" }
              as: ComplianceApprover
              as_user_id: "ca-1"
            - call: "POST /vendor-contracts/${k1_id}/transitions"
              payload: { to_status: "EXECUTED" }
              as: VendorManager
              as_user_id: "vm-1"
            - call: "POST /vendor-contracts/${k1_id}/transitions"
              payload: { to_status: "TERMINATED" }
              as: VendorManager
              as_user_id: "vm-1"
              captures: { deadline_at: $.data.deletion_deadline_at }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /vendor-contracts/${k1_id}/transitions"
              payload: { to_status: "CLOSED_OUT", deletion_certificate_ref: "cert-late-001" }
              as: VendorManager
              as_user_id: "vm-1"
              captures: { err: $.data.error_id }
          assert:
            - "${deadline_at} == 2026-08-31T00:00:00.000Z (terminated_at 2026-08-01 + 30 days)"
            - "HTTP 409 with data.error_id == ERR_DELETION_DEADLINE_MISSED"
            - "VendorContract ${k1_id} is still TERMINATED with deletion_certificate_ref null"
            - "Rewinding the clock to 2026-08-31T00:00:00Z and retrying succeeds, so the deadline itself is inclusive and only the day past it is refused"

      - name: second_final_assessment_for_the_same_state_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ASSESSMENT_ALREADY_FINAL]
          - validations[priority=13]
        distinguishing_aspect: "One state may carry at most one FINAL exposure figure, so a second theory of the same jurisdiction is refused at finalization even though it is cheaper and well inside the ceiling — the uniqueness check sits above the fiscal check."
        test_recipe:
          setup:
            - "One ComplianceProgram with a generous ceiling and one Jurisdiction IL; no consent rows exist, so both assessments price at 0."
            - "Two DRAFT assessments for the same (program, IL) pair, one per variant, each created by po-1."
          setup_api_calls:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: 1093750 }
              as: SystemOperator
              captures: { prog_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { program_id: "${prog_id}", state_code: "IL", statute_name: "BIPA", private_right_of_action: "FULL", damages_model: "STATUTORY_PER_VIOLATION", requires_written_release: true, translation_required: true, required_locales: ["en", "es"], retention_max_days: 1095, notice_lead_days: 14, per_violation_negligent_cents: 100000, per_violation_reckless_cents: 500000, cure_period_days: 0 }
