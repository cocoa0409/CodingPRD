# =============================================================================
# Task 1572: §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x >=2 instances = 20 instances. Every recipe replays from empty-DB
# using only SCAFFOLD.yaml §1.5 endpoints.
#
# Common fixture constants used across recipes:
#   CleanStandard rows: ROUTINE (base 45, mult 15000, atp 250)
#                       ISOLATION (base 60, mult 15000, atp 150)
#                       TERMINAL (base 90, mult 20000, atp 100)
#   SupplyItem rows:    DISINFECTANT (on_hand 100, threshold 10)
#                       PPE_PACK (50, 8), CLOTH (200, 20), SEALANT (20, 2)
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
  # ---------------------------------------------------------------------------
    instances:
      - name: sla_pinned_vs_current_estimate_diverges_on_outbreak
        grounds:
          - calculations.effective_time_standard
          - entities.CleanRequest.fields.sla_target_minutes
          - entities.CleanRequest.fields.current_estimate_minutes
          - state_machines.OutbreakEvent.DECLARED_to_ACTIVE
        distinguishing_aspect: |
          Dual variants on the CleanRequest/SLA entity domain: the PINNED
          variant (frozen at creation, posture NORMAL) keeps 45 while the
          CURRENT variant (evaluated with the post-activation OUTBREAK posture)
          yields round_half_up(45 * 1.5) = 68 for the same request row.
        test_recipe:
          setup:
            - "Unit U (NORMAL), ROUTINE standard 45/15000, supplies seeded, clock 08:00"
            - "Bed B (STANDARD kind); CleanRequest R (ROUTINE) created pre-outbreak -> pinned target 45"
            - "OutbreakEvent on U activated -> posture OUTBREAK"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/units"
              payload: { unit_code: "U1", display_name: "Unit One" }
              as: EVSAdministrator
              captures: { u1: $.data.id }
            - call: "POST /evs/clean-standards"
              payload: { clean_type: "ROUTINE", base_minutes: 45, outbreak_multiplier_bps: 15000, atp_rlu_threshold: 250 }
              as: EVSAdministrator
            - call: "POST /evs/clean-standards"
              payload: { clean_type: "ISOLATION", base_minutes: 60, outbreak_multiplier_bps: 15000, atp_rlu_threshold: 150 }
              as: EVSAdministrator
            - call: "POST /evs/clean-standards"
              payload: { clean_type: "TERMINAL", base_minutes: 90, outbreak_multiplier_bps: 20000, atp_rlu_threshold: 100 }
              as: EVSAdministrator
            - call: "POST /evs/supply-items"
              payload: { item_code: "DISINFECTANT", display_name: "Disinfectant", initial_on_hand: 100, reorder_threshold: 10 }
              as: EVSAdministrator
            - call: "POST /evs/supply-items"
              payload: { item_code: "CLOTH", display_name: "Cloths", initial_on_hand: 200, reorder_threshold: 20 }
              as: EVSAdministrator
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B1", bed_kind: "STANDARD" }
              as: EVSAdministrator
              captures: { b1: $.data.id }
            - call: "POST /evs/clean-requests"
              payload: { bed_id: "${b1}", clean_type: "ROUTINE" }
              as: EVSDispatcher
              captures: { r1: $.data.id }
            - call: "POST /evs/outbreak-events"
              payload: { unit_id: "${u1}", pathogen_class: "NOROVIRUS", declared_reason: "cluster" }
              as: InfectionPreventionist
              captures: { ob1: $.data.id }
            - call: "POST /evs/outbreak-events/${ob1}/activate"
              payload: {}
              as: InfectionPreventionist
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B2", bed_kind: "STANDARD" }
              as: EVSAdministrator
              captures: { b2: $.data.id }
          trigger:
            - call: "POST /evs/clean-requests"
              payload: { bed_id: "${b2}", clean_type: "ROUTINE" }
              as: EVSDispatcher
              captures: { r2: $.data.id }
          assert:
            - "CleanRequest.${r1}.sla_target_minutes == 45 (pinned under NORMAL; not retroactively changed)"
            - "CleanRequest.${r1}.current_estimate_minutes == 68 (round_half_up(45 * 15000/10000) = 68)"
            - "CleanRequest.${r1}.pinned_with_outbreak == false"
            - "CleanRequest.${r2}.sla_target_minutes == 68 AND CleanRequest.${r2}.pinned_with_outbreak == true (created under OUTBREAK)"
            - "Unit.${u1}.outbreak_posture == OUTBREAK"

      - name: turnaround_total_vs_clean_variants
        grounds:
          - calculations.turnaround_time_variants
          - entities.Bed.fields.tat_total_minutes
          - entities.Bed.fields.tat_clean_minutes
          - entities.TurnaroundSnapshot.fields.tat_total_p50_minutes
        distinguishing_aspect: |
          Dual variants on the Bed/turnaround-metrics entity domain (distinct
          from the CleanRequest SLA domain of the sibling instance): the same
          lifecycle events produce tat_total 75 (creation/queue-inclusive) and
          tat_clean 45 (execution-only), and the snapshot reports both series.
        test_recipe:
          setup:
            - "Unit U, standards, supplies, bed B (STANDARD), tech T (clocked in), auditor A, clock 08:00"
            - "Request R created 08:00, started 08:30, completed 09:15, PASS-audited 09:15 -> bed READY 09:15"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/units"
              payload: { unit_code: "U1", display_name: "Unit One" }
              as: EVSAdministrator
              captures: { u1: $.data.id }
            - call: "POST /evs/clean-standards"
              payload: { clean_type: "ROUTINE", base_minutes: 45, outbreak_multiplier_bps: 15000, atp_rlu_threshold: 250 }
              as: EVSAdministrator
            - call: "POST /evs/clean-standards"
              payload: { clean_type: "ISOLATION", base_minutes: 60, outbreak_multiplier_bps: 15000, atp_rlu_threshold: 150 }
              as: EVSAdministrator
            - call: "POST /evs/clean-standards"
              payload: { clean_type: "TERMINAL", base_minutes: 90, outbreak_multiplier_bps: 20000, atp_rlu_threshold: 100 }
              as: EVSAdministrator
            - call: "POST /evs/supply-items"
              payload: { item_code: "DISINFECTANT", display_name: "Disinfectant", initial_on_hand: 100, reorder_threshold: 10 }
              as: EVSAdministrator
            - call: "POST /evs/supply-items"
              payload: { item_code: "CLOTH", display_name: "Cloths", initial_on_hand: 200, reorder_threshold: 20 }
              as: EVSAdministrator
            - call: "POST /evs/staff"
              payload: { employee_code: "T1", display_name: "Tech One", capabilities: ["CLEAN"], certifications: [] }
              as: EVSAdministrator
              captures: { t1: $.data.id }
            - call: "POST /evs/staff"
              payload: { employee_code: "A1", display_name: "Auditor One", capabilities: ["AUDIT"], certifications: [] }
              as: EVSAdministrator
              captures: { a1: $.data.id }
            - call: "POST /evs/staff/${t1}/clock-in"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t1}"
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B1", bed_kind: "STANDARD" }
              as: EVSAdministrator
              captures: { b1: $.data.id }
            - call: "POST /evs/clean-requests"
              payload: { bed_id: "${b1}", clean_type: "ROUTINE" }
              as: EVSDispatcher
              captures: { r1: $.data.id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:30:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/clean-requests/${r1}/assign"
              payload: { staff_id: "${t1}" }
              as: EVSDispatcher
            - call: "POST /evs/clean-requests/${r1}/start"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t1}"
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:15:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/clean-requests/${r1}/complete"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t1}"
            - call: "POST /evs/quality-audits"
              payload: { clean_request_id: "${r1}", audit_method: "ATP_SWAB", rlu_reading: 200 }
              as: QualityAuditor
              as_user_id: "${a1}"
          trigger:
            - call: "POST /evs/units/${u1}/ops-runs"
              payload: {}
              as: EVSAdministrator
              captures: { snap1: $.data.id }
          assert:
            - "Bed.${b1}.bed_status == READY"
            - "Bed.${b1}.tat_total_minutes == 75 (09:15 minus created_at 08:00; never discharged so coalesce falls to bed.created_at)"
            - "Bed.${b1}.tat_clean_minutes == 45 (verified 09:15 minus first_started_at 08:30)"
            - "Bed.${b1}.tat_total_minutes != Bed.${b1}.tat_clean_minutes"
            - "TurnaroundSnapshot.${snap1}.tat_total_p50_minutes == 75 AND tat_clean_p50_minutes == 45 (verified_count == 1)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
  # ---------------------------------------------------------------------------
    instances:
      - name: demand_score_multi_input_nonlinear
        grounds:
          - calculations.placement_demand_score
          - entities.PlacementDemand.fields.priority_score
        distinguishing_aspect: |
          Mode (a) combinatorial: >=3 inputs (urgency tier base, capped wait
          term, scarcity branch) with a nested min() and a conditional branch;
          the wait cap and the scarcity flag each independently change the
          result (610.00 -> 1110.00 on regrade; 790.00 at the 120-minute cap;
          740.00 once a READY bed removes the scarcity bonus).
        test_recipe:
          setup:
            - "Unit U with a single STANDARD bed B1 that stays VACANT_DIRTY (so READY count of STANDARD beds == 0)"
            - "URGENT demand D for STANDARD created 08:00; needed_by 18:00"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/units"
              payload: { unit_code: "U1", display_name: "Unit One" }
              as: EVSAdministrator
              captures: { u1: $.data.id }
            - call: "POST /evs/clean-standards"
              payload: { clean_type: "ROUTINE", base_minutes: 45, outbreak_multiplier_bps: 15000, atp_rlu_threshold: 250 }
              as: EVSAdministrator
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B1", bed_kind: "STANDARD" }
              as: EVSAdministrator
              captures: { b1: $.data.id }
            - call: "POST /evs/placement-demands"
              payload: { unit_id: "${u1}", required_bed_kind: "STANDARD", urgency_tier: "URGENT", needed_by: "2026-08-01T18:00:00Z" }
              as: BedPlacementCoordinator
              captures: { d1: $.data.id }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:30:00Z" }, as: EVSAdministrator }
            - call: "GET /evs/placement-demands/${d1}"
              payload: {}
              as: Any
              captures: { d1_wait30: $.data.priority_score }
            - call: "POST /evs/placement-demands/${d1}/regrade"
              payload: { urgency_tier: "STAT" }
              as: BedPlacementCoordinator
            - call: "GET /evs/placement-demands/${d1}"
              payload: {}
              as: Any
              captures: { d1_stat: $.data.priority_score }
            - call: "POST /evs/placement-demands/${d1}/regrade"
              payload: { urgency_tier: "URGENT" }
              as: BedPlacementCoordinator
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T11:20:00Z" }, as: EVSAdministrator }
            - call: "GET /evs/placement-demands/${d1}"
              payload: {}
              as: Any
              captures: { d1_capped: $.data.priority_score }
          assert:
            - "d1_wait30 == 610.00 (500 + min(30,120)*2 + 50 scarcity)"
            - "d1_stat == 1110.00 (1000 + 60 + 50: regrade swaps the tier base, wait unchanged)"
            - "d1_capped == 790.00 (500 + min(200,120)*2 + 50: wait term capped at 240)"
            - "PlacementDemand.${d1}.status == OPEN throughout (never matched: bed never became READY)"

      - name: productivity_per_line_rounding_order
        grounds:
          - calculations.productivity_score
          - entities.StaffMember.fields.verified_credit_total
        distinguishing_aspect: |
          Mode (b) nested rounding (distinct mode from the sibling's mode (a)):
          per-clean credits are rounded to 2dp BEFORE summation — 3 cleans with
          ef = 45/40 = 1.125 give round2(1.125) = 1.13 each, total 3.39 —
          whereas sum-then-round would give round2(3.375) = 3.38. The pinned
          order is the only source of the one-cent divergence.
        test_recipe:
          setup:
            - "Unit U, ROUTINE standard base 45, supplies, tech T clocked in, auditor A"
            - "Three beds B1/B2/B3; each gets a ROUTINE request started and completed with exactly 40 minutes elapsed (ef = 45/40 = 1.125), each PASS-audited"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/units"
              payload: { unit_code: "U1", display_name: "Unit One" }
              as: EVSAdministrator
              captures: { u1: $.data.id }
            - call: "POST /evs/clean-standards"
              payload: { clean_type: "ROUTINE", base_minutes: 45, outbreak_multiplier_bps: 15000, atp_rlu_threshold: 250 }
              as: EVSAdministrator
            - call: "POST /evs/clean-standards"
              payload: { clean_type: "ISOLATION", base_minutes: 60, outbreak_multiplier_bps: 15000, atp_rlu_threshold: 150 }
              as: EVSAdministrator
            - call: "POST /evs/clean-standards"
              payload: { clean_type: "TERMINAL", base_minutes: 90, outbreak_multiplier_bps: 20000, atp_rlu_threshold: 100 }
              as: EVSAdministrator
            - call: "POST /evs/supply-items"
              payload: { item_code: "DISINFECTANT", display_name: "Disinfectant", initial_on_hand: 100, reorder_threshold: 10 }
              as: EVSAdministrator
            - call: "POST /evs/supply-items"
              payload: { item_code: "CLOTH", display_name: "Cloths", initial_on_hand: 200, reorder_threshold: 20 }
              as: EVSAdministrator
            - call: "POST /evs/staff"
              payload: { employee_code: "T1", display_name: "Tech One", capabilities: ["CLEAN"], certifications: [] }
              as: EVSAdministrator
              captures: { t1: $.data.id }
            - call: "POST /evs/staff"
              payload: { employee_code: "A1", display_name: "Auditor One", capabilities: ["AUDIT"], certifications: [] }
              as: EVSAdministrator
              captures: { a1: $.data.id }
            - call: "POST /evs/staff/${t1}/clock-in"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t1}"
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B1", bed_kind: "STANDARD" }
              as: EVSAdministrator
              captures: { b1: $.data.id }
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B2", bed_kind: "STANDARD" }
              as: EVSAdministrator
              captures: { b2: $.data.id }
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B3", bed_kind: "STANDARD" }
              as: EVSAdministrator
              captures: { b3: $.data.id }
            # clean 1: 08:00 -> 08:40
            - call: "POST /evs/clean-requests"
              payload: { bed_id: "${b1}", clean_type: "ROUTINE" }
              as: EVSDispatcher
              captures: { r1: $.data.id }
            - call: "POST /evs/clean-requests/${r1}/assign"
              payload: { staff_id: "${t1}" }
              as: EVSDispatcher
            - call: "POST /evs/clean-requests/${r1}/start"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t1}"
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:40:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/clean-requests/${r1}/complete"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t1}"
            - call: "POST /evs/quality-audits"
              payload: { clean_request_id: "${r1}", audit_method: "ATP_SWAB", rlu_reading: 100 }
              as: QualityAuditor
              as_user_id: "${a1}"
            # clean 2: 08:40 -> 09:20 (buffer satisfied: window 1 closed at complete)
            - call: "POST /evs/clean-requests"
              payload: { bed_id: "${b2}", clean_type: "ROUTINE" }
              as: EVSDispatcher
              captures: { r2: $.data.id }
            - call: "POST /evs/clean-requests/${r2}/assign"
              payload: { staff_id: "${t1}" }
              as: EVSDispatcher
            - call: "POST /evs/clean-requests/${r2}/start"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t1}"
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:20:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/clean-requests/${r2}/complete"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t1}"
            - call: "POST /evs/quality-audits"
              payload: { clean_request_id: "${r2}", audit_method: "ATP_SWAB", rlu_reading: 100 }
              as: QualityAuditor
              as_user_id: "${a1}"
            # clean 3: 09:20 -> 10:00
            - call: "POST /evs/clean-requests"
              payload: { bed_id: "${b3}", clean_type: "ROUTINE" }
              as: EVSDispatcher
              captures: { r3: $.data.id }
            - call: "POST /evs/clean-requests/${r3}/assign"
              payload: { staff_id: "${t1}" }
              as: EVSDispatcher
            - call: "POST /evs/clean-requests/${r3}/start"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t1}"
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T10:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/clean-requests/${r3}/complete"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t1}"
            - call: "POST /evs/quality-audits"
              payload: { clean_request_id: "${r3}", audit_method: "ATP_SWAB", rlu_reading: 100 }
              as: QualityAuditor
              as_user_id: "${a1}"
          trigger:
            - call: "GET /evs/staff/${t1}/productivity"
              payload: {}
              as: Any
              captures: { credits: $.data.verified_credit_total, fails: $.data.qa_fail_count }
          assert:
            - "credits == 3.39 (3 x round2(1.00 * 45/40) = 3 x 1.13; NOT round2(3.375) = 3.38)"
            - "fails == 0"
            - "StaffMember.${t1}.completed_clean_count == 3"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
  # ---------------------------------------------------------------------------
    instances:
      - name: clean_request_reclean_cycle
        grounds:
          - state_machines.CleanRequest.PENDING_QA_to_NEEDS_RECLEAN
          - state_machines.CleanRequest.NEEDS_RECLEAN_to_ASSIGNED
          - calculations.audit_result_determination
        distinguishing_aspect: |
          Cyclic machine on CleanRequest: PENDING_QA -> NEEDS_RECLEAN ->
          ASSIGNED -> IN_PROGRESS -> PENDING_QA -> VERIFIED loops the entity
          back through a previously-visited state (ASSIGNED/IN_PROGRESS) with
          reclean_count incrementing per lap and the reclean leg consuming
          half-rate supplies.
        test_recipe:
          setup:
            - "Unit U, standards, supplies, bed B1, techs T1+T2 (both CLEAN, T1 no certs; ROUTINE so fine), auditor A"
            - "ROUTINE request R assigned to T1, started, completed; FAIL audit (rlu 300 > 250) -> NEEDS_RECLEAN"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/units"
              payload: { unit_code: "U1", display_name: "Unit One" }
              as: EVSAdministrator
              captures: { u1: $.data.id }
            - call: "POST /evs/clean-standards"
              payload: { clean_type: "ROUTINE", base_minutes: 45, outbreak_multiplier_bps: 15000, atp_rlu_threshold: 250 }
              as: EVSAdministrator
            - call: "POST /evs/clean-standards"
              payload: { clean_type: "ISOLATION", base_minutes: 60, outbreak_multiplier_bps: 15000, atp_rlu_threshold: 150 }
              as: EVSAdministrator
            - call: "POST /evs/clean-standards"
              payload: { clean_type: "TERMINAL", base_minutes: 90, outbreak_multiplier_bps: 20000, atp_rlu_threshold: 100 }
              as: EVSAdministrator
            - call: "POST /evs/supply-items"
              payload: { item_code: "DISINFECTANT", display_name: "Disinfectant", initial_on_hand: 100, reorder_threshold: 10 }
              as: EVSAdministrator
            - call: "POST /evs/supply-items"
              payload: { item_code: "CLOTH", display_name: "Cloths", initial_on_hand: 200, reorder_threshold: 20 }
              as: EVSAdministrator
            - call: "POST /evs/staff"
              payload: { employee_code: "T1", display_name: "Tech One", capabilities: ["CLEAN"], certifications: [] }
              as: EVSAdministrator
              captures: { t1: $.data.id }
            - call: "POST /evs/staff"
              payload: { employee_code: "T2", display_name: "Tech Two", capabilities: ["CLEAN"], certifications: [] }
              as: EVSAdministrator
              captures: { t2: $.data.id }
            - call: "POST /evs/staff"
              payload: { employee_code: "A1", display_name: "Auditor One", capabilities: ["AUDIT"], certifications: [] }
              as: EVSAdministrator
              captures: { a1: $.data.id }
            - call: "POST /evs/staff/${t1}/clock-in"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t1}"
            - call: "POST /evs/staff/${t2}/clock-in"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t2}"
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B1", bed_kind: "STANDARD" }
              as: EVSAdministrator
              captures: { b1: $.data.id }
            - call: "POST /evs/clean-requests"
              payload: { bed_id: "${b1}", clean_type: "ROUTINE" }
              as: EVSDispatcher
              captures: { r1: $.data.id }
            - call: "POST /evs/clean-requests/${r1}/assign"
              payload: { staff_id: "${t1}" }
              as: EVSDispatcher
            - call: "POST /evs/clean-requests/${r1}/start"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t1}"
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:45:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/clean-requests/${r1}/complete"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t1}"
            - call: "POST /evs/quality-audits"
              payload: { clean_request_id: "${r1}", audit_method: "ATP_SWAB", rlu_reading: 300 }
              as: QualityAuditor
              as_user_id: "${a1}"
          trigger:
            # reclean leg: different technician (second-set-of-hands), same machine
            - call: "POST /evs/clean-requests/${r1}/assign"
              payload: { staff_id: "${t2}" }
              as: EVSDispatcher
            - call: "POST /evs/clean-requests/${r1}/start"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t2}"
