              as: Client
              as_user_id: "${client_id}"
              captures: { jp_id: $.data.id }
            - call: "POST /proposals"
              payload: { job_posting_id: "${jp_id}", freelancer_id: "${fl_id}", bid_amount_cents: 25000, cover_letter: "bid" }
              as: Freelancer
              as_user_id: "${fl_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /proposals/${prop_id}/accept"
              payload: { actor_role: "CLIENT" }
              as: Client
              as_user_id: "${client_id}"
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: { sow_text: "term work" }
              as: Client
              as_user_id: "${client_id}"
              captures: { cv0: $.data.version }
            - call: "POST /contracts/${contract_id}/milestones"
              payload: { title: "Funded", amount_cents: 15000, ordinal: 1 }
              as: Client
              as_user_id: "${client_id}"
              captures: { mf: $.data.id }
            - call: "POST /contracts/${contract_id}/milestones"
              payload: { title: "Draft", amount_cents: 10000, ordinal: 2 }
              as: Client
              as_user_id: "${client_id}"
              captures: { md: $.data.id }
            - call: "POST /contracts/${contract_id}/milestones/${mf}/fund"
              payload: { expected_contract_version: "${cv0}" }
