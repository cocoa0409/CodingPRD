              payload: {}
              as: RouteSupervisor
          trigger:
            - call: "POST /dsd/stale-credits"
              payload: { route_day_id: "${day_id}", store_id: "${store_id}", product_id: "${prod_id}", qty_cases: 10 }
              as: RouteSalesRep
              as_user_id: "${rep_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and err == ERR_STORE_NOT_ACTIVE"
            - "err != ERR_STORE_CREDIT_CAP_EXCEEDED even though 10 x 250 == 2500 exceeds the 100-cent cap"
            - "GET /dsd/stale-credits?store_id=${store_id} returns 0 rows (no credit persisted)"

      - name: freshness_safety_failure_beats_line_not_on_order_referential_failure
