          - state_machines.MonthlyInvoice.DRAFT_to_SUPERSEDED
        distinguishing_aspect: |
          Re-drafting a period is allowed while the prior invoice is DRAFT (it is
          simply SUPERSEDED) but forbidden once it is ISSUED: the second August
          draft is 409 ERR_INVOICE_PERIOD_CONFLICT while a September draft on the
          same contract succeeds. The OCC input must be re-read each time, because
          every successful draft bumps the contract's version.
        test_recipe:
          setup:
            - "ACTIVE-CONTRACT chain; the 2026-08 invoice drafted (net 0) and issued; the contract version re-read afterwards."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
