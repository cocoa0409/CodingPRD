          - entities.WocNurse.fields.max_consult_load
          - global_constants.MAX_LOAD_BY_CERT
        distinguishing_aspect: "The lapse action deliberately leaves the nurse over-committed: max_consult_load drops to MAX_LOAD_BY_CERT[LAPSED] == 0 while active_consult_load keeps its existing value, so the invariant load <= max is knowingly violated rather than repaired by silently unassigning consults."
