        excluded_because:
          difficulty_instance: heading_completion_blocked_while_its_tool_is_worn
          rationale: >
            The §1.8 instance drives a die from MOUNTED to WORN mid-lot and shows the priority-11
            cross-entity ERR_INVALID_TOOL_STATE at complete-heading, including the regrind that clears it,
            so this corner would only restate the same call sequence.

      - name: furnace_occupancy_blocks_a_second_run_start
        claim_type: Cross-entity Validation
        excluded_because:
          difficulty_instance: furnace_run_start_blocked_while_furnace_is_occupied
          rationale: >
            ERR_FURNACE_OCCUPIED at priority 11 is exercised in §1.8 with two runs whose windows do not
            conflict but whose starts overlap in logical time, which is the complete statement of this
            cross-entity rule.

      - name: press_window_overlap_on_the_same_die
        claim_type: Temporal Validation
        excluded_because:
          difficulty_instance: press_window_conflict_treats_tool_intervals_as_half_open
          rationale: >
            The half-open semantics of ERR_TOOL_WINDOW_CONFLICT — abutting windows accepted, one-minute
            overlaps refused, ABORTED lots ignored — are fully covered by the §1.8 instance.

      - name: furnace_window_overlap_including_cooldown
        claim_type: Temporal Validation
        excluded_because:
          difficulty_instance: furnace_window_conflict_uses_inclusive_bounds_plus_cooldown_buffer
          rationale: >
            ERR_FURNACE_WINDOW_CONFLICT with its inclusive bounds and Furnace.cooldown_minutes buffer is
            probed at the exact boundary in §1.8, so a separate corner adds nothing.

  - section: endpoints
    instances:
      - name: production_lot_list_combines_filters_with_pagination
        claim_type: Listing
        grounds:
          - endpoints[GET /production-lots]
          - complexity_layers.pagination_with_filtering
        distinguishing_aspect: >
          Filters narrow the set before the window is applied: with three lots on one die (one HEADED, two
          SETUP, one of the SETUP lots on HOLD), process_state=SETUP reports total_count 2 while
          disposition=HOLD reports total_count 1, and limit 1 / offset 1 over the SETUP filter returns the
          second SETUP lot with has_more false — a total_count computed after pagination or a filter
          applied after the window would both diverge.
        test_recipe:
          setup:
            - "One VERIFIED heat, one released 500.0 kg wire lot, one mounted die DIE-4S-001, part spec NP-M8-088."
            - "Three lots on abutting press windows: L-A 06:00-08:00 (completed heading), L-B 08:00-10:00 (SETUP), L-C 10:00-12:00 (SETUP, then placed on hold)."
