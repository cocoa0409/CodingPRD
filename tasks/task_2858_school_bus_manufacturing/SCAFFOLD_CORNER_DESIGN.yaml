            - call: "POST /build-slots"
              payload: { expected_production_line_version: "${line_d_v1}", production_line_id: "${line_d_id}", bus_unit_id: "${unit_2_id}", start_date: "2026-10-05", end_date: "2026-10-08" }
              as: PlantScheduler
              as_user_id: "plant-01"
              captures: { err_body_class: $.data.error_id }
          assert:
            - "the first slot is created 201 PLANNED with slot_days 7 and pushes the line to version 2 while committed_slot_days stays 0"
            - "the second create replaying expected_production_line_version 1 fails 412 ERR_STALE_LINE_VERSION even though [2026-09-14, 2026-09-21) is free, adjacent-legal for the same DIESEL propulsion and well inside the 30-day horizon"
            - "the retry with version 2 returns 201 with slot_days 7"
            - "committing slot 1 moves the line to version 4 (create, create, commit) and committed_slot_days to 7"
            - "the last create replaying version 2 fails 412 ERR_STALE_LINE_VERSION: a commit by anyone invalidates every previously observed line version, and the OCC check (20) precedes the window (46/47/48) and capacity (64) rules"
            - "the same window offered to line L-D1 with ITS correct version 1 fails 422 ERR_BODY_CLASS_UNSUPPORTED — once the OCC gate is satisfied the body-class compatibility rule (58) is reached, and a TYPE_C bus cannot be slotted on a TYPE_D-only line"

      - name: dealer_counters_are_recomputed_from_their_sources_by_distinct_unit
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.dealer_recall_exposure
          - entities.Dealer.fields.open_recall_unit_count
          - entities.Dealer.fields.delivered_unit_count
          - endpoints[POST /remedy-tasks/{id}/complete]
          - endpoints[POST /remedy-tasks/{id}/cancel]
        distinguishing_aspect: |
          open_recall_unit_count counts DISTINCT bus units with a live task, not tasks: one bus swept into two
          campaigns holds two OPEN tasks yet contributes exactly 1, so the dealer stays GOOD where a
          task-counting implementation would cross the RESTRICT threshold of 2. The counters are also pure
          re-derivations, not increments — they fall back correctly when a task COMPLETES, when a task is
          CANCELLED, and they rise again when a new source row (a second legacy delivery) appears.
        test_recipe:
          setup:
            - "TX fixture; dealer D-TX with one legacy DIESEL unit delivered 2026-05-10"
            - "Two campaigns RC-A and RC-B both matching TYPE_C_CONV / DIESEL over 2026-01-01..2026-07-31, kits_per_unit 1, total_kits 2 each"
            - "Clock at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ContractsAdmin
              as_user_id: "contracts-01"
            - call: "POST /bus-models"
              payload: { model_code: "TYPE_C_CONV", body_class: "TYPE_C", base_seat_capacity: 71, base_emergency_exit_count: 5, base_price_cents: 12750000, body_joint_strength_kn: 58.0, max_battery_bays: 6, curb_weight_lb: 21500 }
