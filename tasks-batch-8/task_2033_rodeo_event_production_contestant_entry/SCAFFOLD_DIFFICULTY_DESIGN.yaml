  - rule_id: boundary_precision_check
    instances:
      - name: ticket_order_at_exact_capacity_succeeds_plus_one_fails
        grounds: [calculations.ticket_capacity_check, "errors[ERR_CAPACITY_EXCEEDED]", "endpoints.POST_/api/ticket-orders"]
        distinguishing_aspect: "Seat-count boundary on POST /api/ticket-orders: sold_tickets + quantity == arena_capacity (100) succeeds; the very next order of 1 (101st seat) fails with ERR_CAPACITY_EXCEEDED — the check is inclusive at the boundary."
        test_recipe:
          setup:
            - "Rodeo DRAFT with one performance, arena_capacity 100, sold_tickets 0"
          setup_api_calls:
            - { call: "POST /api/rodeos", payload: { name: "Vernal Dinosaur", city: "Vernal", entries_close_at: "2026-08-10T00:00:00Z" }, as: CommitteeAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /api/performances", payload: { rodeo_id: "${r_id}", label: "Friday", arena: "Main", starts_at: "2026-08-14T19:00:00Z", ends_at: "2026-08-14T22:00:00Z", arena_capacity: 100 }, as: CommitteeAdmin, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /api/ticket-orders", payload: { performance_id: "${p_id}", section: "GA", quantity: 60, unit_price_cents: 2500 }, as: BoxOffice, captures: { t1: $.data.id } }
            - { call: "POST /api/ticket-orders", payload: { performance_id: "${p_id}", section: "GA", quantity: 40, unit_price_cents: 2500 }, as: BoxOffice, captures: { t2: $.data.id } }
            - { call: "POST /api/ticket-orders", payload: { performance_id: "${p_id}", section: "GA", quantity: 1, unit_price_cents: 2500 }, as: BoxOffice, captures: { err: $.data.error_id } }
            - { call: "GET /api/performances/${p_id}", payload: {}, as: BoxOffice }
          assert:
            - "Orders ${t1} (60) and ${t2} (40) both succeed: 60+40 == 100 exactly reaches capacity and is accepted"
            - "Third order (quantity 1) is rejected with ERR_CAPACITY_EXCEEDED"
            - "Performance.sold_tickets == 100 after the sequence (no partial seat recorded for the rejected order)"

