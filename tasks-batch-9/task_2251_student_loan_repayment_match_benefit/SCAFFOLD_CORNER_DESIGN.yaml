              payload: { to_status: "OPEN" }
              as: BenefitsAdministrator
              captures: { st: $.data.status }
            - call: "POST /employees"
              payload: { external_id: "E-TUGATE", hire_date: "2019-01-01T00:00:00Z", prior_year_compensation_cents: 6000000, vesting_service_months: 72 }
