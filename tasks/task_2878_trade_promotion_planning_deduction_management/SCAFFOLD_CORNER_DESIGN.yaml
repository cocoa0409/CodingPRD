            - "the second call is HTTP 403 with ${err_read} == ERR_CUSTOMER_SCOPE_VIOLATION, not 404"
            - "the third call is HTTP 403 with ${err_list} == ERR_CUSTOMER_SCOPE_VIOLATION"
