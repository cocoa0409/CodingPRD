            - "Sale.${sale_b_id}.sales_tax_cents == 21875"
            - "Sale.${sale_b_id}.commission_cents == 25000"
            - "Sale.${sale_b_id}.artist_payable_cents == 225000"
            - "Sale.${sale_b_id}.buyer_total_cents == 271875"
