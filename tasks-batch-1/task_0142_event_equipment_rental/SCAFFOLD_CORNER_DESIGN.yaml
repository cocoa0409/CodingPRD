        claim_type: flat
        grounds: [entities.OrderLine.fields.item_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Adding an OrderLine whose item_id does not reference an existing CatalogItem → ERR_NOT_FOUND 404 (FK integrity)."
