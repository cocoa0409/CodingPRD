# =============================================================================
# Task 1893: Loan Participation & Syndication Administration
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index (breadth probe)
# Sections follow references/claim-extraction-guide.md
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: borrower_creation_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.Borrower]
        distinguishing_aspect: "POST with required fields returns 201 with system status ACTIVE, version 1, server id/created_at."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Acme", sector: "INDUSTRIAL", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id, b_v: $.data.version, b_status: $.data.status } }
          trigger:
            - { call: "GET /api/borrowers/${b_id}", as: AgentBank, captures: { b_get: $.data.status } }
          assert:
            - "create response data.status == ACTIVE, data.version == 1"
            - "GET returns the same borrower with legal_name == Acme"

      - name: facility_optional_threshold_defaults
        claim_type: defaults
        grounds: [entities.Facility.fields.majority_threshold_bps, entities.Facility.fields.quorum_bps, entities.Facility.fields.min_transfer_cents]
        distinguishing_aspect: "Omitting the five optional policy fields yields defaults 5001/6667/5000/15/1000000."
        test_recipe:
          setup: ["one borrower exists"]
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Def B", sector: "ENERGY", risk_rating: "SPECULATIVE" }, as: AgentBank, captures: { b_id: $.data.id } }
          trigger:
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Defaults", total_commitment_cents: 5000000, currency: "USD", interest_rate_bps: 900, day_count_basis: "ACT_365", servicing_fee_bps: 10, default_interest_addon_bps: 300, maturity_date: "2030-01-01" }, as: AgentBank, captures: { f_id: $.data.id } }
          assert:
            - "Facility.${f_id}.majority_threshold_bps == 5001, supermajority_threshold_bps == 6667, quorum_bps == 5000, voting_window_days == 15, min_transfer_cents == 1000000"
            - "Facility.${f_id}.status == STRUCTURING and committed_cents == 0"

      - name: facility_creation_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Facility, 'errors[ERR_INVALID_REQUEST]']
        distinguishing_aspect: "Omitting required interest_rate_bps yields 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["one borrower exists"]
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Req B", sector: "OTHER", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
          trigger:
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Missing", total_commitment_cents: 5000000, currency: "USD", day_count_basis: "ACT_360", servicing_fee_bps: 25, default_interest_addon_bps: 800, maturity_date: "2030-01-01" }, as: AgentBank, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400"

      - name: facility_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.Facility.fields.day_count_basis, 'errors[ERR_INVALID_REQUEST]']
        distinguishing_aspect: "day_count_basis outside the enum domain is rejected 400."
        test_recipe:
          setup: ["one borrower exists"]
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Enum B", sector: "OTHER", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
          trigger:
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Enum", total_commitment_cents: 5000000, currency: "USD", interest_rate_bps: 900, day_count_basis: "ACT_365X", servicing_fee_bps: 10, default_interest_addon_bps: 300, maturity_date: "2030-01-01" }, as: AgentBank, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400"

      - name: participant_zero_commitment_rejected
        claim_type: type_constraints
        grounds: [entities.Participant.fields.commitment_cents, 'errors[ERR_INVALID_REQUEST]']
        distinguishing_aspect: "commitment_cents must be > 0; zero is rejected 400."
        test_recipe:
          setup: ["borrower + facility exist"]
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Zero B", sector: "OTHER", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Zero", total_commitment_cents: 5000000, currency: "USD", interest_rate_bps: 900, day_count_basis: "ACT_360", servicing_fee_bps: 10, default_interest_addon_bps: 300, maturity_date: "2030-01-01" }, as: AgentBank, captures: { f_id: $.data.id } }
          trigger:
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "ZeroP", commitment_cents: 0 }, as: AgentBank, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400"

      - name: participant_get_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Participant, 'errors[ERR_NOT_FOUND]']
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/participants/00000000-0000-0000-0000-000000000000", as: AgentBank, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND, HTTP 404"

      - name: participant_with_missing_facility_returns_not_found
        claim_type: fk_integrity
        grounds: [entities.Participant.fields.facility_id, 'errors[ERR_NOT_FOUND]']
        distinguishing_aspect: "Creating a participant against a non-existent facility_id fails 404 (FK integrity)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/participants", payload: { facility_id: "00000000-0000-0000-0000-000000000000", participant_name: "Orphan", commitment_cents: 1000000 }, as: AgentBank, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND, HTTP 404"

      - name: participant_computed_fields_start_at_zero
        claim_type: computed_fields
        grounds: [entities.Participant.fields.share_bps, entities.Participant.fields.funded_cents]
        distinguishing_aspect: "Computed fields share_bps/funded_cents/cumulative_* are 0 at creation and server-owned."
        test_recipe:
          setup: ["borrower + facility exist"]
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Comp B", sector: "TECHNOLOGY", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Comp", total_commitment_cents: 5000000, currency: "USD", interest_rate_bps: 900, day_count_basis: "ACT_360", servicing_fee_bps: 10, default_interest_addon_bps: 300, maturity_date: "2030-01-01" }, as: AgentBank, captures: { f_id: $.data.id } }
          trigger:
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "CompP", commitment_cents: 1000000 }, as: AgentBank, captures: { p_id: $.data.id, p_share: $.data.share_bps } }
          assert:
            - "Participant.${p_id}.share_bps == 0 (PROPOSED participants carry no share)"
            - "funded_cents == 0, cumulative_interest_cents == 0, cumulative_principal_cents == 0, status == PROPOSED"

      - name: facility_list_pagination_and_envelope
        claim_type: listing
        grounds: [response_envelope, entities.Facility]
        distinguishing_aspect: "List endpoint honors limit/offset and returns pagination fields plus the fixed envelope meta."
        test_recipe:
          setup: ["two facilities exist for one borrower"]
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "List B", sector: "ENERGY", risk_rating: "INVESTMENT_GRADE" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac L1", total_commitment_cents: 1000000, currency: "USD", interest_rate_bps: 900, day_count_basis: "ACT_360", servicing_fee_bps: 10, default_interest_addon_bps: 300, maturity_date: "2030-01-01" }, as: AgentBank, captures: { f1: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac L2", total_commitment_cents: 2000000, currency: "USD", interest_rate_bps: 900, day_count_basis: "ACT_360", servicing_fee_bps: 10, default_interest_addon_bps: 300, maturity_date: "2030-01-01" }, as: AgentBank, captures: { f2: $.data.id } }
          trigger:
            - { call: "GET /api/facilities?borrower_id=${b_id}&limit=1&offset=0", as: AgentBank, captures: { total: $.data } }
          assert:
            - "response envelope contains meta.api_request_id and response_type == array"
            - "pagination: total_count == 2, has_more == true with limit=1; data has exactly 1 facility"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: participant_commit_valid_transition_and_bubbles
        claim_type: valid_transition
        grounds: [state_machines.Participant.PROPOSED_to_COMMITTED, state_machines.Facility.STRUCTURING_to_SYNDICATING]
        distinguishing_aspect: "Commit moves PROPOSED -> COMMITTED and bubbles the facility STRUCTURING -> SYNDICATING -> COMMITTED at exact subscription."
        test_recipe:
          setup: ["facility 5,000,000 with one PROPOSED participant 5,000,000"]
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Bub B", sector: "OTHER", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac BubC", total_commitment_cents: 5000000, currency: "USD", interest_rate_bps: 900, day_count_basis: "ACT_360", servicing_fee_bps: 10, default_interest_addon_bps: 300, maturity_date: "2030-01-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "SP", commitment_cents: 5000000 }, as: AgentBank, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /api/participants/${p_id}/commit", payload: {}, as: AgentBank }
          assert:
            - "Participant.${p_id}.status == COMMITTED and share_bps == 10000"
            - "Facility.${f_id}.committed_cents == 5000000 and status == COMMITTED (SYNDICATING passed through on first commit)"

      - name: participant_commit_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Participant.PROPOSED_to_COMMITTED, 'errors[ERR_INVALID_STATE_TRANSITION]']
        distinguishing_aspect: "Second commit on a COMMITTED participant is rejected; transitions are not idempotent."
        test_recipe:
          setup: ["facility with one COMMITTED participant"]
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Twice B", sector: "OTHER", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Twice", total_commitment_cents: 5000000, currency: "USD", interest_rate_bps: 900, day_count_basis: "ACT_360", servicing_fee_bps: 10, default_interest_addon_bps: 300, maturity_date: "2030-01-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "TP", commitment_cents: 5000000 }, as: AgentBank, captures: { p_id: $.data.id } }
            - { call: "POST /api/participants/${p_id}/commit", payload: {}, as: AgentBank }
          trigger:
            - { call: "POST /api/participants/${p_id}/commit", payload: {}, as: AgentBank, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION, HTTP 409"

      - name: exited_participant_terminal_lockdown_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Participant, 'errors[ERR_INVALID_STATE_TRANSITION]']
        distinguishing_aspect: "EXITED is terminal: commit on an EXITED participant fails 409."
        test_recipe:
          setup: ["facility 10,000,000 with P1 6,000,000 and P2 4,000,000 COMMITTED; P2 fully transferred out (EXITED)"]
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Term B", sector: "OTHER", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Term", total_commitment_cents: 10000000, currency: "USD", interest_rate_bps: 900, day_count_basis: "ACT_360", servicing_fee_bps: 10, default_interest_addon_bps: 300, maturity_date: "2030-01-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P1", commitment_cents: 6000000 }, as: AgentBank, captures: { p1_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P2", commitment_cents: 4000000 }, as: AgentBank, captures: { p2_id: $.data.id } }
            - { call: "POST /api/participants/${p1_id}/commit", payload: {}, as: AgentBank }
            - { call: "POST /api/participants/${p2_id}/commit", payload: {}, as: AgentBank }
            - { call: "POST /api/transfers", payload: { facility_id: "${f_id}", transfer_amount_cents: 4000000, settlement_date: "2026-08-10", transferee_name: "Buyer" }, as: ParticipantLender, as_user_id: "${p2_id}", captures: { t_id: $.data.id } }
            - { call: "POST /api/transfers/${t_id}/approve", payload: {}, as: AgentBank }
            - { call: "GET /api/participants/${p2_id}", as: AgentBank, captures: { p2_v: $.data.version } }
            - { call: "POST /api/transfers/${t_id}/settle", payload: { expected_from_participant_version: "${p2_v}" }, as: AgentBank }
          trigger:
            - { call: "POST /api/participants/${p2_id}/commit", payload: {}, as: AgentBank, captures: { err: $.data.error_id } }
          assert:
            - "Participant.${p2_id}.status == EXITED and commit returns error_id == ERR_INVALID_STATE_TRANSITION, HTTP 409"

      - name: draw_cancel_voids_pending_settlements
        claim_type: side_effect_execution
        grounds: [state_machines.Draw.FUNDING_to_CANCELLED, state_machines.FundingSettlement.PENDING_to_VOID]
        distinguishing_aspect: "Cancelling a draw with no confirmed funds voids its PENDING settlements and reverts facility FUNDING -> COMMITTED."
        test_recipe:
          setup: ["facility 5,000,000 with one COMMITTED participant; draw 2,000,000 created (settlements PENDING)"]
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Canc B", sector: "OTHER", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Canc", total_commitment_cents: 5000000, currency: "USD", interest_rate_bps: 900, day_count_basis: "ACT_360", servicing_fee_bps: 10, default_interest_addon_bps: 300, maturity_date: "2030-01-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "CP", commitment_cents: 5000000 }, as: AgentBank, captures: { p_id: $.data.id } }
            - { call: "POST /api/participants/${p_id}/commit", payload: {}, as: AgentBank }
            - { call: "GET /api/facilities/${f_id}", as: AgentBank, captures: { f_v: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${f_id}", draw_amount_cents: 2000000, accrual_start_date: "2026-08-01", accrual_end_date: "2027-08-01", expected_facility_version: "${f_v}" }, as: AgentBank, captures: { d_id: $.data.id } }
          trigger:
            - { call: "POST /api/draws/${d_id}/cancel", payload: {}, as: AgentBank }
          assert:
            - "Draw.${d_id}.status == CANCELLED"
            - "its FundingSettlement status == VOID"
            - "Facility.${f_id}.status == COMMITTED (reverted from FUNDING)"

      - name: draw_cancel_with_confirmed_funds_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Draw.FUNDING_to_CANCELLED, 'errors[ERR_DRAW_HAS_CONFIRMED_FUNDS]']
        distinguishing_aspect: "A draw with a CONFIRMED settlement cannot be cancelled: ERR_DRAW_HAS_CONFIRMED_FUNDS."
        test_recipe:
          setup: ["facility 5,000,000 single participant; draw 2,000,000; participant wired 2,000,000 and agent confirmed"]
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Conf B", sector: "OTHER", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Conf", total_commitment_cents: 5000000, currency: "USD", interest_rate_bps: 900, day_count_basis: "ACT_360", servicing_fee_bps: 10, default_interest_addon_bps: 300, maturity_date: "2030-01-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "CP", commitment_cents: 5000000 }, as: AgentBank, captures: { p_id: $.data.id } }
            - { call: "POST /api/participants/${p_id}/commit", payload: {}, as: AgentBank }
            - { call: "GET /api/facilities/${f_id}", as: AgentBank, captures: { f_v: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${f_id}", draw_amount_cents: 2000000, accrual_start_date: "2026-08-01", accrual_end_date: "2027-08-01", expected_facility_version: "${f_v}" }, as: AgentBank, captures: { d_id: $.data.id } }
            - { call: "GET /api/funding_settlements?participant_id=${p_id}", as: AgentBank, captures: { s1: '$.data[0].id' } }
            - { call: "POST /api/funding_settlements/${s1}/report_wire", payload: { amount_cents: 2000000 }, as: ParticipantLender, as_user_id: "${p_id}" }
            - { call: "POST /api/funding_settlements/${s1}/confirm", payload: {}, as: AgentBank }
          trigger:
            - { call: "POST /api/draws/${d_id}/cancel", payload: {}, as: AgentBank, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DRAW_HAS_CONFIRMED_FUNDS, HTTP 409; Draw stays SETTLED"

      - name: settlement_confirm_amount_mismatch_rejected
        claim_type: violation_to_error
        grounds: [state_machines.FundingSettlement.WIRED_to_CONFIRMED, 'errors[ERR_FUNDING_AMOUNT_MISMATCH]']
        distinguishing_aspect: "received_cents != due_cents at confirm -> ERR_FUNDING_AMOUNT_MISMATCH (exact cash matching)."
        test_recipe:
          setup: ["facility 5,000,000 single participant; draw 2,000,000; settlement due 2,000,000 but participant wired 1,999,999"]
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Mis B", sector: "OTHER", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Mis", total_commitment_cents: 5000000, currency: "USD", interest_rate_bps: 900, day_count_basis: "ACT_360", servicing_fee_bps: 10, default_interest_addon_bps: 300, maturity_date: "2030-01-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "MP", commitment_cents: 5000000 }, as: AgentBank, captures: { p_id: $.data.id } }
            - { call: "POST /api/participants/${p_id}/commit", payload: {}, as: AgentBank }
            - { call: "GET /api/facilities/${f_id}", as: AgentBank, captures: { f_v: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${f_id}", draw_amount_cents: 2000000, accrual_start_date: "2026-08-01", accrual_end_date: "2027-08-01", expected_facility_version: "${f_v}" }, as: AgentBank, captures: { d_id: $.data.id } }
            - { call: "GET /api/funding_settlements?participant_id=${p_id}", as: AgentBank, captures: { s1: '$.data[0].id' } }
            - { call: "POST /api/funding_settlements/${s1}/report_wire", payload: { amount_cents: 1999999 }, as: ParticipantLender, as_user_id: "${p_id}" }
          trigger:
            - { call: "POST /api/funding_settlements/${s1}/confirm", payload: {}, as: AgentBank, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FUNDING_AMOUNT_MISMATCH, HTTP 409; settlement stays WIRED"

      - name: settlement_mark_defaulted_before_due_rejected
        claim_type: violation_to_error
        grounds: [state_machines.FundingSettlement.PENDING_to_DEFAULTED, 'errors[ERR_FUNDING_NOT_YET_DUE]']
        distinguishing_aspect: "mark_defaulted before funding_due_date (creation + 5 days) -> ERR_FUNDING_NOT_YET_DUE."
        test_recipe:
          setup: ["draw created at clock 2026-08-01 (due 2026-08-06); clock advanced only to 2026-08-03"]
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Due B", sector: "OTHER", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Due", total_commitment_cents: 5000000, currency: "USD", interest_rate_bps: 900, day_count_basis: "ACT_360", servicing_fee_bps: 10, default_interest_addon_bps: 300, maturity_date: "2030-01-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "DP", commitment_cents: 5000000 }, as: AgentBank, captures: { p_id: $.data.id } }
            - { call: "POST /api/participants/${p_id}/commit", payload: {}, as: AgentBank }
            - { call: "GET /api/facilities/${f_id}", as: AgentBank, captures: { f_v: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${f_id}", draw_amount_cents: 2000000, accrual_start_date: "2026-08-01", accrual_end_date: "2027-08-01", expected_facility_version: "${f_v}" }, as: AgentBank, captures: { d_id: $.data.id } }
            - { call: "GET /api/funding_settlements?participant_id=${p_id}", as: AgentBank, captures: { s1: '$.data[0].id' } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: AgentBank }
          trigger:
            - { call: "POST /api/funding_settlements/${s1}/mark_defaulted", payload: {}, as: AgentBank, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FUNDING_NOT_YET_DUE, HTTP 409 (due date is 2026-08-06, clock 2026-08-03)"

      - name: tally_before_window_close_rejected
        claim_type: violation_to_error
        grounds: [state_machines.ModificationRequest.SOLICITING_to_PASSED, 'errors[ERR_VOTING_STILL_OPEN]']
        distinguishing_aspect: "tally_close while clock <= voting_close_at -> ERR_VOTING_STILL_OPEN."
        test_recipe:
          setup: ["funded facility (P1 5,000,000); solicitation opened at clock 2026-08-01 (closes 2026-08-16); clock now 2026-08-10"]
          setup_api_calls:
