            - call: "POST /residual-batches/${b1}/lines"
              payload: { merchant_id: "${my}", transaction_count: 124, sales_volume_cents: 100000, interchange_cents: 1800, assessments_cents: 130, gross_income_cents: 3200 }
              as: ResidualAnalyst
              captures: { ly: $.data.id }
            - call: "POST /residual-batches/${b1}/normalize"
              payload: {}
