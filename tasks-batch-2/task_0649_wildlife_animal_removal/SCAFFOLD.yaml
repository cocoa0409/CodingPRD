  - method: GET
    path: "/technicians/{id}"
    description: "Fetch a technician including live kit counts."
    roles: [Dispatcher, FieldTechnician, ComplianceOfficer]
    code: 200
    input: []
    output: Technician
    side_effects: []
  - method: GET
    path: "/technicians"
    description: "List technicians (paginated)."
    roles: [Dispatcher, FieldTechnician, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Technician[]
    side_effects: []

  # ---- ServiceAccount ----
  - method: POST
    path: "/service-accounts"
    description: "Create a billing account."
    roles: [Dispatcher]
    code: 201
    input: [account_name, contact_email]
    output: ServiceAccount
    side_effects: []
  - method: GET
    path: "/service-accounts/{id}"
    description: "Fetch a service account."
    roles: [Dispatcher, PropertyOwner, ComplianceOfficer]
    code: 200
    input: []
    output: ServiceAccount
    side_effects: []

  # ---- Property ----
  - method: POST
    path: "/properties"
