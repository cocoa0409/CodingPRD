      - name: price_adjustment_dispute_revise_reproposal_cycle_then_acceptance
        grounds:
          - state_machines.PriceAdjustment.PROPOSED_to_DISPUTED
          - state_machines.PriceAdjustment.DISPUTED_to_PROPOSED
          - state_machines.PriceAdjustment.PROPOSED_to_ACCEPTED
          - entities.PriceAdjustment.fields.revision_count
          - validations[priority=41]
        distinguishing_aspect: |
          Negotiation cycle on a THIRD entity (PriceAdjustment.adj_status): PROPOSED -> DISPUTED ->
          PROPOSED -> ACCEPTED with revision_count incremented to exactly 1 and the accepted
          adjustment_pct_bps of 240 (not the original 480) landing on
          Account.green_price_factor_bps == 10240.
        test_recipe:
          setup:
            - "clock at 2026-08-03T08:00:00Z"
            - "one account with green_index_baseline_micros 2000000 and price_protection_days 90"
            - "the market green index stands at 2160000 micros, exactly +800 bps"
            - "one PROPOSED PriceAdjustment with movement_bps 800 and adjustment_pct_bps 480"
          setup_api_calls:
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/accounts"
              payload: { legal_name: "Northgate Holdings LLC", billing_mode: "CONSOLIDATED", green_index_baseline_micros: 2000000, price_protection_days: 90 }
              as: AccountManager
