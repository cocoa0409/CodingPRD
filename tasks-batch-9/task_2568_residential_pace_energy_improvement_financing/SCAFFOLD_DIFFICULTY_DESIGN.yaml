            - "The originally blocked call now succeeds: CompletionCertificate.${cc2b}.status == VERIFIED with verified_by_user_id == 'u_fund_v' and verified_at == '2028-09-01T00:00:00Z'"
            - "Untouched throughout: Application.${a1}.status == FUNDED, Disbursement.${d1}.status == RELEASED, Contractor.${c1}.gross_disbursed_cents == 3000000 and clawed_back_total_cents == 0"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: assessment_tax_year_span_adjacency_allowed_overlap_rejected
        grounds:
          - validations[priority=33]
          - errors[ERR_ASSESSMENT_YEAR_OVERLAP]
          - entities.Assessment.fields.final_tax_year
          - state_machines.Assessment.null_to_PENDING_ROLL
        distinguishing_aspect: |
          Interval semantics = CLOSED INTEGER interval of tax years [first_tax_year, final_tax_year]
          where adjacency IS allowed, and the contended resource is the PARCEL's place on the county
          roll. first_tax_year 2045 touches the incumbent span's last year and is rejected, while 2046
          starts the very next year and is accepted — so an implementation using a half-open or
          buffered comparison fails one of the two probes.
