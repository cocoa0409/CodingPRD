                lines: [ { item_id: "${item_id}", quantity: 5 } ]
              as: LogisticsCoordinator
              captures: { cont_id: $.data.id, cont_v: $.data.version }
            - call: "POST /stores"
              payload: { store_code: "ST10", name: "Store 10", format: "STANDARD", market_tier: "PRIMARY", receiving_capacity_units: 500, assortment_item_ids: ["${item_id}"] }
              as: OpsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/allocations"
              payload: { container_id: "${cont_id}", item_id: "${item_id}", quantity: 2 }
              as: InventoryPlanner
              captures: { alloc_id: $.data.id }
            - call: "POST /containers/${cont_id}/depart"
