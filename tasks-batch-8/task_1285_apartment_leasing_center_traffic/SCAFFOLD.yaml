# =============================================================================
# PRD Benchmark Seed Tables — Apartment Leasing Center & Traffic Conversion
# =============================================================================

scenario: |
  Apartment Leasing Center & Traffic Conversion (apartment leasing office): inquiry source tracking & response time targets, tour scheduling (guided/self-guided) & availability sync, pricing/concession display & expiration, application processing & approval conditions, lease generation & e-signature with addenda by property, move-in scheduling & utility transfer requirements, closing ratio by agent/source, waitlist for unavailable floorplans

domain_name: apartment-leasing
api_prefix: /leasing

# =============================================================================
# Complexity Profile (§0.1–§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing        # tour slots vs agent availability; move-in day buckets
  secondary_archetype: workflow_orchestration  # inquiry → tour → application → lease → move-in pipeline
  complexity_layers:
    - optimistic_concurrency                   # OCC on Application.version for lease (re)generation
    - scheduled_actions                        # logical clock: offer expiry, lease signing deadline, waitlist offer expiry
    - cascading_side_effects                   # countersign chain; lease-cancel chain
    - rate_threshold_triggers                  # response-time SLA flags; screening thresholds; closing-ratio basis
  entity_topology: flat                        # peer entities joined by FK references; no URL nesting
  state_machine_shape: branching               # fork/join approvals + cycles (waitlist requeue, rescreen loop)
  relationship_patterns:
    - one_to_many                              # Property → Floorplan/Offer/Inquiry; Floorplan → children
    - cross_aggregate                          # Tour → Inquiry+Agent+Floorplan; Application → Inquiry|WaitlistEntry
  role_model: hierarchical_override            # PropertyManager ⊃ LeasingAgent; Applicant standalone for e-sign
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table (10 entities)
# =============================================================================
entities:
  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Property display name" }
      - { name: code, type: string, source: input, description: "Unique property code", constraints: "unique across all properties" }
      - { name: response_time_target_minutes, type: integer, source: input, default: 60, description: "SLA target: minutes from inquiry creation to first agent response" }
      - { name: tour_buffer_minutes, type: integer, source: input, default: 15, description: "Minimum gap required between an agent's tours" }
      - { name: self_guided_window_minutes, type: integer, source: input, default: 60, description: "Fixed access-window length for SELF_GUIDED tours" }
      - { name: max_moveins_per_day, type: integer, source: input, default: 2, description: "Aggregate move-in capacity per UTC calendar date at this property" }
      - { name: utility_transfer_required, type: boolean, source: input, default: true, description: "When true, move-in completion requires utility transfer confirmation" }
      - { name: prorate_method, type: enum, source: input, default: "CALENDAR", description: "CALENDAR = prorate by actual days in month; FIXED_30 = prorate by 30-day months", constraints: "CALENDAR | FIXED_30" }
      - { name: required_addenda, type: array, source: input, default: [], description: "Addendum codes that must be snapshotted onto every lease generated for this property" }

  - name: Agent
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Agent display name" }
      - { name: email, type: string, source: input, description: "Agent email" }
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; agent's home property" }
      - { name: max_concurrent_tours, type: integer, source: input, default: 1, description: "Max overlapping guided tours this agent may hold" }
      - { name: active, type: boolean, source: input, default: true, description: "Inactive agents cannot be assigned new inquiries or tours" }

  - name: Floorplan
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: name, type: string, source: input, description: "Floorplan name, e.g. A2 - 1BR/1BA" }
      - { name: bedrooms, type: integer, source: input, description: "Bedroom count" }
      - { name: base_rent_cents, type: integer, source: input, description: "List rent in cents before concessions" }
      - { name: total_units, type: integer, source: input, description: "Physical unit count for this floorplan" }
      - { name: committed_units, type: integer, source: computed, description: "Count of Leases with floorplan_id = this and status IN {ISSUED, SIGNED_BY_APPLICANT, EXECUTED}" }
      - { name: available_units, type: integer, source: computed, description: "total_units - committed_units" }

  - name: PricingOffer
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: floorplan_id, type: string, source: input, description: "FK -> Floorplan.id" }
      - { name: base_rent_cents, type: integer, source: input, description: "Offer rent in cents before concession" }
      - { name: concession_type, type: enum, source: input, default: "NONE", description: "NONE | FLAT_AMOUNT | PERCENT_OFF | FREE_MONTHS" }
      - { name: concession_value, type: number, source: input, default: 0, description: "Cents for FLAT_AMOUNT; percent 0-100 for PERCENT_OFF; whole months for FREE_MONTHS" }
      - { name: lease_term_months, type: integer, source: input, default: 12, description: "Term used to amortize FREE_MONTHS concessions" }
      - { name: effective_start, type: datetime, source: input, description: "Offer display window start (ISO 8601 UTC)" }
      - { name: expires_at, type: datetime, source: input, description: "Offer expiry instant; must be > effective_start" }
      - { name: effective_monthly_rent_cents, type: integer, source: computed, description: "Displayed monthly price after concession per effective_monthly_rent calculation" }
      - { name: status, type: enum, source: system, description: "DRAFT → PUBLISHED → RETIRED | EXPIRED", constraints: "DRAFT | PUBLISHED | RETIRED | EXPIRED" }

  - name: Inquiry
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: floorplan_id, type: string, source: input, description: "FK -> Floorplan.id; optional floorplan of interest", constraints: "optional" }
      - { name: contact_name, type: string, source: input, description: "Prospect name" }
      - { name: contact_email, type: string, source: input, description: "Prospect email" }
      - { name: source, type: enum, source: input, description: "Lead source for attribution", constraints: "WALK_IN | PHONE | WEB_FORM | ILS_LISTING | REFERRAL" }
      - { name: assigned_agent_id, type: string, source: computed, description: "FK -> Agent.id; null until claimed" }
      - { name: first_responded_at, type: datetime, source: computed, description: "Logical-clock timestamp of first agent response; null until respond" }
      - { name: response_met_target, type: boolean, source: computed, description: "true iff first_responded_at - created_at <= property.response_time_target_minutes; null until responded" }
      - { name: status, type: enum, source: system, description: "NEW → CONTACTED → TOUR_SCHEDULED → CONVERTED; LOST from any non-terminal", constraints: "NEW | CONTACTED | TOUR_SCHEDULED | CONVERTED | LOST" }

  - name: Tour
    parent: null
    common_fields: true
    fields:
      - { name: inquiry_id, type: string, source: input, description: "FK -> Inquiry.id" }
      - { name: agent_id, type: string, source: input, description: "FK -> Agent.id; required for GUIDED, must be omitted for SELF_GUIDED", constraints: "conditional on tour_type" }
      - { name: tour_type, type: enum, source: input, description: "GUIDED | SELF_GUIDED" }
      - { name: scheduled_start, type: datetime, source: input, description: "Tour start (ISO 8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Tour end; input for GUIDED (must be > start); server-computed for SELF_GUIDED (= start + property.self_guided_window_minutes), client value ignored", constraints: "GUIDED: > scheduled_start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED → COMPLETED | NO_SHOW | CANCELLED; reschedule is a SCHEDULED → SCHEDULED self-loop", constraints: "SCHEDULED | COMPLETED | NO_SHOW | CANCELLED" }

  - name: WaitlistEntry
    parent: null
    common_fields: true
    fields:
      - { name: floorplan_id, type: string, source: input, description: "FK -> Floorplan.id" }
      - { name: contact_name, type: string, source: input, description: "Prospect name" }
      - { name: contact_email, type: string, source: input, description: "Prospect email" }
      - { name: position, type: integer, source: computed, description: "Queue position: max(position of entries for floorplan in {WAITING, OFFERED}) + 1 at creation and at each requeue; 1 when none" }
      - { name: offer_expires_at, type: datetime, source: computed, description: "Set at promotion to promoted clock time + OFFER_WINDOW_HOURS; null while WAITING" }
      - { name: linked_application_id, type: string, source: computed, description: "FK -> Application.id; set when an application is created from this entry's offer" }
      - { name: status, type: enum, source: system, description: "WAITING → OFFERED → CONVERTED; OFFERED → WAITING requeue on decline/expiry; CANCELLED from WAITING/OFFERED", constraints: "WAITING | OFFERED | CONVERTED | CANCELLED" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: inquiry_id, type: string, source: input, description: "FK -> Inquiry.id; exactly one of inquiry_id / waitlist_entry_id required", constraints: "optional, mutually exclusive with waitlist_entry_id" }
      - { name: waitlist_entry_id, type: string, source: input, description: "FK -> WaitlistEntry.id; exactly one of inquiry_id / waitlist_entry_id required", constraints: "optional, mutually exclusive with inquiry_id" }
      - { name: floorplan_id, type: string, source: input, description: "FK -> Floorplan.id; must equal the source inquiry's / waitlist entry's floorplan" }
      - { name: applicant_name, type: string, source: input, description: "Applicant legal name" }
      - { name: applicant_email, type: string, source: input, description: "Applicant email" }
      - { name: annual_income_cents, type: integer, source: input, description: "Verified gross annual income in cents" }
      - { name: credit_score, type: integer, source: input, description: "Screening credit score 300-850" }
      - { name: monthly_rent_snapshot_cents, type: integer, source: computed, description: "Rent pinned at creation: the floorplan's PUBLISHED offer's effective_monthly_rent_cents if one exists, else floorplan.base_rent_cents" }
      - { name: recommendation, type: enum, source: computed, description: "Screening outcome: APPROVE | CONDITION | DENY per screening_recommendation calculation", constraints: "APPROVE | CONDITION | DENY" }
      - { name: required_deposit_cents, type: integer, source: computed, description: "1x monthly_rent_snapshot_cents when APPROVED; 2x when APPROVED_WITH_CONDITIONS; null until decided; reset to null on rescreen" }
      - { name: deposit_paid_cents, type: integer, source: computed, default: 0, description: "Accumulated deposit recorded via clear-conditions" }
      - { name: status, type: enum, source: system, description: "SCREENING → APPROVED | APPROVED_WITH_CONDITIONS | DENIED; APPROVED_WITH_CONDITIONS → SCREENING (rescreen loop) or CONDITIONS_CLEARED; APPROVED/CONDITIONS_CLEARED → LEASED on lease execution; WITHDRAWN from SCREENING/APPROVED_WITH_CONDITIONS", constraints: "SCREENING | APPROVED | APPROVED_WITH_CONDITIONS | CONDITIONS_CLEARED | DENIED | WITHDRAWN | LEASED" }

  - name: Lease
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id" }
      - { name: floorplan_id, type: string, source: computed, description: "FK -> Floorplan.id; copied from the application at generation" }
      - { name: monthly_rent_cents, type: integer, source: computed, description: "Pinned rent: rent_override_cents when provided and valid, else selected offer's effective_monthly_rent_cents, else floorplan.base_rent_cents" }
      - { name: deposit_cents, type: integer, source: computed, description: "Snapshot of application.required_deposit_cents at generation" }
      - { name: addenda_codes, type: array, source: computed, description: "Snapshot of property.required_addenda at generation (addenda vary by property)" }
      - { name: signing_deadline, type: datetime, source: computed, description: "created_at + SIGNING_WINDOW_HOURS (48); unsigned leases expire past this instant" }
      - { name: signed_at, type: datetime, source: computed, description: "Applicant signature timestamp; null until sign" }
      - { name: executed_at, type: datetime, source: computed, description: "Countersignature timestamp; null until countersign" }
      - { name: superseded_by_id, type: string, source: computed, description: "Lease id of the regenerating lease when this lease is SUPERSEDED; null otherwise" }
      - { name: status, type: enum, source: system, description: "ISSUED → SIGNED_BY_APPLICANT → EXECUTED; ISSUED → SUPERSEDED | EXPIRED; CANCELLED from ISSUED/SIGNED_BY_APPLICANT/EXECUTED", constraints: "ISSUED | SIGNED_BY_APPLICANT | EXECUTED | SUPERSEDED | EXPIRED | CANCELLED" }

  - name: MoveIn
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; lease must be EXECUTED" }
      - { name: scheduled_date, type: datetime, source: input, description: "Move-in calendar date (ISO 8601 UTC; day bucket is UTC)" }
      - { name: utility_confirmed, type: boolean, source: computed, default: false, description: "Set true by confirm-utilities; gates completion when property.utility_transfer_required" }
      - { name: prorated_rent_cents, type: integer, source: computed, description: "First-period prorated rent per prorated_first_month_rent calculation using property.prorate_method" }
      - { name: status, type: enum, source: system, description: "SCHEDULED → READY (utilities confirmed) → COMPLETED; SCHEDULED → COMPLETED only when property.utility_transfer_required is false; CANCELLED from SCHEDULED/READY", constraints: "SCHEDULED | READY | COMPLETED | CANCELLED" }

# =============================================================================
# §1.2 State Machine Table (7 machines)
# =============================================================================
state_machines:
  - entity: PricingOffer
    initial_state: DRAFT
    terminal_states: [RETIRED, EXPIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /leasing/pricing-offers/{pricingOfferId}/publish"
        actor: PropertyManager
        preconditions:
          - "Offer must be DRAFT (ERR_PRICING_OFFER_INVALID_STATE)"
          - "No other offer for the same floorplan may be PUBLISHED (ERR_OFFER_ALREADY_PUBLISHED)"
          - "expires_at must be strictly after the current logical clock time (ERR_INVALID_TIME_RANGE)"
        side_effects: []
      - from: DRAFT
        to: RETIRED
        trigger: "POST /leasing/pricing-offers/{pricingOfferId}/retire"
        actor: PropertyManager
        preconditions:
          - "Offer must be DRAFT or PUBLISHED (ERR_PRICING_OFFER_INVALID_STATE)"
        side_effects: []
      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /leasing/pricing-offers/{pricingOfferId}/retire"
        actor: PropertyManager
        preconditions:
          - "Offer must be DRAFT or PUBLISHED (ERR_PRICING_OFFER_INVALID_STATE)"
        side_effects: []
      - from: PUBLISHED
        to: EXPIRED
        trigger: "system — logical clock advancement to >= expires_at; applied lazily on the next read of the offer or on any operation that references it"
        actor: system
        preconditions:
          - "current logical clock time >= offer.expires_at"
        side_effects:
          - "Floorplan pricing display falls back to floorplan.base_rent_cents for subsequent reads/calculations"

  - entity: Inquiry
    initial_state: NEW
    terminal_states: [CONVERTED, LOST]
    transitions:
      - from: NEW
        to: CONTACTED
        trigger: "POST /leasing/inquiries/{inquiryId}/respond"
        actor: LeasingAgent
        preconditions:
          - "Inquiry status must be NEW (ERR_ALREADY_RESPONDED if CONTACTED or beyond, ERR_INQUIRY_INVALID_STATE if terminal)"
          - "Inquiry must be assigned (ERR_INQUIRY_INVALID_STATE if unassigned)"
          - "Caller must be the assigned agent or a PropertyManager (ERR_NOT_ASSIGNED_AGENT)"
        side_effects:
          - "first_responded_at = current logical clock time"
          - "response_met_target computed per response_sla_evaluation"
      - from: CONTACTED
        to: TOUR_SCHEDULED
        trigger: "system — automatic when a Tour is created for this inquiry"
        actor: system
        preconditions: []
        side_effects: []
      - from: TOUR_SCHEDULED
        to: CONTACTED
        trigger: "system — automatic when a Tour of this inquiry is CANCELLED or marked NO_SHOW and no other SCHEDULED tour remains for the inquiry"
        actor: system
        preconditions:
          - "Inquiry status must still be TOUR_SCHEDULED (guard: no revert once CONVERTED or LOST)"
        side_effects: []
      - from: NEW
        to: LOST
        trigger: "POST /leasing/inquiries/{inquiryId}/mark-lost"
        actor: LeasingAgent
        preconditions:
          - "Inquiry status IN {NEW, CONTACTED, TOUR_SCHEDULED} (ERR_INQUIRY_INVALID_STATE)"
          - "Caller must be the assigned agent or a PropertyManager (ERR_NOT_ASSIGNED_AGENT)"
        side_effects:
          - "Cascade down: all SCHEDULED Tours of this inquiry → CANCELLED"
      - from: CONTACTED
        to: LOST
        trigger: "POST /leasing/inquiries/{inquiryId}/mark-lost"
        actor: LeasingAgent
        preconditions:
          - "Same as NEW → LOST"
        side_effects:
          - "Cascade down: all SCHEDULED Tours of this inquiry → CANCELLED"
      - from: TOUR_SCHEDULED
        to: LOST
        trigger: "POST /leasing/inquiries/{inquiryId}/mark-lost"
        actor: LeasingAgent
        preconditions:
          - "Same as NEW → LOST"
        side_effects:
          - "Cascade down: all SCHEDULED Tours of this inquiry → CANCELLED"
      - from: CONTACTED
        to: CONVERTED
        trigger: "system — automatic when a Lease for an Application with inquiry_id = this inquiry reaches EXECUTED"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade down: all remaining SCHEDULED Tours of this inquiry → CANCELLED (prospect has signed)"
      - from: TOUR_SCHEDULED
        to: CONVERTED
        trigger: "system — automatic when a Lease for an Application with inquiry_id = this inquiry reaches EXECUTED"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade down: all remaining SCHEDULED Tours of this inquiry → CANCELLED (prospect has signed)"
    notes:
      - "claim (POST /leasing/inquiries/{inquiryId}/claim) mutates assigned_agent_id only; status unchanged. Claim requires status IN {NEW, CONTACTED, TOUR_SCHEDULED} (ERR_INQUIRY_INVALID_STATE otherwise) and assigned_agent_id null (ERR_INQUIRY_INVALID_STATE if already assigned)."

  - entity: Tour
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /leasing/tours/{tourId}/reschedule"
        actor: LeasingAgent
        preconditions:
          - "Tour must be SCHEDULED (ERR_TOUR_INVALID_STATE)"
          - "New interval must pass the same availability rules as creation (ERR_TOUR_TIME_CONFLICT, ERR_SELF_GUIDED_NO_UNIT, ERR_INVALID_TIME_RANGE)"
        side_effects:
          - "scheduled_start / scheduled_end replaced; Inquiry remains TOUR_SCHEDULED"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /leasing/tours/{tourId}/complete with outcome = COMPLETED"
        actor: LeasingAgent
        preconditions:
          - "Tour must be SCHEDULED (ERR_TOUR_INVALID_STATE)"
        side_effects: []
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /leasing/tours/{tourId}/complete with outcome = NO_SHOW"
        actor: LeasingAgent
        preconditions:
          - "Tour must be SCHEDULED (ERR_TOUR_INVALID_STATE)"
        side_effects:
          - "Cross-entity: Inquiry TOUR_SCHEDULED → CONTACTED when no other SCHEDULED tour remains for the inquiry"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /leasing/tours/{tourId}/cancel OR system cascade from inquiry mark-lost / inquiry conversion"
        actor: LeasingAgent
        preconditions:
          - "Tour must be SCHEDULED (ERR_TOUR_INVALID_STATE; cascades skip non-SCHEDULED tours)"
        side_effects:
          - "Cross-entity: Inquiry TOUR_SCHEDULED → CONTACTED when no other SCHEDULED tour remains for the inquiry (guard: only when inquiry still TOUR_SCHEDULED)"

  - entity: WaitlistEntry
    initial_state: WAITING
    terminal_states: [CONVERTED, CANCELLED]
    transitions:
      - from: WAITING
        to: OFFERED
        trigger: "POST /leasing/waitlist-entries/{entryId}/promote OR system auto-promotion of the queue head when a unit frees (lease cancel/expiry)"
        actor: LeasingAgent
        preconditions:
          - "Entry must be WAITING (ERR_WAITLIST_INVALID_STATE)"
          - "Entry must be the queue head: minimum position among WAITING entries for the floorplan, tie-break created_at ASC (ERR_NOT_QUEUE_HEAD)"
          - "effective_available_units = floorplan.available_units - count(entries for floorplan in OFFERED) must be >= 1 (ERR_NO_UNITS_TO_OFFER)"
        side_effects:
          - "offer_expires_at = current logical clock time + OFFER_WINDOW_HOURS (72)"
      - from: OFFERED
        to: WAITING
        trigger: "POST /leasing/waitlist-entries/{entryId}/decline OR system — logical clock advancement to >= offer_expires_at (applied lazily on next access)"
        actor: LeasingAgent
        preconditions:
          - "Entry must be OFFERED (ERR_WAITLIST_INVALID_STATE)"
        side_effects:
          - "position = max(position of entries for floorplan in {WAITING, OFFERED}) + 1 (requeue to back)"
          - "offer_expires_at cleared to null"
      - from: OFFERED
        to: CONVERTED
        trigger: "system — automatic when an Application is created with waitlist_entry_id = this entry"
        actor: system
        preconditions:
          - "Entry must be OFFERED and not expired (ERR_WAITLIST_INVALID_STATE)"
        side_effects:
          - "linked_application_id = new Application.id"
      - from: WAITING
        to: CANCELLED
        trigger: "POST /leasing/waitlist-entries/{entryId}/cancel"
        actor: LeasingAgent
        preconditions:
          - "Entry must be WAITING or OFFERED (ERR_WAITLIST_INVALID_STATE)"
        side_effects: []
      - from: OFFERED
        to: CANCELLED
        trigger: "POST /leasing/waitlist-entries/{entryId}/cancel"
        actor: LeasingAgent
        preconditions:
          - "Entry must be WAITING or OFFERED (ERR_WAITLIST_INVALID_STATE)"
        side_effects:
          - "offer_expires_at cleared to null"

  - entity: Application
    initial_state: SCREENING
    terminal_states: [DENIED, WITHDRAWN, LEASED]
    transitions:
      - from: SCREENING
        to: APPROVED
        trigger: "POST /leasing/applications/{applicationId}/decide with decision = APPROVED"
        actor: PropertyManager
        preconditions:
          - "Application must be SCREENING (ERR_APPLICATION_INVALID_STATE)"
          - "recommendation must not be DENY (ERR_SCREENING_BLOCKS_APPROVAL)"
        side_effects:
          - "required_deposit_cents = 1 * monthly_rent_snapshot_cents"
      - from: SCREENING
        to: APPROVED_WITH_CONDITIONS
        trigger: "POST /leasing/applications/{applicationId}/decide with decision = APPROVED_WITH_CONDITIONS"
        actor: PropertyManager
        preconditions:
          - "Application must be SCREENING (ERR_APPLICATION_INVALID_STATE)"
          - "recommendation must not be DENY (ERR_SCREENING_BLOCKS_APPROVAL)"
        side_effects:
          - "required_deposit_cents = 2 * monthly_rent_snapshot_cents"
      - from: SCREENING
        to: DENIED
        trigger: "POST /leasing/applications/{applicationId}/decide with decision = DENIED"
        actor: PropertyManager
        preconditions:
          - "Application must be SCREENING (ERR_APPLICATION_INVALID_STATE)"
        side_effects: []
      - from: APPROVED_WITH_CONDITIONS
        to: SCREENING
        trigger: "POST /leasing/applications/{applicationId}/rescreen (re-screen loop with updated credit/income)"
        actor: PropertyManager
        preconditions:
          - "Application must be APPROVED_WITH_CONDITIONS (ERR_APPLICATION_INVALID_STATE)"
        side_effects:
          - "credit_score and annual_income_cents replaced by payload values"
          - "recommendation recomputed (monthly_rent_snapshot_cents unchanged)"
          - "required_deposit_cents reset to null; deposit_paid_cents reset to 0"
      - from: APPROVED_WITH_CONDITIONS
        to: CONDITIONS_CLEARED
        trigger: "POST /leasing/applications/{applicationId}/clear-conditions"
        actor: LeasingAgent
        preconditions:
          - "Application must be APPROVED_WITH_CONDITIONS (ERR_APPLICATION_INVALID_STATE)"
          - "deposit_paid_cents >= required_deposit_cents after applying the payment (ERR_DEPOSIT_INSUFFICIENT)"
        side_effects:
          - "deposit_paid_cents += payload.deposit_paid_cents"
      - from: SCREENING
        to: WITHDRAWN
        trigger: "POST /leasing/applications/{applicationId}/withdraw"
        actor: LeasingAgent
        preconditions:
          - "Application must be SCREENING or APPROVED_WITH_CONDITIONS (ERR_APPLICATION_INVALID_STATE)"
        side_effects: []
      - from: APPROVED_WITH_CONDITIONS
        to: WITHDRAWN
        trigger: "POST /leasing/applications/{applicationId}/withdraw"
        actor: LeasingAgent
        preconditions:
          - "Application must be SCREENING or APPROVED_WITH_CONDITIONS (ERR_APPLICATION_INVALID_STATE)"
        side_effects: []
      - from: APPROVED
        to: LEASED
        trigger: "system — automatic when a Lease for this application reaches EXECUTED"
        actor: system
        preconditions: []
        side_effects:
          - "Cross-entity: source Inquiry (application.inquiry_id) → CONVERTED, which itself cancels its remaining SCHEDULED tours"
      - from: CONDITIONS_CLEARED
        to: LEASED
        trigger: "system — automatic when a Lease for this application reaches EXECUTED"
        actor: system
        preconditions: []
        side_effects:
          - "Cross-entity: source Inquiry (application.inquiry_id) → CONVERTED, which itself cancels its remaining SCHEDULED tours"
      - from: LEASED
        to: APPROVED
        trigger: "system — compensation when the executed Lease is CANCELLED before any COMPLETED move-in"
        actor: system
        preconditions:
          - "Application must be LEASED (compensation only)"
        side_effects:
          - "required_deposit_cents retained; application becomes leasable again"

  - entity: Lease
    initial_state: ISSUED
    terminal_states: [EXECUTED, SUPERSEDED, EXPIRED, CANCELLED]
    transitions:
      - from: ISSUED
        to: SIGNED_BY_APPLICANT
        trigger: "POST /leasing/leases/{leaseId}/sign"
        actor: Applicant
        preconditions:
          - "Lease must be ISSUED (ERR_LEASE_INVALID_STATE)"
          - "Current logical clock time < signing_deadline; at or past it the lease is EXPIRED (ERR_LEASE_INVALID_STATE)"
          - "X-User-ID must equal lease.application_id (ERR_APPLICANT_MISMATCH)"
        side_effects:
          - "signed_at = current logical clock time"
      - from: SIGNED_BY_APPLICANT
        to: EXECUTED
        trigger: "POST /leasing/leases/{leaseId}/countersign"
        actor: PropertyManager
        preconditions:
          - "Lease must be SIGNED_BY_APPLICANT (ERR_LEASE_INVALID_STATE)"
        side_effects:
          - "executed_at = current logical clock time"
          - "Link 1: Application APPROVED/CONDITIONS_CLEARED → LEASED"
          - "Link 2 (caused by link 1): source Inquiry → CONVERTED"
          - "Link 3 (caused by link 2): all remaining SCHEDULED Tours of that inquiry → CANCELLED"
          - "Ledger sync: Floorplan.committed_units recomputed (this lease already counted since ISSUED)"
      - from: ISSUED
        to: SUPERSEDED
        trigger: "system — automatic when a new Lease is generated for the same application"
        actor: system
        preconditions:
          - "This lease must be ISSUED (regeneration is blocked entirely when any lease for the application is SIGNED_BY_APPLICANT or EXECUTED: ERR_LEASE_ALREADY_COMMITTED)"
        side_effects:
          - "superseded_by_id = new Lease.id"
          - "Ledger sync: this lease leaves the committed set as the new ISSUED lease enters it (net committed_units change 0)"
      - from: ISSUED
        to: EXPIRED
        trigger: "system — logical clock advancement to >= signing_deadline; applied lazily on the next read of the lease or on any operation that references it"
        actor: system
        preconditions:
          - "current logical clock time >= lease.signing_deadline"
        side_effects:
          - "Ledger sync: lease leaves the committed set; Floorplan.committed_units recomputed; freed unit may trigger waitlist auto-promotion of the queue head"
      - from: ISSUED
        to: CANCELLED
        trigger: "POST /leasing/leases/{leaseId}/cancel"
        actor: PropertyManager
        preconditions:
          - "Lease must be ISSUED, SIGNED_BY_APPLICANT, or EXECUTED (ERR_LEASE_INVALID_STATE)"
        side_effects:
          - "Ledger sync: Floorplan.committed_units recomputed (lease leaves the committed set; available_units +1)"
          - "Availability-driven promotion (caused by the availability increment): system auto-promotes the waitlist queue head WAITING → OFFERED when effective_available_units >= 1"
          - "Cascade down: all SCHEDULED/READY MoveIns of this lease → CANCELLED"
      - from: SIGNED_BY_APPLICANT
        to: CANCELLED
        trigger: "POST /leasing/leases/{leaseId}/cancel"
        actor: PropertyManager
        preconditions:
          - "Lease must be ISSUED, SIGNED_BY_APPLICANT, or EXECUTED (ERR_LEASE_INVALID_STATE)"
        side_effects:
          - "Same as ISSUED → CANCELLED"
      - from: EXECUTED
        to: CANCELLED
        trigger: "POST /leasing/leases/{leaseId}/cancel"
        actor: PropertyManager
        preconditions:
          - "Lease must be ISSUED, SIGNED_BY_APPLICANT, or EXECUTED (ERR_LEASE_INVALID_STATE)"
        side_effects:
          - "Compensation: Application LEASED → APPROVED"
          - "Ledger sync: Floorplan.committed_units recomputed (available_units +1)"
          - "Availability-driven promotion (caused by the availability increment): system auto-promotes the waitlist queue head WAITING → OFFERED when effective_available_units >= 1"
          - "Cascade down: all SCHEDULED/READY MoveIns of this lease → CANCELLED"

  - entity: MoveIn
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: READY
        trigger: "POST /leasing/move-ins/{moveInId}/confirm-utilities"
        actor: LeasingAgent
        preconditions:
          - "MoveIn must be SCHEDULED (ERR_MOVEIN_INVALID_STATE)"
        side_effects:
          - "utility_confirmed = true"
      - from: READY
        to: COMPLETED
        trigger: "POST /leasing/move-ins/{moveInId}/complete"
        actor: LeasingAgent
        preconditions:
          - "MoveIn must be READY or (SCHEDULED when property.utility_transfer_required is false) (ERR_MOVEIN_INVALID_STATE)"
        side_effects: []
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /leasing/move-ins/{moveInId}/complete"
        actor: LeasingAgent
        preconditions:
          - "Allowed directly from SCHEDULED only when property.utility_transfer_required is false (ERR_UTILITY_CONFIRMATION_REQUIRED when true)"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /leasing/move-ins/{moveInId}/cancel OR system cascade from lease cancellation"
        actor: LeasingAgent
        preconditions:
          - "MoveIn must be SCHEDULED or READY (ERR_MOVEIN_INVALID_STATE)"
        side_effects: []
      - from: READY
        to: CANCELLED
        trigger: "POST /leasing/move-ins/{moveInId}/cancel OR system cascade from lease cancellation"
        actor: LeasingAgent
        preconditions:
          - "MoveIn must be SCHEDULED or READY (ERR_MOVEIN_INVALID_STATE)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: lease-create-stale-application
    parent_entity: Application
    write_endpoint: "POST /leasing/leases"
    occ_field: expected_application_version
    description: |
      Generating a Lease against an Application whose version has advanced
      since the client last observed it is rejected. Lease generation
      legitimately supersedes any prior ISSUED lease for the same
      application, so a writer holding a stale Application version would
      supersede a lease it never observed. The check is a stale-version
      comparison on Application.version, evaluated for strictly sequential
      requests.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table (7 rules)
# =============================================================================
calculations:
  - name: effective_monthly_rent
    trigger: "PricingOffer creation (stored as effective_monthly_rent_cents); read whenever pricing is displayed"
    algorithm: tiered_pricing
    formula: |
      match concession_type:
        NONE:         effective = base_rent_cents
        FLAT_AMOUNT:  effective = max(0, base_rent_cents - concession_value)
        PERCENT_OFF:  effective = round_half_up(base_rent_cents * (100 - concession_value) / 100)   # concession_value in [0,100]
        FREE_MONTHS:  billed_months = max(0, lease_term_months - min(concession_value, lease_term_months))
                      effective = round_half_up(base_rent_cents * billed_months / lease_term_months)
    input_set: "The PricingOffer's own fields; lease_term_months must be >= 1"
    constants:
      MIN_RENT_CENTS: 0
    precision: "0 decimal places (integer cents), round_half_up"
    variants: []

  - name: prorated_first_month_rent
    trigger: "MoveIn creation (stored as MoveIn.prorated_rent_cents)"
    algorithm: aggregation
    formula: |
      # Rounding order is PINNED: round the daily rate FIRST, then multiply by days.
      # (The alternative — multiply then round — produces different cents and is NOT used.)
      if property.prorate_method == CALENDAR:
        divisor = number of days in scheduled_date's calendar month (28-31)
        days_occupied = divisor - day_of_month(scheduled_date) + 1
      else:  # FIXED_30
        divisor = 30
        days_occupied = 30 - min(day_of_month(scheduled_date), 30) + 1
      daily_rate_cents = round_half_up(monthly_rent_cents / divisor)
      prorated_rent_cents = daily_rate_cents * days_occupied
      # monthly_rent_cents is the EXECUTED lease's pinned rent.
    input_set: "Lease.monthly_rent_cents of the EXECUTED lease; MoveIn.scheduled_date; Property.prorate_method"
    constants:
      FIXED_30_DIVISOR: 30
    precision: "0 decimal places (integer cents), round_half_up; daily rate rounded before multiplication"
    variants:
      - name: CALENDAR
        when: "property.prorate_method == CALENDAR"
        difference: "divisor is the actual day count of the move-in month (28-31); days_occupied counts through month end inclusive of move-in day"
      - name: FIXED_30
        when: "property.prorate_method == FIXED_30"
        difference: "divisor is always 30; day 31 is clamped to day 30 (days_occupied = 1)"

  - name: screening_recommendation
    trigger: "Application creation and rescreen (stored as recommendation)"
    algorithm: threshold
    formula: |
      income_ok = annual_income_cents >= INCOME_MULTIPLIER * 12 * monthly_rent_snapshot_cents
      if income_ok and credit_score >= CREDIT_AUTO_APPROVE:    recommendation = APPROVE
      elif income_ok and credit_score >= CREDIT_CONDITION_MIN: recommendation = CONDITION
      else:                                                     recommendation = DENY
      # Boundaries are INCLUSIVE: income exactly at 3x qualifies; credit exactly 700 → APPROVE-eligible; exactly 620 → CONDITION.
    input_set: "Application.annual_income_cents, Application.credit_score, Application.monthly_rent_snapshot_cents (snapshot pinned at creation; rescreen does not re-resolve the offer)"
    constants:
      INCOME_MULTIPLIER: 3
      CREDIT_AUTO_APPROVE: 700
      CREDIT_CONDITION_MIN: 620
    precision: "integer cents comparison; no rounding"
    variants: []

  - name: required_deposit
    trigger: "Application decide (APPROVED / APPROVED_WITH_CONDITIONS); reset to null on rescreen"
    algorithm: threshold
    formula: |
      if decision == APPROVED:                  required_deposit_cents = 1 * monthly_rent_snapshot_cents
      elif decision == APPROVED_WITH_CONDITIONS: required_deposit_cents = 2 * monthly_rent_snapshot_cents
    input_set: "Application.monthly_rent_snapshot_cents; decision"
    constants:
      STANDARD_DEPOSIT_MONTHS: 1
      CONDITIONAL_DEPOSIT_MONTHS: 2
    precision: "integer cents; no rounding"
    variants: []

  - name: response_sla_evaluation
    trigger: "Inquiry respond transition (stored as response_met_target)"
    algorithm: threshold
    formula: |
      elapsed_minutes = (first_responded_at - inquiry.created_at) in whole minutes
      response_met_target = elapsed_minutes <= property.response_time_target_minutes
      # INCLUSIVE boundary: responding at exactly the target counts as met.
    input_set: "Inquiry.created_at, Inquiry.first_responded_at, Property.response_time_target_minutes"
    constants: {}
    precision: "whole minutes, truncated"
    variants: []

  - name: agent_closing_ratio
    trigger: "GET /leasing/reports/closing (computed on read, never stored)"
    algorithm: aggregation
    formula: |
      window: inquiries with created_at in [window_start, window_end)  — half-open, start inclusive
      group by (assigned_agent_id, source) over inquiries of the property with assigned_agent_id NOT NULL
      closed(group) = count of inquiries in group whose status == CONVERTED
      basis ALL:       denominator = count of all assigned inquiries in group within window
      basis QUALIFIED: denominator = count of group inquiries with first_responded_at NOT NULL
      closing_ratio_pct = round_half_up(100.0 * closed / denominator, 1)
      rows with denominator == 0 are omitted from the response
    input_set: "Inquiries of the property created within [window_start, window_end); only assigned inquiries enter any group; CONVERTED status is the closing signal"
    constants: {}
    precision: "1 decimal place percent, round_half_up"
    variants:
      - name: ALL
        when: "basis parameter is ALL (default)"
        difference: "denominator includes every assigned inquiry, even never-contacted ones"
      - name: QUALIFIED
        when: "basis parameter is QUALIFIED"
        difference: "denominator includes only inquiries with a recorded first response; produces a strictly larger ratio whenever uncontacted inquiries exist"

  - name: waitlist_position_assignment
    trigger: "WaitlistEntry creation and requeue (decline/expiry)"
    algorithm: aggregation
    formula: |
      position = max(position of OTHER entries for the floorplan with status IN {WAITING, OFFERED}) + 1
      (the entry being created or requeued is excluded from the max)
      when no such other entries exist: position = 1
      # Positions are never reused; CONVERTED/CANCELLED entries keep their historical position.
      # Queue-head selector: eligibility = status == WAITING for the floorplan;
      # ranking = position ASC; tie-break = created_at ASC; empty set → no head (promotion no-op / ERR_NOT_QUEUE_HEAD for a targeted non-head).
    input_set: "WaitlistEntry rows for the floorplan with status IN {WAITING, OFFERED}"
    constants: {}
    precision: "integer"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role must be a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role permitted for the endpoint; ownership where declared: respond/mark-lost require the assigned agent or a PropertyManager; lease sign requires X-User-ID == lease.application_id"
    error_id: "ERR_UNAUTHORIZED_ROLE | ERR_NOT_ASSIGNED_AGENT | ERR_APPLICANT_MISMATCH"
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path ids exist (left-to-right); body FK references exist; request shape valid: required fields present, enum members valid, and for applications exactly one of inquiry_id / waitlist_entry_id supplied"
    error_id: "ERR_<RESOURCE>_NOT_FOUND | ERR_INVALID_REQUEST | ERR_APPLICATION_SOURCE_AMBIGUOUS"
    http_status: 404
    applies_to: "all endpoints with path ids or body references (ERR_APPLICATION_SOURCE_AMBIGUOUS is 400, POST /leasing/applications only)"

  - priority: 4
    category: state
    check: "Target entity in a valid state for the operation: per-entity ERR_*_INVALID_STATE family; ERR_INQUIRY_NOT_ACTIVE for tour creation against LOST/CONVERTED inquiries and for application creation against inquiries not in {CONTACTED, TOUR_SCHEDULED}; ERR_APPLICATION_NOT_LEASABLE for lease generation; ERR_LEASE_NOT_EXECUTED for move-in creation; ERR_ALREADY_RESPONDED for repeat respond; OCC stale expected_application_version → ERR_STALE_VERSION (412)"
    error_id: "ERR_INQUIRY_INVALID_STATE | ERR_TOUR_INVALID_STATE | ERR_WAITLIST_INVALID_STATE | ERR_APPLICATION_INVALID_STATE | ERR_LEASE_INVALID_STATE | ERR_MOVEIN_INVALID_STATE | ERR_PRICING_OFFER_INVALID_STATE | ERR_INQUIRY_NOT_ACTIVE | ERR_APPLICATION_NOT_LEASABLE | ERR_LEASE_NOT_EXECUTED | ERR_ALREADY_RESPONDED | ERR_STALE_VERSION"
    http_status: 409
    applies_to: "state-transition and state-dependent endpoints"

  - priority: 5
    category: business_safety
    check: "Screening gate: decide APPROVED or APPROVED_WITH_CONDITIONS is forbidden when recommendation == DENY (fair-housing style consistency — no approvals against a DENY screening)"
    error_id: ERR_SCREENING_BLOCKS_APPROVAL
    http_status: 422
    applies_to: "POST /leasing/applications/{applicationId}/decide"

  - priority: 6
    category: business_constraint
    check: "Uniqueness/availability constraints: at most one PUBLISHED offer per floorplan; at most one active (SCHEDULED/READY) MoveIn per lease; waitlist join only when floorplan.available_units == 0; SELF_GUIDED tour requires available_units >= 1; promotion requires queue head then effective_available_units >= 1; lease regeneration blocked when a SIGNED_BY_APPLICANT or EXECUTED lease exists for the application"
    error_id: "ERR_OFFER_ALREADY_PUBLISHED | ERR_MOVEIN_ALREADY_ACTIVE | ERR_FLOORPLAN_AVAILABLE | ERR_SELF_GUIDED_NO_UNIT | ERR_NOT_QUEUE_HEAD | ERR_NO_UNITS_TO_OFFER | ERR_LEASE_ALREADY_COMMITTED"
    http_status: 409
    applies_to: "publish, move-in create, waitlist create/promote, tour create/reschedule, lease create"

  - priority: 7
    category: business_temporal
    check: "Interval/capacity rules: GUIDED tour conflicts on the agent's buffered intervals beyond max_concurrent_tours; move-in day bucket beyond max_moveins_per_day; end strictly after start for tours and offer windows"
    error_id: "ERR_TOUR_TIME_CONFLICT | ERR_MOVEIN_DAY_FULL | ERR_INVALID_TIME_RANGE"
    http_status: 409
    applies_to: "tour create/reschedule, move-in create, pricing-offer create (ERR_INVALID_TIME_RANGE is 400)"

  - priority: 8
    category: business_referential
    check: "Cross-reference integrity: application.floorplan_id must equal the source inquiry's / waitlist entry's floorplan_id; lease pricing_offer_id must belong to the application's floorplan"
    error_id: "ERR_APPLICATION_FLOORPLAN_MISMATCH | ERR_OFFER_FLOORPLAN_MISMATCH"
    http_status: 422
    applies_to: "POST /leasing/applications, POST /leasing/leases"

  - priority: 9
    category: business_fiscal
    check: "Money checks last: clear-conditions payment must reach required_deposit_cents; rent_override_cents must be >= round_half_up(OVERRIDE_FLOOR_PCT * computed monthly rent)"
    error_id: "ERR_DEPOSIT_INSUFFICIENT | ERR_RENT_OVERRIDE_TOO_LOW"
    http_status: 402
    applies_to: "POST /leasing/applications/{applicationId}/clear-conditions (402), POST /leasing/leases (422)"

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table (52 endpoints)
# =============================================================================
endpoints:
  # --- Property (3) ---
  - method: POST
    path: "/leasing/properties"
    description: "Create a property with its leasing configuration"
    roles: [PropertyManager]
    code: 201
    input: [name, code, "response_time_target_minutes?", "tour_buffer_minutes?", "self_guided_window_minutes?", "max_moveins_per_day?", "utility_transfer_required?", "prorate_method?", "required_addenda?"]
    output: Property
    side_effects: ["defaults applied per entity table"]

  - method: GET
    path: "/leasing/properties"
    description: "List properties (paginated)"
    roles: [PropertyManager, LeasingAgent, Applicant]
    code: 200
    input: ["limit?", "offset?"]
    output: "Property[]"
    side_effects: []

  - method: GET
    path: "/leasing/properties/{propertyId}"
    description: "Get a property"
    roles: [PropertyManager, LeasingAgent, Applicant]
    code: 200
    input: []
    output: Property
    side_effects: []

  # --- Agent (3) ---
  - method: POST
    path: "/leasing/agents"
    description: "Create a leasing agent"
    roles: [PropertyManager]
    code: 201
    input: [full_name, email, property_id, "max_concurrent_tours?", "active?"]
    output: Agent
    side_effects: []

  - method: GET
    path: "/leasing/agents"
    description: "List agents; filterable by property_id"
    roles: [PropertyManager, LeasingAgent]
    code: 200
    input: ["property_id?", "limit?", "offset?"]
    output: "Agent[]"
    side_effects: []

  - method: GET
    path: "/leasing/agents/{agentId}"
    description: "Get an agent"
    roles: [PropertyManager, LeasingAgent]
    code: 200
    input: []
    output: Agent
    side_effects: []

  # --- Floorplan (3) ---
  - method: POST
    path: "/leasing/floorplans"
    description: "Create a floorplan for a property"
    roles: [PropertyManager]
    code: 201
    input: [property_id, name, bedrooms, base_rent_cents, total_units]
    output: Floorplan
    side_effects: ["committed_units = 0; available_units = total_units"]

  - method: GET
    path: "/leasing/floorplans"
    description: "List floorplans; filterable by property_id"
    roles: [PropertyManager, LeasingAgent, Applicant]
    code: 200
    input: ["property_id?", "limit?", "offset?"]
    output: "Floorplan[]"
    side_effects: []

  - method: GET
    path: "/leasing/floorplans/{floorplanId}"
    description: "Get a floorplan including computed committed_units / available_units"
    roles: [PropertyManager, LeasingAgent, Applicant]
    code: 200
    input: []
    output: Floorplan
    side_effects: []

  # --- PricingOffer (5) ---
  - method: POST
    path: "/leasing/pricing-offers"
    description: "Create a pricing/concession offer (DRAFT)"
    roles: [PropertyManager]
    code: 201
    input: [property_id, floorplan_id, base_rent_cents, "concession_type?", "concession_value?", "lease_term_months?", effective_start, expires_at]
    output: PricingOffer
    side_effects: ["effective_monthly_rent_cents computed per effective_monthly_rent"]

  - method: GET
    path: "/leasing/pricing-offers"
    description: "List pricing offers; filterable by property_id, floorplan_id, status"
    roles: [PropertyManager, LeasingAgent, Applicant]
    code: 200
    input: ["property_id?", "floorplan_id?", "status?", "limit?", "offset?"]
    output: "PricingOffer[]"
    side_effects: ["lazy EXPIRED sweep on read"]

  - method: GET
    path: "/leasing/pricing-offers/{pricingOfferId}"
    description: "Get a pricing offer"
    roles: [PropertyManager, LeasingAgent, Applicant]
    code: 200
    input: []
    output: PricingOffer
    side_effects: ["lazy EXPIRED sweep on read"]

  - method: POST
    path: "/leasing/pricing-offers/{pricingOfferId}/publish"
    description: "Publish a DRAFT offer; at most one PUBLISHED offer per floorplan"
    roles: [PropertyManager]
    code: 200
    input: []
    output: PricingOffer
    side_effects: ["status → PUBLISHED"]

  - method: POST
    path: "/leasing/pricing-offers/{pricingOfferId}/retire"
    description: "Retire a DRAFT or PUBLISHED offer"
    roles: [PropertyManager]
    code: 200
    input: []
    output: PricingOffer
    side_effects: ["status → RETIRED"]

  # --- Inquiry (6) ---
  - method: POST
    path: "/leasing/inquiries"
    description: "Create an inquiry (guest card) with source tracking"
    roles: [PropertyManager, LeasingAgent]
    code: 201
    input: [property_id, "floorplan_id?", contact_name, contact_email, source]
    output: Inquiry
    side_effects: ["status NEW; assigned_agent_id null"]

  - method: GET
    path: "/leasing/inquiries"
    description: "List inquiries; filterable by property_id, floorplan_id, assigned_agent_id, status, source"
    roles: [PropertyManager, LeasingAgent]
    code: 200
    input: ["property_id?", "floorplan_id?", "assigned_agent_id?", "status?", "source?", "limit?", "offset?"]
    output: "Inquiry[]"
    side_effects: []

  - method: GET
    path: "/leasing/inquiries/{inquiryId}"
    description: "Get an inquiry"
    roles: [PropertyManager, LeasingAgent]
    code: 200
    input: []
    output: Inquiry
    side_effects: []

  - method: POST
    path: "/leasing/inquiries/{inquiryId}/claim"
    description: "Assign the inquiry to the calling agent (unassigned, non-terminal only)"
    roles: [LeasingAgent, PropertyManager]
    code: 200
    input: []
    output: Inquiry
    side_effects: ["assigned_agent_id = caller agent id (for PropertyManager callers, their agent id)"]

  - method: POST
    path: "/leasing/inquiries/{inquiryId}/respond"
    description: "Record first response; NEW → CONTACTED; computes response_met_target"
    roles: [LeasingAgent, PropertyManager]
    code: 200
    input: []
    output: Inquiry
    side_effects: ["first_responded_at set; response_met_target computed; status → CONTACTED"]

  - method: POST
    path: "/leasing/inquiries/{inquiryId}/mark-lost"
    description: "Mark inquiry LOST; cascades cancel of its SCHEDULED tours"
    roles: [LeasingAgent, PropertyManager]
    code: 200
    input: []
    output: Inquiry
    side_effects: ["status → LOST; SCHEDULED tours of this inquiry → CANCELLED"]

  # --- Tour (6) ---
  - method: POST
    path: "/leasing/tours"
    description: "Schedule a guided or self-guided tour with availability sync"
    roles: [LeasingAgent, PropertyManager]
    code: 201
    input: [inquiry_id, tour_type, "agent_id?", scheduled_start, "scheduled_end?"]
    output: Tour
    side_effects: ["Inquiry CONTACTED → TOUR_SCHEDULED; SELF_GUIDED scheduled_end computed from property.self_guided_window_minutes"]

  - method: GET
    path: "/leasing/tours"
    description: "List tours; filterable by inquiry_id, agent_id, status"
    roles: [PropertyManager, LeasingAgent]
    code: 200
    input: ["inquiry_id?", "agent_id?", "status?", "limit?", "offset?"]
    output: "Tour[]"
    side_effects: []

  - method: GET
    path: "/leasing/tours/{tourId}"
    description: "Get a tour"
    roles: [PropertyManager, LeasingAgent]
    code: 200
    input: []
    output: Tour
    side_effects: []

  - method: POST
    path: "/leasing/tours/{tourId}/reschedule"
    description: "Reschedule a SCHEDULED tour (self-loop); full availability revalidation"
    roles: [LeasingAgent, PropertyManager]
    code: 200
    input: [scheduled_start, "scheduled_end?"]
    output: Tour
    side_effects: ["scheduled_start/scheduled_end replaced"]

  - method: POST
    path: "/leasing/tours/{tourId}/complete"
    description: "Record tour outcome: COMPLETED or NO_SHOW"
    roles: [LeasingAgent, PropertyManager]
    code: 200
    input: [outcome]
    output: Tour
    side_effects: ["NO_SHOW → inquiry reverts TOUR_SCHEDULED → CONTACTED when no other SCHEDULED tour remains"]

  - method: POST
    path: "/leasing/tours/{tourId}/cancel"
    description: "Cancel a SCHEDULED tour"
    roles: [LeasingAgent, PropertyManager]
    code: 200
    input: []
    output: Tour
    side_effects: ["inquiry reverts TOUR_SCHEDULED → CONTACTED when no other SCHEDULED tour remains"]

  # --- WaitlistEntry (6) ---
  - method: POST
    path: "/leasing/waitlist-entries"
    description: "Join the waitlist for a floorplan; only when available_units == 0"
    roles: [LeasingAgent, PropertyManager]
    code: 201
    input: [floorplan_id, contact_name, contact_email]
    output: WaitlistEntry
    side_effects: ["position assigned per waitlist_position_assignment"]

  - method: GET
    path: "/leasing/waitlist-entries"
    description: "List waitlist entries; filterable by floorplan_id, status, linked_application_id"
    roles: [PropertyManager, LeasingAgent]
    code: 200
    input: ["floorplan_id?", "status?", "linked_application_id?", "limit?", "offset?"]
    output: "WaitlistEntry[]"
    side_effects: ["lazy offer-expiry sweep on read"]

  - method: GET
    path: "/leasing/waitlist-entries/{entryId}"
    description: "Get a waitlist entry"
    roles: [PropertyManager, LeasingAgent]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: ["lazy offer-expiry sweep on read"]

  - method: POST
    path: "/leasing/waitlist-entries/{entryId}/promote"
    description: "Offer a unit to the queue head (WAITING → OFFERED)"
    roles: [LeasingAgent, PropertyManager]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: ["offer_expires_at = now + 72h"]

  - method: POST
    path: "/leasing/waitlist-entries/{entryId}/decline"
    description: "Record offer decline; entry requeues to the back (OFFERED → WAITING)"
    roles: [LeasingAgent, PropertyManager]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: ["position = max(non-terminal positions) + 1; offer_expires_at cleared"]

  - method: POST
    path: "/leasing/waitlist-entries/{entryId}/cancel"
    description: "Remove entry from the waitlist (terminal CANCELLED)"
    roles: [LeasingAgent, PropertyManager]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: []

  # --- Application (7) ---
  - method: POST
    path: "/leasing/applications"
    description: "Create an application from an inquiry or an offered waitlist entry; computes rent snapshot and screening recommendation"
    roles: [LeasingAgent, PropertyManager]
    code: 201
    input: ["inquiry_id?", "waitlist_entry_id?", floorplan_id, applicant_name, applicant_email, annual_income_cents, credit_score]
    output: Application
    side_effects:
      - "precondition: inquiry-sourced applications require the inquiry in CONTACTED or TOUR_SCHEDULED (ERR_INQUIRY_NOT_ACTIVE); waitlist-sourced require the entry OFFERED and unexpired (ERR_WAITLIST_INVALID_STATE)"
      - "monthly_rent_snapshot_cents pinned from the floorplan's PUBLISHED offer else base rent"
      - "recommendation computed per screening_recommendation"
      - "waitlist-sourced: entry OFFERED → CONVERTED with linked_application_id set"
      - "increments nothing on inquiry (inquiry converts only at lease execution)"

  - method: GET
    path: "/leasing/applications"
    description: "List applications; filterable by floorplan_id, inquiry_id, waitlist_entry_id, status"
    roles: [PropertyManager, LeasingAgent]
    code: 200
    input: ["floorplan_id?", "inquiry_id?", "waitlist_entry_id?", "status?", "limit?", "offset?"]
    output: "Application[]"
    side_effects: []

  - method: GET
    path: "/leasing/applications/{applicationId}"
    description: "Get an application"
    roles: [PropertyManager, LeasingAgent, Applicant]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: POST
    path: "/leasing/applications/{applicationId}/decide"
    description: "PropertyManager decision: APPROVED | APPROVED_WITH_CONDITIONS | DENIED"
    roles: [PropertyManager]
    code: 200
    input: [decision]
    output: Application
    side_effects: ["required_deposit_cents set per required_deposit; status transition"]

  - method: POST
    path: "/leasing/applications/{applicationId}/rescreen"
    description: "Re-screen an APPROVED_WITH_CONDITIONS application with updated financials (cycle back to SCREENING)"
    roles: [PropertyManager]
    code: 200
    input: [annual_income_cents, credit_score]
    output: Application
    side_effects: ["recommendation recomputed; required_deposit_cents → null; deposit_paid_cents → 0"]

  - method: POST
    path: "/leasing/applications/{applicationId}/clear-conditions"
    description: "Record condition clearance payment; APPROVED_WITH_CONDITIONS → CONDITIONS_CLEARED when deposit covered"
    roles: [LeasingAgent, PropertyManager]
    code: 200
    input: [deposit_paid_cents]
    output: Application
    side_effects: ["deposit_paid_cents += payment"]

  - method: POST
    path: "/leasing/applications/{applicationId}/withdraw"
    description: "Withdraw a SCREENING or APPROVED_WITH_CONDITIONS application"
    roles: [LeasingAgent, PropertyManager]
    code: 200
    input: []
    output: Application
    side_effects: ["status → WITHDRAWN"]

  # --- Lease (6) ---
  - method: POST
    path: "/leasing/leases"
    description: "Generate a lease for an APPROVED / CONDITIONS_CLEARED application (OCC on application version); supersedes any prior ISSUED lease; snapshots property addenda"
    roles: [PropertyManager]
    code: 201
    input: [application_id, expected_application_version, "pricing_offer_id?", "rent_override_cents?"]
    output: Lease
    side_effects:
      - "prior ISSUED lease for the application → SUPERSEDED (superseded_by_id set)"
      - "monthly_rent_cents pinned (selected PUBLISHED offer effective rent, else floorplan base; override honored when >= 80% floor)"
      - "deposit_cents and addenda_codes snapshotted; signing_deadline = created_at + 48h"
      - "increments Application.version by 1"

  - method: GET
    path: "/leasing/leases"
    description: "List leases; filterable by application_id, floorplan_id, status"
    roles: [PropertyManager, LeasingAgent]
    code: 200
    input: ["application_id?", "floorplan_id?", "status?", "limit?", "offset?"]
    output: "Lease[]"
    side_effects: ["lazy EXPIRED sweep on read"]

  - method: GET
    path: "/leasing/leases/{leaseId}"
    description: "Get a lease"
    roles: [PropertyManager, LeasingAgent, Applicant]
    code: 200
    input: []
    output: Lease
    side_effects: ["lazy EXPIRED sweep on read"]

  - method: POST
    path: "/leasing/leases/{leaseId}/sign"
    description: "Applicant e-signature; caller identity must equal lease.application_id"
    roles: [Applicant]
    code: 200
    input: []
    output: Lease
    side_effects: ["status → SIGNED_BY_APPLICANT; signed_at set"]

  - method: POST
    path: "/leasing/leases/{leaseId}/countersign"
    description: "PropertyManager countersignature → EXECUTED; fires the conversion cascade"
    roles: [PropertyManager]
    code: 200
    input: []
    output: Lease
    side_effects: ["status → EXECUTED; Application → LEASED; source Inquiry → CONVERTED; its SCHEDULED tours → CANCELLED"]

  - method: POST
    path: "/leasing/leases/{leaseId}/cancel"
    description: "Cancel a non-terminal lease; frees the unit, compensates LEASED application, may auto-promote waitlist head"
    roles: [PropertyManager]
    code: 200
    input: []
    output: Lease
    side_effects: ["status → CANCELLED; committed_units recomputed; queue head auto-promoted when effective availability >= 1; LEASED application → APPROVED; SCHEDULED/READY move-ins → CANCELLED"]

  # --- MoveIn (6) ---
  - method: POST
    path: "/leasing/move-ins"
    description: "Schedule a move-in for an EXECUTED lease; day-bucket capacity per property"
    roles: [LeasingAgent, PropertyManager]
    code: 201
    input: [lease_id, scheduled_date]
    output: MoveIn
    side_effects: ["prorated_rent_cents computed per prorated_first_month_rent"]

  - method: GET
    path: "/leasing/move-ins"
    description: "List move-ins; filterable by lease_id, status"
    roles: [PropertyManager, LeasingAgent]
    code: 200
    input: ["lease_id?", "status?", "limit?", "offset?"]
    output: "MoveIn[]"
    side_effects: []

  - method: GET
    path: "/leasing/move-ins/{moveInId}"
    description: "Get a move-in"
    roles: [PropertyManager, LeasingAgent]
    code: 200
    input: []
    output: MoveIn
    side_effects: []

  - method: POST
    path: "/leasing/move-ins/{moveInId}/confirm-utilities"
    description: "Confirm utility transfer; SCHEDULED → READY"
    roles: [LeasingAgent, PropertyManager]
    code: 200
    input: []
    output: MoveIn
    side_effects: ["utility_confirmed = true"]

  - method: POST
    path: "/leasing/move-ins/{moveInId}/complete"
    description: "Complete the move-in; requires READY when the property mandates utility transfer"
    roles: [LeasingAgent, PropertyManager]
    code: 200
    input: []
    output: MoveIn
    side_effects: ["status → COMPLETED"]

  - method: POST
    path: "/leasing/move-ins/{moveInId}/cancel"
    description: "Cancel a SCHEDULED/READY move-in"
    roles: [LeasingAgent, PropertyManager]
    code: 200
    input: []
    output: MoveIn
    side_effects: ["status → CANCELLED"]

  # --- Reports (1) ---
  - method: GET
    path: "/leasing/reports/closing"
    description: "Closing ratio by agent and source; basis ALL (default) or QUALIFIED per agent_closing_ratio"
    roles: [PropertyManager, LeasingAgent]
    code: 200
    input: [property_id, window_start, window_end, "basis?", "agent_id?", "source?"]
    output: "{ property_id: string, window_start: string, window_end: string, basis: string, rows: array }"
    side_effects: []

  # --- Test-driving (1) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (ISO 8601 UTC). Server startup default before any set call is exactly 2026-08-01T00:00:00Z; the logical clock never falls back to wall-clock time. All deadlines, expiries, and SLA computations read this clock."
    roles: [PropertyManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["subsequent lazy sweeps evaluate against the new logical time"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role missing, or role not recognized" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role is not permitted to call this endpoint" }
  - { id: ERR_NOT_ASSIGNED_AGENT, http: 403, condition: "Caller is neither the inquiry's assigned agent nor a PropertyManager (respond / mark-lost)" }
  - { id: ERR_APPLICANT_MISMATCH, http: 403, condition: "Lease sign caller's X-User-ID does not equal the lease's application_id" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum member, negative/invalid numeric, malformed datetime, or conditional-field violation (e.g., agent_id present on SELF_GUIDED tour, missing on GUIDED)" }
  - { id: ERR_PROPERTY_NOT_FOUND, http: 404, condition: "Referenced property id does not exist" }
  - { id: ERR_AGENT_NOT_FOUND, http: 404, condition: "Referenced agent id does not exist" }
  - { id: ERR_FLOORPLAN_NOT_FOUND, http: 404, condition: "Referenced floorplan id does not exist" }
  - { id: ERR_PRICING_OFFER_NOT_FOUND, http: 404, condition: "Referenced pricing offer id does not exist" }
  - { id: ERR_INQUIRY_NOT_FOUND, http: 404, condition: "Referenced inquiry id does not exist" }
  - { id: ERR_TOUR_NOT_FOUND, http: 404, condition: "Referenced tour id does not exist" }
  - { id: ERR_WAITLIST_ENTRY_NOT_FOUND, http: 404, condition: "Referenced waitlist entry id does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "Referenced application id does not exist" }
  - { id: ERR_LEASE_NOT_FOUND, http: 404, condition: "Referenced lease id does not exist" }
  - { id: ERR_MOVE_IN_NOT_FOUND, http: 404, condition: "Referenced move-in id does not exist" }
  - { id: ERR_INVALID_TIME_RANGE, http: 400, condition: "end <= start for a tour; expires_at <= effective_start for an offer; publish of an offer whose expires_at is already past" }
  - { id: ERR_APPLICATION_SOURCE_AMBIGUOUS, http: 400, condition: "Application create supplies both or neither of inquiry_id / waitlist_entry_id" }
  - { id: ERR_INQUIRY_INVALID_STATE, http: 409, condition: "Claim/respond/mark-lost from an invalid inquiry state (unassigned respond, already-assigned claim, terminal inquiry)" }
  - { id: ERR_INQUIRY_NOT_ACTIVE, http: 409, condition: "Tour creation against an inquiry in LOST or CONVERTED state" }
  - { id: ERR_ALREADY_RESPONDED, http: 409, condition: "Respond on an inquiry that already has first_responded_at set" }
  - { id: ERR_TOUR_INVALID_STATE, http: 409, condition: "Reschedule/complete/cancel from a non-SCHEDULED tour state" }
  - { id: ERR_TOUR_TIME_CONFLICT, http: 409, condition: "GUIDED tour overlaps the agent's buffered tour intervals at or beyond max_concurrent_tours capacity" }
  - { id: ERR_SELF_GUIDED_NO_UNIT, http: 409, condition: "SELF_GUIDED tour requested while floorplan.available_units == 0" }
  - { id: ERR_PRICING_OFFER_INVALID_STATE, http: 409, condition: "Publish/retire from an invalid offer state, or lease generation pinning a non-PUBLISHED offer" }
  - { id: ERR_OFFER_ALREADY_PUBLISHED, http: 409, condition: "Publish while another offer for the same floorplan is PUBLISHED" }
  - { id: ERR_WAITLIST_INVALID_STATE, http: 409, condition: "Promote/decline/cancel/convert from an invalid entry state (including expired offers swept to WAITING)" }
  - { id: ERR_FLOORPLAN_AVAILABLE, http: 409, condition: "Waitlist join while floorplan.available_units >= 1" }
  - { id: ERR_NOT_QUEUE_HEAD, http: 409, condition: "Promote targeted at an entry that is not the WAITING queue head (position ASC, created_at ASC)" }
  - { id: ERR_NO_UNITS_TO_OFFER, http: 409, condition: "Promote while effective_available_units (available_units minus OFFERED entries) == 0" }
  - { id: ERR_APPLICATION_INVALID_STATE, http: 409, condition: "Decide/rescreen/clear-conditions/withdraw from an invalid application state" }
  - { id: ERR_SCREENING_BLOCKS_APPROVAL, http: 422, condition: "Decide APPROVED or APPROVED_WITH_CONDITIONS while recommendation == DENY" }
  - { id: ERR_APPLICATION_FLOORPLAN_MISMATCH, http: 422, condition: "application.floorplan_id differs from the source inquiry's or waitlist entry's floorplan_id" }
  - { id: ERR_APPLICATION_NOT_LEASABLE, http: 409, condition: "Lease generation against an application not in APPROVED or CONDITIONS_CLEARED" }
  - { id: ERR_DEPOSIT_INSUFFICIENT, http: 402, condition: "clear-conditions payment leaves deposit_paid_cents < required_deposit_cents" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_application_version does not match the application's current version at lease generation" }
  - { id: ERR_LEASE_ALREADY_COMMITTED, http: 409, condition: "Lease regeneration while a SIGNED_BY_APPLICANT or EXECUTED lease exists for the application" }
  - { id: ERR_OFFER_FLOORPLAN_MISMATCH, http: 422, condition: "pricing_offer_id on lease generation belongs to a different floorplan than the application's" }
  - { id: ERR_RENT_OVERRIDE_TOO_LOW, http: 422, condition: "rent_override_cents below 80% (round_half_up) of the computed monthly rent" }
  - { id: ERR_LEASE_INVALID_STATE, http: 409, condition: "Sign/countersign/cancel from an invalid lease state (including signing at/past signing_deadline)" }
  - { id: ERR_LEASE_NOT_EXECUTED, http: 409, condition: "Move-in creation against a lease not in EXECUTED state" }
  - { id: ERR_MOVEIN_DAY_FULL, http: 409, condition: "Move-in would exceed property.max_moveins_per_day for that UTC date (count of SCHEDULED/READY move-ins already >= cap)" }
  - { id: ERR_MOVEIN_ALREADY_ACTIVE, http: 409, condition: "Lease already has a SCHEDULED or READY move-in" }
  - { id: ERR_MOVEIN_INVALID_STATE, http: 409, condition: "Confirm/complete/cancel from an invalid move-in state" }
  - { id: ERR_UTILITY_CONFIRMATION_REQUIRED, http: 409, condition: "Complete from SCHEDULED while the property requires utility transfer confirmation" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PropertyManager
    description: "Community manager with full override power: configures properties/agents/floorplans/pricing, decides applications, generates/countersigns/cancels leases; may perform every LeasingAgent operation and is exempt from assigned-agent ownership checks"
    identity: "entity_backed:Agent"
    exclusive_operations:
      - "POST /leasing/properties"
      - "POST /leasing/agents"
      - "POST /leasing/floorplans"
      - "POST /leasing/pricing-offers, publish, retire"
      - "POST /leasing/applications/{id}/decide, rescreen"
      - "POST /leasing/leases (generate), countersign, cancel"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints; inquiry create/claim/respond/mark-lost; tour create/reschedule/complete/cancel; waitlist create/promote/decline/cancel; application create/clear-conditions/withdraw; move-in create/confirm-utilities/complete/cancel; closing report"

  - name: LeasingAgent
    description: "Leasing agent: works inquiries (claim/respond), schedules and conducts tours, manages the waitlist, creates applications, clears approval conditions, schedules move-ins"
    identity: "entity_backed:Agent"
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints (except as noted); inquiry create/claim/respond/mark-lost; tour create/reschedule/complete/cancel; waitlist create/promote/decline/cancel; application create/clear-conditions/withdraw; move-in create/confirm-utilities/complete/cancel; closing report"

  - name: Applicant
    description: "Applicant portal identity: X-User-ID equals the Application.id the session is scoped to; may read own application/lease and e-sign the lease"
    identity: "entity_backed:Application"
    exclusive_operations:
      - "POST /leasing/leases/{leaseId}/sign"
    shared_operations:
      - "GET /leasing/properties, /leasing/floorplans, /leasing/pricing-offers (display reads); GET /leasing/applications/{id}; GET /leasing/leases/{id}"
