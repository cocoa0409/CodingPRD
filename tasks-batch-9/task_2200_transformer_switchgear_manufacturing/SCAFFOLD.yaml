  # --- EscalationAdjustment -------------------------------------------------
  - id: create_escalation_adjustment
    method: POST
    path: "/engineered-orders/{id}/escalation-adjustments"
    description: "Compute a PROVISIONAL or FINAL material-escalation adjustment; OCC-guarded by expected_engineered_order_version"
    roles: [ContractAdmin]
    code: 201
    input: [escalation_clause_id, variant, prepared_by_user_id, expected_engineered_order_version]
    output: EscalationAdjustment
    side_effects: ["status := CALCULATED", "run calc material_escalation_amount (variant PROVISIONAL or FINAL)", "populate copper/aluminum/core_steel component cents, raw_movement_cents, adjustment_amount_cents, cap_applied, collar_absorbed, index_months_used", "increments EngineeredOrder.version by 1"]
  - id: list_escalation_adjustments
    method: GET
    path: "/escalation-adjustments"
    description: "Filtered list resolving both the order and clause FKs"
    roles: [ContractAdmin, SalesEngineer, PlantAdmin, CustomerReviewer]
    code: 200
    input: ["engineered_order_id?", "escalation_clause_id?", "variant?", "status?", "limit?", "offset?"]
    output: EscalationAdjustment[]
    side_effects: []
  - id: get_escalation_adjustment
    method: GET
    path: "/escalation-adjustments/{id}"
    description: "Read one adjustment with its computed components"
    roles: [ContractAdmin, SalesEngineer, PlantAdmin, CustomerReviewer]
    code: 200
    input: []
    output: EscalationAdjustment
    side_effects: []
  - id: submit_escalation_adjustment
    method: POST
    path: "/escalation-adjustments/{id}/submit"
    description: "CALCULATED or RECALCULATING -> SUBMITTED_TO_CUSTOMER"
    roles: [ContractAdmin]
    code: 200
    input: []
    output: EscalationAdjustment
    side_effects: ["status := SUBMITTED_TO_CUSTOMER"]
  - id: accept_escalation_adjustment
    method: POST
    path: "/escalation-adjustments/{id}/accept"
    description: "SUBMITTED_TO_CUSTOMER -> ACCEPTED; money lands on the order"
    roles: [CustomerReviewer]
    code: 200
    input: [accepted_by_user_id]
    output: EscalationAdjustment
    side_effects: ["status := ACCEPTED", "order.escalation_accepted_total_cents increases by adjustment_amount_cents", "recompute order.net_contract_value_cents", "increments EngineeredOrder.version by 1"]
  - id: dispute_escalation_adjustment
    method: POST
    path: "/escalation-adjustments/{id}/dispute"
    description: "SUBMITTED_TO_CUSTOMER -> DISPUTED"
    roles: [CustomerReviewer]
    code: 200
    input: [dispute_reason]
    output: EscalationAdjustment
    side_effects: ["status := DISPUTED"]
  - id: recalculate_escalation_adjustment
    method: POST
    path: "/escalation-adjustments/{id}/recalculate"
    description: "DISPUTED -> RECALCULATING; recomputes against currently usable index points"
    roles: [ContractAdmin]
    code: 200
    input: ["variant?"]
    output: EscalationAdjustment
    side_effects: ["status := RECALCULATING", "recalculation_round increases by 1", "re-run calc material_escalation_amount"]
  - id: withdraw_escalation_adjustment
    method: POST
    path: "/escalation-adjustments/{id}/withdraw"
    description: "CALCULATED, SUBMITTED_TO_CUSTOMER, DISPUTED or RECALCULATING -> WITHDRAWN"
    roles: [ContractAdmin]
    code: 200
    input: []
    output: EscalationAdjustment
    side_effects: ["status := WITHDRAWN"]

  # --- Supplier -------------------------------------------------------------
  - id: create_supplier
    method: POST
    path: "/suppliers"
    description: "Register an approved vendor"
    roles: [PlantAdmin, QualityEngineer]
    code: 201
    input: [supplier_code, legal_name, region]
    output: Supplier
    side_effects: ["status := APPROVED", "quality_index_trailing and quality_index_lifetime seeded by calc supplier_quality_index"]
  - id: list_suppliers
    method: GET
    path: "/suppliers"
    description: "Filtered list of vendors with both quality indices"
    roles: [PlantAdmin, QualityEngineer, MaterialsPlanner, ComplianceOfficer]
    code: 200
    input: ["status?", "region?", "limit?", "offset?"]
    output: Supplier[]
    side_effects: []
  - id: get_supplier
    method: GET
    path: "/suppliers/{id}"
    description: "Read one vendor"
    roles: [PlantAdmin, QualityEngineer, MaterialsPlanner, ComplianceOfficer]
    code: 200
    input: []
    output: Supplier
    side_effects: []
  - id: create_supplier_receipt_event
    method: POST
    path: "/suppliers/{id}/receipt-events"
    description: "Record a receipt event on the vendor; grows the quality-index denominator and can flip PROBATION back to APPROVED"
    roles: [MaterialsPlanner, QualityEngineer]
    code: 201
    input: ["event_count?"]
    output: Supplier
    side_effects: ["receipt_event_count increases", "re-run calc supplier_quality_index (TRAILING and LIFETIME)", "status cycles APPROVED <-> PROBATION at the 70.00 threshold"]
  - id: suspend_supplier
    method: POST
    path: "/suppliers/{id}/suspend"
    description: "APPROVED or PROBATION -> SUSPENDED (terminal); gated on quality_index_lifetime"
    roles: [PlantAdmin]
    code: 200
    input: ["reason?"]
    output: Supplier
    side_effects: ["status := SUSPENDED", "no new ComponentAllocation may name this vendor's components"]
  - id: get_supplier_quality_summary
    method: GET
    path: "/suppliers/{id}/quality-summary"
    description: "Computed read: TRAILING vs LIFETIME quality index, attributed_failure_count, receipt_event_count and probation_entered_at"
    roles: [PlantAdmin, QualityEngineer, MaterialsPlanner]
    code: 200
    input: []
    output: Supplier
    side_effects: []

  # --- LongLeadComponent ----------------------------------------------------
  - id: create_long_lead_component
    method: POST
    path: "/suppliers/{id}/long-lead-components"
    description: "Register a long-lead part under a vendor"
    roles: [MaterialsPlanner, PlantAdmin]
    code: 201
    input: [part_number, category, lead_time_days, quantity_on_hand, "allocation_policy?"]
    output: LongLeadComponent
    side_effects: ["status := ACTIVE", "run calc component_availability"]
  - id: list_supplier_long_lead_components
    method: GET
    path: "/suppliers/{id}/long-lead-components"
    description: "Reverse-reachability list of a vendor's parts"
    roles: [MaterialsPlanner, PlantAdmin, QualityEngineer]
    code: 200
    input: ["status?", "category?", "limit?", "offset?"]
    output: LongLeadComponent[]
    side_effects: []
  - id: list_long_lead_components
    method: GET
    path: "/long-lead-components"
    description: "Filtered list of parts across vendors"
    roles: [MaterialsPlanner, PlantAdmin, QualityEngineer, ComplianceOfficer]
    code: 200
    input: ["supplier_id?", "status?", "category?", "allocation_policy?", "limit?", "offset?"]
    output: LongLeadComponent[]
    side_effects: []
  - id: get_long_lead_component
    method: GET
    path: "/long-lead-components/{id}"
    description: "Read one part with its four unit buckets and quantity_available"
    roles: [MaterialsPlanner, PlantAdmin, QualityEngineer, ComplianceOfficer]
    code: 200
    input: []
    output: LongLeadComponent
    side_effects: []
  - id: create_component_receipt
    method: POST
    path: "/long-lead-components/{id}/receipts"
    description: "Receive units into stock; the only operation that increases quantity_on_hand + quantity_consumed"
    roles: [MaterialsPlanner]
    code: 201
    input: [quantity]
    output: LongLeadComponent
    side_effects: ["quantity_on_hand increases by quantity", "re-run calc component_availability", "increments LongLeadComponent.version by 1"]
  - id: release_component_quarantine
    method: POST
    path: "/long-lead-components/{id}/release-quarantine"
    description: "QUARANTINED -> ACTIVE"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: LongLeadComponent
    side_effects: ["status := ACTIVE, quarantine_reason cleared", "increments LongLeadComponent.version by 1"]
  - id: obsolete_long_lead_component
    method: POST
    path: "/long-lead-components/{id}/obsolete"
    description: "ACTIVE or QUARANTINED -> OBSOLETE (terminal)"
    roles: [PlantAdmin, MaterialsPlanner]
    code: 200
    input: ["reason?"]
    output: LongLeadComponent
    side_effects: ["status := OBSOLETE", "increments LongLeadComponent.version by 1"]

  # --- ComponentAllocation --------------------------------------------------
  - id: create_component_allocation
    method: POST
    path: "/component-allocations"
    description: "Reserve units of a part for an order; OCC-guarded by expected_component_version and may preempt lower-priority allocations"
    roles: [MaterialsPlanner]
    code: 201
    input: [long_lead_component_id, engineered_order_id, quantity, priority_class, need_by_date, expected_component_version]
    output: ComponentAllocation
    side_effects: ["status := RESERVED", "run calc component_availability", "run calc preemption_victim_selector; victims -> PREEMPTED with preempted_for_allocation_id set", "re-run calc order_production_posture on every affected order", "increments LongLeadComponent.version by 1"]
  - id: list_component_allocations
    method: GET
    path: "/component-allocations"
    description: "Filtered list resolving the component, order and preemption-chain FKs"
    roles: [MaterialsPlanner, PlantAdmin, QualityEngineer, ContractAdmin]
    code: 200
    input: ["long_lead_component_id?", "engineered_order_id?", "preempted_for_allocation_id?", "status?", "priority_class?", "limit?", "offset?"]
    output: ComponentAllocation[]
    side_effects: []
  - id: get_component_allocation
    method: GET
    path: "/component-allocations/{id}"
    description: "Read one allocation"
    roles: [MaterialsPlanner, PlantAdmin, QualityEngineer, ContractAdmin]
    code: 200
    input: []
    output: ComponentAllocation
    side_effects: []
  - id: commit_component_allocation
    method: POST
    path: "/component-allocations/{id}/commit"
    description: "RESERVED -> COMMITTED; moves units from the reserved bucket to the committed bucket"
    roles: [MaterialsPlanner]
    code: 200
    input: []
    output: ComponentAllocation
    side_effects: ["status := COMMITTED, committed_at := logical clock", "re-run calc component_availability", "re-run calc order_production_posture; order may advance PLANNING -> MATERIAL_ALLOCATED", "increments LongLeadComponent.version and EngineeredOrder.version by 1"]
  - id: release_component_allocation
    method: POST
    path: "/component-allocations/{id}/release"
    description: "RESERVED or COMMITTED -> RELEASED; a COMMITTED release accrues release_penalty_cents per calc allocation_release_penalty"
    roles: [MaterialsPlanner]
    code: 200
    input: ["reason?"]
    output: ComponentAllocation
    side_effects: ["status := RELEASED, released_at := logical clock", "run calc allocation_release_penalty", "re-run calc component_availability", "re-run calc order_production_posture; order may revert MATERIAL_ALLOCATED -> PLANNING", "increments LongLeadComponent.version and EngineeredOrder.version by 1"]

