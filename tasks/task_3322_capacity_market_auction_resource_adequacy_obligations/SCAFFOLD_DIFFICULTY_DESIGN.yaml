  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: replacement_reject_conserves_committed_mw_and_revenue
        grounds:
          - state_machines.CapacityCommitment.ACTIVE_to_REPLACEMENT_PENDING
          - state_machines.CapacityCommitment.REPLACEMENT_PENDING_to_ACTIVE
          - entities.CapacityCommitment.fields.committed_mw
          - entities.CapacityCommitment.fields.daily_revenue_dollars
        distinguishing_aspect: |
          Conserved quantity: committed_mw (hence daily_revenue_dollars =
          committed_mw * clearing_price). The forward action (replacement
          create) paired with its compensating action (reviewer reject) must
          leave committed_mw == 10.000 and daily_revenue_dollars == 700.00
          exactly — no drift from the round trip.
        test_recipe:
          setup:
            - "DY CLEARED; commitment C1 ACTIVE committed 10.000 @ 70.00 (daily revenue 700.00); accredited replacement resource R2 (owner O1)"
          setup_api_calls:
            - call: "POST /capacity-market/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MarketAdmin
            - call: "POST /capacity-market/delivery-years"
              payload: { delivery_year_label: "2029/2030", planning_period_start: "2029-06-01T00:00:00Z", planning_period_end: "2030-05-31T23:59:59Z" }
              as: MarketAdmin
