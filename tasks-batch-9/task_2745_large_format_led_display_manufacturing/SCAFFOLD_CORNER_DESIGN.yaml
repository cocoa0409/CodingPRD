          assert:
            - "trigger call 1 -> 400 with ${err_shape} == 'ERR_VALIDATION_FAILED': 'AIRPORT' is not a member of install_environment, and the missing display model is not reported"
            - "trigger call 2 -> 404 with ${err_ref} == 'ERR_REFERENCE_NOT_FOUND' (not ERR_PROJECT_NOT_FOUND: display_model_id is a non-entity-specific parent)"
            - "trigger call 3 -> 201 with DisplayProject.${pj}.production_state == NOT_STARTED"
            - "GET /projects returns exactly one row"

      - name: crew_assignment_outranks_visit_state_and_mounting
        claim_type: priority_ordering
        grounds:
          - validations[priority=13]
          - validations[priority=22]
          - validations[priority=25]
          - errors.ERR_CREW_NOT_ASSIGNED
          - errors.ERR_INVALID_VISIT_STATE
        distinguishing_aspect: |
          Three rules are simultaneously violated by one sign-off call on a fresh
          visit for a project with nothing mounted, and the expected answer walks
          down the ladder as each is repaired: the wrong crew gets 403
          ERR_CREW_NOT_ASSIGNED (13), the assigned crew gets 409
          ERR_INVALID_VISIT_STATE (22) because a SCHEDULED visit cannot be signed
          off, and only if state were satisfied would 25 speak. Note that priority
          13 is an identity check on X-User-ID against visit.commissioning_crew_id,
          not a role check — both callers hold the FieldEngineer role, so a
          role-only implementation lets the wrong crew through to the state error.
        test_recipe:
          setup:
            - "An FP10-IN RETAIL project ${pj} in region NA-W has NO cabinets, so production_state == NOT_STARTED; visit ${visit} is SCHEDULED for ${crew_w} while ${crew_e} exists but is not assigned."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
