  - section: rbac
    instances:
      - name: missing_auth_headers_and_unknown_roles_are_rejected_before_lookup
        claim_type: exclusive_operations
        grounds:
          - validations.priority_1.ERR_MISSING_AUTH_HEADERS
          - validations.priority_2.ERR_UNKNOWN_ROLE
        distinguishing_aspect: >
          Authentication is decided before resource lookup: a header-less GET against a real broker
          returns ERR_MISSING_AUTH_HEADERS at HTTP 401, and a GET carrying X-User-Role DataJanitor
          against a non-existent broker id returns ERR_UNKNOWN_ROLE at HTTP 401 rather than
          ERR_BROKER_NOT_FOUND at 404.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z and exactly one DataBroker."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Silverleaf Data Exchange", primary_contact_email: "compliance@silverleaf.example", home_state_code: "CA", operating_state_codes: ["CA"], business_description: "Resells licensed automotive and household ownership attributes to lead generators." }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
          trigger:
            - call: "GET /brokers/${broker_id}"
              payload: {}
              omit_auth_headers: true
              expect_error: { error_id: ERR_MISSING_AUTH_HEADERS, http_status: 401 }
            - call: "GET /brokers/${broker_id}"
              payload: {}
              as: BrokerAdmin
              as_user_id: ""
              expect_error: { error_id: ERR_MISSING_AUTH_HEADERS, http_status: 401 }
            - call: "GET /brokers/00000000-0000-4000-8000-000000000999"
              payload: {}
              as: DataJanitor
              as_user_id: "someone"
              expect_error: { error_id: ERR_UNKNOWN_ROLE, http_status: 401 }
          assert:
            - "the header-less call carries data.error_id == ERR_MISSING_AUTH_HEADERS with HTTP 401"
            - "the empty X-User-ID call carries data.error_id == ERR_MISSING_AUTH_HEADERS with HTTP 401"
            - "the DataJanitor call carries data.error_id == ERR_UNKNOWN_ROLE with HTTP 401"
            - "the DataJanitor call does not carry data.error_id == ERR_BROKER_NOT_FOUND"
            - "every error body carries exactly the keys error_id and message under data, with response_type == error"

      - name: broker_admin_cannot_accept_its_own_registration
        claim_type: exclusive_operations
        grounds:
          - validations.priority_3.ERR_ROLE_NOT_PERMITTED
          - roles.PlatformAdmin.exclusive_operations
