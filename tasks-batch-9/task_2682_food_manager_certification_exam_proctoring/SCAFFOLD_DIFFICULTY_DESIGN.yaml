            - call: "POST /proctors/${proc_id}/reinstatement"
              payload: { remediation_ref: "REM-2026-0001" }
              as: PlatformAdmin
              as_user_id: "admin-registry-2"
          trigger:
            - call: "POST /proctors/${proc_id}/audit-open"
              payload: { audit_reason: "Post-incident registration audit" }
              as: PlatformAdmin
              as_user_id: "admin-registry-2"
              captures: { rolling_score: $.data.risk_score, rolling_variant: $.data.risk_variant_applied }
            - call: "POST /proctors/${proc_id}/audit-close"
              payload: { outcome: "PASS", audit_note: "Operator saw no in-window findings." }
              as: PlatformAdmin
              as_user_id: "admin-registry-2"
              captures: { lifetime_score: $.data.risk_score, lifetime_variant: $.data.risk_variant_applied }
          assert:
            - "Proctor.${proc_id}.substantiated_incident_weight_total == 5 after the substantiation"
            - "after audit-open: Proctor.${proc_id}.risk_score == 0.00 and Proctor.${proc_id}.risk_variant_applied == ROLLING_WINDOW and Proctor.${proc_id}.registration_status == UNDER_AUDIT"
            - "after audit-close with outcome PASS: Proctor.${proc_id}.risk_score == 16.67 and Proctor.${proc_id}.risk_variant_applied == LIFETIME_CUMULATIVE"
            - "the PASS outcome does NOT return the proctor to REGISTERED: Proctor.${proc_id}.registration_status == SUSPENDED and Proctor.${proc_id}.suspended_reason == RISK_THRESHOLD_BREACH because 16.67 >= PROCTOR_RISK_SUSPEND_THRESHOLD"
            - "the two variants differ by exactly 16.67 on identical data (rolling 0.00 vs lifetime 16.67)"
            - "ExamSession.${s1_id}.session_status == INVALIDATED and ScoreReport.${sr1_id}.status == VOIDED"
      - name: scaled_score_provisional_vs_final_equated_flips_pass_flag
        grounds:
          - calculations.scaled_score
          - calculations.effective_cut_score
          - entities.ScoreReport.fields.provisional_scaled_score
          - entities.ScoreReport.fields.final_scaled_score
          - entities.ScoreReport.fields.pass_flag
          - state_machines.ScoreReport.PROVISIONAL_to_FINAL
        distinguishing_aspect: |
          On one ScoreReport with raw_correct_count 55 out of scored_item_count 80, the PROVISIONAL
          variant divides by the full 80 and yields 69 (below the effective cut score 70), while the
          FINAL_EQUATED variant removes 5 keyed-out items the candidate had missed from BOTH numerator
          and denominator (55/75) and yields 73, flipping pass_flag from a provisional failure to a
          final pass; provisional_scaled_score is retained at 69 and is never overwritten. The subject
          is a candidate's exam result on a ScoreReport, a different entity domain from the Proctor
          risk-scoring instance.
        test_recipe:
          setup:
            - "Baseline jurisdiction / provider / EN form (scored_item_count 80, national_cut_score 70) / site / candidate / REGISTERED proctor, no jurisdiction cut-score override."
            - "One EXAM_ONLY code assigned, one IN_PERSON sitting on 2026-09-10T09:00:00Z submitted with scored_correct_count 55 at clock 2026-09-10T08:45:00Z."
          setup_api_calls:
            - call: "POST /jurisdictions"
