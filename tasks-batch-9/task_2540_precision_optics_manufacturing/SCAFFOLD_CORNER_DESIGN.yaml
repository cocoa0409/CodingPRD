          AssemblyComponent is the only two-parent row in the model, and each of its foreign keys has its
          own collection endpoint: both elements of WO-2540-1 are listed under the assembly and under the
          work order, the two lists agree row for row, the single read returns the same body as either
          list entry, and the component_status filter is honoured on both sides.
