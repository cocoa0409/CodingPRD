            - "${ok_status} == SUBMITTED and ${ok_v} > ${case_v1} — only the author's call advances the case"
            - "ConsolidationCase.${case_id}.returned_count == 0 and net_annual_savings_cents == 18320000 after the author's submit"

      - name: branch_manager_snapshot_for_a_peer_branch_returns_403
        claim_type: shared_operations
        grounds:
          - roles.BranchManager.shared_operations
          - validations.priority_5_ERR_BRANCH_OWNERSHIP_REQUIRED
          - calculations.branch_performance_score
        distinguishing_aspect: "BranchManager is entity-backed, so authority is scoped by X-User-ID == Branch.id: the same request body is accepted for the manager's own branch and refused with ERR_BRANCH_OWNERSHIP_REQUIRED 403 for a peer branch in the same market."
