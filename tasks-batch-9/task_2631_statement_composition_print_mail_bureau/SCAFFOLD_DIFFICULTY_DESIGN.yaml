              as: BureauAdmin
              captures: { ps_echo_id: "$.data.id" }
            - call: "POST /bureau/data-files"
              payload: { client_id: "${ps_client_id}", file_name: "ps-cycle-01.csv", format_spec_code: "DELIMITED", declared_record_count: 2, declared_control_total_cents: 60000 }
              as: ClientLiaison
              captures: { ps_file_id: "$.data.id" }
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${ps_file_id}", account_ref: "ACC4001", sequence_no: 1, statement_amount_cents: 30000, address_line1: "5 Parkside Row", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "3301" }
              as: ClientLiaison
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${ps_file_id}", account_ref: "ACC4002", sequence_no: 2, statement_amount_cents: 30000, address_line1: "7 Parkside Row", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "3302" }
              as: ClientLiaison
            - call: "POST /bureau/data-files/${ps_file_id}/validate-format"
              payload: {}
              as: CompositionOperator
            - call: "POST /bureau/data-files/${ps_file_id}/control-check"
              payload: {}
              as: CompositionOperator
            - call: "POST /bureau/composition-jobs"
              payload: { data_file_id: "${ps_file_id}", template_id: "${ps_template_id}", rush_requested: false }
              as: CompositionOperator
