scenario: |
  Manufactured & Modular Home Dealer (Clayton Homes style dealer): model inventory & factory order configuration, site evaluation (foundation/utilities/permits) & installation scope, transport & set crew scheduling with escort requirements, financing (chattel vs real property) & titling, warranty & factory service claim, community placement & lot lease coordination, trade-in & used home reconditioning, delivery delay & buyer communication

domain_name: manufactured-home-dealer
api_prefix: /api

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - temporal_windowing
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - polymorphic
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: HomeModel
    parent: null
    common_fields: true
    fields:
      - name: model_code
        type: string
        source: input
        description: "Unique dealer-facing model code; uniqueness scoped to non-DISCONTINUED models."
      - name: name
        type: string
        source: input
        description: "Marketing name of the model."
      - name: floor_plan_type
        type: enum
        source: input
        description: "Layout family."
        constraints: "one of SINGLE_WIDE, DOUBLE_WIDE, TRIPLE_WIDE, MODULAR"
      - name: section_count
        type: integer
        source: input
        description: "Number of transportable sections (1 for single-wide, 2 double, 3 triple, >=1 modular)."
        constraints: "integer >= 1"
      - name: width_ft
        type: number
        source: input
        description: "Maximum transport width in feet; drives escort requirement thresholds (14.0 / 16.0)."
        constraints: "number > 0"
      - name: length_ft
        type: number
        source: input
        description: "Maximum transport length in feet; checked against Lot.max_length_ft (<=, equality allowed)."
        constraints: "number > 0"
      - name: base_price_cents
        type: integer
        source: input
        description: "Factory base price in cents."
        constraints: "integer >= 0"
      - name: factory_lead_time_days
        type: integer
        source: input
        description: "Days from factory order registration until a FACTORY_ORDER HomeUnit may be marked ready."
        constraints: "integer >= 0"
      - name: status
        type: enum
        source: system
        description: "ACTIVE on creation; DISCONTINUED models cannot be used for new HomeUnits."
        default: ACTIVE
        constraints: "one of ACTIVE, DISCONTINUED"

  - name: Community
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Community name."
      - name: address
        type: string
        source: input
        description: "Street address of the land-lease community."
      - name: lot_rent_cents
        type: integer
        source: input
        description: "Monthly lot lease rent in cents."
        constraints: "integer >= 0"
      - name: status
        type: enum
        source: system
        description: "ACTIVE communities accept lot reservations; CLOSED communities do not."
        default: ACTIVE
        constraints: "one of ACTIVE, CLOSED"

  - name: Lot
    parent: Community
    common_fields: true
    fields:
      - name: community_id
        type: string
        source: input
        description: "FK -> Community.id; the community this lot belongs to."
      - name: lot_number
        type: string
        source: input
        description: "Lot identifier; unique within its community."
      - name: max_sections
        type: integer
        source: input
        description: "Maximum home sections the lot accepts (>=, equality allowed)."
        constraints: "integer >= 1"
      - name: max_length_ft
        type: number
        source: input
        description: "Maximum home length in feet the lot accepts (<=, equality allowed)."
        constraints: "number > 0"
      - name: utilities_ready
        type: boolean
        source: input
        description: "Whether water/sewer/electric stubs are present at the lot."
      - name: status
        type: enum
        source: system
        description: "AVAILABLE -> RESERVED (reserve) -> LEASED (on delivery); RESERVED -> AVAILABLE (release or order-cancel compensation)."
        default: AVAILABLE
        constraints: "one of AVAILABLE, RESERVED, LEASED"

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Buyer full legal name."
      - name: email
        type: string
        source: input
        description: "Buyer email; unique across all customers."
      - name: phone
        type: string
        source: input
        description: "Buyer phone."
      - name: credit_tier
        type: enum
        source: input
        description: "Dealer-assigned credit tier."
        constraints: "one of TIER_A, TIER_B, TIER_C"
      - name: status
        type: enum
        source: system
        description: "ACTIVE on creation."
        default: ACTIVE
        constraints: "one of ACTIVE, INACTIVE"

  - name: HomeUnit
    parent: null
    common_fields: true
    fields:
      - name: model_id
        type: string
        source: input
        description: "FK -> HomeModel.id; the model this physical unit was built to."
      - name: serial_number
        type: string
        source: input
        description: "Factory serial number (HUD label); unique. System-minted for trade-in units created by appraisal acceptance."
      - name: unit_kind
        type: enum
        source: input
        description: "STOCK starts AT_DEALER; FACTORY_ORDER starts AT_FACTORY and requires mark-ready after lead time; TRADE_IN is system-created on appraisal acceptance."
        constraints: "one of STOCK, FACTORY_ORDER, TRADE_IN"
      - name: condition_grade
        type: enum
        source: input
        description: "NEW for stock/factory units; A/B/C for trade-ins."
        constraints: "one of NEW, A, B, C"
      - name: status
        type: enum
        source: system
        description: "Physical lifecycle: AT_FACTORY -> AT_DEALER -> RESERVED -> IN_TRANSIT -> ON_SITE -> INSTALLED; trade-in branch AT_DEALER -> RECONDITIONING -> RETAIL_READY; RETAIL_READY -> RESERVED allowed (resale)."
        constraints: "one of AT_FACTORY, AT_DEALER, RESERVED, IN_TRANSIT, ON_SITE, INSTALLED, RECONDITIONING, RETAIL_READY"
      - name: lot_id
        type: string
        source: system
        description: "FK -> Lot.id; set when the unit is delivered onto a community lot; null for private-land or pre-delivery units."
      - name: sales_order_id
        type: string
        source: system
        description: "FK -> SalesOrder.id; the order currently holding this unit (RESERVED linkage); cleared on order cancellation."
      - name: delivered_at
        type: datetime
        source: system
        description: "Timestamp of transport delivery; factory-defect warranty anchor."
      - name: set_completed_at
        type: datetime
        source: system
        description: "Timestamp of set completion; installation-damage warranty anchor."

  - name: SalesOrder
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the buyer."
      - name: home_unit_id
        type: string
        source: input
        description: "FK -> HomeUnit.id; the unit being purchased. Unit must be AT_DEALER or RETAIL_READY and not held by another non-terminal order."
      - name: placement_type
        type: enum
        source: input
        description: "COMMUNITY_LOT requires lot_id; PRIVATE_LAND forbids lot_id."
        constraints: "one of COMMUNITY_LOT, PRIVATE_LAND"
      - name: lot_id
        type: string
        source: input
        description: "FK -> Lot.id; required iff placement_type == COMMUNITY_LOT; lot must be RESERVED."
      - name: financing_type
        type: enum
        source: input
        description: "CHATTEL (home-only loan) or REAL_PROPERTY (mortgage; incompatible with COMMUNITY_LOT placement)."
        constraints: "one of CHATTEL, REAL_PROPERTY"
      - name: agreed_home_price_cents
        type: integer
        source: input
        description: "Negotiated price of the home itself in cents (before options/discount/fees)."
        constraints: "integer >= 0"
      - name: deposit_cents
        type: integer
        source: system
        description: "Deposit recorded at confirm; must be >= round_half_up(5% * total_price_cents)."
        default: 0
      - name: options_total_cents
        type: integer
        source: computed
        description: "Sum of line_total_cents over ACTIVE OrderOptions (calc order_line_pricing)."
      - name: discount_cents
        type: integer
        source: computed
        description: "Per-line rounded tier discount total (calc order_line_pricing)."
      - name: doc_fee_cents
        type: integer
        source: computed
        description: "Documentary fee (calc doc_fee): 1% of (subtotal - discount), clamped to [25000, 75000]."
      - name: transport_charge_cents
        type: integer
        source: computed
        description: "Quoted cost of the latest non-CANCELLED TransportJob (calc transport_quote); 0 before booking."
        default: 0
      - name: total_price_cents
        type: integer
        source: computed
        description: "subtotal - discount + doc_fee (evaluation order pinned in calc doc_fee); excludes transport charge."
      - name: trade_in_credit_cents
        type: integer
        source: computed
        description: "final_credit_cents of the ACCEPTED TradeInAppraisal for this order; 0 when none."
        default: 0
      - name: amount_financed_cents
        type: integer
        source: computed
        description: "max(0, total_price_cents - deposit_cents - trade_in_credit_cents); recomputed on every pricing/trade-in mutation."
      - name: delay_compensation_cents
        type: integer
        source: computed
        description: "Sum of compensation_cents over DelayNotices linked to this order directly or via its TransportJobs (calc delay_compensation)."
        default: 0
      - name: deal_status
        type: enum
        source: system
        description: "Pipeline dimension; see state machine SalesOrder.deal_status."
        constraints: "one of DRAFT, PENDING_SITE_EVAL, SITE_APPROVED, PENDING_FINANCING, FINANCING_APPROVED, AWAITING_DELIVERY, DELIVERED, SET_COMPLETE, TITLED, CLOSED, CANCELLED"
      - name: payment_status
        type: enum
        source: system
        description: "Parallel payment dimension; evolves independently of deal_status."
        constraints: "one of UNPAID, DEPOSIT_PAID, FINANCED, REFUNDED"

  - name: OrderOption
    parent: SalesOrder
    common_fields: true
    fields:
      - name: sales_order_id
        type: string
        source: input
        description: "FK -> SalesOrder.id; owning order."
      - name: option_code
        type: string
        source: input
        description: "Factory option code."
      - name: description
        type: string
        source: input
        description: "Option description."
      - name: unit_price_cents
        type: integer
        source: input
        description: "Per-unit option price in cents."
        constraints: "integer >= 0"
      - name: quantity
        type: integer
        source: input
        description: "Units of this option."
        constraints: "integer >= 1"
      - name: line_total_cents
        type: integer
        source: computed
        description: "unit_price_cents * quantity (exact integer cents)."
      - name: status
        type: enum
        source: system
        description: "ACTIVE options price into the order; VOIDED excluded."
        default: ACTIVE
        constraints: "one of ACTIVE, VOIDED"

  - name: SiteEvaluation
    parent: null
    common_fields: true
    fields:
      - name: sales_order_id
        type: string
        source: input
        description: "FK -> SalesOrder.id; order being evaluated for (foundation/utilities/permits) and installation scope."
      - name: evaluator_id
        type: string
        source: input
        description: "Opaque X-User-ID of the assigned SiteEvaluator; that user alone may record findings."
      - name: scheduled_date
        type: datetime
        source: input
        description: "Evaluation date; must be >= current clock date; evaluator may hold at most 3 evaluations per calendar date."
      - name: foundation_type
        type: enum
        source: input
        description: "Recorded at findings; foundation scope."
        constraints: "one of SLAB, CRAWL_SPACE, PIERS, BASEMENT"
      - name: utilities_verified
        type: boolean
        source: input
        description: "Recorded at findings; whether site utilities are confirmed."
      - name: permit_number
        type: string
        source: input
        description: "Recorded at findings; building/set permit number. Optional at findings time but REQUIRED before set completion."
      - name: findings_result
        type: enum
        source: input
        description: "Recorded at findings."
        constraints: "one of PASS, CONDITIONAL, FAIL"
      - name: install_estimate_cents
        type: integer
        source: input
        description: "Recorded at findings; estimated installation cost."
        constraints: "integer >= 0"
      - name: status
        type: enum
        source: system
        description: "SCHEDULED -> FINDINGS_RECORDED -> APPROVED | REJECTED; SCHEDULED/FINDINGS_RECORDED -> SUPERSEDED when a newer evaluation is created for the same order."
        constraints: "one of SCHEDULED, FINDINGS_RECORDED, APPROVED, REJECTED, SUPERSEDED"
      - name: evaluated_by
        type: string
        source: system
        description: "X-User-ID that recorded findings (audit)."

  - name: FinancingApplication
    parent: null
    common_fields: true
    fields:
      - name: sales_order_id
        type: string
        source: input
        description: "FK -> SalesOrder.id; order being financed. Creating a new application SUPERSEDES the order's prior active application."
      - name: financing_type
        type: enum
        source: input
        description: "Must equal the order's financing_type."
        constraints: "one of CHATTEL, REAL_PROPERTY"
      - name: lender_name
        type: string
        source: input
        description: "Lender name."
      - name: term_months
        type: integer
        source: input
        description: "Requested term; cap 240 for CHATTEL, 360 for REAL_PROPERTY."
        constraints: "integer >= 1"
      - name: down_payment_cents
        type: integer
        source: input
        description: "Down payment; must be >= order deposit_cents."
        constraints: "integer >= 0"
      - name: requested_amount_cents
        type: integer
        source: computed
        description: "Set at submit = order.amount_financed_cents; recomputed by trade-in cascade while DRAFT/SUBMITTED; frozen at CONDITIONALLY_APPROVED/APPROVED."
      - name: apr_bps
        type: integer
        source: system
        description: "Approved APR in basis points, set at decide; floor 700 for CHATTEL, 450 for REAL_PROPERTY."
      - name: estimated_payment_cents
        type: integer
        source: computed
        description: "Annuity payment at submit using the type's rate floor (calc loan_payment)."
      - name: monthly_payment_cents
        type: integer
        source: computed
        description: "Annuity payment at approve using approved apr_bps (calc loan_payment)."
      - name: rate_lock_expires_at
        type: datetime
        source: system
        description: "Set at APPROVED = approval time + 14 days; fund allowed while now <= this instant."
      - name: status
        type: enum
        source: system
        description: "DRAFT -> SUBMITTED -> APPROVED | CONDITIONALLY_APPROVED | DENIED; CONDITIONALLY_APPROVED -> APPROVED; APPROVED -> FUNDED | EXPIRED; active -> SUPERSEDED."
        constraints: "one of DRAFT, SUBMITTED, CONDITIONALLY_APPROVED, APPROVED, DENIED, FUNDED, EXPIRED, SUPERSEDED"
      - name: decided_by
        type: string
        source: system
        description: "X-User-ID of the LenderAgent who decided (audit)."

  - name: TransportCrew
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Crew name."
      - name: crew_size
        type: integer
        source: input
        description: "Headcount."
        constraints: "integer >= 1"
      - name: can_set_multiwide
        type: boolean
        source: input
        description: "Whether the crew is certified for multi-section (section_count >= 2) sets."
      - name: max_sections_per_window
        type: integer
        source: input
        description: "Per-calendar-date section capacity (calc crew_day_capacity)."
        constraints: "integer >= 1"
      - name: booked_dates
        type: array
        source: computed
        description: "Sorted calendar dates on which at least one non-terminal TransportJob consumes capacity, per calc crew_day_capacity."

  - name: TransportJob
    parent: null
    common_fields: true
    fields:
      - name: sales_order_id
        type: string
        source: input
        description: "FK -> SalesOrder.id; order being delivered. Order must be FINANCING_APPROVED."
      - name: home_unit_id
        type: string
        source: input
        description: "FK -> HomeUnit.id; must equal the order's home_unit_id."
      - name: crew_id
        type: string
        source: input
        description: "FK -> TransportCrew.id; assigned crew. Crew must have capacity on every date of the move window."
      - name: origin
        type: enum
        source: input
        description: "Pickup location."
        constraints: "one of FACTORY, DEALER_LOT"
      - name: distance_miles
        type: integer
        source: input
        description: "One-way transport distance; pricing input."
        constraints: "integer >= 0"
      - name: scheduled_start_date
        type: datetime
        source: input
        description: "First move date; must be >= current clock date. Window = [start, start + section_count days), half-open."
      - name: sections_count
        type: integer
        source: computed
        description: "Copied from the unit's HomeModel.section_count at booking."
      - name: escort_required
        type: boolean
        source: computed
        description: "calc escort_requirement: model width_ft >= 14.0."
      - name: escort_vehicle_count
        type: integer
        source: input
        description: "Escort vehicles booked; must be >= required count (1 for width >= 14.0, 2 for width >= 16.0)."
        constraints: "integer >= 0"
      - name: quoted_cost_cents
        type: integer
        source: computed
        description: "calc transport_quote at booking; also written to SalesOrder.transport_charge_cents."
      - name: status
        type: enum
        source: system
        description: "SCHEDULED <-> DELAYED cycle; SCHEDULED -> EN_ROUTE -> DELIVERED -> SET_COMPLETE; SCHEDULED/DELAYED -> CANCELLED."
        constraints: "one of SCHEDULED, DELAYED, EN_ROUTE, DELIVERED, SET_COMPLETE, CANCELLED"
      - name: buyer_notified_at
        type: datetime
        source: system
        description: "Timestamp of latest buyer delay notification."

  - name: TitleRecord
    parent: null
    common_fields: true
    fields:
      - name: home_unit_id
        type: string
        source: input
        description: "FK -> HomeUnit.id; at most one non-terminal record per unit."
      - name: title_type
        type: enum
        source: input
        description: "MANUFACTURED_CERTIFICATE (chattel) or REAL_PROPERTY_AFFIXED (conversion target)."
        constraints: "one of MANUFACTURED_CERTIFICATE, REAL_PROPERTY_AFFIXED"
      - name: state_code
        type: string
        source: input
        description: "Two-letter state code of titling jurisdiction."
      - name: status
        type: enum
        source: system
        description: "APPLIED -> ISSUED -> CONVERTED | SURRENDERED."
        constraints: "one of APPLIED, ISSUED, CONVERTED, SURRENDERED"

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - name: home_unit_id
        type: string
        source: input
        description: "FK -> HomeUnit.id; unit under claim. Unit must be ON_SITE or INSTALLED."
      - name: sales_order_id
        type: string
        source: input
        description: "FK -> SalesOrder.id; the order that sold the unit (ownership anchor for Customer callers)."
      - name: claim_type
        type: enum
        source: input
        description: "Selects the coverage anchor variant (calc warranty_coverage_window)."
        constraints: "one of FACTORY_DEFECT, TRANSPORT_DAMAGE, INSTALLATION_DAMAGE"
      - name: description
        type: string
        source: input
        description: "Defect description; resubmit replaces it."
      - name: estimated_cost_cents
        type: integer
        source: input
        description: "Claimant's estimated repair cost."
        constraints: "integer >= 0"
      - name: approved_cost_cents
        type: integer
        source: system
        description: "Set at APPROVE; must be <= estimated_cost_cents."
      - name: coverage_window_end
        type: datetime
        source: computed
        description: "Inclusive end of coverage per calc warranty_coverage_window; null for TRANSPORT_DAMAGE (state-gated instead)."
      - name: status
        type: enum
        source: system
        description: "UNDER_REVIEW -> APPROVED | DENIED | INFO_REQUESTED; INFO_REQUESTED -> UNDER_REVIEW and DENIED -> UNDER_REVIEW via resubmit (appeal cycle); APPROVED -> RESOLVED."
        constraints: "one of UNDER_REVIEW, INFO_REQUESTED, APPROVED, DENIED, RESOLVED"
      - name: reviewed_by
        type: string
        source: system
        description: "X-User-ID of the ServiceManager who approved/denied; resolve requires a different user (segregation of duties)."
      - name: resolved_by
        type: string
        source: system
        description: "X-User-ID of the resolving ServiceManager."

  - name: TradeInAppraisal
    parent: null
    common_fields: true
    fields:
      - name: sales_order_id
        type: string
        source: input
        description: "FK -> SalesOrder.id; order receiving the trade credit."
      - name: model_id
        type: string
        source: input
        description: "FK -> HomeModel.id; model of the traded-in home (used to create the trade-in HomeUnit on acceptance)."
      - name: declared_model_year
        type: integer
        source: input
        description: "Customer-declared model year; provisional credit depreciation input."
      - name: declared_condition
        type: enum
        source: input
        description: "Customer-declared condition; provisional credit base input."
        constraints: "one of A, B, C"
      - name: provisional_credit_cents
        type: integer
        source: computed
        description: "calc trade_in_credit provisional variant at creation."
      - name: appraised_value_cents
        type: integer
        source: input
        description: "Appraiser-inspected market value."
        constraints: "integer >= 0"
      - name: reconditioning_cost_cents
        type: integer
        source: input
        description: "Appraiser-estimated reconditioning cost to retail-ready."
        constraints: "integer >= 0"
      - name: condition_grade
        type: enum
        source: input
        description: "Appraiser-confirmed grade."
        constraints: "one of A, B, C"
      - name: final_credit_cents
        type: integer
        source: computed
        description: "calc trade_in_credit final variant: max(0, appraised_value_cents - reconditioning_cost_cents)."
      - name: supersedes_appraisal_id
        type: string
        source: input
        description: "FK -> TradeInAppraisal.id; when set, the referenced appraisal must belong to the same order and be OFFERED; it becomes SUPERSEDED."
      - name: trade_in_unit_id
        type: string
        source: system
        description: "FK -> HomeUnit.id; the used unit created on ACCEPTED."
      - name: status
        type: enum
        source: system
        description: "DRAFT -> INSPECTED -> OFFERED -> ACCEPTED | DECLINED; OFFERED -> SUPERSEDED via counter appraisal; ACCEPTED -> RECONDITIONING -> RETAIL_READY."
        constraints: "one of DRAFT, INSPECTED, OFFERED, ACCEPTED, DECLINED, SUPERSEDED, RECONDITIONING, RETAIL_READY"

  - name: DelayNotice
    parent: null
    common_fields: false
    fields:
      - name: transport_job_id
        type: string
        source: input
        description: "FK -> TransportJob.id; set for transport delays. Exactly one of transport_job_id / sales_order_id must be set (polymorphic subject)."
      - name: sales_order_id
        type: string
        source: input
        description: "FK -> SalesOrder.id; set for order-level buyer communications (e.g., factory delay before booking)."
      - name: reason
        type: enum
        source: input
        description: "Delay cause."
        constraints: "one of WEATHER, PERMIT_HOLD, FACTORY_DELAY, SITE_NOT_READY, ESCORT_UNAVAILABLE"
      - name: original_date
        type: datetime
        source: input
        description: "Previously promised date."
      - name: new_date
        type: datetime
        source: input
        description: "Newly communicated date; must be after original_date."
      - name: buyer_notified
        type: boolean
        source: input
        description: "Whether the buyer was proactively notified."
      - name: delay_days
        type: integer
        source: computed
        description: "Whole days from original_date to new_date (floor of elapsed seconds / 86400)."
      - name: compensation_cents
        type: integer
        source: computed
        description: "calc delay_compensation: 0 when delay_days < 3, else min(75000, (delay_days - 2) * 7500)."

state_machines:
  - entity: SalesOrder
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    note: "deal_status dimension. payment_status is a parallel dimension on the same row, declared as the separate machine below; both evolve independently."
    transitions:
      - from: DRAFT
        to: PENDING_SITE_EVAL
        trigger: "POST /api/sales-orders/{id}/confirm"
        actor: SalesConsultant
        preconditions:
          - "deal_status == DRAFT"
          - "deposit_cents >= round_half_up(0.05 * total_price_cents) (ERR_DEPOSIT_INSUFFICIENT)"
          - "payment_status == UNPAID"
        side_effects:
          - "deposit_cents := request deposit_cents; payment_status := DEPOSIT_PAID"
          - "increments SalesOrder.version by 1"
      - from: PENDING_SITE_EVAL
        to: SITE_APPROVED
        trigger: "system: bubble-up when the order's latest SiteEvaluation becomes APPROVED"
        actor: system
        preconditions:
          - "the approved SiteEvaluation is the order's latest (max created_at) non-SUPERSEDED evaluation"
        side_effects:
          - "increments SalesOrder.version by 1"
      - from: SITE_APPROVED
        to: DRAFT
        trigger: "system: bubble-down when the order's latest SiteEvaluation becomes REJECTED (site reconfiguration loop)"
        actor: system
        preconditions: []
        side_effects:
          - "increments SalesOrder.version by 1"
      - from: SITE_APPROVED
        to: PENDING_FINANCING
        trigger: "system: first FinancingApplication creation for the order"
        actor: system
        preconditions: []
        side_effects:
          - "increments SalesOrder.version by 1"
      - from: PENDING_FINANCING
        to: PENDING_FINANCING
        trigger: "system: superseding FinancingApplication creation (self-loop; prior active application becomes SUPERSEDED)"
        actor: system
        preconditions: []
        side_effects:
          - "increments SalesOrder.version by 1"
      - from: PENDING_FINANCING
        to: FINANCING_APPROVED
        trigger: "system: bubble-up when the order's active FinancingApplication becomes APPROVED"
        actor: system
        preconditions: []
        side_effects:
          - "increments SalesOrder.version by 1"
      - from: FINANCING_APPROVED
        to: AWAITING_DELIVERY
        trigger: "system: bubble-up when the order's active FinancingApplication becomes FUNDED"
        actor: system
        preconditions: []
        side_effects:
          - "payment_status := FINANCED"
          - "increments SalesOrder.version by 1"
      - from: AWAITING_DELIVERY
        to: DELIVERED
        trigger: "system: bubble-up when a TransportJob for the order becomes DELIVERED"
        actor: system
        preconditions: []
        side_effects:
          - "increments SalesOrder.version by 1"
      - from: DELIVERED
        to: SET_COMPLETE
        trigger: "system: bubble-up when a TransportJob for the order becomes SET_COMPLETE"
        actor: system
        preconditions: []
        side_effects:
          - "if a TitleRecord with status ISSUED exists for the order's unit AND financing_type == CHATTEL: deal_status advances immediately to TITLED (chained auto-transition in the same request)"
          - "increments SalesOrder.version by 1"
      - from: SET_COMPLETE
        to: TITLED
        trigger: "system: bubble-up when the unit's TitleRecord becomes ISSUED (CHATTEL) or CONVERTED (REAL_PROPERTY)"
        actor: system
        preconditions: []
        side_effects:
          - "increments SalesOrder.version by 1"
      - from: TITLED
        to: CLOSED
        trigger: "POST /api/sales-orders/{id}/close"
        actor: DealershipAdmin
        preconditions:
          - "deal_status == TITLED"
        side_effects:
          - "increments SalesOrder.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/sales-orders/{id}/cancel"
        actor: SalesConsultant
        preconditions:
          - "payment_status != FINANCED (ERR_ORDER_NOT_CANCELLABLE)"
          - "deal_status not in {TITLED, CLOSED, CANCELLED} (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "CASCADE hop 1 (B): HomeUnit: status RESERVED -> AT_DEALER, sales_order_id cleared (compensation)"
          - "CASCADE hop 1 (B): Lot (when COMMUNITY_LOT): RESERVED -> AVAILABLE (compensation)"
          - "CASCADE hop 1 (B): every TransportJob of the order in {SCHEDULED, DELAYED} -> CANCELLED"
          - "CASCADE hop 2 (C, caused by hop-1 TransportJob cancellation): TransportCrew.booked_dates recomputed with the cancelled job's sections removed from every covered date (capacity restored)"
          - "CASCADE hop 1 (B): every SiteEvaluation in {SCHEDULED, FINDINGS_RECORDED} -> SUPERSEDED; every FinancingApplication in {DRAFT, SUBMITTED, CONDITIONALLY_APPROVED, APPROVED} -> SUPERSEDED"
          - "payment_status: DEPOSIT_PAID -> REFUNDED when deposit_cents > 0"
          - "increments SalesOrder.version by 1"
      - from: PENDING_SITE_EVAL
        to: CANCELLED
        trigger: "POST /api/sales-orders/{id}/cancel"
        actor: SalesConsultant
        preconditions:
          - "payment_status != FINANCED (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "same cascade set as DRAFT -> CANCELLED"
      - from: SITE_APPROVED
        to: CANCELLED
        trigger: "POST /api/sales-orders/{id}/cancel"
        actor: SalesConsultant
        preconditions:
          - "payment_status != FINANCED (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "same cascade set as DRAFT -> CANCELLED"
      - from: PENDING_FINANCING
        to: CANCELLED
        trigger: "POST /api/sales-orders/{id}/cancel"
        actor: SalesConsultant
        preconditions:
          - "payment_status != FINANCED (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "same cascade set as DRAFT -> CANCELLED"
      - from: FINANCING_APPROVED
        to: CANCELLED
        trigger: "POST /api/sales-orders/{id}/cancel"
        actor: SalesConsultant
        preconditions:
          - "payment_status != FINANCED (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "same cascade set as DRAFT -> CANCELLED"
      - from: AWAITING_DELIVERY
        to: CANCELLED
        trigger: "POST /api/sales-orders/{id}/cancel"
        actor: SalesConsultant
        preconditions:
          - "payment_status != FINANCED — in practice unreachable because funding sets FINANCED; retained for symmetry (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "same cascade set as DRAFT -> CANCELLED"

  - entity: SalesOrder
    initial_state: UNPAID
    terminal_states: [REFUNDED]
    note: "payment_status parallel dimension on SalesOrder; independent of deal_status except where transitions note otherwise."
    transitions:
      - from: UNPAID
        to: DEPOSIT_PAID
        trigger: "POST /api/sales-orders/{id}/confirm"
        actor: SalesConsultant
        preconditions:
          - "deposit_cents >= round_half_up(0.05 * total_price_cents)"
        side_effects: []
      - from: DEPOSIT_PAID
        to: FINANCED
        trigger: "system: FinancingApplication FUNDED"
        actor: system
        preconditions: []
        side_effects: []
      - from: DEPOSIT_PAID
        to: REFUNDED
        trigger: "system: order cancellation refund (compensation)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: HomeUnit
    initial_state: AT_DEALER
    terminal_states: [INSTALLED]
    note: "FACTORY_ORDER units enter at AT_FACTORY (creation sets initial per unit_kind). RETAIL_READY -> RESERVED resumes the retail cycle (non-terminal loop)."
    transitions:
      - from: AT_FACTORY
        to: AT_DEALER
        trigger: "POST /api/home-units/{id}/mark-ready"
        actor: DealershipAdmin
        preconditions:
          - "unit_kind == FACTORY_ORDER"
          - "current clock >= created_at + HomeModel.factory_lead_time_days (ERR_PRODUCTION_INCOMPLETE)"
        side_effects:
          - "increments HomeUnit.version by 1"
      - from: AT_DEALER
        to: RESERVED
        trigger: "POST /api/sales-orders (unit attached to new order)"
        actor: SalesConsultant
        preconditions:
          - "no other SalesOrder with deal_status not in {CLOSED, CANCELLED} references this unit (ERR_HOME_UNIT_UNAVAILABLE)"
        side_effects:
          - "sales_order_id := new order id"
      - from: RETAIL_READY
        to: RESERVED
        trigger: "POST /api/sales-orders (resale of a reconditioned trade-in)"
        actor: SalesConsultant
        preconditions:
          - "no other SalesOrder with deal_status not in {CLOSED, CANCELLED} references this unit (ERR_HOME_UNIT_UNAVAILABLE)"
        side_effects:
          - "sales_order_id := new order id"
      - from: RESERVED
        to: AT_DEALER
        trigger: "system: order cancellation compensation"
        actor: system
        preconditions: []
        side_effects:
          - "sales_order_id := null"
      - from: RESERVED
        to: IN_TRANSIT
        trigger: "system: TransportJob dispatch"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_TRANSIT
        to: ON_SITE
        trigger: "system: TransportJob deliver"
        actor: system
        preconditions: []
        side_effects:
          - "delivered_at := current clock (factory-defect warranty anchor)"
          - "lot_id := order's lot_id when placement_type == COMMUNITY_LOT"
      - from: ON_SITE
        to: INSTALLED
        trigger: "system: TransportJob complete-set"
        actor: system
        preconditions: []
        side_effects:
          - "set_completed_at := current clock (installation-damage warranty anchor)"
      - from: AT_DEALER
        to: RECONDITIONING
        trigger: "system: TradeInAppraisal start-reconditioning (TRADE_IN units only)"
        actor: system
        preconditions:
          - "unit_kind == TRADE_IN"
        side_effects: []
      - from: RECONDITIONING
        to: RETAIL_READY
        trigger: "system: TradeInAppraisal complete-reconditioning"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Lot
    initial_state: AVAILABLE
    terminal_states: [LEASED]
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "POST /api/lots/{id}/reserve"
        actor: SalesConsultant
        preconditions:
          - "Community.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "increments Lot.version by 1"
      - from: RESERVED
        to: AVAILABLE
        trigger: "POST /api/lots/{id}/release"
        actor: SalesConsultant
        preconditions:
          - "no SalesOrder with deal_status not in {CLOSED, CANCELLED} references this lot (ERR_INVALID_STATE)"
        side_effects:
          - "increments Lot.version by 1"
      - from: RESERVED
        to: AVAILABLE
        trigger: "system: order cancellation compensation"
        actor: system
        preconditions: []
        side_effects: []
      - from: RESERVED
        to: LEASED
        trigger: "system: TransportJob deliver onto this lot (community placement)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: OrderOption
    initial_state: ACTIVE
    terminal_states: [VOIDED]
    transitions:
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /api/order-options/{id}/void"
        actor: SalesConsultant
        preconditions:
          - "owning SalesOrder.deal_status == DRAFT (ERR_INVALID_STATE)"
        side_effects:
          - "recompute SalesOrder pricing fields (calc order_line_pricing, doc_fee); increments SalesOrder.version by 1"

  - entity: SiteEvaluation
    initial_state: SCHEDULED
    terminal_states: [APPROVED, REJECTED, SUPERSEDED]
    transitions:
      - from: SCHEDULED
        to: FINDINGS_RECORDED
        trigger: "POST /api/site-evaluations/{id}/record-findings"
        actor: SiteEvaluator
        preconditions:
          - "X-User-ID == evaluator_id (ERR_UNAUTHORIZED)"
          - "owning SalesOrder.deal_status == PENDING_SITE_EVAL (ERR_INVALID_STATE)"
        side_effects:
          - "evaluated_by := X-User-ID"
      - from: FINDINGS_RECORDED
        to: APPROVED
        trigger: "POST /api/site-evaluations/{id}/approve"
        actor: InstallationManager
        preconditions:
          - "findings_result in {PASS, CONDITIONAL} (ERR_INVALID_STATE when FAIL)"
        side_effects:
          - "owning SalesOrder: PENDING_SITE_EVAL -> SITE_APPROVED when this is the order's latest non-SUPERSEDED evaluation"
      - from: FINDINGS_RECORDED
        to: REJECTED
        trigger: "POST /api/site-evaluations/{id}/reject"
        actor: InstallationManager
        preconditions: []
        side_effects:
          - "owning SalesOrder: SITE_APPROVED -> DRAFT or PENDING_SITE_EVAL -> DRAFT when this is the order's latest non-SUPERSEDED evaluation (reconfiguration loop)"
      - from: SCHEDULED
        to: SUPERSEDED
        trigger: "system: a newer SiteEvaluation is created for the same SalesOrder"
        actor: system
        preconditions: []
        side_effects: []
      - from: FINDINGS_RECORDED
        to: SUPERSEDED
        trigger: "system: a newer SiteEvaluation is created for the same SalesOrder"
        actor: system
        preconditions: []
        side_effects: []

  - entity: FinancingApplication
    initial_state: DRAFT
    terminal_states: [DENIED, FUNDED, EXPIRED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/financing-applications/{id}/submit"
        actor: SalesConsultant
        preconditions:
          - "financing_type compatible with order placement (REAL_PROPERTY requires PRIVATE_LAND; ERR_FINANCING_TYPE_INCOMPATIBLE)"
          - "term_months <= 240 (CHATTEL) / 360 (REAL_PROPERTY) (ERR_TERM_EXCEEDS_CAP)"
        side_effects:
          - "requested_amount_cents := order.amount_financed_cents; estimated_payment_cents := annuity at type rate floor (calc loan_payment)"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/financing-applications/{id}/decide"
        actor: LenderAgent
        preconditions:
          - "decision == APPROVE"
          - "apr_bps >= 700 (CHATTEL) / 450 (REAL_PROPERTY) (ERR_RATE_BELOW_FLOOR)"
        side_effects:
          - "apr_bps := request apr_bps; monthly_payment_cents := annuity at apr_bps (calc loan_payment)"
          - "rate_lock_expires_at := now + 14 days; decided_by := X-User-ID"
          - "owning SalesOrder: PENDING_FINANCING -> FINANCING_APPROVED"
      - from: SUBMITTED
        to: CONDITIONALLY_APPROVED
        trigger: "POST /api/financing-applications/{id}/decide"
        actor: LenderAgent
        preconditions:
          - "decision == CONDITIONAL"
          - "apr_bps >= type floor (ERR_RATE_BELOW_FLOOR)"
        side_effects:
          - "requested_amount_cents frozen (no longer recomputed by trade-in cascade); decided_by := X-User-ID"
      - from: CONDITIONALLY_APPROVED
        to: APPROVED
        trigger: "POST /api/financing-applications/{id}/decide (conditions satisfied; second decide)"
        actor: LenderAgent
        preconditions:
          - "decision == APPROVE"
        side_effects:
          - "monthly_payment_cents := annuity at apr_bps; rate_lock_expires_at := now + 14 days"
          - "owning SalesOrder: PENDING_FINANCING -> FINANCING_APPROVED"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /api/financing-applications/{id}/decide"
        actor: LenderAgent
        preconditions:
          - "decision == DENY"
        side_effects:
          - "decided_by := X-User-ID"
      - from: APPROVED
        to: FUNDED
        trigger: "POST /api/financing-applications/{id}/fund"
        actor: LenderAgent
        preconditions:
          - "now <= rate_lock_expires_at (ERR_RATE_LOCK_EXPIRED; on breach the application transitions to EXPIRED)"
          - "funded_amount_cents == requested_amount_cents (ERR_FUNDING_AMOUNT_MISMATCH)"
          - "order's HomeUnit.status == RESERVED and HomeUnit.sales_order_id == order.id (ERR_INVALID_STATE)"
          - "TitleRecord gate: an ISSUED TitleRecord for the unit whose title_type matches the financing type (MANUFACTURED_CERTIFICATE for CHATTEL, REAL_PROPERTY_AFFIXED for REAL_PROPERTY) (ERR_INVALID_STATE)"
        side_effects:
          - "owning SalesOrder: FINANCING_APPROVED -> AWAITING_DELIVERY; payment_status -> FINANCED"
      - from: APPROVED
        to: EXPIRED
        trigger: "system: lazy transition when a fund attempt observes now > rate_lock_expires_at"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system: a newer FinancingApplication is created for the same SalesOrder"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system: a newer FinancingApplication is created for the same SalesOrder"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONDITIONALLY_APPROVED
        to: SUPERSEDED
        trigger: "system: a newer FinancingApplication is created for the same SalesOrder"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system: a newer FinancingApplication is created for the same SalesOrder"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TransportJob
    initial_state: SCHEDULED
    terminal_states: [SET_COMPLETE, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DELAYED
        trigger: "POST /api/transport-jobs/{id}/delay"
        actor: TransportCoordinator
        preconditions:
          - "delay_days (new_scheduled_start_date - scheduled_start_date, whole days) > 3 requires buyer_notified == true (ERR_DELAY_NOTIFICATION_REQUIRED)"
          - "new_scheduled_start_date > scheduled_start_date (ERR_VALIDATION)"
        side_effects:
          - "CASCADE hop 1 (B): a DelayNotice is created with transport_job_id set, sales_order_id null, original_date := scheduled_start_date, new_date := new_scheduled_start_date, compensation per calc delay_compensation; buyer_notified_at := now when buyer_notified"
          - "CASCADE hop 2 (C, caused by hop-1 DelayNotice creation): owning SalesOrder.delay_compensation_cents recomputed (sum over linked notices)"
          - "scheduled_start_date := new_scheduled_start_date (capacity re-validated on reschedule, not here)"
      - from: DELAYED
        to: SCHEDULED
        trigger: "POST /api/transport-jobs/{id}/reschedule"
        actor: TransportCoordinator
        preconditions:
          - "new_scheduled_start_date >= current clock date (ERR_SCHEDULE_IN_PAST)"
          - "crew window capacity holds for the new window (calc crew_day_capacity; ERR_CREW_WINDOW_CONFLICT)"
        side_effects:
          - "scheduled_start_date := new_scheduled_start_date"
      - from: SCHEDULED
        to: EN_ROUTE
        trigger: "POST /api/transport-jobs/{id}/dispatch"
        actor: TransportCoordinator
        preconditions:
          - "current clock date within [scheduled_start_date, scheduled_start_date + sections_count days) (ERR_INVALID_STATE)"
        side_effects:
          - "HomeUnit: RESERVED -> IN_TRANSIT"
      - from: EN_ROUTE
        to: DELIVERED
        trigger: "POST /api/transport-jobs/{id}/deliver"
        actor: TransportCoordinator
        preconditions: []
        side_effects:
          - "HomeUnit: IN_TRANSIT -> ON_SITE (sets delivered_at, lot_id)"
          - "Lot (community placement): RESERVED -> LEASED"
          - "owning SalesOrder: AWAITING_DELIVERY -> DELIVERED"
      - from: DELIVERED
        to: SET_COMPLETE
        trigger: "POST /api/transport-jobs/{id}/complete-set"
        actor: InstallationManager
        preconditions:
          - "the order's latest non-SUPERSEDED SiteEvaluation is APPROVED and has non-null permit_number (ERR_PERMIT_MISSING)"
        side_effects:
          - "HomeUnit: ON_SITE -> INSTALLED (sets set_completed_at)"
          - "owning SalesOrder: DELIVERED -> SET_COMPLETE (and immediately TITLED when a qualifying TitleRecord exists)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/transport-jobs/{id}/cancel or system order-cancellation cascade"
        actor: TransportCoordinator
        preconditions: []
        side_effects:
          - "TransportCrew.booked_dates recomputed (capacity restored)"
      - from: DELAYED
        to: CANCELLED
        trigger: "POST /api/transport-jobs/{id}/cancel or system order-cancellation cascade"
        actor: TransportCoordinator
        preconditions: []
        side_effects:
          - "TransportCrew.booked_dates recomputed (capacity restored)"

  - entity: TitleRecord
    initial_state: APPLIED
    terminal_states: [CONVERTED, SURRENDERED]
    transitions:
      - from: APPLIED
        to: ISSUED
        trigger: "POST /api/title-records/{id}/issue"
        actor: DealershipAdmin
        preconditions:
          - "HomeUnit.status in {AT_DEALER, RESERVED, ON_SITE, INSTALLED} (ERR_INVALID_STATE)"
        side_effects:
          - "owning SalesOrder (via unit): SET_COMPLETE -> TITLED when financing_type == CHATTEL"
      - from: ISSUED
        to: CONVERTED
        trigger: "POST /api/title-records/{id}/convert"
        actor: DealershipAdmin
        preconditions:
          - "order financing_type == REAL_PROPERTY (ERR_FINANCING_TYPE_INCOMPATIBLE)"
          - "HomeUnit.status == INSTALLED (ERR_INVALID_STATE)"
        side_effects:
          - "title_type := REAL_PROPERTY_AFFIXED"
          - "owning SalesOrder: SET_COMPLETE -> TITLED"
      - from: ISSUED
        to: SURRENDERED
        trigger: "POST /api/title-records/{id}/surrender"
        actor: DealershipAdmin
        preconditions:
          - "HomeUnit.unit_kind == TRADE_IN (ERR_INVALID_STATE)"
        side_effects: []

  - entity: WarrantyClaim
    initial_state: UNDER_REVIEW
    terminal_states: [RESOLVED]
    transitions:
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /api/warranty-claims/{id}/review"
        actor: ServiceManager
        preconditions:
          - "decision == APPROVE"
          - "approved_cost_cents <= estimated_cost_cents (ERR_CLAIM_AMOUNT_EXCESS)"
        side_effects:
          - "approved_cost_cents := request value; reviewed_by := X-User-ID"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /api/warranty-claims/{id}/review"
        actor: ServiceManager
        preconditions:
          - "decision == DENY"
        side_effects:
          - "reviewed_by := X-User-ID"
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /api/warranty-claims/{id}/review"
        actor: ServiceManager
        preconditions:
          - "decision == REQUEST_INFO"
        side_effects:
          - "reviewed_by := X-User-ID"
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /api/warranty-claims/{id}/resubmit (review loop)"
        actor: Customer
        preconditions:
          - "X-User-ID == sales order's customer_id (ERR_UNAUTHORIZED)"
        side_effects:
          - "description := request description"
      - from: DENIED
        to: UNDER_REVIEW
        trigger: "POST /api/warranty-claims/{id}/resubmit (appeal loop)"
        actor: Customer
        preconditions:
          - "X-User-ID == sales order's customer_id (ERR_UNAUTHORIZED)"
        side_effects:
          - "description := request description"
      - from: APPROVED
        to: RESOLVED
        trigger: "POST /api/warranty-claims/{id}/resolve"
        actor: ServiceManager
        preconditions:
          - "X-User-ID != reviewed_by (segregation of duties; ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "resolved_by := X-User-ID"

  - entity: TradeInAppraisal
    initial_state: DRAFT
    terminal_states: [DECLINED, SUPERSEDED, RETAIL_READY]
    transitions:
      - from: DRAFT
        to: INSPECTED
        trigger: "POST /api/trade-in-appraisals/{id}/inspect"
        actor: Appraiser
        preconditions: []
        side_effects:
          - "final_credit_cents := max(0, appraised_value_cents - reconditioning_cost_cents) (calc trade_in_credit final variant)"
      - from: INSPECTED
        to: OFFERED
        trigger: "POST /api/trade-in-appraisals/{id}/offer"
        actor: Appraiser
        preconditions: []
        side_effects: []
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /api/trade-in-appraisals/{id}/decide"
        actor: Customer
        preconditions:
          - "decision == ACCEPT"
          - "X-User-ID == order's customer_id (ERR_UNAUTHORIZED)"
          - "no FinancingApplication of the order in {CONDITIONALLY_APPROVED, APPROVED, FUNDED} (ERR_INVALID_STATE)"
        side_effects:
          - "CASCADE hop 1 (B): a trade-in HomeUnit is created (unit_kind TRADE_IN, status AT_DEALER, model_id from appraisal, condition_grade from appraisal, system-minted serial_number); trade_in_unit_id := new unit id"
          - "CASCADE hop 1 (B): SalesOrder.trade_in_credit_cents := final_credit_cents; amount_financed_cents recomputed; SalesOrder.version incremented"
          - "CASCADE hop 2 (C, caused by hop-1 order recompute): the order's FinancingApplication in {DRAFT, SUBMITTED} has requested_amount_cents and estimated_payment_cents recomputed (calc loan_payment)"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /api/trade-in-appraisals/{id}/decide"
        actor: Customer
        preconditions:
          - "decision == DECLINE"
          - "X-User-ID == order's customer_id (ERR_UNAUTHORIZED)"
        side_effects: []
      - from: OFFERED
        to: SUPERSEDED
        trigger: "system: a counter-appraisal is created referencing this appraisal via supersedes_appraisal_id"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: RECONDITIONING
        trigger: "POST /api/trade-in-appraisals/{id}/start-reconditioning"
        actor: Appraiser
        preconditions: []
        side_effects:
          - "trade-in HomeUnit: AT_DEALER -> RECONDITIONING"
      - from: RECONDITIONING
        to: RETAIL_READY
        trigger: "POST /api/trade-in-appraisals/{id}/complete-reconditioning"
        actor: Appraiser
        preconditions: []
        side_effects:
          - "trade-in HomeUnit: RECONDITIONING -> RETAIL_READY (eligible for resale via a new SalesOrder)"

concurrency_rules:
  - rule_id: financing-create-stale-order
    parent_entity: SalesOrder
    write_endpoint: "POST /api/sales-orders/{id}/financing-applications"
    occ_field: expected_sales_order_version
    description: |
      Creating a FinancingApplication against a SalesOrder whose version has
      advanced since the client last observed it is rejected. A new application
      legitimately supersedes the order's prior active application under the
      FinancingApplication machine, so a stale view would silently supersede
      the wrong baseline; OCC on SalesOrder.version rejects the stale writer.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: evaluation-create-stale-order
    parent_entity: SalesOrder
    write_endpoint: "POST /api/sales-orders/{id}/site-evaluations"
    occ_field: expected_sales_order_version
    description: |
      Creating a SiteEvaluation against a SalesOrder whose version has
      advanced since the client last observed it is rejected. A new evaluation
      legitimately supersedes the order's prior non-terminal evaluations, so a
      stale view would supersede the wrong baseline; OCC on SalesOrder.version
      rejects the stale writer.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: order_line_pricing
    trigger: "on SalesOrder create, on OrderOption add, on OrderOption void"
    algorithm: tiered_pricing
    formula: |
      lines = [home_line(agreed_home_price_cents)] + [opt.line_total_cents for ACTIVE OrderOptions]
      line_total(opt) = opt.unit_price_cents * opt.quantity            # exact integer cents
      subtotal = sum(all line totals)
      tier: subtotal >= 10000000 -> 3% | subtotal >= 5000000 -> 1.5% | else 0%
      # ROUNDING ORDER PINNED (mode b): discount is computed PER LINE, each line
      # rounded half-up to whole cents, then summed. Computing the discount on the
      # whole subtotal instead is the forbidden variant (diverges by cents).
      discount_cents = sum over lines of round_half_up(line_total * tier_rate)
      discounted_subtotal = subtotal - discount_cents
      options_total_cents = sum of ACTIVE option line totals
    input_set: "the order plus its OrderOptions with status == ACTIVE only (VOIDED excluded)"
    constants:
      TIER1_MIN_CENTS: 5000000
      TIER1_RATE: 0.015
      TIER2_MIN_CENTS: 10000000
      TIER2_RATE: 0.03
    precision: "integer cents; round_half_up applied per line before summation"

  - name: doc_fee
    trigger: "immediately after order_line_pricing on any pricing mutation"
    algorithm: constraint_propagation
    formula: |
      # EVALUATION ORDER PINNED (mode c): doc_fee is conventionally quoted as
      # "1% of the amount financed", which is circular (amount_financed depends
      # on total_price which includes doc_fee). The pinned order breaks the
      # circle: fee base is (subtotal - discount_cents), NOT the final total.
      doc_fee_cents = clamp(round_half_up(0.01 * (subtotal - discount_cents)), 25000, 75000)
      total_price_cents = subtotal - discount_cents + doc_fee_cents
      amount_financed_cents = max(0, total_price_cents - deposit_cents - trade_in_credit_cents)
    input_set: "the SalesOrder row after order_line_pricing has run"
    constants:
      FEE_RATE: 0.01
      FEE_MIN_CENTS: 25000
      FEE_MAX_CENTS: 75000
    precision: "integer cents, round_half_up"

  - name: transport_quote
    trigger: "on TransportJob creation"
    algorithm: tiered_pricing
    formula: |
      # mode (a): >=3 inputs with non-linear interaction (conditional branches on
      # model width / section_count, max() overage tier, weekend branch on date).
      base = sections_count * distance_miles * PER_MILE_PER_SECTION_CENTS
      escort = escort_vehicle_count * distance_miles * ESCORT_PER_MILE_CENTS   # only when escort_required
      multiwide = MULTIWIDE_FLAT_CENTS if sections_count >= 2 else 0
      overage = max(0, distance_miles - FREE_MILES) * OVERAGE_PER_MILE_CENTS
      weekend = WEEKEND_FLAT_CENTS if weekday(scheduled_start_date) in {Sat, Sun} else 0
      quoted_cost_cents = base + escort + multiwide + overage + weekend
    input_set: "the new TransportJob plus its HomeUnit's HomeModel (width_ft, section_count)"
    constants:
      PER_MILE_PER_SECTION_CENTS: 250
      ESCORT_PER_MILE_CENTS: 150
      MULTIWIDE_FLAT_CENTS: 150000
      FREE_MILES: 100
      OVERAGE_PER_MILE_CENTS: 90
      WEEKEND_FLAT_CENTS: 50000
    precision: "integer cents (all terms exact)"

  - name: escort_requirement
    trigger: "on TransportJob creation (validation) and stored as escort_required"
    algorithm: threshold
    formula: |
      # BOUNDARY PINNED: >= comparisons; width exactly 14.0 requires 1 escort.
      required = 0 if width_ft < 14.0
                 1 if 14.0 <= width_ft < 16.0
                 2 if width_ft >= 16.0
      escort_required = required > 0
      booking valid iff escort_vehicle_count >= required  (ERR_ESCORT_REQUIRED)
    input_set: "HomeModel of the job's unit"
    constants:
      ESCORT_WIDTH_THRESHOLD_1: 14.0
      ESCORT_WIDTH_THRESHOLD_2: 16.0
    precision: "width compared exactly at one decimal place"

  - name: loan_payment
    trigger: "on FinancingApplication submit (estimated, floor rate) and decide-APPROVE (monthly, approved rate); recomputed by trade-in cascade while DRAFT/SUBMITTED"
    algorithm: forward_looking
    formula: |
      # evaluation order pinned: requested_amount derives from amount_financed,
      # which calc doc_fee has already fixed before this calculation runs.
      requested_amount_cents = order.amount_financed_cents
      i = apr_bps / 10000 / 12
      payment = round_half_up(requested_amount_cents * i / (1 - (1 + i)^(-term_months)))
    input_set: "the FinancingApplication plus its SalesOrder pricing fields"
    constants:
      CHATTEL_RATE_FLOOR_BPS: 700
      CHATTEL_TERM_CAP_MONTHS: 240
      REAL_PROPERTY_RATE_FLOOR_BPS: 450
      REAL_PROPERTY_TERM_CAP_MONTHS: 360
    precision: "integer cents, round_half_up"
    variants:
      - name: chattel
        when: "financing_type == CHATTEL (home-only loan on leased or private land)"
        difference: "rate floor 700 bps, term cap 240 months"
      - name: real_property
        when: "financing_type == REAL_PROPERTY (mortgage; requires PRIVATE_LAND placement and title conversion)"
        difference: "rate floor 450 bps, term cap 360 months; same principal and term yield a strictly lower payment than chattel"

  - name: trade_in_credit
    trigger: "provisional variant on TradeInAppraisal creation; final variant on inspect"
    algorithm: decay_function
    formula: |
      # provisional (declaration-based, pre-inspection):
      age_years = max(0, clock_year - declared_model_year - DEPRECIATION_GRACE_YEARS)
      provisional_credit_cents = max(FLOOR_CENTS, round_half_up(BASE[declared_condition] * (1 - DEPRECIATION_PER_YEAR * age_years)))
      # final (post-inspection):
      final_credit_cents = max(0, appraised_value_cents - reconditioning_cost_cents)
    input_set: "the TradeInAppraisal row; provisional uses declared_* fields, final uses inspected fields"
    constants:
      BASE_A_CENTS: 1800000
      BASE_B_CENTS: 1200000
      BASE_C_CENTS: 600000
      DEPRECIATION_PER_YEAR: 0.03
      DEPRECIATION_GRACE_YEARS: 10
      FLOOR_CENTS: 200000
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "at creation, before physical inspection"
        difference: "formula-driven from declared year/condition and the logical clock; takes no notice of appraised_value_cents"
      - name: final
        when: "after inspect"
        difference: "appraised minus reconditioning, floored at zero; generally diverges from provisional"

  - name: warranty_coverage_window
    trigger: "on WarrantyClaim creation"
    algorithm: projection
    formula: |
      # anchor variant selected by claim_type; reported_at <= window end is INCLUSIVE.
      FACTORY_DEFECT:      window = [HomeUnit.delivered_at, delivered_at + 365 days]
      INSTALLATION_DAMAGE: window = [HomeUnit.set_completed_at, set_completed_at + 90 days]
      TRANSPORT_DAMAGE:    no window; reportable only while HomeUnit.status in {IN_TRANSIT, ON_SITE}
      claim in coverage iff now <= window end (else ERR_WARRANTY_EXPIRED)
    input_set: "the HomeUnit's delivered_at / set_completed_at and the logical clock"
    constants:
      FACTORY_COVERAGE_DAYS: 365
      INSTALL_COVERAGE_DAYS: 90
    precision: "inclusive datetime comparison at second precision"
    variants:
      - name: delivery_anchored
        when: "claim_type == FACTORY_DEFECT"
        difference: "365 days from delivery"
      - name: install_anchored
        when: "claim_type == INSTALLATION_DAMAGE"
        difference: "90 days from set completion; a later set date can make an installation claim valid while a factory claim on the same dates would be expired, and vice versa"

  - name: delay_compensation
    trigger: "on DelayNotice creation; SalesOrder.delay_compensation_cents recomputed as the sum over linked notices"
    algorithm: threshold
    formula: |
      delay_days = floor((new_date - original_date) / 86400)   # whole days
      compensation_cents = 0 if delay_days < 3
                           else min(CAP_CENTS, (delay_days - 2) * PER_DIEM_CENTS)
    input_set: "the new DelayNotice; the order aggregate sums all notices linked directly or via its TransportJobs"
    constants:
      GRACE_DAYS: 2
      PER_DIEM_CENTS: 7500
      CAP_CENTS: 75000
    precision: "integer cents; threshold at delay_days >= 3 (>=, not >)"

  - name: crew_day_capacity
    trigger: "on TransportJob create, reschedule, cancel; TransportCrew.booked_dates recomputed"
    algorithm: aggregation
    formula: |
      window(job) = [scheduled_start_date, scheduled_start_date + sections_count days)   # half-open
      active statuses consuming capacity: {SCHEDULED, DELAYED, EN_ROUTE}
      for each calendar date d in window(new_job):
        load(d) = sum of sections_count over the crew's active jobs covering d (excluding new job)
        reject if load(d) + new_job.sections_count > max_sections_per_window  (ERR_CREW_WINDOW_CONFLICT)
      # adjacency is allowed: a job ending on date X and another starting on date X
      # do not overlap (half-open semantics).
    input_set: "the crew's TransportJobs in {SCHEDULED, DELAYED, EN_ROUTE}"
    precision: "whole calendar dates; half-open interval arithmetic"

  - name: lot_fit
    trigger: "on SalesOrder creation with placement_type == COMMUNITY_LOT"
    algorithm: threshold
    formula: |
      # equality allowed on both dimensions (<= semantics).
      fits = (model.section_count <= lot.max_sections) and (model.length_ft <= lot.max_length_ft)
      reject when not fits (ERR_LOT_DIMENSION_INSUFFICIENT)
    input_set: "the order's HomeModel and Lot"
    precision: "exact numeric comparison; equality passes"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role name"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Ownership: Customer callers may act only on resources whose SalesOrder.customer_id == X-User-ID (warranty create/resubmit, trade-in decide); SiteEvaluator may record findings only when X-User-ID == evaluator_id"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "POST /api/warranty-claims, POST /api/warranty-claims/{id}/resubmit, POST /api/trade-in-appraisals/{id}/decide, POST /api/site-evaluations/{id}/record-findings"
  - priority: 4
    category: existence
    check: "Path template ids resolve, validated left-to-right; missing resource yields that entity's not-found error"
    error_id: ERR_SALES_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids (per-entity: ERR_HOME_MODEL_NOT_FOUND, ERR_COMMUNITY_NOT_FOUND, ERR_LOT_NOT_FOUND, ERR_CUSTOMER_NOT_FOUND, ERR_HOME_UNIT_NOT_FOUND, ERR_SALES_ORDER_NOT_FOUND, ERR_ORDER_OPTION_NOT_FOUND, ERR_SITE_EVALUATION_NOT_FOUND, ERR_FINANCING_APPLICATION_NOT_FOUND, ERR_TRANSPORT_CREW_NOT_FOUND, ERR_TRANSPORT_JOB_NOT_FOUND, ERR_TITLE_RECORD_NOT_FOUND, ERR_WARRANTY_CLAIM_NOT_FOUND, ERR_TRADE_IN_APPRAISAL_NOT_FOUND)"
  - priority: 5
    category: existence
    check: "Body foreign keys reference existing resources (customer_id, home_unit_id, lot_id, model_id, crew_id, sales_order_id, supersedes_appraisal_id)"
    error_id: ERR_HOME_UNIT_NOT_FOUND
    http_status: 404
    applies_to: "all create/action endpoints with body FKs (per-entity not-found error of the referenced type)"
  - priority: 6
    category: state
    check: "OCC: expected_sales_order_version equals the order's current version (checked after existence, before state preconditions)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/sales-orders/{id}/site-evaluations, POST /api/sales-orders/{id}/financing-applications"
  - priority: 7
    category: state
    check: "State-machine precondition: the target resource is in a state from which the requested transition exists (covers idempotent re-fires and terminal lockdown)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints (confirm, cancel, record-findings, approve, reject, submit, decide, fund, mark-ready, dispatch, delay, reschedule, deliver, complete-set, transport cancel, title issue/convert/surrender, warranty review/resubmit/resolve, trade-in inspect/offer/decide/start-reconditioning/complete-reconditioning, close, lot reserve/release)"
  - priority: 8
    category: state
    check: "Cancellation guard: order cannot be cancelled from TITLED/CLOSED/CANCELLED, nor while payment_status == FINANCED"
    error_id: ERR_ORDER_NOT_CANCELLABLE
    http_status: 409
    applies_to: "POST /api/sales-orders/{id}/cancel"
  - priority: 9
    category: business_safety
    check: "Escort compliance: escort_vehicle_count >= required count per calc escort_requirement (width >= 14.0 -> 1; >= 16.0 -> 2)"
    error_id: ERR_ESCORT_REQUIRED
    http_status: 422
    applies_to: "POST /api/sales-orders/{id}/transport-jobs"
  - priority: 10
    category: business_safety
    check: "Set permit: the order's latest non-SUPERSEDED SiteEvaluation is APPROVED and carries a non-null permit_number before set completion"
    error_id: ERR_PERMIT_MISSING
    http_status: 422
    applies_to: "POST /api/transport-jobs/{id}/complete-set"
  - priority: 11
    category: business_constraint
    check: "Lot fit (calc lot_fit): model.section_count <= lot.max_sections AND model.length_ft <= lot.max_length_ft"
    error_id: ERR_LOT_DIMENSION_INSUFFICIENT
    http_status: 422
    applies_to: "POST /api/sales-orders"
  - priority: 12
    category: business_constraint
    check: "Lot availability: lot.status == RESERVED for order create; lot.status == AVAILABLE for reserve"
    error_id: ERR_LOT_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /api/sales-orders, POST /api/lots/{id}/reserve"
  - priority: 13
    category: business_constraint
    check: "Unit availability: unit.status in {AT_DEALER, RETAIL_READY} and no other non-terminal SalesOrder references it"
    error_id: ERR_HOME_UNIT_UNAVAILABLE
    http_status: 409
    applies_to: "POST /api/sales-orders"
  - priority: 14
    category: business_constraint
    check: "Crew capability: crew.can_set_multiwide must be true when the job's sections_count >= 2"
    error_id: ERR_CREW_CAPABILITY_INSUFFICIENT
    http_status: 422
    applies_to: "POST /api/sales-orders/{id}/transport-jobs"
  - priority: 15
    category: business_constraint
    check: "Crew window capacity (calc crew_day_capacity): no date of the new window exceeds crew.max_sections_per_window"
    error_id: ERR_CREW_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /api/sales-orders/{id}/transport-jobs, POST /api/transport-jobs/{id}/reschedule"
  - priority: 16
    category: business_constraint
    check: "Evaluator capacity: the assigned evaluator holds at most 3 SiteEvaluations per calendar date (status in {SCHEDULED, FINDINGS_RECORDED}); the 4th on the same date is rejected"
    error_id: ERR_EVALUATOR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /api/sales-orders/{id}/site-evaluations"
  - priority: 17
    category: business_constraint
    check: "Single open title record per unit (status in {APPLIED, ISSUED})"
    error_id: ERR_TITLE_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /api/home-units/{id}/title-records"
  - priority: 18
    category: business_constraint
    check: "Uniqueness: HomeUnit.serial_number, Customer.email, HomeModel.model_code (non-DISCONTINUED), Lot.lot_number within its community"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /api/home-units, POST /api/customers, POST /api/home-models, POST /api/communities/{id}/lots"
  - priority: 19
    category: business_constraint
    check: "Segregation of duties: warranty resolve user must differ from the claim's reviewed_by"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /api/warranty-claims/{id}/resolve"
  - priority: 20
    category: business_constraint
    check: "Rate floor: apr_bps >= 700 (CHATTEL) / 450 (REAL_PROPERTY) on decide"
    error_id: ERR_RATE_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /api/financing-applications/{id}/decide"
  - priority: 21
    category: business_constraint
    check: "Term cap: term_months <= 240 (CHATTEL) / 360 (REAL_PROPERTY)"
    error_id: ERR_TERM_EXCEEDS_CAP
    http_status: 422
    applies_to: "POST /api/sales-orders/{id}/financing-applications, POST /api/financing-applications/{id}/submit"
  - priority: 22
    category: business_temporal
    check: "Scheduled dates must not precede the current clock date (site evaluations, transport bookings, reschedules)"
    error_id: ERR_SCHEDULE_IN_PAST
    http_status: 422
    applies_to: "POST /api/sales-orders/{id}/site-evaluations, POST /api/sales-orders/{id}/transport-jobs, POST /api/transport-jobs/{id}/reschedule"
  - priority: 23
    category: business_temporal
    check: "Production lead time: FACTORY_ORDER unit mark-ready requires clock >= created_at + model.factory_lead_time_days"
    error_id: ERR_PRODUCTION_INCOMPLETE
    http_status: 409
    applies_to: "POST /api/home-units/{id}/mark-ready"
  - priority: 24
    category: business_temporal
    check: "Rate lock: fund requires now <= rate_lock_expires_at; on breach the application transitions to EXPIRED"
    error_id: ERR_RATE_LOCK_EXPIRED
    http_status: 409
    applies_to: "POST /api/financing-applications/{id}/fund"
  - priority: 25
    category: business_temporal
    check: "Warranty coverage (calc warranty_coverage_window): now <= coverage_window_end (inclusive); TRANSPORT_DAMAGE additionally requires unit status in {IN_TRANSIT, ON_SITE}"
    error_id: ERR_WARRANTY_EXPIRED
    http_status: 422
    applies_to: "POST /api/warranty-claims"
  - priority: 26
    category: business_temporal
    check: "Delay notification: transport delay with delay_days > 3 requires buyer_notified == true"
    error_id: ERR_DELAY_NOTIFICATION_REQUIRED
    http_status: 422
    applies_to: "POST /api/transport-jobs/{id}/delay"
  - priority: 27
    category: business_referential
    check: "Placement coherence: COMMUNITY_LOT requires lot_id; PRIVATE_LAND forbids lot_id"
    error_id: ERR_PLACEMENT_MISMATCH
    http_status: 422
    applies_to: "POST /api/sales-orders"
  - priority: 28
    category: business_referential
    check: "Financing type coherence: REAL_PROPERTY requires placement_type == PRIVATE_LAND (leased community land cannot be mortgaged); application type must equal order type"
    error_id: ERR_FINANCING_TYPE_INCOMPATIBLE
    http_status: 422
    applies_to: "POST /api/sales-orders, POST /api/financing-applications/{id}/submit, POST /api/title-records/{id}/convert"
  - priority: 29
    category: business_referential
    check: "Transport unit coherence: TransportJob.home_unit_id must equal the order's home_unit_id"
    error_id: ERR_UNIT_ORDER_MISMATCH
    http_status: 422
    applies_to: "POST /api/sales-orders/{id}/transport-jobs"
  - priority: 30
    category: business_fiscal
    check: "Deposit sufficiency: deposit_cents >= round_half_up(0.05 * total_price_cents) at confirm"
    error_id: ERR_DEPOSIT_INSUFFICIENT
    http_status: 422
    applies_to: "POST /api/sales-orders/{id}/confirm"
  - priority: 31
    category: business_fiscal
    check: "Funding amount: funded_amount_cents == requested_amount_cents"
    error_id: ERR_FUNDING_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /api/financing-applications/{id}/fund"
  - priority: 32
    category: business_fiscal
    check: "Claim approval cap: approved_cost_cents <= estimated_cost_cents"
    error_id: ERR_CLAIM_AMOUNT_EXCESS
    http_status: 422
    applies_to: "POST /api/warranty-claims/{id}/review"
  - priority: 33
    category: business_constraint
    check: "Field shape: required fields present, enums in range, numeric ranges honored; DelayNotice requires exactly one of transport_job_id / sales_order_id"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"

endpoints:
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Test-driving logical clock. Startup default (before any set call) is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time. All date comparisons (lead times, rate locks, warranty windows, schedules) read this clock."
    roles: [DealershipAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []

  - method: POST
    path: "/api/home-models"
    description: "Register a factory model in the catalog."
    roles: [DealershipAdmin]
    code: 201
    input: [model_code, name, floor_plan_type, section_count, width_ft, length_ft, base_price_cents, factory_lead_time_days]
    output: HomeModel
    side_effects: []
  - method: GET
    path: "/api/home-models"
    description: "List models with optional filters and pagination."
    roles: [DealershipAdmin, SalesConsultant, Customer, SiteEvaluator, InstallationManager, TransportCoordinator, LenderAgent, ServiceManager, Appraiser]
    code: 200
    input: ["status?", "floor_plan_type?", "limit?", "offset?"]
    output: HomeModel[]
    side_effects: []
  - method: GET
    path: "/api/home-models/{id}"
    description: "Fetch one model."
    roles: [DealershipAdmin, SalesConsultant, Customer, SiteEvaluator, InstallationManager, TransportCoordinator, LenderAgent, ServiceManager, Appraiser]
    code: 200
    input: []
    output: HomeModel
    side_effects: []

  - method: POST
    path: "/api/communities"
    description: "Register a land-lease community."
    roles: [DealershipAdmin]
    code: 201
    input: [name, address, lot_rent_cents]
    output: Community
    side_effects: []
  - method: GET
    path: "/api/communities/{id}"
    description: "Fetch one community."
    roles: [DealershipAdmin, SalesConsultant, Customer, SiteEvaluator, InstallationManager, TransportCoordinator, LenderAgent, ServiceManager, Appraiser]
    code: 200
    input: []
    output: Community
    side_effects: []
  - method: POST
    path: "/api/communities/{id}/lots"
    description: "Add a lot to a community."
    roles: [DealershipAdmin]
    code: 201
    input: [lot_number, max_sections, max_length_ft, utilities_ready]
    output: Lot
    side_effects: []
  - method: GET
    path: "/api/communities/{id}/lots"
    description: "List a community's lots (FK reverse reachability for Lot.community_id)."
    roles: [DealershipAdmin, SalesConsultant, Customer, SiteEvaluator, InstallationManager, TransportCoordinator, LenderAgent, ServiceManager, Appraiser]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Lot[]
    side_effects: []
  - method: GET
    path: "/api/lots/{id}"
    description: "Fetch one lot."
    roles: [DealershipAdmin, SalesConsultant, Customer, SiteEvaluator, InstallationManager, TransportCoordinator, LenderAgent, ServiceManager, Appraiser]
    code: 200
