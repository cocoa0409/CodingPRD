# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Car Wash Unlimited Membership API. Grounds resolve into SCAFFOLD.yaml §1.1–§1.7.
# 9 rule_ids x >=2 instances. All literals pre-computed; all ${var} bound by an
# earlier captures: on the same instance; all calls resolve to §1.5.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: cancellation_refund_unlimited_unused_value
        grounds:
          - calculations.cancellation_refund
          - state_machines.Membership.ACTIVE_to_CANCEL_SCHEDULED
          - entities.Membership.fields.current_cycle_paid_cents
        distinguishing_aspect: "UNLIMITED tier uses the forward-looking unused_value variant: refund = round_half_up(3000 * 19/30) = 1900, ignoring washes taken — a different formula (time proration) than the SINGLE_WASH consumed_value variant of the same calc which subtracts per-wash value."
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z. INDIVIDUAL account, one vehicle, UNLIMITED plan monthly_fee_cents=3000, active membership whose first CYCLE invoice (total 3000) is PAID so current_cycle_paid_cents=3000."
            - "Clock advanced to 2026-06-12T00:00:00Z (11 days elapsed, 19 remaining in the 30-day cycle)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { name: "Unlimited Shine", tier_type: "UNLIMITED", monthly_fee_cents: 3000, included_credits: 0, wash_cooldown_hours: 12, max_addons: 3 }
              as: PlatformAdmin
              captures: { plan_u: "$.data.id"}
            - call: "POST /accounts"
              payload: { account_type: "INDIVIDUAL", contact_email: "a@x.com" }
              as: AccountHolder
              captures: { acct: "$.data.id"}
            - call: "POST /accounts/${acct}/vehicles"
              payload: { license_plate: "ABC123", state_code: "CA" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { veh: "$.data.id"}
            - call: "POST /memberships"
              payload: { account_id: "${acct}", vehicle_id: "${veh}", plan_id: "${plan_u}" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { mem: "$.data.id"}
            - call: "GET /invoices"
              payload: { membership_id: "${mem}", kind: "CYCLE" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { inv0: "$.data[0].id"}
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-12T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /memberships/${mem}/cancel"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct}"
          assert:
            - "Membership.${mem}.status == CANCEL_SCHEDULED"
            - "Account.${acct}.wallet_balance_cents == 1900"
            - "A WalletTransaction with reason==CANCEL_REFUND and amount_cents==1900 exists for account ${acct}"

      - name: usage_intensity_chronic_vs_acute_on_vehicle
        grounds:
          - calculations.vehicle_usage_intensity
          - entities.Vehicle.fields.id
          - state_machines.WashEvent.REQUESTED_to_ADMITTED
        distinguishing_aspect: "Same WashEvent set yields chronic_intensity (lifetime / active_months) but a strictly smaller acute_intensity (last-7-day count); the dual variant lives on the Vehicle domain, not the Membership/billing domain of the other dual_variant_calc instance."
        test_recipe:
          setup:
            - "Vehicle created at clock 2026-02-01; clock advanced to 2026-05-29. The vehicle's membership is SINGLE_WASH with ample credits; two admitted washes exist, one on 2026-04-15 (outside the 7-day window) and one on 2026-05-29 (inside it)."
            - "We assert the GET /vehicles/{id}/usage-intensity computed read returns acute strictly less than chronic on identical wash data; abuse gating constants ACUTE_CAP=8, CHRONIC_CAP=12.0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { name: "PayGo", tier_type: "SINGLE_WASH", monthly_fee_cents: 0, included_credits: 50, per_credit_price_cents: 1200, wash_cooldown_hours: 0, max_addons: 0 }
              as: PlatformAdmin
              captures: { plan_s: "$.data.id"}
            - call: "POST /locations"
              payload: { name: "Site1", state_code: "CA", daily_wash_capacity: 100, in_network: true }
              as: PlatformAdmin
              captures: { loc: "$.data.id"}
            - call: "POST /accounts"
              payload: { account_type: "INDIVIDUAL", contact_email: "b@x.com" }
              as: AccountHolder
              captures: { acct: "$.data.id"}
            - call: "POST /accounts/${acct}/vehicles"
              payload: { license_plate: "USE040", state_code: "CA" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { veh: "$.data.id"}
            - call: "POST /memberships"
              payload: { account_id: "${acct}", vehicle_id: "${veh}", plan_id: "${plan_s}" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { mem: "$.data.id"}
            - call: "GET /invoices"
              payload: { membership_id: "${mem}", kind: "CYCLE" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { inv0: "$.data[0].id"}
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wash-events"
              payload: { location_id: "${loc}", license_plate: "USE040", state_code: "CA" }
              as: LocationOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-29T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wash-events"
              payload: { location_id: "${loc}", license_plate: "USE040", state_code: "CA" }
              as: LocationOperator
          trigger:
            - call: "GET /vehicles/${veh}/usage-intensity"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Both washes count toward chronic_intensity (denominator = active_months over the vehicle's whole life) while only the 2026-05-29 wash falls in the trailing 7-day acute window, so acute_intensity == 1 is strictly less than chronic_intensity, proving the two variants diverge on identical data."

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: invoice_cycle_total_fleet_tiered_discount
        grounds:
          - calculations.invoice_cycle_total
          - entities.Account.fields.fleet_discount_pct
          - entities.MembershipAddOn.fields.locked_fee_cents
          - state_machines.Invoice.DRAFT_to_ISSUED
        distinguishing_aspect: "Mode (a): >=3 inputs (base_fee 3000, addon 500, fleet tier keyed on active_vehicle_count) with non-linear tier selection AND a conditional branch on account_type; FLEET with 2 active vehicles selects 5% -> discount=round_half_up(3500*0.05)=175 -> total_cents=3325."
        test_recipe:
          setup:
            - "Clock 2026-06-01. FLEET account with two vehicles, each in an ACTIVE UNLIMITED(3000) membership; membership #1 has one ACTIVE add-on (locked_fee_cents=500). active_vehicle_count=2 -> fleet_discount_pct=0.05."
            - "Clock advanced to 2026-07-01 (a full 30-day cycle elapsed) and POST /billing/run issues a fresh CYCLE invoice for membership #1 reflecting the fleet discount."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { name: "Fleet Unlimited", tier_type: "UNLIMITED", monthly_fee_cents: 3000, included_credits: 0, wash_cooldown_hours: 6, max_addons: 3 }
              as: PlatformAdmin
              captures: { plan_u: "$.data.id"}
            - call: "POST /addons"
              payload: { name: "TIRE_SHINE", recurring_fee_cents: 500 }
              as: PlatformAdmin
              captures: { addon_t: "$.data.id"}
            - call: "POST /accounts"
              payload: { account_type: "FLEET", contact_email: "fleet@x.com", company_name: "Acme Fleet" }
              as: PlatformAdmin
              captures: { acct: "$.data.id"}
            - call: "POST /accounts/${acct}/vehicles"
              payload: { license_plate: "FLT001", state_code: "TX" }
              as: PlatformAdmin
              captures: { veh1: "$.data.id"}
            - call: "POST /accounts/${acct}/vehicles"
              payload: { license_plate: "FLT002", state_code: "TX" }
              as: PlatformAdmin
              captures: { veh2: "$.data.id"}
            - call: "POST /memberships"
              payload: { account_id: "${acct}", vehicle_id: "${veh1}", plan_id: "${plan_u}" }
              as: PlatformAdmin
              captures: { mem1: "$.data.id"}
            - call: "GET /invoices"
              payload: { membership_id: "${mem1}", kind: "CYCLE" }
              as: PlatformAdmin
              captures: { inv1: "$.data[0].id"}
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv1}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /memberships"
              payload: { account_id: "${acct}", vehicle_id: "${veh2}", plan_id: "${plan_u}" }
              as: PlatformAdmin
              captures: { mem2: "$.data.id"}
            - call: "GET /invoices"
              payload: { membership_id: "${mem2}", kind: "CYCLE" }
              as: PlatformAdmin
              captures: { inv2: "$.data[0].id"}
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv2}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "GET /memberships/${mem1}"
              payload: {}
              as: PlatformAdmin
              captures: { mem1_v: "$.data.version"}
            - call: "POST /memberships/${mem1}/addons"
              payload: { addon_id: "${addon_t}", expected_membership_version: "${mem1_v}" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /billing/run"
              payload: { membership_id: "${mem1}" }
              as: BillingAdmin
              captures: { new_inv: "$.data[0].id"}
          assert:
            - "Account.${acct}.fleet_discount_pct == 0.05"
            - "Invoice.${new_inv}.base_fee_cents == 3000"
            - "Invoice.${new_inv}.addon_fee_cents == 500"
            - "Invoice.${new_inv}.discount_cents == 175"
            - "Invoice.${new_inv}.total_cents == 3325"

      - name: proration_round_per_line_then_sum
        grounds:
          - calculations.proration_on_plan_change
          - state_machines.Invoice.DRAFT_to_ISSUED
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: "Mode (b): nested rounding where order matters — plan-delta line (2500) and one added add-on line (2500) each prorated 7/30 and round_half_up PER LINE = 583+583 = 1166, whereas sum-then-round would give 1167; the scaffold pins per-line-then-sum so 1166 is correct."
        test_recipe:
          setup:
            - "Clock 2026-06-01. INDIVIDUAL account, ACTIVE membership on a cheap UNLIMITED plan (monthly_fee_cents=1000). An AddOn with recurring_fee_cents=2500 exists. cycle_anchor at 2026-06-01."
            - "Clock advanced to 2026-06-24 (23 days elapsed, remaining_days=7). change-plan to an UNLIMITED plan with monthly_fee_cents=3500 (delta 2500) AND add the 2500 add-on in the same call."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { name: "Basic", tier_type: "UNLIMITED", monthly_fee_cents: 1000, included_credits: 0, wash_cooldown_hours: 0, max_addons: 3 }
              as: PlatformAdmin
              captures: { plan_lo: "$.data.id"}
            - call: "POST /plans"
              payload: { name: "Premium", tier_type: "UNLIMITED", monthly_fee_cents: 3500, included_credits: 0, wash_cooldown_hours: 0, max_addons: 3 }
              as: PlatformAdmin
              captures: { plan_hi: "$.data.id"}
            - call: "POST /addons"
              payload: { name: "WAX", recurring_fee_cents: 2500 }
              as: PlatformAdmin
              captures: { addon_w: "$.data.id"}
            - call: "POST /accounts"
              payload: { account_type: "INDIVIDUAL", contact_email: "c@x.com" }
              as: AccountHolder
              captures: { acct: "$.data.id"}
            - call: "POST /accounts/${acct}/vehicles"
              payload: { license_plate: "PRO777", state_code: "CA" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { veh: "$.data.id"}
            - call: "POST /memberships"
              payload: { account_id: "${acct}", vehicle_id: "${veh}", plan_id: "${plan_lo}" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { mem: "$.data.id"}
            - call: "GET /invoices"
              payload: { membership_id: "${mem}", kind: "CYCLE" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { inv0: "$.data[0].id"}
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-24T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /memberships/${mem}/change-plan"
              payload: { new_plan_id: "${plan_hi}", add_addon_ids: ["${addon_w}"] }
              as: AccountHolder
              as_user_id: "${acct}"
            - call: "GET /invoices"
              payload: { membership_id: "${mem}", kind: "PRORATION" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { prorate: "$.data[0].id"}
          assert:
            - "Invoice.${prorate}.kind == PRORATION"
            - "Invoice.${prorate}.total_cents == 1166"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: membership_cyclic_active_frozen_active
        grounds:
          - state_machines.Membership.ACTIVE_to_FROZEN
          - state_machines.Membership.FROZEN_to_ACTIVE
          - entities.Membership.fields.status
        distinguishing_aspect: "Membership is a cycle: ACTIVE -> FROZEN (freeze) -> ACTIVE (unfreeze) returns to a prior state — a non-linear shape on the Membership entity, distinct from the Invoice retry cycle in the paired instance."
        test_recipe:
          setup:
            - "Clock 2026-06-01. INDIVIDUAL account, ACTIVE UNLIMITED membership."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { name: "U", tier_type: "UNLIMITED", monthly_fee_cents: 3000, included_credits: 0, wash_cooldown_hours: 0, max_addons: 3 }
              as: PlatformAdmin
              captures: { plan_u: "$.data.id"}
            - call: "POST /accounts"
              payload: { account_type: "INDIVIDUAL", contact_email: "d@x.com" }
              as: AccountHolder
              captures: { acct: "$.data.id"}
            - call: "POST /accounts/${acct}/vehicles"
              payload: { license_plate: "CYC001", state_code: "CA" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { veh: "$.data.id"}
            - call: "POST /memberships"
              payload: { account_id: "${acct}", vehicle_id: "${veh}", plan_id: "${plan_u}" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { mem: "$.data.id"}
            - call: "GET /invoices"
              payload: { membership_id: "${mem}", kind: "CYCLE" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { inv0: "$.data[0].id"}
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /memberships/${mem}/freeze"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct}"
          trigger:
            - call: "POST /memberships/${mem}/unfreeze"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct}"
          assert:
            - "Membership.${mem}.status == ACTIVE"
            - "GET /memberships/${mem}/freezes shows the freeze that was ACTIVE is now ENDED"

      - name: invoice_failed_retrying_paid_cycle
        grounds:
          - state_machines.Invoice.ISSUED_to_FAILED
          - state_machines.Invoice.FAILED_to_RETRYING
          - state_machines.Invoice.RETRYING_to_PAID
        distinguishing_aspect: "Invoice loops ISSUED -> FAILED -> RETRYING -> PAID, a cyclic/branch-with-revert shape on the Invoice entity (different entity than the Membership cycle), with attempt_count incrementing across hops to 2."
        test_recipe:
          setup:
            - "Clock 2026-06-01. INDIVIDUAL account, PENDING membership with its first CYCLE invoice ISSUED; the charge is then DECLINED so the invoice is FAILED (attempt_count 1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { name: "U2", tier_type: "UNLIMITED", monthly_fee_cents: 3000, included_credits: 0, wash_cooldown_hours: 0, max_addons: 3 }
              as: PlatformAdmin
              captures: { plan_u: "$.data.id"}
            - call: "POST /accounts"
              payload: { account_type: "INDIVIDUAL", contact_email: "e@x.com" }
              as: AccountHolder
              captures: { acct: "$.data.id"}
            - call: "POST /accounts/${acct}/vehicles"
              payload: { license_plate: "RTY001", state_code: "CA" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { veh: "$.data.id"}
            - call: "POST /memberships"
              payload: { account_id: "${acct}", vehicle_id: "${veh}", plan_id: "${plan_u}" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { mem: "$.data.id"}
            - call: "GET /invoices"
              payload: { membership_id: "${mem}", kind: "CYCLE" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { inv0: "$.data[0].id"}
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0}", outcome: "DECLINED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /invoices/${inv0}/retry"
              payload: {}
              as: BillingAdmin
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
          assert:
            - "Invoice.${inv0}.status == PAID"
            - "Invoice.${inv0}.attempt_count == 2"
            - "Membership.${mem}.status == ACTIVE"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: account_suspend_cascade_depth3
        grounds:
          - state_machines.Account.ACTIVE_to_SUSPENDED
          - state_machines.Membership.ACTIVE_to_FROZEN
          - state_machines.MembershipAddOn.ACTIVE_to_PAUSED
        distinguishing_aspect: "Depth-3 cascade: suspend (Account) -> Membership ACTIVE->FROZEN (hop2, caused by suspend) -> each ACTIVE MembershipAddOn ACTIVE->PAUSED (hop3, caused by the freeze, not by suspend directly)."
        test_recipe:
          setup:
            - "Clock 2026-06-01. INDIVIDUAL account, ACTIVE UNLIMITED membership with one ACTIVE add-on attached."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { name: "U3", tier_type: "UNLIMITED", monthly_fee_cents: 3000, included_credits: 0, wash_cooldown_hours: 0, max_addons: 3 }
              as: PlatformAdmin
              captures: { plan_u: "$.data.id"}
            - call: "POST /addons"
              payload: { name: "WAX2", recurring_fee_cents: 800 }
              as: PlatformAdmin
              captures: { addon_w: "$.data.id"}
            - call: "POST /accounts"
              payload: { account_type: "INDIVIDUAL", contact_email: "f@x.com" }
              as: AccountHolder
              captures: { acct: "$.data.id"}
            - call: "POST /accounts/${acct}/vehicles"
              payload: { license_plate: "CAS003", state_code: "CA" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { veh: "$.data.id"}
            - call: "POST /memberships"
              payload: { account_id: "${acct}", vehicle_id: "${veh}", plan_id: "${plan_u}" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { mem: "$.data.id"}
            - call: "GET /invoices"
              payload: { membership_id: "${mem}", kind: "CYCLE" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { inv0: "$.data[0].id"}
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "GET /memberships/${mem}"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { mem_v: "$.data.version"}
            - call: "POST /memberships/${mem}/addons"
              payload: { addon_id: "${addon_w}", expected_membership_version: "${mem_v}" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { ma: "$.data.id"}
          trigger:
            - call: "POST /accounts/${acct}/suspend"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Account.${acct}.status == SUSPENDED"
            - "Membership.${mem}.status == FROZEN"
            - "MembershipAddOn.${ma}.status == PAUSED"

      - name: invoice_paid_reactivates_membership_depth2
        grounds:
          - state_machines.Invoice.RETRYING_to_PAID
          - state_machines.Membership.PAST_DUE_to_ACTIVE
        distinguishing_aspect: "Depth-2 cascade from a different trigger (retry success on Invoice): Invoice RETRYING->PAID (hop1) -> Membership PAST_DUE->ACTIVE (hop2, caused by the invoice paying)."
        test_recipe:
          setup:
            - "Clock 2026-06-01. ACTIVE UNLIMITED membership; clock advanced 30 days; billing run issues a new CYCLE invoice that is DECLINED, flipping the membership to PAST_DUE and the invoice to FAILED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { name: "U4", tier_type: "UNLIMITED", monthly_fee_cents: 3000, included_credits: 0, wash_cooldown_hours: 0, max_addons: 3 }
              as: PlatformAdmin
              captures: { plan_u: "$.data.id"}
            - call: "POST /accounts"
              payload: { account_type: "INDIVIDUAL", contact_email: "g@x.com" }
              as: AccountHolder
              captures: { acct: "$.data.id"}
            - call: "POST /accounts/${acct}/vehicles"
              payload: { license_plate: "PDU004", state_code: "CA" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { veh: "$.data.id"}
            - call: "POST /memberships"
              payload: { account_id: "${acct}", vehicle_id: "${veh}", plan_id: "${plan_u}" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { mem: "$.data.id"}
            - call: "GET /invoices"
              payload: { membership_id: "${mem}", kind: "CYCLE" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { inv0: "$.data[0].id"}
