      - name: slot_retire_to_fund_pending_removal_to_ratio_to_posture_depth3
        grounds:
          - state_machines.AssetClassSlot.AT_RISK_to_RETIRED
          - state_machines.Fund.ACTIVE_to_PENDING_REMOVAL
          - calculations.menu_posture
          - calculations.menu_slot_capacity
          - entities.Plan.fields.at_risk_slot_ratio
          - entities.Plan.fields.occupied_menu_slots
          - entities.Plan.fields.available_menu_slots
          - entities.Fund.fields.menu_status
          - entities.Fund.fields.watch_status
          - validations[priority=88]
          - validations[priority=89]
        distinguishing_aspect: |
          A different triggering transition (AssetClassSlot AT_RISK -> RETIRED via /retire, not a
          review finalize) propagates three causally chained hops in the opposite direction: retiring
          the slot is the only reason its seated fund goes ACTIVE -> PENDING_REMOVAL, that removal from
          the counted-slot set is the only reason at_risk_slot_ratio falls 0.5000 -> 0.0000, and that
          ratio drop is the only reason menu_posture returns FROZEN -> OPEN — while the fund's
          watch_status stays WATCH, proving the two Fund dimensions move independently.
