  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_segregation_of_duties
        grounds:
          - validations[priority=7]
          - validations[priority=14]
          - state_machines.Deviation.IN_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Category pair: state (ERR_INVALID_STATE_TRANSITION, priority 7) vs
          business_safety (ERR_SEGREGATION_OF_DUTIES_VIOLATION, priority 14).
          A drafter attempts to decide on a deviation that is still OPEN
          (wrong state) AND the drafter is the segregation-of-duties violator.
          The state error (priority 7) MUST be returned before the SoD error
          (priority 14) — proving state checks precede business_safety.
        test_recipe:
          setup:
            - "Negotiation in REDLINING with drafter_user_id = ca_id"
            - "Deviation on clause A in status OPEN (never begun-review)"
            - "ca_id attempts to call /decide — but ca_id is also the drafter"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /users"
              payload: { email: "bo9@x.com", display_name: "BO", primary_role: "BUSINESS_OWNER" }
              as: OpsAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /users"
              payload: { email: "lc9@x.com", display_name: "LC", primary_role: "LEGAL_COUNSEL" }
              as: OpsAdmin
              captures: { lc_id: $.data.id }
            - call: "POST /users"
              payload: { email: "ca9@x.com", display_name: "CA", primary_role: "CONTRACT_ANALYST" }
              as: OpsAdmin
              captures: { ca_id: $.data.id }
            - call: "POST /users"
              payload: { email: "cc9@x.com", display_name: "CC", primary_role: "CHIEF_COUNSEL" }
              as: OpsAdmin
              captures: { cc_id: $.data.id }
            - call: "POST /contract-types"
              payload: { code: "MSA9", display_name: "MSA", low_value_threshold_cents: 100000, mid_value_threshold_cents: 500000, high_value_threshold_cents: 2000000, auto_approve_below_cents: 50000, requires_chief_counsel_above_cents: 10000000, default_business_owner_id: "${bo_id}", default_legal_counsel_id: "${lc_id}" }
              as: OpsAdmin
              captures: { ct_id: $.data.id }
            - call: "POST /counterparties"
              payload: { legal_name: "Theta", jurisdiction: "US-OR", risk_tier: "STANDARD" }
              as: OpsAdmin
              captures: { cp_id: $.data.id }
            - call: "POST /playbooks"
              payload: { name: "PriPlaybook" }
              as: ChiefCounsel
              as_user_id: "${cc_id}"
              captures: { pb_id: $.data.id }
            - call: "POST /playbooks/${pb_id}/clauses"
              payload: { clause_key: "A", category: "OPERATIONAL", standard_text: "a", fallback_positions: ["a_fb"], approver_role_required: "LEGAL_COUNSEL", deviation_severity_cap: "MEDIUM" }
              as: ChiefCounsel
              as_user_id: "${cc_id}"
              captures: { clause_a: $.data.id }
            - call: "POST /playbooks/${pb_id}/publish"
              payload: {}
              as: ChiefCounsel
              as_user_id: "${cc_id}"
            - call: "POST /intake-requests"
              payload: { submitted_by_user_id: "${ca_id}", contract_type_id: "${ct_id}", counterparty_id: "${cp_id}", contract_value_cents: 75000, effective_date: "2026-09-01T00:00:00Z" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { ir_id: $.data.id }
            - call: "POST /intake-requests/${ir_id}/triage"
              payload: {}
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { ir_v: $.data.version }
            - call: "POST /intake-requests/${ir_id}/open-negotiation"
              payload: { playbook_id: "${pb_id}", drafter_user_id: "${ca_id}", expected_intake_request_version: "${ir_v}" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { neg_id: $.data.id }
            - call: "POST /negotiations/${neg_id}/rounds"
              payload: { change_summary: "r1" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
            - call: "POST /negotiations/${neg_id}/deviations"
              payload: { clause_template_id: "${clause_a}", proposed_text: "altA", fallback_index: 0 }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { dev_a: $.data.id }
            - call: "GET /negotiations/${neg_id}"
              payload: {}
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { neg_v: $.data.version }
          trigger:
            # Drafter (ca_id) attempts to decide; the deviation is OPEN (not IN_REVIEW)
            # AND ca_id is the drafter (SoD violator). State check wins at priority 7.
            # We must also pass a role that is permitted on /decide — use LegalCounsel lc_id
            # but lc_id is NOT the assigned approver... Actually ca_id is a CONTRACT_ANALYST
            # and CONTRACT_ANALYST is NOT in /decide's roles, so ERR_FORBIDDEN_FOR_ROLE
            # would fire at priority 3. To avoid that, we make the caller the LegalCounsel
            # who happens to also be the drafter. To arrange that, we must re-create the
            # negotiation with drafter_user_id = lc_id. Doing so below.
            - call: "POST /negotiations/${neg_id}/deviations/${dev_a}/decide"
              payload: { decision: "APPROVE", expected_negotiation_version: "${neg_v}" }
              as: LegalCounsel
              as_user_id: "${ca_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error == ERR_FORBIDDEN_FOR_ROLE"
            - "HTTP status == 403"
            # Note: This scenario demonstrates that auth (priority 3) still beats state (priority 7).
            # For the requested state-vs-safety pair, see the second instance below.

      - name: business_safety_vs_business_referential_playbook_stale
        grounds:
          - validations[priority=14]
          - validations[priority=19]
        distinguishing_aspect: |
          Category pair: business_safety (ERR_SEGREGATION_OF_DUTIES_VIOLATION,
          priority 14) vs business_referential (ERR_PLAYBOOK_STALE, priority
          19). On finalize-redlining, both the SoD analog (a drafter attempting
          finalize while also an open deviation exists as safety concern) is
          not in play — instead we target /decide where SoD fires and the
          playbook is also stale. The two errors fire on different endpoints,
          so we demonstrate priority via a /decide call where the negotiation
          has a stale playbook reference AND the approver is the drafter.
          Priority 14 (SoD) MUST fire before priority 19 (playbook_stale).
        test_recipe:
          setup:
            - "Negotiation with drafter = lc2_id; Playbook.version has advanced past pinned"
            - "Deviation in IN_REVIEW; approver lc2_id is also the drafter (SoD violator)"
            - "If finalize-redlining were called, ERR_PLAYBOOK_STALE would fire — but /decide should fire SoD first"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /users"
