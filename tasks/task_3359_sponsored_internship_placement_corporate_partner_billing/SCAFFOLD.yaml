scenario: "Sponsored Internship Placement & Corporate Partner Billing (Year Up): student recruitment and selection with eligibility criteria on age, education status and income, learning and development phase with technical training, professional skills and attendance-based contract points, corporate partner agreements where employers pay for an intern placement with defined project scope and supervision, internship matching between student skills and partner requirements with interview processes, stipend administration during both phases with attendance and behavior-based deductions, partner satisfaction and conversion-to-hire measurement with follow-up placement support, higher education partnerships granting college credit for the program, outcome tracking on wage and employment at intervals after graduation"
domain_name: "sponsored-internship-placement"
api_prefix: ""

complexity_profile:
  primary_archetype: "workflow_orchestration"
  secondary_archetype: "pricing_engine"
  complexity_layers:
    - "cascading_side_effects"
    - "dual_variant_calculation"
    - "rate_threshold_triggers"
    - "derived_field_reconciliation"
    - "optimistic_concurrency"
    - "selector_policy"
  entity_topology: "flat"
  state_machine_shape: "compound"
  relationship_patterns:
    - "one_to_many"
    - "many_to_many"
    - "self_referential"
    - "cross_aggregate"
  role_model: "segregation_of_duties"
  consistency_model: "immediate"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Partner
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered corporate name of the employer partner"
      - name: industry
        type: enum
        source: input
        description: "Partner industry classification"
        constraints: "one of {TECH, FINANCE, HEALTHCARE, RETAIL, LOGISTICS}"
      - name: billing_email
        type: string
        source: input
        description: "Invoice delivery address for placement fees"
      - name: status
        type: enum
        source: computed
        description: "Partner standing; ACTIVE admits new agreements, SUSPENDED blocks new agreement activation, INACTIVE is terminal"
        constraints: "one of {ACTIVE, SUSPENDED, INACTIVE}"
        default: "ACTIVE"
      - name: fee_tier
        type: enum
        source: input
        description: "Placement fee tier used by the flat placement fee calculation"
        constraints: "one of {TIER_A, TIER_B, TIER_C}"
        default: "TIER_C"
      - name: placement_quality_score
        type: number
        source: computed
        description: "Latest submitted satisfaction composite on a 0.00-5.00 scale; recomputed when a satisfaction record is submitted"
        default: "0.00"
      - name: on_time_payment_ratio
        type: number
        source: computed
        description: "Sum of paid invoice amounts divided by sum of issued invoice amounts for this partner, 0.0000-1.0000"
        default: "0.0000"
      - name: credit_hold
        type: boolean
        source: computed
        description: "True when the partner carries an invoice at status OVERDUE whose due date is strictly before the logical clock date; cleared when that invoice is paid or voided"
        default: "false"
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: "Sum of total_amount_cents over this partner's invoices at status ISSUED or OVERDUE"
        default: "0"
      - name: billed_cents
        type: integer
        source: computed
        description: "Sum of total_amount_cents over this partner's invoices at status ISSUED, OVERDUE or PAID; VOID invoices are excluded"
        default: "0"
      - name: collected_cents
        type: integer
        source: computed
        description: "Sum of amount_paid_cents over this partner's invoices at status PAID"
        default: "0"
      - name: collection_ratio
        type: number
        source: computed
        description: "collected_cents divided by billed_cents to 4 decimals round_half_up, or 0.0000 when billed_cents is 0"
        default: "0.0000"
      - name: oldest_open_due_date
        type: datetime
        source: computed
        description: "Earliest due_date among this partner's invoices at status ISSUED or OVERDUE; null when none are open"

  - name: Student
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Student legal name"
      - name: email
        type: string
        source: input
        description: "Contact email; unique across all students"
      - name: date_of_birth
        type: datetime
        source: input
        description: "Date of birth; age eligibility is evaluated at application decision time"
      - name: education_status
        type: enum
        source: input
        description: "Highest completed education at application time"
        constraints: "one of {NO_DIPLOMA, HS_DIPLOMA, SOME_COLLEGE, ASSOCIATE, BACHELOR_OR_HIGHER}"
      - name: household_income_cents
        type: integer
        source: input
        description: "Annual household income in cents, used by the income eligibility gate"
      - name: application_state
        type: enum
        source: computed
        description: "Selection pipeline position; starts at APPLIED"
        constraints: "one of {APPLIED, ELIGIBLE, INELIGIBLE, ENROLLED}"
        default: "APPLIED"
      - name: current_phase
        type: enum
        source: computed
        description: "Program phase while application_state is ENROLLED; null otherwise"
        constraints: "one of {L_AND_D, INTERNSHIP, COMPLETED}"
      - name: track_code
        type: enum
        source: input
        description: "Career track supplied with the enrollment request; must equal the target cohort's program_code"
        constraints: "one of {SOFTWARE, DATA, CYBER, IT_SUPPORT}"
      - name: graduation_at
        type: datetime
        source: computed
        description: "Timestamp stamped when current_phase enters COMPLETED"
      - name: total_stipend_paid_cents
        type: integer
        source: computed
        description: "Sum of net_amount_cents over this student's stipend statements at status PAID"
        default: "0"
      - name: lifetime_contract_points
        type: integer
        source: computed
        description: "Running total of contract points awarded across this student's L&D cohorts"
        default: "0"
      - name: conversion_streak
        type: integer
        source: computed
        description: "Count of consecutive CONVERTED internship outcomes on this student; reset to 0 by a NOT_CONVERTED outcome"
        default: "0"
      - name: roster_status
        type: enum
        source: computed
        description: "Cohort roster standing maintained by the L&D phase"
        constraints: "one of {ON_TRACK, PROBATION, DISMISSED}"
        default: "ON_TRACK"

  - name: Cohort
    parent: null
    common_fields: true
    fields:
      - name: program_code
        type: enum
        source: input
        description: "Career track this cohort trains for"
        constraints: "one of {SOFTWARE, DATA, CYBER, IT_SUPPORT}"
      - name: location_code
        type: string
        source: input
        description: "Site code where the cohort trains"
      - name: start_date
        type: datetime
        source: input
        description: "First day of the L&D phase; the graduation date is derived from this date"
      - name: capacity
        type: integer
        source: input
        description: "Maximum enrolled students; enrollment rejects when enrolled_count is at or above this value"
        default: "24"
      - name: enrolled_count
        type: integer
        source: computed
        description: "Count of students whose application_state is ENROLLED and whose cohort_id points at this cohort"
        default: "0"
      - name: graduation_date
        type: datetime
        source: computed
        description: "start_date plus 180 days; written when the cohort is created"
      - name: awarded_points
        type: integer
        source: computed
        description: "Cohort-level contract point award recomputed when one of its students pays a stipend statement"
        default: "0"
      - name: status
        type: enum
        source: computed
        description: "Cohort lifecycle status"
        constraints: "one of {PLANNED, ACTIVE, COMPLETED}"
        default: "PLANNED"

  - name: Agreement
    parent: null
    common_fields: true
    fields:
      - name: partner_id
        type: string
        source: input
        description: "FK -> Partner.id; the employer that sponsors placements under this agreement"
      - name: project_scope
        type: string
        source: input
        description: "Written description of the internship project scope"
      - name: supervision_hours_per_week
        type: integer
        source: input
        description: "Committed supervisor hours per week; must be at least 10 for activation"
      - name: slot_count
        type: integer
        source: input
        description: "Number of interns the partner commits to host"
      - name: fee_tier
        type: enum
        source: input
        description: "Negotiated placement fee tier; billing reads this agreement-level value, never Partner.fee_tier, and activation rejects a mismatch with the partner's current tier"
        constraints: "one of {TIER_A, TIER_B, TIER_C}"
      - name: start_date
        type: datetime
        source: input
        description: "First day of the placement window"
      - name: end_date
        type: datetime
        source: input
        description: "Last day of the placement window; must be at least 28 days after start_date"
      - name: status
        type: enum
        source: computed
        description: "Agreement lifecycle status; FULFILLED reverts to ACTIVE when placements are terminated"
        constraints: "one of {DRAFT, ACTIVE, FULFILLED}"
        default: "DRAFT"

  - name: InternshipPlacement
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> Agreement.id; the sponsoring agreement this placement draws a slot from"
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the matched intern"
      - name: state
        type: enum
        source: computed
        description: "Placement lifecycle state"
        constraints: "one of {MATCHED, INTERVIEW_SCHEDULED, INTERVIEWED, OFFERED, ACCEPTED, ACTIVE, COMPLETED, TERMINATED}"
        default: "MATCHED"
      - name: interview_attempt
        type: integer
        source: computed
        description: "Number of completed interview rounds on this placement; starts at 0 and increments when the partner submits an interview outcome"
        default: "0"
      - name: max_interview_rounds
        type: integer
        source: input
        description: "Maximum interview rounds allowed before the placement auto-returns to MATCHED"
        default: "3"
      - name: start_date
        type: datetime
        source: input
        description: "First day of the internship; required by the offer acceptance call"
      - name: end_date
        type: datetime
        source: input
        description: "Last day of the internship; required by the offer acceptance call"
      - name: hours_per_week
        type: integer
        source: input
        description: "Scheduled weekly hours; drives the internship stipend"
        default: "20"
      - name: placement_fee_cents
        type: integer
        source: computed
        description: "Fee owed by the partner for this placement, computed at offer acceptance"
      - name: project_scope
        type: string
        source: computed
        description: "Copy of the sponsoring agreement's project_scope taken at MATCHED"
      - name: supervisor_name
        type: string
        source: computed
        description: "Host supervisor copied at MATCHED from the sponsoring agreement's partner legal name; each interview round records the actual interviewer separately"
      - name: outcome
        type: enum
        source: computed
        description: "Conversion outcome recorded at completion"
        constraints: "one of {CONVERTED, NOT_CONVERTED}"
      - name: satisfaction_score
        type: number
        source: computed
        description: "Latest partner satisfaction composite for this placement, 0.00-5.00"

  - name: InterviewRound
    parent: InternshipPlacement
    common_fields: true
    fields:
      - name: placement_id
        type: string
        source: input
        description: "FK -> InternshipPlacement.id; the placement this interview round belongs to"
      - name: scheduled_for
        type: datetime
        source: input
        description: "Interview slot start; must fall inside the sponsoring agreement's window"
      - name: duration_minutes
        type: integer
        source: input
        description: "Interview length; must be at least 30 minutes"
        default: "45"
      - name: supervisor_name
        type: string
        source: input
        description: "Name of the interviewing supervisor"
      - name: round_number
        type: integer
        source: computed
        description: "Ordinal of this round on the placement, assigned as placement.interview_attempt + 1"
      - name: outcome
        type: enum
        source: computed
        description: "Interview result; PENDING until the partner records an outcome"
        constraints: "one of {PENDING, PASSED, FAILED}"
        default: "PENDING"
      - name: feedback
        type: string
        source: input
        description: "Optional interviewer feedback captured with the outcome"

  - name: StipendStatement
    parent: Student
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the student this statement pays"
      - name: phase
        type: enum
        source: input
        description: "Program phase the statement covers"
        constraints: "one of {L_AND_D, INTERNSHIP}"
      - name: period_start
        type: datetime
        source: input
        description: "First day of the covered stipend period; inclusive"
      - name: period_end
        type: datetime
        source: input
        description: "Last day of the covered stipend period; inclusive; must be at least 7 days after period_start"
      - name: hours_attended
        type: integer
        source: input
        description: "Hours the student attended in this period"
      - name: hours_expected
        type: integer
        source: input
        description: "Hours the student was expected to attend in this period; must be greater than zero"
      - name: attendance_ratio
        type: number
        source: computed
        description: "hours_attended divided by hours_expected, rounded to 4 decimal places, round_half_up"
      - name: behavior_incidents
        type: integer
        source: input
        description: "Behavior incidents recorded in this period; 3 or more triggers a deduction"
        default: "0"
      - name: contract_points_earned
        type: integer
        source: computed
        description: "Contract points awarded for this period, added to the student's lifetime total on payment"
      - name: gross_amount_cents
        type: integer
        source: computed
        description: "Period stipend before deductions, computed at creation"
      - name: attendance_deduction_cents
        type: integer
        source: computed
        description: "Deduction for missed attendance, computed at creation"
      - name: behavior_deduction_cents
        type: integer
        source: computed
        description: "Deduction for behavior incidents, computed at creation"
      - name: net_amount_cents
        type: integer
        source: computed
        description: "Payable amount after deductions, floored at zero, computed at creation"
      - name: status
        type: enum
        source: computed
        description: "Statement lifecycle status"
        constraints: "one of {PENDING, PAID, VOID}"
        default: "PENDING"

  - name: SatisfactionRecord
    parent: InternshipPlacement
    common_fields: true
    fields:
      - name: placement_id
        type: string
        source: input
        description: "FK -> InternshipPlacement.id; the placement being rated"
      - name: supervisor_rating
        type: number
        source: input
        description: "Supervisor rating on a 0.00-5.00 scale"
      - name: project_rating
        type: number
        source: input
        description: "Project delivery rating on a 0.00-5.00 scale"
      - name: communication_rating
        type: number
        source: input
        description: "Communication rating on a 0.00-5.00 scale"
      - name: composite_score
        type: number
        source: computed
        description: "Weighted satisfaction composite, 0.00-5.00, rounded to 2 decimals round_half_up"
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock timestamp at submission"
      - name: converted_to_hire
        type: boolean
        source: computed
        description: "Set when the partner records a CONVERTED outcome for this placement"

  - name: OutcomeCheckpoint
    parent: Student
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the graduate being surveyed"
      - name: interval_months
        type: integer
        source: input
        description: "Months after graduation this checkpoint surveys; one of 3, 6 or 12"
      - name: due_date
        type: datetime
        source: computed
        description: "graduation_at plus interval_months calendar months, written at graduation"
      - name: employment_status
        type: enum
        source: computed
        description: "Self-reported employment status; UNKNOWN until recorded"
        constraints: "one of {UNKNOWN, EMPLOYED, UNEMPLOYED, ENROLLED_EDUCATION}"
        default: "UNKNOWN"
      - name: hourly_wage_cents
        type: integer
        source: computed
        description: "Reported hourly wage in cents; required when employment_status is EMPLOYED"
      - name: recorded_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when the survey was recorded"

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: partner_id
        type: string
        source: input
        description: "FK -> Partner.id; the billed partner"
      - name: placement_id
        type: string
        source: input
        description: "FK -> InternshipPlacement.id; the placement whose fee this invoice bills"
      - name: total_amount_cents
        type: integer
        source: computed
        description: "Amount billed, copied from the placement's placement_fee_cents when the invoice is issued"
      - name: amount_paid_cents
        type: integer
        source: computed
        description: "Amount received; 0 until the invoice is paid"
        default: "0"
      - name: due_date
        type: datetime
        source: input
        description: "Payment due date; the invoice turns OVERDUE once the logical clock passes it"
      - name: paid_on
        type: datetime
        source: computed
        description: "Logical-clock date recorded with the payment; null until paid"
      - name: status
        type: enum
        source: computed
        description: "Invoice lifecycle status"
        constraints: "one of {ISSUED, OVERDUE, PAID, VOID}"
        default: "ISSUED"

  - name: CreditGrant
    parent: Student
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the student earning college credit"
      - name: college_partner_name
        type: string
        source: input
        description: "Name of the higher-education partner granting the credit"
      - name: credit_hours
        type: number
        source: input
        description: "Credit hours granted; must be greater than zero"
      - name: tuition_credit_cents
        type: integer
        source: computed
        description: "Tuition credit value of this grant, computed at creation"
      - name: status
        type: enum
        source: computed
        description: "Grant status; VOID grants are excluded from the tuition credit total"
        constraints: "one of {PENDING, GRANTED, VOID}"
        default: "PENDING"

state_machines:
  - entity: Student
    initial_state: APPLIED
    terminal_states: [INELIGIBLE]
    transitions:
      - from: APPLIED
        to: ELIGIBLE
        trigger: "POST /students/{id}/eligibility-decisions"
        actor: ProgramStaff
        preconditions:
          - "decision == ELIGIBLE"
          - "age at the logical-clock date is >= 18 and <= 24"
          - "education_status IN {NO_DIPLOMA, HS_DIPLOMA, SOME_COLLEGE, ASSOCIATE}"
          - "household_income_cents <= 4500000"
        side_effects:
          - "none; the student waits for a cohort assignment"
      - from: APPLIED
        to: INELIGIBLE
        trigger: "POST /students/{id}/eligibility-decisions"
        actor: ProgramStaff
        preconditions:
          - "decision == INELIGIBLE"
        note: "a decision of ELIGIBLE whose criteria fail does NOT move the student: the request is rejected with the failing criterion's error and the student stays APPLIED so it can be decided again"
        side_effects:
          - "no enrollment, cohort assignment or stipend statement may be created for this student thereafter"
      - from: ELIGIBLE
        to: ENROLLED
        trigger: "POST /students/{id}/enrollments"
        actor: ProgramStaff
        preconditions:
          - "the cohort is at status PLANNED or ACTIVE"
          - "cohort.program_code == student.track_code"
          - "cohort.enrolled_count < cohort.capacity"
          - "the logical-clock date is on or before cohort.graduation_date"
        side_effects:
          - "Student.current_phase becomes L_AND_D"
          - "Cohort.enrolled_count increments by 1"
          - "Cohort.status becomes ACTIVE when it was PLANNED"
      - from: ENROLLED
        to: ENROLLED
        trigger: "system: a stipend payment raises Student.lifetime_contract_points to 12 or more"
        actor: system
        preconditions:
          - "Student.current_phase == L_AND_D"
          - "the student has a stipend statement at status PAID for phase L_AND_D"
          - "Student.lifetime_contract_points >= 12"
          - "Student.roster_status != DISMISSED"
        side_effects:
          - "Student.current_phase becomes INTERNSHIP"
          - "Cohort.status becomes COMPLETED when every enrolled student of the cohort has current_phase INTERNSHIP or COMPLETED"
      - from: ENROLLED
        to: ENROLLED
        trigger: "system: a placement completion leaves the student with no non-terminal placement and at least one COMPLETED placement"
        actor: system
        preconditions:
          - "Student.current_phase == INTERNSHIP"
          - "every placement of this student is at state COMPLETED or TERMINATED"
          - "at least one placement of this student is at state COMPLETED"
        side_effects:
          - "Student.current_phase becomes COMPLETED"
          - "Student.graduation_at is stamped with the logical clock"
          - "three OutcomeCheckpoint rows are created at interval_months 3, 6 and 12 with due_date = graduation_at plus that many calendar months"
          - "Cohort.status becomes COMPLETED when every enrolled student of the cohort has current_phase COMPLETED"

  - entity: InternshipPlacement
    initial_state: MATCHED
    terminal_states: [TERMINATED]
    transitions:
      - from: MATCHED
        to: INTERVIEW_SCHEDULED
        trigger: "POST /placements/{id}/interviews"
        actor: ProgramStaff
        preconditions:
          - "supervisor_name is present"
          - "the agreement's status is ACTIVE"
          - "scheduled_for falls inside [agreement.start_date, agreement.end_date]"
        side_effects:
          - "the InterviewRound is created with outcome PENDING and round_number = interview_attempt + 1"
      - from: INTERVIEW_SCHEDULED
        to: INTERVIEWED
        trigger: "POST /interviews/{id}/outcomes"
        actor: Partner
        preconditions:
          - "the interview round outcome is PENDING"
          - "interview_attempt + 1 <= max_interview_rounds"
        side_effects:
          - "InterviewRound.outcome is set to the recorded value"
          - "InternshipPlacement.interview_attempt increments by 1"
      - from: INTERVIEW_SCHEDULED
        to: MATCHED
        trigger: "POST /interviews/{id}/outcomes with outcome FAILED and interview_attempt + 1 == max_interview_rounds"
        actor: Partner
        preconditions:
          - "the interview round outcome is PENDING"
          - "interview_attempt + 1 == max_interview_rounds"
        side_effects:
          - "InterviewRound.outcome is set to FAILED"
          - "InternshipPlacement.interview_attempt increments by 1"
          - "the placement returns to the matching pool with state MATCHED; student_id and agreement_id are retained"
      - from: INTERVIEWED
        to: INTERVIEW_SCHEDULED
        trigger: "POST /placements/{id}/interviews"
        actor: ProgramStaff
        preconditions:
          - "the placement's latest InterviewRound.outcome is FAILED"
          - "interview_attempt < max_interview_rounds"
          - "the agreement's status is ACTIVE"
        side_effects:
          - "a new InterviewRound is created with outcome PENDING and round_number = interview_attempt + 1"
      - from: INTERVIEWED
        to: OFFERED
        trigger: "POST /placements/{id}/offers"
        actor: ProgramStaff
        preconditions:
          - "the latest InterviewRound.outcome is PASSED"
          - "the agreement's status is ACTIVE"
        side_effects:
          - "InternshipPlacement.placement_fee_cents is computed and stored (placement_fee calculation)"
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /placements/{id}/acceptance"
        actor: Student
        preconditions:
          - "X-User-ID equals the placement's student_id"
          - "start_date and end_date are supplied and end_date is at least 28 days after start_date"
          - "Agreement.status is ACTIVE"
          - "the student has no other placement at state ACCEPTED or ACTIVE"
        side_effects:
          - "InternshipPlacement.placement_fee_cents is recomputed with the accepted start_date and end_date"
          - "the sponsoring agreement's status becomes FULFILLED when the count of its placements at state ACCEPTED, ACTIVE or COMPLETED reaches slot_count"
          - "when the logical-clock date is on or after the accepted start_date and the sponsoring agreement's status is ACTIVE or FULFILLED, the placement immediately advances ACCEPTED -> ACTIVE in the same request"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /placements/{id}/completions"
        actor: ProgramStaff
        preconditions:
          - "the logical-clock date is on or after end_date"
          - "the placement has at least one SatisfactionRecord"
        side_effects:
          - "Student.conversion_streak increments by 1 when outcome == CONVERTED, otherwise it resets to 0"
          - "Student.current_phase advances INTERNSHIP -> COMPLETED and three outcome checkpoints are created when this completion leaves the student with no non-terminal placement (see the Student machine)"
          - "SatisfactionRecord.converted_to_hire is set to true on this placement's records when outcome == CONVERTED"
          - "InternshipPlacement.satisfaction_score is set to the composite of the latest SatisfactionRecord of this placement"
          - "the placement's agreement status becomes FULFILLED when its ACCEPTED, ACTIVE or COMPLETED placement count reaches slot_count"
      - from: MATCHED
        to: TERMINATED
        trigger: "POST /placements/{id}/terminations"
        actor: ProgramStaff
      - from: INTERVIEW_SCHEDULED
        to: TERMINATED
        trigger: "POST /placements/{id}/terminations"
        actor: ProgramStaff
      - from: INTERVIEWED
        to: TERMINATED
        trigger: "POST /placements/{id}/terminations"
        actor: ProgramStaff
      - from: OFFERED
        to: TERMINATED
        trigger: "POST /placements/{id}/terminations"
        actor: ProgramStaff
      - from: ACCEPTED
        to: TERMINATED
        trigger: "POST /placements/{id}/terminations"
        actor: ProgramStaff
        side_effects:
          - "the sponsoring agreement's status returns to ACTIVE when it is FULFILLED and its ACCEPTED, ACTIVE or COMPLETED placement count drops below slot_count"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /placements/{id}/terminations"
        actor: ProgramStaff
        side_effects:
          - "the sponsoring agreement's status returns to ACTIVE when it is FULFILLED and its ACCEPTED, ACTIVE or COMPLETED placement count drops below slot_count"

  - entity: Agreement
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /agreements/{id}/activations"
        actor: ProgramStaff
        preconditions:
          - "supervision_hours_per_week >= 10"
          - "slot_count >= 1"
          - "end_date is at least 28 days after start_date"
          - "the partner's status is ACTIVE and the partner's credit_hold is false"
        side_effects:
          - "Agreement.fee_tier is frozen from Partner.fee_tier at this instant and is not re-read afterwards"
      - from: ACTIVE
        to: FULFILLED
        trigger: "system: the count of placements at ACCEPTED, ACTIVE or COMPLETED under this agreement reaches slot_count"
        actor: system
        side_effects:
          - "no new placement may be matched to this agreement"
      - from: FULFILLED
        to: ACTIVE
        trigger: "system: the count of placements at ACCEPTED, ACTIVE or COMPLETED under this agreement drops below slot_count"
        actor: system
        side_effects:
          - "the agreement accepts new matches again"

  - entity: StipendStatement
    initial_state: PENDING
    terminal_states: [PAID, VOID]
    transitions:
      - from: PENDING
        to: PAID
        trigger: "POST /stipend-statements/{id}/payments"
        actor: ProgramStaff
        side_effects:
          - "Student.total_stipend_paid_cents increases by net_amount_cents"
          - "Student.lifetime_contract_points increases by contract_points_earned"
          - "Student.roster_status becomes DISMISSED when this statement's attendance_ratio is below 0.50"
          - "Student.roster_status becomes PROBATION when this statement's attendance_ratio is at or above 0.50 and the student's lifetime_contract_points is below 12 after this payment"
          - "Student.current_phase advances L_AND_D -> INTERNSHIP when lifetime_contract_points reaches 12 and roster_status is not DISMISSED (see the Student machine)"
      - from: PENDING
        to: VOID
        trigger: "POST /stipend-statements/{id}/voids"
        actor: ProgramStaff
        side_effects:
          - "the statement no longer contributes to any student total"

  - entity: Invoice
    initial_state: ISSUED
    terminal_states: [PAID, VOID]
    transitions:
      - from: ISSUED
        to: OVERDUE
        trigger: "system: the logical-clock date passes due_date while the invoice is ISSUED; evaluated when the logical clock advances and again whenever the invoice or its partner is read"
        actor: system
        side_effects:
          - "Partner.credit_hold becomes true when the partner has at least one invoice at status OVERDUE whose due date is strictly before the logical-clock date"
          - "Partner.status becomes SUSPENDED when the partner carries an invoice at status OVERDUE whose due date is strictly more than 30 days before the logical-clock date"
          - "Partner.outstanding_balance_cents, Partner.billed_cents and Partner.oldest_open_due_date are recomputed"
      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{id}/payments"
        actor: ProgramStaff
        side_effects:
          - "Partner.on_time_payment_ratio, Partner.collected_cents and Partner.collection_ratio are recomputed"
          - "Partner.outstanding_balance_cents is recomputed"
          - "Partner.credit_hold is cleared when no other OVERDUE invoice remains for the partner"
          - "Partner.status returns to ACTIVE when no OVERDUE invoice with a due date more than 30 days before the logical clock remains"
      - from: OVERDUE
        to: PAID
        trigger: "POST /invoices/{id}/payments"
        actor: ProgramStaff
        side_effects:
          - "Partner.on_time_payment_ratio, Partner.collected_cents and Partner.collection_ratio are recomputed"
          - "Partner.outstanding_balance_cents is recomputed"
          - "Partner.credit_hold is cleared when no other OVERDUE invoice remains for the partner"
          - "Partner.status returns to ACTIVE when no OVERDUE invoice with a due date more than 30 days before the logical clock remains"
      - from: ISSUED
        to: VOID
        trigger: "POST /invoices/{id}/voids"
        actor: ProgramStaff
        side_effects:
          - "the invoice no longer contributes to Partner.outstanding_balance_cents"
      - from: OVERDUE
        to: VOID
        trigger: "POST /invoices/{id}/voids"
        actor: ProgramStaff
        side_effects:
          - "the invoice no longer contributes to Partner.outstanding_balance_cents"

  - entity: CreditGrant
    initial_state: PENDING
    terminal_states: [GRANTED, VOID]
    transitions:
      - from: PENDING
        to: GRANTED
        trigger: "POST /credit-grants/{id}/grants"
        actor: ProgramStaff
        preconditions:
          - "the student's current_phase is INTERNSHIP or COMPLETED"
          - "the logical-clock date is on or before the student's graduation_at plus 365 days"
        side_effects:
          - "none; the grant starts contributing to the student's tuition credit total"
      - from: PENDING
        to: VOID
        trigger: "POST /credit-grants/{id}/voids"
        actor: ProgramStaff
        side_effects:
          - "the grant stops contributing to the student's tuition credit total"

concurrency_rules:
  - rule_id: invoice-create-stale-partner
    parent_entity: Partner
    write_endpoint: "POST /invoices"
    occ_field: "expected_partner_version"
    description: |
      Issuing an invoice against a Partner whose version has advanced since
      the client last read it is rejected: the client's view of the partner's
      billing state is stale, and the fee tier, credit hold and balance it
      based the invoice on may have moved. The check is on the version the
      request carries, not on any timing of requests.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: agreement-activate-stale-partner
    parent_entity: Partner
    write_endpoint: "POST /agreements/{id}/activations"
    occ_field: "expected_partner_version"
    description: |
      Activating an agreement against a Partner whose version has advanced
      since the client last read it is rejected: activation validates the
      agreement's negotiated fee tier against the partner record and clears
      the partner's credit hold, so a stale read can carry a partner view the
      server no longer holds. The check is on the version the request
      carries, not on any timing of requests.
    error_id: ERR_STALE_VERSION
    http_status: 412
calculations:
  - name: placement_fee
    trigger: "computed when a placement offer is created, and recomputed when the offer is accepted with concrete dates"
    algorithm: dual_variant
    formula: |
      # Pinned evaluation order (both variants):
      # 1. supervision_credit_cents = min(supervision_hours_per_week * SUPERVISION_CREDIT_PER_HOUR_CENTS,
      #                                  SUPERVISION_CREDIT_MAX_CENTS)
      # 2. base_cents   = BASE_CENTS + supervision_credit_cents
      # 3. tiered_cents = round_half_up(base_cents * TIER_MULTIPLIER[tier])
      # 4. duration_factor depends on the variant (below)
      # 5. placement_fee_cents = round_half_up(tiered_cents * duration_factor)
      # The window used at offer time is the sponsoring agreement's
      # [start_date, end_date]; at acceptance time it is the placement's own
      # [start_date, end_date] supplied in the request body.
      TIER_MULTIPLIER = {"TIER_A": 1.25, "TIER_B": 1.10, "TIER_C": 1.00}
      window_days = (window_end - window_start).days
    input_set: "the sponsoring Agreement's frozen fee_tier, supervision_hours_per_week and window; the placement's accepted start_date/end_date when supplied"
    constants:
      BASE_CENTS: 200000
      SUPERVISION_CREDIT_PER_HOUR_CENTS: 2500
      SUPERVISION_CREDIT_MAX_CENTS: 50000
      FULL_DURATION_MIN_DAYS: 168
      SCHEDULED_DURATION_DAYS: 180
    precision: "integer cents, round_half_up"
    variants:
      - name: exact_day_window
        when: "always; this is the pinned variant"
        difference: "duration_factor = window_days / SCHEDULED_DURATION_DAYS, so a 211-day window bills 211/180 of the tiered base (296572 cents on a TIER_B agreement with 12 supervision hours)"
      - name: calendar_month_proration
        when: "rejected reading; recorded so the divergence is explicit"
        difference: "duration_factor = 1.0 when window_days >= 168, otherwise 0.5, so the same 211-day window bills the full tiered base (253000 cents)"

  - name: lnd_stipend_net
    trigger: "computed when an L&D-phase stipend statement is created"
    algorithm: dual_variant
    formula: |
      # Pinned evaluation order:
      # 1. weeks = round_half_up((period_end - period_start).days / 7), minimum 1
      # 2. gross_amount_cents = weeks * LND_WEEKLY_BASE_CENTS
      # 3. attendance_ratio = round_half_up(hours_attended / hours_expected, 4)
      # 4. absence_ratio    = 1 - attendance_ratio
      # 5. attendance_deduction_cents per the active variant (below)
      # 6. behavior_deduction_cents = BEHAVIOR_DEDUCTION_CENTS when
      #    behavior_incidents >= BEHAVIOR_INCIDENT_THRESHOLD, else 0
      # 7. net_amount_cents = max(0, gross - attendance_deduction - behavior_deduction)
      # 8. contract_points_earned = POINTS_LND_BASE + (POINTS_LND_ATTENDANCE_BONUS
      #    when attendance_ratio >= 0.95 else 0)
      period_start and period_end are inclusive days.
    input_set: "L&D-phase stipend statements only; the statement's own attendance and behavior fields"
    constants:
      LND_WEEKLY_BASE_CENTS: 17500
      BEHAVIOR_DEDUCTION_CENTS: 5000
      BEHAVIOR_INCIDENT_THRESHOLD: 3
      ATTENDANCE_DEDUCTION_DIVISOR: 10
      POINTS_LND_BASE: 3
      POINTS_LND_ATTENDANCE_BONUS: 2
    precision: "integer cents, round_half_up"
    variants:
      - name: proportional_absence
        when: "always; this is the pinned variant"
        difference: "attendance_deduction_cents = round_half_up(gross * absence_ratio / 10); a ratio of exactly 0.9000 yields 350 cents on a 35000-cent period"
      - name: per_day_absence
        when: "rejected reading; recorded so the divergence is explicit"
        difference: "attendance_deduction_cents = round_half_up(gross / 10) when absence_ratio > 0.1000, else 0; a ratio of exactly 0.9000 yields 0 cents"

  - name: satisfaction_composite
    trigger: "computed when a partner satisfaction record is submitted, and mirrored onto the placement and the partner"
    algorithm: weighted_scoring
    formula: |
      # Pinned evaluation order (per-term rounding, then sum, then rescale):
      # 1. term_supervisor    = round_half_up(supervisor_rating * WEIGHT_SUPERVISOR, 2)
      # 2. term_project       = round_half_up(project_rating * WEIGHT_PROJECT, 2)
      # 3. term_communication = round_half_up(communication_rating * WEIGHT_COMMUNICATION, 2)
      # 4. weighted           = round_half_up(term_supervisor + term_project + term_communication, 2)
      # 5. composite_score    = clamp(round_half_up(weighted * RESCALE_NUMERATOR / RESCALE_DENOMINATOR
      #                                             - RESCALE_OFFSET, 2), 0.00, 5.00)
      # Rounding each term before summing is required; summing unrounded terms
      # first produces different values.
    input_set: "the three rating fields of the submitted SatisfactionRecord; ratings are on a 0.00-5.00 scale"
    constants:
      WEIGHT_SUPERVISOR: 0.50
      WEIGHT_PROJECT: 0.30
      WEIGHT_COMMUNICATION: 0.20
      RESCALE_NUMERATOR: 5
      RESCALE_DENOMINATOR: 4
      RESCALE_OFFSET: 1
    precision: "2 decimal places, round_half_up, clamped to [0.00, 5.00]"
    variants:
      - name: per_term_rounding
        when: "always; this is the pinned variant"
        difference: "ratings (4.25, 3.15, 2.05) give weighted 3.49 and composite 3.36"
      - name: sum_then_round
        when: "rejected reading; recorded so the divergence is explicit"
        difference: "the same ratings give weighted 3.48 and composite 3.35"

  - name: cohort_contract_points
    trigger: "computed when the final L&D stipend statement of a cohort's students is paid"
    algorithm: threshold
    formula: |
      # Pinned evaluation order (the level is read from the raw total, the
      # award is then derived from that level and the same raw total):
      # 1. total_points = sum of contract_points_earned over stipend statements
      #    at status PAID whose phase is L_AND_D and whose student is ENROLLED
      #    in this cohort
      # 2. level = 3 when total_points >= LEVEL_3_MIN
      #            else 2 when total_points >= LEVEL_2_MIN
      #            else 1
      # 3. base_points  = round_half_up(total_points / 3)
      # 4. awarded_points = base_points + level * LEVEL_BONUS_MULTIPLIER
      # The level MUST be evaluated against total_points, never against
      # base_points or awarded_points.
    input_set: "PAID L&D stipend statements of students whose cohort_id points at this cohort"
    constants:
      LEVEL_2_MIN: 10
      LEVEL_3_MIN: 20
      LEVEL_BONUS_MULTIPLIER: 100
    precision: "integer points, round_half_up"
    variants:
      - name: level_from_raw_total
        when: "always; this is the pinned variant"
        difference: "total_points 8 gives level 1 and awarded_points 103; total_points 13 gives level 2 and awarded_points 204"
      - name: level_from_awarded_points
        when: "rejected reading; recorded so the circular dependency is explicit"
        difference: "evaluating the level against the already-bonused award makes the value self-referential and undefined"

  - name: internship_stipend_net
    trigger: "computed when an internship-phase stipend statement is created"
    algorithm: aggregation
    formula: |
      # Pinned evaluation order:
      # 1. weeks = round_half_up((period_end - period_start).days / 7), minimum 1
      # 2. weekly_hours  = round_half_up(hours_expected / weeks)
      # 3. billable_hours = weeks * min(weekly_hours, INTERNSHIP_WEEKLY_HOURS_CAP)
      # 4. gross_amount_cents = billable_hours * INTERNSHIP_HOURLY_CENTS
      # 5. attendance_ratio = round_half_up(hours_attended / hours_expected, 4)
      # 6. deduction = round_half_up(gross * (1 - attendance_ratio))
      #                + (ATTENDANCE_FLOOR_DEDUCTION_CENTS when attendance_ratio < ATTENDANCE_FLOOR_RATIO else 0)
      #                + (INTERNSHIP_BEHAVIOR_DEDUCTION_CENTS when behavior_incidents >= 3 else 0)
      # 7. net_amount_cents = max(0, gross - deduction)
      # 8. contract_points_earned = POINTS_INTERNSHIP_BASE
      #    + (POINTS_INTERNSHIP_ATTENDANCE_BONUS when attendance_ratio >= 0.95 else 0)
    input_set: "INTERNSHIP-phase stipend statements only; the statement's own attendance and behavior fields"
    constants:
      INTERNSHIP_HOURLY_CENTS: 1650
      INTERNSHIP_WEEKLY_HOURS_CAP: 25
      ATTENDANCE_FLOOR_RATIO: 0.60
      ATTENDANCE_FLOOR_DEDUCTION_CENTS: 15000
      INTERNSHIP_BEHAVIOR_DEDUCTION_CENTS: 7500
      POINTS_INTERNSHIP_BASE: 6
      POINTS_INTERNSHIP_ATTENDANCE_BONUS: 3
    precision: "integer cents, round_half_up"
    variants:
      - name: capped_hours
        when: "always; this is the pinned variant"
        difference: "a 60-hour expectation over a 14-day period bills 50 hours, not 60"

  - name: partner_billing_summary
    trigger: "read on demand from the partner billing summary endpoint, and recomputed whenever an invoice changes status"
    algorithm: aggregation
    formula: |
      # Pinned input set and boundaries:
      # open_invoices  = invoices of this partner whose status IN {ISSUED, OVERDUE}
      # paid_invoices  = invoices of this partner whose status == PAID
      # outstanding_balance_cents = sum of total_amount_cents over open_invoices
      # billed_cents              = sum of total_amount_cents over open_invoices
      #                             + sum of total_amount_cents over paid_invoices
      # collected_cents           = sum of amount_paid_cents over paid_invoices
      # collection_ratio          = round_half_up(collected_cents / billed_cents, 4),
      #                             or 0.0000 when billed_cents == 0
      # oldest_open_due_date      = min(due_date) over open_invoices, or null when empty
      # VOID invoices enter no aggregate. Every aggregate here is a sum or a
      # minimum, so the result is independent of processing order and no
      # tie-break applies.
    input_set: "this partner's invoices at status ISSUED, OVERDUE or PAID; VOID invoices are excluded"
    constants:
      RATIO_SCALE: 4
      PARTNER_CREDIT_CEILING_CENTS: 750000
    precision: "integer cents; ratio to 4 decimal places, round_half_up"

  - name: tuition_credit_value
    trigger: "computed when a credit grant is created, and re-read whenever the student's phase changes"
    algorithm: threshold
    formula: |
      # Pinned evaluation order:
      # 1. included = this student's credit grants whose status IN {PENDING, GRANTED}
      # 2. per_grant_cents = min(round_half_up(credit_hours * TUITION_CENTS_PER_CREDIT),
      #                          TUITION_CREDIT_CAP_CENTS)
      # 3. subtotal = sum of per_grant_cents over included
      # 4. graduation_bonus_cents = GRADUATION_BONUS_CENTS when the student's
      #    current_phase == COMPLETED else 0
      # 5. total_tuition_credit_cents = subtotal + graduation_bonus_cents
      # The per-grant cap is applied before summing; capping the sum instead
      # produces different values.
    input_set: "credit grants at status PENDING or GRANTED; VOID grants are excluded"
    constants:
      TUITION_CENTS_PER_CREDIT: 12500
      TUITION_CREDIT_CAP_CENTS: 500000
      GRADUATION_BONUS_CENTS: 50000
    precision: "integer cents, round_half_up"
    variants:
      - name: cap_per_grant
        when: "always; this is the pinned variant"
        difference: "two grants of 48 credit hours each contribute 500000 cents each, not 1200000 cents in total"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role is present and names a role declared in §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 401
    applies_to: "all endpoints except POST /students (anonymous registration)"
  - priority: 2
    category: auth
    check: "X-User-ID is present for every role other than Anonymous, and for entity_backed roles it equals the id of an existing instance of the backing entity"
    error_id: ERR_UNAUTHORIZED
    http_status: 401
    applies_to: "all endpoints except POST /students (anonymous registration)"
  - priority: 3
    category: existence
    check: "every path resource exists, validated left-to-right along the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 4
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row (cohort_id, partner_id, agreement_id, student_id, placement_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "POST /students/{id}/enrollments, POST /agreements, POST /placements, POST /stipend-statements, POST /satisfaction-records, POST /invoices, POST /credit-grants, POST /outcome-checkpoints/{id}/records"
  - priority: 5
    category: business_constraint
    check: "the request body is well formed: required fields present, enum fields carry a declared member, hours_expected is greater than zero, credit_hours is greater than zero, period_end is at least 7 days after period_start, agreement end_date is at least 28 days after start_date, ratings lie in 0.00-5.00, and an EMPLOYED checkpoint carries a positive hourly_wage_cents"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all endpoints with a request body"
  - priority: 6
    category: state
    check: "the target resource is in a state that admits the requested transition per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: state
    check: "the target resource is not already terminal (Student INELIGIBLE, StipendStatement PAID or VOID, Invoice PAID or VOID, CreditGrant GRANTED or VOID, InternshipPlacement TERMINATED)"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 8
    category: state
    check: "the acting user is permitted to act on this specific row: an entity_backed actor's X-User-ID must equal the owning foreign key on the target (Student on their own enrollment, offer acceptance and checkpoint recording; Partner on the interview outcome and satisfaction records of their own agreements' placements)"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "POST /placements/{id}/acceptance, POST /students/{id}/enrollments, POST /outcome-checkpoints/{id}/records, POST /interviews/{id}/outcomes, POST /satisfaction-records"
  - priority: 9
    category: state
    check: "the resource's parent aggregate is in the state the transition requires (Agreement ACTIVE for interview scheduling and offers, ACTIVE or FULFILLED for offer acceptance; Cohort PLANNED or ACTIVE for enrollment; the student's placement ACCEPTED or ACTIVE for an INTERNSHIP-phase statement)"
    error_id: ERR_PARENT_STATE_CONFLICT
    http_status: 409
    applies_to: "POST /placements/{id}/interviews, POST /placements/{id}/offers, POST /placements/{id}/acceptance, POST /students/{id}/enrollments, POST /stipend-statements"
  - priority: 10
    category: business_safety
    check: "the student is 18 or older at the logical-clock date"
    error_id: ERR_AGE_INELIGIBLE
    http_status: 422
    applies_to: "POST /students/{id}/eligibility-decisions, POST /students/{id}/enrollments"
  - priority: 11
    category: business_safety
    check: "the student's education_status is one of NO_DIPLOMA, HS_DIPLOMA, SOME_COLLEGE or ASSOCIATE"
    error_id: ERR_EDUCATION_INELIGIBLE
    http_status: 422
    applies_to: "POST /students/{id}/eligibility-decisions, POST /students/{id}/enrollments"
  - priority: 12
    category: business_safety
    check: "the student's household_income_cents is at or below the income ceiling"
    error_id: ERR_INCOME_INELIGIBLE
    http_status: 422
    applies_to: "POST /students/{id}/eligibility-decisions, POST /students/{id}/enrollments"
  - priority: 13
    category: business_referential
    check: "the placement's student is eligible for matching: application_state ENROLLED with current_phase INTERNSHIP, or current_phase COMPLETED"
    error_id: ERR_NOT_ELIGIBLE_FOR_MATCH
    http_status: 409
    applies_to: "POST /placements"
  - priority: 14
    category: business_referential
    check: "the agreement's negotiated fee_tier matches the partner's current fee_tier"
    error_id: ERR_FEE_TIER_MISMATCH
    http_status: 409
    applies_to: "POST /agreements/{id}/activations"
  - priority: 15
    category: business_fiscal
    check: "the partner's credit_hold is false"
    error_id: ERR_PARTNER_CREDIT_HOLD
    http_status: 402
    applies_to: "POST /agreements/{id}/activations"
  - priority: 16
    category: business_fiscal
    check: "the partner's status is ACTIVE"
    error_id: ERR_PARTNER_SUSPENDED
    http_status: 402
    applies_to: "POST /agreements/{id}/activations, POST /placements, POST /placements/{id}/offers"
  - priority: 17
    category: business_fiscal
    check: "the partner has no invoice at status OVERDUE whose due_date is strictly before the logical-clock date minus 14 days"
    error_id: ERR_PARTNER_PAST_DUE
    http_status: 402
    applies_to: "POST /placements/{id}/offers"
  - priority: 18
    category: business_fiscal
    check: "the partner's outstanding_balance_cents plus the new invoice total does not exceed the partner credit ceiling"
    error_id: ERR_PARTNER_CREDIT_LIMIT
    http_status: 402
    applies_to: "POST /invoices"
  - priority: 19
    category: business_fiscal
    check: "the accepted placement window lies inside the sponsoring agreement's [start_date, end_date] window and hours_per_week is at least 20"
    error_id: ERR_PLACEMENT_WINDOW_INVALID
    http_status: 409
    applies_to: "POST /placements/{id}/acceptance"
  - priority: 20
    category: business_fiscal
    check: "amount_paid_cents matches the invoice total_amount_cents"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /invoices/{id}/payments"
  - priority: 21
    category: business_constraint
    check: "the resource's capacity is not exhausted (cohort.enrolled_count < cohort.capacity for enrollment; the count of placements at ACCEPTED, ACTIVE or COMPLETED below agreement.slot_count for matching)"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /students/{id}/enrollments, POST /placements"
  - priority: 22
    category: business_constraint
    check: "the student holds no other placement at state ACCEPTED or ACTIVE"
    error_id: ERR_STUDENT_ALREADY_PLACED
    http_status: 409
    applies_to: "POST /placements/{id}/acceptance, POST /placements"
  - priority: 23
    category: business_temporal
    check: "the proposed interview slot does not overlap an existing interview round with the same supervisor_name"
    error_id: ERR_INTERVIEW_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /placements/{id}/interviews"
  - priority: 24
    category: business_temporal
    check: "the stipend period does not overlap an existing statement of the same student and phase whose status is PENDING or PAID"
    error_id: ERR_STIPEND_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /stipend-statements"
  - priority: 25
    category: business_constraint
    check: "the interview round count has not reached the placement's max_interview_rounds"
    error_id: ERR_INTERVIEW_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /placements/{id}/interviews"
  - priority: 26
    category: business_constraint
    check: "no other student already carries the same email"
    error_id: ERR_DUPLICATE_EMAIL
    http_status: 409
    applies_to: "POST /students"
  - priority: 27
    category: business_constraint
    check: "the supplied expected_partner_version equals the partner's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /invoices, POST /agreements/{id}/activations"
endpoints:
  - method: POST
    path: "/partners"
    description: "Register a corporate employer partner"
    roles: [ProgramStaff]
    code: 201
    input: [legal_name, industry, billing_email, "fee_tier?"]
    output: Partner
    side_effects: ["status starts ACTIVE; placement_quality_score 0.00, on_time_payment_ratio 0.0000, credit_hold false, all billing totals 0"]
  - method: GET
    path: "/partners/{id}"
    description: "Read a partner including its derived billing fields"
    roles: [ProgramStaff, Partner]
    code: 200
    input: []
    output: Partner
    side_effects: []
  - method: GET
    path: "/partners/{id}/agreements"
    description: "List the agreements drafted under a partner, optionally filtered by status"
    roles: [ProgramStaff, Partner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Agreement[]
    side_effects: []
  - method: POST
    path: "/students"
    description: "Register a student applicant; anonymous, no credentials"
    roles: [Anonymous]
    code: 201
    input: [full_name, email, date_of_birth, education_status, household_income_cents]
    output: Student
    side_effects: ["application_state starts APPLIED; current_phase is null; roster_status ON_TRACK; lifetime_contract_points 0"]
  - method: GET
    path: "/students/{id}"
    description: "Read a student record"
    roles: [ProgramStaff, Student]
    code: 200
    input: []
    output: Student
    side_effects: []
  - method: POST
    path: "/students/{id}/eligibility-decisions"
    description: "Record the selection decision for an applicant; a failing criterion is reported by its own error and leaves the applicant APPLIED"
    roles: [ProgramStaff]
    code: 200
    input: [decision, "reason?"]
    output: Student
    side_effects: ["APPLIED -> ELIGIBLE when decision is ELIGIBLE and every criterion passes", "APPLIED -> INELIGIBLE when decision is INELIGIBLE"]
  - method: POST
    path: "/students/{id}/enrollments"
    description: "Enroll an eligible student into a cohort; consumes one seat"
    roles: [ProgramStaff]
    code: 200
    input: [cohort_id, track_code]
    output: Student
    side_effects: ["ELIGIBLE -> ENROLLED", "current_phase becomes L_AND_D", "Cohort.enrolled_count increments by 1", "Cohort.status becomes ACTIVE when it was PLANNED"]
  - method: POST
    path: "/cohorts"
    description: "Create a learning-and-development cohort"
    roles: [ProgramStaff]
    code: 201
    input: [program_code, location_code, start_date, "capacity?"]
    output: Cohort
    side_effects: ["graduation_date is start_date plus 180 days", "status starts PLANNED", "enrolled_count starts 0"]
  - method: GET
    path: "/cohorts/{id}"
    description: "Read a cohort including derived enrolled_count, graduation_date, status and awarded contract points"
    roles: [ProgramStaff, Student]
    code: 200
    input: []
    output: Cohort
    side_effects: []
  - method: GET
    path: "/cohorts/{id}/students"
    description: "List the students enrolled in a cohort"
    roles: [ProgramStaff]
    code: 200
    input: ["limit?", "offset?"]
    output: Student[]
    side_effects: []
  - method: POST
    path: "/agreements"
    description: "Draft a corporate partner placement agreement"
    roles: [ProgramStaff]
    code: 201
    input: [partner_id, project_scope, supervision_hours_per_week, slot_count, fee_tier, start_date, end_date]
    output: Agreement
    side_effects: ["status starts DRAFT"]
  - method: POST
    path: "/agreements/{id}/activations"
    description: "Activate a drafted agreement; validates supervision commitment, window length, the negotiated fee tier and the partner's billing standing"
    roles: [ProgramStaff]
    code: 200
    input: [expected_partner_version]
    output: Agreement
    side_effects: ["DRAFT -> ACTIVE", "increments Partner.version by 1"]
  - method: POST
    path: "/placements"
    description: "Match a student to an agreement; consumes one agreement slot"
    roles: [ProgramStaff]
    code: 201
    input: [agreement_id, student_id, "max_interview_rounds?"]
    output: InternshipPlacement
    side_effects: ["state starts MATCHED", "project_scope is copied from the agreement", "supervisor_name is copied from the agreement's partner", "interview_attempt starts 0"]
  - method: GET
    path: "/placements/{id}"
    description: "Read a single placement including its derived fee, outcome and satisfaction score"
    roles: [ProgramStaff, Partner, Student]
    code: 200
    input: []
    output: InternshipPlacement
    side_effects: []
  - method: GET
    path: "/placements"
    description: "List placements filtered by student, agreement or state"
    roles: [ProgramStaff, Partner, Student]
    code: 200
    input: ["student_id?", "agreement_id?", "state?", "limit?", "offset?"]
    output: InternshipPlacement[]
    side_effects: []
  - method: POST
    path: "/placements/{id}/interviews"
    description: "Schedule an interview round for a matched or failed-round placement"
    roles: [ProgramStaff]
    code: 201
    input: [scheduled_for, "duration_minutes?", supervisor_name]
    output: InterviewRound
    side_effects: ["MATCHED -> INTERVIEW_SCHEDULED", "INTERVIEWED -> INTERVIEW_SCHEDULED when the latest round failed and rounds remain", "round_number is interview_attempt + 1", "outcome starts PENDING"]
  - method: GET
    path: "/placements/{id}/interviews"
    description: "List the interview rounds of a placement in round_number order"
    roles: [ProgramStaff, Partner]
    code: 200
    input: ["limit?", "offset?"]
    output: InterviewRound[]
    side_effects: []
  - method: POST
    path: "/interviews/{id}/outcomes"
    description: "Record the partner's interview outcome; a failure on the final allowed round returns the placement to the matching pool"
    roles: [Partner]
    code: 200
    input: [outcome, "feedback?"]
    output: InterviewRound
    side_effects: ["InterviewRound.outcome is set", "INTERVIEW_SCHEDULED -> INTERVIEWED when outcome is PASSED", "INTERVIEW_SCHEDULED -> INTERVIEWED when outcome is FAILED and rounds remain", "INTERVIEW_SCHEDULED -> MATCHED when outcome is FAILED and the round is the last allowed one", "InternshipPlacement.interview_attempt increments by 1"]
  - method: POST
    path: "/placements/{id}/offers"
    description: "Extend a placement offer after a passed interview; computes the placement fee from the agreement window"
    roles: [ProgramStaff]
    code: 200
    input: []
    output: InternshipPlacement
    side_effects: ["INTERVIEWED -> OFFERED", "placement_fee_cents is computed from the agreement window and tier"]
  - method: POST
    path: "/placements/{id}/acceptance"
    description: "The matched student accepts the offer with concrete dates; recomputes the fee and may activate the placement in the same request"
    roles: [Student]
    code: 200
    input: [start_date, end_date, "hours_per_week?"]
    output: InternshipPlacement
    side_effects: ["OFFERED -> ACCEPTED", "placement_fee_cents is recomputed from the accepted window", "the sponsoring agreement becomes FULFILLED when its ACCEPTED, ACTIVE or COMPLETED placement count reaches slot_count", "the placement advances ACCEPTED -> ACTIVE in the same request when the logical-clock date is on or after start_date and the agreement is ACTIVE or FULFILLED"]
  - method: POST
    path: "/placements/{id}/completions"
    description: "Close an active placement and record the conversion outcome"
    roles: [ProgramStaff]
    code: 200
    input: [outcome]
    output: InternshipPlacement
    side_effects: ["ACTIVE -> COMPLETED", "Student.conversion_streak increments by 1 for CONVERTED and resets to 0 for NOT_CONVERTED", "SatisfactionRecord.converted_to_hire is set on this placement's records for CONVERTED", "InternshipPlacement.satisfaction_score is set from the latest satisfaction record", "Student.current_phase advances INTERNSHIP -> COMPLETED and three outcome checkpoints are created when this completion leaves the student with no non-terminal placement", "the agreement becomes FULFILLED when its ACCEPTED, ACTIVE or COMPLETED placement count reaches slot_count"]
  - method: POST
    path: "/placements/{id}/terminations"
    description: "Terminate a placement from any non-terminal state; releases the agreement slot when the agreement was fulfilled"
    roles: [ProgramStaff]
    code: 200
    input: ["reason?"]
    output: InternshipPlacement
    side_effects: ["any non-terminal state -> TERMINATED", "the sponsoring agreement returns FULFILLED -> ACTIVE when its ACCEPTED, ACTIVE or COMPLETED placement count drops below slot_count"]
  - method: POST
    path: "/stipend-statements"
    description: "Create a stipend statement for an L&D or internship period; all amounts are computed at creation"
    roles: [ProgramStaff]
    code: 201
    input: [student_id, phase, period_start, period_end, hours_attended, hours_expected, "behavior_incidents?"]
    output: StipendStatement
    side_effects: ["attendance_ratio, gross_amount_cents, both deductions, net_amount_cents and contract_points_earned are computed", "status starts PENDING"]
  - method: GET
    path: "/students/{id}/stipend-statements"
    description: "List a student's stipend statements, optionally filtered by phase or status"
    roles: [ProgramStaff, Student]
    code: 200
    input: ["phase?", "status?", "limit?", "offset?"]
    output: StipendStatement[]
    side_effects: []
  - method: POST
    path: "/stipend-statements/{id}/payments"
    description: "Pay a pending stipend statement; credits the student's totals and may advance the program phase"
    roles: [ProgramStaff]
    code: 200
    input: []
    output: StipendStatement
    side_effects: ["PENDING -> PAID", "Student.total_stipend_paid_cents increases by net_amount_cents", "Student.lifetime_contract_points increases by contract_points_earned", "Student.roster_status becomes DISMISSED when attendance_ratio is below 0.50", "Student.roster_status becomes PROBATION when attendance_ratio is at or above 0.50 and lifetime_contract_points is below 12", "Student.current_phase advances L_AND_D -> INTERNSHIP when lifetime_contract_points reaches 12 and roster_status is not DISMISSED", "Cohort.awarded_points is recomputed for the student's cohort"]
  - method: POST
    path: "/stipend-statements/{id}/voids"
    description: "Void a pending stipend statement; the compensating action for a mis-issued statement"
    roles: [ProgramStaff]
    code: 200
    input: ["reason?"]
    output: StipendStatement
    side_effects: ["PENDING -> VOID", "the statement stops contributing to every student total and to Cohort.awarded_points"]
  - method: POST
    path: "/satisfaction-records"
    description: "The hosting partner rates a placement; the composite is mirrored onto the placement and the partner"
    roles: [Partner]
    code: 201
    input: [placement_id, supervisor_rating, project_rating, communication_rating]
    output: SatisfactionRecord
    side_effects: ["composite_score is computed", "InternshipPlacement.satisfaction_score is set to the composite", "Partner.placement_quality_score is set to the composite", "submitted_at is stamped from the logical clock"]
  - method: GET
    path: "/placements/{id}/satisfaction-records"
    description: "List the satisfaction records submitted for a placement, newest first"
    roles: [ProgramStaff, Partner]
    code: 200
    input: ["limit?", "offset?"]
    output: SatisfactionRecord[]
    side_effects: []
  - method: POST
    path: "/invoices"
    description: "Issue a placement fee invoice to a partner; guarded by the partner's OCC version"
    roles: [ProgramStaff]
    code: 201
    input: [partner_id, placement_id, due_date, expected_partner_version]
    output: Invoice
    side_effects: ["status starts ISSUED", "total_amount_cents is copied from the placement's placement_fee_cents", "Partner.outstanding_balance_cents and Partner.billed_cents are recomputed", "Partner.oldest_open_due_date is recomputed", "increments Partner.version by 1"]
  - method: GET
    path: "/invoices"
    description: "List invoices filtered by partner, placement or status"
    roles: [ProgramStaff, Partner]
    code: 200
    input: ["partner_id?", "placement_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: GET
    path: "/invoices/{id}"
    description: "Read a single invoice"
    roles: [ProgramStaff, Partner]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: POST
    path: "/invoices/{id}/payments"
    description: "Record full payment of an issued or overdue invoice"
    roles: [ProgramStaff]
    code: 200
    input: [amount_paid_cents, paid_on]
    output: Invoice
    side_effects: ["ISSUED or OVERDUE -> PAID", "Partner.on_time_payment_ratio, Partner.collected_cents, Partner.collection_ratio and Partner.outstanding_balance_cents are recomputed", "Partner.credit_hold is cleared when no overdue invoice remains", "Partner.status returns to ACTIVE when no invoice overdue by more than 30 days remains"]
  - method: POST
    path: "/invoices/{id}/voids"
    description: "Void an unpaid invoice; the compensating action that restores the partner's billing totals"
    roles: [ProgramStaff]
    code: 200
    input: ["reason?"]
    output: Invoice
    side_effects: ["ISSUED or OVERDUE -> VOID", "Partner.outstanding_balance_cents, Partner.billed_cents and Partner.oldest_open_due_date are recomputed"]
  - method: POST
    path: "/outcome-checkpoints/{id}/records"
    description: "Record the graduate's employment status and wage at a checkpoint"
    roles: [Student]
    code: 200
    input: [employment_status, "hourly_wage_cents?", "recorded_at?"]
    output: OutcomeCheckpoint
    side_effects: ["employment_status and hourly_wage_cents are recorded", "recorded_at is stamped from the logical clock when omitted"]
  - method: GET
    path: "/students/{id}/outcome-checkpoints"
    description: "List a student's post-program outcome checkpoints ordered by interval_months ascending"
    roles: [ProgramStaff, Student]
    code: 200
    input: ["limit?", "offset?"]
    output: OutcomeCheckpoint[]
    side_effects: []
  - method: POST
    path: "/credit-grants"
    description: "Register a college credit grant from a higher-education partner"
    roles: [ProgramStaff]
    code: 201
    input: [student_id, college_partner_name, credit_hours]
    output: CreditGrant
    side_effects: ["status starts PENDING", "tuition_credit_cents is computed"]
  - method: GET
    path: "/students/{id}/credit-grants"
    description: "List a student's college credit grants, optionally filtered by status"
    roles: [ProgramStaff, Student]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CreditGrant[]
    side_effects: []
  - method: PATCH
    path: "/credit-grants/{id}"
    description: "Advance a pending credit grant to GRANTED or void it"
    roles: [ProgramStaff]
    code: 200
    input: [status, "reason?"]
    output: CreditGrant
    side_effects: ["PENDING -> GRANTED or PENDING -> VOID", "the student's tuition credit total changes accordingly"]
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock. The server starts with the logical clock fixed at 2026-09-01T00:00:00Z and never falls back to wall-clock time."
    roles: [ProgramStaff]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["every later deadline, window and interval check is evaluated against the new logical time"]
errors:
  - id: ERR_UNAUTHORIZED
    http: 401
    condition: "X-User-Role is missing or unknown, or X-User-ID is missing or does not resolve to an instance of the role's backing entity"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a path resource or a body-supplied foreign key does not resolve to an existing row"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "a required field is absent, an enum field carries an undeclared member, a numeric field is out of range, or a date span is shorter than its declared minimum"
  - id: ERR_DUPLICATE_EMAIL
    http: 409
    condition: "POST /students carries an email already held by another student"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target row's current state has no transition for the requested action"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "the target row sits in a terminal state and the requested action would move it again"
  - id: ERR_NOT_OWNER
    http: 403
    condition: "an entity_backed actor's X-User-ID is not the owner recorded on the target row"
  - id: ERR_PARENT_STATE_CONFLICT
    http: 409
    condition: "the parent aggregate (agreement, cohort or placement) is not in a state that permits the child operation"
  - id: ERR_AGE_INELIGIBLE
    http: 422
    condition: "the applicant's age at the logical-clock date is below 18"
  - id: ERR_EDUCATION_INELIGIBLE
    http: 422
    condition: "the applicant's education_status is BACHELOR_OR_HIGHER"
  - id: ERR_INCOME_INELIGIBLE
    http: 422
    condition: "the applicant's household_income_cents exceeds the income ceiling"
  - id: ERR_NOT_ELIGIBLE_FOR_MATCH
    http: 409
    condition: "the student is not ENROLLED with current_phase INTERNSHIP or COMPLETED, so no placement may be matched"
  - id: ERR_FEE_TIER_MISMATCH
    http: 409
    condition: "the agreement's negotiated fee_tier differs from the partner's current fee_tier at activation"
  - id: ERR_PARTNER_CREDIT_HOLD
    http: 402
    condition: "the partner carries an invoice at status OVERDUE whose due date is strictly before the logical-clock date, so its credit_hold is true"
  - id: ERR_PARTNER_SUSPENDED
    http: 402
    condition: "the partner's status is SUSPENDED because it carries an invoice at status OVERDUE whose due date is more than 30 days before the logical-clock date"
  - id: ERR_PARTNER_PAST_DUE
    http: 402
    condition: "the partner carries an invoice at status OVERDUE whose due date is strictly more than 14 days before the logical-clock date"
  - id: ERR_PARTNER_CREDIT_LIMIT
    http: 402
    condition: "the partner's outstanding_balance_cents plus the new invoice total would exceed the partner credit ceiling"
  - id: ERR_PLACEMENT_WINDOW_INVALID
    http: 409
    condition: "the accepted window is not inside the agreement window, or hours_per_week is below 20"
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 422
    condition: "amount_paid_cents does not equal the invoice's total_amount_cents"
  - id: ERR_CAPACITY_EXCEEDED
    http: 409
    condition: "the cohort has no free seat, or the agreement has no free placement slot"
  - id: ERR_STUDENT_ALREADY_PLACED
    http: 409
    condition: "the student already holds a placement at state ACCEPTED or ACTIVE"
  - id: ERR_INTERVIEW_SLOT_CONFLICT
    http: 409
    condition: "the proposed interview slot overlaps an existing interview round booked with the same supervisor_name"
  - id: ERR_STIPEND_PERIOD_OVERLAP
    http: 409
    condition: "the stipend period overlaps an existing PENDING or PAID statement of the same student and phase"
  - id: ERR_INTERVIEW_ROUNDS_EXHAUSTED
    http: 409
    condition: "the placement has already used all of its allowed interview rounds"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "the request's expected_partner_version does not match the partner's current version"

roles:
  - name: Anonymous
    description: "Unauthenticated applicant submitting a program application"
    identity: "opaque"
    exclusive_operations: ["POST /students"]
    shared_operations: []
  - name: ProgramStaff
    description: "Program operator who runs selection, enrollment, matching, stipend administration and partner billing"
    identity: "opaque"
    exclusive_operations:
      - "POST /partners"
      - "POST /students/{id}/eligibility-decisions"
      - "POST /students/{id}/enrollments"
      - "POST /cohorts"
      - "POST /agreements"
      - "POST /agreements/{id}/activations"
      - "POST /placements"
      - "POST /placements/{id}/interviews"
      - "POST /placements/{id}/offers"
      - "POST /placements/{id}/completions"
      - "POST /placements/{id}/terminations"
      - "POST /stipend-statements"
      - "POST /stipend-statements/{id}/payments"
      - "POST /stipend-statements/{id}/voids"
      - "POST /invoices"
      - "POST /invoices/{id}/payments"
      - "POST /invoices/{id}/voids"
      - "POST /credit-grants"
      - "PATCH /credit-grants/{id}"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /partners/{id}"
      - "GET /partners/{id}/agreements"
      - "GET /students/{id}"
      - "GET /students/{id}/stipend-statements"
      - "GET /students/{id}/outcome-checkpoints"
      - "GET /students/{id}/credit-grants"
      - "GET /cohorts/{id}"
      - "GET /cohorts/{id}/students"
      - "GET /placements/{id}"
      - "GET /placements"
      - "GET /placements/{id}/interviews"
      - "GET /placements/{id}/satisfaction-records"
      - "GET /invoices"
      - "GET /invoices/{id}"
  - name: Partner
    description: "Corporate employer partner that hosts interns, rates placements and pays invoices"
    identity: "entity_backed:Partner"
    exclusive_operations:
      - "POST /interviews/{id}/outcomes"
      - "POST /satisfaction-records"
    shared_operations:
      - "GET /partners/{id}"
      - "GET /partners/{id}/agreements"
      - "GET /placements"
      - "GET /placements/{id}"
      - "GET /placements/{id}/interviews"
      - "GET /placements/{id}/satisfaction-records"
      - "GET /invoices"
      - "GET /invoices/{id}"
  - name: Student
    description: "Enrolled program participant who accepts offers, records outcomes and reads their own record"
    identity: "entity_backed:Student"
    exclusive_operations:
      - "POST /placements/{id}/acceptance"
      - "POST /outcome-checkpoints/{id}/records"
    shared_operations:
      - "GET /students/{id}"
      - "GET /students/{id}/stipend-statements"
      - "GET /students/{id}/outcome-checkpoints"
      - "GET /students/{id}/credit-grants"
      - "GET /cohorts/{id}"
      - "GET /placements"
      - "GET /placements/{id}"
