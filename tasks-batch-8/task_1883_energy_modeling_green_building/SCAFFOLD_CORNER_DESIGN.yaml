        claim_type: violation_to_error
        grounds: ["validations[priority=1.5]", "errors[ERR_INVALID_REQUEST]", "entities.CreditAttempt.fields.raw_points_earned"]
        distinguishing_aspect: "Awarding raw_points_earned 3 on a 2-point credit fails with 400 ERR_INVALID_REQUEST (0..points_possible range)."
