  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: offer_window_half_open_adjacency
        grounds:
          - validations[priority=8]
          - entities.SurplusOffer.fields.window_start
        distinguishing_aspect: |
          Resource: (Farm, crop_code) pair; semantics: half-open intervals
          [window_start, window_end) where ADJACENCY (end == start) is
          permitted. Offer A [08-05, 08-10) and offer B starting exactly
          08-10T00:00:00Z coexist; offer C starting 08-09T23:59:59Z is rejected
          ERR_OFFER_WINDOW_OVERLAP. Half-open adjacency is a different interval
          semantic from the aggregate-capacity semantics of the vehicle case.
        test_recipe:
          setup:
            - "Farm FM; offer A ROOT_VEG [2026-08-05T00:00:00Z, 2026-08-10T00:00:00Z)"
          setup_api_calls:
            - call: "POST /glean/farms"
              payload: { farm_name: "FM", contact_email: "fm@x.com", county_code: "MMM", donor_tin: "13-3456789" }
              as: ProgramCoordinator
              captures: { farm_id: $.data.id }
            - call: "POST /glean/offers"
              payload: { farm_id: "${farm_id}", crop_code: "ROOT_VEG", estimated_lbs: 100.0, window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-10T00:00:00Z", perishability_class: "LOW", requires_refrigeration: false }
              as: ProgramCoordinator
              captures: { offer_a: $.data.id }
          trigger:
            - call: "POST /glean/offers"
              payload: { farm_id: "${farm_id}", crop_code: "ROOT_VEG", estimated_lbs: 80.0, window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-15T00:00:00Z", perishability_class: "LOW", requires_refrigeration: false }
              as: ProgramCoordinator
              captures: { offer_b: $.data.id }
            - call: "POST /glean/offers"
              payload: { farm_id: "${farm_id}", crop_code: "ROOT_VEG", estimated_lbs: 60.0, window_start: "2026-08-09T23:59:59Z", window_end: "2026-08-16T00:00:00Z", perishability_class: "LOW", requires_refrigeration: false }
              as: ProgramCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "offer_b created (adjacent at exactly 2026-08-10T00:00:00Z == A.window_end — half-open adjacency permitted)"
            - "err_id == ERR_OFFER_WINDOW_OVERLAP (2026-08-09T23:59:59Z < A.window_end 2026-08-10T00:00:00Z and overlaps A)"

      - name: vehicle_assignment_state_gated_overlap
        grounds:
          - validations[priority=10]
          - entities.Vehicle.fields.status
        distinguishing_aspect: |
          Resource: Vehicle; semantics: state-filtered overlap — only events in
          {OPEN, FULL, IN_PROGRESS, HARVESTED} count as occupying the vehicle;
          a CANCELLED or RECONCILED event frees the slot even though its
          recorded interval still overlaps the new event's interval. This
          state-keyed occupation filter differs from the pure geometric
          half-open adjacency of the offer-window instance.
        test_recipe:
          setup:
            - "Vehicle VH assigned to event E1 [08-10 08:00,12:00) which is then CANCELLED; new event E2 [08-10 09:00,13:00) on a different offer reuses VH"
          setup_api_calls:
            - call: "POST /glean/farms"
              payload: { farm_name: "FO", contact_email: "fo@x.com", county_code: "OOO", donor_tin: "14-3456789" }
              as: ProgramCoordinator
              captures: { farm_id: $.data.id }
            - call: "POST /glean/vehicles"
              payload: { plate: "PO", payload_capacity_lbs: 5000, refrigerated: false }
              as: ProgramCoordinator
              captures: { veh_id: $.data.id }
            - call: "POST /glean/volunteers"
              payload: { full_name: "Lead O", email: "leado@x.com", crew_leader_certified: true }
