            - call: "POST /water-service/emergency-tickets/${tkt_t}/diagnosis"
              payload: { cause_class: "TREATMENT_FAILURE", onsite_estimate_cents: 20000 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /water-service/emergency-tickets"
              payload: { property_id: "${prop_id}", well_profile_id: "${well_p}", account_id: "${acct_id}", reported_outage_hours: 2.0 }
              as: Dispatcher
              captures: { tkt_p: $.data.id }
            - call: "POST /water-service/emergency-tickets/${tkt_p}/triage"
              payload: {}
              as: Dispatcher
            - call: "POST /water-service/emergency-tickets/${tkt_p}/dispatch"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
            - call: "POST /water-service/emergency-tickets/${tkt_p}/arrive"
              payload: {}
