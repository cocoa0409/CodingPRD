          - entities.CatastropheZone.fields.status
          - entities.MemberInsurer.fields.takeout_credit_count
        distinguishing_aspect: |
          Depth 4, triggered by POST /fair-plan/takeout-offers/{id}/election with election ACCEPT: hop 1
          TakeoutOffer OUTSTANDING -> ACCEPTED, hop 2 caused by hop 1 moves the Policy coverage_status
          IN_FORCE -> TAKEN_OUT with a TAKEOUT_ELECTION refund, hop 3 caused by hop 2 drops
          CatastropheZone.aggregate_insured_value_cents from 85000000 to 0, hop 4 caused by hop 3 flips
