          - calculations.agent_territory_precedence
        distinguishing_aspect: "The territory gate is evaluated at priority 7 after existence and state, so an origin state outside the agent's declared territory is a 422 ERR_TERRITORY_VIOLATION while an in-territory promote on the same chain succeeds."
        test_recipe:
          setup:
