# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2505 — Regional Airline Capacity Purchase Agreement
# Nine §0.5 rule blocks; every instance grounds in SCAFFOLD.yaml §1.1–§1.7.
# Every numeric assert below was executed against the §1.3 formulas in Python
# (round_half_up, 2dp money, 3dp block hours) before being written down.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: invoice_provisional_vs_final_component_divergence
        grounds:
          - calculations.invoice_settlement
          - calculations.variable_flight_payment
          - calculations.passthrough_reconciliation_settlement
          - entities.Invoice.fields.variant
          - state_machines.ScheduleCycle.OPEN_to_CLOSED
          - concurrency_rules[invoice-create-stale-cycle]
        distinguishing_aspect: |
          Money domain: the same cycle billed twice diverges in FOUR components at
          once — variable_component_usd 6617.93 (PLANNED_BASIS over SCHEDULED+
          COMPLETED legs) vs 6440.94 (ACTUAL_BASIS over COMPLETED legs only),
          passthrough_component_usd 95000.00 (raw estimate) vs 101970.00
          (reconciled base + admin fee), incentive_component_usd 0.00 vs 15922.05,
          and total_usd 413617.93 vs 436332.99.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "ACTIVE agreement: fixed 250000.00, block-hour 1450.75, departure 320.00, ownership fee 62000.00, incentive cap 90000.00, penalty cap 120000.00."
            - "One ACTIVE crew base with one LINE_QUALIFIED captain and one REGIONAL_OWNED tail IN_SERVICE (so ownership_aircraft_count == 1 and fixed_component_usd == 312000.00)."
            - "OPEN cycle 2026-09 with published_departures 100; legs L1/L2/L3 COMPLETED (actual 1.155 / 2.007 / 0.616 block hours, all on time) and L4 CANCELLED."
            - "Three pass-through claims RECONCILED: FUEL 85000.00 est / 88500.00 actual, AIRPORT_FEES 8000.00 / 9200.00, INSURANCE 2000.00 / 1700.00 — estimated total 95000.00, settlement 101970.00."
            - "A PROVISIONAL invoice already raised while the cycle was OPEN; the cycle then CLOSED with a PUBLISHED scorecard."
          setup_api_calls:
            - call: "POST /cpa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CPAAdministrator
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2029-12-31" }
              as: CPAAdministrator
              captures: { ag: $.data.id }
            - call: "POST /cpa/crew-bases"
              payload: { agreement_id: "${ag}", station_code: "ORD", pilots_required_per_aircraft: 1, aircraft_allocation_cap: 4 }
              as: RegionalOpsController
              captures: { base: $.data.id }
            - call: "POST /cpa/agreements/${ag}/activate"
              payload: {}
              as: CPAAdministrator
            - call: "POST /cpa/pilots"
              payload: { base_id: "${base}", employee_ref: "EMP-1001", seat: "CAPTAIN", hire_class_date: "2026-06-01" }
              as: RegionalOpsController
              captures: { p1: $.data.id }
            - call: "POST /cpa/pilots/${p1}/advance"
              payload: { to_status: "IN_TRAINING" }
              as: BaseChiefPilot
              as_user_id: "${base}"
            - call: "POST /cpa/pilots/${p1}/advance"
              payload: { to_status: "LINE_QUALIFIED" }
              as: BaseChiefPilot
              as_user_id: "${base}"
            - call: "POST /cpa/aircraft"
              payload: { agreement_id: "${ag}", assigned_base_id: "${base}", tail_number: "N101RG", seat_count: 76, ownership: "REGIONAL_OWNED" }
              as: RegionalOpsController
              captures: { ac1: $.data.id }
            - call: "POST /cpa/aircraft/${ac1}/induct"
              payload: {}
              as: RegionalOpsController
            - call: "POST /cpa/schedule-cycles"
              payload: { agreement_id: "${ag}", cycle_month: "2026-09", published_departures: 100 }
              as: MainlineScheduler
              captures: { cyc: $.data.id }
            - call: "POST /cpa/schedule-cycles/${cyc}/open"
              payload: {}
              as: MainlineScheduler
            - call: "POST /cpa/flight-legs"
              payload: { cycle_id: "${cyc}", aircraft_id: "${ac1}", captain_pilot_id: "${p1}", flight_number: "SM4101", origin: "ORD", destination: "DSM", scheduled_departure_utc: "2026-09-02T08:00:00Z", scheduled_arrival_utc: "2026-09-02T09:12:00Z", planned_block_hours: 1.200 }
              as: MainlineScheduler
              captures: { l1: $.data.id }
            - call: "POST /cpa/flight-legs"
              payload: { cycle_id: "${cyc}", aircraft_id: "${ac1}", captain_pilot_id: "${p1}", flight_number: "SM4102", origin: "ORD", destination: "MSP", scheduled_departure_utc: "2026-09-04T08:00:00Z", scheduled_arrival_utc: "2026-09-04T10:00:00Z", planned_block_hours: 2.000 }
              as: MainlineScheduler
              captures: { l2: $.data.id }
            - call: "POST /cpa/flight-legs"
              payload: { cycle_id: "${cyc}", aircraft_id: "${ac1}", captain_pilot_id: "${p1}", flight_number: "SM4103", origin: "ORD", destination: "SBN", scheduled_departure_utc: "2026-09-06T08:00:00Z", scheduled_arrival_utc: "2026-09-06T08:42:00Z", planned_block_hours: 0.700 }
              as: MainlineScheduler
              captures: { l3: $.data.id }
            - call: "POST /cpa/flight-legs"
              payload: { cycle_id: "${cyc}", aircraft_id: "${ac1}", captain_pilot_id: "${p1}", flight_number: "SM4104", origin: "ORD", destination: "GRR", scheduled_departure_utc: "2026-09-08T08:00:00Z", scheduled_arrival_utc: "2026-09-08T09:30:00Z", planned_block_hours: 1.500 }
              as: MainlineScheduler
              captures: { l4: $.data.id }
            - call: "POST /cpa/flight-legs/${l1}/complete"
              payload: { actual_block_hours: 1.155, actual_arrival_utc: "2026-09-02T09:26:00Z", enplaned_bags: 120, mishandled_bags: 0 }
              as: RegionalOpsController
            - call: "POST /cpa/flight-legs/${l2}/complete"
              payload: { actual_block_hours: 2.007, actual_arrival_utc: "2026-09-04T10:14:00Z", enplaned_bags: 100, mishandled_bags: 0 }
              as: RegionalOpsController
            - call: "POST /cpa/flight-legs/${l3}/complete"
              payload: { actual_block_hours: 0.616, actual_arrival_utc: "2026-09-06T08:40:00Z", enplaned_bags: 80, mishandled_bags: 0 }
              as: RegionalOpsController
            - call: "POST /cpa/flight-legs/${l4}/cancel"
              payload: { cause_code: "CREW_UNAVAILABLE" }
              as: RegionalOpsController
            - call: "POST /cpa/pass-through-claims"
              payload: { cycle_id: "${cyc}", category: "FUEL", estimated_amount_usd: 85000.00 }
              as: RegionalOpsController
              as_user_id: "ops-1"
              captures: { pt_fuel: $.data.id }
            - call: "POST /cpa/pass-through-claims"
              payload: { cycle_id: "${cyc}", category: "AIRPORT_FEES", estimated_amount_usd: 8000.00 }
              as: RegionalOpsController
              as_user_id: "ops-1"
              captures: { pt_fee: $.data.id }
            - call: "POST /cpa/pass-through-claims"
              payload: { cycle_id: "${cyc}", category: "INSURANCE", estimated_amount_usd: 2000.00 }
              as: RegionalOpsController
              as_user_id: "ops-1"
              captures: { pt_ins: $.data.id }
            - call: "POST /cpa/pass-through-claims/${pt_fuel}/submit-actual"
              payload: { actual_amount_usd: 88500.00, supporting_doc_ref: "FUEL-SEP-INV-01" }
              as: RegionalOpsController
              as_user_id: "ops-1"
            - call: "POST /cpa/pass-through-claims/${pt_fee}/submit-actual"
              payload: { actual_amount_usd: 9200.00, supporting_doc_ref: "FEES-SEP-INV-01" }
              as: RegionalOpsController
              as_user_id: "ops-1"
            - call: "POST /cpa/pass-through-claims/${pt_ins}/submit-actual"
              payload: { actual_amount_usd: 1700.00, supporting_doc_ref: "INS-SEP-INV-01" }
              as: RegionalOpsController
              as_user_id: "ops-1"
            - call: "POST /cpa/pass-through-claims/${pt_fuel}/reconcile"
              payload: { decision: "APPROVE" }
              as: CPAAdministrator
              as_user_id: "admin-1"
            - call: "POST /cpa/pass-through-claims/${pt_fee}/reconcile"
              payload: { decision: "APPROVE" }
              as: CPAAdministrator
              as_user_id: "admin-1"
            - call: "POST /cpa/pass-through-claims/${pt_ins}/reconcile"
              payload: { decision: "APPROVE" }
              as: CPAAdministrator
              as_user_id: "admin-1"
            - call: "GET /cpa/schedule-cycles/${cyc}"
              payload: {}
              as: CPAAdministrator
              captures: { cyc_v1: $.data.version }
            - call: "POST /cpa/schedule-cycles/${cyc}/invoices"
              payload: { variant: "PROVISIONAL", expected_schedule_cycle_version: "${cyc_v1}" }
              as: CPAAdministrator
              captures: { inv_prov: $.data.id }
            - call: "POST /cpa/schedule-cycles/${cyc}/close"
              payload: {}
              as: MainlineScheduler
            - call: "GET /cpa/schedule-cycles/${cyc}"
              payload: {}
              as: CPAAdministrator
              captures: { cyc_v2: $.data.version }
          trigger:
            - call: "POST /cpa/schedule-cycles/${cyc}/invoices"
              payload: { variant: "FINAL", expected_schedule_cycle_version: "${cyc_v2}" }
              as: CPAAdministrator
              captures: { inv_final: $.data.id }
          assert:
            - "Invoice.${inv_prov}.variable_component_usd == 6617.93"
            - "Invoice.${inv_final}.variable_component_usd == 6440.94"
            - "Invoice.${inv_prov}.passthrough_component_usd == 95000.00"
            - "Invoice.${inv_final}.passthrough_component_usd == 101970.00"
            - "Invoice.${inv_prov}.incentive_component_usd == 0.00"
            - "Invoice.${inv_final}.incentive_component_usd == 15922.05"
            - "Invoice.${inv_prov}.total_usd == 413617.93"
            - "Invoice.${inv_final}.total_usd == 436332.99"
            - "Invoice.${inv_prov}.fixed_component_usd == 312000.00 and Invoice.${inv_final}.fixed_component_usd == 312000.00 (ownership_aircraft_count == 1 in both variants)"
            - "Invoice.${inv_prov}.status == DRAFT — AUTO_SUPERSEDED voiding is scoped to the same variant, so the PROVISIONAL invoice survives creation of the FINAL one"
            - "ScheduleCycle.${cyc}.credited_block_hours == 3.778"

      - name: crew_staffing_headcount_vs_pipeline_divergence
        grounds:
          - calculations.pilot_staffing_shortfall
          - entities.CrewBase.fields.headcount_shortfall
          - entities.CrewBase.fields.pipeline_shortfall
          - entities.CrewBase.fields.allocatable_aircraft_count
          - validations[priority=34]
          - errors[ERR_BASE_UNDERSTAFFED]
        distinguishing_aspect: |
          Crew domain (no money involved): at one base with pilots_required_per_aircraft
          2, one tail assigned, one LINE_QUALIFIED and two IN_TRAINING pilots, the
          HEADCOUNT_BASIS variant reports headcount_shortfall 1 / staffing_posture
          SHORT and blocks a second induction with ERR_BASE_UNDERSTAFFED, while the
          PIPELINE_BASIS variant reports pipeline_shortfall 0 and keeps
          allocatable_aircraft_count at 1 so the tail already in service is NOT
          grounded — the two variants disagree on the same base at the same instant.
        test_recipe:
          setup:
            - "ACTIVE agreement with one base: pilots_required_per_aircraft 2, aircraft_allocation_cap 2."
            - "Two pilots advanced to LINE_QUALIFIED, then tail N201RG inducted (required 2 <= 2 line-qualified)."
            - "Two further pilots advanced to IN_TRAINING, then one LINE_QUALIFIED pilot attrites to the mainline."
            - "Second tail N202RG registered but still PENDING_INDUCTION."
          setup_api_calls:
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2029-12-31" }
              as: CPAAdministrator
              captures: { ag: $.data.id }
            - call: "POST /cpa/crew-bases"
              payload: { agreement_id: "${ag}", station_code: "DTW", pilots_required_per_aircraft: 2, aircraft_allocation_cap: 2 }
              as: RegionalOpsController
              captures: { base: $.data.id }
            - call: "POST /cpa/agreements/${ag}/activate"
              payload: {}
              as: CPAAdministrator
            - call: "POST /cpa/pilots"
              payload: { base_id: "${base}", employee_ref: "EMP-2001", seat: "CAPTAIN", hire_class_date: "2026-05-01" }
              as: RegionalOpsController
              captures: { p1: $.data.id }
            - call: "POST /cpa/pilots"
              payload: { base_id: "${base}", employee_ref: "EMP-2002", seat: "FIRST_OFFICER", hire_class_date: "2026-05-01" }
              as: RegionalOpsController
              captures: { p2: $.data.id }
            - call: "POST /cpa/pilots/${p1}/advance"
              payload: { to_status: "IN_TRAINING" }
              as: BaseChiefPilot
              as_user_id: "${base}"
            - call: "POST /cpa/pilots/${p1}/advance"
              payload: { to_status: "LINE_QUALIFIED" }
              as: BaseChiefPilot
              as_user_id: "${base}"
            - call: "POST /cpa/pilots/${p2}/advance"
              payload: { to_status: "IN_TRAINING" }
              as: BaseChiefPilot
              as_user_id: "${base}"
            - call: "POST /cpa/pilots/${p2}/advance"
              payload: { to_status: "LINE_QUALIFIED" }
              as: BaseChiefPilot
              as_user_id: "${base}"
            - call: "POST /cpa/aircraft"
              payload: { agreement_id: "${ag}", assigned_base_id: "${base}", tail_number: "N201RG", seat_count: 76, ownership: "REGIONAL_OWNED" }
              as: RegionalOpsController
              captures: { ac1: $.data.id }
            - call: "POST /cpa/aircraft/${ac1}/induct"
              payload: {}
              as: RegionalOpsController
            - call: "POST /cpa/pilots"
              payload: { base_id: "${base}", employee_ref: "EMP-2003", seat: "FIRST_OFFICER", hire_class_date: "2026-07-01" }
              as: RegionalOpsController
              captures: { p3: $.data.id }
            - call: "POST /cpa/pilots"
              payload: { base_id: "${base}", employee_ref: "EMP-2004", seat: "FIRST_OFFICER", hire_class_date: "2026-07-01" }
              as: RegionalOpsController
              captures: { p4: $.data.id }
            - call: "POST /cpa/pilots/${p3}/advance"
              payload: { to_status: "IN_TRAINING" }
              as: BaseChiefPilot
              as_user_id: "${base}"
            - call: "POST /cpa/pilots/${p4}/advance"
              payload: { to_status: "IN_TRAINING" }
              as: BaseChiefPilot
              as_user_id: "${base}"
            - call: "POST /cpa/pilots/${p2}/attrite"
              payload: { destination: "MAINLINE" }
              as: BaseChiefPilot
              as_user_id: "${base}"
            - call: "POST /cpa/aircraft"
              payload: { agreement_id: "${ag}", assigned_base_id: "${base}", tail_number: "N202RG", seat_count: 76, ownership: "REGIONAL_OWNED" }
              as: RegionalOpsController
              captures: { ac2: $.data.id }
          trigger:
            - call: "POST /cpa/aircraft/${ac2}/induct"
              payload: {}
              as: RegionalOpsController
          assert:
            - "HTTP 409 with error.code == ERR_BASE_UNDERSTAFFED (HEADCOUNT_BASIS gate: (1 + 1) * 2 == 4 > line_qualified_pilot_count 1)"
            - "CrewBase.${base}.line_qualified_pilot_count == 1"
            - "CrewBase.${base}.in_training_pilot_count == 2"
            - "CrewBase.${base}.required_pilot_count == 2"
            - "CrewBase.${base}.headcount_shortfall == 1"
            - "CrewBase.${base}.pipeline_shortfall == 0"
            - "CrewBase.${base}.staffing_posture == SHORT"
            - "CrewBase.${base}.allocatable_aircraft_count == 1"
            - "CrewBase.${base}.assigned_aircraft_count == 1 — the rejected induction changed nothing"
            - "Aircraft.${ac1}.status == IN_SERVICE — PIPELINE_BASIS keeps allocatable_aircraft_count at 1 so the attrition did not ground the tail"
            - "Aircraft.${ac2}.status == PENDING_INDUCTION"

  - rule_id: combinatorial_formula
    instances:
      - name: variable_payment_rounds_per_leg_then_sums
        grounds:
          - calculations.variable_flight_payment
          - entities.FlightLeg.fields.leg_variable_payment_usd
          - entities.Invoice.fields.variable_component_usd
          - state_machines.FlightLeg.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          Mode (b) — evaluation-ORDER sensitivity. Rounding each leg's block-hour
          money to cents and then summing yields variable_component_usd 6440.94;
          summing the unrounded products and rounding once yields 6440.93. The
          instance pins the per-leg values 1995.62 / 3231.66 / 1213.66 and the
          6440.94 total, so the 6440.93 reading fails.
        test_recipe:
          setup:
            - "ACTIVE agreement (block-hour rate 1450.75, departure rate 320.00, ownership fee 62000.00, fixed 250000.00)."
            - "One base, one LINE_QUALIFIED captain, one REGIONAL_OWNED tail IN_SERVICE."
            - "OPEN cycle 2026-09, published_departures 100, three legs COMPLETED with actual block hours 1.155 / 2.007 / 0.616, all on time, no cancellations and no pass-through claims."
          setup_api_calls:
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2029-12-31" }
              as: CPAAdministrator
              captures: { ag: $.data.id }
            - call: "POST /cpa/crew-bases"
              payload: { agreement_id: "${ag}", station_code: "ORD", pilots_required_per_aircraft: 1, aircraft_allocation_cap: 4 }
              as: RegionalOpsController
              captures: { base: $.data.id }
            - call: "POST /cpa/agreements/${ag}/activate"
              payload: {}
              as: CPAAdministrator
            - call: "POST /cpa/pilots"
              payload: { base_id: "${base}", employee_ref: "EMP-3001", seat: "CAPTAIN", hire_class_date: "2026-06-01" }
              as: RegionalOpsController
              captures: { p1: $.data.id }
            - call: "POST /cpa/pilots/${p1}/advance"
              payload: { to_status: "IN_TRAINING" }
              as: BaseChiefPilot
              as_user_id: "${base}"
            - call: "POST /cpa/pilots/${p1}/advance"
              payload: { to_status: "LINE_QUALIFIED" }
              as: BaseChiefPilot
              as_user_id: "${base}"
            - call: "POST /cpa/aircraft"
              payload: { agreement_id: "${ag}", assigned_base_id: "${base}", tail_number: "N301RG", seat_count: 76, ownership: "REGIONAL_OWNED" }
              as: RegionalOpsController
              captures: { ac1: $.data.id }
            - call: "POST /cpa/aircraft/${ac1}/induct"
              payload: {}
              as: RegionalOpsController
            - call: "POST /cpa/schedule-cycles"
              payload: { agreement_id: "${ag}", cycle_month: "2026-09", published_departures: 100 }
              as: MainlineScheduler
              captures: { cyc: $.data.id }
            - call: "POST /cpa/schedule-cycles/${cyc}/open"
              payload: {}
              as: MainlineScheduler
            - call: "POST /cpa/flight-legs"
              payload: { cycle_id: "${cyc}", aircraft_id: "${ac1}", captain_pilot_id: "${p1}", flight_number: "SM4201", origin: "ORD", destination: "DSM", scheduled_departure_utc: "2026-09-02T08:00:00Z", scheduled_arrival_utc: "2026-09-02T09:12:00Z", planned_block_hours: 1.200 }
              as: MainlineScheduler
              captures: { l1: $.data.id }
            - call: "POST /cpa/flight-legs"
              payload: { cycle_id: "${cyc}", aircraft_id: "${ac1}", captain_pilot_id: "${p1}", flight_number: "SM4202", origin: "ORD", destination: "MSP", scheduled_departure_utc: "2026-09-04T08:00:00Z", scheduled_arrival_utc: "2026-09-04T10:00:00Z", planned_block_hours: 2.000 }
              as: MainlineScheduler
              captures: { l2: $.data.id }
            - call: "POST /cpa/flight-legs"
              payload: { cycle_id: "${cyc}", aircraft_id: "${ac1}", captain_pilot_id: "${p1}", flight_number: "SM4203", origin: "ORD", destination: "SBN", scheduled_departure_utc: "2026-09-06T08:00:00Z", scheduled_arrival_utc: "2026-09-06T08:42:00Z", planned_block_hours: 0.700 }
              as: MainlineScheduler
              captures: { l3: $.data.id }
            - call: "POST /cpa/flight-legs/${l1}/complete"
              payload: { actual_block_hours: 1.155, actual_arrival_utc: "2026-09-02T09:26:00Z", enplaned_bags: 120, mishandled_bags: 0 }
              as: RegionalOpsController
            - call: "POST /cpa/flight-legs/${l2}/complete"
              payload: { actual_block_hours: 2.007, actual_arrival_utc: "2026-09-04T10:14:00Z", enplaned_bags: 100, mishandled_bags: 0 }
              as: RegionalOpsController
            - call: "POST /cpa/flight-legs/${l3}/complete"
              payload: { actual_block_hours: 0.616, actual_arrival_utc: "2026-09-06T08:40:00Z", enplaned_bags: 80, mishandled_bags: 0 }
              as: RegionalOpsController
            - call: "POST /cpa/schedule-cycles/${cyc}/close"
              payload: {}
              as: MainlineScheduler
            - call: "GET /cpa/schedule-cycles/${cyc}"
              payload: {}
              as: CPAAdministrator
              captures: { cyc_v: $.data.version }
          trigger:
            - call: "POST /cpa/schedule-cycles/${cyc}/invoices"
              payload: { variant: "FINAL", expected_schedule_cycle_version: "${cyc_v}" }
              as: CPAAdministrator
              captures: { inv: $.data.id }
          assert:
            - "FlightLeg.${l1}.leg_variable_payment_usd == 1995.62"
            - "FlightLeg.${l2}.leg_variable_payment_usd == 3231.66"
            - "FlightLeg.${l3}.leg_variable_payment_usd == 1213.66"
            - "Invoice.${inv}.variable_component_usd == 6440.94 — NOT 6440.93, which is what summing the unrounded products and rounding once produces"
            - "Invoice.${inv}.passthrough_component_usd == 0.00"
            - "Invoice.${inv}.incentive_component_usd == 15922.05"
            - "Invoice.${inv}.total_usd == 334362.99"

      - name: performance_points_forfeiture_then_penalty_cap
        grounds:
          - calculations.performance_incentive_penalty
          - calculations.completion_factor
          - calculations.on_time_arrival
          - calculations.mishandled_bag_rate
          - entities.Scorecard.fields.performance_points
          - entities.Agreement.fields.penalty_cap_usd
        distinguishing_aspect: |
          Mode (a) — three metric inputs feeding tiered point selection, a
          CONDITIONAL FORFEITURE branch and a nested cap. completion_factor 95.00
          scores -4, which forfeits the otherwise-earned +2 on-time and +1 bag
          points down to 0 each; performance_points -4 gives gross -48000.00, which
