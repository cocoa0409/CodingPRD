              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /permits/${permit_id}/escort-assignments"
              payload: { pilot_car_id: "${pilot_id}", role: "REAR", window_start_utc: "2026-06-05T11:00:00Z", window_end_utc: "2026-06-05T13:00:00Z" }
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { e2_id: $.data.id }
            - call: "POST /permits/${permit_id}/escort-assignments"
              payload: { pilot_car_id: "${pilot_id}", role: "POLICE", window_start_utc: "2026-06-05T12:00:00Z", window_end_utc: "2026-06-05T13:00:00Z" }
