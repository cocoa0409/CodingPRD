          Two adjacent degenerate boundaries of the same formula: total_records == 0 (every share is 0
          and the whole residual of 11500 lands on the earliest dataset, so a naive implementation
          divides by zero) and allocable == empty (ERR_NO_ALLOCABLE_INPUTS with nothing written). Unlike
          the other boundary instances, the boundary here is on the SIZE OF AN INPUT SET rather than on
          an instant, and the second half proves the first half's writes are fully rolled back to 0 by
          the quarantine cascade before the empty-set branch is reached.
