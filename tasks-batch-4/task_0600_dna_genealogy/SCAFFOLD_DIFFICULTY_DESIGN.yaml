          - entities.RelativeMatch.fields.shared_cm
        distinguishing_aspect: |
          NUMERIC threshold boundary on POST /dna/customers/{id}/matches/recompute: two shared
          markers give shared_cm = 8.00, exactly MATCH_MIN_CM, and MUST create a match
          (>= is inclusive); one shared marker gives 4.00 and MUST NOT. Different metric and
          different endpoint from the empty-collection boundary below.
