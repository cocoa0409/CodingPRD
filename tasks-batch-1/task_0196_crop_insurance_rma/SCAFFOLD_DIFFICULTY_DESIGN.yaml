            - "AgentCommission for ${elec_id} has commission_rate == 0.08"
            - "AgentCommission for ${elec_id} has commission_cents == 40000"

      - name: boundary_no_loss_indemnity_zero_when_production_meets_guarantee
        grounds:
          - calculations.yp_or_rp_indemnity
          - state_machines.LossClaim.UNDER_REVIEW_to_APPROVED
          - entities.LossClaim.fields.indemnity_cents
        distinguishing_aspect: |
          Zero-quantity boundary on a DIFFERENT metric (indemnity) reached through a
          DIFFERENT endpoint (POST /loss-claims/{id}/approve): production_to_count
          exactly equals the bushel guarantee (guar_bu=135/ac * 100ac = 13500 bu), so
          max(0, guar - ptc) = 0 and indemnity_cents == 0 even though the claim is
          APPROVED. One more bushel of shortfall (13499) would pay; this pins the >=0 edge.
        test_recipe:
          setup:
            - "YP election aph=180 cov=0.75 -> guar_bu=135/ac; REPORTED 100-ac unit"
            - "LossClaim production_to_count_bu=13500 (exactly meets the 13500-bu guarantee) submitted to ADJ"
          setup_api_calls:
