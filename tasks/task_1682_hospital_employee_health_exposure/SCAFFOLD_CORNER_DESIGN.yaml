        claim_type: violation_to_error
        grounds: ["roles.StaffEmployee", "validations[priority=2.5]", "errors[ERR_OWNERSHIP_REQUIRED]"]
        distinguishing_aspect: "StaffEmployee GET on another employee's id fails ERR_OWNERSHIP_REQUIRED (403); GET on own id succeeds (entity_backed identity check)."
        test_recipe:
          setup: ["Employees E1 and E2 exist"]
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-RB1A", full_name: "Self One", job_category: "NURSE", department: "ICU", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { emp1: $.data.id }
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-RB1B", full_name: "Other Two", job_category: "TECH", department: "LAB", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { emp2: $.data.id }
          trigger:
            - call: "GET /employee-health/employees/${emp2}"
              as: StaffEmployee
              as_user_id: "${emp1}"
              captures: { err: $.data.error_id }
            - call: "GET /employee-health/employees/${emp1}"
              as: StaffEmployee
              as_user_id: "${emp1}"
              captures: { own_ref: $.data.employee_ref }
          assert:
            - "Other-record read: error_id == ERR_OWNERSHIP_REQUIRED (403)"
            - "Own-record read: 200 with ${own_ref} == E-RB1A"

