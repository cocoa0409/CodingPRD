          Conserved quantity: InsurancePolicy.deductible_met_cents, a money
          ledger rather than the entitlement unit count of the sibling instance.
          Adjudication consumes 14000 cents of deductible and cancelling the
          parent encounter voids the line and gives exactly 14000 back, so the
