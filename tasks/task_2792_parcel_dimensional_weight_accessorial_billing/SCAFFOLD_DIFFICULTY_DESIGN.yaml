              captures: { sh1: $.data.id, sh1_v: $.data.version }
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2002", name: "Southbound Retail" }
              as: CarrierAdmin
              captures: { sh2: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh1}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh1_v}" }
              as: CarrierAdmin
          trigger:
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh1}"
                effective_from: "2026-12-31"
                effective_to: "2027-06-30"
                dim_divisor: 150
                min_charge_cents: 1250
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 400}, {zone: 2, min_lbs: 21, max_lbs: 9999, cents_per_lb: 360}]
                tier_discount_table: []
              as: CarrierAdmin
              captures: { err_period: $.data.error_id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh1}"
                effective_from: "2027-01-01"
                effective_to: "2027-06-30"
                dim_divisor: 150
                min_charge_cents: 1250
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 400}, {zone: 2, min_lbs: 21, max_lbs: 9999, cents_per_lb: 360}]
                tier_discount_table: []
                supersedes_contract_id: "${c1}"
              as: CarrierAdmin
              captures: { c3: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh1}"
                effective_from: "2027-01-01"
                effective_to: "2027-03-31"
                dim_divisor: 160
                min_charge_cents: 1300
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 9999, cents_per_lb: 420}]
                tier_discount_table: []
              as: CarrierAdmin
              captures: { err_draft_blocks: $.data.error_id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh2}"
                effective_from: "2026-06-01"
                effective_to: "2027-06-30"
                dim_divisor: 166
                min_charge_cents: 1000
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 9999, cents_per_lb: 350}]
                tier_discount_table: []
              as: CarrierAdmin
              captures: { c_other: $.data.id }
          assert:
            - "The first call returns HTTP 409 with error_id ERR_CONTRACT_PERIOD_OVERLAP — effective_from 2026-12-31 equals C1's effective_to and closed intervals DO collide when they touch"
            - "After that rejection GET /rate-contracts with shipper_id ${sh1} returns exactly 1 row, ${c1}"
            - "The second call returns HTTP 201 with RateContract.${c3}.status == DRAFT, effective_from == 2027-01-01, supersedes_contract_id == ${c1}, and RateContract.${c1}.status is STILL ACTIVE (creation alone never supersedes)"
            - "The third call returns HTTP 409 with error_id ERR_CONTRACT_PERIOD_OVERLAP — the DRAFT ${c3} excludes just as an ACTIVE contract would"
            - "The fourth call returns HTTP 201 for SH-2002 with RateContract.${c_other}.status == DRAFT even though 2026-06-01..2027-06-30 overlaps both of SH-1001's periods — exclusion is partitioned per shipper"
            - "GET /rate-contracts with shipper_id ${sh1} returns exactly 2 rows and with shipper_id ${sh2} returns exactly 1 row"
            - "GET /rate-contracts with supersedes_contract_id ${c1} returns exactly 1 row, ${c3}"
  - rule_id: compensating_invariant
    instances:
      - name: reversing_adjustment_pair_restores_the_money_invariant_through_a_zero_net_invoice
        grounds:
          - calculations.shipper_ledger_aggregates
          - validations[priority=55]  # ERR_CREDIT_EXCEEDS_INVOICE_NET
          - state_machines.BillingAdjustment
          - entities.Invoice.fields.adjustment_total_cents
          - entities.ShipperAccount.fields.credit_balance_cents
        distinguishing_aspect: |
          A credit of exactly the full line total drives the invoice net to 0 — the extreme
          admissible value of the never-negative rule — and an equal and opposite debit then
          restores every aggregate: adjustment_total_cents returns to 0, net_amount_cents
          returns to 2660 and credit_balance_cents returns to 0, while both adjustment rows
          stay APPLIED and the invoice stays ADJUSTED. INVARIANT M must hold at all three
          observation points, so an implementation that stores the net as a running total,
          that clamps the credit at the boundary, or that recomputes the ledger from the
          latest adjustment only, drifts here.
        test_recipe:
          setup:
            - "SH-1001 ACTIVE with ACTIVE contract C1 (dim_divisor 139, min_charge_cents 1195, zone-2 rows 380/340/305); ServiceLevel EXPRESS (24 h, guaranteed). No surcharge window."
            - "Shipment PZ (12 x 10 x 8, 6.0 lb, zone 2, non-residential) DELIVERED -> billable 7 lb DIMENSIONAL, transportation 2660, line 2660 with no accessorial."
            - "Invoice INV_Z over 2026-08-01..2026-08-31 holds PZ's single line and is ISSUED: gross 2660, tier 0 bps, discount 0, net 2660; ShipperAccount credit_balance 0 and open_charges 2660."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-1001", name: "Northwind Freight" }
              as: CarrierAdmin
              captures: { sh1: $.data.id, sh1_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express 24", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl_exp: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh1}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh1_v}" }
              as: CarrierAdmin
            - call: "POST /shipments"
              payload: { shipper_id: "${sh1}", service_level_id: "${sl_exp}", tracking_number: "1Z-PZ-0081", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { pz: $.data.id }
            - call: "POST /shipments/${pz}/deliver"
              payload: {}
              as: CarrierOps
            - call: "POST /invoices"
              payload: { shipper_id: "${sh1}", period_start: "2026-08-01", period_end: "2026-08-31" }
              as: BillingOps
              captures: { inv_z: $.data.id }
            - call: "POST /invoices/${inv_z}/issue"
              payload: {}
              as: BillingOps
              captures: { inv_z_v1: $.data.version }
            - call: "GET /invoice-lines"
              payload: { invoice_id: "${inv_z}", shipment_id: "${pz}" }
              as: BillingOps
              captures: { line_z: "$.data[0].id" }
          trigger:
            - call: "POST /billing-adjustments"
              payload: { invoice_line_id: "${line_z}", reason: "MANUAL", delta_cents: -2660, expected_invoice_version: "${inv_z_v1}", note: "Goodwill credit of the whole line" }
              as: BillingOps
              as_user_id: "billing.one"
              captures: { adj_credit: $.data.id }
            - call: "POST /billing-adjustments/${adj_credit}/apply"
              payload: {}
              as: BillingOps
              as_user_id: "billing.two"
            - call: "GET /invoices/${inv_z}"
              payload: {}
              as: BillingOps
              captures: { inv_z_v2: $.data.version }
            - call: "POST /billing-adjustments"
              payload: { invoice_line_id: "${line_z}", reason: "MANUAL", delta_cents: 2660, expected_invoice_version: "${inv_z_v2}", note: "Credit issued in error, reversing" }
              as: BillingOps
              as_user_id: "billing.two"
              captures: { adj_reverse: $.data.id }
            - call: "POST /billing-adjustments/${adj_reverse}/apply"
              payload: {}
              as: BillingOps
              as_user_id: "billing.one"
            - call: "GET /shipper-accounts/${sh1}"
              payload: {}
              as: BillingOps
          assert:
            - "POINT 1 (after the credit applies) — InvoiceLine.${line_z}.adjustment_total_cents == -2660 and line_total_cents == 0, base_line_total_cents still 2660"
            - "POINT 1 — Invoice.${inv_z}.status == ADJUSTED, adjustment_total_cents == -2660, net_amount_cents == 0; a credit that lands exactly on 0 is admissible and must NOT raise ERR_CREDIT_EXCEEDS_INVOICE_NET"
            - "POINT 1 — ShipperAccount.${sh1}.credit_balance_cents == 2660 and open_charges_cents == 0; INVARIANT M holds: 2660 + 0 == 2660 == gross 2660 - discount 0"
            - "POINT 2 (after the reversing debit applies) — InvoiceLine.${line_z}.adjustment_total_cents == 0 and line_total_cents == 2660, base_line_total_cents still 2660"
            - "POINT 2 — Invoice.${inv_z}.adjustment_total_cents == 0 and net_amount_cents == 2660 — back to the issued figure to the cent"
            - "POINT 2 — Invoice.${inv_z}.status is STILL ADJUSTED and pending_adjustment_count == 0; the reversal does not restore the ISSUED label"
            - "POINT 2 — ShipperAccount.${sh1}.credit_balance_cents == 0 and open_charges_cents == 2660; INVARIANT M holds again: 0 + 2660 == 2660"
            - "POINT 2 — Shipment.${pz}.billing_status is STILL ADJUSTED and INVARIANT P holds: unbilled_shipment_count 0 + billed_shipment_count 1 == total_shipment_count 1"
            - "GET /billing-adjustments with invoice_line_id ${line_z} returns exactly 2 rows, both status APPLIED, with applied_by_user_id 'billing.two' on ${adj_credit} and 'billing.one' on ${adj_reverse} — neither row was deleted or merged"
      - name: voiding_an_adjusted_invoice_restores_package_counts_and_full_rebillability
        grounds:
          - state_machines.Invoice.ADJUSTED_to_VOID
          - calculations.shipper_ledger_aggregates
          - calculations.invoice_sweep_selection
          - calculations.invoice_totals
          - entities.InvoiceLine.fields.voided
        distinguishing_aspect: |
          Voiding an ADJUSTED invoice has to undo four aggregates at once — invoice net,
          shipper credit balance, open charges and the billed/unbilled package split — and it
          must leave the shipments rebillable so that a fresh sweep reproduces the ORIGINAL
          pre-adjustment totals (gross 142810, 550 bps, discount 7137, net 135673) rather
          than the adjusted ones. The APPLIED credit row survives but stops counting because
          its invoice is VOID, which is the subtle part: the compensation happens in the
          aggregate query, not by deleting history.
        test_recipe:
          setup:
            - "SH-1001 ACTIVE with ACTIVE contract C1 (dim_divisor 139, min_charge_cents 1195, zone-2 rows 380/340/305, zone-5 rows 520/470/425, tier 50000 -> 550 bps and 250000 -> 1250 bps, RESIDENTIAL override 540)."
            - "ServiceLevel EXPRESS (24 h, guaranteed) and GROUND (120 h); ACTIVE DEMAND window DEM-AUG scoped to EXPRESS with per_package_cents 150."
            - "Shipment P1 (18.4 x 12.6 x 10.5, 9.2 lb, zone 2, EXPRESS, residential) -> line 7910; Shipment P2 (100 x 20 x 20, 60.0 lb, zone 5, GROUND) -> oversize, billable 288 lb, line 134900. Both DELIVERED."
            - "Invoice INV_V over 2026-08-01..2026-08-31 holds both lines and is ISSUED: transportation_subtotal 129770, accessorial_subtotal 13040, gross 142810, tier 550 bps, discount 7137, net 135673."
            - "A MANUAL credit of 540 has been proposed and APPLIED against P1's line, so INV_V is ADJUSTED with net 135133 and the shipper shows credit_balance 540."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-1001", name: "Northwind Freight" }
              as: CarrierAdmin
              captures: { sh1: $.data.id, sh1_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express 24", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl_exp: $.data.id }
            - call: "POST /service-levels"
              payload: { code: "GROUND", name: "Ground", guarantee_hours: 120, guaranteed: false }
              as: CarrierAdmin
              captures: { sl_gnd: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh1}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}, {zone: 5, min_lbs: 1, max_lbs: 20, cents_per_lb: 520}, {zone: 5, min_lbs: 21, max_lbs: 70, cents_per_lb: 470}, {zone: 5, min_lbs: 71, max_lbs: 9999, cents_per_lb: 425}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}, {min_transportation_subtotal_cents: 250000, discount_bps: 1250}]
                accessorial_rate_overrides: { RESIDENTIAL: 540 }
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh1_v}" }
              as: CarrierAdmin
            - call: "POST /surcharge-windows"
              payload: { code: "DEM-AUG", kind: "DEMAND", service_level_id: "${sl_exp}", start_date: "2026-08-01", end_date: "2026-09-01", per_package_cents: 150, oversize_add_cents: 0 }
              as: CarrierAdmin
              captures: { win_dem: $.data.id }
            - call: "POST /surcharge-windows/${win_dem}/activate"
              payload: {}
              as: CarrierAdmin
            - call: "POST /shipments"
              payload: { shipper_id: "${sh1}", service_level_id: "${sl_exp}", tracking_number: "1Z-P1-0001", zone: 2, residential_declared: true, declared_length_in: 18.4, declared_width_in: 12.6, declared_height_in: 10.5, declared_weight_lbs: 9.2 }
              as: CarrierOps
              captures: { p1: $.data.id }
            - call: "POST /shipments"
              payload: { shipper_id: "${sh1}", service_level_id: "${sl_gnd}", tracking_number: "1Z-P2-0002", zone: 5, residential_declared: false, declared_length_in: 100, declared_width_in: 20, declared_height_in: 20, declared_weight_lbs: 60.0 }
              as: CarrierOps
              captures: { p2: $.data.id }
            - call: "POST /shipments/${p1}/deliver"
              payload: {}
              as: CarrierOps
            - call: "POST /shipments/${p2}/deliver"
              payload: {}
              as: CarrierOps
            - call: "POST /invoices"
              payload: { shipper_id: "${sh1}", period_start: "2026-08-01", period_end: "2026-08-31" }
              as: BillingOps
              captures: { inv_v: $.data.id }
            - call: "POST /invoices/${inv_v}/issue"
              payload: {}
              as: BillingOps
              captures: { inv_v_v: $.data.version }
            - call: "GET /invoice-lines"
              payload: { invoice_id: "${inv_v}", shipment_id: "${p1}" }
              as: BillingOps
              captures: { line_v1: "$.data[0].id" }
            - call: "POST /billing-adjustments"
              payload: { invoice_line_id: "${line_v1}", reason: "ACCESSORIAL_CORRECTION", delta_cents: -540, expected_invoice_version: "${inv_v_v}", note: "Residential fee credited" }
              as: BillingOps
              as_user_id: "billing.one"
              captures: { adj_v: $.data.id }
            - call: "POST /billing-adjustments/${adj_v}/apply"
              payload: {}
              as: BillingOps
              as_user_id: "billing.two"
          trigger:
            - call: "POST /invoices/${inv_v}/void"
              payload: {}
              as: BillingOps
            - call: "GET /shipper-accounts/${sh1}"
              payload: {}
              as: BillingOps
            - call: "POST /invoices"
              payload: { shipper_id: "${sh1}", period_start: "2026-08-01", period_end: "2026-08-31" }
              as: BillingOps
              captures: { inv_v2: $.data.id }
          assert:
            - "BEFORE the void — Invoice.${inv_v}.status == ADJUSTED, gross_charges_cents == 142810, tier_discount_cents == 7137, adjustment_total_cents == -540, net_amount_cents == 135133; ShipperAccount credit_balance_cents == 540 and open_charges_cents == 135133"
            - "AFTER the void — Invoice.${inv_v}.status == VOID and net_amount_cents == 0, while gross_charges_cents stays 142810 and tier_discount_cents stays 7137 as historical record"
            - "AFTER the void — both InvoiceLine rows of ${inv_v} have voided == true, and BillingAdjustment.${adj_v}.status is STILL APPLIED (history is not rewritten)"
            - "AFTER the void — ShipperAccount.${sh1}.credit_balance_cents == 0 because the APPLIED credit hangs off a VOID invoice, and open_charges_cents == 0"
            - "AFTER the void — Shipment.${p1}.billing_status == UNBILLED and Shipment.${p2}.billing_status == UNBILLED"
            - "AFTER the void — ShipperAccount.${sh1}.unbilled_shipment_count == 2, billed_shipment_count == 0, total_shipment_count == 2; INVARIANT P holds and INVARIANT M holds trivially at 0 + 0 == 0"
            - "The re-sweep returns HTTP 201 with Invoice.${inv_v2}.line_count == 2, transportation_subtotal_cents == 129770, accessorial_subtotal_cents == 13040, gross_charges_cents == 142810, tier_discount_bps == 550, tier_discount_cents == 7137, net_amount_cents == 135673 and status == OPEN"
            - "The re-swept invoice reproduces the ORIGINAL pre-adjustment net 135673, not the adjusted 135133 — the void compensated the credit instead of carrying it forward"
            - "AFTER the re-sweep — ShipperAccount.${sh1}.billed_shipment_count == 2 and unbilled_shipment_count == 0, and GET /invoices with shipper_id ${sh1} returns exactly 2 rows, one VOID and one OPEN"
