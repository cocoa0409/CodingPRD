              captures: { poc_id: $.data.id }
            - call: "POST /clinic/plans-of-care/${poc_id}/activate"
              payload: {}
              as: Evaluator
              as_user_id: "${th_id}"
          trigger:
            - call: "POST /clinic/plans-of-care/${poc_id}/hold"
              payload: {}
              as: Therapist
              as_user_id: "${th_id}"
          assert:
            - "PlanOfCare.${poc_id}.status == ON_HOLD"
            - "Therapist.${th_id}.current_caseload == 0"
