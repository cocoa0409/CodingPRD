        claim_type: precondition_enforcement
        grounds:
          - state_machines[TechnicalCommittee].FORMING_to_ACTIVE
          - validations[priority=101]
          - errors[ERR_CHAIR_NOT_MEMBER]
        distinguishing_aspect: "Balance alone does not open the activation edge: a committee whose three voting seats are BALANCED (3 members, 3 categories, dominance 33.3) but whose chair_participant_id holds no membership is rejected with ERR_CHAIR_NOT_MEMBER (409) and stays FORMING."
