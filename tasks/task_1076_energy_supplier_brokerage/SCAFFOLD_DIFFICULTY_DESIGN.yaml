            - { call: "POST /dr-enrollments", payload: { account_id: "${acct_id}", program_name: "Summer DR", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-30T00:00:00Z", committed_kw: 50, incentive_per_kw_cents: 4500 }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { dr1_id: "$.data.id" } }
          trigger:
            - { call: "POST /dr-enrollments", payload: { account_id: "${acct_id}", program_name: "Fall DR", season_start: "2026-10-05T00:00:00Z", season_end: "2026-11-30T00:00:00Z", committed_kw: 50, incentive_per_kw_cents: 4500 }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_DR_SEASON_CONFLICT"
            - "DemandResponseEnrollment.${dr1_id}.status == ENROLLED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: commission_payable_conserved_on_submit_then_drop
        grounds:
          - state_machines.Contract.APPROVED_to_ENROLLMENT_SUBMITTED
          - state_machines.Contract.ENROLLMENT_SUBMITTED_to_DROPPED
          - state_machines.CommissionStatement.PROVISIONAL_to_VOIDED
          - calculations.pipeline_commission
        distinguishing_aspect: |
          Conserved quantity #1 = total_net_commission_cents across the account's
          non-VOIDED statements. Forward (submit-enrollment) adds gross 30000;
          compensating (enrollment REJECT) voids it back to 0 — the sum is
          identical (0) before and after, a monetary invariant.
        test_recipe:
          setup:
            - "Happy path to an APPROVED contract (est 60000 -> provisional gross 30000). Baseline commission-summary total is 0."
          setup_api_calls:
            - { call: "POST /broker-users", payload: { full_name: "Agent A", email: "a@brk.co", staff_role: "AGENT" }, as: OpsAdmin, captures: { agent_id: "$.data.id" } }
            - { call: "POST /broker-users", payload: { full_name: "Mgr One", email: "m1@brk.co", staff_role: "MANAGER", approval_limit_cents: 100000000 }, as: OpsAdmin, captures: { mgr1_id: "$.data.id" } }
            - { call: "POST /customers", payload: { legal_name: "Acme LLC", email: "c@acme.co", segment: "SMALL_COMMERCIAL", service_state: "TX" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /suppliers", payload: { name: "PowerCo", commodity: "ELECTRICITY", service_states: ["TX"] }, as: OpsAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /accounts", payload: { customer_id: "${cust_id}", broker_agent_id: "${agent_id}", utility_name: "Oncor", account_number: "ACC-16", commodity: "ELECTRICITY", state_code: "TX", estimated_annual_usage_kwh: 60000 }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { acct_id: "$.data.id" } }
            - { call: "POST /authorizations", payload: { account_id: "${acct_id}", scope: "USAGE_AND_ENROLL", expires_at: "2028-01-01T00:00:00Z" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { loa_id: "$.data.id" } }
            - { call: "POST /authorizations/${loa_id}/sign", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /usage-records", payload: { account_id: "${acct_id}", period_month: "2025-12", usage_kwh: 5000, is_actual: false }, as: BrokerAgent, as_user_id: "${agent_id}" }
            - { call: "POST /accounts/${acct_id}/verify", payload: {}, as: BrokerAgent, as_user_id: "${agent_id}" }
            - { call: "POST /rfps", payload: { account_id: "${acct_id}", broker_agent_id: "${agent_id}", term_months_requested: 12, due_at: "2026-06-01T00:00:00Z" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { rfp_id: "$.data.id" } }
            - { call: "POST /rfps/${rfp_id}/transition", payload: { action: "OPEN" }, as: BrokerAgent, as_user_id: "${agent_id}" }
            - { call: "GET /rfps/${rfp_id}", payload: {}, as: BrokerAgent, as_user_id: "${agent_id}", captures: { rfp_v: "$.data.version" } }
            - { call: "POST /quotes", payload: { rfp_id: "${rfp_id}", supplier_id: "${sup_id}", rate_mills_per_kwh: 60, term_months: 12, broker_adder_mills: 5, expected_rfp_version: "${rfp_v}" }, as: Supplier, as_user_id: "${sup_id}", captures: { quote_id: "$.data.id" } }
            - { call: "POST /quotes/${quote_id}/shortlist", payload: {}, as: BrokerAgent, as_user_id: "${agent_id}" }
            - { call: "POST /contracts", payload: { rfp_id: "${rfp_id}", account_id: "${acct_id}", estimated_annual_usage_kwh: 60000, start_date: "2026-07-01T00:00:00Z", requested_switch_date: "2026-07-01T00:00:00Z" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { contract_id: "$.data.id" } }
            - { call: "POST /contracts/${contract_id}/customer-decision", payload: { decision: "ACCEPT" }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /contracts/${contract_id}/approve", payload: {}, as: BrokerManager, as_user_id: "${mgr1_id}" }
            - { call: "GET /reports/commission-summary", payload: { account_id: "${acct_id}" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { t_pre: "$.data.total_net_commission_cents" } }
          trigger:
            - { call: "POST /contracts/${contract_id}/submit-enrollment", payload: {}, as: BrokerAgent, as_user_id: "${agent_id}" }
            - { call: "GET /reports/commission-summary", payload: { account_id: "${acct_id}" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { t_mid: "$.data.total_net_commission_cents" } }
            - { call: "POST /contracts/${contract_id}/enrollment-result", payload: { result: "REJECT" }, as: OpsAdmin }
            - { call: "GET /reports/commission-summary", payload: { account_id: "${acct_id}" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { t_final: "$.data.total_net_commission_cents" } }
          assert:
            - "commission-summary total_net_commission_cents ${t_pre} == 0 before submit-enrollment"
            - "commission-summary total_net_commission_cents ${t_mid} == 30000 after submit-enrollment"
            - "commission-summary total_net_commission_cents ${t_final} == 0 after enrollment REJECT (invariant restored)"
            - "Contract.${contract_id}.status == DROPPED"

      - name: dr_reserved_kw_conserved_on_enroll_then_withdraw
        grounds:
          - state_machines.DemandResponseEnrollment.ENROLLED_to_WITHDRAWN
          - calculations.account_reserved_dr_kw
          - entities.UtilityAccount.fields.reserved_dr_kw
        distinguishing_aspect: |
          Conserved quantity #2 = account.reserved_dr_kw (kW capacity, a different
          conserved type than commission money). Forward (DR enroll) reserves 100 kW;
          compensating (DR withdraw) releases it back to 0 — reserved kW identical
          before and after.
        test_recipe:
          setup:
            - "One account with reserved_dr_kw 0."
          setup_api_calls:
            - { call: "POST /broker-users", payload: { full_name: "Agent A", email: "a@brk.co", staff_role: "AGENT" }, as: OpsAdmin, captures: { agent_id: "$.data.id" } }
            - { call: "POST /customers", payload: { legal_name: "Acme LLC", email: "c@acme.co", segment: "SMALL_COMMERCIAL", service_state: "TX" }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /accounts", payload: { customer_id: "${cust_id}", broker_agent_id: "${agent_id}", utility_name: "Oncor", account_number: "ACC-17", commodity: "ELECTRICITY", state_code: "TX", estimated_annual_usage_kwh: 60000 }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { acct_id: "$.data.id" } }
            - { call: "GET /accounts/${acct_id}", payload: {}, as: BrokerAgent, as_user_id: "${agent_id}", captures: { r_pre: "$.data.reserved_dr_kw" } }
          trigger:
            - { call: "POST /dr-enrollments", payload: { account_id: "${acct_id}", program_name: "Summer DR", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-30T00:00:00Z", committed_kw: 100, incentive_per_kw_cents: 4500 }, as: BrokerAgent, as_user_id: "${agent_id}", captures: { dr_id: "$.data.id" } }
            - { call: "GET /accounts/${acct_id}", payload: {}, as: BrokerAgent, as_user_id: "${agent_id}", captures: { r_mid: "$.data.reserved_dr_kw" } }
            - { call: "POST /dr-enrollments/${dr_id}/withdraw", payload: {}, as: BrokerAgent, as_user_id: "${agent_id}" }
            - { call: "GET /accounts/${acct_id}", payload: {}, as: BrokerAgent, as_user_id: "${agent_id}", captures: { r_final: "$.data.reserved_dr_kw" } }
          assert:
            - "UtilityAccount reserved_dr_kw ${r_pre} == 0 before enroll"
            - "UtilityAccount reserved_dr_kw ${r_mid} == 100 after enroll"
            - "UtilityAccount reserved_dr_kw ${r_final} == 0 after withdraw (invariant restored)"
            - "DemandResponseEnrollment.${dr_id}.status == WITHDRAWN"

