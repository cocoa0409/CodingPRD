          - validations[priority=16]
          - errors[ERR_STALE_UNIT_VERSION]
        distinguishing_aspect: "Creating a valuation is itself a write on the unit, so the version the client read before the FIRST valuation is already stale for the SECOND: re-sending it yields ERR_STALE_UNIT_VERSION (412) even though nothing else about the unit changed, and the client must re-read the unit to supersede its own earlier valuation."
