            - "failure_count == 1"
            - "invoice_id is non-null after deliver"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: reconcile_flags_recon_spawns_loss
        grounds:
          - state_machines.TransportDrop.DELIVERED_to_RECONCILED
          - state_machines.InventoryReconciliation.OPEN_to_VARIANCE_FLAGGED
          - calculations.book_inventory_gallons
          - calculations.inventory_variance_gallons
        distinguishing_aspect: |
          Depth-4 cascade triggered by drop reconcile: reconcile mutates
          tank.book_inventory_gallons (hop 1); the book mutation triggers the
          open reconciliation's variance recompute (hop 2); the variance breach
          flips OPEN -> VARIANCE_FLAGGED (hop 3); the flip auto-creates a
          SHRINKAGE LossEvent in REPORTED linked to the reconciliation (hop 4).
        test_recipe:
          setup:
            - "Full fixture; tank cap 20000 opening physical 10000, gauged 10000 @ 60F (net == gross)"
            - "Reconciliation OPEN for the station (variance 0 at open)"
            - "Drop of 5000 gal delivered (physical gauge NOT updated, so book 15000 vs physical 10000 after reconcile)"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { product_code: "REGULAR_87", display_name: "Regular 87", category: "GASOLINE", federal_excise_tc_per_gal: 184, temp_coeff: 0.00065 }
              as: JobberAdmin
              captures: { p_gas: $.data.id }
            - call: "POST /api/dealer-stations"
              payload: { station_name: "S-Casc", state_code: "TX", home_terminal_code: "TX-NORTH", state_excise_tc_per_gal: 200, credit_limit_cents: 100000000 }
              as: JobberAdmin
              captures: { s_id: $.data.id }
            - call: "POST /api/dealer-stations/${s_id}/activate"
              as: JobberAdmin
            - call: "POST /api/supply-agreements"
              payload: { station_id: "${s_id}", term_start_date: "2026-01-01", term_end_date: "2026-12-31", committed_gallons: 100000, imaging_allowance_cents: 100000, margin_tc_per_gal: 25, shortfall_penalty_tc_per_gal: 20, buyout_method: "LOST_MARGIN" }
              as: JobberAdmin
              captures: { a_id: $.data.id }
            - call: "POST /api/supply-agreements/${a_id}/activate"
              as: JobberAdmin
            - call: "POST /api/rack-price-postings"
              payload: { terminal_code: "TX-NORTH", product_id: "${p_gas}", effective_date: "2026-05-01", price_tc_per_gal: 2000 }
              as: PricingDesk
              captures: { pp_id: $.data.id }
            - call: "POST /api/rack-price-postings/${pp_id}/post"
              as: PricingDesk
            - call: "POST /api/storage-tanks"
              payload: { station_id: "${s_id}", product_id: "${p_gas}", capacity_gallons: 20000, opening_physical_gallons: 10000 }
              as: JobberAdmin
              captures: { t_id: $.data.id }
            - call: "POST /api/storage-tanks/${t_id}/gauge"
              payload: { reading_gallons: 10000, observed_temp_f: 60 }
              as: DealerOperator
              as_user_id: "${s_id}"
            - call: "POST /api/inventory-reconciliations"
              payload: { station_id: "${s_id}", period_start: "2026-05-01", period_end: "2026-05-31" }
              as: JobberAdmin
              as_user_id: "ops-alice"
              captures: { rec_id: $.data.id }
            - call: "POST /api/trucks"
              payload: { truck_code: "TRK-1", capacity_gallons: 12000 }
              as: JobberAdmin
              captures: { tr_id: $.data.id }
            - call: "POST /api/transport-drops"
              payload: { station_id: "${s_id}", tank_id: "${t_id}", truck_id: "${tr_id}", product_id: "${p_gas}", planned_gallons: 5000, window_start: "2026-05-02T08:00:00Z", window_end: "2026-05-02T12:00:00Z" }
              as: Dispatcher
              captures: { d_id: $.data.id }
            - call: "POST /api/transport-drops/${d_id}/schedule"
              as: Dispatcher
            - call: "POST /api/transport-drops/${d_id}/dispatch"
              as: Dispatcher
            - call: "POST /api/transport-drops/${d_id}/deliver"
              payload: { delivered_gallons: 5000 }
              as: Dispatcher
          trigger:
            - call: "POST /api/transport-drops/${d_id}/reconcile"
              as: Dispatcher
            - call: "GET /api/inventory-reconciliations/${rec_id}"
              as: JobberAdmin
              captures: { rec_status: $.data.status, rec_net: $.data.variance_net_gallons }
            - call: "GET /api/loss-events"
              payload: { reconciliation_id: "${rec_id}" }
              as: JobberAdmin
              captures: { loss_id: "$.data[0].id", loss_gal: "$.data[0].gallons", loss_auto: "$.data[0].auto_generated" }
            - call: "GET /api/storage-tanks/${t_id}"
              as: JobberAdmin
              captures: { book: $.data.book_inventory_gallons }
          assert:
            - "Tank book_inventory_gallons == 15000  (hop 1: 10000 + 5000)"
            - "Reconciliation variance_net_gallons == -5000  (hop 2)"
            - "Reconciliation status == VARIANCE_FLAGGED  (hop 3: abs(-5000) > 130)"
            - "Auto LossEvent exists: gallons == 5000, loss_type == SHRINKAGE, auto_generated == true, status == REPORTED  (hop 4)"

      - name: audit_default_cascades_to_agreement
        grounds:
          - state_machines.DealerStation.compliance_status=CURE_PERIOD_to_compliance_status=DEFAULT
          - state_machines.SupplyAgreement.ACTIVE_to_DEFAULT_NOTICE
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (audit creation, not drop
          reconcile): a FAIL audit during CURE_PERIOD flips the station to
          DEFAULT (hop 1), and that compliance mutation flips every ACTIVE
          SupplyAgreement of the station to DEFAULT_NOTICE (hop 2).
        test_recipe:
          setup:
            - "ACTIVE station with ACTIVE agreement; no prior audits"
          setup_api_calls:
            - call: "POST /api/dealer-stations"
              payload: { station_name: "S-Audit", state_code: "TX", home_terminal_code: "TX-NORTH", state_excise_tc_per_gal: 200, credit_limit_cents: 100000000 }
              as: JobberAdmin
              captures: { s_id: $.data.id }
            - call: "POST /api/dealer-stations/${s_id}/activate"
              as: JobberAdmin
            - call: "POST /api/supply-agreements"
              payload: { station_id: "${s_id}", term_start_date: "2026-01-01", term_end_date: "2026-12-31", committed_gallons: 100000, imaging_allowance_cents: 100000, margin_tc_per_gal: 25, shortfall_penalty_tc_per_gal: 20, buyout_method: "LOST_MARGIN" }
              as: JobberAdmin
              captures: { a_id: $.data.id }
            - call: "POST /api/supply-agreements/${a_id}/activate"
              as: JobberAdmin
            - call: "POST /api/brand-compliance-audits"
              payload: { station_id: "${s_id}", audit_date: "2026-05-10", score: 60, deficiencies: ["CANOPY"] }
              as: BrandInspector
          trigger:
            - call: "POST /api/brand-compliance-audits"
              payload: { station_id: "${s_id}", audit_date: "2026-05-20", score: 55, deficiencies: ["CANOPY", "SIGNAGE"] }
              as: BrandInspector
              captures: { audit_result: $.data.result }
            - call: "GET /api/dealer-stations/${s_id}"
              as: JobberAdmin
              captures: { comp: $.data.compliance_status }
            - call: "GET /api/supply-agreements/${a_id}"
              as: JobberAdmin
              captures: { a_status: $.data.status }
          assert:
            - "Second audit result == FAIL (55 < 70)"
            - "Station compliance_status == DEFAULT  (FAIL during CURE_PERIOD)"
            - "Agreement status == DEFAULT_NOTICE  (cascade hop 2)"
            - "Station cure_started_at is null after DEFAULT"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_before_fiscal_on_drop_create
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_STATION_NOT_ACTIVE]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: the request violates BOTH the
          station-active state gate and the credit-limit fiscal check; the state
          error ERR_STATION_NOT_ACTIVE (priority 6) must win over
          ERR_CREDIT_LIMIT_EXCEEDED (priority 10).
        test_recipe:
          setup:
            - "Station limit 1772800; exposure exactly 1772800 from a delivered 8000-gal drop; limit then lowered to 1000 (exposure > limit); station then SUSPENDED"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { product_code: "REGULAR_87", display_name: "Regular 87", category: "GASOLINE", federal_excise_tc_per_gal: 184, temp_coeff: 0.00065 }
              as: JobberAdmin
              captures: { p_gas: $.data.id }
            - call: "POST /api/dealer-stations"
              payload: { station_name: "S-PrioA", state_code: "NM", home_terminal_code: "TX-NORTH", state_excise_tc_per_gal: 0, credit_limit_cents: 1772800 }
              as: JobberAdmin
              captures: { s_id: $.data.id }
            - call: "POST /api/dealer-stations/${s_id}/activate"
              as: JobberAdmin
            - call: "POST /api/supply-agreements"
