  - rule_id: non_linear_state_machine
    note: >-
      Two non-linear shapes on DIFFERENT entities: ModelRun carries four INDEPENDENT
      parallel state dimensions, while Experiment carries a genuine CYCLE (READ_OUT ->
      REJECTED -> DRAFT) bounded by MAX_REDESIGNS.
    instances:
      - name: model_run_four_parallel_state_dimensions
        grounds:
          - "state_machines.ModelRun.validation_status=UNVALIDATED_to_validation_status=HOLDOUT_PASSED"
          - "state_machines.ModelRun.publication_status=UNPUBLISHED_to_publication_status=PUBLISHED"
          - "state_machines.ModelRun.calibration_status=NOT_REQUIRED_to_calibration_status=PENDING_CALIBRATION"
          - "entities.ModelRun.fields.fit_status"
          - "entities.ModelRun.fields.validation_status"
          - "entities.ModelRun.fields.calibration_status"
          - "entities.ModelRun.fields.publication_status"
          - "concurrency_rules[calibration-record-stale-model-run]"
        distinguishing_aspect: |
          One ModelRun row walks three of its four state axes in sequence and each step moves
          EXACTLY ONE axis: validate moves validation_status UNVALIDATED -> HOLDOUT_PASSED while
          fit_status stays FITTED and publication_status stays UNPUBLISHED; publish moves only
          publication_status; filing a CalibrationRecord moves only calibration_status
          NOT_REQUIRED -> PENDING_CALIBRATION - so the observable state is the 4-tuple
          (FITTED, HOLDOUT_PASSED, PENDING_CALIBRATION, PUBLISHED), which no single linear
          pipeline over one status column could represent.
        test_recipe:
          setup:
            - "Fixture F1 fitted in EFFECT_PERIOD mode; run1 is (FITTED, UNVALIDATED, NOT_REQUIRED, UNPUBLISHED)."
            - "One AUDIENCE_SPLIT DIFF_IN_DIFF Experiment on A_SEARCH taken to READ_OUT with measured_lift_pct 10.00, so a CalibrationRecord can be filed."
            - "Clock advanced 2026-08-31 -> 2026-09-07 -> 2026-10-05, forward only."
          setup_api_calls:
            - call: "POST /mmm/markets"
              payload: { market_code: "US_CORE", name: "US Core Brand Market", total_population: 10000000, annual_budget_ceiling_cents: 5000000000, currency_code: "USD" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { mkt: "$.data.id" }
            - call: "POST /mmm/media-channels"
              payload: { market_id: "${mkt}", channel_code: "A_SEARCH", channel_type: "SEARCH", adstock_decay_rate: 0.50, adstock_max_lag_periods: 2, saturation_half_point_cents: 200000, response_ceiling_units: 1200, min_spend_cents: 200000, max_spend_cents: 3000000, status: "ACTIVE" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { cha: "$.data.id" }
            - call: "POST /mmm/media-channels"
              payload: { market_id: "${mkt}", channel_code: "B_SOCIAL", channel_type: "SOCIAL", adstock_decay_rate: 0.25, adstock_max_lag_periods: 1, saturation_half_point_cents: 150000, response_ceiling_units: 800, min_spend_cents: 100000, max_spend_cents: 3000000, status: "ACTIVE" }
