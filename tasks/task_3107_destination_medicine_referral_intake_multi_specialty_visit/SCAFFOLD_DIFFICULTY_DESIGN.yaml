  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: case_creation_depends_on_referral_in_review
        grounds:
          - state_machines.VisitCase.transitions
          - errors.ERR_REFERRAL_NOT_IN_REVIEW
          - validations[priority=9]
        distinguishing_aspect: "VisitCase creation is gated on the Referral entity's state (must be IN_REVIEW): attempting to open a case while the referral is still RECORDS_PENDING (records received but never submitted) is rejected, crossing the VisitCase -> Referral pair."
        test_recipe:
          setup:
            - "Referral with one RECEIVED record (RECORDS_PENDING), never submitted to review."
          setup_api_calls:
            - *clock
            - *svc_card
            - *svc_neur
            - *ref_dom
            - *rec_1
          trigger:
            - call: "POST /visit-cases"
              payload: { referral_id: "${ref_id}", case_type: "DESTINATION", care_team_specialty_ids: ["${svc_card_id}", "${svc_neur_id}"] }
              as: IntakeCoordinator
              as_user_id: "ic-anna"
              captures: { err_ref: $.data.error_id }
          assert:
            - "the creation is rejected with HTTP 409 ERR_REFERRAL_NOT_IN_REVIEW"
            - "no VisitCase exists for the referral afterwards (GET /visit-cases?referral_id returns 0 rows)"

      - name: authorize_travel_depends_on_logistics_and_letter_state
        grounds:
          - state_machines.VisitCase.SCHEDULED_to_READY_TO_TRAVEL
          - errors.ERR_INTERPRETER_NOT_BOOKED
          - errors.ERR_STALE_ESTIMATE_LETTER
        distinguishing_aspect: "A different entity pair (VisitCase -> LogisticsArrangement and VisitCase -> EstimateLetter): travel authorization requires the INTERPRETER arrangement BOOKED and a non-stale ISSUED letter, so a SCHEDULED case with a REQUESTED-but-unbooked interpreter is rejected even though its own state machine transition is otherwise valid."
        test_recipe:
          setup:
            - "International DESTINATION case fully scheduled (itinerary CONFIRMED, case SCHEDULED); fresh estimate letter issued; INTERPRETER arrangement requested but not confirmed."
          setup_api_calls:
            - *clock
            - *svc_im
            - *svc_orth
            - *svc_gi
            - *svc_endo
            - *slot_o1
            - *slot_o2
            - *ref_intl
            - *rec2_1
            - call: "POST /referrals/${ref2_id}/medical-records/${rec2_id}/verify"
              payload: {}
              as: CaseReviewer
              as_user_id: "cr-boris"
            - call: "POST /referrals/${ref2_id}/submit-review"
              payload: {}
              as: IntakeCoordinator
