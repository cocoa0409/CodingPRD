        distinguishing_aspect: "One code covers five distinct shape failures: an unknown enum member, a non-ISO date, a YYYY-MM-DD value where YYYY-MM is required, the method-conditional pairing (FACTOR_BASED without utility_rate_change_pct), and a client attempt to write the system-only cert_type UA_ADJUSTMENT — which is reserved for the utility-allowance cascade."
