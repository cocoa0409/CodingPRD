          assert:
            - "all eight trigger responses have status 404 and response_type error"
            - "the error_ids are, in order, ERR_DISTRIBUTOR_NOT_FOUND, ERR_CENTER_NOT_FOUND, ERR_MACHINE_NOT_FOUND, ERR_ACCOUNT_NOT_FOUND, ERR_VISIT_NOT_FOUND, ERR_BAG_DROP_NOT_FOUND, ERR_BATCH_NOT_FOUND and ERR_PERIOD_NOT_FOUND"
            - "every error body carries a non-empty message and no data payload fields"

