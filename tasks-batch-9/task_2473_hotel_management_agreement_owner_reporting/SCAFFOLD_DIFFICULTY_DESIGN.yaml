            - call: "POST /hotel-management/agreements/${agr8b}/brand-disputes"
              payload: { franchise_requirement_ref: "BSR-2026-099", estimated_cost_cents: 900000, remediation_start_utc: "2026-09-14T00:00:00Z", remediation_deadline_utc: "2026-10-15T00:00:00Z" }
