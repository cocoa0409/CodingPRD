              captures: { c_tpa: "$.data.id" }
            - call: "POST /compliance/plan-years/${py}/activate"
              payload: {}
              as: PlanSponsorAdmin
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Alpine Script Benefit Managers", vendor_type: "PBM", contact_email: "data@alpinescript.example" }
