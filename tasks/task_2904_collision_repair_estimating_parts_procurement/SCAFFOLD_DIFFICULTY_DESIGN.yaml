            - "hop 2: RepairOrder.${ro_id}.approved_labor_hours == 8.5, labor_subtotal_cents == 51000, supplies_fee_cents == 2040, pre_tax_total_cents == 53040, insurer_authorized_cents == 3040, customer_pay_cents == 50000"
            - "hop 3: RepairOrder.${ro_id}.authorization_posture == CONSENT_REQUIRED"
            - "hop 4: RepairOrder.${ro_id}.consent_state == NONE, consent_basis_cents is null, consent_alternate_parts == false"
