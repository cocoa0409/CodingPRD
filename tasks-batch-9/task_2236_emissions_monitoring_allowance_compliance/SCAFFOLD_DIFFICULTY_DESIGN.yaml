              as_user_id: "prep_1"
          assert:
            - "before the triggers: OperatingHour.${h1_id}.heat_input_mmbtu == 562.500 and OperatingHour.${h1_id}.so2_mass_lbs == 765.0"
            - "trigger 1 returns HTTP 409 with error_id == ERR_FUEL_SAMPLE_NOT_ANALYZED and creates no OperatingHour (FuelSample B is still PENDING)"
            - "after trigger 2: FuelSample.${fs_a}.status == INVALIDATED with the supplied invalidation_reason"
            - "after trigger 2: OperatingHour.${h1_id}.heat_input_mmbtu == 562.500 — invalidation does NOT retroactively recompute stored hours"
            - "trigger 3 returns HTTP 409 with error_id == ERR_FUEL_ANALYSIS_INVALIDATED and QuarterlyReport.${q2_id}.status stays DRAFT"
            - "after trigger 4: FuelSample.${fs_a}.status == ANALYZED, invalidation_reason == null and analysis_method == ASTM_D4239"
            - "trigger 5 returns HTTP 200 and QuarterlyReport.${q2_id}.status == VALIDATED"
            - "QuarterlyReport.${q2_id}.total_heat_input_mmbtu == 1687.500 and total_so2_lbs == 2295.0"
            - "QuarterlyReport.${q2_id}.total_nox_lbs == 303.9 and total_co2_tons == 173.223 and total_so2_tons == 1.148"
            - "QuarterlyReport.${q2_id}.monitor_data_availability_pct == 100.0 with operating_hour_count == 3"

      - name: cross_entity_outage_activation_requires_unit_off_line
        grounds:
          - state_machines.ControlOutageWindow.PLANNED_to_ACTIVE
          - state_machines.Unit.ONLINE_to_OFFLINE
          - entities.Unit.fields.control_status
          - errors[ERR_INVALID_STATE_TRANSITION]
          - endpoints[POST /emissions/control-outages/{id}/transition]
        distinguishing_aspect: |
          A third entity pair with the dependency running the other way —
          ControlOutageWindow depends on Unit, and the refusal is deliberately
          ERR_INVALID_STATE_TRANSITION and NOT ERR_UNIT_NOT_ONLINE, because the
          precondition wants the unit NOT online; activation then writes back
          into the Unit by setting control_status = OUT_OF_SERVICE.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "unit U1 (control_device FGD) patched ONLINE"
            - "one PLANNED ControlOutageWindow on U1 for [2026-08-02, 2026-08-05) with outage_type PLANNED_MAINTENANCE and control_device FGD"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z", max_concurrent_control_outages: 2 }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "FGD" }
              as: RegulatoryReviewer
              captures: { unit_id: $.data.id }
            - call: "PATCH /emissions/units/${unit_id}/dispatch"
              payload: { dispatch_state: "ONLINE" }
              as: FacilityOperator
              as_user_id: "op_alpha"
            - call: "POST /emissions/units/${unit_id}/control-outages"
              payload: { start_utc: "2026-08-02T00:00:00Z", end_utc: "2026-08-05T00:00:00Z", outage_type: "PLANNED_MAINTENANCE", control_device: "FGD" }
              as: FacilityOperator
              as_user_id: "op_alpha"
              captures: { out_id: $.data.id }
          trigger:
            - call: "POST /emissions/control-outages/${out_id}/transition"
              payload: { action: "ACTIVATE" }
              as: FacilityOperator
              as_user_id: "op_alpha"
              captures: { error_id: $.data.error_id }
            - call: "PATCH /emissions/units/${unit_id}/dispatch"
              payload: { dispatch_state: "OFFLINE" }
              as: FacilityOperator
              as_user_id: "op_alpha"
            - call: "POST /emissions/control-outages/${out_id}/transition"
              payload: { action: "ACTIVATE" }
              as: FacilityOperator
              as_user_id: "op_alpha"
            - call: "PATCH /emissions/units/${unit_id}/dispatch"
              payload: { dispatch_state: "ONLINE" }
              as: FacilityOperator
              as_user_id: "op_alpha"
              captures: { blocked_error_id: $.data.error_id }
            - call: "POST /emissions/control-outages/${out_id}/transition"
              payload: { action: "CLOSE" }
              as: FacilityOperator
              as_user_id: "op_alpha"
            - call: "PATCH /emissions/units/${unit_id}/dispatch"
              payload: { dispatch_state: "ONLINE" }
              as: FacilityOperator
              as_user_id: "op_alpha"
          assert:
            - "trigger 1 returns HTTP 409 with error_id == ERR_INVALID_STATE_TRANSITION (not ERR_UNIT_NOT_ONLINE) and ControlOutageWindow.${out_id}.status stays PLANNED"
            - "trigger 1 leaves Unit.${unit_id}.control_status == AVAILABLE"
            - "trigger 3 returns HTTP 200, ControlOutageWindow.${out_id}.status == ACTIVE and activated_utc == 2026-08-01T00:00:00Z"
            - "after trigger 3: Unit.${unit_id}.control_status == OUT_OF_SERVICE"
            - "trigger 4 returns HTTP 409 with error_id == ERR_INVALID_STATE_TRANSITION — an ACTIVE PLANNED_MAINTENANCE outage pins the unit off line"
            - "trigger 5 returns HTTP 200 with ControlOutageWindow.${out_id}.status == CLOSED and closed_utc == 2026-08-01T00:00:00Z"
            - "trigger 6 returns HTTP 200 and Unit.${unit_id}.dispatch_state == ONLINE"

      - name: cross_entity_certify_blocked_by_outstanding_failed_rata_test
        grounds:
          - validations[priority=245]
          - state_machines.MonitoringSystem.RECERTIFICATION_PENDING_to_CERTIFIED
          - state_machines.RataTest.FAILED_to_SCHEDULED
          - errors[ERR_MONITOR_NOT_CERTIFIED]
          - entities.MonitoringSystem.fields.bias_adjustment_factor
          - calculations.hourly_heat_input_and_mass
        distinguishing_aspect: |
          A fourth pair, MonitoringSystem depending on its own RataTest children:
          certification is blocked while ANY RataTest of the monitor is FAILED,
          and once the retest passes the certification adopts that test's
          bias_adjustment_factor 1.0883, which raises a subsequent hour's
          so2_mass_lbs from 292.2 to 318.0 while heat input stays 555.556.
        test_recipe:
          setup:
            - "logical clock at 2026-04-02T00:00:00Z"
            - "unit U1 ONLINE with one SO2 CEM (span 400) that already has a PASSED daily calibration and is therefore CAL_CURRENT"
            - "one RataTest on that monitor carrying SET B, evaluated on REFERENCE_MEAN and therefore FAILED with relative_accuracy_pct 10.7"
            - "a DRAFT 2026 Q2 report with no hours yet"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "FGD" }
              as: RegulatoryReviewer
              captures: { unit_id: $.data.id }
            - call: "PATCH /emissions/units/${unit_id}/dispatch"
              payload: { dispatch_state: "ONLINE" }
              as: FacilityOperator
              as_user_id: "op_alpha"
            - call: "POST /emissions/units/${unit_id}/monitoring-systems"
              payload: { parameter: "SO2", system_type: "CEM", span_value: 400.0, calibration_error_spec_pct: 2.5 }
              as: QAAnalyst
              captures: { cem_id: $.data.id, cem_v1: $.data.version }
            - call: "POST /emissions/monitoring-systems/${cem_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${cem_v1}", calibration_utc: "2026-04-01T00:00:00Z", zero_reference_value: 0.0, zero_measured_value: 0.0, span_reference_value: 360.0, span_measured_value: 368.0 }
              as: QAAnalyst
            - call: "POST /emissions/monitoring-systems/${cem_id}/rata-tests"
              payload: { window_start_utc: "2026-04-03T00:00:00Z", window_end_utc: "2026-04-04T00:00:00Z" }
              as: QAAnalyst
              captures: { rt_id: $.data.id }
            - call: "POST /emissions/rata-tests/${rt_id}/runs"
              payload: { runs: [{ reference_value: 0.262, cems_value: 0.246 }, { reference_value: 0.266, cems_value: 0.236 }, { reference_value: 0.268, cems_value: 0.244 }, { reference_value: 0.270, cems_value: 0.258 }, { reference_value: 0.270, cems_value: 0.238 }, { reference_value: 0.272, cems_value: 0.248 }, { reference_value: 0.274, cems_value: 0.254 }, { reference_value: 0.274, cems_value: 0.246 }, { reference_value: 0.274, cems_value: 0.240 }] }
              as: QAAnalyst
            - call: "POST /emissions/rata-tests/${rt_id}/evaluate"
              payload: { ra_basis: "REFERENCE_MEAN" }
              as: QAAnalyst
            - call: "POST /emissions/units/${unit_id}/quarterly-reports"
              payload: { year: 2026, quarter: 2 }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { q2_id: $.data.id, q2_v1: $.data.version }
          trigger:
            - call: "POST /emissions/monitoring-systems/${cem_id}/qa-status"
              payload: { action: "CERTIFY" }
              as: QAAnalyst
              captures: { error_id: $.data.error_id }
            - call: "POST /emissions/rata-tests/${rt_id}/reschedule"
              payload: { window_start_utc: "2026-04-05T00:00:00Z", window_end_utc: "2026-04-06T00:00:00Z" }
              as: QAAnalyst
            - call: "POST /emissions/rata-tests/${rt_id}/runs"
              payload: { runs: [{ reference_value: 0.262, cems_value: 0.248 }, { reference_value: 0.266, cems_value: 0.240 }, { reference_value: 0.268, cems_value: 0.234 }, { reference_value: 0.270, cems_value: 0.252 }, { reference_value: 0.270, cems_value: 0.256 }, { reference_value: 0.272, cems_value: 0.252 }, { reference_value: 0.274, cems_value: 0.240 }, { reference_value: 0.274, cems_value: 0.260 }, { reference_value: 0.274, cems_value: 0.251 }] }
              as: QAAnalyst
            - call: "POST /emissions/rata-tests/${rt_id}/evaluate"
              payload: { ra_basis: "REFERENCE_MEAN" }
              as: QAAnalyst
            - call: "POST /emissions/monitoring-systems/${cem_id}/qa-status"
              payload: { action: "CERTIFY" }
              as: QAAnalyst
            - call: "POST /emissions/units/${unit_id}/operating-hours"
              payload: { expected_quarterly_report_version: "${q2_v1}", hour_begin_utc: "2026-04-01T00:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { h_id: $.data.id }
          assert:
            - "before trigger 1: RataTest.${rt_id}.status == FAILED and MonitoringSystem.${cem_id}.cal_status == CAL_CURRENT"
            - "trigger 1 returns HTTP 409 with error_id == ERR_MONITOR_NOT_CERTIFIED (not ERR_CALIBRATION_NOT_CURRENT — the calibration is fine)"
            - "trigger 1 leaves MonitoringSystem.${cem_id}.qa_status == RECERTIFICATION_PENDING"
            - "after trigger 4: RataTest.${rt_id}.status == PASSED, relative_accuracy_pct == 10.0, attempt_number == 2 and bias_adjustment_factor == 1.0883"
            - "trigger 5 returns HTTP 200 with MonitoringSystem.${cem_id}.qa_status == CERTIFIED"
            - "after trigger 5: MonitoringSystem.${cem_id}.bias_adjustment_factor == 1.0883 — adopted from the PASSED RataTest with the greatest window_end_utc"
            - "OperatingHour.${h_id}.so2_mass_lbs == 318.0 (292.2 unadjusted x 1.0883, rounded to one decimal)"
            - "OperatingHour.${h_id}.heat_input_mmbtu == 555.556 and nox_mass_lbs == 100.0 and co2_mass_tons == 59.700 — the bias factor touches SO2 only"

  # ===========================================================================
  # RULE 8 — resource_temporal_overlap
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: overlap_rata_windows_are_half_open_per_monitoring_system
        grounds:
          - validations[priority=305]
          - validations[priority=310]
          - validations[priority=315]
          - errors[ERR_RATA_WINDOW_OVERLAP]
          - errors[ERR_RATA_WINDOW_IN_PAST]
          - errors[ERR_INVALID_INTERVAL]
          - endpoints[POST /emissions/monitoring-systems/{id}/rata-tests]
        distinguishing_aspect: |
          The RATA-window resource with HALF-OPEN [start, end) semantics scoped
          to one monitoring_system_id: abutting windows are legal, a window
          starting one second before another ends is not, an identical window on
          a sibling monitoring system is legal, and a window starting exactly at
          the logical clock is not "in the past".
        test_recipe:
          setup:
            - "logical clock at 2026-04-02T00:00:00Z"
            - "unit U1 with two monitoring systems: an SO2 CEM and a CO2 CEM"
            - "no RataTest exists yet on either system"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "FGD" }
              as: RegulatoryReviewer
              captures: { unit_id: $.data.id }
            - call: "POST /emissions/units/${unit_id}/monitoring-systems"
              payload: { parameter: "SO2", system_type: "CEM", span_value: 400.0, calibration_error_spec_pct: 2.5 }
              as: QAAnalyst
              captures: { sys_a: $.data.id }
            - call: "POST /emissions/units/${unit_id}/monitoring-systems"
              payload: { parameter: "CO2", system_type: "CEM", span_value: 20.0, calibration_error_spec_pct: 2.5 }
              as: QAAnalyst
              captures: { sys_b: $.data.id }
          trigger:
            - call: "POST /emissions/monitoring-systems/${sys_a}/rata-tests"
              payload: { window_start_utc: "2026-04-03T00:00:00Z", window_end_utc: "2026-04-04T00:00:00Z" }
              as: QAAnalyst
              captures: { rt1_id: $.data.id }
            - call: "POST /emissions/monitoring-systems/${sys_a}/rata-tests"
              payload: { window_start_utc: "2026-04-04T00:00:00Z", window_end_utc: "2026-04-05T00:00:00Z" }
              as: QAAnalyst
              captures: { rt2_id: $.data.id }
            - call: "POST /emissions/monitoring-systems/${sys_a}/rata-tests"
              payload: { window_start_utc: "2026-04-04T23:59:59Z", window_end_utc: "2026-04-06T00:00:00Z" }
              as: QAAnalyst
              captures: { overlap_error_id: $.data.error_id }
            - call: "POST /emissions/monitoring-systems/${sys_a}/rata-tests"
              payload: { window_start_utc: "2026-04-02T00:00:00Z", window_end_utc: "2026-04-03T00:00:00Z" }
              as: QAAnalyst
              captures: { rt4_id: $.data.id }
            - call: "POST /emissions/monitoring-systems/${sys_a}/rata-tests"
              payload: { window_start_utc: "2026-04-01T00:00:00Z", window_end_utc: "2026-04-01T12:00:00Z" }
              as: QAAnalyst
              captures: { past_error_id: $.data.error_id }
            - call: "POST /emissions/monitoring-systems/${sys_a}/rata-tests"
              payload: { window_start_utc: "2026-04-07T00:00:00Z", window_end_utc: "2026-04-07T00:00:00Z" }
              as: QAAnalyst
              captures: { interval_error_id: $.data.error_id }
            - call: "POST /emissions/monitoring-systems/${sys_b}/rata-tests"
              payload: { window_start_utc: "2026-04-03T00:00:00Z", window_end_utc: "2026-04-04T00:00:00Z" }
              as: QAAnalyst
              captures: { rt7_id: $.data.id }
          assert:
            - "trigger 1 returns HTTP 201 with RataTest.${rt1_id}.status == SCHEDULED and attempt_number == 1"
            - "trigger 2 returns HTTP 201 — [04-04, 04-05) abuts [04-03, 04-04) and the end bound is exclusive"
            - "trigger 3 returns HTTP 409 with error_id == ERR_RATA_WINDOW_OVERLAP — one second of shared time is enough"
            - "trigger 4 returns HTTP 201 with RataTest.${rt4_id}.window_start_utc == 2026-04-02T00:00:00Z — starting exactly at the clock is not in the past"
            - "trigger 5 returns HTTP 422 with error_id == ERR_RATA_WINDOW_IN_PAST"
            - "trigger 6 returns HTTP 422 with error_id == ERR_INVALID_INTERVAL — end must be strictly after start"
            - "trigger 7 returns HTTP 201 with RataTest.${rt7_id}.monitoring_system_id == ${sys_b} — the window resource is scoped per monitoring system"
            - "GET /emissions/rata-tests?monitoring_system_id=${sys_a} returns exactly 3 rows, all SCHEDULED"
            - "GET /emissions/rata-tests?monitoring_system_id=${sys_b} returns exactly 1 row"

      - name: overlap_control_outages_are_scoped_per_unit_and_cancellation_releases_the_interval
        grounds:
          - validations[priority=320]
          - state_machines.ControlOutageWindow.PLANNED_to_CANCELLED
          - errors[ERR_CONTROL_OUTAGE_OVERLAP]
          - errors[ERR_REASON_REQUIRED]
          - endpoints[POST /emissions/units/{id}/control-outages]
        distinguishing_aspect: |
          A DIFFERENT resource with DIFFERENT interval semantics: the outage
          interval is keyed by (unit_id, control_device) and only PLANNED or
          ACTIVE rows occupy it, so the identical interval is legal on a sibling
          unit and a CANCELLED row releases its interval for reuse — something no
          RataTest window does.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one facility with two FGD units, U1 and U2, both in their initial OFFLINE dispatch state"
            - "no ControlOutageWindow exists yet"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z", max_concurrent_control_outages: 4 }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "FGD" }
              as: RegulatoryReviewer
              captures: { u1_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U2", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "FGD" }
              as: RegulatoryReviewer
              captures: { u2_id: $.data.id }
          trigger:
            - call: "POST /emissions/units/${u1_id}/control-outages"
              payload: { start_utc: "2026-08-10T00:00:00Z", end_utc: "2026-08-14T00:00:00Z", outage_type: "PLANNED_MAINTENANCE", control_device: "FGD" }
              as: FacilityOperator
              as_user_id: "op_alpha"
              captures: { o1_id: $.data.id }
            - call: "POST /emissions/units/${u2_id}/control-outages"
              payload: { start_utc: "2026-08-10T00:00:00Z", end_utc: "2026-08-14T00:00:00Z", outage_type: "PLANNED_MAINTENANCE", control_device: "FGD" }
              as: FacilityOperator
              as_user_id: "op_alpha"
              captures: { o2_id: $.data.id }
            - call: "POST /emissions/units/${u1_id}/control-outages"
              payload: { start_utc: "2026-08-13T00:00:00Z", end_utc: "2026-08-16T00:00:00Z", outage_type: "FORCED", control_device: "FGD" }
              as: FacilityOperator
              as_user_id: "op_alpha"
              captures: { overlap_error_id: $.data.error_id }
            - call: "POST /emissions/units/${u1_id}/control-outages"
              payload: { start_utc: "2026-08-14T00:00:00Z", end_utc: "2026-08-16T00:00:00Z", outage_type: "FORCED", control_device: "FGD" }
              as: FacilityOperator
              as_user_id: "op_alpha"
              captures: { o4_id: $.data.id }
            - call: "POST /emissions/control-outages/${o1_id}/transition"
              payload: { action: "CANCEL" }
              as: FacilityOperator
              as_user_id: "op_alpha"
              captures: { reason_error_id: $.data.error_id }
            - call: "POST /emissions/control-outages/${o1_id}/transition"
              payload: { action: "CANCEL", reason: "vendor deferred the absorber liner replacement" }
              as: FacilityOperator
              as_user_id: "op_alpha"
            - call: "POST /emissions/units/${u1_id}/control-outages"
              payload: { start_utc: "2026-08-11T00:00:00Z", end_utc: "2026-08-13T00:00:00Z", outage_type: "PLANNED_MAINTENANCE", control_device: "FGD" }
              as: FacilityOperator
              as_user_id: "op_alpha"
              captures: { o7_id: $.data.id }
          assert:
            - "trigger 1 returns HTTP 201 with ControlOutageWindow.${o1_id}.status == PLANNED"
            - "trigger 2 returns HTTP 201 — the same interval on a sibling unit does not collide"
            - "trigger 3 returns HTTP 409 with error_id == ERR_CONTROL_OUTAGE_OVERLAP ([08-13, 08-16) shares 24 hours with [08-10, 08-14))"
            - "trigger 4 returns HTTP 201 — [08-14, 08-16) abuts the existing window exactly and is accepted"
            - "trigger 5 returns HTTP 422 with error_id == ERR_REASON_REQUIRED and ControlOutageWindow.${o1_id}.status stays PLANNED"
            - "trigger 6 returns HTTP 200 with ControlOutageWindow.${o1_id}.status == CANCELLED and the supplied cancellation_reason"
            - "trigger 7 returns HTTP 201 — the CANCELLED row no longer occupies [08-10, 08-14)"
            - "GET /emissions/control-outages?unit_id=${u1_id} returns 3 rows: one CANCELLED and two PLANNED"
            - "Unit.${u1_id}.control_status == AVAILABLE throughout — planning an outage does not take the device out of service"

      - name: overlap_facility_wide_active_outage_ceiling_is_aggregate_not_pairwise
        grounds:
          - validations[priority=325]
          - entities.Facility.fields.max_concurrent_control_outages
          - state_machines.ControlOutageWindow.PLANNED_to_ACTIVE
          - state_machines.ControlOutageWindow.ACTIVE_to_CLOSED
          - errors[ERR_CONCURRENT_OUTAGE_LIMIT]
        distinguishing_aspect: |
          A third overlap semantics: an AGGREGATE COUNT of ACTIVE windows across
          all units of one facility, not a pairwise interval test — the three
          windows share identical intervals on three different units so the
          pairwise rule never fires, and only the third ACTIVATE is refused
          because the facility ceiling of 2 is already consumed.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one facility with max_concurrent_control_outages 2 and three FGD units U1, U2, U3, all OFFLINE"
            - "each unit carries one PLANNED ControlOutageWindow over the identical interval [2026-08-10, 2026-08-14)"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z", max_concurrent_control_outages: 2 }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "FGD" }
              as: RegulatoryReviewer
              captures: { u1_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U2", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "FGD" }
              as: RegulatoryReviewer
              captures: { u2_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U3", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "FGD" }
              as: RegulatoryReviewer
              captures: { u3_id: $.data.id }
            - call: "POST /emissions/units/${u1_id}/control-outages"
              payload: { start_utc: "2026-08-10T00:00:00Z", end_utc: "2026-08-14T00:00:00Z", outage_type: "PLANNED_MAINTENANCE", control_device: "FGD" }
              as: FacilityOperator
              as_user_id: "op_alpha"
              captures: { o1_id: $.data.id }
            - call: "POST /emissions/units/${u2_id}/control-outages"
              payload: { start_utc: "2026-08-10T00:00:00Z", end_utc: "2026-08-14T00:00:00Z", outage_type: "PLANNED_MAINTENANCE", control_device: "FGD" }
              as: FacilityOperator
              as_user_id: "op_alpha"
              captures: { o2_id: $.data.id }
            - call: "POST /emissions/units/${u3_id}/control-outages"
              payload: { start_utc: "2026-08-10T00:00:00Z", end_utc: "2026-08-14T00:00:00Z", outage_type: "PLANNED_MAINTENANCE", control_device: "FGD" }
              as: FacilityOperator
              as_user_id: "op_alpha"
              captures: { o3_id: $.data.id }
          trigger:
            - call: "POST /emissions/control-outages/${o1_id}/transition"
              payload: { action: "ACTIVATE" }
              as: FacilityOperator
              as_user_id: "op_alpha"
            - call: "POST /emissions/control-outages/${o2_id}/transition"
              payload: { action: "ACTIVATE" }
              as: FacilityOperator
              as_user_id: "op_alpha"
            - call: "POST /emissions/control-outages/${o3_id}/transition"
              payload: { action: "ACTIVATE" }
              as: FacilityOperator
              as_user_id: "op_alpha"
              captures: { error_id: $.data.error_id }
            - call: "POST /emissions/control-outages/${o1_id}/transition"
              payload: { action: "CLOSE" }
              as: FacilityOperator
              as_user_id: "op_alpha"
            - call: "POST /emissions/control-outages/${o3_id}/transition"
              payload: { action: "ACTIVATE" }
              as: FacilityOperator
              as_user_id: "op_alpha"
          assert:
            - "all three windows were created without ERR_CONTROL_OUTAGE_OVERLAP even though their intervals are identical — the pairwise key includes unit_id"
            - "trigger 1 and trigger 2 each return HTTP 200 with status ACTIVE"
            - "after trigger 2: Unit.${u1_id}.control_status == OUT_OF_SERVICE and Unit.${u2_id}.control_status == OUT_OF_SERVICE"
            - "trigger 3 returns HTTP 409 with error_id == ERR_CONCURRENT_OUTAGE_LIMIT and ControlOutageWindow.${o3_id}.status stays PLANNED"
            - "trigger 3 leaves Unit.${u3_id}.control_status == AVAILABLE"
            - "trigger 4 returns HTTP 200 with ControlOutageWindow.${o1_id}.status == CLOSED and Unit.${u1_id}.control_status == AVAILABLE"
            - "trigger 5 now returns HTTP 200 — closing one ACTIVE row freed a slot in the aggregate count"
            - "GET /emissions/control-outages?status=ACTIVE returns exactly 2 rows, for units ${u2_id} and ${u3_id}"

  # ===========================================================================
  # RULE 9 — compensating_invariant
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: invariant_allowance_tonnage_conserved_across_settle_and_reverse
        grounds:
          - calculations.allowance_transaction_settlement
          - entities.AllowanceTransaction.fields.debited_prior_tons
          - concurrency_rules[allowance-transaction-create-stale-account]
          - state_machines.AllowanceTransaction.SETTLED_to_REVERSED
          - errors[ERR_INSUFFICIENT_ALLOWANCES]
        distinguishing_aspect: |
          The conserved quantity is ALLOWANCE TONNAGE, pinned as the explicit sum
          holdings_prior + holdings_current + holdings_next + settled SURRENDER
          + settled PENALTY_DEDUCTION - settled PURCHASE/TRANSFER_IN
          + settled TRANSFER_OUT == 40.000 at every checkpoint, including after a
          rejected settle and after a reversal that credits back the STORED
          per-bucket debits (7.000 / 3.000 / 0.000) rather than re-deriving them.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one facility with a 2026 ARP_SO2 allowance account endowed with prior 7.000, current 18.000 and next 15.000 tons (endowment 40.000)"
            - "no allowance transactions exist"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/allowance-accounts"
              payload: { program: "ARP_SO2", compliance_year: 2026, holdings_current_vintage_tons: 18.000, holdings_prior_vintage_tons: 7.000, holdings_next_vintage_tons: 15.000 }
              as: RegulatoryReviewer
              captures: { acct_id: $.data.id, acct_v1: $.data.version }
          trigger:
            - call: "POST /emissions/allowance-transactions"
              payload: { expected_allowance_account_version: "${acct_v1}", allowance_account_id: "${acct_id}", transaction_type: "SURRENDER", quantity_tons: 10.000, vintage_year: 2026 }
              as: AllowanceTrader
              captures: { tx1_id: $.data.id }
            - call: "POST /emissions/allowance-transactions/${tx1_id}/transition"
              payload: { action: "RECORD" }
              as: DesignatedRepresentative
              as_user_id: "dr_1"
            - call: "POST /emissions/allowance-transactions/${tx1_id}/transition"
              payload: { action: "SETTLE" }
              as: DesignatedRepresentative
              as_user_id: "dr_1"
            - call: "GET /emissions/allowance-accounts/${acct_id}"
              payload: {}
              as: AllowanceTrader
              captures: { acct_v_after_settle: $.data.version }
            - call: "POST /emissions/allowance-transactions"
              payload: { expected_allowance_account_version: "${acct_v_after_settle}", allowance_account_id: "${acct_id}", transaction_type: "SURRENDER", quantity_tons: 30.000, vintage_year: 2026 }
              as: AllowanceTrader
              captures: { tx2_id: $.data.id }
            - call: "POST /emissions/allowance-transactions/${tx2_id}/transition"
              payload: { action: "RECORD" }
              as: DesignatedRepresentative
              as_user_id: "dr_1"
            - call: "POST /emissions/allowance-transactions/${tx2_id}/transition"
              payload: { action: "SETTLE" }
              as: DesignatedRepresentative
              as_user_id: "dr_1"
              captures: { error_id: $.data.error_id }
            - call: "POST /emissions/allowance-transactions/${tx1_id}/transition"
              payload: { action: "REVERSE", reason: "counterparty deal cancelled before the transfer cleared" }
              as: DesignatedRepresentative
              as_user_id: "dr_1"
            - call: "GET /emissions/allowance-accounts/${acct_id}"
              payload: {}
              as: AllowanceTrader
              captures: { acct_v_after_reverse: $.data.version }
            - call: "POST /emissions/allowance-transactions"
              payload: { expected_allowance_account_version: "${acct_v_after_reverse}", allowance_account_id: "${acct_id}", transaction_type: "PURCHASE", quantity_tons: 5.000, vintage_year: 2027 }
              as: AllowanceTrader
              captures: { tx3_id: $.data.id }
            - call: "POST /emissions/allowance-transactions/${tx3_id}/transition"
              payload: { action: "RECORD" }
              as: DesignatedRepresentative
              as_user_id: "dr_1"
            - call: "POST /emissions/allowance-transactions/${tx3_id}/transition"
              payload: { action: "SETTLE" }
              as: DesignatedRepresentative
              as_user_id: "dr_1"
          assert:
            - "checkpoint 0 (before trigger 1): 7.000 + 18.000 + 15.000 + 0.000 + 0.000 - 0.000 + 0.000 == 40.000"
            - "after trigger 1: AllowanceTransaction.${tx1_id}.status == PROPOSED, origin == MANUAL, debited_prior_tons == 0.000 and holdings are still 7.000 / 18.000 / 15.000"
            - "after trigger 1: AllowanceTransaction.${tx1_id}.allowance_account_version_after == 2"
            - "after trigger 3: AllowanceTransaction.${tx1_id}.debited_prior_tons == 7.000, debited_current_tons == 3.000 and debited_next_tons == 0.000 — oldest vintage first"
            - "after trigger 3: AllowanceAccount.${acct_id} holdings are 0.000 prior / 15.000 current / 15.000 next with surrendered_tons == 10.000 and shortfall_tons == 0.000"
            - "checkpoint 1 (after trigger 3): 0.000 + 15.000 + 15.000 + 10.000 + 0.000 - 0.000 + 0.000 == 40.000"
            - "trigger 7 returns HTTP 409 with error_id == ERR_INSUFFICIENT_ALLOWANCES (30.000 requested, only 15.000 available across prior and current)"
            - "trigger 7 leaves AllowanceTransaction.${tx2_id}.status == RECORDED with all three debited_* fields 0.000"
            - "checkpoint 2 (after the rejected trigger 7): holdings are unchanged at 0.000 / 15.000 / 15.000 and the sum is still 40.000 — a rejected settle moves nothing"
            - "trigger 8 returns HTTP 200 with AllowanceTransaction.${tx1_id}.status == REVERSED and the supplied reversal_reason"
            - "after trigger 8: AllowanceAccount.${acct_id} holdings are exactly 7.000 / 18.000 / 15.000, surrendered_tons == 0.000, status stays OPEN (origin was MANUAL, not TRUE_UP_SURRENDER)"
            - "checkpoint 3 (after trigger 8): 7.000 + 18.000 + 15.000 + 0.000 + 0.000 - 0.000 + 0.000 == 40.000"
            - "after trigger 12: holdings are 7.000 / 18.000 / 20.000 with all three debited_* fields of ${tx3_id} equal to 0.000"
            - "checkpoint 4 (after trigger 12): 7.000 + 18.000 + 20.000 + 0.000 + 0.000 - 5.000 + 0.000 == 40.000 — a settled purchase raises holdings without breaking the endowment identity"
            - "Facility.${fac_id}.compliance_posture == COMPLIANT at every checkpoint — no obligation was ever computed"

      - name: invariant_certified_so2_ledger_returns_to_zero_across_certify_and_revoke
        grounds:
          - entities.Unit.fields.certified_so2_lbs_ytd
          - entities.ComplianceCertification.fields.certified_so2_lbs_snapshot
          - state_machines.ComplianceCertification.SIGNED_to_REVOKED
          - state_machines.QuarterlyReport.CERTIFIED_to_REJECTED
          - endpoints[POST /emissions/certifications/{id}/revoke]
        distinguishing_aspect: |
          A DIFFERENT conserved quantity — the emissions ledger
          Unit.certified_so2_lbs_ytd, pinned as
          sum(total_so2_lbs of this unit's CERTIFIED/ACCEPTED reports) — which
          walks 0.0 -> 876.6 -> 0.0 -> 876.6 -> 0.0 across a sign, an explicit
          revoke, a re-sign by a different representative and a REJECT
          disposition, always debiting the stored snapshot rather than
          re-deriving the total.
        test_recipe:
          setup:
            - "logical clock at 2026-04-02T00:00:00Z"
            - "unit U1 with one CERTIFIED SO2 CEM (span 400, PASSED calibration)"
            - "a 2026 Q2 report carrying three identical CEMS hours (flow 8000000, co2 12.5, so2 220 ppm, nox 0.180), validated and submitted by prep_1"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "FGD" }
              as: RegulatoryReviewer
              captures: { unit_id: $.data.id }
            - call: "POST /emissions/units/${unit_id}/monitoring-systems"
              payload: { parameter: "SO2", system_type: "CEM", span_value: 400.0, calibration_error_spec_pct: 2.5 }
              as: QAAnalyst
              captures: { cem_id: $.data.id, cem_v1: $.data.version }
            - call: "POST /emissions/monitoring-systems/${cem_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${cem_v1}", calibration_utc: "2026-04-01T00:00:00Z", zero_reference_value: 0.0, zero_measured_value: 0.0, span_reference_value: 360.0, span_measured_value: 368.0 }
              as: QAAnalyst
            - call: "POST /emissions/monitoring-systems/${cem_id}/qa-status"
              payload: { action: "CERTIFY" }
              as: QAAnalyst
            - call: "POST /emissions/units/${unit_id}/quarterly-reports"
              payload: { year: 2026, quarter: 2 }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { q2_id: $.data.id, q2_v1: $.data.version }
            - call: "POST /emissions/units/${unit_id}/operating-hours/bulk"
              payload: { expected_quarterly_report_version: "${q2_v1}", hours: [{ hour_begin_utc: "2026-04-01T00:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }, { hour_begin_utc: "2026-04-01T01:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }, { hour_begin_utc: "2026-04-01T02:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }] }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { h1_id: "$.data[0].id" }
            - call: "POST /emissions/quarterly-reports/${q2_id}/validate"
              payload: {}
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
            - call: "POST /emissions/quarterly-reports/${q2_id}/submit"
              payload: { submission_format: "XML" }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { q2_v_submitted: $.data.version }
          trigger:
            - call: "POST /emissions/quarterly-reports/${q2_id}/certifications"
              payload: { expected_quarterly_report_version: "${q2_v_submitted}", statement_text: "I certify under penalty of law that this submission was prepared under my direction." }
              as: DesignatedRepresentative
              as_user_id: "dr_1"
              captures: { cert1_id: $.data.id }
            - call: "POST /emissions/certifications/${cert1_id}/revoke"
              payload: { revocation_reason: "flow monitor bias adjustment discovered after signing" }
              as: DesignatedRepresentative
              as_user_id: "dr_1"
            - call: "GET /emissions/quarterly-reports/${q2_id}"
              payload: {}
              as: DesignatedRepresentative
              as_user_id: "dr_2"
              captures: { q2_v_resubmitted: $.data.version }
            - call: "POST /emissions/quarterly-reports/${q2_id}/certifications"
              payload: { expected_quarterly_report_version: "${q2_v_resubmitted}", statement_text: "I certify under penalty of law that this submission was prepared under my direction." }
              as: DesignatedRepresentative
              as_user_id: "dr_2"
              captures: { cert2_id: $.data.id }
            - call: "POST /emissions/quarterly-reports/${q2_id}/disposition"
              payload: { decision: "REJECT", reason: "hourly flow values inconsistent with the certified span" }
              as: RegulatoryReviewer
          assert:
            - "checkpoint 0 (after setup): QuarterlyReport.${q2_id}.total_so2_lbs == 876.6 and Unit.${unit_id}.certified_so2_lbs_ytd == 0.0"
            - "after trigger 1: ComplianceCertification.${cert1_id}.status == SIGNED, certified_so2_lbs_snapshot == 876.6, certifier_user_id == dr_1 and signed_utc == 2026-04-02T00:00:00Z"
            - "checkpoint 1 (after trigger 1): Unit.${unit_id}.certified_so2_lbs_ytd == 876.6 and QuarterlyReport.${q2_id}.status == CERTIFIED"
            - "after trigger 2: ComplianceCertification.${cert1_id}.status == REVOKED with revoked_utc set and the supplied revocation_reason"
            - "checkpoint 2 (after trigger 2): Unit.${unit_id}.certified_so2_lbs_ytd == 0.0 and QuarterlyReport.${q2_id}.status == SUBMITTED"
            - "after trigger 2: QuarterlyReport.${q2_id}.total_so2_lbs is still 876.6 and resubmission_count == 0 — revoking does not reopen or recompute the report"
            - "after trigger 4: ComplianceCertification.${cert2_id}.certified_so2_lbs_snapshot == 876.6 and certifier_user_id == dr_2"
            - "checkpoint 3 (after trigger 4): Unit.${unit_id}.certified_so2_lbs_ytd == 876.6 — the ledger returned to exactly the same value, not 1753.2"
            - "trigger 5 returns HTTP 200 with QuarterlyReport.${q2_id}.status == REJECTED and the supplied rejection_reason"
            - "checkpoint 4 (after trigger 5): Unit.${unit_id}.certified_so2_lbs_ytd == 0.0 and ComplianceCertification.${cert2_id}.status == REVOKED"
            - "GET /emissions/quarterly-reports/${q2_id}/certifications returns exactly 2 rows, both REVOKED, with snapshots 876.6 and 876.6"
            - "OperatingHour.${h1_id}.so2_mass_lbs == 292.2 unchanged through all five triggers — the ledger never rewrites source hours"

      - name: invariant_hour_classification_partition_and_heat_input_survive_flip_and_substitution
        grounds:
          - calculations.quarterly_report_totals
          - calculations.monitor_data_availability_pct
          - calculations.missing_data_substitution
          - entities.OperatingHour.fields.data_quality
          - endpoints[POST /emissions/units/{id}/missing-data/substitutions]
        distinguishing_aspect: |
          A THIRD conserved quantity, pinned as two simultaneous identities on the
          report — measured_hour_count + substituted_hour_count + unavailable
          hours == operating_hour_count == 3, and
          total_heat_input_mmbtu == 1666.668 — both of which hold unchanged while
          the SO2 total swings 876.6 -> 292.2 -> 1115.6, because nulling a
          concentration never touches the heat-input determination.
        test_recipe:
          setup:
            - "logical clock at 2026-04-02T00:00:00Z"
            - "unit U1 with one CERTIFIED SO2 CEM (span 400, PASSED calibration)"
            - "a VALIDATED 2026 Q2 report carrying three identical CEMS hours at 00:00, 01:00 and 02:00 on 2026-04-01"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "FGD" }
              as: RegulatoryReviewer
              captures: { unit_id: $.data.id }
            - call: "POST /emissions/units/${unit_id}/monitoring-systems"
              payload: { parameter: "SO2", system_type: "CEM", span_value: 400.0, calibration_error_spec_pct: 2.5 }
              as: QAAnalyst
              captures: { cem_id: $.data.id, cem_v1: $.data.version }
            - call: "POST /emissions/monitoring-systems/${cem_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${cem_v1}", calibration_utc: "2026-04-01T00:00:00Z", zero_reference_value: 0.0, zero_measured_value: 0.0, span_reference_value: 360.0, span_measured_value: 368.0 }
              as: QAAnalyst
            - call: "POST /emissions/monitoring-systems/${cem_id}/qa-status"
              payload: { action: "CERTIFY" }
              as: QAAnalyst
            - call: "POST /emissions/units/${unit_id}/quarterly-reports"
              payload: { year: 2026, quarter: 2 }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { q2_id: $.data.id, q2_v1: $.data.version }
            - call: "POST /emissions/units/${unit_id}/operating-hours/bulk"
              payload: { expected_quarterly_report_version: "${q2_v1}", hours: [{ hour_begin_utc: "2026-04-01T00:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }, { hour_begin_utc: "2026-04-01T01:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }, { hour_begin_utc: "2026-04-01T02:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }] }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { h1_id: "$.data[0].id", h2_id: "$.data[1].id", h3_id: "$.data[2].id" }
            - call: "POST /emissions/quarterly-reports/${q2_id}/validate"
              payload: {}
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
          trigger:
            - call: "POST /emissions/monitoring-systems/${cem_id}/qa-status"
              payload: { action: "DECLARE_OUT_OF_CONTROL", effective_utc: "2026-04-01T01:00:00Z", reason: "quarterly linearity check outside specification" }
              as: QAAnalyst
            - call: "POST /emissions/units/${unit_id}/missing-data/substitutions"
              payload: { from_hour_utc: "2026-04-01T01:00:00Z", to_hour_utc: "2026-04-01T03:00:00Z" }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
          assert:
            - "checkpoint A (after setup): QuarterlyReport.${q2_id} has operating_hour_count == 3, measured_hour_count == 3, substituted_hour_count == 0, status VALIDATED"
            - "checkpoint A: total_heat_input_mmbtu == 1666.668, total_so2_lbs == 876.6, total_so2_tons == 0.438 and monitor_data_availability_pct == 100.0"
            - "checkpoint A partition: 3 measured + 0 substituted + 0 unavailable == 3 == operating_hour_count"
            - "after trigger 1: OperatingHour.${h1_id}.data_quality == MEASURED with so2_mass_lbs == 292.2 (00:00 precedes out_of_control_since_utc)"
            - "after trigger 1: OperatingHour.${h2_id}.data_quality == UNAVAILABLE and so2_mass_lbs == null; OperatingHour.${h3_id} likewise"
            - "after trigger 1: OperatingHour.${h2_id}.heat_input_mmbtu == 555.556 and OperatingHour.${h3_id}.heat_input_mmbtu == 555.556 — heat input is untouched by the flip"
            - "checkpoint B (after trigger 1): operating_hour_count == 3, measured_hour_count == 1, substituted_hour_count == 0, status reverted to DRAFT"
            - "checkpoint B: total_heat_input_mmbtu == 1666.668 (INVARIANT), total_so2_lbs == 292.2, total_so2_tons == 0.146, monitor_data_availability_pct == 33.3"
            - "checkpoint B partition: 1 measured + 0 substituted + 2 unavailable == 3 == operating_hour_count"
            - "after trigger 2: OperatingHour.${h2_id}.data_quality == SUBSTITUTED, substitution_method == T1_90TH_PERCENTILE, substituted_so2_conc_ppm == 220.0, monitor_data_availability_pct_at_substitution == 100.0 and so2_mass_lbs == 292.2"
            - "after trigger 2: OperatingHour.${h3_id}.substitution_method == T4_MAX_POTENTIAL_CONCENTRATION, substituted_so2_conc_ppm == 400.0, monitor_data_availability_pct_at_substitution == 50.0 and so2_mass_lbs == 531.2"
            - "checkpoint C (after trigger 2): operating_hour_count == 3, measured_hour_count == 1, substituted_hour_count == 2, status still DRAFT"
            - "checkpoint C: total_heat_input_mmbtu == 1666.668 (INVARIANT — identical at all three checkpoints), total_so2_lbs == 1115.6 and monitor_data_availability_pct == 33.3"
            - "checkpoint C partition: 1 measured + 2 substituted + 0 unavailable == 3 == operating_hour_count"
            - "Unit.${unit_id}.data_availability_pct == 33.3 at checkpoints B and C — substitution restores emissions, never availability"
