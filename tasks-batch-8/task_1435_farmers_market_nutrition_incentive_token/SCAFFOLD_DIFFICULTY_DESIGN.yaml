# §1.8 Scaffold Difficulty Design — Test Targeting Index
# 9 rules x 3 instances = 27 instances. All chains replay from empty DB.
# Shared literals: season [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z); default clock 2026-08-01T00:00:00Z;
# market day date 2026-08-01, window [2026-08-01T08:00:00Z, 2026-08-01T14:00:00Z);
# batch ranges: BASE-500 [100001,100100], BASE-100 [200001,200200], MATCH-100 [300001,300500];
# tokens list ordered serial_number ASC. All POSTs carry an Idempotency-Key header (unique per call).
scaffold_difficulty_design:
  # ------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: reimbursement_rounding_order_variants_diverge
        grounds:
          - calculations.reimbursement_amount
          - entities.RedemptionSubmission.fields.provisional_amount_cents
          - entities.RedemptionSubmission.fields.approved_amount_cents
        distinguishing_aspect: |
          Vendor/submission-domain dual variant: identical token set (500+100+100) priced twice —
          provisional uses PER-LINE round_half_up (488+98+98=684), final uses SUM-THEN-ROUND once
          (round_half_up(682.5)=683); the two declared variants differ by exactly 1 cent on the same rows.
        test_recipe:
          setup:
            - "Program (pool 100000), market, three ACTIVE batches, ACTIVE SNAP shopper, OPEN market day 2026-08-01, ACTIVE vendor"
            - "Issuance of charge 700: base split 1x500 + 2x100, match 700 minted as 7x100; tokens list order serial ASC"
            - "Vendor redeemed serials 100001 (500), 200001 (100), 200002 (100)"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", match_pool_budget_cents: 100000 }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /markets", payload: { program_id: "${prog}", name: "M", city: "C" }, as: ProgramAdmin, captures: { mkt: $.data.id } }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "BASE", denomination_cents: 500, serial_start: 100001, serial_end: 100100 }, as: ProgramAdmin, captures: { b5: $.data.id } }
            - { call: "POST /token-batches/${b5}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "BASE", denomination_cents: 100, serial_start: 200001, serial_end: 200200 }, as: ProgramAdmin, captures: { b1: $.data.id } }
            - { call: "POST /token-batches/${b1}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "MATCH", denomination_cents: 100, serial_start: 300001, serial_end: 300500 }, as: ProgramAdmin, captures: { bm: $.data.id } }
            - { call: "POST /token-batches/${bm}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /shoppers", payload: { program_id: "${prog}", external_benefit_ref: "EBT-1", benefit_type: "SNAP" }, as: BoothOperator, captures: { shop: $.data.id } }
            - { call: "POST /shoppers/${shop}/verify", payload: {}, as: ProgramAdmin, captures: { shop_v: $.data.version } }
            - { call: "POST /market-days", payload: { market_id: "${mkt}", date: "2026-08-01", opens_at: "2026-08-01T08:00:00Z", closes_at: "2026-08-01T14:00:00Z" }, as: MarketManager, captures: { day: $.data.id } }
            - { call: "POST /market-days/${day}/open", payload: {}, as: MarketManager }
            - { call: "POST /vendors", payload: { market_id: "${mkt}", legal_name: "V", stall_number: "S1" }, as: ProgramAdmin, captures: { vend: $.data.id } }
            - { call: "POST /vendors/${vend}/approve", payload: {}, as: ProgramAdmin }
            - { call: "POST /issuances", payload: { shopper_id: "${shop}", market_day_id: "${day}", benefit_charged_cents: 700, expected_shopper_version: "${shop_v}" }, as: BoothOperator, captures: { iss: $.data.id } }
            - { call: "GET /tokens", payload: { issuance_id: "${iss}" }, as: BoothOperator, captures: { t0: "$.data[0].id", t0_sn: "$.data[0].serial_number", t1: "$.data[1].id", t1_sn: "$.data[1].serial_number", t2: "$.data[2].id", t2_sn: "$.data[2].serial_number" } }
            - { call: "POST /tokens/redeem", payload: { serial_number: "${t0_sn}" }, as: Vendor, as_user_id: "${vend}" }
            - { call: "POST /tokens/redeem", payload: { serial_number: "${t1_sn}" }, as: Vendor, as_user_id: "${vend}" }
            - { call: "POST /tokens/redeem", payload: { serial_number: "${t2_sn}" }, as: Vendor, as_user_id: "${vend}" }
            - { call: "POST /redemption-submissions", payload: { market_day_id: "${day}", token_ids: ["${t0}", "${t1}", "${t2}"] }, as: Vendor, as_user_id: "${vend}", captures: { sub: $.data.id, prov: $.data.provisional_amount_cents } }
            - { call: "POST /market-days/${day}/close", payload: {}, as: MarketManager }
            - { call: "POST /redemption-submissions/${sub}/verify", payload: { outcome: "VERIFIED" }, as: MarketManager }
          trigger:
            - { call: "POST /redemption-submissions/${sub}/decide", payload: { outcome: "APPROVED" }, as: ProgramAdmin, captures: { appr: $.data.approved_amount_cents } }
          assert:
            - "RedemptionSubmission.${sub}.provisional_amount_cents == 684 (per-line rounding: 488+98+98)"
            - "RedemptionSubmission.${sub}.approved_amount_cents == 683 (aggregate: round_half_up(700*0.975)=round_half_up(682.5))"
            - "provisional != approved on identical token set (delta exactly 1 cent)"

      - name: program_liability_forward_vs_realized_diverge
        grounds:
          - calculations.program_liability
          - entities.Program.fields.liability_forward_cents
          - entities.Program.fields.liability_realized_cents
        distinguishing_aspect: |
          Program-domain dual variant (different entity domain from reimbursement): after minting 2000 of
          tokens and redeeming 500, forward_looking liability counts ISSUED+REDEEMED (2000) while
          chronological realized counts REDEEMED+SETTLED only (500) — same rows, divergent totals.
        test_recipe:
          setup:
            - "Program (pool 100000), market, ACTIVE batches, ACTIVE SNAP shopper, OPEN day, ACTIVE vendor"
            - "Issuance charge 1000 (match 1000): tokens 2x500 base + 10x100 match = 2000 total"
            - "Vendor redeemed serial 100001 (500)"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", match_pool_budget_cents: 100000 }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /markets", payload: { program_id: "${prog}", name: "M", city: "C" }, as: ProgramAdmin, captures: { mkt: $.data.id } }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "BASE", denomination_cents: 500, serial_start: 100001, serial_end: 100100 }, as: ProgramAdmin, captures: { b5: $.data.id } }
            - { call: "POST /token-batches/${b5}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "BASE", denomination_cents: 100, serial_start: 200001, serial_end: 200200 }, as: ProgramAdmin, captures: { b1: $.data.id } }
            - { call: "POST /token-batches/${b1}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "MATCH", denomination_cents: 100, serial_start: 300001, serial_end: 300500 }, as: ProgramAdmin, captures: { bm: $.data.id } }
            - { call: "POST /token-batches/${bm}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /shoppers", payload: { program_id: "${prog}", external_benefit_ref: "EBT-1", benefit_type: "SNAP" }, as: BoothOperator, captures: { shop: $.data.id } }
            - { call: "POST /shoppers/${shop}/verify", payload: {}, as: ProgramAdmin, captures: { shop_v: $.data.version } }
            - { call: "POST /market-days", payload: { market_id: "${mkt}", date: "2026-08-01", opens_at: "2026-08-01T08:00:00Z", closes_at: "2026-08-01T14:00:00Z" }, as: MarketManager, captures: { day: $.data.id } }
            - { call: "POST /market-days/${day}/open", payload: {}, as: MarketManager }
            - { call: "POST /vendors", payload: { market_id: "${mkt}", legal_name: "V", stall_number: "S1" }, as: ProgramAdmin, captures: { vend: $.data.id } }
            - { call: "POST /vendors/${vend}/approve", payload: {}, as: ProgramAdmin }
            - { call: "POST /issuances", payload: { shopper_id: "${shop}", market_day_id: "${day}", benefit_charged_cents: 1000, expected_shopper_version: "${shop_v}" }, as: BoothOperator, captures: { iss: $.data.id } }
            - { call: "GET /tokens", payload: { issuance_id: "${iss}" }, as: BoothOperator, captures: { t0_sn: "$.data[0].serial_number" } }
            - { call: "POST /tokens/redeem", payload: { serial_number: "${t0_sn}" }, as: Vendor, as_user_id: "${vend}" }
          trigger:
            - { call: "GET /programs/${prog}", payload: {}, as: ProgramAdmin, captures: { fwd: $.data.liability_forward_cents, rlz: $.data.liability_realized_cents } }
          assert:
            - "Program.${prog}.liability_forward_cents == 2000 (1500 ISSUED + 500 REDEEMED)"
            - "Program.${prog}.liability_realized_cents == 500 (REDEEMED only)"
            - "forward - realized == 1500 == outstanding unredeemed face value"

      - name: reimbursement_inclusion_variants_diverge_on_flag
        grounds:
          - calculations.reimbursement_amount
          - state_machines.Token.REDEEMED_to_FLAGGED
        distinguishing_aspect: |
          Same reimbursement calculation as reimbursement_rounding_order_variants_diverge but divergence is
          driven by the INPUT-SET difference, not rounding: a token flagged between submission and approval
          leaves the final input set (REDEEMED-only), dropping the final amount to round_half_up(200*0.975)=195
          while the provisional stays 684.
        test_recipe:
          setup:
            - "Same base setup; issuance charge 700; tokens 500+100+100 redeemed and submitted (provisional 684)"
            - "Day CLOSED; submission VERIFIED; then fraud case OPEN targeting the 500-cent token flags it"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", match_pool_budget_cents: 100000 }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /markets", payload: { program_id: "${prog}", name: "M", city: "C" }, as: ProgramAdmin, captures: { mkt: $.data.id } }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "BASE", denomination_cents: 500, serial_start: 100001, serial_end: 100100 }, as: ProgramAdmin, captures: { b5: $.data.id } }
            - { call: "POST /token-batches/${b5}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "BASE", denomination_cents: 100, serial_start: 200001, serial_end: 200200 }, as: ProgramAdmin, captures: { b1: $.data.id } }
            - { call: "POST /token-batches/${b1}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "MATCH", denomination_cents: 100, serial_start: 300001, serial_end: 300500 }, as: ProgramAdmin, captures: { bm: $.data.id } }
            - { call: "POST /token-batches/${bm}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /shoppers", payload: { program_id: "${prog}", external_benefit_ref: "EBT-1", benefit_type: "SNAP" }, as: BoothOperator, captures: { shop: $.data.id } }
            - { call: "POST /shoppers/${shop}/verify", payload: {}, as: ProgramAdmin, captures: { shop_v: $.data.version } }
            - { call: "POST /market-days", payload: { market_id: "${mkt}", date: "2026-08-01", opens_at: "2026-08-01T08:00:00Z", closes_at: "2026-08-01T14:00:00Z" }, as: MarketManager, captures: { day: $.data.id } }
            - { call: "POST /market-days/${day}/open", payload: {}, as: MarketManager }
            - { call: "POST /vendors", payload: { market_id: "${mkt}", legal_name: "V", stall_number: "S1" }, as: ProgramAdmin, captures: { vend: $.data.id } }
            - { call: "POST /vendors/${vend}/approve", payload: {}, as: ProgramAdmin }
            - { call: "POST /issuances", payload: { shopper_id: "${shop}", market_day_id: "${day}", benefit_charged_cents: 700, expected_shopper_version: "${shop_v}" }, as: BoothOperator, captures: { iss: $.data.id } }
            - { call: "GET /tokens", payload: { issuance_id: "${iss}" }, as: BoothOperator, captures: { t0: "$.data[0].id", t0_sn: "$.data[0].serial_number", t1: "$.data[1].id", t1_sn: "$.data[1].serial_number", t2: "$.data[2].id", t2_sn: "$.data[2].serial_number" } }
            - { call: "POST /tokens/redeem", payload: { serial_number: "${t0_sn}" }, as: Vendor, as_user_id: "${vend}" }
            - { call: "POST /tokens/redeem", payload: { serial_number: "${t1_sn}" }, as: Vendor, as_user_id: "${vend}" }
            - { call: "POST /tokens/redeem", payload: { serial_number: "${t2_sn}" }, as: Vendor, as_user_id: "${vend}" }
            - { call: "POST /redemption-submissions", payload: { market_day_id: "${day}", token_ids: ["${t0}", "${t1}", "${t2}"] }, as: Vendor, as_user_id: "${vend}", captures: { sub: $.data.id, prov: $.data.provisional_amount_cents } }
            - { call: "POST /market-days/${day}/close", payload: {}, as: MarketManager }
            - { call: "POST /redemption-submissions/${sub}/verify", payload: { outcome: "VERIFIED" }, as: MarketManager }
            - { call: "POST /fraud-cases", payload: { reason: "suspect token", token_id: "${t0}" }, as: Auditor, captures: { fc: $.data.id } }
          trigger:
            - { call: "POST /redemption-submissions/${sub}/decide", payload: { outcome: "APPROVED" }, as: ProgramAdmin, captures: { appr: $.data.approved_amount_cents } }
          assert:
            - "RedemptionSubmission.${sub}.provisional_amount_cents == 684 (computed at create, unchanged)"
            - "RedemptionSubmission.${sub}.approved_amount_cents == 195 (flagged 500-cent token excluded; round_half_up(200*0.975))"
            - "Token.${t0}.status == FLAGGED"
            - "MarketDay.${day}.status == VARIANCE_FLAGGED (variance 1400-0-200=1200 > 500 auto-flag on CLOSED day)"

  # ------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: match_nested_min_clamps_to_day_remaining
        grounds:
          - calculations.match_computation
          - calculations.shopper_match_usage
        distinguishing_aspect: |
          Mode (a) combinatorial: >=3 inputs with non-linear interaction — raw 1500 vs day_remaining 800 vs
          season_remaining 18800 vs pool 98800; the nested min selects day_remaining (the second issuance on
          the same day), proving per-hop dependency of issuance N on issuance N-1's accumulator mutation.
        test_recipe:
          setup:
            - "SNAP shopper ACTIVE; OPEN day; first issuance charge 1200 -> match 1200 (day usage 1200/2000)"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", match_pool_budget_cents: 100000 }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /markets", payload: { program_id: "${prog}", name: "M", city: "C" }, as: ProgramAdmin, captures: { mkt: $.data.id } }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "BASE", denomination_cents: 500, serial_start: 100001, serial_end: 100100 }, as: ProgramAdmin, captures: { b5: $.data.id } }
            - { call: "POST /token-batches/${b5}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "BASE", denomination_cents: 100, serial_start: 200001, serial_end: 200200 }, as: ProgramAdmin, captures: { b1: $.data.id } }
            - { call: "POST /token-batches/${b1}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "MATCH", denomination_cents: 100, serial_start: 300001, serial_end: 300500 }, as: ProgramAdmin, captures: { bm: $.data.id } }
            - { call: "POST /token-batches/${bm}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /shoppers", payload: { program_id: "${prog}", external_benefit_ref: "EBT-1", benefit_type: "SNAP" }, as: BoothOperator, captures: { shop: $.data.id } }
            - { call: "POST /shoppers/${shop}/verify", payload: {}, as: ProgramAdmin, captures: { shop_v: $.data.version } }
            - { call: "POST /market-days", payload: { market_id: "${mkt}", date: "2026-08-01", opens_at: "2026-08-01T08:00:00Z", closes_at: "2026-08-01T14:00:00Z" }, as: MarketManager, captures: { day: $.data.id } }
            - { call: "POST /market-days/${day}/open", payload: {}, as: MarketManager }
            - { call: "POST /issuances", payload: { shopper_id: "${shop}", market_day_id: "${day}", benefit_charged_cents: 1200, expected_shopper_version: "${shop_v}" }, as: BoothOperator, captures: { iss1: $.data.id, m1: $.data.match_cents } }
            - { call: "GET /shoppers/${shop}", payload: {}, as: BoothOperator, captures: { shop_v2: $.data.version } }
          trigger:
            - { call: "POST /issuances", payload: { shopper_id: "${shop}", market_day_id: "${day}", benefit_charged_cents: 1500, expected_shopper_version: "${shop_v2}" }, as: BoothOperator, captures: { m2: $.data.match_cents } }
          assert:
            - "first Issuance.match_cents == 1200 (raw 1200 within all allowances)"
            - "second Issuance.match_cents == 800 (min(1500, 2000-1200, 18800, 98800) = 800; day allowance binds)"
            - "Shopper.${shop}.season_match_used_cents == 2000"
            - "Program.${prog}.match_pool_remaining_cents == 98000"

      - name: reimbursement_per_line_vs_aggregate_rounding
        grounds:
          - calculations.reimbursement_amount
        distinguishing_aspect: |
          Mode (b) nested rounding: scaffold pins provisional = sum of per-line round_half_up(v*0.975) and
          final = round_half_up(sum(v)*0.975); for two 100-cent tokens per-line gives 98+98=196, aggregate
          gives round_half_up(195.0)=195 — swapping the pinned order changes the cents.
        test_recipe:
          setup:
            - "SNAP shopper, OPEN day, ACTIVE vendor; issuance charge 200 -> base 2x100 (serials 200001, 200002), match 200"
            - "Both base tokens redeemed; submission created; day CLOSED; submission VERIFIED"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", match_pool_budget_cents: 100000 }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /markets", payload: { program_id: "${prog}", name: "M", city: "C" }, as: ProgramAdmin, captures: { mkt: $.data.id } }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "BASE", denomination_cents: 500, serial_start: 100001, serial_end: 100100 }, as: ProgramAdmin, captures: { b5: $.data.id } }
            - { call: "POST /token-batches/${b5}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "BASE", denomination_cents: 100, serial_start: 200001, serial_end: 200200 }, as: ProgramAdmin, captures: { b1: $.data.id } }
            - { call: "POST /token-batches/${b1}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "MATCH", denomination_cents: 100, serial_start: 300001, serial_end: 300500 }, as: ProgramAdmin, captures: { bm: $.data.id } }
            - { call: "POST /token-batches/${bm}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /shoppers", payload: { program_id: "${prog}", external_benefit_ref: "EBT-1", benefit_type: "SNAP" }, as: BoothOperator, captures: { shop: $.data.id } }
            - { call: "POST /shoppers/${shop}/verify", payload: {}, as: ProgramAdmin, captures: { shop_v: $.data.version } }
            - { call: "POST /market-days", payload: { market_id: "${mkt}", date: "2026-08-01", opens_at: "2026-08-01T08:00:00Z", closes_at: "2026-08-01T14:00:00Z" }, as: MarketManager, captures: { day: $.data.id } }
            - { call: "POST /market-days/${day}/open", payload: {}, as: MarketManager }
            - { call: "POST /vendors", payload: { market_id: "${mkt}", legal_name: "V", stall_number: "S1" }, as: ProgramAdmin, captures: { vend: $.data.id } }
            - { call: "POST /vendors/${vend}/approve", payload: {}, as: ProgramAdmin }
            - { call: "POST /issuances", payload: { shopper_id: "${shop}", market_day_id: "${day}", benefit_charged_cents: 200, expected_shopper_version: "${shop_v}" }, as: BoothOperator, captures: { iss: $.data.id } }
            - { call: "GET /tokens", payload: { issuance_id: "${iss}" }, as: BoothOperator, captures: { t0: "$.data[0].id", t0_sn: "$.data[0].serial_number", t1: "$.data[1].id", t1_sn: "$.data[1].serial_number" } }
            - { call: "POST /tokens/redeem", payload: { serial_number: "${t0_sn}" }, as: Vendor, as_user_id: "${vend}" }
            - { call: "POST /tokens/redeem", payload: { serial_number: "${t1_sn}" }, as: Vendor, as_user_id: "${vend}" }
            - { call: "POST /redemption-submissions", payload: { market_day_id: "${day}", token_ids: ["${t0}", "${t1}"] }, as: Vendor, as_user_id: "${vend}", captures: { sub: $.data.id, prov: $.data.provisional_amount_cents } }
            - { call: "POST /market-days/${day}/close", payload: {}, as: MarketManager }
            - { call: "POST /redemption-submissions/${sub}/verify", payload: { outcome: "VERIFIED" }, as: MarketManager }
          trigger:
            - { call: "POST /redemption-submissions/${sub}/decide", payload: { outcome: "APPROVED" }, as: ProgramAdmin, captures: { appr: $.data.approved_amount_cents } }
          assert:
            - "provisional_amount_cents == 196 (98+98 per-line)"
            - "approved_amount_cents == 195 (round_half_up(200*0.975) = round_half_up(195.0) — aggregate rounding)"
            - "196 != 195: rounding ORDER is observable, pinned per variant"

      - name: pool_remaining_feeds_next_match_evaluation_order
        grounds:
          - calculations.match_computation
          - entities.Program.fields.match_pool_remaining_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency pinned by evaluation order: pool_remaining is derived from all
          ACTIVE issuances, yet the current issuance's match depends on pool_remaining — the scaffold resolves
          the cycle by evaluating the pool BEFORE minting (issuance 1 match 900 on a 900-cent pool; issuance 2
          sees pool 0 and mints match 0 while base still mints).
        test_recipe:
          setup:
            - "Program with match_pool_budget_cents 900; SNAP shopper ACTIVE; OPEN day"
            - "First issuance charge 1000 -> raw 1000, pool binds at 900 -> match 900, pool 0"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", match_pool_budget_cents: 900 }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /markets", payload: { program_id: "${prog}", name: "M", city: "C" }, as: ProgramAdmin, captures: { mkt: $.data.id } }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "BASE", denomination_cents: 500, serial_start: 100001, serial_end: 100100 }, as: ProgramAdmin, captures: { b5: $.data.id } }
            - { call: "POST /token-batches/${b5}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "BASE", denomination_cents: 100, serial_start: 200001, serial_end: 200200 }, as: ProgramAdmin, captures: { b1: $.data.id } }
            - { call: "POST /token-batches/${b1}/activate", payload: {}, as: ProgramAdmin }
