        claim_type: violation_to_error
        grounds:
          - errors[ERR_PIPELINE_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / pipeline_aggregate_capacity_exact_fit
          rationale: "Asserted as the +1-over rejection in the named §1.8 instance."

