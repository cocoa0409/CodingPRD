      - name: claim_counter_negotiation_cycle_hits_round_limit_then_agrees
        grounds:
          - state_machines.ReconciliationClaim
          - entities.ReconciliationClaim.fields.round_count
          - entities.ReconciliationClaim.fields.last_responder_role
          - entities.ReconciliationClaim.fields.agreed_offset_cents
          - validations.priority_42_ERR_CLAIM_ROUND_LIMIT
          - validations.priority_19_ERR_RESPONDER_OUT_OF_TURN
          - calculations.return_incentive
        distinguishing_aspect: |
          Entity: ReconciliationClaim — a different entity and a different flavour of
          non-linearity from instance (i). Here the machine is genuinely cyclic:
          SUBMITTED -> COUNTERED -> SUBMITTED -> COUNTERED, with the SAME trigger traversing
          both directions and the side effects differing by acting role. The cycle is bounded
          by a counter that the state machine itself carries (round_count < 3), so the fourth
          COUNTER fails with 409 while AGREE from the same state still succeeds — a state whose
          admissible trigger set depends on a numeric field, not on the state label alone.
