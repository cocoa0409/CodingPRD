# ============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2626 — Defensible Space & Fuels Inspection Program
#
# Nine §0.5 rule_id blocks, two differentiated instances each (18 instances).
# Every numeric assert below was executed against the §1.3 formulas and their
# constants and is written as a pinned literal.
# Logical clock starts at 2026-08-01T00:00:00Z on a fresh server.
# ============================================================================

scaffold_difficulty_design:

  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: risk_score_intake_provisional_vs_post_inspection_verified
        grounds:
          - calculations.parcel_risk_score
          - calculations.zone_deficiency_assessment
          - entities.Parcel.fields.risk_score_basis
          - entities.Parcel.fields.risk_class
          - entities.Inspection.fields.measured_veg_points
          - entities.Inspection.fields.hardening_credit_points
          - state_machines.Inspection.NOTICED_to_COMPLETED
        distinguishing_aspect: |
          Instance domain is the Parcel hazard-scoring surface: the same parcel row scored
          with intake_provisional (self-reported VEG_POINTS[BRUSH] = 75, hardening_credit
          0.00) yields risk_score 63.83 / risk_class HIGH, while post_inspection_verified
          (measured_veg_points 94.31, hardening_credit 20.00) yields 47.49 / MODERATE — the
          two variants disagree on both the value and the band.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One ACTIVE InspectionCycle for season 2026 with notice_lead_days 10."
            - "One ACTIVE Inspector with certification_level ADVANCED."
            - "One Parcel: slope_pct 30, vegetation_type BRUSH, roof_class CLASS_B, access_constraint GATED, hazard_zone HIGH, no community."
            - "One Inspection on that parcel in NOTICED with all three ZoneEvaluations recorded (measured 5.0 / 15.0 / 118.0 ft) and six HardeningFindings, five COMPLIANT and one DEFICIENT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026, notice_lead_days: 10, invoice_due_days: 45 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id" }
            - call: "POST /fire-district/inspection-cycles/${cyc}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/inspectors"
              payload: { full_name: "Ivan Ruiz", certification_level: "ADVANCED", status: "ACTIVE" }
              as: ProgramAdmin
              captures: { insp1: "$.data.id" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-1001", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", structure_present: true, roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { pid: "$.data.id", intake_score: "$.data.risk_score", intake_class: "$.data.risk_class" }
            - call: "POST /fire-district/inspections"
              payload: { parcel_id: "${pid}", cycle_id: "${cyc}", inspector_id: "${insp1}", inspection_type: "INITIAL", scheduled_start_utc: "2026-08-20T15:00:00Z", scheduled_end_utc: "2026-08-20T17:00:00Z", access_arrangement: "EXTERIOR_ONLY" }
              as: ProgramAdmin
              captures: { insid: "$.data.id" }
            - call: "POST /fire-district/inspections/${insid}/notice"
              payload: { notice_method: "CERTIFIED_MAIL" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspections/${insid}/zone-evaluations"
              payload: { zone: "ZONE_0_EMBER", measured_clearance_ft: 5.0, ladder_fuel_present: false }
              as: Inspector
              as_user_id: "${insp1}"
              captures: { z0: "$.data.id" }
            - call: "POST /fire-district/inspections/${insid}/zone-evaluations"
              payload: { zone: "ZONE_1", measured_clearance_ft: 15.0, ladder_fuel_present: false }
              as: Inspector
              as_user_id: "${insp1}"
              captures: { z1: "$.data.id" }
            - call: "POST /fire-district/inspections/${insid}/zone-evaluations"
              payload: { zone: "ZONE_2", measured_clearance_ft: 118.0, ladder_fuel_present: false }
              as: Inspector
              as_user_id: "${insp1}"
              captures: { z2: "$.data.id" }
            - call: "POST /fire-district/inspections/${insid}/hardening-findings"
              payload: { item_code: "EAVE_VENTS", status: "COMPLIANT" }
              as: Inspector
              as_user_id: "${insp1}"
            - call: "POST /fire-district/inspections/${insid}/hardening-findings"
              payload: { item_code: "ROOF_ASSEMBLY", status: "COMPLIANT" }
              as: Inspector
              as_user_id: "${insp1}"
            - call: "POST /fire-district/inspections/${insid}/hardening-findings"
              payload: { item_code: "WINDOW_GLAZING", status: "COMPLIANT" }
              as: Inspector
              as_user_id: "${insp1}"
            - call: "POST /fire-district/inspections/${insid}/hardening-findings"
              payload: { item_code: "SIDING", status: "COMPLIANT" }
              as: Inspector
              as_user_id: "${insp1}"
            - call: "POST /fire-district/inspections/${insid}/hardening-findings"
              payload: { item_code: "GUTTER_DEBRIS", status: "COMPLIANT" }
              as: Inspector
              as_user_id: "${insp1}"
            - call: "POST /fire-district/inspections/${insid}/hardening-findings"
              payload: { item_code: "DECK_UNDERSIDE", status: "DEFICIENT" }
              as: Inspector
              as_user_id: "${insp1}"
          trigger:
            - call: "POST /fire-district/inspections/${insid}/complete"
              payload: { result: "FAIL", violation_notice_method: "CERTIFIED_MAIL" }
              as: Inspector
              as_user_id: "${insp1}"
          assert:
            - "${intake_score} == 63.83 and ${intake_class} == \"HIGH\" (intake_provisional: weighted_subtotal 55.50 x HAZARD_MULT[HIGH] 1.15)"
            - "Parcel.${pid}.risk_score_basis == \"INTAKE_PROVISIONAL\" before the trigger"
            - "ZoneEvaluation.${z0}.points == 30.95 and ZoneEvaluation.${z0}.deficiency_severity == \"MINOR\""
            - "ZoneEvaluation.${z1}.points == 60.00 and ZoneEvaluation.${z1}.deficiency_severity == \"MAJOR\""
            - "ZoneEvaluation.${z2}.points == 3.36 and ZoneEvaluation.${z2}.deficiency_severity == \"MINOR\""
            - "Inspection.${insid}.measured_veg_points == 94.31 (30.95 + 60.00 + 3.36, round-per-zone-then-sum)"
            - "Inspection.${insid}.hardening_credit_points == 20.00 (HARDENING_CREDIT_CAP reached by five COMPLIANT findings)"
            - "Parcel.${pid}.risk_score == 47.49 after the trigger and Parcel.${pid}.risk_score_basis == \"POST_INSPECTION_VERIFIED\""
            - "Parcel.${pid}.risk_class == \"MODERATE\" after the trigger, a different band than the intake HIGH"
            - "Parcel.${pid}.risk_score != 50.49, the value produced when HAZARD_MULT is applied before the hardening credit is subtracted"
            - "Parcel.${pid}.risk_score != 63.83, i.e. the intake value is overwritten rather than kept"

      - name: cost_recovery_district_contracted_vs_voluntary_precompliance
        grounds:
          - calculations.abatement_cost_recovery
          - entities.AbatementOrder.fields.recovery_basis
          - entities.AbatementOrder.fields.admin_overhead_cents
          - entities.AbatementOrder.fields.subsidy_pct
          - entities.AbatementOrder.fields.total_recoverable_cents
          - state_machines.AbatementOrder.WORK_COMPLETE_to_INVOICED
        distinguishing_aspect: |
          Instance domain is the abatement cost-recovery surface, and the selector is
          data-shaped rather than request-shaped: the two orders carry byte-identical cost
          inputs (12.5 crew hours, 3.25 tons, the same contractor rate card), and the variant
          is chosen only by whether a qualifying SupportEnrollment predates the notice.
          district_contracted yields total_recoverable_cents 152461; voluntary_precompliance
          zeroes admin overhead AND steps the subsidy ladder 0.20 -> 0.30, yielding 118580,
          a delta of 33881 that no single-variant implementation can produce.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one ACTIVE cycle (invoice_due_days 45), one CHIPPER_DAY SupportProgram open 2026-08-01 to 2026-12-01."
            - "Two identical parcels p1 and p2; p2 alone enrolls in the chipper program on 2026-08-01, i.e. strictly before its notice is issued."
            - "Two inspectors (insp1 inspects, insp2 verifies) and two contractors with the identical rate card hourly_rate_cents 8600 / mobilization_fee_cents 32000."
            - "Both parcels fail inspection on 2026-08-22, both notices go OVERDUE at the 2026-10-01 cycle advance, both orders are authorized, awarded, worked (12.5 h, 3.25 t) and order1 is verified at clock 2026-10-06T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026, notice_lead_days: 10, invoice_due_days: 45 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id" }
            - call: "POST /fire-district/inspection-cycles/${cyc}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/support-programs"
              payload: { cycle_id: "${cyc}", program_type: "CHIPPER_DAY", budget_total_cents: 0, capacity_slots: 4, service_window_start_utc: "2026-08-01T00:00:00Z", service_window_end_utc: "2026-12-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { prog: "$.data.id", prog_v: "$.data.version" }
            - call: "POST /fire-district/inspectors"
              payload: { full_name: "Ivan Ruiz", certification_level: "ADVANCED", status: "ACTIVE" }
              as: ProgramAdmin
              captures: { insp1: "$.data.id" }
            - call: "POST /fire-district/inspectors"
              payload: { full_name: "Nora Vance", certification_level: "ADVANCED", status: "ACTIVE" }
              as: ProgramAdmin
              captures: { insp2: "$.data.id" }
            - call: "POST /fire-district/contractors"
              payload: { business_name: "Ridgeline Fuels LLC", hourly_rate_cents: 8600, mobilization_fee_cents: 32000, license_status: "ACTIVE", insurance_expiry_utc: "2027-06-30T00:00:00Z", max_daily_orders: 2 }
              as: ProgramAdmin
              captures: { c1: "$.data.id" }
            - call: "POST /fire-district/contractors"
              payload: { business_name: "Canyon Clearing Co", hourly_rate_cents: 8600, mobilization_fee_cents: 32000, license_status: "ACTIVE", insurance_expiry_utc: "2027-06-30T00:00:00Z", max_daily_orders: 2 }
              as: ProgramAdmin
              captures: { c2: "$.data.id" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-2001", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", structure_present: true, roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-2002", owner_name: "Ben Ortiz", owner_email: "ben@example.com", situs_address: "14 Ridge Rd", structure_present: true, roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { p2: "$.data.id" }
            - call: "POST /fire-district/support-enrollments"
              payload: { support_program_id: "${prog}", parcel_id: "${p2}", expected_program_version: "${prog_v}" }
              as: ProgramAdmin
              captures: { enr2: "$.data.id", enr2_status: "$.data.status" }
            - call: "POST /fire-district/inspections"
              payload: { parcel_id: "${p1}", cycle_id: "${cyc}", inspector_id: "${insp1}", inspection_type: "INITIAL", scheduled_start_utc: "2026-08-20T15:00:00Z", scheduled_end_utc: "2026-08-20T17:00:00Z", access_arrangement: "EXTERIOR_ONLY" }
              as: ProgramAdmin
              captures: { ins1: "$.data.id" }
            - call: "POST /fire-district/inspections"
              payload: { parcel_id: "${p2}", cycle_id: "${cyc}", inspector_id: "${insp1}", inspection_type: "INITIAL", scheduled_start_utc: "2026-08-21T15:00:00Z", scheduled_end_utc: "2026-08-21T17:00:00Z", access_arrangement: "EXTERIOR_ONLY" }
              as: ProgramAdmin
              captures: { ins2: "$.data.id" }
            - call: "POST /fire-district/inspections/${ins1}/notice"
              payload: { notice_method: "CERTIFIED_MAIL" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspections/${ins2}/notice"
              payload: { notice_method: "CERTIFIED_MAIL" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspections/${ins1}/zone-evaluations"
              payload: { zone: "ZONE_0_EMBER", measured_clearance_ft: 5.0, ladder_fuel_present: false }
              as: Inspector
              as_user_id: "${insp1}"
            - call: "POST /fire-district/inspections/${ins1}/zone-evaluations"
              payload: { zone: "ZONE_1", measured_clearance_ft: 15.0, ladder_fuel_present: false }
              as: Inspector
              as_user_id: "${insp1}"
            - call: "POST /fire-district/inspections/${ins1}/zone-evaluations"
              payload: { zone: "ZONE_2", measured_clearance_ft: 118.0, ladder_fuel_present: false }
              as: Inspector
              as_user_id: "${insp1}"
            - call: "POST /fire-district/inspections/${ins2}/zone-evaluations"
              payload: { zone: "ZONE_0_EMBER", measured_clearance_ft: 5.0, ladder_fuel_present: false }
              as: Inspector
              as_user_id: "${insp1}"
            - call: "POST /fire-district/inspections/${ins2}/zone-evaluations"
              payload: { zone: "ZONE_1", measured_clearance_ft: 15.0, ladder_fuel_present: false }
              as: Inspector
              as_user_id: "${insp1}"
            - call: "POST /fire-district/inspections/${ins2}/zone-evaluations"
              payload: { zone: "ZONE_2", measured_clearance_ft: 118.0, ladder_fuel_present: false }
              as: Inspector
              as_user_id: "${insp1}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-22T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspections/${ins1}/complete"
              payload: { result: "FAIL", violation_notice_method: "CERTIFIED_MAIL" }
              as: Inspector
              as_user_id: "${insp1}"
            - call: "POST /fire-district/inspections/${ins2}/complete"
              payload: { result: "FAIL", violation_notice_method: "CERTIFIED_MAIL" }
              as: Inspector
              as_user_id: "${insp1}"
            - call: "GET /fire-district/violation-notices"
              payload: { parcel_id: "${p1}" }
              as: ProgramAdmin
              captures: { n1: "$.data[0].id" }
            - call: "GET /fire-district/violation-notices"
              payload: { parcel_id: "${p2}" }
              as: ProgramAdmin
              captures: { n2: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles/${cyc}/advance"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/violation-notices/${n1}/authorize-abatement"
              payload: { estimated_cost_cents: 200000 }
              as: FireMarshal
              captures: { o1: "$.data.id" }
            - call: "POST /fire-district/violation-notices/${n2}/authorize-abatement"
              payload: { estimated_cost_cents: 200000 }
              as: FireMarshal
              captures: { o2: "$.data.id" }
            - call: "POST /fire-district/abatement-orders/${o1}/award"
              payload: { contractor_id: "${c1}", crew_hours: 12.5, work_start_utc: "2026-10-05T08:00:00Z", work_end_utc: "2026-10-05T18:00:00Z" }
              as: FireMarshal
            - call: "POST /fire-district/abatement-orders/${o2}/award"
              payload: { contractor_id: "${c2}", crew_hours: 12.5, work_start_utc: "2026-10-05T08:00:00Z", work_end_utc: "2026-10-05T18:00:00Z" }
              as: FireMarshal
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/abatement-orders/${o1}/complete-work"
              payload: { actual_crew_hours: 12.5, green_waste_tons: 3.25 }
              as: Contractor
              as_user_id: "${c1}"
            - call: "POST /fire-district/abatement-orders/${o2}/complete-work"
              payload: { actual_crew_hours: 12.5, green_waste_tons: 3.25 }
              as: Contractor
              as_user_id: "${c2}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-06T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/abatement-orders/${o1}/verify-completion"
              payload: { verified_note: "district crew work verified" }
              as: Inspector
              as_user_id: "${insp2}"
          trigger:
            - call: "POST /fire-district/abatement-orders/${o2}/verify-completion"
              payload: { verified_note: "voluntary pre-compliance work verified" }
              as: Inspector
              as_user_id: "${insp2}"
          assert:
            - "${enr2_status} == \"APPROVED\", so the qualifying enrollment predates notice ${n2}"
            - "AbatementOrder.${o1}.recovery_basis == \"DISTRICT_CONTRACTED\" and AbatementOrder.${o2}.recovery_basis == \"VOLUNTARY_PRECOMPLIANCE\""
            - "Both orders share the same raw cost lines: labor_line_cents == 107500, disposal_line_cents == 29900, mobilization_line_cents == 32000"
            - "AbatementOrder.${o1}.admin_overhead_cents == 21176 and AbatementOrder.${o2}.admin_overhead_cents == 0"
            - "AbatementOrder.${o1}.pre_subsidy_total_cents == 190576 and AbatementOrder.${o2}.pre_subsidy_total_cents == 169400"
            - "AbatementOrder.${o1}.subsidy_pct == 0.20 and AbatementOrder.${o2}.subsidy_pct == 0.30 (one ladder step more generous, not a re-lookup: 169400 still lands in the 0.20 tier)"
            - "AbatementOrder.${o1}.district_subsidy_cents == 38115 and AbatementOrder.${o2}.district_subsidy_cents == 50820"
            - "AbatementOrder.${o1}.total_recoverable_cents == 152461 and AbatementOrder.${o2}.total_recoverable_cents == 118580"
            - "152461 - 118580 == 33881, the variant delta"
            - "AbatementOrder.${o2}.total_recoverable_cents != 135520, the value produced if only the admin line were zeroed and subsidy_pct stayed at 0.20"
            - "AbatementOrder.${o1}.invoice_due_utc == \"2026-11-20T23:59:59Z\" and AbatementOrder.${o2}.invoice_due_utc == \"2026-11-20T23:59:59Z\""

  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: admin_overhead_per_line_rounding_not_sum_then_round
        mode: b
        grounds:
          - calculations.abatement_cost_recovery
          - entities.AbatementOrder.fields.admin_overhead_cents
          - entities.CostRecoveryPayment.fields.allocation
          - entities.CostRecoveryPayment.fields.outstanding_after_cents
          - endpoints."POST /fire-district/abatement-orders/{order_id}/payments"
        distinguishing_aspect: |
          Mode b — rounding placement. The rate card is chosen so that all three cost lines
          are congruent to 4 (mod 8) and each line x ADMIN_OVERHEAD_PCT lands exactly on a
          half cent: 107500, 29900 and 32004 give 13437.5, 3737.5 and 4000.5. Rounding each
          line before summing gives admin_overhead_cents 21177; summing first and rounding
          once gives 21176, which propagates to total_recoverable_cents 152464 instead of
          152465. The second half of the instance pins the waterfall bucket ORDER, whose
          effect is separable from the rounding: the subsidy shortfall must land entirely in
          the last bucket LABOR (69384 of a 107500 cap) and nowhere else.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one ACTIVE cycle with invoice_due_days 45."
            - "One contractor with hourly_rate_cents 8600 and mobilization_fee_cents 32004."
            - "One parcel failed on 2026-08-22, notice OVERDUE at the 2026-10-01 advance, order authorized and awarded, work reported as 12.5 crew hours and 3.25 green-waste tons."
            - "Clock advanced to 2026-10-06T00:00:00Z; insp2 (not the inspecting inspector) will verify."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026, notice_lead_days: 10, invoice_due_days: 45 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id" }
            - call: "POST /fire-district/inspection-cycles/${cyc}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/inspectors"
              payload: { full_name: "Ivan Ruiz", certification_level: "ADVANCED", status: "ACTIVE" }
              as: ProgramAdmin
              captures: { insp1: "$.data.id" }
            - call: "POST /fire-district/inspectors"
              payload: { full_name: "Nora Vance", certification_level: "ADVANCED", status: "ACTIVE" }
              as: ProgramAdmin
              captures: { insp2: "$.data.id" }
            - call: "POST /fire-district/contractors"
              payload: { business_name: "Ridgeline Fuels LLC", hourly_rate_cents: 8600, mobilization_fee_cents: 32004, license_status: "ACTIVE", insurance_expiry_utc: "2027-06-30T00:00:00Z", max_daily_orders: 2 }
              as: ProgramAdmin
              captures: { c1: "$.data.id" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-3001", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", structure_present: true, roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /fire-district/inspections"
              payload: { parcel_id: "${p1}", cycle_id: "${cyc}", inspector_id: "${insp1}", inspection_type: "INITIAL", scheduled_start_utc: "2026-08-20T15:00:00Z", scheduled_end_utc: "2026-08-20T17:00:00Z", access_arrangement: "EXTERIOR_ONLY" }
              as: ProgramAdmin
              captures: { ins1: "$.data.id" }
            - call: "POST /fire-district/inspections/${ins1}/notice"
              payload: { notice_method: "CERTIFIED_MAIL" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspections/${ins1}/zone-evaluations"
              payload: { zone: "ZONE_0_EMBER", measured_clearance_ft: 5.0, ladder_fuel_present: false }
              as: Inspector
              as_user_id: "${insp1}"
            - call: "POST /fire-district/inspections/${ins1}/zone-evaluations"
              payload: { zone: "ZONE_1", measured_clearance_ft: 15.0, ladder_fuel_present: false }
              as: Inspector
              as_user_id: "${insp1}"
            - call: "POST /fire-district/inspections/${ins1}/zone-evaluations"
              payload: { zone: "ZONE_2", measured_clearance_ft: 118.0, ladder_fuel_present: false }
              as: Inspector
              as_user_id: "${insp1}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-22T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspections/${ins1}/complete"
              payload: { result: "FAIL", violation_notice_method: "CERTIFIED_MAIL" }
              as: Inspector
              as_user_id: "${insp1}"
            - call: "GET /fire-district/violation-notices"
              payload: { parcel_id: "${p1}" }
              as: ProgramAdmin
              captures: { n1: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles/${cyc}/advance"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/violation-notices/${n1}/authorize-abatement"
              payload: { estimated_cost_cents: 250000 }
              as: FireMarshal
              captures: { o1: "$.data.id" }
            - call: "POST /fire-district/abatement-orders/${o1}/award"
              payload: { contractor_id: "${c1}", crew_hours: 12.5, work_start_utc: "2026-10-05T08:00:00Z", work_end_utc: "2026-10-05T18:00:00Z" }
              as: FireMarshal
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/abatement-orders/${o1}/complete-work"
              payload: { actual_crew_hours: 12.5, green_waste_tons: 3.25 }
              as: Contractor
              as_user_id: "${c1}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-06T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /fire-district/abatement-orders/${o1}/verify-completion"
              payload: { verified_note: "half-cent rate card" }
              as: Inspector
              as_user_id: "${insp2}"
            - call: "POST /fire-district/abatement-orders/${o1}/payments"
              payload: { amount_cents: 152465, method: "CHECK" }
              as: ProgramAdmin
              captures: { pay1: "$.data.id" }
          assert:
            - "AbatementOrder.${o1}.labor_line_cents == 107500, disposal_line_cents == 29900, mobilization_line_cents == 32004"
            - "AbatementOrder.${o1}.admin_overhead_cents == 21177 (13438 + 3738 + 4001), NOT 21176"
            - "AbatementOrder.${o1}.pre_subsidy_total_cents == 190581"
            - "AbatementOrder.${o1}.subsidy_pct == 0.20 and district_subsidy_cents == 38116"
            - "AbatementOrder.${o1}.total_recoverable_cents == 152465, NOT 152464 (the sum-then-round result)"
            - "CostRecoveryPayment.${pay1}.allocation == { ADMIN_OVERHEAD: 21177, MOBILIZATION: 32004, DISPOSAL: 29900, LABOR: 69384 }"
            - "The allocation values sum to 152465, equal to AbatementOrder.${o1}.total_recoverable_cents"
            - "CostRecoveryPayment.${pay1}.allocation.LABOR == 69384, strictly below the 107500 labor cap: the whole subsidy shortfall lands in the LAST bucket"
            - "CostRecoveryPayment.${pay1}.allocation != { ADMIN_OVERHEAD: 21177, MOBILIZATION: 32004, DISPOSAL: 29900, LABOR: 107500 }, i.e. buckets are capped by recoverable share rather than by raw line"
            - "CostRecoveryPayment.${pay1}.outstanding_after_cents == 0 and AbatementOrder.${o1}.status == \"PAID\""

      - name: cost_share_bonus_tier_keyed_on_pre_bonus_award
        mode: c
        grounds:
          - calculations.cost_share_award
          - entities.SupportEnrollment.fields.award_before_bonus_cents
          - entities.SupportEnrollment.fields.bonus_pct
          - entities.SupportEnrollment.fields.award_cents
          - entities.SupportProgram.fields.budget_remaining_cents
          - state_machines.SupportEnrollment.REQUESTED_to_APPROVED
        distinguishing_aspect: |
          Mode c — resolved circularity in a tiered ladder. award_cents = base + bonus while
          the bonus tier is keyed on a bracket of the award, so the pinned evaluation order
          is the whole content of the claim. vendor_invoice_cents 191667 on a HIGH parcel
          gives award_before_bonus_cents 115000, which falls in the 0.10 bracket (50000 <=
          a < 120000) for an award of 126500. Keying the tier on the FINAL award 126500
          instead crosses the 120000 boundary into 0.05 and yields 120750. The two answers
          differ by 5750 and both look internally consistent, so only the pinned order
          distinguishes them. Unlike the abatement instance, no rounding is at stake here:
          115000.2 truncating vs rounding gives the same integer.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one ACTIVE cycle."
            - "One COST_SHARE_GRANT SupportProgram with budget_total_cents 500000, capacity_slots 2, window 2026-08-01 to 2026-12-01."
            - "One parcel whose intake risk_class is HIGH (slope 30 / BRUSH / CLASS_B / GATED / hazard HIGH) with owner_hardship_flag true."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id" }
            - call: "POST /fire-district/inspection-cycles/${cyc}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/support-programs"
              payload: { cycle_id: "${cyc}", program_type: "COST_SHARE_GRANT", budget_total_cents: 500000, capacity_slots: 2, service_window_start_utc: "2026-08-01T00:00:00Z", service_window_end_utc: "2026-12-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { prog: "$.data.id", prog_v: "$.data.version" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-3101", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", structure_present: true, roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED", owner_hardship_flag: true }
              as: ProgramAdmin
              captures: { p1: "$.data.id", p1_class: "$.data.risk_class" }
          trigger:
            - call: "POST /fire-district/support-enrollments"
              payload: { support_program_id: "${prog}", parcel_id: "${p1}", vendor_invoice_cents: 191667, expected_program_version: "${prog_v}" }
              as: ProgramAdmin
              captures: { enr: "$.data.id" }
          assert:
            - "${p1_class} == \"HIGH\", so MATCH_BY_RISK_CLASS selects 0.60"
            - "SupportEnrollment.${enr}.vendor_invoice_cents == 191667, below PER_PARCEL_CAP_CENTS 250000, so STEP 1 does not clamp the eligible cost"
            - "SupportEnrollment.${enr}.award_before_bonus_cents == 115000"
            - "SupportEnrollment.${enr}.bonus_pct == 0.10, the bracket of 115000 — NOT 0.05"
            - "SupportEnrollment.${enr}.hardship_bonus_cents == 11500"
            - "SupportEnrollment.${enr}.award_cents == 126500, NOT 120750"
            - "SupportEnrollment.${enr}.status == \"APPROVED\" and reserved_amount_cents == 126500"
            - "SupportProgram.${prog}.budget_remaining_cents == 373500 and reserved_slots == 1"
            - "126500 exceeds the 120000 tier boundary while award_before_bonus_cents 115000 does not: the tier is keyed on the pre-bonus value"

  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: inspection_denial_reschedule_loop_terminates_in_abandoned
        shape: cyclic
        grounds:
          - state_machines.Inspection.NOTICED_to_ACCESS_DENIED
          - state_machines.Inspection.ACCESS_DENIED_to_SCHEDULED
          - state_machines.Inspection.NOTICED_to_ABANDONED
          - entities.Inspection.fields.access_denial_count
          - calculations.notice_compliance_deadline
        distinguishing_aspect: |
          Cyclic shape on the Inspection machine: SCHEDULED -> NOTICED -> ACCESS_DENIED ->
          SCHEDULED is a genuine loop, and its termination condition is a counter that the
          loop deliberately does NOT reset — the reschedule clears notice_method and
          notice_sent_at_utc but leaves access_denial_count at 1, so the second pass through
          NOTICED takes the ABANDONED branch instead of ACCESS_DENIED. This instance owns
          the loop-termination claim; the branching instance in this rule owns fan-out from
          a single trigger.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one ACTIVE cycle with notice_lead_days 10."
            - "One ACTIVE inspector, one parcel in hazard_zone HIGH."
            - "One INITIAL inspection scheduled 2026-08-20T15:00Z-17:00Z and noticed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026, notice_lead_days: 10 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id" }
            - call: "POST /fire-district/inspection-cycles/${cyc}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/inspectors"
              payload: { full_name: "Ivan Ruiz", certification_level: "BASIC", status: "ACTIVE" }
              as: ProgramAdmin
              captures: { insp1: "$.data.id" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-4001", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", structure_present: true, roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /fire-district/inspections"
              payload: { parcel_id: "${p1}", cycle_id: "${cyc}", inspector_id: "${insp1}", inspection_type: "INITIAL", scheduled_start_utc: "2026-08-20T15:00:00Z", scheduled_end_utc: "2026-08-20T17:00:00Z", access_arrangement: "OWNER_PRESENT" }
              as: ProgramAdmin
              captures: { ins1: "$.data.id" }
            - call: "POST /fire-district/inspections/${ins1}/notice"
              payload: { notice_method: "CERTIFIED_MAIL" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspections/${ins1}/access-denial"
              payload: { reason_code: "GATE_LOCKED" }
              as: Inspector
              as_user_id: "${insp1}"
              captures: { st1: "$.data.status", dc1: "$.data.access_denial_count" }
            - call: "POST /fire-district/inspections/${ins1}/reschedule"
              payload: { scheduled_start_utc: "2026-08-25T15:00:00Z", scheduled_end_utc: "2026-08-25T17:00:00Z" }
              as: ProgramAdmin
              captures: { st2: "$.data.status", dc2: "$.data.access_denial_count", nm2: "$.data.notice_method" }
            - call: "POST /fire-district/inspections/${ins1}/notice"
              payload: { notice_method: "CERTIFIED_MAIL" }
              as: ProgramAdmin
              captures: { st3: "$.data.status" }
          trigger:
            - call: "POST /fire-district/inspections/${ins1}/access-denial"
              payload: { reason_code: "OWNER_REFUSED" }
              as: Inspector
              as_user_id: "${insp1}"
          assert:
            - "${st1} == \"ACCESS_DENIED\" and ${dc1} == 1 on the first pass"
            - "${st2} == \"SCHEDULED\" and ${nm2} == null: the reschedule clears the service record"
            - "${dc2} == 1: the loop does NOT reset access_denial_count"
            - "${st3} == \"NOTICED\", i.e. the loop closed back onto the same state"
            - "Inspection.${ins1}.status == \"ABANDONED\" after the trigger, NOT \"ACCESS_DENIED\" a second time"
            - "Inspection.${ins1}.access_denial_count == 2 == MAX_ACCESS_DENIALS"
            - "Inspection.${ins1}.scheduled_start_utc == \"2026-08-25T15:00:00Z\", the rescheduled window, not the original"
            - "Exactly one ViolationNotice exists on parcel ${p1} with severity == \"CRITICAL\", notice_method == \"CERTIFIED_MAIL\" and inspection_id == ${ins1}"
            - "That notice has delivered_at_utc == \"2026-08-06T00:00:00Z\" (issued 2026-08-01 + MAIL_SERVICE_DAYS 5), compliance_days == 14 and deadline_utc == \"2026-08-20T23:59:59Z\""
            - "Parcel.${p1}.compliance_status == \"NON_COMPLIANT\" and Parcel.${p1}.open_violation_count == 1"
            - "A third access-denial on ${ins1} is rejected because ABANDONED is terminal"

      - name: enrollment_completion_forks_on_program_type
        shape: branching
        grounds:
          - state_machines.SupportEnrollment.APPROVED_to_COMPLETED
          - state_machines.SupportEnrollment.APPROVED_to_REIMBURSED
          - state_machines.SupportEnrollment.APPROVED_to_NO_SHOW
          - entities.SupportEnrollment.fields.reimbursed_cents
          - entities.SupportProgram.fields.budget_remaining_cents
          - entities.SupportProgram.fields.reserved_slots
        distinguishing_aspect: |
          Branching shape: one trigger, POST .../complete, fans out to three different target
          states with three different side-effect sets. The fork key is a combination of a
          request field (attended) and a parent-entity field (SupportProgram.program_type),
          so the selection is not readable from the request alone: attended true on a
          CHIPPER_DAY program goes COMPLETED and moves no money, attended true on a
          COST_SHARE_GRANT goes REIMBURSED and sets reimbursed_cents while budget stays put,
          and attended false goes NO_SHOW and credits the budget back. This instance owns
          fan-out; the cyclic instance in this rule owns the loop and its counter.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one ACTIVE cycle."
            - "Two programs on that cycle: a CHIPPER_DAY program (budget 0, 3 slots) and a COST_SHARE_GRANT program (budget 500000, 3 slots), both open 2026-08-01 to 2026-12-01."
            - "Three parcels; pB has owner_hardship_flag true, pC does not; both are HIGH risk at intake."
            - "Three APPROVED enrollments: eA on the chipper program, eB (invoice 191667, award 126500) and eC (invoice 100000, award 60000) on the grant program."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id" }
            - call: "POST /fire-district/inspection-cycles/${cyc}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/support-programs"
              payload: { cycle_id: "${cyc}", program_type: "CHIPPER_DAY", budget_total_cents: 0, capacity_slots: 3, service_window_start_utc: "2026-08-01T00:00:00Z", service_window_end_utc: "2026-12-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { chip: "$.data.id", chip_v: "$.data.version" }
            - call: "POST /fire-district/support-programs"
              payload: { cycle_id: "${cyc}", program_type: "COST_SHARE_GRANT", budget_total_cents: 500000, capacity_slots: 3, service_window_start_utc: "2026-08-01T00:00:00Z", service_window_end_utc: "2026-12-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { grant: "$.data.id", grant_v1: "$.data.version" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-4101", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", structure_present: true, roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { pa: "$.data.id" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-4102", owner_name: "Ben Ortiz", owner_email: "ben@example.com", situs_address: "14 Ridge Rd", structure_present: true, roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED", owner_hardship_flag: true }
              as: ProgramAdmin
              captures: { pb: "$.data.id" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-4103", owner_name: "Cara Diaz", owner_email: "cara@example.com", situs_address: "16 Ridge Rd", structure_present: true, roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED", owner_hardship_flag: false }
              as: ProgramAdmin
              captures: { pc: "$.data.id" }
            - call: "POST /fire-district/support-enrollments"
              payload: { support_program_id: "${chip}", parcel_id: "${pa}", expected_program_version: "${chip_v}" }
              as: ProgramAdmin
              captures: { ea: "$.data.id" }
            - call: "POST /fire-district/support-enrollments"
              payload: { support_program_id: "${grant}", parcel_id: "${pb}", vendor_invoice_cents: 191667, expected_program_version: "${grant_v1}" }
              as: ProgramAdmin
              captures: { eb: "$.data.id" }
            - call: "GET /fire-district/support-programs/${grant}"
              payload: {}
              as: ProgramAdmin
              captures: { grant_v2: "$.data.version" }
            - call: "POST /fire-district/support-enrollments"
              payload: { support_program_id: "${grant}", parcel_id: "${pc}", vendor_invoice_cents: 100000, expected_program_version: "${grant_v2}" }
              as: ProgramAdmin
              captures: { ec: "$.data.id", ec_award: "$.data.award_cents" }
          trigger:
            - call: "POST /fire-district/support-enrollments/${ea}/complete"
              payload: { attended: true }
              as: ProgramAdmin
            - call: "POST /fire-district/support-enrollments/${eb}/complete"
              payload: { attended: true }
              as: ProgramAdmin
            - call: "POST /fire-district/support-enrollments/${ec}/complete"
              payload: { attended: false }
              as: ProgramAdmin
          assert:
            - "${ec_award} == 60000: award_before_bonus 60000 with owner_hardship_flag false contributes hardship_bonus_cents 0"
            - "SupportEnrollment.${ea}.status == \"COMPLETED\", NOT \"REIMBURSED\": the CHIPPER_DAY branch"
            - "SupportEnrollment.${ea}.reimbursed_cents == null and SupportProgram.${chip}.budget_remaining_cents == 0"
            - "SupportEnrollment.${eb}.status == \"REIMBURSED\", NOT \"COMPLETED\": the COST_SHARE_GRANT branch under the same attended == true"
            - "SupportEnrollment.${eb}.reimbursed_cents == 126500 and reserved_amount_cents == 126500"
            - "SupportEnrollment.${ec}.status == \"NO_SHOW\" and reserved_amount_cents == 0"
            - "SupportProgram.${grant}.budget_remaining_cents == 373500 after the three triggers (500000 - 126500 still reserved for the REIMBURSED row, with eC's 60000 credited back)"
            - "SupportProgram.${grant}.reserved_slots == 1: the REIMBURSED row still occupies a slot, the NO_SHOW row does not"
            - "The budget conservation invariant holds: 373500 == 500000 - 126500, the sum of reserved_amount_cents over grant enrollments whose status IN {APPROVED, COMPLETED, REIMBURSED}"
            - "A second complete on ${eb} is rejected because REIMBURSED is terminal"

  # ==========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: inspection_fail_cascade_five_links_to_community_rate
        depth: 5
        grounds:
          - state_machines.Inspection.NOTICED_to_COMPLETED
          - state_machines.ComplianceCertificate.ISSUED_to_REVOKED
          - calculations.program_compliance_metrics
          - entities.Parcel.fields.open_violation_count
          - entities.Community.fields.compliance_rate_pct
          - entities.Community.fields.lapse_count
        distinguishing_aspect: |
          Origin trigger is POST /fire-district/inspections/{id}/complete with result FAIL, and
          the chain is Inspection -> Parcel.compliance_status -> ViolationNotice ->
          Community.compliance_rate_pct -> Community.status, with the certificate revocation
          hanging off link 3 rather than off the trigger. The instance also pins the guard on
          the last link: the community is ORGANIZING, so link 6 must NOT fire even though the
          recomputed rate 0.00 is below COMMUNITY_LAPSE_FLOOR_PCT — only a CERTIFIED community
          lapses. The sibling instance in this rule starts from a different trigger.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one ACTIVE cycle with notice_lead_days 10."
            - "One ORGANIZING community with exactly one member parcel p1 (hazard_zone HIGH, slope 30, BRUSH, CLASS_B, GATED)."
            - "p1 passes an INITIAL inspection on 2026-08-22 (zones 10.0 / 40.0 / 130.0 ft, all NONE), so it is COMPLIANT and the community rate is 100.00."
