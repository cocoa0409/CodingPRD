# ===========================================================================
# 1.9  Scaffold Corner Design  --  breadth probe over SCAFFOLD.yaml 1.1-1.7
#
# Taxonomy: references/claim-extraction-guide.md. Sections and claim_type values
# are taken from that guide; no categories are invented here. Corners already
# asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as `excluded_because:` stubs.
#
# Logical clock: every chain starts by pinning it to 2026-08-01T00:00:00Z.
# ===========================================================================
scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:

      - name: tour_channel_create_returns_all_declared_fields
        claim_type: creation
        grounds:
          - entities.TourChannel
          - endpoints[POST /tour-channels]
        distinguishing_aspect: "POST /tour-channels with every required field returns 201 and every field declared on TourChannel in 1.1, with the four common fields present and version starting at 1."
        test_recipe:
          setup:
            - "Empty database, logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /tour-channels"
              payload: { name: "Off-Property Contact", channel_code: "OFF_PROPERTY_CONTACT", incentive_gift_value_cents: 12500, min_age: 30, min_household_income_cents: 5000000, min_qualification_score: 55, requires_married_household: true }
              as: MarketingManager
              captures: { ch1: $.data.id }
          assert:
            - "returns 201 with response_type object and meta.api_request_id present"
            - "TourChannel.${ch1}.id is a bare UUID with no type prefix and version == 1"
            - "TourChannel.${ch1}.name == Off-Property Contact, channel_code == OFF_PROPERTY_CONTACT, incentive_gift_value_cents == 12500"
            - "TourChannel.${ch1}.min_age == 30, min_household_income_cents == 5000000, min_qualification_score == 55, requires_married_household == true"
            - "TourChannel.${ch1}.status == ACTIVE, booked_count == 0, toured_count == 0, no_show_count == 0"
            - "TourChannel.${ch1}.historical_no_show_rate == 0.0000 and gift_liability_cents == 0"
            - "TourChannel.${ch1}.created_at == 2026-08-01T00:00:00.000Z (logical clock, not wall clock)"

      - name: tour_channel_requires_married_household_default_false
        claim_type: defaults
        grounds:
          - entities.TourChannel.requires_married_household
          - endpoints[POST /tour-channels]
        distinguishing_aspect: "Omitting requires_married_household applies the declared default false, so a SINGLE prospect clears the hard minimum criteria; supplying true on a second channel refuses the same prospect with ERR_PROSPECT_BELOW_MINIMUM_CRITERIA."
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z."
            - "One gallery with one ACTIVE representative so bookings are accepted."
            - "One SINGLE prospect aged 45 with household income 15000000 (income 45 + age 25 = 70 points)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sales-galleries"
              payload: { name: "Orlando Sales Gallery", site_code: "ORLGAL", concurrent_tour_capacity: 4, presentation_minutes: 120, buffer_minutes: 30 }
              as: GalleryManager
              captures: { g1: $.data.id }
            - call: "POST /sales-representatives"
              payload: { gallery_id: "${g1}", full_name: "Dana Reyes", license_number: "FL-SL-410077", rotation_position: 1 }
              as: GalleryManager
              captures: { r1: $.data.id }
            - call: "POST /prospects"
              payload: { household_name: "Sorensen Household", primary_age: 45, household_income_cents: 15000000, marital_status: "SINGLE" }
              as: MarketingManager
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /tour-channels"
              payload: { name: "Open Desk", channel_code: "OFF_PROPERTY_CONTACT", incentive_gift_value_cents: 12500, min_age: 30, min_household_income_cents: 5000000, min_qualification_score: 55 }
              as: MarketingManager
              captures: { ch_default: $.data.id }
            - call: "POST /tour-channels"
              payload: { name: "Couples Only Desk", channel_code: "TELEMARKETING", incentive_gift_value_cents: 9500, min_age: 30, min_household_income_cents: 5000000, min_qualification_score: 55, requires_married_household: true }
              as: MarketingManager
              captures: { ch_married: $.data.id }
            - call: "POST /tour-bookings"
              payload: { channel_id: "${ch_default}", prospect_id: "${p1}", gallery_id: "${g1}", scheduled_start_utc: "2026-08-16T07:00:00Z" }
              as: MarketingManager
              captures: { b_ok: $.data.id }
            - call: "POST /tour-bookings"
              payload: { channel_id: "${ch_married}", prospect_id: "${p1}", gallery_id: "${g1}", scheduled_start_utc: "2026-08-16T10:00:00Z" }
              as: MarketingManager
          assert:
            - "TourChannel.${ch_default}.requires_married_household == false (default applied)"
            - "TourChannel.${ch_married}.requires_married_household == true"
            - "trigger 3 returns 201 with TourBooking.${b_ok}.qualification_score == 70 (income 45 + age 25, no marital points)"
            - "trigger 4 returns 422 with error_id ERR_PROSPECT_BELOW_MINIMUM_CRITERIA"

      - name: sales_gallery_buffer_minutes_default_zero
        claim_type: defaults
        grounds:
          - entities.SalesGallery.buffer_minutes
          - calculations.gallery_capacity_overlap_check
        distinguishing_aspect: "Omitting buffer_minutes applies the declared default 0, so a capacity-1 gallery with an existing 09:00-11:00 tour accepts a candidate starting at exactly 11:00 -- a booking that the 30-minute-buffer gallery of the 1.8 overlap instance refuses."
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z."
            - "One gallery created WITHOUT buffer_minutes: concurrent_tour_capacity 1, presentation_minutes 120."
            - "One ACTIVE representative, one channel, one prospect, one SCHEDULED booking at 2026-08-16T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sales-galleries"
              payload: { name: "Zero Buffer Gallery", site_code: "ZBGAL", concurrent_tour_capacity: 1, presentation_minutes: 120 }
              as: GalleryManager
              captures: { g1: $.data.id }
            - call: "POST /sales-representatives"
              payload: { gallery_id: "${g1}", full_name: "Dana Reyes", license_number: "FL-SL-410077", rotation_position: 1 }
              as: GalleryManager
              captures: { r1: $.data.id }
            - call: "POST /tour-channels"
              payload: { name: "Off-Property Contact", channel_code: "OFF_PROPERTY_CONTACT", incentive_gift_value_cents: 12500, min_age: 30, min_household_income_cents: 5000000, min_qualification_score: 55 }
              as: MarketingManager
              captures: { ch1: $.data.id }
            - call: "POST /prospects"
              payload: { household_name: "Alvarez Household", primary_age: 45, household_income_cents: 10000000, marital_status: "MARRIED" }
              as: MarketingManager
              captures: { p1: $.data.id }
            - call: "POST /tour-bookings"
              payload: { channel_id: "${ch1}", prospect_id: "${p1}", gallery_id: "${g1}", scheduled_start_utc: "2026-08-16T09:00:00Z" }
              as: MarketingManager
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /tour-bookings"
              payload: { channel_id: "${ch1}", prospect_id: "${p1}", gallery_id: "${g1}", scheduled_start_utc: "2026-08-16T10:59:00Z" }
              as: MarketingManager
            - call: "POST /tour-bookings"
              payload: { channel_id: "${ch1}", prospect_id: "${p1}", gallery_id: "${g1}", scheduled_start_utc: "2026-08-16T11:00:00Z" }
              as: MarketingManager
              captures: { b_adj: $.data.id }
          assert:
            - "SalesGallery.${g1}.buffer_minutes == 0 (default applied)"
            - "trigger 1 returns 409 with error_id ERR_GALLERY_CAPACITY_EXCEEDED (10:59 < 11:00 + 0)"
            - "trigger 2 returns 201 with TourBooking.${b_adj}.scheduled_start_utc == 2026-08-16T11:00:00Z and scheduled_end_utc == 2026-08-16T13:00:00Z"
            - "SalesGallery.${g1}.booked_slot_count == 2"

      - name: sales_gallery_get_returns_stored_entity
        claim_type: retrieval
        grounds:
          - endpoints[GET /sales-galleries/{id}]
          - entities.SalesGallery
        distinguishing_aspect: "GET /sales-galleries/{id} returns exactly the stored row: the same id, the input fields as supplied, available_rep_count 1 after one representative is added, and version incremented from 1 to 2 by that derived-field refresh."
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z."
            - "One gallery and one representative in it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sales-galleries"
              payload: { name: "Orlando Sales Gallery", site_code: "ORLGAL", concurrent_tour_capacity: 4, presentation_minutes: 120, buffer_minutes: 30 }
              as: GalleryManager
              captures: { g1: $.data.id }
            - call: "POST /sales-representatives"
              payload: { gallery_id: "${g1}", full_name: "Dana Reyes", license_number: "FL-SL-410077", rotation_position: 1 }
              as: GalleryManager
              captures: { r1: $.data.id }
          trigger:
            - call: "GET /sales-galleries/${g1}"
              payload: {}
              as: MarketingManager
          assert:
            - "returns 200 with response_type object"
            - "SalesGallery.${g1}.name == Orlando Sales Gallery, site_code == ORLGAL, concurrent_tour_capacity == 4, presentation_minutes == 120, buffer_minutes == 30"
            - "SalesGallery.${g1}.status == OPEN, available_rep_count == 1, booked_slot_count == 0"
            - "SalesGallery.${g1}.version == 2 (the representative insert refreshed available_rep_count)"

      - name: sales_representative_list_filtered_pagination
        claim_type: listing
        grounds:
          - endpoints[GET /sales-representatives]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /sales-representatives?gallery_id=&limit=2&offset=0 returns 2 of the 3 representatives in that gallery with total_count 3 and has_more true, and offset 2 returns the last row with has_more false; the representative in the other gallery never appears."
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z."
            - "Gallery g1 with three representatives at rotation_position 1, 2, 3 and gallery g2 with one representative."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sales-galleries"
              payload: { name: "Orlando Sales Gallery", site_code: "ORLGAL", concurrent_tour_capacity: 4, presentation_minutes: 120, buffer_minutes: 30 }
              as: GalleryManager
              captures: { g1: $.data.id }
            - call: "POST /sales-galleries"
              payload: { name: "Davenport Sales Gallery", site_code: "DAVGAL", concurrent_tour_capacity: 2, presentation_minutes: 120, buffer_minutes: 30 }
              as: GalleryManager
              captures: { g2: $.data.id }
            - call: "POST /sales-representatives"
              payload: { gallery_id: "${g1}", full_name: "Dana Reyes", license_number: "FL-SL-410077", rotation_position: 1 }
              as: GalleryManager
              captures: { r1: $.data.id }
            - call: "POST /sales-representatives"
              payload: { gallery_id: "${g1}", full_name: "Marco Iyer", license_number: "FL-SL-410078", rotation_position: 2 }
              as: GalleryManager
              captures: { r2: $.data.id }
            - call: "POST /sales-representatives"
              payload: { gallery_id: "${g1}", full_name: "Priya Raman", license_number: "FL-SL-410079", rotation_position: 3 }
              as: GalleryManager
              captures: { r3: $.data.id }
            - call: "POST /sales-representatives"
              payload: { gallery_id: "${g2}", full_name: "Tom Bexley", license_number: "FL-SL-410080", rotation_position: 1 }
              as: GalleryManager
              captures: { r4: $.data.id }
          trigger:
            - call: "GET /sales-representatives"
              payload: { gallery_id: "${g1}", limit: 2, offset: 0 }
              as: GalleryManager
            - call: "GET /sales-representatives"
              payload: { gallery_id: "${g1}", limit: 2, offset: 2 }
              as: GalleryManager
            - call: "GET /sales-representatives"
              payload: { gallery_id: "${g1}", status: "SUSPENDED" }
              as: GalleryManager
          assert:
            - "trigger 1 returns response_type array with 2 rows, total_count == 3, has_more == true"
            - "trigger 2 returns 1 row, total_count == 3, has_more == false"
            - "SalesRepresentative.${r4} never appears in any of the three responses (gallery_id filter)"
            - "trigger 3 returns 0 rows with total_count == 0 and has_more == false"

      - name: sales_gallery_get_unknown_id_not_found
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors[ERR_GALLERY_NOT_FOUND]
        distinguishing_aspect: "GET /sales-galleries/{id} for a well-formed UUID that was never minted returns 404 ERR_GALLERY_NOT_FOUND, not 400 and not an empty 200 body."
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z; no gallery has been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /sales-galleries/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: GalleryManager
              captures: { err: $.data.error_id }
          assert:
            - "returns 404 with response_type error and data.error_id == ERR_GALLERY_NOT_FOUND"
            - "data.message is a non-empty string"

      - name: tour_channel_create_without_min_age_missing_required
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /tour-channels]
        distinguishing_aspect: "min_age has source input with no declared default, so omitting it returns 400 ERR_INVALID_REQUEST and no TourChannel row is created."
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /tour-channels"
              payload: { name: "Off-Property Contact", channel_code: "OFF_PROPERTY_CONTACT", incentive_gift_value_cents: 12500, min_household_income_cents: 5000000, min_qualification_score: 55 }
              as: MarketingManager
              captures: { err: $.data.error_id }
          assert:
            - "returns 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /tour-channels/{any} finds nothing: no TourChannel row was persisted"

      - name: prospect_create_marital_status_invalid_enum
        claim_type: type_constraints
        grounds:
          - entities.Prospect.marital_status
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "marital_status accepts only the declared enum members, so SEPARATED returns 400 ERR_INVALID_REQUEST; the same call with MARRIED returns 201."
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /prospects"
              payload: { household_name: "Alvarez Household", primary_age: 45, household_income_cents: 10000000, marital_status: "SEPARATED" }
              as: MarketingManager
              captures: { err: $.data.error_id }
            - call: "POST /prospects"
              payload: { household_name: "Alvarez Household", primary_age: 45, household_income_cents: 10000000, marital_status: "MARRIED" }
              as: MarketingManager
              captures: { p1: $.data.id }
          assert:
            - "trigger 1 returns 400 with data.error_id == ERR_INVALID_REQUEST"
            - "trigger 2 returns 201 with Prospect.${p1}.marital_status == MARRIED and is_existing_owner == false"

      - name: tour_booking_computed_fields_from_gallery_and_channel
        claim_type: computed_fields
        grounds:
          - entities.TourBooking.scheduled_end_utc
          - entities.TourBooking.qualification_score
          - calculations.tour_qualification_evaluation
        distinguishing_aspect: "scheduled_end_utc is computed as scheduled_start_utc plus the GALLERY's presentation_minutes (90, not the 120 used elsewhere), and qualification_score is frozen from the formula at creation: 35 + 25 + 20 = 80 with penalty 0."
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z."
            - "One gallery with presentation_minutes 90 and one ACTIVE representative."
            - "One channel with min_age 30 and a MARRIED prospect aged 45 with income 10000000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sales-galleries"
              payload: { name: "Ninety Minute Gallery", site_code: "NMGAL", concurrent_tour_capacity: 4, presentation_minutes: 90, buffer_minutes: 30 }
              as: GalleryManager
              captures: { g1: $.data.id }
            - call: "POST /sales-representatives"
              payload: { gallery_id: "${g1}", full_name: "Dana Reyes", license_number: "FL-SL-410077", rotation_position: 1 }
              as: GalleryManager
              captures: { r1: $.data.id }
            - call: "POST /tour-channels"
              payload: { name: "Off-Property Contact", channel_code: "OFF_PROPERTY_CONTACT", incentive_gift_value_cents: 12500, min_age: 30, min_household_income_cents: 5000000, min_qualification_score: 55 }
              as: MarketingManager
              captures: { ch1: $.data.id }
            - call: "POST /prospects"
              payload: { household_name: "Alvarez Household", primary_age: 45, household_income_cents: 10000000, marital_status: "MARRIED" }
              as: MarketingManager
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /tour-bookings"
              payload: { channel_id: "${ch1}", prospect_id: "${p1}", gallery_id: "${g1}", scheduled_start_utc: "2026-08-16T07:00:00Z" }
              as: MarketingManager
              captures: { b1: $.data.id }
          assert:
            - "returns 201 with TourBooking.${b1}.scheduled_end_utc == 2026-08-16T08:30:00Z"
            - "TourBooking.${b1}.qualification_score == 80 and qualification_penalty_points == 0"
            - "TourBooking.${b1}.gift_issued == false, gift_value_cents == 0, reschedule_count == 0, assigned_rep_id == null"
            - "TourChannel.${ch1}.booked_count == 1 and SalesGallery.${g1}.booked_slot_count == 1"

      - name: tour_booking_create_system_fields_ignored_input
        claim_type: system_fields
        grounds:
          - entities.TourBooking.status
          - entities.TourBooking.assigned_rep_id
          - endpoints[POST /tour-bookings]
        distinguishing_aspect: "status, assigned_rep_id, qualification_score, id and version are not in POST /tour-bookings input, so client-supplied values for them are ignored: the row is created SCHEDULED with assigned_rep_id null, qualification_score 80 from the formula, and a server-minted id."
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z."
            - "One gallery with one ACTIVE representative, one channel, one qualifying prospect."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sales-galleries"
              payload: { name: "Orlando Sales Gallery", site_code: "ORLGAL", concurrent_tour_capacity: 4, presentation_minutes: 120, buffer_minutes: 30 }
              as: GalleryManager
              captures: { g1: $.data.id }
            - call: "POST /sales-representatives"
              payload: { gallery_id: "${g1}", full_name: "Dana Reyes", license_number: "FL-SL-410077", rotation_position: 1 }
              as: GalleryManager
              captures: { r1: $.data.id }
            - call: "POST /tour-channels"
              payload: { name: "Off-Property Contact", channel_code: "OFF_PROPERTY_CONTACT", incentive_gift_value_cents: 12500, min_age: 30, min_household_income_cents: 5000000, min_qualification_score: 55 }
              as: MarketingManager
              captures: { ch1: $.data.id }
            - call: "POST /prospects"
              payload: { household_name: "Alvarez Household", primary_age: 45, household_income_cents: 10000000, marital_status: "MARRIED" }
              as: MarketingManager
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /tour-bookings"
              payload: { channel_id: "${ch1}", prospect_id: "${p1}", gallery_id: "${g1}", scheduled_start_utc: "2026-08-16T07:00:00Z", status: "TOURED", assigned_rep_id: "${r1}", qualification_score: 5, version: 99 }
              as: MarketingManager
              captures: { b1: $.data.id }
          assert:
            - "TourBooking.${b1}.status == SCHEDULED (client value TOURED ignored)"
            - "TourBooking.${b1}.assigned_rep_id == null (rotation only runs at check-in)"
            - "TourBooking.${b1}.qualification_score == 80 (recomputed, client value 5 ignored)"
            - "TourBooking.${b1}.version == 1 (client value 99 ignored) and id != the value of any client-supplied field"

      - name: append_only_event_children_carry_no_version_field
        claim_type: immutability
        grounds:
          - entities.DisclosureAcknowledgment
          - entities.ProhibitedClaimFinding
          - endpoints[GET /sales-presentations/{id}/disclosure-acknowledgments]
        distinguishing_aspect: "DisclosureAcknowledgment and ProhibitedClaimFinding are declared common_fields false, so their responses carry id and created_at but NO version and NO updated_at, and 1.5 declares no update or delete endpoint for either -- the only way to change compliance history is to append another row."
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z, then advanced to 2026-08-16T07:00:00Z."
            - "One checked-in tour with an open presentation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sales-galleries"
              payload: { name: "Orlando Sales Gallery", site_code: "ORLGAL", concurrent_tour_capacity: 4, presentation_minutes: 120, buffer_minutes: 30 }
              as: GalleryManager
              captures: { g1: $.data.id }
            - call: "POST /sales-representatives"
              payload: { gallery_id: "${g1}", full_name: "Dana Reyes", license_number: "FL-SL-410077", rotation_position: 1 }
              as: GalleryManager
              captures: { r1: $.data.id }
            - call: "POST /tour-channels"
              payload: { name: "Off-Property Contact", channel_code: "OFF_PROPERTY_CONTACT", incentive_gift_value_cents: 12500, min_age: 30, min_household_income_cents: 5000000, min_qualification_score: 55 }
              as: MarketingManager
              captures: { ch1: $.data.id }
            - call: "POST /prospects"
              payload: { household_name: "Alvarez Household", primary_age: 45, household_income_cents: 10000000, marital_status: "MARRIED" }
              as: MarketingManager
              captures: { p1: $.data.id }
            - call: "POST /tour-bookings"
              payload: { channel_id: "${ch1}", prospect_id: "${p1}", gallery_id: "${g1}", scheduled_start_utc: "2026-08-16T07:00:00Z" }
              as: MarketingManager
              captures: { b1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T07:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tour-bookings/${b1}/check-in"
              payload: { issue_incentive_gift: false }
              as: GalleryManager
              captures: { rep1: $.data.assigned_rep_id }
            - call: "POST /sales-presentations"
              payload: { booking_id: "${b1}", recorded_ack_reference: "REC-0001" }
              as: SalesRepresentative
              as_user_id: "${rep1}"
              captures: { pr1: $.data.id }
            - call: "GET /sales-presentations/${pr1}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-bravo"
              captures: { pr1_v: $.data.version }
          trigger:
            - call: "POST /disclosure-acknowledgments"
