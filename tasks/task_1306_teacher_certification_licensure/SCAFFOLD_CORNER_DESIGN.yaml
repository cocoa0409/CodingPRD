            - { call: "POST /licensure/ce-audits/${au}/determinations", payload: { expected_ce_audit_version: "${au_v}" }, as: CredentialEvaluator }
          trigger:
            - { call: "POST /licensure/ce-audits/${au}/determinations", payload: { expected_ce_audit_version: "${au_v}" }, as: CredentialEvaluator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == 'ERR_STALE_VERSION'"
            - "http status == 412"

      - name: audit_total_stale_until_determination
        claim_type: derived_field_reconciliation
        grounds: [calculations.ce_credit_audit_total, entities.CEAudit.fields.verified_hours, state_machines.CECredit.SUBMITTED_to_VERIFIED]
        distinguishing_aspect: "Derived-field reconciliation: verifying a new TECHNOLOGY 10h credit after a determination leaves the audit's stored verified_hours at 50 until the next determination refreshes it to 60."
        test_recipe:
          setup: ["License ACTIVE; VERIFIED credits CONTENT 30 + PEDAGOGY 20; STANDARD audit with determination totaling 50"]
          setup_api_calls:
            - { call: "POST /licensure/applicants", payload: { full_name: "Nan Na", email: "nan@x.com", date_of_birth: "1998-11-11T00:00:00Z", ssn_last4: "3011", moral_character_attestation: true }, as: Anonymous, captures: { ap: $.data.id } }
            - { call: "POST /licensure/applications", payload: { applicant_id: "${ap}", pathway: "RECIPROCITY", subject_area: "MATHEMATICS", grade_band: "G7_12" }, as: Applicant, as_user_id: "${ap}", captures: { app: $.data.id } }
            - { call: "POST /licensure/applications/${app}/fee-payment", payload: { payment_token: "tok_1" }, as: Applicant, as_user_id: "${ap}" }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "INTAKE_REVIEW" }, as: IntakeOfficer }
            - { call: "POST /licensure/applications/${app}/reciprocity-evaluations", payload: { source_state: "TX", source_license_type: "STANDARD", years_teaching: 5 }, as: CredentialEvaluator, captures: { re: $.data.id } }
            - { call: "POST /licensure/reciprocity-evaluations/${re}/finalize", payload: { mapping_mode: "DETERMINISTIC" }, as: CredentialEvaluator }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "EVALUATION" }, as: IntakeOfficer }
            - { call: "POST /licensure/applications/${app}/transcripts", payload: { institution_name: "TX State", degree_level: "BACHELORS", total_semester_hours: 120, courses: [ { course_code: "MATH101", credit_hours: 3, letter_grade: "A" } ] }, as: Applicant, as_user_id: "${ap}", captures: { tr: $.data.id } }
            - { call: "POST /licensure/transcripts/${tr}/verify", payload: { verification_status: "VERIFIED", subject_relevant_hours: 18 }, as: CredentialEvaluator }
            - { call: "POST /licensure/applications/${app}/background-checks", payload: { adverse_findings: [] }, as: BackgroundInvestigator, captures: { bg: $.data.id } }
            - { call: "POST /licensure/background-checks/${bg}/state", payload: { to_status: "PRINTS_SUBMITTED", fingerprint_submitted_at: "2026-08-05T00:00:00Z" }, as: BackgroundInvestigator }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "BACKGROUND_REVIEW" }, as: CredentialEvaluator }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "PENDING_DECISION" }, as: BackgroundInvestigator }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "APPROVED" }, as: CredentialEvaluator }
            - { call: "GET /licensure/licenses?application_id=${app}", payload: {}, as: CredentialEvaluator, captures: { lic: "$.data[0].id" } }
            - { call: "POST /licensure/licenses/${lic}/ce-credits", payload: { provider_name: "P1", category: "CONTENT", hours: 30, earned_on: "2027-01-10T00:00:00Z" }, as: Applicant, as_user_id: "${ap}", captures: { c1: $.data.id } }
            - { call: "POST /licensure/ce-credits/${c1}/state", payload: { to_status: "VERIFIED" }, as: CredentialEvaluator }
            - { call: "POST /licensure/licenses/${lic}/ce-credits", payload: { provider_name: "P2", category: "PEDAGOGY", hours: 20, earned_on: "2027-02-01T00:00:00Z" }, as: Applicant, as_user_id: "${ap}", captures: { c2: $.data.id } }
            - { call: "POST /licensure/ce-credits/${c2}/state", payload: { to_status: "VERIFIED" }, as: CredentialEvaluator }
            - { call: "POST /licensure/licenses/${lic}/ce-audits", payload: { audit_variant: "STANDARD" }, as: CredentialEvaluator, captures: { au: $.data.id, au_v: $.data.version } }
            - { call: "POST /licensure/ce-audits/${au}/determinations", payload: { expected_ce_audit_version: "${au_v}" }, as: CredentialEvaluator, captures: { tot1: $.data.verified_hours, au_v2: $.data.version } }
            - { call: "POST /licensure/licenses/${lic}/ce-credits", payload: { provider_name: "P3", category: "TECHNOLOGY", hours: 10, earned_on: "2027-04-01T00:00:00Z" }, as: Applicant, as_user_id: "${ap}", captures: { c3: $.data.id } }
            - { call: "POST /licensure/ce-credits/${c3}/state", payload: { to_status: "VERIFIED" }, as: CredentialEvaluator }
          trigger:
            - { call: "GET /licensure/ce-audits/${au}", payload: {}, as: CredentialEvaluator, captures: { tot_stale: $.data.verified_hours } }
            - { call: "POST /licensure/ce-audits/${au}/determinations", payload: { expected_ce_audit_version: "${au_v2}" }, as: CredentialEvaluator, captures: { tot2: $.data.verified_hours } }
          assert:
            - "stored verified_hours before new determination == 50"
            - "stored verified_hours after new determination == 60"

  # ==================================================================
  # Section: consistency_model
  # ==================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_after_state_change
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, "endpoints.POST /licensure/applications/{applicationId}/fee-payment"]
        distinguishing_aspect: "Immediate consistency: the fee-payment response and a subsequent GET both show fee_status PAID with no delay or reconciliation window."
        test_recipe:
          setup: ["Applicant with SUBMITTED application"]
          setup_api_calls:
            - { call: "POST /licensure/applicants", payload: { full_name: "Ott Ot", email: "ott@x.com", date_of_birth: "1999-12-12T00:00:00Z", ssn_last4: "3012", moral_character_attestation: true }, as: Anonymous, captures: { ap: $.data.id } }
            - { call: "POST /licensure/applications", payload: { applicant_id: "${ap}", pathway: "ALTERNATIVE", subject_area: "ELEMENTARY", grade_band: "PK_6" }, as: Applicant, as_user_id: "${ap}", captures: { app: $.data.id, st0: $.data.status } }
          trigger:
            - { call: "POST /licensure/applications/${app}/fee-payment", payload: { payment_token: "tok_1" }, as: Applicant, as_user_id: "${ap}", captures: { st1: $.data.fee_status } }
            - { call: "GET /licensure/applications/${app}", payload: {}, as: IntakeOfficer, captures: { st2: $.data.fee_status } }
          assert:
            - "create response status == 'SUBMITTED'"
            - "payment response fee_status == 'PAID'"
            - "subsequent GET fee_status == 'PAID'"

  # ==================================================================
  # Section: errors (triggerability stubs for corners already covered by §1.8)
  # ==================================================================
  - section: errors
    instances:
      - name: error_background_not_cleared_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_BACKGROUND_NOT_CLEARED]"]
        excluded_because:
          difficulty_instance: application_blocked_until_background_cleared
          rationale: "Asserted as the failure path of the named §1.8 instance."
      - name: error_audit_not_passed_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_AUDIT_NOT_PASSED]"]
        excluded_because:
          difficulty_instance: reinstate_requires_restoration_audit_passed
          rationale: "Asserted as the failure path of the named §1.8 instance."
      - name: error_permit_overlap_and_stale_version_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_PERMIT_INTERVAL_OVERLAP]", "errors[ERR_SUSPENSION_INTERVAL_OVERLAP]"]
        excluded_because:
          difficulty_instance: permit_half_open_adjacency_allowed
          rationale: "Both overlap errors are asserted inside the §1.8 temporal-overlap instances."
