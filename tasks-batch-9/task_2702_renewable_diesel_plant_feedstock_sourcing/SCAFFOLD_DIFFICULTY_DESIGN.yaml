      - name: run_windows_may_touch_but_never_straddle_on_one_unit
        grounds:
          - validations[priority=24]
          - errors[ERR_UNIT_WINDOW_CONFLICT]
          - entities.ProcessingRun.fields.window_start
          - endpoints["POST /processing-runs"]
        distinguishing_aspect: |
          Run windows are half-open, so a run beginning exactly when the previous one ends shares no instant of
          reactor time and is accepted, while a run that straddles the boundary by a single day is refused. The
          zero-buffer rule here is the deliberate opposite of the 72-hour turnaround separation on the very same
          unit, and only an interval-arithmetic implementation gets both right.
        test_recipe:
          setup:
            - "HTU-1 with an approved catalyst-change window [2026-08-01, 2026-08-03) and one ACTIVE charge."
            - "One PLANNED run over [2026-09-01, 2026-09-06)."
            - "Clock at the 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /hydrotreating-units"
              payload: { name: "HTU-1", nameplate_capacity_mt_per_day: 400.0, max_saf_share_pct: 40.00 }
              as: PlantOperator
              captures: { unit_id: $.data.id }
            - call: "POST /hydrotreating-units/${unit_id}/turnaround-windows"
              payload: { scope: "CATALYST_CHANGE", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-03T00:00:00Z" }
              as: PlantOperator
              captures: { win_id: $.data.id }
            - call: "POST /turnaround-windows/${win_id}/approvals"
              payload: {}
              as: PlantOperator
            - call: "POST /hydrotreating-units/${unit_id}/catalyst-charges"
              payload: { design_throughput_mt: 60000.0, installed_at: "2026-08-02T00:00:00Z" }
              as: PlantOperator
              captures: { charge_id: $.data.id }
            - call: "POST /processing-runs"
              payload: { unit_id: "${unit_id}", catalyst_charge_id: "${charge_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-06T00:00:00Z", target_saf_share_pct: 0.00 }
              as: PlantOperator
              captures: { run1_id: $.data.id }
          trigger:
            - call: "POST /processing-runs"
              payload: { unit_id: "${unit_id}", catalyst_charge_id: "${charge_id}", window_start: "2026-09-06T00:00:00Z", window_end: "2026-09-11T00:00:00Z", target_saf_share_pct: 0.00 }
              as: PlantOperator
              captures: { run2_id: $.data.id }
            - call: "POST /processing-runs"
              payload: { unit_id: "${unit_id}", catalyst_charge_id: "${charge_id}", window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-08T00:00:00Z", target_saf_share_pct: 0.00 }
              as: PlantOperator
            - call: "POST /processing-runs"
              payload: { unit_id: "${unit_id}", catalyst_charge_id: "${charge_id}", window_start: "2026-08-30T00:00:00Z", window_end: "2026-09-02T00:00:00Z", target_saf_share_pct: 0.00 }
              as: PlantOperator
          assert:
            - "First trigger call (touching run 1's end): response.status == 201"
            - "ProcessingRun.${run2_id}.status == PLANNED"
            - "ProcessingRun.${run2_id}.run_days == 5"
            - "Second trigger call (straddling the 09-06 boundary): response.status == 409 and response.error_id == ERR_UNIT_WINDOW_CONFLICT"
            - "Third trigger call (overlapping run 1's start): response.status == 409 and response.error_id == ERR_UNIT_WINDOW_CONFLICT"
            - "GET /processing-runs?unit_id=${unit_id} returns exactly 2 runs"

  - rule_id: compensating_invariant
    instances:
      - name: allocation_release_restores_lot_mass_and_unwinds_hydrogen_securement
        grounds:
          - state_machines.FeedstockAllocation.RESERVED_to_RELEASED
          - state_machines.ProcessingRun.HYDROGEN_SECURED_to_PLANNED
          - state_machines.HydrogenNomination.CONFIRMED_to_CANCELLED
          - calculations.blend_carbon_intensity
          - calculations.hydrogen_committed_capacity
          - endpoints["POST /feedstock-allocations/{id}/releases"]
        distinguishing_aspect: |
          Releasing the only allocation is the exact inverse of booking it, across four entities at once: the
          lot's allocated and remaining masses return to their pre-allocation values, the run's reserved mass
          returns to 0.000 with blend CI and hydrogen requirement back to null rather than to a stale number,
          the planned yield figures reset to 0.000, and the hydrogen nomination is cancelled so the contract's
          peak committed capacity returns to 0.0. Nothing is left holding a reservation anywhere.
        test_recipe:
          setup:
            - "HTU-1 with an approved catalyst-change window and one ACTIVE charge."
            - "A VERIFIED UCO supplier with one 500.000 MT ACCEPTED lot."
            - "A hydrogen contract with daily_capacity_kg 5000.0 over [2026-08-25, 2026-09-30] and one CONFIRMED nomination of 2600.0 kg/day over [2026-09-01, 2026-09-05]."
            - "A run over [2026-09-01, 2026-09-06) holding a single 400.000 MT RESERVED allocation, secured to HYDROGEN_SECURED with provisional_yield_pct 82.000 and planned_total_product_mt 328.000."
            - "Clock at the 2026-08-01T00:00:00Z default."
