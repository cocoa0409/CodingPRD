        distinguishing_aspect: "Permit is cyclic: DRAFT -> SUBMITTED -> DENIED -> SUBMITTED works through the same submit endpoint, and the resubmit clears denial_reason back to null while restamping submitted_at."
        test_recipe:
          setup: ["A DRAFT CRANE_PLACEMENT permit exists on a plan whose window_start is 2026-09-10T06:00:00Z, with the clock at the 2026-08-01T00:00:00Z default."]
