      - name: agency_segment_cost_rounds_half_up_on_a_half_cent
        claim_type: precision
        grounds:
          - calculations.assignment_labor_cost.precision
          - calculations.assignment_labor_cost.constants.POOL_MULTIPLIER_AGENCY
