          assert:
            - "${case_before} == 3.0 and the store reads only the HOLDING/MARKED_DOWN batches"
            - "${case_after} == 9.0, so the invariant case_on_hand_lbs == sum(produced_lbs over {HOLDING, MARKED_DOWN} batches) holds after the second production"
            - "${case_discarded} == 3.0, so the discard leg drove the conserved quantity back to its pre-production value"
            - "ProductionBatch.${ba2}.hold_status == DISCARDED and ProductionBatch.${ba2r}.hold_status == HOLDING with <code>rework_of_batch_id</code> set to ${ba2}"

      - name: bread_units_conserved_under_reserve_and_release
        grounds:
          - calculations.bread_forecast_coverage
          - entities.BreadSupplyOrder.fields.reserved_units
          - entities.BreadSupplyOrder.fields.unreserved_required_units
          - state_machines.SubTicket.bread_status_QUEUED_to_BREAD_HOLD
        distinguishing_aspect: "A roll quantity is conserved: BreadSupplyOrder reserved_units plus unreserved_required_units always equals committed_units of 720, checked at 0 + 720 before any ticket is ticketed, at 12 + 708 while one ticket is TICKETED, and back at 0 + 720 once that ticket is abandoned — a unit-count invariant, not a weight one."
