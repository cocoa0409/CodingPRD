# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_0462_climbing_gym_belay — breadth probe over §1.1–§1.7.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_member_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.Member, endpoints]
        distinguishing_aspect: "POST /members with full_name/email/date_of_birth -> 201; response carries id, status=ACTIVE, wallet_credit_cents=0, is_youth derived."
        test_recipe:
          setup: ["Empty DB; clock at default."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: GymAdmin
          trigger:
            - call: "POST /members"
              payload: { full_name: "New Person", email: "new@x.com", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
          assert:
            - "response code == 201"
            - "Member.${mem_id}.status == ACTIVE"
            - "Member.${mem_id}.wallet_credit_cents == 0"
            - "Member.${mem_id}.is_youth == false"

      - name: member_is_youth_true_for_minor_dob
        claim_type: Computed Fields
        grounds: [entities.Member.fields.is_youth]
        distinguishing_aspect: "is_youth is computed from date_of_birth vs created_at clock; DOB 2010-06-01 at clock 2026-06-01 (age 16) -> is_youth true."
        test_recipe:
          setup: ["Clock at 2026-06-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: GymAdmin
          trigger:
            - call: "POST /members"
              payload: { full_name: "Young One", email: "young@x.com", date_of_birth: "2010-06-01" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
          assert:
            - "Member.${mem_id}.is_youth == true"

      - name: get_member_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Member, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /members/{nonexistent-uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response code == 404"
            - "response error_id == ERR_NOT_FOUND"

      - name: create_member_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Member.fields.email, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /members omitting email -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { full_name: "No Email", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response code == 400"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: duplicate_member_email_returns_conflict
        claim_type: Type Constraints
        grounds: [entities.Member.fields.email, "errors[ERR_DUPLICATE_EMAIL]"]
        distinguishing_aspect: "Registering a second member with an already-used email -> ERR_DUPLICATE_EMAIL (409)."
        test_recipe:
          setup: ["One member registered with email dup@x.com."]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "First", email: "dup@x.com", date_of_birth: "1990-01-01" }
              as: FrontDesk
          trigger:
            - call: "POST /members"
              payload: { full_name: "Second", email: "dup@x.com", date_of_birth: "1991-01-01" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "response error_id == ERR_DUPLICATE_EMAIL"

      - name: waiver_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.Waiver]
        distinguishing_aspect: "Waiver is common_fields:false (id + created_at only); it has no version field and no update endpoint — only sign + read."
        test_recipe:
          setup: ["A member with one signed waiver."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /members"
              payload: { full_name: "Wai Ver", email: "wai@x.com", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /waivers"
              payload: { member_id: "${mem_id}" }
              as: FrontDesk
              captures: { w_id: $.data.id }
          trigger:
            - call: "GET /waivers/${w_id}"
              payload: {}
              as: FrontDesk
              captures: { w_status: $.data.status }
          assert:
            - "Waiver.${w_id}.status == VALID"
            - "Waiver response carries no version field"

      - name: waiver_minor_requires_guardian_name
        claim_type: Required Fields
        grounds: [entities.Waiver.fields.minor_guardian_name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Signing a waiver for a youth member without minor_guardian_name -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A youth member with no waiver."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /members"
              payload: { full_name: "Minor M", email: "minor@x.com", date_of_birth: "2012-06-01" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
          trigger:
            - call: "POST /waivers"
              payload: { member_id: "${mem_id}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response code == 400"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: route_difficulty_points_computed_on_create
        claim_type: Computed Fields
        grounds: [entities.Route.fields.difficulty_points, calculations.setter_monthly_points]
        distinguishing_aspect: "POST /routes grade=5 style=OVERHANG -> difficulty_points == round_half_up((100+250)*1.25) == 438; any client-supplied points ignored."
        test_recipe:
          setup: ["A facility to set a route on."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /facilities"
              payload: { name: "Route Wall", floor_capacity: 20, requires_belay_cert: false }
              as: GymAdmin
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /routes"
              payload: { facility_id: "${fac_id}", grade: 5, style: "OVERHANG" }
              as: RouteSetter
              as_user_id: "setter-1"
              captures: { route_id: $.data.id }
          assert:
            - "Route.${route_id}.difficulty_points == 438"
            - "Route.${route_id}.status == OPEN"

      - name: list_members_pagination_envelope
        claim_type: Listing
        grounds: [entities.Member, response_envelope]
        distinguishing_aspect: "GET /members returns an array with pagination meta total_count and has_more."
        test_recipe:
          setup: ["Two members registered."]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "L1", email: "l1@x.com", date_of_birth: "1990-01-01" }
              as: FrontDesk
            - call: "POST /members"
              payload: { full_name: "L2", email: "l2@x.com", date_of_birth: "1990-02-02" }
              as: FrontDesk
          trigger:
            - call: "GET /members"
              payload: { limit: 1, offset: 0 }
              as: FrontDesk
          assert:
            - "response_type == array"
            - "meta total_count == 2 and has_more == true"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: grade_already_passed_certification_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Certification.REGISTERED_to_PASSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Grading a certification already PASSED -> ERR_INVALID_STATE (409); only REGISTERED can be graded."
        test_recipe:
          setup: ["A PASSED BELAY certification."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /members"
              payload: { full_name: "Cert Done", email: "certdone@x.com", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /certifications"
              payload: { member_id: "${mem_id}", discipline: "BELAY" }
              as: Examiner
              captures: { cert_id: $.data.id }
            - call: "POST /certifications/${cert_id}/grade"
              payload: { knot: 90, commands: 85, catch: 70, lower: 95 }
              as: Examiner
          trigger:
            - call: "POST /certifications/${cert_id}/grade"
              payload: { knot: 100, commands: 100, catch: 100, lower: 100 }
              as: Examiner
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "response error_id == ERR_INVALID_STATE"
            - "Certification.${cert_id}.status == PASSED (unchanged)"

      - name: resume_active_membership_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Membership.FROZEN_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST resume on an ACTIVE (non-FROZEN) membership -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An ACTIVE BASIC membership."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /members"
              payload: { full_name: "Active M", email: "activem@x.com", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /memberships"
              payload: { member_id: "${mem_id}", plan_tier: "BASIC" }
              as: FrontDesk
              captures: { ms_id: $.data.id, ms_v: $.data.version }
          trigger:
            - call: "POST /memberships/${ms_id}/resume"
              payload: { expected_membership_version: "${ms_v}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: cancel_terminal_membership_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Membership.CURRENT_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling an already-CANCELLED membership -> ERR_INVALID_STATE; CANCELLED is terminal on the billing axis."
        test_recipe:
          setup: ["A CANCELLED membership."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /members"
              payload: { full_name: "Gone M", email: "gonem@x.com", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /memberships"
              payload: { member_id: "${mem_id}", plan_tier: "BASIC" }
              as: FrontDesk
              captures: { ms_id: $.data.id, ms_v1: $.data.version }
            - call: "POST /memberships/${ms_id}/cancel"
              payload: { expected_membership_version: "${ms_v1}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { ms_v2: $.data.version }
          trigger:
            - call: "POST /memberships/${ms_id}/cancel"
              payload: { expected_membership_version: "${ms_v2}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Membership.${ms_id}.billing_status == CANCELLED"

      - name: certification_refresh_status_to_expired_after_validity
        claim_type: Valid Transition
        grounds: [state_machines.Certification.PASSED_to_EXPIRED, entities.Certification.fields.expires_at]
        distinguishing_aspect: "A PASSED cert (passed_at 2026-06-01, expires_at 2027-06-01) refreshed at clock 2027-06-02 -> EXPIRED."
        test_recipe:
          setup: ["A PASSED BELAY cert, clock advanced past its expires_at (2027-06-01)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /members"
              payload: { full_name: "Exp M", email: "expm@x.com", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /certifications"
              payload: { member_id: "${mem_id}", discipline: "BELAY" }
              as: Examiner
              captures: { cert_id: $.data.id }
            - call: "POST /certifications/${cert_id}/grade"
              payload: { knot: 90, commands: 85, catch: 70, lower: 95 }
              as: Examiner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-02T00:00:00Z" }
              as: GymAdmin
          trigger:
            - call: "POST /certifications/${cert_id}/refresh-status"
              payload: {}
              as: FrontDesk
          assert:
            - "Certification.${cert_id}.status == EXPIRED"

      - name: refresh_status_before_expiry_is_no_op
        claim_type: Precondition Enforcement
        grounds: [state_machines.Certification.PASSED_to_EXPIRED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "refresh-status on a PASSED cert when clock < expires_at -> ERR_INVALID_STATE (boundary: 2027-05-31 < 2027-06-01)."
        test_recipe:
          setup: ["A PASSED BELAY cert (expires_at 2027-06-01), clock at 2027-05-31 (still valid)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /members"
              payload: { full_name: "Still Valid", email: "stillvalid@x.com", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /certifications"
              payload: { member_id: "${mem_id}", discipline: "BELAY" }
              as: Examiner
              captures: { cert_id: $.data.id }
            - call: "POST /certifications/${cert_id}/grade"
              payload: { knot: 90, commands: 85, catch: 70, lower: 95 }
              as: Examiner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-31T00:00:00Z" }
              as: GymAdmin
          trigger:
            - call: "POST /certifications/${cert_id}/refresh-status"
              payload: {}
              as: Examiner
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Certification.${cert_id}.status == PASSED"

      - name: strip_open_route_succeeds_and_retains_points
        claim_type: Valid Transition
        grounds: [state_machines.Route.OPEN_to_STRIPPED, entities.Route.fields.difficulty_points]
        distinguishing_aspect: "POST /routes/{id}/strip moves OPEN->STRIPPED; difficulty_points unchanged for historical aggregation."
        test_recipe:
          setup: ["An OPEN route grade 3 style ROOF (difficulty_points 375)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /facilities"
              payload: { name: "Strip Wall", floor_capacity: 10, requires_belay_cert: false }
              as: GymAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /routes"
              payload: { facility_id: "${fac_id}", grade: 3, style: "ROOF" }
              as: RouteSetter
              as_user_id: "setter-1"
              captures: { route_id: $.data.id, route_v: $.data.version }
          trigger:
            - call: "POST /routes/${route_id}/strip"
              payload: { expected_route_version: "${route_v}" }
              as: RouteSetter
              as_user_id: "setter-1"
          assert:
            - "Route.${route_id}.status == STRIPPED"
            - "Route.${route_id}.difficulty_points == 375"

      - name: enrollment_withdraw_decrements_count
        claim_type: Side Effect Execution
        grounds: [state_machines.Enrollment.ENROLLED_to_WITHDRAWN, entities.Clinic.fields.enrolled_count]
        distinguishing_aspect: "Withdrawing the only enrollment moves it to WITHDRAWN and recomputes Clinic.enrolled_count to 0, bumping Clinic.version."
        test_recipe:
          setup: ["A clinic with one ENROLLED member (enrolled_count 1)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /members"
              payload: { full_name: "With Draw", email: "withdraw@x.com", date_of_birth: "2009-01-01" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /clinics"
              payload: { title: "Withdraw Clinic", starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T11:00:00Z", seat_capacity: 5 }
              as: GymAdmin
              captures: { cl_id: $.data.id, cl_v0: $.data.version }
            - call: "POST /enrollments"
              payload: { clinic_id: "${cl_id}", member_id: "${mem_id}", expected_clinic_version: "${cl_v0}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { en_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${en_id}/withdraw"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
          assert:
            - "Enrollment.${en_id}.status == WITHDRAWN"
            - "Clinic.${cl_id}.enrolled_count == 0"

      - name: incident_resolve_open_to_resolved
        claim_type: Valid Transition
        grounds: [state_machines.Incident.OPEN_to_RESOLVED]
        distinguishing_aspect: "POST /incidents/{id}/resolve on an OPEN MINOR incident -> RESOLVED with no cascade."
        test_recipe:
          setup: ["An OPEN MINOR incident."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /members"
              payload: { full_name: "Inc M", email: "incm@x.com", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /facilities"
              payload: { name: "Inc Wall", floor_capacity: 10, requires_belay_cert: false }
              as: GymAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /incidents"
              payload: { member_id: "${mem_id}", facility_id: "${fac_id}", severity: "MINOR", description: "Scraped knee" }
              as: GymAdmin
              captures: { inc_id: $.data.id }
          trigger:
            - call: "POST /incidents/${inc_id}/resolve"
              payload: {}
              as: GymAdmin
          assert:
            - "Incident.${inc_id}.status == RESOLVED"

      - name: membership_cancel_withdraws_active_enrollments
        claim_type: Side Effect Execution
        grounds: [state_machines.Membership.CURRENT_to_CANCELLED, state_machines.Enrollment.ENROLLED_to_WITHDRAWN]
        distinguishing_aspect: "Cancelling a membership withdraws the member's ENROLLED enrollments (cascade), recomputing Clinic.enrolled_count."
        test_recipe:
          setup: ["A member with an ACTIVE membership and one ENROLLED clinic seat."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /members"
              payload: { full_name: "Casc M", email: "cascm@x.com", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /memberships"
              payload: { member_id: "${mem_id}", plan_tier: "BASIC" }
              as: FrontDesk
              captures: { ms_id: $.data.id, ms_v: $.data.version }
            - call: "POST /clinics"
              payload: { title: "Casc Clinic", starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T11:00:00Z", seat_capacity: 5 }
              as: GymAdmin
              captures: { cl_id: $.data.id, cl_v0: $.data.version }
            - call: "POST /enrollments"
              payload: { clinic_id: "${cl_id}", member_id: "${mem_id}", expected_clinic_version: "${cl_v0}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { en_id: $.data.id }
          trigger:
            - call: "POST /memberships/${ms_id}/cancel"
              payload: { expected_membership_version: "${ms_v}" }
              as: Member
              as_user_id: "${mem_id}"
          assert:
            - "Membership.${ms_id}.access_status == TERMINATED"
            - "Enrollment.${en_id}.status == WITHDRAWN"
            - "Clinic.${cl_id}.enrolled_count == 0"

      - name: past_due_back_payment_restores_suspended_access
        claim_type: Side Effect Execution
        grounds: [state_machines.Membership.PAST_DUE_to_CURRENT, state_machines.Membership.ACTIVE_to_SUSPENDED]
        distinguishing_aspect: "A SUSPENDED+PAST_DUE membership that receives a SUCCEEDED back-payment returns billing_status CURRENT AND restores access_status ACTIVE (cross-axis recovery)."
        test_recipe:
          setup: ["A membership PAST_DUE since 2026-06-01 and SUSPENDED via grace sweep at 2026-06-08."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /members"
              payload: { full_name: "Recover M", email: "recoverm@x.com", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /memberships"
              payload: { member_id: "${mem_id}", plan_tier: "BASIC" }
              as: FrontDesk
              captures: { ms_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /memberships/${ms_id}/run-billing"
              payload: { outcome: "FAILED" }
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-08T00:00:00Z" }
              as: GymAdmin
            - call: "POST /memberships/${ms_id}/run-billing"
              payload: { outcome: "SWEEP" }
              as: FrontDesk
          trigger:
            - call: "POST /memberships/${ms_id}/run-billing"
              payload: { outcome: "SUCCEEDED" }
              as: FrontDesk
          assert:
            - "Membership.${ms_id}.billing_status == CURRENT"
            - "Membership.${ms_id}.access_status == ACTIVE"

  # ===========================================================================
  - section: calculations
    instances:
      - name: day_pass_price_adult_no_gear_base_only
        claim_type: Correct Result
