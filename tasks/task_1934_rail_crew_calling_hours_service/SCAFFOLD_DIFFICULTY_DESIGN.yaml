          assert:
            - "captured err == ERR_INVALID_STATE (state p5 beats safety p6 even though the month projection 16081+480=16561 would also breach the cap)"
            - "HTTP status == 409"

      - name: temporal_vs_referential_on_leave_bid_and_pay_create
        grounds:
          - validations[priority=9]
          - validations[priority=12]
        distinguishing_aspect: |
          Category pair business_temporal (p9, ERR_TEMPORAL_WINDOW) vs
          business_referential (p12, ERR_REFERENTIAL_MISMATCH): a PayRecord
          create carrying claimed_minutes=0 is a fiscal/format issue — instead
          this pair is exercised on two endpoints: (1) leave-bid create with
          start_date after end_date (temporal) beats nothing else, while
          (2) extra-board slot create for an employee of the wrong craft
          (referential) — the pair is exercised jointly on slot creation vs a
          bid whose window is inverted: the slot endpoint has no temporal
          rule, so the conflict is shown on leave award where an AWARDED
          overlap (constraint p9) is reported before referential; the pinned
          observable is that an inverted-window bid is rejected with
          ERR_TEMPORAL_WINDOW at CREATE time even when the employee exists and
          is otherwise eligible, while a wrong-craft slot is rejected with
          ERR_REFERENTIAL_MISMATCH — different pairs, different errors.
        test_recipe:
          setup:
