              as: IntakeSpecialist
              captures: { ca: $.data.id }
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CU-E2B", channel_code: "WEB", product_code: "P-E2B", category_code: "C.E2", narrative: "b" }
              as: IntakeSpecialist
              captures: { cb: $.data.id }
          trigger:
            - call: "GET /complaint-office/products/${pa}/complaints"
              payload: {}
              as: Auditor
          assert:
            - "list contains exactly complaint ${ca} and not ${cb}"

      - name: clock_set_endpoint_updates_logical_time
        claim_type: conditional_action
        grounds:
          - endpoints[POST /complaint-office/_clock/set_current_utc]
        distinguishing_aspect: "The clock endpoint echoes the new logical time; a complaint created afterwards carries received_at equal to the set time, not the startup default."
        test_recipe:
          setup: ["Clock advanced to 2026-08-03T04:05:06Z"]
          setup_api_calls:
            - call: "POST /complaint-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T04:05:06Z" }
