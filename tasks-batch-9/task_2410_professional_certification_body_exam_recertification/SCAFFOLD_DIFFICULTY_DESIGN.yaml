              as: EligibilityReviewer
              as_user_id: "elr-2"
            - call: "POST /programs"
              payload: { name: "Certified Practitioner Y", credential_code: "CPY", jta_version: "JTA-2026.1", domain_specs: [{ domain_code: "D1", weight_pct: 100, min_operational_items: 1 }], form_length: 1, accepted_education_credentials: ["BACHELOR"], psychometric_stat_basis: "POOLED", min_panelists: 1, panel_trim_count: 0, audit_every_nth: 7, cycle_length_months: 12, required_ceu_credits: 12, ceu_credit_accrual_basis: "STRICT_CYCLE" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { progB_id: $.data.id }
            - call: "POST /programs/${progB_id}/activate"
              payload: { activation_note: "strict-cycle programme" }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /items"
              payload: { program_id: "${progB_id}", domain_code: "D1", cognitive_level: "APPLICATION", stem: "CPY operational item" }
              as: ItemSpecialist
              as_user_id: "isp-author"
              captures: { itemB_id: $.data.id }
            - call: "POST /items/${itemB_id}/submit-for-review"
              payload: { revision_note: "first submission" }
              as: ItemSpecialist
              as_user_id: "isp-author"
            - call: "POST /items/${itemB_id}/review"
              payload: { decision: "APPROVE" }
              as: ItemSpecialist
              as_user_id: "isp-rev-1"
            - call: "POST /items/${itemB_id}/review"
              payload: { decision: "APPROVE" }
              as: ItemSpecialist
              as_user_id: "isp-rev-2"
            - call: "POST /items/${itemB_id}/response-batches"
              payload: { is_pretest: true, response_count: 40, correct_count: 24, upper_n: 10, upper_correct: 9, lower_n: 10, lower_correct: 3 }
              as: Psychometrician
              as_user_id: "psy-1"
            - call: "POST /forms"
              payload: { program_id: "${progB_id}", form_code: "FB1", item_ids: ["${itemB_id}"], panelist_user_ids: ["pan-1"], panel_method: "MODIFIED_ANGOFF" }
