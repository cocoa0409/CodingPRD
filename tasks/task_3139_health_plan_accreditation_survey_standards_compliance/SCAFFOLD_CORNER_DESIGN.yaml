            - call: "POST /accreditation/file-review-samples/${smp_u}/score"
              payload: {}
              as: AccreditationOfficer
              captures: { e_notsub: $.data.error_id }
            - call: "POST /accreditation/file-review-samples/${smp_u}/cases"
              payload: { case_reference: "U6", service_date: "2025-06-01T00:00:00Z", decision_date: "2025-06-02T00:00:00Z", resolution_date: "2025-06-02T00:00:00Z", required_turnaround_days: 30 }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
              captures: { e_caseopen: $.data.error_id }
            - call: "POST /accreditation/applications/${app3}/submit"
              payload: { expected_application_version: "${app3_v}" }
              as: PlanCoordinator
              as_user_id: "${plan2}"
              captures: { e_draft: $.data.error_id }
            - call: "POST /accreditation/evidence-items/${ev1}/resubmit"
              payload: {}
              as: PlanCoordinator
              as_user_id: "${plan_id}"
              captures: { e_resub: $.data.error_id }
            - call: "POST /accreditation/survey-sessions/${session_id}/cancel"
              payload: {}
              as: AccreditationOfficer
              captures: { e_sessc: $.data.error_id }
            - call: "POST /accreditation/annual-reports/00000000-0000-4000-8000-000000000031/submit"
              payload: {}
              as: PlanCoordinator
              as_user_id: "${plan_id}"
              captures: { e_rep: $.data.error_id }
            - call: "POST /accreditation/health-plans/${plan2}/retire"
              payload: {}
              as: PlatformAdmin
              captures: { e_ret: $.data.error_id }
            - call: "POST /accreditation/surveys/${rs_u}/cancel"
              payload: {}
              as: AccreditationOfficer
            - call: "GET /accreditation/applications/${app_id}"
              payload: {}
              as: AccreditationOfficer
              captures: { app_v7u: $.data.version }
            - call: "POST /accreditation/applications/${app_id}/surveys"
              payload: { survey_type: "RESURVEY", mode: "VIRTUAL", start_date: "2026-11-16", end_date: "2026-11-20", budgeted_surveyor_hours: 4, expected_application_version: "${app_v7u}" }
              as: AccreditationOfficer
