        distinguishing_aspect: |
          A four-hop chain from one apply call: analysis -> Property.current_utility_allowance_cents
          (11500 -> 12535) -> two new UA_ADJUSTMENT TenantCertifications with recomputed
          hap_cents (84500 -> 85535 and 127000 -> 128035) and the two predecessors flipped to
          SUPERSEDED -> TenantHousehold.current_hap_cents on both households -> the September
