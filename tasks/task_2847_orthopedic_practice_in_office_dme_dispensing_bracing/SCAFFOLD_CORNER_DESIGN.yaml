            - "${par_3_posture_now} == OK: shelf 3 was never touched by either dispense"
            - "${err_hold} == ERR_COMPLIANCE_HOLD_ACTIVE with HTTP 409 on the RESERVED sibling encounter"
            - "${enc_c_hold} == true, ${enc_c_reason} == CLINIC_SUSPENDED and ${enc_c_clinical} == RESERVED"
            - "${err_suspended} == ERR_CLINIC_DISPENSING_SUSPENDED with HTTP 409 for a new reservation on the healthy shelf 3, so the clinic posture is consulted even when the targeted shelf is OK"
            - "${par_2_posture_restored} == OK and ${clinic_count_restored} == 1, so ${clinic_status_restored} == RESTRICTED"
            - "${enc_c_hold_cleared} == false and ${enc_c_reason_cleared} == null: the hold was released by the recount, with no explicit clearing call"
            - "the repeated fitting now returns HTTP 201 with ${fit_c_minutes} == 30 and encounter ${enc_c_id} in clinical_status FITTED"

      - name: corner_priority_state_check_precedes_accreditation_check
        claim_type: Priority conflict
        grounds:
          - validations[priority=20]
          - validations[priority=28]
        excluded_because:
          difficulty_instance: state_beats_accreditation_on_second_medical_necessity_note_rejected
          rationale: "That §1.8 instance violates the clinical-state rule (priority 20) and the accreditation rule (priority 28) with one request and asserts ERR_INVALID_CLINICAL_STATE, which is exactly this priority-conflict claim at depth."

      - name: corner_priority_authorization_precedes_existence
        claim_type: Priority conflict
        grounds:
          - validations[priority=3]
          - validations[priority=13]
        excluded_because:
          difficulty_instance: unauthorized_beats_encounter_not_found_on_reservation_rejected
          rationale: "That §1.8 instance sends a reservation for a non-existent encounter id under a role that may not reserve at all and asserts 403 ERR_UNAUTHORIZED, proving the auth band (priorities 1-4) is decided before any existence lookup."

      - name: corner_priority_credential_precedes_slot_conflict
        claim_type: Priority conflict
        grounds:
          - validations[priority=36]
          - validations[priority=52]
        excluded_because:
          difficulty_instance: fitter_credential_beats_slot_conflict_on_fitting_record_rejected
          rationale: "That §1.8 instance books a fitting that both overlaps the fitter's existing chair time and is performed on an expired credential, and asserts ERR_FITTER_CREDENTIAL_EXPIRED, the lower priority number."

      - name: corner_fitting_chair_buffer_conflict_detection
        claim_type: Temporal validation
        grounds:
          - validations[priority=52]
          - errors[ERR_FITTING_SLOT_CONFLICT]
        excluded_because:
          difficulty_instance: fitter_chair_closed_interval_with_fifteen_minute_changeover_buffer_rejected
          rationale: "That §1.8 instance walks the closed-interval-plus-15-minute-buffer rule across touching endpoints, an exactly-15-minute gap and a 16-minute gap, which is the whole temporal-conflict surface of priority 52."

      - name: corner_patient_lifetime_entitlement_is_scoped
        claim_type: Aggregate validation
        grounds:
          - validations[priority=42]
          - calculations.same_or_similar_lookback
        excluded_because:
          difficulty_instance: patient_lifetime_entitlement_window_is_scoped_per_patient_and_group_rejected
          rationale: "That §1.8 instance shows the entitlement window is keyed on (patient, same_or_similar_group) -- a different patient and a different group both escape the conflict while the matching pair is refused -- which covers the aggregate reading of priority 42."

      - name: corner_supplier_state_gates_the_fabrication_route
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=29]
          - validations[priority=30]
        excluded_because:
          difficulty_instance: custom_fab_order_blocked_while_supplier_quality_hold_active_rejected
          rationale: "That §1.8 instance and its sibling fab_order_acceptance_blocked_when_supplier_standards_withdrawn_rejected both turn on Supplier state that the request never names, covering priorities 29 and 30 in both directions."

      - name: corner_cascading_fab_order_check_precedes_fitting
        claim_type: Cascading validation
        grounds:
          - validations[priority=24]
        excluded_because:
          difficulty_instance: awaiting_device_fitting_blocked_until_fab_order_accepted_rejected
          rationale: "That §1.8 instance shows the fitting endpoint running the fab-order guard first -- the encounter's own clinical state is legal, but the check that depends on another entity's state has to run before the fitting is booked."

  - section: endpoints
    instances:
      - name: corner_clinic_and_roster_create_read_list_round_trip
        claim_type: Standard CRUD
        grounds:
          - endpoints[POST /dme/clinics]
          - endpoints[GET /dme/clinics/{id}]
          - endpoints[POST /dme/clinics/{id}/physicians]
          - endpoints[GET /dme/clinics/{id}/physicians]
          - entities.Clinic
          - entities.Physician
        distinguishing_aspect: |
          The create-read-list triangle has to agree on three separate things:
          the six input fields must come back verbatim, the two computed fields
          must be seeded (ACTIVE / 0) even though no shelf exists yet, and the
          nested list must scope strictly to the path clinic while honouring the
          specialty filter and the limit/offset defaults. The list is also the
          only reverse route to Physician.clinic_id, so a physician created
          under clinic A must be invisible from clinic B's roster.
        test_recipe:
          setup:
            - "two clinics; three physicians on the first clinic (two SPINE, one HAND) and none on the second"
          setup_api_calls:
            - call: "POST /dme/clinics"
              payload: { name: "Riverbend Orthopedics", state_code: "OH", accreditation_body: "BOC", accreditation_expires_on: "2027-06-30", ioas_supervision_level: "GENERAL", dispensing_specialties: ["SPINE", "HAND"] }
              as: PracticeAdmin
              captures: { clinic_a_id: $.data.id, clinic_a_status: $.data.dispensing_status, clinic_a_count: $.data.stockout_par_level_count, clinic_a_version: $.data.version }
            - call: "POST /dme/clinics"
              payload: { name: "Eastgate Orthopedics", state_code: "KY", accreditation_body: "ABC", accreditation_expires_on: "2027-09-30", ioas_supervision_level: "DIRECT", dispensing_specialties: ["SPINE"] }
              as: PracticeAdmin
              captures: { clinic_b_id: $.data.id }
            - call: "POST /dme/clinics/${clinic_a_id}/physicians"
              payload: { full_name: "Rue Hallam", npi: "1700000401", specialty: "SPINE", group_member: true, stark_disclosure_on_file: true }
              as: PracticeAdmin
              captures: { phys_1_id: $.data.id, phys_1_clinic: $.data.clinic_id }
            - call: "POST /dme/clinics/${clinic_a_id}/physicians"
              payload: { full_name: "Sol Ferrar", npi: "1700000402", specialty: "SPINE" }
              as: PracticeAdmin
              captures: { phys_2_id: $.data.id, phys_2_group: $.data.group_member, phys_2_stark: $.data.stark_disclosure_on_file }
            - call: "POST /dme/clinics/${clinic_a_id}/physicians"
              payload: { full_name: "Wren Okada", npi: "1700000403", specialty: "HAND", group_member: true, stark_disclosure_on_file: true }
              as: PracticeAdmin
              captures: { phys_3_id: $.data.id }
          trigger:
            - call: "GET /dme/clinics/${clinic_a_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { read_name: $.data.name, read_state: $.data.state_code, read_body: $.data.accreditation_body, read_expires: $.data.accreditation_expires_on, read_ioas: $.data.ioas_supervision_level, read_specialties: $.data.dispensing_specialties, read_status: $.data.dispensing_status, read_count: $.data.stockout_par_level_count }
            - call: "GET /dme/clinics/${clinic_a_id}/physicians"
              payload: {}
              as: PracticeAdmin
            - call: "GET /dme/clinics/${clinic_a_id}/physicians"
              payload: { specialty: "SPINE" }
              as: PracticeAdmin
            - call: "GET /dme/clinics/${clinic_a_id}/physicians"
              payload: { specialty: "SPINE", limit: 1, offset: 1 }
              as: OrthoPhysician
              as_user_id: "${phys_1_id}"
            - call: "GET /dme/clinics/${clinic_b_id}/physicians"
              payload: {}
              as: PracticeAdmin
          assert:
            - "the create response is HTTP 201 and echoes every input field: ${read_name} == 'Riverbend Orthopedics', ${read_state} == OH, ${read_body} == BOC, ${read_expires} == 2027-06-30, ${read_ioas} == GENERAL, ${read_specialties} == [SPINE, HAND]"
            - "${clinic_a_status} == ACTIVE, ${clinic_a_count} == 0 and ${clinic_a_version} == 1 on the create response: the computed posture is seeded before any shelf exists"
            - "the read response repeats the computed pair unchanged: ${read_status} == ACTIVE and ${read_count} == 0"
            - "${phys_1_clinic} == ${clinic_a_id}: clinic_id is taken from the path, not the body"
            - "${phys_2_group} == true and ${phys_2_stark} == false: the two omitted booleans take their declared defaults, which are NOT the same value"
            - "the unfiltered roster list returns 3 rows with total_count == 3, limit == 10, offset == 0 and has_more == false"
            - "the SPINE-filtered list returns exactly ${phys_1_id} and ${phys_2_id} with total_count == 2 and has_more == false"
            - "the SPINE-filtered page with limit 1 / offset 1 returns exactly 1 row, total_count == 2 and has_more == false"
            - "clinic B's roster returns 0 rows with total_count == 0: rosters do not leak across clinics"

      - name: corner_standards_attestation_action_toggles_supplier_posture
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /dme/suppliers/{id}/standards-attestation]
          - entities.Supplier
          - state_machines.Supplier
        distinguishing_aspect: |
          The attestation endpoint is a partial-update action with one optional
          field: dmepos_standards_attested and quality_hold are always applied,
          while accreditation_expires_on is applied only when present and left
          alone when omitted. It is also the only writer of quality_hold, so a
          supplier created with quality_hold true and then cleared through this
          endpoint must show version 1 -> 2 -> 3, and the two computed supplier
          fields (turnaround_score 100, accepted_fab_order_count 0) must survive
          both writes untouched because no fabrication order was ever accepted.
        test_recipe:
          setup:
            - "one supplier registered with standards attested and no quality hold"
          setup_api_calls:
            - call: "POST /dme/suppliers"
              payload: { name: "Cardinal Central Fab", accreditation_body: "ABC", accreditation_expires_on: "2027-03-31", promised_turnaround_days: 12, dmepos_standards_attested: true, custom_fab_capable: true, quality_hold: false }
              as: PracticeAdmin
              captures: { supplier_id: $.data.id, sup_v1: $.data.version, sup_score: $.data.turnaround_score, sup_accepted: $.data.accepted_fab_order_count }
          trigger:
            - call: "POST /dme/suppliers/${supplier_id}/standards-attestation"
              payload: { dmepos_standards_attested: false, quality_hold: true }
              as: ComplianceOfficer
              captures: { att_1_attested: $.data.dmepos_standards_attested, att_1_hold: $.data.quality_hold, att_1_expires: $.data.accreditation_expires_on, att_1_v: $.data.version, att_1_score: $.data.turnaround_score, att_1_accepted: $.data.accepted_fab_order_count, att_1_capable: $.data.custom_fab_capable }
            - call: "POST /dme/suppliers/${supplier_id}/standards-attestation"
              payload: { dmepos_standards_attested: true, quality_hold: false, accreditation_expires_on: "2028-03-31" }
              as: ComplianceOfficer
              captures: { att_2_attested: $.data.dmepos_standards_attested, att_2_hold: $.data.quality_hold, att_2_expires: $.data.accreditation_expires_on, att_2_v: $.data.version }
            - call: "GET /dme/suppliers/${supplier_id}"
              payload: {}
              as: InventoryManager
              captures: { read_attested: $.data.dmepos_standards_attested, read_hold: $.data.quality_hold, read_expires: $.data.accreditation_expires_on, read_promised: $.data.promised_turnaround_days }
          assert:
            - "the action returns HTTP 200 (not 201): it updates an existing supplier"
            - "${sup_v1} == 1, ${att_1_v} == 2 and ${att_2_v} == 3: every attestation write bumps the version exactly once"
            - "${att_1_attested} == false and ${att_1_hold} == true"
            - "${att_1_expires} == 2027-03-31: the optional accreditation date was omitted, so it is left alone rather than nulled"
            - "${att_2_attested} == true, ${att_2_hold} == false and ${att_2_expires} == 2028-03-31: the optional field is applied when supplied"
            - "${att_1_capable} == true: custom_fab_capable is not writable through this endpoint and is unchanged"
            - "${sup_score} == 100, ${att_1_score} == 100, ${att_1_accepted} == 0 and ${att_2_v} confirms the computed pair is never disturbed by an attestation"
            - "the read-back agrees with the last write: ${read_attested} == true, ${read_hold} == false, ${read_expires} == 2028-03-31, ${read_promised} == 12"

      - name: corner_custom_fab_order_links_encounter_and_supplier
        claim_type: Cross-reference link
        grounds:
          - endpoints[POST /dme/encounters/{id}/custom-fab-orders]
          - endpoints[GET /dme/custom-fab-orders]
          - entities.CustomFabOrder
        distinguishing_aspect: |
          The fabrication order is the junction row of the graph topology: one
          side comes from the path (encounter_id) and the other from the body
          (supplier_id), and both must be resolvable before the row is written.
          The link is only useful if it is navigable from BOTH ends, so the same
          order has to appear when the collection is filtered by encounter_id
          and when it is filtered by supplier_id, and must NOT appear under a
          second, equally valid supplier that was never named. Submission also
          snapshots the promised turnaround off the supplier and derives the
          promised delivery date from the logical clock, so the junction row
          carries data neither of its two parents holds.
        test_recipe:
          setup:
            - "a HAND clinic with a physician and a fitter privileged for custom work, a patient, two custom-fab-capable suppliers with DIFFERENT promised turnarounds, and a CUSTOM_FABRICATED product from the first supplier"
            - "one encounter documented with a medical necessity note, ready to place a fabrication order"
          setup_api_calls:
            - call: "POST /dme/clinics"
              payload: { name: "Hand Center", state_code: "OH", accreditation_body: "ABC", accreditation_expires_on: "2027-06-30", ioas_supervision_level: "DIRECT", dispensing_specialties: ["HAND"] }
              as: PracticeAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /dme/clinics/${clinic_id}/physicians"
              payload: { full_name: "Ines Barr", npi: "1700000411", specialty: "HAND", group_member: true, stark_disclosure_on_file: true }
              as: PracticeAdmin
              captures: { phys_id: $.data.id }
            - call: "POST /dme/clinics/${clinic_id}/fitters"
              payload: { full_name: "Nils Aro", credential: "CPO", credential_expires_on: "2027-12-31", privilege_scope: "ALL_DEVICES" }
              as: PracticeAdmin
              captures: { fitter_id: $.data.id }
            - call: "POST /dme/clinics/${clinic_id}/patients"
              payload: { full_name: "Elle Pike", dob: "1974-05-19", payer_type: "COMMERCIAL", member_id: "CM-411", medicare_beneficiary: false }
              as: PracticeAdmin
              captures: { patient_id: $.data.id }
            - call: "POST /dme/suppliers"
              payload: { name: "Fab One", accreditation_body: "ABC", accreditation_expires_on: "2027-12-31", promised_turnaround_days: 10, dmepos_standards_attested: true, custom_fab_capable: true, quality_hold: false }
              as: PracticeAdmin
              captures: { supplier_1_id: $.data.id }
            - call: "POST /dme/suppliers"
              payload: { name: "Fab Two", accreditation_body: "BOC", accreditation_expires_on: "2027-12-31", promised_turnaround_days: 25, dmepos_standards_attested: true, custom_fab_capable: true, quality_hold: false }
              as: PracticeAdmin
              captures: { supplier_2_id: $.data.id }
            - call: "POST /dme/products"
              payload: { supplier_id: "${supplier_1_id}", hcpcs_code: "L3808", description: "Custom wrist-hand orthosis", category: "CUSTOM_FABRICATED", specialty: "HAND", same_or_similar_group: "WHO_CUSTOM", reasonable_useful_lifetime_months: 36, allowed_amount_cents: 42000, cash_price_cents: 24000, unit_cost_cents: 15000, requires_prior_auth: false, ioas_supervision_required: "DIRECT" }
              as: InventoryManager
              captures: { product_id: $.data.id }
            - call: "POST /dme/encounters"
              payload: { clinic_id: "${clinic_id}", patient_id: "${patient_id}", product_id: "${product_id}", ordering_physician_id: "${phys_id}", quantity: 1 }
              as: PracticeAdmin
              captures: { enc_id: $.data.id, enc_v1: $.data.version }
            - call: "POST /dme/encounters/${enc_id}/medical-necessity-note"
              payload: { mn_diagnosis_code: "M18.11", mn_functional_deficit: "thumb CMC instability, cannot grip", mn_expected_duration_months: 12 }
              as: OrthoPhysician
              as_user_id: "${phys_id}"
              captures: { enc_v2: $.data.version }
          trigger:
            - call: "POST /dme/encounters/${enc_id}/custom-fab-orders"
              payload: { supplier_id: "${supplier_2_id}" }
              as: DmeFitter
              as_user_id: "${fitter_id}"
              captures: { fab_id: $.data.id, fab_enc: $.data.encounter_id, fab_sup: $.data.supplier_id, fab_status: $.data.status, fab_submitted: $.data.submitted_at, fab_promised_on: $.data.promised_delivery_on, fab_snapshot: $.data.promised_turnaround_days_snapshot, fab_rounds: $.data.adjustment_rounds, fab_first: $.data.first_delivered_at, fab_score: $.data.projected_turnaround_score, fab_v: $.data.version }
            - call: "GET /dme/custom-fab-orders"
              payload: { encounter_id: "${enc_id}" }
              as: InventoryManager
            - call: "GET /dme/custom-fab-orders"
              payload: { supplier_id: "${supplier_2_id}", status: "SUBMITTED" }
              as: InventoryManager
            - call: "GET /dme/custom-fab-orders"
              payload: { supplier_id: "${supplier_1_id}" }
              as: InventoryManager
            - call: "GET /dme/encounters/${enc_id}"
              payload: {}
              as: PracticeAdmin
              captures: { enc_clinical: $.data.clinical_status, enc_financial: $.data.financial_status, enc_v3: $.data.version }
          assert:
            - "the order is created 201 with ${fab_enc} == ${enc_id} (from the path) and ${fab_sup} == ${supplier_2_id} (from the body), so the junction row wires the two ends independently"
            - "${fab_status} == SUBMITTED and ${fab_v} == 1"
            - "${fab_submitted} == 2026-08-01T00:00:00Z: submitted_at is stamped from the logical clock, not from a request field"
            - "${fab_snapshot} == 25 and ${fab_promised_on} == 2026-08-26: the snapshot follows the NAMED supplier (25 days), not the product's own supplier (10 days), and the promised date is submitted_at's date plus the snapshot"
            - "${fab_rounds} == 0, ${fab_first} == null and ${fab_score} == null on a freshly submitted order"
            - "the encounter_id-filtered list returns total_count 1 containing ${fab_id}"
            - "the supplier_2 + SUBMITTED filtered list returns total_count 1 containing ${fab_id}: the link is navigable from the supplier end too"
            - "the supplier_1-filtered list returns total_count 0: the product's supplier is not implicitly the fabricator"
            - "${enc_clinical} == AWAITING_DEVICE while ${enc_financial} == UNVERIFIED, and ${enc_v1} == 1 < ${enc_v2} == 2 < ${enc_v3} == 3"

      - name: corner_dispensing_summary_computed_read_reports_every_declared_field
        claim_type: Computed read
        grounds:
          - endpoints[GET /dme/clinics/{id}/dispensing-summary]
          - calculations.clinic_dispensing_posture
          - calculations.restock_refund_split
        distinguishing_aspect: |
          The summary declares fourteen fields and every one of them is derived
          at read time, so the endpoint is only correct if all fourteen agree
          with each other at the same instant. The interesting reading is after
          a SELLABLE restock: the unit is back on the shelf AND still counted as
          dispensed, so units_accounted_total only reconciles to
          units_received_total because units_restocked_total is subtracted --
          an implementation that "un-dispenses" a restocked unit passes the
          on-hand check and fails the invariant. On the cash side the refund
          does not erase gross_charged_cents, so net_cash_position_cents lands
          exactly on restock_fee_retained_cents.
        test_recipe:
