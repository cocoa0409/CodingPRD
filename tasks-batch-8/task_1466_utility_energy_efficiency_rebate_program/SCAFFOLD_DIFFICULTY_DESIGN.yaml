          setup:
            - "OPEN ProgramYear; first application SUBMITTED with service_address='1 Main St', invoice_date='2026-06-01'"
            - "Second application submitted with same service_address, invoice_date='2026-06-01' (same day — excluded from half-open window)"
            - "Third application submitted with same service_address, invoice_date='2026-06-15' (window [2026-05-16, 2026-06-15); includes 2026-06-01)"
