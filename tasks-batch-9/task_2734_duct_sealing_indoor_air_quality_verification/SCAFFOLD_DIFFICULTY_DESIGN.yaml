              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/seal-jobs/${job_id}/leakage-samples"
              payload: { sample_seq: 4, elapsed_seconds: 720, instantaneous_leakage_cfm: 55.0, injection_pressure_pa: 740.0 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/seal-jobs/${job_id}/complete-seal"
              payload: { sealant_lbs_used: 3.2 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/leakage-tests"
              payload: { duct_system_id: "${ds1_id}", phase: "POST", method: "DUCT_BLASTER", window_start_at: "2026-08-02T19:00:00Z", window_end_at: "2026-08-02T20:00:00Z" }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { post1_id: $.data.id }
            - call: "POST /duct-sealing/leakage-tests/${post1_id}/pressurize"
              payload: { test_pressure_pa: 25.0, fan_ring_config: "RING_2", masked_register_count: 9 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/leakage-tests/${post1_id}/record"
              payload: { measured_leakage_cfm: 55.0, ambient_temp_f: 79.0 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/leakage-tests/${post1_id}/review"
              payload: { decision: "ACCEPT", review_note: "post-seal measurement accepted" }
              as: QAVerifier
              as_user_id: "qa-1"
            - call: "POST /duct-sealing/projects/${proj_id}/combustion-tests"
              payload: { appliance_label: "WH-1", appliance_type: "ATMOSPHERIC_WATER_HEATER", phase: "POST", spillage_seconds: 8, co_ppm_air_free: 14.0, draft_pressure_pa: 2.7, worst_case_depressurization_pa: 2.8 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "GET /duct-sealing/seal-jobs/${job_id}"
              as: QAVerifier
              as_user_id: "qa-1"
              captures: { job_v: $.data.version }
            - call: "POST /duct-sealing/verification-reports"
              payload: { seal_job_id: "${job_id}", post_test_id: "${post1_id}", expected_seal_job_version: "${job_v}" }
              as: QAVerifier
              as_user_id: "qa-1"
              captures: { report_id: $.data.id }
            - call: "POST /duct-sealing/verification-reports/${report_id}/issue"
              payload: { signature_note: "guarantee verified" }
              as: QAVerifier
              as_user_id: "qa-1"
            - call: "POST /duct-sealing/rebate-claims"
              payload: { verification_report_id: "${report_id}", utility_program_id: "${prog_id}", documentation_bundle_ref: "BUNDLE-77" }
              as: ProgramAdmin
              captures: { claim_id: $.data.id }
            - call: "GET /duct-sealing/utility-programs/${prog_id}"
              as: ProgramAdmin
              captures: { pre_committed: $.data.committed_rebate_cents, pre_paid: $.data.paid_rebate_cents, pre_remaining: $.data.remaining_budget_cents }
          trigger:
            - call: "POST /duct-sealing/duct-systems/${ds1_id}/exclude"
              payload: { exclusion_reason: "INACCESSIBLE" }
              as: ProgramAdmin
              captures: { ds_eligibility: $.data.eligibility_status }
          assert:
            - "Pre-trigger money ledger: ${pre_committed} == 307230, ${pre_paid} == 0, ${pre_remaining} == 4692770, and 4692770 + 307230 + 0 == 5000000"
            - "${ds_eligibility} == EXCLUDED and DuctSystem.${ds1_id}.exclusion_reason == INACCESSIBLE"
            - "RebateClaim.${claim_id}.status == WITHDRAWN and committed == false"
            - "RebateClaim.${claim_id}.payable_cents == 307230 (the computed amount is retained as history, only the hold is released)"
            - "UtilityProgram.${prog_id}.committed_rebate_cents == 0 and paid_rebate_cents == 0"
            - "UtilityProgram.${prog_id}.remaining_budget_cents == 5000000 (identity restored: 5000000 + 0 + 0 == 5000000)"
            - "UtilityProgram.${prog_id}.annual_budget_cents == 5000000 (unchanged)"
            - "VerificationReport.${report_id}.status == VOIDED and SealJob.${job_id}.status == ABORTED_EXCLUSION"
            - "DuctSystem.${ds1_id}.working_leakage_cfm25 == 300.00 and sealed_leakage_reduction_cfm == 0.00 (the airflow ledger is compensated by the same cascade)"
