              as: CourtClerk
              captures: { pb: $.data.id }
            - call: "POST /gc/fiduciaries"
              payload: { full_name: "Fid B", fiduciary_kind: "FAMILY" }
              as: CourtClerk
              captures: { fb: $.data.id }
            - call: "POST /gc/cases"
              payload: { protected_person_id: "${pb}", case_type: "GUARDIANSHIP" }
              as: CourtClerk
              captures: { cb: $.data.id }
            - call: "POST /gc/petitions"
              payload: { case_id: "${cb}", nominated_fiduciary_id: "${fb}", requested_authority: "PERSON", alleged_grounds: "g" }
              as: Petitioner
              as_user_id: "pet-1"
              captures: { petb: $.data.id }
            - call: "POST /gc/petitions/${petb}/find-probable-cause"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/petitions/${petb}/order-evaluation"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/evaluations"
