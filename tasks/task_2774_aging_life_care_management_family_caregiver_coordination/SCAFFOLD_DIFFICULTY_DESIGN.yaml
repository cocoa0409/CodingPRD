              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { auth_4: $.data.id }
          trigger:
            - call: "PATCH /care/service-authorizations/${auth_2}/state"
              payload: { to_state: "AUTHORIZED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
              captures: { err_same: $.data.error_id }
            - call: "PATCH /care/service-authorizations/${auth_3}/state"
              payload: { to_state: "AUTHORIZED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
              captures: { err_touch: $.data.error_id }
            - call: "PATCH /care/service-authorizations/${auth_4}/state"
              payload: { to_state: "AUTHORIZED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
              captures: { ok_state: $.data.auth_status }
          assert:
            - "ServiceAuthorization.${auth_1}.auth_status == AUTHORIZED with coverage_hours == 16 (8 whole hours x 2 caregivers)"
            - "The ${auth_2} AUTHORIZED attempt returns HTTP 409 with error_id ERR_COVERAGE_CAPACITY_EXCEEDED (2 + 1 = 3 > 2 on the identical window)"
            - "The ${auth_3} AUTHORIZED attempt returns HTTP 409 with error_id ERR_COVERAGE_CAPACITY_EXCEEDED (windows touching at 16:00:00Z intersect because coverage intervals are CLOSED)"
            - "The ${auth_4} AUTHORIZED attempt returns HTTP 200 with ServiceAuthorization.${auth_4}.auth_status == AUTHORIZED (17:00Z-21:00Z is strictly disjoint from 08:00Z-16:00Z)"
            - "ServiceAuthorization.${auth_2}.auth_status == PROPOSED and ServiceAuthorization.${auth_3}.auth_status == PROPOSED after their rejections"
            - "ServiceAuthorization.${auth_4}.coverage_hours == 8 and Client.${cli}.authorized_coverage_hours == 24 (16 + 8)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: retainer_money_conserved_across_invoice_issue_and_void
        grounds:
          - calculations.client_retainer_and_accrual_ledger
          - calculations.invoice_totals
          - state_machines.Invoice.DRAFT_to_ISSUED
          - state_machines.Invoice.ISSUED_to_VOIDED
          - entities.Client.fields.retainer_balance_cents
          - entities.Invoice.fields.retainer_applied_cents
        distinguishing_aspect: |
          The conserved quantity is MONEY in cents: retainer_balance_cents +
          SUM(Invoice.retainer_applied_cents WHERE status IN {ISSUED, PAID}) must equal
          retainer_deposits_total_cents at every checkpoint, so issuing an invoice only moves the
          same 24075 cents between the two terms and voiding it moves them back with zero drift.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-18T09:00:00Z."
            - "Care manager Dana (hourly_rate_cents 22500) and supervisor Iris."
            - "Client Julia with billing_increment_min 15 and retainer_floor_cents 50000; a single retainer deposit of 60000 cents."
            - "One TimeEntry for 2026-08-18T10:00:00Z..11:00:00Z, CARE_COORDINATION, taken all the way to APPROVED by Iris."
            - "One DRAFT Invoice covering period 2026-08-18..2026-08-18."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-18T09:00:00Z" }
              as: PracticeAdmin
            - call: "POST /care/care-managers"
              payload: { full_name: "Dana Reyes", credential: "CMC", hourly_rate_cents: 22500, is_supervisor: false }
              as: PracticeAdmin
              captures: { cm_dana: $.data.id }
            - call: "POST /care/care-managers"
              payload: { full_name: "Iris Vance", credential: "CCM", hourly_rate_cents: 30000, is_supervisor: true }
              as: PracticeAdmin
              captures: { cm_iris: $.data.id }
            - call: "POST /care/clients"
              payload: { full_name: "Julia Hammersmith", residence_setting: "PRIVATE_HOME", billing_increment_min: 15, retainer_floor_cents: 50000 }
              as: PracticeAdmin
              captures: { cli: $.data.id }
            - call: "POST /care/clients/${cli}/retainer-deposits"
              payload: { amount_cents: 60000, received_at: "2026-08-18T09:15:00Z" }
              as: BillingAdministrator
              captures: { deposits_total: $.data.retainer_deposits_total_cents, bal_0: $.data.retainer_balance_cents }
            - call: "POST /care/time-entries"
              payload: { client_id: "${cli}", care_manager_id: "${cm_dana}", service_type: "CARE_COORDINATION", start_at: "2026-08-18T10:00:00Z", end_at: "2026-08-18T11:00:00Z", service_location_id: "CLIENT_HOME" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { te: $.data.id, te_amount: $.data.billable_amount_cents }
            - call: "PATCH /care/time-entries/${te}/state"
              payload: { to_state: "SUBMITTED" }
              as: CareManager
              as_user_id: "${cm_dana}"
            - call: "PATCH /care/time-entries/${te}/state"
              payload: { to_state: "APPROVED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
            - call: "POST /care/invoices"
              payload: { client_id: "${cli}", period_start: "2026-08-18", period_end: "2026-08-18" }
              as: BillingAdministrator
              captures: { inv: $.data.id, inv_draft_applied: $.data.retainer_applied_cents }
            - call: "GET /care/clients/${cli}"
              as: BillingAdministrator
              captures: { bal_before_issue: $.data.retainer_balance_cents }
          trigger:
            - call: "PATCH /care/invoices/${inv}/state"
              payload: { to_state: "ISSUED" }
              as: BillingAdministrator
              captures: { inv_applied: $.data.retainer_applied_cents, inv_total: $.data.total_due_cents }
            - call: "GET /care/clients/${cli}"
              as: BillingAdministrator
              captures: { bal_after_issue: $.data.retainer_balance_cents }
            - call: "PATCH /care/invoices/${inv}/state"
              payload: { to_state: "VOIDED", reason: "Billed to the wrong period" }
              as: BillingAdministrator
              captures: { inv_status_final: $.data.status }
            - call: "GET /care/clients/${cli}"
              as: BillingAdministrator
              captures: { bal_after_void: $.data.retainer_balance_cents }
          assert:
            - "TimeEntry.${te}.billable_amount_cents == 22500 (60 rounded minutes x 22500 / 60, rate_multiplier 1.0, after_hours_factor 1.00)"
            - "Checkpoint 1 (DRAFT invoice exists, nothing issued): Client.${cli}.retainer_deposits_total_cents == 60000, Client.${cli}.retainer_balance_cents == 60000, Invoice.${inv}.retainer_applied_cents == 24075 as a PROVISIONAL projection only; invariant 60000 + 0 == 60000"
            - "Invoice.${inv} after ISSUED: variant == FINAL, line_subtotal_cents == 22500, admin_fee_cents == 1575, total_due_cents == 24075, retainer_applied_cents == 24075, balance_due_cents == 0"
            - "Checkpoint 2 (after ISSUED): Client.${cli}.retainer_balance_cents == 35925 and 35925 + 24075 == 60000 == Client.${cli}.retainer_deposits_total_cents"
            - "After ISSUED: TimeEntry.${te}.status == INVOICED with invoice_id == ${inv}, and Client.${cli}.unbilled_accrual_cents == 0"
            - "After ISSUED: Client.${cli}.status == PROSPECT — the post-draw balance 35925 is below retainer_floor_cents 50000 but balance_due_cents == 0, so no nonpayment suspension fires"
            - "Checkpoint 3 (after VOIDED): Invoice.${inv}.status == VOIDED, Invoice.${inv}.retainer_applied_cents == 24075 is retained on the row but leaves the {ISSUED, PAID} draw set, Client.${cli}.retainer_balance_cents == 60000, invariant 60000 + 0 == 60000"
            - "After VOIDED: TimeEntry.${te}.status == APPROVED with invoice_id == null and Client.${cli}.unbilled_accrual_cents == 22500 (released by exactly the entry amount, no doubling)"
            - "Client.${cli}.retainer_deposits_total_cents == 60000 at all three checkpoints (deposits are append-only and never reversed by a void)"

      - name: coverage_hours_conserved_across_suspend_and_reactivate
        grounds:
          - calculations.client_authorized_coverage_hours
          - state_machines.ServiceAuthorization.ACTIVE_to_SUSPENDED
          - state_machines.ServiceAuthorization.SUSPENDED_to_ACTIVE
          - entities.Client.fields.authorized_coverage_hours
          - entities.CarePlan.fields.coverage_gap_flag
          - calculations.client_risk_posture
        distinguishing_aspect: |
          A DIFFERENT conserved quantity — authorized caregiver-hours rather than cents: the
          suspend/reactivate pair subtracts and re-adds exactly ServiceAuthorization.coverage_hours
          (16) from Client.authorized_coverage_hours without ever mutating coverage_hours itself, and
          the derived coverage_gap_flag / risk_posture pair returns to its original values.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-19T09:00:00Z."
            - "Care manager Dana, supervisor Iris."
            - "Client Priya with authorized_concurrent_caregivers 2 and retainer_floor_cents 0, surrogate contact Rahul, an ACCEPTED assessment and an ACTIVE care plan."
            - "Vendor Northgate Home Care (no referral relationship)."
            - "One ServiceAuthorization covering 2026-09-01T08:00:00Z..16:00:00Z with concurrent_caregivers 2, driven to auth_status ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-19T09:00:00Z" }
              as: PracticeAdmin
            - call: "POST /care/care-managers"
              payload: { full_name: "Dana Reyes", credential: "CMC", hourly_rate_cents: 22500, is_supervisor: false }
              as: PracticeAdmin
              captures: { cm_dana: $.data.id }
            - call: "POST /care/care-managers"
              payload: { full_name: "Iris Vance", credential: "CCM", hourly_rate_cents: 30000, is_supervisor: true }
              as: PracticeAdmin
              captures: { cm_iris: $.data.id }
            - call: "POST /care/clients"
              payload: { full_name: "Priya Raghunathan", residence_setting: "PRIVATE_HOME", retainer_floor_cents: 0, authorized_concurrent_caregivers: 2 }
              as: PracticeAdmin
              captures: { cli: $.data.id }
            - call: "POST /care/family-contacts"
              payload: { client_id: "${cli}", full_name: "Rahul Raghunathan", contact_role: "POA_HEALTHCARE", is_surrogate_decision_maker: true }
              as: PracticeAdmin
              captures: { fc_rahul: $.data.id }
            - call: "POST /care/vendors"
              payload: { name: "Northgate Home Care", vendor_type: "HOME_CARE", has_referral_relationship: false }
              as: PracticeAdmin
              captures: { vnd: $.data.id }
            - call: "POST /care/assessments"
              payload: { client_id: "${cli}", care_manager_id: "${cm_dana}", domain_scores: { adl: 2, cognition: 2, medical_complexity: 2, social_support: 2, safety: 2, finances: 2 } }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { asm: $.data.id }
            - call: "PATCH /care/assessments/${asm}/state"
              payload: { to_state: "SUBMITTED" }
              as: CareManager
              as_user_id: "${cm_dana}"
            - call: "PATCH /care/assessments/${asm}/state"
              payload: { to_state: "ACCEPTED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
            - call: "GET /care/clients/${cli}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { cli_v1: $.data.version }
            - call: "POST /care/care-plans"
              payload: { client_id: "${cli}", source_assessment_id: "${asm}", expected_client_version: "${cli_v1}", goals: ["Daytime two-caregiver coverage"] }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { cp: $.data.id }
            - call: "PATCH /care/care-plans/${cp}/state"
              payload: { to_state: "PENDING_FAMILY_APPROVAL" }
              as: CareManager
              as_user_id: "${cm_dana}"
            - call: "PATCH /care/care-plans/${cp}/state"
              payload: { to_state: "ACTIVE" }
              as: FamilyDecisionMaker
              as_user_id: "${fc_rahul}"
              captures: { cp_v_active: $.data.version }
            - call: "POST /care/service-authorizations"
              payload: { care_plan_id: "${cp}", vendor_id: "${vnd}", expected_care_plan_version: "${cp_v_active}", coverage_start: "2026-09-01T08:00:00Z", coverage_end: "2026-09-01T16:00:00Z", concurrent_caregivers: 2, hourly_cost_cents: 4000 }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { auth: $.data.id, auth_hours: $.data.coverage_hours }
            - call: "PATCH /care/service-authorizations/${auth}/state"
              payload: { to_state: "AUTHORIZED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
            - call: "PATCH /care/service-authorizations/${auth}/state"
              payload: { to_state: "ACTIVE" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { auth_state_0: $.data.auth_status }
            - call: "GET /care/clients/${cli}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { hours_0: $.data.authorized_coverage_hours, posture_0: $.data.risk_posture }
          trigger:
            - call: "PATCH /care/service-authorizations/${auth}/state"
              payload: { to_state: "SUSPENDED", reason: "FAMILY_REQUEST" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { susp_reason: $.data.suspension_reason, hours_on_row: $.data.coverage_hours }
            - call: "GET /care/clients/${cli}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { hours_1: $.data.authorized_coverage_hours, posture_1: $.data.risk_posture }
            - call: "GET /care/care-plans/${cp}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { gap_1: $.data.coverage_gap_flag }
            - call: "PATCH /care/service-authorizations/${auth}/state"
              payload: { to_state: "ACTIVE" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { auth_state_2: $.data.auth_status, susp_reason_2: $.data.suspension_reason }
            - call: "GET /care/clients/${cli}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { hours_2: $.data.authorized_coverage_hours, posture_2: $.data.risk_posture }
            - call: "GET /care/care-plans/${cp}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { gap_2: $.data.coverage_gap_flag }
          assert:
            - "Checkpoint 1 (auth ACTIVE): ServiceAuthorization.${auth}.coverage_hours == 16, Client.${cli}.authorized_coverage_hours == 16, CarePlan.${cp}.coverage_gap_flag == false, Client.${cli}.risk_posture == ROUTINE"
            - "Forward step: the SUSPENDED response carries auth_status == SUSPENDED and suspension_reason == FAMILY_REQUEST"
            - "Checkpoint 2 (auth SUSPENDED): Client.${cli}.authorized_coverage_hours == 0 (16 - 16), CarePlan.${cp}.coverage_gap_flag == true, Client.${cli}.risk_posture == ELEVATED"
            - "The row's own ServiceAuthorization.${auth}.coverage_hours is still 16 while SUSPENDED — suspension changes the input-set membership, never the stored hours"
            - "Compensating step: the SUSPENDED -> ACTIVE response carries auth_status == ACTIVE and suspension_reason == NONE"
            - "Checkpoint 3 (auth ACTIVE again): Client.${cli}.authorized_coverage_hours == 16 exactly (not 32 and not 0), CarePlan.${cp}.coverage_gap_flag == false, Client.${cli}.risk_posture == ROUTINE"
            - "Client.${cli}.authorized_coverage_hours equals SUM(coverage_hours of the client's authorizations with auth_status IN {AUTHORIZED, ACTIVE}) at all three checkpoints"
            - "ServiceAuthorization.${auth}.version is strictly greater after each of the two transitions (monotonic, no rollback)"
