      - name: request_without_x_user_role_header_returns_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations.priority_1
          - validations.priority_2
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: |
          Priority 1 outranks priority 2 and both outrank existence: a POST with no X-User-Role
          header at all returns ERR_UNAUTHENTICATED (401), a POST carrying the unknown role
          "GrantsOfficer" also returns ERR_UNAUTHENTICATED (401, because the header value is not
          one of the six declared roles) while a syntactically valid but unpermitted role returns
          ERR_ROLE_NOT_PERMITTED (403). An implementation that maps every header problem onto 403
          fails the first two legs.
        test_recipe:
          setup:
            - "No domain state is needed; all three calls are refused before any lookup."
          setup_api_calls: []
          trigger:
            - call: "POST /fundraising/agencies"
              payload: { legal_name: "Header Test Agency", ein: "610000010", primary_priority_area: "HEALTH" }
              as: "<no X-User-Role header sent>"
              captures: { e1: $.data.error_id }
            - call: "POST /fundraising/agencies"
              payload: { legal_name: "Header Test Agency", ein: "610000010", primary_priority_area: "HEALTH" }
              as: "GrantsOfficer (not one of the six declared roles)"
              captures: { e2: $.data.error_id }
            - call: "POST /fundraising/agencies"
              payload: { legal_name: "Header Test Agency", ein: "610000010", primary_priority_area: "HEALTH" }
              as: VolunteerPanelist
              as_user_id: "00000000-0000-4000-8000-000000000abc"
              captures: { e3: $.data.error_id }
            - call: "POST /fundraising/agencies"
              payload: { legal_name: "Header Test Agency", ein: "610000010", primary_priority_area: "HEALTH" }
              as: UnitedFundAdmin
              captures: { ag: $.data.id }
          assert:
            - "Missing header: HTTP 401 with error_id ERR_UNAUTHENTICATED"
            - "Unknown role value: HTTP 401 with error_id ERR_UNAUTHENTICATED"
            - "Declared-but-unpermitted role: HTTP 403 with error_id ERR_ROLE_NOT_PERMITTED (priority 2 fires only after priority 1 passes)"
            - "None of the three refused calls created anything: the fourth call, an identical body from UnitedFundAdmin, returns 201 and stores ein 610000010, proving the globally unique ein was never consumed by a refused request"
            - "Agency.${ag}.membership_status == APPLICANT"

      - name: corner_validation_violation_returns_declared_error_id
        claim_type: Violation → Error
        grounds:
          - validations.priority_31
          - errors.ERR_DESIGNATION_BELOW_MINIMUM
        excluded_because:
          difficulty_instance: priority_collision / ineligible_designation_target_outranks_below_minimum_amount
          rationale: "The §1.8 instance triggers ERR_DESIGNATION_BELOW_MINIMUM in isolation on its control leg before adding the higher-priority violation."

      - name: corner_two_rules_violated_returns_higher_priority_error
        claim_type: Priority Ordering
        grounds:
          - validations.priority_26
          - validations.priority_31
        excluded_because:
          difficulty_instance: priority_collision / ineligible_designation_target_outranks_below_minimum_amount
          rationale: "The §1.8 instance violates both rules in one request and pins the lower-numbered priority's error_id."

      - name: corner_priority_conflict_across_distant_priorities
        claim_type: Priority conflict
        grounds:
          - validations.priority_24
          - validations.priority_30
        excluded_because:
          difficulty_instance: priority_collision / agency_standing_outranks_closed_request_window
          rationale: "The §1.8 instance collides a standing rule with a far-lower temporal-window rule on one submit call."

      - name: corner_validity_depends_on_other_entity_state
        claim_type: Cross-entity validation
        grounds:
          - validations.priority_10
          - state_machines.Employer
        excluded_because:
          difficulty_instance: cross_entity_state_gate / campaign_open_gated_by_employer_partnership_status
          rationale: "The §1.8 instance runs the same campaign-open call against a PROSPECT employer and an ACTIVE one."

      - name: corner_temporal_validation_window_boundary
        claim_type: Temporal validation
        grounds:
          - validations.priority_27
          - validations.priority_30
        excluded_because:
          difficulty_instance: boundary_temporal_check / employer_campaign_windows_half_open_touching_endpoints_allowed
          rationale: "The §1.8 instance walks the half-open request/solicitation window endpoints against the logical clock."

  - section: endpoints
    instances:

      - name: panelist_standard_crud_create_then_read_round_trip
        claim_type: Standard CRUD
        grounds:
          - endpoints.POST /fundraising/panelists
          - endpoints.GET /fundraising/panelists/{id}
          - endpoints.GET /fundraising/panelists/{id}/panel-assignments
          - entities.Panelist
        distinguishing_aspect: |
          The create/read pair round-trips every declared field and mints the counters at zero: the
          POST returns 201 with full_name, email and expertise_area exactly as supplied plus
          submitted_score_count 0, site_visit_count 0 and version 1, and the follow-up GET on the
          minted id returns the identical body. The nested panel-assignments listing on a brand-new
          panelist is an empty page (total_count 0, has_more false), not a 404.
        test_recipe:
          setup:
            - "No prior state; the panelist is the first entity created."
          setup_api_calls: []
          trigger:
            - call: "POST /fundraising/panelists"
              payload: { full_name: "Imogen Baptiste", email: "imogen.baptiste@panel.example", expertise_area: "FINANCIAL_STABILITY" }
              as: AllocationsDirector
              captures: { p: $.data.id, v: $.data.version }
            - call: "GET /fundraising/panelists/${p}"
              payload: {}
              as: UnitedFundAdmin
              captures: { name: $.data.full_name, ssc: $.data.submitted_score_count }
            - call: "GET /fundraising/panelists/${p}/panel-assignments"
              payload: {}
              as: UnitedFundAdmin
          assert:
            - "POST returns HTTP 201; GET returns HTTP 200"
            - "Panelist.${p}.full_name == \"Imogen Baptiste\", email == \"imogen.baptiste@panel.example\", expertise_area == FINANCIAL_STABILITY"
            - "Panelist.${p}.submitted_score_count == 0 and site_visit_count == 0 and version == 1"
            - "The GET body equals the POST body field for field (nothing is re-derived on read)"
            - "GET /fundraising/panelists/${p}/panel-assignments returns HTTP 200 with data == [], total_count == 0, has_more == false, limit == 10, offset == 0"

      - name: activate_employer_action_endpoint_rejects_second_activation_with_invalid_state
        claim_type: Action endpoint
        grounds:
          - endpoints.POST /fundraising/employers/{id}/activate
          - state_machines.Employer.PROSPECT_to_ACTIVE
          - validations.priority_9
          - errors.ERR_EMPLOYER_INVALID_STATE
        distinguishing_aspect: |
          The action endpoint is a transition, not a setter: the first activate moves PROSPECT ->
          ACTIVE, flips partnership_signed to true and bumps version 1 -> 2, and the second
          activate on the now-ACTIVE employer returns ERR_EMPLOYER_INVALID_STATE (409, priority 9
          requires PROSPECT) while leaving version at 2. Also pinned: an employer created with
          partnership_signed true is ACTIVE at creation, so activate on it is refused immediately.
        test_recipe:
          setup:
            - "Employer A created without partnership_signed (so it starts PROSPECT); employer B created with partnership_signed true (so it starts ACTIVE)."
          setup_api_calls:
            - call: "POST /fundraising/employers"
              payload: { legal_name: "Bellhaven Foods", employee_count: 500 }
              as: UnitedFundAdmin
              captures: { emp_a: $.data.id, st_a: $.data.status, v_a: $.data.version }
            - call: "POST /fundraising/employers"
              payload: { legal_name: "Tanager Mutual", employee_count: 120, partnership_signed: true }
              as: UnitedFundAdmin
              captures: { emp_b: $.data.id, st_b: $.data.status }
          trigger:
            - call: "POST /fundraising/employers/${emp_a}/activate"
              payload: {}
              as: UnitedFundAdmin
              captures: { st1: $.data.status, v1: $.data.version, ps1: $.data.partnership_signed }
            - call: "POST /fundraising/employers/${emp_a}/activate"
              payload: {}
              as: UnitedFundAdmin
              captures: { err1: $.data.error_id }
            - call: "POST /fundraising/employers/${emp_b}/activate"
              payload: {}
              as: UnitedFundAdmin
              captures: { err2: $.data.error_id }
            - call: "GET /fundraising/employers/${emp_a}"
              payload: {}
              as: UnitedFundAdmin
              captures: { v_final: $.data.version }
          assert:
            - "Employer.${emp_a}.status == PROSPECT at creation with version 1 and partnership_signed false"
            - "Employer.${emp_b}.status == ACTIVE at creation (partnership_signed true short-circuits the transition)"
            - "First activate: HTTP 200 with status ACTIVE, partnership_signed true, version 2"
            - "Second activate: HTTP 409 with error_id ERR_EMPLOYER_INVALID_STATE"
            - "Activate on ${emp_b}: HTTP 409 with error_id ERR_EMPLOYER_INVALID_STATE"
            - "${v_final} == 2 - the refused call did not bump version"
            - "Employer.${emp_a}.active_campaign_count == 0 (activation alone opens no campaign)"

      - name: panel_assignment_with_unknown_panelist_fk_returns_panelist_not_found
        claim_type: Cross-reference link
        grounds:
          - endpoints.POST /fundraising/allocation-cycles/{id}/panel-assignments
          - validations.priority_5
          - validations.priority_4
          - errors.ERR_PANELIST_NOT_FOUND
          - entities.PanelAssignment
        distinguishing_aspect: |
          Both sides of the junction must resolve, and the path segment is checked before the body
          FK: a real cycle plus a bogus panelist_id returns ERR_PANELIST_NOT_FOUND (priority 5), a
          bogus cycle in the path plus a real panelist_id returns ERR_CYCLE_NOT_FOUND (priority 4,
          left to right), and only the all-real pair creates the association - visible from both
          the cycle side and the panelist side.
        test_recipe:
          setup:
            - "One DRAFT cycle and one panelist; the bogus UUIDs are well-formed and unused."
          setup_api_calls:
            - call: "POST /fundraising/panelists"
              payload: { full_name: "Desmond Achebe", email: "desmond.achebe@panel.example", expertise_area: "FINANCE" }
              as: AllocationsDirector
              captures: { p: $.data.id }
            - call: "POST /fundraising/allocation-cycles"
              payload: { cycle_year: 2026, focus_priority_area: "FINANCIAL_STABILITY", opening_undesignated_pool: 150000.00, max_award_per_agency: 40000.00, request_window_start: "2026-07-01", request_window_end: "2026-10-01" }
              as: AllocationsDirector
              captures: { cyc: $.data.id }
          trigger:
            - call: "POST /fundraising/allocation-cycles/${cyc}/panel-assignments"
              payload: { panelist_id: "11111111-1111-4111-8111-111111111111", conflict_declared: false, assignment_role: "SCORER" }
              as: AllocationsDirector
              captures: { e1: $.data.error_id }
            - call: "POST /fundraising/allocation-cycles/22222222-2222-4222-8222-222222222222/panel-assignments"
              payload: { panelist_id: "${p}", conflict_declared: false, assignment_role: "SCORER" }
              as: AllocationsDirector
              captures: { e2: $.data.error_id }
            - call: "POST /fundraising/allocation-cycles/${cyc}/panel-assignments"
              payload: { panelist_id: "${p}", conflict_declared: false, assignment_role: "CHAIR" }
              as: AllocationsDirector
              captures: { pa: $.data.id }
          assert:
            - "Bogus body FK: HTTP 404 with error_id ERR_PANELIST_NOT_FOUND"
            - "Bogus path segment with a real body FK: HTTP 404 with error_id ERR_CYCLE_NOT_FOUND"
            - "Valid pair: HTTP 201 with cycle_id ${cyc}, panelist_id ${p}, assignment_role CHAIR, conflict_declared false, submitted_score_count 0"
            - "GET /fundraising/allocation-cycles/${cyc}/panel-assignments returns total_count == 1 containing ${pa}"
            - "GET /fundraising/panelists/${p}/panel-assignments returns total_count == 1 containing ${pa}"
            - "AllocationCycle.${cyc}.posture is still DRAFT (seating a panel does not open the cycle)"

      - name: impact_fund_summary_computed_read_on_freshly_opened_cycle
        claim_type: Computed read
        grounds:
          - endpoints.GET /fundraising/allocation-cycles/{id}/impact-fund-summary
          - entities.AllocationCycle.fields.available_undesignated_pool
          - entities.AllocationCycle.fields.suspended_request_ratio
          - entities.AllocationCycle.fields.awards_blocked
          - calculations.community_impact_fund_allocation
        distinguishing_aspect: |
          The computed read is derived at request time from the cycle's own ledger fields, not
          stored: on a cycle opened with a 300000.00 pool and no awards yet, the summary reports
          available_undesignated_pool 300000.00 equal to opening_undesignated_pool, every award
          roll-up (awarded_total, base_award_total, designation_offset_total,
          strategic_supplement_total) at 0.00, awarded_request_count 0, suspended_request_ratio
          0.0000 by the zero-denominator rule (submitted_request_count is 0, not a division by
          zero) and awards_blocked false.
        test_recipe:
          setup:
            - "One cycle with opening_undesignated_pool 300000.00, one conflict-free panelist seated, cycle OPEN, no requests submitted."
          setup_api_calls:
            - call: "POST /fundraising/panelists"
              payload: { full_name: "Perpetua Vance", email: "perpetua.vance@panel.example", expertise_area: "HEALTH" }
              as: AllocationsDirector
              captures: { p: $.data.id }
            - call: "POST /fundraising/allocation-cycles"
              payload: { cycle_year: 2026, focus_priority_area: "HEALTH", opening_undesignated_pool: 300000.00, max_award_per_agency: 100000.00, request_window_start: "2026-07-01", request_window_end: "2026-10-01" }
              as: AllocationsDirector
              captures: { cyc: $.data.id }
            - call: "POST /fundraising/allocation-cycles/${cyc}/panel-assignments"
              payload: { panelist_id: "${p}", conflict_declared: false, assignment_role: "SCORER" }
              as: AllocationsDirector
            - call: "POST /fundraising/allocation-cycles/${cyc}/open"
              payload: {}
              as: AllocationsDirector
          trigger:
            - call: "GET /fundraising/allocation-cycles/${cyc}/impact-fund-summary"
              payload: {}
              as: FinanceReviewer
              captures: { avail: $.data.available_undesignated_pool, blocked: $.data.awards_blocked }
          assert:
            - "HTTP 200"
            - "cycle_id == ${cyc} and posture == OPEN"
            - "opening_undesignated_pool == 300000.00 and available_undesignated_pool == 300000.00"
            - "awarded_total == 0.00, base_award_total == 0.00, designation_offset_total == 0.00, strategic_supplement_total == 0.00"
            - "awarded_request_count == 0 and suspended_request_count == 0"
            - "suspended_request_ratio == 0.0000 (zero submitted requests yields 0.0000, no division by zero)"
            - "awards_blocked == false"

      - name: corner_conditional_action_allowed_only_under_condition
        claim_type: Conditional action
        grounds:
          - endpoints.POST /fundraising/allocation-cycles/{id}/awards
          - endpoints.POST /fundraising/allocation-requests/{id}/rescind-award
        excluded_because:
          difficulty_instance: state_reachability / cycle_pool_conservation_survives_award_rescind_reaward
          rationale: "The §1.8 instance drives award, rescind-award and re-award through their posture and status conditions and asserts the pool returns to the same figure."

  - section: errors
    instances:

      - name: all_path_segment_and_body_fk_not_found_errors_are_triggerable
        claim_type: error_triggerable
        grounds:
          - validations.priority_4
          - validations.priority_5
          - errors.ERR_EMPLOYER_NOT_FOUND
          - errors.ERR_CAMPAIGN_NOT_FOUND
          - errors.ERR_PLEDGE_NOT_FOUND
          - errors.ERR_AGENCY_NOT_FOUND
          - errors.ERR_AGENCY_REVIEW_NOT_FOUND
          - errors.ERR_CYCLE_NOT_FOUND
          - errors.ERR_REQUEST_NOT_FOUND
          - errors.ERR_PANELIST_NOT_FOUND
          - errors.ERR_OUTCOME_REPORT_NOT_FOUND
        distinguishing_aspect: |
          Every one of the nine 404 codes is reachable and each names its own resource: nine
          well-formed but unused UUIDs are addressed one per resource family, and the ninth leg
          proves the nested case - a real agency with a bogus {review_id} returns
          ERR_AGENCY_REVIEW_NOT_FOUND rather than ERR_AGENCY_NOT_FOUND, because priority 4 walks
          path segments left to right.
