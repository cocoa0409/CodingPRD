              captures: { c2_ver: $.data.version }
            - call: "POST /engagements"
              payload: { client_id: "${c2_id}", billing_model: "ONLINE_SUBSCRIPTION", expected_client_version: "${c2_ver}", monthly_fee_cents: 6000, cycle_start_utc: "2026-06-01T00:00:00Z" }
              as: Trainer
