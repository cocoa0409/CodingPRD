  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pair_a_state_10_beats_business_safety_14_on_resubmit_of_red_tier_tree_nut_order
        grounds:
          - validations[priority=10]
          - validations[priority=14]
          - errors[ERR_INVALID_STATE_TRANSITION]
          - errors[ERR_ALLERGEN_PROGRAM_CONFLICT]
          - calculations.customer_allergen_risk_score
        distinguishing_aspect: |
          Pair A couples category `state` (priority 10, 409) with category `business_safety`
          (priority 14, 422). A single submit call breaches BOTH: the order is already PROVISIONAL
          (no UNPRICED -> PROVISIONAL transition exists from there) and the customer has meanwhile
          become risk_tier RED while holding a TREE_NUT line. The response must be
          ERR_INVALID_STATE_TRANSITION with HTTP 409; returning ERR_ALLERGEN_PROGRAM_CONFLICT / 422
          proves the implementation evaluated the checks out of priority order.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z; customer Nutmeg Patisserie, allergen_program STANDARD, credit_limit_cents 5000000, min_drop_cents 25000, risk_tier GREEN."
            - "Almond flour SKU ALM-FLR-25 (TREE_NUT, 890 c/lb) with lot LOT-ALM-3001 of 10000 lb in OPEN TREE_NUT zone Z-NUT-01."
            - "One BAGGED order with a single 1000 lb almond line created while the customer was still GREEN (so priority 14 permitted the line), then submitted: total_cents 903350, pricing_status PROVISIONAL."
            - "The order is then allocated, which recomputes customer_allergen_risk_score over in-flight lines to 90.00 and re-derives risk_tier RED."
          setup_api_calls:
            - call: "POST /bakery-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /bakery-distribution/customers"
              payload: { legal_name: "Nutmeg Patisserie", allergen_program: "STANDARD", credit_limit_cents: 5000000, min_drop_cents: 25000 }
              as: AccountManager
              as_user_id: "am-1"
              captures: { cust_id: $.data.id }
            - call: "POST /bakery-distribution/products"
              payload: { sku: "ALM-FLR-25", category: "INCLUSION", allergen_class: "TREE_NUT", bulk_capable: false, shelf_life_days: 120, index_code: "NONE", list_price_cents_per_lb: 890, min_rotation_days: 15 }
              as: PricingController
              as_user_id: "pc-1"
              captures: { almond_id: $.data.id }
            - call: "POST /bakery-distribution/warehouse-zones"
              payload: { zone_code: "Z-NUT-01", allergen_class: "TREE_NUT" }
              as: WarehouseOperator
              as_user_id: "wo-1"
              captures: { zone_nut_id: $.data.id }
