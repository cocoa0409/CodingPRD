              as: IntakeClerk
              as_user_id: "clerk-01"
              captures: { cert_id: $.data.id }
            - call: "POST /_registry-records"
              payload: { taxpayer_id: "${t_id}", source: "VOTER_REGISTRY", record_effective_date: "2026-01-05", address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /_registry-records"
              payload: { taxpayer_id: "${t_id}", source: "DEED_REGISTRY", record_effective_date: "2026-01-05", address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /exemption-applications"
              payload: { parcel_id: "${p1_id}", taxpayer_id: "${t_id}", program_id: "${prog_d_id}", tax_year: 2026, claimed_occupancy_date: "2019-06-01", claimed_address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: IntakeClerk
              as_user_id: "clerk-01"
              captures: { app1_id: $.data.id }
            - call: "POST /exemption-applications/${app1_id}/submit"
              payload: {}
              as: IntakeClerk
              as_user_id: "clerk-01"
            - call: "POST /exemption-applications/${app1_id}/verification-checks"
              payload: { source: "VOTER_REGISTRY" }
              as: ExemptionsReviewer
              as_user_id: "reviewer-01"
            - call: "POST /exemption-applications/${app1_id}/verification-checks"
              payload: { source: "DEED_REGISTRY" }
