# =============================================================================
# task_2279 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Depth probe: nine §0.5 Difficulty Rules cross-referenced into SCAFFOLD.yaml
# §1.1–§1.7. Every numeric assert below was executed against the declared
# formulas and constants and is written as a literal.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: si_ratio_single_event_variant_yields_not_substantial
        grounds:
          - calculations.substantial_ratio
          - calculations.structure_improvement_aggregates
          - entities.DeterminationCase.fields.method
          - entities.Structure.fields.single_event_improvement_pct
        distinguishing_aspect: |
          The SINGLE_EVENT variant divides only the anchor record's cost (45000.00) by the
          anchor's market-value snapshot (200000.00) and returns 22.50, so the identical
          ledger that the CUMULATIVE variant scores as SUBSTANTIAL is scored NOT_SUBSTANTIAL
          and Structure.substantial_status stays NONE.
        test_recipe:
          setup:
            - "Community 'Bayou City' with freeboard_ft 1.5 and cumulative_period_years 10; logical clock at the 2026-08-01T00:00:00Z default."
            - "One EFFECTIVE AE panel (BFE 12.0), one parcel, one RESIDENTIAL structure with market_value_usd 200000.00."
            - "Two counted ImprovementRecords on that structure: 60000.00 on 2019-03-01 and 45000.00 on 2026-03-01, so the anchor is the 2026-03-01 record."
            - "The 2026-03-01 append pushed cumulative_improvement_pct to 52.50 and auto-opened a CUMULATIVE case in OPEN."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0001", mapped_area_code: "RLA-1", owner_name: "A Owner", owner_email: "a@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
            - call: "POST /floodplain/structures"
              payload: { property_id: "${prop_id}", structure_use: "RESIDENTIAL", pre_firm: false, construction_year: 1998, market_value_usd: 200000.00, highest_adjacent_grade_ft: 10.0 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { struct_id: $.data.id }
            - call: "POST /floodplain/improvement-records"
              payload: { structure_id: "${struct_id}", record_type: "IMPROVEMENT", event_date: "2019-03-01T00:00:00Z", cost_usd: 60000.00 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { rec_2019_id: $.data.id }
            - call: "POST /floodplain/improvement-records"
              payload: { structure_id: "${struct_id}", record_type: "IMPROVEMENT", event_date: "2026-03-01T00:00:00Z", cost_usd: 45000.00 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { rec_2026_id: $.data.id }
            - call: "GET /floodplain/structures/${struct_id}"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { struct_version: $.data.version }
            - call: "POST /floodplain/determination-cases"
              payload: { structure_id: "${struct_id}", method: "SINGLE_EVENT", expected_structure_version: "${struct_version}" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /floodplain/determination-cases/${case_id}/determine"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          assert:
            - "DeterminationCase.${case_id}.method == SINGLE_EVENT"
            - "DeterminationCase.${case_id}.computed_ratio_pct == 22.50"
            - "DeterminationCase.${case_id}.threshold_pct == 50.00"
            - "DeterminationCase.${case_id}.outcome == NOT_SUBSTANTIAL"
            - "DeterminationCase.${case_id}.status == DETERMINED"
            - "DeterminationCase.${case_id}.anchor_record_id == ${rec_2026_id}"
            - "DeterminationCase.${case_id}.determination_type == SUBSTANTIAL_IMPROVEMENT"
            - "Structure.${struct_id}.single_event_improvement_pct == 22.50"
            - "Structure.${struct_id}.cumulative_improvement_pct == 52.50"
            - "Structure.${struct_id}.substantial_status == NONE"

      - name: si_ratio_cumulative_variant_yields_substantial
        grounds:
          - calculations.substantial_ratio
          - calculations.structure_improvement_aggregates
          - entities.Structure.fields.cumulative_improvement_pct
          - state_machines.DeterminationCase.OPEN_to_DETERMINED
        distinguishing_aspect: |
          The CUMULATIVE variant sums every counted record inside the closed window
          [2016-03-01, 2026-03-01] (60000.00 + 45000.00) over the same 200000.00 denominator
          and returns 52.50 — SUBSTANTIAL — so the same two records that SINGLE_EVENT scores
          at 22.50 flip Structure.substantial_status to SUBSTANTIAL_IMPROVEMENT.
        test_recipe:
          setup:
            - "Identical ledger to si_ratio_single_event_variant_yields_not_substantial: 60000.00 on 2019-03-01 and 45000.00 on 2026-03-01 against market_value_usd 200000.00, cumulative_period_years 10."
            - "A DeterminationCase opened with method CUMULATIVE, superseding the auto-opened case."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0001", mapped_area_code: "RLA-1", owner_name: "A Owner", owner_email: "a@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
            - call: "POST /floodplain/structures"
              payload: { property_id: "${prop_id}", structure_use: "RESIDENTIAL", pre_firm: false, construction_year: 1998, market_value_usd: 200000.00, highest_adjacent_grade_ft: 10.0 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { struct_id: $.data.id }
            - call: "POST /floodplain/improvement-records"
              payload: { structure_id: "${struct_id}", record_type: "IMPROVEMENT", event_date: "2019-03-01T00:00:00Z", cost_usd: 60000.00 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "POST /floodplain/improvement-records"
              payload: { structure_id: "${struct_id}", record_type: "IMPROVEMENT", event_date: "2026-03-01T00:00:00Z", cost_usd: 45000.00 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { rec_2026_id: $.data.id }
            - call: "GET /floodplain/structures/${struct_id}"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { struct_version: $.data.version }
            - call: "POST /floodplain/determination-cases"
              payload: { structure_id: "${struct_id}", method: "CUMULATIVE", expected_structure_version: "${struct_version}" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /floodplain/determination-cases/${case_id}/determine"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          assert:
            - "DeterminationCase.${case_id}.method == CUMULATIVE"
            - "DeterminationCase.${case_id}.computed_ratio_pct == 52.50"
            - "DeterminationCase.${case_id}.outcome == SUBSTANTIAL"
            - "DeterminationCase.${case_id}.determination_type == SUBSTANTIAL_IMPROVEMENT"
            - "DeterminationCase.${case_id}.determined_by_user_id == fpa-01"
            - "Structure.${struct_id}.substantial_status == SUBSTANTIAL_IMPROVEMENT"
            - "Structure.${struct_id}.cumulative_counted_cost_usd == 105000.00"
            - "Structure.${struct_id}.cumulative_improvement_pct == 52.50"
            - "Structure.${struct_id}.single_event_improvement_pct == 22.50"

      - name: crs_class_claimed_provisional_diverges_from_verified_final
        grounds:
          - calculations.crs_class_determination
          - calculations.higher_standard_credit
          - entities.CrsCycle.fields.provisional_class
          - entities.CrsCycle.fields.resulting_class
          - state_machines.CrsCycle.SUBMITTED_to_CERTIFIED
        distinguishing_aspect: |
          The CLAIMED variant scores the unbounded claim of 700 points as provisional_class 9,
          while the VERIFIED variant scores the trimmed verified_points min(700, 150) = 150 as
          resulting_class 10 — the divergence lives in a different entity domain (CRS credit)
          from the ledger-ratio dual variant above.
        test_recipe:
          setup:
            - "Community 'Bayou City' with freeboard_ft 1.5, so activity A430_FREEBOARD's ceiling is floor(100 * min(1.5, 5.0)) = 150 points."
            - "A HigherStandard for A430_FREEBOARD, documentation_cycle_year 2026, claiming 700 points, in SUBMITTED."
            - "CrsCycle 2026 submitted at clock 2026-08-01T00:00:00Z (before due_at 2026-09-30T00:00:00Z) with prior_class 10, then the standard verified and the verification visit recorded."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "GET /floodplain/communities/${comm_id}"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { comm_version: $.data.version }
            - call: "POST /floodplain/higher-standards"
              payload: { community_id: "${comm_id}", activity_code: "A430_FREEBOARD", documentation_cycle_year: 2026, claimed_points: 700, expected_community_version: "${comm_version}" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { std_id: $.data.id }
            - call: "POST /floodplain/higher-standards/${std_id}/submit"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "POST /floodplain/crs-cycles"
              payload: { community_id: "${comm_id}", cycle_year: 2026, cycle_start_date: "2026-01-01T00:00:00Z", cycle_end_date: "2026-12-31T00:00:00Z", due_at: "2026-09-30T00:00:00Z" }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { cycle_id: $.data.id }
            - call: "POST /floodplain/crs-cycles/${cycle_id}/submit"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "POST /floodplain/higher-standards/${std_id}/verify"
              payload: { decision: "VERIFY" }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/crs-cycles/${cycle_id}/verify-visit"
              payload: { visit_note: "Field verification of freeboard ordinance" }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
          trigger:
            - call: "POST /floodplain/crs-cycles/${cycle_id}/certify"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
          assert:
            - "CrsCycle.${cycle_id}.prior_class == 10"
            - "CrsCycle.${cycle_id}.total_claimed_points == 700"
            - "CrsCycle.${cycle_id}.provisional_class == 9"
            - "CrsCycle.${cycle_id}.total_verified_points == 150"
            - "CrsCycle.${cycle_id}.resulting_class == 10"
            - "CrsCycle.${cycle_id}.status == CERTIFIED"
            - "HigherStandard.${std_id}.max_points_allowed == 150"
            - "HigherStandard.${std_id}.verified_points == 150"
            - "Community.${comm_id}.crs_credit_points_claimed == 700"
            - "Community.${comm_id}.crs_credit_points_verified == 150"
            - "Community.${comm_id}.crs_class == 10"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: required_elevation_non_residential_floodproofing_credit_applies
        grounds:
          - calculations.required_lowest_floor_elevation
          - entities.DevelopmentPermit.fields.required_lowest_floor_elevation_ft
          - entities.DevelopmentPermit.fields.freeboard_applied_ft
          - state_machines.DevelopmentPermit.DRAFT_to_UNDER_REVIEW
        distinguishing_aspect: |
          Mode (a) — multi-factor formula: zone base 12.0, freeboard max(1.5, 1.0) = 1.5,
          SI bump 0.0 and floodproofing credit 1.0 combine to exactly 12.5 because the
          structure_use is NON_RESIDENTIAL; the credit factor is the only term that differs
          from the residential instance.
        test_recipe:
          setup:
            - "Community with freeboard_ft 1.5; EFFECTIVE AE panel with base_flood_elevation_ft 12.0."
            - "A NON_RESIDENTIAL structure with highest_adjacent_grade_ft 10.0 and substantial_status NONE."
            - "A DRAFT NEW_CONSTRUCTION permit with floodproofing_requested true and proposed_lowest_floor_elevation_ft 20.0."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0002", mapped_area_code: "RLA-1", owner_name: "Warehouse LLC", owner_email: "w@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
            - call: "POST /floodplain/structures"
              payload: { property_id: "${prop_id}", structure_use: "NON_RESIDENTIAL", pre_firm: false, construction_year: 2001, market_value_usd: 800000.00, highest_adjacent_grade_ft: 10.0 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { struct_id: $.data.id }
            - call: "POST /floodplain/permits"
              payload: { property_id: "${prop_id}", structure_id: "${struct_id}", project_type: "NEW_CONSTRUCTION", declared_project_cost_usd: 250000.00, proposed_lowest_floor_elevation_ft: 20.0, floodproofing_requested: true }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { permit_id: $.data.id }
          trigger:
            - call: "POST /floodplain/permits/${permit_id}/submit"
              as: PropertyOwner
              as_user_id: "${prop_id}"
          assert:
            - "DevelopmentPermit.${permit_id}.status == UNDER_REVIEW"
            - "DevelopmentPermit.${permit_id}.determined_zone == AE"
            - "DevelopmentPermit.${permit_id}.determined_bfe_ft == 12.0"
            - "DevelopmentPermit.${permit_id}.freeboard_applied_ft == 1.5"
            - "DevelopmentPermit.${permit_id}.required_lowest_floor_elevation_ft == 12.5"
            - "DevelopmentPermit.${permit_id}.revision_round == 0"

      - name: required_elevation_residential_floodproofing_request_grants_no_credit
        grounds:
          - calculations.required_lowest_floor_elevation
          - entities.Structure.fields.structure_use
          - state_machines.DevelopmentPermit.DRAFT_to_UNDER_REVIEW
        distinguishing_aspect: |
          Mode (a) with the same zone base 12.0 and freeboard 1.5 but structure_use
          RESIDENTIAL: the floodproofing_requested flag is recorded and the credit term
          evaluates to 0.0, so the requirement is 13.5 — exactly 1.0 ft above the
          non-residential instance.
        test_recipe:
          setup:
            - "Community with freeboard_ft 1.5; EFFECTIVE AE panel with base_flood_elevation_ft 12.0."
            - "A RESIDENTIAL structure with highest_adjacent_grade_ft 10.0 and substantial_status NONE."
            - "A DRAFT NEW_CONSTRUCTION permit with floodproofing_requested true and proposed_lowest_floor_elevation_ft 20.0."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0003", mapped_area_code: "RLA-1", owner_name: "B Owner", owner_email: "b@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
            - call: "POST /floodplain/structures"
              payload: { property_id: "${prop_id}", structure_use: "RESIDENTIAL", pre_firm: false, construction_year: 2001, market_value_usd: 300000.00, highest_adjacent_grade_ft: 10.0 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { struct_id: $.data.id }
            - call: "POST /floodplain/permits"
              payload: { property_id: "${prop_id}", structure_id: "${struct_id}", project_type: "NEW_CONSTRUCTION", declared_project_cost_usd: 250000.00, proposed_lowest_floor_elevation_ft: 20.0, floodproofing_requested: true }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { permit_id: $.data.id }
          trigger:
            - call: "POST /floodplain/permits/${permit_id}/submit"
              as: PropertyOwner
              as_user_id: "${prop_id}"
          assert:
            - "DevelopmentPermit.${permit_id}.required_lowest_floor_elevation_ft == 13.5"
            - "DevelopmentPermit.${permit_id}.floodproofing_requested == true"
            - "DevelopmentPermit.${permit_id}.freeboard_applied_ft == 1.5"
            - "DevelopmentPermit.${permit_id}.status == UNDER_REVIEW"

      - name: outreach_score_is_mean_of_rounded_area_coverages_not_pooled_ratio
        grounds:
          - calculations.outreach_coverage_and_credit
          - calculations.higher_standard_credit
          - entities.RepetitiveLossArea.fields.coverage_pct
          - state_machines.HigherStandard.SUBMITTED_to_VERIFIED
        distinguishing_aspect: |
          Mode (b) — order of operations: rounding each area first (16/20 = 80.00 and
          2/2 = 100.00) and averaging gives exactly 90.00 and full credit of 50 points,
          whereas pooling the raw counts (18/22 = 81.82) would fall in the partial tier
          and award 25.
        test_recipe:
          setup:
            - "Community with two DESIGNATED, ANALYZED repetitive loss areas, each linked to one parcel by mapped_area_code."
            - "CrsCycle 2026 in OPEN; area RLA-1 outreach target 20 with 16 deliveries, area RLA-2 outreach target 2 with 2 deliveries, both closed as COMPLETED for cycle year 2026."
            - "A HigherStandard for A330_OUTREACH, documentation_cycle_year 2026, claiming 50 points, in SUBMITTED."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0011", mapped_area_code: "RLA-1", owner_name: "C Owner", owner_email: "c@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop1_id: $.data.id }
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0012", mapped_area_code: "RLA-2", owner_name: "D Owner", owner_email: "d@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop2_id: $.data.id }
            - call: "POST /floodplain/repetitive-loss-areas"
              payload: { community_id: "${comm_id}", area_code: "RLA-1", boundary_description: "Lower Buffalo Bayou bend" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { rla1_id: $.data.id }
            - call: "POST /floodplain/repetitive-loss-areas"
              payload: { community_id: "${comm_id}", area_code: "RLA-2", boundary_description: "Brays Bayou headwaters" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { rla2_id: $.data.id }
            - call: "POST /floodplain/repetitive-loss-areas/${rla1_id}/analyze"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "POST /floodplain/repetitive-loss-areas/${rla1_id}/designate"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "POST /floodplain/repetitive-loss-areas/${rla2_id}/analyze"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "POST /floodplain/repetitive-loss-areas/${rla2_id}/designate"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "POST /floodplain/crs-cycles"
