# =============================================================================
# Scaffold: Genetic & Molecular Testing Lab (Invitae-style)  — task_0411
# §1.0–§1.7 (no scaffold_difficulty_design / scaffold_corner_design keys here)
# =============================================================================

scenario: |
  411. Genetic & Molecular Testing Lab (Invitae style): test catalog & panel,
  requisition & consent, specimen accessioning & QNS reject, sequencing pipeline
  & variant classification, result sign-out & VUS handling, prior-auth & patient
  pay, genetic-counselor referral, incidental-findings policy。

domain_name: genetic-molecular-lab
api_prefix: /lab

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation        # prior-auth ESTIMATE vs sign-out FINAL patient-pay
    - cascading_side_effects          # accession reject -> requisition -> order -> billing
    - derived_field_reconciliation    # order.report_status, order.financial_status
    - optimistic_concurrency          # OCC on Order.version for report-amendment supersede
  difficulty_level: expert

  entity_topology: hybrid
  # Catalog (Panel/Gene) is a flat reference graph (many-to-many via PanelGene);
  # the operational chain TestOrder -> Requisition/Consent/Specimen/Variant/Report
  # is hierarchical; Billing + CounselorReferral cross-cut the order tree.

  state_machine_shape: branching
  # TestOrder fork-joins {sequencing pipeline} and {billing prior-auth};
  # Specimen has a reject->resubmit cycle; Variant classification has a
  # reclassification cycle (VUS<->PATHOGENIC); Report has amend cycle.

  relationship_patterns:
    - one_to_many        # TestOrder -> Specimen, TestOrder -> Variant
    - many_to_many       # Panel <-> Gene via PanelGene
    - cross_aggregate    # CounselorReferral references TestOrder + Report; Billing references TestOrder

  role_model: segregation_of_duties
  # The molecular technologist who classifies a Variant MUST NOT be the lab
  # director who signs out the Report (two-person sign-out integrity control).

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: LabClock
    parent: null
    common_fields: false
    fields:
      - { name: current_utc, type: datetime, source: system, description: "Deterministic system clock; advanced only via /_clock/set_current_utc. Initialized to 2026-01-01T00:00:00.000Z on first boot." }

  - name: Gene
    parent: null
    common_fields: true
    fields:
      - { name: symbol, type: string, source: input, description: "HGNC gene symbol, e.g. BRCA1. Unique across all Gene rows (case-sensitive)." }
      - { name: is_acmg_reportable, type: boolean, source: input, default: false, description: "True if gene is on the ACMG secondary-findings list; governs incidental-findings policy." }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED. Starts ACTIVE." }

  - name: Panel
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Panel display name, e.g. 'Hereditary Cancer Panel'." }
      - { name: list_price_cents, type: integer, source: input, description: "Catalog list price in cents; non-negative integer." }
      - { name: requires_consent, type: boolean, source: input, default: true, description: "If true, an informed-consent record in SIGNED state is required before accessioning." }
      - { name: gene_count, type: integer, source: computed, description: "Count of PanelGene rows with status=INCLUDED for this Panel." }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | RETIRED. Starts DRAFT. Orders may only be placed against PUBLISHED panels." }

  - name: PanelGene
    parent: Panel
    common_fields: true
    fields:
      - { name: panel_id, type: string, source: system, description: "FK -> Panel.id; set from the URL path." }
      - { name: gene_id, type: string, source: input, description: "FK -> Gene.id; the gene included on this panel." }
      - { name: status, type: enum, source: system, description: "INCLUDED | REMOVED. Starts INCLUDED. REMOVED rows are excluded from gene_count." }

  - name: TestOrder
    parent: null
    common_fields: true
    fields:
      - { name: patient_mrn, type: string, source: input, description: "Patient medical record number (opaque string)." }
      - { name: patient_dob, type: string, source: input, description: "Patient date of birth, YYYY-MM-DD; used for minor incidental-findings policy." }
      - { name: panel_id, type: string, source: input, description: "FK -> Panel.id; the ordered panel (must be PUBLISHED at order time)." }
      - { name: ordering_provider_id, type: string, source: input, description: "FK -> Provider.id; the clinician who placed the order." }
      - { name: pipeline_status, type: enum, source: system, description: "ORDERED | REQUISITIONED | ACCESSIONED | SEQUENCING | CLASSIFIED | SIGNED_OUT | CANCELLED. Sequencing dimension." }
      - { name: financial_status, type: enum, source: computed, description: "PENDING | AUTH_REQUESTED | AUTH_APPROVED | AUTH_DENIED | PATIENT_PAY | SETTLED. Billing dimension, evolves independently of pipeline_status." }
      - { name: list_price_cents, type: integer, source: computed, description: "Snapshot of Panel.list_price_cents captured at order creation; immutable thereafter." }
      - { name: estimated_patient_responsibility_cents, type: integer, source: computed, description: "Prior-auth ESTIMATE variant of patient responsibility; see calculations.patient_responsibility (estimate)." }
      - { name: final_patient_responsibility_cents, type: integer, source: computed, description: "Sign-out FINAL variant of patient responsibility; see calculations.patient_responsibility (final)." }
      - { name: report_required_consent, type: boolean, source: computed, description: "= Panel.requires_consent snapshot at creation." }
      - { name: has_reportable_incidental, type: boolean, source: computed, default: false, description: "True once a SIGNED_OUT report contains an ACMG-reportable incidental finding." }
      - { name: cancel_reason, type: string, source: input, default: null, description: "Free-text reason recorded on cancellation." }

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: npi, type: string, source: input, description: "National Provider Identifier; unique across Provider rows." }
      - { name: full_name, type: string, source: input, description: "Ordering provider full name." }

  - name: Requisition
    parent: TestOrder
    common_fields: true
    fields:
      - { name: test_order_id, type: string, source: system, description: "FK -> TestOrder.id; set from the URL path. One Requisition per TestOrder." }
      - { name: clinical_indication, type: string, source: input, description: "ICD-like clinical indication / reason for testing." }
      - { name: insurance_payer, type: enum, source: input, description: "MEDICARE | COMMERCIAL | SELF_PAY. Drives prior-auth requirement and coinsurance." }
      - { name: status, type: enum, source: system, description: "PENDING | SUBMITTED | VOID. Starts PENDING; SUBMITTED advances the order to REQUISITIONED." }

  - name: Consent
    parent: TestOrder
    common_fields: true
    fields:
      - { name: test_order_id, type: string, source: system, description: "FK -> TestOrder.id; set from the URL path." }
      - { name: incidental_findings_opt_in, type: boolean, source: input, description: "Patient election to receive ACMG secondary (incidental) findings." }
      - { name: signed_by_name, type: string, source: input, description: "Name of the consenting party (patient or legal guardian)." }
      - { name: status, type: enum, source: system, description: "DRAFT | SIGNED | REVOKED. Starts DRAFT. Accessioning requires SIGNED when the panel requires_consent." }

  - name: Specimen
    parent: TestOrder
    common_fields: true
    fields:
      - { name: test_order_id, type: string, source: system, description: "FK -> TestOrder.id; set from the URL path." }
      - { name: specimen_type, type: enum, source: input, description: "BLOOD | SALIVA | TISSUE." }
      - { name: collected_at, type: datetime, source: input, description: "ISO 8601 UTC collection timestamp." }
      - { name: received_at, type: datetime, source: system, description: "ISO 8601 UTC accessioning receipt timestamp = LabClock.current_utc at accession." }
      - { name: quantity_ng, type: number, source: input, description: "DNA yield in nanograms; compared against the panel's minimum for QNS (quantity-not-sufficient) screening." }
      - { name: status, type: enum, source: system, description: "RECEIVED | ACCESSIONED | QNS_REJECTED | SUPERSEDED. Starts RECEIVED. QNS_REJECTED specimens may be replaced by a resubmission." }
      - { name: superseded_by_specimen_id, type: string, source: system, default: null, description: "FK -> Specimen.id; set on a QNS_REJECTED specimen when a replacement is accessioned." }

  - name: Variant
    parent: TestOrder
    common_fields: true
    fields:
      - { name: test_order_id, type: string, source: system, description: "FK -> TestOrder.id; set from the URL path." }
      - { name: gene_id, type: string, source: input, description: "FK -> Gene.id; the gene the variant was called in (must be INCLUDED on the order's panel)." }
      - { name: hgvs, type: string, source: input, description: "HGVS variant nomenclature string, e.g. c.68_69delAG." }
      - { name: is_incidental, type: boolean, source: computed, description: "True when gene_id is NOT on the order's panel gene list but IS ACMG-reportable (a secondary finding)." }
      - { name: classification, type: enum, source: system, description: "UNCLASSIFIED | BENIGN | LIKELY_BENIGN | VUS | LIKELY_PATHOGENIC | PATHOGENIC | RECLASSIFIED. Five-tier ACMG ladder plus terminal RECLASSIFIED." }
      - { name: classified_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the MolecularTechnologist who set the latest classification (segregation-of-duties anchor)." }

  - name: Report
    parent: TestOrder
    common_fields: true
    fields:
      - { name: test_order_id, type: string, source: system, description: "FK -> TestOrder.id; set from the URL path. One non-superseded Report per TestOrder." }
      - { name: reportable_variant_ids, type: array, source: computed, description: "Ids of Variants included in the report body per the reportability rule." }
      - { name: incidental_disclosed, type: boolean, source: computed, description: "True if at least one ACMG-reportable incidental finding is disclosed (per consent opt-in policy)." }
      - { name: signed_out_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the LabDirector who signed out the report." }
      - { name: amends_report_id, type: string, source: system, default: null, description: "FK -> Report.id; set on an amended report pointing to the prior version it supersedes." }
      - { name: status, type: enum, source: system, description: "DRAFT | SIGNED_OUT | AMENDED. Starts DRAFT. AMENDED is the terminal superseded state of a prior version." }

  - name: Billing
    parent: TestOrder
    common_fields: true
    fields:
      - { name: test_order_id, type: string, source: system, description: "FK -> TestOrder.id; set from the URL path. One Billing per TestOrder." }
      - { name: allowed_amount_cents, type: integer, source: input, default: null, description: "Payer-allowed amount returned with an auth decision; basis for coinsurance." }
      - { name: coinsurance_collected_cents, type: integer, source: computed, default: 0, description: "Patient coinsurance/self-pay collected; conserved-quantity ledger field." }
      - { name: writeoff_cents, type: integer, source: computed, default: 0, description: "Amount written off on denial-to-self-pay conversion or cancellation reversal." }
      - { name: status, type: enum, source: system, description: "OPEN | AUTH_REQUESTED | AUTH_APPROVED | AUTH_DENIED | PATIENT_PAY | SETTLED | REVERSED. Mirrors and drives TestOrder.financial_status." }

  - name: Sequencer
    parent: null
    common_fields: true
    fields:
      - { name: instrument_name, type: string, source: input, description: "Sequencer instrument label, e.g. 'NovaSeq-A'. Unique." }
      - { name: turnaround_buffer_minutes, type: integer, source: input, default: 60, description: "Minimum gap (minutes) required between two runs on this instrument (closed-interval + buffer overlap semantics)." }
      - { name: status, type: enum, source: system, description: "ONLINE | OFFLINE. Starts ONLINE." }

  - name: SequencerRun
    parent: Sequencer
    common_fields: true
    fields:
      - { name: sequencer_id, type: string, source: system, description: "FK -> Sequencer.id; set from the URL path." }
      - { name: test_order_id, type: string, source: input, description: "FK -> TestOrder.id; the order whose accessioned specimen is loaded on this run." }
      - { name: window_start, type: datetime, source: input, description: "ISO 8601 UTC run start (inclusive). Closed-interval [window_start, window_end]." }
      - { name: window_end, type: datetime, source: input, description: "ISO 8601 UTC run end (inclusive). Must be strictly after window_start." }
      - { name: status, type: enum, source: system, description: "SCHEDULED | RUNNING | DONE | ABORTED. Starts SCHEDULED." }

  - name: GeneticCounselorProfile
    parent: null
    common_fields: true
    fields:
      - { name: counselor_name, type: string, source: input, description: "Genetic counselor display name. Unique." }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE. Starts ACTIVE." }

  - name: CounselorReferral
    parent: TestOrder
    common_fields: true
    fields:
      - { name: test_order_id, type: string, source: system, description: "FK -> TestOrder.id; set from the URL path." }
      - { name: counselor_id, type: string, source: input, description: "FK -> GeneticCounselorProfile.id; the assigned counselor (schedulable resource)." }
      - { name: triggering_variant_id, type: string, source: input, default: null, description: "FK -> Variant.id; the variant that motivated the referral (optional)." }
      - { name: reason, type: enum, source: input, description: "PATHOGENIC_RESULT | VUS_FOLLOWUP | INCIDENTAL_FINDING | PATIENT_REQUEST." }
      - { name: slot_start, type: datetime, source: input, default: null, description: "ISO 8601 UTC appointment start (set at schedule). Half-open interval [slot_start, slot_end): adjacency allowed." }
      - { name: slot_end, type: datetime, source: input, default: null, description: "ISO 8601 UTC appointment end (set at schedule). Must be strictly after slot_start." }
      - { name: status, type: enum, source: system, description: "REQUESTED | SCHEDULED | COMPLETED | CANCELLED. Starts REQUESTED." }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- TestOrder: pipeline dimension (sequencing) ----
  - entity: TestOrder
    initial_state: ORDERED
    terminal_states: [SIGNED_OUT, CANCELLED]
    note: |
      pipeline_status is one of two PARALLEL dimensions on TestOrder. The other,
      financial_status, evolves independently and is modeled in the Billing
      machine below (mirrored onto TestOrder.financial_status). The two
      dimensions never gate each other except at SIGN_OUT (see preconditions).
    transitions:
      - from: ORDERED
        to: REQUISITIONED
        trigger: "POST /lab/test-orders/{orderId}/requisition/submit"
        actor: LabIntake
        preconditions:
          - "TestOrder.pipeline_status == ORDERED (ERR_ORDER_BAD_PIPELINE_STATE)"
          - "A Requisition exists in PENDING status (ERR_REQUISITION_NOT_FOUND)"
        side_effects:
          - "Requisition.status PENDING -> SUBMITTED"
          - "If Requisition.insurance_payer != SELF_PAY: create/advance Billing prior-auth — Billing.status OPEN -> AUTH_REQUESTED and TestOrder.financial_status -> AUTH_REQUESTED (cascade hop 1)"
          - "Compute estimated_patient_responsibility_cents via patient_responsibility(estimate) (cascade hop 2)"

      - from: REQUISITIONED
        to: ACCESSIONED
        trigger: "POST /lab/test-orders/{orderId}/specimens/{specimenId}/accession"
        actor: AccessioningTech
        preconditions:
          - "TestOrder.pipeline_status == REQUISITIONED (ERR_ORDER_BAD_PIPELINE_STATE)"
          - "Specimen.status == RECEIVED (ERR_SPECIMEN_BAD_STATE)"
          - "If Panel.requires_consent: a Consent in SIGNED status exists (ERR_CONSENT_REQUIRED)"
          - "Specimen.quantity_ng >= QNS_MIN_NG[specimen_type] (else QNS reject branch, ERR_SPECIMEN_QNS)"
        side_effects:
          - "Specimen.received_at = LabClock.current_utc"
          - "Specimen.status RECEIVED -> ACCESSIONED"
          - "TestOrder.pipeline_status -> ACCESSIONED"
        note: "Sufficient-quantity branch of the accession fork."

      - from: REQUISITIONED
        to: REQUISITIONED
        trigger: "POST /lab/test-orders/{orderId}/specimens/{specimenId}/accession"
        actor: AccessioningTech
        preconditions:
          - "TestOrder.pipeline_status == REQUISITIONED (ERR_ORDER_BAD_PIPELINE_STATE)"
          - "Specimen.status == RECEIVED (ERR_SPECIMEN_BAD_STATE)"
          - "Specimen.quantity_ng < QNS_MIN_NG[specimen_type] (QNS reject branch)"
        side_effects:
          - "Specimen.status RECEIVED -> QNS_REJECTED"
          - "TestOrder.pipeline_status stays REQUISITIONED (order awaits a resubmitted specimen)"
        note: "QNS (quantity-not-sufficient) reject branch; the call returns 201/200 with the rejected specimen, NOT an error — QNS is a recorded clinical outcome, not a validation failure. The order does not advance."

      - from: ACCESSIONED
        to: SEQUENCING
        trigger: "POST /lab/test-orders/{orderId}/sequencing/start"
        actor: AccessioningTech
        preconditions:
          - "TestOrder.pipeline_status == ACCESSIONED (ERR_ORDER_BAD_PIPELINE_STATE)"
        side_effects:
          - "TestOrder.pipeline_status -> SEQUENCING"

      - from: SEQUENCING
        to: CLASSIFIED
        trigger: "POST /lab/test-orders/{orderId}/classification/complete"
        actor: MolecularTechnologist
        preconditions:
          - "TestOrder.pipeline_status == SEQUENCING (ERR_ORDER_BAD_PIPELINE_STATE)"
          - "Every Variant on the order has classification != UNCLASSIFIED (ERR_UNCLASSIFIED_VARIANTS_EXIST)"
        side_effects:
          - "TestOrder.pipeline_status -> CLASSIFIED"

      - from: CLASSIFIED
        to: SIGNED_OUT
        trigger: "POST /lab/test-orders/{orderId}/reports/{reportId}/sign-out"
        actor: LabDirector
        preconditions:
          - "TestOrder.pipeline_status == CLASSIFIED (ERR_ORDER_BAD_PIPELINE_STATE)"
          - "Report.status == DRAFT (ERR_REPORT_BAD_STATE)"
          - "TestOrder.financial_status IN {AUTH_APPROVED, PATIENT_PAY, SETTLED} (ERR_BILLING_NOT_CLEARED) — billing dimension gate, the only cross-dimension coupling"
          - "X-User-ID != every Variant.classified_by_user_id on the order (ERR_SEGREGATION_OF_DUTIES)"
          - "No Variant.classification == VUS unless a CounselorReferral with reason=VUS_FOLLOWUP exists in REQUESTED/SCHEDULED/COMPLETED (ERR_VUS_REFERRAL_REQUIRED)"
        side_effects:
          - "Compute Report.reportable_variant_ids and Report.incidental_disclosed via reportability rule + incidental_findings_policy"
          - "Report.status DRAFT -> SIGNED_OUT; signed_out_by_user_id = X-User-ID"
          - "TestOrder.pipeline_status -> SIGNED_OUT"
          - "If any disclosed reportable_variant is incidental: TestOrder.has_reportable_incidental = true (cascade hop A1)"
          - "Compute final_patient_responsibility_cents via patient_responsibility(final) (cascade hop A2)"
          - "If financial_status == AUTH_APPROVED: Billing.status AUTH_APPROVED -> PATIENT_PAY, financial_status -> PATIENT_PAY, set coinsurance owed (cascade hop A3)"

      - from: ORDERED
        to: CANCELLED
        trigger: "POST /lab/test-orders/{orderId}/cancel"
        actor: LabIntake
        preconditions:
          - "TestOrder.pipeline_status IN {ORDERED, REQUISITIONED, ACCESSIONED, SEQUENCING, CLASSIFIED} (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "TestOrder.pipeline_status -> CANCELLED; cancel_reason recorded"
          - "Any Requisition in PENDING/SUBMITTED -> VOID (cascade hop 1)"
          - "If Billing.status IN {AUTH_REQUESTED, AUTH_APPROVED, PATIENT_PAY}: Billing.status -> REVERSED; writeoff_cents += (allowed_amount_cents - coinsurance_collected_cents) clamped at 0; coinsurance_collected_cents -> 0; financial_status -> SETTLED (cascade hop 2)"
          - "Any CounselorReferral in REQUESTED/SCHEDULED -> CANCELLED (cascade hop 3)"
        note: "Single CANCELLED row covers all non-terminal from-states; only non-terminal children are touched (conditional cascade)."

  # ---- Billing: financial dimension (parallel to pipeline) ----
  - entity: Billing
    initial_state: OPEN
    terminal_states: [SETTLED, REVERSED]
    note: "Mirrors onto TestOrder.financial_status. Prior-auth fork is independent of the sequencing pipeline until SIGN_OUT."
    transitions:
      - from: OPEN
        to: AUTH_REQUESTED
        trigger: "system (on Requisition submit when insurance_payer != SELF_PAY)"
        actor: system
        preconditions:
          - "Requisition.insurance_payer != SELF_PAY"
        side_effects:
          - "TestOrder.financial_status -> AUTH_REQUESTED"

      - from: OPEN
        to: PATIENT_PAY
        trigger: "system (on Requisition submit when insurance_payer == SELF_PAY)"
        actor: system
        preconditions:
          - "Requisition.insurance_payer == SELF_PAY"
        side_effects:
          - "TestOrder.financial_status -> PATIENT_PAY"
          - "allowed_amount_cents := TestOrder.list_price_cents"

      - from: AUTH_REQUESTED
        to: AUTH_APPROVED
        trigger: "POST /lab/test-orders/{orderId}/billing/auth-decision"
        actor: BillingSpecialist
        preconditions:
          - "Billing.status == AUTH_REQUESTED (ERR_BILLING_BAD_STATE)"
          - "request decision == APPROVED; allowed_amount_cents present and 0 <= allowed_amount_cents <= TestOrder.list_price_cents (ERR_ALLOWED_AMOUNT_INVALID)"
        side_effects:
          - "Billing.allowed_amount_cents = request.allowed_amount_cents"
          - "Billing.status -> AUTH_APPROVED; TestOrder.financial_status -> AUTH_APPROVED"
          - "Recompute estimated_patient_responsibility_cents via patient_responsibility(estimate)"

      - from: AUTH_REQUESTED
        to: AUTH_DENIED
        trigger: "POST /lab/test-orders/{orderId}/billing/auth-decision"
        actor: BillingSpecialist
        preconditions:
          - "Billing.status == AUTH_REQUESTED (ERR_BILLING_BAD_STATE)"
          - "request decision == DENIED"
        side_effects:
          - "Billing.status -> AUTH_DENIED; TestOrder.financial_status -> AUTH_DENIED"

      - from: AUTH_DENIED
        to: PATIENT_PAY
        trigger: "POST /lab/test-orders/{orderId}/billing/convert-self-pay"
        actor: BillingSpecialist
        preconditions:
          - "Billing.status == AUTH_DENIED (ERR_BILLING_BAD_STATE)"
        side_effects:
          - "writeoff_cents += allowed_amount_cents (denied payer portion written off); allowed_amount_cents := TestOrder.list_price_cents"
          - "Billing.status -> PATIENT_PAY; TestOrder.financial_status -> PATIENT_PAY"
          - "Recompute estimated_patient_responsibility_cents via patient_responsibility(estimate)"

      - from: PATIENT_PAY
        to: SETTLED
        trigger: "POST /lab/test-orders/{orderId}/billing/collect"
        actor: BillingSpecialist
        preconditions:
          - "Billing.status == PATIENT_PAY (ERR_BILLING_BAD_STATE)"
          - "request.amount_cents == TestOrder.final_patient_responsibility_cents when report SIGNED_OUT, else == TestOrder.estimated_patient_responsibility_cents (ERR_COLLECT_AMOUNT_MISMATCH)"
        side_effects:
          - "coinsurance_collected_cents += request.amount_cents"
          - "Billing.status -> SETTLED; TestOrder.financial_status -> SETTLED"

  # ---- Specimen: reject->resubmit cycle ----
  - entity: Specimen
    initial_state: RECEIVED
    terminal_states: [ACCESSIONED, SUPERSEDED]
    transitions:
      - from: RECEIVED
        to: ACCESSIONED
        trigger: "POST /lab/test-orders/{orderId}/specimens/{specimenId}/accession (sufficient quantity)"
        actor: AccessioningTech
        preconditions:
          - "quantity_ng >= QNS_MIN_NG[specimen_type]"
        side_effects:
          - "received_at = LabClock.current_utc"

      - from: RECEIVED
        to: QNS_REJECTED
        trigger: "POST /lab/test-orders/{orderId}/specimens/{specimenId}/accession (insufficient quantity)"
        actor: AccessioningTech
        preconditions:
          - "quantity_ng < QNS_MIN_NG[specimen_type]"
        side_effects: []

      - from: QNS_REJECTED
        to: SUPERSEDED
        trigger: "system (a replacement specimen for the same order is accessioned successfully)"
        actor: system
        preconditions:
          - "A newer Specimen on the same TestOrder transitions RECEIVED -> ACCESSIONED"
        side_effects:
          - "superseded_by_specimen_id = the replacement specimen id"
        note: "Cycle: RECEIVED -> QNS_REJECTED -> (new specimen) -> SUPERSEDED, while the new specimen runs RECEIVED -> ACCESSIONED."

  # ---- Variant: classification with reclassification cycle (VUS <-> PATHOGENIC) ----
  - entity: Variant
    initial_state: UNCLASSIFIED
    terminal_states: [RECLASSIFIED]
    note: "Branching+cyclic: VUS and PATHOGENIC/LIKELY_PATHOGENIC are non-terminal and may be reclassified to each other any number of times; the explicit RECLASSIFIED archive state freezes a superseded classification when an amendment supersedes the report."
    transitions:
      - from: UNCLASSIFIED
        to: VUS
        trigger: "POST /lab/test-orders/{orderId}/variants/{variantId}/classify"
        actor: MolecularTechnologist
        preconditions:
          - "TestOrder.pipeline_status == SEQUENCING (ERR_ORDER_BAD_PIPELINE_STATE)"
          - "request.classification IN {BENIGN, LIKELY_BENIGN, VUS, LIKELY_PATHOGENIC, PATHOGENIC} (ERR_INVALID_CLASSIFICATION)"
        side_effects:
          - "classification = request.classification; classified_by_user_id = X-User-ID"
        note: "One transition row stands for all five initial classification targets from UNCLASSIFIED."

      - from: VUS
        to: PATHOGENIC
        trigger: "POST /lab/test-orders/{orderId}/variants/{variantId}/classify"
        actor: MolecularTechnologist
        preconditions:
          - "TestOrder.pipeline_status IN {SEQUENCING, CLASSIFIED} (ERR_ORDER_BAD_PIPELINE_STATE)"
          - "request.classification IN {BENIGN, LIKELY_BENIGN, VUS, LIKELY_PATHOGENIC, PATHOGENIC} (ERR_INVALID_CLASSIFICATION)"
        side_effects:
          - "classification = request.classification; classified_by_user_id = X-User-ID"
          - "If order was CLASSIFIED, it stays CLASSIFIED (reclassification does not regress pipeline)"
        note: "Reclassification cycle: VUS->PATHOGENIC and PATHOGENIC->VUS are both allowed (same endpoint, symmetric)."

      - from: PATHOGENIC
        to: VUS
        trigger: "POST /lab/test-orders/{orderId}/variants/{variantId}/classify"
        actor: MolecularTechnologist
        preconditions:
          - "TestOrder.pipeline_status IN {SEQUENCING, CLASSIFIED} (ERR_ORDER_BAD_PIPELINE_STATE)"
          - "request.classification IN {BENIGN, LIKELY_BENIGN, VUS, LIKELY_PATHOGENIC, PATHOGENIC} (ERR_INVALID_CLASSIFICATION)"
        side_effects:
          - "classification = request.classification; classified_by_user_id = X-User-ID"

      - from: VUS
        to: RECLASSIFIED
        trigger: "system (report amendment supersedes the prior report)"
        actor: system
        preconditions:
          - "The order's SIGNED_OUT Report is being amended and this variant's classification changed in the amendment"
        side_effects: []
        note: "Archive transition freezing a superseded classification at amendment time."

  # ---- Report: draft -> sign-out, amend cycle ----
  - entity: Report
    initial_state: DRAFT
    terminal_states: [AMENDED]
    note: "SIGNED_OUT is non-terminal because an amendment creates a successor Report and moves the prior to AMENDED (supersede)."
    transitions:
      - from: DRAFT
        to: SIGNED_OUT
        trigger: "POST /lab/test-orders/{orderId}/reports/{reportId}/sign-out"
        actor: LabDirector
        preconditions:
          - "Report.status == DRAFT (ERR_REPORT_BAD_STATE)"
          - "All TestOrder sign-out preconditions hold (see TestOrder CLASSIFIED->SIGNED_OUT)"
        side_effects:
          - "signed_out_by_user_id = X-User-ID; status -> SIGNED_OUT (see TestOrder side effects)"

      - from: SIGNED_OUT
        to: AMENDED
        trigger: "POST /lab/test-orders/{orderId}/reports/{reportId}/amend"
        actor: LabDirector
        preconditions:
          - "Report.status == SIGNED_OUT (ERR_REPORT_BAD_STATE)"
          - "expected_test_order_version matches TestOrder.version (ERR_STALE_ORDER_VERSION) — OCC supersede guard"
        side_effects:
          - "Create successor Report with amends_report_id = this report id, status SIGNED_OUT, recomputed reportable_variant_ids/incidental_disclosed"
          - "This report.status SIGNED_OUT -> AMENDED"
          - "For each Variant whose classification differs from the prior report: Variant -> RECLASSIFIED then re-set to the new classification value recorded on the successor (archive prior)"
          - "increments TestOrder.version by 1"

  # ---- SequencerRun: instrument resource, closed-interval + buffer overlap ----
  - entity: SequencerRun
    initial_state: SCHEDULED
    terminal_states: [DONE, ABORTED]
    transitions:
      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /lab/sequencers/{sequencerId}/runs/{runId}/start"
        actor: AccessioningTech
        preconditions:
          - "SequencerRun.status == SCHEDULED (ERR_RUN_BAD_STATE)"
          - "TestOrder.pipeline_status == SEQUENCING (ERR_ORDER_BAD_PIPELINE_STATE)"
        side_effects: []
      - from: RUNNING
        to: DONE
        trigger: "POST /lab/sequencers/{sequencerId}/runs/{runId}/finish"
        actor: AccessioningTech
        preconditions:
          - "SequencerRun.status == RUNNING (ERR_RUN_BAD_STATE)"
        side_effects: []
      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /lab/sequencers/{sequencerId}/runs/{runId}/abort"
        actor: AccessioningTech
        preconditions:
          - "SequencerRun.status IN {SCHEDULED, RUNNING} (ERR_RUN_BAD_STATE)"
        side_effects:
          - "Aborted runs free their instrument window for re-scheduling (excluded from overlap checks)."

  # ---- CounselorReferral ----
  - entity: CounselorReferral
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /lab/test-orders/{orderId}/referrals/{referralId}/schedule"
        actor: GeneticCounselor
        preconditions:
          - "CounselorReferral.status == REQUESTED (ERR_REFERRAL_BAD_STATE)"
          - "slot_end strictly after slot_start (ERR_INVALID_REQUEST)"
          - "No other CounselorReferral for the same counselor_id in SCHEDULED status whose [slot_start, slot_end) half-open interval overlaps [request.slot_start, request.slot_end) (ERR_COUNSELOR_SLOT_CONFLICT). Adjacency (one ends exactly when the other starts) is permitted."
        side_effects:
          - "slot_start, slot_end recorded; status REQUESTED -> SCHEDULED"

      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /lab/test-orders/{orderId}/referrals/{referralId}/complete"
        actor: GeneticCounselor
        preconditions:
          - "CounselorReferral.status == SCHEDULED (ERR_REFERRAL_BAD_STATE)"
        side_effects: []

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /lab/test-orders/{orderId}/referrals/{referralId}/cancel"
        actor: GeneticCounselor
        preconditions:
          - "CounselorReferral.status IN {REQUESTED, SCHEDULED} (ERR_REFERRAL_BAD_STATE)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: report-amend-stale-order
    parent_entity: TestOrder
    write_endpoint: "POST /lab/test-orders/{orderId}/reports/{reportId}/amend"
    occ_field: "expected_test_order_version"
    description: |
      Amending a SIGNED_OUT report creates a successor report that legitimately
      supersedes the prior version. A second amend that still carries the
      test-order version the client observed before the first amend is rejected
      as stale: the first amend already incremented TestOrder.version (and moved
      the prior report to AMENDED), so the second client's view of the order is
      out of date. This is the canonical CREATE-with-supersede race reduced to a
      stale-version check.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: patient_responsibility
    trigger: "ESTIMATE: on requisition submit, on auth-decision APPROVED, on convert-self-pay. FINAL: on report sign-out."
    algorithm: tiered_pricing
    formula: |
      Let base = the coinsurance base:
        if Billing.status == PATIENT_PAY (self-pay or converted): base = allowed_amount_cents (= list_price_cents)
        else (AUTH_APPROVED, payer covers): base = allowed_amount_cents
      Coinsurance rate by payer (tiered):
        MEDICARE   -> 0.20
        COMMERCIAL -> 0.10
        SELF_PAY   -> 1.00  (patient owes the full allowed/list amount)
      gross = round_half_up(base * rate)            # cents, half-up at the cent
      Apply patient-assistance cap: capped = min(gross, ASSISTANCE_CAP_CENTS)
      ESTIMATE variant (estimated_patient_responsibility_cents):
        result = capped                              # no incidental surcharge known yet
      FINAL variant (final_patient_responsibility_cents), computed at sign-out:
        surcharge = INCIDENTAL_SURCHARGE_CENTS if Report.incidental_disclosed else 0
        result = min(capped + surcharge, ASSISTANCE_CAP_CENTS_FINAL)
      EVALUATION ORDER is pinned: compute gross, then cap, then (final only) add
      surcharge, then re-clamp to the FINAL cap. Rounding happens once, at gross.
    input_set: "Single Billing + TestOrder pair; payer from the order's Requisition."
    constants:
      MEDICARE_RATE: 0.20
      COMMERCIAL_RATE: 0.10
      SELF_PAY_RATE: 1.00
      ASSISTANCE_CAP_CENTS: 50000        # estimate cap: $500.00
      ASSISTANCE_CAP_CENTS_FINAL: 60000  # final cap: $600.00 (room for surcharge)
      INCIDENTAL_SURCHARGE_CENTS: 7500   # $75.00 additional counseling/disclosure fee
    precision: "integer cents; round_half_up at the single gross-rounding step"
    variants:
      - name: estimate
        when: "Prior-auth phase (requisition submit / auth approve / self-pay conversion). Writes estimated_patient_responsibility_cents."
        difference: "No incidental surcharge; clamps to ASSISTANCE_CAP_CENTS (50000). Incidental disclosure is unknown pre-sign-out."
      - name: final
        when: "Report sign-out. Writes final_patient_responsibility_cents."
        difference: "Adds INCIDENTAL_SURCHARGE_CENTS when the signed-out report discloses an incidental finding, then clamps to ASSISTANCE_CAP_CENTS_FINAL (60000). Same base/rate inputs as estimate but a structurally different result for the same order."

  - name: variant_pathogenicity_score
    trigger: "On variant classify and on classification/complete; recomputed on reclassification."
    algorithm: weighted_scoring
    formula: |
      Per ACMG-style weighting, map each classified Variant on the order to points:
        BENIGN -> 0, LIKELY_BENIGN -> 1, VUS -> 2, LIKELY_PATHOGENIC -> 4, PATHOGENIC -> 8
      Incidental (secondary-finding) variants are weighted at INCIDENTAL_WEIGHT x their points.
      raw = sum over reportable+incidental classified variants of (points * (INCIDENTAL_WEIGHT if is_incidental else 1))
      Normalize to a 0..100 risk index against the panel's gene_count:
        denom = max(gene_count, 1) * 8        # 8 = max per-gene points
        risk_index = round_half_up( min(raw / denom, 1.0) * 100 )
      ORDER PINNED: sum first (accumulate raw across variants in created_at ASC
      order, tie-break by variant id only never as a value source), THEN divide,
      THEN multiply by 100, THEN round once. (Sum-then-round, NOT round-per-variant.)
    input_set: "All Variants on the order whose classification != UNCLASSIFIED and != RECLASSIFIED."
    constants:
      INCIDENTAL_WEIGHT: 2
      BENIGN_PTS: 0
      LIKELY_BENIGN_PTS: 1
      VUS_PTS: 2
      LIKELY_PATHOGENIC_PTS: 4
      PATHOGENIC_PTS: 8
      MAX_PER_GENE_PTS: 8
    precision: "integer 0..100; round_half_up once after the final multiply (sum-then-round, order matters)"

  - name: reportability_selection
    trigger: "On report sign-out and on report amend; populates Report.reportable_variant_ids and incidental_disclosed."
    algorithm: aggregation
    formula: |
      Candidate set: all Variants on the order with classification != UNCLASSIFIED
      and != RECLASSIFIED, ordered by created_at ASC (tie-break by id, used only
      for stable ordering, never as a decision value).
      Primary reportables: variants where is_incidental == false AND
        classification IN {VUS, LIKELY_PATHOGENIC, PATHOGENIC}
        (BENIGN / LIKELY_BENIGN are NOT placed in the report body).
      Incidental reportables: variants where is_incidental == true, governed by
        incidental_findings_policy (see next calculation). Included only when the
        policy admits them.
      Report.reportable_variant_ids = primary reportables ++ admitted incidental reportables.
      Report.incidental_disclosed = (count of admitted incidental reportables > 0).
    input_set: "Variants on the order, status-filtered as above; Consent opt-in; patient minor status."

  - name: qns_sufficiency
    trigger: "On POST /lab/test-orders/{orderId}/specimens/{specimenId}/accession."
    algorithm: threshold
    formula: |
      Look up the per-type minimum yield:
        QNS_MIN_NG = { BLOOD: 50, SALIVA: 30, TISSUE: 100 }   # nanograms
      sufficient IFF specimen.quantity_ng >= QNS_MIN_NG[specimen.specimen_type]
      Boundary is INCLUSIVE: quantity_ng exactly equal to the minimum is
      SUFFICIENT (>= not >). Sufficient -> ACCESSIONED branch; otherwise the
      QNS_REJECTED branch (recorded outcome, returns the rejected specimen, not
      an error).
    input_set: "Single Specimen + its specimen_type minimum."
    constants:
      QNS_MIN_NG_BLOOD: 50
      QNS_MIN_NG_SALIVA: 30
      QNS_MIN_NG_TISSUE: 100

  - name: sequencer_run_overlap
    trigger: "On POST /lab/sequencers/{sequencerId}/runs (scheduling a run)."
    algorithm: interval_merge
    formula: |
      Reject the new run if, for the SAME sequencer, there exists another
      SequencerRun in status IN {SCHEDULED, RUNNING} (ABORTED/DONE excluded)
      whose CLOSED interval [window_start, window_end] comes within
      turnaround_buffer_minutes of the new run's closed interval. Concretely,
      with B = sequencer.turnaround_buffer_minutes:
        conflict IFF NOT ( new.window_end + B <= existing.window_start
                           OR existing.window_end + B <= new.window_start )
      Closed-interval + buffer geometry: two runs that merely touch
      (new.window_end == existing.window_start) DO conflict, and runs separated
      by exactly B minutes also conflict (<= boundary, not <).
    input_set: "SequencerRuns on the same sequencer with status IN {SCHEDULED, RUNNING}."
    constants:
      DEFAULT_TURNAROUND_BUFFER_MINUTES: 60

  - name: counselor_slot_overlap
    trigger: "On POST /lab/test-orders/{orderId}/referrals/{referralId}/schedule."
    algorithm: interval_merge
    formula: |
      Reject scheduling if, for the SAME counselor_id, there exists another
      CounselorReferral in status == SCHEDULED whose HALF-OPEN interval
      [slot_start, slot_end) overlaps the new [slot_start, slot_end):
        conflict IFF ( new.slot_start < existing.slot_end
                       AND existing.slot_start < new.slot_end )
      Half-open geometry: adjacency is allowed — new.slot_start ==
      existing.slot_end is NOT a conflict (boundary excluded). NO buffer.
      This is geometrically distinct from sequencer_run_overlap (closed +
      buffer); the two rules sit on different resource entities.
    input_set: "CounselorReferrals for the same counselor_id with status == SCHEDULED."

  - name: incidental_findings_policy
    trigger: "Evaluated inside reportability_selection at sign-out / amend."
    algorithm: threshold
    formula: |
      For each incidental (is_incidental==true) classified Variant whose
      classification IN {LIKELY_PATHOGENIC, PATHOGENIC}:
        Determine patient age at sign-out: age = floor((LabClock.current_utc - patient_dob) / 365.2425 days).
        is_minor = age < ADULT_AGE_YEARS
        Admit the incidental finding IFF:
          (Consent.incidental_findings_opt_in == true) AND
          ( (NOT is_minor) OR (is_minor AND gene.is_acmg_reportable AND classification == PATHOGENIC) )
      Rationale: adults who opted in receive all P/LP secondary findings; minors
      who opted in receive ONLY PATHOGENIC ACMG findings (LIKELY_PATHOGENIC and
      VUS incidental findings are withheld for minors). VUS incidental findings
      are never auto-disclosed regardless of age.
      Boundary: age == ADULT_AGE_YEARS exactly is an ADULT (>= boundary, not >).
    input_set: "Incidental variants + Consent.incidental_findings_opt_in + patient_dob + Gene.is_acmg_reportable + LabClock.current_utc."
    constants:
      ADULT_AGE_YEARS: 18

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 401
    applies_to: "all endpoints except /_clock/* which still require headers"

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Every resource id in the path exists, validated left-to-right"
    error_id: "ERR_*_NOT_FOUND (resource-specific)"
    http_status: 404
    applies_to: "all path-parameterized endpoints"

  - priority: 4
    category: state
    check: "Optimistic-concurrency: when expected_test_order_version is supplied, it must equal TestOrder.version (checked before business logic)"
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
    applies_to: "POST /lab/test-orders/{orderId}/reports/{reportId}/amend"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: "ERR_ORDER_BAD_PIPELINE_STATE / ERR_SPECIMEN_BAD_STATE / ERR_REPORT_BAD_STATE / ERR_BILLING_BAD_STATE / ERR_REFERRAL_BAD_STATE"
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: business_constraint
    check: "Orders may only reference a PUBLISHED panel; variants may only reference a Gene that is INCLUDED on the order's panel UNLESS the gene is ACMG-reportable (then it is an incidental finding)"
    error_id: ERR_PANEL_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /lab/test-orders, POST /lab/test-orders/{orderId}/variants"

  - priority: 7
    category: business_safety
    check: "Consent integrity: when the ordered panel requires_consent, a Consent in SIGNED status must exist before accessioning"
    error_id: ERR_CONSENT_REQUIRED
    http_status: 409
    applies_to: "POST /lab/test-orders/{orderId}/specimens/{specimenId}/accession"

  - priority: 8
    category: business_safety
    check: "Segregation of duties: the signing LabDirector (X-User-ID) must not equal any Variant.classified_by_user_id on the order"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /lab/test-orders/{orderId}/reports/{reportId}/sign-out"

  - priority: 9
    category: business_safety
    check: "VUS handling: a report cannot be signed out while any Variant is VUS unless a CounselorReferral (reason=VUS_FOLLOWUP) exists in REQUESTED/SCHEDULED/COMPLETED"
    error_id: ERR_VUS_REFERRAL_REQUIRED
    http_status: 409
    applies_to: "POST /lab/test-orders/{orderId}/reports/{reportId}/sign-out"

  - priority: 10
    category: business_constraint
    check: "No UNCLASSIFIED variants remain when completing classification"
    error_id: ERR_UNCLASSIFIED_VARIANTS_EXIST
    http_status: 409
    applies_to: "POST /lab/test-orders/{orderId}/classification/complete"

  - priority: 11
    category: business_constraint
    check: "Classification value must be one of the five ACMG tiers (not UNCLASSIFIED/RECLASSIFIED)"
    error_id: ERR_INVALID_CLASSIFICATION
    http_status: 422
    applies_to: "POST /lab/test-orders/{orderId}/variants/{variantId}/classify"

  - priority: 12
    category: business_constraint
    check: "Auth allowed_amount_cents must be present on APPROVED and satisfy 0 <= allowed_amount_cents <= TestOrder.list_price_cents"
    error_id: ERR_ALLOWED_AMOUNT_INVALID
    http_status: 422
    applies_to: "POST /lab/test-orders/{orderId}/billing/auth-decision"

  - priority: 13
    category: business_fiscal
    check: "Report sign-out requires financial_status IN {AUTH_APPROVED, PATIENT_PAY, SETTLED}"
    error_id: ERR_BILLING_NOT_CLEARED
    http_status: 402
    applies_to: "POST /lab/test-orders/{orderId}/reports/{reportId}/sign-out"

  - priority: 14
    category: business_fiscal
    check: "Collected amount must exactly equal the currently-owed responsibility (final after sign-out, else estimate)"
    error_id: ERR_COLLECT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /lab/test-orders/{orderId}/billing/collect"

  - priority: 15
    category: business_temporal
    check: "Sequencer run window must not collide (closed-interval + turnaround_buffer_minutes) with another SCHEDULED/RUNNING run on the same instrument"
    error_id: ERR_RUN_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /lab/sequencers/{sequencerId}/runs"

  - priority: 16
    category: business_temporal
    check: "Counselor appointment slot must not overlap (half-open) another SCHEDULED referral for the same counselor"
    error_id: ERR_COUNSELOR_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /lab/test-orders/{orderId}/referrals/{referralId}/schedule"

  - priority: 17
    category: business_constraint
    check: "Required body fields present and well-typed (enum membership, non-negative integers, ISO timestamps, window_end > window_start, slot_end > slot_start)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST/PUT endpoints with a body"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving clock ----
  - method: POST
    path: "/lab/_clock/set_current_utc"
    description: "Set the deterministic lab clock (test-driving)."
    roles: [LabDirector]
    code: 200
    input: [to_iso8601]
    output: LabClock
    side_effects: ["LabClock.current_utc = to_iso8601"]

  - method: GET
    path: "/lab/_clock"
    description: "Read the current lab clock."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: []
    output: LabClock
    side_effects: []

  # ---- Catalog: Gene ----
  - method: POST
    path: "/lab/genes"
    description: "Create a gene catalog entry."
    roles: [LabDirector]
    code: 201
    input: [symbol, "is_acmg_reportable?"]
    output: Gene
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/lab/genes"
    description: "List genes (paginated)."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: ["symbol?"]
    output: "Gene[]"
    side_effects: []

  - method: GET
    path: "/lab/genes/{geneId}"
    description: "Get one gene."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: []
    output: Gene
    side_effects: []

  # ---- Catalog: Panel ----
  - method: POST
    path: "/lab/panels"
    description: "Create a panel (DRAFT)."
    roles: [LabDirector]
    code: 201
    input: [name, list_price_cents, "requires_consent?"]
    output: Panel
    side_effects: ["status = DRAFT; gene_count = 0"]

  - method: GET
    path: "/lab/panels"
    description: "List panels (paginated)."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: ["status?"]
    output: "Panel[]"
    side_effects: []

  - method: GET
    path: "/lab/panels/{panelId}"
    description: "Get one panel."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: []
    output: Panel
    side_effects: []

  - method: POST
    path: "/lab/panels/{panelId}/publish"
    description: "Publish a DRAFT panel (orders allowed thereafter)."
    roles: [LabDirector]
    code: 200
    input: []
    output: Panel
    side_effects: ["status DRAFT -> PUBLISHED"]

  - method: POST
    path: "/lab/panels/{panelId}/panel-genes"
    description: "Add a gene to a panel (INCLUDED)."
    roles: [LabDirector]
    code: 201
    input: [gene_id]
    output: PanelGene
    side_effects: ["status = INCLUDED; Panel.gene_count recomputed"]

  - method: GET
    path: "/lab/panels/{panelId}/panel-genes"
    description: "List a panel's gene memberships (reverse-reach for PanelGene.panel_id)."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: []
    output: "PanelGene[]"
    side_effects: []

  - method: GET
    path: "/lab/genes/{geneId}/panel-genes"
    description: "List panel memberships for a gene."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: []
    output: "PanelGene[]"
    side_effects: []

  - method: GET
    path: "/lab/panel-genes/{panelGeneId}"
    description: "Get one panel-gene membership (establishes the PanelGene collection segment)."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: []
    output: PanelGene
    side_effects: []

  - method: GET
    path: "/lab/panel-genes"
    description: "List panel-gene memberships (reverse-reach for PanelGene.panel_id and PanelGene.gene_id)."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: ["panel_id?", "gene_id?", "status?"]
    output: "PanelGene[]"
    side_effects: []

  # ---- Provider ----
  - method: POST
    path: "/lab/providers"
    description: "Register an ordering provider."
    roles: [LabIntake, LabDirector]
    code: 201
    input: [npi, full_name]
    output: Provider
    side_effects: []

  - method: GET
    path: "/lab/providers/{providerId}"
    description: "Get one provider."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: []
    output: Provider
    side_effects: []

  # ---- TestOrder ----
  - method: POST
    path: "/lab/test-orders"
    description: "Place a test order against a PUBLISHED panel."
    roles: [LabIntake]
    code: 201
    input: [patient_mrn, patient_dob, panel_id, ordering_provider_id]
    output: TestOrder
    side_effects:
      - "pipeline_status = ORDERED; financial_status = PENDING"
      - "list_price_cents snapshot from Panel.list_price_cents"
      - "report_required_consent snapshot from Panel.requires_consent"
      - "Create Billing (status OPEN) for the order"

  - method: GET
    path: "/lab/test-orders"
    description: "List test orders (paginated)."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: ["panel_id?", "ordering_provider_id?", "pipeline_status?", "financial_status?"]
    output: "TestOrder[]"
    side_effects: []

  - method: GET
    path: "/lab/test-orders/{orderId}"
    description: "Get one test order (includes both status dimensions and both responsibility figures)."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: []
    output: TestOrder
    side_effects: []

  - method: POST
    path: "/lab/test-orders/{orderId}/cancel"
    description: "Cancel an order; cascades to requisition, billing reversal, referrals."
    roles: [LabIntake]
    code: 200
    input: ["cancel_reason?"]
    output: TestOrder
    side_effects:
      - "pipeline_status -> CANCELLED"
      - "Requisition PENDING/SUBMITTED -> VOID"
      - "Billing AUTH_REQUESTED/AUTH_APPROVED/PATIENT_PAY -> REVERSED; writeoff + coinsurance zeroing; financial_status -> SETTLED"
      - "Referrals REQUESTED/SCHEDULED -> CANCELLED"

  # ---- Requisition ----
  - method: POST
    path: "/lab/test-orders/{orderId}/requisition"
    description: "Create the requisition (PENDING) for an order."
    roles: [LabIntake]
    code: 201
    input: [clinical_indication, insurance_payer]
    output: Requisition
    side_effects: ["status = PENDING"]

  - method: GET
    path: "/lab/test-orders/{orderId}/requisition"
    description: "List the requisition(s) for an order."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: []
    output: "Requisition[]"
    side_effects: []

  - method: GET
    path: "/lab/requisitions/{requisitionId}"
    description: "Get one requisition (establishes the Requisition collection segment)."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: []
    output: Requisition
    side_effects: []

  - method: GET
    path: "/lab/requisitions"
    description: "List requisitions (reverse-reach for Requisition.test_order_id)."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: ["test_order_id?", "status?"]
    output: "Requisition[]"
    side_effects: []

  - method: POST
    path: "/lab/test-orders/{orderId}/requisition/submit"
    description: "Submit the requisition; advances order to REQUISITIONED and forks prior-auth."
    roles: [LabIntake]
    code: 200
    input: []
    output: TestOrder
    side_effects:
      - "Requisition PENDING -> SUBMITTED"
      - "pipeline_status ORDERED -> REQUISITIONED"
      - "Billing fork: non-SELF_PAY -> AUTH_REQUESTED; SELF_PAY -> PATIENT_PAY"
      - "Compute estimated_patient_responsibility_cents"

  # ---- Consent ----
  - method: POST
    path: "/lab/test-orders/{orderId}/consents"
    description: "Create a consent record (DRAFT)."
    roles: [LabIntake]
    code: 201
    input: [incidental_findings_opt_in, signed_by_name]
    output: Consent
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/lab/test-orders/{orderId}/consents"
    description: "List consents for an order."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: ["status?"]
    output: "Consent[]"
    side_effects: []

  - method: GET
    path: "/lab/consents/{consentId}"
    description: "Get one consent (establishes the Consent collection segment)."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: []
    output: Consent
    side_effects: []

  - method: GET
    path: "/lab/consents"
    description: "List consents (reverse-reach for Consent.test_order_id)."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: ["test_order_id?", "status?"]
    output: "Consent[]"
    side_effects: []

  - method: POST
    path: "/lab/test-orders/{orderId}/consents/{consentId}/sign"
    description: "Sign a DRAFT consent."
    roles: [LabIntake]
    code: 200
    input: []
    output: Consent
    side_effects: ["status DRAFT -> SIGNED"]

  - method: POST
    path: "/lab/test-orders/{orderId}/consents/{consentId}/revoke"
    description: "Revoke a SIGNED or DRAFT consent."
    roles: [LabIntake]
    code: 200
    input: []
    output: Consent
    side_effects: ["status -> REVOKED"]

  # ---- Specimen ----
  - method: POST
    path: "/lab/test-orders/{orderId}/specimens"
    description: "Register a received specimen (RECEIVED)."
    roles: [AccessioningTech]
    code: 201
    input: [specimen_type, collected_at, quantity_ng]
    output: Specimen
    side_effects: ["status = RECEIVED"]

  - method: GET
    path: "/lab/test-orders/{orderId}/specimens"
    description: "List specimens for an order."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: ["status?"]
    output: "Specimen[]"
    side_effects: []

  - method: GET
    path: "/lab/specimens/{specimenId}"
    description: "Get one specimen (establishes the Specimen collection segment)."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: []
    output: Specimen
    side_effects: []

  - method: GET
    path: "/lab/specimens"
    description: "List specimens (reverse-reach for Specimen.test_order_id and Specimen.superseded_by_specimen_id)."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: ["test_order_id?", "superseded_by_specimen_id?", "status?"]
    output: "Specimen[]"
    side_effects: []

  - method: POST
    path: "/lab/test-orders/{orderId}/specimens/{specimenId}/accession"
    description: "Accession a received specimen; QNS-screens and either advances to ACCESSIONED or records QNS_REJECTED."
    roles: [AccessioningTech]
    code: 200
    input: []
    output: Specimen
    side_effects:
      - "Sufficient: received_at set; Specimen RECEIVED -> ACCESSIONED; order REQUISITIONED -> ACCESSIONED; any prior QNS_REJECTED specimen -> SUPERSEDED"
      - "Insufficient: Specimen RECEIVED -> QNS_REJECTED; order stays REQUISITIONED (recorded outcome, not an error)"

  # ---- Sequencing / Classification ----
  - method: POST
    path: "/lab/test-orders/{orderId}/sequencing/start"
    description: "Move an ACCESSIONED order into SEQUENCING."
    roles: [AccessioningTech]
    code: 200
    input: []
    output: TestOrder
    side_effects: ["pipeline_status ACCESSIONED -> SEQUENCING"]

  - method: POST
    path: "/lab/test-orders/{orderId}/variants"
    description: "Call (register) a variant on a sequencing order."
    roles: [MolecularTechnologist]
    code: 201
    input: [gene_id, hgvs]
    output: Variant
    side_effects:
      - "classification = UNCLASSIFIED"
      - "is_incidental computed: true if gene_id NOT on the panel gene list but Gene.is_acmg_reportable"

  - method: GET
    path: "/lab/test-orders/{orderId}/variants"
    description: "List variants for an order."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: ["classification?", "gene_id?"]
    output: "Variant[]"
    side_effects: []

  - method: GET
    path: "/lab/variants/{variantId}"
    description: "Get one variant (establishes the Variant collection segment)."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: []
    output: Variant
    side_effects: []

  - method: GET
    path: "/lab/variants"
    description: "List variants (reverse-reach for Variant.test_order_id and Variant.gene_id)."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: ["test_order_id?", "gene_id?", "classification?"]
    output: "Variant[]"
    side_effects: []

  - method: POST
    path: "/lab/test-orders/{orderId}/variants/{variantId}/classify"
    description: "Classify or reclassify a variant (ACMG five-tier); reclassification cycle."
    roles: [MolecularTechnologist]
    code: 200
    input: [classification]
    output: Variant
    side_effects:
      - "classification = request.classification; classified_by_user_id = X-User-ID"
      - "Recompute variant_pathogenicity_score"

  - method: POST
    path: "/lab/test-orders/{orderId}/classification/complete"
    description: "Finalize classification; requires no UNCLASSIFIED variants; advances to CLASSIFIED."
    roles: [MolecularTechnologist]
    code: 200
    input: []
    output: TestOrder
    side_effects: ["pipeline_status SEQUENCING -> CLASSIFIED"]

  # ---- Report ----
  - method: POST
    path: "/lab/test-orders/{orderId}/reports"
    description: "Create the DRAFT report for a CLASSIFIED order."
    roles: [LabDirector, MolecularTechnologist]
    code: 201
    input: []
    output: Report
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/lab/test-orders/{orderId}/reports"
    description: "List reports for an order."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: ["status?"]
    output: "Report[]"
    side_effects: []

  - method: GET
    path: "/lab/reports/{reportId}"
    description: "Get one report (establishes the Report collection segment)."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: []
    output: Report
    side_effects: []

  - method: GET
    path: "/lab/reports"
    description: "List reports (reverse-reach for Report.test_order_id and Report.amends_report_id)."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: ["test_order_id?", "amends_report_id?", "status?"]
    output: "Report[]"
    side_effects: []

  - method: POST
    path: "/lab/test-orders/{orderId}/reports/{reportId}/sign-out"
    description: "Sign out a DRAFT report (segregation-of-duties, VUS, billing gates apply)."
    roles: [LabDirector]
    code: 200
    input: []
    output: Report
    side_effects:
      - "reportability_selection + incidental_findings_policy applied"
      - "status DRAFT -> SIGNED_OUT; signed_out_by_user_id = X-User-ID; order pipeline_status -> SIGNED_OUT"
      - "has_reportable_incidental set if any disclosed incidental"
      - "final_patient_responsibility_cents computed"
      - "If financial_status == AUTH_APPROVED: Billing -> PATIENT_PAY; financial_status -> PATIENT_PAY"

  - method: POST
    path: "/lab/test-orders/{orderId}/reports/{reportId}/amend"
    description: "Amend a SIGNED_OUT report (OCC supersede on TestOrder.version)."
    roles: [LabDirector]
    code: 201
    input: [expected_test_order_version]
    output: Report
    side_effects:
      - "Create successor Report (amends_report_id = prior id), status SIGNED_OUT"
      - "Prior report SIGNED_OUT -> AMENDED"
      - "Variants whose classification changed -> RECLASSIFIED archived"
      - "increments TestOrder.version by 1"

  # ---- Billing ----
  - method: GET
    path: "/lab/test-orders/{orderId}/billing"
    description: "List the billing record(s) for an order."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: []
    output: "Billing[]"
    side_effects: []

  - method: GET
    path: "/lab/billings/{billingId}"
    description: "Get one billing record (establishes the Billing collection segment)."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: []
    output: Billing
    side_effects: []

  - method: GET
    path: "/lab/billings"
    description: "List billing records (reverse-reach for Billing.test_order_id)."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: ["test_order_id?", "status?"]
    output: "Billing[]"
    side_effects: []

  - method: POST
    path: "/lab/test-orders/{orderId}/billing/auth-decision"
    description: "Record a prior-auth decision (APPROVED or DENIED)."
    roles: [BillingSpecialist]
    code: 200
    input: [decision, "allowed_amount_cents?"]
    output: Billing
    side_effects:
      - "APPROVED: allowed_amount_cents stored; Billing -> AUTH_APPROVED; financial_status -> AUTH_APPROVED; recompute estimate"
      - "DENIED: Billing -> AUTH_DENIED; financial_status -> AUTH_DENIED"

  - method: POST
    path: "/lab/test-orders/{orderId}/billing/convert-self-pay"
    description: "Convert a denied auth to patient self-pay."
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Billing
    side_effects:
      - "writeoff_cents += allowed_amount_cents; allowed_amount_cents := list_price_cents"
      - "Billing AUTH_DENIED -> PATIENT_PAY; financial_status -> PATIENT_PAY; recompute estimate"

  - method: POST
    path: "/lab/test-orders/{orderId}/billing/collect"
    description: "Collect the patient responsibility; amount must match exactly."
    roles: [BillingSpecialist]
    code: 200
    input: [amount_cents]
    output: Billing
    side_effects:
      - "coinsurance_collected_cents += amount_cents"
      - "Billing PATIENT_PAY -> SETTLED; financial_status -> SETTLED"

  # ---- Sequencer (instrument) ----
  - method: POST
    path: "/lab/sequencers"
    description: "Register a sequencer instrument (ONLINE)."
    roles: [LabDirector]
    code: 201
    input: [instrument_name, "turnaround_buffer_minutes?"]
    output: Sequencer
    side_effects: ["status = ONLINE"]

  - method: GET
    path: "/lab/sequencers"
    description: "List sequencers."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: []
    output: "Sequencer[]"
    side_effects: []

  - method: GET
    path: "/lab/sequencers/{sequencerId}"
    description: "Get one sequencer."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: []
    output: Sequencer
    side_effects: []

  - method: POST
    path: "/lab/sequencers/{sequencerId}/runs"
    description: "Schedule a sequencing run window on the instrument (closed-interval + buffer overlap check)."
    roles: [AccessioningTech]
    code: 201
    input: [test_order_id, window_start, window_end]
    output: SequencerRun
    side_effects: ["status = SCHEDULED"]

  - method: GET
    path: "/lab/sequencers/{sequencerId}/runs"
    description: "List runs on a sequencer (reverse-reach for SequencerRun.sequencer_id)."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: ["status?"]
    output: "SequencerRun[]"
    side_effects: []

  - method: GET
    path: "/lab/sequencer-runs/{runId}"
    description: "Get one run (establishes the SequencerRun collection segment)."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: []
    output: SequencerRun
    side_effects: []

  - method: GET
    path: "/lab/sequencer-runs"
    description: "List runs (reverse-reach for SequencerRun.test_order_id)."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: ["test_order_id?", "sequencer_id?", "status?"]
    output: "SequencerRun[]"
    side_effects: []

  - method: POST
    path: "/lab/sequencers/{sequencerId}/runs/{runId}/start"
    description: "Start a scheduled run."
    roles: [AccessioningTech]
    code: 200
    input: []
    output: SequencerRun
    side_effects: ["status SCHEDULED -> RUNNING"]

  - method: POST
    path: "/lab/sequencers/{sequencerId}/runs/{runId}/finish"
    description: "Finish a running run."
    roles: [AccessioningTech]
    code: 200
    input: []
    output: SequencerRun
    side_effects: ["status RUNNING -> DONE"]

  - method: POST
    path: "/lab/sequencers/{sequencerId}/runs/{runId}/abort"
    description: "Abort a scheduled/running run (frees the window)."
    roles: [AccessioningTech]
    code: 200
    input: []
    output: SequencerRun
    side_effects: ["status -> ABORTED"]

  # ---- GeneticCounselorProfile ----
  - method: POST
    path: "/lab/counselors"
    description: "Register a genetic counselor profile (ACTIVE)."
    roles: [LabDirector]
    code: 201
    input: [counselor_name]
    output: GeneticCounselorProfile
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/lab/counselors"
    description: "List genetic counselor profiles."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: []
    output: "GeneticCounselorProfile[]"
    side_effects: []

  - method: GET
    path: "/lab/counselors/{counselorId}"
    description: "Get one counselor profile."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: []
    output: GeneticCounselorProfile
    side_effects: []

  # ---- CounselorReferral ----
  - method: POST
    path: "/lab/test-orders/{orderId}/referrals"
    description: "Request a genetic-counselor referral."
    roles: [LabDirector, MolecularTechnologist, GeneticCounselor]
    code: 201
    input: [counselor_id, reason, "triggering_variant_id?"]
    output: CounselorReferral
    side_effects: ["status = REQUESTED"]

  - method: GET
    path: "/lab/test-orders/{orderId}/referrals"
    description: "List referrals for an order (reverse-reach for CounselorReferral.test_order_id)."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: ["status?", "reason?"]
    output: "CounselorReferral[]"
    side_effects: []

  - method: GET
    path: "/lab/referrals/{referralId}"
    description: "Get one referral (establishes the CounselorReferral collection segment)."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: []
    output: CounselorReferral
    side_effects: []

  - method: GET
    path: "/lab/referrals"
    description: "List referrals (reverse-reach for CounselorReferral.counselor_id and triggering_variant_id)."
    roles: [LabDirector, LabIntake, AccessioningTech, MolecularTechnologist, BillingSpecialist, GeneticCounselor]
    code: 200
    input: ["counselor_id?", "triggering_variant_id?", "test_order_id?", "status?"]
    output: "CounselorReferral[]"
    side_effects: []

  - method: POST
    path: "/lab/test-orders/{orderId}/referrals/{referralId}/schedule"
    description: "Schedule a requested referral into a counselor time slot (half-open overlap check)."
    roles: [GeneticCounselor]
    code: 200
    input: [slot_start, slot_end]
    output: CounselorReferral
    side_effects: ["slot_start/slot_end recorded; status REQUESTED -> SCHEDULED"]

  - method: POST
    path: "/lab/test-orders/{orderId}/referrals/{referralId}/complete"
    description: "Complete a scheduled referral."
    roles: [GeneticCounselor]
    code: 200
    input: []
    output: CounselorReferral
    side_effects: ["status SCHEDULED -> COMPLETED"]

  - method: POST
    path: "/lab/test-orders/{orderId}/referrals/{referralId}/cancel"
    description: "Cancel a referral."
    roles: [GeneticCounselor]
    code: 200
    input: []
    output: CounselorReferral
    side_effects: ["status -> CANCELLED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth / existence ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role missing/unknown" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "TestOrder id in path not found" }
  - { id: ERR_PANEL_NOT_FOUND, http: 404, condition: "Panel id not found" }
  - { id: ERR_GENE_NOT_FOUND, http: 404, condition: "Gene id not found" }
  - { id: ERR_PROVIDER_NOT_FOUND, http: 404, condition: "Provider id not found" }
  - { id: ERR_REQUISITION_NOT_FOUND, http: 404, condition: "No requisition exists for the order when one is required" }
  - { id: ERR_CONSENT_NOT_FOUND, http: 404, condition: "Consent id not found" }
  - { id: ERR_SPECIMEN_NOT_FOUND, http: 404, condition: "Specimen id not found" }
  - { id: ERR_VARIANT_NOT_FOUND, http: 404, condition: "Variant id not found" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "Report id not found" }
  - { id: ERR_REFERRAL_NOT_FOUND, http: 404, condition: "CounselorReferral id not found" }
  - { id: ERR_PANEL_GENE_NOT_FOUND, http: 404, condition: "PanelGene id not found" }

  # --- OCC ---
  - { id: ERR_STALE_ORDER_VERSION, http: 412, condition: "expected_test_order_version does not match current TestOrder.version on amend" }

  # --- state ---
  - { id: ERR_ORDER_BAD_PIPELINE_STATE, http: 409, condition: "TestOrder.pipeline_status not valid for this transition" }
  - { id: ERR_SPECIMEN_BAD_STATE, http: 409, condition: "Specimen not in a state from which the operation is defined" }
  - { id: ERR_REPORT_BAD_STATE, http: 409, condition: "Report not in a state from which the operation is defined" }
  - { id: ERR_BILLING_BAD_STATE, http: 409, condition: "Billing not in a state from which the operation is defined" }
  - { id: ERR_REFERRAL_BAD_STATE, http: 409, condition: "Referral not in a state from which the operation is defined" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "Order is already terminal (SIGNED_OUT/CANCELLED)" }

  # --- business ---
  - { id: ERR_PANEL_NOT_PUBLISHED, http: 409, condition: "Order references a panel not in PUBLISHED status, or variant gene not INCLUDED and not ACMG-reportable" }
  - { id: ERR_CONSENT_REQUIRED, http: 409, condition: "Accessioning a consent-required panel without a SIGNED consent" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Signing director also classified a variant on the order" }
  - { id: ERR_VUS_REFERRAL_REQUIRED, http: 409, condition: "Sign-out attempted with a VUS variant but no VUS_FOLLOWUP referral exists" }
  - { id: ERR_UNCLASSIFIED_VARIANTS_EXIST, http: 409, condition: "classification/complete with at least one UNCLASSIFIED variant" }
  - { id: ERR_INVALID_CLASSIFICATION, http: 422, condition: "classify value not in the five ACMG tiers" }
  - { id: ERR_ALLOWED_AMOUNT_INVALID, http: 422, condition: "APPROVED auth without valid allowed_amount_cents (0..list_price_cents)" }
  - { id: ERR_BILLING_NOT_CLEARED, http: 402, condition: "Sign-out attempted while financial_status not in {AUTH_APPROVED, PATIENT_PAY, SETTLED}" }
  - { id: ERR_COLLECT_AMOUNT_MISMATCH, http: 422, condition: "collect amount_cents != currently-owed responsibility" }
  - { id: ERR_GENE_NOT_ON_PANEL, http: 409, condition: "Variant gene is neither INCLUDED on the panel nor ACMG-reportable" }
  - { id: ERR_RUN_WINDOW_CONFLICT, http: 409, condition: "Sequencer run window collides (closed + buffer) with another SCHEDULED/RUNNING run on the instrument" }
  - { id: ERR_COUNSELOR_SLOT_CONFLICT, http: 409, condition: "Counselor appointment slot overlaps (half-open) another SCHEDULED referral for the same counselor" }
  - { id: ERR_RUN_BAD_STATE, http: 409, condition: "SequencerRun not in a state from which the operation is defined" }
  - { id: ERR_SEQUENCER_NOT_FOUND, http: 404, condition: "Sequencer id not found" }
  - { id: ERR_RUN_NOT_FOUND, http: 404, condition: "SequencerRun id not found" }
  - { id: ERR_COUNSELOR_NOT_FOUND, http: 404, condition: "GeneticCounselorProfile id not found" }

  # --- generic input ---
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing/malformed body field, bad enum, negative integer, bad timestamp" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Generic resource not found fallback" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: LabDirector
    description: "Senior lab authority: manages catalog (genes, panels), publishes panels, signs out and amends reports, operates the test clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /lab/_clock/set_current_utc — set clock"
      - "POST /lab/genes — create gene"
      - "POST /lab/panels — create panel"
      - "POST /lab/panels/{panelId}/publish — publish panel"
      - "POST /lab/panels/{panelId}/panel-genes — add gene to panel"
      - "POST /lab/sequencers — register sequencer"
      - "POST /lab/counselors — register counselor profile"
      - "POST /lab/test-orders/{orderId}/reports/{reportId}/sign-out — sign out report"
      - "POST /lab/test-orders/{orderId}/reports/{reportId}/amend — amend report"
    shared_operations:
      - "POST /lab/providers — register provider (with LabIntake)"
      - "POST /lab/test-orders/{orderId}/reports — create draft report (with MolecularTechnologist)"
      - "POST /lab/test-orders/{orderId}/referrals — request referral (with MolecularTechnologist, GeneticCounselor)"
      - "GET endpoints (all roles)"

  - name: LabIntake
    description: "Front-desk intake: registers providers, places orders, builds and submits requisitions, manages consents, cancels orders."
    identity: "opaque"
    exclusive_operations:
      - "POST /lab/test-orders — place order"
      - "POST /lab/test-orders/{orderId}/cancel — cancel order"
      - "POST /lab/test-orders/{orderId}/requisition — create requisition"
      - "POST /lab/test-orders/{orderId}/requisition/submit — submit requisition"
      - "POST /lab/test-orders/{orderId}/consents — create consent"
      - "POST /lab/test-orders/{orderId}/consents/{consentId}/sign — sign consent"
      - "POST /lab/test-orders/{orderId}/consents/{consentId}/revoke — revoke consent"
    shared_operations:
      - "POST /lab/providers — register provider (with LabDirector)"
      - "GET endpoints (all roles)"

  - name: AccessioningTech
    description: "Specimen accessioning: registers specimens, performs QNS-screened accessioning, starts sequencing."
    identity: "opaque"
    exclusive_operations:
      - "POST /lab/test-orders/{orderId}/specimens — register specimen"
      - "POST /lab/test-orders/{orderId}/specimens/{specimenId}/accession — accession/QNS"
      - "POST /lab/test-orders/{orderId}/sequencing/start — start sequencing"
      - "POST /lab/sequencers/{sequencerId}/runs — schedule run"
      - "POST /lab/sequencers/{sequencerId}/runs/{runId}/start — start run"
      - "POST /lab/sequencers/{sequencerId}/runs/{runId}/finish — finish run"
      - "POST /lab/sequencers/{sequencerId}/runs/{runId}/abort — abort run"
    shared_operations:
      - "GET endpoints (all roles)"

  - name: MolecularTechnologist
    description: "Bioinformatics/variant scientist: calls and classifies variants, completes classification, may draft reports and request referrals. Cannot sign out (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /lab/test-orders/{orderId}/variants — call variant"
      - "POST /lab/test-orders/{orderId}/variants/{variantId}/classify — classify/reclassify"
      - "POST /lab/test-orders/{orderId}/classification/complete — finalize classification"
    shared_operations:
      - "POST /lab/test-orders/{orderId}/reports — create draft report (with LabDirector)"
      - "POST /lab/test-orders/{orderId}/referrals — request referral (with LabDirector, GeneticCounselor)"
      - "GET endpoints (all roles)"

  - name: BillingSpecialist
    description: "Revenue cycle: records prior-auth decisions, converts denials to self-pay, collects patient responsibility."
    identity: "opaque"
    exclusive_operations:
      - "POST /lab/test-orders/{orderId}/billing/auth-decision — auth decision"
      - "POST /lab/test-orders/{orderId}/billing/convert-self-pay — convert to self-pay"
      - "POST /lab/test-orders/{orderId}/billing/collect — collect"
    shared_operations:
      - "GET endpoints (all roles)"

  - name: GeneticCounselor
    description: "Counseling workflow: requests, schedules, completes, and cancels referrals."
    identity: "opaque"
    exclusive_operations:
      - "POST /lab/test-orders/{orderId}/referrals/{referralId}/schedule — schedule referral"
      - "POST /lab/test-orders/{orderId}/referrals/{referralId}/complete — complete referral"
      - "POST /lab/test-orders/{orderId}/referrals/{referralId}/cancel — cancel referral"
    shared_operations:
      - "POST /lab/test-orders/{orderId}/referrals — request referral (with LabDirector, MolecularTechnologist)"
      - "GET endpoints (all roles)"
