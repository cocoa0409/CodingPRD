            - call: "POST /api/accounts/u-late/appeals/${appeal_late}/submit"
              payload: {}
              as: PlatformAdmin
              captures:
                error_id: $.data.error_id
          assert:
            - "the submission returns 409 with error_id == ERR_APPEAL_WINDOW_CLOSED"
            - "Appeal.${appeal_late}.state == FILED and Appeal.${appeal_late}.submitted_at_utc == null"
            - "Appeal.${appeal_late}.filed_at_utc == \"2026-09-15T00:00:00Z\""

      - name: aggregate_sanction_count_drives_the_community_ladder
        claim_type: Aggregate validation
        grounds:
          - calculations.enforcement_tier
          - entities.Community.fields.applying_sanction_count
          - entities.Community.fields.enforcement_tier
        distinguishing_aspect: "Each sanction is individually unremarkable but the aggregate crossing points are inclusive at 2 and 3, so the community's enforcement tier moves from 1 to 2 at exactly two ACTIVE sanctions and to 3 at exactly three."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community with no sanctions."
          setup_api_calls:
