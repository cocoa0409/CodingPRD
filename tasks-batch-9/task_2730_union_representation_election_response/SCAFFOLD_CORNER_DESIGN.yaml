      - name: the_round_version_gate_runs_before_the_layout_geometry_checks
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[1]
          - errors.ERR_STALE_ROUND_VERSION
          - errors.ERR_POLL_SESSION_LOCATION_CONFLICT
          - entities.ElectionRound.fields.version
          - entities.ElectionRound.fields.scheduled_session_count
        distinguishing_aspect: |
          Every successful session create moves the round's version, so the planner's captured value expires
          after each write - and the declared ordering means a request that is BOTH stale and geometrically
          impossible answers 412, never the location conflict. Once the version is refreshed the identical
          body finally reaches the overlap check and answers 409, and a rejected create must leave both
          version and scheduled_session_count untouched, so the refreshed value stays usable.
