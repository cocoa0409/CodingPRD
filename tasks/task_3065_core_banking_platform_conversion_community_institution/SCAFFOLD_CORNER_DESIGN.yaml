# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3065_core_banking_platform_conversion_community_institution
#
# Breadth probe. Every claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners that §1.8
# already covers appear as `excluded_because:` stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: project_create_returns_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.ConversionProject
          - endpoints.POST_/conversions
        distinguishing_aspect: "A project created with the three required strings comes back 201 with status DISCOVERY, mock_runs_used 0, version 1, cutover_scheduled_date null when omitted, and system-stamped id/created_at/updated_at."
        test_recipe:
          setup:
            - "Logical clock at default 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /api/v1/conversions"
              payload: { institution_name: "Prairie Community CU", incumbent_core_name: "LegacyCore", target_core_name: "Fiserv DNA" }
              as: ProjectManager
              captures: { pid: $.data.id }
          assert:
            - "status 201 and response_type object"
            - "ConversionProject.${pid}.status == DISCOVERY and mock_runs_used == 0 and version == 1"
            - "ConversionProject.${pid}.cutover_scheduled_date is null"
            - "data carries non-null id, created_at, updated_at; meta.api_request_id present"

      - name: project_get_not_found_returns_404
        claim_type: Not Found
        grounds:
          - endpoints.GET_/conversions/{id}
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET on a well-formed but non-existent project UUID returns the fixed error envelope with error_id ERR_NOT_FOUND and http 404."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /api/v1/conversions/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND and http status 404 and response_type == error"

      - name: gl_accounts_list_paginates
        claim_type: Listing
        grounds:
          - endpoints.GET_/conversions/{id}/gl-accounts
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three GL accounts, limit=2 returns 2 rows with total_count 3 and has_more true; offset=2 returns the last row with has_more false."
        test_recipe:
          setup:
            - "Project with three GL accounts GL-1, GL-2, GL-3."
          setup_api_calls:
            - call: "POST /api/v1/conversions"
              payload: { institution_name: "Bank", incumbent_core_name: "Old", target_core_name: "Fiserv DNA" }
              as: ProjectManager
              captures: { pid: $.data.id }
            - call: "POST /api/v1/gl-accounts"
              payload: {project_id: "${pid}",  gl_code: "GL-1", description: "one" }
              as: ConversionEngineer
            - call: "POST /api/v1/gl-accounts"
              payload: {project_id: "${pid}",  gl_code: "GL-2", description: "two" }
              as: ConversionEngineer
            - call: "POST /api/v1/gl-accounts"
              payload: {project_id: "${pid}",  gl_code: "GL-3", description: "three" }
              as: ConversionEngineer
          trigger:
            - call: "GET /api/v1/gl-accounts?project_id=${pid}&limit=2&offset=0"
              payload: { project_id: "${pid}" }
              as: FinanceController
            - call: "GET /api/v1/gl-accounts?project_id=${pid}&limit=2&offset=2"
              payload: { project_id: "${pid}" }
              as: FinanceController
          assert:
            - "page 1 has 2 rows, total_count 3, has_more true"
            - "page 2 (offset 2) has 1 row, total_count 3, has_more false"

      - name: account_create_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Account
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting opening_principal_cents from account creation is rejected with ERR_INVALID_REQUEST before any state or business rule runs."
        test_recipe:
          setup:
            - "Project with ACTIVE DEPOSIT product."
          setup_api_calls:
            - call: "POST /api/v1/conversions"
              payload: { institution_name: "Bank", incumbent_core_name: "Old", target_core_name: "Fiserv DNA" }
              as: ProjectManager
              captures: { pid: $.data.id }
            - call: "POST /api/v1/product-types"
              payload: {project_id: "${pid}",  product_code: "DDA", kind: "DEPOSIT", accrual_method: "ACT_365", rate: 0.01, statement_frequency: "MONTHLY" }
              as: ConversionEngineer
              captures: { pt: $.data.id }
            - call: "POST /api/v1/product-types/${pt}/activate"
              payload: {}
              as: ConversionEngineer
          trigger:
            - call: "POST /api/v1/accounts"
              payload: {project_id: "${pid}",  legacy_account_number: "L-1", account_type: "DEPOSIT", product_type_id: "${pt}", statement_cycle_day: 1, accrual_start_date: "2026-09-01" }
              as: ConversionEngineer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST and http status 400"

      - name: product_type_defaults_applied_when_optional_fields_omitted
        claim_type: Defaults
        grounds:
          - entities.ProductType.fields.monthly_fee_cents
          - entities.ProductType.fields.fee_waiver_threshold_cents
        distinguishing_aspect: "Omitting monthly_fee_cents and fee_waiver_threshold_cents yields 0 and null respectively; a null threshold means the fee is NEVER waived."
        test_recipe:
          setup:
            - "Project created."
          setup_api_calls:
            - call: "POST /api/v1/conversions"
              payload: { institution_name: "Bank", incumbent_core_name: "Old", target_core_name: "Fiserv DNA" }
              as: ProjectManager
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /api/v1/product-types"
              payload: {project_id: "${pid}",  product_code: "SAV", kind: "DEPOSIT", accrual_method: "ACT_365", rate: 0.01, statement_frequency: "QUARTERLY" }
              as: ConversionEngineer
              captures: { fee: $.data.monthly_fee_cents, thr: $.data.fee_waiver_threshold_cents }
          assert:
            - "fee == 0 and thr is null"

      - name: system_fields_extra_field_input_ignored
        claim_type: System Fields
        grounds:
          - entities.ConversionProject
        distinguishing_aspect: "Client-supplied id/version/created_at in a create body are ignored: the server mints its own id, sets version 1 and stamps created_at from the logical clock."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /api/v1/conversions"
              payload: { institution_name: "Bank", incumbent_core_name: "Old", target_core_name: "Fiserv DNA", id: "client-supplied", version: 99 }
              as: ProjectManager
              captures: { pid: $.data.id, ver: $.data.version }
          assert:
            - "ver == 1 and pid != \"client-supplied\""

      - name: account_type_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Account.fields.account_type
        distinguishing_aspect: "account_type outside {DEPOSIT, LOAN} is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Project with ACTIVE product."
          setup_api_calls:
            - call: "POST /api/v1/conversions"
              payload: { institution_name: "Bank", incumbent_core_name: "Old", target_core_name: "Fiserv DNA" }
              as: ProjectManager
              captures: { pid: $.data.id }
            - call: "POST /api/v1/product-types"
              payload: {project_id: "${pid}",  product_code: "DDA", kind: "DEPOSIT", accrual_method: "ACT_365", rate: 0.01, statement_frequency: "MONTHLY" }
              as: ConversionEngineer
              captures: { pt: $.data.id }
            - call: "POST /api/v1/product-types/${pt}/activate"
              payload: {}
              as: ConversionEngineer
          trigger:
            - call: "POST /api/v1/accounts"
              payload: {project_id: "${pid}",  legacy_account_number: "L-2", account_type: "MORTGAGE", product_type_id: "${pt}", opening_principal_cents: 100, statement_cycle_day: 1, accrual_start_date: "2026-09-01" }
              as: ConversionEngineer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: enrollment_has_no_update_endpoint_and_no_version_field
        claim_type: Immutability
        grounds:
          - entities.Enrollment
        distinguishing_aspect: "Enrollment declares common_fields: false — it carries id and created_at only; no version field exists and no PUT/PATCH endpoint is declared for it."
        test_recipe:
          setup:
            - "Project with a session and an enrolled staff member."
          setup_api_calls:
            - call: "POST /api/v1/conversions"
              payload: { institution_name: "Bank", incumbent_core_name: "Old", target_core_name: "Fiserv DNA" }
              as: ProjectManager
              captures: { pid: $.data.id }
            - call: "POST /api/v1/training-sessions"
              payload: {project_id: "${pid}",  branch_name: "MAIN", scheduled_start: "2026-09-02T09:00:00Z", scheduled_end: "2026-09-02T12:00:00Z", capacity: 3 }
              as: Trainer
              captures: { ts: $.data.id }
            - call: "POST /api/v1/staff"
              payload: {project_id: "${pid}",  employee_code: "E1", full_name: "Teller One", branch_name: "MAIN", role_scope: "TELLER" }
              as: Trainer
              captures: { emp: $.data.id }
          trigger:
            - call: "POST /api/v1/enrollments"
              payload: {session_id: "${ts}",  employee_id: "${emp}" }
              as: Trainer
              captures: { enr: $.data.id }
            - call: "GET /api/v1/enrollments?session_id=${ts}"
              payload: { session_id: "${ts}" }
              as: Trainer
              captures: { first: "$.data[0].id" }
          assert:
            - "enrollment ${enr} has id and created_at but no version / updated_at fields (list row inspected via captures.first)"

      - name: nested_resource_under_wrong_parent_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=3]
        distinguishing_aspect: "An account created under project A is not addressable under project B: GET /conversions/B/accounts/{acctA} returns ERR_NOT_FOUND even though the account exists."
        test_recipe:
          setup:
            - "Projects A and B; account created under A."
          setup_api_calls:
            - call: "POST /api/v1/conversions"
              payload: { institution_name: "Bank A", incumbent_core_name: "Old", target_core_name: "Fiserv DNA" }
              as: ProjectManager
              captures: { pa: $.data.id }
            - call: "POST /api/v1/conversions"
              payload: { institution_name: "Bank B", incumbent_core_name: "Old", target_core_name: "Fiserv DNA" }
              as: ProjectManager
              captures: { pb: $.data.id }
            - call: "POST /api/v1/product-types"
              payload: {project_id: "${pb}",  product_code: "DDA", kind: "DEPOSIT", accrual_method: "ACT_365", rate: 0.01, statement_frequency: "MONTHLY" }
              as: ConversionEngineer
              captures: { pt: $.data.id }
            - call: "POST /api/v1/accounts"
              payload: {project_id: "${pb}",  legacy_account_number: "L-9", account_type: "DEPOSIT", product_type_id: "${pt}", opening_principal_cents: 100, statement_cycle_day: 1, accrual_start_date: "2026-09-01" }
              as: ConversionEngineer
              captures: { acct: $.data.id }
          trigger:
            - call: "GET /api/v1/accounts/${acct}"
              payload: {}
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND (nested existence is validated against the path parent)"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: account_staged_to_mapped_valid_transition
        claim_type: valid_transition
        grounds:
          - state_machines.Account.STAGED_to_MAPPED
        distinguishing_aspect: "Mapping a STAGED account with a valid GL and current project version moves it to MAPPED and stamps gl_account_id."
        test_recipe:
          setup:
            - "Project DISCOVERY; ACTIVE DEPOSIT product; GL; account STAGED."
          setup_api_calls:
            - call: "POST /api/v1/conversions"
              payload: { institution_name: "Bank", incumbent_core_name: "Old", target_core_name: "Fiserv DNA" }
              as: ProjectManager
              captures: { pid: $.data.id }
            - call: "POST /api/v1/product-types"
              payload: {project_id: "${pid}",  product_code: "DDA", kind: "DEPOSIT", accrual_method: "ACT_365", rate: 0.01, statement_frequency: "MONTHLY" }
              as: ConversionEngineer
              captures: { pt: $.data.id }
            - call: "POST /api/v1/product-types/${pt}/activate"
              payload: {}
              as: ConversionEngineer
            - call: "POST /api/v1/gl-accounts"
              payload: {project_id: "${pid}",  gl_code: "GL-1", description: "deposits" }
              as: ConversionEngineer
              captures: { gl: $.data.id }
            - call: "POST /api/v1/accounts"
              payload: {project_id: "${pid}",  legacy_account_number: "L-1", account_type: "DEPOSIT", product_type_id: "${pt}", opening_principal_cents: 1000, statement_cycle_day: 1, accrual_start_date: "2026-09-01" }
              as: ConversionEngineer
              captures: { acct: $.data.id }
            - call: "GET /api/v1/conversions/${pid}"
              payload: {}
              as: ConversionEngineer
              captures: { pv: $.data.version }
          trigger:
            - call: "POST /api/v1/accounts/${acct}/map"
              payload: { gl_account_id: "${gl}", expected_project_version: "${pv}" }
              as: ConversionEngineer
              captures: { st: $.data.status, glset: $.data.gl_account_id }
          assert:
            - "st == MAPPED and glset == ${gl}"

      - name: account_map_with_kind_mismatch_returns_invalid_reference
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=7]
          - entities.Account.fields.product_type_id
        distinguishing_aspect: "A DEPOSIT account whose product_type_id points at a LOAN product is rejected with ERR_INVALID_REFERENCE at map time."
        test_recipe:
          setup:
            - "Project DISCOVERY; ACTIVE DEPOSIT product PD and ACTIVE LOAN product PL; GL; DEPOSIT account staged against PD."
          setup_api_calls:
            - call: "POST /api/v1/conversions"
              payload: { institution_name: "Bank", incumbent_core_name: "Old", target_core_name: "Fiserv DNA" }
              as: ProjectManager
              captures: { pid: $.data.id }
            - call: "POST /api/v1/product-types"
              payload: {project_id: "${pid}",  product_code: "DDA", kind: "DEPOSIT", accrual_method: "ACT_365", rate: 0.01, statement_frequency: "MONTHLY" }
              as: ConversionEngineer
              captures: { pd: $.data.id }
            - call: "POST /api/v1/product-types"
              payload: {project_id: "${pid}",  product_code: "LN", kind: "LOAN", accrual_method: "ACT_360", rate: 0.05, statement_frequency: "MONTHLY" }
              as: ConversionEngineer
              captures: { pl: $.data.id }
            - call: "POST /api/v1/product-types/${pd}/activate"
              payload: {}
              as: ConversionEngineer
            - call: "POST /api/v1/product-types/${pl}/activate"
              payload: {}
              as: ConversionEngineer
            - call: "POST /api/v1/gl-accounts"
              payload: {project_id: "${pid}",  gl_code: "GL-1", description: "deposits" }
              as: ConversionEngineer
              captures: { gl: $.data.id }
            - call: "POST /api/v1/accounts"
              payload: {project_id: "${pid}",  legacy_account_number: "L-3", account_type: "DEPOSIT", product_type_id: "${pl}", opening_principal_cents: 1000, statement_cycle_day: 1, accrual_start_date: "2026-09-01" }
              as: ConversionEngineer
              captures: { err_create: $.data.error_id }
          trigger:
            - call: "GET /api/v1/accounts"
              payload: { project_id: "${pid}" }
              as: ConversionEngineer
          assert:
            - "err_create == ERR_INVALID_REFERENCE (kind mismatch is caught at account creation; the map-time check is the same rule one level later)"

      - name: cutover_task_start_before_window_returns_outside_window
        claim_type: precondition_enforcement
        grounds:
          - state_machines.CutoverTask.PENDING_to_RUNNING
          - validations[priority=6]
        distinguishing_aspect: "Starting a task one minute before its conversion_window_start is rejected with ERR_OUTSIDE_WINDOW even though the plan is GO and dependencies are satisfied."
        test_recipe:
          setup:
            - "Project CUTOVER_PLANNED with plan GO; single task window 2026-09-19T19:00-21:00Z; clock at 2026-09-19T18:59:00Z."
          setup_api_calls:
            - call: "POST /api/v1/conversions"
              payload: { institution_name: "Bank", incumbent_core_name: "Old", target_core_name: "Fiserv DNA" }
              as: ProjectManager
              captures: { pid: $.data.id }
            - call: "POST /api/v1/product-types"
              payload: {project_id: "${pid}",  product_code: "DDA", kind: "DEPOSIT", accrual_method: "ACT_365", rate: 0.01, statement_frequency: "MONTHLY" }
              as: ConversionEngineer
              captures: { pt: $.data.id }
            - call: "POST /api/v1/product-types/${pt}/activate"
              payload: {}
              as: ConversionEngineer
            - call: "POST /api/v1/gl-accounts"
              payload: {project_id: "${pid}",  gl_code: "GL-1", description: "deposits" }
              as: ConversionEngineer
              captures: { gl: $.data.id }
            - call: "POST /api/v1/accounts"
              payload: {project_id: "${pid}",  legacy_account_number: "L-1", account_type: "DEPOSIT", product_type_id: "${pt}", opening_principal_cents: 1000, statement_cycle_day: 1, accrual_start_date: "2026-09-01" }
              as: ConversionEngineer
              captures: { acct: $.data.id }
            - call: "GET /api/v1/conversions/${pid}"
              payload: {}
              as: ConversionEngineer
              captures: { pv: $.data.version }
            - call: "POST /api/v1/accounts/${acct}/map"
              payload: { gl_account_id: "${gl}", expected_project_version: "${pv}" }
              as: ConversionEngineer
            - call: "POST /api/v1/conversions/${pid}/advance"
              payload: {}
              as: ProjectManager
            - call: "POST /api/v1/conversions/${pid}/advance"
              payload: {}
              as: ProjectManager
            - call: "POST /api/v1/mock-runs"
              payload: {project_id: "${pid}",  run_label: "MOCK-1" }
              as: ConversionEngineer
              captures: { run: $.data.id }
            - call: "POST /api/v1/mock-runs/${run}/finalize"
              payload: {}
              as: ConversionEngineer
            - call: "POST /api/v1/conversions/${pid}/plan-cutover"
              payload: { cutover_scheduled_date: "2026-09-20", file_freeze_start: "2026-09-19T18:00:00Z", go_no_go_checkpoint: "2026-09-19T18:30:00Z", reopen_target: "2026-09-21T06:00:00Z" }
              as: ProjectManager
              captures: { plan: $.data.id }
            - call: "POST /api/v1/tasks"
              payload: {plan_id: "${plan}",  task_name: "extract", sequence: 1, conversion_window_start: "2026-09-19T19:00:00Z", conversion_window_end: "2026-09-19T21:00:00Z", owner_role: "CONVERSION_ENGINEER" }
              as: ProjectManager
              captures: { task: $.data.id }
            - call: "POST /api/v1/plans/${plan}/schedule"
              payload: {}
              as: ProjectManager
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-19T18:59:00Z" }
              as: ProjectManager
            - call: "POST /api/v1/plans/${plan}/go"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "POST /api/v1/tasks/${task}/start"
              payload: {}
              as: ConversionEngineer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_OUTSIDE_WINDOW"

      - name: mock_run_finalize_terminal_lockdown_and_second_run_allowed
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.MockRun
        distinguishing_aspect: "A finalized (PASSED) run accepts no further finalize (ERR_INVALID_STATE), while a NEW run may be started afterwards because no run is RUNNING."
        test_recipe:
          setup:
            - "Project MOCK_CONVERSION; MOCK-1 finalized PASSED."
          setup_api_calls:
            - call: "POST /api/v1/conversions"
              payload: { institution_name: "Bank", incumbent_core_name: "Old", target_core_name: "Fiserv DNA" }
              as: ProjectManager
              captures: { pid: $.data.id }
            - call: "POST /api/v1/product-types"
              payload: {project_id: "${pid}",  product_code: "DDA", kind: "DEPOSIT", accrual_method: "ACT_365", rate: 0.01, statement_frequency: "MONTHLY" }
              as: ConversionEngineer
              captures: { pt: $.data.id }
            - call: "POST /api/v1/product-types/${pt}/activate"
              payload: {}
              as: ConversionEngineer
            - call: "POST /api/v1/gl-accounts"
              payload: {project_id: "${pid}",  gl_code: "GL-1", description: "deposits" }
              as: ConversionEngineer
              captures: { gl: $.data.id }
            - call: "POST /api/v1/accounts"
              payload: {project_id: "${pid}",  legacy_account_number: "L-1", account_type: "DEPOSIT", product_type_id: "${pt}", opening_principal_cents: 1000, statement_cycle_day: 1, accrual_start_date: "2026-09-01" }
              as: ConversionEngineer
              captures: { acct: $.data.id }
            - call: "GET /api/v1/conversions/${pid}"
              payload: {}
              as: ConversionEngineer
              captures: { pv: $.data.version }
            - call: "POST /api/v1/accounts/${acct}/map"
              payload: { gl_account_id: "${gl}", expected_project_version: "${pv}" }
              as: ConversionEngineer
            - call: "POST /api/v1/conversions/${pid}/advance"
              payload: {}
              as: ProjectManager
            - call: "POST /api/v1/conversions/${pid}/advance"
              payload: {}
              as: ProjectManager
            - call: "POST /api/v1/mock-runs"
              payload: {project_id: "${pid}",  run_label: "MOCK-1" }
              as: ConversionEngineer
              captures: { run: $.data.id }
            - call: "POST /api/v1/mock-runs/${run}/finalize"
              payload: {}
              as: ConversionEngineer
          trigger:
            - call: "POST /api/v1/mock-runs/${run}/finalize"
              payload: {}
              as: ConversionEngineer
              captures: { err: $.data.error_id }
            - call: "POST /api/v1/mock-runs"
              payload: {project_id: "${pid}",  run_label: "MOCK-2" }
              as: ConversionEngineer
              captures: { run2: $.data.id, run2_state: $.data.state }
          assert:
            - "err == ERR_INVALID_STATE (terminal lockdown on PASSED)"
            - "run2_state == RUNNING (new run permitted once no run is RUNNING)"

      - name: defect_reopen_cascade_on_claim
        claim_type: side_effect_execution
        grounds:
          - state_machines.Defect.RESOLVED_to_REOPENED
        distinguishing_aspect: "Already covered end-to-end by a difficulty instance."
        excluded_because:
          difficulty_instance: transitive_cascade / defect_reopen_cascades_service_credit_dispute
          rationale: "The cascade Defect.reopen -> ServiceCredit DISPUTED with auto dispute_note is asserted there."

      - name: session_cancel_cascades_reserved_enrollments
        claim_type: side_effect_execution
        grounds:
          - state_machines.TrainingSession.SCHEDULED_to_CANCELLED
        distinguishing_aspect: "Cancelling a SCHEDULED session flips every RESERVED enrollment to CANCELLED and recomputes reserved_count to 0; ATTENDED enrollments (none possible pre-start) would be untouched."
        test_recipe:
          setup:
            - "Project; session MAIN capacity 3 with two RESERVED enrollments."
          setup_api_calls:
            - call: "POST /api/v1/conversions"
