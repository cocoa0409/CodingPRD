              as_user_id: "po-1"
          assert:
            - "Dependency unsatisfied: the first trigger call returns 422 with error_id ERR_NOTICE_NOT_PUBLISHED while NoticePacket.${np1_id}.status == DRAFT"
            - "BiometricAsset.${asset_id}.status remains CLASSIFIED with pinned_policy_id null and collection_started_at null"
            - "Dependency satisfied: NoticePacket.${np1_id}.status == PUBLISHED with published_at == 2026-08-01T00:00:00.000Z and consent_eligible_from == 2026-08-15T00:00:00.000Z"
            - "The third trigger call returns 200 with BiometricAsset.${asset_id}.status == ACTIVE and pinned_policy_id == ${pol1_id}"
            - "ComplianceProgram.${prog_id}.inventory_completeness_pct == 100.00 and posture == OPEN"

      - name: incident_remediation_requires_every_affected_asset_out_of_active
        grounds:
          - state_machines.IncidentCase.CONTAINED_to_REMEDIATED
          - entities.BiometricAsset.fields.status
          - errors[ERR_ASSET_STILL_ACTIVE]
          - entities.IncidentCase.fields.affected_asset_ids
