  - section: errors
    instances:
      - name: unknown_path_identifiers_return_the_entity_specific_not_found_error
        claim_type: error_triggerable
        grounds:
          - errors[ERR_APPLICATION_NOT_FOUND]
          - errors[ERR_FILING_NOT_FOUND]
          - errors[ERR_REFERENCE_NOT_FOUND]
        distinguishing_aspect: "The 404 catalogue is entity-specific rather than generic: an unknown application id yields ERR_APPLICATION_NOT_FOUND and an unknown filing id yields ERR_FILING_NOT_FOUND, while the entities without a dedicated code — CustomerContract and Shipment — fall through to ERR_REFERENCE_NOT_FOUND."
        test_recipe:
          setup:
            - "an empty registry at the default clock instant"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
          trigger:
            - call: "GET /authority-applications/00000000-0000-4000-8000-0000000006a1"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "staff-co-002"
              captures: { app_missing_error: $.data.error_id }
            - call: "GET /insurance-filings/00000000-0000-4000-8000-0000000006a2"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "staff-co-002"
              captures: { filing_missing_error: $.data.error_id }
            - call: "GET /customer-contracts/00000000-0000-4000-8000-0000000006a3"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "staff-co-002"
              captures: { contract_missing_error: $.data.error_id }
            - call: "GET /shipments/00000000-0000-4000-8000-0000000006a4"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "staff-co-002"
              captures: { shipment_missing_error: $.data.error_id }
          assert:
            - "${app_missing_error} == 'ERR_APPLICATION_NOT_FOUND' with HTTP 404"
            - "${filing_missing_error} == 'ERR_FILING_NOT_FOUND' with HTTP 404"
            - "${contract_missing_error} == 'ERR_REFERENCE_NOT_FOUND' with HTTP 404"
            - "${shipment_missing_error} == 'ERR_REFERENCE_NOT_FOUND' with HTTP 404"
            - "every one of the four responses carries a non-empty error_id and message and no data payload fields"

