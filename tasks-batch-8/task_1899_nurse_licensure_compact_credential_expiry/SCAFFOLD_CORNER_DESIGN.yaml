            - "GET /credentialing/nurses returns total_count == 0"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_nurse_patch_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[nurse-patch-stale-version]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "PATCH OCC: a second update carrying the pre-first-update version is rejected 412 ERR_STALE_VERSION; the winner's write stands and version advanced to 2."
        test_recipe:
          setup: ["Clock 2026-08-01; nurse created (version 1 captured)."]
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Occ Patch", email: "occ.patch@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_id: "$.data.id", n_v: "$.data.version" } }
          trigger:
            - { call: "PATCH /credentialing/nurses/${n_id}", payload: { primary_state_of_residence: "TX", expected_nurse_version: "${n_v}" }, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "PATCH /credentialing/nurses/${n_id}", payload: { primary_state_of_residence: "FL", expected_nurse_version: "${n_v}" }, as: CredentialingSpecialist, as_user_id: "spec-2", captures: { err: "$.data.error_id" } }
          assert:
            - "First PATCH succeeds (PSOR 'TX', version 2)"
            - "Second PATCH with the stale version fails 412 error_id == 'ERR_STALE_VERSION'"
            - "Nurse.${n_id}.primary_state_of_residence remains 'TX' and version == 2"

      - name: occ_privilege_eval_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[privilege-eval-stale-nurse]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Create-with-supersede OCC on the append-only evaluation log: after a first explicit evaluation advances Nurse.version, a second evaluation against the pre-advance version is rejected 412."
        test_recipe:
          setup: ["Clock 2026-08-01; nurse with ACTIVE attested AZ multistate license (privilege derivation appended one LICENSE_CHANGE row; nurse version captured afterwards)."]
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Occ Eval", email: "occ.eval@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_id}", state_code: "AZ", license_number: "RN-AZ-OE1", license_class: "RN", multistate_flag: true, issued_on: "2026-06-15", expires_on: "2027-06-30" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { lic_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses/${lic_id}/submit", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/primary-source-verifications", payload: { license_id: "${lic_id}", channel: "NURSYS" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { psv_id: "$.data.id" } }
            - { call: "POST /credentialing/primary-source-verifications/${psv_id}/record-result", payload: { outcome: "VERIFIED" }, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/state-licenses/${lic_id}/attest", payload: {}, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "GET /credentialing/nurses/${n_id}", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_v: "$.data.version" } }
          trigger:
            - { call: "POST /credentialing/privilege-evaluations", payload: { nurse_id: "${n_id}", expected_nurse_version: "${n_v}" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { ev1: "$.data.id" } }
            - { call: "POST /credentialing/privilege-evaluations", payload: { nurse_id: "${n_id}", expected_nurse_version: "${n_v}" }, as: CredentialingSpecialist, as_user_id: "spec-2", captures: { err: "$.data.error_id" } }
          assert:
            - "First evaluation succeeds 201 (trigger_reason 'MANUAL', resulting_status 'ELIGIBLE_MULTISTATE') and advances Nurse.version"
            - "Second evaluation with the stale expected_nurse_version fails 412 error_id == 'ERR_STALE_VERSION'"
            - "GET /credentialing/privilege-evaluations?nurse_id=${n_id} returns exactly 2 rows (LICENSE_CHANGE + the one MANUAL row)"

      - name: layer_cascading_side_effects_covered
        claim_type: cascading_side_effects
        grounds:
          - "complexity_profile.complexity_layers"
        excluded_because:
          difficulty_instance: sweep_license_expiry_cascade_depth4
          rationale: "N-level cascade with ordering sensitivity is exercised end-to-end by the named §1.8 instance (and by discipline_adjudication_privilege_revocation_cascade for the second trigger pattern)."

      - name: layer_dual_variant_calculation_covered
        claim_type: dual_variant_calculation
        grounds:
          - "complexity_profile.complexity_layers"
        excluded_because:
          difficulty_instance: competency_expiry_rolling_vs_fiscal_divergence
          rationale: "Both variants and their divergence (plus the audit-rate pair) are asserted by the named §1.8 dual_variant_calc instances."

      - name: layer_derived_field_reconciliation_covered
        claim_type: derived_field_reconciliation
        grounds:
          - "entities.Unit.fields.scheduled_hours_total"
          - "entities.Nurse.fields.credential_posture"
        excluded_because:
          difficulty_instance: shift_book_cancel_conserves_unit_hours
          rationale: "Derived unit counters reconciling across create/cancel are asserted there; posture derivation across triggers is asserted by posture_evaluation_fixpoint_snapshot_order and shift_creation_gated_on_nurse_posture."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: attest_response_immediately_consistent
        claim_type: immediate_consistency
        grounds:
          - "complexity_profile.consistency_model"
          - "state_machines.StateLicense.VERIFIED_to_ACTIVE"
        distinguishing_aspect: "Immediate consistency: the attest 200 response itself carries status ACTIVE and verified_by_user_id; a subsequent GET returns the identical persisted values (no lag, no recompute on read)."
        test_recipe:
          setup: ["Clock 2026-08-01; nurse's license VERIFIED via fresh PSV."]
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Con Sistent", email: "con.sistent@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_id}", state_code: "AZ", license_number: "RN-AZ-CS1", license_class: "RN", multistate_flag: true, issued_on: "2026-06-15", expires_on: "2027-06-30" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { lic_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses/${lic_id}/submit", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/primary-source-verifications", payload: { license_id: "${lic_id}", channel: "NURSYS" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { psv_id: "$.data.id" } }
            - { call: "POST /credentialing/primary-source-verifications/${psv_id}/record-result", payload: { outcome: "VERIFIED" }, as: PrimarySourceVerifier, as_user_id: "ver-1" }
          trigger:
            - { call: "POST /credentialing/state-licenses/${lic_id}/attest", payload: {}, as: PrimarySourceVerifier, as_user_id: "ver-1", captures: { st: "$.data.status", vb: "$.data.verified_by_user_id" } }
            - { call: "GET /credentialing/state-licenses/${lic_id}", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
          assert:
            - "The attest response body has status == 'ACTIVE' and verified_by_user_id == 'ver-1' (mutation visible in the same response)"
            - "The following GET returns status == 'ACTIVE' and verified_by_user_id == 'ver-1' — identical to the mutation response"
