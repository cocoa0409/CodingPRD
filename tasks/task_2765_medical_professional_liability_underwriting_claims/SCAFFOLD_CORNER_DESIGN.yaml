            - "PolicyTerm.${term_b1}.return_premium == 12298.08"
            - "PolicyTerm.${term_b1}.aggregate_limit_remaining == 3000000.00"
            - "Policy.${pol_b}.written_premium_net_total == 12501.92"
            - "Policy.${pol_b}.status == CANCELLED"
            - "Policy.${pol_b}.current_term_id == null"

