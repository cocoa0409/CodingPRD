# =============================================================================
# task_0114_hotel_property_management — SCAFFOLD.yaml
# Hotel Property Management System (PMS)
# Difficulty: EXPERT (scaffold-generator §0.4)
# Topology: FLAT — every entity is a peer collection directly under /pms,
# linked by foreign keys carried in the request body (not nested URL paths).
# =============================================================================

scenario: |
  Hotel Property Management System (PMS): reservation/room block, rate plan
  (BAR/corporate/package), availability/overbooking, room assignment/upgrade,
  folio/incidentals, night audit, group cutoff, housekeeping status, no-show
  policy

domain_name: hotel-property-management
api_prefix: /pms

# -----------------------------------------------------------------------------
# Complexity profile (§0.1–§0.3)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: quota-allocation
  secondary_archetype: temporal-windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a peer collection under /pms; relationships are FK fields in
  # the body. Hotel is the logical aggregate root referenced by hotel_id.

  state_machine_shape: branching
  # Reservation forks (HELD vs CONFIRMED) and converges; Room housekeeping cycles
  # DIRTY->CLEAN->INSPECTED->OCCUPIED->DIRTY (cyclic); GroupBlock branches at
  # wash; Folio adds a DISPUTED revert dimension parallel to the Reservation.

  relationship_patterns:
    - one_to_many       # Hotel -> RoomType/Room/RatePlan/GroupBlock/Reservation
    - cross_aggregate   # Reservation -> Guest, CorporateAccount, RatePlan, Room
    - polymorphic       # Incidental.posted_by_kind: AGENT vs NIGHT_AUDIT origin

  role_model: peer_roles
  # FrontDeskAgent runs the desk; RevenueManager owns rate/inventory config;
  # NightAuditor runs the audit epoch; Guest is entity-backed self-service.

  consistency_model: immediate
  # Availability counters, folio balances and posture all recompute
  # synchronously inside the mutating request.

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — emitted verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Hotel
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: name, type: string, source: input, description: "Property name" }
      - { name: timezone, type: string, source: input, description: "IANA tz; business-date boundary for night audit", default: "UTC" }
      - { name: current_business_date, type: string, source: input, description: "YYYY-MM-DD; advances by one calendar day on each completed night audit" }
      - { name: overbooking_allowance_pct, type: number, source: input, description: "Sell-over-physical fraction applied per RoomType per date; 0.10 means inventory*1.10", default: 0.0, constraints: "0.0 <= x <= 0.25" }
      - { name: audit_epoch, type: integer, source: system, description: "Monotonic counter; +1 per completed NightAuditRun", default: 0 }
      - { name: posture, type: enum, source: computed, description: "OPEN | AUDIT_LOCK; AUDIT_LOCK while a NightAuditRun is IN_PROGRESS, blocks reservation/room/folio mutations", default: "OPEN", constraints: "OPEN | AUDIT_LOCK" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC; refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 per mutation", default: 1 }

