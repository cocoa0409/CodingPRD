            - "Member.${cm001_id}.rewards_points_balance == 0 and GET /benefits/members/${cm001_id}/rewards-balance reports points_balance 0 over an empty posted set"
            - "a second read of the same summary returns byte-identical counts, so the read is a pure recompute and not a one-shot repair"
            - "the rollup and the balance are reconciled on read from the source rows rather than served from a stored counter"

      - name: saga_style_compensation_leaves_no_drift_when_the_second_step_fails
        claim_type: saga
        grounds:
          - state_machines.RewardsLedgerEntry.POSTED_to_REVERSED
          - calculations.rewards_points_balance
          - calculations.rewards_principal_reduction_cents
        distinguishing_aspect: "The forward redemption and its compensating reversal form a two-step saga whose compensating action is an explicit REVERSE ledger row, so a failure of the second leg is repaired by a named compensating entry rather than by rollback of the first."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member M-CM-002 has an ADOPTED LENDING holding with LoanAccount la at principal_cents 250000 and rewards_points_balance 4000."
          setup_api_calls:
