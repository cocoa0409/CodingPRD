        grounds:
          - calculations.claim_bar_date
          - state_machines.CreditorClaim.FILED_to_ALLOWED
          - state_machines.CreditorClaim.FILED_to_BARRED
        distinguishing_aspect: |
          A claim filed at exactly claim_bar_date (2026-08-29T00:00:00Z, opened
          2026-05-01 + 120 days) is IN period (<= boundary) and becomes ALLOWED,
          not BARRED — the inclusive <= edge on the /claims/{id}/allow endpoint.
        test_recipe:
          setup:
            - "An OPEN estate (granted at clock 2026-05-01) with an APPOINTED PR (INDEPENDENT gross, no bond) and a claim filed at exactly 2026-08-29T00:00:00Z."
          setup_api_calls:
