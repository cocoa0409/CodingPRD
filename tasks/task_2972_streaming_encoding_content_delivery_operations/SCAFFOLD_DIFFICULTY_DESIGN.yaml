              captures: { v_alpha_id: $.data.id }
            - call: "POST /cdn-vendors"
              payload: { vendor_code: "BRAVO", regions: ["US"], committed_gbps: 80.00, cost_per_gb_usd: 0.0300 }
              as: PlatformAdmin
              captures: { v_bravo_id: $.data.id }
            - call: "POST /cdn-vendors"
              payload: { vendor_code: "CHARLIE", regions: ["US", "CA"], committed_gbps: 60.00, cost_per_gb_usd: 0.0400 }
              as: PlatformAdmin
              captures: { v_charlie_id: $.data.id }
            - call: "POST /titles"
              payload: { external_ref: "TTL-STEER-01", title_name: "Steering Cascade Subject", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "POST /routing-policies"
              payload: { title_id: "${t_id}", region_code: "US", steering_mode: "COST" }
              as: DeliveryEngineer
              captures: { pol_id: $.data.id }
          trigger:
            - call: "POST /playback-metrics"
              payload: { title_id: "${t_id}", device_profile_id: "${dp_tv_id}", vendor_id: "${v_alpha_id}", region_code: "US", window_start_at: "2026-07-25T00:00:00Z", window_end_at: "2026-07-26T00:00:00Z", play_attempts: 1000, rebuffer_events: 90, startup_ms_p95: 4400, error_count: 20 }
              as: DeliveryEngineer
              captures: { w_id: $.data.id }
            - call: "GET /routing-policies/${pol_id}"
              payload: {}
              as: DeliveryEngineer
          assert:
            - "before the trigger RoutingPolicy.${pol_id}.primary_vendor_id == ${v_alpha_id}, backup_vendor_id == ${v_bravo_id}, state == ACTIVE, selection_reason_code == COST_RANK, resteer_count == 0 and projected_egress_cost_usd == 27.00"
            - "hop 1: PlaybackMetricWindow.${w_id}.quality_index == 33.50, rebuffer_ratio == 0.0900, error_rate == 0.0200 and breach_flag == true"
            - "hop 2: CdnVendor.${v_alpha_id}.health_score_rolling == 33.50, health_score_contract == 33.50, breach_window_count == 1 and state == DEGRADED"
            - "hop 3: RoutingPolicy.${pol_id}.primary_vendor_id == ${v_bravo_id}, backup_vendor_id == ${v_charlie_id}, state == ACTIVE, resteer_count == 1 and excluded_vendor_ids contains ${v_alpha_id}"
            - "hop 4: RoutingPolicy.${pol_id}.projected_egress_cost_usd == 81.00"
            - "CdnVendor.${v_bravo_id}.state == ACTIVE and CdnVendor.${v_bravo_id}.health_score_contract == 100.00"

  - rule_id: priority_pair_validation_conflict
    instances:

      - name: reservation_failover_state_beats_capacity
        grounds:
          - validations[priority=10]
          - validations[priority=19]
          - errors.ERR_RESERVATION_STATE_INVALID
          - errors.ERR_VENDOR_CAPACITY_EXCEEDED
          - calculations.vendor_capacity_availability
        distinguishing_aspect: |
          One failover request violates BOTH the priority-10 state rule (the reservation is RESERVED, not
          ARMED or LIVE) and the priority-19 fiscal rule (the failover vendor is already held to its full
          committed_gbps), and the response is the 409 ERR_RESERVATION_STATE_INVALID — the 422
          ERR_VENDOR_CAPACITY_EXCEEDED is never reached. The category pair is state versus
          business_fiscal, unlike the sibling instance's business_safety versus business_referential.
        test_recipe:
          setup:
            - "Vendors ALPHA (US, committed 100.00) and BRAVO (US, committed 60.00) exist."
            - "Title TTL-LIVE-01 has content_type LIVE_EVENT and a SCHEDULED US window covering 2026-09-01 to 2026-11-01."
            - "A blocking reservation already holds BRAVO's entire 60.00 Gbps over 2026-09-10T00:00:00Z..04:00:00Z."
            - "The target reservation holds 10.00 Gbps on ALPHA over the identical interval and names BRAVO as its failover vendor. It is still in state RESERVED — it was never armed."
          setup_api_calls:
            - call: "POST /cdn-vendors"
              payload: { vendor_code: "ALPHA", regions: ["US"], committed_gbps: 100.00, cost_per_gb_usd: 0.0250 }
              as: PlatformAdmin
              captures: { v_alpha_id: $.data.id }
            - call: "POST /cdn-vendors"
              payload: { vendor_code: "BRAVO", regions: ["US"], committed_gbps: 60.00, cost_per_gb_usd: 0.0300 }
              as: PlatformAdmin
              captures: { v_bravo_id: $.data.id }
            - call: "POST /titles"
              payload: { external_ref: "TTL-LIVE-01", title_name: "Championship Final", content_type: "LIVE_EVENT", studio_code: "NOVASPORT" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "POST /titles/${t_id}/availability-windows"
              payload: { region_code: "US", window_start_at: "2026-09-01T00:00:00Z", window_end_at: "2026-11-01T00:00:00Z", license_tier: "STANDARD" }
              as: ContentOps
            - call: "POST /live-reservations"
              payload: { title_id: "${t_id}", primary_vendor_id: "${v_bravo_id}", window_start_at: "2026-09-10T00:00:00Z", window_end_at: "2026-09-10T04:00:00Z", reserved_gbps: 60.00 }
              as: DeliveryEngineer
              captures: { r_block_id: $.data.id }
            - call: "POST /live-reservations"
              payload: { title_id: "${t_id}", primary_vendor_id: "${v_alpha_id}", failover_vendor_id: "${v_bravo_id}", window_start_at: "2026-09-10T00:00:00Z", window_end_at: "2026-09-10T04:00:00Z", reserved_gbps: 10.00 }
              as: DeliveryEngineer
              captures: { r_target_id: $.data.id }
          trigger:
            - call: "POST /live-reservations/${r_target_id}/failover"
              payload: {}
              as: DeliveryEngineer
          assert:
            - "the response status is 409 and error_id == ERR_RESERVATION_STATE_INVALID"
            - "the response status is NOT 422 and error_id is NOT ERR_VENDOR_CAPACITY_EXCEEDED"
            - "LiveEventReservation.${r_target_id}.state == RESERVED"
            - "LiveEventReservation.${r_target_id}.active_vendor_id == ${v_alpha_id}"
            - "LiveEventReservation.${r_target_id}.failover_at == null"
            - "CdnVendor.${v_alpha_id}.reserved_gbps == 10.00"
            - "CdnVendor.${v_bravo_id}.reserved_gbps == 60.00"
            - "LiveEventReservation.${r_block_id}.state == RESERVED"

      - name: entitlement_rule_safety_beats_referential
        grounds:
          - validations[priority=13]
          - validations[priority=14]
          - errors.ERR_HDCP_FLOOR_VIOLATION
          - errors.ERR_RULE_REGION_NOT_LICENSED
          - entities.DrmPackage.fields.hdcp_floor
        distinguishing_aspect: |
          One entitlement-rule request violates BOTH the priority-13 content-protection floor
          (hdcp_level NONE under a TYPE_1 package floor) and the priority-14 referential rule (region FR
          is covered by no window of the Title), and the response is ERR_HDCP_FLOOR_VIOLATION; fixing
          only the hdcp_level then surfaces ERR_RULE_REGION_NOT_LICENSED, proving the ordering rather
          than a single always-first error. Both rules return 422, so only the error_id discriminates.
        test_recipe:
          setup:
            - "One MOBILE_HIGH device profile exists."
            - "Title TTL-SAFETY-01 (MOVIE) has NO AvailabilityWindow at all, so no region is licensed."
            - "The Title owns a DRAFT HEVC ladder peaking at 2160p, and a PENDING DrmPackage bound to it whose hdcp_floor is therefore TYPE_1 and whose persistent_license_allowed is false."
          setup_api_calls:
            - call: "POST /device-profiles"
              payload: { device_class: "MOBILE_HIGH", max_height_px: 1080, supported_codecs: ["H264", "HEVC"], min_bitrate_kbps: 800, max_bitrate_kbps: 6000, hdcp_required: false, required_drm_system: "NONE", market_share_pct: 45.00, quality_normalization_factor: 0.90 }
              as: PlatformAdmin
            - call: "POST /titles"
              payload: { external_ref: "TTL-SAFETY-01", title_name: "Protection Floor Subject", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver: $.data.version }
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "HEVC", rungs: [{ label: "1080p", height_px: 1080, bitrate_kbps: 5000 }, { label: "2160p", height_px: 2160, bitrate_kbps: 12000 }], expected_title_version: "${t_ver}" }
              as: EncodingEngineer
              captures: { l_id: $.data.id }
            - call: "POST /drm-packages"
              payload: { title_id: "${t_id}", ladder_id: "${l_id}", drm_systems: ["WIDEVINE"], license_server_url: "https://lic.novapic.example/v1", persistent_license_allowed: false }
              as: DrmOperator
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /drm-packages/${p_id}/entitlement-rules"
              payload: { region_code: "FR", subscription_tier: "PREMIUM", device_class_scope: "ALL", max_concurrent_streams: 1, max_playback_height_px: 1080, hdcp_level: "NONE", offline_playback_allowed: false, priority: 10 }
              as: DrmOperator
            - call: "POST /drm-packages/${p_id}/entitlement-rules"
              payload: { region_code: "FR", subscription_tier: "PREMIUM", device_class_scope: "ALL", max_concurrent_streams: 1, max_playback_height_px: 1080, hdcp_level: "TYPE_1", offline_playback_allowed: false, priority: 10 }
              as: DrmOperator
          assert:
            - "DrmPackage.${p_id}.hdcp_floor == TYPE_1"
            - "the first trigger call returns 422 with error_id ERR_HDCP_FLOOR_VIOLATION"
            - "the first trigger call does NOT return error_id ERR_RULE_REGION_NOT_LICENSED"
            - "the second trigger call returns 422 with error_id ERR_RULE_REGION_NOT_LICENSED"
            - "DrmPackage.${p_id}.entitlement_rule_count == 0 after both calls"

  - rule_id: boundary_precision_check
    instances:

      - name: vendor_capacity_equality_admits_reservation
        grounds:
          - calculations.vendor_capacity_availability
          - validations[priority=19]
          - entities.CdnVendor.fields.reserved_gbps
          - errors.ERR_VENDOR_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          With 20.00 Gbps already held on a vendor committed to 80.00, a request for exactly 60.00 Gbps
          over the same interval is accepted at the equality boundary while a further request for 0.01
          Gbps is rejected — one hundredth of a Gbps on the inclusive side of `held + requested <=
          committed`. The sibling boundary instance probes a zero-valued score against a strict
          greater-than predicate instead of an aggregate ceiling.
        test_recipe:
          setup:
            - "Vendor ALPHA serves US with committed_gbps 80.00 and starts at reserved_gbps 0.00."
            - "Title TTL-BOUND-01 has content_type LIVE_EVENT and a SCHEDULED US window covering 2026-09-01 to 2026-11-01."
            - "One reservation already holds 20.00 Gbps on ALPHA over 2026-09-10T00:00:00Z..04:00:00Z with the default 15-minute buffer."
          setup_api_calls:
            - call: "POST /cdn-vendors"
              payload: { vendor_code: "ALPHA", regions: ["US"], committed_gbps: 80.00, cost_per_gb_usd: 0.0250 }
              as: PlatformAdmin
              captures: { v_alpha_id: $.data.id }
            - call: "POST /titles"
              payload: { external_ref: "TTL-BOUND-01", title_name: "Capacity Boundary Event", content_type: "LIVE_EVENT", studio_code: "NOVASPORT" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "POST /titles/${t_id}/availability-windows"
              payload: { region_code: "US", window_start_at: "2026-09-01T00:00:00Z", window_end_at: "2026-11-01T00:00:00Z", license_tier: "STANDARD" }
              as: ContentOps
            - call: "POST /live-reservations"
              payload: { title_id: "${t_id}", primary_vendor_id: "${v_alpha_id}", window_start_at: "2026-09-10T00:00:00Z", window_end_at: "2026-09-10T04:00:00Z", reserved_gbps: 20.00 }
              as: DeliveryEngineer
              captures: { r1_id: $.data.id }
          trigger:
            - call: "POST /live-reservations"
              payload: { title_id: "${t_id}", primary_vendor_id: "${v_alpha_id}", window_start_at: "2026-09-10T00:00:00Z", window_end_at: "2026-09-10T04:00:00Z", reserved_gbps: 60.00 }
              as: DeliveryEngineer
              captures: { r2_id: $.data.id }
            - call: "POST /live-reservations"
              payload: { title_id: "${t_id}", primary_vendor_id: "${v_alpha_id}", window_start_at: "2026-09-10T00:00:00Z", window_end_at: "2026-09-10T04:00:00Z", reserved_gbps: 0.01 }
              as: DeliveryEngineer
          assert:
            - "the first trigger call returns 201 and LiveEventReservation.${r2_id}.reserved_gbps == 60.00"
            - "LiveEventReservation.${r2_id}.state == RESERVED and LiveEventReservation.${r2_id}.active_vendor_id == ${v_alpha_id}"
            - "CdnVendor.${v_alpha_id}.reserved_gbps == 80.00"
            - "the second trigger call returns 422 with error_id ERR_VENDOR_CAPACITY_EXCEEDED"
            - "CdnVendor.${v_alpha_id}.reserved_gbps == 80.00 after the rejected call"
            - "LiveEventReservation.${r1_id}.state == RESERVED"

      - name: empty_active_device_pool_rejects_ladder
        grounds:
          - calculations.device_compat_score
          - state_machines.EncodingLadder.DRAFT_to_REJECTED
          - entities.EncodingLadder.fields.validation_reason_code
          - entities.DeviceProfile.fields.state
        distinguishing_aspect: |
          The only device profile in the system is RETIRED, so the ACTIVE candidate set is empty,
          device_compat_score lands on exactly 0.00 and the validate call takes the REJECTED arm with
          NO_COMPATIBLE_DEVICE because the accepting predicate is a STRICT `> 0.00`. A subsequent lock
          on the terminal ladder is a 409. The boundary here is a zero-valued score, not a ceiling.
        test_recipe:
          setup:
            - "Exactly one DeviceProfile exists and it was created with state RETIRED."
            - "Title TTL-NODEV-01 (MOVIE) owns one DRAFT HEVC ladder with 2 rungs peaking at 1080p."
            - "No MezzanineAsset and no DrmPackage exist for the Title."
          setup_api_calls:
            - call: "POST /device-profiles"
              payload: { device_class: "MOBILE_HIGH", max_height_px: 1080, supported_codecs: ["H264", "HEVC"], min_bitrate_kbps: 800, max_bitrate_kbps: 6000, hdcp_required: false, required_drm_system: "NONE", market_share_pct: 45.00, quality_normalization_factor: 0.90, state: "RETIRED" }
              as: PlatformAdmin
            - call: "POST /titles"
              payload: { external_ref: "TTL-NODEV-01", title_name: "Empty Device Pool Subject", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver: $.data.version }
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "HEVC", rungs: [{ label: "720p", height_px: 720, bitrate_kbps: 2500 }, { label: "1080p", height_px: 1080, bitrate_kbps: 5000 }], expected_title_version: "${t_ver}" }
              as: EncodingEngineer
              captures: { l_id: $.data.id }
          trigger:
            - call: "POST /encoding-ladders/${l_id}/validate"
              payload: {}
              as: EncodingEngineer
            - call: "POST /encoding-ladders/${l_id}/lock"
              payload: {}
              as: EncodingEngineer
          assert:
            - "the first trigger call returns 200 (a rejection verdict, not an error response)"
            - "EncodingLadder.${l_id}.state == REJECTED"
            - "EncodingLadder.${l_id}.validation_reason_code == NO_COMPATIBLE_DEVICE"
            - "EncodingLadder.${l_id}.device_compat_score == 0.00"
            - "EncodingLadder.${l_id}.compatible_device_count == 0"
            - "the second trigger call returns 409 with error_id ERR_LADDER_STATE_INVALID"
            - "Title.${t_id}.locked_ladder_count == 0"
            - "Title.${t_id}.readiness_score_provisional == 0.00"
            - "Title.${t_id}.readiness_score_certified == 0.00"

  - rule_id: cross_entity_state_dependency
    instances:

      - name: live_arm_requires_packaged_drm
        grounds:
          - state_machines.LiveEventReservation.RESERVED_to_ARMED
          - validations[priority=11]
          - errors.ERR_PACKAGE_NOT_READY
          - state_machines.DrmPackage.PENDING_to_PACKAGED
        distinguishing_aspect: |
          Arming a reservation is blocked by the state of a DIFFERENT entity — the Title's DrmPackage is
          still PENDING — and the identical request succeeds once that package reaches PACKAGED, with no
          field of the reservation itself changing in between. The guarded pair is
          LiveEventReservation depending on DrmPackage; the sibling instance's pair is EncodingLadder
          depending on MezzanineAsset.
        test_recipe:
          setup:
            - "One MOBILE_HIGH device profile and one vendor ALPHA (US, committed 100.00) exist."
            - "Title TTL-ARM-01 has content_type LIVE_EVENT, a SCHEDULED US window covering 2026-09-01 to 2026-11-01, one QC_PASSED asset and a LOCKED HEVC ladder."
            - "A DrmPackage bound to that ladder exists but is still PENDING, and it already carries one entitlement rule."
            - "A STANDBY_ONLY US routing policy and a RESERVED 10.00 Gbps reservation on ALPHA over 2026-09-10T00:00:00Z..04:00:00Z exist."
            - "The logical clock is at its 2026-08-01T00:00:00Z default, before the reservation window."
