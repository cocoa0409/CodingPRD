  # ===========================================================================
  # Rule 3 — non_linear_state_machine
  # Parallel dimensions on Ticket, a cycle on CredentialRequest, and a fork with
  # divergent side effects on DeniedEntryIncident.
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: ticket_lifecycle_and_admission_dimensions_advance_independently
        grounds:
          - state_machines.Ticket.ISSUED_to_LISTED
          - state_machines.Ticket.LISTED_to_ISSUED
          - state_machines.Ticket.NOT_ADMITTED_to_INSIDE
          - state_machines.Ticket.INSIDE_to_EXITED
          - entities.Ticket.fields.lifecycle_status
          - entities.Ticket.fields.admission_status
          - concurrency_rules[resale-listing-create-stale-ticket]
        distinguishing_aspect: |
          PARALLEL shape: the ticket's lifecycle_status walks ISSUED → LISTED → ISSUED while
          admission_status stays pinned at INSIDE, and then admission_status walks INSIDE →
          EXITED while lifecycle_status stays pinned at ISSUED — neither dimension is a
          function of the other, and the combined state (ISSUED, EXITED) is legal.
        test_recipe:
          setup:
            - "Event DOORS_OPEN, price_cap_regime VENUE_POLICY; AccessZone GA1 (fire_code_capacity 200); Gate G1."
            - "Ada verified, holding a PAID 12000-cent ticket bound to DEV-ADA."
            - "Logical clock at 2026-09-12T18:10:00Z (epoch 20); ONLINE ScanSession open on G1; Ada already scanned IN, so admission_status == INSIDE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events"
              payload:
                name: "Aurora Night"
                venue_name: "Northgate Arena"
                fire_code_capacity: 200
                barcode_anchor_at: "2026-09-12T18:00:00Z"
                doors_open_at: "2026-09-12T18:00:00Z"
                event_start_at: "2026-09-12T19:00:00Z"
                transfer_window_closes_at: "2026-09-12T17:00:00Z"
                price_cap_regime: "VENUE_POLICY"
                transfer_limit_per_ticket: 2
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/access-zones"
              payload:
                zone_code: "GA1"
                required_entitlement_level: "GA"
                fire_code_capacity: 200
                face_value_reference_cents: 8750
                credential_capacity: 4
                comp_discount_pct: 0.85
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { z_ga_id: $.data.id }
            - call: "POST /events/${ev_id}/gates"
              payload: { gate_code: "G1", access_zone_id: "${z_ga_id}", throughput_per_minute: 20, lanes_open: 2 }
