  - rule_id: transitive_cascade
    instances:
      - name: burn_in_failure_cascades_cabinet_project_visit
        grounds:
          - state_machines.Cabinet.BURN_IN_to_QUARANTINED
          - state_machines.DisplayProject.IN_ASSEMBLY_to_BLOCKED
          - state_machines.CommissioningVisit.SCHEDULED_to_ABORTED
          - calculations.cabinet_dead_pixel_ppm
          - entities.CommissioningCrew.fields.scheduled_visit_count
        distinguishing_aspect: |
          Trigger is POST /burn-in-runs/{id}/complete with a failing pixel
          count. Depth 4: BurnInRun -> FAILED, Cabinet -> QUARANTINED,
          DisplayProject.production_state -> BLOCKED, CommissioningVisit ->
          ABORTED plus the crew's booking counter released. A different trigger
          from the fulfil-driven and sign-off-driven cascades in this block, and
          the only one that also unwinds a chamber slot reservation on the way.
        test_recipe:
          setup:
            - "FP10-IN display model (1 module per cabinet, cabinet_pixel_count 1024, dead_pixel_ppm_limit 976.56, burn_in_hours_required 24)."
            - "A 1x1 RETAIL project, engineering APPROVED, production IN_ASSEMBLY; its cabinet is POPULATED with M-1 (dead_pixel_count 1) and currently in BURN_IN."
            - "Chamber CH-1 (slot_capacity 4, turnaround_minutes 60) holds a SCHEDULED run over 2026-08-02T00:00:00.000Z .. 2026-08-03T00:00:00.000Z with slots_required 2, so reserved_slot_total is 2."
            - "Crew West (region NA-W) has a SCHEDULED visit for the project, scheduled_visit_count 1."
            - "The clock has been advanced to the run's window_end."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
