      - name: delinquency_flips_when_the_balance_crosses_the_threshold
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.owner_fee_balance_and_delinquency
          - errors[ERR_OWNER_DELINQUENT]
          - validations[priority 35]
        distinguishing_aspect: |
          Delinquency is a derived threshold over a running ledger balance rather than a stored flag,
          so it must flip on at exactly the threshold and flip back off when a payment drops the
          balance below it.
        excluded_because:
          difficulty_instance: delinquency_threshold_is_inclusive_at_exactly_25000_cents
          rationale: |
            The §1.8 boundary_precision_check instance already pins the inclusive edge from both
            sides - 24,999 cents leaves the owner CURRENT and lets the write through, 25,000 cents
            makes it DELINQUENT and returns the 402, and the abatement that drops the balance by one
            cent restores service. That covers the threshold trigger and its reversal, so no
            additional corner instance is warranted.

      - name: the_two_penalty_variants_disagree_by_construction
        claim_type: dual_variant_calculation
        grounds:
          - calculations.civil_penalty_accrual
          - endpoints[GET /remediation-orders/{id}/penalty-preview]
          - endpoints[POST /program/compliance-sweep]
        distinguishing_aspect: |
          The same accrual formula is exposed twice with different rules - the preview is uncapped
          and unabated, the sweep applies the cap and only then the good-faith abatement - so the two
          numbers must differ on the same order rather than one being reused for the other.
        excluded_because:
          difficulty_instance: provisional_penalty_preview_exceeds_final_assessed_penalty_after_abatement
          rationale: |
            The §1.8 dual_variant_calc instance already reads the preview and then runs the sweep on
            the same defaulted order, asserting the uncapped provisional figure, the capped
            assessed figure, the ordering between them and the single CIVIL_PENALTY ledger row that
            only the final variant writes. Repeating it here would add no discriminating power.

  - section: consistency_model
    instances:
