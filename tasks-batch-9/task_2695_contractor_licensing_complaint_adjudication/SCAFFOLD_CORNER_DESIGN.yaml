              as: BoardAdmin
              captures: { cls_id: $.data.id }
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Cure Electric LLC", entity_type: "LLC", contact_email: "cure@x.test" }
              as: LicensingAnalyst
              captures: { lic_id: $.data.id }
            - call: "POST /licensing/qualifying-individuals"
              payload: { full_name: "Cora Cure", verified_experience_months: 60 }
              as: LicensingAnalyst
              captures: { qi_id: $.data.id }
