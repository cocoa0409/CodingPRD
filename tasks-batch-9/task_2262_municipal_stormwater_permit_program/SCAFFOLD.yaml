    applies_to: ["POST /stormwater/outfalls/{id}/observations"]

  - id: ERR_SCREENING_INTERVAL_VIOLATION
    http_status: 409
    condition: "a DRY_WEATHER_SCREENING is recorded within 14 days of another screening at the same outfall, in either direction"
    applies_to: ["POST /stormwater/outfalls/{id}/observations"]

  - id: ERR_OBSERVATION_NOT_PENDING
    http_status: 409
    condition: "validate called on an observation whose validation_status is not PENDING, including a DRY_WEATHER_SCREENING"
    applies_to: ["POST /stormwater/observations/{id}/validate"]

  - id: ERR_SELF_VALIDATION_FORBIDDEN
    http_status: 409
    condition: "validate called by the same X-User-ID that recorded the observation"
    applies_to: ["POST /stormwater/observations/{id}/validate"]

  - id: ERR_SWEEPING_RUN_OVERLAP
    http_status: 409
    condition: "the half-open interval [run_start_date, run_end_date) overlaps an existing run on the same outfall"
    applies_to: ["POST /stormwater/outfalls/{id}/sweeping-runs"]

  - id: ERR_SWEEPING_CAPACITY_EXCEEDED
    http_status: 422
    condition: "the calendar-month lane-mile total for the outfall would exceed sweeping_capacity_lane_miles_per_month"
    applies_to: ["POST /stormwater/outfalls/{id}/sweeping-runs"]

  - id: ERR_CASE_INVALID_STATE
    http_status: 409
    condition: "the requested case transition does not exist from the current status"
    applies_to: ["POST /stormwater/illicit-discharge-cases/{id}/start-tracing", "POST /stormwater/illicit-discharge-cases/{id}/identify-source", "POST /stormwater/illicit-discharge-cases/{id}/reopen-tracing", "POST /stormwater/illicit-discharge-cases/{id}/resolve", "POST /stormwater/enforcement-actions"]

  - id: ERR_REOPEN_LIMIT_REACHED
    http_status: 422
    condition: "reopen-tracing called when reopen_count is already 3"
    applies_to: ["POST /stormwater/illicit-discharge-cases/{id}/reopen-tracing"]

  - id: ERR_CASE_HAS_OPEN_ENFORCEMENT
    http_status: 409
    condition: "resolve or reopen-tracing called while an EnforcementAction on the case is ISSUED or ESCALATED"
    applies_to: ["POST /stormwater/illicit-discharge-cases/{id}/resolve", "POST /stormwater/illicit-discharge-cases/{id}/reopen-tracing"]

  - id: ERR_SITE_NOT_ACTIVE_DISTURBANCE
    http_status: 409
    condition: "the operation requires field_status ACTIVE_DISTURBANCE"
    applies_to: ["POST /stormwater/construction-sites/{id}/stop-work", "POST /stormwater/construction-sites/{id}/close", "POST /stormwater/inspections"]

  - id: ERR_SITE_NOT_STOPPED
    http_status: 409
    condition: "release-stop-work called while field_status is not STOP_WORK"
    applies_to: ["POST /stormwater/construction-sites/{id}/release-stop-work"]

  - id: ERR_SITE_CLOSED
    http_status: 409
    condition: "the site field_status is CLOSED and no further plan or field operation is accepted"
    applies_to: ["POST /stormwater/construction-sites/{id}/submit-esc-plan", "POST /stormwater/construction-sites/{id}/esc-review", "POST /stormwater/construction-sites/{id}/stop-work", "POST /stormwater/construction-sites/{id}/close", "POST /stormwater/inspections"]

  - id: ERR_PLAN_NOT_IN_REVIEW
    http_status: 409
    condition: "esc-review called while plan_status is not ESC_REVIEW"
    applies_to: ["POST /stormwater/construction-sites/{id}/esc-review"]

  - id: ERR_ESC_PLAN_NOT_APPROVED
    http_status: 422
    condition: "a CONSTRUCTION_ESC inspection is created, or a stop-work release is attempted, while plan_status is not APPROVED"
    applies_to: ["POST /stormwater/inspections", "POST /stormwater/construction-sites/{id}/release-stop-work"]

  - id: ERR_SITE_HAS_OPEN_ENFORCEMENT
    http_status: 409
    condition: "release-stop-work or close called while open_enforcement_count is above 0"
    applies_to: ["POST /stormwater/construction-sites/{id}/release-stop-work", "POST /stormwater/construction-sites/{id}/close"]

  - id: ERR_CLOSE_REQUIRES_MAINTENANCE_AGREEMENT
    http_status: 422
    condition: "close called on a site whose post_construction_control_required is true with no facility whose agreement_status is RECORDED or NOT_REQUIRED"
    applies_to: ["POST /stormwater/construction-sites/{id}/close"]

  - id: ERR_AGREEMENT_ALREADY_RECORDED
    http_status: 409
    condition: "record-agreement called on a facility whose agreement_status is RECORDED, or on a MUNICIPAL facility whose agreement_status is NOT_REQUIRED"
    applies_to: ["POST /stormwater/post-construction-facilities/{id}/record-agreement"]

  - id: ERR_AGREEMENT_NOT_RECORDED
    http_status: 422
    condition: "a POST_CONSTRUCTION_MAINTENANCE inspection is finalized while the facility agreement_status is PENDING"
    applies_to: ["POST /stormwater/inspections/{id}/finalize"]

  - id: ERR_INSPECTION_SUBJECT_MISMATCH
    http_status: 422
    condition: "the subject foreign keys do not match inspection_type: none set, both set, or the wrong one for the type"
    applies_to: ["POST /stormwater/inspections"]

  - id: ERR_INSPECTION_PERIOD_OVERLAP
    http_status: 409
    condition: "the closed coverage interval touches or overlaps another inspection of the same inspection_type on the same subject"
    applies_to: ["POST /stormwater/inspections"]

  - id: ERR_INSPECTION_NOT_DRAFT
    http_status: 409
    condition: "findings or finalize called on an inspection whose status is FINALIZED"
    applies_to: ["POST /stormwater/inspections/{id}/findings", "POST /stormwater/inspections/{id}/finalize"]

  - id: ERR_INSPECTION_NO_FINDINGS
    http_status: 422
    condition: "finalize called on an inspection whose findings list is empty"
    applies_to: ["POST /stormwater/inspections/{id}/finalize"]

  - id: ERR_ENFORCEMENT_SUBJECT_INVALID
    http_status: 422
    condition: "not exactly one of illicit_discharge_case_id, construction_site_id, post_construction_facility_id is supplied, or source_inspection_id does not belong to the named subject"
    applies_to: ["POST /stormwater/enforcement-actions"]

  - id: ERR_SOURCE_INSPECTION_NOT_FINALIZED
    http_status: 422
    condition: "source_inspection_id names an inspection whose status is DRAFT"
    applies_to: ["POST /stormwater/enforcement-actions"]

  - id: ERR_INSPECTOR_CANNOT_ENFORCE
    http_status: 409
    condition: "the acting X-User-ID equals finalized_by_user_id of the named source inspection"
    applies_to: ["POST /stormwater/enforcement-actions"]

  - id: ERR_ENFORCEMENT_NOT_OPEN
    http_status: 409
    condition: "escalate, close or rescind called on an action whose status is CLOSED or RESCINDED"
    applies_to: ["POST /stormwater/enforcement-actions/{id}/escalate", "POST /stormwater/enforcement-actions/{id}/close", "POST /stormwater/enforcement-actions/{id}/rescind"]

  - id: ERR_LADDER_EXHAUSTED
    http_status: 422
    condition: "escalate called on an action whose action_type is already CIVIL_PENALTY"
    applies_to: ["POST /stormwater/enforcement-actions/{id}/escalate"]

  - id: ERR_ESCALATION_COOLING_OFF
    http_status: 409
    condition: "escalate called less than 14 days after last_escalated_at, or after issued_at when never escalated"
    applies_to: ["POST /stormwater/enforcement-actions/{id}/escalate"]

  - id: ERR_PENALTY_DECREASE_FORBIDDEN
    http_status: 422
    condition: "escalate supplies violation_days below the stored violation_days"
    applies_to: ["POST /stormwater/enforcement-actions/{id}/escalate"]

  - id: ERR_RESCIND_AFTER_ESCALATION
    http_status: 409
    condition: "rescind called on an action whose escalation_count is above 0"
    applies_to: ["POST /stormwater/enforcement-actions/{id}/rescind"]

  - id: ERR_CREDIT_APPLICATION_NOT_SUBMITTED
    http_status: 409
    condition: "review called on an application whose status is not SUBMITTED"
    applies_to: ["POST /stormwater/fee-credit-applications/{id}/review"]

  - id: ERR_CREDIT_APPLICATION_NOT_RETURNED
    http_status: 409
    condition: "resubmit called on an application whose status is not RETURNED"
    applies_to: ["POST /stormwater/fee-credit-applications/{id}/resubmit"]

  - id: ERR_CREDIT_APPLICATION_NOT_APPROVED
    http_status: 409
    condition: "revoke called on an application whose status is not APPROVED"
    applies_to: ["POST /stormwater/fee-credit-applications/{id}/revoke"]

  - id: ERR_CREDIT_CEILING_EXCEEDED
    http_status: 422
    condition: "approving would push the account's APPROVED credit total above 0.5000"
    applies_to: ["POST /stormwater/fee-credit-applications/{id}/review"]

  - id: ERR_FACILITY_NOT_CREDIT_ELIGIBLE
    http_status: 422
    condition: "the substantiating facility is MUNICIPAL, has no recorded agreement, or is overdue for maintenance inspection"
    applies_to: ["POST /stormwater/fee-credit-applications/{id}/review"]

  - id: ERR_RESUBMISSION_LIMIT_REACHED
    http_status: 422
    condition: "resubmit called when resubmission_count is already 2"
    applies_to: ["POST /stormwater/fee-credit-applications/{id}/resubmit"]

  - id: ERR_NOT_APPLICANT
    http_status: 403
    condition: "resubmit called by a PropertyOwner whose X-User-ID differs from applicant_user_id"
    applies_to: ["POST /stormwater/fee-credit-applications/{id}/resubmit"]

  - id: ERR_REPORT_WINDOW_OUTSIDE_TERM
    http_status: 422
    condition: "the reporting window is not contained in [term_start_date, term_end_date]"
    applies_to: ["POST /stormwater/annual-reports"]

  - id: ERR_REPORT_NOT_DRAFT
    http_status: 409
    condition: "compile called on a report whose status is not DRAFT"
    applies_to: ["POST /stormwater/annual-reports/{id}/compile"]

  - id: ERR_REPORT_NOT_COMPILED
    http_status: 409
    condition: "certify called on a report whose status is not COMPILED"
    applies_to: ["POST /stormwater/annual-reports/{id}/certify"]

  - id: ERR_REPORT_NOT_CERTIFIED
    http_status: 409
    condition: "submit called on a report whose status is not CERTIFIED"
    applies_to: ["POST /stormwater/annual-reports/{id}/submit"]

  - id: ERR_PENDING_SAMPLES_IN_WINDOW
    http_status: 422
    condition: "compile attempted while a WET_WEATHER_SAMPLE inside the reporting window has validation_status PENDING"
    applies_to: ["POST /stormwater/annual-reports/{id}/compile"]

  - id: ERR_SAME_USER_CERTIFICATION
    http_status: 409
    condition: "certify called by the same X-User-ID that compiled the report"
    applies_to: ["POST /stormwater/annual-reports/{id}/certify"]

  - id: ERR_POSTURE_NON_COMPLIANT
    http_status: 422
    condition: "certify attempted while PermitTerm.compliance_posture is NON_COMPLIANT"
    applies_to: ["POST /stormwater/annual-reports/{id}/certify"]

  - id: ERR_REPORT_SUBMISSION_WINDOW_CLOSED
    http_status: 409
    condition: "submit attempted more than 90 days after reporting_period_end"
    applies_to: ["POST /stormwater/annual-reports/{id}/submit"]

# =============================================================================
# §1.7 RBAC Permission Matrix — 7 roles, segregation of duties
# =============================================================================
roles:

  - name: StormwaterProgramManager
    description: "Owns the permit term, the minimum control measure set, monitoring assessment and the annual report."
    identity: opaque
    exclusive_operations:
      - "POST /stormwater/permit-terms"
      - "POST /stormwater/permit-terms/{id}/activate"
      - "POST /stormwater/permit-terms/{id}/expire"
      - "POST /stormwater/control-measures"
      - "POST /stormwater/control-measures/{id}/retire"
      - "POST /stormwater/outfalls/{id}/retire"
      - "POST /stormwater/annual-reports"
      - "POST /stormwater/annual-reports/{id}/compile"
      - "POST /stormwater/annual-reports/{id}/certify"
      - "POST /stormwater/annual-reports/{id}/submit"
    shared_operations:
      - "POST /stormwater/control-measures/{id}/report-progress (with MunicipalOperationsSupervisor)"
      - "POST /stormwater/outfalls (with MunicipalOperationsSupervisor)"
      - "POST /stormwater/observations/{id}/validate (with MunicipalOperationsSupervisor)"
      - "POST /stormwater/outfalls/{id}/load-assessments (with MunicipalOperationsSupervisor)"
      - "POST /stormwater/construction-sites (with ConstructionInspector)"
      - "POST /stormwater/post-construction-facilities (with ConstructionInspector)"
      - "POST /stormwater/post-construction-facilities/{id}/record-agreement (with ConstructionInspector)"
      - "every GET endpoint except the fee-credit and account reads shared with PropertyOwner"
      - "POST /_clock/set_current_utc"
    segregation_notes:
      - "MUST NOT certify a report it compiled: certify checks the acting X-User-ID against compiled_by_user_id."

  - name: IDDEInvestigator
    description: "Screens outfalls, opens no case by hand but traces, identifies sources and resolves the cases the screening cascade creates."
    identity: opaque
    exclusive_operations:
      - "POST /stormwater/illicit-discharge-cases/{id}/start-tracing"
      - "POST /stormwater/illicit-discharge-cases/{id}/identify-source"
      - "POST /stormwater/illicit-discharge-cases/{id}/reopen-tracing"
      - "POST /stormwater/illicit-discharge-cases/{id}/resolve"
    shared_operations:
      - "POST /stormwater/outfalls/{id}/observations (with MunicipalOperationsSupervisor)"
      - "read access to permit terms, outfalls, observations, cases, sites, inspections and enforcement actions"
      - "POST /_clock/set_current_utc"
    segregation_notes:
      - "Cannot validate a wet-weather sample at all, and cannot issue enforcement."

  - name: ConstructionInspector
    description: "Reviews erosion and sediment control plans, inventories permanent controls and runs both inspection programs."
    identity: opaque
    exclusive_operations:
      - "POST /stormwater/construction-sites/{id}/submit-esc-plan"
      - "POST /stormwater/construction-sites/{id}/esc-review"
      - "POST /stormwater/construction-sites/{id}/close"
      - "POST /stormwater/inspections"
      - "POST /stormwater/inspections/{id}/findings"
      - "POST /stormwater/inspections/{id}/finalize"
    shared_operations:
      - "POST /stormwater/construction-sites (with StormwaterProgramManager)"
      - "POST /stormwater/post-construction-facilities (with StormwaterProgramManager)"
      - "POST /stormwater/post-construction-facilities/{id}/record-agreement (with StormwaterProgramManager)"
      - "read access to permit terms, sites, facilities, inspections and enforcement actions"
      - "POST /_clock/set_current_utc"
    segregation_notes:
      - "Has no stop-work authority of its own: only the finalize cascade or an EnforcementOfficer can stop a site."
      - "The X-User-ID that finalized an inspection MUST NOT be the issuer of an enforcement action citing it, which in practice bars this role from enforcement entirely."

  - name: EnforcementOfficer
    description: "Holds stop-work authority and the enforcement ladder."
    identity: opaque
    exclusive_operations:
      - "POST /stormwater/construction-sites/{id}/stop-work"
      - "POST /stormwater/construction-sites/{id}/release-stop-work"
      - "POST /stormwater/enforcement-actions"
      - "POST /stormwater/enforcement-actions/{id}/escalate"
      - "POST /stormwater/enforcement-actions/{id}/close"
      - "POST /stormwater/enforcement-actions/{id}/rescind"
    shared_operations:
      - "read access to permit terms, sites, facilities, cases, inspections and enforcement actions"
      - "POST /_clock/set_current_utc"
    segregation_notes:
      - "Cannot create or finalize the inspection that documents a violation."

  - name: MunicipalOperationsSupervisor
    description: "Runs municipal operations pollution prevention: fleet and salt storage flags, street sweeping runs, and adjudication of monitoring samples."
    identity: opaque
    exclusive_operations:
      - "POST /stormwater/outfalls/{id}/sweeping-runs"
    shared_operations:
      - "POST /stormwater/outfalls (with StormwaterProgramManager)"
      - "POST /stormwater/outfalls/{id}/observations (with IDDEInvestigator)"
      - "POST /stormwater/observations/{id}/validate (with StormwaterProgramManager)"
      - "POST /stormwater/outfalls/{id}/load-assessments (with StormwaterProgramManager)"
      - "POST /stormwater/control-measures/{id}/report-progress (with StormwaterProgramManager)"
      - "read access to permit terms, outfalls, observations, cases, sites, inspections and enforcement actions"
      - "POST /_clock/set_current_utc"
    segregation_notes:
      - "MUST NOT validate a sample it recorded itself; a second holder of this role or a StormwaterProgramManager is required."

  - name: UtilityBillingClerk
    description: "Runs the stormwater utility: accounts, impervious remeasurement, billing runs and credit review."
    identity: opaque
    exclusive_operations:
      - "POST /stormwater/accounts"
      - "POST /stormwater/accounts/{id}/impervious-updates"
      - "POST /stormwater/permit-terms/{id}/billing-runs"
      - "POST /stormwater/fee-credit-applications/{id}/review"
      - "POST /stormwater/fee-credit-applications/{id}/revoke"
    shared_operations:
      - "POST /stormwater/fee-credit-applications (with PropertyOwner, for counter-filed applications)"
      - "read access to permit terms, accounts, fee credit applications, outfalls, sites, facilities, inspections and enforcement actions"
      - "POST /_clock/set_current_utc"
    segregation_notes:
      - "Cannot resubmit a returned application: only its applicant can."

  - name: PropertyOwner
    description: "Billed parcel owner; may file, resubmit and read its own fee credit applications and account."
    identity: "entity_backed:StormwaterAccount"
    exclusive_operations:
      - "POST /stormwater/fee-credit-applications/{id}/resubmit"
    shared_operations:
      - "POST /stormwater/fee-credit-applications (with UtilityBillingClerk)"
      - "GET /stormwater/accounts/{id}"
      - "GET /stormwater/fee-credit-applications"
      - "GET /stormwater/fee-credit-applications/{id}"
      - "GET /stormwater/post-construction-facilities/{id}"
      - "GET /stormwater/construction-sites/{id}/post-construction-facilities"
    segregation_notes:
      - "Resubmit additionally checks applicant_user_id, so one owner cannot resubmit another owner's application (ERR_NOT_APPLICANT)."
      - "Has no access to the operational surface: screenings, inspections, enforcement and reports are all closed to it."
