      - name: crack_regrade_conserves_population_count_net_zero
        grounds:
          - calculations.population_bump
          - calculations.population_decrement
          - state_machines.SubmissionItem.ENCAPSULATED_to_CRACK_PENDING
          - state_machines.SubmissionItem.AUTHENTICATED_to_ENCAPSULATED
          - entities.PopulationReport.fields.pop_count
        distinguishing_aspect: |
          Conserved quantity = population count (an integer inventory, different
          from money). A full crack-and-regrade that re-encapsulates at the SAME
          grade leaves the bucket's pop_count net unchanged: bump (1) then crack
          decrement (0) then re-encapsulate bump (1) == 1, no drift.
        test_recipe:
          setup:
            - "Item encapsulated at final grade 9.0 (bucket pop_count 1), then cracked, regraded to the same 9.0, re-authenticated and re-encapsulated."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c18@x.com", full_name: "C Eighteen" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", turnaround_business_days: 2, base_fee_cents: 5000, max_declared_value_cents: 50000, insurance_rate_bps: 200 }
              as: LabAdmin
              captures: { sl_id: $.data.id }
            - call: "POST /grading-standards"
              payload: { code: "CARD_10PT", max_grade: 10, authentic_min_grade: 1.0, centering_weight_bps: 2500, corners_weight_bps: 2500, edges_weight_bps: 2500, surface_weight_bps: 2500 }
              as: LabAdmin
              captures: { gs_id: $.data.id }
            - call: "POST /submissions"
              payload: { customer_id: "${cust_id}", service_level_id: "${sl_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/items"
              payload: { grading_standard_id: "${gs_id}", title: "Card P", declared_value_cents: 30000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { item_id: $.data.id }
            - call: "POST /submissions/${sub_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /submission-items/${item_id}/intake"
              payload: { condition_note: "ok", matches_declaration: true }
              as: Receiver
            - call: "POST /submission-items/${item_id}/grade-assessments"
              payload: { grading_standard_id: "${gs_id}", centering_subgrade: 9, corners_subgrade: 9, edges_subgrade: 9, surface_subgrade: 9 }
              as: Grader
              captures: { ga1: $.data.id }
            - call: "POST /grade-assessments/${ga1}/finalize"
              payload: {}
              as: Grader
            - call: "POST /submission-items/${item_id}/authentication"
              payload: { verdict: "GENUINE" }
              as: Authenticator
            - call: "POST /submission-items/${item_id}/encapsulate"
              payload: { assessment_id: "${ga1}" }
              as: Authenticator
              captures: { slab1: $.data.id }
            - call: "GET /submission-items/${item_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { item_v: $.data.version }
            - call: "POST /submission-items/${item_id}/regrade-requests"
              payload: { prior_slab_id: "${slab1}", expected_item_version: "${item_v}", reason: "recheck" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /submission-items/${item_id}/grade-assessments"
              payload: { grading_standard_id: "${gs_id}", centering_subgrade: 9, corners_subgrade: 9, edges_subgrade: 9, surface_subgrade: 9 }
              as: Grader
              captures: { ga2: $.data.id }
            - call: "POST /grade-assessments/${ga2}/finalize"
              payload: {}
              as: Grader
            - call: "POST /submission-items/${item_id}/authentication"
              payload: { verdict: "GENUINE" }
              as: Authenticator
          trigger:
            - call: "POST /submission-items/${item_id}/encapsulate"
              payload: { assessment_id: "${ga2}" }
              as: Authenticator
              captures: { slab2: $.data.id }
          assert:
            - "PopulationReport(standard=${gs_id}, title_key='CARD P', grade_value=9.0).pop_count == 1"
            - "Slab.${slab2}.active == true"
