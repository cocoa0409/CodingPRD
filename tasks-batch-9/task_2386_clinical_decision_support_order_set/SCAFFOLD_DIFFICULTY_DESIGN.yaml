            - call: "GET /cds/clinicians/${rev1_id}"
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { assigned_1: $.data.review_workload_assigned_minutes, remaining_1: $.data.review_workload_remaining_minutes, open_1: $.data.open_assignment_count }
            - call: "POST /cds/review-assignments"
              payload: { reviewer_id: "${rev1_id}", review_kind: "SPECIALTY_APPROVAL", alert_id: "${al_id}" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { ra_b_id: $.data.id, ra_b_min: $.data.estimated_minutes }
            - call: "GET /cds/clinicians/${rev1_id}"
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { assigned_2: $.data.review_workload_assigned_minutes, remaining_2: $.data.review_workload_remaining_minutes, open_2: $.data.open_assignment_count }
            - call: "POST /cds/review-assignments/${ra_b_id}/cast"
              payload: { vote: "APPROVE" }
              as: SpecialtyApprover
              as_user_id: "${rev1_id}"
              captures: { ra_b_state: $.data.state }
            - call: "GET /cds/clinicians/${rev1_id}"
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { assigned_3: $.data.review_workload_assigned_minutes, remaining_3: $.data.review_workload_remaining_minutes, open_3: $.data.open_assignment_count }
            - call: "POST /cds/review-assignments/${ra_a_id}/withdraw"
              payload: { withdrawal_reason: "Reviewer recused for the first pass" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { ra_a_state: $.data.state }
            - call: "GET /cds/clinicians/${rev1_id}"
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { assigned_4: $.data.review_workload_assigned_minutes, remaining_4: $.data.review_workload_remaining_minutes, open_4: $.data.open_assignment_count }
            - call: "POST /cds/review-assignments"
              payload: { reviewer_id: "${rev1_id}", review_kind: "PEER_REVIEW", order_set_id: "${os_id}" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { ra_c_id: $.data.id, ra_c_min: $.data.estimated_minutes }
            - call: "GET /cds/clinicians/${rev1_id}"
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { assigned_5: $.data.review_workload_assigned_minutes, remaining_5: $.data.review_workload_remaining_minutes, open_5: $.data.open_assignment_count }
            - call: "POST /cds/review-assignments/${ra_c_id}/withdraw"
              payload: { withdrawal_reason: "Rebalancing the committee roster" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { ra_c_state: $.data.state }
            - call: "GET /cds/clinicians/${rev1_id}"
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { assigned_6: $.data.review_workload_assigned_minutes, remaining_6: $.data.review_workload_remaining_minutes, open_6: $.data.open_assignment_count }
          assert:
            - "${cap} == 480, ${assigned_0} == 0, ${remaining_0} == 480, ${open_0} == 0 — the invariant holds at rest: 480 == 0 + 480"
            - "${risk} == HIGH and ${peer_required} == 3 and ${ra_a_risk} == HIGH and ${ra_a_min} == 35 (REVIEW_MINUTES.PEER_REVIEW.HIGH)"
            - "${assigned_1} == 35, ${remaining_1} == 445, ${open_1} == 1 — 480 == 35 + 445"
            - "${ra_b_min} == 30 (ALERT_REVIEW_MINUTES.TIER_1_HARD_STOP, not REVIEW_MINUTES.SPECIALTY_APPROVAL.HIGH of 25)"
            - "${assigned_2} == 65, ${remaining_2} == 415, ${open_2} == 2 — 480 == 65 + 415"
            - "${ra_b_state} == CAST and ${assigned_3} == 65 and ${remaining_3} == 415 while ${open_3} == 1 — the cast conserves the MINUTES ledger exactly and decrements only the open count; the two counters are not the same quantity"
            - "${ra_a_state} == WITHDRAWN, ${assigned_4} == 30, ${remaining_4} == 450, ${open_4} == 0 — 480 == 30 + 450, and the credited amount is exactly ra_a's 35"
            - "${ra_c_min} == 35 and ${assigned_5} == 65 and ${remaining_5} == 415 and ${open_5} == 1 — the identical re-assignment restores the minutes ledger to its pre-withdraw value with zero drift, and it is legal only because WITHDRAWN rows are invisible to the duplicate-assignment rule"
            - "${ra_c_state} == WITHDRAWN, ${assigned_6} == 30, ${remaining_6} == 450, ${open_6} == 0 — 480 == 30 + 450, matching checkpoint 4 exactly after a full withdraw / re-assign / withdraw round trip"
            - "At every one of the seven checkpoints review_workload_assigned_minutes equals the sum of estimated_minutes over rev1's ReviewAssignment rows in state ASSIGNED or CAST: GET /cds/review-assignments?reviewer_id=${rev1_id}&state=ASSIGNED and &state=CAST reconcile to the same totals"

      - name: compensating_alert_firing_ledger_conserved_across_window_close_and_reopen
        conserved_quantity: "Alert.lifetime_fire_count == windowed_fire_count + unwindowed_fire_count, with lifetime_fire_count itself immutable under any window transition"
        grounds:
          - entities.Alert.fields.lifetime_fire_count
          - entities.Alert.fields.windowed_fire_count
          - entities.Alert.fields.unwindowed_fire_count
          - state_machines.AlertBurdenWindow.OPEN_to_CLOSED
          - state_machines.AlertBurdenWindow.CLOSED_to_OPEN
          - calculations.alert_burden_index
        distinguishing_aspect: |
          A completely different conserved quantity from the reviewer time budget: a
          firing ledger partitioned into windowed and unwindowed halves. Closing a window
          moves 40 firings from one half to the other and reopening it must move exactly
          those 40 back while leaving lifetime_fire_count untouched, so the compensation
          is a partition shift rather than a credit. Five out-of-window firings sit on the
          unwindowed side throughout and must never be swept in, and the derived mirrors
          latest_burden_index and latest_burden_classification must be nulled on reopen
          and rebuilt identically on the second close.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sponsor, builder, chair and two specialty approvers exist."
            - "An accepted ALERT request carries a TIER_2_INTERRUPTIVE alert with two override reason codes and no linked order set; it is APPROVED by two unanimous votes and activated at clock 2026-09-01T00:00:00Z."
            - "Batch A: 40 firings at 3600s from 2026-09-01T00:00:00Z, 36 of them overrides, across 10 clinicians."
            - "Clock advanced to 2026-11-05T00:00:00Z, then Batch B: 5 firings at 3600s from 2026-11-01T00:00:00Z, all overrides, across 3 clinicians — deliberately outside the monitoring window."
            - "One window spans 2026-09-01T00:00:00Z to 2026-10-01T00:00:00Z, so it captures Batch A and excludes Batch B."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cds/clinicians"
              payload: { full_name: "Dr Reyes", npi: "1000000001", specialty: "CARDIOLOGY", authorized_roles: ["ClinicalSponsor"] }
              as: SystemAdmin
              captures: { sponsor_id: $.data.id }
