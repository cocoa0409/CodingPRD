  - partner_legal_entity_id?
  - status?
  - limit?
  - offset?
  output: CounterpartyRelationship[]
  side_effects: []
- method: POST
  path: /counterparty-relationships/{id}/activate
  description: Activate a PENDING or SUSPENDED relationship; refused while an unattributed deposit is still open
    on either side's ledger
  roles:
  - PaymentApprover
  code: 200
  input:
  - expected_relationship_version
  output: CounterpartyRelationship
  side_effects:
  - CounterpartyRelationship.status = ACTIVE
  - increments CounterpartyRelationship.version by 1
  - 'AuditEvent appended: action=counterparty_relationship.activated'
