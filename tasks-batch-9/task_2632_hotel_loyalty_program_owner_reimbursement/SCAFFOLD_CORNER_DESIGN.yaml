            - call: "POST /loyalty/hotels/${hB_id}/rate-plans"
              payload: { rate_code: "BAR", rate_category: "TRANSIENT" }
              as: ProgramAdministrator
              captures: { rpB_id: $.data.id }
            - call: "POST /loyalty/hotels/${hB_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/members"
              payload: { email: "pc1@example.com", full_name: "Member One", enrollment_date: "2026-01-12" }
              as: ProgramAdministrator
              captures: { m1_id: $.data.id }
            - call: "POST /loyalty/members"
              payload: { email: "pc2@example.com", full_name: "Member Two", enrollment_date: "2026-01-13" }
              as: ProgramAdministrator
              captures: { m2_id: $.data.id }
            - call: "POST /loyalty/stays"
              payload: { member_id: "${m1_id}", hotel_id: "${hA_id}", rate_plan_id: "${rpA_id}", checkin_date: "2026-06-01", checkout_date: "2026-06-11", room_revenue_cents: 100000 }
              as: ProgramAdministrator
              captures: { s1_id: $.data.id }
            - call: "POST /loyalty/stays/${s1_id}/post"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/stays"
              payload: { member_id: "${m1_id}", hotel_id: "${hA_id}", rate_plan_id: "${rpA_id}", checkin_date: "2026-06-15", checkout_date: "2026-06-17", room_revenue_cents: 40000 }
