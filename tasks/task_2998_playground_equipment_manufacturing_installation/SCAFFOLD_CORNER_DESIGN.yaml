            - "collecting one day later: HTTP 409 and ${err_deadline} == ERR_FUNDRAISING_DEADLINE_PASSED"
            - "FundraisingPledge.${pledge_b_id}.status is still PLEDGED and funds_collected_cents is still 25000"
            - "the project's design_status is CONSULTATION-independent here: pledges are accepted in any state outside {CANCELLED, INSTALLED, AUDITED} per priority 86"

      - name: crew_capacity_aggregate_validation_is_covered_by_the_difficulty_design
        claim_type: aggregate_validation
        grounds:
          - validations[priority=65]
          - errors.ERR_CREW_CAPACITY_EXCEEDED
          - calculations.installer_committed_crew_days
        distinguishing_aspect: "Each individual booking is within the installer's crew_capacity, but the overlapping set collectively exceeds it, so the aggregate must be recomputed across all open bookings rather than checked per job."
        excluded_because:
          difficulty_instance: installer_booking_requires_one_clear_travel_day_between_jobs
          rationale: "That resource_temporal_overlap instance already books an overlapping set and asserts ERR_CREW_CAPACITY_EXCEEDED at 2026-08-13 once the travel-day buffer is clear, proving the aggregate rule is reachable on its own."

      - name: validate_priority_ordering_is_covered_by_the_difficulty_design
        claim_type: priority_ordering
        grounds:
          - validations[priority=42]
          - validations[priority=60]
        distinguishing_aspect: "A placement that is both in a non-editable project and geometrically overlapping must report the priority-42 state error, not the priority-60 geometry error."
        excluded_because:
          difficulty_instance: placement_validate_state_error_precedes_use_zone_overlap
          rationale: "That priority_pair_validation_conflict instance already violates both rules in one call and asserts that ERR_PROJECT_NOT_EDITABLE wins, then clears the state error and shows ERR_USE_ZONE_OVERLAP surfacing."

      - name: firm_quote_safety_before_fiscal_ordering_is_covered_by_the_difficulty_design
        claim_type: priority_conflict
        grounds:
          - validations[priority=54]
          - validations[priority=80]
        distinguishing_aspect: "A FIRM quote that is simultaneously under-surfaced and over budget must report the priority-54 safety error; the fiscal check only runs once every safety and constraint check has passed."
        excluded_because:
          difficulty_instance: firm_quote_surfacing_safety_error_precedes_budget_overrun
          rationale: "That priority_pair_validation_conflict instance already issues the doubly-violating FIRM quote, asserts ERR_SURFACING_DEPTH_INSUFFICIENT, then fixes the depth and asserts ERR_QUOTE_EXCEEDS_BUDGET."

  # =========================================================================
  - section: endpoints
    instances:
      - name: placement_delete_clears_child_link_and_recomputes_area_derivations
        claim_type: standard_crud
        grounds:
          - endpoints[DELETE /playground/placements/{id}]
          - entities.ComponentPlacement.fields.attached_to_placement_id
          - entities.PlayArea.fields.critical_fall_height_cm
          - errors.ERR_PLACEMENT_NOT_FOUND
        distinguishing_aspect: "DELETE answers 204 with no body, clears attached_to_placement_id on the surviving child instead of cascading the delete, and re-runs the area derivations: removing the 122 cm deck drops critical_fall_height_cm from 122 to 0 and required_surfacing_depth_cm from 28 to 15."
