# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Enumerates testable claims of SCAFFOLD.yaml §1.1–§1.7 not already covered by §1.8.
scaffold_corner_design:
  # ============================================================ entities
  - section: entities
    instances:
      - name: bin_create_applies_system_defaults
        claim_type: creation_defaults
        grounds: ["entities.Bin.fields.posture", "entities.Bin.fields.risk_score", "entities.Bin.fields.current_inventory_bu"]
        distinguishing_aspect: "A created bin starts posture SOUND, risk_score 0.00, current_inventory_bu 0, insect_activity false, version 1, server-minted UUID id."
        test_recipe:
          setup: ["empty DB; default logical clock 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /grain/bins", payload: { name: "BIN-1", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { b1: $.data.id } }
          assert:
            - "HTTP 201; data.posture == SOUND; data.risk_score == 0.00; data.current_inventory_bu == 0; data.insect_activity == false; data.version == 1"
      - name: bin_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET with a well-formed but unknown bin id returns ERR_NOT_FOUND / HTTP 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /grain/bins/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: SiteManager, captures: { e1: $.data.error_id } }
          assert: ["HTTP 404; error_id == ERR_NOT_FOUND; response_type == error"]
      - name: lot_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.GrainLot.fields.original_bu", "validations[priority=6]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required input original_bu from lot create is a 400 ERR_VALIDATION; the lot is not created."
        test_recipe:
          setup: ["bin BIN-V corn cap 5000"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-V", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_v: $.data.id } }
          trigger:
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_v}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", fill_moisture_pct: 15.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager, captures: { e2: $.data.error_id } }
          assert: ["HTTP 400; error_id == ERR_VALIDATION"]
      - name: lot_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: ["entities.GrainLot.fields.crop", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "crop 'RICE' is outside the CORN|SOYBEAN|WHEAT enum -> 400 ERR_VALIDATION even though the bin exists."
        test_recipe:
          setup: ["bin BIN-E corn cap 5000"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-E", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_e: $.data.id } }
          trigger:
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_e}", crop: "RICE", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 100.00, fill_moisture_pct: 15.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager, captures: { e3: $.data.error_id } }
          assert: ["HTTP 400; error_id == ERR_VALIDATION"]
      - name: lot_create_computed_field_input_ignored
        claim_type: computed_fields
        grounds: ["entities.GrainLot.fields.current_bu", "entities.GrainLot.fields.status", "calculations.provisional_shrink"]
        distinguishing_aspect: "Client-supplied current_bu/status/provisional_shrink_bu in the create payload are ignored; the server computes current_bu == 973.00 from original 1000.00 @17.0% and sets status STORED."
        test_recipe:
          setup: ["bin BIN-C corn cap 5000"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-C", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_c: $.data.id } }
          trigger:
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_c}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 1000.00, fill_moisture_pct: 17.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430, current_bu: 999, provisional_shrink_bu: 0, status: "DEPLETED" }, as: SiteManager, captures: { lot_c: $.data.id, cur_c: $.data.current_bu, st_c: $.data.status, prov_c: $.data.provisional_shrink_bu } }
          assert:
            - "HTTP 201; data.current_bu == 973.00 (computed, client value 999 ignored)"
            - "data.provisional_shrink_bu == 27.00 (computed); data.status == STORED (client DEPLETED ignored)"
      - name: reading_response_computed_fields
        claim_type: computed_fields
        grounds: ["entities.TemperatureReading.fields.max_cable_temp_f", "entities.TemperatureReading.fields.temp_delta_f", "entities.TemperatureReading.fields.hotspot_triggered"]
        distinguishing_aspect: "Reading response derives max_cable_temp_f 91.5, temp_delta_f 31.5, hotspot_triggered true (delta >= 30), score_after 50.00 on an empty bin."
        test_recipe:
          setup: ["bin BIN-RD corn cap 5000, no lots"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-RD", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_rd: $.data.id } }
          trigger:
            - { call: "POST /grain/temperature-readings", payload: { bin_id: "${bin_rd}", recorded_at: "2026-08-01T06:00:00Z", ambient_temp_f: 60.0, cable_temps_f: [80.0, 91.5, 88.0], insect_activity: false }, as: SiteManager, captures: { rd_max: $.data.max_cable_temp_f, rd_delta: $.data.temp_delta_f, rd_hot: $.data.hotspot_triggered, rd_score: $.data.score_after } }
          assert:
            - "max_cable_temp_f == 91.5; temp_delta_f == 31.5; hotspot_triggered == true (31.5 >= 30.0)"
            - "score_after == 50.00 (temp term clamps at 50; moisture/staleness zero on empty bin)"
      - name: lot_list_pagination_and_filters
        claim_type: listing
        grounds: ["response_envelope.pagination_fields", "endpoints[\"GET /grain/lots\"]"]
        distinguishing_aspect: "GET /grain/lots?limit=2 over 3 lots returns total_count 3, has_more true; offset=2 returns 1 item has_more false; bin_id+status+crop+grade filters compose."
        test_recipe:
          setup: ["bin BIN-L corn cap 9000 with three GRADE_1 lots filled 2026-08-01"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-L", capacity_bu: 9000, crop: "CORN" }, as: SiteManager, captures: { bin_l: $.data.id } }
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_l}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 100.00, fill_moisture_pct: 15.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager }
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_l}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 200.00, fill_moisture_pct: 15.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager }
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_l}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 300.00, fill_moisture_pct: 15.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager }
          trigger:
            - { call: "GET /grain/lots", payload: { bin_id: "${bin_l}", status: "STORED", crop: "CORN", grade: "GRADE_1", limit: 2, offset: 0 }, as: FarmOwner, captures: { pg1_total: $.data } }
            - { call: "GET /grain/lots", payload: { bin_id: "${bin_l}", limit: 2, offset: 2 }, as: FarmOwner }
          assert:
            - "page 1: 2 items; total_count == 3; has_more == true; limit == 2; offset == 0"
            - "page 2 (offset 2): 1 item; has_more == false; total_count == 3"
            - "filtering by status=STORED&crop=CORN&grade=GRADE_1&bin_id returns the same 3-lot total"
      - name: assessment_duplicate_period_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=26]", "errors[ERR_ASSESSMENT_EXISTS]", "entities.StorageAssessment.fields.period"]
        distinguishing_aspect: "POST /grain/assessments for an already-run period is rejected ERR_ASSESSMENT_EXISTS (idempotent epoch); a different period succeeds."
        test_recipe:
          setup: ["period 2026-08 already assessed"]
          setup_api_calls:
            - { call: "POST /grain/assessments", payload: { period: "2026-08" }, as: SiteManager, captures: { as_a: $.data.id } }
          trigger:
            - { call: "POST /grain/assessments", payload: { period: "2026-08" }, as: SiteManager, captures: { e4: $.data.error_id } }
            - { call: "POST /grain/assessments", payload: { period: "2026-09" }, as: SiteManager, captures: { as_b: $.data.id } }
          assert:
            - "second 2026-08 run: HTTP 409, error_id == ERR_ASSESSMENT_EXISTS"
            - "2026-09 run: HTTP 201 (idempotency keyed on period, not on time)"
      - name: applicator_create_and_readback
        claim_type: creation
        grounds: ["entities.Applicator.fields.license_no", "endpoints[\"POST /grain/applicators\"]"]
        distinguishing_aspect: "Applicator registration persists name/license_no/cert_expires_at; response id later serves as the CertifiedApplicator X-User-ID (entity_backed identity)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /grain/applicators", payload: { name: "Alice A", license_no: "LIC-A", cert_expires_at: "2027-06-01T00:00:00Z" }, as: SiteManager, captures: { app1: $.data.id } }
          assert: ["HTTP 201; data.name == 'Alice A'; data.license_no == 'LIC-A'; data.cert_expires_at == 2027-06-01T00:00:00Z"]
  # ============================================================ state_machines
  - section: state_machines
    instances:
      - name: initial_states_on_create
        claim_type: initial_state
        grounds: ["state_machines.GrainLot", "state_machines.StorageContract", "state_machines.BinEntryPermit", "state_machines.FumigationRecord", "state_machines.InsuranceClaim", "state_machines.InsurancePolicy"]
        distinguishing_aspect: "Every stateful entity starts in its declared initial state: lot STORED, contract OPEN, permit REQUESTED, fumigation ACTIVE, policy ACTIVE, claim SUBMITTED (with loss_bu copied from the alert)."
        test_recipe:
          setup: ["bin BIN-I corn; permit requested; fumigation active; policy + CONFIRMED_LOSS alert on second bin; claim submitted"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-I", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_i: $.data.id } }
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_i}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 100.00, fill_moisture_pct: 15.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager, captures: { lot_i_st: $.data.status, lot_i_dr: $.data.drawn_bu } }
            - { call: "POST /grain/contracts", payload: { crop: "CORN", contracted_bu: 1000.00, window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", basis_cents_per_bu: -20, futures_ref_cents_per_bu: 450 }, as: FarmOwner, captures: { con_i_st: $.data.status } }
            - { call: "POST /grain/entry-permits", payload: { bin_id: "${bin_i}", planned_start: "2026-08-02T08:00:00Z", planned_end: "2026-08-02T10:00:00Z", atmosphere_test_passed: true, loto_confirmed: true }, as: SiteManager, as_user_id: "mgr-1", captures: { per_i_st: $.data.status } }
            - { call: "POST /grain/bins", payload: { name: "BIN-I2", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_i2: $.data.id } }
            - { call: "POST /grain/applicators", payload: { name: "Alice A", license_no: "LIC-A", cert_expires_at: "2027-06-01T00:00:00Z" }, as: SiteManager, captures: { app_i: $.data.id } }
            - { call: "POST /grain/fumigations", payload: { bin_id: "${bin_i2}", applicator_id: "${app_i}", product: "SULFURYL_FLUORIDE", application_start: "2026-08-01T00:00:00Z", application_end: "2026-08-01T04:00:00Z" }, as: CertifiedApplicator, as_user_id: "${app_i}", captures: { fum_i_st: $.data.status, fum_i_id: $.data.id } }
            - { call: "POST /grain/policies", payload: { crop: "CORN", coverage_limit_cents: 1000000, deductible_cents: 5000, valuation_clause: "SPOT", period_start: "2026-07-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: FarmOwner, captures: { pol_i: $.data.id, pol_i_st: $.data.status } }
            - { call: "POST /grain/temperature-readings", payload: { bin_id: "${bin_i}", recorded_at: "2026-08-05T10:00:00Z", ambient_temp_f: 60.0, cable_temps_f: [90.0], insect_activity: false }, as: SiteManager }
            - { call: "GET /grain/spoilage-alerts", payload: { bin_id: "${bin_i}" }, as: SiteManager, captures: { al_i: "$.data[0].id" } }
            - { call: "POST /grain/spoilage-alerts/${al_i}/close", payload: { outcome: "CONFIRMED_LOSS", loss_bu: 25.00 }, as: SiteManager }
            - { call: "POST /grain/claims", payload: { policy_id: "${pol_i}", spoilage_alert_id: "${al_i}" }, as: SiteManager, captures: { cl_i_st: $.data.status, cl_i_loss: $.data.loss_bu } }
          assert:
            - "lot status STORED, drawn_bu == 0.00; contract OPEN; permit REQUESTED; fumigation ACTIVE; policy ACTIVE"
            - "claim status SUBMITTED and loss_bu == 25.00 (copied from alert, not client-supplied)"
          note: "permit on BIN-I predates any fumigation on BIN-I (fumigation is on BIN-I2), so the permit stays REQUESTED"
      - name: alert_close_from_terminal_rejected
        claim_type: terminal_lockdown
        grounds: ["state_machines.SpoilageAlert", "errors[ERR_ALERT_NOT_OPEN]"]
        distinguishing_aspect: "Closing a RESOLVED alert a second time fails ERR_ALERT_NOT_OPEN and leaves status RESOLVED."
        test_recipe:
          setup: ["bin BIN-AT with a hotspot alert already RESOLVED"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-AT", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_at: $.data.id } }
            - { call: "POST /grain/temperature-readings", payload: { bin_id: "${bin_at}", recorded_at: "2026-08-05T10:00:00Z", ambient_temp_f: 60.0, cable_temps_f: [90.0], insect_activity: false }, as: SiteManager }
            - { call: "GET /grain/spoilage-alerts", payload: { bin_id: "${bin_at}" }, as: SiteManager, captures: { al_at: "$.data[0].id" } }
            - { call: "POST /grain/spoilage-alerts/${al_at}/close", payload: { outcome: "RESOLVED" }, as: SiteManager }
          trigger:
            - { call: "POST /grain/spoilage-alerts/${al_at}/close", payload: { outcome: "CONFIRMED_LOSS", loss_bu: 10.00 }, as: SiteManager, captures: { e5: $.data.error_id } }
            - { call: "GET /grain/spoilage-alerts/${al_at}", payload: {}, as: SiteManager, captures: { al_at_st: $.data.status } }
          assert: ["HTTP 409; error_id == ERR_ALERT_NOT_OPEN; alert status stays RESOLVED"]
      - name: dispatch_from_delivered_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.LoadOut", "errors[ERR_LOADOUT_STATE]"]
        distinguishing_aspect: "Dispatching an already-DELIVERED loadout fails ERR_LOADOUT_STATE; transport stays DELIVERED (no idempotent re-dispatch)."
        test_recipe:
          setup: ["corn bin with lot 500.00 @15.0%; contract 2000; loadout planned 100 dispatched and delivered"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-DD", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_dd: $.data.id } }
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_dd}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 500.00, fill_moisture_pct: 15.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager }
            - { call: "POST /grain/contracts", payload: { crop: "CORN", contracted_bu: 2000.00, window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", basis_cents_per_bu: -20, futures_ref_cents_per_bu: 450 }, as: FarmOwner, captures: { con_dd: $.data.id, con_dd_v: $.data.version } }
            - { call: "POST /grain/loadouts", payload: { contract_id: "${con_dd}", bin_id: "${bin_dd}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", planned_bu: 100.00, expected_contract_version: "${con_dd_v}" }, as: SiteManager, captures: { lo_dd: $.data.id } }
            - { call: "POST /grain/loadouts/${lo_dd}/dispatch", payload: {}, as: SiteManager }
            - { call: "POST /grain/loadouts/${lo_dd}/deliver", payload: { delivered_at: "2026-08-10T10:00:00Z", scale_tickets: [ { ticket_no: "T1", gross_bu: 100.00, moisture_pct: 15.0 } ] }, as: SiteManager }
          trigger:
            - { call: "POST /grain/loadouts/${lo_dd}/dispatch", payload: {}, as: SiteManager, captures: { e6: $.data.error_id } }
          assert: ["HTTP 409; error_id == ERR_LOADOUT_STATE; transport_status remains DELIVERED"]
      - name: confirm_before_deliver_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.LoadOut", "errors[ERR_LOADOUT_STATE]"]
        distinguishing_aspect: "Confirm-settlement while transport is DISPATCHED (not yet DELIVERED) fails ERR_LOADOUT_STATE — settlement dimension cannot run ahead of transport."
        test_recipe:
          setup: ["corn bin with lot 500.00 @15.0%; contract 2000; loadout planned 100 dispatched (not delivered)"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-CF", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_cf: $.data.id } }
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_cf}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 500.00, fill_moisture_pct: 15.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager }
            - { call: "POST /grain/contracts", payload: { crop: "CORN", contracted_bu: 2000.00, window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", basis_cents_per_bu: -20, futures_ref_cents_per_bu: 450 }, as: FarmOwner, captures: { con_cf: $.data.id, con_cf_v: $.data.version } }
            - { call: "POST /grain/loadouts", payload: { contract_id: "${con_cf}", bin_id: "${bin_cf}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", planned_bu: 100.00, expected_contract_version: "${con_cf_v}" }, as: SiteManager, captures: { lo_cf: $.data.id } }
            - { call: "POST /grain/loadouts/${lo_cf}/dispatch", payload: {}, as: SiteManager }
          trigger:
            - { call: "POST /grain/loadouts/${lo_cf}/confirm-settlement", payload: {}, as: SiteManager, captures: { e7: $.data.error_id } }
          assert: ["HTTP 409; error_id == ERR_LOADOUT_STATE; settlement_status remains UNSETTLED"]
      - name: void_settlement_when_unsettled_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.LoadOut", "errors[ERR_SETTLEMENT_STATE]"]
        distinguishing_aspect: "Void-settlement on a DELIVERED but UNSETTLED loadout fails ERR_SETTLEMENT_STATE — nothing to compensate."
        test_recipe:
          setup: ["corn bin with lot 500.00 @15.0%; contract 2000; loadout planned 100 delivered (UNSETTLED)"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-VS", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_vs: $.data.id } }
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_vs}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 500.00, fill_moisture_pct: 15.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager }
            - { call: "POST /grain/contracts", payload: { crop: "CORN", contracted_bu: 2000.00, window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", basis_cents_per_bu: -20, futures_ref_cents_per_bu: 450 }, as: FarmOwner, captures: { con_vs: $.data.id, con_vs_v: $.data.version } }
            - { call: "POST /grain/loadouts", payload: { contract_id: "${con_vs}", bin_id: "${bin_vs}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", planned_bu: 100.00, expected_contract_version: "${con_vs_v}" }, as: SiteManager, captures: { lo_vs: $.data.id } }
            - { call: "POST /grain/loadouts/${lo_vs}/dispatch", payload: {}, as: SiteManager }
            - { call: "POST /grain/loadouts/${lo_vs}/deliver", payload: { delivered_at: "2026-08-10T10:00:00Z", scale_tickets: [ { ticket_no: "T1", gross_bu: 100.00, moisture_pct: 15.0 } ] }, as: SiteManager }
          trigger:
            - { call: "POST /grain/loadouts/${lo_vs}/void-settlement", payload: {}, as: SiteManager, captures: { e8: $.data.error_id } }
          assert: ["HTTP 409; error_id == ERR_SETTLEMENT_STATE"]
      - name: claim_approve_twice_rejected
        claim_type: idempotency
        grounds: ["state_machines.InsuranceClaim", "errors[ERR_CLAIM_NOT_SUBMITTED]"]
        distinguishing_aspect: "Approving an already-APPROVED claim fails ERR_CLAIM_NOT_SUBMITTED; indemnity and policy coverage are not debited twice."
        test_recipe:
          setup: ["bin BIN-CT with CONFIRMED_LOSS alert loss 100.00; SPOT policy limit 1000000 deductible 5000; claim submitted and approved once (indemnity 37000 at spot 420)"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-CT", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_ct: $.data.id } }
            - { call: "POST /grain/temperature-readings", payload: { bin_id: "${bin_ct}", recorded_at: "2026-08-05T10:00:00Z", ambient_temp_f: 60.0, cable_temps_f: [90.0], insect_activity: false }, as: SiteManager }
            - { call: "GET /grain/spoilage-alerts", payload: { bin_id: "${bin_ct}" }, as: SiteManager, captures: { al_ct: "$.data[0].id" } }
            - { call: "POST /grain/spoilage-alerts/${al_ct}/close", payload: { outcome: "CONFIRMED_LOSS", loss_bu: 100.00 }, as: SiteManager }
            - { call: "POST /grain/policies", payload: { crop: "CORN", coverage_limit_cents: 1000000, deductible_cents: 5000, valuation_clause: "SPOT", period_start: "2026-07-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: FarmOwner, captures: { pol_ct: $.data.id } }
            - { call: "POST /grain/claims", payload: { policy_id: "${pol_ct}", spoilage_alert_id: "${al_ct}" }, as: SiteManager, captures: { cl_ct: $.data.id } }
            - { call: "POST /grain/claims/${cl_ct}/approve", payload: { spot_price_cents_per_bu: 420 }, as: FarmOwner }
          trigger:
            - { call: "POST /grain/claims/${cl_ct}/approve", payload: { spot_price_cents_per_bu: 420 }, as: FarmOwner, captures: { e9: $.data.error_id } }
            - { call: "GET /grain/claims/${cl_ct}", payload: {}, as: FarmOwner, captures: { cl_ct_ind: $.data.indemnity_cents } }
          assert: ["second approve: HTTP 409, error_id == ERR_CLAIM_NOT_SUBMITTED", "indemnity_cents still == 37000 (no double debit)"]
      - name: permit_approve_twice_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.BinEntryPermit", "errors[ERR_PERMIT_NOT_REQUESTED]"]
        distinguishing_aspect: "Approving an already-APPROVED permit fails ERR_PERMIT_NOT_REQUESTED."
        test_recipe:
          setup: ["bin BIN-PT; permit requested by mgr-1 and approved by so-1"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-PT", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_pt: $.data.id } }
            - { call: "POST /grain/entry-permits", payload: { bin_id: "${bin_pt}", planned_start: "2026-08-02T08:00:00Z", planned_end: "2026-08-02T10:00:00Z", atmosphere_test_passed: true, loto_confirmed: true }, as: SiteManager, as_user_id: "mgr-1", captures: { per_pt: $.data.id } }
            - { call: "POST /grain/entry-permits/${per_pt}/approve", payload: {}, as: SafetyOfficer, as_user_id: "so-1" }
          trigger:
            - { call: "POST /grain/entry-permits/${per_pt}/approve", payload: {}, as: SafetyOfficer, as_user_id: "so-2", captures: { e10: $.data.error_id } }
