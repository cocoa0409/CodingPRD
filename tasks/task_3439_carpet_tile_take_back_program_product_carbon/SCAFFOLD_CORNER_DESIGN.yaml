              as_user_id: "inst-bob"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_AREA_EXCEEDS_BATCH (422)"
            - "TileBatch.${b1}.available_m2 == 100 still; no zone persisted"

      - name: planned_site_blocks_zone_and_takeback_and_quarantine_batch_blocked
        claim_type: Violation -> Error
        grounds:
          - validations[priority=6]
          - errors[ERR_SITE_NOT_INSTALLED]
          - errors[ERR_BATCH_NOT_RELEASED]
        distinguishing_aspect: "Two state guards in one fixture: on a PLANNED site both zone creation and take-back creation fail ERR_SITE_NOT_INSTALLED; on an INSTALLED site a zone from a QUARANTINE batch fails ERR_BATCH_NOT_RELEASED."
        test_recipe:
          setup: ["Collection GAT; batch DL-100 QUARANTINE (never released). Site S-1 left PLANNED; site S-2 INSTALLED (different contractor inst-cory, non-overlapping window)."]
          setup_api_calls:
            - *c_clock
            - *c_col_gate_none
            - *c_batch_b1
            - *c_site1
            - &c_site2
              call: "POST /carpetloop/sites"
              payload: { contractor_name: "inst-cory", address: "9 Meadow Ln", install_window_start: "2026-09-02T00:00:00Z", install_window_end: "2026-09-03T00:00:00Z", installation_system: "ADHESIVE_FREE", adhesive_free_certified: true, cert_expires_on: "2027-01-01T00:00:00Z", annual_replacement_budget_cents: 1000000 }
              as: Specifier
              as_user_id: "spec-ada"
              captures: { site2: $.data.id }
            - call: "POST /carpetloop/sites/${site2}/install"
              payload: {}
              as: Installer
              as_user_id: "inst-cory"
          trigger:
            - call: "POST /carpetloop/sites/${site1}/zones"
              payload: { batch_id: "${b1}", zone_code: "Z-1", area_m2: 10 }
              as: Installer
              as_user_id: "inst-bob"
              captures: { err1: $.data.error_id }
            - call: "POST /carpetloop/take-back-requests"
              payload: { site_id: "${site1}", collection_id: "${col_id}", condition_grade: "B", declared_area_m2: 10 }
              as: Specifier
              as_user_id: "spec-ada"
              captures: { err2: $.data.error_id }
            - call: "POST /carpetloop/sites/${site2}/zones"
              payload: { batch_id: "${b1}", zone_code: "Z-1", area_m2: 10 }
              as: Installer
              as_user_id: "inst-cory"
              captures: { err3: $.data.error_id }
          assert:
            - "err1 == ERR_SITE_NOT_INSTALLED (zone on PLANNED site)"
            - "err2 == ERR_SITE_NOT_INSTALLED (take-back on PLANNED site)"
            - "err3 == ERR_BATCH_NOT_RELEASED (QUARANTINE batch on an otherwise-valid INSTALLED site)"

      - name: order_with_zone_of_other_site_returns_422
        claim_type: Violation -> Error
        grounds:
          - validations[priority=9]
          - errors[ERR_ZONE_SITE_MISMATCH]
        distinguishing_aspect: "Cross-reference integrity: an order naming site S-2 but a zone belonging to S-1 fails ERR_ZONE_SITE_MISMATCH — existence of both ids is not enough."
        test_recipe:
          setup: ["Collection GAT; batch DL-100 RELEASED; S-1 INSTALLED with zone Z-1 (10 m2); S-2 INSTALLED (inst-cory)."]
          setup_api_calls:
            - *c_clock
            - *c_col_gate_none
            - *c_lot_net200
            - *c_lot_vir200
            - *c_qc_lot1
            - *c_qc_lot2
            - *c_batch_b1
            - *c_alloc1
            - *c_alloc2
            - *c_rel_b1
            - *c_site1
            - *c_install1
            - call: "POST /carpetloop/sites/${site1}/zones"
              payload: { batch_id: "${b1}", zone_code: "Z-1", area_m2: 10 }
              as: Installer
              as_user_id: "inst-bob"
              captures: { z1: $.data.id }
            - *c_site2
            - call: "POST /carpetloop/sites/${site2}/install"
              payload: {}
              as: Installer
              as_user_id: "inst-cory"
            - call: "GET /carpetloop/sites/${site2}"
              payload: {}
              as: PlatformAdmin
              captures: { s2v: $.data.version }
          trigger:
            - call: "POST /carpetloop/replacement-orders"
              payload: { site_id: "${site2}", zone_id: "${z1}", reason: "WEAR", new_zone_code: "Z-9", expected_site_version: "${s2v}" }
              as: Specifier
              as_user_id: "spec-ada"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ZONE_SITE_MISMATCH (422)"
            - "no order persisted: GET /carpetloop/replacement-orders?site_id=${site2} returns an empty list"

      - name: decommission_blocked_by_inflight_takeback_then_succeeds
        claim_type: Violation -> Error
        grounds:
          - validations[priority=6]
          - errors[ERR_TAKEBACK_IN_FLIGHT]
          - state_machines.CustomerSite.IN_SERVICE_to_DECOMMISSIONED
        distinguishing_aspect: "Decommission is gated on logistics quiescence: with a SCHEDULED take-back it fails ERR_TAKEBACK_IN_FLIGHT; after the take-back is cancelled the identical call succeeds."
        test_recipe:
          setup: ["Collection GAT; site INSTALLED; take-back REQUESTED then SCHEDULED into a future window."]
          setup_api_calls:
            - *c_clock
            - *c_col_gate_none
            - *c_site1
            - *c_install1
            - *c_tb1
            - *c_sched1
          trigger:
            - call: "POST /carpetloop/sites/${site1}/decommission"
              payload: {}
              as: Installer
              as_user_id: "inst-bob"
              captures: { err: $.data.error_id }
            - call: "POST /carpetloop/take-back-requests/${tb1}/cancel"
              payload: {}
              as: Specifier
              as_user_id: "spec-ada"
            - call: "POST /carpetloop/sites/${site1}/decommission"
              payload: {}
              as: Installer
              as_user_id: "inst-bob"
          assert:
            - "first decommission: err == ERR_TAKEBACK_IN_FLIGHT (409); site stays INSTALLED"
            - "after cancelling the take-back: decommission succeeds, status == DECOMMISSIONED"

      - name: error_sort_mass_imbalance
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SORT_MASS_IMBALANCE]
        excluded_because:
          difficulty_instance: boundary_precision_check / sort_mass_sum_exact_equality
          rationale: "Asserted there as the failing half of the exact-equality boundary (159.99 vs 160.00)."
      - name: error_replacement_budget_exceeded
        claim_type: violation_to_error
        grounds:
          - errors[ERR_REPLACEMENT_BUDGET_EXCEEDED]
        excluded_because:
          difficulty_instance: boundary_precision_check / replacement_budget_exact_fit
          rationale: "Asserted as the over-budget half of the exact-fit boundary instance."
      - name: error_contractor_window_conflict
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CONTRACTOR_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / contractor_install_window_buffer_semantics
          rationale: "The 1-day-gap rejection is asserted there."
      - name: error_report_period_overlap
        claim_type: violation_to_error
        grounds:
          - errors[ERR_REPORT_PERIOD_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / report_period_half_open_overlap_semantics
          rationale: "The SUBMITTED-overlap rejection is asserted there."
      - name: error_offset_coverage_insufficient
        claim_type: violation_to_error
        grounds:
          - errors[ERR_OFFSET_COVERAGE_INSUFFICIENT]
        excluded_because:
          difficulty_instance: combinatorial_formula / claim_offset_requirement_evaluation_order
          rationale: "The PARTIAL-coverage publish rejection is asserted there."
      - name: error_target_breached
        claim_type: violation_to_error
        grounds:
          - errors[ERR_TARGET_BREACHED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / negative_claim_blocked_when_target_breached
          rationale: "Asserted as that instance's primary error."
      - name: error_adhesive_free_cert_required
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ADHESIVE_FREE_CERT_REQUIRED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / install_uncertified_and_expired_returns_referential_error
          rationale: "Asserted as the referential side of the priority pair."
      - name: error_stale_version_and_order_cancel_release
        claim_type: compensation_side_effect
        grounds:
          - state_machines.ReplacementOrder.MATCHED_to_CANCELLED
        excluded_because:
          difficulty_instance: compensating_invariant / batch_area_conserved_across_order_lifecycle
          rationale: "Reservation release on cancel is asserted as av3 == 70 there; OCC stale-version behavior has dedicated cross_cutting_layers corners below."

