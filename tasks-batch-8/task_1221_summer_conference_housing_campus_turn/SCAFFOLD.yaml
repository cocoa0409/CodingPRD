scenario: |
  1221. Summer Conference Housing & Campus Turn (campus conference services): room inventory release after academic year, conference client contract & group rooming list, cleaning/turn schedule between groups, linen & key/access management, minor-participant policy & background screening, billing per bed-night & damage assessment, fall-opening deadline & maintenance window conflict, revenue allocation to housing budget

domain_name: summer-conference-housing-campus-turn
api_prefix: ""

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: hierarchical
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate
  difficulty_target: expert_plus

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Building
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Building display name
      - name: fall_opening_date
        type: datetime
        source: input
        description: Date (YYYY-MM-DD) the building must be handed back for fall academic opening; maintenance windows must clear it
      - name: key_pool_size
        type: integer
        source: input
        description: Total physical key credentials held for this building
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Season lifecycle state
        constraints: "ACADEMIC_USE | RELEASE_REVIEW | RELEASED | TURN_ACTIVE | FALL_PREP | READY_FOR_FALL"
      - name: released_bed_count
        type: integer
        source: system
        description: Sum of bed_count over all rooms, frozen at confirm_release
        default: 0
      - name: reserved_bed_count
        type: integer
        source: system
        description: Count of StayAssignments in status RESERVED or CHECKED_IN across this building's rooms
        default: 0
      - name: available_bed_count
        type: integer
        source: system
        description: released_bed_count - reserved_bed_count; recomputed on every assignment create/cancel/no-show/checkout
        default: 0
      - name: scheduled_turn_count
        type: integer
        source: system
        description: Count of TurnTasks in status SCHEDULED, IN_PROGRESS, READY_FOR_INSPECTION, or FAILED for rooms of this building
        default: 0
      - name: out_of_service_room_count
        type: integer
        source: system
        description: Count of rooms currently OUT_OF_SERVICE under a maintenance window
        default: 0
      - name: available_key_count
        type: integer
        source: system
        description: key_pool_size minus keys currently outstanding (ISSUED/ACTIVATED) minus keys LOST; set to key_pool_size at confirm_release
        default: 0

  - name: Room
    parent: Building
    common_fields: true
    fields:
      - name: building_id
        type: string
        source: input
        description: FK -> Building.id
      - name: room_number
        type: string
        source: input
        description: Room label within the building; unique per building
      - name: bed_count
        type: integer
        source: input
        description: Number of conference beds in the room
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: Occupancy/turn lifecycle
        constraints: "ACADEMIC_OCCUPIED | RELEASED | RESERVED | OCCUPIED | NEEDS_TURN | IN_TURN | READY | OUT_OF_SERVICE"
      - name: active_turn_task_id
        type: string
        source: system
        description: Id of the non-terminal TurnTask for this room, if any; null otherwise
        default: null
      - name: out_of_service_window_id
        type: string
        source: system
        description: Id of the MaintenanceWindow that took this room OUT_OF_SERVICE; null otherwise
        default: null

  - name: ConferenceGroup
    parent: Building
    common_fields: true
    fields:
      - name: building_id
        type: string
        source: input
        description: FK -> Building.id; host building for the group contract
      - name: client_name
        type: string
        source: input
        description: Client organization name
      - name: contact_email
        type: string
        source: input
        description: Client coordinator contact email
      - name: arrival_date
        type: datetime
        source: input
        description: Contract arrival date (YYYY-MM-DD)
      - name: departure_date
        type: datetime
        source: input
        description: Contract departure date (YYYY-MM-DD); basis for key late-return grace
      - name: has_minor_participants
        type: boolean
        source: input
        description: True if any participant is under 18 at arrival_date; gates screening and chaperone policy
        default: false
      - name: linen_tier
        type: enum
        source: input
        description: Linen service tier; DELUXE lengthens the required turn window after this group
        constraints: "STANDARD | DELUXE"
        default: STANDARD
      - name: contracted_bed_count
        type: integer
        source: input
        description: Beds under contract; must equal the ACTIVE rooming-list revision's assignment count at confirm time
        constraints: ">= 1"
      - name: deposit_paid_cents
        type: integer
        source: input
        description: Deposit received; applied as credit at invoice finalization
        default: 0
      - name: status
        type: enum
        source: system
        description: Contract lifecycle
        constraints: "DRAFT | SUBMITTED | RETURNED | CONFIRMED | IN_HOUSE | DEPARTED | CLOSED | CANCELLED"
      - name: provisional_invoice_id
        type: string
        source: system
        description: Id of the Invoice created at confirm; null before confirm
        default: null
      - name: cancellation_fee_cents
        type: integer
        source: system
        description: Fee assessed when cancelling from CONFIRMED; null unless cancelled
        default: null

  - name: Participant
    parent: ConferenceGroup
    common_fields: true
    fields:
      - name: group_id
        type: string
        source: input
        description: FK -> ConferenceGroup.id
      - name: full_name
        type: string
        source: input
        description: Participant full name
      - name: date_of_birth
        type: datetime
        source: input
        description: Birth date (YYYY-MM-DD); basis of is_minor
      - name: role_in_group
        type: enum
        source: input
        description: Function within the group
        constraints: "ATTENDEE | CHAPERONE | STAFF"
      - name: is_minor
        type: boolean
        source: computed
        description: True when age at the parent group's arrival_date is strictly under 18

  - name: RoomingListRevision
    parent: ConferenceGroup
    common_fields: false
    fields:
      - name: group_id
        type: string
        source: input
        description: FK -> ConferenceGroup.id
      - name: revision_number
        type: integer
        source: system
        description: Per-group monotonically increasing revision counter starting at 1
      - name: status
        type: enum
        source: system
        description: ACTIVE = current operative list; SUPERSEDED = replaced by a newer revision
        constraints: "ACTIVE | SUPERSEDED"
      - name: assignment_ids
        type: array
        source: computed
        description: Ids of StayAssignments created by this revision, in creation order
      - name: superseded_at
        type: datetime
        source: system
        description: When this revision was superseded; null while ACTIVE
        default: null

  - name: StayAssignment
    parent: ConferenceGroup
    common_fields: true
    fields:
      - name: revision_id
        type: string
        source: system
        description: FK -> RoomingListRevision.id; revision that created this assignment
      - name: group_id
        type: string
        source: system
        description: FK -> ConferenceGroup.id
      - name: room_id
        type: string
        source: input
        description: FK -> Room.id
      - name: participant_id
        type: string
        source: input
        description: FK -> Participant.id
      - name: checkin_at
        type: datetime
        source: input
        description: Planned check-in instant (ISO 8601)
      - name: checkout_at
        type: datetime
        source: input
        description: Planned check-out instant (ISO 8601); occupancy is the half-open interval [checkin_at, checkout_at)
      - name: actual_checkin_at
        type: datetime
        source: system
        description: Actual check-in instant from the logical clock; null until checked in
        default: null
      - name: actual_checkout_at
        type: datetime
        source: system
        description: Actual check-out instant from the logical clock; null until checked out
        default: null
      - name: status
        type: enum
        source: system
        description: Stay lifecycle
        constraints: "RESERVED | CHECKED_IN | CHECKED_OUT | NO_SHOW | CANCELLED"

  - name: BackgroundScreening
    parent: Participant
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: FK -> Participant.id
      - name: consent_reference
        type: string
        source: input
        description: Signed consent form reference supplied at submission
      - name: status
        type: enum
        source: system
        description: Screening lifecycle
        constraints: "SUBMITTED | IN_REVIEW | CLEARED | FLAGGED | APPEALED | DENIED"
      - name: decided_at
        type: datetime
        source: system
        description: Instant of the latest decide/resolve-appeal decision; null until decided
        default: null
      - name: cleared_on
        type: datetime
        source: system
        description: Calendar date (YYYY-MM-DD, from the logical clock) of the latest CLEARED decision; null unless cleared
        default: null
      - name: is_expired
        type: boolean
        source: computed
        description: True when status is CLEARED and the logical clock date is strictly after cleared_on + SCREENING_VALIDITY_MONTHS months
      - name: appeal_reason
        type: string
        source: input
        description: Reason supplied when appealing a FLAGGED decision
        default: null

  - name: TurnTask
    parent: Room
    common_fields: true
    fields:
      - name: room_id
        type: string
        source: system
        description: FK -> Room.id
      - name: window_start
        type: datetime
        source: system
        description: Start of the cleaning window; equals the triggering check-out instant
      - name: window_end
        type: datetime
        source: system
        description: End of the cleaning window; earliest future RESERVED check-in on the room, else window_start + 7 days
      - name: linen_tier
        type: enum
        source: system
        description: Linen service tier governing this turn (incoming group's tier when a next reservation exists, else departing group's)
        constraints: "STANDARD | DELUXE"
      - name: status
        type: enum
        source: system
        description: Turn lifecycle with rework loop
        constraints: "SCHEDULED | IN_PROGRESS | READY_FOR_INSPECTION | PASSED | FAILED | CANCELLED"
      - name: rework_count
        type: integer
        source: system
        description: Number of FAILED inspections; >= 2 escalates inspection rights to ConferenceServicesAdmin only
        default: 0
      - name: inspector_note
        type: string
        source: input
        description: Free-text note recorded at inspection
        default: null

  - name: LinenIssue
    parent: ConferenceGroup
    common_fields: true
    fields:
      - name: group_id
        type: string
        source: input
        description: FK -> ConferenceGroup.id
      - name: packs_issued
        type: integer
        source: input
        description: Linen packs issued to the group
        constraints: ">= 1"
      - name: packs_returned
        type: integer
        source: system
        description: Packs returned in serviceable condition
        default: 0
      - name: packs_damaged
        type: integer
        source: system
        description: Packs returned damaged (charged at half pack cost)
        default: 0
      - name: status
        type: enum
        source: system
        description: Reconciliation lifecycle
        constraints: "ISSUED | PARTIALLY_RETURNED | RECONCILED"
      - name: loss_charge_cents
        type: integer
        source: computed
        description: (packs_issued - packs_returned - packs_damaged) * LINEN_PACK_COST_CENTS + packs_damaged * LINEN_DAMAGED_PACK_CENTS

  - name: KeyCredential
    parent: ConferenceGroup
    common_fields: true
    fields:
      - name: group_id
        type: string
        source: input
        description: FK -> ConferenceGroup.id
      - name: participant_id
        type: string
        source: input
        description: FK -> Participant.id; holder of the credential
      - name: credential_code
        type: string
        source: input
        description: Physical credential label; unique per building
      - name: status
        type: enum
        source: system
        description: Credential lifecycle
        constraints: "ISSUED | ACTIVATED | RETURNED | LOST"
      - name: returned_at
        type: datetime
        source: system
        description: Return instant from the logical clock; null until returned
        default: null
      - name: late_fee_cents
        type: integer
        source: computed
        description: Late-return fee computed at return per key_late_fee; null until returned
        default: null
      - name: lost_fee_cents
        type: integer
        source: system
        description: KEY_LOST_FEE_CENTS charged when reported lost; null otherwise
        default: null

  - name: DamageAssessment
    parent: Room
    common_fields: true
    fields:
      - name: room_id
        type: string
        source: input
        description: FK -> Room.id
      - name: group_id
        type: string
        source: input
        description: FK -> ConferenceGroup.id; group held responsible
      - name: line_items
        type: array
        source: input
        description: "[{description, quantity, unit_replacement_cost_cents, fixture_age_months}]"
      - name: estimate_total_cents
        type: integer
        source: computed
        description: "Estimate variant: straight sum of quantity * unit_replacement_cost_cents, no depreciation, no fee"
      - name: assessed_total_cents
        type: integer
        source: computed
        description: Assessed variant per damage_charge rule; null until ASSESSED
        default: null
      - name: assessed_at
        type: datetime
        source: system
        description: Instant of assessment; basis of the 7-day dispute window
        default: null
      - name: dispute_reason
        type: string
        source: input
        description: Client's reason when disputing
        default: null
      - name: status
        type: enum
        source: system
        description: Damage lifecycle with dispute branch
        constraints: "REPORTED | ASSESSED | BILLED | DISPUTED | WAIVED"

  - name: Invoice
    parent: ConferenceGroup
    common_fields: true
    fields:
      - name: group_id
        type: string
        source: system
        description: FK -> ConferenceGroup.id
      - name: status
        type: enum
        source: system
        description: Billing lifecycle
        constraints: "PROVISIONAL | FINALIZED | PAID | VOID"
      - name: provisional_bed_night_subtotal_cents
        type: integer
        source: computed
        description: Provisional variant of bed_night_billing over the ACTIVE revision at confirm time
      - name: provisional_total_cents
        type: integer
        source: computed
        description: Provisional invoice total (bed-night subtotal only at confirm; refreshed on revision supersede)
      - name: final_bed_night_subtotal_cents
        type: integer
        source: computed
        description: Final variant of bed_night_billing at finalize; null until FINALIZED
        default: null
      - name: linen_charge_cents
        type: integer
        source: computed
        description: Sum of loss_charge_cents over the group's LinenIssues at finalize; null until FINALIZED
        default: null
      - name: key_charge_cents
        type: integer
        source: computed
        description: Sum of late_fee_cents + lost_fee_cents over the group's KeyCredentials at finalize; null until FINALIZED
        default: null
      - name: damage_charge_cents
        type: integer
        source: computed
        description: Sum of assessed_total_cents over the group's BILLED DamageAssessments at finalize; null until FINALIZED
        default: null
      - name: total_cents
        type: integer
        source: computed
        description: Final grand total; null until FINALIZED
        default: null
      - name: balance_due_cents
        type: integer
        source: computed
        description: total_cents - deposit_paid_cents; null until FINALIZED
        default: null
      - name: finalized_at
        type: datetime
        source: system
        description: Finalize instant; null until FINALIZED
        default: null
      - name: paid_at
        type: datetime
        source: system
        description: Payment instant from the logical clock; null until PAID
        default: null

  - name: MaintenanceWindow
    parent: Building
    common_fields: true
    fields:
      - name: building_id
        type: string
        source: input
        description: FK -> Building.id
      - name: start_date
        type: datetime
        source: input
        description: First calendar day of work (YYYY-MM-DD, inclusive)
      - name: end_date
        type: datetime
        source: input
        description: Last calendar day of work (YYYY-MM-DD, inclusive)
      - name: buffer_days
        type: integer
        source: input
        description: Buffer days blocked on both sides of the window
        default: 1
        constraints: ">= 0"
      - name: blocked_start_date
        type: datetime
        source: computed
        description: start_date - buffer_days (inclusive blocked interval start)
      - name: blocked_end_date
        type: datetime
        source: computed
        description: end_date + buffer_days (inclusive blocked interval end)
      - name: status
        type: enum
        source: system
        description: Window lifecycle
        constraints: "PLANNED | CONFIRMED | IN_PROGRESS | COMPLETED | CANCELLED"

  - name: AllocationRun
    parent: Building
    common_fields: true
    fields:
      - name: building_id
        type: string
        source: input
        description: FK -> Building.id
      - name: period_start
        type: datetime
        source: input
        description: Fiscal period start date (YYYY-MM-DD, inclusive)
      - name: period_end
        type: datetime
        source: input
        description: Fiscal period end date (YYYY-MM-DD, exclusive)
      - name: gross_cents
        type: integer
        source: computed
        description: Sum of total_cents over PAID invoices of groups hosted by this building with paid_at in [period_start, period_end)
      - name: overhead_cents
        type: integer
        source: computed
        description: OVERHEAD_PCT of gross_cents (evaluated first)
      - name: reserve_cents
        type: integer
        source: computed
        description: RESERVE_PCT of (gross_cents - overhead_cents) (evaluated second)
      - name: ops_cents
        type: integer
        source: computed
        description: gross_cents - overhead_cents - reserve_cents (remainder bucket absorbs rounding drift)
      - name: status
        type: enum
        source: system
        description: Allocation lifecycle
        constraints: "OPEN | LOCKED"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Building
    initial_state: ACADEMIC_USE
    terminal_states: []
    transitions:
      - from: ACADEMIC_USE
        to: RELEASE_REVIEW
        trigger: "POST /buildings/{id}/initiate-release"
        actor: FacilitiesManager
        preconditions: ["building.status == ACADEMIC_USE"]
        side_effects: ["Building.version += 1"]
      - from: RELEASE_REVIEW
        to: RELEASED
        trigger: "POST /buildings/{id}/confirm-release"
        actor: FacilitiesManager
        preconditions:
          - "building.status == RELEASE_REVIEW"
          - "building has at least 1 Room"
        side_effects:
          - "Every Room with status ACADEMIC_OCCUPIED transitions to RELEASED (cascade down)"
          - "Building.released_bed_count := sum(bed_count) over all rooms; Building.available_bed_count := released_bed_count - reserved_bed_count; Building.available_key_count := key_pool_size"
          - "Building.version += 1"
      - from: RELEASE_REVIEW
        to: ACADEMIC_USE
        trigger: "POST /buildings/{id}/abort-release"
        actor: FacilitiesManager
        preconditions: ["building.status == RELEASE_REVIEW"]
        side_effects: ["Building.version += 1"]
      - from: RELEASED
        to: TURN_ACTIVE
        trigger: "POST /buildings/{id}/begin-turn-season"
        actor: FacilitiesManager
        preconditions: ["building.status == RELEASED"]
        side_effects: ["Building.version += 1"]
      - from: TURN_ACTIVE
        to: FALL_PREP
        trigger: "POST /buildings/{id}/begin-fall-prep"
        actor: FacilitiesManager
        preconditions:
          - "building.status == TURN_ACTIVE"
          - "no StayAssignment in status RESERVED or CHECKED_IN exists in any room of the building"
          - "no TurnTask in status SCHEDULED, IN_PROGRESS, READY_FOR_INSPECTION, or FAILED exists in any room of the building"
        side_effects: ["Building.version += 1"]
      - from: FALL_PREP
        to: READY_FOR_FALL
        trigger: "POST /buildings/{id}/certify-fall-ready"
        actor: FacilitiesManager
        preconditions:
          - "building.status == FALL_PREP"
          - "building.out_of_service_room_count == 0"
          - "no MaintenanceWindow in status CONFIRMED or IN_PROGRESS exists for the building"
        side_effects: ["Building.version += 1"]
      - from: READY_FOR_FALL
        to: ACADEMIC_USE
        trigger: "POST /buildings/{id}/reopen-academic"
        actor: FacilitiesManager
        preconditions: ["building.status == READY_FOR_FALL"]
        side_effects:
          - "Every Room with status READY or RELEASED transitions to ACADEMIC_OCCUPIED (season cycle closes)"
          - "Building.released_bed_count := 0; reserved_bed_count := 0; available_bed_count := 0"
          - "Building.version += 1"

  - entity: Room
    initial_state: ACADEMIC_OCCUPIED
    terminal_states: []
    transitions:
      - from: ACADEMIC_OCCUPIED
        to: RELEASED
        trigger: "system cascade from POST /buildings/{id}/confirm-release"
        actor: system
        preconditions: ["parent building confirm-release executes"]
        side_effects: ["Room.version += 1"]
      - from: RELEASED
        to: RESERVED
        trigger: "system cascade from POST /conference-groups/{id}/rooming-list-revisions (first active assignment lands on room)"
        actor: system
        preconditions: ["a StayAssignment on this room enters RESERVED and no other active assignment existed"]
        side_effects: ["Room.version += 1"]
      - from: READY
        to: RESERVED
        trigger: "system cascade from POST /conference-groups/{id}/rooming-list-revisions"
        actor: system
        preconditions: ["a StayAssignment on this room enters RESERVED and no other active assignment existed"]
        side_effects: ["Room.version += 1"]
      - from: RESERVED
        to: OCCUPIED
        trigger: "system cascade from POST /stay-assignments/{id}/check-in (first occupant)"
        actor: system
        preconditions: ["an assignment on this room enters CHECKED_IN"]
        side_effects: ["Room.version += 1"]
      - from: OCCUPIED
        to: NEEDS_TURN
        trigger: "system cascade from POST /stay-assignments/{id}/check-out (last occupant leaves)"
        actor: system
        preconditions: ["no StayAssignment in status CHECKED_IN remains on the room after this checkout"]
        side_effects:
          - "Create TurnTask(status=SCHEDULED, window_start=actual_checkout_at, window_end=earliest future RESERVED checkin_at on this room else window_start+7d, linen_tier=incoming group's tier if a next RESERVED assignment exists else departing group's tier); set Room.active_turn_task_id (bubble up)"
          - "Building.scheduled_turn_count += 1 (ledger sync, caused by the TurnTask creation)"
          - "Room.version += 1"
      - from: NEEDS_TURN
        to: IN_TURN
        trigger: "system cascade from POST /turn-tasks/{id}/start"
        actor: system
        preconditions: ["the room's active TurnTask transitions to IN_PROGRESS"]
        side_effects: ["Room.version += 1"]
      - from: IN_TURN
        to: READY
        trigger: "system cascade from POST /turn-tasks/{id}/inspect with outcome PASS"
        actor: system
        preconditions: ["the room's active TurnTask transitions to PASSED"]
        side_effects: ["Room.active_turn_task_id := null", "Room.version += 1"]
      - from: NEEDS_TURN
        to: READY
        trigger: "system cascade from POST /turn-tasks/{id}/cancel (admin skips cleaning)"
        actor: system
        preconditions: ["the room's active TurnTask transitions to CANCELLED"]
        side_effects: ["Room.active_turn_task_id := null", "Room.version += 1"]
      - from: RESERVED
        to: RELEASED
        trigger: "system cascade from assignment cancel / supersede / no-show (conditional cascade: last active assignment leaves)"
        actor: system
        preconditions: ["no StayAssignment in status RESERVED or CHECKED_IN remains on the room"]
        side_effects: ["Room.version += 1"]
      - from: RELEASED
        to: OUT_OF_SERVICE
        trigger: "system cascade from POST /maintenance-windows/{id}/start"
        actor: system
        preconditions: ["the window covering this room transitions to IN_PROGRESS"]
        side_effects: ["Room.out_of_service_window_id := window id", "Building.out_of_service_room_count += 1", "Room.version += 1"]
      - from: READY
        to: OUT_OF_SERVICE
        trigger: "system cascade from POST /maintenance-windows/{id}/start"
        actor: system
        preconditions: ["the window covering this room transitions to IN_PROGRESS"]
        side_effects: ["Room.out_of_service_window_id := window id", "Building.out_of_service_room_count += 1", "Room.version += 1"]
      - from: OUT_OF_SERVICE
        to: READY
        trigger: "system cascade from POST /maintenance-windows/{id}/complete or /cancel"
        actor: system
        preconditions: ["Room.out_of_service_window_id == that window's id"]
        side_effects: ["Room.out_of_service_window_id := null", "Building.out_of_service_room_count -= 1", "Room.version += 1"]
      - from: READY
        to: ACADEMIC_OCCUPIED
        trigger: "system cascade from POST /buildings/{id}/reopen-academic"
        actor: system
        preconditions: ["parent building reopen-academic executes"]
        side_effects: ["Room.version += 1"]
      - from: RELEASED
        to: ACADEMIC_OCCUPIED
        trigger: "system cascade from POST /buildings/{id}/reopen-academic"
        actor: system
        preconditions: ["parent building reopen-academic executes"]
        side_effects: ["Room.version += 1"]

  - entity: ConferenceGroup
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /conference-groups/{id}/submit"
        actor: ClientCoordinator
        preconditions:
          - "group.status in {DRAFT, RETURNED}"
          - "group has at least 1 Participant"
        side_effects: ["ConferenceGroup.version += 1"]
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /conference-groups/{id}/submit (resubmission loop)"
        actor: ClientCoordinator
        preconditions:
          - "group.status in {DRAFT, RETURNED}"
          - "group has at least 1 Participant"
        side_effects: ["ConferenceGroup.version += 1"]
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /conference-groups/{id}/return-for-revision"
        actor: ConferenceServicesAdmin
        preconditions: ["group.status == SUBMITTED"]
        side_effects: ["ConferenceGroup.version += 1"]
      - from: SUBMITTED
        to: CONFIRMED
        trigger: "POST /conference-groups/{id}/confirm"
        actor: ConferenceServicesAdmin
        preconditions:
          - "group.status == SUBMITTED"
          - "host building.status == TURN_ACTIVE (else ERR_BUILDING_NOT_RELEASED)"
          - "an ACTIVE RoomingListRevision with >= 1 assignment exists (else ERR_ROOMING_LIST_REQUIRED)"
          - "ACTIVE revision assignment count == group.contracted_bed_count (else ERR_CONTRACTED_BED_MISMATCH)"
          - "minor policy: if has_minor_participants, count(CHAPERONE participants with is_minor=false) >= ceil(count(is_minor participants)/10) (else ERR_CHAPERONE_RATIO_UNMET)"
          - "screening: if has_minor_participants, every participant with role_in_group in {CHAPERONE, STAFF} has a BackgroundScreening with status CLEARED (else ERR_SCREENING_NOT_CLEARED) and is_expired == false (else ERR_SCREENING_EXPIRED)"
          - "deposit_paid_cents * 4 >= provisional bed-night estimate in cents (integer-exact quarter coverage; else ERR_DEPOSIT_INSUFFICIENT)"
        side_effects:
          - "Create Invoice(status=PROVISIONAL) with provisional_bed_night_subtotal_cents and provisional_total_cents per bed_night_billing provisional variant; set group.provisional_invoice_id"
          - "ConferenceGroup.version += 1"
      - from: CONFIRMED
        to: IN_HOUSE
        trigger: "system cascade from POST /stay-assignments/{id}/check-in (first check-in of the group)"
        actor: system
        preconditions: ["an assignment of this group enters CHECKED_IN"]
        side_effects: ["ConferenceGroup.version += 1"]
      - from: IN_HOUSE
        to: DEPARTED
        trigger: "POST /conference-groups/{id}/close-out"
        actor: ConferenceServicesAdmin
        preconditions:
          - "group.status == IN_HOUSE"
          - "every StayAssignment of the group is in a terminal state (CHECKED_OUT, NO_SHOW, or CANCELLED)"
        side_effects: ["ConferenceGroup.version += 1"]
      - from: DEPARTED
        to: CLOSED
        trigger: "system cascade from POST /invoices/{id}/record-payment"
        actor: system
        preconditions: ["the group's invoice transitions to PAID"]
        side_effects: ["ConferenceGroup.version += 1"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /conference-groups/{id}/cancel"
        actor: ClientCoordinator
        preconditions: ["group.status in {DRAFT, SUBMITTED, RETURNED, CONFIRMED}"]
        side_effects:
          - "cancellation_fee_cents := 0"
          - "Every RESERVED StayAssignment of the group transitions to CANCELLED (cascade down, link 1)"
          - "Each such cancellation triggers Room RESERVED -> RELEASED where no active assignment remains (link 2, conditional cascade)"
          - "Each room that releases decrements Building.reserved_bed_count and increments Building.available_bed_count per freed bed (link 3, ledger sync)"
          - "ConferenceGroup.version += 1"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /conference-groups/{id}/cancel"
        actor: ClientCoordinator
        preconditions: ["group.status in {DRAFT, SUBMITTED, RETURNED, CONFIRMED}"]
        side_effects:
          - "cancellation_fee_cents := 0"
          - "Same assignment/room/building cascade as DRAFT cancel"
          - "ConferenceGroup.version += 1"
      - from: RETURNED
        to: CANCELLED
        trigger: "POST /conference-groups/{id}/cancel"
        actor: ClientCoordinator
        preconditions: ["group.status in {DRAFT, SUBMITTED, RETURNED, CONFIRMED}"]
        side_effects:
          - "cancellation_fee_cents := 0"
          - "Same assignment/room/building cascade as DRAFT cancel"
          - "ConferenceGroup.version += 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /conference-groups/{id}/cancel"
        actor: ClientCoordinator
        preconditions: ["group.status in {DRAFT, SUBMITTED, RETURNED, CONFIRMED}"]
        side_effects:
          - "cancellation_fee_cents := cancellation_fee(group) (threshold tiers on days before arrival)"
          - "Invoice (PROVISIONAL) transitions to VOID"
          - "Every RESERVED StayAssignment of the group transitions to CANCELLED (cascade down, link 1)"
          - "Each such cancellation triggers Room RESERVED -> RELEASED where no active assignment remains (link 2, conditional cascade)"
          - "Each room that releases decrements Building.reserved_bed_count and increments Building.available_bed_count per freed bed (link 3, ledger sync)"
          - "ConferenceGroup.version += 1"

  - entity: RoomingListRevision
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system cascade from POST /conference-groups/{id}/rooming-list-revisions (newer revision created)"
        actor: system
        preconditions: ["a newer revision for the same group is persisted"]
        side_effects:
          - "superseded_at := logical clock now"
          - "Every StayAssignment of this revision still in RESERVED transitions to CANCELLED; room/building counters update per the cancel cascade"

  - entity: StayAssignment
    initial_state: RESERVED
    terminal_states: [CHECKED_OUT, NO_SHOW, CANCELLED]
    transitions:
      - from: RESERVED
        to: CHECKED_IN
        trigger: "POST /stay-assignments/{id}/check-in"
        actor: ConferenceServicesAdmin
        preconditions:
          - "assignment.status == RESERVED"
          - "parent group.status in {CONFIRMED, IN_HOUSE} (cross-entity dependency; else ERR_INVALID_STATE)"
          - "host building.status == TURN_ACTIVE (cross-entity dependency; else ERR_BUILDING_NOT_RELEASED)"
          - "room.status in {RESERVED, OCCUPIED} (else ERR_INVALID_STATE)"
          - "logical clock in [checkin_at, checkout_at) (else ERR_OUTSIDE_CHECKIN_WINDOW)"
        side_effects:
          - "actual_checkin_at := logical clock now"
          - "If first CHECKED_IN on the room: Room RESERVED -> OCCUPIED (bubble up)"
          - "If first CHECKED_IN of the group: ConferenceGroup CONFIRMED -> IN_HOUSE (bubble up)"
          - "StayAssignment.version += 1"
      - from: CHECKED_IN
        to: CHECKED_OUT
        trigger: "POST /stay-assignments/{id}/check-out"
        actor: ConferenceServicesAdmin
        preconditions: ["assignment.status == CHECKED_IN"]
        side_effects:
          - "actual_checkout_at := logical clock now"
          - "Building.reserved_bed_count -= 1; available_bed_count += 1 (ledger sync)"
          - "If no CHECKED_IN remains on the room: Room OCCUPIED -> NEEDS_TURN, which itself creates the room's TurnTask and bumps Building.scheduled_turn_count (cascade links 2 and 3)"
          - "StayAssignment.version += 1"
      - from: RESERVED
        to: NO_SHOW
        trigger: "POST /stay-assignments/{id}/mark-no-show"
        actor: ConferenceServicesAdmin
        preconditions:
          - "assignment.status == RESERVED"
          - "logical clock > checkin_at + 24 hours (else ERR_OUTSIDE_CHECKIN_WINDOW)"
        side_effects:
          - "Building.reserved_bed_count -= 1; available_bed_count += 1"
          - "If no active assignment remains on the room: Room RESERVED -> RELEASED (conditional cascade)"
          - "StayAssignment.version += 1"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /stay-assignments/{id}/cancel OR supersede/group-cancel cascades"
        actor: ClientCoordinator
        preconditions: ["assignment.status == RESERVED"]
        side_effects:
          - "Building.reserved_bed_count -= 1; available_bed_count += 1"
          - "If no active assignment remains on the room: Room RESERVED -> RELEASED (conditional cascade)"
          - "StayAssignment.version += 1"

  - entity: BackgroundScreening
    initial_state: SUBMITTED
    terminal_states: [CLEARED, DENIED]
    transitions:
      - from: SUBMITTED
        to: IN_REVIEW
        trigger: "POST /background-screenings/{id}/begin-review"
        actor: ScreeningReviewer
        preconditions: ["screening.status == SUBMITTED"]
        side_effects: ["BackgroundScreening.version += 1"]
      - from: IN_REVIEW
        to: CLEARED
        trigger: "POST /background-screenings/{id}/decide with outcome=CLEAR"
        actor: ScreeningReviewer
        preconditions: ["screening.status == IN_REVIEW"]
        side_effects: ["decided_at := now; cleared_on := logical clock date", "BackgroundScreening.version += 1"]
      - from: IN_REVIEW
        to: FLAGGED
        trigger: "POST /background-screenings/{id}/decide with outcome=FLAG"
        actor: ScreeningReviewer
        preconditions: ["screening.status == IN_REVIEW"]
        side_effects: ["decided_at := now", "BackgroundScreening.version += 1"]
      - from: FLAGGED
        to: APPEALED
        trigger: "POST /background-screenings/{id}/appeal"
        actor: ClientCoordinator
        preconditions: ["screening.status == FLAGGED"]
        side_effects: ["BackgroundScreening.version += 1"]
      - from: APPEALED
        to: CLEARED
        trigger: "POST /background-screenings/{id}/resolve-appeal with outcome=CLEAR (appeal loop closes)"
        actor: ScreeningReviewer
        preconditions: ["screening.status == APPEALED"]
        side_effects: ["decided_at := now; cleared_on := logical clock date", "BackgroundScreening.version += 1"]
      - from: APPEALED
        to: DENIED
        trigger: "POST /background-screenings/{id}/resolve-appeal with outcome=DENY"
        actor: ScreeningReviewer
        preconditions: ["screening.status == APPEALED"]
        side_effects: ["decided_at := now", "BackgroundScreening.version += 1"]

  - entity: TurnTask
    initial_state: SCHEDULED
    terminal_states: [PASSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /turn-tasks/{id}/start"
        actor: HousekeepingSupervisor
        preconditions: ["task.status in {SCHEDULED, FAILED}", "room.status in {NEEDS_TURN, IN_TURN}"]
        side_effects:
          - "If room NEEDS_TURN: Room -> IN_TURN (bubble up)"
          - "TurnTask.version += 1"
      - from: FAILED
        to: IN_PROGRESS
        trigger: "POST /turn-tasks/{id}/start (rework loop)"
        actor: HousekeepingSupervisor
        preconditions: ["task.status in {SCHEDULED, FAILED}", "room.status in {NEEDS_TURN, IN_TURN}"]
        side_effects: ["TurnTask.version += 1"]
      - from: IN_PROGRESS
        to: READY_FOR_INSPECTION
        trigger: "POST /turn-tasks/{id}/submit-for-inspection"
        actor: HousekeepingSupervisor
        preconditions: ["task.status == IN_PROGRESS"]
        side_effects: ["TurnTask.version += 1"]
      - from: READY_FOR_INSPECTION
        to: PASSED
        trigger: "POST /turn-tasks/{id}/inspect with outcome=PASS"
        actor: HousekeepingSupervisor
        preconditions:
          - "task.status == READY_FOR_INSPECTION"
          - "if task.rework_count >= 2, only ConferenceServicesAdmin may inspect (else ERR_TURN_REWORK_ESCALATION)"
        side_effects:
          - "Room IN_TURN -> READY; Room.active_turn_task_id := null (bubble up)"
          - "Building.scheduled_turn_count -= 1 (ledger sync)"
          - "TurnTask.version += 1"
      - from: READY_FOR_INSPECTION
        to: FAILED
        trigger: "POST /turn-tasks/{id}/inspect with outcome=FAIL"
        actor: HousekeepingSupervisor
        preconditions:
          - "task.status == READY_FOR_INSPECTION"
          - "if task.rework_count >= 2, only ConferenceServicesAdmin may inspect (else ERR_TURN_REWORK_ESCALATION)"
        side_effects:
          - "rework_count += 1"
          - "TurnTask.version += 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /turn-tasks/{id}/cancel"
        actor: ConferenceServicesAdmin
        preconditions: ["task.status == SCHEDULED"]
        side_effects:
          - "Room NEEDS_TURN -> READY; Room.active_turn_task_id := null (admin override skips cleaning)"
          - "Building.scheduled_turn_count -= 1"
          - "TurnTask.version += 1"

  - entity: LinenIssue
    initial_state: ISSUED
    terminal_states: [RECONCILED]
    transitions:
      - from: ISSUED
        to: PARTIALLY_RETURNED
        trigger: "POST /linen-issues/{id}/record-return"
        actor: HousekeepingSupervisor
        preconditions:
          - "issue.status in {ISSUED, PARTIALLY_RETURNED}"
          - "packs_returned + packs_damaged (cumulative after this call) <= packs_issued (else ERR_LINEN_OVERRETURN)"
        side_effects: ["accumulate packs_returned/packs_damaged", "LinenIssue.version += 1"]
      - from: PARTIALLY_RETURNED
        to: PARTIALLY_RETURNED
        trigger: "POST /linen-issues/{id}/record-return (repeat partial return)"
        actor: HousekeepingSupervisor
        preconditions:
          - "issue.status in {ISSUED, PARTIALLY_RETURNED}"
          - "packs_returned + packs_damaged (cumulative after this call) <= packs_issued (else ERR_LINEN_OVERRETURN)"
        side_effects: ["accumulate packs_returned/packs_damaged", "LinenIssue.version += 1"]
      - from: ISSUED
        to: RECONCILED
        trigger: "POST /linen-issues/{id}/record-return (full accounting in one call)"
        actor: HousekeepingSupervisor
        preconditions:
          - "issue.status in {ISSUED, PARTIALLY_RETURNED}"
          - "packs_returned + packs_damaged (cumulative after this call) == packs_issued"
        side_effects: ["accumulate packs_returned/packs_damaged", "LinenIssue.version += 1"]
      - from: PARTIALLY_RETURNED
        to: RECONCILED
        trigger: "POST /linen-issues/{id}/record-return (final return completes accounting)"
        actor: HousekeepingSupervisor
        preconditions:
          - "issue.status in {ISSUED, PARTIALLY_RETURNED}"
          - "packs_returned + packs_damaged (cumulative after this call) == packs_issued"
        side_effects: ["accumulate packs_returned/packs_damaged", "LinenIssue.version += 1"]

  - entity: KeyCredential
    initial_state: ISSUED
    terminal_states: [RETURNED, LOST]
    transitions:
      - from: ISSUED
        to: ACTIVATED
        trigger: "POST /key-credentials/{id}/activate"
        actor: ConferenceServicesAdmin
        preconditions:
          - "credential.status == ISSUED"
          - "parent group.status in {CONFIRMED, IN_HOUSE} (else ERR_INVALID_STATE)"
        side_effects: ["KeyCredential.version += 1"]
      - from: ISSUED
        to: RETURNED
        trigger: "POST /key-credentials/{id}/return"
        actor: ConferenceServicesAdmin
        preconditions: ["credential.status in {ISSUED, ACTIVATED}"]
        side_effects:
          - "returned_at := logical clock now; late_fee_cents := key_late_fee(group.departure_date, returned_at)"
          - "Building.available_key_count += 1 (compensating return to pool)"
          - "KeyCredential.version += 1"
      - from: ACTIVATED
        to: RETURNED
        trigger: "POST /key-credentials/{id}/return"
        actor: ConferenceServicesAdmin
        preconditions: ["credential.status in {ISSUED, ACTIVATED}"]
        side_effects:
          - "returned_at := logical clock now; late_fee_cents := key_late_fee(group.departure_date, returned_at)"
          - "Building.available_key_count += 1 (compensating return to pool)"
          - "KeyCredential.version += 1"
      - from: ISSUED
        to: LOST
        trigger: "POST /key-credentials/{id}/report-lost"
        actor: ConferenceServicesAdmin
        preconditions: ["credential.status in {ISSUED, ACTIVATED}"]
        side_effects:
          - "lost_fee_cents := KEY_LOST_FEE_CENTS (NOT returned to available_key_count)"
          - "KeyCredential.version += 1"
      - from: ACTIVATED
        to: LOST
        trigger: "POST /key-credentials/{id}/report-lost"
        actor: ConferenceServicesAdmin
        preconditions: ["credential.status in {ISSUED, ACTIVATED}"]
        side_effects:
          - "lost_fee_cents := KEY_LOST_FEE_CENTS (NOT returned to available_key_count)"
          - "KeyCredential.version += 1"

  - entity: DamageAssessment
    initial_state: REPORTED
    terminal_states: [BILLED, WAIVED]
    transitions:
      - from: REPORTED
        to: ASSESSED
        trigger: "POST /damage-assessments/{id}/assess"
        actor: FacilitiesManager
        preconditions: ["assessment.status == REPORTED"]
        side_effects:
          - "assessed_total_cents := damage_charge assessed variant; assessed_at := logical clock now"
          - "DamageAssessment.version += 1"
      - from: ASSESSED
        to: BILLED
        trigger: "POST /damage-assessments/{id}/bill"
        actor: FinanceOfficer
        preconditions:
          - "assessment.status == ASSESSED"
          - "parent group.status in {IN_HOUSE, DEPARTED} (else ERR_INVALID_STATE)"
        side_effects: ["DamageAssessment.version += 1"]
      - from: ASSESSED
        to: DISPUTED
        trigger: "POST /damage-assessments/{id}/dispute"
        actor: ClientCoordinator
        preconditions:
          - "assessment.status == ASSESSED"
          - "logical clock date <= assessed_at date + DAMAGE_DISPUTE_WINDOW_DAYS (else ERR_DISPUTE_WINDOW_CLOSED)"
        side_effects: ["DamageAssessment.version += 1"]
      - from: DISPUTED
        to: BILLED
        trigger: "POST /damage-assessments/{id}/resolve with outcome=ACCEPT"
        actor: FinanceOfficer
        preconditions: ["assessment.status == DISPUTED"]
        side_effects:
          - "if adjusted_line_items provided: line_items := adjusted; assessed_total_cents recomputed per damage_charge assessed variant"
          - "DamageAssessment.version += 1"
      - from: DISPUTED
        to: WAIVED
        trigger: "POST /damage-assessments/{id}/resolve with outcome=WAIVE"
        actor: FinanceOfficer
        preconditions: ["assessment.status == DISPUTED"]
        side_effects: ["assessed_total_cents := 0", "DamageAssessment.version += 1"]

  - entity: Invoice
    initial_state: PROVISIONAL
    terminal_states: [PAID, VOID]
    transitions:
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "POST /invoices/{id}/finalize"
        actor: FinanceOfficer
        preconditions:
          - "invoice.status == PROVISIONAL"
          - "parent group.status == DEPARTED (cross-entity dependency; else ERR_INVOICE_NOT_FINALIZABLE)"
        side_effects:
          - "final_bed_night_subtotal_cents := bed_night_billing final variant over the group's assignments"
          - "linen_charge_cents := sum(loss_charge_cents) over group's LinenIssues; key_charge_cents := sum(late_fee_cents + lost_fee_cents) over group's KeyCredentials; damage_charge_cents := sum(assessed_total_cents) over group's BILLED DamageAssessments"
          - "total_cents := final_bed_night_subtotal_cents + linen + key + damage; balance_due_cents := total_cents - group.deposit_paid_cents; finalized_at := now"
          - "Invoice.version += 1"
      - from: FINALIZED
        to: PAID
        trigger: "POST /invoices/{id}/record-payment"
        actor: FinanceOfficer
        preconditions:
          - "invoice.status == FINALIZED (else ERR_INVOICE_ALREADY_PAID when PAID)"
          - "amount_cents == balance_due_cents exactly (else ERR_PAYMENT_AMOUNT_MISMATCH)"
        side_effects:
          - "paid_at := logical clock now"
          - "ConferenceGroup DEPARTED -> CLOSED (bubble up)"
          - "Invoice.version += 1"
      - from: PROVISIONAL
        to: VOID
        trigger: "system cascade from POST /conference-groups/{id}/cancel (from CONFIRMED)"
        actor: system
        preconditions: ["parent group transitions to CANCELLED"]
        side_effects: ["Invoice.version += 1"]

  - entity: MaintenanceWindow
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: CONFIRMED
        trigger: "POST /maintenance-windows/{id}/confirm"
        actor: FacilitiesManager
        preconditions:
          - "window.status == PLANNED"
          - "building.status in {RELEASED, TURN_ACTIVE, FALL_PREP} (else ERR_INVALID_STATE)"
          - "blocked_end_date strictly before building.fall_opening_date (else ERR_FALL_DEADLINE_IMMINENT)"
          - "no StayAssignment in status RESERVED or CHECKED_IN in the building's rooms has occupied nights [checkin_date, checkout_date - 1 day] intersecting the inclusive blocked interval [blocked_start_date, blocked_end_date] (else ERR_MAINTENANCE_CONFLICT)"
          - "no other MaintenanceWindow in status CONFIRMED or IN_PROGRESS on the same building has a blocked interval intersecting this one (else ERR_MAINTENANCE_CONFLICT)"
        side_effects: ["MaintenanceWindow.version += 1"]
      - from: CONFIRMED
        to: IN_PROGRESS
        trigger: "POST /maintenance-windows/{id}/start"
        actor: FacilitiesManager
        preconditions:
          - "window.status == CONFIRMED"
          - "logical clock date >= start_date (else ERR_OUTSIDE_CHECKIN_WINDOW)"
        side_effects:
          - "Every room of the building in status RELEASED or READY transitions to OUT_OF_SERVICE with out_of_service_window_id := window id (cascade down)"
          - "Building.out_of_service_room_count += number of rooms taken out of service"
          - "MaintenanceWindow.version += 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /maintenance-windows/{id}/complete"
        actor: FacilitiesManager
        preconditions: ["window.status == IN_PROGRESS"]
        side_effects:
          - "Every room with out_of_service_window_id == window id transitions OUT_OF_SERVICE -> READY (compensation)"
          - "Building.out_of_service_room_count -= number of rooms restored"
          - "MaintenanceWindow.version += 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /maintenance-windows/{id}/cancel"
        actor: FacilitiesManager
        preconditions: ["window.status in {PLANNED, CONFIRMED}"]
        side_effects: ["MaintenanceWindow.version += 1"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /maintenance-windows/{id}/cancel"
        actor: FacilitiesManager
        preconditions: ["window.status in {PLANNED, CONFIRMED}"]
        side_effects: ["MaintenanceWindow.version += 1"]

  - entity: AllocationRun
    initial_state: OPEN
    terminal_states: [LOCKED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /allocation-runs/{id}/lock"
        actor: FinanceOfficer
        preconditions: ["run.status == OPEN"]
        side_effects: ["AllocationRun.version += 1; bucket values frozen"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: rooming-revision-stale-group
    parent_entity: ConferenceGroup
    write_endpoint: "POST /conference-groups/{id}/rooming-list-revisions"
    occ_field: expected_conference_group_version
    description: |
      Creating a new RoomingListRevision against a ConferenceGroup whose version
      has advanced since the client last observed it is rejected. A newer
      revision legitimately supersedes the prior ACTIVE one, so a writer holding
      a stale group version would silently supersede a revision it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: maintenance-window-stale-building
    parent_entity: Building
    write_endpoint: "POST /buildings/{id}/maintenance-windows"
    occ_field: expected_building_version
    description: |
      Creating a MaintenanceWindow against a Building whose version has advanced
      since the client last observed it is rejected. Lifecycle transitions such
      as confirm-release or begin-turn-season change the building's releasable
      inventory, so a window planned against a stale building version must not
      be accepted.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: bed_night_billing
    description: Per-bed-night group billing with volume tiers, minor surcharge, and weekend premium; provisional and final variants diverge on the same data
    trigger: "provisional variant at POST /conference-groups/{id}/confirm (and re-run on revision supersede while CONFIRMED); final variant at POST /invoices/{id}/finalize"
    inputs: ["group StayAssignments (per-variant status filter)", "group.has_minor_participants", "checkin_at/checkout_at or actual timestamps"]
    algorithm: tiered_pricing
    formula: |
      For each included assignment, determine the list of occupied nights:
        provisional: nights = calendar dates d with checkin_at <= d < checkout_at (date of checkin counts, date of checkout does not)
        final: CHECKED_OUT -> nights = calendar dates d with actual_checkin_at <= d < actual_checkout_at;
               NO_SHOW -> exactly 1 flat night charged at BASE_RATE_CENTS with NO surcharge/premium/tier adjustment;
               CANCELLED -> excluded entirely.
      Per-night charge (non-NO_SHOW nights):
        base rate for the night's tier: the group's cumulative bed-night index across ALL included nights
        (ordered by check-in date ASC, then participant created_at ASC) determines tier:
        bed-nights with cumulative index <= TIER_THRESHOLD_BED_NIGHTS price at BASE_RATE_CENTS;
        bed-nights with cumulative index > TIER_THRESHOLD_BED_NIGHTS price at TIER2_RATE_CENTS (marginal, not average).
        if group.has_minor_participants: rate = round_half_up(rate * (1 + MINOR_SURCHARGE_PCT/100)) per night BEFORE weekend premium.
        if the night falls on Friday or Saturday: rate += WEEKEND_PREMIUM_CENTS (added AFTER surcharge rounding).
      subtotal = sum over all included nights. precision pinned: per-night rounding, then integer sum.
    input_set: "provisional: assignments of the ACTIVE revision in status RESERVED or CHECKED_IN; final: assignments in status CHECKED_OUT (actual nights) or NO_SHOW (flat night)"
    constants:
      BASE_RATE_CENTS: 4500
      TIER_THRESHOLD_BED_NIGHTS: 100
      TIER2_RATE_CENTS: 3900
      MINOR_SURCHARGE_PCT: 15
      WEEKEND_PREMIUM_CENTS: 400
      NO_SHOW_FLAT_NIGHTS: 1
    precision: "integer cents; round_half_up applied per night before summation"
    variants:
      - name: provisional
        when: "at confirm time, and recomputed whenever a new revision supersedes while the group is CONFIRMED"
        difference: "uses planned [checkin_at, checkout_at) nights of RESERVED+CHECKED_IN assignments; identical data after checkout yields a different number than final because early checkouts shrink nights and NO_SHOW collapses to a flat rate"
      - name: final
        when: "at invoice finalize (group DEPARTED)"
        difference: "uses actual stay nights for CHECKED_OUT, flat 1-night base-rate charge for NO_SHOW, excludes CANCELLED"

  - name: damage_charge
    description: Depreciated damage charge with pinned per-line rounding order; estimate and assessed variants diverge
    trigger: "estimate variant at POST /rooms/{id}/damage-assessments (stored as estimate_total_cents); assessed variant at POST /damage-assessments/{id}/assess (and re-run on resolve with adjusted_line_items)"
    inputs: ["line_items array of {description, quantity, unit_replacement_cost_cents, fixture_age_months}"]
    algorithm: aggregation
    formula: |
      assessed variant (rounding order PINNED — round per unit first, then multiply, then sum, then add fee):
        per line: depreciation_factor = max(DEPRECIATION_FLOOR, 1 - MONTHLY_DEPRECIATION_PCT/100 * fixture_age_months)
                  depreciated_unit_cents = round_half_up(unit_replacement_cost_cents * depreciation_factor)
                  line_total_cents = depreciated_unit_cents * quantity
        charge = sum(line_total_cents) + (ADMIN_FEE_CENTS if at least one line else 0)
      estimate variant: charge = sum(quantity * unit_replacement_cost_cents) over lines; no depreciation, no fee.
    input_set: "the assessment's own line_items only"
    constants:
      MONTHLY_DEPRECIATION_PCT: 2
      DEPRECIATION_FLOOR: 0.40
      ADMIN_FEE_CENTS: 2500
    precision: "integer cents; round_half_up at the per-unit step only"
    variants:
      - name: estimate
        when: "at report time, before facilities walks the room"
        difference: "no depreciation and no admin fee; straight replacement sum — always >= assessed for the same line items when any fixture_age_months > 0"
      - name: assessed
        when: "at assess time (and on dispute resolution with adjusted lines)"
        difference: "per-unit depreciation with floor, round-half-up per unit before multiplying by quantity, plus one flat admin fee"

  - name: revenue_allocation
    description: Waterfall allocation of settled summer revenue to housing budget lines with pinned evaluation order
    trigger: "POST /buildings/{id}/allocation-runs"
    inputs: ["PAID invoices of groups hosted by the building with paid_at in [period_start, period_end)"]
    algorithm: waterfall_allocation
    formula: |
      gross_cents = sum(invoice.total_cents) over the input set (empty set -> 0).
      Evaluation order PINNED (the dependency is deliberately order-sensitive):
        step 1: overhead_cents = round_half_up(gross_cents * OVERHEAD_PCT/100)
        step 2: reserve_cents  = round_half_up((gross_cents - overhead_cents) * RESERVE_PCT/100)   # reserve keys off NET-of-overhead, never gross
        step 3: ops_cents      = gross_cents - overhead_cents - reserve_cents                      # remainder bucket absorbs rounding drift
      Invariant: overhead_cents + reserve_cents + ops_cents == gross_cents exactly.
    input_set: "invoices with status PAID whose group.building_id == this building and period_start <= paid_at < period_end"
    constants:
      OVERHEAD_PCT: 12
      RESERVE_PCT: 8
    precision: "integer cents; round_half_up at steps 1 and 2; step 3 is exact subtraction"
    variants: []

  - name: turn_window_requirement
    description: Minimum gap between a departing stay's checkout and the next stay's check-in on the same room, tiered by incoming group's linen tier
    trigger: "evaluated for every new assignment at POST /conference-groups/{id}/rooming-list-revisions against both the immediately-preceding and immediately-following non-cancelled assignment on the same room"
    inputs: ["new assignment [checkin_at, checkout_at)", "neighboring assignments' intervals on the same room", "incoming group's linen_tier (for gaps before the new assignment); the following assignment's group linen_tier (for gaps after)"]
    algorithm: threshold
    formula: |
      required_hours(tier) = BASE_TURN_HOURS if tier == STANDARD else DELUXE_TURN_HOURS.
      For the preceding assignment P (latest P.checkout_at <= new.checkin_at among non-cancelled assignments on the room):
        gap_hours = (new.checkin_at - P.checkout_at) in hours; PASS iff gap_hours >= required_hours(new group's linen_tier). Equality PASSES.
      For the following assignment F (earliest F.checkin_at >= new.checkout_at):
        gap_hours = (F.checkin_at - new.checkout_at) in hours; PASS iff gap_hours >= required_hours(F's group linen_tier). Equality PASSES.
      Assignments whose intervals merely touch (checkout_at == checkin_at) do NOT overlap, but the turn rule still applies to the 0-hour gap and therefore rejects them unless the required hours are met.
    input_set: "StayAssignments on the same room in status RESERVED or CHECKED_IN (CANCELLED/NO_SHOW/CHECKED_OUT assignments still bound their occupied interval only when CHECKED_OUT via actual timestamps; cancelled/no-show are ignored)"
    constants:
      BASE_TURN_HOURS: 24
      DELUXE_TURN_HOURS: 30
    precision: "whole hours; instants compared exactly"
    variants: []

  - name: key_late_fee
    description: Late key return fee with grace-day boundary
    trigger: "POST /key-credentials/{id}/return"
    inputs: ["group.departure_date", "returned_at (logical clock)"]
    algorithm: threshold
    formula: |
      return_date = calendar date of returned_at.
      late_days = max(0, (return_date - group.departure_date).days - KEY_GRACE_DAYS)
      fee_cents = min(late_days * KEY_LATE_FEE_PER_DAY_CENTS, KEY_LATE_FEE_CAP_CENTS)
      Boundary: return on departure_date + KEY_GRACE_DAYS -> late_days = 0 (fee 0); one day later -> late_days = 1.
    input_set: "the single credential being returned"
    constants:
      KEY_GRACE_DAYS: 2
      KEY_LATE_FEE_PER_DAY_CENTS: 1500
      KEY_LATE_FEE_CAP_CENTS: 7500
      KEY_LOST_FEE_CENTS: 5000
    precision: "integer cents, no rounding"
    variants: []

  - name: cancellation_fee
    description: Tiered cancellation fee when cancelling a CONFIRMED group
    trigger: "POST /conference-groups/{id}/cancel when group.status == CONFIRMED"
    inputs: ["group.arrival_date", "logical clock date", "invoice.provisional_total_cents"]
    algorithm: threshold
    formula: |
      days_before = (group.arrival_date - current date).days
      if days_before >= FREE_CANCEL_DAYS: fee = 0
      elif days_before >= REDUCED_CANCEL_DAYS: fee = round_half_up(provisional_total_cents * REDUCED_CANCEL_PCT/100)
      else: fee = round_half_up(provisional_total_cents * LATE_CANCEL_PCT/100)
      Boundary: days_before == 30 -> 20% tier; days_before == 14 -> 50% tier.
      Cancelling from DRAFT/SUBMITTED/RETURNED always charges 0.
    input_set: "the group being cancelled and its PROVISIONAL invoice"
    constants:
      FREE_CANCEL_DAYS: 31
      REDUCED_CANCEL_DAYS: 15
      REDUCED_CANCEL_PCT: 20
      LATE_CANCEL_PCT: 50
    precision: "integer cents, round_half_up"
    variants: []

  - name: linen_reconciliation_charge
    description: Lost/damaged linen charge folded into the final invoice
    trigger: "POST /invoices/{id}/finalize (summed over the group's LinenIssues); each issue's loss_charge_cents recomputed on every record-return"
    inputs: ["packs_issued, packs_returned, packs_damaged per LinenIssue"]
    algorithm: aggregation
    formula: |
      per issue: lost = packs_issued - packs_returned - packs_damaged
                 loss_charge_cents = lost * LINEN_PACK_COST_CENTS + packs_damaged * LINEN_DAMAGED_PACK_CENTS
      invoice linen_charge_cents = sum(loss_charge_cents) over ALL of the group's LinenIssues regardless of status.
    input_set: "all LinenIssues of the group"
    constants:
      LINEN_PACK_COST_CENTS: 3200
      LINEN_DAMAGED_PACK_CENTS: 1600
    precision: "integer cents, no rounding"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is in the endpoint's roles list; conditional rule: TurnTask inspect with rework_count >= 2 requires ConferenceServicesAdmin"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Conditional authorization: HousekeepingSupervisor inspecting a TurnTask with rework_count >= 2 is rejected"
    error_id: ERR_TURN_REWORK_ESCALATION
    http_status: 403
    applies_to: ["POST /turn-tasks/{id}/inspect"]
  - priority: 4
    category: auth
    check: "Ownership: when acting as ClientCoordinator, X-User-ID must equal the target ConferenceGroup's id (directly or via the parent group of the addressed participant/assignment/screening/assessment)"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: ["POST /conference-groups/{id}/submit", "POST /conference-groups/{id}/cancel", "POST /conference-groups/{id}/participants", "POST /conference-groups/{id}/rooming-list-revisions", "GET /conference-groups/{id}", "GET /conference-groups/{id}/participants", "GET /conference-groups/{id}/rooming-list-revisions", "POST /participants/{id}/background-screenings", "POST /background-screenings/{id}/appeal", "POST /stay-assignments/{id}/cancel", "POST /damage-assessments/{id}/dispute"]
  - priority: 5
    category: existence
    check: "Every id in the path exists, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 6
    category: existence
    check: "Request body well-formed: required fields present, enum members valid, FK ids in the body reference existing entities"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 7
    category: state
    check: "OCC: expected_<parent>_version equals the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /conference-groups/{id}/rooming-list-revisions", "POST /buildings/{id}/maintenance-windows"]
  - priority: 8
    category: state
    check: "Target entity's state machine permits the requested transition (covers ERR_INVALID_STATE plus domain-named state errors)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 9
    category: state
    check: "Building must be TURN_ACTIVE for group confirm and assignment check-in"
    error_id: ERR_BUILDING_NOT_RELEASED
    http_status: 409
    applies_to: ["POST /conference-groups/{id}/confirm", "POST /stay-assignments/{id}/check-in"]
  - priority: 10
    category: state
    check: "Room must be reservable (RELEASED, READY, RESERVED, or OCCUPIED — not NEEDS_TURN, IN_TURN, OUT_OF_SERVICE) for new assignments"
    error_id: ERR_ROOM_NOT_RESERVABLE
    http_status: 409
    applies_to: ["POST /conference-groups/{id}/rooming-list-revisions"]
  - priority: 11
    category: state
    check: "Group cancellable only from DRAFT, SUBMITTED, RETURNED, or CONFIRMED"
    error_id: ERR_GROUP_NOT_CANCELLABLE
    http_status: 409
    applies_to: ["POST /conference-groups/{id}/cancel"]
  - priority: 12
    category: state
    check: "Invoice finalizable only when PROVISIONAL and parent group DEPARTED"
    error_id: ERR_INVOICE_NOT_FINALIZABLE
    http_status: 409
    applies_to: ["POST /invoices/{id}/finalize"]
  - priority: 13
    category: state
    check: "Payment only on a FINALIZED invoice; a PAID invoice rejects further payment"
    error_id: ERR_INVOICE_ALREADY_PAID
    http_status: 409
    applies_to: ["POST /invoices/{id}/record-payment"]
  - priority: 14
    category: state
    check: "Damage bill requires ASSESSED; dispute requires ASSESSED; assess requires REPORTED"
    error_id: ERR_DAMAGE_NOT_ASSESSED
    http_status: 409
    applies_to: ["POST /damage-assessments/{id}/bill", "POST /damage-assessments/{id}/dispute", "POST /damage-assessments/{id}/assess", "POST /damage-assessments/{id}/resolve"]
  - priority: 15
    category: state
    check: "Operations referencing a SUPERSEDED revision (e.g., cancelling its already-cancelled assignments) are rejected"
    error_id: ERR_REVISION_SUPERSEDED
    http_status: 409
    applies_to: ["POST /stay-assignments/{id}/cancel"]
  - priority: 16
    category: business_safety
    check: "Minor policy: if has_minor_participants, non-minor CHAPERONE count >= ceil(minor count / 10)"
    error_id: ERR_CHAPERONE_RATIO_UNMET
    http_status: 422
    applies_to: ["POST /conference-groups/{id}/confirm"]
  - priority: 17
    category: business_safety
    check: "Screening: every CHAPERONE/STAFF participant of a minor-flagged group has a screening in status CLEARED"
    error_id: ERR_SCREENING_NOT_CLEARED
    http_status: 422
    applies_to: ["POST /conference-groups/{id}/confirm"]
  - priority: 18
    category: business_safety
    check: "Screening freshness: the CLEARED screening's is_expired must be false at confirm time"
    error_id: ERR_SCREENING_EXPIRED
    http_status: 422
    applies_to: ["POST /conference-groups/{id}/confirm"]
  - priority: 19
    category: business_safety
    check: "Screening submissions only for CHAPERONE/STAFF participants"
    error_id: ERR_SCREENING_NOT_REQUIRED
    http_status: 422
    applies_to: ["POST /participants/{id}/background-screenings"]
  - priority: 20
    category: business_temporal
    check: "Interval sanity: end_date >= start_date; checkout_at strictly after checkin_at; departure_date after arrival_date"
    error_id: ERR_DATE_RANGE_INVALID
    http_status: 400
    applies_to: ["POST /buildings/{id}/maintenance-windows", "POST /conference-groups/{id}/rooming-list-revisions", "POST /conference-groups", "POST /buildings/{id}/allocation-runs"]
  - priority: 21
    category: business_temporal
    check: "Participant double-booking: the same participant already holds a non-cancelled assignment (any room) whose half-open interval intersects the new one (adjacent touch is NOT an overlap)"
    error_id: ERR_OCCUPANCY_OVERLAP
    http_status: 409
    applies_to: ["POST /conference-groups/{id}/rooming-list-revisions"]
  - priority: 22
    category: business_temporal
    check: "Turn window: gap to the preceding/following assignment on the same room meets turn_window_requirement (>= required hours; equality passes)"
    error_id: ERR_TURN_WINDOW_TOO_SHORT
    http_status: 422
    applies_to: ["POST /conference-groups/{id}/rooming-list-revisions"]
  - priority: 23
    category: business_temporal
    check: "Maintenance conflict: blocked inclusive interval [start-buffer, end+buffer] intersects occupied nights of any RESERVED/CHECKED_IN assignment in the building, or another CONFIRMED/IN_PROGRESS window's blocked interval"
    error_id: ERR_MAINTENANCE_CONFLICT
    http_status: 409
    applies_to: ["POST /maintenance-windows/{id}/confirm"]
  - priority: 24
    category: business_temporal
    check: "Fall deadline: blocked_end_date must be strictly before building.fall_opening_date; equality fails"
    error_id: ERR_FALL_DEADLINE_IMMINENT
    http_status: 422
    applies_to: ["POST /maintenance-windows/{id}/confirm"]
  - priority: 25
    category: business_temporal
    check: "Check-in only within [checkin_at, checkout_at); no-show only after checkin_at + 24h; maintenance start only on/after start_date"
    error_id: ERR_OUTSIDE_CHECKIN_WINDOW
    http_status: 422
    applies_to: ["POST /stay-assignments/{id}/check-in", "POST /stay-assignments/{id}/mark-no-show", "POST /maintenance-windows/{id}/start"]
  - priority: 26
    category: business_temporal
    check: "Damage dispute only within DAMAGE_DISPUTE_WINDOW_DAYS (7) calendar days of assessed_at, inclusive of the 7th day"
    error_id: ERR_DISPUTE_WINDOW_CLOSED
    http_status: 422
    applies_to: ["POST /damage-assessments/{id}/dispute"]
  - priority: 27
    category: business_constraint
    check: "Rooming list presence and size: an ACTIVE revision with >= 1 assignment exists and its assignment count equals contracted_bed_count"
    error_id: ERR_ROOMING_LIST_REQUIRED
    http_status: 422
    applies_to: ["POST /conference-groups/{id}/confirm"]
  - priority: 28
    category: business_constraint
    check: "Contracted bed count equals ACTIVE revision assignment count"
    error_id: ERR_CONTRACTED_BED_MISMATCH
    http_status: 422
    applies_to: ["POST /conference-groups/{id}/confirm"]
  - priority: 29
    category: business_constraint
    check: "Room capacity: overlapping (half-open intersection) non-cancelled assignments on the room must be < bed_count to admit one more"
    error_id: ERR_ROOM_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: ["POST /conference-groups/{id}/rooming-list-revisions"]
  - priority: 30
    category: business_constraint
    check: "Key pool: issuing requires building.available_key_count >= 1"
    error_id: ERR_KEY_INVENTORY_EXHAUSTED
    http_status: 422
    applies_to: ["POST /conference-groups/{id}/key-credentials"]
  - priority: 31
    category: business_constraint
    check: "Linen return: cumulative packs_returned + packs_damaged must not exceed packs_issued"
    error_id: ERR_LINEN_OVERRETURN
    http_status: 422
    applies_to: ["POST /linen-issues/{id}/record-return"]
  - priority: 32
    category: business_fiscal
    check: "Deposit coverage: deposit_paid_cents * 4 >= provisional bed-night estimate in cents at confirm (integer-exact, no fractional cents)"
    error_id: ERR_DEPOSIT_INSUFFICIENT
    http_status: 422
    applies_to: ["POST /conference-groups/{id}/confirm"]
  - priority: 33
    category: business_fiscal
    check: "Payment exactness: amount_cents == balance_due_cents"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: ["POST /invoices/{id}/record-payment"]

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/buildings"
    description: Create a building (initial status ACADEMIC_USE)
    roles: [ConferenceServicesAdmin]
    code: 201
    input: [name, fall_opening_date, key_pool_size]
    output: Building
    side_effects: []
  - method: GET
    path: "/buildings"
    description: List buildings with pagination
    roles: [ConferenceServicesAdmin, FacilitiesManager, HousekeepingSupervisor, FinanceOfficer, ScreeningReviewer, ClientCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Building[]
    side_effects: []
  - method: GET
    path: "/buildings/{id}"
    description: Fetch one building (includes version and counters)
    roles: [ConferenceServicesAdmin, FacilitiesManager, HousekeepingSupervisor, FinanceOfficer, ScreeningReviewer, ClientCoordinator]
    code: 200
    input: []
    output: Building
    side_effects: []
  - method: POST
    path: "/buildings/{id}/initiate-release"
    description: ACADEMIC_USE -> RELEASE_REVIEW
    roles: [FacilitiesManager, ConferenceServicesAdmin]
    code: 200
    input: []
    output: Building
    side_effects: ["Building.version += 1"]
  - method: POST
    path: "/buildings/{id}/confirm-release"
    description: RELEASE_REVIEW -> RELEASED; cascades rooms to RELEASED; freezes released_bed_count and key pool
    roles: [FacilitiesManager, ConferenceServicesAdmin]
    code: 200
    input: []
    output: Building
    side_effects: ["rooms ACADEMIC_OCCUPIED -> RELEASED", "released_bed_count/available_bed_count/available_key_count initialized", "Building.version += 1"]
  - method: POST
    path: "/buildings/{id}/abort-release"
    description: RELEASE_REVIEW -> ACADEMIC_USE
    roles: [FacilitiesManager, ConferenceServicesAdmin]
    code: 200
    input: []
    output: Building
    side_effects: ["Building.version += 1"]
  - method: POST
    path: "/buildings/{id}/begin-turn-season"
    description: RELEASED -> TURN_ACTIVE
    roles: [FacilitiesManager, ConferenceServicesAdmin]
    code: 200
    input: []
    output: Building
    side_effects: ["Building.version += 1"]
  - method: POST
    path: "/buildings/{id}/begin-fall-prep"
    description: TURN_ACTIVE -> FALL_PREP; requires no active stays and no open turn tasks
    roles: [FacilitiesManager, ConferenceServicesAdmin]
    code: 200
    input: []
    output: Building
    side_effects: ["Building.version += 1"]
  - method: POST
    path: "/buildings/{id}/certify-fall-ready"
    description: FALL_PREP -> READY_FOR_FALL; requires zero out-of-service rooms and no open windows
    roles: [FacilitiesManager, ConferenceServicesAdmin]
    code: 200
    input: []
    output: Building
    side_effects: ["Building.version += 1"]
  - method: POST
    path: "/buildings/{id}/reopen-academic"
    description: READY_FOR_FALL -> ACADEMIC_USE; closes the season cycle, resets counters, returns rooms to ACADEMIC_OCCUPIED
    roles: [FacilitiesManager, ConferenceServicesAdmin]
    code: 200
    input: []
    output: Building
    side_effects: ["rooms READY/RELEASED -> ACADEMIC_OCCUPIED", "bed counters reset to 0", "Building.version += 1"]
  - method: POST
    path: "/buildings/{id}/rooms"
    description: Create a room (initial status ACADEMIC_OCCUPIED; only while building in ACADEMIC_USE or RELEASE_REVIEW)
    roles: [FacilitiesManager, ConferenceServicesAdmin]
    code: 201
    input: [room_number, bed_count]
    output: Room
    side_effects: []
  - method: GET
    path: "/buildings/{id}/rooms"
    description: List rooms of a building (reverse reachability for Room.building_id)
    roles: [ConferenceServicesAdmin, FacilitiesManager, HousekeepingSupervisor, FinanceOfficer, ScreeningReviewer, ClientCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Room[]
    side_effects: []
  - method: GET
    path: "/rooms/{id}"
    description: Fetch one room (includes active_turn_task_id)
    roles: [ConferenceServicesAdmin, FacilitiesManager, HousekeepingSupervisor, FinanceOfficer, ScreeningReviewer, ClientCoordinator]
    code: 200
    input: []
    output: Room
    side_effects: []
  - method: GET
    path: "/rooms/{id}/turn-tasks"
    description: List turn tasks of a room (reverse reachability for TurnTask.room_id)
    roles: [ConferenceServicesAdmin, FacilitiesManager, HousekeepingSupervisor, FinanceOfficer, ScreeningReviewer, ClientCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: TurnTask[]
    side_effects: []
  - method: POST
    path: "/rooms/{id}/damage-assessments"
    description: Report damage found in a room, attributed to a group; computes estimate_total_cents
    roles: [FacilitiesManager, ConferenceServicesAdmin]
    code: 201
    input: [group_id, line_items]
    output: DamageAssessment
    side_effects: ["estimate_total_cents computed per damage_charge estimate variant"]
  - method: POST
    path: "/conference-groups"
    description: Create a conference group contract (initial status DRAFT)
    roles: [ConferenceServicesAdmin]
    code: 201
    input: [building_id, client_name, contact_email, arrival_date, departure_date, "has_minor_participants?", "linen_tier?", contracted_bed_count, "deposit_paid_cents?"]
    output: ConferenceGroup
    side_effects: []
  - method: GET
    path: "/conference-groups"
    description: List conference groups; building_id? filter gives reverse reachability for ConferenceGroup.building_id
    roles: [ConferenceServicesAdmin, FacilitiesManager, HousekeepingSupervisor, FinanceOfficer]
    code: 200
    input: ["building_id?", "status?", "limit?", "offset?"]
    output: ConferenceGroup[]
    side_effects: []
  - method: GET
    path: "/conference-groups/{id}"
    description: Fetch one group (ClientCoordinator may fetch only own group)
    roles: [ConferenceServicesAdmin, FacilitiesManager, HousekeepingSupervisor, FinanceOfficer, ClientCoordinator]
    code: 200
    input: []
    output: ConferenceGroup
    side_effects: []
  - method: POST
    path: "/conference-groups/{id}/record-deposit"
    description: Increment deposit_paid_cents
    roles: [FinanceOfficer, ConferenceServicesAdmin]
    code: 200
    input: [amount_cents]
    output: ConferenceGroup
    side_effects: ["deposit_paid_cents += amount_cents", "ConferenceGroup.version += 1"]
  - method: POST
    path: "/conference-groups/{id}/participants"
    description: Add a participant (allowed while group in DRAFT, RETURNED, SUBMITTED, or CONFIRMED)
    roles: [ClientCoordinator, ConferenceServicesAdmin]
    code: 201
    input: [full_name, date_of_birth, role_in_group]
    output: Participant
    side_effects: ["is_minor computed from date_of_birth at group arrival_date", "ConferenceGroup.version += 1"]
  - method: GET
    path: "/conference-groups/{id}/participants"
    description: List participants of a group (reverse reachability for Participant.group_id)
    roles: [ConferenceServicesAdmin, FacilitiesManager, HousekeepingSupervisor, FinanceOfficer, ScreeningReviewer, ClientCoordinator]
    code: 200
    input: ["role_in_group?", "limit?", "offset?"]
    output: Participant[]
    side_effects: []
  - method: GET
    path: "/participants/{id}"
    description: Fetch one participant
    roles: [ConferenceServicesAdmin, FacilitiesManager, HousekeepingSupervisor, FinanceOfficer, ScreeningReviewer, ClientCoordinator]
    code: 200
    input: []
    output: Participant
    side_effects: []
  - method: POST
    path: "/conference-groups/{id}/rooming-list-revisions"
    description: "Create a new rooming list revision (OCC-guarded). Creates StayAssignments (RESERVED), supersedes the prior ACTIVE revision, runs overlap/turn-gap/capacity checks per assignment"
    roles: [ClientCoordinator, ConferenceServicesAdmin]
    code: 201
    input: [expected_conference_group_version, assignments]
    output: RoomingListRevision
    side_effects:
      - "OCC check on ConferenceGroup.version; ConferenceGroup.version += 1 on success"
      - "prior ACTIVE revision -> SUPERSEDED and its RESERVED assignments -> CANCELLED with room/building counter updates BEFORE the new assignments are validated (so a superseding revision never collides with the assignments it replaces)"
      - "new StayAssignments created RESERVED; Room RELEASED/READY -> RESERVED where first active assignment lands"
      - "Building.reserved_bed_count += new assignment count; available_bed_count recomputed; Building.version += 1"
      - "if group CONFIRMED: provisional invoice bed-night subtotal recomputed"
  - method: GET
    path: "/conference-groups/{id}/rooming-list-revisions"
    description: List revisions of a group (reverse reachability for RoomingListRevision.group_id)
    roles: [ConferenceServicesAdmin, FacilitiesManager, FinanceOfficer, ClientCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RoomingListRevision[]
    side_effects: []
  - method: POST
    path: "/conference-groups/{id}/submit"
    description: DRAFT/RETURNED -> SUBMITTED; requires at least 1 participant
    roles: [ClientCoordinator, ConferenceServicesAdmin]
    code: 200
    input: []
    output: ConferenceGroup
    side_effects: ["ConferenceGroup.version += 1"]
  - method: POST
    path: "/conference-groups/{id}/return-for-revision"
    description: SUBMITTED -> RETURNED (revision loop)
    roles: [ConferenceServicesAdmin]
    code: 200
    input: []
    output: ConferenceGroup
    side_effects: ["ConferenceGroup.version += 1"]
  - method: POST
    path: "/conference-groups/{id}/confirm"
    description: SUBMITTED -> CONFIRMED; runs safety (chaperone ratio, screening) then fiscal (deposit) checks; creates PROVISIONAL invoice
    roles: [ConferenceServicesAdmin]
    code: 200
    input: []
    output: ConferenceGroup
    side_effects: ["Invoice(PROVISIONAL) created; provisional_invoice_id set", "ConferenceGroup.version += 1"]
  - method: POST
    path: "/conference-groups/{id}/cancel"
    description: Cancel from DRAFT/SUBMITTED/RETURNED/CONFIRMED; tiered fee from CONFIRMED; cascades assignments -> rooms -> building counters; voids provisional invoice
    roles: [ClientCoordinator, ConferenceServicesAdmin]
    code: 200
    input: []
    output: ConferenceGroup
    side_effects: ["assignments RESERVED -> CANCELLED", "rooms -> RELEASED where emptied", "building counters updated", "Invoice PROVISIONAL -> VOID", "ConferenceGroup.version += 1"]
  - method: POST
    path: "/conference-groups/{id}/close-out"
    description: IN_HOUSE -> DEPARTED; requires all assignments terminal
    roles: [ConferenceServicesAdmin]
    code: 200
    input: []
    output: ConferenceGroup
    side_effects: ["ConferenceGroup.version += 1"]
  - method: GET
    path: "/stay-assignments"
    description: List stay assignments with FK filters (reverse reachability for revision_id, group_id, room_id, participant_id)
    roles: [ConferenceServicesAdmin, FacilitiesManager, HousekeepingSupervisor, FinanceOfficer, ClientCoordinator]
    code: 200
    input: ["revision_id?", "group_id?", "room_id?", "participant_id?", "status?", "limit?", "offset?"]
    output: StayAssignment[]
    side_effects: []
  - method: POST
    path: "/stay-assignments/{id}/check-in"
    description: RESERVED -> CHECKED_IN; requires group CONFIRMED/IN_HOUSE, building TURN_ACTIVE, room RESERVED/OCCUPIED, clock inside [checkin_at, checkout_at)
    roles: [ConferenceServicesAdmin]
    code: 200
    input: []
    output: StayAssignment
    side_effects: ["actual_checkin_at := now", "Room -> OCCUPIED on first occupant", "ConferenceGroup CONFIRMED -> IN_HOUSE on first check-in", "StayAssignment.version += 1"]
  - method: POST
    path: "/stay-assignments/{id}/check-out"
    description: CHECKED_IN -> CHECKED_OUT; last checkout flips room to NEEDS_TURN and spawns a TurnTask
    roles: [ConferenceServicesAdmin]
    code: 200
    input: []
    output: StayAssignment
    side_effects: ["actual_checkout_at := now", "building bed counters updated", "Room -> NEEDS_TURN + TurnTask created + scheduled_turn_count += 1 when room empties", "StayAssignment.version += 1"]
  - method: POST
    path: "/stay-assignments/{id}/mark-no-show"
    description: RESERVED -> NO_SHOW; only after checkin_at + 24h
    roles: [ConferenceServicesAdmin]
    code: 200
    input: []
    output: StayAssignment
    side_effects: ["building bed counters updated", "Room -> RELEASED if emptied", "StayAssignment.version += 1"]
  - method: POST
    path: "/stay-assignments/{id}/cancel"
    description: RESERVED -> CANCELLED (single assignment)
    roles: [ClientCoordinator, ConferenceServicesAdmin]
    code: 200
    input: []
    output: StayAssignment
    side_effects: ["building bed counters updated", "Room -> RELEASED if emptied", "StayAssignment.version += 1"]
  - method: POST
    path: "/turn-tasks/{id}/start"
    description: SCHEDULED/FAILED -> IN_PROGRESS; flips room NEEDS_TURN -> IN_TURN
    roles: [HousekeepingSupervisor, ConferenceServicesAdmin]
    code: 200
    input: []
    output: TurnTask
    side_effects: ["Room NEEDS_TURN -> IN_TURN", "TurnTask.version += 1"]
  - method: POST
    path: "/turn-tasks/{id}/submit-for-inspection"
    description: IN_PROGRESS -> READY_FOR_INSPECTION
    roles: [HousekeepingSupervisor, ConferenceServicesAdmin]
    code: 200
    input: []
    output: TurnTask
    side_effects: ["TurnTask.version += 1"]
  - method: POST
    path: "/turn-tasks/{id}/inspect"
    description: READY_FOR_INSPECTION -> PASSED or FAILED; rework_count >= 2 restricts to ConferenceServicesAdmin
    roles: [HousekeepingSupervisor, ConferenceServicesAdmin]
    code: 200
    input: [outcome, "note?"]
    output: TurnTask
    side_effects: ["PASS: Room IN_TURN -> READY, active_turn_task_id cleared, scheduled_turn_count -= 1", "FAIL: rework_count += 1", "TurnTask.version += 1"]
  - method: POST
    path: "/turn-tasks/{id}/cancel"
    description: SCHEDULED -> CANCELLED; admin override leaves room READY without cleaning
    roles: [ConferenceServicesAdmin]
    code: 200
    input: []
    output: TurnTask
    side_effects: ["Room NEEDS_TURN -> READY", "scheduled_turn_count -= 1", "TurnTask.version += 1"]
