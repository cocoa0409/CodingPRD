  # ===========================================================================
  - section: endpoints
    instances:
      - name: c_case_create_with_appointment_forces_incident_origin
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/charter/misconduct-cases
          - entities.MisconductCase.fields.origin
          - entities.MisconductCase.fields.investigator_user_id
        distinguishing_aspect: "Case creation is conditional on appointment_id: supplying one forces origin EXAM_INCIDENT (an explicit origin input is overridden by the system), records the acting Proctor as investigator, and flags the appointment — while a case without appointment_id keeps the supplied/default origin."
        test_recipe:
          setup:
            - "Clock 2027-01-05. A ENROLLED with a booked appointment."
          setup_api_calls:
            - *c_clock
            - *c_cand_a
            - *c_enroll_a
            - *c_pay_enr_a
            - *c_level1
            - *c_win1
            - *c_ctr2
            - *c_book_a
          trigger:
            - call: "POST /charter/misconduct-cases"
              payload: { candidate_id: "${cand_a}", appointment_id: "${appt_a}", allegation: "Prohibited notes in the testing room", origin: "EXTERNAL_REPORT" }
              as: Proctor
              as_user_id: "prt-7"
              captures: { case_o: $.data.id, case_origin: $.data.origin, case_inv: $.data.investigator_user_id }
            - call: "POST /charter/misconduct-cases"
              payload: { candidate_id: "${cand_a}", allegation: "Employer complaint" }
              as: ConductInvestigator
              as_user_id: "inv-1"
              captures: { case_o2: $.data.id, case_origin2: $.data.origin }
          assert:
            - "case_origin == EXAM_INCIDENT (appointment-linked; the supplied EXTERNAL_REPORT was overridden) and case_inv == \"prt-7\""
            - "ExamAppointment.${appt_a}.compliance_status == POLICY_FLAGGED"
            - "case_origin2 == EXTERNAL_REPORT (default kept when no appointment_id)"
            - "GET /charter/misconduct-cases?appointment_id=${appt_a} returns exactly 1 row"

      - name: c_membership_read_surfaces_computed_ce_fields
        claim_type: Computed read
        grounds:
          - endpoints.GET_/charter/memberships
          - entities.SocietyMembership.fields.ce_standing_met
        excluded_because:
          difficulty_instance: ce_standing_calendar_vs_rolling_diverge
          rationale: "The membership read surface carries calendar_year_credits / rolling_12m_credits / ce_standing_met and is asserted in the named §1.8 instance."
