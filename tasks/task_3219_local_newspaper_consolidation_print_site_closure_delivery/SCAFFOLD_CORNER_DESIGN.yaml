              as: PrintOperationsDirector
              captures: { mkt_riv_id: $.data.id }
            - call: "POST /regional-news-ops/regions/${reg_n_id}/print-markets"
              payload: { name: "Fallow", per_copy_revenue_cents: 45, daily_route_cost_ceiling_cents: 9000, weighted_demand_units: 6000, print_edition_per_week: 7, guaranteed_floor_copies: 8000 }
              as: PrintOperationsDirector
