            - { call: "POST /econsult/specialist-availability-windows", payload: { membership_id: "${memb_id}", window_start: "2026-05-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }, as: Specialist, as_user_id: "${spec_id}" }
            - { call: "POST /econsult/consult-requests", payload: { patient_ref: "PAT-PP1", specialty_track_id: "${track_id}", question_text: "Rheumatoid flare on methotrexate; asks about short prednisone bridge and infection screening.", icd10_primary: "M06", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { cons_id: $.data.id } }
            - { call: "POST /econsult/consult-requests/${cons_id}/responses", payload: { disposition: "MANAGE_WITH_PLAN", recommendation_text: "Prednisone 20mg daily x7 days with taper; screen HBV/HCV before any biologic escalation." }, as: Specialist, as_user_id: "${spec_id}", captures: { resp_id: $.data.id } }
            - { call: "POST /econsult/consult-requests/${cons_id}/billing-claims", as: BillingClerk, captures: { claim_id: $.data.id, claim_amt: $.data.amount_cents } }
          trigger:
            - { call: "POST /econsult/billing-claims/${claim_id}/submit", as: BillingClerk, captures: { err_first: $.data.error_id } }
            - { call: "POST /econsult/consult-responses/${resp_id}/documentation", payload: { record_type: "PCP_NOTE" }, as: ReferringProvider, as_user_id: "${prov_id}" }
            - { call: "POST /econsult/consult-responses/${resp_id}/documentation", payload: { record_type: "SPECIALIST_NOTE" }, as: Specialist, as_user_id: "${spec_id}" }
            - { call: "POST /econsult/consult-responses/${resp_id}/finalize", as: Specialist, as_user_id: "${spec_id}" }
            - { call: "POST /econsult/billing-claims/${claim_id}/submit", as: BillingClerk, captures: { err_second: $.data.error_id } }
          assert:
