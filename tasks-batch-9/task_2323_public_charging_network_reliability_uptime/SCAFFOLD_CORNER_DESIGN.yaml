              payload: { station_id: "${st_id}", connector_type: "CCS1", rated_power_kw: 150.00, dispenser_serial: "DS-1", terminal_model: "PT-4" }
              as: NetworkOperator
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: NetworkOperator
          trigger:
            - call: "POST /customer-complaints"
              payload: { station_id: "${st_id}", port_id: "${p_id}", complaint_type: "BLOCKED_STALL", session_started_at: "2026-08-01T10:30:00Z", session_ended_at: "2026-08-01T10:00:00Z", session_energy_kwh: 0.000, session_price_per_kwh_cents: 40, session_charged_cents: 500 }
              as: CustomerSupportAgent
              captures: { err1: $.data.error_id }
            - call: "POST /customer-complaints"
              payload: { station_id: "${st_id}", port_id: "${p_id}", complaint_type: "BLOCKED_STALL", session_started_at: "2026-08-01T10:00:00Z", session_ended_at: "2026-08-01T10:30:00Z", session_energy_kwh: 0.000, session_price_per_kwh_cents: 40, session_charged_cents: 500, session_idle_fee_cents: 600 }
              as: CustomerSupportAgent
              captures: { err2: $.data.error_id }
            - call: "POST /customer-complaints"
              payload: { station_id: "${st_id}", port_id: "${p_id}", complaint_type: "BLOCKED_STALL", session_started_at: "2026-08-01T10:00:00Z", session_ended_at: "2026-08-01T10:30:00Z", session_energy_kwh: 0.000, session_price_per_kwh_cents: 40, session_charged_cents: 500, session_idle_fee_cents: 500 }
              as: CustomerSupportAgent
              captures: { c_id: $.data.id }
            - call: "POST /customer-complaints/${c_id}/triage"
              payload: { disposition: "NO_FAULT" }
              as: CustomerSupportAgent
          assert:
            - "call 1: HTTP status == 422 and data.error_id == \"ERR_SESSION_WINDOW_INVALID\""
            - "call 2: HTTP status == 422 and data.error_id == \"ERR_SESSION_CHARGE_INVALID\""
            - "call 3: HTTP status == 201 with session_idle_fee_cents == 500 exactly equal to session_charged_cents, state == INTAKE, refund_state == NONE"
            - "call 4: HTTP status == 200 and CustomerComplaint.${c_id}.state == DISMISSED (a NO_FAULT triage bypasses TRIAGED entirely, so no refund can ever be requested on this complaint)"
            - "GET /customer-complaints?station_id=${st_id} has total_count 1 — the two rejected intakes created nothing"

  # ===========================================================================
  # SECTION 5 — Endpoints (§1.5), 57 endpoints
  # ===========================================================================
  - section: endpoints
    instances:

      - name: patching_port_interoperability_flags_rescores_the_station_only
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /charging-ports/{port_id}]
          - calculations.payment_interoperability_score
        distinguishing_aspect: "PATCH accepts only the four interoperability flags, so the write must recompute the station score while leaving service_state, maintenance_state and terminal_certification_status alone. Enabling contactless on the weaker port lifts the score 70.00 -> 90.00, and a follow-up PATCH that upgrades that port's OCPI version to V2_2_1 must NOT move it again, because roaming compliance also needs a CERTIFIED terminal."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; Station ST-1 in DRAFT (PATCH has no station-state precondition)."
            - "DS-1: contactless, plug-and-charge, price display verified, CERTIFIED, OCPI V2_2_1."
            - "DS-2: plug-and-charge and price display verified only, terminal_certification_status PENDING, OCPI V2_1_1."
          setup_api_calls:
            - call: "POST /host-sites"
              payload: { site_code: "HS-1", host_org_name: "Alder Court Retail", committed_service_capacity_kw: 400.00, agreement_status: "EXECUTED", power_upgrade_status: "ENERGIZED", parking_enforcement_mode: "TOWING_ENFORCED" }
              as: NetworkOperator
              captures: { site_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-1", power_class: "DCFC_150", declared_port_count: 2 }
              as: NetworkOperator
              captures: { st_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st_id}", connector_type: "CCS1", rated_power_kw: 150.00, dispenser_serial: "DS-1", terminal_model: "PT-9", contactless_enabled: true, plug_and_charge_enabled: true, price_display_verified: true, roaming_ocpi_version: "V2_2_1" }
              as: NetworkOperator
              captures: { p1_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st_id}", connector_type: "NACS", rated_power_kw: 150.00, dispenser_serial: "DS-2", terminal_model: "PT-3", plug_and_charge_enabled: true, price_display_verified: true, roaming_ocpi_version: "V2_1_1" }
              as: NetworkOperator
              captures: { p2_id: $.data.id }
            - call: "POST /charging-ports/${p1_id}/terminal-certification"
              payload: { certification_status: "CERTIFIED" }
              as: ComplianceAuditor
          trigger:
            - call: "PATCH /charging-ports/${p2_id}"
              payload: { contactless_enabled: true }
              as: NetworkOperator
            - call: "PATCH /charging-ports/${p2_id}"
              payload: { roaming_ocpi_version: "V2_2_1" }
              as: NetworkOperator
          assert:
            - "before the trigger: Station.${st_id}.payment_interop_score == 70.00 (contactless 1/2, plug-and-charge 2/2, display 2/2, roaming 1/2)"
            - "call 1: HTTP status == 200, ChargingPort.${p2_id}.contactless_enabled == true, version incremented, and Station.${st_id}.payment_interop_score == 90.00"
            - "call 1 left ChargingPort.${p2_id}.service_state == IN_SERVICE, maintenance_state == NONE and terminal_certification_status == PENDING"
            - "call 2: HTTP status == 200, roaming_ocpi_version == V2_2_1, but Station.${st_id}.payment_interop_score is still 90.00 because roaming compliance requires terminal_certification_status == CERTIFIED as well"
            - "Station.${st_id}.commissioned_port_count == 2 and installed_power_kw == 300.00 are unaffected by either PATCH"

      - name: dispatch_listing_filters_by_port_and_state_and_paginates
        claim_type: filtered_listing
        grounds:
          - endpoints[GET /maintenance-dispatches]
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three dispatches across two ports in two different states let the filters be checked in combination rather than one at a time: total_count must describe the filtered set (not the table), and limit/offset must page inside it. The default page size of 10 must not hide the has_more boundary that limit 1 exposes."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "HostSite / Station ST-1 OPERATIONAL with two CERTIFIED ports DS-1 and DS-2."
            - "DS-1 carries two CLASSIFIED MINOR outages with non-overlapping dispatch windows; DS-2 carries one, whose dispatch is advanced to EN_ROUTE."
          setup_api_calls:
            - call: "POST /host-sites"
              payload: { site_code: "HS-1", host_org_name: "Alder Court Retail", committed_service_capacity_kw: 800.00, agreement_status: "EXECUTED", power_upgrade_status: "ENERGIZED", parking_enforcement_mode: "TOWING_ENFORCED" }
              as: NetworkOperator
              captures: { site_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-1", power_class: "DCFC_150", declared_port_count: 2 }
              as: NetworkOperator
              captures: { st_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st_id}", connector_type: "CCS1", rated_power_kw: 150.00, dispenser_serial: "DS-1", terminal_model: "PT-9", contactless_enabled: true, plug_and_charge_enabled: true, price_display_verified: true, roaming_ocpi_version: "V2_2_1" }
              as: NetworkOperator
              captures: { p1_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st_id}", connector_type: "NACS", rated_power_kw: 150.00, dispenser_serial: "DS-2", terminal_model: "PT-9", contactless_enabled: true, plug_and_charge_enabled: true, price_display_verified: true, roaming_ocpi_version: "V2_2_1" }
              as: NetworkOperator
              captures: { p2_id: $.data.id }
            - call: "POST /charging-ports/${p1_id}/terminal-certification"
              payload: { certification_status: "CERTIFIED" }
              as: ComplianceAuditor
            - call: "POST /charging-ports/${p2_id}/terminal-certification"
              payload: { certification_status: "CERTIFIED" }
              as: ComplianceAuditor
            - call: "POST /stations/${st_id}/status-transitions"
              payload: { target_status: "COMMISSIONING" }
              as: NetworkOperator
            - call: "POST /stations/${st_id}/commission"
              payload: {}
              as: NetworkOperator
            - call: "POST /outage-events"
              payload: { port_id: "${p1_id}", fault_code: "OCPP-MIN-01", fault_class: "MINOR", detected_at: "2026-08-01T00:00:00Z" }
              as: NetworkOperator
              captures: { o1_id: $.data.id }
            - call: "POST /outage-events/${o1_id}/classify"
              payload: { fault_class: "MINOR" }
              as: NetworkOperator
            - call: "POST /outage-events"
              payload: { port_id: "${p1_id}", fault_code: "OCPP-MIN-02", fault_class: "MINOR", detected_at: "2026-08-01T00:00:00Z" }
              as: NetworkOperator
              captures: { o2_id: $.data.id }
            - call: "POST /outage-events/${o2_id}/classify"
              payload: { fault_class: "MINOR" }
              as: NetworkOperator
            - call: "POST /outage-events"
              payload: { port_id: "${p2_id}", fault_code: "OCPP-MIN-03", fault_class: "MINOR", detected_at: "2026-08-01T00:00:00Z" }
              as: NetworkOperator
              captures: { o3_id: $.data.id }
            - call: "POST /outage-events/${o3_id}/classify"
              payload: { fault_class: "MINOR" }
              as: NetworkOperator
            - call: "POST /maintenance-dispatches"
              payload: { outage_event_id: "${o1_id}", port_id: "${p1_id}", technician_user_id: "tech-1", technician_certification_class: "DCFC_BASIC", window_start_at: "2026-08-01T01:00:00Z", window_end_at: "2026-08-01T03:00:00Z" }
              as: NetworkOperator
              captures: { d1_id: $.data.id }
            - call: "POST /maintenance-dispatches"
              payload: { outage_event_id: "${o2_id}", port_id: "${p1_id}", technician_user_id: "tech-2", technician_certification_class: "DCFC_BASIC", window_start_at: "2026-08-01T03:00:00Z", window_end_at: "2026-08-01T05:00:00Z" }
              as: NetworkOperator
              captures: { d2_id: $.data.id }
            - call: "POST /maintenance-dispatches"
              payload: { outage_event_id: "${o3_id}", port_id: "${p2_id}", technician_user_id: "tech-3", technician_certification_class: "DCFC_BASIC", window_start_at: "2026-08-01T01:00:00Z", window_end_at: "2026-08-01T05:00:00Z" }
              as: NetworkOperator
              captures: { d3_id: $.data.id }
            - call: "POST /maintenance-dispatches/${d3_id}/progress"
              payload: { event: "EN_ROUTE" }
              as: FieldTechnician
              as_user_id: "tech-3"
          trigger:
            - call: "GET /maintenance-dispatches"
              payload: { port_id: "${p1_id}", state: "CREATED", limit: 1, offset: 0 }
              as: ProgramAdministrator
            - call: "GET /maintenance-dispatches"
              payload: { port_id: "${p1_id}", state: "CREATED", limit: 1, offset: 1 }
              as: ProgramAdministrator
            - call: "GET /maintenance-dispatches"
              payload: { state: "EN_ROUTE" }
              as: ProgramAdministrator
            - call: "GET /maintenance-dispatches"
              payload: { technician_user_id: "tech-9" }
              as: ProgramAdministrator
          assert:
            - "call 1: 1 row (${d1_id}), total_count == 2, has_more == true"
            - "call 2: 1 row (${d2_id}), total_count == 2, has_more == false"
            - "call 3: 1 row (${d3_id}), total_count == 1 — the state filter crosses ports"
            - "call 4: 0 rows, total_count == 0, has_more == false, and the envelope is still response_type array with a data list, not an error"
            - "GET /maintenance-dispatches with no filters returns total_count == 3"

      - name: clock_endpoint_stamps_subsequent_writes_and_leaves_earlier_rows_alone
        claim_type: computed_read
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - entities.HostSite.common_fields
        distinguishing_aspect: "The logical clock is the only time source: a row created before the jump keeps its original created_at while its updated_at moves on the later PATCH, and a row created after the jump carries the new instant in both. This is what makes every deadline, cleared_at and promised_repair_at assertion in this design reproducible."
        test_recipe:
          setup:
            - "Logical clock at its 2026-08-01T00:00:00Z default; empty database."
          setup_api_calls:
            - call: "POST /host-sites"
              payload: { site_code: "HS-1", host_org_name: "Alder Court Retail", committed_service_capacity_kw: 400.00, agreement_status: "EXECUTED", power_upgrade_status: "ENERGIZED", parking_enforcement_mode: "TOWING_ENFORCED" }
              as: NetworkOperator
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T08:30:00Z" }
              as: ComplianceAuditor
            - call: "POST /host-sites"
              payload: { site_code: "HS-2", host_org_name: "Birch Plaza", committed_service_capacity_kw: 250.00 }
              as: NetworkOperator
              captures: { site2_id: $.data.id }
            - call: "PATCH /host-sites/${site_id}"
              payload: { committed_service_capacity_kw: 500.00 }
              as: NetworkOperator
          assert:
            - "HostSite.${site_id}.created_at == \"2026-08-01T00:00:00Z\" both before and after the clock jump"
            - "call 2: HostSite.${site2_id}.created_at == \"2026-09-15T08:30:00Z\" and updated_at == \"2026-09-15T08:30:00Z\" and version == 1"
            - "call 3: HostSite.${site_id}.updated_at == \"2026-09-15T08:30:00Z\" while created_at is still \"2026-08-01T00:00:00Z\", and version == 2"
            - "the clock endpoint is available to every role — it is invoked here as ComplianceAuditor and elsewhere as NetworkOperator"
            - "HostSite.${site2_id} shows the declared defaults: agreement_status DRAFT, power_upgrade_status REQUESTED, access_hours_mode TWENTY_FOUR_SEVEN, parking_enforcement_mode NONE, station_count 0"

      - name: sub_resource_listings_are_scoped_to_the_parent_in_the_path
        claim_type: cross_reference_link
        grounds:
          - endpoints[GET /stations/{id}/charging-ports]
          - endpoints[GET /host-sites/{id}/stations]
          - complexity_profile.entity_topology
        distinguishing_aspect: "Two stations under one host site each own one port, and a third station lives under a second host site. The nested listings must partition the rows by the parent in the path rather than returning every row of the child table, and the service_state filter must compose with that scoping instead of replacing it."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "HostSite HS-1 with stations ST-1 (port DS-1, taken OUT_OF_SERVICE by a MAJOR fault) and ST-2 (port DS-2, IN_SERVICE)."
            - "HostSite HS-2 with station ST-3 (no ports)."
          setup_api_calls:
            - call: "POST /host-sites"
              payload: { site_code: "HS-1", host_org_name: "Alder Court Retail", committed_service_capacity_kw: 800.00, agreement_status: "EXECUTED", power_upgrade_status: "ENERGIZED", parking_enforcement_mode: "TOWING_ENFORCED" }
              as: NetworkOperator
              captures: { site1_id: $.data.id }
            - call: "POST /host-sites"
              payload: { site_code: "HS-2", host_org_name: "Birch Plaza", committed_service_capacity_kw: 250.00, agreement_status: "EXECUTED", power_upgrade_status: "ENERGIZED", parking_enforcement_mode: "SIGNAGE_ONLY" }
              as: NetworkOperator
              captures: { site2_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site1_id}", station_code: "ST-1", power_class: "DCFC_150", declared_port_count: 1 }
              as: NetworkOperator
              captures: { st1_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site1_id}", station_code: "ST-2", power_class: "DCFC_150", declared_port_count: 1 }
              as: NetworkOperator
              captures: { st2_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site2_id}", station_code: "ST-3", power_class: "L2_19", declared_port_count: 1 }
              as: NetworkOperator
              captures: { st3_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st1_id}", connector_type: "CCS1", rated_power_kw: 150.00, dispenser_serial: "DS-1", terminal_model: "PT-4" }
              as: NetworkOperator
              captures: { p1_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st2_id}", connector_type: "NACS", rated_power_kw: 150.00, dispenser_serial: "DS-2", terminal_model: "PT-4" }
              as: NetworkOperator
              captures: { p2_id: $.data.id }
            - call: "POST /outage-events"
              payload: { port_id: "${p1_id}", fault_code: "EVSE-MAJ-11", fault_class: "MAJOR", detected_at: "2026-08-01T00:00:00Z" }
              as: NetworkOperator
              captures: { o1_id: $.data.id }
          trigger:
            - call: "GET /host-sites/${site1_id}/stations"
              payload: {}
              as: HostSiteManager
              as_user_id: "${site1_id}"
            - call: "GET /stations/${st1_id}/charging-ports"
              payload: { service_state: "IN_SERVICE" }
              as: NetworkOperator
            - call: "GET /stations/${st2_id}/charging-ports"
              payload: {}
              as: NetworkOperator
            - call: "GET /charging-ports/${p2_id}/outage-events"
              payload: {}
              as: FieldTechnician
          assert:
            - "call 1: 2 rows (${st1_id} and ${st2_id}), total_count == 2 — ST-3 belongs to the other host site"
            - "call 2: 0 rows, total_count == 0 — DS-1 exists under ST-1 but is OUT_OF_SERVICE, so the filter composes with the scoping"
            - "GET /stations/${st1_id}/charging-ports with no filter returns 1 row (${p1_id})"
            - "call 3: 1 row (${p2_id}), total_count == 1"
            - "call 4: 0 rows — the MAJOR outage ${o1_id} hangs off DS-1, not DS-2"
            - "HostSite.${site1_id}.station_count == 2 and HostSite.${site2_id}.station_count == 1"

      - name: consuming_a_reservation_draws_the_parts_out_of_on_hand_stock
        claim_type: conditional_action
        grounds:
          - endpoints[POST /part-reservations/{reservation_id}/disposition]
          - state_machines.PartReservation.transitions.RESERVED_to_CONSUMED
          - entities.SparePart.fields.consumed_qty_lifetime
        distinguishing_aspect: "CONSUME is only legal while the dispatch is ON_SITE or PARTS_HOLD, and its stock arithmetic differs from RELEASE in a way that is easy to get wrong: on_hand and reserved both drop by qty so unencumbered_qty stays put at 6, while consumed_qty_lifetime rises. Attempting the same action from a CREATED dispatch must be refused."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "HostSite / Station ST-1 OPERATIONAL / one CERTIFIED port DS-1."
            - "SparePart SP-1 (DISPENSER, lead_time_days 3) restocked to 10."
            - "A CLASSIFIED MAJOR outage with a dispatch that holds a qty-4 RESERVED reservation."
          setup_api_calls:
            - call: "POST /host-sites"
              payload: { site_code: "HS-1", host_org_name: "Alder Court Retail", committed_service_capacity_kw: 400.00, agreement_status: "EXECUTED", power_upgrade_status: "ENERGIZED", parking_enforcement_mode: "TOWING_ENFORCED" }
              as: NetworkOperator
              captures: { site_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-1", power_class: "DCFC_150", declared_port_count: 1 }
              as: NetworkOperator
              captures: { st_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st_id}", connector_type: "CCS1", rated_power_kw: 150.00, dispenser_serial: "DS-1", terminal_model: "PT-9", contactless_enabled: true, plug_and_charge_enabled: true, price_display_verified: true, roaming_ocpi_version: "V2_2_1" }
              as: NetworkOperator
              captures: { p_id: $.data.id }
            - call: "POST /charging-ports/${p_id}/terminal-certification"
              payload: { certification_status: "CERTIFIED" }
              as: ComplianceAuditor
            - call: "POST /stations/${st_id}/status-transitions"
              payload: { target_status: "COMMISSIONING" }
              as: NetworkOperator
            - call: "POST /stations/${st_id}/commission"
              payload: {}
              as: NetworkOperator
            - call: "POST /spare-parts"
              payload: { part_number: "SP-1", part_class: "DISPENSER", lead_time_days: 3 }
              as: NetworkOperator
              captures: { sp_id: $.data.id }
            - call: "POST /spare-parts/${sp_id}/restock"
              payload: { qty: 10 }
              as: NetworkOperator
              captures: { sp_ver: $.data.version }
            - call: "POST /outage-events"
              payload: { port_id: "${p_id}", fault_code: "EVSE-MAJ-11", fault_class: "MAJOR", detected_at: "2026-08-01T00:00:00Z" }
              as: NetworkOperator
              captures: { o_id: $.data.id }
            - call: "POST /outage-events/${o_id}/classify"
              payload: { fault_class: "MAJOR" }
              as: NetworkOperator
            - call: "POST /maintenance-dispatches"
              payload: { outage_event_id: "${o_id}", port_id: "${p_id}", technician_user_id: "tech-1", technician_certification_class: "DCFC_BASIC", window_start_at: "2026-08-01T01:00:00Z", window_end_at: "2026-08-01T09:00:00Z" }
              as: NetworkOperator
              captures: { d_id: $.data.id }
            - call: "POST /part-reservations"
              payload: { dispatch_id: "${d_id}", spare_part_id: "${sp_id}", qty: 4, expected_spare_part_version: "${sp_ver}" }
              as: NetworkOperator
              captures: { pr_id: $.data.id }
          trigger:
            - call: "POST /part-reservations/${pr_id}/disposition"
              payload: { action: "CONSUME" }
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { err: $.data.error_id }
            - call: "POST /maintenance-dispatches/${d_id}/progress"
              payload: { event: "EN_ROUTE" }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /maintenance-dispatches/${d_id}/progress"
              payload: { event: "ARRIVE" }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /part-reservations/${pr_id}/disposition"
              payload: { action: "CONSUME" }
              as: FieldTechnician
              as_user_id: "tech-1"
          assert:
            - "before the trigger: SparePart.${sp_id}.on_hand_qty == 10, reserved_qty == 4, unencumbered_qty == 6, consumed_qty_lifetime == 0"
            - "call 1: HTTP status == 409 and data.error_id == \"ERR_INVALID_STATE\" — the dispatch is still CREATED, so CONSUME is not yet legal"
            - "after call 1 the stock counters are untouched"
            - "call 4: HTTP status == 200, PartReservation.${pr_id}.state == CONSUMED"
            - "SparePart.${sp_id}.on_hand_qty == 6, reserved_qty == 0, unencumbered_qty == 6 (unchanged), consumed_qty_lifetime == 4, backordered_qty == 0"
            - "the invariant on_hand_qty == unencumbered_qty + reserved_qty holds before (10 == 6 + 4) and after (6 == 6 + 0)"

      - name: commission_endpoint_runs_its_declared_side_effects
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /stations/{station_id}/commission]
        excluded_because:
          difficulty_instance: station_commission_blocked_until_host_site_agreement_is_executed
          rationale: "That §1.8 instance drives this endpoint through a rejection and then a success, asserting commissioned_at, the OPERATIONAL status and the recomputed station roll-ups on the accepted call."

  # ===========================================================================
  # SECTION 6 — Errors (§1.6), 57 error ids; every id must be triggerable
  # ===========================================================================
  - section: errors
    instances:

      - name: request_without_identity_headers_is_rejected_before_every_other_check
        claim_type: error_triggerability
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority 1]
        distinguishing_aspect: "Priority 1 outranks even existence: a request that is missing X-User-Role, carries an empty X-User-ID or names a role outside the six declared ones must return 401 ERR_UNAUTHENTICATED even when the path id is also bogus and the payload is also malformed, so the auth gate cannot be implemented after body parsing."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one HostSite HS-1 exists."
            - "The four trigger calls are issued with, respectively: no X-User-Role header at all; X-User-Role: NetworkOperator with an empty X-User-ID; X-User-Role: SiteInspector (not one of the six declared roles); and no headers at all against a non-existent id."
          setup_api_calls:
            - call: "POST /host-sites"
              payload: { site_code: "HS-1", host_org_name: "Alder Court Retail", committed_service_capacity_kw: 400.00 }
              as: NetworkOperator
              captures: { site_id: $.data.id }
          trigger:
            - call: "GET /host-sites/${site_id}"
              payload: {}
              captures: { err: $.data.error_id }
            - call: "POST /host-sites"
              payload: { site_code: "HS-2", host_org_name: "Birch Plaza", committed_service_capacity_kw: 250.00 }
              captures: { err2: $.data.error_id }
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-1", power_class: "DCFC_150", declared_port_count: 1 }
              captures: { err3: $.data.error_id }
            - call: "GET /host-sites/hs-does-not-exist"
              payload: {}
              captures: { err4: $.data.error_id }
          assert:
            - "call 1 (X-User-Role header absent): HTTP status == 401 and data.error_id == \"ERR_UNAUTHENTICATED\""
            - "call 2 (X-User-Role present, X-User-ID empty): HTTP status == 401 and data.error_id == \"ERR_UNAUTHENTICATED\", and no HostSite HS-2 was created"
            - "call 3 (X-User-Role: SiteInspector, an undeclared role): HTTP status == 401 ERR_UNAUTHENTICATED — an unknown role is unauthenticated, not ERR_UNAUTHORIZED (403)"
            - "call 4 (no headers, unknown id): HTTP status == 401 ERR_UNAUTHENTICATED, not 404 — priority 1 beats priority 3"
            - "the error envelope is response_type == \"error\" with meta.api_request_id present on all four"
            - "GET /host-sites total_count is still 1 after the four rejected calls"

      - name: unknown_identifiers_return_entity_specific_not_found_errors
        claim_type: error_triggerability
        grounds:
          - errors[ERR_HOST_SITE_NOT_FOUND]
          - errors[ERR_STATION_NOT_FOUND]
          - errors[ERR_PORT_NOT_FOUND]
          - errors[ERR_OUTAGE_NOT_FOUND]
          - errors[ERR_DISPATCH_NOT_FOUND]
          - errors[ERR_SPARE_PART_NOT_FOUND]
          - errors[ERR_RESERVATION_NOT_FOUND]
          - errors[ERR_UPTIME_REPORT_NOT_FOUND]
          - errors[ERR_CLAIM_NOT_FOUND]
          - errors[ERR_COMPLAINT_NOT_FOUND]
        distinguishing_aspect: "Ten distinct 404 ids, one per entity, must be distinguishable rather than collapsed into a single generic ERR_NOT_FOUND — and the id must be chosen from the entity that is actually missing, including when the missing id arrives in a request body (POST /stations with a bogus host_site_id) or as the parent of a nested listing (which must 404, not return an empty page)."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; database empty apart from one HostSite HS-1 used only to prove the body-borne FK case."
          setup_api_calls:
            - call: "POST /host-sites"
              payload: { site_code: "HS-1", host_org_name: "Alder Court Retail", committed_service_capacity_kw: 400.00 }
              as: NetworkOperator
              captures: { site_id: $.data.id }
          trigger:
            - call: "GET /host-sites/hs-nope"
              payload: {}
              as: NetworkOperator
              captures: { e1: $.data.error_id }
            - call: "GET /stations/st-nope"
              payload: {}
              as: NetworkOperator
              captures: { e2: $.data.error_id }
            - call: "GET /charging-ports/p-nope"
              payload: {}
              as: NetworkOperator
              captures: { e3: $.data.error_id }
            - call: "GET /outage-events/o-nope"
              payload: {}
              as: NetworkOperator
              captures: { e4: $.data.error_id }
            - call: "GET /maintenance-dispatches/d-nope"
              payload: {}
              as: NetworkOperator
              captures: { e5: $.data.error_id }
            - call: "GET /spare-parts/sp-nope"
              payload: {}
              as: NetworkOperator
              captures: { e6: $.data.error_id }
            - call: "GET /part-reservations/pr-nope"
              payload: {}
              as: NetworkOperator
              captures: { e7: $.data.error_id }
            - call: "GET /uptime-reports/rp-nope"
              payload: {}
              as: NetworkOperator
              captures: { e8: $.data.error_id }
            - call: "GET /reimbursement-claims/cl-nope"
              payload: {}
              as: NetworkOperator
              captures: { e9: $.data.error_id }
            - call: "GET /customer-complaints/cc-nope"
              payload: {}
              as: CustomerSupportAgent
              captures: { e10: $.data.error_id }
            - call: "POST /stations"
              payload: { host_site_id: "hs-nope", station_code: "ST-1", power_class: "DCFC_150", declared_port_count: 1 }
              as: NetworkOperator
              captures: { e11: $.data.error_id }
            - call: "GET /stations/st-nope/charging-ports"
              payload: {}
              as: NetworkOperator
              captures: { e12: $.data.error_id }
            - call: "POST /uptime-reports"
              payload: { station_id: "st-nope", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: NetworkOperator
              captures: { e13: $.data.error_id }
          assert:
            - "calls 1..10 return HTTP 404 with error_id ERR_HOST_SITE_NOT_FOUND, ERR_STATION_NOT_FOUND, ERR_PORT_NOT_FOUND, ERR_OUTAGE_NOT_FOUND, ERR_DISPATCH_NOT_FOUND, ERR_SPARE_PART_NOT_FOUND, ERR_RESERVATION_NOT_FOUND, ERR_UPTIME_REPORT_NOT_FOUND, ERR_CLAIM_NOT_FOUND and ERR_COMPLAINT_NOT_FOUND respectively"
            - "call 11: HTTP 404 ERR_HOST_SITE_NOT_FOUND — the missing id came from the body, and the response is not 400 ERR_INVALID_REQUEST"
            - "call 12: HTTP 404 ERR_STATION_NOT_FOUND — a nested listing under a missing parent must 404, not return an empty data array with total_count 0"
            - "call 13: HTTP 404 ERR_STATION_NOT_FOUND, evaluated before any reporting-period temporal check (priority 3 beats priority 14)"
            - "GET /host-sites still returns exactly the one seeded row, so no partial writes leaked from calls 11 or 13"

      - name: duplicate_natural_keys_are_rejected_after_existence_but_before_state
        claim_type: error_triggerability
        grounds:
          - errors[ERR_SITE_CODE_DUPLICATE]
          - errors[ERR_STATION_CODE_DUPLICATE]
          - errors[ERR_DISPENSER_SERIAL_DUPLICATE]
          - errors[ERR_PART_NUMBER_DUPLICATE]
          - validations[priority 6]
        distinguishing_aspect: "All four natural keys are global, not parent-scoped: reusing station_code ST-1 under a *different* host site and reusing dispenser_serial DS-1 under a *different* station must both still 409. And because uniqueness sits at priority 6, a payload that is simultaneously a duplicate and points at a missing parent must surface the 404 instead."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "HostSite HS-1 with station ST-1 owning port DS-1; HostSite HS-2 with station ST-9; SparePart SP-1."
          setup_api_calls:
            - call: "POST /host-sites"
              payload: { site_code: "HS-1", host_org_name: "Alder Court Retail", committed_service_capacity_kw: 400.00 }
              as: NetworkOperator
              captures: { site1_id: $.data.id }
            - call: "POST /host-sites"
              payload: { site_code: "HS-2", host_org_name: "Birch Plaza", committed_service_capacity_kw: 250.00 }
              as: NetworkOperator
              captures: { site2_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site1_id}", station_code: "ST-1", power_class: "DCFC_150", declared_port_count: 1 }
              as: NetworkOperator
              captures: { st1_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site2_id}", station_code: "ST-9", power_class: "L2_19", declared_port_count: 1 }
              as: NetworkOperator
              captures: { st2_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st1_id}", connector_type: "CCS1", rated_power_kw: 150.00, dispenser_serial: "DS-1", terminal_model: "PT-4" }
              as: NetworkOperator
              captures: { p1_id: $.data.id }
            - call: "POST /spare-parts"
              payload: { part_number: "SP-1", part_class: "DISPENSER", lead_time_days: 3 }
              as: NetworkOperator
              captures: { sp_id: $.data.id }
          trigger:
            - call: "POST /host-sites"
              payload: { site_code: "HS-1", host_org_name: "Alder Court Retail (second agreement)", committed_service_capacity_kw: 120.00 }
              as: NetworkOperator
              captures: { e1: $.data.error_id }
            - call: "POST /stations"
              payload: { host_site_id: "${site2_id}", station_code: "ST-1", power_class: "DCFC_150", declared_port_count: 1 }
              as: NetworkOperator
              captures: { e2: $.data.error_id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st2_id}", connector_type: "CCS1", rated_power_kw: 19.20, dispenser_serial: "DS-1", terminal_model: "PT-4" }
              as: NetworkOperator
              captures: { e3: $.data.error_id }
            - call: "POST /spare-parts"
              payload: { part_number: "SP-1", part_class: "POWER_MODULE", lead_time_days: 10 }
              as: NetworkOperator
              captures: { e4: $.data.error_id }
            - call: "POST /stations"
              payload: { host_site_id: "hs-nope", station_code: "ST-1", power_class: "DCFC_150", declared_port_count: 1 }
              as: NetworkOperator
              captures: { e5: $.data.error_id }
          assert:
            - "call 1: HTTP 409 ERR_SITE_CODE_DUPLICATE"
            - "call 2: HTTP 409 ERR_STATION_CODE_DUPLICATE — station_code is global, so a different host site does not open a new namespace"
            - "call 3: HTTP 409 ERR_DISPENSER_SERIAL_DUPLICATE — dispenser_serial is global, so a different station does not open a new namespace"
            - "call 4: HTTP 409 ERR_PART_NUMBER_DUPLICATE — even though part_class and lead_time_days differ"
            - "call 5: HTTP 404 ERR_HOST_SITE_NOT_FOUND, not 409 — existence (priority 3) outranks uniqueness (priority 6)"
            - "after all five rejections: GET /host-sites total_count == 2, GET /host-sites/${site2_id}/stations total_count == 1, GET /stations/${st2_id}/charging-ports total_count == 0, GET /spare-parts total_count == 1"
            - "HostSite.${site1_id}.version, Station.${st2_id}.version and SparePart.${sp_id}.version are all still 1 — a rejected duplicate must not bump the incumbent row"

      - name: claim_line_and_triage_link_mismatches_are_rejected_by_ownership
        claim_type: error_triggerability
        grounds:
          - errors[ERR_CLAIM_LINE_PORT_MISMATCH]
          - errors[ERR_COMPLAINT_OUTAGE_MISMATCH]
          - validations[priority 13]
        distinguishing_aspect: "Both ids in each rejected call exist and are individually well-formed — only the ownership edge is wrong. A claim line item may name any port of the report's own station but not a port of a sibling station under the same host site, and triage may only link an outage that hangs off the complaint's own port. An implementation that merely checks existence passes the 404 tests and fails these."
        test_recipe:
          setup:
            - "Logical clock walked 2026-05-01 -> 2026-06-05T00:00:00Z -> 2026-07-15T00:00:00Z."
            - "HostSite HS-1 with two stations: ST-1 (port DS-1, commissioned and OPERATIONAL) and ST-2 (port DS-2, still DRAFT)."
            - "A CLASSIFIED MAJOR outage O2 on DS-2, and a complaint filed against ST-1 / DS-1."
            - "An ACCEPTED UptimeReport on ST-1 for 2026-06-01 .. 2026-07-01 with no outages on DS-1, so uptime_pct == 100.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T00:00:00Z" }
              as: NetworkOperator
            - call: "POST /host-sites"
