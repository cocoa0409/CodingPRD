        test_recipe:
          setup: ["A routed request's WorkOrder assigned once (version advances); a second assign carries the pre-assign version."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: SystemAdmin
            - call: "POST /departments"
