            - { call: "POST /dock-tickets", payload: { vessel_id: "${v_id}", catch_area_id: "${ca_id}", landing_start_at: "2026-08-01T06:00:00Z", landing_end_at: "2026-08-01T10:00:00Z" }, as: DockBuyer, captures: { t_id: $.data.id, t_v: $.data.version } }
            - { call: "POST /dock-tickets/${t_id}/land", payload: {}, as: DockBuyer, captures: { t_v2: $.data.version } }
          trigger:
            - { call: "POST /landing-lines", payload: { dock_ticket_id: "${t_id}", species_id: "${sp_id}", declared_grade: "GRADE_A", landed_weight_kg: 100.00, expected_dock_ticket_version: "${t_v2}" }, as: DockBuyer, captures: { prov: $.data.provisional_amount_cents } }
            - { call: "GET /dock-tickets/${t_id}", payload: {}, as: OperationsManager, captures: { t_prov: $.data.provisional_total_cents } }
          assert:
            - "Create response: provisional_amount_cents == 120000 (computed inline, not on re-read)"
            - "Immediate next GET: DockTicket.${t_id}.provisional_total_cents == 120000"
