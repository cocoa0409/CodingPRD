              payload: { headline: "Same-day regulatory notice", category: "REGULATORY_ACTION", severity_tier: "TIER_2", source_reliability: "B", event_date: "2026-08-01" }
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
              captures: { ame_ok: $.data.id }
            - call: "POST /correspondent-banking/respondents/${r_id}/adverse-media-events"
              payload: { headline: "Tomorrow's news", category: "REGULATORY_ACTION", severity_tier: "TIER_2", source_reliability: "B", event_date: "2026-08-02" }
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
          assert:
            - "first response.status == 201"
            - "AdverseMediaEvent.${ame_ok}.state == NEW and uplift_points == 0.00"
            - "second response.status == 422 and second response.data.error_id == ERR_EVENT_DATE_IN_FUTURE"
            - "RespondentBank.${r_id}.adverse_media_uplift == 0.00 - neither call moves the uplift, which only accrues at CONFIRM"

  # ===========================================================================
  # §1.9 / endpoints - CRUD round trips, list ordering / pagination / filtering,
  # computed reads, action endpoints, conditional actions and cross-reference
  # links across the 69-endpoint surface.
  # ===========================================================================
  - section: endpoints
    instances:
      - name: jurisdiction_profile_create_read_patch_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints[POST /correspondent-banking/jurisdiction-profiles]
          - endpoints[GET /correspondent-banking/jurisdiction-profiles/{jurisdictionProfileId}]
          - endpoints[PATCH /correspondent-banking/jurisdiction-profiles/{jurisdictionProfileId}]
        distinguishing_aspect: "The reference entity has no state machine, so the round trip is the whole contract: the create applies the declared defaults for every optional flag, the read echoes them, and a PATCH that touches only sanctions_status leaves basel_aml_index and corridor_risk_weight untouched while bumping version."
        test_recipe:
          setup: ["Empty system."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "DE", name: "Germany", basel_aml_index: 4.00, corridor_risk_weight: 1.00 }
              as: PlatformAdmin
              captures: { jp_id: $.data.id }
            - call: "GET /correspondent-banking/jurisdiction-profiles/${jp_id}"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
            - call: "PATCH /correspondent-banking/jurisdiction-profiles/${jp_id}"
              payload: { sanctions_status: "RESTRICTED" }
              as: SanctionsOfficer
              as_user_id: "u-officer-1"
          assert:
            - "first response.status == 201 and second response.status == 200 and third response.status == 200"
            - "the read echoes jurisdiction_code DE, name Germany, basel_aml_index 4.00, corridor_risk_weight 1.00"
            - "the read shows the declared defaults: sanctions_status PERMITTED, fatf_listing NONE, secrecy_flag false, nested_correspondent_prohibited false, max_permitted_risk_rating HIGH"
            - "JurisdictionProfile.${jp_id}.sanctions_status == RESTRICTED after the PATCH"
            - "JurisdictionProfile.${jp_id}.basel_aml_index == 4.00 and corridor_risk_weight == 1.00 - untouched fields survive a partial update"
            - "JurisdictionProfile.${jp_id}.version increased by exactly 1 across the PATCH"

      - name: respondent_patch_updates_only_the_supplied_fields
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /correspondent-banking/respondents/{respondentId}]
          - entities.RespondentBank.fields.version
        distinguishing_aspect: "A PATCH carrying two commercial fields must leave the due-diligence dimensions alone: dd_state, payment_posture, license_status and every computed score are unchanged, while version increments by exactly one and updated_at moves to the logical clock."
        test_recipe:
          setup: ["One DD_IN_PROGRESS respondent under DE, clock advanced to 2026-08-05T00:00:00Z before the PATCH so updated_at is distinguishable."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "DE", name: "Germany", basel_aml_index: 4.00, corridor_risk_weight: 1.00 }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/respondents"
              payload: { legal_name: "Nordbank AG", swift_bic: "NORDDEFF", home_jurisdiction_code: "DE", relationship_manager_user_id: "u-fig-1", expected_monthly_volume_usd: 500000.00, expected_monthly_count: 100 }
              as: FIGRelationshipManager
              captures: { r_id: $.data.id }
            - call: "POST /correspondent-banking/respondents/${r_id}/licensing-verification"
              payload: { license_status: "ACTIVE", regulator_standing: "GOOD_STANDING", regulator_name: "BaFin" }
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
            - call: "GET /correspondent-banking/respondents/${r_id}"
              payload: {}
              as: FIGRelationshipManager
              captures: { ver_before: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "PATCH /correspondent-banking/respondents/${r_id}"
              payload: { legal_name: "Nordbank Aktiengesellschaft", relationship_manager_user_id: "u-fig-2" }
              as: FIGRelationshipManager
          assert:
            - "response.status == 200"
            - "RespondentBank.${r_id}.legal_name == Nordbank Aktiengesellschaft and relationship_manager_user_id == u-fig-2"
            - "RespondentBank.${r_id}.expected_monthly_volume_usd == 500000.00 and expected_monthly_count == 100"
            - "RespondentBank.${r_id}.dd_state == DD_IN_PROGRESS and payment_posture == BLOCKED and license_status == ACTIVE"
            - "RespondentBank.${r_id}.version == ${ver_before} + 1"
            - "RespondentBank.${r_id}.updated_at == 2026-08-05T00:00:00Z"

      - name: respondent_list_pagination_walks_created_at_ascending
        claim_type: standard_crud
        grounds:
          - endpoints[GET /correspondent-banking/respondents]
        distinguishing_aspect: "Five respondents created in a known order are paged with limit 2: the default order is created_at ASC, so page 2 (offset 2) is rows three and four, total_count stays 5 on every page, has_more is true until the last page, and an offset past the end returns an empty list with has_more false rather than an error."
        test_recipe:
          setup: ["Five respondents created back to back under DE, named Bank 1 .. Bank 5 in creation order."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "DE", name: "Germany", basel_aml_index: 4.00, corridor_risk_weight: 1.00 }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/respondents"
              payload: { legal_name: "Bank 1", swift_bic: "BANKDE01", home_jurisdiction_code: "DE", relationship_manager_user_id: "u-fig-1", expected_monthly_volume_usd: 100000.00, expected_monthly_count: 10 }
              as: FIGRelationshipManager
              captures: { r1: $.data.id }
            - call: "POST /correspondent-banking/respondents"
