              payload: {}
              as: ProcessTechnician
            - call: "POST /optics/coating-runs/${c1}/spectral-verification"
              payload: { spectral_samples: [ { wavelength_nm: 450, reflectance_pct: 0.1000 }, { wavelength_nm: 500, reflectance_pct: 0.1200 }, { wavelength_nm: 600, reflectance_pct: 0.1400 }, { wavelength_nm: 680, reflectance_pct: 0.1600 }, { wavelength_nm: 700, reflectance_pct: 0.1800 } ] }
