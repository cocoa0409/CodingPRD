              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id, cap0: $.data.daily_grind_cap_bushels }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: PlantManager
              as_user_id: "pm-01"
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-101", product_type: "ETHANOL_200_PROOF", capacity_gallons: 1000000.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t101_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts"
              payload: { supplier_name: "Cedar Ridge Elevator", delivery_month: "2026-10", bushels_contracted: 150000.00, basis_cents_per_bushel: -18.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { c1_id: $.data.id }
            - call: "POST /ethanol-ops/permit-conditions"
              payload: { condition_code: "NOX-1", permit_type: "AIR_EMISSIONS", parameter_name: "NOx", limit_value: 12.500, unit: "lb/hr", averaging_period_hours: 24, severity: "MAJOR" }
              as: ComplianceOfficer
              as_user_id: "co-01"
              captures: { pc1_id: $.data.id }
            - call: "POST /ethanol-ops/permit-conditions/${pc1_id}/readings"
              payload: { value: 13.000, measured_at: "2026-09-04T20:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-01"
          trigger:
            - call: "GET /ethanol-ops/plants/${plant_id}"
              payload: {}
              as: PlantManager
              as_user_id: "pm-01"
              captures: { posture: $.data.compliance_posture, proc: $.data.procurement_posture, cap: $.data.daily_grind_cap_bushels }
            - call: "POST /ethanol-ops/fermentation-batches"
              payload: { batch_code: "FB-1", corn_bushels_charged: 60000.00, charge_test_weight_lb_per_bu: 54.0, destination_tank_id: "${t101_id}" }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { err_id: $.data.error_id }
          assert:
            - "${cap0} == 90000 at creation (OPEN and SHORT on an empty book)"
            - "${posture} == CURTAILED and ${proc} == SHORT"
            - "${cap} == 54000 (floor(120000 * 0.60 * 0.75))"
            - "${err_id} == ERR_GRIND_CAP_EXCEEDED with HTTP 422, not ERR_INSUFFICIENT_CORN_INVENTORY"
            - "PermitCondition.${pc1_id}.status == EXCEEDANCE with rolling_average_value 13.000"
            - "No FermentationBatch with batch_code FB-1 exists afterwards"

      - name: index_quote_is_struck_from_the_reference_mark_not_the_client_price
        claim_type: variant_selection
        grounds:
          - calculations.co_product_settlement_price
          - calculations.co_product_settlement_price.variants[INDEX_RESTRIKE]
          - entities.CoProductSale.fields.quote_reference_mark
        distinguishing_aspect: |
          For an INDEX sale the quote is derived server-side as
          330.00 * 0.9200 == 303.60 and the 999.00 the client sent is discarded;
          at acceptance the price is re-struck against the moved mark
          (362.50 * 0.9200 == 333.50) and then clamped into the collar built
          from the ORIGINAL quote, so settlement_price is the ceiling 326.37 and
          not 333.50. A FLAT sale would have settled at 303.60 with null collars.
        test_recipe:
          setup:
            - "Plant exists with the soybean meal mark at 330.00 for 2026-10; INDEX sale SL-1 quotes 750.000 tons of DDGS_DRY at index_pct 0.9200; the mark then moves to 362.50; the clock is 2026-09-03T00:00:00Z."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-03T00:00:00Z" }
              as: PlantManager
              as_user_id: "pm-01"
            - call: "POST /ethanol-ops/plants/${plant_id}/market-marks"
              payload: { marks_effective_month: "2026-10", mark_corn_cents_per_bushel: 440.0, mark_ethanol_cents_per_gallon: 178.00, mark_natgas_cents_per_mmbtu: 265.75, mark_soybean_meal_usd_per_ton: 330.00, mark_sbo_cents_per_lb: 46.80 }
              as: RiskManager
              as_user_id: "risk-01"
            - call: "POST /ethanol-ops/co-product-sales"
              payload: { sale_code: "SL-1", buyer_name: "Midwest Feeders", product: "DDGS_DRY", pricing_basis: "INDEX", quantity: 750.000, quoted_price: 999.00, index_pct: 0.9200, freight_rate_per_unit: 3.2500, quote_expires_at: "2026-09-30T00:00:00Z" }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { sl1_id: $.data.id, qp: $.data.quoted_price, qrm: $.data.quote_reference_mark }
            - call: "POST /ethanol-ops/plants/${plant_id}/market-marks"
              payload: { marks_effective_month: "2026-10", mark_corn_cents_per_bushel: 440.0, mark_ethanol_cents_per_gallon: 178.00, mark_natgas_cents_per_mmbtu: 265.75, mark_soybean_meal_usd_per_ton: 362.50, mark_sbo_cents_per_lb: 46.80 }
              as: RiskManager
              as_user_id: "risk-01"
          trigger:
            - call: "POST /ethanol-ops/co-product-sales/${sl1_id}/respond"
              payload: { decision: "ACCEPT" }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { st: $.data.status, sp: $.data.settlement_price, cf: $.data.collar_floor, cc: $.data.collar_ceiling }
          assert:
            - "${qp} == 303.60 at quote time (330.00 * 0.9200), not the 999.00 the body carried"
            - "${qrm} == 330.00"
            - "${st} == ACCEPTED"
            - "${cf} == 280.83 and ${cc} == 326.37 (303.60 * 0.925 and 303.60 * 1.075)"
            - "${sp} == 326.37 — the 333.50 restrike is truncated at the ceiling"
            - "CoProductSale.${sl1_id}.quoted_price is still 303.60 after acceptance"

      - name: crush_margin_variants_diverge_on_identical_data
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: dual_variant_calc / crush_margin_mark_to_market_vs_realized_diverge_on_same_month
          rationale: "That instance reads both crush-margin variants from one response over the same plant state and asserts the cent-exact delta between them, which is the variant-divergence claim in full."

      - name: co_product_invoice_tier_boundary_and_freight_cap
        claim_type: tiered_pricing_boundary
        excluded_because:
          difficulty_instance: combinatorial_formula / co_product_invoice_rebate_tier_keyed_on_subtotal_not_net
          rationale: "That instance sits a sale exactly on the 50000.00 HIGH tier boundary with freight exactly at the 2500.00 cap and asserts the subtotal-keyed rebate, covering every tier and cap boundary claim for this rule."

      - name: health_index_weighted_scoring_rounding_order
        claim_type: weighted_scoring_precision
        excluded_because:
          difficulty_instance: combinatorial_formula / health_index_per_reading_rounding_beats_weight_then_round
          rationale: "That instance pins the round-then-weight order against the weight-then-round alternative on a three-reading window where the two orders differ, which is the rounding-drift claim."

      - name: health_index_threshold_boundary_value
        claim_type: threshold_boundary
        excluded_because:
          difficulty_instance: boundary_precision_check / health_index_exactly_seventy_stays_fermenting
          rationale: "That instance drives the index to exactly 70.00 and asserts the batch stays FERMENTING, covering the at-threshold case for HEALTH_WATCH_THRESHOLD."

      - name: track_capacity_interval_adjacency_and_aggregate
        claim_type: interval_merge_boundary
        excluded_because:
          difficulty_instance: resource_temporal_overlap / track_half_open_windows_adjacent_ok_but_aggregate_capacity_overflow_rejected
          rationale: "That instance covers adjacent half-open windows, the inclusive aggregate bound and the overflow rejection on one track, which is every interval_merge boundary claim for this rule."

  # ===========================================================================
  - section: validations
    instances:

      - name: duplicate_tank_code_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=20]
          - errors[ERR_DUPLICATE_CODE]
        distinguishing_aspect: |
          tank_code is a global natural key: re-using T-101 for a different
          product type and capacity still returns ERR_DUPLICATE_CODE 409, and
          the original tank keeps its own capacity.
        test_recipe:
          setup:
            - "Plant exists; tank T-101 is an ETHANOL_200_PROOF tank of 1000000.00 gallons."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-101", product_type: "ETHANOL_200_PROOF", capacity_gallons: 1000000.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t101_id: $.data.id }
          trigger:
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-101", product_type: "DENATURANT", capacity_gallons: 250000.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_DUPLICATE_CODE with HTTP 409"
            - "ProductTank.${t101_id}.product_type == ETHANOL_200_PROOF and capacity_gallons == 1000000.00"

      - name: second_plant_creation_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=19]
          - errors[ERR_PLANT_ALREADY_EXISTS]
        distinguishing_aspect: |
          The facility is a singleton: the second POST /plants returns
          ERR_PLANT_ALREADY_EXISTS 409 even with a different name and nameplate,
          and the first plant's fields are untouched.
        test_recipe:
          setup:
            - "One Plant already exists."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
          trigger:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Second Plant", nameplate_capacity_gallons: 60000000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_PLANT_ALREADY_EXISTS with HTTP 409"
            - "Plant.${plant_id}.name == Prairie Gold Ethanol and version == 1"

      - name: roll_with_a_pending_grade_load_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=46]
          - errors[ERR_CONTRACT_HAS_OPEN_DELIVERIES]
        distinguishing_aspect: |
          The roll is blocked by the child's state, not the parent's: the
          contract is OPEN with a 200000.00 bushel remainder, but one
          PENDING_GRADE load makes the roll return
          ERR_CONTRACT_HAS_OPEN_DELIVERIES 422 and no successor contract is
          created.
        test_recipe:
          setup:
            - "Plant exists; contract C-1 is OPEN and PRICED; load TK-0001 is booked and still PENDING_GRADE."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts"
              payload: { supplier_name: "Cedar Ridge Elevator", delivery_month: "2026-10", bushels_contracted: 200000.00, basis_cents_per_bushel: -18.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { c1_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/price"
              payload: { futures_price_cents_per_bushel: 458.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/deliveries"
              payload: { ticket_number: "TK-0001", gross_weight_lbs: 78640, tare_weight_lbs: 26000.00 }
              as: ScaleOperator
              as_user_id: "scale-01"
              captures: { d1_id: $.data.id }
          trigger:
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/roll"
              payload: { delivery_month: "2026-11", roll_basis_adjustment_cents: 4.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_CONTRACT_HAS_OPEN_DELIVERIES with HTTP 422"
            - "CornPurchaseContract.${c1_id}.status == OPEN"
            - "GET /ethanol-ops/corn-contracts?rolled_from_contract_id=${c1_id} returns 0 rows"
            - "CornDelivery.${d1_id}.grading_status == PENDING_GRADE"

      - name: clock_reposted_at_the_same_instant_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=49]
          - errors[ERR_CLOCK_REGRESSION]
        distinguishing_aspect: |
          The clock is strictly forward-only: re-posting the instant already in
          force — not merely an earlier one — returns ERR_CLOCK_REGRESSION 422.
        test_recipe:
          setup:
            - "Plant exists; the logical clock has been set to 2026-09-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: PlantManager
              as_user_id: "pm-01"
          trigger:
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { err_id: $.data.error_id }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T23:59:59Z" }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { err_id2: $.data.error_id }
          assert:
            - "${err_id} == ERR_CLOCK_REGRESSION with HTTP 422 for the equal instant"
            - "${err_id2} == ERR_CLOCK_REGRESSION with HTTP 422 for the earlier instant"
            - "A subsequent create still stamps created_at 2026-09-05T00:00:00Z, proving the clock never moved"

      - name: quote_response_exactly_at_the_expiry_instant_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=47]
          - state_machines.CoProductSale.status.transitions[QUOTED->DECLINED]
        distinguishing_aspect: |
          The expiry bound is inclusive: with the clock advanced to exactly
          2026-09-10T00:00:00Z the response is still accepted and the sale moves
          to DECLINED, where a strict comparison would have raised
          ERR_QUOTE_EXPIRED.
        test_recipe:
          setup:
            - "Plant exists; FLAT sale SL-1 quotes 5.000 tons of DDGS_DRY at 210.00 and expires at 2026-09-10T00:00:00Z; the clock starts at 2026-09-03T00:00:00Z."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-03T00:00:00Z" }
              as: PlantManager
              as_user_id: "pm-01"
            - call: "POST /ethanol-ops/co-product-sales"
              payload: { sale_code: "SL-1", buyer_name: "Midwest Feeders", product: "DDGS_DRY", pricing_basis: "FLAT", quantity: 5.000, quoted_price: 210.00, quote_expires_at: "2026-09-10T00:00:00Z" }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { sl1_id: $.data.id }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: PlantManager
              as_user_id: "pm-01"
          trigger:
            - call: "POST /ethanol-ops/co-product-sales/${sl1_id}/respond"
              payload: { decision: "DECLINE" }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { st: $.data.status, rat: $.data.responded_at }
          assert:
            - "HTTP 200 and ${st} == DECLINED"
            - "${rat} == 2026-09-10T00:00:00Z"
            - "CoProductSale.${sl1_id}.settlement_price == null (a declined quote is never priced)"

      - name: blend_below_the_denaturant_band_rejected_at_execution
        claim_type: violation_to_error
        grounds:
          - validations[priority=39]
          - calculations.denaturant_specification
          - errors[ERR_DENATURANT_SPEC_VIOLATION]
        distinguishing_aspect: |
          The spec gate lives on execution, not on scheduling: a blend of
          2565.00 neat and 30.00 denaturant gallons schedules cleanly, then
          fails at execute with ERR_DENATURANT_SPEC_VIOLATION 422 because
          30.00 / 2595.00 == 0.011561 is below the 0.019800 floor — and every
          tank balance is left exactly as it was.
        test_recipe:
          setup:
            - "Plant exists; T-101 (ETHANOL_200_PROOF) holds 500000.00 gallons, T-201 (DENATURANT) holds 500000.00, T-301 (DENATURED_E100) is empty; blend BL-1 is SCHEDULED for 2565.00 + 30.00 gallons."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-101", product_type: "ETHANOL_200_PROOF", capacity_gallons: 1000000.00, opening_gallons: 500000.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t101_id: $.data.id }
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-201", product_type: "DENATURANT", capacity_gallons: 1000000.00, opening_gallons: 500000.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t201_id: $.data.id }
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-301", product_type: "DENATURED_E100", capacity_gallons: 1000000.00, opening_gallons: 0.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t301_id: $.data.id, t301_v: $.data.version }
            - call: "POST /ethanol-ops/denaturant-blends"
              payload: { blend_code: "BL-1", neat_source_tank_id: "${t101_id}", denaturant_source_tank_id: "${t201_id}", destination_tank_id: "${t301_id}", expected_destination_tank_version: "${t301_v}", neat_gallons: 2565.00, denaturant_gallons: 30.00, window_start: "2026-09-04T06:00:00Z", window_end: "2026-09-04T10:00:00Z" }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { bl1_id: $.data.id, bl_st: $.data.status }
          trigger:
            - call: "POST /ethanol-ops/denaturant-blends/${bl1_id}/execute"
              payload: {}
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { err_id: $.data.error_id }
          assert:
            - "${bl_st} == SCHEDULED — the create is accepted"
            - "${err_id} == ERR_DENATURANT_SPEC_VIOLATION with HTTP 422"
            - "DenaturantBlend.${bl1_id}.status == SCHEDULED and executed_at == null"
            - "ProductTank.${t101_id}.current_gallons == 500000.00 and ProductTank.${t301_id}.current_gallons == 0.00"
            - "A second blend of 2565.00 + 60.00 (0.022857) executes successfully, proving only the ratio was at fault"

      - name: charge_over_the_corn_inventory_rejected
        claim_type: aggregate_validation
        grounds:
          - validations[priority=58]
          - calculations.plant_inventory_and_coverage
          - errors[ERR_INSUFFICIENT_CORN_INVENTORY]
        distinguishing_aspect: |
          The guard is on settled inventory, not on the contract book: 940.00
          settled bushels against a 200000.00 bushel contract still refuse a
          1000.00 bushel charge with ERR_INSUFFICIENT_CORN_INVENTORY 422, and the
          grind cap of 120000 is nowhere near binding, so priority 40 stays
          silent.
        test_recipe:
          setup:
            - "Plant exists with exactly 940.00 settled bushels and an OPEN 200000.00 bushel contract; tank T-101 is IN_SERVICE."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-101", product_type: "ETHANOL_200_PROOF", capacity_gallons: 1000000.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t101_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts"
              payload: { supplier_name: "Cedar Ridge Elevator", delivery_month: "2026-10", bushels_contracted: 200000.00, basis_cents_per_bushel: -18.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { c1_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/price"
              payload: { futures_price_cents_per_bushel: 458.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/deliveries"
              payload: { ticket_number: "TK-0001", gross_weight_lbs: 78640, tare_weight_lbs: 26000.00 }
              as: ScaleOperator
              as_user_id: "scale-01"
              captures: { d1_id: $.data.id }
            - call: "POST /ethanol-ops/corn-deliveries/${d1_id}/grade"
              payload: { moisture_pct: 15.00, test_weight_lb_per_bu: 54.0, foreign_material_pct: 3.00, damaged_kernels_pct: 5.00, aflatoxin_ppb: 3 }
              as: ScaleOperator
              as_user_id: "scale-01"
            - call: "POST /ethanol-ops/corn-deliveries/${d1_id}/settle"
              payload: {}
              as: GrainAccountant
              as_user_id: "acct-01"
              captures: { nd: $.data.net_dry_bushels }
          trigger:
            - call: "POST /ethanol-ops/fermentation-batches"
              payload: { batch_code: "FB-1", corn_bushels_charged: 1000.00, charge_test_weight_lb_per_bu: 54.0, destination_tank_id: "${t101_id}" }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { err_id: $.data.error_id }
          assert:
            - "${nd} == 940.00 and Plant.${plant_id}.corn_inventory_bushels == 940.00"
            - "${err_id} == ERR_INSUFFICIENT_CORN_INVENTORY with HTTP 422"
            - "Plant.${plant_id}.daily_grind_cap_bushels == 120000, so the cap was never the binding constraint"
            - "A 940.00 bushel charge is accepted immediately afterwards, leaving corn_inventory_bushels 0.00"

      - name: hedge_close_over_the_open_contracts_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=54]
          - errors[ERR_CLOSE_EXCEEDS_OPEN_CONTRACTS]
        distinguishing_aspect: |
          A close of 12 lots against 10 open returns
          ERR_CLOSE_EXCEEDS_OPEN_CONTRACTS 422 with no partial fill: realized
          P&L stays 0 and contracts_open stays 10, where a clamping
          implementation would have closed 10 and reported a profit.
        test_recipe:
          setup:
            - "Plant exists; position HP-1 is a SHORT of 10 ETHANOL lots at 182.00 with no marks posted."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/hedge-positions"
              payload: { position_code: "HP-1", commodity: "ETHANOL", direction: "SHORT", contracts: 10, entry_price: 182.00, contract_month: "2026-10" }
              as: RiskManager
              as_user_id: "risk-01"
              captures: { hp1_id: $.data.id, un0: $.data.unrealized_pnl_cents }
          trigger:
            - call: "POST /ethanol-ops/hedge-positions/${hp1_id}/close"
              payload: { contracts_to_close: 12, exit_price: 176.50 }
              as: RiskManager
              as_user_id: "risk-01"
              captures: { err_id: $.data.error_id }
          assert:
            - "${un0} == 0 — no ethanol mark is posted, so the unrealized leg is 0, not an error"
            - "${err_id} == ERR_CLOSE_EXCEEDS_OPEN_CONTRACTS with HTTP 422"
            - "HedgePosition.${hp1_id}.status == OPEN, contracts_open == 10, contracts_closed == 0, realized_pnl_cents == 0"

      - name: blend_into_a_tank_of_the_wrong_product_type_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=41]
          - errors[ERR_TANK_PRODUCT_TYPE_MISMATCH]
        distinguishing_aspect: |
          Each tank reference is type-checked by its role: pointing the blend's
          destination at a second ETHANOL_200_PROOF tank instead of a
          DENATURED_E100 one returns ERR_TANK_PRODUCT_TYPE_MISMATCH 422 even
          though the tank exists, is IN_SERVICE, has room and its version is
          current.
        test_recipe:
          setup:
            - "Plant exists; T-101 and T-102 are both ETHANOL_200_PROOF; T-201 is DENATURANT."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-101", product_type: "ETHANOL_200_PROOF", capacity_gallons: 1000000.00, opening_gallons: 500000.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t101_id: $.data.id }
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-102", product_type: "ETHANOL_200_PROOF", capacity_gallons: 1000000.00, opening_gallons: 0.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t102_id: $.data.id, t102_v: $.data.version }
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-201", product_type: "DENATURANT", capacity_gallons: 1000000.00, opening_gallons: 500000.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t201_id: $.data.id }
          trigger:
            - call: "POST /ethanol-ops/denaturant-blends"
              payload: { blend_code: "BL-1", neat_source_tank_id: "${t101_id}", denaturant_source_tank_id: "${t201_id}", destination_tank_id: "${t102_id}", expected_destination_tank_version: "${t102_v}", neat_gallons: 2565.00, denaturant_gallons: 60.00, window_start: "2026-09-04T06:00:00Z", window_end: "2026-09-04T10:00:00Z" }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_TANK_PRODUCT_TYPE_MISMATCH with HTTP 422"
            - "No DenaturantBlend with blend_code BL-1 exists"
            - "ProductTank.${t102_id}.version == 1 — the failed schedule did not bump the destination version"

      - name: shipment_on_an_inactive_track_rejected
        claim_type: conditional_validation
        grounds:
          - validations[priority=51]
          - errors[ERR_TRACK_INACTIVE]
          - entities.LoadingTrack.fields.is_active
        distinguishing_aspect: |
          The is_active flag gates scheduling independently of capacity: a
          1-railcar shipment on an empty 110-spot track is still refused with
          ERR_TRACK_INACTIVE 422 while is_active is false, and committed_railcars
          stays 0.
        test_recipe:
          setup:
            - "Plant exists; T-301 (DENATURED_E100) holds 400000.00 gallons; track TRK-B was created with is_active false."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-301", product_type: "DENATURED_E100", capacity_gallons: 1000000.00, opening_gallons: 400000.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t301_id: $.data.id }
            - call: "POST /ethanol-ops/loading-tracks"
              payload: { track_code: "TRK-B", spot_capacity: 110, is_active: false }
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { trk_id: $.data.id, trk_v: $.data.version, act: $.data.is_active }
          trigger:
            - call: "POST /ethanol-ops/unit-train-shipments"
              payload: { shipment_code: "SH-1", track_id: "${trk_id}", expected_track_version: "${trk_v}", source_tank_id: "${t301_id}", destination_terminal: "Chicago Terminal", railcar_count: 1, gallons_per_railcar: 2659.00, window_start: "2026-09-04T06:00:00Z", window_end: "2026-09-04T18:00:00Z", price_cents_per_gallon: 181.50 }
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { err_id: $.data.error_id }
          assert:
            - "${act} == false (the client-supplied flag overrides the true default)"
            - "${err_id} == ERR_TRACK_INACTIVE with HTTP 422"
            - "LoadingTrack.${trk_id}.committed_railcars == 0 and version == 1"
            - "GET /ethanol-ops/unit-train-shipments returns 0 rows"

      - name: co_product_shipment_over_the_inventory_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=59]
          - calculations.plant_inventory_and_coverage
          - errors[ERR_INSUFFICIENT_COPRODUCT_INVENTORY]
        distinguishing_aspect: |
          DDGS inventory only exists once a batch has COMPLETED, so an ACCEPTED
          5.000 ton sale against 0.000 tons on hand is refused with
          ERR_INSUFFICIENT_COPRODUCT_INVENTORY 422 and the sale stays ACCEPTED
          rather than moving to SHIPPED.
        test_recipe:
          setup:
            - "Plant exists with ddgs_inventory_tons 0.000; FLAT sale SL-1 for 5.000 tons of DDGS_DRY has been accepted."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-03T00:00:00Z" }
              as: PlantManager
              as_user_id: "pm-01"
            - call: "POST /ethanol-ops/co-product-sales"
              payload: { sale_code: "SL-1", buyer_name: "Midwest Feeders", product: "DDGS_DRY", pricing_basis: "FLAT", quantity: 5.000, quoted_price: 210.00, quote_expires_at: "2026-09-30T00:00:00Z" }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { sl1_id: $.data.id }
            - call: "POST /ethanol-ops/co-product-sales/${sl1_id}/respond"
              payload: { decision: "ACCEPT" }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { st: $.data.status, sp: $.data.settlement_price, sub: $.data.subtotal_usd }
          trigger:
            - call: "POST /ethanol-ops/co-product-sales/${sl1_id}/ship"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { err_id: $.data.error_id }
          assert:
            - "${st} == ACCEPTED, ${sp} == 210.00 (the FLAT variant needs no marks) and ${sub} == 1050.00"
            - "CoProductSale.${sl1_id}.volume_rebate_usd == 0.00 (below the 20000.00 LOW tier) and invoice_amount_cents == 105000"
            - "${err_id} == ERR_INSUFFICIENT_COPRODUCT_INVENTORY with HTTP 422"
            - "CoProductSale.${sl1_id}.status == ACCEPTED and shipped_at == null"
            - "Plant.${plant_id}.ddgs_inventory_tons == 0.000"

      - name: delivery_booked_against_a_filled_contract_rejected
        claim_type: cascading_validation
        grounds:
          - validations[priority=55]
          - validations[priority=23]
          - errors[ERR_CONTRACT_FULLY_DELIVERED]
        distinguishing_aspect: |
          A contract written for exactly 940.00 bushels is FILLED by its first
          load, and the second ticket is refused with the specific
          ERR_CONTRACT_FULLY_DELIVERED 422 rather than the generic
          ERR_INVALID_CONTRACT_STATE — priority 23 defers to 55 for a FILLED
          contract on the delivery path.
        test_recipe:
          setup:
            - "Plant exists; contract C-1 is PRICED for exactly 940.00 bushels and load TK-0001 has settled at 940.00, filling it."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts"
              payload: { supplier_name: "Cedar Ridge Elevator", delivery_month: "2026-10", bushels_contracted: 940.00, basis_cents_per_bushel: -18.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { c1_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/price"
              payload: { futures_price_cents_per_bushel: 458.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/deliveries"
              payload: { ticket_number: "TK-0001", gross_weight_lbs: 78640, tare_weight_lbs: 26000.00 }
              as: ScaleOperator
              as_user_id: "scale-01"
              captures: { d1_id: $.data.id }
            - call: "POST /ethanol-ops/corn-deliveries/${d1_id}/grade"
              payload: { moisture_pct: 15.00, test_weight_lb_per_bu: 54.0, foreign_material_pct: 3.00, damaged_kernels_pct: 5.00, aflatoxin_ppb: 3 }
              as: ScaleOperator
              as_user_id: "scale-01"
            - call: "POST /ethanol-ops/corn-deliveries/${d1_id}/settle"
              payload: {}
              as: GrainAccountant
              as_user_id: "acct-01"
              captures: { cst: $.data.grading_status }
          trigger:
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/deliveries"
              payload: { ticket_number: "TK-0002", gross_weight_lbs: 78640, tare_weight_lbs: 26000.00 }
              as: ScaleOperator
              as_user_id: "scale-01"
              captures: { err_id: $.data.error_id }
          assert:
            - "${cst} == SETTLED and CornPurchaseContract.${c1_id}.status == FILLED with bushels_delivered 940.00"
            - "${err_id} == ERR_CONTRACT_FULLY_DELIVERED with HTTP 422, not ERR_INVALID_CONTRACT_STATE"
            - "GET /ethanol-ops/corn-contracts/${c1_id}/deliveries returns exactly 1 row"
            - "Plant.${plant_id}.open_contract_coverage_bushels == 0.00 and procurement_posture == SHORT"

      - name: state_error_outranks_safety_error_on_the_same_call
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / distill_state_error_precedes_tank_service_safety_error
          rationale: "That instance violates priority 26 and priority 38 on one distill call and asserts the priority-26 error, which is the priority-ordering claim for this pair."

      - name: safety_error_outranks_fiscal_error_on_the_same_call
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / shipment_posture_safety_error_precedes_tank_volume_fiscal_error
          rationale: "That instance violates priority 37 and priority 56 on one load call and asserts the priority-37 error, covering the second priority-ordering pair."

  - section: endpoints
    instances:
      - name: load_then_bol_then_invoice_prices_the_gallons_actually_drawn
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /unit-train-shipments/{id}/load]
          - endpoints[POST /unit-train-shipments/{id}/bill-of-lading]
          - endpoints[POST /unit-train-shipments/{id}/invoice]
          - entities.UnitTrainShipment.fields.invoice_amount_cents
          - calculations.tank_balance
        distinguishing_aspect: |
          The three action endpoints each publish their own side effects and the
          invoice is struck from loaded_gallons, not from planned_gallons: 100
          railcars of 2659.00 gallons draw 265900.00 from T-301 (leaving
          134100.00) and invoice at 181.50 cents for exactly 48260850 cents,
          while loading_status and billing_status advance on separate axes.
        test_recipe:
          setup:
            - "Plant exists; T-301 (DENATURED_E100) holds 400000.00 of 1000000.00 gallons; TRK-A has 110 spots; shipment SH-1 is SCHEDULED for 100 railcars at 2659.00 gallons and 181.50 cents per gallon."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T06:00:00Z" }
              as: PlantManager
              as_user_id: "pm-01"
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-301", product_type: "DENATURED_E100", capacity_gallons: 1000000.00, opening_gallons: 400000.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t301_id: $.data.id }
            - call: "POST /ethanol-ops/loading-tracks"
              payload: { track_code: "TRK-A", spot_capacity: 110 }
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { trk_id: $.data.id, trk_v: $.data.version }
            - call: "POST /ethanol-ops/unit-train-shipments"
              payload: { shipment_code: "SH-1", track_id: "${trk_id}", expected_track_version: "${trk_v}", source_tank_id: "${t301_id}", destination_terminal: "Chicago Terminal", railcar_count: 100, gallons_per_railcar: 2659.00, window_start: "2026-09-04T06:00:00Z", window_end: "2026-09-04T18:00:00Z", price_cents_per_gallon: 181.50 }
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { sh1_id: $.data.id, planned: $.data.planned_gallons, inv0: $.data.invoice_amount_cents }
          trigger:
            - call: "POST /ethanol-ops/unit-train-shipments/${sh1_id}/load"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { lg: $.data.loaded_gallons, lst: $.data.loading_status, bst: $.data.billing_status }
            - call: "POST /ethanol-ops/unit-train-shipments/${sh1_id}/bill-of-lading"
              payload: { bol_number: "BOL-77001" }
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { bst2: $.data.billing_status }
            - call: "POST /ethanol-ops/unit-train-shipments/${sh1_id}/invoice"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { amt: $.data.invoice_amount_cents, bst3: $.data.billing_status }
          assert:
            - "${planned} == 265900.00 and ${inv0} == null at creation"
            - "${lg} == 265900.00, ${lst} == LOADED, ${bst} == PENDING_BOL — loading did not touch the billing axis"
            - "${bst2} == BOL_ISSUED with bol_number BOL-77001 and bol_issued_at 2026-09-04T06:00:00Z"
            - "${amt} == 48260850 (265900.00 * 181.50) and ${bst3} == INVOICED"
            - "ProductTank.${t301_id}.current_gallons == 134100.00 and available_gallons == 865900.00"
            - "LoadingTrack.${trk_id}.committed_railcars == 100 — LOADED still counts against the spots"

      - name: blend_execute_debits_two_source_tanks_and_credits_the_destination
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /denaturant-blends/{id}/execute]
          - calculations.tank_balance
          - calculations.denaturant_specification
        distinguishing_aspect: |
          One execute call moves gallons across three tanks in a single
          transaction: T-101 falls to 497435.00, T-201 to 499940.00 and the
          empty destination rises to exactly 2625.00 with denaturant_pct
          0.022857 — an implementation that only credits the destination leaves
          the two source balances untouched.
        test_recipe:
          setup:
            - "Plant exists; T-101 (ETHANOL_200_PROOF) and T-201 (DENATURANT) each hold 500000.00 gallons; T-301 (DENATURED_E100) is empty; blend BL-1 is SCHEDULED for 2565.00 neat and 60.00 denaturant gallons."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T06:00:00Z" }
              as: PlantManager
              as_user_id: "pm-01"
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-101", product_type: "ETHANOL_200_PROOF", capacity_gallons: 1000000.00, opening_gallons: 500000.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t101_id: $.data.id }
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-201", product_type: "DENATURANT", capacity_gallons: 1000000.00, opening_gallons: 500000.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t201_id: $.data.id }
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-301", product_type: "DENATURED_E100", capacity_gallons: 1000000.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t301_id: $.data.id, t301_v: $.data.version, open0: $.data.current_gallons }
            - call: "POST /ethanol-ops/denaturant-blends"
              payload: { blend_code: "BL-1", neat_source_tank_id: "${t101_id}", denaturant_source_tank_id: "${t201_id}", destination_tank_id: "${t301_id}", expected_destination_tank_version: "${t301_v}", neat_gallons: 2565.00, denaturant_gallons: 60.00, window_start: "2026-09-04T06:00:00Z", window_end: "2026-09-04T10:00:00Z" }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { bl1_id: $.data.id, occ: $.data.occupancy_end, out0: $.data.output_gallons }
          trigger:
            - call: "POST /ethanol-ops/denaturant-blends/${bl1_id}/execute"
              payload: {}
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { st: $.data.status, outg: $.data.output_gallons, pct: $.data.denaturant_pct }
          assert:
            - "${open0} == 0.00 (opening_gallons defaulted) and ${out0} == null before execution"
            - "${occ} == 2026-09-04T12:00:00Z (window_end plus the 120 minute default settling buffer)"
            - "${st} == EXECUTED, ${outg} == 2625.00, ${pct} == 0.022857, executed_at == 2026-09-04T06:00:00Z"
            - "ProductTank.${t101_id}.current_gallons == 497435.00"
            - "ProductTank.${t201_id}.current_gallons == 499940.00"
            - "ProductTank.${t301_id}.current_gallons == 2625.00 and available_gallons == 997375.00"

      - name: permit_readings_are_scoped_to_the_condition_in_the_path
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /permit-conditions/{id}/readings]
          - endpoints[GET /permit-conditions/{id}/readings]
          - entities.PermitReading.fields.condition_id
          - calculations.permit_rolling_average
        distinguishing_aspect: |
          condition_id comes from the path, never the body, so two readings
          posted under PC-1 give it rolling_average_value 12.700 over 2 readings
          while PC-2's own single 5.000 reading leaves it at 5.000 over 1 — the
          sub-resource listings never bleed into each other.
        test_recipe:
          setup:
            - "Plant exists, clock at 2026-09-04T12:00:00Z; PC-1 is a 24 hour MINOR AIR_EMISSIONS condition with limit 15.000 and PC-2 a 24 hour MINOR WATER_DISCHARGE condition with limit 30.000."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T12:00:00Z" }
              as: PlantManager
              as_user_id: "pm-01"
            - call: "POST /ethanol-ops/permit-conditions"
              payload: { condition_code: "PC-1", permit_type: "AIR_EMISSIONS", parameter_name: "VOC", limit_value: 15.000, unit: "lb/hr", averaging_period_hours: 24, severity: "MINOR" }
              as: ComplianceOfficer
              as_user_id: "co-01"
              captures: { pc1_id: $.data.id, ra0: $.data.rolling_average_value, riw0: $.data.readings_in_window }
            - call: "POST /ethanol-ops/permit-conditions"
              payload: { condition_code: "PC-2", permit_type: "WATER_DISCHARGE", parameter_name: "TSS", limit_value: 30.000, unit: "mg/L", averaging_period_hours: 24, severity: "MINOR" }
              as: ComplianceOfficer
              as_user_id: "co-01"
              captures: { pc2_id: $.data.id }
          trigger:
            - call: "POST /ethanol-ops/permit-conditions/${pc1_id}/readings"
              payload: { value: 12.400, measured_at: "2026-09-04T06:00:00Z", sample_reference: "LAB-A1" }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { r1_id: $.data.id, r1_cond: $.data.condition_id }
            - call: "POST /ethanol-ops/permit-conditions/${pc1_id}/readings"
              payload: { value: 13.000, measured_at: "2026-09-04T11:00:00Z" }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { r2_id: $.data.id, r2_ref: $.data.sample_reference }
            - call: "POST /ethanol-ops/permit-conditions/${pc2_id}/readings"
              payload: { value: 5.000, measured_at: "2026-09-04T09:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-01"
              captures: { r3_id: $.data.id, r3_cond: $.data.condition_id }
          assert:
            - "${ra0} == null and ${riw0} == 0 on a condition with no readings"
            - "${r1_cond} == ${pc1_id} and ${r3_cond} == ${pc2_id} — the FK is taken from the path"
            - "${r2_ref} == null (sample_reference defaults when omitted)"
            - "PermitCondition.${pc1_id}.rolling_average_value == 12.700, readings_in_window == 2, status == COMPLIANT"
            - "PermitCondition.${pc2_id}.rolling_average_value == 5.000, readings_in_window == 1"
            - "GET /ethanol-ops/permit-conditions/${pc1_id}/readings returns exactly 2 rows and GET /ethanol-ops/permit-conditions/${pc2_id}/readings exactly 1"

      - name: crush_margin_computed_read_matches_the_calculation
        claim_type: computed_read
        excluded_because:
          difficulty_instance: dual_variant_calculation_divergence / crush_margin_mark_to_market_vs_realized_diverge_on_same_month
          rationale: "That instance reads GET /plants/{id}/crush-margin after seeding marks and settled corn and asserts both variants field by field, which is the computed-read claim for this endpoint."

      - name: conditional_action_allowed_only_when_the_prerequisite_holds
        claim_type: conditional_action
        excluded_because:
          difficulty_instance: precondition_gated_transition / rin_retire_requires_separating_shipment_invoiced
          rationale: "That instance drives the retire action against a not-yet-invoiced separating shipment and then again after invoicing, covering the conditional-action claim end to end."

  - section: errors
    instances:
      - name: every_resource_has_its_own_not_found_code
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PLANT_NOT_FOUND]
          - errors[ERR_CONTRACT_NOT_FOUND]
          - errors[ERR_DELIVERY_NOT_FOUND]
          - errors[ERR_BATCH_NOT_FOUND]
          - errors[ERR_TANK_NOT_FOUND]
          - errors[ERR_BLEND_NOT_FOUND]
          - errors[ERR_TRACK_NOT_FOUND]
          - errors[ERR_SHIPMENT_NOT_FOUND]
          - errors[ERR_SALE_NOT_FOUND]
          - errors[ERR_RIN_BATCH_NOT_FOUND]
          - errors[ERR_CARBON_PROJECT_NOT_FOUND]
          - errors[ERR_HEDGE_POSITION_NOT_FOUND]
          - errors[ERR_PERMIT_CONDITION_NOT_FOUND]
        distinguishing_aspect: |
          Thirteen resources, thirteen distinct 404 codes: the same foreign UUID
          read through each collection returns that collection's own
          ERR_*_NOT_FOUND, never a shared generic 404 and never
          ERR_VALIDATION.
        test_recipe:
          setup:
            - "An empty database — no rows of any kind exist, so every id below is foreign."
          setup_api_calls: []
          trigger:
            - call: "GET /ethanol-ops/plants/dead0000-0000-4000-8000-000000000001"
              payload: {}
              as: PlantManager
              as_user_id: "pm-01"
              captures: { e_plant: $.data.error_id }
            - call: "GET /ethanol-ops/corn-contracts/dead0000-0000-4000-8000-000000000002"
              payload: {}
              as: PlantManager
              as_user_id: "pm-01"
              captures: { e_contract: $.data.error_id }
            - call: "GET /ethanol-ops/corn-deliveries/dead0000-0000-4000-8000-000000000003"
              payload: {}
              as: PlantManager
              as_user_id: "pm-01"
              captures: { e_delivery: $.data.error_id }
            - call: "GET /ethanol-ops/fermentation-batches/dead0000-0000-4000-8000-000000000004"
              payload: {}
              as: PlantManager
              as_user_id: "pm-01"
              captures: { e_batch: $.data.error_id }
            - call: "GET /ethanol-ops/product-tanks/dead0000-0000-4000-8000-000000000005"
              payload: {}
              as: PlantManager
              as_user_id: "pm-01"
              captures: { e_tank: $.data.error_id }
            - call: "GET /ethanol-ops/denaturant-blends/dead0000-0000-4000-8000-000000000006"
