scenario: |
  581. Valet & Parking Operations (vendor): event/venue & lane assignment,
  ticket/claim & key cabinet, vehicle location & retrieval request, attendant
  shift & tips, validation & rate, damage-claim incident, lot capacity &
  overflow, revenue reconciliation

domain_name: valet-parking-operations
api_prefix: /valet

complexity_profile:
  primary_archetype: quota_allocation          # finite lot spaces competed for, reserved, overflowed
  secondary_archetype: ledger_reconciliation    # expected vs declared drawer revenue
  complexity_layers:
    - optimistic_concurrency                    # OCC on Lot.version at check-in (last-space CREATE-with-supersede)
    - dual_variant_calculation                  # quoted vs final fee; equal vs weighted tip split
    - cascading_side_effects                     # claim-approve chain (depth 3); overflow-release chain (depth 2)
    - derived_field_reconciliation               # Lot.occupied_count, Attendant.total_liability_cents

  entity_topology: flat                          # peer entities linked by FKs; no nested-in-URL ownership tree
  state_machine_shape: parallel                  # Ticket carries park_status x settlement_status independent axes
  relationship_patterns:
    - one_to_many                                # Venue -> Events/Lots/Attendants; Ticket -> RetrievalRequests/Grants/Claims
    - self_referential                           # Lot.overflow_lot_id -> Lot.id
    - cross_aggregate                            # RetrievalRequest depends on Ticket & Shift state
  role_model: peer_roles                         # Attendant (physical ops), Cashier (money), Supervisor (config/adjudication)
  consistency_model: immediate                   # all mutations + cascades atomic within the request

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Venue
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Venue display name."
      - name: address
        type: string
        source: input
        description: "Street address of the parking operation."
      - name: currency
        type: string
        source: input
        description: "ISO currency code for all monetary amounts at this venue."
        default: "USD"

  - name: Event
    parent: null
    common_fields: true
    fields:
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id"
      - name: name
        type: string
        source: input
        description: "Event name (e.g. 'Gala Night')."
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state. Initialized SCHEDULED on create."
        default: "SCHEDULED"
        constraints: "one of SCHEDULED, ACTIVE, CLOSED"
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive start of the event operating window (ISO 8601 UTC)."
      - name: window_end
        type: datetime
        source: input
        description: "Exclusive end of the event operating window; must be strictly after window_start."
      - name: free_grace_minutes
        type: integer
        source: input
        description: "Parking duration at or below this many minutes is charged 0."
        default: 15
      - name: hourly_rate_cents
        type: integer
        source: input
        description: "Per-hour metered rate in cents (hours rounded up)."
        default: 800
      - name: daily_max_cents
        type: integer
        source: input
        description: "Cap on the metered component before surcharge, in cents."
        default: 2500
      - name: event_surcharge_cents
        type: integer
        source: input
        description: "Flat surcharge added to any chargeable ticket at this event, in cents."
        default: 500
      - name: overflow_surcharge_cents
        type: integer
        source: input
        description: "Extra flat charge in cents applied to a ticket parked in an overflow lot."
        default: 700
      - name: tip_split_mode
        type: enum
        source: input
        description: "Tip-pool distribution algorithm applied when the event closes."
        default: "EQUAL"
        constraints: "one of EQUAL, WEIGHTED"

  - name: Lot
    parent: null
    common_fields: true
    fields:
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id"
      - name: name
        type: string
        source: input
        description: "Lot label."
      - name: capacity
        type: integer
        source: input
        description: "Maximum simultaneously-parked tickets."
        constraints: ">= 1"
      - name: occupied_count
        type: integer
        source: computed
        description: "Count of tickets whose lot_id == this Lot and park_status in {PARKED, RETRIEVED}. Reconciled on every check-in and checkout."
        default: 0
      - name: overflow_lot_id
        type: string
        source: input
        description: "FK -> Lot.id; the overflow lot used when this lot is full. Null means no overflow."
        default: null
      - name: is_overflow
        type: boolean
        source: input
        description: "True if this lot only receives overflow assignments."
        default: false
      - name: overflow_active
        type: boolean
        source: computed
        description: "True while at least one ticket that spilled from this primary lot still occupies its overflow lot."
        default: false

  - name: LaneAssignment
    parent: null
    common_fields: true
    fields:
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id"
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id"
      - name: lane_code
        type: string
        source: input
        description: "Physical drop-off/pickup lane identifier (e.g. 'A1'). A lane_code is unique per venue as a physical resource."
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive start of this lane reservation (ISO 8601 UTC)."
      - name: window_end
        type: datetime
        source: input
        description: "Exclusive end of this lane reservation; must be strictly after window_start."

  - name: Attendant
    parent: null
    common_fields: true
    fields:
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id"
      - name: name
        type: string
        source: input
        description: "Attendant full name."
      - name: status
        type: enum
        source: computed
        description: "Employment state. Auto-suspends to INACTIVE when total_liability_cents crosses LIABILITY_SUSPEND_THRESHOLD."
        default: "ACTIVE"
        constraints: "one of ACTIVE, INACTIVE"
      - name: total_liability_cents
        type: integer
        source: computed
        description: "Running sum of approved damage-claim liabilities charged back to this attendant."
        default: 0

  - name: Shift
    parent: null
    common_fields: true
    fields:
      - name: attendant_id
        type: string
        source: input
        description: "FK -> Attendant.id"
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; null for a non-event shift."
        default: null
      - name: start_at
        type: datetime
        source: input
        description: "Inclusive shift start (ISO 8601 UTC)."
      - name: end_at
        type: datetime
        source: input
        description: "Exclusive shift end; must be strictly after start_at."
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state. Initialized SCHEDULED on create."
        default: "SCHEDULED"
        constraints: "one of SCHEDULED, ACTIVE, CLOSED"
      - name: declared_tips_cents
        type: integer
        source: computed
        description: "Tips reported into this shift via the tips endpoint."
        default: 0
      - name: allocated_tip_cents
        type: integer
        source: computed
        description: "Tip-pool share assigned to this shift when its event closes."
        default: 0
      - name: liability_holdback_cents
        type: integer
        source: computed
        description: "Amount withheld from this shift due to disputed tickets its attendant handled."
        default: 0

  - name: Ticket
    parent: null
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id"
      - name: lot_id
        type: string
        source: input
        description: "FK -> Lot.id; the lot actually occupied (equals the overflow lot when in_overflow is true)."
      - name: attendant_id
        type: string
        source: input
        description: "FK -> Attendant.id; the attendant who checked the vehicle in."
      - name: license_plate
        type: string
        source: input
        description: "Vehicle plate."
      - name: key_tag
        type: string
        source: input
        description: "Key-cabinet hook tag; unique among non-CLOSED tickets of the same event."
      - name: checkin_at
        type: datetime
        source: input
        description: "Timestamp the vehicle was received (ISO 8601 UTC)."
      - name: estimated_departure_at
        type: datetime
        source: input
        description: "Customer-estimated pickup time; basis of the quoted fee."
      - name: checkout_at
        type: datetime
        source: computed
        description: "Timestamp the vehicle was released; set at checkout."
        default: null
      - name: park_status
        type: enum
        source: computed
        description: "Physical-custody axis. Initialized PARKED on check-in."
        default: "PARKED"
        constraints: "one of PARKED, RETRIEVED, CLOSED"
      - name: settlement_status
        type: enum
        source: computed
        description: "Money axis, independent of park_status. Initialized UNSETTLED."
        default: "UNSETTLED"
        constraints: "one of UNSETTLED, SETTLED, DISPUTED"
      - name: in_overflow
        type: boolean
        source: computed
        description: "True when the vehicle was spilled into an overflow lot at check-in."
        default: false
      - name: quoted_fee_cents
        type: integer
        source: computed
        description: "Forward-looking fee computed at check-in from estimated_departure_at."
      - name: final_fee_cents
        type: integer
        source: computed
        description: "Chronological fee computed at checkout from checkout_at. Null until checkout."
        default: null
      - name: net_charge_cents
        type: integer
        source: computed
        description: "final_fee_cents after applying APPLIED validation grants. Null until checkout."
        default: null

  - name: RetrievalRequest
    parent: null
    common_fields: true
    fields:
      - name: ticket_id
        type: string
        source: input
        description: "FK -> Ticket.id"
      - name: attendant_id
        type: string
        source: input
        description: "FK -> Attendant.id; assigned runner. Null until assigned."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Retrieval lifecycle. Initialized REQUESTED."
        default: "REQUESTED"
        constraints: "one of REQUESTED, ASSIGNED, STAGING, READY, COMPLETED, CANCELLED"
      - name: requested_at
        type: datetime
        source: input
        description: "When the customer requested the vehicle (ISO 8601 UTC)."
      - name: ready_at
        type: datetime
        source: computed
        description: "When the vehicle was staged ready. Set on the ready transition."
        default: null

  - name: ValidationGrant
    parent: null
    common_fields: true
    fields:
      - name: ticket_id
        type: string
        source: input
        description: "FK -> Ticket.id"
      - name: grant_type
        type: enum
        source: input
        description: "Discount kind."
        constraints: "one of PERCENT, FLAT, FULL_COMP"
      - name: value
        type: integer
        source: input
        description: "For PERCENT: whole-percent 0-100. For FLAT: cents. Ignored for FULL_COMP."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Initialized APPLIED; a reverse moves it to REVERSED."
        default: "APPLIED"
        constraints: "one of APPLIED, REVERSED"

  - name: DamageClaim
    parent: null
    common_fields: true
    fields:
      - name: ticket_id
        type: string
        source: input
        description: "FK -> Ticket.id"
      - name: attendant_id
        type: string
        source: input
        description: "FK -> Attendant.id; attendant charged back if approved. Null defaults to the ticket's attendant."
        default: null
      - name: description
        type: string
        source: input
        description: "Free-text incident description."
      - name: claimed_amount_cents
        type: integer
        source: input
        description: "Customer-claimed damage amount in cents."
      - name: approved_liability_cents
        type: integer
        source: computed
        description: "Liability fixed at approval; defaults to claimed_amount_cents when not overridden. Null until approved."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Claim lifecycle. Initialized OPEN."
        default: "OPEN"
        constraints: "one of OPEN, APPROVED, DENIED, SETTLED"

  - name: ReconciliationReport
    parent: null
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id"
      - name: status
        type: enum
        source: computed
        description: "Initialized DRAFT on create; finalize moves it to FINALIZED."
        default: "DRAFT"
        constraints: "one of DRAFT, FINALIZED"
      - name: expected_revenue_cents
        type: integer
        source: computed
        description: "Sum of net_charge_cents over the event's SETTLED tickets, recomputed while DRAFT."
      - name: overflow_surcharge_total_cents
        type: integer
        source: computed
        description: "Sum of overflow surcharge collected from in_overflow SETTLED tickets of the event."
      - name: liability_adjustment_cents
        type: integer
        source: computed
        description: "Sum of approved_liability_cents over APPROVED/SETTLED claims on the event's tickets."
        default: 0
      - name: declared_cash_cents
        type: integer
        source: computed
        description: "Cashier drawer count supplied at finalize. Null until finalized."
        default: null
      - name: variance_cents
        type: integer
        source: computed
        description: "declared_cash_cents - (expected_revenue_cents - liability_adjustment_cents), fixed at finalize."
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Event
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /valet/events/{id}/activate"
        actor: Supervisor
        preconditions: ["event.status == SCHEDULED"]
        side_effects: ["event opens for check-ins"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /valet/events/{id}/close"
        actor: Supervisor
        preconditions:
          - "event.status == ACTIVE"
          - "no Ticket of this event has park_status in {PARKED, RETRIEVED} (cross-entity)"
        side_effects:
          - "run tip_pool_distribution: set allocated_tip_cents on every Shift with event_id == this event"
          - "event locked; no further check-ins"

  - entity: Ticket
    initial_state: PARKED            # park_status axis; settlement_status axis initialized UNSETTLED in parallel
    terminal_states: [CLOSED]
    transitions:
      # ---- park_status axis ----
      - from: PARKED
        to: RETRIEVED
        trigger: "POST /valet/retrieval-requests/{id}/ready"
        actor: Attendant
        preconditions: ["ticket.park_status == PARKED", "retrieval.status == STAGING"]
        side_effects: ["ticket.park_status = RETRIEVED", "retrieval.ready_at set"]
        note: "park_status axis; settlement_status untouched (parallel dimension)."
      - from: PARKED
        to: CLOSED
        trigger: "POST /valet/tickets/{id}/checkout"
        actor: Cashier
        preconditions:
          - "ticket.park_status in {PARKED, RETRIEVED}"
          - "checkout_at >= ticket.checkin_at (business_temporal)"
          - "no DamageClaim on this ticket with status == OPEN (business_safety)"
        side_effects:
          - "compute final_parking_fee -> final_fee_cents"
          - "compute validation_net_charge -> net_charge_cents"
          - "ticket.settlement_status = SETTLED (parallel axis advances)"
          - "ticket.checkout_at set"
          - "Lot.occupied_count for ticket.lot_id decremented by 1 (derived reconcile)"
          - "if ticket.in_overflow and overflow Lot.occupied_count reaches 0: primary Lot.overflow_active = false"
      - from: RETRIEVED
        to: CLOSED
        trigger: "POST /valet/tickets/{id}/checkout"
        actor: Cashier
        preconditions:
          - "ticket.park_status == RETRIEVED"
          - "checkout_at >= ticket.checkin_at (business_temporal)"
          - "no DamageClaim on this ticket with status == OPEN (business_safety)"
        side_effects:
          - "compute final_parking_fee -> final_fee_cents"
          - "compute validation_net_charge -> net_charge_cents"
          - "ticket.settlement_status = SETTLED"
          - "ticket.checkout_at set"
          - "Lot.occupied_count for ticket.lot_id decremented by 1"
          - "if ticket.in_overflow and overflow Lot.occupied_count reaches 0: primary Lot.overflow_active = false"
      # ---- settlement_status axis (independent) ----
      - from: UNSETTLED
        to: DISPUTED
        trigger: "POST /valet/damage-claims/{id}/approve (cascade hop 1)"
        actor: Supervisor
        preconditions: ["ticket.settlement_status in {UNSETTLED, SETTLED}"]
        side_effects:
          - "ticket.settlement_status = DISPUTED"
          - "ticket.net_charge_cents = 0"
          - "cascade: Attendant.total_liability_cents += claim.approved_liability_cents (hop 2)"
        note: "settlement axis moves independently of park_status; a PARKED or CLOSED ticket can be DISPUTED."
      - from: SETTLED
        to: DISPUTED
        trigger: "POST /valet/damage-claims/{id}/approve (cascade hop 1)"
        actor: Supervisor
        preconditions: ["ticket.settlement_status in {UNSETTLED, SETTLED}"]
        side_effects:
          - "ticket.settlement_status = DISPUTED"
          - "ticket.net_charge_cents = 0"
          - "cascade: Attendant.total_liability_cents += claim.approved_liability_cents (hop 2)"

  - entity: RetrievalRequest
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: ASSIGNED
        trigger: "POST /valet/retrieval-requests/{id}/assign"
        actor: Attendant
        preconditions:
          - "retrieval.status == REQUESTED"
          - "target Attendant has a Shift with status == ACTIVE (cross-entity)"
        side_effects: ["retrieval.attendant_id set"]
      - from: ASSIGNED
        to: STAGING
        trigger: "POST /valet/retrieval-requests/{id}/stage"
        actor: Attendant
        preconditions: ["retrieval.status == ASSIGNED"]
        side_effects: ["runner is fetching the vehicle"]
      - from: STAGING
        to: READY
        trigger: "POST /valet/retrieval-requests/{id}/ready"
        actor: Attendant
        preconditions: ["retrieval.status == STAGING", "ticket.park_status == PARKED"]
        side_effects: ["retrieval.ready_at set", "ticket.park_status = RETRIEVED (cross-entity)"]
      - from: READY
        to: STAGING
        trigger: "POST /valet/retrieval-requests/{id}/revert"
        actor: Attendant
        preconditions: ["retrieval.status == READY"]
        side_effects: ["ticket.park_status = PARKED (cross-entity revert)", "retrieval.ready_at cleared"]
        note: "Cycle: vehicle re-staged (customer delayed / wrong car pulled)."
      - from: STAGING
        to: ASSIGNED
        trigger: "POST /valet/retrieval-requests/{id}/revert"
        actor: Attendant
        preconditions: ["retrieval.status == STAGING"]
        side_effects: ["runner handed off; awaiting reassignment"]
        note: "Cycle back to ASSIGNED."
      - from: READY
        to: COMPLETED
        trigger: "POST /valet/retrieval-requests/{id}/complete"
        actor: Attendant
        preconditions: ["retrieval.status == READY"]
        side_effects: ["vehicle handed to customer"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /valet/retrieval-requests/{id}/revert"
        actor: Attendant
        preconditions: ["retrieval.status == REQUESTED"]
        side_effects: ["request abandoned before assignment"]

  - entity: DamageClaim
    initial_state: OPEN
    terminal_states: [DENIED, SETTLED]
    transitions:
      - from: OPEN
        to: APPROVED
        trigger: "POST /valet/damage-claims/{id}/approve"
        actor: Supervisor
        preconditions: ["claim.status == OPEN"]
        side_effects:
          - "claim.approved_liability_cents = override or claim.claimed_amount_cents"
          - "cascade hop 1: linked Ticket.settlement_status -> DISPUTED, Ticket.net_charge_cents = 0"
          - "cascade hop 2: charged Attendant.total_liability_cents += approved_liability_cents"
          - "cascade hop 3: if Attendant.total_liability_cents >= LIABILITY_SUSPEND_THRESHOLD then Attendant.status = INACTIVE"
          - "cascade hop 3b: on suspension, every Shift of that attendant with status == ACTIVE -> CLOSED"
        note: "Branching fork point (OPEN -> APPROVED | DENIED) with a depth-3 cascade on the APPROVED branch."
      - from: OPEN
        to: DENIED
        trigger: "POST /valet/damage-claims/{id}/deny"
        actor: Supervisor
        preconditions: ["claim.status == OPEN"]
        side_effects: ["no ledger or ticket change (divergent branch side-effect set)"]
      - from: APPROVED
        to: SETTLED
        trigger: "POST /valet/damage-claims/{id}/settle"
        actor: Supervisor
        preconditions: ["claim.status == APPROVED"]
        side_effects: ["claim marked paid out"]

  - entity: Shift
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /valet/shifts/{id}/start"
        actor: Supervisor
        preconditions: ["shift.status == SCHEDULED"]
        side_effects: ["attendant on the clock; eligible for retrieval assignment"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /valet/shifts/{id}/close"
        actor: Supervisor
        preconditions: ["shift.status == ACTIVE"]
        side_effects: ["attendant off the clock"]

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: checkin-stale-lot-version
    parent_entity: Lot
    write_endpoint: "POST /valet/tickets"
    occ_field: "expected_lot_version"
    description: |
      Checking a vehicle into a Lot whose version has advanced since the client
      last observed it is rejected. A check-in claims a space against the lot
      the client saw; if another check-in has since occupied a space (advancing
      the lot's version), the current writer's snapshot of remaining capacity is
      stale and the create is refused so two writers cannot both claim what each
      believed was the last free space.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: parking_fee
    trigger: "quoted variant at POST /valet/tickets; final variant at POST /valet/tickets/{id}/checkout"
    algorithm: tiered_pricing
    formula: |
      def fee(duration_minutes, event):
          if duration_minutes <= event.free_grace_minutes:
              return 0
          hours = ceil(duration_minutes / 60)                      # round partial hour up
          metered = min(hours * event.hourly_rate_cents, event.daily_max_cents)
          fee = metered + event.event_surcharge_cents               # flat surcharge after the cap
          if ticket.in_overflow:
              fee += event.overflow_surcharge_cents
          return fee
      # quoted:  duration = estimated_departure_at - checkin_at
      # final:   duration = checkout_at - checkin_at
    input_set: "single ticket; duration source differs per variant"
    constants:
      MINUTES_PER_HOUR: 60
    precision: "integer cents; hours rounded up (ceil); min() applies the daily cap before the surcharge"
    variants:
      - name: quoted
        when: "computed at check-in into quoted_fee_cents"
        difference: "duration = estimated_departure_at - checkin_at (forward-looking estimate)"
      - name: final
        when: "computed at checkout into final_fee_cents"
        difference: "duration = checkout_at - checkin_at (chronological actual); diverges from quoted whenever actual != estimate"

  - name: validation_net_charge
    trigger: "recomputed at checkout, and on POST .../validations and POST /valet/validation-grants/{id}/reverse"
    algorithm: aggregation
    formula: |
      net = ticket.final_fee_cents
      for g in ValidationGrants where ticket_id == ticket.id and status == APPLIED
              ordered by created_at ASC:          # order fixed: created_at ascending
          if g.grant_type == FULL_COMP: net = 0
          elif g.grant_type == FLAT:    net = max(net - g.value, 0)
          elif g.grant_type == PERCENT: net = round_half_up(net * (100 - g.value) / 100)
      ticket.net_charge_cents = net
    input_set: "APPLIED grants of the ticket only; REVERSED grants excluded"
    constants: {}
    precision: "integer cents; round_half_up on PERCENT step; floor at 0 on FLAT step"

  - name: tip_pool_distribution
    trigger: "POST /valet/events/{id}/close (side effect)"
    algorithm: waterfall_allocation
    formula: |
      shifts = Shifts where event_id == event.id, ordered by created_at ASC
      pool = sum(s.declared_tips_cents for s in shifts)
      if EQUAL:
          base = [floor(pool / n) for each of n shifts]     # n = len(shifts)
      elif WEIGHTED:
          total_h = sum(hours(s) for s in shifts)            # hours(s) = (end_at-start_at)/3600
          base = [floor(pool * hours(s) / total_h) for s in shifts]
      remainder = pool - sum(base)                           # >= 0
      # distribute remainder one cent at a time to shifts in created_at ASC order
      for i in range(remainder): base[i] += 1
      set each shift.allocated_tip_cents = base[i]
    input_set: "all shifts with event_id == closing event, regardless of shift status"
    constants:
      SECONDS_PER_HOUR: 3600
    precision: "integer cents; floor each share then allocate the leftover remainder by created_at ASC so sum(shares) == pool exactly"
    variants:
      - name: EQUAL
        when: "event.tip_split_mode == EQUAL"
        difference: "each shift gets floor(pool/n); remainder to earliest-created shifts"
      - name: WEIGHTED
        when: "event.tip_split_mode == WEIGHTED"
        difference: "share proportional to shift hours; diverges from EQUAL whenever shift hours are unequal"

  - name: lot_occupancy
    trigger: "reconciled on POST /valet/tickets (+1) and POST /valet/tickets/{id}/checkout (-1)"
    algorithm: aggregation
    formula: |
      Lot.occupied_count == count(Ticket where lot_id == Lot.id
                                   and park_status in {PARKED, RETRIEVED})
      # check-in: +1 on the assigned lot (primary, or overflow lot when primary full)
      # checkout: -1 on ticket.lot_id
    input_set: "tickets of this lot in non-CLOSED park_status"
    constants: {}
    precision: "integer count; never negative"

  - name: reconciliation_variance
    trigger: "expected/overflow/liability recomputed on POST /valet/reconciliation-reports (DRAFT); variance fixed on finalize"
    algorithm: aggregation
    formula: |
      tickets = Ticket where event_id == event.id
      expected_revenue_cents = sum(t.net_charge_cents for t in tickets if t.settlement_status == SETTLED)
      overflow_surcharge_total_cents = sum(event.overflow_surcharge_cents
                                           for t in tickets if t.in_overflow and t.settlement_status == SETTLED)
      liability_adjustment_cents = sum(c.approved_liability_cents
                                       for c in DamageClaims on these tickets if c.status in {APPROVED, SETTLED})
      # at finalize:
      variance_cents = declared_cash_cents - (expected_revenue_cents - liability_adjustment_cents)
    input_set: "SETTLED tickets for revenue; APPROVED/SETTLED claims for liability"
    constants: {}
    precision: "integer cents; variance may be negative (shortage) or positive (over)"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is permitted to call this endpoint per the RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every resource referenced by path id or body FK exists, validated left-to-right"
    error_id: ERR_<RESOURCE>_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: business_referential
    check: "entity_backed Attendant acting on an owned resource: X-User-ID == resource.attendant_id"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "POST /valet/shifts/{id}/tips"
  - priority: 5
    category: state
    check: "target resource is in a state that permits the requested transition (own state only)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints; specialized ids: ERR_EVENT_NOT_ACTIVE, ERR_TICKET_NOT_PARKED, ERR_CLAIM_NOT_OPEN, ERR_CLAIM_NOT_APPROVED, ERR_RETRIEVAL_BAD_STATE, ERR_SHIFT_NOT_ACTIVE, ERR_EVENT_NOT_CLOSABLE, ERR_REPORT_ALREADY_FINALIZED"
  - priority: 6
    category: business_temporal
    check: "supplied windows are well-formed (end strictly after start); checkout_at >= checkin_at; ready_at/requested_at present where required"
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    applies_to: "POST /valet/events, POST /valet/lane-assignments, POST /valet/shifts, POST /valet/tickets/{id}/checkout, POST /valet/retrieval-requests/{id}/ready"
  - priority: 7
    category: business_temporal
    check: "check-in checkin_at falls within [event.window_start, event.window_end)"
    error_id: ERR_CHECKIN_OUTSIDE_EVENT_WINDOW
    http_status: 422
    applies_to: "POST /valet/tickets"
  - priority: 8
    category: business_safety
    check: "ticket has no DamageClaim with status == OPEN when checking out"
    error_id: ERR_OPEN_DAMAGE_CLAIM
    http_status: 409
    applies_to: "POST /valet/tickets/{id}/checkout"
  - priority: 9
    category: business_referential
    check: "cross-entity state precondition holds: retrieval create requires ticket.park_status == PARKED; retrieval assign requires target attendant to have an ACTIVE shift"
    error_id: ERR_TICKET_NOT_PARKED
    http_status: 409
    applies_to: "POST /valet/retrieval-requests (ERR_TICKET_NOT_PARKED), POST /valet/retrieval-requests/{id}/assign (ERR_ATTENDANT_SHIFT_INACTIVE)"
  - priority: 10
    category: business_constraint
    check: "uniqueness & overlap: key_tag unique among non-CLOSED tickets of the event; lane_code windows on a venue must not overlap [half-open); attendant shift windows must not overlap and must keep SHIFT_REST_BUFFER_MINUTES gap"
    error_id: ERR_KEY_TAG_IN_USE
    http_status: 409
    applies_to: "POST /valet/tickets (ERR_KEY_TAG_IN_USE), POST /valet/lane-assignments (ERR_LANE_WINDOW_CONFLICT), POST /valet/shifts (ERR_SHIFT_OVERLAP)"
  - priority: 11
    category: business_fiscal
    check: "assigned lot has room: occupied_count < capacity; if full and overflow_lot_id set, spill to overflow; if full and no overflow, reject"
    error_id: ERR_LOT_AT_CAPACITY
    http_status: 409
    applies_to: "POST /valet/tickets"
  - priority: 12
    category: business_fiscal
    check: "OCC: expected_lot_version matches the primary Lot.version"
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412
    applies_to: "POST /valet/tickets"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Venue ----
  - method: POST
    path: "/valet/venues"
    description: "Create a venue."
    roles: [Supervisor]
    code: 201
    input: [name, address, "currency?"]
    output: Venue
    side_effects: []
  - method: GET
    path: "/valet/venues/{id}"
    description: "Fetch a venue."
    roles: [Supervisor, Cashier, Attendant]
    code: 200
    input: []
    output: Venue
    side_effects: []

  # ---- Event ----
  - method: POST
    path: "/valet/events"
    description: "Create an event with embedded rate card. Starts SCHEDULED."
    roles: [Supervisor]
    code: 201
    input: [venue_id, name, window_start, window_end, "free_grace_minutes?", "hourly_rate_cents?", "daily_max_cents?", "event_surcharge_cents?", "overflow_surcharge_cents?", "tip_split_mode?"]
    output: Event
    side_effects: ["validates window_end > window_start"]
  - method: GET
    path: "/valet/events/{id}"
    description: "Fetch an event."
    roles: [Supervisor, Cashier, Attendant]
    code: 200
    input: []
    output: Event
    side_effects: []
  - method: GET
    path: "/valet/events"
    description: "List events, filterable by venue/rate/status."
    roles: [Supervisor, Cashier, Attendant]
    code: 200
    input: ["venue_id?", "status?", "limit?", "offset?"]
    output: Event[]
    side_effects: []
  - method: POST
    path: "/valet/events/{id}/activate"
    description: "SCHEDULED -> ACTIVE."
    roles: [Supervisor]
    code: 200
    input: []
    output: Event
    side_effects: ["event.status = ACTIVE"]
  - method: POST
    path: "/valet/events/{id}/close"
    description: "ACTIVE -> CLOSED; distributes the tip pool to the event's shifts."
    roles: [Supervisor]
    code: 200
    input: []
    output: Event
    side_effects: ["reject if any ticket still PARKED/RETRIEVED", "run tip_pool_distribution -> Shift.allocated_tip_cents"]

  # ---- Lot ----
  - method: POST
    path: "/valet/lots"
    description: "Create a parking lot; optionally reference an overflow lot."
    roles: [Supervisor]
    code: 201
    input: [venue_id, name, capacity, "overflow_lot_id?", "is_overflow?"]
    output: Lot
    side_effects: []
  - method: GET
    path: "/valet/lots/{id}"
    description: "Fetch a lot (occupied_count, overflow_active live)."
    roles: [Supervisor, Cashier, Attendant]
    code: 200
    input: []
    output: Lot
    side_effects: []
  - method: GET
    path: "/valet/lots"
    description: "List lots, filterable by venue and overflow parent."
    roles: [Supervisor, Cashier, Attendant]
    code: 200
    input: ["venue_id?", "overflow_lot_id?", "limit?", "offset?"]
    output: Lot[]
    side_effects: []

  # ---- LaneAssignment ----
  - method: POST
    path: "/valet/lane-assignments"
    description: "Reserve a lane_code for an event over a time window."
    roles: [Supervisor]
    code: 201
    input: [venue_id, event_id, lane_code, window_start, window_end]
    output: LaneAssignment
    side_effects: ["reject on half-open window overlap with another assignment of the same venue+lane_code"]
  - method: GET
    path: "/valet/lane-assignments/{id}"
    description: "Fetch a lane assignment."
    roles: [Supervisor, Cashier, Attendant]
    code: 200
    input: []
    output: LaneAssignment
    side_effects: []
  - method: GET
    path: "/valet/lane-assignments"
    description: "List lane assignments, filterable by lane and event."
    roles: [Supervisor, Cashier, Attendant]
    code: 200
    input: ["venue_id?", "event_id?", "limit?", "offset?"]
    output: LaneAssignment[]
    side_effects: []

  # ---- Attendant ----
  - method: POST
    path: "/valet/attendants"
    description: "Create an attendant."
    roles: [Supervisor]
    code: 201
    input: [venue_id, name]
    output: Attendant
    side_effects: []
  - method: GET
    path: "/valet/attendants/{id}"
    description: "Fetch an attendant (status, total_liability_cents live)."
    roles: [Supervisor, Cashier, Attendant]
    code: 200
    input: []
    output: Attendant
    side_effects: []
  - method: GET
    path: "/valet/attendants"
    description: "List attendants, filterable by venue."
    roles: [Supervisor, Cashier, Attendant]
    code: 200
    input: ["venue_id?", "limit?", "offset?"]
    output: Attendant[]
    side_effects: []

  # ---- Shift ----
  - method: POST
    path: "/valet/shifts"
    description: "Schedule a shift for an attendant."
    roles: [Supervisor]
    code: 201
    input: [attendant_id, "event_id?", start_at, end_at]
    output: Shift
    side_effects: ["reject on overlap-or-insufficient-gap against the attendant's other shifts"]
  - method: GET
    path: "/valet/shifts/{id}"
    description: "Fetch a shift."
    roles: [Supervisor, Cashier, Attendant]
    code: 200
    input: []
    output: Shift
    side_effects: []
  - method: GET
    path: "/valet/shifts"
    description: "List shifts, filterable by attendant and event."
    roles: [Supervisor, Cashier, Attendant]
    code: 200
    input: ["attendant_id?", "event_id?", "limit?", "offset?"]
    output: Shift[]
    side_effects: []
  - method: POST
    path: "/valet/shifts/{id}/start"
    description: "SCHEDULED -> ACTIVE."
    roles: [Supervisor]
    code: 200
    input: []
    output: Shift
    side_effects: ["shift.status = ACTIVE"]
  - method: POST
    path: "/valet/shifts/{id}/close"
    description: "ACTIVE -> CLOSED."
    roles: [Supervisor]
    code: 200
    input: []
    output: Shift
    side_effects: ["shift.status = CLOSED"]
  - method: POST
    path: "/valet/shifts/{id}/tips"
    description: "Attendant records tips into their own shift (owner-only)."
    roles: [Attendant]
    code: 200
    input: [declared_tips_cents]
    output: Shift
    side_effects: ["shift.declared_tips_cents = declared_tips_cents"]

  # ---- Ticket ----
  - method: POST
    path: "/valet/tickets"
    description: "Check a vehicle in. Allocates a lot space (overflow if primary full), issues the claim, computes the quoted fee. Requires expected_lot_version (OCC on the primary lot)."
    roles: [Attendant]
    code: 201
    input: [event_id, lot_id, attendant_id, license_plate, key_tag, checkin_at, estimated_departure_at, expected_lot_version]
    output: Ticket
    side_effects:
      - "compute parking_fee(quoted) -> quoted_fee_cents"
      - "if primary lot full and overflow_lot_id set: lot_id = overflow lot, in_overflow = true, primary Lot.overflow_active = true"
      - "assigned Lot.occupied_count += 1 (derived reconcile)"
      - "increments primary Lot.version by 1"
  - method: GET
    path: "/valet/tickets/{id}"
    description: "Fetch a ticket."
    roles: [Supervisor, Cashier, Attendant]
    code: 200
    input: []
    output: Ticket
    side_effects: []
  - method: GET
    path: "/valet/tickets"
    description: "List tickets, filterable by event/lot/attendant/status."
    roles: [Supervisor, Cashier, Attendant]
    code: 200
    input: ["event_id?", "lot_id?", "attendant_id?", "park_status?", "settlement_status?", "limit?", "offset?"]
    output: Ticket[]
    side_effects: []
  - method: POST
    path: "/valet/tickets/{id}/checkout"
    description: "Close the ticket; compute final fee and net charge; free the lot space."
    roles: [Cashier]
    code: 200
    input: [checkout_at]
    output: Ticket
    side_effects:
      - "compute parking_fee(final) -> final_fee_cents"
      - "compute validation_net_charge -> net_charge_cents"
      - "ticket.park_status = CLOSED, settlement_status = SETTLED"
      - "Lot.occupied_count -= 1; overflow release cascade if applicable"
  - method: POST
    path: "/valet/tickets/{id}/validations"
    description: "Apply a validation grant to a ticket and recompute net charge."
    roles: [Cashier]
    code: 201
    input: [grant_type, "value?"]
    output: ValidationGrant
    side_effects: ["create ValidationGrant (APPLIED)", "recompute validation_net_charge -> ticket.net_charge_cents"]

  # ---- ValidationGrant ----
  - method: GET
    path: "/valet/validation-grants/{id}"
    description: "Fetch a validation grant."
    roles: [Supervisor, Cashier, Attendant]
    code: 200
    input: []
    output: ValidationGrant
    side_effects: []
  - method: GET
    path: "/valet/validation-grants"
    description: "List validation grants for a ticket."
    roles: [Supervisor, Cashier, Attendant]
    code: 200
    input: ["ticket_id?", "limit?", "offset?"]
    output: ValidationGrant[]
    side_effects: []
  - method: POST
    path: "/valet/validation-grants/{id}/reverse"
    description: "Reverse an applied grant and recompute net charge."
    roles: [Cashier]
    code: 200
    input: []
    output: ValidationGrant
    side_effects: ["grant.status = REVERSED", "recompute validation_net_charge -> ticket.net_charge_cents"]

  # ---- RetrievalRequest ----
  - method: POST
    path: "/valet/retrieval-requests"
    description: "Open a retrieval request for a parked ticket."
    roles: [Attendant]
    code: 201
    input: [ticket_id, requested_at]
    output: RetrievalRequest
    side_effects: ["require ticket.park_status == PARKED"]
  - method: GET
    path: "/valet/retrieval-requests/{id}"
    description: "Fetch a retrieval request (vehicle location/status)."
    roles: [Supervisor, Cashier, Attendant]
    code: 200
    input: []
    output: RetrievalRequest
    side_effects: []
  - method: GET
    path: "/valet/retrieval-requests"
    description: "List retrieval requests, filterable by ticket/attendant/status."
    roles: [Supervisor, Cashier, Attendant]
    code: 200
    input: ["ticket_id?", "attendant_id?", "status?", "limit?", "offset?"]
    output: RetrievalRequest[]
    side_effects: []
  - method: POST
    path: "/valet/retrieval-requests/{id}/assign"
    description: "REQUESTED -> ASSIGNED; assign a runner who must be on an ACTIVE shift."
    roles: [Attendant]
    code: 200
    input: [attendant_id]
    output: RetrievalRequest
    side_effects: ["retrieval.attendant_id set"]
  - method: POST
    path: "/valet/retrieval-requests/{id}/stage"
    description: "ASSIGNED -> STAGING."
    roles: [Attendant]
    code: 200
    input: []
    output: RetrievalRequest
    side_effects: []
  - method: POST
    path: "/valet/retrieval-requests/{id}/ready"
    description: "STAGING -> READY; sets ticket park_status RETRIEVED."
    roles: [Attendant]
    code: 200
    input: [ready_at]
    output: RetrievalRequest
    side_effects: ["retrieval.ready_at set", "ticket.park_status = RETRIEVED"]
  - method: POST
    path: "/valet/retrieval-requests/{id}/revert"
    description: "Cyclic revert: READY->STAGING (re-stage, ticket back to PARKED), STAGING->ASSIGNED, or REQUESTED->CANCELLED."
    roles: [Attendant]
    code: 200
    input: []
    output: RetrievalRequest
    side_effects: ["if from READY: ticket.park_status = PARKED, ready_at cleared"]
  - method: POST
    path: "/valet/retrieval-requests/{id}/complete"
    description: "READY -> COMPLETED."
    roles: [Attendant]
    code: 200
    input: []
    output: RetrievalRequest
    side_effects: []

  # ---- DamageClaim ----
  - method: POST
    path: "/valet/damage-claims"
    description: "File a damage-claim incident against a ticket."
    roles: [Attendant, Cashier]
    code: 201
    input: [ticket_id, "attendant_id?", description, claimed_amount_cents]
    output: DamageClaim
    side_effects: ["attendant_id defaults to ticket.attendant_id when omitted"]
  - method: GET
    path: "/valet/damage-claims/{id}"
    description: "Fetch a damage claim."
    roles: [Supervisor, Cashier, Attendant]
    code: 200
    input: []
    output: DamageClaim
    side_effects: []
  - method: GET
    path: "/valet/damage-claims"
    description: "List damage claims, filterable by ticket/attendant/status."
    roles: [Supervisor, Cashier, Attendant]
    code: 200
    input: ["ticket_id?", "attendant_id?", "status?", "limit?", "offset?"]
    output: DamageClaim[]
    side_effects: []
  - method: POST
    path: "/valet/damage-claims/{id}/approve"
    description: "OPEN -> APPROVED; runs the depth-3 liability cascade."
    roles: [Supervisor]
    code: 200
    input: ["approved_liability_cents?"]
    output: DamageClaim
    side_effects:
      - "approved_liability_cents = override or claimed_amount_cents"
      - "hop1: Ticket.settlement_status = DISPUTED, net_charge_cents = 0"
      - "hop2: Attendant.total_liability_cents += approved_liability_cents"
      - "hop3: if Attendant.total_liability_cents >= LIABILITY_SUSPEND_THRESHOLD -> Attendant.status = INACTIVE, and its ACTIVE shifts -> CLOSED"
  - method: POST
    path: "/valet/damage-claims/{id}/deny"
    description: "OPEN -> DENIED (no side effects)."
    roles: [Supervisor]
    code: 200
    input: []
    output: DamageClaim
    side_effects: []
  - method: POST
    path: "/valet/damage-claims/{id}/settle"
    description: "APPROVED -> SETTLED."
    roles: [Supervisor]
    code: 200
    input: []
    output: DamageClaim
    side_effects: []

  # ---- ReconciliationReport ----
  - method: POST
    path: "/valet/reconciliation-reports"
    description: "Create a DRAFT reconciliation for a CLOSED event; computes expected revenue, overflow surcharge, liability adjustment."
    roles: [Supervisor]
    code: 201
    input: [event_id]
    output: ReconciliationReport
    side_effects: ["require event.status == CLOSED", "compute reconciliation_variance inputs"]
  - method: GET
    path: "/valet/reconciliation-reports/{id}"
    description: "Fetch a reconciliation report."
    roles: [Supervisor, Cashier]
    code: 200
    input: []
    output: ReconciliationReport
    side_effects: []
  - method: GET
    path: "/valet/reconciliation-reports"
    description: "List reconciliation reports, filterable by event."
    roles: [Supervisor, Cashier]
    code: 200
    input: ["event_id?", "limit?", "offset?"]
    output: ReconciliationReport[]
    side_effects: []
  - method: POST
    path: "/valet/reconciliation-reports/{id}/finalize"
    description: "DRAFT -> FINALIZED; records drawer cash and fixes the variance."
    roles: [Supervisor]
    code: 200
    input: [declared_cash_cents]
    output: ReconciliationReport
    side_effects: ["variance_cents = declared_cash_cents - (expected_revenue_cents - liability_adjustment_cents)"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID header"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for the endpoint"
  - id: ERR_FORBIDDEN_OWNERSHIP
    http: 403
    condition: "attendant acting on a shift they do not own (X-User-ID != shift.attendant_id)"
  - id: ERR_VALIDATION
    http: 400
    condition: "missing required field, bad type, or invalid enum value"
  - id: ERR_VENUE_NOT_FOUND
    http: 404
    condition: "referenced venue does not exist"
  - id: ERR_EVENT_NOT_FOUND
    http: 404
    condition: "referenced event does not exist"
  - id: ERR_LOT_NOT_FOUND
    http: 404
    condition: "referenced lot does not exist"
  - id: ERR_ATTENDANT_NOT_FOUND
    http: 404
    condition: "referenced attendant does not exist"
  - id: ERR_SHIFT_NOT_FOUND
    http: 404
    condition: "referenced shift does not exist"
  - id: ERR_TICKET_NOT_FOUND
    http: 404
    condition: "referenced ticket does not exist"
  - id: ERR_RETRIEVAL_NOT_FOUND
    http: 404
    condition: "referenced retrieval request does not exist"
  - id: ERR_VALIDATION_GRANT_NOT_FOUND
    http: 404
    condition: "referenced validation grant does not exist"
  - id: ERR_DAMAGE_CLAIM_NOT_FOUND
    http: 404
    condition: "referenced damage claim does not exist"
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "referenced reconciliation report does not exist"
  - id: ERR_LANE_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "referenced lane assignment does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "generic: transition not allowed from the resource's current state"
  - id: ERR_EVENT_NOT_ACTIVE
    http: 409
    condition: "check-in attempted on an event whose status != ACTIVE"
  - id: ERR_EVENT_NOT_CLOSABLE
    http: 409
    condition: "close attempted while event not ACTIVE or tickets still PARKED/RETRIEVED"
  - id: ERR_TICKET_NOT_PARKED
    http: 409
    condition: "retrieval create against a ticket whose park_status != PARKED"
  - id: ERR_CLAIM_NOT_OPEN
    http: 409
    condition: "approve/deny attempted on a claim whose status != OPEN"
  - id: ERR_CLAIM_NOT_APPROVED
    http: 409
    condition: "settle attempted on a claim whose status != APPROVED"
  - id: ERR_RETRIEVAL_BAD_STATE
    http: 409
    condition: "assign/stage/ready/revert/complete from an incompatible retrieval state"
  - id: ERR_SHIFT_NOT_ACTIVE
    http: 409
    condition: "start/close attempted from an incompatible shift state"
  - id: ERR_REPORT_ALREADY_FINALIZED
    http: 409
    condition: "finalize attempted on an already-FINALIZED report"
  - id: ERR_INVALID_TIME_WINDOW
    http: 422
    condition: "window_end <= window_start, or checkout_at < checkin_at, or missing required timestamp"
  - id: ERR_CHECKIN_OUTSIDE_EVENT_WINDOW
    http: 422
    condition: "checkin_at outside [event.window_start, event.window_end)"
  - id: ERR_OPEN_DAMAGE_CLAIM
    http: 409
    condition: "checkout blocked because the ticket has an OPEN damage claim"
  - id: ERR_ATTENDANT_SHIFT_INACTIVE
    http: 409
    condition: "retrieval assign to an attendant with no ACTIVE shift"
  - id: ERR_LANE_WINDOW_CONFLICT
    http: 409
    condition: "lane_code reservation overlaps an existing assignment on the same venue+lane_code"
  - id: ERR_SHIFT_OVERLAP
    http: 409
    condition: "shift overlaps, or violates the rest buffer against, another shift of the same attendant"
  - id: ERR_KEY_TAG_IN_USE
    http: 409
    condition: "key_tag already held by a non-CLOSED ticket of the same event"
  - id: ERR_LOT_AT_CAPACITY
    http: 409
    condition: "assigned lot full and no overflow lot available"
  - id: ERR_STALE_LOT_VERSION
    http: 412
    condition: "expected_lot_version does not match the primary Lot.version"
  - id: ERR_VALIDATION_NOT_APPLICABLE
    http: 409
    condition: "validation apply/reverse on a ticket whose settlement_status == DISPUTED"
  - id: ERR_GRANT_ALREADY_REVERSED
    http: 409
    condition: "reverse attempted on a grant whose status == REVERSED"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Attendant
    description: "Front-line valet: checks vehicles in, runs the retrieval flow, records tips on own shift, files damage claims."
    identity: "entity_backed:Attendant"
    exclusive_operations:
      - "POST /valet/tickets (check-in)"
      - "POST /valet/retrieval-requests and its assign/stage/ready/revert/complete transitions"
      - "POST /valet/shifts/{id}/tips (owner-only)"
    shared_operations:
      - "POST /valet/damage-claims (with Cashier)"
      - "all GET reads"
  - name: Cashier
    description: "Handles money: checkout/settlement, validation grants, reconciliation reads."
    identity: "opaque"
    exclusive_operations:
      - "POST /valet/tickets/{id}/checkout"
      - "POST /valet/tickets/{id}/validations"
      - "POST /valet/validation-grants/{id}/reverse"
    shared_operations:
      - "POST /valet/damage-claims (with Attendant)"
      - "all GET reads"
  - name: Supervisor
    description: "Configures venues/events/lots/lanes/attendants/shifts, adjudicates damage claims, runs reconciliation."
    identity: "opaque"
    exclusive_operations:
      - "POST/manage Venue, Event (+activate/close), Lot, LaneAssignment, Attendant, Shift (+start/close)"
      - "POST /valet/damage-claims/{id}/approve|deny|settle"
      - "POST /valet/reconciliation-reports (+finalize)"
    shared_operations:
      - "all GET reads"

# =============================================================================
# Global constants referenced across tables
# =============================================================================
constants:
  LIABILITY_SUSPEND_THRESHOLD: 10000     # cents; attendant auto-suspends at or above
  SHIFT_REST_BUFFER_MINUTES: 30          # required gap between an attendant's shifts
  DEFAULT_FREE_GRACE_MINUTES: 15
  DEFAULT_HOURLY_RATE_CENTS: 800
  DEFAULT_DAILY_MAX_CENTS: 2500
  DEFAULT_EVENT_SURCHARGE_CENTS: 500
  DEFAULT_OVERFLOW_SURCHARGE_CENTS: 700
