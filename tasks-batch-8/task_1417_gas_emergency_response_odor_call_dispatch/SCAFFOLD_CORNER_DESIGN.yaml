# =============================================================================
# 1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Gas Emergency Response & Odor Call Dispatch
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: emergency_call_intake_creates_incident_with_implied_priority
        claim_type: creation
        grounds: [entities.EmergencyCall, entities.GasIncident.fields.priority]
        distinguishing_aspect: "A PRIMARY call spawns a GasIncident whose priority equals the call's implied_priority rule (symptoms -> P1; odor+INSIDE_STRUCTURE -> P2; odor otherwise -> P3; else P4) and lifecycle NEW."
        test_recipe:
          setup: ["T1 exists; clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /gas-ops/territories"
              payload: { name: "T1", p1_threshold_minutes: 30, p2_threshold_minutes: 60, p3_threshold_minutes: 240, p4_threshold_minutes: 1440, recurrence_window_hours: 72, repair_budget_cap_cents: 1000000 }
              as: SystemAdmin
              captures: { terr_id: "$.data.id" }
          trigger:
            - call: "POST /gas-ops/emergency-calls"
              payload: { caller_name: "Zoe", caller_phone: "555-0200", address_line: "1 New St", city: "Springfield", territory_id: "${terr_id}", location_context: "PUBLIC_SPACE", odor_reported: false, symptoms_reported: false, hissing_reported: false }
              as: Dispatcher
              captures: { call_id: "$.data.id", inc_id: "$.data.incident_id", imp: "$.data.implied_priority" }
            - call: "GET /gas-ops/incidents/${inc_id}"
              payload: {}
              as: Supervisor
          assert:
            - "EmergencyCall.${call_id}.classification == PRIMARY and implied_priority == P4 (no odor, no symptoms)"
            - "GasIncident.${inc_id}.lifecycle_status == NEW and priority == P4"
            - "GasIncident.${inc_id}.linked_call_count == 1 and severity_score == 6 (occupancy 0.3 * 20, no readings, no symptoms)"

      - name: emergency_call_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.EmergencyCall.fields.odor_reported", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required boolean odor_reported yields ERR_INVALID_REQUEST 400 before any incident side effect."
        test_recipe:
          setup: ["T1 exists"]
          setup_api_calls:
            - call: "POST /gas-ops/territories"
              payload: { name: "T1", p1_threshold_minutes: 30, p2_threshold_minutes: 60, p3_threshold_minutes: 240, p4_threshold_minutes: 1440, recurrence_window_hours: 72, repair_budget_cap_cents: 1000000 }
              as: SystemAdmin
              captures: { terr_id: "$.data.id" }
          trigger:
            - call: "POST /gas-ops/emergency-calls"
              payload: { caller_name: "Amy", caller_phone: "555-0201", address_line: "2 New St", city: "Springfield", territory_id: "${terr_id}", location_context: "INSIDE_STRUCTURE", symptoms_reported: false, hissing_reported: false }
              as: Dispatcher
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400"
            - "GET /gas-ops/incidents?territory_id=${terr_id} returns total_count == 0 (no partial side effect)"

      - name: emergency_call_occupancy_default_applied
        claim_type: defaults
        grounds: [entities.EmergencyCall.fields.occupancy_type]
        distinguishing_aspect: "Omitting occupancy_type defaults to SINGLE_FAMILY on both the call and the spawned incident."
        test_recipe:
          setup: ["T1 exists"]
          setup_api_calls:
            - call: "POST /gas-ops/territories"
              payload: { name: "T1", p1_threshold_minutes: 30, p2_threshold_minutes: 60, p3_threshold_minutes: 240, p4_threshold_minutes: 1440, recurrence_window_hours: 72, repair_budget_cap_cents: 1000000 }
              as: SystemAdmin
              captures: { terr_id: "$.data.id" }
          trigger:
            - call: "POST /gas-ops/emergency-calls"
              payload: { caller_name: "Ben", caller_phone: "555-0202", address_line: "3 New St", city: "Springfield", territory_id: "${terr_id}", location_context: "OUTSIDE_STRUCTURE", odor_reported: true, symptoms_reported: false, hissing_reported: false }
              as: Dispatcher
              captures: { call_id: "$.data.id", inc_id: "$.data.incident_id" }
            - call: "GET /gas-ops/incidents/${inc_id}"
              payload: {}
              as: Supervisor
          assert:
            - "EmergencyCall.${call_id}.occupancy_type == SINGLE_FAMILY"
            - "GasIncident.${inc_id}.occupancy_type == SINGLE_FAMILY"

      - name: system_minted_fields_client_input_ignored
        claim_type: system_fields
        grounds: [entities.FieldTechnician]
        distinguishing_aspect: "Client-supplied id/created_at/version on POST /gas-ops/technicians are ignored: server mints a UUID id and version 1."
        test_recipe:
          setup: ["T1 exists"]
          setup_api_calls:
            - call: "POST /gas-ops/territories"
              payload: { name: "T1", p1_threshold_minutes: 30, p2_threshold_minutes: 60, p3_threshold_minutes: 240, p4_threshold_minutes: 1440, recurrence_window_hours: 72, repair_budget_cap_cents: 1000000 }
              as: SystemAdmin
              captures: { terr_id: "$.data.id" }
          trigger:
            - call: "POST /gas-ops/technicians"
              payload: { full_name: "Cy", badge_number: "B100", home_territory_id: "${terr_id}", hourly_rate_cents: 5500, id: "00000000-0000-0000-0000-000000000000", version: 99 }
              as: SystemAdmin
              captures: { tech_id: "$.data.id", tech_v: "$.data.version" }
          assert:
            - "FieldTechnician.${tech_id}.id != '00000000-0000-0000-0000-000000000000' (server-minted)"
            - "FieldTechnician.${tech_id}.version == 1"
            - "active_assignment_count == 0 and on_shift == false (no shift declared)"

      - name: invalid_enum_value_returns_invalid_request
        claim_type: type_constraints
        grounds: ["entities.GasIncident.fields.priority", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Triage with priority 'P9' is rejected as an invalid enum before any state change."
        test_recipe:
          setup: ["T1; one PRIMARY incident in NEW"]
          setup_api_calls:
            - call: "POST /gas-ops/territories"
              payload: { name: "T1", p1_threshold_minutes: 30, p2_threshold_minutes: 60, p3_threshold_minutes: 240, p4_threshold_minutes: 1440, recurrence_window_hours: 72, repair_budget_cap_cents: 1000000 }
              as: SystemAdmin
              captures: { terr_id: "$.data.id" }
            - call: "POST /gas-ops/emergency-calls"
              payload: { caller_name: "Dee", caller_phone: "555-0203", address_line: "4 New St", city: "Springfield", territory_id: "${terr_id}", location_context: "INSIDE_STRUCTURE", odor_reported: true, symptoms_reported: false, hissing_reported: false }
              as: Dispatcher
              captures: { inc_id: "$.data.incident_id" }
          trigger:
            - call: "POST /gas-ops/incidents/${inc_id}/triage"
              payload: { priority: "P9" }
              as: Dispatcher
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400"
            - "GasIncident.${inc_id}.lifecycle_status still == NEW"

      - name: invalid_time_range_on_shift_returns_400
        claim_type: type_constraints
        grounds: ["entities.TechnicianShift.fields.shift_end", "errors[ERR_INVALID_TIME_RANGE]"]
        distinguishing_aspect: "shift_end equal to shift_start (zero-length window) is rejected: end must be strictly after start."
        test_recipe:
          setup: ["T1; technician exists"]
          setup_api_calls:
            - call: "POST /gas-ops/territories"
              payload: { name: "T1", p1_threshold_minutes: 30, p2_threshold_minutes: 60, p3_threshold_minutes: 240, p4_threshold_minutes: 1440, recurrence_window_hours: 72, repair_budget_cap_cents: 1000000 }
              as: SystemAdmin
              captures: { terr_id: "$.data.id" }
            - call: "POST /gas-ops/technicians"
              payload: { full_name: "Ed", badge_number: "B101", home_territory_id: "${terr_id}", hourly_rate_cents: 5500 }
              as: SystemAdmin
              captures: { tech_id: "$.data.id" }
          trigger:
            - call: "POST /gas-ops/technicians/${tech_id}/shifts"
              payload: { shift_start: "2026-08-01T08:00:00Z", shift_end: "2026-08-01T08:00:00Z" }
              as: Supervisor
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_TIME_RANGE, HTTP 400"

      - name: immutable_emergency_call_has_no_version_field
        claim_type: immutability
        grounds: [entities.EmergencyCall]
        distinguishing_aspect: "EmergencyCall is common_fields:false: its GET representation carries id and created_at but no version/updated_at, and no update endpoint exists for it in §1.5."
        test_recipe:
          setup: ["T1; one call created"]
          setup_api_calls:
            - call: "POST /gas-ops/territories"
              payload: { name: "T1", p1_threshold_minutes: 30, p2_threshold_minutes: 60, p3_threshold_minutes: 240, p4_threshold_minutes: 1440, recurrence_window_hours: 72, repair_budget_cap_cents: 1000000 }
              as: SystemAdmin
              captures: { terr_id: "$.data.id" }
            - call: "POST /gas-ops/emergency-calls"
              payload: { caller_name: "Fi", caller_phone: "555-0204", address_line: "6 New St", city: "Springfield", territory_id: "${terr_id}", location_context: "OUTSIDE_STRUCTURE", odor_reported: true, symptoms_reported: false, hissing_reported: false }
              as: Dispatcher
              captures: { call_id: "$.data.id" }
          trigger:
            - call: "GET /gas-ops/emergency-calls/${call_id}"
              payload: {}
              as: Dispatcher
          assert:
            - "Response data contains id, created_at, received_at, classification"
            - "Response data does NOT contain a version key"
            - "Response data does NOT contain an updated_at key"

      - name: get_incident_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_INCIDENT_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent incident UUID yields ERR_INCIDENT_NOT_FOUND 404."
        test_recipe:
          setup: ["empty database (clock default)"]
          setup_api_calls:
            - call: "POST /gas-ops/territories"
              payload: { name: "T1", p1_threshold_minutes: 30, p2_threshold_minutes: 60, p3_threshold_minutes: 240, p4_threshold_minutes: 1440, recurrence_window_hours: 72, repair_budget_cap_cents: 1000000 }
              as: SystemAdmin
          trigger:
            - call: "GET /gas-ops/incidents/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: Supervisor
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INCIDENT_NOT_FOUND, HTTP 404"

      - name: list_incidents_pagination_envelope
        claim_type: listing
        grounds: ["response_envelope", "endpoints[GET /gas-ops/incidents]"]
        distinguishing_aspect: "List endpoint honors limit/offset and returns total_count and has_more per the fixed envelope."
        test_recipe:
          setup: ["T1 with three incidents at distinct addresses"]
          setup_api_calls:
            - call: "POST /gas-ops/territories"
              payload: { name: "T1", p1_threshold_minutes: 30, p2_threshold_minutes: 60, p3_threshold_minutes: 240, p4_threshold_minutes: 1440, recurrence_window_hours: 72, repair_budget_cap_cents: 1000000 }
              as: SystemAdmin
              captures: { terr_id: "$.data.id" }
            - call: "POST /gas-ops/emergency-calls"
              payload: { caller_name: "G1", caller_phone: "555-0205", address_line: "1 Page St", city: "Springfield", territory_id: "${terr_id}", location_context: "OUTSIDE_STRUCTURE", odor_reported: true, symptoms_reported: false, hissing_reported: false }
              as: Dispatcher
            - call: "POST /gas-ops/emergency-calls"
              payload: { caller_name: "G2", caller_phone: "555-0206", address_line: "2 Page St", city: "Springfield", territory_id: "${terr_id}", location_context: "OUTSIDE_STRUCTURE", odor_reported: true, symptoms_reported: false, hissing_reported: false }
              as: Dispatcher
            - call: "POST /gas-ops/emergency-calls"
              payload: { caller_name: "G3", caller_phone: "555-0207", address_line: "3 Page St", city: "Springfield", territory_id: "${terr_id}", location_context: "OUTSIDE_STRUCTURE", odor_reported: true, symptoms_reported: false, hissing_reported: false }
              as: Dispatcher
          trigger:
            - call: "GET /gas-ops/incidents?territory_id=${terr_id}&limit=2&offset=0"
              payload: {}
              as: Supervisor
          assert:
            - "Response envelope contains meta.api_request_id and meta.api_request_timestamp"
            - "response_type == array; data length == 2"
            - "total_count == 3 and has_more == true"
            - "Second page (offset=2) returns 1 item with has_more == false"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: first_arrival_stops_clock_and_transitions_on_scene
        claim_type: side_effect_execution
        grounds: [state_machines.GasIncident.DISPATCHED_to_ON_SCENE, state_machines.DispatchAssignment.EN_ROUTE_to_ON_SCENE]
        distinguishing_aspect: "Arrive moves the assignment EN_ROUTE->ON_SCENE and, as the first arrival, cascades the incident DISPATCHED->ON_SCENE with first_arrival_at frozen at the logical clock."
        test_recipe:
          setup: ["T1; P2 incident dispatched to an on-shift technician; clock at 00:30"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /gas-ops/territories"
              payload: { name: "T1", p1_threshold_minutes: 30, p2_threshold_minutes: 60, p3_threshold_minutes: 240, p4_threshold_minutes: 1440, recurrence_window_hours: 72, repair_budget_cap_cents: 1000000 }
              as: SystemAdmin
              captures: { terr_id: "$.data.id" }
            - call: "POST /gas-ops/technicians"
              payload: { full_name: "Hal", badge_number: "B102", home_territory_id: "${terr_id}", hourly_rate_cents: 6000 }
              as: SystemAdmin
              captures: { tech_id: "$.data.id" }
            - call: "POST /gas-ops/technicians/${tech_id}/shifts"
              payload: { shift_start: "2026-08-01T00:00:00Z", shift_end: "2026-08-01T12:00:00Z" }
              as: Supervisor
            - call: "POST /gas-ops/emergency-calls"
              payload: { caller_name: "Hal's caller", caller_phone: "555-0208", address_line: "7 Scene St", city: "Springfield", territory_id: "${terr_id}", location_context: "INSIDE_STRUCTURE", odor_reported: true, symptoms_reported: false, hissing_reported: false }
              as: Dispatcher
              captures: { inc_id: "$.data.incident_id" }
            - call: "POST /gas-ops/incidents/${inc_id}/triage"
              payload: { priority: "P2" }
              as: Dispatcher
            - call: "POST /gas-ops/incidents/${inc_id}/dispatches"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
              captures: { disp_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:30:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /gas-ops/dispatches/${disp_id}/arrive"
              payload: {}
              as: FieldTechnician
              as_user_id: "${tech_id}"
            - call: "GET /gas-ops/incidents/${inc_id}"
              payload: {}
              as: Supervisor
          assert:
            - "DispatchAssignment.${disp_id}.status == ON_SCENE and arrived_at == 2026-08-01T00:30:00Z"
            - "GasIncident.${inc_id}.lifecycle_status == ON_SCENE"
            - "GasIncident.${inc_id}.first_arrival_at == 2026-08-01T00:30:00Z"
            - "GasIncident.${inc_id}.breach_class == NONE (1800 <= 3600)"

      - name: arrive_on_preempted_dispatch_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.DispatchAssignment", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "PREEMPTED is terminal for the assignment: a later arrive attempt is rejected and the incident state is untouched."
        test_recipe:
          setup: ["T1; P2 incident A dispatched (TECH1 EN_ROUTE); P1 incident B triaged; A's assignment preempted to B"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /gas-ops/territories"
              payload: { name: "T1", p1_threshold_minutes: 30, p2_threshold_minutes: 60, p3_threshold_minutes: 240, p4_threshold_minutes: 1440, recurrence_window_hours: 72, repair_budget_cap_cents: 1000000 }
              as: SystemAdmin
              captures: { terr_id: "$.data.id" }
            - call: "POST /gas-ops/technicians"
              payload: { full_name: "Ike", badge_number: "B103", home_territory_id: "${terr_id}", hourly_rate_cents: 6000 }
              as: SystemAdmin
              captures: { tech_id: "$.data.id" }
            - call: "POST /gas-ops/technicians/${tech_id}/shifts"
              payload: { shift_start: "2026-08-01T00:00:00Z", shift_end: "2026-08-01T12:00:00Z" }
              as: Supervisor
            - call: "POST /gas-ops/emergency-calls"
              payload: { caller_name: "J", caller_phone: "555-0209", address_line: "9 Low St", city: "Springfield", territory_id: "${terr_id}", location_context: "INSIDE_STRUCTURE", odor_reported: true, symptoms_reported: false, hissing_reported: false }
              as: Dispatcher
              captures: { inc_a: "$.data.incident_id" }
            - call: "POST /gas-ops/incidents/${inc_a}/triage"
              payload: { priority: "P2" }
              as: Dispatcher
            - call: "POST /gas-ops/incidents/${inc_a}/dispatches"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
              captures: { disp_a: "$.data.id" }
            - call: "POST /gas-ops/emergency-calls"
              payload: { caller_name: "K", caller_phone: "555-0210", address_line: "11 High St", city: "Springfield", territory_id: "${terr_id}", location_context: "INSIDE_STRUCTURE", occupancy_type: "HOSPITAL", odor_reported: true, symptoms_reported: true, hissing_reported: false }
              as: Dispatcher
              captures: { inc_b: "$.data.incident_id" }
            - call: "POST /gas-ops/incidents/${inc_b}/triage"
              payload: { priority: "P1" }
              as: Dispatcher
            - call: "POST /gas-ops/dispatches/${disp_a}/preempt"
              payload: { target_incident_id: "${inc_b}", reason: "P1 preemption" }
              as: Supervisor
          trigger:
            - call: "POST /gas-ops/dispatches/${disp_a}/arrive"
              payload: {}
              as: FieldTechnician
              as_user_id: "${tech_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409"
            - "DispatchAssignment.${disp_a}.status remains PREEMPTED"
            - "GasIncident.${inc_a}.first_arrival_at remains null"

      - name: merged_incident_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.GasIncident", "errors[ERR_INCIDENT_NOT_ACTIVE]"]
        distinguishing_aspect: "Terminal/quasi-terminal lockdown: a CLOSED incident rejects both triage (ERR_INCIDENT_NOT_ACTIVE) and being a merge source (ERR_INVALID_STATE), and a same-address call after the 72h recurrence window creates a brand-new PRIMARY incident instead of reopening."
        test_recipe:
          setup:
            - "T1; incident S fully closed at 01:00 (20-min response, no leak)"
            - "At 2026-08-04T01:00:00Z (80h after closure, past the 72h recurrence window) a new call for the same address creates a fresh PRIMARY incident T, which is triaged P2"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /gas-ops/territories"
              payload: { name: "T1", p1_threshold_minutes: 30, p2_threshold_minutes: 60, p3_threshold_minutes: 240, p4_threshold_minutes: 1440, recurrence_window_hours: 72, repair_budget_cap_cents: 1000000 }
              as: SystemAdmin
              captures: { terr_id: "$.data.id" }
            - call: "POST /gas-ops/technicians"
              payload: { full_name: "Lee", badge_number: "B104", home_territory_id: "${terr_id}", hourly_rate_cents: 6000 }
              as: SystemAdmin
              captures: { tech_id: "$.data.id" }
            - call: "POST /gas-ops/technicians/${tech_id}/shifts"
              payload: { shift_start: "2026-08-01T00:00:00Z", shift_end: "2026-08-05T00:00:00Z" }
              as: Supervisor
            - call: "POST /gas-ops/emergency-calls"
              payload: { caller_name: "M", caller_phone: "555-0211", address_line: "13 Merge Ave", city: "Springfield", territory_id: "${terr_id}", location_context: "INSIDE_STRUCTURE", odor_reported: true, symptoms_reported: false, hissing_reported: false }
              as: Dispatcher
              captures: { inc_s: "$.data.incident_id" }
            - call: "POST /gas-ops/incidents/${inc_s}/triage"
              payload: { priority: "P2" }
              as: Dispatcher
            - call: "POST /gas-ops/incidents/${inc_s}/dispatches"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
              captures: { disp_s: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:20:00Z" }
              as: SystemAdmin
            - call: "POST /gas-ops/dispatches/${disp_s}/arrive"
              payload: {}
              as: FieldTechnician
              as_user_id: "${tech_id}"
            - call: "POST /gas-ops/incidents/${inc_s}/atmospheric-readings"
              payload: { pct_lel: 0.5, co_ppm: 0, reading_context: "INSIDE" }
              as: FieldTechnician
              as_user_id: "${tech_id}"
            - call: "POST /gas-ops/incidents/${inc_s}/make-safe/complete"
              payload: { leak_confirmed: false, no_make_safe_required: true }
              as: FieldTechnician
              as_user_id: "${tech_id}"
            - call: "POST /gas-ops/dispatches/${disp_s}/clear"
              payload: {}
              as: FieldTechnician
              as_user_id: "${tech_id}"
            - call: "POST /gas-ops/incidents/${inc_s}/close"
              payload: {}
              as: Supervisor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T01:00:00Z" }
              as: SystemAdmin
            - call: "POST /gas-ops/emergency-calls"
              payload: { caller_name: "N", caller_phone: "555-0212", address_line: "13 Merge Ave", city: "Springfield", territory_id: "${terr_id}", location_context: "INSIDE_STRUCTURE", odor_reported: true, symptoms_reported: false, hissing_reported: false }
              as: Dispatcher
              captures: { inc_t: "$.data.incident_id", cls_t: "$.data.classification" }
            - call: "POST /gas-ops/incidents/${inc_t}/triage"
              payload: { priority: "P2" }
              as: Dispatcher
            - call: "POST /gas-ops/emergency-calls"
              payload: { caller_name: "O", caller_phone: "555-0213", address_line: "13 Merge Ave", city: "Springfield", territory_id: "${terr_id}", location_context: "INSIDE_STRUCTURE", odor_reported: true, symptoms_reported: false, hissing_reported: false }
              as: Dispatcher
          trigger:
            - call: "POST /gas-ops/incidents/${inc_t}/merge-duplicate"
              payload: { source_incident_id: "${inc_s}" }
              as: Supervisor
              captures: { err: "$.data.error_id" }
            - call: "POST /gas-ops/incidents/${inc_s}/triage"
              payload: { priority: "P1" }
              as: Dispatcher
              captures: { err2: "$.data.error_id" }
          assert:
            - "New call at 80h (past the 72h recurrence window) created a PRIMARY incident (cls_t == PRIMARY, inc_t != inc_s)"
            - "Merging CLOSED source S into T: error_id == ERR_INVALID_STATE (source must be NEW/TRIAGED/DISPATCHED), HTTP 409"
            - "S remains CLOSED; S.version unchanged by the failed merge"
            - "Second trigger: triage on CLOSED S -> err2 == ERR_INCIDENT_NOT_ACTIVE (terminal-ish lockdown of CLOSED for triage)"

