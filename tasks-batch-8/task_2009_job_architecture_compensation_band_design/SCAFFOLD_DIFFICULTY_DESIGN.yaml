      - name: safety_beats_constraint_on_band_approve
        grounds:
          - validations[priority=8]
          - validations[priority=12]
          - errors[ERR_FLSA_SALARY_BASIS_VIOLATION]
          - errors[ERR_BAND_OVERLAP_EXCEEDS_POLICY]
