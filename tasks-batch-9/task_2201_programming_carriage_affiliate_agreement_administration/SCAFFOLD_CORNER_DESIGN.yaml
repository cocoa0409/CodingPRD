                action: "ACCEPT"
              as: RevenueAccountant
              as_user_id: "u-rev-1"
          assert:
            - "the filing returns 201 with data.provisional_fee_cents == 3120000 and data.tier_placement_breach == true"
            - "the ACCEPT returns 200 with data.license_fee_due_cents == 3120000 and data.rate_applied_cents_per_sub == 40.0000"
            - "response body data.billable_subscribers == 130000 and data.penetration_pct == 0.6500"
            - "GET /carriage/agreements/${ac_id} returns penetration_compliance_status == \"COMPLIANT\" — a tier breach is NOT a penetration breach"
            - "GET /carriage/agreements/${ac_id} returns recognized_revenue_cents == 3120000"

      - name: penetration_pct_rounds_half_up_at_four_decimals
        claim_type: precision
        grounds:
          - calculations.subscriber_report_license_fee
          - entities.SubscriberReport.fields.penetration_pct
          - entities.SubscriberReport.fields.provisional_fee_cents
        distinguishing_aspect: >-
          130,010 of 200,000 homes is exactly 0.65005, which round_half_up at four
          decimals must render as 0.6501 (not the round-half-even 0.6500), while the
          fee itself is computed from the raw subscriber count 130,010 and not from
          the rounded percentage — 5,200,400 cents.
        test_recipe:
          setup:
            - "Cliffside Telco (200,000 homes) with an executed 40.0000-cent flat agreement, 0.50 floor."
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Cliffside Telco"
                distributor_type: "TELCO"
                rate_card_class: "CLASS_B"
                total_subscribers: 200000
