          setup:
            - "Clock 2026-09-01T00:00:00Z; facility CCN-0001 (NEAREST_CENT); revenue code 0300; department CC-100 (manager mgr_cath); COST_PLUS_MARKUP rule with the default tiers."
            - "Item CDM-1003 (code 93470, cost 100000, gross 240000) driven only as far as APPROVED (version 4, PRICED_CURRENT) — never activated."
            - "CodeUpdateCycle 2027/CPT with a single REVISE entry 93470 -> 93470A, mapped by ria_1 and crosswalk-approved by pca_1, so the cycle sits in CROSSWALK_APPROVED and the entry is MAPPED with carried_gross_charge_cents 240000."
