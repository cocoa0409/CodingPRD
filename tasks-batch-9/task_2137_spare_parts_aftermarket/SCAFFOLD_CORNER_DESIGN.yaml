              as_user_id: "ctrl-1"
              captures: { ro_id: $.data.id }
            - call: "POST /aftermarket/replenishment-orders/${ro_id}/approve"
              payload: {}
              as: InventoryController
              as_user_id: "ctrl-1"
            - call: "POST /aftermarket/replenishment-orders/${ro_id}/ship"
              payload: {}
              as: InventoryController
              as_user_id: "ctrl-1"
            - call: "POST /aftermarket/replenishment-orders/${ro_id}/receive"
              payload: {}
              as: InventoryController
              as_user_id: "ctrl-1"
            - call: "POST /aftermarket/work-orders"
              payload: { installed_unit_id: "${u_id}", work_type: "SCHEDULED_MAINTENANCE", downtime_priority: "PLANNED" }
              as: DealerUser
              as_user_id: "${d_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /aftermarket/work-orders/${wo_id}/part-lines"
              payload: { part_id: "${p_id}", qty_requested: 2 }
              as: DealerUser
              as_user_id: "${d_id}"
              captures: { line_id: $.data.id }
            - call: "POST /aftermarket/work-order-part-lines/${line_id}/consume"
              payload: { qty_consumed: 2 }
              as: DealerUser
              as_user_id: "${d_id}"
            - call: "POST /aftermarket/return-authorizations"
              payload: { work_order_part_line_id: "${line_id}", qty_returned: 2, return_reason: "WRONG_PART" }
              as: DealerUser
              as_user_id: "${d_id}"
              captures: { rma_id: $.data.id }
            - call: "POST /aftermarket/return-authorizations/${rma_id}/approve"
              payload: {}
              as: AftermarketPlanner
              as_user_id: "planner-1"
          trigger:
            - call: "POST /aftermarket/return-authorizations/${rma_id}/inspect"
              payload: { disposition: "RESTOCK" }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 409 and data.error_id == ERR_RETURN_STATE_INVALID"
            - "ReturnAuthorization.${rma_id}.status == APPROVED and disposition == null and credit_posted_cents == 0"
            - "Part.${p_id}.quarantine_units == 0 and on_hand_units == 8"
            - "Dealer.${d_id}.outstanding_balance_cents == 3599 and lifetime_restocking_fee_cents == 0"

      - name: error_stale_part_version_is_triggerable
        claim_type: Violation → Error
        grounds:
          - errors[ERR_STALE_PART_VERSION]
        excluded_because:
          difficulty_instance: dual_variant_calc / ltb_decay_vs_flat_quantity_divergence_on_campaign
          rationale: "Covered by the dedicated cross_cutting_layers instance occ_stale_part_version_rejects_second_campaign_create, whose happy path is that difficulty instance."

      - name: error_ltb_window_overlap_and_cooldown_are_triggerable
        claim_type: Violation → Error
        grounds:
          - errors[ERR_LTB_WINDOW_OVERLAP]
          - errors[ERR_LTB_COOLDOWN_VIOLATION]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / ltb_window_half_open_with_symmetric_thirty_day_cooldown
          rationale: "Both error ids are asserted on separate trigger calls in that instance."

      - name: error_applicability_revision_overlap_is_triggerable
        claim_type: Violation → Error
        grounds:
          - errors[ERR_APPLICABILITY_REVISION_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / applicability_build_revision_closed_interval_adjacency_allowed
          rationale: "Asserted twice in that instance, once for the touching interval and once for the open-ended one."

      - name: error_forecast_input_empty_is_triggerable
        claim_type: Violation → Error
        grounds:
          - errors[ERR_FORECAST_INPUT_EMPTY]
        excluded_because:
          difficulty_instance: boundary_precision_check / forecast_lookback_window_half_open_excludes_exact_boundary
          rationale: "The 365-day call in that instance is exactly the empty-input-set failure path."

      - name: error_part_lifecycle_invalid_is_triggerable
        claim_type: Violation → Error
        grounds:
          - errors[ERR_PART_LIFECYCLE_INVALID]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / campaign_submit_gated_by_part_lifecycle_phase_out
          rationale: "Asserted there and again in replenishment_receive_gated_by_part_obsolete."
