            - "after trigger call 1: Investigation.${inv_id}.status == \"FINDINGS_LOCKED\", published_at == null, disclosure_risk_score == null, applicable_risk_variant == null"
            - "after trigger call 1: SubjectResponseRequest.${subj_id}.status == \"NOTICE_SENT\" (48h elapsed, so the NO_RESPONSE pre-step does not fire), attempt_count == 2, response_deadline_at == \"2026-08-23T09:00:00Z\""
            - "trigger call 2: FieldDefinition.${fd_zip_id}.suppression_applied == true and suppression_method == \"COARSEN_BUCKET\""
            - "trigger call 3 (control, risk gate now satisfied because AGGREGATE_MAX falls to 30): HTTP 422 with error_id == \"ERR_INSUFFICIENT_NOTICE\" (priority 170)"
