        grounds:
          - errors.ERR_SUPERVISING_BROKER_INELIGIBLE
          - validations[priority=22]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / posture_safety_priority16_outranks_supervising_broker_referential_priority22
          rationale: "Same instance: it is the loser at priority 22 while the posture violation stands, then becomes the returned error once the posture is cured with the same ineligible supervising broker still named."
      - name: err_segregation_of_duties_is_triggerable
