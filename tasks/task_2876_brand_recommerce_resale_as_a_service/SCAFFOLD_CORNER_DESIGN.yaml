            - "the ProgramAdmin repeats all return 201 — ${ok_cust}, ${ok_grade}, ${ok_credit} and ${ok_chan} are non-null and ${ok_tier} == STANDARD, so the refused create left no row occupying the unique email or code"
            - "${ok_tier2} == PLUS and ${ok_ver2} == 2 — the admin PATCH lands where the manager PATCH was refused"
            - "${ok_expired} == 0 — the sweep runs for ProgramAdmin and is a no-op on a grant-free database"

      - name: intake_and_authentication_steps_admit_only_their_own_role
        claim_type: other_roles_exclusive_operations_denied
        grounds:
          - roles.IntakeAgent.exclusive_operations
          - roles.Authenticator.exclusive_operations
          - complexity_profile.role_model
        distinguishing_aspect: "ProgramAdmin is refused /receive and /authenticate alongside the wrong operational roles: the role model is segregation_of_duties, not hierarchical_override, so the admin's broad configuration authority buys no operational shortcut."
        test_recipe:
          setup:
            - "One SUBMITTED trade-in exists at the default clock."
          setup_api_calls:
            - call: "POST /recommerce/grade-policies"
              payload: { product_category: "OUTERWEAR", condition_grade: "B", base_credit_pct_bp: 2000, resale_price_pct_bp: 3900, refurb_budget_cap_pct_bp: 3000, restock_fee_pct_bp: 1200, warranty_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin-001"
            - call: "POST /recommerce/credit-policies"
              payload: { code: "CORE-2026", expiry_days: 180, mail_in_bonus_pct_bp: 1000, max_redemption_pct_bp: 5000, min_cash_remainder_minor: 500, eligible_assortment: "BOTH" }
              as: ProgramAdmin
              as_user_id: "admin-001"
