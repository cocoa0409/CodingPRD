              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: sm_lot_cycle_recheck_covered_by_difficulty
        claim_type: valid_transition
        grounds: ["state_machines.SeedLot.ACTIVE_to_QUARANTINE"]
        excluded_because:
          difficulty_instance: seed_lot_active_quarantine_recheck_cycle
          rationale: "Cycle edges ACTIVE->QUARANTINE->ACTIVE asserted with derived-field rewrite in §1.8."

      - name: sm_dispute_loop_covered_by_difficulty
        claim_type: valid_transition
        grounds: ["state_machines.Checkout.DISPUTED_to_RETURNED"]
        excluded_because:
          difficulty_instance: checkout_return_dispute_loop_cycle
          rationale: "Two full RETURNED<->DISPUTED loop iterations plus terminal WRITE_OFF asserted in §1.8."

      - name: sm_recall_cascade_covered_by_difficulty
        claim_type: side_effect_execution
        grounds: ["state_machines.SeedPacket.CHECKED_OUT_to_RECALLED"]
        excluded_because:
          difficulty_instance: certify_fail_recall_cascade_depth3
          rationale: "Recall cascade including checkout flagging asserted hop-by-hop in §1.8."

      - name: sm_event_cancel_cascade_covered_by_difficulty
        claim_type: side_effect_execution
        grounds: ["state_machines.SwapEvent.INTAKE_OPEN_to_CANCELLED"]
        excluded_because:
          difficulty_instance: event_cancel_credit_revocation_cascade_depth2
          rationale: "Cancel cascade with credit revocation asserted in §1.8."

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: calc_overdue_sweep_boundary_strict_inequality
        claim_type: boundary
        grounds: ["calculations.overdue_sweep"]
        distinguishing_aspect: "A checkout whose due_at is EXACTLY now stays ACTIVE (strict '<'); one second past due flips to OVERDUE. Boundary semantics pinned in the sweep formula."
        test_recipe:
          setup: ["ACTIVE lot, 2 packets; member M1 with checkout C1 created 2026-08-01 (due 2026-08-22T00:00:00Z); member M2 with checkout C2 created same instant"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "LIBRARY_BRANCH", region_zone: "ZONE_5A", label_stock_count: 5 }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "V", species: "Sp", category: "VEGETABLE", approved_zones: ["ZONE_5A"] }
              as: ProgramAdmin
              captures: { v_id: "$.data.id" }
            - call: "POST /api/seed-lots"
              payload: { variety_id: "${v_id}", home_site_id: "${s_id}", lot_code: "OB1", harvest_year: 2026, seeds_received: 100, provisional_viability_pct: 90.00 }
              as: ProgramAdmin
              captures: { lot_id: "$.data.id" }
            - call: "POST /api/volunteers"
              payload: { email: "v@x.com", full_name: "V" }
              as: ProgramAdmin
              captures: { vol_id: "$.data.id" }
            - call: "POST /api/volunteers/${vol_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/submit-for-review"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/germination-tests"
              payload: { seeds_tested: 100, sprouted_count: 90 }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { t_id: "$.data.id" }
            - call: "POST /api/germination-tests/${t_id}/certify"
              payload: { outcome: "PASS" }
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/pack"
              payload: { packet_count: 2, seeds_per_packet: 10 }
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "GET /api/seed-packets?lot_id=${lot_id}"
              as: ProgramAdmin
              captures: { p1: "$.data[0].id", p2: "$.data[1].id" }
            - call: "POST /api/members"
              payload: { email: "m1@x.com", full_name: "M1", home_site_id: "${s_id}" }
              as: ProgramAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /api/members"
              payload: { email: "m2@x.com", full_name: "M2", home_site_id: "${s_id}" }
              as: ProgramAdmin
              captures: { m2: "$.data.id" }
            - call: "POST /api/checkouts"
              payload: { member_id: "${m1}", packet_id: "${p1}" }
              as: Member
              as_user_id: "${m1}"
              captures: { c1: "$.data.id", due1: "$.data.due_at" }
            - call: "POST /api/checkouts"
              payload: { member_id: "${m2}", packet_id: "${p2}" }
              as: Member
              as_user_id: "${m2}"
              captures: { c2: "$.data.id" }
            # clock to exactly due_at: 2026-08-22T00:00:00Z -> sweep flips nothing (strict <)
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-22T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/ops/run-daily-sweep"
              payload: {}
              as: ProgramAdmin
              captures: { flipped_at_due: "$.data.overdue_flipped_count" }
            # one second past due -> both flip
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-22T00:00:01Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /api/ops/run-daily-sweep"
              payload: {}
              as: ProgramAdmin
              captures: { flipped_after: "$.data.overdue_flipped_count" }
            - call: "GET /api/checkouts/${c1}"
              as: ProgramAdmin
              captures: { c1_st: "$.data.status" }
          assert:
            - "due1 == '2026-08-22T00:00:00Z'   # created 2026-08-01 default clock + 21 days"
            - "flipped_at_due == 0              # due_at == now does NOT flip"
            - "flipped_after == 2               # one second past due flips both"
            - "c1_st == OVERDUE"

      - name: calc_germination_result_rounding_half_up
        claim_type: precision
        grounds: ["calculations.germination_viability", "entities.GerminationTest.fields.result_pct"]
        distinguishing_aspect: "1 sprout of 3 tested yields result_pct 33.33 (2dp round_half_up of 33.333...); the rounding mode is observable at the third decimal."
        test_recipe:
          setup: ["lot QUARANTINE; volunteer approved"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "GARDEN", region_zone: "ZONE_7A" }
