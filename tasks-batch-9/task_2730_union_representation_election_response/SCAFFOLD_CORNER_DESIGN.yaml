        excluded_because:
          difficulty_instance: dual_variant_calc / voter_list_deadline_directed_anchor
          rationale: "The named \u00a71.8 instance asserts that the DIRECTED variant anchors on decision_date while the STIPULATED variant anchors on the approval clock, from the same wall-clock instant."

