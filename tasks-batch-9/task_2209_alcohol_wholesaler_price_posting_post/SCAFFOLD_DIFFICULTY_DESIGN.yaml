            - "the trigger returns HTTP 200 with validation_status == FLAGGED"
            - "InvoiceLine.${line_zero}.gross_cents == 55000, which is 0 cases plus 5 bottles at 11000"
            - "InvoiceLine.${line_zero}.quantity_discount_cents == 0 because min_cases 2 is not <= 0, so the eligible tier set is empty"
            - "InvoiceLine.${line_zero}.allowed_promotional_cents == 2750 and InvoiceLine.${line_zero}.excess_promotional_cents == 0, since floor(55000 * 0.05) == 2750"
            - "InvoiceLine.${line_zero}.allowed_depletion_cents == 0 and InvoiceLine.${line_zero}.excess_depletion_cents == 1, because the depletion cap is 0 * 150 == 0"
            - "InvoiceLine.${line_zero}.net_price_cents == 52250"
            - "InvoiceLine.${line_zero}.posted_gross_cents == 55000 and InvoiceLine.${line_zero}.variance_cents == 0"
            - "InvoiceLine.${line_zero}.finding_variance_cents == 1 and InvoiceLine.${line_zero}.is_off_posted == true, even though the charged prices equal the posted prices exactly"
            - "InvoiceLine.${line_two}.quantity_discount_cents == 24000, which is 2 cases times 120000 minus 108000, so min_cases 2 is eligible at exactly 2 cases"
            - "InvoiceLine.${line_two}.allowed_depletion_cents == 300 and InvoiceLine.${line_two}.excess_depletion_cents == 0, the same per-case allowance fully allowed at a non-zero case count"
            - "InvoiceLine.${line_two}.net_price_cents == 215700 and InvoiceLine.${line_two}.is_off_posted == false"
            - "RetailerInvoice.${inv_a}.subtotal_cents == 267950, RetailerInvoice.${inv_a}.surcharge_cents == 0 and RetailerInvoice.${inv_a}.total_cents == 267950"
            - "RetailerInvoice.${inv_a}.total_allowance_cents == 3050"
            - "RetailerInvoice.${inv_a}.off_posted_line_count == 1 and RetailerInvoice.${inv_a}.total_variance_cents == 1"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: retailer_invoice_revalidation_is_gated_by_the_collecting_compliance_audit_state
        grounds:
          - state_machines.RetailerInvoice.FLAGGED_to_FLAGGED
          - state_machines.ComplianceAudit.OPEN_to_COLLECTED
          - state_machines.ComplianceAudit.ASSESSED_to_VOID
          - entities.RetailerInvoice.fields.audit_status
          - validations[priority=8]
        distinguishing_aspect: |
          The dependent pair here is RetailerInvoice on ComplianceAudit: the invoice's own FLAGGED_to_FLAGGED edge and
          its ability to accept a new InvoiceLine are both governed by audit_status, a field only the audit aggregate
          writes. The same unchanged invoice is refused with ERR_INVALID_STATE while the audit is COLLECTED and again
          while it is ASSESSED, and is admitted again the moment the audit goes VOID — three audit states mapping to
          one invoice gate, with no edit to the invoice in between.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, StateProgram TX at declared defaults (off_posted_penalty_rate_pct 0.40)."
            - "Wholesaler A with a filing agent, a certifying officer and an APPROVED brand Rio Reserve."
            - "One schedule for posting month 2026-09 carrying item A at case 120000 / unit 11000, submitted on time, certified, and made EFFECTIVE by a posting run after the clock moves to 2026-10-01T00:00:00Z."
            - "An invoice dated 2026-10-05T00:00:00Z carries one line of 1 case charged at 115000 against the posted 120000, so validation lands it in FLAGGED with off_posted_line_count 1 and total_variance_cents 5000."
            - "A compliance audit for period 2026-10 is opened and collected, so the invoice's audit_status is UNDER_AUDIT and audit_id points at that audit, while its validation_status is still FLAGGED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-programs"
              payload: { state_code: "TX", program_name: "Texas Price Posting Program" }
              as: ComplianceOfficer
