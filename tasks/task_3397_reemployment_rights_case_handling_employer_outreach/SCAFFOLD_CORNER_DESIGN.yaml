            - "GET /reemployment/members/${memb_id}/service-periods returns exactly 1 row, the E2 period"
            - "GET /reemployment/employers/${emp_id}/statements-of-support returns 1 row; for ${emp2_id} returns 0 rows"

      - name: second_benefit_assessment_for_same_case_rejected
