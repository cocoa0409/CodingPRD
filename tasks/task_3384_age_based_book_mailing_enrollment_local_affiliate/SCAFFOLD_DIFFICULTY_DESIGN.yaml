  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: manifest_blocked_until_all_band_selections_locked
        grounds:
          - state_machines.MailingWave.SCHEDULED_to_MANIFESTED
          - state_machines.AgeBandSelection.APPROVED_to_LOCKED
          - errors.ERR_MANIFEST_SELECTIONS_INCOMPLETE
        distinguishing_aspect: |
          Pair MailingWave -> AgeBandSelection: a wave whose FOUR-band selection
          is merely APPROVED (print order SUBMITTED, not CONFIRMED) cannot
          manifest; confirming that order locks the selection and the identical
          manifest call then succeeds.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Five titles; five 2026-10 selections approved; print orders confirmed for INFANT/TODDLER/TWO/THREE (4 bands LOCKED); FOUR-band print order created but NOT confirmed."
          setup_api_calls:
            - *c_sep
            - *t_inf
            - *t_tod
            - *t_two
            - *t_three
            - *t_four
            - *s_inf_o
            - *s_inf_o_ok
            - *s_tod_o
            - *s_tod_o_ok
            - *s_two_o
            - *s_two_o_ok
            - *s_three_o
            - *s_three_o_ok
            - *s_four_o
            - *s_four_o_ok
            - *p_inf_o
            - *p_inf_o_ok
            - *p_tod_o
            - *p_tod_o_ok
            - *p_two_o
            - *p_two_o_ok
            - *p_three_o
            - *p_three_o_ok
            - *p_four_o
            - *wave_o
          trigger:
            - call: "POST /library/waves/${wave_o_id}/manifest"
              payload: {}
              as: MailOps
              captures: { err_mani: $.data.error_id }
            - *p_four_o_ok
            - *wave_o_go
          assert:
            - "first manifest returns 409 with data.error_id == \"ERR_MANIFEST_SELECTIONS_INCOMPLETE\" (FOUR selection still APPROVED)"
            - "after confirming the FOUR order: AgeBandSelection.${sel_four_o}.status == LOCKED"
            - "second manifest returns 200 with MailingWave.${wave_o_id}.status == MANIFESTED and manifested_item_count == 0 (no children registered)"

      - name: transfer_branch_depends_on_target_agreement_state
        grounds:
          - state_machines.AddressChange.PENDING_to_APPLIED_TRANSFER
          - state_machines.AddressChange.PENDING_to_APPLIED_UNENROLLED
          - entities.Affiliate.fields.operative
        distinguishing_aspect: |
          Pair AddressChange -> AffiliateAgreement: with the target affiliate's
          agreement still PENDING_APPROVAL, the same decide(APPROVE) takes the
          APPLIED_UNENROLLED branch; once that agreement is ACTIVE the identical
          request shape takes APPLIED_TRANSFER — the branch is decided by the
          other entity's state.
        test_recipe:
          setup:
            - "Bootstrap core with affiliate A and children c1, c2. Affiliate B (prefixes [371]) exists with an agreement created but NOT yet approved."
          setup_api_calls:
            - *c_sep
            - *prog
            - *aff_a
            - *agr_a
            - *agr_a_ok
            - *aff_b
            - *agr_b
            - *c1
            - *c2
            - call: "POST /library/children/${c1_id}/address-changes"
              payload: { new_address: { line1: "7 Beale St", city: "Memphis", region: "TN", postal_code: "37103", country: "US" } }
              as: AffiliateCoordinator
              as_user_id: "${aff_a_id}"
              captures: { ac_pend: $.data.id }
          trigger:
            - call: "POST /library/address-changes/${ac_pend}/decide"
              payload: { outcome: "APPROVE" }
              as: AffiliateCoordinator
              as_user_id: "${aff_a_id}"
            - *agr_b_ok
            - call: "POST /library/children/${c2_id}/address-changes"
              payload: { new_address: { line1: "8 Beale St", city: "Memphis", region: "TN", postal_code: "37105", country: "US" } }
              as: AffiliateCoordinator
              as_user_id: "${aff_a_id}"
              captures: { ac_live: $.data.id }
            - call: "POST /library/address-changes/${ac_live}/decide"
              payload: { outcome: "APPROVE" }
              as: AffiliateCoordinator
              as_user_id: "${aff_a_id}"
          assert:
            - "first decide: AddressChange.${ac_pend}.status == APPLIED_UNENROLLED and resulting_child_id is null (B not operative)"
            - "Child.${c1_id}.enrollment_status == UNENROLLED and unenroll_reason == MOVED_OUT_OF_AREA"
            - "second decide (after B's agreement ACTIVE): AddressChange.${ac_live}.status == APPLIED_TRANSFER and resulting_child_id is non-null"
            - "Child.${c2_id}.enrollment_status == TRANSFERRED_OUT and Affiliate.${aff_b_id}.enrolled_count == 1"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: agreement_window_half_open_adjacency
        grounds:
          - state_machines.AffiliateAgreement.PENDING_APPROVAL_to_ACTIVE
          - errors.ERR_AGREEMENT_GEOGRAPHY_OVERLAP
          - validations[priority=11]
        distinguishing_aspect: |
          Interval semantics: half-open date windows on intersecting postal
          geographies. C's 2026-06-01..2027-06-01 window overlaps A's ACTIVE
          2026-01-01..2028-01-01 window on shared prefix 372 -> 409; but
          2028-01-01..2029-01-01 is adjacent (a.effective_to == b.effective_from)
          and MUST be approved.
        test_recipe:
          setup:
            - "Bootstrap core: affiliate A (prefixes 372/370) ACTIVE agreement 2026-01-01..2028-01-01. Affiliate C (prefixes [373, 372]) created under the same program."
          setup_api_calls:
            - *c_sep
            - *prog
            - *aff_a
            - *agr_a
            - *agr_a_ok
            - call: "POST /library/affiliates"
              payload: { name: "Chattanooga Reads", state_program_id: "${prog_id}", postal_prefixes: ["373", "372"], contact_email: "coord@cr.org" }
              as: PlatformAdmin
              captures: { aff_c_id: $.data.id, aff_c_v: $.data.version }
            - call: "POST /library/affiliates/${aff_c_id}/agreements"
              payload: { effective_from: "2026-06-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z", local_fundraising_commitment_cents: 1000000, expected_affiliate_version: "${aff_c_v}" }
              as: AffiliateCoordinator
              as_user_id: "${aff_c_id}"
              captures: { agr_c1: $.data.id }
          trigger:
            - call: "POST /library/agreements/${agr_c1}/approve"
              payload: {}
              as: StateProgramOfficer
              as_user_id: "${prog_id}"
              captures: { err_ovl: $.data.error_id }
            - call: "POST /library/agreements/${agr_c1}/reject"
              payload: {}
              as: StateProgramOfficer
              as_user_id: "${prog_id}"
            - call: "GET /library/affiliates/${aff_c_id}"
              payload: {}
              as: PlatformAdmin
              captures: { aff_c_v2: $.data.version }
            - call: "POST /library/affiliates/${aff_c_id}/agreements"
              payload: { effective_from: "2028-01-01T00:00:00Z", effective_to: "2029-01-01T00:00:00Z", local_fundraising_commitment_cents: 1000000, expected_affiliate_version: "${aff_c_v2}" }
              as: AffiliateCoordinator
              as_user_id: "${aff_c_id}"
              captures: { agr_c2: $.data.id }
            - call: "POST /library/agreements/${agr_c2}/approve"
              payload: {}
              as: StateProgramOfficer
              as_user_id: "${prog_id}"
          assert:
            - "first approve returns 409 with data.error_id == \"ERR_AGREEMENT_GEOGRAPHY_OVERLAP\" (windows intersect 2026-06..2027-06 on prefix 372)"
            - "AffiliateAgreement.${agr_c1}.status stays PENDING_APPROVAL until the reject"
            - "adjacent agreement (starts exactly at A's effective_to) approves 200: AffiliateAgreement.${agr_c2}.status == ACTIVE"
            - "Affiliate.${aff_c_id}.version == 3 after two creates (each create bumps version by 1)"

      - name: press_capacity_monthly_aggregate_boundary
        grounds:
          - calculations.press_capacity_consumed
          - errors.ERR_PRESS_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          Interval semantics: aggregate capacity over a production month (NOT
          pairwise interval intersection). Two 200000-unit orders for mailing
          month 2027-01 (production 2026-12) sum to exactly 400000 and BOTH
          confirm (<= capacity); a third order of quantity 1 pushes the
          aggregate to 400001 and is rejected.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Three titles; three selections for 2027-01 (INFANT, TODDLER, TWO), all approved. Three print orders created: 200000, 200000, 1."
          setup_api_calls:
            - *c_sep
            - *t_inf
            - *t_tod
            - *t_two
            - call: "POST /library/selections"
              payload: { mailing_month: "2027-01", age_band: "INFANT", title_id: "${t_inf}" }
              as: AdvisoryCommitteeMember
              as_user_id: "acm-ada"
              captures: { sel_j1: $.data.id }
            - call: "POST /library/selections/${sel_j1}/approve"
              payload: {}
              as: AdvisoryCommitteeMember
              as_user_id: "acm-ben"
            - call: "POST /library/selections"
              payload: { mailing_month: "2027-01", age_band: "TODDLER", title_id: "${t_tod}" }
              as: AdvisoryCommitteeMember
              as_user_id: "acm-ada"
              captures: { sel_j2: $.data.id }
            - call: "POST /library/selections/${sel_j2}/approve"
              payload: {}
              as: AdvisoryCommitteeMember
              as_user_id: "acm-ben"
            - call: "POST /library/selections"
              payload: { mailing_month: "2027-01", age_band: "TWO", title_id: "${t_two}" }
              as: AdvisoryCommitteeMember
              as_user_id: "acm-ada"
              captures: { sel_j3: $.data.id }
            - call: "POST /library/selections/${sel_j3}/approve"
              payload: {}
              as: AdvisoryCommitteeMember
              as_user_id: "acm-ben"
            - call: "POST /library/print-orders"
              payload: { selection_id: "${sel_j1}", quantity: 200000, is_reprint: false }
              as: PublisherOps
              captures: { po_j1: $.data.id }
            - call: "POST /library/print-orders"
              payload: { selection_id: "${sel_j2}", quantity: 200000, is_reprint: false }
              as: PublisherOps
              captures: { po_j2: $.data.id }
            - call: "POST /library/print-orders"
              payload: { selection_id: "${sel_j3}", quantity: 1, is_reprint: false }
              as: PublisherOps
              captures: { po_j3: $.data.id }
          trigger:
            - call: "POST /library/print-orders/${po_j1}/confirm"
              payload: {}
              as: PublisherOps
            - call: "POST /library/print-orders/${po_j2}/confirm"
              payload: {}
              as: PublisherOps
            - call: "POST /library/print-orders/${po_j3}/confirm"
              payload: {}
              as: PublisherOps
              captures: { err_cap: $.data.error_id }
          assert:
            - "PrintOrder.${po_j1}.status == CONFIRMED with unit_cents == 140, plate_fee_cents == 0, total_cents == 28000000"
            - "PrintOrder.${po_j2}.status == CONFIRMED (aggregate 400000 == PRESS_MONTHLY_CAPACITY is allowed, boundary inclusive)"
            - "third confirm returns 409 with data.error_id == \"ERR_PRESS_CAPACITY_EXCEEDED\" (aggregate would be 400001)"
            - "PrintOrder.${po_j3}.status stays SUBMITTED and AgeBandSelection.${sel_j3}.status stays APPROVED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: transfer_conserves_global_enrollment_count
        grounds:
          - state_machines.Child.ACTIVE_to_TRANSFERRED_OUT
          - calculations.enrolled_count_reconciliation
          - entities.Child.fields.transfer_source_child_id
        distinguishing_aspect: |
          Conserved quantity: global non-terminal enrollment count. The transfer
          pair (source TRANSFERRED_OUT + compensating new ACTIVE enrollment)
          leaves sum(enrolled_count over all affiliates) unchanged: 3 + 1 = 4
          before, 2 + 2 = 4 after.
        test_recipe:
          setup:
            - "Bootstrap core with affiliate A (children c1, c2, c3) and affiliate B (prefixes [371], ACTIVE agreement, one own child b1)."
          setup_api_calls:
            - *c_sep
            - *prog
            - *aff_a
            - *agr_a
            - *agr_a_ok
            - *aff_b
            - *agr_b
            - *agr_b_ok
            - *c1
            - *c2
            - *c3
            - call: "POST /library/children"
              payload: { affiliate_id: "${aff_b_id}", full_name: "Jo Knapp", family_name: "Knapp", birth_date: "2026-03-01T00:00:00Z", mailing_address: { line1: "11 Front St", city: "Memphis", region: "TN", postal_code: "37101", country: "US" } }
              as: AffiliateCoordinator
              as_user_id: "${aff_b_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /library/children/${c1_id}/address-changes"
              payload: { new_address: { line1: "7 Beale St", city: "Memphis", region: "TN", postal_code: "37103", country: "US" } }
              as: AffiliateCoordinator
              as_user_id: "${aff_a_id}"
              captures: { ac_inv: $.data.id }
          trigger:
            - call: "POST /library/address-changes/${ac_inv}/decide"
              payload: { outcome: "APPROVE" }
              as: AffiliateCoordinator
              as_user_id: "${aff_a_id}"
          assert:
            - "before: Affiliate.${aff_a_id}.enrolled_count == 3 and Affiliate.${aff_b_id}.enrolled_count == 1 (global 4)"
            - "after: Affiliate.${aff_a_id}.enrolled_count == 2 and Affiliate.${aff_b_id}.enrolled_count == 2 (global still 4)"
            - "Child.${c1_id}.enrollment_status == TRANSFERRED_OUT and the new child on B has transfer_source_child_id == ${c1_id}"
            - "no child is double counted: GET /library/children?enrollment_status=ACTIVE returns exactly 4 rows (c2, c3, b1, and the new B-side enrollment)"

      - name: dispute_credit_memo_conserves_invoice_gross
        grounds:
          - state_machines.AffiliateInvoice.DISPUTED_to_ADJUSTED
          - calculations.invoice_cost_share
          - entities.AffiliateInvoice.fields.credit_memo_cents
        distinguishing_aspect: |
          Conserved quantity: invoiced dollars. Issue then dispute-RESOLVE_UPHELD
          with a 224c credit leaves gross invariant: state_share_cents (330,
          untouched) + local_share_cents (342 - 224 = 118) + credit_memo_cents
          (224) == gross_cents (672) exactly.
        test_recipe:
          setup:
            - "Full bootstrap through wave 2026-10 reconcile; DRAFT invoice (item_count 3, gross 672, state 330, local 342) issued."
          setup_api_calls:
            - *c_sep
            - *prog
            - *aff_a
            - *agr_a
            - *agr_a_ok
            - *pop_a
            - *t_inf
            - *t_tod
            - *t_two
            - *t_three
            - *t_four
            - *s_inf_o
            - *s_inf_o_ok
            - *s_tod_o
            - *s_tod_o_ok
            - *s_two_o
            - *s_two_o_ok
            - *s_three_o
            - *s_three_o_ok
            - *s_four_o
            - *s_four_o_ok
            - *p_inf_o
            - *p_inf_o_ok
            - *p_tod_o
            - *p_tod_o_ok
            - *p_two_o
            - *p_two_o_ok
            - *p_three_o
            - *p_three_o_ok
            - *p_four_o
            - *p_four_o_ok
            - *c1
            - *c2
            - *c3
            - *wave_o
            - *wave_o_go
            - *wave_o_rec
            - *inv_o
            - call: "POST /library/invoices/${inv_o_id}/issue"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /library/invoices/${inv_o_id}/dispute"
              payload: { outcome: "OPEN" }
              as: AffiliateCoordinator
              as_user_id: "${aff_a_id}"
            - call: "POST /library/invoices/${inv_o_id}/dispute"
              payload: { outcome: "RESOLVE_UPHELD", credit_amount_cents: 224 }
              as: PlatformAdmin
            - call: "POST /library/invoices/${inv_o_id}/pay"
              payload: {}
              as: AffiliateCoordinator
              as_user_id: "${aff_a_id}"
          assert:
            - "after OPEN: AffiliateInvoice.${inv_o_id}.status == DISPUTED"
            - "after RESOLVE_UPHELD: status == ADJUSTED, credit_memo_cents == 224, state_share_cents == 330, local_share_cents == 118"
            - "330 + 118 + 224 == 672 == gross_cents (gross dollars conserved across the issue/dispute pair)"
            - "gross_cents and item_count are unchanged by the dispute (still 672 and 3)"
            - "after pay: status == PAID (ADJUSTED invoices remain payable)"
