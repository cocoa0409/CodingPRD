    distinguishing_aspect: |
      Priority 7 covers three different shapes of the same rule and all three are strict: departure_date > arrival_date on a lead, end_at > start_at on a function-space hold, and expires_at > the logical clock on a quote. Each probe uses equality rather than inversion, which is the case an implementation using >= passes by accident. The control quote at the end proves the endpoint is otherwise reachable with the same lead version.
