  - rule_id: transitive_cascade
    instances:
      - name: pool_reverse_cascade_depth_five
        grounds:
          - state_machines.ShiftTipPool.contribution_status.CONTRIBUTED_to_REVERSED
          - state_machines.ShiftTipPool.distribution_status.DISTRIBUTED_to_REVERSED
          - state_machines.PayPeriod.COMPUTED_to_OPEN
          - state_machines.PayLine.DRAFT_to_SUPERSEDED
          - entities.Location.fields.pending_pool_cents
          - entities.PoolAllocation.fields.entry_type
          - endpoints.POST_/shift-tip-pools/{pool_id}/reverse
        distinguishing_aspect: >-
          One reverse call walks five distinct hops across four entity types: the pool flips
          contribution_status, negating REVERSAL ledger rows are appended without mutating the
          DISTRIBUTION rows, three Shifts are unstamped and have their retained tips restored, the
          COMPUTED PayPeriod is dragged back to OPEN and supersedes its PayLines, and finally the
          Location's pending_pool_cents rollup is recomputed. Hop 4 is the interesting one: the
          period was not the target of the request and is two references away from it.
        test_recipe:
          setup:
            - "The canonical Texas pool world: an ACTIVE TIPPED_ONLY / TIPS_RECEIVED_PCT / HOURS_WEIGHTED_POINTS policy with cc_fee_pass_through true at an ACTUAL_ONLY location, three CLOSED and DECLARED shifts on 2026-08-04 of 480, 480 and 360 minutes at cc_processing_fee_bps 250 declaring 34020, 14020 and 0 cents of tips."
            - "The pool has been created and DISTRIBUTED, and the pay period has then been COMPUTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
            - call: "POST /locations"
