            - "call 2 returns HTTP 409 ERR_SCREENING_INTERVAL_VIOLATION: 2026-08-29T07:00:00Z is 13 days 23 hours after 2026-08-15T08:00:00Z, one hour short"
            - "call 3 returns HTTP 409 ERR_SCREENING_INTERVAL_VIOLATION: 2026-08-10T08:00:00Z is 5 days BEFORE an existing observation, proving the buffer is symmetric and not merely 'later than the last one'"
            - "call 4 succeeds: 2026-08-29T08:00:00Z is exactly 14 days after 2026-08-15T08:00:00Z"
            - "Outfall.${of1_id}.screening_count == 3 and last_screened_at == 2026-08-29T08:00:00Z; the two rejected calls created no OutfallObservation rows"
            - "OutfallObservation.${s1_id}.screening_result == CLEAR and OutfallObservation.${s2_id}.screening_result == CLEAR, since no-flow short-circuits the indicator logic"
            - "Outfall.${of1_id}.screening_status == CLEAR and open_case_count == 0"

      - name: inspection_coverage_periods_are_closed_intervals_that_conflict_when_they_touch
