# ---------------------------------------------------------------------------
# 1.9 Scaffold Corner Design - breadth walk of references/claim-extraction-guide.md
# against this scaffold's 1.1-1.7 surface. Depth (the nine 0.5 difficulty rules)
# lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml; corners already asserted there appear
# here only as `excluded_because:` stubs.
#
# Shared fixture vocabulary (identical to the difficulty file so both sets can be
# replayed with the same factories):
#   * BreedingProgram      total_plot_budget 5000, total_budget_usd 2000000.00,
#                          crop_code SOYBEAN, market_zone NORTH_CENTRAL
#   * BreedingObjective    MG2_NORTH, target 11000.00, [RUST, SDS], min score 6,
#                          weights 0.50 / 0.30 / 0.20, bar 85.00, min generation 5
#   * BreedingLine A       SX-1001, generation 6, seed 500000 g, RUST 8 / SDS 7,
#                          PROTEIN_PCT 13.4 / TEST_WEIGHT 75.0
#   * BreedingLine B       SX-1002, generation 6, seed 400000 g, RUST 8 / SDS 4,
#                          quality_trait_values {}
#   * TrialSite            season 2027-03-01 .. 2027-10-31
#   * logical clock        2026-08-01T00:00:00Z until POST /_clock/set_current_utc
#   * unknown id literal   00000000-0000-0000-0000-0000000000ff
# ---------------------------------------------------------------------------
scaffold_corner_design:

  - section: entities
    instances:
      - name: program_creation_returns_envelope_with_zeroed_rollups
        claim_type: Creation
        grounds:
          - entities.BreedingProgram
          - response_envelope.success
          - endpoints["POST /breeding-programs"]
        distinguishing_aspect: "A 201 must carry every declared BreedingProgram field, with all five rollups at their creation values (committed_plot_count 0, plot_budget_remaining 5000, committed_budget_usd 0.00, active_line_count 0, pre_commercial_units_bags 0) and status ACTIVE - not a bare id."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /breeding-programs"
              payload: { name: "Soy North Central", crop_code: "SOYBEAN", market_zone: "NORTH_CENTRAL", total_plot_budget: 5000, total_budget_usd: 2000000.00 }
              as: PipelineDirector
              captures: { prog_id: $.data.id }
          assert:
            - "HTTP 201 and response_type == object with meta.api_request_id and meta.api_request_timestamp present"
            - "BreedingProgram.${prog_id}.name == Soy North Central, crop_code == SOYBEAN, market_zone == NORTH_CENTRAL"
            - "BreedingProgram.${prog_id}.total_plot_budget == 5000 and total_budget_usd == 2000000.00"
            - "BreedingProgram.${prog_id}.committed_plot_count == 0, plot_budget_remaining == 5000, committed_budget_usd == 0.00"
            - "BreedingProgram.${prog_id}.active_line_count == 0, pre_commercial_units_bags == 0, status == ACTIVE"
            - "BreedingProgram.${prog_id}.version == 1 and created_at / updated_at are YYYY-MM-DDTHH:MM:SSZ instants"

      - name: line_retrieval_returns_both_state_dimensions_and_seed_ledger
        claim_type: Retrieval
        grounds:
          - entities.BreedingLine
          - endpoints["GET /breeding-lines/{id}"]
        distinguishing_aspect: "GET must expose both independent state dimensions (pipeline_stage and stewardship_status) plus the four seed-ledger fields in one payload; returning only pipeline_stage hides the dimension every stewardship rule reads."
        test_recipe:
          setup:
            - "One program, one objective, line SX-1001 registered with seed_inventory_g 500000."
          setup_api_calls:
            - call: "POST /breeding-programs"
              payload: { name: "Soy North Central", crop_code: "SOYBEAN", market_zone: "NORTH_CENTRAL", total_plot_budget: 5000, total_budget_usd: 2000000.00 }
              as: PipelineDirector
              captures: { prog_id: $.data.id }
            - call: "POST /breeding-programs/${prog_id}/objectives"
              payload: { market_segment: "MG2_NORTH", target_yield_kg_per_ha: 11000.00, required_disease_resistances: ["RUST", "SDS"], min_resistance_score: 6, quality_trait_specs: { PROTEIN_PCT_MIN: 13.0 }, yield_weight: 0.50, disease_weight: 0.30, quality_weight: 0.20, min_advancement_index: 85.00, min_generation_number: 5 }
              as: PipelineDirector
              captures: { obj_id: $.data.id }
            - call: "POST /breeding-lines"
              payload: { program_id: "${prog_id}", objective_id: "${obj_id}", designation: "SX-1001", generation_number: 6, seed_inventory_g: 500000, disease_resistance_scores: { RUST: 8, SDS: 7 }, quality_trait_values: { PROTEIN_PCT: 13.4, TEST_WEIGHT: 75.0 } }
              as: BreedingScientist
              captures: { line_id: $.data.id }
          trigger:
            - call: "GET /breeding-lines/${line_id}"
              payload: {}
              as: DataAnalyst
          assert:
            - "HTTP 200; BreedingLine.${line_id}.pipeline_stage == NURSERY and stewardship_status == NOT_REQUIRED"
            - "BreedingLine.${line_id}.seed_inventory_g == 500000, reserved_seed_g == 0, consumed_seed_g == 0, cumulative_seed_produced_g == 500000"
            - "BreedingLine.${line_id}.disease_resistance_scores == { RUST: 8, SDS: 7 } and quality_trait_values == { PROTEIN_PCT: 13.4, TEST_WEIGHT: 75.0 }"
            - "BreedingLine.${line_id}.advancement_readiness == READY and advancement_index_provisional == null"
            - "BreedingLine.${line_id}.origin_block_id == null, female_parent_line_id == null, male_parent_line_id == null"

      - name: breeding_lines_list_paginates_and_filters_by_program
        claim_type: Listing
        grounds:
          - endpoints["GET /breeding-lines"]
          - response_envelope.pagination_fields
        distinguishing_aspect: "The list must return total_count over the whole filtered set (3) while the page itself honours limit 2 and offset 0 and sets has_more true; a handler that reports total_count 2 (the page size) breaks every downstream pagination assertion."
        test_recipe:
          setup:
            - "One program, one objective, three lines SX-1001 / SX-1002 / SX-1003."
          setup_api_calls:
            - call: "POST /breeding-programs"
              payload: { name: "Soy North Central", crop_code: "SOYBEAN", market_zone: "NORTH_CENTRAL", total_plot_budget: 5000, total_budget_usd: 2000000.00 }
              as: PipelineDirector
              captures: { prog_id: $.data.id }
            - call: "POST /breeding-programs/${prog_id}/objectives"
              payload: { market_segment: "MG2_NORTH", target_yield_kg_per_ha: 11000.00, required_disease_resistances: ["RUST", "SDS"], min_resistance_score: 6, quality_trait_specs: { PROTEIN_PCT_MIN: 13.0 }, yield_weight: 0.50, disease_weight: 0.30, quality_weight: 0.20, min_advancement_index: 85.00, min_generation_number: 5 }
              as: PipelineDirector
              captures: { obj_id: $.data.id }
            - call: "POST /breeding-lines"
              payload: { program_id: "${prog_id}", objective_id: "${obj_id}", designation: "SX-1001", generation_number: 6, seed_inventory_g: 500000 }
              as: BreedingScientist
            - call: "POST /breeding-lines"
              payload: { program_id: "${prog_id}", objective_id: "${obj_id}", designation: "SX-1002", generation_number: 6, seed_inventory_g: 400000 }
              as: BreedingScientist
            - call: "POST /breeding-lines"
              payload: { program_id: "${prog_id}", objective_id: "${obj_id}", designation: "SX-1003", generation_number: 6, seed_inventory_g: 300000 }
              as: BreedingScientist
          trigger:
            - call: "GET /breeding-lines"
              payload: { program_id: "${prog_id}", limit: 2, offset: 0 }
              as: PipelineDirector
          assert:
            - "HTTP 200 and response_type == array"
            - "data holds exactly 2 BreedingLine rows, ordered created_at ASC, so the first designation is SX-1001"
            - "total_count == 3 and has_more == true"
            - "the same call with offset 2 returns 1 row (SX-1003) and has_more == false"
            - "the same call with pipeline_stage=STAGE_1 returns 0 rows and total_count == 0"

      - name: unknown_path_ids_return_the_entity_specific_404
        claim_type: Not Found
        grounds:
          - validations[priority=4]
          - errors[ERR_PROGRAM_NOT_FOUND]
          - errors[ERR_OBJECTIVE_NOT_FOUND]
          - errors[ERR_NURSERY_BLOCK_NOT_FOUND]
          - errors[ERR_CROSSING_BLOCK_NOT_FOUND]
          - errors[ERR_LINE_NOT_FOUND]
          - errors[ERR_PLANTING_NOT_FOUND]
          - errors[ERR_TRIAL_SITE_NOT_FOUND]
          - errors[ERR_TRIAL_SERIES_NOT_FOUND]
          - errors[ERR_TRIAL_ENTRY_NOT_FOUND]
          - errors[ERR_DECISION_NOT_FOUND]
          - errors[ERR_AGREEMENT_NOT_FOUND]
          - errors[ERR_SEED_LOT_NOT_FOUND]
          - errors[ERR_BACKCROSS_NOT_FOUND]
        distinguishing_aspect: "Each of the thirteen path-resolved entity families must answer with its OWN 404 id, not a shared generic NOT_FOUND, so a client can tell which segment of a nested path failed."
        test_recipe:
          setup:
            - "Empty database; every id below is the literal unknown UUID."
          setup_api_calls: []
          trigger:
            - call: "GET /breeding-programs/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PipelineDirector
            - call: "GET /breeding-objectives/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PipelineDirector
            - call: "GET /nursery-blocks/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: BreedingScientist
            - call: "GET /crossing-blocks/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: BreedingScientist
            - call: "GET /breeding-lines/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PipelineDirector
            - call: "GET /nursery-plantings/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: BreedingScientist
            - call: "GET /trial-sites/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: TrialAgronomist
            - call: "GET /trial-series/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: TrialAgronomist
            - call: "GET /trial-entries/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: TrialAgronomist
            - call: "GET /advancement-decisions/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PipelineDirector
            - call: "GET /stewardship-agreements/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: RegulatoryOfficer
            - call: "GET /seed-increase-lots/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: SupplyPlanner
            - call: "GET /backcross-projects/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: BreedingScientist
          assert:
            - "every call returns HTTP 404 with response_type == error"
            - "the thirteen data.error_id values are exactly ERR_PROGRAM_NOT_FOUND, ERR_OBJECTIVE_NOT_FOUND, ERR_NURSERY_BLOCK_NOT_FOUND, ERR_CROSSING_BLOCK_NOT_FOUND, ERR_LINE_NOT_FOUND, ERR_PLANTING_NOT_FOUND, ERR_TRIAL_SITE_NOT_FOUND, ERR_TRIAL_SERIES_NOT_FOUND, ERR_TRIAL_ENTRY_NOT_FOUND, ERR_DECISION_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND, ERR_SEED_LOT_NOT_FOUND, ERR_BACKCROSS_NOT_FOUND in that order"
            - "each error body carries data.message as a non-empty string"

      - name: line_create_missing_designation_and_bad_weight_sum_rejected
        claim_type: Required Fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - endpoints["POST /breeding-lines"]
          - endpoints["POST /breeding-programs/{id}/objectives"]
        distinguishing_aspect: "Rung 3 covers both a plain missing required input (designation) and a body-local cross-field rule (the three objective weights must sum to exactly 1.00), and both must surface as ERR_INVALID_REQUEST 400 before any FK is resolved."
        test_recipe:
          setup:
            - "One program and one objective already exist."
          setup_api_calls:
            - call: "POST /breeding-programs"
              payload: { name: "Soy North Central", crop_code: "SOYBEAN", market_zone: "NORTH_CENTRAL", total_plot_budget: 5000, total_budget_usd: 2000000.00 }
              as: PipelineDirector
              captures: { prog_id: $.data.id }
            - call: "POST /breeding-programs/${prog_id}/objectives"
              payload: { market_segment: "MG2_NORTH", target_yield_kg_per_ha: 11000.00, required_disease_resistances: ["RUST", "SDS"], min_resistance_score: 6, quality_trait_specs: { PROTEIN_PCT_MIN: 13.0 }, yield_weight: 0.50, disease_weight: 0.30, quality_weight: 0.20, min_advancement_index: 85.00, min_generation_number: 5 }
              as: PipelineDirector
              captures: { obj_id: $.data.id }
          trigger:
            - call: "POST /breeding-lines"
              payload: { program_id: "${prog_id}", objective_id: "${obj_id}", generation_number: 6, seed_inventory_g: 500000 }
              as: BreedingScientist
            - call: "POST /breeding-programs/${prog_id}/objectives"
              payload: { market_segment: "MG3_SOUTH", target_yield_kg_per_ha: 11000.00, required_disease_resistances: ["RUST"], min_resistance_score: 6, quality_trait_specs: { PROTEIN_PCT_MIN: 13.0 }, yield_weight: 0.50, disease_weight: 0.30, quality_weight: 0.30, min_advancement_index: 85.00, min_generation_number: 5 }
              as: PipelineDirector
            - call: "POST /breeding-lines"
              payload: { program_id: "00000000-0000-0000-0000-0000000000ff", objective_id: "${obj_id}", generation_number: 6, seed_inventory_g: 500000 }
              as: BreedingScientist
          assert:
            - "the designation-less line -> 400 with data.error_id == ERR_INVALID_REQUEST"
            - "the objective whose weights sum to 1.10 -> 400 with data.error_id == ERR_INVALID_REQUEST"
            - "the third call, which is BOTH missing designation and pointing at an unknown program_id, -> 400 ERR_INVALID_REQUEST (rung 3 beats the rung 6 body-FK 404)"
            - "BreedingProgram.${prog_id}.active_line_count == 0 and GET /breeding-programs/${prog_id}/objectives returns total_count == 1"

      - name: line_create_omitting_optional_inputs_applies_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.BreedingLine.fields.seed_inventory_g
          - entities.BreedingLine.fields.disease_resistance_scores
          - entities.NurseryBlock.fields.fallow_buffer_days
          - endpoints["POST /breeding-lines"]
          - endpoints["POST /nursery-blocks"]
        distinguishing_aspect: "Omitted optional inputs must materialise their declared defaults rather than null: seed_inventory_g 0, both trait maps {}, and NurseryBlock.fallow_buffer_days 14 - the buffer default is load-bearing because the occupancy interval is built from it."
        test_recipe:
          setup:
            - "One program and one objective."
          setup_api_calls:
            - call: "POST /breeding-programs"
              payload: { name: "Soy North Central", crop_code: "SOYBEAN", market_zone: "NORTH_CENTRAL", total_plot_budget: 5000, total_budget_usd: 2000000.00 }
              as: PipelineDirector
              captures: { prog_id: $.data.id }
            - call: "POST /breeding-programs/${prog_id}/objectives"
              payload: { market_segment: "MG2_NORTH", target_yield_kg_per_ha: 11000.00, required_disease_resistances: ["RUST", "SDS"], min_resistance_score: 6, quality_trait_specs: { PROTEIN_PCT_MIN: 13.0 }, yield_weight: 0.50, disease_weight: 0.30, quality_weight: 0.20, min_advancement_index: 85.00, min_generation_number: 5 }
              as: PipelineDirector
              captures: { obj_id: $.data.id }
          trigger:
            - call: "POST /breeding-lines"
              payload: { program_id: "${prog_id}", objective_id: "${obj_id}", designation: "SX-1009", generation_number: 4 }
              as: BreedingScientist
              captures: { line_id: $.data.id }
            - call: "POST /nursery-blocks"
              payload: { block_code: "NB-DEF1", nursery_type: "SUMMER", location_code: "IA_AMES", plot_count: 120 }
              as: BreedingScientist
              captures: { block_id: $.data.id }
          assert:
            - "BreedingLine.${line_id}.seed_inventory_g == 0, cumulative_seed_produced_g == 0, reserved_seed_g == 0, consumed_seed_g == 0"
            - "BreedingLine.${line_id}.disease_resistance_scores == {} and quality_trait_values == {}"
            - "BreedingLine.${line_id}.nursery_cycles_completed == 0, planned_launch_units_bags == 0, advancement_index_provisional == null"
            - "BreedingLine.${line_id}.advancement_readiness == NOT_READY (generation 4 < min_generation_number 5)"
            - "NurseryBlock.${block_id}.fallow_buffer_days == 14 and occupancy_status == AVAILABLE"

      - name: computed_and_system_fields_ignore_client_supplied_values
        claim_type: Computed Fields
        grounds:
          - entities.TrialSite.fields.peak_committed_plot_count
          - entities.TrialSite.fields.capacity_posture
          - entities.BreedingLine.fields.pipeline_stage
          - validations[priority=3]
        distinguishing_aspect: "capacity_posture, peak_committed_plot_count and available_plot_count are computed and appear in no endpoint's input:, so they must be derived from the entry population at every read - OPEN / 0 / 60 at creation and RESTRICTED / 51 / 9 the instant a 51-plot entry lands - while id, version and created_at are system-minted."
        test_recipe:
          setup:
            - "One program, one objective, one line and one STAGE_1 series (rep 3, min_locations 1)."
          setup_api_calls:
            - call: "POST /breeding-programs"
              payload: { name: "Soy North Central", crop_code: "SOYBEAN", market_zone: "NORTH_CENTRAL", total_plot_budget: 5000, total_budget_usd: 2000000.00 }
              as: PipelineDirector
              captures: { prog_id: $.data.id }
            - call: "POST /breeding-programs/${prog_id}/objectives"
              payload: { market_segment: "MG2_NORTH", target_yield_kg_per_ha: 11000.00, required_disease_resistances: ["RUST", "SDS"], min_resistance_score: 6, quality_trait_specs: { PROTEIN_PCT_MIN: 13.0 }, yield_weight: 0.50, disease_weight: 0.30, quality_weight: 0.20, min_advancement_index: 85.00, min_generation_number: 5 }
              as: PipelineDirector
              captures: { obj_id: $.data.id }
            - call: "POST /breeding-lines"
              payload: { program_id: "${prog_id}", objective_id: "${obj_id}", designation: "SX-1001", generation_number: 6, seed_inventory_g: 500000 }
              as: BreedingScientist
              captures: { line_id: $.data.id }
            - call: "POST /trial-series"
              payload: { program_id: "${prog_id}", stage: "STAGE_1", season_year: 2027, plot_design: "RCBD", replication_count: 3, min_locations: 1 }
              as: TrialAgronomist
              captures: { series_id: $.data.id }
          trigger:
            - call: "POST /trial-sites"
              payload: { site_code: "CF1", environment_class: "RAINFED_TEMPERATE", total_plot_capacity: 60, plot_cost_usd: 40.00, season_start_date: "2027-03-01", season_end_date: "2027-10-31" }
              as: TrialAgronomist
              captures: { site_id: $.data.id }
            - call: "POST /trial-series/${series_id}/entries"
              payload: { line_id: "${line_id}", trial_site_id: "${site_id}", plot_count: 51, planting_window_start: "2027-04-01", planting_window_end: "2027-08-31" }
              as: TrialAgronomist
              captures: { entry_id: $.data.id }
            - call: "GET /trial-sites/${site_id}"
              payload: {}
              as: TrialAgronomist
          assert:
            - "immediately after creation TrialSite.${site_id}.capacity_posture == OPEN, peak_committed_plot_count == 0, available_plot_count == 60"
            - "after the 51-plot entry TrialSite.${site_id}.peak_committed_plot_count == 51, available_plot_count == 9, capacity_posture == RESTRICTED"
            - "the GET re-read returns the same computed triple, so the values are derived and not a one-shot write"
            - "TrialSite.${site_id}.id is a server-minted string, version == 2 after the entry recomputed the site, and created_at is unchanged while updated_at advanced"
            - "TrialEntry.${entry_id}.valid_rep_count == 0, plot_mean_yield_kg == null, yield_kg_per_ha == null, withdrawal_reason == null"

      - name: trial_site_and_series_enum_and_range_constraints_enforced
        claim_type: Type Constraints
        grounds:
          - entities.TrialSite.fields.environment_class
          - entities.TrialSeries.fields.replication_count
          - entities.TrialSeries.fields.plot_design
          - validations[priority=3]
        distinguishing_aspect: "Rung 3 must reject an out-of-enum environment_class, an out-of-enum plot_design and a replication_count of 1 (the declared floor is 2) - three different shapes of type violation on two entities, all as ERR_INVALID_REQUEST 400."
        test_recipe:
          setup:
            - "One program and one objective."
          setup_api_calls:
            - call: "POST /breeding-programs"
              payload: { name: "Soy North Central", crop_code: "SOYBEAN", market_zone: "NORTH_CENTRAL", total_plot_budget: 5000, total_budget_usd: 2000000.00 }
              as: PipelineDirector
              captures: { prog_id: $.data.id }
            - call: "POST /breeding-programs/${prog_id}/objectives"
              payload: { market_segment: "MG2_NORTH", target_yield_kg_per_ha: 11000.00, required_disease_resistances: ["RUST", "SDS"], min_resistance_score: 6, quality_trait_specs: { PROTEIN_PCT_MIN: 13.0 }, yield_weight: 0.50, disease_weight: 0.30, quality_weight: 0.20, min_advancement_index: 85.00, min_generation_number: 5 }
              as: PipelineDirector
              captures: { obj_id: $.data.id }
          trigger:
            - call: "POST /trial-sites"
              payload: { site_code: "TC1", environment_class: "TROPICAL_WET", total_plot_capacity: 60, plot_cost_usd: 40.00, season_start_date: "2027-03-01", season_end_date: "2027-10-31" }
              as: TrialAgronomist
            - call: "POST /trial-series"
              payload: { program_id: "${prog_id}", stage: "STAGE_1", season_year: 2027, plot_design: "SPLIT_PLOT", replication_count: 4, min_locations: 1 }
              as: TrialAgronomist
            - call: "POST /trial-series"
              payload: { program_id: "${prog_id}", stage: "STAGE_1", season_year: 2027, plot_design: "RCBD", replication_count: 1, min_locations: 1 }
              as: TrialAgronomist
          assert:
            - "all three calls -> 400 with data.error_id == ERR_INVALID_REQUEST"
            - "no TrialSite and no TrialSeries row is created: GET /breeding-programs/${prog_id}/trial-series returns total_count == 0"
            - "BreedingProgram.${prog_id}.committed_plot_count == 0 and committed_budget_usd == 0.00"

      - name: phenotype_observation_is_immutable_and_carries_no_version
        claim_type: Immutability
        grounds:
          - entities.PhenotypeObservation
          - endpoints["POST /trial-entries/{id}/observations"]
          - endpoints["GET /trial-entries/{id}/observations"]
        distinguishing_aspect: "PhenotypeObservation is the only common_fields:false entity: it is append-only, so the surface offers no id-addressable GET, no update and no version field, and a re-post of the same (trait_code, rep_number) is a duplicate rather than an edit."
        test_recipe:
          setup:
            - "One program, one objective, two lines, one site, one STAGE_1 series (rep 4, min_locations 1) with both entries PLANTED."
          setup_api_calls:
            - call: "POST /breeding-programs"
              payload: { name: "Soy North Central", crop_code: "SOYBEAN", market_zone: "NORTH_CENTRAL", total_plot_budget: 5000, total_budget_usd: 2000000.00 }
              as: PipelineDirector
              captures: { prog_id: $.data.id }
            - call: "POST /breeding-programs/${prog_id}/objectives"
              payload: { market_segment: "MG2_NORTH", target_yield_kg_per_ha: 11000.00, required_disease_resistances: ["RUST", "SDS"], min_resistance_score: 6, quality_trait_specs: { PROTEIN_PCT_MIN: 13.0 }, yield_weight: 0.50, disease_weight: 0.30, quality_weight: 0.20, min_advancement_index: 85.00, min_generation_number: 5 }
              as: PipelineDirector
              captures: { obj_id: $.data.id }
            - call: "POST /breeding-lines"
              payload: { program_id: "${prog_id}", objective_id: "${obj_id}", designation: "SX-1001", generation_number: 6, seed_inventory_g: 500000 }
              as: BreedingScientist
              captures: { line_a_id: $.data.id }
            - call: "POST /breeding-lines"
              payload: { program_id: "${prog_id}", objective_id: "${obj_id}", designation: "SX-1002", generation_number: 6, seed_inventory_g: 400000 }
              as: BreedingScientist
              captures: { line_b_id: $.data.id }
            - call: "POST /trial-sites"
