            - "hop 1 — ConflictDeclaration.voided_score_count == 1 in the 201 response"
            - "hop 2 — Artwork.${aw_a_id}.valid_score_count == 1 and Artwork.${aw_a_id}.provisional_mean_score == 8.00 (was 7.00 over both scores)"
            - "hop 3 — JuryRound.${r1_id}.quorum_shortfall_count == 1"
            - "hop 4 — the SCORING_COMPLETE call returns ERR_QUORUM_NOT_MET with HTTP 409"
            - "JuryRound.${r1_id}.status == OPEN and Artwork.${aw_a_id}.status == SUBMITTED and Artwork.${aw_a_id}.certified_mean_score == null"

  # =========================================================================
  # RULE 5 — priority_pair_validation_conflict
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: award_confirm_phase_before_budget
        grounds:
          - validations[priority=8]
          - validations[priority=47]
          - errors[ERR_EXHIBITION_PHASE_INVALID]
          - errors[ERR_AWARD_BUDGET_EXCEEDED]
          - state_machines.Award.PROPOSED_to_CONFIRMED
        distinguishing_aspect: |
          Category pair state (priority 8, 409) versus business_fiscal (priority 47, 402): a single
          confirm call violates both the exhibition phase guard and the council award budget, and the
          response must be ERR_EXHIBITION_PHASE_INVALID with 409 — the cheaper fiscal error is never
          surfaced, and award_committed_cents is left at 0.
        test_recipe:
          setup:
            - "Exhibition in JURYING (confirm requires RESULTS_PUBLISHED, INSTALLATION or ON_VIEW) with award_budget_cents 500000 and award_committed_cents 0."
            - "One SUBMITTED PAINTING artwork belonging to that exhibition."
            - "One PROPOSED BEST_IN_SHOW award with prize_cents 900000 and no sponsor, proposed by chair-a."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: CallManager }
            - { call: "POST /exhibitions", payload: { title: "Regional Juried Biennial", season_year: 2026, call_opens_at: "2026-09-01T00:00:00Z", call_closes_at: "2026-10-01T00:00:00Z", notification_at: "2026-10-20T00:00:00Z", delivery_window_start_at: "2026-11-02T00:00:00Z", delivery_window_end_at: "2026-11-06T23:59:59Z", opening_at: "2026-11-12T18:00:00Z", closing_at: "2026-12-13T00:00:00Z", entry_fee_base_cents: 4500, entry_fee_additional_cents: 1500, max_dimension_cm: 200, max_weight_kg: 40, per_work_insurance_cap_cents: 5000000, allowed_media_categories: ["PAINTING", "PHOTOGRAPHY", "SCULPTURE"], eligible_state_codes: ["CA", "OR"], acceptance_capacity: 3, waitlist_capacity: 1, jury_quorum: 1, advance_score_threshold: 7.0, score_weight_technique: 0.4, score_weight_originality: 0.35, score_weight_relevance: 0.25, commission_pct: 0.35, sales_tax_pct: 0.0875, award_budget_cents: 500000, claim_deadline_days: 30, works_included_in_base: 2, member_discount_pct: 0.175, max_works_per_entry: 5, max_entries_per_artist: 1 }, as: CallManager, captures: { ex_id: $.data.id } }
            - { call: "POST /exhibitions/${ex_id}/phase-advance", payload: { target_status: "OPEN_FOR_ENTRIES" }, as: CallManager }
            - { call: "POST /artists", payload: { legal_name: "Ana Ruiz", email: "ana.ruiz@example.org", residency_state_code: "CA", member_status: "MEMBER", tax_form_on_file: true, payout_method: "ACH" }, as: CallManager, captures: { a1_id: $.data.id } }
            - { call: "POST /entries", payload: { exhibition_id: "${ex_id}", artist_id: "${a1_id}" }, as: Artist, as_user_id: "${a1_id}", captures: { e1_id: $.data.id } }
            - { call: "POST /entries/${e1_id}/artworks", payload: { title: "Ridge Line", medium_category: "PAINTING", width_cm: 90, height_cm: 60, depth_cm: 4, weight_kg: 6, year_created: 2026, declared_value_cents: 400000, for_sale: false }, as: Artist, as_user_id: "${a1_id}", captures: { aw_a_id: $.data.id } }
            - { call: "POST /artworks/${aw_a_id}/images", payload: { role: "PRIMARY", format: "JPEG", pixel_long_edge: 2400, pixel_short_edge: 1600, file_bytes: 3145728, color_profile: "SRGB", capture_date: "2026-08-15T00:00:00Z", credit_line: "Photo: Ana Ruiz", checksum_sha256: "aa01" }, as: Artist, as_user_id: "${a1_id}" }
            - { call: "POST /entries/${e1_id}/submit", payload: {}, as: Artist, as_user_id: "${a1_id}" }
            - { call: "POST /entries/${e1_id}/fee-payment", payload: { amount_cents: 3713 }, as: Artist, as_user_id: "${a1_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-02T00:00:00Z" }, as: CallManager }
            - { call: "POST /exhibitions/${ex_id}/phase-advance", payload: { target_status: "JURYING" }, as: CallManager }
            - { call: "POST /awards", payload: { exhibition_id: "${ex_id}", artwork_id: "${aw_a_id}", category: "BEST_IN_SHOW", prize_cents: 900000 }, as: JuryChair, as_user_id: "chair-a", captures: { award_id: $.data.id } }
            - { call: "GET /exhibitions/${ex_id}", payload: {}, as: JuryChair, as_user_id: "chair-b", captures: { ex_v1: $.data.version } }
          trigger:
            - { call: "POST /awards/${award_id}/confirm", payload: { expected_exhibition_version: "${ex_v1}" }, as: JuryChair, as_user_id: "chair-b" }
          assert:
            - "the confirm call returns ERR_EXHIBITION_PHASE_INVALID with HTTP 409"
            - "the response does NOT carry ERR_AWARD_BUDGET_EXCEEDED even though 0 + 900000 > 500000"
            - "Award.${award_id}.status == PROPOSED and Award.${award_id}.confirmed_by_user_id == null"
            - "Exhibition.${ex_id}.award_committed_cents == 0"
            - "Exhibition.${ex_id}.status == JURYING (unchanged)"

