          assert:
            - "Shipment.${ship_id}.reefer_unit_id == ${unit_id}"
            - "Shipment.${ship_id}.status == ACCEPTED and version incremented by 1 from the accepted version"
            - "ReeferUnit.${unit_id}.status == ASSIGNED (cascaded from the shipment accept, no direct unit call)"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_safety_on_dispatch_wrong_state_and_no_fsma
        grounds:
          - validations[priority=5]
          - validations[priority=6]
        distinguishing_aspect: "Error-category pair state(5) vs business_safety(6): dispatching an ACCEPTED (not PRECOOLED) shipment whose carrier is also not FSMA-registered returns ERR_INVALID_STATE (priority 5), not ERR_FSMA_NOT_REGISTERED (priority 6)."
        test_recipe:
          setup:
            - "FOOD shipment in ACCEPTED (precool NOT verified); carrier.fsma_registered = false. Both checks would fail."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "NoFsma Carrier", fsma_registered: false, sanitary_training_current: false }
              as: Carrier
              as_user_id: "carrier-op-9"
              captures: { carrier_id: $.data.id }
            - call: "POST /temp-lanes"
              payload: { code: "FROZEN", setpoint_min_c: -25, setpoint_max_c: -15, regulated: true, tolerance_degree_minutes: 30 }
              as: PlatformAdmin
              captures: { lane_id: $.data.id }
            - call: "POST /reefer-units"
              payload: { carrier_id: "${carrier_id}", asset_tag: "RU-9", compartment_count: 1, last_sanitation_at: "2026-02-28T00:00:00Z" }
              as: Carrier
              as_user_id: "carrier-op-9"
              captures: { unit_id: $.data.id }
            - call: "POST /shipments"
              payload: { carrier_id: "${carrier_id}", cargo_class: "FOOD" }
              as: Shipper
              as_user_id: "shipper-op-9"
              captures: { ship_id: $.data.id }
            - call: "POST /shipments/${ship_id}/compartments"
              payload: { temp_lane_id: "${lane_id}", ordinal: 1 }
              as: Shipper
              as_user_id: "shipper-op-9"
            - call: "GET /shipments/${ship_id}"
              as: Carrier
              as_user_id: "carrier-op-9"
              captures: { ship_v: $.data.version }
            - call: "POST /shipments/${ship_id}/accept"
              payload: { reefer_unit_id: "${unit_id}", expected_shipment_version: "${ship_v}" }
              as: Carrier
              as_user_id: "carrier-op-9"
          trigger:
            - call: "POST /shipments/${ship_id}/dispatch"
              as: Carrier
              as_user_id: "carrier-op-9"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE (state priority 5 wins over business_safety priority 6)"

      - name: referential_beats_constraint_on_accept_bad_unit_fk_and_too_small
        grounds:
          - validations[priority=4]
          - validations[priority=10]
        distinguishing_aspect: "Error-category pair business_referential(4) vs business_constraint(10): accepting with a non-existent reefer_unit_id returns ERR_FK_NOT_FOUND (priority 4) before any ERR_UNIT_TOO_SMALL check (priority 10) can run — a different category pair than the state-vs-safety conflict above."
        test_recipe:
          setup:
            - "TENDERED FOOD shipment with 2 compartments; accept names a bogus reefer_unit_id that does not exist."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "FK Carrier", fsma_registered: true, sanitary_training_current: true }
              as: Carrier
              as_user_id: "carrier-op-10"
              captures: { carrier_id: $.data.id }
            - call: "POST /temp-lanes"
              payload: { code: "FROZEN", setpoint_min_c: -25, setpoint_max_c: -15, regulated: true, tolerance_degree_minutes: 30 }
              as: PlatformAdmin
              captures: { lane_id: $.data.id }
            - call: "POST /shipments"
              payload: { carrier_id: "${carrier_id}", cargo_class: "FOOD" }
              as: Shipper
              as_user_id: "shipper-op-10"
              captures: { ship_id: $.data.id }
            - call: "POST /shipments/${ship_id}/compartments"
              payload: { temp_lane_id: "${lane_id}", ordinal: 1 }
              as: Shipper
              as_user_id: "shipper-op-10"
            - call: "POST /shipments/${ship_id}/compartments"
              payload: { temp_lane_id: "${lane_id}", ordinal: 2 }
              as: Shipper
              as_user_id: "shipper-op-10"
            - call: "GET /shipments/${ship_id}"
              as: Carrier
              as_user_id: "carrier-op-10"
              captures: { ship_v: $.data.version }
          trigger:
            - call: "POST /shipments/${ship_id}/accept"
              payload: { reefer_unit_id: "00000000-0000-4000-8000-000000000000", expected_shipment_version: "${ship_v}" }
              as: Carrier
              as_user_id: "carrier-op-10"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_FK_NOT_FOUND (referential priority 4 wins over business_constraint priority 10)"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: detention_free_time_boundary_120_vs_121_on_stop_close
        grounds:
          - calculations.detention_fee
          - entities.StopEvent.fields.detention_fee_cents
        distinguishing_aspect: "Numeric threshold metric on POST /stops/{stopId}/close: dwell exactly 120 (== FREE_TIME_MIN) yields detention 0; dwell 121 crosses to one started hour -> 5000. The <= vs > boundary is exact at FREE_TIME_MIN."
        test_recipe:
          setup:
            - "IN_TRANSIT shipment with a DELIVERY stop; arrived_min 600, departed_min 720 (dwell exactly 120)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { legal_name: "Boundary Carrier", fsma_registered: true, sanitary_training_current: true }
              as: Carrier
