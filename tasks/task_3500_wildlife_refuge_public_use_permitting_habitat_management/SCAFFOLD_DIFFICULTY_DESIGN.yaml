# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Wildlife Refuge Public Use Permitting & Habitat Management
# 9 rules x 2 instances = 18 instances. Grounds resolve into SCAFFOLD.yaml
# §1.1-§1.7. All clock positions start from the server default
# 2026-09-01T00:00:00Z unless advanced by POST /_clock/set_current_utc.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: permit_fee_provisional_vs_assessed_diverge
        grounds:
          - calculations.permit_fee_assessment
          - entities.PermitApplication.fields.provisional_fee_cents
          - entities.PermitApplication.fields.assessed_fee_cents
        distinguishing_aspect: |
          Same application data, two fee variants on the PermitApplication
          (fiscal domain): provisional is the flat base 15000; assessed adds
          per-day x days x tier = 2000 x 3 x 1.0, yielding 21000. The variants
          MUST disagree on identical inputs.
        test_recipe:
          setup:
            - "One ManagementUnit and one FINAL COMPATIBLE RESEARCH determination (comment window already closed with zero comments)."
            - "One SUBMITTED RESEARCH permit: crew_size 4, 2026-10-10..2026-10-12 (3 days)."
          setup_api_calls:
            - call: "POST /refuge/management-units"
              payload: { name: "North Marsh", habitat_type: "WETLAND", acreage: 1200 }
              as: RefugeManager
              captures: { u1: $.data.id }
            - call: "POST /refuge/determinations"
              payload: { use_type: "RESEARCH", title: "Research use compatibility", comment_open_date: "2026-09-05", comment_close_date: "2026-09-20" }
              as: PermitOfficer
              captures: { d1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: RefugeManager
            - call: "POST /refuge/determinations/${d1}/open-comment"
              payload: {}
              as: PermitOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T00:00:00Z" }
              as: RefugeManager
            - call: "POST /refuge/determinations/${d1}/finalize"
              payload: { finding: "COMPATIBLE", rationale: "No material interference with refuge purposes." }
              as: PermitOfficer
          trigger:
            - call: "POST /refuge/permits"
              payload: { applicant_ref: "app-1", management_unit_id: "${u1}", determination_id: "${d1}", use_type: "RESEARCH", crew_size: 4, start_date: "2026-10-10", end_date: "2026-10-12" }
              as: PermitApplicant
              as_user_id: "app-1"
              captures: { p1: $.data.id, prov_fee: $.data.provisional_fee_cents }
            - call: "POST /refuge/permits/${p1}/return-for-revision"
              payload: { note: "Need methods detail." }
              as: PermitOfficer
            - call: "POST /refuge/permits/${p1}/resubmit"
              payload: {}
              as: PermitApplicant
              as_user_id: "app-1"
            - call: "POST /refuge/permits/${p1}/approve"
              payload: {}
              as: PermitOfficer
              captures: { assessed_fee: $.data.assessed_fee_cents }
          assert:
            - "permit ${p1} provisional_fee_cents == 15000 (flat RESEARCH base only)"
            - "permit ${p1} assessed_fee_cents == 21000 (15000 + 2000 x 3 x 1.0)"
            - "provisional_fee_cents != assessed_fee_cents for identical application data"
      - name: habitat_score_breeding_vs_annual_diverge
        grounds:
          - calculations.habitat_priority_score
          - entities.ManagementUnit.fields.habitat_priority_breeding
          - entities.ManagementUnit.fields.habitat_priority_annual
        distinguishing_aspect: |
          Same COMPLETED-treatment set, two scoring algorithms on the
          ManagementUnit (ecology domain — a different domain from permit
          fees): breeding_weighted doubles the burn weight (50 -> 100) because
          its March window intersects the breeding window; annual_mean stays
          flat. Breeding score 120 vs annual score 70.
        test_recipe:
          setup:
            - "One ManagementUnit with two COMPLETED treatments: a PRESCRIBED_BURN in window 2027-03-10..2027-03-20 (intersects breeding window) and an INVASIVE_CONTROL in window 2027-08-01..2027-08-10 (does not)."
          setup_api_calls:
            - call: "POST /refuge/management-units"
              payload: { name: "Prairie Unit", habitat_type: "GRASSLAND", acreage: 800 }
              as: RefugeManager
              captures: { u1: $.data.id }
            - call: "POST /refuge/management-units/${u1}/treatments"
              payload: { treatment_type: "PRESCRIBED_BURN", window_start: "2027-03-10", window_end: "2027-03-20" }
              as: Biologist
              captures: { t1: $.data.id }
            - call: "POST /refuge/management-units/${u1}/treatments"
              payload: { treatment_type: "INVASIVE_CONTROL", window_start: "2027-08-01", window_end: "2027-08-10" }
              as: Biologist
              captures: { t2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-10T00:00:00Z" }
              as: RefugeManager
            - call: "POST /refuge/treatments/${t1}/start"
              payload: {}
              as: Biologist
            - call: "POST /refuge/treatments/${t1}/complete"
              payload: {}
              as: Biologist
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-01T00:00:00Z" }
              as: RefugeManager
            - call: "POST /refuge/treatments/${t2}/start"
              payload: {}
              as: Biologist
            - call: "POST /refuge/treatments/${t2}/complete"
              payload: {}
              as: Biologist
          trigger:
            - call: "GET /refuge/management-units/${u1}/posture"
              as: Biologist
              captures: { breed: $.data.habitat_priority_breeding, annual: $.data.habitat_priority_annual }
          assert:
            - "habitat_priority_breeding == 120 (burn 50 x 2 breeding multiplier + invasive 20 x 1)"
            - "habitat_priority_annual == 70 (burn 50 + invasive 20, no multiplier)"
            - "breeding != annual for the identical completed-treatment set"

  - rule_id: combinatorial_formula
    instances:
      - name: assessed_fee_tiered_crew_surcharge_mode_a
        grounds:
          - calculations.permit_fee_assessment
          - state_machines.PermitApplication.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Mode (a) combinatorial: >= 3 inputs (use_type, crew_size, days) with
          non-linear interaction — tiered multiplier selection, a conditional
          commercial surcharge, and nested min/max clamps. COMMERCIAL_FILMING,
          crew 25 (TIER_LARGE 1.5), 3 days, +10000 surcharge => 52500.
        test_recipe:
          setup:
            - "One ManagementUnit; one FINAL COMPATIBLE COMMERCIAL_FILMING determination."
            - "One UNDER_REVIEW commercial permit: crew_size 25, 2026-10-10..2026-10-12 (3 days)."
          setup_api_calls:
            - call: "POST /refuge/management-units"
              payload: { name: "River Bluffs", habitat_type: "FOREST", acreage: 2400 }
              as: RefugeManager
              captures: { u1: $.data.id }
            - call: "POST /refuge/determinations"
              payload: { use_type: "COMMERCIAL_FILMING", title: "Commercial filming compatibility", comment_open_date: "2026-09-05", comment_close_date: "2026-09-20" }
              as: PermitOfficer
              captures: { d1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: RefugeManager
            - call: "POST /refuge/determinations/${d1}/open-comment"
              payload: {}
              as: PermitOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T00:00:00Z" }
              as: RefugeManager
            - call: "POST /refuge/determinations/${d1}/finalize"
              payload: { finding: "COMPATIBLE", rationale: "Compatible with conditions." }
              as: PermitOfficer
            - call: "POST /refuge/permits"
              payload: { applicant_ref: "studio-1", management_unit_id: "${u1}", determination_id: "${d1}", use_type: "COMMERCIAL_FILMING", crew_size: 25, start_date: "2026-10-10", end_date: "2026-10-12" }
              as: PermitApplicant
              as_user_id: "studio-1"
              captures: { p1: $.data.id }
            - call: "POST /refuge/permits/${p1}/return-for-revision"
              payload: { note: "Clarify drone use." }
              as: PermitOfficer
            - call: "POST /refuge/permits/${p1}/resubmit"
              payload: {}
              as: PermitApplicant
              as_user_id: "studio-1"
          trigger:
            - call: "POST /refuge/permits/${p1}/approve"
              payload: {}
              as: PermitOfficer
              captures: { fee: $.data.assessed_fee_cents, st: $.data.status }
          assert:
            - "assessed_fee_cents == 52500 (20000 base + round(5000 x 3 x 1.5)=22500 + 10000 commercial surcharge; under cap, over floor)"
            - "status == APPROVED"
      - name: cost_share_round_per_period_then_sum_mode_b
        grounds:
          - calculations.cost_share_assessment
          - entities.CooperativeAgreement.fields.assessed_total_cents
        distinguishing_aspect: |
          Mode (b) combinatorial: nested rounding where order matters. The
          scaffold pins round-per-period-then-sum: aum 3 x rate 1001 x 50%
          = 1501.5 -> 1502 per period; two periods sum to 3004. Sum-then-round
          would give 3003 and is WRONG.
        test_recipe:
          setup:
            - "One awarded CooperativeAgreement (GRAZING determination FINAL COMPATIBLE; offering awarded to the only eligible bid; agreement ACTIVE with version observed)."
          setup_api_calls:
            - call: "POST /refuge/management-units"
              payload: { name: "South Pasture", habitat_type: "GRASSLAND", acreage: 3000 }
              as: RefugeManager
              captures: { u1: $.data.id }
            - call: "POST /refuge/determinations"
              payload: { use_type: "GRAZING", title: "Grazing compatibility", comment_open_date: "2026-09-05", comment_close_date: "2026-09-20" }
              as: PermitOfficer
              captures: { dg: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: RefugeManager
            - call: "POST /refuge/determinations/${dg}/open-comment"
              payload: {}
              as: PermitOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T00:00:00Z" }
              as: RefugeManager
            - call: "POST /refuge/determinations/${dg}/finalize"
              payload: { finding: "COMPATIBLE", rationale: "Grazing serves habitat objectives." }
              as: PermitOfficer
            - call: "POST /refuge/management-units/${u1}/grazing-offerings"
              payload: { description: "Winter grazing for reed control", aum_cap: 100, grazing_window_start: "2026-11-01", grazing_window_end: "2027-02-28", application_deadline: "2026-10-01", min_stewardship_rating: 5 }
              as: Biologist
              captures: { off1: $.data.id }
            - call: "POST /refuge/grazing-offerings/${off1}/bids"
              payload: { cooperator_ref: "coop-1", rate_cents_per_aum: 2000, stewardship_rating: 7 }
              as: Cooperator
              as_user_id: "coop-1"
              captures: { b1: $.data.id }
            - call: "POST /refuge/grazing-offerings/${off1}/close-and-select"
              payload: {}
              as: RefugeManager
            - call: "GET /refuge/cooperative-agreements"
              payload: { winning_bid_id: "${b1}" }
              as: RefugeManager
              captures: { ag1: "$.data[0].id", ag_v: "$.data[0].version" }
          trigger:
            - call: "POST /refuge/cooperative-agreements/${ag1}/assess"
              payload: { period_key: "2026-11", aum_used: 3, rate_cents_per_aum: 1001, expected_agreement_version: "${ag_v}" }
              as: Biologist
              captures: { ag_v2: $.data.version }
            - call: "POST /refuge/cooperative-agreements/${ag1}/assess"
              payload: { period_key: "2026-12", aum_used: 3, rate_cents_per_aum: 1001, expected_agreement_version: "${ag_v2}" }
              as: Biologist
              captures: { total: $.data.assessed_total_cents, outst: $.data.outstanding_balance_cents }
          assert:
            - "assessed_total_cents == 3004 (1502 + 1502, per-period rounded then summed)"
            - "outstanding_balance_cents == 3004"
            - "a sum-then-round implementation would report 3003 and must FAIL"

  - rule_id: non_linear_state_machine
    instances:
      - name: permit_revision_cycle_runs_twice
        grounds:
          - state_machines.PermitApplication.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.PermitApplication.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.PermitApplication.REVISION_REQUESTED_to_UNDER_REVIEW
        distinguishing_aspect: |
          PermitApplication is cyclic: UNDER_REVIEW -> REVISION_REQUESTED ->
          UNDER_REVIEW loops. This instance runs the loop TWICE before
          approval, which a linear-pipeline machine cannot express; version
          increments prove six distinct mutations.
        test_recipe:
          setup:
            - "One ManagementUnit; one FINAL COMPATIBLE RESEARCH determination; one SUBMITTED RESEARCH permit (crew 4, 2026-10-10..2026-10-12)."
          setup_api_calls:
            - call: "POST /refuge/management-units"
              payload: { name: "North Marsh", habitat_type: "WETLAND", acreage: 1200 }
              as: RefugeManager
              captures: { u1: $.data.id }
            - call: "POST /refuge/determinations"
              payload: { use_type: "RESEARCH", title: "Research use", comment_open_date: "2026-09-05", comment_close_date: "2026-09-20" }
              as: PermitOfficer
              captures: { d1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: RefugeManager
            - call: "POST /refuge/determinations/${d1}/open-comment"
              payload: {}
              as: PermitOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T00:00:00Z" }
              as: RefugeManager
            - call: "POST /refuge/determinations/${d1}/finalize"
              payload: { finding: "COMPATIBLE", rationale: "ok" }
              as: PermitOfficer
            - call: "POST /refuge/permits"
              payload: { applicant_ref: "app-1", management_unit_id: "${u1}", determination_id: "${d1}", use_type: "RESEARCH", crew_size: 4, start_date: "2026-10-10", end_date: "2026-10-12" }
              as: PermitApplicant
              as_user_id: "app-1"
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /refuge/permits/${p1}/return-for-revision"
              payload: { note: "round 1" }
              as: PermitOfficer
              captures: { s1: $.data.status }
            - call: "POST /refuge/permits/${p1}/resubmit"
              payload: {}
              as: PermitApplicant
              as_user_id: "app-1"
              captures: { s2: $.data.status }
            - call: "POST /refuge/permits/${p1}/return-for-revision"
              payload: { note: "round 2" }
              as: PermitOfficer
              captures: { s3: $.data.status }
            - call: "POST /refuge/permits/${p1}/resubmit"
              payload: {}
              as: PermitApplicant
              as_user_id: "app-1"
              captures: { s4: $.data.status }
            - call: "POST /refuge/permits/${p1}/approve"
              payload: {}
              as: PermitOfficer
              captures: { s5: $.data.status, v_final: $.data.version }
          assert:
            - "cycle leg 1: status after first return == REVISION_REQUESTED"
            - "cycle leg 1: status after first resubmit == UNDER_REVIEW"
            - "cycle leg 2: status after second return == REVISION_REQUESTED"
            - "cycle leg 2: status after second resubmit == UNDER_REVIEW"
            - "final status == APPROVED and version == 6 (create + 2 returns + 2 resubmits + approve)"
      - name: agreement_suspend_reinstate_cycle_citation_driven
        grounds:
          - state_machines.CooperativeAgreement.ACTIVE_to_SUSPENDED
          - state_machines.CooperativeAgreement.SUSPENDED_to_ACTIVE
          - calculations.compliance_point_deduction
        distinguishing_aspect: |
          CooperativeAgreement is cyclic on a different entity than the
          permit: ACTIVE -> SUSPENDED (citation debit below 60) -> ACTIVE
          (void credit restores to >= 60) -> SUSPENDED again (fresh CRITICAL
          citation). Points literals pin each hop: 100 -> 75 -> 50 -> 75 -> 25.
        test_recipe:
          setup:
            - "One awarded ACTIVE CooperativeAgreement (GRAZING determination FINAL; single winning bid coop-1)."
          setup_api_calls:
            - call: "POST /refuge/management-units"
              payload: { name: "South Pasture", habitat_type: "GRASSLAND", acreage: 3000 }
              as: RefugeManager
              captures: { u1: $.data.id }
            - call: "POST /refuge/determinations"
              payload: { use_type: "GRAZING", title: "Grazing compatibility", comment_open_date: "2026-09-05", comment_close_date: "2026-09-20" }
              as: PermitOfficer
              captures: { dg: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: RefugeManager
            - call: "POST /refuge/determinations/${dg}/open-comment"
              payload: {}
              as: PermitOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T00:00:00Z" }
              as: RefugeManager
            - call: "POST /refuge/determinations/${dg}/finalize"
              payload: { finding: "COMPATIBLE", rationale: "ok" }
              as: PermitOfficer
            - call: "POST /refuge/management-units/${u1}/grazing-offerings"
              payload: { description: "Winter grazing", aum_cap: 100, grazing_window_start: "2026-11-01", grazing_window_end: "2027-02-28", application_deadline: "2026-10-01", min_stewardship_rating: 5 }
              as: Biologist
              captures: { off1: $.data.id }
            - call: "POST /refuge/grazing-offerings/${off1}/bids"
              payload: { cooperator_ref: "coop-1", rate_cents_per_aum: 2000, stewardship_rating: 7 }
              as: Cooperator
              as_user_id: "coop-1"
              captures: { b1: $.data.id }
            - call: "POST /refuge/grazing-offerings/${off1}/close-and-select"
              payload: {}
              as: RefugeManager
            - call: "GET /refuge/cooperative-agreements"
              payload: { winning_bid_id: "${b1}" }
              as: RefugeManager
              captures: { ag1: "$.data[0].id", ag_v1: "$.data[0].version" }
          trigger:
            - call: "POST /refuge/citations"
              payload: { severity: "MAJOR", note: "Fence damage", subject_agreement_id: "${ag1}", expected_agreement_version: "${ag_v1}" }
              as: LawEnforcementOfficer
              captures: { cit1: $.data.id }
            - call: "GET /refuge/cooperative-agreements/${ag1}"
              as: RefugeManager
              captures: { pts_a: $.data.compliance_points, st_a: $.data.status, ag_v2: $.data.version }
            - call: "POST /refuge/citations"
              payload: { severity: "MAJOR", note: "Unauthorized access", subject_agreement_id: "${ag1}", expected_agreement_version: "${ag_v2}" }
              as: LawEnforcementOfficer
            - call: "GET /refuge/cooperative-agreements/${ag1}"
              as: RefugeManager
              captures: { pts_b: $.data.compliance_points, st_b: $.data.status }
            - call: "POST /refuge/citations/${cit1}/void"
              payload: { reason: "Dismissed on review" }
              as: LawEnforcementOfficer
            - call: "GET /refuge/cooperative-agreements/${ag1}"
              as: RefugeManager
              captures: { pts_c: $.data.compliance_points, st_c: $.data.status, ag_v4: $.data.version }
            - call: "POST /refuge/citations"
              payload: { severity: "CRITICAL", note: "Habitat destruction", subject_agreement_id: "${ag1}", expected_agreement_version: "${ag_v4}" }
              as: LawEnforcementOfficer
            - call: "GET /refuge/cooperative-agreements/${ag1}"
              as: RefugeManager
              captures: { pts_d: $.data.compliance_points, st_d: $.data.status }
          assert:
            - "after first MAJOR: compliance_points == 75 and status == ACTIVE (75 >= 60)"
            - "after second MAJOR: compliance_points == 50 and status == SUSPENDED (50 < 60)"
            - "after void: compliance_points == 75 and status == ACTIVE (auto-reinstate)"
            - "after CRITICAL: compliance_points == 25 and status == SUSPENDED (cycle ran twice)"

  - rule_id: transitive_cascade
    instances:
      - name: volunteer_expiry_releases_assignment_cancels_program
        grounds:
          - state_machines.Volunteer.CLEARED_to_EXPIRED
          - state_machines.VolunteerAssignment.ACTIVE_to_RELEASED
          - state_machines.InterpretiveProgram.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 cascade triggered by the clock: volunteer expiry (hop 0)
          releases that volunteer's ACTIVE assignment (hop 1), which drops the
          program below min_volunteers and cancels it (hop 2), which releases
          the OTHER volunteer's assignment (hop 3). Each hop is caused by the
          previous one, not by the clock directly.
        test_recipe:
          setup:
            - "One unit; volunteers V1 and V2 both CLEARED with cleared_on 2026-09-10; one SCHEDULED program (2027-12-01, min 2, max 5) with both assigned ACTIVE."
          setup_api_calls:
            - call: "POST /refuge/management-units"
              payload: { name: "Visitor Center Unit", habitat_type: "MIXED", acreage: 500 }
              as: RefugeManager
              captures: { u1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: RefugeManager
            - call: "POST /refuge/volunteers"
              payload: { full_name: "Vol One", email: "v1@x.com" }
              as: Anonymous
              captures: { v1: $.data.id }
            - call: "POST /refuge/volunteers"
              payload: { full_name: "Vol Two", email: "v2@x.com" }
              as: Anonymous
              captures: { v2: $.data.id }
            - call: "POST /refuge/volunteers/${v1}/clear-background"
              payload: {}
              as: VolunteerCoordinator
            - call: "POST /refuge/volunteers/${v2}/clear-background"
              payload: {}
              as: VolunteerCoordinator
            - call: "POST /refuge/management-units/${u1}/programs"
              payload: { title: "Marsh Walk", program_date: "2027-12-01", min_volunteers: 2, max_volunteers: 5 }
              as: VolunteerCoordinator
              captures: { prog1: $.data.id }
            - call: "POST /refuge/programs/${prog1}/assignments"
              payload: { volunteer_id: "${v1}" }
              as: VolunteerCoordinator
              captures: { as1: $.data.id }
            - call: "POST /refuge/programs/${prog1}/assignments"
              payload: { volunteer_id: "${v2}" }
              as: VolunteerCoordinator
              captures: { as2: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-10T00:00:00Z" }
              as: RefugeManager
            - call: "GET /refuge/assignments/${as1}"
              as: VolunteerCoordinator
              captures: { as1_st: $.data.status }
            - call: "GET /refuge/management-units/${u1}/programs"
              as: VolunteerCoordinator
              captures: { prog_st: "$.data[0].status" }
            - call: "GET /refuge/assignments/${as2}"
              as: VolunteerCoordinator
              captures: { as2_st: $.data.status }
          assert:
            - "V1 expired exactly at cleared_on + 365 days (boundary: 2026-09-10 + 365 = 2027-09-10 expires)"
            - "assignment ${as1} status == RELEASED (hop 1)"
            - "program ${prog1} status == CANCELLED (hop 2: only 1 ACTIVE assignment < min_volunteers 2)"
            - "assignment ${as2} status == RELEASED (hop 3: program cancellation cascades)"
      - name: citation_debit_suspends_agreement_depth2
        grounds:
          - state_machines.CooperativeAgreement.ACTIVE_to_SUSPENDED
          - calculations.compliance_point_deduction
          - endpoints[POST /refuge/citations]
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (POST /refuge/citations,
          not the clock): issuing a CRITICAL citation mutates
          CooperativeAgreement.compliance_points (hop 1), and that debit
          itself flips the agreement ACTIVE -> SUSPENDED (hop 2) because
          100 - 50 = 50 < 60.
        test_recipe:
          setup:
            - "One awarded ACTIVE CooperativeAgreement with compliance_points 100 (single winning bid coop-1)."
          setup_api_calls:
            - call: "POST /refuge/management-units"
              payload: { name: "South Pasture", habitat_type: "GRASSLAND", acreage: 3000 }
              as: RefugeManager
              captures: { u1: $.data.id }
            - call: "POST /refuge/determinations"
              payload: { use_type: "GRAZING", title: "Grazing compatibility", comment_open_date: "2026-09-05", comment_close_date: "2026-09-20" }
              as: PermitOfficer
              captures: { dg: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: RefugeManager
            - call: "POST /refuge/determinations/${dg}/open-comment"
              payload: {}
              as: PermitOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T00:00:00Z" }
              as: RefugeManager
            - call: "POST /refuge/determinations/${dg}/finalize"
              payload: { finding: "COMPATIBLE", rationale: "ok" }
              as: PermitOfficer
            - call: "POST /refuge/management-units/${u1}/grazing-offerings"
              payload: { description: "Winter grazing", aum_cap: 100, grazing_window_start: "2026-11-01", grazing_window_end: "2027-02-28", application_deadline: "2026-10-01", min_stewardship_rating: 5 }
              as: Biologist
              captures: { off1: $.data.id }
            - call: "POST /refuge/grazing-offerings/${off1}/bids"
              payload: { cooperator_ref: "coop-1", rate_cents_per_aum: 2000, stewardship_rating: 7 }
              as: Cooperator
              as_user_id: "coop-1"
              captures: { b1: $.data.id }
            - call: "POST /refuge/grazing-offerings/${off1}/close-and-select"
              payload: {}
              as: RefugeManager
            - call: "GET /refuge/cooperative-agreements"
              payload: { winning_bid_id: "${b1}" }
              as: RefugeManager
              captures: { ag1: "$.data[0].id", ag_v: "$.data[0].version" }
          trigger:
            - call: "POST /refuge/citations"
              payload: { severity: "CRITICAL", note: "Destroyed nesting cover", subject_agreement_id: "${ag1}", expected_agreement_version: "${ag_v}" }
              as: LawEnforcementOfficer
              captures: { cit_pts: $.data.points }
            - call: "GET /refuge/cooperative-agreements/${ag1}"
              as: RefugeManager
              captures: { pts: $.data.compliance_points, st: $.data.status }
          assert:
            - "citation.points == 50 (computed from CRITICAL severity, not input)"
            - "agreement.compliance_points == 50 (hop 1: the debit)"
            - "agreement.status == SUSPENDED (hop 2: caused by the debit crossing < 60, not by the endpoint directly)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pay_on_active_permit_state_beats_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=21]
          - state_machines.PermitApplication.APPROVED_to_ACTIVE
        distinguishing_aspect: |
          Category pair (state vs business_fiscal): paying on an already-ACTIVE
          permit with a wrong amount violates BOTH the state precondition
          (pay requires APPROVED) and the fiscal rule (amount != assessed).
          State (priority 5) MUST win: ERR_INVALID_STATE, not
          ERR_PAYMENT_AMOUNT_MISMATCH.
        test_recipe:
          setup:
            - "One ACTIVE RESEARCH permit (crew 4, 2026-10-10..2026-10-12, assessed 21000, already paid in full)."
          setup_api_calls:
            - call: "POST /refuge/management-units"
              payload: { name: "North Marsh", habitat_type: "WETLAND", acreage: 1200 }
              as: RefugeManager
              captures: { u1: $.data.id }
            - call: "POST /refuge/determinations"
              payload: { use_type: "RESEARCH", title: "Research use", comment_open_date: "2026-09-05", comment_close_date: "2026-09-20" }
              as: PermitOfficer
              captures: { d1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: RefugeManager
            - call: "POST /refuge/determinations/${d1}/open-comment"
              payload: {}
              as: PermitOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T00:00:00Z" }
              as: RefugeManager
            - call: "POST /refuge/determinations/${d1}/finalize"
              payload: { finding: "COMPATIBLE", rationale: "ok" }
              as: PermitOfficer
            - call: "POST /refuge/permits"
              payload: { applicant_ref: "app-1", management_unit_id: "${u1}", determination_id: "${d1}", use_type: "RESEARCH", crew_size: 4, start_date: "2026-10-10", end_date: "2026-10-12" }
              as: PermitApplicant
              as_user_id: "app-1"
              captures: { p1: $.data.id }
            - call: "POST /refuge/permits/${p1}/return-for-revision"
              payload: { note: "n" }
              as: PermitOfficer
            - call: "POST /refuge/permits/${p1}/resubmit"
              payload: {}
              as: PermitApplicant
              as_user_id: "app-1"
            - call: "POST /refuge/permits/${p1}/approve"
              payload: {}
              as: PermitOfficer
            - call: "POST /refuge/permits/${p1}/pay"
              payload: { amount_cents: 21000 }
              as: PermitApplicant
              as_user_id: "app-1"
          trigger:
            - call: "POST /refuge/permits/${p1}/pay"
              payload: { amount_cents: 1 }
              as: PermitApplicant
              as_user_id: "app-1"
              captures: { err: $.data.error_id }
          assert:
            - "second pay is rejected with error_id == ERR_INVALID_STATE (http 409), NOT ERR_PAYMENT_AMOUNT_MISMATCH"
            - "permit remains ACTIVE with no ledger change"
      - name: treatment_schedule_safety_beats_temporal
        grounds:
          - validations[priority=7]
          - validations[priority=20]
        distinguishing_aspect: |
          Category pair (business_safety vs business_temporal) — a different
          pair than state-vs-fiscal: a PRESCRIBED_BURN that violates the
          14-day nesting buffer AND strictly overlaps an existing treatment
          window must be rejected with ERR_NESTING_BLACKOUT (priority 7), not
          ERR_TREATMENT_WINDOW_OVERLAP (priority 20).
        test_recipe:
          setup:
            - "One unit; one NESTING closure 2027-03-01..2027-06-30 (SCHEDULED); one WATER_MANIPULATION treatment window 2027-02-10..2027-02-28 (SCHEDULED)."
          setup_api_calls:
            - call: "POST /refuge/management-units"
              payload: { name: "Prairie Unit", habitat_type: "GRASSLAND", acreage: 800 }
              as: RefugeManager
              captures: { u1: $.data.id }
            - call: "POST /refuge/management-units/${u1}/closures"
              payload: { closure_type: "NESTING", scope: "FULL", start_date: "2027-03-01", end_date: "2027-06-30" }
              as: Biologist
              captures: { c1: $.data.id }
            - call: "POST /refuge/management-units/${u1}/treatments"
              payload: { treatment_type: "WATER_MANIPULATION", window_start: "2027-02-10", window_end: "2027-02-28" }
              as: Biologist
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /refuge/management-units/${u1}/treatments"
              payload: { treatment_type: "PRESCRIBED_BURN", window_start: "2027-02-12", window_end: "2027-02-20" }
              as: Biologist
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NESTING_BLACKOUT (burn end 2027-02-20 exceeds nesting start 2027-03-01 minus 14 days = 2027-02-15)"
            - "NOT ERR_TREATMENT_WINDOW_OVERLAP even though [2027-02-12, 2027-02-20) strictly intersects [2027-02-10, 2027-02-28)"
            - "no third treatment is created"

  - rule_id: boundary_precision_check
    instances:
      - name: crew_size_20_crosses_large_tier_boundary
        grounds:
