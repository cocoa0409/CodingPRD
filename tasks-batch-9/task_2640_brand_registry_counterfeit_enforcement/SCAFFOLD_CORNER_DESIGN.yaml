      - name: brand_posture_prefers_an_active_enrollment_over_a_submitted_one
        claim_type: Input Set Filtering
        grounds:
          - calculations.brand_registry_posture
        distinguishing_aspect: "The posture ladder is precedence-based, not count-based: with one ACTIVE AMZ row and one SUBMITTED EBY row the brand is ENROLLED, and suspending the single ACTIVE row demotes it to ENROLLMENT_PENDING (not ENROLLMENT_LAPSED) because the SUBMITTED row still outranks the suspended one."
        test_recipe:
          setup:
            - "A brand with one REGISTERED registration covering class 8"
            - "Each enrollment create re-reads the brand version, because every posture recompute bumps it"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: BrandAdministrator
            - call: "POST /brand-protection/brands"
              payload: { name: "Acme Tools", owner_legal_entity: "Acme Tools LLC", home_jurisdiction: "US", authorized_msrp_cents: 10000, enforcement_budget_cents: 500000 }
              as: BrandAdministrator
              captures: { brand_id: $.data.id, brand_v1: $.data.version }
            - call: "POST /brand-protection/trademark-registrations"
              payload: { brand_id: "${brand_id}", registration_number: "US-4455667", jurisdiction: "US", nice_class: 8, registration_date: "2024-03-15", expiry_date: "2034-03-15", principal_register: true, status: "REGISTERED" }
              as: BrandAdministrator
              captures: { reg_id: $.data.id }
            - call: "POST /brand-protection/enrollments"
              payload: { brand_id: "${brand_id}", asserted_registration_id: "${reg_id}", marketplace_code: "AMZ", requested_nice_class: 8, expected_brand_version: "${brand_v1}" }
              as: BrandAdministrator
              captures: { enrA_id: $.data.id }
            - call: "POST /brand-protection/enrollments/${enrA_id}/activate"
              as: MarketplaceLiaison
            - call: "GET /brand-protection/brands/${brand_id}"
              as: BrandAdministrator
              captures: { brand_v2: $.data.version }
          trigger:
            - call: "POST /brand-protection/enrollments"
              payload: { brand_id: "${brand_id}", asserted_registration_id: "${reg_id}", marketplace_code: "EBY", requested_nice_class: 8, expected_brand_version: "${brand_v2}" }
              as: BrandAdministrator
              captures: { enrB_id: $.data.id }
            - call: "POST /brand-protection/enrollments/${enrA_id}/suspend"
              payload: { reason_code: "MARKETPLACE_ACTION" }
              as: MarketplaceLiaison
          assert:
            - "after the EBY create Brand.${brand_id}.status == ENROLLED (ACTIVE AMZ beats SUBMITTED EBY)"
            - "MarketplaceEnrollment.${enrB_id}.enrollment_status == SUBMITTED and activated_at == null"
            - "after the suspend Brand.${brand_id}.status == ENROLLMENT_PENDING"
            - "MarketplaceEnrollment.${enrA_id}.enrollment_status == SUSPENDED and superseded_by_enrollment_id == null (a suspension is not a supersession)"
            - "GET /brand-protection/enrollments?brand_id=${brand_id} returns total_count 2"

