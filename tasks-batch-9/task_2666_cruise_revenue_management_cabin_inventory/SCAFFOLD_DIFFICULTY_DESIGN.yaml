            - "Sailing.${sail_b}: gross_ticket_revenue_cents == 289990 and ralbd_net_cents == 20000 (399990 / 20 == 19999.5 rounds half up) and revenue_alert == false"
            - "Sailing.${sail_c}: gross_ticket_revenue_cents == 288000 and ralbd_net_cents == 19900 and revenue_alert == true"
            - "Booking.${bk_a}.net_ticket_cents == 290000, Booking.${bk_b}.net_ticket_cents == 289990, Booking.${bk_c}.net_ticket_cents == 288000"
            - "no revenue-summary read increments Sailing.version"

      - name: final_payment_at_exact_due_instant_is_on_time
        grounds:
          - validations[priority=16].ERR_FINAL_PAYMENT_OVERDUE
          - calculations.booking_fare_buildup.final_payment_due_date
          - state_machines.Booking.DEPOSIT_PAID_to_PAID_IN_FULL
        distinguishing_aspect: |
          The final-payment gate is an inclusive instant, not a date: with
          final_payment_days_before 75 on an embark of 2027-01-10T17:00:00Z the deadline is
          2026-10-27T17:00:00Z, and a payment posted at exactly that timestamp settles while one
          posted a single second later is refused. Two sibling bookings in identical states
          isolate the one-second difference, so an implementation that truncates to date
          granularity or uses a strict < comparison fails one of the two halves.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing AUR-2701 OPEN_FOR_SALE with the 365..120 IA fare window at base 189995."
            - "Two bookings of 2 adults, one per guest: each net_ticket_cents 379990, deposit_due_cents 75998, final_payment_due_date 2026-10-27T17:00:00Z."
            - "Both deposits are paid, so both sit at booking_status OPTION / payment_status DEPOSIT_PAID with balance_due_cents 303992."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000 }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "AUR-2701", embark_date: "2027-01-10T17:00:00Z", nights: 7, total_lower_berths: 200, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail1: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail1}", cabin_category_id: "${cat_ia}", physical_cabins: 60, oversell_allowance: 4 }
              as: RevenueManager
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail1}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 365, window_close_days_to_sail: 120, base_lower_berth_fare_cents: 189995, third_berth_fare_cents: 64997, fourth_berth_fare_cents: 49997 }
              as: RevenueManager
            - call: "POST /sailings/${sail1}/open-for-sale"
              payload: {}
              as: RevenueManager
            - call: "POST /guests"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_a: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Bo Chen", email: "bo@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_b: $.data.id }
            - call: "POST /bookings"
              payload: { sailing_id: "${sail1}", cabin_category_id: "${cat_ia}", guest_id: "${g_a}", occupancy_adults: 2 }
              as: ReservationAgent
              captures: { bk_x: $.data.id }
            - call: "POST /bookings"
              payload: { sailing_id: "${sail1}", cabin_category_id: "${cat_ia}", guest_id: "${g_b}", occupancy_adults: 2 }
              as: ReservationAgent
              captures: { bk_y: $.data.id }
            - call: "POST /bookings/${bk_x}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 75998 }
              as: ReservationAgent
            - call: "POST /bookings/${bk_y}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 75998 }
              as: ReservationAgent
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-27T17:00:00Z" }
              as: RevenueManager
            - call: "POST /bookings/${bk_x}/payments"
              payload: { kind: "FINAL_PAYMENT", amount_cents: 303992 }
              as: ReservationAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-27T17:00:01Z" }
              as: RevenueManager
            - call: "POST /bookings/${bk_y}/payments"
              payload: { kind: "FINAL_PAYMENT", amount_cents: 303992 }
              as: ReservationAgent
          assert:
            - "Booking.${bk_x}.final_payment_due_date == 2026-10-27T17:00:00Z"
            - "the payment at exactly 2026-10-27T17:00:00Z is accepted (201)"
            - "Booking.${bk_x}.payment_status == PAID_IN_FULL, amount_paid_cents == 379990, balance_due_cents == 0"
            - "the payment at 2026-10-27T17:00:01Z returns 422 with data.error_id == ERR_FINAL_PAYMENT_OVERDUE"
            - "Booking.${bk_y}.payment_status == DEPOSIT_PAID, amount_paid_cents == 75998, balance_due_cents == 303992"
            - "GET /bookings/${bk_y}/payment-events returns total_count == 1"
            - "Sailing.${sail1}.paid_in_full_bookings_count == 1"

      - name: zero_unpicked_cabins_at_review_is_self_loop_not_error
        grounds:
          - state_machines.GroupBlock.TENTATIVE_to_TENTATIVE
          - calculations.group_attrition_release
          - calculations.group_attrition_release.constants.REVIEW_EXTENSION_DAYS
        distinguishing_aspect: |
          The empty-set boundary of the attrition calculation: a block whose held cabins are all
          picked up has zero unpicked cabins, floor(0 * 0.5) == 0, and the review is a legal
          self-loop that only bumps review_count and pushes review_date out by
          REVIEW_EXTENSION_DAYS - it is not an error and it must not release a picked-up cabin.
          A sibling block one notch above the boundary (2 unpicked) is reviewed at the same
          instant and releases floor(2 * 0.5) == 1, proving the zero case is a boundary rather
          than a disabled code path.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing GRP-2701 OPEN_FOR_SALE, 20 lower berths over 4 nights, IA allotment of 5 cabins with oversell_allowance 0 and a 730..0 fare window at base 50000."
            - "Block FULL holds 3 cabins with release_policy ATTRITION_50 and review_date 2026-08-16T00:00:00Z; three single-adult bookings are made against it, so picked_up_cabins == 3 and unpicked == 0. Each such booking prices at net_ticket_cents 87500 with deposit_due_cents 25000 (the per-guest minimum floor beats 20 percent of 87500)."
            - "Block HALF holds the remaining 2 cabins with the same policy and review date and has no pick-up, so unpicked == 2."
            - "The clock is then moved to 2026-08-16T00:00:00Z, exactly the review date."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000 }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "GRP-2701", embark_date: "2027-01-10T17:00:00Z", nights: 4, total_lower_berths: 20, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail_g: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_g}", cabin_category_id: "${cat_ia}", physical_cabins: 5, oversell_allowance: 0 }
              as: RevenueManager
              captures: { inv_g: $.data.id }
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_g}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 730, window_close_days_to_sail: 0, base_lower_berth_fare_cents: 50000, third_berth_fare_cents: 20000, fourth_berth_fare_cents: 15000 }
              as: RevenueManager
            - call: "POST /sailings/${sail_g}/open-for-sale"
              payload: {}
              as: RevenueManager
            - call: "POST /group-blocks"
              payload: { sailing_id: "${sail_g}", cabin_category_id: "${cat_ia}", agency_name: "Full Pickup Agency", cabins_held: 3, review_date: "2026-08-16T00:00:00Z", release_policy: "ATTRITION_50" }
              as: GroupSalesAgent
              as_user_id: "gsa-001"
              captures: { blk_full: $.data.id }
            - call: "POST /group-blocks"
              payload: { sailing_id: "${sail_g}", cabin_category_id: "${cat_ia}", agency_name: "Half Pickup Agency", cabins_held: 2, review_date: "2026-08-16T00:00:00Z", release_policy: "ATTRITION_50" }
              as: GroupSalesAgent
              as_user_id: "gsa-001"
              captures: { blk_half: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Bo Chen", email: "bo@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_none: $.data.id }
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_g}", cabin_category_id: "${cat_ia}", guest_id: "${g_none}", occupancy_adults: 1, group_block_id: "${blk_full}" }
              as: ReservationAgent
              captures: { bk_g1: $.data.id }
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_g}", cabin_category_id: "${cat_ia}", guest_id: "${g_none}", occupancy_adults: 1, group_block_id: "${blk_full}" }
              as: ReservationAgent
              captures: { bk_g2: $.data.id }
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_g}", cabin_category_id: "${cat_ia}", guest_id: "${g_none}", occupancy_adults: 1, group_block_id: "${blk_full}" }
              as: ReservationAgent
              captures: { bk_g3: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: RevenueManager
          trigger:
            - call: "POST /group-blocks/${blk_full}/review"
              payload: {}
              as: GroupSalesAgent
              as_user_id: "gsa-002"
            - call: "POST /group-blocks/${blk_half}/review"
              payload: {}
              as: GroupSalesAgent
              as_user_id: "gsa-002"
          assert:
            - "the FULL review returns 200, not an error"
            - "GroupBlock.${blk_full}.status == TENTATIVE (self-loop, not PARTIALLY_RELEASED)"
            - "GroupBlock.${blk_full}.cabins_held == 3 and picked_up_cabins == 3 and released_cabins_total == 0"
            - "GroupBlock.${blk_full}.review_count == 1 and review_extension_count == 0"
            - "GroupBlock.${blk_full}.review_date == 2026-08-30T00:00:00Z (pushed out by REVIEW_EXTENSION_DAYS == 14)"
            - "GroupBlock.${blk_half}.status == PARTIALLY_RELEASED with cabins_held == 1, released_cabins_total == 1, review_count == 1"
            - "SailingInventory.${inv_g}.group_held_cabins == 1 (only the HALF block still fences an unpicked cabin)"
            - "SailingInventory.${inv_g}.booked_cabins == 3 and released_cabins_total == 1 and available_cabins == 1"
            - "Booking.${bk_g1}.net_ticket_cents == 87500 and deposit_due_cents == 25000"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: booking_confirm_requires_group_block_definite
        grounds:
          - validations[priority=11].ERR_GROUP_BLOCK_NOT_DEFINITE
          - state_machines.Booking.OPTION_to_CONFIRMED
          - state_machines.GroupBlock.TENTATIVE_to_DEFINITE
        distinguishing_aspect: |
          The Booking is in a perfectly valid state to confirm - OPTION with a paid deposit on an
          OPEN_FOR_SALE sailing - and is refused solely because of a THIRD entity's state: the
          GroupBlock it draws from is still TENTATIVE. Nothing about the booking changes between
          the refusal and the success; only the GroupBlock moves to DEFINITE, and the identical
          confirm call then works.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing CGB-2701 OPEN_FOR_SALE with an IA allotment of 5 cabins, oversell_allowance 0, and a 730..0 fare window at base 50000."
            - "Operator gsa-001 creates a TENTATIVE group block holding 2 cabins with review_date 2026-09-01T00:00:00Z."
            - "One single-adult booking draws on that block: net_ticket_cents 87500, deposit_due_cents 25000."
            - "The deposit is paid, so the booking is OPTION / DEPOSIT_PAID - every booking-local precondition for confirm is already satisfied."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000 }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "CGB-2701", embark_date: "2027-01-10T17:00:00Z", nights: 4, total_lower_berths: 20, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail_d: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_d}", cabin_category_id: "${cat_ia}", physical_cabins: 5, oversell_allowance: 0 }
              as: RevenueManager
              captures: { inv_d: $.data.id }
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_d}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 730, window_close_days_to_sail: 0, base_lower_berth_fare_cents: 50000, third_berth_fare_cents: 20000, fourth_berth_fare_cents: 15000 }
              as: RevenueManager
            - call: "POST /sailings/${sail_d}/open-for-sale"
              payload: {}
              as: RevenueManager
            - call: "POST /group-blocks"
              payload: { sailing_id: "${sail_d}", cabin_category_id: "${cat_ia}", agency_name: "Meridian Travel", cabins_held: 2, review_date: "2026-09-01T00:00:00Z", release_policy: "ATTRITION_50" }
              as: GroupSalesAgent
              as_user_id: "gsa-001"
              captures: { blk_d: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Bo Chen", email: "bo@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_none: $.data.id }
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_d}", cabin_category_id: "${cat_ia}", guest_id: "${g_none}", occupancy_adults: 1, group_block_id: "${blk_d}" }
              as: ReservationAgent
              captures: { bk_d: $.data.id }
            - call: "POST /bookings/${bk_d}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 25000 }
              as: ReservationAgent
          trigger:
            - call: "POST /bookings/${bk_d}/confirm"
              payload: {}
              as: ReservationAgent
            - call: "POST /group-blocks/${blk_d}/confirm-definite"
              payload: { contract_reference: "CT-7001" }
              as: GroupSalesAgent
              as_user_id: "gsa-002"
            - call: "POST /bookings/${bk_d}/confirm"
              payload: {}
              as: ReservationAgent
          assert:
            - "the first confirm returns HTTP 409 with data.error_id == ERR_GROUP_BLOCK_NOT_DEFINITE"
            - "after that refusal Booking.${bk_d}.booking_status == OPTION and payment_status == DEPOSIT_PAID"
            - "GroupBlock.${blk_d}.status == DEFINITE after the confirm-definite call"
            - "the second confirm returns 200 and Booking.${bk_d}.booking_status == CONFIRMED"
            - "Booking.${bk_d}.payment_status == DEPOSIT_PAID (unchanged by the confirm)"
            - "Sailing.${sail_d}.confirmed_bookings_count == 1"
            - "SailingInventory.${inv_d}.booked_cabins == 1, group_held_cabins == 1, available_cabins == 3"

      - name: bid_award_requires_target_allotment_availability
        grounds:
          - validations[priority=19].ERR_TARGET_CATEGORY_UNAVAILABLE
          - state_machines.UpgradeBid.SUBMITTED_to_ACCEPTED
          - calculations.oversell_availability
          - calculations.booking_onboard_projection
        distinguishing_aspect: |
          The blocking entity here is a SailingInventory row belonging to a DIFFERENT cabin
          category than the bid's own booking, and the unblocking act happens on yet another
          entity: cancelling an unrelated guest's OV booking frees the single OV cabin, after
          which the identical accept succeeds and moves the bidder across categories. Unlike the
          GroupBlock case, the dependency is on a derived counter rather than a lifecycle state.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing AUR-2701 OPEN_FOR_SALE with a guarantee IA allotment of 60 cabins (oversell_allowance 4) and a named OV allotment of exactly 1 cabin (oversell_allowance 0). IA.upgrade_to_category_id points at OV."
            - "Fare windows: IA 365..120 at 189995 and IA 120..60 at 219995; OV 365..120 at 289995 and OV 120..60 at 289995."
            - "Guest Ada books IA for 2 adults (net_ticket_cents 379990, projected_onboard_gross_cents 126000); guest Bo books the only OV cabin, so the OV allotment has available_cabins 0."
            - "The clock moves to 2026-11-11T17:00:00Z (days_to_sail 60) and Ada submits an IA -> OV bid at exactly the floor, 21000 per guest."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
