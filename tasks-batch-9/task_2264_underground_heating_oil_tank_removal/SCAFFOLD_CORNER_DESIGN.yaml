# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Coverage Index)
# Task 2264 — Underground Heating-Oil Tank Removal & Soil Remediation
#
# Taxonomy: references/claim-extraction-guide.md. `section:` values are the
# guide's nine sections; `claim_type:` values are its per-section rows only.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as
# `excluded_because:` stubs naming the covering §1.8 instance.
#
# Standing conventions used by every recipe below (so each chain stays terse):
#   * the logical clock starts at the mandated default 2026-08-01T00:00:00Z and
#     every chain sets it explicitly before its first business call;
#   * the base survey payload {GPR, 1 tank, 550 gal, depth 60 in, distance 90 in,
#     not under a structure, STEEL} scores 36.00 → recommended_method REMOVAL,
#     so a work order with method "REMOVAL" needs no method_override_reason;
#   * NON_EXISTENT ids are written as the literal
#     "00000000-0000-0000-0000-000000000000".
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: property_creation_returns_declared_fields_and_state_keyed_deductible
        claim_type: creation
        grounds:
          - endpoints[POST /properties]
          - entities.Property.fields.trust_fund_deductible_cents
          - entities.Property.fields.open_project_count
          - response_envelope
        distinguishing_aspect: "POST /properties with all six required fields returns 201, echoes each input verbatim, and derives trust_fund_deductible_cents 50000 from state_code NJ with open_project_count 0."
        test_recipe:
          setup: ["Empty database; logical clock at 2026-08-03T08:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /properties"
              payload: { street_address: "1 Corner Way", state_code: "NJ", county_code: "MRS", homeowner_name: "Ann Hale", homeowner_email: "ann@example.com", insurance_carrier_code: "CARR-C-1" }
              as: ProjectCoordinator
              captures: { prop_id: $.data.id, ded: $.data.trust_fund_deductible_cents, opc: $.data.open_project_count, ver: $.data.version, created: $.data.created_at }
          assert:
            - "HTTP status == 201"
            - "${ded} == 50000"
            - "${opc} == 0"
            - "${ver} == 1"
            - "${created} == 2026-08-03T08:00:00Z"
            - "Property.${prop_id}.state_code == NJ"
            - "Property.${prop_id}.first_party_coverage_limit_cents == 2000000"
            - "Property.${prop_id}.third_party_sublimit_cents == 5000000"
            - "the response body has exactly the two top-level keys declared by response_envelope"

      - name: tank_project_retrieval_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /tank-projects/{id}]
          - entities.TankProject.fields.property_id
        distinguishing_aspect: "GET /tank-projects/{id} returns the same id, property_id and status INTAKE that POST /tank-projects minted, with version still 1."
        test_recipe:
          setup: ["One NJ Property and one TankProject at INTAKE."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { street_address: "2 Corner Way", state_code: "NJ", county_code: "MRS", homeowner_name: "Bea Ives", homeowner_email: "bea@example.com", insurance_carrier_code: "CARR-C-2" }
              as: ProjectCoordinator
              captures: { prop_id: $.data.id }
            - call: "POST /tank-projects"
              payload: { property_id: "${prop_id}" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
          trigger:
            - call: "GET /tank-projects/${proj_id}"
              as: ProjectCoordinator
              captures: { got_id: $.data.id, got_prop: $.data.property_id, got_status: $.data.status, got_ver: $.data.version }
          assert:
            - "HTTP status == 200"
            - "${got_id} == ${proj_id}"
            - "${got_prop} == ${prop_id}"
            - "${got_status} == INTAKE"
            - "${got_ver} == 1"

      - name: tank_project_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /tank-projects]
          - response_envelope
        distinguishing_aspect: "Three projects on one property listed with limit 2 / offset 0 return 2 items, total_count 3 and has_more true; offset 2 returns the remaining 1 item with has_more false."
        test_recipe:
          setup: ["One NJ Property carrying exactly three TankProjects, all at INTAKE."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { street_address: "3 Corner Way", state_code: "NJ", county_code: "MRS", homeowner_name: "Cal Jung", homeowner_email: "cal@example.com", insurance_carrier_code: "CARR-C-3" }
              as: ProjectCoordinator
              captures: { prop_id: $.data.id }
            - call: "POST /tank-projects"
              payload: { property_id: "${prop_id}" }
              as: ProjectCoordinator
              captures: { p1: $.data.id }
            - call: "POST /tank-projects"
              payload: { property_id: "${prop_id}" }
              as: ProjectCoordinator
              captures: { p2: $.data.id }
            - call: "POST /tank-projects"
              payload: { property_id: "${prop_id}" }
              as: ProjectCoordinator
              captures: { p3: $.data.id }
          trigger:
            - call: "GET /tank-projects?property_id=${prop_id}&limit=2&offset=0"
              as: ProjectCoordinator
              captures: { page1_first_id: "$.data[0].id" }
            - call: "GET /tank-projects?property_id=${prop_id}&limit=2&offset=2"
              as: ProjectCoordinator
              captures: { page2_first_id: "$.data[0].id" }
          assert:
            - "the first page carries exactly 2 items with pagination fields limit == 2, offset == 0, total_count == 3, has_more == true"
            - "${page1_first_id} == ${p1} (created_at ASC ordering)"
            - "the second page carries exactly 1 item with pagination fields limit == 2, offset == 2, total_count == 3, has_more == false"
            - "${page2_first_id} == ${p3}"
            - "the union of both pages is exactly {${p1}, ${p2}, ${p3}} with no duplicate id"

      - name: tank_project_with_unknown_path_id_is_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_TANK_PROJECT_NOT_FOUND]
          - validations[priority=30]
        distinguishing_aspect: "GET /tank-projects/{id} on an id that was never minted returns ERR_TANK_PROJECT_NOT_FOUND with HTTP 404 and no envelope data payload."
        test_recipe:
          setup: ["Empty database apart from the clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "GET /tank-projects/00000000-0000-0000-0000-000000000000"
              as: ProjectCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_TANK_PROJECT_NOT_FOUND"
            - "HTTP status == 404"

      - name: crew_creation_missing_required_cert_level_is_rejected
        claim_type: required_fields
        grounds:
          - endpoints[POST /crews]
          - validations[priority=35]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /crews without cert_level — an input field with no default — returns ERR_INVALID_REQUEST 422 and creates no Crew row."
        test_recipe:
          setup: ["Empty database apart from the clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /crews"
              payload: { crew_name: "Crew Missing Required Field" }
              as: ProjectCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "HTTP status == 422"
            - "no Crew row exists"

      - name: tank_project_scope_defaults_and_computed_blockers_on_creation
        claim_type: defaults
        grounds:
          - entities.TankProject.fields.baseline_scope_cubic_yards
          - entities.TankProject.fields.excavation_limit_cubic_yards
          - entities.TankProject.fields.nfa_blockers
          - calculations.nfa_blocker_set
        distinguishing_aspect: "Omitting both scope fields applies 8.0 and 40.0, and the freshly created project's computed nfa_blockers is exactly [\"CONTAMINATION_NOT_CLEARED\", \"FIELD_WORK_INCOMPLETE\"] in lexicographic ascending order."
        test_recipe:
          setup: ["One NJ Property; no projects yet."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { street_address: "4 Corner Way", state_code: "NJ", county_code: "MRS", homeowner_name: "Dee Kwon", homeowner_email: "dee@example.com", insurance_carrier_code: "CARR-C-4" }
              as: ProjectCoordinator
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /tank-projects"
              payload: { property_id: "${prop_id}" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id, base: $.data.baseline_scope_cubic_yards, limit: $.data.excavation_limit_cubic_yards, blockers: $.data.nfa_blockers }
          assert:
            - "${base} == 8.0"
            - "${limit} == 40.0"
            - "${blockers} == [CONTAMINATION_NOT_CLEARED, FIELD_WORK_INCOMPLETE]"
            - "TankProject.${proj_id}.status == INTAKE"
            - "TankProject.${proj_id}.contamination_class == UNCLASSIFIED"
            - "TankProject.${proj_id}.remediation_cost_cents == 0"
            - "TankProject.${proj_id}.sampling_round == 0"
            - "TankProject.${proj_id}.remediation_started == false"

      - name: laboratory_defaults_applied_when_all_optional_thresholds_omitted
        claim_type: defaults
        grounds:
          - endpoints[POST /laboratories]
          - entities.Laboratory.fields.accredited
          - entities.Laboratory.fields.committed_turnaround_hours
          - entities.Laboratory.fields.holding_time_hours
          - entities.Laboratory.fields.max_concurrent_analyses
        distinguishing_aspect: "POST /laboratories with lab_name only applies accredited true, committed_turnaround_hours 72, holding_time_hours 336 and max_concurrent_analyses 2."
        test_recipe:
          setup: ["Empty database apart from the clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /laboratories"
              payload: { lab_name: "Default Values Lab" }
              as: ComplianceOfficer
              captures: { lab_id: $.data.id, acc: $.data.accredited, tat: $.data.committed_turnaround_hours, hold: $.data.holding_time_hours, cap: $.data.max_concurrent_analyses }
          assert:
            - "${acc} == true"
            - "${tat} == 72"
            - "${hold} == 336"
            - "${cap} == 2"
            - "Laboratory.${lab_id}.version == 1"

      - name: property_system_fields_are_server_minted_and_version_advances_on_child_write
        claim_type: system_fields
        grounds:
          - entities.Property.fields.open_project_count
          - entities.Property.common_fields
        distinguishing_aspect: "id, created_at, updated_at and version are minted by the server at 2026-08-03T08:00:00Z with version 1, and creating a project on the property lifts its computed open_project_count to 1 while created_at stays fixed."
        test_recipe:
          setup: ["One NJ Property, no projects."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { street_address: "5 Corner Way", state_code: "CT", county_code: "FFD", homeowner_name: "Eve Lam", homeowner_email: "eve@example.com", insurance_carrier_code: "CARR-C-5" }
              as: ProjectCoordinator
              captures: { prop_id: $.data.id, created0: $.data.created_at, ver0: $.data.version, opc0: $.data.open_project_count }
          trigger:
            - call: "POST /tank-projects"
              payload: { property_id: "${prop_id}" }
              as: ProjectCoordinator
            - call: "GET /properties/${prop_id}"
              as: ProjectCoordinator
              captures: { created1: $.data.created_at, opc1: $.data.open_project_count, ded: $.data.trust_fund_deductible_cents }
          assert:
            - "${ver0} == 1"
            - "${opc0} == 0"
            - "${created0} == 2026-08-03T08:00:00Z"
            - "${created1} == ${created0}"
            - "${opc1} == 1"
            - "${ded} == 25000"

      - name: sweep_survey_rejects_an_undeclared_survey_method_enum_member
        claim_type: type_constraints
        grounds:
          - endpoints[POST /tank-projects/{id}/sweep-survey]
          - validations[priority=35]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "survey_method \"SONAR\" is not a declared enum member, so the survey is rejected with ERR_INVALID_REQUEST 422 and the project stays at INTAKE with method_score null."
        test_recipe:
          setup: ["One NJ Property and one TankProject at INTAKE."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { street_address: "6 Corner Way", state_code: "NJ", county_code: "MRS", homeowner_name: "Fay Nero", homeowner_email: "fay@example.com", insurance_carrier_code: "CARR-C-6" }
              as: ProjectCoordinator
              captures: { prop_id: $.data.id }
            - call: "POST /tank-projects"
              payload: { property_id: "${prop_id}" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /tank-projects/${proj_id}/sweep-survey"
              payload: { survey_method: "SONAR", tanks_detected_count: 1, tank_capacity_gallons: 550, tank_depth_to_top_inches: 60, tank_distance_to_foundation_inches: 90, tank_under_structure: false, tank_material: "STEEL" }
              as: FieldTechnician
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "HTTP status == 422"
            - "TankProject.${proj_id}.status == INTAKE"
            - "TankProject.${proj_id}.survey_method == null"
            - "TankProject.${proj_id}.method_score == null"

      - name: work_order_rejects_scheduled_end_not_after_scheduled_start
        claim_type: type_constraints
        grounds:
          - endpoints[POST /work-orders]
          - validations[priority=35]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "scheduled_end_at equal to scheduled_start_at is a zero-length interval, rejected with ERR_INVALID_REQUEST 422 before the crew-overlap check ever runs, and no work order row is created."
        test_recipe:
          setup: ["One NJ Property, one TankProject at SURVEYED with recommended_method REMOVAL, one Crew."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { street_address: "7 Corner Way", state_code: "NJ", county_code: "MRS", homeowner_name: "Gus Oh", homeowner_email: "gus@example.com", insurance_carrier_code: "CARR-C-7" }
              as: ProjectCoordinator
              captures: { prop_id: $.data.id }
            - call: "POST /tank-projects"
              payload: { property_id: "${prop_id}" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /tank-projects/${proj_id}/sweep-survey"
              payload: { survey_method: "GPR", tanks_detected_count: 1, tank_capacity_gallons: 550, tank_depth_to_top_inches: 60, tank_distance_to_foundation_inches: 90, tank_under_structure: false, tank_material: "STEEL" }
              as: FieldTechnician
            - call: "POST /crews"
              payload: { crew_name: "Crew Zero Length", cert_level: "TANK_TECH_II" }
              as: ProjectCoordinator
              captures: { crew_id: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { tank_project_id: "${proj_id}", crew_id: "${crew_id}", method: "REMOVAL", scheduled_start_at: "2026-08-06T13:00:00Z", scheduled_end_at: "2026-08-06T13:00:00Z" }
              as: ProjectCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "HTTP status == 422"
            - "GET /work-orders?crew_id=${crew_id} returns total_count == 0"

      - name: tank_project_requires_an_existing_parent_property
        claim_type: parent_relationships
        grounds:
          - entities.TankProject.fields.property_id
          - validations[priority=32]
          - errors[ERR_PROPERTY_NOT_FOUND]
        distinguishing_aspect: "POST /tank-projects naming a property_id that resolves to nothing returns ERR_PROPERTY_NOT_FOUND 404, proving the flat topology validates the FK rather than storing a dangling reference."
        test_recipe:
          setup: ["Empty database apart from the clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /tank-projects"
              payload: { property_id: "00000000-0000-0000-0000-000000000000" }
              as: ProjectCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_PROPERTY_NOT_FOUND"
            - "HTTP status == 404"
            - "no TankProject row exists"

      - name: disclosure_creation_requires_an_existing_tank_project_not_found
        claim_type: parent_relationships
        grounds:
          - entities.HomeownerDisclosure.fields.tank_project_id
          - validations[priority=30]
          - errors[ERR_TANK_PROJECT_NOT_FOUND]
        distinguishing_aspect: "A second, structurally different FK edge (HomeownerDisclosure -> TankProject) is validated on create: an unknown tank_project_id returns ERR_TANK_PROJECT_NOT_FOUND 404 and no disclosure row."
        test_recipe:
          setup: ["Empty database apart from the clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /disclosures"
              payload: { tank_project_id: "00000000-0000-0000-0000-000000000000", disclosure_kind: "SWEEP_FINDINGS" }
              as: ProjectCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_TANK_PROJECT_NOT_FOUND"
            - "HTTP status == 404"
            - "GET /disclosures returns total_count == 0"

      - name: computed_method_score_and_recommended_method_derivation
        claim_type: computed_fields
        grounds:
          - entities.TankProject.fields.method_score
          - entities.TankProject.fields.recommended_method
        excluded_because:
          difficulty_instance: combinatorial_formula / method_score_mode_a_nested_clamps_over_five_factors
          rationale: "That §1.8 instance asserts method_score and recommended_method as the computed output of the sweep-survey payload, including the clamp behaviour; a duplicate corner would add no signal."

  # ===========================================================================
  - section: state_machines
    instances:

      - name: tank_project_starts_in_intake_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.TankProject.initial_state
        distinguishing_aspect: "A newly created TankProject reads status INTAKE with survey_completed_at null and decommission_method null — no transition has fired yet."
        test_recipe:
          setup: ["One NJ Property."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { street_address: "8 Corner Way", state_code: "NJ", county_code: "MRS", homeowner_name: "Hal Pike", homeowner_email: "hal@example.com", insurance_carrier_code: "CARR-C-8" }
              as: ProjectCoordinator
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /tank-projects"
              payload: { property_id: "${prop_id}" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id, st: $.data.status }
          assert:
            - "${st} == INTAKE"
            - "TankProject.${proj_id}.survey_completed_at == null"
            - "TankProject.${proj_id}.decommission_method == null"
            - "TankProject.${proj_id}.approved_scope_cubic_yards == null"

      - name: sweep_survey_recorded_twice_is_rejected_on_the_second_attempt
        claim_type: idempotency
        grounds:
          - state_machines.TankProject.INTAKE_to_SURVEYED
          - validations[priority=40]
          - errors[ERR_PROJECT_STATE_INVALID]
        distinguishing_aspect: "The INTAKE -> SURVEYED precondition status == INTAKE makes a repeat sweep survey fail with ERR_PROJECT_STATE_INVALID 409, and the second payload's larger tank does not overwrite the first survey's method_score 36.00."
        test_recipe:
          setup: ["One TankProject already SURVEYED from the base survey payload (method_score 36.00, recommended_method REMOVAL)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { street_address: "9 Corner Way", state_code: "NJ", county_code: "MRS", homeowner_name: "Ivy Ruiz", homeowner_email: "ivy@example.com", insurance_carrier_code: "CARR-C-9" }
              as: ProjectCoordinator
              captures: { prop_id: $.data.id }
            - call: "POST /tank-projects"
              payload: { property_id: "${prop_id}" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /tank-projects/${proj_id}/sweep-survey"
              payload: { survey_method: "GPR", tanks_detected_count: 1, tank_capacity_gallons: 550, tank_depth_to_top_inches: 60, tank_distance_to_foundation_inches: 90, tank_under_structure: false, tank_material: "STEEL" }
              as: FieldTechnician
              captures: { score1: $.data.method_score }
          trigger:
            - call: "POST /tank-projects/${proj_id}/sweep-survey"
              payload: { survey_method: "PROBE_ROD", tanks_detected_count: 2, tank_capacity_gallons: 1000, tank_depth_to_top_inches: 200, tank_distance_to_foundation_inches: 0, tank_under_structure: true, tank_material: "FIBERGLASS" }
              as: FieldTechnician
              captures: { err: $.data.error_id }
          assert:
            - "${score1} == 36.00"
            - "${err} == ERR_PROJECT_STATE_INVALID"
            - "HTTP status == 409"
            - "TankProject.${proj_id}.method_score == 36.00"
            - "TankProject.${proj_id}.survey_method == GPR"
            - "TankProject.${proj_id}.tanks_detected_count == 1"
            - "TankProject.${proj_id}.status == SURVEYED"

      - name: disclosure_responded_twice_is_rejected_on_the_second_attempt
        claim_type: idempotency
        grounds:
          - state_machines.HomeownerDisclosure.PENDING_to_ACKNOWLEDGED
          - errors[ERR_DISCLOSURE_STATE_INVALID]
        distinguishing_aspect: "ACKNOWLEDGED is terminal for HomeownerDisclosure, so a second respond call returns ERR_DISCLOSURE_STATE_INVALID 409 and responded_at keeps its first value 2026-08-03T08:00:00Z."
        test_recipe:
          setup: ["One TankProject at DISCLOSED whose SWEEP_FINDINGS disclosure is ACKNOWLEDGED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
