        distinguishing_aspect: |
          MIN_NOTICE_DAYS is 14 for every announced cycle_type, so notice_days 10 must return
          ERR_INVALID_NOTICE_PERIOD (422) and create nothing, while the identical request with
          notice_days 14 must return 201 - the boundary itself is accepted.
        test_recipe:
          setup:
            - "Clock 2026-08-10; one PUBLISHED scheme; one applicant organization in APPLIED with no cycle."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: SchemeManager
            - call: "POST /accreditation/schemes"
              payload: { program_code: "ISO17025-CAL", name: "Calibration laboratories", standard_ref: "ISO_IEC_17025", witness_min_count: 2, qualification_points_required: 60.0 }
              as: SchemeManager
              captures: { scheme_id: $.data.id }
            - call: "POST /accreditation/schemes/${scheme_id}/status"
              payload: { to_status: "UNDER_REVIEW" }
              as: SchemeManager
            - call: "POST /accreditation/schemes/${scheme_id}/status"
              payload: { to_status: "PUBLISHED" }
              as: SchemeManager
            - call: "POST /accreditation/organizations"
              payload: { legal_name: "Northlight Testing AB", country_code: "SE", contact_email: "qa@northlight.test" }
              as: AssessmentManager
              captures: { org_id: $.data.id }
          trigger:
            - call: "POST /accreditation/applications"
              payload: { organization_id: "${org_id}", scheme_id: "${scheme_id}", cycle_type: "INITIAL", requested_scope_lines: ["mass calibration 1 mg - 20 kg"], notice_days: 10 }
              as: AssessmentManager
          assert:
            - "HTTP 422 with data.error_id == \"ERR_INVALID_NOTICE_PERIOD\""
            - "GET /accreditation/applications?organization_id=${org_id} returns total_count == 0"
            - "ApplicantOrganization.${org_id}.status is still APPLIED"
            - "the same POST with notice_days 14 returns HTTP 201 with notice_days == 14, status SUBMITTED and pinned_scheme_rule_revision == 1"

