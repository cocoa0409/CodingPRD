              captures: { p1_id: $.data.id }
            - call: "POST /land-bank/acquisition-packets"
              payload: { property_id: "${p1_id}", funding_source_id: "${fs_id}", channel: "DONATION", offer_price_cents: 0, title_search_fee_cents: 10000, donor_name: "Hollis Street Trust" }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { pk1_id: $.data.id }
            - call: "POST /land-bank/acquisition-packets/${pk1_id}/board-approval"
              payload: { resolution_no: "R-2026-091" }
              as: BoardClerk
              as_user_id: "clerk-1"
            - call: "POST /land-bank/acquisition-packets/${pk1_id}/close"
              payload: { deed_reference: "BK-4417-PG-31" }
              as: IntakeOfficer
              as_user_id: "intake-2"
            - call: "POST /land-bank/properties/${p1_id}/title-actions"
              payload: { action_type: "TAX_DEED_CONFIRMATION" }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { ta1_id: $.data.id }
            - call: "POST /land-bank/title-actions/${ta1_id}/adjudicate"
              payload: { outcome: "CLEARED" }
              as: IntakeOfficer
              as_user_id: "intake-1"
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-100071", address: "71 Hollis St", situs_ward: 7, lot_area_sqft: 4000, assessed_value_cents: 160000, structure_present: false, structure_condition_grade: "C", vacancy_months: 4 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p2_id: $.data.id }
            - call: "POST /land-bank/acquisition-packets"
              payload: { property_id: "${p2_id}", funding_source_id: "${fs_id}", channel: "NEGOTIATED_PURCHASE", offer_price_cents: 25000, title_search_fee_cents: 5000 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { pk2_id: $.data.id }
            - call: "GET /land-bank/funding-sources/${fs_id}"
              payload: {}
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { fs_v: $.data.version, avail_before: $.data.available_cents }
            - call: "POST /land-bank/demolition-runs"
              payload: { funding_source_id: "${fs_id}", budget_cents: 1590000, expected_funding_source_version: "${fs_v}" }
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { run_id: $.data.id, cap: $.data.provisional_cap_cents }
          trigger:
            - call: "POST /land-bank/demolition-runs/${run_id}/execute"
              payload: {}
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { orders_created: $.data.orders_created_count, total_committed: $.data.total_committed_cents }
          assert:
            - "${avail_before} == 1590000 and ${cap} == 1479069  # floor(1590000 / 1.075)"
            - "${orders_created} == 1  # link 1: one SCHEDULED DEMOLITION order created for P1"
            - "MaintenanceOrder(demolition_run_id=${run_id}).estimated_cost_cents == 1427611 and contractor_id == null and window_start == 2026-08-01T00:00:00Z and window_end == 2026-09-15T00:00:00Z"
            - "DemolitionRun.${run_id}.admin_fee_cents == 107071 and ${total_committed} == 1534682  # link 2"
            - "FundingSource.${fs_id}.committed_cents == 1534682 and FundingSource.${fs_id}.disbursed_cents == 10000"
            - "FundingSource.${fs_id}.available_cents == 55318 and 55318 < 80000  # link 3 precondition"
            - "FundingSource.${fs_id}.status == CONSTRAINED  # link 3"
            - "AcquisitionPacket.${pk2_id}.status == ON_HOLD_FUNDING and AcquisitionPacket.${pk2_id}.hold_reason == 'FUNDING_SOURCE_CONSTRAINED'  # link 4"
            - "AcquisitionPacket.${pk1_id}.status == CLOSED  # already terminal: the cascade only touches DUE_DILIGENCE packets"
            - "DemolitionRun.${run_id}.status == EXECUTED and FundingSource.${fs_id}.open_run_count == 0"

      - name: compliance_sweep_reverter_depth_three_cascade
        grounds:
          - endpoints["POST /land-bank/compliance-sweeps"]
          - state_machines.DevelopmentAgreement.status.CURE_PENDING_to_REVERTED
          - state_machines.Property.custody_status.CONVEYED_to_REVERTED
          - state_machines.DispositionApplication.status.SUBMITTED_to_SUSPENDED_TITLE
        distinguishing_aspect: |
          A cascade rooted in a different entity and driven by the clock rather than by money: the
          second sweep reverts the agreement (link 1), which reverts the parcel's custody and
          pushes its parallel title dimension CLEAR -> CLOUDED and restores the 2000000-cent
          discharged delinquency (link 2), and the title move in turn bars the buyer and suspends a
          third party's still-open SUBMITTED application on that parcel (link 3). The chain is
          three levels deep on the disposition side, where the previous instance was four levels
          deep on the funding side.
        test_recipe:
          setup:
            - "One ACQUISITION_ONLY funding source, ACTIVE, authorized 500000 cents."
            - "One 8500 sqft parcel, assessed 1000000 cents, grade C, carrying a 2000000-cent delinquency posted before acquisition; acquired by donation, quiet-titled CLEAR and LISTED."
            - "Applicant A (DEVELOPER) is awarded the parcel under a STATUTORY agreement with performance_deadline 2026-09-01, milestone_count 2 and the reverter armed; the discharge wipes the 2000000-cent balance at conveyance."
            - "Applicant C (DEVELOPER) has a still-SUBMITTED application on the same parcel, filed before the conveyance."
