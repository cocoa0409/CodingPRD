    roles: [ShopAdmin, ShopManager, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ChangeOrder[]
    side_effects: []

  - method: POST
    path: "/shops/{shopId}/projects/{projectId}/change-orders/{changeOrderId}/submit"
    description: "DRAFT -> SUBMITTED; compute delta; project IN_PRODUCTION->CHANGE_PENDING (OCC)"
    roles: [ShopManager, ShopAdmin]
    code: 200
    input: [expected_project_version]
    output: ChangeOrder
    side_effects: ["compute delta_cents; project -> CHANGE_PENDING; increments Project.version by 1"]

  - method: POST
    path: "/shops/{shopId}/projects/{projectId}/change-orders/{changeOrderId}/request-revision"
    description: "SUBMITTED -> REVISING"
    roles: [Customer]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: ["status=REVISING"]

  - method: POST
    path: "/shops/{shopId}/projects/{projectId}/change-orders/{changeOrderId}/resubmit"
    description: "REVISING -> SUBMITTED; increment revision_round; recompute delta"
    roles: [ShopManager, ShopAdmin]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: ["status=SUBMITTED; revision_round += 1; recompute delta_cents"]

  - method: POST
    path: "/shops/{shopId}/projects/{projectId}/change-orders/{changeOrderId}/approve"
    description: "SUBMITTED -> APPROVED; fold delta into contract_total; create PROGRESS draw (OCC)"
    roles: [Customer]
    code: 200
    input: [expected_project_version]
    output: ChangeOrder
    side_effects: ["freeze delta_cents; contract_total_cents += delta_cents; recompute deposit_required; create PROGRESS Draw PENDING for max(0,delta); project CHANGE_PENDING->IN_PRODUCTION; increments Project.version by 1"]

  - method: POST
    path: "/shops/{shopId}/projects/{projectId}/change-orders/{changeOrderId}/reject"
    description: "SUBMITTED -> REJECTED; no ledger change"
    roles: [Customer]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: ["status=REJECTED; project CHANGE_PENDING->IN_PRODUCTION; increments Project.version by 1"]

  - method: POST
    path: "/shops/{shopId}/projects/{projectId}/change-orders/{changeOrderId}/cancel"
    description: "DRAFT -> CANCELLED"
    roles: [ShopManager, ShopAdmin]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: ["status=CANCELLED"]

