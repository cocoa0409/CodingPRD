              payload: { current_utc: "2026-09-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /test-sessions/${sess_id}/start"
              payload: {}
              as: TestLaboratory
              as_user_id: "${lab_id}"
            - call: "POST /test-sessions/${sess_id}/results"
              payload: { result_lines: [{ feature_set_id: "${fs_onoff_id}", outcome: "PASS", evidence_hash: "e1" }] }
              as: TestLaboratory
              as_user_id: "${lab_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /test-sessions/${sess_id}/complete"
              payload: {}
              as: TestLaboratory
              as_user_id: "${lab_id}"
            - call: "POST /submissions/${sub_id}/security-decision"
              payload: { decision: "APPROVE", secure_boot_verified: true, verified_firmware_update_capability: "OTA_SIGNED" }
              as: SecurityReviewer
              as_user_id: "SEC1"
            - call: "POST /submissions/${sub_id}/conformance-decision"
              payload: { decision: "APPROVE" }
              as: ConformanceReviewer
              as_user_id: "CONF1"
            - call: "POST /submissions/${sub_id}/issue-credential"
              payload: { dac_serial: "DAC-000001" }
              as: ProgramAdmin
            - call: "POST /listings"
              payload: { submission_id: "${sub_id}" }
              as: ProgramAdmin
              captures: { listing_id: $.data.id, v_created: $.data.version }
          trigger:
            - call: "POST /listings/${listing_id}/publish"
              payload: {}
              as: ProgramAdmin
              captures: { v_published: $.data.version }
            - call: "POST /listings/${listing_id}/firmware-revisions"
              payload: { firmware_version: "1.1.0", changed_feature_codes: ["CORE_DIM"], security_change: true, expected_listing_version: "${v_created}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { err_stale_1: $.data.error_id }
            - call: "POST /listings/${listing_id}/firmware-revisions"
              payload: { firmware_version: "1.1.0", changed_feature_codes: ["CORE_DIM"], security_change: true, expected_listing_version: "${v_published}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { v_after_r1: $.data.version }
            - call: "POST /listings/${listing_id}/firmware-revisions"
              payload: { firmware_version: "1.2.0", changed_feature_codes: ["CORE_ONOFF"], security_change: false, expected_listing_version: "${v_published}" }
              as: ProgramAdmin
              captures: { err_stale_2: $.data.error_id }
            - call: "GET /listings/${listing_id}"
              payload: {}
              as: PublicViewer
            - call: "POST /listings/${listing_id}/firmware-revisions"
              payload: { firmware_version: "1.2.0", changed_feature_codes: ["CORE_ONOFF"], security_change: false, expected_listing_version: "${v_after_r1}" }
              as: ProgramAdmin
              captures: { v_after_r2: $.data.version }
            - call: "GET /submissions/${sub_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "${v_created} == 1 and ${v_published} == 2 - publication is a write to the listing, so the version a client captured at creation is already stale"
            - "${err_stale_1} == \"ERR_STALE_LISTING_VERSION\" with HTTP 412, and the listing still reads recert_classification null, firmware_revision_count 0 and latest_firmware_version null"
            - "The identical body replayed with ${v_published} returns 200 with recert_classification == \"NONE\" and recert_trigger_reason == null - security_change true on an SB1 specification with an empty overlap falls all the way through to R5, and CORE_DIM is a known code that the listing never declared"
            - "That accepted report still sets latest_firmware_version == \"1.1.0\" and firmware_revision_count == 1, leaves recertification_due_at null, and ${v_after_r1} == 3"
            - "${err_stale_2} == \"ERR_STALE_LISTING_VERSION\" (412) - ${v_published} was consumed by the first accepted report; the listing still reads classification \"NONE\", count 1 and latest_firmware_version \"1.1.0\", so nothing about the blocked reclassification leaked"
            - "The same body with ${v_after_r1} returns 200 with recert_classification == \"DELTA\", recert_trigger_reason == \"FIRMWARE_FEATURE_DELTA\" and recertification_due_at == \"2026-12-01T12:00:00Z\" (2026-09-02T12:00:00Z + 90 days), latest_firmware_version \"1.2.0\", firmware_revision_count 2 and ${v_after_r2} == 4"
            - "An overlap of exactly one non-security feature code is DELTA and not FULL, so publication_status is still \"PUBLISHED\" and the submission's dac_state is still \"ISSUED\" - only a FULL classification suppresses the listing and revokes the credential"

      - name: cascade_chains_reach_their_last_hop_and_stop_there
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - state_machines.Member#onboarding_state
          - state_machines.Specification.status
        excluded_because:
          difficulty_instance: ip_withdrawal_cascades_four_hops_into_an_auto_opened_case
          rationale: >
            The end-to-end multi-hop verification, the ordering sensitivity between hops and the
            non-terminal-children-only rule are all asserted there hop by hop, and its sibling instance
            specification_deprecation_cascades_three_hops_into_bench_minutes covers the second chain.

      - name: both_variants_of_every_dual_variant_calculation_are_exercised
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations.certification_readiness_score
          - calculations.laboratory_competency_score
          - calculations.member_credit_ledger
        excluded_because:
          difficulty_instance: readiness_provisional_vs_final_diverge_on_blocked_lines_and_lateness
          rationale: >
            Readiness is covered there on identical stored data with both decompositions asserted;
            laboratory_competency_rolling_vs_lifetime_straddle_suspension_threshold covers the competency
            pair, and credit_escrow_round_trips_through_withdraw_reject_and_consumption covers the ledger
            pair including the delta at each switch.

      - name: the_fee_and_the_plan_snapshot_survive_everything_that_happens_afterwards
        claim_type: version_pinning_on_approval
        grounds:
          - complexity_profile.complexity_layers[version_pinning_on_approval]
          - calculations.submission_certification_fee_cents
          - calculations.test_plan_case_counts
          - entities.CertificationSubmission.specification_id
        distinguishing_aspect: >
          Three pins are asserted against events that would move an unpinned value: the fee is computed
          once at creation and does not follow a later ratified specification version or a later credit
          purchase; the plan's case counts are a frozen snapshot that survives even the deprecation cascade
          that voids the plan; and specification_id keeps pointing at the deprecated version, which is
          exactly what makes the resubmit impossible instead of silently migrating the device to SHIC-2.0.
        test_recipe:
          setup:
            - "RATIFIED SPEC1 (SHIC-1.0, SB1) with LIGHTING CORE_ONOFF (MANDATORY 20) and CORE_DIM (OPTIONAL 10)."
            - "Member M1 (ADOPTER) in good standing with 1000000 cents."
            - "Submission S1 declares both codes, is IN_REVIEW, and has an ISSUED plan covering both feature sets."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /specifications"
              payload: { version_label: "SHIC-1.0", security_baseline_level: "SB1", effective_date: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { spec1_id: $.data.id }
            - call: "POST /feature-sets"
              payload: { specification_id: "${spec1_id}", device_type: "LIGHTING", feature_code: "CORE_ONOFF", obligation: "MANDATORY", test_case_count: 20, security_relevant: false }
              as: ProgramAdmin
              captures: { fs_onoff_id: $.data.id }
            - call: "POST /feature-sets"
              payload: { specification_id: "${spec1_id}", device_type: "LIGHTING", feature_code: "CORE_DIM", obligation: "OPTIONAL", test_case_count: 10, security_relevant: false }
              as: ProgramAdmin
              captures: { fs_dim_id: $.data.id }
            - call: "POST /specifications/${spec1_id}/ratify"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { legal_name: "Acme Devices", contact_email: "ops@acme.test", tier: "ADOPTER" }
              as: ProgramAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /members/${m1_id}/ip-commitment"
              payload: { ip_commitment_type: "RAND_ROYALTY_FREE", essential_patent_count: 2, scope_specification_id: "${spec1_id}" }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /members/${m1_id}/tool-access"
              payload: { decision: "GRANT" }
              as: ProgramAdmin
            - call: "POST /members/${m1_id}/credits"
              payload: { amount_cents: 1000000 }
              as: ProgramAdmin
            - call: "POST /submissions"
              payload: { member_id: "${m1_id}", specification_id: "${spec1_id}", device_model: "AL-100", device_type: "LIGHTING", declared_feature_codes: ["CORE_ONOFF", "CORE_DIM"], declared_secure_boot: true, declared_firmware_update_capability: "OTA_SIGNED", attestation_key_fingerprint: "AA:00:00:01" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { sub_id: $.data.id, fee_at_creation: $.data.certification_fee_cents }
            - call: "POST /submissions/${sub_id}/submit"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /submissions/${sub_id}/start-review"
              payload: {}
              as: ConformanceReviewer
              as_user_id: "CONF1"
              captures: { sub_v_in_review: $.data.version }
            - call: "POST /test-plans"
              payload: { submission_id: "${sub_id}", expected_submission_version: "${sub_v_in_review}" }
              as: ProgramAdmin
              captures: { plan_id: $.data.id, required_at_creation: $.data.required_case_count }
            - call: "POST /test-plans/${plan_id}/issue"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /specifications"
              payload: { version_label: "SHIC-2.0", security_baseline_level: "SB3", effective_date: "2026-09-05T00:00:00Z", supersedes_specification_id: "${spec1_id}" }
              as: ProgramAdmin
              captures: { spec2_id: $.data.id }
            - call: "POST /feature-sets"
              payload: { specification_id: "${spec2_id}", device_type: "LIGHTING", feature_code: "CORE_ONOFF", obligation: "MANDATORY", test_case_count: 40, security_relevant: true }
              as: ProgramAdmin
            - call: "POST /specifications/${spec2_id}/ratify"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members/${m1_id}/credits"
              payload: { amount_cents: 500000 }
              as: ProgramAdmin
            - call: "GET /submissions/${sub_id}"
              payload: {}
              as: ProgramAdmin
            - call: "POST /specifications/${spec1_id}/deprecate"
              payload: {}
              as: ProgramAdmin
            - call: "GET /submissions/${sub_id}"
              payload: {}
              as: ProgramAdmin
            - call: "GET /test-plans/${plan_id}"
              payload: {}
              as: ProgramAdmin
            - call: "POST /submissions/${sub_id}/submit"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
              captures: { err_deprecated_spec: $.data.error_id }
            - call: "GET /members/${m1_id}/credit-ledger"
              payload: { variant: "AVAILABLE" }
              as: ProgramAdmin
              captures: { balance_after: $.data.balance_cents }
          assert:
            - "${fee_at_creation} == 150000 (120000 LIGHTING base + 15000 x 2 declared features + 0 SB1 surcharge, ADOPTER 0.00 discount, STANDARD 1.00 multiplier) and ${required_at_creation} == 30"
            - "After SHIC-2.0 is created with supersedes_specification_id == ${spec1_id} and ratified, S1 still reads certification_fee_cents == 150000 and specification_id == ${spec1_id} - the pin does not follow the supersession chain, and the SB3 surcharge of 50000 never appears"
            - "The extra 500000 credit purchase leaves certification_fee_cents at 150000 and fee_escrowed_cents at 150000 - the fee is computed once at POST /submissions and never recomputed"
            - "After the deprecation cascade S1 reads state \"RETURNED_FOR_INFO\", conformance_review_state \"RETURNED\", revision_round 1 and conformance_reviewer_user_id \"SYSTEM\", while certification_fee_cents is still 150000 and fee_escrowed_cents is still 150000 - the cascade returns the submission without touching the money"
            - "TestPlan.${plan_id} reads state \"VOIDED\" but its snapshot is intact: included_feature_set_ids == [${fs_onoff_id}, ${fs_dim_id}], required_case_count 30, mandatory_case_count 20, optional_case_count 10 - the counts are a frozen snapshot of the feature graph at creation, not a live query"
            - "${err_deprecated_spec} == \"ERR_INVALID_SPECIFICATION_STATE\" (409) - the resubmit is refused because the PINNED specification is DEPRECATED; the device is not silently migrated onto the RATIFIED SHIC-2.0"
            - "${balance_after} == 1350000 = 1000000 + 500000 purchased - 150000 still escrowed; the refused resubmit escrowed nothing a second time"

  - section: consistency_model
    instances:
      - name: every_cascaded_and_derived_value_is_readable_in_the_same_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /submissions/{submission_id}/withdraw]
          - endpoints[POST /test-sessions/{test_session_id}/results]
          - calculations.laboratory_reserved_bench_minutes
        distinguishing_aspect: >
          The consistency model is immediate, so no read in this scenario is allowed to lag: the response to
          the result submission is a TestSession, yet the CertificationSubmission's provisional score is
          already updated when it is read on the very next request, and the single withdraw response body
          itself carries the released escrow while the plan, the session and the laboratory counter have
          already moved when they are read immediately afterwards. Nothing here needs a retry, a second
          write or a background pass.
        test_recipe:
          setup:
            - "RATIFIED SB1 specification with LIGHTING CORE_ONOFF (MANDATORY 20); AUTHORIZED laboratory with 2 benches."
            - "Member M1 in good standing with 1000000 cents; submission S1 IN_REVIEW with an ISSUED plan and one IN_PROGRESS session (240 reserved minutes)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /specifications"
              payload: { version_label: "SHIC-1.0", security_baseline_level: "SB1", effective_date: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { spec_id: $.data.id }
            - call: "POST /feature-sets"
              payload: { specification_id: "${spec_id}", device_type: "LIGHTING", feature_code: "CORE_ONOFF", obligation: "MANDATORY", test_case_count: 20, security_relevant: false }
              as: ProgramAdmin
              captures: { fs_onoff_id: $.data.id }
            - call: "POST /specifications/${spec_id}/ratify"
              payload: {}
              as: ProgramAdmin
            - call: "POST /test-laboratories"
              payload: { name: "Northbridge Lab", bench_capacity: 2, authorized_device_types: ["LIGHTING"], accreditation_expires_at: "2027-12-31T00:00:00Z" }
              as: ProgramAdmin
              captures: { lab_id: $.data.id }
            - call: "POST /test-laboratories/${lab_id}/accreditation-decision"
              payload: { decision: "AUTHORIZE" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { legal_name: "Acme Devices", contact_email: "ops@acme.test", tier: "ADOPTER" }
              as: ProgramAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /members/${m1_id}/ip-commitment"
              payload: { ip_commitment_type: "RAND_ROYALTY_FREE", essential_patent_count: 2, scope_specification_id: "${spec_id}" }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /members/${m1_id}/tool-access"
              payload: { decision: "GRANT" }
              as: ProgramAdmin
            - call: "POST /members/${m1_id}/credits"
              payload: { amount_cents: 1000000 }
              as: ProgramAdmin
            - call: "POST /submissions"
              payload: { member_id: "${m1_id}", specification_id: "${spec_id}", device_model: "AL-100", device_type: "LIGHTING", declared_feature_codes: ["CORE_ONOFF"], declared_secure_boot: true, declared_firmware_update_capability: "OTA_SIGNED", attestation_key_fingerprint: "AA:00:00:01" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/submit"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
              captures: { escrowed_at_submit: $.data.fee_escrowed_cents }
            - call: "POST /submissions/${sub_id}/start-review"
              payload: {}
              as: ConformanceReviewer
              as_user_id: "CONF1"
              captures: { sub_v_in_review: $.data.version }
            - call: "POST /test-plans"
              payload: { submission_id: "${sub_id}", expected_submission_version: "${sub_v_in_review}" }
              as: ProgramAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /test-plans/${plan_id}/issue"
              payload: {}
              as: ProgramAdmin
            - call: "POST /test-sessions"
              payload: { test_plan_id: "${plan_id}", laboratory_id: "${lab_id}", bench_index: 1, window_start: "2026-09-02T09:00:00Z", window_end: "2026-09-02T13:00:00Z", session_type: "INTEROP" }
              as: TestLaboratory
              as_user_id: "${lab_id}"
              captures: { sess_id: $.data.id, reserved_on_the_session: $.data.reserved_minutes }
            - call: "GET /test-laboratories/${lab_id}"
              payload: {}
              as: ProgramAdmin
              captures: { lab_minutes_after_booking: $.data.reserved_bench_minutes }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /test-sessions/${sess_id}/start"
              payload: {}
              as: TestLaboratory
              as_user_id: "${lab_id}"
          trigger:
            - call: "POST /test-sessions/${sess_id}/results"
              payload: { result_lines: [{ feature_set_id: "${fs_onoff_id}", outcome: "PASS", evidence_hash: "e1" }] }
              as: TestLaboratory
              as_user_id: "${lab_id}"
            - call: "GET /submissions/${sub_id}"
              payload: {}
              as: ProgramAdmin
              captures: { provisional_now: $.data.provisional_readiness_score }
            - call: "GET /submissions/${sub_id}/readiness"
              payload: { variant: "PROVISIONAL" }
              as: ProgramAdmin
            - call: "POST /submissions/${sub_id}/withdraw"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
              captures: { state_in_withdraw_response: $.data.state, escrow_in_withdraw_response: $.data.fee_escrowed_cents }
            - call: "GET /test-plans/${plan_id}"
              payload: {}
              as: ProgramAdmin
            - call: "GET /test-sessions/${sess_id}"
              payload: {}
              as: ProgramAdmin
            - call: "GET /test-laboratories/${lab_id}"
              payload: {}
              as: ProgramAdmin
              captures: { lab_minutes_after_withdraw: $.data.reserved_bench_minutes }
            - call: "GET /members/${m1_id}/credit-ledger"
              payload: { variant: "AVAILABLE" }
              as: ProgramAdmin
              captures: { balance_after_withdraw: $.data.balance_cents }
          assert:
            - "${escrowed_at_submit} == 135000 - the submit response itself already carries the escrowed amount rather than reporting a pending transfer"
            - "${reserved_on_the_session} == 240 and ${lab_minutes_after_booking} == 240 - the derived counter on the other entity is correct on the very next read, with no reconciliation step in between"
            - "${provisional_now} == 85.00 immediately after the result submission whose response body was a TestSession: 50.00 mandatory + 20.00 vacuous optional + 0.00 interop + 15.00 timeliness"
            - "GET /submissions/${sub_id}/readiness?variant=PROVISIONAL returns the same 85.00 with mand_ratio 1.0000, opt_ratio 1.0000, interop_ratio 0.0000 and timeliness_ratio 1.0000 - the computed read and the stored field agree on the same request cycle"
            - "${state_in_withdraw_response} == \"WITHDRAWN\" and ${escrow_in_withdraw_response} == 0 - the single withdraw response already reflects its own compensation instead of returning the pre-write row"
            - "Read immediately afterwards, TestPlan.${plan_id}.state == \"VOIDED\" with voided_reason == \"SUPERSEDED_BY_NEW_PLAN\" (the withdraw path reuses that token per the §1.2 transition row) and TestSession.${sess_id}.state == \"CANCELLED\" - three entities moved inside one request"
            - "${lab_minutes_after_withdraw} == 0 and ${balance_after_withdraw} == 1000000 - the cascade's counter release and the escrow release are both visible on the first read, and 240 minutes came back exactly once"
