          assert:
            - "${ev_status0} == \"MONITORING\" and ${ev_v0} == 1 and ${ev_year} == 2026 (calendar year of occurred_at)"
            - "HTTP 200 with ${ev_status1} == \"DECLARED\" and ${ev_v1} == 2"

      - name: declare_below_the_magnitude_floor_or_without_a_treaty_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - validations.ERR_MAGNITUDE_BELOW_DECLARATION_FLOOR
          - validations.ERR_NO_REINSURANCE_PROGRAM
          - state_machines.CatastropheEvent.status.MONITORING_to_DECLARED
        distinguishing_aspect: "Each declare precondition must be enforced separately: magnitude 4.9 is refused even when a treaty exists, and a magnitude-6.6 event is refused while its treaty_year has no ACTIVE layer, then succeeds once one is added."
        test_recipe:
          setup:
            - "No reinsurance layers at all; two MONITORING events, one at magnitude 4.9 and one at 6.6"
          setup_api_calls:
