              captures: { cust_id: $.data.id }
            - call: "POST /shops/${shop_id}/motors"
              payload: { owner_customer_id: "${cust_id}", serial_number: "M-5", rated_kw: 30, frame_mm: 200, voltage_v: 460, manufacture_year: 2020 }
              as: ServiceManager
              captures: { motor_id: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders"
              payload: { customer_id: "${cust_id}", motor_id: "${motor_id}", priority: "STANDARD" }
              as: Technician
              captures: { wo_id: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/tests"
              payload: { kind: "INCOMING", insulation_megohms: 500 }
              as: Technician
              as_user_id: "op-t"
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/diagnose"
              payload: { failure_diagnosis: "winding short", rewind_hours: 5, materials_cents: 10000, replacement_cost_cents: 999999 }
              as: Technician
            - call: "GET /shops/${shop_id}/work-orders/${wo_id}"
              as: Estimator
              captures: { wo_v: $.data.version }
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/quotes"
              payload: { expected_work_order_version: "${wo_v}" }
              as: Estimator
              captures: { q1_id: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/quotes/${q1_id}/send"
              as: Estimator
          trigger:
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/quotes/${q1_id}/revise"
              as: Estimator
            - call: "GET /shops/${shop_id}/work-orders/${wo_id}"
              as: Estimator
              captures: { wo_v2: $.data.version }
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/diagnose"
              payload: { failure_diagnosis: "winding short", rewind_hours: 6, materials_cents: 12000, replacement_cost_cents: 999999 }
              as: Technician
              captures: { err: $.data.error_id }
          assert:
            - "Quote.${q1_id}.status == SUPERSEDED"
            - "WorkOrder.${wo_id}.status == QUOTED and active_quote_id is null after revise"
            - "Re-diagnose from QUOTED is rejected with ERR_INVALID_STATE (diagnose requires INCOMING_TEST) — the cycle must re-enter via a new quote issue, not by rewriting diagnosis"

  # ==========================================================================
  # Rule 4 — transitive_cascade: two cascades from different triggers,
  # one depth >= 3, one depth >= 2; each hop caused by the previous hop.
  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: deliver_cascades_to_loan_overdue_to_standing_hold
        grounds:
          - state_machines.WorkOrder.READY_FOR_PICKUP_to_DELIVERED
          - state_machines.PoolLoan.OUT_to_OVERDUE
          - calculations.customer_standing
          - calculations.pool_overdue_charge
        distinguishing_aspect: |
          Depth-3 chain: deliver WorkOrder -> sets PoolLoan.due_at (hop 1) ->
          clock advance flips PoolLoan OUT -> OVERDUE lazily (hop 2) ->
          overdue loan feeds customer_standing derivation which recomputes
          Customer.standing (hop 3). Each hop is caused by the previous one,
          not by the original deliver call.
        test_recipe:
          setup:
            - "Customer C with ACTIVE pool contract (2 slots); spare motor P (75kW) IN_POOL; repair unit M (75kW) on work order W delivered; loan L checked out against W; clock advanced beyond delivered_at + grace_days"
