              as: PharmacyInformaticist
              as_user_id: "${pharm_id}"
            - call: "POST /cds/vendor-rule-deltas/${a3_id}/disposition"
              payload: { disposition: "ACCEPT" }
              as: PharmacyInformaticist
              as_user_id: "${pharm_id}"
            - call: "POST /cds/vendor-rule-deltas/${a4_id}/disposition"
              payload: { disposition: "SUPPRESS" }
