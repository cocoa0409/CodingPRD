  - rule_id: transitive_cascade
    instances:
      - name: substantiated_complaint_cascades_five_hops_to_voided_piggyback_authority
        grounds:
          - state_machines.MemberComplaint.status.UNDER_INVESTIGATION_to_SUBSTANTIATED
          - calculations.supplier_performance_score
          - state_machines.Supplier.qualification_status.QUALIFIED_to_SUSPENDED
          - state_machines.MasterContract.status.ACTIVE_to_SUSPENDED
          - state_machines.PiggybackAnalysis.status.DETERMINED_to_VOIDED
          - validations.priority_10
          - errors.ERR_CONTRACT_NOT_ACTIVE
        distinguishing_aspect: |
          One SUBSTANTIATE call has to travel five hops in a single request: complaint points ->
          supplier.deduction_points_total 40.00 -> performance_score 60.00 / PROBATION ->
          supplier.qualification_status SUSPENDED -> MasterContract SUSPENDED -> every DETERMINED
          PiggybackAnalysis VOIDED with voided_reason CONTRACT_SUSPENDED, after which a member that
          was previously able to buy is refused with ERR_CONTRACT_NOT_ACTIVE. The FIRST substantiation
          of the identical severity travels only two hops (score 80.00, tier STANDARD, nothing else
          moves), so an implementation that fires the cascade on every substantiation, or that stops
          at the score, is caught by the same chain.
        test_recipe:
          setup:
            - "StateLawRule rows exist for TX and CA."
            - "Supplier Acme (TX) is QUALIFIED and holds ACTIVE contract COOP-MC-2026-001 with line JAN-DISP-500."
            - "MemberAgency Riverside (CA, K12_DISTRICT) is ACTIVE with a DETERMINED / CONDITIONAL analysis on that contract."
