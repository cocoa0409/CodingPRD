# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Sheet Music Retail & Rental Library. Breadth probe over §1.1–§1.7 claims not
# already covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml (those are excluded_because stubs).
# =============================================================================

scaffold_corner_design:

  # ================================================================ entities
  - section: entities
    instances:
      - name: create_publisher_applies_defaults
        claim_type: creation_and_defaults
        grounds: [entities.Publisher]
        distinguishing_aspect: "POST /library/publishers with only name → 201; rental_discount_pct 0, allows_digital_perusal false, print_only_rental false, out_of_print false, status ACTIVE, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /library/publishers"
              payload: { name: "Default Pub" }
              as: LibraryAdmin
              captures: { p: $.data.id }
          trigger:
            - call: "GET /library/publishers/${p}"
              as: LibraryAdmin
          assert:
            - "Publisher.${p}.rental_discount_pct == 0"
            - "Publisher.${p}.allows_digital_perusal == false"
            - "Publisher.${p}.print_only_rental == false"
            - "Publisher.${p}.out_of_print == false"
            - "Publisher.${p}.status == ACTIVE"
            - "Publisher.${p}.version == 1"

      - name: create_work_missing_required_field_returns_invalid_request
        claim_type: required_field_validation
        grounds: [entities.Work, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /library/works omitting base_rental_rate_cents → 400 ERR_INVALID_REQUEST; no row created."
        test_recipe:
          setup: ["publisher exists"]
          setup_api_calls:
            - call: "POST /library/publishers"
              payload: { name: "Req Pub" }
              as: LibraryAdmin
              captures: { p: $.data.id }
          trigger:
            - call: "POST /library/works"
              payload: { publisher_id: "${p}", title: "No Rate", catalog_number: "RP-1", ensemble_tier: CHAMBER, sale_price_cents: 500, license_format: PRINT_ONLY }
              as: LibraryAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400)"

      - name: get_nonexistent_work_returns_not_found
        claim_type: not_found
        grounds: [entities.Work, "errors[ERR_WORK_NOT_FOUND]"]
        distinguishing_aspect: "GET /library/works/{random-uuid} → 404 ERR_WORK_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /library/works/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: LibraryAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_WORK_NOT_FOUND (404)"

      - name: rental_set_computed_available_copy_count_ignores_client_input
        claim_type: computed_field
        grounds: [entities.RentalSet.fields.available_copy_count]
        distinguishing_aspect: "Client-supplied available_copy_count on create is ignored; computed field initializes to copy_count (12)."
        test_recipe:
          setup: ["publisher + work exist"]
          setup_api_calls:
            - call: "POST /library/publishers"
              payload: { name: "CF Pub" }
              as: LibraryAdmin
              captures: { p: $.data.id }
            - call: "POST /library/works"
              payload: { publisher_id: "${p}", title: "CF Work", catalog_number: "CF-1", ensemble_tier: BAND, base_rental_rate_cents: 8000, sale_price_cents: 1200, license_format: PRINT_ONLY }
              as: LibraryAdmin
              captures: { w: $.data.id }
          trigger:
            - call: "POST /library/rental-sets"
              payload: { work_id: "${w}", set_code: "CF-SET", copy_count: 12, replacement_value_cents: 96000, available_copy_count: 999 }
              as: LibraryAdmin
              captures: { s: $.data.id, avail: $.data.available_copy_count }
          assert:
            - "RentalSet.${s}.available_copy_count == 12 (input 999 ignored)"
            - "RentalSet.${s}.condition_grade == A and status == IN_SERVICE"

      - name: work_list_pagination_envelope
        claim_type: listing_pagination
        grounds: [entities.Work, response_envelope]
        distinguishing_aspect: "Create 3 works; GET /library/works?limit=2 → 2 rows, total_count 3, has_more true; offset=2 → 1 row, has_more false."
        test_recipe:
          setup: ["one publisher; three works"]
          setup_api_calls:
            - call: "POST /library/publishers"
              payload: { name: "Page Pub" }
              as: LibraryAdmin
              captures: { p: $.data.id }
            - call: "POST /library/works"
              payload: { publisher_id: "${p}", title: "W1", catalog_number: "PG-1", ensemble_tier: CHAMBER, base_rental_rate_cents: 1000, sale_price_cents: 500, license_format: PRINT_ONLY }
              as: LibraryAdmin
            - call: "POST /library/works"
              payload: { publisher_id: "${p}", title: "W2", catalog_number: "PG-2", ensemble_tier: CHAMBER, base_rental_rate_cents: 1000, sale_price_cents: 500, license_format: PRINT_ONLY }
              as: LibraryAdmin
            - call: "POST /library/works"
              payload: { publisher_id: "${p}", title: "W3", catalog_number: "PG-3", ensemble_tier: CHAMBER, base_rental_rate_cents: 1000, sale_price_cents: 500, license_format: PRINT_ONLY }
              as: LibraryAdmin
          trigger:
            - call: "GET /library/works?limit=2"
              as: LibraryClerk
          assert:
            - "response_type == array, data length == 2"
            - "meta pagination: total_count == 3, has_more == true"
            - "GET with limit=2&offset=2 → data length == 1, has_more == false"

      - name: invalid_enum_value_rejected_on_account_create
        claim_type: type_constraint
        grounds: [entities.CustomerAccount.fields.account_kind, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "account_kind 'DISTRICT' (not in enum) → 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /library/customer-accounts"
              payload: { account_name: "Bad Enum", account_kind: "DISTRICT" }
              as: LibraryAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400)"

      - name: due_date_not_after_checkout_rejected
        claim_type: type_constraint
        grounds: [entities.RentalOrder.fields.due_date, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "due_date == checkout_date (not >) → 400 ERR_INVALID_REQUEST at order creation."
        test_recipe:
          setup: ["publisher, work, set, account exist"]
          setup_api_calls:
            - call: "POST /library/publishers"
              payload: { name: "DD Pub" }
              as: LibraryAdmin
              captures: { p: $.data.id }
            - call: "POST /library/works"
              payload: { publisher_id: "${p}", title: "DD Work", catalog_number: "DD-1", ensemble_tier: CHAMBER, base_rental_rate_cents: 10000, sale_price_cents: 2000, license_format: PRINT_ONLY }
              as: LibraryAdmin
              captures: { w: $.data.id }
            - call: "POST /library/rental-sets"
              payload: { work_id: "${w}", set_code: "DD-SET", copy_count: 5, replacement_value_cents: 40000 }
              as: LibraryAdmin
              captures: { s: $.data.id }
            - call: "POST /library/customer-accounts"
              payload: { account_name: "DD Acct", account_kind: INDIVIDUAL }
              as: LibraryAdmin
              captures: { a: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: LibraryAdmin
          trigger:
            - call: "POST /library/rental-orders"
              payload: { account_id: "${a}", rental_set_id: "${s}", copies_requested: 1, checkout_date: "2026-08-05", due_date: "2026-08-05" }
              as: LibraryClerk
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400)"

  # ================================================================ state_machines
  - section: state_machines
    instances:
      - name: rental_order_initial_state_is_draft
        claim_type: initial_state
        grounds: [state_machines.RentalOrder]
        distinguishing_aspect: "Freshly created RentalOrder has status DRAFT, renewal_count 0, prepayment_cents 0, version 1."
        test_recipe:
          setup: ["publisher, work, set, account exist"]
          setup_api_calls:
            - call: "POST /library/publishers"
              payload: { name: "IS Pub" }
              as: LibraryAdmin
              captures: { p: $.data.id }
            - call: "POST /library/works"
              payload: { publisher_id: "${p}", title: "IS Work", catalog_number: "IS-1", ensemble_tier: CHAMBER, base_rental_rate_cents: 10000, sale_price_cents: 2000, license_format: PRINT_ONLY }
              as: LibraryAdmin
              captures: { w: $.data.id }
            - call: "POST /library/rental-sets"
              payload: { work_id: "${w}", set_code: "IS-SET", copy_count: 5, replacement_value_cents: 40000 }
              as: LibraryAdmin
              captures: { s: $.data.id }
            - call: "POST /library/customer-accounts"
              payload: { account_name: "IS Acct", account_kind: INDIVIDUAL }
              as: LibraryAdmin
              captures: { a: $.data.id }
          trigger:
            - call: "POST /library/rental-orders"
              payload: { account_id: "${a}", rental_set_id: "${s}", copies_requested: 1, checkout_date: "2026-08-05", due_date: "2026-09-04" }
              as: LibraryClerk
              captures: { o: $.data.id, st: $.data.status, rc: $.data.renewal_count }
          assert:
            - "RentalOrder.${o}.status == DRAFT"
            - "RentalOrder.${o}.renewal_count == 0"
            - "RentalOrder.${o}.loan_periods == 1"

      - name: settle_from_on_loan_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.RentalOrder, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "settle while ON_LOAN (not RETURNED) → 409 ERR_INVALID_STATE; no side effects fire (estimated fee and exposure unchanged)."
        test_recipe:
          setup: ["order ON_LOAN"]
          setup_api_calls:
            - call: "POST /library/publishers"
              payload: { name: "IV Pub" }
              as: LibraryAdmin
              captures: { p: $.data.id }
            - call: "POST /library/works"
              payload: { publisher_id: "${p}", title: "IV Work", catalog_number: "IV-1", ensemble_tier: CHAMBER, base_rental_rate_cents: 10000, sale_price_cents: 2000, license_format: PRINT_ONLY }
              as: LibraryAdmin
              captures: { w: $.data.id }
            - call: "POST /library/rental-sets"
              payload: { work_id: "${w}", set_code: "IV-SET", copy_count: 5, replacement_value_cents: 40000 }
              as: LibraryAdmin
              captures: { s: $.data.id }
            - call: "POST /library/customer-accounts"
              payload: { account_name: "IV Acct", account_kind: INDIVIDUAL }
              as: LibraryAdmin
              captures: { a: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: LibraryAdmin
            - call: "POST /library/rental-orders"
              payload: { account_id: "${a}", rental_set_id: "${s}", copies_requested: 1, checkout_date: "2026-08-05", due_date: "2026-09-04" }
              as: LibraryClerk
              captures: { o: $.data.id }
            - call: "POST /library/rental-orders/${o}/reserve"
              payload: {}
              as: LibraryClerk
            - call: "POST /library/rental-orders/${o}/dispatch"
              payload: {}
              as: LibraryClerk
            - call: "POST /library/rental-orders/${o}/confirm-receipt"
              payload: {}
              as: Customer
              as_user_id: "${a}"
          trigger:
            - call: "POST /library/rental-orders/${o}/settle"
              payload: {}
              as: BillingManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409)"
            - "RentalOrder.${o}.status == ON_LOAN"

      - name: terminal_state_lockdown_cancelled_order
        claim_type: terminal_state_lockdown
        grounds: [state_machines.RentalOrder]
        distinguishing_aspect: "After cancel from DRAFT, every further action (reserve, dispatch, renew, check-in, cancel) on the CANCELLED order → 409; cancel is idempotent-unsafe by design."
        test_recipe:
          setup: ["DRAFT order cancelled"]
          setup_api_calls:
            - call: "POST /library/publishers"
              payload: { name: "TL Pub" }
              as: LibraryAdmin
              captures: { p: $.data.id }
            - call: "POST /library/works"
              payload: { publisher_id: "${p}", title: "TL Work", catalog_number: "TL-1", ensemble_tier: CHAMBER, base_rental_rate_cents: 10000, sale_price_cents: 2000, license_format: PRINT_ONLY }
              as: LibraryAdmin
              captures: { w: $.data.id }
            - call: "POST /library/rental-sets"
              payload: { work_id: "${w}", set_code: "TL-SET", copy_count: 5, replacement_value_cents: 40000 }
              as: LibraryAdmin
              captures: { s: $.data.id }
            - call: "POST /library/customer-accounts"
              payload: { account_name: "TL Acct", account_kind: INDIVIDUAL }
              as: LibraryAdmin
              captures: { a: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: LibraryAdmin
            - call: "POST /library/rental-orders"
              payload: { account_id: "${a}", rental_set_id: "${s}", copies_requested: 1, checkout_date: "2026-08-05", due_date: "2026-09-04" }
              as: LibraryClerk
              captures: { o: $.data.id }
            - call: "POST /library/rental-orders/${o}/cancel"
              payload: {}
              as: LibraryClerk
          trigger:
            - call: "POST /library/rental-orders/${o}/reserve"
              payload: {}
              as: LibraryClerk
              captures: { err1: $.data.error_id }
            - call: "POST /library/rental-orders/${o}/cancel"
              payload: {}
              as: LibraryClerk
              captures: { err2: $.data.error_id }
          assert:
            - "reserve on CANCELLED: error_id == ERR_INVALID_STATE"
            - "second cancel on CANCELLED: error_id == ERR_ORDER_NOT_CANCELLABLE"

      - name: purchase_order_suspend_reapprove_cycle_via_account_flip
        claim_type: side_effect_execution
        grounds: [state_machines.PurchaseOrder.APPROVED_to_SUSPENDED, state_machines.PurchaseOrder.SUSPENDED_to_APPROVED, state_machines.CustomerAccount.HOLD_to_GOOD]
        distinguishing_aspect: "Cyclic PO machine driven by account standing: overdue sweep suspends APPROVED PO; after return+settle clears the overdue order, sweep restores standing GOOD and the same PO returns to APPROVED (SUSPENDED→APPROVED cyclic edge)."
        test_recipe:
          setup: ["account with APPROVED PO; order on loan; clock past due; sweep → HOLD/SUSPENDED; check-in on time basis (late fee) then settle; sweep → GOOD/APPROVED"]
          setup_api_calls:
            - call: "POST /library/publishers"
              payload: { name: "Cyc Pub" }
              as: LibraryAdmin
              captures: { p: $.data.id }
            - call: "POST /library/works"
              payload: { publisher_id: "${p}", title: "Cyc Work", catalog_number: "CYC-1", ensemble_tier: CHAMBER, base_rental_rate_cents: 10000, sale_price_cents: 2000, license_format: PRINT_ONLY }
              as: LibraryAdmin
              captures: { w: $.data.id }
            - call: "POST /library/rental-sets"
              payload: { work_id: "${w}", set_code: "CYC-SET", copy_count: 10, replacement_value_cents: 80000 }
              as: LibraryAdmin
              captures: { s: $.data.id }
            - call: "POST /library/customer-accounts"
              payload: { account_name: "Cyc HS", account_kind: SCHOOL, credit_tier: STANDARD, credit_limit_cents: 0, requires_purchase_order: true }
              as: LibraryAdmin
              captures: { a: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: LibraryAdmin
            - call: "POST /library/purchase-orders"
              payload: { account_id: "${a}", po_number: "PO-CYC", authorized_amount_cents: 300000, valid_from: "2026-08-01", valid_until: "2027-06-30" }
              as: BillingManager
              captures: { po: $.data.id }
            - call: "POST /library/purchase-orders/${po}/approve"
              payload: {}
              as: BillingManager
            - call: "POST /library/rental-orders"
              payload: { account_id: "${a}", rental_set_id: "${s}", purchase_order_id: "${po}", copies_requested: 1, checkout_date: "2026-08-05", due_date: "2026-09-04" }
              as: LibraryClerk
              captures: { o: $.data.id }
            - call: "POST /library/rental-orders/${o}/reserve"
              payload: {}
              as: LibraryClerk
            - call: "POST /library/rental-orders/${o}/dispatch"
              payload: {}
              as: LibraryClerk
            - call: "POST /library/rental-orders/${o}/confirm-receipt"
              payload: {}
              as: Customer
              as_user_id: "${a}"
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: LibraryAdmin
            - call: "POST /library/_sweep/run_daily"
              payload: {}
              as: LibraryAdmin
            - call: "POST /library/rental-orders/${o}/check-in"
              payload: { line_grades: "A" }
              as: ReturnsClerk
            - call: "POST /library/rental-orders/${o}/settle"
              payload: {}
              as: BillingManager
          trigger:
            - call: "POST /library/_sweep/run_daily"
              payload: {}
              as: LibraryAdmin
            - call: "GET /library/purchase-orders/${po}"
              as: BillingManager
              captures: { po_status: $.data.status }
            - call: "GET /library/customer-accounts/${a}"
              as: BillingManager
              captures: { acct_standing: $.data.standing }
          assert:
            - "PurchaseOrder.${po}.status == APPROVED (cycled SUSPENDED → APPROVED)"
            - "CustomerAccount.${a}.standing == GOOD"
            - "RentalOrder.${o}.final_fee_cents == 10066 (base 10000 + 2 late days: daily_base rhu(10000/30)=333, r1 rhu(333*0.10)=33; 2*33*1=66)"

      - name: checkin_grade_d_cascades_set_under_repair
        claim_type: conditional_cascade
        grounds: [state_machines.RentalSet.IN_SERVICE_to_UNDER_REPAIR, state_machines.RentalOrder.ON_LOAN_to_RETURNED]
        distinguishing_aspect: "Check-in grading any line D both recomputes RentalSet.condition_grade to D AND flips RentalSet.status to UNDER_REPAIR; subsequent reserve on that set fails ERR_RENTAL_SET_NOT_RENTABLE."
        test_recipe:
          setup: ["set 5 copies; order 1 copy ON_LOAN; check-in grades D"]
          setup_api_calls:
            - call: "POST /library/publishers"
              payload: { name: "GD Pub" }
              as: LibraryAdmin
              captures: { p: $.data.id }
            - call: "POST /library/works"
              payload: { publisher_id: "${p}", title: "GD Work", catalog_number: "GD-1", ensemble_tier: CHAMBER, base_rental_rate_cents: 10000, sale_price_cents: 2000, license_format: PRINT_ONLY }
              as: LibraryAdmin
              captures: { w: $.data.id }
            - call: "POST /library/rental-sets"
              payload: { work_id: "${w}", set_code: "GD-SET", copy_count: 5, replacement_value_cents: 40000 }
              as: LibraryAdmin
              captures: { s: $.data.id }
            - call: "POST /library/customer-accounts"
              payload: { account_name: "GD Acct", account_kind: INDIVIDUAL }
              as: LibraryAdmin
              captures: { a: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: LibraryAdmin
            - call: "POST /library/rental-orders"
              payload: { account_id: "${a}", rental_set_id: "${s}", copies_requested: 1, checkout_date: "2026-08-05", due_date: "2026-09-04" }
              as: LibraryClerk
              captures: { o: $.data.id }
            - call: "POST /library/rental-orders/${o}/reserve"
              payload: {}
              as: LibraryClerk
            - call: "POST /library/rental-orders/${o}/dispatch"
              payload: {}
              as: LibraryClerk
            - call: "POST /library/rental-orders/${o}/confirm-receipt"
              payload: {}
              as: Customer
              as_user_id: "${a}"
          trigger:
            - call: "POST /library/rental-orders/${o}/check-in"
              payload: { line_grades: "D" }
              as: ReturnsClerk
            - call: "GET /library/rental-sets/${s}"
              as: LibraryAdmin
              captures: { grade: $.data.condition_grade, st: $.data.status }
            - call: "POST /library/rental-orders"
              payload: { account_id: "${a}", rental_set_id: "${s}", copies_requested: 1, checkout_date: "2026-08-06", due_date: "2026-09-05" }
              as: LibraryClerk
              captures: { o2: $.data.id }
            - call: "POST /library/rental-orders/${o2}/reserve"
              payload: {}
              as: LibraryClerk
              captures: { err: $.data.error_id }
          assert:
            - "RentalSet.${s}.condition_grade == D"
            - "RentalSet.${s}.status == UNDER_REPAIR"
            - "reserve on grade-D set: error_id == ERR_RENTAL_SET_NOT_RENTABLE"

      - name: report_lost_files_lost_condition_report_at_per_copy_value
        claim_type: side_effect_execution
        grounds: [state_machines.RentalLine.ON_LOAN_to_LOST, calculations.damage_charge]
        distinguishing_aspect: "report-lost sets line LOST, does NOT restore available_copy_count, and auto-files a LOST ConditionReport charging rhu(replacement/copy_count) = rhu(240000/30) = 8000."
        test_recipe:
          setup: ["set 30 copies repl 240000; order 2 copies ON_LOAN"]
          setup_api_calls:
            - call: "POST /library/publishers"
              payload: { name: "LS Pub" }
              as: LibraryAdmin
              captures: { p: $.data.id }
            - call: "POST /library/works"
              payload: { publisher_id: "${p}", title: "LS Work", catalog_number: "LS-1", ensemble_tier: CHAMBER, base_rental_rate_cents: 10000, sale_price_cents: 2000, license_format: PRINT_ONLY }
              as: LibraryAdmin
              captures: { w: $.data.id }
            - call: "POST /library/rental-sets"
              payload: { work_id: "${w}", set_code: "LS-SET", copy_count: 30, replacement_value_cents: 240000 }
              as: LibraryAdmin
              captures: { s: $.data.id }
            - call: "POST /library/customer-accounts"
              payload: { account_name: "LS Acct", account_kind: INDIVIDUAL }
              as: LibraryAdmin
              captures: { a: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: LibraryAdmin
            - call: "POST /library/rental-orders"
              payload: { account_id: "${a}", rental_set_id: "${s}", copies_requested: 2, checkout_date: "2026-08-05", due_date: "2026-09-04" }
              as: LibraryClerk
              captures: { o: $.data.id }
            - call: "POST /library/rental-orders/${o}/reserve"
              payload: {}
              as: LibraryClerk
            - call: "POST /library/rental-orders/${o}/dispatch"
              payload: {}
              as: LibraryClerk
            - call: "POST /library/rental-orders/${o}/confirm-receipt"
              payload: {}
              as: Customer
              as_user_id: "${a}"
            - call: "GET /library/rental-lines"
              payload: { rental_order_id: "${o}" }
              as: LibraryClerk
              captures: { ln: "$.data[0].id" }
          trigger:
            - call: "POST /library/rental-lines/${ln}/report-lost"
              payload: {}
              as: LibraryClerk
            - call: "GET /library/condition-reports"
              payload: { rental_line_id: "${ln}" }
              as: LibraryClerk
              captures: { rep_charge: "$.data[0].assessed_charge_cents", rep_grade: "$.data[0].observed_grade" }
            - call: "GET /library/rental-sets/${s}"
              as: LibraryClerk
              captures: { avail: $.data.available_copy_count }
          assert:
            - "ConditionReport.observed_grade == LOST"
            - "ConditionReport.assessed_charge_cents == 8000 (rhu(240000/30))"
