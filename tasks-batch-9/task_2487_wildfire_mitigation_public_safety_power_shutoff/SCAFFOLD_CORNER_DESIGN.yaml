              as: GridPlanner
              captures: { mp_cc2_id: $.data.id }
          assert:
            - "MitigationProject.${mp_ic_id}.risk_reduction_score == 0.45 (2.5 * 0.18 * 1.0) and budget_cents == 832 (832.5 truncated)"
            - "MitigationProject.${mp_ug_id}.risk_reduction_score == 1.50 (3.0 * 1.00 * 0.5) and budget_cents == 27000000"
            - "MitigationProject.${mp_ft_id}.risk_reduction_score == 1.62 (3.0 * 0.45 * 1.2) and budget_cents == 540000"
            - "MitigationProject.${mp_cc2_id}.risk_reduction_score == 1.86 (2.0 * 0.62 * 1.5) and budget_cents == 2500000"
