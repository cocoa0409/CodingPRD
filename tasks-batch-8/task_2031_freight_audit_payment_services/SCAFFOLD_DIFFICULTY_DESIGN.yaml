        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - state_machines.AuditException
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: resolving an EXPIRED exception
          with a credit that also exceeds the disputed amount must return
          ERR_INVALID_STATE (priority 6 state), not ERR_CREDIT_EXCEEDS_DISPUTED
          (priority 11 fiscal) — the lower-priority fiscal violation is masked.
