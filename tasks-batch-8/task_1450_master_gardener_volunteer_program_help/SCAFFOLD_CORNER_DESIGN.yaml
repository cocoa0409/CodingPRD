            - { call: "GET /volunteers?application_id=${app}", as: ProgramCoordinator, captures: { vol: "$.data[0].id" } }
            - { call: "POST /training-enrollments", payload: { cycle_id: "${cyc}", volunteer_id: "${vol}" }, as: ProgramCoordinator, captures: { enr: $.data.id } }
            - { call: "POST /training-enrollments/${enr}/progress", payload: { modules_completed: 5, quiz_average: 85.0 }, as: ProgramCoordinator }
            - { call: "POST /training-enrollments/${enr}/complete", as: ProgramCoordinator }
            - { call: "GET /recertification-records?volunteer_id=${vol}&cycle_id=${cyc}", as: ProgramCoordinator, captures: { rec: "$.data[0].id" } }
            - { call: "POST /volunteers/${vol}/credit-entries", payload: { cycle_id: "${cyc}", entry_kind: "SERVICE", activity_type: "OTHER", activity_date: "2026-08-05", hours: 5.0 }, as: Volunteer, as_user_id: "${vol}", captures: { e1: $.data.id } }
            - { call: "POST /credit-entries/${e1}/approve", as: ProgramCoordinator }
            - { call: "POST /volunteers/${vol}/credit-entries", payload: { cycle_id: "${cyc}", entry_kind: "SERVICE", activity_type: "OTHER", activity_date: "2026-08-06", hours: 7.0 }, as: Volunteer, as_user_id: "${vol}", captures: { e2: $.data.id } }
            - { call: "POST /credit-entries/${e2}/reject", payload: { reason: "unverifiable" }, as: ProgramCoordinator }
            - { call: "POST /volunteers/${vol}/credit-entries", payload: { cycle_id: "${cyc}", entry_kind: "SERVICE", activity_type: "OTHER", activity_date: "2026-08-07", hours: 3.0 }, as: Volunteer, as_user_id: "${vol}" }
          trigger:
            - { call: "POST /recertification-records/${rec}/evaluate", as: ProgramCoordinator }
          assert:
            - "RecertificationRecord.${rec}.provisional_service_hours == 8.0   (5.0 APPROVED + 3.0 PENDING; 7.0 REJECTED excluded)"
            - "RecertificationRecord.${rec}.official_service_hours == 5.0"

      - name: ce_hours_totaled_separately_from_service
        claim_type: input_set_filtering
        grounds: [calculations.credit_totals]
        distinguishing_aspect: "entry_kind partitions the totals: an APPROVED 6.0 SERVICE entry and an APPROVED 4.0 CE entry produce official_service_hours 6.0 and official_ce_hours 4.0, never cross-summed."
        test_recipe:
          setup: ["cycle 2026 OPEN; volunteer ACTIVE; one APPROVED SERVICE 6.0 and one APPROVED CE 4.0 entry"]
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: $.data.id } }
