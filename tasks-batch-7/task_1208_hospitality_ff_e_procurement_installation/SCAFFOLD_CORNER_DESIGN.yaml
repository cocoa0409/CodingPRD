            - "IN 4 rejected 422 with error_id == ERR_ATTIC_TARGET_EXCEEDED (0 + 4 > 3)"
            - "IN 3 succeeds (0 + 3 == 3, equality allowed); resulting_attic == 3"
            - "POLine.${l_id}: qty_installable == 17 (50 - 30 installed - 3 attic), qty_attic == 3, qty_installed == 30"

