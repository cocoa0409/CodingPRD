              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/participants/${p_mb3}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/securities"
              payload: { ticker: "MTM1", cusip: "912828XU2", prev_settlement_price_cents: 5000 }
              as: PlatformAdmin
              captures: { sec_mtm: $.data.id }
            - call: "POST /clearing/settlement-windows"
              payload: { security_id: "${sec_mtm}", settlement_date: "2026-09-10", trade_entry_deadline: "2026-09-09T20:00:00Z", affirmation_deadline: "2026-09-09T22:00:00Z" }
              as: PlatformAdmin
              captures: { win_mtm: $.data.id }
            - call: "POST /clearing/trade-submissions"
              payload: { counterparty_participant_id: "${p_mb3}", security_id: "${sec_mtm}", side: "BUY", quantity: 10, trade_price_cents: 4000, trade_date: "2026-09-08T14:00:00Z" }
              as: ClearingMember
              as_user_id: "${p_ma3}"
              captures: { t_mtm: $.data.id }
            - call: "POST /clearing/trade-submissions/${t_mtm}/lock-in"
              payload: {}
              as: ClearingMember
              as_user_id: "${p_ma3}"
            - call: "POST /clearing/settlement-windows/${win_mtm}/net"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/participants/${p_ma3}/suspend"
              payload: {}
              as: PlatformAdmin
            - call: "GET /clearing/net-positions?window_id=${win_mtm}"
              payload: {}
              as: ClearingMember
              captures: { np_mtm: "$.data[0].id" }
            - call: "PUT /clearing/securities/${sec_mtm}"
              payload: { prev_settlement_price_cents: 3000 }
              as: PlatformAdmin
          trigger:
            - call: "POST /clearing/net-positions/${np_mtm}/fund"
              payload: { amount_cents: 0, mark_to_market_only: true }
              as: ClearingMember
              as_user_id: "${p_ma3}"
          assert:
            - "the response status is 200"
            - "NetPosition.${np_mtm}.mark_to_market_cents == -20000, being the signed failed quantity 10 times the price move 3000 - 5000"
            - "NetPosition.${np_mtm}.funded_amount_cents is unchanged at 0, because the mark-only flag skips the funding leg"

      - name: custody_account_positions_surface_serviced_quantity
