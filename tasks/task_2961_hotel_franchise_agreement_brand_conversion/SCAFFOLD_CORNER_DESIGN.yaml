          rationale: "That cross_entity_state_dependency instance already shows the UNDER_REVIEW -> APPROVED transition refused while a sibling EncroachmentClaim is FILED and permitted once the claim is OVERRULED."

      - name: owner_profile_change_reaches_the_application_axis
        claim_type: cross_entity
        excluded_because:
