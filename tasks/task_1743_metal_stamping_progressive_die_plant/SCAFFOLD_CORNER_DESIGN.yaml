scaffold_corner_design:
  - section: entities
    instances:
      - name: customer_creation_applies_defaults
        claim_type: defaults_applied
        grounds: ["entities.Customer.fields.active"]
        distinguishing_aspect: "Omitting optional 'active' on customer creation defaults it to true."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "Default Co", customer_code: "DFLT", steel_index_basis: "CRU_HRC", base_index_value: 900, pass_through_pct: 0.5 }
              as: PlantAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "GET /api/customers/${cust_id}"
              as: PlantAdmin
          assert:
            - "Customer.${cust_id}.active == true (default applied)"
            - "Customer.${cust_id}.version == 1"
      - name: part_computed_steel_content_zero_before_layout
        claim_type: computed_field
        grounds: ["entities.Part.fields.steel_content_kg"]
        distinguishing_aspect: "Part.steel_content_kg is a computed field, 0 until a StripLayout is APPROVED (client cannot set it)."
        test_recipe:
          setup: ["a customer exists"]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "Comp Co", customer_code: "COMP", steel_index_basis: "CRU_CRC", base_index_value: 1000, pass_through_pct: 0.5 }
              as: PlantAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /api/parts"
              payload: { customer_id: "${cust_id}", part_number: "P-C1", material_spec: "DC04", thickness_mm: 0.8, net_weight_kg: 0.5, base_piece_price_cents: 900, ppap_required_level: 1 }
              as: ProcessEngineer
              captures: { part_id: $.data.id, steel: $.data.steel_content_kg }
          assert:
            - "Part.${part_id}.steel_content_kg == 0 (computed field ignores input)"
      - name: coil_remaining_weight_initialized_from_received
        claim_type: computed_field
        grounds: ["entities.SteelCoil.fields.remaining_weight_kg"]
        distinguishing_aspect: "SteelCoil.remaining_weight_kg is initialized by the system to received_weight_kg at receipt."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /api/steel-coils"
              payload: { coil_number: "C-INIT", heat_lot_number: "HL-INIT", material_spec: "DC04", thickness_mm: 0.8, received_weight_kg: 750.5 }
              as: ShippingClerk
              captures: { coil_id: $.data.id }
          trigger:
            - call: "GET /api/steel-coils/${coil_id}"
              as: ShippingClerk
          assert:
            - "SteelCoil.${coil_id}.remaining_weight_kg == 750.5"
            - "SteelCoil.${coil_id}.status == RECEIVED"
      - name: entity_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a random UUID returns ERR_NOT_FOUND / 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/dies/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: PlantAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and http status == 404"
      - name: duplicate_die_code_rejected
        claim_type: type_constraint
        grounds: ["entities.Die.fields.die_code", "errors[ERR_DUPLICATE]"]
        distinguishing_aspect: "Second die with the same die_code fails with ERR_DUPLICATE."
        test_recipe:
          setup: ["one die D-DUP exists"]
          setup_api_calls:
            - call: "POST /api/dies"
              payload: { die_code: "D-DUP", die_type: "PROGRESSIVE", total_stations: 4, rated_tonnage: 200, min_bed_width_mm: 1500, repair_threshold_shots: 1000 }
              as: ToolroomManager
          trigger:
            - call: "POST /api/dies"
              payload: { die_code: "D-DUP", die_type: "TRANSFER", total_stations: 2, rated_tonnage: 150, min_bed_width_mm: 1200, repair_threshold_shots: 500 }
              as: ToolroomManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE and http status == 409"
      - name: ppap_immutable_entity_has_no_version
        claim_type: immutability
        grounds: ["entities.RejectEvent", "entities.IndexPublication"]
        distinguishing_aspect: "RejectEvent (common_fields: false) carries no version field in responses."
        test_recipe:
          setup: ["a completed run exists to hang a reject event on — reuse minimal chain: customer, part, die, layout, ppap, order, press, changeover, coil, run started"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /api/customers"
              payload: { name: "Imm Co", customer_code: "IMM", steel_index_basis: "CRU_HRC", base_index_value: 900, pass_through_pct: 0.5 }
              as: PlantAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /api/parts"
              payload: { customer_id: "${cust_id}", part_number: "P-IMM", material_spec: "HSLA340", thickness_mm: 1.2, net_weight_kg: 0.62, base_piece_price_cents: 1800, ppap_required_level: 1 }
              as: ProcessEngineer
              captures: { part_id: $.data.id, part_ver: $.data.version }
            - call: "POST /api/dies"
              payload: { die_code: "D-IMM", die_type: "PROGRESSIVE", total_stations: 6, rated_tonnage: 300, min_bed_width_mm: 1800, repair_threshold_shots: 50000 }
              as: ToolroomManager
              captures: { die_id: $.data.id }
            - call: "POST /api/part-die-assignments"
              payload: { part_id: "${part_id}", die_id: "${die_id}" }
              as: ProcessEngineer
            - call: "POST /api/strip-layouts"
              payload: { part_id: "${part_id}", revision: "A", strip_width_mm: 250, pitch_mm: 120, parts_per_strip_segment: 1, gross_weight_per_part_kg: 0.85 }
              as: ProcessEngineer
              captures: { layout_id: $.data.id }
            - call: "POST /api/strip-layouts/${layout_id}/approve"
              payload: { expected_part_version: "${part_ver}" }
              as: ProcessEngineer
            - call: "POST /api/ppap-submissions"
              payload: { part_id: "${part_id}", level: 1, control_plan_attached: false }
              as: ProcessEngineer
              captures: { ppap_id: $.data.id }
            - call: "POST /api/ppap-submissions/${ppap_id}/begin-review"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/ppap-submissions/${ppap_id}/approve"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-2"
            - call: "POST /api/production-orders"
              payload: { part_id: "${part_id}", quantity_ordered: 100, due_date: "2026-08-20T00:00:00Z" }
              as: ProductionPlanner
              captures: { order_id: $.data.id, order_ver: $.data.version }
            - call: "POST /api/production-orders/${order_id}/release"
              payload: { expected_order_version: "${order_ver}" }
              as: ProductionPlanner
            - call: "POST /api/presses"
              payload: { press_code: "PR-IMM", tonnage: 500, bed_width_mm: 2500, strokes_per_min: 45 }
              as: PlantAdmin
              captures: { press_id: $.data.id }
            - call: "POST /api/die-change-events"
              payload: { press_id: "${press_id}", to_die_id: "${die_id}", planned_start: "2026-08-01T06:00:00Z", planned_end: "2026-08-01T07:00:00Z", smed_target_minutes: 40 }
              as: SetupLead
              captures: { dce_id: $.data.id }
            - call: "POST /api/die-change-events/${dce_id}/start"
              payload: {}
              as: SetupLead
            - call: "POST /api/die-change-events/${dce_id}/complete"
              payload: {}
              as: SetupLead
            - call: "POST /api/steel-coils"
              payload: { coil_number: "C-IMM", heat_lot_number: "HL-IMM", material_spec: "HSLA340", thickness_mm: 1.2, received_weight_kg: 500 }
              as: ShippingClerk
              captures: { coil_id: $.data.id }
            - call: "POST /api/steel-coils/${coil_id}/approve"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/production-runs"
              payload: { production_order_id: "${order_id}", press_id: "${press_id}", die_id: "${die_id}", coil_id: "${coil_id}", scheduled_start: "2026-08-01T08:00:00Z", scheduled_end: "2026-08-01T09:00:00Z" }
              as: ProductionPlanner
              captures: { run_id: $.data.id }
            - call: "POST /api/production-runs/${run_id}/start"
              payload: {}
              as: PressOperator
          trigger:
            - call: "POST /api/production-runs/${run_id}/reject-events"
              payload: { station_number: 2, sensor_code: "MISFEED", quantity: 3, sensed_at: "2026-08-01T08:30:00Z" }
              as: PressOperator
              captures: { ev: $.data }
          assert:
            - "RejectEvent response has no 'version' key and no 'updated_at' key (common_fields: false)"
            - "RejectEvent has id and created_at populated by the system"

  - section: state_machines
    instances:
      - name: coil_terminal_rejected_accepts_no_transitions
        claim_type: terminal_lockdown
        grounds: ["state_machines.SteelCoil"]
        distinguishing_aspect: "A REJECTED coil (terminal) rejects approve/hold with ERR_INVALID_STATE."
        test_recipe:
          setup: ["coil created then rejected"]
          setup_api_calls:
            - call: "POST /api/steel-coils"
              payload: { coil_number: "C-TERM", heat_lot_number: "HL-TERM", material_spec: "DC04", thickness_mm: 0.8, received_weight_kg: 100 }
              as: ShippingClerk
              captures: { coil_id: $.data.id }
            - call: "POST /api/steel-coils/${coil_id}/reject"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
          trigger:
            - call: "POST /api/steel-coils/${coil_id}/hold"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE and http status == 409"
      - name: die_change_complete_from_planned_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.DieChangeEvent"]
        distinguishing_aspect: "Completing a PLANNED (never started) changeover is an invalid transition."
        test_recipe:
          setup: ["press and die exist, PLANNED changeover"]
          setup_api_calls:
            - call: "POST /api/presses"
              payload: { press_code: "PR-IV", tonnage: 500, bed_width_mm: 2500, strokes_per_min: 40 }
              as: PlantAdmin
              captures: { press_id: $.data.id }
            - call: "POST /api/dies"
              payload: { die_code: "D-IV", die_type: "PROGRESSIVE", total_stations: 4, rated_tonnage: 300, min_bed_width_mm: 1800, repair_threshold_shots: 1000 }
              as: ToolroomManager
              captures: { die_id: $.data.id }
            - call: "POST /api/die-change-events"
              payload: { press_id: "${press_id}", to_die_id: "${die_id}", planned_start: "2026-08-01T06:00:00Z", planned_end: "2026-08-01T07:00:00Z", smed_target_minutes: 40 }
              as: SetupLead
              captures: { dce_id: $.data.id }
          trigger:
            - call: "POST /api/die-change-events/${dce_id}/complete"
              payload: {}
              as: SetupLead
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (PLANNED -> COMPLETED is not a declared transition)"
      - name: initial_states_on_creation
        claim_type: initial_state
        grounds: ["state_machines.Die", "state_machines.ProductionOrder", "state_machines.LayeredAudit"]
        distinguishing_aspect: "Newly created Die is AVAILABLE, ProductionOrder is OPEN, LayeredAudit is PENDING."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /api/dies"
              payload: { die_code: "D-INIT", die_type: "PROGRESSIVE", total_stations: 4, rated_tonnage: 200, min_bed_width_mm: 1500, repair_threshold_shots: 1000 }
              as: ToolroomManager
              captures: { die: $.data }
            - call: "POST /api/customers"
              payload: { name: "IS Co", customer_code: "IS", steel_index_basis: "CRU_HRC", base_index_value: 900, pass_through_pct: 0.5 }
              as: PlantAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /api/parts"
              payload: { customer_id: "${cust_id}", part_number: "P-IS", material_spec: "DC04", thickness_mm: 0.8, net_weight_kg: 0.5, base_piece_price_cents: 900, ppap_required_level: 1 }
              as: ProcessEngineer
              captures: { part_id: $.data.id }
            - call: "POST /api/production-orders"
              payload: { part_id: "${part_id}", quantity_ordered: 10, due_date: "2026-08-20T00:00:00Z" }
              as: ProductionPlanner
              captures: { ord: $.data }
            - call: "POST /api/presses"
              payload: { press_code: "PR-IS", tonnage: 500, bed_width_mm: 2500, strokes_per_min: 40 }
              as: PlantAdmin
              captures: { press_id: $.data.id }
            - call: "POST /api/layered-audits"
              payload: { press_id: "${press_id}", audit_tier: 1, scheduled_date: "2026-08-10T00:00:00Z" }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { aud: $.data }
          trigger:
            - call: "GET /api/dies/${die.id}"
              as: ToolroomManager
          assert:
            - "Die.status == AVAILABLE at creation"
            - "ProductionOrder.status == OPEN at creation"
            - "LayeredAudit.result == PENDING at creation"
      - name: audit_fail_escalates_tier1_to_tier2
        claim_type: side_effect_execution
        grounds: ["state_machines.LayeredAudit.PENDING_to_FAIL"]
        distinguishing_aspect: "A tier-1 FAIL auto-creates a tier-2 PENDING audit with escalated_from_id pointing to the tier-1 audit (escalation chain, no quarantine below tier 3)."
        test_recipe:
          setup: ["press exists, tier-1 audit PENDING"]
          setup_api_calls:
            - call: "POST /api/presses"
              payload: { press_code: "PR-ESC", tonnage: 500, bed_width_mm: 2500, strokes_per_min: 40 }
              as: PlantAdmin
              captures: { press_id: $.data.id }
            - call: "POST /api/layered-audits"
              payload: { press_id: "${press_id}", audit_tier: 1, scheduled_date: "2026-08-10T00:00:00Z" }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { audit1: $.data.id }
          trigger:
            - call: "POST /api/layered-audits/${audit1}/record"
              payload: { result: "FAIL", findings_count: 2 }
              as: QualityEngineer
              as_user_id: "qe-2"
            - call: "GET /api/presses/${press_id}/layered-audits?audit_tier=2"
              as: QualityEngineer
              captures: { tier2: $.data }
          assert:
            - "LayeredAudit.${audit1}.result == FAIL"
            - "exactly one tier-2 audit exists with escalated_from_id == ${audit1} and result == PENDING"
      - name: ppap_approve_qualifies_assignments
        claim_type: side_effect_execution
        grounds: ["state_machines.PPAPSubmission.UNDER_REVIEW_to_APPROVED"]
        distinguishing_aspect: "PPAP approval flips every PartDieAssignment.qualified for the part from false to true."
        test_recipe:
          setup: ["part with one assignment (qualified=false) and a submission UNDER_REVIEW"]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "Qual Co", customer_code: "QUAL", steel_index_basis: "CRU_HRC", base_index_value: 900, pass_through_pct: 0.5 }
              as: PlantAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /api/parts"
              payload: { customer_id: "${cust_id}", part_number: "P-QUAL", material_spec: "DC04", thickness_mm: 0.8, net_weight_kg: 0.5, base_piece_price_cents: 900, ppap_required_level: 1 }
              as: ProcessEngineer
              captures: { part_id: $.data.id }
            - call: "POST /api/dies"
              payload: { die_code: "D-QUAL", die_type: "PROGRESSIVE", total_stations: 4, rated_tonnage: 200, min_bed_width_mm: 1500, repair_threshold_shots: 1000 }
              as: ToolroomManager
              captures: { die_id: $.data.id }
            - call: "POST /api/part-die-assignments"
              payload: { part_id: "${part_id}", die_id: "${die_id}" }
              as: ProcessEngineer
              captures: { assign_id: $.data.id, qual0: $.data.qualified }
            - call: "POST /api/ppap-submissions"
              payload: { part_id: "${part_id}", level: 1, control_plan_attached: false }
              as: ProcessEngineer
              captures: { ppap_id: $.data.id }
            - call: "POST /api/ppap-submissions/${ppap_id}/begin-review"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
          trigger:
            - call: "POST /api/ppap-submissions/${ppap_id}/approve"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-2"
            - call: "GET /api/parts/${part_id}/die-assignments"
              as: ProcessEngineer
              captures: { rows: $.data }
          assert:
            - "before approval: assignment.qualified == false"
            - "after approval: every PartDieAssignment for the part has qualified == true"
      - name: die_retire_deletes_assignments
        claim_type: side_effect_execution
        grounds: ["state_machines.Die.AVAILABLE_to_RETIRED"]
        distinguishing_aspect: "Retiring an AVAILABLE die deletes its PartDieAssignment rows (cascade-down compensation)."
        test_recipe:
          setup: ["die with one assignment, no runs"]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "Ret Co", customer_code: "RET", steel_index_basis: "CRU_HRC", base_index_value: 900, pass_through_pct: 0.5 }
              as: PlantAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /api/parts"
              payload: { customer_id: "${cust_id}", part_number: "P-RET", material_spec: "DC04", thickness_mm: 0.8, net_weight_kg: 0.5, base_piece_price_cents: 900, ppap_required_level: 1 }
              as: ProcessEngineer
              captures: { part_id: $.data.id }
            - call: "POST /api/dies"
              payload: { die_code: "D-RET", die_type: "PROGRESSIVE", total_stations: 4, rated_tonnage: 200, min_bed_width_mm: 1500, repair_threshold_shots: 1000 }
              as: ToolroomManager
              captures: { die_id: $.data.id }
            - call: "POST /api/part-die-assignments"
              payload: { part_id: "${part_id}", die_id: "${die_id}" }
              as: ProcessEngineer
          trigger:
            - call: "POST /api/dies/${die_id}/retire"
              payload: {}
              as: ToolroomManager
            - call: "GET /api/part-die-assignments?die_id=${die_id}"
              as: ProcessEngineer
              captures: { rows: $.data }
          assert:
            - "Die.${die_id}.status == RETIRED"
            - "GET /api/part-die-assignments?die_id=... returns empty array (assignments deleted)"

  - section: calculations
    instances:
      - name: scrap_rate_uses_only_own_run_events
        claim_type: input_set_filtering
        grounds: ["calculations.reject_count_aggregation"]
        distinguishing_aspect: "reject_count sums only RejectEvents of the same run; a reject event on another run does not leak."
        test_recipe:
          setup: ["two runs on the same press/order sequence; run1 has a reject of 5, run2 none"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /api/customers"
              payload: { name: "Leak Co", customer_code: "LEAK", steel_index_basis: "CRU_HRC", base_index_value: 900, pass_through_pct: 0.5 }
