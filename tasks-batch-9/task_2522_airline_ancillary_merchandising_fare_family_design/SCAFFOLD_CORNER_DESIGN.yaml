            - "FareFamily.unbundled_value_cents is still 3500 and bundle_discount_bp is still 968"

      - name: flight_sales_phase_and_irops_state_move_independently
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.Flight.sales_phase
          - state_machines.Flight.irops_state
        excluded_because:
          difficulty_instance: flight_parallel_phase_and_irops_dimensions
          rationale: "Asserted end-to-end by the named 1.8 instance, which drives PRESALE->CHECKIN_OPEN->BOARDING against NORMAL->IRREGULAR->RECOVERED and checks every combined pair."

      - name: booking_loops_ticketed_to_change_pending_and_back
        claim_type: cyclic
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.Booking.booking_status.TICKETED_to_CHANGE_PENDING
          - state_machines.Booking.booking_status.CHANGE_PENDING_to_TICKETED
        excluded_because:
          difficulty_instance: booking_change_cycle_confirm_then_abandon
          rationale: "The named 1.8 instance walks the cycle twice (CONFIRM then ABANDON) and asserts change_count, pending_change_fee_cents and the CHANGE SALE ledger row at each pass."

      - name: decline_branch_posts_no_revenue_while_accept_branch_posts_a_sale
        claim_type: branching
        grounds:
          - state_machines.AncillaryOffer.offer_status.PRESENTED_to_DECLINED
          - state_machines.AncillaryOffer.offer_status.PRESENTED_to_ACCEPTED
          - entities.AncillaryOffer.fields.accepted_price_cents
          - entities.Booking.fields.ancillary_gross_cents
          - calculations.channel_settlement_total
        distinguishing_aspect: "Two branches out of PRESENTED on the same booking diverge in side effects: ACCEPTED pins accepted_price_cents 1250 and posts a BOARDING SALE, while DECLINED pins neither and leaves the ledger at exactly one row."
        test_recipe:
          setup:
            - "catalog holds BAG_CHECKED_1 (3500) and PRIORITY_BOARDING (1250); DIRECT_WEB has commission 0 and markup 0"
            - "flight AC512 carries booked_load_factor_pct 50 and demand_index_bp 0, so every WTP_ELASTIC offer prices at exactly its list price"
            - "HELD booking BRNCH1 on the attribute-free family ECO_BARE has two PRESENTED offers: BAG_CHECKED_1 at rank 1 and PRIORITY_BOARDING at rank 2"
