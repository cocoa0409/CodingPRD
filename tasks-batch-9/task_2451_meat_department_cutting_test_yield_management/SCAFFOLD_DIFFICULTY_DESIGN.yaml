              as: ServiceClerk
              as_user_id: "clerk-01"
              captures: { po2_id: $.data.id }
            - call: "POST /meat-ops/pre-orders"
              payload: { department_id: "${dept_id}", retail_item_id: "${ri1_id}", customer_name: "M. Kaur", customer_phone: "555-0102", requested_weight_lb: 3.0, pickup_window_start_at: "2026-08-05T15:00:00Z", pickup_window_end_at: "2026-08-05T15:30:00Z" }
