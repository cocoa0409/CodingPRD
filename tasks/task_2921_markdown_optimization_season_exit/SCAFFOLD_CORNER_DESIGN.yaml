              as: PricingAnalyst
              as_user_id: "pa-1"
              captures: { item_a_id: $.data.id }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: MerchandiseDirector
              as_user_id: "md-1"
            - call: "POST /seasons"
              payload: { code: "SS27-FOOTWEAR", category: "FOOTWEAR", season_start_date: "2026-08-15", season_end_date: "2027-01-31", exit_target_date: "2027-01-15", exit_units_target: 500, sell_through_target_pct: 80.0, clearance_space_units: 400 }
              as: MerchandiseDirector
              as_user_id: "md-1"
              captures: { season2_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "G-7007", season_id: "${season2_id}", category: "FOOTWEAR", cluster_code: "CL-W9", vendor_code: "VN-200", first_receipt_date: "2026-08-20", original_retail_cents: 8999, unit_cost_cents: 4000, units_received_total: 300 }
              as: PricingAnalyst
              as_user_id: "pa-1"
              captures: { item_g_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-10T00:00:00Z" }
              as: PricingAnalyst
          trigger:
            - call: "POST /seasons/${season2_id}/exit-reviews"
              payload: { review_type: "PRELIMINARY" }
              as: MerchandiseDirector
              as_user_id: "md-1"
              captures: { err_not_active: $.data.error_id }
            - call: "POST /seasons/${season_id}/exit-reviews"
              payload: { review_type: "PRELIMINARY" }
              as: MerchandiseDirector
              as_user_id: "md-1"
              captures: { review_ok_id: $.data.id }
          assert:
            - "HTTP 409 with data.error_id == 'ERR_SEASON_NOT_ACTIVE'"
            - "Season.${season2_id}.status == PLANNING and GET /exit-reviews?season_id=${season2_id} returns total_count == 0"
            - "The identical call against the ACTIVE season returns HTTP 201 as SeasonExitReview.${review_ok_id} with review_type == PRELIMINARY, so the endpoint itself is reachable for the role"
            - "Item.${item_g_id}.lifecycle_stage == NEW_ARRIVAL - the rejected review left the season untouched"

