# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# 9 Difficulty Rules × 2 instances = 18 instances
# All formula-derived asserts pre-computed against §1.3 + constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dvc_position_cost_planned_vs_actual
        grounds:
          - calculations.planned_cost_cents
          - calculations.actual_cost_cents
          - calculations.committed_cost_cents
          - state_machines.Position.VACANT_to_FILLED
          - entities.CostCenter.fields.committed_cost_cents
        distinguishing_aspect: |
          On the CostCenter cost domain, a FUNDED+VACANT position contributes grade-midpoint planned
          cost (6000000) but the SAME position once FILLED contributes the incumbent-salary actual cost
          (7500000); committed_cost_cents diverges by exactly 1500000 for identical position inputs.
        test_recipe:
          setup:
            - "Grade G07 (mid 120000_00); CostCenter CC1 budget 100000000 fte_cap 5.0"
            - "Position P1 G07 fte 0.5 FUNDED VACANT (planned 6000000); CC1.committed_cost_cents=6000000"
            - "Employee E1 salary 150000_00 (band_max G07) AVAILABLE"
          setup_api_calls:
            - call: "POST /grades"
              payload: { code: "G07", band_min_cents: 10000000, band_mid_cents: 12000000, band_max_cents: 15000000, rank: 7 }
              as: CompensationAnalyst
              captures: { g07: $.data.id }
            - call: "POST /cost-centers"
              payload: { name: "Eng", code: "CC1", annual_budget_cents: 100000000, fte_cap: 5.0 }
              as: FinanceController
              captures: { cc1: $.data.id, cc1_v0: $.data.version }
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g07}", title: "Engineer", fte: 0.5 }
              as: HRBP
              captures: { p1: $.data.id }
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "REQUISITION" }
              as: HRBP
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "FUND", expected_cost_center_version: "${cc1_v0}" }
              as: FinanceController
            - call: "POST /employees"
              payload: { full_name: "E One", email: "e1@x.com", annual_salary_cents: 15000000 }
              as: HRBP
              captures: { e1: $.data.id }
          trigger:
            - call: "POST /positions/${p1}/incumbents"
              payload: { employee_id: "${e1}", start_date: "2026-01-01" }
              as: HRBP
          assert:
            - "Position.${p1}.planned_cost_cents == 6000000"
            - "Position.${p1}.actual_cost_cents == 7500000"
            - "CostCenter.${cc1}.committed_cost_cents == 7500000"

      - name: dvc_forecast_planned_vs_actual_fte
        grounds:
          - calculations.forecast_actual_fte
          - calculations.forecast_variance_fte
          - state_machines.ForecastPeriod.DRAFT_to_SNAPSHOTTED
          - entities.ForecastPeriod.fields.variance_fte
        distinguishing_aspect: |
          On the ForecastPeriod domain (distinct from CostCenter cost), planned_fte is the operator
          forward-looking estimate (2.0) while actual_fte is the chronological filled headcount (0.5);
          variance_fte = -1.50, a different entity domain than the cost dual-variant above.
        test_recipe:
          setup:
            - "CC1 with one FILLED position of fte 0.5 -> CC1.filled_fte=0.5"
            - "ForecastPeriod FP1 on CC1 planned_fte 2.0 DRAFT"
          setup_api_calls:
            - call: "POST /grades"
              payload: { code: "G07", band_min_cents: 10000000, band_mid_cents: 12000000, band_max_cents: 15000000, rank: 7 }
              as: CompensationAnalyst
              captures: { g07: $.data.id }
            - call: "POST /cost-centers"
              payload: { name: "Eng", code: "CC1", annual_budget_cents: 100000000, fte_cap: 5.0 }
              as: FinanceController
              captures: { cc1: $.data.id, cc1_v0: $.data.version }
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g07}", title: "Engineer", fte: 0.5 }
              as: HRBP
              captures: { p1: $.data.id }
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "REQUISITION" }
              as: HRBP
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "FUND", expected_cost_center_version: "${cc1_v0}" }
              as: FinanceController
            - call: "POST /employees"
              payload: { full_name: "E One", email: "e1@x.com", annual_salary_cents: 13000000 }
              as: HRBP
              captures: { e1: $.data.id }
            - call: "POST /positions/${p1}/incumbents"
              payload: { employee_id: "${e1}", start_date: "2026-01-01" }
              as: HRBP
            - call: "POST /cost-centers/${cc1}/forecast-periods"
              payload: { fiscal_label: "FY26-Q1", planned_fte: 2.0 }
              as: FinanceController
              captures: { fp1: $.data.id }
            - call: "GET /cost-centers/${cc1}"
              payload: {}
              as: FinanceController
              captures: { cc1_vfp: $.data.version }
          trigger:
            - call: "POST /forecast-periods/${fp1}/snapshot"
              payload: { expected_cost_center_version: "${cc1_vfp}" }
              as: FinanceController
          assert:
            - "ForecastPeriod.${fp1}.actual_fte == 0.5"
            - "ForecastPeriod.${fp1}.variance_fte == -1.5"
            - "ForecastPeriod.${fp1}.status == SNAPSHOTTED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cf_fund_admission_nested_minmax_mode_a
        grounds:
          - calculations.fund_admission_check
          - state_machines.Position.REQUISITIONED_to_FUNDED
          - validations[priority=12]
          - validations[priority=13]
        distinguishing_aspect: |
          Mode (a): fund_admission_check combines >=3 inputs (fte_cap, committed_fte, annual_budget_cents,
          committed_cost_cents, position fte+planned_cost) with a conditional override branch; funding at the
          EXACT cap (committed_fte 1.0 == fte_cap 1.0, available 0) is ADMITTED via <=, not <.
        test_recipe:
          setup:
            - "CC2 budget 12000000 fte_cap 1.0"
            - "P1 G07 fte 0.5 FUNDED (planned 6000000): committed_cost 6000000 committed_fte 0.5 avail 6000000"
            - "P2 G07 fte 0.5 REQUISITIONED ready to fund; delta exactly equals headroom"
          setup_api_calls:
            - call: "POST /grades"
              payload: { code: "G07", band_min_cents: 10000000, band_mid_cents: 12000000, band_max_cents: 15000000, rank: 7 }
              as: CompensationAnalyst
              captures: { g07: $.data.id }
            - call: "POST /cost-centers"
              payload: { name: "Ops", code: "CC2", annual_budget_cents: 12000000, fte_cap: 1.0 }
              as: FinanceController
              captures: { cc2: $.data.id, cc2_v0: $.data.version }
            - call: "POST /positions"
              payload: { cost_center_id: "${cc2}", grade_id: "${g07}", title: "P1", fte: 0.5 }
              as: HRBP
              captures: { p1: $.data.id }
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "REQUISITION" }
              as: HRBP
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "FUND", expected_cost_center_version: "${cc2_v0}" }
              as: FinanceController
            - call: "POST /positions"
              payload: { cost_center_id: "${cc2}", grade_id: "${g07}", title: "P2", fte: 0.5 }
              as: HRBP
              captures: { p2: $.data.id }
            - call: "POST /positions/${p2}/lifecycle"
              payload: { action: "REQUISITION" }
              as: HRBP
            - call: "GET /cost-centers/${cc2}"
              payload: {}
              as: FinanceController
              captures: { cc2_v1: $.data.version }
          trigger:
            - call: "POST /positions/${p2}/lifecycle"
              payload: { action: "FUND", expected_cost_center_version: "${cc2_v1}" }
              as: FinanceController
          assert:
            - "Position.${p2}.lifecycle_status == FUNDED"
            - "CostCenter.${cc2}.committed_fte == 1.0"
            - "CostCenter.${cc2}.committed_cost_cents == 12000000"
            - "CostCenter.${cc2}.available_budget_cents == 0"

      - name: cf_committed_cost_round_per_position_then_sum_mode_b
        grounds:
          - calculations.committed_cost_cents
          - calculations.planned_cost_cents
          - state_machines.Position.REQUISITIONED_to_FUNDED
        distinguishing_aspect: |
          Mode (b): two vacant funded positions each yield band_mid*fte = 5000000.5 cents. Rounding per
          position THEN summing gives 5000001+5000001 = 10000002; the forbidden sum-then-round gives
          10000001. The pinned order produces committed_cost_cents == 10000002 (1 cent apart).
        test_recipe:
          setup:
            - "Grade GH mid 10000001 (=100000.01); CC3 budget 50000000 fte_cap 5.0"
            - "Pa GH fte 0.5 FUNDED, Pb GH fte 0.5 FUNDED"
          setup_api_calls:
            - call: "POST /grades"
              payload: { code: "GH", band_min_cents: 9000000, band_mid_cents: 10000001, band_max_cents: 11000000, rank: 6 }
              as: CompensationAnalyst
              captures: { gh: $.data.id }
            - call: "POST /cost-centers"
              payload: { name: "Round", code: "CC3", annual_budget_cents: 50000000, fte_cap: 5.0 }
              as: FinanceController
              captures: { cc3: $.data.id, cc3_v0: $.data.version }
            - call: "POST /positions"
              payload: { cost_center_id: "${cc3}", grade_id: "${gh}", title: "Pa", fte: 0.5 }
              as: HRBP
              captures: { pa: $.data.id }
            - call: "POST /positions/${pa}/lifecycle"
              payload: { action: "REQUISITION" }
              as: HRBP
            - call: "POST /positions/${pa}/lifecycle"
              payload: { action: "FUND", expected_cost_center_version: "${cc3_v0}" }
              as: FinanceController
            - call: "POST /positions"
              payload: { cost_center_id: "${cc3}", grade_id: "${gh}", title: "Pb", fte: 0.5 }
              as: HRBP
              captures: { pb: $.data.id }
            - call: "POST /positions/${pb}/lifecycle"
              payload: { action: "REQUISITION" }
              as: HRBP
            - call: "GET /cost-centers/${cc3}"
              payload: {}
              as: FinanceController
              captures: { cc3_v1: $.data.version }
          trigger:
            - call: "POST /positions/${pb}/lifecycle"
              payload: { action: "FUND", expected_cost_center_version: "${cc3_v1}" }
              as: FinanceController
          assert:
            - "Position.${pa}.planned_cost_cents == 5000001"
            - "Position.${pb}.planned_cost_cents == 5000001"
            - "CostCenter.${cc3}.committed_cost_cents == 10000002"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: nlsm_position_parallel_lifecycle_x_occupancy
        grounds:
          - state_machines.Position.VACANT_to_FILLED
          - state_machines.Position.FILLED_to_VACANT
          - entities.Position.fields.lifecycle_status
          - entities.Position.fields.occupancy_status
        distinguishing_aspect: |
          Position carries two INDEPENDENT state axes: lifecycle_status stays FUNDED across a
          fill->vacate cycle while occupancy_status moves VACANT->FILLED->VACANT — parallel dimensions
          on one entity, not a single linear pipeline.
        test_recipe:
          setup:
            - "P1 G07 fte 0.5 FUNDED VACANT on CC1; employee E1 AVAILABLE"
          setup_api_calls:
            - call: "POST /grades"
              payload: { code: "G07", band_min_cents: 10000000, band_mid_cents: 12000000, band_max_cents: 15000000, rank: 7 }
              as: CompensationAnalyst
              captures: { g07: $.data.id }
            - call: "POST /cost-centers"
              payload: { name: "Eng", code: "CC1", annual_budget_cents: 100000000, fte_cap: 5.0 }
              as: FinanceController
              captures: { cc1: $.data.id, cc1_v0: $.data.version }
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g07}", title: "Engineer", fte: 0.5 }
              as: HRBP
              captures: { p1: $.data.id }
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "REQUISITION" }
              as: HRBP
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "FUND", expected_cost_center_version: "${cc1_v0}" }
              as: FinanceController
            - call: "POST /employees"
              payload: { full_name: "E One", email: "e1@x.com", annual_salary_cents: 13000000 }
              as: HRBP
              captures: { e1: $.data.id }
            - call: "POST /positions/${p1}/incumbents"
              payload: { employee_id: "${e1}", start_date: "2026-01-01" }
              as: HRBP
              captures: { inc1: $.data.id }
          trigger:
            - call: "POST /incumbents/${inc1}/vacate"
              payload: { vacate_date: "2026-06-30" }
              as: HRBP
          assert:
            - "Position.${p1}.occupancy_status == VACANT"
            - "Position.${p1}.lifecycle_status == FUNDED"
            - "Incumbent.${inc1}.status == VACATED"

      - name: nlsm_reclass_revision_cycle
        grounds:
          - state_machines.ReclassRequest.SUBMITTED_to_UNDER_REVIEW
          - state_machines.ReclassRequest.UNDER_REVIEW_to_SUBMITTED
          - entities.ReclassRequest.fields.status
        distinguishing_aspect: |
          ReclassRequest (a different entity than Position) cycles SUBMITTED->UNDER_REVIEW->SUBMITTED
          via review/return any number of times — a true revision loop, not forward-only.
        test_recipe:
          setup:
            - "P1 G05 FUNDED on CC1; ReclassRequest RR1 to G07 SUBMITTED"
          setup_api_calls:
            - call: "POST /grades"
              payload: { code: "G05", band_min_cents: 6000000, band_mid_cents: 8000000, band_max_cents: 10000000, rank: 5 }
              as: CompensationAnalyst
              captures: { g05: $.data.id }
            - call: "POST /grades"
              payload: { code: "G07", band_min_cents: 10000000, band_mid_cents: 12000000, band_max_cents: 15000000, rank: 7 }
              as: CompensationAnalyst
              captures: { g07: $.data.id }
            - call: "POST /cost-centers"
              payload: { name: "Eng", code: "CC1", annual_budget_cents: 100000000, fte_cap: 5.0 }
              as: FinanceController
              captures: { cc1: $.data.id, cc1_v0: $.data.version }
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g05}", title: "Engineer", fte: 0.5 }
              as: HRBP
              captures: { p1: $.data.id }
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "REQUISITION" }
              as: HRBP
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "FUND", expected_cost_center_version: "${cc1_v0}" }
              as: FinanceController
            - call: "POST /positions/${p1}/reclass-requests"
              payload: { target_grade_id: "${g07}", justification: "promo" }
              as: CompensationAnalyst
              captures: { rr1: $.data.id }
            - call: "POST /reclass-requests/${rr1}/review"
              payload: {}
              as: CompensationAnalyst
            - call: "POST /reclass-requests/${rr1}/return"
              payload: {}
              as: CompensationAnalyst
          trigger:
            - call: "POST /reclass-requests/${rr1}/review"
              payload: {}
              as: CompensationAnalyst
          assert:
            - "ReclassRequest.${rr1}.status == UNDER_REVIEW"
            - "ReclassRequest.${rr1}.version == 4"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: tc_freeze_lift_depth3_unfreeze
        grounds:
          - state_machines.FreezeOrder.ACTIVE_to_LIFTED
          - state_machines.Position.FROZEN_to_FUNDED
          - state_machines.Requisition.SUSPENDED_to_OPEN
          - calculations.cost_center_posture
        distinguishing_aspect: |
          Depth-3 cascade from the LIFT trigger: lifting the FreezeOrder flips CC posture OPEN ->
          that flips each FROZEN Position back to FUNDED -> each FUNDED position flips its SUSPENDED
          Requisition back to OPEN. Each hop is caused by the previous hop, not the lift directly.
        test_recipe:
          setup:
            - "Clock 2026-02-01. CC1 with P1 FUNDED, Requisition RQ1 OPEN on P1."
            - "FreezeOrder F1 [2026-01-01,2026-04-01) ACTIVE -> CC FROZEN, P1 FROZEN, RQ1 SUSPENDED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: FinanceController
            - call: "POST /grades"
              payload: { code: "G07", band_min_cents: 10000000, band_mid_cents: 12000000, band_max_cents: 15000000, rank: 7 }
              as: CompensationAnalyst
              captures: { g07: $.data.id }
            - call: "POST /cost-centers"
              payload: { name: "Eng", code: "CC1", annual_budget_cents: 100000000, fte_cap: 5.0 }
              as: FinanceController
              captures: { cc1: $.data.id, cc1_v0: $.data.version }
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g07}", title: "Engineer", fte: 0.5 }
              as: HRBP
              captures: { p1: $.data.id }
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "REQUISITION" }
              as: HRBP
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "FUND", expected_cost_center_version: "${cc1_v0}" }
              as: FinanceController
            - call: "POST /positions/${p1}/requisitions"
              payload: { req_type: "BACKFILL", justification: "ramp" }
              as: HRBP
              captures: { rq1: $.data.id }
            - call: "POST /cost-centers/${cc1}/freeze-orders"
              payload: { effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-04-01T00:00:00Z", reason: "freeze" }
              as: FinanceController
              captures: { f1: $.data.id }
          trigger:
            - call: "POST /freeze-orders/${f1}/lift"
              payload: {}
              as: FinanceController
          assert:
            - "CostCenter.${cc1}.posture == OPEN"
            - "Position.${p1}.lifecycle_status == FUNDED"
            - "Requisition.${rq1}.status == OPEN"

      - name: tc_abolish_depth2_vacate_incumbent
        grounds:
          - state_machines.Position.FUNDED_to_ABOLISHED
          - state_machines.Position.FILLED_to_VACANT
          - entities.Employee.fields.status
        distinguishing_aspect: |
          Depth-2 cascade from the ABOLISH trigger (different trigger than the LIFT cascade above):
          abolishing a FILLED position vacates its ACTIVE Incumbent, and that vacate frees the occupying
          Employee back to AVAILABLE.
        test_recipe:
          setup:
            - "P1 G07 fte 0.5 FUNDED FILLED by E1 on CC1; no direct reports"
          setup_api_calls:
            - call: "POST /grades"
              payload: { code: "G07", band_min_cents: 10000000, band_mid_cents: 12000000, band_max_cents: 15000000, rank: 7 }
              as: CompensationAnalyst
              captures: { g07: $.data.id }
            - call: "POST /cost-centers"
              payload: { name: "Eng", code: "CC1", annual_budget_cents: 100000000, fte_cap: 5.0 }
              as: FinanceController
              captures: { cc1: $.data.id, cc1_v0: $.data.version }
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g07}", title: "Engineer", fte: 0.5 }
              as: HRBP
              captures: { p1: $.data.id }
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "REQUISITION" }
              as: HRBP
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "FUND", expected_cost_center_version: "${cc1_v0}" }
              as: FinanceController
            - call: "POST /employees"
              payload: { full_name: "E One", email: "e1@x.com", annual_salary_cents: 13000000 }
              as: HRBP
              captures: { e1: $.data.id }
            - call: "POST /positions/${p1}/incumbents"
              payload: { employee_id: "${e1}", start_date: "2026-01-01" }
              as: HRBP
              captures: { inc1: $.data.id }
          trigger:
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "ABOLISH" }
              as: HRDirector
          assert:
            - "Position.${p1}.lifecycle_status == ABOLISHED"
            - "Position.${p1}.occupancy_status == VACANT"
            - "Incumbent.${inc1}.status == VACATED"
            - "Employee.${e1}.status == AVAILABLE"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: ppvc_frozen_state_vs_budget_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=13]
          - calculations.cost_center_posture
        distinguishing_aspect: |
          A FUND that is both blocked by CC posture FROZEN (priority 7, business_referential) AND would
          exceed budget (priority 13, business_fiscal) returns the higher-priority ERR_COST_CENTER_FROZEN,
          not ERR_BUDGET_EXCEEDED — a referential-vs-fiscal category pair.
        test_recipe:
          setup:
            - "Clock 2026-02-01. CC4 budget 1 (so any fund exceeds), fte_cap 5.0."
            - "P1 G07 fte 0.5 REQUISITIONED; FreezeOrder covering now -> CC FROZEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: FinanceController
            - call: "POST /grades"
              payload: { code: "G07", band_min_cents: 10000000, band_mid_cents: 12000000, band_max_cents: 15000000, rank: 7 }
              as: CompensationAnalyst
              captures: { g07: $.data.id }
            - call: "POST /cost-centers"
              payload: { name: "Tight", code: "CC4", annual_budget_cents: 1, fte_cap: 5.0 }
              as: FinanceController
              captures: { cc4: $.data.id, cc4_v0: $.data.version }
            - call: "POST /positions"
              payload: { cost_center_id: "${cc4}", grade_id: "${g07}", title: "P1", fte: 0.5 }
              as: HRBP
              captures: { p1: $.data.id }
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "REQUISITION" }
              as: HRBP
            - call: "POST /cost-centers/${cc4}/freeze-orders"
              payload: { effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-04-01T00:00:00Z", reason: "freeze" }
              as: FinanceController
            - call: "GET /cost-centers/${cc4}"
              payload: {}
              as: FinanceController
              captures: { cc4_vf: $.data.version }
          trigger:
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "FUND", expected_cost_center_version: "${cc4_vf}" }
              as: FinanceController
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_COST_CENTER_FROZEN"
            - "Position.${p1}.lifecycle_status == REQUISITIONED"

      - name: ppvc_invalid_state_vs_has_reports_referential
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - state_machines.Position.FUNDED_to_ABOLISHED
        distinguishing_aspect: |
          Abolishing a DRAFT position that also has a non-ABOLISHED direct report fails the state check
          (priority 6, ERR_INVALID_STATE — DRAFT has no ABOLISH transition) before the direct-reports check
          (priority 9, business_referential); a state-vs-referential category pair distinct from the pair above.
        test_recipe:
          setup:
            - "Mgr position M DRAFT on CC1; child position C DRAFT reporting to M (M has 1 non-ABOLISHED report)"
          setup_api_calls:
            - call: "POST /grades"
              payload: { code: "G07", band_min_cents: 10000000, band_mid_cents: 12000000, band_max_cents: 15000000, rank: 7 }
              as: CompensationAnalyst
              captures: { g07: $.data.id }
            - call: "POST /cost-centers"
              payload: { name: "Eng", code: "CC1", annual_budget_cents: 100000000, fte_cap: 5.0 }
              as: FinanceController
              captures: { cc1: $.data.id }
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g07}", title: "Mgr", fte: 0.5 }
              as: HRBP
              captures: { m: $.data.id }
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g07}", title: "Child", fte: 0.5, manager_position_id: "${m}" }
              as: HRBP
              captures: { c: $.data.id }
          trigger:
            - call: "POST /positions/${m}/lifecycle"
              payload: { action: "ABOLISH" }
              as: HRDirector
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Position.${m}.lifecycle_status == DRAFT"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: bpc_span_of_control_eight_ok_nine_rejected
        grounds:
          - calculations.span_of_control
          - validations[priority=8]
          - entities.Position.fields.span_of_control
        distinguishing_aspect: |
          MAX_SPAN_OF_CONTROL=8: creating the 8th direct report succeeds (span reaches exactly 8) but the
          9th is rejected with ERR_SPAN_LIMIT_EXCEEDED (> 8, not >=). Endpoint POST /positions.
        test_recipe:
          setup:
            - "Manager M DRAFT on CC1 with 8 non-ABOLISHED direct reports (span_of_control=8)"
          setup_api_calls:
            - call: "POST /grades"
              payload: { code: "G07", band_min_cents: 10000000, band_mid_cents: 12000000, band_max_cents: 15000000, rank: 7 }
              as: CompensationAnalyst
              captures: { g07: $.data.id }
            - call: "POST /cost-centers"
              payload: { name: "Eng", code: "CC1", annual_budget_cents: 100000000, fte_cap: 50.0 }
              as: FinanceController
              captures: { cc1: $.data.id }
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g07}", title: "Mgr", fte: 0.5 }
              as: HRBP
              captures: { m: $.data.id }
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g07}", title: "r1", fte: 0.5, manager_position_id: "${m}" }
              as: HRBP
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g07}", title: "r2", fte: 0.5, manager_position_id: "${m}" }
              as: HRBP
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g07}", title: "r3", fte: 0.5, manager_position_id: "${m}" }
              as: HRBP
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g07}", title: "r4", fte: 0.5, manager_position_id: "${m}" }
              as: HRBP
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g07}", title: "r5", fte: 0.5, manager_position_id: "${m}" }
              as: HRBP
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g07}", title: "r6", fte: 0.5, manager_position_id: "${m}" }
              as: HRBP
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g07}", title: "r7", fte: 0.5, manager_position_id: "${m}" }
              as: HRBP
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g07}", title: "r8", fte: 0.5, manager_position_id: "${m}" }
              as: HRBP
          trigger:
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g07}", title: "r9", fte: 0.5, manager_position_id: "${m}" }
              as: HRBP
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SPAN_LIMIT_EXCEEDED"
            - "Position.${m}.span_of_control == 8"

      - name: bpc_fte_cap_exact_equal_admitted
        grounds:
          - calculations.fund_admission_check
          - validations[priority=12]
          - entities.CostCenter.fields.committed_fte
        distinguishing_aspect: |
          A different metric/endpoint than span: funding a position whose fte makes committed_fte exactly
          equal fte_cap (1.0 == 1.0) is ADMITTED (<=), and a follow-on fte=0.01 fund crossing to 1.01 > 1.0
          is rejected with ERR_FTE_CAP_EXCEEDED. Endpoint POST /positions/{id}/lifecycle.
        test_recipe:
          setup:
            - "CC5 budget 100000000 fte_cap 1.0. P1 G07 fte 1.0 REQUISITIONED. P2 G07 fte 0.01 REQUISITIONED."
          setup_api_calls:
            - call: "POST /grades"
              payload: { code: "G07", band_min_cents: 10000000, band_mid_cents: 12000000, band_max_cents: 15000000, rank: 7 }
              as: CompensationAnalyst
              captures: { g07: $.data.id }
            - call: "POST /cost-centers"
              payload: { name: "Cap", code: "CC5", annual_budget_cents: 100000000, fte_cap: 1.0 }
              as: FinanceController
              captures: { cc5: $.data.id, cc5_v0: $.data.version }
            - call: "POST /positions"
              payload: { cost_center_id: "${cc5}", grade_id: "${g07}", title: "P1", fte: 1.0 }
              as: HRBP
              captures: { p1: $.data.id }
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "REQUISITION" }
              as: HRBP
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "FUND", expected_cost_center_version: "${cc5_v0}" }
              as: FinanceController
            - call: "POST /positions"
              payload: { cost_center_id: "${cc5}", grade_id: "${g07}", title: "P2", fte: 0.01 }
              as: HRBP
              captures: { p2: $.data.id }
            - call: "POST /positions/${p2}/lifecycle"
              payload: { action: "REQUISITION" }
              as: HRBP
            - call: "GET /cost-centers/${cc5}"
              payload: {}
              as: FinanceController
              captures: { cc5_v1: $.data.version }
          trigger:
            - call: "POST /positions/${p2}/lifecycle"
              payload: { action: "FUND", expected_cost_center_version: "${cc5_v1}" }
              as: FinanceController
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_FTE_CAP_EXCEEDED"
            - "CostCenter.${cc5}.committed_fte == 1.0"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: cesd_fund_requires_cost_center_open
        grounds:
          - state_machines.Position.REQUISITIONED_to_FUNDED
          - calculations.cost_center_posture
          - validations[priority=7]
        distinguishing_aspect: |
          Position->CostCenter pair: a Position's REQUISITIONED->FUNDED transition is blocked
          (ERR_COST_CENTER_FROZEN) when the owning CostCenter posture is FROZEN — entity A's transition
          gated by entity B's derived state.
        test_recipe:
          setup:
            - "Clock 2026-02-01. CC1 P1 G07 REQUISITIONED. FreezeOrder covering now -> CC FROZEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: FinanceController
            - call: "POST /grades"
              payload: { code: "G07", band_min_cents: 10000000, band_mid_cents: 12000000, band_max_cents: 15000000, rank: 7 }
              as: CompensationAnalyst
              captures: { g07: $.data.id }
            - call: "POST /cost-centers"
              payload: { name: "Eng", code: "CC1", annual_budget_cents: 100000000, fte_cap: 5.0 }
              as: FinanceController
              captures: { cc1: $.data.id }
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g07}", title: "P1", fte: 0.5 }
              as: HRBP
              captures: { p1: $.data.id }
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "REQUISITION" }
              as: HRBP
            - call: "POST /cost-centers/${cc1}/freeze-orders"
              payload: { effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-04-01T00:00:00Z", reason: "freeze" }
              as: FinanceController
            - call: "GET /cost-centers/${cc1}"
              payload: {}
              as: FinanceController
              captures: { cc1_vf: $.data.version }
          trigger:
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "FUND", expected_cost_center_version: "${cc1_vf}" }
              as: FinanceController
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_COST_CENTER_FROZEN"
            - "Position.${p1}.lifecycle_status == REQUISITIONED"

      - name: cesd_fill_requires_position_funded
        grounds:
          - state_machines.Position.VACANT_to_FILLED
          - entities.Position.fields.lifecycle_status
          - validations[priority=10]
        distinguishing_aspect: |
          Incumbent->Position pair (distinct from Position->CostCenter): filling a position is blocked with
          ERR_POSITION_NOT_FUNDED when the position lifecycle_status is REQUISITIONED (not yet FUNDED).
        test_recipe:
          setup:
            - "P1 G07 REQUISITIONED (not funded) on CC1; E1 AVAILABLE salary in band"
          setup_api_calls:
            - call: "POST /grades"
              payload: { code: "G07", band_min_cents: 10000000, band_mid_cents: 12000000, band_max_cents: 15000000, rank: 7 }
              as: CompensationAnalyst
              captures: { g07: $.data.id }
            - call: "POST /cost-centers"
              payload: { name: "Eng", code: "CC1", annual_budget_cents: 100000000, fte_cap: 5.0 }
              as: FinanceController
              captures: { cc1: $.data.id }
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g07}", title: "P1", fte: 0.5 }
              as: HRBP
              captures: { p1: $.data.id }
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "REQUISITION" }
              as: HRBP
            - call: "POST /employees"
              payload: { full_name: "E One", email: "e1@x.com", annual_salary_cents: 13000000 }
              as: HRBP
              captures: { e1: $.data.id }
          trigger:
            - call: "POST /positions/${p1}/incumbents"
              payload: { employee_id: "${e1}", start_date: "2026-01-01" }
              as: HRBP
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_POSITION_NOT_FUNDED"
            - "Position.${p1}.occupancy_status == VACANT"
            - "Employee.${e1}.status == AVAILABLE"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rto_incumbency_inclusive_boundary_overlap
        grounds:
          - state_machines.Position.VACANT_to_FILLED
          - entities.Incumbent.fields.start_date
          - entities.Incumbent.fields.end_date
          - validations[priority=10]
        distinguishing_aspect: |
          Incumbency intervals are CLOSED inclusive on a Position: inc1 [2026-01-01, 2026-06-30], a
          refill starting exactly on 2026-06-30 overlaps the inclusive end and is rejected with
          ERR_INCUMBENCY_OVERLAP (touching shared endpoint = collision).
        test_recipe:
          setup:
            - "P1 G07 FUNDED on CC1. inc1 by E1 start 2026-01-01, VACATED end 2026-06-30. E2 AVAILABLE."
          setup_api_calls:
            - call: "POST /grades"
              payload: { code: "G07", band_min_cents: 10000000, band_mid_cents: 12000000, band_max_cents: 15000000, rank: 7 }
              as: CompensationAnalyst
              captures: { g07: $.data.id }
            - call: "POST /cost-centers"
              payload: { name: "Eng", code: "CC1", annual_budget_cents: 100000000, fte_cap: 5.0 }
              as: FinanceController
              captures: { cc1: $.data.id, cc1_v0: $.data.version }
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g07}", title: "P1", fte: 0.5 }
              as: HRBP
              captures: { p1: $.data.id }
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "REQUISITION" }
              as: HRBP
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "FUND", expected_cost_center_version: "${cc1_v0}" }
              as: FinanceController
            - call: "POST /employees"
              payload: { full_name: "E One", email: "e1@x.com", annual_salary_cents: 13000000 }
              as: HRBP
              captures: { e1: $.data.id }
            - call: "POST /employees"
              payload: { full_name: "E Two", email: "e2@x.com", annual_salary_cents: 13000000 }
              as: HRBP
              captures: { e2: $.data.id }
            - call: "POST /positions/${p1}/incumbents"
              payload: { employee_id: "${e1}", start_date: "2026-01-01" }
              as: HRBP
              captures: { inc1: $.data.id }
            - call: "POST /incumbents/${inc1}/vacate"
              payload: { vacate_date: "2026-06-30" }
              as: HRBP
          trigger:
            - call: "POST /positions/${p1}/incumbents"
              payload: { employee_id: "${e2}", start_date: "2026-06-30" }
              as: HRBP
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INCUMBENCY_OVERLAP"
            - "Position.${p1}.occupancy_status == VACANT"

      - name: rto_freeze_window_halfopen_adjacency_allowed
        grounds:
          - state_machines.FreezeOrder.ACTIVE_to_LIFTED
          - entities.FreezeOrder.fields.effective_from
          - entities.FreezeOrder.fields.effective_to
          - validations[priority=11]
        distinguishing_aspect: |
          FreezeOrder windows on a CostCenter use HALF-OPEN [from,to) interval arithmetic (different
          semantics than inclusive incumbency): F1 [2026-01-01,2026-04-01) and F2 [2026-04-01,2026-07-01)
          share a boundary and do NOT overlap, so F2 is accepted (201).
        test_recipe:
          setup:
            - "Clock 2026-05-01. CC1 with ACTIVE FreezeOrder F1 [2026-01-01,2026-04-01)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: FinanceController
            - call: "POST /cost-centers"
              payload: { name: "Eng", code: "CC1", annual_budget_cents: 100000000, fte_cap: 5.0 }
              as: FinanceController
              captures: { cc1: $.data.id }
            - call: "POST /cost-centers/${cc1}/freeze-orders"
              payload: { effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-04-01T00:00:00Z", reason: "q1" }
              as: FinanceController
          trigger:
            - call: "POST /cost-centers/${cc1}/freeze-orders"
              payload: { effective_from: "2026-04-01T00:00:00Z", effective_to: "2026-07-01T00:00:00Z", reason: "q2" }
              as: FinanceController
              captures: { f2: $.data.id, f2_status: $.data.status }
          assert:
            - "FreezeOrder.${f2}.status == ACTIVE"
            - "CostCenter.${cc1}.posture == FROZEN"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: ci_fill_then_vacate_conserves_committed_cost
        grounds:
          - state_machines.Position.VACANT_to_FILLED
          - state_machines.Position.FILLED_to_VACANT
          - calculations.committed_cost_cents
          - calculations.planned_cost_cents
        distinguishing_aspect: |
          Conserved quantity = CostCenter.committed_cost_cents (dollars). Fill swaps planned->actual
          (6000000 -> 7500000), vacate restores planned (->6000000). Net of fill+vacate leaves
          committed_cost_cents at the pre-fill value 6000000, zero drift.
        test_recipe:
          setup:
            - "P1 G07 fte 0.5 FUNDED VACANT on CC1: committed_cost_cents=6000000. E1 salary 150000_00."
          setup_api_calls:
            - call: "POST /grades"
              payload: { code: "G07", band_min_cents: 10000000, band_mid_cents: 12000000, band_max_cents: 15000000, rank: 7 }
              as: CompensationAnalyst
              captures: { g07: $.data.id }
            - call: "POST /cost-centers"
              payload: { name: "Eng", code: "CC1", annual_budget_cents: 100000000, fte_cap: 5.0 }
              as: FinanceController
              captures: { cc1: $.data.id, cc1_v0: $.data.version }
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g07}", title: "P1", fte: 0.5 }
              as: HRBP
              captures: { p1: $.data.id }
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "REQUISITION" }
              as: HRBP
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "FUND", expected_cost_center_version: "${cc1_v0}" }
              as: FinanceController
            - call: "POST /employees"
              payload: { full_name: "E One", email: "e1@x.com", annual_salary_cents: 15000000 }
              as: HRBP
              captures: { e1: $.data.id }
            - call: "POST /positions/${p1}/incumbents"
              payload: { employee_id: "${e1}", start_date: "2026-01-01" }
              as: HRBP
              captures: { inc1: $.data.id }
          trigger:
            - call: "POST /incumbents/${inc1}/vacate"
              payload: { vacate_date: "2026-06-30" }
              as: HRBP
          assert:
            - "CostCenter.${cc1}.committed_cost_cents == 6000000"
            - "Position.${p1}.actual_cost_cents == 0"
            - "Employee.${e1}.status == AVAILABLE"

      - name: ci_freeze_then_lift_conserves_committed_fte
        grounds:
          - state_machines.FreezeOrder.ACTIVE_to_LIFTED
          - state_machines.Position.FUNDED_to_FROZEN
          - state_machines.Position.FROZEN_to_FUNDED
          - calculations.committed_fte
        distinguishing_aspect: |
          Conserved quantity = CostCenter.committed_fte (headcount FTE, a different conserved type than
          dollars). FUNDED contributes 0.5; freeze moves the position FUNDED->FROZEN (still counted);
          lift restores FROZEN->FUNDED. committed_fte stays 0.5 across the freeze+lift cycle, zero drift.
        test_recipe:
          setup:
            - "Clock 2026-02-01. P1 G07 fte 0.5 FUNDED on CC1: committed_fte=0.5."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: FinanceController
            - call: "POST /grades"
              payload: { code: "G07", band_min_cents: 10000000, band_mid_cents: 12000000, band_max_cents: 15000000, rank: 7 }
              as: CompensationAnalyst
              captures: { g07: $.data.id }
            - call: "POST /cost-centers"
              payload: { name: "Eng", code: "CC1", annual_budget_cents: 100000000, fte_cap: 5.0 }
              as: FinanceController
              captures: { cc1: $.data.id, cc1_v0: $.data.version }
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g07}", title: "P1", fte: 0.5 }
              as: HRBP
              captures: { p1: $.data.id }
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "REQUISITION" }
              as: HRBP
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "FUND", expected_cost_center_version: "${cc1_v0}" }
              as: FinanceController
            - call: "POST /cost-centers/${cc1}/freeze-orders"
              payload: { effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-04-01T00:00:00Z", reason: "freeze" }
              as: FinanceController
              captures: { f1: $.data.id }
          trigger:
            - call: "POST /freeze-orders/${f1}/lift"
              payload: {}
              as: FinanceController
          assert:
            - "Position.${p1}.lifecycle_status == FUNDED"
            - "CostCenter.${cc1}.committed_fte == 0.5"
            - "CostCenter.${cc1}.posture == OPEN"
