              captures: { class_ok_status: $.data.status }
          assert:
            - "escrow_role_error == \"ERR_ROLE_NOT_PERMITTED\" with response http status == 403"
            - "offering_role_error == \"ERR_ROLE_NOT_PERMITTED\" with response http status == 403"
            - "bd_role_error == \"ERR_ROLE_NOT_PERMITTED\" with response http status == 403"
            - "board_role_error == \"ERR_ROLE_NOT_PERMITTED\" with response http status == 403"
            - "request_role_error == \"ERR_ROLE_NOT_PERMITTED\" with response http status == 403"
            - "class_status_role_error == \"ERR_ROLE_NOT_PERMITTED\" with response http status == 403"
            - "period_role_error == \"ERR_ROLE_NOT_PERMITTED\" with response http status == 403 (POST /repurchase-periods is shared by TransferAgent and SponsorOperator only)"
            - "escrow_owner_error == \"ERR_MINIMUM_OFFERING_NOT_MET\" with response http status == 422 (the owning role gets past the priority-2 gate and only then meets the fiscal rule, proving the earlier 403 was about the role and not about escrow_balance_cents == 0)"
            - "board_owner_error == \"ERR_INVALID_STATE_TRANSITION\" with response http status == 409 (the owning role reaches the priority-7 gate because escrow_status is still COLLECTING)"
            - "bd_ok_id is a stored BrokerDealer with response http status == 201"
            - "class_ok_status == \"CLOSED_TO_NEW\" with response http status == 200"
            - "Offering.${off_id}.escrow_status == \"COLLECTING\" and LiquidityEvent.${le_id}.status == \"PROPOSED\" (no refused call moved a row)"
            - "GET /offerings returns total_count == 1 and GET /broker-dealers returns total_count == 1"
            - "GET /repurchase-periods?offering_id=${off_id} returns total_count == 1 and GET /repurchase-requests?repurchase_period_id=${rp_id} returns total_count == 0"

      - name: shared_operations_span_their_roles_while_the_statement_stays_narrow
        claim_type: shared_operations
        grounds:
          - roles.SponsorOperator.shared_operations
          - roles.TransferAgent.shared_operations
          - roles.BrokerDealerRep.shared_operations
          - roles.ComplianceOfficer.shared_operations
          - endpoints[GET /investors/{investor_id}/statement]
        distinguishing_aspect: |
          POST /investors succeeds for all three of its sharing roles and is refused
          for ComplianceOfficer, while the statement — the single GET carved out of
          ComplianceOfficer's blanket read access — yields 403 for ComplianceOfficer
          by role and 403 for a non-owning InvestorUser by ownership.
        test_recipe:
          setup:
            - "Broker-dealer 'Ravensworth Securities' backs the acting BrokerDealerRep."
            - "No offering, class or subscription exists, so every statement is an all-zero derived read."
            - "The clock stays at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /broker-dealers"
              payload: { firm_name: "Ravensworth Securities", crd_number: "CRD-350003" }
              as: ComplianceOfficer
              captures: { bd_id: $.data.id }
          trigger:
            - call: "POST /investors"
              payload: { legal_name: "Vera Okonkwo", email: "vera.okonkwo@example.com", state_code: "TX", net_worth_cents: 5000000000, annual_income_cents: 1000000000 }
              as: SponsorOperator
              captures: { inv_a_id: $.data.id, inv_a_suitability: $.data.suitability_status, inv_a_account: $.data.account_status }
            - call: "POST /investors"
              payload: { legal_name: "Wim Delacroix", email: "wim.delacroix@example.com", state_code: "TX", net_worth_cents: 4000000000, annual_income_cents: 900000000 }
              as: TransferAgent
              captures: { inv_b_id: $.data.id }
            - call: "POST /investors"
              payload: { legal_name: "Xiulan Petrov", email: "xiulan.petrov@example.com", state_code: "TX", net_worth_cents: 3000000000, annual_income_cents: 800000000 }
              as: BrokerDealerRep
              as_user_id: "${bd_id}"
              captures: { inv_c_id: $.data.id }
            - call: "POST /investors"
              payload: { legal_name: "Compliance Cannot Open This", email: "nope.compliance@example.com", state_code: "TX", net_worth_cents: 1000000000, annual_income_cents: 500000000 }
              as: ComplianceOfficer
              captures: { investor_role_error: $.error.error_id }
            - call: "GET /investors/${inv_a_id}/statement"
              as: TransferAgent
              captures: { ta_shares: $.data.total_shares_e4, ta_lots: $.data.open_lot_count, ta_invested: $.data.cumulative_invested_cents, ta_value: $.data.estimated_value_cents }
            - call: "GET /investors/${inv_a_id}/statement"
              as: SponsorOperator
              captures: { so_shares: $.data.total_shares_e4 }
            - call: "GET /investors/${inv_a_id}/statement"
              as: InvestorUser
              as_user_id: "${inv_a_id}"
              captures: { own_shares: $.data.total_shares_e4, own_deduction: $.data.cumulative_early_repurchase_deduction_cents }
            - call: "GET /investors/${inv_a_id}/statement"
              as: ComplianceOfficer
              captures: { co_statement_error: $.error.error_id }
            - call: "GET /investors/${inv_a_id}/statement"
              as: InvestorUser
              as_user_id: "${inv_b_id}"
              captures: { other_statement_error: $.error.error_id }
            - call: "GET /investors"
              as: ComplianceOfficer
            - call: "GET /investors/${inv_a_id}"
              as: ComplianceOfficer
              captures: { co_investor_read: $.data.id }
          assert:
            - "inv_a_suitability == \"INCOMPLETE\" and inv_a_account == \"ACTIVE\" with response http status == 201"
            - "inv_b_id and inv_c_id are stored Investors, each created with response http status == 201 by TransferAgent and by the BrokerDealerRep of ${bd_id}"
            - "investor_role_error == \"ERR_ROLE_NOT_PERMITTED\" with response http status == 403 (POST /investors is shared by exactly three roles and ComplianceOfficer is not one of them)"
            - "ta_shares == 0 and ta_lots == 0 and ta_invested == 0 and ta_value == 0 with response http status == 200"
            - "so_shares == 0 with response http status == 200"
            - "own_shares == 0 and own_deduction == 0 with response http status == 200"
            - "co_statement_error == \"ERR_ROLE_NOT_PERMITTED\" with response http status == 403"
            - "other_statement_error == \"ERR_NOT_RESOURCE_OWNER\" with response http status == 403 (a declared role reaching the priority-5 ownership gate, not the priority-2 role gate)"
            - "GET /investors as ComplianceOfficer returns total_count == 3 with response http status == 200"
            - "co_investor_read == \"${inv_a_id}\" (only the statement is carved out of ComplianceOfficer's read access)"

      - name: the_nav_lifecycle_cannot_be_completed_by_any_single_role
        claim_type: segregation_of_duties
        grounds:
          - complexity_profile.role_model
          - roles.SponsorOperator.exclusive_operations
          - roles.IndependentValuationAdvisor.exclusive_operations
          - state_machines.NavRecord.status
        distinguishing_aspect: |
          Publishing one NAV record requires two different roles in a fixed order:
          the preparer is refused at ADVISOR_CONFIRMED and the confirmer is refused
          at both ADVISOR_REVIEW and PUBLISHED, so neither role can walk
          DRAFT to PUBLISHED alone.
        test_recipe:
          setup:
            - "Offering 'Silverdale Income REIT' at 1000 cents per share has one class I and no subscriptions, so shares_outstanding_e4 is 0."
            - "One DRAFT NAV record covers 2026-07-01 to 2026-07-31 with gross_asset_value_cents 5000000."
            - "The clock stays at 2026-08-01T00:00:00Z, so the valuation period has elapsed and no prior PUBLISHED record exists."
          setup_api_calls:
            - call: "POST /offerings"
              payload: { name: "Silverdale Income REIT", minimum_offering_amount_cents: 30000000, maximum_offering_amount_cents: 50000000000, escrow_deadline_date: "2026-12-31", initial_offering_price_cents: 1000 }
              as: SponsorOperator
              captures: { off_id: $.data.id }
            - call: "POST /share-classes"
              payload: { offering_id: "${off_id}", class_code: "I", upfront_selling_commission_bps: 0, dealer_manager_fee_bps: 0, annual_distribution_fee_bps: 0, distribution_fee_cap_bps: 0 }
              as: SponsorOperator
              captures: { sc_id: $.data.id, sc_v: $.data.version }
          trigger:
            - call: "POST /nav-records"
              payload: { share_class_id: "${sc_id}", period_start_date: "2026-07-01", period_end_date: "2026-07-31", gross_asset_value_cents: 5000000, other_liabilities_cents: 0, expected_share_class_version: "${sc_v}" }
              as: ComplianceOfficer
              captures: { create_role_error: $.error.error_id }
            - call: "POST /nav-records"
              payload: { share_class_id: "${sc_id}", period_start_date: "2026-07-01", period_end_date: "2026-07-31", gross_asset_value_cents: 5000000, other_liabilities_cents: 0, expected_share_class_version: "${sc_v}" }
              as: SponsorOperator
              captures: { nav_id: $.data.id, nav_status: $.data.status, nav_price: $.data.nav_per_share_cents, nav_variance: $.data.variance_bps }
            - call: "POST /nav-records/${nav_id}/status"
              payload: { to_status: "ADVISOR_CONFIRMED" }
              as: SponsorOperator
              captures: { preparer_confirm_error: $.error.error_id }
            - call: "POST /nav-records/${nav_id}/status"
              payload: { to_status: "ADVISOR_REVIEW" }
              as: IndependentValuationAdvisor
              captures: { advisor_submit_error: $.error.error_id }
            - call: "POST /nav-records/${nav_id}/status"
              payload: { to_status: "ADVISOR_REVIEW" }
              as: SponsorOperator
              captures: { review_status: $.data.status }
            - call: "POST /nav-records/${nav_id}/status"
              payload: { to_status: "PUBLISHED" }
              as: IndependentValuationAdvisor
              captures: { advisor_publish_error: $.error.error_id }
            - call: "POST /nav-records/${nav_id}/status"
              payload: { to_status: "ADVISOR_CONFIRMED" }
              as: IndependentValuationAdvisor
              captures: { confirmed_status: $.data.status }
            - call: "POST /nav-records/${nav_id}/status"
              payload: { to_status: "PUBLISHED" }
              as: SponsorOperator
              captures: { published_status: $.data.status }
          assert:
            - "create_role_error == \"ERR_ROLE_NOT_PERMITTED\" with response http status == 403 and GET /nav-records?share_class_id=${sc_id} then returns total_count == 0"
            - "nav_status == \"DRAFT\" with response http status == 201"
            - "nav_price == 1000 (the class holds no shares, so the zero-shares fallback uses initial_offering_price_cents) and nav_variance == 0 (no prior PUBLISHED record)"
            - "preparer_confirm_error == \"ERR_ROLE_NOT_PERMITTED\" with response http status == 403 (the priority-2 role gate answers before the priority-7 transition gate that would also refuse DRAFT to ADVISOR_CONFIRMED)"
            - "advisor_submit_error == \"ERR_ROLE_NOT_PERMITTED\" with response http status == 403"
            - "review_status == \"ADVISOR_REVIEW\" with response http status == 200"
            - "advisor_publish_error == \"ERR_ROLE_NOT_PERMITTED\" with response http status == 403"
            - "confirmed_status == \"ADVISOR_CONFIRMED\" with response http status == 200 (variance_bps 0 does not exceed 500, so no advisor_opinion_reference was needed)"
            - "published_status == \"PUBLISHED\" with response http status == 200"
            - "Offering.${off_id}.aggregate_nav_cents == 0 (publishing a price for an empty class moves no money)"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: a_stale_share_class_version_creates_no_nav_row_and_the_counter_only_moves_on_writes
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.nav-create-stale-share-class
          - errors[ERR_STALE_SHARE_CLASS_VERSION]
          - endpoints[POST /nav-records]
          - entities.ShareClass.fields.version
        distinguishing_aspect: |
          The ShareClass version observed before the June NAV is exactly one less
          than the version the July NAV must echo, and replaying the earlier value
          returns ERR_STALE_SHARE_CLASS_VERSION while leaving the NAV collection at
          one row and the version at 2.
        test_recipe:
          setup:
            - "Offering 'Thornsett Income REIT' at 1000 cents per share has one class I and no subscriptions, so every NAV prices off the zero-shares fallback."
            - "The class is freshly created, so its version is 1."
            - "The clock stays at 2026-08-01T00:00:00Z, so both the June and July valuation periods have elapsed."
          setup_api_calls:
            - call: "POST /offerings"
              payload: { name: "Thornsett Income REIT", minimum_offering_amount_cents: 30000000, maximum_offering_amount_cents: 50000000000, escrow_deadline_date: "2026-12-31", initial_offering_price_cents: 1000 }
              as: SponsorOperator
              captures: { off_id: $.data.id }
            - call: "POST /share-classes"
              payload: { offering_id: "${off_id}", class_code: "I", upfront_selling_commission_bps: 0, dealer_manager_fee_bps: 0, annual_distribution_fee_bps: 0, distribution_fee_cap_bps: 0 }
              as: SponsorOperator
              captures: { sc_id: $.data.id, sc_v1: $.data.version }
          trigger:
            - call: "POST /nav-records"
              payload: { share_class_id: "${sc_id}", period_start_date: "2026-06-01", period_end_date: "2026-06-30", gross_asset_value_cents: 4000000, other_liabilities_cents: 0, expected_share_class_version: "${sc_v1}" }
              as: SponsorOperator
              captures: { nav_june_id: $.data.id, nav_june_status: $.data.status }
            - call: "GET /share-classes/${sc_id}"
              as: SponsorOperator
              captures: { sc_v2: $.data.version }
            - call: "POST /nav-records"
              payload: { share_class_id: "${sc_id}", period_start_date: "2026-07-01", period_end_date: "2026-07-31", gross_asset_value_cents: 4100000, other_liabilities_cents: 0, expected_share_class_version: "${sc_v2} - 1" }
              as: SponsorOperator
              captures: { stale_error: $.error.error_id }
            - call: "GET /share-classes/${sc_id}"
              as: SponsorOperator
              captures: { sc_v_after_stale: $.data.version }
            - call: "POST /nav-records"
              payload: { share_class_id: "${sc_id}", period_start_date: "2026-07-01", period_end_date: "2026-07-31", gross_asset_value_cents: 4100000, other_liabilities_cents: 0, expected_share_class_version: "${sc_v2}" }
              as: SponsorOperator
              captures: { nav_july_id: $.data.id, nav_july_status: $.data.status }
            - call: "GET /share-classes/${sc_id}"
              as: SponsorOperator
              captures: { sc_v3: $.data.version }
            - call: "GET /nav-records/${nav_june_id}"
              as: SponsorOperator
              captures: { june_still: $.data.status, june_gav: $.data.gross_asset_value_cents }
          assert:
            - "sc_v1 == 1 and nav_june_status == \"DRAFT\" with response http status == 201"
            - "sc_v2 == 2 (creating a NavRecord incremented the parent ShareClass.version)"
            - "stale_error == \"ERR_STALE_SHARE_CLASS_VERSION\" with response http status == 412"
            - "sc_v_after_stale == 2 (a refused write does not advance the counter)"
            - "GET /nav-records?share_class_id=${sc_id} immediately after the refusal returns total_count == 1"
            - "nav_july_status == \"DRAFT\" with response http status == 201 once the current version is echoed"
            - "sc_v3 == 3"
            - "june_still == \"DRAFT\" and june_gav == 4000000 (the July write did not touch the June row)"
            - "GET /nav-records?share_class_id=${sc_id} returns total_count == 2"

      - name: the_quarterly_leg_takes_over_from_the_monthly_leg_in_the_third_month
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.repurchase_capacity
          - entities.RepurchasePeriod.fields.quarterly_remaining_cents
          - entities.RepurchasePeriod.fields.quarter_key
          - endpoints[POST /repurchase-periods/{repurchase_period_id}/processing]
        distinguishing_aspect: |
          Across 2026-07, 2026-08 and 2026-09 the monthly 200 bps leg binds at
          2000000 then 1960000 cents, and in the third month the quarterly leg —
          recomputed as 500 bps of the shrunken 96040000-cent aggregate minus the
          3960000 already settled — binds instead at 842000 cents.
        test_recipe:
          setup:
            - "Offering 'Underbrook Income REIT' at 1000 cents per share carries one zero-load class I."
            - "At 2026-07-01 escrow breaks on Yara Nordstrom's 100000000-cent subscription, minting a 1000000000 e4 lot; a June NAV of 100000000 cents gross asset value is published, holding the price at 1000 cents and the aggregate at 100000000 cents."
            - "Three periods all sit in 2026-Q3: 2026-07 (2026-07-01T00:00:00Z to 2026-07-10T00:00:00Z, settling 2026-07-12), 2026-08 (2026-08-01T00:00:00Z to 2026-08-10T00:00:00Z, settling 2026-08-12) and 2026-09 (2026-09-01T00:00:00Z to 2026-09-10T00:00:00Z, settling 2026-09-12), each opening well past the prior settlement plus the 5-day buffer."
            - "Yara tenders 100000000 e4 (10000000 cents at the 1000-cent price) into every period, so the cap always binds and never the request."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: SponsorOperator
            - call: "POST /offerings"
              payload: { name: "Underbrook Income REIT", minimum_offering_amount_cents: 30000000, maximum_offering_amount_cents: 50000000000, escrow_deadline_date: "2026-12-31", initial_offering_price_cents: 1000 }
              as: SponsorOperator
              captures: { off_id: $.data.id }
            - call: "POST /share-classes"
              payload: { offering_id: "${off_id}", class_code: "I", upfront_selling_commission_bps: 0, dealer_manager_fee_bps: 0, annual_distribution_fee_bps: 0, distribution_fee_cap_bps: 0 }
              as: SponsorOperator
              captures: { sc_id: $.data.id }
            - call: "POST /broker-dealers"
              payload: { firm_name: "Underbrook Placement", crd_number: "CRD-360001" }
              as: ComplianceOfficer
              captures: { bd_id: $.data.id }
            - call: "POST /offerings/${off_id}/registration"
              payload: { action: "DECLARE_EFFECTIVE" }
              as: ComplianceOfficer
            - call: "POST /selling-agreements"
              payload: { offering_id: "${off_id}", broker_dealer_id: "${bd_id}", max_commission_bps: 100 }
              as: ComplianceOfficer
              captures: { sa_id: $.data.id }
            - call: "POST /selling-agreements/${sa_id}/status"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /investors"
              payload: { legal_name: "Yara Nordstrom", email: "yara.nordstrom@example.com", state_code: "TX", net_worth_cents: 5000000000, annual_income_cents: 2000000000 }
              as: SponsorOperator
              captures: { inv_id: $.data.id }
            - call: "POST /investors/${inv_id}/suitability-documentation"
              payload: { documentation_reference: "SUIT-YARA-2026-07" }
              as: ComplianceOfficer
            - call: "POST /subscriptions"
              payload: { offering_id: "${off_id}", share_class_id: "${sc_id}", investor_id: "${inv_id}", selling_agreement_id: "${sa_id}", gross_investment_cents: 100000000 }
              as: SponsorOperator
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/status"
              payload: { to_status: "ESCROWED" }
              as: TransferAgent
            - call: "POST /offerings/${off_id}/escrow"
              payload: { action: "BREAK" }
              as: ComplianceOfficer
            - call: "GET /share-classes/${sc_id}"
              as: SponsorOperator
              captures: { sc_v: $.data.version, sc_shares: $.data.shares_outstanding_e4 }
            - call: "POST /nav-records"
              payload: { share_class_id: "${sc_id}", period_start_date: "2026-06-01", period_end_date: "2026-06-30", gross_asset_value_cents: 100000000, other_liabilities_cents: 0, expected_share_class_version: "${sc_v}" }
              as: SponsorOperator
              captures: { nav_id: $.data.id, nav_price: $.data.nav_per_share_cents }
            - call: "POST /nav-records/${nav_id}/status"
              payload: { to_status: "ADVISOR_REVIEW" }
              as: SponsorOperator
            - call: "POST /nav-records/${nav_id}/status"
              payload: { to_status: "ADVISOR_CONFIRMED" }
              as: IndependentValuationAdvisor
            - call: "POST /nav-records/${nav_id}/status"
              payload: { to_status: "PUBLISHED" }
              as: SponsorOperator
          trigger:
            - call: "POST /repurchase-periods"
              payload: { offering_id: "${off_id}", period_month: "2026-07", opens_at: "2026-07-01T00:00:00Z", request_cutoff_at: "2026-07-10T00:00:00Z", settlement_date: "2026-07-12" }
              as: TransferAgent
              captures: { p1_id: $.data.id, p1_quarter: $.data.quarter_key }
            - call: "POST /repurchase-requests"
              payload: { repurchase_period_id: "${p1_id}", share_class_id: "${sc_id}", shares_requested_e4: 100000000 }
              as: InvestorUser
              as_user_id: "${inv_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: TransferAgent
            - call: "POST /repurchase-periods/${p1_id}/processing"
              as: TransferAgent
              captures: { p1_monthly: $.data.monthly_cap_cents, p1_quarterly: $.data.quarterly_remaining_cents, p1_capacity: $.data.capacity_cents, p1_settled: $.data.settled_amount_cents, p1_prorated: $.data.prorated }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TransferAgent
            - call: "POST /repurchase-periods"
              payload: { offering_id: "${off_id}", period_month: "2026-08", opens_at: "2026-08-01T00:00:00Z", request_cutoff_at: "2026-08-10T00:00:00Z", settlement_date: "2026-08-12" }
              as: TransferAgent
              captures: { p2_id: $.data.id, p2_quarter: $.data.quarter_key }
            - call: "POST /repurchase-requests"
              payload: { repurchase_period_id: "${p2_id}", share_class_id: "${sc_id}", shares_requested_e4: 100000000 }
              as: InvestorUser
              as_user_id: "${inv_id}"
              captures: { r2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: TransferAgent
            - call: "POST /repurchase-periods/${p2_id}/processing"
              as: TransferAgent
              captures: { p2_monthly: $.data.monthly_cap_cents, p2_quarterly: $.data.quarterly_remaining_cents, p2_capacity: $.data.capacity_cents, p2_settled: $.data.settled_amount_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: TransferAgent
            - call: "POST /repurchase-periods"
              payload: { offering_id: "${off_id}", period_month: "2026-09", opens_at: "2026-09-01T00:00:00Z", request_cutoff_at: "2026-09-10T00:00:00Z", settlement_date: "2026-09-12" }
              as: TransferAgent
              captures: { p3_id: $.data.id, p3_quarter: $.data.quarter_key }
            - call: "POST /repurchase-requests"
              payload: { repurchase_period_id: "${p3_id}", share_class_id: "${sc_id}", shares_requested_e4: 100000000 }
              as: InvestorUser
              as_user_id: "${inv_id}"
              captures: { r3_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: TransferAgent
            - call: "POST /repurchase-periods/${p3_id}/processing"
              as: TransferAgent
              captures: { p3_monthly: $.data.monthly_cap_cents, p3_quarterly: $.data.quarterly_remaining_cents, p3_capacity: $.data.capacity_cents, p3_settled: $.data.settled_amount_cents }
            - call: "GET /investors/${inv_id}/statement"
              as: TransferAgent
              captures: { st_shares: $.data.total_shares_e4, st_deduction: $.data.cumulative_early_repurchase_deduction_cents, st_value: $.data.estimated_value_cents }
          assert:
            - "sc_shares == 1000000000 and nav_price == 1000 (round_half_up(100000000 * 10000 / 1000000000))"
            - "p1_quarter == \"2026-Q3\" and p2_quarter == \"2026-Q3\" and p3_quarter == \"2026-Q3\""
            - "p1_monthly == 2000000, p1_quarterly == 5000000, p1_capacity == 2000000 and p1_settled == 2000000 with p1_prorated == true"
            - "RepurchaseRequest.${r1_id}.status == \"PARTIALLY_FULFILLED\" with approved_value_cents == 2000000, approved_shares_e4 == 20000000, early_repurchase_deduction_cents == 40000 and net_proceeds_cents == 1960000"
            - "p2_monthly == 1960000 (200 bps of the 98000000-cent aggregate left after month one), p2_quarterly == 2900000 (500 bps of 98000000 minus the 2000000 already settled), p2_capacity == 1960000 and p2_settled == 1960000"
            - "RepurchaseRequest.${r2_id}.approved_shares_e4 == 19600000 with early_repurchase_deduction_cents == 39200 and net_proceeds_cents == 1920800"
            - "p3_monthly == 1920800 (200 bps of 96040000) and p3_quarterly == 842000 (500 bps of 96040000 is 4802000, minus the 3960000 settled in 2026-07 and 2026-08)"
            - "p3_capacity == 842000 and p3_settled == 842000 (the quarterly leg binds because it is the smaller of the two)"
            - "RepurchaseRequest.${r3_id}.approved_value_cents == 842000, approved_shares_e4 == 8420000, early_repurchase_deduction_cents == 16840 and net_proceeds_cents == 825160"
            - "st_shares == 951980000 (1000000000 less 20000000, 19600000 and 8420000) and st_deduction == 96040 and st_value == 95198000"
            - "Offering.${off_id}.aggregate_nav_cents == 95198000"

      - name: a_stale_offering_version_blocks_a_declaration
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.declaration-create-stale-offering
          - errors[ERR_STALE_OFFERING_VERSION]
        excluded_because:
          difficulty_instance: stale_offering_version_outranks_uncovered_distribution_gate
          rationale: |
            The §1.8 instance already replays a stale expected_offering_version
            against POST /distribution-declarations, shows the 412 outranking the
            uncovered-distribution gate, and then succeeds with the current
            version, which is the whole of this layer's claim for that rule.

      - name: one_supervision_action_cascades_through_three_levels
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.BrokerDealer.supervision_status
          - state_machines.SellingAgreement.status
        excluded_because:
          difficulty_instance: broker_dealer_barred_cascades_agreements_then_pending_subscriptions
          rationale: |
            The §1.8 instance already verifies the end-to-end chain from one BAR
            action through every agreement of the firm down to their PENDING
            subscriptions, including the ordering sensitivity and the rows that
            must be left alone.

      - name: both_coverage_variants_run_on_one_declaration
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.distribution_declaration_total_and_coverage.variants
        excluded_because:
          difficulty_instance: distribution_coverage_gaap_basis_vs_cash_flow_basis
          rationale: |
            The §1.8 instance already computes both coverage variants from one
            dataset, asserts the delta between the two return-of-capital figures
            and shows that only the cash-flow variant gates the acknowledgement.

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: the_escrow_break_response_already_shows_every_cascaded_total
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Offering.escrow_status.COLLECTING_to_BROKEN
          - entities.Offering.fields.escrow_balance_cents
          - entities.Offering.fields.gross_proceeds_cents
        distinguishing_aspect: |
          The escrow-break response body itself already carries escrow_balance_cents
          0, gross_proceeds_cents 30250000 and aggregate_nav_cents 30250000, and the
          minted lots, the accepted subscriptions and both investors' totals are
          readable on the very next call with no settling delay.
        test_recipe:
          setup:
            - "Offering 'Veylancourt Income REIT' at 1000 cents per share is EFFECTIVE with one zero-load class I and a 30000000-cent minimum."
            - "Zaid Okafor has escrowed 30000000 cents and Aoife Ledger 250000 cents, so escrow_balance_cents reads 30250000 and gross_proceeds_cents reads 0 immediately before the break."
            - "The clock stays at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /offerings"
              payload: { name: "Veylancourt Income REIT", minimum_offering_amount_cents: 30000000, maximum_offering_amount_cents: 50000000000, escrow_deadline_date: "2026-12-31", initial_offering_price_cents: 1000 }
              as: SponsorOperator
              captures: { off_id: $.data.id }
            - call: "POST /share-classes"
              payload: { offering_id: "${off_id}", class_code: "I", upfront_selling_commission_bps: 0, dealer_manager_fee_bps: 0, annual_distribution_fee_bps: 0, distribution_fee_cap_bps: 0 }
              as: SponsorOperator
              captures: { sc_id: $.data.id }
            - call: "POST /broker-dealers"
              payload: { firm_name: "Veylancourt Placement", crd_number: "CRD-370001" }
              as: ComplianceOfficer
              captures: { bd_id: $.data.id }
            - call: "POST /offerings/${off_id}/registration"
              payload: { action: "DECLARE_EFFECTIVE" }
              as: ComplianceOfficer
            - call: "POST /selling-agreements"
              payload: { offering_id: "${off_id}", broker_dealer_id: "${bd_id}", max_commission_bps: 100 }
              as: ComplianceOfficer
              captures: { sa_id: $.data.id }
            - call: "POST /selling-agreements/${sa_id}/status"
