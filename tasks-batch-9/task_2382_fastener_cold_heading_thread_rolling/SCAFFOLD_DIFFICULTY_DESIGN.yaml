  - rule_id: non_linear_state_machine
    instances:
      - name: heading_tool_regrind_cycle_revisits_then_branches_to_scrapped
        grounds:
          - state_machines.HeadingTool.status
          - entities.HeadingTool.fields.max_regrinds
          - entities.HeadingTool.fields.regrind_count
          - entities.HeadingTool.fields.completed_cycle_count
          - calculations.tool_effective_life
          - errors[ERR_INVALID_TOOL_STATE]
        distinguishing_aspect: |
          The tool visits MOUNTED and WORN twice on the same identity, and the identical regrind
          trigger resolves to two different targets: AVAILABLE while regrind_count < max_regrinds and
          the terminal SCRAPPED once regrind_count == max_regrinds, after which mount is refused.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T06:00:00Z."
            - "One heading tool DIE-2S-009 with rated_life_pieces 6000 and max_regrinds 1, freshly registered in status AVAILABLE with regrind_count 0 and completed_cycle_count 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T06:00:00Z" }
              as: ProcessEngineer
            - call: "POST /heading-tools"
              payload: { tool_code: "DIE-2S-009", station_count: 2, rated_life_pieces: 6000, max_regrinds: 1 }
              as: ProcessEngineer
              captures: { tool_id: $.data.id }
          trigger:
            - call: "POST /heading-tools/${tool_id}/mount"
              payload: { press_code: "PRESS-1" }
              as: ProcessEngineer
            - call: "POST /heading-tools/${tool_id}/condemn"
              payload: { reason: "CRACKED_PUNCH" }
              as: ProcessEngineer
            - call: "POST /heading-tools/${tool_id}/regrind"
              payload: {}
              as: ProcessEngineer
            - call: "POST /heading-tools/${tool_id}/mount"
              payload: { press_code: "PRESS-1" }
              as: ProcessEngineer
            - call: "POST /heading-tools/${tool_id}/condemn"
              payload: { reason: "CHIPPED_DIE" }
              as: ProcessEngineer
            - call: "POST /heading-tools/${tool_id}/regrind"
              payload: {}
              as: ProcessEngineer
            - call: "POST /heading-tools/${tool_id}/mount"
              payload: { press_code: "PRESS-1" }
              as: ProcessEngineer
          assert:
            - "After the first regrind: HeadingTool.${tool_id}.status == AVAILABLE, regrind_count == 1, completed_cycle_count == 1, cycle_pieces_history == [0], rated_derated_life_pieces == 5100"
            - "After the second condemn: HeadingTool.${tool_id}.status == WORN and condemn_reason == CHIPPED_DIE"
            - "After the second regrind: HeadingTool.${tool_id}.status == SCRAPPED, regrind_count == 1, completed_cycle_count == 2, cycle_pieces_history == [0, 0]"
            - "The final mount returns 409 with error_id ERR_INVALID_TOOL_STATE"

