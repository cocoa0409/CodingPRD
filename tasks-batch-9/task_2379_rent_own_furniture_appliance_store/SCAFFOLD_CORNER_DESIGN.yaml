          assert:
            - "the first create returns 422 ERR_DISCLOSURE_NOT_ACKNOWLEDGED"
            - "the second create returns 422 ERR_TERM_EXCEEDS_STATE_CAP (79 exceeds the TX max_term_renewals of 78)"
            - "after both rejections InventoryUnit.${unit_tx_id}.status is still AVAILABLE and GET /agreements?customer_id=${cust_id} would report total_count == 0"
            - "the third create returns 201 with renewal_count == 78, adjusted_cash_price_cents == 120000, renewal_rate_cents == 3385, rent_subtotal_cents == 264030, processing_fee_cents == 5000, total_of_payments_cents == 269030, monthly_equivalent_rate_cents == 14668"
