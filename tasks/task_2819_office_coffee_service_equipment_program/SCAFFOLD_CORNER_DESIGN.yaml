              payload: { delivered_lines: [{ product_id: "${p_cof_id}", delivered_units: 21 }] }
              as: RouteTechnician
              as_user_id: "${route_id}"
              captures: { err_over: "$.data.error_id" }
            - call: "POST /ocs/service-visits/${visit_id}/complete"
              payload: { delivered_lines: [{ product_id: "${p_cof_id}", delivered_units: 20 }, { product_id: "${p_tea_id}", delivered_units: 1 }] }
