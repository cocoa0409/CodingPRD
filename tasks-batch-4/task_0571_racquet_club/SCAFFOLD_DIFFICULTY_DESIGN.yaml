  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: overlap_court_halfopen_adjacency_allowed
        grounds:
          - validations[priority=8]
          - errors[ERR_COURT_TIME_CONFLICT]
          - entities.Reservation.fields.start_time
          - entities.Reservation.fields.end_time
        distinguishing_aspect: |
          Court intervals are half-open [start,end): an adjacent booking (end==next start, gap 0)
          succeeds, while a true overlap [10:30,11:30) against [10:00,11:00) is rejected with
          ERR_COURT_TIME_CONFLICT.
        test_recipe:
          setup:
            - "PREMIER member with ACTIVE subscription holding one BOOKED reservation R1 [10:00,11:00) on a court."
          setup_api_calls:
            - call: "POST /racquet/membership-plans"
              payload: { name: "Premier", tier: "PREMIER", monthly_fee_cents: 5000, monthly_court_credits: 8, peak_access: true, guest_fee_cents: 1500, freeze_limit: 2 }
              as: FrontDesk
              captures: { plan_id: "$.data.id" }
            - call: "POST /racquet/courts"
              payload: { name: "Indoor 1", surface: "HARD", location_type: "INDOOR", hourly_rate_cents: 4000, has_ball_machine: false, ball_machine_fee_cents: 0 }
              as: FrontDesk
              captures: { court_id: "$.data.id" }
            - call: "POST /racquet/members"
              payload: { full_name: "Ov Court", email: "ov@x.com" }
              as: FrontDesk
              captures: { member_id: "$.data.id" }
            - call: "POST /racquet/subscriptions"
              payload: { member_id: "${member_id}", plan_id: "${plan_id}" }
              as: FrontDesk
              captures: { sub_id: "$.data.id" }
            - call: "POST /racquet/reservations"
              payload: { court_id: "${court_id}", member_id: "${member_id}", start_time: "2026-05-10T10:00:00Z", end_time: "2026-05-10T11:00:00Z" }
              as: FrontDesk
              captures: { r1_id: "$.data.id" }
          trigger:
            - call: "POST /racquet/reservations"
              payload: { court_id: "${court_id}", member_id: "${member_id}", start_time: "2026-05-10T11:00:00Z", end_time: "2026-05-10T12:00:00Z" }
              as: FrontDesk
              captures: { r2_id: "$.data.id" }
            - call: "POST /racquet/reservations"
              payload: { court_id: "${court_id}", member_id: "${member_id}", start_time: "2026-05-10T10:30:00Z", end_time: "2026-05-10T11:30:00Z" }
              as: FrontDesk
              captures: { err: "$.data.error_id" }
          assert:
            - "Reservation.${r2_id}.status == BOOKED"
            - "response.data.error_id == ERR_COURT_TIME_CONFLICT"

      - name: overlap_pro_buffer_gap_enforced
        grounds:
          - validations[priority=8]
          - errors[ERR_PRO_TIME_CONFLICT]
          - entities.Lesson.fields.start_time
          - entities.Lesson.fields.end_time
        distinguishing_aspect: |
          Pro scheduling uses a buffered interval: a lesson starting exactly at a prior lesson's end
          (gap 0 < PRO_BUFFER_MINUTES 15) is rejected with ERR_PRO_TIME_CONFLICT, while a lesson with
          a 15-minute gap is allowed — different interval semantics than the court's pure half-open rule.
        test_recipe:
          setup:
            - "A pro with a SCHEDULED PRIVATE lesson L1 [10:00,11:00) on a court."
          setup_api_calls:
            - call: "POST /racquet/pros"
              payload: { full_name: "Coach Buf", hourly_rate_cents: 9000 }
              as: FrontDesk
              captures: { pro_id: "$.data.id" }
            - call: "POST /racquet/courts"
              payload: { name: "Indoor 1", surface: "HARD", location_type: "INDOOR", hourly_rate_cents: 4000, has_ball_machine: false, ball_machine_fee_cents: 0 }
              as: FrontDesk
              captures: { court_id: "$.data.id" }
            - call: "POST /racquet/courts"
              payload: { name: "Indoor 2", surface: "HARD", location_type: "INDOOR", hourly_rate_cents: 4000, has_ball_machine: false, ball_machine_fee_cents: 0 }
              as: FrontDesk
              captures: { court2_id: "$.data.id" }
            - call: "POST /racquet/lessons"
              payload: { pro_id: "${pro_id}", court_id: "${court_id}", kind: "PRIVATE", start_time: "2026-05-11T10:00:00Z", end_time: "2026-05-11T11:00:00Z", capacity: 1, price_cents: 5000 }
              as: FrontDesk
              captures: { l1_id: "$.data.id" }
          trigger:
            - call: "POST /racquet/lessons"
              payload: { pro_id: "${pro_id}", court_id: "${court2_id}", kind: "PRIVATE", start_time: "2026-05-11T11:00:00Z", end_time: "2026-05-11T11:30:00Z", capacity: 1, price_cents: 5000 }
              as: FrontDesk
              captures: { err: "$.data.error_id" }
            - call: "POST /racquet/lessons"
              payload: { pro_id: "${pro_id}", court_id: "${court2_id}", kind: "PRIVATE", start_time: "2026-05-11T11:15:00Z", end_time: "2026-05-11T12:00:00Z", capacity: 1, price_cents: 5000 }
              as: FrontDesk
              captures: { l3_id: "$.data.id" }
          assert:
            - "response.data.error_id == ERR_PRO_TIME_CONFLICT"
            - "Lesson.${l3_id}.status == SCHEDULED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: invariant_court_credits_conserved_on_book_then_cancel
        grounds:
          - calculations.subscription_court_credits
          - state_machines.Reservation.BOOKED_to_CANCELLED
          - entities.Subscription.fields.court_credits_remaining
        distinguishing_aspect: |
          Conserved quantity court_credits_remaining: booking a 1-hour credit reservation deducts 1
          (8->7) and cancelling restores exactly 1 (7->8); the pinned formula
          court_credits_remaining == monthly_court_credits - sum(credits_used of non-cancelled reservations)
          holds, leaving 8 unchanged.
        test_recipe:
          setup:
            - "PREMIER plan (8 credits), a court, a member with ACTIVE subscription (8 credits)."
          setup_api_calls:
            - call: "POST /racquet/membership-plans"
              payload: { name: "Premier", tier: "PREMIER", monthly_fee_cents: 5000, monthly_court_credits: 8, peak_access: true, guest_fee_cents: 1500, freeze_limit: 2 }
              as: FrontDesk
              captures: { plan_id: "$.data.id" }
            - call: "POST /racquet/courts"
              payload: { name: "Indoor 1", surface: "HARD", location_type: "INDOOR", hourly_rate_cents: 4000, has_ball_machine: false, ball_machine_fee_cents: 0 }
              as: FrontDesk
              captures: { court_id: "$.data.id" }
            - call: "POST /racquet/members"
              payload: { full_name: "Pat Credit", email: "pat@x.com" }
              as: FrontDesk
              captures: { member_id: "$.data.id" }
            - call: "POST /racquet/subscriptions"
              payload: { member_id: "${member_id}", plan_id: "${plan_id}" }
              as: FrontDesk
              captures: { sub_id: "$.data.id" }
          trigger:
            - call: "POST /racquet/reservations"
              payload: { court_id: "${court_id}", member_id: "${member_id}", start_time: "2026-05-12T10:00:00Z", end_time: "2026-05-12T11:00:00Z" }
              as: FrontDesk
              captures: { res_id: "$.data.id" }
            - call: "POST /racquet/reservations/${res_id}/cancel"
              payload: {}
              as: FrontDesk
          assert:
            - "Reservation.${res_id}.credits_used == 1"
            - "Reservation.${res_id}.status == CANCELLED"
            - "Subscription.${sub_id}.court_credits_remaining == 8"

      - name: invariant_member_balance_conserved_on_book_then_cancel
        grounds:
          - calculations.member_account_balance
          - calculations.reservation_charge
          - state_machines.Reservation.BOOKED_to_CANCELLED
          - entities.Member.fields.account_balance_cents
        distinguishing_aspect: |
          Conserved quantity account_balance_cents (money): booking a guest+ball-machine reservation
          posts provisional_fee_cents 2500 (0->2500) and cancelling reverses exactly 2500 (2500->0);
          a monetary ledger, a different conserved-quantity type than court credits.
        test_recipe:
          setup:
            - "PREMIER plan (guest_fee 1500), a court with ball machine (fee 1000), a member with ACTIVE subscription and balance 0."
          setup_api_calls:
            - call: "POST /racquet/membership-plans"
              payload: { name: "Premier", tier: "PREMIER", monthly_fee_cents: 5000, monthly_court_credits: 8, peak_access: true, guest_fee_cents: 1500, freeze_limit: 2 }
              as: FrontDesk
              captures: { plan_id: "$.data.id" }
            - call: "POST /racquet/courts"
              payload: { name: "Indoor 1", surface: "HARD", location_type: "INDOOR", hourly_rate_cents: 4000, has_ball_machine: true, ball_machine_fee_cents: 1000 }
              as: FrontDesk
              captures: { court_id: "$.data.id" }
            - call: "POST /racquet/members"
              payload: { full_name: "Qi Money", email: "qi@x.com" }
              as: FrontDesk
              captures: { member_id: "$.data.id" }
            - call: "POST /racquet/subscriptions"
              payload: { member_id: "${member_id}", plan_id: "${plan_id}" }
              as: FrontDesk
              captures: { sub_id: "$.data.id" }
          trigger:
            - call: "POST /racquet/reservations"
              payload: { court_id: "${court_id}", member_id: "${member_id}", start_time: "2026-05-13T10:00:00Z", end_time: "2026-05-13T11:00:00Z", guest_count: 1, uses_ball_machine: true }
              as: FrontDesk
              captures: { res_id: "$.data.id" }
            - call: "POST /racquet/reservations/${res_id}/cancel"
              payload: {}
              as: FrontDesk
          assert:
            - "Reservation.${res_id}.provisional_fee_cents == 2500"
            - "Member.${member_id}.account_balance_cents == 0"
