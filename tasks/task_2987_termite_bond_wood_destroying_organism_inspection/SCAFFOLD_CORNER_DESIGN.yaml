      - name: underwriting_and_adjudication_seats_cannot_be_swapped_between_roles
        claim_type: segregation_of_duties
        grounds:
          - roles.BranchManager
          - roles.ClaimsAdjudicator
          - roles.ComplianceOfficer
          - errors[ERR_UNAUTHORIZED]
          - validations[priority=20]
        distinguishing_aspect: >-
          Role-level separation is checked at priority 20, BEFORE the path 404 at priority 40 — so a
          BranchManager adjudicating a claim id that does not even exist is told 403, not 404. That
          ordering is what distinguishes a genuine priority-ordered validation chain from a router
          that resolves the row first. This is the ROLE half of the separation; the user-id half
          (ERR_SEGREGATION_OF_DUTIES) is a different code on a different priority.
        test_recipe:
          setup:
            - "An empty system: no bonds and no claims are created, deliberately."
          setup_api_calls: []
          trigger:
            - call: "POST /damage-claims/00000000-0000-4000-8000-000000000011/adjudicate"
              payload: { decision: "DENY", denial_reason_code: "NO_ELIGIBLE_DAMAGE" }
              as: BranchManager
              captures: { e1: "$.data.error_id" }
            - call: "POST /bonds"
              payload: { property_id: "00000000-0000-4000-8000-000000000012", treatment_plan_id: "00000000-0000-4000-8000-000000000013", coverage_tier: "RETREAT_ONLY" }
              as: ClaimsAdjudicator
              captures: { e2: "$.data.error_id" }
            - call: "POST /bonds/00000000-0000-4000-8000-000000000014/term-review"
              payload: {}
              as: BranchManager
              captures: { e3: "$.data.error_id" }
            - call: "POST /bonds/00000000-0000-4000-8000-000000000014/reinstate"
              payload: { reinstatement_inspection_id: "00000000-0000-4000-8000-000000000015", amount_usd: 500.00 }
              as: ComplianceOfficer
              captures: { e4: "$.data.error_id" }
            - call: "POST /damage-claims/00000000-0000-4000-8000-000000000011/adjudicate"
              payload: { decision: "DENY", denial_reason_code: "NO_ELIGIBLE_DAMAGE" }
              as: ClaimsAdjudicator
              captures: { e5: "$.data.error_id" }
          assert:
            - "the BranchManager adjudication returns 403 ERR_UNAUTHORIZED even though the claim id is unknown — priority 20 outranks priority 40"
            - "the ClaimsAdjudicator issuing a bond returns 403 ERR_UNAUTHORIZED: underwriting is BranchManager-exclusive"
            - "term-review as BranchManager returns 403 (ComplianceOfficer-exclusive) and reinstate as ComplianceOfficer returns 403 (BranchManager-exclusive) — the two bond lifecycle seats are disjoint"
            - "the SAME adjudication by ClaimsAdjudicator now returns 404 ERR_DAMAGE_CLAIM_NOT_FOUND, proving the earlier 403 came from the role gate and not from the missing row"

