# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index (25 instances)
# Every chain starts from empty DB. Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------- rule 1 ---
  - rule_id: dual_variant_calc
    instances:
      - name: settlement_provisional_vs_final_divergence
        grounds:
          - calculations.settlement_totals
          - entities.TripSettlement.fields.provisional_crew_pool_cents
        distinguishing_aspect: |
          Dual-variant logic on the MONEY domain (TripSettlement): the provisional
          variant counts PENDING+VERIFIED expenses while the final variant counts
          VERIFIED only, so identical trip data yields crew pools of 307320 vs
          315200 cents depending on which variant runs.
        test_recipe:
          setup:
            - "PARTIAL vessel (no VMS unit), ACTIVE, HALIBUT permit, holding 10000 lbs, gear asset LONGLINE 4 units"
            - "opening HALIBUT/3A 2026-08-05..2026-08-25 tac 100000; trip 2026-08-10T06:00 -> 2026-08-12T06:00 (48h, no observer)"
            - "trip executed: catch HARVEST 4000, returned, declaration 4000 verified+finalized"
            - "expenses: FUEL 120000 VERIFIED, BAIT 30000 VERIFIED, OTHER 20000 still PENDING at settlement creation"
            - "gear LOSS 2 units on the trip; crew Alice 2pts / Bob 1pt both ACTIVE"
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-DV1", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 10000 }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/gear-assets", payload: { gear_type: "LONGLINE", units_total: 4 }, as: VesselOwner, as_user_id: "${v1}", captures: { g1: $.data.id } }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-10T06:00:00Z", planned_return_utc: "2026-08-12T06:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { t1: $.data.id } }
            - { call: "POST /fishing-trips/${t1}/depart", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/catch-reports", payload: { fishery_code: "HALIBUT", report_type: "HARVEST", reported_lbs: 4000, reported_at: "2026-08-11T06:00:00Z" }, as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/expenses", payload: { category: "FUEL", amount_cents: 120000, incurred_at: "2026-08-11T00:00:00Z" }, as: Captain, as_user_id: "${v1}", captures: { e1: $.data.id } }
            - { call: "POST /fishing-trips/${t1}/expenses", payload: { category: "BAIT", amount_cents: 30000, incurred_at: "2026-08-11T01:00:00Z" }, as: Captain, as_user_id: "${v1}", captures: { e2: $.data.id } }
            - { call: "POST /fishing-trips/${t1}/expenses", payload: { category: "OTHER", amount_cents: 20000, incurred_at: "2026-08-11T02:00:00Z" }, as: Captain, as_user_id: "${v1}", captures: { e3: $.data.id } }
            - { call: "POST /gear-assets/${g1}/events", payload: { event_type: "LOSS", units: 2, occurred_at: "2026-08-11T05:00:00Z", trip_id: "${t1}" }, as: Captain, as_user_id: "${v1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips/${t1}/return", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/landing-declarations", payload: { port_code: "HOMER", lines: [{ fishery_code: "HALIBUT", declared_lbs: 4000 }] }, as: Captain, as_user_id: "${v1}", captures: { ld1: $.data.id } }
            - { call: "POST /landing-declarations/${ld1}/submit", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /landing-declarations/${ld1}/verify", as: FisheriesRegulator }
            - { call: "POST /landing-declarations/${ld1}/finalize", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/crew-contracts", payload: { crew_name: "Alice", share_points: 2, joined_at: "2026-01-15T00:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { c1: $.data.id } }
            - { call: "POST /vessels/${v1}/crew-contracts", payload: { crew_name: "Bob", share_points: 1, joined_at: "2026-02-01T00:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { c2: $.data.id } }
            - { call: "POST /expenses/${e1}/verify", as: SettlementClerk }
            - { call: "POST /expenses/${e2}/verify", as: SettlementClerk }
            - { call: "POST /fishing-trips/${t1}/settlement", payload: { gross_revenue_cents: 1000000 }, as: SettlementClerk, captures: { s1: $.data.id, s1_prov_pool: $.data.provisional_crew_pool_cents, s1_prov_exp: $.data.provisional_total_expenses_cents } }
            - { call: "POST /expenses/${e3}/reject", as: SettlementClerk }
          trigger:
            - { call: "POST /trip-settlements/${s1}/calculate", as: SettlementClerk, captures: { s1_pool: $.data.crew_pool_cents, s1_exp: $.data.total_expenses_cents } }
          assert:
            - "TripSettlement.${s1}.provisional_crew_pool_cents == 307320"
            - "TripSettlement.${s1}.provisional_total_expenses_cents == 170000"
            - "TripSettlement.${s1}.crew_pool_cents == 315200"
            - "TripSettlement.${s1}.total_expenses_cents == 150000"
            - "crew_pool_cents - provisional_crew_pool_cents == 7880 — identical trip data, two variants, different results"

      - name: quota_committed_vs_conservative_divergence
        grounds:
          - calculations.available_quota
          - entities.QuotaShareHolding.fields.landed_pounds
        distinguishing_aspect: |
          Dual-variant logic on the QUOTA domain (QuotaShareHolding): with one open
          PROPOSED outgoing offer of 5000 lbs, committed availability is 20000 while
          conservative availability is 15000 — same holding, same instant, different
          numbers; a different entity domain (quota pounds) than the settlement variant.
        test_recipe:
          setup:
            - "vessels V1 (holding HALIBUT/2026 = 20000) and V2 (holding 5000), both ACTIVE with HALIBUT permits"
            - "one PROPOSED transfer V1 -> V2 of 5000 lbs (never accepted)"
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-DV2A", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 20000 }, as: FisheriesRegulator, captures: { h1: $.data.id } }
            - { call: "POST /vessels", payload: { vessel_name: "FV Bristol", license_number: "LIC-DV2B", home_port: "KODIAK", length_ft: 42, observer_coverage_class: "EXEMPT" }, as: FisheriesRegulator, captures: { v2: $.data.id } }
            - { call: "POST /vessels/${v2}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v2}/permits", payload: { fishery_code: "HALIBUT", gear_type: "POT", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v2}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 5000 }, as: FisheriesRegulator }
            - { call: "POST /quota-transfers", payload: { from_vessel_id: "${v1}", to_vessel_id: "${v2}", fishery_code: "HALIBUT", season_year: 2026, pounds: 5000, price_per_lb_cents: 400 }, as: VesselOwner, as_user_id: "${v1}" }
          trigger:
            - { call: "GET /quota-holdings/${h1}/availability", as: VesselOwner, as_user_id: "${v1}", captures: { ac: $.data.available_committed_pounds, av: $.data.available_conservative_pounds } }
          assert:
            - "available_committed_pounds == 20000"
            - "available_conservative_pounds == 15000"
            - "committed - conservative == 5000 == the open PROPOSED offer pounds"

  # ---------------------------------------------------------------- rule 2 ---
  - rule_id: combinatorial_formula
    instances:
      - name: crew_pool_split_floors_then_remainder
        grounds:
          - calculations.crew_pool_split
          - entities.TripSettlement.fields.crew_payouts
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins floor-per-member THEN
          remainder-distribution (share_points DESC, joined_at ASC, created_at ASC).
          Pool 315200 with points 2 and 1 yields Alice 210134 / Bob 105066; the
          alternative round-each-member convention would yield 210133 / 105067.
        test_recipe:
          setup:
            - "same executed trip as a standard settlement run: gross 1000000, VERIFIED expenses 150000, gear LOSS 2 units (charge 50000), no observer fee, crew Alice 2pts joined 2026-01-15 / Bob 1pt joined 2026-02-01"
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-CF1", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 10000 }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/gear-assets", payload: { gear_type: "LONGLINE", units_total: 4 }, as: VesselOwner, as_user_id: "${v1}", captures: { g1: $.data.id } }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-10T06:00:00Z", planned_return_utc: "2026-08-12T06:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { t1: $.data.id } }
            - { call: "POST /fishing-trips/${t1}/depart", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/catch-reports", payload: { fishery_code: "HALIBUT", report_type: "HARVEST", reported_lbs: 4000, reported_at: "2026-08-11T06:00:00Z" }, as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/expenses", payload: { category: "FUEL", amount_cents: 120000, incurred_at: "2026-08-11T00:00:00Z" }, as: Captain, as_user_id: "${v1}", captures: { e1: $.data.id } }
            - { call: "POST /fishing-trips/${t1}/expenses", payload: { category: "BAIT", amount_cents: 30000, incurred_at: "2026-08-11T01:00:00Z" }, as: Captain, as_user_id: "${v1}", captures: { e2: $.data.id } }
            - { call: "POST /gear-assets/${g1}/events", payload: { event_type: "LOSS", units: 2, occurred_at: "2026-08-11T05:00:00Z", trip_id: "${t1}" }, as: Captain, as_user_id: "${v1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips/${t1}/return", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/landing-declarations", payload: { port_code: "HOMER", lines: [{ fishery_code: "HALIBUT", declared_lbs: 4000 }] }, as: Captain, as_user_id: "${v1}", captures: { ld1: $.data.id } }
            - { call: "POST /landing-declarations/${ld1}/submit", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /landing-declarations/${ld1}/verify", as: FisheriesRegulator }
            - { call: "POST /landing-declarations/${ld1}/finalize", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/crew-contracts", payload: { crew_name: "Alice", share_points: 2, joined_at: "2026-01-15T00:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { c1: $.data.id } }
            - { call: "POST /vessels/${v1}/crew-contracts", payload: { crew_name: "Bob", share_points: 1, joined_at: "2026-02-01T00:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { c2: $.data.id } }
            - { call: "POST /expenses/${e1}/verify", as: SettlementClerk }
            - { call: "POST /expenses/${e2}/verify", as: SettlementClerk }
            - { call: "POST /fishing-trips/${t1}/settlement", payload: { gross_revenue_cents: 1000000 }, as: SettlementClerk, captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /trip-settlements/${s1}/calculate", as: SettlementClerk }
          assert:
            - "TripSettlement.${s1}.crew_pool_cents == 315200"
            - "crew_payouts entry for CrewShareContract.${c1} (Alice, 2 pts) == 210134"
            - "crew_payouts entry for CrewShareContract.${c2} (Bob, 1 pt) == 105066"
            - "210134 + 105066 == 315200 == crew_pool_cents (remainder cent went to highest share_points)"

      - name: settlement_fee_breaks_circular_dependency
        grounds:
          - calculations.settlement_totals
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order: the
          processing fee is a percentage of settlement money while the crew pool
          depends on the fee. The scaffold pins fee = round_half_up(0.015 *
          net_before_fee) = 12000 on net_before_fee 800000; computing the fee on
          net (788000) would give 11820 — a falsifiable difference.
        test_recipe:
          setup:
            - "same executed trip: gross 1000000, VERIFIED expenses 150000, gear LOSS 2 units (50000), no observer, one ACTIVE crew contract"
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-CF2", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 10000 }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/gear-assets", payload: { gear_type: "LONGLINE", units_total: 4 }, as: VesselOwner, as_user_id: "${v1}", captures: { g1: $.data.id } }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-10T06:00:00Z", planned_return_utc: "2026-08-12T06:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { t1: $.data.id } }
            - { call: "POST /fishing-trips/${t1}/depart", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/catch-reports", payload: { fishery_code: "HALIBUT", report_type: "HARVEST", reported_lbs: 4000, reported_at: "2026-08-11T06:00:00Z" }, as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/expenses", payload: { category: "FUEL", amount_cents: 120000, incurred_at: "2026-08-11T00:00:00Z" }, as: Captain, as_user_id: "${v1}", captures: { e1: $.data.id } }
            - { call: "POST /fishing-trips/${t1}/expenses", payload: { category: "BAIT", amount_cents: 30000, incurred_at: "2026-08-11T01:00:00Z" }, as: Captain, as_user_id: "${v1}", captures: { e2: $.data.id } }
            - { call: "POST /gear-assets/${g1}/events", payload: { event_type: "LOSS", units: 2, occurred_at: "2026-08-11T05:00:00Z", trip_id: "${t1}" }, as: Captain, as_user_id: "${v1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips/${t1}/return", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/landing-declarations", payload: { port_code: "HOMER", lines: [{ fishery_code: "HALIBUT", declared_lbs: 4000 }] }, as: Captain, as_user_id: "${v1}", captures: { ld1: $.data.id } }
            - { call: "POST /landing-declarations/${ld1}/submit", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /landing-declarations/${ld1}/verify", as: FisheriesRegulator }
            - { call: "POST /landing-declarations/${ld1}/finalize", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/crew-contracts", payload: { crew_name: "Alice", share_points: 1, joined_at: "2026-01-15T00:00:00Z" }, as: VesselOwner, as_user_id: "${v1}" }
            - { call: "POST /expenses/${e1}/verify", as: SettlementClerk }
            - { call: "POST /expenses/${e2}/verify", as: SettlementClerk }
            - { call: "POST /fishing-trips/${t1}/settlement", payload: { gross_revenue_cents: 1000000 }, as: SettlementClerk, captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /trip-settlements/${s1}/calculate", as: SettlementClerk }
          assert:
            - "TripSettlement.${s1}.processing_fee_cents == 12000 (0.015 x 800000 net_before_fee, NOT 11820 = 0.015 x 788000 net)"
            - "TripSettlement.${s1}.observer_fee_cents == 0"
            - "TripSettlement.${s1}.gear_loss_charge_cents == 50000"
            - "TripSettlement.${s1}.net_cents == 788000"
            - "TripSettlement.${s1}.vessel_share_cents == 472800"
            - "TripSettlement.${s1}.crew_pool_cents == 315200"
            - "150000 + 0 + 50000 + 12000 + 472800 + 315200 == 1000000 == gross_revenue_cents"

      - name: violation_penalty_tier_and_repeat_interaction
        grounds:
          - calculations.violation_penalty_score
          - entities.ComplianceViolation.fields.severity_points
        distinguishing_aspect: |
          Mode (a) non-linear formula with >= 3 inputs: base points by type, tier
          multiplier selected on pre-deduction compliance_points, repeat factor on
          prior same-type ADJUDICATED violations. Severities 20, 30, 15 across three
          adjudications pin all three interactions; a different mode than (b) and (c).
        test_recipe:
          setup:
            - "ACTIVE vessel, compliance_points 100; three manual violations: OVER_QUOTA, OVER_QUOTA, VMS_GAP"
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-CF3", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /violations", payload: { vessel_id: "${v1}", violation_type: "OVER_QUOTA", details: "first" }, as: FisheriesRegulator, captures: { n1: $.data.id } }
            - { call: "POST /violations", payload: { vessel_id: "${v1}", violation_type: "OVER_QUOTA", details: "second" }, as: FisheriesRegulator, captures: { n2: $.data.id } }
            - { call: "POST /violations", payload: { vessel_id: "${v1}", violation_type: "VMS_GAP", details: "third" }, as: FisheriesRegulator, captures: { n3: $.data.id } }
          trigger:
            - { call: "POST /violations/${n1}/adjudicate", as: FisheriesRegulator, captures: { sev1: $.data.severity_points } }
            - { call: "POST /violations/${n2}/adjudicate", as: FisheriesRegulator, captures: { sev2: $.data.severity_points } }
            - { call: "POST /violations/${n3}/adjudicate", as: FisheriesRegulator, captures: { sev3: $.data.severity_points } }
            - { call: "GET /vessels/${v1}", as: FisheriesRegulator, captures: { pts: $.data.compliance_points, vstat: $.data.status } }
          assert:
            - "ComplianceViolation.${n1}.severity_points == 20 (base 20 x tier 1.0 at 100 pts x repeat 1.0)"
            - "ComplianceViolation.${n2}.severity_points == 30 (base 20 x tier 1.0 at 80 pts x repeat 1.5)"
            - "ComplianceViolation.${n3}.severity_points == 15 (base 10 x tier 1.5 at 50 pts x repeat 1.0 — first VMS_GAP)"
            - "Vessel.${v1}.compliance_points == 35"
            - "Vessel.${v1}.status == SUSPENDED (35 < 50)"

  # ---------------------------------------------------------------- rule 3 ---
  - rule_id: non_linear_state_machine
    instances:
      - name: transfer_counter_offer_cycle
        grounds:
          - state_machines.QuotaTransfer.PROPOSED_to_COUNTERED
          - state_machines.QuotaTransfer.COUNTERED_to_PROPOSED
          - state_machines.QuotaTransfer.PROPOSED_to_ACCEPTED
        distinguishing_aspect: |
          Cyclic negotiation on QuotaTransfer: PROPOSED -> COUNTERED -> PROPOSED
          loops with round_number incrementing and last_offered_by alternating;
          only the non-tabling side may accept. Different entity than the
          LandingDeclaration cycle instance.
        test_recipe:
          setup:
            - "V1 holding 20000 HALIBUT/2026, V2 holding 5000, both ACTIVE with ISSUED HALIBUT permits"
            - "transfer V1 -> V2 proposed at 5000 lbs @ 400 cents (round 1, last_offered_by FROM_VESSEL)"
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-NL1A", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 20000 }, as: FisheriesRegulator, captures: { h1: $.data.id } }
            - { call: "POST /vessels", payload: { vessel_name: "FV Bristol", license_number: "LIC-NL1B", home_port: "KODIAK", length_ft: 42, observer_coverage_class: "EXEMPT" }, as: FisheriesRegulator, captures: { v2: $.data.id } }
            - { call: "POST /vessels/${v2}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v2}/permits", payload: { fishery_code: "HALIBUT", gear_type: "POT", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v2}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 5000 }, as: FisheriesRegulator, captures: { h2: $.data.id } }
            - { call: "POST /quota-transfers", payload: { from_vessel_id: "${v1}", to_vessel_id: "${v2}", fishery_code: "HALIBUT", season_year: 2026, pounds: 5000, price_per_lb_cents: 400 }, as: VesselOwner, as_user_id: "${v1}", captures: { tr: $.data.id, tr_v1: $.data.version } }
          trigger:
            - { call: "POST /quota-transfers/${tr}/counter", payload: { pounds: 4500, price_per_lb_cents: 450, expected_transfer_version: "${tr_v1}" }, as: VesselOwner, as_user_id: "${v2}", captures: { tr_v2: $.data.version, st2: $.data.status } }
            - { call: "POST /quota-transfers/${tr}/counter", payload: { pounds: 4500, price_per_lb_cents: 475, expected_transfer_version: "${tr_v2}" }, as: VesselOwner, as_user_id: "${v1}", captures: { tr_v3: $.data.version, st3: $.data.status, rn3: $.data.round_number, lob3: $.data.last_offered_by } }
            - { call: "POST /quota-transfers/${tr}/accept", as: VesselOwner, as_user_id: "${v2}", captures: { st4: $.data.status } }
            - { call: "GET /quota-holdings/${h1}/availability", as: VesselOwner, as_user_id: "${v1}", captures: { ac1: $.data.available_committed_pounds } }
            - { call: "GET /quota-holdings/${h2}/availability", as: VesselOwner, as_user_id: "${v2}", captures: { ac2: $.data.available_committed_pounds } }
          assert:
            - "status after first counter == COUNTERED, round_number == 2, last_offered_by == TO_VESSEL"
            - "status after second counter == PROPOSED, round_number == 3, last_offered_by == FROM_VESSEL"
            - "status after accept == ACCEPTED (accepted by V2, the side that did not table round 3)"
            - "QuotaTransfer.${tr}.pounds == 4500 and price_per_lb_cents == 475 (latest counter values)"
            - "from-holding available_committed_pounds == 15500 (20000 - 4500)"
            - "to-holding available_committed_pounds == 9500 (5000 + 4500)"

      - name: landing_declaration_dispute_amend_cycle
        grounds:
          - state_machines.LandingDeclaration.SUBMITTED_to_DISPUTED
          - state_machines.LandingDeclaration.DISPUTED_to_AMENDED
          - state_machines.LandingDeclaration.AMENDED_to_SUBMITTED
          - calculations.landing_discrepancy_check
        distinguishing_aspect: |
          Cyclic revision loop on LandingDeclaration: SUBMITTED -> DISPUTED ->
          AMENDED -> SUBMITTED -> VERIFIED driven by the 5 percent discrepancy
          tolerance; a different entity than the QuotaTransfer cycle.
        test_recipe:
          setup:
            - "executed trip: catch reports HARVEST 4000; declaration initially declares 5000 (diff 1000 > tolerance 200)"
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-NL2", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 10000 }, as: FisheriesRegulator, captures: { h1: $.data.id } }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-10T06:00:00Z", planned_return_utc: "2026-08-12T06:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { t1: $.data.id } }
            - { call: "POST /fishing-trips/${t1}/depart", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/catch-reports", payload: { fishery_code: "HALIBUT", report_type: "HARVEST", reported_lbs: 4000, reported_at: "2026-08-11T06:00:00Z" }, as: Captain, as_user_id: "${v1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips/${t1}/return", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/landing-declarations", payload: { port_code: "HOMER", lines: [{ fishery_code: "HALIBUT", declared_lbs: 5000 }] }, as: Captain, as_user_id: "${v1}", captures: { ld1: $.data.id } }
            - { call: "POST /landing-declarations/${ld1}/submit", as: Captain, as_user_id: "${v1}" }
          trigger:
            - { call: "POST /landing-declarations/${ld1}/verify", as: FisheriesRegulator, captures: { st1: $.data.status } }
            - { call: "POST /landing-declarations/${ld1}/amend", payload: { lines: [{ fishery_code: "HALIBUT", declared_lbs: 4000 }] }, as: Captain, as_user_id: "${v1}", captures: { st2: $.data.status } }
            - { call: "POST /landing-declarations/${ld1}/submit", as: Captain, as_user_id: "${v1}", captures: { st3: $.data.status } }
            - { call: "POST /landing-declarations/${ld1}/verify", as: FisheriesRegulator, captures: { st4: $.data.status } }
            - { call: "GET /quota-holdings/${h1}", as: FisheriesRegulator, captures: { landed: $.data.landed_pounds } }
          assert:
            - "first verify returns 200 with status DISPUTED (diff 1000 > tolerance 200 = round_half_up(0.05 x 4000)) — not an error"
            - "amend -> AMENDED; resubmit -> SUBMITTED; second verify -> VERIFIED"
            - "LandingDeclaration.${ld1}.discrepancy_details[0].within_tolerance == true after resubmission"
            - "QuotaShareHolding.${h1}.landed_pounds == 4000 (only the amended figure is landed)"

      - name: vessel_suspension_reinstatement_cycle
        grounds:
          - state_machines.Vessel.ACTIVE_to_SUSPENDED
          - state_machines.Vessel.SUSPENDED_to_ACTIVE
          - calculations.violation_penalty_score
        distinguishing_aspect: |
          Cycle on Vessel: ACTIVE -> SUSPENDED (via adjudication cascade) ->
          ACTIVE (via reverse + reinstate). Exercises the cyclic machine on a
          third entity and the compliance threshold boundary (exactly 50 allows
          reinstatement; suspension fires only below 50).
        test_recipe:
          setup:
            - "ACTIVE vessel with permit, compliance_points 100; three OVER_QUOTA violations"
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-NL3", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator, captures: { p1: $.data.id } }
            - { call: "POST /violations", payload: { vessel_id: "${v1}", violation_type: "OVER_QUOTA", details: "d1" }, as: FisheriesRegulator, captures: { n1: $.data.id } }
            - { call: "POST /violations", payload: { vessel_id: "${v1}", violation_type: "OVER_QUOTA", details: "d2" }, as: FisheriesRegulator, captures: { n2: $.data.id } }
            - { call: "POST /violations", payload: { vessel_id: "${v1}", violation_type: "OVER_QUOTA", details: "d3" }, as: FisheriesRegulator, captures: { n3: $.data.id } }
          trigger:
            - { call: "POST /violations/${n1}/adjudicate", as: FisheriesRegulator }
            - { call: "POST /violations/${n2}/adjudicate", as: FisheriesRegulator, captures: { sev2: $.data.severity_points } }
            - { call: "GET /vessels/${v1}", as: FisheriesRegulator, captures: { pts_mid: $.data.compliance_points, stat_mid: $.data.status } }
            - { call: "POST /violations/${n3}/adjudicate", as: FisheriesRegulator, captures: { sev3: $.data.severity_points } }
            - { call: "GET /vessels/${v1}", as: FisheriesRegulator, captures: { stat_susp: $.data.status } }
            - { call: "POST /violations/${n3}/appeal", as: VesselOwner, as_user_id: "${v1}" }
            - { call: "POST /violations/${n3}/reverse", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/reinstate", as: FisheriesRegulator, captures: { stat_final: $.data.status, pts_final: $.data.compliance_points } }
            - { call: "GET /vessels/${v1}/permits", as: FisheriesRegulator, captures: { perm_status: "$.data[0].status" } }
          assert:
            - "after two adjudications compliance_points == 50 and status still == ACTIVE (exactly 50 does not suspend)"
            - "third adjudication severity == 45 (20 x 1.5 tier x 1.5 repeat) -> compliance_points == 5 -> status SUSPENDED"
            - "reverse refunds 45 -> compliance_points == 50"
            - "reinstate succeeds at exactly 50 -> status ACTIVE; permit returns to ISSUED (valid_to 2026-12-31 > clock)"

  # ---------------------------------------------------------------- rule 4 ---
  - rule_id: transitive_cascade
    instances:
      - name: tac_exhaustion_early_close_cascade
        grounds:
          - state_machines.SeasonOpening.OPEN_to_CLOSED_EARLY
          - state_machines.FishingTrip.PLANNED_to_CANCELLED
          - state_machines.ObserverAssignment.ASSIGNED_to_CANCELLED
          - calculations.tac_consumption_and_early_closure
        distinguishing_aspect: |
          Depth-4 cascade triggered by landing verification: verify debits the
          opening (1); the debit crossing TAC flips the opening CLOSED_EARLY (2);
          the close cancels a PLANNED trip (3); the trip cancellation cancels its
          ASSIGNED observer assignment (4); the assignment cancellation recomputes
          the observer to AVAILABLE (5). Each link is caused by the previous one.
        test_recipe:
          setup:
            - "opening HALIBUT/3A tac 5000, OPEN at clock 2026-08-10"
            - "V1 trip1 executed with catch 5000, declaration 5000 submitted"
            - "V2 trip2 PLANNED 2026-08-10 -> 2026-08-14 (100h, observer_required), its auto REQUESTED assignment assigned to an observer (ASSIGNED, observer ON_ASSIGNMENT)"
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-TC1A", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 10000 }, as: FisheriesRegulator }
            - { call: "POST /vessels", payload: { vessel_name: "FV Bristol", license_number: "LIC-TC1B", home_port: "KODIAK", length_ft: 42, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v2: $.data.id } }
            - { call: "POST /vessels/${v2}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v2}/permits", payload: { fishery_code: "HALIBUT", gear_type: "POT", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 5000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
            - { call: "POST /observers", payload: { observer_name: "Obs One", certification_level: "B", home_base: "HOMER" }, as: ObserverCoordinator, captures: { ob1: $.data.id, ob1_v: $.data.version } }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v2}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-10T06:00:00Z", planned_return_utc: "2026-08-14T06:00:00Z" }, as: VesselOwner, as_user_id: "${v2}", captures: { t2: $.data.id } }
            - { call: "GET /observer-assignments?trip_id=${t2}", as: ObserverCoordinator, captures: { a2: "$.data[0].id" } }
            - { call: "POST /observer-assignments/${a2}/assign", payload: { observer_id: "${ob1}", coverage_from: "2026-08-10T00:00:00Z", coverage_to: "2026-08-14T06:00:00Z", expected_observer_version: "${ob1_v}" }, as: ObserverCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-10T06:00:00Z", planned_return_utc: "2026-08-12T06:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { t1: $.data.id } }
            - { call: "POST /fishing-trips/${t1}/depart", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/catch-reports", payload: { fishery_code: "HALIBUT", report_type: "HARVEST", reported_lbs: 5000, reported_at: "2026-08-11T06:00:00Z" }, as: Captain, as_user_id: "${v1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips/${t1}/return", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/landing-declarations", payload: { port_code: "HOMER", lines: [{ fishery_code: "HALIBUT", declared_lbs: 5000 }] }, as: Captain, as_user_id: "${v1}", captures: { ld1: $.data.id } }
            - { call: "POST /landing-declarations/${ld1}/submit", as: Captain, as_user_id: "${v1}" }
          trigger:
            - { call: "POST /landing-declarations/${ld1}/verify", as: FisheriesRegulator }
            - { call: "GET /season-openings/${o1}", as: FisheriesRegulator, captures: { o_stat: $.data.status, o_tac: $.data.landed_against_tac_pounds } }
            - { call: "GET /fishing-trips/${t2}", as: FisheriesRegulator, captures: { t2_stat: $.data.status } }
            - { call: "GET /observer-assignments/${a2}", as: ObserverCoordinator, captures: { a2_stat: $.data.status } }
            - { call: "GET /observers/${ob1}", as: ObserverCoordinator, captures: { ob_stat: $.data.status } }
          assert:
            - "SeasonOpening.${o1}.landed_against_tac_pounds == 5000 and status == CLOSED_EARLY (5000 >= 5000)"
            - "FishingTrip.${t2}.status == CANCELLED (was PLANNED; cascade link 3)"
            - "ObserverAssignment.${a2}.status == CANCELLED (was ASSIGNED; cascade link 4)"
            - "Observer.${ob1}.status == AVAILABLE (recomputed after the assignment cancellation; cascade link 5)"

      - name: violation_adjudication_suspension_cascade
        grounds:
          - state_machines.ComplianceViolation.OPEN_to_ADJUDICATED
          - state_machines.Vessel.ACTIVE_to_SUSPENDED
          - state_machines.Permit.ISSUED_to_SUSPENDED
          - state_machines.FishingTrip.PLANNED_to_CANCELLED
        distinguishing_aspect: |
          Depth-4 cascade triggered by violation adjudication (a different trigger
          than landing verification): adjudicate deducts penalty (1); crossing below
          50 suspends the vessel (2); suspension suspends its permit and cancels its
          PLANNED trip (3); the trip cancellation cancels its REQUESTED assignment (4).
        test_recipe:
          setup:
            - "ACTIVE vessel, permit ISSUED, compliance_points 100"
            - "PLANNED trip (100h, observer_required) with auto REQUESTED assignment"
            - "three OPEN OVER_QUOTA violations (severities 20, 30, 45 -> points 80, 50, 5)"
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-TC2", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator, captures: { p1: $.data.id } }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-10T06:00:00Z", planned_return_utc: "2026-08-14T06:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { t1: $.data.id } }
            - { call: "GET /observer-assignments?trip_id=${t1}", as: ObserverCoordinator, captures: { a1: "$.data[0].id" } }
            - { call: "POST /violations", payload: { vessel_id: "${v1}", violation_type: "OVER_QUOTA", details: "d1" }, as: FisheriesRegulator, captures: { n1: $.data.id } }
            - { call: "POST /violations", payload: { vessel_id: "${v1}", violation_type: "OVER_QUOTA", details: "d2" }, as: FisheriesRegulator, captures: { n2: $.data.id } }
            - { call: "POST /violations", payload: { vessel_id: "${v1}", violation_type: "OVER_QUOTA", details: "d3" }, as: FisheriesRegulator, captures: { n3: $.data.id } }
          trigger:
            - { call: "POST /violations/${n1}/adjudicate", as: FisheriesRegulator }
            - { call: "POST /violations/${n2}/adjudicate", as: FisheriesRegulator }
            - { call: "POST /violations/${n3}/adjudicate", as: FisheriesRegulator, captures: { sev3: $.data.severity_points } }
            - { call: "GET /vessels/${v1}", as: FisheriesRegulator, captures: { pts: $.data.compliance_points, vstat: $.data.status } }
            - { call: "GET /vessels/${v1}/permits", as: FisheriesRegulator, captures: { pstat: "$.data[0].status" } }
            - { call: "GET /fishing-trips/${t1}", as: FisheriesRegulator, captures: { tstat: $.data.status } }
            - { call: "GET /observer-assignments/${a1}", as: ObserverCoordinator, captures: { astat: $.data.status } }
          assert:
            - "ComplianceViolation.${n3}.severity_points == 45"
            - "Vessel.${v1}.compliance_points == 5 and status == SUSPENDED (cascade link 2)"
            - "Permit.${p1}.status == SUSPENDED (cascade link 3a)"
            - "FishingTrip.${t1}.status == CANCELLED (cascade link 3b)"
            - "ObserverAssignment.${a1}.status == CANCELLED (cascade link 4)"

  # ---------------------------------------------------------------- rule 5 ---
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: verify_state_beats_quota_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=10]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: the declaration is still
          DRAFT (state violation, priority 5) AND its declared 99999 lbs exceed
          the holding's 1000 lbs (fiscal violation, priority 10) — the response
          must be ERR_DECLARATION_NOT_SUBMITTED, never ERR_QUOTA_EXCEEDED.
        test_recipe:
          setup:
            - "executed trip RETURNED with catch HARVEST 500; holding only 1000 lbs; declaration declares 99999 and is never submitted"
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-PP1", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 1000 }, as: FisheriesRegulator }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-10T06:00:00Z", planned_return_utc: "2026-08-12T06:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { t1: $.data.id } }
            - { call: "POST /fishing-trips/${t1}/depart", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/catch-reports", payload: { fishery_code: "HALIBUT", report_type: "HARVEST", reported_lbs: 500, reported_at: "2026-08-11T06:00:00Z" }, as: Captain, as_user_id: "${v1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips/${t1}/return", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/landing-declarations", payload: { port_code: "HOMER", lines: [{ fishery_code: "HALIBUT", declared_lbs: 99999 }] }, as: Captain, as_user_id: "${v1}", captures: { ld1: $.data.id } }
          trigger:
            - { call: "POST /landing-declarations/${ld1}/verify", as: FisheriesRegulator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DECLARATION_NOT_SUBMITTED (http 409; state priority 5 beats fiscal priority 10)"
            - "QuotaShareHolding landed_pounds unchanged (no side effects fired)"

      - name: depart_safety_beats_temporal
        grounds:
          - validations[priority=6]
          - validations[priority=7]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_temporal: depart with an
          unstaffed observer requirement (safety, priority 6) while the opening is
          still SCHEDULED (temporal, priority 7) must return
          ERR_OBSERVER_COVERAGE_MISSING, not ERR_OUTSIDE_OPENING_WINDOW.
        test_recipe:
          setup:
            - "PARTIAL vessel ACTIVE with permit; opening HALIBUT/3A opens 2026-08-05 (still SCHEDULED at default clock 2026-08-01)"
            - "trip planned 2026-08-10T06:00 -> 2026-08-14T06:00 (100h > 72h so observer_required; assignment REQUESTED, never assigned)"
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-PP2", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-10T06:00:00Z", planned_return_utc: "2026-08-14T06:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { t1: $.data.id, obs_req: $.data.observer_required } }
          trigger:
            - { call: "POST /fishing-trips/${t1}/depart", as: Captain, as_user_id: "${v1}", captures: { err: $.data.error_id } }
          assert:
            - "FishingTrip.${t1}.observer_required == true"
            - "error_id == ERR_OBSERVER_COVERAGE_MISSING (http 409; safety priority 6 beats temporal priority 7)"

      - name: transfer_permit_referential_beats_quota_fiscal
        grounds:
          - validations[priority=8]
          - validations[priority=10]
        distinguishing_aspect: |
          Error-category pair business_referential vs business_fiscal: the
          to-vessel's permit is REVOKED (referential, priority 8) AND the
          requested 999999 lbs exceed the from-holding (fiscal, priority 10) —
          the response must be ERR_PERMIT_NOT_ACTIVE.
        test_recipe:
          setup:
            - "V1 holding 20000 with ISSUED permit; V2 holding 5000 with permit created then REVOKED"
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-PP3A", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 20000 }, as: FisheriesRegulator }
            - { call: "POST /vessels", payload: { vessel_name: "FV Bristol", license_number: "LIC-PP3B", home_port: "KODIAK", length_ft: 42, observer_coverage_class: "EXEMPT" }, as: FisheriesRegulator, captures: { v2: $.data.id } }
            - { call: "POST /vessels/${v2}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v2}/permits", payload: { fishery_code: "HALIBUT", gear_type: "POT", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator, captures: { p2: $.data.id } }
            - { call: "POST /vessels/${v2}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 5000 }, as: FisheriesRegulator }
            - { call: "POST /permits/${p2}/revoke", as: FisheriesRegulator }
          trigger:
            - { call: "POST /quota-transfers", payload: { from_vessel_id: "${v1}", to_vessel_id: "${v2}", fishery_code: "HALIBUT", season_year: 2026, pounds: 999999, price_per_lb_cents: 100 }, as: VesselOwner, as_user_id: "${v1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PERMIT_NOT_ACTIVE (http 409; referential priority 8 beats fiscal priority 10)"

  # ---------------------------------------------------------------- rule 6 ---
  - rule_id: boundary_precision_check
    instances:
      - name: landing_quota_exact_boundary
        grounds:
          - calculations.available_quota
          - validations[priority=10]
        distinguishing_aspect: |
          Metric: quota pounds on the verify endpoint. available_committed == 6000
          and a declared line of exactly 6000 is ACCEPTED (>= comparison); a later
          line of 1 lb against the exhausted holding is REJECTED with
          ERR_QUOTA_EXCEEDED. Boundary precision: == passes, +1 fails.
        test_recipe:
          setup:
            - "holding 6000 lbs; trip1 catch 6000 declared 6000 verified; trip2 (same vessel, non-overlapping window) catch 1 declared 1"
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-BP1", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 6000 }, as: FisheriesRegulator }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-10T06:00:00Z", planned_return_utc: "2026-08-12T06:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { t1: $.data.id } }
            - { call: "POST /fishing-trips/${t1}/depart", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/catch-reports", payload: { fishery_code: "HALIBUT", report_type: "HARVEST", reported_lbs: 6000, reported_at: "2026-08-11T06:00:00Z" }, as: Captain, as_user_id: "${v1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips/${t1}/return", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/landing-declarations", payload: { port_code: "HOMER", lines: [{ fishery_code: "HALIBUT", declared_lbs: 6000 }] }, as: Captain, as_user_id: "${v1}", captures: { ld1: $.data.id } }
            - { call: "POST /landing-declarations/${ld1}/submit", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /landing-declarations/${ld1}/verify", as: FisheriesRegulator, captures: { st1: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-13T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-13T06:00:00Z", planned_return_utc: "2026-08-15T06:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { t2: $.data.id } }
            - { call: "POST /fishing-trips/${t2}/depart", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t2}/catch-reports", payload: { fishery_code: "HALIBUT", report_type: "HARVEST", reported_lbs: 1, reported_at: "2026-08-14T06:00:00Z" }, as: Captain, as_user_id: "${v1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips/${t2}/return", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t2}/landing-declarations", payload: { port_code: "HOMER", lines: [{ fishery_code: "HALIBUT", declared_lbs: 1 }] }, as: Captain, as_user_id: "${v1}", captures: { ld2: $.data.id } }
            - { call: "POST /landing-declarations/${ld2}/submit", as: Captain, as_user_id: "${v1}" }
          trigger:
            - { call: "POST /landing-declarations/${ld2}/verify", as: FisheriesRegulator, captures: { err: $.data.error_id } }
          assert:
            - "LandingDeclaration.${ld1}.status == VERIFIED (declared 6000 == available_committed 6000 is accepted)"
            - "second verify error_id == ERR_QUOTA_EXCEEDED (http 402; available_committed == 0 < 1)"

      - name: observer_duration_72h_boundary
        grounds:
          - entities.FishingTrip.fields.observer_required
          - state_machines.ObserverAssignment
        distinguishing_aspect: |
          Metric: planned trip duration in hours on POST /fishing-trips. Exactly
          72h on a PARTIAL vessel yields observer_required == false and zero
          auto-created assignments; 72h plus one minute yields true and exactly
          one REQUESTED assignment. Boundary is strictly-greater-than.
        test_recipe:
          setup:
            - "PARTIAL vessel ACTIVE with permit; opening 2026-08-05..2026-08-25"
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-BP2", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
          trigger:
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-10T06:00:00Z", planned_return_utc: "2026-08-13T06:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { tA: $.data.id, reqA: $.data.observer_required } }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-14T06:00:00Z", planned_return_utc: "2026-08-17T06:01:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { tB: $.data.id, reqB: $.data.observer_required } }
          assert:
            - "FishingTrip.${tA}.observer_required == false (exactly 72h is not > 72h)"
            - "GET /observer-assignments?trip_id=${tA} returns 0 rows"
            - "FishingTrip.${tB}.observer_required == true (72h 1min > 72h)"
            - "GET /observer-assignments?trip_id=${tB} returns exactly 1 row with status REQUESTED and auto_created == true"

      - name: tac_exact_equality_closes_opening
        grounds:
          - calculations.tac_consumption_and_early_closure
          - state_machines.SeasonOpening.OPEN_to_CLOSED_EARLY
        distinguishing_aspect: |
          Metric: TAC pounds on the verify endpoint's cascade. Landing exactly up
          to tac_pounds (5000 of 5000) fires CLOSED_EARLY; one pound of headroom
          (5000 of 5001) leaves the opening OPEN. Inclusive >= at the threshold.
        test_recipe:
          setup:
            - "two openings HALIBUT/3A tac 5000 and HALIBUT/3B tac 5001; vessels A and B each run an equivalent trip declaring 5000 on their opening"
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-BP3A", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { vA: $.data.id } }
            - { call: "POST /vessels/${vA}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${vA}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${vA}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 10000 }, as: FisheriesRegulator }
            - { call: "POST /vessels", payload: { vessel_name: "FV Bristol", license_number: "LIC-BP3B", home_port: "KODIAK", length_ft: 42, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { vB: $.data.id } }
            - { call: "POST /vessels/${vB}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${vB}/permits", payload: { fishery_code: "HALIBUT", gear_type: "POT", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${vB}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 10000 }, as: FisheriesRegulator }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 5000 }, as: FisheriesRegulator, captures: { oA: $.data.id } }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3B", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 5001 }, as: FisheriesRegulator, captures: { oB: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${vA}", season_opening_id: "${oA}", planned_departure_utc: "2026-08-10T06:00:00Z", planned_return_utc: "2026-08-12T06:00:00Z" }, as: VesselOwner, as_user_id: "${vA}", captures: { tA: $.data.id } }
            - { call: "POST /fishing-trips/${tA}/depart", as: Captain, as_user_id: "${vA}" }
            - { call: "POST /fishing-trips/${tA}/catch-reports", payload: { fishery_code: "HALIBUT", report_type: "HARVEST", reported_lbs: 5000, reported_at: "2026-08-11T06:00:00Z" }, as: Captain, as_user_id: "${vA}" }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${vB}", season_opening_id: "${oB}", planned_departure_utc: "2026-08-10T06:00:00Z", planned_return_utc: "2026-08-12T06:00:00Z" }, as: VesselOwner, as_user_id: "${vB}", captures: { tB: $.data.id } }
            - { call: "POST /fishing-trips/${tB}/depart", as: Captain, as_user_id: "${vB}" }
            - { call: "POST /fishing-trips/${tB}/catch-reports", payload: { fishery_code: "HALIBUT", report_type: "HARVEST", reported_lbs: 5000, reported_at: "2026-08-11T06:00:00Z" }, as: Captain, as_user_id: "${vB}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips/${tA}/return", as: Captain, as_user_id: "${vA}" }
            - { call: "POST /fishing-trips/${tB}/return", as: Captain, as_user_id: "${vB}" }
            - { call: "POST /fishing-trips/${tA}/landing-declarations", payload: { port_code: "HOMER", lines: [{ fishery_code: "HALIBUT", declared_lbs: 5000 }] }, as: Captain, as_user_id: "${vA}", captures: { ldA: $.data.id } }
            - { call: "POST /landing-declarations/${ldA}/submit", as: Captain, as_user_id: "${vA}" }
            - { call: "POST /fishing-trips/${tB}/landing-declarations", payload: { port_code: "KODIAK", lines: [{ fishery_code: "HALIBUT", declared_lbs: 5000 }] }, as: Captain, as_user_id: "${vB}", captures: { ldB: $.data.id } }
            - { call: "POST /landing-declarations/${ldB}/submit", as: Captain, as_user_id: "${vB}" }
          trigger:
            - { call: "POST /landing-declarations/${ldA}/verify", as: FisheriesRegulator }
            - { call: "POST /landing-declarations/${ldB}/verify", as: FisheriesRegulator }
            - { call: "GET /season-openings/${oA}", as: FisheriesRegulator, captures: { stA: $.data.status } }
            - { call: "GET /season-openings/${oB}", as: FisheriesRegulator, captures: { stB: $.data.status } }
          assert:
            - "SeasonOpening.${oA}.status == CLOSED_EARLY (landed 5000 >= tac 5000, inclusive)"
            - "SeasonOpening.${oB}.status == OPEN (landed 5000 < tac 5001)"

  # ---------------------------------------------------------------- rule 7 ---
  - rule_id: cross_entity_state_dependency
    instances:
      - name: depart_gated_by_opening_state
        grounds:
          - state_machines.FishingTrip.PLANNED_to_DEPARTED
          - state_machines.SeasonOpening
        distinguishing_aspect: |
          Entity pair FishingTrip -> SeasonOpening: depart is rejected while the
          opening is still SCHEDULED even though the trip itself is PLANNED and
          every trip-local precondition holds; after the clock crosses opens_at
          the same call succeeds.
        test_recipe:
          setup:
            - "PARTIAL vessel ACTIVE with permit; opening opens 2026-08-05 (SCHEDULED at default clock); trip 48h planned 2026-08-10..2026-08-12"
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-CE1", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-10T06:00:00Z", planned_return_utc: "2026-08-12T06:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { t1: $.data.id } }
          trigger:
            - { call: "POST /fishing-trips/${t1}/depart", as: Captain, as_user_id: "${v1}", captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips/${t1}/depart", as: Captain, as_user_id: "${v1}", captures: { st: $.data.status } }
          assert:
            - "first depart error_id == ERR_OUTSIDE_OPENING_WINDOW (opening SCHEDULED at clock 2026-08-01)"
            - "after clock reaches opens_at the opening auto-opens and the identical depart returns status DEPARTED"

      - name: verify_gated_by_observer_debrief
        grounds:
          - state_machines.LandingDeclaration.SUBMITTED_to_VERIFIED
          - state_machines.ObserverAssignment.DEPLOYED_to_DEBRIEFED
        distinguishing_aspect: |
          Entity pair LandingDeclaration -> ObserverAssignment: verification of a
          FULL-class vessel's declaration is rejected while the assignment is
          DEPLOYED; only after the observer debriefs does the identical verify
          succeed. Different entity pair than trip->opening.
        test_recipe:
          setup:
            - "FULL-class vessel ACTIVE with permit and holding 10000; opening OPEN; trip 48h with observer assigned+confirmed; trip executed, catch 3000, declaration 3000 SUBMITTED; assignment still DEPLOYED"
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-CE2", home_port: "HOMER", length_ft: 58, observer_coverage_class: "FULL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 10000 }, as: FisheriesRegulator }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
            - { call: "POST /observers", payload: { observer_name: "Obs One", certification_level: "A", home_base: "HOMER" }, as: ObserverCoordinator, captures: { ob1: $.data.id, ob1_v: $.data.version } }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-10T06:00:00Z", planned_return_utc: "2026-08-12T06:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { t1: $.data.id } }
            - { call: "GET /observer-assignments?trip_id=${t1}", as: ObserverCoordinator, captures: { a1: "$.data[0].id" } }
            - { call: "POST /observer-assignments/${a1}/assign", payload: { observer_id: "${ob1}", coverage_from: "2026-08-10T00:00:00Z", coverage_to: "2026-08-12T06:00:00Z", expected_observer_version: "${ob1_v}" }, as: ObserverCoordinator }
            - { call: "POST /observer-assignments/${a1}/confirm", as: Observer, as_user_id: "${ob1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips/${t1}/depart", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/catch-reports", payload: { fishery_code: "HALIBUT", report_type: "HARVEST", reported_lbs: 3000, reported_at: "2026-08-11T06:00:00Z" }, as: Captain, as_user_id: "${v1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips/${t1}/return", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/landing-declarations", payload: { port_code: "HOMER", lines: [{ fishery_code: "HALIBUT", declared_lbs: 3000 }] }, as: Captain, as_user_id: "${v1}", captures: { ld1: $.data.id } }
            - { call: "POST /landing-declarations/${ld1}/submit", as: Captain, as_user_id: "${v1}" }
          trigger:
            - { call: "POST /landing-declarations/${ld1}/verify", as: FisheriesRegulator, captures: { err: $.data.error_id } }
            - { call: "POST /observer-assignments/${a1}/debrief", as: Observer, as_user_id: "${ob1}" }
            - { call: "POST /landing-declarations/${ld1}/verify", as: FisheriesRegulator, captures: { st: $.data.status } }
          assert:
            - "first verify error_id == ERR_OBSERVER_NOT_DEBRIEFED (assignment DEPLOYED, trip observer_required)"
            - "after debrief (DEPLOYED -> DEBRIEFED) the identical verify returns status VERIFIED"

      - name: transfer_accept_gated_by_permit_state
        grounds:
          - state_machines.QuotaTransfer.PROPOSED_to_ACCEPTED
          - state_machines.Permit.ISSUED_to_REVOKED
        distinguishing_aspect: |
          Entity pair QuotaTransfer -> Permit: a transfer that was validly
          proposed becomes un-acceptable after the to-vessel's permit is revoked;
          accept re-checks permit state at acceptance time, not proposal time.
        test_recipe:
          setup:
            - "V1 holding 20000, V2 holding 5000, both permits ISSUED at propose time; transfer PROPOSED for 5000 lbs; then V2's permit is REVOKED"
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-CE3A", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 20000 }, as: FisheriesRegulator }
            - { call: "POST /vessels", payload: { vessel_name: "FV Bristol", license_number: "LIC-CE3B", home_port: "KODIAK", length_ft: 42, observer_coverage_class: "EXEMPT" }, as: FisheriesRegulator, captures: { v2: $.data.id } }
            - { call: "POST /vessels/${v2}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v2}/permits", payload: { fishery_code: "HALIBUT", gear_type: "POT", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator, captures: { p2: $.data.id } }
            - { call: "POST /vessels/${v2}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 5000 }, as: FisheriesRegulator }
            - { call: "POST /quota-transfers", payload: { from_vessel_id: "${v1}", to_vessel_id: "${v2}", fishery_code: "HALIBUT", season_year: 2026, pounds: 5000, price_per_lb_cents: 400 }, as: VesselOwner, as_user_id: "${v1}", captures: { tr: $.data.id } }
            - { call: "POST /permits/${p2}/revoke", as: FisheriesRegulator }
          trigger:
            - { call: "POST /quota-transfers/${tr}/accept", as: VesselOwner, as_user_id: "${v2}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PERMIT_NOT_ACTIVE (accept re-validates both permits; to-vessel permit is REVOKED)"
            - "QuotaTransfer.${tr}.status remains PROPOSED (no holding side effects fired)"

  # ---------------------------------------------------------------- rule 8 ---
  - rule_id: resource_temporal_overlap
    instances:
      - name: observer_assignment_rest_buffer_overlap
        grounds:
          - state_machines.ObserverAssignment.REQUESTED_to_ASSIGNED
          - validations[priority=7]
        distinguishing_aspect: |
          Interval semantics: 24h REST BUFFER on the Observer resource — a new
          assignment must start at least 24h after the existing coverage ends.
          coverage_from at existing_to+23h conflicts; at exactly +24h it is
          accepted. Different resource and semantics than the vessel-trip rule.
        test_recipe:
          setup:
            - "two PARTIAL vessels with 120h trips (observer_required) on the same opening; two auto REQUESTED assignments; one cert-B observer"
            - "assignment A assigned with coverage 2026-08-10T00:00 -> 2026-08-15T00:00 (observer ON_ASSIGNMENT, version now 2)"
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-TO1A", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels", payload: { vessel_name: "FV Bristol", license_number: "LIC-TO1B", home_port: "KODIAK", length_ft: 42, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v2: $.data.id } }
            - { call: "POST /vessels/${v2}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v2}/permits", payload: { fishery_code: "HALIBUT", gear_type: "POT", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
            - { call: "POST /observers", payload: { observer_name: "Obs One", certification_level: "B", home_base: "HOMER" }, as: ObserverCoordinator, captures: { ob1: $.data.id, ob_v1: $.data.version } }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-10T00:00:00Z", planned_return_utc: "2026-08-15T00:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { tA: $.data.id } }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v2}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-16T00:00:00Z", planned_return_utc: "2026-08-21T00:00:00Z" }, as: VesselOwner, as_user_id: "${v2}", captures: { tB: $.data.id } }
            - { call: "GET /observer-assignments?trip_id=${tA}", as: ObserverCoordinator, captures: { aA: "$.data[0].id" } }
            - { call: "GET /observer-assignments?trip_id=${tB}", as: ObserverCoordinator, captures: { aB: "$.data[0].id" } }
            - { call: "POST /observer-assignments/${aA}/assign", payload: { observer_id: "${ob1}", coverage_from: "2026-08-10T00:00:00Z", coverage_to: "2026-08-15T00:00:00Z", expected_observer_version: "${ob_v1}" }, as: ObserverCoordinator }
            - { call: "GET /observers/${ob1}", as: ObserverCoordinator, captures: { ob_v2: $.data.version } }
          trigger:
            - { call: "POST /observer-assignments/${aB}/assign", payload: { observer_id: "${ob1}", coverage_from: "2026-08-15T23:00:00Z", coverage_to: "2026-08-21T00:00:00Z", expected_observer_version: "${ob_v2}" }, as: ObserverCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /observer-assignments/${aB}/assign", payload: { observer_id: "${ob1}", coverage_from: "2026-08-16T00:00:00Z", coverage_to: "2026-08-21T00:00:00Z", expected_observer_version: "${ob_v2}" }, as: ObserverCoordinator, captures: { stB: $.data.status } }
          assert:
            - "coverage_from 2026-08-15T23:00 (23h after prior coverage_to) -> ERR_OBSERVER_DOUBLE_BOOKED"
            - "coverage_from 2026-08-16T00:00 (exactly +24h rest) -> status ASSIGNED"
            - "ObserverAssignment.${aB}.status == ASSIGNED after the boundary-satisfying retry"

      - name: vessel_trip_windows_half_open
        grounds:
          - validations[priority=7]
          - entities.FishingTrip.fields.planned_departure_utc
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [departure, return) on the Vessel
          resource — a trip departing exactly when the previous one returns is
          allowed (back-to-back), while a one-hour-earlier departure conflicts.
          Different resource and semantics than the observer rest-buffer rule.
        test_recipe:
          setup:
            - "one PARTIAL vessel; tripA 2026-08-10T06:00 -> 2026-08-12T06:00 and adjacent tripB 2026-08-12T06:00 -> 2026-08-14T06:00 both created OK"
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-TO2", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-10T06:00:00Z", planned_return_utc: "2026-08-12T06:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { tA: $.data.id } }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-12T06:00:00Z", planned_return_utc: "2026-08-14T06:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { tB: $.data.id } }
          trigger:
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-11T06:00:00Z", planned_return_utc: "2026-08-13T06:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { err: $.data.error_id } }
          assert:
            - "tripB created successfully (planned_departure == tripA.planned_return is allowed under half-open semantics)"
            - "tripC 2026-08-11T06:00 -> 2026-08-13T06:00 error_id == ERR_TRIP_WINDOW_OVERLAP (strictly inside tripA's window)"

      - name: opening_windows_closed_interval_touch
        grounds:
          - validations[priority=7]
          - entities.SeasonOpening.fields.opens_at
        distinguishing_aspect: |
          Interval semantics: CLOSED intervals on (fishery, area) — a new opening
          whose opens_at exactly equals the existing opening's closes_at CONFLICTS
          (touching shares an instant), unlike the half-open vessel-trip rule.
          Different resource (SeasonOpening) and semantics than both other rules.
        test_recipe:
          setup:
            - "existing opening HALIBUT/3A 2026-08-05T00:00 -> 2026-08-25T00:00"
          setup_api_calls:
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
          trigger:
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-25T00:00:00Z", closes_at: "2026-09-05T00:00:00Z", tac_pounds: 50000 }, as: FisheriesRegulator, captures: { err: $.data.error_id } }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-26T00:00:00Z", closes_at: "2026-09-05T00:00:00Z", tac_pounds: 50000 }, as: FisheriesRegulator, captures: { o2: $.data.id, st2: $.data.status } }
            - { call: "POST /season-openings", payload: { fishery_code: "SABLEFISH", area_code: "3A", opens_at: "2026-08-10T00:00:00Z", closes_at: "2026-08-20T00:00:00Z", tac_pounds: 50000 }, as: FisheriesRegulator, captures: { o3: $.data.id } }
          assert:
            - "touching window (opens_at == existing closes_at) -> ERR_OPENING_WINDOW_OVERLAP (closed-interval semantics)"
            - "opens_at 2026-08-26 (one-day gap) -> 201 SCHEDULED"
            - "different fishery in the same area with a fully overlapping window -> 201 SCHEDULED (conflict scoped to fishery+area)"

  # ---------------------------------------------------------------- rule 9 ---
  - rule_id: compensating_invariant
    instances:
      - name: quota_conserved_across_propose_withdraw
        grounds:
          - calculations.available_quota
          - state_machines.QuotaTransfer.PROPOSED_to_WITHDRAWN
        distinguishing_aspect: |
          Conserved quantity: holding availability. Proposing a 5000-lb offer
          drops conservative availability to 15000 while committed stays 20000;
          withdrawing the offer restores conservative to exactly 20000. The
          forward/compensating pair leaves both variants unchanged.
        test_recipe:
          setup:
            - "V1 holding 20000, V2 holding 5000, both ACTIVE with ISSUED permits"
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-CI1A", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 20000 }, as: FisheriesRegulator, captures: { h1: $.data.id } }
            - { call: "POST /vessels", payload: { vessel_name: "FV Bristol", license_number: "LIC-CI1B", home_port: "KODIAK", length_ft: 42, observer_coverage_class: "EXEMPT" }, as: FisheriesRegulator, captures: { v2: $.data.id } }
            - { call: "POST /vessels/${v2}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v2}/permits", payload: { fishery_code: "HALIBUT", gear_type: "POT", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v2}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 5000 }, as: FisheriesRegulator }
            - { call: "GET /quota-holdings/${h1}/availability", as: FisheriesRegulator, captures: { before_c: $.data.available_committed_pounds, before_k: $.data.available_conservative_pounds } }
          trigger:
            - { call: "POST /quota-transfers", payload: { from_vessel_id: "${v1}", to_vessel_id: "${v2}", fishery_code: "HALIBUT", season_year: 2026, pounds: 5000, price_per_lb_cents: 400 }, as: VesselOwner, as_user_id: "${v1}", captures: { tr: $.data.id } }
            - { call: "GET /quota-holdings/${h1}/availability", as: FisheriesRegulator, captures: { mid_c: $.data.available_committed_pounds, mid_k: $.data.available_conservative_pounds } }
            - { call: "POST /quota-transfers/${tr}/withdraw", as: VesselOwner, as_user_id: "${v1}" }
            - { call: "GET /quota-holdings/${h1}/availability", as: FisheriesRegulator, captures: { after_c: $.data.available_committed_pounds, after_k: $.data.available_conservative_pounds } }
          assert:
            - "before: committed == 20000 and conservative == 20000"
            - "after propose: committed == 20000 (unchanged) and conservative == 15000"
            - "after withdraw: committed == 20000 and conservative == 20000 (invariant restored, zero drift)"
            - "QuotaTransfer.${tr}.status == WITHDRAWN (withdraw by the last_offered_by FROM side)"

      - name: settlement_money_decomposition_conserved
        grounds:
          - calculations.settlement_totals
          - calculations.crew_pool_split
          - state_machines.TripSettlement.DISPUTED_to_CALCULATED
        distinguishing_aspect: |
          Conserved quantity: money. After calculate, gross_revenue_cents ==
          expenses + observer_fee + gear_loss + processing_fee + vessel_share +
          crew_pool AND sum(crew_payouts) == crew_pool exactly; a dispute ->
          recalculate cycle with unchanged inputs reproduces identical figures
          (no drift). Different conserved quantity than quota pounds.
        test_recipe:
          setup:
            - "executed trip: gross 1000000, VERIFIED expenses 150000, gear LOSS 2 units (50000), no observer; crew Alice 2pts / Bob 1pt ACTIVE"
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-CI2", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 10000 }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/gear-assets", payload: { gear_type: "LONGLINE", units_total: 4 }, as: VesselOwner, as_user_id: "${v1}", captures: { g1: $.data.id } }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-10T06:00:00Z", planned_return_utc: "2026-08-12T06:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { t1: $.data.id } }
            - { call: "POST /fishing-trips/${t1}/depart", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/catch-reports", payload: { fishery_code: "HALIBUT", report_type: "HARVEST", reported_lbs: 4000, reported_at: "2026-08-11T06:00:00Z" }, as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/expenses", payload: { category: "FUEL", amount_cents: 120000, incurred_at: "2026-08-11T00:00:00Z" }, as: Captain, as_user_id: "${v1}", captures: { e1: $.data.id } }
            - { call: "POST /fishing-trips/${t1}/expenses", payload: { category: "BAIT", amount_cents: 30000, incurred_at: "2026-08-11T01:00:00Z" }, as: Captain, as_user_id: "${v1}", captures: { e2: $.data.id } }
            - { call: "POST /gear-assets/${g1}/events", payload: { event_type: "LOSS", units: 2, occurred_at: "2026-08-11T05:00:00Z", trip_id: "${t1}" }, as: Captain, as_user_id: "${v1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips/${t1}/return", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/landing-declarations", payload: { port_code: "HOMER", lines: [{ fishery_code: "HALIBUT", declared_lbs: 4000 }] }, as: Captain, as_user_id: "${v1}", captures: { ld1: $.data.id } }
            - { call: "POST /landing-declarations/${ld1}/submit", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /landing-declarations/${ld1}/verify", as: FisheriesRegulator }
            - { call: "POST /landing-declarations/${ld1}/finalize", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/crew-contracts", payload: { crew_name: "Alice", share_points: 2, joined_at: "2026-01-15T00:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { c1: $.data.id } }
            - { call: "POST /vessels/${v1}/crew-contracts", payload: { crew_name: "Bob", share_points: 1, joined_at: "2026-02-01T00:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { c2: $.data.id } }
            - { call: "POST /expenses/${e1}/verify", as: SettlementClerk }
            - { call: "POST /expenses/${e2}/verify", as: SettlementClerk }
            - { call: "POST /fishing-trips/${t1}/settlement", payload: { gross_revenue_cents: 1000000 }, as: SettlementClerk, captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /trip-settlements/${s1}/calculate", as: SettlementClerk }
            - { call: "POST /trip-settlements/${s1}/dispute", as: CrewMember, as_user_id: "${c1}", captures: { s_vd: $.data.version } }
            - { call: "POST /trip-settlements/${s1}/recalculate", payload: { expected_settlement_version: "${s_vd}" }, as: SettlementClerk, captures: { pool2: $.data.crew_pool_cents, share2: $.data.vessel_share_cents } }
          assert:
            - "after calculate: 150000 + 0 + 50000 + 12000 + 472800 + 315200 == 1000000 == gross_revenue_cents"
            - "sum(crew_payouts.payout_cents) == 315200 == crew_pool_cents (210134 + 105066)"
            - "dispute -> DISPUTED; recalculate (expected_settlement_version captured from the dispute response) -> CALCULATED"
            - "after recalculate crew_pool_cents == 315200 and vessel_share_cents == 472800 (bit-identical, no drift)"

      - name: compliance_points_conserved_across_adjudicate_reverse
        grounds:
          - state_machines.ComplianceViolation.OPEN_to_ADJUDICATED
          - state_machines.ComplianceViolation.APPEALED_to_REVERSED
          - calculations.violation_penalty_score
        distinguishing_aspect: |
          Conserved quantity: vessel compliance_points. Adjudication deducts the
          stored severity (20) and a successful appeal refunds exactly the stored
          severity, restoring 100; a different conserved quantity than quota or
          money, and the refund path reads stored severity_points rather than
          recomputing (recomputation after the deduction would use a lower tier).
        test_recipe:
          setup:
            - "ACTIVE vessel compliance_points 100; one OPEN OVER_QUOTA violation"
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-CI3", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /violations", payload: { vessel_id: "${v1}", violation_type: "OVER_QUOTA", details: "d1" }, as: FisheriesRegulator, captures: { n1: $.data.id } }
          trigger:
            - { call: "POST /violations/${n1}/adjudicate", as: FisheriesRegulator, captures: { sev: $.data.severity_points } }
            - { call: "GET /vessels/${v1}", as: FisheriesRegulator, captures: { pts_mid: $.data.compliance_points } }
            - { call: "POST /violations/${n1}/appeal", as: VesselOwner, as_user_id: "${v1}" }
            - { call: "POST /violations/${n1}/reverse", as: FisheriesRegulator }
            - { call: "GET /vessels/${v1}", as: FisheriesRegulator, captures: { pts_end: $.data.compliance_points, vstat: $.data.status } }
          assert:
            - "severity_points == 20 and compliance_points == 80 after adjudication"
            - "after appeal + reverse: compliance_points == 100 (exact restoration)"
            - "Vessel.${v1}.status == ACTIVE throughout (80 and 100 are both >= 50)"
            - "ComplianceViolation.${n1}.status == REVERSED"
