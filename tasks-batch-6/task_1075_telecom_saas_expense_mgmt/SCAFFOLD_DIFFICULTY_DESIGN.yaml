          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "Acme SaaS", vendor_type: "SAAS" }
              as: Sourcing
              captures: { v_id: $.data.id }
            - call: "POST /contracts"
              payload: { vendor_id: "${v_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", renewal_notice_days: 60 }
              as: Sourcing
              captures: { c_id: $.data.id }
            - call: "POST /contracts/${c_id}/activate"
              payload: {}
              as: Sourcing
            - call: "POST /services"
              payload: { contract_id: "${c_id}", service_type: "SAAS_SUBSCRIPTION", license_type: "PER_SEAT", unit_rate_cents: 2000, contracted_quantity: 60, active_quantity: 42 }
              as: Sourcing
              captures: { s_id: $.data.id }
            - call: "POST /invoices"
              payload: { contract_id: "${c_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: Analyst
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/line-items"
              payload: { service_id: "${s_id}", billing_period_start: "2026-06-01T00:00:00Z", billing_period_end: "2026-07-01T00:00:00Z", billed_quantity: 60, billed_amount_cents: 100000 }
              as: Analyst
              captures: { li_id: $.data.id }
          trigger:
            - call: "POST /invoice-line-items/${li_id}/disputes"
              payload: { disputed_amount_cents: 5000, claimed_credit_cents: 5000 }
              as: Analyst
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_LINE_NOT_DISPUTABLE"
            - "InvoiceLineItem.${li_id}.status == BILLED (unchanged)"

  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: billing_period_overlap_half_open
        grounds:
          - validations[priority=8]
          - errors[ERR_BILLING_PERIOD_OVERLAP]
          - entities.InvoiceLineItem.fields.billing_period_start
        distinguishing_aspect: |
          A second line item for the same service with a half-open period [2026-06-15, 2026-07-15) overlapping the existing
          [2026-06-01, 2026-07-01) is rejected; half-open semantics mean an adjacent [2026-07-01, ...) would be allowed.
        test_recipe:
          setup:
            - "Invoice with an existing line on service S over [2026-06-01, 2026-07-01)."
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "Acme SaaS", vendor_type: "SAAS" }
              as: Sourcing
              captures: { v_id: $.data.id }
            - call: "POST /contracts"
              payload: { vendor_id: "${v_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", renewal_notice_days: 60 }
              as: Sourcing
              captures: { c_id: $.data.id }
            - call: "POST /contracts/${c_id}/activate"
              payload: {}
              as: Sourcing
            - call: "POST /services"
              payload: { contract_id: "${c_id}", service_type: "SAAS_SUBSCRIPTION", license_type: "PER_SEAT", unit_rate_cents: 2000, contracted_quantity: 60, active_quantity: 42 }
              as: Sourcing
              captures: { s_id: $.data.id }
            - call: "POST /invoices"
              payload: { contract_id: "${c_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-31T00:00:00Z" }
              as: Analyst
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/line-items"
              payload: { service_id: "${s_id}", billing_period_start: "2026-06-01T00:00:00Z", billing_period_end: "2026-07-01T00:00:00Z", billed_quantity: 10, billed_amount_cents: 10000 }
              as: Analyst
              captures: { l1_id: $.data.id }
          trigger:
            - call: "POST /invoices/${inv_id}/line-items"
              payload: { service_id: "${s_id}", billing_period_start: "2026-06-15T00:00:00Z", billing_period_end: "2026-07-15T00:00:00Z", billed_quantity: 10, billed_amount_cents: 10000 }
              as: Analyst
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_BILLING_PERIOD_OVERLAP"
            - "HTTP status == 409"

      - name: contract_term_overlap_closed_same_vendor
        grounds:
          - state_machines.Contract.DRAFT_to_ACTIVE
          - validations[priority=8]
          - errors[ERR_CONTRACT_TERM_OVERLAP]
        distinguishing_aspect: |
          Activating a second contract for the same vendor with closed term [2026-06-01, 2027-05-31] intersecting an existing
          ACTIVE [2026-01-01, 2026-12-31] is rejected; closed-interval semantics treat even a shared endpoint as overlap,
          unlike the half-open billing rule. Different resource entity (Contract term) and different interval geometry.
        test_recipe:
          setup:
            - "One ACTIVE contract for vendor V over [2026-01-01, 2026-12-31]; a second DRAFT contract for V over [2026-06-01, 2027-05-31]."
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "Acme SaaS", vendor_type: "SAAS" }
              as: Sourcing
              captures: { v_id: $.data.id }
            - call: "POST /contracts"
              payload: { vendor_id: "${v_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", renewal_notice_days: 60 }
              as: Sourcing
              captures: { c1_id: $.data.id }
            - call: "POST /contracts/${c1_id}/activate"
              payload: {}
              as: Sourcing
            - call: "POST /contracts"
              payload: { vendor_id: "${v_id}", term_start: "2026-06-01T00:00:00Z", term_end: "2027-05-31T00:00:00Z", renewal_notice_days: 60 }
              as: Sourcing
              captures: { c2_id: $.data.id }
          trigger:
            - call: "POST /contracts/${c2_id}/activate"
              payload: {}
              as: Sourcing
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CONTRACT_TERM_OVERLAP"
            - "Contract.${c2_id}.status == DRAFT (unchanged)"

  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: chargeback_sum_conserves_line_net
        grounds:
          - calculations.chargeback_allocation
          - entities.Allocation.fields.amount_cents
          - entities.InvoiceLineItem.fields.net_amount_cents
        distinguishing_aspect: |
          The forward chargeback split conserves the quantity Sigma(Allocation.amount_cents) == InvoiceLineItem.net_amount_cents
          (== 90500) despite per-share rounding; no cent is created or lost. Conserved quantity = allocated cents.
        test_recipe:
          setup:
            - "A line with net_amount_cents=90500 and three cost centers A/B/C."
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "Acme SaaS", vendor_type: "SAAS" }
              as: Sourcing
              captures: { v_id: $.data.id }
            - call: "POST /contracts"
              payload: { vendor_id: "${v_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", renewal_notice_days: 60 }
              as: Sourcing
              captures: { c_id: $.data.id }
            - call: "POST /contracts/${c_id}/activate"
              payload: {}
              as: Sourcing
            - call: "POST /services"
              payload: { contract_id: "${c_id}", service_type: "SAAS_SUBSCRIPTION", license_type: "PER_SEAT", unit_rate_cents: 2000, contracted_quantity: 60, active_quantity: 42 }
              as: Sourcing
              captures: { s_id: $.data.id }
            - call: "POST /invoices"
              payload: { contract_id: "${c_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: Analyst
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/line-items"
              payload: { service_id: "${s_id}", billing_period_start: "2026-06-01T00:00:00Z", billing_period_end: "2026-07-01T00:00:00Z", billed_quantity: 60, billed_amount_cents: 90500 }
              as: Analyst
              captures: { li_id: $.data.id }
            - call: "POST /cost-centers"
              payload: { code: "CC-A", gl_account: "6000", owner_user_id: "own_a" }
              as: SystemAdmin
              captures: { cc_a: $.data.id }
            - call: "POST /cost-centers"
              payload: { code: "CC-B", gl_account: "6001", owner_user_id: "own_b" }
              as: SystemAdmin
              captures: { cc_b: $.data.id }
            - call: "POST /cost-centers"
              payload: { code: "CC-C", gl_account: "6002", owner_user_id: "own_c" }
              as: SystemAdmin
              captures: { cc_c: $.data.id }
          trigger:
            - call: "POST /invoice-line-items/${li_id}/allocations"
              payload: { allocations: [ { cost_center_id: "${cc_a}", weight_pct: 33.33 }, { cost_center_id: "${cc_b}", weight_pct: 33.33 }, { cost_center_id: "${cc_c}", weight_pct: 33.34 } ] }
              as: Analyst
              captures: { a0: "$.data[0].amount_cents", a1: "$.data[1].amount_cents", a2: "$.data[2].amount_cents"}
          assert:
            - "a0 + a1 + a2 == 90500"
            - "InvoiceLineItem.${li_id}.net_amount_cents == 90500"

      - name: recovered_ledger_conserved_on_dispute_withdraw
        grounds:
          - state_machines.Dispute.SUBMITTED_to_WITHDRAWN
          - entities.Contract.fields.total_recovered_cents
          - calculations.contract_recovered_ledger
        distinguishing_aspect: |
          Opening then withdrawing a dispute is a forward/compensation pair that issues no Credit, so
          Contract.total_recovered_cents stays 0 (== Sigma of ISSUED Credit amounts). Conserved quantity = recovered credit
          ledger (distinct from the allocation-sum invariant).
        test_recipe:
          setup:
            - "Invoice UNDER_REVIEW with a line billed 100000; contract total_recovered_cents == 0; a SUBMITTED dispute open on the line."
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "Acme SaaS", vendor_type: "SAAS" }
              as: Sourcing
              captures: { v_id: $.data.id }
            - call: "POST /contracts"
              payload: { vendor_id: "${v_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", renewal_notice_days: 60 }
              as: Sourcing
              captures: { c_id: $.data.id }
            - call: "POST /contracts/${c_id}/activate"
              payload: {}
              as: Sourcing
            - call: "POST /services"
              payload: { contract_id: "${c_id}", service_type: "SAAS_SUBSCRIPTION", license_type: "PER_SEAT", unit_rate_cents: 2000, contracted_quantity: 60, active_quantity: 42 }
              as: Sourcing
              captures: { s_id: $.data.id }
            - call: "POST /invoices"
              payload: { contract_id: "${c_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: Analyst
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/line-items"
              payload: { service_id: "${s_id}", billing_period_start: "2026-06-01T00:00:00Z", billing_period_end: "2026-07-01T00:00:00Z", billed_quantity: 60, billed_amount_cents: 100000 }
              as: Analyst
              captures: { li_id: $.data.id }
            - call: "POST /invoices/${inv_id}/review"
              payload: {}
              as: Analyst
            - call: "POST /invoice-line-items/${li_id}/disputes"
              payload: { disputed_amount_cents: 8000, claimed_credit_cents: 8000 }
              as: Analyst
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /disputes/${d_id}/withdraw"
              payload: {}
              as: Analyst
              captures: { d_status: $.data.status }
          assert:
            - "Contract.${c_id}.total_recovered_cents == 0 after withdraw"
            - "d_status == WITHDRAWN"
            - "InvoiceLineItem.${li_id}.status == BILLED after withdraw"

