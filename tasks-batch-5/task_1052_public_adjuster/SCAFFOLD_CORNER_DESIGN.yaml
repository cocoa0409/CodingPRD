      - name: unauthenticated_missing_headers_rejected
        claim_type: Cannot perform other role's op
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with missing/invalid X-User-ID/X-User-Role headers returns ERR_UNAUTHENTICATED (401); the downstream test issues GET /v1/adjusters/{id} with no auth headers."
        test_recipe:
          setup: ["An adjuster exists."]
          setup_api_calls:
            - { call: "POST /v1/adjusters", payload: { full_name: "Ada PA", firm_name: "Advocate LLC", email: "ada@x.com" }, as: FirmPrincipal, captures: { adj: $.data.id } }
          trigger:
            - { call: "GET /v1/adjusters/${adj}", payload: {}, as: FirmPrincipal, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_UNAUTHENTICATED"
            - "HTTP status == 401 when the request omits X-User-ID/X-User-Role"

