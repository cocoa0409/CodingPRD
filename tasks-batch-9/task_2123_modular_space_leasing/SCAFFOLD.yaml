# =============================================================================
# PRD Benchmark Seed Tables — Modular Space & Mobile Office Leasing
# Sections §1.0 – §1.7.  §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml and
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml (siblings of this file).
# =============================================================================

scenario: |
  desgin task harder than expert level.!!!! 2123. Modular Space & Mobile Office Leasing (WillScot style lessor): building spec & floorplan configuration, lease term & rate with delivery/installation, permit & foundation/anchoring by jurisdiction, steps/ramp ADA accessory package, damage assessment at teardown, refurbishment between leases, fleet inventory across branches, relocation & lease extension

domain_name: modular-space-leasing
api_prefix: "/"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a root-level collection joined by explicit foreign keys.
  # No entity is nested inside another's URL path; the only sub-resource route
  # is the append-only DamageLineItem log under its assessment.

  state_machine_shape: cyclic
  # Unit.status is a true refurbishment loop
  #   IN_FLEET -> RESERVED -> IN_TRANSIT -> ON_LEASE -> RETURNED -> REFURBISHING -> IN_FLEET
  # Lease carries two INDEPENDENT state axes (occupancy_status x billing_status)
  # and DamageAssessment cycles SUBMITTED <-> DISPUTED.

  relationship_patterns:
    - one_to_many          # Branch -> Unit, Lease -> AccessoryPackage/PermitApplication/LogisticsJob
    - self_referential     # Lease.extends_lease_id -> Lease.id (extension chain)
    - cross_aggregate      # RefurbishmentOrder spans Unit, Branch and DamageAssessment

  role_model: segregation_of_duties
  # The FleetAdmin operator id that approves a RefurbishmentOrder MUST NOT be the
  # DamageAssessor operator id that authored the underlying DamageAssessment.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Branch
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Depot / yard display name.
      - name: region_code
        type: string
        source: input
        description: Operating region label, e.g. "TX-N".
      - name: yard_capacity_units
        type: integer
        source: input
        description: Maximum number of units that may sit in this yard at once.
        constraints: ">= 1"
      - name: daily_dispatch_capacity
        type: integer
        source: input
        description: Maximum LogisticsJob records this branch may hold per scheduled_date calendar day.
        constraints: ">= 1"
      - name: labor_rate_cents_per_hour
        type: integer
        source: input
        description: Crew labour rate used by transport_cost and refurbishment_estimate.
        constraints: ">= 0"
      - name: status
        type: enum
        source: input
        description: Operational posture of the yard.
        default: OPERATIONAL
        constraints: "OPERATIONAL | SUSPENDED"
      - name: units_in_yard
        type: integer
        source: computed
        description: "COUNT(Unit WHERE current_branch_id == this.id AND status IN {IN_FLEET, RESERVED, RETURNED, REFURBISHING}). Recomputed by calculations.branch_fleet_inventory."
        default: 0
      - name: units_available
        type: integer
        source: computed
        description: "COUNT(Unit WHERE current_branch_id == this.id AND status == IN_FLEET). Recomputed by calculations.branch_fleet_inventory."
        default: 0
      - name: utilization_pct
        type: number
        source: computed
        description: "Percent of the branch's assigned fleet that is NOT immediately leasable. Recomputed by calculations.branch_fleet_inventory."
        default: 0.00

  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Unique permitting-authority code, e.g. "TX-DAL".
        constraints: "unique across all Jurisdiction rows"
      - name: name
        type: string
        source: input
        description: Human-readable authority name.
      - name: permit_required
        type: boolean
        source: input
        description: When true a PermitApplication must reach APPROVED before a DELIVERY_INSTALL job may be dispatched.
      - name: permit_lead_days
        type: integer
        source: input
        description: Minimum whole days that must remain between the logical clock date at submit time and Lease.start_date.
        constraints: ">= 0"
      - name: anchoring_standard
        type: enum
        source: input
        description: Foundation / anchoring class this authority mandates.
        constraints: "NONE | GROUND_ANCHOR | PIER_FOUNDATION | ENGINEERED_SLAB"
      - name: wind_zone
        type: integer
        source: input
        description: Wind exposure zone driving the rate multiplier.
        constraints: "1 | 2 | 3 | 4"
      - name: permit_fee_cents
        type: integer
        source: input
        description: Flat authority filing fee, before the per-area component.
        constraints: ">= 0"
      - name: ada_ramp_required
        type: boolean
        source: input
        description: When true a DELIVERY_INSTALL job may only be created if the lease's AccessoryPackage is COMPLIANT.
      - name: min_ramp_run_ratio
        type: number
        source: input
        description: Required run-to-rise ratio for an ADA ramp (12.0 means 12 ft of run per 1 ft of rise).
        constraints: "> 0"

  - name: BuildingSpec
    parent: null
    common_fields: true
    fields:
      - name: model_code
        type: string
        source: input
        description: Unique catalog model code.
        constraints: "unique across all BuildingSpec rows"
      - name: width_ft
        type: number
        source: input
        description: Overall building width in feet.
        constraints: "> 0"
      - name: length_ft
        type: number
        source: input
        description: Overall building length in feet.
        constraints: "> 0"
      - name: sections
        type: integer
        source: input
        description: Number of transportable sections (1 = single-wide). Drives the oversize transport component.
        constraints: "1..4"
      - name: floor_height_in
        type: number
        source: input
        description: Finished-floor height above grade in inches; the rise an ADA ramp must overcome.
        constraints: ">= 0"
      - name: base_monthly_rate_cents
        type: integer
        source: input
        description: List monthly rent before term, wind-zone and credit-tier factors.
        constraints: ">= 0"
      - name: delivery_base_cents
        type: integer
        source: input
        description: List delivery charge feeding the mobilization subtotal.
        constraints: ">= 0"
      - name: install_base_cents
        type: integer
        source: input
        description: List installation charge feeding the mobilization subtotal.
        constraints: ">= 0"
      - name: replacement_value_cents
        type: integer
        source: input
        description: Insured replacement value; caps damage chargeback and the wear allowance.
        constraints: ">= 0"
      - name: max_occupancy
        type: integer
        source: input
        description: Rated occupant count (informational).
        constraints: ">= 1"
      - name: floor_area_sqft
        type: number
        source: computed
        description: "width_ft * length_ft. Recomputed by calculations.floorplan_config_surcharge inputs and permit_fee."

  - name: FloorplanConfiguration
    parent: null
    common_fields: true
    fields:
      - name: building_spec_id
        type: string
        source: input
        description: FK -> BuildingSpec.id; the shell this floorplan is cut into.
      - name: name
        type: string
        source: input
        description: Configuration display name.
      - name: private_offices
        type: integer
        source: input
        description: Count of framed private offices.
        constraints: ">= 0"
      - name: restrooms
        type: integer
        source: input
        description: Count of plumbed restrooms.
        constraints: ">= 0"
      - name: partition_linear_ft
        type: number
        source: input
        description: Linear feet of interior partition wall.
        constraints: ">= 0"
      - name: hvac_tons
        type: number
        source: input
        description: Installed HVAC tonnage.
        constraints: ">= 0"
      - name: config_surcharge_cents
        type: integer
        source: computed
        description: "Output of calculations.floorplan_config_surcharge; amortized into Lease.monthly_base_rate_cents."
      - name: status
        type: enum
        source: system
        description: Only a PUBLISHED configuration may be referenced by a new Lease.
        default: DRAFT
        constraints: "DRAFT | PUBLISHED"

  - name: Unit
    parent: null
    common_fields: true
    fields:
      - name: serial_number
        type: string
        source: input
        description: Unique fleet serial number.
        constraints: "unique across all Unit rows"
      - name: building_spec_id
        type: string
        source: input
        description: FK -> BuildingSpec.id; the model this physical unit is.
      - name: current_branch_id
        type: string
        source: input
        description: FK -> Branch.id; branch that currently owns custody of this unit.
      - name: installed_config_id
        type: string
        source: system
        description: FK -> FloorplanConfiguration.id; set when a DELIVERY_INSTALL job completes, never cleared.
        default: null
      - name: status
        type: enum
        source: system
        description: Fleet lifecycle position; see §1.2 Unit state machine.
        default: IN_FLEET
        constraints: "IN_FLEET | RESERVED | IN_TRANSIT | ON_LEASE | RETURNED | REFURBISHING"
      - name: condition_grade
        type: enum
        source: input
        description: Physical condition grade; rewritten to RefurbishmentOrder.target_condition_grade on refurb completion.
        default: A
        constraints: "A | B | C | D"
      - name: lifetime_relocations
        type: integer
        source: computed
        description: Number of RELOCATION jobs completed against this unit.
        default: 0
      - name: refurb_cycles
        type: integer
        source: computed
        description: Number of RefurbishmentOrder rows that reached COMPLETED for this unit.
        default: 0
      - name: accumulated_damage_cents
        type: integer
        source: computed
        description: Running sum of DamageAssessment.chargeable_cents absorbed by completed refurbishments.
        default: 0
      - name: latest_quote_estimate_cents
        type: integer
        source: computed
        description: estimated_cost_cents of the newest QUOTED RefurbishmentOrder on this unit; 0 when none is open.
        default: 0

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Lessee legal name.
      - name: billing_email
        type: string
        source: input
        description: Billing contact address.
      - name: credit_tier
        type: enum
        source: input
        description: Credit standing; discounts rent and is demoted to WATCH when credit_hold flips to true.
        default: STANDARD
        constraints: "PLATINUM | GOLD | STANDARD | WATCH"
      - name: credit_limit_cents
        type: integer
        source: input
        description: Maximum tolerated outstanding balance.
        constraints: ">= 0"
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: "Output of calculations.customer_exposure."
        default: 0
      - name: credit_hold
        type: boolean
        source: computed
        description: "true when outstanding_balance_cents > credit_limit_cents (strict). Output of calculations.customer_exposure."
        default: false

  - name: Lease
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: FK -> Customer.id; the lessee.
      - name: unit_id
        type: string
        source: input
        description: FK -> Unit.id; the physical unit occupied by this lease.
      - name: jurisdiction_id
        type: string
        source: input
        description: FK -> Jurisdiction.id; permitting authority governing the site.
      - name: floorplan_configuration_id
        type: string
        source: input
        description: FK -> FloorplanConfiguration.id; must be PUBLISHED and belong to the unit's building_spec_id.
      - name: extends_lease_id
        type: string
        source: system
        description: FK -> Lease.id; set only on a successor created by POST /leases/{id}/extensions.
        default: null
      - name: site_address
        type: string
        source: input
        description: Delivery site street address; rewritten when a RELOCATION job completes.
      - name: start_date
        type: string
        source: input
        description: First occupied calendar day, ISO yyyy-mm-dd.
      - name: term_months
        type: integer
        source: input
        description: Contracted term in 30-day months.
        constraints: ">= 1"
      - name: end_date
        type: string
        source: computed
        description: "start_date + (term_months * 30) - 1 day, ISO yyyy-mm-dd. Closed interval end."
      - name: occupancy_status
        type: enum
        source: system
        description: Physical occupancy axis; evolves independently of billing_status.
        default: PENDING
        constraints: "PENDING | INSTALLED | VACATED | CANCELLED"
      - name: billing_status
        type: enum
        source: system
        description: Money axis; evolves independently of occupancy_status.
        default: UNBILLED
        constraints: "UNBILLED | ACCRUING | SETTLED | VOIDED"
      - name: pinned_credit_tier
        type: enum
        source: system
        description: Copy of Customer.credit_tier taken at lease creation; later demotions never re-rate this lease.
        constraints: "PLATINUM | GOLD | STANDARD | WATCH"
      - name: monthly_base_rate_cents
        type: integer
        source: computed
        description: "Output of calculations.lease_monthly_rate."
      - name: monthly_accessory_rate_cents
        type: integer
        source: computed
        description: monthly_accessory_rate_cents of this lease's AccessoryPackage, 0 when none is attached.
        default: 0
      - name: mobilization_fee_cents
        type: integer
        source: computed
        description: "Output of calculations.lease_mobilization_fee; always 0 on an extension successor."
      - name: quoted_total_cents
        type: integer
        source: computed
        description: "Output of calculations.lease_charge_total variant quoted_projection."
      - name: final_settlement_cents
        type: integer
        source: computed
        description: "Output of calculations.lease_charge_total variant settled_actual; null until billing_status becomes SETTLED."
        default: null
      - name: relocation_surcharge_cents
        type: integer
        source: computed
        description: Accumulated pass-through of completed RELOCATION transport cost; enters settled_actual only.
        default: 0
      - name: billed_to_date_cents
        type: integer
        source: computed
        description: Gross amount charged to the customer for this lease so far.
        default: 0
      - name: credited_cents
        type: integer
        source: computed
        description: Gross amount credited back for this lease so far.
        default: 0
      - name: actual_vacated_date
        type: string
        source: system
        description: Logical-clock date on which the TEARDOWN_RETURN job completed, ISO yyyy-mm-dd.
        default: null
      - name: assessment_round
        type: integer
        source: computed
        description: Number of DamageAssessment rows ever created against this lease.
        default: 0

  - name: AccessoryPackage
    parent: null
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: FK -> Lease.id; at most one package per lease.
      - name: package_type
        type: enum
        source: input
        description: Which steps/ramp kit is leased with the building.
        constraints: "STEPS | RAMP_ADA | COMBO"
      - name: ramp_run_ft
        type: number
        source: input
        description: Horizontal ramp run in feet; 0 for a STEPS-only package.
        default: 0
        constraints: ">= 0"
      - name: landing_count
        type: integer
        source: input
        description: Number of intermediate/top landings supplied with the ramp.
        default: 0
        constraints: ">= 0"
      - name: step_count
        type: integer
        source: input
        description: Number of treads in the step unit.
        default: 0
        constraints: ">= 0"
      - name: monthly_accessory_rate_cents
        type: integer
        source: computed
        description: "Output of calculations.accessory_package_rate."
      - name: compliance_status
        type: enum
        source: computed
        description: "Output of calculations.ada_ramp_compliance."
        constraints: "COMPLIANT | NON_COMPLIANT"

  - name: PermitApplication
    parent: null
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: FK -> Lease.id; the site this permit covers.
      - name: jurisdiction_id
        type: string
        source: input
        description: FK -> Jurisdiction.id; must equal the lease's jurisdiction_id.
      - name: foundation_type
        type: enum
        source: input
        description: Proposed foundation/anchoring class; must equal the jurisdiction's anchoring_standard.
        constraints: "NONE | GROUND_ANCHOR | PIER_FOUNDATION | ENGINEERED_SLAB"
      - name: status
        type: enum
        source: system
        description: Permit review position; see §1.2 PermitApplication state machine.
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | APPROVED | REJECTED"
      - name: permit_fee_cents
        type: integer
        source: computed
        description: "Output of calculations.permit_fee."
      - name: submitted_on
        type: string
        source: system
        description: Logical-clock date of submission, ISO yyyy-mm-dd.
        default: null
      - name: decided_on
        type: string
        source: system
        description: Logical-clock date of the authority's decision, ISO yyyy-mm-dd.
        default: null
      - name: reviewer_note
        type: string
        source: system
        description: Free-text note captured on the decision.
        default: null

  - name: LogisticsJob
    parent: null
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: FK -> Lease.id; every job belongs to exactly one lease.
      - name: unit_id
        type: string
        source: system
        description: FK -> Unit.id; copied from the lease at creation, never client-supplied.
      - name: origin_branch_id
        type: string
        source: input
        description: FK -> Branch.id; branch supplying the crew and holding dispatch capacity.
      - name: destination_branch_id
        type: string
        source: input
        description: FK -> Branch.id; required for TEARDOWN_RETURN (receiving yard), must be omitted otherwise.
        default: null
      - name: job_type
        type: enum
        source: input
        description: Which physical move this job performs.
        constraints: "DELIVERY_INSTALL | TEARDOWN_RETURN | RELOCATION"
      - name: scheduled_date
        type: string
        source: input
        description: Calendar day the crew is booked, ISO yyyy-mm-dd.
      - name: mileage_miles
        type: number
        source: input
        description: One-way haul distance in miles.
        constraints: ">= 0"
      - name: crew_hours
        type: number
        source: input
        description: Booked crew hours.
        constraints: ">= 0"
      - name: new_site_address
        type: string
        source: input
        description: Destination street address; required for RELOCATION, must be omitted otherwise.
        default: null
      - name: status
        type: enum
        source: system
        description: Job lifecycle; see §1.2 LogisticsJob state machine.
        default: SCHEDULED
        constraints: "SCHEDULED | DISPATCHED | COMPLETED | CANCELLED"
      - name: transport_cost_cents
        type: integer
        source: computed
        description: "Output of calculations.transport_cost."

  - name: DamageAssessment
    parent: null
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: FK -> Unit.id; the returned unit being assessed.
      - name: lease_id
        type: string
        source: input
        description: FK -> Lease.id; the lease whose teardown produced this assessment.
      - name: logistics_job_id
        type: string
        source: input
        description: FK -> LogisticsJob.id; must be a COMPLETED TEARDOWN_RETURN job of the same lease.
      - name: assessor_user_id
        type: string
        source: system
        description: X-User-ID of the DamageAssessor that created the row; blocks that same operator from approving the refurbishment.
      - name: status
        type: enum
        source: system
        description: Assessment review position; see §1.2 DamageAssessment state machine.
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | DISPUTED | FINALIZED | SUPERSEDED"
      - name: dispute_rounds
        type: integer
        source: computed
        description: Number of times the customer has disputed this assessment.
        default: 0
      - name: condition_grade_before
        type: enum
        source: system
        description: Copy of Unit.condition_grade at assessment creation.
        constraints: "A | B | C | D"
      - name: condition_grade_after
        type: enum
        source: system
        description: Grade recorded at finalization.
        default: null
        constraints: "A | B | C | D"
      - name: gross_damage_cents
        type: integer
        source: computed
        description: "Output of calculations.damage_chargeback variant assessor_provisional."
        default: 0
      - name: wear_allowance_cents
        type: integer
        source: computed
        description: "Output of calculations.damage_chargeback variant finalized_net (allowance leg)."
        default: 0
      - name: chargeable_cents
        type: integer
        source: computed
        description: "Output of calculations.damage_chargeback variant finalized_net (net leg)."
        default: 0
      - name: dispute_reason
        type: string
        source: system
        description: Free text captured on the most recent dispute.
        default: null

  - name: DamageLineItem
    parent: null
    common_fields: false
    fields:
      - name: damage_assessment_id
        type: string
        source: input
        description: FK -> DamageAssessment.id; append-only child of the assessment.
      - name: component
        type: enum
        source: input
        description: Damaged building component.
        constraints: "FLOOR | WALL | HVAC | ROOF | DOOR | ELECTRICAL"
      - name: severity
        type: enum
        source: input
        description: Damage severity band.
        constraints: "MINOR | MODERATE | SEVERE"
      - name: quantity
        type: number
        source: input
        description: Repair quantity multiplier.
        constraints: "> 0"
      - name: wear_and_tear
        type: boolean
        source: input
        description: When true this line is eligible for the normal-wear allowance at finalization.
      - name: repair_cost_cents
        type: integer
        source: computed
        description: "Output of calculations.damage_line_repair_cost."

  - name: RefurbishmentOrder
    parent: null
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: FK -> Unit.id; the unit being refurbished between leases.
      - name: branch_id
        type: string
        source: input
        description: FK -> Branch.id; yard performing the work; supplies labor_rate_cents_per_hour.
      - name: damage_assessment_id
        type: string
        source: input
        description: FK -> DamageAssessment.id; must be FINALIZED and reference the same unit.
      - name: scope
        type: enum
        source: input
        description: Refurbishment depth.
        constraints: "COSMETIC | STANDARD | FULL"
      - name: labor_hours
        type: number
        source: input
        description: Estimated shop hours.
        constraints: ">= 0"
      - name: parts_cost_cents
        type: integer
        source: input
        description: Estimated parts spend before the scope factor.
        constraints: ">= 0"
      - name: target_condition_grade
        type: enum
        source: input
        description: Grade the unit is expected to carry after the work.
        constraints: "A | B | C | D"
      - name: estimated_cost_cents
        type: integer
        source: computed
        description: "Output of calculations.refurbishment_estimate."
      - name: actual_cost_cents
        type: integer
        source: system
        description: Actual spend recorded at completion.
        default: null
      - name: status
        type: enum
        source: system
        description: Work-order position; see §1.2 RefurbishmentOrder state machine.
        default: QUOTED
        constraints: "QUOTED | APPROVED | REJECTED | COMPLETED | SUPERSEDED"
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the FleetAdmin that approved the order.
        default: null
      - name: rejection_reason
        type: string
        source: system
        description: Free text captured on rejection.
        default: null

# =============================================================================
# §1.2 State Machine Table
# Seven machines. Unit.status is a closed refurbishment cycle; Lease carries two
# independent axes; DamageAssessment loops SUBMITTED <-> DISPUTED; PermitApplication
# and RefurbishmentOrder fork with divergent side-effect sets per branch.
# =============================================================================
state_machines:

  - entity: Unit
    state_field: status
    initial_state: IN_FLEET
    terminal_states: []
    note: |
      Cyclic. IN_FLEET -> RESERVED -> IN_TRANSIT -> ON_LEASE -> RETURNED ->
      REFURBISHING -> IN_FLEET closes the loop, and RETURNED forks to either
      REFURBISHING (approve) or straight back to IN_FLEET (reject) with
      different side-effect sets. Yard membership is the status set
      {IN_FLEET, RESERVED, RETURNED, REFURBISHING}; {IN_TRANSIT, ON_LEASE} are
      off-yard.
    transitions:
      - transition_id: unit_infleet_to_reserved
        from: IN_FLEET
        to: RESERVED
        trigger: "POST /leases"
        actor: LeasingAgent
        preconditions:
          - "Unit.status == IN_FLEET"
          - "Branch(Unit.current_branch_id).status == OPERATIONAL"
          - "Unit.building_spec_id == FloorplanConfiguration(request.floorplan_configuration_id).building_spec_id"
        side_effects:
          - "Unit.version incremented by 1"
          - "recompute Branch.units_available and Branch.utilization_pct on Unit.current_branch_id per calculations.branch_fleet_inventory (Branch.units_in_yard is unchanged — RESERVED is still a yard status)"
        note: |
          A unit's availability for a NEW lease is decided by the occupancy calendar
          (validations priority 20), not by its instantaneous status. POST /leases
          therefore succeeds as a forward booking whenever Unit.status is anything
          other than REFURBISHING. This transition fires ONLY when the unit is
          currently IN_FLEET; from RESERVED, IN_TRANSIT, ON_LEASE or RETURNED the
          lease row is still created and Unit.version still increments by 1, but
          Unit.status is left exactly where it was.

      - transition_id: unit_reserved_to_infleet_on_void
        from: RESERVED
        to: IN_FLEET
        trigger: "POST /leases/{id}/void"
        actor: LeasingAgent
        preconditions:
          - "Lease.occupancy_status == PENDING"
          - "no LogisticsJob with lease_id == Lease.id and status IN {DISPATCHED, COMPLETED}"
          - "no OTHER Lease on this unit has occupancy_status == PENDING (a forward booking keeps the unit RESERVED)"
        side_effects:
          - "Unit.version incremented by 1"
          - "recompute Branch.units_available and Branch.utilization_pct on Unit.current_branch_id per calculations.branch_fleet_inventory"

      - transition_id: unit_reserved_to_intransit
        from: RESERVED
        to: IN_TRANSIT
        trigger: "POST /logistics-jobs/{id}/dispatch where LogisticsJob.job_type == DELIVERY_INSTALL"
        actor: BranchOps
        preconditions:
          - "LogisticsJob.status == SCHEDULED"
          - "Lease.billing_status == ACCRUING"
          - "Jurisdiction.permit_required == false OR a PermitApplication with lease_id == Lease.id has status == APPROVED"
        side_effects:
          - "Unit.version incremented by 1"
          - "recompute Branch.units_in_yard, Branch.units_available and Branch.utilization_pct on Unit.current_branch_id per calculations.branch_fleet_inventory (unit leaves the yard, so units_in_yard drops by 1)"

      - transition_id: unit_intransit_to_reserved_on_abort
        from: IN_TRANSIT
        to: RESERVED
        trigger: "POST /logistics-jobs/{id}/cancel where LogisticsJob.status == DISPATCHED and job_type == DELIVERY_INSTALL"
        actor: BranchOps
        preconditions:
          - "LogisticsJob.status == DISPATCHED"
          - "LogisticsJob.job_type == DELIVERY_INSTALL"
        side_effects:
          - "Unit.version incremented by 1"
          - "recompute Branch.units_in_yard, Branch.units_available and Branch.utilization_pct on Unit.current_branch_id per calculations.branch_fleet_inventory (unit re-enters the yard, so units_in_yard rises by 1 — exactly reversing unit_reserved_to_intransit)"

      - transition_id: unit_intransit_to_onlease
        from: IN_TRANSIT
        to: ON_LEASE
        trigger: "POST /logistics-jobs/{id}/complete where LogisticsJob.job_type == DELIVERY_INSTALL"
        actor: BranchOps
        preconditions:
          - "LogisticsJob.status == DISPATCHED"
        side_effects:
          - "Unit.installed_config_id set to Lease.floorplan_configuration_id"
          - "Unit.version incremented by 1"
          - "Lease.occupancy_status PENDING -> INSTALLED (see lease_pending_to_installed)"

      - transition_id: unit_onlease_to_intransit_teardown
        from: ON_LEASE
        to: IN_TRANSIT
        trigger: "POST /logistics-jobs/{id}/dispatch where LogisticsJob.job_type == TEARDOWN_RETURN"
        actor: BranchOps
        preconditions:
          - "LogisticsJob.status == SCHEDULED"
          - "Lease.occupancy_status == INSTALLED"
        side_effects:
          - "Unit.version incremented by 1"
          - "no Branch counter changes — ON_LEASE and IN_TRANSIT are both off-yard statuses"

      - transition_id: unit_intransit_to_returned
        from: IN_TRANSIT
        to: RETURNED
        trigger: "POST /logistics-jobs/{id}/complete where LogisticsJob.job_type == TEARDOWN_RETURN"
        actor: BranchOps
        preconditions:
          - "LogisticsJob.status == DISPATCHED"
          - "Branch(LogisticsJob.destination_branch_id).units_in_yard < Branch(LogisticsJob.destination_branch_id).yard_capacity_units"
        side_effects:
          - "Unit.current_branch_id set to LogisticsJob.destination_branch_id"
          - "Unit.version incremented by 1"
          - "recompute Branch.units_in_yard, Branch.units_available and Branch.utilization_pct on the destination branch per calculations.branch_fleet_inventory"
        note: "Caused by lease_installed_to_vacated; see that transition for the full cascade order."

      - transition_id: unit_onlease_relocation_selfloop
        from: ON_LEASE
        to: ON_LEASE
        trigger: "POST /logistics-jobs/{id}/complete where LogisticsJob.job_type == RELOCATION"
        actor: BranchOps
        preconditions:
          - "LogisticsJob.status == DISPATCHED"
          - "Lease.occupancy_status == INSTALLED"
        side_effects:
          - "Unit.lifetime_relocations incremented by 1"
          - "Lease.site_address set to LogisticsJob.new_site_address"
          - "Lease.relocation_surcharge_cents increased by round_half_up(LogisticsJob.transport_cost_cents * RELOCATION_PASSTHROUGH_PCT)"
          - "Unit.version incremented by 1; Lease.version incremented by 1"
          - "no Branch counter changes — the unit never re-enters a yard"

      - transition_id: unit_returned_to_refurbishing
        from: RETURNED
        to: REFURBISHING
        trigger: "POST /refurbishment-orders/{id}/approve"
        actor: FleetAdmin
        preconditions:
          - "RefurbishmentOrder.status == QUOTED"
          - "DamageAssessment(RefurbishmentOrder.damage_assessment_id).status == FINALIZED"
          - "X-User-ID != DamageAssessment.assessor_user_id"
        side_effects:
          - "RefurbishmentOrder.approved_by_user_id set to X-User-ID"
          - "Unit.version incremented by 1"
          - "recompute Branch.units_in_yard, Branch.units_available and Branch.utilization_pct (RETURNED and REFURBISHING are both yard statuses and both non-available, so all three values are unchanged)"

      - transition_id: unit_returned_to_infleet_on_reject
        from: RETURNED
        to: IN_FLEET
        trigger: "POST /refurbishment-orders/{id}/reject"
        actor: FleetAdmin
        preconditions:
          - "RefurbishmentOrder.status == QUOTED"
        side_effects:
          - "RefurbishmentOrder.rejection_reason stored"
          - "Unit.latest_quote_estimate_cents reset to 0"
          - "Unit.version incremented by 1"
          - "recompute Branch.units_available and Branch.utilization_pct per calculations.branch_fleet_inventory (unit becomes leasable again without any grade change)"
        note: "Divergent branch of unit_returned_to_refurbishing — no grade change, no refurb_cycles increment, no damage absorption."

      - transition_id: unit_refurbishing_to_infleet
        from: REFURBISHING
        to: IN_FLEET
        trigger: "POST /refurbishment-orders/{id}/complete"
        actor: BranchOps
        preconditions:
          - "RefurbishmentOrder.status == APPROVED"
        side_effects:
          - "Unit.condition_grade set to RefurbishmentOrder.target_condition_grade"
          - "Unit.refurb_cycles incremented by 1"
          - "Unit.accumulated_damage_cents increased by DamageAssessment.chargeable_cents"
          - "Unit.latest_quote_estimate_cents reset to 0"
          - "Unit.version incremented by 1"
          - "BECAUSE the unit re-entered IN_FLEET, recompute Branch.units_available per calculations.branch_fleet_inventory (rises by 1)"
          - "BECAUSE Branch.units_available changed, recompute Branch.utilization_pct per calculations.branch_fleet_inventory"

  - entity: Lease
    state_field: occupancy_status
    initial_state: PENDING
    terminal_states: [VACATED, CANCELLED]
    note: "Physical axis. Moves ONLY on logistics-job completion and on void; it never reacts to billing events."
    transitions:
      - transition_id: lease_pending_to_installed
        from: PENDING
        to: INSTALLED
        trigger: "POST /logistics-jobs/{id}/complete where LogisticsJob.job_type == DELIVERY_INSTALL"
        actor: BranchOps
        preconditions:
          - "LogisticsJob.status == DISPATCHED"
          - "Lease.occupancy_status == PENDING"
        side_effects:
          - "Unit IN_TRANSIT -> ON_LEASE (see unit_intransit_to_onlease)"
          - "Lease.version incremented by 1"
          - "Lease.billing_status is NOT touched"

      - transition_id: lease_installed_to_vacated
        from: INSTALLED
        to: VACATED
        trigger: "POST /logistics-jobs/{id}/complete where LogisticsJob.job_type == TEARDOWN_RETURN"
        actor: BranchOps
        preconditions:
          - "LogisticsJob.status == DISPATCHED"
          - "Lease.occupancy_status == INSTALLED"
        side_effects:
          - "Lease.actual_vacated_date set to the logical clock's calendar date"
          - "Lease.version incremented by 1"
          - "BECAUSE the lease vacated, its Unit moves IN_TRANSIT -> RETURNED and Unit.current_branch_id is rewritten to LogisticsJob.destination_branch_id (see unit_intransit_to_returned)"
          - "BECAUSE that unit re-entered a yard status at the destination branch, recompute Branch.units_in_yard, Branch.units_available and Branch.utilization_pct on the destination branch per calculations.branch_fleet_inventory"
          - "Lease.billing_status is NOT touched — settlement waits for damage finalization"

      - transition_id: lease_pending_to_cancelled
        from: PENDING
        to: CANCELLED
        trigger: "POST /leases/{id}/void"
        actor: LeasingAgent
        preconditions:
          - "Lease.occupancy_status == PENDING"
          - "no LogisticsJob with lease_id == Lease.id and status IN {DISPATCHED, COMPLETED}"
        side_effects:
          - "Lease.billing_status -> VOIDED (see lease_unbilled_to_voided / lease_accruing_to_voided)"
          - "Unit RESERVED -> IN_FLEET (see unit_reserved_to_infleet_on_void)"
          - "Lease.version incremented by 1"

  - entity: Lease
    state_field: billing_status
    initial_state: UNBILLED
    terminal_states: [SETTLED, VOIDED]
    note: "Money axis, independent of occupancy_status. A lease may be ACCRUING while still PENDING, and INSTALLED while still UNBILLED is impossible only because dispatch requires ACCRUING."
    transitions:
      - transition_id: lease_unbilled_to_accruing
        from: UNBILLED
        to: ACCRUING
        trigger: "POST /leases/{id}/activate"
        actor: LeasingAgent
        preconditions:
          - "Lease.billing_status == UNBILLED"
          - "Lease.occupancy_status == PENDING"
          - "FloorplanConfiguration(Lease.floorplan_configuration_id).status == PUBLISHED"
          - "Customer.outstanding_balance_cents + (Lease.mobilization_fee_cents + Lease.monthly_base_rate_cents + Lease.monthly_accessory_rate_cents) <= Customer.credit_limit_cents"
        side_effects:
          - "Lease.billed_to_date_cents set to Lease.mobilization_fee_cents + Lease.monthly_base_rate_cents + Lease.monthly_accessory_rate_cents"
          - "recompute Customer.outstanding_balance_cents and Customer.credit_hold per calculations.customer_exposure"
          - "Lease.version incremented by 1"
          - "Lease.occupancy_status is NOT touched"

      - transition_id: lease_accruing_to_settled
        from: ACCRUING
        to: SETTLED
        trigger: "POST /damage-assessments/{id}/finalize (system cascade)"
        actor: system
        preconditions:
          - "Lease.occupancy_status == VACATED"
          - "Lease.billing_status == ACCRUING"
        side_effects:
          - "Lease.final_settlement_cents set to calculations.lease_charge_total variant settled_actual"
          - "Lease.billed_to_date_cents set to Lease.final_settlement_cents"
          - "BECAUSE Lease.billed_to_date_cents changed, recompute Customer.outstanding_balance_cents per calculations.customer_exposure"
          - "BECAUSE Customer.outstanding_balance_cents changed, recompute Customer.credit_hold per calculations.customer_exposure"
          - "BECAUSE Customer.credit_hold flipped false -> true, set Customer.credit_tier to WATCH (no change when credit_hold did not flip)"
          - "Lease.version incremented by 1; Customer.version incremented by 1"

      - transition_id: lease_unbilled_to_voided
        from: UNBILLED
        to: VOIDED
        trigger: "POST /leases/{id}/void"
        actor: LeasingAgent
        preconditions:
          - "Lease.occupancy_status == PENDING"
        side_effects:
          - "Lease.credited_cents set to Lease.billed_to_date_cents (both are 0)"
          - "recompute Customer.outstanding_balance_cents and Customer.credit_hold per calculations.customer_exposure"
          - "Lease.version incremented by 1"

      - transition_id: lease_accruing_to_voided
        from: ACCRUING
        to: VOIDED
        trigger: "POST /leases/{id}/void"
        actor: LeasingAgent
        preconditions:
          - "Lease.occupancy_status == PENDING"
          - "no LogisticsJob with lease_id == Lease.id and status IN {DISPATCHED, COMPLETED}"
        side_effects:
          - "Lease.credited_cents set to Lease.billed_to_date_cents (exact reversal of lease_unbilled_to_accruing)"
          - "recompute Customer.outstanding_balance_cents and Customer.credit_hold per calculations.customer_exposure"
          - "Lease.version incremented by 1; Customer.version incremented by 1"

  - entity: PermitApplication
    state_field: status
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    note: "Fork at SUBMITTED: the decision endpoint routes to APPROVED or REJECTED with different downstream unlocks."
    transitions:
      - transition_id: permit_draft_to_submitted
        from: DRAFT
        to: SUBMITTED
        trigger: "POST /permit-applications/{id}/submit"
        actor: LeasingAgent
        preconditions:
          - "PermitApplication.status == DRAFT"
          - "Lease.occupancy_status == PENDING"
          - "(Lease.start_date - clock_date) in whole days >= Jurisdiction.permit_lead_days"
        side_effects:
          - "PermitApplication.submitted_on set to the logical clock's calendar date"

      - transition_id: permit_submitted_to_approved
        from: SUBMITTED
        to: APPROVED
        trigger: "POST /permit-applications/{id}/decide with decision == APPROVED"
        actor: FleetAdmin
        preconditions:
          - "PermitApplication.status == SUBMITTED"
        side_effects:
          - "PermitApplication.decided_on set to the logical clock's calendar date"
          - "PermitApplication.reviewer_note stored"
          - "unblocks unit_reserved_to_intransit for this lease and makes permit_fee_cents enter settled_actual"

      - transition_id: permit_submitted_to_rejected
        from: SUBMITTED
        to: REJECTED
        trigger: "POST /permit-applications/{id}/decide with decision == REJECTED"
        actor: FleetAdmin
        preconditions:
          - "PermitApplication.status == SUBMITTED"
        side_effects:
          - "PermitApplication.decided_on set to the logical clock's calendar date"
          - "PermitApplication.reviewer_note stored"
          - "permit_fee_cents does NOT enter settled_actual and dispatch stays blocked"

  - entity: LogisticsJob
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    note: "Branching by job_type: the same SCHEDULED -> DISPATCHED -> COMPLETED skeleton carries three disjoint side-effect sets."
    transitions:
      - transition_id: job_scheduled_to_dispatched_delivery
        from: SCHEDULED
        to: DISPATCHED
        trigger: "POST /logistics-jobs/{id}/dispatch where job_type == DELIVERY_INSTALL"
        actor: BranchOps
        preconditions:
          - "LogisticsJob.status == SCHEDULED"
          - "Lease.billing_status == ACCRUING"
          - "Jurisdiction.permit_required == false OR a PermitApplication with lease_id == Lease.id has status == APPROVED"
        side_effects:
          - "Unit RESERVED -> IN_TRANSIT (see unit_reserved_to_intransit) with the yard recount that follows"

      - transition_id: job_scheduled_to_dispatched_teardown
        from: SCHEDULED
        to: DISPATCHED
        trigger: "POST /logistics-jobs/{id}/dispatch where job_type == TEARDOWN_RETURN"
        actor: BranchOps
        preconditions:
          - "LogisticsJob.status == SCHEDULED"
          - "Lease.occupancy_status == INSTALLED"
        side_effects:
          - "Unit ON_LEASE -> IN_TRANSIT (see unit_onlease_to_intransit_teardown); no yard counters move"

      - transition_id: job_scheduled_to_dispatched_relocation
        from: SCHEDULED
        to: DISPATCHED
        trigger: "POST /logistics-jobs/{id}/dispatch where job_type == RELOCATION"
        actor: BranchOps
        preconditions:
          - "LogisticsJob.status == SCHEDULED"
          - "Lease.occupancy_status == INSTALLED"
        side_effects:
          - "Unit.status stays ON_LEASE — a relocation never re-enters a yard"

      - transition_id: job_dispatched_to_completed_delivery
        from: DISPATCHED
        to: COMPLETED
        trigger: "POST /logistics-jobs/{id}/complete where job_type == DELIVERY_INSTALL"
        actor: BranchOps
        preconditions:
          - "LogisticsJob.status == DISPATCHED"
        side_effects:
          - "Unit IN_TRANSIT -> ON_LEASE and Unit.installed_config_id set (see unit_intransit_to_onlease)"
          - "Lease.occupancy_status PENDING -> INSTALLED (see lease_pending_to_installed)"

      - transition_id: job_dispatched_to_completed_teardown
        from: DISPATCHED
        to: COMPLETED
        trigger: "POST /logistics-jobs/{id}/complete where job_type == TEARDOWN_RETURN"
        actor: BranchOps
        preconditions:
          - "LogisticsJob.status == DISPATCHED"
          - "Branch(LogisticsJob.destination_branch_id).units_in_yard < Branch(LogisticsJob.destination_branch_id).yard_capacity_units"
        side_effects:
          - "Lease.occupancy_status INSTALLED -> VACATED and Lease.actual_vacated_date stamped (see lease_installed_to_vacated)"
          - "BECAUSE the lease vacated, Unit IN_TRANSIT -> RETURNED at the destination branch (see unit_intransit_to_returned)"
          - "BECAUSE the unit re-entered a yard status, recompute the destination Branch.units_in_yard / units_available / utilization_pct per calculations.branch_fleet_inventory"

      - transition_id: job_dispatched_to_completed_relocation
        from: DISPATCHED
        to: COMPLETED
        trigger: "POST /logistics-jobs/{id}/complete where job_type == RELOCATION"
        actor: BranchOps
        preconditions:
          - "LogisticsJob.status == DISPATCHED"
        side_effects:
          - "Unit ON_LEASE -> ON_LEASE self-loop with Lease.site_address and Lease.relocation_surcharge_cents rewritten (see unit_onlease_relocation_selfloop)"

      - transition_id: job_scheduled_to_cancelled
        from: SCHEDULED
        to: CANCELLED
        trigger: "POST /logistics-jobs/{id}/cancel"
        actor: BranchOps
        preconditions:
          - "LogisticsJob.status == SCHEDULED"
        side_effects:
          - "the branch's dispatch-capacity slot on scheduled_date is released (CANCELLED jobs are excluded from the day count)"

      - transition_id: job_dispatched_to_cancelled_delivery_abort
        from: DISPATCHED
        to: CANCELLED
        trigger: "POST /logistics-jobs/{id}/cancel where job_type == DELIVERY_INSTALL"
        actor: BranchOps
        preconditions:
          - "LogisticsJob.status == DISPATCHED"
          - "LogisticsJob.job_type == DELIVERY_INSTALL"
        side_effects:
          - "Unit IN_TRANSIT -> RESERVED (see unit_intransit_to_reserved_on_abort) with the yard recount that restores units_in_yard"
          - "the branch's dispatch-capacity slot on scheduled_date is released"

  - entity: DamageAssessment
    state_field: status
    initial_state: DRAFT
    terminal_states: [FINALIZED, SUPERSEDED]
    note: "Cyclic: SUBMITTED -> DISPUTED -> SUBMITTED may repeat until dispute_rounds reaches MAX_DISPUTE_ROUNDS."
    transitions:
      - transition_id: assessment_draft_to_submitted
        from: DRAFT
        to: SUBMITTED
        trigger: "POST /damage-assessments/{id}/submit"
        actor: DamageAssessor
        preconditions:
          - "DamageAssessment.status == DRAFT"
        side_effects:
          - "DamageAssessment.gross_damage_cents set to calculations.damage_chargeback variant assessor_provisional"

      - transition_id: assessment_submitted_to_disputed
        from: SUBMITTED
        to: DISPUTED
        trigger: "POST /damage-assessments/{id}/dispute"
        actor: Customer
        preconditions:
          - "DamageAssessment.status == SUBMITTED"
          - "DamageAssessment.dispute_rounds < MAX_DISPUTE_ROUNDS"
          - "X-User-ID == Lease(DamageAssessment.lease_id).customer_id"
        side_effects:
          - "DamageAssessment.dispute_rounds incremented by 1"
          - "DamageAssessment.dispute_reason stored"

      - transition_id: assessment_disputed_to_submitted
        from: DISPUTED
        to: SUBMITTED
        trigger: "POST /damage-assessments/{id}/submit"
        actor: DamageAssessor
        preconditions:
          - "DamageAssessment.status == DISPUTED"
        side_effects:
          - "DamageAssessment.gross_damage_cents recomputed from the current line-item set (line items may be appended while DISPUTED)"

      - transition_id: assessment_submitted_to_finalized
        from: SUBMITTED
        to: FINALIZED
        trigger: "POST /damage-assessments/{id}/finalize"
        actor: FleetAdmin
        preconditions:
          - "DamageAssessment.status == SUBMITTED"
          - "Lease.occupancy_status == VACATED"
        side_effects:
          - "DamageAssessment.condition_grade_after stored"
          - "DamageAssessment.wear_allowance_cents and DamageAssessment.chargeable_cents set to calculations.damage_chargeback variant finalized_net"
          - "BECAUSE chargeable_cents became final, Lease.billing_status ACCRUING -> SETTLED and Lease.final_settlement_cents is computed (see lease_accruing_to_settled)"
          - "BECAUSE Lease.billed_to_date_cents changed, Customer.outstanding_balance_cents is recomputed"
          - "BECAUSE Customer.outstanding_balance_cents changed, Customer.credit_hold is recomputed and Customer.credit_tier is demoted to WATCH on a false -> true flip"

      - transition_id: assessment_open_to_superseded
        from: DRAFT | SUBMITTED | DISPUTED
        to: SUPERSEDED
        trigger: "POST /damage-assessments (a newer assessment is created for the same lease_id)"
        actor: DamageAssessor
        preconditions:
          - "the older DamageAssessment.status IN {DRAFT, SUBMITTED, DISPUTED}"
        side_effects:
          - "Lease.assessment_round incremented by 1"
          - "Lease.version incremented by 1"
        note: "Supersede is the sanctioned re-assessment path and is the reason POST /damage-assessments carries OCC on Lease.version — see §1.2.1."

  - entity: RefurbishmentOrder
    state_field: status
    initial_state: QUOTED
    terminal_states: [APPROVED, REJECTED, COMPLETED, SUPERSEDED]
    note: "Fork at QUOTED: approve pushes the unit into REFURBISHING, reject returns it straight to IN_FLEET, supersede retires the quote silently."
    transitions:
      - transition_id: refurb_quoted_to_approved
        from: QUOTED
        to: APPROVED
        trigger: "POST /refurbishment-orders/{id}/approve"
        actor: FleetAdmin
        preconditions:
          - "RefurbishmentOrder.status == QUOTED"
          - "DamageAssessment(RefurbishmentOrder.damage_assessment_id).status == FINALIZED"
          - "Unit.status == RETURNED"
          - "X-User-ID != DamageAssessment.assessor_user_id"
        side_effects:
          - "RefurbishmentOrder.approved_by_user_id set to X-User-ID"
          - "Unit RETURNED -> REFURBISHING (see unit_returned_to_refurbishing)"

      - transition_id: refurb_quoted_to_rejected
        from: QUOTED
        to: REJECTED
        trigger: "POST /refurbishment-orders/{id}/reject"
        actor: FleetAdmin
        preconditions:
          - "RefurbishmentOrder.status == QUOTED"
          - "Unit.status == RETURNED"
        side_effects:
          - "RefurbishmentOrder.rejection_reason stored"
          - "Unit RETURNED -> IN_FLEET (see unit_returned_to_infleet_on_reject)"

      - transition_id: refurb_approved_to_completed
        from: APPROVED
        to: COMPLETED
        trigger: "POST /refurbishment-orders/{id}/complete"
        actor: BranchOps
        preconditions:
          - "RefurbishmentOrder.status == APPROVED"
          - "X-User-ID == RefurbishmentOrder.branch_id"
        side_effects:
          - "RefurbishmentOrder.actual_cost_cents stored"
          - "Unit REFURBISHING -> IN_FLEET with grade, refurb_cycles, accumulated_damage_cents rewritten (see unit_refurbishing_to_infleet)"
          - "BECAUSE the unit became IN_FLEET, Branch.units_available rises by 1"
          - "BECAUSE Branch.units_available changed, Branch.utilization_pct is recomputed"

      - transition_id: refurb_quoted_to_superseded
        from: QUOTED
        to: SUPERSEDED
        trigger: "POST /refurbishment-orders (a newer order is created for the same unit_id)"
        actor: BranchOps
        preconditions:
          - "the older RefurbishmentOrder.status == QUOTED"
        side_effects:
          - "Unit.latest_quote_estimate_cents set to the NEW order's estimated_cost_cents"
          - "Unit.version incremented by 1"
        note: "Supersede is the sanctioned re-quote path and is the reason POST /refurbishment-orders carries OCC on Unit.version — see §1.2.1."

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:

  - rule_id: refurb-quote-supersede-stale-unit
    parent_entity: Unit
    write_endpoint: "POST /refurbishment-orders"
    occ_field: "expected_unit_version"
    description: |
      Creating a RefurbishmentOrder against a Unit whose version has advanced
      since the client last read it is rejected. A re-quote is legitimate under
      refurb_quoted_to_superseded — a second create against an unchanged unit
      would itself succeed and retire the prior QUOTED order — so the only
      deterministic guard is the stale-version check on Unit.version.
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412

  - rule_id: assessment-supersede-stale-lease
    parent_entity: Lease
    write_endpoint: "POST /damage-assessments"
    occ_field: "expected_lease_version"
    description: |
      Creating a DamageAssessment against a Lease whose version has advanced
      since the client last read it is rejected. Re-assessment is legitimate
      under assessment_open_to_superseded — a second create against an unchanged
      lease would itself succeed and retire the prior open assessment — so the
      stale-version check on Lease.version is the guard.
    error_id: ERR_STALE_LEASE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# All money is integer cents. `round_half_up(x)` means Decimal quantize to a
# whole cent with ROUND_HALF_UP. `ceil` / `floor` are exact integer operations.
# =============================================================================
calculations:

  - name: building_spec_area
    trigger: "POST /building-specs"
    algorithm: aggregation
    formula: |
      floor_area_sqft = width_ft * length_ft
    input_set: "The BuildingSpec row being created. `sections` is a transport attribute only and NEVER multiplies the area."
    constants: {}
    precision: "exact, no rounding (inputs are whole or one-decimal feet)"

  - name: floorplan_config_surcharge
    trigger: "POST /floorplan-configurations (sets FloorplanConfiguration.config_surcharge_cents)"
    algorithm: threshold
    formula: |
      office_cents      = private_offices * OFFICE_UNIT_CENTS
      restroom_cents    = restrooms * RESTROOM_UNIT_CENTS
      partition_cents   = ceil(partition_linear_ft / PARTITION_SEGMENT_FT) * PARTITION_SEGMENT_CENTS
      included_tons     = floor(spec.floor_area_sqft / SQFT_PER_INCLUDED_HALF_TON) * 0.5
      excess_tons       = max(0.0, hvac_tons - included_tons)
      hvac_cents        = ceil(excess_tons / 0.5) * HVAC_HALF_TON_CENTS
      config_surcharge_cents = office_cents + restroom_cents + partition_cents + hvac_cents
    input_set: "Exactly the four configuration inputs plus the parent BuildingSpec.floor_area_sqft. No lease, jurisdiction or customer data participates."
    constants:
      OFFICE_UNIT_CENTS: 42000
      RESTROOM_UNIT_CENTS: 175000
      PARTITION_SEGMENT_FT: 4.0
      PARTITION_SEGMENT_CENTS: 9500
      SQFT_PER_INCLUDED_HALF_TON: 400.0
      HVAC_HALF_TON_CENTS: 68000
    precision: "whole cents; every intermediate is an exact integer"

  - name: lease_monthly_rate
    trigger: "POST /leases (sets Lease.monthly_base_rate_cents); re-evaluated by POST /leases/{id}/extensions for the successor lease"
    algorithm: tiered_pricing
    formula: |
      # EVALUATION ORDER IS PINNED. Two lines are computed, EACH is rounded to a
      # whole cent, and ONLY THEN are they added. Summing the raw values and
      # rounding once at the end is WRONG and can differ by one cent.
      term_factor = 1.25 if term_months <= 5
                    1.10 if 6  <= term_months <= 11
                    1.00 if 12 <= term_months <= 23
                    0.92 if term_months >= 24
      wind_factor = WIND_ZONE_MULTIPLIER[jurisdiction.wind_zone]
      tier_factor = 1.0 - TIER_DISCOUNT[lease.pinned_credit_tier]

      spec_line_cents   = round_half_up(spec.base_monthly_rate_cents * term_factor * wind_factor * tier_factor)
      config_line_cents = round_half_up(config.config_surcharge_cents / CONFIG_AMORT_MONTHS)

      monthly_base_rate_cents = spec_line_cents + config_line_cents
    input_set: "The BuildingSpec reached through Unit.building_spec_id, the FloorplanConfiguration named on the lease, the Jurisdiction named on the lease, and Lease.pinned_credit_tier (a snapshot of Customer.credit_tier taken at POST /leases — a later WATCH demotion never re-rates an existing lease)."
    constants:
      WIND_ZONE_MULTIPLIER: { 1: 1.00, 2: 1.15, 3: 1.35, 4: 1.60 }
      TIER_DISCOUNT: { PLATINUM: 0.06, GOLD: 0.03, STANDARD: 0.00, WATCH: 0.00 }
      CONFIG_AMORT_MONTHS: 36
    precision: "round_half_up per line, then integer addition — NEVER sum-then-round"

  - name: lease_mobilization_fee
    trigger: "POST /leases (sets Lease.mobilization_fee_cents)"
    algorithm: waterfall_allocation
    formula: |
      # EVALUATION ORDER IS PINNED and resolves a circular-looking dependency:
      # the volume discount tier LOOKS like it should key off the grand total,
      # but the grand total already contains the fee. The tier is keyed on
      # transport_subtotal_cents from step 1 ONLY.
      # step 1
      transport_subtotal_cents = spec.delivery_base_cents
                               + spec.install_base_cents
                               + ANCHOR_COST_CENTS[jurisdiction.anchoring_standard]
      # step 2 — tier selection reads step 1's value, never quoted_total_cents
      volume_tier_pct = 0.00 if transport_subtotal_cents < TIER1_FLOOR_CENTS
                        0.05 if TIER1_FLOOR_CENTS <= transport_subtotal_cents < TIER2_FLOOR_CENTS
                        0.09 if transport_subtotal_cents >= TIER2_FLOOR_CENTS
      # step 3
      mobilization_discount_cents = round_half_up(transport_subtotal_cents * volume_tier_pct)
      # step 4
      mobilization_fee_cents = transport_subtotal_cents - mobilization_discount_cents

      # On a successor produced by POST /leases/{id}/extensions the unit is
      # already on site: mobilization_fee_cents is 0 and steps 1-4 are skipped.
    input_set: "The BuildingSpec reached through Unit.building_spec_id and the Jurisdiction named on the lease. Permit fees are NOT part of mobilization — they enter only through lease_charge_total variant settled_actual."
    constants:
      ANCHOR_COST_CENTS: { NONE: 0, GROUND_ANCHOR: 85000, PIER_FOUNDATION: 240000, ENGINEERED_SLAB: 610000 }
      TIER1_FLOOR_CENTS: 300000
      TIER2_FLOOR_CENTS: 800000
    precision: "whole cents, round_half_up on the discount only"

  - name: accessory_package_rate
    trigger: "POST /accessory-packages (sets AccessoryPackage.monthly_accessory_rate_cents and mirrors it onto Lease.monthly_accessory_rate_cents)"
    algorithm: aggregation
    formula: |
      ramp_cents    = ceil(ramp_run_ft / RAMP_SEGMENT_FT) * RAMP_SEGMENT_CENTS
      landing_cents = landing_count * LANDING_CENTS
      monthly_accessory_rate_cents = ACCESSORY_BASE_CENTS[package_type] + ramp_cents + landing_cents
    input_set: "The AccessoryPackage row being created. step_count is recorded but does not price."
    constants:
      ACCESSORY_BASE_CENTS: { STEPS: 12500, RAMP_ADA: 47500, COMBO: 55000 }
      RAMP_SEGMENT_FT: 4.0
      RAMP_SEGMENT_CENTS: 3800
      LANDING_CENTS: 6200
    precision: "whole cents, exact integers"

  - name: ada_ramp_compliance
    trigger: "POST /accessory-packages (sets AccessoryPackage.compliance_status)"
    algorithm: threshold
    formula: |
      rise_ft          = spec.floor_height_in / 12.0
      required_run_ft  = rise_ft * jurisdiction.min_ramp_run_ratio
      required_landings = ceil(ramp_run_ft / LANDING_INTERVAL_FT)

      compliance_status = COMPLIANT when
            package_type IN {RAMP_ADA, COMBO}
        AND ramp_run_ft >= required_run_ft            # INCLUSIVE: exact equality is compliant
        AND landing_count >= required_landings        # INCLUSIVE
      otherwise NON_COMPLIANT
    input_set: "The AccessoryPackage row, the Jurisdiction named on its Lease, and the BuildingSpec reached through the lease's Unit."
    constants:
      LANDING_INTERVAL_FT: 30.0
    precision: "exact float comparison on one-decimal feet; `>=` at both boundaries"

  - name: permit_fee
    trigger: "POST /permit-applications (sets PermitApplication.permit_fee_cents)"
    algorithm: aggregation
    formula: |
      permit_fee_cents = jurisdiction.permit_fee_cents
                       + ceil(spec.floor_area_sqft / AREA_BLOCK_SQFT) * AREA_BLOCK_CENTS
    input_set: "The Jurisdiction on the application and the BuildingSpec reached through the lease's Unit."
    constants:
      AREA_BLOCK_SQFT: 100.0
      AREA_BLOCK_CENTS: 1500
    precision: "whole cents, exact integers"

  - name: transport_cost
    trigger: "POST /logistics-jobs (sets LogisticsJob.transport_cost_cents)"
    algorithm: tiered_pricing
    formula: |
      band1_miles = min(mileage_miles, BAND1_CAP_MI)                      # included, priced at 0
      band2_miles = min(max(mileage_miles - BAND1_CAP_MI, 0), BAND2_WIDTH_MI)
      band3_miles = max(mileage_miles - BAND2_CEILING_MI, 0)
      mileage_cents = round_half_up(band2_miles * BAND2_CENTS_PER_MI + band3_miles * BAND3_CENTS_PER_MI)
      crew_cents    = round_half_up(ceil(crew_hours) * branch.labor_rate_cents_per_hour * JOB_TYPE_CREW_FACTOR[job_type])
      oversize_cents = (spec.sections - 1) * OVERSIZE_SECTION_CENTS
      transport_cost_cents = mileage_cents + crew_cents + oversize_cents
    input_set: "The LogisticsJob row, its origin Branch (labor rate) and the BuildingSpec reached through the job's Unit. Marginal banding: exactly 150 miles produces zero band-3 miles."
    constants:
      BAND1_CAP_MI: 50
      BAND2_WIDTH_MI: 100
      BAND2_CEILING_MI: 150
      BAND2_CENTS_PER_MI: 950
      BAND3_CENTS_PER_MI: 1450
      JOB_TYPE_CREW_FACTOR: { DELIVERY_INSTALL: 1.0, TEARDOWN_RETURN: 0.75, RELOCATION: 1.5 }
      OVERSIZE_SECTION_CENTS: 78000
      RELOCATION_PASSTHROUGH_PCT: 0.85
    precision: "round_half_up on the mileage line and on the crew line separately, then integer addition"

  - name: damage_line_repair_cost
    trigger: "POST /damage-assessments/{id}/line-items (sets DamageLineItem.repair_cost_cents)"
    algorithm: weighted_scoring
    formula: |
      repair_cost_cents = round_half_up(COMPONENT_BASE_CENTS[component] * SEVERITY_FACTOR[severity] * quantity)
    input_set: "The single DamageLineItem being appended."
    constants:
      COMPONENT_BASE_CENTS: { FLOOR: 32000, WALL: 18000, HVAC: 145000, ROOF: 96000, DOOR: 41000, ELECTRICAL: 73000 }
      SEVERITY_FACTOR: { MINOR: 0.35, MODERATE: 1.00, SEVERE: 2.25 }
    precision: "round_half_up to whole cents per line item"

  - name: damage_chargeback
    trigger: "POST /damage-assessments/{id}/submit (variant assessor_provisional -> gross_damage_cents) and POST /damage-assessments/{id}/finalize (variant finalized_net -> wear_allowance_cents + chargeable_cents)"
    algorithm: aggregation
    formula: |
      # variant assessor_provisional
      gross_damage_cents = SUM(DamageLineItem.repair_cost_cents
                               WHERE damage_assessment_id == assessment.id)      # ALL lines, wear included
                           ordered by DamageLineItem.created_at ASC              # order is immaterial to a sum but pinned for auditability

      # variant finalized_net
      wear_line_total_cents = SUM(DamageLineItem.repair_cost_cents
                                  WHERE damage_assessment_id == assessment.id
                                    AND wear_and_tear == true)
      months_on_lease   = ceil(((lease.actual_vacated_date - lease.start_date) in days + 1) / 30.0)
      wear_cap_cents    = round_half_up(spec.replacement_value_cents * WEAR_CAP_PCT_PER_MONTH * months_on_lease)
      wear_allowance_cents = min(wear_line_total_cents, wear_cap_cents)
      net_cents         = max(0, gross_damage_cents - wear_allowance_cents)
      chargeable_cents  = min(net_cents, round_half_up(spec.replacement_value_cents * DAMAGE_CAP_PCT))
    input_set: "All DamageLineItem rows of this assessment (an empty set yields 0 for every output), the Lease occupancy window, and the BuildingSpec reached through the assessment's Unit."
    constants:
      WEAR_CAP_PCT_PER_MONTH: 0.0025
      DAMAGE_CAP_PCT: 0.40
      MAX_DISPUTE_ROUNDS: 2
    precision: "whole cents; round_half_up on the two cap expressions only"
    variants:
      - name: assessor_provisional
        when: "computed at assessment_draft_to_submitted and re-computed at assessment_disputed_to_submitted"
        difference: "Charges every line item at full repair cost. Wear-and-tear lines are INCLUDED and no cap applies."
      - name: finalized_net
        when: "computed at assessment_submitted_to_finalized"
        difference: "Subtracts the wear allowance (itself capped at replacement value * 0.0025 per month on lease) and then clips the remainder at 40% of replacement value. For identical line items this is strictly <= assessor_provisional."

  - name: refurbishment_estimate
    trigger: "POST /refurbishment-orders (sets RefurbishmentOrder.estimated_cost_cents and Unit.latest_quote_estimate_cents)"
    algorithm: weighted_scoring
    formula: |
      labor_line_cents  = round_half_up(labor_hours * branch.labor_rate_cents_per_hour * SCOPE_FACTOR[scope])
      parts_line_cents  = round_half_up(parts_cost_cents * SCOPE_FACTOR[scope])
      damage_line_cents = round_half_up(assessment.chargeable_cents * REFURB_RECOVERY_PCT)
      estimated_cost_cents = labor_line_cents + parts_line_cents + damage_line_cents
    input_set: "The order being created, the Branch named on it (labor rate), and the FINALIZED DamageAssessment named on it."
    constants:
      SCOPE_FACTOR: { COSMETIC: 0.45, STANDARD: 1.00, FULL: 1.85 }
      REFURB_RECOVERY_PCT: 0.60
    precision: "round_half_up per line, then integer addition"

  - name: lease_charge_total
    trigger: "POST /leases and POST /accessory-packages (variant quoted_projection -> Lease.quoted_total_cents); lease_accruing_to_settled (variant settled_actual -> Lease.final_settlement_cents)"
    algorithm: forward_looking
    formula: |
      monthly_total_cents = monthly_base_rate_cents + monthly_accessory_rate_cents

      # variant quoted_projection
      quoted_total_cents = mobilization_fee_cents + monthly_total_cents * term_months

      # variant settled_actual
      occupied_days   = (actual_vacated_date - start_date) in whole days + 1     # closed-closed
      billable_months = ceil(occupied_days / 30.0)
      rent_cents      = monthly_total_cents * billable_months
      adjustment_cents = round_half_up(monthly_total_cents * (term_months - billable_months) * EARLY_TERMINATION_PCT)
                            when billable_months < term_months
                         round_half_up(monthly_total_cents * (billable_months - term_months) * HOLDOVER_PCT)
                            when billable_months > term_months
                         0 when billable_months == term_months
      permit_cents    = permit.permit_fee_cents when a PermitApplication with lease_id == lease.id has status == APPROVED, else 0
      damage_cents    = chargeable_cents of the FINALIZED DamageAssessment with lease_id == lease.id, else 0
      final_settlement_cents = mobilization_fee_cents + permit_cents + rent_cents
                             + adjustment_cents + relocation_surcharge_cents + damage_cents
    input_set: "quoted_projection sees only the lease's own pinned rate fields and term. settled_actual additionally sees the APPROVED PermitApplication, the FINALIZED DamageAssessment, every completed RELOCATION pass-through already accumulated in relocation_surcharge_cents, and the ACTUAL occupancy window ending at actual_vacated_date."
    constants:
      EARLY_TERMINATION_PCT: 0.35
      HOLDOVER_PCT: 0.25
    precision: "whole cents; round_half_up on the adjustment line only"
    variants:
      - name: quoted_projection
        when: "at POST /leases, and re-run at POST /accessory-packages once monthly_accessory_rate_cents lands on the lease"
        difference: "Projects the FULL contracted term, assumes zero permit fee (no application exists yet), zero damage and zero relocation. Forward-looking."
      - name: settled_actual
        when: "at lease_accruing_to_settled, i.e. cascaded from assessment_submitted_to_finalized"
        difference: "Bills ceil(actual occupied days / 30) months instead of term_months, adds the APPROVED permit fee, adds an early-termination or holdover adjustment, adds accumulated relocation pass-through, and adds the finalized damage chargeback. Chronological."

  - name: branch_fleet_inventory
    trigger: "every Unit status write or current_branch_id write (unit_infleet_to_reserved, unit_reserved_to_infleet_on_void, unit_reserved_to_intransit, unit_intransit_to_reserved_on_abort, unit_intransit_to_returned, unit_returned_to_refurbishing, unit_returned_to_infleet_on_reject, unit_refurbishing_to_infleet)"
    algorithm: aggregation
    formula: |
      units_in_yard   = COUNT(Unit WHERE current_branch_id == branch.id
                                    AND status IN {IN_FLEET, RESERVED, RETURNED, REFURBISHING})
      units_available = COUNT(Unit WHERE current_branch_id == branch.id AND status == IN_FLEET)
      total_assigned  = COUNT(Unit WHERE current_branch_id == branch.id)
      utilization_pct = 0.00 when total_assigned == 0
                        else round_half_up_2dp(100.0 * (total_assigned - units_available) / total_assigned)
    input_set: "Every Unit whose current_branch_id equals this branch, with no other filter. Units that have left for a site keep their current_branch_id until a TEARDOWN_RETURN rewrites it, so they still count in total_assigned but not in units_in_yard."
    constants: {}
    precision: "integer counts; utilization_pct at 2 decimal places, round_half_up"

  - name: customer_exposure
    trigger: "lease_unbilled_to_accruing, lease_accruing_to_settled, lease_unbilled_to_voided, lease_accruing_to_voided (sets Customer.outstanding_balance_cents and Customer.credit_hold)"
    algorithm: aggregation
    formula: |
      outstanding_balance_cents = SUM over every Lease L WHERE L.customer_id == customer.id
                                    of (L.billed_to_date_cents - L.credited_cents)
                                  processed in L.created_at ASC order
      credit_hold = (outstanding_balance_cents > credit_limit_cents)     # STRICT: equality is NOT a hold
    input_set: "Every Lease of this customer regardless of occupancy_status or billing_status — voided leases contribute 0 because credited_cents exactly cancels billed_to_date_cents."
    constants: {}
    precision: "whole cents; strict `>` on the hold threshold"

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
# the FIRST failing rule decides the response and no later rule is consulted)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the caller's role appears in the endpoint's declared roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every path-parameter resource exists, validated left-to-right"
    error_id: "ERR_BRANCH_NOT_FOUND | ERR_BUILDING_SPEC_NOT_FOUND | ERR_CONFIG_NOT_FOUND | ERR_UNIT_NOT_FOUND | ERR_CUSTOMER_NOT_FOUND | ERR_LEASE_NOT_FOUND | ERR_ACCESSORY_PACKAGE_NOT_FOUND | ERR_PERMIT_NOT_FOUND | ERR_LOGISTICS_JOB_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_REFURB_ORDER_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a {id} path segment"

  - priority: 4
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row, validated in the field order declared by the endpoint's input list"
    error_id: "ERR_BRANCH_NOT_FOUND | ERR_BUILDING_SPEC_NOT_FOUND | ERR_CONFIG_NOT_FOUND | ERR_UNIT_NOT_FOUND | ERR_CUSTOMER_NOT_FOUND | ERR_LEASE_NOT_FOUND | ERR_JURISDICTION_NOT_FOUND | ERR_LOGISTICS_JOB_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /floorplan-configurations, POST /units, POST /leases, POST /accessory-packages, POST /permit-applications, POST /logistics-jobs, POST /damage-assessments, POST /refurbishment-orders"

  - priority: 5
    category: business_constraint
    check: "required body fields are present, enum members are legal, numeric fields respect their declared ranges, dates parse as ISO yyyy-mm-dd, destination_branch_id is present exactly for TEARDOWN_RETURN and new_site_address exactly for RELOCATION"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all endpoints that accept a body"

  - priority: 6
    category: auth
    check: "entity_backed ownership: a BranchOps caller's X-User-ID equals LogisticsJob.origin_branch_id / RefurbishmentOrder.branch_id, and a Customer caller's X-User-ID equals the customer_id of the lease behind the addressed resource"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /logistics-jobs, POST /logistics-jobs/{id}/dispatch, POST /logistics-jobs/{id}/complete, POST /logistics-jobs/{id}/cancel, POST /refurbishment-orders, POST /refurbishment-orders/{id}/complete, POST /damage-assessments/{id}/dispute, GET /leases/{id}, GET /damage-assessments/{id}"

  - priority: 7
    category: state
    check: "the addressed resource occupies the `from:` state the requested §1.2 transition declares"
    error_id: "ERR_INVALID_STATE | ERR_UNIT_NOT_AVAILABLE | ERR_LEASE_ALREADY_ACTIVATED | ERR_LEASE_NOT_ACTIVATED | ERR_JOB_NOT_DISPATCHABLE | ERR_ASSESSMENT_NOT_SUBMITTED | ERR_ASSESSMENT_NOT_FINALIZED"
    note: "On POST /leases the only status that blocks here is Unit.status == REFURBISHING (ERR_UNIT_NOT_AVAILABLE); RESERVED / IN_TRANSIT / ON_LEASE / RETURNED units are bookable forward and fall through to the priority-20 occupancy-calendar check."
    http_status: 409
    applies_to: "every state-changing endpoint"

  - priority: 8
    category: state
    check: "the supplied expected_<parent>_version equals the parent's current version"
    error_id: "ERR_STALE_UNIT_VERSION | ERR_STALE_LEASE_VERSION"
    http_status: 412
    applies_to: "POST /refurbishment-orders, POST /damage-assessments"

  - priority: 9
    category: business_safety
    check: "creating a DELIVERY_INSTALL LogisticsJob in a jurisdiction with ada_ramp_required == true requires the lease to carry an AccessoryPackage whose compliance_status == COMPLIANT"
    error_id: ERR_ADA_PACKAGE_NON_COMPLIANT
    http_status: 422
    applies_to: "POST /logistics-jobs"

  - priority: 10
    category: business_safety
    check: "dispatching a DELIVERY_INSTALL job in a jurisdiction with permit_required == true requires a PermitApplication on that lease with status == APPROVED"
    error_id: ERR_PERMIT_NOT_APPROVED
    http_status: 409
    applies_to: "POST /logistics-jobs/{id}/dispatch"

  - priority: 11
    category: business_safety
    check: "PermitApplication.foundation_type equals Jurisdiction.anchoring_standard"
    error_id: ERR_ANCHORING_STANDARD_MISMATCH
    http_status: 422
    applies_to: "POST /permit-applications"

  - priority: 12
    category: business_safety
    check: "the FleetAdmin X-User-ID approving a RefurbishmentOrder differs from DamageAssessment.assessor_user_id of the order's assessment"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /refurbishment-orders/{id}/approve"

  - priority: 13
    category: business_referential
    check: "cross-entity links agree: PermitApplication.jurisdiction_id == Lease.jurisdiction_id; FloorplanConfiguration.building_spec_id == Unit.building_spec_id; DamageAssessment.logistics_job_id references a COMPLETED TEARDOWN_RETURN job whose lease_id equals the assessment's lease_id and whose unit matches; RefurbishmentOrder.damage_assessment_id references an assessment on the same unit_id"
    error_id: ERR_ENTITY_LINK_MISMATCH
    http_status: 409
    applies_to: "POST /leases, POST /permit-applications, POST /damage-assessments, POST /refurbishment-orders"

  - priority: 14
    category: business_referential
    check: "the FloorplanConfiguration named on a new lease has status == PUBLISHED"
    error_id: ERR_CONFIG_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /leases"

  - priority: 15
    category: business_referential
    check: "the Branch named as origin_branch_id (jobs) or branch_id (refurb orders) has status == OPERATIONAL"
    error_id: ERR_BRANCH_SUSPENDED
    http_status: 409
    applies_to: "POST /logistics-jobs, POST /refurbishment-orders"

  - priority: 16
    category: business_constraint
    check: "Branch.name+region_code aside, these identifiers are unique: BuildingSpec.model_code, Jurisdiction.code, Unit.serial_number"
    error_id: ERR_DUPLICATE_IDENTIFIER
    http_status: 409
    applies_to: "POST /building-specs, POST /jurisdictions, POST /units"

  - priority: 17
    category: business_constraint
    check: "a lease may carry at most one AccessoryPackage"
    error_id: ERR_ACCESSORY_ALREADY_ATTACHED
    http_status: 409
    applies_to: "POST /accessory-packages"

  - priority: 18
    category: business_constraint
    check: "a lease may have at most one successor whose occupancy_status != CANCELLED"
    error_id: ERR_LEASE_ALREADY_EXTENDED
    http_status: 409
    applies_to: "POST /leases/{id}/extensions"

  - priority: 19
    category: business_constraint
    check: "DamageAssessment.dispute_rounds < MAX_DISPUTE_ROUNDS (2)"
    error_id: ERR_DISPUTE_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /damage-assessments/{id}/dispute"

  - priority: 20
    category: business_temporal
    check: |
      Unit occupancy overlap. Each non-CANCELLED Lease on the unit occupies the CLOSED interval
      [start_date, end_date], or [start_date, actual_vacated_date] once occupancy_status == VACATED.
      A candidate interval [s, e] is rejected when an existing interval [s2, e2] satisfies
      s <= e2 + REFURB_BUFFER_DAYS AND e >= s2 - REFURB_BUFFER_DAYS, with REFURB_BUFFER_DAYS = 14.
      EXEMPTION: when the candidate is an extension successor whose extends_lease_id == the blocking
      lease's id AND s == e2 + 1 day, the buffer does not apply to that one pair (a contiguous handoff
      needs no refurbishment window).
    error_id: ERR_UNIT_OCCUPANCY_CONFLICT
    http_status: 409
    applies_to: "POST /leases, POST /leases/{id}/extensions"

  - priority: 21
    category: business_temporal
    check: "Branch dispatch capacity. COUNT(LogisticsJob WHERE origin_branch_id == branch.id AND scheduled_date == request.scheduled_date AND status IN {SCHEDULED, DISPATCHED}) must be < Branch.daily_dispatch_capacity. The day is the single calendar date only; no adjacency or buffer applies."
    error_id: ERR_BRANCH_DISPATCH_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /logistics-jobs"

  - priority: 22
    category: business_temporal
    check: "(Lease.start_date - logical clock date) in whole days >= Jurisdiction.permit_lead_days"
    error_id: ERR_PERMIT_LEAD_TIME_VIOLATION
    http_status: 422
    applies_to: "POST /permit-applications/{id}/submit"

  - priority: 23
    category: business_temporal
    check: "the derived successor start_date (parent.end_date + 1 day) must not precede the logical clock's calendar date — a handoff cannot be back-dated onto a term that has already run out"
    error_id: ERR_EXTENSION_NOT_CONTIGUOUS
    http_status: 422
    applies_to: "POST /leases/{id}/extensions"

  - priority: 24
    category: business_fiscal
    check: "the destination Branch has room: units_in_yard < yard_capacity_units"
    error_id: ERR_YARD_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /logistics-jobs/{id}/complete"

  - priority: 25
    category: business_fiscal
    check: "Customer.credit_hold == false at lease creation"
    error_id: ERR_CUSTOMER_ON_CREDIT_HOLD
    http_status: 409
    applies_to: "POST /leases, POST /leases/{id}/extensions"

  - priority: 26
    category: business_fiscal
    check: "Customer.outstanding_balance_cents + (mobilization_fee_cents + monthly_base_rate_cents + monthly_accessory_rate_cents) <= Customer.credit_limit_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /leases/{id}/activate"

# =============================================================================
# §1.5 API Endpoint Table
# Flat topology: every collection is mounted at the root. The single sub-resource
# route is the append-only damage line-item log.
# =============================================================================
endpoints:

  # ---- Branch ---------------------------------------------------------------
  - method: POST
    path: "/branches"
    description: "Register a depot/yard."
    roles: [FleetAdmin]
    code: 201
    input: [name, region_code, yard_capacity_units, daily_dispatch_capacity, labor_rate_cents_per_hour, "status?"]
    output: Branch
    side_effects: ["units_in_yard, units_available initialized to 0", "utilization_pct initialized to 0.00"]

  - method: GET
    path: "/branches/{id}"
    description: "Read one branch including its live fleet counters."
    roles: [FleetAdmin, BranchOps, LeasingAgent]
    code: 200
    input: []
    output: Branch
    side_effects: []

  # ---- Jurisdiction ---------------------------------------------------------
  - method: POST
    path: "/jurisdictions"
    description: "Register a permitting authority with its anchoring and ADA rules."
    roles: [FleetAdmin]
    code: 201
    input: [code, name, permit_required, permit_lead_days, anchoring_standard, wind_zone, permit_fee_cents, ada_ramp_required, min_ramp_run_ratio]
    output: Jurisdiction
    side_effects: []

  # ---- BuildingSpec ---------------------------------------------------------
  - method: POST
    path: "/building-specs"
    description: "Add a catalog building model."
    roles: [FleetAdmin]
    code: 201
    input: [model_code, width_ft, length_ft, sections, floor_height_in, base_monthly_rate_cents, delivery_base_cents, install_base_cents, replacement_value_cents, max_occupancy]
    output: BuildingSpec
    side_effects: ["computes floor_area_sqft per calculations.building_spec_area"]

  - method: GET
    path: "/building-specs/{id}"
    description: "Read one building spec including its computed floor area."
    roles: [FleetAdmin, LeasingAgent]
    code: 200
    input: []
    output: BuildingSpec
    side_effects: []

  # ---- FloorplanConfiguration ----------------------------------------------
  - method: POST
    path: "/floorplan-configurations"
    description: "Draft a floorplan configuration against a building spec."
    roles: [FleetAdmin]
    code: 201
    input: [building_spec_id, name, private_offices, restrooms, partition_linear_ft, hvac_tons]
    output: FloorplanConfiguration
    side_effects: ["computes config_surcharge_cents per calculations.floorplan_config_surcharge", "status set to DRAFT"]

  - method: GET
    path: "/floorplan-configurations/{id}"
    description: "Read one floorplan configuration."
    roles: [FleetAdmin, LeasingAgent]
    code: 200
    input: []
    output: FloorplanConfiguration
    side_effects: []

  - method: GET
    path: "/floorplan-configurations"
    description: "List floorplan configurations, optionally narrowed to one building spec."
    roles: [FleetAdmin, LeasingAgent]
    code: 200
    input: ["building_spec_id?", "status?", "limit?", "offset?"]
    output: FloorplanConfiguration[]
    side_effects: []

  - method: POST
    path: "/floorplan-configurations/{id}/publish"
    description: "Publish a DRAFT configuration so leases may reference it."
    roles: [FleetAdmin]
    code: 200
    input: []
    output: FloorplanConfiguration
    side_effects: ["FloorplanConfiguration.status DRAFT -> PUBLISHED"]

  # ---- Unit -----------------------------------------------------------------
  - method: POST
    path: "/units"
    description: "Add a physical unit to a branch yard."
    roles: [FleetAdmin]
    code: 201
    input: [serial_number, building_spec_id, current_branch_id, "condition_grade?"]
    output: Unit
    side_effects: ["status set to IN_FLEET", "recompute the branch's units_in_yard / units_available / utilization_pct per calculations.branch_fleet_inventory"]

  - method: GET
    path: "/units/{id}"
    description: "Read one unit including status, grade and version."
    roles: [FleetAdmin, BranchOps, LeasingAgent]
    code: 200
    input: []
    output: Unit
    side_effects: []

  - method: GET
    path: "/units"
    description: "List fleet units across branches with filters."
    roles: [FleetAdmin, BranchOps, LeasingAgent]
    code: 200
    input: ["current_branch_id?", "building_spec_id?", "installed_config_id?", "status?", "limit?", "offset?"]
    output: Unit[]
    side_effects: []

  # ---- Customer -------------------------------------------------------------
  - method: POST
    path: "/customers"
    description: "Register a lessee."
    roles: [LeasingAgent]
    code: 201
    input: [name, billing_email, credit_tier, credit_limit_cents]
    output: Customer
    side_effects: ["outstanding_balance_cents initialized to 0", "credit_hold initialized to false"]

  - method: GET
    path: "/customers/{id}"
    description: "Read one customer including live exposure and hold flag."
    roles: [LeasingAgent, FleetAdmin, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # ---- Lease ----------------------------------------------------------------
  - method: POST
    path: "/leases"
    description: "Quote and reserve: creates a PENDING/UNBILLED lease and reserves the unit."
    roles: [LeasingAgent]
    code: 201
    input: [customer_id, unit_id, jurisdiction_id, floorplan_configuration_id, site_address, start_date, term_months]
    output: Lease
    side_effects:
      - "pinned_credit_tier snapshotted from Customer.credit_tier"
      - "computes end_date, monthly_base_rate_cents (calculations.lease_monthly_rate), mobilization_fee_cents (calculations.lease_mobilization_fee) and quoted_total_cents (calculations.lease_charge_total variant quoted_projection)"
      - "Unit IN_FLEET -> RESERVED when the unit is currently IN_FLEET (forward bookings on a RESERVED/IN_TRANSIT/ON_LEASE/RETURNED unit leave the status alone); Unit.version incremented by 1 in every case"
      - "recompute the unit's branch units_available / utilization_pct per calculations.branch_fleet_inventory"

  - method: GET
    path: "/leases/{id}"
    description: "Read one lease including both status axes, all money fields and version."
    roles: [LeasingAgent, FleetAdmin, Customer, BranchOps]
    code: 200
    input: []
    output: Lease
    side_effects: []

  - method: GET
    path: "/leases"
    description: "List leases with filters, including the self-referential extension filter."
    roles: [LeasingAgent, FleetAdmin]
    code: 200
    input: ["customer_id?", "unit_id?", "jurisdiction_id?", "floorplan_configuration_id?", "extends_lease_id?", "occupancy_status?", "billing_status?", "limit?", "offset?"]
    output: Lease[]
    side_effects: []

  - method: POST
    path: "/leases/{id}/activate"
    description: "Move the money axis UNBILLED -> ACCRUING and bill mobilization plus the first month."
    roles: [LeasingAgent]
    code: 200
    input: []
    output: Lease
    side_effects:
      - "Lease.billing_status UNBILLED -> ACCRUING (lease_unbilled_to_accruing)"
      - "Lease.billed_to_date_cents set; Customer.outstanding_balance_cents and Customer.credit_hold recomputed per calculations.customer_exposure"
      - "Lease.occupancy_status untouched"

  - method: POST
    path: "/leases/{id}/void"
    description: "Cancel a lease that has not shipped and credit back everything billed."
    roles: [LeasingAgent]
    code: 200
    input: ["void_reason?"]
    output: Lease
    side_effects:
      - "Lease.occupancy_status PENDING -> CANCELLED and Lease.billing_status -> VOIDED"
      - "Lease.credited_cents set to Lease.billed_to_date_cents; Customer.outstanding_balance_cents and Customer.credit_hold recomputed"
      - "Unit RESERVED -> IN_FLEET and Unit.version incremented by 1; branch counters recomputed"

  - method: POST
    path: "/leases/{id}/extensions"
    description: "Create a contiguous successor lease on the same unit; the successor pays no mobilization fee."
    roles: [LeasingAgent]
    code: 201
    input: [term_months]
    output: Lease
    side_effects:
      - "successor Lease created with extends_lease_id = {id}, start_date = parent.end_date + 1 day, mobilization_fee_cents = 0, occupancy_status = INSTALLED, billing_status = UNBILLED"
      - "successor monthly_base_rate_cents recomputed per calculations.lease_monthly_rate using the successor's own term_months and the parent's pinned_credit_tier"
      - "parent Lease.version incremented by 1; Unit.version incremented by 1"

  # ---- AccessoryPackage -----------------------------------------------------
  - method: POST
    path: "/accessory-packages"
    description: "Attach the steps/ramp package to a lease and score its ADA compliance."
    roles: [LeasingAgent]
    code: 201
    input: [lease_id, package_type, "ramp_run_ft?", "landing_count?", "step_count?"]
    output: AccessoryPackage
    side_effects:
      - "computes monthly_accessory_rate_cents per calculations.accessory_package_rate and compliance_status per calculations.ada_ramp_compliance"
      - "mirrors monthly_accessory_rate_cents onto Lease.monthly_accessory_rate_cents"
      - "re-runs calculations.lease_charge_total variant quoted_projection so Lease.quoted_total_cents absorbs the accessory rent"
      - "Lease.version incremented by 1"

  - method: GET
    path: "/accessory-packages/{id}"
    description: "Read one accessory package."
    roles: [LeasingAgent, FleetAdmin]
    code: 200
    input: []
    output: AccessoryPackage
    side_effects: []

  - method: GET
    path: "/accessory-packages"
    description: "List accessory packages, optionally for one lease."
    roles: [LeasingAgent, FleetAdmin]
    code: 200
    input: ["lease_id?", "limit?", "offset?"]
    output: AccessoryPackage[]
    side_effects: []

  # ---- PermitApplication ----------------------------------------------------
  - method: POST
    path: "/permit-applications"
    description: "Draft a permit application for a lease site."
    roles: [LeasingAgent]
    code: 201
    input: [lease_id, jurisdiction_id, foundation_type]
    output: PermitApplication
    side_effects: ["computes permit_fee_cents per calculations.permit_fee", "status set to DRAFT"]

  - method: GET
    path: "/permit-applications/{id}"
    description: "Read one permit application."
    roles: [LeasingAgent, FleetAdmin]
    code: 200
    input: []
    output: PermitApplication
    side_effects: []

  - method: GET
    path: "/permit-applications"
    description: "List permit applications with filters."
    roles: [LeasingAgent, FleetAdmin]
    code: 200
    input: ["lease_id?", "jurisdiction_id?", "status?", "limit?", "offset?"]
    output: PermitApplication[]
    side_effects: []

  - method: POST
    path: "/permit-applications/{id}/submit"
    description: "File the application with the authority; enforces the jurisdiction lead time."
    roles: [LeasingAgent]
    code: 200
    input: []
    output: PermitApplication
    side_effects: ["status DRAFT -> SUBMITTED (also DISPUTED-style re-entry is not permitted)", "submitted_on stamped from the logical clock"]

  - method: POST
    path: "/permit-applications/{id}/decide"
    description: "Authority decision fork: APPROVED unlocks dispatch, REJECTED leaves it blocked."
    roles: [FleetAdmin]
    code: 200
    input: [decision, "reviewer_note?"]
    output: PermitApplication
    side_effects: ["status SUBMITTED -> APPROVED or SUBMITTED -> REJECTED", "decided_on stamped from the logical clock"]

  # ---- LogisticsJob ---------------------------------------------------------
  - method: POST
    path: "/logistics-jobs"
    description: "Book a delivery/install, teardown/return or relocation move."
    roles: [BranchOps]
    code: 201
    input: [lease_id, job_type, origin_branch_id, scheduled_date, mileage_miles, crew_hours, "destination_branch_id?", "new_site_address?"]
    output: LogisticsJob
    side_effects:
      - "unit_id copied from Lease.unit_id"
      - "computes transport_cost_cents per calculations.transport_cost"
      - "consumes one of the origin branch's daily_dispatch_capacity slots on scheduled_date"

  - method: GET
    path: "/logistics-jobs/{id}"
    description: "Read one logistics job."
    roles: [BranchOps, FleetAdmin, LeasingAgent]
    code: 200
    input: []
    output: LogisticsJob
    side_effects: []

  - method: GET
    path: "/logistics-jobs"
    description: "List logistics jobs with filters."
    roles: [BranchOps, FleetAdmin, LeasingAgent]
    code: 200
    input: ["lease_id?", "unit_id?", "origin_branch_id?", "destination_branch_id?", "status?", "scheduled_date?", "limit?", "offset?"]
    output: LogisticsJob[]
    side_effects: []

  - method: POST
    path: "/logistics-jobs/{id}/dispatch"
    description: "Send the crew; the unit's status move depends on job_type."
    roles: [BranchOps]
    code: 200
    input: []
    output: LogisticsJob
    side_effects:
      - "status SCHEDULED -> DISPATCHED"
      - "DELIVERY_INSTALL: Unit RESERVED -> IN_TRANSIT and the origin branch's units_in_yard drops by 1"
      - "TEARDOWN_RETURN: Unit ON_LEASE -> IN_TRANSIT with no counter movement"
      - "RELOCATION: Unit stays ON_LEASE"

  - method: POST
    path: "/logistics-jobs/{id}/complete"
    description: "Close the job; drives install, teardown/settlement handoff or relocation re-siting."
    roles: [BranchOps]
    code: 200
    input: []
    output: LogisticsJob
    side_effects:
      - "status DISPATCHED -> COMPLETED"
      - "DELIVERY_INSTALL: Unit IN_TRANSIT -> ON_LEASE, Unit.installed_config_id set, Lease.occupancy_status PENDING -> INSTALLED"
      - "TEARDOWN_RETURN: Lease.occupancy_status INSTALLED -> VACATED with actual_vacated_date stamped, then Unit IN_TRANSIT -> RETURNED at destination_branch_id, then destination branch counters recomputed"
      - "RELOCATION: Unit.lifetime_relocations +1, Lease.site_address rewritten, Lease.relocation_surcharge_cents increased by round_half_up(transport_cost_cents * 0.85)"

  - method: POST
    path: "/logistics-jobs/{id}/cancel"
    description: "Abort a job; a dispatched DELIVERY_INSTALL returns the unit to its yard."
    roles: [BranchOps]
    code: 200
    input: ["cancellation_reason?"]
    output: LogisticsJob
    side_effects:
      - "status SCHEDULED -> CANCELLED or DISPATCHED -> CANCELLED"
      - "from DISPATCHED on a DELIVERY_INSTALL: Unit IN_TRANSIT -> RESERVED and the origin branch's units_in_yard rises by 1"
      - "the branch's dispatch-capacity slot on scheduled_date is released"

  # ---- DamageAssessment -----------------------------------------------------
  - method: POST
    path: "/damage-assessments"
    description: "Open a teardown damage assessment; supersedes any open assessment on the same lease."
    roles: [DamageAssessor]
    code: 201
    input: [lease_id, unit_id, logistics_job_id, expected_lease_version]
    output: DamageAssessment
    side_effects:
      - "assessor_user_id set to X-User-ID; condition_grade_before copied from Unit.condition_grade"
      - "any DamageAssessment on this lease in {DRAFT, SUBMITTED, DISPUTED} moves to SUPERSEDED"
      - "Lease.assessment_round incremented by 1 and Lease.version incremented by 1"

  - method: GET
    path: "/damage-assessments/{id}"
    description: "Read one damage assessment including both chargeback variants."
    roles: [DamageAssessor, FleetAdmin, Customer]
    code: 200
    input: []
    output: DamageAssessment
    side_effects: []

  - method: GET
    path: "/damage-assessments"
    description: "List damage assessments with filters."
    roles: [DamageAssessor, FleetAdmin]
    code: 200
    input: ["unit_id?", "lease_id?", "logistics_job_id?", "status?", "limit?", "offset?"]
    output: DamageAssessment[]
    side_effects: []

  - method: POST
    path: "/damage-assessments/{id}/line-items"
    description: "Append one damage line item; allowed while DRAFT or DISPUTED."
    roles: [DamageAssessor]
    code: 201
    input: [component, severity, quantity, wear_and_tear]
    output: DamageLineItem
    side_effects: ["computes repair_cost_cents per calculations.damage_line_repair_cost"]

  - method: GET
    path: "/damage-assessments/{id}/line-items"
    description: "List the append-only line-item log of one assessment."
    roles: [DamageAssessor, FleetAdmin, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: DamageLineItem[]
    side_effects: []

  - method: POST
    path: "/damage-assessments/{id}/submit"
    description: "Submit or re-submit the assessment; recomputes the provisional gross."
    roles: [DamageAssessor]
    code: 200
    input: []
    output: DamageAssessment
    side_effects: ["status DRAFT -> SUBMITTED or DISPUTED -> SUBMITTED", "gross_damage_cents set per calculations.damage_chargeback variant assessor_provisional"]

  - method: POST
    path: "/damage-assessments/{id}/dispute"
    description: "Lessee pushes the assessment back for rework."
    roles: [Customer]
    code: 200
    input: [dispute_reason]
    output: DamageAssessment
    side_effects: ["status SUBMITTED -> DISPUTED", "dispute_rounds incremented by 1"]

  - method: POST
    path: "/damage-assessments/{id}/finalize"
    description: "Finalize the chargeback and cascade the lease settlement."
    roles: [FleetAdmin]
    code: 200
    input: [condition_grade_after]
    output: DamageAssessment
    side_effects:
      - "status SUBMITTED -> FINALIZED with wear_allowance_cents and chargeable_cents per calculations.damage_chargeback variant finalized_net"
      - "Lease.billing_status ACCRUING -> SETTLED with final_settlement_cents per calculations.lease_charge_total variant settled_actual"
      - "Customer.outstanding_balance_cents and Customer.credit_hold recomputed; credit_tier demoted to WATCH on a false -> true hold flip"

  # ---- RefurbishmentOrder ---------------------------------------------------
  - method: POST
    path: "/refurbishment-orders"
    description: "Quote refurbishment for a returned unit; supersedes any open quote on that unit."
    roles: [BranchOps]
    code: 201
    input: [unit_id, branch_id, damage_assessment_id, scope, labor_hours, parts_cost_cents, target_condition_grade, expected_unit_version]
    output: RefurbishmentOrder
    side_effects:
      - "computes estimated_cost_cents per calculations.refurbishment_estimate"
      - "any RefurbishmentOrder on this unit with status == QUOTED moves to SUPERSEDED"
      - "Unit.latest_quote_estimate_cents set to this order's estimated_cost_cents and Unit.version incremented by 1"
      - "Unit.status is deliberately NOT changed here — the unit stays RETURNED until approval"

  - method: GET
    path: "/refurbishment-orders/{id}"
    description: "Read one refurbishment order."
    roles: [BranchOps, FleetAdmin]
    code: 200
    input: []
    output: RefurbishmentOrder
    side_effects: []

  - method: GET
    path: "/refurbishment-orders"
    description: "List refurbishment orders with filters."
    roles: [BranchOps, FleetAdmin]
    code: 200
    input: ["unit_id?", "branch_id?", "damage_assessment_id?", "status?", "limit?", "offset?"]
    output: RefurbishmentOrder[]
    side_effects: []

  - method: POST
    path: "/refurbishment-orders/{id}/approve"
    description: "Authorize the work; blocked when the approver authored the assessment."
    roles: [FleetAdmin]
    code: 200
    input: []
    output: RefurbishmentOrder
    side_effects: ["status QUOTED -> APPROVED, approved_by_user_id stamped", "Unit RETURNED -> REFURBISHING and Unit.version incremented by 1"]

  - method: POST
    path: "/refurbishment-orders/{id}/reject"
    description: "Decline the work; the unit returns to the leasable pool as-is."
    roles: [FleetAdmin]
    code: 200
    input: [rejection_reason]
    output: RefurbishmentOrder
    side_effects: ["status QUOTED -> REJECTED", "Unit RETURNED -> IN_FLEET, latest_quote_estimate_cents reset to 0, branch units_available / utilization_pct recomputed"]

  - method: POST
    path: "/refurbishment-orders/{id}/complete"
    description: "Close the work order and return the unit to the fleet at its new grade."
    roles: [BranchOps]
    code: 200
    input: [actual_cost_cents]
    output: RefurbishmentOrder
    side_effects:
      - "status APPROVED -> COMPLETED, actual_cost_cents stored"
      - "Unit REFURBISHING -> IN_FLEET with condition_grade, refurb_cycles and accumulated_damage_cents rewritten"
      - "branch units_available rises by 1 and utilization_pct is recomputed per calculations.branch_fleet_inventory"

  # ---- Test-driving surface -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and MUST NOT fall back to real wall-clock time. All date stamps (submitted_on, decided_on, actual_vacated_date) and all lead-time / occupancy arithmetic read this clock."
    roles: [FleetAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["subsequent date stamps and day-difference computations use the new instant"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the five declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the caller's role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed caller addressed a resource that is not theirs (BranchOps vs origin_branch_id/branch_id, Customer vs the lease's customer_id)"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required field, illegal enum member, out-of-range number, unparseable date, or a job_type-conditional field supplied for the wrong job_type"
  - id: ERR_BRANCH_NOT_FOUND
    http: 404
    condition: "referenced Branch id does not exist"
  - id: ERR_JURISDICTION_NOT_FOUND
    http: 404
    condition: "referenced Jurisdiction id does not exist"
  - id: ERR_BUILDING_SPEC_NOT_FOUND
    http: 404
    condition: "referenced BuildingSpec id does not exist"
  - id: ERR_CONFIG_NOT_FOUND
    http: 404
    condition: "referenced FloorplanConfiguration id does not exist"
  - id: ERR_UNIT_NOT_FOUND
    http: 404
    condition: "referenced Unit id does not exist"
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "referenced Customer id does not exist"
  - id: ERR_LEASE_NOT_FOUND
    http: 404
    condition: "referenced Lease id does not exist"
  - id: ERR_ACCESSORY_PACKAGE_NOT_FOUND
    http: 404
    condition: "referenced AccessoryPackage id does not exist"
  - id: ERR_PERMIT_NOT_FOUND
    http: 404
    condition: "referenced PermitApplication id does not exist"
  - id: ERR_LOGISTICS_JOB_NOT_FOUND
    http: 404
    condition: "referenced LogisticsJob id does not exist"
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "referenced DamageAssessment id does not exist"
  - id: ERR_REFURB_ORDER_NOT_FOUND
    http: 404
    condition: "referenced RefurbishmentOrder id does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the requested transition is not declared from the resource's current state (used when no more specific state error applies, e.g. publishing an already PUBLISHED configuration, completing a SCHEDULED job, rejecting an APPROVED order)"
  - id: ERR_UNIT_NOT_AVAILABLE
    http: 409
    condition: "POST /leases (or POST /leases/{id}/extensions) addressed a Unit whose status is REFURBISHING — a unit in the shop has no committed return date, so it may not be booked. Every other status permits a forward booking; the occupancy calendar (ERR_UNIT_OCCUPANCY_CONFLICT) is what actually gates the dates."
  - id: ERR_LEASE_ALREADY_ACTIVATED
    http: 409
    condition: "POST /leases/{id}/activate on a lease whose billing_status is not UNBILLED"
  - id: ERR_LEASE_NOT_ACTIVATED
    http: 409
    condition: "dispatching a DELIVERY_INSTALL job whose lease billing_status is not ACCRUING"
  - id: ERR_JOB_NOT_DISPATCHABLE
    http: 409
    condition: "dispatch/complete/cancel addressed a LogisticsJob that is not in the required source state for that action"
  - id: ERR_ASSESSMENT_NOT_SUBMITTED
    http: 409
    condition: "finalize addressed a DamageAssessment whose status is not SUBMITTED"
  - id: ERR_ASSESSMENT_NOT_FINALIZED
    http: 409
    condition: "a RefurbishmentOrder create or approve referenced a DamageAssessment whose status is not FINALIZED"
  - id: ERR_STALE_UNIT_VERSION
    http: 412
    condition: "expected_unit_version does not equal the Unit's current version"
  - id: ERR_STALE_LEASE_VERSION
    http: 412
    condition: "expected_lease_version does not equal the Lease's current version"
  - id: ERR_ADA_PACKAGE_NON_COMPLIANT
    http: 422
    condition: "a DELIVERY_INSTALL job was booked in an ada_ramp_required jurisdiction while the lease's AccessoryPackage is missing or NON_COMPLIANT"
  - id: ERR_PERMIT_NOT_APPROVED
    http: 409
    condition: "a DELIVERY_INSTALL job was dispatched in a permit_required jurisdiction with no APPROVED PermitApplication on that lease"
  - id: ERR_ANCHORING_STANDARD_MISMATCH
    http: 422
    condition: "PermitApplication.foundation_type differs from the jurisdiction's anchoring_standard"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the FleetAdmin approving a refurbishment order is the same operator id that authored the underlying damage assessment"
  - id: ERR_ENTITY_LINK_MISMATCH
    http: 409
    condition: "two supplied references disagree (permit jurisdiction vs lease jurisdiction, configuration spec vs unit spec, assessment job/lease/unit triple, refurb order unit vs assessment unit)"
  - id: ERR_CONFIG_NOT_PUBLISHED
    http: 409
    condition: "a lease referenced a FloorplanConfiguration whose status is DRAFT"
  - id: ERR_BRANCH_SUSPENDED
    http: 409
    condition: "the origin/servicing Branch has status SUSPENDED"
  - id: ERR_DUPLICATE_IDENTIFIER
    http: 409
    condition: "BuildingSpec.model_code, Jurisdiction.code or Unit.serial_number already exists"
  - id: ERR_ACCESSORY_ALREADY_ATTACHED
    http: 409
    condition: "the lease already carries an AccessoryPackage"
  - id: ERR_LEASE_ALREADY_EXTENDED
    http: 409
    condition: "the lease already has a successor whose occupancy_status is not CANCELLED"
  - id: ERR_DISPUTE_LIMIT_REACHED
    http: 409
    condition: "dispute_rounds has already reached MAX_DISPUTE_ROUNDS (2)"
  - id: ERR_UNIT_OCCUPANCY_CONFLICT
    http: 409
    condition: "the candidate lease interval collides with an existing interval on the same unit once both are expanded by the 14-day refurbishment buffer (extension handoffs are exempt against their own parent)"
  - id: ERR_BRANCH_DISPATCH_CAPACITY_EXCEEDED
    http: 409
    condition: "the origin branch already holds daily_dispatch_capacity SCHEDULED/DISPATCHED jobs on that calendar date"
  - id: ERR_PERMIT_LEAD_TIME_VIOLATION
    http: 422
    condition: "fewer whole days remain between the logical clock date and the lease start_date than the jurisdiction's permit_lead_days"
  - id: ERR_EXTENSION_NOT_CONTIGUOUS
    http: 422
    condition: "the derived successor start_date (parent.end_date + 1 day) is earlier than the logical clock's calendar date, so the extension cannot pick up contiguously"
  - id: ERR_YARD_CAPACITY_EXCEEDED
    http: 409
    condition: "the destination branch's units_in_yard already equals yard_capacity_units when a TEARDOWN_RETURN completes"
  - id: ERR_CUSTOMER_ON_CREDIT_HOLD
    http: 409
    condition: "a new lease or extension was requested for a customer whose credit_hold is true"
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 402
    condition: "activation would push the customer's outstanding balance above credit_limit_cents"

# =============================================================================
# §1.7 RBAC Matrix — segregation of duties
# =============================================================================
roles:
  - name: FleetAdmin
    description: "Corporate fleet operator: owns the catalog (branches, jurisdictions, specs, configurations, units), permit decisions, damage finalization, refurbishment authorization and the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /branches"
      - "POST /jurisdictions"
      - "POST /building-specs"
      - "POST /floorplan-configurations"
      - "POST /floorplan-configurations/{id}/publish"
      - "POST /units"
      - "POST /permit-applications/{id}/decide"
      - "POST /damage-assessments/{id}/finalize"
      - "POST /refurbishment-orders/{id}/approve"
      - "POST /refurbishment-orders/{id}/reject"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /branches/{id}, GET /building-specs/{id}, GET /floorplan-configurations, GET /floorplan-configurations/{id}, GET /units, GET /units/{id}, GET /customers/{id}, GET /leases, GET /leases/{id}, GET /accessory-packages, GET /accessory-packages/{id}, GET /permit-applications, GET /permit-applications/{id}, GET /logistics-jobs, GET /logistics-jobs/{id}, GET /damage-assessments, GET /damage-assessments/{id}, GET /damage-assessments/{id}/line-items, GET /refurbishment-orders, GET /refurbishment-orders/{id}"
    note: "The X-User-ID of a FleetAdmin is an operator handle, never an entity id, but it IS recorded as RefurbishmentOrder.approved_by_user_id and compared against DamageAssessment.assessor_user_id for segregation of duties."

  - name: BranchOps
    description: "Yard operations account for one branch: books and runs logistics jobs and quotes/completes refurbishment work."
    identity: "entity_backed:Branch"
    exclusive_operations:
      - "POST /logistics-jobs"
      - "POST /logistics-jobs/{id}/dispatch"
      - "POST /logistics-jobs/{id}/complete"
      - "POST /logistics-jobs/{id}/cancel"
      - "POST /refurbishment-orders"
      - "POST /refurbishment-orders/{id}/complete"
    shared_operations:
      - "GET /branches/{id}, GET /units, GET /units/{id}, GET /leases/{id}, GET /logistics-jobs, GET /logistics-jobs/{id}, GET /refurbishment-orders, GET /refurbishment-orders/{id}"
    note: "X-User-ID MUST equal the Branch.id acting; it is matched against LogisticsJob.origin_branch_id and RefurbishmentOrder.branch_id."

  - name: LeasingAgent
    description: "Commercial desk: registers lessees, quotes and reserves leases, attaches accessory packages, files permits, activates, voids and extends."
    identity: opaque
    exclusive_operations:
      - "POST /customers"
      - "POST /leases"
      - "POST /leases/{id}/activate"
      - "POST /leases/{id}/void"
      - "POST /leases/{id}/extensions"
      - "POST /accessory-packages"
      - "POST /permit-applications"
      - "POST /permit-applications/{id}/submit"
    shared_operations:
      - "GET /branches/{id}, GET /building-specs/{id}, GET /floorplan-configurations, GET /floorplan-configurations/{id}, GET /units, GET /units/{id}, GET /customers/{id}, GET /leases, GET /leases/{id}, GET /accessory-packages, GET /accessory-packages/{id}, GET /permit-applications, GET /permit-applications/{id}, GET /logistics-jobs, GET /logistics-jobs/{id}"

  - name: DamageAssessor
    description: "Independent teardown inspector: opens assessments, appends line items and submits them. Never authorizes spend."
    identity: opaque
    exclusive_operations:
      - "POST /damage-assessments"
      - "POST /damage-assessments/{id}/line-items"
      - "POST /damage-assessments/{id}/submit"
    shared_operations:
      - "GET /damage-assessments, GET /damage-assessments/{id}, GET /damage-assessments/{id}/line-items"
    note: "The X-User-ID recorded as DamageAssessment.assessor_user_id is the operator handle that POST /refurbishment-orders/{id}/approve must NOT match."

  - name: Customer
    description: "Lessee self-service: reads its own leases and assessments and disputes a submitted damage assessment."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /damage-assessments/{id}/dispute"
    shared_operations:
      - "GET /customers/{id}, GET /leases/{id}, GET /damage-assessments/{id}, GET /damage-assessments/{id}/line-items"
    note: "X-User-ID MUST equal the Customer.id acting; it is matched against Lease.customer_id."
