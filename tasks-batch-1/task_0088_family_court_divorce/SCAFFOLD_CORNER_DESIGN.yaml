# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Family Court / Divorce Case — EXPERT
#
# Breadth probe: enumerates testable claims from §1.1–§1.7 not already covered
# by the 18 §1.8 difficulty instances. Walks the claim-extraction-guide sections
# (Entities / State Machines / Calculations / Validations / Endpoints / Errors /
# RBAC / Cross-Cutting Layers / Consistency Model). Same canonical CA schedule
# as the difficulty file.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_case_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Case.fields.status, entities.Case.fields.filing_fee_cents]
        distinguishing_aspect: "POST /api/cases with required fields -> 201; status=FILED, version=1, net_fees_collected_cents == filing_fee_cents, active_support_total_cents == 0, server-minted id/created_at present."
        test_recipe:
          setup: ["GuidelineSchedule(CA) registered."]
          setup_api_calls:
            - call: "POST /api/guideline-schedules"
              payload: { state_code: "CA", basic_obligation_tiers: [ { min_combined_monthly_cents: 0, max_combined_monthly_cents: 99999999, base_cents_one_child: 100000, marginal_pct_per_extra_child: 0.50 } ] }
              as: Clerk
          trigger:
            - call: "POST /api/cases"
              payload: { state_code: "CA", caption: "In re Marriage of Test", marriage_months: 84, filing_fee_cents: 43500 }
              as: Clerk
              captures: { case_id: $.data.id, st: $.data.status, v: $.data.version, fee: $.data.net_fees_collected_cents }
          assert:
            - "response code == 201"
            - "Case.${case_id}.status == FILED"
            - "Case.${case_id}.version == 1"
            - "Case.${case_id}.net_fees_collected_cents == 43500"
            - "Case.${case_id}.active_support_total_cents == 0"

      - name: get_case_not_found_returns_404
        claim_type: Not Found
        grounds:
          - "endpoints"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /api/cases/{id} with a well-formed but non-existent UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /api/cases/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response code == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_party_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - "entities.Party.fields.role"
          - "validations[priority=4]"
        distinguishing_aspect: "POST /api/parties omitting required `role` -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A CA case exists."]
          setup_api_calls:
            - call: "POST /api/guideline-schedules"
              payload: { state_code: "CA", basic_obligation_tiers: [ { min_combined_monthly_cents: 0, max_combined_monthly_cents: 99999999, base_cents_one_child: 100000, marginal_pct_per_extra_child: 0.50 } ] }
              as: Clerk
            - call: "POST /api/cases"
              payload: { state_code: "CA", caption: "In re Marriage of S", marriage_months: 84, filing_fee_cents: 43500 }
              as: Clerk
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /api/parties"
              payload: { case_id: "${case_id}", user_id: "u-x", full_name: "No Role", gross_monthly_income_cents: 100000 }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response code == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: support_order_amount_is_computed_input_ignored
        claim_type: Computed Fields
        grounds: [entities.SupportOrder.fields.monthly_amount_cents, endpoints]
        distinguishing_aspect: "monthly_amount_cents is source:computed and is NOT in the POST /api/support-orders input list; any client-supplied value is ignored and the server computes it from the guideline."
        test_recipe:
          setup: ["CA default case in DEFAULT_PENDING; petitioner gross 400000, respondent gross 400000; 1 child; plan PROPOSED 280/85 (payor=respondent, payor_time_pct=0.2329 < 0.40 so no offset)."]
          setup_api_calls:
            - call: "POST /api/guideline-schedules"
              payload: { state_code: "CA", basic_obligation_tiers: [ { min_combined_monthly_cents: 0, max_combined_monthly_cents: 99999999, base_cents_one_child: 100000, marginal_pct_per_extra_child: 0.50 } ] }
              as: Clerk
            - call: "POST /api/cases"
              payload: { state_code: "CA", caption: "In re Marriage of T", marriage_months: 84, filing_fee_cents: 43500 }
              as: Clerk
              captures: { case_id: $.data.id }
            - call: "POST /api/parties"
              payload: { case_id: "${case_id}", role: "PETITIONER", user_id: "u-pet", full_name: "Pat", gross_monthly_income_cents: 400000 }
              as: Clerk
              captures: { pet_id: $.data.id }
            - call: "POST /api/parties"
              payload: { case_id: "${case_id}", role: "RESPONDENT", user_id: "u-res", full_name: "Robin", gross_monthly_income_cents: 400000 }
              as: Clerk
              captures: { res_id: $.data.id }
            - call: "POST /api/children"
              payload: { case_id: "${case_id}", full_name: "Child One", birth_year: 2016 }
              as: Clerk
            - call: "POST /api/pleadings"
              payload: { case_id: "${case_id}", pleading_type: "PETITION", filed_by_party_id: "${pet_id}" }
              as: Clerk
              captures: { pet_pleading_id: $.data.id }
            - call: "POST /api/pleadings/${pet_pleading_id}/serve"
              payload: {}
              as: Clerk
            - call: "POST /api/cases/${case_id}/default"
              payload: {}
              as: Clerk
            - call: "POST /api/parenting-plans"
              payload: { case_id: "${case_id}", proposed_by_party_id: "${pet_id}", petitioner_overnights: 280, respondent_overnights: 85 }
              as: Petitioner
              as_user_id: "u-pet"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /api/support-orders"
              payload: { case_id: "${case_id}", support_type: "CHILD", payor_party_id: "${res_id}", payee_party_id: "${pet_id}", variant: "TEMPORARY" }
              as: Clerk
              captures: { so_id: $.data.id, amt: $.data.monthly_amount_cents }
          assert:
            - "SupportOrder.${so_id}.monthly_amount_cents == 50000"

      - name: list_cases_paginated_envelope
        claim_type: Listing
        grounds: [endpoints]
        distinguishing_aspect: "GET /api/cases returns a paginated array envelope with limit/offset/total_count/has_more; default limit 10."
        test_recipe:
          setup: ["Two CA cases exist."]
          setup_api_calls:
            - call: "POST /api/guideline-schedules"
              payload: { state_code: "CA", basic_obligation_tiers: [ { min_combined_monthly_cents: 0, max_combined_monthly_cents: 99999999, base_cents_one_child: 100000, marginal_pct_per_extra_child: 0.50 } ] }
              as: Clerk
            - call: "POST /api/cases"
              payload: { state_code: "CA", caption: "Case 1", marriage_months: 60, filing_fee_cents: 43500 }
              as: Clerk
            - call: "POST /api/cases"
              payload: { state_code: "CA", caption: "Case 2", marriage_months: 72, filing_fee_cents: 43500 }
              as: Clerk
          trigger:
            - call: "GET /api/cases"
              payload: { limit: 10, offset: 0 }
              as: Clerk
          assert:
            - "response_type == array"
            - "meta/pagination total_count >= 2"
            - "has_more == false"

      - name: guideline_schedule_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.GuidelineSchedule.common_fields, entities.GuidelineSchedule.fields.state_code]
        distinguishing_aspect: "GuidelineSchedule has common_fields:false — no update/version; GET returns only id, created_at and the declared config fields."
        test_recipe:
          setup: ["A GuidelineSchedule(CA) exists."]
          setup_api_calls:
            - call: "POST /api/guideline-schedules"
              payload: { state_code: "CA", basic_obligation_tiers: [ { min_combined_monthly_cents: 0, max_combined_monthly_cents: 99999999, base_cents_one_child: 100000, marginal_pct_per_extra_child: 0.50 } ], long_marriage_months: 120 }
              as: Clerk
              captures: { gs_id: $.data.id }
          trigger:
            - call: "GET /api/guideline-schedules/${gs_id}"
              payload: {}
              as: Clerk
              captures: { sc: $.data.state_code }
          assert:
            - "GuidelineSchedule.${gs_id}.state_code == CA"
            - "GuidelineSchedule.${gs_id}.long_marriage_months == 120"

      - name: defaults_applied_for_optional_schedule_pcts
        claim_type: Defaults
        grounds: [entities.GuidelineSchedule.fields.spousal_payor_pct, entities.GuidelineSchedule.fields.shared_custody_threshold_pct]
        distinguishing_aspect: "Omitting spousal_payor_pct / shared_custody_threshold_pct / long_marriage_months applies defaults 0.40 / 0.40 / 120."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/guideline-schedules"
              payload: { state_code: "NY", basic_obligation_tiers: [ { min_combined_monthly_cents: 0, max_combined_monthly_cents: 99999999, base_cents_one_child: 100000, marginal_pct_per_extra_child: 0.50 } ] }
              as: Clerk
              captures: { gs_id: $.data.id, pp: $.data.spousal_payor_pct, sct: $.data.shared_custody_threshold_pct, lmm: $.data.long_marriage_months }
          assert:
            - "GuidelineSchedule.${gs_id}.spousal_payor_pct == 0.40"
            - "GuidelineSchedule.${gs_id}.shared_custody_threshold_pct == 0.40"
            - "GuidelineSchedule.${gs_id}.long_marriage_months == 120"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: dispute_already_agreed_plan_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.ParentingPlan.PROPOSED_to_AGREED, entities.ParentingPlan.fields.status]
        distinguishing_aspect: "A plan in AGREED has no dispute transition; POST /api/parenting-plans/{id}/dispute on it -> ERR_INVALID_STATE (409); status stays AGREED."
        test_recipe:
          setup: ["CA case DISCOVERY; ParentingPlan PROPOSED by petitioner 110/255 then AGREED by respondent."]
          setup_api_calls:
            - call: "POST /api/guideline-schedules"
              payload: { state_code: "CA", basic_obligation_tiers: [ { min_combined_monthly_cents: 0, max_combined_monthly_cents: 99999999, base_cents_one_child: 100000, marginal_pct_per_extra_child: 0.50 } ] }
              as: Clerk
            - call: "POST /api/cases"
              payload: { state_code: "CA", caption: "In re Marriage of U", marriage_months: 84, filing_fee_cents: 43500 }
              as: Clerk
              captures: { case_id: $.data.id }
            - call: "POST /api/parties"
              payload: { case_id: "${case_id}", role: "PETITIONER", user_id: "u-pet", full_name: "Pat", gross_monthly_income_cents: 800000 }
              as: Clerk
              captures: { pet_id: $.data.id }
            - call: "POST /api/parties"
              payload: { case_id: "${case_id}", role: "RESPONDENT", user_id: "u-res", full_name: "Robin", gross_monthly_income_cents: 400000 }
              as: Clerk
              captures: { res_id: $.data.id }
            - call: "POST /api/parenting-plans"
              payload: { case_id: "${case_id}", proposed_by_party_id: "${pet_id}", petitioner_overnights: 110, respondent_overnights: 255 }
              as: Petitioner
              as_user_id: "u-pet"
              captures: { plan_id: $.data.id }
            - call: "POST /api/parenting-plans/${plan_id}/agree"
              payload: {}
              as: Respondent
              as_user_id: "u-res"
          trigger:
            - call: "POST /api/parenting-plans/${plan_id}/dispute"
              payload: {}
              as: Petitioner
              as_user_id: "u-pet"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: hold_hearing_then_cancel_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Hearing.SCHEDULED_to_HELD, state_machines.Hearing.SCHEDULED_to_CANCELLED]
        distinguishing_aspect: "HELD is terminal for Hearing; cancelling a HELD hearing -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A CA case with one SCHEDULED hearing then marked HELD."]
          setup_api_calls:
            - call: "POST /api/guideline-schedules"
              payload: { state_code: "CA", basic_obligation_tiers: [ { min_combined_monthly_cents: 0, max_combined_monthly_cents: 99999999, base_cents_one_child: 100000, marginal_pct_per_extra_child: 0.50 } ] }
              as: Clerk
            - call: "POST /api/cases"
              payload: { state_code: "CA", caption: "In re Marriage of V", marriage_months: 84, filing_fee_cents: 43500 }
              as: Clerk
              captures: { case_id: $.data.id }
            - call: "POST /api/hearings"
              payload: { case_id: "${case_id}", courtroom_code: "DEPT-1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }
              as: Clerk
              captures: { h_id: $.data.id }
            - call: "POST /api/hearings/${h_id}/hold"
              payload: {}
              as: Judge
              as_user_id: "u-judge"
          trigger:
            - call: "POST /api/hearings/${h_id}/cancel"
              payload: {}
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: financial_disclosure_return_then_resubmit_recomputes_net
        claim_type: Valid Transition
        grounds: [state_machines.FinancialDisclosure.SUBMITTED_to_RETURNED, state_machines.FinancialDisclosure.RETURNED_to_SUBMITTED, calculations.net_disposable_income]
        distinguishing_aspect: "RETURNED->SUBMITTED resubmit with edited deductions re-derives net_monthly_income_cents (gross 720000, deductions now 60000+0+0=60000 -> net 660000)."
        test_recipe:
          setup: ["CA default case DEFAULT_PENDING; petitioner FinancialDisclosure SUBMITTED then RETURNED."]
          setup_api_calls:
            - call: "POST /api/guideline-schedules"
              payload: { state_code: "CA", basic_obligation_tiers: [ { min_combined_monthly_cents: 0, max_combined_monthly_cents: 99999999, base_cents_one_child: 100000, marginal_pct_per_extra_child: 0.50 } ] }
              as: Clerk
            - call: "POST /api/cases"
              payload: { state_code: "CA", caption: "In re Marriage of W", marriage_months: 84, filing_fee_cents: 43500 }
              as: Clerk
              captures: { case_id: $.data.id }
            - call: "POST /api/parties"
              payload: { case_id: "${case_id}", role: "PETITIONER", user_id: "u-pet", full_name: "Pat", gross_monthly_income_cents: 800000 }
              as: Clerk
              captures: { pet_id: $.data.id }
            - call: "POST /api/pleadings"
              payload: { case_id: "${case_id}", pleading_type: "PETITION", filed_by_party_id: "${pet_id}" }
              as: Clerk
              captures: { pet_pleading_id: $.data.id }
            - call: "POST /api/pleadings/${pet_pleading_id}/serve"
              payload: {}
              as: Clerk
            - call: "POST /api/cases/${case_id}/default"
              payload: {}
              as: Clerk
            - call: "POST /api/financial-disclosures"
              payload: { party_id: "${pet_id}", case_id: "${case_id}", gross_monthly_income_cents: 720000, tax_withholding_cents: 120000, mandatory_retirement_cents: 0, health_insurance_cents: 0 }
              as: Petitioner
              as_user_id: "u-pet"
              captures: { fd_id: $.data.id }
            - call: "POST /api/financial-disclosures/${fd_id}/submit"
              payload: {}
              as: Petitioner
              as_user_id: "u-pet"
            - call: "POST /api/financial-disclosures/${fd_id}/return"
              payload: {}
              as: Clerk
          trigger:
            - call: "POST /api/financial-disclosures/${fd_id}/submit"
              payload: {}
              as: Petitioner
              as_user_id: "u-pet"
              captures: { st: $.data.status, net: $.data.net_monthly_income_cents }
          assert:
            - "FinancialDisclosure.${fd_id}.status == SUBMITTED"
            - "FinancialDisclosure.${fd_id}.net_monthly_income_cents == 600000"

      - name: case_default_blocked_when_answer_exists
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Case.AWAITING_RESPONSE_to_DEFAULT_PENDING"
          - "errors[ERR_ANSWER_EXISTS]"
        distinguishing_aspect: "POST /api/cases/{id}/default is rejected with ERR_ANSWER_EXISTS when an ANSWER pleading exists for the case."
        test_recipe:
          setup: ["CA case AWAITING_RESPONSE (petition served); a DRAFT ANSWER filed by respondent."]
          setup_api_calls:
            - call: "POST /api/guideline-schedules"
              payload: { state_code: "CA", basic_obligation_tiers: [ { min_combined_monthly_cents: 0, max_combined_monthly_cents: 99999999, base_cents_one_child: 100000, marginal_pct_per_extra_child: 0.50 } ] }
              as: Clerk
            - call: "POST /api/cases"
              payload: { state_code: "CA", caption: "In re Marriage of X", marriage_months: 84, filing_fee_cents: 43500 }
              as: Clerk
              captures: { case_id: $.data.id }
            - call: "POST /api/parties"
              payload: { case_id: "${case_id}", role: "PETITIONER", user_id: "u-pet", full_name: "Pat", gross_monthly_income_cents: 800000 }
              as: Clerk
              captures: { pet_id: $.data.id }
            - call: "POST /api/parties"
              payload: { case_id: "${case_id}", role: "RESPONDENT", user_id: "u-res", full_name: "Robin", gross_monthly_income_cents: 400000 }
              as: Clerk
              captures: { res_id: $.data.id }
            - call: "POST /api/pleadings"
              payload: { case_id: "${case_id}", pleading_type: "PETITION", filed_by_party_id: "${pet_id}" }
              as: Clerk
              captures: { pet_pleading_id: $.data.id }
            - call: "POST /api/pleadings/${pet_pleading_id}/serve"
              payload: {}
              as: Clerk
            - call: "POST /api/pleadings"
              payload: { case_id: "${case_id}", pleading_type: "ANSWER", filed_by_party_id: "${res_id}" }
              as: Clerk
              captures: { ans_id: $.data.id }
          trigger:
            - call: "POST /api/cases/${case_id}/default"
              payload: {}
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "data.error_id == ERR_ANSWER_EXISTS"

      - name: mediation_full_agreement_blocked_when_plan_not_agreed
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.MediationSession.IN_SESSION_to_FULL_AGREEMENT"
          - "errors[ERR_PLAN_NOT_AGREED]"
        distinguishing_aspect: "Concluding FULL_AGREEMENT while the case ParentingPlan is only PROPOSED -> ERR_PLAN_NOT_AGREED (409); no cascade fires."
        test_recipe:
          setup: ["CA contested case in MEDIATION (mediator u-med); ParentingPlan PROPOSED (NOT agreed); a session IN_SESSION."]
          setup_api_calls:
            - call: "POST /api/guideline-schedules"
              payload: { state_code: "CA", basic_obligation_tiers: [ { min_combined_monthly_cents: 0, max_combined_monthly_cents: 99999999, base_cents_one_child: 100000, marginal_pct_per_extra_child: 0.50 } ] }
              as: Clerk
            - call: "POST /api/cases"
              payload: { state_code: "CA", caption: "In re Marriage of Y", marriage_months: 84, filing_fee_cents: 43500 }
              as: Clerk
              captures: { case_id: $.data.id }
            - call: "POST /api/parties"
              payload: { case_id: "${case_id}", role: "PETITIONER", user_id: "u-pet", full_name: "Pat", gross_monthly_income_cents: 800000 }
              as: Clerk
              captures: { pet_id: $.data.id }
            - call: "POST /api/parties"
              payload: { case_id: "${case_id}", role: "RESPONDENT", user_id: "u-res", full_name: "Robin", gross_monthly_income_cents: 400000 }
              as: Clerk
              captures: { res_id: $.data.id }
            - call: "POST /api/pleadings"
              payload: { case_id: "${case_id}", pleading_type: "PETITION", filed_by_party_id: "${pet_id}" }
              as: Clerk
              captures: { pet_pleading_id: $.data.id }
            - call: "POST /api/pleadings/${pet_pleading_id}/serve"
              payload: {}
              as: Clerk
            - call: "POST /api/pleadings"
              payload: { case_id: "${case_id}", pleading_type: "ANSWER", filed_by_party_id: "${res_id}" }
              as: Clerk
              captures: { ans_id: $.data.id }
            - call: "POST /api/pleadings/${ans_id}/serve"
              payload: {}
              as: Clerk
            - call: "POST /api/cases/${case_id}/advance"
              payload: { to_status: "DISCOVERY" }
              as: Clerk
            - call: "POST /api/financial-disclosures"
              payload: { party_id: "${pet_id}", case_id: "${case_id}", gross_monthly_income_cents: 720000, tax_withholding_cents: 120000, mandatory_retirement_cents: 0, health_insurance_cents: 0 }
              as: Petitioner
              as_user_id: "u-pet"
              captures: { pet_fd_id: $.data.id }
            - call: "POST /api/financial-disclosures/${pet_fd_id}/submit"
              payload: {}
              as: Petitioner
              as_user_id: "u-pet"
            - call: "POST /api/financial-disclosures"
              payload: { party_id: "${res_id}", case_id: "${case_id}", gross_monthly_income_cents: 360000, tax_withholding_cents: 60000, mandatory_retirement_cents: 0, health_insurance_cents: 0 }
              as: Respondent
              as_user_id: "u-res"
              captures: { res_fd_id: $.data.id }
            - call: "POST /api/financial-disclosures/${res_fd_id}/submit"
              payload: {}
              as: Respondent
              as_user_id: "u-res"
            - call: "POST /api/cases/${case_id}/assign-mediator"
              payload: { mediator_user_id: "u-med" }
              as: Clerk
            - call: "POST /api/parenting-plans"
              payload: { case_id: "${case_id}", proposed_by_party_id: "${pet_id}", petitioner_overnights: 110, respondent_overnights: 255 }
              as: Petitioner
              as_user_id: "u-pet"
              captures: { plan_id: $.data.id }
            - call: "POST /api/mediation-sessions"
              payload: { case_id: "${case_id}", mediator_user_id: "u-med", scheduled_start: "2026-07-03T09:00:00Z", scheduled_end: "2026-07-03T11:00:00Z" }
              as: Mediator
              as_user_id: "u-med"
              captures: { sess_id: $.data.id }
            - call: "POST /api/mediation-sessions/${sess_id}/start"
              payload: {}
              as: Mediator
              as_user_id: "u-med"
          trigger:
            - call: "POST /api/mediation-sessions/${sess_id}/conclude"
              payload: { outcome: "FULL_AGREEMENT" }
              as: Mediator
              as_user_id: "u-med"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "data.error_id == ERR_PLAN_NOT_AGREED"
            - "ParentingPlan.${plan_id}.status == PROPOSED"

      - name: serve_petition_drives_case_to_awaiting_response
        claim_type: Side Effect Execution
        grounds: [state_machines.Pleading.DRAFT_to_SERVED, state_machines.Case.FILED_to_AWAITING_RESPONSE]
        distinguishing_aspect: "Serving the PETITION drives the owning Case FILED->AWAITING_RESPONSE and bumps Case.version 1->2."
        test_recipe:
