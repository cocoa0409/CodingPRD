            - "Vendor.${c_v64_id}.eligibility_status == ELIGIBLE, suspension_reason_code == null, active_debarment_id == null, debarment_strike_count == 0"
            - "GET /procurement/debarment-proceedings?vendor_id=${c_v64_id} returns total_count 0"
            - "the identical payload with interim_suspension false returns HTTP 201 with interim_status NONE and strikes_applied 0"

      - name: corner_debarment_hearing_at_exactly_the_response_deadline_is_rejected
        claim_type: Triggerability
        grounds:
          - validations[priority=26]
          - errors[ERR_DEBARMENT_HEARING_RIGHTS_NOT_EXHAUSTED]
          - state_machines.DebarmentProceeding.NOTICE_ISSUED_to_HEARING_HELD
        distinguishing_aspect: "The default-branch hearing requires clock strictly greater than response_deadline_utc: at exactly 2026-08-15T00:00:00Z the hearing is refused with HTTP 409, and one millisecond later it succeeds."
        test_recipe:
