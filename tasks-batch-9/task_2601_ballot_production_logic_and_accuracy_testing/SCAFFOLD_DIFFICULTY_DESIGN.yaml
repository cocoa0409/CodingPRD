            - "Hop 1: discrepancy_count == 2 (abs(3 - 1) for the marks plus abs(1 - 1) blanks plus abs(0 - 0) overvotes), so LATestSession.${sess2}.status == FAILED with discrepancy_count 2 recorded, and TestDeck.${deck_b}.status == VOIDED."
