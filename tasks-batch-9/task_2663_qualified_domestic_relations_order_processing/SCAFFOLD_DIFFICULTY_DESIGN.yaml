      - name: disclosure_scope_check_precedes_attorney_authorization_check
        grounds:
          - validations[priority=50]
          - validations[priority=62]
          - errors.ERR_DISCLOSURE_SCOPE_EXCEEDED
          - errors.ERR_ATTORNEY_NOT_AUTHORIZED
          - entities.AttorneyAuthorization.fields.disclosure_scope
          - entities.AttorneyAuthorization.fields.status
          - entities.Communication.fields.attorney_email
        distinguishing_aspect: |
          This is the counterintuitive pair. Priority 50 resolves the addressee's AttorneyAuthorization
          REGARDLESS of its status, so a FULL-detail message addressed to a REVOKED attorney whose
          scope was only LIMITED is refused with ERR_DISCLOSURE_SCOPE_EXCEEDED (403) — the
          disclosure-scope objection outranks the fact that the attorney has no standing at all
          (ERR_ATTORNEY_NOT_AUTHORIZED at priority 62). Sending the same message at LIMITED detail
          flips the answer to ERR_ATTORNEY_NOT_AUTHORIZED, and the same endpoint on the same case
          succeeds for the ALTERNATE_PAYEE-side attorney who holds an ACTIVE FULL authorization. The
          fourth call exercises the other half of priority 50: FULL detail to the ALTERNATE_PAYEE
          herself is refused while the case has not reached QUALIFIED, even though no attorney is
          involved.
        test_recipe:
          setup:
            - "A PUBLISHED plan and a participant not in pay status with a single assignable PRE_TAX_DEFERRAL source of 1000000 and one snapshot on 2026-06-30 at 1000000."
            - "A case with a received, faultless draft order (so the case has an operative draft and review_status UNDER_REVIEW, not QUALIFIED)."
            - "Two authorizations on that one case: one representing PARTICIPANT with disclosure_scope LIMITED, later REVOKED; one representing ALTERNATE_PAYEE with disclosure_scope FULL, left ACTIVE."
            - "The clock sits at 2026-09-01, inside both authorizations' [effective_from, expires_at] windows."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Ordering Plan C", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT"], allowed_approaches: ["SEPARATE_INTEREST"], requires_model_language: true, permits_benefit_not_otherwise_available: false, earnings_adjustment_method: "PERIOD_END", max_assignable_pct_bps: 5000, max_assignable_amount_cents: 2000000 }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/procedure-status"
              payload: { to_status: "PUBLISHED" }
              as: PlanAdministrator
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Pieter Halvorsen", ssn_last4: "2277", date_of_birth: "1981-01-31", participation_start_date: "2010-01-01", employment_status: "ACTIVE", benefit_commenced: false }
              as: PlanAdministrator
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/plan-accounts"
              payload: { monthly_payment_cents: 0 }
              as: PlanAdministrator
              captures: { acct_id: $.data.id }
            - call: "POST /plan-accounts/${acct_id}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 1000000, basis_cents: 0, is_assignable: true }
              as: PlanAdministrator
            - call: "POST /plan-accounts/${acct_id}/valuation-snapshots"
              payload: { as_of_date: "2026-06-30", balance_cents: 1000000, source: "TRUSTEE_STATEMENT" }
              as: PlanAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /qdro-cases"
              payload: { participant_id: "${part_id}", alternate_payee_name: "Sissel Halvorsen", valuation_date: "2026-06-30", marital_period_start: "2012-03-01", marital_period_end: "2026-02-01", alternate_payee_dob: "1983-08-08", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${case_id}", expected_case_version: "${case_v}", document_reference: "DRO-2663-S1", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000, provisions: [] }
              as: QdroAnalyst
              captures: { draft_id: $.data.id }
            - call: "POST /qdro-cases/${case_id}/attorney-authorizations"
              payload: { represents: "PARTICIPANT", attorney_name: "Ola Sandvik", attorney_bar_number: "BAR-44120", attorney_email: "ola@sandvikfamilylaw.example", disclosure_scope: "LIMITED", effective_from: "2026-08-01", expires_at: "2027-12-31T00:00:00Z" }
              as: QdroAnalyst
              captures: { auth_p: $.data.id }
            - call: "POST /qdro-cases/${case_id}/attorney-authorizations"
              payload: { represents: "ALTERNATE_PAYEE", attorney_name: "Reidun Vik", attorney_bar_number: "BAR-51993", attorney_email: "reidun@vikqdro.example", disclosure_scope: "FULL", effective_from: "2026-08-01", expires_at: "2027-12-31T00:00:00Z" }
              as: QdroAnalyst
              captures: { auth_ap: $.data.id }
            - call: "POST /attorney-authorizations/${auth_p}/revoke"
              payload: {}
              as: PlanAdministrator
              captures: { revoked_status: $.data.status }
          trigger:
            - call: "POST /qdro-cases/${case_id}/communications"
              payload: { recipient_type: "PARTICIPANT_ATTORNEY", template_code: "DEFICIENCY_NOTICE", disclosure_level: "FULL" }
              as: QdroAnalyst
              captures: { scope_wins: $.data.error_id }
            - call: "POST /qdro-cases/${case_id}/communications"
              payload: { recipient_type: "PARTICIPANT_ATTORNEY", template_code: "DEFICIENCY_NOTICE", disclosure_level: "LIMITED" }
              as: QdroAnalyst
              captures: { standing_error: $.data.error_id }
            - call: "POST /qdro-cases/${case_id}/communications"
              payload: { recipient_type: "AP_ATTORNEY", template_code: "DEFICIENCY_NOTICE", disclosure_level: "FULL" }
              as: QdroAnalyst
              captures: { ok_email: $.data.attorney_email, ok_origin: $.data.origin }
            - call: "POST /qdro-cases/${case_id}/communications"
              payload: { recipient_type: "ALTERNATE_PAYEE", template_code: "DETERMINATION_QUALIFIED", disclosure_level: "FULL" }
              as: QdroAnalyst
