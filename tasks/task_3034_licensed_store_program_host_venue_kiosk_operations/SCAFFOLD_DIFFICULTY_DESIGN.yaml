      - name: safety_beats_constraint_on_assortment_add
        grounds:
          - validations[priority=20]
          - validations[priority=24]
        distinguishing_aspect: |
          Category pair business_safety (20) vs business_constraint (24): adding an AIRPORT-only
          product with par_level 5000 (over MAX_PAR_LEVEL) to a GROCERY store returns
          ERR_VENUE_TYPE_PROHIBITED, not ERR_INVALID_REQUEST — a different pair than state/fiscal.
