scaffold_difficulty_design:

  # ==========================================================================
  # Rule 1 — dual_variant_calc (≥2 instances, different entity domains)
  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: insource_outsource_provisional_vs_final_diverges
        grounds:
          - calculations.insource_vs_outsource_cost_model
          - calculations.insource_vs_outsource_cost_model.variants.provisional_at_activation
          - calculations.insource_vs_outsource_cost_model.variants.final_at_close
        distinguishing_aspect: |
          Same matter, same assignments, same invoices: provisional variant (read
          while matter is ACTIVE) counts accrual_outstanding_cents as part of
          outsource_cost_cents; final variant (read after CLOSED) excludes
          accruals. Two reads on identical SpendLine data yield different
          outsource_cost_cents and possibly different decision values.
        test_recipe:
          setup:
            - "Department with default thresholds; fiscal period FP OPEN; practice area PA ACTIVE; matter type MT under PA; firm F ACTIVE with blended rate 25000 cents/hr; counsel C with loaded rate 15000 cents/hr and capacity 2000 hrs"
            - "Matter M in FP, PA, MT, primary_firm F, lead_counsel C, budget 100000000 cents"
            - "Assignment A1: C allocated 100 hours on M"
            - "M is ACTIVE"
            - "Accrual AC for M/FP/F amount 4000000 cents, OUTSTANDING"
            - "Invoice INV for M/FP/F amount 3000000 cents, APPROVED then PAID — SpendLine POSTED"
          setup_api_calls:
            - call: "POST /legal-ops/departments"
              payload: { name: "Default Legal" }
              as: LegalOpsManager
              captures: { dept_id: $.data.id }
            - call: "POST /legal-ops/fiscal-periods"
              payload: { label: "FY2026", start_date: "2026-01-01", end_date: "2026-12-31" }
              as: LegalOpsManager
              captures: { fp_id: $.data.id }
            - call: "POST /legal-ops/practice-areas"
              payload: { code: "LIT", display_name: "Litigation" }
              as: LegalOpsManager
              captures: { pa_id: $.data.id }
            - call: "POST /legal-ops/practice-areas/${pa_id}/matter-types"
              payload: { code: "LIT-COMM", display_name: "Commercial", default_budget_cents: 100000000 }
              as: LegalOpsManager
              captures: { mt_id: $.data.id }
            - call: "POST /legal-ops/firms"
              payload: { name: "Acme Law", tier: "TIER_1", blended_hourly_rate_cents: 25000 }
              as: LegalOpsManager
              captures: { firm_id: $.data.id }
            - call: "POST /legal-ops/in-house-counsel"
              payload: { full_name: "Casey Counsel", email: "casey@x.com", annual_capacity_hours: 2000, loaded_hourly_cost_cents: 15000 }
              as: LegalOpsManager
              captures: { counsel_id: $.data.id }
            - call: "POST /legal-ops/matters"
              payload: { matter_number: "LGL-2026-00001", title: "Matter One", practice_area_id: "${pa_id}", matter_type_id: "${mt_id}", fiscal_period_id: "${fp_id}", lead_counsel_id: "${counsel_id}", primary_firm_id: "${firm_id}", budget_cents: 100000000 }
              as: LegalOpsAnalyst
              captures: { m_id: $.data.id }
            - call: "POST /legal-ops/matters/${m_id}/assignments"
              payload: { counsel_id: "${counsel_id}", allocated_hours: 100 }
              as: LegalOpsAnalyst
            - call: "POST /legal-ops/matters/${m_id}/activate"
              payload: {}
              as: LegalOpsAnalyst
            - call: "POST /legal-ops/accruals"
              payload: { matter_id: "${m_id}", fiscal_period_id: "${fp_id}", firm_id: "${firm_id}", amount_cents: 4000000 }
              as: LegalOpsAnalyst
              captures: { accrual_id: $.data.id }
            - call: "POST /legal-ops/invoices"
              payload: { matter_id: "${m_id}", firm_id: "${firm_id}", fiscal_period_id: "${fp_id}", invoice_number: "INV-001", amount_cents: 3000000 }
              as: LegalOpsAnalyst
              captures: { inv_id: $.data.id }
            - call: "POST /legal-ops/invoices/${inv_id}/approve"
              payload: {}
              as: LegalOpsAnalyst
            - call: "POST /legal-ops/invoices/${inv_id}/pay"
              payload: {}
              as: LegalOpsManager
            - call: "GET /legal-ops/matters/${m_id}/cost-model"
              as: LegalOpsAnalyst
              captures: { prov_outsource: $.data.outsource_cost_cents }
            - call: "POST /legal-ops/accruals/${accrual_id}/release"
              payload: {}
              as: LegalOpsAnalyst
            - call: "GET /legal-ops/matters/${m_id}"
              as: LegalOpsAnalyst
              captures: { m_ver: $.data.version }
          trigger:
            - call: "POST /legal-ops/matters/${m_id}/close"
              payload: { expected_matter_version: "${m_ver}" }
              as: LegalOpsAnalyst
            - call: "GET /legal-ops/matters/${m_id}/cost-model"
              as: LegalOpsAnalyst
              captures: { final_outsource: $.data.outsource_cost_cents }
          assert:
            - "provisional variant: outsource_cost_cents == 7000000 (3000000 actual + 4000000 accrual)"
            - "final variant: outsource_cost_cents == 3000000 (actual only, accruals excluded)"
            - "insource_cost_cents == 1500000 in BOTH variants (100 hours * 15000)"

      - name: dashboard_draft_vs_published_snapshot_diverges
        grounds:
          - calculations.dashboard_budget_accuracy
          - calculations.dashboard_budget_accuracy.variants.provisional_dashboard
          - calculations.dashboard_budget_accuracy.variants.published_snapshot
        distinguishing_aspect: |
          Same dashboard row, same underlying SpendLine data: DRAFT variant
          recomputes on every read; PUBLISHED variant freezes values at publish
          time. A spend event between draft-read and published-read causes the
          two variants to report different budget_accuracy_pct and
          total_actual_spend_cents.
        test_recipe:
          setup:
            - "Department, period FP OPEN, practice area PA, matter type MT, firm F, counsel C"
            - "Budget B for (FP, PA, MT) allocated_cents 10000000"
            - "Matter M1 ACTIVE; invoice INV1 4000000 cents PAID (consumed 4000000)"
            - "Dashboard D created on FP with snapshot_label Q3 — DRAFT; read once to capture accuracy"
            - "Then invoice INV2 1000000 cents PAID (consumed becomes 5000000)"
          setup_api_calls:
            - call: "POST /legal-ops/departments"
              payload: { name: "Default Legal" }
              as: LegalOpsManager
            - call: "POST /legal-ops/fiscal-periods"
              payload: { label: "FY2026", start_date: "2026-01-01", end_date: "2026-12-31" }
              as: LegalOpsManager
              captures: { fp_id: $.data.id }
            - call: "POST /legal-ops/practice-areas"
              payload: { code: "LIT", display_name: "Litigation" }
              as: LegalOpsManager
              captures: { pa_id: $.data.id }
            - call: "POST /legal-ops/practice-areas/${pa_id}/matter-types"
              payload: { code: "LIT-COMM", display_name: "Commercial", default_budget_cents: 0 }
              as: LegalOpsManager
              captures: { mt_id: $.data.id }
            - call: "POST /legal-ops/firms"
              payload: { name: "Acme", tier: "TIER_1", blended_hourly_rate_cents: 25000 }
              as: LegalOpsManager
              captures: { firm_id: $.data.id }
            - call: "POST /legal-ops/in-house-counsel"
              payload: { full_name: "Casey", email: "casey@x.com", annual_capacity_hours: 2000, loaded_hourly_cost_cents: 15000 }
              as: LegalOpsManager
              captures: { counsel_id: $.data.id }
            - call: "POST /legal-ops/budgets"
              payload: { fiscal_period_id: "${fp_id}", practice_area_id: "${pa_id}", matter_type_id: "${mt_id}", allocated_cents: 10000000 }
              as: LegalOpsManager
            - call: "POST /legal-ops/matters"
              payload: { matter_number: "LGL-2026-00001", title: "M1", practice_area_id: "${pa_id}", matter_type_id: "${mt_id}", fiscal_period_id: "${fp_id}", lead_counsel_id: "${counsel_id}", primary_firm_id: "${firm_id}", budget_cents: 10000000 }
              as: LegalOpsAnalyst
              captures: { m_id: $.data.id }
            - call: "POST /legal-ops/matters/${m_id}/assignments"
              payload: { counsel_id: "${counsel_id}", allocated_hours: 10 }
              as: LegalOpsAnalyst
            - call: "POST /legal-ops/matters/${m_id}/activate"
              payload: {}
              as: LegalOpsAnalyst
            - call: "POST /legal-ops/invoices"
              payload: { matter_id: "${m_id}", firm_id: "${firm_id}", fiscal_period_id: "${fp_id}", invoice_number: "INV-001", amount_cents: 4000000 }
              as: LegalOpsAnalyst
              captures: { inv1_id: $.data.id }
            - call: "POST /legal-ops/invoices/${inv1_id}/approve"
              payload: {}
              as: LegalOpsAnalyst
            - call: "POST /legal-ops/invoices/${inv1_id}/pay"
              payload: {}
              as: LegalOpsManager
            - call: "POST /legal-ops/dashboards"
              payload: { fiscal_period_id: "${fp_id}", snapshot_label: "Q3" }
              as: LegalOpsAnalyst
              captures: { dash_id: $.data.id, dash_v_draft: $.data.version }
            - call: "GET /legal-ops/dashboards/${dash_id}"
              as: LegalOpsAnalyst
              captures: { draft_accuracy: $.data.budget_accuracy_pct, draft_spend: $.data.total_actual_spend_cents }
            - call: "POST /legal-ops/invoices"
              payload: { matter_id: "${m_id}", firm_id: "${firm_id}", fiscal_period_id: "${fp_id}", invoice_number: "INV-002", amount_cents: 1000000 }
              as: LegalOpsAnalyst
              captures: { inv2_id: $.data.id }
            - call: "POST /legal-ops/invoices/${inv2_id}/approve"
              payload: {}
              as: LegalOpsAnalyst
            - call: "POST /legal-ops/invoices/${inv2_id}/pay"
              payload: {}
              as: LegalOpsManager
          trigger:
            - call: "POST /legal-ops/dashboards/${dash_id}/publish"
              payload: { expected_dashboard_version: "${dash_v_draft}" }
              as: LegalOpsManager
            - call: "GET /legal-ops/dashboards/${dash_id}"
              as: LegalOpsAnalyst
              captures: { pub_accuracy: $.data.budget_accuracy_pct, pub_spend: $.data.total_actual_spend_cents }
          assert:
            - "draft read: total_actual_spend_cents == 4000000 AND budget_accuracy_pct == 0.40"
            - "post-publish read: total_actual_spend_cents == 5000000 AND budget_accuracy_pct == 0.50"
            - "draft_accuracy != pub_accuracy — proves the two variants diverge"

  # ==========================================================================
  # Rule 2 — combinatorial_formula (≥2 instances, different modes a/b/c)
  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: budget_posture_three_input_tiered_threshold
        grounds:
          - calculations.budget_posture_derivation
          - entities.LegalDepartment.fields.budget_warning_pct
          - entities.LegalDepartment.fields.budget_critical_pct
        distinguishing_aspect: |
          Mode (a): formula has three inputs (consumed_cents, allocated_cents,
          budget_warning_pct, budget_critical_pct) with non-linear interaction —
          tiered threshold selection where boundary branches on ratio vs both
          department-tunable cutoffs. Tests pin three distinct ratios that land
          in three different postures under one (warning, critical) configuration.
        test_recipe:
          setup:
            - "Department with budget_warning_pct 0.80, budget_critical_pct 0.95"
            - "Period FP OPEN; PA; MT under PA; firm F; counsel C"
            - "Budget B1 for (FP,PA,MT) allocated 10000000"
            - "Matter M1 ACTIVE; invoices summing exactly 7900000 (79%) PAID — posture OK"
            - "Additional invoice brings consumed to exactly 9500000 (95%) — posture CRITICAL"
            - "Final invoice brings consumed to exactly 10000000 (100%) — posture EXCEEDED"
          setup_api_calls:
            - call: "POST /legal-ops/departments"
              payload: { name: "D", budget_warning_pct: 0.80, budget_critical_pct: 0.95 }
              as: LegalOpsManager
            - call: "POST /legal-ops/fiscal-periods"
              payload: { label: "FY2026", start_date: "2026-01-01", end_date: "2026-12-31" }
              as: LegalOpsManager
              captures: { fp_id: $.data.id }
            - call: "POST /legal-ops/practice-areas"
              payload: { code: "LIT", display_name: "Litigation" }
              as: LegalOpsManager
              captures: { pa_id: $.data.id }
            - call: "POST /legal-ops/practice-areas/${pa_id}/matter-types"
              payload: { code: "LIT-C", display_name: "C", default_budget_cents: 0 }
              as: LegalOpsManager
              captures: { mt_id: $.data.id }
            - call: "POST /legal-ops/firms"
              payload: { name: "F", tier: "TIER_1", blended_hourly_rate_cents: 25000 }
              as: LegalOpsManager
              captures: { firm_id: $.data.id }
            - call: "POST /legal-ops/in-house-counsel"
              payload: { full_name: "C", email: "c@x.com", annual_capacity_hours: 2000, loaded_hourly_cost_cents: 15000 }
              as: LegalOpsManager
              captures: { counsel_id: $.data.id }
            - call: "POST /legal-ops/budgets"
              payload: { fiscal_period_id: "${fp_id}", practice_area_id: "${pa_id}", matter_type_id: "${mt_id}", allocated_cents: 10000000 }
              as: LegalOpsManager
              captures: { b_id: $.data.id }
            - call: "POST /legal-ops/matters"
              payload: { matter_number: "LGL-2026-00001", title: "M", practice_area_id: "${pa_id}", matter_type_id: "${mt_id}", fiscal_period_id: "${fp_id}", lead_counsel_id: "${counsel_id}", primary_firm_id: "${firm_id}" }
              as: LegalOpsAnalyst
              captures: { m_id: $.data.id }
            - call: "POST /legal-ops/matters/${m_id}/assignments"
              payload: { counsel_id: "${counsel_id}", allocated_hours: 5 }
              as: LegalOpsAnalyst
            - call: "POST /legal-ops/matters/${m_id}/activate"
              payload: {}
              as: LegalOpsAnalyst
            - call: "POST /legal-ops/invoices"
              payload: { matter_id: "${m_id}", firm_id: "${firm_id}", fiscal_period_id: "${fp_id}", invoice_number: "I-1", amount_cents: 7900000 }
              as: LegalOpsAnalyst
              captures: { inv1: $.data.id }
            - call: "POST /legal-ops/invoices/${inv1}/approve"
              payload: {}
              as: LegalOpsAnalyst
            - call: "POST /legal-ops/invoices/${inv1}/pay"
              payload: {}
              as: LegalOpsManager
            - call: "GET /legal-ops/budgets/${b_id}"
              as: LegalOpsAnalyst
              captures: { posture_1: $.data.posture }
            - call: "POST /legal-ops/invoices"
              payload: { matter_id: "${m_id}", firm_id: "${firm_id}", fiscal_period_id: "${fp_id}", invoice_number: "I-2", amount_cents: 1600000 }
              as: LegalOpsAnalyst
              captures: { inv2: $.data.id }
            - call: "POST /legal-ops/invoices/${inv2}/approve"
              payload: {}
              as: LegalOpsAnalyst
            - call: "POST /legal-ops/invoices/${inv2}/pay"
              payload: {}
              as: LegalOpsManager
            - call: "GET /legal-ops/budgets/${b_id}"
              as: LegalOpsAnalyst
              captures: { posture_2: $.data.posture }
            - call: "POST /legal-ops/invoices"
              payload: { matter_id: "${m_id}", firm_id: "${firm_id}", fiscal_period_id: "${fp_id}", invoice_number: "I-3", amount_cents: 500000 }
              as: LegalOpsAnalyst
              captures: { inv3: $.data.id }
            - call: "POST /legal-ops/invoices/${inv3}/approve"
              payload: {}
              as: LegalOpsAnalyst
          trigger:
            - call: "POST /legal-ops/invoices/${inv3}/pay"
              payload: {}
              as: LegalOpsManager
            - call: "GET /legal-ops/budgets/${b_id}"
              as: LegalOpsAnalyst
              captures: { posture_3: $.data.posture }
          assert:
            - "posture_1 == OK (ratio 0.79 < 0.80 warning)"
            - "posture_2 == CRITICAL (ratio 0.95 >= 0.95 critical threshold — inclusive boundary)"
            - "posture_3 == EXCEEDED (ratio 1.00 >= 1.0 exceeded — inclusive boundary)"

      - name: dashboard_accuracy_rounding_order_pinned
        grounds:
          - calculations.dashboard_budget_accuracy
          - calculations.dashboard_budget_accuracy.precision
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the rule pins
          "round AFTER multiplying by 100, then divide by 100" so
          round_half_up((1 - delta/alloc) * 100, 2) / 100 differs from
          round_half_up(1 - delta/alloc, 4). Uses an alloc/delta pair whose
          raw ratio falls at a half-cent boundary on the 3rd decimal so the
          two orders produce observably different cents.
        test_recipe:
          setup:
            - "Department defaults; FP OPEN; PA; MT; firm; counsel"
            - "Budget B allocated 333333 cents (so division produces non-terminating decimals)"
            - "Matter ACTIVE; invoice 100001 cents PAID — SpendLine 100001"
            - "Dashboard D created on FP — DRAFT"
          setup_api_calls:
            - call: "POST /legal-ops/departments"
              payload: { name: "D" }
              as: LegalOpsManager
            - call: "POST /legal-ops/fiscal-periods"
              payload: { label: "FY2026", start_date: "2026-01-01", end_date: "2026-12-31" }
              as: LegalOpsManager
              captures: { fp_id: $.data.id }
            - call: "POST /legal-ops/practice-areas"
              payload: { code: "IP", display_name: "IP" }
              as: LegalOpsManager
              captures: { pa_id: $.data.id }
            - call: "POST /legal-ops/practice-areas/${pa_id}/matter-types"
              payload: { code: "IP-PAT", display_name: "Patent" }
              as: LegalOpsManager
              captures: { mt_id: $.data.id }
            - call: "POST /legal-ops/firms"
              payload: { name: "F", tier: "TIER_2", blended_hourly_rate_cents: 20000 }
              as: LegalOpsManager
              captures: { firm_id: $.data.id }
            - call: "POST /legal-ops/in-house-counsel"
              payload: { full_name: "C", email: "c@x.com", annual_capacity_hours: 2000, loaded_hourly_cost_cents: 15000 }
              as: LegalOpsManager
              captures: { counsel_id: $.data.id }
            - call: "POST /legal-ops/budgets"
              payload: { fiscal_period_id: "${fp_id}", practice_area_id: "${pa_id}", matter_type_id: "${mt_id}", allocated_cents: 333333 }
              as: LegalOpsManager
            - call: "POST /legal-ops/matters"
              payload: { matter_number: "LGL-2026-00002", title: "M", practice_area_id: "${pa_id}", matter_type_id: "${mt_id}", fiscal_period_id: "${fp_id}", lead_counsel_id: "${counsel_id}", primary_firm_id: "${firm_id}" }
              as: LegalOpsAnalyst
              captures: { m_id: $.data.id }
            - call: "POST /legal-ops/matters/${m_id}/assignments"
              payload: { counsel_id: "${counsel_id}", allocated_hours: 5 }
              as: LegalOpsAnalyst
            - call: "POST /legal-ops/matters/${m_id}/activate"
              payload: {}
              as: LegalOpsAnalyst
            - call: "POST /legal-ops/invoices"
              payload: { matter_id: "${m_id}", firm_id: "${firm_id}", fiscal_period_id: "${fp_id}", invoice_number: "I-1", amount_cents: 100001 }
              as: LegalOpsAnalyst
              captures: { inv_id: $.data.id }
            - call: "POST /legal-ops/invoices/${inv_id}/approve"
              payload: {}
              as: LegalOpsAnalyst
            - call: "POST /legal-ops/invoices/${inv_id}/pay"
              payload: {}
              as: LegalOpsManager
            - call: "POST /legal-ops/dashboards"
              payload: { fiscal_period_id: "${fp_id}", snapshot_label: "snap" }
              as: LegalOpsAnalyst
              captures: { dash_id: $.data.id }
          trigger:
            - call: "GET /legal-ops/dashboards/${dash_id}"
              as: LegalOpsAnalyst
              captures: { acc: $.data.budget_accuracy_pct }
          assert:
            - "raw inputs: alloc=333333, spend=100001, delta=233332; (1 - 233332/333333) * 100 = 30.000300003"
            - "Pinned rounding order: round_half_up(30.000300003, 2) = 30.00, then / 100 = 0.30"
            - "Dashboard.total_actual_spend_cents == 100001"
            - "Dashboard.budget_accuracy_pct == 0.30 (the exact value after the pinned round-then-divide sequence)"

  # ==========================================================================
  # Rule 3 — non_linear_state_machine (≥2 instances, different entities)
  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: fiscal_period_open_softclose_reopen_cycle
        grounds:
          - state_machines.FiscalPeriod
          - state_machines.FiscalPeriod.transitions.OPEN_to_SOFT_CLOSED
          - state_machines.FiscalPeriod.transitions.HARD_CLOSED_to_REOPENED
          - state_machines.FiscalPeriod.transitions.REOPENED_to_SOFT_CLOSED
        distinguishing_aspect: |
          FiscalPeriod exhibits a CYCLE — HARD_CLOSED -> REOPENED -> SOFT_CLOSED
          -> HARD_CLOSED (up to reopen_count limit). Not a linear pipeline; the
          same soft-close endpoint applies to both OPEN and REOPENED states with
          the same sweep side effect, so the machine has branching incoming
          edges.
        test_recipe:
          setup:
            - "Department; FP OPEN"
            - "Soft-close FP -> SOFT_CLOSED"
            - "Hard-close FP -> HARD_CLOSED"
          setup_api_calls:
            - call: "POST /legal-ops/departments"
              payload: { name: "D" }
              as: LegalOpsManager
            - call: "POST /legal-ops/fiscal-periods"
              payload: { label: "FY2026", start_date: "2026-01-01", end_date: "2026-12-31" }
              as: LegalOpsManager
              captures: { fp_id: $.data.id }
            - call: "POST /legal-ops/fiscal-periods/${fp_id}/soft-close"
              payload: {}
              as: LegalOpsAnalyst
            - call: "POST /legal-ops/fiscal-periods/${fp_id}/hard-close"
              payload: {}
              as: LegalOpsManager
          trigger:
            - call: "POST /legal-ops/fiscal-periods/${fp_id}/reopen"
              payload: {}
              as: LegalOpsManager
              captures: { fp_state: $.data.status, rc: $.data.reopen_count }
            - call: "POST /legal-ops/fiscal-periods/${fp_id}/soft-close"
              payload: {}
              as: LegalOpsAnalyst
              captures: { fp_state_2: $.data.status }
            - call: "POST /legal-ops/fiscal-periods/${fp_id}/hard-close"
              payload: {}
              as: LegalOpsManager
            - call: "POST /legal-ops/fiscal-periods/${fp_id}/reopen"
              payload: {}
              as: LegalOpsManager
              captures: { rc2: $.data.reopen_count }
            - call: "POST /legal-ops/fiscal-periods/${fp_id}/soft-close"
              payload: {}
              as: LegalOpsAnalyst
            - call: "POST /legal-ops/fiscal-periods/${fp_id}/hard-close"
              payload: {}
              as: LegalOpsManager
            - call: "POST /legal-ops/fiscal-periods/${fp_id}/reopen"
              payload: {}
              as: LegalOpsManager
              captures: { err: $.data.error_id }
          assert:
            - "After first reopen: status == REOPENED, reopen_count == 1"
            - "After re-soft-close: status == SOFT_CLOSED"
            - "After second cycle: reopen_count == 2"
            - "Third reopen attempt rejected: error_id == ERR_REOPEN_LIMIT (cyclic loop has a termination condition)"

      - name: invoice_parallel_state_dimensions
        grounds:
          - state_machines.Invoice
          - entities.Invoice.fields.payment_status
          - entities.Invoice.fields.accrual_match_status
          - calculations.accrual_match_amount_classification
        distinguishing_aspect: |
          Invoice has PARALLEL state dimensions: payment_status (SUBMITTED /
          APPROVED / PAID / REJECTED) and accrual_match_status (UNMATCHED /
          PARTIALLY_MATCHED / FULLY_MATCHED / OVER_BILLED) evolve on independent
          axes. The accrual_match axis is set during the approve transition;
          payment axis is set during pay/reject. Paying an invoice after
          approval preserves the previously-computed accrual_match_status.
        test_recipe:
          setup:
            - "Department; FP OPEN; PA; MT; firm F; counsel C"
            - "Matter M ACTIVE"
            - "Accrual AC amount 500000 cents OUTSTANDING"
            - "Invoice INV amount 300000 cents SUBMITTED"
          setup_api_calls:
            - call: "POST /legal-ops/departments"
              payload: { name: "D" }
              as: LegalOpsManager
            - call: "POST /legal-ops/fiscal-periods"
              payload: { label: "FY2026", start_date: "2026-01-01", end_date: "2026-12-31" }
              as: LegalOpsManager
              captures: { fp_id: $.data.id }
