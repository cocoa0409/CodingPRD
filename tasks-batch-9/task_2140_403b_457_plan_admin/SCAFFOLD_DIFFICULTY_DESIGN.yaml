  - rule_id: compensating_invariant
    instances:

      - name: transfer_execute_reverse_preserves_participant_benefit_total
        grounds:
          - state_machines.TransferExchangeRequest.APPROVED_to_EXECUTED
          - state_machines.TransferExchangeRequest.EXECUTED_to_REVERSED
          - entities.VendorAccount.fields.accumulated_benefit_cents
          - entities.Participant.fields.total_accumulated_benefit_cents
          - endpoints[POST /plan-admin/transfer-exchange-requests/{id}/reverse]
        distinguishing_aspect: |
          Conserved quantity: INV_BENEFIT = SUM of VendorAccount.accumulated_benefit_cents
          over the participant's OPEN contracts. Executing the exchange and then reversing it
          must leave INV_BENEFIT at exactly 6000000 cents at all three observation points and
          must restore each contract to its own pre-execution balance (5000000 and 1000000),
          with zero drift.
