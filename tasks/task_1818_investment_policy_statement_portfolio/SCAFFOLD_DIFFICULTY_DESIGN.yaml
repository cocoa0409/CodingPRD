            - { call: "GET /advisory/trade-instructions", payload: { proposal_id: "${prop}", security_id: "${s_eib}" }, as: Advisor, captures: { buy_qty: "$.data[0].quantity" } }
          assert:
            - "RebalanceProposal.${prop}.total_sells_cents == 37000 (SELL 37 EQZ @ 1000)"
            - "RebalanceProposal.${prop}.est_tax_reserve_cents == 3700 (relief 18500, gain 18500, 20%)"
            - "RebalanceProposal.${prop}.total_buys_cents == 34000 (trimmed from 36500: available = 1000 + 37000 - 3700 = 34300)"
            - "the EIB BUY trade quantity == 68 (floor(34300/500)), NOT the untrimmed 73"
            - "RebalanceProposal.${prop}.cash_delta_cents == -700"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (3 instances, different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: portfolio_parallel_drift_dimension_independence
        grounds:
          - state_machines.Portfolio.ACTIVE_to_FROZEN
          - state_machines.Portfolio.BREACHED_to_WITHIN_BANDS
          - entities.Portfolio.fields.drift_status
        distinguishing_aspect: |
          Portfolio carries two parallel state dimensions: lifecycle_status (endpoint-driven)
          and drift_status (computed). Freezing does not alter drift; a reprice while FROZEN
          flips drift BREACHED -> WITHIN_BANDS without touching lifecycle — the dimensions
          evolve independently on the same row.
        test_recipe:
          setup:
            - "ACTIVE client, ACTIVE IPS (targets US_EQUITY 60.00/5.00, CASH_EQUIVALENT 40.00/5.00)"
            - "TAXABLE portfolio ACTIVE: cash 400000, EQA 600 @ 1000 basis 480000 (total 1000000, WITHIN_BANDS)"
            - "reprice EQA to 1500 -> total 1300000, US 69.23% -> drift_status BREACHED while lifecycle ACTIVE"
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "Parallel Client", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench", description: "blend" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "Growth", risk_tolerance_score: 50, review_cadence_months: 12 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: US_EQUITY, target_pct: 60.00, band_pct: 5.00 }, { asset_class: CASH_EQUIVALENT, target_pct: 40.00, band_pct: 5.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c}" }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c}", name: "Main", tax_status: TAXABLE }, as: Advisor, captures: { p: $.data.id } }
            - { call: "POST /advisory/portfolios/${p}/activate", as: Advisor }
            - { call: "POST /advisory/portfolios/${p}/cash-movements", payload: { direction: DEPOSIT, amount_cents: 400000, occurred_at: "2026-08-01T00:00:00Z" }, as: Advisor }
            - { call: "POST /advisory/securities", payload: { ticker: "EQA", asset_class: US_EQUITY, initial_price_cents: 1000 }, as: ComplianceOfficer, captures: { s: $.data.id } }
            - { call: "POST /advisory/positions", payload: { portfolio_id: "${p}", security_id: "${s}", quantity: 600, opening_cost_basis_cents: 480000 }, as: Advisor }
            - { call: "POST /advisory/securities/${s}/reprice", payload: { new_price_cents: 1500 }, as: ComplianceOfficer }
          trigger:
            - { call: "POST /advisory/portfolios/${p}/freeze", as: ComplianceOfficer }
            - { call: "GET /advisory/portfolios/${p}", as: Advisor, captures: { drift_frozen: $.data.drift_status } }
            - { call: "POST /advisory/securities/${s}/reprice", payload: { new_price_cents: 1000 }, as: ComplianceOfficer }
            - { call: "GET /advisory/portfolios/${p}", as: Advisor, captures: { drift_frozen2: $.data.drift_status } }
            - { call: "POST /advisory/portfolios/${p}/unfreeze", as: ComplianceOfficer }
          assert:
            - "after freeze: lifecycle_status == FROZEN AND drift_status == BREACHED (freeze leaves the drift dimension untouched)"
            - "after reprice back to 1000 while FROZEN: drift_status == WITHIN_BANDS AND lifecycle_status == FROZEN (computed dimension moves independently)"
            - "after unfreeze: lifecycle_status == ACTIVE AND drift_status == WITHIN_BANDS"

      - name: proposal_revision_cycle_regenerates_trades
        grounds:
          - state_machines.RebalanceProposal.PROPOSED_to_NEEDS_REVISION
          - state_machines.RebalanceProposal.NEEDS_REVISION_to_PROPOSED
          - calculations.rebalance_trade_generation
        distinguishing_aspect: |
          RebalanceProposal is cyclic: PROPOSED -> NEEDS_REVISION -> PROPOSED. The loop is not a
          no-op: revise cancels the old trades and regenerates them at CURRENT prices
          (total_sells 120000 at price 1500 becomes 131750 at price 1550), refreshes the IPS pin
          and TTL, and bumps the proposal version.
        test_recipe:
          setup:
            - "same 60/40 fixture; portfolio cash 400000 + EQA 600 @ 1000 basis 480000; reprice EQA 1500 -> BREACHED (total 1300000, US 69.23%)"
            - "proposal G1 generated (DRIFT_BREACH): SELL 80 EQA pinned 1500, total_sells_cents 120000"
            - "compliance request-changes -> NEEDS_REVISION; reprice EQA 1550 (total 1330000, still BREACHED: US 69.92%, drift 992bps > 500)"
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "Cycle Client", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench", description: "blend" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "Growth", risk_tolerance_score: 50, review_cadence_months: 12 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: US_EQUITY, target_pct: 60.00, band_pct: 5.00 }, { asset_class: CASH_EQUIVALENT, target_pct: 40.00, band_pct: 5.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c}" }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c}", name: "Main", tax_status: TAXABLE }, as: Advisor, captures: { p: $.data.id } }
            - { call: "POST /advisory/portfolios/${p}/activate", as: Advisor }
            - { call: "POST /advisory/portfolios/${p}/cash-movements", payload: { direction: DEPOSIT, amount_cents: 400000, occurred_at: "2026-08-01T00:00:00Z" }, as: Advisor }
            - { call: "POST /advisory/securities", payload: { ticker: "EQA", asset_class: US_EQUITY, initial_price_cents: 1000 }, as: ComplianceOfficer, captures: { s: $.data.id } }
            - { call: "POST /advisory/positions", payload: { portfolio_id: "${p}", security_id: "${s}", quantity: 600, opening_cost_basis_cents: 480000 }, as: Advisor }
            - { call: "POST /advisory/securities/${s}/reprice", payload: { new_price_cents: 1500 }, as: ComplianceOfficer }
            - { call: "GET /advisory/portfolios/${p}", as: Advisor, captures: { pv: $.data.version } }
            - { call: "POST /advisory/rebalance-proposals", payload: { portfolio_id: "${p}", trigger_type: DRIFT_BREACH, expected_portfolio_version: "${pv}" }, as: Advisor, captures: { prop: $.data.id } }
            - { call: "POST /advisory/rebalance-proposals/${prop}/request-changes", payload: { reason: "resize" }, as: ComplianceOfficer }
            - { call: "POST /advisory/securities/${s}/reprice", payload: { new_price_cents: 1550 }, as: ComplianceOfficer }
          trigger:
            - { call: "POST /advisory/rebalance-proposals/${prop}/revise", as: Advisor }
            - { call: "GET /advisory/trade-instructions", payload: { proposal_id: "${prop}", status: PENDING }, as: Advisor, captures: { new_qty: "$.data[0].quantity", new_pin: "$.data[0].pinned_price_cents" } }
          assert:
            - "RebalanceProposal.${prop}.status == PROPOSED after the loop (cycle completed)"
            - "RebalanceProposal.${prop}.total_sells_cents == 131750 (SELL 85 @ 1550), not the pre-loop 120000"
            - "exactly 1 PENDING trade exists (quantity 85, pinned_price_cents 1550); the original SELL-80 trade is CANCELLED"
            - "RebalanceProposal.${prop}.est_tax_reserve_cents == 12750 (relief 68000, gain 63750)"

      - name: withdrawal_remodel_loop_after_staleness_revert
        grounds:
          - state_machines.WithdrawalRequest.SUBMITTED_to_MODELED
          - state_machines.WithdrawalRequest.MODELED_to_SUBMITTED
          - calculations.withdrawal_impact_model
        distinguishing_aspect: |
          WithdrawalRequest has a revert loop SUBMITTED -> MODELED -> SUBMITTED -> MODELED:
          a reprice of a held security reverts MODELED -> SUBMITTED and clears the plan;
          re-modeling at the new price produces a different plan (proceeds 50000 -> 50400).
        test_recipe:
          setup:
            - "P3 fixture: cash 100000; LOT1 EQA 100 @ 1000 basis 90000; LOT2 EQB 100 @ 1000 basis 40000; LOT3 EIB 200 @ 500 basis 110000"
            - "W TAX_AWARE amount 150000, first model: plan [LOT3 x 100], proceeds 50000, tax 0"
            - "reprice EIB 500 -> 600 reverts W to SUBMITTED (LOT3 gain/unit becomes +50, still lowest)"
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "Remodel Client", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench", description: "blend" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "Growth", risk_tolerance_score: 50, review_cadence_months: 12 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: US_EQUITY, target_pct: 60.00, band_pct: 5.00 }, { asset_class: INTL_EQUITY, target_pct: 20.00, band_pct: 5.00 }, { asset_class: CASH_EQUIVALENT, target_pct: 20.00, band_pct: 5.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c}" }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c}", name: "Main", tax_status: TAXABLE }, as: Advisor, captures: { p: $.data.id } }
            - { call: "POST /advisory/portfolios/${p}/activate", as: Advisor }
            - { call: "POST /advisory/portfolios/${p}/cash-movements", payload: { direction: DEPOSIT, amount_cents: 100000, occurred_at: "2026-08-01T00:00:00Z" }, as: Advisor }
            - { call: "POST /advisory/securities", payload: { ticker: "EQA", asset_class: US_EQUITY, initial_price_cents: 1000 }, as: ComplianceOfficer, captures: { s_eqa: $.data.id } }
            - { call: "POST /advisory/securities", payload: { ticker: "EQB", asset_class: US_EQUITY, initial_price_cents: 1000 }, as: ComplianceOfficer, captures: { s_eqb: $.data.id } }
            - { call: "POST /advisory/securities", payload: { ticker: "EIB", asset_class: INTL_EQUITY, initial_price_cents: 500 }, as: ComplianceOfficer, captures: { s_eib: $.data.id } }
            - { call: "POST /advisory/positions", payload: { portfolio_id: "${p}", security_id: "${s_eqa}", quantity: 100, opening_cost_basis_cents: 90000 }, as: Advisor }
            - { call: "POST /advisory/positions", payload: { portfolio_id: "${p}", security_id: "${s_eqb}", quantity: 100, opening_cost_basis_cents: 40000 }, as: Advisor }
            - { call: "POST /advisory/positions", payload: { portfolio_id: "${p}", security_id: "${s_eib}", quantity: 200, opening_cost_basis_cents: 110000 }, as: Advisor, captures: { lot3: $.data.id } }
            - { call: "POST /advisory/withdrawal-requests", payload: { portfolio_id: "${p}", amount_cents: 150000, funding_mode: TAX_AWARE }, as: Advisor, captures: { w: $.data.id } }
            - { call: "POST /advisory/withdrawal-requests/${w}/model-impact", as: Advisor }
            - { call: "POST /advisory/securities/${s_eib}/reprice", payload: { new_price_cents: 600 }, as: ComplianceOfficer }
          trigger:
            - { call: "GET /advisory/withdrawal-requests/${w}", as: Advisor }
            - { call: "POST /advisory/withdrawal-requests/${w}/model-impact", as: Advisor }
          assert:
            - "after reprice: WithdrawalRequest.${w}.status == SUBMITTED with modeled_plan cleared (empty) and modeled_at null — the loop returned to SUBMITTED"
            - "after second model-impact: status == MODELED again (loop completed twice)"
            - "second model: modeled_proceeds_cents == 50400 (LOT3 qty 84 @ 600), modeled_tax_cost_cents == 840 (relief 46200, gain 4200)"
            - "second model plan == exactly 1 lot: position ${lot3} quantity 84"

  # ===========================================================================
  # Rule 4 — transitive_cascade (2 instances, different triggers, depth >= 3 / >= 2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: reprice_cascade_through_valuation_drift_and_model_staleness
        grounds:
          - state_machines.Portfolio.BREACHED_to_WITHIN_BANDS
          - state_machines.WithdrawalRequest.MODELED_to_SUBMITTED
          - calculations.portfolio_valuation
          - calculations.drift_assessment
        distinguishing_aspect: |
          Depth-4 chain from a single trigger (security reprice): price -> Position
          market_value/unrealized recompute -> Portfolio total_value recompute -> drift_status
          flip (BREACHED -> WITHIN_BANDS) -> MODELED WithdrawalRequest staleness revert to
          SUBMITTED. Each hop is caused by the previous hop's mutation, not by the reprice directly.
        test_recipe:
          setup:
            - "P3 fixture (cash 100000; LOT1 EQA 100 @ 1000 basis 90000; LOT2 EQB 100 @ 1000 basis 40000; LOT3 EIB 200 @ 500 basis 110000; total 400000; US 50% vs 60% target -> BREACHED)"
            - "W TAX_AWARE amount 150000 MODELED (plan [LOT3 x 100], proceeds 50000)"
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "Cascade Client", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench", description: "blend" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "Growth", risk_tolerance_score: 50, review_cadence_months: 12 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: US_EQUITY, target_pct: 60.00, band_pct: 5.00 }, { asset_class: INTL_EQUITY, target_pct: 20.00, band_pct: 5.00 }, { asset_class: CASH_EQUIVALENT, target_pct: 20.00, band_pct: 5.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c}" }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c}", name: "Main", tax_status: TAXABLE }, as: Advisor, captures: { p: $.data.id } }
            - { call: "POST /advisory/portfolios/${p}/activate", as: Advisor }
            - { call: "POST /advisory/portfolios/${p}/cash-movements", payload: { direction: DEPOSIT, amount_cents: 100000, occurred_at: "2026-08-01T00:00:00Z" }, as: Advisor }
            - { call: "POST /advisory/securities", payload: { ticker: "EQA", asset_class: US_EQUITY, initial_price_cents: 1000 }, as: ComplianceOfficer, captures: { s_eqa: $.data.id } }
            - { call: "POST /advisory/securities", payload: { ticker: "EQB", asset_class: US_EQUITY, initial_price_cents: 1000 }, as: ComplianceOfficer, captures: { s_eqb: $.data.id } }
            - { call: "POST /advisory/securities", payload: { ticker: "EIB", asset_class: INTL_EQUITY, initial_price_cents: 500 }, as: ComplianceOfficer, captures: { s_eib: $.data.id } }
            - { call: "POST /advisory/positions", payload: { portfolio_id: "${p}", security_id: "${s_eqa}", quantity: 100, opening_cost_basis_cents: 90000 }, as: Advisor, captures: { lot1: $.data.id } }
            - { call: "POST /advisory/positions", payload: { portfolio_id: "${p}", security_id: "${s_eqb}", quantity: 100, opening_cost_basis_cents: 40000 }, as: Advisor }
            - { call: "POST /advisory/positions", payload: { portfolio_id: "${p}", security_id: "${s_eib}", quantity: 200, opening_cost_basis_cents: 110000 }, as: Advisor }
            - { call: "POST /advisory/withdrawal-requests", payload: { portfolio_id: "${p}", amount_cents: 150000, funding_mode: TAX_AWARE }, as: Advisor, captures: { w: $.data.id } }
            - { call: "POST /advisory/withdrawal-requests/${w}/model-impact", as: Advisor }
          trigger:
            - { call: "POST /advisory/securities/${s_eqa}/reprice", payload: { new_price_cents: 1600 }, as: ComplianceOfficer }
          assert:
            - "hop 1: Position.${lot1}.market_value_cents == 160000 and unrealized_gain_cents == 70000"
            - "hop 2: Portfolio.${p}.total_value_cents == 460000"
            - "hop 3: Portfolio.${p}.drift_status == WITHIN_BANDS (US 5652bps vs 6000 target: drift 348 <= 500 band; flipped from BREACHED)"
            - "hop 4: WithdrawalRequest.${w}.status == SUBMITTED, modeled_plan cleared, modeled_at null"

      - name: amendment_finalize_cascade_expires_pinned_proposals
        grounds:
          - state_machines.IPSAmendment.QUORUM_REACHED_to_APPROVED
          - state_machines.RebalanceProposal.PROPOSED_to_EXPIRED
