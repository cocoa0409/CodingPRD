  - rule_id: boundary_precision_check
    instances:

      - name: roster_lock_deadline_inclusive_at_the_exact_millisecond
        metric: "millisecond timestamp comparison against Season.roster_lock_at"
        endpoint: "POST /teams/{teamId}/roster-lock"
        grounds:
          - validations[priority=45]
          - errors[ERR_ROSTER_LOCK_DEADLINE_PASSED]
          - state_machines.Team.REGISTERED_to_ROSTER_LOCKED
          - entities.Season.fields.roster_lock_at
        distinguishing_aspect: |
          The metric is a millisecond instant and the endpoint is roster-lock. The rule is
          clock.now <= roster_lock_at, INCLUSIVE, so locking at exactly
          2026-09-20T00:00:00.000Z must succeed and one millisecond later must fail. Two teams
          are pre-registered so each side of the boundary can be probed with a real call, since
          the transition is one-shot per team.
        test_recipe:
          setup:
            - "One district, school, two CERTIFIED coaches, two students with 3.100 / 6-credit postings, one district-APPROVED title"
            - "Season with the default roster_lock_at 2026-09-20T00:00:00.000Z, in REGISTRATION_OPEN"
