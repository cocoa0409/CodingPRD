# §1.9 Scaffold Corner Design — Breadth Coverage Index
# task_2261_airline_loyalty_partner_co_brand
# Sections and claim_type values are taken verbatim from
# references/claim-extraction-guide.md. Corners already probed by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an `excluded_because:` stub instead of a
# test_recipe. Every numeric assert is a pre-computed literal.
scaffold_corner_design:

  # ===================================================================
  - section: entities
    instances:

      - name: co_brand_issuer_creation_returns_all_fields_with_zeroed_aggregate
        claim_type: creation
        grounds:
          - entities.CoBrandIssuer
          - endpoints[POST /co-brand-issuers]
          - response_envelope
        distinguishing_aspect: "A freshly created issuer must come back with aggregate_committed_miles 0, status ACTIVE, suspension_reason NONE and version 1 inside the standard success envelope — none of the four is client-supplied."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Corner", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
          trigger:
            - call: "POST /co-brand-issuers"
              payload: { program_id: "${prog_id}", name: "Northbank Card Services", annual_mile_purchase_cap_miles: 20000000 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { issuer_id: "$.data.id" }
          assert:
            - "the trigger returns HTTP 201"
            - "the response body carries meta.api_request_id, meta.api_request_timestamp, response_type == \"object\" and a data object"
            - "CoBrandIssuer.${issuer_id}.aggregate_committed_miles == 0"
            - "CoBrandIssuer.${issuer_id}.status == ACTIVE"
            - "CoBrandIssuer.${issuer_id}.suspension_reason == NONE"
            - "CoBrandIssuer.${issuer_id}.annual_mile_purchase_cap_miles == 20000000"
            - "CoBrandIssuer.${issuer_id}.version == 1"
            - "CoBrandIssuer.${issuer_id}.id is a bare UUID with no type prefix"

      - name: member_account_retrieval_returns_stored_projection
        claim_type: retrieval
        grounds:
          - endpoints[GET /member-accounts/{memberId}]
          - entities.MemberAccount
        distinguishing_aspect: "GET on a member created with rollover_carried_in 12000 returns that exact input plus the four zeroed dimensions (BASE / NORMAL / NONE / ACCUMULATING), proving the read is a projection of stored state and not a recomputation."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "One MemberAccount created with cycle_year 2026 and rollover_carried_in 12000, no ledger rows."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Read", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /member-accounts"
              payload: { program_id: "${prog_id}", external_member_ref: "MBR-READ", home_region: "EMEA", cycle_year: 2026, rollover_carried_in: 12000 }
              as: ProgramAdmin
              captures: { mem_id: "$.data.id" }
          trigger:
            - call: "GET /member-accounts/${mem_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "the trigger returns HTTP 200"
            - "MemberAccount.${mem_id}.rollover_carried_in == 12000"
            - "MemberAccount.${mem_id}.elite_tier == BASE"
            - "MemberAccount.${mem_id}.security_state == NORMAL"
            - "MemberAccount.${mem_id}.status_match_state == NONE"
            - "MemberAccount.${mem_id}.qualification_state == ACCUMULATING"
            - "MemberAccount.${mem_id}.mile_balance == 0"
            - "MemberAccount.${mem_id}.qualifying_miles_ytd == 0"
            - "MemberAccount.${mem_id}.rollover_carried_out == 0"
            - "MemberAccount.${mem_id}.awarded_tier_at_close == null"

      - name: mile_transaction_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /mile-transactions]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Three ledger rows read back with limit=2 must report total_count 3 and has_more true on the first page and has_more false on offset=2, so total_count counts the whole filtered set rather than the returned page."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "One MemberAccount holding exactly three ledger rows: a 1000-mile partner earn, a 2000-mile partner earn and a 500-mile redemption, all dated 2026-07-10."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Paging", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /member-accounts"
              payload: { program_id: "${prog_id}", external_member_ref: "MBR-PAGE", home_region: "APAC" }
              as: ProgramAdmin
              captures: { mem_id: "$.data.id" }
            - call: "POST /mile-transactions"
              payload: { member_id: "${mem_id}", txn_type: "PARTNER_EARN", activity_date: "2026-07-10", base_miles: 1000 }
              as: RevenueAccountant
            - call: "POST /mile-transactions"
              payload: { member_id: "${mem_id}", txn_type: "PARTNER_EARN", activity_date: "2026-07-10", base_miles: 2000 }
              as: RevenueAccountant
            - call: "POST /mile-transactions"
              payload: { member_id: "${mem_id}", txn_type: "REDEEM", activity_date: "2026-07-10", base_miles: 500 }
              as: RevenueAccountant
          trigger:
            - call: "GET /mile-transactions?member_id=${mem_id}&limit=2&offset=0"
              payload: {}
              as: RevenueAccountant
            - call: "GET /mile-transactions?member_id=${mem_id}&limit=2&offset=2"
              payload: {}
              as: RevenueAccountant
          assert:
            - "the first trigger returns HTTP 200 with response_type == \"array\", total_count 3, has_more true and exactly 2 rows"
            - "the second trigger returns total_count 3, has_more false and exactly 1 row"
            - "MemberAccount.${mem_id}.mile_balance == 2500"
            - "GET /mile-transactions?member_id=${mem_id}&txn_type=PARTNER_EARN returns total_count 2"

      - name: award_booking_get_with_unknown_id_returns_booking_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /award-bookings/{bookingId}]
          - errors.ERR_BOOKING_NOT_FOUND
          - validations[priority=5]
        distinguishing_aspect: "A well-formed but unknown bookingId resolves to ERR_BOOKING_NOT_FOUND (404) and not to a generic 400, proving path-parameter existence is checked at priority 5 with the entity-specific code."
        test_recipe:
          setup:
            - "Empty database except one LoyaltyProgram, so no AwardBooking exists at all."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles NotFound", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
          trigger:
            - call: "GET /award-bookings/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "the trigger returns HTTP 404 with data.error_id == ERR_BOOKING_NOT_FOUND"
            - "the error body carries meta, response_type == \"error\" and data.message"
            - "GET /award-bookings?program_id is not a declared filter; GET /award-bookings returns total_count 0"

      - name: promotion_campaign_create_missing_stacking_mode_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /promotion-campaigns]
          - entities.PromotionCampaign.fields.stacking_mode
          - errors.ERR_INVALID_REQUEST
          - validations[priority=7]
        distinguishing_aspect: "stacking_mode has no default and is not marked optional in §1.5's input list, so omitting it is ERR_INVALID_REQUEST (400) even though every other required field is present and the window is valid."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "Logical clock at its 2026-08-01T00:00:00Z default, so the window below is in the future."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Required", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
          trigger:
            - call: "POST /promotion-campaigns"
              payload: { program_id: "${prog_id}", code: "NO-STACKING", earn_channel: "FLIGHT", multiplier_bps: 15000, window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "the trigger returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /promotion-campaigns?program_id=${prog_id} returns total_count 0"

      - name: loyalty_program_create_applies_every_declared_default
        claim_type: defaults
        grounds:
          - entities.LoyaltyProgram.fields.currency_code
          - entities.LoyaltyProgram.fields.current_period
          - entities.LoyaltyProgram.fields.breakage_policy_mode
          - entities.LoyaltyProgram.fields.saver_share_default_bps
          - endpoints[POST /loyalty-programs]
        distinguishing_aspect: "A program created with nothing but `name` must materialize five defaults at once - USD, 2026-08, HISTORICAL_ATTRITION, 3000 bps and revenue_recognition_state OPEN - with all four ledger counters at 0 and version 1."
        test_recipe:
          setup:
            - "Empty database."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Defaults" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
          assert:
            - "the trigger returns HTTP 201"
            - "LoyaltyProgram.${prog_id}.currency_code == \"USD\""
            - "LoyaltyProgram.${prog_id}.current_period == \"2026-08\""
            - "LoyaltyProgram.${prog_id}.breakage_policy_mode == HISTORICAL_ATTRITION"
            - "LoyaltyProgram.${prog_id}.saver_share_default_bps == 3000"
            - "LoyaltyProgram.${prog_id}.revenue_recognition_state == OPEN"
            - "LoyaltyProgram.${prog_id}.outstanding_miles == 0"
            - "LoyaltyProgram.${prog_id}.deferred_revenue_cents == 0"
            - "LoyaltyProgram.${prog_id}.last_breakage_rate_bps == 0"
            - "LoyaltyProgram.${prog_id}.lifetime_breakage_income_cents == 0"
            - "LoyaltyProgram.${prog_id}.version == 1"

      - name: award_window_load_factor_and_demand_multiplier_computed_from_seat_movement
        claim_type: computed_fields
        grounds:
          - entities.AwardInventoryWindow.fields.load_factor_bps
          - entities.AwardInventoryWindow.fields.demand_multiplier_bps
          - entities.AwardInventoryWindow.fields.seats_held
          - calculations.award_dynamic_pricing
        distinguishing_aspect: "load_factor_bps, seats_held and demand_multiplier_bps are computed, not supplied: one 4-seat hold on a 10-seat window drives them to 4000 / 4 / 9000 while the booking itself is still priced off the PRE-booking load factor of 0."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "One MemberAccount at elite_tier BASE with no ledger rows."
            - "One empty AwardInventoryWindow JFK-CDG ECONOMY 2026-09-01..2026-09-30 with authorized_seats 10."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Computed", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /member-accounts"
              payload: { program_id: "${prog_id}", external_member_ref: "MBR-COMP", home_region: "AMER" }
              as: ProgramAdmin
              captures: { mem_id: "$.data.id" }
            - call: "POST /award-inventory-windows"
              payload: { program_id: "${prog_id}", route_code: "JFK-CDG", cabin: "ECONOMY", window_start_date: "2026-09-01", window_end_date: "2026-09-30", authorized_seats: 10 }
              as: ProgramAdmin
              captures: { win_id: "$.data.id", win_v: "$.data.version" }
          trigger:
            - call: "POST /award-bookings"
              payload: { member_id: "${mem_id}", window_id: "${win_id}", travel_date: "2026-09-20", seats: 4, fare_class: "FLEX", expected_window_version: "${win_v}" }
              as: ProgramAdmin
              captures: { bk_id: "$.data.id" }
          assert:
            - "AwardBooking.${bk_id}.chart_miles_per_seat == 25000"
            - "AwardBooking.${bk_id}.demand_multiplier_bps_applied == 9000"
            - "AwardBooking.${bk_id}.partner_uplift_bps_applied == 10000"
            - "AwardBooking.${bk_id}.quoted_miles == 90000"
            - "AwardBooking.${bk_id}.surcharge_band == SURCHARGE_LOW"
            - "AwardBooking.${bk_id}.cash_surcharge_cents == 2240"
            - "AwardBooking.${bk_id}.partner_settlement_cents == 0"
            - "AwardInventoryWindow.${win_id}.seats_held == 4"
            - "AwardInventoryWindow.${win_id}.seats_confirmed == 0"
            - "AwardInventoryWindow.${win_id}.load_factor_bps == 4000"
            - "AwardInventoryWindow.${win_id}.demand_multiplier_bps == 9000"
            - "AwardInventoryWindow.${win_id}.capacity_control_state == OPEN"

      - name: mile_transaction_system_fields_stamp_period_and_tier_snapshot
        claim_type: system_fields
        grounds:
          - entities.MileTransaction.fields.posted_period
          - entities.MileTransaction.fields.elite_tier_at_earn
          - state_machines.MemberAccount.status_match_state_NONE_to_TRIAL
          - calculations.earning_credit_with_multipliers
        distinguishing_aspect: "posted_period and elite_tier_at_earn are stamped by the server from the program's current_period and the member's tier AT INSERT TIME: an earn booked after a GOLD status match records GOLD and 2026-08 and a 500-mile tier bonus, none of which appear in the request."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "One MemberAccount raised to elite_tier GOLD by a 90-day status match, security_state NORMAL."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles System", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /member-accounts"
              payload: { program_id: "${prog_id}", external_member_ref: "MBR-SYS", home_region: "AMER" }
              as: ProgramAdmin
              captures: { mem_id: "$.data.id" }
            - call: "POST /member-accounts/${mem_id}/status-match"
              payload: { matched_tier: "GOLD", trial_days: 90 }
              as: ProgramAdmin
          trigger:
            - call: "POST /mile-transactions"
              payload: { member_id: "${mem_id}", txn_type: "FLIGHT_EARN", activity_date: "2026-08-01", base_miles: 1000, segments: 2 }
              as: RevenueAccountant
              captures: { txn_id: "$.data.id" }
          assert:
            - "MileTransaction.${txn_id}.elite_tier_at_earn == GOLD"
            - "MileTransaction.${txn_id}.posted_period == \"2026-08\""
            - "MileTransaction.${txn_id}.tier_bonus_miles == 500"
            - "MileTransaction.${txn_id}.promo_multiplier_bps == 10000"
            - "MileTransaction.${txn_id}.stacking_mode_applied == null"
            - "MileTransaction.${txn_id}.bonus_miles == 0"
            - "MileTransaction.${txn_id}.total_miles == 1500"
            - "MileTransaction.${txn_id}.qualifying_miles_credited == 1000"
            - "MemberAccount.${mem_id}.mile_balance == 1500"
            - "MemberAccount.${mem_id}.qualifying_miles_ytd == 1000"
            - "MemberAccount.${mem_id}.qualifying_segments_ytd == 2"

      - name: promotion_multiplier_above_maximum_is_rejected_as_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.PromotionCampaign.fields.multiplier_bps
          - validations[priority=7]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "multiplier_bps declares the closed range 10000..50000, so 50001 is ERR_INVALID_REQUEST (400) while exactly 50000 is accepted - the upper bound is inclusive."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Bounds", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
          trigger:
            - call: "POST /promotion-campaigns"
              payload: { program_id: "${prog_id}", code: "OVER-MAX", earn_channel: "FLIGHT", multiplier_bps: 50001, stacking_mode: "ADDITIVE", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
            - call: "POST /promotion-campaigns"
              payload: { program_id: "${prog_id}", code: "AT-MAX", earn_channel: "FLIGHT", multiplier_bps: 50000, stacking_mode: "ADDITIVE", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { camp_id: "$.data.id" }
          assert:
            - "the first trigger returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "the second trigger returns HTTP 201"
            - "PromotionCampaign.${camp_id}.multiplier_bps == 50000"
            - "PromotionCampaign.${camp_id}.status == SCHEDULED"
            - "PromotionCampaign.${camp_id}.accrued_bonus_miles == 0"
            - "PromotionCampaign.${camp_id}.bonus_cap_miles == null"
            - "GET /promotion-campaigns?program_id=${prog_id} returns total_count 1"

      - name: deferred_revenue_posting_is_immutable_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.DeferredRevenuePosting
          - endpoints[GET /deferred-revenue-postings/{postingId}]
          - state_machines.LoyaltyProgram.OPEN_to_CLOSING
        distinguishing_aspect: "DeferredRevenuePosting declares common_fields: false, so its read carries id and created_at but NO version and NO updated_at, and §1.5 exposes no PATCH/PUT/DELETE for it - the posting can only be superseded by the next period's row."
        test_recipe:
          setup:
            - "One LoyaltyProgram driven to CLOSING with current_period 2026-08 and no member activity, so every trailing bucket is 0."
            - "One DeferredRevenuePosting for 2026-08 written under HISTORICAL_ATTRITION with breakage_rate_bps 0."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Immutable", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /loyalty-programs/${prog_id}/recognition-transitions"
              payload: { target_state: "CLOSING" }
              as: RevenueAccountant
              captures: { prog_v: "$.data.version" }
            - call: "POST /deferred-revenue-postings"
              payload: { program_id: "${prog_id}", period: "2026-08", expected_program_version: "${prog_v}" }
              as: RevenueAccountant
              captures: { post_id: "$.data.id" }
          trigger:
            - call: "GET /deferred-revenue-postings/${post_id}"
              payload: {}
              as: RevenueAccountant
          assert:
            - "the trigger returns HTTP 200"
            - "the response data carries id and created_at and carries NEITHER version NOR updated_at"
            - "DeferredRevenuePosting.${post_id}.method_applied == HISTORICAL_ATTRITION"
            - "DeferredRevenuePosting.${post_id}.breakage_rate_bps == 0"
            - "DeferredRevenuePosting.${post_id}.expired_miles_trailing == 0"
            - "DeferredRevenuePosting.${post_id}.redeemed_miles_trailing == 0"
            - "DeferredRevenuePosting.${post_id}.issued_miles_trailing == 0"
            - "DeferredRevenuePosting.${post_id}.deferred_balance_before_cents == 0"
            - "DeferredRevenuePosting.${post_id}.breakage_income_cents == 0"
            - "DeferredRevenuePosting.${post_id}.deferred_balance_after_cents == 0"
            - "§1.5 declares no PATCH, PUT or DELETE on /deferred-revenue-postings/{postingId}"

      - name: agreement_create_with_unknown_issuer_returns_issuer_not_found
        claim_type: parent_relationships
        grounds:
          - entities.MileSaleAgreement.fields.issuer_id
          - validations[priority=6]
          - errors.ERR_ISSUER_NOT_FOUND
        distinguishing_aspect: "The body FK issuer_id is resolved at priority 6, BEFORE the priority-7 schema check and the priority-17 term check, so an unknown issuer with a deliberately too-short 10-day term still answers ERR_ISSUER_NOT_FOUND (404) rather than ERR_INVALID_TERM."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN; no CoBrandIssuer rows at all."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles FK", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
          trigger:
            - call: "POST /mile-sale-agreements"
              payload:
                issuer_id: "99999999-8888-7777-6666-555555555555"
                term_start_date: "2026-09-01"
                term_end_date: "2026-09-11"
                committed_volume_miles: 1000000
                tier_schedule:
                  - { threshold_miles: 0, price_per_mile_centicents: 160 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "the trigger returns HTTP 404 with data.error_id == ERR_ISSUER_NOT_FOUND"
            - "the trigger does NOT return ERR_INVALID_TERM and does NOT return HTTP 422"
            - "GET /mile-sale-agreements returns total_count 0"

      - name: cross_program_booking_reference_is_rejected
        claim_type: flat
        grounds:
          - complexity_profile.entity_topology
          - validations[priority=27]
          - errors.ERR_CROSS_PROGRAM_REFERENCE
          - entities.AwardBooking.fields.window_id
        distinguishing_aspect: "In a flat topology nothing in the URL couples a member to a window, so the only guard against booking program A's member into program B's inventory is the priority-27 integrity rule: both FKs resolve, the version is current and the travel date is inside the window, yet the request is ERR_CROSS_PROGRAM_REFERENCE (422)."
        test_recipe:
          setup:
            - "Two LoyaltyProgram rows, P1 and P2, both OPEN."
            - "One MemberAccount under P1 with no ledger rows."
            - "One empty AwardInventoryWindow under P2, JFK-NRT BUSINESS 2026-09-01..2026-09-30, authorized_seats 10."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles P1", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { p1_id: "$.data.id" }
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles P2", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { p2_id: "$.data.id" }
            - call: "POST /member-accounts"
              payload: { program_id: "${p1_id}", external_member_ref: "MBR-P1", home_region: "AMER" }
              as: ProgramAdmin
              captures: { mem_id: "$.data.id" }
            - call: "POST /award-inventory-windows"
              payload: { program_id: "${p2_id}", route_code: "JFK-NRT", cabin: "BUSINESS", window_start_date: "2026-09-01", window_end_date: "2026-09-30", authorized_seats: 10 }
              as: ProgramAdmin
              captures: { win_id: "$.data.id", win_v: "$.data.version" }
          trigger:
            - call: "POST /award-bookings"
              payload: { member_id: "${mem_id}", window_id: "${win_id}", travel_date: "2026-09-15", seats: 1, fare_class: "FLEX", expected_window_version: "${win_v}" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "the trigger returns HTTP 422 with data.error_id == ERR_CROSS_PROGRAM_REFERENCE"
            - "AwardInventoryWindow.${win_id}.seats_held == 0"
            - "AwardInventoryWindow.${win_id}.version == ${win_v}"
            - "GET /award-bookings?member_id=${mem_id} returns total_count 0"

  # ===================================================================
  - section: state_machines
    instances:

      - name: promotion_campaign_starts_scheduled_and_is_unusable_before_epoch_launch
        claim_type: initial_state
        grounds:
          - state_machines.PromotionCampaign
          - entities.PromotionCampaign.fields.status
          - errors.ERR_INVALID_STATE
          - endpoints[POST /_ops/run-epoch]
        distinguishing_aspect: "A campaign whose window_start equals the clock's current instant is still born SCHEDULED - creation never launches it - so an earn referencing it before run-epoch fails with ERR_INVALID_STATE (409) and the same earn succeeds afterwards."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "One MemberAccount at elite_tier BASE with no ledger rows."
            - "One FLIGHT PromotionCampaign, multiplier_bps 15000, ADDITIVE, window [2026-08-01T00:00:00Z, 2026-12-01T00:00:00Z), created but NOT yet launched."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Initial", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /member-accounts"
              payload: { program_id: "${prog_id}", external_member_ref: "MBR-INIT", home_region: "AMER" }
              as: ProgramAdmin
              captures: { mem_id: "$.data.id" }
            - call: "POST /promotion-campaigns"
              payload: { program_id: "${prog_id}", code: "AUG-FLIGHT", earn_channel: "FLIGHT", multiplier_bps: 15000, stacking_mode: "ADDITIVE", window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { camp_id: "$.data.id", camp_status: "$.data.status" }
          trigger:
            - call: "POST /mile-transactions"
              payload: { member_id: "${mem_id}", txn_type: "FLIGHT_EARN", activity_date: "2026-08-01", base_miles: 1000, segments: 1, promotion_id: "${camp_id}" }
              as: RevenueAccountant
              captures: { err: "$.data.error_id" }
            - call: "POST /_ops/run-epoch"
              payload: { program_id: "${prog_id}" }
              as: ProgramAdmin
              captures: { launched: "$.data.campaigns_launched" }
            - call: "POST /mile-transactions"
              payload: { member_id: "${mem_id}", txn_type: "FLIGHT_EARN", activity_date: "2026-08-01", base_miles: 1000, segments: 1, promotion_id: "${camp_id}" }
              as: RevenueAccountant
              captures: { txn_id: "$.data.id" }
          assert:
            - "PromotionCampaign.${camp_id}.status was SCHEDULED immediately after creation"
            - "the first trigger returns HTTP 409 with data.error_id == ERR_INVALID_STATE"
            - "the run-epoch response reports campaigns_launched == 1"
            - "PromotionCampaign.${camp_id}.status == LIVE"
            - "the third trigger returns HTTP 201"
            - "MileTransaction.${txn_id}.bonus_miles == 500"
            - "MileTransaction.${txn_id}.total_miles == 1500"
            - "MemberAccount.${mem_id}.mile_balance == 1500"
            - "PromotionCampaign.${camp_id}.accrued_bonus_miles == 500"

      - name: campaign_cancel_from_live_keeps_already_accrued_bonus_miles
        claim_type: valid_transition
        grounds:
          - state_machines.PromotionCampaign.LIVE_to_CANCELLED
          - endpoints[POST /promotion-campaigns/{campaignId}/cancel]
          - entities.PromotionCampaign.fields.cancellation_reason
        distinguishing_aspect: "Cancelling a LIVE campaign stamps cancellation_reason and status CANCELLED but explicitly does NOT claw back the 500 bonus miles already accrued, so accrued_bonus_miles and the member's balance are unchanged by the transition."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "One MemberAccount at elite_tier BASE."
            - "One FLIGHT PromotionCampaign at multiplier_bps 15000 / ADDITIVE, made LIVE by run-epoch, already carrying one 1000-mile flight earn so accrued_bonus_miles is 500."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Cancel", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /member-accounts"
              payload: { program_id: "${prog_id}", external_member_ref: "MBR-CANCEL", home_region: "AMER" }
              as: ProgramAdmin
              captures: { mem_id: "$.data.id" }
            - call: "POST /promotion-campaigns"
              payload: { program_id: "${prog_id}", code: "AUG-LIVE", earn_channel: "FLIGHT", multiplier_bps: 15000, stacking_mode: "ADDITIVE", window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { camp_id: "$.data.id" }
            - call: "POST /_ops/run-epoch"
              payload: { program_id: "${prog_id}" }
              as: ProgramAdmin
            - call: "POST /mile-transactions"
              payload: { member_id: "${mem_id}", txn_type: "FLIGHT_EARN", activity_date: "2026-08-01", base_miles: 1000, segments: 1, promotion_id: "${camp_id}" }
              as: RevenueAccountant
          trigger:
            - call: "POST /promotion-campaigns/${camp_id}/cancel"
              payload: { reason: "Issuer funding withdrawn" }
              as: ProgramAdmin
          assert:
            - "the trigger returns HTTP 200"
            - "PromotionCampaign.${camp_id}.status == CANCELLED"
            - "PromotionCampaign.${camp_id}.cancellation_reason == \"Issuer funding withdrawn\""
            - "PromotionCampaign.${camp_id}.accrued_bonus_miles == 500"
            - "MemberAccount.${mem_id}.mile_balance == 1500"
            - "LoyaltyProgram.${prog_id}.outstanding_miles == 1500"

      - name: ticket_a_cancelled_booking_returns_invalid_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.AwardBooking.HELD_to_CANCELLED
          - state_machines.AwardBooking.HELD_to_TICKETED
          - errors.ERR_INVALID_STATE
          - validations[priority=8]
        distinguishing_aspect: "CANCELLED is terminal, so ticket is not a declared transition from it: the member keeps every mile, the window keeps zero held seats, and the answer is ERR_INVALID_STATE (409) rather than a silent re-hold."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "One MemberAccount at elite_tier BASE with mile_balance 100000 from a single 10000000-cent card-spend earn dated 2026-07-02."
            - "One empty AwardInventoryWindow JFK-CDG ECONOMY 2026-09-01..2026-09-30, authorized_seats 10."
            - "One AwardBooking for 1 FLEX seat that has already been cancelled."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Invalid", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /member-accounts"
              payload: { program_id: "${prog_id}", external_member_ref: "MBR-INVALID", home_region: "AMER" }
              as: ProgramAdmin
              captures: { mem_id: "$.data.id" }
            - call: "POST /mile-transactions"
              payload: { member_id: "${mem_id}", txn_type: "CARD_SPEND_EARN", activity_date: "2026-07-02", qualifying_spend_cents: 10000000 }
              as: RevenueAccountant
            - call: "POST /award-inventory-windows"
              payload: { program_id: "${prog_id}", route_code: "JFK-CDG", cabin: "ECONOMY", window_start_date: "2026-09-01", window_end_date: "2026-09-30", authorized_seats: 10 }
              as: ProgramAdmin
              captures: { win_id: "$.data.id", win_v: "$.data.version" }
            - call: "POST /award-bookings"
              payload: { member_id: "${mem_id}", window_id: "${win_id}", travel_date: "2026-09-15", seats: 1, fare_class: "FLEX", expected_window_version: "${win_v}" }
              as: ProgramAdmin
              captures: { bk_id: "$.data.id" }
            - call: "POST /award-bookings/${bk_id}/cancel"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /award-bookings/${bk_id}/ticket"
              payload: {}
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "the trigger returns HTTP 409 with data.error_id == ERR_INVALID_STATE"
            - "AwardBooking.${bk_id}.status == CANCELLED"
            - "MemberAccount.${mem_id}.mile_balance == 100000"
            - "AwardInventoryWindow.${win_id}.seats_held == 0"
            - "AwardInventoryWindow.${win_id}.seats_confirmed == 0"
            - "AwardInventoryWindow.${win_id}.capacity_control_state == OPEN"
            - "GET /mile-transactions?member_id=${mem_id} returns total_count 1"

      - name: second_investigate_on_an_investigating_case_returns_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.FraudCase.OPEN_to_INVESTIGATING
          - endpoints[POST /fraud-cases/{caseId}/investigate]
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Re-issuing the identical investigate trigger is an error, not a no-op: the second call answers ERR_INVALID_STATE (409) and the case's version does not advance a second time."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "One MemberAccount at security_state NORMAL."
            - "One FraudCase with all four signals at 0, so detection_score is 0 and the member is left NORMAL."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Idem", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /member-accounts"
              payload: { program_id: "${prog_id}", external_member_ref: "MBR-IDEM", home_region: "APAC" }
              as: ProgramAdmin
              captures: { mem_id: "$.data.id" }
            - call: "POST /fraud-cases"
              payload: { member_id: "${mem_id}", case_type: "VELOCITY_ANOMALY", login_geo_velocity: 0, redemption_velocity_24h: 0, brokering_pattern_hits: 0, dormancy_days: 0 }
              as: FraudAnalyst
              as_user_id: "fa-1"
              captures: { case_id: "$.data.id", score: "$.data.detection_score" }
          trigger:
            - call: "POST /fraud-cases/${case_id}/investigate"
              payload: {}
              as: FraudAnalyst
              as_user_id: "fa-1"
            - call: "POST /fraud-cases/${case_id}/investigate"
              payload: {}
              as: FraudAnalyst
              as_user_id: "fa-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "FraudCase.${case_id}.detection_score == 0"
            - "the first trigger returns HTTP 200 and FraudCase.${case_id}.status == INVESTIGATING"
            - "the second trigger returns HTTP 409 with data.error_id == ERR_INVALID_STATE"
            - "FraudCase.${case_id}.version == 2"
            - "FraudCase.${case_id}.freeze_applied == false"
            - "MemberAccount.${mem_id}.security_state == NORMAL"
            - "MemberAccount.${mem_id}.risk_score == 0"

      - name: settle_a_reversed_order_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.MilePurchaseOrder.fulfillment_status_ISSUED_to_REVERSED
          - endpoints[POST /mile-purchase-orders/{orderId}/settle]
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Reversal drives settlement_status to WRITTEN_OFF, which admits no further settlement trigger, and it must also have unwound all three ledgers - drawn_miles, prepayment_balance_miles and deferred_revenue_cents back to 0 - before the settle attempt fails with ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08, and one CoBrandIssuer with annual_mile_purchase_cap_miles 5000000."
            - "One ACTIVE MileSaleAgreement, committed_volume_miles 1000000, tier_schedule [{0,200}], negotiated by pm-1 and ratified by co-1."
            - "One 100000-mile MilePurchaseOrder that was issued (gross_amount_cents 200000) and then reversed."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Terminal", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /co-brand-issuers"
              payload: { program_id: "${prog_id}", name: "Northbank Card Services", annual_mile_purchase_cap_miles: 5000000 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { issuer_id: "$.data.id" }
            - call: "POST /mile-sale-agreements"
              payload:
                issuer_id: "${issuer_id}"
                term_start_date: "2026-09-01"
                term_end_date: "2027-08-31"
                committed_volume_miles: 1000000
                tier_schedule:
                  - { threshold_miles: 0, price_per_mile_centicents: 200 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { agr_id: "$.data.id" }
            - call: "POST /mile-sale-agreements/${agr_id}/submit"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-1"
            - call: "POST /mile-sale-agreements/${agr_id}/ratify"
              payload: {}
              as: ContractsOfficer
              as_user_id: "co-1"
            - call: "POST /mile-sale-agreements/${agr_id}/activate"
              payload: {}
              as: ContractsOfficer
              as_user_id: "co-1"
              captures: { agr_v: "$.data.version" }
            - call: "POST /mile-purchase-orders"
              payload: { agreement_id: "${agr_id}", order_miles: 100000, expected_agreement_version: "${agr_v}" }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { order_id: "$.data.id" }
            - call: "POST /mile-purchase-orders/${order_id}/issue"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-1"
            - call: "POST /mile-purchase-orders/${order_id}/reverse"
              payload: { reason: "Issuer cancelled the tranche" }
              as: PartnerManager
              as_user_id: "pm-1"
          trigger:
            - call: "POST /mile-purchase-orders/${order_id}/settle"
              payload: {}
              as: RevenueAccountant
              captures: { err: "$.data.error_id" }
          assert:
            - "the trigger returns HTTP 409 with data.error_id == ERR_INVALID_STATE"
            - "MilePurchaseOrder.${order_id}.fulfillment_status == REVERSED"
            - "MilePurchaseOrder.${order_id}.settlement_status == WRITTEN_OFF"
            - "MilePurchaseOrder.${order_id}.gross_amount_cents == 200000"
            - "MilePurchaseOrder.${order_id}.reversal_reason == \"Issuer cancelled the tranche\""
            - "MileSaleAgreement.${agr_id}.drawn_miles == 0"
            - "MileSaleAgreement.${agr_id}.prepayment_balance_miles == 0"
            - "LoyaltyProgram.${prog_id}.deferred_revenue_cents == 0"

      - name: lock_period_without_a_posting_returns_invalid_state
        claim_type: precondition_enforcement
        grounds:
          - state_machines.LoyaltyProgram.CLOSING_to_LOCKED
          - endpoints[POST /loyalty-programs/{programId}/recognition-transitions]
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "CLOSING -> LOCKED carries a second precondition beyond the source state: a DeferredRevenuePosting must exist for (program_id, current_period). With none written, the transition fails with ERR_INVALID_STATE (409) and the program stays CLOSING with current_period untouched."
        test_recipe:
          setup:
            - "One LoyaltyProgram driven to CLOSING with current_period 2026-08 and no DeferredRevenuePosting for that period."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Precondition", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /loyalty-programs/${prog_id}/recognition-transitions"
              payload: { target_state: "CLOSING" }
              as: RevenueAccountant
          trigger:
            - call: "POST /loyalty-programs/${prog_id}/recognition-transitions"
              payload: { target_state: "LOCKED" }
              as: RevenueAccountant
              captures: { err: "$.data.error_id" }
          assert:
            - "the trigger returns HTTP 409 with data.error_id == ERR_INVALID_STATE"
            - "LoyaltyProgram.${prog_id}.revenue_recognition_state == CLOSING"
            - "LoyaltyProgram.${prog_id}.current_period == \"2026-08\""
            - "LoyaltyProgram.${prog_id}.version == 2"
            - "GET /deferred-revenue-postings?program_id=${prog_id} returns total_count 0"

      - name: order_issue_executes_all_three_declared_side_effects
        claim_type: side_effect_execution
        grounds:
          - state_machines.MilePurchaseOrder.fulfillment_status_PENDING_to_ISSUED
          - endpoints[POST /mile-purchase-orders/{orderId}/issue]
          - entities.MileSaleAgreement.fields.drawn_miles
          - entities.MileSaleAgreement.fields.prepayment_balance_miles
          - entities.LoyaltyProgram.fields.deferred_revenue_cents
        distinguishing_aspect: "One issue call must land all three declared side effects at once - drawn_miles 200000, prepayment_balance_miles 200000 and deferred_revenue_cents 300000 - and bump BOTH the order's and the agreement's version, while the order's cash fields stay untouched until invoicing."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08, and one CoBrandIssuer with annual_mile_purchase_cap_miles 5000000."
            - "One ACTIVE MileSaleAgreement, committed_volume_miles 1000000, tier_schedule [{0,150}]."
            - "One PENDING 200000-mile MilePurchaseOrder priced at gross_amount_cents 300000."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles SideEffects", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /co-brand-issuers"
              payload: { program_id: "${prog_id}", name: "Northbank Card Services", annual_mile_purchase_cap_miles: 5000000 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { issuer_id: "$.data.id" }
            - call: "POST /mile-sale-agreements"
              payload:
                issuer_id: "${issuer_id}"
                term_start_date: "2026-09-01"
                term_end_date: "2027-08-31"
                committed_volume_miles: 1000000
                tier_schedule:
                  - { threshold_miles: 0, price_per_mile_centicents: 150 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { agr_id: "$.data.id" }
            - call: "POST /mile-sale-agreements/${agr_id}/submit"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-1"
            - call: "POST /mile-sale-agreements/${agr_id}/ratify"
              payload: {}
              as: ContractsOfficer
              as_user_id: "co-1"
            - call: "POST /mile-sale-agreements/${agr_id}/activate"
              payload: {}
              as: ContractsOfficer
              as_user_id: "co-1"
              captures: { agr_v: "$.data.version" }
            - call: "POST /mile-purchase-orders"
              payload: { agreement_id: "${agr_id}", order_miles: 200000, expected_agreement_version: "${agr_v}" }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { order_id: "$.data.id", order_v: "$.data.version" }
          trigger:
            - call: "POST /mile-purchase-orders/${order_id}/issue"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-1"
          assert:
            - "the trigger returns HTTP 200"
            - "MilePurchaseOrder.${order_id}.fulfillment_status == ISSUED"
            - "MilePurchaseOrder.${order_id}.settlement_status == PENDING"
            - "MilePurchaseOrder.${order_id}.drawn_miles_before == 0"
            - "MilePurchaseOrder.${order_id}.provisional_tier_price_centicents == 150"
            - "MilePurchaseOrder.${order_id}.gross_amount_cents == 300000"
            - "MilePurchaseOrder.${order_id}.final_amount_cents == null"
            - "MilePurchaseOrder.${order_id}.net_amount_cents == null"
            - "MilePurchaseOrder.${order_id}.volume_true_up_cents == 0"
            - "MilePurchaseOrder.${order_id}.posted_period == null"
            - "MileSaleAgreement.${agr_id}.drawn_miles == 200000"
            - "MileSaleAgreement.${agr_id}.prepayment_balance_miles == 200000"
            - "LoyaltyProgram.${prog_id}.deferred_revenue_cents == 300000"

      - name: recognition_cycle_advances_current_period_on_unlock
        claim_type: cyclic
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.LoyaltyProgram.LOCKED_to_OPEN
          - entities.LoyaltyProgram.fields.current_period
        distinguishing_aspect: "One full lap OPEN -> CLOSING -> LOCKED -> OPEN returns the program to its starting state but NOT to its starting data: current_period has advanced to 2026-09 and version has reached 5 (one bump for each of the three transitions plus the posting)."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08, version 1, no member activity."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Cycle", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /loyalty-programs/${prog_id}/recognition-transitions"
              payload: { target_state: "CLOSING" }
              as: RevenueAccountant
              captures: { prog_v_closing: "$.data.version" }
            - call: "POST /deferred-revenue-postings"
              payload: { program_id: "${prog_id}", period: "2026-08", expected_program_version: "${prog_v_closing}" }
              as: RevenueAccountant
              captures: { post_id: "$.data.id" }
            - call: "POST /loyalty-programs/${prog_id}/recognition-transitions"
              payload: { target_state: "LOCKED" }
              as: RevenueAccountant
          trigger:
            - call: "POST /loyalty-programs/${prog_id}/recognition-transitions"
              payload: { target_state: "OPEN" }
              as: RevenueAccountant
          assert:
            - "the trigger returns HTTP 200"
            - "LoyaltyProgram.${prog_id}.revenue_recognition_state == OPEN"
            - "LoyaltyProgram.${prog_id}.current_period == \"2026-09\""
            - "LoyaltyProgram.${prog_id}.version == 5"
            - "DeferredRevenuePosting.${post_id}.period == \"2026-08\""
            - "a second POST /deferred-revenue-postings for period 2026-08 is now impossible without first returning to CLOSING"

      - name: order_fulfillment_and_settlement_dimensions_move_independently
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.MilePurchaseOrder
        excluded_because:
          difficulty_instance: non_linear_state_machine / mile_purchase_order_parallel_fulfillment_and_settlement_dimensions
          rationale: "That §1.8 instance already drives fulfillment_status and settlement_status along separate axes and asserts the combined (ISSUED, SETTLED) state plus the invoice-before-issue rejection."

      - name: order_creation_guarded_by_parent_agreement_state
        claim_type: guarded_transitions
        grounds:
          - state_machines.MileSaleAgreement.RATIFIED_to_ACTIVE
          - validations[priority=8]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / mile_purchase_order_requires_agreement_active_not_merely_ratified
          rationale: "That §1.8 instance is exactly the cross-entity guarded-transition probe: a RATIFIED-but-not-ACTIVE parent rejects the child create with ERR_INVALID_STATE."

      - name: notice_rollback_cascades_only_into_scheduled_card_spend_campaigns
        claim_type: cascade_down
        grounds:
          - state_machines.ProgramChangeNotice.ANNOUNCED_to_ROLLED_BACK
          - endpoints[POST /program-change-notices/{noticeId}/rollback]
          - state_machines.PromotionCampaign.SCHEDULED_to_CANCELLED
          - calculations.member_reaction_index
        distinguishing_aspect: "The rollback cascade is channel-scoped and status-scoped at once: both SCHEDULED CARD_SPEND campaigns are cancelled while the SCHEDULED FLIGHT campaign is untouched, so a blanket cascade over all children would be caught."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08, with no members, so exposed_member_count is 0."
            - "Two SCHEDULED CARD_SPEND campaigns on adjacent windows (September and October) and one SCHEDULED FLIGHT campaign on the September window."
            - "One EARN_STRUCTURE ProgramChangeNotice effective 2027-03-01, announced with member_reaction_index 40 and notice_days 212."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Cascade Down", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id", prog_v: "$.data.version" }
            - call: "POST /promotion-campaigns"
              payload: { program_id: "${prog_id}", code: "CARD-SEP", earn_channel: "CARD_SPEND", multiplier_bps: 15000, stacking_mode: "ADDITIVE", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { card1_id: "$.data.id" }
            - call: "POST /promotion-campaigns"
              payload: { program_id: "${prog_id}", code: "CARD-OCT", earn_channel: "CARD_SPEND", multiplier_bps: 15000, stacking_mode: "ADDITIVE", window_start: "2026-10-01T00:00:00Z", window_end: "2026-11-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { card2_id: "$.data.id" }
            - call: "POST /promotion-campaigns"
              payload: { program_id: "${prog_id}", code: "FLIGHT-SEP", earn_channel: "FLIGHT", multiplier_bps: 15000, stacking_mode: "ADDITIVE", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { flight_id: "$.data.id" }
            - call: "POST /program-change-notices"
              payload: { program_id: "${prog_id}", change_type: "EARN_STRUCTURE", effective_at: "2027-03-01T00:00:00Z", expected_program_version: "${prog_v}" }
              as: ProgramAdmin
              captures: { notice_id: "$.data.id" }
            - call: "POST /program-change-notices/${notice_id}/announce"
              payload: {}
              as: ProgramAdmin
              captures: { reaction: "$.data.member_reaction_index" }
          trigger:
            - call: "POST /program-change-notices/${notice_id}/rollback"
              payload: { reason: "Member advocacy escalation" }
              as: ProgramAdmin
          assert:
            - "ProgramChangeNotice.${notice_id}.notice_days == 212"
            - "ProgramChangeNotice.${notice_id}.exposed_member_count == 0"
            - "ProgramChangeNotice.${notice_id}.member_reaction_index == 40"
            - "ProgramChangeNotice.${notice_id}.status == ROLLED_BACK"
            - "ProgramChangeNotice.${notice_id}.rollback_reason == \"Member advocacy escalation\""
            - "PromotionCampaign.${card1_id}.status == CANCELLED"
            - "PromotionCampaign.${card2_id}.status == CANCELLED"
            - "PromotionCampaign.${flight_id}.status == SCHEDULED"
            - "GET /promotion-campaigns?program_id=${prog_id}&status=CANCELLED returns total_count 2"

      - name: refund_reverses_every_original_side_effect_without_drift
        claim_type: compensation
        grounds:
          - state_machines.AwardBooking.TICKETED_to_REFUNDED
        excluded_because:
          difficulty_instance: compensating_invariant / booking_refund_restores_outstanding_mile_liability
          rationale: "That §1.8 instance asserts the full undo set - REVERSAL row, exact mile restoration, seat release and window posture - for the refund compensation."

      - name: fraud_substantiation_adjusts_four_other_entities
        claim_type: cross_entity
        grounds:
          - state_machines.FraudCase.INVESTIGATING_to_SUBSTANTIATED
        excluded_because:
          difficulty_instance: transitive_cascade / fraud_substantiation_five_hop_cascade
          rationale: "That §1.8 instance verifies the cross-entity fan-out from FraudCase into MemberAccount, MileTransaction, AwardBooking, AwardInventoryWindow and LoyaltyProgram."

      - name: booking_ticket_debits_member_and_program_liability_in_lockstep
        claim_type: ledger_sync
        grounds:
          - state_machines.AwardBooking.HELD_to_TICKETED
          - entities.MemberAccount.fields.mile_balance
          - entities.LoyaltyProgram.fields.outstanding_miles
          - calculations.award_dynamic_pricing
        distinguishing_aspect: "Ticketing must move the member ledger and the program's ancestor liability by the SAME 22500 miles in one request - 100000 to 77500 on both - while converting one held seat into one confirmed seat, so any single-sided write is caught."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08, outstanding_miles 100000."
            - "One MemberAccount at elite_tier BASE with mile_balance 100000 from a single 10000000-cent card-spend earn dated 2026-07-02."
            - "One empty AwardInventoryWindow JFK-CDG ECONOMY 2026-09-01..2026-09-30, authorized_seats 10, holding one 1-seat FLEX hold quoted at 22500 miles."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Lockstep", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /member-accounts"
              payload: { program_id: "${prog_id}", external_member_ref: "MBR-LOCK", home_region: "AMER" }
              as: ProgramAdmin
              captures: { mem_id: "$.data.id" }
            - call: "POST /mile-transactions"
              payload: { member_id: "${mem_id}", txn_type: "CARD_SPEND_EARN", activity_date: "2026-07-02", qualifying_spend_cents: 10000000 }
              as: RevenueAccountant
            - call: "POST /award-inventory-windows"
              payload: { program_id: "${prog_id}", route_code: "JFK-CDG", cabin: "ECONOMY", window_start_date: "2026-09-01", window_end_date: "2026-09-30", authorized_seats: 10 }
              as: ProgramAdmin
              captures: { win_id: "$.data.id", win_v: "$.data.version" }
            - call: "POST /award-bookings"
              payload: { member_id: "${mem_id}", window_id: "${win_id}", travel_date: "2026-09-18", seats: 1, fare_class: "FLEX", expected_window_version: "${win_v}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { bk_id: "$.data.id" }
          trigger:
            - call: "POST /award-bookings/${bk_id}/ticket"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
          assert:
            - "the trigger returns HTTP 200"
            - "AwardBooking.${bk_id}.status == TICKETED"
            - "AwardBooking.${bk_id}.quoted_miles == 22500"
            - "MemberAccount.${mem_id}.mile_balance == 77500"
            - "LoyaltyProgram.${prog_id}.outstanding_miles == 77500"
            - "AwardInventoryWindow.${win_id}.seats_held == 0"
            - "AwardInventoryWindow.${win_id}.seats_confirmed == 1"
            - "AwardInventoryWindow.${win_id}.load_factor_bps == 1000"
            - "GET /mile-transactions?member_id=${mem_id}&txn_type=REDEEM returns total_count 1 with total_miles == -22500"
            - "GET /mile-transactions?member_id=${mem_id}&award_booking_id=${bk_id} returns total_count 1"

      - name: status_match_lapse_by_epoch_reverts_elite_tier_to_base
        claim_type: conditional_cascade
        grounds:
          - state_machines.MemberAccount.status_match_state_TRIAL_to_LAPSED
          - endpoints[POST /_ops/run-epoch]
          - entities.MemberAccount.fields.status_match_expires_at
          - calculations.earning_credit_with_multipliers
        distinguishing_aspect: "The lapse fires only for a member whose status_match_expires_at has passed, and its knock-on is observable in pricing rather than just in state: the post-lapse earn stamps elite_tier_at_earn BASE with tier_bonus_miles 0 where the pre-lapse tier would have paid 500."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "One MemberAccount raised to GOLD by a 30-day status match, so status_match_expires_at is 2026-08-31T00:00:00Z."
            - "Logical clock starts at its 2026-08-01T00:00:00Z default and is advanced to 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Lapse", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /member-accounts"
              payload: { program_id: "${prog_id}", external_member_ref: "MBR-LAPSE", home_region: "EMEA" }
              as: ProgramAdmin
              captures: { mem_id: "$.data.id" }
            - call: "POST /member-accounts/${mem_id}/status-match"
              payload: { matched_tier: "GOLD", trial_days: 30 }
              as: ProgramAdmin
              captures: { expires: "$.data.status_match_expires_at" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /_ops/run-epoch"
              payload: { program_id: "${prog_id}" }
              as: ProgramAdmin
              captures: { lapsed: "$.data.status_matches_lapsed" }
            - call: "POST /mile-transactions"
              payload: { member_id: "${mem_id}", txn_type: "FLIGHT_EARN", activity_date: "2026-09-01", base_miles: 1000, segments: 1 }
              as: RevenueAccountant
              captures: { txn_id: "$.data.id" }
          assert:
            - "MemberAccount.${mem_id}.status_match_expires_at == \"2026-08-31T00:00:00Z\""
            - "the run-epoch response reports status_matches_lapsed == 1"
            - "MemberAccount.${mem_id}.status_match_state == LAPSED"
            - "MemberAccount.${mem_id}.status_match_tier == GOLD"
            - "MemberAccount.${mem_id}.elite_tier == BASE"
            - "MileTransaction.${txn_id}.elite_tier_at_earn == BASE"
            - "MileTransaction.${txn_id}.tier_bonus_miles == 0"
            - "MileTransaction.${txn_id}.total_miles == 1000"
            - "MemberAccount.${mem_id}.mile_balance == 1000"

  # ===================================================================
  - section: calculations
    instances:

      - name: dynamic_passthrough_charges_the_demand_multiplier_twice
        claim_type: correct_result
        grounds:
          - calculations.award_dynamic_pricing
          - calculations.award_dynamic_pricing.constants.PARTNER_UPLIFT_BPS
          - entities.PartnerAirline.fields.award_pricing_mode
        distinguishing_aspect: "On a DYNAMIC_PASSTHROUGH partner the step-4 uplift IS the step-2 demand multiplier, so an empty BUSINESS FLEX window prices at 85000 * 0.9 * 0.9 = 68850 rather than the 76500 a single 9000 bps application would give - and 68850 lands in SURCHARGE_MID while 76500 would have landed in SURCHARGE_HIGH."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "One MemberAccount at elite_tier BASE with mile_balance 0 (a hold does not debit)."
            - "One PartnerAirline NH, settlement_rate_centicents_per_mile 200, reciprocity_mode FULL, award_pricing_mode DYNAMIC_PASSTHROUGH."
            - "One empty AwardInventoryWindow JFK-HND BUSINESS 2026-09-01..2026-09-30, authorized_seats 10."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Passthrough", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /member-accounts"
              payload: { program_id: "${prog_id}", external_member_ref: "MBR-PASS", home_region: "APAC" }
              as: ProgramAdmin
              captures: { mem_id: "$.data.id" }
            - call: "POST /partner-airlines"
              payload: { program_id: "${prog_id}", iata_code: "NH", settlement_rate_centicents_per_mile: 200, reciprocity_mode: "FULL", award_pricing_mode: "DYNAMIC_PASSTHROUGH" }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { air_id: "$.data.id" }
            - call: "POST /award-inventory-windows"
              payload: { program_id: "${prog_id}", route_code: "JFK-HND", cabin: "BUSINESS", window_start_date: "2026-09-01", window_end_date: "2026-09-30", authorized_seats: 10 }
              as: ProgramAdmin
              captures: { win_id: "$.data.id", win_v: "$.data.version" }
          trigger:
            - call: "POST /award-bookings"
              payload: { member_id: "${mem_id}", window_id: "${win_id}", partner_airline_id: "${air_id}", travel_date: "2026-09-12", seats: 1, fare_class: "FLEX", expected_window_version: "${win_v}" }
              as: ProgramAdmin
              captures: { bk_id: "$.data.id" }
          assert:
            - "the trigger returns HTTP 201"
            - "AwardBooking.${bk_id}.chart_miles_per_seat == 85000"
            - "AwardBooking.${bk_id}.demand_multiplier_bps_applied == 9000"
            - "AwardBooking.${bk_id}.partner_uplift_bps_applied == 9000"
            - "AwardBooking.${bk_id}.quoted_miles == 68850"
            - "AwardBooking.${bk_id}.surcharge_band == SURCHARGE_MID"
            - "AwardBooking.${bk_id}.cash_surcharge_cents == 1120"
            - "AwardBooking.${bk_id}.elite_discount_bps_applied == 0"
            - "AwardBooking.${bk_id}.partner_settlement_cents == 137700"
            - "AwardBooking.${bk_id}.status == HELD"

      - name: settlement_run_ignores_held_cancelled_and_future_travel_bookings
        claim_type: input_set_filtering
        grounds:
          - calculations.partner_settlement_run.input_set
          - endpoints[POST /partner-airlines/{airlineId}/settlement-runs]
          - entities.AwardBooking.fields.partner_settled
        distinguishing_aspect: "Four candidate bookings on the same airline differ only in status and travel_date: only the TICKETED one whose travel_date has passed settles, so net_settlement_balance_cents lands on exactly one booking's 22500 cents and settled_booking_count is 1, not 2, 3 or 4."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "One MemberAccount at elite_tier BASE with mile_balance 100000 from a single 10000000-cent card-spend earn dated 2026-07-02."
            - "One PartnerAirline LH, settlement_rate_centicents_per_mile 100, reciprocity_mode FULL, award_pricing_mode FIXED_CHART."
            - "One AwardInventoryWindow JFK-FRA ECONOMY 2026-09-01..2026-09-30, authorized_seats 10, carrying four 1-seat FLEX bookings each quoted 22500 miles: B1 TICKETED travel 2026-09-05, B4 TICKETED travel 2026-09-20, B2 still HELD travel 2026-09-05, B3 CANCELLED travel 2026-09-05."
            - "Logical clock starts at its 2026-08-01T00:00:00Z default and is advanced to 2026-09-06T00:00:00Z before the run."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Filter", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /member-accounts"
              payload: { program_id: "${prog_id}", external_member_ref: "MBR-FILTER", home_region: "EMEA" }
              as: ProgramAdmin
              captures: { mem_id: "$.data.id" }
            - call: "POST /mile-transactions"
              payload: { member_id: "${mem_id}", txn_type: "CARD_SPEND_EARN", activity_date: "2026-07-02", qualifying_spend_cents: 10000000 }
              as: RevenueAccountant
            - call: "POST /partner-airlines"
              payload: { program_id: "${prog_id}", iata_code: "LH", settlement_rate_centicents_per_mile: 100 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { air_id: "$.data.id" }
            - call: "POST /award-inventory-windows"
              payload: { program_id: "${prog_id}", route_code: "JFK-FRA", cabin: "ECONOMY", window_start_date: "2026-09-01", window_end_date: "2026-09-30", authorized_seats: 10 }
              as: ProgramAdmin
              captures: { win_id: "$.data.id", win_v1: "$.data.version" }
            - call: "POST /award-bookings"
              payload: { member_id: "${mem_id}", window_id: "${win_id}", partner_airline_id: "${air_id}", travel_date: "2026-09-05", seats: 1, fare_class: "FLEX", expected_window_version: "${win_v1}" }
              as: ProgramAdmin
              captures: { b1_id: "$.data.id" }
            - call: "POST /award-bookings/${b1_id}/ticket"
              payload: {}
              as: ProgramAdmin
            - call: "GET /award-inventory-windows/${win_id}"
              payload: {}
              as: ProgramAdmin
              captures: { win_v2: "$.data.version" }
            - call: "POST /award-bookings"
              payload: { member_id: "${mem_id}", window_id: "${win_id}", partner_airline_id: "${air_id}", travel_date: "2026-09-20", seats: 1, fare_class: "FLEX", expected_window_version: "${win_v2}" }
              as: ProgramAdmin
              captures: { b4_id: "$.data.id" }
            - call: "POST /award-bookings/${b4_id}/ticket"
              payload: {}
              as: ProgramAdmin
            - call: "GET /award-inventory-windows/${win_id}"
              payload: {}
              as: ProgramAdmin
              captures: { win_v3: "$.data.version" }
            - call: "POST /award-bookings"
              payload: { member_id: "${mem_id}", window_id: "${win_id}", partner_airline_id: "${air_id}", travel_date: "2026-09-05", seats: 1, fare_class: "FLEX", expected_window_version: "${win_v3}" }
              as: ProgramAdmin
              captures: { b2_id: "$.data.id" }
            - call: "GET /award-inventory-windows/${win_id}"
              payload: {}
              as: ProgramAdmin
              captures: { win_v4: "$.data.version" }
            - call: "POST /award-bookings"
              payload: { member_id: "${mem_id}", window_id: "${win_id}", partner_airline_id: "${air_id}", travel_date: "2026-09-05", seats: 1, fare_class: "FLEX", expected_window_version: "${win_v4}" }
              as: ProgramAdmin
              captures: { b3_id: "$.data.id" }
            - call: "POST /award-bookings/${b3_id}/cancel"
              payload: {}
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /partner-airlines/${air_id}/settlement-runs"
              payload: {}
              as: RevenueAccountant
          assert:
            - "each of AwardBooking.${b1_id}, ${b2_id}, ${b3_id} and ${b4_id} has quoted_miles == 22500 and partner_settlement_cents == 22500"
            - "the trigger returns HTTP 200"
            - "PartnerAirline.${air_id}.net_settlement_balance_cents == 22500"
            - "PartnerAirline.${air_id}.settled_booking_count == 1"
            - "PartnerAirline.${air_id}.last_settlement_run_at == \"2026-09-06T00:00:00Z\""
            - "AwardBooking.${b1_id}.partner_settled == true"
            - "AwardBooking.${b2_id}.partner_settled == false and status == HELD"
            - "AwardBooking.${b3_id}.partner_settled == false and status == CANCELLED"
            - "AwardBooking.${b4_id}.partner_settled == false and status == TICKETED"
            - "MemberAccount.${mem_id}.mile_balance == 55000"

      - name: volume_draw_allowed_up_to_exactly_one_hundred_ten_percent_of_commitment
        claim_type: constants_applied
        grounds:
          - calculations.mile_purchase_order_pricing.constants.VOLUME_OVERDRAW_TOLERANCE_BPS
          - errors.ERR_VOLUME_COMMITMENT_EXCEEDED
        distinguishing_aspect: "The tolerance constant is 11000 bps, so a 1000000-mile commitment admits exactly 1100000 drawn miles and rejects the very next mile - pinning both the constant's value and the inclusive comparison, while a hard-coded 100 percent limit would reject the first order outright."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN and one CoBrandIssuer with annual_mile_purchase_cap_miles 5000000."
            - "One ACTIVE MileSaleAgreement, committed_volume_miles 1000000, tier_schedule [{0,200}]."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Tolerance", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /co-brand-issuers"
              payload: { program_id: "${prog_id}", name: "Northbank Card Services", annual_mile_purchase_cap_miles: 5000000 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { issuer_id: "$.data.id" }
            - call: "POST /mile-sale-agreements"
              payload:
                issuer_id: "${issuer_id}"
                term_start_date: "2026-09-01"
                term_end_date: "2027-08-31"
                committed_volume_miles: 1000000
                tier_schedule:
                  - { threshold_miles: 0, price_per_mile_centicents: 200 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { agr_id: "$.data.id" }
            - call: "POST /mile-sale-agreements/${agr_id}/submit"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-1"
            - call: "POST /mile-sale-agreements/${agr_id}/ratify"
              payload: {}
              as: ContractsOfficer
              as_user_id: "co-1"
            - call: "POST /mile-sale-agreements/${agr_id}/activate"
              payload: {}
              as: ContractsOfficer
              as_user_id: "co-1"
              captures: { agr_v1: "$.data.version" }
          trigger:
            - call: "POST /mile-purchase-orders"
              payload: { agreement_id: "${agr_id}", order_miles: 1100000, expected_agreement_version: "${agr_v1}" }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { ok_order: "$.data.id" }
            - call: "POST /mile-purchase-orders/${ok_order}/issue"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-1"
            - call: "GET /mile-sale-agreements/${agr_id}"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { agr_v2: "$.data.version" }
            - call: "POST /mile-purchase-orders"
              payload: { agreement_id: "${agr_id}", order_miles: 1, expected_agreement_version: "${agr_v2}" }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "the first trigger returns HTTP 201"
            - "MilePurchaseOrder.${ok_order}.gross_amount_cents == 2200000"
            - "MileSaleAgreement.${agr_id}.drawn_miles == 1100000"
            - "the fourth trigger returns HTTP 422 with data.error_id == ERR_VOLUME_COMMITMENT_EXCEEDED"
