  - rule_id: transitive_cascade
    instances:
      - name: expired_challenge_sweep_cascades_hold_release_to_booking_license_and_service_order
        grounds:
          - state_machines.SpaceHold.CHALLENGED_to_RELEASED
          - state_machines.EventBooking.TENTATIVE_to_RELEASED
          - state_machines.LicenseAgreement.ISSUED_to_VOIDED
          - state_machines.ServiceOrder.APPROVED_to_CANCELLED
          - endpoints[POST /convention-center/_ops/hold-sweep]
          - calculations.hold_rank_assignment
        distinguishing_aspect: |
          A depth-4 chain fired by one operator sweep: SpaceHold CHALLENGED -> RELEASED (1)
          forces its EventBooking to RELEASED because hold_count falls to zero (2), which
          voids the ISSUED LicenseAgreement and returns 1890000 of escrowed deposit to the
          Client (3), which in turn cancels and voids the booking's APPROVED ServiceOrder (4).
          The challenger's surviving hold is renumbered from hold_rank 2 to 1 by the same
          sweep, so a one-level implementation leaves four rows wrong.
        test_recipe:
          setup:
            - "CITYWIDE_CONVENTION window has priority_rank 1; LOCAL_EVENT window has priority_rank 2, challenge_response_hours 72, rental_discount_pct 0.10 and max_challenge_rounds 2"
            - "Ballroom B has daily_base_rate_cents 1200000"
