            - "GET /pass-programs/${prog}/revenue-summary → data.base_revenue_cents == 30000 (spend never enters pass base revenue)"
            - "GET /park-days/${day_901} → data.redeemed_count == 0 (the entry had no reservation to redeem)"

  # ===========================================================================
  # Errors
  # ===========================================================================
  - section: errors
    instances:
      - name: every_existence_rule_returns_its_own_not_found_code
        claim_type: error_triggerable
        grounds:
          - validations[priority=13]
          - validations[priority=15]
          - validations[priority=16]
          - validations[priority=17]
          - validations[priority=18]
          - validations[priority=19]
          - validations[priority=20]
          - validations[priority=21]
          - errors[ERR_PASSHOLDER_NOT_FOUND]
          - errors[ERR_PLAN_NOT_FOUND]
          - errors[ERR_INSTALLMENT_NOT_FOUND]
          - errors[ERR_RESERVATION_NOT_FOUND]
          - errors[ERR_VISIT_NOT_FOUND]
          - errors[ERR_CASE_NOT_FOUND]
          - errors[ERR_UPGRADE_ORDER_NOT_FOUND]
          - errors[ERR_ASSIGNMENT_NOT_FOUND]
        distinguishing_aspect: "Each path parameter has its own code and its own message: eight reads with well-formed but unknown UUIDs must not collapse into one generic 404."
        test_recipe:
          setup:
            - "Empty database; only the caller's headers are needed."
          setup_api_calls: []
          trigger:
            - call: "GET /passholders/00000000-0000-4000-8000-000000000013"
              as: PassOfficeClerk
              captures: { e13: "$.data.error_id" }
            - call: "GET /payment-plans/00000000-0000-4000-8000-000000000015"
              as: PassOfficeClerk
              captures: { e15: "$.data.error_id" }
            - call: "GET /installments/00000000-0000-4000-8000-000000000016"
              as: PassOfficeClerk
              captures: { e16: "$.data.error_id" }
            - call: "GET /reservations/00000000-0000-4000-8000-000000000017"
              as: PassOfficeClerk
              captures: { e17: "$.data.error_id" }
            - call: "GET /visits/00000000-0000-4000-8000-000000000018"
              as: GateAgent
              captures: { e18: "$.data.error_id" }
            - call: "GET /sharing-cases/00000000-0000-4000-8000-000000000019"
              as: ComplianceOfficer
              captures: { e19: "$.data.error_id" }
            - call: "GET /upgrade-orders/00000000-0000-4000-8000-000000000020"
              as: PassOfficeClerk
              captures: { e20: "$.data.error_id" }
            - call: "GET /blockout-assignments/00000000-0000-4000-8000-000000000021"
              as: ProgramAdmin
              captures: { e21: "$.data.error_id" }
          assert:
            - "all eight responses are HTTP 404 with response_type 'error' and a data object holding only error_id and message"
            - "error_ids in order: ERR_PASSHOLDER_NOT_FOUND, ERR_PLAN_NOT_FOUND, ERR_INSTALLMENT_NOT_FOUND, ERR_RESERVATION_NOT_FOUND, ERR_VISIT_NOT_FOUND, ERR_CASE_NOT_FOUND, ERR_UPGRADE_ORDER_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND"
            - "data.message == 'Payment plan not found' for the second call (catalog messages are used verbatim)"
            - "every response still carries meta.api_request_id and meta.api_request_timestamp"

      - name: calls_missing_x_user_id_or_carrying_an_undeclared_role_are_unauthenticated
        claim_type: error_triggerable
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors[ERR_UNAUTHENTICATED]
          - endpoints[POST /pass-programs]
        distinguishing_aspect: "Priorities 1 and 2 both yield 401 and must be distinguished from the 403 of priority 3: a missing X-User-ID and a role string outside the five declared roles are authentication failures, not authorization failures."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              as_user_id: ""
              captures: { e1: "$.data.error_id" }
            - call: "GET /pass-programs"
              as: JanitorialStaff
              captures: { e2: "$.data.error_id" }
          assert:
            - "first trigger (X-User-ID header empty): HTTP 401 with data.error_id == 'ERR_UNAUTHENTICATED'"
            - "second trigger (X-User-Role 'JanitorialStaff' is not one of the five declared roles): HTTP 401 with data.error_id == 'ERR_UNAUTHENTICATED', not 403"
            - "GET /pass-programs with a valid ProgramAdmin header pair returns 200 with data.total_count == 0 (nothing was created)"

      - name: passholder_cannot_touch_another_holders_pass
