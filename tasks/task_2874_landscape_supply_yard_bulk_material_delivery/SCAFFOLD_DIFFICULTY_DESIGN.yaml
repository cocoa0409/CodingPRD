              payload: { material_order_id: "${ord_id}", delivery_truck_id: "${truck_id}", planned_cubic_yards: 10.0, window_start: "2026-08-02T08:00:00.000Z", window_end: "2026-08-02T10:00:00.000Z" }
              as: DispatchPlanner
              captures: { load1_id: $.data.id }
          trigger:
            - call: "POST /delivery-loads"
              payload: { material_order_id: "${ord_id}", delivery_truck_id: "${truck_id}", planned_cubic_yards: 10.0, window_start: "2026-08-02T10:44:00.000Z", window_end: "2026-08-02T12:44:00.000Z" }
              as: DispatchPlanner
