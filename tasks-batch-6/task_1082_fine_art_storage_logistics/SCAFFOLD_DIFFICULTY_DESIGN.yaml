              as: Registrar
              captures: { a1_id: $.data.id }
            - call: "POST /artworks"
              payload: { client_id: "${client_id}", title: "Obelisk", artist: "V. Serra", size_class: "LARGE", fragility_class: "HIGH", climate_class: "AMBIENT" }
              as: Registrar
              captures: { a2_id: $.data.id }
            - call: "POST /crates"
              payload: { artwork_id: "${a1_id}", crate_type: "CLIMATE", internal_length_cm: 200, internal_width_cm: 120, internal_height_cm: 40 }
              as: Coordinator
              captures: { c1_id: $.data.id }
            - call: "POST /crates"
              payload: { artwork_id: "${a2_id}", crate_type: "CLIMATE", internal_length_cm: 200, internal_width_cm: 120, internal_height_cm: 40 }
              as: Coordinator
              captures: { c2_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew Bravo", crew_size: 4, certification_level: "MONUMENTAL" }
