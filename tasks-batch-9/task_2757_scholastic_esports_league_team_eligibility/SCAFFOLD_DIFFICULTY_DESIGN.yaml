            - call: "POST /matches/${m_id}/dispute-actions"
              payload: { action: "REJECT" }
              as: LeagueAdmin
            - call: "POST /matches/${m_id}/dispute-actions"
              payload: { action: "RESUME_REVIEW" }
              as: LeagueAdmin
            - call: "POST /matches/${m_id}/dispute-actions"
              payload: { action: "REJECT" }
              as: LeagueAdmin
          trigger_note: |
            The first trigger call is issued while dispute_status == NEEDS_INFO and must be
            refused; the second returns the dispute to UNDER_REVIEW for the second time; only
            the third, from UNDER_REVIEW, is accepted.
          assert:
            - "the first trigger call returns 409 with data.error_id == ERR_INVALID_DISPUTE_STATE and Match.${m_id}.dispute_status stays NEEDS_INFO"
            - "the second trigger call returns 200 and Match.${m_id}.dispute_status == UNDER_REVIEW (second traversal of the cycle)"
            - "the third trigger call returns 200 and Match.${m_id}.dispute_status == REJECTED"
