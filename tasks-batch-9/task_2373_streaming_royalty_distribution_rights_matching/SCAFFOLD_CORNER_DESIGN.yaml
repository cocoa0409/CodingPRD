      - name: rate_schedule_publishing_split_must_total_10000
        claim_type: violation_to_error
        grounds:
          - validations.priority_24
          - errors.ERR_RATE_SHARE_SPLIT_INVALID
        distinguishing_aspect: |
          mechanical_share_bps + performance_share_bps must equal exactly 10000 — 9000 is rejected
          and so is 10001, and the check is on the SUM, so 0/10000 is a legal all-performance
          schedule. The rule runs at create time, before the schedule can ever be promulgated.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - name: split_under_10000_rejected
              call: "POST /royalties/rate-schedules"
              payload: { proceeding_ref: "CRB-2026-LOW", territory_code: "GB", subscription_tier: "INDIVIDUAL", revenue_share_bps: 7000, per_subscriber_minimum_cents: 500, mechanical_share_bps: 4000, performance_share_bps: 5000, statutory_floor_per_play_millicents: 100, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: RegulatoryOfficer
              captures: { err1: "$.data.error_id" }
            - name: split_over_10000_rejected
              call: "POST /royalties/rate-schedules"
              payload: { proceeding_ref: "CRB-2026-HIGH", territory_code: "GB", subscription_tier: "INDIVIDUAL", revenue_share_bps: 7000, per_subscriber_minimum_cents: 500, mechanical_share_bps: 4001, performance_share_bps: 6000, statutory_floor_per_play_millicents: 100, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: RegulatoryOfficer
              captures: { err2: "$.data.error_id" }
            - call: "POST /royalties/rate-schedules"
              payload: { proceeding_ref: "CRB-2026-ALLPERF", territory_code: "GB", subscription_tier: "INDIVIDUAL", revenue_share_bps: 7000, per_subscriber_minimum_cents: 500, mechanical_share_bps: 0, performance_share_bps: 10000, statutory_floor_per_play_millicents: 100, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: RegulatoryOfficer
              captures: { ok: "$.data.id", st: "$.data.status" }
          assert:
            - "4000 + 5000: HTTP 422 with error_id ERR_RATE_SHARE_SPLIT_INVALID."
            - "4001 + 6000: HTTP 422 with error_id ERR_RATE_SHARE_SPLIT_INVALID — one basis point over is as fatal as a thousand under."
            - "0 + 10000: HTTP 201 with status PROPOSED — a zero mechanical share is legal because only the sum is constrained."

      - name: empty_batch_cannot_seal_and_zero_play_line_cannot_exist
        claim_type: violation_to_error
        grounds:
          - validations.priority_25
          - errors.ERR_EMPTY_USAGE_BATCH
          - errors.ERR_ZERO_PLAY_COUNT
        distinguishing_aspect: |
          Two conditions share priority 25 but attach to different endpoints: seal refuses
          line_count == 0 and line-append refuses play_count < 1. The play_count floor is 1, so a
          single-play line must be accepted — the rule is not "greater than some threshold" — and
          after that one line the same seal call succeeds.
        test_recipe:
          setup:
            - "One OPEN period and one OPEN batch with no lines."
          setup_api_calls:
            - call: "POST /royalties/periods"
              payload: { label: "2026-06", usage_start: "2026-06-01", usage_end: "2026-06-30" }
              as: RoyaltyAdmin
              captures: { per: "$.data.id" }
            - call: "POST /royalties/usage-batches"
              payload: { period_id: "${per}", source_label: "UK client feed" }
              as: RightsOpsAnalyst
              captures: { ub: "$.data.id", lc0: "$.data.line_count" }
          trigger:
            - name: seal_empty_batch_rejected
              call: "POST /royalties/usage-batches/${ub}/seal"
              payload: {}
              as: RightsOpsAnalyst
              captures: { err1: "$.data.error_id" }
