  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: address_overlap_half_open_touching_allowed
        grounds:
          - validations[priority=9]
          - entities.AddressAssignment
        distinguishing_aspect: |
          AddressAssignment resource with HALF-OPEN interval semantics
          [effective_from, effective_to): two DOMESTIC_RESIDENCE intervals
          [2026-01-01, 2026-06-01) and [2026-06-01, null) touch at the
          boundary and are LEGAL, while [2026-01-01, 2026-06-02) against
          [2026-06-01, null) overlaps by one day and is rejected
          ERR_ADDRESS_OVERLAP.
        test_recipe:
          setup:
            - "Member M ACTIVE (direct service). Address A1 DOMESTIC_RESIDENCE [2026-01-01, 2026-06-01)."
          setup_api_calls:
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "Ria Road", applicant_dob: "1987-01-01", basis_type: "DIRECT_SERVICE" }
              as: EligibilityApplicant
              captures: { case_r: $.data.id }
