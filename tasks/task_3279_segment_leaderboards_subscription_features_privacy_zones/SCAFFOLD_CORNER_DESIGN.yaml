            - "Response data has length 1 (limit applied)"
            - "Pagination meta: total_count == 2 for the RIDE filter and has_more == true"

      - name: non_owner_reads_obfuscated_route_only
        claim_type: conditional_action
        grounds: [endpoints, entities.Activity.fields.obfuscated_track]
        distinguishing_aspect: "A non-owner reading an activity whose head/tail points sit inside the owner's ACTIVE zone sees only the obfuscated route: obfuscated endpoints differ from the raw start/end, which are withheld from the public view."
        test_recipe:
          setup: ["Athlete PO has zone centered (60.000,-145.000) r=500m and a COMPLETED activity whose first two and last track points are inside the zone, middle point outside at (60.10,-145.10); athlete PU is an unrelated reader"]
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "po_p@x.com", display_name: "PO P", home_lat: 60.0, home_lng: -145.0 }
              as: PlatformAdmin
              captures: { po_p: $.data.id }
            - call: "POST /v1/athletes"
              payload: { email: "pu_p@x.com", display_name: "PU P", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { pu_p: $.data.id }
            - call: "POST /v1/athletes/${po_p}/privacy_zones"
              payload: { center_lat: 60.000, center_lng: -145.000, radius_m: 500 }
              as: Athlete
              as_user_id: "${po_p}"
            - call: "POST /v1/athletes/${po_p}/activities"
              payload: { device_source: "mobile-app", sport_type: "RUN", started_at: "2026-09-01T06:00:00Z", duration_s: 900, distance_m: 3000, track_points: [{lat: 60.001, lng: -145.000, t_offset_s: 0}, {lat: 60.002, lng: -145.001, t_offset_s: 300}, {lat: 60.100, lng: -145.100, t_offset_s: 600}, {lat: 60.001, lng: -145.002, t_offset_s: 900}], start_lat: 60.001, start_lng: -145.000, end_lat: 60.001, end_lng: -145.002, idempotency_key: "po-1" }
              as: Athlete
              as_user_id: "${po_p}"
              captures: { act_po: $.data.id }
          trigger:
            - call: "GET /v1/activities/${act_po}"
              as: Athlete
              as_user_id: "${pu_p}"
              captures: { ob_start: $.data.obfuscated_start_lat, ob_end: $.data.obfuscated_end_lat, ob_track: $.data.obfuscated_track }
          assert:
            - "obfuscated_track has length 1 (only the outside point survives)"
            - "obfuscated_start_lat == 60.100 and obfuscated_end_lat == 60.100"
            - "Non-owner response does not expose raw start_lat 60.001 as the visible route"

