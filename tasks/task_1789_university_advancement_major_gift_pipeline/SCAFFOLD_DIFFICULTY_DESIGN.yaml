          Half-open interval semantics on the NamingOpportunity resource: the
          reservation holds on [presented_at, reserved_until) so a competing
          present at 2026-08-14T23:59:59Z is rejected while at exactly
          2026-08-15T00:00:00Z the reservation is released and the same present
          succeeds with a fresh window ending 2026-08-29T00:00:00Z. Distinct
