      - name: aid_waterfall_pays_in_need_order_and_a_denial_keeps_the_money
        claim_type: waterfall_allocation
        grounds:
          - calculations.aid_award_waterfall
          - calculations.aid_need_score
          - endpoints[POST /seasons/{seasonId}/aid-award-run]
        distinguishing_aspect: |
          One run walks the UNDER_REVIEW queue in aid_need_score DESC order (63, 31, 13)
          and clamps each grant to min(requested, per_member_ceiling 30000, remaining).
          Nora asks 40000 and is cut to the 30000 ceiling; Milo asks 3000, which is below
          MIN_AWARD_CENTS 5000, so he is DENIED with BELOW_MIN_AWARD - and crucially
          `remaining` is NOT decremented, which is why Lena, third in line, still receives
          her full 20000. Season ends with aid_committed 50000 / aid_available 50000.
        test_recipe:
          setup:
            - "Season in IN_SEASON, aid_budget_cents 100000 (per_member_ceiling = 30000),"
            - "tuition_base_cents 123223, one PHILHARMONIC ensemble with a VIOLIN quota"
            - "min 1 / target 3 / max 3, filled by three members who each hold a CURRENT"
            - "account with assessed_cents 123223 and no instrument loan:"
            - "  Need Nora  BAND_A, sibling true,  years_in_org 4 -> need score 63, asks 40000"
            - "  Mid Milo   BAND_B, sibling false, years_in_org 1 -> need score 31, asks  3000"
            - "  Low Lena   BAND_C, sibling false, years_in_org 0 -> need score 13, asks 20000"
            - "All three requests were opened for funding by officer fin-reviewer-1, so all"
            - "three accounts are UNDER_REVIEW; Season.aid_available_cents is still 100000."
            - "The award run is executed by a different officer, fin-director-9, as required by"
            - "the priority-52 segregation rule."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: ArtisticDirector
            - call: "POST /seasons"
