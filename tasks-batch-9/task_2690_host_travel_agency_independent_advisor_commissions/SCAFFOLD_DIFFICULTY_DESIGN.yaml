            - "Booking.${bk_supplier_id}.commission_status == CHARGED_BACK"

  - rule_id: combinatorial_formula
    instances:
      - name: expected_commission_mode_a_rate_selection_matrix
        grounds:
          - calculations.booking_expected_commission
          - entities.Supplier.fields.preferred_override_commission_pct
          - entities.Supplier.fields.rate_ceiling_pct
          - entities.Supplier.fields.max_commission_per_booking_cents
          - entities.Consortium.fields.consortium_channel_bonus_pct
          - entities.Booking.fields.applied_commission_rate
        distinguishing_aspect: |
          MODE (a): the branch structure lives in the RATE — a two-way base-rate branch
          (preferred override vs base, gated on supplier program standing AND consortium
          co-membership) crossed with a three-way channel-bonus branch, then clamped by a rate
          ceiling and finally by a per-booking cents cap; five bookings differing only in
          channel, supplier and gross_sale_cents produce five different applied_commission_rate
          / expected_commission_cents pairs.
        test_recipe:
          setup:
            - "Consortium with consortium_channel_bonus_pct 0.01."
            - "Aurora Cruises: PREFERRED, co-member, base 0.10, preferred override 0.15, ceiling 0.18, cap 500000."
            - "Cobalt Rail: PREFERRED, co-member, base 0.10, preferred override 0.15, ceiling 0.152, cap 9000000."
            - "One ACTIVE consortium-member advisor in NY accredited with both suppliers."
            - "One client with max_concurrent_trips 6 so no travel-window capacity rule fires."
          setup_api_calls:
            - call: "POST /host-agency/split-schedules"
              payload: { name: "Standard 2026", tiers: [{ tier_level: 1, min_production_cents: 0, advisor_pct: 0.70 }, { tier_level: 2, min_production_cents: 5000000, advisor_pct: 0.80 }, { tier_level: 3, min_production_cents: 15000000, advisor_pct: 0.90 }], platform_fee_tiers: [{ min_share_cents: 0, fee_pct: 0.05 }, { min_share_cents: 1000000, fee_pct: 0.03 }], chargeback_retention_pct: 0.10 }
