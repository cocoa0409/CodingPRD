    side_effects: ["on APPROVED runs equipment_and_rescission_refund_floor, cascades the adjudication into the dealer balances, and cancels the contract", "on DECLINED only the request status changes", "increments RescissionRequest.version by 1"]

  - method: GET
    path: "/alarm-funding/contracts/{id}/sites"
    description: "List the protected-premises sites of a contract"
    roles: [Customer, FundingAnalyst, ServiceCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: Site[]
    side_effects: []
  - method: GET
    path: "/alarm-funding/contracts/{id}/attrition-flags"
    description: "List the attrition flags raised against a contract"
    roles: [FundingAnalyst, ChannelManager, PlatformAdmin]
    code: 200
    input: []
    output: AttritionFlag[]
    side_effects: []
  - method: GET
    path: "/alarm-funding/contracts/{id}/owners"
    description: "List the ownership segments of a contract, newest first by started_at"
    roles: [Customer, FundingAnalyst, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: ContractOwner[]
    side_effects: []
  - method: GET
    path: "/alarm-funding/customers/{id}/contract-owners"
    description: "List the ownership segments held by a subscriber"
    roles: [Customer, FundingAnalyst, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: ContractOwner[]
    side_effects: []
  - method: GET
    path: "/alarm-funding/customers/{id}/assumption-requests"
    description: "List the assumption requests naming a subscriber as the incoming owner"
    roles: [Customer, FundingAnalyst, ServiceCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: AssumptionRequest[]
    side_effects: []
  - method: GET
    path: "/alarm-funding/attrition-sweeps/{id}/flags"
    description: "List the attrition flags raised by a sweep"
    roles: [FundingAnalyst, ChannelManager, PlatformAdmin]
    code: 200
    input: []
    output: AttritionFlag[]
    side_effects: []
  - method: GET
    path: "/alarm-funding/assumption-requests/{id}/owners"
    description: "List the ownership segments produced by an assumption request"
    roles: [Customer, FundingAnalyst, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: ContractOwner[]
    side_effects: []

  - method: POST
    path: "/alarm-funding/alarm-reduction-actions"
    description: "Raise a false-alarm reduction action on a monitoring account"
    roles: [ServiceCoordinator, MonitoringOperator]
    code: 201
    input: [monitoring_account_id, action_type]
    output: AlarmReductionAction
    side_effects: ["creates the reduction action in OPEN"]

  # --- Dealer cash adjustments ---------------------------------------------
  - method: POST
    path: "/alarm-funding/dealers/{id}/holdback-releases"
    description: "Release holdback reserve back to the dealer"
    roles: [FundingAnalyst]
    code: 200
    input: [amount_cents]
    output: Dealer
    side_effects: ["moves min(amount_cents, holdback_reserve_cents) from holdback_reserve_cents into chargeback_balance_due_cents", "re-derives Dealer.standing", "increments Dealer.version by 1"]
  - method: POST
    path: "/alarm-funding/dealers/{id}/holdback-reversals"
    description: "Reverse a prior holdback release, returning the amount to the reserve"
    roles: [FundingAnalyst]
    code: 200
    input: [amount_cents]
    output: Dealer
    side_effects: ["moves min(amount_cents, chargeback_balance_due_cents) from chargeback_balance_due_cents back into holdback_reserve_cents", "re-derives Dealer.standing", "increments Dealer.version by 1"]

  # --- Alarm legal holds ---------------------------------------------------
  - method: POST
    path: "/alarm-funding/alarm-events/{id}/legal-hold"
    description: "Place a legal hold on a verified alarm, removing it from the false-alarm signal count"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: AlarmEvent
    side_effects: ["sets AlarmEvent.counted_for_false_alarm = false", "increments AlarmEvent.version by 1"]
  - method: POST
    path: "/alarm-funding/alarm-events/{id}/legal-hold-release"
    description: "Release a legal hold on an alarm, restoring it to the false-alarm signal count"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: AlarmEvent
    side_effects: ["sets AlarmEvent.counted_for_false_alarm = true when the alarm was counted for its window", "increments AlarmEvent.version by 1"]

  # --- Logical clock (test-driving endpoint) -------------------------------
  - method: POST
    path: "/alarm-funding/_clock/set_current_utc"
    description: "Set the server's logical clock. The server starts with the logical clock fixed at 2026-09-01T00:00:00Z and never falls back to real wall-clock time before the first call to this endpoint."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header absent, or the role is not a declared role"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not permitted for the endpoint per §1.7"
  - id: ERR_ENTITY_NOT_FOUND
    http: 404
    condition: "a path entity id does not resolve to a row"
  - id: ERR_FK_INTEGRITY_VIOLATION
    http: 400
    condition: "a body foreign key does not resolve to a row"
  - id: ERR_MONITORING_ACCOUNT_NOT_FOUND
    http: 404
    condition: "a funding package declares no child contract, or its children carry no monitoring account"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target resource is not in a state from which the requested transition is declared"
  - id: ERR_PACKAGE_NOT_APPROVED
    http: 409
    condition: "a package is funded from a state other than APPROVED"
  - id: ERR_CONTRACT_NOT_PENDING
    http: 409
    condition: "a contract is funded from a state other than PENDING_VALIDATION"
  - id: ERR_RESCISSION_WINDOW_CLOSED
    http: 409
    condition: "the rescission request instant is after the funding instant plus rescission_window_days, or the request is not REQUESTED"
  - id: ERR_ALARM_ALREADY_VERIFIED
    http: 409
    condition: "verification is recorded for an alarm that is not PENDING"
  - id: ERR_DISPATCH_NOT_REQUESTED
    http: 409
    condition: "a dispatch action is attempted from a state that does not declare it"
  - id: ERR_FUNDING_WINDOW_EXPIRED
    http: 409
    condition: "a package or contract is funded after expires_at on the logical clock, or the pending-expiry sweep has already frozen it"
  - id: ERR_ALARM_OUTSIDE_VERIFIED_WINDOW
    http: 422
    condition: "entered_at_utc lies outside the inclusive verified window, or a dispatch abort is not strictly before entered_at_utc plus the abort window"
  - id: ERR_SERVICE_WINDOW_OVERLAP
    http: 422
    condition: "a scheduled visit collides with another non-cancelled slot of the same technician under the half-open rule, or an installation collides with another slot of the same crew under the buffer rule"
  - id: ERR_RESIDENCE_OUTSIDE_SERVICE_RADIUS
    http: 422
    condition: "the incoming subscriber's residence_state_code is outside the relocation service radius"
  - id: ERR_SEGREGATION_OF_DUTIES_REQUIRED
    http: 403
    condition: "the rescission approver's X-User-ID equals the request's operator_id"
  - id: ERR_MASS_CANCEL_BLOCKED
    http: 422
    condition: "the count of ABORTED or CLOSED dispatches for the account at or after the alarm's occurred_at is already 3"
  - id: ERR_FALSE_ALARM_WATCH_ACTIVE
    http: 422
    condition: "the contract has an open SERVICE_REQUIRED reduction action at assumption completion"
  - id: ERR_PACKAGE_REFERENCE_DUPLICATE
    http: 409
    condition: "the natural key dealer_id + package_reference already exists"
  - id: ERR_SWEEP_MONTH_DUPLICATE
    http: 409
    condition: "an attrition sweep already exists for the requested sweep_month"
  - id: ERR_NATURAL_KEY_DUPLICATE
    http: 409
    condition: "the customer email or the monitoring account number already exists"
  - id: ERR_NO_FUNDABLE_CONTRACT
    http: 422
    condition: "package_funding_posture returned DECLINED, so no child may be funded"
  - id: ERR_PACKAGE_DECLINED
    http: 409
    condition: "a child contract was frozen because a sibling child failed the credit floor and the whole-package posture was DECLINED"
  - id: ERR_ASSUMED_CONTRACT_MUST_HAVE_SURVIVING_CONTRACT
    http: 422
    condition: "the outgoing subscriber would be left with no contract in {ACTIVE, DELINQUENT}"
  - id: ERR_ALARM_NOT_FOR_ACCOUNT
    http: 422
    condition: "the alarm event supplied to a dispatch does not belong to the named monitoring account"
  - id: ERR_CREDIT_SCORE_BELOW_FLOOR
    http: 422
    condition: "credit_score or incoming_credit_score is strictly below the contract quality floor"
  - id: ERR_TERM_BELOW_FLOOR
    http: 422
    condition: "contract_term_months is strictly below the contract quality floor"
  - id: ERR_EQUIPMENT_CONFIG_NOT_PERMITTED
    http: 422
    condition: "the equipment configuration is not on the contract quality matrix for the origination channel"
  - id: ERR_MONITORING_NOT_PROVISIONED
    http: 422
    condition: "no monitoring account is PROVISIONED and no onsite-install waiver exempts the contract"
  - id: ERR_DEALER_STANDING_SUSPENDED
    http: 422
    condition: "the dealer's standing is SUSPENDED at package approval"
  - id: ERR_DEALER_PACKAGE_SUSPENDED
    http: 422
    condition: "a package is created or submitted for a dealer whose standing is SUSPENDED"
  - id: ERR_DEALER_CHARGEBACK_RATE_EXCEEDED
    http: 422
    condition: "the dealer's chargeback rate exceeds the cap at package creation or submission"
  - id: ERR_HOLDBACK_RATE_EXCEEDS_CEILING
    http: 422
    condition: "the dealer's holdback_rate is above the maximum permitted rate"
  - id: ERR_CHARGEBACK_WINDOW_CLOSED
    http: 409
    condition: "a chargeback is adjudicated for a cancellation outside the chargeback window or for a chargeback_exempt contract"
  - id: ERR_DISCLOSURE_AMOUNT_MISMATCH
    http: 409
    condition: "the disclosure's snapped amounts no longer match the contract's equipment_financed_cents or monthly_monitoring_cents"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "the expected parent version supplied for an OCC-guarded write differs from the parent's current version"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required body field is missing or a value violates its declared type or range"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Benchmark operator; owns the logical clock and the cross-tenant administrative reads"
    identity: "opaque"
    exclusive_operations: ["POST /alarm-funding/_clock/set_current_utc"]
    shared_operations: ["read any resource", "GET /alarm-funding/dealers", "GET /alarm-funding/dealer-packages", "GET /alarm-funding/contracts", "GET /alarm-funding/customers"]
  - name: ChannelManager
    description: "Dealer channel operator who onboards dealers and originates direct contracts"
    identity: "opaque"
    exclusive_operations: ["POST /alarm-funding/dealers"]
    shared_operations: ["POST /alarm-funding/contracts", "GET /alarm-funding/dealers", "GET /alarm-funding/customers"]
  - name: Dealer
    description: "Originating dealer that submits funding packages; acts as one Dealer row"
    identity: "entity_backed:Dealer"
    exclusive_operations: ["POST /alarm-funding/dealer-packages/{id}/submit", "POST /alarm-funding/dealer-packages/{id}/withdraw"]
    shared_operations: ["POST /alarm-funding/dealer-packages", "POST /alarm-funding/dealer-packages/{id}/contracts", "GET /alarm-funding/contracts"]
  - name: FundingAnalyst
    description: "Company funding-side analyst who approves and funds packages, runs attrition sweeps and adjudicates chargebacks"
    identity: "opaque"
    exclusive_operations: ["POST /alarm-funding/dealer-packages/{id}/approve", "POST /alarm-funding/dealer-packages/{id}/fund", "POST /alarm-funding/dealer-packages/{id}/decline", "POST /alarm-funding/dealers/{id}/chargeback-rate-recompute", "POST /alarm-funding/attrition-sweeps/run", "POST /alarm-funding/contracts/{id}/chargeback", "POST /alarm-funding/assumption-requests/{id}/accept", "POST /alarm-funding/assumption-requests/{id}/reject"]
    shared_operations: ["POST /alarm-funding/contracts/{id}/fund", "POST /alarm-funding/contracts/{id}/cancel", "GET /alarm-funding/dealer-packages", "GET /alarm-funding/contracts"]
  - name: ComplianceOfficer
    description: "Compliance operator who adjudicates rescissions and disclosures and enforces segregation of duties"
    identity: "opaque"
    exclusive_operations: ["POST /alarm-funding/rescission-requests/{id}/decision"]
    shared_operations: ["GET /alarm-funding/rescission-requests", "POST /alarm-funding/rescission-requests", "POST /alarm-funding/installations/{id}/waiver"]
  - name: MonitoringOperator
    description: "Central-station operator who provisions monitoring accounts, verifies alarms and coordinates dispatch"
    identity: "opaque"
    exclusive_operations: ["POST /alarm-funding/monitoring-transfers/{id}/trigger", "POST /alarm-funding/alarm-events", "POST /alarm-funding/alarm-events/{id}/verification", "POST /alarm-funding/dispatch-requests", "POST /alarm-funding/dispatch-requests/{id}/dispatch", "POST /alarm-funding/dispatch-requests/{id}/abort", "POST /alarm-funding/dispatch-requests/{id}/complete"]
    shared_operations: ["GET /alarm-funding/alarm-events", "GET /alarm-funding/monitoring-accounts"]
  - name: ServiceCoordinator
    description: "Field operations coordinator who schedules installs and service visits and restores service"
    identity: "opaque"
    exclusive_operations: ["POST /alarm-funding/installations/{id}/complete", "POST /alarm-funding/installations/{id}/mark-failed", "POST /alarm-funding/contracts/{id}/reactivate-service", "POST /alarm-funding/service-visits/{id}/perform"]
    shared_operations: ["POST /alarm-funding/installations", "POST /alarm-funding/service-visits", "POST /alarm-funding/service-visits/{id}/schedule", "POST /alarm-funding/assumption-requests"]
  - name: Customer
    description: "Subscriber; acts as one Customer row for cancellation, assumption and rescission self-service"
    identity: "entity_backed:Customer"
    exclusive_operations: ["POST /alarm-funding/contracts/{id}/cancel", "POST /alarm-funding/rescission-requests"]
    shared_operations: ["GET /alarm-funding/contracts", "GET /alarm-funding/service-visits", "POST /alarm-funding/assumption-requests", "POST /alarm-funding/assumption-requests/{id}/complete"]

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: package_funding_posture
    trigger: "on POST /dealer-packages/{id}/approve and POST /dealer-packages/{id}/fund, after every gate-failing child has been frozen"
    algorithm: aggregation
    input_set: "each child contract of the package whose contract_status is not CANCELLED; children already CANCELLED are excluded"
    formula: |
      funded_children = [c for c in package.children if c.contract_status != 'CANCELLED']
      declined_children = [c for c in package.children if c.contract_status == 'CANCELLED'
                            and c.cancelled_from_status == 'PENDING_VALIDATION']
      if any(c.validation_failure_code == 'ERR_CREDIT_SCORE_BELOW_FLOOR' for c in declined_children):
          package_posture = 'DECLINED'
      else:
          package_posture = 'FUNDED' if len(funded_children) > 0 else 'DECLINED'
      package_holdback_cents = sum(c.holdback_cents for c in funded_children)
      return package_posture, package_holdback_cents
    constants:
      CREDIT_FLOOR_FREEZE_CODE: ERR_CREDIT_SCORE_BELOW_FLOOR
    precision: "integer cents, exact"
    variants:
      - name: funded_partial
        when: "at least one child survived the gates and no declined child froze on ERR_CREDIT_SCORE_BELOW_FLOOR"
        difference: "posture FUNDED; declined_count is non-zero but the package still funds"
      - name: declined_whole
        when: "a declined child froze on validation_failure_code == ERR_CREDIT_SCORE_BELOW_FLOOR"
        difference: "posture DECLINED; the fund call freezes every PENDING_VALIDATION child — the credit offender carries ERR_CREDIT_SCORE_BELOW_FLOOR and each other child carries ERR_PACKAGE_DECLINED"

  - name: funding_fee
    trigger: "on Contract PENDING_VALIDATION -> ACTIVE"
    algorithm: aggregation
    input_set: "the single contract being funded; capex_cents is derived from equipment_config_code before the fee is computed"
    formula: |
      capex_cents = base_fee_cents_by_config[equipment_config_code]
      holdback_cents = round_half_up(capex_cents * dealer.holdback_rate)
      funding_amount_cents = capex_cents - holdback_cents
      holdback_remaining_cents = holdback_cents
      funding_points = dealer_funding_points_by_tier[dealer.quality_tier]   # 0 for DIRECT channel
    constants:
      base_fee_cents_by_config: { BASE: 14900, PREMIUM: 24900, ELITE: 34900 }
      dealer_funding_points_by_tier: { TIER_1: 1.03, TIER_2: 1.00, TIER_3: 0.97 }
    precision: "integer cents, round_half_up"
    variants: []

  - name: equipment_financing_split
    trigger: "on Installation SCHEDULED -> COMPLETED and on Contract PENDING_VALIDATION -> ACTIVE"
    algorithm: aggregation
    input_set: "the single contract; equipment_config_code and capex_cents only"
    formula: |
      monitoring_share_cents = round_half_up(capex_cents * 0.60) + DEALER_ONBOARDING_FEE_CENTS
      raw_equipment_cents    = round_half_up(monitoring_share_cents * 0.02)
      equipment_financed_cents = raw_equipment_cents
      monitored_service_cents  = monitoring_share_cents - raw_equipment_cents
      equipment_payment_cents  = round_half_up(equipment_financed_cents / contract_term_months)
      # rounding order is PINNED: each term installment is rounded to cents FIRST,
      # then multiplied by the term. Sum-then-round produces a different cent total.
      total_of_payments_cents  = equipment_payment_cents * contract_term_months
    constants:
      MONITORING_SHARE_PCT: 0.60
      EQUIPMENT_SHARE_PCT: 0.02
      DEALER_ONBOARDING_FEE_CENTS: 149
    precision: "integer cents, round_half_up at each named step; the installment is rounded before multiplication"
    variants:
      - name: disclosure_snapshot
        when: "the split is re-run at disclosure issuance for a contract whose term changed after funding"
        difference: "keeps the funded equipment_financed_cents but recomputes equipment_payment_cents against the new term, so total_of_payments differs from the funded snapshot"

  - name: dealer_chargeback_rate
    trigger: "on POST /dealers/{id}/chargeback-rate-recompute"
    algorithm: threshold
    input_set: "packages closed_at within the trailing 12 logical months ending at the current logical clock; contracts CANCELLED with current cancelled_from_status == 'ACTIVE' and activated_at non-null"
    formula: |
      L = count(p for p in dealer.packages if p.package_status == 'FUNDED'
                and within_trailing_12_months(p.closed_at, now))
      D = count(c for c in dealer.contracts
                if c.contract_status == 'CANCELLED'
                and c.cancelled_from_status == 'ACTIVE'
                and c.activated_at is not None
                and exists_valid_inadvertent_alarm(c, c.activated_at, c.cancelled_at)
                and within_trailing_12_months(c.cancelled_at, now))
      # exists_valid_inadvertent_alarm is true iff the contract has at least one
      # AlarmEvent with verified_at non-null and verification_outcome in
      # {VERIFIED, FALSE_ALARM} whose occurred_at lies in [activated_at, cancelled_at] inclusive.
      chargeback_rate_percent = round_half_up(100.0 * L / D, 2) if D > 0 else 0.00
      if chargeback_rate_percent > 12.00: dealer.standing = 'WATCH' else: 'ACTIVE'
    constants:
      DEALER_CHARGEBACK_RATE_CAP_PERCENT: 12.00
      TRAILING_WINDOW_MONTHS: 12
    precision: "percent, 2 decimal places, round_half_up"
    variants: []

  - name: false_alarm_ratio
    trigger: "on POST /alarm-events/{id}/verify and on-read for GET /monitoring-accounts/{id}/false-alarm-ratio"
    algorithm: threshold
    input_set: "AlarmEvent rows whose occurred_at falls in [now - TRAILING_WINDOW_DAYS, now] inclusive"
    formula: |
      known_alarms  = count(a for a in account.alarms if in_window(a.occurred_at))
      verified_sigs = count(a for a in account.alarms if in_window(a.occurred_at)
                            and a.verified_at is not None
                            and a.verification_outcome in ('VERIFIED','FALSE_ALARM')
                            and a.counted_for_false_alarm)
      ratio_percent = round_half_up(100.0 * verified_sigs / known_alarms, 2) if known_alarms > 0 else 0.00
      if ratio_percent > 35.00:
          raise_service_action = False            # the service action belongs to the abuse path, not the ratio path
      return ratio_percent
    constants:
      KNOWN_ALARM_RATE_CAP_PERCENT: 35.00
      TRAILING_WINDOW_DAYS: 30
    precision: "percent, 2 decimal places, round_half_up"
    variants: []

  - name: attrition_sweep_cohort
    trigger: "on POST /attrition-sweeps/run"
    algorithm: chronological
    input_set: "contracts with contract_status == ACTIVE whose activated_at month is at or before sweep_month, ordered by created_at ascending"
    formula: |
      for c in contracts ordered by (c.created_at asc):
          cohort = c.activated_at.strftime('%Y-%m')
          if cohort > sweep_month: continue                      # not yet in cohort
          if c.monitoring_hold_until is not None and c.monitoring_hold_until > now: continue
          append c.id to sweep.flagged_contract_ids
          sweep.delinquent_count += 1
          c.contract_status = 'DELINQUENT'                       # flags as a cash-at-risk early-cancellation
          c.monitoring_hold_until = now
          # the same pass then resumes previously delinquent contracts that have been serviced
          for d in contracts ordered by (d.created_at asc) with d.contract_status == 'DELINQUENT':
              if open SERVICE_REQUIRED action exists on d's account:
                  d.contract_status = 'ACTIVE'
                  sweep.resumed_count += 1
      sweep.evaluated_count = count(cohort == sweep_month)
    constants:
      COHORT_PREFIX_RULE: "contract enters when contract_term_months - months_elapsed(c) <= 6"
    precision: "not applicable; ordering by created_at ascending, tie-break none (created_at is unique per row)"
    variants: []

  - name: post_warranty_service_sweep
    trigger: "on POST /service-visits/{id}/perform and on Contract ACTIVE -> CANCELLED"
    algorithm: waterfall_allocation
    input_set: "ServiceVisit rows with work_type == 'WARRANTY_REPAIR' and warranty_status_at_visit == false; Contract rows with post_warranty_cents > post_warranty_sweep_threshold_cents"
    formula: |
      # billing_route for a performed visit
      billed_cents = DEALER_VISIT_FEE_CENTS                       # 89
      if visit.warranty_status_at_visit:
          billing_route = 'CUSTOMER'                              # flat after-hours fee, dealer not billed
          dealer_sweep_cents = 0
      else:
          billing_route = 'DEALER_HOLDBACK'
          dealer_sweep_cents = billed_cents
      # post-warranty service sweep against the dealer's holdback reserve
      billable_base_cents = contract.post_warranty_cents          # 3 * capex_cents
      draw = round_half_up(0.20 * billable_base_cents)
      applied = min(draw, dealer.holdback_reserve_cents)
      dealer.holdback_reserve_cents -= applied
      contract.holdback_remaining_cents = dealer.holdback_reserve_cents
      contract.dealer_holdback_sweep_cents += applied
      remaining_due = draw - applied
      if remaining_due > 0:
          dealer.chargeback_balance_due_cents += remaining_due
          case_type = 'CASH'                                   # cash recovery case is raised
      else:
          case_type = 'HOLDBACK_ONLY'
    constants:
      DEALER_VISIT_FEE_CENTS: 89
      POST_WARRANTY_SERVICE_SWEEP_PCT: 0.20
      POST_WARRANTY_SWEEP_THRESHOLD_CENTS: 15000
    precision: "integer cents, round_half_up; the draw is rounded once before the waterfall"
    variants:
      - name: post_warranty_cancel
        when: "performed for a contract whose post_warranty_cents exceeds the sweep threshold"
        difference: "draw uses billable_base_cents as computed for the contract; a contract below the threshold is skipped entirely (sweep amount 0)"

  - name: equipment_and_rescission_refund_floor
    trigger: "on POST /rescission-requests/{id}/approve"
    algorithm: waterfall_allocation
    input_set: "the single funded contract under rescission plus its dealer; equipment_balance_floor_cents contributes zero when the contract is not yet equipment_financing_disclosed"
    formula: |
      months_since = whole_calendar_months(contract.activated_at, now)
      equipment_financed_cents = equipment_financing_split(contract).equipment_financed_cents
      equipment_balance_floor_cents = contract.equipment_financed_cents + contract.financed_charge_at_apr_cents
      deferred_monitoring_amount_cents = round_half_up(0.10 * contract.capex_cents) + contract.financed_charge_at_apr_cents
      amortised_capex_recovery_cents = round_half_up(contract.capex_cents * min(months_since, 3) / contract.contract_term_months)
      adjudication_amount_cents = max(equipment_balance_floor_cents,
                                     deferred_monitoring_amount_cents + amortised_capex_recovery_cents)
      dealer_recovery = min(contract.holdback_remaining_cents, adjudication_amount_cents)
      dealer.chargeback_balance_due_cents += adjudication_amount_cents - dealer_recovery
      company_net_cents = deferred_monitoring_amount_cents + amortised_capex_recovery_cents - dealer_recovery
    constants:
      DEFERRED_MONITORING_PCT: 0.10
      AMORTISATION_WINDOW_MONTHS: 3
    precision: "integer cents, round_half_up"
    variants:
      - name: surplus_case
        when: "the contract is inside the rescission window so the deferral is retained"
        difference: "deferred_monitoring_amount_cents is the retained 10% of capex plus the financed charge, so the adjudication total exceeds the equipment-balance floor in every non-degenerate case"
      - name: deficit_case
        when: "the dealer's early-cancellation abuse flag is open for the contract"
        difference: "deferred_monitoring_amount_cents is forced to 0, so the adjudication total collapses to the amortised capex recovery and the company nets strictly less"

  - name: delinquency_days
    trigger: "on POST /attrition-sweeps/run (read) and on GET /contracts/{id}/delinquency"
    algorithm: chronological
    input_set: "the single contract"
    formula: |
      delinquency_days = whole_calendar_days(contract.attrition_checked_at, now)
                           if contract.contract_status == 'DELINQUENT' else 0
    constants: {}
    precision: "whole calendar days between two logical instants"
    variants: []

  - name: allowed_holdback_rate_floor_ceiling_binding
    trigger: "on POST /dealer-packages/{id}/approve"
    algorithm: threshold
    input_set: "the package's submitted child contracts and the dealer's holdback_rate"
    formula: |
      allowed_holdback_rate_ceiling_cents = min(round_half_up(0.15 * package_capex_cents),
                                                round_half_up(dealer.holdback_rate * package_capex_cents))
      submitted_holdback_cents = sum(round_half_up(dealer.holdback_rate * c.capex_cents) for c in package.children)
      if submitted_holdback_cents > allowed_holdback_rate_ceiling_cents:
          # only the ceiling is retained in the posture value; the approved_holdback_cents
          # reported on approval is the ceiling, not the submitted sum
          approved_holdback_cents = allowed_holdback_rate_ceiling_cents
      else:
          approved_holdback_cents = submitted_holdback_cents
    constants:
      HOLDBACK_CEILING_PCT: 0.15
    precision: "integer cents, round_half_up"
    variants: []

  - name: chargeback_decision
    trigger: "on Contract ACTIVE -> CANCELLED and on POST /contracts/{id}/chargeback"
    algorithm: threshold
    input_set: "the single contract, its dealer and the chargeback window"
    formula: |
      if contract.chargeback_exempt: return (0, 'EXEMPT')          # approved onsite-install install waiver
      if contract.cancelled_from_status != 'ACTIVE': return (0, 'NOT_IN_WINDOW')
      if contract.cancelled_at > contract.activated_at + chargeback_window_days:
          return (0, 'NOT_IN_WINDOW')
      amount = max(0, round_half_up(contract.capex_cents * DEALER_CHARGEBACK_PCT))
      holdback_recovery = min(dealer.holdback_reserve_cents, amount)
      dealer.holdback_reserve_cents -= holdback_recovery
      remaining = amount - holdback_recovery
      dealer.chargeback_balance_due_cents += remaining
      return (amount, 'CHARGEBACK')
    constants:
      DEALER_CHARGEBACK_PCT: 0.10
    precision: "integer cents, round_half_up"
    variants: []

  - name: dealer_standing_derivation
    trigger: "on any write that touches Dealer.chargeback_balance_due_cents, Dealer.chargeback_rate_12mo_sum or Dealer.funding_package_count_12mo"
    algorithm: threshold
    input_set: "the single dealer"
    formula: |
      if dealer.chargeback_balance_due_cents > 500000:
          standing = 'SUSPENDED'
      elif dealer.funding_package_count_12mo > 0
               and round_half_up(100.0 * dealer.chargeback_rate_12mo_sum / dealer.funding_package_count_12mo, 2) > 12.00:
          standing = 'WATCH'
      else:
          standing = 'ACTIVE'
    constants:
      DEALER_SUSPEND_BALANCE_THRESHOLD_CENTS: 500000
      DEALER_CHARGEBACK_RATE_CAP_PERCENT: 12.00
    precision: "not applicable"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# Higher priority = evaluated first; the first failure's error_id is returned.
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and the role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting role is permitted for this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every path entity exists, resolved left-to-right; an entity named in the path that does not exist returns this error before any state or business check runs"
    error_id: ERR_ENTITY_NOT_FOUND
    http_status: 404
    applies_to: "all path-scoped endpoints"
  - priority: 3
    category: existence
    check: "every FK supplied in the body resolves to an existing row (customer_id, dealer_id, contract_id, site_id, monitoring_account_id, alarm_event_id, installation_id)"
    error_id: ERR_FK_INTEGRITY_VIOLATION
    http_status: 400
    applies_to: "[POST /dealer-packages/{id}/contracts, POST /contracts, POST /sites, POST /installations, POST /service-visits, POST /alarm-events, POST /dispatch-requests, POST /assumption-requests, POST /rescission-requests]"
  - priority: 3
    category: existence
    check: "a funding package that declares no child contract, or whose children carry no monitoring account, cannot be evaluated"
    error_id: ERR_MONITORING_ACCOUNT_NOT_FOUND
    http_status: 404
    applies_to: "[POST /dealer-packages/{id}/approve, POST /dealer-packages/{id}/fund]"
  - priority: 4
    category: state
    check: "the target resource is in a state from which the requested transition is declared"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 4
    category: state
    check: "a package may fund only from APPROVED"
    error_id: ERR_PACKAGE_NOT_APPROVED
    http_status: 409
    applies_to: "[POST /dealer-packages/{id}/fund]"
  - priority: 4
    category: state
    check: "a contract may fund only from PENDING_VALIDATION"
    error_id: ERR_CONTRACT_NOT_PENDING
    http_status: 409
    applies_to: "[POST /contracts/{id}/fund]"
  - priority: 4
    category: state
    check: "a rescission request may be approved only while the contract is ACTIVE or DELINQUENT and the request is REQUESTED"
    error_id: ERR_RESCISSION_WINDOW_CLOSED
    http_status: 409
    applies_to: "[POST /rescission-requests/{id}/approve]"
  - priority: 4
    category: state
    check: "an alarm may be verified or marked false only from PENDING"
    error_id: ERR_ALARM_ALREADY_VERIFIED
    http_status: 409
    applies_to: "[POST /alarm-events/{id}/verify, POST /alarm-events/{id}/mark-false]"
  - priority: 4
    category: state
    check: "a dispatch may be dispatched, aborted or completed only from its declared from-state"
    error_id: ERR_DISPATCH_NOT_REQUESTED
    http_status: 409
    applies_to: "[POST /dispatch-requests/{id}/dispatch, POST /dispatch-requests/{id}/abort, POST /dispatch-requests/{id}/complete]"
  - priority: 4
    category: state
    check: "a service visit may be performed or cancelled only from SCHEDULED; an installation may be completed or failed only from SCHEDULED; a waiver may be approved only from REQUESTED; a disclosure may be issued only from PENDING"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "[POST /service-visits/{id}/perform, POST /service-visits/{id}/cancel, POST /installations/{id}/complete, POST /installations/{id}/mark-failed, POST /install-waivers/{id}/approve, POST /disclosures/{id}/issue]"
  - priority: 5
    category: business_temporal
    check: "a DEALER-channel contract may fund only at or before its package expires_at, where expires_at is the approval instant plus funding_window_days = 10, evaluated on the logical clock"
    error_id: ERR_FUNDING_WINDOW_EXPIRED
    http_status: 409
    applies_to: "[POST /dealer-packages/{id}/fund, POST /contracts/{id}/fund]"
  - priority: 5
    category: business_temporal
    check: "an alarm may be verified or marked false only when entered_at_utc lies in the inclusive verified window [occurred_at - 30s, occurred_at + 120s]; a dispatch may be aborted only strictly before entered_at_utc plus the abort window of 60s"
    error_id: ERR_ALARM_OUTSIDE_VERIFIED_WINDOW
    http_status: 422
    applies_to: "[POST /alarm-events/{id}/verify, POST /alarm-events/{id}/mark-false, POST /dispatch-requests/{id}/abort]"
  - priority: 5
    category: business_temporal
    check: "a scheduled visit or installation must not collide with another non-cancelled slot of the same resource under the resource's declared interval semantics; the half-open rule on the technician window and the buffer rule on the installer crew are the two interval semantics in play"
    error_id: ERR_SERVICE_WINDOW_OVERLAP
    http_status: 422
    applies_to: "[POST /service-visits/{id}/schedule, POST /installations, POST /installations/{id}/complete]"
  - priority: 5
    category: business_temporal
    check: "an assumption request may complete only when the incoming subscriber's residence is inside the relocation service radius"
    error_id: ERR_RESIDENCE_OUTSIDE_SERVICE_RADIUS
    http_status: 422
    applies_to: "[POST /assumption-requests/{id}/complete, POST /assumption-requests/{id}/reject]"
  - priority: 6
    category: business_safety
    check: "an ATTEMPT to create or submit a package for a dealer whose standing is SUSPENDED is refused before any package row is written"
    error_id: ERR_DEALER_PACKAGE_SUSPENDED
    http_status: 422
    applies_to: "[POST /dealer-packages, POST /dealer-packages/{id}/submit]"
  - priority: 6
    category: business_safety
    check: "the operator approving a rescission must differ from the operator recorded as the requestor"
    error_id: ERR_SEGREGATION_OF_DUTIES_REQUIRED
    http_status: 403
    applies_to: "[POST /rescission-requests/{id}/approve]"
  - priority: 6
    category: business_safety
    check: "a dispatch abort is blocked once the mass-cancel guard has tripped: the count of ABORTED or CLOSED dispatches for the account at or after the alarm's occurred_at is already 3 (mass_cancel_limit = 3)"
    error_id: ERR_MASS_CANCEL_BLOCKED
    http_status: 422
    applies_to: "[POST /dispatch-requests/{id}/abort]"
  - priority: 6
    category: business_safety
    check: "a retained ALERT-precedence rule: a contract under an open SERVICE_REQUIRED false-alarm reduction action may not be assumed to a new subscriber until the action is resolved"
    error_id: ERR_FALSE_ALARM_WATCH_ACTIVE
    http_status: 422
    applies_to: "[POST /assumption-requests/{id}/complete]"
  - priority: 7
    category: business_constraint
    check: "the package reference is unique within the dealer (natural key dealer_id + package_reference)"
    error_id: ERR_PACKAGE_REFERENCE_DUPLICATE
    http_status: 409
    applies_to: "[POST /dealer-packages]"
  - priority: 7
    category: business_constraint
    check: "the sweep month is unique; a sweep may run at most once per logical month"
    error_id: ERR_SWEEP_MONTH_DUPLICATE
    http_status: 409
    applies_to: "[POST /attrition-sweeps/run]"
  - priority: 7
    category: business_constraint
    check: "the customer email and the monitoring account number are each unique"
    error_id: ERR_NATURAL_KEY_DUPLICATE
    http_status: 409
    applies_to: "[POST /customers, POST /monitoring-transfers/{id}/trigger]"
  - priority: 7
    category: business_constraint
    check: "a package may fund in DECLINED posture only when the whole-package evaluation returned FUNDED for at least one child"
    error_id: ERR_NO_FUNDABLE_CONTRACT
    http_status: 422
    applies_to: "[POST /dealer-packages/{id}/fund]"
  - priority: 8
    category: business_referential
    check: "completing an assumption requires that the outgoing subscriber retains at least one contract whose status is in {ACTIVE, DELINQUENT}"
    error_id: ERR_ASSUMED_CONTRACT_MUST_HAVE_SURVIVING_CONTRACT
    http_status: 422
    applies_to: "[POST /assumption-requests/{id}/complete]"
  - priority: 8
    category: business_referential
    check: "an alarm event supplied to a dispatch must belong to the monitoring account named on the dispatch path"
    error_id: ERR_ALARM_NOT_FOR_ACCOUNT
    http_status: 422
    applies_to: "[POST /dispatch-requests]"
  - priority: 9
    category: business_fiscal
    check: "credit_score (or incoming_credit_score) must be at or above the contract quality floor of 620"
    error_id: ERR_CREDIT_SCORE_BELOW_FLOOR
    http_status: 422
    applies_to: "[POST /contracts, POST /dealer-packages/{id}/fund, POST /contracts/{id}/fund, POST /assumption-requests/{id}/accept, POST /assumption-requests/{id}/complete]"
  - priority: 9
    category: business_fiscal
    check: "contract_term_months must be at or above the contract quality floor of 36"
    error_id: ERR_TERM_BELOW_FLOOR
    http_status: 422
    applies_to: "[POST /dealer-packages/{id}/fund, POST /contracts/{id}/fund]"
  - priority: 9
    category: business_fiscal
    check: "the equipment configuration must be on the contract quality matrix for the origination channel: DIRECT permits {BASE, PREMIUM, ELITE} and DEALER permits {BASE, PREMIUM}"
    error_id: ERR_EQUIPMENT_CONFIG_NOT_PERMITTED
    http_status: 422
    applies_to: "[POST /dealer-packages/{id}/fund, POST /contracts/{id}/fund]"
  - priority: 9
    category: business_fiscal
    check: "the contract must have a PROVISIONED monitoring account, or an approved onsite-install install waiver"
    error_id: ERR_MONITORING_NOT_PROVISIONED
    http_status: 422
    applies_to: "[POST /dealer-packages/{id}/fund, POST /contracts/{id}/fund]"
  - priority: 9
    category: business_fiscal
    check: "an approve may proceed only when the dealer's standing is not SUSPENDED"
    error_id: ERR_DEALER_STANDING_SUSPENDED
    http_status: 422
    applies_to: "[POST /dealer-packages/{id}/approve]"
  - priority: 9
    category: business_fiscal
    check: "a package may be created or submitted only when the dealer's chargeback rate does not exceed the cap"
    error_id: ERR_DEALER_CHARGEBACK_RATE_EXCEEDED
    http_status: 422
    applies_to: "[POST /dealer-packages, POST /dealer-packages/{id}/submit]"
  - priority: 9
    category: business_fiscal
    check: "the dealer's holdback_rate must not exceed 0.50 (the package approval ceiling cap)"
    error_id: ERR_HOLDBACK_RATE_EXCEEDS_CEILING
    http_status: 422
    applies_to: "[POST /dealers]"
  - priority: 9
    category: business_fiscal
    check: "a chargeback never arises when the cancellation falls outside the chargeback window or the contract is chargeback_exempt"
    error_id: ERR_CHARGEBACK_WINDOW_CLOSED
    http_status: 409
    applies_to: "[POST /contracts/{id}/chargeback]"
  - priority: 9
    category: business_fiscal
    check: "a disclosure may issue only when its snapped amounts match the contract's current equipment_financed_cents and monthly_monitoring_cents"
    error_id: ERR_DISCLOSURE_AMOUNT_MISMATCH
    http_status: 409
    applies_to: "[POST /disclosures/{id}/issue]"
  - priority: 10
    category: state
    check: "the expected parent version supplied for an OCC-guarded write must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "[POST /dealer-packages/{id}/approve, POST /dealer-packages/{id}/fund, POST /contracts/{id}/fund]"
  - priority: 10
    category: business_constraint
    check: "the request body must satisfy the endpoint's declared type and range constraints, and every required field must be present"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a body"