              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_seat_std_id: $.data.id }
            - call: "POST /ancillary-products"
              payload: { sku: "PRIORITY_BOARDING", name: "Priority boarding", category: "BOARDING", list_price_cents: 1250, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4400", refundable: false, disclosable_fee: true, product_state: "ACTIVE" }
