            - "VendorDataRequest.${vr_id}.issued_at == 2026-08-01T00:00:00.000Z, due_at == 2026-09-15T00:00:00.000Z, regulatory_due_at == 2026-08-31T00:00:00.000Z"
            - "VendorDataRequest.${vr_id}.is_overdue == false, fulfillment_status == OPEN, escalation_status == NONE, validated_submission_count == 0"
            - "after issuance both scores are still 100.00 (strict > comparison; the clock has not passed either deadline) and outstanding_request_count == 1"
            - "PlanYear.${py_id}.compliance_posture == COMPLIANT (a COOPERATIVE vendor and no inventoried item)"

      - name: predominant_level_diverges_between_the_two_bases
        claim_type: Variant Divergence
        grounds:
          - calculations.qtl_predominant_level.variants
        excluded_because:
          difficulty_instance: "dual_variant_calc / qtl_predominant_level_plan_payments_versus_claims_count_diverge"
          rationale: "Both variants on identical rows, the single-level versus DESC-combination branch split and the resulting delta are asserted there."

      - name: cooperation_score_diverges_between_contract_and_regulatory_deadlines
        claim_type: Variant Divergence
        grounds:
          - calculations.administrator_cooperation_score.variants
        excluded_because:
          difficulty_instance: "dual_variant_calc / administrator_cooperation_contract_versus_regulatory_basis_diverge"
          rationale: "The 100.00 versus 70.00 divergence on one clock move, and the fact that only the contract variant drives cooperation_status, are asserted there."

      - name: stringency_index_evaluation_order_is_pinned
        claim_type: Correct Result
        grounds:
          - calculations.nqtl_stringency_in_operation_index.formula
        excluded_because:
          difficulty_instance: "combinatorial_formula / stringency_index_nested_min_max_with_asymmetry_multiplier"
          rationale: "The six-step pinned order, the capped credit and the clamp-last requirement (8.45 versus the forbidden 7.50 and 7.45) are asserted there."

      - name: completeness_tier_is_selected_from_the_base_alone
        claim_type: Constants Applied
        grounds:
          - calculations.regulator_response_completeness_score.formula
        excluded_because:
          difficulty_instance: "combinatorial_formula / regulator_completeness_tier_selected_from_base_before_credit"
          rationale: "The tier constants and the forbidden iterated re-derivation (81.00 versus 85.00) are asserted there."

      - name: substantially_all_and_disparity_ratio_precision
        claim_type: Precision
        grounds:
          - calculations.qtl_substantially_all_ratio.precision
          - calculations.denial_rate_disparity_index.precision
        excluded_because:
          difficulty_instance: "boundary_precision_check / substantially_all_ratio_exactly_two_thirds_versus_one_cent_below"
          rationale: "Rounding mode, decimal width and the cross-multiplication-versus-rounded-ratio trap are asserted there and in disparity_ratio_exactly_at_threshold_versus_one_ten_thousandth_below."

      - name: liability_ledger_reconciles_when_a_plan_is_undone
        claim_type: Reconciliation
        grounds:
          - calculations.remediation_liability_cents.formula
        excluded_because:
          difficulty_instance: "compensating_invariant / approve_then_abandon_returns_plan_year_liability_to_zero_with_no_drift"
          rationale: "The add-then-subtract reconciliation of the frozen amount, with zero drift, is asserted there."

  # ===========================================================================
  # 4. From Table 4 (Validations)
  # ===========================================================================
  - section: validations
    instances:
      - name: data_submission_with_denials_over_claims_or_an_unrequested_type_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_10_ERR_DENIALS_EXCEED_CLAIMS
          - validations.priority_11_ERR_SUBMISSION_TYPE_NOT_REQUESTED
          - entities.DataSubmission.fields.mh_denials
        distinguishing_aspect: "Two independent guards on the same endpoint: an arithmetic counter guard (422) and a scope guard tied to the owning request's requested_submission_types (422); neither creates a row."
        test_recipe:
          setup:
            - "One Administrator, one OPEN PlanYear, one classification."
            - "One vendor request for 2 items of type DENIAL_RATES only."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_id: $.data.id }
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "OUTPATIENT", network_tier: "IN_NETWORK", sub_classification: "OFFICE_VISITS", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_id: $.data.id }
            - call: "POST /parity/vendor-requests"
              payload: { administrator_id: "${adm_id}", plan_year_id: "${py_id}", requested_item_count: 2, requested_submission_types: ["DENIAL_RATES"] }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { vr_id: $.data.id }
          trigger:
            - call: "POST /parity/vendor-requests/${vr_id}/data-submissions"
              payload: { classification_id: "${cls_id}", submission_type: "DENIAL_RATES", mh_denials: 200, mh_adjudicated_claims: 100, ms_denials: 71, ms_adjudicated_claims: 1913 }
              as: Administrator
              as_user_id: "${adm_id}"
            - call: "POST /parity/vendor-requests/${vr_id}/data-submissions"
              payload: { classification_id: "${cls_id}", submission_type: "NETWORK_COMPOSITION", mh_in_network_provider_pct: 0.30, ms_in_network_provider_pct: 0.58 }
              as: Administrator
              as_user_id: "${adm_id}"
          assert:
            - "the first call -> 422 with data.error_id == ERR_DENIALS_EXCEED_CLAIMS"
            - "the second call -> 422 with data.error_id == ERR_SUBMISSION_TYPE_NOT_REQUESTED (the numbers were perfectly valid)"
            - "GET /parity/data-submissions?vendor_request_id=${vr_id} returns total_count == 0 — a refused submission is not stored as REJECTED"
            - "VendorDataRequest.${vr_id}.validated_submission_count == 0 and fulfillment_status == OPEN"
            - "Administrator.${adm_id}.cooperation_score == 100.00 (refused submissions do not affect cooperation)"

      - name: duplicate_nqtl_item_for_the_same_type_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_25_ERR_DUPLICATE_NQTL_ITEM
        distinguishing_aspect: "Uniqueness is scoped to (plan_year_id, classification_id, nqtl_type) over non-REMEDIATED rows: the same nqtl_type collides while a different nqtl_type on the same classification is accepted."
        test_recipe:
          setup:
            - "One Administrator, one OPEN PlanYear, one classification, one PRIOR_AUTHORIZATION NqtlItem."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_id: $.data.id }
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "OUTPATIENT", network_tier: "IN_NETWORK", sub_classification: "OFFICE_VISITS", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_id: $.data.id }
            - call: "POST /parity/nqtl-items"
              payload: { plan_year_id: "${py_id}", classification_id: "${cls_id}", nqtl_type: "PRIOR_AUTHORIZATION", applied_to: "BOTH", description: "Prior authorization for outpatient office visits." }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /parity/nqtl-items"
              payload: { plan_year_id: "${py_id}", classification_id: "${cls_id}", nqtl_type: "PRIOR_AUTHORIZATION", applied_to: "MENTAL_HEALTH_SUD_ONLY", description: "A second prior-authorization entry for the same classification." }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
            - call: "POST /parity/nqtl-items"
              payload: { plan_year_id: "${py_id}", classification_id: "${cls_id}", nqtl_type: "CONCURRENT_REVIEW", applied_to: "BOTH", description: "Concurrent review for outpatient office visits." }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { item_2_id: $.data.id }
          assert:
            - "the duplicate call -> 409 with data.error_id == ERR_DUPLICATE_NQTL_ITEM (applied_to differing does not make it a distinct item)"
            - "the CONCURRENT_REVIEW call -> 201 with NqtlItem.${item_2_id}.status == INVENTORIED"
            - "GET /parity/nqtl-items?classification_id=${cls_id} returns total_count == 2"
            - "PlanYear.${py_id}.compliance_posture == AT_RISK (two INVENTORIED items) and open_violation_count == 0"

      - name: author_reviewing_their_own_analysis_is_rejected_before_the_evidence_check
        claim_type: Priority Ordering
        grounds:
          - validations.priority_18_ERR_SELF_CERTIFICATION
          - validations.priority_20_ERR_IN_OPERATION_DATA_MISSING
          - complexity_profile.role_model.segregation_of_duties
        distinguishing_aspect: "Two business_safety rules are violated by one call; the segregation-of-duties rule at priority 18 answers first, and only after the reviewer changes does the missing-evidence rule at priority 20 surface."
        test_recipe:
          setup:
            - "One Administrator, one OPEN PlanYear, one classification, one NqtlItem."
            - "One SUBMITTED ComparativeAnalysis authored under X-User-ID user-officer-01 (the role header at creation was PlanSponsor; identity, not role, is what the rule compares)."
            - "No DataSubmission at all, so the in-operation evidence rule is also violated."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_id: $.data.id }
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "OUTPATIENT", network_tier: "IN_NETWORK", sub_classification: "OFFICE_VISITS", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_id: $.data.id }
            - call: "POST /parity/nqtl-items"
              payload: { plan_year_id: "${py_id}", classification_id: "${cls_id}", nqtl_type: "MEDICAL_NECESSITY_CRITERIA", applied_to: "BOTH", description: "Medical necessity criteria for outpatient office visits." }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { item_id: $.data.id, item_v: $.data.version }
            - call: "POST /parity/comparative-analyses"
              payload: { nqtl_item_id: "${item_id}", factor_count: 3, evidentiary_standard_count: 2, stringency_written_finding: "COMPARABLE", stringency_operation_finding: "COMPARABLE", expected_nqtl_item_version: "${item_v}" }
              as: PlanSponsor
              as_user_id: "user-officer-01"
              captures: { ca_id: $.data.id }
            - call: "POST /parity/comparative-analyses/${ca_id}/submit"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-officer-01"
          trigger:
            - call: "POST /parity/comparative-analyses/${ca_id}/review"
              payload: { outcome: "CERTIFIED", review_note: "Reviewing the analysis I wrote myself." }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
            - call: "POST /parity/comparative-analyses/${ca_id}/review"
              payload: { outcome: "CERTIFIED", review_note: "Independent review, but no as-applied data is on file." }
              as: ComplianceOfficer
              as_user_id: "user-officer-02"
          assert:
            - "the first review -> 409 with data.error_id == ERR_SELF_CERTIFICATION, not ERR_IN_OPERATION_DATA_MISSING"
            - "the second review -> 409 with data.error_id == ERR_IN_OPERATION_DATA_MISSING, proving the evidence rule was violated all along"
            - "ComparativeAnalysis.${ca_id}.status is still SUBMITTED and certified_by_user_id == null"
            - "ComparativeAnalysis.${ca_id}.authored_by_user_id == user-officer-01 and revision_round == 0"
            - "NqtlItem.${item_id}.status == ANALYSIS_SUBMITTED"

      - name: submitting_an_analysis_below_the_minimum_documentation_rejected
        claim_type: Satisfaction → Pass
        grounds:
          - validations.priority_21_ERR_INSUFFICIENT_COMPARATIVE_ANALYSIS
          - state_machines.ComparativeAnalysis.DRAFT_to_SUBMITTED
        distinguishing_aspect: "The MIN_FACTORS / MIN_EVIDENTIARY_STANDARDS floor is enforced at submit and not at create: a one-factor analysis is created happily, refused at submit, and the same analysis cannot be patched because there is no update endpoint — a second analysis at the floor submits cleanly."
