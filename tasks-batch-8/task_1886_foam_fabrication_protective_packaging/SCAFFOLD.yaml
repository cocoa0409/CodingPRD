# =============================================================================
# Task 1886 — Foam Fabrication & Protective Packaging (foam converter)
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  1886. Foam Fabrication & Protective Packaging (foam converter): material
  selection & density/ILD spec, CAD cut program & yield nesting, tooling for
  die-cut vs CNC route, drop-test validation & spec sign-off, kit assembly &
  customer branding, offcut/scrap recycling, small-run vs volume pricing,
  inventory program with release orders

domain_name: foam-fabrication-protective-packaging
api_prefix: /api

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - version_pinning_on_approval
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer company name" }
      - { name: account_tier, type: enum, source: input, description: "STANDARD | CONTRACT" }
      - { name: branding_required, type: boolean, source: input, description: "Whether kits ship with customer branding applied", default: false }
      - { name: credit_balance_cents, type: integer, source: computed, description: "Accumulated scrap-recycling credits; starts at 0, incremented by ScrapBatch credit transition" }

  - name: Material
    parent: null
    common_fields: true
    fields:
      - { name: foam_family, type: enum, source: input, description: "PE | EPE | PU | XLPE" }
      - { name: density_pcf, type: number, source: input, description: "Foam density in pounds per cubic foot" }
      - { name: ild_lb_25, type: integer, source: input, description: "Indentation Load Deflection at 25% compression, in lb" }
      - { name: sheet_length_in, type: number, source: input, description: "Stock sheet length in inches" }
      - { name: sheet_width_in, type: number, source: input, description: "Stock sheet width in inches" }
      - { name: sheet_thickness_in, type: number, source: input, description: "Stock sheet thickness in inches" }
      - { name: cost_per_board_ft_cents, type: integer, source: input, description: "Material cost per board foot in cents" }
      - { name: recyclable, type: boolean, source: input, description: "Whether offcuts of this material are accepted for recycling credit" }
      - { name: scrap_credit_per_lb_cents, type: integer, source: input, description: "Base recycling credit rate per net recyclable lb, in cents" }

  - name: PackageSpec
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owning customer" }
      - { name: material_id, type: string, source: input, description: "FK -> Material.id; selected foam material" }
      - { name: part_name, type: string, source: input, description: "Human-readable part name" }
      - { name: part_length_in, type: number, source: input, description: "Part footprint length in inches" }
      - { name: part_width_in, type: number, source: input, description: "Part footprint width in inches" }
      - { name: product_weight_lb, type: number, source: input, description: "Weight of the product being protected" }
      - { name: required_drop_height_in, type: integer, source: input, description: "Drop-test height the packaging must survive" }
      - { name: max_fragility_g, type: integer, source: input, description: "Maximum peak g-force the product tolerates; copied onto DropTest.pass_limit_g at schedule time" }
      - { name: required_ild_lb, type: integer, source: computed, description: "Minimum acceptable material ILD, from cushion_ild_calc; recomputed on create and on PATCH of weight/drop-height" }
      - { name: revision_no, type: integer, source: system, description: "Starts at 1; incremented by return-for-revision" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | IN_VALIDATION | VALIDATED | APPROVED" }
      - { name: signed_off_at, type: datetime, source: system, description: "Timestamp of customer approval; null until APPROVED" }

  - name: CutProgram
    parent: null
    common_fields: true
    fields:
      - { name: package_spec_id, type: string, source: input, description: "FK -> PackageSpec.id; spec this program cuts" }
      - { name: method, type: enum, source: input, description: "DIE_CUT | CNC_ROUTE" }
      - { name: machine_seconds_per_part, type: integer, source: input, description: "CNC cutting time per part; required when method == CNC_ROUTE, ignored for DIE_CUT" }
      - { name: supersedes_cut_program_id, type: string, source: input, description: "FK -> CutProgram.id; optional — when present, the referenced LOCKED program is transitioned to OBSOLETE on create", default: null }
      - { name: parts_per_sheet, type: integer, source: computed, description: "Yield from nesting_yield_calc; null until NESTED" }
      - { name: sheet_utilization_pct, type: number, source: computed, description: "Percent of sheet area converted to parts; null until NESTED" }
      - { name: offcut_sqft_per_sheet, type: number, source: computed, description: "Recoverable offcut area per sheet in sq ft; null until NESTED" }
      - { name: status, type: enum, source: system, description: "DRAFT | NESTED | LOCKED | OBSOLETE" }

  - name: Tooling
    parent: null
    common_fields: true
    fields:
      - { name: cut_program_id, type: string, source: input, description: "FK -> CutProgram.id; die built for this program (program method must be DIE_CUT)" }
      - { name: die_cost_cents, type: integer, source: input, description: "Total die cost in cents" }
      - { name: amortization_qty, type: integer, source: input, description: "Part quantity over which the die cost is amortized" }
      - { name: lead_time_days, type: integer, source: input, description: "Expected die build lead time" }
      - { name: amortized_cents, type: integer, source: computed, description: "Cents of die cost charged to confirmed production orders so far; starts at 0" }
      - { name: status, type: enum, source: system, description: "ORDERED | IN_SERVICE | RETIRED" }

  - name: DropTest
    parent: null
    common_fields: true
    fields:
      - { name: package_spec_id, type: string, source: input, description: "FK -> PackageSpec.id; spec under validation (must be IN_VALIDATION)" }
      - { name: scheduled_start, type: datetime, source: input, description: "Lab booking window start (inclusive)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Lab booking window end (inclusive)" }
      - { name: drop_height_in, type: integer, source: input, description: "Drop height for this test" }
      - { name: orientation, type: enum, source: input, description: "FLAT | EDGE | CORNER" }
      - { name: pass_limit_g, type: integer, source: system, description: "Pinned from PackageSpec.max_fragility_g at schedule time; later spec edits do not alter it" }
      - { name: spec_revision_no, type: integer, source: system, description: "Pinned from PackageSpec.revision_no at schedule time; auto-validation only considers tests pinned to the spec's current revision" }
      - { name: measured_peak_g, type: integer, source: input, description: "Measured peak deceleration; null until recorded" }
      - { name: result, type: enum, source: computed, description: "PASS | FAIL computed at record time (measured_peak_g <= pass_limit_g -> PASS); null until recorded" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | RECORDED" }

  - name: ProductionOrder
    parent: null
    common_fields: true
    fields:
      - { name: package_spec_id, type: string, source: input, description: "FK -> PackageSpec.id" }
      - { name: cut_program_id, type: string, source: input, description: "FK -> CutProgram.id; program must be NESTED or LOCKED at create, LOCKED at confirm" }
      - { name: inventory_program_id, type: string, source: input, description: "FK -> InventoryProgram.id; set only for REPLENISHMENT orders (via replenish/auto-reorder), null for CUSTOMER orders", default: null }
      - { name: order_kind, type: enum, source: system, description: "CUSTOMER (explicit create) | REPLENISHMENT (inventory program inflow)" }
      - { name: qty, type: integer, source: input, description: "Part quantity to produce" }
      - { name: provisional_unit_price_cents, type: integer, source: computed, description: "Quote-time unit price using PROVISIONAL_YIELD_PCT assumed yield" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "Quote-time order total (unit*qty + setup fee)" }
      - { name: final_unit_price_cents, type: integer, source: computed, description: "Confirmed unit price using the locked program's actual parts_per_sheet; null until confirm" }
      - { name: final_total_cents, type: integer, source: computed, description: "Confirmed order total; null until confirm" }
      - { name: tooling_amort_cents, type: integer, source: computed, description: "Die amortization charged to this order at confirm (DIE_CUT only; 0 otherwise)" }
      - { name: machine_id, type: string, source: input, description: "Machine resource booked at confirm", default: null }
      - { name: window_start, type: datetime, source: input, description: "Machine window start (half-open, inclusive)", default: null }
      - { name: window_end, type: datetime, source: input, description: "Machine window end (half-open, exclusive)", default: null }
      - { name: fab_status, type: enum, source: system, description: "QUOTED | CONFIRMED | IN_PROGRESS | COMPLETED | CANCELLED" }
      - { name: quality_hold, type: enum, source: system, description: "NONE | ON_HOLD; independent parallel state dimension" }

  - name: InventoryProgram
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; must equal the spec's customer_id" }
      - { name: package_spec_id, type: string, source: input, description: "FK -> PackageSpec.id; spec must be APPROVED" }
      - { name: pricing_mode, type: enum, source: input, description: "LOCKED (release pricing uses material cost pinned at activation) | CURRENT (repriced at allocate)" }
      - { name: max_stock_qty, type: integer, source: input, description: "Maximum on-hand stock the converter holds" }
      - { name: reorder_point_qty, type: integer, source: input, description: "When on_hand falls strictly below this after a ship, auto-replenishment triggers" }
      - { name: min_release_qty, type: integer, source: input, description: "Minimum qty per release order" }
      - { name: locked_material_cost_bf_cents, type: integer, source: system, description: "Material cost_per_board_ft_cents pinned at activate when pricing_mode == LOCKED; null otherwise" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ACTIVE | SUSPENDED | CLOSED" }
      - { name: produced_qty, type: integer, source: computed, description: "Total qty completed into this program by REPLENISHMENT orders" }
      - { name: on_hand_qty, type: integer, source: computed, description: "Physical stock on hand (includes reserved)" }
      - { name: reserved_qty, type: integer, source: computed, description: "Stock reserved by ALLOCATED release orders" }
      - { name: shipped_qty, type: integer, source: computed, description: "Total qty shipped" }

  - name: ReleaseOrder
    parent: null
    common_fields: true
    fields:
      - { name: inventory_program_id, type: string, source: input, description: "FK -> InventoryProgram.id" }
      - { name: qty, type: integer, source: input, description: "Quantity to release" }
      - { name: requested_ship_date, type: datetime, source: input, description: "Customer-requested ship date" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Per-unit release price from release_pricing_calc; null until allocate" }
      - { name: total_price_cents, type: integer, source: computed, description: "unit_price_cents * qty; null until allocate" }
      - { name: status, type: enum, source: system, description: "PENDING | ALLOCATED | SHIPPED | CANCELLED" }

  - name: ScrapBatch
    parent: null
    common_fields: true
    fields:
      - { name: production_order_id, type: string, source: input, description: "FK -> ProductionOrder.id; order must be COMPLETED" }
      - { name: gross_weight_lb, type: number, source: input, description: "Gross offcut weight collected" }
      - { name: contamination_pct, type: number, source: input, description: "Percent of gross weight that is non-recyclable contamination (0-100)" }
      - { name: net_recyclable_lb, type: number, source: computed, description: "round_half_up(gross_weight_lb * (1 - contamination_pct/100), 2)" }
      - { name: credit_cents, type: integer, source: computed, description: "Recycling credit from scrap_credit_calc; null until credited" }
      - { name: credited_at, type: datetime, source: system, description: "Logical-clock timestamp of credit; null until CREDITED" }
      - { name: status, type: enum, source: system, description: "COLLECTED | PROCESSED | CREDITED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PackageSpec
    initial_state: DRAFT
    terminal_states: [APPROVED]
    note: "Cyclic revision loop: IN_VALIDATION/VALIDATED can return to DRAFT with revision_no increment. APPROVED is terminal for the spec lifecycle; manufacturing artifacts keyed to it may still be superseded."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/package-specs/{id}/submit"
        actor: SalesEngineer
        preconditions:
          - "material.ild_lb_25 >= required_ild_lb (ERR_ILD_SAFETY_MARGIN)"
        side_effects: []
      - from: SUBMITTED
        to: IN_VALIDATION
        trigger: "POST /api/package-specs/{id}/begin-validation"
        actor: QualityEngineer
        preconditions: []
        side_effects: []
      - from: IN_VALIDATION
        to: VALIDATED
        trigger: "system (auto-transition when a DropTest is recorded with result == PASS and no RECORDED DropTest pinned to the spec's CURRENT revision_no has result == FAIL)"
        actor: system
        preconditions:
          - "Recorded PASS exists at the current revision; zero recorded FAILs among DropTests with spec_revision_no == spec.revision_no"
        side_effects: []
      - from: [IN_VALIDATION, VALIDATED]
        to: DRAFT
        trigger: "POST /api/package-specs/{id}/return-for-revision"
        actor: QualityEngineer
        preconditions: []
        side_effects:
          - "revision_no += 1"
          - "Cascade link 1: every linked CutProgram with status IN {DRAFT, NESTED, LOCKED} -> OBSOLETE"
          - "Cascade link 2 (caused by each program's obsolescence): every ProductionOrder referencing an obsoleted program with fab_status IN {QUOTED, CONFIRMED} -> CANCELLED"
          - "Cascade link 3 (caused by each CONFIRMED order's cancellation): that order's Tooling.amortized_cents -= order.tooling_amort_cents; machine window freed"
      - from: VALIDATED
        to: APPROVED
        trigger: "POST /api/package-specs/{id}/approve"
        actor: Customer
        preconditions:
          - "Acting Customer.id == spec.customer_id (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "signed_off_at = current logical clock"

  - entity: CutProgram
    initial_state: DRAFT
    terminal_states: [OBSOLETE]
    transitions:
      - from: DRAFT
        to: NESTED
        trigger: "POST /api/cut-programs/{id}/nest"
        actor: DesignEngineer
        preconditions:
          - "package_spec.status IN {SUBMITTED, IN_VALIDATION, VALIDATED, APPROVED} (ERR_INVALID_STATE)"
        side_effects:
          - "Runs nesting_yield_calc: sets parts_per_sheet, sheet_utilization_pct, offcut_sqft_per_sheet"
      - from: NESTED
        to: LOCKED
        trigger: "POST /api/cut-programs/{id}/lock"
        actor: DesignEngineer
        preconditions:
          - "material.ild_lb_25 >= spec.required_ild_lb, re-checked at lock time (ERR_ILD_SAFETY_MARGIN)"
          - "parts_per_sheet > 0 (ERR_UTILIZATION_INFEASIBLE)"
          - "If method == DIE_CUT: a Tooling with cut_program_id == this program exists (ERR_TOOLING_REQUIRED) and has status IN_SERVICE (ERR_TOOLING_NOT_IN_SERVICE)"
        side_effects:
          - "Increments package_spec.version by 1 (locked program becomes the spec's active manufacturing definition)"
      - from: LOCKED
        to: OBSOLETE
        trigger: "system (a new CutProgram created with supersedes_cut_program_id == this program, or the owning spec returns for revision)"
        actor: system
        preconditions: []
        side_effects:
          - "ProductionOrders referencing this program with fab_status IN {QUOTED, CONFIRMED} -> CANCELLED (with compensation side effects)"
      - from: [DRAFT, NESTED]
        to: OBSOLETE
        trigger: "system (owning spec returns for revision)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Tooling
    initial_state: ORDERED
    terminal_states: [RETIRED]
    transitions:
      - from: ORDERED
        to: IN_SERVICE
        trigger: "POST /api/toolings/{id}/commission"
        actor: DesignEngineer
        preconditions: []
        side_effects: []
      - from: [ORDERED, IN_SERVICE]
        to: RETIRED
        trigger: "POST /api/toolings/{id}/retire"
        actor: DesignEngineer
        preconditions: []
        side_effects:
          - "CutProgram.lock no longer satisfiable for the linked program while no other IN_SERVICE tooling exists"

  - entity: DropTest
    initial_state: SCHEDULED
    terminal_states: [RECORDED]
    transitions:
      - from: SCHEDULED
        to: RECORDED
        trigger: "POST /api/drop-tests/{id}/record"
        actor: QualityEngineer
        preconditions: []
        side_effects:
          - "result = PASS if measured_peak_g <= pass_limit_g else FAIL"
          - "If result == PASS and spec IN_VALIDATION and no recorded FAIL exists on the spec: spec -> VALIDATED (auto)"

  - entity: ProductionOrder
    initial_state: QUOTED
    terminal_states: [COMPLETED, CANCELLED]
    note: "Parallel state dimensions: fab_status (QUOTED->CONFIRMED->IN_PROGRESS->COMPLETED, or CANCELLED) and quality_hold (NONE<->ON_HOLD) evolve independently on the same row."
    transitions:
      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /api/production-orders/{id}/confirm"
        actor: SalesEngineer
        preconditions:
          - "package_spec.status == APPROVED (ERR_SPEC_NOT_APPROVED)"
          - "cut_program.status == LOCKED (ERR_INVALID_STATE)"
          - "If program.method == DIE_CUT: linked Tooling status == IN_SERVICE (ERR_TOOLING_NOT_IN_SERVICE)"
          - "Machine window [window_start, window_end) on machine_id does not overlap any non-CANCELLED order's window on the same machine (half-open: adjacency allowed) (ERR_MACHINE_WINDOW_CONFLICT)"
        side_effects:
          - "Recomputes pricing with final variant (locked program's parts_per_sheet): sets final_unit_price_cents, final_total_cents"
          - "DIE_CUT: tooling_amort_cents = min(remaining_unamortized, amort_per_part * min(qty, amortization_qty)) where amort_per_part is the component priced at confirm (ceil(remaining_unamortized / amortization_qty)); Tooling.amortized_cents += tooling_amort_cents"
          - "Books machine window on machine_id"
      - from: CONFIRMED
        to: IN_PROGRESS
        trigger: "POST /api/production-orders/{id}/start"
        actor: PlantManager
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /api/production-orders/{id}/complete"
        actor: PlantManager
        preconditions:
          - "quality_hold == NONE (ERR_INVALID_STATE)"
        side_effects:
          - "If order_kind == REPLENISHMENT: InventoryProgram.produced_qty += qty; InventoryProgram.on_hand_qty += qty"
      - from: [QUOTED, CONFIRMED]
        to: CANCELLED
        trigger: "POST /api/production-orders/{id}/cancel or system (linked cut program obsoleted)"
        actor: "SalesEngineer or system"
        preconditions: []
        side_effects:
          - "If was CONFIRMED and DIE_CUT: Tooling.amortized_cents -= tooling_amort_cents (compensation)"
          - "If was CONFIRMED: machine window freed"
      - from: NONE
        to: ON_HOLD
        trigger: "POST /api/production-orders/{id}/hold (quality_hold dimension; fab_status must be CONFIRMED or IN_PROGRESS)"
        actor: QualityEngineer
        preconditions: []
        side_effects:
          - "Blocks complete while ON_HOLD"
      - from: ON_HOLD
        to: NONE
        trigger: "POST /api/production-orders/{id}/release-hold (quality_hold dimension)"
        actor: QualityEngineer
        preconditions: []
        side_effects: []

  - entity: InventoryProgram
    initial_state: PROPOSED
    terminal_states: [CLOSED]
    note: "Cyclic: ACTIVE <-> SUSPENDED via suspend/resume."
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /api/inventory-programs/{id}/activate"
        actor: SalesEngineer
        preconditions: []
        side_effects:
          - "If pricing_mode == LOCKED: locked_material_cost_bf_cents = material.cost_per_board_ft_cents at activation (version pinning)"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/inventory-programs/{id}/suspend"
        actor: SalesEngineer
        preconditions: []
        side_effects:
          - "Cascade link 1: every ReleaseOrder with status IN {PENDING, ALLOCATED} -> CANCELLED"
          - "Cascade link 2 (caused by each ALLOCATED release's cancellation): reserved_qty -= that release's qty"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/inventory-programs/{id}/resume"
        actor: SalesEngineer
        preconditions: []
        side_effects: []
      - from: [PROPOSED, ACTIVE, SUSPENDED]
        to: CLOSED
        trigger: "POST /api/inventory-programs/{id}/close"
        actor: SalesEngineer
        preconditions:
          - "No ReleaseOrder with status IN {PENDING, ALLOCATED} (ERR_PROGRAM_HAS_OPEN_RELEASES)"
        side_effects: []

  - entity: ReleaseOrder
    initial_state: PENDING
    terminal_states: [SHIPPED, CANCELLED]
    note: "Branching with a deallocate loop: ALLOCATED -> PENDING is allowed."
    transitions:
      - from: PENDING
        to: ALLOCATED
        trigger: "POST /api/release-orders/{id}/allocate"
        actor: PlantManager
        preconditions:
          - "inventory_program.status == ACTIVE (ERR_PROGRAM_NOT_ACTIVE)"
          - "qty <= on_hand_qty - reserved_qty (equality allowed; ERR_INSUFFICIENT_STOCK)"
        side_effects:
          - "Runs release_pricing_calc: sets unit_price_cents and total_price_cents per program.pricing_mode variant"
          - "InventoryProgram.reserved_qty += qty"
      - from: ALLOCATED
        to: PENDING
        trigger: "POST /api/release-orders/{id}/deallocate"
        actor: PlantManager
        preconditions: []
        side_effects:
          - "InventoryProgram.reserved_qty -= qty"
          - "unit_price_cents and total_price_cents reset to null (repriced on next allocate)"
      - from: ALLOCATED
        to: SHIPPED
        trigger: "POST /api/release-orders/{id}/ship"
        actor: PlantManager
        preconditions:
          - "inventory_program.status == ACTIVE (ERR_PROGRAM_NOT_ACTIVE)"
        side_effects:
          - "InventoryProgram.on_hand_qty -= qty; reserved_qty -= qty; shipped_qty += qty"
          - "Cascade link 1: the on_hand_qty mutation runs replenishment_calc"
          - "Cascade link 2 (caused by on_hand_qty falling strictly below reorder_point_qty): auto-create a REPLENISHMENT ProductionOrder (fab_status QUOTED) with qty = max_stock_qty - on_hand_qty - pipeline_qty, if that value > 0"
      - from: [PENDING, ALLOCATED]
        to: CANCELLED
        trigger: "POST /api/release-orders/{id}/cancel or system (program suspended)"
        actor: "Customer (own) or PlantManager or system"
        preconditions: []
        side_effects:
          - "If was ALLOCATED: InventoryProgram.reserved_qty -= qty (compensation)"

  - entity: ScrapBatch
    initial_state: COLLECTED
    terminal_states: [CREDITED]
    transitions:
      - from: COLLECTED
        to: PROCESSED
        trigger: "POST /api/scrap-batches/{id}/process"
        actor: PlantManager
        preconditions: []
        side_effects: []
      - from: PROCESSED
        to: CREDITED
        trigger: "POST /api/scrap-batches/{id}/credit"
        actor: PlantManager
        preconditions: []
        side_effects:
          - "Runs scrap_credit_calc: sets credit_cents, credited_at = current logical clock"
          - "Customer.credit_balance_cents += credit_cents (customer of the production order's spec)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: cut-program-create-stale-spec
    parent_entity: PackageSpec
    write_endpoint: "POST /api/cut-programs"
    occ_field: expected_package_spec_version
    description: |
      Creating a CutProgram against a PackageSpec whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just locked a cut program (which advances the
      spec version per the lock side effect) or otherwise mutated the spec,
      so the current writer's view of the spec is stale. Stated in OCC terms:
      the request is rejected if expected_package_spec_version != the spec's
      current version.
    error_id: ERR_STALE_SPEC_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: cushion_ild_calc
    trigger: "PackageSpec create; PackageSpec PATCH when product_weight_lb or required_drop_height_in changes"
    algorithm: threshold
    formula: |
      band = LOW if required_drop_height_in < 24
             MEDIUM if 24 <= required_drop_height_in < 48
             HIGH if required_drop_height_in >= 48
      required_ild_lb = ceil(product_weight_lb * BAND_FACTOR[band])
      Band lower edges are inclusive: drop_height exactly 24 -> MEDIUM, exactly 48 -> HIGH.
    input_set: "The PackageSpec being created or updated"
    constants:
      LOW_FACTOR: 8
      MEDIUM_FACTOR: 10
      HIGH_FACTOR: 12
    precision: "integer, ceil"

  - name: nesting_yield_calc
    trigger: "POST /api/cut-programs/{id}/nest"
    algorithm: constraint_propagation
    formula: |
      KERF = 0.25 (inches)
      part_area = part_length_in * part_width_in
      sheet_area = sheet_length_in * sheet_width_in
      For each orientation (pl, pw) in {(part_length_in, part_width_in), (part_width_in, part_length_in)}:
        cols = floor((sheet_length_in + KERF) / (pl + KERF))
        rows = floor((sheet_width_in + KERF) / (pw + KERF))
        parts_orientation = cols * rows
      parts_per_sheet = max(parts_orientation over both orientations)
      kerf_waste_sqin = parts_per_sheet * KERF * (part_length_in + part_width_in)
      sheet_utilization_pct = round_half_up(100 * parts_per_sheet * part_area / sheet_area, 2)
      offcut_sqft_per_sheet = round_half_up((sheet_area - parts_per_sheet * part_area - kerf_waste_sqin) / 144, 2)
      parts_per_sheet == 0 is computable at nest but blocks lock (ERR_UTILIZATION_INFEASIBLE).
    input_set: "The CutProgram's spec (part dims) and the spec's material (sheet dims)"
    constants:
      KERF_IN: 0.25
    precision: "percent and sqft at 2 decimal places, round_half_up"

  - name: quote_pricing_calc
    trigger: "ProductionOrder create (provisional variant); ProductionOrder confirm (final variant)"
    algorithm: tiered_pricing
    formula: |
      sheet_bf = round_half_up(sheet_length_in * sheet_width_in * sheet_thickness_in / 144, 2)
      effective_parts_per_sheet:
        provisional -> floor(theoretical_best_nesting * PROVISIONAL_YIELD_PCT)
                       where theoretical_best_nesting = nesting_yield_calc parts_per_sheet
                       evaluated from spec part dims + material sheet dims
        final -> the referenced LOCKED CutProgram.parts_per_sheet
      sheets_needed = ceil(qty / effective_parts_per_sheet)
      material_per_part = sheets_needed * sheet_bf * cost_per_board_ft_cents / qty   (full precision, no intermediate rounding)
      cutting_per_part: DIE_CUT -> DIE_CUT_PART_COST_CENTS
                        CNC_ROUTE -> machine_seconds_per_part * MACHINE_RATE_CENTS_PER_SEC
      amort_per_part: DIE_CUT -> ceil(remaining_unamortized_cents / amortization_qty)
                                 where remaining_unamortized_cents = die_cost_cents - Tooling.amortized_cents (evaluated at pricing time)
                      CNC_ROUTE -> 0
      tier_mult: qty <= 99 -> SMALL_RUN_MULT; 100 <= qty <= 999 -> MID_RUN_MULT; qty >= 1000 -> VOLUME_MULT
      unit_raw = (material_per_part + cutting_per_part + amort_per_part) * tier_mult
    input_set: "The ProductionOrder, its CutProgram, the spec's material, and (DIE_CUT) the linked Tooling"
    constants:
      PROVISIONAL_YIELD_PCT: 0.70
      DIE_CUT_PART_COST_CENTS: 25
      MACHINE_RATE_CENTS_PER_SEC: 3
      SMALL_RUN_MULT: 1.35
      MID_RUN_MULT: 1.15
      VOLUME_MULT: 1.00
      SETUP_FEE_DIE_CENTS: 5000
      SETUP_FEE_CNC_CENTS: 15000
    precision: "see order_total_rounding for the pinned rounding order"
    variants:
      - name: provisional
        when: "Order in QUOTED (create time)"
        difference: "Uses assumed yield floor(theoretical_best_nesting * 0.70) instead of the locked program's actual parts_per_sheet; produces different unit/total for identical qty and material"
      - name: final
        when: "Order confirm"
        difference: "Uses the locked CutProgram's actual parts_per_sheet and the tooling's current remaining_unamortized_cents"

  - name: order_total_rounding
    trigger: "ProductionOrder create (provisional) and confirm (final); ReleaseOrder allocate"
    algorithm: aggregation
    formula: |
      PINNED ORDER (rounding order is normative and pinned):
        1. unit_price_cents = round_half_up(unit_raw, 0)        # round the unit to integer cents FIRST
        2. order_total_cents = unit_price_cents * qty           # then multiply by qty
        3. ProductionOrder only: total += setup_fee             # setup fee added AFTER, never tier-multiplied
      The rejected alternative (sum raw amounts then round once) yields different cents
      and MUST NOT be used.
    input_set: "unit_raw from quote_pricing_calc or release_pricing_calc; qty; setup fee constant"
    constants: {}
    precision: "integer cents, round_half_up at step 1 only"

  - name: release_pricing_calc
    trigger: "POST /api/release-orders/{id}/allocate"
    algorithm: tiered_pricing
    formula: |
      Selected program: the CutProgram with package_spec_id == program.package_spec_id and
      status == LOCKED, ranked by updated_at DESC, tie-break created_at ASC (never id).
      sheet_bf and sheets_needed as in quote_pricing_calc using the selected program's parts_per_sheet.
      effective_cost_per_bf:
        LOCKED variant  -> InventoryProgram.locked_material_cost_bf_cents (pinned at activation)
        CURRENT variant -> Material.cost_per_board_ft_cents at allocate time
      material_per_part = sheets_needed * sheet_bf * effective_cost_per_bf / qty   (full precision)
      cutting_per_part as in quote_pricing_calc (no amortization component on releases)
      unit_raw = (material_per_part + cutting_per_part) * tier_mult   (same tier constants as quote_pricing_calc)
      unit_price_cents and total_price_cents per order_total_rounding (no setup fee).
    input_set: "The ReleaseOrder, its InventoryProgram, the selected locked CutProgram, the material"
    constants: {}
    precision: "integer cents via order_total_rounding"
    variants:
      - name: locked
        when: "program.pricing_mode == LOCKED"
        difference: "Material cost pinned at activation; a later material cost change does not move the release price"
      - name: current
        when: "program.pricing_mode == CURRENT"
        difference: "Material cost re-read at allocate time; identical release priced differently after a material cost change"

  - name: replenishment_calc
    trigger: "ReleaseOrder ship (after on_hand_qty mutation); manual POST /api/inventory-programs/{id}/replenish uses caller-supplied qty"
    algorithm: aggregation
    formula: |
      After a ship: if on_hand_qty (post-ship) < reorder_point_qty (strictly; equality does NOT trigger):
        pipeline_qty = sum(qty of ProductionOrders with inventory_program_id == this program
                           and fab_status IN {QUOTED, CONFIRMED, IN_PROGRESS})
        suggested_qty = max_stock_qty - on_hand_qty - pipeline_qty
        If suggested_qty > 0: auto-create ProductionOrder(order_kind=REPLENISHMENT, qty=suggested_qty,
          fab_status=QUOTED, cut_program = selector from release_pricing_calc, package_spec_id = program's spec).
      Equality (on_hand == reorder_point) creates no order.
    input_set: "The InventoryProgram and its non-terminal REPLENISHMENT ProductionOrders"
    constants: {}
    precision: "integer units"

  - name: scrap_credit_calc
    trigger: "POST /api/scrap-batches/{id}/credit"
    algorithm: threshold
    formula: |
      net_recyclable_lb = round_half_up(gross_weight_lb * (1 - contamination_pct / 100), 2)
      cumulative_before_lb = sum(net_recyclable_lb of ScrapBatches with status == CREDITED whose
        credited_at falls in the same UTC calendar month as the current logical clock).
        Credits are processed sequentially: each batch's tier is evaluated against the
        cumulative of batches already CREDITED strictly before this credit request runs
        (request processing order; never id-ordered).
      effective_rate = scrap_credit_per_lb_cents * SCRAP_BONUS_MULT if cumulative_before_lb >= SCRAP_BONUS_THRESHOLD_LB
                       else scrap_credit_per_lb_cents
      Boundary: cumulative_before exactly 500 lb earns the bonus (>=).
      credit_cents = round_half_up(net_recyclable_lb * effective_rate, 0)
    input_set: "The ScrapBatch, the order's material rate, and this month's CREDITED batches"
    constants:
      SCRAP_BONUS_THRESHOLD_LB: 500
      SCRAP_BONUS_MULT: 1.25
    precision: "weight 2 dp round_half_up; credit integer cents round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is permitted on this endpoint per §1.5 roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Customer role may act only on its own resources (spec.customer_id / program.customer_id / release's program.customer_id == X-User-ID)"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "POST /api/package-specs/{id}/approve, POST /api/release-orders, POST /api/release-orders/{id}/cancel, Customer-role GETs"
  - priority: 4
    category: existence
    check: "Request body well-formed: required fields present, enum values valid, numeric ranges sane (qty > 0, contamination_pct in [0,100])"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 5
    category: existence
    check: "Path ids exist, then body FK ids exist, validated left-to-right; program.customer_id must equal spec.customer_id on program create"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 6
    category: state
    check: "OCC: expected_package_spec_version == current PackageSpec.version"
    error_id: ERR_STALE_SPEC_VERSION
    http_status: 412
    applies_to: "POST /api/cut-programs"
  - priority: 7
    category: state
    check: "Target resource in a valid from-state for the requested transition; cross-entity state preconditions (spec APPROVED, program ACTIVE, tooling IN_SERVICE, program LOCKED)"
    error_id: "ERR_INVALID_STATE | ERR_SPEC_NOT_APPROVED | ERR_PROGRAM_NOT_ACTIVE | ERR_TOOLING_NOT_IN_SERVICE | ERR_PROGRAM_HAS_OPEN_RELEASES"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 8
    category: business_safety
    check: "material.ild_lb_25 >= spec.required_ild_lb (evaluated at submit and re-evaluated at cut-program lock)"
    error_id: ERR_ILD_SAFETY_MARGIN
    http_status: 422
    applies_to: "POST /api/package-specs/{id}/submit, POST /api/cut-programs/{id}/lock"
  - priority: 9
    category: business_constraint
    check: "Feasibility and method constraints: nesting yield > 0, tooling required for DIE_CUT, tooling only for DIE_CUT programs, min release qty, lab/machine window well-formed (start < end)"
    error_id: "ERR_UTILIZATION_INFEASIBLE | ERR_TOOLING_REQUIRED | ERR_METHOD_MISMATCH | ERR_MIN_RELEASE_QTY | ERR_INVALID_REQUEST"
    http_status: 422
    applies_to: "cut-program lock, tooling create, release create, windowed creates"
  - priority: 10
    category: business_temporal
    check: "Resource window conflicts: machine windows half-open (adjacency allowed); drop-lab bookings require >= 30 minute gap"
    error_id: "ERR_MACHINE_WINDOW_CONFLICT | ERR_LAB_WINDOW_CONFLICT"
    http_status: 409
    applies_to: "POST /api/production-orders/{id}/confirm, POST /api/drop-tests"
  - priority: 11
    category: business_fiscal
    check: "Stock sufficiency: release qty <= on_hand_qty - reserved_qty at allocate"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 409
    applies_to: "POST /api/release-orders/{id}/allocate"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["current_utc := to_iso8601"]

  # --- Customers ---
  - method: POST
    path: "/api/customers"
    description: "Create a customer"
    roles: [SalesEngineer]
    code: 201
    input: [name, account_tier, "branding_required?"]
    output: Customer
    side_effects: ["credit_balance_cents = 0"]
  - method: GET
    path: "/api/customers/{id}"
    description: "Get a customer"
    roles: [SalesEngineer, DesignEngineer, QualityEngineer, PlantManager, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # --- Materials ---
  - method: POST
    path: "/api/materials"
    description: "Create a foam material"
    roles: [PlantManager]
    code: 201
    input: [foam_family, density_pcf, ild_lb_25, sheet_length_in, sheet_width_in, sheet_thickness_in, cost_per_board_ft_cents, recyclable, scrap_credit_per_lb_cents]
    output: Material
    side_effects: []
  - method: GET
    path: "/api/materials/{id}"
    description: "Get a material"
    roles: [SalesEngineer, DesignEngineer, QualityEngineer, PlantManager, Customer]
    code: 200
    input: []
    output: Material
    side_effects: []
  - method: PATCH
    path: "/api/materials/{id}"
    description: "Update material cost/spec fields; changes do not retroactively alter LOCKED inventory program pricing pins or scheduled DropTest pass limits"
    roles: [PlantManager]
    code: 200
    input: ["cost_per_board_ft_cents?", "ild_lb_25?", "density_pcf?", "scrap_credit_per_lb_cents?"]
    output: Material
    side_effects: []

  # --- Package specs ---
  - method: POST
    path: "/api/package-specs"
    description: "Create a package spec (DRAFT); computes required_ild_lb"
    roles: [SalesEngineer]
    code: 201
    input: [customer_id, material_id, part_name, part_length_in, part_width_in, product_weight_lb, required_drop_height_in, max_fragility_g]
    output: PackageSpec
    side_effects: ["required_ild_lb via cushion_ild_calc", "revision_no = 1", "status = DRAFT"]
  - method: GET
    path: "/api/package-specs/{id}"
    description: "Get a package spec"
    roles: [SalesEngineer, DesignEngineer, QualityEngineer, PlantManager, Customer]
    code: 200
    input: []
    output: PackageSpec
    side_effects: []
  - method: GET
    path: "/api/package-specs"
    description: "List package specs (filtered)"
    roles: [SalesEngineer, DesignEngineer, QualityEngineer, PlantManager, Customer]
    code: 200
    input: ["customer_id?", "material_id?", "status?", "limit?", "offset?"]
    output: PackageSpec[]
    side_effects: []
  - method: PATCH
    path: "/api/package-specs/{id}"
    description: "Edit a DRAFT spec; recomputes required_ild_lb when weight/drop-height change"
    roles: [SalesEngineer]
    code: 200
    input: ["material_id?", "part_length_in?", "part_width_in?", "product_weight_lb?", "required_drop_height_in?", "max_fragility_g?"]
    output: PackageSpec
    side_effects: ["required_ild_lb recomputed via cushion_ild_calc when inputs change"]
  - method: POST
    path: "/api/package-specs/{id}/submit"
    description: "Submit spec (DRAFT -> SUBMITTED); ILD safety check"
    roles: [SalesEngineer]
    code: 200
    input: []
    output: PackageSpec
    side_effects: []
  - method: POST
    path: "/api/package-specs/{id}/begin-validation"
    description: "Begin validation (SUBMITTED -> IN_VALIDATION)"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: PackageSpec
    side_effects: []
  - method: POST
    path: "/api/package-specs/{id}/return-for-revision"
    description: "Return spec to DRAFT with revision_no increment; obsoletes linked cut programs with full cascade"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: PackageSpec
    side_effects:
      - "revision_no += 1"
      - "CutPrograms {DRAFT, NESTED, LOCKED} -> OBSOLETE"
      - "ProductionOrders on obsoleted programs {QUOTED, CONFIRMED} -> CANCELLED"
      - "CONFIRMED cancellations de-amortize Tooling.amortized_cents and free machine windows"
  - method: POST
    path: "/api/package-specs/{id}/approve"
    description: "Customer sign-off (VALIDATED -> APPROVED); own specs only"
    roles: [Customer]
    code: 200
    input: []
    output: PackageSpec
    side_effects: ["signed_off_at = current logical clock"]

  # --- Cut programs ---
  - method: POST
    path: "/api/cut-programs"
    description: "Create a cut program (DRAFT) against a spec; OCC on spec version; optional supersede of a LOCKED program"
    roles: [DesignEngineer]
    code: 201
    input: [package_spec_id, method, expected_package_spec_version, "machine_seconds_per_part?", "supersedes_cut_program_id?"]
    output: CutProgram
    side_effects:
      - "Increments PackageSpec.version by 1"
      - "If supersedes_cut_program_id present: referenced LOCKED program -> OBSOLETE (with cascade to orders and tooling amortization)"
      - "Spec must be in {SUBMITTED, IN_VALIDATION, VALIDATED, APPROVED} (ERR_INVALID_STATE)"
      - "machine_seconds_per_part required when method == CNC_ROUTE (ERR_INVALID_REQUEST)"
  - method: GET
    path: "/api/cut-programs/{id}"
    description: "Get a cut program"
    roles: [SalesEngineer, DesignEngineer, QualityEngineer, PlantManager, Customer]
    code: 200
    input: []
    output: CutProgram
    side_effects: []
  - method: GET
    path: "/api/cut-programs"
    description: "List cut programs (filtered)"
    roles: [SalesEngineer, DesignEngineer, QualityEngineer, PlantManager, Customer]
    code: 200
    input: ["package_spec_id?", "supersedes_cut_program_id?", "status?", "method?", "limit?", "offset?"]
    output: CutProgram[]
    side_effects: []
  - method: POST
    path: "/api/cut-programs/{id}/nest"
    description: "Run nesting yield calc (DRAFT -> NESTED)"
    roles: [DesignEngineer]
    code: 200
    input: []
    output: CutProgram
    side_effects: ["Sets parts_per_sheet, sheet_utilization_pct, offcut_sqft_per_sheet via nesting_yield_calc"]
  - method: POST
    path: "/api/cut-programs/{id}/lock"
    description: "Lock a nested program (NESTED -> LOCKED); safety re-check + feasibility + tooling gates"
    roles: [DesignEngineer]
    code: 200
    input: []
    output: CutProgram
    side_effects: ["Increments PackageSpec.version by 1"]

  # --- Tooling ---
  - method: POST
    path: "/api/toolings"
    description: "Order a die for a DIE_CUT cut program"
    roles: [DesignEngineer]
    code: 201
    input: [cut_program_id, die_cost_cents, amortization_qty, lead_time_days]
    output: Tooling
    side_effects: ["status = ORDERED; program method must be DIE_CUT (ERR_METHOD_MISMATCH)"]
  - method: GET
    path: "/api/toolings/{id}"
    description: "Get tooling"
    roles: [SalesEngineer, DesignEngineer, QualityEngineer, PlantManager, Customer]
    code: 200
    input: []
    output: Tooling
    side_effects: []
  - method: GET
    path: "/api/toolings"
    description: "List toolings (filtered)"
    roles: [SalesEngineer, DesignEngineer, QualityEngineer, PlantManager, Customer]
    code: 200
    input: ["cut_program_id?", "status?", "limit?", "offset?"]
    output: Tooling[]
    side_effects: []
  - method: POST
    path: "/api/toolings/{id}/commission"
    description: "Commission die (ORDERED -> IN_SERVICE)"
    roles: [DesignEngineer]
    code: 200
    input: []
    output: Tooling
    side_effects: []
  - method: POST
    path: "/api/toolings/{id}/retire"
    description: "Retire die (-> RETIRED)"
    roles: [DesignEngineer]
    code: 200
    input: []
    output: Tooling
    side_effects: []

  # --- Drop tests ---
  - method: POST
    path: "/api/drop-tests"
    description: "Schedule a lab drop test; lab bookings require a >= 30 minute gap from every other booking (buffered closed intervals); pins pass_limit_g from spec"
    roles: [QualityEngineer]
    code: 201
    input: [package_spec_id, scheduled_start, scheduled_end, drop_height_in, orientation]
    output: DropTest
    side_effects:
      - "pass_limit_g = spec.max_fragility_g and spec_revision_no = spec.revision_no (both pinned)"
      - "Spec must be IN_VALIDATION (ERR_INVALID_STATE)"
      - "scheduled_start < scheduled_end (ERR_INVALID_REQUEST); buffer conflict -> ERR_LAB_WINDOW_CONFLICT"
  - method: GET
    path: "/api/drop-tests/{id}"
    description: "Get a drop test"
    roles: [SalesEngineer, DesignEngineer, QualityEngineer, PlantManager, Customer]
    code: 200
    input: []
    output: DropTest
    side_effects: []
  - method: GET
    path: "/api/drop-tests"
    description: "List drop tests (filtered)"
    roles: [SalesEngineer, DesignEngineer, QualityEngineer, PlantManager, Customer]
    code: 200
    input: ["package_spec_id?", "result?", "limit?", "offset?"]
    output: DropTest[]
    side_effects: []
  - method: POST
    path: "/api/drop-tests/{id}/record"
    description: "Record measured peak g (SCHEDULED -> RECORDED); PASS may auto-validate the spec"
    roles: [QualityEngineer]
    code: 200
    input: [measured_peak_g]
    output: DropTest
    side_effects:
      - "result = PASS if measured_peak_g <= pass_limit_g else FAIL"
      - "PASS with no recorded FAILs on an IN_VALIDATION spec -> spec VALIDATED (auto)"

  # --- Production orders ---
  - method: POST
    path: "/api/production-orders"
    description: "Create a customer production order (QUOTED) with provisional pricing"
    roles: [SalesEngineer]
    code: 201
    input: [package_spec_id, cut_program_id, qty]
    output: ProductionOrder
    side_effects:
      - "provisional pricing via quote_pricing_calc (provisional variant) + order_total_rounding"
      - "cut_program must be NESTED or LOCKED (ERR_INVALID_STATE)"
  - method: GET
    path: "/api/production-orders/{id}"
    description: "Get a production order"
    roles: [SalesEngineer, DesignEngineer, QualityEngineer, PlantManager, Customer]
    code: 200
    input: []
    output: ProductionOrder
    side_effects: []
  - method: GET
    path: "/api/production-orders"
    description: "List production orders (filtered)"
    roles: [SalesEngineer, DesignEngineer, QualityEngineer, PlantManager, Customer]
    code: 200
    input: ["package_spec_id?", "cut_program_id?", "inventory_program_id?", "fab_status?", "limit?", "offset?"]
    output: ProductionOrder[]
    side_effects: []
  - method: POST
    path: "/api/production-orders/{id}/confirm"
    description: "Confirm order (QUOTED -> CONFIRMED); final pricing, tooling amortization, machine window booking"
    roles: [SalesEngineer]
    code: 200
    input: [machine_id, window_start, window_end]
    output: ProductionOrder
    side_effects:
      - "final pricing via quote_pricing_calc (final variant) + order_total_rounding"
      - "DIE_CUT: charges tooling amortization to Tooling.amortized_cents"
      - "books machine window"
  - method: POST
    path: "/api/production-orders/{id}/start"
    description: "Start fabrication (CONFIRMED -> IN_PROGRESS)"
    roles: [PlantManager]
    code: 200
    input: []
    output: ProductionOrder
    side_effects: []
  - method: POST
    path: "/api/production-orders/{id}/complete"
    description: "Complete fabrication (IN_PROGRESS -> COMPLETED); replenishment orders credit program stock"
    roles: [PlantManager]
    code: 200
    input: []
    output: ProductionOrder
    side_effects: ["REPLENISHMENT: program.produced_qty += qty, program.on_hand_qty += qty"]
  - method: POST
    path: "/api/production-orders/{id}/cancel"
    description: "Cancel order (QUOTED|CONFIRMED -> CANCELLED) with amortization/window compensation"
    roles: [SalesEngineer]
    code: 200
    input: []
    output: ProductionOrder
    side_effects: ["CONFIRMED DIE_CUT: Tooling.amortized_cents -= tooling_amort_cents; machine window freed"]
  - method: POST
    path: "/api/production-orders/{id}/hold"
    description: "Place quality hold (quality_hold NONE -> ON_HOLD; fab_status must be CONFIRMED or IN_PROGRESS)"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: ProductionOrder
    side_effects: []
  - method: POST
    path: "/api/production-orders/{id}/release-hold"
    description: "Release quality hold (ON_HOLD -> NONE)"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: ProductionOrder
    side_effects: []

  # --- Inventory programs ---
  - method: POST
    path: "/api/inventory-programs"
    description: "Create an inventory program (PROPOSED); spec must be APPROVED and customer must match spec customer"
    roles: [SalesEngineer]
    code: 201
    input: [customer_id, package_spec_id, pricing_mode, max_stock_qty, reorder_point_qty, min_release_qty]
    output: InventoryProgram
    side_effects: ["stock counters = 0"]
  - method: GET
    path: "/api/inventory-programs/{id}"
    description: "Get an inventory program"
    roles: [SalesEngineer, DesignEngineer, QualityEngineer, PlantManager, Customer]
    code: 200
    input: []
    output: InventoryProgram
    side_effects: []
  - method: GET
    path: "/api/inventory-programs"
    description: "List inventory programs (filtered)"
    roles: [SalesEngineer, DesignEngineer, QualityEngineer, PlantManager, Customer]
    code: 200
    input: ["customer_id?", "package_spec_id?", "status?", "limit?", "offset?"]
    output: InventoryProgram[]
    side_effects: []
  - method: POST
    path: "/api/inventory-programs/{id}/activate"
    description: "Activate program (PROPOSED -> ACTIVE); pins locked material cost for LOCKED pricing mode"
    roles: [SalesEngineer]
    code: 200
    input: []
    output: InventoryProgram
    side_effects: ["LOCKED mode: locked_material_cost_bf_cents = material.cost_per_board_ft_cents"]
  - method: POST
    path: "/api/inventory-programs/{id}/suspend"
    description: "Suspend program (ACTIVE -> SUSPENDED); cancels open releases with reserved-stock compensation"
    roles: [SalesEngineer]
    code: 200
    input: []
    output: InventoryProgram
    side_effects:
      - "ReleaseOrders {PENDING, ALLOCATED} -> CANCELLED"
      - "Each ALLOCATED cancellation: reserved_qty -= qty"
  - method: POST
    path: "/api/inventory-programs/{id}/resume"
    description: "Resume program (SUSPENDED -> ACTIVE)"
    roles: [SalesEngineer]
    code: 200
    input: []
    output: InventoryProgram
    side_effects: []
  - method: POST
    path: "/api/inventory-programs/{id}/close"
    description: "Close program (-> CLOSED); requires no open releases"
    roles: [SalesEngineer]
    code: 200
    input: []
    output: InventoryProgram
    side_effects: []
  - method: POST
    path: "/api/inventory-programs/{id}/replenish"
    description: "Create a REPLENISHMENT production order (QUOTED) for this program; selects latest LOCKED cut program (updated_at DESC, tie created_at ASC); ERR_NO_LOCKED_PROGRAM when none"
    roles: [PlantManager]
    code: 201
    input: [qty]
    output: ProductionOrder
    side_effects: ["Creates ProductionOrder(kind=REPLENISHMENT, inventory_program_id=program, fab_status=QUOTED)"]

  # --- Release orders ---
  - method: POST
    path: "/api/release-orders"
    description: "Create a release order (PENDING) against own ACTIVE program; min release qty enforced"
    roles: [Customer]
    code: 201
    input: [inventory_program_id, qty, requested_ship_date]
    output: ReleaseOrder
    side_effects: []
  - method: GET
    path: "/api/release-orders/{id}"
    description: "Get a release order"
    roles: [SalesEngineer, DesignEngineer, QualityEngineer, PlantManager, Customer]
    code: 200
    input: []
    output: ReleaseOrder
    side_effects: []
  - method: GET
    path: "/api/release-orders"
    description: "List release orders (filtered)"
    roles: [SalesEngineer, DesignEngineer, QualityEngineer, PlantManager, Customer]
    code: 200
    input: ["inventory_program_id?", "status?", "limit?", "offset?"]
    output: ReleaseOrder[]
    side_effects: []
  - method: POST
    path: "/api/release-orders/{id}/allocate"
    description: "Allocate stock (PENDING -> ALLOCATED); computes release price per pricing_mode variant"
    roles: [PlantManager]
    code: 200
    input: []
    output: ReleaseOrder
    side_effects: ["unit_price_cents/total_price_cents via release_pricing_calc", "program.reserved_qty += qty"]
  - method: POST
    path: "/api/release-orders/{id}/deallocate"
    description: "Deallocate (ALLOCATED -> PENDING); clears price fields, returns reservation"
    roles: [PlantManager]
    code: 200
    input: []
    output: ReleaseOrder
    side_effects: ["program.reserved_qty -= qty", "unit_price_cents/total_price_cents reset to null"]
  - method: POST
    path: "/api/release-orders/{id}/ship"
    description: "Ship an allocated release (ALLOCATED -> SHIPPED); may auto-create replenishment order"
    roles: [PlantManager]
    code: 200
    input: []
    output: ReleaseOrder
    side_effects:
      - "program.on_hand_qty -= qty; reserved_qty -= qty; shipped_qty += qty"
      - "replenishment_calc: auto-create REPLENISHMENT order when on_hand < reorder_point"
  - method: POST
    path: "/api/release-orders/{id}/cancel"
    description: "Cancel a release (PENDING|ALLOCATED -> CANCELLED); ALLOCATED cancellation returns reservation"
    roles: [Customer, PlantManager]
    code: 200
    input: []
    output: ReleaseOrder
    side_effects: ["If was ALLOCATED: program.reserved_qty -= qty"]

  # --- Scrap batches ---
  - method: POST
    path: "/api/scrap-batches"
    description: "Collect an offcut/scrap batch from a COMPLETED production order"
    roles: [PlantManager]
    code: 201
    input: [production_order_id, gross_weight_lb, contamination_pct]
    output: ScrapBatch
    side_effects:
      - "net_recyclable_lb computed"
      - "order.fab_status must be COMPLETED (ERR_INVALID_STATE); material must be recyclable (ERR_MATERIAL_NOT_RECYCLABLE)"
  - method: GET
    path: "/api/scrap-batches/{id}"
    description: "Get a scrap batch"
    roles: [SalesEngineer, DesignEngineer, QualityEngineer, PlantManager, Customer]
    code: 200
    input: []
    output: ScrapBatch
    side_effects: []
  - method: GET
    path: "/api/scrap-batches"
    description: "List scrap batches (filtered)"
    roles: [SalesEngineer, DesignEngineer, QualityEngineer, PlantManager, Customer]
    code: 200
    input: ["production_order_id?", "status?", "limit?", "offset?"]
    output: ScrapBatch[]
    side_effects: []
  - method: POST
    path: "/api/scrap-batches/{id}/process"
    description: "Process batch (COLLECTED -> PROCESSED)"
    roles: [PlantManager]
    code: 200
    input: []
    output: ScrapBatch
    side_effects: []
  - method: POST
    path: "/api/scrap-batches/{id}/credit"
    description: "Credit batch (PROCESSED -> CREDITED); monthly cumulative tier determines rate; posts to customer credit balance"
    roles: [PlantManager]
    code: 200
    input: []
    output: ScrapBatch
    side_effects: ["credit_cents via scrap_credit_calc", "credited_at = current logical clock", "Customer.credit_balance_cents += credit_cents"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Customer role acting on a resource owned by a different customer" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum value, out-of-range number, malformed window, or program.customer_id != spec.customer_id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK does not exist" }
  - { id: ERR_STALE_SPEC_VERSION, http: 412, condition: "expected_package_spec_version != current PackageSpec.version on cut-program create" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid from-state for the requested transition (includes nesting a DRAFT-spec program, confirming with non-LOCKED program, completing under quality hold, scrap on non-COMPLETED order)" }
  - { id: ERR_SPEC_NOT_APPROVED, http: 409, condition: "Operation requires the PackageSpec to be APPROVED (production confirm, inventory program create)" }
  - { id: ERR_PROGRAM_NOT_ACTIVE, http: 409, condition: "Operation requires the InventoryProgram to be ACTIVE (release create/allocate/ship, replenish)" }
  - { id: ERR_PROGRAM_HAS_OPEN_RELEASES, http: 409, condition: "Program close blocked by PENDING or ALLOCATED release orders" }
  - { id: ERR_ILD_SAFETY_MARGIN, http: 422, condition: "material.ild_lb_25 < spec.required_ild_lb at submit or at cut-program lock re-check" }
  - { id: ERR_METHOD_MISMATCH, http: 422, condition: "Tooling ordered for a CNC_ROUTE cut program" }
  - { id: ERR_TOOLING_REQUIRED, http: 422, condition: "Lock of DIE_CUT program with no Tooling record" }
  - { id: ERR_TOOLING_NOT_IN_SERVICE, http: 409, condition: "Operation requires linked Tooling IN_SERVICE (lock, confirm)" }
  - { id: ERR_UTILIZATION_INFEASIBLE, http: 422, condition: "Lock of a program whose parts_per_sheet == 0 (part does not fit the sheet)" }
  - { id: ERR_NO_LOCKED_PROGRAM, http: 409, condition: "Replenish requested but no LOCKED cut program exists for the program's spec" }
  - { id: ERR_MACHINE_WINDOW_CONFLICT, http: 409, condition: "Machine window [start, end) overlaps another non-CANCELLED order's window on the same machine; adjacency (end == start) is allowed" }
  - { id: ERR_LAB_WINDOW_CONFLICT, http: 409, condition: "Drop-lab booking violates the >= 30 minute gap rule against any other booking" }
  - { id: ERR_MIN_RELEASE_QTY, http: 422, condition: "Release qty below program.min_release_qty" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "Release qty > on_hand_qty - reserved_qty at allocate" }
  - { id: ERR_MATERIAL_NOT_RECYCLABLE, http: 422, condition: "Scrap batch on an order whose material.recyclable == false" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; drives the logical clock for deterministic time-dependent tests"
    identity: opaque
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
    shared_operations: []
  - name: SalesEngineer
    description: "Owns commercial workflow: customers, specs, quotes/production orders, inventory programs"
    identity: opaque
    exclusive_operations:
      - "POST /api/customers"
      - "POST /api/package-specs, PATCH /api/package-specs/{id}, POST .../submit"
      - "POST /api/production-orders, POST .../confirm, POST .../cancel"
      - "POST /api/inventory-programs, POST .../activate, .../suspend, .../resume, .../close"
    shared_operations:
      - "All GET endpoints"
  - name: DesignEngineer
    description: "Owns CAD cut programs, nesting, and die tooling"
    identity: opaque
    exclusive_operations:
      - "POST /api/cut-programs, POST .../nest, POST .../lock"
      - "POST /api/toolings, POST .../commission, POST .../retire"
    shared_operations:
      - "All GET endpoints"
  - name: QualityEngineer
    description: "Owns validation: drop tests, spec validation transitions, quality holds"
    identity: opaque
    exclusive_operations:
      - "POST /api/drop-tests, POST .../record"
      - "POST /api/package-specs/{id}/begin-validation, POST .../return-for-revision"
      - "POST /api/production-orders/{id}/hold, POST .../release-hold"
    shared_operations:
      - "All GET endpoints"
  - name: PlantManager
    description: "Owns the floor: materials, production start/complete, replenishment, release allocate/ship, scrap"
    identity: opaque
    exclusive_operations:
      - "POST /api/materials, PATCH /api/materials/{id}"
      - "POST /api/production-orders/{id}/start, POST .../complete"
      - "POST /api/inventory-programs/{id}/replenish"
      - "POST /api/release-orders/{id}/allocate, .../deallocate, .../ship"
      - "POST /api/scrap-batches, POST .../process, POST .../credit"
    shared_operations:
      - "All GET endpoints"
      - "POST /api/release-orders/{id}/cancel (shared with Customer)"
  - name: Customer
    description: "Brand owner; signs off specs and releases stock from its own inventory programs"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /api/package-specs/{id}/approve (own specs only)"
      - "POST /api/release-orders (own programs only)"
    shared_operations:
      - "All GET endpoints (own resources only)"
      - "POST /api/release-orders/{id}/cancel (own releases; shared with PlantManager)"
