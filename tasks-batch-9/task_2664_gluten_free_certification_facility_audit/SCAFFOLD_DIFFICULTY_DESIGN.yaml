            - "Nonconformance.${nc_id}.status == \"ESCALATED\""
            - "Nonconformance.${nc_id}.ca_revision_count == 2"
            - "Nonconformance.${nc_id}.ca_plan_text == \"Revision 2: retrain plus a per-changeover swab signed by the shift lead.\""
            - "Nonconformance.${nc_id}.ca_verified == false"
            - "Nonconformance.${nc_id}.penalty_points == 8"
            - "Audit.${aud_id}.status == \"SCHEDULED\""
            - "Audit.${aud_id}.final_score == 82"
