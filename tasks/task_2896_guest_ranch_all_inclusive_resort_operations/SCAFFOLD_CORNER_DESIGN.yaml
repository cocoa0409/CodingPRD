      - name: stale_guest_version_is_refused_on_a_second_assessment
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[assessment-create-stale-guest]
          - errors[ERR_STALE_GUEST_VERSION]
          - calculations.rider_ability_rank_resolution
        distinguishing_aspect: "The first assessment rewrites effective_ability_rank and bumps Guest.version, so a second assessment authored against the cached guest view is refused with 412 rather than silently superseding a rank the author never saw."
        test_recipe:
          setup:
            - "one adult guest with a signed waiver, guest version read once and cached"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: HorseProgramDirector
            - call: "POST /guests"
              payload: { full_name: "Ann Adult", birth_date: "1985-04-02", weight_lb: 165 }
              as: ReservationsAgent
              captures: { g_a1: $.data.id }
            - call: "POST /guests/${g_a1}/waiver-signature"
              payload: { signed_on: "2026-08-01", equine_statute_ack: true }
              as: ReservationsAgent
            - call: "GET /guests/${g_a1}"
              payload: {}
              as: HorseProgramDirector
              captures: { gv_shared: $.data.version, rank_before: $.data.effective_ability_rank }
          trigger:
            - call: "POST /guests/${g_a1}/rider-assessments"
              payload: { requested_ability: "BEGINNER", expected_guest_version: "${gv_shared}" }
              as: HorseProgramDirector
              captures: { ra1: $.data.id, ra1_state: $.data.assessment_status }
            - call: "POST /guests/${g_a1}/rider-assessments"
              payload: { requested_ability: "ADVANCED", expected_guest_version: "${gv_shared}" }
              as: HorseProgramDirector
              captures: { err_stale_guest: $.data.error_id }
            - call: "GET /guests/${g_a1}"
              payload: {}
              as: HorseProgramDirector
              captures: { gv_fresh: $.data.version }
            - call: "POST /guests/${g_a1}/rider-assessments"
              payload: { requested_ability: "ADVANCED", expected_guest_version: "${gv_fresh}" }
              as: HorseProgramDirector
              captures: { ra2: $.data.id, ra2_state: $.data.assessment_status }
          assert:
            - "${rank_before} == UNASSESSED"
            - "${ra1_state} == PENDING"
            - "${err_stale_guest} == ERR_STALE_GUEST_VERSION with HTTP 412"
            - "${gv_fresh} == ${gv_shared} + 1"
            - "${ra2_state} == PENDING"
            - "exactly two RiderAssessment rows exist for ${g_a1}; the rejected request created none"
            - "RiderAssessment.${ra1}.assessment_status is unchanged by the rejected write"

