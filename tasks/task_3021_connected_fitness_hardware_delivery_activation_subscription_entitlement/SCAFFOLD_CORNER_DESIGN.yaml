            - call: "POST /fitness/_run_ops"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /fitness/class-enrollments"
              payload: { class_session_id: "${s_id}", device_id: "${d_id}", enroller_user_id: "${u_ada}" }
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { err_window: $.data.error_id }
          assert:
            - "ClassSession.${s_id}.scheduled_status has reached ARCHIVED through the ops sweep (a PURCHASE-independent system transition)"
            - "the enrollment returns 409 ERR_CLASS_CAPACITY_EXCEEDED (captured as ${err_window}) because the library window is closed, while ClassSession.${s_id}.live_enrollment_count is 0 and capacity is 100, so capacity was never the binding constraint"
            - "ClassSession.${s_id}.on_demand_window_ends_at == 2026-09-11T11:00:00Z and the attempt happened at 2026-09-21T00:00:00Z, well past it"

