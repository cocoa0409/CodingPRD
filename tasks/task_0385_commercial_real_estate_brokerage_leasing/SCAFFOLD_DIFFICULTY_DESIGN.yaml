              as: ListingBroker
              as_user_id: "${lb_id}"
            - call: "POST /deals/${deal_a_id}/proposals"
              payload: { from_side: "LISTING", base_rent_psf_yr: 40, term_months: 120, annual_escalation_pct: 0, expected_deal_version: "${av0}" }
              as: ListingBroker
