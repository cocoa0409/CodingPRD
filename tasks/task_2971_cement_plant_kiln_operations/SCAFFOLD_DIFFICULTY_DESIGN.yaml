            - { call: "POST /cement-ops/kiln-runs", as: KilnOperator, payload: { kiln_id: "${k1}", blended_pile_id: "${pb}", clinker_silo_id: "${sc1}", window_start: "2026-08-01T12:00:00Z", window_end: "2026-08-02T00:00:00Z" }, captures: { err: "$.data.error_id" } }
          assert:
            - "R0 reads process_state SCHEDULED with scheduled_hours 12.00"
            - "the trigger returns 409 with error_id ERR_KILN_WINDOW_CONFLICT — the windows share only the instant 2026-08-01T12:00:00Z"
            - "no second run exists: GET /cement-ops/kiln-runs?kiln_id=${k1} has total_count 1"
            - "the same request with window_start 2026-08-01T12:00:01Z is accepted (201), which pins the closed upper end rather than rejecting all adjacent windows"
            - "the same touching window on a DIFFERENT kiln is accepted, proving the conflict is per-kiln"
            - "the conflict also holds against a COMPLETED run, not just SCHEDULED/BURNING ones: completing R0 and then re-issuing the touching request still returns ERR_KILN_WINDOW_CONFLICT"

      - name: loadout_windows_are_half_open_and_spout_capacity_is_an_aggregate_over_overlaps
        grounds: >
          §1.4 priority 107 counts only orders on the same Silo with status IN {RESERVED, LOADING}
          whose HALF-OPEN window [window_start, window_end) overlaps the new one, and requires the
          count to stay strictly below Silo.loadout_spouts (2 for SM1), with ERR_SILO_SPOUT_CAPACITY
          when it does not. Windows that merely touch do not overlap.
        distinguishing_aspect: >
          A closed-interval implementation refuses the adjacent 08:00-10:00 order with
          ERR_SILO_SPOUT_CAPACITY even though only one spout would be busy at any instant. A
          per-order (non-aggregate) implementation accepts the third, straddling order because it
          never counts two existing orders at once. The correct sequence is: second order accepted,
          third order refused with ERR_SILO_SPOUT_CAPACITY.
        test_recipe:
          setup: >
            The canonical certificate chain up to an ISSUED certificate MC1 for 574.72 t on cement
            silo SM1 with loadout_spouts 2 and draw_rate 250.00 t/h. LO1 books
            [06:00, 08:00) for 120.00 t; LO2 books the adjacent [08:00, 10:00) for 120.00 t and must
            be accepted.
