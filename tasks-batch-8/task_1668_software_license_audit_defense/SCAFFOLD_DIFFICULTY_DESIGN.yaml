              as: VendorAuditor
              captures: { si: $.data.id }
            - call: "POST /sam/audit-scope-items/${si}/confirm"
              payload: {}
              as: LegalCounsel
            - call: "POST /sam/audit-cases/${case_id}/advance"
              payload: { to_state: "EVIDENCE_COLLECTION" }
              as: LegalCounsel
            - call: "POST /sam/data-submissions"
              payload: { audit_case_id: "${case_id}", submission_label: "draft package", covered_scope_item_ids: ["${si}"] }
              as: SAMManager
              as_user_id: "sam-mgr-1"
              captures: { sub: $.data.id }
          trigger:
            - call: "POST /sam/audit-cases/${case_id}/advance"
              payload: { to_state: "FINDINGS_REVIEW" }
              as: LegalCounsel
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NO_RELEASED_SUBMISSION"
            - "AuditCase.${case_id}.status == EVIDENCE_COLLECTION"
            - "DataSubmission.${sub}.status == DRAFT"

      - name: scope_confirm_requires_case_in_scope_negotiation
        grounds:
          - state_machines.AuditScopeItem.PROPOSED_to_CONFIRMED
          - "errors[ERR_AUDIT_CASE_INVALID_STATE]"
        distinguishing_aspect: |
          Different entity pair than the submission gate: AuditScopeItem x AuditCase.
          A scope item proposed while the case is still NOTICE_RECEIVED cannot be
          confirmed until the case itself advances to SCOPE_NEGOTIATION — the
          child's valid transition set depends on the parent's state.
        test_recipe:
          setup:
            - "Case freshly created (NOTICE_RECEIVED, never advanced); one VENDOR-proposed scope item in PROPOSED"
          setup_api_calls:
            - call: "POST /sam/vendors"
              payload: { name: "Vendor A", vendor_code: "VND-A", default_license_metric: "PER_INSTALL", notice_response_deadline_days: 30 }
              as: SAMPlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /sam/products"
              payload: { vendor_id: "${v_id}", name: "Prod", license_metric: "PER_INSTALL", unit_list_price_cents: 10000, support_rate_pct: 0.22 }
              as: SAMPlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /sam/audit-cases"
              payload: { vendor_id: "${v_id}", audit_firm_name: "AuditCo LLP", notice_received_on: "2026-08-01T00:00:00Z" }
              as: LegalCounsel
              captures: { case_id: $.data.id }
            - call: "POST /sam/audit-scope-items"
              payload: { audit_case_id: "${case_id}", product_id: "${p_id}", inclusion_rationale: "attached to the notice" }
              as: VendorAuditor
              captures: { si: $.data.id }
          trigger:
            - call: "POST /sam/audit-scope-items/${si}/confirm"
              payload: {}
              as: LegalCounsel
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_AUDIT_CASE_INVALID_STATE (case NOTICE_RECEIVED, not SCOPE_NEGOTIATION)"
            - "AuditScopeItem.${si}.scope_status == PROPOSED (unchanged)"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: product_concurrent_audit_half_open_occupation
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_PRODUCT_UNDER_CONCURRENT_AUDIT]"
          - state_machines.AuditCase._any_non-terminal__to_WITHDRAWN
        distinguishing_aspect: |
          Half-open interval semantics on the Product resource: an audit case
          occupies a product over [notice_received_on, closure). Confirming P in
          case B while case A is non-terminal conflicts; once A is WITHDRAWN the
          occupation ends and an immediate re-audit confirm succeeds.
        test_recipe:
          setup:
            - "Case A in SCOPE_NEGOTIATION with product P CONFIRMED in scope"
            - "Case B in SCOPE_NEGOTIATION with P proposed (same vendor)"
          setup_api_calls:
            - call: "POST /sam/vendors"
              payload: { name: "Vendor A", vendor_code: "VND-A", default_license_metric: "PER_INSTALL", notice_response_deadline_days: 30 }
              as: SAMPlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /sam/products"
              payload: { vendor_id: "${v_id}", name: "Prod", license_metric: "PER_INSTALL", unit_list_price_cents: 10000, support_rate_pct: 0.22 }
              as: SAMPlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /sam/audit-cases"
              payload: { vendor_id: "${v_id}", audit_firm_name: "AuditCo LLP", notice_received_on: "2026-08-01T00:00:00Z" }
              as: LegalCounsel
              captures: { case_a: $.data.id }
            - call: "POST /sam/audit-cases/${case_a}/advance"
              payload: { to_state: "SCOPE_NEGOTIATION" }
              as: LegalCounsel
            - call: "POST /sam/audit-scope-items"
              payload: { audit_case_id: "${case_a}", product_id: "${p_id}", inclusion_rationale: "A scope" }
              as: VendorAuditor
              captures: { si_a: $.data.id }
            - call: "POST /sam/audit-scope-items/${si_a}/confirm"
              payload: {}
              as: LegalCounsel
            - call: "POST /sam/audit-cases"
              payload: { vendor_id: "${v_id}", audit_firm_name: "AuditCo LLP", notice_received_on: "2026-08-01T00:00:00Z" }
              as: LegalCounsel
              captures: { case_b: $.data.id }
            - call: "POST /sam/audit-cases/${case_b}/advance"
              payload: { to_state: "SCOPE_NEGOTIATION" }
              as: LegalCounsel
            - call: "POST /sam/audit-scope-items"
              payload: { audit_case_id: "${case_b}", product_id: "${p_id}", inclusion_rationale: "B scope" }
              as: VendorAuditor
              captures: { si_b: $.data.id }
          trigger:
            - call: "POST /sam/audit-scope-items/${si_b}/confirm"
              payload: {}
              as: LegalCounsel
              captures: { err: $.data.error_id }
            - call: "POST /sam/audit-cases/${case_a}/withdraw"
              payload: {}
              as: VendorAuditor
            - call: "POST /sam/audit-scope-items/${si_b}/confirm"
              payload: {}
              as: LegalCounsel
              captures: { st: $.data.scope_status }
          assert:
            - "err == ERR_PRODUCT_UNDER_CONCURRENT_AUDIT (case A occupied P)"
            - "st == CONFIRMED (after A WITHDRAWN, half-open occupation [notice, closure) has ended)"

      - name: entitlement_window_closed_interval_touch
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_ENTITLEMENT_WINDOW_OVERLAP]"
          - entities.EntitlementRecord.fields.effective_to
        distinguishing_aspect: |
          Different resource and different interval semantics than audit occupation:
          entitlement windows are CLOSED [effective_from, effective_to], so a new
          PRODUCTION record starting 2026-12-31 touches the existing record ending
          2026-12-31 and conflicts; a 2027-01-01 start is disjoint and succeeds
          (landing in SCHEDULED since the clock is 2026-08-01).
        test_recipe:
          setup:
            - "Product P with an ACTIVE PRODUCTION entitlement covering [2026-01-01, 2026-12-31]"
          setup_api_calls:
            - call: "POST /sam/vendors"
              payload: { name: "Vendor A", vendor_code: "VND-A", default_license_metric: "PER_INSTALL", notice_response_deadline_days: 30 }
              as: SAMPlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /sam/products"
              payload: { vendor_id: "${v_id}", name: "Prod", license_metric: "PER_INSTALL", unit_list_price_cents: 10000, support_rate_pct: 0.22 }
              as: SAMPlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /sam/entitlements"
              payload: { product_id: "${p_id}", purchase_order_number: "PO-2026", quantity: 100, coverage_class: "PRODUCTION", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", source: "MANUAL_IMPORT" }
              as: SAMManager
              captures: { e1: $.data.id }
          trigger:
            - call: "POST /sam/entitlements"
              payload: { product_id: "${p_id}", purchase_order_number: "PO-DUP", quantity: 50, coverage_class: "PRODUCTION", effective_from: "2026-12-31T00:00:00Z", effective_to: "2027-12-31T00:00:00Z", source: "MANUAL_IMPORT" }
              as: SAMManager
              captures: { err: $.data.error_id }
            - call: "POST /sam/entitlements"
              payload: { product_id: "${p_id}", purchase_order_number: "PO-2027", quantity: 50, coverage_class: "PRODUCTION", effective_from: "2027-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z", source: "MANUAL_IMPORT" }
              as: SAMManager
              captures: { e2_status: $.data.status }
          assert:
            - "err == ERR_ENTITLEMENT_WINDOW_OVERLAP (closed intervals: 2026-12-31 belongs to both windows)"
            - "e2_status == SCHEDULED (2027-01-01 window is disjoint and starts after the 2026-08-01 clock)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: uninstall_complete_and_fail_verification_conserve_deployed
        grounds:
          - state_machines.RemediationAction.IN_PROGRESS_to_COMPLETED
          - state_machines.RemediationAction.COMPLETED_to_PLANNED
          - calculations.deployed_quantity
        distinguishing_aspect: |
          Conserved quantity is deployment units: CONFIRMED-sum drops 130 -> 100 on
          completion (30 units EXCLUDED) and is restored exactly to 130 by the
          compensating fail-verification, i.e. complete + fail-verification is
          quantity-neutral with zero drift.
        test_recipe:
          setup:
            - "Product entitled 100; deployments D1=100 and D2=30 both CONFIRMED (deployed 130, gap 30)"
            - "Remediation UNINSTALL targeting D2 (quantity computed 30 == gap), started"
          setup_api_calls:
            - call: "POST /sam/vendors"
              payload: { name: "Vendor A", vendor_code: "VND-A", default_license_metric: "PER_INSTALL", notice_response_deadline_days: 30 }
              as: SAMPlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /sam/products"
              payload: { vendor_id: "${v_id}", name: "Prod", license_metric: "PER_INSTALL", unit_list_price_cents: 10000, support_rate_pct: 0.22 }
              as: SAMPlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /sam/entitlements"
              payload: { product_id: "${p_id}", purchase_order_number: "PO-1", quantity: 100, coverage_class: "PRODUCTION", effective_from: "2026-01-01T00:00:00Z", source: "MANUAL_IMPORT" }
              as: SAMManager
            - call: "POST /sam/deployments"
              payload: { product_id: "${p_id}", measured_quantity: 100, environment: "PRODUCTION", measurement_method: "SCAN", measured_on: "2026-07-15T00:00:00Z" }
              as: ITAnalyst
              captures: { d1: $.data.id }
            - call: "POST /sam/deployments/${d1}/confirm"
              payload: {}
              as: SAMManager
            - call: "POST /sam/deployments"
              payload: { product_id: "${p_id}", measured_quantity: 30, environment: "PRODUCTION", measurement_method: "SCAN", measured_on: "2026-07-15T00:00:00Z" }
              as: ITAnalyst
              captures: { d2: $.data.id }
            - call: "POST /sam/deployments/${d2}/confirm"
              payload: {}
              as: SAMManager
            - call: "GET /sam/products/${p_id}/license-positions"
              as: SAMManager
              captures: { pos_id: "$.data[0].id", dep_pre: "$.data[0].deployed_quantity" }
            - call: "POST /sam/remediation-actions"
              payload: { product_id: "${p_id}", action_type: "UNINSTALL", target_deployment_ids: ["${d2}"] }
              as: SAMManager
              captures: { ra: $.data.id, ra_qty: $.data.quantity }
            - call: "POST /sam/remediation-actions/${ra}/start"
              payload: {}
              as: SAMManager
          trigger:
            - call: "POST /sam/remediation-actions/${ra}/complete"
              payload: {}
              as: SAMManager
            - call: "GET /sam/products/${p_id}/license-positions"
              as: SAMManager
              captures: { dep_mid: "$.data[0].deployed_quantity" }
            - call: "POST /sam/remediation-actions/${ra}/fail-verification"
              payload: {}
              as: SAMManager
              captures: { ra_status: $.data.status }
            - call: "GET /sam/products/${p_id}/license-positions"
              as: SAMManager
              captures: { dep_post: "$.data[0].deployed_quantity" }
            - call: "GET /sam/products/${p_id}/deployments"
              as: SAMManager
          assert:
            - "ra_qty == 30 (computed from target D2, no input quantity)"
            - "dep_pre == 130 and dep_mid == 100 (30 units moved to EXCLUDED)"
            - "dep_post == 130 == dep_pre (compensation restores the conserved quantity exactly)"
            - "ra_status == PLANNED"
            - "DeploymentRecord.${d2}.status == CONFIRMED and excluded_by_remediation_id == null"

      - name: alert_suppress_worsen_reopen_conserves_cardinality
        grounds:
          - calculations.alert_evaluation
          - state_machines.MonitoringAlert.SUPPRESSED_to_OPEN
          - entities.MonitoringAlert.fields.suppressed_value
        distinguishing_aspect: |
          Different conserved quantity: alert-row cardinality per (product_id,
          alert_type). Suppressing the OPEN alert then worsening the gap re-opens
          the SAME row (identical id, no new row inserted), so the count of
          non-RESOLVED alerts stays at exactly 1 across the whole cycle.
        test_recipe:
          setup:
            - "Product entitled 10; 12 units CONFIRMED (gap 2, MATERIAL -> WARNING OVER_DEPLOYMENT alert OPEN)"
            - "Alert suppressed with suppressed_value = 2"
          setup_api_calls:
            - call: "POST /sam/vendors"
              payload: { name: "Vendor A", vendor_code: "VND-A", default_license_metric: "PER_INSTALL", notice_response_deadline_days: 30 }
              as: SAMPlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /sam/products"
              payload: { vendor_id: "${v_id}", name: "Prod", license_metric: "PER_INSTALL", unit_list_price_cents: 10000, support_rate_pct: 0.22 }
              as: SAMPlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /sam/entitlements"
              payload: { product_id: "${p_id}", purchase_order_number: "PO-1", quantity: 10, coverage_class: "PRODUCTION", effective_from: "2026-01-01T00:00:00Z", source: "MANUAL_IMPORT" }
              as: SAMManager
            - call: "POST /sam/deployments"
              payload: { product_id: "${p_id}", measured_quantity: 12, environment: "PRODUCTION", measurement_method: "SCAN", measured_on: "2026-07-15T00:00:00Z" }
              as: ITAnalyst
              captures: { d1: $.data.id }
            - call: "POST /sam/deployments/${d1}/confirm"
              payload: {}
              as: SAMManager
            - call: "GET /sam/products/${p_id}/monitoring-alerts"
              as: SAMManager
              captures: { a1: "$.data[0].id", a1_status: "$.data[0].status", a1_sev: "$.data[0].severity" }
            - call: "POST /sam/monitoring-alerts/${a1}/suppress"
              payload: { suppression_reason: "True-up purchase order already submitted" }
              as: SAMManager
              captures: { sup_status: $.data.status, sup_val: $.data.suppressed_value }
          trigger:
            - call: "POST /sam/deployments"
              payload: { product_id: "${p_id}", measured_quantity: 5, environment: "PRODUCTION", measurement_method: "SCAN", measured_on: "2026-07-16T00:00:00Z" }
              as: ITAnalyst
              captures: { d2: $.data.id }
            - call: "POST /sam/deployments/${d2}/confirm"
              payload: {}
              as: SAMManager
            - call: "GET /sam/products/${p_id}/monitoring-alerts"
              as: SAMManager
              captures: { re_status: "$.data[0].status", re_id: "$.data[0].id", re_val: "$.data[0].triggered_value", re_sev: "$.data[0].severity" }
          assert:
            - "a1_status == OPEN and a1_sev == WARNING before suppression"
            - "sup_status == SUPPRESSED and sup_val == 2"
            - "re_id == a1 (same row re-opened; no duplicate alert inserted)"
            - "re_status == OPEN and re_val == 7 (gap worsened 2 -> 7 > suppressed_value 2)"
            - "re_sev == CRITICAL (17/10 = 1.7 >= 1.25)"
            - "exactly one MonitoringAlert row exists for (${p_id}, OVER_DEPLOYMENT) at every step"

