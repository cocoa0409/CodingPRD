# =============================================================================
# §1.9 Scaffold Corner Design (breadth probe)
# Eating-Disorder & Behavioral Treatment Program
# Enumerates testable claims of §1.1-§1.7 not already covered by §1.8.
# Reuses the standard admit setup chain; clock default 2026-01-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_facility_minimal_required_fields
        claim_type: Creation
        grounds:
          - entities.Facility.fields.name
        distinguishing_aspect: "POST /edt/facilities with name only -> 201; response carries id, created_at, updated_at, version=1 and timezone defaults to UTC."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /edt/facilities"
              payload: { name: "Cedar EDT" }
              as: Admin
              captures: { fid: $.data.id }
          assert:
            - "response.status == 201"
            - "Facility.${fid}.name == Cedar EDT"
            - "Facility.${fid}.timezone == UTC"
            - "Facility.${fid}.version == 1"

      - name: create_program_missing_bed_capacity_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Program.fields.bed_capacity
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /edt/programs without bed_capacity -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A facility exists."]
          setup_api_calls:
            - call: "POST /edt/facilities"
              payload: { name: "Cedar EDT" }
              as: Admin
              captures: { fid: $.data.id }
          trigger:
            - call: "POST /edt/programs"
              payload: { facility_id: "${fid}", level_of_care: "PHP" }
              as: Admin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_program_invalid_level_of_care_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Program.fields.level_of_care
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "level_of_care not in {RESIDENTIAL,PHP,IOP,OP} -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A facility exists."]
          setup_api_calls:
            - call: "POST /edt/facilities"
              payload: { name: "Cedar EDT" }
              as: Admin
              captures: { fid: $.data.id }
          trigger:
            - call: "POST /edt/programs"
              payload: { facility_id: "${fid}", level_of_care: "DAYCARE", bed_capacity: 5 }
              as: Admin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: get_admission_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Admission
          - errors[ERR_ADMISSION_NOT_FOUND]
        distinguishing_aspect: "GET /edt/admissions/{aid} with an unknown UUID -> ERR_ADMISSION_NOT_FOUND (404)."
        test_recipe:
          setup: ["A facility exists; no admissions."]
          setup_api_calls:
            - call: "POST /edt/facilities"
              payload: { name: "Cedar EDT" }
              as: Admin
              captures: { fid: $.data.id }
          trigger:
            - call: "GET /edt/admissions/00000000-0000-4000-8000-000000000000"
              as: Intake
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_ADMISSION_NOT_FOUND"

      - name: meal_event_refused_forces_zero_completion
        claim_type: Computed Fields
        grounds:
          - entities.MealEvent.fields.refused
          - entities.MealEvent.fields.completion_fraction
          - calculations.meal_compliance_rate
        distinguishing_aspect: "A meal event with refused=true contributes 0.0 to completion_points regardless of completion_fraction; one refused event after one 1.0 event -> meal_compliance_rate 0.5."
        test_recipe:
          setup: ["An ADMITTED admission with an ACTIVE meal plan, one 1.0 event logged."]
          setup_api_calls:
            - call: "POST /edt/facilities"
              payload: { name: "Cedar EDT" }
              as: Admin
              captures: { fid: $.data.id }
            - call: "POST /edt/programs"
              payload: { facility_id: "${fid}", level_of_care: "RESIDENTIAL", bed_capacity: 5 }
              as: Admin
              captures: { pgid: $.data.id }
            - call: "POST /edt/cohorts"
              payload: { program_id: "${pgid}", facility_id: "${fid}", name: "Adult AM", age_band: "ADULT", slot_capacity: 5 }
              as: Admin
              captures: { cid: $.data.id }
            - call: "POST /edt/patients"
              payload: { facility_id: "${fid}", full_name: "Pat Q", age_band: "ADULT", bmi: 17.0 }
              as: Intake
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /edt/assessments"
              payload: { patient_id: "${pid}", facility_id: "${fid}", medical_severity: 5, behavioral_severity: 5, psychiatric_severity: 4, motivation_level: 6 }
              as: Clinician
              captures: { asid: $.data.id }
            - call: "POST /edt/assessments/${asid}/finalize"
              payload: { expected_patient_version: "${pv}" }
              as: Clinician
            - call: "POST /edt/admissions"
              payload: { patient_id: "${pid}", facility_id: "${fid}", program_id: "${pgid}", cohort_id: "${cid}", requested_length_of_stay_days: 14 }
              as: Intake
              captures: { aid: $.data.id }
            - call: "POST /edt/authorizations"
              payload: { admission_id: "${aid}", facility_id: "${fid}", payer_name: "BlueCo", daily_rate_cents: 100000, coinsurance_pct: 0.20 }
              as: UtilizationReviewer
              captures: { authid: $.data.id }
            - call: "POST /edt/reviews"
              payload: { authorization_id: "${authid}", facility_id: "${fid}", decision: "APPROVE", window_start_iso: "2026-01-01T00:00:00Z", window_end_iso: "2026-01-15T00:00:00Z" }
              as: UtilizationReviewer
            - call: "POST /edt/admissions/${aid}/promote"
              as: Intake
            - call: "POST /edt/admissions/${aid}/admit"
              as: Intake
            - call: "POST /edt/meal-plans"
              payload: { admission_id: "${aid}", facility_id: "${fid}", required_meals_per_day: 4, supervision_level: "FULL" }
              as: Dietitian
              captures: { mpid: $.data.id }
            - call: "POST /edt/meal-events"
              payload: { meal_plan_id: "${mpid}", admission_id: "${aid}", meal_type: "BREAKFAST", completion_fraction: 1.0 }
              as: Dietitian
          trigger:
            - call: "POST /edt/meal-events"
              payload: { meal_plan_id: "${mpid}", admission_id: "${aid}", meal_type: "LUNCH", completion_fraction: 1.0, refused: true }
              as: Dietitian
          assert:
            - "MealPlan.${mpid}.meals_logged == 2"
            - "MealPlan.${mpid}.completion_points == 1.0"
            - "MealPlan.${mpid}.meal_compliance_rate == 0.5"

      - name: assessment_composite_score_and_recommended_loc_computed
        claim_type: Computed Fields
        grounds:
          - calculations.recommended_level_of_care
          - entities.Assessment.fields.composite_score
          - entities.Assessment.fields.recommended_level_of_care
        distinguishing_aspect: "Assessment med=10,beh=10,psy=5,mot=10 -> composite_score 70.0 -> recommended_level_of_care RESIDENTIAL (>= 70 inclusive boundary)."
        test_recipe:
          setup: ["A facility and patient exist."]
          setup_api_calls:
            - call: "POST /edt/facilities"
              payload: { name: "Cedar EDT" }
              as: Admin
              captures: { fid: $.data.id }
            - call: "POST /edt/patients"
              payload: { facility_id: "${fid}", full_name: "Pat R", age_band: "ADULT", bmi: 19.0 }
              as: Intake
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /edt/assessments"
              payload: { patient_id: "${pid}", facility_id: "${fid}", medical_severity: 10, behavioral_severity: 10, psychiatric_severity: 5, motivation_level: 10 }
              as: Clinician
              captures: { asid: $.data.id }
          assert:
            - "Assessment.${asid}.composite_score == 70.0"
            - "Assessment.${asid}.recommended_level_of_care == RESIDENTIAL"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: medical_hold_from_waitlisted_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Admission.ADMITTED_to_MEDICAL_HOLD
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "medical-hold on a WAITLISTED (never admitted) admission -> ERR_INVALID_STATE (409); no risk change."
        test_recipe:
          setup: ["A WAITLISTED admission."]
          setup_api_calls:
            - call: "POST /edt/facilities"
              payload: { name: "Cedar EDT" }
              as: Admin
              captures: { fid: $.data.id }
            - call: "POST /edt/programs"
              payload: { facility_id: "${fid}", level_of_care: "RESIDENTIAL", bed_capacity: 5 }
              as: Admin
              captures: { pgid: $.data.id }
            - call: "POST /edt/cohorts"
              payload: { program_id: "${pgid}", facility_id: "${fid}", name: "Adult AM", age_band: "ADULT", slot_capacity: 5 }
              as: Admin
              captures: { cid: $.data.id }
            - call: "POST /edt/patients"
              payload: { facility_id: "${fid}", full_name: "Pat S", age_band: "ADULT", bmi: 17.0 }
              as: Intake
              captures: { pid: $.data.id }
            - call: "POST /edt/admissions"
              payload: { patient_id: "${pid}", facility_id: "${fid}", program_id: "${pgid}", cohort_id: "${cid}", requested_length_of_stay_days: 7 }
              as: Intake
              captures: { aid: $.data.id }
          trigger:
            - call: "POST /edt/admissions/${aid}/medical-hold"
              as: Clinician
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: admission_initial_state_is_waitlisted
        claim_type: Initial State
        grounds:
          - state_machines.Admission
          - entities.Admission.fields.clinical_status
        distinguishing_aspect: "A freshly created admission has clinical_status WAITLISTED and level_of_care unset."
        test_recipe:
          setup: ["A facility, program, cohort, patient exist."]
          setup_api_calls:
            - call: "POST /edt/facilities"
              payload: { name: "Cedar EDT" }
              as: Admin
              captures: { fid: $.data.id }
            - call: "POST /edt/programs"
              payload: { facility_id: "${fid}", level_of_care: "RESIDENTIAL", bed_capacity: 5 }
              as: Admin
              captures: { pgid: $.data.id }
            - call: "POST /edt/cohorts"
              payload: { program_id: "${pgid}", facility_id: "${fid}", name: "Adult AM", age_band: "ADULT", slot_capacity: 5 }
              as: Admin
              captures: { cid: $.data.id }
            - call: "POST /edt/patients"
              payload: { facility_id: "${fid}", full_name: "Pat T", age_band: "ADULT", bmi: 17.0 }
              as: Intake
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /edt/admissions"
              payload: { patient_id: "${pid}", facility_id: "${fid}", program_id: "${pgid}", cohort_id: "${cid}", requested_length_of_stay_days: 7 }
              as: Intake
              captures: { aid: $.data.id }
          assert:
            - "response.status == 201"
            - "Admission.${aid}.clinical_status == WAITLISTED"

      - name: discharge_terminal_admission_rejects_second_begin_discharge
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Admission.terminal_states
          - state_machines.Admission.ADMITTED_to_DISCHARGE_PENDING
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "After DISCHARGED (terminal), begin-discharge is rejected ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A fully DISCHARGED admission."]
          setup_api_calls:
            - call: "POST /edt/facilities"
              payload: { name: "Cedar EDT" }
              as: Admin
              captures: { fid: $.data.id }
            - call: "POST /edt/programs"
              payload: { facility_id: "${fid}", level_of_care: "RESIDENTIAL", bed_capacity: 5 }
              as: Admin
              captures: { pgid: $.data.id }
            - call: "POST /edt/cohorts"
              payload: { program_id: "${pgid}", facility_id: "${fid}", name: "Adult AM", age_band: "ADULT", slot_capacity: 5 }
              as: Admin
              captures: { cid: $.data.id }
            - call: "POST /edt/patients"
              payload: { facility_id: "${fid}", full_name: "Pat U", age_band: "ADULT", bmi: 17.0 }
              as: Intake
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /edt/assessments"
              payload: { patient_id: "${pid}", facility_id: "${fid}", medical_severity: 5, behavioral_severity: 5, psychiatric_severity: 4, motivation_level: 6 }
              as: Clinician
              captures: { asid: $.data.id }
            - call: "POST /edt/assessments/${asid}/finalize"
              payload: { expected_patient_version: "${pv}" }
              as: Clinician
            - call: "POST /edt/admissions"
              payload: { patient_id: "${pid}", facility_id: "${fid}", program_id: "${pgid}", cohort_id: "${cid}", requested_length_of_stay_days: 14 }
              as: Intake
              captures: { aid: $.data.id }
            - call: "POST /edt/authorizations"
              payload: { admission_id: "${aid}", facility_id: "${fid}", payer_name: "BlueCo", daily_rate_cents: 100000, coinsurance_pct: 0.20 }
              as: UtilizationReviewer
              captures: { authid: $.data.id }
            - call: "POST /edt/reviews"
              payload: { authorization_id: "${authid}", facility_id: "${fid}", decision: "APPROVE", window_start_iso: "2026-01-01T00:00:00Z", window_end_iso: "2026-01-15T00:00:00Z" }
              as: UtilizationReviewer
            - call: "POST /edt/admissions/${aid}/promote"
              as: Intake
            - call: "POST /edt/admissions/${aid}/admit"
              as: Intake
            - call: "POST /edt/family-programs"
              payload: { admission_id: "${aid}", facility_id: "${fid}", family_contact_name: "Kin", sessions_required: 1 }
              as: Clinician
              captures: { fpid: $.data.id }
            - call: "POST /edt/family-programs/${fpid}/waive"
              as: Clinician
            - call: "POST /edt/discharge-plans"
              payload: { admission_id: "${aid}", facility_id: "${fid}", aftercare_level_of_care: "IOP", relapse_warning_signs: "skipping meals", relapse_plan_complete: true }
              as: Clinician
              captures: { dpid: $.data.id }
            - call: "POST /edt/discharge-plans/${dpid}/finalize"
              as: Clinician
            - call: "POST /edt/admissions/${aid}/begin-discharge"
              as: Clinician
            - call: "POST /edt/admissions/${aid}/discharge"
              as: Clinician
          trigger:
            - call: "POST /edt/admissions/${aid}/begin-discharge"
              as: Clinician
              captures: { err: $.data.error_id }
          assert:
            - "Admission.${aid}.clinical_status == DISCHARGED"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: treatment_plan_activate_before_all_disciplines_signed_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.TreatmentPlan.DRAFT_to_ACTIVE
          - errors[ERR_DISCIPLINES_INCOMPLETE]
        distinguishing_aspect: "activate with only THERAPY+MEDICAL signed (DIETITIAN unsigned) -> ERR_DISCIPLINES_INCOMPLETE (409); the fork-join join blocks."
        test_recipe:
          setup: ["A DRAFT treatment plan with THERAPY and MEDICAL signed, DIETITIAN not signed."]
          setup_api_calls:
            - call: "POST /edt/facilities"
              payload: { name: "Cedar EDT" }
              as: Admin
              captures: { fid: $.data.id }
            - call: "POST /edt/programs"
              payload: { facility_id: "${fid}", level_of_care: "RESIDENTIAL", bed_capacity: 5 }
              as: Admin
              captures: { pgid: $.data.id }
            - call: "POST /edt/cohorts"
              payload: { program_id: "${pgid}", facility_id: "${fid}", name: "Adult AM", age_band: "ADULT", slot_capacity: 5 }
              as: Admin
              captures: { cid: $.data.id }
            - call: "POST /edt/patients"
              payload: { facility_id: "${fid}", full_name: "Pat V", age_band: "ADULT", bmi: 17.0 }
              as: Intake
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /edt/assessments"
              payload: { patient_id: "${pid}", facility_id: "${fid}", medical_severity: 5, behavioral_severity: 5, psychiatric_severity: 4, motivation_level: 6 }
              as: Clinician
              captures: { asid: $.data.id }
            - call: "POST /edt/assessments/${asid}/finalize"
              payload: { expected_patient_version: "${pv}" }
              as: Clinician
            - call: "POST /edt/admissions"
              payload: { patient_id: "${pid}", facility_id: "${fid}", program_id: "${pgid}", cohort_id: "${cid}", requested_length_of_stay_days: 14 }
              as: Intake
              captures: { aid: $.data.id }
            - call: "POST /edt/authorizations"
              payload: { admission_id: "${aid}", facility_id: "${fid}", payer_name: "BlueCo", daily_rate_cents: 100000, coinsurance_pct: 0.20 }
              as: UtilizationReviewer
              captures: { authid: $.data.id }
            - call: "POST /edt/reviews"
              payload: { authorization_id: "${authid}", facility_id: "${fid}", decision: "APPROVE", window_start_iso: "2026-01-01T00:00:00Z", window_end_iso: "2026-01-15T00:00:00Z" }
              as: UtilizationReviewer
            - call: "POST /edt/admissions/${aid}/promote"
              as: Intake
            - call: "POST /edt/admissions/${aid}/admit"
              as: Intake
            - call: "POST /edt/treatment-plans"
              payload: { admission_id: "${aid}", facility_id: "${fid}", goals_total: 5 }
              as: Clinician
              captures: { tpid: $.data.id }
            - call: "POST /edt/treatment-plans/${tpid}/sign"
              payload: { discipline: "THERAPY" }
              as: Clinician
            - call: "POST /edt/treatment-plans/${tpid}/sign"
              payload: { discipline: "MEDICAL" }
              as: Clinician
          trigger:
            - call: "POST /edt/treatment-plans/${tpid}/activate"
              as: Clinician
              captures: { err: $.data.error_id }
          assert:
            - "TreatmentPlan.${tpid}.therapy_signed == true"
            - "TreatmentPlan.${tpid}.dietitian_signed == false"
            - "response.data.error_id == ERR_DISCIPLINES_INCOMPLETE"

      - name: discharge_plan_finalize_without_relapse_plan_complete_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.DischargePlan.DRAFT_to_FINALIZED
          - errors[ERR_RELAPSE_PLAN_INCOMPLETE]
        distinguishing_aspect: "finalize on a discharge plan with relapse_plan_complete=false -> ERR_RELAPSE_PLAN_INCOMPLETE (409); status stays DRAFT."
        test_recipe:
          setup: ["A DRAFT discharge plan with relapse_plan_complete=false on an admission."]
          setup_api_calls:
            - call: "POST /edt/facilities"
              payload: { name: "Cedar EDT" }
              as: Admin
              captures: { fid: $.data.id }
            - call: "POST /edt/programs"
              payload: { facility_id: "${fid}", level_of_care: "RESIDENTIAL", bed_capacity: 5 }
              as: Admin
              captures: { pgid: $.data.id }
            - call: "POST /edt/cohorts"
              payload: { program_id: "${pgid}", facility_id: "${fid}", name: "Adult AM", age_band: "ADULT", slot_capacity: 5 }
              as: Admin
              captures: { cid: $.data.id }
            - call: "POST /edt/patients"
              payload: { facility_id: "${fid}", full_name: "Pat W", age_band: "ADULT", bmi: 17.0 }
              as: Intake
              captures: { pid: $.data.id }
            - call: "POST /edt/admissions"
              payload: { patient_id: "${pid}", facility_id: "${fid}", program_id: "${pgid}", cohort_id: "${cid}", requested_length_of_stay_days: 7 }
              as: Intake
              captures: { aid: $.data.id }
            - call: "POST /edt/discharge-plans"
              payload: { admission_id: "${aid}", facility_id: "${fid}", aftercare_level_of_care: "OP", relapse_warning_signs: "isolation", relapse_plan_complete: false }
              as: Clinician
              captures: { dpid: $.data.id }
          trigger:
            - call: "POST /edt/discharge-plans/${dpid}/finalize"
              as: Clinician
              captures: { err: $.data.error_id }
          assert:
            - "DischargePlan.${dpid}.status == DRAFT"
            - "response.data.error_id == ERR_RELAPSE_PLAN_INCOMPLETE"

      - name: step_down_from_op_returns_already_lowest_loc
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Admission.level_of_care_step_down
          - errors[ERR_ALREADY_LOWEST_LOC]
        distinguishing_aspect: "Step-down on an admission already at level_of_care OP -> ERR_ALREADY_LOWEST_LOC (409)."
        test_recipe:
          setup: ["An ADMITTED admission into an OP program (level_of_care OP), ACTIVE treatment plan, meal plan with 3 events at 0.9."]
          setup_api_calls:
            - call: "POST /edt/facilities"
              payload: { name: "Cedar EDT" }
              as: Admin
              captures: { fid: $.data.id }
            - call: "POST /edt/programs"
              payload: { facility_id: "${fid}", level_of_care: "OP", bed_capacity: 5 }
              as: Admin
              captures: { pgid: $.data.id }
            - call: "POST /edt/cohorts"
              payload: { program_id: "${pgid}", facility_id: "${fid}", name: "Adult OP", age_band: "ADULT", slot_capacity: 5 }
              as: Admin
              captures: { cid: $.data.id }
            - call: "POST /edt/patients"
              payload: { facility_id: "${fid}", full_name: "Pat Z", age_band: "ADULT", bmi: 19.0 }
              as: Intake
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /edt/assessments"
              payload: { patient_id: "${pid}", facility_id: "${fid}", medical_severity: 3, behavioral_severity: 3, psychiatric_severity: 2, motivation_level: 8 }
              as: Clinician
              captures: { asid: $.data.id }
            - call: "POST /edt/assessments/${asid}/finalize"
              payload: { expected_patient_version: "${pv}" }
              as: Clinician
            - call: "POST /edt/admissions"
              payload: { patient_id: "${pid}", facility_id: "${fid}", program_id: "${pgid}", cohort_id: "${cid}", requested_length_of_stay_days: 7 }
              as: Intake
              captures: { aid: $.data.id }
            - call: "POST /edt/authorizations"
              payload: { admission_id: "${aid}", facility_id: "${fid}", payer_name: "BlueCo", daily_rate_cents: 50000, coinsurance_pct: 0.10 }
              as: UtilizationReviewer
              captures: { authid: $.data.id }
            - call: "POST /edt/reviews"
              payload: { authorization_id: "${authid}", facility_id: "${fid}", decision: "APPROVE", window_start_iso: "2026-01-01T00:00:00Z", window_end_iso: "2026-01-08T00:00:00Z" }
              as: UtilizationReviewer
            - call: "POST /edt/admissions/${aid}/promote"
              as: Intake
            - call: "POST /edt/admissions/${aid}/admit"
              as: Intake
            - call: "POST /edt/treatment-plans"
              payload: { admission_id: "${aid}", facility_id: "${fid}", goals_total: 2 }
              as: Clinician
              captures: { tpid: $.data.id }
            - call: "POST /edt/treatment-plans/${tpid}/sign"
              payload: { discipline: "THERAPY" }
              as: Clinician
            - call: "POST /edt/treatment-plans/${tpid}/sign"
              payload: { discipline: "MEDICAL" }
              as: Clinician
            - call: "POST /edt/treatment-plans/${tpid}/sign"
              payload: { discipline: "DIETITIAN" }
