            - "Subscription.${gsub_id}.billing_status == PREPAID"
            - "Subscription.${gsub_id}.prepaid_periods_remaining == 3"
            - "GiftGrant.${gift_id}.status == REDEEMED and redeemed_subscription_id == ${gsub_id}"

