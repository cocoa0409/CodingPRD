            - "${err_404} == \"ERR_PATIENT_NOT_FOUND\" with HTTP 404"
            - "${err_409} == \"ERR_DUPLICATE_IDENTIFIER\" with HTTP 409"
            - "${err_412} == \"ERR_STALE_PATIENT_VERSION\" with HTTP 412"
            - "${err_422} == \"ERR_INVALID_REQUEST\" with HTTP 422"
            - "every one of the five responses has response_type == \"error\", data keys exactly {error_id, message} with a non-empty message, and a non-null meta.api_request_id"
            - "Patient.${pat_id}.version == ${pat_v} and full_name == \"Pat One\" (no rejected body mutated the row)"

  - section: rbac
    instances:
      - name: a_blank_identity_header_is_unauthenticated_not_forbidden
        claim_type: unauthenticated_request
        grounds:
          - validations.priority_1_ERR_UNAUTHENTICATED
          - roles
        distinguishing_aspect: "Priority 1 treats a header sent as the empty string exactly like an absent header, and it answers before the role membership test: a blank X-User-Role, a blank X-User-ID, and both blank all return ERR_UNAUTHENTICATED 401 rather than ERR_FORBIDDEN_ROLE 403."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Patient RH0001 exists; the requests below differ from a well-formed RegistryAdmin read only in their identity headers."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /patients"
              payload: { mrn: "RH0001", full_name: "Pat One", date_of_birth: "1975-04-12", diagnosis_code: "RA_SEROPOSITIVE", registry_consent: true }
              as: RegistryAdmin
              captures: { pat_id: $.data.id }
          trigger:
            - call: "GET /patients/${pat_id}"
              payload: {}
              as: ""
              as_user_id: "registry-alpha"
              captures: { err_no_role: $.data.error_id }
            - call: "GET /patients/${pat_id}"
              payload: {}
              as: RegistryAdmin
              as_user_id: ""
              captures: { err_no_user: $.data.error_id }
            - call: "POST /patients"
              payload: { mrn: "RH0002", full_name: "Pat Two", date_of_birth: "1980-09-30", diagnosis_code: "PSA", registry_consent: true }
              as: ""
              as_user_id: ""
              captures: { err_neither: $.data.error_id }
          assert:
            - "${err_no_role} == \"ERR_UNAUTHENTICATED\" with HTTP 401"
            - "${err_no_user} == \"ERR_UNAUTHENTICATED\" with HTTP 401"
            - "${err_neither} == \"ERR_UNAUTHENTICATED\" with HTTP 401 (not ERR_FORBIDDEN_ROLE)"
            - "no Patient with mrn == \"RH0002\" exists after the third call"

      - name: each_exclusive_operation_rejects_every_role_that_does_not_own_it
        claim_type: role_denied_operations
        grounds:
          - validations.priority_2_ERR_FORBIDDEN_ROLE
          - roles.Rheumatologist.exclusive_operations
          - roles.PriorAuthCoordinator.exclusive_operations
          - roles.PayerReviewer.exclusive_operations
          - roles.InfusionNurse.exclusive_operations
          - roles.BenefitsCounselor.exclusive_operations
          - roles.RegistryAdmin.exclusive_operations
        distinguishing_aspect: "Priority 2 runs before every existence check, so an all-zero path id still answers ERR_FORBIDDEN_ROLE 403: the payer cannot submit, the coordinator cannot decide, the rheumatologist cannot check a patient in or create reference data, the counselor cannot run the ops sweep, and an unknown role string is forbidden rather than unauthenticated."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Only the logical clock and one Patient are seeded; every trigger below is refused on the role alone."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /patients"
              payload: { mrn: "RH0001", full_name: "Pat One", date_of_birth: "1975-04-12", diagnosis_code: "RA_SEROPOSITIVE", registry_consent: true }
              as: RegistryAdmin
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /patients"
              payload: { mrn: "RH0009", full_name: "Nine", date_of_birth: "1970-01-01", diagnosis_code: "PSA", registry_consent: true }
              as: Rheumatologist
              as_user_id: "rheum-alpha"
              captures: { err_admin_only: $.data.error_id }
            - call: "POST /authorizations/00000000-0000-0000-0000-000000000000/submit"
              payload: {}
              as: PayerReviewer
              as_user_id: "payer-alpha"
              captures: { err_payer_submit: $.data.error_id }
            - call: "POST /authorizations/00000000-0000-0000-0000-000000000000/determination"
              payload: { decision: "APPROVED" }
              as: PriorAuthCoordinator
              as_user_id: "pac-alpha"
              captures: { err_pac_decide: $.data.error_id }
            - call: "POST /visits/00000000-0000-0000-0000-000000000000/check-in"
              payload: {}
              as: Rheumatologist
              as_user_id: "rheum-alpha"
              captures: { err_rheum_checkin: $.data.error_id }
            - call: "POST /assistance-enrollments"
              payload: { episode_id: "00000000-0000-0000-0000-000000000000", program_type: "FOUNDATION_GRANT", annual_benefit_cents: 50000, coverage_start: "2026-08-01T00:00:00Z" }
              as: PriorAuthCoordinator
              as_user_id: "pac-alpha"
              captures: { err_pac_enroll: $.data.error_id }
            - call: "POST /_ops/run-reauthorization-calendar"
              payload: {}
              as: BenefitsCounselor
              as_user_id: "counselor-alpha"
              captures: { err_counselor_sweep: $.data.error_id }
            - call: "GET /patients/${pat_id}"
              payload: {}
              as: "ChiefOfStaff"
              as_user_id: "chief-alpha"
              captures: { err_unknown_role: $.data.error_id }
          assert:
            - "${err_admin_only} == \"ERR_FORBIDDEN_ROLE\" with HTTP 403"
            - "${err_payer_submit} == \"ERR_FORBIDDEN_ROLE\" with HTTP 403 (403 wins over the 404 the unknown id would otherwise produce)"
            - "${err_pac_decide} == \"ERR_FORBIDDEN_ROLE\" with HTTP 403"
            - "${err_rheum_checkin} == \"ERR_FORBIDDEN_ROLE\" with HTTP 403"
            - "${err_pac_enroll} == \"ERR_FORBIDDEN_ROLE\" with HTTP 403"
            - "${err_counselor_sweep} == \"ERR_FORBIDDEN_ROLE\" with HTTP 403"
            - "${err_unknown_role} == \"ERR_FORBIDDEN_ROLE\" with HTTP 403 (an unrecognised role is forbidden, not unauthenticated)"
            - "no Patient with mrn == \"RH0009\" and no AssistanceEnrollment row exists afterwards"

      - name: formulary_exception_attestation_needs_a_rheumatologist_holding_the_privilege
        claim_type: role_denied_operations
        grounds:
          - validations.priority_3_ERR_CLINICIAN_NOT_AUTHORIZED_TO_ATTEST
          - entities.Clinician.fields.can_attest_formulary_exception
          - endpoints.POST_/authorizations/{id}/attest-exception
        distinguishing_aspect: "Passing the X-User-Role gate is not enough for attest-exception: the Clinician resolved from X-User-ID must exist, be a RHEUMATOLOGIST and carry can_attest_formulary_exception true, so the unprivileged rheumatologist and the nurse id both answer ERR_CLINICIAN_NOT_AUTHORIZED_TO_ATTEST 403 while the privileged rheumatologist succeeds."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. RHEUM1 (npi 1234567893) has can_attest_formulary_exception true, RHEUM2 (npi 1234567894) has it false, and NURSE1 (npi 1234567895) has role_type NURSE."
            - "Patient RH0001 has a PLANNED Tocilizumab episode on a plan that requires the TNFI class, and its DRAFT authorization has formulary_exception_requested true with exception_attested_by_clinician_id null."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
