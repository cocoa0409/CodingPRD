            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "Agg V", submitted_tin: "951951951", submitted_tin_type: "SSN", signature_name: "A" }, as: APClerk, captures: { w9: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w9}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 30000, payment_date: "2025-06-01T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "CORP_CARD", payment_type: "SERVICE", amount_cents: 20000, payment_date: "2025-06-02T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "MANUAL", payment_type: "SERVICE", amount_cents: 10000, payment_date: "2025-06-03T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "FIELD_OFFICE", payment_type: "SERVICE", amount_cents: 5000, payment_date: "2025-06-04T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "MANUAL", payment_type: "SERVICE", amount_cents: 7000, payment_date: "2025-06-05T00:00:00Z" }, as: APClerk, captures: { pv: $.data.id } }
            - { call: "POST /tax1099/payments/${pv}/void", payload: {}, as: APClerk }
          trigger:
            - { call: "POST /tax1099/returns/generate", payload: { tax_year: 2025 }, as: TaxSpecialist }
            - { call: "GET /tax1099/returns", payload: { vendor_id: "${v}" }, as: TaxSpecialist }
          assert:
            - "$.data[0].box_amounts.box_1_cents == 65000 (voided 7000c payment excluded)"

      - name: c_state_channel_cfsf_direct_not_required
        claim_type: correct_result
        grounds: [calculations.state_direct_reporting_channel, entities.StateObligation.fields.required_channel]
        distinguishing_aspect: "The same 70000c reportable total yields CFSF_FORWARD in a CFSF state (CA), DIRECT_FILE in a non-CFSF state under threshold (TX, 50000c), and NOT_REQUIRED in a non-CFSF state above the total (NY, 200000c)."
        test_recipe:
          setup:
            - "TaxYear 2025 OPEN; StateRules CA (CFSF, thr 0), TX (direct, thr 50000c), NY (direct, thr 200000c), all effective 2020-01-01..2030-12-31 (covers default clock 2026-08-01)"
            - "Three MATCHED vendors domiciled in CA/TX/NY, each with a SERVICE 70000c payment"
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/state-rules", payload: { state_code: "CA", participates_in_cfsf: true, direct_reporting_threshold_cents: 0, effective_from: "2020-01-01T00:00:00Z", effective_to: "2030-12-31T00:00:00Z" }, as: TaxAdmin }
