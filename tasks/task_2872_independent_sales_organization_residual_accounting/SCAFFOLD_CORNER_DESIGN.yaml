              captures: { e5: $.data.error_id }
            - call: "POST /processor-programs"
              payload: { name: "Controller Program", buy_rate_bps: 45, buy_rate_per_item_cents: 6, assessment_bps: 13, normalization_mode: "NET_REVENUE_SPLIT", minimum_billing_mode: "NO_MINIMUM" }
