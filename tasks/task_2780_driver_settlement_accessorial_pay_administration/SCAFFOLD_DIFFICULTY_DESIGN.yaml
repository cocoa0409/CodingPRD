            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T18:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/loads/${load_o}/deliver"
              payload: {}
              as: SettlementClerk
            - call: "POST /driver-pay/accessorial-claims/${clm_o}/approve"
              payload: {}
              as: SettlementClerk
              as_user_id: "clerk-01"
          assert:
            - "the first approve returns HTTP 409 with error_id ERR_LOAD_NOT_DELIVERED"
            - "AccessorialClaim.${clm_o}.status == SUBMITTED and AccessorialClaim.${clm_o}.amount_cents == 0 after the first attempt"
            - "after delivery Load.${load_o}.movement_status == DELIVERED and Load.${load_o}.pay_status == ACCRUED"
            - "the second approve succeeds and AccessorialClaim.${clm_o}.status == APPROVED"
            - "AccessorialClaim.${clm_o}.billable_units == 1 and AccessorialClaim.${clm_o}.amount_cents == 7500"

      - name: driver_assignment_requires_active_package
        grounds:
          - validations[priority=18]
          - entities.PayPackage.fields.status
          - entities.Driver.fields.pay_package_id
          - state_machines.PayPackage.DRAFT_to_ACTIVE
          - state_machines.Driver.NOT_REQUIRED_to_COLLECTING
        distinguishing_aspect: |
          A different cross-entity direction and a different pair of entities from the claim/load
          instance: the write targets the DRIVER while the blocking state lives on the PAY PACKAGE.
          Assigning a fully-componented but DRAFT package fails with ERR_PAY_PACKAGE_NOT_ACTIVE, and
          activating the package - a write to neither the driver nor the request - makes the identical
          assignment succeed and cascades the driver escrow_status NOT_REQUIRED -> COLLECTING.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "package PKG_P: LEASED_OPERATOR, PRACTICAL, per_diem_method DAY_BASED, escrow_required true, escrow_target_cents 250000, escrow_monthly_deduction_cents 40000, with PER_MILE 58 and REVENUE_PERCENT 2500 bps components, left in DRAFT"
            - "driver DRV_P2 registered with no pay package, escrow_status NOT_REQUIRED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages"
              payload: { name: "Leased Draft Package", driver_type: "LEASED_OPERATOR", mileage_guide: "PRACTICAL", per_diem_method: "DAY_BASED", escrow_required: true, escrow_target_cents: 250000, escrow_monthly_deduction_cents: 40000 }
              as: PayrollAdmin
              captures: { pkg_p2: $.data.id }
            - call: "POST /driver-pay/pay-packages/${pkg_p2}/components"
              payload: { component_type: "PER_MILE", unit: "MILE", rate_value: 58, sequence: 1 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_p2}/components"
              payload: { component_type: "REVENUE_PERCENT", unit: "PERCENT_BPS", rate_value: 2500, sequence: 2 }
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers"
              payload: { legal_name: "Pete Pending", driver_type: "LEASED_OPERATOR", home_state: "TX", per_diem_elected: true }
              as: PayrollAdmin
              captures: { drv_p2: $.data.id }
          trigger:
            - call: "POST /driver-pay/drivers/${drv_p2}/assign-pay-package"
              payload: { pay_package_id: "${pkg_p2}" }
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers/${drv_p2}/status"
              payload: { new_status: "ACTIVE" }
              as: PayrollAdmin
              captures: { err_p2: $.data.error_id }
            - call: "POST /driver-pay/pay-packages/${pkg_p2}/activate"
              payload: {}
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers/${drv_p2}/assign-pay-package"
              payload: { pay_package_id: "${pkg_p2}" }
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers/${drv_p2}/status"
              payload: { new_status: "ACTIVE" }
              as: PayrollAdmin
          assert:
            - "the first assignment returns HTTP 409 with error_id ERR_PAY_PACKAGE_NOT_ACTIVE"
            - "Driver.${drv_p2}.pay_package_id == null and Driver.${drv_p2}.escrow_status == NOT_REQUIRED after the first attempt"
            - "PayPackage.${pkg_p2}.status == ACTIVE and PayPackage.${pkg_p2}.component_count == 2 after activation"
            - "the second assignment succeeds and Driver.${drv_p2}.pay_package_id == ${pkg_p2}"
            - "Driver.${drv_p2}.escrow_status == COLLECTING and Driver.${drv_p2}.escrow_target_cents == 250000 and Driver.${drv_p2}.escrow_monthly_deduction_cents == 40000"
            - "Driver.${drv_p2}.escrow_balance_cents == 0"

  - rule_id: resource_temporal_overlap
    instances:
