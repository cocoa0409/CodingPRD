              payload: { sme_expert_id: "${exp_id}", expected_expert_version: "${exp_v2}" }
              as: ManagingEditor
              captures: { err_id: $.data.error_id }
            - call: "POST /editorial/briefs/${brief_c_id}/assign-sme"
              payload: { sme_expert_id: "${exp_id}", expected_expert_version: "${exp_v2}" }
              as: ManagingEditor
          assert:
