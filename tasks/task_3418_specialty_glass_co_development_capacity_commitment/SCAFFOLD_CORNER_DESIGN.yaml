          trigger:
            - { call: "POST /glass/campaigns", payload: { tank_id: "${t_id}", composition_id: "${cx_id}", start_date: "2028-03-01T00:00:00Z", end_date: "2029-03-01T00:00:00Z", planned_units: 20000 }, as: CapacityPlanner, captures: { a_good: $.data.expected_good_units, a_cost: $.data.provisional_unit_cost_cents } }
            - { call: "POST /glass/campaigns", payload: { tank_id: "${t_id}", composition_id: "${cx_id}", start_date: "2029-03-01T00:00:00Z", end_date: "2030-03-01T00:00:00Z", planned_units: 80000 }, as: CapacityPlanner, captures: { b_good: $.data.expected_good_units, b_cost: $.data.provisional_unit_cost_cents } }
          assert:
            - "campaign A (20000 planned): expected_good_units == 15600 (0.78 tier) and provisional_unit_cost_cents == 1244"
            - "campaign B (80000 planned, same composition, adjacent start == prior end): expected_good_units == 72000 (0.90 tier) and provisional_unit_cost_cents == 1012 (ceil((850+60)/0.90), no changeover for same composition)"

      - name: royalty_tier_boundary_100000_units
        claim_type: constants_applied
        grounds: ["calculations.royalty_statement"]
        distinguishing_aspect: "Tier 1 rate applies at exactly CONST.ROYALTY_T1_MAX_UNITS total units (<= semantics); 100001 units drops the whole report to the tier-2 rate (average, not marginal)."
