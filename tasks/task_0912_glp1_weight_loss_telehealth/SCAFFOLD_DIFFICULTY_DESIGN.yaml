              captures: { cs2_id: "$.data.id" }
            - call: "POST /glp1/coaching-sessions"
              payload: { subscription_id: "${sub_id}", coach_provider_id: "${coach_id}", scheduled_start_at: "2026-06-07T16:00:00Z", scheduled_end_at: "2026-06-07T17:00:00Z" }
              as: Patient
