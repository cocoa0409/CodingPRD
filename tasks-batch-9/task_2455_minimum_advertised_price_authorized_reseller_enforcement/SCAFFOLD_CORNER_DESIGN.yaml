        distinguishing_aspect: "voided_violation_count is a persisted count of the cascade's own reach: with two MARKETPLACE violations inside the window at 14000 and one RETAILER_SITE violation at 12000 below the 13000 override, exactly two are voided."
        test_recipe:
          setup: ["Two violations from 14000 MARKETPLACE listings (V1 NOTICED, V3 DETECTED) and one from a 12000 RETAILER_SITE listing (V4 DETECTED), all observed 2026-08-18/19; a REQUESTED ALL-scope exception over [2026-08-10, 2026-08-25) asking for 13000."]
