              as: ComplianceOfficer
            - call: "POST /bpo/client-accounts"
              payload: { client_code: "CT2", display_name: "T2 Co", sla_hours_standard: 48, sla_hours_rush: 24 }
              as: PlatformAdmin
              captures: { cl_t2: $.data.id }
            - call: "POST /bpo/brokers"
              payload: { broker_code: "BT2", full_name: "T2 Broker", email: "bt2@x.com", max_concurrent_orders: 5 }
              as: ComplianceOfficer
              captures: { brk_t2: $.data.id }
            - call: "POST /bpo/brokers/${brk_t2}/licenses"
              payload: { state_code: "VA", license_kind: "BPO", license_number: "L3", expires_on: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /bpo/brokers/${brk_t2}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /bpo/properties"
              payload: { street_address: "5 V", city: "RIC", state_code: "VA", postal_code: "23219", living_area_sqft: 1000, lot_area_sqft: 3000, year_built: 1990, property_type: "SINGLE_FAMILY" }
              as: OperationsManager
              captures: { prop_t2: $.data.id }
            - call: "POST /bpo/properties"
              payload: { street_address: "6 C", city: "RIC", state_code: "VA", postal_code: "23220", living_area_sqft: 1000, lot_area_sqft: 3000, year_built: 1990, property_type: "SINGLE_FAMILY" }
              as: OperationsManager
              captures: { cmp_v1: $.data.id }
            - call: "POST /bpo/properties"
              payload: { street_address: "7 C", city: "RIC", state_code: "VA", postal_code: "23221", living_area_sqft: 1000, lot_area_sqft: 3000, year_built: 1990, property_type: "SINGLE_FAMILY" }
              as: OperationsManager
              captures: { cmp_v2: $.data.id }
            - call: "POST /bpo/properties"
              payload: { street_address: "8 C", city: "RIC", state_code: "VA", postal_code: "23222", living_area_sqft: 1000, lot_area_sqft: 3000, year_built: 1990, property_type: "SINGLE_FAMILY" }
              as: OperationsManager
              captures: { cmp_v3: $.data.id }
            - call: "POST /bpo/valuation-orders"
