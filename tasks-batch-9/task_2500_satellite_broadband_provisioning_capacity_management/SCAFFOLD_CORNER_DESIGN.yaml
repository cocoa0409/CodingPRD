            - "Subscription.${sn1_id}.priority_state == DEPRIORITIZED"
            - "Subscription.${sn1_id}.deprioritized_at == 2026-08-01T00:00:00.000Z"
            - "Subscription.${sn1_id}.effective_rate_mbps == 20"
            - "Subscription.${sn1_id}.service_state == ACTIVE and authorization_state == AUTHORIZED_FIXED"
            - "Beam.${beam_id}.weighted_sold_mbps == 50 (200 * DEPRIORITIZED_WEIGHT 0.25)"
            - "Beam.${beam_id}.oversubscription_ratio == 0.5 and capacity_state == NORMAL"

