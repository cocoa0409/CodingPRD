  - rule_id: resource_temporal_overlap
    instances:
      - name: generator_buffer_rejects_a_ten_minute_gap_and_accepts_the_exact_fifteen_minute_boundary
        grounds:
          - calculations.machine_bay_occupation_feasibility
          - validations[priority=380]
          - errors.ERR_MACHINE_WINDOW_CONFLICT
          - entities.LabMachine.fields.calibration_buffer_minutes
        distinguishing_aspect: |
          LabMachine occupation is EXCLUSIVE and buffer-padded: the existing 09:00-10:00 surfacing
          window blocks anything starting before 10:15, so a 10:10 start is refused and a 10:15 start
          is accepted because the buffered comparison is strictly less-than.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; plan, patient, PRG-HI167 and an 80.0 mm lot of 2 configured."
            - "GEN-1 commissioned AVAILABLE with calibration_buffer_minutes 15."
            - "Verified prescription, order, COMPUTED 77.0 mm layout and a SURFACE_AND_EDGE job."
            - "One SCHEDULED surfacing operation already occupies GEN-1 from 09:00 to 10:00; the job's version was re-read afterwards."
