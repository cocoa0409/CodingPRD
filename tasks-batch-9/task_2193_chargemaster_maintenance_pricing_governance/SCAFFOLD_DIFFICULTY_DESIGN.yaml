          recovery_captured_charge_id: ${l2_id}
        as: RevenueIntegrityAnalyst
        as_user_id: analyst_1
      - call: POST /chargemaster/missing-charge-findings/${f3_id}/disposition
        payload:
          action: RESOLVE
          disposition_note: late-posted companion line located for ENC-2
          recovery_captured_charge_id: ${l4_id}
        as: RevenueIntegrityAnalyst
        as_user_id: analyst_1
      assert:
      - ChargeItem.${item_c_id}.gross_charge_cents == 128000
      - ChargeItem.${item_t_id}.gross_charge_cents == 240000
      - Facility.${fac_id}.aggregate_gross_charge_cents == 368000
      - Facility.${fac_id}.aggregate_markup_ratio_bp == 26286
      - CapturedCharge.${l1_id}.expected_charge_cents == 480000
      - CapturedCharge.${l1_id}.line_variance_bp == 0
      - CapturedCharge.${l1_id}.match_status == MATCHED
      - ChargeCaptureBatch.${batch_id}.mean_line_variance_bp == 0
      - ChargeCaptureBatch.${batch_id}.matched_line_count == 4
      - ChargeCaptureBatch.${batch_id}.exception_line_count == 0
      - ChargeCaptureBatch.${batch_id}.total_posted_charge_cents == 1472000
      - ChargeCaptureBatch.${batch_id}.total_expected_charge_cents == 1472000
      - MissingChargeFinding.${f1_id}.estimated_lost_charge_cents == 256000
      - MissingChargeFinding.${f3_id}.estimated_lost_charge_cents == 256000
      - 'after trigger step 1: Department.${dept_id}.unresolved_finding_amount_cents == 256000 AND Department.${dept_id}.recovered_charge_cents == 0 AND Department.${dept_id}.capture_hold == false'
      - 'after trigger step 2: Department.${dept_id}.unresolved_finding_amount_cents == 512000 AND Department.${dept_id}.recovered_charge_cents == 0'
      - 'after trigger step 2: Department.${dept_id}.capture_hold == true (512000 >= 500000)'
      - 'after trigger step 2: INVARIANT unresolved_finding_amount_cents + recovered_charge_cents == 512000'
      - 'after trigger step 3: Department.${dept_id}.unresolved_finding_amount_cents == 256000 AND Department.${dept_id}.recovered_charge_cents == 256000'
      - 'after trigger step 3: INVARIANT unresolved_finding_amount_cents + recovered_charge_cents == 512000 (unchanged by the compensating action)'
      - 'after trigger step 3: Department.${dept_id}.capture_hold == false'
      - 'after trigger step 4: Department.${dept_id}.unresolved_finding_amount_cents == 0 AND Department.${dept_id}.recovered_charge_cents == 512000'
      - 'after trigger step 4: INVARIANT unresolved_finding_amount_cents + recovered_charge_cents == 512000'
      - 'after trigger step 4: MissingChargeFinding.${f1_id}.status == RESOLVED AND MissingChargeFinding.${f1_id}.recovery_captured_charge_id == ${l2_id}'
      - 'after trigger step 4: MissingChargeFinding.${f3_id}.status == RESOLVED AND MissingChargeFinding.${f3_id}.recovery_captured_charge_id == ${l4_id}'
      - 'after trigger step 4: MissingChargeFinding.${f1_id}.estimated_lost_charge_cents == 256000 (frozen at creation, never recomputed)'
      - 'after trigger step 4: ChargeCaptureBatch.${batch_id}.open_finding_count == 0'
  - name: compensating_invariant__facility_active_census_and_aggregate_gross_conserved_across_cycle_activate_then_rollback
    grounds:
    - state_machines.CodeUpdateCycle.CROSSWALK_APPROVED_to_ACTIVATED
    - state_machines.CodeUpdateCycle.ACTIVATED_to_ROLLED_BACK
    - state_machines.CodeUpdateEntry.MAPPED_to_APPLIED
    - state_machines.CodeUpdateEntry.APPLIED_to_REVERTED
    - entities.Facility.fields.active_item_count
    - entities.Facility.fields.aggregate_gross_charge_cents
    - entities.CodeUpdateCycle.fields.pre_activation_active_item_count
    - entities.CodeUpdateCycle.fields.pre_activation_aggregate_gross_charge_cents
    - calculations.code_update_crosswalk_price_carry
    - calculations.gross_charge_from_price_rule
    distinguishing_aspect: 'The conserved quantities here are the Facility''s published-charge CENSUS PAIR

      (active_item_count, aggregate_gross_charge_cents) — structurally different from the

      Department leakage money split of the CONFIRM/RESOLVE invariant — and the annual

      code-cycle ROLL_BACK must restore them to exactly (2, 704000) after ACTIVATE moved them

      to (1, 422400) by crosswalking one item onto a new revenue code and deactivating another.

      '
    test_recipe:
      setup:
      - Logical clock pinned at 2026-08-01T00:00:00Z.
      - Facility with rounding_mode NEAREST_CENT and aggregate_markup_limit_bp 40000; one department; two ACTIVE revenue codes 0300 (RC1) and 0301 (RC2), both allowing CPT.
      - PriceRule PR1 on RC1 (tiers 0/32000, 50000/24000, 250000/18000) and PriceRule PR2 on RC2 (tiers 0/30000, 50000/22000, 250000/16000), both open-ended from 2026-08-01T00:00:00Z with min_medicare_multiple_bp
        10000 and market_cap_multiple_bp 20000.
      - ChargeItem I1 (CPT 70450, cost_basis 240000) repriced to 576000 and ACTIVE; ChargeItem I2 (CPT 80053, cost_basis 40000) repriced to 128000 and ACTIVE; Facility.active_item_count == 2 and aggregate_gross_charge_cents
        == 704000.
      - CodeUpdateCycle for CPT 2027 with cost_inflator_bp 11000, holding a CROSSWALK entry E1 (70450 -> 70460, remapped to RC2) and a DELETE entry E2 (80053); both MAPPED by analyst_1 and the crosswalk
        approved by approver_1, leaving the cycle CROSSWALK_APPROVED.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: SystemAdmin
        as_user_id: sysadmin_1
      - call: POST /chargemaster/facilities
        payload:
          name: St Vitus Medical Center
          cms_certification_number: CCN-2193-CYCLE
          rounding_mode: NEAREST_CENT
          aggregate_markup_limit_bp: 40000
        as: SystemAdmin
        as_user_id: sysadmin_1
        captures:
          fac_id: $.data.id
      - call: POST /chargemaster/revenue-codes
        payload:
          code: '0300'
          description: Laboratory - general
          requires_hcpcs: false
          allowed_code_types:
          - CPT
          - HCPCS
          - REV_ONLY
          - CDM_INTERNAL
          pricing_class: PROCEDURE
          status: ACTIVE
        as: SystemAdmin
        as_user_id: sysadmin_1
        captures:
          rc1_id: $.data.id
      - call: POST /chargemaster/revenue-codes
        payload:
          code: '0301'
          description: Laboratory - chemistry
          requires_hcpcs: false
          allowed_code_types:
          - CPT
          - HCPCS
          - REV_ONLY
          - CDM_INTERNAL
          pricing_class: PROCEDURE
          status: ACTIVE
        as: SystemAdmin
        as_user_id: sysadmin_1
        captures:
          rc2_id: $.data.id
      - call: POST /chargemaster/departments
        payload:
          facility_id: ${fac_id}
          name: Clinical Laboratory
          cost_center_code: CC-0300
          manager_user_id: dept_mgr_1
          allowed_revenue_code_values: []
        as: SystemAdmin
        as_user_id: sysadmin_1
        captures:
          dept_id: $.data.id
      - call: POST /chargemaster/price-rules
        payload:
          facility_id: ${fac_id}
          revenue_code_id: ${rc1_id}
          pricing_method: COST_PLUS_MARKUP
          markup_tiers:
          - min_cost_basis_cents: 0
            markup_bp: 32000
          - min_cost_basis_cents: 50000
            markup_bp: 24000
          - min_cost_basis_cents: 250000
            markup_bp: 18000
          min_medicare_multiple_bp: 10000
          market_cap_multiple_bp: 20000
          effective_from: '2026-08-01T00:00:00Z'
        as: RevenueIntegrityAnalyst
        as_user_id: analyst_1
        captures:
          pr1_id: $.data.id
      - call: POST /chargemaster/price-rules
        payload:
          facility_id: ${fac_id}
          revenue_code_id: ${rc2_id}
          pricing_method: COST_PLUS_MARKUP
          markup_tiers:
          - min_cost_basis_cents: 0
            markup_bp: 30000
          - min_cost_basis_cents: 50000
            markup_bp: 22000
          - min_cost_basis_cents: 250000
            markup_bp: 16000
          min_medicare_multiple_bp: 10000
          market_cap_multiple_bp: 20000
          effective_from: '2026-08-01T00:00:00Z'
        as: RevenueIntegrityAnalyst
        as_user_id: analyst_1
        captures:
          pr2_id: $.data.id
      - call: POST /chargemaster/charge-items
        payload:
          facility_id: ${fac_id}
          department_id: ${dept_id}
          revenue_code_id: ${rc1_id}
          cdm_number: CDM-7001
          description: Cardiac catheterization left heart
          code_type: CPT
          code_value: '70450'
          cost_basis_cents: 240000
          medicare_rate_cents: 60000
          market_p75_cents: 900000
          effective_from: '2026-08-01T00:00:00Z'
        as: RevenueIntegrityAnalyst
        as_user_id: analyst_1
        captures:
          i1_id: $.data.id
      - call: POST /chargemaster/charge-items/${i1_id}/reprice
        payload: {}
        as: RevenueIntegrityAnalyst
        as_user_id: analyst_1
      - call: POST /chargemaster/charge-items/${i1_id}/lifecycle
        payload:
          action: SUBMIT_FOR_REVIEW
        as: RevenueIntegrityAnalyst
        as_user_id: analyst_1
      - call: POST /chargemaster/charge-items/${i1_id}/lifecycle
        payload:
          action: APPROVE
        as: PricingCommitteeApprover
        as_user_id: approver_1
      - call: POST /chargemaster/charge-items/${i1_id}/lifecycle
        payload:
          action: ACTIVATE
        as: PricingCommitteeApprover
        as_user_id: approver_1
      - call: POST /chargemaster/charge-items
        payload:
          facility_id: ${fac_id}
          department_id: ${dept_id}
          revenue_code_id: ${rc1_id}
          cdm_number: CDM-7002
          description: Comprehensive metabolic panel
          code_type: CPT
          code_value: '80053'
          cost_basis_cents: 40000
          medicare_rate_cents: 10000
          market_p75_cents: 200000
          effective_from: '2026-08-01T00:00:00Z'
        as: RevenueIntegrityAnalyst
        as_user_id: analyst_1
        captures:
          i2_id: $.data.id
      - call: POST /chargemaster/charge-items/${i2_id}/reprice
        payload: {}
        as: RevenueIntegrityAnalyst
        as_user_id: analyst_1
      - call: POST /chargemaster/charge-items/${i2_id}/lifecycle
        payload:
          action: SUBMIT_FOR_REVIEW
        as: RevenueIntegrityAnalyst
        as_user_id: analyst_1
      - call: POST /chargemaster/charge-items/${i2_id}/lifecycle
        payload:
          action: APPROVE
        as: PricingCommitteeApprover
        as_user_id: approver_1
      - call: POST /chargemaster/charge-items/${i2_id}/lifecycle
        payload:
          action: ACTIVATE
        as: PricingCommitteeApprover
        as_user_id: approver_1
      - call: POST /chargemaster/code-update-cycles
        payload:
          facility_id: ${fac_id}
          cycle_year: 2027
          code_set: CPT
          cost_inflator_bp: 11000
        as: RevenueIntegrityAnalyst
        as_user_id: analyst_1
        captures:
          cycle_id: $.data.id
      - call: POST /chargemaster/code-update-cycles/${cycle_id}/entries
        payload:
          action: CROSSWALK
          old_code_value: '70450'
          new_code_value: '70460'
          new_revenue_code_id: ${rc2_id}
        as: RevenueIntegrityAnalyst
        as_user_id: analyst_1
        captures:
          e1_id: $.data.id
      - call: POST /chargemaster/code-update-cycles/${cycle_id}/entries
        payload:
          action: DELETE
          old_code_value: '80053'
        as: RevenueIntegrityAnalyst
        as_user_id: analyst_1
        captures:
          e2_id: $.data.id
      - call: POST /chargemaster/code-update-cycles/${cycle_id}/lifecycle
        payload:
          action: START_MAPPING
        as: RevenueIntegrityAnalyst
        as_user_id: analyst_1
      - call: POST /chargemaster/code-update-entries/${e1_id}/disposition
        payload:
          action: MAP
          new_revenue_code_id: ${rc2_id}
        as: RevenueIntegrityAnalyst
        as_user_id: analyst_1
      - call: POST /chargemaster/code-update-entries/${e2_id}/disposition
        payload:
          action: MAP
        as: RevenueIntegrityAnalyst
        as_user_id: analyst_1
      - call: POST /chargemaster/code-update-cycles/${cycle_id}/lifecycle
        payload:
          action: APPROVE_CROSSWALK
        as: PricingCommitteeApprover
        as_user_id: approver_1
      trigger:
      - call: POST /chargemaster/code-update-cycles/${cycle_id}/lifecycle
        payload:
          action: ACTIVATE
          note: apply the 2027 CPT crosswalk
        as: ComplianceOfficer
        as_user_id: compliance_1
      - call: POST /chargemaster/code-update-cycles/${cycle_id}/lifecycle
        payload:
          action: ROLL_BACK
          note: vendor file was wrong; compensate the activation
        as: ComplianceOfficer
        as_user_id: compliance_1
      assert:
      - 'before trigger step 1: ChargeItem.${i1_id}.gross_charge_cents == 576000'
      - 'before trigger step 1: ChargeItem.${i2_id}.gross_charge_cents == 128000'
      - 'before trigger step 1: Facility.${fac_id}.active_item_count == 2'
      - 'before trigger step 1: Facility.${fac_id}.aggregate_gross_charge_cents == 704000'
      - 'before trigger step 1: CodeUpdateEntry.${e1_id}.carried_gross_charge_cents == 422400 (cost 240000 inflated by 11000 bp to 264000, which crosses into RC2''s 250000/16000 tier: 264000 * 1.6 == 422400)'
      - 'before trigger step 1: CodeUpdateEntry.${e2_id}.carried_gross_charge_cents == 128000 (DELETE carries the price unchanged)'
      - 'after trigger step 1: CodeUpdateCycle.${cycle_id}.status == ACTIVATED'
      - 'after trigger step 1: CodeUpdateCycle.${cycle_id}.pre_activation_active_item_count == 2'
      - 'after trigger step 1: CodeUpdateCycle.${cycle_id}.pre_activation_aggregate_gross_charge_cents == 704000'
      - 'after trigger step 1: ChargeItem.${i1_id}.code_value == 70460 AND ChargeItem.${i1_id}.revenue_code_id == ${rc2_id} AND ChargeItem.${i1_id}.gross_charge_cents == 422400 AND ChargeItem.${i1_id}.price_status
        == PRICE_STALE'
      - 'after trigger step 1: ChargeItem.${i2_id}.lifecycle_status == INACTIVE'
      - 'after trigger step 1: Facility.${fac_id}.active_item_count == 1'
      - 'after trigger step 1: Facility.${fac_id}.aggregate_gross_charge_cents == 422400'
      - 'after trigger step 1: CodeUpdateEntry.${e1_id}.status == APPLIED AND CodeUpdateEntry.${e1_id}.prior_gross_charge_cents == 576000 AND CodeUpdateEntry.${e1_id}.prior_code_value == 70450 AND CodeUpdateEntry.${e1_id}.prior_revenue_code_id
        == ${rc1_id}'
      - 'after trigger step 1: CodeUpdateEntry.${e2_id}.status == APPLIED AND CodeUpdateEntry.${e2_id}.prior_lifecycle_status == ACTIVE'
      - 'after trigger step 2: CodeUpdateCycle.${cycle_id}.status == ROLLED_BACK'
      - 'after trigger step 2: INVARIANT Facility.${fac_id}.active_item_count == CodeUpdateCycle.${cycle_id}.pre_activation_active_item_count == 2'
      - 'after trigger step 2: INVARIANT Facility.${fac_id}.aggregate_gross_charge_cents == CodeUpdateCycle.${cycle_id}.pre_activation_aggregate_gross_charge_cents == 704000'
      - 'after trigger step 2: ChargeItem.${i1_id}.code_value == 70450 AND ChargeItem.${i1_id}.revenue_code_id == ${rc1_id} AND ChargeItem.${i1_id}.gross_charge_cents == 576000 AND ChargeItem.${i1_id}.lifecycle_status
        == ACTIVE AND ChargeItem.${i1_id}.last_code_cycle_id == null'
      - 'after trigger step 2: ChargeItem.${i2_id}.lifecycle_status == ACTIVE AND ChargeItem.${i2_id}.gross_charge_cents == 128000'
      - 'after trigger step 2: CodeUpdateEntry.${e1_id}.status == REVERTED AND CodeUpdateEntry.${e2_id}.status == REVERTED'
      - 'after trigger step 2: Facility.${fac_id}.stale_price_item_count == 2 AND Facility.${fac_id}.chargemaster_posture == OPEN'
