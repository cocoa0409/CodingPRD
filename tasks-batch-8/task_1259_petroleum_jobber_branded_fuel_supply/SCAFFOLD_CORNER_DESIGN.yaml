              payload: { new_term_start_date: "2026-07-01", new_term_end_date: "2026-12-31" }
              as: JobberAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CURE_PERIOD_ACTIVE (409)"

      - name: sod_same_user_resolve_rejected
        claim_type: violation_to_error
        grounds: ["state_machines.InventoryReconciliation.OPEN_to_RESOLVED", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Segregation of duties: the opener (ops-alice) cannot resolve her own reconciliation (403 ERR_SEGREGATION_OF_DUTIES); a different admin (ops-bob) can."
        test_recipe:
          setup: ["station with an OPEN reconciliation (zero variance) opened by ops-alice"]
          setup_api_calls:
            - call: "POST /api/dealer-stations"
              payload: { station_name: "S-SoD", state_code: "TX", home_terminal_code: "TX-NORTH", state_excise_tc_per_gal: 200, credit_limit_cents: 500000 }
              as: JobberAdmin
              captures: { s_id: $.data.id }
            - call: "POST /api/inventory-reconciliations"
              payload: { station_id: "${s_id}", period_start: "2026-05-01", period_end: "2026-05-31" }
              as: JobberAdmin
              as_user_id: "ops-alice"
              captures: { rec_id: $.data.id }
          trigger:
            - call: "POST /api/inventory-reconciliations/${rec_id}/resolve"
              payload: { resolution_note: "self-resolve attempt" }
              as: JobberAdmin
              as_user_id: "ops-alice"
              captures: { err: $.data.error_id }
            - call: "POST /api/inventory-reconciliations/${rec_id}/resolve"
