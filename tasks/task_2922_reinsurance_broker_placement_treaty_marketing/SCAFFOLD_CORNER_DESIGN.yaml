            - "${lv_create} == 1 and ${lv_first_ms} == 2 with ${layer_state1} == IN_MARKET — the version starts at 1 and the OPEN -> IN_MARKET cascade on the *first* market submission bumps it"
            - "${lv_read} == 2 — the second and third market submissions never touch the Layer row (the layer is already IN_MARKET), so the version does not move on writes that do not mutate it"
            - "${lv_after_alpha} == 3, ${layer_state2} == PARTIALLY_PLACED and ${written2} == 60.0000 — the firm order's second cascade hop bumps the version exactly once"
            - "${e_stale} == ERR_STALE_LAYER_VERSION with HTTP 412 — lead-2 priced its 40.0000 allocation against version 2 and the layer is now at 3; note that without the check this call would have *succeeded*, since 100.0000 is a legal total"
            - "the layer has exactly 1 signing line with total_count 1 and ${line_after_stale} == ${sl_alpha}, ${lv_after_stale} == 3, ${written_after_stale} == 60.0000 and ${q_bravo_state1} == QUOTED — the refused firm order created no SigningLine, did not bump the version, and left the quote untouched"
            - "${e_future} == ERR_STALE_LAYER_VERSION — the rule is equality against Layer.version, so a version ahead of the row is just as stale as one behind it"
            - "${e_missing_occ} == ERR_VALIDATION with HTTP 400, not ERR_STALE_LAYER_VERSION — expected_layer_version is a required input and the shape band at priority 5 answers before the OCC check at 35"
            - "${e_ghost_quote} == ERR_QUOTE_NOT_FOUND, not ERR_STALE_LAYER_VERSION — existence at priority 15 precedes the OCC check even though the supplied version is genuinely stale"
            - "${lv_after_bravo} == 4, ${layer_state3} == FULLY_PLACED, ${written3} == 100.0000 and ${prog_state} == FIRM_ORDER — re-reading the version and retrying is the whole remedy"
            - "${q_charlie_state} == LAPSED (the FIRM_ORDER cascade lapsed every still-open quote on the program) and ${e_lapsed_before_stale} == ERR_QUOTE_STATE_INVALID, not ERR_STALE_LAYER_VERSION — the quote state check at priority 26 precedes the OCC check at 35"

      - name: fiduciary_booking_optimistic_concurrency_on_the_program_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.fiduciary-booking-stale-program
          - validations[priority=36] ERR_STALE_PROGRAM_VERSION
          - endpoints POST /programs/{program_id}/fiduciary-transactions (expected_program_version)
          - calculations.fiduciary_holding
        distinguishing_aspect: |
          The second concurrency rule guards a different parent for a different reason: multiple
          movements on one program are entirely legal, so an ignored expected_program_version would
          let an accountant commit funds against a fiduciary_holding_minor they never read. The
          corner walks the version through the three kinds of write that surround a booking and pins
          which of them the client's read survives: booking a movement bumps Program.version (so the
          previous read dies immediately, even though no money has moved yet), approving one does
          not (it writes only the child row), and settling one does (it recomputes the balance). An
          implementation that bumps the parent on every child write, or on none of them, fails a
          different assertion here.
        test_recipe:
          setup:
            - "One cedent and one program with no layers — the fiduciary dimension needs neither."
            - "One PENDING CEDENT_RECEIPT of 97,125,000 already booked by acct-1, so Program.version has moved once past creation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /cedents"
              payload: { name: "Ledger Mutual", domicile_code: "USNYC", financial_rating: "A" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ced_id: $.data.id }
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Ledger Property CAT 2026", line_of_business: "PROPERTY", underwriting_year: 2026, inception_date: "2026-01-01T00:00:00.000Z", expiry_date: "2027-01-01T00:00:00.000Z", estimated_premium_income_minor: 2000000000, brokerage_pct: 2.5000 }
              as: BrokerPlacementLead
              as_user_id: "lead-1"
              captures: { prog_id: $.data.id, pv_create: $.data.version }
            - call: "POST /programs/${prog_id}/fiduciary-transactions"
              payload: { txn_type: "CEDENT_RECEIPT", amount_minor: 97125000, expected_program_version: "${pv_create}" }
              as: BrokerAccountant
              as_user_id: "acct-1"
              captures: { txn1: $.data.id }
          trigger:
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: BrokerAccountant
              as_user_id: "acct-1"
              captures: { pv_after_book1: $.data.version, hold0: $.data.fiduciary_holding_minor }
            - call: "POST /programs/${prog_id}/fiduciary-transactions"
              payload: { txn_type: "CEDENT_RECEIPT", amount_minor: 20000000, expected_program_version: "${pv_create}" }
              as: BrokerAccountant
              as_user_id: "acct-2"
              captures: { e_stale1: $.data.error_id }
            - call: "GET /programs/${prog_id}/fiduciary-transactions"
              payload: {}
              as: BrokerAccountant
              as_user_id: "acct-1"
              captures: { ledger_after_stale_first: "$.data[0].id" }
            - call: "POST /programs/00000000-0000-4000-8000-0000000000ff/fiduciary-transactions"
              payload: { txn_type: "CEDENT_RECEIPT", amount_minor: 20000000, expected_program_version: "${pv_create}" }
              as: BrokerAccountant
              as_user_id: "acct-1"
              captures: { e_ghost_prog: $.data.error_id }
            - call: "POST /fiduciary-transactions/${txn1}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compl-1"
              captures: { txn1_state1: $.data.status }
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: BrokerAccountant
              as_user_id: "acct-1"
              captures: { pv_after_approve: $.data.version }
            - call: "POST /programs/${prog_id}/fiduciary-transactions"
              payload: { txn_type: "CEDENT_RECEIPT", amount_minor: 20000000, expected_program_version: "${pv_after_book1}" }
              as: BrokerAccountant
              as_user_id: "acct-2"
              captures: { txn2: $.data.id }
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: BrokerAccountant
              as_user_id: "acct-1"
              captures: { pv_after_book2: $.data.version }
            - call: "POST /fiduciary-transactions/${txn1}/settle"
              payload: {}
              as: BrokerAccountant
              as_user_id: "acct-1"
              captures: { txn1_state2: $.data.status }
            - call: "POST /programs/${prog_id}/fiduciary-transactions"
              payload: { txn_type: "CEDENT_PAYOUT", amount_minor: 97125000, expected_program_version: "${pv_after_book2}" }
              as: BrokerAccountant
              as_user_id: "acct-1"
              captures: { e_stale2: $.data.error_id }
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: BrokerAccountant
              as_user_id: "acct-1"
              captures: { pv_after_settle: $.data.version, hold1: $.data.fiduciary_holding_minor }
            - call: "POST /programs/${prog_id}/fiduciary-transactions"
              payload: { txn_type: "CEDENT_PAYOUT", amount_minor: 97125000, expected_program_version: "${pv_after_settle}" }
              as: BrokerAccountant
              as_user_id: "acct-1"
              captures: { txn3: $.data.id }
            - call: "POST /fiduciary-transactions/${txn3}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compl-1"
            - call: "POST /fiduciary-transactions/${txn3}/settle"
              payload: {}
              as: BrokerAccountant
              as_user_id: "acct-1"
              captures: { txn3_state: $.data.status }
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: BrokerAccountant
              as_user_id: "acct-1"
              captures: { hold2: $.data.fiduciary_holding_minor }
            - call: "GET /programs/${prog_id}/fiduciary-transactions"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compl-1"
              captures: { ledger_final_first: "$.data[0].id" }
          assert:
            - "${pv_create} == 1, ${pv_after_book1} == 2 and ${hold0} == 0 — booking bumps the parent version while moving no money at all, which is precisely why the next client read must be refreshed"
            - "${e_stale1} == ERR_STALE_PROGRAM_VERSION with HTTP 412 and the ledger still holds exactly 1 row (total_count 1) whose id is ${ledger_after_stale_first} == ${txn1} — acct-2's booking against version 1 is refused and writes no ledger row; without the check it would have succeeded"
            - "${e_ghost_prog} == ERR_PROGRAM_NOT_FOUND, not ERR_STALE_PROGRAM_VERSION — existence at priority 10 precedes the OCC check at 36"
            - "${txn1_state1} == APPROVED but ${pv_after_approve} == 2 — approving writes only the child row, so a client that read the program before the approval is still current"
            - "${txn2} is created successfully with the version read before the approval, and ${pv_after_book2} == 3 — the read survived the approval and died on the next booking"
            - "${txn1_state2} == SETTLED, ${e_stale2} == ERR_STALE_PROGRAM_VERSION and ${pv_after_settle} == 4 with ${hold1} == 97125000 — settling recomputes fiduciary_holding_minor, so it bumps the parent and invalidates the pre-settle read; the payout the accountant was about to book was sized against a balance of 0"
            - "${txn3_state} == SETTLED with ${hold2} == 0 — re-reading the version and the balance together is the remedy, and the outflow of exactly the whole balance settles"
            - "the final ledger read returns 3 rows with total_count 3, the first being ${ledger_final_first} == ${txn1} — the two refusals left no phantom rows behind"

      - name: derived_totals_reconcile_across_three_levels_after_create_update_and_release
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Layer.written_line_total_pct
          - entities.Layer.quoted_gross_premium_minor
          - entities.Reinsurer.committed_capacity_minor
          - entities.Reinsurer.available_capacity_minor
          - entities.Program.gross_written_premium_minor
          - calculations.layer_technical_premium
          - calculations.reinsurer_aggregate_capacity
        distinguishing_aspect: |
          Four derived fields sit on three different entities and are all fed by the same source
          rows, so the corner is whether each one is recomputed from its declared input set on every
          create, update and release — rather than incremented in place. Two traps are pinned. First,
          quoted_gross_premium_minor is derived only while the layer is OPEN: an update of the source
          rate must move it, and the identical update after the layer reaches IN_MARKET must be
          refused with the frozen figure intact. Second, releasing a line is a *recompute*, not a
          decrement: the layer's written total, the market's committed and available capacity, the
          layer's own status and the program's placement status all fall back together, while the
          untouched market's numbers do not move by a single minor unit. And the reconciliation is
          not an undo — the lapsed quote stays lapsed and the reverted layer will not accept a fresh
          market submission.
        test_recipe:
          setup:
            - "One cedent, two reinsurers each with capacity_limit_minor 5,000,000,000 and max_line_pct 100.0000."
            - "One program that reaches SUBMISSION_READY, and one CATASTROPHE layer 1,000,000,000 xs 2,000,000,000 created at base_rate_pct 8.0000."
