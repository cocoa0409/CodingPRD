  # ===========================================================================
  # Rule 8 — resource temporal-overlap conflicts across DIFFERENT interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: appointment_interval_adjacency_accepted_duplicate_rejected
        grounds:
          - validations[priority=7]
          - errors[ERR_SLOT_ALREADY_TAKEN]
          - state_machines.Appointment.transitions.SCHEDULED_to_CHECKED_IN
          - endpoints.POST_/psc/appointments
        distinguishing_aspect: "Interval semantics A — closed-open grid cells with ADJACENCY: an appointment whose cell starts exactly when another ends is ACCEPTED (the lower edge is closed, the upper edge open), while an appointment reusing the identical cell is rejected with ERR_SLOT_ALREADY_TAKEN."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T13:00:00Z. One center, three ELIGIBLE non-fasting orders, station_count 2 so the capacity aggregate is not the binding constraint."
          setup_api_calls:
