          - calculations.confirming_line_peak_occupancy
          - endpoints.POST_/credits/{id}/confirmation-requests
          - endpoints.POST_/credits/{id}/confirmation-responses
        distinguishing_aspect: |
          confirmation_status is the cyclic dimension: CONFIRMATION_DECLINED ->
          CONFIRMATION_REQUESTED is a legal retry edge with a DIFFERENT bank, and
          the declining bank's confirming_line_used_cents drops back to 0 while
          confirming_bank_id is nulled. The eventual CONFIRM prices
          confirmation_charge_cents at 70000 (bps 20+15=35, quarters 2) and grows
