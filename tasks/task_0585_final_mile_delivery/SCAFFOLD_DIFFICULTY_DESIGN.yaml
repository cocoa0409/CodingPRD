              as: DispatchPlanner
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == 'ERR_TEAM_OUT_OF_SERVICE'"
            - "trigger response HTTP status == 409"

      - name: dispatch_requires_dock_appointment
        grounds:
          - state_machines.Route.PLANNING_to_DISPATCHED
          - validations[priority=11]
          - entities.Route.fields.dock_ready
        distinguishing_aspect: |
          A Route's PLANNING->DISPATCHED transition depends on a BOOKED DockAppointment existing
          (Route->DockAppointment pair): dispatching a route with a stop but dock_ready==false is
          rejected with ERR_DOCK_APPOINTMENT_MISSING (409) — a different entity pair than Order->Team.
        test_recipe:
          setup:
            - "A PLANNING route with one PLANNED stop but NO dock appointment (dock_ready false)."
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot A", region_code: "CA" }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /delivery-teams"
              payload: { depot_id: "${depot_id}", team_name: "T1", lead_name: "Lee", member2_name: "Max", region_code: "CA", max_daily_stops: 10, max_daily_weight_lbs: 500, max_daily_volume_cuft: 1000 }
              as: PlatformAdmin
              captures: { team_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Cara", address_line: "1 St", region_code: "CA", geo_lat: 34.0, geo_lng: -118.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /delivery-orders"
              payload: { customer_id: "${cust_id}", item_description: "Table", weight_lbs: 100, volume_cuft: 20, declared_value_cents: 10000, service_level: "THRESHOLD" }
              as: DispatchPlanner
              captures: { order_id: $.data.id, o_v: $.data.version }
            - call: "POST /delivery-orders/${order_id}/windows"
              payload: { team_id: "${team_id}", service_date: "2026-06-01", window_start_min: 480, window_end_min: 600, expected_order_version: "${o_v}" }
              as: DispatchPlanner
              captures: { w1_id: $.data.id }
            - call: "POST /routes"
              payload: { depot_id: "${depot_id}", team_id: "${team_id}", service_date: "2026-06-01" }
              as: DispatchPlanner
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/stops"
              payload: { order_id: "${order_id}", window_id: "${w1_id}" }
              as: DispatchPlanner
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: DispatchPlanner
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == 'ERR_DOCK_APPOINTMENT_MISSING'"
            - "trigger response HTTP status == 409"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: team_window_overlap_halfopen
        grounds:
          - validations[priority=10]
          - errors[ERR_TEAM_WINDOW_CONFLICT]
          - entities.DeliveryWindow.fields.window_start_min
        distinguishing_aspect: |
          The DeliveryTeam calendar uses half-open [start,end) intervals: a second window 540-600 for
          the same team/date overlapping an existing 480-600 RESERVED window is rejected with
          ERR_TEAM_WINDOW_CONFLICT (409). (Adjacency at a shared boundary is permitted — covered in
          corner design.)
        test_recipe:
          setup:
            - "Team T has an existing RESERVED window 480-600 on 2026-06-01 for order A; a second CREATED order B awaits a window."
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot A", region_code: "CA" }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /delivery-teams"
              payload: { depot_id: "${depot_id}", team_name: "T1", lead_name: "Lee", member2_name: "Max", region_code: "CA", max_daily_stops: 10, max_daily_weight_lbs: 500, max_daily_volume_cuft: 1000 }
              as: PlatformAdmin
              captures: { team_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Cara", address_line: "1 St", region_code: "CA", geo_lat: 34.0, geo_lng: -118.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /delivery-orders"
              payload: { customer_id: "${cust_id}", item_description: "A", weight_lbs: 100, volume_cuft: 20, declared_value_cents: 10000, service_level: "THRESHOLD" }
              as: DispatchPlanner
              captures: { a_id: $.data.id, a_v: $.data.version }
            - call: "POST /delivery-orders/${a_id}/windows"
              payload: { team_id: "${team_id}", service_date: "2026-06-01", window_start_min: 480, window_end_min: 600, expected_order_version: "${a_v}" }
              as: DispatchPlanner
              captures: { wa_id: $.data.id }
            - call: "POST /delivery-orders"
              payload: { customer_id: "${cust_id}", item_description: "B", weight_lbs: 100, volume_cuft: 20, declared_value_cents: 10000, service_level: "THRESHOLD" }
              as: DispatchPlanner
              captures: { b_id: $.data.id, b_v: $.data.version }
          trigger:
            - call: "POST /delivery-orders/${b_id}/windows"
              payload: { team_id: "${team_id}", service_date: "2026-06-01", window_start_min: 540, window_end_min: 600, expected_order_version: "${b_v}" }
              as: DispatchPlanner
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == 'ERR_TEAM_WINDOW_CONFLICT'"
            - "trigger response HTTP status == 409"

      - name: dock_appointment_buffer_overlap
        grounds:
          - validations[priority=10]
          - errors[ERR_DOCK_SLOT_CONFLICT]
          - entities.Dock.fields.buffer_min
        distinguishing_aspect: |
          Dock appointments use a buffered-gap interval semantics distinct from the team calendar:
          with buffer_min=30 a new 445-500 appointment against an existing 360-420 BOOKED appointment
          is rejected (gap 420->445 = 25 min < 30) with ERR_DOCK_SLOT_CONFLICT (409), even though the
          raw intervals do not overlap — buffer, not mere overlap, governs.
        test_recipe:
          setup:
            - "Dock D (buffer_min 30) has a BOOKED appointment 360-420 for route1; route2 exists and awaits a dock appointment."
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot A", region_code: "CA" }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /docks"
              payload: { depot_id: "${depot_id}", dock_code: "D1", buffer_min: 30 }
              as: PlatformAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /delivery-teams"
              payload: { depot_id: "${depot_id}", team_name: "T1", lead_name: "Lee", member2_name: "Max", region_code: "CA", max_daily_stops: 10, max_daily_weight_lbs: 500, max_daily_volume_cuft: 1000 }
              as: PlatformAdmin
              captures: { team_id: $.data.id }
            - call: "POST /routes"
              payload: { depot_id: "${depot_id}", team_id: "${team_id}", service_date: "2026-06-01" }
              as: DispatchPlanner
              captures: { r1_id: $.data.id }
            - call: "POST /routes/${r1_id}/dock-appointments"
              payload: { dock_id: "${dock_id}", appt_date: "2026-06-01", appt_start_min: 360, appt_end_min: 420 }
              as: DockCoordinator
              captures: { a1_id: $.data.id }
            - call: "POST /routes"
              payload: { depot_id: "${depot_id}", team_id: "${team_id}", service_date: "2026-06-01" }
              as: DispatchPlanner
              captures: { r2_id: $.data.id }
          trigger:
            - call: "POST /routes/${r2_id}/dock-appointments"
              payload: { dock_id: "${dock_id}", appt_date: "2026-06-01", appt_start_min: 445, appt_end_min: 500 }
              as: DockCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == 'ERR_DOCK_SLOT_CONFLICT'"
            - "trigger response HTTP status == 409"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: route_weight_conservation_on_add_remove
        grounds:
          - state_machines.DeliveryOrder.SCHEDULED_to_ROUTED
          - state_machines.RouteStop.PLANNED_to_SKIPPED
          - calculations.route_load_reconciliation
          - entities.Route.fields.committed_weight_lbs
        distinguishing_aspect: |
          Conserved quantity = route committed_weight_lbs (capacity units): adding a stop
          (order weight 150) debits available capacity (0->150) and removing that stop credits it
          back exactly (150->0), leaving committed_weight_lbs invariant to add+remove — pinned as
          committed_weight_lbs == sum of weight_lbs over stops in {PLANNED,COMPLETED} == 0.
        test_recipe:
          setup:
            - "A SCHEDULED THRESHOLD order weight 150 with an active window, plus an empty PLANNING route (committed_weight 0)."
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot A", region_code: "CA" }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /delivery-teams"
              payload: { depot_id: "${depot_id}", team_name: "T1", lead_name: "Lee", member2_name: "Max", region_code: "CA", max_daily_stops: 10, max_daily_weight_lbs: 500, max_daily_volume_cuft: 1000 }
              as: PlatformAdmin
              captures: { team_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Cara", address_line: "1 St", region_code: "CA", geo_lat: 34.0, geo_lng: -118.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /delivery-orders"
              payload: { customer_id: "${cust_id}", item_description: "Cabinet", weight_lbs: 150, volume_cuft: 25, declared_value_cents: 10000, service_level: "THRESHOLD" }
              as: DispatchPlanner
              captures: { order_id: $.data.id, o_v: $.data.version }
            - call: "POST /delivery-orders/${order_id}/windows"
              payload: { team_id: "${team_id}", service_date: "2026-06-01", window_start_min: 480, window_end_min: 600, expected_order_version: "${o_v}" }
              as: DispatchPlanner
              captures: { w1_id: $.data.id }
            - call: "POST /routes"
              payload: { depot_id: "${depot_id}", team_id: "${team_id}", service_date: "2026-06-01" }
              as: DispatchPlanner
              captures: { route_id: $.data.id }
          trigger:
            - call: "POST /routes/${route_id}/stops"
              payload: { order_id: "${order_id}", window_id: "${w1_id}" }
              as: DispatchPlanner
              captures: { s1_id: $.data.id }
            - call: "POST /routes/${route_id}/stops/${s1_id}/remove"
              payload: {}
              as: DispatchPlanner
          assert:
            - "Route.${route_id}.committed_weight_lbs == 0"
            - "Route.${route_id}.committed_stops == 0"
            - "RouteStop.${s1_id}.status == SKIPPED"
            - "DeliveryOrder.${order_id}.status == SCHEDULED"

      - name: customer_balance_conservation_on_settle_void
        grounds:
          - state_machines.DeliveryOrder.DELIVERED_to_SETTLED
          - state_machines.DeliveryOrder.SETTLED_to_RETURNED
          - entities.Customer.fields.outstanding_balance_cents
          - calculations.order_fee_final
        distinguishing_aspect: |
          Conserved quantity = customer outstanding_balance_cents (money): settling a delivered order
          (final_fee 5500) credits the ledger (0->5500) and voiding it debits the exact same amount
          (5500->0), leaving outstanding_balance_cents invariant to settle+void — pinned as
          outstanding_balance_cents == sum of final_fee_cents over SETTLED orders == 0.
        test_recipe:
          setup:
            - "A THRESHOLD order weight 100 delivered (final_fee 5500) then SETTLED, raising the customer's outstanding_balance_cents to 5500."
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot A", region_code: "CA" }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /docks"
              payload: { depot_id: "${depot_id}", dock_code: "D1" }
              as: PlatformAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /delivery-teams"
              payload: { depot_id: "${depot_id}", team_name: "T1", lead_name: "Lee", member2_name: "Max", region_code: "CA", max_daily_stops: 10, max_daily_weight_lbs: 500, max_daily_volume_cuft: 1000 }
              as: PlatformAdmin
              captures: { team_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Cara", address_line: "1 St", region_code: "CA", geo_lat: 34.0, geo_lng: -118.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /delivery-orders"
              payload: { customer_id: "${cust_id}", item_description: "Table", weight_lbs: 100, volume_cuft: 20, declared_value_cents: 10000, service_level: "THRESHOLD" }
              as: DispatchPlanner
              captures: { order_id: $.data.id, o_v: $.data.version }
            - call: "POST /delivery-orders/${order_id}/windows"
              payload: { team_id: "${team_id}", service_date: "2026-06-01", window_start_min: 480, window_end_min: 600, expected_order_version: "${o_v}" }
              as: DispatchPlanner
              captures: { w1_id: $.data.id }
            - call: "POST /routes"
              payload: { depot_id: "${depot_id}", team_id: "${team_id}", service_date: "2026-06-01" }
              as: DispatchPlanner
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/stops"
              payload: { order_id: "${order_id}", window_id: "${w1_id}" }
              as: DispatchPlanner
              captures: { s1_id: $.data.id }
            - call: "POST /routes/${route_id}/dock-appointments"
              payload: { dock_id: "${dock_id}", appt_date: "2026-06-01", appt_start_min: 360, appt_end_min: 420 }
              as: DockCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: DispatchPlanner
            - call: "POST /delivery-orders/${order_id}/attempts"
              payload: { outcome: "DELIVERED", placement: "THRESHOLD", signature_captured: true, photo_count: 1 }
              as: DeliveryLead
              as_user_id: "${team_id}"
            - call: "POST /delivery-orders/${order_id}/settle"
              payload: {}
              as: DispatchPlanner
          trigger:
            - call: "POST /delivery-orders/${order_id}/void-delivery"
              payload: {}
              as: DispatchPlanner
          assert:
            - "Customer.${cust_id}.outstanding_balance_cents == 0"
            - "DeliveryOrder.${order_id}.status == RETURNED"
            - "DeliveryOrder.${order_id}.final_fee_cents == 5500"
