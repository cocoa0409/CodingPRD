            - "Case.${case_id}.topics_completed contains exactly the six topics {US_LAWS, HEALTHCARE_ACCESS, EDUCATION_SYSTEM, EMPLOYMENT_RIGHTS, HOUSING_SAFETY, BUDGETING}"
            - "CULTURAL_ORIENTATION benchmark status == 'MET' (link 2: caused by the sixth completion, not by any fulfill call)"
            - "CULTURAL_ORIENTATION benchmark fulfilled_on == '2026-08-13' and evidence_note_id == null (system fulfillment requires no note)"
            - "CULTURAL_ORIENTATION benchmark on_time == true (2026-08-13 <= due_date 2026-11-08)"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict: {state vs business_referential}
  # and {business_safety vs business_temporal}. DISJOINT category pairs.
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: benchmark_state_vs_referential_priority
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_BENCHMARK_NOT_PENDING]
          - errors[ERR_EVIDENCE_NOTE_INVALID]
        distinguishing_aspect: |
          Category pair {state, business_referential}: the fulfill request
          fails BOTH the state check (benchmark already WAIVED) AND the
          referential check (evidence note belongs to a different case); the
          state-tier error ERR_BENCHMARK_NOT_PENDING must win because
          priority 6 is evaluated before priority 10.
        test_recipe:
          setup:
            - "Case CASE-PV1A (household_size 1, no members), READY 0-bedroom housing, arrived 2026-08-10; its HOME_VISIT benchmark has been WAIVED by the director"
            - "Case CASE-PV1B exists (PRE_ARRIVAL) with a SERVICE_DELIVERY note (the wrong-case evidence)"
            - "Logical clock is 2026-08-20 so fulfilled_on 2026-08-15 passes the schema/date-range tier"
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_number: "CASE-PV1A", agency_affiliate_code: "AFF-01", household_size: 1, scheduled_arrival_date: "2026-08-10" }
              as: CaseManager
              captures: { case_a: $.data.id }
            - call: "POST /housing-units"
              payload: { address: "120 Maple St", bedrooms: 0 }
              as: HousingCoordinator
              captures: { unit_a: $.data.id }
            - call: "POST /housing-setups"
              payload: { case_id: "${case_a}", housing_unit_id: "${unit_a}", occupancy_start: "2026-08-10", occupancy_end: "2027-02-10" }
              as: HousingCoordinator
              captures: { setup_a: $.data.id }
            - call: "POST /housing-setups/${setup_a}/furnish"
              payload: { item: "BED" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_a}/furnish"
              payload: { item: "LINENS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_a}/furnish"
              payload: { item: "TABLE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_a}/furnish"
              payload: { item: "CHAIRS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_a}/furnish"
              payload: { item: "COOKWARE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_a}/furnish"
              payload: { item: "CLEANING_SUPPLIES" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_a}/ready"
              as: HousingCoordinator
            - call: "POST /cases/${case_a}/arrive"
              payload: { actual_arrival_date: "2026-08-10" }
              as: CaseManager
            - call: "GET /cases/${case_a}/benchmarks"
              payload: { service_type: "HOME_VISIT" }
              as: AgencyDirector
              captures: { bm_id: "$.data[0].id" }
            - call: "POST /benchmarks/${bm_id}/waive"
              payload: { reason: "Service delivered by another affiliate before case reassignment" }
              as: AgencyDirector
            - call: "POST /cases"
              payload: { case_number: "CASE-PV1B", agency_affiliate_code: "AFF-01", household_size: 1, scheduled_arrival_date: "2026-09-01" }
              as: CaseManager
              captures: { case_b: $.data.id }
            - call: "POST /case-notes"
              payload: { case_id: "${case_b}", note_type: "SERVICE_DELIVERY", body: "Unrelated service on another case", service_date: "2026-08-15" }
              as: CaseManager
              captures: { note_b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: AgencyDirector
          trigger:
            - call: "POST /benchmarks/${bm_id}/fulfill"
              payload: { fulfilled_on: "2026-08-15", evidence_note_id: "${note_b}" }
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_BENCHMARK_NOT_PENDING' with http 409 (state tier, priority 6)"
            - "error_id != 'ERR_EVIDENCE_NOTE_INVALID' even though the note belongs to case ${case_b} (referential tier, priority 10, loses)"

      - name: housing_safety_vs_temporal_priority
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_HOUSING_CAPACITY_INSUFFICIENT]
          - errors[ERR_UNIT_OCCUPANCY_CONFLICT]
        distinguishing_aspect: |
          Category pair {business_safety, business_temporal} — disjoint from
          the {state, business_referential} pair of
          benchmark_state_vs_referential_priority: the setup request fails
          BOTH the overcrowding check (1 bedroom for household_size 4) AND the
          occupancy-overlap check; the safety error
          ERR_HOUSING_CAPACITY_INSUFFICIENT must win because priority 7 is
          evaluated before priority 8.
        test_recipe:
          setup:
            - "Case CASE-PV2A (household_size 2) has a non-terminal HousingSetup on unit U (1 bedroom) covering [2026-08-10, 2027-02-10)"
            - "Case CASE-PV2B exists with household_size 4 (bedrooms_required = ceil(4/2) = 2)"
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_number: "CASE-PV2A", agency_affiliate_code: "AFF-01", household_size: 2, scheduled_arrival_date: "2026-08-10" }
              as: CaseManager
              captures: { case_a: $.data.id }
            - call: "POST /housing-units"
              payload: { address: "130 Elm Ct", bedrooms: 1 }
              as: HousingCoordinator
              captures: { unit_u: $.data.id }
            - call: "POST /housing-setups"
              payload: { case_id: "${case_a}", housing_unit_id: "${unit_u}", occupancy_start: "2026-08-10", occupancy_end: "2027-02-10" }
              as: HousingCoordinator
              captures: { setup_a: $.data.id }
            - call: "POST /cases"
              payload: { case_number: "CASE-PV2B", agency_affiliate_code: "AFF-01", household_size: 4, scheduled_arrival_date: "2026-09-01" }
              as: CaseManager
              captures: { case_b: $.data.id }
          trigger:
            - call: "POST /housing-setups"
              payload: { case_id: "${case_b}", housing_unit_id: "${unit_u}", occupancy_start: "2026-09-01", occupancy_end: "2027-03-01" }
              as: HousingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_HOUSING_CAPACITY_INSUFFICIENT' with http 422 (safety tier, priority 7)"
            - "error_id != 'ERR_UNIT_OCCUPANCY_CONFLICT' even though [2026-09-01, 2027-03-01) overlaps setup ${setup_a}'s window (temporal tier, priority 8, loses)"

  # ===========================================================================
  # Rule 6 — boundary_precision_check: due-date equality (date metric on
  # fulfill) vs exact bedroom fit (count metric on housing-setups create).
  # DIFFERENT metrics, DIFFERENT endpoints.
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: fulfill_on_due_date_boundary
        grounds:
          - calculations.benchmark_on_time_determination
          - entities.ServiceBenchmark.fields.on_time
          - endpoints: "POST /benchmarks/{id}/fulfill"
        distinguishing_aspect: |
          Date-metric boundary on the fulfill endpoint: fulfilled_on exactly
          equal to due_date (2026-09-09) is ON TIME (inclusive <=), while one
          day later (2026-09-10) is LATE but still fulfillable — pinning the
          >= vs > precision of benchmark_on_time_determination.
        test_recipe:
          setup:
            - "Case CASE-BP1 (household_size 1, no members), READY 0-bedroom housing, arrived 2026-08-10; HOME_VISIT and HEALTH_SCREENING benchmarks both due 2026-09-09"
            - "Two SERVICE_DELIVERY CaseNotes on the case; logical clock is 2026-09-10"
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_number: "CASE-BP1", agency_affiliate_code: "AFF-01", household_size: 1, scheduled_arrival_date: "2026-08-10" }
              as: CaseManager
              captures: { case_id: $.data.id }
            - call: "POST /housing-units"
              payload: { address: "140 Oak Ct", bedrooms: 0 }
              as: HousingCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /housing-setups"
              payload: { case_id: "${case_id}", housing_unit_id: "${unit_id}", occupancy_start: "2026-08-10", occupancy_end: "2027-02-10" }
              as: HousingCoordinator
              captures: { setup_id: $.data.id }
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "BED" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "LINENS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "TABLE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "CHAIRS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "COOKWARE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "CLEANING_SUPPLIES" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/ready"
              as: HousingCoordinator
            - call: "POST /cases/${case_id}/arrive"
              payload: { actual_arrival_date: "2026-08-10" }
              as: CaseManager
            - call: "POST /case-notes"
              payload: { case_id: "${case_id}", note_type: "SERVICE_DELIVERY", body: "Home visit", service_date: "2026-09-09" }
              as: CaseManager
              captures: { note1: $.data.id }
            - call: "POST /case-notes"
              payload: { case_id: "${case_id}", note_type: "SERVICE_DELIVERY", body: "Health screening", service_date: "2026-09-10" }
              as: CaseManager
              captures: { note2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: AgencyDirector
            - call: "GET /cases/${case_id}/benchmarks"
              payload: { service_type: "HOME_VISIT" }
              as: CaseManager
              captures: { bm_home: "$.data[0].id" }
            - call: "GET /cases/${case_id}/benchmarks"
              payload: { service_type: "HEALTH_SCREENING" }
              as: CaseManager
              captures: { bm_health: "$.data[0].id" }
          trigger:
            - call: "POST /benchmarks/${bm_home}/fulfill"
              payload: { fulfilled_on: "2026-09-09", evidence_note_id: "${note1}" }
              as: CaseManager
              captures: { home_status: $.data.status, home_on_time: $.data.on_time }
            - call: "POST /benchmarks/${bm_health}/fulfill"
              payload: { fulfilled_on: "2026-09-10", evidence_note_id: "${note2}" }
              as: CaseManager
              captures: { health_status: $.data.status, health_on_time: $.data.on_time }
          assert:
            - "HOME_VISIT fulfill on due_date: status == 'MET' and on_time == true (2026-09-09 <= 2026-09-09, inclusive boundary)"
            - "HEALTH_SCREENING fulfill one day after due_date: status == 'MET' and on_time == false (2026-09-10 > 2026-09-09, late but recordable)"

      - name: housing_capacity_exact_fit
        grounds:
          - validations[priority=7]
          - errors[ERR_HOUSING_CAPACITY_INSUFFICIENT]
          - endpoints: "POST /housing-setups"
        distinguishing_aspect: |
          Count-metric boundary on the housing-setups create endpoint (a
          DIFFERENT metric and endpoint than fulfill_on_due_date_boundary):
          bedrooms == ceil(household_size / 2) exactly fits and is ALLOWED
          (size 4 -> 2 bedrooms succeeds), while one bedroom short (size 5 ->
          2 bedrooms) is rejected — pinning the >= precision of the capacity
          rule.
        test_recipe:
          setup:
            - "Case CASE-BP2A (household_size 4) and case CASE-BP2B (household_size 5), both PRE_ARRIVAL"
            - "Two 2-bedroom units UA and UB"
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_number: "CASE-BP2A", agency_affiliate_code: "AFF-01", household_size: 4, scheduled_arrival_date: "2026-08-10" }
              as: CaseManager
              captures: { case_a: $.data.id }
            - call: "POST /cases"
              payload: { case_number: "CASE-BP2B", agency_affiliate_code: "AFF-01", household_size: 5, scheduled_arrival_date: "2026-08-10" }
              as: CaseManager
              captures: { case_b: $.data.id }
            - call: "POST /housing-units"
              payload: { address: "150 Pine Ct", bedrooms: 2 }
              as: HousingCoordinator
              captures: { unit_a: $.data.id }
            - call: "POST /housing-units"
              payload: { address: "160 Pine Ct", bedrooms: 2 }
              as: HousingCoordinator
              captures: { unit_b: $.data.id }
          trigger:
            - call: "POST /housing-setups"
              payload: { case_id: "${case_a}", housing_unit_id: "${unit_a}", occupancy_start: "2026-08-10", occupancy_end: "2027-02-10" }
              as: HousingCoordinator
              captures: { setup_a: $.data.id, setup_a_status: $.data.status }
            - call: "POST /housing-setups"
              payload: { case_id: "${case_b}", housing_unit_id: "${unit_b}", occupancy_start: "2026-08-10", occupancy_end: "2027-02-10" }
              as: HousingCoordinator
              captures: { err_b: $.data.error_id }
          assert:
            - "case A (size 4, ceil(4/2) = 2 bedrooms required, unit has exactly 2): setup created with status 'PREPARING' (exact fit allowed)"
            - "case B (size 5, ceil(5/2) = 3 bedrooms required, unit has 2): error_id == 'ERR_HOUSING_CAPACITY_INSUFFICIENT' with http 422"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency: HousingSetup -> Case (arrival
  # gated on housing readiness) and CaseTransfer -> OrientationSession
  # (session creation frozen while a transfer is open). DIFFERENT entity pairs.
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: arrive_blocked_until_housing_ready
        grounds:
          - state_machines.Case.PRE_ARRIVAL_to_ARRIVED
          - entities.HousingSetup.fields.status
          - errors[ERR_HOUSING_NOT_READY]
        distinguishing_aspect: |
          Entity pair HousingSetup -> Case: the Case arrival transition is
          valid only when the case's HousingSetup (a different entity) is in
          READY; with the setup still PREPARING the arrive call fails with
          ERR_HOUSING_NOT_READY, and after furnishing + ready the identical
          arrive call succeeds.
        test_recipe:
          setup:
            - "Case CASE-XD1 (household_size 1), 0-bedroom unit, HousingSetup with only 5 of 6 furnishing items completed (still PREPARING)"
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_number: "CASE-XD1", agency_affiliate_code: "AFF-01", household_size: 1, scheduled_arrival_date: "2026-08-10" }
              as: CaseManager
              captures: { case_id: $.data.id }
            - call: "POST /housing-units"
              payload: { address: "170 Birch St", bedrooms: 0 }
              as: HousingCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /housing-setups"
              payload: { case_id: "${case_id}", housing_unit_id: "${unit_id}", occupancy_start: "2026-08-10", occupancy_end: "2027-02-10" }
              as: HousingCoordinator
              captures: { setup_id: $.data.id }
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "BED" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "LINENS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "TABLE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "CHAIRS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "COOKWARE" }
              as: HousingCoordinator
          trigger:
            - call: "POST /cases/${case_id}/arrive"
              payload: { actual_arrival_date: "2026-08-10" }
              as: CaseManager
              captures: { arrive_err: $.data.error_id }
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "CLEANING_SUPPLIES" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/ready"
              as: HousingCoordinator
              captures: { setup_status: $.data.status }
            - call: "POST /cases/${case_id}/arrive"
              payload: { actual_arrival_date: "2026-08-10" }
              as: CaseManager
              captures: { case_status: $.data.status }
          assert:
            - "first arrive: error_id == 'ERR_HOUSING_NOT_READY' with http 409 (HousingSetup ${setup_id} is PREPARING, not READY)"
            - "after sixth furnish + ready: HousingSetup.${setup_id}.status == 'READY'"
            - "second arrive succeeds: Case.${case_id}.status == 'ARRIVED' and actual_arrival_date == '2026-08-10'"

      - name: transfer_open_blocks_orientation
        grounds:
          - state_machines.CaseTransfer.INITIATED_to_WITHDRAWN
          - validations[priority=9]
          - errors[ERR_CASE_TRANSFER_PENDING]
        distinguishing_aspect: |
          Entity pair CaseTransfer -> OrientationSession (distinct from the
          HousingSetup -> Case pair of arrive_blocked_until_housing_ready):
          while a CaseTransfer is INITIATED, creating an OrientationSession
          for that case is rejected with ERR_CASE_TRANSFER_PENDING; after
          withdrawal the identical session create succeeds.
        test_recipe:
          setup:
            - "Case CASE-XD2 (household_size 1, no members), READY 0-bedroom housing, arrived 2026-08-10"
            - "An INITIATED CaseTransfer to AFF-99 freezes the case"
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_number: "CASE-XD2", agency_affiliate_code: "AFF-01", household_size: 1, scheduled_arrival_date: "2026-08-10" }
              as: CaseManager
              captures: { case_id: $.data.id }
            - call: "POST /housing-units"
              payload: { address: "180 Cedar St", bedrooms: 0 }
              as: HousingCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /housing-setups"
              payload: { case_id: "${case_id}", housing_unit_id: "${unit_id}", occupancy_start: "2026-08-10", occupancy_end: "2027-02-10" }
              as: HousingCoordinator
              captures: { setup_id: $.data.id }
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "BED" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "LINENS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "TABLE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "CHAIRS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "COOKWARE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "CLEANING_SUPPLIES" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/ready"
              as: HousingCoordinator
            - call: "POST /cases/${case_id}/arrive"
              payload: { actual_arrival_date: "2026-08-10" }
              as: CaseManager
            - call: "POST /case-transfers"
              payload: { case_id: "${case_id}", receiving_affiliate_code: "AFF-99", reason: "EMPLOYMENT_OPPORTUNITY" }
              as: CaseManager
              captures: { transfer_id: $.data.id }
          trigger:
            - call: "POST /orientation-sessions"
              payload: { case_id: "${case_id}", topic: "US_LAWS", start_at: "2026-08-20T09:00:00Z", end_at: "2026-08-20T10:00:00Z" }
              as: CaseManager
              captures: { sess_err: $.data.error_id }
            - call: "POST /case-transfers/${transfer_id}/withdraw"
              as: CaseManager
              captures: { transfer_status: $.data.status }
            - call: "GET /cases/${case_id}"
              as: CaseManager
              captures: { case_open: $.data.open_transfer_id }
            - call: "POST /orientation-sessions"
              payload: { case_id: "${case_id}", topic: "US_LAWS", start_at: "2026-08-20T09:00:00Z", end_at: "2026-08-20T10:00:00Z" }
              as: CaseManager
              captures: { sess_id: $.data.id, sess_status: $.data.status }
          assert:
            - "while transfer INITIATED: error_id == 'ERR_CASE_TRANSFER_PENDING' with http 409"
            - "after withdraw: CaseTransfer.${transfer_id}.status == 'WITHDRAWN' and Case.${case_id}.open_transfer_id == null"
            - "retry succeeds: OrientationSession created with status 'SCHEDULED'"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap: half-open occupancy windows on
  # HousingUnit (adjacency allowed) vs 30-minute buffer intervals on
  # OrientationSession (adjacency forbidden). DIFFERENT interval semantics on
  # DIFFERENT resource entities.
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: housing_half_open_adjacency
        grounds:
          - validations[priority=8]
          - errors[ERR_UNIT_OCCUPANCY_CONFLICT]
          - entities.HousingSetup.fields.occupancy_start
          - entities.HousingSetup.fields.occupancy_end
        distinguishing_aspect: |
          Half-open interval semantics on HousingUnit: a new setup whose
          occupancy_start equals the existing setup's occupancy_end
          (2027-02-10) is ADJACENT and allowed; one starting one day earlier
          (2027-02-09) overlaps and is rejected — pure [start, end) geometry
          with no buffer, on the HousingUnit resource.
        test_recipe:
          setup:
            - "Unit U (1 bedroom) has a non-terminal HousingSetup for case CASE-TO1A covering [2026-08-10, 2027-02-10)"
            - "Cases CASE-TO1B and CASE-TO1C exist (PRE_ARRIVAL, household_size 2)"
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_number: "CASE-TO1A", agency_affiliate_code: "AFF-01", household_size: 2, scheduled_arrival_date: "2026-08-10" }
              as: CaseManager
              captures: { case_a: $.data.id }
            - call: "POST /housing-units"
              payload: { address: "190 Alder St", bedrooms: 1 }
              as: HousingCoordinator
              captures: { unit_u: $.data.id }
            - call: "POST /housing-setups"
              payload: { case_id: "${case_a}", housing_unit_id: "${unit_u}", occupancy_start: "2026-08-10", occupancy_end: "2027-02-10" }
              as: HousingCoordinator
              captures: { setup_a: $.data.id }
            - call: "POST /cases"
              payload: { case_number: "CASE-TO1B", agency_affiliate_code: "AFF-01", household_size: 2, scheduled_arrival_date: "2027-02-10" }
              as: CaseManager
              captures: { case_b: $.data.id }
            - call: "POST /cases"
              payload: { case_number: "CASE-TO1C", agency_affiliate_code: "AFF-01", household_size: 2, scheduled_arrival_date: "2027-02-09" }
              as: CaseManager
              captures: { case_c: $.data.id }
          trigger:
            - call: "POST /housing-setups"
              payload: { case_id: "${case_b}", housing_unit_id: "${unit_u}", occupancy_start: "2027-02-10", occupancy_end: "2027-08-10" }
              as: HousingCoordinator
              captures: { setup_b: $.data.id, setup_b_status: $.data.status }
            - call: "POST /housing-setups"
              payload: { case_id: "${case_c}", housing_unit_id: "${unit_u}", occupancy_start: "2027-02-09", occupancy_end: "2027-08-09" }
              as: HousingCoordinator
              captures: { setup_c_err: $.data.error_id }
          assert:
            - "adjacent setup (start == existing end 2027-02-10): created with status 'PREPARING' (half-open [start, end) — no overlap at the boundary)"
            - "overlapping setup (start 2027-02-09 < existing end 2027-02-10): error_id == 'ERR_UNIT_OCCUPANCY_CONFLICT' with http 409"

      - name: orientation_buffer_semantics
        grounds:
          - validations[priority=8]
          - errors[ERR_SESSION_SCHEDULE_CONFLICT]
          - entities.OrientationSession.fields.start_at
          - entities.OrientationSession.fields.end_at
        distinguishing_aspect: |
          Buffer interval semantics on OrientationSession (a DIFFERENT
          resource than HousingUnit, and a DIFFERENT geometry than half-open
          adjacency): a session starting exactly 30 minutes after the previous
          one ends (10:30 after 10:00) is allowed, while any start inside the
          30-minute post-session buffer (10:00) is rejected — adjacency
          without buffer is forbidden here but allowed for housing.
        test_recipe:
          setup:
            - "Case CASE-TO2 (household_size 1, no members), READY 0-bedroom housing, arrived 2026-08-10"
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_number: "CASE-TO2", agency_affiliate_code: "AFF-01", household_size: 1, scheduled_arrival_date: "2026-08-10" }
              as: CaseManager
              captures: { case_id: $.data.id }
            - call: "POST /housing-units"
              payload: { address: "200 Sycamore St", bedrooms: 0 }
              as: HousingCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /housing-setups"
              payload: { case_id: "${case_id}", housing_unit_id: "${unit_id}", occupancy_start: "2026-08-10", occupancy_end: "2027-02-10" }
              as: HousingCoordinator
              captures: { setup_id: $.data.id }
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "BED" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "LINENS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "TABLE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "CHAIRS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "COOKWARE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "CLEANING_SUPPLIES" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/ready"
              as: HousingCoordinator
            - call: "POST /cases/${case_id}/arrive"
              payload: { actual_arrival_date: "2026-08-10" }
              as: CaseManager
          trigger:
            - call: "POST /orientation-sessions"
              payload: { case_id: "${case_id}", topic: "US_LAWS", start_at: "2026-08-12T09:00:00Z", end_at: "2026-08-12T10:00:00Z" }
              as: CaseManager
              captures: { s1: $.data.id }
            - call: "POST /orientation-sessions"
              payload: { case_id: "${case_id}", topic: "HEALTHCARE_ACCESS", start_at: "2026-08-12T10:30:00Z", end_at: "2026-08-12T11:30:00Z" }
              as: CaseManager
              captures: { s2: $.data.id, s2_status: $.data.status }
            - call: "POST /orientation-sessions"
              payload: { case_id: "${case_id}", topic: "EDUCATION_SYSTEM", start_at: "2026-08-12T10:00:00Z", end_at: "2026-08-12T11:00:00Z" }
              as: CaseManager
              captures: { s3_err: $.data.error_id }
          assert:
            - "S1 (09:00-10:00) created"
            - "S2 (10:30-11:30) created: start exactly at S1.end + 30 minutes satisfies the buffer (gap == 30 minutes is allowed)"
            - "S3 (10:00-11:00): error_id == 'ERR_SESSION_SCHEDULE_CONFLICT' with http 409 (10:00 < 10:00 + 30min buffer of S1; also within S2's pre-buffer)"

  # ===========================================================================
  # Rule 9 — compensating_invariant: unit occupancy conservation vs per-case
  # benchmark-count conservation. DIFFERENT conserved quantities.
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: housing_occupancy_conservation
        grounds:
          - calculations.housing_unit_status
          - state_machines.HousingSetup.PREPARING_to_VACATED
          - entities.HousingUnit.fields.status
        distinguishing_aspect: |
          Conserved quantity: unit availability — the forward action (create
          HousingSetup, unit becomes RESERVED) paired with its compensating
          action (vacate) leaves count(non-terminal setups of the unit) == 0
          and HousingUnit.status == 'AVAILABLE', identical to before the pair.
        test_recipe:
          setup:
            - "Case CASE-CI1 (household_size 1, PRE_ARRIVAL) and 0-bedroom unit U with no setups (status AVAILABLE at default clock 2026-08-01)"
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_number: "CASE-CI1", agency_affiliate_code: "AFF-01", household_size: 1, scheduled_arrival_date: "2026-08-10" }
              as: CaseManager
              captures: { case_id: $.data.id }
            - call: "POST /housing-units"
              payload: { address: "210 Hickory St", bedrooms: 0 }
              as: HousingCoordinator
              captures: { unit_u: $.data.id, unit_status0: $.data.status }
          trigger:
            - call: "POST /housing-setups"
              payload: { case_id: "${case_id}", housing_unit_id: "${unit_u}", occupancy_start: "2026-08-10", occupancy_end: "2027-02-10" }
              as: HousingCoordinator
              captures: { setup_id: $.data.id }
            - call: "GET /housing-units/${unit_u}"
              as: HousingCoordinator
              captures: { unit_status1: $.data.status }
            - call: "POST /housing-setups/${setup_id}/vacate"
              as: HousingCoordinator
              captures: { setup_status: $.data.status }
            - call: "GET /housing-units/${unit_u}"
              as: HousingCoordinator
              captures: { unit_status2: $.data.status }
            - call: "GET /housing-units/${unit_u}/housing-setups"
              as: HousingCoordinator
          assert:
            - "before the pair: HousingUnit.${unit_u}.status == 'AVAILABLE'"
            - "after create (forward action): status == 'RESERVED' (non-terminal setup with occupancy_start 2026-08-10 after clock 2026-08-01)"
            - "after vacate (compensating action): HousingSetup.${setup_id}.status == 'VACATED' and HousingUnit.${unit_u}.status == 'AVAILABLE'"
            - "invariant restored: GET /housing-units/${unit_u}/housing-setups returns exactly 1 setup and it is terminal (VACATED), so count(non-terminal setups) == 0 as before the pair"

      - name: benchmark_status_count_conservation
        grounds:
          - state_machines.ServiceBenchmark.PENDING_to_MET
          - state_machines.ServiceBenchmark.MET_to_PENDING
          - entities.ServiceBenchmark.fields.status
        distinguishing_aspect: |
          Conserved quantity: per-case benchmark status partition — distinct
          from the unit-occupancy quantity of housing_occupancy_conservation.
          For a case seeded with 7 benchmarks, count(MET) + count(PENDING) +
          count(WAIVED) == 7 at every step, and the forward fulfill paired
          with its compensating rescind returns count(MET) to 0 and
          count(PENDING) to 7 with fulfilled_on/on_time/evidence_note_id
          cleared.
        test_recipe:
          setup:
            - "Case CASE-CI2 (household_size 2) with a work-eligible adult member (dob 1990-01-01) and a school-age child member (dob 2016-05-20), READY 1-bedroom housing, arrived 2026-08-10 — 7 benchmarks seeded (5 base + EMPLOYMENT_PLAN + SCHOOL_ENROLLMENT)"
            - "A SERVICE_DELIVERY CaseNote on the case; logical clock 2026-08-20"
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_number: "CASE-CI2", agency_affiliate_code: "AFF-01", household_size: 2, scheduled_arrival_date: "2026-08-10" }
              as: CaseManager
              captures: { case_id: $.data.id }
            - call: "POST /members"
              payload: { case_id: "${case_id}", full_name: "Adult I", date_of_birth: "1990-01-01", relationship: "PRINCIPAL", work_eligible: true }
              as: CaseManager
            - call: "POST /members"
              payload: { case_id: "${case_id}", full_name: "Child I", date_of_birth: "2016-05-20", relationship: "CHILD", work_eligible: false }
              as: CaseManager
            - call: "POST /housing-units"
              payload: { address: "220 Dogwood St", bedrooms: 1 }
              as: HousingCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /housing-setups"
              payload: { case_id: "${case_id}", housing_unit_id: "${unit_id}", occupancy_start: "2026-08-10", occupancy_end: "2027-02-10" }
              as: HousingCoordinator
              captures: { setup_id: $.data.id }
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "BED" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "LINENS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "TABLE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "CHAIRS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "COOKWARE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "CLEANING_SUPPLIES" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/ready"
              as: HousingCoordinator
            - call: "POST /cases/${case_id}/arrive"
              payload: { actual_arrival_date: "2026-08-10" }
              as: CaseManager
            - call: "POST /case-notes"
              payload: { case_id: "${case_id}", note_type: "SERVICE_DELIVERY", body: "Home visit done", service_date: "2026-08-15" }
              as: CaseManager
              captures: { note_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: AgencyDirector
            - call: "GET /cases/${case_id}/benchmarks"
              payload: { service_type: "HOME_VISIT" }
              as: CaseManager
              captures: { bm_home: "$.data[0].id" }
            - call: "GET /cases/${case_id}/benchmarks"
              as: CaseManager
          trigger:
            - call: "POST /benchmarks/${bm_home}/fulfill"
              payload: { fulfilled_on: "2026-08-15", evidence_note_id: "${note_id}" }
              as: CaseManager
              captures: { bm_status1: $.data.status }
            - call: "GET /cases/${case_id}/benchmarks"
              as: CaseManager
            - call: "POST /benchmarks/${bm_home}/rescind"
              as: CaseManager
              captures: { bm_status2: $.data.status, bm_fulfilled2: $.data.fulfilled_on, bm_note2: $.data.evidence_note_id, bm_on_time2: $.data.on_time }
            - call: "GET /cases/${case_id}/benchmarks"
              as: CaseManager
          assert:
            - "before the pair: GET /cases/${case_id}/benchmarks returns exactly 7 items, all with status == 'PENDING'"
            - "after fulfill (forward): ServiceBenchmark.${bm_home}.status == 'MET'; the list shows 6 PENDING + 1 MET; partition total still 7"
            - "after rescind (compensating): status == 'PENDING', fulfilled_on == null, evidence_note_id == null, on_time == null"
            - "invariant restored: the list again shows exactly 7 PENDING; count(MET)+count(PENDING)+count(WAIVED) == 7 throughout"
