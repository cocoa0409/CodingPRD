            - { call: "POST /petting-zoo/bookings", payload: { venue_id: "${v15}", start_time: "2026-06-06T10:00:00Z", end_time: "2026-06-06T12:00:00Z", guest_count: 10, child_guest_count: 0, booking_type: "PRIVATE_PARTY", planned_handwash_stations: 1 }, as: Customer, as_user_id: "${c15}", captures: { bk: $.data.id } }
            - { call: "POST /petting-zoo/bookings/${bk}/animals", payload: { animal_id: "${a_goat}", role: "PETTING_ZOO" }, as: Coordinator, captures: { ba: $.data.id } }
