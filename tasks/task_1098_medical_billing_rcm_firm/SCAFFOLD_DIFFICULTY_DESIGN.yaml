              captures: { claim_v: $.data.version }
            - call: "POST /rcm/remittances"
              payload: { payer_id: "${payer_id}", remittance_ref: "RA-10", total_amount_cents: 10000 }
              as: PaymentPoster
              captures: { rem_id: $.data.id }
            - call: "POST /rcm/remittances/${rem_id}/postings"
              payload: { claim_id: "${claim_id}", insurance_paid_cents: 6000, patient_responsibility_cents: 0, adjustment_cents: 0, expected_claim_version: "${claim_v}" }
              as: PaymentPoster
              captures: { posting_id: $.data.id }
          trigger:
            - call: "POST /rcm/payment-postings/${posting_id}/reverse"
              payload: { reason: "duplicate ERA line" }
              as: PaymentPoster
          assert:
            - "Claim.${claim_id}.billed_amount_cents == 15000"
            - "Claim.${claim_id}.contractual_adjustment_cents == 5000"
            - "Claim.${claim_id}.insurance_paid_cents == 0"
            - "Claim.${claim_id}.patient_responsibility_cents == 0"
            - "Claim.${claim_id}.write_off_cents == 0"
            - "Claim.${claim_id}.outstanding_balance_cents == 10000"
