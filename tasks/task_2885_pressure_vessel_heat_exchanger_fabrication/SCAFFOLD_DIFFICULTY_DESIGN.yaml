              as_user_id: "${qc1_id}"
            - call: "GET /nonconformances?job_id=${job_id}"
              payload: {}
              as: QCInspector
              as_user_id: "${qc1_id}"
              captures: { ncr_id: "$.data[0].id" }
            - call: "POST /nonconformances/${ncr_id}/disposition"
              payload: { disposition: "REPAIR", disposition_notes: "Excavate and reweld per WPS-1; full radiography on the repair." }
              as: QCInspector
              as_user_id: "${qc1_id}"
            - call: "GET /vessel-jobs/${job_id}"
