          assert:
            - "err_guard == ERR_CROP_PLANS_UNRESOLVED (plan still HARVESTING)"
            - "bed_ph == POST_HARVEST after plan COMPLETE; last_harvest_closed_at == 2026-09-15T12:00:00Z"
            - "err_rest1 == ERR_BED_REST_PERIOD_ACTIVE (same instant)"
            - "err_rest2 == ERR_BED_REST_PERIOD_ACTIVE (13 days < 14)"
            - "bed_fallow == FALLOW at +15 days (cyclic edge closes FALLOW -> ... -> FALLOW)"
            - "last_fam == Solanaceae (set when the plan completed)"

