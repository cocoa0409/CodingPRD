            - { call: "POST /freight/compliance-filings/${f1}/submit", payload: {}, as: ComplianceOfficer }
            - { call: "POST /freight/compliance-filings/${f1}/record-response", payload: { outcome: "ACCEPTED" }, as: ComplianceOfficer }
            - { call: "POST /freight/compliance-filings/${f2}/submit", payload: {}, as: ComplianceOfficer }
          trigger:
            - { call: "POST /freight/bill-of-lading/${bl}/release", payload: {}, as: DocumentationOfficer, as_user_id: "doc_2", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FILINGS_NOT_CLEARED (AMS filing ${f2} is SUBMITTED, not ACCEPTED)"
            - "BillOfLading.${bl}.status remains ISSUED"

      - name: booking_create_blocked_by_voyage_not_open
        grounds:
          - validations[priority=6]
          - errors[ERR_VOYAGE_NOT_OPEN]
          - state_machines.Voyage
        distinguishing_aspect: |
          Entity pair Booking x Voyage: creating a booking against a voyage
          still in SCHEDULED fails with ERR_VOYAGE_NOT_OPEN; the identical
          request succeeds after open-for-booking flips the voyage. The booking
          aggregate's very existence is gated by the parent-scope voyage state.
        test_recipe:
          setup:
            - "Shipper, published LCL tariff, active contract; voyage created but left SCHEDULED"
          setup_api_calls:
            - { call: "POST /freight/shippers", payload: { legal_name: "ACME XG2", credit_limit_cents: 100000000 }, as: OperationsManager, captures: { s: $.data.id } }
            - { call: "POST /freight/tariffs", payload: { tariff_code: "T-LCL-1", origin_port: "CNSHA", destination_port: "USLAX", commodity_type: "GENERAL", mode: "LCL", rate_per_unit_cents: 9500, minimum_charge_cents: 20000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1", captures: { t: $.data.id } }
            - { call: "POST /freight/tariffs/${t}/publish", payload: {}, as: ComplianceOfficer, as_user_id: "co_2" }
            - { call: "POST /freight/carrier-contracts", payload: { contract_number: "CARR-1", carrier_name: "MAERSK", service_lane: "CNSHA-USLAX", container_rates: [ { container_type: "40HC", rate_cents: 120000 } ], demurrage_free_days: 4, detention_free_days: 3, demurrage_tiers: [ { from_day: 1, to_day: 3, per_diem_cents: 15000 }, { from_day: 4, to_day: 7, per_diem_cents: 30000 }, { from_day: 8, to_day: null, per_diem_cents: 60000 } ], detention_per_diem_cents: 12000, service_start: "2026-01-01T00:00:00Z", service_end: "2026-12-31T00:00:00Z" }, as: OperationsManager, captures: { c: $.data.id } }
            - { call: "POST /freight/carrier-contracts/${c}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /freight/voyages", payload: { vessel_name: "EVER GIVEN", voyage_number: "EG101", carrier_contract_id: "${c}", origin_port: "CNSHA", destination_port: "USLAX", etd: "2026-09-01T00:00:00Z", eta: "2026-09-21T00:00:00Z" }, as: OperationsManager, captures: { v: $.data.id } }
          trigger:
            - { call: "POST /freight/bookings", payload: { voyage_id: "${v}", tariff_id: "${t}", rate_source: "CONTRACT", mode: "LCL", commodity_type: "GENERAL", gross_weight_kg: 4000, volume_cbm: 6.0, terms: "PREPAID" }, as: Shipper, as_user_id: "${s}", captures: { err: $.data.error_id } }
            - { call: "POST /freight/voyages/${v}/open-for-booking", payload: {}, as: OperationsManager }
            - { call: "POST /freight/bookings", payload: { voyage_id: "${v}", tariff_id: "${t}", rate_source: "CONTRACT", mode: "LCL", commodity_type: "GENERAL", gross_weight_kg: 4000, volume_cbm: 6.0, terms: "PREPAID" }, as: Shipper, as_user_id: "${s}", captures: { b: $.data.id } }
          assert:
            - "first attempt: error_id == ERR_VOYAGE_NOT_OPEN (voyage SCHEDULED)"
            - "after open-for-booking: identical payload succeeds, Booking.${b}.status == QUOTED"

      - name: bl_issue_blocked_by_bond_coverage_after_penalty_accrual
        grounds:
          - state_machines.BillOfLading.DRAFT_to_ISSUED
          - calculations.isf_ams_penalty
          - entities.SuretyBond.fields.available_coverage_cents
          - errors[ERR_BOND_COVERAGE_INSUFFICIENT]
        distinguishing_aspect: |
          Entity pair BillOfLading x SuretyBond: a bond with coverage 80000 is
          sufficient (>= 75000) until a late AMS filing accrues a 30000-cent
          penalty, draining available_coverage_cents to 50000; the next B/L
          issue fails. Cross-entity: a ComplianceFiling mutation flips the
          issue gate on an unrelated B/L.
        test_recipe:
          setup:
            - "Booking CONFIRMED; bond coverage_amount_cents 80000 ACTIVE; AMS filing for the booking; clock at 2026-08-30T00:00:01Z (1s past ams_deadline 2026-08-30T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /freight/shippers", payload: { legal_name: "ACME XG3", credit_limit_cents: 100000000 }, as: OperationsManager, captures: { s: $.data.id } }
            - { call: "POST /freight/tariffs", payload: { tariff_code: "T-FCL-1", origin_port: "CNSHA", destination_port: "USLAX", commodity_type: "GENERAL", mode: "FCL", container_type: "40HC", rate_per_unit_cents: 185000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1", captures: { t: $.data.id } }
            - { call: "POST /freight/tariffs/${t}/publish", payload: {}, as: ComplianceOfficer, as_user_id: "co_2" }
            - { call: "POST /freight/carrier-contracts", payload: { contract_number: "CARR-1", carrier_name: "MAERSK", service_lane: "CNSHA-USLAX", container_rates: [ { container_type: "40HC", rate_cents: 120000 } ], demurrage_free_days: 4, detention_free_days: 3, demurrage_tiers: [ { from_day: 1, to_day: 3, per_diem_cents: 15000 }, { from_day: 4, to_day: 7, per_diem_cents: 30000 }, { from_day: 8, to_day: null, per_diem_cents: 60000 } ], detention_per_diem_cents: 12000, service_start: "2026-01-01T00:00:00Z", service_end: "2026-12-31T00:00:00Z" }, as: OperationsManager, captures: { c: $.data.id } }
            - { call: "POST /freight/carrier-contracts/${c}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /freight/voyages", payload: { vessel_name: "EVER GIVEN", voyage_number: "EG101", carrier_contract_id: "${c}", origin_port: "CNSHA", destination_port: "USLAX", etd: "2026-09-01T00:00:00Z", eta: "2026-09-21T00:00:00Z" }, as: OperationsManager, captures: { v: $.data.id } }
            - { call: "POST /freight/voyages/${v}/open-for-booking", payload: {}, as: OperationsManager }
            - { call: "POST /freight/bookings", payload: { voyage_id: "${v}", tariff_id: "${t}", rate_source: "CONTRACT", mode: "FCL", container_type: "40HC", container_count: 1, commodity_type: "GENERAL", gross_weight_kg: 18000, volume_cbm: 50.0, terms: "COLLECT" }, as: Shipper, as_user_id: "${s}", captures: { b: $.data.id } }
            - { call: "POST /freight/bookings/${b}/confirm", payload: {}, as: BookingCoordinator }
            - { call: "POST /freight/surety-bonds", payload: { bond_number: "BOND-SM", surety_company: "SURETYCO", coverage_amount_cents: 80000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { bd: $.data.id } }
            - { call: "POST /freight/surety-bonds/${bd}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /freight/bill-of-lading", payload: { booking_id: "${b}", bl_type: "HOUSE", release_mode: "SEAWAY" }, as: DocumentationOfficer, as_user_id: "doc_1", captures: { bl: $.data.id } }
            - { call: "POST /freight/compliance-filings", payload: { booking_id: "${b}", filing_type: "AMS" }, as: ComplianceOfficer, captures: { f2: $.data.id } }
            - { call: "POST /freight/_clock/set_current_utc", payload: { to_iso8601: "2026-08-30T00:00:01Z" }, as: OperationsManager }
            - { call: "POST /freight/compliance-filings/${f2}/submit", payload: {}, as: ComplianceOfficer, captures: { late: $.data.is_late, pen: $.data.penalty_amount_cents, penst: $.data.penalty_status } }
          trigger:
            - { call: "GET /freight/surety-bonds/${bd}", payload: {}, as: Any, captures: { avail: $.data.available_coverage_cents } }
            - { call: "POST /freight/bill-of-lading/${bl}/issue", payload: {}, as: DocumentationOfficer, as_user_id: "doc_1", captures: { err: $.data.error_id } }
          assert:
            - "late AMS submit: ComplianceFiling.${f2}.is_late == true, penalty_status == ACCRUED, penalty_amount_cents == 30000"
            - "SuretyBond.${bd}.available_coverage_cents == 50000 (80000 - 30000)"
            - "B/L issue rejected: error_id == ERR_BOND_COVERAGE_INSUFFICIENT (50000 < 75000 minimum)"
            - "BillOfLading.${bl}.status remains DRAFT"

  - rule_id: resource_temporal_overlap
    instances:
      - name: tariff_halfopen_window_adjacency_allowed_overlap_rejected
        grounds:
          - validations[priority=11]
          - errors[ERR_TARIFF_WINDOW_OVERLAP]
          - state_machines.Tariff.DRAFT_to_PUBLISHED
          - entities.Tariff.fields.effective_to
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [effective_from, effective_to) on
          resource Tariff. Tariff B starting exactly at tariff A's effective_to
          (2026-11-01) is NOT an intersection and publishes; tariff C straddling
          A's interior rejects. Contrast with the closed-interval contract rule.
        test_recipe:
          setup:
            - "Tariff T_A (key CNSHA/USLAX/GENERAL/LCL) PUBLISHED with window [2026-08-01, 2026-11-01)"
          setup_api_calls:
            - { call: "POST /freight/tariffs", payload: { tariff_code: "T-A", origin_port: "CNSHA", destination_port: "USLAX", commodity_type: "GENERAL", mode: "LCL", rate_per_unit_cents: 9500, minimum_charge_cents: 20000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1", captures: { ta: $.data.id } }
            - { call: "POST /freight/tariffs/${ta}/publish", payload: {}, as: ComplianceOfficer, as_user_id: "co_2" }
            - { call: "POST /freight/tariffs", payload: { tariff_code: "T-B", origin_port: "CNSHA", destination_port: "USLAX", commodity_type: "GENERAL", mode: "LCL", rate_per_unit_cents: 9900, minimum_charge_cents: 20000, effective_from: "2026-11-01T00:00:00Z", effective_to: "2027-02-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1", captures: { tb: $.data.id } }
            - { call: "POST /freight/tariffs", payload: { tariff_code: "T-C", origin_port: "CNSHA", destination_port: "USLAX", commodity_type: "GENERAL", mode: "LCL", rate_per_unit_cents: 9200, minimum_charge_cents: 20000, effective_from: "2026-10-15T00:00:00Z", effective_to: "2026-12-15T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1", captures: { tc: $.data.id } }
          trigger:
            - { call: "POST /freight/tariffs/${tb}/publish", payload: {}, as: ComplianceOfficer, as_user_id: "co_2", captures: { tb_st: $.data.status } }
            - { call: "POST /freight/tariffs/${tc}/publish", payload: {}, as: ComplianceOfficer, as_user_id: "co_2", captures: { err: $.data.error_id } }
          assert:
            - "T-B publish succeeds: status == PUBLISHED (adjacency at 2026-11-01T00:00:00Z is allowed because windows are half-open)"
            - "T-C publish rejected: error_id == ERR_TARIFF_WINDOW_OVERLAP (its [2026-10-15, 2026-12-15) intersects T-A's [2026-08-01, 2026-11-01))"
            - "Tariff.${tc}.status remains DRAFT"

      - name: contract_closed_window_adjacency_conflicts
        grounds:
          - validations[priority=11]
          - errors[ERR_CONTRACT_WINDOW_OVERLAP]
          - state_machines.CarrierContract.NEGOTIATION_to_ACTIVE
          - entities.CarrierContract.fields.service_end
        distinguishing_aspect: |
          Interval semantics: CLOSED [service_start, service_end] on resource
          CarrierContract — the OPPOSITE geometric treatment from the tariff
          rule. A second contract on the same carrier+lane whose service_start
          equals the first contract's service_end DOES intersect (adjacency is a
          conflict here); only a strictly later start (2026-07-01) activates.
        test_recipe:
          setup:
            - "Contract C_A (OOCL, CNSHA-USLAX) ACTIVE with closed window [2026-01-01, 2026-06-30]; contracts C_B (start == 2026-06-30) and C_C (start == 2026-07-01) in NEGOTIATION, same carrier+lane"
          setup_api_calls:
            - { call: "POST /freight/carrier-contracts", payload: { contract_number: "OOCL-A", carrier_name: "OOCL", service_lane: "CNSHA-USLAX", container_rates: [ { container_type: "40HC", rate_cents: 120000 } ], demurrage_free_days: 4, detention_free_days: 3, demurrage_tiers: [ { from_day: 1, to_day: 3, per_diem_cents: 15000 }, { from_day: 4, to_day: 7, per_diem_cents: 30000 }, { from_day: 8, to_day: null, per_diem_cents: 60000 } ], detention_per_diem_cents: 12000, service_start: "2026-01-01T00:00:00Z", service_end: "2026-06-30T00:00:00Z" }, as: OperationsManager, captures: { ca: $.data.id } }
            - { call: "POST /freight/carrier-contracts/${ca}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /freight/carrier-contracts", payload: { contract_number: "OOCL-B", carrier_name: "OOCL", service_lane: "CNSHA-USLAX", container_rates: [ { container_type: "40HC", rate_cents: 125000 } ], demurrage_free_days: 4, detention_free_days: 3, demurrage_tiers: [ { from_day: 1, to_day: 3, per_diem_cents: 15000 }, { from_day: 4, to_day: 7, per_diem_cents: 30000 }, { from_day: 8, to_day: null, per_diem_cents: 60000 } ], detention_per_diem_cents: 12000, service_start: "2026-06-30T00:00:00Z", service_end: "2026-12-31T00:00:00Z" }, as: OperationsManager, captures: { cb: $.data.id } }
            - { call: "POST /freight/carrier-contracts", payload: { contract_number: "OOCL-C", carrier_name: "OOCL", service_lane: "CNSHA-USLAX", container_rates: [ { container_type: "40HC", rate_cents: 125000 } ], demurrage_free_days: 4, detention_free_days: 3, demurrage_tiers: [ { from_day: 1, to_day: 3, per_diem_cents: 15000 }, { from_day: 4, to_day: 7, per_diem_cents: 30000 }, { from_day: 8, to_day: null, per_diem_cents: 60000 } ], detention_per_diem_cents: 12000, service_start: "2026-07-01T00:00:00Z", service_end: "2026-12-31T00:00:00Z" }, as: OperationsManager, captures: { cc: $.data.id } }
          trigger:
            - { call: "POST /freight/carrier-contracts/${cb}/activate", payload: {}, as: OperationsManager, captures: { err: $.data.error_id } }
            - { call: "POST /freight/carrier-contracts/${cc}/activate", payload: {}, as: OperationsManager, captures: { cc_st: $.data.status } }
          assert:
            - "C-B activate rejected: error_id == ERR_CONTRACT_WINDOW_OVERLAP (service_start 2026-06-30T00:00:00Z equals C-A's INCLUSIVE service_end — closed-interval adjacency is an intersection)"
            - "CarrierContract.${cb}.status remains NEGOTIATION"
            - "C-C activate succeeds: status == ACTIVE (2026-07-01T00:00:00Z is strictly after 2026-06-30T00:00:00Z)"

  - rule_id: compensating_invariant
    instances:
      - name: consolidation_capacity_stuff_unstuff_conservation
        grounds:
          - calculations.consolidation_utilization
          - state_machines.ContainerAssignment.STUFFED_to_CANCELLED
          - entities.Consolidation.fields.used_weight_kg
          - entities.Consolidation.fields.used_volume_cbm
        distinguishing_aspect: |
          Conserved quantity: consolidation free capacity (used_weight_kg,
          used_volume_cbm). Forward action stuff (+6000kg/+60cbm) paired with
          its compensating unstuff returns both fields to EXACTLY their
          pre-stuff values (0 / 0.0) — no drift — while version still advances
          (mutation counter is NOT part of the conserved quantity).
        test_recipe:
          setup:
            - "OPEN consolidation (max 10000kg/100cbm), CONFIRMED LCL booking 6000kg/60cbm"
          setup_api_calls:
            - { call: "POST /freight/shippers", payload: { legal_name: "ACME CONS", credit_limit_cents: 100000000 }, as: OperationsManager, captures: { s: $.data.id } }
            - { call: "POST /freight/tariffs", payload: { tariff_code: "T-LCL-1", origin_port: "CNSHA", destination_port: "USLAX", commodity_type: "GENERAL", mode: "LCL", rate_per_unit_cents: 9500, minimum_charge_cents: 20000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1", captures: { t: $.data.id } }
            - { call: "POST /freight/tariffs/${t}/publish", payload: {}, as: ComplianceOfficer, as_user_id: "co_2" }
            - { call: "POST /freight/carrier-contracts", payload: { contract_number: "CARR-1", carrier_name: "MAERSK", service_lane: "CNSHA-USLAX", container_rates: [ { container_type: "40HC", rate_cents: 120000 } ], demurrage_free_days: 4, detention_free_days: 3, demurrage_tiers: [ { from_day: 1, to_day: 3, per_diem_cents: 15000 }, { from_day: 4, to_day: 7, per_diem_cents: 30000 }, { from_day: 8, to_day: null, per_diem_cents: 60000 } ], detention_per_diem_cents: 12000, service_start: "2026-01-01T00:00:00Z", service_end: "2026-12-31T00:00:00Z" }, as: OperationsManager, captures: { c: $.data.id } }
            - { call: "POST /freight/carrier-contracts/${c}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /freight/voyages", payload: { vessel_name: "EVER GIVEN", voyage_number: "EG101", carrier_contract_id: "${c}", origin_port: "CNSHA", destination_port: "USLAX", etd: "2026-09-01T00:00:00Z", eta: "2026-09-21T00:00:00Z" }, as: OperationsManager, captures: { v: $.data.id } }
            - { call: "POST /freight/voyages/${v}/open-for-booking", payload: {}, as: OperationsManager }
            - { call: "POST /freight/bookings", payload: { voyage_id: "${v}", tariff_id: "${t}", rate_source: "CONTRACT", mode: "LCL", commodity_type: "GENERAL", gross_weight_kg: 6000, volume_cbm: 60.0, terms: "PREPAID" }, as: Shipper, as_user_id: "${s}", captures: { b: $.data.id } }
            - { call: "POST /freight/bookings/${b}/confirm", payload: {}, as: BookingCoordinator }
            - { call: "POST /freight/consolidations", payload: { voyage_id: "${v}", cfs_location: "CFS-LAX-01", container_type: "40HC", max_weight_kg: 10000, max_volume_cbm: 100.0, stuffing_window_start: "2026-08-10T00:00:00Z", stuffing_window_end: "2026-08-15T00:00:00Z" }, as: BookingCoordinator, captures: { con: $.data.id, con_v: $.data.version } }
          trigger:
            - { call: "POST /freight/consolidations/${con}/stuff", payload: { booking_id: "${b}", expected_consolidation_version: "${con_v}" }, as: BookingCoordinator }
            - { call: "GET /freight/consolidations/${con}", payload: {}, as: Any, captures: { w_mid: $.data.used_weight_kg, v_mid: $.data.used_volume_cbm } }
            - { call: "POST /freight/consolidations/${con}/unstuff", payload: { booking_id: "${b}" }, as: BookingCoordinator, captures: { w_end: $.data.used_weight_kg, v_end: $.data.used_volume_cbm, ver_end: $.data.version } }
          assert:
            - "after stuff: used_weight_kg == 6000 and used_volume_cbm == 60.0"
            - "after unstuff (compensating action): used_weight_kg == 0 and used_volume_cbm == 0 — invariant used(0) == used(post-round-trip) holds exactly"
            - "Consolidation.${con}.version advances on each mutation (1 -> 2 -> 3) even though the conserved quantities return to baseline"

      - name: shipper_credit_exposure_confirm_cancel_conservation
        grounds:
          - calculations.credit_exposure
          - state_machines.Booking.QUOTED_to_CONFIRMED
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - entities.Shipper.fields.credit_exposure_forward_cents
        distinguishing_aspect: |
          Conserved quantity: shipper credit exposure (cents, BOTH variants).
          Confirm raises forward exposure by the estimate (77400); the
          compensating cancel removes the booking from the forward set and
          leaves only a DRAFT cancellation invoice (not in the posted set), so
          forward and posted both return to exactly 0.
        test_recipe:
          setup:
            - "Shipper with zero baseline exposure; LCL booking QUOTED (estimate 77400)"
          setup_api_calls:
            - { call: "POST /freight/shippers", payload: { legal_name: "ACME EXP", credit_limit_cents: 100000000 }, as: OperationsManager, captures: { s: $.data.id } }
            - { call: "POST /freight/tariffs", payload: { tariff_code: "T-LCL-1", origin_port: "CNSHA", destination_port: "USLAX", commodity_type: "GENERAL", mode: "LCL", rate_per_unit_cents: 9500, minimum_charge_cents: 20000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1", captures: { t: $.data.id } }
            - { call: "POST /freight/tariffs/${t}/publish", payload: {}, as: ComplianceOfficer, as_user_id: "co_2" }
            - { call: "POST /freight/carrier-contracts", payload: { contract_number: "CARR-1", carrier_name: "MAERSK", service_lane: "CNSHA-USLAX", container_rates: [ { container_type: "40HC", rate_cents: 120000 } ], demurrage_free_days: 4, detention_free_days: 3, demurrage_tiers: [ { from_day: 1, to_day: 3, per_diem_cents: 15000 }, { from_day: 4, to_day: 7, per_diem_cents: 30000 }, { from_day: 8, to_day: null, per_diem_cents: 60000 } ], detention_per_diem_cents: 12000, service_start: "2026-01-01T00:00:00Z", service_end: "2026-12-31T00:00:00Z" }, as: OperationsManager, captures: { c: $.data.id } }
            - { call: "POST /freight/carrier-contracts/${c}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /freight/voyages", payload: { vessel_name: "EVER GIVEN", voyage_number: "EG101", carrier_contract_id: "${c}", origin_port: "CNSHA", destination_port: "USLAX", etd: "2026-09-01T00:00:00Z", eta: "2026-09-21T00:00:00Z" }, as: OperationsManager, captures: { v: $.data.id } }
            - { call: "POST /freight/voyages/${v}/open-for-booking", payload: {}, as: OperationsManager }
            - { call: "POST /freight/bookings", payload: { voyage_id: "${v}", tariff_id: "${t}", rate_source: "CONTRACT", mode: "LCL", commodity_type: "GENERAL", gross_weight_kg: 4000, volume_cbm: 6.0, terms: "PREPAID" }, as: Shipper, as_user_id: "${s}", captures: { b: $.data.id } }
          trigger:
            - { call: "POST /freight/bookings/${b}/confirm", payload: {}, as: BookingCoordinator }
            - { call: "GET /freight/shippers/${s}", payload: {}, as: Any, captures: { fwd_mid: $.data.credit_exposure_forward_cents, post_mid: $.data.credit_exposure_posted_cents } }
            - { call: "POST /freight/bookings/${b}/cancel", payload: { reason: "compensation test" }, as: BookingCoordinator }
            - { call: "GET /freight/shippers/${s}", payload: {}, as: Any, captures: { fwd_end: $.data.credit_exposure_forward_cents, post_end: $.data.credit_exposure_posted_cents } }
          assert:
            - "after confirm: credit_exposure_forward_cents == 77400, credit_exposure_posted_cents == 0"
            - "after cancel: credit_exposure_forward_cents == 0 and credit_exposure_posted_cents == 0 — invariant exposure(baseline) == exposure(post-round-trip) holds for both variants"
            - "Booking.${b}.status == CANCELLED; the CANCELLATION invoice (75000) sits in DRAFT and never enters either exposure variant"

      - name: bond_coverage_accrue_resolve_conservation
        grounds:
          - calculations.isf_ams_penalty
          - entities.SuretyBond.fields.available_coverage_cents
          - entities.ComplianceFiling.fields.penalty_status
        distinguishing_aspect: |
          Conserved quantity: bond available coverage (cents). A late ISF
          submission debits 500000 from available_coverage_cents; the
          compensating resolve-penalty (WAIVED) restores it to exactly
          coverage_amount_cents. Different conserved quantity from capacity
          (kg/cbm) and exposure (shipper receivables).
        test_recipe:
          setup:
            - "Bond 7500000 ACTIVE; booking CONFIRMED with an ISF filing; clock at 2026-08-31T00:00:01Z (1s past isf_deadline 2026-08-31T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /freight/shippers", payload: { legal_name: "ACME BOND", credit_limit_cents: 100000000 }, as: OperationsManager, captures: { s: $.data.id } }
            - { call: "POST /freight/tariffs", payload: { tariff_code: "T-LCL-1", origin_port: "CNSHA", destination_port: "USLAX", commodity_type: "GENERAL", mode: "LCL", rate_per_unit_cents: 9500, minimum_charge_cents: 20000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1", captures: { t: $.data.id } }
            - { call: "POST /freight/tariffs/${t}/publish", payload: {}, as: ComplianceOfficer, as_user_id: "co_2" }
            - { call: "POST /freight/carrier-contracts", payload: { contract_number: "CARR-1", carrier_name: "MAERSK", service_lane: "CNSHA-USLAX", container_rates: [ { container_type: "40HC", rate_cents: 120000 } ], demurrage_free_days: 4, detention_free_days: 3, demurrage_tiers: [ { from_day: 1, to_day: 3, per_diem_cents: 15000 }, { from_day: 4, to_day: 7, per_diem_cents: 30000 }, { from_day: 8, to_day: null, per_diem_cents: 60000 } ], detention_per_diem_cents: 12000, service_start: "2026-01-01T00:00:00Z", service_end: "2026-12-31T00:00:00Z" }, as: OperationsManager, captures: { c: $.data.id } }
            - { call: "POST /freight/carrier-contracts/${c}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /freight/voyages", payload: { vessel_name: "EVER GIVEN", voyage_number: "EG101", carrier_contract_id: "${c}", origin_port: "CNSHA", destination_port: "USLAX", etd: "2026-09-01T00:00:00Z", eta: "2026-09-21T00:00:00Z" }, as: OperationsManager, captures: { v: $.data.id } }
            - { call: "POST /freight/voyages/${v}/open-for-booking", payload: {}, as: OperationsManager }
            - { call: "POST /freight/bookings", payload: { voyage_id: "${v}", tariff_id: "${t}", rate_source: "CONTRACT", mode: "LCL", commodity_type: "GENERAL", gross_weight_kg: 4000, volume_cbm: 6.0, terms: "PREPAID" }, as: Shipper, as_user_id: "${s}", captures: { b: $.data.id } }
            - { call: "POST /freight/bookings/${b}/confirm", payload: {}, as: BookingCoordinator }
            - { call: "POST /freight/surety-bonds", payload: { bond_number: "BOND-1", surety_company: "SURETYCO", coverage_amount_cents: 7500000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { bd: $.data.id } }
            - { call: "POST /freight/surety-bonds/${bd}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /freight/compliance-filings", payload: { booking_id: "${b}", filing_type: "ISF" }, as: ComplianceOfficer, captures: { f1: $.data.id } }
            - { call: "POST /freight/_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:01Z" }, as: OperationsManager }
          trigger:
            - { call: "POST /freight/compliance-filings/${f1}/submit", payload: {}, as: ComplianceOfficer, captures: { pen: $.data.penalty_amount_cents } }
            - { call: "GET /freight/surety-bonds/${bd}", payload: {}, as: Any, captures: { avail_mid: $.data.available_coverage_cents } }
            - { call: "POST /freight/compliance-filings/${f1}/resolve-penalty", payload: { resolution: "WAIVED" }, as: ComplianceOfficer, captures: { penst: $.data.penalty_status } }
            - { call: "GET /freight/surety-bonds/${bd}", payload: {}, as: Any, captures: { avail_end: $.data.available_coverage_cents } }
          assert:
            - "late ISF: penalty_amount_cents == 500000 (ISF schedule, not the 300000 AMS figure)"
            - "after accrual: SuretyBond.${bd}.available_coverage_cents == 7000000 (7500000 - 500000)"
            - "after resolve-penalty WAIVED: penalty_status == WAIVED and available_coverage_cents == 7500000 — invariant available == coverage restored exactly"
