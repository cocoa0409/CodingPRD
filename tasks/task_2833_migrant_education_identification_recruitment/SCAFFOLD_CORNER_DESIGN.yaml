      - name: corner_creating_a_second_plan_of_the_same_type_supersedes_the_first
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ServicePlan.DRAFT_to_SUPERSEDED
          - entities.ServicePlan.fields.superseded_by_plan_id
          - entities.ServicePlan.fields.closure_reason
          - calculations.service_hours_allocation
          - endpoints[POST /mep/service-plans]
        distinguishing_aspect: "Creating a second SUMMER_PROGRAM plan for the same student fires every declared side effect of DRAFT -> SUPERSEDED at once: the first plan becomes SUPERSEDED with closure_reason SUPERSEDED and superseded_by_plan_id pointing at the new plan, keeps the 75.00 hours it last held, and the new plan is allocated the full 75.00 because SUPERSEDED plans leave the allocation input set."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default"
            - "one OPEN AgriculturalArea, one ACTIVE Recruiter, one ENROLLED Student with pfs_flag false"
            - "one DRAFT SUMMER_PROGRAM ServicePlan allocated the whole 75.00 NON_PFS budget"
          setup_api_calls:
            - call: "POST /mep/areas"
              payload: { name: "Yakima Valley", state_code: "WA", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-06-01", peak_season_end_date: "2026-09-30", recruiter_capacity: 3 }
              as: StateProgramAdmin
              captures: { area_id: $.data.id }
            - call: "POST /mep/recruiters"
              payload: { full_name: "Rosa Aguilar", state_code: "WA", credential_level: "BASIC", status: "ACTIVE" }
              as: StateProgramAdmin
              captures: { rec_a_id: $.data.id }
            - call: "POST /mep/students"
              payload: { full_name: "Mateo Reyes", birth_date: "2010-03-20", current_state_code: "WA", area_id: "${area_id}" }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { stu_id: $.data.id }
            - call: "GET /mep/students/${stu_id}"
              payload: {}
              as: ServiceCoordinator
              captures: { stu_v1: $.data.version }
            - call: "POST /mep/service-plans"
              payload: { student_id: "${stu_id}", plan_type: "SUMMER_PROGRAM", delivery_mode: "IN_PERSON", expected_student_version: "${stu_v1}" }
              as: ServiceCoordinator
              captures: { plan_1_id: $.data.id, alloc_1: $.data.allocated_hours }
            - call: "GET /mep/students/${stu_id}"
              payload: {}
              as: ServiceCoordinator
              captures: { stu_v2: $.data.version }
          trigger:
            - call: "POST /mep/service-plans"
              payload: { student_id: "${stu_id}", plan_type: "SUMMER_PROGRAM", delivery_mode: "VIRTUAL", expected_student_version: "${stu_v2}" }
              as: ServiceCoordinator
              captures: { plan_2_id: $.data.id, alloc_2: $.data.allocated_hours }
          assert:
            - "before the trigger ServicePlan.${plan_1_id}.status == DRAFT, allocated_hours == 75.00, priority_tier == NON_PFS, superseded_by_plan_id is null and closure_reason is null"
            - "after the trigger ServicePlan.${plan_1_id}.status == SUPERSEDED, closure_reason == SUPERSEDED and superseded_by_plan_id == ${plan_2_id}"
            - "after the trigger ServicePlan.${plan_1_id}.allocated_hours is still 75.00 - a superseded plan keeps the hours it last held"
            - "after the trigger ServicePlan.${plan_2_id}.status == DRAFT, delivery_mode == VIRTUAL, allocated_hours == 75.00, expected_service_hours == 75.00 and priority_tier == NON_PFS"
            - "Student.${stu_id}.service_status == PLAN_DRAFTED and Student.${stu_id}.version == ${stu_v2} + 1"
            - "GET /mep/service-plans filtered by superseded_by_plan_id ${plan_2_id} returns exactly 1 row, ${plan_1_id}"

      - name: corner_transfer_reconcile_syncs_the_student_credit_ledger
        claim_type: Ledger sync
        grounds:
          - state_machines.RecordTransferRequest.RECEIVED_to_RECONCILED
          - calculations.transfer_credit_reconciliation
          - entities.Student.fields.transferred_credits_count
          - entities.Student.fields.total_awarded_credits
          - entities.RecordTransferRequest.fields.applied_transferred_credits
          - endpoints[POST /mep/transfer-requests/{request_id}/reconcile]
        distinguishing_aspect: "The RECEIVED -> RECONCILED transition pushes its result down into an ancestor's derived fields: with no locally accrued credits and 10.00 reported, tier_key is 10.00, the tier-1 cap 0.50 applies and exactly 5.00 credits are written to both RecordTransferRequest.applied_transferred_credits and Student.transferred_credits_count, leaving Student.total_awarded_credits at 5.00."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default"
            - "one OPEN AgriculturalArea, one ACTIVE Recruiter, two ENROLLED Students (incoming and prior record), neither with any ServiceDelivery"
            - "one RecordTransferRequest for the incoming student reporting 10.00 prior credits, matched to the prior record and then received"
          setup_api_calls:
            - call: "POST /mep/areas"
              payload: { name: "Yakima Valley", state_code: "WA", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-06-01", peak_season_end_date: "2026-09-30", recruiter_capacity: 3 }
