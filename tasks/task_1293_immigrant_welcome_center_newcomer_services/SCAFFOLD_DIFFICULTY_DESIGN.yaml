              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/send"
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "POST /appointments"
              payload: { case_id: "${case_id}", advocate_id: "${mgr1_id}", kind: "ACCOMPANIMENT", starts_at: "2026-08-10T10:00:00Z", ends_at: "2026-08-10T11:00:00Z", referral_id: "${ref_id}" }
              as: CaseManager
