      - name: service_period_creation_depends_on_concession_status
        entity_pair: "(ServicePeriod, Concession)"
        grounds:
          - validations.priority_42
          - state_machines.Concession.CONSTRUCTION_to_OPERATIONS
          - endpoints.POST_ppp_concessions_id_service_periods
        distinguishing_aspect: |
          The child's creation is gated on the PARENT's state, not its own: a ServicePeriod
          has no state to be wrong yet, and the request body is identical in both attempts.
          While the Concession is in CONSTRUCTION the identical POST is refused with
          ERR_CONCESSION_STATE_FORBIDS_OPERATION (409); the only thing that changes between
          the two attempts is a certify-service-commencement call on a DIFFERENT endpoint
          against a DIFFERENT entity.
        test_recipe:
          setup:
            - "Concession at CONSTRUCTION (financial close done, one 120000000 milestone disbursed so cumulative_drawn_pct == 0.3000), actual_service_commencement still null."
            - "No ServicePeriod rows exist."
            - "Logical clock at 2027-01-21T00:00:00Z."
