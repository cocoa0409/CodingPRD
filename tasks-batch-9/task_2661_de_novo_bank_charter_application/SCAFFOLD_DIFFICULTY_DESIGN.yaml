            - call: "POST /de-novo/subscriptions/${s1_id}/screening-result"
              payload: { outcome: "CLEARED" }
              as: EscrowAgent
            - call: "POST /de-novo/subscriptions/${s2_id}/screening-result"
              payload: { outcome: "CLEARED" }
              as: EscrowAgent
            - call: "POST /de-novo/regulatory-filings"
              payload: { group_id: "${g_id}", authority: "CHARTERING_AUTHORITY", pinned_business_plan_id: "${p_id}" }
              as: CharterCounsel
              captures: { f_ca_id: $.data.id }
            - call: "POST /de-novo/regulatory-filings"
              payload: { group_id: "${g_id}", authority: "DEPOSIT_INSURER", pinned_business_plan_id: "${p_id}" }
              as: CharterCounsel
              captures: { f_di_id: $.data.id }
            - call: "POST /de-novo/regulatory-filings/${f_ca_id}/file"
              payload: {}
              as: CharterCounsel
            - call: "POST /de-novo/regulatory-filings/${f_di_id}/file"
              payload: {}
              as: CharterCounsel
            - call: "POST /de-novo/regulatory-filings/${f_ca_id}/decision"
              payload: { decision: "CONDITIONALLY_APPROVED" }
              as: CharteringExaminer
            - call: "POST /de-novo/regulatory-filings/${f_di_id}/decision"
              payload: { decision: "CONDITIONALLY_APPROVED" }
              as: InsuranceExaminer
            - call: "POST /de-novo/regulatory-filings/${f_ca_id}/conditions"
              payload: { condition_code: "POL-01", category: "POLICY", is_pre_opening_blocking: true, deadline_utc: "2026-12-01T00:00:00Z" }
              as: CharteringExaminer
              captures: { c_pol_id: $.data.id }
            - call: "POST /de-novo/regulatory-filings/${f_ca_id}/conditions"
              payload: { condition_code: "CAP-01", category: "CAPITAL", is_pre_opening_blocking: false, deadline_utc: "2026-12-01T00:00:00Z" }
              as: CharteringExaminer
              captures: { c_cap_id: $.data.id }
            - call: "POST /de-novo/approval-conditions/${c_pol_id}/evidence"
              payload: { evidence_reference: "BOARD-MIN-2026-09-14" }
              as: CharterCounsel
            - call: "POST /de-novo/approval-conditions/${c_pol_id}/adjudicate"
              payload: { disposition: "SATISFIED" }
              as: CharteringExaminer
            - call: "POST /de-novo/approval-conditions/${c_cap_id}/evidence"
              payload: { evidence_reference: "ESCROW-STMT-2026-09-01" }
              as: CharterCounsel
            - call: "POST /de-novo/approval-conditions/${c_cap_id}/adjudicate"
              payload: { disposition: "SATISFIED" }
              as: CharteringExaminer
          trigger:
            - call: "POST /de-novo/approval-conditions/${c_pol_id}/adjudicate"
              payload: { disposition: "REOPENED" }
              as: CharteringExaminer
            - call: "POST /de-novo/approval-conditions/${c_pol_id}/evidence"
              payload: { evidence_reference: "BOARD-MIN-2026-09-14-AMENDED" }
              as: CharterCounsel
            - call: "POST /de-novo/approval-conditions/${c_pol_id}/adjudicate"
              payload: { disposition: "SATISFIED" }
              as: CharteringExaminer
          assert:
            - "before the trigger RegulatoryFiling.${f_ca_id}.condition_total_count == 2, settled_condition_count == 2, open_blocking_condition_count == 0, pre_opening_clearance == true"
            - "before the trigger ApprovalCondition.${c_pol_id}.adjudication_count == 1"
            - "after the REOPENED adjudication ApprovalCondition.${c_pol_id}.status == OPEN"
            - "after the REOPENED adjudication ApprovalCondition.${c_pol_id}.adjudication_count == 2"
            - "after the REOPENED adjudication RegulatoryFiling.${f_ca_id}.settled_condition_count == 1"
            - "after the REOPENED adjudication RegulatoryFiling.${f_ca_id}.open_blocking_condition_count == 1"
            - "after the REOPENED adjudication RegulatoryFiling.${f_ca_id}.condition_total_count == 2"
            - "after the REOPENED adjudication RegulatoryFiling.${f_ca_id}.status == ADDITIONAL_INFO_REQUESTED and info_request_round == 1"
            - "after the final SATISFIED adjudication RegulatoryFiling.${f_ca_id}.settled_condition_count == 2 - restored"
            - "after the final SATISFIED adjudication RegulatoryFiling.${f_ca_id}.open_blocking_condition_count == 0 - restored"
            - "after the final SATISFIED adjudication RegulatoryFiling.${f_ca_id}.condition_total_count == 2 - never moved"
            - "after the final SATISFIED adjudication ApprovalCondition.${c_pol_id}.adjudication_count == 3 - the audit trail grew even though the counts returned"
            - "after the final SATISFIED adjudication ApprovalCondition.${c_cap_id}.adjudication_count == 1 - the other condition was untouched"
            - "after the final SATISFIED adjudication RegulatoryFiling.${f_ca_id}.pre_opening_clearance == false, because the filing itself is no longer CONDITIONALLY_APPROVED"
