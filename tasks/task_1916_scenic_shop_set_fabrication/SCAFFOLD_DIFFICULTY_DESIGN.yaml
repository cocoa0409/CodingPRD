            - "after resubmit: EngineeringReview.${rev_2}.status == PENDING and round_no == 2"
            - "after final approve: EngineeringReview.${rev_2}.status == APPROVED and Production.${prod_id}.status == IN_BUILD  # bubble-up"

      - name: finish_sample_reject_resubmit_cycle_rounds
        grounds:
