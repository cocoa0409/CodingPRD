              as_user_id: "${ops}"
              captures: { pv_fresh: $.data.version }
            - call: "POST /fof/programs/${prog}/commitments/${com2}/execute"
              payload: { sized_amount: 5000000, expected_program_version: "${pv_fresh}" }
              as: OperationsAnalyst
              as_user_id: "${ops}"
          assert:
