      - name: owner_directed_payment_is_forced_onto_statutory_order_for_a_lien_filed_unit
        claim_type: variant_selection
        grounds:
          - calculations.payment_application_waterfall.variants.STATUTORY_PRIORITY
          - calculations.payment_application_waterfall.variants.OWNER_DIRECTED
          - calculations.payment_application_waterfall.constants.BUCKET_ORDER
        distinguishing_aspect: "A LIEN_FILED unit's OWNER_DIRECTED request is silently DOWNGRADED to statutory order rather than rejected, so the 60000-cent payment clears INTEREST first (50000) and only then touches ASSESSMENT (10000); the identically-shaped LATE_NOTICE unit keeps the directed order and puts all 60000 on ASSESSMENT."
        test_recipe:
          setup:
            - "Unit 101 (LIEN_FILED): INTEREST 50000 and ASSESSMENT 200000 both due 2026-04-01, balance 250000 at 122 days. Unit 102 (LATE_NOTICE): INTEREST 50000 and ASSESSMENT 100000 both due 2026-04-01, balance 150000 at 122 days. Clock 2026-08-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: CommunityManager
              payload: { current_utc: "2026-08-01T00:00:00Z" }
            - call: "POST /associations"
              as: CommunityManager
              payload: { legal_name: "Harbor Point Condominium Association" }
              captures: { assoc: "$.data.id" }
            - call: "POST /associations/${assoc}/owners"
              as: CommunityManager
              payload: { full_name: "Owen Pratt", email: "owen@example.com" }
              captures: { owner1: "$.data.id" }
            - call: "POST /associations/${assoc}/units"
              as: CommunityManager
              payload: { current_owner_id: "${owner1}", unit_label: "101", interest_bp: 5000, heated_sqft: 1000 }
              captures: { unit1: "$.data.id" }
            - call: "POST /associations/${assoc}/units"
              as: CommunityManager
              payload: { current_owner_id: "${owner1}", unit_label: "102", interest_bp: 5000, heated_sqft: 1000 }
              captures: { unit2: "$.data.id" }
            - call: "POST /units/${unit1}/charges"
              as: CommunityManager
              payload: { entry_type: "INTEREST", amount_cents: 50000, due_on: "2026-04-01T00:00:00Z", effective_period: "2026-04", memo: "statutory interest" }
              captures: { int1: "$.data.id" }
            - call: "POST /units/${unit1}/charges"
              as: CommunityManager
              payload: { entry_type: "ASSESSMENT", amount_cents: 200000, due_on: "2026-04-01T00:00:00Z", effective_period: "2026-04", memo: "April assessment" }
              captures: { asmt1: "$.data.id" }
            - call: "POST /units/${unit2}/charges"
              as: CommunityManager
              payload: { entry_type: "INTEREST", amount_cents: 50000, due_on: "2026-04-01T00:00:00Z", effective_period: "2026-04", memo: "statutory interest" }
              captures: { int2: "$.data.id" }
            - call: "POST /units/${unit2}/charges"
              as: CommunityManager
              payload: { entry_type: "ASSESSMENT", amount_cents: 100000, due_on: "2026-04-01T00:00:00Z", effective_period: "2026-04", memo: "April assessment" }
              captures: { asmt2: "$.data.id" }
            - call: "GET /units/${unit1}"
              as: CommunityManager
              captures: { stage1: "$.data.delinquency_stage" }
            - call: "GET /units/${unit2}"
              as: CommunityManager
              captures: { stage2: "$.data.delinquency_stage" }
          trigger:
            - call: "POST /units/${unit1}/payments"
              as: CommunityManager
              payload: { amount_cents: 60000, effective_period: "2026-08", application_mode: "OWNER_DIRECTED", directed_bucket: "ASSESSMENT", memo: "owner asks for assessment first" }
          assert:
            - "HTTP 201"
            - "the captured stage1 was \"LIEN_FILED\" and stage2 was \"LATE_NOTICE\""
            - "data.applied_allocations holds 2 rows: bucket INTEREST 50000 against ${int1}, then bucket ASSESSMENT 10000 against ${asmt1}"
            - "data.unapplied_cents == 0"
            - "GET /units/${unit1} as CommunityManager returns data.balance_due_cents == 190000 and data.delinquency_stage == \"LIEN_FILED\""
            - "an identical POST /units/${unit2}/payments with amount_cents 60000, application_mode OWNER_DIRECTED and directed_bucket ASSESSMENT instead yields data.applied_allocations of exactly 1 row: bucket ASSESSMENT 60000 against ${asmt2}"
            - "after that second payment GET /units/${unit2} returns data.balance_due_cents == 90000 and data.delinquency_stage == \"LATE_NOTICE\""

