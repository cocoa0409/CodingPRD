      - name: member_b_cannot_read_member_a_case
        claim_type: RBAC denial
        grounds:
          - validations[priority=5]
          - errors.ERR_OWNERSHIP_VIOLATION
          - complexity_profile.role_model
        distinguishing_aspect: "Ownership binds X-User-ID to the case's parties: another member and an uninvolved employer both get 403 ERR_OWNERSHIP_VIOLATION on GET /reemployment/cases/{id}, while the owning member, the case's employer, and the assigned ombudsman read fine."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Employers E1 and E2; members A and B; A's case against E1 assigned to the certified ombudsman."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - call: "POST /reemployment/employers"
              payload: { legal_name: "Unrelated Inc", sector: "GOVERNMENT", size_tier: "LARGE" }
              as: ProgramCoordinator
              captures: { emp2_id: $.data.id }
            - *c_omb
            - *c_tra
            - *c_trb
            - *c_trc
            - *c_cert
            - *c_mem
            - call: "POST /reemployment/members"
              payload: { full_name: "B B", email: "bb@example.com", branch: "NAVY", component: "NAVY_RESERVE" }
              as: Anonymous
              captures: { memb_id: $.data.id }
            - *c_case
            - *c_triage
            - *c_assign
          trigger:
            - call: "GET /reemployment/cases/${case_id}"
              payload: {}
              as: ServiceMember
              as_user_id: "${memb_id}"
              captures: { err_mb: $.data.error_id }
            - call: "GET /reemployment/cases/${case_id}"
              payload: {}
              as: Employer
              as_user_id: "${emp2_id}"
              captures: { err_eb: $.data.error_id }
            - call: "GET /reemployment/cases/${case_id}"
              payload: {}
              as: ServiceMember
              as_user_id: "${mem_id}"
              captures: { ok_m: $.data.status }
            - call: "GET /reemployment/cases/${case_id}"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
              captures: { ok_e: $.data.status }
            - call: "GET /reemployment/cases/${case_id}"
              payload: {}
              as: Ombudsman
              as_user_id: "${omb_id}"
              captures: { ok_o: $.data.status }
          assert:
            - "err_mb == ERR_OWNERSHIP_VIOLATION and err_eb == ERR_OWNERSHIP_VIOLATION (both 403)"
            - "ok_m == ASSIGNED and ok_e == ASSIGNED and ok_o == ASSIGNED (the three legitimate readers)"

      - name: agency_reviewer_cannot_submit_referral
        claim_type: RBAC denial
        grounds:
          - state_machines.Referral.DRAFT_to_SUBMITTED
          - errors.ERR_UNAUTHORIZED_ROLE
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Transition-level actor rules split the shared state endpoint: the AgencyReviewer's SUBMITTED attempt fails 403 ERR_UNAUTHORIZED_ROLE, its ACKNOWLEDGED attempt on a DRAFT referral passes the role check but fails state with 409 ERR_INVALID_STATE, and only the coordinator's SUBMITTED succeeds."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Escalated case with a DRAFT referral."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_omb
            - *c_tra
            - *c_trb
            - *c_trc
            - *c_cert
            - *c_mem
            - *c_case
            - *c_triage
            - *c_assign
            - *c_round
            - call: "POST /reemployment/mediation-rounds/${r1_id}/respond"
              payload: { response: "DECLINE" }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /reemployment/cases/${case_id}/state"
              payload: { to_status: "ESCALATION_PENDING" }
              as: Ombudsman
              as_user_id: "${omb_id}"
            - call: "POST /reemployment/referrals"
              payload: { case_id: "${case_id}", agency: "OPM", summary: "Escalated referral." }
              as: Ombudsman
              as_user_id: "${omb_id}"
              captures: { rf_id: $.data.id }
          trigger:
            - call: "POST /reemployment/referrals/${rf_id}/state"
              payload: { to_status: "SUBMITTED" }
              as: AgencyReviewer
              captures: { err_role: $.data.error_id }
            - call: "POST /reemployment/referrals/${rf_id}/state"
              payload: { to_status: "ACKNOWLEDGED" }
              as: AgencyReviewer
              captures: { err_ack: $.data.error_id }
            - call: "POST /reemployment/referrals/${rf_id}/state"
              payload: { to_status: "SUBMITTED" }
              as: ProgramCoordinator
          assert:
            - "err_role == ERR_UNAUTHORIZED_ROLE (403): AgencyReviewer may not submit"
            - "err_ack == ERR_INVALID_STATE (409): acknowledgement requires SUBMITTED first"
            - "the coordinator's SUBMITTED then succeeds and Referral.${rf_id}.status == SUBMITTED"

      - name: unqualified_ombudsman_nominator_rejected
        claim_type: Conditional action
        grounds:
