      - name: both_invoice_bases_produce_different_verified_amounts
        claim_type: Variant Divergence
        grounds:
          - "calculations.invoice_verified_amount.variants"
          - "complexity_profile.complexity_layers"
        excluded_because:
          difficulty_instance: invoice_enrollment_basis_versus_attendance_basis
          rationale: "The §1.8 instance runs one identical attendance record through both bases, pins the full line-by-line arithmetic for each (793726 gross / 799411 net under ENROLLMENT versus 761726 / 767182 under ATTENDANCE) and asserts the 32229-cent delta plus the fact that BOTH provisional_amount_cents and final_amount_cents are stored on every verify regardless of the basis chosen."
      - name: readiness_variant_selected_by_the_activate_call
        claim_type: Variant Selection
        grounds:
