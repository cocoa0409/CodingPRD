          The restriction lives two hops from the write target: POST
          /letters-of-credit/{lc_id}/reviews must resolve LetterOfCredit -> ExportOrder ->
          ForeignBuyer and read restricted_party_flag LIVE at review time, so a flag flipped
          AFTER the credit was captured yields ERR_RESTRICTED_PARTY_BLOCKED with HTTP 409 even
          though expected_letter_of_credit_version is current; the credit must stay RECEIVED
