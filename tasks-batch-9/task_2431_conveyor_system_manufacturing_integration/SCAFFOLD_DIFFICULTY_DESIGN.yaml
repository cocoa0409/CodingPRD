              as: DesignEngineer
              captures: { seg_sh1: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_sh}", segment_code: "TR-02", equipment_class: "ROLLER", rated_capacity_cph: 1400, availability_pct: 95 }
              as: DesignEngineer
              captures: { seg_sh2: $.data.id }
            - call: "POST /flow-links"
              payload: { project_id: "${proj_sh}", from_segment_id: "${seg_sh1}", to_segment_id: "${seg_sh2}", split_share_bps: 10000 }
              as: DesignEngineer
            - call: "POST /projects/${proj_sh}/simulations"
              payload: { method: "DEGRADED_AVAILABILITY" }
              as: DesignEngineer
            - call: "POST /projects/${proj_sh}/design-freeze"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-001"
            - call: "POST /staging-bays"
              payload: { bay_code: "BAY-12", concurrent_capacity: 2 }
              as: ShopSupervisor
              captures: { bay_sh: $.data.id }
            - call: "POST /fabrication-lots"
              payload: { project_id: "${proj_sh}", lot_code: "LOT-1200", staging_bay_id: "${bay_sh}", segment_codes: ["IB-01"], occupancy_start_utc: "2026-08-03T00:00:00Z", occupancy_end_utc: "2026-08-07T00:00:00Z" }
              as: ShopSupervisor
              captures: { lot_sh: $.data.id }
            - call: "POST /fabrication-lots/${lot_sh}/start-fabrication"
              payload: {}
              as: ShopSupervisor
            - call: "POST /fabrication-lots/${lot_sh}/stage"
              payload: {}
              as: ShopSupervisor
              captures: { lot_sh_v: $.data.version }
            - call: "POST /fat-tests"
              payload: { fabrication_lot_id: "${lot_sh}", expected_fabrication_lot_version: "${lot_sh_v}", measured_cph: 1320, defect_count: 0 }
              as: ShopSupervisor
            - call: "POST /site-zones"
              payload: { project_id: "${proj_sh}", zone_code: "Z-INBOUND", throughput_share_bps: 4000, protected_shift_start_minute: 480, protected_shift_end_minute: 1080, buffer_minutes: 60 }
              as: SiteManager
              captures: { zone_in: $.data.id }
            - call: "POST /site-zones"
              payload: { project_id: "${proj_sh}", zone_code: "Z-OUTBOUND", throughput_share_bps: 6000, protected_shift_start_minute: 480, protected_shift_end_minute: 1080, buffer_minutes: 60 }
              as: SiteManager
              captures: { zone_out: $.data.id }
            - call: "POST /cutover-windows"
              payload: { project_id: "${proj_sh}", site_zone_id: "${zone_in}", fabrication_lot_id: "${lot_sh}", start_utc: "2026-08-10T19:00:00Z", end_utc: "2026-08-10T23:00:00Z" }
              as: SiteManager
              captures: { win_sh: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T20:00:00Z" }
              as: ProjectDirector
              as_user_id: "pd-001"
          trigger:
            - call: "POST /cutover-windows/${win_sh}/start"
              payload: {}
              as: SiteManager
              as_user_id: "sm-001"
            - call: "POST /cutover-windows/${win_sh}/abort"
              payload: { abort_reason: "Legacy sorter PLC fault during changeover" }
              as: SiteManager
              as_user_id: "sm-001"
          assert:
            - "after the start call, Project.${proj_sh}.legacy_share_bps == 6000, in_transition_share_bps == 4000, cutover_share_bps == 0"
            - "after the start call, SiteZone.${zone_in}.ops_status == CUTOVER_IN_PROGRESS and Project.${proj_sh}.delivery_status == CUTOVER"
            - "after the abort call, Project.${proj_sh}.legacy_share_bps == 10000, in_transition_share_bps == 0, cutover_share_bps == 0"
            - "after the abort call, 10000 + 0 + 0 == 10000 exactly (no rounding drift)"
            - "after the abort call, SiteZone.${zone_in}.ops_status == LIVE_LEGACY and SiteZone.${zone_out}.ops_status == LIVE_LEGACY"
            - "CutoverWindow.${win_sh}.status == ABORTED with abort_reason == 'Legacy sorter PLC fault during changeover' and closed_at not null"
            - "FabricationLot.${lot_sh}.status == FAT_PASSED (an aborted window never installs the lot)"
