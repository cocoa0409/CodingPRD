              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { line_a_id: $.data.id }
            - call: "POST /part-orders/${order_a_id}/credit-decision"
              payload: { decision: "APPROVE", decision_note: "inside limit" }
              as: CreditManager
            - call: "POST /part-orders/${order_a_id}/allocate"
              payload: {}
              as: BranchCounterRep
              as_user_id: "${branch_a_id}"
            - call: "POST /part-orders/${order_a_id}/fulfill"
              payload: { tracking_ref: "WILLCALL-2004A" }
              as: BranchCounterRep
              as_user_id: "${branch_a_id}"
            - call: "POST /part-orders"
              payload: { servicer_account_id: "${acct_s_id}", fulfillment_mode: "WILL_CALL", pickup_branch_id: "${branch_a_id}", purchase_order_ref: "PO-2004B" }
