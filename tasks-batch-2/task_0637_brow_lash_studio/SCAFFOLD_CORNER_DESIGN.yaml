              payload: { member_id: "${member_id}", service_type_id: "${full_st_id}", start_utc: "2026-06-10T20:00:00Z", pay_with_credits: true, membership_id: "${ms_id}", expected_membership_version: "${ms_v}" }
              as: FrontDesk
          trigger:
            - call: "GET /memberships/${ms_id}"
              payload: {}
              as: FrontDesk
              captures: { bal: $.data.credit_balance }
          assert:
            - "Membership.${ms_id}.credit_balance == 4"
