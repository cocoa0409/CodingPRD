            - call: "POST /gis/qc-validation-reports"
              payload: { scope: "JURISDICTION", road_centerline_id: "${road_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { e2: $.data.error_id }
            - call: "POST /gis/qc-validation-reports"
              payload: { scope: "ROAD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { e3: $.data.error_id }
          assert:
            - "all three calls return status_code 400"
            - "${e1} == \"ERR_INVALID_REQUEST\" and ${e2} == \"ERR_INVALID_REQUEST\" and ${e3} == \"ERR_INVALID_REQUEST\""
            - "GET /gis/qc-validation-reports returns meta.total_count == 0 — no report row was created"
            - "RoadCenterline.${road_id}.qc_dirty == true   # unchanged, no scan ran"

      - name: counterparty_in_another_jurisdiction_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=15]
          - errors.ERR_COUNTERPARTY_INVALID
        distinguishing_aspect: "The counterparty must sit in the SUBJECT record's jurisdiction, not merely be a different agency: a WELDCO fire agency named as counterparty on a LARCO road is refused 422 ERR_COUNTERPARTY_INVALID, and so is naming the opening agency itself."
        test_recipe:
          setup:
            - "Two jurisdictions LARCO and WELDCO."
            - "LARCO: sheriff (LAW) and Poudre Fire Authority (FIRE). WELDCO: a FIRE agency."
            - "One DRAFT centerline in LARCO — the subject record."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j1_id: $.data.id }
            - call: "POST /gis/jurisdictions"
              payload: { name: "Weld County", code: "WELDCO", jurisdiction_type: "COUNTY", postal_city: "GREELEY" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j2_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Larimer County Sheriff", agency_type: "LAW", jurisdiction_id: "${j1_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { ag1_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Poudre Fire Authority", agency_type: "FIRE", jurisdiction_id: "${j1_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { ag2_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Greeley Fire Department", agency_type: "FIRE", jurisdiction_id: "${j2_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { ag3_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j1_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
          trigger:
            - call: "POST /gis/discrepancy-cases"
              payload: { subject_type: "ROAD_NAME", subject_ref_id: "${road_id}", counterparty_agency_id: "${ag3_id}", description: "Greeley disputes the Maple Street name" }
              as: AgencyLiaison
              as_user_id: "${ag1_id}"
              captures: { xj_err: $.data.error_id }
            - call: "POST /gis/discrepancy-cases"
              payload: { subject_type: "ROAD_NAME", subject_ref_id: "${road_id}", counterparty_agency_id: "${ag1_id}", description: "The sheriff disputes itself" }
              as: AgencyLiaison
              as_user_id: "${ag1_id}"
              captures: { self_err: $.data.error_id }
            - call: "POST /gis/discrepancy-cases"
              payload: { subject_type: "ROAD_NAME", subject_ref_id: "${road_id}", counterparty_agency_id: "${ag2_id}", description: "Poudre Fire disputes the Maple Street name" }
              as: AgencyLiaison
              as_user_id: "${ag1_id}"
              captures: { case_id: $.data.id }
          assert:
            - "both refusals return status_code 422 with ${xj_err} == \"ERR_COUNTERPARTY_INVALID\" and ${self_err} == \"ERR_COUNTERPARTY_INVALID\""
            - "the in-jurisdiction case returns status_code 201"
            - "DiscrepancyCase.${case_id}.status == \"OPEN\" and round_count == 0"
            - "DiscrepancyCase.${case_id}.jurisdiction_id == \"${j1_id}\""
            - "DiscrepancyCase.${case_id}.opened_by_agency_id == \"${ag1_id}\" and counterparty_agency_id == \"${ag2_id}\""
            - "RoadCenterline.${road_id}.open_discrepancy_case_count == 1   # only the accepted case counted"

      - name: second_open_case_on_the_same_subject_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=22]
          - errors.ERR_SUBJECT_CASE_ALREADY_OPEN
        distinguishing_aspect: "The block is keyed on (subject_type, subject_ref_id) with status NOT IN {ADOPTED, ARBITRATED}, so a THIRD agency filing on the same road name gets 409 ERR_SUBJECT_CASE_ALREADY_OPEN, while a case on a different subject_type over the same road id is accepted."
        test_recipe:
          setup:
            - "One jurisdiction LARCO with three ACTIVE agencies (LAW, FIRE, EMS) and one DRAFT centerline."
            - "One OPEN case on (ROAD_NAME, road) opened by the sheriff against Poudre Fire."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Larimer County Sheriff", agency_type: "LAW", jurisdiction_id: "${j_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { ag1_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Poudre Fire Authority", agency_type: "FIRE", jurisdiction_id: "${j_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { ag2_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Thompson Valley EMS", agency_type: "EMS", jurisdiction_id: "${j_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { ag3_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
            - call: "POST /gis/discrepancy-cases"
              payload: { subject_type: "ROAD_NAME", subject_ref_id: "${road_id}", counterparty_agency_id: "${ag2_id}", description: "Name should be MAPLE STREET" }
              as: AgencyLiaison
              as_user_id: "${ag1_id}"
              captures: { case1_id: $.data.id }
          trigger:
            - call: "POST /gis/discrepancy-cases"
              payload: { subject_type: "ROAD_NAME", subject_ref_id: "${road_id}", counterparty_agency_id: "${ag1_id}", description: "EMS also disputes the name" }
              as: AgencyLiaison
              as_user_id: "${ag3_id}"
              captures: { dup_err: $.data.error_id }
            - call: "POST /gis/discrepancy-cases"
              payload: { subject_type: "ROAD_RANGE", subject_ref_id: "${road_id}", counterparty_agency_id: "${ag1_id}", description: "EMS disputes the LEFT range instead" }
              as: AgencyLiaison
              as_user_id: "${ag3_id}"
              captures: { case2_id: $.data.id }
          assert:
            - "the second ROAD_NAME case returns status_code 409 with ${dup_err} == \"ERR_SUBJECT_CASE_ALREADY_OPEN\""
            - "the ROAD_RANGE case returns status_code 201 — a different subject_type is a different subject"
            - "DiscrepancyCase.${case1_id}.status == \"OPEN\" and DiscrepancyCase.${case2_id}.status == \"OPEN\""
            - "RoadCenterline.${road_id}.open_discrepancy_case_count == 2"
            - "RoadCenterline.${road_id}.status == \"DRAFT\" — the freeze is enforced at transition time, not at case creation"

      - name: unauthenticated_request_without_a_user_header_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Priority 1 outranks everything: a POST whose X-User-ID header is absent gets 401 ERR_UNAUTHENTICATED even though the same body would otherwise fail the 400 schema check (code is missing too) — the auth gate runs before schema validation."
        test_recipe:
          setup:
            - "Empty system. No entities are required — the request never reaches the handler."
          setup_api_calls: []
          trigger:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "the X-User-ID header is deliberately omitted from this request"
            - "status_code == 401"
            - "${err_id} == \"ERR_UNAUTHENTICATED\"   # NOT ERR_INVALID_REQUEST, even though `code` is missing"
            - "response.success == false and response.data.message is a non-empty string"
            - "GET /gis/jurisdictions (with a valid header) returns meta.total_count == 0"

      - name: exhausted_range_leaves_no_assignable_address_rejected
        claim_type: aggregate_validation
        grounds:
          - validations[priority=24]
          - calculations.next_house_number_selection
          - errors.ERR_NO_ASSIGNABLE_ADDRESS
        distinguishing_aspect: "A single-slot side (LEFT [100,100] EVEN, capacity 1) that already holds one point yields an EMPTY candidate set, so assign answers 409 ERR_NO_ASSIGNABLE_ADDRESS — individually every step was legal, it is the collective occupancy that fails."
        test_recipe:
          setup:
            - "One jurisdiction LARCO with cell C001 and a VALIDATED centerline whose LEFT range is the single number 100 (EVEN)."
            - "One PARCEL point already at 100 LEFT."
            - "One request on (road, LEFT) that is GIS-approved and utility-cleared."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "CUL DE SAC COURT", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 100, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 101, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
            - call: "POST /gis/road-centerlines/${road_id}/validate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/address-points"
              payload: { house_number: 100, road_centerline_id: "${road_id}", side: "LEFT", source: "PARCEL", postal_city: "FORT COLLINS", cell_id: "${cell_id}", geometry_verified: true }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { pt_id: $.data.id }
            - call: "POST /gis/address-assignment-requests"
              payload: { permit_number: "BP-2026-0400", parcel_id: "8712300400", road_centerline_id: "${road_id}", side: "LEFT" }
              as: PermitCoordinator
              as_user_id: "permit-1"
              captures: { req_id: $.data.id }
            - call: "POST /gis/address-assignment-requests/${req_id}/gis-review"
              payload: { decision: "APPROVE" }
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/address-assignment-requests/${req_id}/utility-clearance"
              payload: { decision: "CLEAR" }
              as: PermitCoordinator
              as_user_id: "permit-1"
          trigger:
            - call: "POST /gis/address-assignment-requests/${req_id}/assign"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "status_code == 409"
            - "${err_id} == \"ERR_NO_ASSIGNABLE_ADDRESS\""
            - "RoadCenterline.${road_id}.assignable_slot_count_left == 0 and assignable_slot_count_right == 1   # capacity was floor(0/2)+1 = 1 per side"
            - "AddressAssignmentRequest.${req_id}.fulfillment_status == \"READY_TO_ASSIGN\" and assigned_house_number == null"
            - "AddressAssignmentRequest.${req_id}.minted_point_count == 0 and version == 3   # the failed assign did not bump it"
            - "GET /gis/address-points with road_centerline_id ${road_id} returns meta.total_count == 1 with data[0].id == \"${pt_id}\""

      - name: proposed_house_number_outside_the_candidate_set_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=23]
          - calculations.next_house_number_selection
          - errors.ERR_HOUSE_NUMBER_UNAVAILABLE
        distinguishing_aspect: "proposed_house_number is accepted at request creation and only tested at assign: 200 is outside [100,198] so assign answers 409 ERR_HOUSE_NUMBER_UNAVAILABLE rather than silently falling back to the computed minimum 100."
        test_recipe:
          setup:
            - "One jurisdiction LARCO with cell C001 and a VALIDATED centerline, LEFT [100,198] EVEN."
            - "One request on (road, LEFT) with proposed_house_number 200, GIS-approved and utility-cleared."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
            - call: "POST /gis/road-centerlines/${road_id}/validate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/address-assignment-requests"
              payload: { permit_number: "BP-2026-0500", parcel_id: "8712300500", road_centerline_id: "${road_id}", side: "LEFT", proposed_house_number: 200 }
              as: PermitCoordinator
              as_user_id: "permit-1"
              captures: { req_id: $.data.id }
            - call: "POST /gis/address-assignment-requests/${req_id}/gis-review"
              payload: { decision: "APPROVE" }
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/address-assignment-requests/${req_id}/utility-clearance"
              payload: { decision: "CLEAR" }
              as: PermitCoordinator
              as_user_id: "permit-1"
          trigger:
            - call: "POST /gis/address-assignment-requests/${req_id}/assign"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "the request creation returned 201 — proposed_house_number is not range-checked at intake"
            - "the assign returns status_code 409 with ${err_id} == \"ERR_HOUSE_NUMBER_UNAVAILABLE\""
            - "the error is NOT ERR_NO_ASSIGNABLE_ADDRESS — the candidate set is non-empty (100 is free)"
            - "AddressAssignmentRequest.${req_id}.fulfillment_status == \"READY_TO_ASSIGN\" and assigned_address_point_id == null"
            - "RoadCenterline.${road_id}.assignable_slot_count_left == 50"

      - name: higher_priority_rule_wins_when_two_rules_are_violated
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: adopt_unauthorized_role_beats_case_not_found
          rationale: "The §1.8 priority_pair_validation_conflict instance already violates priority 2 (ERR_UNAUTHORIZED) and priority 4 (ERR_CASE_NOT_FOUND) in one call and asserts the lower-priority-number error wins, which is the ordered-walk claim."

      - name: occ_conflict_outranks_the_temporal_window_rule
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: occ_stale_beats_boundary_window_invalid
          rationale: "The §1.8 priority_pair_validation_conflict instance already sends one cell-assignment that simultaneously breaks priority 8 (stale expected_boundary_version) and priority 30 (inverted window) and asserts the 412 ERR_STALE_BOUNDARY_VERSION."

  # =========================================================================
  # SECTION: endpoints  (guide Table 5 endpoint-pattern rows; no bulk endpoint
  # is declared in §1.5, so the bulk_action row has no instance)
  # =========================================================================
  - section: endpoints
    instances:
      - name: coverage_status_read_emits_service_types_in_the_constant_order
        claim_type: computed_read
        grounds:
          - endpoints["GET /gis/coverage-cells/{id}/coverage-status"]
          - calculations.coverage_integrity_counters.ordering
          - calculations.coverage_integrity_counters.constants.SERVICE_TYPES
        distinguishing_aspect: "Every service-type array is produced by filtering the ORDERED constant [LAW, FIRE, EMS]: after activating EMS coverage FIRST and LAW second, covered_service_types is [\"LAW\", \"EMS\"] — neither insertion order [\"EMS\", \"LAW\"] nor alphabetical [\"EMS\", \"LAW\"] — and gap_service_types is [\"FIRE\"]."
        test_recipe:
          setup:
            - "One jurisdiction LARCO with a single cell C001."
            - "Three ACTIVE agencies: Thompson Valley EMS (EMS), Larimer County Sheriff (LAW), Poudre Fire Authority (FIRE)."
            - "The EMS boundary is created, cell-assigned, proposed and ACTIVATED FIRST; the LAW boundary second. FIRE never gets a boundary."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Thompson Valley EMS", agency_type: "EMS", jurisdiction_id: "${j_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { ems_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Larimer County Sheriff", agency_type: "LAW", jurisdiction_id: "${j_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { law_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Poudre Fire Authority", agency_type: "FIRE", jurisdiction_id: "${j_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { fire_id: $.data.id }
            - call: "POST /gis/emergency-service-boundaries"
              payload: { agency_id: "${ems_id}", effective_start: "2026-08-01T00:00:00Z" }
              as: AgencyLiaison
              as_user_id: "${ems_id}"
              captures: { be_id: $.data.id, be_v: $.data.version }
            - call: "POST /gis/emergency-service-boundaries/${be_id}/cell-assignments"
              payload: { cell_id: "${cell_id}", effective_start: "2026-08-01T00:00:00Z", expected_boundary_version: "${be_v}" }
              as: AgencyLiaison
              as_user_id: "${ems_id}"
              captures: { bca_e: $.data.id }
            - call: "POST /gis/emergency-service-boundaries/${be_id}/propose"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${ems_id}"
            - call: "POST /gis/emergency-service-boundaries/${be_id}/activate"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${ems_id}"
            - call: "POST /gis/emergency-service-boundaries"
              payload: { agency_id: "${law_id}", effective_start: "2026-08-01T00:00:00Z" }
              as: AgencyLiaison
              as_user_id: "${law_id}"
              captures: { bl_id: $.data.id, bl_v: $.data.version }
            - call: "POST /gis/emergency-service-boundaries/${bl_id}/cell-assignments"
              payload: { cell_id: "${cell_id}", effective_start: "2026-08-01T00:00:00Z", expected_boundary_version: "${bl_v}" }
              as: AgencyLiaison
              as_user_id: "${law_id}"
              captures: { bca_l: $.data.id }
            - call: "POST /gis/emergency-service-boundaries/${bl_id}/propose"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${law_id}"
            - call: "POST /gis/emergency-service-boundaries/${bl_id}/activate"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${law_id}"
          trigger:
            - call: "GET /gis/coverage-cells/${cell_id}/coverage-status"
              payload: {}
              as: ProvisioningOfficer
              as_user_id: "prov-1"
          assert:
            - "status_code == 200"
            - "response.data.cell_id == \"${cell_id}\""
            - "response.data.evaluated_at == \"2026-08-01T00:00:00.000Z\"   # the logical clock, not wall time"
            - "response.data.covered_service_types == [\"LAW\", \"EMS\"]   # constant order, NOT activation order"
            - "response.data.gap_service_types == [\"FIRE\"]"
            - "response.data.forward_gap_service_types == [\"FIRE\"]   # both claims are open-ended"
            - "response.data.proposed_conflict_service_types == []"
            - "response.data.responding_assignment_count == 2"
            - "CoverageCell.${cell_id}.active_assignment_count == 2"
            - "BoundaryCellAssignment.${bca_e}.status == \"ACTIVE\" and service_type == \"EMS\""
            - "BoundaryCellAssignment.${bca_l}.status == \"ACTIVE\" and service_type == \"LAW\""
            - "Jurisdiction.${j_id}.gap_pair_count == 1 and covered_cell_count == 0"
            - "Agency.${fire_id}.status == \"ACTIVE\" — the gap is a missing boundary, not a missing agency"

      - name: cell_assignment_links_a_boundary_to_a_cell_in_both_directions
        claim_type: cross_reference_link
        grounds:
          - endpoints["POST /gis/emergency-service-boundaries/{id}/cell-assignments"]
          - entities.BoundaryCellAssignment
          - concurrency_rules.cell-assignment-stale-boundary
        distinguishing_aspect: "The link takes boundary_id from the PATH and cell_id from the BODY, copies service_type down from the boundary, bumps only the boundary's version (2), and counts toward assigned_cell_count while it is PENDING — but NOT toward the cell's active_assignment_count, which stays 0 until activation."
        test_recipe:
          setup:
            - "One jurisdiction LARCO with cell C001 and one ACTIVE FIRE agency."
            - "One DRAFT boundary owned by that agency, no cells yet."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Poudre Fire Authority", agency_type: "FIRE", jurisdiction_id: "${j_id}", contact_phone: "970-416-2891" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { fire_id: $.data.id }
            - call: "POST /gis/emergency-service-boundaries"
              payload: { agency_id: "${fire_id}", effective_start: "2026-08-01T00:00:00Z" }
              as: AgencyLiaison
              as_user_id: "${fire_id}"
              captures: { b_id: $.data.id, b_v: $.data.version }
          trigger:
            - call: "POST /gis/emergency-service-boundaries/${b_id}/cell-assignments"
              payload: { cell_id: "${cell_id}", effective_start: "2026-08-01T00:00:00Z", expected_boundary_version: "${b_v}" }
              as: AgencyLiaison
              as_user_id: "${fire_id}"
              captures: { asg_id: $.data.id }
          assert:
            - "status_code == 201"
            - "BoundaryCellAssignment.${asg_id}.boundary_id == \"${b_id}\"   # from the path, never from the body"
            - "BoundaryCellAssignment.${asg_id}.cell_id == \"${cell_id}\"   # from the body"
            - "BoundaryCellAssignment.${asg_id}.service_type == \"FIRE\"   # copied down from the boundary's agency"
            - "BoundaryCellAssignment.${asg_id}.status == \"PENDING\" and effective_end == null"
            - "EmergencyServiceBoundary.${b_id}.assigned_cell_count == 1 and status == \"DRAFT\" and version == 2"
            - "CoverageCell.${cell_id}.active_assignment_count == 0   # PENDING is not responding coverage"
            - "GET /gis/emergency-service-boundaries/${b_id}/cell-assignments returns meta.total_count == 1 with data[0].id == \"${asg_id}\""
            - "GET /gis/coverage-cells/${cell_id}/coverage-status returns responding_assignment_count == 0 and gap_service_types == [\"LAW\", \"FIRE\", \"EMS\"]"

      - name: proposed_conflict_service_types_forecasts_the_activation_refusal
        claim_type: conditional_action
        grounds:
          - endpoints["GET /gis/coverage-cells/{id}/coverage-status"]
          - validations[priority=31]
          - state_machines.EmergencyServiceBoundary.PROPOSED_to_ACTIVE
        distinguishing_aspect: "Activation is conditional on no ACTIVE same-(cell, service_type) window intersecting: with an ACTIVE Poudre FIRE claim on C001 and a PENDING Loveland FIRE claim on the same cell and window, the read reports proposed_conflict_service_types == [\"FIRE\"] BEFORE the activate is attempted, and the activate then returns 409 ERR_COVERAGE_OVERLAP."
        test_recipe:
          setup:
            - "One jurisdiction LARCO with cell C001 and two ACTIVE FIRE agencies."
            - "Boundary B1 (Poudre) ACTIVE with an open-ended claim on C001."
            - "Boundary B2 (Loveland) PROPOSED with a PENDING claim on the same cell and the same open-ended window."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Poudre Fire Authority", agency_type: "FIRE", jurisdiction_id: "${j_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { f1_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Loveland Fire Rescue Authority", agency_type: "FIRE", jurisdiction_id: "${j_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { f2_id: $.data.id }
            - call: "POST /gis/emergency-service-boundaries"
              payload: { agency_id: "${f1_id}", effective_start: "2026-08-01T00:00:00Z" }
              as: AgencyLiaison
              as_user_id: "${f1_id}"
              captures: { b1_id: $.data.id, b1_v: $.data.version }
            - call: "POST /gis/emergency-service-boundaries/${b1_id}/cell-assignments"
              payload: { cell_id: "${cell_id}", effective_start: "2026-08-01T00:00:00Z", expected_boundary_version: "${b1_v}" }
              as: AgencyLiaison
              as_user_id: "${f1_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /gis/emergency-service-boundaries/${b1_id}/propose"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${f1_id}"
            - call: "POST /gis/emergency-service-boundaries/${b1_id}/activate"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${f1_id}"
            - call: "POST /gis/emergency-service-boundaries"
              payload: { agency_id: "${f2_id}", effective_start: "2026-08-01T00:00:00Z" }
              as: AgencyLiaison
              as_user_id: "${f2_id}"
              captures: { b2_id: $.data.id, b2_v: $.data.version }
            - call: "POST /gis/emergency-service-boundaries/${b2_id}/cell-assignments"
              payload: { cell_id: "${cell_id}", effective_start: "2026-08-01T00:00:00Z", expected_boundary_version: "${b2_v}" }
              as: AgencyLiaison
              as_user_id: "${f2_id}"
              captures: { a2_id: $.data.id }
            - call: "POST /gis/emergency-service-boundaries/${b2_id}/propose"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${f2_id}"
          trigger:
            - call: "GET /gis/coverage-cells/${cell_id}/coverage-status"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${f2_id}"
            - call: "POST /gis/emergency-service-boundaries/${b2_id}/activate"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${f2_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the read returns 200 with response.data.proposed_conflict_service_types == [\"FIRE\"]"
            - "the read returns covered_service_types == [\"FIRE\"] and gap_service_types == [\"LAW\", \"EMS\"]"
            - "the read returns responding_assignment_count == 1   # the PENDING claim is not responding"
            - "the activate returns status_code 409 with ${err_id} == \"ERR_COVERAGE_OVERLAP\""
            - "EmergencyServiceBoundary.${b2_id}.status == \"PROPOSED\" and version == 3   # create 1, assign 2, propose 3"
            - "BoundaryCellAssignment.${a2_id}.status == \"PENDING\"   # never promoted"
            - "BoundaryCellAssignment.${a1_id}.status == \"ACTIVE\""
            - "CoverageCell.${cell_id}.active_assignment_count == 1"
            - "Jurisdiction.${j_id}.gap_pair_count == 2"

      - name: patch_road_merges_only_supplied_fields_and_demotes
        claim_type: standard_crud
        grounds:
          - endpoints["PATCH /gis/road-centerlines/{id}"]
          - cascade_rules.CONFIDENCE_REFRESH
          - cascade_rules.ROAD_SLOT_REFRESH
        distinguishing_aspect: "A PATCH carrying only primary_name recomputes normalized_name, demotes VALIDATED -> DRAFT with qc_dirty true and re-runs CONFIDENCE_REFRESH (the point drops 91.00 -> 81.00 as the penalty goes 5 -> 15), while every omitted range field keeps its stored value and the slot counts do not move."
        test_recipe:
          setup:
            - "One jurisdiction LARCO with cell C001 and a VALIDATED centerline \"N MAPLE STREET\" (version 2)."
            - "One PARCEL point at 100 LEFT, geometry_verified true, postal match -> 91.00 at VALIDATED."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
            - call: "POST /gis/road-centerlines/${road_id}/validate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_v: $.data.version }
            - call: "POST /gis/address-points"
              payload: { house_number: 100, road_centerline_id: "${road_id}", side: "LEFT", source: "PARCEL", postal_city: "FORT COLLINS", cell_id: "${cell_id}", geometry_verified: true }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { pt_id: $.data.id }
          trigger:
            - call: "PATCH /gis/road-centerlines/${road_id}"
              payload: { primary_name: "S. Elm Dr", expected_road_version: "${road_v}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
          assert:
            - "status_code == 200"
            - "RoadCenterline.${road_id}.primary_name == \"S. Elm Dr\" and normalized_name == \"S ELM DRIVE\""
            - "RoadCenterline.${road_id}.status == \"DRAFT\" and qc_dirty == true   # VALIDATED demotion"
            - "RoadCenterline.${road_id}.version == 3   # create 1, validate 2, patch 3"
            - "RoadCenterline.${road_id}.from_addr_left == 100 and to_addr_left == 198 and parity_left == \"EVEN\""
            - "RoadCenterline.${road_id}.from_addr_right == 101 and to_addr_right == 199 and parity_right == \"ODD\""
            - "RoadCenterline.${road_id}.assignable_slot_count_left == 49 and assignable_slot_count_right == 50   # unchanged by the patch"
            - "AddressPoint.${pt_id}.confidence_score == 81.00   # 70 + 12 + 8 + 6 - 15"
            - "AddressPoint.${pt_id}.version == 2 and status == \"PENDING\""
            - "GET /gis/road-centerlines with normalized_name \"N MAPLE STREET\" returns meta.total_count == 0"

      - name: clock_endpoint_moves_time_without_mutating_any_entity
        claim_type: action_endpoint
        grounds:
          - endpoints["POST /gis/_clock/set_current_utc"]
          - envelope_conventions
        distinguishing_aspect: "The clock endpoint is declared to mutate nothing: after jumping from 2026-08-01 to 2026-10-15 the road's version, updated_at and qc_dirty are byte-identical, no counter is recomputed, yet the next created record stamps created_at at the NEW instant."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z. One jurisdiction LARCO with cell C001 and one DRAFT centerline."
          setup_api_calls:
            - call: "POST /gis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
          trigger:
            - call: "POST /gis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T12:30:45Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /gis/address-points"
              payload: { house_number: 100, road_centerline_id: "${road_id}", side: "LEFT", source: "PARCEL", postal_city: "FORT COLLINS", cell_id: "${cell_id}", geometry_verified: true }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { pt_id: $.data.id }
          assert:
            - "the clock call returns status_code 200"
            - "RoadCenterline.${road_id}.version == 1 and updated_at == \"2026-08-01T00:00:00.000Z\"   # not touched by the clock"
            - "RoadCenterline.${road_id}.created_at == \"2026-08-01T00:00:00.000Z\" and qc_dirty == true"
            - "Jurisdiction.${j_id}.cell_count == 1 and gap_pair_count == 3   # no recompute happened either"
            - "AddressPoint.${pt_id}.created_at == \"2026-10-15T12:30:45.000Z\"   # the new instant IS used going forward"
            - "AddressPoint.${pt_id}.confidence_score == 81.00 and status == \"PENDING\""
            - "GET /gis/coverage-cells/${cell_id}/coverage-status returns evaluated_at == \"2026-10-15T12:30:45.000Z\""

  # =========================================================================
  # SECTION: errors  (guide Table 6 — every one of the 56 catalog codes must be
  # triggerable; codes already triggered by a §1.8 instance carry a stub)
  # =========================================================================
  - section: errors
    instances:
      - name: path_id_codes_are_entity_specific_not_found
        claim_type: violation_to_error
        grounds:
          - validations[priority=4]
          - errors.ERR_AGENCY_NOT_FOUND
          - errors.ERR_ROAD_NOT_FOUND
          - errors.ERR_ADDRESS_POINT_NOT_FOUND
          - errors.ERR_REQUEST_NOT_FOUND
          - errors.ERR_BOUNDARY_NOT_FOUND
          - errors.ERR_CELL_ASSIGNMENT_NOT_FOUND
          - errors.ERR_REPORT_NOT_FOUND
          - errors.ERR_DEFECT_NOT_FOUND
          - errors.ERR_PACKAGE_NOT_FOUND
        distinguishing_aspect: "Nine different path entities answer nine DIFFERENT 404 codes for the identical all-zero UUID — a single shared ERR_NOT_FOUND would fail every row, and so would routing BoundaryCellAssignment reads to ERR_BOUNDARY_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty system. Every read targets the canonical non-existent id 00000000-0000-0000-0000-000000000000."
          setup_api_calls: []
          trigger:
            - call: "GET /gis/agencies/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { e_agency: $.data.error_id }
            - call: "GET /gis/road-centerlines/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { e_road: $.data.error_id }
            - call: "GET /gis/address-points/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { e_point: $.data.error_id }
            - call: "GET /gis/address-assignment-requests/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PermitCoordinator
              as_user_id: "permit-1"
              captures: { e_request: $.data.error_id }
            - call: "GET /gis/emergency-service-boundaries/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { e_boundary: $.data.error_id }
            - call: "GET /gis/boundary-cell-assignments/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { e_assignment: $.data.error_id }
            - call: "GET /gis/qc-validation-reports/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: QcCertifier
              as_user_id: "qc-1"
              captures: { e_report: $.data.error_id }
            - call: "GET /gis/qc-defects/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: QcCertifier
              as_user_id: "qc-1"
              captures: { e_defect: $.data.error_id }
            - call: "GET /gis/provisioning-packages/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProvisioningOfficer
              as_user_id: "prov-1"
              captures: { e_package: $.data.error_id }
          assert:
            - "all nine calls return status_code 404 with success == false"
            - "${e_agency} == \"ERR_AGENCY_NOT_FOUND\""
            - "${e_road} == \"ERR_ROAD_NOT_FOUND\""
            - "${e_point} == \"ERR_ADDRESS_POINT_NOT_FOUND\""
            - "${e_request} == \"ERR_REQUEST_NOT_FOUND\""
            - "${e_boundary} == \"ERR_BOUNDARY_NOT_FOUND\""
            - "${e_assignment} == \"ERR_CELL_ASSIGNMENT_NOT_FOUND\"   # its own code, not the boundary's"
            - "${e_report} == \"ERR_REPORT_NOT_FOUND\""
            - "${e_defect} == \"ERR_DEFECT_NOT_FOUND\""
            - "${e_package} == \"ERR_PACKAGE_NOT_FOUND\""
            - "each response carries data.message as a non-empty string and data.error_id equal to the code above"

      - name: body_foreign_key_codes_are_entity_specific_not_found
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - errors.ERR_PROPOSAL_NOT_FOUND
          - errors.ERR_ROAD_NOT_FOUND
          - errors.ERR_REPORT_NOT_FOUND
          - errors.ERR_AGENCY_NOT_FOUND
        distinguishing_aspect: "Priority 5 resolves BODY foreign keys and answers the REFERENCED entity's code, not the path entity's: concur with an all-zero proposal_id gives ERR_PROPOSAL_NOT_FOUND (never ERR_CASE_NOT_FOUND, and never the priority-16 ERR_SELF_CONCURRENCE that would otherwise apply to the opener)."
        test_recipe:
          setup:
            - "One jurisdiction LARCO with two ACTIVE agencies and one DRAFT centerline."
            - "One OPEN DiscrepancyCase on (ROAD_NAME, road) opened by the sheriff, no proposals filed."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Larimer County Sheriff", agency_type: "LAW", jurisdiction_id: "${j_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { ag1_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Poudre Fire Authority", agency_type: "FIRE", jurisdiction_id: "${j_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { ag2_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
            - call: "POST /gis/discrepancy-cases"
              payload: { subject_type: "ROAD_NAME", subject_ref_id: "${road_id}", counterparty_agency_id: "${ag2_id}", description: "Name should read MAPLE STREET" }
              as: AgencyLiaison
              as_user_id: "${ag1_id}"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /gis/discrepancy-cases/${case_id}/concur"
              payload: { proposal_id: "00000000-0000-0000-0000-000000000000" }
              as: AgencyLiaison
              as_user_id: "${ag1_id}"
              captures: { e_proposal: $.data.error_id }
            - call: "POST /gis/address-points"
              payload: { house_number: 100, road_centerline_id: "00000000-0000-0000-0000-000000000000", side: "LEFT", source: "PARCEL", postal_city: "FORT COLLINS", cell_id: "${cell_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { e_road: $.data.error_id }
            - call: "POST /gis/provisioning-packages"
              payload: { channel: "MAPPING", jurisdiction_id: "${j_id}", qc_report_id: "00000000-0000-0000-0000-000000000000" }
              as: ProvisioningOfficer
              as_user_id: "prov-1"
              captures: { e_report: $.data.error_id }
            - call: "POST /gis/emergency-service-boundaries"
              payload: { agency_id: "00000000-0000-0000-0000-000000000000", effective_start: "2026-08-01T00:00:00Z" }
              as: AgencyLiaison
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { e_agency: $.data.error_id }
          assert:
            - "all four calls return status_code 404"
            - "${e_proposal} == \"ERR_PROPOSAL_NOT_FOUND\"   # priority 5 beats priority 16 ERR_SELF_CONCURRENCE"
            - "${e_road} == \"ERR_ROAD_NOT_FOUND\"   # the cell_id resolves, the road does not"
            - "${e_report} == \"ERR_REPORT_NOT_FOUND\""
            - "${e_agency} == \"ERR_AGENCY_NOT_FOUND\"   # X-User-ID matched the payload agency_id, so priority 3 passed first"
            - "DiscrepancyCase.${case_id}.status == \"OPEN\" and round_count == 0 and version == 1"
            - "GET /gis/address-points returns meta.total_count == 0 and GET /gis/provisioning-packages returns meta.total_count == 0"

      - name: duplicate_uniqueness_codes_are_subject_specific_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=20]
          - errors.ERR_DUPLICATE_JURISDICTION_CODE
          - errors.ERR_DUPLICATE_CELL_CODE
          - errors.ERR_DUPLICATE_PERMIT_NUMBER
        distinguishing_aspect: "Each uniqueness scope has its own code and its own scope: jurisdiction code is GLOBAL, cell_code is unique only WITHIN a jurisdiction (so C001 is accepted again under WELDCO), and permit_number is global INCLUDING against a request that has already been voided."
        test_recipe:
          setup:
            - "Two jurisdictions LARCO and WELDCO; LARCO owns cell C001 and a DRAFT centerline."
            - "One assignment request BP-2026-0600 that is then VOIDED."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j1_id: $.data.id }
            - call: "POST /gis/jurisdictions"
              payload: { name: "Weld County", code: "WELDCO", jurisdiction_type: "COUNTY", postal_city: "GREELEY" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j2_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j1_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j1_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
            - call: "POST /gis/address-assignment-requests"
              payload: { permit_number: "BP-2026-0600", parcel_id: "8712300600", road_centerline_id: "${road_id}", side: "LEFT" }
              as: PermitCoordinator
              as_user_id: "permit-1"
              captures: { req_id: $.data.id }
            - call: "POST /gis/address-assignment-requests/${req_id}/void"
              payload: { void_reason: "Permit withdrawn by applicant" }
              as: PermitCoordinator
              as_user_id: "permit-1"
          trigger:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County GIS", code: "LARCO", jurisdiction_type: "CITY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { e_jur: $.data.error_id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j1_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { e_cell: $.data.error_id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j2_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
