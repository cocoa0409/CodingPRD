              as: Underwriter
              captures: { g2cu2: $.data.id }
            - call: "POST /carriers/${carrier_id}/policies/${g2p}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /carriers/${carrier_id}/policies/${g2p}/premium-payments"
