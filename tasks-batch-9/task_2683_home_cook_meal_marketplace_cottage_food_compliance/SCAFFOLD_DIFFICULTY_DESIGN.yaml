            - "the re-placement responds 201 (the conserved counter left no residue)"
            - "after the re-placement: ProductionWindow.${pw_id}.committed_meals == 4 AND Order.${o2_id}.quantity == 4"
            - "Cook.${cook_id}.ytd_cottage_revenue_cents == 0 AND pending_payout_cents == 0 throughout (nothing captured)"

      - name: cottage_revenue_cents_conserved_capture_then_full_cook_fault_refund
        grounds:
          - compensating_invariants.cottage-revenue-cents-conserved
          - calculations.refund_chargeback_split
          - calculations.cottage_revenue_recognition
          - state_machines.Order.CAPTURED_to_REFUNDED
          - entities.RefundEvent.fields.platform_absorbed_cents
        distinguishing_aspect: |
          A full COOK-fault refund of 2616 cents must drain the waterfall in the fixed order
          1860 (cook earnings) -> 540 (platform commission) -> 216 (platform absorbed), and the
          216 residue is exactly the diner service fee that was never part of subtotal_cents. The
          conservation identity therefore holds twice: the three buckets sum to the refund amount,
          AND ytd_cottage_revenue_cents returns to its exact pre-capture 0 while
          ytd_gross_sales_cents stays at 2400 because gross recognition is never reversed.
        test_recipe:
          setup:
            - "StatePolicy CA exists; Cook Uma is ACTIVE and CLEAR with weekly_capacity_meals 8 and ytd_gross_sales_cents 0."
            - "One APPROVED MenuItem at 1200 cents; one quantity-2 order (subtotal 2400, diner fee 216, total 2616, commission 540, cook earnings 1860) advanced all the way to DELIVERED, so payment_status is CAPTURED and ytd_cottage_revenue_cents is 2400."
            - "Logical clock at 2026-08-08T17:00:00Z after the handoff started."
          setup_api_calls:
            - call: "POST /state-policies"
              payload: { state_code: "CA", cottage_food_annual_cap_cents: 5000000, allowed_kitchen_types: ["HOME_COTTAGE", "HOME_INSPECTED", "COMMERCIAL_SHARED"], tcs_requires_commercial_kitchen: true, max_shelf_life_days_non_refrigerated: 14, label_required_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"], cert_validity_max_days: 1825 }
              as: PlatformAdmin
              captures: { sp_ca_id: $.data.id }
            - call: "POST /cooks"
              payload: { legal_name: "Uma Krishnan", email: "uma@example.com", state_code: "CA", claimed_kitchen_type: "HOME_INSPECTED", weekly_capacity_meals: 8 }
              as: Anonymous
              captures: { cook_id: $.data.id, cook_v0: $.data.version }
            - call: "POST /onboarding-documents"
              payload: { cook_id: "${cook_id}", doc_type: "FOOD_HANDLER_CERT", expected_cook_version: "${cook_v0}", certificate_number: "FH-1313", issuing_authority: "CA DPH", issued_on: "2026-05-28", expires_on: "2028-05-28" }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { cert_doc_id: $.data.id }
            - call: "GET /cooks/${cook_id}"
              payload: {}
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { cook_v1: $.data.version }
            - call: "POST /onboarding-documents"
              payload: { cook_id: "${cook_id}", doc_type: "KITCHEN_INSPECTION", expected_cook_version: "${cook_v1}", kitchen_type_claimed: "HOME_INSPECTED", inspection_date: "2026-08-01" }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { insp_doc_id: $.data.id }
            - call: "POST /onboarding-documents/${cert_doc_id}/review"
              payload: { decision: "VERIFY" }
              as: ComplianceReviewer
              as_user_id: "rev-1"
            - call: "POST /onboarding-documents/${insp_doc_id}/review"
              payload: { decision: "PASS" }
              as: ComplianceReviewer
              as_user_id: "rev-2"
            - call: "POST /cooks/${cook_id}/onboarding-decision"
              payload: { decision: "ACTIVATE" }
              as: ComplianceReviewer
              as_user_id: "rev-1"
            - call: "POST /menu-items"
              payload: { cook_id: "${cook_id}", name: "Idli Steamer Pack", food_category: "NON_TCS", allergens: ["SOY"], allergen_free_attested: false, shelf_life_days: 4, requires_refrigeration: false, handoff_mode: "BATCH_COOK_AND_CHILL", unit_price_cents: 1200, label_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"] }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { mi_id: $.data.id }
            - call: "POST /menu-items/${mi_id}/submit"
              payload: {}
              as: Cook
              as_user_id: "${cook_id}"
            - call: "POST /menu-items/${mi_id}/review"
              payload: { decision: "APPROVE", allergen_review_notes: "soy declared" }
              as: ComplianceReviewer
              as_user_id: "rev-1"
            - call: "POST /production-windows"
              payload: { cook_id: "${cook_id}", week_start_date: "2026-08-03", order_cutoff_at: "2026-08-05T00:00:00Z", handoff_start_at: "2026-08-08T16:00:00Z", handoff_end_at: "2026-08-08T18:00:00Z", capacity_meals: 8 }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { pw_id: $.data.id }
            - call: "POST /delivery-zones"
              payload: { state_policy_id: "${sp_ca_id}", zone_code: "CA-DOOR-13", state_code: "CA", service_mode: "DOOR_DELIVERY", postal_codes: ["94110"], max_cold_chain_minutes: 180 }
              as: PlatformAdmin
              captures: { dz_id: $.data.id }
            - call: "POST /orders"
              payload: { menu_item_id: "${mi_id}", production_window_id: "${pw_id}", delivery_zone_id: "${dz_id}", quantity: 2, diner_contact_email: "u1@example.com" }
              as: Diner
              as_user_id: "diner-1"
              captures: { o1_id: $.data.id }
            - call: "POST /orders/${o1_id}/route"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /production-windows/${pw_id}/advance"
              payload: { to_status: "CUTOFF_PASSED" }
              as: Cook
              as_user_id: "${cook_id}"
            - call: "POST /production-windows/${pw_id}/advance"
              payload: { to_status: "IN_PRODUCTION" }
              as: Cook
              as_user_id: "${cook_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /orders/${o1_id}/advance"
              payload: { to_status: "IN_PRODUCTION" }
              as: Cook
              as_user_id: "${cook_id}"
            - call: "POST /orders/${o1_id}/advance"
              payload: { to_status: "HANDED_OFF" }
              as: Cook
              as_user_id: "${cook_id}"
            - call: "POST /orders/${o1_id}/advance"
              payload: { to_status: "DELIVERED" }
              as: Diner
              as_user_id: "diner-1"
          trigger:
            - call: "POST /refund-events"
              payload: { order_id: "${o1_id}", reason: "SAFETY", fault_party: "COOK", refund_amount_cents: 2616, settle_immediately: true }
              as: FinanceOperator
              as_user_id: "fin-1"
              captures: { re_id: $.data.id }
          assert:
            - "pre-refund state: Order.${o1_id}.payment_status == CAPTURED AND Cook.${cook_id}.ytd_cottage_revenue_cents == 2400 AND pending_payout_cents == 1860"
            - "RefundEvent.${re_id}.cook_chargeback_cents == 1860 (bucket 1 drained first, capped at cook_earnings_cents)"
            - "RefundEvent.${re_id}.commission_reversed_cents == 540 (bucket 2 drained second)"
            - "RefundEvent.${re_id}.platform_absorbed_cents == 216 (the residue equals the diner service fee exactly)"
            - "1860 + 540 + 216 == 2616 == RefundEvent.${re_id}.refund_amount_cents (no cent created or destroyed)"
            - "RefundEvent.${re_id}.status == SETTLED AND settled_at == 2026-08-08T17:00:00Z"
            - "Order.${o1_id}.payment_status == REFUNDED AND refunded_cents == 2616"
            - "Cook.${cook_id}.ytd_cottage_revenue_cents == 0 (restored to its exact pre-capture value)"
            - "Cook.${cook_id}.ytd_gross_sales_cents == 2400 (gross recognition is never reversed, only cottage revenue is)"
            - "Cook.${cook_id}.pending_payout_cents == 0 AND cap_status == UNDER_CAP"
