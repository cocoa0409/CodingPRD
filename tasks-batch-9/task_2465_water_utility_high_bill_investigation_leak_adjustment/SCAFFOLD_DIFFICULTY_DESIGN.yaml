      # -------- pair: business_constraint (p11) beats business_referential (p12) --------
      - name: priority_pair_business_constraint_p11_beats_business_referential_p12_on_bill_create
        grounds:
          - validations[priority=11]
          - validations[priority=12]
          - errors[ERR_METER_NOT_BILLABLE]
          - errors[ERR_BILL_METER_ACCOUNT_MISMATCH]
          - entities.Meter.fields.meter_type
          - endpoints[POST /bills]
        distinguishing_aspect: |
          PAIR: category business_constraint at priority 11 versus category business_referential
          at priority 12, on POST /bills — a third distinct error-category pair on a third
          endpoint. The meter cited is an IRRIGATION_SUBMETER (never billable) that ALSO belongs
          to a different ServiceAccount than the account_id in the body, so both rules are
          violated by one request. The answer must be ERR_METER_NOT_BILLABLE, not
          ERR_BILL_METER_ACCOUNT_MISMATCH; a follow-up call citing that account's own POTABLE_MASTER
          meter with the wrong account_id then yields the priority-12 error, proving both rules
          are individually live.
        test_recipe:
          setup:
            - "RS-STD-2026 and BillingPeriod 2026-07 (SUMMER, OPEN, ended before the 2026-08-01 clock) exist."
            - "ServiceAccount ACC-1004 owns POTABLE_MASTER MTR-X-1 and IRRIGATION_SUBMETER MTR-X-SUB whose parent_meter_id is MTR-X-1."
            - "ServiceAccount ACC-1005 owns POTABLE_MASTER MTR-Y-1."
            - "Every meter carries an opening 2026-06-30 read and a closing 2026-07-31 read so that nothing upstream of the two rules under test can fail."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /rate-schedules"
