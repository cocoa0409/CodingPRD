            - { call: "GET /api/agreements/${ag}", payload: {}, as: PremiumSalesRep, captures: { a2: $.data.f_b_accrued_cents_current_season } }
          assert:
            - "a0 == 0; after CONFIRMED a1 == 9400; after free CANCELLED a2 == 0 (exact conservation, zero drift)"
            - "cancel_fee_cents == 0 and status == CANCELLED (not CANCELLED_LATE) because the clock is before the cutoff"
