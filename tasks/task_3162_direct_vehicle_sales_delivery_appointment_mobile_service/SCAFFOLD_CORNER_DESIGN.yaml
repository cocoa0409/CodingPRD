  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_version_advances_on_every_order_write
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[delivery-appointment-create-with-stale-order-version]
          - entities.VehicleOrder.fields.version
          - endpoints.POST_/v1/orders/{id}/place
        distinguishing_aspect: "version is a monotone counter on the order: it reads 1 after creation and increments by exactly one on each accepted mutation, so a client that skips a read is rejected 412 on the next OCC-guarded write."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; an order created but not yet placed."
          setup_api_calls:
            - *c_clock
            - *c_jur
            - *c_enact
            - *c_center
            - *c_cfg
            - *c_buyer
            - *c_verify
            - *c_order
          trigger:
            - call: "GET /v1/orders/${ord_id}"
              payload: {}
              as: PlatformAdmin
              captures: { v0: $.data.version }
            - call: "POST /v1/orders/${ord_id}/place"
              payload: { expected_order_version: "${ord_v}" }
              as: Buyer
              as_user_id: "${byr_id}"
              captures: { v1: $.data.version }
            - call: "POST /v1/orders/${ord_id}/lock-configuration"
