          - errors.ERR_UNAUTHORIZED
          - validations.priority_12.ERR_UNAUTHORIZED
          - roles.ProgramAdmin.exclusive_operations
          - roles.CrossingSupervisor.exclusive_operations
          - roles.TrafficEngineer.exclusive_operations
        distinguishing_aspect: |
          Four denials, each reaching across a different pair of roles, all
          ERR_UNAUTHORIZED (403) from the priority-12 gate: CrossingSupervisor cannot
          activate a post (ProgramAdmin), TrafficEngineer cannot certify a guard
          (CrossingSupervisor), SchoolLiaison cannot open a warrant study
          (TrafficEngineer), and CrossingGuard cannot dispatch a substitute
          (CrossingSupervisor). The 403 must precede every business check, so none of the
          four target entities changes state — in particular the post stays PROPOSED even
          though its intersection is WARRANTED, and the untrained guard stays IN_TRAINING
          even though the certify payload is well-formed.
