# =============================================================================
# Scaffold: Defibrillator Program Placement, Readiness & Response Integration
# Difficulty target: beyond Expert — tight coupling, deep cascades, dual-variant
# calculations across distinct domains, non-linear state machines on multiple
# entities, OCC on Device, readiness posture gating, segregation of duties on
# post-event case review.
# =============================================================================

scenario: |
  Defibrillator Program Placement, Readiness & Response Integration (ZOLL):
  device placement planning across a campus using response-time modeling and
  cabinet siting, equipment registration with expiration tracking for pads and
  batteries, periodic readiness inspections with checklists and automated
  self-test reporting, responder training and refresher scheduling with
  certification tracking, emergency response integration where cabinet opening
  notifies dispatch and on-site responders, post-event data retrieval and case
  review with the receiving hospital, medical direction, prescription
  requirements and jurisdictional registration for public access programs,
  consumable replenishment after use and device return to service.

domain_name: defibrillator-program
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: hierarchical
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_target: beyond_expert
  entity_count: 14
  endpoint_count: 30
  error_code_count: 28

# =============================================================================
# §1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Campus
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Campus display name" }
      - { name: jurisdiction_code, type: string, source: input, description: "Regulatory jurisdiction (e.g. state code)" }
      - { name: jurisdiction_registration_number, type: string, source: input, description: "Public-access program registration id with the jurisdiction" }
      - { name: medical_director_id, type: string, source: input, description: "Physician overseeing program — must equal the id of an existing Responder with responder_role=MEDICAL_DIRECTOR (cross-reference validated at write time, not declared as FK to avoid bootstrap cycle)" }
      - { name: response_time_target_seconds, type: integer, source: input, description: "Target max response time for placement planning" }
      - { name: readiness_posture, type: enum, source: computed, description: "OPERATIONAL | DEGRADED | CRITICAL — aggregate of device postures" }

  - name: Zone
    parent: Campus
    common_fields: true
    fields:
      - { name: campus_id, type: string, source: system, description: "FK -> Campus.id" }
      - { name: zone_code, type: string, source: input, description: "Human code (e.g. BLDG-A-FLOOR-2)" }
      - { name: floor_area_sqm, type: integer, source: input, description: "Floor area served" }
      - { name: avg_walk_speed_mps, type: number, source: input, description: "Average responder walk speed m/s" }
      - { name: requires_elevator, type: boolean, source: input, description: "Whether vertical traversal adds fixed delay" }
      - { name: elevator_delay_seconds, type: integer, source: input, description: "Extra seconds when requires_elevator=true; 0 otherwise" }

  - name: DeviceModel
    parent: null
    common_fields: true
    fields:
      - { name: model_code, type: string, source: input, description: "Manufacturer model code" }
      - { name: manufacturer, type: string, source: input, description: "Manufacturer name" }
      - { name: pad_shelf_life_months, type: integer, source: input, description: "Pad shelf life from install" }
      - { name: battery_shelf_life_months, type: integer, source: input, description: "Battery shelf life from install" }
      - { name: prescription_required, type: boolean, source: input, description: "Whether device requires active prescription" }

  - name: Cabinet
    parent: Zone
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: system, description: "FK -> Zone.id" }
      - { name: location_label, type: string, source: input, description: "Human-readable cabinet siting label" }
      - { name: centroid_x_m, type: number, source: input, description: "Cabinet x coordinate in zone meters" }
      - { name: centroid_y_m, type: number, source: input, description: "Cabinet y coordinate in zone meters" }
      - { name: installed_device_id, type: string, source: system, description: "Currently installed Device id or null (system-managed back-pointer)" }
      - { name: status, type: enum, source: system, description: "EMPTY | OCCUPIED | ALARM_OPEN" }

  - name: Device
    parent: Campus
    common_fields: true
    fields:
      - { name: campus_id, type: string, source: system, description: "FK -> Campus.id" }
      - { name: device_model_id, type: string, source: input, description: "FK -> DeviceModel.id" }
      - { name: serial_number, type: string, source: input, description: "Manufacturer serial, unique per campus" }
      - { name: cabinet_id, type: string, source: system, description: "FK -> Cabinet.id; null when uninstalled" }
      - { name: prescription_number, type: string, source: input, description: "Prescription reference number — required when DeviceModel.prescription_required=true (validated at install/commission time); empty string otherwise" }
      - { name: current_pad_install_id, type: string, source: system, description: "id of active pad Install or null (system-managed back-pointer)" }
      - { name: current_battery_install_id, type: string, source: system, description: "id of active battery Install or null (system-managed back-pointer)" }
      - { name: last_inspection_at, type: datetime, source: system, description: "UTC timestamp of last PASSed Inspection" }
      - { name: last_selftest_status, type: enum, source: system, description: "PASS | FAIL | UNKNOWN — last received SelfTestReport" }
      - { name: readiness_posture, type: enum, source: computed, description: "READY | DEGRADED | OUT_OF_SERVICE — derived from consumables/inspection/selftest" }
      - { name: status, type: enum, source: system, description: "REGISTERED → INSTALLED → IN_SERVICE | POST_EVENT | MAINTENANCE → DECOMMISSIONED" }

  - name: ConsumableLot
    parent: Campus
    common_fields: true
    fields:
      - { name: campus_id, type: string, source: system, description: "FK -> Campus.id" }
      - { name: device_model_id, type: string, source: input, description: "FK -> DeviceModel.id this lot is compatible with" }
      - { name: kind, type: enum, source: input, description: "PAD | BATTERY" }
      - { name: lot_code, type: string, source: input, description: "Manufacturer lot code" }
      - { name: manufacturer_expires_at, type: datetime, source: input, description: "Manufacturer-printed expiration" }
      - { name: quantity_received, type: integer, source: input, description: "Units received in this lot" }
      - { name: quantity_available, type: integer, source: computed, description: "Received minus installed minus consumed minus expired-writeoffs" }

  - name: Install
    parent: Device
    common_fields: true
    fields:
      - { name: device_id, type: string, source: system, description: "FK -> Device.id" }
      - { name: consumable_lot_id, type: string, source: input, description: "FK -> ConsumableLot.id" }
      - { name: kind, type: enum, source: system, description: "PAD | BATTERY (copied from lot)" }
      - { name: installed_at, type: datetime, source: system, description: "UTC timestamp of install" }
      - { name: expires_at, type: datetime, source: computed, description: "min(lot.manufacturer_expires_at, installed_at + shelf_life_months per DeviceModel)" }
      - { name: removed_at, type: datetime, source: system, description: "Null while active; set on replace/consume" }
      - { name: disposition, type: enum, source: system, description: "ACTIVE | CONSUMED_IN_EVENT | EXPIRED_REMOVED | REPLACED" }

  - name: Inspection
    parent: Device
    common_fields: true
    fields:
      - { name: device_id, type: string, source: system, description: "FK -> Device.id" }
      - { name: inspector_id, type: string, source: input, description: "FK -> Responder.id of inspector" }
      - { name: scheduled_for, type: datetime, source: input, description: "Inspection window start (UTC)" }
      - { name: completed_at, type: datetime, source: system, description: "UTC timestamp when submitted" }
      - { name: checklist_items, type: array, source: input, description: "List of {item_code, result} entries" }
      - { name: outcome, type: enum, source: system, description: "SCHEDULED | PASS | FAIL | OVERDUE" }
      - { name: fail_reason, type: string, source: system, description: "Required when outcome=FAIL" }

  - name: SelfTestReport
    parent: Device
    common_fields: false
    fields:
      - { name: device_id, type: string, source: system, description: "Owning Device id (system-managed; reverse lookup via GET /api/self-test-reports?device_id=...)" }
      - { name: reported_at, type: datetime, source: input, description: "UTC timestamp of self-test run" }
      - { name: result, type: enum, source: input, description: "PASS | FAIL" }
      - { name: fault_code, type: string, source: input, description: "Manufacturer fault code when FAIL" }

  - name: Responder
    parent: Campus
    common_fields: true
    fields:
      - { name: campus_id, type: string, source: system, description: "FK -> Campus.id" }
      - { name: full_name, type: string, source: input, description: "Legal name" }
      - { name: badge_number, type: string, source: input, description: "Campus badge" }
      - { name: responder_role, type: enum, source: input, description: "LAY_RESPONDER | MEDICAL_DIRECTOR | PROGRAM_MANAGER | INSPECTOR" }
      - { name: certified_through, type: datetime, source: system, description: "End of current certification window; null if never certified" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | INACTIVE" }

  - name: TrainingSession
    parent: Campus
    common_fields: true
    fields:
      - { name: campus_id, type: string, source: system, description: "FK -> Campus.id" }
      - { name: instructor_id, type: string, source: input, description: "FK -> Responder.id (must be MEDICAL_DIRECTOR or PROGRAM_MANAGER)" }
      - { name: starts_at, type: datetime, source: input, description: "Session start (UTC)" }
      - { name: ends_at, type: datetime, source: input, description: "Session end (UTC)" }
      - { name: capacity, type: integer, source: input, description: "Max enrolled responders" }
      - { name: certification_months_granted, type: integer, source: input, description: "Months added to certified_through on completion" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED" }

  - name: EmergencyEvent
    parent: Campus
    common_fields: true
    fields:
      - { name: campus_id, type: string, source: system, description: "FK -> Campus.id" }
      - { name: cabinet_id, type: string, source: system, description: "FK -> Cabinet.id that was opened" }
      - { name: device_id, type: string, source: system, description: "FK -> Device.id involved" }
      - { name: opened_at, type: datetime, source: system, description: "UTC timestamp of cabinet open" }
      - { name: closed_at, type: datetime, source: system, description: "UTC timestamp of resolution; null while open" }
      - { name: hospital_code, type: string, source: input, description: "Receiving hospital code (required to close)" }
      - { name: patient_transported, type: boolean, source: input, description: "Whether patient was transported" }
      - { name: pads_consumed, type: boolean, source: system, description: "Whether pads were used (drives replenishment)" }
      - { name: status, type: enum, source: system, description: "OPEN | RESPONDING | RESOLVED | CASE_REVIEW | CLOSED" }

  - name: CaseReview
    parent: EmergencyEvent
    common_fields: true
    fields:
      - { name: emergency_event_id, type: string, source: system, description: "FK -> EmergencyEvent.id" }
      - { name: reviewer_id, type: string, source: input, description: "FK -> Responder.id — MUST be a Responder with responder_role=MEDICAL_DIRECTOR" }
      - { name: hospital_reviewer_name, type: string, source: input, description: "Receiving hospital reviewer name" }
      - { name: device_data_retrieved, type: boolean, source: input, description: "Whether post-event device data was retrieved" }
      - { name: outcome_code, type: enum, source: input, description: "SURVIVED_TO_DISCHARGE | SURVIVED_TO_ADMISSION | DECEASED | NO_SHOCK_INDICATED" }
      - { name: notes, type: string, source: input, description: "Free text review notes" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACCEPTED | REOPENED" }

  - name: ReplenishmentOrder
    parent: Campus
    common_fields: true
    fields:
      - { name: campus_id, type: string, source: system, description: "FK -> Campus.id" }
      - { name: emergency_event_id, type: string, source: system, description: "FK -> EmergencyEvent.id that triggered replenishment (null if routine)" }
      - { name: kind, type: enum, source: system, description: "PAD | BATTERY" }
      - { name: quantity, type: integer, source: system, description: "Units ordered" }
      - { name: status, type: enum, source: system, description: "PENDING | RECEIVED | CANCELLED" }
      - { name: received_lot_id, type: string, source: system, description: "id of ConsumableLot created on receipt; null until RECEIVED (system-managed back-pointer)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Device
    initial_state: REGISTERED
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: REGISTERED
        to: INSTALLED
        trigger: "POST /api/devices/{deviceId}/install"
        actor: ProgramManager
        preconditions:
          - "Cabinet exists in a Zone under same Campus, cabinet.status == EMPTY"
          - "If DeviceModel.prescription_required: active Prescription exists for Device"
          - "Readiness consumables NOT required at install (pads/battery may be installed separately)"
        side_effects:
          - "Cabinet.status → OCCUPIED; Cabinet.installed_device_id = device.id"
          - "Recompute Device.readiness_posture"

      - from: INSTALLED
        to: IN_SERVICE
        trigger: "POST /api/devices/{deviceId}/commission"
        actor: ProgramManager
        preconditions:
          - "Device.readiness_posture == READY"
        side_effects:
          - "Recompute Campus.readiness_posture"

      - from: IN_SERVICE
        to: POST_EVENT
        trigger: "POST /api/cabinets/{cabinetId}/open (cabinet open creates EmergencyEvent)"
        actor: system
        preconditions:
          - "Device currently installed in this cabinet"
        side_effects:
          - "Cabinet.status → ALARM_OPEN"
          - "EmergencyEvent created (status=OPEN)"
          - "Dispatch notified (audited)"
          - "All ACTIVE responders on campus with certified_through > now alerted"
          - "If pads consumed (declared at resolution): active pad Install.disposition → CONSUMED_IN_EVENT"
          - "ReplenishmentOrder auto-created with kind=PAD, quantity=1, status=PENDING"
          - "Device.current_pad_install_id cleared if consumed"
          - "Recompute Device.readiness_posture → likely OUT_OF_SERVICE"

      - from: POST_EVENT
        to: MAINTENANCE
        trigger: "POST /api/devices/{deviceId}/send_to_maintenance"
        actor: ProgramManager
        preconditions:
          - "All EmergencyEvents referencing device have status in {RESOLVED, CASE_REVIEW, CLOSED}"
        side_effects: []

      - from: MAINTENANCE
        to: INSTALLED
        trigger: "POST /api/devices/{deviceId}/return_to_service"
        actor: Inspector
        preconditions:
          - "Most recent Inspection for device has outcome=PASS and completed_at within 30 days"
          - "Device.readiness_posture == READY (post-replenishment install complete)"
          - "All PENDING ReplenishmentOrders referencing this device resolved"
        side_effects:
          - "Recompute Campus.readiness_posture"

      - from: INSTALLED
        to: MAINTENANCE
        trigger: "POST /api/devices/{deviceId}/send_to_maintenance"
        actor: ProgramManager
        preconditions: []
        side_effects:
          - "Cabinet.status → EMPTY; Cabinet.installed_device_id = null"
          - "Device.cabinet_id = null"

      - from: MAINTENANCE
        to: DECOMMISSIONED
        trigger: "POST /api/devices/{deviceId}/decommission"
        actor: ProgramManager
        preconditions:
          - "All OPEN EmergencyEvents referencing device closed"
        side_effects: []

      - from: REGISTERED
        to: DECOMMISSIONED
        trigger: "POST /api/devices/{deviceId}/decommission"
        actor: ProgramManager
        preconditions: []
        side_effects: []

  - entity: Cabinet
    initial_state: EMPTY
    terminal_states: []
    transitions:
      - from: EMPTY
        to: OCCUPIED
        trigger: "Device install"
        actor: system
        preconditions: []
        side_effects: []
      - from: OCCUPIED
        to: ALARM_OPEN
        trigger: "POST /api/cabinets/{cabinetId}/open"
        actor: Anonymous
        preconditions:
          - "Cabinet has installed Device with status == IN_SERVICE"
        side_effects:
          - "Create EmergencyEvent"
          - "Cascade per Device.POST_EVENT transition"
      - from: ALARM_OPEN
        to: OCCUPIED
        trigger: "EmergencyEvent resolution (cabinet closed & secured)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OCCUPIED
        to: EMPTY
        trigger: "Device send_to_maintenance or decommission"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Install
    initial_state: ACTIVE
    terminal_states: [CONSUMED_IN_EVENT, EXPIRED_REMOVED, REPLACED]
    transitions:
      - from: ACTIVE
        to: REPLACED
        trigger: "POST /api/devices/{deviceId}/installs (new Install for same kind supersedes)"
        actor: ProgramManager
        preconditions:
          - "New Install's lot kind matches"
        side_effects:
          - "Old install removed_at set"
          - "Old lot quantity_available unchanged (unit was already drawn)"
          - "Recompute Device.readiness_posture"
      - from: ACTIVE
        to: CONSUMED_IN_EVENT
        trigger: "EmergencyEvent resolution with pads_consumed=true"
        actor: system
        preconditions: []
        side_effects:
          - "Device.current_pad_install_id cleared"
          - "Triggers auto-replenishment"
      - from: ACTIVE
        to: EXPIRED_REMOVED
        trigger: "POST /api/installs/{installId}/remove (or system sweep when expires_at <= now)"
        actor: ProgramManager
        preconditions:
          - "Install.expires_at <= now OR explicit manual removal"
        side_effects:
          - "Device.current_*_install_id cleared if matching"
          - "Recompute Device.readiness_posture (likely → DEGRADED or OUT_OF_SERVICE)"

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [PASS, FAIL, OVERDUE]
    transitions:
      - from: SCHEDULED
        to: PASS
        trigger: "POST /api/inspections/{inspectionId}/submit with all checklist_items.result == PASS"
        actor: Inspector
        preconditions:
          - "scheduled_for <= now"
          - "completed_at <= scheduled_for + 7 days"
          - "Device NOT in DECOMMISSIONED"
        side_effects:
          - "Device.last_inspection_at = completed_at"
          - "Recompute Device.readiness_posture"
      - from: SCHEDULED
        to: FAIL
        trigger: "POST .../submit with any checklist_items.result == FAIL"
        actor: Inspector
        preconditions:
          - "fail_reason required"
        side_effects:
          - "Device.readiness_posture forced to OUT_OF_SERVICE"
      - from: SCHEDULED
        to: OVERDUE
        trigger: "System sweep when now > scheduled_for + 7 days and not submitted"
        actor: system
        preconditions: []
        side_effects:
          - "Device.readiness_posture → DEGRADED (until FAIL or replacement scheduled)"

  - entity: TrainingSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /api/training-sessions/{sessionId}/complete with attendee list"
        actor: ProgramManager
        preconditions:
          - "ends_at <= now"
          - "Attendees enrolled and present (>= 1)"
        side_effects:
          - "For each attendee Responder: certified_through = max(certified_through, ends_at) + certification_months_granted months"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/training-sessions/{sessionId}/cancel"
        actor: ProgramManager
        preconditions:
          - "starts_at > now (cannot cancel after start)"
        side_effects: []

  - entity: EmergencyEvent
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: RESPONDING
        trigger: "POST /api/emergency-events/{eventId}/acknowledge by Responder"
        actor: Responder
        preconditions:
          - "Responder.status == ACTIVE"
          - "Responder.certified_through > now"
        side_effects:
          - "Record first-acknowledged responder"
      - from: RESPONDING
        to: RESOLVED
        trigger: "POST /api/emergency-events/{eventId}/resolve"
        actor: Responder
        preconditions:
          - "hospital_code provided"
          - "patient_transported declared"
          - "pads_consumed declared"
        side_effects:
          - "Cabinet.status → OCCUPIED"
          - "If pads_consumed: pad Install.disposition → CONSUMED_IN_EVENT; ReplenishmentOrder auto-created (kind=PAD, qty=1, PENDING)"
          - "Device.status → POST_EVENT"
          - "Recompute readiness posture"
      - from: RESOLVED
        to: CASE_REVIEW
        trigger: "POST /api/case-reviews (first CaseReview created)"
        actor: MedicalDirector
        preconditions:
          - "reviewer_id is a Responder with responder_role=MEDICAL_DIRECTOR"
          - "reviewer_id != Campus.medical_director_id (segregation: directing physician may not self-review; second MD required)"
        side_effects:
          - "CaseReview created (status=DRAFT)"
      - from: CASE_REVIEW
        to: CLOSED
        trigger: "CaseReview transitions to ACCEPTED"
        actor: system
        preconditions:
          - "CaseReview.device_data_retrieved == true"
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /api/emergency-events/{eventId}/close_no_patient"
        actor: Responder
        preconditions:
          - "False alarm: no patient, no pads used"
          - "pads_consumed == false"
        side_effects:
          - "Cabinet.status → OCCUPIED"
          - "Device.status returns to IN_SERVICE"

  - entity: CaseReview
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/case-reviews/{id}/submit"
        actor: MedicalDirector
        preconditions:
          - "outcome_code set, hospital_reviewer_name set, device_data_retrieved set"
        side_effects: []
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /api/case-reviews/{id}/accept"
        actor: MedicalDirector
        preconditions:
          - "acceptor != reviewer_id (segregation of duties)"
          - "acceptor has responder_role == MEDICAL_DIRECTOR"
        side_effects:
          - "Parent EmergencyEvent → CLOSED"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /api/case-reviews/{id}/reopen"
        actor: MedicalDirector
        preconditions: []
        side_effects: []

  - entity: ReplenishmentOrder
    initial_state: PENDING
    terminal_states: [RECEIVED, CANCELLED]
    transitions:
      - from: PENDING
        to: RECEIVED
        trigger: "POST /api/replenishment-orders/{orderId}/receive"
        actor: ProgramManager
        preconditions:
          - "Payload provides manufacturer_expires_at and lot_code for new lot"
        side_effects:
          - "New ConsumableLot created (kind, quantity=order.quantity)"
          - "received_lot_id set"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /api/replenishment-orders/{orderId}/cancel"
        actor: ProgramManager
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: device-install-stale-version
    parent_entity: Device
    write_endpoint: "POST /api/devices/{deviceId}/install"
    occ_field: "expected_device_version"
    description: |
      Installing a Device into a Cabinet against a stale view of the Device
      (e.g., another writer has just installed or moved it) is rejected.
      OCC on Device.version resolves the conflict deterministically.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: device-consumable-install-stale
    parent_entity: Device
    write_endpoint: "POST /api/devices/{deviceId}/installs"
    occ_field: "expected_device_version"
    description: |
      Installing a consumable (pad/battery) against a stale Device.version
      rejects the call. The supersede semantics of Install.ACTIVE→REPLACED
      make a stale view dangerous: the requester may believe they are
      replacing install X when in fact install Y is now active.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: install_expiration
    trigger: "Install creation (POST .../devices/{id}/installs)"
    algorithm: threshold
    formula: |
      shelf_life_months = (kind == PAD) ? model.pad_shelf_life_months : model.battery_shelf_life_months
      shelf_life_end = installed_at + shelf_life_months (calendar month arithmetic, same day-of-month, clamp to last day)
      expires_at = min(lot.manufacturer_expires_at, shelf_life_end)
    precision: "datetime (UTC, second precision)"
    variants:
      - name: pad_variant
        when: "kind == PAD"
        difference: "uses model.pad_shelf_life_months as the shelf-life input"
      - name: battery_variant
        when: "kind == BATTERY"
        difference: "uses model.battery_shelf_life_months; battery ALSO expires immediately when self-test returns FAIL with fault_code starting with 'BATT-' regardless of dates"

  - name: readiness_posture
    trigger: "Any change to: pad install state, battery install state, last_inspection_at, last_selftest_status, Device.status"
    algorithm: threshold
    formula: |
      if Device.status in {POST_EVENT, MAINTENANCE, DECOMMISSIONED}: posture = OUT_OF_SERVICE
      elif no active pad install OR no active battery install: posture = OUT_OF_SERVICE
      elif active pad.expires_at <= now OR active battery.expires_at <= now: posture = OUT_OF_SERVICE
      elif last_selftest_status == FAIL: posture = OUT_OF_SERVICE
      elif last_inspection_at is null OR now > last_inspection_at + 30 days: posture = DEGRADED
      elif any install expires within 7 days (now < expires_at <= now + 7d): posture = DEGRADED
      else: posture = READY
    precision: "enum"

  - name: campus_readiness_posture
    trigger: "Any Device.readiness_posture change within Campus"
    algorithm: aggregation
    formula: |
      devices = all Device where campus_id == campus AND status != DECOMMISSIONED
      out_count = count where readiness_posture == OUT_OF_SERVICE
      degraded_count = count where readiness_posture == DEGRADED
      total = count(devices)
      if total == 0: campus.readiness_posture = OPERATIONAL
      elif out_count >= max(1, ceil(total * 0.25)): campus.readiness_posture = CRITICAL
      elif out_count > 0 OR degraded_count >= max(1, floor(total * 0.50)): campus.readiness_posture = DEGRADED
      else: campus.readiness_posture = OPERATIONAL
    constants:
      CRITICAL_OUT_FRACTION: 0.25
      DEGRADED_FRACTION: 0.50
    precision: "enum"

  - name: response_time_estimate_seconds
    trigger: "GET /api/campuses/{campusId}/coverage-report?cabinet_id=... or coverage report"
    algorithm: weighted_scoring
    formula: |
      # Two variants produce different numbers for the same inputs
      distance_m = sqrt((cabinet.centroid_x_m - zone.centroid_x_m)^2 + (cabinet.centroid_y_m - zone.centroid_y_m)^2)
      # Variant A (straight-line, optimistic): distance = euclidean
      # Variant B (walk-path, pessimistic): distance = manhattan = |dx| + |dy|, plus 1.30 multiplier for obstructions
      walk_seconds_A = distance_euclidean / zone.avg_walk_speed_mps
      walk_seconds_B = (|dx| + |dy|) * 1.30 / zone.avg_walk_speed_mps
      elevator_seconds = zone.elevator_delay_seconds if zone.requires_elevator else 0
      # Round half-up to integer seconds per leg, then sum (per-leg rounding is canonical)
      response_A = round_half_up(walk_seconds_A) + elevator_seconds
      response_B = round_half_up(walk_seconds_B) + elevator_seconds
    precision: "integer seconds, round_half_up applied per leg"
    variants:
      - name: straight_line_optimistic
        when: "planning_mode == OPTIMISTIC (used for placement plan drafts)"
        difference: "euclidean distance, no obstruction multiplier"
      - name: walk_path_pessimistic
        when: "planning_mode == PESSIMISTIC (used for compliance attestation)"
        difference: "manhattan distance × 1.30 obstruction multiplier"

  - name: coverage_score_percent
    trigger: "GET /api/campuses/{campusId}/coverage-report"
    algorithm: aggregation
    formula: |
      # Per-zone coverage (a zone is covered if it has >= 1 cabinet whose
      # PESSIMISTIC response time from zone centroid is <= response_time_target_seconds)
      # Coverage% = round_half_up( sum(covered_zones) * 100 / total_zones )
      # The scaffold pins per-zone-then-sum ordering: per-zone coverage is
      # computed as 0 or 1 integer, summed, then multiplied by 100, divided by
      # total_zones, rounded half-up once. NOT sum-of-fractions.
      per_zone_covered_i = 1 if zone_i has any cabinet meeting target else 0
      coverage_pct = round_half_up( sum(per_zone_covered_i) * 100 / count(zones) )
    precision: "integer percent, round_half_up at final step only"
    variants:
      - name: per_zone_then_sum
        when: "canonical ordering pinned by scaffold"
        difference: "per-zone coverage computed as integer 0/1 first; alternate 'sum fractional coverage then round' is rejected"

  - name: certification_extension
    trigger: "TrainingSession completion"
    algorithm: chronological
    formula: |
      # For each attendee, in order of enrollment created_at ASC:
      base = max(responder.certified_through, session.ends_at)
      # If base is null (never certified), base = session.ends_at
      new_certified_through = add_months(base, session.certification_months_granted)
      # add_months preserves day-of-month, clamping to last day of shorter month
    precision: "datetime (UTC)"

  - name: replenishment_quantity
    trigger: "EmergencyEvent resolution with pads_consumed=true"
    algorithm: aggregation
    formula: |
      # Always 1 pad unit per event in v1; future-proofed but pinned
      qty = 1 if pads_consumed else 0
    precision: "integer"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role authorized for endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path and body FK references resolve (Campus, Zone, Cabinet, Device, etc.); existence validated before state and business checks"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: state
    check: "OCC: expected_<parent>_version matches current version (where required)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "endpoints declaring expected_*_version input"

  - priority: 5
    category: state
    check: "Target resource in correct state for operation"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "state-changing endpoints"

  - priority: 6
    category: business_safety
    check: "Medical-direction segregation: CaseReview.reviewer_id != Campus.medical_director_id; CaseReview acceptor != reviewer"
    error_id: ERR_MEDICAL_DIRECTION_CONFLICT
    http_status: 422
    applies_to: "case-review create/accept"

  - priority: 7
    category: business_safety
    check: "Prescription required: Device install/commission blocked when DeviceModel.prescription_required and no active Prescription"
    error_id: ERR_PRESCRIPTION_REQUIRED
    http_status: 422
    applies_to: "device install, device commission"

  - priority: 8
    category: business_safety
    check: "Responder certification: responder.certified_through > now and responder.status == ACTIVE for emergency acknowledge and for training enrollment"
    error_id: ERR_RESPONDER_NOT_CERTIFIED
    http_status: 422
    applies_to: "emergency-event acknowledge, training enrollment"

  - priority: 9
    category: business_temporal
    check: "Inspection window: completed within [scheduled_for, scheduled_for+7d]; TrainingSession: ends_at > starts_at and starts_at > now for new sessions"
    error_id: ERR_TEMPORAL_WINDOW_VIOLATION
    http_status: 422
    applies_to: "inspection submit, training session create"

  - priority: 10
    category: business_referential
    check: "FK integrity: lot compatible with device model, cabinet in same campus, instructor is MEDICAL_DIRECTOR or PROGRAM_MANAGER"
    error_id: ERR_INCOMPATIBLE_REFERENCE
    http_status: 422
    applies_to: "install create, training session create"

  - priority: 11
    category: business_constraint
    check: "Cabinet capacity: cabinet.status must be EMPTY for install; training session capacity not exceeded"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "device install, training enrollment"

  - priority: 12
    category: business_constraint
    check: "Consumable lot availability: lot.quantity_available > 0 and lot not expired (manufacturer_expires_at > now)"
    error_id: ERR_LOT_UNAVAILABLE
    http_status: 409
    applies_to: "install create"

  - priority: 13
    category: business_fiscal
    check: "Replenishment receive: payload provides lot_code and manufacturer_expires_at; order still PENDING"
    error_id: ERR_REPLENISHMENT_INVALID
    http_status: 422
    applies_to: "replenishment receive"

  - priority: 14
    category: business_constraint
    check: "Required input fields present with correct types and enum members"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

