  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: response_envelope_success_shape
        claim_type: endpoint_pattern
        grounds: [response_envelope]
        distinguishing_aspect: "Success response has meta.api_request_id, meta.api_request_timestamp, response_type='object', data payload"
        test_recipe:
          setup: ["PayerPolicy exists"]
          setup_api_calls:
            - call: "POST /sleep-therapy/payer-policies"
              payload: { payer_name: "Payer A", plan_code: "PAYER-A", compliance_threshold_pct: 70, compliance_min_hours_per_night: 4.0, compliance_window_days: 30, compliance_min_nights: 21, rental_months_to_own: 3, mask_cadence_days: 90, cushion_cadence_days: 30, filter_cadence_days: 14, tubing_cadence_days: 90, mask_exchange_window_days: 30, max_exchanges_per_window: 1, requires_prior_auth: false }
              as: OpsAdmin
              captures: { pps: $.data.id }
          trigger:
            - call: "GET /sleep-therapy/payer-policies/${pps}"
              payload: {}
              as: OpsAdmin
          assert:
            - "response.meta.api_request_id present"
            - "response.meta.api_request_timestamp present"
            - "response.response_type == 'object'"
            - "response.data contains PayerPolicy fields"

      - name: response_envelope_error_shape
        claim_type: endpoint_pattern
        grounds: [response_envelope]
        distinguishing_aspect: "Error response has response_type='error' and data.error_id, data.message"
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "GET /sleep-therapy/patients/{id}"
              payload: {}
              as: OpsAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "${eid} == 'ERR_NOT_FOUND'"

  # ===========================================================================
  # Section: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: error_cadence_not_met
        claim_type: violation_to_error
        grounds: ["errors[ERR_CADENCE_NOT_MET]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / cadence_boundary_next_eligible_on_inclusive
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_stale_patient_version
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_PATIENT_VERSION]", "concurrency_rules[order-authorize-stale-patient]"]
        distinguishing_aspect: "Order B authorize with a Patient.version captured before order A's authorize -> 412 ERR_STALE_PATIENT_VERSION; order B's own state precondition passes, isolating the OCC failure"
        test_recipe:
          setup: ["Two FILTER orders on the same patient; order A authorized (bumps Patient.version); order B clinical-cleared and attempted authorize with the stale pre-A version"]
          setup_api_calls:
            - call: "POST /sleep-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /sleep-therapy/payer-policies"
              payload: { payer_name: "Payer A", plan_code: "PAYER-A", compliance_threshold_pct: 70, compliance_min_hours_per_night: 4.0, compliance_window_days: 30, compliance_min_nights: 21, rental_months_to_own: 3, mask_cadence_days: 90, cushion_cadence_days: 30, filter_cadence_days: 14, tubing_cadence_days: 90, mask_exchange_window_days: 30, max_exchanges_per_window: 1, requires_prior_auth: false }
              as: OpsAdmin
              captures: { ppt: $.data.id }
            - call: "POST /sleep-therapy/patients"
              payload: { full_name: "T", date_of_birth: "1980-01-01", payer_policy_id: "${ppt}", prescribing_clinician_npi: "1234567890" }
              as: IntakeCoordinator
              captures: { patt: $.data.id }
            - call: "POST /sleep-therapy/device-enrollments"
              payload: { patient_id: "${patt}", device_serial: "SN-T", device_model: "Airsense-11", acquisition_type: "PURCHASE" }
              as: IntakeCoordinator
              captures: { det: $.data.id }
            - call: "POST /sleep-therapy/device-enrollments/${det}/begin-setup"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/device-enrollments/${det}/complete-setup"
              payload: {}
              as: RespiratoryTherapist
            - call: "GET /sleep-therapy/component-supply-plans"
              payload: { patient_id: "${patt}", component_type: "FILTER" }
              as: OpsAdmin
              captures: { ft: "$.data[0].id" }
            - call: "GET /sleep-therapy/patients/${patt}"
              payload: {}
              as: OpsAdmin
              captures: { patt_v_pre: $.data.version }
            # Order A: full path through authorize (bumps Patient.version)
            - call: "POST /sleep-therapy/resupply-orders"
              payload: { patient_id: "${patt}", component_supply_plan_id: "${ft}", requested_quantity: 1, expected_patient_version: "${patt_v_pre}" }
              as: IntakeCoordinator
              captures: { roA: $.data.id }
            - call: "POST /sleep-therapy/resupply-orders/${roA}/clinical-clear"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/resupply-orders/${roA}/authorize"
              payload: { expected_patient_version: "${patt_v_pre}" }
              as: BillingSpecialist
            # Patient.version is now patt_v_pre + 1 (authorize bumped it)
            # Order B: created and clinical-cleared AFTER A's authorize; authorize attempt uses stale patt_v_pre
            - call: "GET /sleep-therapy/patients/${patt}"
              payload: {}
              as: OpsAdmin
              captures: { patt_v_postA: $.data.version }
            - call: "POST /sleep-therapy/resupply-orders"
              payload: { patient_id: "${patt}", component_supply_plan_id: "${ft}", requested_quantity: 1, expected_patient_version: "${patt_v_postA}" }
              as: IntakeCoordinator
              captures: { roB: $.data.id }
            - call: "POST /sleep-therapy/resupply-orders/${roB}/clinical-clear"
              payload: {}
              as: RespiratoryTherapist
          trigger:
            - call: "POST /sleep-therapy/resupply-orders/${roB}/authorize"
              payload: { expected_patient_version: "${patt_v_pre}" }
              as: BillingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "Order B state check passes (auth_status == PENDING_PAYER_AUTH), but OCC fails: ${err} == 'ERR_STALE_PATIENT_VERSION'"

      - name: error_segretation_of_duties
        claim_type: violation_to_error
        grounds: ["errors[ERR_SEGREGATION_OF_DUTIES]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / sod_vs_stale_version_on_authorize
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_exchange_window_expired
        claim_type: violation_to_error
        grounds: ["errors[ERR_EXCHANGE_WINDOW_EXPIRED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / mask_exchange_approve_gated_by_window_anchor_from_device_enrollment
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_exchange_limit_reached
        claim_type: violation_to_error
        grounds: ["errors[ERR_EXCHANGE_LIMIT_REACHED]"]
        excluded_because:
          difficulty_instance: combinatorial_formula / mask_exchange_window_and_count_intersection
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_patient_not_in_active_therapy
        claim_type: violation_to_error
        grounds: ["errors[ERR_PATIENT_NOT_IN_ACTIVE_THERAPY]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / order_create_gated_by_patient_status
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_rental_not_billing
        claim_type: violation_to_error
        grounds: ["errors[ERR_RENTAL_NOT_BILLING]"]
        excluded_because:
          difficulty_instance: dual_variant_calc / rental_straight_line_vs_actual_usage_conversion
          rationale: "Asserted as the paused-billing failure path of the named §1.8 instance."

