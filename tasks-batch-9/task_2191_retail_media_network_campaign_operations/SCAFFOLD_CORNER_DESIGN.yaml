              as: AccountManager
              as_user_id: "u_am_1"
              captures: { camp_id: $.data.id, camp_v: $.data.version }
            - *c_prod
            - *c_li
            - *c_pa
            - *c_li_sub
            - *c_li_app
            - *c_camp_rev
            - *c_camp_app
            - *c_camp_act
            - *c_li_act
            - *c_auc
            - *c_rank
            - *c_award
            - call: "POST /rmn/engagement-events"
              payload: { line_item_id: "${li_id}", auction_event_id: "${auc_id}", catalog_product_id: "${prod_id}", event_type: "IMPRESSION", occurred_at: "2026-08-01T12:05:00Z", shopper_hash: "sh_1", channel: "OFFSITE" }
              as: AuctionService
              as_user_id: "u_auc_1"
            - call: "POST /rmn/engagement-events"
              payload: { line_item_id: "${li_id}", auction_event_id: "${auc_id}", catalog_product_id: "${prod_id}", event_type: "CLICK", occurred_at: "2026-08-01T12:10:00Z", shopper_hash: "sh_1", channel: "OFFSITE" }
              as: AuctionService
              as_user_id: "u_auc_1"
            - *c_settle
            - call: "POST /rmn/campaigns/${camp_id}/offsite-reconciliation"
