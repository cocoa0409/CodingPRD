      - name: financing_scenario_create_supersedes_prior_and_bumps_project_version
        claim_type: cascading_side_effects
        grounds: ["concurrency_rules[financing-scenario-create-stale-project]", "entities.FinancingScenario.fields.status", "state_machines.AduProject.UNFUNDED_to_PRE_QUALIFIED"]
        distinguishing_aspect: "Creating a second FinancingScenario with the freshly read project version succeeds, flips the prior ACTIVE row to SUPERSEDED, leaves financing_state at PRE_QUALIFIED and advances AduProject.version from 1 to 3 across the two creates."
