# ============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Flavor House Sample Development & Formulation Project
# 21 instances across the nine §0.5 Difficulty Rules.
# Every literal below was computed against the §1.3 formulas and constants.
# The logical clock starts at 2026-08-01T00:00:00Z unless a chain moves it.
# ============================================================================

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: cost_in_use_bench_vs_firm_variant_divergence
        grounds:
          - calculations.formula_cost_in_use
          - entities.Formula.fields.bench_cost_in_use_cents_per_tonne
          - entities.Formula.fields.firm_cost_in_use_cents_per_tonne
          - state_machines.Formula.DRAFT_to_COSTED
          - validations[priority=82]
        distinguishing_aspect: |
          Cost accounting on the Formula entity: one costing pass writes two different
          cents-per-tonne figures from the identical component set — BENCH_PROVISIONAL
          74425 (list prices, no discount, no yield loss) and PRODUCTION_FIRM 73275
          (4.0% volume price break, then 2.5% yield-loss inflation) — and only the
          BENCH_PROVISIONAL figure is the submit gate.
        test_recipe:
          setup:
            - "Three raw materials priced 45333, 9876 and 1215 cents per kg."
            - "Brief BRF-0001 with dosage_pct 2.5, annual_volume_kg 1200 (the 4.0% price-break tier) and cost_in_use_cap_cents_per_tonne 74425, in status ACCEPTED."
            - "Formula F1 under that brief with components 3.7500% / 1.2500% / 95.0000% summing to exactly 100.0000, still in DRAFT."
          setup_api_calls:
            - call: "POST /raw-materials"
              payload: { material_code: "CITRAL-NAT", name: "Natural Citral", cost_per_kg_cents: 45333, natural_status: "NATURAL", potency_class: "HIGH_IMPACT", max_use_ppm: 50000 }
              as: PurchasingManager
              captures: { m1: $.data.id }
            - call: "POST /raw-materials"
              payload: { material_code: "ETHYL-BUT", name: "Ethyl Butyrate Natural", cost_per_kg_cents: 9876, natural_status: "NATURAL", potency_class: "STANDARD", max_use_ppm: 20000 }
              as: PurchasingManager
              captures: { m2: $.data.id }
            - call: "POST /raw-materials"
              payload: { material_code: "PG-SOLV", name: "Propylene Glycol Solvent", cost_per_kg_cents: 1215, natural_status: "NATURE_IDENTICAL", potency_class: "STANDARD", max_use_ppm: 1000000 }
              as: PurchasingManager
              captures: { m3: $.data.id }
            - call: "POST /customer-briefs"
              payload: { brief_code: "BRF-0001", customer_name: "Nordic Beverages", matrix_type: "BEVERAGE_STILL", target_profile: "CITRUS_TOP_NOTE", dosage_pct: 2.5, annual_volume_kg: 1200, cost_in_use_cap_cents_per_tonne: 74425, confidentiality_tier: "TIER_1_STANDARD" }
              as: AccountManager
              captures: { b1: $.data.id }
            - call: "POST /customer-briefs/${b1}/submit"
              payload: {}
              as: AccountManager
            - call: "POST /customer-briefs/${b1}/decision"
              payload: { decision: "ACCEPTED", decision_note: "Brief accepted for bench work" }
              as: TechnicalDirector
            - call: "POST /formulas"
              payload: { brief_id: "${b1}", name: "Citrus Top Note F1" }
              as: Flavorist
              captures: { f1: $.data.id }
            - call: "POST /formulas/${f1}/components"
              payload: { component_type: "RAW_MATERIAL", raw_material_id: "${m1}", weight_pct: 3.75 }
              as: Flavorist
            - call: "POST /formulas/${f1}/components"
              payload: { component_type: "RAW_MATERIAL", raw_material_id: "${m2}", weight_pct: 1.25 }
              as: Flavorist
            - call: "POST /formulas/${f1}/components"
              payload: { component_type: "RAW_MATERIAL", raw_material_id: "${m3}", weight_pct: 95.0 }
              as: Flavorist
          trigger:
            - call: "POST /formulas/${f1}/cost"
              payload: {}
              as: Flavorist
              captures: { bench_ciu: $.data.bench_cost_in_use_cents_per_tonne, firm_ciu: $.data.firm_cost_in_use_cents_per_tonne }
          assert:
            - "Formula.${f1}.bench_cost_per_kg_cents == 2977"
            - "Formula.${f1}.bench_cost_in_use_cents_per_tonne == 74425"
            - "Formula.${f1}.firm_cost_in_use_cents_per_tonne == 73275"
            - "${bench_ciu} != ${firm_ciu} — the same component set yields two different cents-per-tonne values"
            - "Formula.${f1}.status == COSTED"
            - "Formula.${f1}.cost_stale == false"

      - name: forecast_risk_weighted_vs_committed_variant_divergence
        grounds:
          - calculations.forecast_value
          - entities.CommercializationForecast.fields.variant_applied
          - entities.CommercializationForecast.fields.weighted_annual_value_cents
          - state_machines.CommercializationForecast.ACTIVE_to_REALIZED
          - state_machines.CustomerBrief.ACCEPTED_to_CLOSED_WON
          - concurrency_rules[forecast-create-stale-brief]
        distinguishing_aspect: |
          Revenue risk scoring on the CommercializationForecast entity (a different
          entity domain from the Formula cost variant): the identical
          annual_volume_kg 1200 and unit_price_cents_per_kg 4200 produce 1814400
          under RISK_WEIGHTED (0.45 stage x 0.80 technical) and 5040000 under
          COMMITTED once the brief is CLOSED_WON, both factors collapsing to 1.00.
        test_recipe:
          setup:
            - "Brief BRF-0001 in ACCEPTED, three raw materials, formula F1 APPROVED under that brief."
            - "A first forecast published while no formula was approved yet (technical_factor 0.55 -> 1247400), later SUPERSEDED."
            - "A second forecast published after F1 reached APPROVED (technical_factor 0.80 -> 1814400) and still ACTIVE."
            - "No application test has passed, so technical_factor stops at 0.80."
          setup_api_calls:
            - call: "POST /raw-materials"
              payload: { material_code: "CITRAL-NAT", name: "Natural Citral", cost_per_kg_cents: 45333, natural_status: "NATURAL", potency_class: "HIGH_IMPACT", max_use_ppm: 50000 }
              as: PurchasingManager
              captures: { m1: $.data.id }
            - call: "POST /raw-materials"
              payload: { material_code: "ETHYL-BUT", name: "Ethyl Butyrate Natural", cost_per_kg_cents: 9876, natural_status: "NATURAL", potency_class: "STANDARD", max_use_ppm: 20000 }
              as: PurchasingManager
              captures: { m2: $.data.id }
            - call: "POST /raw-materials"
              payload: { material_code: "PG-SOLV", name: "Propylene Glycol Solvent", cost_per_kg_cents: 1215, natural_status: "NATURE_IDENTICAL", potency_class: "STANDARD", max_use_ppm: 1000000 }
              as: PurchasingManager
              captures: { m3: $.data.id }
            - call: "POST /customer-briefs"
              payload: { brief_code: "BRF-0001", customer_name: "Nordic Beverages", matrix_type: "BEVERAGE_STILL", target_profile: "CITRUS_TOP_NOTE", dosage_pct: 2.5, annual_volume_kg: 1200, cost_in_use_cap_cents_per_tonne: 74425, confidentiality_tier: "TIER_1_STANDARD" }
              as: AccountManager
              captures: { b1: $.data.id }
            - call: "POST /customer-briefs/${b1}/submit"
              payload: {}
              as: AccountManager
            - call: "POST /customer-briefs/${b1}/decision"
              payload: { decision: "ACCEPTED", decision_note: "Brief accepted for bench work" }
              as: TechnicalDirector
              captures: { b1_ver: $.data.version }
            - call: "POST /commercialization-forecasts"
              payload: { brief_id: "${b1}", annual_volume_kg: 1200, unit_price_cents_per_kg: 4200, expected_brief_version: "${b1_ver}" }
              as: AccountManager
              captures: { fc_early: $.data.id, early_value: $.data.weighted_annual_value_cents }
            - call: "POST /formulas"
              payload: { brief_id: "${b1}", name: "Citrus Top Note F1" }
              as: Flavorist
              captures: { f1: $.data.id }
            - call: "POST /formulas/${f1}/components"
              payload: { component_type: "RAW_MATERIAL", raw_material_id: "${m1}", weight_pct: 3.75 }
              as: Flavorist
            - call: "POST /formulas/${f1}/components"
              payload: { component_type: "RAW_MATERIAL", raw_material_id: "${m2}", weight_pct: 1.25 }
              as: Flavorist
            - call: "POST /formulas/${f1}/components"
              payload: { component_type: "RAW_MATERIAL", raw_material_id: "${m3}", weight_pct: 95.0 }
              as: Flavorist
            - call: "POST /formulas/${f1}/cost"
              payload: {}
              as: Flavorist
            - call: "POST /formulas/${f1}/submit"
              payload: {}
              as: Flavorist
              as_user_id: "u_flav_1"
            - call: "POST /formulas/${f1}/decision"
              payload: { decision: "APPROVED", decision_note: "Bench profile on target" }
              as: TechnicalDirector
              as_user_id: "u_dir_1"
            - call: "GET /customer-briefs/${b1}"
              payload: {}
              as: AccountManager
              captures: { b1_ver2: $.data.version }
            - call: "POST /commercialization-forecasts"
              payload: { brief_id: "${b1}", annual_volume_kg: 1200, unit_price_cents_per_kg: 4200, expected_brief_version: "${b1_ver2}" }
              as: AccountManager
              captures: { fc: $.data.id, risk_value: $.data.weighted_annual_value_cents, risk_variant: $.data.variant_applied }
          trigger:
            - call: "POST /customer-briefs/${b1}/close"
              payload: { outcome: "WON" }
              as: AccountManager
          assert:
            - "${early_value} == 1247400 (RISK_WEIGHTED, stage 0.45 x technical 0.55, before any approval)"
            - "${risk_value} == 1814400 and ${risk_variant} == RISK_WEIGHTED (stage 0.45 x technical 0.80 once F1 is APPROVED)"
            - "CommercializationForecast.${fc_early}.status == SUPERSEDED and its weighted_annual_value_cents stays 1247400"
            - "CommercializationForecast.${fc}.variant_applied == COMMITTED"
            - "CommercializationForecast.${fc}.weighted_annual_value_cents == 5040000"
            - "CommercializationForecast.${fc}.stage_probability == 1.00"
            - "CommercializationForecast.${fc}.technical_factor == 1.00"
            - "CommercializationForecast.${fc}.status == REALIZED"
            - "CustomerBrief.${b1}.status == CLOSED_WON and CustomerBrief.${b1}.outcome == WON"

  - rule_id: combinatorial_formula
    instances:
      - name: bench_cost_rounds_per_component_line_before_summing
        grounds:
          - calculations.formula_bench_cost
          - entities.FormulaComponent.fields.contribution_cents
          - entities.Formula.fields.bench_cost_per_kg_cents
          - state_machines.Formula.DRAFT_to_COSTED
        distinguishing_aspect: |
          Mode (b) — pinned evaluation ORDER. The DAG walk prices each line and
          rounds it to whole cents BEFORE the summation, so 1699.9875 + 123.45 +
          1154.25 becomes 1700 + 123 + 1154 == 2977. Summing the unrounded
          products and rounding once at the end yields 2978, a value no correct
          implementation can produce.
        test_recipe:
          setup:
            - "Materials at 45333, 9876 and 1215 cents per kg; brief BRF-0001 ACCEPTED."
            - "Formula F1 in DRAFT with lines 3.7500% (seq 1), 1.2500% (seq 2), 95.0000% (seq 3) totalling exactly 100.0000."
          setup_api_calls:
            - call: "POST /raw-materials"
              payload: { material_code: "CITRAL-NAT", name: "Natural Citral", cost_per_kg_cents: 45333, natural_status: "NATURAL", potency_class: "HIGH_IMPACT", max_use_ppm: 50000 }
              as: PurchasingManager
              captures: { m1: $.data.id }
            - call: "POST /raw-materials"
              payload: { material_code: "ETHYL-BUT", name: "Ethyl Butyrate Natural", cost_per_kg_cents: 9876, natural_status: "NATURAL", potency_class: "STANDARD", max_use_ppm: 20000 }
              as: PurchasingManager
              captures: { m2: $.data.id }
            - call: "POST /raw-materials"
              payload: { material_code: "PG-SOLV", name: "Propylene Glycol Solvent", cost_per_kg_cents: 1215, natural_status: "NATURE_IDENTICAL", potency_class: "STANDARD", max_use_ppm: 1000000 }
              as: PurchasingManager
              captures: { m3: $.data.id }
            - call: "POST /customer-briefs"
              payload: { brief_code: "BRF-0001", customer_name: "Nordic Beverages", matrix_type: "BEVERAGE_STILL", target_profile: "CITRUS_TOP_NOTE", dosage_pct: 2.5, annual_volume_kg: 1200, cost_in_use_cap_cents_per_tonne: 74425, confidentiality_tier: "TIER_1_STANDARD" }
              as: AccountManager
              captures: { b1: $.data.id }
            - call: "POST /customer-briefs/${b1}/submit"
              payload: {}
              as: AccountManager
            - call: "POST /customer-briefs/${b1}/decision"
              payload: { decision: "ACCEPTED" }
              as: TechnicalDirector
            - call: "POST /formulas"
              payload: { brief_id: "${b1}", name: "Citrus Top Note F1" }
              as: Flavorist
              captures: { f1: $.data.id }
            - call: "POST /formulas/${f1}/components"
              payload: { component_type: "RAW_MATERIAL", raw_material_id: "${m1}", weight_pct: 3.75 }
              as: Flavorist
              captures: { c1: $.data.id }
            - call: "POST /formulas/${f1}/components"
              payload: { component_type: "RAW_MATERIAL", raw_material_id: "${m2}", weight_pct: 1.25 }
              as: Flavorist
              captures: { c2: $.data.id }
            - call: "POST /formulas/${f1}/components"
              payload: { component_type: "RAW_MATERIAL", raw_material_id: "${m3}", weight_pct: 95.0 }
              as: Flavorist
              captures: { c3: $.data.id }
          trigger:
            - call: "POST /formulas/${f1}/cost"
              payload: {}
              as: Flavorist
          assert:
            - "FormulaComponent.${c1}.contribution_cents == 1700 (45333 * 3.75 / 100 == 1699.9875, rounded half up per line)"
            - "FormulaComponent.${c2}.contribution_cents == 123 (9876 * 1.25 / 100 == 123.45)"
            - "FormulaComponent.${c3}.contribution_cents == 1154 (1215 * 95.0 / 100 == 1154.25)"
            - "Formula.${f1}.bench_cost_per_kg_cents == 2977"
            - "Formula.${f1}.bench_cost_per_kg_cents != 2978 (the sum-then-round result is rejected)"
            - "1700 + 123 + 1154 == 2977 — the stored line contributions reconcile exactly with the header"

      - name: production_fee_tier_selected_from_pre_fee_material_cost
        grounds:
          - calculations.production_cost
          - entities.ScaleUpBatch.fields.compounding_fee_pct
          - entities.ScaleUpBatch.fields.batch_total_cents
          - state_machines.ScaleUpBatch.REQUESTED_to_TOLERANCE_SET
          - validations[priority=48]
        distinguishing_aspect: |
          Mode (c) — a three-branch tiered ladder whose selector is the PRE-FEE
          material cost. 446550 sits under FEE_TIER_1_CEILING_CENTS (500000) so
          the 12.0% rate applies, and the resulting batch_total_cents 525136
          crosses that same ceiling without re-selecting the tier. Re-deriving the
          tier from the post-fee total gives 8.0% -> fee 35724 -> total 507274,
          a distinguishable wrong answer.
        test_recipe:
          setup:
            - "Brief BRF-0001 ACCEPTED and formula F1 APPROVED with bench_cost_per_kg_cents 2977."
            - "A scale-up batch requested for target_kg 150, still in REQUESTED, pinned to the current formula version."
          setup_api_calls:
            - call: "POST /raw-materials"
              payload: { material_code: "CITRAL-NAT", name: "Natural Citral", cost_per_kg_cents: 45333, natural_status: "NATURAL", potency_class: "HIGH_IMPACT", max_use_ppm: 50000 }
              as: PurchasingManager
              captures: { m1: $.data.id }
            - call: "POST /raw-materials"
              payload: { material_code: "ETHYL-BUT", name: "Ethyl Butyrate Natural", cost_per_kg_cents: 9876, natural_status: "NATURAL", potency_class: "STANDARD", max_use_ppm: 20000 }
              as: PurchasingManager
              captures: { m2: $.data.id }
            - call: "POST /raw-materials"
              payload: { material_code: "PG-SOLV", name: "Propylene Glycol Solvent", cost_per_kg_cents: 1215, natural_status: "NATURE_IDENTICAL", potency_class: "STANDARD", max_use_ppm: 1000000 }
              as: PurchasingManager
              captures: { m3: $.data.id }
            - call: "POST /customer-briefs"
              payload: { brief_code: "BRF-0001", customer_name: "Nordic Beverages", matrix_type: "BEVERAGE_STILL", target_profile: "CITRUS_TOP_NOTE", dosage_pct: 2.5, annual_volume_kg: 1200, cost_in_use_cap_cents_per_tonne: 74425, confidentiality_tier: "TIER_1_STANDARD" }
              as: AccountManager
              captures: { b1: $.data.id }
            - call: "POST /customer-briefs/${b1}/submit"
              payload: {}
              as: AccountManager
            - call: "POST /customer-briefs/${b1}/decision"
              payload: { decision: "ACCEPTED" }
              as: TechnicalDirector
            - call: "POST /formulas"
              payload: { brief_id: "${b1}", name: "Citrus Top Note F1" }
              as: Flavorist
              captures: { f1: $.data.id }
            - call: "POST /formulas/${f1}/components"
              payload: { component_type: "RAW_MATERIAL", raw_material_id: "${m1}", weight_pct: 3.75 }
              as: Flavorist
            - call: "POST /formulas/${f1}/components"
              payload: { component_type: "RAW_MATERIAL", raw_material_id: "${m2}", weight_pct: 1.25 }
              as: Flavorist
            - call: "POST /formulas/${f1}/components"
              payload: { component_type: "RAW_MATERIAL", raw_material_id: "${m3}", weight_pct: 95.0 }
              as: Flavorist
            - call: "POST /formulas/${f1}/cost"
              payload: {}
              as: Flavorist
            - call: "POST /formulas/${f1}/submit"
              payload: {}
              as: Flavorist
              as_user_id: "u_flav_1"
            - call: "POST /formulas/${f1}/decision"
              payload: { decision: "APPROVED" }
              as: TechnicalDirector
              as_user_id: "u_dir_1"
            - call: "POST /scale-up-batches"
              payload: { formula_id: "${f1}", target_kg: 150 }
              as: TechnicalDirector
              captures: { sb: $.data.id }
          trigger:
            - call: "POST /scale-up-batches/${sb}/tolerance"
              payload: {}
              as: TechnicalDirector
          assert:
            - "ScaleUpBatch.${sb}.material_cost_cents == 446550 (2977 * 150)"
            - "ScaleUpBatch.${sb}.compounding_fee_pct == 12.0 (selected because 446550 < 500000)"
            - "ScaleUpBatch.${sb}.compounding_fee_cents == 53586"
            - "ScaleUpBatch.${sb}.batch_total_cents == 525136 (446550 + 53586 + 25000)"
            - "ScaleUpBatch.${sb}.batch_total_cents > 500000 while compounding_fee_pct stays 12.0"
            - "ScaleUpBatch.${sb}.production_cost_per_kg_cents == 3501 (525136 / 150 == 3500.9066..., rounded half up)"
            - "ScaleUpBatch.${sb}.status == TOLERANCE_SET"

      - name: tolerance_band_nested_clamp_interaction
        grounds:
          - calculations.component_tolerance_band
          - entities.ScaleUpBatch.fields.tolerance_spec
          - entities.RawMaterial.fields.potency_class
          - entities.RawMaterial.fields.max_use_ppm
          - state_machines.ScaleUpBatch.REQUESTED_to_TOLERANCE_SET
        distinguishing_aspect: |
          Mode (a) — four interacting inputs (weight_pct, potency_class, target_kg
          band and max_use_ppm headroom) funnelled through two nested max() and two
          nested min() clamps, producing three DIFFERENT band widths in one call:
          0.0300 (relative x HIGH_IMPACT 0.5 x SCALE_FACTOR_MID 0.8), 0.0200
          (relative x 1.0 x 0.8) and 1.0000 (MAX_BAND_PCT clamp beating the
          geometric 1.5200 while the 5.0000 headroom does not bind).
        test_recipe:
          setup:
            - "Same three materials, brief BRF-0001 ACCEPTED, formula F1 APPROVED with lines 3.7500 / 1.2500 / 95.0000."
            - "CITRAL-NAT is HIGH_IMPACT with max_use_ppm 50000 (5.0000 pct ceiling); PG-SOLV is STANDARD with max_use_ppm 1000000 (100.0000 pct ceiling)."
            - "A scale-up batch for target_kg 150, which lands in the 100..999 kg SCALE_FACTOR_MID band, in status REQUESTED."
          setup_api_calls:
            - call: "POST /raw-materials"
              payload: { material_code: "CITRAL-NAT", name: "Natural Citral", cost_per_kg_cents: 45333, natural_status: "NATURAL", potency_class: "HIGH_IMPACT", max_use_ppm: 50000 }
              as: PurchasingManager
              captures: { m1: $.data.id }
            - call: "POST /raw-materials"
              payload: { material_code: "ETHYL-BUT", name: "Ethyl Butyrate Natural", cost_per_kg_cents: 9876, natural_status: "NATURAL", potency_class: "STANDARD", max_use_ppm: 20000 }
              as: PurchasingManager
              captures: { m2: $.data.id }
            - call: "POST /raw-materials"
              payload: { material_code: "PG-SOLV", name: "Propylene Glycol Solvent", cost_per_kg_cents: 1215, natural_status: "NATURE_IDENTICAL", potency_class: "STANDARD", max_use_ppm: 1000000 }
              as: PurchasingManager
              captures: { m3: $.data.id }
            - call: "POST /customer-briefs"
              payload: { brief_code: "BRF-0001", customer_name: "Nordic Beverages", matrix_type: "BEVERAGE_STILL", target_profile: "CITRUS_TOP_NOTE", dosage_pct: 2.5, annual_volume_kg: 1200, cost_in_use_cap_cents_per_tonne: 74425, confidentiality_tier: "TIER_1_STANDARD" }
              as: AccountManager
              captures: { b1: $.data.id }
            - call: "POST /customer-briefs/${b1}/submit"
              payload: {}
              as: AccountManager
            - call: "POST /customer-briefs/${b1}/decision"
              payload: { decision: "ACCEPTED" }
              as: TechnicalDirector
            - call: "POST /formulas"
              payload: { brief_id: "${b1}", name: "Citrus Top Note F1" }
              as: Flavorist
              captures: { f1: $.data.id }
            - call: "POST /formulas/${f1}/components"
              payload: { component_type: "RAW_MATERIAL", raw_material_id: "${m1}", weight_pct: 3.75 }
              as: Flavorist
              captures: { c1: $.data.id }
            - call: "POST /formulas/${f1}/components"
              payload: { component_type: "RAW_MATERIAL", raw_material_id: "${m2}", weight_pct: 1.25 }
              as: Flavorist
              captures: { c2: $.data.id }
            - call: "POST /formulas/${f1}/components"
              payload: { component_type: "RAW_MATERIAL", raw_material_id: "${m3}", weight_pct: 95.0 }
              as: Flavorist
              captures: { c3: $.data.id }
            - call: "POST /formulas/${f1}/cost"
              payload: {}
              as: Flavorist
            - call: "POST /formulas/${f1}/submit"
              payload: {}
              as: Flavorist
              as_user_id: "u_flav_1"
            - call: "POST /formulas/${f1}/decision"
              payload: { decision: "APPROVED" }
              as: TechnicalDirector
              as_user_id: "u_dir_1"
            - call: "POST /scale-up-batches"
              payload: { formula_id: "${f1}", target_kg: 150 }
              as: TechnicalDirector
              captures: { sb: $.data.id }
          trigger:
            - call: "POST /scale-up-batches/${sb}/tolerance"
              payload: {}
              as: TechnicalDirector
          assert:
            - "ScaleUpBatch.${sb}.tolerance_spec has exactly 3 entries, ordered by sequence_no ASC"
            - "the entry for component_id ${c1} has weight_pct 3.7500 and band_pct == 0.0300"
            - "the entry for component_id ${c2} has weight_pct 1.2500 and band_pct == 0.0200"
            - "the entry for component_id ${c3} has weight_pct 95.0000 and band_pct == 1.0000 (geometric 1.5200 clamped by MAX_BAND_PCT, not by the 5.0000 headroom)"
            - "the three band widths are pairwise different, so a single hard-coded band cannot satisfy the assertion set"

  - rule_id: non_linear_state_machine
    instances:
      - name: sample_lot_qc_and_disposition_dimensions_advance_independently
        grounds:
          - state_machines.SampleLot.PENDING_to_PASSED
          - state_machines.SampleLot.PENDING_to_FAILED
          - state_machines.SampleLot.HELD_to_RELEASED
          - state_machines.SampleLot.HELD_to_SCRAPPED
          - entities.SampleLot.fields.qc_status
          - entities.SampleLot.fields.disposition_status
          - calculations.lot_number_minting
