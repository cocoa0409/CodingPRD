  # =========================================================================
  - section: validations
    instances:

      - name: missing_headers_returns_unauthenticated
        claim_type: Violation to Error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A POST /customers sent with neither X-User-Role nor X-User-ID returns HTTP 401 with ERR_UNAUTHENTICATED, decided before any body validation."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: {}
              captures: { err: $.data.error_id }
          assert:
            - "the request is sent with no X-User-Role and no X-User-ID header"
            - "HTTP status is 401"
            - "data.error_id == ERR_UNAUTHENTICATED"
            - "data.error_id is NOT ERR_INVALID_REQUEST even though the body is empty"

      - name: unauthorized_role_outranks_not_found_on_missing_path_resource
        claim_type: Priority Ordering
        grounds:
          - validations[priority=2]
          - validations[priority=4]
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_BLEND_BATCH_NOT_FOUND]
        distinguishing_aspect: "Error-category pair auth (priority 2) versus existence (priority 4): a SalesRep calling POST /blend-batches/{unknown}/release gets ERR_UNAUTHORIZED (403), not ERR_BLEND_BATCH_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /blend-batches/00000000-0000-4000-8000-000000000000/release"
              payload: {}
              as: SalesRep
              as_user_id: "sr-001"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 403"
            - "data.error_id == ERR_UNAUTHORIZED"
            - "data.error_id is NOT ERR_BLEND_BATCH_NOT_FOUND"

      - name: duplicate_tank_code_rejected
        claim_type: Violation to Error
        grounds:
          - validations[priority=34]
          - errors[ERR_DUPLICATE_CODE]
          - entities.BlendTank.fields.tank_code
        distinguishing_aspect: "A second POST /blend-tanks reusing tank_code TK-01 returns HTTP 409 ERR_DUPLICATE_CODE and leaves exactly one tank on file."
        test_recipe:
          setup: ["Logical clock at 2026-08-02T06:00:00Z; BlendTank TK-01 exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T06:00:00Z" }
              as: PlatformAdmin
