            - call: "POST /media-assets"
              payload: { episode_id: "${epX}", source_filename: "x.wav", source_duration_ms: 400000 }
              as: Publisher
              as_user_id: "${pubX}"
              captures: { maX: $.data.id }
            - call: "POST /media-assets/${maX}/transcode-start"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /media-assets/${maX}/transcode-result"
              payload: { outcome: "SUCCESS", output_duration_ms: 400000 }
              as: PlatformAdmin
          assert:
            - "Episode.${epX}.publish_status == SCHEDULED"
            - "Episode.${epX}.media_status == READY"

