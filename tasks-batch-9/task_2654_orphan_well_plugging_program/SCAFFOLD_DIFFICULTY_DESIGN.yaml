      - name: site_access_notice_window_is_closed_so_touching_requests_conflict
        grounds:
          - validations[priority=58]
          - errors.ERR_ACCESS_WINDOW_CONFLICT
          - entities.SiteAccess.fields.window_end_at
          - state_machines.SiteAccess.REQUESTED_to_DENIED
          - state_machines.Well.ACCESS_DENIED_to_ACCESS_PENDING
        distinguishing_aspect: |
          A well's statutory notice window [notice_sent_at, window_end_at] is CLOSED at both ends and
          has capacity 1 per well, so a second request whose notice_sent_at falls exactly on the first
          request's window_end_at (2026-09-09T00:00:00Z) IS rejected - the opposite endpoint semantics
          from the half-open contractor crew interval, on a different entity and error.
        test_recipe:
          setup:
            - "Operator 'Cypress Bayou Minerals' with Well 22-001-01300"
            - "logical clock advanced to 2026-08-10T00:00:00Z, then one SiteAccess created with mode STATUTORY_ENTRY and waiting_period_days 30, so its window is [2026-08-10T00:00:00Z, 2026-09-09T00:00:00Z] and Well.access_status == ACCESS_PENDING"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Cypress Bayou Minerals", region_code: "LA", financial_assurance_tier: "INDIVIDUAL", bond_amount_cents: 5000000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "22-001-01300", operator_id: "${op_id}", spud_year: 1979, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /wells/${w_id}/site-accesses"
              payload: { surface_owner_name: "Renard Boudreaux", mode: "STATUTORY_ENTRY", waiting_period_days: 30, compensation_cents: 0 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { sa1_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /wells/${w_id}/site-accesses"
              payload: { surface_owner_name: "Renard Boudreaux Estate", mode: "STATUTORY_ENTRY", waiting_period_days: 30, compensation_cents: 0 }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /site-accesses/${sa1_id}/resolution"
              payload: { outcome: "DENY" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /wells/${w_id}/site-accesses"
              payload: { surface_owner_name: "Renard Boudreaux Estate", mode: "STATUTORY_ENTRY", waiting_period_days: 30, compensation_cents: 0 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { sa2_id: $.data.id }
          assert:
            - "SiteAccess.${sa1_id}.notice_sent_at == 2026-08-10T00:00:00Z and window_end_at == 2026-09-09T00:00:00Z"
            - "the first second-request attempt returns HTTP 409 with error_id ERR_ACCESS_WINDOW_CONFLICT (the closed windows share the instant 2026-09-09T00:00:00Z)"
            - "after the rejected call exactly one SiteAccess exists for Well.${w_id} and Well.${w_id}.access_status == ACCESS_PENDING"
            - "the DENY returns HTTP 200; SiteAccess.${sa1_id}.status == DENIED, resolved_at == 2026-09-09T00:00:00Z, and Well.${w_id}.access_status == ACCESS_DENIED"
            - "the second attempt after the denial returns HTTP 201; SiteAccess.${sa2_id}.notice_sent_at == 2026-09-09T00:00:00Z, window_end_at == 2026-10-09T00:00:00Z, and Well.${w_id}.access_status == ACCESS_PENDING"

  - rule_id: compensating_invariant
    instances:
      - name: deobligation_restores_funding_source_committed_cents_exactly
        grounds:
          - calculations.job_funding_waterfall
          - state_machines.FundingAllocation.COMMITTED_to_DEOBLIGATED
          - state_machines.FundingSource.EXHAUSTED_to_ACTIVE
          - entities.FundingSource.fields.committed_cents
          - entities.PluggingJob.fields.funded_cents
        distinguishing_aspect: |
          After committing 1000000 / 1500000 / 3570196 cents, deobligating the rank-1 forfeited-bond
          allocation returns FundingSource.committed_cents to exactly 0 - its byte-identical
          pre-commitment value - flips the source EXHAUSTED -> ACTIVE, and lowers
          PluggingJob.funded_cents to exactly 5070196, while the federal and state allocations are
          untouched; the money invariant sum(FundingSource.committed_cents) ==
          sum(allocated_cents of non-DEOBLIGATED allocations) holds before and after.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default"
            - "a SCHEDULED PluggingJob with plugging_cost_estimate_cents 6070196 on an ORPHAN_CONFIRMED well of operator OP"
            - "three ACTIVE FundingSources allowing PLUGGING: FORFEITED_BOND 1000000 tied to OP, FEDERAL_GRANT 10000000 at 40 percent match, STATE_FUND 10000000; all with committed_cents 0"
