        as: ProgramManager
      - call: POST /streetlights/salvage-batches/${batch}/items
        payload:
          salvage_item_id: ${it2}
          weight_lbs: 105.5
          mercury_flag: false
        as: ProgramManager
      - call: POST /streetlights/salvage-batches/${batch}/items
        payload:
          salvage_item_id: ${it3}
          weight_lbs: 50.5
          mercury_flag: false
        as: ProgramManager
      - call: POST /streetlights/salvage-batches/${batch}/seal
        payload:
          contaminated_flag: false
        as: ComplianceOfficer
      trigger:
      - call: POST /streetlights/salvage-batches/${batch}/manifest
        payload: {}
        as: ComplianceOfficer
      assert:
      - 'SalvageBatch.${batch}.settlement_value_cents == 11976   # 4293 + 7385 + 4798 - 4500'
      - 'SalvageBatch.${batch}.settlement_value_cents != 11975   # sum-then-round order is FORBIDDEN (it would give 16475 - 4500)'
      - SalvageBatch.${batch}.status == MANIFESTED AND manifest_code == MF-BATCH-1
      - SalvageBatch.${batch}.total_weight_lbs == 206.5 AND item_count == 3
