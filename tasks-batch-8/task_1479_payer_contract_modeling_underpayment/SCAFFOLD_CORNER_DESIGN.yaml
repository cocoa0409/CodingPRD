              payload: { name: "Payer SP", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/network-agreements"
              payload: { payer_id: "${payer_id}", network_name: "WrapS", wrap_rate_bp: 5000, precedence_rank: 1, effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-SP1", patient_account_number: "PA-SP1", service_category: "LAB", admission_date: "2026-06-01", discharge_date: "2026-06-01", total_billed_charges_cents: 100000 }
              as: RevenueIntegrityAnalyst
              captures: { claim_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/lines"
              payload: { revenue_code: "0300", service_date: "2026-06-01", charge_cents: 100000, units: 1 }
              as: RevenueIntegrityAnalyst
          trigger:
            - call: "POST /api/claims/${claim_id}/price"
              as: RevenueIntegrityAnalyst
              captures: { exp: $.data.expected_reimbursement_cents, nf: $.data.network_flag, pc: $.data.priced_contract_id }
          assert:
            - "Claim.${claim_id}.network_flag == SILENT_PPO_SUSPECT (${nf})"
            - "Claim.${claim_id}.expected_reimbursement_cents == 100000 (full billed) (${exp})"
            - "Claim.${claim_id}.priced_contract_id is null (${pc})"

      - name: calc_out_of_network_pays_full_billed
        claim_type: correct_result
        grounds: [calculations.pricing_contract_resolution, entities.Claim.fields.network_flag]
        distinguishing_aspect: "With no covering contract and no agreement of any status in window, resolution step 4 yields OUT_OF_NETWORK and expected == total_billed_charges_cents."
        test_recipe:
          setup: ["payer P with no contracts and no agreements; claim CL-ON1 billed 100000, one line"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer ON", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
