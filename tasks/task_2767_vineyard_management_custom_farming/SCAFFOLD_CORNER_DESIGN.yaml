      - name: parallel_axes_of_work_order_move_independently
        claim_type: parallel
        excluded_because:
          difficulty_instance: work_order_payroll_axis_advances_independently_of_execution_axis
          rationale: "The §1.8 instance already walks both WorkOrder state dimensions against each other and asserts the combined (CANCELLED, APPROVED) state, which is exactly the parallel-shape claim; repeating it here would duplicate the same chain."

      - name: spray_apply_cascade_down_to_scheduled_work_orders
        claim_type: cascade_down
        excluded_because:
          difficulty_instance: spray_apply_cascades_five_levels_to_plan_posture
          rationale: "The §1.8 transitive_cascade instance already verifies the parent-to-children cascade end to end (SprayRecord -> Block -> WorkOrder -> FarmingPlan.committed_cost -> budget_posture) and asserts that only non-terminal SCHEDULED children are touched."

      - name: harvest_receipt_ledger_sync_to_contract
        claim_type: ledger_sync
        excluded_because:
          difficulty_instance: harvest_receive_cascades_four_levels_to_projected_billable
          rationale: "The §1.8 instance already reconciles the ancestor's derived fields before and after receipt (Block harvest ledger -> accrued_quality_incentive -> projected_total_billable), which is the ledger-sync claim in full."

      - name: work_order_cancellation_compensates_plan_ledger
        claim_type: compensation
        excluded_because:
          difficulty_instance: plan_committed_cost_returns_to_baseline_after_create_then_cancel
          rationale: "The §1.8 compensating_invariant instance already shows create-then-cancel returning committed_cost, remaining_budget and budget_posture to their exact baseline with no drift."

  - section: calculations
    instances:
      - name: block_geometry_applies_sq_ft_per_acre_constant
        claim_type: constants_applied
        grounds:
          - calculations.block_vine_geometry
          - entities.Block.fields.vine_count
          - entities.Block.fields.vines_per_acre
        distinguishing_aspect: "vines_per_acre comes from the SQ_FT_PER_ACRE constant 43560 divided by the spacing product and floored: 6.0 x 10.0 ft gives floor(43560 / 60) = 726 vines_per_acre and floor(726 * 4.0) = 2904 vine_count, not 2904.0 or a rounded 727-based figure."
        test_recipe:
          setup:
            - "Vineyard Ridgecrest Ranch exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /vineyards"
              payload: { name: "Ridgecrest Ranch", owner_legal_name: "Ridgecrest Vineyards LLC", ava_region: "Paso Robles", client_contact_email: "ops@ridgecrest.example" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { v1_id: $.data.id }
          trigger:
            - call: "POST /blocks"
              payload: { vineyard_id: "${v1_id}", block_code: "B-30", variety: "PINOT_NOIR", clone: "FPS-23", rootstock: "ROOTSTOCK_SO4", trellis_system: "VSP", planting_year: 2024, vine_spacing_ft: 6.0, row_spacing_ft: 10.0, acres: 4.0 }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { b_id: $.data.id, b_vpa: $.data.vines_per_acre, b_vines: $.data.vine_count }
          assert:
            - "HTTP status is 201"
            - "Block.${b_id}.vines_per_acre == 726"
            - "Block.${b_id}.vine_count == 2904"
            - "Block.${b_id}.farming_status == ESTABLISHING"
            - "Block.${b_id}.season_applied_inches == 0.000"

