            - { call: "POST /submissions/${sub_id}/submit", payload: {}, as: CompAnalyst, as_user_id: "${analyst_id}" }
            - { call: "POST /surveys/${survey_id}/close", payload: {}, as: VendorAdmin }
            - { call: "POST /surveys/${survey_id}/accept", payload: {}, as: VendorAdmin }
            - { call: "POST /surveys/${survey_id}/matches", payload: { job_id: "${job_id}", benchmark_id: "${bench_id}", match_confidence: "HIGH", match_weight_pct: 100, proposed_by_employee_id: "${analyst_id}" }, as: CompAnalyst, as_user_id: "${analyst_id}", captures: { match_id: $.data.id } }
            - { call: "POST /matches/${match_id}/review", payload: {}, as: CompManager, as_user_id: "${mgr_id}" }
            - { call: "POST /matches/${match_id}/approve", payload: {}, as: CompManager, as_user_id: "${mgr_id}" }
            - { call: "POST /jobs/${job_id}/composites", payload: { strategy_policy_id: "${strat_id}", job_geo_code: "US-SF" }, as: CompManager, as_user_id: "${mgr_id}", captures: { comp1_id: $.data.id } }
            - { call: "POST /composites/${comp1_id}/recompute", payload: {}, as: CompManager, as_user_id: "${mgr_id}" }
            - { call: "GET /jobs/${job_id}", payload: {}, as: CompManager, as_user_id: "${mgr_id}", captures: { job_v1: $.data.version } }
            - { call: "POST /composites/${comp1_id}/publish", payload: { expected_job_version: "${job_v1}" }, as: CompManager, as_user_id: "${mgr_id}" }
            # At this point: count(PUBLISHED for job+strategy) == 1 (C1)
            - { call: "POST /jobs/${job_id}/composites", payload: { strategy_policy_id: "${strat_id}", job_geo_code: "US-SF" }, as: CompManager, as_user_id: "${mgr_id}", captures: { comp2_id: $.data.id } }
            - { call: "POST /composites/${comp2_id}/recompute", payload: {}, as: CompManager, as_user_id: "${mgr_id}" }
            - { call: "GET /jobs/${job_id}", payload: {}, as: CompManager, as_user_id: "${mgr_id}", captures: { job_v2: $.data.version } }
          trigger:
            - { call: "POST /composites/${comp2_id}/publish", payload: { expected_job_version: "${job_v2}" }, as: CompManager, as_user_id: "${mgr_id}" }
            - { call: "GET /jobs/${job_id}/composites", payload: {}, as: CompManager, as_user_id: "${mgr_id}" }
          assert:
            - "MarketComposite.${comp1_id}.status == SUPERSEDED"
            - "MarketComposite.${comp2_id}.status == PUBLISHED"
            - "count of composites with status==PUBLISHED for job ${job_id} == 1 (invariant preserved)"

      - name: cycle_allocated_cents_invariant
        grounds:
          - calculations.cycle_allocation
          - state_machines.MarketAdjustment.PENDING_APPROVAL_to_APPROVED
          - state_machines.MarketAdjustment.APPROVED_to_APPLIED
        distinguishing_aspect: |
          Conserved quantity: cycle.allocated_cents == sum of proposed_amount_cents
          over child adjustments in {APPROVED, APPLIED}. Forward action: approve
          (+X, enters APPROVED). Compensating action: apply (APPROVED→APPLIED,
          still in the conserved set, so sum unchanged). Different quantity
          (cents) from the composite-count invariant.
        test_recipe:
          setup:
            - "Cycle with budget 1000000; two adjustments A1 (100000) and A2 (50000) approved and applied"
            - "Initial allocated_cents = 0; after approve A1 → 100000; after approve A2 → 150000"
            - "Apply A1 and A2 — allocated_cents remains 150000 (APPLIED still counted)"
          setup_api_calls:
            - { call: "POST /orgs", payload: { name: "Acme", base_currency: "USD", market_as_of_date: "2026-08-01" }, as: VendorAdmin, captures: { org_id: $.data.id } }
