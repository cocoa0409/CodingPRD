              payload: { outcome: "WAITLIST", expected_event_version: "${ev_v1}" }
              as: EventCoordinator
            - call: "POST /maker-events/${ev_id}/begin-scheduling"
              payload: {}
              as: EventCoordinator
          trigger:
            - call: "GET /maker-events/${ev_id}"
              payload: {}
