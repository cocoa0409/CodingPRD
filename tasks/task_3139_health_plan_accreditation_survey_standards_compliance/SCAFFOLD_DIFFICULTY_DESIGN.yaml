              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/applications/${app_id}/advance-to-survey-scheduling"
              payload: {}
              as: AccreditationOfficer
          assert:
            - "first advance: status 422, error_id == ERR_EVIDENCE_COMPLETENESS_UNMET (UM-1 has only 1 ACCEPTED of 2 required; the REJECTED item does not count)"
            - "after resubmit + accept of ev2: advance succeeds and AccreditationApplication.${app_id}.status == SURVEY_SCHEDULING"

