              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { so: $.data.id }
            - call: "POST /test-attempts"
              payload: { student_id: "${so}", administration_id: "${adm}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { att_o: $.data.id }
            - call: "POST /test-attempts/${att_o}/check-in"
              payload: {}
              as: Proctor
              as_user_id: "proctor-1"
            - call: "POST /test-attempts/${att_o}/score"
