      - name: committee_activation_transitions_forming_to_active
        claim_type: valid_transition
        grounds:
          - state_machines[TechnicalCommittee].FORMING_to_ACTIVE
          - endpoints[POST /sdo/committees/{committeeId}/activate]
        distinguishing_aspect: "The declared FORMING -> ACTIVE edge fires once the chair holds an ACTIVE seat and voting-basis balance is BALANCED; the response carries status ACTIVE and the recomputed balance counters."
