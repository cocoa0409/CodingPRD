              as: Authenticator
              as_user_id: "auth-001"
              captures: { e_sod: "$.data.error_id" }
            - call: "POST /recommerce/trade-ins/${ti_id}/authenticate"
              payload: { authenticity_result: "GENUINE", assessed_grade: "B" }
              as: Authenticator
              as_user_id: "auth-002"
              captures: { st2: "$.data.status", grade2: "$.data.assessed_grade", grader2: "$.data.graded_by_user_id", quote2: "$.data.appraised_credit_minor", appeals2: "$.data.appeal_count" }
            - call: "POST /recommerce/trade-ins/${ti_id}/appeal"
              payload: { appeal_reason: "still unhappy" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { e_limit: "$.data.error_id" }
          assert:
            - "${st_appealed} == APPEALED and ${appeals1} == 1"
            - "${e_sod} == ERR_SEGREGATION_OF_DUTIES  # HTTP 409; ${grader1} == auth-001 may not re-grade its own call"
            - "${st2} == AUTHENTICATED and ${grade2} == B and ${grader2} == auth-002"
            - "${quote2} == ${quote} == 46200  # /authenticate never recomputes appraised_credit_minor, so the grade-A quote survives the re-grade to B"
            - "${appeals2} == 1 and ${e_limit} == ERR_APPEAL_LIMIT_EXCEEDED  # HTTP 409, APPEAL_LIMIT is 1"
            - "TradeIn.${ti_id}.version > ${ver_appealed}"

      - name: reject_disposition_side_effect_set_is_disjoint_from_accept
        claim_type: side_effect_execution
        grounds:
          - state_machines.TradeIn.transitions[AUTHENTICATED -> REJECTED]
