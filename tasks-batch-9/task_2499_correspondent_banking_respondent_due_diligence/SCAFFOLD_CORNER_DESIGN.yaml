              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
            - call: "POST /correspondent-banking/respondents/${r_b_id}/licensing-verification"
              payload: { license_status: "ACTIVE", regulator_standing: "GOOD_STANDING", regulator_name: "BaFin" }
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
            - call: "POST /correspondent-banking/respondents/${r_a_id}/nested-relationships"
              payload: { downstream_institution_name: "B Bank AG", downstream_jurisdiction_code: "DE", relationship_type: "DOWNSTREAM_CORRESPONDENT", discovery_source: "QUESTIONNAIRE", downstream_respondent_bank_id: "${r_b_id}" }
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
              captures: { nr_a: $.data.id }
          trigger:
            - call: "POST /correspondent-banking/respondents/${r_b_id}/nested-relationships"
              payload: { downstream_institution_name: "A Bank AG", downstream_jurisdiction_code: "DE", relationship_type: "PAYABLE_THROUGH", discovery_source: "QUESTIONNAIRE", downstream_respondent_bank_id: "${r_a_id}" }
              as: RespondentContact
