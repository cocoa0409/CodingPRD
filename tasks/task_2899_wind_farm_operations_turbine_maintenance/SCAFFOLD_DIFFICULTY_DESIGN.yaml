  - rule_id: boundary_precision_check
    instances:
      - name: service_due_gate_and_tolerance_breach_walk_four_exact_operating_hour_boundaries
        grounds:
          - calculations.scheduled_service_due
          - validations[priority=75]
          - errors.ERR_SERVICE_NOT_DUE
          - entities.Turbine.fields.service_due_operating_hours
          - entities.Turbine.fields.service_due_flag
          - entities.Turbine.fields.service_interval_breached
          - endpoints.POST_/wind-ops/turbines/{id}/scada-sync
        distinguishing_aspect: |
          Three separate comparisons sit one tenth of an hour apart and use two different
          operators. The creation gate is inclusive at exactly 3800.0 (due 4000 minus the 200-hour
          pre-service window) and refuses 3799.0; service_due_flag is inclusive at exactly 4000.0;
          service_interval_breached is STRICT, so 4250.0 (due plus 250 tolerance) is not yet
          breached and 4250.1 is. Using > for the gate or >= for the breach fails a different one
          of the four probes.
        test_recipe:
          setup:
            - "one turbine model with service_interval_hours 4000 and service_interval_tolerance_hours 250"
            - "one ONLINE turbine created with operating_hours 3799.0 and last_service_operating_hours 0, so service_due_operating_hours is 4000 and the earliest creation point is 3800.0"
            - "the logical clock reads 2026-08-01T00:00:00Z, the mandatory default"
          setup_api_calls:
            - call: "POST /wind-ops/farms"
              payload: { name: "Table Mesa", region_code: "CO-E", grid_operator_code: "PSCO", landowner_budget_cap_cents: 500000000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { farm_id: $.data.id }
            - call: "POST /wind-ops/turbine-models"
              payload: { model_code: "V150-4.2", rated_power_kw: 4200, hub_height_m: 105, rotor_diameter_m: 150, service_interval_hours: 4000, service_interval_tolerance_hours: 250, gearbox_lead_time_days: 210, blade_lead_time_days: 150, generator_lead_time_days: 120 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { model_id: $.data.id }
            - call: "POST /wind-ops/farms/${farm_id}/turbines"
              payload: { turbine_model_id: "${model_id}", asset_tag: "T-01", commissioning_date: "2024-03-15", expected_kwh_per_hour: 2000, operating_hours: 3799.0, last_service_operating_hours: 0 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { t1_id: $.data.id }
          trigger:
            - call: "POST /wind-ops/work-orders"
              payload: { turbine_id: "${t1_id}", work_type: "SCHEDULED_SERVICE", required_certification: "GWO_BASIC", estimated_hours: 6 }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { err_too_early: $.data.error_id }
            - call: "POST /wind-ops/turbines/${t1_id}/scada-sync"
              payload: { operating_hours_delta: 1.0, actual_energy_kwh: 2000, potential_energy_kwh: 2000 }
              as: ControlRoomOperator
              as_user_id: "ops-1"
            - call: "POST /wind-ops/work-orders"
