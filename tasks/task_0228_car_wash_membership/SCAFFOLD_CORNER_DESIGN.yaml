# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7. Sections / claim_types come from
# references/claim-extraction-guide.md. excluded_because stubs cite §1.8 by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_account_individual_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Account.fields.status, endpoints]
        distinguishing_aspect: "POST /accounts with account_type=INDIVIDUAL + contact_email returns 201; status defaults to ACTIVE, wallet_balance_cents to 0, version to 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { account_type: "INDIVIDUAL", contact_email: "new@x.com" }
              as: AccountHolder
              captures: { acct: "$.data.id" }
          assert:
            - "HTTP 201; Account.${acct}.status == ACTIVE"
            - "Account.${acct}.wallet_balance_cents == 0"
            - "Account.${acct}.version == 1"

      - name: create_account_fleet_missing_company_name_invalid_request
        claim_type: Required Fields
        grounds: ["validations[priority=6]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /accounts with account_type=FLEET but no company_name -> ERR_INVALID_REQUEST (422) per priority 6 conditional requirement."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { account_type: "FLEET", contact_email: "fleet@x.com" }
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422; error_id == ERR_INVALID_REQUEST"

      - name: get_account_nonexistent_not_found
        claim_type: Not Found
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /accounts/{id} with a random non-existent UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /accounts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404; error_id == ERR_NOT_FOUND"

      - name: create_membership_unknown_plan_fk_not_found
        claim_type: Parent Relationships
        grounds: ["validations[priority=4]", "errors[ERR_FK_NOT_FOUND]", entities.Membership.fields.plan_id]
        distinguishing_aspect: "POST /memberships referencing a non-existent plan_id -> ERR_FK_NOT_FOUND (404), distinct from a path 404."
        test_recipe:
          setup: ["An INDIVIDUAL account with one vehicle exists; no such plan id."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_type: "INDIVIDUAL", contact_email: "fk@x.com" }
              as: AccountHolder
              captures: { acct: "$.data.id" }
            - call: "POST /accounts/${acct}/vehicles"
              payload: { license_plate: "FKK001", state_code: "CA" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { veh: "$.data.id" }
          trigger:
            - call: "POST /memberships"
              payload: { account_id: "${acct}", vehicle_id: "${veh}", plan_id: "00000000-0000-4000-8000-000000000001" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404; error_id == ERR_FK_NOT_FOUND"

      - name: plan_shape_single_wash_nonzero_fee_rejected
        claim_type: Type Constraints
        grounds: ["validations[priority=12]", "errors[ERR_PLAN_SHAPE_INVALID]"]
        distinguishing_aspect: "POST /plans with tier_type=SINGLE_WASH but monthly_fee_cents=500 (must be 0) -> ERR_PLAN_SHAPE_INVALID (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /plans"
              payload: { name: "BadSingle", tier_type: "SINGLE_WASH", monthly_fee_cents: 500, included_credits: 1, per_credit_price_cents: 1200, wash_cooldown_hours: 0, max_addons: 0 }
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422; error_id == ERR_PLAN_SHAPE_INVALID"

      - name: wash_event_system_fields_ignored_on_input
        claim_type: System Fields
        grounds: [entities.WashEvent.fields.status, entities.WashEvent.fields.consumed_credit]
        distinguishing_aspect: "POST /wash-events only accepts location_id, license_plate, state_code; status/consumed_credit/admitted_at_utc are server-set and any client-supplied value is rejected as an unknown field per priority 5."
        test_recipe:
          setup: ["ACTIVE UNLIMITED membership for plate SYS001 at an OPEN in-network location."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { name: "USys", tier_type: "UNLIMITED", monthly_fee_cents: 3000, included_credits: 0, wash_cooldown_hours: 0, max_addons: 3 }
              as: PlatformAdmin
              captures: { plan_u: "$.data.id" }
            - call: "POST /locations"
              payload: { name: "SysSite", state_code: "CA", daily_wash_capacity: 50, in_network: true }
              as: PlatformAdmin
              captures: { loc: "$.data.id" }
            - call: "POST /accounts"
              payload: { account_type: "INDIVIDUAL", contact_email: "sys@x.com" }
              as: AccountHolder
              captures: { acct: "$.data.id" }
            - call: "POST /accounts/${acct}/vehicles"
              payload: { license_plate: "SYS001", state_code: "CA" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { veh: "$.data.id" }
            - call: "POST /memberships"
              payload: { account_id: "${acct}", vehicle_id: "${veh}", plan_id: "${plan_u}" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { mem: "$.data.id" }
            - call: "GET /invoices"
              payload: { membership_id: "${mem}", kind: "CYCLE" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { inv0: "$.data[0].id" }
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /wash-events"
              payload: { location_id: "${loc}", license_plate: "SYS001", state_code: "CA", status: "ADMITTED" }
              as: LocationOperator
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422; error_id == ERR_INVALID_REQUEST (client cannot set the server-managed status field)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_already_cancel_scheduled_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Membership.ACTIVE_to_CANCEL_SCHEDULED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second POST /memberships/{id}/cancel on a membership already in CANCEL_SCHEDULED -> ERR_INVALID_STATE (409); no second refund is written."
        test_recipe:
          setup: ["ACTIVE UNLIMITED membership cancelled once (now CANCEL_SCHEDULED)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { name: "UCan", tier_type: "UNLIMITED", monthly_fee_cents: 3000, included_credits: 0, wash_cooldown_hours: 0, max_addons: 3 }
              as: PlatformAdmin
              captures: { plan_u: "$.data.id" }
            - call: "POST /accounts"
              payload: { account_type: "INDIVIDUAL", contact_email: "can@x.com" }
              as: AccountHolder
              captures: { acct: "$.data.id" }
            - call: "POST /accounts/${acct}/vehicles"
              payload: { license_plate: "CAN001", state_code: "CA" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { veh: "$.data.id" }
            - call: "POST /memberships"
              payload: { account_id: "${acct}", vehicle_id: "${veh}", plan_id: "${plan_u}" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { mem: "$.data.id" }
            - call: "GET /invoices"
              payload: { membership_id: "${mem}", kind: "CYCLE" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { inv0: "$.data[0].id" }
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /memberships/${mem}/cancel"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct}"
          trigger:
            - call: "POST /memberships/${mem}/cancel"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE"

      - name: unfreeze_active_membership_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Membership.FROZEN_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /memberships/{id}/unfreeze on an ACTIVE (not FROZEN) membership -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["ACTIVE UNLIMITED membership (never frozen)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { name: "UUnf", tier_type: "UNLIMITED", monthly_fee_cents: 3000, included_credits: 0, wash_cooldown_hours: 0, max_addons: 3 }
              as: PlatformAdmin
              captures: { plan_u: "$.data.id" }
            - call: "POST /accounts"
              payload: { account_type: "INDIVIDUAL", contact_email: "unf@x.com" }
              as: AccountHolder
              captures: { acct: "$.data.id" }
            - call: "POST /accounts/${acct}/vehicles"
              payload: { license_plate: "UNF001", state_code: "CA" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { veh: "$.data.id" }
            - call: "POST /memberships"
              payload: { account_id: "${acct}", vehicle_id: "${veh}", plan_id: "${plan_u}" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { mem: "$.data.id" }
            - call: "GET /invoices"
              payload: { membership_id: "${mem}", kind: "CYCLE" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { inv0: "$.data[0].id" }
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /memberships/${mem}/unfreeze"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE"

      - name: invoice_retry_on_paid_invoice_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Invoice.RETRYING_to_PAID, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /invoices/{id}/retry on a PAID (terminal) invoice -> ERR_INVALID_STATE (409); no further charge attempts."
        test_recipe:
          setup: ["ACTIVE UNLIMITED membership whose first CYCLE invoice is PAID (terminal)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { name: "UPaid", tier_type: "UNLIMITED", monthly_fee_cents: 3000, included_credits: 0, wash_cooldown_hours: 0, max_addons: 3 }
              as: PlatformAdmin
              captures: { plan_u: "$.data.id" }
            - call: "POST /accounts"
              payload: { account_type: "INDIVIDUAL", contact_email: "paid@x.com" }
              as: AccountHolder
              captures: { acct: "$.data.id" }
            - call: "POST /accounts/${acct}/vehicles"
              payload: { license_plate: "PAY001", state_code: "CA" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { veh: "$.data.id" }
            - call: "POST /memberships"
              payload: { account_id: "${acct}", vehicle_id: "${veh}", plan_id: "${plan_u}" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { mem: "$.data.id" }
            - call: "GET /invoices"
              payload: { membership_id: "${mem}", kind: "CYCLE" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { inv0: "$.data[0].id" }
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /invoices/${inv0}/retry"
              payload: {}
              as: BillingAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE"

      - name: scheduled_freeze_activates_on_clock_advance
        claim_type: Valid Transition
        grounds: [state_machines.Freeze.SCHEDULED_to_ACTIVE, state_machines.Membership.ACTIVE_to_FROZEN]
        distinguishing_aspect: "Advancing the clock past a SCHEDULED freeze's start_utc fires Freeze SCHEDULED->ACTIVE and Membership ACTIVE->FROZEN as a system-triggered transition (no explicit endpoint call)."
        test_recipe:
          setup: ["ACTIVE UNLIMITED membership with a SCHEDULED freeze for [2026-06-10, 2026-06-20)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { name: "USch", tier_type: "UNLIMITED", monthly_fee_cents: 3000, included_credits: 0, wash_cooldown_hours: 0, max_addons: 3 }
              as: PlatformAdmin
              captures: { plan_u: "$.data.id" }
            - call: "POST /accounts"
              payload: { account_type: "INDIVIDUAL", contact_email: "sch@x.com" }
              as: AccountHolder
              captures: { acct: "$.data.id" }
            - call: "POST /accounts/${acct}/vehicles"
              payload: { license_plate: "SCH001", state_code: "CA" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { veh: "$.data.id" }
            - call: "POST /memberships"
              payload: { account_id: "${acct}", vehicle_id: "${veh}", plan_id: "${plan_u}" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { mem: "$.data.id" }
            - call: "GET /invoices"
              payload: { membership_id: "${mem}", kind: "CYCLE" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { inv0: "$.data[0].id" }
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /memberships/${mem}/freeze-scheduled"
              payload: { start_utc: "2026-06-10T00:00:00Z", end_utc: "2026-06-20T00:00:00Z" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { fz: "$.data.id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "Membership.${mem}.status == FROZEN"
            - "GET /memberships/${mem}/freezes shows Freeze ${fz} status == ACTIVE"

      - name: cancel_scheduled_freeze_returns_cancelled
        claim_type: Valid Transition
        grounds: [state_machines.Freeze.SCHEDULED_to_CANCELLED]
        distinguishing_aspect: "POST /freezes/{id}/cancel on a SCHEDULED freeze -> CANCELLED; membership stays ACTIVE and no refund is credited."
        test_recipe:
          setup: ["ACTIVE UNLIMITED membership with a SCHEDULED freeze."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { name: "UFzc", tier_type: "UNLIMITED", monthly_fee_cents: 3000, included_credits: 0, wash_cooldown_hours: 0, max_addons: 3 }
              as: PlatformAdmin
              captures: { plan_u: "$.data.id" }
            - call: "POST /accounts"
              payload: { account_type: "INDIVIDUAL", contact_email: "fzc@x.com" }
              as: AccountHolder
              captures: { acct: "$.data.id" }
            - call: "POST /accounts/${acct}/vehicles"
              payload: { license_plate: "FZC001", state_code: "CA" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { veh: "$.data.id" }
            - call: "POST /memberships"
              payload: { account_id: "${acct}", vehicle_id: "${veh}", plan_id: "${plan_u}" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { mem: "$.data.id" }
            - call: "GET /invoices"
              payload: { membership_id: "${mem}", kind: "CYCLE" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { inv0: "$.data[0].id" }
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /memberships/${mem}/freeze-scheduled"
              payload: { start_utc: "2026-06-10T00:00:00Z", end_utc: "2026-06-20T00:00:00Z" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { fz: "$.data.id" }
          trigger:
            - call: "POST /freezes/${fz}/cancel"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct}"
          assert:
            - "Freeze ${fz} status == CANCELLED"
            - "Membership.${mem}.status == ACTIVE"
            - "Account.${acct}.wallet_balance_cents == 0 (no refund credited)"

      - name: account_close_with_active_membership_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Account.ACTIVE_to_CLOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /accounts/{id}/close while the account still has an ACTIVE membership violates the close precondition -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["ACTIVE account with one ACTIVE membership."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { name: "UCls", tier_type: "UNLIMITED", monthly_fee_cents: 3000, included_credits: 0, wash_cooldown_hours: 0, max_addons: 3 }
              as: PlatformAdmin
              captures: { plan_u: "$.data.id" }
            - call: "POST /accounts"
              payload: { account_type: "INDIVIDUAL", contact_email: "cls@x.com" }
              as: AccountHolder
              captures: { acct: "$.data.id" }
            - call: "POST /accounts/${acct}/vehicles"
              payload: { license_plate: "CLS001", state_code: "CA" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { veh: "$.data.id" }
            - call: "POST /memberships"
              payload: { account_id: "${acct}", vehicle_id: "${veh}", plan_id: "${plan_u}" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { mem: "$.data.id" }
            - call: "GET /invoices"
              payload: { membership_id: "${mem}", kind: "CYCLE" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { inv0: "$.data[0].id" }
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /accounts/${acct}/close"
              payload: {}
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE; Account.${acct}.status == ACTIVE (unchanged)"

  # ===========================================================================
  - section: calculations
    instances:
      - name: cancellation_refund_single_wash_consumed_variant
        claim_type: Variant Selection
        grounds: [calculations.cancellation_refund]
        distinguishing_aspect: "SINGLE_WASH cancellation uses the consumed_value variant: refund = current_cycle_paid_cents - credits_consumed_this_cycle * 400. With current_cycle_paid_cents=0 (free included credits) the refund floors at 0, proving the variant differs from the UNLIMITED unused_value path."
        test_recipe:
          setup: ["SINGLE_WASH membership (monthly_fee_cents=0, included_credits=2 free at activation, so current_cycle_paid_cents=0). No washes taken. Cancelled mid-cycle."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { name: "SCanc", tier_type: "SINGLE_WASH", monthly_fee_cents: 0, included_credits: 2, per_credit_price_cents: 1200, wash_cooldown_hours: 0, max_addons: 0 }
              as: PlatformAdmin
              captures: { plan_s: "$.data.id" }
            - call: "POST /accounts"
              payload: { account_type: "INDIVIDUAL", contact_email: "scan@x.com" }
              as: AccountHolder
              captures: { acct: "$.data.id" }
            - call: "POST /accounts/${acct}/vehicles"
              payload: { license_plate: "SCN001", state_code: "CA" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { veh: "$.data.id" }
            - call: "POST /memberships"
              payload: { account_id: "${acct}", vehicle_id: "${veh}", plan_id: "${plan_s}" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { mem: "$.data.id" }
            - call: "GET /invoices"
              payload: { membership_id: "${mem}", kind: "CYCLE" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { inv0: "$.data[0].id" }
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-12T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /memberships/${mem}/cancel"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct}"
          assert:
            - "Membership.${mem}.status == CANCEL_SCHEDULED"
            - "Account.${acct}.wallet_balance_cents == 0 (consumed_value refund floors at 0 when paid is 0)"

      - name: invoice_total_individual_no_discount
        claim_type: Constants Applied
        grounds: [calculations.invoice_cycle_total, entities.Account.fields.fleet_discount_pct]
        distinguishing_aspect: "INDIVIDUAL account never receives a fleet discount: a CYCLE invoice on a 3000 plan has discount_cents=0 and total_cents=3000 even though active_vehicle_count would otherwise reach a tier."
        test_recipe:
          setup: ["INDIVIDUAL account, ACTIVE UNLIMITED(3000) membership, no add-ons; billing run after a full cycle."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { name: "UInd", tier_type: "UNLIMITED", monthly_fee_cents: 3000, included_credits: 0, wash_cooldown_hours: 0, max_addons: 3 }
              as: PlatformAdmin
              captures: { plan_u: "$.data.id" }
            - call: "POST /accounts"
