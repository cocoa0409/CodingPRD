- method: POST
  path: /mfg/claim-reviews/{id}/resubmit
  description: REVISION_REQUESTED -> SUBMITTED (cycle)
  roles:
  - FormulationScientist
  - BrandCustomerRep
  code: 200
  input: []
  output: ClaimReview
  side_effects:
  - recomputes substantiation_ok
  - increments review.version
- method: POST
  path: /mfg/_clock/set_current_utc
  description: 'Test-driving logical clock. Startup default is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock.
    Setting the clock evaluates time-based system transitions: shelf-life studies past expiry auto-COMPLETE when projection
    <= limit, due pulls past grace become MISSED.'
  roles:
  - PlantAdmin
  code: 200
  input:
  - to_iso8601
  output:
    current_utc: string
  side_effects:
  - evaluates ShelfLifeStudy auto-COMPLETED and ShelfLifePull auto-MISSED
errors:
- id: ERR_UNAUTHENTICATED
  http: 401
  condition: X-User-Role header missing or not a declared role
- id: ERR_UNAUTHORIZED_ROLE
  http: 403
  condition: Role not in the endpoint's roles list
- id: ERR_FORBIDDEN_CUSTOMER_SCOPE
  http: 403
  condition: BrandCustomerRep addressing a resource owned by a different BrandCustomer, or listing without own customer_id
- id: ERR_CUSTOMER_NOT_FOUND
  http: 404
  condition: Referenced brand customer does not exist
- id: ERR_SUPPLIER_NOT_FOUND
  http: 404
  condition: Referenced supplier does not exist
- id: ERR_FORMULA_NOT_FOUND
  http: 404
  condition: Referenced formula does not exist
- id: ERR_REVISION_NOT_FOUND
  http: 404
  condition: Referenced formula revision does not exist
- id: ERR_INGREDIENT_NOT_FOUND
  http: 404
  condition: Referenced ingredient does not exist
- id: ERR_LOT_NOT_FOUND
  http: 404
  condition: Referenced ingredient lot does not exist
- id: ERR_LINE_NOT_FOUND
  http: 404
  condition: Referenced production line does not exist
- id: ERR_RUN_NOT_FOUND
  http: 404
  condition: Referenced production run does not exist
- id: ERR_AGREEMENT_NOT_FOUND
  http: 404
  condition: Referenced manufacturing agreement does not exist
- id: ERR_SLOT_NOT_FOUND
  http: 404
  condition: Referenced line slot does not exist
- id: ERR_CHANGEOVER_NOT_FOUND
  http: 404
  condition: Referenced changeover event does not exist
- id: ERR_STUDY_NOT_FOUND
  http: 404
  condition: Referenced shelf-life study does not exist
- id: ERR_RELEASE_NOT_FOUND
  http: 404
  condition: Referenced lot release does not exist
- id: ERR_CLAIM_REVIEW_NOT_FOUND
  http: 404
  condition: Referenced claim review does not exist
- id: ERR_INVALID_REQUEST
  http: 400
  condition: Missing required field, wrong type, violated numeric range, or empty required array
- id: ERR_INVALID_ENUM_VALUE
  http: 400
  condition: Enum field carries an undeclared member
- id: ERR_INVALID_STATE
  http: 409
  condition: Target resource's state machine does not permit the transition from its current state
- id: ERR_TERMINAL_STATE_LOCKED
  http: 409
  condition: Target resource is in a terminal state
- id: ERR_ALLERGEN_SEGREGATION_VIOLATION
  http: 422
  condition: GLUTEN_FREE-claimed revision planned on a line whose current_allergen_profile contains WHEAT
- id: ERR_LABEL_CLAIM_UNSUBSTANTIATED
  http: 422
  condition: LABEL-variant substantiation fails a NUTRIENT_CONTENT claim (verify-nutrition or claim approve)
- id: ERR_COMPOSITE_CLAIM_UNSUBSTANTIATED
  http: 422
  condition: COMPOSITE-variant (reserved-lot CoA) substantiation fails a claim at verify-pre-run
- id: ERR_CHANGEOVER_NOT_VALIDATED
  http: 422
  condition: verify-pre-run while the run's ChangeoverEvent is not VALIDATED
- id: ERR_SWAB_PPM_EXCEEDS_LIMIT
  http: 422
  condition: Validating a SWAB_VALIDATE changeover with swab_allergen_ppm > 20
- id: ERR_SOD_VIOLATION
  http: 422
  condition: Same X-User-ID on both sides of a segregation-of-duties pair (swab/validate or record-qc/decide)
- id: ERR_RETAIN_SAMPLE_REQUIRED
  http: 422
  condition: RELEASED decision without at least one STORED retain sample
- id: ERR_RETAIN_PERIOD_TOO_SHORT
  http: 422
  condition: retain_until_utc earlier than run.completed_utc + 30 days
- id: ERR_DISCLAIMER_REQUIRED
  http: 422
  condition: Approving a STRUCTURE_FUNCTION claim without structure_function_disclaimer == true
- id: ERR_SCHEDULE_IN_PAST
  http: 422
  condition: Slot start_utc earlier than the current logical clock
- id: ERR_SLOT_OVERLAP
  http: 409
  condition: Half-open slot interval intersects a CONFIRMED slot on the same line
- id: ERR_SLOT_CHANGEOVER_BUFFER_VIOLATION
  http: 409
  condition: Gap to an adjacent CONFIRMED slot is smaller than the required changeover buffer_minutes
- id: ERR_CHAMBER_POSITION_OCCUPIED
  http: 409
  condition: Closed study interval collides with another ACTIVE study on the same (chamber_id, shelf_position)
- id: ERR_PULL_WINDOW_MISSED
  http: 422
  condition: Recording a pull whose due_utc + 2 days grace has passed, or with recorded_utc in the future
- id: ERR_REVISION_NOT_APPROVED
  http: 422
  condition: Run create against a revision whose status != APPROVED
- id: ERR_AGREEMENT_NOT_ACTIVE
  http: 422
  condition: Run create against an agreement whose status != ACTIVE
- id: ERR_CUSTOMER_SUSPENDED
  http: 422
  condition: Operation against a SUSPENDED brand customer
- id: ERR_SUPPLIER_NOT_QUALIFIED
  http: 422
  condition: Lot receipt from a supplier whose qualification_status != APPROVED
- id: ERR_INGREDIENT_DISCONTINUED
  http: 422
  condition: Revision submit containing a DISCONTINUED ingredient
- id: ERR_FORMULA_ARCHIVED
  http: 422
  condition: New revision or shelf-life study on an ARCHIVED formula
- id: ERR_CLAIM_REVIEW_INCOMPLETE
  http: 422
  condition: Revision approve with a claim_tag lacking an APPROVED ClaimReview
- id: ERR_DUPLICATE_LOT_CODE
  http: 409
  condition: lot_code already exists for the same ingredient on a non-REJECTED lot
- id: ERR_OUTPUT_EXCEEDS_CUT_PLAN
  http: 422
  condition: produced_cases greater than the cut plan's expected_cases for the batch
- id: ERR_SWAB_NOT_REQUIRED
  http: 422
  condition: record-swab on a changeover whose required_level != SWAB_VALIDATE
- id: ERR_INGREDIENT_SHORTAGE
  http: 422
  condition: verify-pre-run with readiness BLOCKED or insufficient RELEASED quantity for sweetener top-up
- id: ERR_YIELD_VARIANCE_EXCEEDED
  http: 422
  condition: RELEASED decision with ABS(yield_variance_pct) > 5.00
- id: ERR_QC_NOT_PASSED
  http: 422
  condition: RELEASED decision while qc_disposition != PASSED
- id: ERR_MOQ_SHORTFALL
  http: 422
  condition: planned_cases below agreement.moq_cases_per_run
- id: ERR_STALE_VERSION
  http: 412
  condition: expected_*_version does not match the parent entity's current version (OCC)
roles:
- name: PlantAdmin
  description: 'Plant operations administrator: suppliers, ingredients, lines, customers, agreements, logical clock'
  identity: opaque
  exclusive_operations:
  - POST /mfg/suppliers
  - PATCH /mfg/suppliers/{id}
  - POST /mfg/ingredients
  - POST /mfg/ingredient-lots
  - POST /mfg/customers
  - POST /mfg/agreements
  - POST /mfg/agreements/{id}/activate
  - POST /mfg/agreements/{id}/suspend
  - POST /mfg/agreements/{id}/resume
  - POST /mfg/agreements/{id}/terminate
  - POST /mfg/lines
  - POST /mfg/_clock/set_current_utc
  shared_operations:
  - GET reads across the surface
- name: FormulationScientist
  description: Owns formulas, revisions, and claim-review submissions
  identity: opaque
  exclusive_operations:
  - POST /mfg/formulas/{id}/revisions
  - POST /mfg/revisions/{id}/submit
  - POST /mfg/revisions/{id}/send-claim-review
  shared_operations:
  - POST /mfg/formulas
  - POST /mfg/claim-reviews
  - POST /mfg/claim-reviews/{id}/resubmit
  - GET reads
- name: QualityManager
  description: 'Quality authority: lot disposition, nutrition verification, changeover validation, pre-run verification, retain
    samples, lot-release decisions, claim approvals'
  identity: opaque
  exclusive_operations:
  - POST /mfg/ingredient-lots/{id}/release
  - POST /mfg/ingredient-lots/{id}/reject
  - POST /mfg/revisions/{id}/verify-nutrition
  - POST /mfg/revisions/{id}/approve
  - POST /mfg/revisions/{id}/reject-back
  - POST /mfg/production-runs/{id}/verify-pre-run
  - POST /mfg/production-runs/{id}/retain-samples
  - POST /mfg/changeovers/{id}/validate
  - POST /mfg/changeovers/{id}/fail
  - POST /mfg/lot-releases/{id}/decide
  - POST /mfg/claim-reviews/{id}/start-review
  - POST /mfg/claim-reviews/{id}/approve
  - POST /mfg/claim-reviews/{id}/request-revision
  shared_operations:
  - GET reads
- name: ProductionPlanner
  description: Schedules and executes production runs and cleaning logistics
  identity: opaque
  exclusive_operations:
  - POST /mfg/production-runs
  - POST /mfg/production-runs/{id}/schedule
  - POST /mfg/production-runs/{id}/start
  - POST /mfg/production-runs/{id}/complete
  - POST /mfg/production-runs/{id}/cancel
  - POST /mfg/changeovers/{id}/log-cleaning
  shared_operations:
  - GET /mfg/agreements
  - GET /mfg/agreements/{id}/quote
  - GET reads
- name: LabTechnician
  description: 'Records measurements: swabs, shelf-life pulls, QC dispositions; MUST NOT validate or decide what it recorded
    (segregation of duties vs QualityManager)'
  identity: opaque
  exclusive_operations:
  - POST /mfg/changeovers/{id}/record-swab
  - POST /mfg/shelf-life-studies
  - POST /mfg/shelf-life-studies/{id}/terminate
  - POST /mfg/shelf-life-studies/{id}/pulls
  - POST /mfg/lot-releases/{id}/record-qc
  shared_operations:
  - GET reads
- name: BrandCustomerRep
  description: Brand customer representative; entity-backed identity scoped to its own BrandCustomer's formulas, revisions,
    agreements, runs, and claim reviews
  identity: entity_backed:BrandCustomer
  exclusive_operations: []
  shared_operations:
  - POST /mfg/formulas
  - POST /mfg/claim-reviews
  - POST /mfg/claim-reviews/{id}/resubmit
  - GET /mfg/formulas
  - GET /mfg/formulas/{id}
  - GET /mfg/formulas/{id}/revisions
  - GET /mfg/revisions/{id}
  - GET /mfg/revisions/{id}/claim-reviews
  - GET /mfg/agreements
  - GET /mfg/agreements/{id}
  - GET /mfg/agreements/{id}/quote
  - GET /mfg/production-runs
  - GET /mfg/production-runs/{id}
