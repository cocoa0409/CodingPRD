          - errors[ERR_AUTHORITY_INVALID_STATE]
          - validations[priority=10]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / contract_creation_is_gated_on_the_parent_authority_status
          rationale: "That instance walks the parent through PENDING, ACTIVE and SUSPENDED and asserts the state error on the statuses that forbid the write."

  - section: rbac
    instances:
      - name: exclusive_operations_are_closed_to_every_other_role
        claim_type: role_exclusivity
        grounds:
          - roles.CarrierRep.exclusive_operations
          - roles.ComplianceOfficer.exclusive_operations
          - roles.RegistryAdmin.exclusive_operations
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Exclusivity is checked before any state or ownership rule: a CarrierRep activating, a ComplianceOfficer applying and a CarrierRep enrolling a carrier all return ERR_UNAUTHORIZED at 403 even though each request body is otherwise well formed and the target is in the right state."
        test_recipe:
          setup:
            - "one PENDING authority whose owning carrier is known"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /carriers"
