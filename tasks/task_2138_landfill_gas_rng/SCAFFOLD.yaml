scenario: "desgin task harder than expert level.!!!!2138. Landfill Gas & Renewable Natural Gas Project Operations (landfill RNG project): wellfield tuning & gas quality monitoring, collection system maintenance & condensate handling, gas processing/upgrading & pipeline injection spec, environmental attribute (RIN/LCFS) generation, offtake contract & pipeline scheduling, downtime & flare backup accounting, regulatory reporting & permit compliance, royalty to host landfill"
domain_name: "landfill-gas-rng-operations"
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by explicit foreign keys in request bodies. Only two
  # append-only event children (WellTuningReading, CondensateHaul) use nested
  # URL paths; every other entity is addressed at its own top-level collection.

  state_machine_shape: parallel
  # ProcessingPlant carries two independent state dimensions (process_mode ×
  # spec_status). GasWell and ComplianceReport are cyclic; InjectionBatch is a
  # branching fork (ON_SPEC vs OFF_SPEC) with divergent side-effect sets.

  relationship_patterns:
    - one_to_many          # LandfillSite -> GasWell / ProcessingPlant / OfftakeContract / ComplianceReport / RoyaltyStatement
    - cross_aggregate      # AttributeBatch -> InjectionBatch -> ProcessingPlant -> LandfillSite; ComplianceReport gates AttributeBatch
    - polymorphic          # AttributeBatch.program selects which calculation (RIN_D3 vs LCFS) populates which result field

  role_model: segregation_of_duties
  # The ComplianceOfficer who prepared a report may never review, return, or
  # accept it; wellfield, plant, commercial, host and admin roles own disjoint
  # resource surfaces.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: LandfillSite
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Host landfill name.
        constraints: non-empty, max 120 chars
      - name: state_code
        type: string
        source: input
        description: Two-letter US state code of the host landfill; LCFS attributes are only generated for state_code == "CA".
        constraints: exactly 2 uppercase letters
      - name: host_royalty_pct
        type: number
        source: input
        description: Fraction of revenue owed to the host landfill under the royalty agreement.
        constraints: 0 < value <= 0.50
      - name: royalty_variant
        type: enum
        source: input
        description: Default royalty settlement method for this site.
        constraints: one of GROSS_REVENUE_SHARE, NETBACK_SHARE
      - name: royalty_floor_usd_per_mmbtu
        type: number
        source: input
        default: 0.25
        description: Contractual minimum royalty per billable MMBtu; applied as a floor over the calculated amount.
        constraints: value >= 0
      - name: permit_nmoc_limit_lb_per_hr
        type: number
        source: input
        description: Title V permit limit on non-methane organic compound emissions, pounds per hour.
        constraints: value > 0
      - name: design_collection_efficiency_pct
        type: number
        source: input
        default: 85.0
        description: Design collection efficiency used in permit narrative; reference value only, never used in a calculation.
      - name: collected_flow_scfm
        type: number
        source: computed
        default: 0
        description: Sum of GasWell.current_flow_scfm over wells of this site whose operating_state IN {ONLINE, THROTTLED}; recomputed on every well flow or state change.
      - name: collection_efficiency_pct
        type: number
        source: computed
        default: 0
        description: 100 * collected_flow_scfm / (sum of GasWell.target_flow_scfm over wells of this site whose operating_state != DECOMMISSIONED); 0.00 when the denominator is 0.
      - name: energy_produced_mmbtu
        type: number
        source: system
        default: 0
        description: Running ledger of all landfill-gas energy accounted for at this site; equals energy_injected_mmbtu + energy_flared_mmbtu + energy_vented_mmbtu at all times.
      - name: energy_injected_mmbtu
        type: number
        source: system
        default: 0
        description: Running ledger of energy delivered into the pipeline via InjectionBatch rows in status INJECTED.
      - name: energy_flared_mmbtu
        type: number
        source: system
        default: 0
        description: Running ledger of energy sent to the backup flare (diverted InjectionBatch rows plus CLOSED DowntimeEvent rows with disposition FLARED).
      - name: energy_vented_mmbtu
        type: number
        source: system
        default: 0
        description: Running ledger of energy vented (CLOSED DowntimeEvent rows with disposition VENTED).
      - name: rin_generated_total
        type: integer
        source: system
        default: 0
        description: Cumulative count of D3 RINs ever generated at this site; never decreases.
      - name: rin_available_count
        type: integer
        source: system
        default: 0
        description: D3 RINs currently held (AttributeBatch status IN {GENERATED, QA_HOLD, SEPARATED}).
      - name: rin_retired_count
        type: integer
        source: system
        default: 0
        description: D3 RINs retired (AttributeBatch status RETIRED).
      - name: rin_reversed_count
        type: integer
        source: system
        default: 0
        description: D3 RINs reversed (AttributeBatch status REVERSED).
      - name: royalty_payable_usd
        type: number
        source: system
        default: 0
        description: Sum of RoyaltyStatement.royalty_amount_usd over statements of this site whose status IS ISSUED.
      - name: compliance_posture
        type: enum
        source: computed
        default: COMPLIANT
        description: VIOLATION when any ComplianceReport of this site with status IN {SUBMITTED, UNDER_REVIEW, RETURNED, ACCEPTED} has exceedance_flag == true; else WATCH when any ComplianceReport of this site has status RETURNED; else COMPLIANT.
        constraints: one of COMPLIANT, WATCH, VIOLATION

  - name: GasWell
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: FK -> LandfillSite.id; the host landfill this extraction well belongs to.
      - name: well_code
        type: string
        source: input
        description: Operator well label; unique among non-DECOMMISSIONED wells of the same site_id.
        constraints: non-empty, max 20 chars
      - name: target_flow_scfm
        type: number
        source: input
        description: Design extraction rate for this well in standard cubic feet per minute.
        constraints: value > 0
      - name: operating_state
        type: enum
        source: system
        default: ONLINE
        description: Wellfield operating state.
        constraints: one of ONLINE, THROTTLED, ISOLATED, MAINTENANCE_LOCKOUT, DECOMMISSIONED
      - name: current_flow_scfm
        type: number
        source: computed
        default: 0
        description: Extraction rate credited to this well right now; set by the most recent WellTuningReading or by a state transition (0 while ISOLATED, MAINTENANCE_LOCKOUT or DECOMMISSIONED).
      - name: last_reading_flow_scfm
        type: number
        source: computed
        default: 0
        description: flow_scfm of the most recent WellTuningReading for this well, ordered by taken_at ASC with created_at ASC as tie-break; 0 when no reading exists.
      - name: wellhead_vacuum_inhg
        type: number
        source: computed
        default: 0
        description: vacuum_inhg of the most recent WellTuningReading for this well (same ordering as last_reading_flow_scfm).
      - name: last_quality_class
        type: enum
        source: computed
        default: NONE
        description: quality_class of the most recent WellTuningReading for this well.
        constraints: one of NONE, GOOD, WATCH, ALARM
      - name: last_reading_at
        type: datetime
        source: computed
        description: taken_at of the most recent WellTuningReading for this well; null when no reading exists.
      - name: consecutive_good_readings
        type: integer
        source: system
        default: 0
        description: Count of consecutive WellTuningReading rows with quality_class GOOD since the last non-GOOD reading; reset to 0 by any WATCH or ALARM reading and by WorkOrder completion.
      - name: lockout_work_order_id
        type: string
        source: system
        description: Identifier of the WorkOrder row currently holding maintenance lockout on this well (WorkOrder.id), or null when the well is not in MAINTENANCE_LOCKOUT. Not a request-validated reference.

  - name: WellTuningReading
    parent: GasWell
    common_fields: false
    fields:
      - name: well_id
        type: string
        source: input
        description: FK -> GasWell.id; the well this tuning reading was taken on.
      - name: taken_at
        type: datetime
        source: input
        description: Instant the field reading was taken; must be strictly greater than GasWell.last_reading_at.
      - name: methane_pct
        type: number
        source: input
        description: Methane concentration by volume, percent.
        constraints: 0 <= value <= 100
      - name: oxygen_pct
        type: number
        source: input
        description: Oxygen concentration by volume, percent.
        constraints: 0 <= value <= 25
      - name: nitrogen_pct
        type: number
        source: input
        description: Nitrogen concentration by volume, percent.
        constraints: 0 <= value <= 100
      - name: temperature_f
        type: number
        source: input
        description: Wellhead gas temperature in degrees Fahrenheit.
        constraints: 0 <= value <= 250
      - name: flow_scfm
        type: number
        source: input
        description: Measured extraction rate at the wellhead.
        constraints: value >= 0
      - name: vacuum_inhg
        type: number
        source: input
        description: Applied wellhead vacuum in inches of mercury.
        constraints: value >= 0
      - name: air_intrusion_index
        type: number
        source: computed
        description: Composite air-intrusion score from calculations.reading_quality_classification, 2 decimal places.
      - name: quality_class
        type: enum
        source: computed
        description: Gas quality classification derived from this reading.
        constraints: one of GOOD, WATCH, ALARM
      - name: resulting_well_state
        type: enum
        source: computed
        description: GasWell.operating_state immediately after this reading was applied.
        constraints: one of ONLINE, THROTTLED, ISOLATED
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the WellfieldTechnician who submitted this reading.

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - name: well_id
        type: string
        source: input
        description: FK -> GasWell.id; the well taken out of service for this maintenance job.
      - name: work_type
        type: enum
        source: input
        description: Nature of the collection-system maintenance job.
        constraints: one of WELL_RETUNE, LATERAL_REPAIR, SUMP_PUMP_SERVICE, HEADER_DEWATERING
      - name: window_start
        type: datetime
        source: input
        description: Planned start of the maintenance window (inclusive).
      - name: window_end
        type: datetime
        source: input
        description: Planned end of the maintenance window (inclusive); must be strictly after window_start.
      - name: lockout_buffer_minutes
        type: integer
        source: system
        default: 120
        description: Purge/settle buffer applied to BOTH ends of the window when testing for lockout conflicts on the same well.
      - name: status
        type: enum
        source: system
        default: PLANNED
        description: Work order lifecycle state.
        constraints: one of PLANNED, IN_PROGRESS, COMPLETED, CANCELLED
      - name: actual_start_at
        type: datetime
        source: system
        description: Logical-clock instant at which the work order moved PLANNED -> IN_PROGRESS; null before that.
      - name: actual_end_at
        type: datetime
        source: system
        description: Logical-clock instant at which the work order moved IN_PROGRESS -> COMPLETED; null before that.
      - name: condensate_gallons_removed
        type: number
        source: computed
        default: 0
        description: Sum of CondensateHaul.gallons over all hauls recorded against this work order.

  - name: CondensateHaul
    parent: WorkOrder
    common_fields: false
    fields:
      - name: work_order_id
        type: string
        source: input
        description: FK -> WorkOrder.id; the maintenance job during which the condensate was pumped out.
      - name: gallons
        type: number
        source: input
        description: Volume of condensate removed.
        constraints: value > 0
      - name: disposal_manifest_no
        type: string
        source: input
        description: Disposal manifest number issued by the receiving facility.
        constraints: non-empty, max 40 chars
      - name: hauled_at
        type: datetime
        source: input
        description: Instant the haul left the site.
      - name: is_hazardous
        type: boolean
        source: input
        default: false
        description: True when the condensate is manifested as hazardous waste; requires disposal_manifest_no to start with "HW-".

  - name: ProcessingPlant
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: FK -> LandfillSite.id; the host landfill whose collected gas this plant upgrades.
      - name: plant_code
        type: string
        source: input
        description: Operator label for the upgrading skid.
        constraints: non-empty, max 20 chars
      - name: receipt_point_code
        type: string
        source: input
        description: Pipeline receipt point this plant injects into; nomination capacity is pooled per plant row.
        constraints: non-empty, max 20 chars
      - name: receipt_point_mdq_dth_per_day
        type: number
        source: input
        description: Maximum daily quantity the receipt point will accept, in dekatherms per day.
        constraints: value > 0
      - name: min_feed_scfm
        type: number
        source: input
        description: Minimum LandfillSite.collected_flow_scfm required to sustain UPGRADING mode.
        constraints: value > 0
      - name: spec_min_methane_pct
        type: number
        source: input
        default: 96.0
        description: Pipeline injection specification, minimum methane content of an InjectionBatch.
      - name: spec_max_oxygen_pct
        type: number
        source: input
        default: 0.2
        description: Pipeline injection specification, maximum oxygen content of an InjectionBatch.
      - name: spec_max_co2_pct
        type: number
        source: input
        default: 2.0
        description: Pipeline injection specification, maximum carbon dioxide content of an InjectionBatch.
      - name: process_mode
        type: enum
        source: system
        default: STARTUP
        description: First independent state dimension - what the plant is doing with the feed gas.
        constraints: one of STARTUP, UPGRADING, FLARING, DOWN, DECOMMISSIONED
      - name: spec_status
        type: enum
        source: system
        default: ON_SPEC
        description: Second independent state dimension - whether product gas currently meets pipeline spec. Evolves independently of process_mode.
        constraints: one of ON_SPEC, OFF_SPEC, QUARANTINE
      - name: availability_factor_pct
        type: number
        source: computed
        default: 100.0
        description: Month-to-date availability from calculations.plant_availability_factor; 100.00 when no CLOSED DowntimeEvent falls in the month-to-date window.
      - name: downtime_minutes_mtd
        type: number
        source: computed
        default: 0
        description: Merged (union) length in minutes of CLOSED DowntimeEvent intervals for this plant clipped to the month-to-date window.
      - name: flare_minutes_mtd
        type: number
        source: computed
        default: 0
        description: Merged (union) length in minutes of CLOSED DowntimeEvent intervals with disposition FLARED for this plant, clipped to the month-to-date window.

  - name: DowntimeEvent
    parent: null
    common_fields: true
    fields:
      - name: plant_id
        type: string
        source: input
        description: FK -> ProcessingPlant.id; the plant that was down.
      - name: start_at
        type: datetime
        source: input
        description: Start of the outage (inclusive).
      - name: cause
        type: enum
        source: input
        description: Root cause bucket for regulatory downtime accounting.
        constraints: one of PLANNED_MAINTENANCE, COMPRESSOR_TRIP, OFF_SPEC_TRIP, WELLFIELD_SHORTFALL, PIPELINE_CURTAILMENT
      - name: disposition
        type: enum
        source: input
        description: Where the raw gas went during the outage.
        constraints: one of FLARED, VENTED, BYPASS
      - name: end_at
        type: datetime
        source: system
        description: End of the outage (exclusive); null while status is OPEN.
      - name: status
        type: enum
        source: system
        default: OPEN
        description: Outage record lifecycle.
        constraints: one of OPEN, CLOSED
      - name: flared_mmbtu
        type: number
        source: system
        default: 0
        description: Energy sent to the flare during this outage, supplied on close; credited to LandfillSite.energy_flared_mmbtu.
      - name: vented_mmbtu
        type: number
        source: system
        default: 0
        description: Energy vented during this outage, supplied on close; credited to LandfillSite.energy_vented_mmbtu.
      - name: duration_minutes
        type: number
        source: computed
        default: 0
        description: (end_at - start_at) in minutes, 2 decimal places; 0 while status is OPEN.
      - name: auto_generated
        type: boolean
        source: system
        default: false
        description: True when the outage row was opened by the wellfield-shortfall cascade rather than by an operator.

  - name: OfftakeContract
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: FK -> LandfillSite.id; the project whose RNG this contract sells.
      - name: counterparty_name
        type: string
        source: input
        description: Offtaker legal name.
        constraints: non-empty, max 120 chars
      - name: contract_mdq_dth_per_day
        type: number
        source: input
        description: Maximum daily quantity this counterparty may nominate, in dekatherms per gas day.
        constraints: value > 0
      - name: price_usd_per_dth
        type: number
        source: input
        description: Commodity price paid for delivered gas, USD per dekatherm.
        constraints: value > 0
      - name: attribute_share_pct
        type: number
        source: input
        default: 0
        description: Counterparty share of environmental-attribute revenue; reference value only, never used in a calculation.
      - name: term_start
        type: datetime
        source: input
        description: First instant of the contract term (inclusive).
      - name: term_end
        type: datetime
        source: input
        description: Last instant of the contract term (exclusive); must be strictly after term_start.
      - name: status
        type: enum
        source: system
        default: PENDING
        description: Contract lifecycle state.
        constraints: one of PENDING, ACTIVE, SUSPENDED, TERMINATED
      - name: delivered_dth_mtd
        type: number
        source: system
        default: 0
        description: Cumulative dekatherms delivered against this contract by InjectionBatch rows that reached INJECTED.

  - name: PipelineNomination
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: FK -> OfftakeContract.id; the contract this gas-day nomination is written against.
      - name: plant_id
        type: string
        source: input
        description: FK -> ProcessingPlant.id; the plant whose receipt point the nomination occupies.
      - name: gas_day_start
        type: datetime
        source: input
        description: Start of the nominated window (inclusive). Nomination windows are half-open [gas_day_start, gas_day_end).
      - name: gas_day_end
        type: datetime
        source: input
        description: End of the nominated window (exclusive); must be strictly after gas_day_start.
      - name: nominated_dth
        type: number
        source: input
        description: Dekatherms nominated for the window.
        constraints: value > 0
      - name: hourly_rate_dth
        type: number
        source: computed
        description: nominated_dth divided by the window length in hours, rounded to 4 decimal places.
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Nomination lifecycle state.
        constraints: one of DRAFT, CONFIRMED, SCHEDULED, DELIVERED, CURTAILED, CANCELLED
      - name: committed_dth
        type: number
        source: system
        default: 0
        description: Sum of InjectionBatch.gross_mmbtu over batches currently attached to this nomination in status NOMINATED or INJECTED.
      - name: delivered_dth
        type: number
        source: system
        default: 0
        description: Sum of InjectionBatch.gross_mmbtu over batches attached to this nomination in status INJECTED.
      - name: curtail_reason
        type: string
        source: system
        description: Free-text reason recorded when the nomination moved to CURTAILED; null otherwise.

  - name: InjectionBatch
    parent: null
    common_fields: true
    fields:
      - name: plant_id
        type: string
        source: input
        description: FK -> ProcessingPlant.id; the plant that produced this batch of product gas.
      - name: nomination_id
        type: string
        source: system
        description: FK -> PipelineNomination.id; set when the batch is attached to a nomination, null before that.
      - name: interval_start
        type: datetime
        source: input
        description: Start of the production interval (inclusive).
      - name: interval_end
        type: datetime
        source: input
        description: End of the production interval (exclusive); must be a whole number of hours after interval_start.
      - name: hourly_volumes_mscf
        type: array
        source: input
        description: Per-hour product-gas volumes in thousand standard cubic feet, in chronological order; length must equal the interval length in hours.
        constraints: 1..24 entries, each >= 0
      - name: methane_pct
        type: number
        source: input
        description: Product gas methane content, percent.
        constraints: 0 <= value <= 100
      - name: oxygen_pct
        type: number
        source: input
        description: Product gas oxygen content, percent.
        constraints: 0 <= value <= 25
      - name: co2_pct
        type: number
        source: input
        description: Product gas carbon dioxide content, percent.
        constraints: 0 <= value <= 100
      - name: gross_mmbtu
        type: number
        source: computed
        default: 0
        description: Energy content from calculations.injection_batch_gross_mmbtu (round each hour to 2 dp, then sum, then round to 2 dp).
      - name: metered_mmbtu
        type: number
        source: system
        description: Pipeline-confirmed metered energy from the month-end true-up; null until POST /injection-batches/{id}/meter-trueup is called.
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Injection batch lifecycle state.
        constraints: one of DRAFT, PENDING_ANALYSIS, ON_SPEC, OFF_SPEC, NOMINATED, INJECTED, DIVERTED_TO_FLARE, VOIDED
      - name: spec_failure_reason
        type: enum
        source: computed
        default: NONE
        description: First spec rule violated during analysis, evaluated in the fixed order LOW_METHANE, HIGH_OXYGEN, HIGH_CO2; NONE when the batch is on spec.
        constraints: one of NONE, LOW_METHANE, HIGH_OXYGEN, HIGH_CO2
      - name: void_reason
        type: string
        source: system
        description: Free-text reason recorded when the batch moved to VOIDED; null otherwise.

  - name: AttributeBatch
    parent: null
    common_fields: true
    fields:
      - name: injection_batch_id
        type: string
        source: input
        description: FK -> InjectionBatch.id; the injected volume these environmental attributes are generated from.
      - name: program
        type: enum
        source: input
        description: Environmental attribute program.
        constraints: one of RIN_D3, LCFS
      - name: basis
        type: enum
        source: input
        default: PROVISIONAL_NOMINATED
        description: Which energy quantity the attribute count is computed from - the batch's own gross_mmbtu, or the pipeline-confirmed metered_mmbtu.
        constraints: one of PROVISIONAL_NOMINATED, SETTLED_METERED
      - name: generation_period
        type: string
        source: input
        description: Calendar month the attributes are attributed to, formatted YYYY-MM.
        constraints: matches ^\d{4}-(0[1-9]|1[0-2])$
      - name: energy_basis_mmbtu
        type: number
        source: computed
        default: 0
        description: The MMBtu figure actually used - InjectionBatch.gross_mmbtu when basis is PROVISIONAL_NOMINATED, InjectionBatch.metered_mmbtu when basis is SETTLED_METERED.
      - name: eligibility_factor
        type: number
        source: computed
        default: 1.0
        description: ProcessingPlant.availability_factor_pct / 100 rounded to 4 decimal places, captured at generation time.
      - name: rin_count
        type: integer
        source: computed
        default: 0
        description: D3 RINs generated from calculations.rin_d3_generation; always 0 when program is LCFS.
      - name: ci_project_gco2e_per_mj
        type: number
        source: computed
        description: Project carbon intensity from calculations.lcfs_credit_generation, 3 decimal places; null when program is RIN_D3.
      - name: lcfs_credits
        type: number
        source: computed
        default: 0
        description: LCFS credits from calculations.lcfs_credit_generation, 4 decimal places; always 0 when program is RIN_D3.
      - name: status
        type: enum
        source: system
        default: PENDING
        description: Attribute batch lifecycle state.
        constraints: one of PENDING, GENERATED, QA_HOLD, SEPARATED, RETIRED, REVERSED
      - name: reversal_reason
        type: enum
        source: system
        description: Why the batch was reversed; null unless status is REVERSED.
        constraints: one of UPSTREAM_BATCH_DIVERTED, BASIS_RESTATEMENT, QA_FAILURE, REPORT_REJECTED

  - name: ComplianceReport
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: FK -> LandfillSite.id; the site this regulatory filing covers.
      - name: report_type
        type: enum
        source: input
        description: Which regulatory filing this is.
        constraints: one of NSPS_ANNUAL, QUARTERLY_RIN_QAP, LCFS_QUARTERLY, TITLE_V_SEMIANNUAL
      - name: period
        type: string
        source: input
        description: Reporting period formatted YYYY-Qn; Q1 covers months 01-03, Q2 04-06, Q3 07-09, Q4 10-12.
        constraints: matches ^\d{4}-Q[1-4]$
      - name: nmoc_lb_per_hr_reported
        type: number
        source: input
        description: Reported non-methane organic compound emission rate for the period.
        constraints: value >= 0
      - name: exceedance_flag
        type: boolean
        source: computed
        default: false
        description: True when nmoc_lb_per_hr_reported > LandfillSite.permit_nmoc_limit_lb_per_hr; frozen at creation time.
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Filing lifecycle state; RETURNED loops back to DRAFT for revision.
        constraints: one of DRAFT, SUBMITTED, UNDER_REVIEW, RETURNED, ACCEPTED
      - name: prepared_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who created the report.
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who moved the report to UNDER_REVIEW; null before that.
      - name: revision_count
        type: integer
        source: system
        default: 0
        description: Number of times this report has been RETURNED for revision.
      - name: return_reason
        type: string
        source: system
        description: Reviewer note recorded on the most recent RETURNED transition; null otherwise.
      - name: corrective_action_note
        type: string
        source: system
        description: Note recorded on acceptance of a report whose exceedance_flag is true; null otherwise.
      - name: attached_attribute_batch_count
        type: integer
        source: computed
        default: 0
        description: Count of AttributeBatch rows whose generation_period falls inside this report's period, whose upstream plant belongs to site_id, and whose status IS NOT REVERSED.

  - name: RoyaltyStatement
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: FK -> LandfillSite.id; the host landfill being paid.
      - name: period
        type: string
        source: input
        description: Settlement month formatted YYYY-MM; the settlement window is [first instant of the month, first instant of the next month).
        constraints: matches ^\d{4}-(0[1-9]|1[0-2])$
      - name: allowed_deductions_usd
        type: number
        source: input
        default: 0
        description: Operating deductions permitted under a netback royalty; ignored entirely under GROSS_REVENUE_SHARE.
        constraints: value >= 0
      - name: variant_override
        type: enum
        source: input
        description: When supplied, overrides LandfillSite.royalty_variant for this statement only.
        constraints: one of GROSS_REVENUE_SHARE, NETBACK_SHARE
      - name: variant_applied
        type: enum
        source: computed
        description: variant_override when supplied, otherwise LandfillSite.royalty_variant; frozen at creation.
        constraints: one of GROSS_REVENUE_SHARE, NETBACK_SHARE
      - name: billable_mmbtu
        type: number
        source: computed
        default: 0
        description: Sum of InjectionBatch.gross_mmbtu over batches in status INJECTED whose interval_start is inside the settlement window and whose plant belongs to site_id.
      - name: gas_revenue_usd
        type: number
        source: computed
        default: 0
        description: Commodity revenue for the window from calculations.royalty_settlement.
      - name: attribute_revenue_usd
        type: number
        source: computed
        default: 0
        description: Environmental-attribute revenue for the window from calculations.royalty_settlement.
      - name: gross_revenue_usd
        type: number
        source: computed
        default: 0
        description: gas_revenue_usd + attribute_revenue_usd rounded to 2 decimal places.
      - name: calculated_amount_usd
        type: number
        source: computed
        default: 0
        description: Variant-specific royalty before the floor is applied.
      - name: floor_amount_usd
        type: number
        source: computed
        default: 0
        description: billable_mmbtu * LandfillSite.royalty_floor_usd_per_mmbtu rounded to 2 decimal places.
      - name: royalty_amount_usd
        type: number
        source: computed
        default: 0
        description: max(calculated_amount_usd, floor_amount_usd).
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Statement lifecycle state.
        constraints: one of DRAFT, ISSUED, DISPUTED, PAID
      - name: dispute_reason
        type: string
        source: system
        description: Reason recorded when the statement moved to DISPUTED; null otherwise.

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: GasWell
    state_field: operating_state
    initial_state: ONLINE
    terminal_states: [DECOMMISSIONED]
    shape: cyclic
    transitions:
      - from: ONLINE
        to: THROTTLED
        trigger: "POST /wells/{id}/readings producing quality_class == WATCH (automatic)"
        actor: system
        preconditions:
          - "GasWell.operating_state == ONLINE"
        side_effects:
          - "GasWell.current_flow_scfm := round(min(reading.flow_scfm, GasWell.target_flow_scfm * 0.60), 2)"
          - "GasWell.consecutive_good_readings := 0"
          - "GasWell.last_quality_class := WATCH; last_reading_at := reading.taken_at; last_reading_flow_scfm := reading.flow_scfm; wellhead_vacuum_inhg := reading.vacuum_inhg"
          - "Recompute LandfillSite.collected_flow_scfm and LandfillSite.collection_efficiency_pct for GasWell.site_id"
          - "If the recomputed LandfillSite.collected_flow_scfm < ProcessingPlant.min_feed_scfm for any ProcessingPlant of that site whose process_mode == UPGRADING, that plant takes its UPGRADING -> FLARING transition (cascade hop 3)"
      - from: THROTTLED
        to: THROTTLED
        trigger: "POST /wells/{id}/readings producing quality_class == WATCH (automatic, self-loop)"
        actor: system
        preconditions:
          - "GasWell.operating_state == THROTTLED"
        side_effects:
          - "GasWell.current_flow_scfm := round(min(reading.flow_scfm, GasWell.target_flow_scfm * 0.60), 2)"
          - "GasWell.consecutive_good_readings := 0"
          - "Recompute LandfillSite.collected_flow_scfm and LandfillSite.collection_efficiency_pct"
      - from: ONLINE
        to: ONLINE
        trigger: "POST /wells/{id}/readings producing quality_class == GOOD (automatic, self-loop)"
        actor: system
        preconditions:
          - "GasWell.operating_state == ONLINE"
        side_effects:
          - "GasWell.current_flow_scfm := reading.flow_scfm"
          - "GasWell.consecutive_good_readings += 1"
          - "GasWell.last_quality_class := GOOD; last_reading_at := reading.taken_at; last_reading_flow_scfm := reading.flow_scfm; wellhead_vacuum_inhg := reading.vacuum_inhg"
          - "Recompute LandfillSite.collected_flow_scfm and LandfillSite.collection_efficiency_pct"
        note: "A GOOD reading never promotes a well by itself; promotion out of THROTTLED or ISOLATED is always an explicit POST /wells/{id}/status."
      - from: THROTTLED
        to: THROTTLED
        trigger: "POST /wells/{id}/readings producing quality_class == GOOD (automatic, self-loop)"
        actor: system
        preconditions:
          - "GasWell.operating_state == THROTTLED"
        side_effects:
          - "GasWell.current_flow_scfm := round(min(reading.flow_scfm, GasWell.target_flow_scfm * 0.60), 2) - a GOOD reading never lifts a throttled well above its throttled cap"
          - "GasWell.consecutive_good_readings += 1"
          - "Recompute LandfillSite.collected_flow_scfm and LandfillSite.collection_efficiency_pct"
      - from: ISOLATED
        to: ISOLATED
        trigger: "POST /wells/{id}/readings on an isolated well, any quality_class (automatic, self-loop)"
        actor: system
        preconditions:
          - "GasWell.operating_state == ISOLATED"
        side_effects:
          - "GasWell.current_flow_scfm stays 0 - an isolated well contributes nothing to LandfillSite.collected_flow_scfm regardless of how good the gas looks"
          - "GasWell.consecutive_good_readings += 1 when quality_class == GOOD, else := 0"
          - "GasWell.last_quality_class, last_reading_at, last_reading_flow_scfm and wellhead_vacuum_inhg are refreshed"
        note: "This self-loop is what accumulates the recovery evidence that ISOLATED -> THROTTLED demands."
      - from: ONLINE
        to: ISOLATED
        trigger: "POST /wells/{id}/readings producing quality_class == ALARM (automatic)"
        actor: system
        preconditions:
          - "GasWell.operating_state == ONLINE"
        side_effects:
          - "GasWell.current_flow_scfm := 0"
          - "GasWell.consecutive_good_readings := 0"
          - "GasWell.last_quality_class := ALARM"
          - "Recompute LandfillSite.collected_flow_scfm and LandfillSite.collection_efficiency_pct for GasWell.site_id (cascade hop 2)"
          - "If the recomputed LandfillSite.collected_flow_scfm < ProcessingPlant.min_feed_scfm for a ProcessingPlant of that site whose process_mode == UPGRADING, that plant takes UPGRADING -> FLARING (cascade hop 3)"
        note: "Head of the wellfield-shortfall cascade; hops 4 and 5 are declared on the ProcessingPlant UPGRADING -> FLARING transition."
      - from: THROTTLED
        to: ISOLATED
        trigger: "POST /wells/{id}/readings producing quality_class == ALARM (automatic)"
        actor: system
        preconditions:
          - "GasWell.operating_state == THROTTLED"
        side_effects:
          - "GasWell.current_flow_scfm := 0"
          - "GasWell.consecutive_good_readings := 0"
          - "Recompute LandfillSite.collected_flow_scfm and LandfillSite.collection_efficiency_pct; propagate the shortfall check to the site's UPGRADING plants"
      - from: ISOLATED
        to: THROTTLED
        trigger: "POST /wells/{id}/status with to_state == THROTTLED"
        actor: WellfieldTechnician
        preconditions:
          - "GasWell.operating_state == ISOLATED"
          - "GasWell.last_quality_class == GOOD"
          - "GasWell.consecutive_good_readings >= 2"
        side_effects:
          - "GasWell.current_flow_scfm := round(min(GasWell.last_reading_flow_scfm, GasWell.target_flow_scfm * 0.60), 2)"
          - "Recompute LandfillSite.collected_flow_scfm and LandfillSite.collection_efficiency_pct"
          - "If the recomputed LandfillSite.collected_flow_scfm >= ProcessingPlant.min_feed_scfm for a ProcessingPlant of that site whose process_mode == FLARING and spec_status == ON_SPEC, that plant takes FLARING -> UPGRADING"
      - from: THROTTLED
        to: ONLINE
        trigger: "POST /wells/{id}/status with to_state == ONLINE"
        actor: WellfieldTechnician
        preconditions:
          - "GasWell.operating_state == THROTTLED"
          - "GasWell.last_quality_class == GOOD"
          - "GasWell.consecutive_good_readings >= 3"
        side_effects:
          - "GasWell.current_flow_scfm := GasWell.last_reading_flow_scfm"
          - "Recompute LandfillSite.collected_flow_scfm and LandfillSite.collection_efficiency_pct; run the same FLARING -> UPGRADING recovery check as ISOLATED -> THROTTLED"
        note: "Closes the ONLINE -> ISOLATED -> THROTTLED -> ONLINE recovery cycle."
      - from: ONLINE
        to: MAINTENANCE_LOCKOUT
        trigger: "POST /work-orders/{id}/status with to_status == IN_PROGRESS"
        actor: WellfieldTechnician
        preconditions:
          - "GasWell.operating_state IN {ONLINE, THROTTLED, ISOLATED}"
        side_effects:
          - "GasWell.lockout_work_order_id := WorkOrder.id"
          - "GasWell.current_flow_scfm := 0"
          - "Recompute LandfillSite.collected_flow_scfm and LandfillSite.collection_efficiency_pct; propagate the shortfall check to the site's UPGRADING plants"
      - from: THROTTLED
        to: MAINTENANCE_LOCKOUT
        trigger: "POST /work-orders/{id}/status with to_status == IN_PROGRESS"
        actor: WellfieldTechnician
        preconditions:
          - "GasWell.operating_state == THROTTLED"
        side_effects:
          - "Same as ONLINE -> MAINTENANCE_LOCKOUT"
      - from: ISOLATED
        to: MAINTENANCE_LOCKOUT
        trigger: "POST /work-orders/{id}/status with to_status == IN_PROGRESS"
        actor: WellfieldTechnician
        preconditions:
          - "GasWell.operating_state == ISOLATED"
        side_effects:
          - "Same as ONLINE -> MAINTENANCE_LOCKOUT"
      - from: MAINTENANCE_LOCKOUT
        to: ISOLATED
        trigger: "POST /work-orders/{id}/status with to_status == COMPLETED"
        actor: WellfieldTechnician
        preconditions:
          - "GasWell.operating_state == MAINTENANCE_LOCKOUT"
          - "GasWell.lockout_work_order_id == WorkOrder.id"
        side_effects:
          - "GasWell.lockout_work_order_id := null"
          - "GasWell.consecutive_good_readings := 0"
          - "GasWell.current_flow_scfm stays 0 until the well is manually returned to service"
        note: "A completed job always drops the well back to ISOLATED, never straight to ONLINE; recovery requires fresh GOOD readings."
      - from: ONLINE
        to: DECOMMISSIONED
        trigger: "POST /wells/{id}/status with to_state == DECOMMISSIONED"
        actor: ProjectAdmin
        preconditions:
          - "GasWell.operating_state IN {ONLINE, THROTTLED, ISOLATED}"
        side_effects:
          - "GasWell.current_flow_scfm := 0"
          - "Recompute LandfillSite.collected_flow_scfm and LandfillSite.collection_efficiency_pct (the well leaves the target-flow denominator as well)"
        note: "WorkOrder rows in PLANNED against this well are deliberately left untouched; they can never start because the well is DECOMMISSIONED, and they keep occupying their buffered lockout window."
      - from: THROTTLED
        to: DECOMMISSIONED
        trigger: "POST /wells/{id}/status with to_state == DECOMMISSIONED"
        actor: ProjectAdmin
        preconditions:
          - "GasWell.operating_state == THROTTLED"
        side_effects:
          - "Same as ONLINE -> DECOMMISSIONED"
      - from: ISOLATED
        to: DECOMMISSIONED
        trigger: "POST /wells/{id}/status with to_state == DECOMMISSIONED"
        actor: ProjectAdmin
        preconditions:
          - "GasWell.operating_state == ISOLATED"
        side_effects:
          - "Same as ONLINE -> DECOMMISSIONED"

  - entity: WorkOrder
    state_field: status
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    shape: branching
    transitions:
      - from: PLANNED
        to: IN_PROGRESS
        trigger: "POST /work-orders/{id}/status with to_status == IN_PROGRESS"
        actor: WellfieldTechnician
        preconditions:
          - "WorkOrder.status == PLANNED"
          - "GasWell.operating_state IN {ONLINE, THROTTLED, ISOLATED} (a DECOMMISSIONED well rejects with ERR_WELL_DECOMMISSIONED)"
          - "current_utc IN [WorkOrder.window_start, WorkOrder.window_end]"
        side_effects:
          - "WorkOrder.actual_start_at := current_utc"
          - "The well takes its {ONLINE|THROTTLED|ISOLATED} -> MAINTENANCE_LOCKOUT transition"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /work-orders/{id}/status with to_status == COMPLETED"
        actor: WellfieldTechnician
        preconditions:
          - "WorkOrder.status == IN_PROGRESS"
        side_effects:
          - "WorkOrder.actual_end_at := current_utc"
          - "WorkOrder.condensate_gallons_removed := sum of CondensateHaul.gallons for this work order"
          - "The well takes MAINTENANCE_LOCKOUT -> ISOLATED"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/status with to_status == CANCELLED"
        actor: WellfieldTechnician
        preconditions:
          - "WorkOrder.status == PLANNED"
        side_effects:
          - "The buffered lockout window is released, so a later work order may occupy it"
        note: "IN_PROGRESS work orders cannot be cancelled; they must be completed."

  - entity: ProcessingPlant
    state_field: process_mode
    initial_state: STARTUP
    terminal_states: [DECOMMISSIONED]
    shape: cyclic
    transitions:
      - from: STARTUP
        to: UPGRADING
        trigger: "POST /plants/{id}/status with process_mode == UPGRADING"
        actor: PlantOperator
        preconditions:
          - "ProcessingPlant.process_mode == STARTUP"
          - "ProcessingPlant.spec_status == ON_SPEC"
          - "LandfillSite.collected_flow_scfm >= ProcessingPlant.min_feed_scfm"
        side_effects: ["ProcessingPlant.updated_at and version advance"]
      - from: STARTUP
        to: FLARING
        trigger: "POST /plants/{id}/status with process_mode == FLARING"
        actor: PlantOperator
        preconditions: ["ProcessingPlant.process_mode == STARTUP"]
        side_effects: ["ProcessingPlant.updated_at and version advance"]
      - from: UPGRADING
        to: FLARING
        trigger: "POST /plants/{id}/status with process_mode == FLARING, or automatically when LandfillSite.collected_flow_scfm drops below ProcessingPlant.min_feed_scfm"
        actor: PlantOperator | system
        preconditions: ["ProcessingPlant.process_mode == UPGRADING"]
        side_effects:
          - "ProcessingPlant.spec_status := OFF_SPEC when the transition was automatic (wellfield shortfall); a manual FLARING switch leaves spec_status untouched"
          - "When the transition was automatic, open a DowntimeEvent with plant_id = this plant, cause = WELLFIELD_SHORTFALL, disposition = FLARED, start_at = current_utc, status = OPEN, auto_generated = true"
          - "Every InjectionBatch of this plant with status IN {DRAFT, PENDING_ANALYSIS, ON_SPEC, NOMINATED} takes its -> DIVERTED_TO_FLARE transition (cascade hop 4)"
          - "Each such divert credits LandfillSite.energy_produced_mmbtu and LandfillSite.energy_flared_mmbtu by that batch's gross_mmbtu, and any PipelineNomination the batch was attached to takes CONFIRMED|SCHEDULED -> CURTAILED with curtail_reason = 'UPSTREAM_DIVERT' (cascade hop 5)"
        note: "Hops 4 and 5 of the wellfield-shortfall cascade that starts at GasWell ONLINE -> ISOLATED."
      - from: FLARING
        to: UPGRADING
        trigger: "POST /plants/{id}/status with process_mode == UPGRADING, or automatically when LandfillSite.collected_flow_scfm recovers to >= ProcessingPlant.min_feed_scfm"
        actor: PlantOperator | system
        preconditions:
          - "ProcessingPlant.process_mode == FLARING"
          - "ProcessingPlant.spec_status == ON_SPEC"
          - "LandfillSite.collected_flow_scfm >= ProcessingPlant.min_feed_scfm"
        side_effects:
          - "Every DowntimeEvent of this plant with status == OPEN and auto_generated == true is closed with end_at = current_utc, flared_mmbtu = 0, vented_mmbtu = 0"
          - "Recompute ProcessingPlant.availability_factor_pct, downtime_minutes_mtd and flare_minutes_mtd"
      - from: UPGRADING
        to: DOWN
        trigger: "POST /plants/{id}/status with process_mode == DOWN"
        actor: PlantOperator
        preconditions: ["ProcessingPlant.process_mode == UPGRADING"]
        side_effects:
          - "Every InjectionBatch of this plant with status IN {DRAFT, PENDING_ANALYSIS, ON_SPEC, NOMINATED} takes its -> DIVERTED_TO_FLARE transition with the same ledger and nomination consequences"
      - from: FLARING
        to: DOWN
        trigger: "POST /plants/{id}/status with process_mode == DOWN"
        actor: PlantOperator
        preconditions: ["ProcessingPlant.process_mode == FLARING"]
        side_effects: ["Any OPEN auto_generated DowntimeEvent stays open"]
      - from: DOWN
        to: STARTUP
        trigger: "POST /plants/{id}/status with process_mode == STARTUP"
        actor: PlantOperator
        preconditions: ["ProcessingPlant.process_mode == DOWN"]
        side_effects: ["ProcessingPlant.updated_at and version advance"]
      - from: DOWN
        to: DECOMMISSIONED
        trigger: "POST /plants/{id}/status with process_mode == DECOMMISSIONED"
        actor: ProjectAdmin
        preconditions: ["ProcessingPlant.process_mode == DOWN"]
        side_effects: ["Plant is permanently retired; no further mode or spec transitions are accepted"]

  - entity: ProcessingPlant
    state_field: spec_status
    initial_state: ON_SPEC
    terminal_states: []
    shape: cyclic
    note: "Second, independent state dimension on the same ProcessingPlant row. spec_status and process_mode advance on their own triggers; neither one forces the other except where a transition's side_effects say so explicitly."
    transitions:
      - from: ON_SPEC
        to: OFF_SPEC
        trigger: "An InjectionBatch of this plant takes PENDING_ANALYSIS -> OFF_SPEC (automatic), or the wellfield-shortfall UPGRADING -> FLARING cascade fires"
        actor: system
        preconditions: ["ProcessingPlant.spec_status == ON_SPEC"]
        side_effects:
          - "Further InjectionBatch -> NOMINATED transitions on this plant are rejected with ERR_PLANT_OFF_SPEC until spec_status returns to ON_SPEC"
      - from: OFF_SPEC
        to: QUARANTINE
        trigger: "POST /plants/{id}/status with spec_status == QUARANTINE"
        actor: PlantOperator
        preconditions: ["ProcessingPlant.spec_status == OFF_SPEC"]
        side_effects: ["ProcessingPlant.updated_at and version advance"]
      - from: QUARANTINE
        to: ON_SPEC
        trigger: "POST /plants/{id}/status with spec_status == ON_SPEC"
        actor: PlantOperator
        preconditions:
          - "ProcessingPlant.spec_status == QUARANTINE"
          - "No InjectionBatch of this plant remains in status OFF_SPEC"
        side_effects: ["ProcessingPlant.updated_at and version advance"]
        note: "OFF_SPEC -> ON_SPEC directly is not a declared transition; the quarantine step is mandatory."

  - entity: InjectionBatch
    state_field: status
    initial_state: DRAFT
    terminal_states: [INJECTED, DIVERTED_TO_FLARE, VOIDED]
    shape: branching
    transitions:
      - from: DRAFT
        to: PENDING_ANALYSIS
        trigger: "POST /injection-batches/{id}/status with to_status == PENDING_ANALYSIS"
        actor: PlantOperator
        preconditions:
          - "InjectionBatch.status == DRAFT"
          - "ProcessingPlant.process_mode == UPGRADING"
        side_effects:
          - "The server immediately evaluates the batch against the plant's injection spec and auto-advances to ON_SPEC or OFF_SPEC in the same request"
        note: "The batch's own state check (status == DRAFT) is the priority-80 gate; the plant's process_mode gate is a priority-90 safety check reported as ERR_PLANT_NOT_UPGRADING, so a DRAFT batch under a STARTUP plant returns ERR_PLANT_NOT_UPGRADING, never ERR_INVALID_TRANSITION."
      - from: PENDING_ANALYSIS
        to: ON_SPEC
        trigger: "Automatic spec evaluation (no spec rule violated)"
        actor: system
        preconditions:
          - "methane_pct >= ProcessingPlant.spec_min_methane_pct"
          - "oxygen_pct <= ProcessingPlant.spec_max_oxygen_pct"
          - "co2_pct <= ProcessingPlant.spec_max_co2_pct"
        side_effects: ["InjectionBatch.spec_failure_reason := NONE"]
      - from: PENDING_ANALYSIS
        to: OFF_SPEC
        trigger: "Automatic spec evaluation (at least one spec rule violated)"
        actor: system
        preconditions: ["At least one of the three spec comparisons fails"]
        side_effects:
          - "InjectionBatch.spec_failure_reason := the first violated rule in the fixed order LOW_METHANE, HIGH_OXYGEN, HIGH_CO2"
          - "ProcessingPlant takes its spec_status ON_SPEC -> OFF_SPEC transition when it was ON_SPEC"
        note: "Divergent branch: the OFF_SPEC leg mutates the plant's spec dimension, the ON_SPEC leg does not."
      - from: ON_SPEC
        to: NOMINATED
        trigger: "POST /injection-batches/{id}/status with to_status == NOMINATED and nomination_id"
        actor: CommercialScheduler
        preconditions:
          - "InjectionBatch.status == ON_SPEC"
          - "PipelineNomination.status == CONFIRMED or SCHEDULED"
          - "PipelineNomination.plant_id == InjectionBatch.plant_id"
          - "ProcessingPlant.process_mode == UPGRADING"
          - "ProcessingPlant.spec_status == ON_SPEC"
          - "PipelineNomination.committed_dth + InjectionBatch.gross_mmbtu <= PipelineNomination.nominated_dth"
        side_effects:
          - "InjectionBatch.nomination_id := the supplied nomination"
          - "PipelineNomination.committed_dth += InjectionBatch.gross_mmbtu"
          - "PipelineNomination takes CONFIRMED -> SCHEDULED when it was CONFIRMED"
      - from: NOMINATED
        to: INJECTED
        trigger: "POST /injection-batches/{id}/status with to_status == INJECTED"
        actor: PlantOperator
        preconditions:
          - "InjectionBatch.status == NOMINATED"
          - "ProcessingPlant.process_mode == UPGRADING"
        side_effects:
          - "LandfillSite.energy_produced_mmbtu += InjectionBatch.gross_mmbtu"
          - "LandfillSite.energy_injected_mmbtu += InjectionBatch.gross_mmbtu"
          - "PipelineNomination.delivered_dth += InjectionBatch.gross_mmbtu"
          - "OfftakeContract.delivered_dth_mtd += InjectionBatch.gross_mmbtu"
          - "PipelineNomination takes SCHEDULED -> DELIVERED when delivered_dth >= nominated_dth"
      - from: ON_SPEC
        to: DIVERTED_TO_FLARE
        trigger: "POST /injection-batches/{id}/status with to_status == DIVERTED_TO_FLARE, or the plant's UPGRADING -> FLARING / UPGRADING -> DOWN cascade"
        actor: PlantOperator | system
        preconditions: ["InjectionBatch.status IN {DRAFT, PENDING_ANALYSIS, ON_SPEC, OFF_SPEC, NOMINATED}"]
        side_effects:
          - "LandfillSite.energy_produced_mmbtu += InjectionBatch.gross_mmbtu"
          - "LandfillSite.energy_flared_mmbtu += InjectionBatch.gross_mmbtu"
          - "When the batch had a nomination_id, PipelineNomination.committed_dth -= InjectionBatch.gross_mmbtu and the nomination takes CONFIRMED|SCHEDULED -> CURTAILED"
      - from: OFF_SPEC
        to: DIVERTED_TO_FLARE
        trigger: "POST /injection-batches/{id}/status with to_status == DIVERTED_TO_FLARE"
        actor: PlantOperator
        preconditions: ["InjectionBatch.status == OFF_SPEC"]
        side_effects: ["Same ledger effects as ON_SPEC -> DIVERTED_TO_FLARE"]
      - from: INJECTED
        to: VOIDED
        trigger: "POST /injection-batches/{id}/status with to_status == VOIDED and void_reason"
        actor: PlantOperator
        preconditions: ["InjectionBatch.status == INJECTED"]
        side_effects:
          - "LandfillSite.energy_produced_mmbtu -= InjectionBatch.gross_mmbtu"
          - "LandfillSite.energy_injected_mmbtu -= InjectionBatch.gross_mmbtu"
          - "PipelineNomination.delivered_dth -= InjectionBatch.gross_mmbtu and committed_dth -= InjectionBatch.gross_mmbtu"
          - "OfftakeContract.delivered_dth_mtd -= InjectionBatch.gross_mmbtu"
          - "Every AttributeBatch of this injection batch with status IN {PENDING, GENERATED, QA_HOLD, SEPARATED} takes -> REVERSED with reversal_reason = UPSTREAM_BATCH_DIVERTED"
      - from: DIVERTED_TO_FLARE
        to: VOIDED
        trigger: "POST /injection-batches/{id}/status with to_status == VOIDED and void_reason"
        actor: PlantOperator
        preconditions: ["InjectionBatch.status == DIVERTED_TO_FLARE"]
        side_effects:
          - "LandfillSite.energy_produced_mmbtu -= InjectionBatch.gross_mmbtu"
          - "LandfillSite.energy_flared_mmbtu -= InjectionBatch.gross_mmbtu"
        note: "Compensating leg: the divert credited produced+flared, the void debits exactly the same two buckets, so energy_produced_mmbtu == energy_injected_mmbtu + energy_flared_mmbtu + energy_vented_mmbtu holds before and after."
      - from: DRAFT
        to: VOIDED
        trigger: "POST /injection-batches/{id}/status with to_status == VOIDED and void_reason"
        actor: PlantOperator
        preconditions: ["InjectionBatch.status IN {DRAFT, ON_SPEC, OFF_SPEC}"]
        side_effects: ["No ledger movement - the batch never entered any energy bucket"]

  - entity: PipelineNomination
    state_field: status
    initial_state: DRAFT
    terminal_states: [DELIVERED, CURTAILED, CANCELLED]
    shape: branching
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /pipeline-nominations/{id}/status with to_status == CONFIRMED"
        actor: CommercialScheduler | Offtaker
        preconditions:
          - "PipelineNomination.status == DRAFT"
          - "OfftakeContract.status == ACTIVE"
          - "When the actor is Offtaker, X-User-ID == PipelineNomination.contract_id"
        side_effects: ["PipelineNomination.updated_at and version advance"]
      - from: CONFIRMED
        to: SCHEDULED
        trigger: "An InjectionBatch takes ON_SPEC -> NOMINATED against this nomination (automatic)"
        actor: system
        preconditions: ["PipelineNomination.status == CONFIRMED"]
        side_effects: ["PipelineNomination.committed_dth increases by the batch's gross_mmbtu"]
      - from: SCHEDULED
        to: DELIVERED
        trigger: "An InjectionBatch takes NOMINATED -> INJECTED pushing delivered_dth >= nominated_dth (automatic)"
        actor: system
        preconditions:
          - "PipelineNomination.status == SCHEDULED"
          - "PipelineNomination.delivered_dth >= PipelineNomination.nominated_dth"
        side_effects: ["No further batches may be attached"]
      - from: CONFIRMED
        to: CURTAILED
        trigger: "POST /pipeline-nominations/{id}/status with to_status == CURTAILED and curtail_reason, or the upstream divert cascade"
        actor: CommercialScheduler | system
        preconditions: ["PipelineNomination.status IN {CONFIRMED, SCHEDULED}"]
        side_effects:
          - "PipelineNomination.curtail_reason is recorded"
          - "The nomination stops occupying receipt-point capacity for later overlap checks"
      - from: SCHEDULED
        to: CURTAILED
        trigger: "POST /pipeline-nominations/{id}/status with to_status == CURTAILED and curtail_reason, or the upstream divert cascade"
        actor: CommercialScheduler | system
        preconditions: ["PipelineNomination.status == SCHEDULED"]
        side_effects: ["Same as CONFIRMED -> CURTAILED"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /pipeline-nominations/{id}/status with to_status == CANCELLED"
        actor: CommercialScheduler
        preconditions: ["PipelineNomination.status == DRAFT"]
        side_effects: ["The window is released for receipt-point capacity purposes"]

  - entity: AttributeBatch
    state_field: status
    initial_state: PENDING
    terminal_states: [RETIRED, REVERSED]
    shape: cyclic
    transitions:
      - from: PENDING
        to: GENERATED
        trigger: "POST /attribute-batches (automatic, in the creation request)"
        actor: system
        preconditions:
          - "InjectionBatch.status == INJECTED"
          - "When basis == SETTLED_METERED, InjectionBatch.metered_mmbtu is not null"
        side_effects:
          - "AttributeBatch.rin_count / lcfs_credits / ci_project_gco2e_per_mj / energy_basis_mmbtu / eligibility_factor are populated"
          - "For program RIN_D3: LandfillSite.rin_generated_total += rin_count and LandfillSite.rin_available_count += rin_count"
      - from: GENERATED
        to: QA_HOLD
        trigger: "POST /attribute-batches/{id}/status with to_status == QA_HOLD, or the compliance-report RETURNED cascade"
        actor: ComplianceOfficer | system
        preconditions: ["AttributeBatch.status == GENERATED"]
        side_effects:
          - "LandfillSite RIN buckets are unchanged - QA_HOLD attributes are still counted in rin_available_count"
          - "When the hold came from the report cascade, every RoyaltyStatement of the site with status ISSUED whose period falls inside the report period takes ISSUED -> DISPUTED (cascade hop 3)"
      - from: QA_HOLD
        to: GENERATED
        trigger: "POST /attribute-batches/{id}/status with to_status == GENERATED"
        actor: ComplianceOfficer
        preconditions: ["AttributeBatch.status == QA_HOLD"]
        side_effects: ["No ledger movement"]
        note: "Closes the GENERATED -> QA_HOLD -> GENERATED review loop."
      - from: GENERATED
        to: SEPARATED
        trigger: "POST /attribute-batches/{id}/status with to_status == SEPARATED"
        actor: ComplianceOfficer
        preconditions:
          - "AttributeBatch.status == GENERATED"
          - "A ComplianceReport exists with site_id == the site behind this attribute batch, status == ACCEPTED, period covering AttributeBatch.generation_period, and report_type == QUARTERLY_RIN_QAP for program RIN_D3 or LCFS_QUARTERLY for program LCFS"
        side_effects: ["No ledger movement - separated attributes remain in rin_available_count"]
      - from: SEPARATED
        to: RETIRED
        trigger: "POST /attribute-batches/{id}/status with to_status == RETIRED"
        actor: ComplianceOfficer
        preconditions: ["AttributeBatch.status == SEPARATED"]
        side_effects:
          - "For program RIN_D3: LandfillSite.rin_available_count -= rin_count and LandfillSite.rin_retired_count += rin_count"
      - from: GENERATED
        to: REVERSED
        trigger: "POST /attribute-batches/{id}/status with to_status == REVERSED and reason, or the upstream void/divert cascade"
        actor: ComplianceOfficer | system
        preconditions: ["AttributeBatch.status IN {PENDING, GENERATED, QA_HOLD, SEPARATED}"]
        side_effects:
          - "AttributeBatch.reversal_reason := the supplied reason"
          - "For program RIN_D3: LandfillSite.rin_available_count -= rin_count and LandfillSite.rin_reversed_count += rin_count"
        note: "Compensating leg of generation: rin_generated_total is never reduced, so rin_available_count + rin_retired_count + rin_reversed_count == rin_generated_total holds before and after."
      - from: SEPARATED
        to: REVERSED
        trigger: "POST /attribute-batches/{id}/status with to_status == REVERSED and reason"
        actor: ComplianceOfficer
        preconditions: ["AttributeBatch.status == SEPARATED"]
        side_effects: ["Same as GENERATED -> REVERSED"]
      - from: QA_HOLD
        to: REVERSED
        trigger: "POST /attribute-batches/{id}/status with to_status == REVERSED and reason"
        actor: ComplianceOfficer
        preconditions: ["AttributeBatch.status == QA_HOLD"]
        side_effects: ["Same as GENERATED -> REVERSED"]

  - entity: ComplianceReport
    state_field: status
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /compliance-reports/{id}/status with to_status == SUBMITTED"
        actor: ComplianceOfficer
        preconditions:
          - "ComplianceReport.status == DRAFT"
          - "X-User-ID == ComplianceReport.prepared_by_user_id"
        side_effects: ["LandfillSite.compliance_posture is recomputed"]
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /compliance-reports/{id}/status with to_status == UNDER_REVIEW"
        actor: ComplianceOfficer
        preconditions:
          - "ComplianceReport.status == SUBMITTED"
          - "X-User-ID != ComplianceReport.prepared_by_user_id"
        side_effects: ["ComplianceReport.reviewed_by_user_id := X-User-ID"]
      - from: UNDER_REVIEW
        to: RETURNED
        trigger: "POST /compliance-reports/{id}/status with to_status == RETURNED and return_reason"
        actor: ComplianceOfficer
        preconditions:
          - "ComplianceReport.status == UNDER_REVIEW"
          - "X-User-ID == ComplianceReport.reviewed_by_user_id"
        side_effects:
          - "ComplianceReport.revision_count += 1 and return_reason is recorded"
          - "Every AttributeBatch with status == GENERATED whose generation_period falls inside this report's period and whose upstream plant belongs to site_id takes GENERATED -> QA_HOLD (cascade hop 2)"
          - "Because at least one attribute batch entered QA_HOLD, every RoyaltyStatement of site_id with status == ISSUED whose period month falls inside this report's period takes ISSUED -> DISPUTED with dispute_reason = 'ATTRIBUTE_QA_HOLD', and LandfillSite.royalty_payable_usd -= that statement's royalty_amount_usd (cascade hop 3)"
          - "LandfillSite.compliance_posture is recomputed"
        note: "Head of the report-return cascade (depth 3)."
      - from: RETURNED
        to: DRAFT
        trigger: "POST /compliance-reports/{id}/status with to_status == DRAFT"
        actor: ComplianceOfficer
        preconditions:
          - "ComplianceReport.status == RETURNED"
          - "X-User-ID == ComplianceReport.prepared_by_user_id"
        side_effects: ["LandfillSite.compliance_posture is recomputed"]
        note: "Closes the DRAFT -> SUBMITTED -> UNDER_REVIEW -> RETURNED -> DRAFT revision cycle."
      - from: UNDER_REVIEW
        to: ACCEPTED
        trigger: "POST /compliance-reports/{id}/status with to_status == ACCEPTED"
        actor: ComplianceOfficer
        preconditions:
          - "ComplianceReport.status == UNDER_REVIEW"
          - "X-User-ID == ComplianceReport.reviewed_by_user_id"
          - "When ComplianceReport.exceedance_flag is true, corrective_action_note must be supplied"
        side_effects:
          - "ComplianceReport.corrective_action_note is recorded when supplied"
          - "AttributeBatch rows of this site and period become eligible for GENERATED -> SEPARATED"
          - "LandfillSite.compliance_posture is recomputed"

  - entity: RoyaltyStatement
    state_field: status
    initial_state: DRAFT
    terminal_states: [PAID]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /royalty-statements/{id}/status with to_status == ISSUED"
        actor: ProjectAdmin
        preconditions: ["RoyaltyStatement.status == DRAFT"]
        side_effects: ["LandfillSite.royalty_payable_usd += RoyaltyStatement.royalty_amount_usd"]
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /royalty-statements/{id}/status with to_status == DISPUTED and dispute_reason, or the compliance-report RETURNED cascade"
        actor: HostRepresentative | system
        preconditions:
          - "RoyaltyStatement.status == ISSUED"
          - "When the actor is HostRepresentative, X-User-ID == RoyaltyStatement.site_id"
        side_effects:
          - "RoyaltyStatement.dispute_reason is recorded"
          - "LandfillSite.royalty_payable_usd -= RoyaltyStatement.royalty_amount_usd"
          - "The (site_id, period) uniqueness slot is released, so a restated statement may be created for the same period"
      - from: DISPUTED
        to: ISSUED
        trigger: "POST /royalty-statements/{id}/status with to_status == ISSUED"
        actor: ProjectAdmin
        preconditions:
          - "RoyaltyStatement.status == DISPUTED"
          - "No other RoyaltyStatement of this site_id and period has status IN {DRAFT, ISSUED, PAID}"
        side_effects:
          - "LandfillSite.royalty_payable_usd += RoyaltyStatement.royalty_amount_usd"
          - "RoyaltyStatement.dispute_reason := null"
        note: "Closes the ISSUED -> DISPUTED -> ISSUED settlement loop."
      - from: ISSUED
        to: PAID
        trigger: "POST /royalty-statements/{id}/status with to_status == PAID"
        actor: ProjectAdmin
        preconditions: ["RoyaltyStatement.status == ISSUED"]
        side_effects: ["LandfillSite.royalty_payable_usd -= RoyaltyStatement.royalty_amount_usd"]

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: nomination-create-stale-contract
    parent_entity: OfftakeContract
    write_endpoint: "POST /pipeline-nominations"
    occ_field: "expected_contract_version"
    description: |
      Creating a PipelineNomination against an OfftakeContract whose version has
      advanced since the client last read it is rejected. A nomination write is
      legitimate on its own terms - the product deliberately allows many
      nominations per contract - so the only thing that separates a well-informed
      write from an uninformed one is whether the client's view of the contract's
      committed volume is still current. The stale-version check makes that
      explicit.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

  - rule_id: royalty-statement-create-stale-site
    parent_entity: LandfillSite
    write_endpoint: "POST /royalty-statements"
    occ_field: "expected_site_version"
    description: |
      Creating a RoyaltyStatement against a LandfillSite whose version has
      advanced since the client last read it is rejected. A restated statement
      legitimately supersedes a disputed one for the same period, so the write
      itself is always valid product-wise; the version check is what guarantees
      the statement was computed from the ledger the client actually saw.
    error_id: ERR_STALE_SITE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: reading_quality_classification
    trigger: "POST /wells/{id}/readings, before any GasWell state transition is applied"
    algorithm: weighted_scoring
    formula: |
      air_intrusion_index = round(
          (oxygen_pct * O2_WEIGHT)
        + (nitrogen_pct * N2_WEIGHT)
        - (methane_pct * CH4_CREDIT_WEIGHT)
        + (max(0, temperature_f - TEMP_PIVOT_F) * TEMP_WEIGHT), 2)

      # Ladder evaluated top-down; the FIRST matching branch wins.
      if oxygen_pct >= O2_ALARM_PCT
         or temperature_f >= TEMP_ALARM_F
         or air_intrusion_index >= AII_ALARM:
             quality_class = ALARM
      elif oxygen_pct >= O2_WATCH_PCT
         or methane_pct < CH4_WATCH_PCT
         or air_intrusion_index >= AII_WATCH:
             quality_class = WATCH
      else:
             quality_class = GOOD
    input_set: "Exactly the four composition/temperature fields of the reading being posted. No prior readings participate."
    constants:
      O2_WEIGHT: 4.0
      N2_WEIGHT: 0.35
      CH4_CREDIT_WEIGHT: 0.05
      TEMP_PIVOT_F: 130.0
      TEMP_WEIGHT: 0.25
      O2_ALARM_PCT: 5.00
      TEMP_ALARM_F: 145.0
      AII_ALARM: 24.00
      O2_WATCH_PCT: 2.00
      CH4_WATCH_PCT: 45.00
      AII_WATCH: 6.00
      THROTTLE_FACTOR: 0.60
    precision: "air_intrusion_index to 2 decimal places, round_half_up; comparisons use the rounded value"
    variants: []
    note: "O2_ALARM_PCT is an inclusive floor: 5.00 alarms, 4.99 does not. AII_ALARM is set at 24.00 precisely so that an oxygen reading in the 4.99-5.00 neighbourhood never trips the index branch, keeping the oxygen boundary observable on its own."

  - name: injection_batch_gross_mmbtu
    trigger: "POST /injection-batches (creation); the result is frozen on the row and never recomputed"
    algorithm: aggregation
    formula: |
      methane_fraction = methane_pct / 100.0
      # STEP 1 - round EACH hour to 2 decimal places first.
      for h in 0 .. len(hourly_volumes_mscf) - 1 (chronological index order as submitted):
          hour_mmbtu[h] = round(hourly_volumes_mscf[h] * methane_fraction * MMBTU_PER_MSCF_CH4, 2)
      # STEP 2 - sum the ALREADY-ROUNDED hourly figures.
      # STEP 3 - round the sum again to 2 decimal places.
      gross_mmbtu = round(sum(hour_mmbtu), 2)
    input_set: "Every element of hourly_volumes_mscf on the batch being created, in submitted index order; no other batch participates."
    constants:
      MMBTU_PER_MSCF_CH4: 1.0122
    precision: "2 decimal places at BOTH steps, round_half_up"
    variants: []
    note: "Rounding order is pinned and load-bearing. Summing the unrounded hourly products and rounding once at the end is a DIFFERENT number: [115.0, 115.0, 115.0] at 97.4% methane gives 340.14 under the pinned order and 340.13 under sum-then-round."

  - name: plant_availability_factor
    trigger: "POST /downtime-events/{id}/close, and whenever an auto_generated DowntimeEvent is closed by the FLARING -> UPGRADING recovery"
    algorithm: interval_merge
    formula: |
      period_start = first instant of the calendar month containing current_utc
      window = [period_start, current_utc)                       # half-open
      candidates = DowntimeEvent rows with plant_id == this plant AND status == CLOSED
      clipped = for each candidate, the intersection of [start_at, end_at) with window
      # Sort clipped intervals by start ASC; tie-break created_at ASC of the source row.
      # Merge: two intervals join when they overlap OR touch (previous end == next start).
      downtime_minutes_mtd = round(total length of the merged union, in minutes, 2)
      flare_minutes_mtd    = round(total length of the merged union restricted to
                                   candidates with disposition == FLARED, in minutes, 2)
      elapsed_minutes = (current_utc - period_start) in minutes
      if elapsed_minutes <= 0:
          availability_factor_pct = 100.00
      else:
          availability_factor_pct = round(100.0 * (elapsed_minutes - downtime_minutes_mtd) / elapsed_minutes, 2)
    input_set: "DowntimeEvent rows of this plant with status == CLOSED only; OPEN rows contribute nothing."
    constants: {}
    precision: "minutes and percentages to 2 decimal places, round_half_up"
    variants: []
    note: "Touching intervals (end_at of one equals start_at of the next) merge into one contiguous block, so their union is counted once rather than twice."

  - name: rin_d3_generation
    trigger: "POST /attribute-batches with program == RIN_D3, during the PENDING -> GENERATED auto-transition"
    algorithm: threshold
    formula: |
      if basis == PROVISIONAL_NOMINATED:
          energy_basis_mmbtu = InjectionBatch.gross_mmbtu
      else:                                     # SETTLED_METERED
          energy_basis_mmbtu = InjectionBatch.metered_mmbtu     # required to be non-null
      eligibility_factor = round(ProcessingPlant.availability_factor_pct / 100.0, 4)
      rin_count = floor(energy_basis_mmbtu * RINS_PER_MMBTU_D3 * eligibility_factor)
      lcfs_credits = 0
      ci_project_gco2e_per_mj = null
    input_set: "One InjectionBatch in status INJECTED plus the availability_factor_pct of its ProcessingPlant at the instant of generation."
    constants:
      RINS_PER_MMBTU_D3: 11.727
    precision: "eligibility_factor to 4 decimal places round_half_up; rin_count truncated toward zero (floor) to an integer"
    variants:
      - name: PROVISIONAL_NOMINATED
        when: "basis == PROVISIONAL_NOMINATED (the default); the pipeline has not yet confirmed a metered quantity"
        difference: "Uses InjectionBatch.gross_mmbtu, the plant's own energy calculation."
      - name: SETTLED_METERED
        when: "basis == SETTLED_METERED, only after POST /injection-batches/{id}/meter-trueup has recorded metered_mmbtu"
        difference: "Uses InjectionBatch.metered_mmbtu instead. The pipeline's meter and the plant's calculation disagree in practice, so the same InjectionBatch yields a different rin_count under each basis."

  - name: lcfs_credit_generation
    trigger: "POST /attribute-batches with program == LCFS, during the PENDING -> GENERATED auto-transition"
    algorithm: constraint_propagation
    formula: |
      energy_basis_mmbtu = gross_mmbtu or metered_mmbtu, selected by `basis` exactly as in rin_d3_generation

      # STEP 1 - flare penalty from the site's CURRENT energy ledger.
      denom = LandfillSite.energy_injected_mmbtu + LandfillSite.energy_flared_mmbtu
      flare_fraction = 0.0000 if denom == 0 else round(LandfillSite.energy_flared_mmbtu / denom, 4)
      flare_penalty  = round(flare_fraction * FLARE_PENALTY_COEFF, 3)
      ci_pre         = round(BASE_CI_LFG_RNG + flare_penalty, 3)

      # STEP 2 - the avoided-methane tier is selected from ci_pre, NOT from the
      #          final ci_project. The dependency looks circular (the credit
      #          lowers the CI, and the CI picks the credit); the evaluation
      #          order below is the one that is pinned.
      if   ci_pre <  CI_TIER_LOW:   avoided_methane_credit = AVOIDED_TIER_A
      elif ci_pre <  CI_TIER_MID:   avoided_methane_credit = AVOIDED_TIER_B
      else:                         avoided_methane_credit = AVOIDED_TIER_C

      # STEP 3 - apply it once. No re-selection, no fixed-point iteration.
      ci_project_gco2e_per_mj = round(ci_pre - avoided_methane_credit, 3)

      # STEP 4 - energy conversion, then the credit itself.
      energy_mj    = round(energy_basis_mmbtu * MJ_PER_MMBTU, 2)
      lcfs_credits = round((CI_BENCHMARK - ci_project_gco2e_per_mj) * EER_CNG * energy_mj / 1000000.0, 4)
      rin_count    = 0
    input_set: "One InjectionBatch in status INJECTED, plus LandfillSite.energy_injected_mmbtu and LandfillSite.energy_flared_mmbtu read at the instant of generation."
    constants:
      BASE_CI_LFG_RNG: 44.000
      FLARE_PENALTY_COEFF: 60.000
      CI_TIER_LOW: 20.000
      CI_TIER_MID: 40.000
      AVOIDED_TIER_A: 22.500
      AVOIDED_TIER_B: 15.000
      AVOIDED_TIER_C: 7.500
      CI_BENCHMARK: 91.980
      EER_CNG: 0.90
      MJ_PER_MMBTU: 1055.06
    precision: "flare_fraction 4 dp; penalties and CI values 3 dp; energy_mj 2 dp; lcfs_credits 4 dp; all round_half_up"
    variants:
      - name: PROVISIONAL_NOMINATED
        when: "basis == PROVISIONAL_NOMINATED"
        difference: "energy_basis_mmbtu is InjectionBatch.gross_mmbtu."
      - name: SETTLED_METERED
        when: "basis == SETTLED_METERED"
        difference: "energy_basis_mmbtu is InjectionBatch.metered_mmbtu."
    note: "With a clean ledger (no flaring) ci_pre is 44.000, which lands in the >= CI_TIER_MID tier, so avoided_methane_credit is 7.500 and ci_project is 36.500. Re-selecting the tier from 36.500 would give 15.000 and a ci_project of 29.000 - a materially larger credit. The pinned order produces 36.500."

  - name: royalty_settlement
    trigger: "POST /royalty-statements; every computed money field is frozen on the row at creation"
    algorithm: waterfall_allocation
    formula: |
      window = [first instant of `period` month, first instant of the following month)   # half-open
      batches = InjectionBatch rows with status == INJECTED
                AND interval_start inside window
                AND ProcessingPlant.site_id == RoyaltyStatement.site_id
                ordered by interval_start ASC, created_at ASC as tie-break
      billable_mmbtu = round(sum over batches of gross_mmbtu, 2)

      # Per-batch rounding is pinned BEFORE the sum.
      gas_revenue_usd = round(sum over batches of
                              round(gross_mmbtu * (the OfftakeContract behind
                                    batch.nomination_id).price_usd_per_dth, 2), 2)

      attrs = AttributeBatch rows whose injection_batch_id is in `batches`
              AND status IN {GENERATED, QA_HOLD, SEPARATED, RETIRED}
      attribute_revenue_usd = round(sum over attrs of
                                    (rin_count * RIN_PRICE_USD) + (lcfs_credits * LCFS_PRICE_USD), 2)

      gross_revenue_usd = round(gas_revenue_usd + attribute_revenue_usd, 2)

      if variant_applied == GROSS_REVENUE_SHARE:
          calculated_amount_usd = round(gross_revenue_usd * LandfillSite.host_royalty_pct, 2)
      else:   # NETBACK_SHARE
          calculated_amount_usd = round(max(0, gross_revenue_usd - allowed_deductions_usd)
                                        * LandfillSite.host_royalty_pct, 2)

      floor_amount_usd   = round(billable_mmbtu * LandfillSite.royalty_floor_usd_per_mmbtu, 2)
      royalty_amount_usd = max(calculated_amount_usd, floor_amount_usd)
    input_set: "InjectionBatch rows in status INJECTED only - DIVERTED_TO_FLARE, VOIDED and NOMINATED batches are excluded. AttributeBatch rows in status REVERSED or PENDING are excluded from attribute revenue."
    constants:
      RIN_PRICE_USD: 2.85
      LCFS_PRICE_USD: 62.00
    precision: "all money to 2 decimal places, round_half_up; per-batch commodity revenue is rounded before summing"
    variants:
      - name: GROSS_REVENUE_SHARE
        when: "variant_applied == GROSS_REVENUE_SHARE (from variant_override, else LandfillSite.royalty_variant)"
        difference: "allowed_deductions_usd is ignored entirely; the host takes its percentage of the whole revenue stack."
      - name: NETBACK_SHARE
        when: "variant_applied == NETBACK_SHARE"
        difference: "allowed_deductions_usd is subtracted from gross_revenue_usd (floored at 0) before the percentage is applied, producing a strictly smaller calculated_amount_usd whenever allowed_deductions_usd > 0."
    note: "An empty batch set is legal: billable_mmbtu, every revenue field, the floor and royalty_amount_usd are all 0.00 and the statement is still created in DRAFT."

  - name: receipt_point_headroom
    trigger: "POST /pipeline-nominations, after the contract MDQ check"
    algorithm: aggregation
    formula: |
      hours = (gas_day_end - gas_day_start) in hours
      hourly_rate_dth = round(nominated_dth / hours, 4)
      overlapping = PipelineNomination rows with plant_id == the requested plant
                    AND status IN {DRAFT, CONFIRMED, SCHEDULED}
                    AND [gas_day_start, gas_day_end) intersects the requested window
      committed_hourly = sum over overlapping of hourly_rate_dth
      cap_hourly = ProcessingPlant.receipt_point_mdq_dth_per_day / 24.0
      # Inclusive cap: landing exactly on cap_hourly is accepted.
      accept when round(committed_hourly + hourly_rate_dth, 4) <= round(cap_hourly, 4)
    input_set: "PipelineNomination rows of the same plant in status DRAFT, CONFIRMED or SCHEDULED. DELIVERED, CURTAILED and CANCELLED rows release their capacity and are excluded."
    constants: {}
    precision: "hourly rates to 4 decimal places, round_half_up"
    variants: []
    note: "Windows are HALF-OPEN: a nomination ending exactly when another starts does not intersect and does not consume shared capacity."

  - name: work_order_lockout_occupancy
    trigger: "POST /work-orders"
    algorithm: interval_merge
    formula: |
      buffer = LOCKOUT_BUFFER_MINUTES
      occupied(w) = [w.window_start - buffer, w.window_end + buffer]        # CLOSED on both ends
      incumbents = WorkOrder rows with well_id == the requested well
                   AND status IN {PLANNED, IN_PROGRESS}
      conflict when occupied(new) intersects occupied(any incumbent),
                 where two CLOSED intervals intersect if they share at least one instant
                 (touching endpoints DO collide)
    input_set: "WorkOrder rows of the same well in status PLANNED or IN_PROGRESS only; COMPLETED and CANCELLED rows release their window."
    constants:
      LOCKOUT_BUFFER_MINUTES: 120
    precision: "instant comparison at whole-second resolution"
    variants: []
    note: "Deliberately the OPPOSITE interval geometry from receipt_point_headroom: closed intervals inflated by a 120-minute purge buffer at each end, exclusive occupancy, no aggregate capacity. Two work orders whose buffered windows merely touch at one instant conflict."

  - name: energy_balance_invariant
    trigger: "Evaluated after every mutation that touches a LandfillSite energy bucket; surfaced by GET /sites/{id}/energy-balance as balance_ok"
    algorithm: aggregation
    formula: |
      balance_ok = (round(energy_produced_mmbtu, 2)
                    == round(energy_injected_mmbtu + energy_flared_mmbtu + energy_vented_mmbtu, 2))
    input_set: "The four LandfillSite energy ledger fields."
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants: []
    note: "Conserved quantity #1 - MMBtu of accounted energy. Every forward action (INJECTED, DIVERTED_TO_FLARE, downtime close with flared_mmbtu/vented_mmbtu) credits produced plus exactly one destination bucket; every compensating action (VOIDED) debits the same pair. The equality therefore holds at every observable instant."

  - name: rin_ledger_invariant
    trigger: "Evaluated after every AttributeBatch transition; surfaced by GET /sites/{id}/energy-balance as rin_ledger_ok"
    algorithm: aggregation
    formula: |
      rin_ledger_ok = (rin_generated_total
                       == rin_available_count + rin_retired_count + rin_reversed_count)
    input_set: "The four LandfillSite RIN counters."
    constants: {}
    precision: "exact integers"
    variants: []
    note: "Conserved quantity #2 - count of D3 RINs. rin_generated_total is monotonic and never reduced; RETIRED and REVERSED move a batch's rin_count out of rin_available_count into the matching bucket, so the identity holds across generate/retire/reverse in any order."

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#      the FIRST failing rule decides the response)
# ---------------------------------------------------------------------------
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "The role in X-User-Role appears in the endpoint's roles list in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 30
    category: existence
    check: "Every resource id in the URL path exists, validated left to right"
    error_id: ERR_SITE_NOT_FOUND | ERR_WELL_NOT_FOUND | ERR_WORK_ORDER_NOT_FOUND | ERR_PLANT_NOT_FOUND | ERR_DOWNTIME_EVENT_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_NOMINATION_NOT_FOUND | ERR_INJECTION_BATCH_NOT_FOUND | ERR_ATTRIBUTE_BATCH_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_ROYALTY_STATEMENT_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 40
    category: business_constraint
    check: "Request body satisfies the declared field schema - required fields present, types correct, enum members recognised, numeric ranges respected, string patterns matched (generation_period YYYY-MM, ComplianceReport.period YYYY-Qn)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "every POST endpoint"

  - priority: 45
    category: business_constraint
    check: "Pagination query parameters are in range - limit between 1 and 100 inclusive, offset >= 0"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "every list endpoint"

  - priority: 50
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row"
    error_id: ERR_SITE_NOT_FOUND | ERR_WELL_NOT_FOUND | ERR_PLANT_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_NOMINATION_NOT_FOUND | ERR_INJECTION_BATCH_NOT_FOUND
    http_status: 404
    applies_to: "POST /wells, POST /plants, POST /offtake-contracts, POST /pipeline-nominations, POST /injection-batches, POST /attribute-batches, POST /compliance-reports, POST /royalty-statements, POST /work-orders, POST /downtime-events, POST /injection-batches/{id}/status (nomination_id)"

  - priority: 55
    category: business_constraint
    check: "Gas composition is physically coherent - methane_pct + oxygen_pct + nitrogen_pct <= 100"
    error_id: ERR_GAS_COMPOSITION_INVALID
    http_status: 422
    applies_to: "POST /wells/{id}/readings"

  - priority: 56
    category: business_constraint
    check: "len(hourly_volumes_mscf) equals the whole number of hours between interval_start and interval_end, and interval_end - interval_start is a whole number of hours"
    error_id: ERR_BATCH_INTERVAL_MISMATCH
    http_status: 422
    applies_to: "POST /injection-batches"

  - priority: 57
    category: business_temporal
    check: "Interval end is strictly after interval start (WorkOrder window_end > window_start, PipelineNomination gas_day_end > gas_day_start, OfftakeContract term_end > term_start, DowntimeEvent end_at > start_at on close)"
    error_id: ERR_INTERVAL_INVALID
    http_status: 422
    applies_to: "POST /work-orders, POST /pipeline-nominations, POST /offtake-contracts, POST /downtime-events/{id}/close"

  - priority: 60
    category: auth
    check: "For entity_backed roles the acting identity owns the resource - HostRepresentative X-User-ID == RoyaltyStatement.site_id; Offtaker X-User-ID == PipelineNomination.contract_id (or the contract id itself on GET /offtake-contracts/{id})"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "GET /royalty-statements/{id}, GET /royalty-statements, POST /royalty-statements/{id}/status, GET /offtake-contracts/{id}, GET /pipeline-nominations/{id}, POST /pipeline-nominations/{id}/status"

  - priority: 65
    category: auth
    check: "Segregation of duties on ComplianceReport - the officer moving a report to UNDER_REVIEW must not be prepared_by_user_id; the officer moving it to RETURNED or ACCEPTED must be reviewed_by_user_id; the officer moving it to SUBMITTED or back to DRAFT must be prepared_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /compliance-reports/{id}/status"

  - priority: 70
    category: business_constraint
    check: "Optimistic concurrency - expected_contract_version equals OfftakeContract.version; expected_site_version equals LandfillSite.version"
    error_id: ERR_STALE_CONTRACT_VERSION | ERR_STALE_SITE_VERSION
    http_status: 412
    applies_to: "POST /pipeline-nominations, POST /royalty-statements"

  - priority: 80
    category: state
    check: "The target resource is in a state from which the requested transition is declared in §1.2 (including GasWell not DECOMMISSIONED - which also blocks POST /work-orders against that well, GasWell not in MAINTENANCE_LOCKOUT for readings, DowntimeEvent not already CLOSED, OfftakeContract ACTIVE before a nomination is written or confirmed, InjectionBatch INJECTED before attributes may be generated). Two carve-outs are reported at priority 90 instead of here, by their own specific errors: an InjectionBatch in status OFF_SPEC pushed toward NOMINATED or INJECTED (ERR_BATCH_OFF_SPEC), and a batch whose plant is not UPGRADING (ERR_PLANT_NOT_UPGRADING)."
    error_id: ERR_INVALID_TRANSITION | ERR_WELL_DECOMMISSIONED | ERR_WELL_IN_LOCKOUT | ERR_DOWNTIME_ALREADY_CLOSED | ERR_CONTRACT_NOT_ACTIVE | ERR_BATCH_NOT_INJECTED
    http_status: 409
    applies_to: "every POST that drives a state transition, plus POST /wells/{id}/readings, POST /work-orders, POST /pipeline-nominations, POST /attribute-batches"

  - priority: 85
    category: business_temporal
    check: "A tuning reading is chronologically after the well's most recent reading - taken_at > GasWell.last_reading_at"
    error_id: ERR_READING_OUT_OF_ORDER
    http_status: 422
    applies_to: "POST /wells/{id}/readings"

  - priority: 90
    category: business_safety
    check: "Process-safety and permit gates - the plant is UPGRADING where the operation requires it (ERR_PLANT_NOT_UPGRADING); the plant's spec_status is ON_SPEC where the operation requires it (ERR_PLANT_OFF_SPEC); the batch itself is not OFF_SPEC (ERR_BATCH_OFF_SPEC); a well being returned to service has enough consecutive GOOD readings (ERR_WELL_NOT_RECOVERED); QUARANTINE -> ON_SPEC leaves no unresolved OFF_SPEC batch (ERR_OFF_SPEC_BATCH_UNRESOLVED); an exceedance report is accepted only with a corrective_action_note (ERR_PERMIT_EXCEEDANCE_UNRESOLVED); hazardous condensate carries an HW- manifest (ERR_CONDENSATE_MANIFEST_REQUIRED); UPGRADING requires collected_flow_scfm >= min_feed_scfm (ERR_INSUFFICIENT_FEED_FLOW)"
    error_id: ERR_PLANT_NOT_UPGRADING | ERR_PLANT_OFF_SPEC | ERR_BATCH_OFF_SPEC | ERR_WELL_NOT_RECOVERED | ERR_OFF_SPEC_BATCH_UNRESOLVED | ERR_PERMIT_EXCEEDANCE_UNRESOLVED | ERR_CONDENSATE_MANIFEST_REQUIRED | ERR_INSUFFICIENT_FEED_FLOW
    http_status: 409 | 422
    applies_to: "POST /plants/{id}/status, POST /wells/{id}/status, POST /injection-batches/{id}/status, POST /work-orders/{id}/condensate-hauls, POST /compliance-reports/{id}/status"

  - priority: 100
    category: business_referential
    check: "Cross-entity prerequisites - AttributeBatch GENERATED -> SEPARATED requires an ACCEPTED ComplianceReport of the matching report_type covering the generation_period (ERR_REPORT_NOT_ACCEPTED); basis SETTLED_METERED requires InjectionBatch.metered_mmbtu to be non-null (ERR_METERED_VOLUME_REQUIRED)"
    error_id: ERR_REPORT_NOT_ACCEPTED | ERR_METERED_VOLUME_REQUIRED
    http_status: 409 | 422
    applies_to: "POST /attribute-batches, POST /attribute-batches/{id}/status"

  - priority: 110
    category: business_temporal
    check: "Window and occupancy rules - buffered closed-interval lockout collision on a well (ERR_WELL_LOCKOUT_CONFLICT); current_utc inside the work order window on start (ERR_WORK_ORDER_WINDOW_NOT_ACTIVE); nomination window inside the contract term (ERR_CONTRACT_TERM_WINDOW); royalty period fully in the past relative to current_utc (ERR_ROYALTY_PERIOD_NOT_CLOSED)"
    error_id: ERR_WELL_LOCKOUT_CONFLICT | ERR_WORK_ORDER_WINDOW_NOT_ACTIVE | ERR_CONTRACT_TERM_WINDOW | ERR_ROYALTY_PERIOD_NOT_CLOSED
    http_status: 409 | 422
    applies_to: "POST /work-orders, POST /work-orders/{id}/status, POST /pipeline-nominations, POST /royalty-statements"

  - priority: 120
    category: business_constraint
    check: "Uniqueness - well_code unique among non-DECOMMISSIONED wells of a site (ERR_WELL_CODE_DUPLICATE); at most one non-REVERSED AttributeBatch per (injection_batch_id, program) (ERR_ATTRIBUTE_DUPLICATE_PROGRAM); at most one RoyaltyStatement per (site_id, period) in status DRAFT, ISSUED or PAID (ERR_ROYALTY_PERIOD_DUPLICATE); at most one ComplianceReport per (site_id, report_type, period) in status other than RETURNED (ERR_REPORT_PERIOD_DUPLICATE)"
    error_id: ERR_WELL_CODE_DUPLICATE | ERR_ATTRIBUTE_DUPLICATE_PROGRAM | ERR_ROYALTY_PERIOD_DUPLICATE | ERR_REPORT_PERIOD_DUPLICATE
    http_status: 409
    applies_to: "POST /wells, POST /attribute-batches, POST /royalty-statements, POST /compliance-reports"

  - priority: 130
    category: business_fiscal
    check: "Capacity and quota - nominated_dth <= OfftakeContract.contract_mdq_dth_per_day (ERR_CONTRACT_MDQ_EXCEEDED); receipt-point pooled hourly rate within ProcessingPlant.receipt_point_mdq_dth_per_day / 24 (ERR_RECEIPT_POINT_CAPACITY_EXCEEDED); PipelineNomination.committed_dth + InjectionBatch.gross_mmbtu <= nominated_dth (ERR_NOMINATION_VOLUME_EXCEEDED)"
    error_id: ERR_CONTRACT_MDQ_EXCEEDED | ERR_RECEIPT_POINT_CAPACITY_EXCEEDED | ERR_NOMINATION_VOLUME_EXCEEDED
    http_status: 409 | 422
    applies_to: "POST /pipeline-nominations, POST /injection-batches/{id}/status"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- LandfillSite -------------------------------------------------------
  - method: POST
    path: "/sites"
    description: "Register a host landfill and its royalty / permit terms."
    roles: [ProjectAdmin]
    code: 201
    input: ["name", "state_code", "host_royalty_pct", "royalty_variant", "permit_nmoc_limit_lb_per_hr", "royalty_floor_usd_per_mmbtu?", "design_collection_efficiency_pct?"]
    output: LandfillSite
    side_effects: ["All energy and RIN ledger counters initialise to 0", "compliance_posture initialises to COMPLIANT"]

  - method: GET
    path: "/sites/{id}"
    description: "Read one landfill site including its live energy and RIN ledgers and its version (the value an OCC royalty write must echo)."
    roles: [ProjectAdmin, ComplianceOfficer, CommercialScheduler, HostRepresentative, PlantOperator, WellfieldTechnician]
    code: 200
    input: []
    output: LandfillSite
    side_effects: []

  - method: GET
    path: "/sites"
    description: "List landfill sites."
    roles: [ProjectAdmin, ComplianceOfficer]
    code: 200
    input: ["state_code?", "compliance_posture?", "limit?", "offset?"]
    output: LandfillSite[]
    side_effects: []

  - method: GET
    path: "/sites/{id}/energy-balance"
    description: "Computed read that surfaces both conserved-quantity invariants for the site."
    roles: [ProjectAdmin, ComplianceOfficer, HostRepresentative]
    code: 200
    input: []
    output: { site_id: string, energy_produced_mmbtu: number, energy_injected_mmbtu: number, energy_flared_mmbtu: number, energy_vented_mmbtu: number, balance_ok: boolean, rin_generated_total: integer, rin_available_count: integer, rin_retired_count: integer, rin_reversed_count: integer, rin_ledger_ok: boolean }
    side_effects: []

  # --- GasWell ------------------------------------------------------------
  - method: POST
    path: "/wells"
    description: "Add an extraction well to a site. The well starts ONLINE with current_flow_scfm 0 until its first reading."
    roles: [ProjectAdmin, WellfieldTechnician]
    code: 201
    input: [site_id, well_code, target_flow_scfm]
    output: GasWell
    side_effects: ["Recomputes LandfillSite.collection_efficiency_pct (the new well joins the target-flow denominator)"]

  - method: GET
    path: "/wells/{id}"
    description: "Read one gas well including its derived flow and quality fields."
    roles: [ProjectAdmin, WellfieldTechnician, PlantOperator, ComplianceOfficer]
    code: 200
    input: []
    output: GasWell
    side_effects: []

  - method: GET
    path: "/wells"
    description: "List gas wells; filterable by owning site and operating state."
    roles: [ProjectAdmin, WellfieldTechnician, PlantOperator, ComplianceOfficer]
    code: 200
    input: ["site_id?", "operating_state?", "limit?", "offset?"]
    output: GasWell[]
    side_effects: []

  - method: POST
    path: "/wells/{id}/readings"
    description: "Record a wellfield tuning reading. The server classifies it and may automatically throttle or isolate the well, which can cascade to the site's plants and their in-flight injection batches."
    roles: [WellfieldTechnician]
    code: 201
    input: [taken_at, methane_pct, oxygen_pct, nitrogen_pct, temperature_f, flow_scfm, vacuum_inhg]
    output: WellTuningReading
    side_effects:
      - "Runs calculations.reading_quality_classification"
      - "Updates GasWell.last_quality_class, last_reading_at, last_reading_flow_scfm, wellhead_vacuum_inhg, current_flow_scfm, consecutive_good_readings"
      - "May drive GasWell ONLINE|THROTTLED -> THROTTLED|ISOLATED and the downstream wellfield-shortfall cascade"
      - "Recomputes LandfillSite.collected_flow_scfm and collection_efficiency_pct"

  - method: GET
    path: "/wells/{id}/readings"
    description: "List the tuning readings recorded against one well, newest taken_at first."
    roles: [ProjectAdmin, WellfieldTechnician, ComplianceOfficer]
    code: 200
    input: ["quality_class?", "limit?", "offset?"]
    output: WellTuningReading[]
    side_effects: []

  - method: POST
    path: "/wells/{id}/status"
    description: "Manually move a well between operating states - return to service (ISOLATED -> THROTTLED, THROTTLED -> ONLINE) or decommission it."
    roles: [ProjectAdmin, WellfieldTechnician]
    code: 200
    input: ["to_state", "reason?"]
    output: GasWell
    side_effects:
      - "Recomputes LandfillSite.collected_flow_scfm and collection_efficiency_pct"
      - "May drive a FLARING plant of the same site back to UPGRADING and close its auto_generated DowntimeEvent"

  # --- WorkOrder / condensate --------------------------------------------
  - method: POST
    path: "/work-orders"
    description: "Plan a collection-system maintenance job. The buffered lockout window must not collide with another PLANNED or IN_PROGRESS job on the same well."
    roles: [ProjectAdmin, WellfieldTechnician]
    code: 201
    input: [well_id, work_type, window_start, window_end]
    output: WorkOrder
    side_effects: ["Runs calculations.work_order_lockout_occupancy against the well's incumbent work orders"]

  - method: GET
    path: "/work-orders/{id}"
    description: "Read one work order."
    roles: [ProjectAdmin, WellfieldTechnician, ComplianceOfficer]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []

  - method: GET
    path: "/work-orders"
    description: "List work orders; filterable by well and status."
    roles: [ProjectAdmin, WellfieldTechnician, ComplianceOfficer]
    code: 200
    input: ["well_id?", "status?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []

  - method: POST
    path: "/work-orders/{id}/status"
    description: "Start, complete or cancel a maintenance job. Starting locks the well out; completing drops it back to ISOLATED."
    roles: [ProjectAdmin, WellfieldTechnician]
    code: 200
    input: [to_status]
    output: WorkOrder
    side_effects:
      - "Drives the GasWell MAINTENANCE_LOCKOUT transitions"
      - "Stamps actual_start_at / actual_end_at from the logical clock"
      - "Recomputes WorkOrder.condensate_gallons_removed on completion"

  - method: POST
    path: "/work-orders/{id}/condensate-hauls"
    description: "Record a condensate removal against an in-progress maintenance job."
    roles: [WellfieldTechnician]
    code: 201
    input: ["gallons", "disposal_manifest_no", "hauled_at", "is_hazardous?"]
    output: CondensateHaul
    side_effects: ["Recomputes WorkOrder.condensate_gallons_removed"]

  - method: GET
    path: "/work-orders/{id}/condensate-hauls"
    description: "List condensate hauls recorded against one work order."
    roles: [ProjectAdmin, WellfieldTechnician, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: CondensateHaul[]
    side_effects: []

  # --- ProcessingPlant ----------------------------------------------------
  - method: POST
    path: "/plants"
    description: "Register a gas upgrading skid and its pipeline injection spec."
    roles: [ProjectAdmin]
    code: 201
    input: ["site_id", "plant_code", "receipt_point_code", "receipt_point_mdq_dth_per_day", "min_feed_scfm", "spec_min_methane_pct?", "spec_max_oxygen_pct?", "spec_max_co2_pct?"]
    output: ProcessingPlant
    side_effects: ["process_mode initialises to STARTUP and spec_status to ON_SPEC"]

  - method: GET
    path: "/plants/{id}"
    description: "Read one processing plant, including both of its independent state dimensions."
    roles: [ProjectAdmin, PlantOperator, CommercialScheduler, ComplianceOfficer]
    code: 200
    input: []
    output: ProcessingPlant
    side_effects: []

  - method: GET
    path: "/plants"
    description: "List processing plants; filterable by site and by either state dimension."
    roles: [ProjectAdmin, PlantOperator, CommercialScheduler, ComplianceOfficer]
    code: 200
    input: ["site_id?", "process_mode?", "spec_status?", "limit?", "offset?"]
    output: ProcessingPlant[]
    side_effects: []

  - method: POST
    path: "/plants/{id}/status"
    description: "Advance either independent state dimension of the plant. Supply process_mode, spec_status, or both; at least one is required."
    roles: [ProjectAdmin, PlantOperator]
    code: 200
    input: ["process_mode?", "spec_status?"]
    output: ProcessingPlant
    side_effects:
      - "UPGRADING -> FLARING and UPGRADING -> DOWN divert every in-flight InjectionBatch of the plant to the flare and curtail their nominations"
      - "FLARING -> UPGRADING closes any OPEN auto_generated DowntimeEvent and recomputes availability_factor_pct"

  # --- DowntimeEvent ------------------------------------------------------
  - method: POST
    path: "/downtime-events"
    description: "Open a downtime / flare-backup accounting record for a plant."
    roles: [ProjectAdmin, PlantOperator]
    code: 201
    input: [plant_id, start_at, cause, disposition]
    output: DowntimeEvent
    side_effects: ["status initialises to OPEN; auto_generated is false for operator-opened rows"]

  - method: GET
    path: "/downtime-events/{id}"
    description: "Read one downtime record."
    roles: [ProjectAdmin, PlantOperator, ComplianceOfficer]
    code: 200
    input: []
    output: DowntimeEvent
    side_effects: []

  - method: GET
    path: "/downtime-events"
    description: "List downtime records; filterable by plant, status and cause."
    roles: [ProjectAdmin, PlantOperator, ComplianceOfficer]
    code: 200
    input: ["plant_id?", "status?", "cause?", "limit?", "offset?"]
    output: DowntimeEvent[]
    side_effects: []

  - method: POST
    path: "/downtime-events/{id}/close"
    description: "Close a downtime record, book the flared / vented energy to the site ledger and recompute the plant's month-to-date availability."
    roles: [ProjectAdmin, PlantOperator]
    code: 200
    input: ["end_at", "flared_mmbtu?", "vented_mmbtu?"]
    output: DowntimeEvent
    side_effects:
      - "LandfillSite.energy_produced_mmbtu += flared_mmbtu + vented_mmbtu"
      - "LandfillSite.energy_flared_mmbtu += flared_mmbtu; LandfillSite.energy_vented_mmbtu += vented_mmbtu"
      - "Runs calculations.plant_availability_factor and refreshes availability_factor_pct, downtime_minutes_mtd, flare_minutes_mtd"

  # --- OfftakeContract ----------------------------------------------------
  - method: POST
    path: "/offtake-contracts"
    description: "Create an RNG offtake contract for a site."
    roles: [ProjectAdmin, CommercialScheduler]
    code: 201
    input: ["site_id", "counterparty_name", "contract_mdq_dth_per_day", "price_usd_per_dth", "term_start", "term_end", "attribute_share_pct?"]
    output: OfftakeContract
    side_effects: ["status initialises to PENDING"]

  - method: GET
    path: "/offtake-contracts/{id}"
    description: "Read one offtake contract including its version (the value an OCC nomination write must echo)."
    roles: [ProjectAdmin, CommercialScheduler, Offtaker]
    code: 200
    input: []
    output: OfftakeContract
    side_effects: []

  - method: GET
    path: "/offtake-contracts"
    description: "List offtake contracts; filterable by site and status."
    roles: [ProjectAdmin, CommercialScheduler]
    code: 200
    input: ["site_id?", "status?", "limit?", "offset?"]
    output: OfftakeContract[]
    side_effects: []

  - method: POST
    path: "/offtake-contracts/{id}/status"
    description: "Activate, suspend or terminate an offtake contract."
    roles: [ProjectAdmin, CommercialScheduler]
    code: 200
    input: [to_status]
    output: OfftakeContract
    side_effects: ["Increments OfftakeContract.version by 1"]

  # --- PipelineNomination -------------------------------------------------
  - method: POST
    path: "/pipeline-nominations"
    description: "Write a gas-day nomination against a contract and a plant receipt point. Requires expected_contract_version - the OfftakeContract.version the client last observed."
    roles: [ProjectAdmin, CommercialScheduler]
    code: 201
    input: [contract_id, plant_id, gas_day_start, gas_day_end, nominated_dth, expected_contract_version]
    output: PipelineNomination
    side_effects:
      - "Runs calculations.receipt_point_headroom over overlapping DRAFT/CONFIRMED/SCHEDULED nominations of the same plant"
      - "Computes hourly_rate_dth"
      - "Increments OfftakeContract.version by 1"

  - method: GET
    path: "/pipeline-nominations/{id}"
    description: "Read one nomination."
    roles: [ProjectAdmin, CommercialScheduler, PlantOperator, Offtaker]
    code: 200
    input: []
    output: PipelineNomination
    side_effects: []

  - method: GET
    path: "/pipeline-nominations"
    description: "List nominations; filterable by contract, plant and status."
    roles: [ProjectAdmin, CommercialScheduler, PlantOperator]
    code: 200
    input: ["contract_id?", "plant_id?", "status?", "limit?", "offset?"]
    output: PipelineNomination[]
    side_effects: []

  - method: POST
    path: "/pipeline-nominations/{id}/status"
    description: "Confirm, curtail or cancel a nomination. An Offtaker may only act on nominations written against its own contract."
    roles: [ProjectAdmin, CommercialScheduler, Offtaker]
    code: 200
    input: ["to_status", "curtail_reason?"]
    output: PipelineNomination
    side_effects: ["CURTAILED and CANCELLED release the window's receipt-point capacity"]

  # --- InjectionBatch -----------------------------------------------------
  - method: POST
    path: "/injection-batches"
    description: "Record an hour-by-hour block of product gas produced by a plant. gross_mmbtu is computed and frozen here."
    roles: [ProjectAdmin, PlantOperator]
    code: 201
    input: [plant_id, interval_start, interval_end, hourly_volumes_mscf, methane_pct, oxygen_pct, co2_pct]
    output: InjectionBatch
    side_effects: ["Runs calculations.injection_batch_gross_mmbtu", "status initialises to DRAFT"]

  - method: GET
    path: "/injection-batches/{id}"
    description: "Read one injection batch."
    roles: [ProjectAdmin, PlantOperator, CommercialScheduler, ComplianceOfficer]
    code: 200
    input: []
    output: InjectionBatch
    side_effects: []

  - method: GET
    path: "/injection-batches"
    description: "List injection batches; filterable by plant, nomination and status."
    roles: [ProjectAdmin, PlantOperator, CommercialScheduler, ComplianceOfficer]
    code: 200
    input: ["plant_id?", "nomination_id?", "status?", "limit?", "offset?"]
    output: InjectionBatch[]
    side_effects: []

  - method: POST
    path: "/injection-batches/{id}/status"
    description: "Advance an injection batch. PENDING_ANALYSIS triggers the automatic spec evaluation and the batch lands on ON_SPEC or OFF_SPEC in the same response."
    roles: [ProjectAdmin, PlantOperator, CommercialScheduler]
    code: 200
    input: ["to_status", "nomination_id?", "void_reason?"]
    output: InjectionBatch
    side_effects:
      - "Automatic spec branch sets spec_failure_reason and may push the plant's spec_status to OFF_SPEC"
      - "NOMINATED updates PipelineNomination.committed_dth and may push the nomination CONFIRMED -> SCHEDULED"
      - "INJECTED credits the site energy ledger, the nomination and the contract"
      - "DIVERTED_TO_FLARE and VOIDED apply the compensating ledger movements"

  - method: POST
    path: "/injection-batches/{id}/meter-trueup"
    description: "Record the pipeline's confirmed metered energy for an injected batch. This is the only way metered_mmbtu becomes non-null, and therefore the only way a SETTLED_METERED attribute batch can be generated."
    roles: [ProjectAdmin, CommercialScheduler]
    code: 200
    input: [metered_mmbtu]
    output: InjectionBatch
    side_effects:
      - "Sets InjectionBatch.metered_mmbtu"
      - "Does NOT alter gross_mmbtu, the site energy ledger, or any already-generated AttributeBatch"

  # --- AttributeBatch -----------------------------------------------------
  - method: POST
    path: "/attribute-batches"
    description: "Generate environmental attributes from an injected batch. The row is created in PENDING and auto-advances to GENERATED inside the same request."
    roles: [ProjectAdmin, ComplianceOfficer]
    code: 201
    input: [injection_batch_id, program, generation_period, "basis?"]
    output: AttributeBatch
    side_effects:
      - "Runs calculations.rin_d3_generation or calculations.lcfs_credit_generation according to program"
      - "For RIN_D3: LandfillSite.rin_generated_total and rin_available_count both increase by rin_count"

  - method: GET
    path: "/attribute-batches/{id}"
    description: "Read one attribute batch."
    roles: [ProjectAdmin, ComplianceOfficer, CommercialScheduler]
    code: 200
    input: []
    output: AttributeBatch
    side_effects: []

  - method: GET
    path: "/attribute-batches"
    description: "List attribute batches; filterable by source injection batch, program and status."
    roles: [ProjectAdmin, ComplianceOfficer, CommercialScheduler]
    code: 200
    input: ["injection_batch_id?", "program?", "status?", "generation_period?", "limit?", "offset?"]
    output: AttributeBatch[]
    side_effects: []

  - method: POST
    path: "/attribute-batches/{id}/status"
    description: "Move an attribute batch through QA hold, separation, retirement or reversal."
    roles: [ComplianceOfficer]
    code: 200
    input: [to_status, "reason?"]
    output: AttributeBatch
    side_effects:
      - "SEPARATED requires an ACCEPTED ComplianceReport of the matching type covering the period"
      - "RETIRED and REVERSED move rin_count between the site's RIN buckets while rin_generated_total stays put"

  # --- ComplianceReport ---------------------------------------------------
  - method: POST
    path: "/compliance-reports"
    description: "Open a regulatory filing for a site and period. exceedance_flag is frozen at creation from the reported NMOC rate against the site permit limit."
    roles: [ComplianceOfficer]
    code: 201
    input: [site_id, report_type, period, nmoc_lb_per_hr_reported]
    output: ComplianceReport
    side_effects: ["prepared_by_user_id := X-User-ID", "Computes exceedance_flag", "Recomputes LandfillSite.compliance_posture"]

  - method: GET
    path: "/compliance-reports/{id}"
    description: "Read one compliance report."
    roles: [ProjectAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceReport
    side_effects: []

  - method: GET
    path: "/compliance-reports"
    description: "List compliance reports; filterable by site, type, period and status."
    roles: [ProjectAdmin, ComplianceOfficer]
    code: 200
    input: ["site_id?", "report_type?", "period?", "status?", "limit?", "offset?"]
    output: ComplianceReport[]
    side_effects: []

  - method: POST
    path: "/compliance-reports/{id}/status"
    description: "Drive the filing through submit / review / return / accept. Segregation of duties is enforced against prepared_by_user_id and reviewed_by_user_id."
    roles: [ComplianceOfficer]
    code: 200
    input: [to_status, "return_reason?", "corrective_action_note?"]
    output: ComplianceReport
    side_effects:
      - "RETURNED puts the period's GENERATED attribute batches on QA hold and disputes the site's ISSUED royalty statements for months inside the period"
      - "Recomputes LandfillSite.compliance_posture"

  # --- RoyaltyStatement ---------------------------------------------------
  - method: POST
    path: "/royalty-statements"
    description: "Settle the host landfill royalty for one closed month. Requires expected_site_version - the LandfillSite.version the client last observed."
    roles: [ProjectAdmin]
    code: 201
    input: [site_id, period, expected_site_version, "allowed_deductions_usd?", "variant_override?"]
    output: RoyaltyStatement
    side_effects:
      - "Runs calculations.royalty_settlement and freezes every money field on the row"
      - "Increments LandfillSite.version by 1"

  - method: GET
    path: "/royalty-statements/{id}"
    description: "Read one royalty statement. A HostRepresentative may only read statements of its own site."
    roles: [ProjectAdmin, ComplianceOfficer, HostRepresentative]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: []

  - method: GET
    path: "/royalty-statements"
    description: "List royalty statements; filterable by site, period and status."
    roles: [ProjectAdmin, ComplianceOfficer, HostRepresentative]
    code: 200
    input: ["site_id?", "period?", "status?", "limit?", "offset?"]
    output: RoyaltyStatement[]
    side_effects: []

  - method: POST
    path: "/royalty-statements/{id}/status"
    description: "Issue, dispute, restate or pay a royalty statement. Only the HostRepresentative that owns the site may dispute."
    roles: [ProjectAdmin, HostRepresentative]
    code: 200
    input: [to_status, "dispute_reason?"]
    output: RoyaltyStatement
    side_effects: ["Moves LandfillSite.royalty_payable_usd by the statement's royalty_amount_usd in the matching direction"]

  # --- Test-driving surface ----------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Every deadline, window, month boundary and stamped timestamp in this API reads current_utc from here. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [ProjectAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["No entity is mutated; subsequent requests simply observe the new current_utc"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the seven declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity_backed role acted on a resource it does not own - HostRepresentative on another site's statement, Offtaker on another contract's nomination"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The same ComplianceOfficer tried to both prepare and review a compliance report, or a third officer tried to return/accept a report they did not take under review"
  - id: ERR_VALIDATION
    http: 400
    condition: "Body or query schema violation - missing required field, wrong type, unknown enum member, out-of-range number, malformed period string, limit/offset out of bounds"
  - id: ERR_SITE_NOT_FOUND
    http: 404
    condition: "site_id in path or body does not resolve"
  - id: ERR_WELL_NOT_FOUND
    http: 404
    condition: "well id in path or well_id in body does not resolve"
  - id: ERR_WORK_ORDER_NOT_FOUND
    http: 404
    condition: "work order id in path does not resolve"
  - id: ERR_PLANT_NOT_FOUND
    http: 404
    condition: "plant id in path or plant_id in body does not resolve"
  - id: ERR_DOWNTIME_EVENT_NOT_FOUND
    http: 404
    condition: "downtime event id in path does not resolve"
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "contract id in path or contract_id in body does not resolve"
  - id: ERR_NOMINATION_NOT_FOUND
    http: 404
    condition: "nomination id in path or nomination_id in body does not resolve"
  - id: ERR_INJECTION_BATCH_NOT_FOUND
    http: 404
    condition: "injection batch id in path or injection_batch_id in body does not resolve"
  - id: ERR_ATTRIBUTE_BATCH_NOT_FOUND
    http: 404
    condition: "attribute batch id in path does not resolve"
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "compliance report id in path does not resolve"
  - id: ERR_ROYALTY_STATEMENT_NOT_FOUND
    http: 404
    condition: "royalty statement id in path does not resolve"
  - id: ERR_STALE_CONTRACT_VERSION
    http: 412
    condition: "expected_contract_version does not equal the OfftakeContract's current version on POST /pipeline-nominations"
  - id: ERR_STALE_SITE_VERSION
    http: 412
    condition: "expected_site_version does not equal the LandfillSite's current version on POST /royalty-statements"
  - id: ERR_INVALID_TRANSITION
    http: 409
    condition: "The requested from-state to to-state pair is not declared in §1.2 for that entity"
  - id: ERR_WELL_DECOMMISSIONED
    http: 409
    condition: "An operation was attempted against a well whose operating_state is DECOMMISSIONED"
  - id: ERR_WELL_IN_LOCKOUT
    http: 409
    condition: "A tuning reading or a second work-order start was attempted while the well is in MAINTENANCE_LOCKOUT"
  - id: ERR_DOWNTIME_ALREADY_CLOSED
    http: 409
    condition: "POST /downtime-events/{id}/close on a record whose status is already CLOSED"
  - id: ERR_CONTRACT_NOT_ACTIVE
    http: 409
    condition: "A nomination was written or confirmed against a contract whose status is not ACTIVE"
  - id: ERR_BATCH_NOT_INJECTED
    http: 409
    condition: "Attribute generation was requested against an InjectionBatch whose status is not INJECTED"
  - id: ERR_READING_OUT_OF_ORDER
    http: 422
    condition: "taken_at is not strictly after GasWell.last_reading_at"
  - id: ERR_GAS_COMPOSITION_INVALID
    http: 422
    condition: "methane_pct + oxygen_pct + nitrogen_pct exceeds 100"
  - id: ERR_BATCH_INTERVAL_MISMATCH
    http: 422
    condition: "hourly_volumes_mscf length does not equal the whole-hour span between interval_start and interval_end"
  - id: ERR_INTERVAL_INVALID
    http: 422
    condition: "An interval's end instant is not strictly after its start instant"
  - id: ERR_PLANT_NOT_UPGRADING
    http: 409
    condition: "An operation requiring product gas was attempted while the plant's process_mode is not UPGRADING"
  - id: ERR_PLANT_OFF_SPEC
    http: 409
    condition: "A batch nomination was attempted while the plant's spec_status is not ON_SPEC"
  - id: ERR_BATCH_OFF_SPEC
    http: 409
    condition: "An injection batch whose status is OFF_SPEC was pushed toward NOMINATED or INJECTED. This specific from/to pair is reported here at priority 90 rather than as the generic priority-80 ERR_INVALID_TRANSITION."
  - id: ERR_OFF_SPEC_BATCH_UNRESOLVED
    http: 409
    condition: "spec_status QUARANTINE -> ON_SPEC was attempted while an InjectionBatch of the plant is still in status OFF_SPEC"
  - id: ERR_WELL_NOT_RECOVERED
    http: 422
    condition: "A well was returned to service without the required run of consecutive GOOD readings (2 for ISOLATED -> THROTTLED, 3 for THROTTLED -> ONLINE)"
  - id: ERR_INSUFFICIENT_FEED_FLOW
    http: 422
    condition: "process_mode was moved to UPGRADING while LandfillSite.collected_flow_scfm is below ProcessingPlant.min_feed_scfm"
  - id: ERR_CONDENSATE_MANIFEST_REQUIRED
    http: 422
    condition: "is_hazardous is true but disposal_manifest_no does not start with 'HW-'"
  - id: ERR_PERMIT_EXCEEDANCE_UNRESOLVED
    http: 422
    condition: "A compliance report with exceedance_flag true was accepted without a corrective_action_note"
  - id: ERR_REPORT_NOT_ACCEPTED
    http: 409
    condition: "AttributeBatch GENERATED -> SEPARATED was attempted with no ACCEPTED ComplianceReport of the matching report_type covering the generation_period"
  - id: ERR_METERED_VOLUME_REQUIRED
    http: 422
    condition: "basis SETTLED_METERED was requested while the source InjectionBatch.metered_mmbtu is still null"
  - id: ERR_WELL_LOCKOUT_CONFLICT
    http: 409
    condition: "The new work order's buffered closed window shares at least one instant with the buffered window of a PLANNED or IN_PROGRESS work order on the same well"
  - id: ERR_WORK_ORDER_WINDOW_NOT_ACTIVE
    http: 422
    condition: "A work order was started while current_utc is outside [window_start, window_end]"
  - id: ERR_CONTRACT_TERM_WINDOW
    http: 422
    condition: "The nominated gas-day window is not fully inside [OfftakeContract.term_start, OfftakeContract.term_end)"
  - id: ERR_ROYALTY_PERIOD_NOT_CLOSED
    http: 422
    condition: "A royalty statement was requested for a period whose month has not fully elapsed against current_utc"
  - id: ERR_WELL_CODE_DUPLICATE
    http: 409
    condition: "well_code is already used by a non-DECOMMISSIONED well of the same site"
  - id: ERR_ATTRIBUTE_DUPLICATE_PROGRAM
    http: 409
    condition: "A non-REVERSED AttributeBatch already exists for this (injection_batch_id, program) pair"
  - id: ERR_ROYALTY_PERIOD_DUPLICATE
    http: 409
    condition: "A RoyaltyStatement in status DRAFT, ISSUED or PAID already exists for this (site_id, period) pair"
  - id: ERR_REPORT_PERIOD_DUPLICATE
    http: 409
    condition: "A ComplianceReport whose status is not RETURNED already exists for this (site_id, report_type, period) triple"
  - id: ERR_CONTRACT_MDQ_EXCEEDED
    http: 422
    condition: "nominated_dth exceeds OfftakeContract.contract_mdq_dth_per_day"
  - id: ERR_RECEIPT_POINT_CAPACITY_EXCEEDED
    http: 409
    condition: "The pooled hourly rate of overlapping DRAFT/CONFIRMED/SCHEDULED nominations plus the new one exceeds ProcessingPlant.receipt_point_mdq_dth_per_day / 24"
  - id: ERR_NOMINATION_VOLUME_EXCEEDED
    http: 422
    condition: "PipelineNomination.committed_dth plus the batch's gross_mmbtu would exceed the nomination's nominated_dth"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: ProjectAdmin
    description: "Project operator with the broadest surface - registers sites, plants and wells, settles royalties, decommissions equipment and drives the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /sites"
      - "POST /plants"
      - "POST /royalty-statements"
      - "POST /_clock/set_current_utc"
      - "POST /wells/{id}/status with to_state == DECOMMISSIONED"
      - "POST /plants/{id}/status with process_mode == DECOMMISSIONED"
      - "POST /royalty-statements/{id}/status with to_status IN {ISSUED, PAID}"
    shared_operations:
      - "GET /sites, GET /sites/{id}, GET /sites/{id}/energy-balance"
      - "POST /wells, GET /wells, GET /wells/{id}, POST /wells/{id}/status"
      - "POST /work-orders, GET /work-orders, GET /work-orders/{id}, POST /work-orders/{id}/status"
      - "GET /plants, GET /plants/{id}, POST /plants/{id}/status"
      - "POST /downtime-events, GET /downtime-events, GET /downtime-events/{id}, POST /downtime-events/{id}/close"
      - "POST /offtake-contracts, GET /offtake-contracts, GET /offtake-contracts/{id}, POST /offtake-contracts/{id}/status"
      - "POST /pipeline-nominations, GET /pipeline-nominations, GET /pipeline-nominations/{id}, POST /pipeline-nominations/{id}/status"
      - "POST /injection-batches, GET /injection-batches, GET /injection-batches/{id}, POST /injection-batches/{id}/status, POST /injection-batches/{id}/meter-trueup"
      - "POST /attribute-batches, GET /attribute-batches, GET /attribute-batches/{id}"
      - "GET /compliance-reports, GET /compliance-reports/{id}"
      - "GET /royalty-statements, GET /royalty-statements/{id}"

  - name: WellfieldTechnician
    description: "Field technician who tunes wells, records gas quality readings and executes collection-system maintenance and condensate hauling."
    identity: opaque
    exclusive_operations:
      - "POST /wells/{id}/readings"
      - "POST /work-orders/{id}/condensate-hauls"
    shared_operations:
      - "GET /sites/{id}"
      - "POST /wells, GET /wells, GET /wells/{id}, GET /wells/{id}/readings"
      - "POST /wells/{id}/status with to_state IN {THROTTLED, ONLINE}"
      - "POST /work-orders, GET /work-orders, GET /work-orders/{id}, POST /work-orders/{id}/status"
      - "GET /work-orders/{id}/condensate-hauls"

  - name: PlantOperator
    description: "Upgrading-skid operator who runs the plant's two state dimensions, logs downtime and flare backup, and produces injection batches."
    identity: opaque
    exclusive_operations:
      - "POST /plants/{id}/status with a spec_status value (only the PlantOperator moves the spec dimension; ProjectAdmin's access to this endpoint is limited to the process_mode dimension)"
    shared_operations:
      - "GET /sites/{id}, GET /wells, GET /wells/{id}"
      - "POST /injection-batches"
      - "GET /plants, GET /plants/{id}, POST /plants/{id}/status"
      - "POST /downtime-events, GET /downtime-events, GET /downtime-events/{id}, POST /downtime-events/{id}/close"
      - "GET /pipeline-nominations, GET /pipeline-nominations/{id}"
      - "GET /injection-batches, GET /injection-batches/{id}, POST /injection-batches/{id}/status"

  - name: CommercialScheduler
    description: "Commercial desk that manages offtake contracts, writes and confirms pipeline nominations, attaches batches to nominations and records the pipeline meter true-up."
    identity: opaque
    exclusive_operations:
      - "POST /pipeline-nominations/{id}/status with to_status IN {CURTAILED, CANCELLED}"
    shared_operations:
      - "GET /sites/{id}"
      - "GET /plants, GET /plants/{id}"
      - "POST /offtake-contracts, GET /offtake-contracts, GET /offtake-contracts/{id}, POST /offtake-contracts/{id}/status"
      - "POST /pipeline-nominations, GET /pipeline-nominations, GET /pipeline-nominations/{id}, POST /pipeline-nominations/{id}/status"
      - "GET /injection-batches, GET /injection-batches/{id}, POST /injection-batches/{id}/status, POST /injection-batches/{id}/meter-trueup"
      - "GET /attribute-batches, GET /attribute-batches/{id}"

  - name: ComplianceOfficer
    description: "Environmental compliance staff who generate and steward RIN/LCFS attributes and prepare, review and accept regulatory filings under segregation of duties."
    identity: opaque
    exclusive_operations:
      - "POST /compliance-reports"
      - "POST /compliance-reports/{id}/status"
      - "POST /attribute-batches/{id}/status"
    shared_operations:
      - "GET /sites, GET /sites/{id}, GET /sites/{id}/energy-balance"
      - "GET /wells, GET /wells/{id}, GET /wells/{id}/readings"
      - "GET /work-orders, GET /work-orders/{id}, GET /work-orders/{id}/condensate-hauls"
      - "GET /plants, GET /plants/{id}"
      - "GET /downtime-events, GET /downtime-events/{id}"
      - "GET /injection-batches, GET /injection-batches/{id}"
      - "POST /attribute-batches, GET /attribute-batches, GET /attribute-batches/{id}"
      - "GET /compliance-reports, GET /compliance-reports/{id}"
      - "GET /royalty-statements, GET /royalty-statements/{id}"

  - name: HostRepresentative
    description: "Representative of the host landfill. X-User-ID is the LandfillSite id, and the representative may only see and dispute royalty statements of that site."
    identity: "entity_backed:LandfillSite"
    exclusive_operations:
      - "POST /royalty-statements/{id}/status with to_status == DISPUTED"
    shared_operations:
      - "GET /sites/{id}, GET /sites/{id}/energy-balance"
      - "GET /royalty-statements, GET /royalty-statements/{id}"

  - name: Offtaker
    description: "Counterparty on an offtake contract. X-User-ID is the OfftakeContract id, and the offtaker may only act on nominations written against that contract."
    identity: "entity_backed:OfftakeContract"
    exclusive_operations: []
    shared_operations:
      - "GET /offtake-contracts/{id}"
      - "GET /pipeline-nominations/{id}"
      - "POST /pipeline-nominations/{id}/status with to_status == CONFIRMED"
