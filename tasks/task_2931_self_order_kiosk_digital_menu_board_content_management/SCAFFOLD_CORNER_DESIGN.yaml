              as: ContentManager
              captures: { item_b_id: $.data.id }
          trigger:
            - call: "POST /kiosk-ops/upsell-rules"
              payload: { cluster_id: "${cl_id}", trigger_item_id: "${item_a_id}", suggested_item_id: "11111111-1111-4111-8111-111111111111", rule_kind: "COMBO_SUGGESTION", min_cart_subtotal_cents: 0, suggestion_slot: 1, max_prompt_seconds: 20 }
              as: ContentManager
              captures: { link_err: $.data.error_id }
            - call: "POST /kiosk-ops/upsell-rules"
              payload: { cluster_id: "${cl_id}", trigger_item_id: "${item_a_id}", suggested_item_id: "${item_b_id}", rule_kind: "COMBO_SUGGESTION", min_cart_subtotal_cents: 0, suggestion_slot: 1, max_prompt_seconds: 20 }
              as: ContentManager
              captures: { rule_id: $.data.id, rule_state: $.data.state }
            - call: "GET /kiosk-ops/upsell-rules?suggested_item_id=${item_b_id}"
              payload: {}
              as: ContentManager
              captures: { by_suggested: "$.data[0].id" }
            - call: "GET /kiosk-ops/upsell-rules?trigger_item_id=${item_a_id}"
              payload: {}
              as: ContentManager
              captures: { by_trigger: "$.data[0].id" }
          assert:
            - "${link_err} == ERR_REFERENCED_ENTITY_NOT_FOUND with HTTP 404 for the unknown suggested item"
            - "HTTP 201 for the valid link with ${rule_state} == ACTIVE"
            - "${by_suggested} == ${rule_id} and ${by_trigger} == ${rule_id}, each list carrying total_count 1 — the association is navigable from both endpoints"
            - "GET /kiosk-ops/upsell-rules?cluster_id=${cl_id} also returns total_count 1"

  # Error triggerability map (§1.6): every declared error_id is caused by at least one instance
  # across this file and SCAFFOLD_DIFFICULTY_DESIGN.yaml. The three instances below cover the
  # ids that no other instance reaches: ERR_OFFLINE_CACHE_CAPACITY_EXCEEDED,
  # ERR_UPSELL_RULE_NOT_ELIGIBLE and ERR_ITEM_EIGHTY_SIXED. ERR_UNAUTHENTICATED,
  # ERR_DEVICE_IDENTITY_MISMATCH and ERR_STORE_SCOPE_VIOLATION are covered by the rbac section;
  # ERR_STALE_MENU_ITEM_VERSION and ERR_STALE_CONTENT_BUNDLE_VERSION by complexity_layers.
  - section: errors
    instances:

      - name: offline_capacity_bounds_the_offline_order_backlog
        claim_type: triggerability
        grounds:
          - errors.ERR_OFFLINE_CACHE_CAPACITY_EXCEEDED
          - validations.priority_26_ERR_OFFLINE_CACHE_CAPACITY_EXCEEDED
          - entities.Device.fields.offline_cache_capacity
        distinguishing_aspect: "With offline_cache_capacity 1 the first created_offline order is accepted and offline_order_count reaches 1; the second is refused with ERR_OFFLINE_CACHE_CAPACITY_EXCEEDED (409) while an ONLINE order on the same device still succeeds."
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; ZONE_A, cluster CL_WEST, store S001, Item A with 40 units, PUBLISHED bundle covering ENTREE on LUNCH [660, 960)."
            - "Kiosk K001 has offline_cache_capacity 1, is attested COMPLIANT, ONLINE and caching the PUBLISHED bundle."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /kiosk-ops/price-zones"
              payload: { zone_code: "ZONE_A", currency_code: "USD", price_multiplier_bp: 11000, psychological_rounding: "NINE_ENDING", tax_rate_bp: 875, max_uplift_bp: 1500 }
              as: PlatformAdmin
              captures: { zone_a_id: $.data.id }
            - call: "POST /kiosk-ops/store-clusters"
              payload: { cluster_code: "CL_WEST", tier: "REGION" }
              as: ContentManager
              captures: { cl_id: $.data.id }
            - call: "POST /kiosk-ops/stores"
              payload: { store_code: "S001", cluster_id: "${cl_id}", price_zone_id: "${zone_a_id}", timezone_offset_minutes: -300, accessibility_certified_until_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /kiosk-ops/menu-items"
              payload: { sku: "SKU-BURGER", display_name: "Classic Burger", category: "ENTREE", base_price_cents: 500, screen_reader_text: "Classic burger", contrast_ratio: 7.1 }
              as: ContentManager
              captures: { item_a_id: $.data.id }
            - call: "POST /kiosk-ops/stores/${store_id}/item-availabilities"
              payload: { menu_item_id: "${item_a_id}", on_hand_units: 40, reserved_units: 0, par_units: 20 }
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "POST /kiosk-ops/content-bundles"
              payload: { cluster_id: "${cl_id}", effective_from_utc: "2026-08-05T00:00:00Z" }
              as: ContentManager
              captures: { bundle_id: $.data.id, bundle_ver: $.data.version }
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/daypart-slots"
              payload: { expected_content_bundle_version: "${bundle_ver}", daypart_code: "LUNCH", start_minute_of_day: 660, end_minute_of_day: 960, layout_code: "LUNCH_GRID", buffer_minutes: 15, category_codes: ["ENTREE"] }
              as: ContentManager
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/actions"
              payload: { action: "ACCESSIBILITY_AUDIT", audit_result: "PASS" }
              as: ComplianceOfficer
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/actions"
              payload: { action: "VALIDATE" }
              as: ContentManager
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/actions"
              payload: { action: "PUBLISH" }
              as: ContentManager
            - call: "POST /kiosk-ops/devices"
