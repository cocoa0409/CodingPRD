            - { call: "POST /policies", payload: { policy_number: "WC-700", insured_name: "Eta", coverage_line: "WC", state_code: "CA", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-07-31T00:00:00Z", estimated_annual_premium_cents: 2000000, minimum_premium_cents: 100000, payroll_estimate_dollars: 100000, experience_mod_factor: 1.00, class_code_ids: ["${cc_a}"] }, as: Underwriter, captures: { pol: "$.data.id" } }
            - { call: "POST /auditors", payload: { full_name: "Ada Auditor", territory_states: ["CA"], level: "SENIOR" }, as: AuditManager, captures: { aud: "$.data.id" } }
            - { call: "POST /audit-selection-runs", payload: {}, as: AuditManager }
            - { call: "GET /audit-work-orders", payload: { policy_id: "${pol}" }, as: AuditManager, captures: { wo: "$.data[0].id" } }
            - { call: "POST /audit-work-orders/${wo}/assign", payload: { auditor_id: "${aud}" }, as: AuditManager }
            - { call: "POST /audit-work-orders/${wo}/records-requests", payload: { request_type: "PAYROLL_SUMMARY" }, as: AuditManager }
            - { call: "GET /audit-work-orders/${wo}", payload: {}, as: AuditManager, captures: { wo_v1: "$.data.version" } }
            - { call: "POST /audit-work-orders/${wo}/appointments", payload: { scheduled_start: "2026-08-10T09:00:00Z", scheduled_end: "2026-08-10T11:00:00Z", location_type: "INSURED_PREMISES", expected_work_order_version: "${wo_v1}" }, as: Auditor, as_user_id: "${aud}", captures: { appt1: "$.data.id" } }
            - { call: "POST /appointments/${appt1}/no-show", payload: {}, as: Auditor, as_user_id: "${aud}" }
            - { call: "GET /audit-work-orders/${wo}", payload: {}, as: AuditManager, captures: { wo_v2: "$.data.version" } }
            - { call: "POST /audit-work-orders/${wo}/appointments", payload: { scheduled_start: "2026-08-11T09:00:00Z", scheduled_end: "2026-08-11T11:00:00Z", location_type: "VIRTUAL", expected_work_order_version: "${wo_v2}" }, as: Auditor, as_user_id: "${aud}", captures: { appt2: "$.data.id" } }
            - { call: "POST /appointments/${appt2}/no-show", payload: {}, as: Auditor, as_user_id: "${aud}" }
            - { call: "GET /audit-work-orders/${wo}", payload: {}, as: AuditManager, captures: { wo_v3: "$.data.version", wo_noshow: "$.data.no_show_count" } }
          trigger:
            - { call: "POST /audit-work-orders/${wo}/appointments", payload: { scheduled_start: "2026-08-12T09:00:00Z", scheduled_end: "2026-08-12T11:00:00Z", location_type: "VIRTUAL", expected_work_order_version: "${wo_v3}" }, as: Auditor, as_user_id: "${aud}", captures: { err: "$.data.error_id" } }
          assert:
            - "AuditWorkOrder.${wo}.no_show_count == 2 after two NO_SHOW cycles"
            - "third appointment creation fails with ERR_RESCHEDULE_LIMIT_EXCEEDED (captured error_id)"
            - "AuditAppointment.${appt1}.status == NO_SHOW and AuditAppointment.${appt2}.status == NO_SHOW"
            - "AuditWorkOrder.${wo}.status == APPOINTMENT_SCHEDULED (cycle did not advance the work order)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: records_overdue_to_policy_cancellation_chain
        grounds:
          - state_machines.RecordsRequest.OPEN_to_OVERDUE
          - state_machines.AuditWorkOrder.NONCOMPLIANT_PENDING_to_ESTIMATED_BILLED
          - state_machines.BillingTransaction.ISSUED_to_PAST_DUE
          - state_machines.Policy.AUDIT_PENDING_to_CANCELLED
          - calculations.earned_premium
        distinguishing_aspect: |
          Depth-5 cascade triggered by the logical clock: clock sweep -> RecordsRequest OVERDUE -> work order
          NONCOMPLIANT_PENDING -> estimated AuditResult ISSUED (earned 2500000) -> BillingTransaction 500000
          ISSUED -> PAST_DUE -> Policy CANCELLED -> work order CANCELLED. Each hop is caused by the previous one.
        test_recipe:
          setup:
            - "WC policy WC-800 (CA): estimated premium 2000000, minimum 100000, payroll estimate 100000, mod 1.20, class code 8810 -> PHYSICAL work order SELECTED at default clock 2026-08-01"
            - "one PAYROLL_SUMMARY records request created at 2026-08-01 (due_at 2026-08-16T00:00:00Z), never received"
          setup_api_calls:
            - { call: "POST /classification-codes", payload: { code: "8810", description: "Clerical", state_code: "CA", coverage_line: "WC", rate_per_100_cents: 40, high_hazard: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: Underwriter, captures: { cc_a: "$.data.id" } }
            - { call: "POST /policies", payload: { policy_number: "WC-800", insured_name: "Theta", coverage_line: "WC", state_code: "CA", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-07-31T00:00:00Z", estimated_annual_premium_cents: 2000000, minimum_premium_cents: 100000, payroll_estimate_dollars: 100000, experience_mod_factor: 1.20, class_code_ids: ["${cc_a}"] }, as: Underwriter, captures: { pol: "$.data.id" } }
            - { call: "POST /audit-selection-runs", payload: {}, as: AuditManager }
            - { call: "GET /audit-work-orders", payload: { policy_id: "${pol}" }, as: AuditManager, captures: { wo: "$.data[0].id" } }
            - { call: "POST /audit-work-orders/${wo}/records-requests", payload: { request_type: "PAYROLL_SUMMARY" }, as: AuditManager, captures: { req1: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-17T00:00:00Z" }, as: AuditManager }
            - { call: "POST /audit-work-orders/${wo}/mark-noncompliant", payload: {}, as: AuditManager, as_user_id: "mgr-1" }
            - { call: "POST /audit-work-orders/${wo}/approve-estimated", payload: {}, as: AuditManager, as_user_id: "mgr-2", captures: { res: "$.data.id", res_earned: "$.data.earned_premium_cents", res_adj: "$.data.adjustment_cents", res_variant: "$.data.variant" } }
            - { call: "GET /audit-results/${res}/billing-transactions", payload: {}, as: AuditManager, captures: { bill: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-17T00:00:00Z" }, as: AuditManager }
            - { call: "GET /billing-transactions/${bill}", payload: {}, as: AuditManager, captures: { bill_mid: "$.data.status" } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-17T00:00:00Z" }, as: AuditManager }
            - { call: "GET /policies/${pol}", payload: {}, as: AuditManager, captures: { pol_status: "$.data.status" } }
            - { call: "GET /audit-work-orders/${wo}", payload: {}, as: AuditManager, captures: { wo_status: "$.data.status" } }
            - { call: "GET /billing-transactions/${bill}", payload: {}, as: AuditManager, captures: { bill_status: "$.data.status" } }
          assert:
            - "RecordsRequest.${req1}.status == OVERDUE after clock 2026-08-17 (due_at 2026-08-16T00:00:00Z)"
            - "AuditResult.${res}: variant == ESTIMATED_NONCOMPLIANCE, earned_premium_cents == 2500000 (round_half_up(2000000*1.25)), adjustment_cents == 500000"
            - "BillingTransaction.${bill}: type ADDITIONAL_PREMIUM_INVOICE, amount_cents == 500000, due_at == 2026-09-16T00:00:00Z"
            - "BillingTransaction.${bill}.status == PAST_DUE after clock 2026-09-17 (strictly past due_at)"
            - "after clock 2026-10-17 (past due_at + 30 days): Policy.${pol}.status == CANCELLED, AuditWorkOrder.${wo}.status == CANCELLED, BillingTransaction.${bill}.status == CANCELLED"

      - name: dispute_upheld_result_billing_workorder_reaudit_chain
        grounds:
          - state_machines.Dispute.UNDER_REVIEW_to_UPHELD
          - state_machines.AuditResult.DISPUTED_to_SUPERSEDED
          - state_machines.BillingTransaction.ISSUED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (dispute uphold, not the clock): Dispute UPHELD -> AuditResult
          SUPERSEDED -> its open BillingTransaction CANCELLED -> owning work order SUPERSEDED_BY_REAUDIT with a new
          REAUDIT work order created; the estimated-audit billing of 500000 is fully compensated.
        test_recipe:
          setup:
            - "WC policy WC-900 (CA): estimated premium 2000000, minimum 100000, payroll estimate 100000, mod 1.20, class code 8810 -> PHYSICAL work order; records request overdue; estimated audit approved (earned 2500000, billing +500000 ISSUED at 2026-08-17); insured disputes at 2026-08-20"
          setup_api_calls:
            - { call: "POST /classification-codes", payload: { code: "8810", description: "Clerical", state_code: "CA", coverage_line: "WC", rate_per_100_cents: 40, high_hazard: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: Underwriter, captures: { cc_a: "$.data.id" } }
            - { call: "POST /policies", payload: { policy_number: "WC-900", insured_name: "Iota", coverage_line: "WC", state_code: "CA", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-07-31T00:00:00Z", estimated_annual_premium_cents: 2000000, minimum_premium_cents: 100000, payroll_estimate_dollars: 100000, experience_mod_factor: 1.20, class_code_ids: ["${cc_a}"] }, as: Underwriter, captures: { pol: "$.data.id" } }
            - { call: "POST /audit-selection-runs", payload: {}, as: AuditManager }
            - { call: "GET /audit-work-orders", payload: { policy_id: "${pol}" }, as: AuditManager, captures: { wo: "$.data[0].id" } }
            - { call: "POST /audit-work-orders/${wo}/records-requests", payload: { request_type: "PAYROLL_SUMMARY" }, as: AuditManager, captures: { req1: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-17T00:00:00Z" }, as: AuditManager }
            - { call: "POST /audit-work-orders/${wo}/mark-noncompliant", payload: {}, as: AuditManager, as_user_id: "mgr-1" }
            - { call: "POST /audit-work-orders/${wo}/approve-estimated", payload: {}, as: AuditManager, as_user_id: "mgr-2", captures: { res: "$.data.id" } }
            - { call: "GET /audit-results/${res}/billing-transactions", payload: {}, as: AuditManager, captures: { bill: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: AuditManager }
            - { call: "POST /audit-results/${res}/disputes", payload: { grounds: "CERT_REVIEW_ERROR" }, as: Insured, as_user_id: "${pol}", captures: { dsp: "$.data.id" } }
            - { call: "POST /disputes/${dsp}/start-review", payload: {}, as: AuditManager, as_user_id: "mgr-1" }
          trigger:
            - { call: "POST /disputes/${dsp}/uphold", payload: {}, as: AuditManager, as_user_id: "mgr-1" }
            - { call: "GET /audit-results/${res}", payload: {}, as: AuditManager, captures: { res_status: "$.data.status" } }
            - { call: "GET /billing-transactions/${bill}", payload: {}, as: AuditManager, captures: { bill_status: "$.data.status" } }
            - { call: "GET /audit-work-orders/${wo}", payload: {}, as: AuditManager, captures: { wo_status: "$.data.status" } }
            - { call: "GET /audit-work-orders/${wo}/reaudits", payload: {}, as: AuditManager, captures: { re_id: "$.data[0].id", re_type: "$.data[0].audit_type" } }
          assert:
            - "Dispute.${dsp}.status == UPHELD"
            - "AuditResult.${res}.status == SUPERSEDED (hop 1)"
            - "BillingTransaction.${bill}.status == CANCELLED (hop 2: compensation for superseded result)"
            - "AuditWorkOrder.${wo}.status == SUPERSEDED_BY_REAUDIT (hop 3)"
            - "new work order ${re_id}: audit_type == REAUDIT, status == SELECTED"
            - "signed billing invariant after cascade: no non-CANCELLED billing exists for policy ${pol} until the re-audit issues"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: dispute_state_vs_temporal_priority
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - state_machines.AuditResult.ISSUED_to_DISPUTED
        distinguishing_aspect: |
          Error-category pair state vs business_temporal: a dispute filed when the result is already DISPUTED
          (state violation, priority 7) and the 30-day window has also closed (temporal violation, priority 9)
          must return ERR_INVALID_STATE_TRANSITION, not ERR_DISPUTE_WINDOW_CLOSED.
        test_recipe:
          setup:
            - "WC policy WC-1000 (CA): VOLUNTARY_REPORT work order carried to ISSUED at 2026-08-15 (allocation 95000 on 8810, earned 38000, credit 562000); first dispute filed at 2026-09-01 leaves the result DISPUTED; clock then moved to 2026-09-20, past the window end 2026-09-14T00:00:00Z"
          setup_api_calls:
