  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pp_state_beats_sod_on_mapping_approve
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - state_machines.ObligationControlMapping.PROPOSED_to_APPROVED
        distinguishing_aspect: |
          Error-category pair (state, business_safety): a second approve on an APPROVED
          mapping by its own creator violates BOTH the state precondition (p4) and SoD
          (p5); the state error ERR_INVALID_STATE must win because state is checked first.
        test_recipe:
          setup:
            - "ACTIVE obligation + ACTIVE control + one mapping already APPROVED (created by officer-a, approved by officer-b)"
          setup_api_calls:
            - call: "POST /compliance/regulatory-changes"
              payload: { citation: "PP-1", title: "Change", summary: "s", feed_source: "MANUAL_ENTRY", jurisdiction: "US-FED", regulator: "OCC", published_at: "2026-07-01T00:00:00Z", effective_date: "2026-12-01T00:00:00Z", severity_hint: "LOW" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { ch: $.data.id }
            - call: "POST /compliance/regulatory-changes/${ch}/triage"
              payload: { verdict: "APPLICABLE", rationale: "r" }
              as: ComplianceOfficer
              as_user_id: "officer-b"
            - call: "POST /compliance/obligations"
              payload: { obligation_code: "OBL-2026-PP1", title: "Obl", regulatory_change_id: "${ch}", criticality: "LOW" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { ob: $.data.id }
            - call: "POST /compliance/obligations/${ob}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /compliance/controls"
              payload: { control_code: "CTL-PP1", title: "Ctl", owner_department: "COMP", review_frequency_days: 90 }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { ct: $.data.id }
            - call: "POST /compliance/obligation-control-mappings"
              payload: { obligation_id: "${ob}", control_id: "${ct}", coverage_weight: 3 }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { mp: $.data.id }
            - call: "POST /compliance/obligation-control-mappings/${mp}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-b"
          trigger:
            - call: "POST /compliance/obligation-control-mappings/${mp}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { err: $.data.error_id }
          assert:
            - "Second approve returns ERR_INVALID_STATE (409), NOT ERR_SEGREGATION_OF_DUTIES_VIOLATION, even though officer-a is the creator (state priority 4 beats business_safety priority 5)"
            - "Mapping.${mp}.status remains APPROVED"

      - name: pp_temporal_beats_constraint_on_publish
        grounds:
          - validations[priority=6]
          - validations[priority=7]
        distinguishing_aspect: |
          Error-category pair (business_temporal, business_constraint) — different pair
          from pp_state_beats_sod_on_mapping_approve: publishing update 2 violates BOTH
          the 7-day training window (temporal, p6) and the rollout-window buffer
          (constraint, p7); ERR_TRAINING_WINDOW_TOO_SHORT must win.
        test_recipe:
          setup:
            - "Control with policy update 1 PUBLISHED (effective 2026-08-20); rollout window [2026-08-01, 2026-08-20] live; control.version now 3"
            - "Policy update 2 for the same control created with effective_date 2026-08-04 (only 3 days out), submitted and APPROVED"
          setup_api_calls:
            - call: "POST /compliance/controls"
              payload: { control_code: "CTL-PP2", title: "Ctl", owner_department: "COMP", review_frequency_days: 90 }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { ct: $.data.id, ct_v1: $.data.version }
            - call: "POST /compliance/policy-updates"
              payload: { control_id: "${ct}", title: "Update 1", change_summary: "c", effective_date: "2026-08-20T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { pu1: $.data.id }
            - call: "POST /compliance/policy-updates/${pu1}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /compliance/policy-updates/${pu1}/approve"
              payload: { expected_control_version: "${ct_v1}" }
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "POST /compliance/policy-updates/${pu1}/publish"
              payload: {}
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "GET /compliance/controls/${ct}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { ct_v3: $.data.version }
            - call: "POST /compliance/policy-updates"
              payload: { control_id: "${ct}", title: "Update 2", change_summary: "c", effective_date: "2026-08-04T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { pu2: $.data.id }
            - call: "POST /compliance/policy-updates/${pu2}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /compliance/policy-updates/${pu2}/approve"
              payload: { expected_control_version: "${ct_v3}" }
              as: ComplianceManager
              as_user_id: "manager-1"
          trigger:
            - call: "POST /compliance/policy-updates/${pu2}/publish"
              payload: {}
              as: ComplianceManager
              as_user_id: "manager-1"
              captures: { err: $.data.error_id }
          assert:
            - "Publish rejected with ERR_TRAINING_WINDOW_TOO_SHORT (422), NOT ERR_ROLLOUT_WINDOW_CONFLICT, even though both hold (temporal priority 6 beats constraint priority 7)"
            - "PolicyUpdate.${pu2}.status remains APPROVED; no second rollout created"

