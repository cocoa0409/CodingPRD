scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: report_turnaround_calendar_vs_coverage_clock_divergence
        grounds:
          - calculations.interpretation_turnaround
          - entities.ReviewReport.fields.turnaround_calendar_hours
          - entities.ReviewReport.fields.turnaround_coverage_hours
          - entities.ReviewReport.fields.sla_breached
          - state_machines.ReviewReport.PRELIM_DRAFT_to_PRELIM_ISSUED
        distinguishing_aspect: "Dual variance sits on the ReviewReport interpretation-timeliness domain: the same completed_at/prelim_issued_at pair yields turnaround_calendar_hours 22.00 under CALENDAR_CLOCK but turnaround_coverage_hours 8.00 under COVERAGE_CLOCK, and only the coverage variant decides sla_breached."
        test_recipe:
          setup:
            - "Unit 'EMU A' with storage_quota_gb 500.00, one bed, posture OPEN."
            - "Patient risk_tier MODERATE with an APPROVED authorization for 5 INPATIENT_VEEG days."
            - "Admission admitted at 2026-08-02T00:00:00Z into the bed; technologist shift active 2026-08-02T00:00:00Z..2026-08-10T00:00:00Z with max_concurrent_studies 2."
            - "One 32-channel INPATIENT_VEEG study acquiring since 2026-08-02T00:00:00Z and completed at 2026-08-04T12:00:00Z, which synthesized its ReviewReport in PRELIM_DRAFT."
            - "Logical clock parked at 2026-08-05T10:00:00Z — 22 calendar hours after completion, of which only 8 fall inside the 08:00-18:00 UTC reading window."
          setup_api_calls:
            - call: "POST /neurodiagnostics/units"
              payload: { name: "EMU A", bed_count: 2, storage_quota_gb: 500.00 }
              as: UnitCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /neurodiagnostics/beds"
              payload: { unit_id: "${unit_id}", label: "EMU-1" }
              as: UnitCoordinator
              captures: { bed_id: $.data.id }
            - call: "POST /neurodiagnostics/patients"
              payload: { mrn: "MRN-2391-01", display_name: "Pat One", risk_tier: "MODERATE" }
              as: UnitCoordinator
              captures: { patient_id: $.data.id }
            - call: "POST /neurodiagnostics/authorizations"
              payload: { patient_id: "${patient_id}", requested_setting: "INPATIENT_VEEG", requested_days: 5 }
              as: UnitCoordinator
              captures: { auth_id: $.data.id }
            - call: "POST /neurodiagnostics/authorizations/${auth_id}/submit"
              payload: {}
              as: UnitCoordinator
            - call: "POST /neurodiagnostics/authorizations/${auth_id}/payer-decision"
              payload: { outcome: "APPROVE", authorized_days: 5, authorized_setting: "INPATIENT_VEEG", payer_note: "5 inpatient days approved" }
              as: PayerReviewer
            - call: "POST /neurodiagnostics/admissions"
              payload: { patient_id: "${patient_id}", authorization_id: "${auth_id}", unit_id: "${unit_id}", setting: "INPATIENT_VEEG", scheduled_admit_at: "2026-08-02T00:00:00Z", target_event_count: 4, planned_days: 2 }
              as: UnitCoordinator
              captures: { adm_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: UnitCoordinator
            - call: "POST /neurodiagnostics/admissions/${adm_id}/admit"
              payload: { bed_id: "${bed_id}" }
              as: UnitCoordinator
            - call: "POST /neurodiagnostics/technologist-shifts"
              payload: { unit_id: "${unit_id}", technologist_user_id: "tech-1", starts_at: "2026-08-02T00:00:00Z", ends_at: "2026-08-10T00:00:00Z", max_concurrent_studies: 2 }
              as: UnitCoordinator
              captures: { shift_id: $.data.id }
            - call: "POST /neurodiagnostics/technologist-shifts/${shift_id}/activate"
              payload: {}
              as: UnitCoordinator
            - call: "POST /neurodiagnostics/studies"
              payload: { admission_id: "${adm_id}", channel_count: 32, modality: "INPATIENT_VEEG" }
              as: Technologist
              captures: { study_id: $.data.id }
            - call: "POST /neurodiagnostics/studies/${study_id}/start"
              payload: { shift_id: "${shift_id}" }
              as: Technologist
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T12:00:00Z" }
              as: Technologist
            - call: "POST /neurodiagnostics/studies/${study_id}/complete"
              payload: {}
              as: Technologist
            - call: "GET /neurodiagnostics/studies/${study_id}/reports"
              payload: {}
              as: Epileptologist
              captures: { report_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T10:00:00Z" }
              as: Epileptologist
          trigger:
            - call: "POST /neurodiagnostics/reports/${report_id}/issue-prelim"
              payload: { localization: "LEFT_TEMPORAL" }
              as: Epileptologist
              as_user_id: "epi-prelim-1"
          assert:
            - "ReviewReport.${report_id}.status == PRELIM_ISSUED"
            - "ReviewReport.${report_id}.turnaround_calendar_hours == 22.00"
            - "ReviewReport.${report_id}.turnaround_coverage_hours == 8.00"
            - "ReviewReport.${report_id}.turnaround_calendar_hours != ReviewReport.${report_id}.turnaround_coverage_hours"
            - "ReviewReport.${report_id}.sla_breached == false"
            - "ReviewReport.${report_id}.prelim_author_user_id == 'epi-prelim-1'"

      - name: admission_capture_adequacy_retrospective_vs_prospective_divergence
        grounds:
          - calculations.capture_adequacy_index
          - entities.Admission.fields.capture_adequacy_index
          - entities.Admission.fields.capture_adequacy_index_prospective
          - entities.Admission.fields.projected_daily_yield
          - state_machines.EventMarking.PROPOSED_to_ADJUDICATED
        distinguishing_aspect: "Dual variance sits on a different entity domain — capture sufficiency of an Admission, not report timeliness: identical adjudicated-marking data yields capture_adequacy_index 0.500 (RETROSPECTIVE_ADJUDICATED, clamped) versus capture_adequacy_index_prospective 1.250 (PROSPECTIVE, unclamped and crediting the 3 remaining authorized days), and only the retrospective value can gate CAPTURE_TARGET_MET."
        test_recipe:
          setup:
            - "Same unit/patient/authorization/admission/shift baseline; authorization APPROVED for 5 days, 2 reserved at admit so days_available == 3."
            - "Admission admitted 2026-08-02T00:00:00Z with target_event_count 4 and no TaperPlan, so every marking weight is undiscounted."
            - "Study started 2026-08-02T00:00:00Z and paused at 2026-08-03T00:00:00Z, closing one segment so markings fall inside a closed window."
            - "Two CLINICAL_SEIZURE markings adjudicated (weight 1.0 each) -> weighted_event_count 2.000, still below the target of 4."
            - "Logical clock at 2026-08-04T00:00:00Z -> elapsed_monitored_days 2.000 and projected_daily_yield 1.000."
          setup_api_calls:
            - call: "POST /neurodiagnostics/units"
              payload: { name: "EMU A", bed_count: 2, storage_quota_gb: 500.00 }
              as: UnitCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /neurodiagnostics/beds"
              payload: { unit_id: "${unit_id}", label: "EMU-1" }
              as: UnitCoordinator
              captures: { bed_id: $.data.id }
            - call: "POST /neurodiagnostics/patients"
              payload: { mrn: "MRN-2391-02", display_name: "Pat Two", risk_tier: "MODERATE" }
              as: UnitCoordinator
              captures: { patient_id: $.data.id }
            - call: "POST /neurodiagnostics/authorizations"
              payload: { patient_id: "${patient_id}", requested_setting: "INPATIENT_VEEG", requested_days: 5 }
              as: UnitCoordinator
              captures: { auth_id: $.data.id }
            - call: "POST /neurodiagnostics/authorizations/${auth_id}/submit"
              payload: {}
              as: UnitCoordinator
            - call: "POST /neurodiagnostics/authorizations/${auth_id}/payer-decision"
              payload: { outcome: "APPROVE", authorized_days: 5, authorized_setting: "INPATIENT_VEEG", payer_note: "approved" }
              as: PayerReviewer
            - call: "POST /neurodiagnostics/admissions"
              payload: { patient_id: "${patient_id}", authorization_id: "${auth_id}", unit_id: "${unit_id}", setting: "INPATIENT_VEEG", scheduled_admit_at: "2026-08-02T00:00:00Z", target_event_count: 4, planned_days: 2 }
              as: UnitCoordinator
              captures: { adm_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: UnitCoordinator
            - call: "POST /neurodiagnostics/admissions/${adm_id}/admit"
              payload: { bed_id: "${bed_id}" }
              as: UnitCoordinator
            - call: "POST /neurodiagnostics/technologist-shifts"
              payload: { unit_id: "${unit_id}", technologist_user_id: "tech-1", starts_at: "2026-08-02T00:00:00Z", ends_at: "2026-08-10T00:00:00Z", max_concurrent_studies: 2 }
              as: UnitCoordinator
              captures: { shift_id: $.data.id }
            - call: "POST /neurodiagnostics/technologist-shifts/${shift_id}/activate"
              payload: {}
              as: UnitCoordinator
            - call: "POST /neurodiagnostics/studies"
              payload: { admission_id: "${adm_id}", channel_count: 32, modality: "INPATIENT_VEEG" }
              as: Technologist
              captures: { study_id: $.data.id }
            - call: "POST /neurodiagnostics/studies/${study_id}/start"
              payload: { shift_id: "${shift_id}" }
              as: Technologist
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: Technologist
            - call: "POST /neurodiagnostics/studies/${study_id}/pause"
              payload: { reason: "ROUTINE_SEGMENT_CLOSE" }
              as: Technologist
            - call: "POST /neurodiagnostics/markings"
              payload: { study_id: "${study_id}", onset_at: "2026-08-02T06:00:00Z", event_class: "CLINICAL_SEIZURE", duration_seconds: 90 }
              as: Epileptologist
              captures: { m1_id: $.data.id }
            - call: "POST /neurodiagnostics/markings/${m1_id}/adjudicate"
              payload: {}
              as: Epileptologist
            - call: "POST /neurodiagnostics/markings"
              payload: { study_id: "${study_id}", onset_at: "2026-08-02T12:00:00Z", event_class: "CLINICAL_SEIZURE", duration_seconds: 75 }
              as: Epileptologist
              captures: { m2_id: $.data.id }
            - call: "POST /neurodiagnostics/markings/${m2_id}/adjudicate"
              payload: {}
              as: Epileptologist
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:00Z" }
              as: Epileptologist
          trigger:
            - call: "GET /neurodiagnostics/admissions/${adm_id}/capture-summary"
              payload: {}
              as: Epileptologist
          assert:
            - "capture-summary.weighted_event_count == 2.000"
            - "capture-summary.elapsed_monitored_days == 2.000"
            - "capture-summary.projected_daily_yield == 1.000"
            - "capture-summary.deficit_weighted == 2.000"
            - "capture-summary.adequacy_retrospective == 0.500"
            - "capture-summary.adequacy_prospective == 1.250"
            - "Admission.${adm_id}.clinical_state == ADMITTED"
            - "AuthorizationRequest.${auth_id}.days_available == 3"

  - rule_id: combinatorial_formula
    instances:
      - name: study_storage_gb_round_per_segment_then_sum
        grounds:
          - calculations.study_storage_gb
          - entities.Study.fields.stored_gb
          - entities.Study.fields.closed_segment_count
          - state_machines.Study.ACQUIRING_to_PAUSED
          - state_machines.Study.PAUSED_to_COMPLETED
        distinguishing_aspect: "Mode (b) nested rounding where order matters: two closed segments of 1538 and 1243 minutes at 32 channels INPATIENT_VEEG round to 49.22 + 39.78 = 89.00 under the pinned round-per-segment-then-sum order, whereas sum-then-round would give 88.99 — a one-cent divergence the scaffold resolves by pinning per-segment rounding."
        test_recipe:
          setup:
            - "Unit with storage_quota_gb 500.00; patient, APPROVED 5-day INPATIENT_VEEG authorization, admission admitted 2026-08-02T00:00:00Z."
            - "Shift active 2026-08-02T00:00:00Z..2026-08-10T00:00:00Z, max_concurrent_studies 2."
            - "32-channel INPATIENT_VEEG study: segment 1 runs 2026-08-03T08:00:00Z -> 2026-08-04T09:38:00Z (1538 min), segment 2 runs 2026-08-04T10:21:00Z -> 2026-08-05T07:04:00Z (1243 min)."
          setup_api_calls:
            - call: "POST /neurodiagnostics/units"
              payload: { name: "EMU A", bed_count: 2, storage_quota_gb: 500.00 }
              as: UnitCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /neurodiagnostics/beds"
              payload: { unit_id: "${unit_id}", label: "EMU-1" }
              as: UnitCoordinator
              captures: { bed_id: $.data.id }
            - call: "POST /neurodiagnostics/patients"
              payload: { mrn: "MRN-2391-03", display_name: "Pat Three", risk_tier: "MODERATE" }
              as: UnitCoordinator
              captures: { patient_id: $.data.id }
            - call: "POST /neurodiagnostics/authorizations"
              payload: { patient_id: "${patient_id}", requested_setting: "INPATIENT_VEEG", requested_days: 5 }
              as: UnitCoordinator
              captures: { auth_id: $.data.id }
            - call: "POST /neurodiagnostics/authorizations/${auth_id}/submit"
              payload: {}
              as: UnitCoordinator
            - call: "POST /neurodiagnostics/authorizations/${auth_id}/payer-decision"
              payload: { outcome: "APPROVE", authorized_days: 5, authorized_setting: "INPATIENT_VEEG", payer_note: "approved" }
              as: PayerReviewer
            - call: "POST /neurodiagnostics/admissions"
              payload: { patient_id: "${patient_id}", authorization_id: "${auth_id}", unit_id: "${unit_id}", setting: "INPATIENT_VEEG", scheduled_admit_at: "2026-08-02T00:00:00Z", target_event_count: 4, planned_days: 5 }
              as: UnitCoordinator
              captures: { adm_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: UnitCoordinator
            - call: "POST /neurodiagnostics/admissions/${adm_id}/admit"
              payload: { bed_id: "${bed_id}" }
              as: UnitCoordinator
            - call: "POST /neurodiagnostics/technologist-shifts"
              payload: { unit_id: "${unit_id}", technologist_user_id: "tech-1", starts_at: "2026-08-02T00:00:00Z", ends_at: "2026-08-10T00:00:00Z", max_concurrent_studies: 2 }
              as: UnitCoordinator
              captures: { shift_id: $.data.id }
            - call: "POST /neurodiagnostics/technologist-shifts/${shift_id}/activate"
              payload: {}
              as: UnitCoordinator
            - call: "POST /neurodiagnostics/studies"
              payload: { admission_id: "${adm_id}", channel_count: 32, modality: "INPATIENT_VEEG" }
              as: Technologist
              captures: { study_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: Technologist
            - call: "POST /neurodiagnostics/studies/${study_id}/start"
              payload: { shift_id: "${shift_id}" }
              as: Technologist
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T09:38:00Z" }
              as: Technologist
            - call: "POST /neurodiagnostics/studies/${study_id}/pause"
              payload: { reason: "ELECTRODE_CHECK" }
              as: Technologist
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T10:21:00Z" }
              as: Technologist
            - call: "POST /neurodiagnostics/studies/${study_id}/resume"
              payload: {}
              as: Technologist
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T07:04:00Z" }
              as: Technologist
          trigger:
            - call: "POST /neurodiagnostics/studies/${study_id}/complete"
              payload: {}
              as: Technologist
          assert:
            - "Study.${study_id}.closed_segment_count == 2"
            - "Study.${study_id}.acquired_minutes == 2781"
            - "Study.${study_id}.stored_gb == 89.00"
            - "Study.${study_id}.stored_gb != 88.99"
            - "Study.${study_id}.acquisition_state == COMPLETED"
            - "MonitoringUnit.${unit_id}.storage_used_gb == 89.00"
            - "MonitoringUnit.${unit_id}.storage_pressure_pct == 17.80"

      - name: alert_deadline_four_input_nested_clamp
        grounds:
          - calculations.alert_response_deadline
          - entities.SeizureAlert.fields.response_deadline_minutes
          - entities.SeizureAlert.fields.latency_minutes
          - state_machines.SeizureAlert.AWAITING_RESPONSE_to_RESPONDED_ON_TIME
        distinguishing_aspect: "Mode (a) non-linear multi-input formula: risk_tier MODERATE (base 6), taper step 0, unit posture OPEN and a 14:00 UTC daytime detection combine inside max(2, min(15, ...)) to freeze response_deadline_minutes == 6, and a latency of exactly 6 minutes lands on the inclusive ON_TIME side."
        test_recipe:
          setup:
            - "Unit storage_quota_gb 500.00 with an active shift whose max_concurrent_studies is 2, so one acquiring study leaves posture OPEN (1 < 2) and storage pressure far below 90.00."
            - "MODERATE-risk patient admitted 2026-08-02T00:00:00Z with no TaperPlan, so the taper adjustment term is 0."
            - "32-channel study acquiring; logical clock advanced to 2026-08-03T14:00:00Z (a daytime hour, so no night adjustment) when the algorithm raises the alert."
          setup_api_calls:
            - call: "POST /neurodiagnostics/units"
              payload: { name: "EMU A", bed_count: 2, storage_quota_gb: 500.00 }
              as: UnitCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /neurodiagnostics/beds"
              payload: { unit_id: "${unit_id}", label: "EMU-1" }
              as: UnitCoordinator
              captures: { bed_id: $.data.id }
            - call: "POST /neurodiagnostics/patients"
              payload: { mrn: "MRN-2391-04", display_name: "Pat Four", risk_tier: "MODERATE" }
              as: UnitCoordinator
              captures: { patient_id: $.data.id }
            - call: "POST /neurodiagnostics/authorizations"
              payload: { patient_id: "${patient_id}", requested_setting: "INPATIENT_VEEG", requested_days: 5 }
              as: UnitCoordinator
              captures: { auth_id: $.data.id }
            - call: "POST /neurodiagnostics/authorizations/${auth_id}/submit"
              payload: {}
              as: UnitCoordinator
            - call: "POST /neurodiagnostics/authorizations/${auth_id}/payer-decision"
              payload: { outcome: "APPROVE", authorized_days: 5, authorized_setting: "INPATIENT_VEEG", payer_note: "approved" }
              as: PayerReviewer
            - call: "POST /neurodiagnostics/admissions"
              payload: { patient_id: "${patient_id}", authorization_id: "${auth_id}", unit_id: "${unit_id}", setting: "INPATIENT_VEEG", scheduled_admit_at: "2026-08-02T00:00:00Z", target_event_count: 4, planned_days: 5 }
              as: UnitCoordinator
              captures: { adm_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: UnitCoordinator
            - call: "POST /neurodiagnostics/admissions/${adm_id}/admit"
              payload: { bed_id: "${bed_id}" }
              as: UnitCoordinator
            - call: "POST /neurodiagnostics/technologist-shifts"
              payload: { unit_id: "${unit_id}", technologist_user_id: "tech-1", starts_at: "2026-08-02T00:00:00Z", ends_at: "2026-08-10T00:00:00Z", max_concurrent_studies: 2 }
              as: UnitCoordinator
              captures: { shift_id: $.data.id }
            - call: "POST /neurodiagnostics/technologist-shifts/${shift_id}/activate"
              payload: {}
              as: UnitCoordinator
            - call: "POST /neurodiagnostics/studies"
              payload: { admission_id: "${adm_id}", channel_count: 32, modality: "INPATIENT_VEEG" }
              as: Technologist
              captures: { study_id: $.data.id }
            - call: "POST /neurodiagnostics/studies/${study_id}/start"
              payload: { shift_id: "${shift_id}" }
              as: Technologist
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T14:00:00Z" }
              as: Technologist
            - call: "POST /neurodiagnostics/studies/${study_id}/alerts"
              payload: { source: "ALGORITHM" }
              as: Technologist
              captures: { alert_id: $.data.id, deadline_at_detection: $.data.response_deadline_minutes }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T14:06:00Z" }
              as: Nurse
          trigger:
            - call: "POST /neurodiagnostics/alerts/${alert_id}/interventions"
              payload: { interventions: ["POSITIONING", "SEIZURE_TESTING", "VITALS"], injury_observed: false, rescue_med_given: false }
              as: Nurse
              as_user_id: "nurse-1"
            - call: "GET /neurodiagnostics/alerts/${alert_id}"
              payload: {}
              as: Nurse
          assert:
            - "SeizureAlert.${alert_id}.response_deadline_minutes == 6"
            - "SeizureAlert.${alert_id}.latency_minutes == 6"
            - "SeizureAlert.${alert_id}.response_state == RESPONDED_ON_TIME"
            - "SeizureAlert.${alert_id}.triage_state == DETECTED"
            - "MonitoringUnit.${unit_id}.late_response_count == 0"

      - name: los_extension_pinned_evaluation_order_s1_s7
        grounds:
          - calculations.los_extension_decision
          - calculations.authorization_day_ledger
          - concurrency_rules[admission-extension-stale]
          - entities.Admission.fields.last_extension_granted_days
          - entities.Admission.fields.planned_discharge_at
        distinguishing_aspect: "Mode (c) circular-looking dependency resolved by a pinned order: the risk budget caps the granted days, the granted days move planned_discharge_at, and that in turn would change the elapsed days feeding the yield — S1..S7 evaluate every term against pre-call state, producing yield_days 2, daily_risk 4.5, risk_budget_days 5 and granted_days 2 exactly once."
        test_recipe:
          setup:
            - "APPROVED authorization for 5 days; admission admitted 2026-08-02T00:00:00Z with planned_days 2 (days_reserved 2, days_available 3) and target_event_count 4."
            - "TaperPlan with total_steps 3 advanced once, so current_step == 1 and daily_risk == 3 + 1.5 * 1 == 4.5 with the unit posture OPEN."
            - "Study started 2026-08-02T00:00:00Z, paused 2026-08-03T00:00:00Z; two CLINICAL_SEIZURE markings created at taper step 1 (weight 1.0 each, no provoked discount) and adjudicated -> weighted_event_count 2.000, deficit_weighted 2.000."
            - "Logical clock at 2026-08-04T00:00:00Z -> elapsed_monitored_days 2.000, projected_daily_yield 1.000."
          setup_api_calls:
            - call: "POST /neurodiagnostics/units"
              payload: { name: "EMU A", bed_count: 2, storage_quota_gb: 500.00 }
              as: UnitCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /neurodiagnostics/beds"
              payload: { unit_id: "${unit_id}", label: "EMU-1" }
              as: UnitCoordinator
              captures: { bed_id: $.data.id }
            - call: "POST /neurodiagnostics/patients"
              payload: { mrn: "MRN-2391-05", display_name: "Pat Five", risk_tier: "MODERATE" }
              as: UnitCoordinator
              captures: { patient_id: $.data.id }
            - call: "POST /neurodiagnostics/authorizations"
              payload: { patient_id: "${patient_id}", requested_setting: "INPATIENT_VEEG", requested_days: 5 }
              as: UnitCoordinator
              captures: { auth_id: $.data.id }
            - call: "POST /neurodiagnostics/authorizations/${auth_id}/submit"
              payload: {}
