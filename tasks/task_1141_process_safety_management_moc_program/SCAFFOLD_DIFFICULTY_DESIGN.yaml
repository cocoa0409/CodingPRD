            - "Pssr.${pssb} created (201): 2026-07-10 start == PSSR-A end is adjacency, allowed under half-open [start, end)"
            - "Pssr.${pssa}.status == PLANNED (different MOC — NOT voided by B's create)"
            - "PSSR-C create rejected: error_id == ERR_PSSR_WINDOW_OVERLAP (2026-07-09 < 2026-07-10 intersects PSSR-A)"

      - name: audit_window_buffered_gap
        grounds:
          - validations[priority=8.3]
          - entities.Audit.fields.field_window_start
          - errors[ERR_AUDIT_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Same resource (PlantUnit) but a DIFFERENT booking entity (Audit) and DIFFERENT
          interval semantics: closed intervals with a mandatory 14-day buffer — adjacency is
          NOT allowed; new.start must be > existing.end + 14 days. 2026-08-20 passes
          (> 2026-08-19), 2026-08-19 fails.
        test_recipe:
          setup:
            - "Unit U; AUD exists; audit AU-1 SCHEDULED with window [2026-08-01, 2026-08-05]"
          setup_api_calls:
            - { call: "POST /psm/units", payload: { name: "U", unit_code: "U1", pha_cycle_months: 12 }, as: PsmAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Aud", employee_ref: "E-AUD" }, as: PsmAdmin, captures: { aud_id: $.data.id } }
