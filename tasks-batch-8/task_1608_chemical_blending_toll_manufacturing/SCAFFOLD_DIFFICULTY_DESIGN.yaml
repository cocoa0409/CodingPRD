              as: QAValidator
            - call: "POST /toll-operations/customers/${c17}/batch-jobs"
              payload: { recipe_id: "${r17}", pricing_agreement_id: "${pa17}", tank_id: "${t17}", batch_size_l: 100, scheduled_start: "2026-11-10T08:00:00Z", scheduled_end: "2026-11-10T12:00:00Z" }
              as: BatchScheduler
              captures: { bj17: $.data.id, bj17_v: $.data.version }
            - call: "POST /toll-operations/customers/${c17}/batch-jobs/${bj17}/release"
              payload: { expected_batch_job_version: "${bj17_v}" }
              as: BatchScheduler
            - call: "POST /toll-operations/customers/${c17}/batch-jobs/${bj17}/batch-charges"
              payload: { raw_material_lot_id: "${l17}", charge_order: 1, charged_qty_kg: 150 }
              as: TankOperator
          trigger:
            - call: "POST /toll-operations/customers/${c17}/batch-jobs/${bj17}/cancel"
              payload: {}
              as: BatchScheduler
          assert:
            - "RawMaterialLot.${l17}.quantity_kg_available == 400 (restored after cancel)"
            - "RawMaterialLot.${l17}.quantity_kg_committed == 0"
            - "RawMaterialLot.${l17}.quantity_kg_on_hand == 400"
            - "BatchCharge for ${bj17} has status == RELEASED"
            - "Tank.${t17}.operational_state == AVAILABLE (cancel also compensates tank)"

      - name: tank_occupancy_invariant_via_complete_reverses_reservation
        grounds:
          - state_machines.Tank
          - state_machines.BatchJob.HOLD_QA_to_COMPLETED
        distinguishing_aspect: |
          Conserved quantity: Tank.occupied_by_batch_id (null when
          AVAILABLE). Forward: BatchJob INTAKE->RELEASED reserves the tank
          (occupied_by_batch_id := batch_id). Compensating: BatchJob
          HOLD_QA->COMPLETED releases the tank (occupied_by_batch_id :=
          null). Invariant: after a complete batch lifecycle, tank returns
          to AVAILABLE with occupied_by_batch_id == null. Distinct conserved
          quantity from instance 1 (lot mass vs tank occupancy pointer).
        test_recipe:
          setup:
            - "Customer C18, PA18 ACTIVE, R18 APPROVED, T18 CLEAN_VALIDATED, L18 lot"
            - "BJ18 driven INTAKE -> RELEASED -> CHARGING -> MIXING -> HOLD_QA -> COMPLETED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /toll-operations/customers"
              payload: { legal_name: "Rho Adhesives" }
              as: QualityManager
              captures: { c18: $.data.id }
            - call: "POST /toll-operations/customers/${c18}/raw-material-lots"
              payload: { material_code: "ADH", ghS_class: "NON_HAZ", quantity_kg_received: 500, storage_zone: "Z_GENERAL", received_at: "2026-08-02T08:00:00Z" }
              as: BatchScheduler
              captures: { l18: $.data.id }
            - call: "POST /toll-operations/recipes"
              payload: { name: "Adhesive Blend", revision: 1, customer_id: "${c18}", target_density_kg_per_l: 1.05, theoretical_yield_pct: 98, components: [{ material_code: "ADH", mass_fraction_pct: 100.000, charge_order: 1 }] }
              as: QualityManager
              captures: { r18: $.data.id }
            - call: "POST /toll-operations/recipes/${r18}/approve"
              payload: {}
              as: QualityManager
            - call: "POST /toll-operations/customers/${c18}/pricing-agreements"
              payload: { pricing_mode: "TOLLING_FEE", tolling_base_fee_cents: 100, tolling_per_kg_cents: 1, formulated_price_per_kg_cents: 0, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: QualityManager
              captures: { pa18: $.data.id, pa18_v: $.data.version }
            - call: "POST /toll-operations/customers/${c18}/pricing-agreements/${pa18}/activate"
              payload: { expected_pricing_agreement_version: "${pa18_v}" }
              as: QualityManager
            - call: "POST /toll-operations/tanks"
              payload: { tank_code: "TK-1801", capacity_l: 500, working_capacity_l: 500, current_zone: "Z_GENERAL" }
              as: QualityManager
              captures: { t18: $.data.id }
            - call: "POST /toll-operations/tanks/${t18}/cleaning-records"
              payload: { method: "DRY_PURGE", started_at: "2026-08-02T08:00:00Z", completed_at: "2026-08-02T09:00:00Z", residue_ppm: 0 }
              as: TankOperator
              captures: { cr18: $.data.id }
            - call: "POST /toll-operations/tanks/${t18}/cleaning-records/${cr18}/submit"
              payload: {}
              as: TankOperator
            - call: "POST /toll-operations/tanks/${t18}/cleaning-records/${cr18}/validate"
              payload: { decision: "PASS" }
              as: QAValidator
            - call: "POST /toll-operations/customers/${c18}/batch-jobs"
              payload: { recipe_id: "${r18}", pricing_agreement_id: "${pa18}", tank_id: "${t18}", batch_size_l: 100, scheduled_start: "2026-11-15T08:00:00Z", scheduled_end: "2026-11-15T12:00:00Z" }
              as: BatchScheduler
              captures: { bj18: $.data.id, bj18_v: $.data.version }
            - call: "POST /toll-operations/customers/${c18}/batch-jobs/${bj18}/release"
              payload: { expected_batch_job_version: "${bj18_v}" }
              as: BatchScheduler
            - call: "POST /toll-operations/customers/${c18}/batch-jobs/${bj18}/batch-charges"
              payload: { raw_material_lot_id: "${l18}", charge_order: 1, charged_qty_kg: 100 }
              as: TankOperator
            - call: "POST /toll-operations/customers/${c18}/batch-jobs/${bj18}/start-charging"
              payload: {}
              as: TankOperator
            - call: "POST /toll-operations/customers/${c18}/batch-jobs/${bj18}/start-mixing"
              payload: {}
              as: TankOperator
            - call: "POST /toll-operations/customers/${c18}/batch-jobs/${bj18}/hold-for-qa"
              payload: {}
              as: TankOperator
            - call: "POST /toll-operations/customers/${c18}/batch-jobs/${bj18}/sds"
              payload: { ghs_classification: "NON_HAZ", signal_word: "NONE", hazard_statements: [] }
              as: SDSAuthor
              captures: { sds18: $.data.id }
            - call: "POST /toll-operations/customers/${c18}/batch-jobs/${bj18}/sds/${sds18}/issue"
              payload: {}
              as: SDSAuthor
            - call: "POST /toll-operations/customers/${c18}/batch-jobs/${bj18}/package-config"
              payload: { package_type: "DRUM_205L", un_rated: false, package_count: 1 }
              as: ShippingClerk
            - call: "POST /toll-operations/customers/${c18}/batch-jobs/${bj18}/heel-disposals"
              payload: { raw_material_lot_id: "${l18}", heel_returned_kg: 5, heel_disposed_kg: 0, disposed_at: "2026-11-15T11:00:00Z" }
              as: TankOperator
              captures: { hd18: $.data.id }
            - call: "POST /toll-operations/customers/${c18}/batch-jobs/${bj18}/heel-disposals/${hd18}/post"
              payload: {}
              as: TankOperator
          trigger:
            - call: "POST /toll-operations/customers/${c18}/batch-jobs/${bj18}/complete"
              payload: { actual_output_kg: 95 }
              as: QAValidator
          assert:
            - "Tank.${t18}.operational_state == AVAILABLE"
            - "Tank.${t18}.occupied_by_batch_id == null"
            - "Tank.${t18}.cleaning_state == DIRTY (forced re-clean before next batch)"
            - "Tank.${t18}.last_product_ghs == NON_HAZ (snapshot from batch)"
