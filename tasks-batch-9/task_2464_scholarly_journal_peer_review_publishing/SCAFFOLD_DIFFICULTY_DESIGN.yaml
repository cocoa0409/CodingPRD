scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: reviewer_reliability_rolling_vs_lifetime_window_divergence
        grounds:
          - calculations.reviewer_reliability_score
          - entities.Reviewer.fields.reliability_score_rolling
          - entities.Reviewer.fields.reliability_score_lifetime
          - state_machines.ReviewInvitation.INVITED_to_DECLINED
          - state_machines.ReviewInvitation.ACCEPTED_to_SUBMITTED
        distinguishing_aspect: |
          This instance lives in the reviewer-conduct domain (entity Reviewer): the ROLLING and
          LIFETIME variants of reviewer_reliability_score read the SAME two closed invitations of
          one reviewer but different windows (created_at >= current_utc - 180 days vs all time), so
          the same reviewer simultaneously carries reliability_score_rolling == 100.00 and
          reliability_score_lifetime == 77.50 — a 22.50 delta caused only by the window boundary.
        test_recipe:
          setup:
            - "One Journal with default config (min_completed_reviews_for_decision = 2), one CHIEF editor, one HANDLING editor, one Author."
            - "One Manuscript by that Author, integrity-screened clean, handled by the HANDLING editor and advanced to UNDER_REVIEW."
            - "One Reviewer who DECLINED an invitation created at 2026-08-01 and then, after the clock moves to 2027-03-01 (213 days later, past the 180-day rolling boundary), accepted a second invitation."
            - "Logical clock parked at 2027-03-01T00:00:00Z; the second invitation is due 2027-03-22T00:00:00Z, so the review submitted on that date is on time."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /journals"
              payload: { name: "Journal of Applied Oncology", subject_areas: ["ONCOLOGY"] }
              as: SystemAdmin
              captures: { j_id: $.data.id }
            - call: "POST /editors"
              payload: { journal_id: "${j_id}", email: "chief@soc.org", full_name: "Chief Editor", affiliation: "Univ Alpha", subject_areas: ["ONCOLOGY"], role_level: "CHIEF" }
              as: SystemAdmin
              captures: { ed_chief_id: $.data.id }
            - call: "POST /editors"
              payload: { journal_id: "${j_id}", email: "he1@soc.org", full_name: "Handling One", affiliation: "Univ Beta", subject_areas: ["ONCOLOGY"], role_level: "HANDLING", max_concurrent_assignments: 3 }
              as: SystemAdmin
              captures: { ed_h1_id: $.data.id }
            - call: "POST /authors"
              payload: { email: "author1@x.org", full_name: "Author One", affiliation: "Univ Gamma" }
              as: SystemAdmin
              captures: { au_id: $.data.id }
            - call: "POST /manuscripts"
              payload: { journal_id: "${j_id}", corresponding_author_id: "${au_id}", title: "Tumour Marker Study", subject_area: "ONCOLOGY", oa_license: "CC_BY", page_count: 20, figure_count: 5, data_availability_statement: "Data at repository DOI 10.9999/tms" }
              as: Author
              as_user_id: "${au_id}"
              captures: { m_id: $.data.id }
            - call: "POST /manuscripts/${m_id}/integrity-screenings"
              payload: { scan_type: "PLAGIARISM", similarity_pct: 5.0 }
              as: SystemAdmin
            - call: "GET /manuscripts/${m_id}"
              as: SystemAdmin
              captures: { m_v: $.data.version }
            - call: "POST /editor-assignments"
              payload: { manuscript_id: "${m_id}", editor_id: "${ed_h1_id}", expected_manuscript_version: "${m_v}" }
              as: EditorInChief
              as_user_id: "${ed_chief_id}"
              captures: { ea_id: $.data.id }
            - call: "POST /editor-assignments/${ea_id}/conflict-declaration"
              payload: { declared_conflict: false }
              as: HandlingEditor
              as_user_id: "${ed_h1_id}"
            - call: "POST /manuscripts/${m_id}/screening-decision"
              payload: { action: "ADVANCE_TO_REVIEW" }
              as: HandlingEditor
              as_user_id: "${ed_h1_id}"
            - call: "POST /reviewers"
              payload: { email: "rev_r@inst.org", full_name: "Reviewer R", affiliation: "Univ Delta", subject_areas: ["ONCOLOGY"] }
              as: SystemAdmin
              captures: { rv_id: $.data.id }
            - call: "POST /review-invitations"
              payload: { manuscript_id: "${m_id}", reviewer_id: "${rv_id}" }
              as: HandlingEditor
              as_user_id: "${ed_h1_id}"
              captures: { inv1_id: $.data.id }
            - call: "POST /review-invitations/${inv1_id}/response"
              payload: { response: "DECLINE", decline_reason: "Competing commitments" }
              as: Reviewer
              as_user_id: "${rv_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-03-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /review-invitations"
              payload: { manuscript_id: "${m_id}", reviewer_id: "${rv_id}" }
              as: HandlingEditor
              as_user_id: "${ed_h1_id}"
              captures: { inv2_id: $.data.id }
            - call: "POST /review-invitations/${inv2_id}/response"
              payload: { response: "ACCEPT" }
              as: Reviewer
              as_user_id: "${rv_id}"
          trigger:
            - call: "POST /review-invitations/${inv2_id}/reviews"
              payload: { recommendation: "ACCEPT", novelty_score: 4, rigor_score: 4, clarity_score: 5, comments: "Solid contribution" }
              as: Reviewer
              as_user_id: "${rv_id}"
              captures: { rev1_id: $.data.id, rev1_weight: $.data.reliability_weight, rev1_late: $.data.days_late }
            - call: "GET /reviewers/${rv_id}"
              as: SystemAdmin
              captures: { rv_rolling: $.data.reliability_score_rolling, rv_lifetime: $.data.reliability_score_lifetime }
          assert:
            - "Review.${rev1_id}.days_late == 0"
            - "Reviewer.${rv_id}.reliability_score_rolling == 100.00"
            - "Reviewer.${rv_id}.reliability_score_lifetime == 77.50"
            - "Reviewer.${rv_id}.reliability_score_rolling - Reviewer.${rv_id}.reliability_score_lifetime == 22.50"
            - "Review.${rev1_id}.reliability_weight == 1.0000"
            - "Reviewer.${rv_id}.declined_count == 1"
            - "Reviewer.${rv_id}.submitted_count == 1"
            - "Reviewer.${rv_id}.late_days_total == 0"
            - "Reviewer.${rv_id}.status == ACTIVE"
      - name: consensus_index_unweighted_vs_reliability_weighted_category_flip
        grounds:
          - calculations.decision_consensus_index
          - entities.Decision.fields.consensus_index
          - entities.Decision.fields.auto_category
          - entities.Decision.fields.consensus_mode
          - entities.Journal.fields.consensus_mode
          - state_machines.Manuscript.DECISION_PENDING_to_REVISION_REQUESTED
        distinguishing_aspect: |
          This instance lives in the editorial-decision domain (entities Decision/Journal), not the
          reviewer-conduct domain: over the identical recommendation multiset {ACCEPT,
          MAJOR_REVISION} the UNWEIGHTED variant yields consensus_index 3.00 -> auto_category
          MINOR_REVISION while the RELIABILITY_WEIGHTED variant yields 3.54 -> auto_category
          ACCEPT, so the variant switch alone changes the decision band.
        test_recipe:
          setup:
            - "One Journal in default consensus_mode UNWEIGHTED with min_completed_reviews_for_decision = 2."
            - "Reviewer A1 with a perfect record (one on-time submitted review, reliability_score_rolling 100.00 -> frozen weight 1.0000)."
            - "Reviewer B1 with one DECLINED invitation plus reviews submitted 4 days late each time (rolling 32.50 at the first submission, 30.00 at the second -> frozen weights 0.3250 and 0.3000)."
            - "Manuscript m1 decided at 2026-08-26 while consensus_mode is UNWEIGHTED; the journal is then patched to RELIABILITY_WEIGHTED and manuscript m2 collects the same recommendation pair from the same two reviewers."
            - "Logical clock at 2026-09-20T00:00:00Z when m2's second review lands (due 2026-09-16, so days_late 4)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /journals"
              payload: { name: "Journal of Consensus Studies", subject_areas: ["ONCOLOGY"] }
              as: SystemAdmin
              captures: { j_id: $.data.id }
            - call: "POST /editors"
              payload: { journal_id: "${j_id}", email: "chief@soc.org", full_name: "Chief Editor", affiliation: "Univ Alpha", subject_areas: ["ONCOLOGY"], role_level: "CHIEF" }
              as: SystemAdmin
              captures: { ed_chief_id: $.data.id }
            - call: "POST /editors"
              payload: { journal_id: "${j_id}", email: "he1@soc.org", full_name: "Handling One", affiliation: "Univ Beta", subject_areas: ["ONCOLOGY"], role_level: "HANDLING", max_concurrent_assignments: 3 }
              as: SystemAdmin
              captures: { ed_h1_id: $.data.id }
            - call: "POST /authors"
              payload: { email: "author1@x.org", full_name: "Author One", affiliation: "Univ Gamma" }
              as: SystemAdmin
              captures: { au_id: $.data.id }
            - call: "POST /reviewers"
              payload: { email: "rev_a1@inst.org", full_name: "Reviewer A1", affiliation: "Univ Delta", subject_areas: ["ONCOLOGY"] }
              as: SystemAdmin
              captures: { rv_a1_id: $.data.id }
            - call: "POST /reviewers"
              payload: { email: "rev_b1@inst.org", full_name: "Reviewer B1", affiliation: "Univ Epsilon", subject_areas: ["ONCOLOGY"] }
              as: SystemAdmin
              captures: { rv_b1_id: $.data.id }
            - call: "POST /manuscripts"
              payload: { journal_id: "${j_id}", corresponding_author_id: "${au_id}", title: "First Consensus Paper", subject_area: "ONCOLOGY", oa_license: "CC_BY", page_count: 18, figure_count: 4, data_availability_statement: "Data at repository DOI 10.9999/c1" }
              as: Author
              as_user_id: "${au_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /manuscripts/${m1_id}/integrity-screenings"
              payload: { scan_type: "PLAGIARISM", similarity_pct: 4.0 }
              as: SystemAdmin
            - call: "GET /manuscripts/${m1_id}"
              as: SystemAdmin
              captures: { m1_v: $.data.version }
            - call: "POST /editor-assignments"
              payload: { manuscript_id: "${m1_id}", editor_id: "${ed_h1_id}", expected_manuscript_version: "${m1_v}" }
              as: EditorInChief
              as_user_id: "${ed_chief_id}"
              captures: { ea1_id: $.data.id }
            - call: "POST /editor-assignments/${ea1_id}/conflict-declaration"
              payload: { declared_conflict: false }
              as: HandlingEditor
              as_user_id: "${ed_h1_id}"
            - call: "POST /manuscripts/${m1_id}/screening-decision"
              payload: { action: "ADVANCE_TO_REVIEW" }
              as: HandlingEditor
              as_user_id: "${ed_h1_id}"
            - call: "POST /review-invitations"
              payload: { manuscript_id: "${m1_id}", reviewer_id: "${rv_a1_id}" }
              as: HandlingEditor
              as_user_id: "${ed_h1_id}"
              captures: { inv_a1_id: $.data.id }
            - call: "POST /review-invitations/${inv_a1_id}/response"
              payload: { response: "ACCEPT" }
              as: Reviewer
              as_user_id: "${rv_a1_id}"
            - call: "POST /review-invitations/${inv_a1_id}/reviews"
              payload: { recommendation: "ACCEPT", novelty_score: 4, rigor_score: 4, clarity_score: 4, comments: "Accept as is" }
              as: Reviewer
              as_user_id: "${rv_a1_id}"
              captures: { rev_a1_id: $.data.id, rev_a1_weight: $.data.reliability_weight }
            - call: "POST /review-invitations"
              payload: { manuscript_id: "${m1_id}", reviewer_id: "${rv_b1_id}" }
              as: HandlingEditor
              as_user_id: "${ed_h1_id}"
              captures: { inv_b1a_id: $.data.id }
            - call: "POST /review-invitations/${inv_b1a_id}/response"
              payload: { response: "DECLINE", decline_reason: "Too busy" }
              as: Reviewer
              as_user_id: "${rv_b1_id}"
            - call: "POST /review-invitations"
              payload: { manuscript_id: "${m1_id}", reviewer_id: "${rv_b1_id}" }
              as: HandlingEditor
              as_user_id: "${ed_h1_id}"
              captures: { inv_b1b_id: $.data.id }
            - call: "POST /review-invitations/${inv_b1b_id}/response"
              payload: { response: "ACCEPT" }
              as: Reviewer
              as_user_id: "${rv_b1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-26T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /review-invitations/${inv_b1b_id}/reviews"
              payload: { recommendation: "MAJOR_REVISION", novelty_score: 2, rigor_score: 2, clarity_score: 3, comments: "Needs major work" }
              as: Reviewer
              as_user_id: "${rv_b1_id}"
              captures: { rev_b1b_id: $.data.id, rev_b1b_weight: $.data.reliability_weight, rev_b1b_late: $.data.days_late }
            - call: "POST /manuscripts/${m1_id}/decisions"
              payload: { editorial_note: "Unweighted consensus decision" }
              as: HandlingEditor
              as_user_id: "${ed_h1_id}"
              captures: { dec1_id: $.data.id, dec1_index: $.data.consensus_index, dec1_auto: $.data.auto_category }
            - call: "PATCH /journals/${j_id}"
              payload: { consensus_mode: "RELIABILITY_WEIGHTED" }
              as: SystemAdmin
            - call: "POST /manuscripts"
              payload: { journal_id: "${j_id}", corresponding_author_id: "${au_id}", title: "Second Consensus Paper", subject_area: "ONCOLOGY", oa_license: "CC_BY", page_count: 19, figure_count: 4, data_availability_statement: "Data at repository DOI 10.9999/c2" }
              as: Author
              as_user_id: "${au_id}"
              captures: { m2_id: $.data.id }
            - call: "POST /manuscripts/${m2_id}/integrity-screenings"
              payload: { scan_type: "PLAGIARISM", similarity_pct: 3.0 }
              as: SystemAdmin
            - call: "GET /manuscripts/${m2_id}"
              as: SystemAdmin
              captures: { m2_v: $.data.version }
            - call: "POST /editor-assignments"
              payload: { manuscript_id: "${m2_id}", editor_id: "${ed_h1_id}", expected_manuscript_version: "${m2_v}" }
              as: EditorInChief
              as_user_id: "${ed_chief_id}"
              captures: { ea2_id: $.data.id }
            - call: "POST /editor-assignments/${ea2_id}/conflict-declaration"
              payload: { declared_conflict: false }
              as: HandlingEditor
              as_user_id: "${ed_h1_id}"
            - call: "POST /manuscripts/${m2_id}/screening-decision"
              payload: { action: "ADVANCE_TO_REVIEW" }
              as: HandlingEditor
              as_user_id: "${ed_h1_id}"
            - call: "POST /review-invitations"
              payload: { manuscript_id: "${m2_id}", reviewer_id: "${rv_a1_id}" }
              as: HandlingEditor
              as_user_id: "${ed_h1_id}"
              captures: { inv_a2_id: $.data.id }
            - call: "POST /review-invitations/${inv_a2_id}/response"
              payload: { response: "ACCEPT" }
              as: Reviewer
              as_user_id: "${rv_a1_id}"
            - call: "POST /review-invitations/${inv_a2_id}/reviews"
              payload: { recommendation: "ACCEPT", novelty_score: 4, rigor_score: 4, clarity_score: 4, comments: "Accept as is" }
              as: Reviewer
              as_user_id: "${rv_a1_id}"
              captures: { rev_a2_id: $.data.id, rev_a2_weight: $.data.reliability_weight }
            - call: "POST /review-invitations"
              payload: { manuscript_id: "${m2_id}", reviewer_id: "${rv_b1_id}" }
              as: HandlingEditor
              as_user_id: "${ed_h1_id}"
              captures: { inv_b1c_id: $.data.id }
            - call: "POST /review-invitations/${inv_b1c_id}/response"
              payload: { response: "ACCEPT" }
              as: Reviewer
              as_user_id: "${rv_b1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-20T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /review-invitations/${inv_b1c_id}/reviews"
              payload: { recommendation: "MAJOR_REVISION", novelty_score: 2, rigor_score: 2, clarity_score: 3, comments: "Needs major work" }
              as: Reviewer
              as_user_id: "${rv_b1_id}"
              captures: { rev_b1c_id: $.data.id, rev_b1c_weight: $.data.reliability_weight, rev_b1c_late: $.data.days_late }
          trigger:
            - call: "POST /manuscripts/${m2_id}/decisions"
              payload: { editorial_note: "Reliability-weighted consensus decision" }
              as: HandlingEditor
              as_user_id: "${ed_h1_id}"
              captures: { dec2_id: $.data.id, dec2_index: $.data.consensus_index, dec2_auto: $.data.auto_category, dec2_mode: $.data.consensus_mode }
          assert:
            - "Review.${rev_a2_id}.reliability_weight == 1.0000"
            - "Review.${rev_b1b_id}.reliability_weight == 0.3250"
            - "Review.${rev_b1b_id}.days_late == 4"
            - "Review.${rev_b1c_id}.reliability_weight == 0.3000"
            - "Review.${rev_b1c_id}.days_late == 4"
            - "Reviewer.${rv_b1_id}.reliability_score_rolling == 30.00"
            - "Reviewer.${rv_b1_id}.status == PROBATION"
            - "Decision.${dec1_id}.consensus_mode == UNWEIGHTED"
            - "Decision.${dec1_id}.consensus_index == 3.00"
            - "Decision.${dec1_id}.auto_category == MINOR_REVISION"
            - "Decision.${dec1_id}.reviews_counted == 2"
            - "Decision.${dec2_id}.consensus_mode == RELIABILITY_WEIGHTED"
            - "Decision.${dec2_id}.consensus_index == 3.54"
            - "Decision.${dec2_id}.auto_category == ACCEPT"
            - "Decision.${dec2_id}.reviews_counted == 2"
            - "Manuscript.${m1_id}.status == REVISION_REQUESTED"
            - "Manuscript.${m2_id}.status == IN_PRODUCTION"
  - rule_id: combinatorial_formula
    instances:
      - name: apc_net_amount_nested_rounding_order_pinned
        grounds:
          - calculations.apc_net_amount
          - entities.APCInvoice.fields.base_cents
          - entities.APCInvoice.fields.waiver_cents
          - entities.APCInvoice.fields.institutional_cents
          - entities.APCInvoice.fields.net_apc_cents
          - entities.Author.fields.country_income_band
          - concurrency_rules[apc-invoice-issue-stale-manuscript]
        distinguishing_aspect: |
          Mode (b) — nested rounding order: apc_net_amount rounds half-up to whole cents three
          separate times (license-adjusted base, then the waiver on that base, then the
          institutional discount on the POST-WAIVER remainder), and the deliberately non-round
          apc_base_cents 175033 makes the pinned order observable — net_apc_cents == 94846, whereas
          computing both discounts against base_cents and subtracting them together yields 89266.
        test_recipe:
          setup:
            - "One Journal with apc_base_cents = 175033 (all other config default)."
            - "One Author in country_income_band UPPER_MIDDLE (waiver 25%) with institutional_agreement = true (15%)."
            - "One Manuscript by that Author with oa_license CC_BY_NC_ND (license multiplier 0.85), status SUBMITTED, version 1."
            - "Logical clock at 2026-08-01T00:00:00Z; no surcharge items are billed (page_charge_count 0, color_figure_count 0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /journals"
              payload: { name: "Journal of Rounding Order", subject_areas: ["ONCOLOGY"], apc_base_cents: 175033 }
              as: SystemAdmin
              captures: { j_id: $.data.id }
            - call: "POST /authors"
              payload: { email: "author_um@x.org", full_name: "Author UM", affiliation: "Univ Gamma", country_income_band: "UPPER_MIDDLE", institutional_agreement: true }
              as: SystemAdmin
              captures: { au_id: $.data.id }
            - call: "POST /manuscripts"
              payload: { journal_id: "${j_id}", corresponding_author_id: "${au_id}", title: "Nested Rounding Paper", subject_area: "ONCOLOGY", oa_license: "CC_BY_NC_ND", page_count: 20, figure_count: 5, data_availability_statement: "Data at repository DOI 10.9999/nr" }
              as: Author
              as_user_id: "${au_id}"
              captures: { m_id: $.data.id }
            - call: "GET /manuscripts/${m_id}"
              as: SystemAdmin
              captures: { m_v: $.data.version }
          trigger:
            - call: "POST /manuscripts/${m_id}/apc-invoices"
              payload: { expected_manuscript_version: "${m_v}", page_charge_count: 0, color_figure_count: 0 }
              as: ProductionStaff
              captures: { apc_id: $.data.id, apc_net: $.data.net_apc_cents }
            - call: "GET /journals/${j_id}"
              as: SystemAdmin
              captures: { j_receivable: $.data.apc_receivable_cents }
          assert:
            - "APCInvoice.${apc_id}.license_at_issue == CC_BY_NC_ND"
            - "APCInvoice.${apc_id}.base_cents == 148778"
            - "APCInvoice.${apc_id}.waiver_pct == 25"
            - "APCInvoice.${apc_id}.waiver_cents == 37195"
            - "APCInvoice.${apc_id}.institutional_pct == 15"
            - "APCInvoice.${apc_id}.institutional_cents == 16737"
            - "APCInvoice.${apc_id}.net_apc_cents == 94846"
            - "APCInvoice.${apc_id}.auto_waived == false"
            - "APCInvoice.${apc_id}.raw_surcharge_cents == 0"
            - "APCInvoice.${apc_id}.provisional_total_cents == 94846"
            - "APCInvoice.${apc_id}.surcharge_relief_pct == 0"
            - "APCInvoice.${apc_id}.total_due_cents == 94846"
            - "APCInvoice.${apc_id}.status == ISSUED"
            - "Journal.${j_id}.apc_receivable_cents == 94846"
      - name: surcharge_relief_bracket_not_re_derived_from_final_total
        grounds:
          - calculations.invoice_total_with_surcharge
          - entities.APCInvoice.fields.raw_surcharge_cents
          - entities.APCInvoice.fields.provisional_total_cents
          - entities.APCInvoice.fields.surcharge_relief_pct
          - entities.APCInvoice.fields.total_due_cents
          - entities.Journal.fields.page_charge_cents_per_page
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency: surcharge_relief_pct appears to depend on the
          total while the total depends on the relief, and the scaffold breaks the loop by keying
          the bracket on provisional_total_cents only; with net 120000 and 8 billed pages the
          provisional total 152000 selects relief 10, and total_due_cents lands at 148800 — below
          RELIEF_TIER_1_CENTS 150000 — yet surcharge_relief_pct stays 10 because there is exactly
          one pass and no re-derivation.
        test_recipe:
          setup:
            - "One Journal with apc_base_cents = 120000 and default page_charge_cents_per_page = 4000."
            - "One Author with default country_income_band HIGH (waiver 0%) and institutional_agreement false (0%)."
            - "One Manuscript by that Author with oa_license CC_BY (multiplier 1.00), status SUBMITTED, version 1."
            - "Logical clock at 2026-08-01T00:00:00Z; 8 pages are billed and no color figures."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /journals"
              payload: { name: "Journal of Bracket Semantics", subject_areas: ["ONCOLOGY"], apc_base_cents: 120000 }
              as: SystemAdmin
              captures: { j_id: $.data.id }
            - call: "POST /authors"
              payload: { email: "author_hi@x.org", full_name: "Author HI", affiliation: "Univ Gamma" }
              as: SystemAdmin
              captures: { au_id: $.data.id }
