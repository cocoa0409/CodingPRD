    code: 201
    input: ["target_region_code", "requires_road_type_validation?", "expected_territory_version"]
    output: ServiceAreaExpansionRequest
    side_effects:
      - "status=SUBMITTED, mapped_pct_at_submit=territory.mapped_pct, rule_version_at_approval=null"
      - "increments ServiceTerritory.version by 1"
  - method: GET
    path: "/fleet/territories/{territoryId}/expansion-requests"
    description: "List expansion requests for a territory"
    roles: [TerritoryPlanner, SafetyReviewer, MappingEngineer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ServiceAreaExpansionRequest[]
    side_effects: []
  - method: GET
    path: "/fleet/expansion-requests/{expansionId}"
    description: "Get a ServiceAreaExpansionRequest"
    roles: [TerritoryPlanner, SafetyReviewer, MappingEngineer]
    code: 200
    input: []
    output: ServiceAreaExpansionRequest
    side_effects: []
  - method: POST
    path: "/fleet/expansion-requests/{expansionId}/mapping-complete"
    description: "Mark the expansion's mapping gate complete; OCC-guarded against the territory"
    roles: [MappingEngineer]
    code: 200
    input: ["expected_territory_version"]
    output: ServiceAreaExpansionRequest
    side_effects:
      - "status=MAPPING_COMPLETE when territory.mapped_pct >= 95, otherwise VALIDATION_FAILED"
      - "increments ServiceTerritory.version by 1"
  - method: POST
    path: "/fleet/expansion-requests/{expansionId}/approve"
    description: "Approve an expansion; pins the territory's ServiceAreaRule.rule_version and applies the road-type validation gate"
    roles: [SafetyReviewer]
    code: 200
    input: []
    output: ServiceAreaExpansionRequest
    side_effects:
      - "status=CONDITIONALLY_APPROVED when request.requires_road_type_validation == true and territory.road_type_risk == HIGH; otherwise status=APPROVED"
      - "rule_version_at_approval = max ServiceAreaRule.rule_version with status APPROVED in the territory, else 0"
  - method: POST
    path: "/fleet/expansion-requests/{expansionId}/reject"
    description: "Reject an expansion"
    roles: [SafetyReviewer]
    code: 200
    input: ["reason"]
    output: ServiceAreaExpansionRequest
    side_effects: ["status=REJECTED"]

  # ---- RideRequest ----
  - method: POST
    path: "/fleet/territories/{territoryId}/ride-requests"
    description: "Create an idempotent RideRequest"
    roles: [FleetOperations]
    code: 201
    input: ["rider_name", "sub_service_type", "manual_only_reason?", "idempotency_key"]
    output: RideRequest
    side_effects:
      - "status=REQUESTED, vehicle_id=null, pickup_location_id=null, dropoff_location_id=null, dispatch_attempts=0"
      - "a replay of the same (territory_id, idempotency_key) returns the original RideRequest and creates no new row"
  - method: GET
    path: "/fleet/territories/{territoryId}/ride-requests"
    description: "List RideRequests for a territory, optionally filtered by status or matched vehicle"
    roles: [FleetOperations, RemoteAssistanceOperator, SafetyReviewer]
    code: 200
    input: ["status?", "vehicle_id?", "limit?", "offset?"]
    output: RideRequest[]
    side_effects: []
  - method: GET
    path: "/fleet/ride-requests/{rideId}"
    description: "Get a RideRequest by id"
    roles: [FleetOperations, RemoteAssistanceOperator, SafetyReviewer]
    code: 200
    input: []
    output: RideRequest
    side_effects: []
  - method: GET
    path: "/fleet/territories/{territoryId}/ride-requests/{rideId}"
    description: "Get a RideRequest"
    roles: [FleetOperations, RemoteAssistanceOperator, SafetyReviewer]
    code: 200
    input: []
    output: RideRequest
    side_effects: []
  - method: POST
    path: "/fleet/territories/{territoryId}/ride-requests/{rideId}/match"
    description: "Match a ride to a vehicle via the §1.3 selector; OCC-guarded against the vehicle"
    roles: [FleetOperations]
    code: 200
    input: ["pickup_location_id", "expected_vehicle_version", "route_class?"]
    output: RideRequest
    side_effects:
      - "status=MATCHED; vehicle_id set to the selected vehicle; pickup_location_id recorded"
      - "the selected vehicle's service_status moves to DISPATCHED (updates Vehicle.version)"
      - "territory.total_credit_cents recomputed per §1.3 territory_total_credit; the vehicle's credit_cents credited"
  - method: POST
    path: "/fleet/territories/{territoryId}/ride-requests/{rideId}/pickup"
    description: "Confirm pickup (MATCHED to PICKED_UP)"
    roles: [FleetOperations]
    code: 200
    input: ["dropoff_location_id", "expected_vehicle_version"]
    output: RideRequest
    side_effects:
      - "status=PICKED_UP; dropoff_location_id recorded"
      - "the matched vehicle's service_status moves to ON_TRIP (updates Vehicle.version)"
  - method: POST
    path: "/fleet/territories/{territoryId}/ride-requests/{rideId}/complete"
    description: "Complete a ride (PICKED_UP to COMPLETED)"
    roles: [FleetOperations]
    code: 200
    input: []
    output: RideRequest
    side_effects:
      - "status=COMPLETED"
      - "the matched vehicle's service_status recomputed per §1.3 vehicle_service_status (updates Vehicle.version)"
  - method: POST
    path: "/fleet/territories/{territoryId}/ride-requests/{rideId}/cancel"
    description: "Cancel a ride (REQUESTED or MATCHED to CANCELLED)"
    roles: [FleetOperations]
    code: 200
    input: ["credit_cents"]
    output: RideRequest
    side_effects:
      - "status=CANCELLED"
      - "when the ride was MATCHED: the matched vehicle's service_status recomputed (updates Vehicle.version) and its credit_cents decremented by credit_cents, bounded below at 0"
  - method: POST
    path: "/fleet/territories/{territoryId}/ride-requests/{rideId}/cancel-no-show"
    description: "Mark a no-show (REQUESTED to CANCELLED_NO_SHOW)"
    roles: [FleetOperations]
    code: 200
    input: []
    output: RideRequest
    side_effects: ["status=CANCELLED_NO_SHOW", "the vehicle's service_status recomputed per §1.3 vehicle_service_status"]

