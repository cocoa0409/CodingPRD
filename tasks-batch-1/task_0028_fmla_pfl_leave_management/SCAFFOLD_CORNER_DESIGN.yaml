            - call: "POST /leave/cases/${case_id}/evaluate-eligibility"
              payload: {}
              as: HRAdmin
              captures: { v_post_elig: $.data.version }
            - call: "POST /leave/certifications"
              payload: { leave_case_id: "${case_id}", provider_id: "${p_id}", expected_duration_weeks: 12, provider_attestation_signed_at: "2026-05-15T00:00:00.000Z" }
