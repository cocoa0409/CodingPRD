scaffold_difficulty_design:

  # ===================================================================
  # Rule 1 — dual_variant_calc (2 instances, different entity domains)
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: claim_quote_provisional_vs_final_cap_clamp
        grounds:
          - calculations.claim_amount_quote
          - entities.PaymentClaim.fields.provisional_amount_cents
          - entities.PaymentClaim.fields.approved_amount_cents
        distinguishing_aspect: |
          Same claim inputs produce two different amounts on the PaymentClaim
          domain: PROVISIONAL ignores the funder monthly cap (200 * 100 =
          20000 quoted at submission) while FINAL applies the cap waterfall
          (cap 15000 with 0 already paid => approved = 15000), so
          provisional_amount_cents (20000) != approved_amount_cents (15000).
        test_recipe:
          setup:
            - "Network N, taxonomy FOOD, funder F (HEALTH_PLAN), sender S (CLINIC), receiver R (CBO) all ACTIVE"
            - "Rate card on F for FOOD: rate 100 cents/unit, min_units 1, tier2 null, monthly_cap_cents 15000"
            - "Agreement S<->R ACTIVE; agreement F<->R ACTIVE; consent C for (S,R) ACTIVE"
            - "Offering O on R: capacity 10, no eligibility restrictions"
            - "Client K; referral RF routed, accepted, in-service, outcome DELIVERED with delivered_units 200"
          setup_api_calls:
            - { call: "POST /care-network/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: NetworkCoordinator }
            - call: "POST /care-network/networks"
              payload: { name: "Net", coordinator_org_name: "Coord", network_escrow_cents: 100000 }
              as: NetworkCoordinator
              captures: { net_id: $.data.id }
            - call: "POST /care-network/taxonomy"
              payload: { code: "FOOD", name: "Food" }
              as: NetworkCoordinator
            - call: "POST /care-network/organizations"
              payload: { name: "Funder F", org_type: "FUNDER", funder_type: "HEALTH_PLAN", ein: "EIN-F" }
              as: NetworkCoordinator
              captures: { f_id: $.data.id }
            - call: "POST /care-network/organizations"
              payload: { name: "Sender S", org_type: "CLINIC", ein: "EIN-S" }
              as: NetworkCoordinator
              captures: { s_id: $.data.id }
            - call: "POST /care-network/organizations"
              payload: { name: "Receiver R", org_type: "CBO", ein: "EIN-R" }
              as: NetworkCoordinator
              captures: { r_id: $.data.id }
            - { call: "POST /care-network/organizations/${f_id}/activate", payload: {}, as: NetworkCoordinator }
            - { call: "POST /care-network/organizations/${s_id}/activate", payload: {}, as: NetworkCoordinator }
            - { call: "POST /care-network/organizations/${r_id}/activate", payload: {}, as: NetworkCoordinator }
            - call: "POST /care-network/organizations/${f_id}/rate-cards"
              payload: { category_code: "FOOD", rate_cents_per_unit: 100, min_units: 1, monthly_cap_cents: 15000 }
              as: FunderAdmin
              as_user_id: "${f_id}"
            - call: "POST /care-network/organizations/${r_id}/offerings"
              payload: { category_code: "FOOD", description: "Meals", capacity_total: 10 }
              as: OrgAdmin
              as_user_id: "${r_id}"
              captures: { o_id: $.data.id }
            - call: "POST /care-network/agreements"
              payload: { party_a_org_id: "${s_id}", party_b_org_id: "${r_id}", effective_at: "2026-09-01T00:00:00Z" }
              as: NetworkCoordinator
              captures: { agr_sr: $.data.id }
            - call: "POST /care-network/agreements"
              payload: { party_a_org_id: "${f_id}", party_b_org_id: "${r_id}", effective_at: "2026-09-01T00:00:00Z" }
              as: NetworkCoordinator
              captures: { agr_fr: $.data.id }
            - { call: "POST /care-network/agreements/${agr_sr}/approve", payload: {}, as: NetworkCoordinator }
            - { call: "POST /care-network/agreements/${agr_fr}/approve", payload: {}, as: NetworkCoordinator }
            - call: "POST /care-network/clients"
              payload: { full_name: "K", date_of_birth: "1990-01-01", zip_code: "94110", gender: "FEMALE" }
              as: CaseWorker
              as_user_id: "${s_id}"
              captures: { k_id: $.data.id }
            - call: "POST /care-network/clients/${k_id}/consents"
              payload: { sender_org_id: "${s_id}", receiver_org_id: "${r_id}", scope: "FULL" }
              as: CaseWorker
              as_user_id: "${s_id}"
              captures: { c_id: $.data.id }
            - call: "POST /care-network/referrals"
              payload: { client_id: "${k_id}", sender_org_id: "${s_id}", receiver_org_id: "${r_id}", service_offering_id: "${o_id}", consent_id: "${c_id}", category_code: "FOOD" }
              as: CaseWorker
              as_user_id: "${s_id}"
              captures: { rf_id: $.data.id }
            - { call: "POST /care-network/referrals/${rf_id}/route", payload: {}, as: CaseWorker, as_user_id: "${s_id}" }
            - { call: "POST /care-network/referrals/${rf_id}/accept", payload: {}, as: OrgAdmin, as_user_id: "${r_id}" }
            - { call: "POST /care-network/referrals/${rf_id}/start-service", payload: {}, as: OrgAdmin, as_user_id: "${r_id}" }
            - { call: "POST /care-network/referrals/${rf_id}/confirm-outcome", payload: { outcome_code: "DELIVERED", delivered_units: 200 }, as: OrgAdmin, as_user_id: "${r_id}" }
          trigger:
            - call: "POST /care-network/claims"
              payload: { referral_id: "${rf_id}", funder_org_id: "${f_id}", claimed_units: 200 }
              as: OrgAdmin
              as_user_id: "${r_id}"
              captures: { cl_id: $.data.id }
            - { call: "POST /care-network/claims/${cl_id}/review", payload: {}, as: FunderAdmin, as_user_id: "${f_id}#rev1" }
            - call: "GET /care-network/claims/${cl_id}"
              payload: {}
              as: FunderAdmin
              as_user_id: "${f_id}"
              captures: { cl_v: $.data.version }
            - call: "POST /care-network/claims/${cl_id}/approve"
              payload: { expected_claim_version: "${cl_v}" }
              as: FunderAdmin
              as_user_id: "${f_id}#rev2"
          assert:
            - "PaymentClaim.${cl_id}.provisional_amount_cents == 20000"
            - "PaymentClaim.${cl_id}.approved_amount_cents == 15000"
            - "Organization.${r_id}.payable_balance_cents == 15000 (cap-clamped amount accrued, not the 20000 quote)"


      - name: funder_report_closure_vs_resolution_rate
        grounds:
          - calculations.closure_rate_dual
          - entities.FunderReport.fields.closure_rate_percent
          - entities.FunderReport.fields.resolution_rate_percent
        distinguishing_aspect: |
          Dual-variant on a DIFFERENT entity domain (FunderReport analytics,
          not PaymentClaim money): with 2 DELIVERED referrals and 1
          NOT_REACHED referral out of 3 total, closure_rate_percent == 66.7
          while resolution_rate_percent == 100.0 — the same referral set
          yields two different metrics because the closed-loop variant counts
          confirmed non-delivery as resolution.
        test_recipe:
          setup:
            - "Funder F (HEALTH_PLAN) with ACTIVE agreements to sender S and receiver R"
            - "Three September referrals under R: RF1, RF2 completed DELIVERED 1 unit each; RF3 completed NOT_REACHED with 0 units"
