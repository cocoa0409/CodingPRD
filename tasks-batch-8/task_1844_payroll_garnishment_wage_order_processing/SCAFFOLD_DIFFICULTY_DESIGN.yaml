# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1844: Payroll Garnishment & Wage Order Processing
# Every instance: grounds resolve into SCAFFOLD.yaml §1.1–§1.7; setup chains
# replay against §1.2/§1.4/§1.5; numeric asserts pre-computed as literals.
# =============================================================================

scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (two variants, DIFFERENT entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: floor_variant_weekly_normalized_vs_hourly_test
        grounds:
          - calculations.withholding_waterfall
          - calculations.withholding_waterfall.variants.floor_variant_weekly_normalized
          - calculations.withholding_waterfall.variants.floor_variant_hourly_test
          - entities.StateRule.fields.hourly_floor_cents
        distinguishing_aspect: |
          Variant domain = disposable-earnings floor on the PayStatement
          calculation: identical gross/deductions produce pool=152874 under the
          weekly-normalized variant (CA, mult 0.75, SEMIMONTHLY floor 47126) but
          pool=160000 under the hourly-test variant (TX, hours_worked 40 x
          hourly_floor 1000 = 40000) — same statement inputs, different
          protected-floor algorithm keyed by StateRule of employee's state.
        test_recipe:
          setup:
            - "Employer E with remittance_timing=SAME_DAY, fee policy NONE"
            - "StateRule CA: mult 0.75, caps {CHILD_SUPPORT:0.50,...}, fee_deductible=true"
            - "StateRule TX: hourly_floor_cents=1000, caps same, fee_deductible=false"
            - "Two employees, one CA SEMIMONTHLY, one TX SEMIMONTHLY"
            - "Identical statements: gross 250000, deductions 50000 -> DE=200000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: employer_payroll_admin
            - call: "POST /state-rules"
              payload: { state_code: "CA", caps: { CHILD_SUPPORT: 0.50, FEDERAL_TAX_LEVY: 0.65, STUDENT_LOAN: 0.15, CREDITOR: 0.25 }, min_wage_multiplier: 0.75, hourly_floor_cents: 0, fee_deductible_from_wages: true }
              as: employer_payroll_admin
            - call: "POST /state-rules"
              payload: { state_code: "TX", caps: { CHILD_SUPPORT: 0.50, FEDERAL_TAX_LEVY: 0.65, STUDENT_LOAN: 0.15, CREDITOR: 0.25 }, min_wage_multiplier: 0.75, hourly_floor_cents: 1000, fee_deductible_from_wages: false }
              as: employer_payroll_admin
            - call: "POST /employers"
              payload: { legal_name: "E", fein: "12-3456789", remittance_timing: "SAME_DAY", payroll_calendar: { period_start: "2026-08-01", period_end: "2026-08-15", pay_date: "2026-08-15" }, administrative_fee_policy: "NONE" }
              as: employer_payroll_admin
              captures: { emp_id: $.data.id, emp_v: $.data.version }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", full_name: "CA W", work_state_code: "CA", pay_frequency: "SEMIMONTHLY", hourly_rate_cents: 0, expected_employer_version: "${emp_v}" }
              as: payroll_specialist
              captures: { ee_ca: $.data.id }
            - call: "GET /employers/${emp_id}"
              as: payroll_specialist
              captures: { emp_v2: $.data.version }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", full_name: "TX W", work_state_code: "TX", pay_frequency: "SEMIMONTHLY", hourly_rate_cents: 2000, expected_employer_version: "${emp_v2}" }
              as: payroll_specialist
              captures: { ee_tx: $.data.id }
            - call: "GET /employers/${emp_id}"
              as: payroll_specialist
              captures: { emp_v3: $.data.version }
            - call: "POST /payroll-runs"
              payload: { employer_id: "${emp_id}", period_start: "2026-08-01", period_end: "2026-08-15", pay_date: "2026-08-15", expected_employer_version: "${emp_v3}" }
              as: payroll_specialist
              captures: { run_id: $.data.id }
            - call: "POST /payroll-runs/${run_id}/statements"
              payload: { employee_id: "${ee_ca}", gross_earnings_cents: 250000, mandatory_deductions_cents: 50000 }
              as: payroll_specialist
              captures: { stmt_ca: $.data.id }
            - call: "POST /payroll-runs/${run_id}/statements"
              payload: { employee_id: "${ee_tx}", gross_earnings_cents: 250000, mandatory_deductions_cents: 50000, hours_worked: 40 }
              as: payroll_specialist
              captures: { stmt_tx: $.data.id }
            # identical single CHILD_SUPPORT percent order on each employee
            - call: "POST /authorities"
              payload: { name: "CSA", authority_type: "CHILD_SUPPORT_AGENCY", state_code: "CA", accepted_case_number_pattern: "^CS-" }
              as: employer_payroll_admin
              captures: { auth_cs: $.data.id }
            - call: "GET /employees/${ee_ca}"
              as: payroll_specialist
              captures: { ee_ca_v: $.data.version }
            - call: "POST /employees/${ee_ca}/orders"
              payload: { issuing_authority_id: "${auth_cs}", case_number: "CS-1", order_type: "CHILD_SUPPORT", amount_model: "PERCENT_OF_DISPOSABLE", amount_value: 2500, total_balance_cents: 900000, effective_date: "2026-08-01", expected_employee_version: "${ee_ca_v}" }
              as: payroll_specialist
              captures: { ord_ca: $.data.id }
            - call: "POST /orders/${ord_ca}/validate"
              payload: {}
              as: payroll_specialist
            - call: "POST /orders/${ord_ca}/notify"
              payload: {}
              as: payroll_specialist
            - call: "POST /orders/${ord_ca}/activate"
              payload: {}
              as: payroll_specialist
            - call: "GET /employees/${ee_tx}"
              as: payroll_specialist
              captures: { ee_tx_v: $.data.version }
            - call: "POST /employees/${ee_tx}/orders"
              payload: { issuing_authority_id: "${auth_cs}", case_number: "CS-2", order_type: "CHILD_SUPPORT", amount_model: "PERCENT_OF_DISPOSABLE", amount_value: 2500, total_balance_cents: 900000, effective_date: "2026-08-01", expected_employee_version: "${ee_tx_v}" }
              as: payroll_specialist
              captures: { ord_tx: $.data.id }
            - call: "POST /orders/${ord_tx}/validate"
              payload: {}
              as: payroll_specialist
            - call: "POST /orders/${ord_tx}/notify"
              payload: {}
              as: payroll_specialist
            - call: "POST /orders/${ord_tx}/activate"
              payload: {}
              as: payroll_specialist
          trigger:
            - call: "GET /employers/${emp_id}"
              as: payroll_specialist
              captures: { emp_v4: $.data.version }
            - call: "POST /payroll-runs/${run_id}/pay"
              payload: { expected_employer_version: "${emp_v4}" }
              as: payroll_specialist
          assert:
            - "PayStatement.${stmt_ca}.disposable_earnings_cents == 200000"
            - "PayStatement.${stmt_ca}.computation_breakdown.pool_cents == 152874"
            - "PayStatement.${stmt_ca}.total_withheld_cents == 50000"
            - "PayStatement.${stmt_tx}.computation_breakdown.pool_cents == 160000"
            - "PayStatement.${stmt_tx}.total_withheld_cents == 50000"
            - "Both withhold raw 25% of DE=50000, but the POOL differs (152874 vs 160000) proving the two floor variants diverge on identical statement inputs"

      - name: remittance_timing_same_day_vs_next_business_day
        grounds:
          - calculations.remittance_due_date
          - calculations.remittance_due_date.variants.timing_same_day
        distinguishing_aspect: |
          Variant domain = Remittance due-date calculation (a different entity
          domain from the PayStatement floor): same pay_date Friday 2026-08-14
          yields due_date == 2026-08-14 under SAME_DAY but 2026-08-17 under
          NEXT_BUSINESS_DAY (weekend skip) — identical inputs, different
          deadlines, and a confirm on 2026-08-15 is on-time for one employer
          and LATE_CONFIRMED for the other.
        test_recipe:
          setup:
            - "Two employers identical except remittance_timing SAME_DAY vs NEXT_BUSINESS_DAY"
            - "Each has one employee with one ACTIVE CHILD_SUPPORT order and a PAID run with pay_date Friday 2026-08-14"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: employer_payroll_admin
            - call: "POST /state-rules"
              payload: { state_code: "CA", caps: { CHILD_SUPPORT: 0.50, FEDERAL_TAX_LEVY: 0.65, STUDENT_LOAN: 0.15, CREDITOR: 0.25 }, min_wage_multiplier: 0.75, hourly_floor_cents: 0, fee_deductible_from_wages: true }
              as: employer_payroll_admin
            - call: "POST /authorities"
              payload: { name: "CSA", authority_type: "CHILD_SUPPORT_AGENCY", state_code: "CA", accepted_case_number_pattern: "^CS-" }
              as: employer_payroll_admin
              captures: { auth_cs: $.data.id }
            # Employer A: SAME_DAY
            - call: "POST /employers"
              payload: { legal_name: "A", fein: "11-1111111", remittance_timing: "SAME_DAY", payroll_calendar: { period_start: "2026-08-01", period_end: "2026-08-14", pay_date: "2026-08-14" }, administrative_fee_policy: "NONE" }
              as: employer_payroll_admin
              captures: { emp_a: $.data.id, emp_a_v: $.data.version }
            - call: "POST /employees"
              payload: { employer_id: "${emp_a}", full_name: "WA", work_state_code: "CA", pay_frequency: "BIWEEKLY", hourly_rate_cents: 0, expected_employer_version: "${emp_a_v}" }
              as: payroll_specialist
              captures: { ee_a: $.data.id, ee_a_v: $.data.version }
            - call: "POST /employees/${ee_a}/orders"
              payload: { issuing_authority_id: "${auth_cs}", case_number: "CS-A", order_type: "CHILD_SUPPORT", amount_model: "FIXED_AMOUNT_PER_PERIOD", amount_value: 10000, total_balance_cents: 100000, effective_date: "2026-08-01", expected_employee_version: "${ee_a_v}" }
              as: payroll_specialist
              captures: { ord_a: $.data.id }
            - call: "POST /orders/${ord_a}/validate"
              payload: {}
              as: payroll_specialist
            - call: "POST /orders/${ord_a}/notify"
              payload: {}
              as: payroll_specialist
            - call: "POST /orders/${ord_a}/activate"
              payload: {}
              as: payroll_specialist
            - call: "GET /employers/${emp_a}"
              as: payroll_specialist
              captures: { emp_a_v2: $.data.version }
            - call: "POST /payroll-runs"
              payload: { employer_id: "${emp_a}", period_start: "2026-08-01", period_end: "2026-08-14", pay_date: "2026-08-14", expected_employer_version: "${emp_a_v2}" }
              as: payroll_specialist
              captures: { run_a: $.data.id }
            - call: "POST /payroll-runs/${run_a}/statements"
              payload: { employee_id: "${ee_a}", gross_earnings_cents: 100000, mandatory_deductions_cents: 20000 }
              as: payroll_specialist
            - call: "GET /employers/${emp_a}"
              as: payroll_specialist
              captures: { emp_a_v3: $.data.version }
            - call: "POST /payroll-runs/${run_a}/pay"
              payload: { expected_employer_version: "${emp_a_v3}" }
              as: payroll_specialist
            - call: "POST /remittances"
              payload: { employer_id: "${emp_a}", authority_id: "${auth_cs}", payroll_run_id: "${run_a}" }
              as: payroll_specialist
              captures: { rem_a: $.data.id }
            # Employer B: NEXT_BUSINESS_DAY
            - call: "POST /employers"
              payload: { legal_name: "B", fein: "22-2222222", remittance_timing: "NEXT_BUSINESS_DAY", payroll_calendar: { period_start: "2026-08-01", period_end: "2026-08-14", pay_date: "2026-08-14" }, administrative_fee_policy: "NONE" }
              as: employer_payroll_admin
              captures: { emp_b: $.data.id, emp_b_v: $.data.version }
            - call: "POST /employees"
              payload: { employer_id: "${emp_b}", full_name: "WB", work_state_code: "CA", pay_frequency: "BIWEEKLY", hourly_rate_cents: 0, expected_employer_version: "${emp_b_v}" }
              as: payroll_specialist
              captures: { ee_b: $.data.id, ee_b_v: $.data.version }
            - call: "POST /employees/${ee_b}/orders"
              payload: { issuing_authority_id: "${auth_cs}", case_number: "CS-B", order_type: "CHILD_SUPPORT", amount_model: "FIXED_AMOUNT_PER_PERIOD", amount_value: 10000, total_balance_cents: 100000, effective_date: "2026-08-01", expected_employee_version: "${ee_b_v}" }
              as: payroll_specialist
              captures: { ord_b: $.data.id }
            - call: "POST /orders/${ord_b}/validate"
              payload: {}
              as: payroll_specialist
            - call: "POST /orders/${ord_b}/notify"
              payload: {}
              as: payroll_specialist
            - call: "POST /orders/${ord_b}/activate"
              payload: {}
              as: payroll_specialist
            - call: "GET /employers/${emp_b}"
              as: payroll_specialist
              captures: { emp_b_v2: $.data.version }
            - call: "POST /payroll-runs"
              payload: { employer_id: "${emp_b}", period_start: "2026-08-01", period_end: "2026-08-14", pay_date: "2026-08-14", expected_employer_version: "${emp_b_v2}" }
              as: payroll_specialist
              captures: { run_b: $.data.id }
            - call: "POST /payroll-runs/${run_b}/statements"
              payload: { employee_id: "${ee_b}", gross_earnings_cents: 100000, mandatory_deductions_cents: 20000 }
              as: payroll_specialist
            - call: "GET /employers/${emp_b}"
              as: payroll_specialist
              captures: { emp_b_v3: $.data.version }
            - call: "POST /payroll-runs/${run_b}/pay"
              payload: { expected_employer_version: "${emp_b_v3}" }
              as: payroll_specialist
            - call: "POST /remittances"
              payload: { employer_id: "${emp_b}", authority_id: "${auth_cs}", payroll_run_id: "${run_b}" }
              as: payroll_specialist
              captures: { rem_b: $.data.id }
          trigger:
            # advance clock to Saturday 2026-08-15, then confirm both
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T09:00:00Z" }
              as: employer_payroll_admin
            - call: "POST /remittances/${rem_a}/confirm"
              payload: {}
              as: payroll_manager
            - call: "POST /remittances/${rem_b}/confirm"
              payload: {}
              as: payroll_manager
          assert:
            - "Remittance.${rem_a}.due_date == '2026-08-14'"
            - "Remittance.${rem_a}.status == LATE_CONFIRMED"
            - "Remittance.${rem_b}.due_date == '2026-08-17'"
            - "Remittance.${rem_b}.status == CONFIRMED"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (instances in DIFFERENT modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: waterfall_min4_chain_cap_balance_pool
        grounds:
          - calculations.withholding_waterfall
          - entities.GarnishmentOrder.fields.remaining_balance_cents
          - entities.StateRule.fields.caps
        distinguishing_aspect: |
          Mode (a) formula with >=3 inputs and non-linear interaction: the award
          is min(raw_demand, state_cap, remaining_pool, remaining_balance) — a
          nested-min chain whose winning argument switches across fixtures. Here
          the balance term (90000) wins over demand (100000), cap (125000), and
          pool (187149), and the final partial award triggers SATISFIED.
        test_recipe:
          setup:
            - "CA employee, single CHILD_SUPPORT FIXED 100000/period with remaining balance 90000; DE=250000, floor 62834 (mult 1.0 SEMIMONTHLY) so pool=187166"
            - "cap 50% DE = 125000; min(100000,125000,187166,90000) = 90000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: employer_payroll_admin
            - call: "POST /state-rules"
              payload: { state_code: "CA", caps: { CHILD_SUPPORT: 0.50, FEDERAL_TAX_LEVY: 0.65, STUDENT_LOAN: 0.15, CREDITOR: 0.25 }, min_wage_multiplier: 1.0, hourly_floor_cents: 0, fee_deductible_from_wages: true }
              as: employer_payroll_admin
            - call: "POST /authorities"
              payload: { name: "CSA", authority_type: "CHILD_SUPPORT_AGENCY", state_code: "CA", accepted_case_number_pattern: "^CS-" }
              as: employer_payroll_admin
              captures: { auth_cs: $.data.id }
            - call: "POST /employers"
              payload: { legal_name: "E", fein: "33-3333333", remittance_timing: "SAME_DAY", payroll_calendar: { period_start: "2026-08-01", period_end: "2026-08-15", pay_date: "2026-08-15" }, administrative_fee_policy: "NONE" }
              as: employer_payroll_admin
              captures: { emp_id: $.data.id, emp_v: $.data.version }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", full_name: "W", work_state_code: "CA", pay_frequency: "SEMIMONTHLY", hourly_rate_cents: 0, expected_employer_version: "${emp_v}" }
              as: payroll_specialist
              captures: { ee_id: $.data.id, ee_v: $.data.version }
            - call: "POST /employees/${ee_id}/orders"
              payload: { issuing_authority_id: "${auth_cs}", case_number: "CS-9", order_type: "CHILD_SUPPORT", amount_model: "FIXED_AMOUNT_PER_PERIOD", amount_value: 100000, total_balance_cents: 90000, effective_date: "2026-08-01", expected_employee_version: "${ee_v}" }
              as: payroll_specialist
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/validate"
              payload: {}
              as: payroll_specialist
            - call: "POST /orders/${ord_id}/notify"
              payload: {}
              as: payroll_specialist
            - call: "POST /orders/${ord_id}/activate"
              payload: {}
              as: payroll_specialist
            - call: "GET /employers/${emp_id}"
              as: payroll_specialist
              captures: { emp_v2: $.data.version }
            - call: "POST /payroll-runs"
              payload: { employer_id: "${emp_id}", period_start: "2026-08-01", period_end: "2026-08-15", pay_date: "2026-08-15", expected_employer_version: "${emp_v2}" }
              as: payroll_specialist
              captures: { run_id: $.data.id }
            - call: "POST /payroll-runs/${run_id}/statements"
              payload: { employee_id: "${ee_id}", gross_earnings_cents: 300000, mandatory_deductions_cents: 50000 }
              as: payroll_specialist
              captures: { stmt_id: $.data.id }
          trigger:
            - call: "GET /employers/${emp_id}"
              as: payroll_specialist
              captures: { emp_v3: $.data.version }
            - call: "POST /payroll-runs/${run_id}/pay"
              payload: { expected_employer_version: "${emp_v3}" }
              as: payroll_specialist
          assert:
            - "PayStatement.${stmt_id}.total_withheld_cents == 90000"
            - "GarnishmentOrder.${ord_id}.processing_status == SATISFIED"
            - "GarnishmentOrder.${ord_id}.remaining_balance_cents == 0"
            - "PayStatement.${stmt_id}.net_pay_cents == 160000"

      - name: proration_rounding_order_exact_then_round
        grounds:
          - calculations.withholding_waterfall
          - entities.GarnishmentOrder.fields.effective_date
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: the proration factor
          (10/15) is applied at full precision BEFORE the single half-up cent
          rounding, so FIXED 10001 cents effective 2026-08-06 in a 15-day
          period yields 6667; the alternate order (rounding the factor to 0.67
          first) would yield 6701 — the scaffold pins exact-then-round.
        test_recipe:
          setup:
            - "CA employee SEMIMONTHLY, period 2026-08-01..2026-08-15 (15 days)"
            - "One CHILD_SUPPORT FIXED_AMOUNT_PER_PERIOD 10001 cents, effective_date 2026-08-06 (retroactive arrival; 10 effective days)"
            - "DE = 200000-... gross 150000 ded 30000 -> DE 120000; floor (mult 0.75) 47126; pool 72874; raw = rhu(10001 * 10/15) = 6667"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: employer_payroll_admin
            - call: "POST /state-rules"
              payload: { state_code: "CA", caps: { CHILD_SUPPORT: 0.50, FEDERAL_TAX_LEVY: 0.65, STUDENT_LOAN: 0.15, CREDITOR: 0.25 }, min_wage_multiplier: 0.75, hourly_floor_cents: 0, fee_deductible_from_wages: true }
              as: employer_payroll_admin
            - call: "POST /authorities"
              payload: { name: "CSA", authority_type: "CHILD_SUPPORT_AGENCY", state_code: "CA", accepted_case_number_pattern: "^CS-" }
              as: employer_payroll_admin
              captures: { auth_cs: $.data.id }
            - call: "POST /employers"
              payload: { legal_name: "E", fein: "44-4444444", remittance_timing: "SAME_DAY", payroll_calendar: { period_start: "2026-08-01", period_end: "2026-08-15", pay_date: "2026-08-15" }, administrative_fee_policy: "NONE" }
              as: employer_payroll_admin
              captures: { emp_id: $.data.id, emp_v: $.data.version }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", full_name: "W", work_state_code: "CA", pay_frequency: "SEMIMONTHLY", hourly_rate_cents: 0, expected_employer_version: "${emp_v}" }
              as: payroll_specialist
              captures: { ee_id: $.data.id, ee_v: $.data.version }
            - call: "POST /employees/${ee_id}/orders"
              payload: { issuing_authority_id: "${auth_cs}", case_number: "CS-10", order_type: "CHILD_SUPPORT", amount_model: "FIXED_AMOUNT_PER_PERIOD", amount_value: 10001, total_balance_cents: 500000, effective_date: "2026-08-06", expected_employee_version: "${ee_v}" }
              as: payroll_specialist
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/validate"
              payload: {}
              as: payroll_specialist
            - call: "POST /orders/${ord_id}/notify"
              payload: {}
              as: payroll_specialist
            - call: "POST /orders/${ord_id}/activate"
              payload: {}
              as: payroll_specialist
            - call: "GET /employers/${emp_id}"
              as: payroll_specialist
              captures: { emp_v2: $.data.version }
            - call: "POST /payroll-runs"
              payload: { employer_id: "${emp_id}", period_start: "2026-08-01", period_end: "2026-08-15", pay_date: "2026-08-15", expected_employer_version: "${emp_v2}" }
              as: payroll_specialist
              captures: { run_id: $.data.id }
            - call: "POST /payroll-runs/${run_id}/statements"
              payload: { employee_id: "${ee_id}", gross_earnings_cents: 150000, mandatory_deductions_cents: 30000 }
              as: payroll_specialist
              captures: { stmt_id: $.data.id }
          trigger:
            - call: "GET /employers/${emp_id}"
              as: payroll_specialist
              captures: { emp_v3: $.data.version }
            - call: "POST /payroll-runs/${run_id}/pay"
              payload: { expected_employer_version: "${emp_v3}" }
              as: payroll_specialist
          assert:
            - "PayStatement.${stmt_id}.total_withheld_cents == 6667"
            - "PayStatement.${stmt_id}.total_withheld_cents != 6701"
            - "WithholdingEvent for ${ord_id} has computation_proof.basis == 'PRORATED'"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_suspend_resume_cycle_bounded
        grounds:
          - state_machines.GarnishmentOrder.ACTIVE_to_SUSPENDED
          - state_machines.GarnishmentOrder.SUSPENDED_to_ACTIVE
          - errors[ERR_SUSPEND_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Cyclic machine on GarnishmentOrder: ACTIVE→SUSPENDED→ACTIVE loop is
          legal but bounded at MAX_SUSPENSIONS=3; the 4th suspend is rejected
