              as: PoolOperator
              as_user_id: "op-1"
              captures: { o1_id: "$.data.id" }
            - call: "POST /issuance-orders/${o1_id}/allocate"
              payload: { expected_agreement_version: "${fa1_v}" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /issuance-orders/${o1_id}/dispatch"
              payload: { dispatched_at: "2026-08-02T00:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /kegs/${k1_id}/scan"
              payload: { scan_point: "FILL", party_type: "BREWER", scanned_at: "2026-08-03T00:00:00Z", brand_code_scanned: "RDG", brewer_id: "${b1_id}" }
              as: Brewer
              as_user_id: "${b1_id}"
            - call: "POST /kegs/${k1_id}/scan"
              payload: { scan_point: "DISTRIBUTION", party_type: "DISTRIBUTOR", scanned_at: "2026-08-04T00:00:00Z", brand_code_scanned: "RDG", distributor_id: "${d1_id}" }
              as: Distributor
              as_user_id: "${d1_id}"
            - call: "POST /kegs/${k1_id}/scan"
              payload: { scan_point: "RETURN", party_type: "DISTRIBUTOR", scanned_at: "2026-08-06T00:00:00Z", brand_code_scanned: "RDG", distributor_id: "${d1_id}" }
              as: Distributor
              as_user_id: "${d1_id}"
            - call: "GET /return-incentives"
              payload: { distributor_id: "${d1_id}", accrual_type: "RETURN_DWELL" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { acc1_id: "$.data[0].id" }
            - call: "POST /return-incentives/${acc1_id}/pay"
              payload: { paid_at: "2026-08-07T00:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /theft-investigations"
              payload: { pool_id: "${p1_id}", opened_reason: "SCRAP_YARD_TIP", keg_ids: ["${k1_id}"], suspect_distributor_id: "${d1_id}" }
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-1"
              captures: { ti1_id: "$.data.id" }
            - call: "POST /theft-investigations/${ti1_id}/status"
              payload: { action: "EVIDENCE_HOLD", keg_ids: ["${k1_id}"], hold_started_at: "2026-08-08T00:00:00Z" }
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /theft-investigations/${ti1_id}/status"
              payload: { action: "CLOSE", outcome: "WRITTEN_OFF", outcome_notes: "Recovered as scrap at a Pueblo yard; keg destroyed." }
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-1"
          assert:
            - "before the close: ReturnIncentiveAccrual.${acc1_id}.status == PAID, incentive_cents == 250, dwell_days == 2, tier_pct_bp == 10000, cooperation_multiplier_bp == 10000, paid_at == 2026-08-07T00:00:00Z, and Distributor.${d1_id}.incentive_accrual_cents == 250 (paying does NOT drain the ledger)"
            - "before the close: TheftInvestigation.${ti1_id}.attached_keg_count == 1, held_keg_count == 1, stainless_value_at_risk_cents == 3900, status == EVIDENCE_HOLD; Keg.${k1_id}.custody_state == EVIDENCE_HOLD with pre_hold_custody_state == IN_SERVICE"
            - "after the close: ReturnIncentiveAccrual.${acc1_id}.status == CLAWED_BACK while incentive_cents is still 250 (the row is not zeroed, it leaves the sum)"
            - "after the close: Distributor.${d1_id}.incentive_accrual_cents == 0 — exactly the pre-accrual value, the same delta a clawback of an ACCRUED row would have produced"
            - "after the close: Distributor.${d1_id}.total_returns_count == 1, on_time_returns_count == 1, on_time_return_pct == 100.00, avg_dwell_days == 2.00 and cooperation_tier == BRONZE — the service history keeps the clawed-back return"
            - "Keg.${k1_id}.custody_state == STOLEN with theft_investigation_id still ${ti1_id} (retained for audit) and TheftInvestigation.${ti1_id}.status == CLOSED_WRITTEN_OFF with closed_at == 2026-08-15T23:00:00Z"
            - "KegPool.${p1_id}.kegs_written_off == 1, kegs_held == 0, kegs_servicing == 0, kegs_available == 1, available_pct == 50.00, posture == OPEN"
            - "FloatAgreement.${fa1_id}.float_posture == TIGHT (kegs_at_brewer_count 0 <= tight_ceiling floor(2 x 20 / 100) == 0) and billed_amount_cents == 2200"

      # ---- calculation claim rows already owned by §1.8 instances ----
      - name: keg_loss_value_two_bases_diverge_on_the_same_keg
        claim_type: Variant Divergence
        grounds:
          - calculations.keg_loss_value.variants
        excluded_because:
          difficulty_instance: keg_loss_value_replacement_cost_versus_depreciated_book_divergence
          rationale: "That §1.8 instance values one 24-fill DAMAGED_BEYOND_REPAIR keg under both bases and asserts the exact delta between the two net chargebacks, which is precisely the Variant Divergence row; a corner probe would re-derive the same pair of numbers."
      - name: brewer_loss_rate_two_windows_diverge_on_the_same_history
        claim_type: Variant Divergence
        grounds:
          - calculations.brewer_loss_rate_bp.variants
        excluded_because:
          difficulty_instance: brewer_loss_rate_trailing_window_versus_lifetime_divergence
          rationale: "That §1.8 instance builds one fill/loss history that reads far above the probation threshold on LIFETIME and below it on TRAILING_90D, asserting both rates and the untouched ACTIVE status — the divergence and the variant-selection consequence in one."
      - name: return_incentive_rounds_each_accrual_before_the_ledger_sum
        claim_type: Precision
        grounds:
          - calculations.return_incentive.precision
        excluded_because:
          difficulty_instance: return_incentive_rounds_per_keg_before_summation
          rationale: "That §1.8 instance mints three accruals whose rounded sum differs from the rounded sum of raw values by one cent, which is the only observable form this precision rule takes."
      - name: cooperation_tier_promotion_prices_then_promotes
        claim_type: threshold
        grounds:
          - calculations.cooperation_tier_promotion
        excluded_because:
          difficulty_instance: return_scan_promotes_cooperation_tier_which_reprices_the_next_accrual
          rationale: "That §1.8 instance asserts the value-then-promote ordering on the promoting scan itself and then the repriced next accrual, covering the threshold crossing and the split-calculation aspect together."
      - name: custody_interval_boundary_versus_interior_scan
        claim_type: interval_merge
        grounds:
          - calculations.custody_interval_integrity
        excluded_because:
          difficulty_instance: keg_custody_interval_half_open_boundary_accepted_interior_rejected
          rationale: "That §1.8 instance accepts a scan exactly on the interval boundary and rejects one strictly inside it with ERR_CUSTODY_INTERVAL_CONFLICT, which is the whole half-open claim."
      - name: service_centre_intake_window_and_capacity_interaction
        claim_type: interval_merge
        grounds:
          - calculations.service_center_intake
        excluded_because:
          difficulty_instance: service_center_closed_intake_window_and_aggregate_capacity
          rationale: "That §1.8 instance drives both halves of the intake rule — an out-of-window received_at and an at-capacity centre — with the priority between them pinned; a corner probe would duplicate one half."
      - name: pool_posture_threshold_inclusivity
        claim_type: threshold
        grounds:
          - calculations.pool_posture
        excluded_because:
          difficulty_instance: pool_available_pct_exactly_at_restrict_threshold_stays_open
          rationale: "That §1.8 instance sits available_pct exactly on restrict_threshold_pct (OPEN) and then one step below it (RESTRICTED with the per-order keg cap enforced), covering threshold-at and threshold-below in one run."
      - name: fill_charge_surcharge_cap_applies_to_the_base_only
        claim_type: Constants Applied
        grounds:
          - calculations.fill_charge_net
        excluded_because:
          difficulty_instance: fill_charge_pinned_order_cap_on_base_then_self_inclusive_tier
          rationale: "That §1.8 instance drives an over-limit dwell spell so the surcharge cap binds on the base alone and then reads the volume tier off a basis that includes the current fill, asserting every intermediate constant."

  # ==========================================================================
  # VALIDATIONS — Table 4 rows plus the validation-pattern rows
  # ==========================================================================
  - section: validations
    instances:
      - name: forbidden_role_outranks_the_invalid_pool_payload
        claim_type: Priority Ordering
        grounds:
          - validations[priority=2]
          - validations[priority=4]
          - roles.Brewer
        distinguishing_aspect: "Priority 2 is evaluated before the body is parsed: a Brewer posting a pool with pool_code missing gets ERR_FORBIDDEN_ROLE (403), never ERR_INVALID_REQUEST (400). Implementations that validate the schema first fail this."
        test_recipe:
          setup:
            - "Clock 2026-08-01T23:00:00Z; brewer RDG exists so the actor resolves; no pool is needed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /brewers"
              payload: { name: "Ridgeline Brewing", brand_code: "RDG", credit_limit_cents: 400000 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { b1_id: "$.data.id" }
          trigger:
            - call: "POST /pools"
              payload: { size_liters: 50, stainless_weight_kg: 12.5, replacement_cost_cents: 23500, region_code: "CO" }
              as: Brewer
              as_user_id: "${b1_id}"
              captures: { e_role: "$.data.error_id" }
          assert:
            - "HTTP 403 with error code ERR_FORBIDDEN_ROLE — POST /pools lists only PoolOperator"
            - "the response is NOT ERR_INVALID_REQUEST even though the required pool_code is absent (priority 2 < priority 4)"
            - "no KegPool row was created: GET /pools as PoolOperator returns total_count 0"
            - "the envelope carries data: null and the error object shape declared in §1.0"

      - name: unknown_actor_outranks_the_missing_scan_field_returns_403
        claim_type: Priority Ordering
        grounds:
          - validations[priority=3]
          - validations[priority=4]
          - errors.ERR_UNKNOWN_ACTOR
        distinguishing_aspect: "An X-User-Role of Brewer whose X-User-ID names no Brewer row is refused at priority 3 with ERR_UNKNOWN_ACTOR even though the scan body is also missing its required brand_code_scanned — actor resolution precedes payload validation, and the role itself IS permitted on this endpoint so priority 2 does not fire."
        test_recipe:
          setup:
            - "Clock 2026-08-01T23:00:00Z; a pool with one keg; no brewer with the id used in the header."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools"
              payload: { pool_code: "HB-50L", size_liters: 50, stainless_weight_kg: 12.5, replacement_cost_cents: 23500, region_code: "CO" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { p1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0001" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k1_id: "$.data.id" }
          trigger:
            - call: "POST /kegs/${k1_id}/scan"
              payload: { scan_point: "FILL", party_type: "BREWER", scanned_at: "2026-08-01T02:00:00Z" }
              as: Brewer
              as_user_id: "00000000-0000-0000-0000-0000000000ff"
          assert:
            - "HTTP 403 with error code ERR_UNKNOWN_ACTOR"
            - "not ERR_INVALID_REQUEST (brand_code_scanned is missing) and not ERR_FORBIDDEN_ROLE (Brewer is a permitted role on the scan endpoint)"
            - "not ERR_SCAN_SEQUENCE_INVALID either, although the keg is IN_FLOAT and a FILL is illegal from there — priority 3 fires long before priority 18"
            - "no ScanEvent was appended: GET /scan-events with keg_id filter returns total_count 0 and Keg.${k1_id}.scan_count == 0 with an unchanged version"

      - name: invalid_pagination_outranks_the_unknown_pool_lookup
        claim_type: Priority Ordering
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - endpoints[GET /pools/{pool_id}/kegs]
        distinguishing_aspect: "limit = 0 on a pool id that does not exist returns ERR_INVALID_PAGINATION (400) rather than ERR_POOL_NOT_FOUND (404): the pagination window is checked at priority 5, before any path id is resolved at priority 6. Both companion calls pin the two halves apart."
        test_recipe:
          setup:
            - "Clock 2026-08-01T23:00:00Z; one real pool with one keg; the id 00000000-0000-0000-0000-0000000000aa belongs to nothing."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools"
              payload: { pool_code: "HB-50L", size_liters: 50, stainless_weight_kg: 12.5, replacement_cost_cents: 23500, region_code: "CO" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { p1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0001" }
              as: PoolOperator
              as_user_id: "op-1"
          trigger:
            - call: "GET /pools/00000000-0000-0000-0000-0000000000aa/kegs"
              payload: { limit: 0 }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "GET /pools/${p1_id}/kegs"
              payload: { limit: 0 }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "GET /pools/00000000-0000-0000-0000-0000000000aa/kegs"
              payload: { limit: 20, offset: 0 }
              as: PoolOperator
              as_user_id: "op-1"
          assert:
            - "the first call returns HTTP 400 ERR_INVALID_PAGINATION — priority 5 wins over the unknown pool id"
            - "the second call returns HTTP 400 ERR_INVALID_PAGINATION as well, proving the first verdict was about the window and not about the id"
            - "the third call returns HTTP 404 ERR_POOL_NOT_FOUND, so the not-found path is genuinely reachable once pagination is legal"
            - "a fourth control call with limit 20 on ${p1_id} returns HTTP 200 with total_count 1, has_more false and the keg row present"

      - name: brewer_cannot_read_another_brewers_float_agreement
        claim_type: Violation → Error
        grounds:
          - validations[priority=8]
          - errors.ERR_NOT_RESOURCE_OWNER
          - roles.Brewer
        distinguishing_aspect: "The Brewer role is allowed on GET /float-agreements/{agreement_id}, so the only thing standing between brewer OAK and Ridgeline's agreement is priority 8's ownership test: OAK gets 403 ERR_NOT_RESOURCE_OWNER while RDG reads the very same row with 200. A role-only implementation returns the agreement to both."
        test_recipe:
          setup:
            - "Clock 2026-08-01T23:00:00Z; two brewers RDG and OAK; a pool; a DRAFT agreement for RDG only."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /brewers"
              payload: { name: "Ridgeline Brewing", brand_code: "RDG", credit_limit_cents: 400000 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { b1_id: "$.data.id" }
            - call: "POST /brewers"
              payload: { name: "Oak Street Ales", brand_code: "OAK", credit_limit_cents: 400000 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { b2_id: "$.data.id" }
            - call: "POST /pools"
              payload: { pool_code: "HB-50L", size_liters: 50, stainless_weight_kg: 12.5, replacement_cost_cents: 23500, region_code: "CO" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { p1_id: "$.data.id" }
            - call: "POST /float-agreements"
              payload: { brewer_id: "${b1_id}", pool_id: "${p1_id}", float_size_kegs: 2, per_fill_rate_cents: 2200 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { fa1_id: "$.data.id" }
          trigger:
            - call: "GET /float-agreements/${fa1_id}"
              payload: {}
              as: Brewer
              as_user_id: "${b2_id}"
          assert:
            - "HTTP 403 with error code ERR_NOT_RESOURCE_OWNER (not 404 — the row exists and is found before ownership is judged)"
            - "the same GET as Brewer ${b1_id} returns HTTP 200 with brewer_id == ${b1_id}, status == DRAFT and float_posture == HEALTHY"
            - "the same GET as PoolOperator op-1 returns HTTP 200 — priority 8 only constrains the entity-backed roles"
            - "GET /float-agreements as Brewer ${b2_id} returns HTTP 200 with total_count 0, i.e. the listing scopes rather than errors"

      - name: stale_agreement_version_is_rejected_before_the_frozen_pool_gate
        claim_type: Priority conflict
        grounds:
          - validations[priority=9]
          - validations[priority=13]
          - concurrency_rules.order-allocate-stale-agreement
        distinguishing_aspect: "Allocating a second order with the version captured before the first allocation violates four rules at once (stale version 9, pool FROZEN 13, float SUSPENDED 15, no eligible kegs 45) and must answer 412 ERR_STALE_AGREEMENT_VERSION. Retrying with the current version then exposes the next rule in line, ERR_POOL_FROZEN, proving the ordering rather than a lucky single check."
        test_recipe:
          setup:
            - "Clock 2026-08-01T23:00:00Z; index 2026-07-01 at 480; brewer RDG; pool HB-50L holding exactly ONE keg."
            - "Agreement float_size_kegs 2 at 2200 activated; two single-keg orders created up front while the pool is still OPEN at 100.00."
            - "The first order is allocated with the freshly captured version, which empties the pool to 0.00 and drives posture FROZEN and float_posture SUSPENDED, bumping the agreement version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /commodity-index"
              payload: { effective_date: "2026-07-01", usd_cents_per_kg: 480, source: "LME_SS304" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /brewers"
              payload: { name: "Ridgeline Brewing", brand_code: "RDG", credit_limit_cents: 400000 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { b1_id: "$.data.id" }
            - call: "POST /pools"
              payload: { pool_code: "HB-50L", size_liters: 50, stainless_weight_kg: 12.5, replacement_cost_cents: 23500, region_code: "CO" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { p1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0001" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k1_id: "$.data.id" }
            - call: "POST /float-agreements"
              payload: { brewer_id: "${b1_id}", pool_id: "${p1_id}", float_size_kegs: 2, per_fill_rate_cents: 2200 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { fa1_id: "$.data.id" }
            - call: "POST /float-agreements/${fa1_id}/activate"
              payload: { effective_date: "2026-08-01" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { fa1_v_old: "$.data.version" }
            - call: "POST /issuance-orders"
              payload: { agreement_id: "${fa1_id}", requested_keg_count: 1 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { o1_id: "$.data.id" }
            - call: "POST /issuance-orders"
              payload: { agreement_id: "${fa1_id}", requested_keg_count: 1 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { o2_id: "$.data.id" }
            - call: "POST /issuance-orders/${o1_id}/allocate"
              payload: { expected_agreement_version: "${fa1_v_old}" }
              as: PoolOperator
              as_user_id: "op-1"
          trigger:
            - call: "POST /issuance-orders/${o2_id}/allocate"
              payload: { expected_agreement_version: "${fa1_v_old}" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "GET /float-agreements/${fa1_id}"
              payload: {}
              as: PoolOperator
              as_user_id: "op-1"
              captures: { fa1_v_new: "$.data.version" }
            - call: "POST /issuance-orders/${o2_id}/allocate"
              payload: { expected_agreement_version: "${fa1_v_new}" }
              as: PoolOperator
              as_user_id: "op-1"
          assert:
            - "the first trigger returns HTTP 412 ERR_STALE_AGREEMENT_VERSION"
            - "it is NOT ERR_POOL_FROZEN, ERR_FLOAT_SUSPENDED or ERR_NO_ELIGIBLE_KEGS, all of which are equally true at that moment"
            - "${fa1_v_new} is strictly greater than ${fa1_v_old} (the first allocation bumped the agreement through the float_posture recompute)"
            - "the second trigger, now version-correct, returns HTTP 409 ERR_POOL_FROZEN — the next rule in priority order becomes visible"
            - "IssuanceOrder.${o2_id}.status is still REQUESTED with allocated_keg_count == 0 after both refusals"
            - "KegPool.${p1_id}.available_pct == 0.00 and posture == FROZEN; FloatAgreement.${fa1_id}.float_posture == SUSPENDED and kegs_at_brewer_count == 1"

      - name: float_suspended_outranks_brewer_suspended_on_allocate
        claim_type: Priority conflict
        grounds:
          - validations[priority=15]
          - validations[priority=16]
          - calculations.float_posture
          - endpoints[POST /brewers/{brewer_id}/status]
        distinguishing_aspect: "Suspending the brewer makes BOTH rules true, because the status change cascades float_posture to SUSPENDED — priority 15 must answer, so the error is ERR_FLOAT_SUSPENDED and never ERR_BREWER_SUSPENDED. Restoring the brewer to ACTIVE releases the posture and the identical allocate then succeeds."
        test_recipe:
          setup:
            - "Clock 2026-08-01T23:00:00Z; index 2026-07-01 at 480; brewer RDG; pool HB-50L with K-0001 and K-0002."
            - "Agreement float_size_kegs 2 at 2200 activated and one single-keg order created while the brewer is still ACTIVE, so order creation is never gated by priority 16."
            - "The brewer is then SUSPENDED by operator override, which cascades the agreement's float_posture to SUSPENDED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /commodity-index"
              payload: { effective_date: "2026-07-01", usd_cents_per_kg: 480, source: "LME_SS304" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /brewers"
              payload: { name: "Ridgeline Brewing", brand_code: "RDG", credit_limit_cents: 400000 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { b1_id: "$.data.id" }
            - call: "POST /pools"
              payload: { pool_code: "HB-50L", size_liters: 50, stainless_weight_kg: 12.5, replacement_cost_cents: 23500, region_code: "CO" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { p1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0001" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0002" }
              as: PoolOperator
              as_user_id: "op-1"
