              as: ShiftManager
            - call: "POST /inventory-lots"
              payload: { cut_type_id: "${dr_id}", received_weight_g: 5000, aging_target_days: 7 }
              as: Butcher
              captures: { lot_id: "$.data.id" }
            - call: "POST /inventory-lots/${lot_id}/start-aging"
              payload: { locker_id: "${locker_id}" }
              as: Butcher
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-08T00:00:00Z" }
              as: ShiftManager
          trigger:
            - call: "POST /inventory-lots/${lot_id}/complete-aging"
              payload: {}
              as: Butcher
              captures: { st: "$.data.lot_status" }
          assert:
            - "InventoryLot.${lot_id}.lot_status == AVAILABLE"
            - "InventoryLot.${lot_id}.locker_id == null"

  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: orderline_draw_requires_lot_available
        grounds:
          - state_machines.OrderLine.PENDING_to_DRAWN
          - state_machines.InventoryLot.AVAILABLE_to_AGING
          - validations[priority=6]
        distinguishing_aspect: |
          Entity pair OrderLine -> InventoryLot: an OrderLine may transition PENDING -> DRAWN only when the
          referenced InventoryLot.lot_status == AVAILABLE; against an AGING lot the draw is rejected with
          ERR_LOT_NOT_AVAILABLE, proving OrderLine's valid transition depends on InventoryLot's state.
