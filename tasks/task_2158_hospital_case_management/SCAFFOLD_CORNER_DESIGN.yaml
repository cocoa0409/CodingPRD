  - section: validations
    instances:

      - name: duplicate_mrn_returns_duplicate_mrn
        claim_type: violation_to_error
        grounds:
          - "validations[priority=7]"
          - errors[ERR_DUPLICATE_MRN]
        distinguishing_aspect: "A second Patient with an existing mrn is refused with ERR_DUPLICATE_MRN 409 even when every other field differs, and the patient count stays at 1."
        test_recipe:
          setup: ["One payer and one patient with mrn MRN-D001"]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Lakeside Choice", coinsurance_pct: 0.200 }
              as: PlatformAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-D001", full_name: "First Owner", date_of_birth: "1950-01-01", primary_payer_id: "${payer_id}", prior_admissions_180d: 0, lives_alone: false, has_pcp: true }
              as: PlatformAdmin
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /patients"
              payload: { mrn: "MRN-D001", full_name: "Second Claimant", date_of_birth: "1970-12-31", primary_payer_id: "${payer_id}", prior_admissions_180d: 3, lives_alone: true, has_pcp: false }
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 and data.error_id == ERR_DUPLICATE_MRN"
            - "GET /patients returns total_count == 1"
            - "Patient.${pat_id}.full_name == First Owner"

      - name: duplicate_network_contract_pair_returns_duplicate_network_contract
        claim_type: violation_to_error
        grounds:
          - "validations[priority=8]"
          - errors[ERR_DUPLICATE_NETWORK_CONTRACT]
        distinguishing_aspect: "A second NetworkContract for the same (payer_id, provider_id) pair is refused with ERR_DUPLICATE_NETWORK_CONTRACT 409, keeping the calculation's 'at most one such row exists' assumption true."
        test_recipe:
          setup: ["One payer, one provider, and one contract between them"]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Lakeside Choice", coinsurance_pct: 0.200 }
              as: PlatformAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Cedar SNF", provider_type: "SNF", quality_star_rating: 4, distance_miles_from_hospital: 6, bed_unit_codes: ["UNIT-A"] }
              as: PlatformAdmin
              captures: { prov_a: $.data.id }
            - call: "POST /network-contracts"
              payload: { payer_id: "${payer_id}", provider_id: "${prov_a}", in_network: true, negotiated_daily_rate_cents: 30000 }
