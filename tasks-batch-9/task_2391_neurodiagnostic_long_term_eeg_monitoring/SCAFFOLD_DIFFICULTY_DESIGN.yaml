  - rule_id: non_linear_state_machine
    instances:
      - name: authorization_pend_resubmit_cycle_capped_at_two
        grounds:
          - state_machines.AuthorizationRequest.SUBMITTED_to_PENDED
          - state_machines.AuthorizationRequest.PENDED_to_SUBMITTED
          - validations[priority=23]
          - errors[ERR_RESUBMISSION_LIMIT]
          - entities.AuthorizationRequest.fields.resubmission_count
        distinguishing_aspect: "Cyclic shape on the payer-negotiation machine: SUBMITTED -> PENDED -> SUBMITTED is traversed twice, the same submit endpoint is legal from two different states, and the loop is terminated by resubmission_count reaching MAX_RESUBMISSIONS (2) rather than by any state change."
        test_recipe:
          setup:
            - "Patient with a DRAFT authorization requesting 5 INPATIENT_VEEG days."
            - "Round 1: submit (DRAFT -> SUBMITTED), payer PENDs it (resubmission_count stays 0)."
            - "Round 2: submit again (PENDED -> SUBMITTED, resubmission_count 1), payer PENDs again."
            - "Round 3: submit again (PENDED -> SUBMITTED, resubmission_count 2), payer PENDs again -> the loop budget is now exhausted."
          setup_api_calls:
            - call: "POST /neurodiagnostics/patients"
              payload: { mrn: "MRN-2391-06", display_name: "Pat Six", risk_tier: "LOW" }
              as: UnitCoordinator
              captures: { patient_id: $.data.id }
