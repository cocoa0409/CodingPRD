            - {call: "POST /model-documentation/${md}/file", payload: {expected_documentation_version: "${mdv}"}, as: ComplianceOfficer}
            - {call: "GET /score-models/${m1}", payload: {}, as: ModelDeveloper, captures: {m1v: $.data.version}}
            - {call: "POST /score-models/${m1}/release", payload: {expected_model_version: "${m1v}"}, as: ModelDeveloper}
            - {call: "POST /archive-samples", payload: {score_model_id: "${m1}", sample_ref: "XFER-INIT", record_count: 4000, segment_name: "PRIME", sample_kind: "VALIDATION", observation_window_months: 24, window_start_month: "2024-01", window_end_month: "2026-01"}, as: ValidationAnalyst, captures: {s: $.data.id}}
          trigger:
            - {call: "POST /validation-studies", payload: {score_model_id: "${m1}", sample_id: "${s}", study_path: "CROSS_BUREAU", performed_by: "va-init"}, as: ValidationAnalyst, captures: {study: $.data.id, study_st: $.data.status, touched: $.data.touched_model_ids, req: $.data.required_reason_codes, div: $.data.reconciliation_variance}}
          assert:
            - "the response status is 201 and data.study_st == \"SCHEDULED\""
            - "data.touched == [ScoreModel.${m1}.id] — the replay log is seeded with the study's own model before anything runs"
