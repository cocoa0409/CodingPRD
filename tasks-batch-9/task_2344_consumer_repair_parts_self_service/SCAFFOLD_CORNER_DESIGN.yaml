      - name: segregation_of_duties_on_review_is_user_scoped_not_role_scoped
        claim_type: segregation_of_duties
        grounds:
          - roles.SafetyReviewer.notes
          - validations[priority=44]
          - errors[ERR_SELF_REVIEW_FORBIDDEN]
          - state_machines.ManualRevision.transitions[IN_REVIEW -> APPROVED]
        distinguishing_aspect: |
          A SafetyReviewer may legitimately author a revision; what is forbidden is
          the same X-User-ID deciding it. A second reviewer user clears the guard,
          and publication — which has no user-level guard — is then allowed to the
          original author, so the restriction must be attached to the decision hop
          alone.
        test_recipe:
          setup:
            - "Model CRX-R6; a DISASSEMBLY_GUIDE revision authored by u_rev_1 acting as SafetyReviewer and submitted for review."
          setup_api_calls:
            - call: "POST /repair-program/product-models"
