          - entities.Claim.fields.handling_status
          - entities.Claim.fields.reserve_status
          - entities.Claim.fields.reserve_released_cents
          - invariants.claim_exposure_conserved
        distinguishing_aspect: |
          The non-linear machine here belongs to the Claim entity and its
          non-linearity is parallelism, not a cycle: handling_status and
          reserve_status are two independent dimensions on one row, proven by a
          reserve revision that moves PROVISIONAL -> REVISED while
