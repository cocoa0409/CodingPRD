        distinguishing_aspect: "The risk thresholds are inclusive: score 14 proceeds to DOCUMENT_VERIFIED, 15 lands in FRAUD_REVIEW, 20 is rejected outright. Fixtures: WATCHLIST+DOC+SELFIE=9 → DOCUMENT_VERIFIED; plus VELOCITY(8)=17 → FRAUD_REVIEW; VELOCITY(8)+WATCHLIST(4)+DOC(2)+SELFIE(3)+3 more from an additional watchlist-hit profile path is not available, so the block case uses ERR_TOO_MANY_REJECTED_ENROLLMENTS velocity hard-stop at 3 rejects — distinct from the score path."
