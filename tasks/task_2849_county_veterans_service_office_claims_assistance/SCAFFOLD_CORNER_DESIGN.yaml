      - name: corner_returned_report_is_reopened_and_recomputed
        claim_type: conditional_action
        grounds:
          - endpoints[POST /cvso/outcome-reports/{id}/review]
          - endpoints[POST /cvso/outcome-reports/{id}/reopen]
          - state_machines.OutcomeReport[SUBMITTED->RETURNED]
          - state_machines.OutcomeReport[RETURNED->OPEN]
          - calculations.outcome_report_performance_score
        distinguishing_aspect: "RETURN is only available from SUBMITTED and reopen only from RETURNED: the auditor's RETURN stores return_reason and moves the report to RETURNED, the administrator's reopen moves it back to OPEN and clears certified_by_representative_id and submitted_at while retaining return_reason and the previously computed figures, and the second submit-then-ACCEPT run drives the same row to the terminal ACCEPTED state."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, so the quarter 2026Q1 is closed and no claim was filed in it."
            - "rep_a ACTIVE COUNTY_CVSO."
            - "OutcomeReport rpt for 2026Q1, computed once with weighting_basis CLAIM_WEIGHTED and then submitted."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/representatives"
              payload: { full_name: "Dana Reyes", accreditation_number: "ACC-2849-851", accreditation_type: "COUNTY_CVSO", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
              captures: { rep_a: $.data.id }
            - call: "POST /cvso/representatives/${rep_a}/accreditation"
              payload: { action: "ACTIVATE" }
              as: SystemAdmin
            - call: "POST /cvso/outcome-reports"
              payload: { fiscal_quarter: "2026Q1" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
              captures: { rpt: $.data.id }
            - call: "POST /cvso/outcome-reports/${rpt}/compute"
              payload: { weighting_basis: "CLAIM_WEIGHTED" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
              captures: { score: $.data.performance_score, filed: $.data.filed_claim_count }
            - call: "POST /cvso/outcome-reports/${rpt}/submit"
              payload: {}
              as: CountyOfficer
              as_user_id: "${rep_a}"
              captures: { sub_status: $.data.status, certifier: $.data.certified_by_representative_id, submitted_at: $.data.submitted_at }
          trigger:
            - call: "POST /cvso/outcome-reports/${rpt}/review"
              payload: { action: "RETURN", reason: "outreach totals need a second pass" }
              as: StateAuditor
              captures: { ret_status: $.data.status, ret_reason: $.data.return_reason }
            - call: "POST /cvso/outcome-reports/${rpt}/reopen"
              payload: {}
              as: SystemAdmin
              captures: { open_status: $.data.status, certifier_after: $.data.certified_by_representative_id, submitted_after: $.data.submitted_at, basis_after: $.data.weighting_basis, reason_after: $.data.return_reason }
            - call: "POST /cvso/outcome-reports/${rpt}/submit"
              payload: {}
              as: CountyOfficer
              as_user_id: "${rep_a}"
              captures: { resub_status: $.data.status }
            - call: "POST /cvso/outcome-reports/${rpt}/review"
              payload: { action: "ACCEPT" }
              as: StateAuditor
              captures: { acc_status: $.data.status }
          assert:
            - "${filed} == 0"
            - "${score} == 0.0"
            - "${sub_status} == SUBMITTED"
            - "${certifier} == ${rep_a}"
            - "${submitted_at} == 2026-08-01T00:00:00.000Z"
            - "${ret_status} == RETURNED"
            - "${ret_reason} == outreach totals need a second pass"
            - "${open_status} == OPEN"
            - "${certifier_after} == null"
            - "${submitted_after} == null"
            - "${basis_after} == CLAIM_WEIGHTED"
            - "${reason_after} == outreach totals need a second pass"
            - "${resub_status} == SUBMITTED"
            - "${acc_status} == ACCEPTED"
            - "OutcomeReport.${rpt}.version at the end equals its value right after the submit in setup plus 4, one increment per write"

      - name: corner_designation_revocation_releases_the_representative_slot
