      - name: offer_create_over_budget_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_INCENTIVE_BUDGET_EXCEEDED]"]
        distinguishing_aspect: "Single-failure fiscal path: posture CRITICAL (allowed) but the 36000-cent reserve exceeds the 30000-cent budget."
