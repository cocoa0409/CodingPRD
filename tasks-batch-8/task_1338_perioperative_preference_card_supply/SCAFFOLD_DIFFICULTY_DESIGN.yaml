# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Perioperative Preference Card & Supply Picking
# 9 rules x 2 instances = 18 instances. Every instance is replayable from
# empty-DB using only SCAFFOLD.yaml §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: case_cost_standard_vs_actual_diverge
        grounds:
          - calculations.case_standard_cost
          - calculations.case_actual_cost
        distinguishing_aspect: |
          Same case data priced by two valid algorithms on the SurgicalCase cost
          domain: as-planned (pinned card at release) yields standard_cost_cents
          6000 while as-used (usage + per-line waste charges at completion)
          yields actual_cost_cents 6500; the 500-cent delta is the HOLD suture
          opened-but-unused at 1.5x.
        test_recipe:
          setup:
            - "Surgeon S; items GLOVE-PR 250c OPEN (on_hand 100), SUTURE-KIT 1000c HOLD (50), DRAPE-FULL 3000c OPEN (20)"
            - "Card (TKA): 4x GLOVE-PR OPEN, 2x SUTURE-KIT HOLD, 1x DRAPE-FULL OPEN; published ACTIVE"
            - "Case scheduled, pick list released (standard 6000), all three lines picked, cart dispatched and returned with nothing unopened"
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Dual", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "GLOVE-PR", name: "Gloves pair", unit_cost_cents: 250, substitute_group: "GLOVES", initial_on_hand: 100 }, as: SupplyChainAnalyst, captures: { item_a: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "SUTURE-KIT", name: "Suture kit", unit_cost_cents: 1000, substitute_group: "SUTURE", initial_on_hand: 50 }, as: SupplyChainAnalyst, captures: { item_b: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "DRAPE-FULL", name: "Full drape", unit_cost_cents: 3000, substitute_group: "DRAPE", initial_on_hand: 20 }, as: SupplyChainAnalyst, captures: { item_c: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "TKA" }, as: SupplyChainAnalyst, captures: { card_id: "$.data.id" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_a}", quantity: 4, designation: "OPEN", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_b}", quantity: 2, designation: "HOLD", pick_sequence: 2 }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_c}", quantity: 1, designation: "OPEN", pick_sequence: 3 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${card_id}", as: Any, captures: { card_v: "$.data.version" } }
            - { call: "POST /perioperative/preference-cards/${card_id}/publish", payload: { expected_card_version: "${card_v}" }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/cases", payload: { surgeon_id: "${s_id}", card_id: "${card_id}", scheduled_start: "2026-09-01T08:00:00Z", expected_duration_min: 120, room: "OR-1" }, as: SupplyChainAnalyst, captures: { case_id: "$.data.id" } }
            - { call: "POST /perioperative/cases/${case_id}/release-pick-list", payload: {}, as: SupplyChainAnalyst, captures: { pl_id: "$.data.id" } }
            - { call: "GET /perioperative/pick-list-lines?pick_list_id=${pl_id}", as: Any, captures: { line_a: "$.data[0].id", line_b: "$.data[1].id", line_c: "$.data[2].id" } }
            - { call: "POST /perioperative/pick-lists/${pl_id}/begin-picking", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-list-lines/${line_a}/pick", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-list-lines/${line_b}/pick", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-list-lines/${line_c}/pick", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-lists/${pl_id}/dispatch", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-lists/${pl_id}/return", payload: { return_entries: [] }, as: CartTechnician }
          trigger:
            - { call: "POST /perioperative/cases/${case_id}/complete", payload: { usage_entries: [ { pick_list_line_id: "${line_a}", qty_used: 4 }, { pick_list_line_id: "${line_b}", qty_used: 1 }, { pick_list_line_id: "${line_c}", qty_used: 1 } ] }, as: CirculatingNurse }
            - { call: "GET /perioperative/cases/${case_id}", as: Any }
          assert:
            - "SurgicalCase.${case_id}.standard_cost_cents == 6000 (4*250 + 2*1000 + 1*3000, as-planned variant)"
            - "SurgicalCase.${case_id}.actual_cost_cents == 6500 (used 5000 + waste 1500, as-used variant)"
            - "SurgicalCase.${case_id}.waste_cost_cents == 1500"
            - "SurgicalCase.${case_id}.status == COMPLETED"

      - name: audit_line_match_vs_spend_weighted_diverge
        grounds:
          - calculations.audit_accuracy_scores
        distinguishing_aspect: |
          Same completed case graded by two valid algorithms on the
          CardAccuracyAudit quality domain: count-based line_match_pct is 66.67
          while spend-based spend_match_pct is 91.67; the variants disagree
          because the mismatched line is cheap relative to total spend.
        test_recipe:
          setup:
            - "Identical fixture to case_cost_standard_vs_actual_diverge: card standard 6000, one HOLD line under-used (1 of 2)"
            - "Case completed; CardAccuracyAudit generated for the pinned card"
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Dual", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "GLOVE-PR", name: "Gloves pair", unit_cost_cents: 250, substitute_group: "GLOVES", initial_on_hand: 100 }, as: SupplyChainAnalyst, captures: { item_a: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "SUTURE-KIT", name: "Suture kit", unit_cost_cents: 1000, substitute_group: "SUTURE", initial_on_hand: 50 }, as: SupplyChainAnalyst, captures: { item_b: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "DRAPE-FULL", name: "Full drape", unit_cost_cents: 3000, substitute_group: "DRAPE", initial_on_hand: 20 }, as: SupplyChainAnalyst, captures: { item_c: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "TKA" }, as: SupplyChainAnalyst, captures: { card_id: "$.data.id" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_a}", quantity: 4, designation: "OPEN", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_b}", quantity: 2, designation: "HOLD", pick_sequence: 2 }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_c}", quantity: 1, designation: "OPEN", pick_sequence: 3 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${card_id}", as: Any, captures: { card_v: "$.data.version" } }
            - { call: "POST /perioperative/preference-cards/${card_id}/publish", payload: { expected_card_version: "${card_v}" }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/cases", payload: { surgeon_id: "${s_id}", card_id: "${card_id}", scheduled_start: "2026-09-01T08:00:00Z", expected_duration_min: 120, room: "OR-1" }, as: SupplyChainAnalyst, captures: { case_id: "$.data.id" } }
            - { call: "POST /perioperative/cases/${case_id}/release-pick-list", payload: {}, as: SupplyChainAnalyst, captures: { pl_id: "$.data.id" } }
            - { call: "GET /perioperative/pick-list-lines?pick_list_id=${pl_id}", as: Any, captures: { line_a: "$.data[0].id", line_b: "$.data[1].id", line_c: "$.data[2].id" } }
            - { call: "POST /perioperative/pick-lists/${pl_id}/begin-picking", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-list-lines/${line_a}/pick", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-list-lines/${line_b}/pick", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-list-lines/${line_c}/pick", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-lists/${pl_id}/dispatch", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-lists/${pl_id}/return", payload: { return_entries: [] }, as: CartTechnician }
          trigger:
            - { call: "POST /perioperative/cases/${case_id}/complete", payload: { usage_entries: [ { pick_list_line_id: "${line_a}", qty_used: 4 }, { pick_list_line_id: "${line_b}", qty_used: 1 }, { pick_list_line_id: "${line_c}", qty_used: 1 } ] }, as: CirculatingNurse }
            - { call: "GET /perioperative/card-audits?case_id=${case_id}", as: Any, captures: { audit_id: "$.data[0].id" } }
          assert:
            - "CardAccuracyAudit.${audit_id}.matched_line_count == 2 (glove 4==4 and drape 1==1 match; suture 1!=2 does not)"
            - "CardAccuracyAudit.${audit_id}.total_line_count == 3"
            - "CardAccuracyAudit.${audit_id}.line_match_pct == 66.67 (2/3, count-based variant)"
            - "CardAccuracyAudit.${audit_id}.spend_match_pct == 91.67 (1 - 500/6000, spend-based variant)"
            - "CardAccuracyAudit.${audit_id}.waste_flag == true (waste_pct 25.0 >= 20.0)"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: waste_charge_designation_multiplier_branch
        grounds:
          - calculations.waste_charge
        distinguishing_aspect: |
          Mode (a): four inputs (qty_wasted, unit_cost_cents, designation,
          consignment_flag) interact through a conditional multiplier branch —
          a HOLD line opened-but-unused at 1000c yields waste_charge_cents 1500
          (1.5x), where the same line designated OPEN would yield 1000 (1.0x).
        test_recipe:
          setup:
            - "Surgeon S; item SUTURE-KIT 1000c group SUTURE on_hand 50; card with single line 2x SUTURE-KIT HOLD, published"
            - "Case released, line picked (2 units), dispatched, returned with nothing unopened (both opened)"
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Mult", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "SUTURE-KIT", name: "Suture kit", unit_cost_cents: 1000, substitute_group: "SUTURE", initial_on_hand: 50 }, as: SupplyChainAnalyst, captures: { item_b: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "SCOPE" }, as: SupplyChainAnalyst, captures: { card_id: "$.data.id" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_b}", quantity: 2, designation: "HOLD", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${card_id}", as: Any, captures: { card_v: "$.data.version" } }
            - { call: "POST /perioperative/preference-cards/${card_id}/publish", payload: { expected_card_version: "${card_v}" }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/cases", payload: { surgeon_id: "${s_id}", card_id: "${card_id}", scheduled_start: "2026-09-01T08:00:00Z", expected_duration_min: 60, room: "OR-2" }, as: SupplyChainAnalyst, captures: { case_id: "$.data.id" } }
            - { call: "POST /perioperative/cases/${case_id}/release-pick-list", payload: {}, as: SupplyChainAnalyst, captures: { pl_id: "$.data.id" } }
            - { call: "GET /perioperative/pick-list-lines?pick_list_id=${pl_id}", as: Any, captures: { line_b: "$.data[0].id" } }
            - { call: "POST /perioperative/pick-lists/${pl_id}/begin-picking", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-list-lines/${line_b}/pick", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-lists/${pl_id}/dispatch", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-lists/${pl_id}/return", payload: { return_entries: [] }, as: CartTechnician }
          trigger:
            - { call: "POST /perioperative/cases/${case_id}/complete", payload: { usage_entries: [ { pick_list_line_id: "${line_b}", qty_used: 1 } ] }, as: CirculatingNurse }
            - { call: "GET /perioperative/usage-records?pick_list_line_id=${line_b}", as: Any, captures: { ur_id: "$.data[0].id" } }
          assert:
            - "UsageRecord.${ur_id}.qty_opened == 2 and qty_wasted == 1"
            - "UsageRecord.${ur_id}.waste_charge_cents == 1500 (round_half_up(1 x 1000 x 1.5) — HOLD branch)"
            - "SurgicalCase.${case_id}.standard_cost_cents == 2000"
            - "SurgicalCase.${case_id}.actual_cost_cents == 2500 (used 1000 + waste 1500)"

      - name: waste_rounding_per_line_then_sum_pinned
        grounds:
          - calculations.case_actual_cost
        distinguishing_aspect: |
          Mode (b): nested rounding order — two HOLD waste lines at 333c each
          produce 499.5c raw per line; per-line round_half_up then sum yields
          1000c, while sum-then-round would yield 999c. The scaffold pins
          per-line-then-sum, so 1000c is the only correct answer.
        test_recipe:
          setup:
            - "Surgeon S; items PAD-A 333c and PAD-B 333c (group PAD, on_hand 10 each)"
            - "Card: 1x PAD-A HOLD + 1x PAD-B HOLD (standard 666), published; case released, both lines picked, dispatched, returned with nothing unopened"
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Round", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "PAD-A", name: "Pad A", unit_cost_cents: 333, substitute_group: "PAD", initial_on_hand: 10 }, as: SupplyChainAnalyst, captures: { item_g: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "PAD-B", name: "Pad B", unit_cost_cents: 333, substitute_group: "PAD", initial_on_hand: 10 }, as: SupplyChainAnalyst, captures: { item_h: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "EXFIX" }, as: SupplyChainAnalyst, captures: { card_id: "$.data.id" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_g}", quantity: 1, designation: "HOLD", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_h}", quantity: 1, designation: "HOLD", pick_sequence: 2 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${card_id}", as: Any, captures: { card_v: "$.data.version" } }
            - { call: "POST /perioperative/preference-cards/${card_id}/publish", payload: { expected_card_version: "${card_v}" }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/cases", payload: { surgeon_id: "${s_id}", card_id: "${card_id}", scheduled_start: "2026-09-01T08:00:00Z", expected_duration_min: 60, room: "OR-3" }, as: SupplyChainAnalyst, captures: { case_id: "$.data.id" } }
            - { call: "POST /perioperative/cases/${case_id}/release-pick-list", payload: {}, as: SupplyChainAnalyst, captures: { pl_id: "$.data.id" } }
            - { call: "GET /perioperative/pick-list-lines?pick_list_id=${pl_id}", as: Any, captures: { line_g: "$.data[0].id", line_h: "$.data[1].id" } }
            - { call: "POST /perioperative/pick-lists/${pl_id}/begin-picking", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-list-lines/${line_g}/pick", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-list-lines/${line_h}/pick", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-lists/${pl_id}/dispatch", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-lists/${pl_id}/return", payload: { return_entries: [] }, as: CartTechnician }
          trigger:
            - { call: "POST /perioperative/cases/${case_id}/complete", payload: { usage_entries: [] }, as: CirculatingNurse }
            - { call: "GET /perioperative/usage-records?pick_list_line_id=${line_g}", as: Any, captures: { ur_g: "$.data[0].id" } }
            - { call: "GET /perioperative/cases/${case_id}", as: Any }
          assert:
            - "UsageRecord.${ur_g}.waste_charge_cents == 500 (round_half_up(1 x 333 x 1.5) = round_half_up(499.5) per line)"
            - "SurgicalCase.${case_id}.waste_cost_cents == 1000 (500 + 500; sum-then-round's 999 is forbidden)"
            - "SurgicalCase.${case_id}.actual_cost_cents == 1000 (nothing used)"
            - "SurgicalCase.${case_id}.standard_cost_cents == 666"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: pick_list_exception_cycle
        grounds:
          - state_machines.PickList.IN_PICKING_to_PICKING_EXCEPTION
          - state_machines.PickList.PICKING_EXCEPTION_to_IN_PICKING
          - state_machines.PickListLine.PENDING_to_SHORT
          - state_machines.PickListLine.SHORT_to_SUBSTITUTED
        distinguishing_aspect: |
          PickList is cyclic: IN_PICKING -> PICKING_EXCEPTION -> IN_PICKING ->
          STAGED, driven by child line mutations; the cycle exits the exception
          only when the last SHORT line is substituted, and stages only when no
          PENDING lines remain.
        test_recipe:
          setup:
            - "Surgeon S; TRAY-STD 2000c group TRAY on_hand 0; TRAY-ALT 2200c group TRAY on_hand 5; GLOVE-PR 250c group GLOVES on_hand 100"
            - "Card: 2x TRAY-STD OPEN (seq 1) + 1x GLOVE-PR OPEN (seq 2), published; case scheduled and released"
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Cycle", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "TRAY-STD", name: "Standard tray", unit_cost_cents: 2000, substitute_group: "TRAY", initial_on_hand: 0 }, as: SupplyChainAnalyst, captures: { item_x: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "TRAY-ALT", name: "Alternate tray", unit_cost_cents: 2200, substitute_group: "TRAY", initial_on_hand: 5 }, as: SupplyChainAnalyst, captures: { item_alt: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "GLOVE-PR", name: "Gloves pair", unit_cost_cents: 250, substitute_group: "GLOVES", initial_on_hand: 100 }, as: SupplyChainAnalyst, captures: { item_a: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "ORIF" }, as: SupplyChainAnalyst, captures: { card_id: "$.data.id" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_x}", quantity: 2, designation: "OPEN", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_a}", quantity: 1, designation: "OPEN", pick_sequence: 2 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${card_id}", as: Any, captures: { card_v: "$.data.version" } }
            - { call: "POST /perioperative/preference-cards/${card_id}/publish", payload: { expected_card_version: "${card_v}" }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/cases", payload: { surgeon_id: "${s_id}", card_id: "${card_id}", scheduled_start: "2026-09-01T08:00:00Z", expected_duration_min: 90, room: "OR-4" }, as: SupplyChainAnalyst, captures: { case_id: "$.data.id" } }
            - { call: "POST /perioperative/cases/${case_id}/release-pick-list", payload: {}, as: SupplyChainAnalyst, captures: { pl_id: "$.data.id" } }
            - { call: "GET /perioperative/pick-list-lines?pick_list_id=${pl_id}", as: Any, captures: { line_x: "$.data[0].id", line_a: "$.data[1].id" } }
            - { call: "POST /perioperative/pick-lists/${pl_id}/begin-picking", payload: {}, as: CartTechnician }
          trigger:
            - { call: "POST /perioperative/pick-list-lines/${line_x}/mark-short", payload: { reason_code: "OUT_OF_STOCK" }, as: CartTechnician }
            - { call: "GET /perioperative/pick-lists/${pl_id}", as: Any, captures: { st_exc: "$.data.status" } }
            - { call: "POST /perioperative/pick-list-lines/${line_x}/substitute", payload: { substitute_supply_item_id: "${item_alt}" }, as: CartTechnician }
            - { call: "GET /perioperative/pick-lists/${pl_id}", as: Any, captures: { st_back: "$.data.status" } }
            - { call: "POST /perioperative/pick-list-lines/${line_a}/pick", payload: {}, as: CartTechnician }
            - { call: "GET /perioperative/pick-lists/${pl_id}", as: Any, captures: { st_final: "$.data.status" } }
            - { call: "GET /perioperative/supply-items/${item_alt}", as: Any }
          assert:
            - "list status after mark-short (${st_exc}) == PICKING_EXCEPTION"
            - "list status after substitute (${st_back}) == IN_PICKING (cycle back; glove line still PENDING so not yet STAGED)"
            - "list status after final pick (${st_final}) == STAGED (auto-stage bubble-up)"
            - "PickListLine.${line_x}.status == SUBSTITUTED, qty_picked == 2, unit_cost_cents == 2200 (re-snapshotted from substitute)"
            - "SupplyItem.${item_alt}.on_hand_quantity == 3 (5 - 2)"
            - "SurgicalCase.${case_id}.pick_exception_count == 1"

      - name: audit_dispute_rereview_cycle
        grounds:
          - state_machines.CardAccuracyAudit.GENERATED_to_DISPUTED
          - state_machines.CardAccuracyAudit.DISPUTED_to_UNDER_REVIEW
          - state_machines.CardAccuracyAudit.UNDER_REVIEW_to_DISPUTED
          - state_machines.CardAccuracyAudit.UNDER_REVIEW_to_ACCEPTED
        distinguishing_aspect: |
          CardAccuracyAudit is cyclic on a different entity than PickList:
          GENERATED -> DISPUTED -> UNDER_REVIEW -> DISPUTED -> ACCEPTED loops
          through the review cycle twice before terminating.
        test_recipe:
          setup:
            - "Surgeon S; item GLOVE-PR 250c on_hand 100; card 1x GLOVE-PR OPEN published; case completed with 1 used (audit GENERATED, waste 0)"
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Loop", specialty: "CARD" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "GLOVE-PR", name: "Gloves pair", unit_cost_cents: 250, substitute_group: "GLOVES", initial_on_hand: 100 }, as: SupplyChainAnalyst, captures: { item_a: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "CATH" }, as: SupplyChainAnalyst, captures: { card_id: "$.data.id" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_a}", quantity: 1, designation: "OPEN", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${card_id}", as: Any, captures: { card_v: "$.data.version" } }
            - { call: "POST /perioperative/preference-cards/${card_id}/publish", payload: { expected_card_version: "${card_v}" }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/cases", payload: { surgeon_id: "${s_id}", card_id: "${card_id}", scheduled_start: "2026-09-01T08:00:00Z", expected_duration_min: 45, room: "OR-5" }, as: SupplyChainAnalyst, captures: { case_id: "$.data.id" } }
            - { call: "POST /perioperative/cases/${case_id}/release-pick-list", payload: {}, as: SupplyChainAnalyst, captures: { pl_id: "$.data.id" } }
            - { call: "GET /perioperative/pick-list-lines?pick_list_id=${pl_id}", as: Any, captures: { line_a: "$.data[0].id" } }
            - { call: "POST /perioperative/pick-lists/${pl_id}/begin-picking", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-list-lines/${line_a}/pick", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-lists/${pl_id}/dispatch", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-lists/${pl_id}/return", payload: { return_entries: [] }, as: CartTechnician }
            - { call: "POST /perioperative/cases/${case_id}/complete", payload: { usage_entries: [ { pick_list_line_id: "${line_a}", qty_used: 1 } ] }, as: CirculatingNurse }
            - { call: "GET /perioperative/card-audits?case_id=${case_id}", as: Any, captures: { audit_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /perioperative/card-audits/${audit_id}/dispute", payload: { comment: "waste attribution wrong" }, as: Surgeon, as_user_id: "${s_id}", captures: { st1: "$.data.status" } }
            - { call: "POST /perioperative/card-audits/${audit_id}/reopen-review", payload: {}, as: SupplyChainAnalyst, captures: { st2: "$.data.status" } }
            - { call: "POST /perioperative/card-audits/${audit_id}/dispute", payload: { comment: "still wrong" }, as: Surgeon, as_user_id: "${s_id}", captures: { st3: "$.data.status" } }
            - { call: "POST /perioperative/card-audits/${audit_id}/reopen-review", payload: {}, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/card-audits/${audit_id}/accept", payload: {}, as: SupplyChainAnalyst, captures: { st4: "$.data.status" } }
          assert:
            - "audit status sequence: ${st1} == DISPUTED, ${st2} == UNDER_REVIEW, ${st3} == DISPUTED (cycle), ${st4} == ACCEPTED"
            - "CardAccuracyAudit.${audit_id}.dispute_comment == 'still wrong' (latest dispute stored)"
            - "CardAccuracyAudit.${audit_id}.line_match_pct == 100.0 (single line matched exactly)"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: complete_case_cascade_depth3
        grounds:
          - state_machines.SurgicalCase.IN_PROGRESS_to_COMPLETED
          - calculations.waste_flag_threshold
          - entities.PreferenceCard.fields.flagged_audit_count
        distinguishing_aspect: |
          Depth-3 chain from the complete trigger: usage records recompute the
          case's cost fields (link 1); the derived waste_pct >= 20.0 flags the
          newly generated audit (link 2); the flagged audit's creation bumps the
          pinned card's flagged_audit_count and rolling_line_match_pct (link 3).
          Each hop is caused by the previous hop, not by the original call.
        test_recipe:
          setup:
            - "Same fixture as case_cost_standard_vs_actual_diverge (standard 6000, suture HOLD under-used) so waste_pct lands at 25.0"
            - "Card flagged_audit_count == 0 and rolling_line_match_pct == null before completion"
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Cascade", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "GLOVE-PR", name: "Gloves pair", unit_cost_cents: 250, substitute_group: "GLOVES", initial_on_hand: 100 }, as: SupplyChainAnalyst, captures: { item_a: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "SUTURE-KIT", name: "Suture kit", unit_cost_cents: 1000, substitute_group: "SUTURE", initial_on_hand: 50 }, as: SupplyChainAnalyst, captures: { item_b: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "DRAPE-FULL", name: "Full drape", unit_cost_cents: 3000, substitute_group: "DRAPE", initial_on_hand: 20 }, as: SupplyChainAnalyst, captures: { item_c: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "TKA" }, as: SupplyChainAnalyst, captures: { card_id: "$.data.id" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_a}", quantity: 4, designation: "OPEN", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_b}", quantity: 2, designation: "HOLD", pick_sequence: 2 }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_c}", quantity: 1, designation: "OPEN", pick_sequence: 3 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${card_id}", as: Any, captures: { card_v: "$.data.version" } }
            - { call: "POST /perioperative/preference-cards/${card_id}/publish", payload: { expected_card_version: "${card_v}" }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/cases", payload: { surgeon_id: "${s_id}", card_id: "${card_id}", scheduled_start: "2026-09-01T08:00:00Z", expected_duration_min: 120, room: "OR-1" }, as: SupplyChainAnalyst, captures: { case_id: "$.data.id" } }
            - { call: "POST /perioperative/cases/${case_id}/release-pick-list", payload: {}, as: SupplyChainAnalyst, captures: { pl_id: "$.data.id" } }
            - { call: "GET /perioperative/pick-list-lines?pick_list_id=${pl_id}", as: Any, captures: { line_a: "$.data[0].id", line_b: "$.data[1].id", line_c: "$.data[2].id" } }
            - { call: "POST /perioperative/pick-lists/${pl_id}/begin-picking", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-list-lines/${line_a}/pick", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-list-lines/${line_b}/pick", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-list-lines/${line_c}/pick", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-lists/${pl_id}/dispatch", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-lists/${pl_id}/return", payload: { return_entries: [] }, as: CartTechnician }
          trigger:
            - { call: "POST /perioperative/cases/${case_id}/complete", payload: { usage_entries: [ { pick_list_line_id: "${line_a}", qty_used: 4 }, { pick_list_line_id: "${line_b}", qty_used: 1 }, { pick_list_line_id: "${line_c}", qty_used: 1 } ] }, as: CirculatingNurse }
            - { call: "GET /perioperative/card-audits?case_id=${case_id}", as: Any, captures: { audit_id: "$.data[0].id" } }
            - { call: "GET /perioperative/preference-cards/${card_id}", as: Any }
          assert:
            - "link 1: SurgicalCase.${case_id}.actual_cost_cents == 6500 and waste_cost_cents == 1500"
            - "link 2: CardAccuracyAudit.${audit_id}.waste_pct == 25.0 and waste_flag == true (25.0 >= 20.0)"
            - "link 3: PreferenceCard.${card_id}.flagged_audit_count == 1 and rolling_line_match_pct == 66.67"
            - "PickList for the case is CLOSED (bubble-up from completion)"

      - name: mark_short_cascade_depth2
        grounds:
          - state_machines.PickListLine.PENDING_to_SHORT
          - state_machines.PickList.IN_PICKING_to_PICKING_EXCEPTION
          - entities.SurgicalCase.fields.pick_exception_count
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (mark-short, not complete):
          the line's PENDING -> SHORT mutation forces the list into
          PICKING_EXCEPTION (link 1), and that list transition — not the line
          mutation itself — increments the case's pick_exception_count (link 2).
        test_recipe:
          setup:
            - "Surgeon S; TRAY-STD 2000c group TRAY on_hand 0; card 1x TRAY-STD OPEN published; case released and picking started"
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Short", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "TRAY-STD", name: "Standard tray", unit_cost_cents: 2000, substitute_group: "TRAY", initial_on_hand: 0 }, as: SupplyChainAnalyst, captures: { item_x: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "ORIF" }, as: SupplyChainAnalyst, captures: { card_id: "$.data.id" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_x}", quantity: 1, designation: "OPEN", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${card_id}", as: Any, captures: { card_v: "$.data.version" } }
            - { call: "POST /perioperative/preference-cards/${card_id}/publish", payload: { expected_card_version: "${card_v}" }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/cases", payload: { surgeon_id: "${s_id}", card_id: "${card_id}", scheduled_start: "2026-09-01T08:00:00Z", expected_duration_min: 90, room: "OR-4" }, as: SupplyChainAnalyst, captures: { case_id: "$.data.id" } }
            - { call: "POST /perioperative/cases/${case_id}/release-pick-list", payload: {}, as: SupplyChainAnalyst, captures: { pl_id: "$.data.id" } }
            - { call: "GET /perioperative/pick-list-lines?pick_list_id=${pl_id}", as: Any, captures: { line_x: "$.data[0].id" } }
            - { call: "POST /perioperative/pick-lists/${pl_id}/begin-picking", payload: {}, as: CartTechnician }
          trigger:
            - { call: "POST /perioperative/pick-list-lines/${line_x}/mark-short", payload: { reason_code: "OUT_OF_STOCK" }, as: CartTechnician }
            - { call: "GET /perioperative/pick-lists/${pl_id}", as: Any, captures: { lst: "$.data.status" } }
            - { call: "GET /perioperative/cases/${case_id}", as: Any }
          assert:
            - "PickListLine.${line_x}.status == SHORT"
            - "link 1: list status (${lst}) == PICKING_EXCEPTION"
            - "link 2: SurgicalCase.${case_id}.pick_exception_count == 1"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: substitute_state_beats_safety
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_LINE_NOT_SHORT]
          - errors[ERR_SUBSTITUTE_GROUP_MISMATCH]
        distinguishing_aspect: |
          Category pair state-vs-business_safety: a substitute call whose line
          is PENDING (state violation) AND whose substitute is from the wrong
          group (safety violation) must fail with ERR_LINE_NOT_SHORT because
          priority 5 evaluates before priority 7.
        test_recipe:
          setup:
            - "Surgeon S; TRAY-STD 2000c group TRAY on_hand 5; CLAMP-9 1500c group CLAMP on_hand 5"
            - "Card 1x TRAY-STD OPEN published; case released; picking started; the tray line is still PENDING (never marked short)"
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Prio", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "TRAY-STD", name: "Standard tray", unit_cost_cents: 2000, substitute_group: "TRAY", initial_on_hand: 5 }, as: SupplyChainAnalyst, captures: { item_x: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "CLAMP-9", name: "Clamp", unit_cost_cents: 1500, substitute_group: "CLAMP", initial_on_hand: 5 }, as: SupplyChainAnalyst, captures: { item_bad: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "ORIF" }, as: SupplyChainAnalyst, captures: { card_id: "$.data.id" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_x}", quantity: 1, designation: "OPEN", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${card_id}", as: Any, captures: { card_v: "$.data.version" } }
            - { call: "POST /perioperative/preference-cards/${card_id}/publish", payload: { expected_card_version: "${card_v}" }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/cases", payload: { surgeon_id: "${s_id}", card_id: "${card_id}", scheduled_start: "2026-09-01T08:00:00Z", expected_duration_min: 90, room: "OR-4" }, as: SupplyChainAnalyst, captures: { case_id: "$.data.id" } }
            - { call: "POST /perioperative/cases/${case_id}/release-pick-list", payload: {}, as: SupplyChainAnalyst, captures: { pl_id: "$.data.id" } }
            - { call: "GET /perioperative/pick-list-lines?pick_list_id=${pl_id}", as: Any, captures: { line_x: "$.data[0].id" } }
            - { call: "POST /perioperative/pick-lists/${pl_id}/begin-picking", payload: {}, as: CartTechnician }
          trigger:
            - { call: "POST /perioperative/pick-list-lines/${line_x}/substitute", payload: { substitute_supply_item_id: "${item_bad}" }, as: CartTechnician, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_LINE_NOT_SHORT (state, priority 5) — NOT ERR_SUBSTITUTE_GROUP_MISMATCH (business_safety, priority 7)"
            - "PickListLine.${line_x}.status remains PENDING; no stock moved (CLAMP-9 on_hand still 5)"

      - name: complete_referential_beats_fiscal
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - errors[ERR_LINE_CASE_MISMATCH]
          - errors[ERR_CONSIGNMENT_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Category pair business_referential-vs-business_fiscal: a complete
          call carrying a foreign pick line (referential violation) that would
          also breach the case's consignment budget (fiscal violation) must
          fail with ERR_LINE_CASE_MISMATCH because priority 8 evaluates before
          priority 11.
        test_recipe:
          setup:
            - "Case F: surgeon S, card with 1x GLOVE-PR OPEN, pick list released; its line ${line_f} is the foreign line (qty_used 0 entry keeps the safety check satisfied)"
            - "Case D: same surgeon, consignment card 2x ROD-TI OPEN (5000c each), case consignment_budget_cents 9000; released, picked, dispatched, returned"
            - "Completing case D with ROD-TI qty_used 2 would create charges of 10000c > 9000c budget (fiscal violation armed)"
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Ref", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "GLOVE-PR", name: "Gloves pair", unit_cost_cents: 250, substitute_group: "GLOVES", initial_on_hand: 100 }, as: SupplyChainAnalyst, captures: { item_a: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "ROD-TI", name: "Titanium rod", unit_cost_cents: 5000, substitute_group: "ROD", consignment_flag: true, initial_on_hand: 10 }, as: SupplyChainAnalyst, captures: { item_d: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "CATH" }, as: SupplyChainAnalyst, captures: { card_f: "$.data.id" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_f}", supply_item_id: "${item_a}", quantity: 1, designation: "OPEN", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${card_f}", as: Any, captures: { card_f_v: "$.data.version" } }
            - { call: "POST /perioperative/preference-cards/${card_f}/publish", payload: { expected_card_version: "${card_f_v}" }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/cases", payload: { surgeon_id: "${s_id}", card_id: "${card_f}", scheduled_start: "2026-09-01T08:00:00Z", expected_duration_min: 45, room: "OR-5" }, as: SupplyChainAnalyst, captures: { case_f: "$.data.id" } }
            - { call: "POST /perioperative/cases/${case_f}/release-pick-list", payload: {}, as: SupplyChainAnalyst, captures: { pl_f: "$.data.id" } }
            - { call: "GET /perioperative/pick-list-lines?pick_list_id=${pl_f}", as: Any, captures: { line_f: "$.data[0].id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "SPINE" }, as: SupplyChainAnalyst, captures: { card_d: "$.data.id" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_d}", supply_item_id: "${item_d}", quantity: 2, designation: "OPEN", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${card_d}", as: Any, captures: { card_d_v: "$.data.version" } }
            - { call: "POST /perioperative/preference-cards/${card_d}/publish", payload: { expected_card_version: "${card_d_v}" }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/cases", payload: { surgeon_id: "${s_id}", card_id: "${card_d}", scheduled_start: "2026-09-02T08:00:00Z", expected_duration_min: 120, room: "OR-6", consignment_budget_cents: 9000 }, as: SupplyChainAnalyst, captures: { case_d: "$.data.id" } }
            - { call: "POST /perioperative/cases/${case_d}/release-pick-list", payload: {}, as: SupplyChainAnalyst, captures: { pl_d: "$.data.id" } }
            - { call: "GET /perioperative/pick-list-lines?pick_list_id=${pl_d}", as: Any, captures: { line_d: "$.data[0].id" } }
            - { call: "POST /perioperative/pick-lists/${pl_d}/begin-picking", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-list-lines/${line_d}/pick", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-lists/${pl_d}/dispatch", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-lists/${pl_d}/return", payload: { return_entries: [] }, as: CartTechnician }
          trigger:
            - { call: "POST /perioperative/cases/${case_d}/complete", payload: { usage_entries: [ { pick_list_line_id: "${line_f}", qty_used: 0 }, { pick_list_line_id: "${line_d}", qty_used: 2 } ] }, as: CirculatingNurse, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_LINE_CASE_MISMATCH (business_referential, priority 8) — NOT ERR_CONSIGNMENT_BUDGET_EXCEEDED (business_fiscal, priority 11)"
            - "SurgicalCase.${case_d}.status remains IN_PROGRESS and no UsageRecord rows exist for the case (atomic rejection)"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: pick_on_hand_exact_equality_boundary
        grounds:
          - state_machines.PickListLine.PENDING_to_PICKED
          - errors[ERR_INSUFFICIENT_STOCK]
          - entities.SupplyItem.fields.on_hand_quantity
        distinguishing_aspect: |
          Metric = stock quantity on the pick endpoint: on_hand == qty_requested
          (3 == 3) is sufficient (>= semantics) and leaves on_hand 0; the very
          next pick of the same item fails because 0 < 3.
        test_recipe:
          setup:
            - "Surgeon S; item SCALPEL-11 150c group BLADE on_hand exactly 3; card 3x SCALPEL-11 OPEN published"
            - "Case 1 released and picking started; case 2 (same card, later slot, different room) also released and picking started"
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Bound", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "SCALPEL-11", name: "Scalpel 11", unit_cost_cents: 150, substitute_group: "BLADE", initial_on_hand: 3 }, as: SupplyChainAnalyst, captures: { item_s: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "EXCISION" }, as: SupplyChainAnalyst, captures: { card_id: "$.data.id" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_s}", quantity: 3, designation: "OPEN", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${card_id}", as: Any, captures: { card_v: "$.data.version" } }
            - { call: "POST /perioperative/preference-cards/${card_id}/publish", payload: { expected_card_version: "${card_v}" }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/cases", payload: { surgeon_id: "${s_id}", card_id: "${card_id}", scheduled_start: "2026-09-01T08:00:00Z", expected_duration_min: 30, room: "OR-7" }, as: SupplyChainAnalyst, captures: { case_1: "$.data.id" } }
            - { call: "POST /perioperative/cases/${case_1}/release-pick-list", payload: {}, as: SupplyChainAnalyst, captures: { pl_1: "$.data.id" } }
            - { call: "GET /perioperative/pick-list-lines?pick_list_id=${pl_1}", as: Any, captures: { line_1: "$.data[0].id" } }
            - { call: "POST /perioperative/pick-lists/${pl_1}/begin-picking", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/cases", payload: { surgeon_id: "${s_id}", card_id: "${card_id}", scheduled_start: "2026-09-01T10:00:00Z", expected_duration_min: 30, room: "OR-8" }, as: SupplyChainAnalyst, captures: { case_2: "$.data.id" } }
            - { call: "POST /perioperative/cases/${case_2}/release-pick-list", payload: {}, as: SupplyChainAnalyst, captures: { pl_2: "$.data.id" } }
            - { call: "GET /perioperative/pick-list-lines?pick_list_id=${pl_2}", as: Any, captures: { line_2: "$.data[0].id" } }
            - { call: "POST /perioperative/pick-lists/${pl_2}/begin-picking", payload: {}, as: CartTechnician }
          trigger:
            - { call: "POST /perioperative/pick-list-lines/${line_1}/pick", payload: {}, as: CartTechnician }
            - { call: "GET /perioperative/supply-items/${item_s}", as: Any, captures: { on_hand_after: "$.data.on_hand_quantity" } }
            - { call: "POST /perioperative/pick-list-lines/${line_2}/pick", payload: {}, as: CartTechnician, captures: { err: "$.data.error_id" } }
          assert:
            - "first pick succeeds: 3 <= 3 (equality is sufficient)"
            - "SupplyItem.${item_s}.on_hand_quantity == 0 after the first pick"
            - "second pick: ${err} == ERR_INSUFFICIENT_STOCK (0 < 3)"
            - "PickListLine.${line_2}.status remains PENDING"

      - name: waste_flag_exactly_twenty_pct_boundary
        grounds:
          - calculations.waste_flag_threshold
        distinguishing_aspect: |
          Metric = waste percentage on the complete endpoint: a case whose
          rounded waste_pct is exactly 20.0 is flagged (>= semantics) while an
          otherwise identical case at 19.98 is not; the comparison applies to
          the 2dp-rounded value.
        test_recipe:
          setup:
            - "Surgeon S; items GLOVE-PR 250c, DRAPE-FULL 3000c, WRAP-STD 800c, WRAP-LT 799c, GEL-PK 201c — all on_hand 50"
            - "Card A (standard 6000): 8x GLOVE-PR OPEN, 1x DRAPE-FULL OPEN, 1x WRAP-STD HOLD — case alpha completes with the wrap opened-unused (waste 1200)"
            - "Card B (standard 6000): 8x GLOVE-PR OPEN, 1x DRAPE-FULL OPEN, 1x WRAP-LT HOLD, 1x GEL-PK OPEN — case beta completes with the wrap opened-unused (waste 1199)"
