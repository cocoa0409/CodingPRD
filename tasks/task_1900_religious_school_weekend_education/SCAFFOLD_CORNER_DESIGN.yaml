  # =====================================================================
  # Section: rbac
  # =====================================================================
  - section: rbac
    instances:
      - name: missing_auth_headers_return_unauthenticated
        claim_type: role_denial
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A call with no X-User-Role/X-User-ID headers fails 401 ERR_UNAUTHENTICATED before any role or existence check."
        test_recipe:
          setup: ["one family exists"]
          setup_api_calls:
            - { call: "POST /school/families", payload: { family_name: "Fam AU", primary_email: "au@x.org", membership_status: "MEMBER" }, as: SchoolAdmin, captures: { fam: $.data.id } }
          trigger:
            - { call: "GET /school/families/${fam}", payload: {}, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHENTICATED (HTTP 401) — no credentials presented"

      - name: parent_cannot_open_school_year
        claim_type: role_denial
        grounds: [roles.SchoolAdmin, "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "The Parent role is absent from the open endpoint's roles — denied with ERR_UNAUTHORIZED_ROLE (403) even on an existing year."
        test_recipe:
          setup: ["one year in SETUP; one family (Parent identity)"]
          setup_api_calls:
            - { call: "POST /school/school-years", payload: { name: "2026-27", start_date: "2026-09-01", end_date: "2027-06-01", member_tuition_cents: 72500, non_member_tuition_cents: 120000, early_bird_pct: 0.075, early_bird_deadline: "2026-08-15T00:00:00Z", sibling_discount_pcts: [0, 0.10, 0.20], activity_fee_cents: 5000, volunteer_hours_required: 8, volunteer_buyout_fee_cents: 25000, late_fee_pct: 0.015, late_fee_min_balance_cents: 500, tuition_due_date: "2026-10-01", withdrawal_deadline: "2026-09-30", refund_pct_after_deadline: 0.5, attendance_threshold_pct: 80 }, as: SchoolAdmin, captures: { y_id: $.data.id } }
            - { call: "POST /school/families", payload: { family_name: "Fam PR", primary_email: "pr@x.org", membership_status: "MEMBER" }, as: SchoolAdmin, captures: { fam: $.data.id } }
          trigger:
            - { call: "POST /school/school-years/${y_id}/open", payload: {}, as: Parent, as_user_id: "${fam}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHORIZED_ROLE (HTTP 403); year remains SETUP"

      - name: parent_reading_other_family_forbidden
        claim_type: role_denial
        grounds: ["validations[priority=3]", "errors[ERR_OWNERSHIP_MISMATCH]", roles.Parent]
        distinguishing_aspect: "Parent (entity_backed by Family) reading a DIFFERENT family's record fails with ERR_OWNERSHIP_MISMATCH; reading their own succeeds."
        test_recipe:
          setup: ["families A and B exist"]
          setup_api_calls:
            - { call: "POST /school/families", payload: { family_name: "Fam A", primary_email: "a@x.org", membership_status: "MEMBER" }, as: SchoolAdmin, captures: { fam_a: $.data.id } }
            - { call: "POST /school/families", payload: { family_name: "Fam B", primary_email: "b@x.org", membership_status: "MEMBER" }, as: SchoolAdmin, captures: { fam_b: $.data.id } }
          trigger:
            - { call: "GET /school/families/${fam_b}", payload: {}, as: Parent, as_user_id: "${fam_a}", captures: { err: $.data.error_id } }
            - { call: "GET /school/families/${fam_a}", payload: {}, as: Parent, as_user_id: "${fam_a}", captures: { ok_id: $.data.id } }
          assert:
            - "err == ERR_OWNERSHIP_MISMATCH (HTTP 403) for the cross-family read"
            - "ok_id == ${fam_a} for the own-family read (200)"

      - name: teacher_attendance_ownership
        claim_type: role_denial
        grounds: [roles.Teacher, "errors[ERR_OWNERSHIP_MISMATCH]", "endpoints.POST /school/sessions/{id}/attendance"]
        distinguishing_aspect: "Teacher T2 (hired but assigned to no section) posting attendance for T1's section session fails with ERR_OWNERSHIP_MISMATCH; T1 posting the same payload succeeds."
        test_recipe:
          setup: ["OPEN year; T1 hired and assigned to the section; T2 hired, unassigned; one enrolled student; session held (clock 2026-09-13)"]
          setup_api_calls:
