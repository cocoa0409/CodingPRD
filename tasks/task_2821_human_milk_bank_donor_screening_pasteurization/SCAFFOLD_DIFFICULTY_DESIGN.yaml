      - name: pool_nutrition_closed_upper_bound_21_00
        grounds:
          - calculations.pool_projected_kcal_per_oz
          - calculations.pool_projected_kcal_per_oz.precision
          - validations[priority=66]
          - errors.ERR_POOL_NUTRITION_OUT_OF_RANGE
          - entities.Pool.fields.projected_kcal_per_oz
          - state_machines.Pool.BALANCED_to_COMMITTED
        distinguishing_aspect: |
          A different metric (volume-weighted kcal/oz, rounded half-up to exactly 2 decimals) on
          a different endpoint (POST /milk-bank/pools/{id}/commit) at the CLOSED upper bound
          KCAL_MAX 21.00. Pool A's 700+700+700 ml at 20.0 / 21.0 / 22.0 gives 44100 / 2100 =
          21.00 and must commit; pool B's 700+700+700 ml at 20.0 / 21.0 / 22.05 gives
          44135 / 2100 = 21.0166666... which rounds half-up to 21.02 and must be refused with
          ERR_POOL_NUTRITION_OUT_OF_RANGE. Truncating instead of rounding, or treating the range
          as open, flips one of the two verdicts.
        test_recipe:
          setup:
            - "Logical clock is 2026-08-05T08:00:00Z."
            - "Three qualified donors each shipped a two-container cooler of 1400 ml, logged as two 700 ml donations."
            - "Pool POOL-A (TERM) holds one 700 ml component from each donor at 20.0, 21.0 and 22.0 kcal/oz, so projected_kcal_per_oz is exactly 21.00 and total_volume_ml is 2100."
