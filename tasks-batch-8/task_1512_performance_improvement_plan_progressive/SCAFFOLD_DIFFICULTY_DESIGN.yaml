              as: Manager
              as_user_id: "${mgr_id}"
              captures: { cle2: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/performance-concerns"
              payload: { category: "QUALITY", summary: "Quality below bar", coaching_log_entry_ids: ["${cle1}", "${cle2}"] }
