            - { call: "POST /api/visits", payload: { facility_id: "${fR3}", visit_type: "ROUTINE", inspector_user_id: "sup-1", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T12:00:00Z" }, as: AccountManager, captures: { vR3: $.data.id } }
