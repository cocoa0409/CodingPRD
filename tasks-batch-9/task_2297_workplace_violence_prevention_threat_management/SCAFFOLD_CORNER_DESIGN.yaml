      - name: training_expiry_fires_at_exactly_the_clock_and_flips_the_readiness_flag
        claim_type: scheduled_actions
        grounds:
          - endpoints[POST /_ops/daily-run]
          - endpoints[POST /_clock/set_current_utc]
          - state_machines.TrainingAssignment.COMPLETED_to_EXPIRED
          - state_machines.PreventionPlan.ACTIVE_to_REVIEW_DUE
          - entities.Employee.fields.training_current
          - calculations.plan_compliance_metrics
          - calculations.inspection_readiness_score
        distinguishing_aspect: |
          Both time-driven sweeps use an inclusive comparison against the logical clock and both fire on
          the same instant: at 2027-07-31T23:59:59Z nothing moves, and at exactly 2027-08-01T00:00:00Z the
          completion expires (expires_at <= clock) and the plan becomes review-due (review_due_date <=
          clock) in one run, dropping readiness 79.90 -> 52.80 while the threshold rises 75.00 -> 85.00.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z (the mandatory default)."
            - "Worksite \"North Plant\" (state_code CA, employee_count 20) with one WorkArea \"Front Desk\" (job_function CASH_HANDLING, public_access_flag true, night_shift_flag true, occupancy_cap 8)."
            - "Three SECURITY-job_function employees back the SafetyOfficer, SiteManager and HRPartner roles; one ADMIN-job_function employee \"Wendy Cole\" is the entire training population."
            - "One TrainingModule WVP-ADMIN (job_function_scope [\"ADMIN\"], refresh_interval_days 365, passing_score 80, required_for_escort false), so the (employee, module) pair set has exactly one member."
            - "Wendy Cole completed WVP-ADMIN at 2026-08-01T00:00:00Z with score 88, so expires_at is 2027-08-01T00:00:00Z and training_compliance_pct is 100.00."
            - "PreventionPlan is ACTIVE for the worksite with one SCREENING HazardAssessment on \"Front Desk\" scoring 64.00 / TIER_1, so hazard_coverage_pct is 100.00, unmitigated_hazard_count is 1, review_due_date is 2027-08-01T00:00:00Z and compliance_posture is OPEN."
            - "The readiness subtotal is 85.00 (hazard 30.00, training 25.00, log 20.00, drill 0.00, action 10.00), the penalty is 5.10 and inspection_readiness_score is 79.90, so inspection_ready is true against the OPEN threshold 75.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /worksites"
              payload: { name: "North Plant", state_code: "CA", employee_count: 20 }
              as: ProgramAdmin
              captures: { ws_id: $.data.id }
            - call: "POST /work-areas"
              payload: { worksite_id: "${ws_id}", name: "Front Desk", job_function: "CASH_HANDLING", public_access_flag: true, lone_worker_flag: false, night_shift_flag: true, occupancy_cap: 8 }
              as: ProgramAdmin
              captures: { wa_front_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Sofia Ortiz", job_function: "SECURITY" }
              as: ProgramAdmin
              captures: { so_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Marcus Reed", job_function: "SECURITY" }
              as: ProgramAdmin
              captures: { sm_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Priya Nair", job_function: "SECURITY" }
              as: ProgramAdmin
              captures: { hr_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Wendy Cole", job_function: "ADMIN" }
              as: ProgramAdmin
              captures: { w1_id: $.data.id, w1_id_v: $.data.version }
            - call: "POST /training-modules"
              payload: { code: "WVP-ADMIN", job_function_scope: ["ADMIN"], scenario_set_version: "2026.1", refresh_interval_days: 365, passing_score: 80, required_for_escort: false }
              as: ProgramAdmin
              captures: { mod_adm_id: $.data.id }
            - call: "POST /training-assignments"
              payload: { employee_id: "${w1_id}", module_id: "${mod_adm_id}", due_at: "2026-08-20T00:00:00Z", expected_employee_version: "${w1_id_v}" }
              as: HRPartner
              as_user_id: "${hr_id}"
              captures: { ta1_id: $.data.id }
            - call: "POST /training-assignments/${ta1_id}/complete"
              payload: { score: 88 }
              as: Employee
              as_user_id: "${w1_id}"
            - call: "POST /prevention-plans"
              payload: { worksite_id: "${ws_id}", effective_date: "2026-08-01T00:00:00Z", review_interval_days: 365 }
              as: SafetyOfficer
              as_user_id: "${so_id}"
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - call: "POST /hazard-assessments"
              payload: { plan_id: "${plan_id}", work_area_id: "${wa_front_id}", reported_incident_count: 4, proximity_factor: "HIGH", cash_on_hand_cents: 0, min_staff_per_shift: 2, expected_plan_version: "${plan_v}" }
              as: SafetyOfficer
