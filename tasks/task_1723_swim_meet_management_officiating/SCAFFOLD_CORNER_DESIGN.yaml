          trigger:
            - { call: "POST /meets/${meet_id}/seed", payload: { expected_meet_version: "${meet_v}" }, as: MeetDirector }
            - { call: "GET /lane-assignments", payload: { entry_id: "${e1}" }, as: Any, captures: { e1_h: "$.data[0].heat_number", e1_l: "$.data[0].lane_number" } }
            - { call: "GET /lane-assignments", payload: { entry_id: "${e6}" }, as: Any, captures: { e6_h: "$.data[0].heat_number", e6_l: "$.data[0].lane_number" } }
