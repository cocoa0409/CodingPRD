  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cession_then_recapture_conserves_total_penal_sum
        grounds:
          - state_machines.Cession.ACTIVE_to_RECAPTURED
          - entities.Bond.fields.net_retained_cents
          - entities.SuretyProgram.fields.aggregate_committed_cents
          - entities.ReinsuranceTreaty.fields.ceded_committed_cents
        distinguishing_aspect: |
          Conserved quantity = total bond penal sum partition (program net_retained + treaty ceded).
          Forward action (create cession) + compensating action (recapture) leaves the invariant
          program.aggregate_committed_cents + treaty.ceded_committed_cents == bond.penal_sum_cents
          unchanged at 12,000,000, with the treaty share returned to 0.
        test_recipe:
          setup:
            - "An ACTIVE bond penal 12,000,000 on a fresh program (aggregate_committed 12,000,000); treaty 30% quota share capacity 10,000,000 (ceded_committed 0). No cessions yet."
          setup_api_calls:
            - call: "POST /surety/programs"
              payload: { name: "P17", single_limit_cents: 20000000, aggregate_limit_cents: 50000000, referral_threshold_cents: 25000000, loss_alert_threshold_cents: 50000000 }
              as: SeniorUnderwriter
              captures: { prog_id: $.data.id }
            - call: "POST /surety/treaties"
              payload: { name: "T17", cession_pct_bps: 3000, treaty_capacity_cents: 10000000 }
              as: SeniorUnderwriter
