# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine §0.5 rules x 2 instances = 18 instances.
# Every instance drives itself from an empty database using only §1.5 endpoints.
# The logical clock starts at 2026-08-01T00:00:00Z on server boot.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: lease_charge_total_quoted_projection_vs_settled_actual
        grounds:
          - calculations.lease_charge_total
          - calculations.lease_monthly_rate
          - calculations.lease_mobilization_fee
          - state_machines.Lease.lease_accruing_to_settled
          - entities.Lease.fields.quoted_total_cents
          - entities.Lease.fields.final_settlement_cents
        distinguishing_aspect: |
          This dual variant lives in the Lease cost-accounting domain: quoted_projection
          bills term_months=12 with zero permit and zero damage (3668170), while
          settled_actual bills ceil(288/30)=10 actual months, adds the APPROVED permit fee
          and the finalized damage chargeback and an early-termination adjustment (3864975);
          the two numbers differ by exactly 196805 cents for the same lease row.
        test_recipe:
          setup:
            - "One branch (Dallas Yard, yard capacity 25, dispatch capacity 2, labor 9200 c/h)."
            - "One jurisdiction TX-DAL: permit_required, 21-day lead, PIER_FOUNDATION, wind zone 2, ada_ramp_required, ratio 12.0."
            - "One PUBLISHED floorplan configuration on a 24x60 two-section spec (config_surcharge_cents == 713000)."
            - "One GOLD customer with a 5,000,000-cent credit limit and one IN_FLEET unit."
            - "Lease L1 2026-09-01..2027-08-26 (term 12) with a COMPLIANT COMBO accessory package, an APPROVED permit, ACCRUING billing, installed, then torn down on 2027-06-15."
            - "A SUBMITTED damage assessment carrying three line items (one of them wear-and-tear)."
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "Dallas Yard", region_code: "TX-N", yard_capacity_units: 25, daily_dispatch_capacity: 2, labor_rate_cents_per_hour: 9200 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { b1_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "TX-DAL", name: "Dallas County", permit_required: true, permit_lead_days: 21, anchoring_standard: "PIER_FOUNDATION", wind_zone: 2, permit_fee_cents: 145000, ada_ramp_required: true, min_ramp_run_ratio: 12.0 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { j1_id: $.data.id }
            - call: "POST /building-specs"
              payload: { model_code: "MOB-2460", width_ft: 24, length_ft: 60, sections: 2, floor_height_in: 36, base_monthly_rate_cents: 118000, delivery_base_cents: 240000, install_base_cents: 185000, replacement_value_cents: 9500000, max_occupancy: 24 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { s1_id: $.data.id }
            - call: "POST /floorplan-configurations"
              payload: { building_spec_id: "${s1_id}", name: "2-Office ADA", private_offices: 2, restrooms: 1, partition_linear_ft: 46, hvac_tons: 4.0 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { c1_id: $.data.id }
            - call: "POST /floorplan-configurations/${c1_id}/publish"
              payload: {}
              as: FleetAdmin
              as_user_id: "admin-ops-1"
            - call: "POST /units"
              payload: { serial_number: "MSU-1001", building_spec_id: "${s1_id}", current_branch_id: "${b1_id}", condition_grade: "A" }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { u1_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Acme Construction", billing_email: "ap@acme.test", credit_tier: "GOLD", credit_limit_cents: 5000000 }
              as: LeasingAgent
              as_user_id: "agent-77"
              captures: { cu1_id: $.data.id }
            - call: "POST /leases"
              payload: { customer_id: "${cu1_id}", unit_id: "${u1_id}", jurisdiction_id: "${j1_id}", floorplan_configuration_id: "${c1_id}", site_address: "400 Commerce St, Dallas TX", start_date: "2026-09-01", term_months: 12 }
              as: LeasingAgent
              as_user_id: "agent-77"
              captures: { l1_id: $.data.id }
            - call: "POST /accessory-packages"
              payload: { lease_id: "${l1_id}", package_type: "COMBO", ramp_run_ft: 36.0, landing_count: 2, step_count: 4 }
              as: LeasingAgent
              as_user_id: "agent-77"
              captures: { pkg1_id: $.data.id }
            - call: "POST /permit-applications"
              payload: { lease_id: "${l1_id}", jurisdiction_id: "${j1_id}", foundation_type: "PIER_FOUNDATION" }
              as: LeasingAgent
              as_user_id: "agent-77"
              captures: { p1_id: $.data.id }
            - call: "POST /permit-applications/${p1_id}/submit"
              payload: {}
              as: LeasingAgent
              as_user_id: "agent-77"
            - call: "POST /permit-applications/${p1_id}/decide"
              payload: { decision: "APPROVED", reviewer_note: "Pier plan stamped." }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
            - call: "POST /leases/${l1_id}/activate"
              payload: {}
              as: LeasingAgent
              as_user_id: "agent-77"
            - call: "POST /logistics-jobs"
              payload: { lease_id: "${l1_id}", job_type: "DELIVERY_INSTALL", origin_branch_id: "${b1_id}", scheduled_date: "2026-09-01", mileage_miles: 180, crew_hours: 6.5 }
              as: BranchOps
              as_user_id: "${b1_id}"
              captures: { job1_id: $.data.id }
            - call: "POST /logistics-jobs/${job1_id}/dispatch"
              payload: {}
              as: BranchOps
              as_user_id: "${b1_id}"
            - call: "POST /logistics-jobs/${job1_id}/complete"
              payload: {}
              as: BranchOps
              as_user_id: "${b1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-15T00:00:00Z" }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
            - call: "POST /logistics-jobs"
              payload: { lease_id: "${l1_id}", job_type: "TEARDOWN_RETURN", origin_branch_id: "${b1_id}", destination_branch_id: "${b1_id}", scheduled_date: "2027-06-15", mileage_miles: 180, crew_hours: 5.0 }
              as: BranchOps
              as_user_id: "${b1_id}"
              captures: { job2_id: $.data.id }
            - call: "POST /logistics-jobs/${job2_id}/dispatch"
              payload: {}
              as: BranchOps
              as_user_id: "${b1_id}"
            - call: "POST /logistics-jobs/${job2_id}/complete"
              payload: {}
              as: BranchOps
              as_user_id: "${b1_id}"
            - call: "GET /leases/${l1_id}"
              as: LeasingAgent
              as_user_id: "agent-77"
              captures: { l1_v: $.data.version, l1_quoted: $.data.quoted_total_cents }
            - call: "POST /damage-assessments"
              payload: { lease_id: "${l1_id}", unit_id: "${u1_id}", logistics_job_id: "${job2_id}", expected_lease_version: "${l1_v}" }
              as: DamageAssessor
              as_user_id: "inspector-9"
              captures: { da1_id: $.data.id }
            - call: "POST /damage-assessments/${da1_id}/line-items"
              payload: { component: "FLOOR", severity: "MODERATE", quantity: 1, wear_and_tear: false }
              as: DamageAssessor
              as_user_id: "inspector-9"
            - call: "POST /damage-assessments/${da1_id}/line-items"
              payload: { component: "WALL", severity: "MINOR", quantity: 3, wear_and_tear: true }
              as: DamageAssessor
              as_user_id: "inspector-9"
            - call: "POST /damage-assessments/${da1_id}/line-items"
              payload: { component: "HVAC", severity: "SEVERE", quantity: 1, wear_and_tear: false }
              as: DamageAssessor
              as_user_id: "inspector-9"
            - call: "POST /damage-assessments/${da1_id}/submit"
              payload: {}
              as: DamageAssessor
              as_user_id: "inspector-9"
          trigger:
            - call: "POST /damage-assessments/${da1_id}/finalize"
              payload: { condition_grade_after: "C" }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
          assert:
            - "Lease.${l1_id}.monthly_base_rate_cents == 151435"
            - "Lease.${l1_id}.monthly_accessory_rate_cents == 101600"
            - "Lease.${l1_id}.mobilization_fee_cents == 631750"
            - "Lease.${l1_id}.quoted_total_cents == 3668170"
            - "Lease.${l1_id}.actual_vacated_date == \"2027-06-15\""
            - "Lease.${l1_id}.final_settlement_cents == 3864975"
            - "Lease.${l1_id}.final_settlement_cents - Lease.${l1_id}.quoted_total_cents == 196805"
            - "Lease.${l1_id}.billing_status == \"SETTLED\""
            - "Lease.${l1_id}.billed_to_date_cents == 3864975"

      - name: damage_chargeback_provisional_vs_finalized_net
        grounds:
          - calculations.damage_chargeback
          - calculations.damage_line_repair_cost
          - state_machines.DamageAssessment.assessment_draft_to_submitted
          - state_machines.DamageAssessment.assessment_submitted_to_finalized
          - entities.DamageAssessment.fields.gross_damage_cents
          - entities.DamageAssessment.fields.chargeable_cents
        distinguishing_aspect: |
          This dual variant lives in the physical-asset/damage domain on DamageAssessment,
          not in Lease cost accounting: assessor_provisional charges all three line items at
          full repair cost (377150) while finalized_net deducts the 18900-cent wear-and-tear
          allowance and clips at 40% of replacement value, landing on 358250 for identical
          line items.
        test_recipe:
          setup:
            - "Same catalog, customer, unit and lease as lease_charge_total_quoted_projection_vs_settled_actual, torn down on 2027-06-15."
            - "A DRAFT damage assessment carrying exactly three line items: FLOOR/MODERATE/1 (not wear), WALL/MINOR/3 (wear), HVAC/SEVERE/1 (not wear)."
