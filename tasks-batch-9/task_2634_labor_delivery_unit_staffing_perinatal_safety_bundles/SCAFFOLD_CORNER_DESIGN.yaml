          trigger:
            - call: POST /support-person-passes
              payload: { encounter_id: "${enc_id}", person_name: "Imani Boyd", credential_type: "DOULA_CERTIFIED" }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
