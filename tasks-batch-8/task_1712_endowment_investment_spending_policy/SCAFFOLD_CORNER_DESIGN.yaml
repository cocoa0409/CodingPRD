            - { call: "POST /endowment/funds", payload: { pool_id: "${iu_pool}", fund_code: "FIU", fund_name: "Fund IU", endowment_class: QUASI_ENDOWMENT, purpose_restriction: UNRESTRICTED }, as: DevelopmentOfficer, captures: { iu_fund: $.data.id } }
            - { call: "POST /endowment/donors", payload: { donor_name: "D IU", donor_type: INDIVIDUAL }, as: DevelopmentOfficer, captures: { iu_donor: $.data.id } }
            - { call: "POST /endowment/gifts", payload: { fund_id: "${iu_fund}", donor_id: "${iu_donor}", external_ref: "IU1", gift_type: CORPUS, amount_cents: 5000000 }, as: DevelopmentOfficer, captures: { iu_g: $.data.id } }
