          Error-category pair STATE (priority 7, ERR_SESSION_NOT_CAPTURING) vs BUSINESS_SAFETY
          (priority 10, ERR_NO_MATCH_CANDIDATE). A photo whose session is NOT CAPTURE_OPEN AND which
          has no matching candidate must return the higher-priority session-state error, not the
          no-candidate safety error. Different category pair from the state-vs-fiscal instance above.
        test_recipe:
          setup:
            - "Session moved to GALLERY_OPEN (not CAPTURE_OPEN). A photo PH captured while CAPTURE_OPEN remains UNMATCHED; its slate name matches no ENROLLED student (all marked absent), so the safety check would also fail."
          setup_api_calls:
            - call: "POST /api/picture-day-sessions"
              payload: { school_name: "Ivy School", scheduled_date: "2026-05-10T00:00:00Z", gallery_closes_at: "2026-12-31T00:00:00Z", retouch_budget_cents: 0 }
              as: SchoolCoordinator
