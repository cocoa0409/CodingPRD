              payload: { award_cents: 209999, award_rationale: "one cent below the band" }
              as: IDREntity
              as_user_id: "idre-1"
            - call: "POST /dispute-cases/${dc_id}/award"
              payload: { award_cents: 210000, award_rationale: "exactly at the lower band edge" }
              as: IDREntity
              as_user_id: "idre-1"
          assert:
            - "the 209999 attempt returns error_id == ERR_AWARD_OUT_OF_RANGE with HTTP 422 and leaves DisputeCase.${dc_id}.status == IDR_INITIATED with idr_award_cents == null"
            - "the 210000 attempt succeeds: DisputeCase.${dc_id}.status == AWARDED and DisputeCase.${dc_id}.idr_award_cents == 210000"
            - "DisputeCase.${dc_id}.last_offer_cents == 230000 and DisputeCase.${dc_id}.last_counteroffer_cents == 210000 and round_index == 3"
