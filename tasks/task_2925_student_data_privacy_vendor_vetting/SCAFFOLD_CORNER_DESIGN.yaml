      - name: watch_threshold_bites_at_exactly_forty_five_risk_points
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.vendor_risk_score
          - calculations.vendor_privacy_posture
          - complexity_profile.complexity_layers
          - state_machines.DataElementCommitment.ACCEPTED_to_REJECTED
        distinguishing_aspect: |
          The WATCH band is a >= 45 test on a two-decimal quantity, so the boundary must be
          hit exactly: four non-US subprocessors (40) plus accepted GEOLOCATION 7.50 and
          STUDENT_ID 2.50 give sensitivity_load round_half_up(10.00 * 0.5, 2) = 5.00 and a
          risk of exactly 45.00 -> WATCH. Rejecting the STUDENT_ID row drops the load to
          3.75 for 43.75 -> CLEAR. An implementation using > 45 leaves the vendor CLEAR at
          the boundary; one that forgets to re-run the posture after the rejection leaves it
          on WATCH.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; Vendor V (US HQ, breach_notification_hours 48 -> breach_term_penalty 0, no incidents)."
            - "Four DISCLOSED non-US subprocessors, none flagged -> foreign_subprocessor_penalty 40."
            - "ASSESSMENT Application A (max_permitted_tier 4) IN_REVIEW after triage, so it counts in the sensitivity load."
            - "Two commitments are ACCEPTED on review REV: GEOLOCATION (tier 3, 365 days, HARD_DELETE) = 6.00 * 1.25 * 1.00 = 7.50 and STUDENT_ID (tier 2, 90 days, HARD_DELETE) = 2.50 * 1.00 * 1.00 = 2.50."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficeAdmin
            - call: "POST /vendors"
              payload: { legal_name: "Meridian Practice Labs", hq_country_code: "US", breach_notification_hours: 48, data_deletion_days: 30, signed_state_addendum: true, subprocessor_disclosure_complete: true }
              as: PrivacyOfficeAdmin
              captures: { v_id: $.data.id }
            - call: "POST /subprocessors"
              payload: { vendor_id: "${v_id}", name: "Dublin Hosting Ltd", country_code: "IE", data_categories: ["HOSTING"], purpose: "European hosting region for assessment delivery traffic.", sub_breach_notification_hours: 24 }
              as: VendorLiaison
              as_user_id: "${v_id}"
              captures: { sub1_id: $.data.id }
            - call: "POST /subprocessors"
              payload: { vendor_id: "${v_id}", name: "Toronto Analytics Inc", country_code: "CA", data_categories: ["ANALYTICS"], purpose: "Item response analytics and psychometric calibration runs.", sub_breach_notification_hours: 24 }
              as: VendorLiaison
              as_user_id: "${v_id}"
              captures: { sub2_id: $.data.id }
            - call: "POST /subprocessors"
              payload: { vendor_id: "${v_id}", name: "Sydney Support Group", country_code: "AU", data_categories: ["SUPPORT"], purpose: "Follow-the-sun tier two teacher support desk coverage.", sub_breach_notification_hours: 24 }
              as: VendorLiaison
              as_user_id: "${v_id}"
              captures: { sub3_id: $.data.id }
            - call: "POST /subprocessors"
              payload: { vendor_id: "${v_id}", name: "Berlin Mail Relay GmbH", country_code: "DE", data_categories: ["COMMUNICATION"], purpose: "Transactional mail relay for teacher notification digests.", sub_breach_notification_hours: 24 }
              as: VendorLiaison
              as_user_id: "${v_id}"
              captures: { sub4_id: $.data.id }
            - call: "POST /applications"
              payload: { vendor_id: "${v_id}", name: "Meridian Practice", category: "ASSESSMENT", grade_band_low: 6, grade_band_high: 8, sso_protocol: "SAML2", accessibility_conformance_level: "WCAG21_AA", vpat_on_file: true }
              as: PrivacyOfficeAdmin
              captures: { app_id: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "Dana Reyes", employee_number: "EMP-7136", school_code: "MS-04", grade_bands_taught: [6, 7, 8] }
              as: PrivacyOfficeAdmin
              captures: { t_id: $.data.id }
            - call: "POST /privacy-analysts"
              payload: { full_name: "Ana Lopez", credential_level: "SENIOR", review_capacity_minutes: 2400 }
              as: PrivacyOfficeAdmin
              captures: { an1_id: $.data.id }
            - call: "POST /privacy-analysts"
              payload: { full_name: "Lee Park", credential_level: "LEAD", review_capacity_minutes: 2400 }
              as: PrivacyOfficeAdmin
              captures: { an2_id: $.data.id }
            - call: "POST /application-requests"
              payload: { application_id: "${app_id}", requester_teacher_id: "${t_id}", instructional_justification: "Grade seven and eight students use this tool for weekly formative practice aligned to the district scope and sequence, and teachers review item-level results during common planning time to regroup learners and plan targeted reteaching block", requested_data_elements: ["GEOLOCATION", "STUDENT_ID"], student_count_estimate: 300, grade_band_low: 6, grade_band_high: 8 }
              as: Teacher
              as_user_id: "${t_id}"
              captures: { req_id: $.data.id }
            - call: "POST /application-requests/${req_id}/submit"
              payload: {}
              as: Teacher
              as_user_id: "${t_id}"
            - call: "POST /application-requests/${req_id}/triage"
              payload: { disposition: "ACCEPT_FOR_REVIEW" }
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
            - call: "POST /data-practice-reviews"
              payload: { source_request_id: "${req_id}", assigned_analyst_id: "${an1_id}", framework_set: ["FERPA", "COPPA", "PPRA", "STATE_ADDENDUM"], estimated_minutes: 180 }
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
              captures: { rev_id: $.data.id }
            - call: "GET /data-practice-reviews/${rev_id}"
              as: VendorLiaison
              as_user_id: "${v_id}"
              captures: { rv1: $.data.version }
            - call: "POST /data-element-commitments"
              payload: { review_id: "${rev_id}", element_code: "GEOLOCATION", justified_purpose: "Campus-level session mapping for proctored assessment integrity checks.", retention_days: 365, deletion_method: "HARD_DELETE", expected_review_version: "${rv1}" }
              as: VendorLiaison
              as_user_id: "${v_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /data-element-commitments/${c1_id}/decide"
              payload: { disposition: "ACCEPT" }
              as: PrivacyAnalyst
              as_user_id: "${an2_id}"
            - call: "GET /data-practice-reviews/${rev_id}"
              as: VendorLiaison
              as_user_id: "${v_id}"
              captures: { rv2: $.data.version }
            - call: "POST /data-element-commitments"
              payload: { review_id: "${rev_id}", element_code: "STUDENT_ID", justified_purpose: "Roster identity matching for gradebook sync and report cards.", retention_days: 90, deletion_method: "HARD_DELETE", expected_review_version: "${rv2}" }
              as: VendorLiaison
              as_user_id: "${v_id}"
              captures: { c2_id: $.data.id }
          trigger:
            - call: "POST /data-element-commitments/${c2_id}/decide"
              payload: { disposition: "ACCEPT" }
              as: PrivacyAnalyst
              as_user_id: "${an2_id}"
            - call: "GET /vendors/${v_id}"
              as: PrivacyOfficeAdmin
            - call: "POST /data-element-commitments/${c2_id}/decide"
              payload: { disposition: "REJECT" }
              as: PrivacyAnalyst
              as_user_id: "${an2_id}"
            - call: "GET /vendors/${v_id}"
              as: PrivacyOfficeAdmin
          assert:
            - "first trigger call: status == 200 and Application.${app_id}.exposed_sensitivity_points == 10.00"
            - "second trigger call: Vendor.${v_id}.risk_score == 45.00 and privacy_posture == WATCH (>= 45 is inclusive)"
            - "third trigger call: status == 200 and DataElementCommitment.${c2_id}.status == REJECTED"
            - "Application.${app_id}.exposed_sensitivity_points == 7.50 (exactly the GEOLOCATION contribution)"
            - "fourth trigger call: Vendor.${v_id}.risk_score == 43.75 and privacy_posture == CLEAR"
            - "Vendor.${v_id}.flagged_subprocessor_count == 0 (the 40 points come from country_code alone, not from flags)"

      - name: cascading_side_effect_chain_depth
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: review_clear_cascades_four_hops_to_teacher_open_request_count
          rationale: "The N-level chain is already verified end to end there (review -> Application -> ApplicationRequest -> Teacher.open_request_count, with a deliberately untouched sibling request proving the cascade does not over-reach), and commitment_accept_cascades_four_hops_to_vendor_posture covers the second chain plus its ordering sensitivity (risk_score before privacy_posture)."

      - name: dual_variant_calculation_layer
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: review_compliance_provisional_vs_final_diverge
          rationale: "Both variants and the switch delta are asserted there as literals (provisional 60.67 vs final 64.00, delta 3.33), and vendor_risk_live_vs_reauthorization_diverge does the same for the risk pair, so a layer-level restatement would add no new observable."

  - section: consistency_model
