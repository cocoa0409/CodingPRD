      - name: repurchase_window_adjacency_legal_but_settlement_blackout_conflicts
        grounds:
          - calculations.repurchase_period_window
          - errors[ERR_REPURCHASE_PERIOD_WINDOW_CONFLICT]
          - entities.RepurchasePeriod.fields.opens_at
          - entities.RepurchasePeriod.fields.request_cutoff_at
          - entities.RepurchasePeriod.fields.settlement_date
        distinguishing_aspect: |
          Three near-identical windows resolve differently against the same
          sibling: 2026-09-20 overlaps outright, 2026-09-25 abuts legally yet
          still dies on the 5-day post-settlement blackout (buffer_start
          2026-10-05), and 2026-10-05 — exactly buffer_start — is accepted; an
