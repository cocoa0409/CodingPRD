            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo}", cost_type: MATERIAL, base_amount_cents: 1000, charge_date: "2026-08-10" }, as: Auditor, as_user_id: aud-1, captures: { e2: $.data.error_id } }
