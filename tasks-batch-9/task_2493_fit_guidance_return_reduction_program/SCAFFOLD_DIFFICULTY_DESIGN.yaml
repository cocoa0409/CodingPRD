          Pairs a `business_safety` rule (priority 13, ERR_CUSTOMER_RETURN_BLOCKED, 409) against a
          `business_temporal` rule (priority 14, ERR_RETURN_WINDOW_CLOSED, 422) - a different
          error-category pair from the state/business_fiscal pair above - and the response carries
          ERR_CUSTOMER_RETURN_BLOCKED with HTTP 409 even though the line's window closed on
