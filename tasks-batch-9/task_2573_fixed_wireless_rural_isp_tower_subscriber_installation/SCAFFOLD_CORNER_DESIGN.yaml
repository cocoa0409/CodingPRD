            - "HTTP status is 200"
            - "EquipmentAssignment.status == \"RETURNED\", returned_at == \"2026-08-10T00:00:00Z\", return_condition == \"DAMAGED\""
            - "EquipmentAssignment.months_in_service == 0 (8 days / 30 truncates to 0)"
            - "EquipmentAssignment.settlement_cents == 17450 and settlement_basis == \"RENTAL_DAMAGE\""
            - "Subscriber.settlement_balance_cents == 17450 (positive: owed by the subscriber)"
            - "Subscriber.equipment_monthly_charge_cents == 0 now that the unit is no longer DEPLOYED"

      - name: algorithm_threshold_sector_posture_watch_boundary
        claim_type: correct_result
        grounds:
          - calculations.sector_capacity_posture
          - calculations.sector_capacity_posture.constants.WATCH_FRACTION
        excluded_because:
          difficulty_instance: sector_posture_watch_at_exactly_half_the_oversubscription_ceiling
          rationale: |
            The threshold algorithm's only interesting cases are its inclusive boundaries, and the
            §1.8 instance already pins the exact ratio 4.000 == 0.5 * 8.0 transition from NORMAL to
            WATCH together with the derived remaining_allowance_mbps, so a corner-walk repeat would be
            the same request with the same numbers.

      - name: algorithm_tiered_pricing_install_invoice_promotional_credit
        claim_type: correct_result
        grounds:
          - calculations.install_invoice_total
          - calculations.install_invoice_total.constants.REG_RECOVERY_PCT
        excluded_because:
          difficulty_instance: install_invoice_promo_tier_pinned_before_regulatory_recovery_fee
          rationale: |
            The tiered_pricing algorithm is exercised end to end by the §1.8 instance, which selects the
            promo band from the pre-credit subtotal and then applies the regulatory recovery percentage
            to the discounted base; every other tier boundary is a re-run of the same endpoint with a
            different labor band and adds no distinct behaviour.

      - name: algorithm_interval_merge_outage_window_abutment
        claim_type: correct_result
        grounds:
          - validations[priority=15]
          - entities.OutageEvent.fields.started_at
        excluded_because:
          difficulty_instance: outage_windows_may_abut_but_not_share_a_minute_on_one_tower
          rationale: |
            The interval algorithm's discriminating case is the half-open boundary - abutting windows
            allowed, one shared minute rejected - and the §1.8 instance drives both sides of that
            boundary on the same tower in one flow, so a corner instance would only restate it.

      - name: algorithm_decay_function_tower_lease_escalation
        claim_type: correct_result
        grounds:
          - calculations.tower_lease_escalation
          - calculations.tower_lease_escalation.constants.MONTHS_PER_LEASE_YEAR
        excluded_because:
          difficulty_instance: tower_lease_rent_rounded_at_each_anniversary_not_at_the_end
          rationale: |
            The compounding schedule is fully pinned by the §1.8 instance, which asserts the per-year
            rounded rent series and the total_committed_cents that only a round-at-each-anniversary
            implementation can produce; the corner file already covers the independent property that
            the projection ignores how many anniversaries have elapsed.

      - name: dual_variant_divergence_los_desktop_versus_field_survey
        claim_type: variant_divergence
        grounds:
          - calculations.los_qualification_mast_height.variants
          - entities.InstallWorkOrder.fields.recommended_mast_height_m
        excluded_because:
          difficulty_instance: los_desktop_lidar_vs_field_survey_variant_divergence
          rationale: |
            The §1.8 instance already runs the same premise geometry through the DESKTOP_LIDAR variant
            at qualification and the FIELD_SURVEY variant at survey and asserts the divergent mast
            height and mounting band, which is exactly the Variant Divergence obligation; repeating it
            here would duplicate the whole two-stage flow.

      - name: dual_variant_divergence_equipment_settlement_sign_inversion
        claim_type: variant_divergence
        grounds:
          - calculations.equipment_settlement.variants
          - entities.EquipmentAssignment.fields.settlement_cents
        excluded_because:
          difficulty_instance: equipment_settlement_rental_liability_vs_purchase_refund_sign_inversion
          rationale: |
            The RENTAL_LIABILITY / PURCHASE_REFUND divergence needs two subscribers settled at
            identical months_in_service to show the sign inversion, and the §1.8 instance builds exactly
            that pair; the corner file covers the RENTAL damage branch, which the §1.8 flow does not
            touch.

  - section: validations
    instances:
      - name: duplicate_natural_keys_are_rejected_on_all_four_creation_endpoints
        claim_type: violation_to_error
        grounds:
          - validations[priority=14]
          - errors.ERR_DUPLICATE_SITE_CODE
          - errors.ERR_DUPLICATE_CIRCUIT_REF
          - errors.ERR_DUPLICATE_LICENSE_REF
          - errors.ERR_DUPLICATE_TIER_CODE
        distinguishing_aspect: |
          Four different creation endpoints each carry their own uniqueness key and their own 409 code,
          and each one must fire on the key alone even when every other field differs - a shared
          "duplicate" code, or uniqueness scoped to the whole row, would collapse all four.
        test_recipe:
          setup:
            - "One Tower RB-TWR-001, one BackhaulCircuit PF-CIR-8801 on it, one SpectrumLicense CBRS-PAL-4412 and one ServicePlan STD50."
          setup_api_calls:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-001", latitude: 41.2500, longitude: -104.8000, ground_elevation_m: 1200.0, antenna_agl_m: 45.0, lease_landowner_name: "Hartley Ranch LLC", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2023-04-01", lease_term_months: 60 }
              as: NetworkEngineer
              captures: { tower_id: $.data.id }
            - call: "POST /backhaul-circuits"
              payload: { tower_id: "${tower_id}", carrier_name: "Prairie Fiber", circuit_ref: "PF-CIR-8801", committed_mbps: 500, monthly_cost_cents: 120000 }
              as: NetworkEngineer
              captures: { circuit_id: $.data.id }
            - call: "POST /spectrum-licenses"
              payload: { license_ref: "CBRS-PAL-4412", band: "CBRS_3_5GHZ", channel_center_mhz: 3600.0, channel_width_mhz: 100.0, max_eirp_dbm: 47.0, license_area_code: "WY-021", effective_from: "2025-01-01T00:00:00Z", effective_to: "2030-01-01T00:00:00Z" }
              as: NetworkEngineer
              captures: { license_id: $.data.id }
            - call: "POST /service-plans"
              payload: { tier_code: "STD50", downstream_mbps: 50, upstream_mbps: 10, monthly_price_cents: 6999, soft_cap_gb: 600.0, deprioritization_factor: 0.25, sla_uptime_pct: 99.5, sla_credit_method: "SLA_SHORTFALL", equipment_policy: "RENTAL_OR_PURCHASE" }
              as: CapacityPlanner
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-001", latitude: 42.0000, longitude: -105.5000, ground_elevation_m: 1400.0, antenna_agl_m: 30.0, lease_landowner_name: "Other Ranch LLC", lease_monthly_base_rent_cents: 39000, lease_escalator_pct: 0.0300, lease_start_date: "2024-01-01", lease_term_months: 36 }
              as: NetworkEngineer
              captures: { err_site: $.data.error_id }
            - call: "POST /backhaul-circuits"
              payload: { tower_id: "${tower_id}", carrier_name: "Second Carrier", circuit_ref: "PF-CIR-8801", committed_mbps: 200, monthly_cost_cents: 80000 }
              as: NetworkEngineer
              captures: { err_circuit: $.data.error_id }
            - call: "POST /spectrum-licenses"
              payload: { license_ref: "CBRS-PAL-4412", band: "LICENSED_11GHZ", channel_center_mhz: 11000.0, channel_width_mhz: 40.0, max_eirp_dbm: 55.0, license_area_code: "WY-022", effective_from: "2026-01-01T00:00:00Z", effective_to: "2031-01-01T00:00:00Z" }
              as: NetworkEngineer
              captures: { err_license: $.data.error_id }
            - call: "POST /service-plans"
              payload: { tier_code: "STD50", downstream_mbps: 100, upstream_mbps: 20, monthly_price_cents: 9999, soft_cap_gb: 900.0, deprioritization_factor: 0.50, sla_uptime_pct: 99.0, sla_credit_method: "PER_INCIDENT", equipment_policy: "RENTAL_ONLY" }
              as: CapacityPlanner
              captures: { err_plan: $.data.error_id }
          assert:
            - "All four calls return HTTP 409"
            - "${err_site} == \"ERR_DUPLICATE_SITE_CODE\""
            - "${err_circuit} == \"ERR_DUPLICATE_CIRCUIT_REF\" - circuit_ref is unique system-wide, not per tower"
            - "${err_license} == \"ERR_DUPLICATE_LICENSE_REF\""
            - "${err_plan} == \"ERR_DUPLICATE_TIER_CODE\""
            - "No second Tower, BackhaulCircuit, SpectrumLicense or ServicePlan row was created"

      - name: outage_closure_with_ended_at_equal_to_started_at_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=15]
          - errors.ERR_INTERVAL_INVALID
          - entities.OutageEvent.fields.ended_at
        distinguishing_aspect: |
          The outage window is half-open, so a zero-length window is not a legal degenerate interval:
          ended_at must be strictly after started_at, and an implementation that accepts equality would
          store duration_minutes 0 and then deny the credit with BELOW_MINIMUM_DURATION instead of
          refusing the closure with 409.
        test_recipe:
          setup:
            - "One Tower RB-TWR-001 with one OPEN OutageEvent started at 2026-08-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-001", latitude: 41.2500, longitude: -104.8000, ground_elevation_m: 1200.0, antenna_agl_m: 45.0, lease_landowner_name: "Hartley Ranch LLC", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2023-04-01", lease_term_months: 60 }
              as: NetworkEngineer
              captures: { tower_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: NetworkEngineer
            - call: "POST /outage-events"
              payload: { tower_id: "${tower_id}", cause: "EQUIPMENT", started_at: "2026-08-05T00:00:00Z" }
              as: NetworkEngineer
              captures: { outage_id: $.data.id }
          trigger:
            - call: "POST /outage-events/${outage_id}/closure"
              payload: { ended_at: "2026-08-05T00:00:00Z" }
              as: NetworkEngineer
              captures: { err_interval: $.data.error_id }
          assert:
            - "HTTP status is 409 and ${err_interval} == \"ERR_INTERVAL_INVALID\""
            - "OutageEvent.status is still \"OPEN\", ended_at is still null and duration_minutes is still null"
            - "OutageEvent.version is unchanged"

      - name: coordination_between_two_sectors_of_the_same_tower_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=13]
          - errors.ERR_SAME_TOWER_COORDINATION
          - entities.InterferenceCoordination.fields.neighbor_sector_id
        distinguishing_aspect: |
          Interference coordination is an inter-site protocol, so the referential check compares the two
          sectors' tower_id rather than their ids: two distinct, both-ACTIVE sectors on one tower are
          still refused with 422. The proposal is deliberately clean on the priority-10 licence checks
          (EIRP 44.0 <= 47.0, channel 3563.0-3567.0 inside 3550.0-3650.0) and the azimuth separation is
          180 degrees so the guard-band rule does not apply - only the same-tower rule can fire.
        test_recipe:
          setup:
            - "ACTIVE Tower RB-TWR-001 with two ACTIVE sectors on the same licence: S1 at azimuth 90.0 on 3555.0/10.0 and S2 at azimuth 270.0 on 3620.0/10.0."
          setup_api_calls:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-001", latitude: 41.2500, longitude: -104.8000, ground_elevation_m: 1200.0, antenna_agl_m: 45.0, lease_landowner_name: "Hartley Ranch LLC", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2023-04-01", lease_term_months: 60 }
              as: NetworkEngineer
              captures: { tower_id: $.data.id }
            - call: "POST /backhaul-circuits"
              payload: { tower_id: "${tower_id}", carrier_name: "Prairie Fiber", circuit_ref: "PF-CIR-8801", committed_mbps: 500, monthly_cost_cents: 120000 }
              as: NetworkEngineer
              captures: { circuit_id: $.data.id }
            - call: "POST /backhaul-circuits/${circuit_id}/state-changes"
              payload: { to_state: "INSTALLED" }
              as: NetworkEngineer
            - call: "POST /backhaul-circuits/${circuit_id}/state-changes"
              payload: { to_state: "ACCEPTED", measured_mbps: 505.0 }
              as: NetworkEngineer
            - call: "POST /towers/${tower_id}/status-changes"
              payload: { to_status: "ACTIVE" }
              as: NetworkEngineer
            - call: "POST /spectrum-licenses"
              payload: { license_ref: "CBRS-PAL-4412", band: "CBRS_3_5GHZ", channel_center_mhz: 3600.0, channel_width_mhz: 100.0, max_eirp_dbm: 47.0, license_area_code: "WY-021", effective_from: "2025-01-01T00:00:00Z", effective_to: "2030-01-01T00:00:00Z" }
              as: NetworkEngineer
              captures: { license_id: $.data.id }
            - call: "POST /sectors"
              payload: { tower_id: "${tower_id}", spectrum_license_id: "${license_id}", azimuth_deg: 90.0, beamwidth_deg: 65.0, channel_center_mhz: 3555.0, channel_width_mhz: 10.0, tx_power_dbm: 25.0, antenna_gain_dbi: 17.0, capacity_mbps: 25, max_oversubscription_ratio: 8.0 }
              as: NetworkEngineer
              captures: { sector1_id: $.data.id }
            - call: "POST /sectors/${sector1_id}/activation"
              payload: {}
              as: NetworkEngineer
            - call: "POST /sectors"
              payload: { tower_id: "${tower_id}", spectrum_license_id: "${license_id}", azimuth_deg: 270.0, beamwidth_deg: 65.0, channel_center_mhz: 3620.0, channel_width_mhz: 10.0, tx_power_dbm: 25.0, antenna_gain_dbi: 17.0, capacity_mbps: 25, max_oversubscription_ratio: 8.0 }
              as: NetworkEngineer
              captures: { sector2_id: $.data.id }
            - call: "POST /sectors/${sector2_id}/activation"
              payload: {}
              as: NetworkEngineer
          trigger:
            - call: "POST /interference-coordinations"
              payload: { requesting_sector_id: "${sector1_id}", neighbor_sector_id: "${sector2_id}", proposed_channel_center_mhz: 3565.0, proposed_channel_width_mhz: 10.0, proposed_eirp_dbm: 44.0, guard_band_mhz: 2.0, effective_from: "2026-08-15T00:00:00Z" }
              as: NetworkEngineer
              captures: { err_same_tower: $.data.error_id }
          assert:
            - "HTTP status is 422 and ${err_same_tower} == \"ERR_SAME_TOWER_COORDINATION\""
            - "No InterferenceCoordination row exists for either sector"
            - "Both sectors keep their channel, tx_power_dbm and version unchanged"

      - name: licence_envelope_is_enforced_on_power_on_channel_and_on_effectivity
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors.ERR_EIRP_EXCEEDS_LICENSE
          - errors.ERR_CHANNEL_OUTSIDE_LICENSE
          - errors.ERR_LICENSE_NOT_EFFECTIVE
          - entities.SpectrumLicense.fields.lower_edge_mhz
        distinguishing_aspect: |
          The three licence rules guard three different quantities and two different endpoints: EIRP is
          the computed sum tx_power_dbm + antenna_gain_dbi (35.0 + 17.0 = 52.0 against a 47.0 ceiling,
          not the raw tx power), the channel test compares computed edges against the licence edges
          (3540.0 falls below the licence's 3550.0 even though the centre 3545.0 sits inside the
          licence band), and effectivity is checked against the logical clock only at activation, so a
          sector may be created on a licence that does not start until 2027 but may not be turned on.
        test_recipe:
          setup:
            - "ACTIVE Tower RB-TWR-001; SpectrumLicense A CBRS-PAL-4412 effective 2025-01-01 to 2030-01-01 with centre 3600.0 width 100.0 (edges 3550.0-3650.0) and max_eirp_dbm 47.0."
            - "SpectrumLicense B CBRS-PAL-9001, identical band and ceiling but effective only from 2027-01-01, plus a PLANNED Sector S_B created on licence B while the clock is 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-001", latitude: 41.2500, longitude: -104.8000, ground_elevation_m: 1200.0, antenna_agl_m: 45.0, lease_landowner_name: "Hartley Ranch LLC", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2023-04-01", lease_term_months: 60 }
              as: NetworkEngineer
              captures: { tower_id: $.data.id }
            - call: "POST /backhaul-circuits"
              payload: { tower_id: "${tower_id}", carrier_name: "Prairie Fiber", circuit_ref: "PF-CIR-8801", committed_mbps: 500, monthly_cost_cents: 120000 }
              as: NetworkEngineer
