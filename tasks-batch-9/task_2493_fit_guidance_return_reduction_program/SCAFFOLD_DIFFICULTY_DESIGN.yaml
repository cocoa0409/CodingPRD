  - rule_id: boundary_precision_check
    instances:
      - name: grade_tolerance_equality_verifies_specification
        grounds:
          - calculations.spec_grade_tolerance_verification
          - entities.MeasurementSpec.fields.tolerance_applied_mm
          - state_machines.MeasurementSpec.SUBMITTED_to_VERIFIED
        distinguishing_aspect: |
          Boundary metric: the resolved grade tolerance in whole millimetres on
          POST /fit-program/measurement-specs/{id}/verify. The M->L chest delta is 45 against a
          declared increment of 40, so |45 - 40| == 5 exactly equals the resolved tolerance of
          5 mm; the comparison is strict >, so the specification VERIFIES with violation_count 0.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "Vendor EDGE at reliability 10000 with a 10000-cent correction budget and one LISTED TOPS item."
            - "A SUBMITTED RIGID specification with 5 size points whose chest deltas are 40, 40, 45, 40 and a single CHEST grade rule of increment 40, tolerance_pct_bp 1250 and tolerance_abs_mm 3, resolving to a 5 mm tolerance: max(3, round_half_up(1250 * 40 / 10000) = 5) = 5, capped at 25, times the RIGID multiplier 100 percent, floored."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/vendors"
