      - name: member_activation_without_a_conflict_declaration_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.CommitteeMember.INVITED_to_ACTIVE
          - errors[ERR_COI_NOT_DECLARED]
          - validations[priority=17]
        distinguishing_aspect: |
          INVITED -> ACTIVE carries exactly one precondition: a
          ConflictDeclaration on file. Violating it yields HTTP 409
          ERR_COI_NOT_DECLARED, and coi_declaration_status must stay PENDING -
          the declared side effect (coi_declaration_status := SUBMITTED) may not
          fire on a rejected transition.
        test_recipe:
          setup:
            - "Clock 2026-01-05T00:00:00Z; Conference GOS26 with reviewer Rui INVITED and no ConflictDeclaration rows at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ConferenceAdmin
            - call: "POST /conferences"
              payload: { name: "Global Oncology Summit 2026", code: "GOS26", event_start_utc: "2026-09-01T08:00:00Z", event_end_utc: "2026-09-03T18:00:00Z", abstract_deadline_utc: "2026-03-01T23:59:00Z", review_deadline_utc: "2026-05-01T23:59:00Z", program_freeze_utc: "2026-08-15T00:00:00Z", oral_slot_capacity: 3, poster_slot_capacity: 2, workshop_slot_capacity: 1, cme_minutes_pool_total: 600 }
              as: ConferenceAdmin
              captures: { conf_id: "$.data.id" }
            - call: "POST /committee-members"
              payload: { conference_id: "${conf_id}", full_name: "Rui Alvarez", email: "rui@panel.example", member_role: "REVIEWER", expertise_keywords: ["oncology", "imaging"], max_review_load: 4, calibration_bias: 0.00 }
              as: ConferenceAdmin
              captures: { mb_r1_id: "$.data.id" }
          trigger:
            - call: "POST /committee-members/${mb_r1_id}/status-transitions"
              payload: { to_status: "ACTIVE" }
              as: Reviewer
              as_user_id: "${mb_r1_id}"
              captures: { err: "$.data.error_id" }
            - call: "GET /committee-members/${mb_r1_id}"
              as: ConferenceAdmin
              captures: { st_after: "$.data.status", coi_after: "$.data.coi_declaration_status" }
          assert:
            - "HTTP 409"
            - "error_id == ERR_COI_NOT_DECLARED"
            - "CommitteeMember.${mb_r1_id}.status == INVITED"
            - "CommitteeMember.${mb_r1_id}.coi_declaration_status == PENDING"

