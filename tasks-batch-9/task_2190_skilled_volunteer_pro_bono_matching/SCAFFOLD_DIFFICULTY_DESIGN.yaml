# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Difficulty level: beyond_expert
# Primary archetype: multi_party_negotiation / secondary: quota_allocation
# Complexity layers: selector_policy, dual_variant_calculation, cascading_side_effects,
#                    optimistic_concurrency, rate_threshold_triggers
#
# Canonical world used by most recipes (drives empty-DB -> a live engagement):
#   ProgramCycle  2026-Q1 [2026-01-01T00:00:00Z, 2026-04-01T00:00:00Z), capacity_slot_total 10
#   PartnerOrg    annual_budget_usd 12000000.00 -> capacity_class LARGE, max_concurrent_engagements 6
#   Volunteer     SENIOR, professional_rate_usd_per_hour 150.00 (MARKET_RATE_CAP 320.00)
#   Window        [2026-01-05T00:00:00Z, 2026-03-01T00:00:00Z) HARD, hours_offered 300.00
#   Clock         set to 2026-01-10T00:00:00Z before any request is created
# Every numeric literal in `assert:` was produced by executing the §1.4 formula and its
# `constants:` as code; no assertion contains an unevaluated expression.

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: valuation_market_rate_vs_independent_sector
        grounds:
          - calculations.volunteer_hour_valuation
          - calculations.engagement_admin_overhead
          - entities.ValuationRecord.fields.base_amount_usd
          - entities.ValuationRecord.fields.hours_included
          - state_machines.Engagement.valuation_status.UNVALUED_to_PROVISIONAL
          - concurrency_rules[valuation-post-stale-engagement]
        distinguishing_aspect: |
          This instance is cost accounting on the Engagement/ValuationRecord domain: for one identical
          set of three approved TimeLog rows (DELIVERY 7.25h, ADMIN 3.50h, TRAVEL 2.00h at a
          rate_basis_usd of 150.00) the MARKET_RATE variant drops the TRAVEL line entirely, halves the
          ADMIN line via CLASS_FACTOR 0.50 and rounds per line before summing to base_amount_usd
          1350.00 over hours_included 10.75, while INDEPENDENT_SECTOR admits all three classes, sums
          hours first to 12.75 and rounds once at the flat 34.79 rate to base_amount_usd 443.57 - so
          the two records disagree on both hours_included and base_amount_usd from identical inputs.
        test_recipe:
          setup:
            - "Cycle 2026-Q1 open with 10 slots; LARGE partner; SENIOR volunteer at 150.00/h, vetted with LEGAL_CONTRACTS proficiency 4 verified."
            - "One HARD availability window [2026-01-05, 2026-03-01) offering 300.00 hours."
            - "One ProjectRequest scoped at estimated_hours 40.00 x complexity_factor 1.00, matched, accepted, agreement executed, engagement started (work_status IN_PROGRESS)."
            - "Three TimeLog rows posted and then approved by a milestone hold: DELIVERY 7.25h, ADMIN 3.50h, TRAVEL 2.00h, each with rate_basis_usd 150.00 snapshotted from the volunteer."
            - "Logical clock at 2026-01-19T00:00:00Z (exactly Milestone.due_at - CHECKIN_GRACE_HOURS)."
          setup_api_calls:
            - call: "POST /program-cycles"
              payload: { cycle_code: "2026-Q1", starts_at: "2026-01-01T00:00:00Z", ends_at: "2026-04-01T00:00:00Z", capacity_slot_total: 10 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { cyc: $.data.id }
            - call: "POST /partner-orgs"
              payload: { name: "Harbor Aid", contact_email: "pc1@harboraid.org", sector: "HOUSING", annual_budget_usd: 12000000.00 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { org: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /volunteers"
              payload: { full_name: "Vera Ng", email: "vera@ex.org", professional_rate_usd_per_hour: 150.00, seniority: "SENIOR", weekly_hours_cap: 40 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { vol: $.data.id }
            - call: "POST /volunteers/${vol}/skill-profiles"
              payload: { skill_code: "LEGAL_CONTRACTS", proficiency: 4, years_experience: 10.0 }
              as: Volunteer
              as_user_id: "${vol}"
            - call: "POST /volunteers/${vol}/vet"
              payload: { verify_skill_codes: ["LEGAL_CONTRACTS"] }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /volunteers/${vol}/availability-windows"
              payload: { starts_at: "2026-01-05T00:00:00Z", ends_at: "2026-03-01T00:00:00Z", window_kind: "HARD", hours_offered: 300.00 }
              as: Volunteer
              as_user_id: "${vol}"
              captures: { win: $.data.id }
            - call: "POST /project-requests"
              payload: { partner_org_id: "${org}", cycle_id: "${cyc}", title: "Lease portfolio review", discipline: "LEGAL", required_skill_code: "LEGAL_CONTRACTS", min_proficiency: 3, requested_hours: 40.00, urgency: "ROUTINE" }
              as: PartnerContact
              as_user_id: "${org}"
              captures: { req: $.data.id }
            - call: "POST /project-requests/${req}/submit-for-scoping"
              payload: {}
              as: PartnerContact
              as_user_id: "${org}"
              captures: { req_v: $.data.version }
            - call: "POST /project-requests/${req}/scope-definitions"
              payload: { expected_project_request_version: "${req_v}", estimated_hours: 40.00, complexity_factor: 1.00, confidentiality_tier: "STANDARD", ip_disposition: "ASSIGN_TO_PARTNER" }
              as: ScopingSpecialist
              as_user_id: "ss-1"
              captures: { scope: $.data.id }
            - call: "POST /scope-definitions/${scope}/deliverables"
              payload: { title: "Redlined lease set", sequence_no: 1, weight_pct: 100.00, hours_estimate: 40.00, acceptance_criteria: "All 12 leases redlined and risk-ranked" }
              as: ScopingSpecialist
              as_user_id: "ss-1"
            - call: "POST /scope-definitions/${scope}/approve"
              payload: {}
              as: PartnerContact
              as_user_id: "${org}"
            - call: "POST /project-requests/${req}/match"
              payload: {}
              as: ScopingSpecialist
              as_user_id: "ss-1"
              captures: { offer: $.data.id }
            - call: "POST /match-offers/${offer}/accept"
              payload: {}
              as: Volunteer
              as_user_id: "${vol}"
              captures: { eng: $.data.id, eng_v0: $.data.version }
            - call: "POST /engagements/${eng}/agreements"
              payload: { expected_engagement_version: "${eng_v0}", ip_disposition: "ASSIGN_TO_PARTNER", confidentiality_tier: "STANDARD", indemnity_cap_usd: 10000.00 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { agr: $.data.id }
            - call: "POST /agreements/${agr}/send"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /agreements/${agr}/execute"
              payload: {}
              as: Volunteer
              as_user_id: "${vol}"
            - call: "POST /agreements/${agr}/execute"
              payload: {}
              as: PartnerContact
              as_user_id: "${org}"
            - call: "POST /engagements/${eng}/start"
              payload: {}
              as: Volunteer
              as_user_id: "${vol}"
            - call: "POST /engagements/${eng}/milestones"
              payload: { due_at: "2026-01-20T00:00:00Z" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { ms: $.data.id }
            - call: "POST /engagements/${eng}/time-logs"
              payload: { work_date: "2026-01-12T00:00:00Z", hours: 7.25, activity_class: "DELIVERY" }
              as: Volunteer
              as_user_id: "${vol}"
            - call: "POST /engagements/${eng}/time-logs"
              payload: { work_date: "2026-01-13T00:00:00Z", hours: 3.50, activity_class: "ADMIN" }
              as: Volunteer
              as_user_id: "${vol}"
            - call: "POST /engagements/${eng}/time-logs"
              payload: { work_date: "2026-01-14T00:00:00Z", hours: 2.00, activity_class: "TRAVEL" }
              as: Volunteer
              as_user_id: "${vol}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-19T00:00:00Z" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /milestones/${ms}/hold"
              payload: { reported_cumulative_hours: 12.75 }
              as: ProgramManager
              as_user_id: "pm-1"
          trigger:
            - call: "GET /engagements/${eng}"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { eng_v1: $.data.version }
            - call: "POST /engagements/${eng}/valuations"
              payload: { expected_engagement_version: "${eng_v1}", method: "MARKET_RATE" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { val_mr: $.data.id }
            - call: "GET /engagements/${eng}"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { eng_v2: $.data.version }
            - call: "POST /engagements/${eng}/valuations"
              payload: { expected_engagement_version: "${eng_v2}", method: "INDEPENDENT_SECTOR" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { val_is: $.data.id }
          assert:
            - "ValuationRecord.${val_mr}.method == MARKET_RATE"
            - "ValuationRecord.${val_mr}.hours_included == 10.75"
            - "ValuationRecord.${val_mr}.rate_applied_usd == 150.00"
            - "ValuationRecord.${val_mr}.base_amount_usd == 1350.00"
            - "ValuationRecord.${val_mr}.admin_overhead_usd == 162.00"
            - "ValuationRecord.${val_mr}.total_amount_usd == 1512.00"
            - "ValuationRecord.${val_is}.method == INDEPENDENT_SECTOR"
            - "ValuationRecord.${val_is}.hours_included == 12.75"
            - "ValuationRecord.${val_is}.rate_applied_usd == 34.79"
            - "ValuationRecord.${val_is}.base_amount_usd == 443.57"
            - "ValuationRecord.${val_is}.admin_overhead_usd == 53.23"
            - "ValuationRecord.${val_is}.total_amount_usd == 496.80"
            - "ValuationRecord.${val_mr}.hours_included != ValuationRecord.${val_is}.hours_included"
            - "ValuationRecord.${val_mr}.superseded_at IS NULL"
            - "Volunteer.${vol}.lifetime_valued_usd == 496.80"
            - "Engagement.${eng}.valuation_status == PROVISIONAL"
            - "ValuationRecord.${val_mr}.variant_label == PROVISIONAL and ValuationRecord.${val_is}.variant_label == PROVISIONAL"
      - name: reliability_decay_weighted_vs_lifetime_average
        grounds:
          - calculations.volunteer_reliability_score
          - entities.Volunteer.fields.reliability_score
          - entities.Volunteer.fields.reliability_score_lifetime
          - state_machines.EngagementAgreement.SENT_to_VOIDED
          - state_machines.Engagement.work_status.NOT_STARTED_to_TERMINATED
        distinguishing_aspect: |
          This instance is risk scoring on the Volunteer domain, not cost accounting: two terminal
          engagements with points 0.60 (AGREEMENT_VOIDED, older) and 0.25 (ADMIN, newer) drive
          reliability_score to the DECAY_WEIGHTED value (1.000000*0.25 + 0.850000*0.60)/1.850000 =
          0.4108 while reliability_score_lifetime takes the LIFETIME_AVERAGE (0.60+0.25)/2 = 0.4250,
          so the gating field and the reporting field disagree on the same row by 0.0142.
        test_recipe:
          setup:
            - "Cycle 2026-Q1, LARGE partner, one SENIOR volunteer vetted with LEGAL_CONTRACTS proficiency 4, one window offering 300.00 hours."
            - "Two separate ProjectRequests each scoped at 40.00 x 1.00, matched and accepted, producing two Engagements in work_status NOT_STARTED."
            - "Engagement 1's agreement is sent and then voided directly at clock 2026-01-10T00:00:00Z, terminating it with termination_reason AGREEMENT_VOIDED (base 0.60)."
            - "Clock advanced to 2026-01-12T00:00:00Z, then Engagement 2 terminated with termination_reason ADMIN (base 0.25), so its terminal_at sorts first."
            - "No milestone was ever missed, so missed_checkin_count is 0 on both and points(E) equals base(E)."
