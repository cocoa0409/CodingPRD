          null). Two reports with identical line counts are submitted at the same logical instant
          (2026-08-01) but for different periods; the earlier period must price at 4000 and the
          later at 7000. An implementation that resolves "the card in force now", or that uses
          period_start, or that treats effective_to as inclusive, gets at least one of the two wrong.
