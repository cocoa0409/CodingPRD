              captures: { blk_id: $.data.id }
            - call: "POST /voip/number-blocks/${blk_id}/phone-numbers"
              payload: { line_number: "1001" }
              as: NumberingAdmin
              captures: { pn1_id: $.data.id }
            - call: "POST /voip/number-blocks/${blk_id}/phone-numbers"
              payload: { line_number: "1002" }
              as: NumberingAdmin
              captures: { pn2_id: $.data.id }
            - call: "POST /voip/number-blocks/${blk_id}/phone-numbers"
              payload: { line_number: "1003" }
              as: NumberingAdmin
              captures: { pn3_id: $.data.id }
            - call: "GET /voip/number-blocks/${blk_id}"
              payload: {}
              as: NumberingAdmin
              captures: { blk_v1: $.data.version }
            - call: "POST /voip/number-reservations"
              payload: { block_id: "${blk_id}", account_id: "${acct_id}", purpose: "NEW_LINE", reserved_from: "2026-08-05T00:00:00Z", reserved_until: "2026-08-10T00:00:00Z", expected_number_block_version: "${blk_v1}", number_id: "${pn1_id}" }
              as: NumberingAdmin
              captures: { res1_id: $.data.id }
            - call: "GET /voip/number-blocks/${blk_id}"
              payload: {}
              as: NumberingAdmin
              captures: { blk_v2: $.data.version }
