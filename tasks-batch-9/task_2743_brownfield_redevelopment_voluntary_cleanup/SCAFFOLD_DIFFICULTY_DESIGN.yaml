          trigger:
            - &k_bindS1
              call: "POST /cost-cap-policies/${polS1_id}/bind"
              payload: {}
              as: Insurer
              as_user_id: "${insurer_id}"
              captures: { s1_err: $.data.error_id }
            - &k_bindS2
              call: "POST /cost-cap-policies/${polS2_id}/bind"
              payload: {}
              as: Insurer
              as_user_id: "${insurer_id}"
              captures: { s2_err: $.data.error_id }
          assert:
            - "the first bind returns HTTP 409 with error_id == 'ERR_INVALID_POLICY_STATE' (priority 12 wins over priority 51)"
            - "the first bind does NOT return 'ERR_LIMIT_BELOW_MINIMUM'"
            - "the second bind returns HTTP 422 with error_id == 'ERR_LIMIT_BELOW_MINIMUM', proving the fiscal rule was also violated by the first policy"
            - "CostCapPolicy.${polS1_id}.status == SUPERSEDED and CostCapPolicy.${polS2_id}.status == QUOTED (neither bind mutated state)"
            - "CostCapPolicy.${polS1_id}.limit_cents == 10000000 and CostCapPolicy.${polS2_id}.limit_cents == 10000000"
            - "CostCapPolicy.${polS2_id}.attachment_point_cents == 2392057 >= round_half_up(1714373 * 1.05) == 1800092, so priority 50 was satisfied and could not have produced the error"
            - "RemedialActionPlan.${planS_id}.total_funding_need_cents == 1714373 (unchanged: no policy bound)"

      - name: approve_credited_control_error_precedes_pinned_goal_version
        grounds:
          - validations[21].ERR_CREDITED_CONTROL_MISSING
          - validations[32].ERR_PINNED_GOAL_VERSION_STALE
          - entities.RemedialActionPlan.fields.pinned_cleanup_goal_versions
          - state_machines.RemedialActionPlan.PUBLIC_COMMENT_to_APPROVED
