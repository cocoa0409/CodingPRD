              as: PricingAdmin
              captures: { x1: $.data.id, x1_status: $.data.training_status }
            - call: "GET /price-integrity/price-change-files/${file_a}"
              as: PricingAdmin
              captures: { file_status_before: $.data.status }
            - call: "GET /price-integrity/price-change-lines/${line_1}"
              as: PricingAdmin
              captures: { line_status_before: $.data.line_status }
            - call: "POST /price-integrity/scanner-audits"
              payload: { store_id: "${store_a}", aisle_id: "${aisle_a1}", auditor_associate_id: "${pa1}", audit_type: "ROUTINE", scan_window_start: "2026-08-01T09:00:00Z", scan_window_end: "2026-08-01T10:00:00Z" }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { audit_1: $.data.id, audit_status: $.data.status }
            - call: "POST /price-integrity/promo-signage"
              payload: { store_id: "${store_a}", aisle_id: "${aisle_a1}", sign_code: "SG-001", promo_start_at: "2026-08-02T00:00:00Z", promo_end_at: "2026-08-09T00:00:00Z", disclosure_codes: [] }
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { sign_1: $.data.id, sign_status: $.data.status, sign_state: $.data.compliance_state }
