              as: SchedulingCoordinator
              captures: { coh_id: $.data.id }
            - call: "POST /training/cohorts/${coh_id}/open"
              payload: {}
              as: SchedulingCoordinator
            - call: "POST /training/cohorts/${coh_id}/registrations"
              payload: { learner_email: "w1@x.com", learner_name: "W1" }
              as: SchedulingCoordinator
              captures: { regW1: $.data.id }
            - call: "POST /training/registrations/${regW1}/confirm"
              payload: {}
              as: Learner
              as_user_id: "w1@x.com"
            - call: "POST /training/cohorts/${coh_id}/registrations"
              payload: { learner_email: "w2@x.com", learner_name: "W2" }
              as: SchedulingCoordinator
              captures: { regW2: $.data.id }
          trigger:
            - call: "POST /training/registrations/${regW1}/withdraw"
              payload: {}
