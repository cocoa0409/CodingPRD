        distinguishing_aspect: "The submit transition stamps submitted_at from the logical clock and bumps only the TurnIn's own version — child assets are untouched — and its declared side effect is a permission rather than a field change: the INTAKE -> ASSESSED transition, refused while the turn-in was DRAFT, becomes legal immediately afterwards."
