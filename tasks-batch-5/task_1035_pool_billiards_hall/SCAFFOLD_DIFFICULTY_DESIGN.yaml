              payload: { email: "ov1@x.com", full_name: "OV One", plan_id: "${o1p}" }
              as: Manager
              captures: { o1m: "$.data.id" }
            - call: "POST /v1/tables"
              payload: { table_number: 11, table_type: "POOL_9FT", seat_capacity: 6, hourly_rate_cents: 1200 }
              as: Manager
              captures: { o1t: "$.data.id" }
            - call: "POST /v1/reservations"
              payload: { member_id: "${o1m}", table_id: "${o1t}", start_at: "2026-07-07T10:00:00Z", end_at: "2026-07-07T11:00:00Z", party_size: 2 }
              as: FrontDesk
              captures: { o1r: "$.data.id" }
            - call: "POST /v1/reservations/${o1r}/confirm"
              payload: {}
              as: FrontDesk
          trigger:
