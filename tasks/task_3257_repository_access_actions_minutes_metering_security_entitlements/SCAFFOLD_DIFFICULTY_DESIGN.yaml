  - rule_id: priority_pair_validation_conflict
    instances:
      - name: org_state_vs_seat_fiscal_priority
        grounds:
          - validations[priority=5]
          - validations[priority=14]
          - errors[ERR_ORG_NOT_ACTIVE]
          - errors[ERR_NO_SEATS_AVAILABLE]
        distinguishing_aspect: |
          state vs business_fiscal pair: accepting a collaborator invitation on
          a SUSPENDED org whose enterprise also has zero available seats fails
          both priority 5 (ERR_ORG_NOT_ACTIVE) and priority 14
          (ERR_NO_SEATS_AVAILABLE) — the state error wins.
        test_recipe:
          setup:
            - "Enterprise with purchased_seats=1; seat already consumed by user u1's commit"
            - "Organization SUSPENDED; user u2 invited as outside collaborator (invite created before suspension)"
          setup_api_calls:
            - call: "POST /enterprises"
              payload: { name: "E1", purchased_seats: 1 }
