# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1–§1.7 surface not already covered by §1.8.
# Sections + claim_types come from references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_facility_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Facility, endpoints]
        distinguishing_aspect: "POST /facilities with all required fields returns 201; license_status defaults ACTIVE; bed_count/occupied_bed_count/occupancy_rate_bps/open_deficiency_count all 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /facilities"
              payload: { name: "Sunrise", state_code: "CA", license_number: "CA-100", care_point_rate_cents: 2000 }
              as: Registrar
              captures: { fac_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Facility.${fac_id}.license_status == ACTIVE AND bed_count == 0 AND occupied_bed_count == 0 AND occupancy_rate_bps == 0 AND open_deficiency_count == 0"
            - "Facility.${fac_id}.version == 1"

      - name: get_facility_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_FACILITY_NOT_FOUND]"]
        distinguishing_aspect: "GET /facilities/{id} with a non-existent UUID returns ERR_FACILITY_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /facilities/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Staff
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404 AND response.data.error_id == ERR_FACILITY_NOT_FOUND"

      - name: create_resident_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Resident.fields.full_name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /residents missing full_name returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A facility exists."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Sunset", state_code: "CA", license_number: "CA-101", care_point_rate_cents: 2000 }
              as: Registrar
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /residents"
              payload: { facility_id: "${fac_id}", date_of_birth: "1940-01-01" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400 AND response.data.error_id == ERR_INVALID_REQUEST"

      - name: resident_stay_type_defaults_standard
        claim_type: Defaults
        grounds: [entities.Resident.fields.stay_type]
        distinguishing_aspect: "Omitting stay_type on POST /residents yields stay_type == STANDARD and respite_end_date == null."
        test_recipe:
          setup: ["A facility exists."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Default", state_code: "CA", license_number: "CA-102", care_point_rate_cents: 2000 }
              as: Registrar
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /residents"
              payload: { facility_id: "${fac_id}", full_name: "Default Dan", date_of_birth: "1941-01-01" }
              as: Registrar
              captures: { res_id: $.data.id }
          assert:
            - "Resident.${res_id}.stay_type == STANDARD AND Resident.${res_id}.respite_end_date == null AND Resident.${res_id}.status == PROSPECT"

      - name: respite_without_end_date_returns_invalid_respite_window
        claim_type: Type Constraints
        grounds: ["validations[priority=9]", "errors[ERR_INVALID_RESPITE_WINDOW]"]
        distinguishing_aspect: "stay_type RESPITE without respite_end_date returns ERR_INVALID_RESPITE_WINDOW (422)."
        test_recipe:
          setup: ["A facility exists."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Respite", state_code: "CA", license_number: "CA-103", care_point_rate_cents: 2000 }
              as: Registrar
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /residents"
              payload: { facility_id: "${fac_id}", full_name: "Resp Rose", date_of_birth: "1942-01-01", stay_type: "RESPITE" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422 AND response.data.error_id == ERR_INVALID_RESPITE_WINDOW"

      - name: assessment_adl_out_of_range_returns_invalid_assessment_input
        claim_type: Type Constraints
        grounds: ["validations[priority=7]", "errors[ERR_INVALID_ASSESSMENT_INPUT]", entities.Assessment.fields.adl_bathing]
        distinguishing_aspect: "POST /assessments with adl_bathing 5 (out of 0..4) returns ERR_INVALID_ASSESSMENT_INPUT (422)."
        test_recipe:
          setup: ["A facility and resident exist."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Acuity", state_code: "CA", license_number: "CA-104", care_point_rate_cents: 2000 }
              as: Registrar
              captures: { fac_id: $.data.id }
            - call: "POST /residents"
              payload: { facility_id: "${fac_id}", full_name: "Acuity Al", date_of_birth: "1943-01-01" }
              as: Registrar
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /assessments"
              payload: { resident_id: "${res_id}", adl_bathing: 5, adl_dressing: 1, adl_toileting: 1, adl_transferring: 1, adl_eating: 1, cognition_score: 0, behavior_flags: 0 }
              as: ClinicalDirector
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422 AND response.data.error_id == ERR_INVALID_ASSESSMENT_INPUT"

      - name: emar_record_is_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.MedicationAdministrationRecord]
        distinguishing_aspect: "MedicationAdministrationRecord (common_fields:false) exposes id + created_at but no version/updated_at and has no update endpoint."
        test_recipe:
          setup: ["A resident with an ACTIVE non-controlled order with slot 08:00."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "EmarF", state_code: "CA", license_number: "CA-105", care_point_rate_cents: 2000 }
              as: Registrar
              captures: { fac_id: $.data.id }
            - call: "POST /residents"
              payload: { facility_id: "${fac_id}", full_name: "Emar Ed", date_of_birth: "1944-01-01" }
              as: Registrar
              captures: { res_id: $.data.id }
            - call: "POST /medication-orders"
              payload: { resident_id: "${res_id}", drug_name: "Aspirin", dose: "81 mg", schedule_times: ["08:00"], is_controlled: false }
              as: Nurse
              captures: { mo_id: $.data.id }
          trigger:
            - call: "POST /medication-orders/${mo_id}/administrations"
              payload: { scheduled_time: "08:00", outcome: "GIVEN" }
              as: Nurse
              captures: { emar_id: $.data.id }
          assert:
            - "HTTP status == 201 AND MedicationAdministrationRecord.${emar_id}.resident_id == ${res_id} AND outcome == GIVEN"
            - "MedicationAdministrationRecord.${emar_id} has no version field"

      - name: list_facilities_pagination_envelope
        claim_type: Listing
        grounds: [endpoints, response_envelope]
        distinguishing_aspect: "GET /facilities returns response_type array with pagination fields total_count and has_more in meta/envelope."
        test_recipe:
          setup: ["Two facilities exist."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "P1", state_code: "CA", license_number: "CA-106", care_point_rate_cents: 2000 }
              as: Registrar
            - call: "POST /facilities"
              payload: { name: "P2", state_code: "CA", license_number: "CA-107", care_point_rate_cents: 2000 }
              as: Registrar
          trigger:
            - call: "GET /facilities"
              payload: {}
              as: Staff
          assert:
            - "HTTP status == 200 AND response_type == array"
            - "response includes total_count == 2 AND has_more == false"

      - name: incident_requires_state_report_computed_severe
        claim_type: Computed Fields
        grounds: [entities.IncidentReport.fields.requires_state_report]
        distinguishing_aspect: "A SEVERE incident has requires_state_report == true; a MINOR FALL has requires_state_report == false (computed, input ignored)."
        test_recipe:
          setup: ["A facility and resident exist."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "IncF", state_code: "CA", license_number: "CA-108", care_point_rate_cents: 2000 }
              as: Registrar
              captures: { fac_id: $.data.id }
            - call: "POST /residents"
              payload: { facility_id: "${fac_id}", full_name: "Inc Ivy", date_of_birth: "1945-01-01" }
              as: Registrar
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /incident-reports"
              payload: { resident_id: "${res_id}", incident_type: "FALL", occurred_at: "2026-03-01T08:00:00Z", severity: "SEVERE" }
              as: Nurse
              captures: { inc_sev: $.data.id }
            - call: "POST /incident-reports"
              payload: { resident_id: "${res_id}", incident_type: "FALL", occurred_at: "2026-03-01T09:00:00Z", severity: "MINOR" }
              as: Nurse
              captures: { inc_min: $.data.id }
          assert:
            - "IncidentReport.${inc_sev}.requires_state_report == true"
            - "IncidentReport.${inc_min}.requires_state_report == false"

      - name: create_resident_with_nonexistent_facility_returns_facility_not_found
        claim_type: Parent Relationships
        grounds: ["validations[priority=4]", "errors[ERR_FACILITY_NOT_FOUND]", entities.Resident.fields.facility_id]
        distinguishing_aspect: "POST /residents with a non-existent facility_id FK returns ERR_FACILITY_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /residents"
              payload: { facility_id: "00000000-0000-4000-8000-000000000000", full_name: "Orphan", date_of_birth: "1940-01-01" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404 AND response.data.error_id == ERR_FACILITY_NOT_FOUND"

      - name: duplicate_unit_number_returns_conflict
        claim_type: Type Constraints
        grounds: ["validations[priority=8]", "errors[ERR_DUPLICATE_UNIT_NUMBER]"]
        distinguishing_aspect: "Two units with the same unit_number in one facility: the second returns ERR_DUPLICATE_UNIT_NUMBER (409)."
        test_recipe:
          setup: ["A facility with a unit '110' exists."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "DupF", state_code: "CA", license_number: "CA-109", care_point_rate_cents: 2000 }
              as: Registrar
              captures: { fac_id: $.data.id }
            - call: "POST /facilities/${fac_id}/units"
              payload: { unit_number: "110", wing: "ASSISTED_LIVING", monthly_base_rent_cents: 400000 }
              as: Registrar
          trigger:
            - call: "POST /facilities/${fac_id}/units"
              payload: { unit_number: "110", wing: "MEMORY_CARE", monthly_base_rent_cents: 450000 }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 AND response.data.error_id == ERR_DUPLICATE_UNIT_NUMBER"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: finalize_already_finalized_assessment_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Assessment.DRAFT_to_FINALIZED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Finalizing an already-FINALIZED assessment returns ERR_INVALID_STATE (409); no second supersede side effect."
        test_recipe:
          setup: ["A resident with a FINALIZED assessment."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "SmF", state_code: "CA", license_number: "CA-200", care_point_rate_cents: 2000 }
              as: Registrar
              captures: { fac_id: $.data.id }
            - call: "POST /residents"
              payload: { facility_id: "${fac_id}", full_name: "Sm Resident", date_of_birth: "1940-01-01" }
              as: Registrar
              captures: { res_id: $.data.id, res_v0: $.data.version }
            - call: "POST /assessments"
              payload: { resident_id: "${res_id}", adl_bathing: 2, adl_dressing: 2, adl_toileting: 2, adl_transferring: 2, adl_eating: 2, cognition_score: 0, behavior_flags: 0 }
              as: ClinicalDirector
              captures: { asmt_id: $.data.id }
            - call: "POST /assessments/${asmt_id}/finalize"
              payload: { expected_resident_version: "${res_v0}" }
              as: ClinicalDirector
            - call: "GET /residents/${res_id}"
              payload: {}
              as: Staff
              captures: { res_v1: $.data.version }
          trigger:
            - call: "POST /assessments/${asmt_id}/finalize"
              payload: { expected_resident_version: "${res_v1}" }
              as: ClinicalDirector
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 AND response.data.error_id == ERR_INVALID_STATE"

      - name: cancel_active_agreement_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.MoveInAgreement.DRAFT_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancel is only defined from DRAFT; cancelling an ACTIVE agreement returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A resident with an ACTIVE agreement reserving a unit."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "CancF", state_code: "CA", license_number: "CA-201", care_point_rate_cents: 2000 }
              as: Registrar
              captures: { fac_id: $.data.id }
            - call: "POST /facilities/${fac_id}/units"
              payload: { unit_number: "210", wing: "ASSISTED_LIVING", monthly_base_rent_cents: 400000 }
              as: Registrar
              captures: { unit_id: $.data.id, unit_v0: $.data.version }
            - call: "POST /residents"
              payload: { facility_id: "${fac_id}", full_name: "Canc Cal", date_of_birth: "1939-01-01" }
              as: Registrar
              captures: { res_id: $.data.id }
            - call: "POST /move-in-agreements"
              payload: { resident_id: "${res_id}", unit_id: "${unit_id}", move_in_date: "2026-06-01", community_fee_cents: 0 }
              as: Registrar
              captures: { agr_id: $.data.id }
            - call: "POST /move-in-agreements/${agr_id}/activate"
              payload: { expected_unit_version: "${unit_v0}" }
              as: Registrar
          trigger:
            - call: "POST /move-in-agreements/${agr_id}/cancel"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 AND response.data.error_id == ERR_INVALID_STATE"

      - name: discharged_resident_is_terminal_admit_rejected
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Resident.terminal_states, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Resident DISCHARGED is terminal; admit from DISCHARGED returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A resident fully discharged (single-bed facility lifecycle)."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "TermF", state_code: "CA", license_number: "CA-202", care_point_rate_cents: 2000 }
              as: Registrar
              captures: { fac_id: $.data.id }
            - call: "POST /facilities/${fac_id}/units"
              payload: { unit_number: "220", wing: "ASSISTED_LIVING", monthly_base_rent_cents: 400000 }
              as: Registrar
              captures: { unit_id: $.data.id, unit_v0: $.data.version }
            - call: "POST /residents"
              payload: { facility_id: "${fac_id}", full_name: "Term Tom", date_of_birth: "1936-01-01" }
              as: Registrar
              captures: { res_id: $.data.id, res_v0: $.data.version }
            - call: "POST /assessments"
              payload: { resident_id: "${res_id}", adl_bathing: 1, adl_dressing: 1, adl_toileting: 1, adl_transferring: 1, adl_eating: 1, cognition_score: 0, behavior_flags: 0 }
              as: ClinicalDirector
              captures: { asmt_id: $.data.id }
            - call: "POST /assessments/${asmt_id}/finalize"
              payload: { expected_resident_version: "${res_v0}" }
              as: ClinicalDirector
            - call: "POST /move-in-agreements"
              payload: { resident_id: "${res_id}", unit_id: "${unit_id}", move_in_date: "2026-06-01", community_fee_cents: 0 }
              as: Registrar
              captures: { agr_id: $.data.id }
            - call: "POST /move-in-agreements/${agr_id}/activate"
              payload: { expected_unit_version: "${unit_v0}" }
              as: Registrar
            - call: "POST /residents/${res_id}/admit"
              payload: {}
              as: Registrar
            - call: "POST /residents/${res_id}/initiate-discharge"
              payload: {}
              as: Registrar
            - call: "POST /residents/${res_id}/finalize-discharge"
              payload: { disposition: "OTHER" }
              as: Registrar
          trigger:
            - call: "POST /residents/${res_id}/admit"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 AND response.data.error_id == ERR_INVALID_STATE"

      - name: rescind_discharge_returns_to_admitted
        claim_type: Valid Transition
        grounds: [state_machines.Resident.DISCHARGE_PENDING_to_ADMITTED]
        distinguishing_aspect: "rescind-discharge moves a DISCHARGE_PENDING resident back to ADMITTED (branching revert), bed stays OCCUPIED."
        test_recipe:
          setup: ["A resident in DISCHARGE_PENDING in a single-bed facility."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "ResF", state_code: "CA", license_number: "CA-203", care_point_rate_cents: 2000 }
              as: Registrar
              captures: { fac_id: $.data.id }
            - call: "POST /facilities/${fac_id}/units"
              payload: { unit_number: "230", wing: "ASSISTED_LIVING", monthly_base_rent_cents: 400000 }
              as: Registrar
              captures: { unit_id: $.data.id, unit_v0: $.data.version }
            - call: "POST /residents"
              payload: { facility_id: "${fac_id}", full_name: "Res Rae", date_of_birth: "1937-01-01" }
              as: Registrar
              captures: { res_id: $.data.id, res_v0: $.data.version }
            - call: "POST /assessments"
              payload: { resident_id: "${res_id}", adl_bathing: 1, adl_dressing: 1, adl_toileting: 1, adl_transferring: 1, adl_eating: 1, cognition_score: 0, behavior_flags: 0 }
              as: ClinicalDirector
              captures: { asmt_id: $.data.id }
            - call: "POST /assessments/${asmt_id}/finalize"
              payload: { expected_resident_version: "${res_v0}" }
              as: ClinicalDirector
            - call: "POST /move-in-agreements"
              payload: { resident_id: "${res_id}", unit_id: "${unit_id}", move_in_date: "2026-06-01", community_fee_cents: 0 }
              as: Registrar
              captures: { agr_id: $.data.id }
            - call: "POST /move-in-agreements/${agr_id}/activate"
              payload: { expected_unit_version: "${unit_v0}" }
              as: Registrar
            - call: "POST /residents/${res_id}/admit"
              payload: {}
              as: Registrar
            - call: "POST /residents/${res_id}/initiate-discharge"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /residents/${res_id}/rescind-discharge"
              payload: {}
              as: Registrar
          assert:
            - "Resident.${res_id}.status == ADMITTED"
            - "Unit.${unit_id}.status == OCCUPIED AND current_resident_id == ${res_id}"

      - name: newly_created_resident_starts_prospect
        claim_type: Initial State
        grounds: [state_machines.Resident.initial_state]
        distinguishing_aspect: "A freshly created resident starts in PROSPECT with current_care_points 0 and open_balance_cents 0."
        test_recipe:
          setup: ["A facility exists."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "InitF", state_code: "CA", license_number: "CA-204", care_point_rate_cents: 2000 }
              as: Registrar
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /residents"
              payload: { facility_id: "${fac_id}", full_name: "Init Ida", date_of_birth: "1948-01-01" }
              as: Registrar
              captures: { res_id: $.data.id }
          assert:
            - "Resident.${res_id}.status == PROSPECT AND current_care_points == 0 AND open_balance_cents == 0 AND current_care_level == null"

      - name: care_plan_revision_supersedes_prior_active_self_referential
        claim_type: Valid Transition
        grounds: [state_machines.CarePlan.ACTIVE_to_SUPERSEDED, entities.CarePlan.fields.supersedes_care_plan_id]
        distinguishing_aspect: "Activating a revision CarePlan whose supersedes_care_plan_id names the prior ACTIVE plan flips that prior plan ACTIVE -> SUPERSEDED (self-referential cycle)."
        test_recipe:
          setup: ["A resident with one ACTIVE care plan from a finalized assessment."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "CpF", state_code: "CA", license_number: "CA-205", care_point_rate_cents: 2000 }
              as: Registrar
              captures: { fac_id: $.data.id }
            - call: "POST /residents"
              payload: { facility_id: "${fac_id}", full_name: "Cp Cara", date_of_birth: "1944-01-01" }
              as: Registrar
              captures: { res_id: $.data.id, res_v0: $.data.version }
            - call: "POST /assessments"
              payload: { resident_id: "${res_id}", adl_bathing: 2, adl_dressing: 2, adl_toileting: 2, adl_transferring: 2, adl_eating: 2, cognition_score: 0, behavior_flags: 0 }
              as: ClinicalDirector
              captures: { asmt_id: $.data.id }
            - call: "POST /assessments/${asmt_id}/finalize"
              payload: { expected_resident_version: "${res_v0}" }
              as: ClinicalDirector
            - call: "POST /care-plans"
              payload: { resident_id: "${res_id}", source_assessment_id: "${asmt_id}", adl_support_items: [{ task: "bathing", frequency_per_day: 1 }] }
              as: ClinicalDirector
              captures: { cp1_id: $.data.id }
            - call: "POST /care-plans/${cp1_id}/activate"
              payload: {}
              as: ClinicalDirector
            - call: "POST /care-plans"
              payload: { resident_id: "${res_id}", source_assessment_id: "${asmt_id}", adl_support_items: [{ task: "dressing", frequency_per_day: 2 }], supersedes_care_plan_id: "${cp1_id}" }
              as: ClinicalDirector
              captures: { cp2_id: $.data.id }
          trigger:
            - call: "POST /care-plans/${cp2_id}/activate"
              payload: {}
              as: ClinicalDirector
          assert:
            - "CarePlan.${cp2_id}.status == ACTIVE"
            - "CarePlan.${cp1_id}.status == SUPERSEDED"

      - name: poc_due_date_immediate_jeopardy_window
        claim_type: Side Effect Execution
        grounds: [calculations.poc_due_date, entities.SurveyDeficiency.fields.poc_due_date]
        distinguishing_aspect: "A J_L_IMMEDIATE_JEOPARDY deficiency cited 2026-03-05 has poc_due_date 2026-03-07 (2-day window), vs the 10-day standard window."
        test_recipe:
          setup: ["A facility exists."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "IjF", state_code: "FL", license_number: "FL-205", care_point_rate_cents: 2000 }
              as: ComplianceOfficer
              captures: { fac_id: $.data.id }
          trigger:
