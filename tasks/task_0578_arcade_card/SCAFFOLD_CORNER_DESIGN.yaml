          rationale: "The second play at balance 0 asserts ERR_INSUFFICIENT_CHIP_BALANCE in that §1.8 instance."

      - name: error_attraction_not_open_stub
        claim_type: Cross-entity validation
        grounds: ["errors[ERR_ATTRACTION_NOT_OPEN]"]
        excluded_because:
