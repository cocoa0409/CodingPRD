# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Window-Tint & Vehicle-Wrap Shop — Expert
# 9 rule_ids × 2 instances = 18 instances. Every grounds[] resolves into
# SCAFFOLD.yaml §1.1–§1.7; every test_recipe chain is empty-DB executable
# against §1.5. Numeric asserts are precomputed literals.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: cure_complete_estimated_vs_actual_on_workorder
        grounds:
          - calculations.cure_complete_at
          - state_machines.WorkOrder.SCHEDULED_to_IN_PROGRESS
          - state_machines.WorkOrder.IN_PROGRESS_to_CURING
          - entities.WorkOrder.fields.cure_complete_at
        distinguishing_aspect: >
          The ESTIMATED variant anchors cure_complete_at on scheduled_start+duration
          (2026-06-03T11:00:00Z) while the ACTUAL variant re-anchors it on
          actual_completed_at (2026-06-03T10:45:00Z) — same WorkOrder, two divergent
          datetimes, on the WorkOrder domain (distinct from the Quote-pricing dual variant).
        test_recipe:
          setup:
            - "ShopLocation in CA; StateTintRegulation CA with front_side_min_vlt_pct=35 exists."
            - "ServicePackage TINT_FULL_SEDAN (type TINT, base 28000, dur 120, cure_buffer 0, warranty 365, requires_proof false)."
            - "FilmMaterial CERAMIC_TINT (TINT_FILM, cure_hours 24, mult 14500)."
            - "VehicleProfile sedan owned by customer cust-1; one Bay; one Installer certified TINT."
            - "Quote with a single FULL FRONT_SIDE tint line (requested_vlt_pct 40), PRICED then ACCEPTED."
            - "WorkOrder scheduled at 2026-06-02T09:00:00Z so ESTIMATED cure = 2026-06-03T11:00:00Z."
          setup_api_calls:
            - call: "POST /state-tint-regulations"
              payload: { state_code: "CA", front_side_min_vlt_pct: 35, windshield_strip_max_inches: 5, medical_exemption_allowed: true }
              as: ComplianceOfficer
            - call: "POST /shop-locations"
              payload: { name: "CA Shop", state_code: "CA" }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /service-packages"
              payload: { name: "Tint Full Sedan", service_type: "TINT", base_rate_cents: 28000, duration_minutes: 120, cure_buffer_minutes: 0, warranty_days: 365, requires_proof: false }
              as: ShopManager
              captures: { pkg_id: $.data.id }
            - call: "POST /film-materials"
              payload: { sku: "CER-TINT", category: "TINT_FILM", cure_hours: 24, price_multiplier_bps: 14500 }
              as: ShopManager
              captures: { mat_id: $.data.id }
            - call: "POST /vehicle-profiles"
              payload: { customer_user_id: "cust-1", vin: "VIN-DV-CURE", size_class: "SEDAN" }
              as: ShopManager
              captures: { veh_id: $.data.id }
            - call: "POST /bays"
              payload: { shop_location_id: "${shop_id}", label: "Bay 1" }
              as: ShopManager
              captures: { bay_id: $.data.id }
            - call: "POST /installers"
              payload: { shop_location_id: "${shop_id}", installer_user_id: "inst-1", full_name: "Ivy", certified_service_types: ["TINT"] }
              as: ShopManager
              captures: { inst_id: $.data.id }
            - call: "POST /quotes"
              payload: { vehicle_profile_id: "${veh_id}", shop_location_id: "${shop_id}" }
              as: ShopManager
              captures: { quote_id: $.data.id, quote_v0: $.data.version }
            - call: "POST /quotes/${quote_id}/lines"
              payload: { service_package_id: "${pkg_id}", film_material_id: "${mat_id}", coverage: "FULL", window_position: "FRONT_SIDE", requested_vlt_pct: 40, expected_quote_version: "${quote_v0}" }
              as: ShopManager
              captures: { quote_v1: $.data.version }
            - call: "POST /quotes/${quote_id}/price"
              payload: { expected_quote_version: "${quote_v1}" }
              as: ShopManager
              captures: { quote_v2: $.data.version }
            - call: "POST /quotes/${quote_id}/accept"
              payload: { expected_quote_version: "${quote_v2}" }
              as: Customer
              as_user_id: "cust-1"
              captures: { quote_v3: $.data.version }
            - call: "POST /work-orders"
              payload: { quote_id: "${quote_id}", bay_id: "${bay_id}", installer_id: "${inst_id}", scheduled_start: "2026-06-02T09:00:00Z", expected_quote_version: "${quote_v3}" }
              as: ShopManager
              captures: { wo_id: $.data.id, est_cure: $.data.cure_complete_at }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T09:00:00Z" }
              as: ShopManager
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: Installer
              as_user_id: "inst-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T10:45:00Z" }
              as: ShopManager
          trigger:
            - call: "POST /work-orders/${wo_id}/complete-install"
              payload: {}
              as: Installer
              as_user_id: "inst-1"
              captures: { actual_cure: $.data.cure_complete_at }
          assert:
            - "WorkOrder.${wo_id}.cure_complete_at == '2026-06-03T10:45:00.000Z' (ACTUAL variant)"
            - "the ESTIMATED value captured at scheduling was '2026-06-03T11:00:00.000Z' and differs from the ACTUAL value"
            - "WorkOrder.${wo_id}.warranty_expires_at == '2027-06-02T10:45:00.000Z'"

      - name: fleet_credit_provisional_vs_settled
        grounds:
          - calculations.fleet_available_credit
          - entities.FleetAccount.fields.held_credit_cents
          - state_machines.WorkOrder_payment.DEPOSIT_PAID_to_INVOICED
          - state_machines.WorkOrder.SCHEDULED_to_IN_PROGRESS
        distinguishing_aspect: >
          Same FleetAccount: PROVISIONAL available (5000000 - 94600 = 4905400, counting both
          open orders by install_status) diverges from SETTLED available (5000000 - 40600 =
          4959400, counting only the INVOICED order by payment_status) — dual variant on the
          FleetAccount domain, distinct from the WorkOrder cure dual variant.
        test_recipe:
          setup:
            - "FleetAccount credit_limit 5000000, discount_bps 0, owned by fleet manager fm-1."
            - "Two fleet WorkOrders: WO1 total_due 40600 (tint), WO2 total_due 54000 (ppf partial sedan std)."
            - "Both completed; WO1 invoiced (DEPOSIT_PAID->INVOICED), WO2 only COMPLETED-uninvoiced."
          setup_api_calls:
            - call: "POST /state-tint-regulations"
              payload: { state_code: "TX", front_side_min_vlt_pct: 25, windshield_strip_max_inches: 5, medical_exemption_allowed: false }
              as: ComplianceOfficer
            - call: "POST /shop-locations"
              payload: { name: "TX Shop", state_code: "TX" }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { company_name: "FleetCo", fleet_manager_user_id: "fm-1", discount_bps: 0, credit_limit_cents: 5000000 }
              as: ShopManager
              captures: { fleet_id: $.data.id }
            - call: "POST /service-packages"
              payload: { name: "Tint Full Sedan", service_type: "TINT", base_rate_cents: 28000, duration_minutes: 120, cure_buffer_minutes: 0, warranty_days: 365, requires_proof: false }
              as: ShopManager
              captures: { pkg_tint: $.data.id }
            - call: "POST /service-packages"
              payload: { name: "PPF Partial", service_type: "PPF", base_rate_cents: 90000, duration_minutes: 180, cure_buffer_minutes: 30, warranty_days: 365, requires_proof: false }
              as: ShopManager
              captures: { pkg_ppf: $.data.id }
            - call: "POST /film-materials"
              payload: { sku: "CER-TINT2", category: "TINT_FILM", cure_hours: 24, price_multiplier_bps: 14500 }
              as: ShopManager
              captures: { mat_tint: $.data.id }
            - call: "POST /film-materials"
              payload: { sku: "PPF-STD", category: "PPF_FILM", cure_hours: 48, price_multiplier_bps: 10000 }
              as: ShopManager
              captures: { mat_ppf: $.data.id }
            - call: "POST /vehicle-profiles"
              payload: { customer_user_id: "cust-2", vin: "VIN-FLEET-1", size_class: "SEDAN" }
              as: ShopManager
              captures: { veh1: $.data.id }
            - call: "POST /vehicle-profiles"
              payload: { customer_user_id: "cust-2", vin: "VIN-FLEET-2", size_class: "SEDAN" }
              as: ShopManager
              captures: { veh2: $.data.id }
            - call: "POST /bays"
              payload: { shop_location_id: "${shop_id}", label: "Bay 1" }
              as: ShopManager
              captures: { bay1: $.data.id }
            - call: "POST /bays"
              payload: { shop_location_id: "${shop_id}", label: "Bay 2" }
              as: ShopManager
              captures: { bay2: $.data.id }
            - call: "POST /installers"
              payload: { shop_location_id: "${shop_id}", installer_user_id: "inst-2a", full_name: "Ivan", certified_service_types: ["TINT", "PPF"] }
              as: ShopManager
              captures: { inst2: $.data.id }
            - call: "POST /installers"
              payload: { shop_location_id: "${shop_id}", installer_user_id: "inst-2b", full_name: "Iva", certified_service_types: ["TINT", "PPF"] }
              as: ShopManager
              captures: { inst2b: $.data.id }
            - call: "POST /quotes"
              payload: { vehicle_profile_id: "${veh1}", shop_location_id: "${shop_id}", fleet_account_id: "${fleet_id}" }
              as: ShopManager
              captures: { q1: $.data.id, q1v0: $.data.version }
            - call: "POST /quotes/${q1}/lines"
              payload: { service_package_id: "${pkg_tint}", film_material_id: "${mat_tint}", coverage: "FULL", window_position: "FRONT_SIDE", requested_vlt_pct: 50, expected_quote_version: "${q1v0}" }
              as: ShopManager
              captures: { q1v1: $.data.version }
            - call: "POST /quotes/${q1}/price"
              payload: { expected_quote_version: "${q1v1}" }
              as: ShopManager
              captures: { q1v2: $.data.version }
            - call: "POST /quotes/${q1}/accept"
              payload: { expected_quote_version: "${q1v2}" }
              as: Customer
              as_user_id: "cust-2"
              captures: { q1v3: $.data.version }
            - call: "POST /work-orders"
              payload: { quote_id: "${q1}", bay_id: "${bay1}", installer_id: "${inst2}", scheduled_start: "2026-06-02T09:00:00Z", expected_quote_version: "${q1v3}" }
              as: ShopManager
              captures: { wo1: $.data.id }
            - call: "POST /quotes"
              payload: { vehicle_profile_id: "${veh2}", shop_location_id: "${shop_id}", fleet_account_id: "${fleet_id}" }
              as: ShopManager
              captures: { q2: $.data.id, q2v0: $.data.version }
            - call: "POST /quotes/${q2}/lines"
              payload: { service_package_id: "${pkg_ppf}", film_material_id: "${mat_ppf}", coverage: "PARTIAL", window_position: "BODY_PANEL", expected_quote_version: "${q2v0}" }
              as: ShopManager
              captures: { q2v1: $.data.version }
            - call: "POST /quotes/${q2}/price"
              payload: { expected_quote_version: "${q2v1}" }
              as: ShopManager
              captures: { q2v2: $.data.version }
            - call: "POST /quotes/${q2}/accept"
              payload: { expected_quote_version: "${q2v2}" }
              as: Customer
              as_user_id: "cust-2"
              captures: { q2v3: $.data.version }
            - call: "POST /work-orders"
              payload: { quote_id: "${q2}", bay_id: "${bay2}", installer_id: "${inst2b}", scheduled_start: "2026-06-02T09:00:00Z", expected_quote_version: "${q2v3}" }
              as: ShopManager
              captures: { wo2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T09:00:00Z" }
              as: ShopManager
            - call: "POST /work-orders/${wo1}/start"
              payload: {}
              as: Installer
              as_user_id: "inst-2a"
            - call: "POST /work-orders/${wo1}/complete-install"
              payload: {}
              as: Installer
              as_user_id: "inst-2a"
            - call: "POST /work-orders/${wo2}/start"
              payload: {}
              as: Installer
              as_user_id: "inst-2b"
            - call: "POST /work-orders/${wo2}/complete-install"
              payload: {}
              as: Installer
              as_user_id: "inst-2b"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: ShopManager
            - call: "POST /work-orders/${wo1}/release"
              payload: {}
              as: ShopManager
            - call: "POST /work-orders/${wo2}/release"
              payload: {}
              as: ShopManager
            - call: "POST /work-orders/${wo1}/pay-deposit"
              payload: { amount_cents: 10150 }
              as: Customer
              as_user_id: "cust-2"
            - call: "POST /work-orders/${wo1}/invoice"
              payload: {}
              as: ShopManager
          trigger:
            - call: "GET /fleet-accounts/${fleet_id}"
              payload: {}
              as: FleetManager
              as_user_id: "fm-1"
              captures: { held: $.data.held_credit_cents }
          assert:
            - "FleetAccount.${fleet_id}.held_credit_cents == 94600 (PROVISIONAL: both COMPLETED orders 40600+54000)"
            - "SETTLED-available view counts only the INVOICED WO1 (40600), giving 4959400, which diverges from PROVISIONAL-available 4905400"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: quote_discount_sum_then_round_order
        grounds:
          - calculations.quote_total
          - entities.Quote.fields.discount_cents
          - entities.Quote.fields.subtotal_cents
          - state_machines.Quote.DRAFT_to_PRICED
        distinguishing_aspect: >
          Mode (b): the fleet discount is rounded once on the SUM (round_half_up(94600*777/10000)=7350),
          not per-line (round(40600*777/10000)+round(54000*777/10000)=2654+4697=7351). The two
          orders differ by one cent; the scaffold pins sum-then-round.
        test_recipe:
          setup:
            - "FleetAccount discount_bps 777, credit_limit large, owner fm-3."
            - "Quote with two INCLUDED lines: line A total 40600 (tint full sedan ceramic), line B total 54000 (ppf partial sedan std), not rushed."
          setup_api_calls:
            - call: "POST /state-tint-regulations"
              payload: { state_code: "NV", front_side_min_vlt_pct: 35, windshield_strip_max_inches: 5, medical_exemption_allowed: false }
              as: ComplianceOfficer
            - call: "POST /shop-locations"
              payload: { name: "NV Shop", state_code: "NV" }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { company_name: "RoundCo", fleet_manager_user_id: "fm-3", discount_bps: 777, credit_limit_cents: 100000000 }
              as: ShopManager
              captures: { fleet_id: $.data.id }
            - call: "POST /service-packages"
              payload: { name: "Tint Full Sedan", service_type: "TINT", base_rate_cents: 28000, duration_minutes: 120, cure_buffer_minutes: 0, warranty_days: 365, requires_proof: false }
              as: ShopManager
              captures: { pkg_tint: $.data.id }
            - call: "POST /service-packages"
              payload: { name: "PPF Partial", service_type: "PPF", base_rate_cents: 90000, duration_minutes: 180, cure_buffer_minutes: 30, warranty_days: 365, requires_proof: false }
              as: ShopManager
              captures: { pkg_ppf: $.data.id }
            - call: "POST /film-materials"
              payload: { sku: "CER-NV", category: "TINT_FILM", cure_hours: 24, price_multiplier_bps: 14500 }
              as: ShopManager
              captures: { mat_tint: $.data.id }
            - call: "POST /film-materials"
              payload: { sku: "PPF-NV", category: "PPF_FILM", cure_hours: 48, price_multiplier_bps: 10000 }
              as: ShopManager
              captures: { mat_ppf: $.data.id }
            - call: "POST /vehicle-profiles"
              payload: { customer_user_id: "cust-3", vin: "VIN-ROUND", size_class: "SEDAN" }
              as: ShopManager
              captures: { veh: $.data.id }
            - call: "POST /quotes"
              payload: { vehicle_profile_id: "${veh}", shop_location_id: "${shop_id}", fleet_account_id: "${fleet_id}", rushed: false }
              as: ShopManager
              captures: { q: $.data.id, qv0: $.data.version }
            - call: "POST /quotes/${q}/lines"
              payload: { service_package_id: "${pkg_tint}", film_material_id: "${mat_tint}", coverage: "FULL", window_position: "REAR_SIDE", requested_vlt_pct: 50, expected_quote_version: "${qv0}" }
              as: ShopManager
              captures: { qv1: $.data.version }
            - call: "POST /quotes/${q}/lines"
              payload: { service_package_id: "${pkg_ppf}", film_material_id: "${mat_ppf}", coverage: "PARTIAL", window_position: "BODY_PANEL", expected_quote_version: "${qv1}" }
              as: ShopManager
              captures: { qv2: $.data.version }
          trigger:
            - call: "POST /quotes/${q}/price"
              payload: { expected_quote_version: "${qv2}" }
              as: ShopManager
              captures: { sub: $.data.subtotal_cents, disc: $.data.discount_cents, net: $.data.net_cents }
          assert:
            - "Quote.${q}.subtotal_cents == 94600"
            - "Quote.${q}.discount_cents == 7350 (sum-then-round, NOT the per-line 7351)"
            - "Quote.${q}.net_cents == 87250"
            - "Quote.${q}.total_due_cents == 87250"
            - "Quote.${q}.deposit_required_cents == 21813"

      - name: rush_fee_circular_net_tier
        grounds:
          - calculations.quote_total
          - entities.Quote.fields.rush_fee_cents
          - entities.Quote.fields.net_cents
          - state_machines.Quote.DRAFT_to_PRICED
        distinguishing_aspect: >
          Mode (c): rush_fee depends on net_cents, which depends on discount, which depends on
          subtotal — a circular-looking chain pinned to evaluate subtotal->discount->net->rush.
          At net==100000 rush_bps=500 (rush 5000); the order is well-defined only because the
          tier is read off the already-computed net. Distinct mode from the sum-then-round instance.
        test_recipe:
          setup:
            - "Retail (no fleet) quote, rushed=true, single line total 100000 so net==100000 exactly (>= boundary)."
          setup_api_calls:
            - call: "POST /state-tint-regulations"
              payload: { state_code: "AZ", front_side_min_vlt_pct: 33, windshield_strip_max_inches: 5, medical_exemption_allowed: false }
              as: ComplianceOfficer
            - call: "POST /shop-locations"
              payload: { name: "AZ Shop", state_code: "AZ" }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /service-packages"
              payload: { name: "Big Wrap", service_type: "WRAP", base_rate_cents: 100000, duration_minutes: 240, cure_buffer_minutes: 60, warranty_days: 730, requires_proof: true }
              as: ShopManager
              captures: { pkg: $.data.id }
            - call: "POST /film-materials"
              payload: { sku: "VINYL-AZ", category: "WRAP_VINYL", cure_hours: 12, price_multiplier_bps: 10000 }
              as: ShopManager
              captures: { mat: $.data.id }
            - call: "POST /vehicle-profiles"
              payload: { customer_user_id: "cust-4", vin: "VIN-RUSH", size_class: "SEDAN" }
              as: ShopManager
              captures: { veh: $.data.id }
            - call: "POST /quotes"
              payload: { vehicle_profile_id: "${veh}", shop_location_id: "${shop_id}", rushed: true }
              as: ShopManager
              captures: { q: $.data.id, qv0: $.data.version }
            - call: "POST /quotes/${q}/lines"
              payload: { service_package_id: "${pkg}", film_material_id: "${mat}", coverage: "FULL", window_position: "BODY_PANEL", expected_quote_version: "${qv0}" }
              as: ShopManager
              captures: { qv1: $.data.version }
          trigger:
            - call: "POST /quotes/${q}/price"
              payload: { expected_quote_version: "${qv1}" }
              as: ShopManager
              captures: { net: $.data.net_cents, rush: $.data.rush_fee_cents }
          assert:
            - "Quote.${q}.net_cents == 100000"
            - "Quote.${q}.rush_fee_cents == 5000 (rush_bps 500 because net >= 100000)"
            - "Quote.${q}.total_due_cents == 105000"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: wrap_proof_revision_cycle
        grounds:
          - state_machines.WrapProof.PROOF_SUBMITTED_to_CHANGES_REQUESTED
          - state_machines.WrapProof.CHANGES_REQUESTED_to_PROOF_SUBMITTED
          - entities.WrapProof.fields.revision_round
        distinguishing_aspect: >
          WrapProof is cyclic: PROOF_SUBMITTED -> CHANGES_REQUESTED -> (new) PROOF_SUBMITTED with
          revision_round incrementing 1 -> 2; the loop returns to a prior state, unlike any linear
          pipeline. This cycle is on the WrapProof entity (distinct from the parallel-dimension WorkOrder).
        test_recipe:
          setup:
            - "A scheduled WorkOrder whose primary package requires_proof (WRAP)."
            - "Initial WrapProof submitted (revision_round 1), customer requests changes, installer resubmits."
          setup_api_calls:
            - call: "POST /state-tint-regulations"
              payload: { state_code: "OR", front_side_min_vlt_pct: 35, windshield_strip_max_inches: 6, medical_exemption_allowed: false }
              as: ComplianceOfficer
            - call: "POST /shop-locations"
              payload: { name: "OR Shop", state_code: "OR" }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /service-packages"
              payload: { name: "Wrap Full", service_type: "WRAP", base_rate_cents: 120000, duration_minutes: 240, cure_buffer_minutes: 60, warranty_days: 730, requires_proof: true }
              as: ShopManager
              captures: { pkg: $.data.id }
            - call: "POST /film-materials"
              payload: { sku: "VINYL-OR", category: "WRAP_VINYL", cure_hours: 12, price_multiplier_bps: 12000 }
              as: ShopManager
              captures: { mat: $.data.id }
            - call: "POST /vehicle-profiles"
              payload: { customer_user_id: "cust-5", vin: "VIN-PROOF", size_class: "SEDAN" }
              as: ShopManager
              captures: { veh: $.data.id }
            - call: "POST /bays"
              payload: { shop_location_id: "${shop_id}", label: "Bay 1" }
              as: ShopManager
              captures: { bay: $.data.id }
            - call: "POST /installers"
              payload: { shop_location_id: "${shop_id}", installer_user_id: "inst-5", full_name: "Iris", certified_service_types: ["WRAP"] }
              as: ShopManager
              captures: { inst: $.data.id }
            - call: "POST /quotes"
              payload: { vehicle_profile_id: "${veh}", shop_location_id: "${shop_id}" }
              as: ShopManager
              captures: { q: $.data.id, qv0: $.data.version }
            - call: "POST /quotes/${q}/lines"
              payload: { service_package_id: "${pkg}", film_material_id: "${mat}", coverage: "FULL", window_position: "BODY_PANEL", expected_quote_version: "${qv0}" }
              as: ShopManager
              captures: { qv1: $.data.version }
            - call: "POST /quotes/${q}/price"
              payload: { expected_quote_version: "${qv1}" }
              as: ShopManager
              captures: { qv2: $.data.version }
            - call: "POST /quotes/${q}/accept"
              payload: { expected_quote_version: "${qv2}" }
              as: Customer
              as_user_id: "cust-5"
              captures: { qv3: $.data.version }
            - call: "POST /work-orders"
              payload: { quote_id: "${q}", bay_id: "${bay}", installer_id: "${inst}", scheduled_start: "2026-06-02T09:00:00Z", expected_quote_version: "${qv3}" }
              as: ShopManager
