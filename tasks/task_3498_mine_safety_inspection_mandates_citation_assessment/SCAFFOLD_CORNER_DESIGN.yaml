              as: OperatorRep
              as_user_id: "${op_id}"
              captures: { acc1: $.data.id }
          trigger:
            - call: "GET /msha/citations/${cit1}"
              payload: {}
              as: PublicReader
              as_user_id: "reader-1"
              captures: { err_read: $.data.error_id }
            - call: "GET /msha/accidents/${acc1}/public-report"
              payload: {}
              as: PublicReader
              as_user_id: "reader-1"
              captures: { err_pub: $.data.error_id }
          assert:
            - "citation read answers 403 ERR_UNAUTHORIZED"
            - "unpublished public report answers 404 ERR_NOT_FOUND (existence is concealed pre-publication)"

      - name: operator_b_cannot_abate_operator_a_citation
        claim_type: ownership_scope
        grounds:
          - roles.OperatorRep
          - errors.ERR_OPERATOR_MISMATCH
          - validations[priority=6]
        distinguishing_aspect: "Ownership is checked against the citation's mine's operator: operator B's representative calling abate on operator A's citation gets 403 ERR_OPERATOR_MISMATCH even though OperatorRep is the correct role."
        test_recipe:
