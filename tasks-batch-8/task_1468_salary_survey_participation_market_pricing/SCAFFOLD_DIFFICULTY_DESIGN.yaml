          trigger:
            - { call: "POST /adjustments/${adj_id}/submit", payload: {}, as: CompAnalyst, as_user_id: "${analyst_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CYCLE_NOT_OPEN (priority 6 state beats priority 22 business_fiscal ERR_INVALID_AMOUNT)"
            - "http_status == 409"

