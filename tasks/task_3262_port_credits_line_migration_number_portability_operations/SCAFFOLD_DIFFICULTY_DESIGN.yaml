              as: PlatformAdmin
              captures: { line_neg: $.data.id }
            - call: "POST /portability/subscriber-lines/${line_neg}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /portability/subscriber-lines"
              payload: { account_id: "${acct}", mdn: "4155551102", billing_mode: "PREPAID" }
              as: PlatformAdmin
              captures: { line_pos: $.data.id }
            - call: "POST /portability/subscriber-lines/${line_pos}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /portability/_clock/set_current_utc"
