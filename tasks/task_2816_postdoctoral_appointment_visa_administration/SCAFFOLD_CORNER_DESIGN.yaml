              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_72"
              captures: { a72_id: "$.data.id", a72_v1: "$.data.version" }
          trigger:
            - call: "POST /appointments/${a72_id}/salary-exception"
              payload: { expected_appointment_version: "${a72_v1}", exception_floor_usd: 60000.00, justification: "First exception priced against the observed posture." }
              as: HRCompensationApprover
              as_user_id: "hr_appr_27"
              captures: { a72_v2: "$.data.version", a72_exc1: "$.data.salary_exception_floor_usd" }
            - call: "POST /appointments/${a72_id}/salary-exception"
              payload: { expected_appointment_version: "${a72_v1}", exception_floor_usd: 58000.00, justification: "Second approver still holding the pre-exception read." }
              as: HRCompensationApprover
              as_user_id: "hr_appr_28"
              captures: { occ_exc_err: "$.data.error_id" }
            - call: "GET /appointments/${a72_id}"
              payload: {}
              as: HRCompensationApprover
              captures: { a72_v2_check: "$.data.version", a72_exc_check: "$.data.salary_exception_floor_usd" }
            - call: "POST /appointments/${a72_id}/salary-exception"
              payload: { expected_appointment_version: "${a72_v2_check}", exception_floor_usd: 59000.00, justification: "Re-priced against the current version; supersedes the first exception." }
              as: HRCompensationApprover
              as_user_id: "hr_appr_28"
              captures: { a72_v3: "$.data.version", a72_exc2: "$.data.salary_exception_floor_usd" }
            - call: "POST /appointments/${a72_id}/issue-offer"
              payload: {}
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_72"
            - call: "GET /appointments/${a72_id}/export-control-reviews"
              payload: { status: "QUEUED" }
              as: ExportControlReviewer
              captures: { ecr72_id: "$.data[0].id" }
            - call: "POST /export-control-reviews/${ecr72_id}/decision"
              payload: { restricted_party_hit: false, controlled_technology_flag: false }
              as: ExportControlReviewer
              as_user_id: "ecr_rev_27"
            - call: "GET /appointments/${a72_id}"
              payload: {}
