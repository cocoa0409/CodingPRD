            - "order C needing 600 + 600: HTTP 422 with ${ls_c_err} == ERR_MALT_LOT_INSUFFICIENT_QUANTITY — each line fits inside 1000 but the pair does not"
            - "MaltLot.${ls_lot_id}.committed_lbs is still 4000 after both refusals, and quantity_lbs is unchanged at 5000"
            - "cancelling order A returns available_lbs to 5000 and lets order B confirm"

      - name: spot_pool_shortage_surfaces_only_at_confirm
        claim_type: Aggregate validation
        grounds:
          - validations[priority=43]
          - errors.ERR_SPOT_INVENTORY_INSUFFICIENT
          - entities.HopVariety.fields.available_spot_lbs
        distinguishing_aspect: "SPOT hops are drawn at confirm and not at line creation, so a 1000 lb pool accepts two 880 lb lines on two orders and then refuses the second confirm — the pool is consumed by the winner and the loser learns nothing until it tries."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Certified brewer with credit_limit_cents 5000000; Citra created with available_spot_lbs 1000."
            - "Orders A and B each hold one 880 lb SPOT Citra line; A is confirmed first."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Spot Pool Brewing", brewery_license_no: "BR-1037", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { sp_id: $.data.id }
            - call: "POST /hop-varieties"
              payload: { variety_code: "CITRA", name: "Citra", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.50, spot_price_cents_per_lb: 51.00, available_spot_lbs: 1000, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
              captures: { sp_citra_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { brewer_id: "${sp_id}", requested_ship_date: "2026-09-05T00:00:00Z" }
              as: Brewer
              as_user_id: "${sp_id}"
              captures: { sp_a_id: $.data.id }
            - call: "POST /sales-orders/${sp_a_id}/lines"
              payload: { item_type: "HOP", quantity: 880, uom: "LB", allocation_source: "SPOT", hop_variety_id: "${sp_citra_id}" }
              as: Brewer
              as_user_id: "${sp_id}"
            - call: "POST /sales-orders"
              payload: { brewer_id: "${sp_id}", requested_ship_date: "2026-09-06T00:00:00Z" }
              as: Brewer
              as_user_id: "${sp_id}"
              captures: { sp_b_id: $.data.id }
            - call: "POST /sales-orders/${sp_b_id}/lines"
              payload: { item_type: "HOP", quantity: 880, uom: "LB", allocation_source: "SPOT", hop_variety_id: "${sp_citra_id}" }
              as: Brewer
              as_user_id: "${sp_id}"
          trigger:
            - call: "POST /sales-orders/${sp_a_id}/confirm"
              payload: {}
              as: Brewer
              as_user_id: "${sp_id}"
              captures: { sp_a_total: $.data.total_cents }
            - call: "GET /hop-varieties/${sp_citra_id}"
              payload: {}
              as: AllocationManager
              captures: { sp_pool_after_a: $.data.available_spot_lbs }
            - call: "POST /sales-orders/${sp_b_id}/confirm"
              payload: {}
              as: Brewer
              as_user_id: "${sp_id}"
              captures: { sp_b_err: $.data.error_id }
            - call: "POST /sales-orders/${sp_a_id}/cancel"
              payload: { cancel_reason: "released back to the pool" }
              as: Brewer
              as_user_id: "${sp_id}"
            - call: "POST /sales-orders/${sp_b_id}/confirm"
              payload: {}
              as: Brewer
              as_user_id: "${sp_id}"
              captures: { sp_b_total: $.data.total_cents }
          assert:
            - "order A: HTTP 200 with ${sp_a_total} == 95380 — subtotal 44880, freight 25000 at the TIER_1 minimum plus 18000 reefer, no pallet break because 880 is exactly one pallet, plus the 7500 small-order surcharge"
            - "${sp_pool_after_a} == 120 — the confirm drew 880 from the pool"
            - "order B: HTTP 422 with ${sp_b_err} == ERR_SPOT_INVENTORY_INSUFFICIENT while the pool stays at 120"
            - "after cancelling order A: HopVariety.${sp_citra_id}.available_spot_lbs == 1000 and SalesOrder.${sp_a_id}.fulfillment_status == CANCELLED"
            - "order B then confirms with ${sp_b_total} == 95380 and the pool back down to 120"
            - "Brewer.${sp_id}.credit_exposure_cents == 95380 at the end — the cancelled order left no exposure behind"

      - name: order_state_precondition_precedes_the_credit_limit_test
        claim_type: Priority conflict
        grounds:
          - validations[priority=16]
          - validations[priority=45]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_precondition_outranks_fiscal_check_on_re_confirm
          rationale: "Re-confirming an already CONFIRMED order over a limit-breaching total, and the reverse ordering on a DRAFT order, are both asserted by the named §1.8 instance."

      - name: certification_gate_precedes_the_contract_volume_gate
        claim_type: Priority conflict
        grounds:
          - validations[priority=21]
          - validations[priority=41]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / safety_certification_outranks_contract_volume_constraint
          rationale: "A single confirm violating both the certification rule and the contract-volume rule, and the isolation of each, are asserted by the named §1.8 instance."

      - name: reference_mismatch_precedes_the_credit_hold_gate
        claim_type: Priority conflict
        grounds:
          - validations[priority=10]
          - validations[priority=44]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / referential_mismatch_outranks_brewer_credit_hold_on_propagation_request
          rationale: "A propagation request that is both referentially wrong and made by a HOLD brewer, plus each violation alone, are asserted by the named §1.8 instance."

      - name: credit_posture_is_retested_against_the_repriced_total
        claim_type: Cascading validation
        grounds:
          - validations[priority=45]
          - calculations.brewer_credit_posture
        excluded_because:
          difficulty_instance: transitive_cascade / report_harvest_shortfall_trims_lines_reprices_order_and_moves_credit
          rationale: "The trim -> reprice -> re-evaluate-credit ordering, including the brewer leaving HOLD only because the repriced total is lower, is asserted by the named §1.8 instance."

  # ===========================================================================
  # From Table 5 (Endpoints)
  # ===========================================================================
  - section: endpoints
    instances:

      - name: resale_credit_is_capped_at_the_settlement_it_offsets
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /hop-contracts/{id}/resale]
          - endpoints[POST /hop-contracts/{id}/declare-default]
          - errors.ERR_RESALE_EXCEEDS_DEFAULTED_VOLUME
          - errors.ERR_RESALE_BUYER_INVALID
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: "Resale recovery is min(settlement_total_cents, resale value) and is credited to the DEFAULTING brewer, so a resale can lift that brewer off HOLD without ever pushing its receivable negative — and the desk that declared the default may not be the desk that resells."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brewer A with credit_limit_cents 400000 (deliberately small) and brewer B as the resale buyer."
            - "OPEN 2026 program that has NOT reported a harvest, so the settlement variant is LIQUIDATED."
            - "Citra; a 5000 lb FIXED_CROP_YEAR contract for brewer A at 250.00 with nothing committed against it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Defaulting Brewing", brewery_license_no: "BR-1038", credit_terms_days: 30, credit_limit_cents: 400000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { rs_a_id: $.data.id }
            - call: "POST /brewers"
              payload: { name: "Rescue Brewing", brewery_license_no: "BR-1039", credit_terms_days: 30, credit_limit_cents: 9000000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { rs_b_id: $.data.id }
            - call: "POST /crop-year-programs"
              payload: { crop_year: 2026, contract_open_date: "2026-01-15T00:00:00Z", harvest_report_due_date: "2026-10-01T00:00:00Z" }
              as: AllocationManager
              captures: { rs_prog_id: $.data.id }
            - call: "POST /hop-varieties"
              payload: { variety_code: "CITRA", name: "Citra", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.50, spot_price_cents_per_lb: 51.00, available_spot_lbs: 20000, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
              captures: { rs_citra_id: $.data.id }
            - call: "POST /hop-contracts"
              payload: { brewer_id: "${rs_a_id}", variety_id: "${rs_citra_id}", crop_year_program_id: "${rs_prog_id}", contract_type: "FIXED_CROP_YEAR", contracted_lbs: 5000, price_per_lb_cents: 250.00, delivery_window_start: "2026-09-01T00:00:00Z", delivery_window_end: "2026-12-31T00:00:00Z" }
              as: AllocationManager
              captures: { rs_k_id: $.data.id }
          trigger:
            - call: "POST /hop-contracts/${rs_k_id}/declare-default"
              payload: { default_reason: "brewer walked away from the crop-year commitment" }
              as: AllocationManager
              as_user_id: "hop-desk-1"
              captures: { rs_variant: $.data.settlement_variant, rs_dam: $.data.settlement_damages_cents, rs_fee: $.data.settlement_admin_fee_cents, rs_total: $.data.settlement_total_cents, rs_defaulted: $.data.defaulted_lbs }
            - call: "POST /hop-contracts/${rs_k_id}/resale"
              payload: { buyer_brewer_id: "${rs_b_id}", resale_lbs: 2000, resale_price_cents_per_lb: 60.00 }
              as: AllocationManager
              as_user_id: "hop-desk-1"
              captures: { rs_err_sod: $.data.error_id }
            - call: "POST /hop-contracts/${rs_k_id}/resale"
              payload: { buyer_brewer_id: "${rs_b_id}", resale_lbs: 5001, resale_price_cents_per_lb: 60.00 }
              as: AllocationManager
              as_user_id: "hop-desk-2"
              captures: { rs_err_volume: $.data.error_id }
            - call: "POST /hop-contracts/${rs_k_id}/resale"
              payload: { buyer_brewer_id: "${rs_a_id}", resale_lbs: 2000, resale_price_cents_per_lb: 60.00 }
              as: AllocationManager
              as_user_id: "hop-desk-2"
              captures: { rs_err_buyer: $.data.error_id }
            - call: "POST /hop-contracts/${rs_k_id}/resale"
              payload: { buyer_brewer_id: "${rs_b_id}", resale_lbs: 2000, resale_price_cents_per_lb: 60.00 }
              as: AllocationManager
              as_user_id: "hop-desk-2"
              captures: { rs_status: $.data.status, rs_credit: $.data.resale_credit_cents, rs_resold: $.data.resold_lbs, rs_left: $.data.defaulted_lbs }
          assert:
            - "default: ${rs_variant} == LIQUIDATED (the program never reported a harvest), ${rs_defaulted} == 5000, ${rs_dam} == 437500 (5000 * 250.00 * 35 / 100), ${rs_fee} == 8750 at the HIGH 2.0 percent rate because 437500 is under ADMIN_FEE_TIER_CENTS, and ${rs_total} == 446250"
            - "after the default: Brewer.${rs_a_id}.ar_balance_cents == 446250, credit_exposure_cents == 446250, credit_utilization_pct == 111.56 and credit_status == HOLD"
            - "resale attempted by hop-desk-1: HTTP 403 with ${rs_err_sod} == ERR_SEGREGATION_OF_DUTIES — the declaring user is barred even with a perfectly valid payload"
            - "resale of 5001 lbs: HTTP 422 with ${rs_err_volume} == ERR_RESALE_EXCEEDS_DEFAULTED_VOLUME"
            - "resale to the defaulting brewer itself: HTTP 422 with ${rs_err_buyer} == ERR_RESALE_BUYER_INVALID"
            - "valid resale: HTTP 200, ${rs_status} == RESOLD, ${rs_resold} == 2000, ${rs_left} == 3000 and ${rs_credit} == 120000 — min(446250, round_half_up(2000 * 60.00))"
            - "conservation holds: allocated_lbs 5000 == remaining_lbs 0 + committed_lbs 0 + carried_forward_out_lbs 0 + defaulted_lbs 3000 + resold_lbs 2000"
            - "Brewer.${rs_a_id}.ar_balance_cents == 326250, credit_utilization_pct == 81.56 and credit_status == GOOD_STANDING — the resale lifted the hold without overshooting into a negative receivable"
            - "Brewer.${rs_b_id}.ar_balance_cents == 0 — the buyer is credited nothing; the recovery offsets the defaulter's settlement"
            - "a second resale on the same contract returns 409 ERR_INVALID_CONTRACT_STATE, because RESOLD is not a legal source state"

      - name: requeue_rebooks_a_failed_job_and_rescores_the_advisory
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /yeast-propagation-jobs/{id}/requeue]
          - state_machines.YeastPropagationJob.transitions[FAILED->REQUESTED]
          - calculations.yeast_pitch_advisory
        distinguishing_aspect: "Requeue is not a bare state flip: it re-dates the pitch, clears ready_at and failure_reason, and re-runs the advisory against the NEW date, so a far-future re-book lands on the clamped viability floor and asks for more slurry than the original booking did."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brewer in GOOD_STANDING; WLP001 with lead time 7 days, viability 92.0, 1.2 billion cells per ml and vessel_max_l 2000.0; an ALE recipe at 30.0 bbl and 12.50 Plato requesting 0.75."
            - "A job requested for 2026-08-20 (19 days out), started so ready_at is stamped, then completed FAILED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Requeue Brewing", brewery_license_no: "BR-1040", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { rq_id: $.data.id }
            - call: "POST /malt-products"
              payload: { sku: "PALE-ALE", name: "Pale Ale Malt", malt_class: "BASE", list_price_cents_per_lb: 68.50, max_moisture_pct: 5.0, min_diastatic_power: 60.0, pallet_quantity_lbs: 2200, min_order_lbs: 55 }
              as: WarehouseOperator
              captures: { rq_prod_id: $.data.id }
            - call: "POST /yeast-strains"
              payload: { strain_code: "WLP001", name: "California Ale", fermentation_type: "ALE", propagation_lead_time_days: 7, list_price_cents_per_l: 1200.00, viability_pct_at_ship: 92.0, cells_per_ml_slurry_billion: 1.2, min_batch_l: 20.0, vessel_max_l: 2000.0 }
              as: WarehouseOperator
              captures: { rq_strain_id: $.data.id }
            - call: "POST /brewer-recipes"
              payload: { brewer_id: "${rq_id}", malt_product_id: "${rq_prod_id}", yeast_strain_id: "${rq_strain_id}", name: "House Ale", batch_volume_bbl: 30.0, original_gravity_plato: 12.50, target_color_lovibond: 2.50, target_extract_pct: 80.00, target_protein_pct: 11.00, requested_pitch_rate_million_cells_per_ml_per_plato: 0.75, adjunct_pct: 0.0 }
              as: Brewer
              as_user_id: "${rq_id}"
              captures: { rq_recipe_id: $.data.id }
            - call: "POST /yeast-propagation-jobs"
              payload: { brewer_id: "${rq_id}", recipe_id: "${rq_recipe_id}", yeast_strain_id: "${rq_strain_id}", pitch_date: "2026-08-20T00:00:00Z" }
              as: WarehouseOperator
              captures: { rq_job_id: $.data.id, rq_slurry_1: $.data.recommended_slurry_l, rq_vol_1: $.data.propagation_volume_l, rq_cells: $.data.required_cells_billion }
            - call: "POST /yeast-propagation-jobs/${rq_job_id}/start"
              payload: {}
              as: WarehouseOperator
              captures: { rq_ready_1: $.data.ready_at }
            - call: "POST /yeast-propagation-jobs/${rq_job_id}/complete"
              payload: { outcome: "FAILED", failure_reason: "contamination in the propagator" }
              as: WarehouseOperator
              captures: { rq_fail_status: $.data.status, rq_fail_reason: $.data.failure_reason }
          trigger:
            - call: "POST /yeast-propagation-jobs/${rq_job_id}/requeue"
              payload: { new_pitch_date: "2026-08-07T00:00:00Z" }
              as: WarehouseOperator
              captures: { rq_err: $.data.error_id }
            - call: "POST /yeast-propagation-jobs/${rq_job_id}/requeue"
              payload: { new_pitch_date: "2026-08-25T00:00:00Z" }
              as: WarehouseOperator
              captures: { rq_status_2: $.data.status, rq_pitch_2: $.data.pitch_date, rq_ready_2: $.data.ready_at, rq_reason_2: $.data.failure_reason, rq_slurry_2: $.data.recommended_slurry_l, rq_vol_2: $.data.propagation_volume_l }
            - call: "GET /yeast-propagation-jobs/${rq_job_id}"
              payload: {}
              as: Brewer
              as_user_id: "${rq_id}"
              captures: { rq_read_status: $.data.status, rq_read_advice: $.data.pitch_rate_advice, rq_read_rec: $.data.recommended_pitch_rate_million_cells_per_ml_per_plato }
          assert:
            - "original booking 19 days out: ${rq_cells} == 33004.13 (0.75 * 12.50 * 30.0 * 117.348), ${rq_slurry_1} == 50.932 at viability 0.54 and ${rq_vol_1} == 58.572"
            - "${rq_ready_1} == 2026-08-08T00:00:00Z — the clock plus 7 days, not pitch_date minus the lead time"
            - "${rq_fail_status} == FAILED and ${rq_fail_reason} == contamination in the propagator"
            - "requeue to 2026-08-07: HTTP 422 with ${rq_err} == ERR_INSUFFICIENT_PROPAGATION_LEAD_TIME, and the job is still FAILED with failure_reason intact"
            - "requeue to 2026-08-25: HTTP 200 with ${rq_status_2} == REQUESTED, ${rq_pitch_2} == 2026-08-25T00:00:00Z, ${rq_ready_2} == null and ${rq_reason_2} == null"
            - "${rq_slurry_2} == 55.007 and ${rq_vol_2} == 63.258 — 24 days of decay would give viability 0.44, so the VIABILITY_FLOOR 0.50 clamps it and the slurry rises above the 50.932 of the original booking"
            - "${rq_read_status} == REQUESTED, ${rq_read_rec} == 0.75 and ${rq_read_advice} == OPTIMAL — the requested rate equals the ALE reference rate"
            - "YeastPropagationJob.${rq_job_id}.version == 4 and replaces_job_id == null — requeue revises the job in place instead of minting a replacement"

