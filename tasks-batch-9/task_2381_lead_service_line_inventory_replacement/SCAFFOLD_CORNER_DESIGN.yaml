              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { fs: $.data.id }
          trigger:
            - call: "POST /lsl/funding-sources/${fs}/status"
              payload: { status: "SUSPENDED" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "POST /lsl/funding-sources/${fs}/status"
              payload: { status: "ACTIVE" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
          assert:
            - "FundingSource.${fs}.version == 1 immediately after creation"
            - "FundingSource.${fs}.version == 2 and status == SUSPENDED after the first write"
            - "FundingSource.${fs}.version == 3 and status == ACTIVE after the second write"
            - "FundingSource.${fs}.authorized_cents == 200000, available_cents == 200000, committed_cents == 0, drawn_cents == 0 throughout"

