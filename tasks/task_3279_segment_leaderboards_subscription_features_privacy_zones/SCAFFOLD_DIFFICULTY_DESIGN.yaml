            - call: "POST /v1/flags/${fl3_up}/uphold"
              payload: {}
              as: Moderator
            - call: "POST /v1/efforts/${e1_up}/flags"
              payload: { reporter_id: "${q_cas}", reason: "VEHICLE_ASSISTED" }
              as: Athlete
              as_user_id: "${q_cas}"
              captures: { fl4_up: $.data.id }
            - call: "POST /v1/efforts/${e2_up}/flags"
              payload: { reporter_id: "${q_cas}", reason: "VEHICLE_ASSISTED" }
