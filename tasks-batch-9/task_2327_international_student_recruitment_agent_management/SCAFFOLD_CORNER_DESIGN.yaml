              as: ComplianceOfficer
              as_user_id: "compliance-1"
          assert:
            - 'the probation cascade left AgentContract.${c1_id}.status == "SUSPENDED" with .suspension_reason == "POSTURE_PROBATION" and TerritoryAssignment.${t1_id}.status == "RELEASED"'
            - 'first REINSTATE: HTTP 422 with data.error_id == "ERR_AGENCY_POSTURE_BLOCKED" and the contract stays "SUSPENDED"'
