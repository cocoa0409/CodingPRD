            - "grant.data.covered_unit_count == 0"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: revision_release_requires_approved_eco
        grounds:
          - state_machines.PartRevision.IN_REVIEW_to_RELEASED
          - state_machines.EngineeringChangeOrder.APPROVED_to_EFFECTIVE
          - validations[priority=9]
        distinguishing_aspect: |
          A PartRevision can only move IN_REVIEW->RELEASED when its governing ECO is APPROVED;
          PartRevision's valid transition depends on EngineeringChangeOrder state — entity
          pair PartRevision -> EngineeringChangeOrder.
        test_recipe:
          setup:
            - "Revision IN_REVIEW attached to an APPROVED ECO whose effectivity has passed."
          setup_api_calls:
            - call: "POST /plm/suppliers"
