  - section: endpoints
    instances:
      - name: response_envelope_structure_on_success_list_and_error
        claim_type: response_envelope
        grounds:
          - response_envelope
        distinguishing_aspect: "All three envelope shapes verified against the fixed §1.0 contract: object (single GET), array with pagination fields (list GET), error with data.error_id and data.message."
        test_recipe:
          setup: ["One campaign created"]
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 50000 }, captures: { camp: $.data.id } }
          trigger:
            - { call: "GET /fafsa/campaigns/${camp}", as: CampaignAdmin }
            - { call: "GET /fafsa/campaigns", as: CampaignAdmin }
            - { call: "GET /fafsa/campaigns/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: CampaignAdmin, captures: { err: $.data.error_id } }
          assert:
            - "Single GET: meta.api_request_id and meta.api_request_timestamp present; response_type == 'object'; data holds the campaign"
            - "List GET: response_type == 'array'; meta present; data pagination fields limit/offset/total_count/has_more present with defaults limit=10 offset=0"
            - "Error GET: response_type == 'error'; data.error_id == ERR_CAMPAIGN_NOT_FOUND and data.message non-empty"

      - name: match_link_cross_reference_requires_existing_aid_record
        claim_type: cross_reference_link
        grounds:
          - errors[ERR_AID_RECORD_NOT_FOUND]
        distinguishing_aspect: "Cross-reference creation validates both endpoints of the link: a nonexistent aid_record_id yields ERR_AID_RECORD_NOT_FOUND even when the senior exists and the OCC version is fresh."
        test_recipe:
          setup: ["Campaign OPEN; school ENROLLED; senior created"]
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 50000 }, captures: { camp: $.data.id } }
            - { call: "POST /fafsa/campaigns/${camp}/activate", as: CampaignAdmin }
            - { call: "POST /fafsa/schools", as: CampaignAdmin, payload: { campaign_id: "${camp}", name: "North HS", district_code: "D01", school_code: "SC01" }, captures: { sch: $.data.id } }
            - { call: "POST /fafsa/schools/${sch}/enroll", as: CampaignAdmin }
            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", student_ref: "S1", full_name: "Ana Lee", dob: "2009-03-04", home_language: "en" }, captures: { sr: $.data.id, sr_v: $.data.version } }
          trigger:
            - { call: "POST /fafsa/match-links", as: MatchReviewer, payload: { senior_record_id: "${sr}", aid_record_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", expected_senior_record_version: "${sr_v}" }, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_AID_RECORD_NOT_FOUND (HTTP 404)"

      - name: event_staffing_coverage_computed_read
        claim_type: computed_read
        grounds:
          - entities.CompletionEvent.fields.staffing_coverage
        excluded_because:
          difficulty_instance: event_staffing_coverage_committed_vs_pipeline_variants
          rationale: "The §1.8 instance reads GET /fafsa/events/{id} and asserts both computed coverage variants with exact literals."

      - name: report_generation_and_variant_rows
        claim_type: computed_read
        grounds:
          - entities.CompletionReport.fields.rows
        excluded_because:
          difficulty_instance: report_rate_rounding_order_totals_not_row_average
          rationale: "Row-level computed values (eligible_count, completed_count, rate) are asserted with literals in the §1.8 rounding instance; variant totals asserted in completion_rate_submission_vs_processed_variants."

  - section: errors
    instances:
      - name: waive_non_waivable_item_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ITEM_NOT_WAIVABLE]
          - entities.ChecklistItem.fields.waivable
        distinguishing_aspect: "waive on STUDENT_ID (waivable == false) by a specialist who DOES hold a case for the senior isolates ERR_ITEM_NOT_WAIVABLE from the other waive preconditions."
        test_recipe:
          setup: ["Campaign OPEN; school ENROLLED; senior AUTO_CONFIRMED-matched (checklist generated); specialist holds an OPEN SPECIAL_CIRCUMSTANCE case for the senior"]
          setup_api_calls:
