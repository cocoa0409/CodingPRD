  - rule_id: non_linear_state_machine
    instances:
      - name: service_request_parallel_dims_and_parts_hold_cycle
        grounds:
          - state_machines.ServiceRequest.IN_SERVICE_to_ON_HOLD_PARTS
          - state_machines.ServiceRequest.ON_HOLD_PARTS_to_IN_SERVICE
          - entities.ServiceRequest.fields.work_status
          - entities.ServiceRequest.fields.billing_status
        distinguishing_aspect: |
          ServiceRequest carries two independent state dimensions: work_status
          cycles IN_SERVICE -> ON_HOLD_PARTS -> IN_SERVICE twice while
          billing_status stays ESTIMATED — a cycle plus parallel dimensions on
          one entity, distinct from the Invoice cycle instance.
        test_recipe:
          setup:
            - "Dispatched request (zone 2500, BASIC tier, INDIVIDUAL customer), mechanic arrived and started service"
