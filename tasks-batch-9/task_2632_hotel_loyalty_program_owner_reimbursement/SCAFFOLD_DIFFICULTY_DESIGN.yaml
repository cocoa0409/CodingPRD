            - call: "POST /loyalty/redemptions"
              payload: { member_id: "${ma_id}", hotel_id: "${h_id}", checkin_date: "2026-09-08", checkout_date: "2026-09-10", expected_hotel_version: "${h_v}" }
              as: Member
              as_user_id: "${ma_id}"
              captures: { r1_id: $.data.id, r1_charged: $.data.points_charged }
          trigger:
            - call: "POST /loyalty/redemptions"
              payload: { member_id: "${mb_id}", hotel_id: "${h_id}", checkin_date: "2026-09-08", checkout_date: "2026-09-10", expected_hotel_version: "${h_v}" }
              as: Member
              as_user_id: "${mb_id}"
              captures: { err_inventory: $.data.error_id }
            - call: "POST /loyalty/redemptions/${r1_id}/cancel"
              payload: { cancel_reason: "Trip cancelled by the guest" }
              as: Member
              as_user_id: "${ma_id}"
              captures: { r1_status: $.data.fulfillment_status }
            - call: "GET /loyalty/program-fund"
              payload: {}
              as: ProgramAuditor
              captures: { post_liab: $.data.point_liability_cents, post_ratio: $.data.solvency_ratio, post_cash: $.data.cash_balance_cents }
            - call: "POST /loyalty/redemptions"
              payload: { member_id: "${mb_id}", hotel_id: "${h_id}", checkin_date: "2026-09-08", checkout_date: "2026-09-10", expected_hotel_version: "${h_v}" }
              as: Member
              as_user_id: "${mb_id}"
              captures: { r2_id: $.data.id, r2_charged: $.data.points_charged }
          assert:
            - "first trigger: response code 409 and ${err_inventory} == ERR_AWARD_INVENTORY_UNAVAILABLE - the single award room on 2026-09-08 and 2026-09-09 is held by R1"
            - "second trigger: response code 200 and ${r1_status} == CANCELLED with cancel_reason recorded"
            - "exactly one REVERSAL PointLedgerEntry exists with source_redemption_id == ${r1_id}, points == +80000 and reversal_of_entry_id == the REDEEM entry of R1; the captured ${r1_charged} was 80000"
            - "sum of PointLedgerEntry.points over source_redemption_id == ${r1_id} equals 0 - the scoped conservation identity"
            - "Member.${ma_id}.point_balance == 100000, exactly its pre-booking value, and equals the sum of all its ledger entries"
            - "${post_liab} == ${base_liab} == 96000 and ${post_ratio} == ${base_ratio} == 1.1458 - the liability and solvency figures return to their baselines rather than merely moving in the right direction"
            - "${post_cash} == ${base_cash} == 110000 - a cancellation moves no program cash, only points"
            - "fourth trigger: response code 201 and ${r2_charged} == 80000 - the released award night is bookable again, so the inventory side effect was compensated too"
            - "Member.${mb_id}.point_balance == 20000 and Redemption.${r2_id}.fulfillment_status == HELD"

      - name: purchase_refund_returns_program_cash_partner_volume_and_the_annual_purchase_cap
        grounds:
          - calculations.fund_cash_conservation
          - state_machines.PointPurchase.SETTLED_to_REFUNDED
          - calculations.point_purchase_pricing
          - validations.priority_81_ERR_PURCHASE_CAP_EXCEEDED
          - entities.Partner.fields.purchased_points_mtd
          - entities.Member.fields.points_purchased_current_year
        distinguishing_aspect: |
          Conserved quantity 2 - PROGRAM CASH - and the identity is structural rather than
          entry-based: the refunded purchase leaves the SETTLED set, so cash re-balances with no
          separate reversal term. Three counters must unwind together, and the proof that the annual
          cap counter really returned to 0 is that a second 200000-point purchase - which would breach
          the 200000 cap if any of the first purchase still counted - is accepted.
        test_recipe:
          setup:
            - "An airline partner selling points at 5000 cents per 1000 with a 500000-point monthly cap."
            - "A member whose only activity is one settled 200000-point PARTNER_SALE purchase: cash_due 880000 cents (200000 / 1000 * 5000 * (1 - 0.12)), which is also the member's entire 200000-point annual cap."
            - "No reimbursement batch has ever been paid, so the conservation identity's second term is 0."
          setup_api_calls:
            - call: "POST /loyalty/partners"
              payload: { name: "Northwind Air Rewards", partner_type: "AIRLINE", points_cost_per_1000_cents: 5000, monthly_cap_points: 500000 }
              as: ProgramAdministrator
              captures: { pt_id: $.data.id }
            - call: "POST /loyalty/members"
              payload: { email: "inv2@example.com", full_name: "Elif Demir", enrollment_date: "2026-04-04" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /loyalty/point-purchases"
              payload: { member_id: "${m_id}", channel: "PARTNER_SALE", points_quantity: 200000, partner_id: "${pt_id}" }
              as: ProgramAdministrator
              captures: { pp_id: $.data.id, cash_due: $.data.cash_due_cents }
            - call: "POST /loyalty/point-purchases/${pp_id}/settle"
              payload: {}
              as: ProgramAdministrator
              captures: { pp_status: $.data.status }
            - call: "GET /loyalty/program-fund"
              payload: {}
              as: ProgramAuditor
              captures: { cash_settled: $.data.cash_balance_cents, liab_settled: $.data.point_liability_cents, ratio_settled: $.data.solvency_ratio }
            - call: "GET /loyalty/partners/${pt_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { mtd_settled: $.data.purchased_points_mtd }
          trigger:
            - call: "POST /loyalty/point-purchases/${pp_id}/refund"
              payload: { refund_reason: "Partner reported an unauthorized bulk order" }
              as: ProgramAdministrator
              captures: { pp_final: $.data.status }
            - call: "POST /loyalty/point-purchases"
              payload: { member_id: "${m_id}", channel: "PARTNER_SALE", points_quantity: 200000, partner_id: "${pt_id}" }
              as: ProgramAdministrator
              captures: { pp2_id: $.data.id, pp2_cash: $.data.cash_due_cents }
          assert:
            - "the captured ${pp_status} was SETTLED, ${cash_due} was 880000, ${cash_settled} was 880000, ${liab_settled} was 96000 (200000 * 0.6 * 0.8) and ${ratio_settled} was 9.1667"
            - "first trigger: response code 200 and ${pp_final} == REFUNDED with refund_reason recorded"
            - "exactly one REVERSAL PointLedgerEntry exists with source_purchase_id == ${pp_id} and points == -200000, and the sum over source_purchase_id == ${pp_id} is 0"
            - "ProgramFund.cash_balance_cents == 0, which is exactly sum(cash_due_cents over SETTLED purchases) == 0 minus sum(net_payable_cents over PAID batches) == 0"
            - "ProgramFund.outstanding_points == 0, point_liability_cents == 0, solvency_ratio == 999.0000 and status == HEALTHY - the empty-ledger case is the pinned 999.0000 rather than a division by zero"
            - "Member.${m_id}.point_balance == 0 and points_purchased_current_year == 0"
            - "the captured ${mtd_settled} was 200000 and Partner.${pt_id}.purchased_points_mtd == 0 after the refund"
            - "second trigger: response code 201 and ${pp2_cash} == 880000 - a fresh 200000-point purchase is accepted, so the annual cap counter genuinely returned to 0 rather than being merely ignored"
            - "PointPurchase.${pp2_id}.status == PENDING, so ProgramFund.cash_balance_cents is still 0: an unsettled purchase contributes nothing to the identity"
