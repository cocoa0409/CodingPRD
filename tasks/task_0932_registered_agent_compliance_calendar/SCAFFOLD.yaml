scenario: "932. Registered-Agent & Compliance-Calendar Service: entity & state registration, agent-of-record & service-of-process forward, annual-report & franchise-tax calendar, filing & fee, BOI/beneficial-owner filing, foreign-qualification, dissolution, multi-state portfolio"
domain_name: "registered-agent-compliance-calendar"
api_prefix: ""

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Temporal windowing"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - ops_run_checkpoint
  entity_topology: graph
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate
  notes: |
    Registration lifecycle is cyclic (ACTIVE -> DELINQUENT -> ACTIVE, ADMIN_DISSOLVED -> ACTIVE).
    LegalEntity carries two independent state axes (lifecycle_status x boi_status).
    SopDocument and Filing are cyclic with capped retry counts.
    AgentAppointment.superseded_by_appointment_id is a self-referential FK.
    Every per-jurisdiction number lives on an effective-dated StateRule row, so the same
    LegalEntity computes different due dates and different money in different states.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# Global declared constants. Every ALL_CAPS token used anywhere in this
# scaffold has a numeric / string / list value here or on a StateRule row
# field (which is per-row input data, not a constant).
# ---------------------------------------------------------------------------
constants:
  CLOCK_DEFAULT_UTC: "2026-05-01T00:00:00Z"
  MONEY_UNIT: "integer cents"
  MONEY_ROUNDING: "round_half_up"

  # Calendar
  OBSERVED_HOLIDAYS:
    - "2026-01-01"
    - "2026-05-25"
    - "2026-07-03"
    - "2026-09-07"
    - "2026-11-26"
    - "2026-12-25"
    - "2027-01-01"
    - "2027-05-31"
    - "2027-07-05"
    - "2027-09-06"
    - "2027-11-25"
    - "2027-12-24"
    - "2028-01-03"
    - "2028-05-29"
    - "2028-07-04"
    - "2028-09-04"
    - "2028-11-23"
    - "2028-12-25"
    - "2029-01-01"
    - "2029-05-28"
    - "2029-07-04"
    - "2029-09-03"
    - "2029-11-22"
    - "2029-12-25"
  WEEKEND_DAYS: ["SATURDAY", "SUNDAY"]
  BUSINESS_DAY_START_HOUR_UTC: 9
  BUSINESS_DAY_END_HOUR_UTC: 17
  BUSINESS_HOURS_PER_DAY: 8

  # Calendar windows
  DUE_SOON_WINDOW_DAYS: 30
  LATE_FEE_MONTH_BLOCK_DAYS: 30
  REMINDER_OFFSETS_DAYS: [90, 60, 30, 7]
  OVERDUE_REMINDER_OFFSET_DAYS: 1

  # Service pricing
  SERVICE_FEE_BASE_CENTS: 4900
  EXPEDITE_SERVICE_FEE_CENTS_NONE: 0
  EXPEDITE_SERVICE_FEE_CENTS_STANDARD: 5000
  EXPEDITE_SERVICE_FEE_CENTS_RUSH: 12500
  EXPEDITE_SERVICE_FEE_CENTS_SAME_DAY: 30000
  VOLUME_DISCOUNT_THRESHOLD_OPEN_OBLIGATIONS: 5
  VOLUME_DISCOUNT_BPS: 1500

  # Agent of record
  AGENT_RESIGNATION_NOTICE_DAYS: 30

  # Filing / refile
  REFILE_WINDOW_DAYS: 15
  MAX_REFILE_ATTEMPTS: 3

  # Service of process (all SOP hour counts are BUSINESS hours)
  SOP_ORDINARY_FORWARD_HOURS: 16
  SOP_LITIGATION_FORWARD_HOURS: 4
  SOP_ACK_DEADLINE_HOURS: 8
  SOP_ESCALATION_STEP_HOURS: 4
  SOP_MAX_ESCALATION_LEVEL: 3
  SOP_DEFERRAL_BUSINESS_HOURS: 8
  SOP_RISK_FLAG_THRESHOLD: 2

  # BOI / beneficial ownership
  BOI_PRE_2024_DEADLINE_DATE: "2025-01-01"
  BOI_2024_BAND_START_DATE: "2024-01-01"
  BOI_2025_BAND_START_DATE: "2025-01-01"
  BOI_2024_FORMATION_DAYS: 90
  BOI_POST_2024_FORMATION_DAYS: 30
  BOI_UPDATE_DAYS: 30
  COMPANY_APPLICANT_CUTOVER_DATE: "2024-01-01"

  # Delinquency ranks (portfolio rollup)
  RANK_CURRENT: 0
  RANK_DUE_SOON: 1
  RANK_IN_GRACE: 2
  RANK_DELINQUENT: 3
  RANK_ADMIN_DISSOLVED: 4

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Portfolio owner's legal name."
        constraints: "non-empty, max 200 chars"
      - name: billing_email
        type: string
        source: input
        description: "Billing contact email."
        constraints: "non-empty"
      - name: credit_balance_cents
        type: integer
        source: computed
        description: "Refunded service portions held as account credit. Equals the sum of Payment.refunded_amount_cents over this client's payments."
        default: 0
        constraints: ">= 0"
      - name: portfolio_entity_count
        type: integer
        source: computed
        description: "Count of LegalEntity rows whose client_id is this client and whose lifecycle_status != DISSOLVED."
        default: 0
      - name: portfolio_open_obligation_count
        type: integer
        source: computed
        description: "Count of ComplianceObligation rows with status IN {SCHEDULED, DUE_SOON, IN_GRACE, DELINQUENT} across every Registration of every LegalEntity of this client."
        default: 0
      - name: portfolio_outstanding_cents
        type: integer
        source: computed
        description: "Sum of ComplianceObligation.total_due_cents over the same rows counted by portfolio_open_obligation_count."
        default: 0
      - name: portfolio_delinquency_status
        type: enum
        source: computed
        description: "Worst-member rollup of every Registration.delinquency_rank of this client, mapped back through the RANK_* constants."
        default: "CURRENT"
        constraints: "one of CURRENT, DUE_SOON, IN_GRACE, DELINQUENT, ADMIN_DISSOLVED"
      - name: sop_open_escalation_count
        type: integer
        source: computed
        description: "Count of SopEscalationEvent rows whose SopDocument is still in status IN {FORWARDED, ESCALATED} across this client's registrations."
        default: 0
      - name: portfolio_risk_flag
        type: boolean
        source: computed
        description: "True when sop_open_escalation_count >= SOP_RISK_FLAG_THRESHOLD."
        default: false

  - name: StateRule
    parent: null
    common_fields: true
    fields:
      - name: state_code
        type: string
        source: input
        description: "Two-letter jurisdiction code this rule version governs."
        constraints: "exactly 2 uppercase letters"
      - name: effective_from
        type: string
        source: input
        description: "Inclusive ISO date (YYYY-MM-DD) on which this rule version begins to govern."
      - name: effective_to
        type: string
        source: system
        description: "Exclusive ISO date on which this rule version stops governing; null while the row is the open row for its state_code."
        default: null
      - name: annual_report_basis
        type: enum
        source: input
        description: "Discriminator selecting the annual-report due-date formula."
        constraints: "one of ANNIVERSARY_MONTH_DAY, FIXED_CALENDAR_DATE, FISCAL_YEAR_END_OFFSET"
      - name: fixed_due_month
        type: integer
        source: input
        description: "Calendar month used when annual_report_basis == FIXED_CALENDAR_DATE."
        default: 1
        constraints: "1..12"
      - name: fixed_due_day
        type: integer
        source: input
        description: "Calendar day used when annual_report_basis == FIXED_CALENDAR_DATE; clamped to the month length."
        default: 1
        constraints: "1..31"
      - name: fiscal_offset_days
        type: integer
        source: input
        description: "Calendar days added to the entity's fiscal year end when annual_report_basis == FISCAL_YEAR_END_OFFSET."
        default: 0
        constraints: "0..365"
      - name: franchise_tax_basis
        type: enum
        source: input
        description: "Discriminator selecting the franchise-tax formula."
        constraints: "one of FLAT, AUTHORIZED_SHARES_TIERS, ASSUMED_PAR_VALUE, GROSS_RECEIPTS_BRACKETS"
      - name: flat_franchise_tax_cents
        type: integer
        source: input
        description: "Franchise tax when franchise_tax_basis == FLAT."
        default: 0
        constraints: ">= 0"
      - name: authorized_shares_tiers
        type: array
        source: input
        description: "Ordered tier table used when franchise_tax_basis == AUTHORIZED_SHARES_TIERS; each item is an object with up_to_shares (integer or null) and tax_cents (integer)."
        default: []
      - name: assumed_par_value_rate_bps
        type: integer
        source: input
        description: "Basis points applied to assumed par capital when franchise_tax_basis == ASSUMED_PAR_VALUE."
        default: 0
        constraints: ">= 0"
      - name: min_franchise_tax_cents
        type: integer
        source: input
        description: "Lower clamp applied only under franchise_tax_basis == ASSUMED_PAR_VALUE."
        default: 0
        constraints: ">= 0"
      - name: max_franchise_tax_cents
        type: integer
        source: input
        description: "Upper clamp applied only under franchise_tax_basis == ASSUMED_PAR_VALUE."
        default: 100000000
        constraints: ">= min_franchise_tax_cents"
      - name: gross_receipts_brackets
        type: array
        source: input
        description: "Ordered bracket table used when franchise_tax_basis == GROSS_RECEIPTS_BRACKETS; each item is an object with up_to_cents (integer or null) and tax_cents (integer)."
        default: []
      - name: grace_days
        type: integer
        source: input
        description: "Length of the post-due grace window."
        default: 0
        constraints: "0..120"
      - name: grace_basis
        type: enum
        source: input
        description: "Discriminator selecting how grace_days is counted."
        default: "CALENDAR_DAYS"
        constraints: "one of CALENDAR_DAYS, BUSINESS_DAYS"
      - name: late_fee_style
        type: enum
        source: input
        description: "Discriminator selecting the late-fee formula."
        default: "FLAT"
        constraints: "one of FLAT, PER_MONTH, PERCENT_CAPPED"
      - name: late_fee_flat_cents
        type: integer
        source: input
        description: "Late fee when late_fee_style == FLAT."
        default: 0
        constraints: ">= 0"
      - name: late_fee_per_month_cents
        type: integer
        source: input
        description: "Per-block late fee when late_fee_style == PER_MONTH."
        default: 0
        constraints: ">= 0"
      - name: late_fee_percent_bps
        type: integer
        source: input
        description: "Basis points on (state fee + franchise tax) when late_fee_style == PERCENT_CAPPED."
        default: 0
        constraints: ">= 0"
      - name: late_fee_cap_cents
        type: integer
        source: input
        description: "Upper clamp applied only under late_fee_style == PERCENT_CAPPED."
        default: 0
        constraints: ">= 0"
      - name: delinquency_to_dissolution_days
        type: integer
        source: input
        description: "Calendar days after grace end at which the state may administratively dissolve the registration."
        default: 60
        constraints: "1..1095"
      - name: reinstatement_window_days
        type: integer
        source: input
        description: "Calendar days after administrative dissolution during which reinstatement remains available."
        default: 365
        constraints: "1..3650"
      - name: annual_report_fee_cents
        type: integer
        source: input
        description: "State filing fee for an annual report or a final report."
        default: 0
        constraints: ">= 0"
      - name: franchise_tax_filing_fee_cents
        type: integer
        source: input
        description: "State filing fee charged alongside a franchise-tax obligation."
        default: 0
        constraints: ">= 0"
      - name: foreign_qualification_fee_cents
        type: integer
        source: input
        description: "State fee for a foreign-qualification filing."
        default: 0
        constraints: ">= 0"
      - name: withdrawal_fee_cents
        type: integer
        source: input
        description: "State fee for a withdrawal filing."
        default: 0
        constraints: ">= 0"
      - name: dissolution_fee_cents
        type: integer
        source: input
        description: "State fee for a dissolution filing."
        default: 0
        constraints: ">= 0"
      - name: reinstatement_fee_cents
        type: integer
        source: input
        description: "State fee for a reinstatement filing, charged under the rule effective on the assessment date."
        default: 0
        constraints: ">= 0"
      - name: expedite_surcharge_cents
        type: integer
        source: input
        description: "State-side surcharge added when a filing carries any expedite tier other than NONE."
        default: 0
        constraints: ">= 0"
      - name: good_standing_freshness_days
        type: integer
        source: input
        description: "A certificate of good standing must be strictly younger than this many days on the submission date."
        default: 30
        constraints: "1..365"
      - name: requires_tax_clearance
        type: boolean
        source: input
        description: "When true, dissolution and withdrawal filings in this state require tax clearance."
        default: false

  - name: LegalEntity
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the portfolio owner. Supplied by the path segment on creation."
      - name: legal_name
        type: string
        source: input
        description: "Registered legal name. Changing it is a BOI reportable change."
        constraints: "non-empty, max 200 chars"
      - name: entity_type
        type: enum
        source: input
        description: "Organisational form."
        constraints: "one of LLC, CORP, LP, LLP, NONPROFIT"
      - name: home_state_code
        type: string
        source: input
        description: "Two-letter code of the formation (home) jurisdiction."
        constraints: "exactly 2 uppercase letters"
      - name: formation_date
        type: string
        source: input
        description: "ISO date (YYYY-MM-DD) of formation in the home state. Drives anniversary due dates and the BOI initial-deadline band."
      - name: fiscal_year_end_month
        type: integer
        source: input
        description: "Fiscal year end month, used when a state's annual_report_basis == FISCAL_YEAR_END_OFFSET."
        default: 12
        constraints: "1..12"
      - name: fiscal_year_end_day
        type: integer
        source: input
        description: "Fiscal year end day, clamped to the month length."
        default: 31
        constraints: "1..31"
      - name: authorized_shares
        type: integer
        source: input
        description: "Authorized share count; input to AUTHORIZED_SHARES_TIERS and ASSUMED_PAR_VALUE franchise tax."
        default: 0
        constraints: ">= 0"
      - name: issued_shares
        type: integer
        source: input
        description: "Issued share count; input to ASSUMED_PAR_VALUE franchise tax."
        default: 0
        constraints: ">= 0, <= authorized_shares"
      - name: total_gross_assets_cents
        type: integer
        source: input
        description: "Total gross assets; input to ASSUMED_PAR_VALUE franchise tax."
        default: 0
        constraints: ">= 0"
      - name: annual_gross_receipts_cents
        type: integer
        source: input
        description: "Annual gross receipts; input to GROSS_RECEIPTS_BRACKETS franchise tax."
        default: 0
        constraints: ">= 0"
      - name: boi_exempt_class
        type: enum
        source: input
        description: "Beneficial-ownership exemption class. Any value other than NONE suppresses the BOI obligation."
        default: "NONE"
        constraints: "one of NONE, LARGE_OPERATING, PUBLICLY_TRADED, BANK, TAX_EXEMPT"
      - name: lifecycle_status
        type: enum
        source: system
        description: "Lifecycle axis. Evolves independently of boi_status."
        default: "DRAFT"
        constraints: "one of DRAFT, ACTIVE, WINDING_DOWN, DISSOLVED"
      - name: boi_status
        type: enum
        source: computed
        description: "Beneficial-ownership axis. Evolves independently of lifecycle_status."
        default: "PENDING_INITIAL"
        constraints: "one of NOT_REQUIRED, PENDING_INITIAL, FILED, UPDATE_DUE, DELINQUENT"
      - name: boi_initial_deadline
        type: string
        source: computed
        description: "ISO date produced by the boi_initial_deadline calculation; null when boi_exempt_class != NONE."
        default: null
      - name: boi_update_deadline
        type: string
        source: computed
        description: "ISO date produced by the boi_update_deadline calculation; null until a reportable field changes after the initial report is accepted."
        default: null
      - name: company_applicant_required
        type: boolean
        source: computed
        description: "True when formation_date >= COMPANY_APPLICANT_CUTOVER_DATE."
        default: false
      - name: compliance_posture
        type: enum
        source: computed
        description: "Worst-member rollup over this entity's Registration.delinquency_rank values, mapped through the RANK_* constants."
        default: "CURRENT"
        constraints: "one of CURRENT, DUE_SOON, IN_GRACE, DELINQUENT, ADMIN_DISSOLVED"
      - name: final_report_required
        type: boolean
        source: computed
        description: "Set true when the entity enters WINDING_DOWN; stays true after DISSOLVED so the final-report obligation survives dissolution."
        default: false

  - name: BeneficialOwner
    parent: LegalEntity
    common_fields: true
    fields:
      - name: legal_entity_id
        type: string
        source: input
        description: "FK -> LegalEntity.id; supplied by the path segment on creation."
      - name: full_name
        type: string
        source: input
        description: "Owner legal name. BOI reportable field."
        constraints: "non-empty"
      - name: date_of_birth
        type: string
        source: input
        description: "ISO date of birth. Not a reportable-change trigger."
      - name: residential_address
        type: string
        source: input
        description: "Residential address. BOI reportable field."
        constraints: "non-empty"
      - name: id_document_number
        type: string
        source: input
        description: "Identifying document number. BOI reportable field."
        constraints: "non-empty"
      - name: ownership_pct
        type: number
        source: input
        description: "Ownership percentage. BOI reportable field."
        constraints: "0 < ownership_pct <= 100"
      - name: is_company_applicant
        type: boolean
        source: input
        description: "True when this person is a company applicant for the entity."
        default: false
      - name: owner_status
        type: enum
        source: input
        description: "ACTIVE while the person is a reportable owner; REMOVED once withdrawn. Changing it is a BOI reportable change."
        default: "ACTIVE"
        constraints: "one of ACTIVE, REMOVED"

  - name: NameClearance
    parent: LegalEntity
    common_fields: true
    fields:
      - name: legal_entity_id
        type: string
        source: input
        description: "FK -> LegalEntity.id; supplied by the path segment on creation."
      - name: state_code
        type: string
        source: input
        description: "Jurisdiction in which the name was searched."
        constraints: "exactly 2 uppercase letters"
      - name: requested_name
        type: string
        source: input
        description: "Name submitted for availability search."
        constraints: "non-empty"
      - name: fallback_assumed_name
        type: string
        source: input
        description: "DBA / assumed name to fall back on when the requested name conflicts."
        default: null
      - name: result
        type: enum
        source: system
        description: "Search outcome recorded by the filing agent."
        default: "PENDING"
        constraints: "one of PENDING, AVAILABLE, CONFLICT"
      - name: conflicting_name
        type: string
        source: input
        description: "Name already on file in that jurisdiction; recorded only with result CONFLICT."
        default: null
      - name: resolved_name
        type: string
        source: computed
        description: "requested_name when result == AVAILABLE; fallback_assumed_name when result == CONFLICT and a fallback exists; null otherwise."
        default: null

  - name: Registration
    parent: LegalEntity
    common_fields: true
    fields:
      - name: legal_entity_id
        type: string
        source: input
        description: "FK -> LegalEntity.id; supplied by the path segment on creation."
      - name: name_clearance_id
        type: string
        source: input
        description: "FK -> NameClearance.id; required on foreign qualification, null on the home registration."
        default: null
      - name: state_code
        type: string
        source: input
        description: "Two-letter code of the jurisdiction this registration occupies."
        constraints: "exactly 2 uppercase letters"
      - name: registration_kind
        type: enum
        source: system
        description: "HOME for the formation state, FOREIGN for a qualification."
        constraints: "one of HOME, FOREIGN"
      - name: qualified_on
        type: string
        source: system
        description: "ISO date the registration became ACTIVE; null while PENDING."
        default: null
      - name: closed_on
        type: string
        source: system
        description: "ISO date the registration left the occupancy interval via WITHDRAWN, TERMINATED or CLOSED_PERMANENT; null otherwise. The occupancy interval is half-open [qualified_on, closed_on)."
        default: null
      - name: status
        type: enum
        source: system
        description: "Registration lifecycle state."
        default: "PENDING"
        constraints: "one of PENDING, ACTIVE, DELINQUENT, ADMIN_DISSOLVED, WITHDRAWN, TERMINATED, CLOSED_PERMANENT"
      - name: agent_of_record_id
        type: string
        source: computed
        description: "Id of the AgentAppointment currently of record for this registration, produced by the agent_of_record_selector calculation; null when the candidate set is empty."
        default: null
      - name: admin_dissolved_on
        type: string
        source: system
        description: "ISO date of administrative dissolution; null otherwise."
        default: null
      - name: reinstatement_deadline
        type: string
        source: computed
        description: "ISO date after which reinstatement is permanently unavailable; produced by the reinstatement_window_close_date calculation."
        default: null
      - name: delinquency_rank
        type: integer
        source: computed
        description: "Integer 0..4 produced by the registration_delinquency_rank calculation using the RANK_* constants."
        default: 0
        constraints: "0..4"
      - name: sop_priority_hold
        type: boolean
        source: computed
        description: "True while at least one LITIGATION SopDocument on this registration is in status IN {RECEIVED, SCANNED, FORWARDED, ESCALATED}."
        default: false
      - name: assumed_name
        type: string
        source: computed
        description: "Copied from NameClearance.resolved_name when the clearance result was CONFLICT; null otherwise."
        default: null

  - name: GoodStandingCertificate
    parent: Registration
    common_fields: false
    fields:
      - name: registration_id
        type: string
        source: input
        description: "FK -> Registration.id; the home registration the certificate was drawn from. Supplied by the path segment on creation."
      - name: state_code
        type: string
        source: system
        description: "Copied from the parent registration's state_code."
      - name: issued_on
        type: string
        source: input
        description: "ISO date printed on the certificate; drives the strict freshness window."
      - name: certificate_number
        type: string
        source: input
        description: "State-issued certificate number."
        constraints: "non-empty"

  - name: AgentAppointment
    parent: Registration
    common_fields: true
    fields:
      - name: registration_id
        type: string
        source: input
        description: "FK -> Registration.id; supplied by the path segment on creation."
      - name: superseded_by_appointment_id
        type: string
        source: system
        description: "FK -> AgentAppointment.id; set on the outgoing appointment when a successor is accepted on the same registration."
        default: null
      - name: provider_name
        type: string
        source: input
        description: "Registered-agent provider of record under this appointment."
        constraints: "non-empty"
      - name: appointed_on
        type: string
        source: input
        description: "ISO date the appointment takes effect; primary ranking key inside the agent_of_record_selector after priority_rank."
      - name: status
        type: enum
        source: system
        description: "Appointment lifecycle state."
        default: "PROPOSED"
        constraints: "one of PROPOSED, APPOINTED, RESIGNATION_NOTICED, RESIGNED, TRANSFERRED_OUT, REJECTED"
      - name: resignation_noticed_on
        type: string
        source: system
        description: "ISO date statutory resignation notice was given; null otherwise."
        default: null
      - name: resignation_effective_on
        type: string
        source: computed
        description: "resignation_noticed_on + AGENT_RESIGNATION_NOTICE_DAYS calendar days; null until notice is given."
        default: null
      - name: of_record
        type: boolean
        source: computed
        description: "True only for the single appointment the agent_of_record_selector ranks first for its registration."
        default: false

  - name: ComplianceObligation
    parent: Registration
    common_fields: true
    fields:
      - name: registration_id
        type: string
        source: input
        description: "FK -> Registration.id; supplied by the path segment on creation."
      - name: governing_rule_id
        type: string
        source: computed
        description: "FK -> StateRule.id; pinned once at creation to the rule version effective on rule_determination_date and never re-resolved."
      - name: obligation_type
        type: enum
        source: input
        description: "Which statutory obligation this calendar row represents."
        constraints: "one of ANNUAL_REPORT, FRANCHISE_TAX, BOI_INITIAL, BOI_UPDATE, FINAL_REPORT"
      - name: period_year
        type: integer
        source: input
        description: "Reporting period year the obligation covers."
        constraints: "2020..2039"
      - name: rule_determination_date
        type: string
        source: system
        description: "ISO date of the logical clock at creation; the date at which governing_rule_id was resolved."
      - name: due_date
        type: string
        source: computed
        description: "ISO date produced by the annual_report_due_date calculation under the governing rule."
      - name: grace_end_date
        type: string
        source: computed
        description: "ISO date produced by the grace_end_date calculation under the governing rule."
      - name: delinquency_date
        type: string
        source: computed
        description: "grace_end_date + governing_rule.delinquency_to_dissolution_days calendar days."
      - name: status
        type: enum
        source: system
        description: "Calendar status; advances monotonically and never regresses to an earlier rung."
        default: "SCHEDULED"
        constraints: "one of SCHEDULED, DUE_SOON, IN_GRACE, DELINQUENT, SATISFIED, WAIVED, VOIDED"
      - name: state_fee_cents
        type: integer
        source: computed
        description: "State filing fee component drawn from the governing rule."
        default: 0
      - name: franchise_tax_cents
        type: integer
        source: computed
        description: "Franchise-tax component produced by the franchise_tax_amount calculation; 0 unless obligation_type == FRANCHISE_TAX."
        default: 0
      - name: late_fee_cents
        type: integer
        source: computed
        description: "Late-fee component produced by the late_fee_amount calculation; recomputed on every ops-run and on filing creation."
        default: 0
      - name: service_fee_cents
        type: integer
        source: computed
        description: "Service-fee component produced by the obligation_service_fee calculation; pinned once at creation and never recomputed."
        default: 4900
      - name: total_due_cents
        type: integer
        source: computed
        description: "state_fee_cents + franchise_tax_cents + late_fee_cents + service_fee_cents."
        default: 0
      - name: satisfied_on
        type: string
        source: system
        description: "ISO date the obligation reached SATISFIED, WAIVED or VOIDED; null otherwise."
        default: null

  - name: ReminderNotice
    parent: ComplianceObligation
    common_fields: true
    fields:
      - name: compliance_obligation_id
        type: string
        source: input
        description: "FK -> ComplianceObligation.id; created by the system alongside the obligation."
      - name: offset_label
        type: enum
        source: system
        description: "Which rung of the reminder ladder this notice occupies."
        constraints: "one of T_MINUS_90, T_MINUS_60, T_MINUS_30, T_MINUS_7, OVERDUE"
      - name: scheduled_for
        type: string
        source: computed
        description: "ISO date the notice becomes sendable, produced by the reminder_schedule calculation."
      - name: due_date_snapshot
        type: string
        source: system
        description: "The obligation's due_date at the moment this notice row was created; part of the idempotency key."
      - name: status
        type: enum
        source: system
        description: "Notice state."
        default: "PENDING"
        constraints: "one of PENDING, SENT, SUPPRESSED, REARMED"
      - name: sent_on
        type: string
        source: system
        description: "ISO date the notice flipped to SENT; null otherwise."
        default: null

  - name: Filing
    parent: Registration
    common_fields: true
    fields:
      - name: registration_id
        type: string
        source: input
        description: "FK -> Registration.id; the jurisdiction the filing is lodged in."
      - name: compliance_obligation_id
        type: string
        source: input
        description: "FK -> ComplianceObligation.id; null for standalone filings (foreign qualification, withdrawal, dissolution, reinstatement)."
        default: null
      - name: good_standing_certificate_id
        type: string
        source: input
        description: "FK -> GoodStandingCertificate.id; carried on foreign-qualification filings, null otherwise."
        default: null
      - name: filing_kind
        type: enum
        source: input
        description: "Which document is being lodged."
        constraints: "one of ANNUAL_REPORT, FRANCHISE_TAX, FOREIGN_QUALIFICATION, WITHDRAWAL, DISSOLUTION, REINSTATEMENT, FINAL_REPORT"
      - name: expedite_tier
        type: enum
        source: input
        description: "Expedite service level requested."
        default: "NONE"
        constraints: "one of NONE, STANDARD, RUSH, SAME_DAY"
      - name: status
        type: enum
        source: system
        description: "Filing lifecycle state."
        default: "DRAFT"
        constraints: "one of DRAFT, SUBMITTED, ACCEPTED, REJECTED, ABANDONED"
      - name: attempt_number
        type: integer
        source: system
        description: "1 for the first filing against an obligation; each refile increments it. Capped at MAX_REFILE_ATTEMPTS."
        default: 1
      - name: prepared_by_user_id
        type: string
        source: system
        description: "X-User-ID of the actor that created the draft."
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the actor that submitted the filing; null while DRAFT."
        default: null
      - name: submitted_on
        type: string
        source: system
        description: "ISO date of submission; null while DRAFT."
        default: null
      - name: outcome_recorded_on
        type: string
        source: system
        description: "ISO date the state's outcome was recorded; null until then."
        default: null
      - name: rejection_reason
        type: string
        source: input
        description: "Reason string recorded with a REJECTED outcome."
        default: null
      - name: refile_window_end
        type: string
        source: computed
        description: "outcome_recorded_on + REFILE_WINDOW_DAYS calendar days; set only on rejection."
        default: null
      - name: state_fee_cents
        type: integer
        source: computed
        description: "Non-refundable state-side portion of the filing, produced by the filing_fee_breakdown calculation."
        default: 0
      - name: service_fee_cents
        type: integer
        source: computed
        description: "Refundable service-side portion of the filing, produced by the filing_fee_breakdown calculation."
        default: 0
      - name: expedite_fee_cents
        type: integer
        source: computed
        description: "Expedite component, produced by the filing_fee_breakdown calculation; splits across the state and service portions."
        default: 0
      - name: state_portion_cents
        type: integer
        source: computed
        description: "state_fee_cents + the state share of expedite_fee_cents; never refundable."
        default: 0
      - name: service_portion_cents
        type: integer
        source: computed
        description: "service_fee_cents + the service share of expedite_fee_cents; refundable or carried on rejection."
        default: 0
      - name: total_fee_cents
        type: integer
        source: computed
        description: "state_portion_cents + service_portion_cents."
        default: 0
      - name: paid_amount_cents
        type: integer
        source: computed
        description: "Net sum of PaymentAllocation.amount_cents rows pointing at this filing, reversals included."
        default: 0

  - name: Payment
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; supplied by the path segment on creation."
      - name: authorized_amount_cents
        type: integer
        source: input
        description: "Amount authorized on the card at creation."
        constraints: "> 0"
      - name: captured_amount_cents
        type: integer
        source: computed
        description: "Amount actually captured; 0 until capture."
        default: 0
      - name: allocated_amount_cents
        type: integer
        source: computed
        description: "Net sum of this payment's PaymentAllocation.amount_cents, reversal rows included."
        default: 0
      - name: unallocated_amount_cents
        type: integer
        source: computed
        description: "Captured funds that the waterfall could not place on any candidate filing."
        default: 0
      - name: refunded_amount_cents
        type: integer
        source: computed
        description: "Service portions returned to the client's credit balance out of this payment."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Payment lifecycle state."
        default: "AUTHORIZED"
        constraints: "one of AUTHORIZED, CAPTURED, PARTIALLY_REFUNDED, REFUNDED, VOIDED"

  - name: PaymentAllocation
    parent: Payment
    common_fields: false
    fields:
      - name: payment_id
        type: string
        source: system
        description: "FK -> Payment.id; the payment this allocation draws on."
      - name: filing_id
        type: string
        source: system
        description: "FK -> Filing.id; the filing the money is placed on."
      - name: amount_cents
        type: integer
        source: computed
        description: "Signed amount placed on the filing; negative on a reversal row created when a rejected filing is abandoned."
      - name: state_portion_cents
        type: integer
        source: computed
        description: "State share of amount_cents, rounded first per the pinned rounding order."
      - name: service_portion_cents
        type: integer
        source: computed
        description: "amount_cents - state_portion_cents; absorbs the rounding remainder so the two always sum exactly to amount_cents."
      - name: sequence_index
        type: integer
        source: computed
        description: "0-based position of this row inside the waterfall pass that produced it."
      - name: is_reversal
        type: boolean
        source: computed
        description: "True on rows created by a refund compensation, false on forward allocations."
        default: false

  - name: SopDocument
    parent: Registration
    common_fields: true
    fields:
      - name: registration_id
        type: string
        source: input
        description: "FK -> Registration.id; the registration served. Supplied by the path segment on creation."
      - name: sop_class
        type: enum
        source: input
        description: "ORDINARY mail handling or LITIGATION, which pre-empts ordinary handling on the same registration."
        constraints: "one of ORDINARY, LITIGATION"
      - name: plaintiff_name
        type: string
        source: input
        description: "Plaintiff named on the papers; recorded on LITIGATION documents."
        default: null
      - name: court_case_number
        type: string
        source: input
        description: "Court case number; recorded on LITIGATION documents."
        default: null
      - name: received_at
        type: datetime
        source: system
        description: "Logical-clock instant the document was received at the agent's address."
      - name: scanned_at
        type: datetime
        source: system
        description: "Logical-clock instant the document was scanned; null until then."
        default: null
      - name: forwarded_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent forward; null until then."
        default: null
      - name: acknowledged_at
        type: datetime
        source: system
        description: "Logical-clock instant the client acknowledged receipt; null until then."
        default: null
      - name: forward_deadline_at
        type: datetime
        source: computed
        description: "Statutory forward deadline produced by the sop_forward_deadline calculation, in business hours; extended by deferrals."
      - name: ack_deadline_at
        type: datetime
        source: computed
        description: "Acknowledgment deadline produced by the sop_ack_deadline calculation; null until the first forward."
        default: null
      - name: escalation_level
        type: integer
        source: system
        description: "Number of escalations raised so far; capped at SOP_MAX_ESCALATION_LEVEL."
        default: 0
        constraints: "0..3"
      - name: deferred
        type: boolean
        source: system
        description: "True once an ORDINARY document has been pre-empted by a LITIGATION document on the same registration."
        default: false
      - name: deferral_count
        type: integer
        source: system
        description: "How many times this document's forward deadline has been pushed by a litigation pre-emption."
        default: 0
      - name: forwarded_late
        type: boolean
        source: computed
        description: "True when forwarded_at > forward_deadline_at, strictly."
        default: false
      - name: status
        type: enum
        source: system
        description: "Service-of-process handling state."
        default: "RECEIVED"
        constraints: "one of RECEIVED, SCANNED, FORWARDED, ESCALATED, ACKNOWLEDGED, REJECTED_NOT_OUR_ENTITY"

  - name: SopEscalationEvent
    parent: SopDocument
    common_fields: false
    fields:
      - name: sop_document_id
        type: string
        source: system
        description: "FK -> SopDocument.id; the document whose acknowledgment lapsed."
      - name: level
        type: integer
        source: computed
        description: "The escalation level this event represents, 1..SOP_MAX_ESCALATION_LEVEL."
      - name: raised_at
        type: datetime
        source: system
        description: "Logical-clock instant the escalation was raised."
      - name: channel
        type: enum
        source: computed
        description: "EMAIL at level 1, PHONE at level 2, ACCOUNT_MANAGER at level 3."
        constraints: "one of EMAIL, PHONE, ACCOUNT_MANAGER"

  - name: BoiReport
    parent: LegalEntity
    common_fields: true
    fields:
      - name: legal_entity_id
        type: string
        source: input
        description: "FK -> LegalEntity.id; supplied by the path segment on creation."
      - name: report_kind
        type: enum
        source: input
        description: "INITIAL for the first report, UPDATED for a change report."
        constraints: "one of INITIAL, UPDATED"
      - name: includes_company_applicant
        type: boolean
        source: input
        description: "Whether company-applicant details are included; required true when the entity's company_applicant_required is true."
        default: false
      - name: deadline_date
        type: string
        source: computed
        description: "Pinned at creation from the entity's boi_initial_deadline (INITIAL) or boi_update_deadline (UPDATED)."
      - name: triggering_change_date
        type: string
        source: computed
        description: "For UPDATED reports, the ISO date of the reportable change that armed the 30-day clock; null on INITIAL."
        default: null
      - name: owner_snapshot_count
        type: integer
        source: computed
        description: "Count of BeneficialOwner rows with owner_status == ACTIVE on the entity at the moment the report row was created."
        default: 0
      - name: submitted_on
        type: string
        source: system
        description: "ISO date of submission; null while DRAFT."
        default: null
      - name: accepted_on
        type: string
        source: system
        description: "ISO date the accepted outcome was recorded; null otherwise."
        default: null
      - name: status
        type: enum
        source: system
        description: "BOI report lifecycle state."
        default: "DRAFT"
        constraints: "one of DRAFT, SUBMITTED, ACCEPTED, REJECTED"

  - name: ReinstatementCase
    parent: Registration
    common_fields: true
    fields:
      - name: registration_id
        type: string
        source: input
        description: "FK -> Registration.id; supplied by the path segment on creation."
      - name: status
        type: enum
        source: system
        description: "Reinstatement case state."
        default: "OPEN"
        constraints: "one of OPEN, FEES_ASSESSED, PAID, FILED, GRANTED, DENIED, EXPIRED"
      - name: window_close_date
        type: string
        source: computed
        description: "Copied from Registration.reinstatement_deadline at case creation and never moved thereafter."
      - name: assessment_date
        type: string
        source: system
        description: "ISO date of the logical clock when fees were assessed; null before assessment."
        default: null
      - name: missed_period_count
        type: integer
        source: computed
        description: "Count of the registration's ComplianceObligation rows with status IN {IN_GRACE, DELINQUENT} at assessment time."
        default: 0
      - name: back_fee_total_cents
        type: integer
        source: computed
        description: "Produced by the reinstatement_back_fee_total calculation; per-period components use each obligation's own governing rule version."
        default: 0
      - name: obligations_cured_count
        type: integer
        source: computed
        description: "How many of the assessed obligations were flipped to SATISFIED when the case was granted."
        default: 0
      - name: denial_reason
        type: string
        source: input
        description: "Reason recorded with a denial."
        default: null

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: LegalEntity
    state_field: lifecycle_status
    shape: "branching with revert"
    initial_state: DRAFT
    terminal_states: [DISSOLVED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /legal-entities/{id}/activate"
        actor: ComplianceOfficer
        preconditions:
          - "lifecycle_status == DRAFT"
          - "at least one Registration with legal_entity_id == this entity and registration_kind == HOME exists"
        side_effects:
          - "sets lifecycle_status = ACTIVE"
          - "recomputes compliance_posture via registration_delinquency_rank rollup"
          - "increments LegalEntity.version by 1"
          - "recomputes Client.portfolio_entity_count and Client.portfolio_delinquency_status"
      - from: ACTIVE
        to: WINDING_DOWN
        trigger: "POST /legal-entities/{id}/begin-wind-down"
        actor: ComplianceOfficer
        preconditions:
          - "lifecycle_status == ACTIVE"
        side_effects:
          - "sets lifecycle_status = WINDING_DOWN"
          - "sets final_report_required = true"
          - "increments LegalEntity.version by 1"
      - from: WINDING_DOWN
        to: ACTIVE
        trigger: "POST /legal-entities/{id}/abort-wind-down"
        actor: ComplianceOfficer
        preconditions:
          - "lifecycle_status == WINDING_DOWN"
          - "no Filing with filing_kind == DISSOLUTION and status IN {SUBMITTED, ACCEPTED} exists on any Registration of this entity"
        side_effects:
          - "sets lifecycle_status = ACTIVE"
          - "leaves final_report_required = true (the final-report obligation survives the abort)"
          - "increments LegalEntity.version by 1"
        note: "Revert edge; final_report_required is deliberately NOT cleared."
      - from: WINDING_DOWN
        to: DISSOLVED
        trigger: "POST /legal-entities/{id}/dissolve"
        actor: ComplianceOfficer
        preconditions:
          - "lifecycle_status == WINDING_DOWN"
          - "every Registration of this entity has status IN {WITHDRAWN, TERMINATED, CLOSED_PERMANENT}"
          - "if final_report_required is true then every ComplianceObligation of this entity with obligation_type == FINAL_REPORT has status IN {SATISFIED, WAIVED}"
        side_effects:
          - "sets lifecycle_status = DISSOLVED"
          - "sets boi_status = NOT_REQUIRED on the parallel BOI axis"
          - "increments LegalEntity.version by 1"
          - "recomputes Client.portfolio_entity_count"

  - entity: LegalEntity
    state_field: boi_status
    shape: "parallel dimension (independent of lifecycle_status)"
    initial_state: PENDING_INITIAL
    terminal_states: [NOT_REQUIRED]
    transitions:
      - from: PENDING_INITIAL
        to: NOT_REQUIRED
        trigger: "PATCH /legal-entities/{id} setting boi_exempt_class to a value other than NONE"
        actor: ComplianceOfficer
        preconditions:
          - "boi_status == PENDING_INITIAL"
          - "requested boi_exempt_class != NONE"
        side_effects:
          - "sets boi_status = NOT_REQUIRED"
          - "sets boi_initial_deadline = null and boi_update_deadline = null"
          - "increments LegalEntity.version by 1"
      - from: NOT_REQUIRED
        to: PENDING_INITIAL
        trigger: "PATCH /legal-entities/{id} setting boi_exempt_class back to NONE"
        actor: ComplianceOfficer
        preconditions:
          - "boi_status == NOT_REQUIRED"
          - "lifecycle_status != DISSOLVED"
          - "requested boi_exempt_class == NONE"
        side_effects:
          - "sets boi_status = PENDING_INITIAL"
          - "recomputes boi_initial_deadline via the boi_initial_deadline calculation"
          - "increments LegalEntity.version by 1"
        note: "Cycle on the BOI axis; exemption can be claimed and withdrawn."
      - from: PENDING_INITIAL
        to: FILED
        trigger: "POST /boi-reports/{id}/record-outcome with outcome ACCEPTED on an INITIAL report"
        actor: FilingAgent
        preconditions:
          - "boi_status == PENDING_INITIAL"
          - "the BoiReport has report_kind == INITIAL and status == SUBMITTED"
        side_effects:
          - "sets boi_status = FILED"
          - "sets boi_update_deadline = null"
          - "increments LegalEntity.version by 1"
      - from: FILED
        to: UPDATE_DUE
        trigger: "System event: any BOI reportable field changes (PATCH /beneficial-owners/{id}, POST /legal-entities/{id}/beneficial-owners, or PATCH /legal-entities/{id} changing legal_name)"
        actor: system
        preconditions:
          - "boi_status == FILED"
        side_effects:
          - "sets boi_update_deadline = change date + BOI_UPDATE_DAYS calendar days"
          - "sets boi_status = UPDATE_DUE"
          - "increments LegalEntity.version by 1"
      - from: UPDATE_DUE
        to: UPDATE_DUE
        trigger: "System event: a further BOI reportable field changes while boi_status == UPDATE_DUE"
        actor: system
        preconditions:
          - "boi_status == UPDATE_DUE"
        side_effects:
          - "re-arms boi_update_deadline to the NEW change date + BOI_UPDATE_DAYS calendar days, discarding the previous deadline"
          - "increments LegalEntity.version by 1"
        note: "Self-loop: the 30-day clock is re-armed, never merely extended by carry-over."
      - from: UPDATE_DUE
        to: FILED
        trigger: "POST /boi-reports/{id}/record-outcome with outcome ACCEPTED on an UPDATED report"
        actor: FilingAgent
        preconditions:
          - "boi_status == UPDATE_DUE"
          - "the BoiReport has report_kind == UPDATED and status == SUBMITTED"
        side_effects:
          - "sets boi_status = FILED"
          - "sets boi_update_deadline = null"
          - "increments LegalEntity.version by 1"
      - from: UPDATE_DUE
        to: DELINQUENT
        trigger: "POST /_ops/advance-calendar when clock date > boi_update_deadline"
        actor: system
        preconditions:
          - "boi_status == UPDATE_DUE"
          - "clock date > boi_update_deadline"
        side_effects:
          - "sets boi_status = DELINQUENT"
          - "increments LegalEntity.version by 1"
      - from: PENDING_INITIAL
        to: DELINQUENT
        trigger: "POST /_ops/advance-calendar when clock date > boi_initial_deadline"
        actor: system
        preconditions:
          - "boi_status == PENDING_INITIAL"
          - "clock date > boi_initial_deadline"
        side_effects:
          - "sets boi_status = DELINQUENT"
          - "increments LegalEntity.version by 1"
      - from: DELINQUENT
        to: FILED
        trigger: "POST /boi-reports/{id}/record-outcome with outcome ACCEPTED"
        actor: FilingAgent
        preconditions:
          - "boi_status == DELINQUENT"
          - "the BoiReport has status == SUBMITTED"
        side_effects:
          - "sets boi_status = FILED"
          - "sets boi_update_deadline = null"
          - "increments LegalEntity.version by 1"

  - entity: Registration
    state_field: status
    shape: "cyclic (ACTIVE <-> DELINQUENT, ADMIN_DISSOLVED -> ACTIVE)"
    initial_state: PENDING
    terminal_states: [WITHDRAWN, TERMINATED, CLOSED_PERMANENT]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /registrations/{id}/activate"
        actor: FilingAgent
        preconditions:
          - "status == PENDING"
          - "an AgentAppointment with registration_id == this registration and status == APPOINTED exists"
        side_effects:
          - "sets status = ACTIVE and qualified_on = current clock date"
          - "recomputes agent_of_record_id via agent_of_record_selector"
          - "recomputes delinquency_rank"
          - "increments Registration.version by 1"
          - "recomputes LegalEntity.compliance_posture, then Client.portfolio_delinquency_status"
      - from: ACTIVE
        to: DELINQUENT
        trigger: "POST /_ops/advance-calendar when any of this registration's obligations reaches DELINQUENT"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "at least one ComplianceObligation of this registration has status == DELINQUENT"
        side_effects:
          - "sets status = DELINQUENT"
          - "sets delinquency_rank = RANK_DELINQUENT"
          - "increments Registration.version by 1"
          - "recomputes LegalEntity.compliance_posture, then Client.portfolio_delinquency_status"
      - from: DELINQUENT
        to: ACTIVE
        trigger: "System event: the last DELINQUENT obligation on this registration reaches SATISFIED or WAIVED (cascade hop 3 of the filing-acceptance chain)"
        actor: system
        preconditions:
          - "status == DELINQUENT"
          - "no ComplianceObligation of this registration has status == DELINQUENT"
        side_effects:
          - "sets status = ACTIVE"
          - "recomputes delinquency_rank from the remaining obligations"
          - "increments Registration.version by 1"
          - "recomputes LegalEntity.compliance_posture, then Client.portfolio_delinquency_status"
        note: "Cure edge; closes the ACTIVE -> DELINQUENT -> ACTIVE cycle."
      - from: DELINQUENT
        to: ADMIN_DISSOLVED
        trigger: "POST /registrations/{id}/administratively-dissolve, or POST /_ops/advance-calendar"
        actor: PlatformAdmin
        preconditions:
          - "status == DELINQUENT"
          - "at least one ComplianceObligation of this registration has status == DELINQUENT and current clock date > that obligation's delinquency_date"
        side_effects:
          - "sets status = ADMIN_DISSOLVED, admin_dissolved_on = current clock date"
          - "sets reinstatement_deadline via the reinstatement_window_close_date calculation"
          - "sets delinquency_rank = RANK_ADMIN_DISSOLVED"
          - "increments Registration.version by 1"
          - "recomputes LegalEntity.compliance_posture, then Client.portfolio_delinquency_status"
      - from: ADMIN_DISSOLVED
        to: ACTIVE
        trigger: "POST /reinstatement-cases/{id}/grant"
        actor: FilingAgent
        preconditions:
          - "status == ADMIN_DISSOLVED"
          - "the ReinstatementCase has status == FILED"
          - "current clock date <= Registration.reinstatement_deadline"
        side_effects:
          - "sets status = ACTIVE, admin_dissolved_on = null"
          - "flips every ComplianceObligation counted in the case's missed_period_count to SATISFIED with satisfied_on = current clock date"
          - "recomputes delinquency_rank"
          - "increments Registration.version by 1"
          - "recomputes LegalEntity.compliance_posture, then Client.portfolio_delinquency_status"
        note: "Reinstatement closes the ADMIN_DISSOLVED -> ACTIVE cycle."
      - from: ADMIN_DISSOLVED
        to: CLOSED_PERMANENT
        trigger: "POST /_ops/advance-calendar when clock date > reinstatement_deadline"
        actor: system
        preconditions:
          - "status == ADMIN_DISSOLVED"
          - "current clock date > reinstatement_deadline"
        side_effects:
          - "sets status = CLOSED_PERMANENT and closed_on = current clock date"
          - "sets every open ReinstatementCase on this registration to EXPIRED"
          - "voids every ComplianceObligation of this registration with status IN {SCHEDULED, DUE_SOON, IN_GRACE, DELINQUENT}"
          - "increments Registration.version by 1"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /registrations/{id}/withdraw"
        actor: FilingAgent
        preconditions:
          - "status == ACTIVE"
          - "registration_kind == FOREIGN"
          - "a Filing with filing_kind == WITHDRAWAL, this registration_id and status == ACCEPTED exists"
          - "if the governing StateRule has requires_tax_clearance == true then the request carries tax_clearance_reference"
        side_effects:
          - "sets status = WITHDRAWN and closed_on = current clock date"
          - "voids every ComplianceObligation of this registration with status IN {SCHEDULED, DUE_SOON, IN_GRACE, DELINQUENT}"
          - "sets every AgentAppointment of this registration with status IN {PROPOSED, APPOINTED, RESIGNATION_NOTICED} to RESIGNED"
          - "increments Registration.version by 1"
          - "recomputes LegalEntity.compliance_posture, then Client.portfolio_delinquency_status"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /registrations/{id}/terminate"
        actor: FilingAgent
        preconditions:
          - "status == ACTIVE"
          - "registration_kind == HOME"
          - "every FOREIGN Registration of the same LegalEntity has status IN {WITHDRAWN, CLOSED_PERMANENT}"
          - "a Filing with filing_kind == DISSOLUTION, this registration_id and status == ACCEPTED exists"
          - "if the governing StateRule has requires_tax_clearance == true then the request carries tax_clearance_reference"
        side_effects:
          - "sets status = TERMINATED and closed_on = current clock date"
          - "voids every ComplianceObligation of this registration with status IN {SCHEDULED, DUE_SOON, IN_GRACE, DELINQUENT} except obligation_type == FINAL_REPORT"
          - "sets every AgentAppointment of this registration with status IN {PROPOSED, APPOINTED, RESIGNATION_NOTICED} to RESIGNED"
          - "increments Registration.version by 1"
        note: "FINAL_REPORT obligations deliberately survive termination."

  - entity: AgentAppointment
    state_field: status
    shape: "branching fork-join with a bounded overlap window"
    initial_state: PROPOSED
    terminal_states: [RESIGNED, TRANSFERRED_OUT, REJECTED]
    transitions:
      - from: PROPOSED
        to: APPOINTED
        trigger: "POST /agent-appointments/{id}/accept"
        actor: FilingAgent
        preconditions:
          - "status == PROPOSED"
          - "the parent Registration has status IN {PENDING, ACTIVE, DELINQUENT}"
        side_effects:
          - "sets status = APPOINTED"
          - "sets any sibling AgentAppointment on the same registration with status == APPOINTED to TRANSFERRED_OUT and sets that sibling's superseded_by_appointment_id to this appointment's id"
          - "recomputes Registration.agent_of_record_id and every sibling's of_record via agent_of_record_selector"
          - "increments AgentAppointment.version by 1 and Registration.version by 1"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /agent-appointments/{id}/reject"
        actor: FilingAgent
        preconditions:
          - "status == PROPOSED"
        side_effects:
          - "sets status = REJECTED"
          - "increments AgentAppointment.version by 1"
      - from: APPOINTED
        to: RESIGNATION_NOTICED
        trigger: "POST /agent-appointments/{id}/notice-resignation"
        actor: ComplianceOfficer
        preconditions:
          - "status == APPOINTED"
          - "of_record == true"
        side_effects:
          - "sets status = RESIGNATION_NOTICED and resignation_noticed_on = current clock date"
          - "sets resignation_effective_on = resignation_noticed_on + AGENT_RESIGNATION_NOTICE_DAYS calendar days"
          - "keeps of_record == true for the whole notice window (priority_rank 0 in agent_of_record_selector)"
          - "increments AgentAppointment.version by 1 and Registration.version by 1"
      - from: APPOINTED
        to: TRANSFERRED_OUT
        trigger: "System event: a successor appointment on the same registration is accepted"
        actor: system
        preconditions:
          - "status == APPOINTED"
          - "a sibling AgentAppointment on the same registration transitions PROPOSED -> APPOINTED"
        side_effects:
          - "sets status = TRANSFERRED_OUT and superseded_by_appointment_id = the successor's id"
          - "sets of_record = false"
          - "increments AgentAppointment.version by 1"
      - from: RESIGNATION_NOTICED
        to: RESIGNED
        trigger: "POST /_ops/advance-calendar when clock date >= resignation_effective_on"
        actor: system
        preconditions:
          - "status == RESIGNATION_NOTICED"
          - "current clock date >= resignation_effective_on"
        side_effects:
          - "sets status = RESIGNED and of_record = false"
          - "recomputes Registration.agent_of_record_id via agent_of_record_selector"
          - "increments AgentAppointment.version by 1 and Registration.version by 1"
      - from: APPOINTED
        to: RESIGNED
        trigger: "System event: the parent Registration transitions to WITHDRAWN or TERMINATED"
        actor: system
        preconditions:
          - "status IN {PROPOSED, APPOINTED, RESIGNATION_NOTICED}"
          - "the parent Registration leaves ACTIVE for WITHDRAWN or TERMINATED"
        side_effects:
          - "sets status = RESIGNED and of_record = false"
          - "sets Registration.agent_of_record_id = null"
          - "increments AgentAppointment.version by 1"

  - entity: ComplianceObligation
    state_field: status
    shape: "monotone ladder converging on terminal states"
    initial_state: SCHEDULED
    terminal_states: [SATISFIED, WAIVED, VOIDED]
    transitions:
      - from: SCHEDULED
        to: DUE_SOON
        trigger: "POST /_ops/advance-calendar"
        actor: system
        preconditions:
          - "status == SCHEDULED"
          - "current clock date >= due_date - DUE_SOON_WINDOW_DAYS calendar days"
          - "current clock date <= due_date"
        side_effects:
          - "sets status = DUE_SOON"
          - "recomputes late_fee_cents and total_due_cents"
          - "increments ComplianceObligation.version by 1"
          - "recomputes Registration.delinquency_rank, LegalEntity.compliance_posture, Client.portfolio_delinquency_status"
      - from: DUE_SOON
        to: IN_GRACE
        trigger: "POST /_ops/advance-calendar"
        actor: system
        preconditions:
          - "status == DUE_SOON"
          - "current clock date > due_date"
          - "current clock date <= grace_end_date"
        side_effects:
          - "sets status = IN_GRACE"
          - "recomputes late_fee_cents and total_due_cents"
          - "increments ComplianceObligation.version by 1"
          - "recomputes Registration.delinquency_rank and the Client rollup"
      - from: IN_GRACE
        to: DELINQUENT
        trigger: "POST /_ops/advance-calendar"
        actor: system
        preconditions:
          - "status == IN_GRACE"
          - "current clock date > grace_end_date"
        side_effects:
          - "sets status = DELINQUENT"
          - "recomputes late_fee_cents and total_due_cents"
          - "increments ComplianceObligation.version by 1"
          - "drives the parent Registration ACTIVE -> DELINQUENT"
      - from: SCHEDULED
        to: DELINQUENT
        trigger: "POST /_ops/advance-calendar when the clock jumps past grace_end_date in a single step"
        actor: system
        preconditions:
          - "status == SCHEDULED"
          - "current clock date > grace_end_date"
        side_effects:
          - "sets status = DELINQUENT (intermediate rungs are skipped, never revisited)"
          - "recomputes late_fee_cents and total_due_cents"
          - "increments ComplianceObligation.version by 1"
          - "drives the parent Registration ACTIVE -> DELINQUENT"
      - from: SCHEDULED
        to: SATISFIED
        trigger: "POST /filings/{id}/record-outcome with outcome ACCEPTED"
        actor: FilingAgent
        preconditions:
          - "status IN {SCHEDULED, DUE_SOON, IN_GRACE, DELINQUENT}"
          - "the Filing has compliance_obligation_id == this obligation and status == SUBMITTED"
        side_effects:
          - "sets status = SATISFIED and satisfied_on = current clock date"
          - "sets every ReminderNotice of this obligation with status == PENDING to SUPPRESSED"
          - "increments ComplianceObligation.version by 1"
          - "cascade hop 3: if no DELINQUENT obligation remains, drives Registration DELINQUENT -> ACTIVE"
        note: "The same edge applies from DUE_SOON, IN_GRACE and DELINQUENT."
      - from: DELINQUENT
        to: WAIVED
        trigger: "POST /compliance-obligations/{id}/waive"
        actor: PlatformAdmin
        preconditions:
          - "status IN {DUE_SOON, IN_GRACE, DELINQUENT}"
        side_effects:
          - "sets status = WAIVED, satisfied_on = current clock date, total_due_cents = 0"
          - "sets every ReminderNotice of this obligation with status == PENDING to SUPPRESSED"
          - "increments ComplianceObligation.version by 1"
          - "recomputes Registration.delinquency_rank and the Client rollup"
      - from: SCHEDULED
        to: VOIDED
        trigger: "System event: the parent Registration reaches WITHDRAWN, TERMINATED or CLOSED_PERMANENT"
        actor: system
        preconditions:
          - "status IN {SCHEDULED, DUE_SOON, IN_GRACE, DELINQUENT}"
          - "obligation_type != FINAL_REPORT when the registration reaches TERMINATED"
        side_effects:
          - "sets status = VOIDED, satisfied_on = current clock date, total_due_cents = 0"
          - "sets every ReminderNotice of this obligation with status == PENDING to SUPPRESSED"
          - "increments ComplianceObligation.version by 1"

  - entity: ReminderNotice
    state_field: status
    shape: "branching with a re-arm edge"
    initial_state: PENDING
    terminal_states: [SUPPRESSED]
    transitions:
      - from: PENDING
        to: SENT
        trigger: "POST /_ops/advance-calendar"
        actor: system
        preconditions:
          - "status == PENDING"
          - "current clock date >= scheduled_for"
          - "the parent ComplianceObligation has status IN {SCHEDULED, DUE_SOON, IN_GRACE, DELINQUENT}"
          - "due_date_snapshot == the parent obligation's current due_date"
        side_effects:
          - "sets status = SENT and sent_on = current clock date"
          - "increments ReminderNotice.version by 1"
        note: "Idempotent: a second ops-run on the same clock date leaves the row SENT and creates no duplicate."
      - from: PENDING
        to: SUPPRESSED
        trigger: "System event: the parent ComplianceObligation reaches SATISFIED, WAIVED or VOIDED"
        actor: system
        preconditions:
          - "status == PENDING"
        side_effects:
          - "sets status = SUPPRESSED"
          - "increments ReminderNotice.version by 1"
      - from: SENT
        to: SUPPRESSED
        trigger: "System event: the parent ComplianceObligation reaches SATISFIED, WAIVED or VOIDED"
        actor: system
        preconditions:
          - "status == SENT"
        side_effects:
          - "sets status = SUPPRESSED"
          - "increments ReminderNotice.version by 1"
      - from: PENDING
        to: REARMED
        trigger: "POST /registrations/{id}/calendar-rebuild when the parent obligation's due_date moves"
        actor: ComplianceOfficer
        preconditions:
          - "status IN {PENDING, SENT}"
          - "due_date_snapshot != the parent obligation's new due_date"
        side_effects:
          - "sets status = REARMED"
          - "creates a fresh PENDING ReminderNotice row per REMINDER_OFFSETS_DAYS rung plus the OVERDUE rung, carrying the new due_date_snapshot"
          - "increments ReminderNotice.version by 1"

  - entity: Filing
    state_field: status
    shape: "cyclic with a capped retry count (REJECTED -> DRAFT -> SUBMITTED)"
    initial_state: DRAFT
    terminal_states: [ACCEPTED, ABANDONED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /filings/{id}/submit"
        actor: FilingAgent
        preconditions:
          - "status == DRAFT"
          - "X-User-ID != prepared_by_user_id"
          - "paid_amount_cents >= total_fee_cents"
          - "the parent Registration has status IN {PENDING, ACTIVE, DELINQUENT, ADMIN_DISSOLVED}"
        side_effects:
          - "sets status = SUBMITTED, submitted_on = current clock date, submitted_by_user_id = X-User-ID"
          - "increments Filing.version by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /filings/{id}/record-outcome with outcome ACCEPTED"
        actor: FilingAgent
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "sets status = ACCEPTED and outcome_recorded_on = current clock date"
          - "cascade hop 2: if compliance_obligation_id is set, drives that obligation to SATISFIED"
          - "increments Filing.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /filings/{id}/record-outcome with outcome REJECTED"
        actor: FilingAgent
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "sets status = REJECTED, outcome_recorded_on = current clock date, rejection_reason = the supplied reason"
          - "sets refile_window_end = outcome_recorded_on + REFILE_WINDOW_DAYS calendar days"
          - "retains the whole state_portion_cents (non-refundable) and holds service_portion_cents for carry"
          - "increments Filing.version by 1"
      - from: REJECTED
        to: ABANDONED
        trigger: "POST /filings/{id}/refile"
        actor: ComplianceOfficer
        preconditions:
          - "status == REJECTED"
          - "current clock date <= refile_window_end"
          - "attempt_number < MAX_REFILE_ATTEMPTS"
        side_effects:
          - "sets this filing's status = ABANDONED"
          - "creates a successor Filing in DRAFT with attempt_number = attempt_number + 1, the same registration_id, compliance_obligation_id and filing_kind"
          - "sets the successor's service_fee_cents to 0 (the predecessor's service portion is CARRIED, not refunded)"
          - "increments Filing.version by 1"
        note: "Closes the REJECTED -> DRAFT -> SUBMITTED cycle through a successor row; the cap is MAX_REFILE_ATTEMPTS."
      - from: REJECTED
        to: ABANDONED
        trigger: "POST /filings/{id}/abandon"
        actor: ComplianceOfficer
        preconditions:
          - "status == REJECTED"
        side_effects:
          - "sets status = ABANDONED"
          - "creates a reversal PaymentAllocation with is_reversal = true and amount_cents = -(the filing's allocated service portion) against each allocation that funded it"
          - "moves the reversed amount into Payment.refunded_amount_cents and Client.credit_balance_cents"
          - "sets the funding Payment.status to PARTIALLY_REFUNDED, or REFUNDED when refunded_amount_cents == captured_amount_cents"
          - "increments Filing.version by 1"
        note: "Compensating action; the state portion is permanently forfeited, the service portion is refunded."

  - entity: Payment
    state_field: status
    shape: "branching (capture path vs void path) with a partial-refund loop"
    initial_state: AUTHORIZED
    terminal_states: [REFUNDED, VOIDED]
    transitions:
      - from: AUTHORIZED
        to: CAPTURED
        trigger: "POST /payments/{id}/capture"
        actor: PlatformAdmin
        preconditions:
          - "status == AUTHORIZED"
          - "capture_amount_cents <= authorized_amount_cents"
        side_effects:
          - "sets status = CAPTURED and captured_amount_cents = capture_amount_cents"
          - "runs payment_allocation_waterfall, creating PaymentAllocation rows and setting allocated_amount_cents and unallocated_amount_cents"
          - "recomputes Filing.paid_amount_cents on each funded filing"
          - "increments Payment.version by 1"
      - from: AUTHORIZED
        to: VOIDED
        trigger: "POST /payments/{id}/void"
        actor: PlatformAdmin
        preconditions:
          - "status == AUTHORIZED"
        side_effects:
          - "sets status = VOIDED"
          - "increments Payment.version by 1"
      - from: CAPTURED
        to: PARTIALLY_REFUNDED
        trigger: "System event: a filing this payment funded is abandoned"
        actor: system
        preconditions:
          - "status == CAPTURED"
          - "0 < refunded_amount_cents < captured_amount_cents after the reversal"
        side_effects:
          - "sets status = PARTIALLY_REFUNDED"
          - "increments Payment.version by 1"
      - from: PARTIALLY_REFUNDED
        to: REFUNDED
        trigger: "System event: further abandonments bring refunded_amount_cents up to captured_amount_cents"
        actor: system
        preconditions:
          - "status == PARTIALLY_REFUNDED"
          - "refunded_amount_cents == captured_amount_cents"
        side_effects:
          - "sets status = REFUNDED"
          - "increments Payment.version by 1"
      - from: CAPTURED
        to: REFUNDED
        trigger: "System event: a single abandonment reverses the entire captured amount"
        actor: system
        preconditions:
          - "status == CAPTURED"
          - "refunded_amount_cents == captured_amount_cents after the reversal"
        side_effects:
          - "sets status = REFUNDED"
          - "increments Payment.version by 1"

  - entity: SopDocument
    state_field: status
    shape: "cyclic with a capped escalation counter (FORWARDED <-> ESCALATED)"
    initial_state: RECEIVED
    terminal_states: [ACKNOWLEDGED, REJECTED_NOT_OUR_ENTITY]
    transitions:
      - from: RECEIVED
        to: SCANNED
        trigger: "POST /sop-documents/{id}/scan"
        actor: SopHandler
        preconditions:
          - "status == RECEIVED"
        side_effects:
          - "sets status = SCANNED and scanned_at = the current logical clock instant"
          - "increments SopDocument.version by 1"
      - from: RECEIVED
        to: REJECTED_NOT_OUR_ENTITY
        trigger: "POST /sop-documents/{id}/scan with not_our_entity true"
        actor: SopHandler
        preconditions:
          - "status == RECEIVED"
        side_effects:
          - "sets status = REJECTED_NOT_OUR_ENTITY and scanned_at = the current logical clock instant"
          - "clears Registration.sop_priority_hold if no other LITIGATION document remains open"
          - "increments SopDocument.version by 1"
      - from: SCANNED
        to: FORWARDED
        trigger: "POST /sop-documents/{id}/forward"
        actor: SopHandler
        preconditions:
          - "status == SCANNED"
        side_effects:
          - "sets status = FORWARDED and forwarded_at = the current logical clock instant"
          - "sets forwarded_late = (forwarded_at > forward_deadline_at), strictly"
          - "sets ack_deadline_at via the sop_ack_deadline calculation"
          - "increments SopDocument.version by 1"
      - from: FORWARDED
        to: ESCALATED
        trigger: "POST /sop-documents/{id}/escalate"
        actor: SopHandler
        preconditions:
          - "status == FORWARDED"
          - "the current logical clock instant >= ack_deadline_at"
          - "escalation_level < SOP_MAX_ESCALATION_LEVEL"
        side_effects:
          - "sets status = ESCALATED and escalation_level = escalation_level + 1"
          - "cascade hop 2: creates a SopEscalationEvent with level = the new escalation_level, raised_at = now, channel per the sop_escalation_channel calculation"
          - "cascade hop 3: increments Client.sop_open_escalation_count and sets Client.portfolio_risk_flag = (sop_open_escalation_count >= SOP_RISK_FLAG_THRESHOLD)"
          - "sets ack_deadline_at = now advanced by SOP_ESCALATION_STEP_HOURS business hours"
          - "increments SopDocument.version by 1"
      - from: ESCALATED
        to: ESCALATED
        trigger: "POST /sop-documents/{id}/escalate again after the new ack deadline lapses"
        actor: SopHandler
        preconditions:
          - "status == ESCALATED"
          - "the current logical clock instant >= ack_deadline_at"
          - "escalation_level < SOP_MAX_ESCALATION_LEVEL"
        side_effects:
          - "increments escalation_level by 1 and creates the next SopEscalationEvent"
          - "increments Client.sop_open_escalation_count and re-evaluates Client.portfolio_risk_flag"
          - "sets ack_deadline_at = now advanced by SOP_ESCALATION_STEP_HOURS business hours"
          - "increments SopDocument.version by 1"
        note: "Self-loop capped at SOP_MAX_ESCALATION_LEVEL."
      - from: ESCALATED
        to: FORWARDED
        trigger: "POST /sop-documents/{id}/forward (re-forward)"
        actor: SopHandler
        preconditions:
          - "status == ESCALATED"
        side_effects:
          - "sets status = FORWARDED and forwarded_at = the current logical clock instant"
          - "recomputes ack_deadline_at via the sop_ack_deadline calculation"
          - "leaves escalation_level unchanged"
          - "increments SopDocument.version by 1"
        note: "Closes the FORWARDED -> ESCALATED -> FORWARDED cycle."
      - from: FORWARDED
        to: ACKNOWLEDGED
        trigger: "POST /sop-documents/{id}/acknowledge"
        actor: ClientContact
        preconditions:
          - "status IN {FORWARDED, ESCALATED}"
        side_effects:
          - "sets status = ACKNOWLEDGED and acknowledged_at = the current logical clock instant"
          - "decrements Client.sop_open_escalation_count by this document's escalation_level and re-evaluates Client.portfolio_risk_flag"
          - "clears Registration.sop_priority_hold when no other LITIGATION document on the registration remains open"
          - "increments SopDocument.version by 1"
      - from: ESCALATED
        to: ACKNOWLEDGED
        trigger: "POST /sop-documents/{id}/acknowledge"
        actor: ClientContact
        preconditions:
          - "status == ESCALATED"
        side_effects:
          - "sets status = ACKNOWLEDGED and acknowledged_at = the current logical clock instant"
          - "decrements Client.sop_open_escalation_count by this document's escalation_level and re-evaluates Client.portfolio_risk_flag"
          - "increments SopDocument.version by 1"

  - entity: BoiReport
    state_field: status
    shape: "cyclic (REJECTED re-drafts through a fresh report row)"
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /boi-reports/{id}/submit"
        actor: FilingAgent
        preconditions:
          - "status == DRAFT"
          - "the parent LegalEntity has boi_exempt_class == NONE"
          - "if the parent LegalEntity has company_applicant_required == true then includes_company_applicant == true"
        side_effects:
          - "sets status = SUBMITTED and submitted_on = current clock date"
          - "increments BoiReport.version by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /boi-reports/{id}/record-outcome with outcome ACCEPTED"
        actor: FilingAgent
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "sets status = ACCEPTED and accepted_on = current clock date"
          - "drives the parent LegalEntity's boi_status axis to FILED and clears boi_update_deadline"
          - "increments BoiReport.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /boi-reports/{id}/record-outcome with outcome REJECTED"
        actor: FilingAgent
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "sets status = REJECTED"
          - "leaves the parent LegalEntity's boi_status unchanged, so a fresh report row can be created against the same deadline"
          - "increments BoiReport.version by 1"

  - entity: ReinstatementCase
    state_field: status
    shape: "branching with a denial retry loop"
    initial_state: OPEN
    terminal_states: [GRANTED, EXPIRED]
    transitions:
      - from: OPEN
        to: FEES_ASSESSED
        trigger: "POST /reinstatement-cases/{id}/assess-fees"
        actor: ComplianceOfficer
        preconditions:
          - "status IN {OPEN, DENIED}"
          - "current clock date <= window_close_date"
        side_effects:
          - "sets status = FEES_ASSESSED and assessment_date = current clock date"
          - "sets missed_period_count and back_fee_total_cents via the reinstatement_back_fee_total calculation"
          - "increments ReinstatementCase.version by 1"
      - from: FEES_ASSESSED
        to: PAID
        trigger: "System event: a Filing with filing_kind == REINSTATEMENT on this registration reaches paid_amount_cents >= total_fee_cents"
        actor: system
        preconditions:
          - "status == FEES_ASSESSED"
          - "a REINSTATEMENT Filing on this registration has paid_amount_cents >= total_fee_cents"
        side_effects:
          - "sets status = PAID"
          - "increments ReinstatementCase.version by 1"
      - from: PAID
        to: FILED
        trigger: "System event: the REINSTATEMENT Filing reaches SUBMITTED"
        actor: system
        preconditions:
          - "status == PAID"
        side_effects:
          - "sets status = FILED"
          - "increments ReinstatementCase.version by 1"
      - from: FILED
        to: GRANTED
        trigger: "POST /reinstatement-cases/{id}/grant"
        actor: FilingAgent
        preconditions:
          - "status == FILED"
          - "current clock date <= window_close_date"
          - "the parent Registration has status == ADMIN_DISSOLVED"
        side_effects:
          - "sets status = GRANTED and obligations_cured_count = missed_period_count"
          - "drives the parent Registration ADMIN_DISSOLVED -> ACTIVE"
          - "increments ReinstatementCase.version by 1"
      - from: FILED
        to: DENIED
        trigger: "POST /reinstatement-cases/{id}/deny"
        actor: FilingAgent
        preconditions:
          - "status == FILED"
        side_effects:
          - "sets status = DENIED and denial_reason = the supplied reason"
          - "increments ReinstatementCase.version by 1"
      - from: DENIED
        to: FEES_ASSESSED
        trigger: "POST /reinstatement-cases/{id}/assess-fees"
        actor: ComplianceOfficer
        preconditions:
          - "status == DENIED"
          - "current clock date <= window_close_date"
        side_effects:
          - "sets status = FEES_ASSESSED and re-assesses back_fee_total_cents at the new assessment_date"
          - "increments ReinstatementCase.version by 1"
        note: "Retry loop after a denial."
      - from: OPEN
        to: EXPIRED
        trigger: "POST /_ops/advance-calendar when clock date > window_close_date"
        actor: system
        preconditions:
          - "status IN {OPEN, FEES_ASSESSED, PAID, FILED, DENIED}"
          - "current clock date > window_close_date"
        side_effects:
          - "sets status = EXPIRED"
          - "increments ReinstatementCase.version by 1"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: filing-create-stale-obligation
    parent_entity: ComplianceObligation
    write_endpoint: "POST /compliance-obligations/{id}/filings"
    occ_field: "expected_compliance_obligation_version"
    description: |
      Creating a Filing against a ComplianceObligation whose version has advanced
      since the client last observed it is rejected. A newly created filing
      legitimately supersedes any prior DRAFT filing on the same obligation, and
      an ops-run may have re-priced the obligation's late_fee_cents, so a writer
      holding a stale view of the obligation must re-read before filing.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: agent-appointment-create-stale-registration
    parent_entity: Registration
    write_endpoint: "POST /registrations/{id}/agent-appointments"
    occ_field: "expected_registration_version"
    description: |
      Creating an AgentAppointment against a Registration whose version has
      advanced since the client last observed it is rejected. Accepting an
      appointment legitimately supersedes the incumbent, so a writer working from
      a stale registration view could transfer away an agent it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: boi-report-create-stale-entity
    parent_entity: LegalEntity
    write_endpoint: "POST /legal-entities/{id}/boi-reports"
    occ_field: "expected_legal_entity_version"
    description: |
      Creating a BoiReport against a LegalEntity whose version has advanced since
      the client last observed it is rejected. Any reportable-field change re-arms
      boi_update_deadline and bumps the entity's version, so a report drafted
      against a stale view would be pinned to a superseded deadline.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: governing_state_rule_selection
    trigger: "Whenever a jurisdiction-specific number is needed: obligation creation, foreign qualification, withdrawal, dissolution, reinstatement fee assessment."
    algorithm: selector_policy
    formula: |
      candidates = [r for r in StateRule
                    if r.state_code == target_state_code
                    and r.effective_from <= determination_date
                    and (r.effective_to is null or determination_date < r.effective_to)]
      # ranking: latest effective_from wins
      rank_key   = (r.effective_from DESC, r.created_at DESC)
      if candidates is empty: raise ERR_NO_EFFECTIVE_STATE_RULE
      return candidates sorted by rank_key -> first
    input_set: "All StateRule rows for the target state_code. effective_from is inclusive; effective_to is EXCLUSIVE (a determination_date equal to effective_to falls to the successor row)."
    constants: {}
    precision: "date comparison at day granularity"
    tie_break: "created_at DESC when two rows share effective_from"
    empty_set_fallback: "ERR_NO_EFFECTIVE_STATE_RULE (422)"
    note: |
      determination_date is the LOGICAL CLOCK DATE at the moment the consuming row is
      created, and is persisted as ComplianceObligation.rule_determination_date. It is
      never re-resolved: a later StateRule version does NOT retroactively move an
      obligation that was already determined.

  - name: observed_business_day_roll_forward
    trigger: "Applied to every raw annual-report due date and to every step of a BUSINESS_DAYS grace count."
    algorithm: calendar_derivation
    formula: |
      roll(D):
        while weekday_name(D) in WEEKEND_DAYS or iso(D) in OBSERVED_HOLIDAYS:
          D = D + 1 day
        return D
    input_set: "A single ISO date."
    constants:
      WEEKEND_DAYS: ["SATURDAY", "SUNDAY"]
      OBSERVED_HOLIDAYS_REF: "see top-level constants.OBSERVED_HOLIDAYS (24 dates, 2026-2029)"
    precision: "day granularity; the roll always moves forward, never backward"

  - name: annual_report_due_date
    trigger: "POST /registrations/{id}/compliance-obligations and POST /registrations/{id}/calendar-rebuild"
    algorithm: calendar_derivation
    formula: |
      rule = governing_state_rule_selection(registration.state_code, determination_date)
      if rule.annual_report_basis == "ANNIVERSARY_MONTH_DAY":
          m   = month_of(entity.formation_date)
          d   = min(day_of(entity.formation_date), days_in_month(period_year, m))
          raw = date(period_year, m, d)
      elif rule.annual_report_basis == "FIXED_CALENDAR_DATE":
          m   = rule.fixed_due_month
          d   = min(rule.fixed_due_day, days_in_month(period_year, m))
          raw = date(period_year, m, d)
      else:  # FISCAL_YEAR_END_OFFSET
          m   = entity.fiscal_year_end_month
          d   = min(entity.fiscal_year_end_day, days_in_month(period_year, m))
          raw = date(period_year, m, d) + rule.fiscal_offset_days days
      due_date = observed_business_day_roll_forward(raw)
    input_set: "The obligation's period_year, the parent LegalEntity's formation_date / fiscal year end, and the pinned governing StateRule row."
    constants: {}
    precision: "day granularity"
    variants:
      - name: anniversary_clamped
        when: "rule.annual_report_basis == ANNIVERSARY_MONTH_DAY"
        difference: "Month and day come from formation_date; the day is clamped down to the target month's length, so a Jan-31 formation lands on Feb 28/29 in a February-month state."
      - name: fixed_calendar
        when: "rule.annual_report_basis == FIXED_CALENDAR_DATE"
        difference: "Ignores formation_date entirely; every entity in the state shares one due date."
      - name: fiscal_offset
        when: "rule.annual_report_basis == FISCAL_YEAR_END_OFFSET"
        difference: "Anchored on the entity's fiscal year end plus a calendar-day offset, so two entities in the SAME state get different due dates."

  - name: grace_end_date
    trigger: "Computed alongside annual_report_due_date on obligation creation and calendar rebuild."
    algorithm: calendar_derivation
    formula: |
      if rule.grace_basis == "CALENDAR_DAYS":
          grace_end = due_date + rule.grace_days days           # NOT rolled
      else:  # BUSINESS_DAYS
          D = due_date
          repeat rule.grace_days times:
              D = observed_business_day_roll_forward(D + 1 day)
          grace_end = D                                          # always a business day
    input_set: "due_date plus the pinned governing StateRule row."
    constants: {}
    precision: "day granularity"
    boundary_semantics: "A filing recorded ON grace_end_date is still inside grace (days_late == 0). The first late day is grace_end_date + 1."
    variants:
      - name: calendar_grace
        when: "rule.grace_basis == CALENDAR_DAYS"
        difference: "Raw calendar addition; the result MAY be a weekend or observed holiday and is deliberately not rolled."
      - name: business_grace
        when: "rule.grace_basis == BUSINESS_DAYS"
        difference: "Each of the grace_days steps skips weekends and observed holidays, so the same grace_days value yields a strictly later date than the calendar variant whenever the window spans a weekend."

  - name: delinquency_date
    trigger: "Computed alongside grace_end_date."
    algorithm: calendar_derivation
    formula: |
      delinquency_date = grace_end_date + rule.delinquency_to_dissolution_days days
    input_set: "grace_end_date plus the pinned governing StateRule row."
    constants: {}
    precision: "day granularity; no weekend roll"

  - name: franchise_tax_amount
    trigger: "Obligation creation and calendar rebuild, for obligation_type == FRANCHISE_TAX only."
    algorithm: tiered_pricing
    formula: |
      if obligation_type != "FRANCHISE_TAX": return 0
      if rule.franchise_tax_basis == "FLAT":
          return rule.flat_franchise_tax_cents
      if rule.franchise_tax_basis == "AUTHORIZED_SHARES_TIERS":
          tiers = rule.authorized_shares_tiers sorted by up_to_shares ASC, null last
          for t in tiers:
              if t.up_to_shares is null or entity.authorized_shares <= t.up_to_shares:
                  return t.tax_cents
          return 0
      if rule.franchise_tax_basis == "ASSUMED_PAR_VALUE":
          if entity.authorized_shares == 0: apc = 0
          else: apc = round_half_up(entity.total_gross_assets_cents * entity.issued_shares / entity.authorized_shares)
          raw = round_half_up(apc * rule.assumed_par_value_rate_bps / 10000)
          return max(rule.min_franchise_tax_cents, min(raw, rule.max_franchise_tax_cents))
      # GROSS_RECEIPTS_BRACKETS
      brackets = rule.gross_receipts_brackets sorted by up_to_cents ASC, null last
      for b in brackets:
          if b.up_to_cents is null or entity.annual_gross_receipts_cents <= b.up_to_cents:
              return b.tax_cents
      return 0
    input_set: "The parent LegalEntity's share/asset/receipt fields and the pinned governing StateRule row. Only obligations with obligation_type == FRANCHISE_TAX are in scope; every other type contributes 0."
    constants: {}
    precision: "integer cents, round_half_up; the ASSUMED_PAR_VALUE branch rounds the assumed par capital FIRST, then rounds the tax, then clamps"
    boundary_semantics: "Tier selection uses <= (a value exactly equal to up_to_shares stays in that tier). The clamp applies only to the ASSUMED_PAR_VALUE branch."
    variants:
      - name: flat_basis
        when: "rule.franchise_tax_basis == FLAT"
        difference: "One number for every entity, independent of size."
      - name: authorized_shares_tiers
        when: "rule.franchise_tax_basis == AUTHORIZED_SHARES_TIERS"
        difference: "Step function on authorized_shares; issued_shares and assets are ignored."
      - name: assumed_par_value
        when: "rule.franchise_tax_basis == ASSUMED_PAR_VALUE"
        difference: "Continuous function of assets x issued/authorized ratio with a two-sided clamp; the only branch where min/max_franchise_tax_cents bite."
      - name: gross_receipts_brackets
        when: "rule.franchise_tax_basis == GROSS_RECEIPTS_BRACKETS"
        difference: "Step function on annual_gross_receipts_cents; share counts are ignored entirely."

  - name: late_fee_amount
    trigger: "Recomputed on every POST /_ops/advance-calendar and on every filing creation against an obligation."
    algorithm: threshold
    formula: |
      days_late = max(0, (assessment_date - obligation.grace_end_date) in days)
      if days_late == 0: return 0
      if rule.late_fee_style == "FLAT":
          return rule.late_fee_flat_cents
      if rule.late_fee_style == "PER_MONTH":
          months_late = ceil(days_late / LATE_FEE_MONTH_BLOCK_DAYS)
          return months_late * rule.late_fee_per_month_cents
      # PERCENT_CAPPED
      base = obligation.state_fee_cents + obligation.franchise_tax_cents
      raw  = round_half_up(base * rule.late_fee_percent_bps / 10000)
      return min(raw, rule.late_fee_cap_cents)
    input_set: "assessment_date is the LOGICAL CLOCK DATE at the moment of recomputation. The obligation's own pinned governing StateRule row supplies the style and the rates."
    constants:
      LATE_FEE_MONTH_BLOCK_DAYS: 30
    precision: "integer cents, round_half_up"
    boundary_semantics: "days_late == 0 on grace_end_date itself yields 0. days_late == 1 already yields one full PER_MONTH block. The PERCENT_CAPPED cap is inclusive: a raw value exactly equal to late_fee_cap_cents is NOT reduced."
    variants:
      - name: flat_late_fee
        when: "rule.late_fee_style == FLAT"
        difference: "One charge no matter how late; day 1 and day 400 cost the same."
      - name: per_month_late_fee
        when: "rule.late_fee_style == PER_MONTH"
        difference: "Unbounded ceil-block accrual; grows without limit."
      - name: percent_capped_late_fee
        when: "rule.late_fee_style == PERCENT_CAPPED"
        difference: "Proportional to the state fee plus franchise tax and therefore time-INDEPENDENT once late, but clamped by late_fee_cap_cents."

  - name: obligation_service_fee
    trigger: "POST /registrations/{id}/compliance-obligations, evaluated exactly once and never recomputed."
    algorithm: threshold
    formula: |
      # Evaluation order is PINNED to break the apparent circularity:
      # portfolio_open_obligation_count counts the obligation being created,
      # but the discount is keyed on the count BEFORE the insert.
      prior_open_count = count of ComplianceObligation rows with
          status IN {SCHEDULED, DUE_SOON, IN_GRACE, DELINQUENT}
          across every Registration of every LegalEntity of the owning Client,
          measured BEFORE this new row is inserted
      if prior_open_count >= VOLUME_DISCOUNT_THRESHOLD_OPEN_OBLIGATIONS:
          discount = round_half_up(SERVICE_FEE_BASE_CENTS * VOLUME_DISCOUNT_BPS / 10000)
      else:
          discount = 0
      service_fee_cents = SERVICE_FEE_BASE_CENTS - discount
    input_set: "Every ComplianceObligation of the owning Client in one of the four open statuses, evaluated pre-insert. Obligations in SATISFIED, WAIVED or VOIDED are excluded."
    constants:
      SERVICE_FEE_BASE_CENTS: 4900
      VOLUME_DISCOUNT_THRESHOLD_OPEN_OBLIGATIONS: 5
      VOLUME_DISCOUNT_BPS: 1500
    precision: "integer cents, round_half_up; 4900 * 1500 / 10000 = 735, so the discounted fee is exactly 4165"
    boundary_semantics: "prior_open_count == 4 -> no discount (4900). prior_open_count == 5 -> discount applies (4165). The comparison is >=."
    note: "This is the pinned resolution of a circular-looking dependency: the fee feeds total_due_cents, which feeds the client rollup, which feeds the count the fee is keyed on."

  - name: obligation_total_due
    trigger: "Obligation creation, every ops-run recomputation, and every waive."
    algorithm: aggregation
    formula: |
      state_fee_cents = ANNUAL_REPORT or FINAL_REPORT -> rule.annual_report_fee_cents
                        FRANCHISE_TAX                 -> rule.franchise_tax_filing_fee_cents
                        BOI_INITIAL or BOI_UPDATE     -> 0
      franchise_tax_cents = franchise_tax_amount(...)
      late_fee_cents      = late_fee_amount(...)
      service_fee_cents   = obligation_service_fee(...)   # pinned at creation, never recomputed
      total_due_cents = state_fee_cents + franchise_tax_cents + late_fee_cents + service_fee_cents
    input_set: "The four components above, each already an integer cent value."
    constants: {}
    precision: "integer cents; each component is rounded to whole cents by its own calculation BEFORE the sum, never after"

  - name: filing_fee_breakdown
    trigger: "POST /compliance-obligations/{id}/filings, POST /registrations/{id}/filings, POST /filings/{id}/refile"
    algorithm: aggregation
    formula: |
      expedite_service = EXPEDITE_SERVICE_FEE_CENTS_NONE     if tier == "NONE"
                         EXPEDITE_SERVICE_FEE_CENTS_STANDARD if tier == "STANDARD"
                         EXPEDITE_SERVICE_FEE_CENTS_RUSH     if tier == "RUSH"
                         EXPEDITE_SERVICE_FEE_CENTS_SAME_DAY if tier == "SAME_DAY"
      expedite_state   = 0 if tier == "NONE" else rule.expedite_surcharge_cents
      expedite_fee_cents = expedite_service + expedite_state

      if filing.compliance_obligation_id is not null:
          state_fee_cents   = obligation.state_fee_cents + obligation.franchise_tax_cents + obligation.late_fee_cents
          service_fee_cents = obligation.service_fee_cents
      else:
          state_fee_cents   = FOREIGN_QUALIFICATION -> rule.foreign_qualification_fee_cents
                              WITHDRAWAL            -> rule.withdrawal_fee_cents
                              DISSOLUTION           -> rule.dissolution_fee_cents
                              REINSTATEMENT         -> reinstatement_case.back_fee_total_cents
          service_fee_cents = SERVICE_FEE_BASE_CENTS

      # a refile successor carries the predecessor's service portion
      if this filing was created by POST /filings/{id}/refile:
          service_fee_cents = 0

      state_portion_cents   = state_fee_cents   + expedite_state
      service_portion_cents = service_fee_cents + expedite_service
      total_fee_cents       = state_portion_cents + service_portion_cents
    input_set: "The filing's expedite_tier, its obligation (when obligation-backed) or its standalone kind, and the StateRule effective on the filing's creation date."
    constants:
      EXPEDITE_SERVICE_FEE_CENTS_NONE: 0
      EXPEDITE_SERVICE_FEE_CENTS_STANDARD: 5000
      EXPEDITE_SERVICE_FEE_CENTS_RUSH: 12500
      EXPEDITE_SERVICE_FEE_CENTS_SAME_DAY: 30000
      SERVICE_FEE_BASE_CENTS: 4900
    precision: "integer cents"
    note: "The state portion is permanently non-refundable; only the service portion can be refunded or carried."

  - name: payment_allocation_waterfall
    trigger: "POST /payments/{id}/capture"
    algorithm: waterfall_allocation
    formula: |
      if target_filing_id supplied:
          candidates = [that filing] if it satisfies the eligibility filter else raise ERR_ALLOCATION_TARGET_INVALID
      else:
          candidates = [f for f in Filing
                        where f.registration_id belongs to a LegalEntity whose client_id == payment.client_id
                        and f.status IN {DRAFT, SUBMITTED, REJECTED}
                        and f.paid_amount_cents < f.total_fee_cents]
      # ordering: earliest statutory deadline first
      due_key(f) = obligation.due_date if f.compliance_obligation_id is not null else "9999-12-31"
      order = sort by (due_key ASC, f.created_at ASC)

      remaining = capture_amount_cents
      idx = 0
      for f in order:
          need  = f.total_fee_cents - f.paid_amount_cents
          alloc = min(remaining, need)
          if alloc <= 0: continue
          state_portion   = round_half_up(alloc * f.state_portion_cents / f.total_fee_cents)
          service_portion = alloc - state_portion            # remainder absorbs the rounding
          create PaymentAllocation(payment_id, filing_id=f.id, amount_cents=alloc,
                                   state_portion_cents=state_portion,
                                   service_portion_cents=service_portion,
                                   sequence_index=idx, is_reversal=false)
          f.paid_amount_cents += alloc
          remaining -= alloc
          idx += 1
      payment.allocated_amount_cents   = capture_amount_cents - remaining
      payment.unallocated_amount_cents = remaining
    input_set: "Filings of the paying client in status DRAFT, SUBMITTED or REJECTED that are not yet fully paid. ACCEPTED and ABANDONED filings are excluded."
    constants: {}
    precision: "integer cents; round_half_up on the state portion FIRST, service portion = amount - state portion"
    tie_break: "created_at ASC when two candidate filings share the same due_key"
    empty_set_fallback: "no allocations are created and the whole captured amount lands in unallocated_amount_cents"
    note: |
      The rounding order is PINNED: rounding both portions independently would let
      state_portion + service_portion drift off amount_cents by a cent. Taking the
      service portion as the remainder makes the pair sum exactly, which is what the
      client_funds_identity invariant requires.

  - name: refund_split_on_rejection
    trigger: "POST /filings/{id}/refile and POST /filings/{id}/abandon, both acting on a REJECTED filing."
    algorithm: forward_looking
    formula: |
      allocated_state   = sum of PaymentAllocation.state_portion_cents   for this filing (forward rows only)
      allocated_service = sum of PaymentAllocation.service_portion_cents for this filing (forward rows only)
      if action == "refile" and clock_date <= filing.refile_window_end and attempt_number < MAX_REFILE_ATTEMPTS:
          # CARRY variant
          refund_to_credit = 0
          successor.service_fee_cents = 0     # the service portion is consumed by the successor
      else:
          # REFUND variant (abandon, or refile outside the window / over the cap)
          refund_to_credit = allocated_service
          create PaymentAllocation(is_reversal=true, amount_cents = -allocated_service,
                                   state_portion_cents = 0,
                                   service_portion_cents = -allocated_service)
          payment.refunded_amount_cents += allocated_service
          client.credit_balance_cents  += allocated_service
      # allocated_state is forfeited in BOTH variants
    input_set: "Forward PaymentAllocation rows funding the rejected filing. Reversal rows are excluded from the two sums."
    constants:
      MAX_REFILE_ATTEMPTS: 3
      REFILE_WINDOW_DAYS: 15
    precision: "integer cents"
    variants:
      - name: carry_within_window
        when: "a refile is performed on or before refile_window_end with attempt_number < MAX_REFILE_ATTEMPTS"
        difference: "Client.credit_balance_cents does NOT move; the service portion is consumed by the successor filing, whose service_fee_cents is 0."
      - name: refund_on_abandon
        when: "the filing is abandoned, or the refile window has lapsed"
        difference: "The service portion leaves the filing and lands in Client.credit_balance_cents through a negative reversal allocation; identical inputs therefore produce a different credit_balance_cents than the carry variant."

  - name: client_funds_identity
    trigger: "Invariant re-checked after every capture, refile, abandon and void."
    algorithm: aggregation
    formula: |
      for every Payment P:
        P.captured_amount_cents == P.allocated_amount_cents
                                 + P.unallocated_amount_cents
                                 + P.refunded_amount_cents
      for every Client C:
        C.credit_balance_cents == sum(P.refunded_amount_cents for P in payments of C)
    input_set: "All Payment rows of the client and all PaymentAllocation rows, reversal rows included in allocated_amount_cents as negatives."
    constants: {}
    precision: "exact integer equality; no tolerance"
    note: "Conserved quantity: money captured. Forward action = capture+allocate; compensating action = abandon+reverse."

  - name: agent_of_record_selector
    trigger: "Recomputed on every AgentAppointment transition, on Registration activation, and on every ops-run."
    algorithm: selector_policy
    formula: |
      candidates = [a for a in AgentAppointment
                    where a.registration_id == registration.id
                    and a.status IN {APPOINTED, RESIGNATION_NOTICED}
                    and (a.resignation_effective_on is null
                         or clock_date < a.resignation_effective_on)]     # STRICT <
      priority_rank(a) = 0 if a.status == "RESIGNATION_NOTICED" else 1
      order = sort by (priority_rank ASC, appointed_on ASC, created_at ASC)
      winner = order[0] if candidates else null
      for a in all appointments of the registration: a.of_record = (a is winner)
      registration.agent_of_record_id = winner.id if winner else null
    input_set: "AgentAppointment rows of one registration in status APPOINTED or RESIGNATION_NOTICED whose notice window has not closed. PROPOSED, RESIGNED, TRANSFERRED_OUT and REJECTED rows are excluded."
    constants:
      AGENT_RESIGNATION_NOTICE_DAYS: 30
    precision: "day granularity on the notice window"
    tie_break: "appointed_on ASC, then created_at ASC"
    empty_set_fallback: "registration.agent_of_record_id = null; no error is raised by the selector itself"
    boundary_semantics: "On resignation_effective_on itself the resigning appointment is NO LONGER a candidate (strict <), so the successor becomes of record on exactly that day."
    note: |
      Conserved quantity: for every Registration in status ACTIVE or DELINQUENT,
      count(of_record == true) is exactly 1 before and after a provider transfer.
      The RESIGNATION_NOTICED priority_rank of 0 is what keeps the resigning agent
      of record throughout the statutory notice window even though a successor with a
      later appointed_on already exists - the bounded overlap.

  - name: registration_delinquency_rank
    trigger: "Recomputed after every ComplianceObligation status change and on every ops-run."
    algorithm: aggregation
    formula: |
      if registration.status == "ADMIN_DISSOLVED" or registration.status == "CLOSED_PERMANENT":
          return RANK_ADMIN_DISSOLVED
      open_obs = [o for o in ComplianceObligation of this registration
                  if o.status IN {SCHEDULED, DUE_SOON, IN_GRACE, DELINQUENT}]
      if open_obs is empty: return RANK_CURRENT
      rank_of = {SCHEDULED: RANK_CURRENT, DUE_SOON: RANK_DUE_SOON,
                 IN_GRACE: RANK_IN_GRACE, DELINQUENT: RANK_DELINQUENT}
      return max(rank_of[o.status] for o in open_obs)
    input_set: "ComplianceObligation rows of this registration in one of the four open statuses; terminal obligations are excluded."
    constants:
      RANK_CURRENT: 0
      RANK_DUE_SOON: 1
      RANK_IN_GRACE: 2
      RANK_DELINQUENT: 3
      RANK_ADMIN_DISSOLVED: 4
    precision: "integer 0..4"

  - name: portfolio_rollup
    trigger: "Recomputed at the end of every mutation that touches an obligation, a registration or a legal entity."
    algorithm: aggregation
    formula: |
      open_status_set = {SCHEDULED, DUE_SOON, IN_GRACE, DELINQUENT}
      rows = every ComplianceObligation whose Registration belongs to a LegalEntity
             whose client_id == client.id, filtered to status IN open_status_set
      client.portfolio_open_obligation_count = count(rows)
      client.portfolio_outstanding_cents     = sum(o.total_due_cents for o in rows)
      client.portfolio_entity_count          = count(LegalEntity of the client with lifecycle_status != DISSOLVED)
      entity.compliance_posture              = rank_to_status(max(r.delinquency_rank for r in registrations of the entity), default RANK_CURRENT when none)
      client.portfolio_delinquency_status    = rank_to_status(max(r.delinquency_rank over ALL registrations of the client), default RANK_CURRENT when none)
      rank_to_status = {0: CURRENT, 1: DUE_SOON, 2: IN_GRACE, 3: DELINQUENT, 4: ADMIN_DISSOLVED}
    input_set: "All obligations of the client in the four open statuses; all registrations of the client regardless of status."
    constants:
      RANK_CURRENT: 0
      RANK_DUE_SOON: 1
      RANK_IN_GRACE: 2
      RANK_DELINQUENT: 3
      RANK_ADMIN_DISSOLVED: 4
    precision: "exact integer equality between the rollup and the sum of its parts"
    note: "Conserved quantity: open-obligation count and outstanding cents. The rollup MUST equal the sum of its parts after every mutation."

  - name: boi_initial_deadline
    trigger: "POST /clients/{id}/legal-entities, and PATCH /legal-entities/{id} when boi_exempt_class returns to NONE."
    algorithm: threshold
    formula: |
      if entity.boi_exempt_class != "NONE": return null
      if entity.formation_date < BOI_2024_BAND_START_DATE:
          return BOI_PRE_2024_DEADLINE_DATE
      if entity.formation_date < BOI_2025_BAND_START_DATE:
          return entity.formation_date + BOI_2024_FORMATION_DAYS days
      return entity.formation_date + BOI_POST_2024_FORMATION_DAYS days
    input_set: "The entity's formation_date and boi_exempt_class only. No weekend or holiday roll is applied - this is a federal filing deadline."
    constants:
      BOI_2024_BAND_START_DATE: "2024-01-01"
      BOI_2025_BAND_START_DATE: "2025-01-01"
      BOI_PRE_2024_DEADLINE_DATE: "2025-01-01"
      BOI_2024_FORMATION_DAYS: 90
      BOI_POST_2024_FORMATION_DAYS: 30
    precision: "day granularity, no roll-forward"
    boundary_semantics: "formation_date == 2024-01-01 falls in the 90-day band; formation_date == 2025-01-01 falls in the 30-day band. Both comparisons are strict <."
    variants:
      - name: pre_2024_fixed_deadline
        when: "formation_date < 2024-01-01"
        difference: "A single fixed calendar date shared by every legacy entity, independent of formation_date."
      - name: formed_during_2024
        when: "2024-01-01 <= formation_date < 2025-01-01"
        difference: "90 calendar days from formation."
      - name: formed_2025_or_later
        when: "formation_date >= 2025-01-01"
        difference: "30 calendar days from formation - the same entity formed one day later gets a 60-day-shorter runway."

  - name: boi_update_deadline
    trigger: "Any BOI reportable-field change: POST /legal-entities/{id}/beneficial-owners, PATCH /beneficial-owners/{id} touching full_name / residential_address / id_document_number / ownership_pct / owner_status, or PATCH /legal-entities/{id} changing legal_name."
    algorithm: decay_function
    formula: |
      if entity.boi_exempt_class != "NONE": return null      # exempt classes suppress the clock
      if entity.boi_status in {"FILED", "UPDATE_DUE", "DELINQUENT"}:
          entity.boi_update_deadline = change_date + BOI_UPDATE_DAYS days   # RE-ARMED from scratch
          entity.boi_status = "UPDATE_DUE"
      # while boi_status == PENDING_INITIAL the change does NOT arm an update clock
    input_set: "The five reportable BeneficialOwner fields plus LegalEntity.legal_name. date_of_birth and is_company_applicant are NOT reportable-change triggers."
    constants:
      BOI_UPDATE_DAYS: 30
    precision: "day granularity"
    note: "Re-arming discards the previous deadline entirely; a second change on day 20 of a 30-day clock resets the deadline to change_date + 30, it does not add 30."

  - name: sop_forward_deadline
    trigger: "POST /registrations/{id}/sop-documents"
    algorithm: interval_merge
    formula: |
      # business-hour cursor: Mon-Fri excluding OBSERVED_HOLIDAYS,
      # [BUSINESS_DAY_START_HOUR_UTC, BUSINESS_DAY_END_HOUR_UTC)
      advance_business_hours(T, H):
          if T is not on a business day or T >= 17:00 UTC:
              T = 09:00 UTC of the next business day
          elif T < 09:00 UTC:
              T = 09:00 UTC of the same day
          while H > 0:
              left = hours from T to 17:00 UTC of T's day
              if H <= left: return T + H hours
              H -= left
              T = 09:00 UTC of the next business day
          return T

      hours = SOP_LITIGATION_FORWARD_HOURS if sop_class == "LITIGATION"
              else SOP_ORDINARY_FORWARD_HOURS
      forward_deadline_at = advance_business_hours(received_at, hours)
    input_set: "The document's received_at instant (the logical clock at receipt) and its sop_class."
    constants:
      BUSINESS_DAY_START_HOUR_UTC: 9
      BUSINESS_DAY_END_HOUR_UTC: 17
      BUSINESS_HOURS_PER_DAY: 8
      SOP_ORDINARY_FORWARD_HOURS: 16
      SOP_LITIGATION_FORWARD_HOURS: 4
    precision: "whole hours on a business-hour cursor; the deadline never lands outside [09:00, 17:00] UTC on a business day"
    boundary_semantics: "forwarded_late is true only when forwarded_at is STRICTLY greater than forward_deadline_at; forwarding exactly at the deadline instant is on time."
    variants:
      - name: ordinary_mail_clock
        when: "sop_class == ORDINARY"
        difference: "16 business hours = two full business days, so a Friday receipt lands on Tuesday."
      - name: litigation_clock
        when: "sop_class == LITIGATION"
        difference: "4 business hours = half a business day; the same Friday receipt lands Friday afternoon or Monday morning, never later than the ordinary variant."

  - name: sop_deferral_on_litigation_preemption
    trigger: "POST /registrations/{id}/sop-documents with sop_class == LITIGATION"
    algorithm: constraint_propagation
    formula: |
      for each ORDINARY SopDocument O on the same registration
          with O.status IN {RECEIVED, SCANNED}:
          O.forward_deadline_at = advance_business_hours(O.forward_deadline_at,
                                                         SOP_DEFERRAL_BUSINESS_HOURS)
          O.deferred = true
          O.deferral_count = O.deferral_count + 1
      registration.sop_priority_hold = true
    input_set: "ORDINARY documents on the same registration that have not yet been forwarded. FORWARDED, ESCALATED, ACKNOWLEDGED and REJECTED_NOT_OUR_ENTITY documents are untouched."
    constants:
      SOP_DEFERRAL_BUSINESS_HOURS: 8
    precision: "business-hour cursor, same as sop_forward_deadline"

  - name: sop_ack_deadline
    trigger: "Every SCANNED -> FORWARDED and ESCALATED -> FORWARDED transition, and every escalation."
    algorithm: interval_merge
    formula: |
      on forward:   ack_deadline_at = advance_business_hours(forwarded_at, SOP_ACK_DEADLINE_HOURS)
      on escalate:  ack_deadline_at = advance_business_hours(now,          SOP_ESCALATION_STEP_HOURS)
    input_set: "The forward or escalation instant only."
    constants:
      SOP_ACK_DEADLINE_HOURS: 8
      SOP_ESCALATION_STEP_HOURS: 4
    precision: "business-hour cursor"
    boundary_semantics: "Escalation is permitted when the clock is at or after ack_deadline_at (>=); strictly before it raises ERR_SOP_ACK_NOT_DUE."

  - name: sop_escalation_channel
    trigger: "Each SopEscalationEvent creation."
    algorithm: threshold
    formula: |
      channel = "EMAIL"           if new_level == 1
                "PHONE"           if new_level == 2
                "ACCOUNT_MANAGER" if new_level == 3
    input_set: "The escalation level being raised."
    constants:
      SOP_MAX_ESCALATION_LEVEL: 3
    precision: "exact enum mapping"

  - name: good_standing_freshness
    trigger: "POST /legal-entities/{id}/foreign-qualifications"
    algorithm: threshold
    formula: |
      target_rule = governing_state_rule_selection(target_state_code, clock_date)
      age_days = (clock_date - certificate.issued_on) in days
      valid iff age_days < target_rule.good_standing_freshness_days      # STRICT <
    input_set: "The referenced GoodStandingCertificate.issued_on and the TARGET state's rule row (not the home state's)."
    constants: {}
    precision: "day granularity"
    boundary_semantics: "age_days == good_standing_freshness_days is STALE and raises ERR_CERTIFICATE_STALE; only age_days <= freshness_days - 1 is accepted. 'Within N days' is strict."

  - name: reinstatement_window_close_date
    trigger: "Registration DELINQUENT -> ADMIN_DISSOLVED, and POST /registrations/{id}/reinstatement-cases."
    algorithm: calendar_derivation
    formula: |
      rule = the StateRule effective on admin_dissolved_on for the registration's state_code
      registration.reinstatement_deadline = admin_dissolved_on + rule.reinstatement_window_days days
      case.window_close_date = registration.reinstatement_deadline   # copied once, never moved
    input_set: "admin_dissolved_on and the rule effective on that date."
    constants: {}
    precision: "day granularity, no roll-forward"
    boundary_semantics: "A case may be opened on window_close_date itself (<=); clock_date > window_close_date raises ERR_REINSTATEMENT_WINDOW_CLOSED."

  - name: reinstatement_back_fee_total
    trigger: "POST /reinstatement-cases/{id}/assess-fees"
    algorithm: chronological
    formula: |
      missed = [o for o in ComplianceObligation of the registration
                if o.status IN {IN_GRACE, DELINQUENT}]
              sorted by (period_year ASC, due_date ASC, created_at ASC)
      per_period_total = 0
      for o in missed:
          # PINNED: each period is priced under ITS OWN governing_rule_id,
          # the rule version in effect on that obligation's rule_determination_date
          r = StateRule[o.governing_rule_id]
          per_period_total += o.state_fee_cents
                            + franchise_tax_amount(o, r)
                            + late_fee_amount(o, r, assessment_date)
      # the reinstatement filing fee itself uses the CURRENT rule
      current = governing_state_rule_selection(registration.state_code, assessment_date)
      back_fee_total_cents = per_period_total + current.reinstatement_fee_cents
      missed_period_count  = count(missed)
    input_set: "Obligations of the registration in status IN_GRACE or DELINQUENT at assessment time. SATISFIED, WAIVED, VOIDED and SCHEDULED obligations are excluded."
    constants: {}
    precision: "integer cents; each per-period component is rounded by its own calculation before the sum"
    tie_break: "period_year ASC, then due_date ASC, then created_at ASC"
    variants:
      - name: period_rule_pricing
        when: "always - this is the pinned interpretation"
        difference: "Each missed period is priced under the StateRule version pinned on that obligation, so a fee increase enacted after the period does not apply retroactively."
      - name: current_rule_pricing
        when: "the rejected alternative reading, documented so the divergence is visible"
        difference: "Pricing every missed period under today's rule row produces a strictly different back_fee_total_cents whenever any rule version changed between the earliest missed period and the assessment date. The scaffold pins period_rule_pricing; only the reinstatement_fee_cents component uses the current rule."

  - name: reminder_schedule
    trigger: "Obligation creation (rows are minted PENDING), and POST /_ops/advance-calendar (rows flip to SENT)."
    algorithm: projection
    formula: |
      at creation, mint exactly these five rows, all with status = PENDING and
      due_date_snapshot = obligation.due_date:
          offset_label T_MINUS_90 -> scheduled_for = obligation.due_date - 90 days
          offset_label T_MINUS_60 -> scheduled_for = obligation.due_date - 60 days
          offset_label T_MINUS_30 -> scheduled_for = obligation.due_date - 30 days
          offset_label T_MINUS_7  -> scheduled_for = obligation.due_date - 7 days
          offset_label OVERDUE    -> scheduled_for = obligation.grace_end_date + OVERDUE_REMINDER_OFFSET_DAYS days
      (the four T_MINUS_* offsets are exactly the members of REMINDER_OFFSETS_DAYS)

      on each ops-run, for each ReminderNotice N with status == PENDING:
          if clock_date >= N.scheduled_for
             and N.due_date_snapshot == obligation.due_date
             and obligation.status IN {SCHEDULED, DUE_SOON, IN_GRACE, DELINQUENT}:
                 N.status = SENT; N.sent_on = clock_date
    input_set: "The five ladder rungs of one obligation. Idempotency key is (compliance_obligation_id, offset_label, due_date_snapshot)."
    constants:
      REMINDER_OFFSETS_DAYS: [90, 60, 30, 7]
      OVERDUE_REMINDER_OFFSET_DAYS: 1
    precision: "day granularity; scheduled_for is NOT rolled to a business day"
    boundary_semantics: "A rung fires when clock_date >= scheduled_for (inclusive). Re-running the ops-run on the same date creates no additional row and re-sends nothing."

  - name: obligation_status_advance
    trigger: "POST /_ops/advance-calendar"
    algorithm: threshold
    formula: |
      ladder = [SCHEDULED, DUE_SOON, IN_GRACE, DELINQUENT]     # index 0..3
      target = DELINQUENT if clock_date >  grace_end_date
               else IN_GRACE  if clock_date >  due_date
               else DUE_SOON  if clock_date >= due_date - DUE_SOON_WINDOW_DAYS days
               else SCHEDULED
      new_status = ladder[max(index(current_status), index(target))]   # MONOTONE
    input_set: "Obligations with status IN {SCHEDULED, DUE_SOON, IN_GRACE, DELINQUENT}. Terminal obligations are skipped."
    constants:
      DUE_SOON_WINDOW_DAYS: 30
    precision: "day granularity"
    boundary_semantics: |
      clock_date == due_date - 30           -> DUE_SOON   (>= is inclusive)
      clock_date == due_date                -> DUE_SOON   (the > for IN_GRACE is strict)
      clock_date == grace_end_date          -> IN_GRACE   (the > for DELINQUENT is strict)
      clock_date == grace_end_date + 1 day  -> DELINQUENT
    note: |
      The max() makes the ladder MONOTONE. A due_date that later moves forward - or a
      clock that is set to a nearer date - can never pull an obligation back to an
      earlier rung, so every carve-off keyed on DELINQUENT stays keyed on it.

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#     the FIRST rung that fails determines the response)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-blank."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of the five declared roles: PlatformAdmin, ComplianceOfficer, FilingAgent, SopHandler, ClientContact."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "The role is listed in the endpoint's roles set."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 4
    category: existence
    check: "The {id} segment under /clients resolves to a Client."
    error_id: ERR_CLIENT_NOT_FOUND
    http_status: 404
    applies_to: "every path of the form /clients/{id}..."
  - priority: 5
    category: existence
    check: "The {id} segment under /legal-entities resolves to a LegalEntity."
    error_id: ERR_LEGAL_ENTITY_NOT_FOUND
    http_status: 404
    applies_to: "every path of the form /legal-entities/{id}..."
  - priority: 6
    category: existence
    check: "The {id} segment under /registrations resolves to a Registration."
    error_id: ERR_REGISTRATION_NOT_FOUND
    http_status: 404
    applies_to: "every path of the form /registrations/{id}..."
  - priority: 7
    category: existence
    check: "The {id} segment under /compliance-obligations resolves to a ComplianceObligation."
    error_id: ERR_OBLIGATION_NOT_FOUND
    http_status: 404
    applies_to: "every path of the form /compliance-obligations/{id}..."
  - priority: 8
    category: existence
    check: "The {id} segment under /filings resolves to a Filing."
    error_id: ERR_FILING_NOT_FOUND
    http_status: 404
    applies_to: "every path of the form /filings/{id}..."
  - priority: 9
    category: existence
    check: "The {id} segment under /payments resolves to a Payment."
    error_id: ERR_PAYMENT_NOT_FOUND
    http_status: 404
    applies_to: "every path of the form /payments/{id}..."
  - priority: 10
    category: existence
    check: "The {id} segment under /sop-documents resolves to a SopDocument."
    error_id: ERR_SOP_NOT_FOUND
    http_status: 404
    applies_to: "every path of the form /sop-documents/{id}..."
  - priority: 11
    category: existence
    check: "The {id} segment under /beneficial-owners, /agent-appointments, /boi-reports, /name-clearances or /reinstatement-cases resolves to a row of the matching type; likewise a body-supplied name_clearance_id, good_standing_certificate_id or target_filing_id resolves to an existing row."
    error_id: ERR_RECORD_NOT_FOUND
    http_status: 404
    applies_to: "every path of the form /beneficial-owners/{id}..., /agent-appointments/{id}..., /boi-reports/{id}..., /name-clearances/{id}..., /reinstatement-cases/{id}..., plus any endpoint whose body carries name_clearance_id, good_standing_certificate_id, reinstatement_case_id or target_filing_id"
  - priority: 12
    category: auth
    check: "When the acting role is ClientContact, X-User-ID equals the Client.id that owns the addressed resource, resolved through the LegalEntity -> Registration chain."
    error_id: ERR_CROSS_CLIENT_ACCESS
    http_status: 403
    applies_to: "every endpoint whose roles list includes ClientContact"
  - priority: 13
    category: business_constraint
    check: "All required body fields are present, non-null and of the declared type; numeric fields honour their declared ranges; limit is in 1..100 and offset is >= 0."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 14
    category: business_constraint
    check: "Every enum-valued body field carries a declared member. This routes EXACTLY these fields and no others: LegalEntity.entity_type, LegalEntity.boi_exempt_class, BeneficialOwner.owner_status, StateRule.annual_report_basis, StateRule.franchise_tax_basis, StateRule.grace_basis, StateRule.late_fee_style, ComplianceObligation.obligation_type, Filing.filing_kind, Filing.expedite_tier, SopDocument.sop_class, BoiReport.report_kind, NameClearance.result, and the outcome field on record-outcome endpoints. No other field routes here."
    error_id: ERR_INVALID_ENUM
    http_status: 422
    applies_to: "POST and PATCH endpoints carrying one of the listed fields"
  - priority: 15
    category: state
    check: "expected_<parent>_version in the body equals the parent entity's current version."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /compliance-obligations/{id}/filings, POST /registrations/{id}/agent-appointments, POST /legal-entities/{id}/boi-reports"
  - priority: 16
    category: state
    check: "The target row's current state is listed as a `from:` state for the requested transition in its §1.2 machine, AND every precondition of that transition that no later rung covers more specifically holds. Concretely this rung also carries: a WITHDRAWAL Filing in status ACCEPTED must exist before a foreign registration is withdrawn; a DISSOLUTION Filing in status ACCEPTED must exist before the home registration is terminated; a BOI report with report_kind UPDATED requires the entity's boi_status == UPDATE_DUE; a HOME registration may not be withdrawn and a FOREIGN registration may not be terminated."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every action endpoint that drives a state machine"
  - priority: 17
    category: business_temporal
    check: "POST /_clock/set_current_utc target instant is greater than or equal to the current logical clock instant."
    error_id: ERR_CLOCK_REGRESSION
    http_status: 409
    applies_to: "POST /_clock/set_current_utc"
  - priority: 18
    category: business_referential
    check: "A StateRule row is effective for the target state_code on the determination date, per governing_state_rule_selection."
    error_id: ERR_NO_EFFECTIVE_STATE_RULE
    http_status: 422
    applies_to: "POST /legal-entities/{id}/registrations, POST /legal-entities/{id}/foreign-qualifications, POST /registrations/{id}/compliance-obligations, POST /registrations/{id}/filings, POST /reinstatement-cases/{id}/assess-fees"
  - priority: 19
    category: business_temporal
    check: "A new StateRule row's effective_from is strictly greater than the effective_from of the currently open row for the same state_code."
    error_id: ERR_EFFECTIVE_DATE_OVERLAP
    http_status: 409
    applies_to: "POST /state-rules"
  - priority: 20
    category: business_constraint
    check: "No other Registration for the same (legal_entity_id, state_code) currently occupies the interval: a row with status IN {PENDING, ACTIVE, DELINQUENT, ADMIN_DISSOLVED} blocks, and a closed row blocks when the new registration's start date is strictly before that row's closed_on."
    error_id: ERR_DUPLICATE_REGISTRATION
    http_status: 409
    applies_to: "POST /legal-entities/{id}/registrations, POST /legal-entities/{id}/foreign-qualifications"
  - priority: 21
    category: business_constraint
    check: "No ComplianceObligation with the same (registration_id, obligation_type, period_year) and status != VOIDED already exists."
    error_id: ERR_DUPLICATE_OBLIGATION
    http_status: 409
    applies_to: "POST /registrations/{id}/compliance-obligations"
  - priority: 22
    category: business_referential
    check: "BOI_INITIAL and BOI_UPDATE obligations may only be created on a Registration whose registration_kind == HOME."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /registrations/{id}/compliance-obligations"
  - priority: 23
    category: business_safety
    check: "The home Registration of the legal entity is not in status DELINQUENT, ADMIN_DISSOLVED or CLOSED_PERMANENT."
    error_id: ERR_HOME_STATE_DELINQUENT
    http_status: 409
    applies_to: "POST /legal-entities/{id}/foreign-qualifications"
  - priority: 24
    category: business_temporal
    check: "The referenced GoodStandingCertificate satisfies good_standing_freshness against the TARGET state's rule, strictly."
    error_id: ERR_CERTIFICATE_STALE
    http_status: 422
    applies_to: "POST /legal-entities/{id}/foreign-qualifications"
  - priority: 25
    category: business_constraint
    check: "The referenced NameClearance has result == AVAILABLE, or result == CONFLICT with a non-null fallback_assumed_name."
    error_id: ERR_NAME_CONFLICT_UNRESOLVED
    http_status: 409
    applies_to: "POST /legal-entities/{id}/foreign-qualifications"
  - priority: 26
    category: business_safety
    check: "When the governing StateRule has requires_tax_clearance == true, the request carries a non-blank tax_clearance_reference."
    error_id: ERR_TAX_CLEARANCE_REQUIRED
    http_status: 409
    applies_to: "POST /registrations/{id}/withdraw, POST /registrations/{id}/terminate"
  - priority: 27
    category: business_referential
    check: "Every FOREIGN Registration of the same LegalEntity has status IN {WITHDRAWN, CLOSED_PERMANENT}."
    error_id: ERR_FOREIGN_QUALIFICATIONS_OUTSTANDING
    http_status: 409
    applies_to: "POST /registrations/{id}/terminate"
  - priority: 28
    category: business_referential
    check: "Every Registration of the LegalEntity has status IN {WITHDRAWN, TERMINATED, CLOSED_PERMANENT}; registered-agent service cannot end while any registration is still occupied."
    error_id: ERR_ACTIVE_REGISTRATIONS_EXIST
    http_status: 409
    applies_to: "POST /legal-entities/{id}/dissolve"
  - priority: 29
    category: business_safety
    check: "When final_report_required is true, every FINAL_REPORT ComplianceObligation of the entity has status IN {SATISFIED, WAIVED}."
    error_id: ERR_FINAL_REPORT_OUTSTANDING
    http_status: 409
    applies_to: "POST /legal-entities/{id}/dissolve"
  - priority: 30
    category: business_referential
    check: "An AgentAppointment with status == APPOINTED exists on the registration."
    error_id: ERR_AGENT_OF_RECORD_REQUIRED
    http_status: 409
    applies_to: "POST /registrations/{id}/activate"
  - priority: 31
    category: business_temporal
    check: "No AgentAppointment on the registration is in status RESIGNATION_NOTICED with current clock date < resignation_effective_on."
    error_id: ERR_RESIGNATION_NOTICE_ACTIVE
    http_status: 409
    applies_to: "POST /registrations/{id}/withdraw, POST /registrations/{id}/terminate"
  - priority: 32
    category: business_safety
    check: "X-User-ID differs from the filing's prepared_by_user_id; the preparer may not also submit."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /filings/{id}/submit"
  - priority: 33
    category: business_temporal
    check: "Current clock date <= filing.refile_window_end."
    error_id: ERR_REFILE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /filings/{id}/refile"
  - priority: 34
    category: business_constraint
    check: "filing.attempt_number < MAX_REFILE_ATTEMPTS (3)."
    error_id: ERR_REFILE_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /filings/{id}/refile"
  - priority: 35
    category: business_fiscal
    check: "capture_amount_cents <= payment.authorized_amount_cents."
    error_id: ERR_CAPTURE_EXCEEDS_AUTHORIZATION
    http_status: 402
    applies_to: "POST /payments/{id}/capture"
  - priority: 36
    category: business_referential
    check: "When target_filing_id is supplied, that filing belongs to the paying client, has status IN {DRAFT, SUBMITTED, REJECTED} and has paid_amount_cents < total_fee_cents."
    error_id: ERR_ALLOCATION_TARGET_INVALID
    http_status: 409
    applies_to: "POST /payments/{id}/capture"
  - priority: 37
    category: business_fiscal
    check: "filing.paid_amount_cents >= filing.total_fee_cents; an underfunded filing cannot be lodged with the state."
    error_id: ERR_INSUFFICIENT_CAPTURED_FUNDS
    http_status: 402
    applies_to: "POST /filings/{id}/submit"
  - priority: 38
    category: business_temporal
    check: "The current logical clock instant is >= sop_document.ack_deadline_at."
    error_id: ERR_SOP_ACK_NOT_DUE
    http_status: 409
    applies_to: "POST /sop-documents/{id}/escalate"
  - priority: 39
    category: business_constraint
    check: "sop_document.escalation_level < SOP_MAX_ESCALATION_LEVEL (3)."
    error_id: ERR_SOP_ESCALATION_CAP_REACHED
    http_status: 409
    applies_to: "POST /sop-documents/{id}/escalate"
  - priority: 40
    category: business_constraint
    check: "The parent LegalEntity has boi_exempt_class == NONE; an exempt class suppresses the BOI obligation entirely."
    error_id: ERR_BOI_EXEMPT_ENTITY
    http_status: 409
    applies_to: "POST /legal-entities/{id}/boi-reports, POST /boi-reports/{id}/submit"
  - priority: 41
    category: business_constraint
    check: "When the parent LegalEntity has company_applicant_required == true, includes_company_applicant is true."
    error_id: ERR_COMPANY_APPLICANT_REQUIRED
    http_status: 422
    applies_to: "POST /boi-reports/{id}/submit"
  - priority: 42
    category: business_temporal
    check: "Current clock date <= reinstatement_case.window_close_date."
    error_id: ERR_REINSTATEMENT_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /registrations/{id}/reinstatement-cases, POST /reinstatement-cases/{id}/assess-fees, POST /reinstatement-cases/{id}/grant"

# ---------------------------------------------------------------------------
# 1.4.1 Gate precedence — explicit relative order of the write-gates that can
#       apply to the same operation. Rung numbers alone are not left to imply it.
# ---------------------------------------------------------------------------
gate_precedence:
  - operation: "POST /legal-entities/{id}/foreign-qualifications"
    ordered_gates:
      - "18 ERR_NO_EFFECTIVE_STATE_RULE (a rule row must exist before anything is priced)"
      - "20 ERR_DUPLICATE_REGISTRATION (interval occupancy)"
      - "23 ERR_HOME_STATE_DELINQUENT (sequencing gate: cannot qualify out of a delinquent home state)"
      - "24 ERR_CERTIFICATE_STALE (freshness of the good-standing certificate)"
      - "25 ERR_NAME_CONFLICT_UNRESOLVED (name availability, last)"
    note: "A request that trips 23 and 24 together returns ERR_HOME_STATE_DELINQUENT."
  - operation: "POST /registrations/{id}/terminate"
    ordered_gates:
      - "16 ERR_INVALID_STATE (registration must be ACTIVE)"
      - "26 ERR_TAX_CLEARANCE_REQUIRED"
      - "27 ERR_FOREIGN_QUALIFICATIONS_OUTSTANDING"
      - "31 ERR_RESIGNATION_NOTICE_ACTIVE"
    note: "Tax clearance is checked BEFORE the foreign-qualification sweep."
  - operation: "POST /legal-entities/{id}/dissolve"
    ordered_gates:
      - "16 ERR_INVALID_STATE (entity must be WINDING_DOWN)"
      - "28 ERR_ACTIVE_REGISTRATIONS_EXIST"
      - "29 ERR_FINAL_REPORT_OUTSTANDING"
    note: "Referential sweep precedes the safety gate here, deliberately inverting the usual safety-first ordering."
  - operation: "POST /payments/{id}/capture"
    ordered_gates:
      - "16 ERR_INVALID_STATE (payment must be AUTHORIZED)"
      - "35 ERR_CAPTURE_EXCEEDS_AUTHORIZATION"
      - "36 ERR_ALLOCATION_TARGET_INVALID"
    note: "A request that both over-captures and names an ineligible target returns ERR_CAPTURE_EXCEEDS_AUTHORIZATION."
  - operation: "POST /filings/{id}/submit"
    ordered_gates:
      - "16 ERR_INVALID_STATE (filing must be DRAFT)"
      - "32 ERR_SEGREGATION_OF_DUTIES"
      - "37 ERR_INSUFFICIENT_CAPTURED_FUNDS"
    note: "Segregation of duties is checked before funding."
  - operation: "POST /filings/{id}/refile"
    ordered_gates:
      - "16 ERR_INVALID_STATE (filing must be REJECTED)"
      - "33 ERR_REFILE_WINDOW_CLOSED"
      - "34 ERR_REFILE_LIMIT_REACHED"
  - operation: "POST /sop-documents/{id}/escalate"
    ordered_gates:
      - "16 ERR_INVALID_STATE (document must be FORWARDED or ESCALATED)"
      - "38 ERR_SOP_ACK_NOT_DUE"
      - "39 ERR_SOP_ESCALATION_CAP_REACHED"
  - operation: "POST /boi-reports/{id}/submit"
    ordered_gates:
      - "16 ERR_INVALID_STATE (report must be DRAFT)"
      - "40 ERR_BOI_EXEMPT_ENTITY"
      - "41 ERR_COMPANY_APPLICANT_REQUIRED"
  - operation: "POST /registrations/{id}/compliance-obligations"
    ordered_gates:
      - "15 ERR_STALE_VERSION is NOT applicable here"
      - "18 ERR_NO_EFFECTIVE_STATE_RULE"
      - "21 ERR_DUPLICATE_OBLIGATION"
      - "22 ERR_INVALID_REQUEST (BOI types require a HOME registration)"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- logical clock & ops run -------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Before the first call the clock reads exactly 2026-05-01T00:00:00Z and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: ["to_iso8601"]
    output: { current_utc: string, previous_utc: string }
    side_effects: ["moves the logical clock; no entity is mutated"]
  - method: POST
    path: "/_ops/advance-calendar"
    description: "Ops-run checkpoint: advances obligation statuses, flips due reminders to SENT, retires elapsed resignation notices, administratively dissolves eligible registrations, expires lapsed reinstatement windows and re-runs every rollup."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: { obligations_advanced: integer, reminders_sent: integer, appointments_resigned: integer, registrations_dissolved: integer, registrations_closed_permanent: integer, cases_expired: integer, boi_axes_delinquent: integer }
    side_effects:
      - "runs obligation_status_advance on every open obligation"
      - "runs reminder_schedule's send pass"
      - "retires AgentAppointment rows whose resignation_effective_on has arrived"
      - "drives Registration DELINQUENT -> ADMIN_DISSOLVED and ADMIN_DISSOLVED -> CLOSED_PERMANENT"
      - "drives the LegalEntity boi_status axis to DELINQUENT past its deadline"
      - "recomputes registration_delinquency_rank and portfolio_rollup"

  # --- clients -------------------------------------------------------------
  - method: POST
    path: "/clients"
    description: "Registers a portfolio owner."
    roles: [PlatformAdmin]
    code: 201
    input: ["legal_name", "billing_email"]
    output: Client
    side_effects: ["creates the Client with every rollup field at its declared default"]
  - method: GET
    path: "/clients/{id}"
    description: "Reads one client including its portfolio rollup fields."
    roles: [PlatformAdmin, ComplianceOfficer, ClientContact]
    code: 200
    input: []
    output: Client
    side_effects: []
  - method: GET
    path: "/clients/{id}/portfolio-summary"
    description: "Computed multi-state rollup: per-state counts and money that must sum to the client-level totals."
    roles: [PlatformAdmin, ComplianceOfficer, ClientContact]
    code: 200
    input: []
    output: { client_id: string, entity_count: integer, registration_count: integer, open_obligation_count: integer, outstanding_cents: integer, delinquency_status: string, worst_state_code: string, credit_balance_cents: integer }
    side_effects: []
  - method: GET
    path: "/clients/{id}/legal-entities"
    description: "Lists the legal entities of one client."
    roles: [PlatformAdmin, ComplianceOfficer, FilingAgent, ClientContact]
    code: 200
    input: ["lifecycle_status?", "limit?", "offset?"]
    output: LegalEntity[]
    side_effects: []
  - method: POST
    path: "/clients/{id}/payments"
    description: "Authorizes a card payment for this client. No money moves until capture."
    roles: [PlatformAdmin, ClientContact]
    code: 201
    input: ["authorized_amount_cents"]
    output: Payment
    side_effects: ["creates the Payment in AUTHORIZED with captured/allocated/unallocated/refunded all 0"]
  - method: GET
    path: "/clients/{id}/payments"
    description: "Lists the payments of one client."
    roles: [PlatformAdmin, ClientContact]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

  # --- state rules ---------------------------------------------------------
  - method: POST
    path: "/state-rules"
    description: "Publishes a new effective-dated rule version for one jurisdiction. Publishing auto-closes the currently open row for that state by stamping its effective_to with the new row's effective_from."
    roles: [PlatformAdmin]
    code: 201
    input: ["state_code", "effective_from", "annual_report_basis", "franchise_tax_basis", "fixed_due_month?", "fixed_due_day?", "fiscal_offset_days?", "flat_franchise_tax_cents?", "authorized_shares_tiers?", "assumed_par_value_rate_bps?", "min_franchise_tax_cents?", "max_franchise_tax_cents?", "gross_receipts_brackets?", "grace_days?", "grace_basis?", "late_fee_style?", "late_fee_flat_cents?", "late_fee_per_month_cents?", "late_fee_percent_bps?", "late_fee_cap_cents?", "delinquency_to_dissolution_days?", "reinstatement_window_days?", "annual_report_fee_cents?", "franchise_tax_filing_fee_cents?", "foreign_qualification_fee_cents?", "withdrawal_fee_cents?", "dissolution_fee_cents?", "reinstatement_fee_cents?", "expedite_surcharge_cents?", "good_standing_freshness_days?", "requires_tax_clearance?"]
    output: StateRule
    side_effects:
      - "creates the StateRule row with effective_to null"
      - "sets the previously open row's effective_to to this row's effective_from"
      - "does NOT re-resolve governing_rule_id on any existing ComplianceObligation"
  - method: GET
    path: "/state-rules"
    description: "Lists rule versions, newest effective_from first."
    roles: [PlatformAdmin, ComplianceOfficer, FilingAgent]
    code: 200
    input: ["state_code?", "limit?", "offset?"]
    output: StateRule[]
    side_effects: []

  # --- legal entities ------------------------------------------------------
  - method: POST
    path: "/clients/{id}/legal-entities"
    description: "Creates a legal entity in DRAFT and pins its BOI initial deadline band."
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 201
    input: ["legal_name", "entity_type", "home_state_code", "formation_date", "fiscal_year_end_month?", "fiscal_year_end_day?", "authorized_shares?", "issued_shares?", "total_gross_assets_cents?", "annual_gross_receipts_cents?", "boi_exempt_class?"]
    output: LegalEntity
    side_effects:
      - "runs boi_initial_deadline and sets boi_status"
      - "sets company_applicant_required from COMPANY_APPLICANT_CUTOVER_DATE"
      - "recomputes Client.portfolio_entity_count"
  - method: GET
    path: "/legal-entities/{id}"
    description: "Reads one legal entity including both state axes."
    roles: [PlatformAdmin, ComplianceOfficer, FilingAgent, ClientContact]
    code: 200
    input: []
    output: LegalEntity
    side_effects: []
  - method: PATCH
    path: "/legal-entities/{id}"
    description: "Updates mutable entity attributes. Changing legal_name is a BOI reportable change; changing boi_exempt_class moves the BOI axis."
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["legal_name?", "fiscal_year_end_month?", "fiscal_year_end_day?", "authorized_shares?", "issued_shares?", "total_gross_assets_cents?", "annual_gross_receipts_cents?", "boi_exempt_class?"]
    output: LegalEntity
    side_effects:
      - "runs boi_update_deadline when legal_name changes"
      - "moves the boi_status axis when boi_exempt_class changes"
      - "increments LegalEntity.version by 1"
  - method: POST
    path: "/legal-entities/{id}/activate"
    description: "Moves the entity from DRAFT to ACTIVE once a home registration exists."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: LegalEntity
    side_effects: ["DRAFT -> ACTIVE", "recomputes compliance_posture and the client rollup", "increments LegalEntity.version by 1"]
  - method: POST
    path: "/legal-entities/{id}/begin-wind-down"
    description: "Starts wind-down and arms the surviving final-report obligation."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: LegalEntity
    side_effects: ["ACTIVE -> WINDING_DOWN", "sets final_report_required = true", "increments LegalEntity.version by 1"]
  - method: POST
    path: "/legal-entities/{id}/abort-wind-down"
    description: "Returns a winding-down entity to ACTIVE. final_report_required is deliberately NOT cleared."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: LegalEntity
    side_effects: ["WINDING_DOWN -> ACTIVE", "increments LegalEntity.version by 1"]
  - method: POST
    path: "/legal-entities/{id}/dissolve"
    description: "Dissolves the entity once every registration is closed and every final report is settled."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: LegalEntity
    side_effects: ["WINDING_DOWN -> DISSOLVED", "sets boi_status = NOT_REQUIRED", "recomputes Client.portfolio_entity_count", "increments LegalEntity.version by 1"]

  # --- beneficial owners ---------------------------------------------------
  - method: POST
    path: "/legal-entities/{id}/beneficial-owners"
    description: "Adds a beneficial owner. Adding one is a BOI reportable change."
    roles: [ComplianceOfficer]
    code: 201
    input: ["full_name", "date_of_birth", "residential_address", "id_document_number", "ownership_pct", "is_company_applicant?"]
    output: BeneficialOwner
    side_effects: ["runs boi_update_deadline on the parent entity", "increments LegalEntity.version by 1"]
  - method: GET
    path: "/legal-entities/{id}/beneficial-owners"
    description: "Lists the beneficial owners of one entity."
    roles: [PlatformAdmin, ComplianceOfficer, FilingAgent, ClientContact]
    code: 200
    input: ["owner_status?", "limit?", "offset?"]
    output: BeneficialOwner[]
    side_effects: []
  - method: PATCH
    path: "/beneficial-owners/{id}"
    description: "Updates an owner. Touching any of the five reportable fields re-arms the 30-day BOI update clock; touching date_of_birth alone does not."
    roles: [ComplianceOfficer]
    code: 200
    input: ["full_name?", "date_of_birth?", "residential_address?", "id_document_number?", "ownership_pct?", "owner_status?"]
    output: BeneficialOwner
    side_effects: ["runs boi_update_deadline on the parent entity when a reportable field changed", "increments BeneficialOwner.version by 1"]

  # --- name clearance ------------------------------------------------------
  - method: POST
    path: "/legal-entities/{id}/name-clearances"
    description: "Opens a name-availability search in a target jurisdiction, optionally carrying a DBA fallback."
    roles: [ComplianceOfficer]
    code: 201
    input: ["state_code", "requested_name", "fallback_assumed_name?"]
    output: NameClearance
    side_effects: ["creates the clearance with result PENDING"]
  - method: GET
    path: "/legal-entities/{id}/name-clearances"
    description: "Lists the name clearances of one entity."
    roles: [PlatformAdmin, ComplianceOfficer, FilingAgent]
    code: 200
    input: ["state_code?", "result?", "limit?", "offset?"]
    output: NameClearance[]
    side_effects: []
  - method: POST
    path: "/name-clearances/{id}/record-result"
    description: "Records the jurisdiction's search outcome and resolves the usable name."
    roles: [FilingAgent]
    code: 200
    input: ["result", "conflicting_name?"]
    output: NameClearance
    side_effects: ["sets result and resolved_name", "increments NameClearance.version by 1"]

  # --- registrations -------------------------------------------------------
  - method: POST
    path: "/legal-entities/{id}/registrations"
    description: "Creates the HOME registration in the entity's formation state."
    roles: [ComplianceOfficer]
    code: 201
    input: []
    output: Registration
    side_effects:
      - "creates the Registration in PENDING with registration_kind HOME and state_code = the entity's home_state_code"
      - "resolves the governing StateRule for the current clock date"
  - method: POST
    path: "/legal-entities/{id}/foreign-qualifications"
    description: "Creates a FOREIGN registration in another state. Gated on home-state standing, certificate freshness and name availability, in that order."
    roles: [ComplianceOfficer]
    code: 201
    input: ["state_code", "name_clearance_id", "good_standing_certificate_id"]
    output: Registration
    side_effects:
      - "creates the Registration in PENDING with registration_kind FOREIGN"
      - "copies NameClearance.resolved_name into assumed_name when the clearance result was CONFLICT"
  - method: GET
    path: "/registrations"
    description: "Filtered registration list across the estate."
    roles: [PlatformAdmin, ComplianceOfficer, FilingAgent, SopHandler, ClientContact]
    code: 200
    input: ["legal_entity_id?", "name_clearance_id?", "state_code?", "status?", "limit?", "offset?"]
    output: Registration[]
    side_effects: []
  - method: GET
    path: "/registrations/{id}"
    description: "Reads one registration including agent_of_record_id and delinquency_rank."
    roles: [PlatformAdmin, ComplianceOfficer, FilingAgent, SopHandler, ClientContact]
    code: 200
    input: []
    output: Registration
    side_effects: []
  - method: POST
    path: "/registrations/{id}/activate"
    description: "Activates a pending registration once an agent of record is appointed."
    roles: [FilingAgent]
    code: 200
    input: []
    output: Registration
    side_effects: ["PENDING -> ACTIVE", "sets qualified_on", "recomputes agent_of_record_id and every rollup", "increments Registration.version by 1"]
  - method: POST
    path: "/registrations/{id}/withdraw"
    description: "Withdraws a foreign qualification after its withdrawal filing is accepted."
    roles: [FilingAgent]
    code: 200
    input: ["tax_clearance_reference?"]
    output: Registration
    side_effects: ["ACTIVE -> WITHDRAWN", "voids open obligations", "resigns every live appointment", "increments Registration.version by 1"]
  - method: POST
    path: "/registrations/{id}/administratively-dissolve"
    description: "Records the state's administrative dissolution of a delinquent registration and opens the reinstatement window."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Registration
    side_effects: ["DELINQUENT -> ADMIN_DISSOLVED", "sets admin_dissolved_on and reinstatement_deadline", "recomputes every rollup", "increments Registration.version by 1"]
  - method: POST
    path: "/registrations/{id}/terminate"
    description: "Terminates the home registration after every foreign qualification is withdrawn and the dissolution filing is accepted."
    roles: [FilingAgent]
    code: 200
    input: ["tax_clearance_reference?"]
    output: Registration
    side_effects: ["ACTIVE -> TERMINATED", "voids open obligations except FINAL_REPORT", "resigns every live appointment", "increments Registration.version by 1"]
  - method: POST
    path: "/registrations/{id}/good-standing-certificates"
    description: "Records a certificate of good standing drawn from this registration's jurisdiction."
    roles: [ComplianceOfficer]
    code: 201
    input: ["issued_on", "certificate_number"]
    output: GoodStandingCertificate
    side_effects: ["creates the certificate; state_code is copied from the parent registration"]
  - method: GET
    path: "/registrations/{id}/good-standing-certificates"
    description: "Lists the certificates drawn from one registration."
    roles: [PlatformAdmin, ComplianceOfficer, FilingAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: GoodStandingCertificate[]
    side_effects: []
  - method: GET
    path: "/registrations/{id}/reinstatement-cases"
    description: "Lists the reinstatement cases opened on one registration."
    roles: [PlatformAdmin, ComplianceOfficer, FilingAgent]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ReinstatementCase[]
    side_effects: []
  - method: POST
    path: "/registrations/{id}/reinstatement-cases"
    description: "Opens a reinstatement case against an administratively dissolved registration, provided the window is still open."
    roles: [ComplianceOfficer]
    code: 201
    input: []
    output: ReinstatementCase
    side_effects: ["creates the case in OPEN and copies window_close_date from Registration.reinstatement_deadline"]

  # --- agent appointments --------------------------------------------------
  - method: POST
    path: "/registrations/{id}/agent-appointments"
    description: "Proposes an agent of record for this registration. Optimistically concurrent on the registration's version."
    roles: [ComplianceOfficer]
    code: 201
    input: ["provider_name", "appointed_on", "expected_registration_version"]
    output: AgentAppointment
    side_effects: ["creates the appointment in PROPOSED", "increments Registration.version by 1"]
  - method: GET
    path: "/agent-appointments"
    description: "Filtered appointment list; the superseded_by_appointment_id filter walks the transfer chain."
    roles: [PlatformAdmin, ComplianceOfficer, FilingAgent, SopHandler]
    code: 200
    input: ["registration_id?", "superseded_by_appointment_id?", "status?", "limit?", "offset?"]
    output: AgentAppointment[]
    side_effects: []
  - method: GET
    path: "/agent-appointments/{id}"
    description: "Reads one appointment including of_record and resignation_effective_on."
    roles: [PlatformAdmin, ComplianceOfficer, FilingAgent, SopHandler]
    code: 200
    input: []
    output: AgentAppointment
    side_effects: []
  - method: POST
    path: "/agent-appointments/{id}/accept"
    description: "Accepts a proposed appointment; any incumbent APPOINTED sibling is transferred out."
    roles: [FilingAgent]
    code: 200
    input: []
    output: AgentAppointment
    side_effects: ["PROPOSED -> APPOINTED", "sets the incumbent to TRANSFERRED_OUT with superseded_by_appointment_id", "recomputes of_record across the registration", "increments AgentAppointment.version by 1"]
  - method: POST
    path: "/agent-appointments/{id}/reject"
    description: "Rejects a proposed appointment."
    roles: [FilingAgent]
    code: 200
    input: []
    output: AgentAppointment
    side_effects: ["PROPOSED -> REJECTED", "increments AgentAppointment.version by 1"]
  - method: POST
    path: "/agent-appointments/{id}/notice-resignation"
    description: "Gives statutory resignation notice. The appointment stays of record for the whole notice window."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: AgentAppointment
    side_effects: ["APPOINTED -> RESIGNATION_NOTICED", "sets resignation_noticed_on and resignation_effective_on", "increments AgentAppointment.version by 1 and Registration.version by 1"]

  # --- compliance obligations ---------------------------------------------
  - method: POST
    path: "/registrations/{id}/compliance-obligations"
    description: "Adds one calendar obligation, pinning the governing rule version and deriving every date and money field from it."
    roles: [ComplianceOfficer]
    code: 201
    input: ["obligation_type", "period_year"]
    output: ComplianceObligation
    side_effects:
      - "pins governing_rule_id and rule_determination_date"
      - "runs annual_report_due_date, grace_end_date, delinquency_date, franchise_tax_amount, late_fee_amount, obligation_service_fee and obligation_total_due"
      - "mints five PENDING ReminderNotice rows via reminder_schedule"
      - "recomputes portfolio_rollup"
  - method: GET
    path: "/compliance-obligations"
    description: "Filtered obligation list; governing_rule_id shows which rule version each row was pinned to."
    roles: [PlatformAdmin, ComplianceOfficer, FilingAgent, ClientContact]
    code: 200
    input: ["registration_id?", "governing_rule_id?", "obligation_type?", "status?", "limit?", "offset?"]
    output: ComplianceObligation[]
    side_effects: []
  - method: GET
    path: "/compliance-obligations/{id}"
    description: "Reads one obligation including its full money breakdown."
    roles: [PlatformAdmin, ComplianceOfficer, FilingAgent, ClientContact]
    code: 200
    input: []
    output: ComplianceObligation
    side_effects: []
  - method: POST
    path: "/compliance-obligations/{id}/waive"
    description: "Waives an outstanding obligation, zeroing its money and suppressing its reminders."
    roles: [PlatformAdmin]
    code: 200
    input: ["waiver_reason"]
    output: ComplianceObligation
    side_effects: ["-> WAIVED", "sets total_due_cents = 0", "suppresses PENDING reminders", "recomputes every rollup", "increments ComplianceObligation.version by 1"]
  - method: GET
    path: "/compliance-obligations/{id}/reminders"
    description: "Lists the reminder ladder of one obligation."
    roles: [PlatformAdmin, ComplianceOfficer, ClientContact]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ReminderNotice[]
    side_effects: []
  - method: POST
    path: "/registrations/{id}/calendar-rebuild"
    description: "Re-derives the calendar for this registration. Every obligation keeps the governing_rule_id it was pinned to at creation - the rule version is NEVER re-resolved, so a rule published later cannot move an obligation that was already determined. Rows whose obligation_type is listed in rebuild_types AND whose status is still SCHEDULED are re-derived against their OWN pinned rule using the entity's CURRENT formation_date and fiscal-year-end fields; every other row is preserved verbatim."
    roles: [ComplianceOfficer]
    code: 200
    input: ["rebuild_types"]
    output: { registration_id: string, rebuilt_count: integer, preserved_count: integer, reminders_rearmed: integer }
    side_effects:
      - "re-derives due_date, grace_end_date and delinquency_date on eligible SCHEDULED rows under their own pinned StateRule"
      - "counts a row in rebuilt_count only when its due_date actually moved; unmoved and ineligible rows land in preserved_count"
      - "sets every ReminderNotice of a moved obligation whose due_date_snapshot no longer matches to REARMED and mints a fresh PENDING ladder against the new due_date"
      - "never writes governing_rule_id, proving effective-dated rules are not retroactive"

  # --- filings -------------------------------------------------------------
  - method: POST
    path: "/compliance-obligations/{id}/filings"
    description: "Drafts a filing against a calendar obligation. Optimistically concurrent on the obligation's version."
    roles: [ComplianceOfficer]
    code: 201
    input: ["filing_kind", "expedite_tier?", "expected_compliance_obligation_version"]
    output: Filing
    side_effects:
      - "recomputes the obligation's late_fee_cents and total_due_cents at the current clock date"
      - "runs filing_fee_breakdown and stores state_portion_cents, service_portion_cents and total_fee_cents"
      - "sets prepared_by_user_id to the acting X-User-ID"
      - "increments ComplianceObligation.version by 1"
  - method: POST
    path: "/registrations/{id}/filings"
    description: "Drafts a standalone filing that is not tied to a calendar obligation: foreign qualification, withdrawal, dissolution or reinstatement."
    roles: [ComplianceOfficer]
    code: 201
    input: ["filing_kind", "expedite_tier?", "good_standing_certificate_id?", "reinstatement_case_id?"]
    output: Filing
    side_effects:
      - "runs filing_fee_breakdown against the StateRule effective on the current clock date"
      - "sets prepared_by_user_id to the acting X-User-ID"
  - method: GET
    path: "/filings"
    description: "Filtered filing list across the estate."
    roles: [PlatformAdmin, ComplianceOfficer, FilingAgent, ClientContact]
    code: 200
    input: ["registration_id?", "compliance_obligation_id?", "good_standing_certificate_id?", "status?", "filing_kind?", "limit?", "offset?"]
    output: Filing[]
    side_effects: []
  - method: GET
    path: "/filings/{id}"
    description: "Reads one filing including its refundability split and paid_amount_cents."
    roles: [PlatformAdmin, ComplianceOfficer, FilingAgent, ClientContact]
    code: 200
    input: []
    output: Filing
    side_effects: []
  - method: POST
    path: "/filings/{id}/submit"
    description: "Lodges a fully funded draft with the state. The preparer may not submit."
    roles: [FilingAgent]
    code: 200
    input: []
    output: Filing
    side_effects: ["DRAFT -> SUBMITTED", "sets submitted_by_user_id and submitted_on", "drives a linked ReinstatementCase PAID -> FILED", "increments Filing.version by 1"]
  - method: POST
    path: "/filings/{id}/record-outcome"
    description: "Records the jurisdiction's decision. ACCEPTED starts the five-hop cascade; REJECTED opens the refile window."
    roles: [FilingAgent]
    code: 200
    input: ["outcome", "rejection_reason?"]
    output: Filing
    side_effects:
      - "SUBMITTED -> ACCEPTED or SUBMITTED -> REJECTED"
      - "on ACCEPTED with an obligation: drives the obligation to SATISFIED, which suppresses its reminders, which can drive Registration DELINQUENT -> ACTIVE, which recomputes LegalEntity.compliance_posture, which recomputes the Client rollup"
      - "on REJECTED: sets refile_window_end"
      - "increments Filing.version by 1"
  - method: POST
    path: "/filings/{id}/refile"
    description: "Abandons a rejected filing and opens a successor draft that carries the predecessor's service portion."
    roles: [ComplianceOfficer]
    code: 201
    input: ["expedite_tier?"]
    output: Filing
    side_effects: ["predecessor -> ABANDONED", "creates the successor in DRAFT with attempt_number + 1 and service_fee_cents 0", "leaves Client.credit_balance_cents untouched"]
  - method: POST
    path: "/filings/{id}/abandon"
    description: "Abandons a rejected filing outright, forfeiting the state portion and refunding the service portion to account credit."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Filing
    side_effects:
      - "REJECTED -> ABANDONED"
      - "creates a reversal PaymentAllocation for the funded service portion"
      - "moves that amount into Payment.refunded_amount_cents and Client.credit_balance_cents"
      - "moves the Payment to PARTIALLY_REFUNDED or REFUNDED"
      - "increments Filing.version by 1"

  # --- payments ------------------------------------------------------------
  - method: GET
    path: "/payments/{id}"
    description: "Reads one payment including the four-way funds identity fields."
    roles: [PlatformAdmin, ClientContact]
    code: 200
    input: []
    output: Payment
    side_effects: []
  - method: POST
    path: "/payments/{id}/capture"
    description: "Captures up to the authorized amount and runs the allocation waterfall over the client's unpaid filings, earliest statutory deadline first."
    roles: [PlatformAdmin]
    code: 200
    input: ["capture_amount_cents", "target_filing_id?"]
    output: Payment
    side_effects:
      - "AUTHORIZED -> CAPTURED"
      - "creates PaymentAllocation rows in waterfall order"
      - "updates Filing.paid_amount_cents on each funded filing"
      - "drives a linked ReinstatementCase FEES_ASSESSED -> PAID once its reinstatement filing is fully funded"
      - "increments Payment.version by 1"
  - method: POST
    path: "/payments/{id}/void"
    description: "Voids an authorization that was never captured."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Payment
    side_effects: ["AUTHORIZED -> VOIDED", "increments Payment.version by 1"]
  - method: GET
    path: "/payments/{id}/allocations"
    description: "Lists the allocation rows drawn on one payment, reversals included."
    roles: [PlatformAdmin, ClientContact]
    code: 200
    input: ["limit?", "offset?"]
    output: PaymentAllocation[]
    side_effects: []
  - method: GET
    path: "/filings/{id}/payment-allocations"
    description: "Lists the allocation rows that funded one filing, reversals included."
    roles: [PlatformAdmin, ComplianceOfficer, ClientContact]
    code: 200
    input: ["limit?", "offset?"]
    output: PaymentAllocation[]
    side_effects: []

  # --- service of process --------------------------------------------------
  - method: POST
    path: "/registrations/{id}/sop-documents"
    description: "Records receipt of service of process at the agent's address and starts the statutory business-hour forward clock. A LITIGATION document pre-empts every unforwarded ORDINARY document on the same registration."
    roles: [SopHandler]
    code: 201
    input: ["sop_class", "plaintiff_name?", "court_case_number?"]
    output: SopDocument
    side_effects:
      - "sets received_at from the logical clock and runs sop_forward_deadline"
      - "on LITIGATION: runs sop_deferral_on_litigation_preemption over sibling ORDINARY documents and sets Registration.sop_priority_hold"
  - method: GET
    path: "/registrations/{id}/sop-documents"
    description: "Lists the service-of-process documents received for one registration."
    roles: [PlatformAdmin, ComplianceOfficer, SopHandler, ClientContact]
    code: 200
    input: ["status?", "sop_class?", "limit?", "offset?"]
    output: SopDocument[]
    side_effects: []
  - method: GET
    path: "/sop-documents/{id}"
    description: "Reads one document including forward_deadline_at, ack_deadline_at and forwarded_late."
    roles: [PlatformAdmin, ComplianceOfficer, SopHandler, ClientContact]
    code: 200
    input: []
    output: SopDocument
    side_effects: []
  - method: POST
    path: "/sop-documents/{id}/scan"
    description: "Scans the papers, or rejects them as addressed to an entity we do not represent."
    roles: [SopHandler]
    code: 200
    input: ["not_our_entity?"]
    output: SopDocument
    side_effects: ["RECEIVED -> SCANNED or RECEIVED -> REJECTED_NOT_OUR_ENTITY", "increments SopDocument.version by 1"]
  - method: POST
    path: "/sop-documents/{id}/forward"
    description: "Forwards the scanned papers to the client and arms the acknowledgment clock. Also used to re-forward after an escalation."
    roles: [SopHandler]
    code: 200
    input: []
    output: SopDocument
    side_effects: ["SCANNED -> FORWARDED or ESCALATED -> FORWARDED", "sets forwarded_at, forwarded_late and ack_deadline_at", "increments SopDocument.version by 1"]
  - method: POST
    path: "/sop-documents/{id}/acknowledge"
    description: "Client acknowledges receipt, closing the escalation ladder."
    roles: [ClientContact]
    code: 200
    input: []
    output: SopDocument
    side_effects: ["FORWARDED or ESCALATED -> ACKNOWLEDGED", "decrements Client.sop_open_escalation_count and re-evaluates portfolio_risk_flag", "increments SopDocument.version by 1"]
  - method: POST
    path: "/sop-documents/{id}/escalate"
    description: "Raises the next rung of the non-acknowledgment escalation ladder."
    roles: [SopHandler]
    code: 200
    input: []
    output: SopDocument
    side_effects:
      - "FORWARDED -> ESCALATED, or ESCALATED -> ESCALATED"
      - "creates a SopEscalationEvent whose channel follows sop_escalation_channel"
      - "increments Client.sop_open_escalation_count and sets portfolio_risk_flag at SOP_RISK_FLAG_THRESHOLD"
      - "re-arms ack_deadline_at by SOP_ESCALATION_STEP_HOURS business hours"
      - "increments SopDocument.version by 1"
  - method: GET
    path: "/sop-documents/{id}/escalations"
    description: "Lists the escalation events raised on one document."
    roles: [PlatformAdmin, ComplianceOfficer, SopHandler, ClientContact]
    code: 200
    input: ["limit?", "offset?"]
    output: SopEscalationEvent[]
    side_effects: []

  # --- BOI reports ---------------------------------------------------------
  - method: POST
    path: "/legal-entities/{id}/boi-reports"
    description: "Drafts a beneficial-ownership report and pins its deadline. Optimistically concurrent on the entity's version."
    roles: [ComplianceOfficer]
    code: 201
    input: ["report_kind", "includes_company_applicant?", "expected_legal_entity_version"]
    output: BoiReport
    side_effects:
      - "pins deadline_date from boi_initial_deadline or boi_update_deadline"
      - "snapshots the ACTIVE beneficial-owner count"
      - "increments LegalEntity.version by 1"
  - method: GET
    path: "/legal-entities/{id}/boi-reports"
    description: "Lists the BOI reports of one entity."
    roles: [PlatformAdmin, ComplianceOfficer, FilingAgent, ClientContact]
    code: 200
    input: ["status?", "report_kind?", "limit?", "offset?"]
    output: BoiReport[]
    side_effects: []
  - method: POST
    path: "/boi-reports/{id}/submit"
    description: "Submits a BOI report to the federal registry."
    roles: [FilingAgent]
    code: 200
    input: []
    output: BoiReport
    side_effects: ["DRAFT -> SUBMITTED", "sets submitted_on", "increments BoiReport.version by 1"]
  - method: POST
    path: "/boi-reports/{id}/record-outcome"
    description: "Records the registry's decision and moves the entity's BOI axis."
    roles: [FilingAgent]
    code: 200
    input: ["outcome"]
    output: BoiReport
    side_effects: ["SUBMITTED -> ACCEPTED or SUBMITTED -> REJECTED", "on ACCEPTED drives boi_status to FILED and clears boi_update_deadline", "increments BoiReport.version by 1"]

  # --- reinstatement -------------------------------------------------------
  - method: POST
    path: "/reinstatement-cases/{id}/assess-fees"
    description: "Prices every missed period under the rule version pinned on that period, plus the reinstatement fee under today's rule."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ReinstatementCase
    side_effects: ["OPEN or DENIED -> FEES_ASSESSED", "sets assessment_date, missed_period_count and back_fee_total_cents", "increments ReinstatementCase.version by 1"]
  - method: POST
    path: "/reinstatement-cases/{id}/grant"
    description: "Grants reinstatement, returning the registration to ACTIVE and curing every assessed period."
    roles: [FilingAgent]
    code: 200
    input: []
    output: ReinstatementCase
    side_effects: ["FILED -> GRANTED", "sets obligations_cured_count = missed_period_count", "drives Registration ADMIN_DISSOLVED -> ACTIVE and flips the assessed obligations to SATISFIED", "recomputes every rollup", "increments ReinstatementCase.version by 1"]
  - method: POST
    path: "/reinstatement-cases/{id}/deny"
    description: "Denies reinstatement; the case may be re-assessed while the window is open."
    roles: [FilingAgent]
    code: 200
    input: ["denial_reason"]
    output: ReinstatementCase
    side_effects: ["FILED -> DENIED", "increments ReinstatementCase.version by 1"]

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing or blank, or X-User-Role is not one of the five declared roles."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed in the endpoint's roles set."
  - id: ERR_CROSS_CLIENT_ACCESS
    http: 403
    condition: "A ClientContact addresses a resource owned by a different Client than its X-User-ID."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The X-User-ID submitting a filing equals its prepared_by_user_id."
  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "No Client matches the {id} path segment."
  - id: ERR_LEGAL_ENTITY_NOT_FOUND
    http: 404
    condition: "No LegalEntity matches the {id} path segment."
  - id: ERR_REGISTRATION_NOT_FOUND
    http: 404
    condition: "No Registration matches the {id} path segment."
  - id: ERR_OBLIGATION_NOT_FOUND
    http: 404
    condition: "No ComplianceObligation matches the {id} path segment."
  - id: ERR_FILING_NOT_FOUND
    http: 404
    condition: "No Filing matches the {id} path segment."
  - id: ERR_PAYMENT_NOT_FOUND
    http: 404
    condition: "No Payment matches the {id} path segment."
  - id: ERR_SOP_NOT_FOUND
    http: 404
    condition: "No SopDocument matches the {id} path segment."
  - id: ERR_RECORD_NOT_FOUND
    http: 404
    condition: "A BeneficialOwner, AgentAppointment, BoiReport, NameClearance, ReinstatementCase, StateRule or GoodStandingCertificate referenced by path or body does not exist."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required body field is missing, null, of the wrong type or out of its declared range; limit outside 1..100; offset negative; or a BOI obligation requested on a FOREIGN registration."
  - id: ERR_INVALID_ENUM
    http: 422
    condition: "An enum-valued body field named in validation rung 14 carries a value outside its declared member set."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target row's current state is not a declared `from:` state for the requested transition, including a BOI UPDATED report drafted while boi_status is not UPDATE_DUE."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_compliance_obligation_version, expected_registration_version or expected_legal_entity_version does not match the parent's current version."
  - id: ERR_CLOCK_REGRESSION
    http: 409
    condition: "POST /_clock/set_current_utc targets an instant earlier than the current logical clock."
  - id: ERR_NO_EFFECTIVE_STATE_RULE
    http: 422
    condition: "No StateRule row is effective for the target state_code on the determination date."
  - id: ERR_EFFECTIVE_DATE_OVERLAP
    http: 409
    condition: "A new StateRule's effective_from is not strictly later than the effective_from of the currently open row for that state_code."
  - id: ERR_DUPLICATE_REGISTRATION
    http: 409
    condition: "Another Registration already occupies the (legal_entity_id, state_code) interval the new one would start in."
  - id: ERR_DUPLICATE_OBLIGATION
    http: 409
    condition: "A non-VOIDED ComplianceObligation already exists for the same (registration_id, obligation_type, period_year)."
  - id: ERR_HOME_STATE_DELINQUENT
    http: 409
    condition: "Foreign qualification attempted while the entity's home registration is DELINQUENT, ADMIN_DISSOLVED or CLOSED_PERMANENT."
  - id: ERR_CERTIFICATE_STALE
    http: 422
    condition: "The referenced certificate's age in days is greater than or equal to the target state's good_standing_freshness_days."
  - id: ERR_NAME_CONFLICT_UNRESOLVED
    http: 409
    condition: "The referenced NameClearance has result PENDING, or result CONFLICT with no fallback_assumed_name."
  - id: ERR_TAX_CLEARANCE_REQUIRED
    http: 409
    condition: "Withdrawal or termination attempted in a state whose rule has requires_tax_clearance true without a tax_clearance_reference."
  - id: ERR_FOREIGN_QUALIFICATIONS_OUTSTANDING
    http: 409
    condition: "Home-registration termination attempted while a FOREIGN Registration of the same entity is not yet WITHDRAWN or CLOSED_PERMANENT."
  - id: ERR_ACTIVE_REGISTRATIONS_EXIST
    http: 409
    condition: "Entity dissolution attempted while any Registration of the entity is still PENDING, ACTIVE, DELINQUENT or ADMIN_DISSOLVED."
  - id: ERR_FINAL_REPORT_OUTSTANDING
    http: 409
    condition: "Entity dissolution attempted while final_report_required is true and a FINAL_REPORT obligation is not yet SATISFIED or WAIVED."
  - id: ERR_AGENT_OF_RECORD_REQUIRED
    http: 409
    condition: "Registration activation attempted with no AgentAppointment in status APPOINTED."
  - id: ERR_RESIGNATION_NOTICE_ACTIVE
    http: 409
    condition: "Withdrawal or termination attempted while an appointment on the registration is RESIGNATION_NOTICED and its notice window has not closed."
  - id: ERR_REFILE_WINDOW_CLOSED
    http: 409
    condition: "Refile attempted after the rejected filing's refile_window_end."
  - id: ERR_REFILE_LIMIT_REACHED
    http: 409
    condition: "Refile attempted when attempt_number has already reached MAX_REFILE_ATTEMPTS."
  - id: ERR_CAPTURE_EXCEEDS_AUTHORIZATION
    http: 402
    condition: "capture_amount_cents is greater than the payment's authorized_amount_cents."
  - id: ERR_INSUFFICIENT_CAPTURED_FUNDS
    http: 402
    condition: "Filing submission attempted while paid_amount_cents is below total_fee_cents."
  - id: ERR_ALLOCATION_TARGET_INVALID
    http: 409
    condition: "target_filing_id names a filing that belongs to another client, is ACCEPTED or ABANDONED, or is already fully paid."
  - id: ERR_SOP_ACK_NOT_DUE
    http: 409
    condition: "Escalation attempted before the document's ack_deadline_at."
  - id: ERR_SOP_ESCALATION_CAP_REACHED
    http: 409
    condition: "Escalation attempted when escalation_level has already reached SOP_MAX_ESCALATION_LEVEL."
  - id: ERR_BOI_EXEMPT_ENTITY
    http: 409
    condition: "A BOI report is drafted or submitted for an entity whose boi_exempt_class is not NONE."
  - id: ERR_COMPANY_APPLICANT_REQUIRED
    http: 422
    condition: "A BOI report is submitted without company-applicant details for an entity formed on or after COMPANY_APPLICANT_CUTOVER_DATE."
  - id: ERR_REINSTATEMENT_WINDOW_CLOSED
    http: 409
    condition: "A reinstatement case is opened, re-assessed or granted after its window_close_date."

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix (segregation of duties)
# ---------------------------------------------------------------------------
roles:
  - name: PlatformAdmin
    description: "Operates the platform: publishes jurisdiction rule versions, drives the logical clock and the ops-run, captures money and records administrative dissolutions."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /_ops/advance-calendar"
      - "POST /clients"
      - "POST /state-rules"
      - "POST /payments/{id}/capture"
      - "POST /payments/{id}/void"
      - "POST /registrations/{id}/administratively-dissolve"
      - "POST /compliance-obligations/{id}/waive"
    shared_operations:
      - "GET /clients/{id}"
      - "GET /clients/{id}/portfolio-summary"
      - "GET /clients/{id}/legal-entities"
      - "GET /clients/{id}/payments"
      - "POST /clients/{id}/payments"
      - "GET /state-rules"
      - "POST /clients/{id}/legal-entities"
      - "GET /legal-entities/{id}"
      - "PATCH /legal-entities/{id}"
      - "every GET list and read endpoint"
  - name: ComplianceOfficer
    description: "Prepares the compliance surface: entities, owners, registrations, calendars, agent appointments, BOI drafts and filing drafts. May never submit a filing it prepared."
    identity: opaque
    exclusive_operations:
      - "POST /legal-entities/{id}/activate"
      - "POST /legal-entities/{id}/begin-wind-down"
      - "POST /legal-entities/{id}/abort-wind-down"
      - "POST /legal-entities/{id}/dissolve"
      - "POST /legal-entities/{id}/beneficial-owners"
      - "PATCH /beneficial-owners/{id}"
      - "POST /legal-entities/{id}/name-clearances"
      - "POST /legal-entities/{id}/registrations"
      - "POST /legal-entities/{id}/foreign-qualifications"
      - "POST /registrations/{id}/good-standing-certificates"
      - "POST /registrations/{id}/agent-appointments"
      - "POST /agent-appointments/{id}/notice-resignation"
      - "POST /registrations/{id}/compliance-obligations"
      - "POST /registrations/{id}/calendar-rebuild"
      - "POST /compliance-obligations/{id}/filings"
      - "POST /registrations/{id}/filings"
      - "POST /filings/{id}/refile"
      - "POST /filings/{id}/abandon"
      - "POST /legal-entities/{id}/boi-reports"
      - "POST /registrations/{id}/reinstatement-cases"
      - "POST /reinstatement-cases/{id}/assess-fees"
    shared_operations:
      - "POST /clients/{id}/legal-entities"
      - "PATCH /legal-entities/{id}"
      - "GET /clients/{id}"
      - "GET /clients/{id}/portfolio-summary"
      - "every GET list and read endpoint except the payment reads"
  - name: FilingAgent
    description: "Acts against the jurisdictions: accepts appointments, activates and closes registrations, submits filings and records outcomes. Segregation of duties bars it from submitting a filing whose prepared_by_user_id equals its own X-User-ID."
    identity: opaque
    exclusive_operations:
      - "POST /name-clearances/{id}/record-result"
      - "POST /registrations/{id}/activate"
      - "POST /registrations/{id}/withdraw"
      - "POST /registrations/{id}/terminate"
      - "POST /agent-appointments/{id}/accept"
      - "POST /agent-appointments/{id}/reject"
      - "POST /filings/{id}/submit"
      - "POST /filings/{id}/record-outcome"
      - "POST /boi-reports/{id}/submit"
      - "POST /boi-reports/{id}/record-outcome"
      - "POST /reinstatement-cases/{id}/grant"
      - "POST /reinstatement-cases/{id}/deny"
    shared_operations:
      - "GET /state-rules"
      - "GET /registrations"
      - "GET /filings"
      - "GET /agent-appointments"
      - "every other GET list and read endpoint except the payment reads"
  - name: SopHandler
    description: "Runs the service-of-process mailroom: receipt, scan, forward and escalation."
    identity: opaque
    exclusive_operations:
      - "POST /registrations/{id}/sop-documents"
      - "POST /sop-documents/{id}/scan"
      - "POST /sop-documents/{id}/forward"
      - "POST /sop-documents/{id}/escalate"
    shared_operations:
      - "GET /registrations"
      - "GET /registrations/{id}"
      - "GET /registrations/{id}/sop-documents"
      - "GET /sop-documents/{id}"
      - "GET /sop-documents/{id}/escalations"
      - "GET /agent-appointments"
      - "GET /agent-appointments/{id}"
  - name: ClientContact
    description: "Portfolio owner's own user. X-User-ID equals the Client.id it acts for; every read and write is scoped to that client."
    identity: "entity_backed:Client"
