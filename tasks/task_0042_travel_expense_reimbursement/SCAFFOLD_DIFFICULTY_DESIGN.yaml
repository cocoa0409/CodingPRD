              captures: { err: $.data.error_id }
          assert:
            - "Adjacent line2 (check_in 2026-06-03 == prior check_out) succeeds with 201 and ExpenseLine.${line2}.reimbursable_amount_cents == 20000"
            - "Overlapping third line (2026-06-02..2026-06-04) returns 409 and $.data.error_id == ERR_LODGING_OVERLAP"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: card_load_limit_conserved_across_hold_void
        grounds:
          - calculations.card_settlement
          - state_machines.ExpenseReport.SUBMITTED_to_REJECTED
          - entities.VirtualCard.fields.available_balance_cents
        distinguishing_aspect: >
          Conserved quantity 1 (card funds): for any VirtualCard, available_balance_cents +
          authorized_holds_cents + captured_total_cents == load_limit_cents — a hold (charge) paired with
          its compensating VOID (report reject) restores available_balance to load_limit with zero drift.
        test_recipe:
          setup:
            - "Approved CA trip; ACTIVE card load 100000; SUBMITTED report with a 30000 line charged to card (hold)."
          setup_api_calls:
            - call: "POST /approvers"
              payload: { email: "mgr17@x.com", full_name: "Mgr Seventeen", approval_limit_cents: 1000000 }
              as: FinanceAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "t17@x.com", full_name: "Trav Seventeen", home_office_state: "CA", manager_id: "${mgr_id}" }
              as: FinanceAdmin
              captures: { trav_id: $.data.id }
            - call: "POST /travel-policies"
              payload: { name: "Std", max_economy_fare_cents: 50000, business_class_min_hours: 6, advance_purchase_days: 14, cdw_daily_cap_cents: 3000, mileage_rate_milli_cents: 67000, receipt_required_threshold_cents: 7500 }
              as: FinanceAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /travel-policies/${policy_id}/activate"
              payload: {}
              as: FinanceAdmin
            - call: "POST /per-diem-rates"
              payload: { state_code: "CA", lodging_cap_cents: 20000, mie_cents: 8000 }
              as: FinanceAdmin
            - call: "POST /trip-requests"
              payload: { traveler_id: "${trav_id}", destination_state: "CA", start_date: "2026-06-01", end_date: "2026-06-03", budget_total_cents: 100000 }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /trip-requests/${trip_id}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { trip_v2: $.data.version }
            - call: "POST /trip-requests/${trip_id}/virtual-cards"
              payload: { load_limit_cents: 100000, expected_trip_request_version: "${trip_v2}" }
              as: FinanceAdmin
              captures: { card_id: $.data.id }
            - call: "POST /expense-reports"
              payload: { trip_request_id: "${trip_id}", title: "Invariant Rpt" }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { rpt_id: $.data.id }
            - call: "POST /expense-lines"
              payload: { report_id: "${rpt_id}", line_type: "FLIGHT", claimed_amount_cents: 30000, virtual_card_id: "${card_id}", cabin_class: "ECONOMY", scheduled_hours: 4, advance_days: 20 }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { line_id: $.data.id }
            - call: "POST /expense-reports/${rpt_id}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav_id}"
          trigger:
            - call: "POST /expense-reports/${rpt_id}/decision"
              payload: { decision: "REJECT" }
              as: Approver
              as_user_id: "${mgr_id}"
          assert:
            - "Before reject: available_balance_cents 70000 + authorized_holds_cents 30000 + captured_total_cents 0 == load_limit_cents 100000"
            - "After reject: VirtualCard.${card_id}.available_balance_cents == 100000 and authorized_holds_cents == 0 and captured_total_cents == 0"

      - name: trip_budget_conserved_across_commit_only
        grounds:
          - calculations.trip_budget_ledger
          - state_machines.ExpenseReport.SUBMITTED_to_APPROVED
          - entities.TripRequest.fields.remaining_budget_cents
        distinguishing_aspect: >
          Conserved quantity 2 (trip budget, distinct from card funds): for any TripRequest,
          committed_amount_cents + remaining_budget_cents == budget_total_cents — a report approval
          (commit) plus a sibling report reject (no commit) keeps the identity exact with no drift.
        test_recipe:
