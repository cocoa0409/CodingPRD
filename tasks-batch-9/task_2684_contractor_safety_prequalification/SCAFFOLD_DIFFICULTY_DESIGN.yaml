# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
#   Domain: contractor-safety-prequalification
#   9 rule_ids x 2 instances = 18 instances.
#   Every numeric assert below was computed by executing the §1.3 formulas.
#   Logical clock starts at 2026-08-01T00:00:00Z at service startup.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_and_final_composite_diverge_on_hazard_tier_tightening
        grounds:
          - calculations.composite_prequalification_score
          - calculations.effective_client_threshold_resolution
          - calculations.metric_normalization
          - entities.Prequalification.fields.provisional_composite_score
          - entities.Prequalification.fields.final_composite_score
          - state_machines.Prequalification.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Variant divergence on ONE stored statistic: the provisional variant forces tightening
          1.00 and scores 80.51, while the final variant applies TIER_TIGHTENING[2] = 0.85 to the
          same client thresholds and scores 77.06 - a 3.45 point delta produced purely by variant
          selection, with no data change between the two evaluations.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Client Northwind on all defaults: BALANCED bands, thresholds 3.0/1.5/1.0/6, weights 0.40/0.25/0.25/0.10, required_coverage_types [GL, WC]."
            - "Contractor Summit with hazard_profile [GENERAL, HEIGHTS] so base_hazard_tier is 2."
            - "GL 2000000/4000000 and WC 1000000/2000000 certificates both VERIFIED and CURRENT (tier-2 requirement is 1500000 and 750000 per occurrence)."
            - "One VERIFIED SafetyStatistic for reporting_year 2025: hours 500000, recordable 2, DART 1, EMR 0.80, citation_points 1."
            - "All three required written programs (HAZCOM, DISCIPLINE_POLICY, FALL_PROTECTION) ACCEPTED, so the prequalification has joined UNDER_REVIEW with provisional_composite_score already written."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /clients"
              payload: { legal_name: "Northwind Facilities", industry_code: "2361" }
              as: NetworkAdmin
              captures: { client_id: $.data.id }
            - call: "POST /contractors"
              payload: { legal_name: "Summit Steel Erectors", scope_of_work: ["GENERAL_BUILDING"], hazard_profile: ["GENERAL", "HEIGHTS"], employee_count: 120 }
              as: NetworkAdmin
              captures: { con_id: $.data.id, con_v: $.data.version }
            - call: "POST /contractors/${con_id}/insurance-certificates"
              payload: { coverage_type: "GL", carrier_name: "Ironclad Mutual", each_occurrence_limit: 2000000, aggregate_limit: 4000000, effective_date: "2026-07-01T00:00:00Z", expiration_date: "2027-07-01T00:00:00Z" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { cert_gl_id: $.data.id }
            - call: "POST /insurance-certificates/${cert_gl_id}/verify"
              payload: { decision: "VERIFY" }
              as: VerificationAnalyst
              as_user_id: "analyst-ins-1"
            - call: "POST /contractors/${con_id}/insurance-certificates"
              payload: { coverage_type: "WC", carrier_name: "Ironclad Mutual", each_occurrence_limit: 1000000, aggregate_limit: 2000000, effective_date: "2026-07-01T00:00:00Z", expiration_date: "2027-07-01T00:00:00Z" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { cert_wc_id: $.data.id }
            - call: "POST /insurance-certificates/${cert_wc_id}/verify"
              payload: { decision: "VERIFY" }
              as: VerificationAnalyst
              as_user_id: "analyst-ins-1"
            - call: "POST /prequalifications"
              payload: { contractor_id: "${con_id}", client_id: "${client_id}", cycle_year: 2026, expected_contractor_version: "${con_v}" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { pq_id: $.data.id }
            - call: "POST /prequalifications/${pq_id}/safety-statistics"
              payload: { reporting_year: 2025, hours_worked: 500000, recordable_incidents: 2, dart_cases: 1, fatalities: 0, emr: 0.80, citation_count_willful: 0, citation_count_serious: 0, citation_count_other: 1, source_document_ref: "OSHA300A-2025" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { stat_id: $.data.id }
            - call: "POST /safety-statistics/${stat_id}/verify"
              payload: { decision: "VERIFY" }
              as: VerificationAnalyst
              as_user_id: "analyst-stat-1"
            - call: "POST /prequalifications/${pq_id}/written-programs"
              payload: { program_type: "HAZCOM", revision_date: "2026-06-01T00:00:00Z", document_ref: "DOC-HAZCOM-1" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { wp_hazcom_id: $.data.id }
            - call: "POST /written-programs/${wp_hazcom_id}/review"
              payload: { decision: "ACCEPT" }
              as: ClientSafetyManager
              as_user_id: "${client_id}"
            - call: "POST /prequalifications/${pq_id}/written-programs"
              payload: { program_type: "DISCIPLINE_POLICY", revision_date: "2026-06-01T00:00:00Z", document_ref: "DOC-DISC-1" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { wp_disc_id: $.data.id }
            - call: "POST /written-programs/${wp_disc_id}/review"
              payload: { decision: "ACCEPT" }
              as: ClientSafetyManager
              as_user_id: "${client_id}"
            - call: "POST /prequalifications/${pq_id}/written-programs"
              payload: { program_type: "FALL_PROTECTION", revision_date: "2026-06-01T00:00:00Z", document_ref: "DOC-FALL-1" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { wp_fall_id: $.data.id }
            - call: "POST /written-programs/${wp_fall_id}/review"
              payload: { decision: "ACCEPT" }
              as: ClientSafetyManager
              as_user_id: "${client_id}"
            - call: "POST /prequalifications/${pq_id}/submit"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${con_id}"
          trigger:
            - call: "GET /prequalifications/${pq_id}/scorecard"
              payload: {}
              as: ClientSafetyManager
              as_user_id: "${client_id}"
            - call: "POST /prequalifications/${pq_id}/grade"
              payload: {}
              as: ClientSafetyManager
              as_user_id: "${client_id}"
          assert:
            - "scorecard response data.provisional_composite_score == 80.51"
            - "scorecard response data.final_composite_score == 77.06"
            - "scorecard response data.hazard_tier == 2"
            - "Prequalification.${pq_id}.provisional_composite_score == 80.51 (written by the submit transition, unchanged by grading)"
            - "Prequalification.${pq_id}.final_composite_score == 77.06"
            - "Prequalification.${pq_id}.effective_thresholds == { max_trir: 2.5500, max_dart_rate: 1.2750, max_emr: 0.8500, max_citation_points: 5.1000 }"
            - "Prequalification.${pq_id}.grade == B"
            - "Prequalification.${pq_id}.status == APPROVED"
            - "Prequalification.${pq_id}.deficiency_codes == []"

      - name: insurance_per_occurrence_verifies_then_aggregate_depletion_blocks_grant
        grounds:
          - calculations.insurance_coverage_adequacy
          - entities.InsuranceCertificate.fields.available_aggregate
          - entities.Contractor.fields.open_severe_incident_count
          - validations[priority=29]
          - errors[ERR_COVERAGE_LIMIT_INSUFFICIENT]
        distinguishing_aspect: |
          Variant divergence in the INSURANCE domain rather than the scoring domain: the identical
          GL certificate (1000000/2000000) is adequate under per_occurrence_basis at verification
          and inadequate under aggregate_depletion_basis at grant time once one open RECORDABLE
          incident depletes 250000, leaving available_aggregate 1750000 against a 2000000 floor.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Client Northwind on defaults; Site PLANT-7 with required_hazard_classes [GENERAL] and min_grade C."
            - "Contractor Acme with hazard_profile [GENERAL] so base_hazard_tier is 1 and TIER_COVERAGE_MULTIPLIER is 1.0."
            - "GL 1000000/2000000 and WC 500000/1000000 certificates VERIFIED (both exactly at the tier-1 per-occurrence floor)."
            - "Prequalification APPROVED at 80.51 with grade B, so the site grade floor is satisfied."
            - "Worker Dana holds a current OSHA10 qualification, the only code PLANT-7 requires."
            - "AFTER grading, one RECORDABLE incident is opened at PLANT-7, so Contractor.open_severe_incident_count is 1 and every certificate's available_aggregate drops by 250000."
