      assert:
      - agreement_status == ACTIVE after the second resume (cycle traversed twice)
      - MonthlyAgreement.${agr}.version == 6 (create v1, activate v2, suspend v3, resume v4, suspend v5, resume v6)
  - name: repair_project_deferred_revision_loop
    grounds:
    - state_machines.RepairProject.PROPOSED_to_DEFERRED
    - state_machines.RepairProject.DEFERRED_to_PROPOSED
    - entities.RepairProject.fields.revision_count
    distinguishing_aspect: 'Branching revision loop: PROPOSED -> DEFERRED -> PROPOSED -> DEFERRED ->

      PROPOSED with revision_count accumulating to 2 — a cyclic pattern on

      RepairProject, a different entity than ParkingSession and MonthlyAgreement.

      '
    test_recipe:
      setup:
      - Facility; one PROPOSED repair project
      setup_api_calls:
      - call: POST /ops/facilities
        payload:
