            - call: "POST /ria/firms/${f2_id}/custody-agreements"
              payload: { adviser_crd_number: "CRD-204410" }
              as: AdvisorOperationsLead
              captures: { agr2_draft: $.data.id }
            - call: "POST /ria/custody-agreements/${agr2_draft}/submit"
              payload: {}
