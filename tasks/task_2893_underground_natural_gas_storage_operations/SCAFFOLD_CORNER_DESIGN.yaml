          assert:
            - "${e1} == ERR_INVALID_WELL_STATE with HTTP 409 (ticket ${t1} is still PENDING on MINI-1)"
            - "Well.${w1}.operational_state == IN_SERVICE with service_change_count == 0 after that refusal"
            - "${e2} == ERR_INVALID_WELL_STATE with HTTP 409 (a SCHEDULED test still occupies MINI-2)"
            - "Well.${w2}.operational_state == SHUT_IN, shut_in_reason == OPERATOR_REQUEST, service_change_count == 1"
            - "${e3} == ERR_INVALID_WELL_STATE with HTTP 409 — PLUGGED is terminal"
            - "${e4} == ERR_INVALID_WELL_STATE with HTTP 409 — a second PLUGGED is not a declared edge either"
            - "Well.${w3}.operational_state == PLUGGED with service_change_count == 2 (the two refusals did not count)"
            - "StorageField.${f1}.wells_in_service_count == 1, field_posture == OPEN, rates 150000 / 150000 (MINI-1 alone still covers the curve)"
            - "GET /wells with storage_field_id ${f1} and limit 100 returns total_count == 3"

      - name: evacuation_order_escalates_remediation_and_strands_the_compressor_station
        claim_type: side_effect_execution
        grounds:
          - state_machines.EmergencyEvent.transitions.RESPONDING_to_EVACUATION_ORDERED
          - state_machines.RemediationProgram.transitions.OPEN_to_ESCALATED
          - state_machines.CompressorRun.transitions.SCHEDULED_to_CANCELLED
          - calculations.field_posture_derivation
          - global_constants.MIN_EVACUATION_RADIUS_M
        distinguishing_aspect: |
          One advance fans out across three unrelated aggregates in a single request: the OPEN
          RemediationProgram becomes terminally ESCALATED (while the well stays MIT_FAILED), every
          CompressorUnit on the field goes OUT_OF_SERVICE with its SCHEDULED runs CANCELLED, and the
          cancelled run keeps fuel_consumed_dth null so NO fuel is drawn — working_gas_inventory_dth
          stays at 250000 and fuel_gas_used_dth at 0 even though the run's utilization band was
          already stamped at booking.
        test_recipe:
          setup:
            - "Field F_MINI with wells MINI-1 and MINI-2; compressor unit U-1 rated 6000 hp with derate 0.00 carries a SCHEDULED run of 3000 hp over 2026-08-10T00:00:00Z to 2026-08-10T08:00:00Z in INJECTION mode."
            - "MINI-2 failed a PRESSURE_TEST recorded by eng-a at 2026-08-02T06:00:00Z, opening a RemediationProgram; an EmergencyEvent on the field has already been advanced to RESPONDING."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-2", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w2: $.data.id }
            - call: "POST /compressor-units"
              payload: { storage_field_id: "${f1}", unit_code: "U-1", rated_horsepower: 6000, derate_factor: 0.00 }
              as: FieldOperator
              captures: { u1: $.data.id }
            - call: "POST /compressor-runs"
              payload: { compressor_unit_id: "${u1}", window_start_at: "2026-08-10T00:00:00Z", window_end_at: "2026-08-10T08:00:00Z", allocated_horsepower: 3000, mode: "INJECTION" }
              as: FieldOperator
              captures: { r1: $.data.id }
            - call: "POST /mechanical-integrity-tests"
              payload: { well_id: "${w2}", test_type: "PRESSURE_TEST", scheduled_start_at: "2026-08-01T06:00:00Z", scheduled_end_at: "2026-08-02T06:00:00Z" }
              as: IntegrityEngineer
              as_user_id: "eng-a"
              captures: { m1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T06:00:00Z" }
              as: FieldOperator
            - call: "POST /mechanical-integrity-tests/${m1}/record-result"
              payload: { outcome: "FAIL", result_pressure_psig: 500 }
              as: IntegrityEngineer
              as_user_id: "eng-a"
            - call: "GET /remediation-programs"
              payload: { well_id: "${w2}", limit: 100 }
              as: IntegrityEngineer
              as_user_id: "eng-a"
              captures: { p1: "$.data[0].id" }
            - call: "POST /emergency-events"
              payload: { storage_field_id: "${f1}", well_id: "${w2}", event_type: "LEAK", severity: "SERIOUS", detected_at: "2026-08-02T06:00:00Z" }
              as: FieldOperator
              captures: { ev1: $.data.id }
            - call: "POST /emergency-events/${ev1}/advance"
              payload: { to_status: "RESPONDING", responder_notes: "crew dispatched to the wellhead" }
              as: FieldOperator
          trigger:
