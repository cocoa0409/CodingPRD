  - section: rbac
    instances:
      - name: rbac_estimator_cannot_create_customer
        claim_type: role_denial
        grounds: [roles]
        distinguishing_aspect: "Estimator is not in POST /customers roles -> 403 ERR_FORBIDDEN_ROLE; role check (priority 2) precedes payload validation."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /customers", payload: { name: "Nope", credit_limit_cents: 1 }, as: Estimator, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_FORBIDDEN_ROLE"]

      - name: rbac_customer_cannot_upload_proof
        claim_type: role_denial
        grounds: [roles]
        distinguishing_aspect: "Customer (even the owning one) cannot upload proofs: POST /proofs is PrepressOperator-only; role check fires before body FK resolution."
        test_recipe:
          setup: ["Customer exists"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "C", credit_limit_cents: 1000 }, as: PlantManager, captures: { cust: $.data.id } }
          trigger:
            - { call: "POST /proofs", payload: { job_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", file_uri: "s3://x.pdf" }, as: Customer, as_user_id: "${cust}", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_FORBIDDEN_ROLE"]

      - name: rbac_prepress_cannot_create_press_run
        claim_type: role_denial
        grounds: [roles]
        distinguishing_aspect: "PrepressOperator calling POST /press-runs -> 403; scheduling is PressScheduler-exclusive. The role check (priority 2) fires before OCC (priority 5), so the call is rejected even with a well-formed version."
        test_recipe:
          setup: ["A press exists (version captured)"]
          setup_api_calls:
            - { call: "POST /presses", payload: { name: "W1", press_type: "WEB", rated_impressions_per_hour: 10000, make_ready_minutes_base: 45, washup_buffer_minutes: 30 }, as: PlantManager, captures: { press: $.data.id, pv: $.data.version } }
