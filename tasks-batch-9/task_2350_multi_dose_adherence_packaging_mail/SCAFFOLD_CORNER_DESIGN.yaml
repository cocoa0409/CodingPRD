              captures: { answered: $.data.status, granted: $.data.approved_refills }
            - call: "GET /pharmacy/prescriptions/${rx1}"
              payload: {}
              as: Prescriber
              captures: { pv: $.data.version, refills_left: $.data.refills_remaining }
