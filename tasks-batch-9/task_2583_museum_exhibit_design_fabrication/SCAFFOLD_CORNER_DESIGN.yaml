      - name: the_zone_availability_gate_reads_the_current_occupancy_not_the_requested_interval
        claim_type: violation_to_error
        grounds:
          - validations.priority_85
          - entities.GalleryZone.fields.occupancy_state
          - state_machines.InstallWindow.APPROVED_to_IN_PROGRESS
          - errors.ERR_ZONE_CLOSED_FOR_WORK
        distinguishing_aspect: |
          Two things are easy to conflate here and this instance separates them. The
          per-zone overlap check is interval arithmetic; the availability check at
          priority 85 is an instantaneous read of GalleryZone.occupancy_state at the
          moment of the decision. The second window asks for a slot two days after
          the in-progress one ends, so no interval geometry can object, yet it must
          still be refused while the zone is physically CLOSED. The sibling zone
          approval in the same breath proves the state is per zone, and the read of
          Z-B afterwards proves that APPROVING a window - even a closure-demanding
          one - never changes occupancy: only start does.
