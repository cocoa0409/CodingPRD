              as: ValuationAnalyst
              as_user_id: va-001
              captures: { as_id: "$.data.id" }
            - call: "POST /msr/rate-curves"
              payload: { as_of_date: "2026-07-31", base_rate_bps: 4000, primary_secondary_spread_bps: 85 }
              as: HedgeDesk
              as_user_id: hd-001
              captures: { c1_id: "$.data.id" }
            - call: "POST /msr/portfolios"
              payload: { seller_id: "${seller_id}", portfolio_name: "Pool-T", agency_type: FNMA }
              as: SellerServicer
              as_user_id: "${seller_id}"
              captures: { pf_id: "$.data.id" }
            - call: "POST /msr/portfolios/${pf_id}/loans"
              payload: { loan_number: "T-0001", upb_cents: 10000050, note_rate_pct: 6.5, servicing_fee_bps: 25, escrow_balance_cents: 100000, suspense_balance_cents: 25000, delinquency_bucket: CURRENT, loss_mit_status: NONE, state_code: "CA" }
              as: SellerServicer
              as_user_id: "${seller_id}"
              captures: { loan1_id: "$.data.id" }
            - call: "POST /msr/portfolios/${pf_id}/loans"
              payload: { loan_number: "T-0002", upb_cents: 10000050, note_rate_pct: 6.5, servicing_fee_bps: 25, escrow_balance_cents: 100000, suspense_balance_cents: 25000, delinquency_bucket: CURRENT, loss_mit_status: NONE, state_code: "TX" }
              as: SellerServicer
