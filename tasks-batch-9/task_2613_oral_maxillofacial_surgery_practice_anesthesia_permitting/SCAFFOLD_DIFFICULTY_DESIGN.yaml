              as: QualityReviewer
              as_user_id: "${rev_id}"
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /adverse-events/${ev_id}/morbidity-review"
              payload: { action: "OPEN", reviewer_staff_id: "${rev_id}" }
              as: QualityReviewer
              as_user_id: "${rev_id}"
            - call: "POST /adverse-events/${ev_id}/morbidity-review"
