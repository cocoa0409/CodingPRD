            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "X", risk_tolerance_score: 50 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: CASH_EQUIVALENT, target_pct: 100.00, band_pct: 50.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c}" }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c}", name: "P", tax_status: TAXABLE }, as: Advisor, captures: { p: $.data.id } }
            - { call: "POST /advisory/portfolios/${p}/activate", as: Advisor }
          trigger:
            - { call: "POST /advisory/portfolios/${p}/cash-movements", payload: { direction: DEPOSIT, amount_cents: 50000, occurred_at: "2026-08-01T00:00:00Z" }, as: Advisor, captures: { e1: $.data.id, b1: $.data.balance_after_cents, v1: $.data.valuation_before_cents } }
            - { call: "POST /advisory/portfolios/${p}/cash-movements", payload: { direction: DEPOSIT, amount_cents: 50000, occurred_at: "2026-07-15T00:00:00Z" }, as: Advisor, captures: { e2: $.data.id, b2: $.data.balance_after_cents, v2: $.data.valuation_before_cents } }
            - { call: "POST /advisory/portfolios/${p}/cash-movements", payload: { direction: WITHDRAWAL, amount_cents: 30000, occurred_at: "2026-07-20T00:00:00Z" }, as: Advisor, captures: { e3: $.data.id, b3: $.data.balance_after_cents, v3: $.data.valuation_before_cents } }
            - { call: "GET /advisory/portfolios/${p}", as: Advisor, captures: { cash: $.data.cash_balance_cents } }
          assert:
            - "e1: balance_after 50000, valuation_before 0; e2 (backdated): balance_after 100000, valuation_before 50000 — arrival order, occurred_at does not reorder the ledger"
            - "e3: balance_after 70000, valuation_before 100000"
            - "Portfolio.cash_balance_cents == 70000 == 50000 + 50000 - 30000 (projection consistent with the event sum)"
      - name: cascading_side_effects_difficulty
        claim_type: cascade_chain
        grounds:
          - "complexity_profile.complexity_layers"
        excluded_because:
          difficulty_instance: reprice_cascade_through_valuation_drift_and_model_staleness
          rationale: "Depth-4 reprice cascade and depth-3 finalize cascade asserted in §1.8 rule 4 instances."
      - name: dual_variant_layer_difficulty
        claim_type: variant_divergence
        grounds:
          - "complexity_profile.complexity_layers"
        excluded_because:
          difficulty_instance: withdrawal_pro_rata_vs_tax_aware_divergence
          rationale: "Both dual-variant calculations asserted in §1.8 rule 1 instances."

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_visibility
        claim_type: immediate_visibility
        grounds:
          - "complexity_profile.consistency_model"
          - "calculations.portfolio_valuation"
        distinguishing_aspect: "Immediate consistency: the mutation response itself carries computed fields, and the very next reads of related entities reflect the change — no lag, no read-repair."
        test_recipe:
          setup: ["ACTIVE portfolio (US 100/50 IPS); security EQA @ 1000"]
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "Imm", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "X", risk_tolerance_score: 50 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: US_EQUITY, target_pct: 100.00, band_pct: 50.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c}" }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c}", name: "P", tax_status: TAXABLE }, as: Advisor, captures: { p: $.data.id } }
            - { call: "POST /advisory/portfolios/${p}/activate", as: Advisor }
            - { call: "POST /advisory/securities", payload: { ticker: "EQA", asset_class: US_EQUITY, initial_price_cents: 1000 }, as: ComplianceOfficer, captures: { s: $.data.id } }
          trigger:
            - { call: "POST /advisory/positions", payload: { portfolio_id: "${p}", security_id: "${s}", quantity: 10, opening_cost_basis_cents: 7000 }, as: Advisor, captures: { mv: $.data.market_value_cents } }
            - { call: "GET /advisory/portfolios/${p}", as: Advisor, captures: { tot: $.data.total_value_cents } }
            - { call: "POST /advisory/securities/${s}/reprice", payload: { new_price_cents: 1200 }, as: ComplianceOfficer, captures: { pc: $.data.price_cents } }
            - { call: "GET /advisory/positions", payload: { portfolio_id: "${p}", security_id: "${s}" }, as: Advisor, captures: { mv2: "$.data[0].market_value_cents" } }
            - { call: "GET /advisory/clients/${c}", as: Advisor, captures: { aum: $.data.total_aum_cents } }
          assert:
            - "create response already carries market_value_cents == 10000; the immediate portfolio read shows total_value_cents == 10000"
            - "reprice response carries price_cents == 1200; the immediate position list read shows market_value_cents == 12000"
            - "client read immediately shows total_aum_cents == 12000 (cross-entity derived field, same request sequence)"

  # ===========================================================================
  # Section: state_machines (appendix — close guards)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: portfolio_close_guards_and_terminal_lockdown
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Portfolio.ACTIVE_to_CLOSED"
          - "errors[ERR_PORTFOLIO_NOT_EMPTY]"
          - "errors[ERR_OPEN_WORK_ITEMS]"
          - "errors[ERR_PORTFOLIO_INVALID_STATE]"
        distinguishing_aspect: "Close is gated by emptiness (cash 100000 -> 422 ERR_PORTFOLIO_NOT_EMPTY) then by open work items (a SUBMITTED withdrawal -> 422 ERR_OPEN_WORK_ITEMS); after cancelling the withdrawal the close succeeds and CLOSED is terminal."
        test_recipe:
          setup: ["ACTIVE client with ACTIVE IPS (CASH 100/50); ACTIVE portfolio with cash 100000 and no positions; withdrawal W (SUBMITTED, amount 1) created after draining cash"]
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "Close", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "X", risk_tolerance_score: 50 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: CASH_EQUIVALENT, target_pct: 100.00, band_pct: 50.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c}" }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c}", name: "P", tax_status: TAXABLE }, as: Advisor, captures: { p: $.data.id } }
            - { call: "POST /advisory/portfolios/${p}/activate", as: Advisor }
            - { call: "POST /advisory/portfolios/${p}/cash-movements", payload: { direction: DEPOSIT, amount_cents: 100000, occurred_at: "2026-08-01T00:00:00Z" }, as: Advisor }
          trigger:
            - { call: "POST /advisory/portfolios/${p}/close", as: Advisor, captures: { err1: $.data.error_id } }
            - { call: "POST /advisory/portfolios/${p}/cash-movements", payload: { direction: WITHDRAWAL, amount_cents: 100000, occurred_at: "2026-08-01T00:00:00Z" }, as: Advisor }
            - { call: "POST /advisory/withdrawal-requests", payload: { portfolio_id: "${p}", amount_cents: 1, funding_mode: CASH_FIRST }, as: Advisor, captures: { w: $.data.id } }
            - { call: "POST /advisory/portfolios/${p}/close", as: Advisor, captures: { err2: $.data.error_id } }
            - { call: "POST /advisory/withdrawal-requests/${w}/cancel", as: Client, as_user_id: "${c}" }
            - { call: "POST /advisory/portfolios/${p}/close", as: Advisor, captures: { st: $.data.lifecycle_status } }
            - { call: "POST /advisory/portfolios/${p}/freeze", as: ComplianceOfficer, captures: { err3: $.data.error_id } }
          assert:
            - "close with cash 100000: 422 ERR_PORTFOLIO_NOT_EMPTY"
            - "after draining cash to 0 but with SUBMITTED withdrawal open: 422 ERR_OPEN_WORK_ITEMS"
            - "after owner cancels the withdrawal: close succeeds -> lifecycle_status CLOSED, drift_status WITHIN_BANDS (vacuous)"
            - "freeze on CLOSED: 409 ERR_PORTFOLIO_INVALID_STATE (terminal lockdown)"
