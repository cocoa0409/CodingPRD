  # ===========================================================================
  - section: calculations
    instances:
      - name: seed_transfer_window_exact_36h_allowed
        claim_type: Correct Result
        grounds:
          - calculations.seed_train_timing
          - errors.ERR_SEED_TRANSFER_WINDOW_EXPIRED
        distinguishing_aspect: "Boundary: a successor stage starting exactly 36 hours after its predecessor completed is allowed (<= semantics); the predecessor stays COMPLETED."
        test_recipe:
          setup:
            - "Campaign in SEED_IN_PROGRESS; stage 1 COMPLETED at 2026-10-01T10:00:00Z; stage 2 defined."
          setup_api_calls:
            - *k_clock
            - *k_site
            - *k_product
            - *k_train
            - *k_campaign
            - *k_alloc
            - *k_seed
            - *k_seed_start
            - *k_seed_run
            - *k_clock10
            - *k_seed_done
            - call: "POST /campaigns/${camp_id}/seed-stages"
              payload: { stage_index: 2, planned_duration_hours: 8 }
              as: ProcessEngineer
              captures: { ss2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T22:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /seed-stages/${ss2}/advance"
              payload: { to_status: "RUNNING" }
              as: ProcessEngineer
          assert:
            - "the response status is 200 and SeedTrainStage.${ss2}.status == RUNNING (exactly 36 hours elapsed, allowed)"
            - "SeedTrainStage.${ss1}.status remains COMPLETED (no expiry on the boundary)"

      - name: seed_transfer_window_expired_flips_predecessor_and_recovers
        claim_type: Correct Result
        grounds:
          - calculations.seed_train_timing
          - state_machines.SeedTrainStage.COMPLETED_to_EXPIRED
          - state_machines.SeedTrainStage.EXPIRED_to_RUNNING
        distinguishing_aspect: "Boundary + recovery cycle: at 36 hours plus 1 second the successor start is rejected and the predecessor flips COMPLETED -> EXPIRED; the EXPIRED stage retries to RUNNING and COMPLETED, after which the successor start succeeds."
        test_recipe:
          setup:
            - "Campaign in SEED_IN_PROGRESS; stage 1 COMPLETED at 2026-10-01T10:00:00Z; stage 2 defined; clock at 2026-10-02T22:00:01Z."
          setup_api_calls:
            - *k_clock
            - *k_site
            - *k_product
            - *k_train
            - *k_campaign
            - *k_alloc
            - *k_seed
            - *k_seed_start
            - *k_seed_run
            - *k_clock10
            - *k_seed_done
            - call: "POST /campaigns/${camp_id}/seed-stages"
              payload: { stage_index: 2, planned_duration_hours: 8 }
              as: ProcessEngineer
              captures: { ss2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T22:00:01Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /seed-stages/${ss2}/advance"
              payload: { to_status: "RUNNING" }
              as: ProcessEngineer
              captures: { err: $.data.error_id }
            - call: "POST /seed-stages/${ss1}/advance"
              payload: { to_status: "RUNNING" }
              as: ProcessEngineer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-03T06:00:01Z" }
              as: PlatformAdmin
            - call: "POST /seed-stages/${ss1}/advance"
              payload: { to_status: "COMPLETED" }
              as: ProcessEngineer
            - call: "POST /seed-stages/${ss2}/advance"
              payload: { to_status: "RUNNING" }
              as: ProcessEngineer
          assert:
            - "the first stage-2 start is rejected 409 with ${err} == ERR_SEED_TRANSFER_WINDOW_EXPIRED (36h + 1s)"
            - "SeedTrainStage.${ss1} flipped to EXPIRED by the rejected attempt"
            - "after the EXPIRED -> RUNNING -> COMPLETED retry, the stage-2 start succeeds (0h elapsed <= 36h)"

      - name: inoculation_window_expiry_flips_last_stage_and_exact_24h_boundary
        claim_type: Correct Result
        grounds:
          - calculations.seed_train_timing
          - state_machines.Campaign.SEED_IN_PROGRESS_to_PRODUCTION_IN_PROGRESS
          - errors.ERR_SEED_INOCULATION_WINDOW_EXPIRED
        distinguishing_aspect: "A production start 1 second past the 24-hour inoculation window is rejected and flips the last seed stage to EXPIRED (recovery path); after a retry completes the stage, a start at exactly 24 hours after the new completion is allowed."
        test_recipe:
          setup:
            - "Single-stage campaign in SEED_IN_PROGRESS; stage 1 COMPLETED at 2026-10-01T10:00:00Z; clock at 2026-10-02T10:00:01Z."
          setup_api_calls:
            - *k_clock
            - *k_site
            - *k_product
            - *k_train
            - *k_campaign
            - *k_alloc
            - *k_seed
            - *k_seed_start
            - *k_seed_run
            - *k_clock10
            - *k_seed_done
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T10:00:01Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /campaigns/${camp_id}/advance"
              payload: { to_status: "PRODUCTION_IN_PROGRESS" }
              as: ProcessEngineer
              captures: { err: $.data.error_id }
            - call: "POST /seed-stages/${ss1}/advance"
              payload: { to_status: "RUNNING" }
              as: ProcessEngineer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T20:00:01Z" }
              as: PlatformAdmin
            - call: "POST /seed-stages/${ss1}/advance"
              payload: { to_status: "COMPLETED" }
              as: ProcessEngineer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-03T20:00:01Z" }
              as: PlatformAdmin
            - call: "POST /campaigns/${camp_id}/advance"
              payload: { to_status: "PRODUCTION_IN_PROGRESS" }
              as: ProcessEngineer
          assert:
            - "the first production start is rejected 409 with ${err} == ERR_SEED_INOCULATION_WINDOW_EXPIRED (24h + 1s)"
            - "SeedTrainStage.${ss1} flipped to EXPIRED (the campaign is not stranded)"
            - "the second production start, exactly 24 hours after the retried completion, succeeds: Campaign.${camp_id}.status == PRODUCTION_IN_PROGRESS"

