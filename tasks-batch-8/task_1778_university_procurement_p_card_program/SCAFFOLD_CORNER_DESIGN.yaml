          trigger:
            - call: "POST /pcards/${pc_id}/close"
              as: ProcurementAdmin
              captures: { err1: $.data.error_id }
            - call: "POST /pcard-transactions/${t_id}/reconcile"
              payload: { receipt_reference: "rcpt-9", allocation_type: "GENERAL" }
              as: Cardholder
              as_user_id: "${pc_id}"
            - call: "POST /pcards/${pc_id}/close"
              as: ProcurementAdmin
              captures: { pc_status: $.data.status }
            - call: "POST /pcards/${pc_id}/transactions"
              payload: { amount_cents: 10000, entry_type: "DEBIT", merchant_name: "Shell", mcc_code: "5541" }
              as: Cardholder
              as_user_id: "${pc_id}"
              captures: { err2: $.data.error_id }
          assert:
            - "close with a POSTED transaction: err1 == ERR_CARD_HAS_OPEN_TRANSACTIONS"
            - "after reconcile: close succeeds (status CLOSED)"
            - "post on CLOSED card: err2 == ERR_CARD_CLOSED (not ERR_CARD_NOT_ACTIVE — that one is for SUSPENDED)"

  - section: calculations
    instances:
      - name: award_score_tie_and_override_gate
        claim_type: correct_result
        grounds: ["calculations.award_score", "errors", "ERR_AWARD_NOT_TOP_SCORE"]
        distinguishing_aspect: "Weighted scoring with a full tie: three identical-price quotes from uncertified vendors all score exactly 70.00, so the selector falls to submitted_at/created_at order — the FIRST submitted quote wins; naming a tied non-winner without override_reason fails with ERR_AWARD_NOT_TOP_SCORE."
        test_recipe:
          setup: ["Solicitation (deadline 2026-08-08) on a 3,000,000 requisition; three quotes all at 3,050,000, vendors with no certs/tiers, all submitted at the same clock position"]
          setup_api_calls:
