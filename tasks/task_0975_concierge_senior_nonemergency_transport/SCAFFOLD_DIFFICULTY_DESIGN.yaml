# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Concierge Senior & Non-Emergency Transport. 9 rules x >=2 instances = 20.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains: Ride fare vs Driver load)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: ride_fare_provisional_vs_final_settlement
        grounds:
          - calculations.ride_fare
          - entities.Ride.fields.quoted_fare_cents
          - entities.Ride.fields.final_fare_cents
        distinguishing_aspect: |
          Same ride, same ACTIVE STANDARD rate card: the provisional variant at
          creation (estimates 90 min / 12 mi, zero wait) yields 6300 while the
          final variant at completion (actuals 60 min / 10 mi / 25 wait min)
          yields 5250 — two valid evaluations of one formula that differ by 1050.
        test_recipe:
          setup:
            - "ACTIVE STANDARD rate card (hourly 3000, per_mile 150, wait 50/min, included_wait 10, minimum 2501, AH x1.1 from 18:00)"
            - "ACTIVE client in zone north; ACTIVE SEDAN driver certified DOOR_THROUGH_DOOR in zone north"
            - "Ride: pickup 2026-06-01T10:00:00Z, est 90 min / 12 mi; completed with service 60 min, 10 mi, wait segments 15+10"
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { service_class: "STANDARD", effective_from: "2026-01-01", effective_to: "2027-01-01", hourly_rate_cents: 3000, per_mile_cents: 150, wait_per_minute_cents: 50, included_wait_minutes: 10, minimum_charge_cents: 2501, after_hours_multiplier_bp: 11000, after_hours_start_minute: 1080, wav_surcharge_cents: 0 }, as: PlatformAdmin, captures: { rc_std: $.data.id } }
            - { call: "POST /rate-cards/${rc_std}/activate", as: PlatformAdmin }
            - { call: "POST /clients", payload: { full_name: "Ada L", mobility_aid: "NONE", assist_level_default: "DOOR_TO_DOOR", home_zone: "north", address: "1 Main St" }, as: Coordinator, captures: { cli: $.data.id } }
            - { call: "POST /drivers", payload: { full_name: "Dan D", vehicle_class: "SEDAN", assist_certification: "DOOR_THROUGH_DOOR", home_zone: "north", max_daily_service_minutes: 480 }, as: Coordinator, captures: { drv: $.data.id } }
            - { call: "POST /compliance-docs", payload: { driver_id: "${drv}", doc_type: "BACKGROUND_CHECK", valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: Coordinator, captures: { doc_bg: $.data.id } }
            - { call: "POST /compliance-docs/${doc_bg}/review", payload: { decision: "APPROVE", review_note: "clear" }, as: ComplianceOfficer }
            - { call: "POST /compliance-docs", payload: { driver_id: "${drv}", doc_type: "BONDING", valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: Coordinator, captures: { doc_bd: $.data.id } }
            - { call: "POST /compliance-docs/${doc_bd}/review", payload: { decision: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /compliance-docs", payload: { driver_id: "${drv}", doc_type: "INSURANCE", valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: Coordinator, captures: { doc_in: $.data.id } }
            - { call: "POST /compliance-docs/${doc_in}/review", payload: { decision: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /drivers/${drv}/status-events", payload: { event_type: "ACTIVATE" }, as: Coordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T09:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides", payload: { client_id: "${cli}", kind: "GROCERY", scheduled_pickup_at: "2026-06-01T10:00:00Z", estimated_duration_minutes: 90, estimated_distance_miles: 12, origin_zone: "north" }, as: Client, as_user_id: "${cli}", captures: { ride: $.data.id, quote: $.data.quoted_fare_cents } }
            - { call: "POST /rides/${ride}/dispatch", as: Coordinator, as_user_id: "coord-1", captures: { asg: $.data.id } }
            - { call: "POST /assignments/${asg}/respond", payload: { decision: "ACCEPT" }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T09:20:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides/${ride}/execution-events", payload: { event_type: "EN_ROUTE" }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T09:50:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides/${ride}/execution-events", payload: { event_type: "ARRIVED" }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides/${ride}/execution-events", payload: { event_type: "WAIT_STARTED" }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:15:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides/${ride}/execution-events", payload: { event_type: "WAIT_ENDED" }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /rides/${ride}/execution-events", payload: { event_type: "SERVICE_STARTED" }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T11:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides/${ride}/execution-events", payload: { event_type: "WAIT_STARTED" }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T11:10:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides/${ride}/execution-events", payload: { event_type: "WAIT_ENDED" }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T11:15:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides/${ride}/execution-events", payload: { event_type: "COMPLETE", actual_distance_miles: 10 }, as: Driver, as_user_id: "${drv}", captures: { final: $.data.final_fare_cents } }
          trigger: []
          assert:
            - "Ride.${ride}.quoted_fare_cents == 6300 (3000*90/60=4500 hourly + 150*12=1800 mileage, estimates, zero wait, no after-hours, floor not binding)"
            - "Ride.${ride}.final_fare_cents == 5250 (3000 hourly for 60 actual min + 1500 mileage + 750 wait = (25-10)*50, floor not binding)"
            - "Ride.${ride}.quoted_fare_cents != Ride.${ride}.final_fare_cents (6300 != 5250)"
            - "Ride.${ride}.wait_minutes == 25 and Ride.${ride}.service_minutes == 60"

      - name: driver_scheduled_load_vs_worked_actuals
        grounds:
          - calculations.driver_load_metrics
          - entities.Driver.fields.current_load_minutes
          - entities.Driver.fields.day_worked_minutes
        distinguishing_aspect: |
          Same driver, same logical day: forward-looking current_load_minutes
          counts an ASSIGNED ride at its 90-minute estimate while chronological
          day_worked_minutes counts a COMPLETED ride at its replayed 45 actual
          minutes — 90 != 45 on one driver-day.
        test_recipe:
          setup:
            - "ACTIVE STANDARD card; ACTIVE client; ACTIVE driver (cap 480)"
            - "Ride W: pickup 2026-06-01T08:00:00Z est 60/8, completed with service 45 min"
            - "Ride R2: pickup 2026-06-01T14:00:00Z est 90/10, ASSIGNED but not started"
            - "Logical clock 2026-06-01 (both rides' pickup date == logical today)"
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { service_class: "STANDARD", effective_from: "2026-01-01", effective_to: "2027-01-01", hourly_rate_cents: 3000, per_mile_cents: 150, wait_per_minute_cents: 50, included_wait_minutes: 10, minimum_charge_cents: 2501, after_hours_multiplier_bp: 11000, after_hours_start_minute: 1080, wav_surcharge_cents: 0 }, as: PlatformAdmin, captures: { rc_std: $.data.id } }
            - { call: "POST /rate-cards/${rc_std}/activate", as: PlatformAdmin }
            - { call: "POST /clients", payload: { full_name: "Ada L", mobility_aid: "NONE", assist_level_default: "DOOR_TO_DOOR", home_zone: "north", address: "1 Main St" }, as: Coordinator, captures: { cli: $.data.id } }
            - { call: "POST /drivers", payload: { full_name: "Dan D", vehicle_class: "SEDAN", assist_certification: "DOOR_THROUGH_DOOR", home_zone: "north", max_daily_service_minutes: 480 }, as: Coordinator, captures: { drv: $.data.id } }
            - { call: "POST /compliance-docs", payload: { driver_id: "${drv}", doc_type: "BACKGROUND_CHECK", valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: Coordinator, captures: { doc_bg: $.data.id } }
            - { call: "POST /compliance-docs/${doc_bg}/review", payload: { decision: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /compliance-docs", payload: { driver_id: "${drv}", doc_type: "BONDING", valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: Coordinator, captures: { doc_bd: $.data.id } }
            - { call: "POST /compliance-docs/${doc_bd}/review", payload: { decision: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /compliance-docs", payload: { driver_id: "${drv}", doc_type: "INSURANCE", valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: Coordinator, captures: { doc_in: $.data.id } }
            - { call: "POST /compliance-docs/${doc_in}/review", payload: { decision: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /drivers/${drv}/status-events", payload: { event_type: "ACTIVATE" }, as: Coordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-31T09:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides", payload: { client_id: "${cli}", kind: "GROCERY", scheduled_pickup_at: "2026-06-01T08:00:00Z", estimated_duration_minutes: 60, estimated_distance_miles: 8, origin_zone: "north" }, as: Client, as_user_id: "${cli}", captures: { ride_w: $.data.id } }
            - { call: "POST /rides", payload: { client_id: "${cli}", kind: "APPOINTMENT", scheduled_pickup_at: "2026-06-01T14:00:00Z", estimated_duration_minutes: 90, estimated_distance_miles: 10, origin_zone: "north" }, as: Client, as_user_id: "${cli}", captures: { ride_r2: $.data.id } }
            - { call: "POST /rides/${ride_w}/dispatch", as: Coordinator, as_user_id: "coord-1", captures: { asg_w: $.data.id } }
            - { call: "POST /assignments/${asg_w}/respond", payload: { decision: "ACCEPT" }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T07:40:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides/${ride_w}/execution-events", payload: { event_type: "EN_ROUTE" }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T07:55:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides/${ride_w}/execution-events", payload: { event_type: "ARRIVED" }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides/${ride_w}/execution-events", payload: { event_type: "SERVICE_STARTED" }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T08:45:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides/${ride_w}/execution-events", payload: { event_type: "COMPLETE", actual_distance_miles: 8 }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /rides/${ride_r2}/dispatch", as: Coordinator, as_user_id: "coord-1", captures: { asg_r2: $.data.id } }
            - { call: "POST /assignments/${asg_r2}/respond", payload: { decision: "ACCEPT" }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T12:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /drivers/${drv}", as: Coordinator, captures: { load: $.data.current_load_minutes, worked: $.data.day_worked_minutes } }
          assert:
            - "Driver.${drv}.current_load_minutes == 90 (only R2 ASSIGNED counts, at its estimate)"
            - "Driver.${drv}.day_worked_minutes == 45 (only W COMPLETED counts, at replayed actuals)"
            - "Driver.${drv}.current_load_minutes != Driver.${drv}.day_worked_minutes (90 != 45)"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (modes (a), (b), (c) — three different modes)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: fare_floor_binds_after_hours_multiplier
        grounds:
          - calculations.ride_fare
          - calculations.wait_time_billing
        distinguishing_aspect: |
          Mode (a): a >=3-input non-linear formula — after-hours conditional
          multiplier (2200 -> 2420) composed with wait threshold and the
          minimum-charge max() floor; the floor binds last, pinning 2501 with an
          81-cent MINIMUM_ADJUSTMENT. Any other evaluation order changes cents.
        test_recipe:
          setup:
            - "ACTIVE STANDARD card; ACTIVE client; ACTIVE driver"
            - "Ride pickup 2026-06-02T19:00:00Z (after-hours start 18:00); actuals: wait 12 min, service 30 min, 4 mi"
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { service_class: "STANDARD", effective_from: "2026-01-01", effective_to: "2027-01-01", hourly_rate_cents: 3000, per_mile_cents: 150, wait_per_minute_cents: 50, included_wait_minutes: 10, minimum_charge_cents: 2501, after_hours_multiplier_bp: 11000, after_hours_start_minute: 1080, wav_surcharge_cents: 0 }, as: PlatformAdmin, captures: { rc_std: $.data.id } }
            - { call: "POST /rate-cards/${rc_std}/activate", as: PlatformAdmin }
            - { call: "POST /clients", payload: { full_name: "Ada L", mobility_aid: "NONE", assist_level_default: "DOOR_TO_DOOR", home_zone: "north", address: "1 Main St" }, as: Coordinator, captures: { cli: $.data.id } }
            - { call: "POST /drivers", payload: { full_name: "Dan D", vehicle_class: "SEDAN", assist_certification: "DOOR_THROUGH_DOOR", home_zone: "north", max_daily_service_minutes: 480 }, as: Coordinator, captures: { drv: $.data.id } }
            - { call: "POST /compliance-docs", payload: { driver_id: "${drv}", doc_type: "BACKGROUND_CHECK", valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: Coordinator, captures: { doc_bg: $.data.id } }
            - { call: "POST /compliance-docs/${doc_bg}/review", payload: { decision: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /compliance-docs", payload: { driver_id: "${drv}", doc_type: "BONDING", valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: Coordinator, captures: { doc_bd: $.data.id } }
            - { call: "POST /compliance-docs/${doc_bd}/review", payload: { decision: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /compliance-docs", payload: { driver_id: "${drv}", doc_type: "INSURANCE", valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: Coordinator, captures: { doc_in: $.data.id } }
            - { call: "POST /compliance-docs/${doc_in}/review", payload: { decision: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /drivers/${drv}/status-events", payload: { event_type: "ACTIVATE" }, as: Coordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T09:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides", payload: { client_id: "${cli}", kind: "COMPANION_OUTING", scheduled_pickup_at: "2026-06-02T19:00:00Z", estimated_duration_minutes: 30, estimated_distance_miles: 4, origin_zone: "north" }, as: Client, as_user_id: "${cli}", captures: { ride: $.data.id } }
            - { call: "POST /rides/${ride}/dispatch", as: Coordinator, as_user_id: "coord-1", captures: { asg: $.data.id } }
            - { call: "POST /assignments/${asg}/respond", payload: { decision: "ACCEPT" }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-02T18:50:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides/${ride}/execution-events", payload: { event_type: "EN_ROUTE" }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-02T18:58:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides/${ride}/execution-events", payload: { event_type: "ARRIVED" }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-02T19:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides/${ride}/execution-events", payload: { event_type: "WAIT_STARTED" }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-02T19:12:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides/${ride}/execution-events", payload: { event_type: "WAIT_ENDED" }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /rides/${ride}/execution-events", payload: { event_type: "SERVICE_STARTED" }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-02T19:42:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides/${ride}/execution-events", payload: { event_type: "COMPLETE", actual_distance_miles: 4 }, as: Driver, as_user_id: "${drv}", captures: { final: $.data.final_fare_cents } }
          trigger: []
          assert:
            - "Ride.${ride}.final_fare_cents == 2501 (hourly 1500 + mileage 600 + wait 100 = 2200; after-hours x1.1 -> 2420; max(2420, 2501) floor binds -> 2501)"
            - "Ride.${ride}.wait_minutes == 12 (billable 2 after included 10)"
            - "Ride.${ride}.service_minutes == 30"

      - name: invoice_per_line_rounding_then_sum
        grounds:
          - calculations.invoice_aggregation
          - calculations.cancellation_fee
          - entities.InvoiceLine.fields.amount_cents
        distinguishing_aspect: |
          Mode (b): nested rounding with pinned order — each 50%-of-2501 late-cancel
          fee line rounds half-up to 1251 BEFORE summing, so two such lines total
          2502; rounding the unrounded sum once would give 2501. The scaffold pins
          per-line-then-sum and the invoice proves it.
        test_recipe:
          setup:
            - "ACTIVE STANDARD card with odd-cent minimum 2501; ACTIVE client with credit 0"
            - "Two rides cancelled with exactly 240 minutes notice (50% tier)"
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { service_class: "STANDARD", effective_from: "2026-01-01", effective_to: "2027-01-01", hourly_rate_cents: 3000, per_mile_cents: 150, wait_per_minute_cents: 50, included_wait_minutes: 10, minimum_charge_cents: 2501, after_hours_multiplier_bp: 11000, after_hours_start_minute: 1080, wav_surcharge_cents: 0 }, as: PlatformAdmin, captures: { rc_std: $.data.id } }
            - { call: "POST /rate-cards/${rc_std}/activate", as: PlatformAdmin }
            - { call: "POST /clients", payload: { full_name: "Ada L", mobility_aid: "NONE", assist_level_default: "DOOR_TO_DOOR", home_zone: "north", address: "1 Main St" }, as: Coordinator, captures: { cli: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-08T09:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides", payload: { client_id: "${cli}", kind: "GROCERY", scheduled_pickup_at: "2026-06-10T16:00:00Z", estimated_duration_minutes: 60, estimated_distance_miles: 10, origin_zone: "north" }, as: Client, as_user_id: "${cli}", captures: { ride_a: $.data.id } }
            - { call: "POST /rides", payload: { client_id: "${cli}", kind: "GROCERY", scheduled_pickup_at: "2026-06-11T16:00:00Z", estimated_duration_minutes: 60, estimated_distance_miles: 10, origin_zone: "north" }, as: Client, as_user_id: "${cli}", captures: { ride_b: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T12:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides/${ride_a}/cancel", payload: { cancel_note: "feeling unwell" }, as: Client, as_user_id: "${cli}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-11T12:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides/${ride_b}/cancel", payload: { cancel_note: "feeling unwell" }, as: Client, as_user_id: "${cli}" }
            - { call: "POST /invoices/generate", payload: { client_id: "${cli}", period_start: "2026-06-08", period_end: "2026-06-15" }, as: BillingAdmin, captures: { inv: $.data.id, charges: $.data.charges_cents } }
          trigger:
            - { call: "GET /invoices/${inv}/lines", as: BillingAdmin, captures: { line0: "$.data[0].amount_cents", line1: "$.data[1].amount_cents", kind0: "$.data[0].line_kind", kind1: "$.data[1].line_kind" } }
          assert:
            - "Invoice.${inv}.charges_cents == 2502 (per-line round_half_up(2501*0.5)=1251 each, then 1251+1251; NOT round(5002*0.5)=2501)"
            - "Invoice.${inv}.total_due_cents == 2502 (credit 0 applied)"
            - "lines[0].line_kind == CANCELLATION_FEE and lines[0].amount_cents == 1251"
            - "lines[1].line_kind == CANCELLATION_FEE and lines[1].amount_cents == 1251"

      - name: credit_share_capped_before_deduction
        grounds:
          - calculations.invoice_credit_application
          - entities.Invoice.fields.credit_applied_cents
          - entities.Invoice.fields.total_due_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — credit cap is a share of charges
          while total_due depends on applied credit. The pinned order (charges ->
          min(balance, floor(charges*0.5)) -> due) yields applied=3000, due=8200
          on charges=11200 with balance=3000; any other order is undefined/different.
        test_recipe:
          setup:
            - "ACTIVE WAV card (hourly 3600, per_mile 175, min 3000, WAV surcharge 1200)"
            - "Client with mobility_aid POWER_WHEELCHAIR (rides derive WAV class) and credit_balance_cents 3000 from an earlier overpayment"
            - "Completed WAV ride: service 120 min, 16 mi, zero wait -> charges 11200"
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { service_class: "WAV", effective_from: "2026-01-01", effective_to: "2027-01-01", hourly_rate_cents: 3600, per_mile_cents: 175, wait_per_minute_cents: 50, included_wait_minutes: 10, minimum_charge_cents: 3000, after_hours_multiplier_bp: 11000, after_hours_start_minute: 1080, wav_surcharge_cents: 1200 }, as: PlatformAdmin, captures: { rc_wav: $.data.id } }
            - { call: "POST /rate-cards/${rc_wav}/activate", as: PlatformAdmin }
            - { call: "POST /clients", payload: { full_name: "Walt W", mobility_aid: "POWER_WHEELCHAIR", assist_level_default: "DOOR_THROUGH_DOOR", home_zone: "north", address: "9 Oak Ave" }, as: Coordinator, captures: { cli: $.data.id } }
            - { call: "POST /family-members", payload: { client_id: "${cli}", full_name: "Faye F", relation: "daughter", access_level: "BILLING_PAYER" }, as: Coordinator, captures: { fam: $.data.id } }
