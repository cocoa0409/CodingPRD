  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: spec_issue_stale_project_version_rejected_occ
        claim_type: optimistic_concurrency_stale_version
        grounds:
          - "concurrency_rules[spec-issue-stale-project]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Issuing a specification with an expected_project_version captured BEFORE another mutation bumped Project.version is rejected 412 ERR_STALE_VERSION — the OCC guard on the issue write_endpoint fires deterministically from two strictly sequential reads."
        test_recipe:
          setup:
            - "clock; regulation; coating system; project created (version captured as proj_v_stale); a first spec ISSUED (bumps project version); a second DRAFT spec"
          setup_api_calls:
            - call: "POST /coating/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coating/voc-regulations"
              payload: { jurisdiction_code: "US-CA-SCAQMD", application_method: "SPRAY_AIRLESS", voc_limit_gpl: 340, effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /coating/coating-systems"
              payload: { system_code: "SW-OCC-1", manufacturer_name: "SW", surface_prep_standard: "SSPC_SP10_NEAR_WHITE", min_surface_profile_mils: 2.0, max_surface_profile_mils: 4.0, coat_count: 3, total_dft_min_mils: 9.0, total_dft_max_mils: 15.0, base_voc_gpl: 250, thinner_voc_gpl: 420, max_thinner_pct: 0.10, adhesion_min_psi: 500 }
