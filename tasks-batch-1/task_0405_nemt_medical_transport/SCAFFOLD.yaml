    input: ["member_id?", "standing_order_id?", "assigned_broker_id?", "assigned_driver_id?", "limit?", "offset?"]
    output: TripRequest[]
    side_effects: []

  - method: POST
    path: "/trips/{id}/schedule"
    description: "Schedule a DRAFT trip; creates OUTBOUND (+ RETURN) Legs"
    roles: [Coordinator]
    code: 200
    input: []
