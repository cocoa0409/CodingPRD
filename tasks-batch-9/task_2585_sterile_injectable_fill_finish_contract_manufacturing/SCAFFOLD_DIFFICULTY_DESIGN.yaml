            - "after trigger call 2: MediaFill.${mf1_id}.status == PASSED and MediaFill.${mf1_id}.outcome_reason == 'ADJUDICATED_PASS'"
            - "after trigger call 2: FillingSuite.${suite_id}.aseptic_qualification_status == QUALIFIED and media_fill_valid_until == '2027-03-03T00:00:00Z'"
            - "trigger call 3 returns HTTP 200, PersonnelQualification.${pq_a_id}.status == QUALIFIED and qualified_at == '2026-09-01T00:00:00Z'"
            - "trigger call 4 returns HTTP 409 with error.id == 'ERR_MEDIA_FILL_NOT_PASSED' and PersonnelQualification.${pq_z_id}.status stays PENDING"
            - "trigger call 5 returns HTTP 200 and PersonnelQualification.${pq_g_id}.status == QUALIFIED"
            - "FillingSuite.${suite_id}.qualified_operator_count == 2 and FillingSuite.${suite_id}.posture == OPEN"

  - rule_id: resource_temporal_overlap
    instances:

      - name: suite_half_open_window_plus_directional_changeover_buffer_strict_boundary
        grounds:
          - validations[priority=76]
          - calculations.changeover_minutes_applied
          - calculations.suite_committed_minutes
          - entities.FillingSuite.fields.changeover_minutes_same_product
          - entities.BatchOrder.fields.changeover_minutes_applied
        distinguishing_aspect: |
          Suite occupancy is a HALF-OPEN interval inflated by a directional changeover buffer, and
          both comparisons are STRICT. With B-001 occupying [2026-09-10T08:00, 16:00) in FS-1 and a
          same-molecule buffer of 60 minutes, a B-002 starting at 16:59 is rejected
          (16:59 < 16:00+60) while a B-002 starting at EXACTLY 17:00 is accepted, because
          `new.planned_start < x.planned_end + buffer` is false at equality. The accepted row then
          proves the buffer is charged twice over: changeover_minutes_applied is 60 (a live
          predecessor with planned_end <= planned_start exists, so SUITE_INITIAL_SETUP_MINUTES is
          NOT used) and committed_minutes becomes 540 + 420 + 60 = 1020.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "FillingSuite FS-1 grade B QUALIFIED with media_fill_valid_until 2027-03-03T00:00:00Z, changeover_minutes_same_product 60, changeover_minutes_product_change 240, max_committed_minutes 20000."
            - "OP-A QUALIFIED in FS-1 until 2027-06-01T00:00:00Z."
            - "ClientProject 'Sponsor A' ACTIVE for MOL-A, dosage_form VIAL, reserved_unit_budget 50000."
            - "BatchOrder B-001 SCHEDULED for 2026-09-10 08:00-16:00 with changeover_minutes_applied 60 (initial setup), so the suite's committed_minutes is 540 and committed_demand_units is 21560."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /filling-suites"
