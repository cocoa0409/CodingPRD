          difficulty_instance: room_capacity_exact_equality_fits_then_full
          rationale: "That §1.8 instance triggers ERR_SESSION_FULL with the third registration against capacity 2."

      - name: irregularity_open_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_IRREGULARITY_OPEN]"]
        distinguishing_aspect: "Coverage note: release blocked by HELD record."
        excluded_because:
          difficulty_instance: score_release_blocked_by_open_irregularity
          rationale: "That §1.8 instance asserts ERR_IRREGULARITY_OPEN and transactional no-write."

      - name: teacher_not_authorized_lock_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_TEACHER_NOT_AUTHORIZED]"]
        distinguishing_aspect: "Coverage note: order lock gate."
        excluded_because:
          difficulty_instance: order_lock_requires_authorized_teacher
          rationale: "That §1.8 instance triggers ERR_TEACHER_NOT_AUTHORIZED on lock with a PENDING_TRAINING record."

      - name: stale_version_and_state_priority_stub
        claim_type: priority_ordering
        grounds: ["validations[priority=6]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Coverage note: state-beats-constraint priority pair on PATCH."
        excluded_because:
          difficulty_instance: state_beats_constraint_on_order_patch
          rationale: "That §1.8 instance asserts ERR_INVALID_STATE wins over ERR_NEGATIVE_QUANTITY on a SUBMITTED order."

  # ---------------------------------------------------------------------------
  # Section: endpoints
  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: release_scores_rejects_out_of_range_score
        claim_type: bulk_action
        grounds: ["endpoints:POST /exam-cycles/{id}/release-scores", "errors[ERR_INVALID_REQUEST]", "validations[priority=4]"]
        distinguishing_aspect: "The bulk release validates program score ranges (AP 1..5): a listed score of 6 rejects the whole request with 400 ERR_INVALID_REQUEST and the valid co-listed record stays PENDING (transactional)."
        test_recipe:
          setup: ["Cycle OPEN; course ACTIVE; students r1, r2 both SAT; clock at score_release_at"]
          setup_api_calls:
            - call: "POST /exam-cycles"
              payload: { name: "CYCLE-2027", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 100000000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cy: $.data.id }
            - call: "POST /exam-cycles/${cy}/open"
              as: ApCoordinator
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_CALC_BC", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { co: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "T One", email: "t1@x.edu" }
              as: ApCoordinator
              captures: { t1: $.data.id }
            - call: "POST /teacher-authorizations"
              payload: { teacher_id: "${t1}", course_id: "${co}" }
              as: ApCoordinator
              captures: { ta1: $.data.id }
            - call: "POST /teacher-authorizations/${ta1}/complete-training"
              as: Teacher
              as_user_id: "${t1}"
            - call: "POST /students"
              payload: { full_name: "Stu A", grade_level: 11, subgroup_code: "GEN" }
              as: ApCoordinator
              captures: { s1: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu B", grade_level: 11, subgroup_code: "GEN" }
              as: ApCoordinator
              captures: { s2: $.data.id }
            - call: "POST /registrations"
              payload: { student_id: "${s1}", course_id: "${co}" }
              as: Student
              as_user_id: "${s1}"
              captures: { r1: $.data.id }
            - call: "POST /registrations"
              payload: { student_id: "${s2}", course_id: "${co}" }
              as: Student
              as_user_id: "${s2}"
              captures: { r2: $.data.id }
            - call: "POST /exam-sessions"
              payload: { course_id: "${co}", room_name: "GYM", room_capacity: 5, start_at: "2027-05-05T09:00:00Z", end_at: "2027-05-05T11:00:00Z" }
              as: ApCoordinator
              captures: { se: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-05T12:00:00Z" }
              as: ApCoordinator
            - call: "POST /exam-sessions/${se}/administer"
              payload: { present_registration_ids: ["${r1}", "${r2}"] }
              as: ApCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-05T12:00:00Z" }
              as: ApCoordinator
          trigger:
            - call: "POST /exam-cycles/${cy}/release-scores"
              payload: { scores: [{ registration_id: "${r1}", score: 4 }, { registration_id: "${r2}", score: 6 }] }
              as: Registrar
              captures: { err: $.data.error_id }
            - call: "GET /registrations/${r1}"
              as: ApCoordinator
          assert:
            - "HTTP 400 and error_id == ERR_INVALID_REQUEST (score 6 outside AP range 1..5)"
            - "Transactional: ExamRegistration.${r1}.score_status remains PENDING and score is null (the valid co-listed row is not released either)"

      - name: response_envelope_shape_on_object_get
        claim_type: standard_crud
        grounds: [response_envelope, "endpoints:GET /courses/{id}"]
        distinguishing_aspect: "Every response wraps data in the fixed envelope: meta.api_request_id + meta.api_request_timestamp present, response_type == object for single-GET, and the entity under data."
        test_recipe:
          setup: ["Cycle and course exist"]
          setup_api_calls:
            - call: "POST /exam-cycles"
              payload: { name: "CYCLE-2027", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 100000000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cy: $.data.id }
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_CALC_BC", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { co: $.data.id }
          trigger:
            - call: "GET /courses/${co}"
              as: ApCoordinator
          assert:
            - "Response has meta.api_request_id (string) and meta.api_request_timestamp (ISO8601); response_type == object; data.id == ${co}"

      - name: release_scores_happy_path_bulk
        claim_type: action_endpoint
        grounds: ["endpoints:POST /exam-cycles/{id}/release-scores"]
        distinguishing_aspect: "Coverage note: happy-path bulk release and its released_count output."
        excluded_because:
          difficulty_instance: registration_parallel_dimensions_independent
          rationale: "That §1.8 instance performs release-scores on r1 and asserts the RELEASED transition; happy-path bulk shape is exercised there."

      - name: computed_statement_read_stub
        claim_type: computed_read
        grounds: ["endpoints:GET /students/{id}/statement", calculations.student_balance]
        distinguishing_aspect: "Coverage note: computed statement read (both balance variants)."
        excluded_because:
          difficulty_instance: student_balance_provisional_vs_projected_divergence
          rationale: "That §1.8 instance reads the statement and asserts both computed variants with literals 9800 and 6200."

  # ---------------------------------------------------------------------------
  # Section: errors
  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: error_envelope_carries_id_and_message
        claim_type: violation_to_error
        grounds: [response_envelope, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Error responses carry the fixed error body: data.error_id and a human-readable data.message, with response_type == error and meta present."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /courses/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: ApCoordinator
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "HTTP 404; data.error_id == ERR_NOT_FOUND; data.message is a non-empty string; response_type == error"
        # Catalog cross-check: every error in §1.6 is triggered by at least one
        # instance in this file or in §1.8 — ERR_UNAUTHENTICATED
        # (missing_auth_header_returns_unauthenticated), ERR_FORBIDDEN (rbac
        # section), ERR_NOT_FOUND (entities section), ERR_INVALID_REQUEST
        # (required/extra-field/enum/end-start/score-range instances),
        # ERR_REFERENCE_NOT_FOUND (fk instance), ERR_INVALID_STATE
        # (cancel-again, repost, cycle-gate, VOID-release instances),
        # ERR_STALE_VERSION (OCC instance), ERR_IRREGULARITY_OPEN /
        # ERR_PROCTOR_SUBJECT_CONFLICT / ERR_ROOM_CONFLICT / ERR_PROCTOR_OVERLAP
        # / ERR_TEACHER_NOT_AUTHORIZED / ERR_SESSION_FULL (§1.8 stubs above),
        # ERR_ROOM_NOT_ACCOMMODATION_CAPABLE / ERR_OUTSIDE_EXAM_WINDOW /
        # ERR_SESSION_NOT_ENDED / ERR_SCORES_NOT_YET_AVAILABLE /
        # ERR_DUPLICATE_* / ERR_ORDER_ALREADY_EXISTS / ERR_NEGATIVE_QUANTITY /
        # ERR_SCORE_BELOW_THRESHOLD / ERR_BUDGET_EXCEEDED (validations section).

  # ---------------------------------------------------------------------------
  # Section: rbac
  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: student_cannot_create_course_returns_forbidden
        claim_type: rbac_exclusive_denial
        grounds: [roles.ApCoordinator, "endpoints:POST /courses", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Course creation is exclusive to ApCoordinator; a Student caller with a perfectly valid payload gets 403 ERR_FORBIDDEN and nothing is created."
        test_recipe:
          setup: ["Cycle exists; one student exists"]
          setup_api_calls:
            - call: "POST /exam-cycles"
              payload: { name: "CYCLE-2027", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 100000000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cy: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu A", grade_level: 11, subgroup_code: "GEN" }
              as: ApCoordinator
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_CALC_BC", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: Student
              as_user_id: "${s1}"
              captures: { err: $.data.error_id }
            - call: "GET /courses?cycle_id=${cy}"
              as: ApCoordinator
          assert:
            - "HTTP 403 and error_id == ERR_FORBIDDEN"
            - "GET /courses?cycle_id=${cy} returns an empty array (nothing created)"

      - name: teacher_cannot_approve_fee_application_returns_forbidden
        claim_type: rbac_exclusive_denial
        grounds: [roles.ApCoordinator, "endpoints:POST /fee-reduction-applications/{id}/approve", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Approval is exclusive to ApCoordinator; the Teacher role is denied 403 even for a pending application."
        test_recipe:
          setup: ["Cycle OPEN; student with a SUBMITTED application; a teacher exists"]
          setup_api_calls:
            - call: "POST /exam-cycles"
              payload: { name: "CYCLE-2027", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 100000000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cy: $.data.id }
            - call: "POST /exam-cycles/${cy}/open"
              as: ApCoordinator
            - call: "POST /students"
              payload: { full_name: "Stu A", grade_level: 11, subgroup_code: "FRL" }
              as: ApCoordinator
              captures: { s1: $.data.id }
            - call: "POST /fee-reduction-applications"
              payload: { student_id: "${s1}", cycle_id: "${cy}", eligibility_basis: "FREE_LUNCH", annual_income_cents: 2500000 }
              as: Student
              as_user_id: "${s1}"
              captures: { fra: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "T One", email: "t1@x.edu" }
              as: ApCoordinator
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /fee-reduction-applications/${fra}/approve"
              as: Teacher
              as_user_id: "${t1}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 and error_id == ERR_FORBIDDEN; application remains SUBMITTED"

      - name: registrar_cannot_submit_order_returns_forbidden
        claim_type: rbac_exclusive_denial
        grounds: [roles.ApCoordinator, roles.Registrar, "endpoints:POST /exam-orders/{id}/submit", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Order workflow is coordinator-exclusive; Registrar (who may READ orders) is denied 403 on submit."
        test_recipe:
          setup: ["Cycle OPEN; one registration; DRAFT order exists"]
          setup_api_calls:
            - call: "POST /exam-cycles"
              payload: { name: "CYCLE-2027", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 100000000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cy: $.data.id }
            - call: "POST /exam-cycles/${cy}/open"
              as: ApCoordinator
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_CALC_BC", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { co: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu A", grade_level: 11, subgroup_code: "GEN" }
              as: ApCoordinator
              captures: { s1: $.data.id }
            - call: "POST /registrations"
              payload: { student_id: "${s1}", course_id: "${co}" }
              as: Student
              as_user_id: "${s1}"
            - call: "POST /exam-orders"
              payload: { cycle_id: "${cy}" }
              as: ApCoordinator
              captures: { ord: $.data.id }
          trigger:
            - call: "POST /exam-orders/${ord}/submit"
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 and error_id == ERR_FORBIDDEN; ExamOrder.${ord}.status remains DRAFT"

      - name: student_cannot_register_for_another_student
        claim_type: rbac_ownership_denial
        grounds: [roles.Student, "validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Entity-backed ownership: a Student caller whose X-User-ID is student A may not create a registration naming student B in the payload (403)."
        test_recipe:
          setup: ["Cycle OPEN; course; students A and B"]
          setup_api_calls:
            - call: "POST /exam-cycles"
              payload: { name: "CYCLE-2027", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 100000000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cy: $.data.id }
            - call: "POST /exam-cycles/${cy}/open"
              as: ApCoordinator
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_CALC_BC", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { co: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu A", grade_level: 11, subgroup_code: "GEN" }
              as: ApCoordinator
              captures: { sA: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu B", grade_level: 11, subgroup_code: "GEN" }
              as: ApCoordinator
              captures: { sB: $.data.id }
          trigger:
            - call: "POST /registrations"
              payload: { student_id: "${sB}", course_id: "${co}" }
              as: Student
              as_user_id: "${sA}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 and error_id == ERR_FORBIDDEN (caller ${sA} != payload student_id ${sB})"

      - name: teacher_cannot_complete_training_for_another_teacher
        claim_type: rbac_ownership_denial
        grounds: [roles.Teacher, "validations[priority=2]", state_machines.TeacherAuthorization.PENDING_TRAINING_to_AUTHORIZED, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Entity-backed ownership on training attestation: teacher t2 calling complete-training on t1's record is denied 403; the record stays PENDING_TRAINING."
