  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: room_half_open_adjacency_vs_capacity
        grounds:
          - validations[priority=22]
          - validations[priority=29]
          - calculations.turn_window_requirement
        distinguishing_aspect: |
          Resource Room, half-open datetime semantics: intervals that merely touch
          (checkin_at == prior checkout_at) do NOT collide on occupancy, but the
          0-hour gap violates the 24h STANDARD turn rule (ERR_TURN_WINDOW_TOO_SHORT);
          a truly intersecting interval on a full room (bed_count 1 already occupied)
          is rejected ERR_ROOM_CAPACITY_EXCEEDED; a 28-hour gap books cleanly.
        test_recipe:
          setup:
            - "Building B TURN_ACTIVE, room R1 (1 bed); group GA with assignment in R1: 2026-06-15T15:00:00Z -> 2026-06-19T11:00:00Z (STANDARD)"
            - "Group GB (STANDARD, contracted 1, deposit 5000) with 1 participant"
