# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — task_1126_operating_room_block_scheduling
# §1.9 Corner Design: breadth coverage of every §1.1–§1.7 claim not already
# covered by §1.8. Sections follow references/claim-extraction-guide.md.
# Default logical clock: 2026-05-01T00:00:00Z (Friday). All dates UTC.
# =============================================================================

scaffold_corner_design:

  # ============================================================ 1. Entities
  - section: entities
    instances:
      - name: service_line_default_release_deadline_and_computed_block_deadline
        claim_type: defaults
        grounds:
          - entities.ServiceLine.fields.release_deadline_hours
          - calculations.release_deadline_at
        distinguishing_aspect: "Omitting release_deadline_hours applies default 72; a block on 2026-05-04 starting 420 gets release_deadline_at 2026-05-01T07:00:00Z (07:00 on May 4 minus 72h)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "ORTHO", target_utilization_pct: 80 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
          trigger:
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 720 }, as: SchedulingAdmin, captures: { b: $.data.id, rda: $.data.release_deadline_at } }
          assert:
            - "ServiceLine.${sl}.release_deadline_hours == 72 (default applied)"
            - "BlockAllocation.${b}.release_deadline_at == 2026-05-01T07:00:00Z"
            - "BlockAllocation.${b}.original_minutes == 300 and .status == DRAFT and .version == 1"

      - name: surgeon_missing_required_service_line_id_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Surgeon.fields.service_line_id
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /surgeons without required service_line_id fails with ERR_INVALID_REQUEST (400) before any existence check on other fields."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /surgeons", payload: { full_name: "Dr. NoLine" }, as: SchedulingAdmin, captures: { err: $.data.error_id } }
          assert:
            - "trigger fails with error_id == ERR_INVALID_REQUEST and http 400"

      - name: get_block_with_nonexistent_id_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_BLOCK_NOT_FOUND]
        distinguishing_aspect: "GET on a well-formed but absent block UUID returns ERR_BLOCK_NOT_FOUND (404) with the error envelope."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /blocks/11111111-2222-3333-4444-555555555555", as: Any, captures: { err: $.data.error_id } }
          assert:
            - "trigger fails with error_id == ERR_BLOCK_NOT_FOUND and http 404"

      - name: create_room_with_injected_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.OperatingRoom
        distinguishing_aspect: "Client-supplied id/version/created_at are ignored: the response carries a server-minted UUID (different from the injected value) and version 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /operating-rooms", payload: { room_name: "OR9", id: "99999999-8888-7777-6666-555555555555", version: 42, created_at: "2020-01-01T00:00:00.000Z" }, as: SchedulingAdmin, captures: { rid: $.data.id, rv: $.data.version } }
          assert:
            - "response .id != 99999999-8888-7777-6666-555555555555 (server-minted)"
            - "response .version == 1"
            - "response .created_at != 2020-01-01T00:00:00.000Z"

      - name: case_posting_computed_duration_injected_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.CasePosting.fields.predicted_duration_minutes
          - entities.CasePosting.fields.benchmark_duration_minutes
        distinguishing_aspect: "POST /cases with an injected predicted_duration_minutes: 1 stores the server-computed value 90 (STANDARD, bias 1.000), not the injected 1."
        test_recipe:
          setup: ["line and surgeon exist"]
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "GS", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. G" }, as: SchedulingAdmin, captures: { sg: $.data.id } }
          trigger:
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE", predicted_duration_minutes: 1, benchmark_duration_minutes: 1 }, as: Surgeon, as_user_id: "${sg}", captures: { c: $.data.id, pred: $.data.predicted_duration_minutes, bench: $.data.benchmark_duration_minutes } }
          assert:
            - "response .predicted_duration_minutes == 90 (injected 1 ignored)"
            - "response .benchmark_duration_minutes == 90"
            - "response .status == POSTED (initial state)"

      - name: committee_vote_immutability_via_recast_replacement
        claim_type: immutability
        grounds:
          - entities.CommitteeVote
        distinguishing_aspect: "CommitteeVote is append-only (common_fields false): no update endpoint exists; a member changing their mind re-casts, replacing the row."
        test_recipe: { setup: ["covered by difficulty instance"], setup_api_calls: [], trigger: [], assert: [] }
        excluded_because:
          difficulty_instance: vote_tally_conserved_through_recast_and_reopen
          rationale: "That instance exercises re-cast replacement (row count stays 2) and reopen deletion — the full immutability surface."

      - name: list_pagination_limit_offset_has_more
        claim_type: listing
        grounds:
          - response_envelope
          - endpoints[GET /operating-rooms]
        distinguishing_aspect: "With 3 rooms: limit=2&offset=0 returns 2 rows, total_count 3, has_more true; limit=2&offset=2 returns 1 row, has_more false."
        test_recipe:
          setup: ["three operating rooms R1, R2, R3"]
          setup_api_calls:
            - { call: "POST /operating-rooms", payload: { room_name: "R1" }, as: SchedulingAdmin }
            - { call: "POST /operating-rooms", payload: { room_name: "R2" }, as: SchedulingAdmin }
            - { call: "POST /operating-rooms", payload: { room_name: "R3" }, as: SchedulingAdmin }
          trigger:
            - { call: "GET /operating-rooms?limit=2&offset=0", as: Any }
            - { call: "GET /operating-rooms?limit=2&offset=2", as: Any }
          assert:
            - "page 1: 2 rows, total_count == 3, has_more == true"
            - "page 2: 1 row, total_count == 3, has_more == false"

      - name: post_case_with_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.CasePosting.fields.procedure_class
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "procedure_class 'MEGA' is not in {MINOR, STANDARD, COMPLEX} => ERR_INVALID_REQUEST (400); nothing persisted."
        test_recipe:
          setup: ["line and surgeon exist"]
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "GS", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. G" }, as: SchedulingAdmin, captures: { sg: $.data.id } }
          trigger:
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "MEGA", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { err: $.data.error_id } }
          assert:
            - "trigger fails with error_id == ERR_INVALID_REQUEST"
            - "GET /cases?surgeon_id=${sg} returns total_count == 0"

      - name: create_block_inverted_range_rejected
        claim_type: type_constraints
        grounds:
          - entities.BlockAllocation.fields.end_minute
          - errors[ERR_INVALID_TIME_RANGE]
        distinguishing_aspect: "end_minute == start_minute (empty interval) and end_minute < start_minute both fail with ERR_INVALID_TIME_RANGE (400)."
        test_recipe:
          setup: ["line and room exist"]
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "GS", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
          trigger:
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 600, end_minute: 600 }, as: SchedulingAdmin, captures: { err1: $.data.error_id } }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 700, end_minute: 600 }, as: SchedulingAdmin, captures: { err2: $.data.error_id } }
          assert:
            - "both triggers fail with error_id == ERR_INVALID_TIME_RANGE"
            - "GET /blocks?or_id=${or1} returns total_count == 0"

      - name: block_list_status_filter_returns_only_matching
        claim_type: listing
        grounds:
          - endpoints[GET /blocks]
        distinguishing_aspect: "GET /blocks?status=ACTIVE excludes the DRAFT block and returns exactly the ACTIVE one (filter semantics, not just pagination)."
        test_recipe:
          setup: ["line, room, block B1 DRAFT, block B2 ACTIVE (different dates)"]
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "GS", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 720 }, as: SchedulingAdmin, captures: { b1: $.data.id } }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-05", start_minute: 420, end_minute: 720 }, as: SchedulingAdmin, captures: { b2: $.data.id } }
            - { call: "POST /blocks/${b2}/activate", as: SchedulingAdmin }
          trigger:
            - { call: "GET /blocks?status=ACTIVE&or_id=${or1}", as: Any }
          assert:
            - "response total_count == 1 and the single row is ${b2} with status ACTIVE"
            - "GET /blocks?status=DRAFT&or_id=${or1} returns exactly ${b1}"

  # ============================================================ 2. State Machines
  - section: state_machines
    instances:
      - name: new_block_starts_in_draft
        claim_type: initial_state
        grounds:
          - state_machines.BlockAllocation
        distinguishing_aspect: "A freshly created block has status DRAFT and version 1; cases cannot be scheduled into it until activated."
        test_recipe:
          setup: ["line and room exist"]
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "GS", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
          trigger:
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 720 }, as: SchedulingAdmin, captures: { b: $.data.id, st: $.data.status } }
          assert:
            - "response .status == DRAFT"

      - name: activate_already_active_block_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.BlockAllocation.DRAFT_to_ACTIVE
          - errors[ERR_BLOCK_NOT_DRAFT]
        distinguishing_aspect: "Second activate on an ACTIVE block fails with ERR_BLOCK_NOT_DRAFT (idempotency-through-state: no double activation)."
        test_recipe:
          setup: ["ACTIVE block B1"]
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "GS", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 720 }, as: SchedulingAdmin, captures: { b1: $.data.id } }
            - { call: "POST /blocks/${b1}/activate", as: SchedulingAdmin }
          trigger:
            - { call: "POST /blocks/${b1}/activate", as: SchedulingAdmin, captures: { err: $.data.error_id } }
          assert:
            - "trigger fails with error_id == ERR_BLOCK_NOT_DRAFT"

      - name: cancel_released_block_rejected_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.BlockAllocation
          - errors[ERR_BLOCK_NOT_ACTIVE]
        distinguishing_aspect: "RELEASED is terminal: cancel on a released block fails with ERR_BLOCK_NOT_ACTIVE; no transitions out of RELEASED."
        test_recipe:
          setup: ["block released (manual, empty => whole window becomes one slot)"]
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "GS", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 720 }, as: SchedulingAdmin, captures: { b1: $.data.id } }
            - { call: "POST /blocks/${b1}/activate", as: SchedulingAdmin }
            - { call: "POST /blocks/${b1}/release", as: SchedulingAdmin }
          trigger:
            - { call: "POST /blocks/${b1}/cancel", as: SchedulingAdmin, captures: { err: $.data.error_id } }
          assert:
            - "trigger fails with error_id == ERR_BLOCK_NOT_ACTIVE"
            - "BlockAllocation.${b1}.status == RELEASED (unchanged)"

      - name: complete_unstarted_case_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.CasePosting.IN_PROGRESS_to_COMPLETED
          - errors[ERR_CASE_NOT_IN_PROGRESS]
        distinguishing_aspect: "complete requires IN_PROGRESS: completing a merely SCHEDULED case fails with ERR_CASE_NOT_IN_PROGRESS."
        test_recipe:
          setup: ["SCHEDULED STANDARD case c in ACTIVE block with coverage"]
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "GS", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. G" }, as: SchedulingAdmin, captures: { sg: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /anesthesia-coverages", payload: { or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 1200, provider_ref: "AN1" }, as: AnesthesiaCoordinator }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 720 }, as: SchedulingAdmin, captures: { b1: $.data.id } }
            - { call: "POST /blocks/${b1}/activate", as: SchedulingAdmin }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c: $.data.id } }
            - { call: "POST /cases/${c}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
          trigger:
            - { call: "POST /cases/${c}/complete", payload: { actual_end_minute: 600 }, as: CirculatorNurse, captures: { err: $.data.error_id } }
          assert:
            - "trigger fails with error_id == ERR_CASE_NOT_IN_PROGRESS"
            - "CasePosting.${c}.status == SCHEDULED (unchanged)"

      - name: block_cancel_cascades_cases_to_bumped
        claim_type: side_effect_execution
        grounds:
          - state_machines.BlockAllocation.ACTIVE_to_CANCELLED
        distinguishing_aspect: "Cancelling an ACTIVE block bumps both of its SCHEDULED cases (scheduled_start_minute cleared, block_id retained); the cases are NOT cancelled themselves."
        test_recipe:
          setup: ["ACTIVE block with two SCHEDULED STANDARD cases c1 [420,510), c2 [535,625)"]
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "GS", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. G" }, as: SchedulingAdmin, captures: { sg: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /anesthesia-coverages", payload: { or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 1200, provider_ref: "AN1" }, as: AnesthesiaCoordinator }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 720 }, as: SchedulingAdmin, captures: { b1: $.data.id } }
            - { call: "POST /blocks/${b1}/activate", as: SchedulingAdmin }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c1: $.data.id } }
            - { call: "POST /cases/${c1}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c2: $.data.id } }
            - { call: "POST /cases/${c2}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
          trigger:
            - { call: "POST /blocks/${b1}/cancel", as: SchedulingAdmin }
          assert:
            - "BlockAllocation.${b1}.status == CANCELLED"
            - "CasePosting.${c1}.status == BUMPED and .scheduled_start_minute == null and .block_id == ${b1} (retained for audit)"
            - "CasePosting.${c2}.status == BUMPED and .scheduled_start_minute == null"

      - name: release_already_released_block_rejected
        claim_type: idempotency
        grounds:
          - state_machines.BlockAllocation.ACTIVE_to_RELEASED
          - errors[ERR_BLOCK_NOT_ACTIVE]
        distinguishing_aspect: "Releasing twice: the second release observes status RELEASED and fails with ERR_BLOCK_NOT_ACTIVE — no duplicate slot is created."
        test_recipe:
          setup: ["released empty block (one slot created)"]
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "GS", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 720 }, as: SchedulingAdmin, captures: { b1: $.data.id } }
            - { call: "POST /blocks/${b1}/activate", as: SchedulingAdmin }
            - { call: "POST /blocks/${b1}/release", as: SchedulingAdmin }
          trigger:
            - { call: "POST /blocks/${b1}/release", as: SchedulingAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /open-time-slots?block_id=${b1}", as: Any }
          assert:
            - "trigger fails with error_id == ERR_BLOCK_NOT_ACTIVE"
            - "GET /open-time-slots?block_id=${b1} returns total_count == 1 (no duplicate slot)"

      - name: schedule_into_draft_block_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.CasePosting.POSTED_to_SCHEDULED
          - errors[ERR_BLOCK_NOT_ACTIVE]
        distinguishing_aspect: "Guarded transition: scheduling requires the BLOCK entity in ACTIVE state; a DRAFT block rejects with ERR_BLOCK_NOT_ACTIVE even though coverage exists."
        test_recipe:
          setup: ["DRAFT block with full coverage on the room-day; POSTED case"]
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "GS", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. G" }, as: SchedulingAdmin, captures: { sg: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /anesthesia-coverages", payload: { or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 1200, provider_ref: "AN1" }, as: AnesthesiaCoordinator }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 720 }, as: SchedulingAdmin, captures: { b1: $.data.id } }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c: $.data.id } }
          trigger:
            - { call: "POST /cases/${c}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}", captures: { err: $.data.error_id } }
          assert:
            - "trigger fails with error_id == ERR_BLOCK_NOT_ACTIVE"
            - "CasePosting.${c}.status == POSTED"

      - name: review_auto_decides_at_quorum_without_close_call
        claim_type: valid_transition
        grounds:
          - state_machines.CommitteeReview.OPEN_to_DECIDED
        distinguishing_aspect: "System auto-transition: the third vote itself flips the review to DECIDED in the same response; no explicit close endpoint exists."
        test_recipe: { setup: ["covered by difficulty instance"], setup_api_calls: [], trigger: [], assert: [] }
        excluded_because:
          difficulty_instance: vote_requires_review_open_state
          rationale: "That instance's setup drives a review to DECIDED via exactly three votes and asserts status DECIDED — the auto-transition is exercised there."

      - name: withdraw_coverage_twice_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.AnesthesiaCoverage.ACTIVE_to_WITHDRAWN
          - errors[ERR_COVERAGE_NOT_ACTIVE]
        distinguishing_aspect: "Second withdraw on a WITHDRAWN coverage fails with ERR_COVERAGE_NOT_ACTIVE."
        test_recipe:
          setup: ["one WITHDRAWN coverage"]
          setup_api_calls:
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /anesthesia-coverages", payload: { or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 1200, provider_ref: "AN1" }, as: AnesthesiaCoordinator, captures: { cov: $.data.id } }
            - { call: "POST /anesthesia-coverages/${cov}/withdraw", as: AnesthesiaCoordinator }
          trigger:
            - { call: "POST /anesthesia-coverages/${cov}/withdraw", as: AnesthesiaCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "trigger fails with error_id == ERR_COVERAGE_NOT_ACTIVE"

      - name: withdraw_reallocation_request_twice_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.ReallocationRequest.PENDING_to_WITHDRAWN
          - errors[ERR_REQUEST_NOT_PENDING]
        distinguishing_aspect: "Second withdraw on a WITHDRAWN request fails with ERR_REQUEST_NOT_PENDING."
        test_recipe:
          setup: ["released empty block => OPEN slot; surgeon with POSTED MINOR case; request withdrawn once"]
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "GS", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. G" }, as: SchedulingAdmin, captures: { sg: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 720 }, as: SchedulingAdmin, captures: { b1: $.data.id } }
            - { call: "POST /blocks/${b1}/activate", as: SchedulingAdmin }
            - { call: "POST /blocks/${b1}/release", as: SchedulingAdmin }
            - { call: "GET /open-time-slots?block_id=${b1}", as: Any, captures: { s1: "$.data[0].id" } }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "MINOR", priority: "ADD_ON" }, as: Surgeon, as_user_id: "${sg}", captures: { x: $.data.id } }
            - { call: "POST /reallocation-requests", payload: { slot_id: "${s1}", case_id: "${x}" }, as: Surgeon, as_user_id: "${sg}", captures: { rq: $.data.id } }
            - { call: "POST /reallocation-requests/${rq}/withdraw", as: Surgeon, as_user_id: "${sg}" }
          trigger:
            - { call: "POST /reallocation-requests/${rq}/withdraw", as: Surgeon, as_user_id: "${sg}", captures: { err: $.data.error_id } }
          assert:
            - "trigger fails with error_id == ERR_REQUEST_NOT_PENDING"

      - name: start_posted_case_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.CasePosting.SCHEDULED_to_IN_PROGRESS
          - errors[ERR_CASE_NOT_SCHEDULED]
        distinguishing_aspect: "start requires SCHEDULED: starting a POSTED (never scheduled) case fails with ERR_CASE_NOT_SCHEDULED."
        test_recipe:
          setup: ["POSTED case, never scheduled"]
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "GS", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. G" }, as: SchedulingAdmin, captures: { sg: $.data.id } }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c: $.data.id } }
          trigger:
            - { call: "POST /cases/${c}/start", payload: { actual_start_minute: 420 }, as: CirculatorNurse, captures: { err: $.data.error_id } }
          assert:
            - "trigger fails with error_id == ERR_CASE_NOT_SCHEDULED"
            - "CasePosting.${c}.status == POSTED"

  # ============================================================ 3. Calculations
  - section: calculations
    instances:
      - name: hybrid_room_turnover_adds_ten_minutes
        claim_type: constants_applied
        grounds:
          - calculations.turnover_minutes
          - calculations.block_packing_fit
        distinguishing_aspect: "Same MINOR cases in a hybrid room: the inter-case gap is 15 + 10 = 25 minutes, so the second case starts at 550 instead of the non-hybrid 540 — the HYBRID_BONUS constant is applied per gap."
        test_recipe:
          setup: ["line, surgeon, HYBRID room with coverage, ACTIVE block [480,960) on 2026-05-04"]
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "GS", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. H" }, as: SchedulingAdmin, captures: { sg: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR-HYB", is_hybrid: true }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /anesthesia-coverages", payload: { or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 1200, provider_ref: "AN1" }, as: AnesthesiaCoordinator }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 480, end_minute: 960 }, as: SchedulingAdmin, captures: { b1: $.data.id } }
            - { call: "POST /blocks/${b1}/activate", as: SchedulingAdmin }
          trigger:
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "MINOR", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c1: $.data.id } }
            - { call: "POST /cases/${c1}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "MINOR", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c2: $.data.id } }
            - { call: "POST /cases/${c2}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
          assert:
            - "CasePosting.${c1}.scheduled_start_minute == 480 and .scheduled_end_minute == 525"
            - "CasePosting.${c2}.turnover_minutes == 25 (15 base + 10 hybrid)"
            - "CasePosting.${c2}.scheduled_start_minute == 550 (525 + 25; non-hybrid would be 540)"
            - "BlockAllocation.${b1}.occupied_minutes == 115 (45 + 45 + 25)"

      - name: first_case_delay_grace_boundary_10_vs_11
        claim_type: correct_result
        grounds:
          - calculations.first_case_delay
          - calculations.surgeon_on_time_rate
        distinguishing_aspect: "GRACE_MINUTES boundary uses <=: a first case starting exactly 10 minutes late is on-time (rate 100.00); 11 minutes late is not (rate 0.00) — one minute flips the predicate."
        test_recipe:
          setup:
            - "line, surgeons Dr. P and Dr. Q, OR1 + OR2 each with coverage 2026-05-04 [420,1200)"
            - "block B1 OR1 [420,720) with Dr. P's STANDARD case at [420,510); block B2 OR2 [420,720) with Dr. Q's STANDARD case at [420,510)"
            - "each case is first of its room-day"
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "GS", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. P" }, as: SchedulingAdmin, captures: { sgp: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. Q" }, as: SchedulingAdmin, captures: { sgq: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR2" }, as: SchedulingAdmin, captures: { or2: $.data.id } }
            - { call: "POST /anesthesia-coverages", payload: { or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 1200, provider_ref: "AN1" }, as: AnesthesiaCoordinator }
            - { call: "POST /anesthesia-coverages", payload: { or_id: "${or2}", date: "2026-05-04", start_minute: 420, end_minute: 1200, provider_ref: "AN2" }, as: AnesthesiaCoordinator }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 720 }, as: SchedulingAdmin, captures: { b1: $.data.id } }
            - { call: "POST /blocks/${b1}/activate", as: SchedulingAdmin }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or2}", date: "2026-05-04", start_minute: 420, end_minute: 720 }, as: SchedulingAdmin, captures: { b2: $.data.id } }
            - { call: "POST /blocks/${b2}/activate", as: SchedulingAdmin }
            - { call: "POST /cases", payload: { surgeon_id: "${sgp}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sgp}", captures: { cp: $.data.id } }
            - { call: "POST /cases/${cp}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sgp}" }
            - { call: "POST /cases", payload: { surgeon_id: "${sgq}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sgq}", captures: { cq: $.data.id } }
            - { call: "POST /cases/${cq}/schedule", payload: { block_id: "${b2}" }, as: Surgeon, as_user_id: "${sgq}" }
          trigger:
            - { call: "POST /cases/${cp}/start", payload: { actual_start_minute: 430 }, as: CirculatorNurse }
            - { call: "POST /cases/${cq}/start", payload: { actual_start_minute: 431 }, as: CirculatorNurse }
          assert:
            - "CasePosting.${cp}.is_first_case_of_day == true and .first_case_delay_minutes == 10"
            - "CasePosting.${cq}.is_first_case_of_day == true and .first_case_delay_minutes == 11"
            - "GET /surgeons/${sgp}.on_time_rate_pct == 100.00  (delay 10 <= GRACE_MINUTES 10)"
            - "GET /surgeons/${sgq}.on_time_rate_pct == 0.00  (delay 11 > 10)"

      - name: utilization_input_set_excludes_cancelled_case
        claim_type: input_set_filtering
        grounds:
          - calculations.utilization_scoring
        distinguishing_aspect: "Only cases in {SCHEDULED, IN_PROGRESS, COMPLETED} count: after cancelling one of three STANDARD cases the occupied prime minutes drop to 180 and the report reads exactly 30.00, not 45.00."
        test_recipe:
          setup:
            - "line (target 75), surgeon, OR1 coverage 2026-05-04 [420,1200), ACTIVE block [420,1020) (600 prime minutes)"
            - "three STANDARD cases scheduled at [420,510), [535,625), [650,740); the middle one then cancelled (repack moves the third to [535,625))"
            - "clock at 2026-05-08"
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "GS", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. G" }, as: SchedulingAdmin, captures: { sg: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /anesthesia-coverages", payload: { or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 1200, provider_ref: "AN1" }, as: AnesthesiaCoordinator }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 1020 }, as: SchedulingAdmin, captures: { b1: $.data.id } }
            - { call: "POST /blocks/${b1}/activate", as: SchedulingAdmin }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c1: $.data.id } }
            - { call: "POST /cases/${c1}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c2: $.data.id } }
            - { call: "POST /cases/${c2}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c3: $.data.id } }
            - { call: "POST /cases/${c3}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /cases/${c2}/cancel", as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-08T00:00:00Z" }, as: SchedulingAdmin }
          trigger:
            - { call: "POST /ops/scoring-run", as: SchedulingAdmin }
          assert:
            - "GET /service-lines/${sl}/utilization-reports [0].occupied_prime_minutes == 180 (cancelled case excluded)"
            - "GET /service-lines/${sl}/utilization-reports [0].prime_time_utilization_pct == 30.00 (180/600)"
            - "BlockAllocation.${b1}.occupied_minutes == 205 after repack (90 + 90 + 25)"

      - name: bias_default_below_five_completed_cases
        claim_type: correct_result
        grounds:
          - calculations.surgeon_duration_bias
        distinguishing_aspect: "MIN_HISTORY boundary from below: with only 4 completed cases (each at ratio 2.0), duration_bias_factor stays the default 1.000 and the next STANDARD prediction equals the benchmark 90."
        test_recipe:
          setup:
            - "line, surgeon, OR1 coverage 2026-05-04 [420,1440), ACTIVE block [420,1080)"
            - "four STANDARD cases completed, each with actual duration 180 (ratio 2.0); packed starts 420, 535, 650, 765"
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "GS", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. G" }, as: SchedulingAdmin, captures: { sg: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /anesthesia-coverages", payload: { or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 1440, provider_ref: "AN1" }, as: AnesthesiaCoordinator }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 1080 }, as: SchedulingAdmin, captures: { b1: $.data.id } }
            - { call: "POST /blocks/${b1}/activate", as: SchedulingAdmin }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c1: $.data.id } }
            - { call: "POST /cases/${c1}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /cases/${c1}/start", payload: { actual_start_minute: 420 }, as: CirculatorNurse }
            - { call: "POST /cases/${c1}/complete", payload: { actual_end_minute: 600 }, as: CirculatorNurse }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c2: $.data.id } }
            - { call: "POST /cases/${c2}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /cases/${c2}/start", payload: { actual_start_minute: 535 }, as: CirculatorNurse }
            - { call: "POST /cases/${c2}/complete", payload: { actual_end_minute: 715 }, as: CirculatorNurse }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c3: $.data.id } }
            - { call: "POST /cases/${c3}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /cases/${c3}/start", payload: { actual_start_minute: 650 }, as: CirculatorNurse }
            - { call: "POST /cases/${c3}/complete", payload: { actual_end_minute: 830 }, as: CirculatorNurse }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c4: $.data.id } }
            - { call: "POST /cases/${c4}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /cases/${c4}/start", payload: { actual_start_minute: 765 }, as: CirculatorNurse }
            - { call: "POST /cases/${c4}/complete", payload: { actual_end_minute: 945 }, as: CirculatorNurse }
          trigger:
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c5: $.data.id, pred: $.data.predicted_duration_minutes } }
          assert:
            - "GET /surgeons/${sg}.completed_cases_count == 4"
            - "GET /surgeons/${sg}.duration_bias_factor == 1.0 (default; 4 < MIN_HISTORY 5)"
            - "CasePosting.${c5}.predicted_duration_minutes == 90 == benchmark_duration_minutes (ratio history ignored)"

      - name: bias_clamped_at_upper_bound_1250
        claim_type: correct_result
        grounds:
          - calculations.surgeon_duration_bias
          - calculations.predicted_duration
        distinguishing_aspect: "Clamp boundary: five completions at ratio 2.0 give mean 2.0 which clamps to 1.250; the next STANDARD prediction is round_half_up(90 x 1.25) = round_half_up(112.5) = 113, not 180."
        test_recipe:
          setup:
            - "line, surgeon, OR1 coverage 2026-05-04 [420,1440), ACTIVE block [420,1080)"
            - "five STANDARD cases completed, each actual duration 180; packed starts 420, 535, 650, 765, 880"
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "GS", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. G" }, as: SchedulingAdmin, captures: { sg: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /anesthesia-coverages", payload: { or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 1440, provider_ref: "AN1" }, as: AnesthesiaCoordinator }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 1080 }, as: SchedulingAdmin, captures: { b1: $.data.id } }
            - { call: "POST /blocks/${b1}/activate", as: SchedulingAdmin }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c1: $.data.id } }
            - { call: "POST /cases/${c1}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /cases/${c1}/start", payload: { actual_start_minute: 420 }, as: CirculatorNurse }
            - { call: "POST /cases/${c1}/complete", payload: { actual_end_minute: 600 }, as: CirculatorNurse }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c2: $.data.id } }
            - { call: "POST /cases/${c2}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /cases/${c2}/start", payload: { actual_start_minute: 535 }, as: CirculatorNurse }
            - { call: "POST /cases/${c2}/complete", payload: { actual_end_minute: 715 }, as: CirculatorNurse }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c3: $.data.id } }
            - { call: "POST /cases/${c3}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /cases/${c3}/start", payload: { actual_start_minute: 650 }, as: CirculatorNurse }
            - { call: "POST /cases/${c3}/complete", payload: { actual_end_minute: 830 }, as: CirculatorNurse }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c4: $.data.id } }
            - { call: "POST /cases/${c4}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /cases/${c4}/start", payload: { actual_start_minute: 765 }, as: CirculatorNurse }
            - { call: "POST /cases/${c4}/complete", payload: { actual_end_minute: 945 }, as: CirculatorNurse }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c5: $.data.id } }
            - { call: "POST /cases/${c5}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /cases/${c5}/start", payload: { actual_start_minute: 880 }, as: CirculatorNurse }
            - { call: "POST /cases/${c5}/complete", payload: { actual_end_minute: 1060 }, as: CirculatorNurse }
          trigger:
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c6: $.data.id, pred: $.data.predicted_duration_minutes } }
          assert:
            - "GET /surgeons/${sg}.duration_bias_factor == 1.25 (mean 2.0 clamped to CLAMP_HI)"
            - "CasePosting.${c6}.predicted_duration_minutes == 113 (round_half_up(90 * 1.25))"

      - name: block_fit_exact_boundary
        claim_type: precision
        grounds:
          - calculations.block_packing_fit
          - errors[ERR_CASE_DOES_NOT_FIT]
        distinguishing_aspect: "The fit check end <= block.end allows an exactly-fitting case; the failure side of the boundary is already exercised by a difficulty instance."
        test_recipe: { setup: ["covered by difficulty instance"], setup_api_calls: [], trigger: [], assert: [] }
        excluded_because:
          difficulty_instance: per_case_rounding_governs_block_fit_boundary
          rationale: "That instance pins the <= boundary with a one-minute overflow (529 > 528) and the per-case rounding order; the success side (exact fit) is a trivially satisfied relaxation also present in every scheduling setup chain."

  # ============================================================ 4. Validations
  - section: validations
    instances:
      - name: missing_auth_headers_returns_400
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: "A request without X-User-ID / X-User-Role headers fails priority 1 with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) — before role or existence checks."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /blocks", captures: { err: $.data.error_id } }
          assert:
            - "trigger fails with error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER and http 400"

      - name: surgeon_cannot_create_service_line
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "Role check beats payload/existence: a Surgeon POSTing a service line with a perfectly valid body still gets ERR_INSUFFICIENT_PERMISSIONS (403)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /service-lines", payload: { name: "HACK", target_utilization_pct: 75 }, as: Surgeon, as_user_id: "11111111-2222-3333-4444-555555555555", captures: { err: $.data.error_id } }
          assert:
            - "trigger fails with error_id == ERR_INSUFFICIENT_PERMISSIONS and http 403"
            - "GET /service-lines returns total_count == 0"

      - name: surgeon_cannot_cancel_another_surgeons_case
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: "Entity-backed ownership: Dr. B cancelling Dr. A's POSTED case fails with ERR_NOT_RESOURCE_OWNER (403) because case.surgeon_id != X-User-ID."
        test_recipe:
          setup: ["line; Dr. A with a POSTED case; Dr. B"]
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "GS", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. A" }, as: SchedulingAdmin, captures: { sga: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. B" }, as: SchedulingAdmin, captures: { sgb: $.data.id } }
            - { call: "POST /cases", payload: { surgeon_id: "${sga}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sga}", captures: { c: $.data.id } }
          trigger:
            - { call: "POST /cases/${c}/cancel", as: Surgeon, as_user_id: "${sgb}", captures: { err: $.data.error_id } }
          assert:
            - "trigger fails with error_id == ERR_NOT_RESOURCE_OWNER and http 403"
            - "CasePosting.${c}.status == POSTED (unchanged)"

      - name: schedule_elective_without_block_returns_invalid_request
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Wrong payload combination: an ELECTIVE schedule carrying neither block_id nor the emergent triple (or_id+date+desired_start_minute) fails ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["line, surgeon, POSTED ELECTIVE case"]
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "GS", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. G" }, as: SchedulingAdmin, captures: { sg: $.data.id } }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c: $.data.id } }
          trigger:
            - { call: "POST /cases/${c}/schedule", payload: {}, as: Surgeon, as_user_id: "${sg}", captures: { err: $.data.error_id } }
          assert:
            - "trigger fails with error_id == ERR_INVALID_REQUEST"

      - name: priority_conflict_state_vs_business_constraint
        claim_type: priority_ordering
        grounds:
          - validations[priority=7]
          - validations[priority=9]
        distinguishing_aspect: "Dual-failure ordering state > business_constraint."
        test_recipe: { setup: ["covered by difficulty instance"], setup_api_calls: [], trigger: [], assert: [] }
        excluded_because:
          difficulty_instance: state_error_beats_fit_error_on_schedule
          rationale: "Exactly this priority pair is exercised there with literal error assertions."

      - name: priority_conflict_safety_vs_referential
        claim_type: priority_ordering
        grounds:
          - validations[priority=8]
          - validations[priority=10]
        distinguishing_aspect: "Dual-failure ordering business_safety > business_referential."
        test_recipe: { setup: ["covered by difficulty instance"], setup_api_calls: [], trigger: [], assert: [] }
        excluded_because:
          difficulty_instance: anesthesia_error_beats_block_ownership_mismatch
          rationale: "Exactly this priority pair is exercised there with literal error assertions."

      - name: partial_span_coverage_rejection
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
        distinguishing_aspect: "Coverage containing only part of the case occupation window still fails."
        test_recipe: { setup: ["covered by difficulty instance"], setup_api_calls: [], trigger: [], assert: [] }
        excluded_because:
          difficulty_instance: schedule_requires_active_full_span_anesthesia_coverage
          rationale: "Its second trigger is precisely the partial-span rejection (coverage [450,700) vs occupation [420,535))."

  # ============================================================ 5. Endpoints
  - section: endpoints
    instances:
      - name: response_envelope_shape_success_and_error
        claim_type: standard_crud
        grounds:
          - response_envelope
        distinguishing_aspect: "Success body carries meta.api_request_id, meta.api_request_timestamp, response_type 'object', data; error body carries response_type 'error' and data.error_id/data.message."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { rid: $.data.id } }
            - { call: "GET /blocks/11111111-2222-3333-4444-555555555555", as: Any, captures: { err: $.data.error_id } }
          assert:
            - "success: meta.api_request_id present, meta.api_request_timestamp present, response_type == object, data.room_name == OR1"
            - "error: response_type == error, data.error_id == ERR_BLOCK_NOT_FOUND, data.message present"

      - name: scoring_run_dedups_open_review_but_appends_reports
        claim_type: conditional_action
        grounds:
          - calculations.utilization_scoring
          - endpoints[POST /ops/scoring-run]
        distinguishing_aspect: "Second scoring-run on an unchanged clock still appends a UtilizationReport but does NOT create a duplicate review because one is already OPEN (dedup rule) — reports_created 1, reviews_created 0."
        test_recipe:
          setup:
            - "line (target 75); block OR1 2026-05-04 [420,1020) with one STANDARD case => prime 15.00 < 75; clock 2026-05-08"
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "GS", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. G" }, as: SchedulingAdmin, captures: { sg: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /anesthesia-coverages", payload: { or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 1200, provider_ref: "AN1" }, as: AnesthesiaCoordinator }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 1020 }, as: SchedulingAdmin, captures: { b1: $.data.id } }
            - { call: "POST /blocks/${b1}/activate", as: SchedulingAdmin }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c1: $.data.id } }
            - { call: "POST /cases/${c1}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-08T00:00:00Z" }, as: SchedulingAdmin }
          trigger:
            - { call: "POST /ops/scoring-run", as: SchedulingAdmin, captures: { r1: $.data.reports_created, v1: $.data.reviews_created } }
            - { call: "POST /ops/scoring-run", as: SchedulingAdmin, captures: { r2: $.data.reports_created, v2: $.data.reviews_created } }
          assert:
            - "first run: reports_created == 1 and reviews_created == 1"
            - "second run: reports_created == 1 and reviews_created == 0 (OPEN review dedup)"
            - "GET /service-lines/${sl}/utilization-reports returns total_count == 2 (reports are append-only)"
            - "GET /committee-reviews?service_line_id=${sl} returns total_count == 1"

      - name: completed_case_increments_surgeon_counter
        claim_type: computed_read
        grounds:
          - entities.Surgeon.fields.completed_cases_count
          - endpoints[GET /surgeons/{surgeonId}]
        distinguishing_aspect: "Computed read: after one full lifecycle (post -> schedule -> start -> complete) GET /surgeons/{id} shows completed_cases_count == 1."
        test_recipe:
          setup: ["line, surgeon, coverage, ACTIVE block with the case scheduled at [420,510)"]
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "GS", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. G" }, as: SchedulingAdmin, captures: { sg: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /anesthesia-coverages", payload: { or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 1200, provider_ref: "AN1" }, as: AnesthesiaCoordinator }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 720 }, as: SchedulingAdmin, captures: { b1: $.data.id } }
            - { call: "POST /blocks/${b1}/activate", as: SchedulingAdmin }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c: $.data.id } }
            - { call: "POST /cases/${c}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
          trigger:
            - { call: "POST /cases/${c}/start", payload: { actual_start_minute: 420 }, as: CirculatorNurse }
            - { call: "POST /cases/${c}/complete", payload: { actual_end_minute: 510 }, as: CirculatorNurse }
          assert:
            - "GET /surgeons/${sg}.completed_cases_count == 1"
            - "CasePosting.${c}.status == COMPLETED (terminal)"
            - "CasePosting.${c}.first_case_delay_minutes == 0 (first case, on time)"

  # ============================================================ 6. Errors
  - section: errors
    instances:
      - name: not_found_errors_on_reads
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CASE_NOT_FOUND]
          - errors[ERR_SLOT_NOT_FOUND]
        distinguishing_aspect: "Read-side existence: absent case and slot ids return their resource-specific 404 codes, not a generic 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /cases/11111111-2222-3333-4444-555555555555", as: Any, captures: { e1: $.data.error_id } }
            - { call: "GET /open-time-slots/11111111-2222-3333-4444-555555555555", as: Any, captures: { e2: $.data.error_id } }
          assert:
            - "GET case -> error_id == ERR_CASE_NOT_FOUND (404)"
            - "GET slot -> error_id == ERR_SLOT_NOT_FOUND (404)"

      - name: not_found_errors_on_writes
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SERVICE_LINE_NOT_FOUND]
          - errors[ERR_ROOM_NOT_FOUND]
          - errors[ERR_SURGEON_NOT_FOUND]
          - errors[ERR_COVERAGE_NOT_FOUND]
          - errors[ERR_REQUEST_NOT_FOUND]
          - errors[ERR_REVIEW_NOT_FOUND]
        distinguishing_aspect: "Write-side existence on body FKs and path ids: each absent reference maps to its own error code (validated after auth/ownership, before state)."
        test_recipe:
          setup: ["one service line (its version captured for the OCC payload field on the votes call)"]
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "GS", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id, slv: $.data.version } }
          trigger:
            - { call: "POST /surgeons", payload: { service_line_id: "11111111-2222-3333-4444-555555555555", full_name: "Dr. X" }, as: SchedulingAdmin, captures: { e1: $.data.error_id } }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "11111111-2222-3333-4444-555555555555", date: "2026-05-04", start_minute: 420, end_minute: 720 }, as: SchedulingAdmin, captures: { e2: $.data.error_id } }
            - { call: "POST /cases", payload: { surgeon_id: "22222222-3333-4444-5555-666666666666", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "22222222-3333-4444-5555-666666666666", captures: { e3: $.data.error_id } }
            - { call: "POST /anesthesia-coverages/33333333-4444-5555-6666-777777777777/withdraw", as: AnesthesiaCoordinator, captures: { e4: $.data.error_id } }
            - { call: "POST /reallocation-requests/44444444-5555-6666-7777-888888888888/withdraw", as: Surgeon, as_user_id: "22222222-3333-4444-5555-666666666666", captures: { e5: $.data.error_id } }
            - { call: "POST /committee-reviews/55555555-6666-7777-8888-999999999999/votes", payload: { vote: "REDUCE", expected_review_version: "${slv}" }, as: CommitteeMember, as_user_id: "cm_1", captures: { e6: $.data.error_id } }
          assert:
            - "e1 == ERR_SERVICE_LINE_NOT_FOUND"
            - "e2 == ERR_ROOM_NOT_FOUND"
            - "e3 == ERR_SURGEON_NOT_FOUND (ownership passes because surgeon_id == X-User-ID; existence fails)"
            - "e4 == ERR_COVERAGE_NOT_FOUND"
            - "e5 == ERR_REQUEST_NOT_FOUND"
            - "e6 == ERR_REVIEW_NOT_FOUND (existence precedes the OCC version check)"

      - name: emergent_window_blocked_is_atomic_no_partial_bump
        claim_type: violation_to_error
        grounds:
          - errors[ERR_EMERGENT_WINDOW_BLOCKED]
          - state_machines.CasePosting.POSTED_to_SCHEDULED
        distinguishing_aspect: "An emergent STANDARD case needing [500,615) overlaps two ELECTIVE cases (padded [420,535) and [535,660)): a single bump cannot free the window, so the request fails with ERR_EMERGENT_WINDOW_BLOCKED and NEITHER elective case is bumped — rejection is atomic."
        test_recipe:
          setup:
            - "line, Dr. E (two ELECTIVE STANDARD cases e1 [420,510), e2 [535,625) in ACTIVE block [420,720)), Dr. X with EMERGENT STANDARD case em, OR1 coverage [420,1200)"
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "GS", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. E" }, as: SchedulingAdmin, captures: { sge: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. X" }, as: SchedulingAdmin, captures: { sgx: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /anesthesia-coverages", payload: { or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 1200, provider_ref: "AN1" }, as: AnesthesiaCoordinator }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 720 }, as: SchedulingAdmin, captures: { b1: $.data.id } }
            - { call: "POST /blocks/${b1}/activate", as: SchedulingAdmin }
            - { call: "POST /cases", payload: { surgeon_id: "${sge}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sge}", captures: { e1: $.data.id } }
            - { call: "POST /cases/${e1}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sge}" }
            - { call: "POST /cases", payload: { surgeon_id: "${sge}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sge}", captures: { e2: $.data.id } }
            - { call: "POST /cases/${e2}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sge}" }
            - { call: "POST /cases", payload: { surgeon_id: "${sgx}", procedure_class: "STANDARD", priority: "EMERGENT" }, as: Surgeon, as_user_id: "${sgx}", captures: { em: $.data.id } }
          trigger:
            - { call: "POST /cases/${em}/schedule", payload: { or_id: "${or1}", date: "2026-05-04", desired_start_minute: 500 }, as: Surgeon, as_user_id: "${sgx}", captures: { err: $.data.error_id } }
          assert:
            - "trigger fails with error_id == ERR_EMERGENT_WINDOW_BLOCKED (two overlaps, one bump insufficient)"
            - "CasePosting.${e1}.status == SCHEDULED and .scheduled_start_minute == 420 (no partial bump)"
            - "CasePosting.${e2}.status == SCHEDULED and .scheduled_start_minute == 535"
            - "CasePosting.${em}.status == POSTED (unchanged)"
            - "BlockAllocation.${b1}.occupied_minutes == 205 (unchanged)"

  # ============================================================ 7. RBAC
  - section: rbac
    instances:
      - name: committee_member_cannot_create_block
        claim_type: role_denial
        grounds:
          - roles[CommitteeMember]
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "Role denial fires at priority 2 — before existence — so even a payload full of dangling FKs yields ERR_INSUFFICIENT_PERMISSIONS, never a 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /blocks", payload: { service_line_id: "11111111-2222-3333-4444-555555555555", or_id: "11111111-2222-3333-4444-555555555555", date: "2026-05-04", start_minute: 420, end_minute: 720 }, as: CommitteeMember, as_user_id: "cm_1", captures: { err: $.data.error_id } }
          assert:
            - "trigger fails with error_id == ERR_INSUFFICIENT_PERMISSIONS (403), not a not-found error"

      - name: governance_segregation_of_duties
        claim_type: segregation_of_duties
        grounds:
          - roles[SchedulingAdmin]
          - roles[CommitteeMember]
          - roles[BlockCommitteeChair]
        distinguishing_aspect: "Three-way segregation: the admin who allocates blocks cannot vote; the chair who facilitates cannot vote; the member who votes cannot reopen. All three denials are 403 at priority 2 (role check precedes existence, so placeholder review ids suffice)."
        test_recipe:
          setup: ["one service line (version captured to satisfy the OCC payload field syntactically)"]
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "GS", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id, slv: $.data.version } }
          trigger:
            - { call: "POST /committee-reviews/55555555-6666-7777-8888-999999999999/votes", payload: { vote: "REDUCE", expected_review_version: "${slv}" }, as: SchedulingAdmin, captures: { e1: $.data.error_id } }
            - { call: "POST /committee-reviews/55555555-6666-7777-8888-999999999999/votes", payload: { vote: "REDUCE", expected_review_version: "${slv}" }, as: BlockCommitteeChair, captures: { e2: $.data.error_id } }
            - { call: "POST /committee-reviews/55555555-6666-7777-8888-999999999999/reopen", as: CommitteeMember, as_user_id: "cm_1", captures: { e3: $.data.error_id } }
          assert:
            - "SchedulingAdmin voting -> ERR_INSUFFICIENT_PERMISSIONS"
            - "BlockCommitteeChair voting -> ERR_INSUFFICIENT_PERMISSIONS (chair facilitates, never votes)"
            - "CommitteeMember reopening -> ERR_INSUFFICIENT_PERMISSIONS"

      - name: surgeon_release_ownership_rules
        claim_type: role_denial
        grounds:
          - roles[Surgeon]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - state_machines.BlockAllocation.ACTIVE_to_RELEASED
        distinguishing_aspect: "A Surgeon may early-release only blocks where surgeon_id == X-User-ID: own block releases (200, whole window becomes open time); another surgeon's block and a shared (surgeon_id null) block both fail ERR_NOT_RESOURCE_OWNER."
        test_recipe:
          setup:
            - "line, Dr. A, Dr. B, OR1; block OWN 2026-05-04 [420,720) surgeon_id=Dr.A; block OTHER 2026-05-05 [420,720) surgeon_id=Dr.B; block SHARED 2026-05-06 [420,720) surgeon_id null; all ACTIVE"
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "GS", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. A" }, as: SchedulingAdmin, captures: { sga: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. B" }, as: SchedulingAdmin, captures: { sgb: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 720, surgeon_id: "${sga}" }, as: SchedulingAdmin, captures: { bown: $.data.id } }
            - { call: "POST /blocks/${bown}/activate", as: SchedulingAdmin }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-05", start_minute: 420, end_minute: 720, surgeon_id: "${sgb}" }, as: SchedulingAdmin, captures: { both: $.data.id } }
            - { call: "POST /blocks/${both}/activate", as: SchedulingAdmin }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-06", start_minute: 420, end_minute: 720 }, as: SchedulingAdmin, captures: { bsh: $.data.id } }
            - { call: "POST /blocks/${bsh}/activate", as: SchedulingAdmin }
          trigger:
            - { call: "POST /blocks/${bown}/release", as: Surgeon, as_user_id: "${sga}", captures: { st: $.data.status } }
            - { call: "POST /blocks/${both}/release", as: Surgeon, as_user_id: "${sga}", captures: { e1: $.data.error_id } }
            - { call: "POST /blocks/${bsh}/release", as: Surgeon, as_user_id: "${sga}", captures: { e2: $.data.error_id } }
          assert:
            - "own block release succeeds: status == RELEASED"
            - "other surgeon's block: error_id == ERR_NOT_RESOURCE_OWNER, BlockAllocation.${both}.status == ACTIVE"
            - "shared block (surgeon_id null): error_id == ERR_NOT_RESOURCE_OWNER, BlockAllocation.${bsh}.status == ACTIVE"

      - name: case_lifecycle_role_boundaries
        claim_type: role_denial
        grounds:
          - roles[CirculatorNurse]
          - roles[Surgeon]
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "CirculatorNurse cannot post cases and a Surgeon cannot record start times — the posting role and the time-recording role are disjoint (403 each)."
        test_recipe:
          setup: ["line, surgeon, POSTED case"]
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "GS", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. G" }, as: SchedulingAdmin, captures: { sg: $.data.id } }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c: $.data.id } }
          trigger:
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "MINOR", priority: "ELECTIVE" }, as: CirculatorNurse, captures: { e1: $.data.error_id } }
            - { call: "POST /cases/${c}/start", payload: { actual_start_minute: 420 }, as: Surgeon, as_user_id: "${sg}", captures: { e2: $.data.error_id } }
          assert:
            - "CirculatorNurse POST /cases -> ERR_INSUFFICIENT_PERMISSIONS"
            - "Surgeon POST /cases/{id}/start -> ERR_INSUFFICIENT_PERMISSIONS (role check precedes ownership/state)"
            - "CasePosting.${c}.status == POSTED (unchanged)"

  # ============================================================ 8. Complexity Layers
  - section: cross_cutting_complexity_layers
    instances:
      - name: patch_service_line_with_stale_version_returns_412
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[service-line-config-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC on ServiceLine.version: a PATCH carrying the pre-update version (captured before a successful PATCH bumped it to 2) is rejected 412 ERR_STALE_VERSION; the correct version succeeds and increments version again."
        test_recipe:
          setup: ["service line at version 1"]
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "GS", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id, v0: $.data.version } }
          trigger:
            - { call: "PATCH /service-lines/${sl}", payload: { target_utilization_pct: 80, expected_service_line_version: "${v0}" }, as: SchedulingAdmin, captures: { v1: $.data.version } }
            - { call: "PATCH /service-lines/${sl}", payload: { target_utilization_pct: 85, expected_service_line_version: "${v0}" }, as: SchedulingAdmin, captures: { err: $.data.error_id } }
            - { call: "PATCH /service-lines/${sl}", payload: { target_utilization_pct: 85, expected_service_line_version: "${v1}" }, as: SchedulingAdmin, captures: { v2: $.data.version } }
          assert:
            - "first PATCH succeeds: version 1 -> 2, target_utilization_pct == 80"
            - "second PATCH (stale version 1) fails: http 412, error_id == ERR_STALE_VERSION, target stays 80"
            - "third PATCH (correct version 2) succeeds: target_utilization_pct == 85, version == 3"

      - name: vote_with_stale_review_version_returns_412
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[review-vote-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC on CommitteeReview.version: a member voting with the version observed before another member's vote landed is rejected 412 ERR_STALE_VERSION, and the rejected vote does not change any tally."
        test_recipe:
          setup: ["deficient line (1 STANDARD case in a 600-prime-minute block) scored at clock 2026-05-08 => OPEN review at version 1"]
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "GS", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. G" }, as: SchedulingAdmin, captures: { sg: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /anesthesia-coverages", payload: { or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 1200, provider_ref: "AN1" }, as: AnesthesiaCoordinator }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 1020 }, as: SchedulingAdmin, captures: { b1: $.data.id } }
            - { call: "POST /blocks/${b1}/activate", as: SchedulingAdmin }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c1: $.data.id } }
            - { call: "POST /cases/${c1}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-08T00:00:00Z" }, as: SchedulingAdmin }
            - { call: "POST /ops/scoring-run", as: SchedulingAdmin }
            - { call: "GET /committee-reviews?service_line_id=${sl}&status=OPEN", as: Any, captures: { rev: "$.data[0].id", rv0: "$.data[0].version" } }
          trigger:
            - { call: "POST /committee-reviews/${rev}/votes", payload: { vote: "MAINTAIN", expected_review_version: "${rv0}" }, as: CommitteeMember, as_user_id: "cm_1", captures: { rv1: $.data.version } }
            - { call: "POST /committee-reviews/${rev}/votes", payload: { vote: "REDUCE", expected_review_version: "${rv0}" }, as: CommitteeMember, as_user_id: "cm_2", captures: { err: $.data.error_id } }
          assert:
            - "cm_1 vote succeeds (version 1 -> 2)"
            - "cm_2 vote with stale version fails: http 412, error_id == ERR_STALE_VERSION"
            - "CommitteeReview.${rev}: tally_maintain == 1, tally_reduce == 0 (rejected vote recorded nothing), status == OPEN"

      - name: release_sweep_respects_release_deadline_checkpoint
        claim_type: ops_run_checkpoint
        grounds:
          - endpoints[POST /ops/release-sweep]
          - calculations.release_deadline_at
        distinguishing_aspect: "The ops-run only acts on blocks whose release_deadline_at <= clock: with clock 2026-05-01T00:00:00Z the 2026-05-01 block (deadline 2026-04-28T08:00Z) releases while the 2026-05-10 block (deadline 2026-05-07T08:00Z) stays ACTIVE — epoch-gated, not wall-clock."
        test_recipe:
          setup:
            - "line; OR1; B1 2026-05-01 [480,1020) ACTIVE (deadline 2026-04-28T08:00:00Z, already past); B2 2026-05-10 [480,1020) ACTIVE (deadline 2026-05-07T08:00:00Z, future); clock explicitly at 2026-05-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "GS", target_utilization_pct: 75, release_deadline_hours: 72 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-01", start_minute: 480, end_minute: 1020 }, as: SchedulingAdmin, captures: { b1: $.data.id } }
            - { call: "POST /blocks/${b1}/activate", as: SchedulingAdmin }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-10", start_minute: 480, end_minute: 1020 }, as: SchedulingAdmin, captures: { b2: $.data.id } }
            - { call: "POST /blocks/${b2}/activate", as: SchedulingAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SchedulingAdmin }
          trigger:
            - { call: "POST /ops/release-sweep", as: SchedulingAdmin, captures: { rel: $.data.released_blocks, sc: $.data.slots_created } }
          assert:
            - "trigger response .released_blocks == 1 and .slots_created == 1"
            - "BlockAllocation.${b1}.status == RELEASED; its slot has original_minutes == 540 (empty block releases its whole window)"
            - "BlockAllocation.${b2}.status == ACTIVE (deadline not yet reached)"

      - name: derived_fields_reconciled_on_cancel
        claim_type: derived_field_reconciliation
        grounds:
          - entities.BlockAllocation.fields.occupied_minutes
        distinguishing_aspect: "Successor starts and block occupancy recompute on cancellation."
        test_recipe: { setup: ["covered by difficulty instance"], setup_api_calls: [], trigger: [], assert: [] }
        excluded_because:
          difficulty_instance: case_cancel_repack_firstcase_cascade
          rationale: "Asserts repacked starts (420 / 535), occupied_minutes == 205, and the rederived first-case flag — the full reconciliation surface."

      - name: selector_tiebreak_created_at_and_empty_pool_fallback
        claim_type: selector_policy
        grounds:
          - calculations.reallocation_selector
        distinguishing_aspect: "Two PENDING requests tie on every ranking key (same line, no reports) so created_at ASC decides: the earlier request wins the slot; the loser stays PENDING (not REJECTED); a second slot with an empty pool stays OPEN (empty-pool fallback)."
        test_recipe:
          setup:
            - "line, Dr. S (donor cases), Dr. Q (requester); OR1 + OR2 with coverage 2026-05-04 [420,1200)"
            - "B1 OR1 [420,600) with STANDARD case [420,510) released => slot S1 [510,600) of 90; B2 OR2 [600,780) with STANDARD case [600,690) released => slot S2 [690,780) of 90"
            - "Dr. Q's MINOR cases x1, x2 (needed 60 each); r1 on S1 created before r2 on S1"
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "GS", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. S" }, as: SchedulingAdmin, captures: { sgs: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. Q" }, as: SchedulingAdmin, captures: { sgq: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR2" }, as: SchedulingAdmin, captures: { or2: $.data.id } }
            - { call: "POST /anesthesia-coverages", payload: { or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 1200, provider_ref: "AN1" }, as: AnesthesiaCoordinator }
            - { call: "POST /anesthesia-coverages", payload: { or_id: "${or2}", date: "2026-05-04", start_minute: 420, end_minute: 1200, provider_ref: "AN2" }, as: AnesthesiaCoordinator }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 600 }, as: SchedulingAdmin, captures: { b1: $.data.id } }
            - { call: "POST /blocks/${b1}/activate", as: SchedulingAdmin }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or2}", date: "2026-05-04", start_minute: 600, end_minute: 780 }, as: SchedulingAdmin, captures: { b2: $.data.id } }
            - { call: "POST /blocks/${b2}/activate", as: SchedulingAdmin }
            - { call: "POST /cases", payload: { surgeon_id: "${sgs}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sgs}", captures: { d1: $.data.id } }
            - { call: "POST /cases/${d1}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sgs}" }
            - { call: "POST /cases", payload: { surgeon_id: "${sgs}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sgs}", captures: { d2: $.data.id } }
            - { call: "POST /cases/${d2}/schedule", payload: { block_id: "${b2}" }, as: Surgeon, as_user_id: "${sgs}" }
            - { call: "POST /blocks/${b1}/release", as: SchedulingAdmin }
            - { call: "POST /blocks/${b2}/release", as: SchedulingAdmin }
            - { call: "GET /open-time-slots?block_id=${b1}", as: Any, captures: { s1: "$.data[0].id" } }
            - { call: "GET /open-time-slots?block_id=${b2}", as: Any, captures: { s2: "$.data[0].id" } }
            - { call: "POST /cases", payload: { surgeon_id: "${sgq}", procedure_class: "MINOR", priority: "ADD_ON" }, as: Surgeon, as_user_id: "${sgq}", captures: { x1: $.data.id } }
            - { call: "POST /cases", payload: { surgeon_id: "${sgq}", procedure_class: "MINOR", priority: "ADD_ON" }, as: Surgeon, as_user_id: "${sgq}", captures: { x2: $.data.id } }
            - { call: "POST /reallocation-requests", payload: { slot_id: "${s1}", case_id: "${x1}" }, as: Surgeon, as_user_id: "${sgq}", captures: { r1: $.data.id } }
            - { call: "POST /reallocation-requests", payload: { slot_id: "${s1}", case_id: "${x2}" }, as: Surgeon, as_user_id: "${sgq}", captures: { r2: $.data.id } }
          trigger:
            - { call: "POST /ops/release-sweep", as: SchedulingAdmin, captures: { approved: $.data.requests_approved } }
          assert:
            - "trigger response .requests_approved == 1 (one award per slot per run)"
            - "ReallocationRequest.${r1}.status == APPROVED (created_at ASC tie-break)"
            - "ReallocationRequest.${r2}.status == PENDING (loser not rejected; 60 needed > 30 remaining)"
            - "OpenTimeSlot.${s1}.remaining_minutes == 30 and .status == OPEN"
            - "OpenTimeSlot.${s2}.status == OPEN and .remaining_minutes == 90 (empty pool fallback: slot untouched)"
            - "CasePosting.${x1}.scheduled_start_minute == 510; CasePosting.${x2}.status == POSTED"

  # ============================================================ 9. Consistency Model
  - section: consistency_model
    instances:
      - name: release_side_effects_immediately_visible
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "Immediate consistency: the release response itself carries status RELEASED and reserved_minutes 0, and the very next GET already sees the created slot — no asynchronous lag, no read-your-writes violation."
        test_recipe:
          setup: ["ACTIVE empty block [420,720)"]
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "GS", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 720 }, as: SchedulingAdmin, captures: { b1: $.data.id } }
            - { call: "POST /blocks/${b1}/activate", as: SchedulingAdmin }
          trigger:
            - { call: "POST /blocks/${b1}/release", as: SchedulingAdmin, captures: { st: $.data.status, res: $.data.reserved_minutes } }
            - { call: "GET /open-time-slots?block_id=${b1}", as: Any, captures: { s1: "$.data[0].id" } }
          assert:
            - "release response: status == RELEASED and reserved_minutes == 0 (empty block)"
            - "immediate GET: exactly one slot, original_minutes == 300, remaining_minutes == 300, status == OPEN"
