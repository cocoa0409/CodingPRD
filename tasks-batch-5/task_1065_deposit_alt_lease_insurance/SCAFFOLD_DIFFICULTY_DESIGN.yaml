scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: policy_available_coverage_gross_vs_net_diverge_on_pending_payout
        grounds:
          - calculations.policy_available_coverage
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          On the same Policy at the same instant, gross_available_coverage_cents (reserves every
          APPROVED/CLOSED claim regardless of payout status) and net_available_coverage_cents
          (only deducts DISBURSED payouts) diverge by exactly the approved-but-not-yet-disbursed
          Claim's approved_amount_cents (95000), because Policy/Claim-domain exposure accounting is
          forward-looking (gross) vs chronological (net) for identical underlying data.
        test_recipe:
          setup:
            - "A Landlord, Renter, ACTIVE Property (CA), and CA StateComplianceRule exist."
            - "A RenterEnrollment auto-approves (risk_score 7, LOW tier) with requested_coverage_limit_cents=500000, creating a Policy with coverage_limit_cents=500000, monthly_fee_cents=4150, gross/net_available_coverage_cents=500000."
            - "The Policy's first invoice is paid, so Policy.status=ACTIVE."
            - "A Claim with total_claimed_amount_cents=100000 is filed and APPROVED (deductible_cents=5000, approved_amount_cents=95000), creating a PENDING Payout — but the Payout has not yet been disbursed."
          setup_api_calls:
            - call: "POST /landlords"
              payload: { full_name: "Ada Landlord", email: "ada.landlord@example.com", phone_number: "555-0100" }
              as: Anonymous
              captures: { landlord_id: "$.data.id" }
            - call: "POST /renters"
              payload: { full_name: "Rex Renter", email: "rex.renter@example.com", phone_number: "555-0200" }
              as: Anonymous
              captures: { renter_id: "$.data.id" }
            - call: "POST /properties"
              payload: { landlord_id: "${landlord_id}", address_line1: "1 Main St", city: "Los Angeles", state_code: "CA", monthly_rent_cents: 200000, property_type: "SINGLE_FAMILY" }
              as: Landlord
              as_user_id: "${landlord_id}"
              captures: { property_id: "$.data.id" }
            - call: "POST /state-compliance-rules"
              payload: { state_code: "CA", enrollment_allowed: true, max_monthly_fee_pct_of_rent: 0.10, cooling_off_buffer_days: 30, mandatory_alternative_offering: true }
              as: ComplianceOfficer
            - call: "POST /properties/${property_id}/program-status"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
            - call: "POST /renter-enrollments"
              payload: { property_id: "${property_id}", renter_id: "${renter_id}", payment_plan: "MONTHLY", requested_coverage_limit_cents: 500000, self_reported_annual_income_cents: 7200000, credit_proxy_score: 750, prior_eviction_count: 0, lease_start_date: "2026-07-01T00:00:00Z", lease_end_date: "2027-07-01T00:00:00Z" }
              as: Renter
              as_user_id: "${renter_id}"
              captures: { enrollment_id: "$.data.id" }
            - call: "POST /renter-enrollments/${enrollment_id}/submit-underwriting"
              payload: {}
              as: Renter
              as_user_id: "${renter_id}"
            - call: "GET /renter-enrollments/${enrollment_id}/policy"
              payload: {}
              as: Renter
              as_user_id: "${renter_id}"
              captures: { policy_id: "$.data[0].id" }
            - call: "GET /policies/${policy_id}/invoices"
              payload: {}
              as: Renter
              as_user_id: "${renter_id}"
              captures: { invoice1_id: "$.data[0].id" }
            - call: "POST /invoices/${invoice1_id}/pay"
              payload: {}
              as: Renter
              as_user_id: "${renter_id}"
            - call: "POST /policies/${policy_id}/claims"
              payload: { policy_id: "${policy_id}", claim_type: "PROPERTY_DAMAGE", line_items: [{ description: "Broken window", amount_cents: 100000 }] }
              as: Landlord
              as_user_id: "${landlord_id}"
              captures: { claim1_id: "$.data.id" }
            - call: "POST /claims/${claim1_id}/decide"
              payload: { action: "APPROVE" }
              as: ClaimsAdjuster
              as_user_id: "adjuster-001"
          trigger:
            - call: "GET /policies/${policy_id}"
              payload: {}
              as: Renter
              as_user_id: "${renter_id}"
          assert:
            - "Policy.${policy_id}.gross_available_coverage_cents == 405000"
            - "Policy.${policy_id}.net_available_coverage_cents == 500000"
            - "Policy.${policy_id}.gross_available_coverage_cents != Policy.${policy_id}.net_available_coverage_cents"

      - name: underwriting_risk_score_self_reported_vs_verified_diverge_tier
        grounds:
          - calculations.underwriting_risk_score
          - entities.RenterEnrollment.fields.risk_score_verified
        distinguishing_aspect: |
          For the identical application (same credit_proxy_score=750, prior_eviction_count=0), the
          self_reported variant (annual income 7200000, ratio 3.0) scores risk_score_self_reported=7
          (LOW tier), while the verified variant (annual income 4800000, ratio 2.0) scores
          risk_score_verified=21 (MEDIUM tier) — a different RenterEnrollment-domain risk_score and
          risk_tier for the same credit/eviction inputs, diverging solely on which income figure is
          authoritative.
        test_recipe:
          setup:
            - "A Landlord, Renter, ACTIVE Property (CA, monthly_rent_cents=200000), and CA StateComplianceRule exist."
            - "A RenterEnrollment is created with self_reported_annual_income_cents=7200000, verified_annual_income_cents=4800000, employment_verified=true, credit_proxy_score=750, prior_eviction_count=0."
          setup_api_calls:
            - call: "POST /landlords"
              payload: { full_name: "Ida Owner", email: "ida.owner@example.com", phone_number: "555-0101" }
              as: Anonymous
              captures: { landlord_id: "$.data.id" }
            - call: "POST /renters"
              payload: { full_name: "Val Verified", email: "val.verified@example.com", phone_number: "555-0201" }
              as: Anonymous
              captures: { renter_id: "$.data.id" }
            - call: "POST /properties"
              payload: { landlord_id: "${landlord_id}", address_line1: "2 Oak Ave", city: "San Diego", state_code: "CA", monthly_rent_cents: 200000, property_type: "CONDO" }
              as: Landlord
              as_user_id: "${landlord_id}"
              captures: { property_id: "$.data.id" }
            - call: "POST /state-compliance-rules"
              payload: { state_code: "CA", enrollment_allowed: true, max_monthly_fee_pct_of_rent: 0.10, cooling_off_buffer_days: 30, mandatory_alternative_offering: true }
              as: ComplianceOfficer
            - call: "POST /properties/${property_id}/program-status"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
            - call: "POST /renter-enrollments"
              payload: { property_id: "${property_id}", renter_id: "${renter_id}", payment_plan: "MONTHLY", requested_coverage_limit_cents: 300000, self_reported_annual_income_cents: 7200000, verified_annual_income_cents: 4800000, employment_verified: true, credit_proxy_score: 750, prior_eviction_count: 0, lease_start_date: "2026-07-01T00:00:00Z", lease_end_date: "2027-07-01T00:00:00Z" }
              as: Renter
              as_user_id: "${renter_id}"
              captures: { enrollment_id: "$.data.id" }
          trigger:
            - call: "POST /renter-enrollments/${enrollment_id}/submit-underwriting"
              payload: {}
              as: Renter
              as_user_id: "${renter_id}"
          assert:
            - "RenterEnrollment.${enrollment_id}.risk_score_self_reported == 7"
            - "RenterEnrollment.${enrollment_id}.risk_score_verified == 21"
            - "RenterEnrollment.${enrollment_id}.risk_tier == MEDIUM"
            - "RenterEnrollment.${enrollment_id}.status == APPROVED"

  - rule_id: combinatorial_formula
    instances:
      - name: monthly_fee_high_tier_risk_multiplier_nonlinear
        grounds:
          - calculations.monthly_fee_calculation
          - entities.RenterEnrollment.fields.risk_tier
        distinguishing_aspect: |
          monthly_fee_calculation mode (a): the HIGH risk_tier (multiplier 1.6) applied to
          coverage_limit_cents=300000 and BASE_RATE_PCT=0.008 nonlinearly changes the fee versus a
          LOW-tier applicant with the same coverage_limit_cents — pre_clamp_cents=3990, distinct
          from the 2550 a LOW-tier applicant at the same coverage_limit_cents would produce,
          demonstrating the >=3-input, tier-branching formula rather than a flat percentage.
        test_recipe:
          setup:
            - "A Landlord, Renter, ACTIVE Property (CA, monthly_rent_cents=200000), and CA StateComplianceRule (max_monthly_fee_pct_of_rent=0.10) exist."
            - "A RenterEnrollment with requested_coverage_limit_cents=300000, self_reported_annual_income_cents=1200000, credit_proxy_score=320, prior_eviction_count=2 scores risk_score_self_reported=88 (HIGH tier) and routes to MANUAL_REVIEW."
            - "UnderwritingAgent approves it."
          setup_api_calls:
            - call: "POST /landlords"
              payload: { full_name: "Hank Highrisk Owner", email: "hank.owner@example.com", phone_number: "555-0102" }
              as: Anonymous
              captures: { landlord_id: "$.data.id" }
            - call: "POST /renters"
              payload: { full_name: "Hugo Highrisk", email: "hugo.highrisk@example.com", phone_number: "555-0202" }
              as: Anonymous
              captures: { renter_id: "$.data.id" }
            - call: "POST /properties"
              payload: { landlord_id: "${landlord_id}", address_line1: "3 Elm St", city: "Fresno", state_code: "CA", monthly_rent_cents: 200000, property_type: "SINGLE_FAMILY" }
              as: Landlord
              as_user_id: "${landlord_id}"
              captures: { property_id: "$.data.id" }
            - call: "POST /state-compliance-rules"
              payload: { state_code: "CA", enrollment_allowed: true, max_monthly_fee_pct_of_rent: 0.10, cooling_off_buffer_days: 30, mandatory_alternative_offering: true }
              as: ComplianceOfficer
            - call: "POST /properties/${property_id}/program-status"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
            - call: "POST /renter-enrollments"
              payload: { property_id: "${property_id}", renter_id: "${renter_id}", payment_plan: "MONTHLY", requested_coverage_limit_cents: 300000, self_reported_annual_income_cents: 1200000, credit_proxy_score: 320, prior_eviction_count: 2, lease_start_date: "2026-07-01T00:00:00Z", lease_end_date: "2027-07-01T00:00:00Z" }
              as: Renter
              as_user_id: "${renter_id}"
              captures: { enrollment_id: "$.data.id" }
            - call: "POST /renter-enrollments/${enrollment_id}/submit-underwriting"
              payload: {}
              as: Renter
              as_user_id: "${renter_id}"
            - call: "POST /renter-enrollments/${enrollment_id}/decide"
              payload: { action: "APPROVE" }
              as: UnderwritingAgent
          trigger:
            - call: "GET /renter-enrollments/${enrollment_id}/policy"
              payload: {}
              as: Renter
              as_user_id: "${renter_id}"
              captures: { policy_id: "$.data[0].id" }
          assert:
            - "RenterEnrollment.${enrollment_id}.risk_score_self_reported == 88"
            - "RenterEnrollment.${enrollment_id}.risk_tier == HIGH"
            - "Policy.${policy_id}.monthly_fee_cents == 3990"

      - name: claim_payout_tiered_deductible_pinned_evaluation_order
        grounds:
          - calculations.claim_payout_calculation
          - entities.Claim.fields.deductible_cents
        distinguishing_aspect: |
          claim_payout_calculation mode (c): the deductible tier is decided FROM the step-1
          provisional_payout_cents (295000, flat-deductible basis), not from the final
          approved_amount_cents — pinning this evaluation order resolves the circular-looking
          dependency between approved_amount_cents and deductible_cents. Because
          provisional_payout_cents (295000) >= HIGH_TIER_THRESHOLD_CENTS (200000), deductible_cents
          becomes 7500 (5000 * 1.5), yielding approved_amount_cents=292500.
        test_recipe:
          setup:
            - "A Landlord, Renter, ACTIVE Property (CA, monthly_rent_cents=200000), and CA StateComplianceRule exist."
            - "A RenterEnrollment auto-approves (risk_score 7, LOW tier) with requested_coverage_limit_cents=1000000, creating a Policy with coverage_limit_cents=1000000, gross_available_coverage_cents=1000000."
            - "The Policy's first invoice is paid, so Policy.status=ACTIVE."
            - "A Claim with total_claimed_amount_cents=300000 (one line item) is filed."
          setup_api_calls:
            - call: "POST /landlords"
              payload: { full_name: "Tina Tiered Owner", email: "tina.owner@example.com", phone_number: "555-0103" }
              as: Anonymous
              captures: { landlord_id: "$.data.id" }
            - call: "POST /renters"
              payload: { full_name: "Theo Tiered", email: "theo.tiered@example.com", phone_number: "555-0203" }
              as: Anonymous
              captures: { renter_id: "$.data.id" }
            - call: "POST /properties"
              payload: { landlord_id: "${landlord_id}", address_line1: "4 Pine St", city: "Sacramento", state_code: "CA", monthly_rent_cents: 200000, property_type: "SINGLE_FAMILY" }
              as: Landlord
              as_user_id: "${landlord_id}"
              captures: { property_id: "$.data.id" }
            - call: "POST /state-compliance-rules"
              payload: { state_code: "CA", enrollment_allowed: true, max_monthly_fee_pct_of_rent: 0.10, cooling_off_buffer_days: 30, mandatory_alternative_offering: true }
              as: ComplianceOfficer
            - call: "POST /properties/${property_id}/program-status"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
            - call: "POST /renter-enrollments"
              payload: { property_id: "${property_id}", renter_id: "${renter_id}", payment_plan: "MONTHLY", requested_coverage_limit_cents: 1000000, self_reported_annual_income_cents: 7200000, credit_proxy_score: 750, prior_eviction_count: 0, lease_start_date: "2026-07-01T00:00:00Z", lease_end_date: "2027-07-01T00:00:00Z" }
              as: Renter
              as_user_id: "${renter_id}"
              captures: { enrollment_id: "$.data.id" }
            - call: "POST /renter-enrollments/${enrollment_id}/submit-underwriting"
              payload: {}
              as: Renter
              as_user_id: "${renter_id}"
            - call: "GET /renter-enrollments/${enrollment_id}/policy"
              payload: {}
              as: Renter
              as_user_id: "${renter_id}"
              captures: { policy_id: "$.data[0].id" }
            - call: "GET /policies/${policy_id}/invoices"
              payload: {}
              as: Renter
              as_user_id: "${renter_id}"
              captures: { invoice1_id: "$.data[0].id" }
            - call: "POST /invoices/${invoice1_id}/pay"
              payload: {}
              as: Renter
              as_user_id: "${renter_id}"
            - call: "POST /policies/${policy_id}/claims"
              payload: { policy_id: "${policy_id}", claim_type: "PROPERTY_DAMAGE", line_items: [{ description: "Fire damage to kitchen", amount_cents: 300000 }] }
              as: Landlord
              as_user_id: "${landlord_id}"
              captures: { claim1_id: "$.data.id" }
          trigger:
            - call: "POST /claims/${claim1_id}/decide"
              payload: { action: "APPROVE" }
              as: ClaimsAdjuster
              as_user_id: "adjuster-001"
          assert:
            - "Claim.${claim1_id}.deductible_cents == 7500"
            - "Claim.${claim1_id}.approved_amount_cents == 292500"

  - rule_id: non_linear_state_machine
    instances:
      - name: claim_needs_info_revision_loop_returns_to_under_review
        grounds:
          - state_machines.Claim.UNDER_REVIEW_to_NEEDS_INFO
          - state_machines.Claim.NEEDS_INFO_to_UNDER_REVIEW
        distinguishing_aspect: |
          Claim exhibits a cyclic shape: UNDER_REVIEW -> NEEDS_INFO -> UNDER_REVIEW is a legal
          revision loop (not a forward-only pipeline) — the claim returns to its earlier state
          with total_claimed_amount_cents updated by the landlord's supplemental line item.
        test_recipe:
          setup:
            - "A Landlord, Renter, ACTIVE Property (CA), CA StateComplianceRule, an ACTIVE Policy, and a filed UNDER_REVIEW Claim (total_claimed_amount_cents=50000) exist."
            - "ClaimsAdjuster requests more info, moving the Claim to NEEDS_INFO."
          setup_api_calls:
            - call: "POST /landlords"
              payload: { full_name: "Cara Cycle Owner", email: "cara.owner@example.com", phone_number: "555-0104" }
              as: Anonymous
              captures: { landlord_id: "$.data.id" }
            - call: "POST /renters"
              payload: { full_name: "Cody Cycle", email: "cody.cycle@example.com", phone_number: "555-0204" }
              as: Anonymous
              captures: { renter_id: "$.data.id" }
            - call: "POST /properties"
