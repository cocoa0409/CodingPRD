# =============================================================================
# Fishing Charter & Guide Booking — seed tables (Expert difficulty)
# §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml, §1.9 in
# SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Fishing Charter & Guide Booking: trip type (inshore/offshore/half-day) & boat
  capacity, captain/mate assignment, license/permit & catch reporting, deposit &
  weather reschedule, gear/bait & add-on, group split-charter, dock/marina slot,
  gratuity。

domain_name: fishing-charter-booking
api_prefix: /
# Flat topology: every entity is a top-level collection (/marinas, /boats,
# /charters, /bookings, ...), so there is no single nesting prefix; "/" is the
# common root all resource paths share.

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities (Marina, Boat, Captain, Mate, Charter, Booking, CatchReport,
  # AddOnLine, CrewAssignment, ...) linked by foreign keys; URLs are flat
  # collections with FK fields in the body, not deep nesting.

  state_machine_shape: cyclic
  # Charter has a weather-reschedule loop (SCHEDULED→WEATHER_HOLD→SCHEDULED) and
  # a branching booking lifecycle; multiple non-linear machines on distinct
  # entities (Charter, Booking, CrewAssignment).

  relationship_patterns:
    - one_to_many        # Charter -> Booking, Charter -> CrewAssignment
    - many_to_many       # Captain/Mate <-> Charter via CrewAssignment
    - cross_aggregate    # Booking references Charter, AddOnLine references Booking

  role_model: peer_roles
  # DockMaster owns marina/slot lifecycle, FleetManager owns boats/crew/charters,
  # Captain reports catch & confirms sailing, Customer books/cancels/tips.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Marina
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: name, type: string, source: input, description: "Marina name" }
      - { name: timezone_offset_minutes, type: integer, source: input, default: 0, description: "Minutes offset from UTC used to interpret local slot windows" }
      - { name: slot_count, type: integer, source: input, description: "Number of physical dock slots, >= 1" }
      - { name: turnaround_buffer_minutes, type: integer, source: input, default: 30, description: "Minimum clearance enforced AFTER a slot occupation before the next may begin on the same slot (closed-adjacency buffer)" }
      - { name: status, type: enum, source: system, description: "OPEN | RESTRICTED | CLOSED; RESTRICTED/CLOSED gate new slot occupations. constraints: OPEN, RESTRICTED, CLOSED" }
      - { name: open_slot_count, type: integer, source: computed, description: "slot_count minus count of SlotReservation rows in {HELD, OCCUPIED} overlapping the current clock; recomputed on each reservation mutation" }

  - name: DockSlot
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: marina_id, type: string, source: input, description: "FK -> Marina.id; the marina that owns this slot" }
      - { name: slot_label, type: string, source: input, description: "Human label e.g. 'A1', unique within marina_id" }
      - { name: max_boat_length_ft, type: number, source: input, description: "Longest boat (ft) this slot accepts; boat.length_ft must be <= this" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DECOMMISSIONED; DECOMMISSIONED slots accept no new reservations. constraints: ACTIVE, DECOMMISSIONED" }

  - name: Boat
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: marina_id, type: string, source: input, description: "FK -> Marina.id; home marina of the boat" }
      - { name: name, type: string, source: input, description: "Boat name" }
      - { name: length_ft, type: number, source: input, description: "Boat length in feet, > 0" }
      - { name: passenger_capacity, type: integer, source: input, description: "Maximum paying passengers (excludes crew), >= 1" }
      - { name: offshore_rated, type: boolean, source: input, default: false, description: "True if the hull is certified for OFFSHORE trips" }
      - { name: status, type: enum, source: system, description: "IN_SERVICE | DRYDOCK; DRYDOCK boats cannot anchor new charters. constraints: IN_SERVICE, DRYDOCK" }

  - name: Captain
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: marina_id, type: string, source: input, description: "FK -> Marina.id; the marina the captain is rostered at" }
      - { name: full_name, type: string, source: input, description: "Captain name" }
      - { name: uscg_license_grade, type: enum, source: input, description: "OUPV | MASTER_50 | MASTER_100; OFFSHORE trips require MASTER_50 or higher. constraints: OUPV, MASTER_50, MASTER_100" }
      - { name: license_expires_on, type: datetime, source: input, description: "ISO 8601 date the USCG license lapses; charter sail date must be strictly before this" }
      - { name: offshore_permit_id, type: string, source: input, default: null, description: "FK -> Permit.id; federal offshore permit held by the captain (nullable)" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | SUSPENDED; SUSPENDED captains cannot be assigned. constraints: AVAILABLE, SUSPENDED" }

  - name: Mate
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: marina_id, type: string, source: input, description: "FK -> Marina.id; the marina the mate is rostered at" }
      - { name: full_name, type: string, source: input, description: "Mate name" }
      - { name: certified_offshore, type: boolean, source: input, default: false, description: "True if the mate may crew OFFSHORE trips" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | SUSPENDED. constraints: AVAILABLE, SUSPENDED" }

  - name: Permit
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: permit_kind, type: enum, source: input, description: "FEDERAL_OFFSHORE | STATE_INSHORE; the regulatory class. constraints: FEDERAL_OFFSHORE, STATE_INSHORE" }
      - { name: permit_number, type: string, source: input, description: "Issuing-authority permit number" }
      - { name: valid_through, type: datetime, source: input, description: "ISO 8601 date the permit lapses; charter sail date must be strictly before this" }
      - { name: daily_bag_limit, type: integer, source: input, description: "Max total fish the permit authorizes per sailing day, >= 0" }

  - name: Charter
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: marina_id, type: string, source: input, description: "FK -> Marina.id; marina hosting the charter" }
      - { name: boat_id, type: string, source: input, description: "FK -> Boat.id; the boat anchored for this charter" }
      - { name: permit_id, type: string, source: input, default: null, description: "FK -> Permit.id; permit covering catch on this charter (nullable; required for OFFSHORE)" }
      - { name: trip_type, type: enum, source: input, description: "INSHORE | OFFSHORE | HALF_DAY; drives base price, crew rules, capacity rules. constraints: INSHORE, OFFSHORE, HALF_DAY" }
      - { name: depart_at, type: datetime, source: input, description: "ISO 8601 UTC scheduled departure" }
      - { name: return_at, type: datetime, source: input, description: "ISO 8601 UTC scheduled return; must be strictly after depart_at" }
      - { name: base_seat_price_cents, type: integer, source: input, description: "Per-seat list price in cents before split/threshold adjustments, >= 0" }
      - { name: seats_total, type: integer, source: input, description: "Seats this charter sells; must be <= boat.passenger_capacity at creation" }
      - { name: seats_booked, type: integer, source: computed, description: "Sum of party_size over Bookings in {RESERVED, CONFIRMED}; never exceeds seats_total" }
      - { name: split_charter, type: boolean, source: input, default: false, description: "True if multiple independent parties share this charter (split pricing applies)" }
      - { name: catch_total, type: integer, source: computed, description: "Sum of fish_count over CatchReport rows for this charter; gates against permit.daily_bag_limit" }
      - { name: weather_reschedule_count, type: integer, source: computed, description: "Number of completed WEATHER_HOLD->SCHEDULED loops; starts 0, used by reschedule fee tier" }
      - { name: status, type: enum, source: system, description: "DRAFT | SCHEDULED | WEATHER_HOLD | SAILED | SETTLED | CANCELLED. constraints: DRAFT, SCHEDULED, WEATHER_HOLD, SAILED, SETTLED, CANCELLED" }

  - name: SlotReservation
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: dock_slot_id, type: string, source: input, description: "FK -> DockSlot.id; the slot occupied" }
      - { name: charter_id, type: string, source: input, description: "FK -> Charter.id; the charter occupying the slot" }
      - { name: window_start, type: datetime, source: computed, description: "ISO 8601 UTC = charter.depart_at at reservation time; copied so slot windows survive reschedules until re-anchored" }
      - { name: window_end, type: datetime, source: computed, description: "ISO 8601 UTC = charter.return_at at reservation time" }
      - { name: status, type: enum, source: system, description: "HELD | OCCUPIED | RELEASED; HELD/OCCUPIED block the slot, RELEASED frees it. constraints: HELD, OCCUPIED, RELEASED" }

  - name: CrewAssignment
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: charter_id, type: string, source: input, description: "FK -> Charter.id; the charter staffed" }
      - { name: captain_id, type: string, source: input, default: null, description: "FK -> Captain.id; captain on this assignment (nullable until captain seat filled)" }
      - { name: mate_id, type: string, source: input, default: null, description: "FK -> Mate.id; mate on this assignment (nullable; OFFSHORE requires one)" }
      - { name: role_slot, type: enum, source: input, description: "CAPTAIN | MATE; which seat this assignment fills. constraints: CAPTAIN, MATE" }
      - { name: status, type: enum, source: system, description: "TENTATIVE | LOCKED | RELEASED; LOCKED on sail, RELEASED on cancel/reschedule. constraints: TENTATIVE, LOCKED, RELEASED" }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: charter_id, type: string, source: input, description: "FK -> Charter.id; the charter booked" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the booking customer" }
      - { name: party_size, type: integer, source: input, description: "Seats this booking holds, >= 1; counts against charter.seats_total" }
      - { name: deposit_due_cents, type: integer, source: computed, description: "Deposit owed at reservation; DEPOSIT_PCT of seat subtotal, rounded per rule" }
      - { name: deposit_paid_cents, type: integer, source: system, default: 0, description: "Cumulative deposit recorded paid; set when deposit is captured" }
      - { name: seat_subtotal_cents, type: integer, source: computed, description: "Per-seat price (after split adjustment) times party_size; basis for deposit & balance" }
      - { name: gratuity_cents, type: integer, source: computed, default: 0, description: "Gratuity allocated to crew on settlement; 0 until SAILED->SETTLED" }
      - { name: gratuity_input_mode, type: enum, source: input, default: "PERCENT", description: "PERCENT | FLAT; how the customer expressed the tip. constraints: PERCENT, FLAT" }
      - { name: gratuity_input_value, type: integer, source: input, default: 0, description: "If PERCENT: integer percent (e.g. 18). If FLAT: cents amount. >= 0" }
      - { name: refund_cents, type: integer, source: computed, default: 0, description: "Amount returned on cancellation; depends on cancel timing & weather waiver" }
      - { name: weather_waiver, type: boolean, source: computed, default: false, description: "True if this booking was cancelled while its charter was in WEATHER_HOLD (full deposit refund)" }
      - { name: gold_reschedule_waiver_used, type: boolean, source: computed, default: false, description: "True once a GOLD customer's one-time reschedule-fee waiver has been consumed on this booking" }
      - { name: reschedule_fee_total_cents, type: integer, source: computed, default: 0, description: "Running sum of reschedule fees accrued to this booking across weather reschedules" }
      - { name: status, type: enum, source: system, description: "RESERVED | CONFIRMED | CANCELLED | SETTLED | NO_SHOW. constraints: RESERVED, CONFIRMED, CANCELLED, SETTLED, NO_SHOW" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: full_name, type: string, source: input, description: "Customer name" }
      - { name: email, type: string, source: input, description: "Contact email, unique" }
      - { name: loyalty_tier, type: enum, source: input, default: "STANDARD", description: "STANDARD | SILVER | GOLD; GOLD waives the reschedule fee once. constraints: STANDARD, SILVER, GOLD" }

  - name: AddOnLine
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; the booking this add-on attaches to" }
      - { name: addon_kind, type: enum, source: input, description: "BAIT | ROD_RENTAL | FISH_CLEANING | COOLER_ICE; priced per unit. constraints: BAIT, ROD_RENTAL, FISH_CLEANING, COOLER_ICE" }
      - { name: quantity, type: integer, source: input, description: "Units ordered, >= 1" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Per-unit price resolved from the add-on rate card by addon_kind" }
      - { name: line_total_cents, type: integer, source: computed, description: "unit_price_cents * quantity, with bulk discount per rule" }
      - { name: status, type: enum, source: system, description: "PENDING | FULFILLED | VOIDED. constraints: PENDING, FULFILLED, VOIDED" }

  - name: CatchReport
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: charter_id, type: string, source: input, description: "FK -> Charter.id; the sailing this catch was logged on" }
      - { name: species, type: string, source: input, description: "Species name" }
      - { name: fish_count, type: integer, source: input, description: "Number of fish landed in this report, >= 1" }
      - { name: released_count, type: integer, source: input, default: 0, description: "Subset of fish_count released, 0 <= released_count <= fish_count; counts toward bag limit are kept fish only" }
      - { name: reported_at, type: datetime, source: system, description: "ISO 8601 UTC server timestamp the report was filed" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Charter
    field: status
    initial_state: DRAFT
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /charters/{charterId}/schedule"
        actor: FleetManager
        preconditions:
          - "Boat.status == IN_SERVICE (ERR_BOAT_NOT_IN_SERVICE)"
          - "Marina.status == OPEN (ERR_MARINA_NOT_OPEN)"
          - "A CAPTAIN CrewAssignment with captain_id != null exists and is TENTATIVE (ERR_NO_CAPTAIN_ASSIGNED)"
          - "If trip_type == OFFSHORE: a MATE CrewAssignment with mate_id != null exists (ERR_NO_MATE_ASSIGNED) AND charter.permit_id != null (ERR_PERMIT_REQUIRED)"
          - "A SlotReservation in {HELD, OCCUPIED} exists for this charter (ERR_NO_SLOT_RESERVED)"
        side_effects:
          - "All CrewAssignment rows for this charter: TENTATIVE -> LOCKED"
          - "The charter's SlotReservation: HELD -> OCCUPIED"
          - "increments Charter.version by 1"
        note: "Schedule locks crew and converts the held slot into an occupied slot."

      - from: SCHEDULED
        to: WEATHER_HOLD
        trigger: "POST /charters/{charterId}/weather-hold"
        actor: Captain
        preconditions:
          - "Charter.status == SCHEDULED (ERR_CHARTER_NOT_SCHEDULED)"
        side_effects:
          - "All Bookings in {RESERVED, CONFIRMED}: set weather_waiver = true (eligibility flag for full-deposit refund on cancel during hold)"
          - "CrewAssignment rows: LOCKED -> TENTATIVE (crew released back to the roster pool)"
          - "The charter's SlotReservation: OCCUPIED -> HELD (slot kept but window reservation softened)"
          - "increments Charter.version by 1"
        note: "Weather hold pauses the charter; crew float free and bookings gain a full-refund waiver."

      - from: WEATHER_HOLD
        to: SCHEDULED
        trigger: "POST /charters/{charterId}/reschedule"
        actor: FleetManager
        preconditions:
          - "Charter.status == WEATHER_HOLD (ERR_CHARTER_NOT_ON_HOLD)"
          - "new depart_at strictly before captain.license_expires_on and permit.valid_through if present (ERR_CREDENTIAL_EXPIRED_FOR_DATE)"
          - "the new [depart_at, return_at) window does not collide with another {HELD, OCCUPIED} SlotReservation on the same slot under the marina turnaround buffer (ERR_SLOT_WINDOW_CONFLICT)"
        side_effects:
          - "Charter.depart_at, return_at overwritten with the new window"
          - "SlotReservation.window_start/window_end re-anchored to new depart_at/return_at; status HELD -> OCCUPIED"
          - "CrewAssignment rows: TENTATIVE -> LOCKED"
          - "weather_reschedule_count += 1"
          - "All Bookings: weather_waiver reset to false"
          - "Each non-terminal Booking accrues reschedule_fee_cents per reschedule_fee_cents calc; reschedule_fee_total_cents += that fee; gold_reschedule_waiver_used set true on first GOLD waiver"
          - "increments Charter.version by 1"
        note: "Reschedule re-anchors the slot window, re-locks crew, and is the cycle edge back to SCHEDULED."

      - from: SCHEDULED
        to: SAILED
        trigger: "POST /charters/{charterId}/sail"
        actor: Captain
        preconditions:
          - "Charter.status == SCHEDULED (ERR_CHARTER_NOT_SCHEDULED)"
          - "current clock >= charter.depart_at (ERR_DEPART_TIME_NOT_REACHED)"
          - "seats_booked >= 1 (ERR_NO_BOOKINGS_TO_SAIL)"
          - "every CrewAssignment for this charter is LOCKED (ERR_CREW_NOT_LOCKED)"
        side_effects:
          - "All Bookings in RESERVED whose deposit_paid_cents == 0: -> NO_SHOW (no-show, seat released)"
          - "All Bookings in {RESERVED, CONFIRMED} with deposit_paid_cents > 0: -> CONFIRMED (kept)"
          - "increments Charter.version by 1"
        note: "Sailing departs; unpaid reservations are dropped as no-shows."

      - from: SAILED
        to: SETTLED
        trigger: "POST /charters/{charterId}/settle"
        actor: FleetManager
        preconditions:
          - "Charter.status == SAILED (ERR_CHARTER_NOT_SAILED)"
          - "catch_total (kept fish) <= permit.daily_bag_limit when permit_id present (ERR_BAG_LIMIT_EXCEEDED)"
        side_effects:
          - "Each CONFIRMED Booking: compute gratuity_cents (see gratuity calc) and -> SETTLED"
          - "Each CrewAssignment: LOCKED -> RELEASED"
          - "The charter's SlotReservation: OCCUPIED -> RELEASED (slot freed)"
          - "All PENDING AddOnLines on settled bookings -> FULFILLED"
          - "increments Charter.version by 1"
        note: "Settlement distributes gratuity, frees crew & slot, fulfils add-ons."

      - from: [DRAFT, SCHEDULED, WEATHER_HOLD]
        to: CANCELLED
        trigger: "POST /charters/{charterId}/cancel"
        actor: FleetManager
        preconditions:
          - "Charter.status in {DRAFT, SCHEDULED, WEATHER_HOLD} (ERR_CHARTER_NOT_CANCELLABLE)"
        side_effects:
          - "Each non-terminal Booking: cascade-cancel -> CANCELLED; compute refund_cents per cancellation-refund calc (full deposit if weather_waiver true)"
          - "Each AddOnLine on a cancelled booking: PENDING/FULFILLED -> VOIDED"
          - "Each CrewAssignment: -> RELEASED"
          - "The charter's SlotReservation: -> RELEASED (slot freed)"
          - "increments Charter.version by 1"
        note: "Cancelling a charter cascades into bookings, add-ons, crew, and the slot."

  - entity: Booking
    field: status
    initial_state: RESERVED
    terminal_states: [CANCELLED, SETTLED, NO_SHOW]
    transitions:
      - from: RESERVED
        to: CONFIRMED
        trigger: "POST /bookings/{bookingId}/pay-deposit"
        actor: Customer
        preconditions:
          - "Booking.status == RESERVED (ERR_BOOKING_NOT_RESERVED)"
          - "Charter.status in {DRAFT, SCHEDULED} (ERR_CHARTER_NOT_BOOKABLE)"
          - "amount_cents in payload >= deposit_due_cents (ERR_DEPOSIT_UNDERPAID)"
        side_effects:
          - "deposit_paid_cents = amount_cents"
          - "Charter.seats_booked unchanged (already counted at reservation)"
      - from: [RESERVED, CONFIRMED]
        to: CANCELLED
        trigger: "POST /bookings/{bookingId}/cancel"
        actor: Customer
        preconditions:
          - "Booking.status in {RESERVED, CONFIRMED} (ERR_BOOKING_NOT_CANCELLABLE)"
          - "Charter.status != SAILED and != SETTLED (ERR_CHARTER_ALREADY_SAILED)"
        side_effects:
          - "refund_cents computed per cancellation-refund calc (weather_waiver -> full deposit, else timing tier)"
          - "Charter.seats_booked decremented by party_size"
          - "Each AddOnLine on this booking: -> VOIDED"
        note: "Customer-initiated cancel; refund depends on weather waiver and lead time."
      - from: RESERVED
        to: NO_SHOW
        trigger: "system (charter SAIL with deposit_paid_cents == 0)"
        actor: system
        preconditions:
          - "deposit_paid_cents == 0 at sail time"
        side_effects:
          - "Charter.seats_booked decremented by party_size"
          - "Each AddOnLine on this booking: -> VOIDED"
      - from: CONFIRMED
        to: SETTLED
        trigger: "system (charter SETTLE)"
        actor: system
        preconditions:
          - "parent Charter transitioning SAILED -> SETTLED"
        side_effects:
          - "gratuity_cents computed per gratuity calc"

  - entity: CrewAssignment
    field: status
    initial_state: TENTATIVE
    terminal_states: [RELEASED]
    transitions:
      - from: TENTATIVE
        to: LOCKED
        trigger: "system (charter SCHEDULE or RESCHEDULE)"
        actor: system
        preconditions:
          - "captain_id != null for CAPTAIN slot; mate_id != null for MATE slot"
        side_effects: []
      - from: LOCKED
        to: TENTATIVE
        trigger: "system (charter WEATHER_HOLD)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Crew float back to the roster pool during a weather hold (cycle edge)."
      - from: [TENTATIVE, LOCKED]
        to: RELEASED
        trigger: "system (charter SETTLE or CANCEL)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SlotReservation
    field: status
    initial_state: HELD
    terminal_states: [RELEASED]
    transitions:
      - from: HELD
        to: OCCUPIED
        trigger: "system (charter SCHEDULE or RESCHEDULE)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OCCUPIED
        to: HELD
        trigger: "system (charter WEATHER_HOLD)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [HELD, OCCUPIED]
        to: RELEASED
        trigger: "system (charter SETTLE or CANCEL)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AddOnLine
    field: status
    initial_state: PENDING
    terminal_states: [VOIDED]
    transitions:
      - from: PENDING
        to: FULFILLED
        trigger: "system (charter SETTLE) or POST /add-on-lines/{addOnId}/fulfill"
        actor: system
        preconditions:
          - "parent Booking is CONFIRMED or SETTLED (ERR_ADDON_BOOKING_NOT_FULFILLABLE)"
        side_effects: []
      - from: [PENDING, FULFILLED]
        to: VOIDED
        trigger: "system (booking CANCEL or NO_SHOW, or charter CANCEL)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: booking-create-stale-charter
    parent_entity: Charter
    write_endpoint: "POST /bookings"
    occ_field: "expected_charter_version"
    description: |
      Creating a Booking against a Charter whose version has advanced since the
      client last observed it is rejected. This captures the case where seats on
      the charter were consumed by another booking (advancing the charter's
      version and seats_booked) so the current writer's view of seat availability
      is stale, and admitting the new party could legitimately oversell the
      charter.
    error_id: ERR_STALE_CHARTER_VERSION
    http_status: 412

  - rule_id: slot-reserve-stale-charter
    parent_entity: Charter
    write_endpoint: "POST /slot-reservations"
    occ_field: "expected_charter_version"
    description: |
      Creating a SlotReservation against a Charter whose version has advanced
      since the client last observed it is rejected. A reschedule or schedule
      that already re-anchored the charter's window (advancing its version) makes
      the client's chosen slot window stale, so a fresh reservation built on the
      old window is refused.
    error_id: ERR_STALE_CHARTER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: seat_subtotal_cents
    trigger: "Booking creation (POST /bookings); recomputed never after (frozen at reservation)"
    algorithm: tiered_pricing
    formula: |
      # Per-seat price depends on whether the charter is a split charter and on a
      # group-size volume threshold. Evaluation order is FIXED:
      #   1. resolve effective per-seat price
      #   2. multiply by party_size
      #   3. apply group rounding rule (round the SUBTOTAL once, not per seat)
      eff_seat = charter.base_seat_price_cents
      if charter.split_charter:
          # split charters charge a fixed solidarity surcharge per seat because
          # shared boats cost more to coordinate
          eff_seat = eff_seat + SPLIT_SURCHARGE_CENTS
      # group volume discount: parties of GROUP_THRESHOLD+ seats get a percent off
      # the per-seat price, applied BEFORE multiplying by party_size
      if party_size >= GROUP_THRESHOLD:
          eff_seat = floor(eff_seat * (100 - GROUP_DISCOUNT_PCT) / 100)
      raw = eff_seat * party_size
      seat_subtotal_cents = raw   # raw is already integer cents; no further rounding
    input_set: "Single Booking at creation; charter fields read once and frozen."
    constants:
      SPLIT_SURCHARGE_CENTS: 1500
      GROUP_THRESHOLD: 4
      GROUP_DISCOUNT_PCT: 10
    precision: "integer cents; floor() on the per-seat discount step, BEFORE the party_size multiply"
    note: "Mode (a) combinatorial: 3 inputs (base price, split flag, party_size) with conditional branches; the per-seat floor BEFORE multiply is the pinned order."

  - name: deposit_due_cents
    trigger: "Booking creation (POST /bookings); frozen at reservation"
    algorithm: threshold
    formula: |
      # Deposit is DEPOSIT_PCT of the seat subtotal, rounded half-up to the cent,
      # but never less than MIN_DEPOSIT_CENTS and never more than the subtotal.
      pct_part = seat_subtotal_cents * DEPOSIT_PCT / 100   # exact rational
      rounded = round_half_up(pct_part)                    # to integer cents
      deposit_due_cents = max(MIN_DEPOSIT_CENTS, min(rounded, seat_subtotal_cents))
    input_set: "Single Booking; reads its own seat_subtotal_cents."
    constants:
      DEPOSIT_PCT: 25
      MIN_DEPOSIT_CENTS: 2000
    precision: "round_half_up to integer cents on the percentage step"

  - name: addon_line_total_cents
    trigger: "AddOnLine creation (POST /add-on-lines)"
    algorithm: tiered_pricing
    formula: |
      # unit_price resolved from the rate card by addon_kind:
      RATE_CARD = { BAIT: 800, ROD_RENTAL: 2500, FISH_CLEANING: 1200, COOLER_ICE: 600 }
      unit_price_cents = RATE_CARD[addon_kind]
      gross = unit_price_cents * quantity
      # bulk discount: if quantity >= BULK_QTY, take BULK_PCT off the WHOLE line,
      # rounding the discount DOWN (floor) so the customer is never over-credited
      if quantity >= BULK_QTY:
          discount = floor(gross * BULK_PCT / 100)
          line_total_cents = gross - discount
      else:
          line_total_cents = gross
    input_set: "Single AddOnLine at creation."
    constants:
      BULK_QTY: 10
      BULK_PCT: 15
    precision: "floor() on the discount; line_total in integer cents"

  - name: cancellation_refund_cents
    trigger: "Booking cancel (POST /bookings/{id}/cancel) and charter-cancel cascade"
    algorithm: chronological
    formula: |
      # FORWARD-LOOKING vs CHRONOLOGICAL divergence lives here (the dual of
      # gratuity below, on a DIFFERENT entity domain — Booking refunds vs crew tips).
      # Refund of the DEPOSIT paid (deposit_paid_cents), gated by weather waiver
      # then by lead time before departure measured against the current clock.
      if booking.weather_waiver:
          refund_cents = booking.deposit_paid_cents          # full deposit back
      else:
          lead_hours = (charter.depart_at - now_utc) / 3600    # may be negative
          if lead_hours >= FULL_REFUND_HOURS:
              refund_cents = booking.deposit_paid_cents        # 100%
          elif lead_hours >= PARTIAL_REFUND_HOURS:
              # PARTIAL_PCT of the deposit, rounded half-up
              refund_cents = round_half_up(booking.deposit_paid_cents * PARTIAL_PCT / 100)
          else:
              refund_cents = 0                                 # forfeit
    input_set: "Single Booking; reads its charter.depart_at and the live clock."
    constants:
      FULL_REFUND_HOURS: 72
      PARTIAL_REFUND_HOURS: 24
      PARTIAL_PCT: 50
    precision: "round_half_up to integer cents on the partial step; boundaries are >= (so exactly 72h -> full, exactly 24h -> partial)"
    variants:
      - name: weather_waiver_full
        when: "booking.weather_waiver == true (cancelled while charter in WEATHER_HOLD)"
        difference: "Ignores lead-time tiers entirely; always returns the full deposit_paid_cents."
      - name: lead_time_tiered
        when: "booking.weather_waiver == false"
        difference: "Applies the 72h / 24h chronological lead-time ladder against the live clock."

  - name: gratuity_cents
    trigger: "Booking settlement (charter SAILED -> SETTLED)"
    algorithm: forward_looking
    formula: |
      # Gratuity is computed per CONFIRMED booking at settlement, on a DIFFERENT
      # entity domain than the refund calc (crew compensation vs customer refund).
      # Base for the tip is the seat_subtotal_cents PLUS the sum of FULFILLED
      # add-on line totals on this booking (service value, not just seats).
      addon_base = sum(line_total_cents for AddOnLine in {PENDING, FULFILLED} on this booking)
      tip_base = booking.seat_subtotal_cents + addon_base
      if booking.gratuity_input_mode == PERCENT:
          # percent tip, rounded half-up to the cent
          gratuity_cents = round_half_up(tip_base * booking.gratuity_input_value / 100)
      else:  # FLAT
          gratuity_cents = booking.gratuity_input_value
      # auto-gratuity floor: large parties owe at least AUTO_GRAT_PCT of tip_base
      if booking.party_size >= AUTO_GRAT_PARTY:
          floor_tip = round_half_up(tip_base * AUTO_GRAT_PCT / 100)
          gratuity_cents = max(gratuity_cents, floor_tip)
    input_set: "Single CONFIRMED Booking at its charter's settlement; includes its non-VOIDED add-on lines."
    constants:
      AUTO_GRAT_PARTY: 6
      AUTO_GRAT_PCT: 20
    precision: "round_half_up to integer cents; the max() with the auto-grat floor is applied AFTER computing the customer tip"
    variants:
      - name: percent_tip
        when: "gratuity_input_mode == PERCENT"
        difference: "Tip = round_half_up(tip_base * pct / 100), then floored up to auto-grat for large parties."
      - name: flat_tip
        when: "gratuity_input_mode == FLAT"
        difference: "Tip = the flat cents entered, then floored up to auto-grat for large parties."

  - name: reschedule_fee_cents
    trigger: "Charter reschedule (WEATHER_HOLD -> SCHEDULED) for each non-terminal booking"
    algorithm: tiered_pricing
    formula: |
      # Reschedule fee escalates with how many times THIS charter has already been
      # rescheduled (weather_reschedule_count BEFORE this increment), and is waived
      # once for GOLD-tier customers.
      n = charter.weather_reschedule_count   # count BEFORE this reschedule increments it
      if n == 0:
          fee = FIRST_RESCHEDULE_FEE_CENTS
      elif n == 1:
          fee = SECOND_RESCHEDULE_FEE_CENTS
      else:
          fee = round_half_up(booking.seat_subtotal_cents * REPEAT_RESCHEDULE_PCT / 100)
      # GOLD customers get the FIRST fee they would ever owe on this booking waived
      if customer.loyalty_tier == GOLD and not booking.gold_reschedule_waiver_used:
          fee = 0
          booking.gold_reschedule_waiver_used = true   # one-time waiver per booking
      reschedule_fee_cents = fee
      booking.reschedule_fee_total_cents += reschedule_fee_cents
    input_set: "Each non-terminal Booking on the rescheduled charter; reads its customer's loyalty_tier."
    constants:
      FIRST_RESCHEDULE_FEE_CENTS: 1000
      SECOND_RESCHEDULE_FEE_CENTS: 2500
      REPEAT_RESCHEDULE_PCT: 15
    precision: "round_half_up to integer cents on the percent tier; tiers selected by weather_reschedule_count BEFORE increment"
    note: "Threshold/tier selection keys on the PRE-increment count so the first reschedule is tier 0."

  - name: open_slot_count
    trigger: "Any SlotReservation create/transition; recomputed on read of Marina"
    algorithm: aggregation
    formula: |
      # Count slots free RIGHT NOW: a slot is busy if it has any SlotReservation in
      # {HELD, OCCUPIED} whose [window_start, window_end) brackets the current clock.
      busy = count(distinct dock_slot_id for SlotReservation
                   where status in {HELD, OCCUPIED}
                     and window_start <= now_utc < window_end)
      open_slot_count = max(0, marina.slot_count - busy)
    input_set: "All SlotReservations whose DockSlot.marina_id == this marina."
    constants: {}
    precision: "integer count; window is half-open [start, end)"

  - name: catch_total
    trigger: "CatchReport create (POST /catch-reports); read on charter settle bag-limit check"
    algorithm: aggregation
    formula: |
      # Only KEPT fish count against the bag limit; released fish are excluded.
      catch_total = sum( (report.fish_count - report.released_count)
                         for CatchReport where charter_id == this charter )
    input_set: "All CatchReport rows for the charter."
    constants: {}
    precision: "integer count"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every id in the path and every FK in the body resolves to an existing resource, validated left-to-right (path first, then body FKs in declared order)"
    error_id: "ERR_MARINA_NOT_FOUND / ERR_BOAT_NOT_FOUND / ERR_CHARTER_NOT_FOUND / ERR_BOOKING_NOT_FOUND / ERR_SLOT_NOT_FOUND / ERR_CAPTAIN_NOT_FOUND / ERR_MATE_NOT_FOUND / ERR_PERMIT_NOT_FOUND / ERR_ADDON_NOT_FOUND / ERR_CUSTOMER_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path ids or body FKs

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, types correct, enums in range, integers within stated bounds (e.g. party_size >= 1, return_at > depart_at, released_count <= fish_count)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all write endpoints

  - priority: 5
    category: state
    check: "Target resource is in a state that permits this transition (charter/booking/crew/slot/addon state preconditions)"
    error_id: "ERR_CHARTER_NOT_SCHEDULED / ERR_CHARTER_NOT_ON_HOLD / ERR_CHARTER_NOT_SAILED / ERR_CHARTER_NOT_CANCELLABLE / ERR_CHARTER_NOT_BOOKABLE / ERR_BOOKING_NOT_RESERVED / ERR_BOOKING_NOT_CANCELLABLE / ERR_CHARTER_ALREADY_SAILED / ERR_ADDON_BOOKING_NOT_FULFILLABLE"
    http_status: 409
    applies_to: state-transition endpoints

  - priority: 6
    category: business_referential
    check: "Cross-entity wiring valid: boat.marina_id == charter.marina_id; captain/mate.marina_id == charter.marina_id; dock_slot.marina_id == charter.marina_id; addon.booking.charter_id consistent; permit kind matches trip_type (OFFSHORE needs FEDERAL_OFFSHORE)"
    error_id: ERR_CROSS_MARINA_MISMATCH
    http_status: 409
    applies_to: "POST /charters, POST /crew-assignments, POST /slot-reservations"

  - priority: 7
    category: business_safety
    check: "Credential/capacity safety: captain.status==AVAILABLE & license not lapsed for sail date & grade sufficient for trip_type; mate certified for OFFSHORE; boat.offshore_rated for OFFSHORE; boat.length_ft <= dock_slot.max_boat_length_ft"
    error_id: "ERR_CAPTAIN_UNQUALIFIED / ERR_CREDENTIAL_EXPIRED_FOR_DATE / ERR_MATE_NOT_OFFSHORE_CERTIFIED / ERR_BOAT_NOT_OFFSHORE_RATED / ERR_SLOT_LENGTH_EXCEEDED"
    http_status: 422
    applies_to: "POST /crew-assignments, POST /charters/{id}/schedule, POST /slot-reservations"

  - priority: 8
    category: business_temporal
    check: "Slot window does not overlap an existing {HELD, OCCUPIED} reservation on the same slot once the marina turnaround buffer is applied AFTER the prior window (closed-adjacency: prior_end + buffer is the earliest the next window may open; touching at exactly prior_end is still a conflict); reschedule window obeys the same rule"
    error_id: ERR_SLOT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /slot-reservations, POST /charters/{id}/reschedule"

  - priority: 9
    category: business_temporal
    check: "Captain double-booking: a captain already named on a TENTATIVE/LOCKED CrewAssignment whose charter's [depart_at, return_at) interval strictly overlaps the new charter's [depart_at, return_at) cannot be assigned again (pure half-open overlap, NO buffer — back-to-back windows touching at a shared endpoint are allowed)"
    error_id: ERR_CAPTAIN_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /crew-assignments"

  - priority: 10
    category: business_constraint
    check: "Capacity: party_size + charter.seats_booked <= charter.seats_total at booking time; charter.seats_total <= boat.passenger_capacity at charter creation"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /bookings, POST /charters"

  - priority: 11
    category: business_safety
    check: "Bag limit: kept-fish catch_total <= permit.daily_bag_limit at settlement when permit present"
    error_id: ERR_BAG_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /charters/{id}/settle"

  - priority: 12
    category: business_fiscal
    check: "Deposit payment amount_cents >= deposit_due_cents on pay-deposit"
    error_id: ERR_DEPOSIT_UNDERPAID
    http_status: 402
    applies_to: "POST /bookings/{id}/pay-deposit"

  - priority: 13
    category: business_constraint
    check: "OCC: expected_charter_version matches current Charter.version on POST /bookings and POST /slot-reservations"
    error_id: ERR_STALE_CHARTER_VERSION
    http_status: 412
    applies_to: "POST /bookings, POST /slot-reservations"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Marina ----
  - method: POST
    path: "/marinas"
    description: "Create a marina"
    roles: [DockMaster]
    code: 201
    input: [name, slot_count, "timezone_offset_minutes?", "turnaround_buffer_minutes?"]
    output: Marina
    side_effects: ["status=OPEN, open_slot_count=slot_count"]

  - method: GET
    path: "/marinas"
    description: "List marinas"
    roles: [DockMaster, FleetManager, Captain, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Marina[]"
    side_effects: []

  - method: GET
    path: "/marinas/{marinaId}"
    description: "Get a marina (recomputes open_slot_count)"
    roles: [DockMaster, FleetManager, Captain, Customer]
    code: 200
    input: []
    output: Marina
    side_effects: ["open_slot_count recomputed"]

  - method: POST
    path: "/marinas/{marinaId}/set-status"
    description: "Set marina operational status (OPEN/RESTRICTED/CLOSED)"
    roles: [DockMaster]
    code: 200
    input: [status]
    output: Marina
    side_effects: ["Marina.status updated"]

  # ---- DockSlot ----
  - method: POST
    path: "/dock-slots"
    description: "Create a dock slot under a marina"
    roles: [DockMaster]
    code: 201
    input: [marina_id, slot_label, max_boat_length_ft]
    output: DockSlot
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/dock-slots"
    description: "List/filter dock slots (reverse-reachability for DockSlot.marina_id)"
    roles: [DockMaster, FleetManager, Captain, Customer]
    code: 200
    input: ["marina_id?", "limit?", "offset?"]
    output: "DockSlot[]"
    side_effects: []

  - method: GET
    path: "/dock-slots/{slotId}"
    description: "Get a dock slot"
    roles: [DockMaster, FleetManager, Captain, Customer]
    code: 200
    input: []
    output: DockSlot
    side_effects: []

  - method: POST
    path: "/dock-slots/{slotId}/decommission"
    description: "Decommission a dock slot"
    roles: [DockMaster]
    code: 200
    input: []
    output: DockSlot
    side_effects: ["status -> DECOMMISSIONED"]

  # ---- Boat ----
  - method: POST
    path: "/boats"
    description: "Create a boat"
    roles: [FleetManager]
    code: 201
    input: [marina_id, name, length_ft, passenger_capacity, "offshore_rated?"]
    output: Boat
    side_effects: ["status=IN_SERVICE"]

  - method: GET
    path: "/boats"
    description: "List/filter boats (reverse-reachability for Boat.marina_id)"
    roles: [DockMaster, FleetManager, Captain, Customer]
    code: 200
    input: ["marina_id?", "limit?", "offset?"]
    output: "Boat[]"
    side_effects: []

  - method: GET
    path: "/boats/{boatId}"
    description: "Get a boat"
    roles: [DockMaster, FleetManager, Captain, Customer]
    code: 200
    input: []
    output: Boat
    side_effects: []

  - method: POST
    path: "/boats/{boatId}/set-status"
    description: "Set boat status (IN_SERVICE/DRYDOCK)"
    roles: [FleetManager]
    code: 200
    input: [status]
    output: Boat
    side_effects: ["Boat.status updated"]

  # ---- Captain / Mate / Permit ----
  - method: POST
    path: "/captains"
    description: "Create a captain"
    roles: [FleetManager]
    code: 201
    input: [marina_id, full_name, uscg_license_grade, license_expires_on, "offshore_permit_id?"]
    output: Captain
    side_effects: ["status=AVAILABLE"]

  - method: GET
    path: "/captains"
    description: "List/filter captains (reverse-reachability for Captain.marina_id and Captain.offshore_permit_id)"
    roles: [DockMaster, FleetManager]
    code: 200
    input: ["marina_id?", "offshore_permit_id?", "limit?", "offset?"]
    output: "Captain[]"
    side_effects: []

  - method: GET
    path: "/captains/{captainId}"
    description: "Get a captain"
    roles: [DockMaster, FleetManager, Captain]
    code: 200
    input: []
    output: Captain
    side_effects: []

  - method: POST
    path: "/captains/{captainId}/set-status"
    description: "Set captain status (AVAILABLE/SUSPENDED)"
    roles: [FleetManager]
    code: 200
    input: [status]
    output: Captain
    side_effects: ["Captain.status updated"]

  - method: POST
    path: "/mates"
    description: "Create a mate"
    roles: [FleetManager]
    code: 201
    input: [marina_id, full_name, "certified_offshore?"]
    output: Mate
    side_effects: ["status=AVAILABLE"]

  - method: GET
    path: "/mates"
    description: "List/filter mates (reverse-reachability for Mate.marina_id)"
    roles: [DockMaster, FleetManager]
    code: 200
    input: ["marina_id?", "limit?", "offset?"]
    output: "Mate[]"
    side_effects: []

  - method: GET
    path: "/mates/{mateId}"
    description: "Get a mate"
    roles: [DockMaster, FleetManager, Captain]
    code: 200
    input: []
    output: Mate
    side_effects: []

  - method: POST
    path: "/permits"
    description: "Register a permit/license"
    roles: [FleetManager]
    code: 201
    input: [permit_kind, permit_number, valid_through, daily_bag_limit]
    output: Permit
    side_effects: []

  - method: GET
    path: "/permits/{permitId}"
    description: "Get a permit"
    roles: [DockMaster, FleetManager, Captain]
    code: 200
    input: []
    output: Permit
    side_effects: []

  # ---- Customer ----
  - method: POST
    path: "/customers"
    description: "Create a customer"
    roles: [DockMaster, FleetManager, Customer]
    code: 201
    input: [full_name, email, "loyalty_tier?"]
    output: Customer
    side_effects: []

  - method: GET
    path: "/customers/{customerId}"
    description: "Get a customer"
    roles: [DockMaster, FleetManager, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # ---- Charter ----
  - method: POST
    path: "/charters"
    description: "Create a charter in DRAFT"
    roles: [FleetManager]
    code: 201
    input: [marina_id, boat_id, trip_type, depart_at, return_at, base_seat_price_cents, seats_total, "permit_id?", "split_charter?"]
    output: Charter
    side_effects: ["status=DRAFT, seats_booked=0, catch_total=0, weather_reschedule_count=0; validates seats_total <= boat.passenger_capacity and cross-marina wiring"]

  - method: GET
    path: "/charters"
    description: "List/filter charters (reverse-reachability for Charter.marina_id, Charter.boat_id, Charter.permit_id)"
    roles: [DockMaster, FleetManager, Captain, Customer]
    code: 200
    input: ["marina_id?", "boat_id?", "permit_id?", "limit?", "offset?"]
    output: "Charter[]"
    side_effects: []

  - method: GET
    path: "/charters/{charterId}"
    description: "Get a charter (recomputes seats_booked, catch_total)"
    roles: [DockMaster, FleetManager, Captain, Customer]
    code: 200
    input: []
    output: Charter
    side_effects: ["seats_booked, catch_total recomputed"]

  - method: POST
    path: "/charters/{charterId}/schedule"
    description: "Schedule a DRAFT charter (locks crew, occupies slot)"
    roles: [FleetManager]
    code: 200
    input: []
    output: Charter
    side_effects: ["crew TENTATIVE->LOCKED; slot HELD->OCCUPIED; status DRAFT->SCHEDULED; Charter.version += 1"]

  - method: POST
    path: "/charters/{charterId}/weather-hold"
    description: "Put a scheduled charter on weather hold"
    roles: [Captain]
    code: 200
    input: []
    output: Charter
    side_effects: ["bookings weather_waiver=true; crew LOCKED->TENTATIVE; slot OCCUPIED->HELD; status SCHEDULED->WEATHER_HOLD; Charter.version += 1"]

  - method: POST
    path: "/charters/{charterId}/reschedule"
    description: "Reschedule a held charter to a new window (cycle edge back to SCHEDULED)"
    roles: [FleetManager]
    code: 200
    input: [depart_at, return_at]
    output: Charter
    side_effects: ["window re-anchored; slot HELD->OCCUPIED; crew TENTATIVE->LOCKED; weather_reschedule_count+=1; per-booking reschedule fee accrued; weather_waiver reset false; status WEATHER_HOLD->SCHEDULED; Charter.version += 1"]

  - method: POST
    path: "/charters/{charterId}/sail"
    description: "Depart a scheduled charter"
    roles: [Captain]
    code: 200
    input: []
    output: Charter
    side_effects: ["unpaid RESERVED bookings -> NO_SHOW; paid bookings -> CONFIRMED; status SCHEDULED->SAILED; Charter.version += 1"]

  - method: POST
    path: "/charters/{charterId}/settle"
    description: "Settle a sailed charter (distribute gratuity, free crew & slot)"
    roles: [FleetManager]
    code: 200
    input: []
    output: Charter
    side_effects: ["bag-limit check; per-booking gratuity computed; bookings -> SETTLED; crew -> RELEASED; slot -> RELEASED; addons -> FULFILLED; status SAILED->SETTLED; Charter.version += 1"]

  - method: POST
    path: "/charters/{charterId}/cancel"
    description: "Cancel a charter (cascade to bookings, addons, crew, slot)"
    roles: [FleetManager]
    code: 200
    input: []
    output: Charter
    side_effects: ["bookings cascade-cancelled with refunds; addons VOIDED; crew RELEASED; slot RELEASED; status -> CANCELLED; Charter.version += 1"]

  # ---- CrewAssignment ----
  - method: POST
    path: "/crew-assignments"
    description: "Assign a captain or mate seat to a charter (TENTATIVE)"
    roles: [FleetManager]
    code: 201
    input: [charter_id, role_slot, "captain_id?", "mate_id?"]
    output: CrewAssignment
    side_effects: ["status=TENTATIVE; validates credentials, cross-marina, qualification, captain double-booking (half-open interval overlap, no buffer)"]

  - method: GET
    path: "/crew-assignments"
    description: "List/filter crew assignments (reverse-reachability for CrewAssignment.charter_id, CrewAssignment.captain_id, CrewAssignment.mate_id)"
    roles: [DockMaster, FleetManager, Captain]
    code: 200
    input: ["charter_id?", "captain_id?", "mate_id?", "limit?", "offset?"]
    output: "CrewAssignment[]"
    side_effects: []

  - method: GET
    path: "/crew-assignments/{assignmentId}"
    description: "Get a crew assignment"
    roles: [DockMaster, FleetManager, Captain]
    code: 200
    input: []
    output: CrewAssignment
    side_effects: []

  # ---- SlotReservation ----
  - method: POST
    path: "/slot-reservations"
    description: "Reserve a dock slot window for a charter (HELD)"
    roles: [DockMaster, FleetManager]
    code: 201
    input: [dock_slot_id, charter_id, expected_charter_version]
    output: SlotReservation
    side_effects: ["status=HELD; window copied from charter depart/return; overlap & length checks; Charter.version += 1"]

  - method: GET
    path: "/slot-reservations"
    description: "List/filter slot reservations (reverse-reachability for SlotReservation.dock_slot_id, SlotReservation.charter_id)"
    roles: [DockMaster, FleetManager]
    code: 200
    input: ["dock_slot_id?", "charter_id?", "limit?", "offset?"]
    output: "SlotReservation[]"
    side_effects: []

  - method: GET
    path: "/slot-reservations/{reservationId}"
    description: "Get a slot reservation"
    roles: [DockMaster, FleetManager]
    code: 200
    input: []
    output: SlotReservation
    side_effects: []

  # ---- Booking ----
  - method: POST
    path: "/bookings"
    description: "Create a booking against a charter (RESERVED, seat-counted, deposit computed)"
    roles: [Customer, FleetManager]
    code: 201
    input: [charter_id, customer_id, party_size, expected_charter_version, "gratuity_input_mode?", "gratuity_input_value?"]
    output: Booking
    side_effects: ["status=RESERVED; seat_subtotal_cents & deposit_due_cents computed; Charter.seats_booked += party_size; Charter.version += 1"]

  - method: GET
    path: "/bookings"
    description: "List/filter bookings (reverse-reachability for Booking.charter_id and Booking.customer_id)"
    roles: [DockMaster, FleetManager, Captain, Customer]
    code: 200
    input: ["charter_id?", "customer_id?", "limit?", "offset?"]
    output: "Booking[]"
    side_effects: []

  - method: GET
    path: "/bookings/{bookingId}"
    description: "Get a booking"
    roles: [DockMaster, FleetManager, Captain, Customer]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: POST
    path: "/bookings/{bookingId}/pay-deposit"
    description: "Record a deposit payment, confirming the booking"
    roles: [Customer, FleetManager]
    code: 200
    input: [amount_cents]
    output: Booking
    side_effects: ["deposit_paid_cents=amount_cents; status RESERVED->CONFIRMED"]

  - method: POST
    path: "/bookings/{bookingId}/cancel"
    description: "Customer-cancel a booking (refund per timing/weather)"
    roles: [Customer, FleetManager]
    code: 200
    input: []
    output: Booking
    side_effects: ["refund_cents computed; status -> CANCELLED; seats_booked decremented; addons VOIDED"]

  # ---- AddOnLine ----
  - method: POST
    path: "/add-on-lines"
    description: "Add a gear/bait/service add-on to a booking"
    roles: [Customer, FleetManager]
    code: 201
    input: [booking_id, addon_kind, quantity]
    output: AddOnLine
    side_effects: ["status=PENDING; unit_price & line_total_cents computed"]

  - method: GET
    path: "/add-on-lines"
    description: "List/filter add-on lines (reverse-reachability for AddOnLine.booking_id)"
    roles: [DockMaster, FleetManager, Captain, Customer]
    code: 200
    input: ["booking_id?", "limit?", "offset?"]
    output: "AddOnLine[]"
    side_effects: []

  - method: GET
    path: "/add-on-lines/{addOnId}"
    description: "Get an add-on line"
    roles: [DockMaster, FleetManager, Customer]
    code: 200
    input: []
    output: AddOnLine
    side_effects: []

  - method: POST
    path: "/add-on-lines/{addOnId}/fulfill"
    description: "Mark an add-on line fulfilled (booking must be CONFIRMED/SETTLED)"
    roles: [FleetManager]
    code: 200
    input: []
    output: AddOnLine
    side_effects: ["status PENDING->FULFILLED"]

  # ---- CatchReport ----
  - method: POST
    path: "/catch-reports"
    description: "File a catch report against a sailed charter"
    roles: [Captain]
    code: 201
    input: [charter_id, species, fish_count, "released_count?"]
    output: CatchReport
    side_effects: ["reported_at stamped; Charter.catch_total recomputed"]

  - method: GET
    path: "/catch-reports"
    description: "List/filter catch reports (reverse-reachability for CatchReport.charter_id)"
    roles: [DockMaster, FleetManager, Captain]
    code: 200
    input: ["charter_id?", "limit?", "offset?"]
    output: "CatchReport[]"
    side_effects: []

  - method: GET
    path: "/catch-reports/{reportId}"
    description: "Get a catch report"
    roles: [DockMaster, FleetManager, Captain]
    code: 200
    input: []
    output: CatchReport
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's notion of current UTC (drives lead-time refunds, depart-time gating, slot window occupancy)"
    roles: [DockMaster, FleetManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server clock set to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_USER_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation" }
  # --- existence ---
  - { id: ERR_MARINA_NOT_FOUND, http: 404, condition: "Marina id does not exist" }
  - { id: ERR_BOAT_NOT_FOUND, http: 404, condition: "Boat id does not exist" }
  - { id: ERR_CAPTAIN_NOT_FOUND, http: 404, condition: "Captain id does not exist" }
  - { id: ERR_MATE_NOT_FOUND, http: 404, condition: "Mate id does not exist" }
  - { id: ERR_PERMIT_NOT_FOUND, http: 404, condition: "Permit id does not exist" }
  - { id: ERR_CHARTER_NOT_FOUND, http: 404, condition: "Charter id does not exist" }
  - { id: ERR_BOOKING_NOT_FOUND, http: 404, condition: "Booking id does not exist" }
  - { id: ERR_SLOT_NOT_FOUND, http: 404, condition: "DockSlot id does not exist" }
  - { id: ERR_RESERVATION_NOT_FOUND, http: 404, condition: "SlotReservation id does not exist" }
  - { id: ERR_ADDON_NOT_FOUND, http: 404, condition: "AddOnLine id does not exist" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Customer id does not exist" }
  - { id: ERR_CATCH_REPORT_NOT_FOUND, http: 404, condition: "CatchReport id does not exist" }
  # --- request validation ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/typed-wrong field, enum out of range, or bound violated (party_size < 1, return_at <= depart_at, released_count > fish_count, etc.)" }
  # --- state ---
  - { id: ERR_CHARTER_NOT_SCHEDULED, http: 409, condition: "Operation requires Charter in SCHEDULED" }
  - { id: ERR_CHARTER_NOT_ON_HOLD, http: 409, condition: "Reschedule requires Charter in WEATHER_HOLD" }
  - { id: ERR_CHARTER_NOT_SAILED, http: 409, condition: "Settle requires Charter in SAILED" }
  - { id: ERR_CHARTER_NOT_CANCELLABLE, http: 409, condition: "Cancel requires Charter in {DRAFT, SCHEDULED, WEATHER_HOLD}" }
  - { id: ERR_CHARTER_NOT_BOOKABLE, http: 409, condition: "pay-deposit requires Charter in {DRAFT, SCHEDULED}" }
  - { id: ERR_CHARTER_ALREADY_SAILED, http: 409, condition: "Booking cancel requires Charter not yet SAILED/SETTLED" }
  - { id: ERR_BOOKING_NOT_RESERVED, http: 409, condition: "pay-deposit requires Booking in RESERVED" }
  - { id: ERR_BOOKING_NOT_CANCELLABLE, http: 409, condition: "Booking cancel requires Booking in {RESERVED, CONFIRMED}" }
  - { id: ERR_ADDON_BOOKING_NOT_FULFILLABLE, http: 409, condition: "AddOnLine fulfill requires its Booking in {CONFIRMED, SETTLED}" }
  - { id: ERR_DEPART_TIME_NOT_REACHED, http: 409, condition: "Sail requires current clock >= depart_at" }
  - { id: ERR_NO_BOOKINGS_TO_SAIL, http: 409, condition: "Sail requires seats_booked >= 1" }
  - { id: ERR_CREW_NOT_LOCKED, http: 409, condition: "Sail requires every CrewAssignment LOCKED" }
  - { id: ERR_NO_CAPTAIN_ASSIGNED, http: 409, condition: "Schedule requires a TENTATIVE CAPTAIN assignment with captain_id" }
  - { id: ERR_NO_MATE_ASSIGNED, http: 409, condition: "Schedule of OFFSHORE requires a MATE assignment with mate_id" }
  - { id: ERR_NO_SLOT_RESERVED, http: 409, condition: "Schedule requires a HELD/OCCUPIED SlotReservation for the charter" }
  - { id: ERR_PERMIT_REQUIRED, http: 409, condition: "Schedule of OFFSHORE requires charter.permit_id present" }
  - { id: ERR_BOAT_NOT_IN_SERVICE, http: 409, condition: "Schedule requires Boat IN_SERVICE" }
  - { id: ERR_MARINA_NOT_OPEN, http: 409, condition: "Schedule/slot-reserve requires Marina OPEN" }
  # --- referential ---
  - { id: ERR_CROSS_MARINA_MISMATCH, http: 409, condition: "Boat/captain/mate/slot marina_id differs from charter.marina_id, or permit_kind mismatches trip_type" }
  # --- safety ---
  - { id: ERR_CAPTAIN_UNQUALIFIED, http: 422, condition: "Captain SUSPENDED or license grade below trip_type requirement" }
  - { id: ERR_CREDENTIAL_EXPIRED_FOR_DATE, http: 422, condition: "Captain license or permit lapses on/before the charter sail date" }
  - { id: ERR_MATE_NOT_OFFSHORE_CERTIFIED, http: 422, condition: "OFFSHORE charter mate not certified_offshore" }
  - { id: ERR_BOAT_NOT_OFFSHORE_RATED, http: 422, condition: "OFFSHORE charter boat not offshore_rated" }
  - { id: ERR_SLOT_LENGTH_EXCEEDED, http: 422, condition: "boat.length_ft exceeds dock_slot.max_boat_length_ft" }
  - { id: ERR_BAG_LIMIT_EXCEEDED, http: 422, condition: "Settle: kept catch_total exceeds permit.daily_bag_limit" }
  # --- temporal ---
  - { id: ERR_SLOT_WINDOW_CONFLICT, http: 409, condition: "Slot window overlaps an existing HELD/OCCUPIED reservation under the turnaround buffer" }
  - { id: ERR_CAPTAIN_DOUBLE_BOOKED, http: 409, condition: "Captain already on a TENTATIVE/LOCKED assignment whose charter interval strictly overlaps this charter's interval (no buffer)" }
  # --- capacity / fiscal ---
  - { id: ERR_CAPACITY_EXCEEDED, http: 409, condition: "party_size + seats_booked > seats_total, or seats_total > boat.passenger_capacity" }
  - { id: ERR_DEPOSIT_UNDERPAID, http: 402, condition: "Deposit payment below deposit_due_cents" }
  # --- concurrency ---
  - { id: ERR_STALE_CHARTER_VERSION, http: 412, condition: "expected_charter_version != current Charter.version on booking/slot creation" }
  # --- slot decommission ---
  - { id: ERR_SLOT_DECOMMISSIONED, http: 409, condition: "Reservation attempted on a DECOMMISSIONED dock slot" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DockMaster
    description: "Owns marinas and dock-slot lifecycle; manages slot reservations and statuses"
    identity: "opaque"
    exclusive_operations:
      - "POST /marinas — create marina"
      - "POST /marinas/{id}/set-status — set marina status"
      - "POST /dock-slots — create slot"
      - "POST /dock-slots/{id}/decommission — decommission slot"
    shared_operations:
      - "POST /slot-reservations — reserve a slot (with FleetManager)"
      - "POST /customers — create customer"
      - "GET endpoints — read marinas, slots, boats, charters, reservations, catch reports"
      - "POST /_clock/set_current_utc — test clock"

  - name: FleetManager
    description: "Owns boats, crew, permits, and the charter lifecycle (schedule/reschedule/settle/cancel)"
    identity: "opaque"
    exclusive_operations:
      - "POST /boats, POST /boats/{id}/set-status"
      - "POST /captains, POST /captains/{id}/set-status, POST /mates, POST /permits"
      - "POST /charters — create charter"
      - "POST /charters/{id}/schedule, /reschedule, /settle, /cancel"
      - "POST /crew-assignments — assign crew"
      - "POST /add-on-lines/{id}/fulfill — fulfill add-on"
    shared_operations:
      - "POST /slot-reservations — reserve a slot (with DockMaster)"
      - "POST /bookings, POST /bookings/{id}/pay-deposit, POST /bookings/{id}/cancel — act for customers"
      - "POST /add-on-lines — add add-on"
      - "POST /customers — create customer"
      - "GET endpoints — read all"
      - "POST /_clock/set_current_utc — test clock"

  - name: Captain
    description: "Reports catch, calls weather holds, and sails/departs the boat"
    identity: "entity_backed:Captain"
    exclusive_operations:
      - "POST /charters/{id}/weather-hold — call weather hold"
      - "POST /charters/{id}/sail — depart"
      - "POST /catch-reports — file catch report"
    shared_operations:
      - "GET endpoints — read marinas, charters, crew, catch reports, permits"

  - name: Customer
    description: "Books seats, pays deposits, cancels, adds gear/bait, tips"
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "POST /bookings — create own booking"
      - "POST /bookings/{id}/pay-deposit — pay own deposit"
      - "POST /bookings/{id}/cancel — cancel own booking"
      - "POST /add-on-lines — add add-on to own booking"
      - "POST /customers — self-register"
      - "GET endpoints — read marinas, boats, charters, own bookings, add-ons"
