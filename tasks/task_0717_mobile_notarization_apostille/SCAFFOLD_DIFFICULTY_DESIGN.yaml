              as: CoordinatorOps
              captures: { not_id: $.data.id }
            - call: "POST /notary/signers"
              payload: { account_id: "${acct_id}", full_name: "Sam", email: "s@x.com", id_doc_type: "PASSPORT" }
              as: CoordinatorOps
              captures: { signer_id: $.data.id }
            - call: "POST /notary/requests"
              payload: { account_id: "${acct_id}", signer_id: "${signer_id}", state_code: "CA", doc_category: "LOAN_SIGNING", delivery_mode: "MOBILE", expected_stamp_count: 1 }
              as: CoordinatorOps
              captures: { req_id: $.data.id }
          trigger:
            - call: "POST /notary/id-verifications"
              payload: { request_id: "${req_id}", signer_id: "${signer_id}", kba_score: 70, credential_score: 90, biometric_score: 60 }
              as: Notary
              as_user_id: "${not_id}"
              captures: { idv_id: $.data.id, score: $.data.trust_score }
          assert:
            - "IdVerification.${idv_id}.trust_score == 75.00"
            - "IdVerification.${idv_id}.outcome == PASS"
            - "IdVerification.${idv_id}.trust_variant == ENHANCED"

      - name: quote_empty_document_set_rejected
        grounds:
          - validations[priority=6]
          - state_machines.SigningRequest.DRAFT_to_QUOTED
          - errors[ERR_NO_DOCUMENTS]
        distinguishing_aspect: "Empty-collection boundary on a different metric/endpoint: a DRAFT request with zero RequestDocuments rejected at POST /requests/{id}/quote with ERR_NO_DOCUMENTS, distinct from the numeric trust-score threshold."
        test_recipe:
          setup:
            - "DRAFT request with no documents added. FeeSchedule exists for the state."
          setup_api_calls:
            - call: "POST /notary/fee-schedules"
              payload: { state_code: "CA", per_stamp_cents: 1500, travel_base_cents: 4000, travel_per_mile_cents: 100, ron_surcharge_cents: 2500, state_cap_cents: 20000 }
