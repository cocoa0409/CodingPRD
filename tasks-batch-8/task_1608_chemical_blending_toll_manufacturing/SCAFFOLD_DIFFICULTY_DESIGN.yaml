  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: tank_schedule_overlap_half_open_interval
        grounds:
          - validations[priority=11]
          - entities.BatchJob.fields.scheduled_start
          - entities.BatchJob.fields.scheduled_end
        distinguishing_aspect: |
          Interval semantics: half-open [scheduled_start, scheduled_end) on
          Tank as the shared resource. Adjacent windows (end == start) do NOT
          conflict; true overlaps do. Distinct from instance 2 (which uses
          PricingAgreement effective window with FULL-COVERAGE supersedes
          semantics — different adjacency and overlap geometry).
        test_recipe:
          setup:
            - "Customer C15, PA15 ACTIVE, R15 APPROVED, T15 CLEAN_VALIDATED, L15 lot"
            - "BJ15_a released on T15 with window [2026-11-05T08:00, 2026-11-05T12:00)"
            - "BJ15_b created with overlapping window [2026-11-05T10:00, 2026-11-05T14:00)"
            - "BJ15_c created with adjacent window [2026-11-05T12:00, 2026-11-05T16:00) — should be ALLOWED (but tank still RESERVED until BJ15_a completes; the rule says 'no other non-terminal batch with overlapping window AND tank_id same'; BJ15_a is non-terminal; its window ends at 12:00, BJ15_c starts at 12:00 — half-open means no overlap. But Tank.operational_state==RESERVED blocks release. So we need to cancel/complete BJ15_a first, or use a separate tank. Simpler: BJ15_b should fail with ERR_TANK_SCHEDULE_OVERLAP (proves half-open overlap detection), and we test BJ15_c adjacency in the corner file.)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /toll-operations/customers"
              payload: { legal_name: "Xi Polymers" }
              as: QualityManager
              captures: { c15: $.data.id }
            - call: "POST /toll-operations/customers/${c15}/raw-material-lots"
              payload: { material_code: "POLY", ghS_class: "NON_HAZ", quantity_kg_received: 1000, storage_zone: "Z_GENERAL", received_at: "2026-08-02T08:00:00Z" }
              as: BatchScheduler
            - call: "POST /toll-operations/recipes"
              payload: { name: "Poly Blend", revision: 1, customer_id: "${c15}", target_density_kg_per_l: 1.05, theoretical_yield_pct: 96, components: [{ material_code: "POLY", mass_fraction_pct: 100.000, charge_order: 1 }] }
              as: QualityManager
              captures: { r15: $.data.id }
            - call: "POST /toll-operations/recipes/${r15}/approve"
              payload: {}
              as: QualityManager
            - call: "POST /toll-operations/customers/${c15}/pricing-agreements"
              payload: { pricing_mode: "TOLLING_FEE", tolling_base_fee_cents: 100, tolling_per_kg_cents: 1, formulated_price_per_kg_cents: 0, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: QualityManager
              captures: { pa15: $.data.id, pa15_v: $.data.version }
            - call: "POST /toll-operations/customers/${c15}/pricing-agreements/${pa15}/activate"
              payload: { expected_pricing_agreement_version: "${pa15_v}" }
              as: QualityManager
            - call: "POST /toll-operations/tanks"
              payload: { tank_code: "TK-1501", capacity_l: 500, working_capacity_l: 500, current_zone: "Z_GENERAL" }
              as: QualityManager
              captures: { t15: $.data.id }
            - call: "POST /toll-operations/tanks/${t15}/cleaning-records"
              payload: { method: "DRY_PURGE", started_at: "2026-08-02T08:00:00Z", completed_at: "2026-08-02T09:00:00Z", residue_ppm: 0 }
              as: TankOperator
              captures: { cr15: $.data.id }
            - call: "POST /toll-operations/tanks/${t15}/cleaning-records/${cr15}/submit"
              payload: {}
              as: TankOperator
            - call: "POST /toll-operations/tanks/${t15}/cleaning-records/${cr15}/validate"
              payload: { decision: "PASS" }
              as: QAValidator
            - call: "POST /toll-operations/customers/${c15}/batch-jobs"
              payload: { recipe_id: "${r15}", pricing_agreement_id: "${pa15}", tank_id: "${t15}", batch_size_l: 100, scheduled_start: "2026-11-05T08:00:00Z", scheduled_end: "2026-11-05T12:00:00Z" }
              as: BatchScheduler
              captures: { bj15_a: $.data.id, bj15_a_v: $.data.version }
            - call: "POST /toll-operations/customers/${c15}/batch-jobs/${bj15_a}/release"
              payload: { expected_batch_job_version: "${bj15_a_v}" }
              as: BatchScheduler
            - call: "POST /toll-operations/customers/${c15}/batch-jobs"
              payload: { recipe_id: "${r15}", pricing_agreement_id: "${pa15}", tank_id: "${t15}", batch_size_l: 100, scheduled_start: "2026-11-05T10:00:00Z", scheduled_end: "2026-11-05T14:00:00Z" }
              as: BatchScheduler
              captures: { bj15_b: $.data.id, bj15_b_v: $.data.version }
          trigger:
            - call: "POST /toll-operations/customers/${c15}/batch-jobs/${bj15_b}/release"
              payload: { expected_batch_job_version: "${bj15_b_v}" }
              as: BatchScheduler
              captures: { err_id: $.data.error_id }
          assert:
            - "POST /release on BJ15_b returns error_id == ERR_TANK_SCHEDULE_OVERLAP (windows [08:00,12:00) and [10:00,14:00) overlap)"
            - "BatchJob.${bj15_b}.status == INTAKE (unchanged)"

      - name: pricing_agreement_window_overlap_supersede_semantics
        grounds:
          - validations[priority=12]
          - state_machines.PricingAgreement.ACTIVE_to_SUPERSEDED
        distinguishing_aspect: |
          Interval semantics: PricingAgreement effective [from, to) window on
          Customer as the resource, but with a special overlap rule — full
          coverage supersedes (new window covers old) while partial overlap
          is rejected. Different geometry from instance 1's half-open
          no-coverage overlap rule on Tank.
        test_recipe:
          setup:
            - "Customer C16 with PA16_old ACTIVE [2026-08-01, 2026-09-30)"
            - "PA16_new DRAFT with window [2026-07-01, 2026-12-31) — fully covers PA16_old"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /toll-operations/customers"
              payload: { legal_name: "Omicron Paints" }
              as: QualityManager
              captures: { c16: $.data.id }
            - call: "POST /toll-operations/customers/${c16}/pricing-agreements"
              payload: { pricing_mode: "TOLLING_FEE", tolling_base_fee_cents: 100, tolling_per_kg_cents: 1, formulated_price_per_kg_cents: 0, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-30T00:00:00Z" }
              as: QualityManager
              captures: { pa16_old: $.data.id, pa16_old_v: $.data.version }
            - call: "POST /toll-operations/customers/${c16}/pricing-agreements/${pa16_old}/activate"
              payload: { expected_pricing_agreement_version: "${pa16_old_v}" }
              as: QualityManager
            - call: "POST /toll-operations/customers/${c16}/pricing-agreements"
              payload: { pricing_mode: "FORMULATED_PRICE", tolling_base_fee_cents: 0, tolling_per_kg_cents: 0, formulated_price_per_kg_cents: 250, over_yield_split_pct: 50, effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: QualityManager
              captures: { pa16_new: $.data.id, pa16_new_v: $.data.version }
          trigger:
            - call: "POST /toll-operations/customers/${c16}/pricing-agreements/${pa16_new}/activate"
              payload: { expected_pricing_agreement_version: "${pa16_new_v}" }
              as: QualityManager
              captures: { pa16_new_status: $.data.status }
          assert:
            - "PricingAgreement.${pa16_new}.status == ACTIVE (fully covers old, supersedes it)"
            - "PricingAgreement.${pa16_old}.status == SUPERSEDED (cascade)"
            - "PricingAgreement.${pa16_old}.version advanced by 1 due to cascade"

