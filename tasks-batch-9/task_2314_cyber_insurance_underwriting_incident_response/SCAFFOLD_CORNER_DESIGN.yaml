      - name: control_requirement_is_immutable_with_no_update_endpoint_and_no_version
        claim_type: immutability
        grounds:
          - entities.ControlRequirement
          - endpoints[GET /cyber/control-requirements]
        distinguishing_aspect: |
          ControlRequirement is declared common_fields false: the §1.5 surface exposes only POST and GET
          for /cyber/control-requirements, and the returned row carries no version field to update.
        test_recipe:
          setup:
            - "Two catalog rows created at the default clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cyber/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/control-requirements"
              payload: { control_key: "MFA_PRIVILEGED", min_level_required: "FULL", weight: 30, is_mandatory: true }
              as: Underwriter
              as_user_id: "u-underwriter-1"
              captures: { cr_a_id: "$.data.id" }
            - call: "POST /cyber/control-requirements"
              payload: { control_key: "OFFLINE_BACKUPS", min_level_required: "FULL", weight: 25, is_mandatory: true }
              as: Underwriter
              as_user_id: "u-underwriter-1"
          trigger:
            - call: "GET /cyber/control-requirements"
              payload: { limit: 10, offset: 0 }
              as: Underwriter
              as_user_id: "u-underwriter-1"
          assert:
            - "the response status is 200 with total_count == 2"
            - "no returned ControlRequirement row exposes a version field"
            - "the rows are ordered by weight DESC then control_key ASC, so MFA_PRIVILEGED (30) precedes OFFLINE_BACKUPS (25)"
            - "§1.5 declares no PATCH, PUT or DELETE endpoint for /cyber/control-requirements, so ControlRequirement.${cr_a_id} cannot be amended"
