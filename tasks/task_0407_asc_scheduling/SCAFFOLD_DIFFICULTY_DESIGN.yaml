              as: Scheduler
              captures: { blk_id: $.data.id }
            - call: "POST /asc/surgeon-blocks/${blk_id}/confirm"
              payload: {}
              as: Scheduler
              captures: { st1: $.data.status }
          trigger:
            - call: "POST /asc/surgeon-blocks/${blk_id}/release"
              payload: {}
              as: Scheduler
              captures: { st2: $.data.status }
          assert:
            - "SurgeonBlock.${blk_id}.status == RELEASED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: block_release_cascades_to_case_implant_supply_depth3
        grounds:
          - state_machines.SurgeonBlock.CONFIRMED_to_RELEASED
          - state_machines.SurgicalCase.SCHEDULED_to_CANCELLED
          - state_machines.CaseImplant.RESERVED_to_RELEASED
          - entities.SupplyItem.fields.reserved_qty
          - entities.SurgeonBlock.fields.committed_minutes
        distinguishing_aspect: |
          Depth >= 3 cascade from block release: release(block) -> force-cancel(case) ->
          release(implant) -> decrement(SupplyItem.reserved_qty). Item starts reserved_qty=3 after
          attach; after cascade reserved_qty returns to 0 and block committed_minutes returns to 0.
        test_recipe:
          setup:
            - "Facility/OR/surgeon/MAC-proc(60)/patient/day; block [480,600); one SCHEDULED case 480 with implant planned_qty=3 RESERVED (item on_hand 5 -> reserved_qty 3); block CONFIRMED."
