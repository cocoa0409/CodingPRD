  # =====================================================================
  # RULE 4 — transitive_cascade
  # Two instances with DIFFERENT triggers and DIFFERENT depths:
  # Cascade A is depth 5 and starts at an accreditation revocation;
  # Cascade B is depth 4 and starts at a recorded rating reduction.
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: accreditation_revocation_cascades_through_poa_claim_appointment_to_site_ledger
        grounds:
          - state_machines.Representative.ACTIVE_to_REVOKED
          - state_machines.PowerOfAttorney.ACTIVE_to_REVOKED
          - state_machines.Claim.EVIDENCE_DEVELOPMENT_to_DRAFT
          - state_machines.ExamAppointment.SCHEDULED_to_CANCELLED
          - calculations.exam_slot_ledger
          - calculations.active_poa_count_ledger
          - calculations.representative_caseload_weight
        distinguishing_aspect: |
          Depth-5 chain from ONE call: REVOKE sets Representative.accreditation_status REVOKED (hop 1)
          -> PowerOfAttorney REVOKED (hop 2) -> Claim falls back to DRAFT with poa_id null (hop 3)
          -> ExamAppointment CANCELLED with cancellation_reason REPRESENTATION_CASCADE (hop 4)
          -> ExamSite.booked_slot_count decremented from 1 to 0 (hop 5); the trigger is an accreditation
          revocation, distinct from the recorded-decision trigger of the other cascade instance.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z."
            - "Representative rep_a ACTIVE COUNTY_CVSO."
            - "Veteran vet with discharge VERIFIED, assigned_representative_id rep_a and intake_status ACTIVE."
            - "PowerOfAttorney poa designating rep_a, status ACTIVE, so rep_a.active_poa_count is 1."
            - "Claim claim_x in EVIDENCE_DEVELOPMENT citing poa."
            - "ExamSite site with concurrent_capacity 2 and buffer_minutes 15."
            - "ExamAppointment appt for claim_x at site on 2026-08-20T09:00 to 10:00, status SCHEDULED, so site.booked_slot_count is 1."
            - "rep_a.caseload_weight is 4 = POA_WEIGHT 1 + CLAIM_STAGE_WEIGHT[EVIDENCE_DEVELOPMENT] 3."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/representatives"
              payload: { full_name: "Dana Reyes", accreditation_number: "ACC-2849-081", accreditation_type: "COUNTY_CVSO", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
              captures: { rep_a: $.data.id }
            - call: "POST /cvso/representatives/${rep_a}/accreditation"
              payload: { action: "ACTIVATE" }
              as: SystemAdmin
            - call: "POST /cvso/exam-sites"
              payload: { name: "Northgate Contract Exam Center", county_code: "CVSO1", concurrent_capacity: 2, buffer_minutes: 15 }
              as: SystemAdmin
              captures: { site: $.data.id }
            - call: "POST /cvso/veterans"
              payload: { full_name: "Alex Rivera", date_of_birth: "1979-03-04", service_start_date: "2001-09-11", service_end_date: "2005-09-10", household_income_cents: 1500000, net_worth_cents: 2000000, dependent_count: 2, homeless_status: "NOT_HOMELESS", referral_source: "WALK_IN" }
              as: IntakeClerk
              captures: { vet: $.data.id }
            - call: "POST /cvso/veterans/${vet}/discharge-documents"
              payload: { document_type: "DD214", source: "VETERAN_PROVIDED", claimed_service_start: "2001-09-11", claimed_service_end: "2005-09-10", claimed_character_of_service: "HONORABLE" }
              as: IntakeClerk
              captures: { doc: $.data.id }
            - call: "POST /cvso/discharge-documents/${doc}/review"
              payload: { action: "VERIFY" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/veterans/${vet}/screen"
              payload: {}
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/veterans/${vet}/assign-representative"
              payload: { representative_id: "${rep_a}" }
              as: IntakeClerk
            - call: "POST /cvso/powers-of-attorney"
              payload: { veteran_id: "${vet}", representative_id: "${rep_a}", form_type: "VA_21_22", scope: "ALL_BENEFITS", executed_on: "2026-08-01" }
              as: IntakeClerk
              captures: { poa: $.data.id }
            - call: "GET /cvso/veterans/${vet}"
              payload: {}
              as: IntakeClerk
              captures: { vet_v: $.data.version }
            - call: "POST /cvso/powers-of-attorney/${poa}/accept"
              payload: { expected_veteran_version: "${vet_v}" }
              as: VeteranClient
              as_user_id: "${vet}"
            - call: "POST /cvso/claims"
              payload: { veteran_id: "${vet}", poa_id: "${poa}", claim_type: "DISABILITY_COMPENSATION", claimed_conditions: ["tinnitus"] }
              as: CountyOfficer
              as_user_id: "${rep_a}"
              captures: { claim_x: $.data.id }
            - call: "POST /cvso/claims/${claim_x}/transitions"
              payload: { action: "OPEN_EVIDENCE_DEVELOPMENT" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/exam-appointments"
              payload: { claim_id: "${claim_x}", exam_site_id: "${site}", starts_at: "2026-08-20T09:00:00.000Z", ends_at: "2026-08-20T10:00:00.000Z" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
              captures: { appt: $.data.id }
            - call: "GET /cvso/representatives/${rep_a}/caseload"
