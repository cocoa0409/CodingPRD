  - section: validations
    instances:
      - name: unauthenticated_missing_role_header
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Request without X-User-Role fails ERR_UNAUTHENTICATED (401) before any role check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /rights/assets"
              payload: {}
              as: __NO_ROLE_HEADER__
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_UNAUTHENTICATED"

      - name: existence_checked_before_state
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=5]"]
        distinguishing_aspect: "advance on a non-existent request id returns ERR_NOT_FOUND even though the payload version came from a real request — existence (p3) precedes OCC/state (p4/p5)."
        test_recipe:
          setup: ["One real request exists; its captured version is reused against a DIFFERENT, non-existent request id"]
          setup_api_calls:
            - call: "POST /rights/rights-holders"
              payload: { legal_name: "Exist House", holder_kind: LABEL, mfn_floor_cents: 100 }
              as: AssetCurator
              captures: { holder_id: $.data.id }
            - call: "POST /rights/assets"
              payload: { title: "Exist Asset", work_kind: FILM_CLIP, permitted_media: [STREAMING], rights_holder_id: "${holder_id}" }
              as: AssetCurator
              captures: { asset_id: $.data.id }
            - call: "POST /rights/assets/${asset_id}/clearance-requests"
              payload: { media: STREAMING, territory: NA, use_start_at: "2026-09-01T00:00:00Z", use_end_at: "2026-11-01T00:00:00Z", requested_units: 1 }
              as: Requester
              as_user_id: req_c_40
              captures: { some_v: $.data.version }
          trigger:
            - call: "POST /rights/clearance-requests/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/advance"
              payload: { expected_clearance_version: "${some_v}" }
              as: ClearanceOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_NOT_FOUND"

