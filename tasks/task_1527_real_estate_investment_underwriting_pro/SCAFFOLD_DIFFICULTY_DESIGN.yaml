              payload: { period_month: "2026-06", occupied_units: 1, total_units: 3, gross_potential_rent_cents: 300000, collected_rent_cents: 100000, source_doc_ref: "rr" }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "GET /re-underwriting/properties/${prop_id}"
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { occ: $.data.occupancy_pct }
          assert:
            - "Property.occupancy_pct == 33.33 (round_half_up of 1/3 * 100 = 33.3333... to 2 decimals)"
            - "Boundary exercised at exact 1/3 fraction; different metric and endpoint from quorum boundary"

