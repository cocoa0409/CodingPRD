      - name: corner_optional_consortium_and_schedule_links_must_resolve
        claim_type: cross_reference_link
        grounds:
          - endpoints["POST /host-agency/advisors"]
          - endpoints["POST /host-agency/advisors/{id}/agreements"]
          - errors[ERR_CONSORTIUM_NOT_FOUND]
          - errors[ERR_SPLIT_SCHEDULE_NOT_FOUND]
        distinguishing_aspect: "Two link-bearing creates require the referenced row to exist even though one of them is optional: an unknown consortium_id on advisor creation returns 404 ERR_CONSORTIUM_NOT_FOUND, an unknown split_schedule_id on agreement creation returns 404 ERR_SPLIT_SCHEDULE_NOT_FOUND, and once the real ids are used the reverse lookups GET /host-agency/advisors?consortium_id= and GET /host-agency/advisor-agreements?split_schedule_id= both find the new row."
        test_recipe:
          setup:
            - "One consortium (Voyage Alliance) and one split schedule; MISSING_ID is 00000000-0000-4000-8000-000000000000."
          setup_api_calls:
            - call: "POST /host-agency/consortiums"
              payload: { name: "Voyage Alliance", membership_fee_cents: 50000, marketing_fund_accrual_pct: 0.02, consortium_channel_bonus_pct: 0.01 }
              as: HostOperations
              captures: { con_id: $.data.id }
            - call: "POST /host-agency/split-schedules"
              payload: { name: "Standard 2026", tiers: [{ tier_level: 1, min_production_cents: 0, advisor_pct: 0.70 }, { tier_level: 2, min_production_cents: 5000000, advisor_pct: 0.80 }], platform_fee_tiers: [{ min_share_cents: 0, fee_pct: 0.05 }], chargeback_retention_pct: 0.10 }
              as: HostOperations
              captures: { sched_id: $.data.id }
          trigger:
            - call: "POST /host-agency/advisors"
              payload: { legal_name: "Ghost Member", email: "ghost.member@example.com", seller_of_travel_state: "NY", consortium_id: "00000000-0000-4000-8000-000000000000" }
