            - "trigger[1]: 409 with data.error_id == ERR_STREAM_SOURCE_MISMATCH (MAJOR_GIFT forbids member_id)"
            - "trigger[2]: 409 with data.error_id == ERR_STREAM_SOURCE_MISMATCH (SYNDICATION requires collaboration_id)"
            - "trigger[3]: 201 with revenue_stream == MAJOR_GIFT, funder_id == ${f_id} and member_id == null"

      - name: val_refund_is_frozen_once_the_gift_has_been_publicly_disclosed
        claim_type: Conditional validation
        grounds:
          - validations[priority=53]
          - errors[ERR_REFUND_WINDOW_CLOSED]
          - state_machines.Contribution.RECEIPTED_to_DISCLOSED
        distinguishing_aspect: >-
          The refund window is keyed on acknowledgment_status, not settlement_status: a
          RECEIPTED settled contribution refunds cleanly while a DISCLOSED one of the same
          amount is frozen.
        test_recipe:
          setup: "An ACTIVE member with two settled 2500-cent membership contributions, one DISCLOSED and one merely RECEIPTED."
          setup_api_calls:
            - call: "POST /fiscal-periods"
              payload: { label: "FY2027", start_date: "2026-08-01", end_date: "2027-07-31", monthly_expense_base_cents: 200000, reserve_balance_cents: 500000 }
              as: FinanceController
              as_user_id: user-fc-1
              captures: { fp_id: "$.data.id" }
            - call: "POST /membership-tiers"
              payload: { tier_code: "SUSTAINER", name: "Sustainer", renewal_cadence: "MONTHLY", contribution_amount_cents: 2500, benefits: [] }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { tier_id: "$.data.id" }
            - call: "POST /membership-tiers/${tier_id}/publish"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: user-do-1
            - call: "POST /members"
              payload: { tier_id: "${tier_id}", email: "ana@example.org", full_name: "Ana Ruiz" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { m_id: "$.data.id" }
            - call: "POST /contributions"
              payload: { fiscal_period_id: "${fp_id}", revenue_stream: "MEMBERSHIP", amount_cents: 2500, received_date: "2026-08-01", member_id: "${m_id}" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { c1: "$.data.id" }
            - call: "POST /contributions/${c1}/settlement"
              payload: { outcome: "SETTLED" }
              as: FinanceController
              as_user_id: user-fc-1
            - call: "POST /contributions/${c1}/acknowledge"
              payload: { disclose_publicly: false }
              as: DevelopmentOfficer
              as_user_id: user-do-1
            - call: "POST /contributions/${c1}/acknowledge"
              payload: { disclose_publicly: true }
              as: DevelopmentOfficer
              as_user_id: user-do-1
            - call: "POST /contributions"
              payload: { fiscal_period_id: "${fp_id}", revenue_stream: "MEMBERSHIP", amount_cents: 2500, received_date: "2026-08-02", member_id: "${m_id}" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { c2: "$.data.id" }
            - call: "POST /contributions/${c2}/settlement"
              payload: { outcome: "SETTLED" }
              as: FinanceController
              as_user_id: user-fc-1
            - call: "POST /contributions/${c2}/acknowledge"
              payload: { disclose_publicly: false }
              as: DevelopmentOfficer
              as_user_id: user-do-1
          trigger:
