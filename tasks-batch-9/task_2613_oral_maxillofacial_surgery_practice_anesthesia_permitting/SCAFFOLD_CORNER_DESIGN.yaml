        distinguishing_aspect: "The dose comparison is strictly greater-than: a CBCT_SMALL_FOV study at exactly 250.0 mGy*cm2 is WITHIN_PROTOCOL while 250.1 is ABOVE_REFERENCE_LEVEL, and the flag never blocks the upload."
