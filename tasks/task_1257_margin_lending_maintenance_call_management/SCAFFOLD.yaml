scenario: |
  generate task hard than expert level! 1257. Margin Lending & Maintenance Call Management (retail brokerage margin department): margin account approval & initial requirement, real-time equity calculation & house vs regulatory maintenance, call issuance & cure deadline, liquidation decision & position selection, concentrated position & special margin requirements, interest accrual & rate tiers, day-trading & pattern flag handling, dispute & customer communication

domain_name: margin-lending
api_prefix: /margin

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency
    - scheduled_actions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# All money integer cents; rates/thresholds integer basis points (bps);
# prices integer cents per share. Ratio comparisons use cross-multiplied
# integer arithmetic (a*b vs c*d), never floats.
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Customer legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across customers" }

  - name: AccountApplication
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; applicant" }
      - { name: annual_income_cents, type: integer, source: input, description: "Declared annual income, cents" }
      - { name: liquid_net_worth_cents, type: integer, source: input, description: "Declared liquid net worth, cents" }
      - { name: investment_experience_years, type: integer, source: input, description: "Years of trading experience" }
      - { name: application_status, type: enum, source: system, description: "SUBMITTED | COMPLIANCE_REVIEW | APPROVED | REJECTED" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of reviewing MarginAnalyst; null until reviewed" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of deciding MarginSupervisor; null until decided" }
      - { name: rejection_reason, type: string, source: input, description: "Reason recorded on reject; null otherwise" }
      - { name: account_id, type: string, source: system, description: "FK -> MarginAccount.id; set on approval, null before" }

  - name: MarginAccount
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; owning customer" }
      - { name: application_id, type: string, source: system, description: "FK -> AccountApplication.id; approving application" }
      - { name: account_status, type: enum, source: system, description: "ACTIVE | RESTRICTED | CLOSED" }
      - { name: cash_balance_cents, type: integer, source: computed, description: "Ledger cash; negative = debit balance; mutated by movements, fills, interest posts, liquidation proceeds" }
      - { name: equity_realtime_cents, type: integer, source: computed, description: "cash + sum(long MV realtime) - sum(|short MV realtime|)" }
      - { name: equity_official_cents, type: integer, source: computed, description: "Same formula on OFFICIAL_CLOSE marks; basis for call evaluation" }
      - { name: reg_req_official_cents, type: integer, source: computed, description: "Regulatory maintenance requirement on official marks (2500bps long / 3000bps short)" }
      - { name: house_req_official_cents, type: integer, source: computed, description: "House maintenance requirement on official marks incl. concentration add-ons" }
      - { name: reg_req_realtime_cents, type: integer, source: computed, description: "Regulatory maintenance requirement on realtime marks" }
      - { name: house_req_realtime_cents, type: integer, source: computed, description: "House maintenance requirement on realtime marks" }
      - { name: buying_power_cents, type: integer, source: computed, description: "PDT: max(0, 4*(equity_rt - max(reg_req_rt, house_req_rt))); else max(0, 2*(equity_rt - 5000bps*gross|MV|_rt))" }
      - { name: pdt_flag, type: boolean, source: computed, default: false, description: "Pattern day trader flag; set/cleared by daily sweep" }
      - { name: pdt_flagged_at, type: datetime, source: system, description: "When pdt_flag last flipped to true; null if never" }

  - name: SecurityProfile
    parent: null
    common_fields: true
    fields:
      - { name: symbol, type: string, source: input, description: "Ticker symbol; unique" }
      - { name: marginable, type: boolean, source: input, description: "Whether opening margin positions allowed" }
      - { name: house_maint_long_bps, type: integer, source: input, description: "House maintenance for longs, basis points" }
      - { name: house_maint_short_bps, type: integer, source: input, description: "House maintenance for shorts, basis points" }
      - { name: liquidity_tier, type: integer, source: input, description: "1=most liquid; liquidation selector ranking key (ASC)" }
      - { name: concentration_threshold_bps, type: integer, source: input, description: "Position share of gross long MV above which add-ons apply (strictly greater)" }

  - name: Position
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> MarginAccount.id; holder" }
      - { name: security_id, type: string, source: input, description: "FK -> SecurityProfile.id; instrument" }
      - { name: quantity, type: integer, source: computed, description: "Signed shares: >0 long, <0 short" }
      - { name: avg_cost_cents, type: integer, source: computed, description: "Average acquisition price per share of current open quantity" }
      - { name: mv_realtime_cents, type: integer, source: computed, description: "quantity * latest REALTIME mark price" }
      - { name: mv_official_cents, type: integer, source: computed, description: "quantity * latest OFFICIAL_CLOSE mark price" }
      - { name: reserved_qty, type: integer, source: computed, description: "Shares reserved by non-terminal liquidation orders" }
      - { name: opened_at, type: datetime, source: system, description: "Clock time quantity last transitioned 0 -> non-zero; liquidation tie-break key (ASC)" }
      - { name: today_bought_qty, type: integer, source: computed, description: "Shares bought on position.last_trade_date; lazily reset on first fill of a new date" }
      - { name: today_sold_qty, type: integer, source: computed, description: "Shares sold on position.last_trade_date; lazily reset likewise" }
      - { name: last_trade_date, type: string, source: system, description: "ISO date of last fill affecting day counters; null before first fill" }

  - name: TradeFill
    parent: null
    common_fields: false
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> MarginAccount.id" }
      - { name: security_id, type: string, source: system, description: "FK -> SecurityProfile.id" }
      - { name: side, type: enum, source: system, description: "BUY | SELL | SELL_SHORT | BUY_TO_COVER" }
      - { name: quantity, type: integer, source: system, description: "Filled shares (positive)" }
      - { name: price_cents, type: integer, source: system, description: "Execution price (latest REALTIME mark at order time)" }
      - { name: fill_date, type: string, source: system, description: "ISO calendar date of fill from logical clock" }
      - { name: is_day_trade, type: boolean, source: system, description: "True when fill closes shares opened the same fill_date" }

  - name: DayTradeEvent
    parent: null
    common_fields: false
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> MarginAccount.id" }
      - { name: security_id, type: string, source: system, description: "FK -> SecurityProfile.id" }
      - { name: event_date, type: string, source: system, description: "ISO calendar date; at most one event per (account, security, date)" }

  - name: PriceMark
    parent: null
    common_fields: false
    fields:
      - { name: security_id, type: string, source: input, description: "FK -> SecurityProfile.id" }
      - { name: mark_type, type: enum, source: input, description: "REALTIME | OFFICIAL_CLOSE" }
      - { name: price_cents, type: integer, source: input, description: "Marked price per share, cents" }
      - { name: marked_at, type: datetime, source: system, description: "Logical clock time when mark posted" }

  - name: MarginCall
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> MarginAccount.id" }
      - { name: call_type, type: enum, source: system, description: "FED_REG_T | MAINTENANCE | HOUSE | DAY_TRADE_MIN_EQUITY" }
      - { name: call_status, type: enum, source: system, description: "OPEN | DISPUTED | EXPIRED | LIQUIDATION_IN_PROGRESS | CURED | WAIVED" }
      - { name: call_amount_cents, type: integer, source: computed, description: "Amount required to cure; MAINTENANCE = max(reg deficiency, house deficiency); HOUSE = house deficiency; FED_REG_T = initial deficiency; DTME = 2,500,000 - equity_official" }
      - { name: issued_at, type: datetime, source: system, description: "Clock time of issuance" }
      - { name: due_at, type: datetime, source: system, description: "issued_at + deadline hours by type: FED_REG_T 96h, MAINTENANCE 72h, HOUSE 48h, DAY_TRADE_MIN_EQUITY 120h" }
      - { name: resolved_at, type: datetime, source: system, description: "Clock time of terminal transition; null while non-terminal" }
      - { name: cure_method, type: enum, source: system, description: "DEPOSIT | MARKET_RECOVERY | LIQUIDATION | WAIVER; null until resolved" }

  - name: LiquidationOrder
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> MarginAccount.id" }
      - { name: call_id, type: string, source: input, description: "FK -> MarginCall.id; expired call being covered" }
      - { name: position_id, type: string, source: system, description: "FK -> Position.id; selected by server selector policy" }
      - { name: quantity, type: integer, source: system, description: "Shares to liquidate (entire selected position, all-or-nothing per position)" }
      - { name: filled_quantity, type: integer, source: computed, description: "Cumulative filled shares" }
      - { name: proceeds_cents, type: integer, source: computed, description: "Cumulative liquidation proceeds credited" }
      - { name: order_status, type: enum, source: system, description: "PENDING | PARTIALLY_FILLED | EXECUTED | CANCELLED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creating LiquidationDesk user" }
      - { name: last_filled_by_user_id, type: string, source: system, description: "X-User-ID of most recent filler; null until first fill" }

  - name: CashMovement
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> MarginAccount.id" }
      - { name: movement_type, type: enum, source: input, description: "DEPOSIT | WITHDRAWAL | JOURNAL_CREDIT | JOURNAL_DEBIT" }
      - { name: amount_cents, type: integer, source: input, description: "Positive amount, cents" }
      - { name: resulting_cash_balance_cents, type: integer, source: computed, description: "Account cash_balance_cents immediately after applying" }

  - name: InterestLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> MarginAccount.id" }
      - { name: entry_type, type: enum, source: system, description: "DAILY_ACCRUAL | MONTHLY_POST" }
      - { name: accrual_date, type: string, source: system, description: "ISO date the accrual covers (DAILY_ACCRUAL) or posting date (MONTHLY_POST)" }
      - { name: debit_balance_snapshot_cents, type: integer, source: system, description: "Debit balance (max(0, -cash)) at accrual time" }
      - { name: rate_bps_applied, type: integer, source: system, description: "Annual rate bps from the effective RateTier" }
      - { name: amount_cents, type: integer, source: system, description: "DAILY_ACCRUAL: round_half_up(debit * rate_bps / 10000 / 360); MONTHLY_POST: sum of that month's DAILY_ACCRUAL amounts" }
      - { name: posted, type: boolean, source: system, description: "True once included in a MONTHLY_POST" }

  - name: RateTier
    parent: null
    common_fields: true
    fields:
      - { name: tier_level, type: integer, source: input, description: "Tier rank; rate selected by highest tier_level whose min_balance_cents <= debit balance" }
      - { name: min_balance_cents, type: integer, source: input, description: "Inclusive lower debit bound for this tier" }
      - { name: annual_rate_bps, type: integer, source: input, description: "Annual interest rate, basis points, 360-day year" }
      - { name: effective_from, type: string, source: input, description: "ISO date, inclusive start of effective window (closed interval)" }
      - { name: effective_to, type: string, source: input, description: "ISO date, inclusive end; null = open-ended" }

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> MarginAccount.id" }
      - { name: call_id, type: string, source: input, description: "FK -> MarginCall.id; disputed call" }
      - { name: reason, type: string, source: input, description: "Customer's dispute narrative" }
      - { name: dispute_status, type: enum, source: system, description: "OPEN | UNDER_REVIEW | UPHELD | OVERTURNED | CLOSED" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "MarginAnalyst who opened review; null until UNDER_REVIEW" }
      - { name: decided_by_user_id, type: string, source: system, description: "MarginSupervisor who decided; null until decision" }
      - { name: decision, type: enum, source: system, description: "UPHELD | OVERTURNED; null until decided" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: AccountApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED]
    transitions:
      - from: SUBMITTED
        to: COMPLIANCE_REVIEW
        trigger: "POST /margin/account-applications/{id}/review"
        actor: MarginAnalyst
        preconditions:
          - "application_status == SUBMITTED (else ERR_APPLICATION_INVALID_STATE)"
        side_effects:
          - "reviewed_by_user_id := X-User-ID"
      - from: COMPLIANCE_REVIEW
        to: APPROVED
        trigger: "POST /margin/account-applications/{id}/approve"
        actor: MarginSupervisor
        preconditions:
          - "application_status == COMPLIANCE_REVIEW (else ERR_APPLICATION_INVALID_STATE)"
          - "X-User-ID != reviewed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "liquid_net_worth_cents >= 200000 AND investment_experience_years >= 1 (else ERR_SUITABILITY_NOT_MET)"
          - "no other MarginAccount exists for customer_id (else ERR_ACCOUNT_ALREADY_EXISTS)"
        side_effects:
          - "decided_by_user_id := X-User-ID"
          - "Create MarginAccount: customer_id, application_id, account_status=ACTIVE, cash=0, equities=0, requirements=0, buying_power=0, pdt_flag=false"
          - "account_id := new MarginAccount.id"
      - from: COMPLIANCE_REVIEW
        to: REJECTED
        trigger: "POST /margin/account-applications/{id}/reject"
        actor: MarginSupervisor
        preconditions:
          - "application_status == COMPLIANCE_REVIEW (else ERR_APPLICATION_INVALID_STATE)"
          - "X-User-ID != reviewed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "decided_by_user_id := X-User-ID; rejection_reason := input"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /margin/account-applications/{id}/resubmit"
        actor: Customer
        preconditions:
          - "application_status == REJECTED (else ERR_APPLICATION_INVALID_STATE)"
          - "X-User-ID == customer_id of application (ownership, else ERR_ACCOUNT_OWNERSHIP_MISMATCH)"
        side_effects:
          - "Optional financial fields updated from payload; reviewed_by_user_id and decided_by_user_id reset to null; rejection_reason reset to null"

  - entity: MarginAccount
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: RESTRICTED
        trigger: "system (margin call issued with call_status OPEN by POST /margin/market-marks OFFICIAL_CLOSE cascade or POST /_sweeps/daily)"
        actor: system
        preconditions:
          - "At least one MarginCall for this account transitions to OPEN"
        side_effects:
          - "Opening orders and withdrawals now rejected (ERR_ACCOUNT_RESTRICTED)"
      - from: RESTRICTED
        to: ACTIVE
        trigger: "system (last non-terminal MarginCall resolves: cure by deposit/market-recovery/liquidation, or waiver)"
        actor: system
        preconditions:
          - "Zero MarginCalls in OPEN, DISPUTED, EXPIRED, or LIQUIDATION_IN_PROGRESS for this account"
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /margin/accounts/{id}/close"
        actor: Customer
        preconditions:
          - "account_status == ACTIVE (else ERR_ACCOUNT_CLOSED)"
          - "All Positions have quantity == 0 (else ERR_POSITIONS_EXIST)"
          - "No non-terminal MarginCalls (else ERR_OPEN_CALLS_EXIST)"
          - "cash_balance_cents == 0 (else ERR_NONZERO_BALANCE)"
        side_effects: []
      - from: RESTRICTED
        to: CLOSED
        trigger: "POST /margin/accounts/{id}/close"
        actor: Customer
        preconditions:
          - "Same preconditions as ACTIVE -> CLOSED (restricted blocks close while calls open via ERR_OPEN_CALLS_EXIST)"
        side_effects: []

  - entity: MarginCall
    initial_state: OPEN
    terminal_states: [CURED, WAIVED]
    transitions:
      - from: OPEN
        to: CURED
        trigger: "system (deposit/journal credit cascade, official-mark recovery recompute, or liquidation fill brings binding official excess >= 0)"
        actor: system
        preconditions:
          - "Recomputed binding official maintenance excess >= 0 (for DTME: equity_official_cents >= 2500000)"
        side_effects:
          - "cure_method := DEPOSIT | MARKET_RECOVERY | LIQUIDATION per trigger; resolved_at := clock"
          - "Account posture recheck: if no non-terminal calls remain, account RESTRICTED -> ACTIVE"
      - from: OPEN
        to: EXPIRED
        trigger: "system (POST /_sweeps/daily when clock >= due_at)"
        actor: system
        preconditions:
          - "logical clock >= due_at"
        side_effects: []
      - from: OPEN
        to: DISPUTED
        trigger: "POST /margin/disputes (customer files against this call)"
        actor: Customer
        preconditions:
          - "call_status == OPEN (else ERR_CALL_NOT_OPEN)"
        side_effects:
          - "Dispute created with dispute_status OPEN"
          - "While DISPUTED, daily sweep does NOT expire the call (deadline clock pauses)"
      - from: DISPUTED
        to: OPEN
        trigger: "POST /margin/disputes/{id}/decide with decision=UPHELD"
        actor: MarginSupervisor
        preconditions:
          - "linked dispute decided UPHELD"
        side_effects:
          - "due_at is NOT extended; if clock already past due_at, next daily sweep expires it"
      - from: DISPUTED
        to: WAIVED
        trigger: "POST /margin/disputes/{id}/decide with decision=OVERTURNED"
        actor: MarginSupervisor
        preconditions:
          - "linked dispute decided OVERTURNED"
        side_effects:
          - "cure_method := WAIVER; resolved_at := clock"
          - "Account posture recheck (RESTRICTED -> ACTIVE if last non-terminal call)"
      - from: OPEN
        to: WAIVED
        trigger: "POST /margin/margin-calls/{id}/waive"
        actor: MarginSupervisor
        preconditions:
          - "call_status == OPEN or EXPIRED (else ERR_CALL_NOT_OPEN)"
        side_effects:
          - "cure_method := WAIVER; resolved_at := clock; account posture recheck"
      - from: EXPIRED
        to: WAIVED
        trigger: "POST /margin/margin-calls/{id}/waive"
        actor: MarginSupervisor
        preconditions:
          - "call_status == OPEN or EXPIRED (else ERR_CALL_NOT_OPEN)"
        side_effects:
          - "cure_method := WAIVER; resolved_at := clock; account posture recheck"
      - from: EXPIRED
        to: LIQUIDATION_IN_PROGRESS
        trigger: "POST /margin/accounts/{id}/liquidation-orders"
        actor: LiquidationDesk
        preconditions:
          - "call_status == EXPIRED (else ERR_CALL_NOT_EXPIRED)"
        side_effects:
          - "LiquidationOrder created via selector policy; Position.reserved_qty += quantity"
      - from: LIQUIDATION_IN_PROGRESS
        to: CURED
        trigger: "system (liquidation fill cascade: binding official excess >= 0, or cumulative proceeds_cents across the call's orders >= call_amount_cents)"
        actor: system
        preconditions:
          - "Post-fill recompute satisfies either cure test"
        side_effects:
          - "cure_method := LIQUIDATION; resolved_at := clock; account posture recheck"
      - from: LIQUIDATION_IN_PROGRESS
        to: EXPIRED
        trigger: "system (all liquidation orders for this call CANCELLED and cure test still failing)"
        actor: system
        preconditions:
          - "No PENDING/PARTIALLY_FILLED orders remain for this call"
        side_effects: []

  - entity: LiquidationOrder
    initial_state: PENDING
    terminal_states: [EXECUTED, CANCELLED]
    transitions:
      - from: PENDING
        to: PARTIALLY_FILLED
        trigger: "POST /margin/liquidation-orders/{id}/fill with filled_quantity < quantity - already_filled"
        actor: LiquidationDesk
        preconditions:
          - "order_status in {PENDING, PARTIALLY_FILLED} (else ERR_LIQUIDATION_INVALID_STATE)"
          - "X-User-ID != created_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "filled_quantity > 0 and filled_quantity <= quantity - filled_quantity (else ERR_FILL_EXCEEDS_QUANTITY)"
        side_effects:
          - "Position.quantity reduced toward 0 by filled_quantity; Position.reserved_qty -= filled_quantity"
          - "cash_balance_cents += filled_quantity * fill_price_cents (sign per long/short; sells credit)"
          - "Account equity/requirement fields recomputed on current marks"
          - "MarginCall cure test evaluated (LIQUIDATION_IN_PROGRESS -> CURED if satisfied)"
          - "last_filled_by_user_id := X-User-ID"
      - from: PARTIALLY_FILLED
        to: PENDING
        trigger: "not used (no backward fill transitions)"
        actor: system
        preconditions: []
        side_effects: []
        note: "PARTIALLY_FILLED -> PENDING is not a valid transition; listed to pin rejection with ERR_LIQUIDATION_INVALID_STATE"
      - from: PARTIALLY_FILLED
        to: EXECUTED
        trigger: "POST /margin/liquidation-orders/{id}/fill with filled_quantity == remaining"
        actor: LiquidationDesk
        preconditions:
          - "order_status in {PENDING, PARTIALLY_FILLED}"
          - "X-User-ID != created_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Same fill cascade; order terminal EXECUTED"
      - from: PENDING
        to: EXECUTED
        trigger: "POST /margin/liquidation-orders/{id}/fill filling entire quantity"
        actor: LiquidationDesk
        preconditions:
          - "order_status in {PENDING, PARTIALLY_FILLED}"
          - "X-User-ID != created_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Same fill cascade; order terminal EXECUTED"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /margin/liquidation-orders/{id}/cancel"
        actor: LiquidationDesk
        preconditions:
          - "order_status in {PENDING, PARTIALLY_FILLED} (else ERR_LIQUIDATION_INVALID_STATE)"
        side_effects:
          - "Position.reserved_qty -= (quantity - filled_quantity) (compensation restores reservation)"
          - "MarginCall: if no other non-terminal orders for the call, LIQUIDATION_IN_PROGRESS -> EXPIRED"
      - from: PARTIALLY_FILLED
        to: CANCELLED
        trigger: "POST /margin/liquidation-orders/{id}/cancel"
        actor: LiquidationDesk
        preconditions:
          - "order_status in {PENDING, PARTIALLY_FILLED}"
        side_effects:
          - "Same reservation compensation for the unfilled remainder; fills already applied are NOT reversed"

  - entity: Dispute
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /margin/disputes/{id}/start-review"
        actor: MarginAnalyst
        preconditions:
          - "dispute_status == OPEN (else ERR_DISPUTE_INVALID_STATE)"
        side_effects:
          - "reviewed_by_user_id := X-User-ID"
      - from: UNDER_REVIEW
        to: OPEN
        trigger: "POST /margin/disputes/{id}/request-info"
        actor: MarginAnalyst
        preconditions:
          - "dispute_status == UNDER_REVIEW (else ERR_DISPUTE_INVALID_STATE)"
        side_effects:
          - "reviewed_by_user_id reset to null (cycle: dispute returns to customer for more evidence)"
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /margin/disputes/{id}/decide with decision=UPHELD"
        actor: MarginSupervisor
        preconditions:
          - "dispute_status == UNDER_REVIEW (else ERR_DISPUTE_INVALID_STATE)"
          - "X-User-ID != reviewed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "decision := UPHELD; decided_by_user_id := X-User-ID; then auto-transition UPHELD -> CLOSED"
          - "Linked MarginCall DISPUTED -> OPEN (due_at unchanged)"
      - from: UNDER_REVIEW
        to: OVERTURNED
        trigger: "POST /margin/disputes/{id}/decide with decision=OVERTURNED"
        actor: MarginSupervisor
        preconditions:
          - "dispute_status == UNDER_REVIEW (else ERR_DISPUTE_INVALID_STATE)"
          - "X-User-ID != reviewed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "decision := OVERTURNED; decided_by_user_id := X-User-ID; then auto-transition OVERTURNED -> CLOSED"
          - "Linked MarginCall DISPUTED -> WAIVED (cure_method WAIVER); account posture recheck"
      - from: UPHELD
        to: CLOSED
        trigger: "system (automatic immediately after decision)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OVERTURNED
        to: CLOSED
        trigger: "system (automatic immediately after decision)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: cash-movement-stale-account
    parent_entity: MarginAccount
    write_endpoint: "POST /margin/accounts/{id}/cash-movements"
    occ_field: "expected_account_version"
    description: |
      Recording a cash movement against a MarginAccount whose version has
      advanced since the client last observed it is rejected. This captures
      the case where another writer has just posted a movement, order fill,
      or sweep cascade against the same account, so the mover's balance view
      is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: liquidation-create-stale-account
    parent_entity: MarginAccount
    write_endpoint: "POST /margin/accounts/{id}/liquidation-orders"
    occ_field: "expected_account_version"
    description: |
      Creating a LiquidationOrder against a MarginAccount whose version has
      advanced since the desk last observed it is rejected, because call
      amounts, positions, and requirements the desk used to size the order
      may have changed.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: equity_calculation
    trigger: "position-creating/clearing order fill, price mark post, cash movement, interest monthly post, liquidation fill"
    algorithm: aggregation
    formula: |
      equity = cash_balance_cents
             + sum(max(0, Position.quantity) * mark_price(security, basis))
             - sum(max(0, -Position.quantity) * mark_price(security, basis))
      over all Positions of the account (any quantity, including 0 rows).
      mark_price(security, basis) = price_cents of the latest PriceMark for the
      security with mark_type == basis, ordered by marked_at DESC, created_at ASC tie-break.
    input_set: "All Position rows of the account regardless of quantity; latest PriceMark per (security, mark basis)"
    constants:
      REG_T_INITIAL_BPS: 5000
    precision: "integer cents; no rounding"
    variants:
      - name: REALTIME
        when: "trade gating, buying power, realtime account reads"
        difference: "basis = REALTIME marks; equity_realtime_cents"
      - name: OFFICIAL_CLOSE
        when: "margin call evaluation, maintenance excess, sweep checks"
        difference: "basis = OFFICIAL_CLOSE marks only; equity_official_cents; identical positions yield different equity when realtime and official marks diverge"

  - name: maintenance_requirement
    trigger: "same recomputation points as equity_calculation"
    algorithm: tiered_pricing
    formula: |
      Per position p (per basis):
        share_test: p.mv * 10000 > SecurityProfile.concentration_threshold_bps * gross_long_mv
          (longs only; gross_long_mv = sum of positive MVs of the account, same basis)
        concentration_addon_bps =
          0     if share_test false
          1000  if share_test true and p.mv * 10000 <= 7500 * gross_long_mv
          2000  if p.mv * 10000 > 7500 * gross_long_mv
        house_pct = (quantity>0 ? house_maint_long_bps : house_maint_short_bps) + concentration_addon_bps
        reg_pct   = quantity>0 ? 2500 : 3000
        req_p = round_half_up(|p.mv| * max(reg_pct, house_pct) / 10000)
      account reg requirement   = sum over positions of round_half_up(|mv| * reg_pct / 10000)
      account house requirement = sum of req_p with house_pct (each line rounded, then summed)
    input_set: "All Position rows with quantity != 0; SecurityProfile per security; marks per basis"
    constants:
      REG_MAINT_LONG_BPS: 2500
      REG_MAINT_SHORT_BPS: 3000
      CONC_MID_CAP_BPS: 7500
      CONC_MID_ADDON_BPS: 1000
      CONC_HIGH_ADDON_BPS: 2000
    precision: "integer cents; round_half_up per position line, then sum (pinned order)"

  - name: interest_accrual
    trigger: "POST /_sweeps/daily (one DAILY_ACCRUAL per account with debit_balance > 0 for the current clock date); MONTHLY_POST on the first sweep whose calendar month differs from the last posted month"
    algorithm: chronological
    formula: |
      debit = max(0, -cash_balance_cents) at sweep time
      tier  = effective RateTier (window covers clock date, closed interval) with
              greatest tier_level whose min_balance_cents <= debit
      daily_amount = round_half_up(debit * tier.annual_rate_bps / 10000 / 360)
      PINNED ROUNDING ORDER: each DAILY_ACCRUAL is rounded to whole cents first;
      MONTHLY_POST.amount = sum of the month's already-rounded DAILY_ACCRUAL amounts.
      MONTHLY_POST debits cash_balance_cents by its amount.
    input_set: "Accounts with cash_balance_cents < 0 at sweep; RateTiers effective on the clock date"
    constants:
      DAY_COUNT_YEAR: 360
    precision: "integer cents, round_half_up per day"
    variants:
      - name: PROVISIONAL
        when: "GET /margin/accounts/{id}/interest-summary (forward estimate)"
        difference: "provisional_month_estimate_cents = month_to_date_accrued + remaining_days_in_month * current_daily_accrual (assumes debit constant from today); diverges from POSTED when the debit changes mid-month"
      - name: POSTED
        when: "month-boundary sweep"
        difference: "posted_month_total_cents = chronological sum of rounded daily accruals actually recorded"

  - name: buying_power
    trigger: "account read and order gating display"
    algorithm: constraint_propagation
    formula: |
      PINNED EVALUATION ORDER (circular-looking dependency made explicit):
        1) cash' = cash after applying the proposed fill
        2) positions' and mark values' after the fill
        3) equity' per equity_calculation (REALTIME basis)
        4) initial_req' = round_half_up(5000 * (gross_long_mv' + gross_short_mv') / 10000)
        5) house_req' per maintenance_requirement (REALTIME)
        6) opening fill allowed iff equity' >= initial_req' AND equity' >= house_req'
      buying_power_cents (display):
        pdt_flag true : max(0, 4 * (equity_rt - max(reg_req_rt, house_req_rt)))
        pdt_flag false: max(0, 2 * (equity_rt - initial_req_rt))
    input_set: "Account, its positions, realtime marks, SecurityProfiles"
    constants:
      REG_T_INITIAL_BPS: 5000
      PDT_BP_MULTIPLIER: 4
    precision: "integer cents"

  - name: pdt_flag_evaluation
    trigger: "POST /_sweeps/daily"
    algorithm: threshold
    formula: |
      window = trailing 5 calendar dates inclusive of clock date (simplified business-day rule)
      day_trades = count of DayTradeEvents for account with event_date in window
      fills      = count of TradeFills for account with fill_date in window
      pdt_flag = (day_trades >= 4) AND (day_trades * 100 > 6 * fills)
      On transition false -> true: pdt_flagged_at := clock.
      Flag clears on a sweep where the condition no longer holds.
    input_set: "DayTradeEvents and TradeFills of the account inside the window"
    constants:
      PDT_MIN_DAY_TRADES: 4
      PDT_RATIO_NUM: 6
      PDT_MIN_EQUITY_CENTS: 2500000
    precision: "integer cross-multiplication, strict >"

  - name: day_trade_detection
    trigger: "order fill (POST /margin/accounts/{id}/orders)"
    algorithm: chronological
    formula: |
      Lazy reset: if fill_date != Position.last_trade_date, set today_bought_qty = today_sold_qty = 0
      before applying the fill.
      BUY / SELL_SHORT: today_bought_qty += qty (BUY); short side tracked symmetrically.
      SELL closing long: day-trade shares = min(today_bought_qty_before_fill, sell_qty); if > 0 the
      fill is marked is_day_trade and, if no DayTradeEvent exists for (account, security, fill_date),
      one is created. BUY_TO_COVER symmetric for shorts opened today.
    input_set: "The filling position's day counters"
    precision: "integer shares"

  - name: liquidation_position_selection
    trigger: "POST /margin/accounts/{id}/liquidation-orders (selector policy, server-side)"
    algorithm: weighted_scoring
    formula: |
      eligibility: Positions of the account with quantity != 0 AND reserved_qty == 0
      ranking: SecurityProfile.liquidity_tier ASC, then |mv_official_cents| DESC,
               tie-break Position.opened_at ASC (never id)
      selection: take whole positions in rank order until cumulative |mv_official| >= call.call_amount_cents;
                 each selected position is liquidated in full (quantity = |position.quantity|)
      empty-pool fallback: if no eligible positions OR total eligible |mv| < call_amount, reject
                 ERR_NO_LIQUIDATABLE_POSITIONS (409); one LiquidationOrder is created PER selected
                 position; response returns the first-ranked order
    input_set: "Account positions, SecurityProfiles, the EXPIRED MarginCall"
    precision: "integer cents"

  - name: call_amount
    trigger: "call issuance (mark cascade or sweep)"
    algorithm: threshold
    formula: |
      reg_excess   = equity_official - reg_req_official
      house_excess = equity_official - house_req_official
      fed_deficiency  = max(0, round_half_up(5000 * gross_long_mv_official / 10000) - equity_official)
      if reg_excess < 0:          type = MAINTENANCE, amount = max(-reg_excess, -house_excess)
      elif house_excess < 0:      type = HOUSE,       amount = -house_excess
      elif fed_deficiency > 0:    type = FED_REG_T,   amount = fed_deficiency
      elif pdt_flag and equity_official < 2500000:
                                  type = DAY_TRADE_MIN_EQUITY, amount = 2500000 - equity_official
      Severity order MAINTENANCE > HOUSE > FED_REG_T > DAY_TRADE_MIN_EQUITY; at most one call is
      issued per evaluation, and a type already OPEN/DISPUTED/EXPIRED/LIQUIDATION_IN_PROGRESS
      on the account is skipped (one non-terminal call per (account, call_type)).
    input_set: "Account computed fields; official marks"
    constants:
      PDT_MIN_EQUITY_CENTS: 2500000
      REG_T_INITIAL_BPS: 5000
    precision: "integer cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and role recognized", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted for this endpoint per RBAC", error_id: ERR_INSUFFICIENT_PERMISSIONS, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path ids exist, validated left-to-right", error_id: "ERR_{RESOURCE}_NOT_FOUND", http_status: 404, applies_to: "all id-addressed endpoints" }
  - { priority: 4, category: existence, check: "Ownership: X-User-ID equals the owning Customer id for customer-scoped writes (orders, cash movements, disputes, application create/resubmit, close)", error_id: ERR_ACCOUNT_OWNERSHIP_MISMATCH, http_status: 403, applies_to: "customer-scoped write endpoints" }
  - { priority: 5, category: state, check: "Account/entity state precondition for the operation (account not CLOSED; opening orders and withdrawals require ACTIVE; application/call/dispute/liquidation-order in a from-state of the invoked transition)", error_id: "ERR_ACCOUNT_CLOSED | ERR_ACCOUNT_RESTRICTED | ERR_APPLICATION_INVALID_STATE | ERR_CALL_NOT_OPEN | ERR_CALL_NOT_EXPIRED | ERR_DISPUTE_INVALID_STATE | ERR_LIQUIDATION_INVALID_STATE", http_status: 409, applies_to: "state-transition and account-gated endpoints" }
  - { priority: 6, category: business_safety, check: "Regulatory/compliance gates: segregation of duties (approver != reviewer; filler != order creator; dispute decider != reviewer); PDT-flagged account with equity_realtime < 2500000 may not open positions", error_id: "ERR_SEGREGATION_OF_DUTIES | ERR_PDT_MIN_EQUITY", http_status: 403, applies_to: "approve/reject, liquidation fill, dispute decide, orders" }
  - { priority: 7, category: business_safety, check: "Suitability at approval: liquid_net_worth_cents >= 200000 and investment_experience_years >= 1; at most one MarginAccount per customer", error_id: "ERR_SUITABILITY_NOT_MET | ERR_ACCOUNT_ALREADY_EXISTS", http_status: 422, applies_to: "POST /margin/account-applications/{id}/approve" }
  - { priority: 8, category: business_constraint, check: "Instrument/structural rules: security marginable for opening orders; latest REALTIME mark exists; rate-tier effective windows for the same tier_level do not share any calendar date (closed intervals; back-to-back allowed); no duplicate OPEN/UNDER_REVIEW dispute per call; at most one non-terminal liquidation order per account; selected position not already reserved", error_id: "ERR_SECURITY_NOT_MARGINABLE | ERR_NO_MARKET_MARK | ERR_RATE_TIER_OVERLAP | ERR_DUPLICATE_DISPUTE | ERR_LIQUIDATION_IN_PROGRESS | ERR_POSITION_RESERVED", http_status: 422, applies_to: "orders, marks, rate-tiers, disputes, liquidation-orders" }
  - { priority: 9, category: business_temporal, check: "Clock monotonicity for test-driving clock (new time must be >= current); mark price positive", error_id: "ERR_CLOCK_REGRESSION | ERR_INVALID_MARK", http_status: 400, applies_to: "POST /_clock/set_current_utc, POST /margin/market-marks" }
  - { priority: 10, category: business_fiscal, check: "Order: post-trade equity' >= initial_req' and >= house_req' (opening); CashMovement WITHDRAWAL/JOURNAL_DEBIT: amount <= cash_balance_cents and post-withdrawal official binding excess >= 0", error_id: "ERR_INSUFFICIENT_BUYING_POWER | ERR_INSUFFICIENT_CASH | ERR_MAINTENANCE_EXCESS_NEGATIVE", http_status: 402, applies_to: "orders, cash-movements" }

