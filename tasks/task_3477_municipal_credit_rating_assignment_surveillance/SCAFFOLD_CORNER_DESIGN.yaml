  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_stale_engagement_version_on_scorecard_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[scorecard-submit-stale-engagement]
          - errors[ERR_STALE_ENGAGEMENT_VERSION]
        distinguishing_aspect: "Two strictly sequential scorecard submissions carrying the same expected_engagement_version: the first succeeds (bumping the engagement version), the second is rejected 412 ERR_STALE_ENGAGEMENT_VERSION — the create-with-supersede race resolved by OCC."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. GO engagement at ANALYSIS with version 6 (create 1, accept 2, four documents 3-6)."
          setup_api_calls:
            - *c_default
            - *mk_issuer
            - *mk_cv_go
            - *act_cv_go
            - *mk_eng_go
            - *accept_go
            - *doc_audit
            - *doc_budget
            - *doc_tax
            - *doc_debt
          trigger:
            - *score_a
            - call: "POST /muni/engagements/${eng_go}/scorecard"
              payload: { score_economy: 5, score_management: 5, score_budgetary_performance: 5, score_flexibility: 5, score_liquidity: 5, score_debt_profile: 5, expected_engagement_version: "${eng_go_v}" }
              as: LeadAnalyst
              as_user_id: "analyst-1"
              captures: { stale_err: "$.data.error_id" }
          assert:
            - "first submission with the captured version succeeds (200) and moves the engagement to COMMITTEE_READY"
            - "second submission replaying the same expected_engagement_version -> 412 ERR_STALE_ENGAGEMENT_VERSION (the supersede superseded the client's view)"
            - "the scorecard in effect remains the first one (indicative A), not the all-5s replacement"

