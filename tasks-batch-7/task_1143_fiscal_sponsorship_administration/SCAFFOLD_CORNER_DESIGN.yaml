        test_recipe:
          setup: ["COMPREHENSIVE project ACTIVE; donation 10,000 RECEIVED with open refund request"]
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "RB1", mission_statement: "m", requested_model: "COMPREHENSIVE", budget_estimate_cents: 1000, contact_email: "rb1@x.org" }, as: Applicant, as_user_id: user_c_b1, captures: { app: $.data.id } }
