              payload: { patient_id: "${pt_id}", prescriber_npi: "1487654321", drug_name: "Oxycodone IR", ndc: "00406-0552-01", strength: "5mg", form: "TABLET", copay_tier: "GENERIC", dose_times: ["EVENING"], quantity_per_dose: 1, days_supply_written: 30, refills_authorized: 1, written_date: "2026-07-01", expiration_date: "2027-01-01", is_controlled: true, last_dispensed_date: "2026-07-18", last_dispensed_days_supply: 30 }
              as: Prescriber
              captures: { rx_ctrl: $.data.id }
            - call: "POST /pharmacy/vacation-exceptions"
