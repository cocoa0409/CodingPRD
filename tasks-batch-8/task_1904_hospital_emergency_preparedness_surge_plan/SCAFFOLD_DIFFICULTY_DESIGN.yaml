# =============================================================================
# Task 1904 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 2 instances per Difficulty Rule (18 total). Every instance grounds in
# SCAFFOLD.yaml §1.1–§1.7 and is replayable from empty-DB via §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: hva_two_factor_vs_three_factor_divergence
        grounds:
          - calculations.hva_risk_score
          - entities.HazardAssessment.fields.scoring_model
          - entities.HazardAssessment.fields.max_risk_score
        distinguishing_aspect: |
          Same entry inputs (probability=2, severity=3, preparedness=1) yield risk_score 6 under
          TWO_FACTOR and 10 under THREE_FACTOR_MITIGATION — the variant is keyed on the
          HazardAssessment's own scoring_model (entity domain: HazardAssessment).
        test_recipe:
          setup:
            - "Two DRAFT HazardAssessments, identical entries [{EQ, p=2, s=3, prep=1}]; A is TWO_FACTOR, B is THREE_FACTOR_MITIGATION"
          setup_api_calls:
            - call: "POST /emergency/hazard-assessments"
              payload: { fiscal_year: "FY2026", scoring_model: "TWO_FACTOR", hazard_entries: [{ entry_key: "EQ", hazard_name: "Earthquake", category: "NATURAL", probability: 2, severity: 3, preparedness: 1 }] }
              as: EmergencyManager
              captures: { hva_a: $.data.id }
            - call: "POST /emergency/hazard-assessments"
              payload: { fiscal_year: "FY2026", scoring_model: "THREE_FACTOR_MITIGATION", hazard_entries: [{ entry_key: "EQ", hazard_name: "Earthquake", category: "NATURAL", probability: 2, severity: 3, preparedness: 1 }] }
              as: EmergencyManager
              captures: { hva_b: $.data.id }
          trigger:
            - call: "POST /emergency/hazard-assessments/${hva_a}/finalize"
              as: EmergencyManager
              captures: { a_max: $.data.max_risk_score, a_flag: $.data.plan_review_triggered }
            - call: "POST /emergency/hazard-assessments/${hva_b}/finalize"
              as: EmergencyManager
              captures: { b_max: $.data.max_risk_score }
          assert:
            - "HazardAssessment.${hva_a} entry EQ risk_score == 6 (2 * 3)"
            - "HazardAssessment.${hva_b} entry EQ risk_score == 10 (2 * (3 + (3 - 1)))"
            - "${a_max} == 6"
            - "${b_max} == 10"
            - "${a_flag} == true (6 >= PLAN_REVIEW_TRIGGER_SCORE 6, boundary inclusive)"

      - name: surge_capacity_licensed_vs_operational_divergence
        grounds:
          - calculations.surge_capacity_and_tier
          - entities.IncidentEvent.fields.licensed_surge_capacity
          - entities.IncidentEvent.fields.operational_surge_capacity
        distinguishing_aspect: |
          One surge assessment with staffed_bed_count=100 and a 40-bed ACTIVATED alternate care
          site yields licensed_surge_capacity 100 but operational_surge_capacity 140 — two valid
          capacity bases on the IncidentEvent domain, a different entity domain from the HVA instance.
        test_recipe:
          setup:
            - "Incident ACTIVATED; AlternateCareSite (bed_capacity 40) COMMITTED with window covering the default clock and ACTIVATED for this incident"
          setup_api_calls:
            - call: "POST /emergency/incidents"
              payload: { incident_name: "MCI-1", incident_type: "NATURAL", declared_at: "2026-08-01T00:00:00Z" }
              as: IncidentCommander
              captures: { inc_id: $.data.id }
            - call: "POST /emergency/alternate-care-sites"
              payload: { site_name: "Fairground Hall", address: "1 Fair Way", bed_capacity: 40 }
              as: LogisticsChief
              captures: { site_id: $.data.id }
            - call: "POST /emergency/alternate-care-sites/${site_id}/commit"
              payload: { incident_id: "${inc_id}", window_start: "2026-07-31T00:00:00Z", window_end: "2026-08-05T00:00:00Z" }
              as: IncidentCommander
            - call: "POST /emergency/alternate-care-sites/${site_id}/activate"
              as: IncidentCommander
          trigger:
            - call: "POST /emergency/incidents/${inc_id}/assess-surge"
              payload: { staffed_bed_count: 100, projected_census: 60 }
              as: IncidentCommander
              captures: { lic: $.data.licensed_surge_capacity, ops: $.data.operational_surge_capacity, tier: $.data.current_surge_tier }
          assert:
            - "${lic} == 100 (regulatory_reporting variant: staffed beds only)"
            - "${ops} == 140 (operational_planning variant: 100 + 40 ACTIVATED site beds)"
            - "${tier} == GREEN (6000 < 85*140)"

  - rule_id: combinatorial_formula
    instances:
      - name: surge_tier_conditional_threshold_selection
        grounds:
          - calculations.surge_capacity_and_tier
          - entities.IncidentEvent.fields.current_surge_tier
        distinguishing_aspect: |
          Mode (a): a tiered conditional branch over >=3 inputs (projected_census,
          staffed_bed_count, ACTIVATED-site bed sum) — walking census 169/170/200/230 against
          200 staffed beds selects GREEN/YELLOW/ORANGE/RED exactly at the 85/100/115% integer
          cross-multiplication boundaries.
        test_recipe:
          setup:
            - "Incident ACTIVATED with no alternate care sites (operational capacity == staffed_bed_count)"
          setup_api_calls:
            - call: "POST /emergency/incidents"
              payload: { incident_name: "MCI-tiers", incident_type: "HUMAN", declared_at: "2026-08-01T00:00:00Z" }
              as: IncidentCommander
              captures: { inc_id: $.data.id }
          trigger:
            - call: "POST /emergency/incidents/${inc_id}/assess-surge"
              payload: { staffed_bed_count: 200, projected_census: 169 }
              as: PlanningChief
              captures: { t1: $.data.current_surge_tier }
            - call: "POST /emergency/incidents/${inc_id}/assess-surge"
              payload: { staffed_bed_count: 200, projected_census: 170 }
              as: PlanningChief
              captures: { t2: $.data.current_surge_tier }
            - call: "POST /emergency/incidents/${inc_id}/assess-surge"
              payload: { staffed_bed_count: 200, projected_census: 200 }
              as: PlanningChief
              captures: { t3: $.data.current_surge_tier }
            - call: "POST /emergency/incidents/${inc_id}/assess-surge"
              payload: { staffed_bed_count: 200, projected_census: 230 }
              as: PlanningChief
              captures: { t4: $.data.current_surge_tier }
          assert:
            - "${t1} == GREEN  (100*169=16900 < 85*200=17000)"
            - "${t2} == YELLOW (17000 >= 17000 and 17000 < 20000 — 85% boundary inclusive)"
            - "${t3} == ORANGE (20000 >= 20000 and 20000 < 23000 — 100% boundary inclusive)"
            - "${t4} == RED    (23000 >= 23000 — 115% boundary inclusive)"

      - name: burn_rate_round_then_multiply_order
        grounds:
          - calculations.ppe_burn_rate
          - entities.SupplyItem.fields.projected_daily_burn_rate
          - entities.SupplyItem.fields.days_of_supply
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — observed rate is rounded to 4dp BEFORE
          multiplying by the surge multiplier and rounding again. Net 3 issued over the window
          gives observed 0.4286; under YELLOW (x1.25) the pinned order yields 0.5358, while
          multiply-then-round-once would yield 0.5357 — a different last digit.
        test_recipe:
          setup:
            - "SupplyItem N95 (reorder_min_days 13) with RECEIVE 10 and ISSUE 3 inside the trailing 168h window; incident ACTIVATED with tier YELLOW (multiplier 1.25)"
          setup_api_calls:
            - call: "POST /emergency/supply-items"
              payload: { item_name: "N95 respirator", category: "PPE", unit: "box", reorder_min_days: 13 }
              as: LogisticsChief
              captures: { item_id: $.data.id }
            - call: "POST /emergency/stock-transactions"
              payload: { supply_item_id: "${item_id}", transaction_type: "RECEIVE", quantity: 10, occurred_at: "2026-07-30T10:00:00Z" }
              as: LogisticsChief
            - call: "POST /emergency/incidents"
              payload: { incident_name: "MCI-burn", incident_type: "INFECTIOUS", declared_at: "2026-08-01T00:00:00Z" }
              as: IncidentCommander
              captures: { inc_id: $.data.id }
            - call: "POST /emergency/incidents/${inc_id}/assess-surge"
              payload: { staffed_bed_count: 200, projected_census: 170 }
              as: IncidentCommander
            - call: "POST /emergency/stock-transactions"
              payload: { supply_item_id: "${item_id}", transaction_type: "ISSUE", quantity: 3, occurred_at: "2026-07-30T11:00:00Z" }
              as: LogisticsChief
          trigger:
            - call: "GET /emergency/supply-items/${item_id}"
              as: LogisticsChief
              captures: { obs: $.data.observed_daily_burn_rate, proj: $.data.projected_daily_burn_rate, days: $.data.days_of_supply, below: $.data.below_reorder_level }
          assert:
            - "${obs} == 0.4286 (round_half_up(3/7, 4))"
            - "${proj} == 0.5358 (round_half_up(0.4286 * 1.25, 4)); the unpinned multiply-first order would give 0.5357"
            - "${days} == 13 (floor(7 / 0.5358) = floor(13.0653...))"
            - "${below} == false (13 < 13 is false — strict less-than)"

  - rule_id: non_linear_state_machine
    instances:
      - name: incident_deactivate_reactivate_cycle
        grounds:
          - state_machines.IncidentEvent.ACTIVATED_to_DEACTIVATED
          - state_machines.IncidentEvent.DEACTIVATED_to_ACTIVATED
          - entities.IncidentEvent.fields.activation_count
        distinguishing_aspect: |
          Cyclic machine on IncidentEvent: ACTIVATED → DEACTIVATED → ACTIVATED is legal and
          activation_count advances 1 → 1 (demobilize keeps count) → 2 on the second activation.
        test_recipe:
          setup:
            - "Incident ACTIVATED with no patients, callbacks, or sites (clean demobilize preconditions)"
          setup_api_calls:
            - call: "POST /emergency/incidents"
              payload: { incident_name: "Storm wave 1", incident_type: "NATURAL", declared_at: "2026-08-01T00:00:00Z" }
              as: IncidentCommander
              captures: { inc_id: $.data.id }
          trigger:
            - call: "POST /emergency/incidents/${inc_id}/demobilize"
              as: IncidentCommander
              captures: { st1: $.data.status, ac1: $.data.activation_count }
            - call: "POST /emergency/incidents/${inc_id}/reactivate"
              as: IncidentCommander
              captures: { st2: $.data.status, ac2: $.data.activation_count }
          assert:
            - "${st1} == DEACTIVATED"
            - "${ac1} == 1"
            - "${st2} == ACTIVATED"
            - "${ac2} == 2"
            - "IncidentEvent.${inc_id}.deactivated_at is set and activated_at was refreshed on reactivation"

      - name: callback_request_fork_accept_vs_decline
        grounds:
          - state_machines.CallBackRequest.PENDING_to_ACCEPTED
          - state_machines.CallBackRequest.PENDING_to_DECLINED
          - calculations.committed_staffing
        distinguishing_aspect: |
          Branching fork on CallBackRequest (different entity than IncidentEvent): from PENDING,
          ACCEPT and DECLINE diverge to different terminal states with different side-effect
          sets — only ACCEPT bumps the incident's committed_staff_count.
        test_recipe:
          setup:
            - "Two callback-eligible staff; one ACTIVATED incident; two explicit PENDING call-back requests"
          setup_api_calls:
            - call: "POST /emergency/staff-members"
              payload: { full_name: "A One", badge_number: "B-501", department: "EMERGENCY", role_qualifications: [], callback_eligible: true, callback_seniority_score: 50 }
              as: HospitalAdministrator
              captures: { s1: $.data.id }
            - call: "POST /emergency/staff-members"
              payload: { full_name: "B Two", badge_number: "B-502", department: "EMERGENCY", role_qualifications: [], callback_eligible: true, callback_seniority_score: 40 }
              as: HospitalAdministrator
              captures: { s2: $.data.id }
            - call: "POST /emergency/incidents"
              payload: { incident_name: "MCI-fork", incident_type: "HUMAN", declared_at: "2026-08-01T00:00:00Z" }
              as: IncidentCommander
              captures: { inc_id: $.data.id }
            - call: "POST /emergency/callback-requests"
              payload: { incident_id: "${inc_id}", staff_member_id: "${s1}" }
              as: PlanningChief
              captures: { cb1: "$.data[0].id" }
            - call: "POST /emergency/callback-requests"
              payload: { incident_id: "${inc_id}", staff_member_id: "${s2}" }
              as: PlanningChief
              captures: { cb2: "$.data[0].id" }
          trigger:
            - call: "POST /emergency/callback-requests/${cb1}/respond"
              payload: { outcome: "ACCEPT" }
              as: OnCallStaff
              as_user_id: "${s1}"
            - call: "POST /emergency/callback-requests/${cb2}/respond"
              payload: { outcome: "DECLINE" }
              as: OnCallStaff
              as_user_id: "${s2}"
            - call: "GET /emergency/incidents/${inc_id}"
              as: PlanningChief
              captures: { committed: $.data.committed_staff_count }
          assert:
            - "CallBackRequest.${cb1}.status == ACCEPTED"
            - "CallBackRequest.${cb2}.status == DECLINED"
            - "${committed} == 1 (ACCEPT branch increments; DECLINE branch does not)"

  - rule_id: transitive_cascade
    instances:
      - name: acs_demobilize_capacity_tier_burn_chain
        grounds:
          - state_machines.AlternateCareSite.ACTIVATED_to_DEMOBILIZED
          - calculations.surge_capacity_and_tier
          - calculations.ppe_burn_rate
        distinguishing_aspect: |
          Depth-3 transitive chain from POST /alternate-care-sites/{id}/demobilize: site
          ACTIVATED→DEMOBILIZED (link 1) forces incident operational_surge_capacity recompute
          140→... (link 2), which re-derives current_surge_tier GREEN→YELLOW (link 3), which
          reprices every SupplyItem's projected burn rate 0.4286→0.5358 (link 4 observable).
        test_recipe:
          setup:
            - "SupplyItem with RECEIVE 10 + ISSUE 3 in-window (observed 0.4286); incident ACTIVATED; 40-bed site COMMITTED+ACTIVATED for the incident; surge assessed at staffed 200 / census 170 → tier GREEN against operational 240"
          setup_api_calls:
            - call: "POST /emergency/supply-items"
              payload: { item_name: "N95 respirator", category: "PPE", unit: "box", reorder_min_days: 13 }
              as: LogisticsChief
              captures: { item_id: $.data.id }
            - call: "POST /emergency/stock-transactions"
              payload: { supply_item_id: "${item_id}", transaction_type: "RECEIVE", quantity: 10, occurred_at: "2026-07-30T10:00:00Z" }
              as: LogisticsChief
            - call: "POST /emergency/stock-transactions"
              payload: { supply_item_id: "${item_id}", transaction_type: "ISSUE", quantity: 3, occurred_at: "2026-07-30T11:00:00Z" }
              as: LogisticsChief
            - call: "POST /emergency/incidents"
              payload: { incident_name: "MCI-cascade", incident_type: "NATURAL", declared_at: "2026-08-01T00:00:00Z" }
              as: IncidentCommander
              captures: { inc_id: $.data.id }
            - call: "POST /emergency/alternate-care-sites"
              payload: { site_name: "Gym Site", address: "9 Gym Rd", bed_capacity: 40 }
              as: LogisticsChief
              captures: { site_id: $.data.id }
            - call: "POST /emergency/alternate-care-sites/${site_id}/commit"
              payload: { incident_id: "${inc_id}", window_start: "2026-07-31T00:00:00Z", window_end: "2026-08-05T00:00:00Z" }
              as: IncidentCommander
            - call: "POST /emergency/alternate-care-sites/${site_id}/activate"
              as: IncidentCommander
            - call: "POST /emergency/incidents/${inc_id}/assess-surge"
              payload: { staffed_bed_count: 200, projected_census: 170 }
              as: IncidentCommander
              captures: { tier0: $.data.current_surge_tier, ops0: $.data.operational_surge_capacity }
            - call: "GET /emergency/supply-items/${item_id}"
              as: LogisticsChief
              captures: { proj0: $.data.projected_daily_burn_rate }
          trigger:
            - call: "POST /emergency/alternate-care-sites/${site_id}/demobilize"
              as: IncidentCommander
            - call: "GET /emergency/incidents/${inc_id}"
              as: IncidentCommander
              captures: { tier1: $.data.current_surge_tier, ops1: $.data.operational_surge_capacity }
            - call: "GET /emergency/supply-items/${item_id}"
              as: LogisticsChief
              captures: { proj1: $.data.projected_daily_burn_rate }
          assert:
            - "AlternateCareSite.${site_id}.status == DEMOBILIZED and activated_incident_id == null"
            - "${ops0} == 240 and ${ops1} == 200 (site's 40 beds removed)"
            - "${tier0} == GREEN (17000 < 85*240=20400) and ${tier1} == YELLOW (17000 >= 85*200=17000)"
            - "${proj0} == 0.4286 (multiplier 1.0 under GREEN) and ${proj1} == 0.5358 (multiplier 1.25 under YELLOW)"

      - name: callback_cancel_compensates_committed_count
        grounds:
          - state_machines.CallBackRequest.ACCEPTED_to_CANCELLED
          - calculations.committed_staffing
        distinguishing_aspect: |
          Depth-2 transitive chain from POST /callback-requests/{id}/cancel (a different trigger
          than the ACS demobilize instance): the cancel transition on CallBackRequest (link 1)
          itself forces IncidentEvent.committed_staff_count to decrement (link 2) — and only
          because the request was ACCEPTED first.
        test_recipe:
          setup:
            - "Callback-eligible staff member; ACTIVATED incident; request cb1 ACCEPTED (committed_staff_count == 1)"
          setup_api_calls:
            - call: "POST /emergency/staff-members"
              payload: { full_name: "C Three", badge_number: "B-503", department: "NURSING", role_qualifications: [], callback_eligible: true, callback_seniority_score: 10 }
              as: HospitalAdministrator
              captures: { s1: $.data.id }
            - call: "POST /emergency/incidents"
              payload: { incident_name: "MCI-cancel", incident_type: "HUMAN", declared_at: "2026-08-01T00:00:00Z" }
              as: IncidentCommander
              captures: { inc_id: $.data.id }
            - call: "POST /emergency/callback-requests"
              payload: { incident_id: "${inc_id}", staff_member_id: "${s1}" }
              as: PlanningChief
              captures: { cb1: "$.data[0].id" }
            - call: "POST /emergency/callback-requests/${cb1}/respond"
              payload: { outcome: "ACCEPT" }
              as: OnCallStaff
              as_user_id: "${s1}"
          trigger:
            - call: "POST /emergency/callback-requests/${cb1}/cancel"
              as: PlanningChief
            - call: "GET /emergency/incidents/${inc_id}"
              as: PlanningChief
              captures: { committed: $.data.committed_staff_count }
          assert:
            - "CallBackRequest.${cb1}.status == CANCELLED"
            - "${committed} == 0 (link-2 compensation fired only because the cancelled request was ACCEPTED)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: transfer_discharged_patient_to_full_site_state_beats_safety
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - state_machines.PatientTrackRecord.TRACKED_to_DISCHARGED
        distinguishing_aspect: |
          Error-category pair state vs business_safety: transferring a DISCHARGED patient to a
          site that is also full violates both the state guard (ERR_INVALID_STATE, priority 8)
          and the capacity safety guard (ERR_ACS_AT_CAPACITY, priority 10); the state error wins.
        test_recipe:
          setup:
            - "Incident ACTIVATED; site bed_capacity 1 COMMITTED+ACTIVATED for the incident; patient pA TRANSFERRED to the site (census 1 == capacity); patient pB already DISCHARGED"
          setup_api_calls:
            - call: "POST /emergency/incidents"
              payload: { incident_name: "MCI-prio", incident_type: "NATURAL", declared_at: "2026-08-01T00:00:00Z" }
              as: IncidentCommander
              captures: { inc_id: $.data.id }
            - call: "POST /emergency/alternate-care-sites"
              payload: { site_name: "Tent-1", address: "5 Field Rd", bed_capacity: 1 }
              as: LogisticsChief
              captures: { site_id: $.data.id }
            - call: "POST /emergency/alternate-care-sites/${site_id}/commit"
              payload: { incident_id: "${inc_id}", window_start: "2026-07-31T00:00:00Z", window_end: "2026-08-05T00:00:00Z" }
              as: IncidentCommander
            - call: "POST /emergency/alternate-care-sites/${site_id}/activate"
              as: IncidentCommander
            - call: "POST /emergency/patient-records"
              payload: { incident_id: "${inc_id}", patient_ref: "P-A", triage_category: "IMMEDIATE", arrival_at: "2026-08-01T00:10:00Z" }
              as: PlanningChief
              captures: { pa: $.data.id }
            - call: "POST /emergency/patient-records"
              payload: { incident_id: "${inc_id}", patient_ref: "P-B", triage_category: "MINOR", arrival_at: "2026-08-01T00:11:00Z" }
              as: PlanningChief
              captures: { pb: $.data.id }
            - call: "POST /emergency/patient-records/${pa}/transfer"
              payload: { site_id: "${site_id}" }
              as: PlanningChief
            - call: "POST /emergency/patient-records/${pb}/discharge"
              as: PlanningChief
          trigger:
            - call: "POST /emergency/patient-records/${pb}/transfer"
              payload: { site_id: "${site_id}" }
              as: PlanningChief
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE (HTTP 409) — the patient-state failure outranks the co-violated ERR_ACS_AT_CAPACITY (HTTP 422)"

      - name: match_cross_incident_referential_beats_ref_mismatch_constraint
        grounds:
          - validations[priority=12]
          - validations[priority=14]
          - state_machines.FamilyInquiry.OPEN_to_MATCHED
        distinguishing_aspect: |
          Error-category pair business_referential vs business_constraint (a different pair than
          the transfer instance): matching an inquiry to a record of another incident whose
          patient_ref also mismatches must surface ERR_CROSS_INCIDENT_REFERENCE (priority 12),
          not ERR_PATIENT_REF_MISMATCH or ERR_PATIENT_NOT_TRACKED (priority 14).
        test_recipe:
          setup:
            - "Incident I1 created patient P-1 who was then DISCHARGED; I1 demobilized; incident I2 ACTIVATED with inquiry seeking P-999"
          setup_api_calls:
            - call: "POST /emergency/incidents"
              payload: { incident_name: "Wave-1", incident_type: "NATURAL", declared_at: "2026-08-01T00:00:00Z" }
              as: IncidentCommander
              captures: { i1: $.data.id }
            - call: "POST /emergency/patient-records"
              payload: { incident_id: "${i1}", patient_ref: "P-1", triage_category: "DELAYED", arrival_at: "2026-08-01T00:05:00Z" }
              as: PlanningChief
              captures: { r1: $.data.id }
            - call: "POST /emergency/patient-records/${r1}/discharge"
              as: PlanningChief
            - call: "POST /emergency/incidents/${i1}/demobilize"
              as: IncidentCommander
            - call: "POST /emergency/incidents"
              payload: { incident_name: "Wave-2", incident_type: "NATURAL", declared_at: "2026-08-01T01:00:00Z" }
              as: IncidentCommander
              captures: { i2: $.data.id }
            - call: "POST /emergency/family-inquiries"
              payload: { incident_id: "${i2}", inquirer_name: "Jamie", inquirer_phone: "555-0100", sought_patient_ref: "P-999" }
              as: PublicInformationOfficer
              captures: { q1: $.data.id }
          trigger:
            - call: "POST /emergency/family-inquiries/${q1}/match"
              payload: { patient_record_id: "${r1}" }
              as: PublicInformationOfficer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CROSS_INCIDENT_REFERENCE (HTTP 422) — referential failure outranks the co-violated ref-mismatch and not-TRACKED constraint failures"

  - rule_id: boundary_precision_check
    instances:
      - name: surge_tier_red_boundary_exactly_115_percent
        grounds:
          - calculations.surge_capacity_and_tier
          - entities.IncidentEvent.fields.current_surge_tier
        distinguishing_aspect: |
          Metric: occupancy ratio on POST /incidents/{id}/assess-surge — at exactly 115%
          (census 230 vs capacity 200, 100*P == 115*C) the tier IS RED (>= semantics), while
          census 229 stays ORANGE.
        test_recipe:
          setup:
            - "Incident ACTIVATED, no sites"
          setup_api_calls:
            - call: "POST /emergency/incidents"
              payload: { incident_name: "MCI-115", incident_type: "HAZMAT", declared_at: "2026-08-01T00:00:00Z" }
              as: IncidentCommander
              captures: { inc_id: $.data.id }
          trigger:
            - call: "POST /emergency/incidents/${inc_id}/assess-surge"
              payload: { staffed_bed_count: 200, projected_census: 229 }
              as: IncidentCommander
              captures: { t1: $.data.current_surge_tier }
            - call: "POST /emergency/incidents/${inc_id}/assess-surge"
              payload: { staffed_bed_count: 200, projected_census: 230 }
              as: IncidentCommander
              captures: { t2: $.data.current_surge_tier }
          assert:
            - "${t1} == ORANGE (22900 < 23000)"
            - "${t2} == RED (23000 >= 23000 — the 115% boundary belongs to RED)"

      - name: callback_pool_exact_fit_then_overflow
        grounds:
          - calculations.committed_staffing
          - entities.CallBackRequest.fields.staff_member_id
          - errors[ERR_INSUFFICIENT_CALLBACK_POOL]
        distinguishing_aspect: |
          Metric: eligible-pool cardinality on POST /callback-requests (a different metric and
          endpoint than the occupancy-ratio instance) — count == pool size exactly succeeds and
          creates all of them; count == pool size + 1 fails atomically with
          ERR_INSUFFICIENT_CALLBACK_POOL and creates nothing.
        test_recipe:
          setup:
            - "Three callback-eligible ACTIVE staff (scores 30/20/10, badges B-301/B-302/B-303); one ACTIVATED incident"
          setup_api_calls:
            - call: "POST /emergency/staff-members"
              payload: { full_name: "S One", badge_number: "B-301", department: "EMERGENCY", role_qualifications: [], callback_eligible: true, callback_seniority_score: 30 }
              as: HospitalAdministrator
              captures: { s1: $.data.id }
            - call: "POST /emergency/staff-members"
              payload: { full_name: "S Two", badge_number: "B-302", department: "EMERGENCY", role_qualifications: [], callback_eligible: true, callback_seniority_score: 20 }
              as: HospitalAdministrator
              captures: { s2: $.data.id }
            - call: "POST /emergency/staff-members"
              payload: { full_name: "S Three", badge_number: "B-303", department: "EMERGENCY", role_qualifications: [], callback_eligible: true, callback_seniority_score: 10 }
              as: HospitalAdministrator
              captures: { s3: $.data.id }
            - call: "POST /emergency/incidents"
              payload: { incident_name: "MCI-pool", incident_type: "HUMAN", declared_at: "2026-08-01T00:00:00Z" }
              as: IncidentCommander
              captures: { inc_id: $.data.id }
          trigger:
            - call: "POST /emergency/callback-requests"
              payload: { incident_id: "${inc_id}", auto_select_count: 4 }
              as: PlanningChief
              captures: { err: $.data.error_id }
            - call: "POST /emergency/callback-requests"
              payload: { incident_id: "${inc_id}", auto_select_count: 3 }
              as: PlanningChief
              captures: { c1: "$.data[0].staff_member_id", c2: "$.data[1].staff_member_id", c3: "$.data[2].staff_member_id" }
          assert:
            - "${err} == ERR_INSUFFICIENT_CALLBACK_POOL (HTTP 422) — 4 requested from a pool of exactly 3"
            - "The failed 4-request call created zero CallBackRequest rows (atomic reject)"
            - "Second call returns exactly 3 requests (count == pool size is allowed)"
            - "Selection order is ${c1} == ${s1}, ${c2} == ${s2}, ${c3} == ${s3} (callback_seniority_score DESC)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: exercise_start_requires_plan_approved
        grounds:
          - state_machines.ExerciseEvent.SCHEDULED_to_IN_PROGRESS
          - state_machines.PlanRevision.DRAFT_to_IN_REVIEW
          - errors[ERR_PLAN_NOT_APPROVED]
        distinguishing_aspect: |
          Entity pair ExerciseEvent → PlanRevision: the exercise's SCHEDULED→IN_PROGRESS
          transition is gated by the referenced plan's APPROVED state; the same start succeeds
          after the plan completes its own review cycle.
        test_recipe:
          setup:
            - "Staff u_em (creator) and u_ha (approver) exist; plan DRAFT; exercise SCHEDULED referencing it"
          setup_api_calls:
            - call: "POST /emergency/staff-members"
              payload: { full_name: "Em User", badge_number: "B-900", department: "ADMINISTRATION", role_qualifications: [] }
              as: HospitalAdministrator
              captures: { u_em: $.data.id }
            - call: "POST /emergency/staff-members"
              payload: { full_name: "Ha User", badge_number: "B-901", department: "ADMINISTRATION", role_qualifications: [] }
              as: HospitalAdministrator
              captures: { u_ha: $.data.id }
            - call: "POST /emergency/plan-revisions"
              payload: { revision_label: "EOP-2026-A", change_summary: "annual refresh", effective_date: "2026-09-01T00:00:00Z" }
              as: EmergencyManager
              as_user_id: "${u_em}"
              captures: { plan_id: $.data.id }
            - call: "POST /emergency/exercises"
              payload: { exercise_name: "Tabletop Alpha", exercise_type: "TABLETOP", scenario_category: "NATURAL", scheduled_start: "2026-09-10T10:00:00Z", scheduled_end: "2026-09-10T12:00:00Z", plan_revision_id: "${plan_id}" }
              as: EmergencyManager
              captures: { ex_id: $.data.id }
          trigger:
            - call: "POST /emergency/exercises/${ex_id}/start"
              as: EmergencyManager
              captures: { err: $.data.error_id }
            - call: "POST /emergency/plan-revisions/${plan_id}/submit-review"
              as: EmergencyManager
              as_user_id: "${u_em}"
            - call: "POST /emergency/plan-revisions/${plan_id}/approve"
              as: HospitalAdministrator
              as_user_id: "${u_ha}"
            - call: "POST /emergency/exercises/${ex_id}/start"
              as: EmergencyManager
              captures: { st: $.data.status }
          assert:
            - "${err} == ERR_PLAN_NOT_APPROVED (HTTP 422) while the plan is DRAFT"
            - "${st} == IN_PROGRESS after the plan reached APPROVED"
            - "ExerciseEvent.${ex_id}.started_at is set"

      - name: inquiry_match_requires_record_tracked
        grounds:
          - state_machines.FamilyInquiry.OPEN_to_MATCHED
          - state_machines.PatientTrackRecord.TRACKED_to_DISCHARGED
          - errors[ERR_PATIENT_NOT_TRACKED]
        distinguishing_aspect: |
          Entity pair FamilyInquiry → PatientTrackRecord (a different pair than
          ExerciseEvent → PlanRevision): match is gated on the record's TRACKED state; a
          DISCHARGED record with the correct patient_ref on the same incident is rejected.
        test_recipe:
          setup:
            - "Incident ACTIVATED; patient P-7 registered then DISCHARGED; inquiry seeking P-7 OPEN"
          setup_api_calls:
            - call: "POST /emergency/incidents"
              payload: { incident_name: "MCI-match", incident_type: "HUMAN", declared_at: "2026-08-01T00:00:00Z" }
              as: IncidentCommander
              captures: { inc_id: $.data.id }
            - call: "POST /emergency/patient-records"
              payload: { incident_id: "${inc_id}", patient_ref: "P-7", triage_category: "DELAYED", arrival_at: "2026-08-01T00:05:00Z" }
              as: PlanningChief
              captures: { r1: $.data.id }
            - call: "POST /emergency/patient-records/${r1}/discharge"
              as: PlanningChief
            - call: "POST /emergency/family-inquiries"
              payload: { incident_id: "${inc_id}", inquirer_name: "Robin", inquirer_phone: "555-0101", sought_patient_ref: "P-7" }
              as: PublicInformationOfficer
              captures: { q1: $.data.id }
          trigger:
            - call: "POST /emergency/family-inquiries/${q1}/match"
              payload: { patient_record_id: "${r1}" }
              as: PublicInformationOfficer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_PATIENT_NOT_TRACKED (HTTP 422) — record is DISCHARGED despite correct ref and incident"
            - "FamilyInquiry.${q1}.status remains OPEN"

  - rule_id: resource_temporal_overlap
    instances:
      - name: exercise_half_open_interval_adjacency
        grounds:
          - validations[priority=13]
          - errors[ERR_EXERCISE_TIME_CONFLICT]
          - entities.ExerciseEvent.fields.scheduled_start
        distinguishing_aspect: |
          Resource ExerciseEvent with half-open [start, end) semantics: a back-to-back exercise
          whose start equals the predecessor's end is accepted, while a 1-hour straddling
          overlap is rejected.
        test_recipe:
          setup:
            - "A DRAFT plan revision to reference (plan approval not required at creation)"
          setup_api_calls:
            - call: "POST /emergency/plan-revisions"
              payload: { revision_label: "EOP-2026-X", change_summary: "overlap probe", effective_date: "2026-09-01T00:00:00Z" }
              as: EmergencyManager
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /emergency/exercises"
              payload: { exercise_name: "Ex-A", exercise_type: "FUNCTIONAL", scenario_category: "HAZMAT", scheduled_start: "2026-09-01T10:00:00Z", scheduled_end: "2026-09-01T12:00:00Z", plan_revision_id: "${plan_id}" }
              as: EmergencyManager
              captures: { exa: $.data.id }
            - call: "POST /emergency/exercises"
              payload: { exercise_name: "Ex-B", exercise_type: "FUNCTIONAL", scenario_category: "HAZMAT", scheduled_start: "2026-09-01T12:00:00Z", scheduled_end: "2026-09-01T14:00:00Z", plan_revision_id: "${plan_id}" }
              as: EmergencyManager
              captures: { exb: $.data.id }
            - call: "POST /emergency/exercises"
              payload: { exercise_name: "Ex-C", exercise_type: "TABLETOP", scenario_category: "HUMAN", scheduled_start: "2026-09-01T11:00:00Z", scheduled_end: "2026-09-01T13:00:00Z", plan_revision_id: "${plan_id}" }
              as: EmergencyManager
              captures: { err: $.data.error_id }
          assert:
            - "Ex-A and Ex-B both created (201): B.start == A.end is adjacency, not overlap, under half-open semantics"
            - "${err} == ERR_EXERCISE_TIME_CONFLICT (HTTP 409): Ex-C [11:00,13:00) straddles both A and B"

      - name: acs_commit_buffered_window_conflict
        grounds:
          - validations[priority=13]
          - errors[ERR_SITE_WINDOW_CONFLICT]
          - entities.AlternateCareSite.fields.commitments
        distinguishing_aspect: |
          Resource AlternateCareSite with buffered-interval semantics (different geometric
          treatment than the exercise half-open rule): a new commitment must keep a 4-hour
          turnover buffer from every existing window — a 2-hour gap conflicts, a gap of exactly
          4 hours is accepted (conflict iff new_start < existing_end + 4h).
        test_recipe:
          setup:
            - "Incident ACTIVATED; site registered (STANDBY)"
          setup_api_calls:
            - call: "POST /emergency/incidents"
              payload: { incident_name: "MCI-buffer", incident_type: "NATURAL", declared_at: "2026-08-01T00:00:00Z" }
              as: IncidentCommander
              captures: { inc_id: $.data.id }
            - call: "POST /emergency/alternate-care-sites"
              payload: { site_name: "Arena", address: "7 Arena Blvd", bed_capacity: 60 }
              as: LogisticsChief
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /emergency/alternate-care-sites/${site_id}/commit"
              payload: { incident_id: "${inc_id}", window_start: "2026-08-01T08:00:00Z", window_end: "2026-08-01T16:00:00Z" }
              as: IncidentCommander
            - call: "POST /emergency/alternate-care-sites/${site_id}/commit"
              payload: { incident_id: "${inc_id}", window_start: "2026-08-01T18:00:00Z", window_end: "2026-08-02T02:00:00Z" }
              as: IncidentCommander
              captures: { err: $.data.error_id }
            - call: "POST /emergency/alternate-care-sites/${site_id}/commit"
              payload: { incident_id: "${inc_id}", window_start: "2026-08-01T20:00:00Z", window_end: "2026-08-02T04:00:00Z" }
              as: IncidentCommander
          assert:
            - "First commit succeeds; site status becomes COMMITTED"
            - "${err} == ERR_SITE_WINDOW_CONFLICT (HTTP 409): 18:00 < 16:00 + 4h buffer"
            - "Third commit at exactly 20:00 (16:00 + 4h) succeeds: the buffered boundary is exclusive, so an exactly-4h gap is allowed; site ends with 2 commitments"

  - rule_id: compensating_invariant
    instances:
      - name: callback_accept_then_cancel_conserves_committed_headcount
        grounds:
          - state_machines.CallBackRequest.PENDING_to_ACCEPTED
          - state_machines.CallBackRequest.ACCEPTED_to_CANCELLED
          - calculations.committed_staffing
        distinguishing_aspect: |
          Conserved quantity: incident committed headcount. committed_staff_count =
          |{cb : cb.incident_id == I and cb.status == ACCEPTED}|; an ACCEPT followed by a
          CANCEL of the same request must return the count to its pre-accept value.
        test_recipe:
          setup:
            - "Callback-eligible staff member; ACTIVATED incident; PENDING request cb1"
          setup_api_calls:
            - call: "POST /emergency/staff-members"
              payload: { full_name: "D Four", badge_number: "B-504", department: "ICU", role_qualifications: [], callback_eligible: true, callback_seniority_score: 5 }
              as: HospitalAdministrator
              captures: { s1: $.data.id }
            - call: "POST /emergency/incidents"
              payload: { incident_name: "MCI-inv", incident_type: "HUMAN", declared_at: "2026-08-01T00:00:00Z" }
              as: IncidentCommander
              captures: { inc_id: $.data.id }
            - call: "POST /emergency/callback-requests"
              payload: { incident_id: "${inc_id}", staff_member_id: "${s1}" }
              as: PlanningChief
              captures: { cb1: "$.data[0].id" }
            - call: "GET /emergency/incidents/${inc_id}"
              as: PlanningChief
              captures: { before: $.data.committed_staff_count }
          trigger:
            - call: "POST /emergency/callback-requests/${cb1}/respond"
              payload: { outcome: "ACCEPT" }
              as: OnCallStaff
              as_user_id: "${s1}"
            - call: "GET /emergency/incidents/${inc_id}"
              as: PlanningChief
              captures: { mid: $.data.committed_staff_count }
            - call: "POST /emergency/callback-requests/${cb1}/cancel"
              as: PlanningChief
            - call: "GET /emergency/incidents/${inc_id}"
              as: PlanningChief
              captures: { after: $.data.committed_staff_count }
          assert:
            - "${before} == 0"
            - "${mid} == 1 (accept incremented)"
            - "${after} == 0 (cancel compensated): after == before, no drift in committed_staff_count"

      - name: stock_issue_then_return_conserves_quantity_on_hand
        grounds:
          - calculations.ppe_burn_rate
          - entities.SupplyItem.fields.quantity_on_hand
          - entities.StockTransaction.fields.transaction_type
        distinguishing_aspect: |
          Conserved quantity: supply stock units (a different conserved quantity than staffing
          headcount). quantity_on_hand after ISSUE(q) followed by RETURN(q) must equal the
          pre-issue value; the paired entries also net to zero inside the burn window.
        test_recipe:
          setup:
            - "SupplyItem with RECEIVE 10 in-window (quantity_on_hand == 10); no incident active"
          setup_api_calls:
            - call: "POST /emergency/supply-items"
              payload: { item_name: "IV kits", category: "OTHER_SUPPLY", unit: "each", reorder_min_days: 3 }
              as: LogisticsChief
              captures: { item_id: $.data.id }
            - call: "POST /emergency/stock-transactions"
              payload: { supply_item_id: "${item_id}", transaction_type: "RECEIVE", quantity: 10, occurred_at: "2026-07-30T09:00:00Z" }
              as: LogisticsChief
            - call: "GET /emergency/supply-items/${item_id}"
              as: LogisticsChief
              captures: { q0: $.data.quantity_on_hand }
          trigger:
            - call: "POST /emergency/stock-transactions"
              payload: { supply_item_id: "${item_id}", transaction_type: "ISSUE", quantity: 4, occurred_at: "2026-07-30T10:00:00Z" }
              as: LogisticsChief
            - call: "GET /emergency/supply-items/${item_id}"
              as: LogisticsChief
              captures: { q1: $.data.quantity_on_hand }
            - call: "POST /emergency/stock-transactions"
              payload: { supply_item_id: "${item_id}", transaction_type: "RETURN", quantity: 4, occurred_at: "2026-07-30T11:00:00Z" }
              as: LogisticsChief
            - call: "GET /emergency/supply-items/${item_id}"
              as: LogisticsChief
              captures: { q2: $.data.quantity_on_hand, obs: $.data.observed_daily_burn_rate, days: $.data.days_of_supply }
          assert:
            - "${q0} == 10"
            - "${q1} == 6 (after ISSUE 4)"
            - "${q2} == 10 (after RETURN 4): q2 == q0, no drift in quantity_on_hand"
            - "${obs} == 0.0 (4 issued − 4 returned nets to 0 in the burn window)"
            - "${days} == null (zero projected burn ⇒ days_of_supply is null, not infinity or 0)"
