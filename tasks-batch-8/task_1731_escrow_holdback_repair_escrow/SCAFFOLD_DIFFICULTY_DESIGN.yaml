              as: EscrowOfficer
              captures: { hb_id: $.data.id }
            - { call: "POST /escrow/holdbacks/${hb_id}/submit", payload: {}, as: EscrowOfficer }
            - call: "GET /escrow/holdbacks/${hb_id}/approvals"
              as: EscrowOfficer
              captures: { ap_l: "$.data[0].id" }
            - { call: "POST /escrow/approvals/${ap_l}/decide", payload: { decision: "APPROVED" }, as: Lender, as_user_id: "lender_1" }
            - call: "POST /escrow/inspections"
              payload: { holdback_id: "${hb_id}", inspector_user_id: "insp_1", purpose: "DRAW_VERIFICATION", scheduled_start: "2026-08-20T10:00:00Z", scheduled_end: "2026-08-20T11:00:00Z" }
              as: EscrowOfficer
              captures: { ins_1: $.data.id }
          trigger:
            - call: "POST /escrow/inspections"
              payload: { holdback_id: "${hb_id}", inspector_user_id: "insp_2", purpose: "DRAW_VERIFICATION", scheduled_start: "2026-08-20T11:00:00Z", scheduled_end: "2026-08-20T12:00:00Z" }
              as: EscrowOfficer
              captures: { adj_err: $.data.error_id }
            - call: "POST /escrow/inspections"
              payload: { holdback_id: "${hb_id}", inspector_user_id: "insp_2", purpose: "DRAW_VERIFICATION", scheduled_start: "2026-08-20T11:00:01Z", scheduled_end: "2026-08-20T12:00:00Z" }
              as: EscrowOfficer
              captures: { ok_status: $.data.status }
          assert:
            - "adj_err == ERR_INSPECTION_SLOT_OCCUPIED (closed intervals: adjacency at 11:00:00 conflicts on the property slot, even though insp_2's own calendar is free)"
            - "ok_status == PLANNED (one-second gap suffices under closed semantics)"

