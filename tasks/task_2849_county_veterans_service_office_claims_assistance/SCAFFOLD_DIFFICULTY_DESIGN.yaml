              as: SystemAdmin
              captures: { prog_exact: $.data.id }
            - call: "POST /cvso/state-programs"
              payload: { program_code: "TUI-2026-SHORT", program_name: "Tuition Waiver Pool One Cent Short", program_type: "TUITION_WAIVER", fiscal_year: 2026, annual_pool_cents: 989999, min_rating_pct: 0, requires_wartime: false, max_award_cents: 990000 }
              as: SystemAdmin
              captures: { prog_short: $.data.id }
            - call: "POST /cvso/veterans"
              payload: { full_name: "Alex Rivera", date_of_birth: "1979-03-04", service_start_date: "2001-09-11", service_end_date: "2005-09-10", household_income_cents: 1500000, net_worth_cents: 2000000, dependent_count: 2, homeless_status: "NOT_HOMELESS", referral_source: "WALK_IN" }
              as: IntakeClerk
              captures: { vet: $.data.id }
            - call: "POST /cvso/veterans/${vet}/discharge-documents"
              payload: { document_type: "DD214", source: "VETERAN_PROVIDED", claimed_service_start: "2001-09-11", claimed_service_end: "2005-09-10", claimed_character_of_service: "HONORABLE" }
              as: IntakeClerk
              captures: { doc: $.data.id }
            - call: "POST /cvso/discharge-documents/${doc}/review"
              payload: { action: "VERIFY" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/veterans/${vet}/screen"
              payload: {}
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "GET /cvso/state-programs/${prog_exact}"
              payload: {}
              as: SystemAdmin
              captures: { pe_v: $.data.version }
            - call: "POST /cvso/state-benefit-applications"
              payload: { veteran_id: "${vet}", program_id: "${prog_exact}", fiscal_year: 2026, expected_program_version: "${pe_v}", tuition_credits_requested: 22 }
              as: IntakeClerk
              captures: { app_exact: $.data.id }
            - call: "GET /cvso/state-programs/${prog_short}"
              payload: {}
              as: SystemAdmin
              captures: { ps_v: $.data.version }
            - call: "POST /cvso/state-benefit-applications"
              payload: { veteran_id: "${vet}", program_id: "${prog_short}", fiscal_year: 2026, expected_program_version: "${ps_v}", tuition_credits_requested: 22 }
              as: IntakeClerk
              captures: { app_short: $.data.id }
          trigger:
