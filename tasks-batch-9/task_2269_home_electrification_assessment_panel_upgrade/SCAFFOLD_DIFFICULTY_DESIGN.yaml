              as_user_id: "admin-1"
            - call: "POST /contractors"
              payload: { program_id: "${prog_id}", business_name: "Cycle Electric", license_number: "EC-1111", license_expires_on: "2027-06-30", insurance_expires_on: "2027-06-30" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ctr_a: $.data.id }
            - call: "POST /contractors/${ctr_a}/enrollment-decision"
              payload: { decision: "APPROVE" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "POST /contractors"
              payload: { program_id: "${prog_id}", business_name: "Barred Wiring", license_number: "EC-2222", license_expires_on: "2027-06-30", insurance_expires_on: "2027-06-30" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ctr_b: $.data.id }
            - call: "POST /contractors/${ctr_b}/enrollment-decision"
              payload: { decision: "REJECT", decision_notes: "Unresolved licensing complaint" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "POST /households"
              payload: { program_id: "${prog_id}", applicant_name: "Hana Ito", email: "hana@example.com", service_address_line1: "31 Hazel St", county_code: "CO-031", utility_territory_code: "XCEL-CO", household_size: 4, existing_panel_amps: 200 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/income-verifications"
              payload: { annual_household_income_cents: 8000000, county_median_income_cents: 10000000, household_size_attested: 4 }
              as: Applicant
              as_user_id: "${hh_id}"
              captures: { iv_id: $.data.id }
            - call: "POST /income-verifications/${iv_id}/verify"
              payload: { decision: "VERIFY" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "GET /households/${hh_id}"
