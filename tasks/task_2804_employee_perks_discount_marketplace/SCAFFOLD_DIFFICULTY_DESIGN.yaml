              as: PartnerManager
              as_user_id: "pm-001"
              captures: { agreement_v1: $.data.version }
            - call: "POST /perks/agreements/${agreement_id}/counter"
              payload: { expected_agreement_version: "${agreement_v1}", commission_rate_bps: 900, placement_fee_base_cents: 30000, employer_revenue_share_bps: 1000, note: "round 2" }
              as: Merchant
              as_user_id: "${merchant_id}"
              captures: { agreement_v2: $.data.version }
            - call: "POST /perks/agreements/${agreement_id}/propose"
              payload: { expected_agreement_version: "${agreement_v2}", commission_rate_bps: 1100, placement_fee_base_cents: 34000, employer_revenue_share_bps: 2000, note: "round 3" }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { agreement_v3: $.data.version }
            - call: "POST /perks/agreements/${agreement_id}/counter"
              payload: { expected_agreement_version: "${agreement_v3}", commission_rate_bps: 1000, placement_fee_base_cents: 32000, employer_revenue_share_bps: 1500, note: "round 4" }
              as: Merchant
              as_user_id: "${merchant_id}"
              captures: { agreement_v4: $.data.version }
          trigger:
            - call: "POST /perks/agreements/${agreement_id}/propose"
              payload: { expected_agreement_version: "${agreement_v0}", commission_rate_bps: 1050, placement_fee_base_cents: 33000, employer_revenue_share_bps: 1800, note: "stale round 5" }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { conflict_error: $.data.error_id }
          assert:
            - "${conflict_error} == ERR_STALE_VERSION with HTTP 412"
            - "${conflict_error} != ERR_NEGOTIATION_ROUND_LIMIT, i.e. the priority-80 capacity rule never ran"
            - "PartnerAgreement.${agreement_id}.round_count == 4"
            - "PartnerAgreement.${agreement_id}.status == MERCHANT_COUNTERED"
            - "PartnerAgreement.${agreement_id}.commission_rate_bps == 1000 and PartnerAgreement.${agreement_id}.placement_fee_base_cents == 32000"
            - "PartnerAgreement.${agreement_id}.version == ${agreement_v4}, unchanged by the refused call"
            - "GET /perks/agreements/${agreement_id}/negotiation-rounds returns total_count 4"

