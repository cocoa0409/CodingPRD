      - name: missing_or_undeclared_auth_headers_are_rejected_before_the_role_check
        claim_type: error_triggerable
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_UNAUTHORIZED_ROLE
          - validations.priority_1
          - validations.priority_2
        distinguishing_aspect: |
          Priorities 1 and 2 are the outermost two rings of the ladder and they are distinguished
          by whether the caller is identifiable at all. An empty header value and a role name that
          is not one of the six declared roles are both 401 — not 403 — while a perfectly formed
          SecurityAnalyst caller on a director-only endpoint is 403. The same endpoint is used for
          all four calls so nothing but the headers varies.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z; one director staff row and one AVAILABLE vendor"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
