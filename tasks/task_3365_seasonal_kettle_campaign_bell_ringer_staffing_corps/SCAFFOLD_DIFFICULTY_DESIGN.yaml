  - rule_id: resource_temporal_overlap
    instances:
      - name: ringer_half_open_overlap_with_rest_buffer
        grounds:
          - validations[priority=19]
          - validations[priority=22]
          - state_machines.Shift.SCHEDULED_to_CANCELLED
          - calculations.shift_paid_amount
        distinguishing_aspect: |
          Interval semantics are half-open [starts_at, ends_at) with a 30-minute adjacency buffer on
          the BellRinger resource: 16:30..17:30 collides with the existing 09:00..17:00 shift and is
          rejected as an overlap, 17:15..18:00 does not overlap but is rejected for leaving only a
          15-minute gap, and 17:30..18:30 is accepted at exactly the 30-minute boundary.
        test_recipe:
          setup:
            - "logical clock at 2026-11-15T00:00:00Z"
            - "one ACTIVE kettle location and one CLEARED, ACTIVE volunteer bell ringer"
            - "one existing SCHEDULED shift 2026-11-16T09:00:00Z..2026-11-16T17:00:00Z"
