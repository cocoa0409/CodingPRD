      - name: statute_status_flips_to_expiring_soon_at_exactly_ninety_days_out
        claim_type: Constants Applied
        grounds: [calculations.statute_expiry.constants.EXPIRING_SOON_DAYS, "endpoints.GET /audits/{id}", entities.Audit.fields.statute_status]
        distinguishing_aspect: |
          scope_period_end 2024-12-31 + STATUTE_BASE_DAYS 1095 gives base expiry
          2027-12-31. With the clock at 2027-10-01 the audit is 91 days out and must
          read PROTECTED; one day later, at exactly 90 days, it must read
          EXPIRING_SOON, because the comparison is
          days_between(clock, expiry) <= 90 inclusive. statute_status is derived on
          every read and never stored, so the same audit row must change answer with
          only the clock moving.
        test_recipe:
          setup:
            - "One taxpayer, one QUOTA project, one converted lead, scope 2023-01-01..2024-12-31, no waivers and no appeals."
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { legal_name: "Harbor Foods LLC", permit_number: "P-2710-C3", industry_naics_code: "445110", filing_frequency: "MONTHLY", gross_receipts_annual_cents: 250000000, delinquent_period_count: 2 }
              as: SelectionAnalyst
              captures: { te_id: "$.data.id" }
            - call: "POST /industry-projects"
              payload: { project_name: "Grocery 2024", industry_naics_code: "445110", industry_error_rate_bp: 4200, selection_mode: "QUOTA", selection_quota: 1 }
              as: SelectionAnalyst
              captures: { proj_id: "$.data.id" }
            - call: "POST /industry-projects/${proj_id}/selection-runs"
              payload: {}
              as: SelectionAnalyst
            - call: "GET /audit-leads"
              payload: { industry_project_id: "${proj_id}", status: "SELECTED" }
              as: SelectionAnalyst
              captures: { lead_id: "$.data[0].id" }
            - call: "POST /audit-leads/${lead_id}/convert"
              payload: { lead_auditor_user_id: "auditor-1", audit_type: "FIELD" }
              as: AuditSupervisor
              as_user_id: "supervisor-1"
              captures: { audit_id: "$.data.id" }
            - call: "POST /audits/${audit_id}/scope"
              payload: { audit_type: "FIELD", scope_period_start: "2023-01-01", scope_period_end: "2024-12-31" }
              as: FieldAuditor
              as_user_id: "auditor-1"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-10-01T00:00:00Z" }
              as: AuditSupervisor
              as_user_id: "supervisor-1"
            - call: "GET /audits/${audit_id}"
              payload: {}
              as: AuditSupervisor
              as_user_id: "supervisor-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-10-02T00:00:00Z" }
              as: AuditSupervisor
              as_user_id: "supervisor-1"
            - call: "GET /audits/${audit_id}"
              payload: {}
              as: AuditSupervisor
              as_user_id: "supervisor-1"
          assert:
            - "Audit.${audit_id}.base_statute_expiry_date == 2027-12-31 and statute_expiry_date == 2027-12-31"
            - "Audit.${audit_id}.waiver_days_added == 0 and tolled_days == 0"
            - "trigger call 2 (clock 2027-10-01, 91 days out): statute_status == PROTECTED"
            - "trigger call 4 (clock 2027-10-02, 90 days out): statute_status == EXPIRING_SOON"
            - "neither GET changed Audit.${audit_id}.version"

      - name: zero_liability_purchases_still_join_the_use_tax_sum
        claim_type: Input Set Filtering
        grounds: [calculations.use_tax_liability.input_set, "endpoints.GET /audits/{id}/use-tax-purchases", entities.UseTaxPurchase.fields.credit_applied_cents]
        distinguishing_aspect: |
          Both rows compute use_tax_due_cents 0 for different reasons — an
          EXEMPT_MANUFACTURING row zeroes the basis outright, and a CONSUMABLE row
          whose other-state tax of 999999 exceeds the gross 4763 has its credit
          clamped to 4763 rather than producing a negative liability — and both must
          still be stored, listed and counted. Audit.use_tax_deficiency_cents must be
          exactly 0, not null and not -995236.
