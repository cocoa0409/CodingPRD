            - "ManifestAssignment.${a1}.status == DEPLOYED and Payload.${pl1}.status == DEPLOYED"
            - "LaunchContract.${ct_id}.status == FULFILLED (bubble-up: all payloads deployed)"
            - "Mission.${m_id}.status == COMPLETED (bubble-up: all separation events executed)"
            - "the repeat report-outcome returns 409 and err_repeat == ERR_INVALID_STATE (terminal lockdown)"

  # ===========================================================================
  - section: calculations
