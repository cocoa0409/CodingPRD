              as: ClubOfficer
              captures: { inv_id: $.data.id }
            - call: "POST /club/dues-payments"
              payload: { invoice_id: "${inv_id}", member_id: "${member_id}", amount_cents: 120000 }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /club/telescopes"
              payload: { name: "Adj Scope 1", equipment_class: "REFRACTOR" }
              as: EquipmentChair
              captures: { scope1: $.data.id }
            - call: "POST /club/telescopes"
              payload: { name: "Adj Scope 2", equipment_class: "REFRACTOR" }
              as: EquipmentChair
              captures: { scope2: $.data.id }
            - call: "POST /club/training-certifications"
              payload: { member_id: "${member_id}", equipment_class: "REFRACTOR", expires_at: "2027-08-01T00:00:00Z" }
              as: EquipmentChair
            - call: "POST /club/loan-reservations"
              payload: { member_id: "${member_id}", telescope_id: "${scope1}", window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-09T00:00:00Z" }
              as: Member
              as_user_id: "${member_id}"
              captures: { loan1: $.data.id }
          trigger:
            - call: "POST /club/loan-reservations"
              payload: { member_id: "${member_id}", telescope_id: "${scope2}", window_start: "2026-08-09T00:00:00Z", window_end: "2026-08-12T00:00:00Z" }
              as: Member
              as_user_id: "${member_id}"
              captures: { adj_status: $.data.status }
            - call: "POST /club/loan-reservations"
              payload: { member_id: "${member_id}", telescope_id: "${scope2}", window_start: "2026-08-08T23:00:00Z", window_end: "2026-08-13T00:00:00Z" }
              as: Member
              as_user_id: "${member_id}"
              captures: { err_overlap: $.data.error_id }
          assert:
            - "adj_status == RESERVED (half-open: member's new loan starting exactly at loan1.window_end is legal)"
            - "err_overlap == ERR_LOAN_WINDOW_CONFLICT (start one hour before loan1.window_end intersects [08-05, 08-09))"

      - name: operator_overlap_closed_touch
        grounds:
          - validations[priority=13]
          - errors[ERR_OPERATOR_OVERLAP]
        distinguishing_aspect: |
          Different resource (Member operator time, not Telescope) AND
          different interval semantics: CLOSED-touch counts as overlap
          (teardown buffer) — a second event starting exactly at the first
          event's window_end still conflicts, the opposite geometric rule
          from the loan half-open case.
        test_recipe:
          setup:
            - "Member ACTIVE dues-current with DOBSONIAN cert; events E1 01:00-05:00 and E2 05:00-09:00 same night; telescopes D1/D2; assignment on E1 CONFIRMED"
          setup_api_calls:
            - call: "POST /club/membership-tiers"
              payload: { code: "INDIVIDUAL", annual_dues_cents: 120000, observatory_access_level: 2, loan_privilege: true, max_concurrent_loans: 2 }
              as: ClubOfficer
              captures: { tier_id: $.data.id }
            - call: "POST /club/members"
              payload: { full_name: "Touching Tim", email: "tim@x.com", tier_id: "${tier_id}" }
              as: ClubOfficer
              captures: { member_id: $.data.id }
            - call: "POST /club/dues-invoices"
              payload: { member_id: "${member_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2027-08-01T00:00:00Z" }
              as: ClubOfficer
              captures: { inv_id: $.data.id }
            - call: "POST /club/dues-payments"
              payload: { invoice_id: "${inv_id}", member_id: "${member_id}", amount_cents: 120000 }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /club/telescopes"
              payload: { name: "Dob 1", equipment_class: "DOBSONIAN" }
              as: EquipmentChair
              captures: { d1: $.data.id }
            - call: "POST /club/telescopes"
              payload: { name: "Dob 2", equipment_class: "DOBSONIAN" }
              as: EquipmentChair
              captures: { d2: $.data.id }
            - call: "POST /club/training-certifications"
              payload: { member_id: "${member_id}", equipment_class: "DOBSONIAN", expires_at: "2027-08-01T00:00:00Z" }
              as: EquipmentChair
            - call: "POST /club/observing-events"
              payload: { title: "E1", event_kind: "MEMBER_NIGHT", window_start: "2026-08-15T01:00:00Z", window_end: "2026-08-15T05:00:00Z", moon_illumination_pct: 90, min_operators: 1 }
              as: EventCoordinator
              captures: { e1: $.data.id }
            - call: "POST /club/observing-events"
              payload: { title: "E2", event_kind: "MEMBER_NIGHT", window_start: "2026-08-15T05:00:00Z", window_end: "2026-08-15T09:00:00Z", moon_illumination_pct: 90, min_operators: 1 }
              as: EventCoordinator
              captures: { e2: $.data.id }
            - call: "POST /club/event-operator-assignments"
              payload: { event_id: "${e1}", member_id: "${member_id}", telescope_id: "${d1}" }
              as: EventCoordinator
              captures: { a1: $.data.id }
            - call: "POST /club/event-operator-assignments/${a1}/accept"
              payload: {}
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /club/event-operator-assignments"
              payload: { event_id: "${e2}", member_id: "${member_id}", telescope_id: "${d2}" }
              as: EventCoordinator
              captures: { a2: $.data.id }
          trigger:
            - call: "POST /club/event-operator-assignments/${a2}/accept"
              payload: {}
              as: Member
              as_user_id: "${member_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_OPERATOR_OVERLAP (E2.window_start == E1.window_end exactly; closed-touch semantics makes this a conflict unlike loans)"
            - "EventOperatorAssignment.${a2}.status == INVITED (unchanged)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: telescope_availability_conservation
        grounds:
          - state_machines.Telescope
          - state_machines.LoanReservation
        distinguishing_aspect: |
          Conserved quantity: telescope count by status. Invariant: for any
          non-RETIRED telescope, exactly one of {AVAILABLE, RESERVED,
          ON_LOAN, MAINTENANCE} holds; forward action (reserve) + compensating
          action (cancel) returns status to AVAILABLE with version advanced
          but no drift in the availability pool — reserve-then-cancel leaves
          count(status==AVAILABLE) unchanged.
        test_recipe:
          setup:
            - "Member standing; telescope T AVAILABLE; no loans"
          setup_api_calls:
            - call: "POST /club/membership-tiers"
              payload: { code: "INDIVIDUAL", annual_dues_cents: 120000, observatory_access_level: 2, loan_privilege: true, max_concurrent_loans: 2 }
              as: ClubOfficer
              captures: { tier_id: $.data.id }
            - call: "POST /club/members"
              payload: { full_name: "Conserve Kay", email: "kay@x.com", tier_id: "${tier_id}" }
              as: ClubOfficer
              captures: { member_id: $.data.id }
            - call: "POST /club/dues-invoices"
              payload: { member_id: "${member_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2027-08-01T00:00:00Z" }
              as: ClubOfficer
              captures: { inv_id: $.data.id }
            - call: "POST /club/dues-payments"
              payload: { invoice_id: "${inv_id}", member_id: "${member_id}", amount_cents: 120000 }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /club/telescopes"
              payload: { name: "Pool Scope", equipment_class: "REFRACTOR" }
              as: EquipmentChair
              captures: { scope_id: $.data.id }
            - call: "POST /club/training-certifications"
              payload: { member_id: "${member_id}", equipment_class: "REFRACTOR", expires_at: "2027-08-01T00:00:00Z" }
              as: EquipmentChair
            - call: "GET /club/telescopes"
              payload: { status: "AVAILABLE" }
              as: EquipmentChair
              captures: { avail_before: "$.data[0].status" }
          trigger:
            - call: "POST /club/loan-reservations"
              payload: { member_id: "${member_id}", telescope_id: "${scope_id}", window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-07T00:00:00Z" }
              as: Member
              as_user_id: "${member_id}"
              captures: { loan_id: $.data.id }
            - call: "POST /club/loan-reservations/${loan_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${member_id}"
            - call: "GET /club/telescopes/${scope_id}"
              payload: {}
              as: EquipmentChair
              captures: { final_status: $.data.status }
          assert:
            - "final_status == AVAILABLE (forward reserve + compensating cancel conserves the availability pool)"
            - "LoanReservation.${loan_id}.status == CANCELLED"
            - "count(telescopes with status==AVAILABLE) unchanged versus before the pair"

      - name: dues_payment_credit_conservation
        grounds:
          - state_machines.DuesInvoice.OPEN_to_PAID
          - calculations.dues_proration
        distinguishing_aspect: |
          Different conserved quantity: cents across the dues ledger.
          Invariant: sum(payments) == sum(invoice amounts consumed) +
          member_credit_balance. An overpayment of 150000 against a 120000
          invoice must conserve the 30000 as credit; voiding a second OPEN
          invoice conserves the credit untouched (no drift, no double-spend).
        test_recipe:
          setup:
            - "Member with tier 120000; invoice I1 120000 OPEN; payment 150000"
          setup_api_calls:
            - call: "POST /club/membership-tiers"
              payload: { code: "INDIVIDUAL", annual_dues_cents: 120000, observatory_access_level: 2, loan_privilege: true, max_concurrent_loans: 2 }
              as: ClubOfficer
              captures: { tier_id: $.data.id }
            - call: "POST /club/members"
              payload: { full_name: "Ledger Liz", email: "liz@x.com", tier_id: "${tier_id}" }
              as: ClubOfficer
              captures: { member_id: $.data.id }
            - call: "POST /club/dues-invoices"
              payload: { member_id: "${member_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2027-08-01T00:00:00Z" }
              as: ClubOfficer
              captures: { inv1: $.data.id, inv1_amt: $.data.amount_cents }
          trigger:
            - call: "POST /club/dues-payments"
              payload: { invoice_id: "${inv1}", member_id: "${member_id}", amount_cents: 150000 }
              as: Member
              as_user_id: "${member_id}"
              captures: { pay_id: $.data.id, credit_applied: $.data.credit_applied_cents }
            - call: "GET /club/dues-invoices/${inv1}"
              payload: {}
              as: ClubOfficer
              captures: { inv1_status: $.data.status }
          assert:
            - "inv1_status == PAID"
            - "credit_applied == 0 (the overpayment CREATES 30000 credit; none was consumed by this settlement)"
            - "conservation: 150000 tendered == 120000 consumed by invoice + 30000 credit outstanding"
            - "Member.${member_id}.dues_paid_through == 2027-08-01T00:00:00Z"
