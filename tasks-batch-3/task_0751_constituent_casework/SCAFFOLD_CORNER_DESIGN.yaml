scaffold_corner_design:
  # =================================================================
  - section: entities
    instances:
      - name: constituent_create_returns_all_fields
        claim_type: Creation
        grounds: ["entities.Constituent", "endpoints.POST_/constituents"]
        distinguishing_aspect: "POST /constituents with all required fields returns 201 and a Constituent with status=ACTIVE, upcoming_event_count=0, and a server-minted id/created_at."
        test_recipe:
          setup: ["A representative to own the constituent."]
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Rep AA", chamber: "HOUSE", district_name: "CA-1", state_code: "CA", office_email: "aa@leg.gov" }
              as: OfficeAdmin
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /constituents"
              payload: { representative_id: "${rep_id}", full_name: "New Cy", email: "new@x.com", address: "1 Ave" }
              as: OfficeAdmin
              captures: { con_id: $.data.id }
          assert:
            - "Response is 201; Constituent.${con_id}.status == ACTIVE"
            - "Constituent.${con_id}.upcoming_event_count == 0 and version == 1"

      - name: case_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_CASE_NOT_FOUND]", "endpoints.GET_/cases/{id}"]
        distinguishing_aspect: "GET /cases/{nonexistent-uuid} returns 404 with data.error_id == ERR_CASE_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB (no cases)."]
          setup_api_calls: []
          trigger:
            - call: "GET /cases/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Caseworker
          assert:
            - "Response is 404 with data.error_id == ERR_CASE_NOT_FOUND"

      - name: constituent_missing_email_rejected
        claim_type: Required Fields
        grounds: ["entities.Constituent.fields.email", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /constituents omitting the required email field returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["A representative exists."]
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Rep AB", chamber: "SENATE", district_name: "NY-1", state_code: "NY", office_email: "ab@leg.gov" }
              as: OfficeAdmin
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /constituents"
              payload: { representative_id: "${rep_id}", full_name: "No Email", address: "2 Ave" }
              as: OfficeAdmin
          assert:
            - "Response is 400 with data.error_id == ERR_INVALID_REQUEST"

      - name: constituent_consent_defaults_false
        claim_type: Defaults
        grounds: ["entities.Constituent.fields.contact_consent", "entities.Constituent.fields.data_sharing_consent"]
        distinguishing_aspect: "Omitting contact_consent and data_sharing_consent applies the false defaults."
        test_recipe:
          setup: ["A representative exists."]
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Rep AC", chamber: "HOUSE", district_name: "NY-2", state_code: "NY", office_email: "ac@leg.gov" }
              as: OfficeAdmin
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /constituents"
              payload: { representative_id: "${rep_id}", full_name: "Def Cy", email: "def@x.com", address: "3 Ave" }
              as: OfficeAdmin
              captures: { con_id: $.data.id }
          assert:
            - "Constituent.${con_id}.contact_consent == false and Constituent.${con_id}.data_sharing_consent == false"

      - name: newsletter_recipient_count_and_cost_computed
        claim_type: Computed Fields
        grounds: ["calculations.newsletter_reach_and_cost", "entities.NewsletterCampaign.fields.recipient_count", "entities.NewsletterCampaign.fields.send_cost_cents"]
        distinguishing_aspect: "With 2 ACTIVE consenting constituents (contact_consent=true) and 1 non-consenting, a 3-page newsletter yields recipient_count=2 and send_cost_cents=2*(55+8*3)=158."
        test_recipe:
          setup: ["A representative with two contact-consenting constituents and one non-consenting constituent."]
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Rep AD", chamber: "HOUSE", district_name: "NY-4", state_code: "NY", office_email: "ad@leg.gov" }
              as: OfficeAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /constituents"
              payload: { representative_id: "${rep_id}", full_name: "C1", email: "c1@x.com", address: "a", contact_consent: true }
              as: OfficeAdmin
            - call: "POST /constituents"
              payload: { representative_id: "${rep_id}", full_name: "C2", email: "c2@x.com", address: "b", contact_consent: true }
              as: OfficeAdmin
            - call: "POST /constituents"
              payload: { representative_id: "${rep_id}", full_name: "C3", email: "c3@x.com", address: "c", contact_consent: false }
              as: OfficeAdmin
          trigger:
            - call: "POST /representatives/${rep_id}/newsletters"
              payload: { subject: "Update", body: "Hello", page_count: 3 }
              as: OfficeAdmin
              captures: { camp_id: $.data.id }
          assert:
            - "NewsletterCampaign.${camp_id}.recipient_count == 2"
            - "NewsletterCampaign.${camp_id}.send_cost_cents == 158"
            - "NewsletterCampaign.${camp_id}.status == SENT"

  # =================================================================
  - section: state_machines
    instances:
      - name: close_case_from_new_rejected
        claim_type: Invalid Transitions
        grounds: ["state_machines.Case.RESOLVED_to_CLOSED", "errors[ERR_CASE_INVALID_STATE]"]
        distinguishing_aspect: "POST /cases/{id}/close on a NEW (never resolved) case returns 409 ERR_CASE_INVALID_STATE; no closed_at is set."
        test_recipe:
          setup: ["A NEW case."]
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Rep AE", chamber: "HOUSE", district_name: "NY-5", state_code: "NY", office_email: "ae@leg.gov" }
              as: OfficeAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /constituents"
              payload: { representative_id: "${rep_id}", full_name: "Cy AE", email: "ae@x.com", address: "d" }
              as: OfficeAdmin
              captures: { con_id: $.data.id }
            - call: "POST /cases"
              payload: { constituent_id: "${con_id}", subject: "S", description: "d", category: "OTHER" }
              as: Caseworker
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /cases/${case_id}/close"
              payload: {}
              as: OfficeAdmin
          assert:
            - "Response is 409 with data.error_id == ERR_CASE_INVALID_STATE"

      - name: referral_resolve_from_draft_rejected
        claim_type: Invalid Transitions
        grounds: ["state_machines.AgencyReferral.SENT_to_RESOLVED", "errors[ERR_REFERRAL_INVALID_STATE]"]
        distinguishing_aspect: "POST /agency-referrals/{id}/resolve on a DRAFT (unsent) referral returns 409 ERR_REFERRAL_INVALID_STATE and does not touch the agency ledger."
        test_recipe:
          setup: ["A triaged case with consent referred to an ACTIVE agency, referral still DRAFT (not sent)."]
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Rep AF", chamber: "HOUSE", district_name: "NY-6", state_code: "NY", office_email: "af@leg.gov" }
              as: OfficeAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /constituents"
              payload: { representative_id: "${rep_id}", full_name: "Cy AF", email: "af@x.com", address: "e", data_sharing_consent: true }
              as: OfficeAdmin
              captures: { con_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "Ag AF", jurisdiction: "NY", status: "ACTIVE" }
              as: OfficeAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /response-templates"
              payload: { category: "OTHER", body_template: "Re", response_window_hours: 100, active: true }
              as: OfficeAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /cases"
              payload: { constituent_id: "${con_id}", subject: "S", description: "d", category: "OTHER" }
              as: Caseworker
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/triage"
              payload: { template_id: "${tmpl_id}", priority: "NORMAL", assignee_staff_id: "s1" }
              as: Caseworker
            - call: "POST /cases/${case_id}/referrals"
              payload: { agency_id: "${agency_id}" }
              as: Caseworker
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /agency-referrals/${ref_id}/resolve"
              payload: {}
              as: Caseworker
          assert:
            - "Response is 409 with data.error_id == ERR_REFERRAL_INVALID_STATE"
            - "Agency.${agency_id}.open_referral_count == 0"

      - name: cancel_registration_twice_rejected
        claim_type: Idempotency
        grounds: ["state_machines.EventRegistration.REGISTERED_to_CANCELLED", "errors[ERR_REGISTRATION_INVALID_STATE]"]
        distinguishing_aspect: "A second POST /event-registrations/{id}/cancel on an already-CANCELLED registration returns 409 ERR_REGISTRATION_INVALID_STATE and does not double-decrement counters."
        test_recipe:
          setup: ["A registered constituent whose registration has been cancelled once (registered_count back to 0)."]
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Rep AG", chamber: "HOUSE", district_name: "NY-7", state_code: "NY", office_email: "ag@leg.gov" }
              as: OfficeAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /constituents"
              payload: { representative_id: "${rep_id}", full_name: "Cy AG", email: "ag@x.com", address: "f" }
              as: OfficeAdmin
              captures: { con_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "V AG", capacity: 20 }
              as: OfficeAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /events"
              payload: { representative_id: "${rep_id}", venue_id: "${venue_id}", title: "TH", start_at: "2026-06-01T18:00:00Z", end_at: "2026-06-01T19:00:00Z", capacity: 5 }
              as: OfficeAdmin
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/open-registration"
              payload: {}
              as: OfficeAdmin
            - call: "POST /events/${event_id}/registrations"
              payload: { constituent_id: "${con_id}" }
              as: OfficeAdmin
              captures: { reg_id: $.data.id }
            - call: "POST /event-registrations/${reg_id}/cancel"
              payload: {}
              as: OfficeAdmin
          trigger:
            - call: "POST /event-registrations/${reg_id}/cancel"
              payload: {}
              as: OfficeAdmin
          assert:
            - "Response is 409 with data.error_id == ERR_REGISTRATION_INVALID_STATE"
            - "Event.${event_id}.registered_count == 0"

      - name: withdraw_closed_case_rejected
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Case.terminal_states", "errors[ERR_CASE_INVALID_STATE]"]
        distinguishing_aspect: "POST /cases/{id}/withdraw on a CLOSED case (a terminal state) returns 409 ERR_CASE_INVALID_STATE."
        test_recipe:
          setup: ["A case driven all the way to CLOSED."]
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Rep AH", chamber: "HOUSE", district_name: "NY-8", state_code: "NY", office_email: "ah@leg.gov" }
              as: OfficeAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /constituents"
              payload: { representative_id: "${rep_id}", full_name: "Cy AH", email: "ah@x.com", address: "g" }
              as: OfficeAdmin
              captures: { con_id: $.data.id }
            - call: "POST /response-templates"
              payload: { category: "OTHER", body_template: "Re", response_window_hours: 100, active: true }
              as: OfficeAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /cases"
              payload: { constituent_id: "${con_id}", subject: "S", description: "d", category: "OTHER" }
              as: Caseworker
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/triage"
              payload: { template_id: "${tmpl_id}", priority: "NORMAL", assignee_staff_id: "s1" }
              as: Caseworker
            - call: "POST /cases/${case_id}/respond"
              payload: {}
              as: Caseworker
            - call: "POST /cases/${case_id}/close"
              payload: {}
              as: OfficeAdmin
          trigger:
            - call: "POST /cases/${case_id}/withdraw"
              payload: {}
              as: Constituent
              as_user_id: "${con_id}"
          assert:
            - "Response is 409 with data.error_id == ERR_CASE_INVALID_STATE"

  # =================================================================
  - section: calculations
    instances:
      - name: provisional_deadline_tax_default_window
        claim_type: Correct Result
        grounds: ["calculations.case_response_deadline", "entities.Case.fields.provisional_due_at"]
        distinguishing_aspect: "A TAX case created at 2026-03-01T00:00:00Z has provisional_due_at = created_at + DEFAULT_WINDOW_HOURS[TAX]=72h = 2026-03-04T00:00:00.000Z."
        test_recipe:
          setup: ["A TAX case created at the default clock."]
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Rep AI", chamber: "HOUSE", district_name: "NY-9", state_code: "NY", office_email: "ai@leg.gov" }
              as: OfficeAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /constituents"
              payload: { representative_id: "${rep_id}", full_name: "Cy AI", email: "ai@x.com", address: "h" }
              as: OfficeAdmin
              captures: { con_id: $.data.id }
          trigger:
            - call: "POST /cases"
              payload: { constituent_id: "${con_id}", subject: "Refund", description: "d", category: "TAX" }
              as: Caseworker
              captures: { case_id: $.data.id }
          assert:
            - "Case.${case_id}.provisional_due_at == \"2026-03-04T00:00:00.000Z\""
            - "Case.${case_id}.status == NEW and Case.${case_id}.priority == NORMAL"

      - name: net_elapsed_excludes_paused_interval
        claim_type: Input Set Filtering
        grounds: ["calculations.case_net_response_time", "entities.Case.fields.cumulative_paused_hours"]
        distinguishing_aspect: "A case paused in AWAITING_CONSTITUENT for 24h yields gross_elapsed_hours=48.00 but net_elapsed_hours=24.00 at 48h after triage, because the paused interval is excluded."
        test_recipe:
          setup: ["A TAX case triaged NORMAL (window 100h) at 2026-03-01T00:00:00Z; request-info at +10h, constituent-reply at +34h (24h pause), clock at 2026-03-03T00:00:00Z."]
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Rep AJ", chamber: "HOUSE", district_name: "NY-10", state_code: "NY", office_email: "aj@leg.gov" }
              as: OfficeAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /constituents"
              payload: { representative_id: "${rep_id}", full_name: "Cy AJ", email: "aj@x.com", address: "i" }
              as: OfficeAdmin
              captures: { con_id: $.data.id }
            - call: "POST /response-templates"
              payload: { category: "TAX", body_template: "Re", response_window_hours: 100, active: true }
              as: OfficeAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /cases"
              payload: { constituent_id: "${con_id}", subject: "S", description: "d", category: "TAX" }
              as: Caseworker
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/triage"
              payload: { template_id: "${tmpl_id}", priority: "NORMAL", assignee_staff_id: "s1" }
              as: Caseworker
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T10:00:00Z" }
              as: OfficeAdmin
            - call: "POST /cases/${case_id}/request-info"
              payload: {}
              as: Caseworker
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T10:00:00Z" }
              as: OfficeAdmin
            - call: "POST /cases/${case_id}/constituent-reply"
              payload: {}
              as: Constituent
              as_user_id: "${con_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-03T00:00:00Z" }
              as: OfficeAdmin
          trigger:
            - call: "GET /cases/${case_id}"
              payload: {}
              as: Caseworker
          assert:
            - "Case.${case_id}.gross_elapsed_hours == 48.00"
            - "Case.${case_id}.net_elapsed_hours == 24.00"
            - "Case.${case_id}.cumulative_paused_hours == 24.00"

  # =================================================================
  - section: validations
    instances:
      - name: purged_constituent_new_case_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=9]", "errors[ERR_CONSTITUENT_PURGED]"]
        distinguishing_aspect: "POST /cases for a PURGED constituent returns 409 ERR_CONSTITUENT_PURGED."
        test_recipe:
          setup: ["A constituent that has been purged."]
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Rep AK", chamber: "HOUSE", district_name: "NY-11", state_code: "NY", office_email: "ak@leg.gov" }
              as: OfficeAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /constituents"
              payload: { representative_id: "${rep_id}", full_name: "Cy AK", email: "ak@x.com", address: "j" }
              as: OfficeAdmin
              captures: { con_id: $.data.id }
            - call: "POST /constituents/${con_id}/purge"
              payload: {}
              as: OfficeAdmin
          trigger:
            - call: "POST /cases"
              payload: { constituent_id: "${con_id}", subject: "S", description: "d", category: "OTHER" }
              as: Caseworker
          assert:
            - "Response is 409 with data.error_id == ERR_CONSTITUENT_PURGED"

      - name: template_mismatch_on_triage_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=11]", "errors[ERR_TEMPLATE_MISMATCH]"]
        distinguishing_aspect: "Triaging a HOUSING case with a HEALTHCARE template returns 422 ERR_TEMPLATE_MISMATCH; the case stays NEW."
        test_recipe:
          setup: ["A NEW HOUSING case and an active HEALTHCARE template."]
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Rep AL", chamber: "HOUSE", district_name: "NY-12", state_code: "NY", office_email: "al@leg.gov" }
              as: OfficeAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /constituents"
              payload: { representative_id: "${rep_id}", full_name: "Cy AL", email: "al@x.com", address: "k" }
              as: OfficeAdmin
              captures: { con_id: $.data.id }
            - call: "POST /response-templates"
              payload: { category: "HEALTHCARE", body_template: "Re", response_window_hours: 100, active: true }
              as: OfficeAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /cases"
              payload: { constituent_id: "${con_id}", subject: "S", description: "d", category: "HOUSING" }
              as: Caseworker
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /cases/${case_id}/triage"
              payload: { template_id: "${tmpl_id}", priority: "NORMAL", assignee_staff_id: "s1" }
              as: Caseworker
          assert:
            - "Response is 422 with data.error_id == ERR_TEMPLATE_MISMATCH"
            - "Case.${case_id}.status == NEW"

      - name: event_invalid_time_range_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=5]", "errors[ERR_INVALID_TIME_RANGE]"]
        distinguishing_aspect: "POST /events with start_at >= end_at returns 422 ERR_INVALID_TIME_RANGE."
        test_recipe:
          setup: ["A representative and a venue."]
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Rep AM", chamber: "HOUSE", district_name: "NY-13", state_code: "NY", office_email: "am@leg.gov" }
              as: OfficeAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "V AM", capacity: 30 }
              as: OfficeAdmin
              captures: { venue_id: $.data.id }
          trigger:
            - call: "POST /events"
              payload: { representative_id: "${rep_id}", venue_id: "${venue_id}", title: "Bad", start_at: "2026-07-01T12:00:00Z", end_at: "2026-07-01T12:00:00Z", capacity: 5 }
              as: OfficeAdmin
          assert:
            - "Response is 422 with data.error_id == ERR_INVALID_TIME_RANGE"

      - name: event_capacity_exceeds_venue_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=15]", "errors[ERR_EVENT_FULL]"]
        distinguishing_aspect: "POST /events whose capacity (50) exceeds the venue capacity (30) returns 409 ERR_EVENT_FULL at creation."
        test_recipe:
          setup: ["A representative and a venue of capacity 30."]
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Rep AN", chamber: "HOUSE", district_name: "NY-14", state_code: "NY", office_email: "an@leg.gov" }
              as: OfficeAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "V AN", capacity: 30 }
              as: OfficeAdmin
              captures: { venue_id: $.data.id }
          trigger:
            - call: "POST /events"
              payload: { representative_id: "${rep_id}", venue_id: "${venue_id}", title: "Too big", start_at: "2026-07-02T10:00:00Z", end_at: "2026-07-02T11:00:00Z", capacity: 50 }
              as: OfficeAdmin
          assert:
            - "Response is 409 with data.error_id == ERR_EVENT_FULL"

  # =================================================================
  - section: endpoints
    instances:
      - name: cases_list_pagination_by_constituent
        claim_type: Listing
        grounds: ["endpoints.GET_/cases", "entities.Case.fields.constituent_id"]
        distinguishing_aspect: "With 3 cases for one constituent, GET /cases?constituent_id=..&limit=2 returns 2 items, total_count=3, has_more=true (and also serves reverse lookup for Case.constituent_id)."
        test_recipe:
          setup: ["A constituent with three cases."]
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Rep AO", chamber: "HOUSE", district_name: "NY-15", state_code: "NY", office_email: "ao@leg.gov" }
              as: OfficeAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /constituents"
              payload: { representative_id: "${rep_id}", full_name: "Cy AO", email: "ao@x.com", address: "l" }
              as: OfficeAdmin
              captures: { con_id: $.data.id }
            - call: "POST /cases"
              payload: { constituent_id: "${con_id}", subject: "S1", description: "d", category: "OTHER" }
              as: Caseworker
            - call: "POST /cases"
              payload: { constituent_id: "${con_id}", subject: "S2", description: "d", category: "OTHER" }
              as: Caseworker
            - call: "POST /cases"
              payload: { constituent_id: "${con_id}", subject: "S3", description: "d", category: "OTHER" }
              as: Caseworker
          trigger:
            - call: "GET /cases"
              payload: { constituent_id: "${con_id}", limit: 2, offset: 0 }
              as: Caseworker
          assert:
            - "Response data is an array of length 2 with meta pagination total_count == 3 and has_more == true"

      - name: referrals_reverse_lookup_by_case
        claim_type: Cross-reference link
        grounds: ["endpoints.GET_/cases/{id}/referrals", "entities.AgencyReferral.fields.case_id"]
        distinguishing_aspect: "A cascade-created referral is discoverable only via GET /cases/{id}/referrals, which returns the AgencyReferral array of length 1 (FK reverse-reachability for AgencyReferral.case_id)."
        test_recipe:
          setup: ["A triaged case with consent and one referral created against an ACTIVE agency."]
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Rep AP", chamber: "HOUSE", district_name: "NY-16", state_code: "NY", office_email: "ap@leg.gov" }
              as: OfficeAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /constituents"
              payload: { representative_id: "${rep_id}", full_name: "Cy AP", email: "ap@x.com", address: "m", data_sharing_consent: true }
              as: OfficeAdmin
              captures: { con_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "Ag AP", jurisdiction: "NY", status: "ACTIVE" }
              as: OfficeAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /response-templates"
              payload: { category: "OTHER", body_template: "Re", response_window_hours: 100, active: true }
              as: OfficeAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /cases"
              payload: { constituent_id: "${con_id}", subject: "S", description: "d", category: "OTHER" }
              as: Caseworker
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/triage"
              payload: { template_id: "${tmpl_id}", priority: "NORMAL", assignee_staff_id: "s1" }
              as: Caseworker
            - call: "POST /cases/${case_id}/referrals"
              payload: { agency_id: "${agency_id}" }
              as: Caseworker
              captures: { ref_id: $.data.id }
          trigger:
            - call: "GET /cases/${case_id}/referrals"
              payload: {}
              as: Caseworker
          assert:
            - "Response data is an array of length 1 containing AgencyReferral.${ref_id} with case_id == ${case_id}"

      - name: registrations_reverse_lookup_by_constituent
        claim_type: Cross-reference link
        grounds: ["endpoints.GET_/event-registrations", "entities.EventRegistration.fields.constituent_id"]
        distinguishing_aspect: "GET /event-registrations?constituent_id=.. returns the constituent's registrations (FK reverse-reachability for EventRegistration.constituent_id)."
        test_recipe:
          setup: ["A constituent registered for one open event."]
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Rep AQ", chamber: "HOUSE", district_name: "NY-17", state_code: "NY", office_email: "aq@leg.gov" }
              as: OfficeAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /constituents"
              payload: { representative_id: "${rep_id}", full_name: "Cy AQ", email: "aq@x.com", address: "n" }
              as: OfficeAdmin
              captures: { con_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "V AQ", capacity: 20 }
              as: OfficeAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /events"
              payload: { representative_id: "${rep_id}", venue_id: "${venue_id}", title: "TH", start_at: "2026-08-01T18:00:00Z", end_at: "2026-08-01T19:00:00Z", capacity: 5 }
              as: OfficeAdmin
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/open-registration"
              payload: {}
              as: OfficeAdmin
            - call: "POST /events/${event_id}/registrations"
              payload: { constituent_id: "${con_id}" }
              as: OfficeAdmin
              captures: { reg_id: $.data.id }
          trigger:
            - call: "GET /event-registrations"
              payload: { constituent_id: "${con_id}" }
              as: OfficeAdmin
          assert:
            - "Response data is an array of length 1 containing EventRegistration.${reg_id}"

