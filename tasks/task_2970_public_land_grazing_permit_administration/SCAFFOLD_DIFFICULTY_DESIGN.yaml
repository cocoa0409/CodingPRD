      - name: minimum_billable_fraction_floor_boundary
        grounds:
          - calculations.use_bill_amount.variants.FINAL
          - domain_constants.MIN_BILLABLE_FRACTION
          - calculations.actual_use_aggregation
          - endpoints.POST_annual_operating_instructions_accept_use_report
        distinguishing_aspect: |
          A different metric on a different endpoint: the 2-decimal AUM quantity
          actual_aums_total measured against the minimum-charge floor
          floor(MIN_BILLABLE_FRACTION * (authorized_aums - nonuse_aums)) = floor(0.25 * 300) = 75
          at POST /annual-operating-instructions/{aoiId}/accept-use-report. Reported use of
          74.67 AUMs (0.33 below the floor) must be billed AT the floor (75 AUMs, 12900 cents);
          exactly 75.00 must be billed as itself (also 12900, proving the floor is a max() and
          not an addition); 75.33 (0.33 above) must be billed as reported (12957 cents, which
          only appears if the 2-decimal value survives into round_half_up(billed * 172)).
        test_recipe:
          setup:
            - "An allotment with 1200 permitted AUMs and one 300-AUM pasture, rotation requirement 1"
            - "A permittee with a 400-AUM LAND base property and an ISSUED 300-AUM permit"
            - "An ISSUED 2026 AOI (authorized_aums 300, nonuse_aums 0) with one planned 103.33-AUM use record and an unpaid 54100-cent PRELIMINARY_USE bill"
            - "The single use record reported as 70 head over 32 days (2026-04-01 to 2026-05-03), i.e. actual_aums 74.67 — just under the 75-AUM floor"
          setup_api_calls:
            - call: "POST /allotments"
              payload: { name: "Floor Boundary Allotment", admin_unit_code: "NV-072", acres: 24000, total_permitted_aums: 1200, season_start: "01-01", season_end: "12-31", required_pasture_rotation_count: 1 }
