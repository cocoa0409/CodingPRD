              as: CorporateSecretary
              captures: { d1: $.data.id }
            - call: "POST /meetings"
              payload: { corporation_id: "${corp}", meeting_type: "REGULAR", scheduled_start: "2026-06-20T10:00:00Z", duration_minutes: 60, location_or_medium: "Boardroom", chair_director_id: "${d1}" }
              as: CorporateSecretary
              captures: { m: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T10:00:00Z" }
              as: CorporateSecretary
          trigger:
            - call: "POST /meetings/${m}/send_notices"
              as: CorporateSecretary
          assert:
            - "MeetingNotice(meeting=${m}).deadline_at == 2026-06-10T10:00:00Z"
            - "MeetingNotice(meeting=${m}).sent_at == 2026-06-10T10:00:00Z"
            - "MeetingNotice(meeting=${m}).is_timely == true   # sent_at <= deadline_at, inclusive"
            - "Meeting.${m}.status == NOTICED"

  # ---------------------------------------------------------------------------
  # Rule 7: cross_entity_state_dependency — different entity pairs.
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: open_vote_requires_meeting_in_session
        grounds:
          - state_machines.Resolution.TABLED_to_VOTE_OPEN
          - errors[ERR_MEETING_NOT_IN_SESSION]
        distinguishing_aspect: |
          Entity pair (Resolution, Meeting): a TABLED resolution cannot open its vote while
          the linked Meeting is merely NOTICED — the valid next-state set of Resolution depends
          on Meeting.status. The sibling uses the (CommitteeMembership, Director) pair.
        test_recipe:
          setup:
            - "Corporation, ADOPTED bylaws, 1 ACTIVE director D1 (chair); meeting NOTICED (never convened)"
            - "Resolution R linked to the meeting, TABLED (table allowed while NOTICED)"
          setup_api_calls:
            - call: "POST /corporations"
              payload: { name: "Corp CE1", incorporation_state: "DE" }
              as: CorporateSecretary
              captures: { corp: $.data.id, corpv: $.data.version }
            - call: "POST /bylaws"
              payload: { corporation_id: "${corp}", notice_days_regular: 10, notice_days_special: 3, package_lead_days: 5, quorum_percent: 60, quorum_fixed_count: 1, consent_window_days: 10, consent_unanimity_required: true, minute_retention_years: 5, rotation_max_years: 6, board_seat_count: 15 }
              as: CorporateSecretary
              captures: { by: $.data.id }
            - call: "POST /bylaws/${by}/adopt"
              payload: { expected_corporation_version: "${corpv}" }
              as: CorporateSecretary
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D1", email: "d1@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d1: $.data.id }
            - call: "POST /meetings"
              payload: { corporation_id: "${corp}", meeting_type: "REGULAR", scheduled_start: "2026-06-20T10:00:00Z", duration_minutes: 60, location_or_medium: "Boardroom", chair_director_id: "${d1}" }
              as: CorporateSecretary
              captures: { m: $.data.id }
            - call: "POST /meetings/${m}/send_notices"
              as: CorporateSecretary
            - call: "POST /resolutions"
              payload: { corporation_id: "${corp}", meeting_id: "${m}", origin: "MEETING", resolution_type: "ORDINARY", title: "R", text: "text" }
              as: CorporateSecretary
              captures: { r: $.data.id }
            - call: "POST /resolutions/${r}/table"
              as: CorporateSecretary
          trigger:
            - call: "POST /resolutions/${r}/open_vote"
              as: BoardChair
              as_user_id: "${d1}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MEETING_NOT_IN_SESSION   # Meeting.status NOTICED gates Resolution transition"
            - "Resolution.${r}.status == TABLED"

      - name: membership_requires_director_active
        grounds:
          - endpoints[POST /committee_memberships]
          - errors[ERR_DIRECTOR_NOT_ACTIVE]
          - state_machines.Director.ACTIVE_to_RESIGNED
        distinguishing_aspect: |
          Entity pair (CommitteeMembership, Director) — different pair than the sibling:
          creating a membership is rejected when the referenced Director has left ACTIVE
          status (RESIGNED), independent of the committee's own state.
        test_recipe:
          setup:
            - "Corporation, ADOPTED bylaws, director D1 created then resigned; committee ACTIVE with quorum 1"
          setup_api_calls:
            - call: "POST /corporations"
              payload: { name: "Corp CE2", incorporation_state: "DE" }
              as: CorporateSecretary
              captures: { corp: $.data.id, corpv: $.data.version }
            - call: "POST /bylaws"
              payload: { corporation_id: "${corp}", notice_days_regular: 10, notice_days_special: 3, package_lead_days: 5, quorum_percent: 60, quorum_fixed_count: 1, consent_window_days: 10, consent_unanimity_required: true, minute_retention_years: 5, rotation_max_years: 6, board_seat_count: 15 }
              as: CorporateSecretary
              captures: { by: $.data.id }
            - call: "POST /bylaws/${by}/adopt"
              payload: { expected_corporation_version: "${corpv}" }
              as: CorporateSecretary
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D1", email: "d1@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d1: $.data.id }
            - call: "POST /committees"
              payload: { corporation_id: "${corp}", name: "Nom", committee_type: "NOMINATING", charter_text: "charter", quorum_fixed_count: 1 }
              as: CorporateSecretary
              captures: { cm: $.data.id }
            - call: "POST /committees/${cm}/activate"
              as: CorporateSecretary
            - call: "POST /directors/${d1}/resign"
              as: CorporateSecretary
          trigger:
            - call: "POST /committee_memberships"
              payload: { committee_id: "${cm}", director_id: "${d1}", committee_role: "MEMBER", term_start: "2026-06-01T00:00:00Z", term_end: "2027-06-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DIRECTOR_NOT_ACTIVE"
            - "Committee.${cm}.active_member_count == 0"

  # ---------------------------------------------------------------------------
  # Rule 8: resource_temporal_overlap — different interval semantics on
  # different resources.
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: meeting_calendar_half_open_adjacency_allowed
        grounds:
          - calculations.meeting_calendar_overlap
          - errors[ERR_MEETING_TIME_CONFLICT]
        distinguishing_aspect: |
          Resource: the corporation's meeting calendar; semantics: HALF-OPEN [start, end) —
          a meeting starting exactly when another ends is allowed (adjacency), while strict
          interior overlap conflicts. The sibling uses closed-interval semantics on a
          different resource.
        test_recipe:
          setup:
            - "Corporation, ADOPTED bylaws, 1 ACTIVE director D1 (chair)"
            - "Meeting A occupies [2026-06-20T10:00:00Z, 2026-06-20T11:00:00Z)"
          setup_api_calls:
            - call: "POST /corporations"
              payload: { name: "Corp T1", incorporation_state: "DE" }
              as: CorporateSecretary
              captures: { corp: $.data.id, corpv: $.data.version }
            - call: "POST /bylaws"
              payload: { corporation_id: "${corp}", notice_days_regular: 10, notice_days_special: 3, package_lead_days: 5, quorum_percent: 60, quorum_fixed_count: 1, consent_window_days: 10, consent_unanimity_required: true, minute_retention_years: 5, rotation_max_years: 6, board_seat_count: 15 }
              as: CorporateSecretary
              captures: { by: $.data.id }
            - call: "POST /bylaws/${by}/adopt"
              payload: { expected_corporation_version: "${corpv}" }
              as: CorporateSecretary
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D1", email: "d1@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d1: $.data.id }
            - call: "POST /meetings"
              payload: { corporation_id: "${corp}", meeting_type: "REGULAR", scheduled_start: "2026-06-20T10:00:00Z", duration_minutes: 60, location_or_medium: "Boardroom", chair_director_id: "${d1}" }
              as: CorporateSecretary
              captures: { m_a: $.data.id }
          trigger:
            - call: "POST /meetings"
              payload: { corporation_id: "${corp}", meeting_type: "SPECIAL", scheduled_start: "2026-06-20T11:00:00Z", duration_minutes: 60, location_or_medium: "Boardroom", chair_director_id: "${d1}" }
              as: CorporateSecretary
              captures: { m_b: $.data.id }
            - call: "POST /meetings"
              payload: { corporation_id: "${corp}", meeting_type: "SPECIAL", scheduled_start: "2026-06-20T10:30:00Z", duration_minutes: 60, location_or_medium: "Boardroom", chair_director_id: "${d1}" }
              as: CorporateSecretary
              captures: { err: $.data.error_id }
          assert:
            - "Meeting.${m_b}.status == SCHEDULED   # back-to-back adjacency allowed under half-open semantics"
            - "err == ERR_MEETING_TIME_CONFLICT   # 10:30 start lies strictly inside A's window"

      - name: disclosure_window_closed_interval_touching_conflicts
        grounds:
          - calculations.disclosure_window_overlap
          - errors[ERR_DISCLOSURE_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Resource: a director's per-related-party disclosure timeline; semantics: CLOSED
          interval [from, to] — a new window merely TOUCHING the existing window's endpoint
          (from == other.to) conflicts, the opposite adjacency treatment from the meeting
          calendar's half-open rule.
        test_recipe:
          setup:
            - "Corporation, ADOPTED bylaws, 1 ACTIVE director D1"
            - "D1 has an OPEN disclosure for 'Acme' covering [2026-01-01T00:00:00Z, 2026-06-30T00:00:00Z]"
          setup_api_calls:
            - call: "POST /corporations"
              payload: { name: "Corp T2", incorporation_state: "DE" }
              as: CorporateSecretary
              captures: { corp: $.data.id, corpv: $.data.version }
            - call: "POST /bylaws"
              payload: { corporation_id: "${corp}", notice_days_regular: 10, notice_days_special: 3, package_lead_days: 5, quorum_percent: 60, quorum_fixed_count: 1, consent_window_days: 10, consent_unanimity_required: true, minute_retention_years: 5, rotation_max_years: 6, board_seat_count: 15 }
              as: CorporateSecretary
              captures: { by: $.data.id }
            - call: "POST /bylaws/${by}/adopt"
              payload: { expected_corporation_version: "${corpv}" }
              as: CorporateSecretary
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D1", email: "d1@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d1: $.data.id }
            - call: "POST /conflict_disclosures"
              payload: { director_id: "${d1}", corporation_id: "${corp}", related_party: "Acme", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-06-30T00:00:00Z" }
              as: Director
              as_user_id: "${d1}"
          trigger:
            - call: "POST /conflict_disclosures"
              payload: { director_id: "${d1}", corporation_id: "${corp}", related_party: "Acme", effective_from: "2026-06-30T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: Director
              as_user_id: "${d1}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DISCLOSURE_WINDOW_CONFLICT   # touching endpoints conflict under closed-interval semantics"

  # ---------------------------------------------------------------------------
  # Rule 9: compensating_invariant — different conserved quantities.
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: vote_recast_conserves_active_ballot_count
        grounds:
          - endpoints[POST /vote_records/{id}/recast]
          - entities.VoteRecord.fields.recast_count
          - calculations.vote_outcome_determination
        distinguishing_aspect: |
          Conserved quantity: the count of ACTIVE MEETING_BALLOT VoteRecords per resolution.
          Forward action (cast) + compensating action (recast) change the tally distribution
          but never the ACTIVE ballot count: N stays 3 across the recast.
        test_recipe:
          setup:
            - "Corporation, ADOPTED bylaws, 3 ACTIVE directors (D1 chair), meeting IN_SESSION (required 2, all present)"
            - "Resolution R VOTE_OPEN with ballots D1 FOR, D2 AGAINST, D3 FOR -> 3 ACTIVE ballots, for=2 against=1"
          setup_api_calls:
            - call: "POST /corporations"
              payload: { name: "Corp I1", incorporation_state: "DE" }
              as: CorporateSecretary
              captures: { corp: $.data.id, corpv: $.data.version }
            - call: "POST /bylaws"
              payload: { corporation_id: "${corp}", notice_days_regular: 10, notice_days_special: 3, package_lead_days: 5, quorum_percent: 60, quorum_fixed_count: 1, consent_window_days: 10, consent_unanimity_required: true, minute_retention_years: 5, rotation_max_years: 6, board_seat_count: 15 }
              as: CorporateSecretary
              captures: { by: $.data.id }
            - call: "POST /bylaws/${by}/adopt"
              payload: { expected_corporation_version: "${corpv}" }
              as: CorporateSecretary
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D1", email: "d1@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d1: $.data.id }
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D2", email: "d2@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d2: $.data.id }
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D3", email: "d3@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d3: $.data.id }
            - call: "POST /meetings"
              payload: { corporation_id: "${corp}", meeting_type: "REGULAR", scheduled_start: "2026-06-20T10:00:00Z", duration_minutes: 60, location_or_medium: "Boardroom", chair_director_id: "${d1}" }
              as: CorporateSecretary
              captures: { m: $.data.id }
            - call: "POST /meetings/${m}/send_notices"
              as: CorporateSecretary
            - call: "POST /attendance_records"
              payload: { meeting_id: "${m}", director_id: "${d1}", attendance_mode: "IN_PERSON" }
              as: CorporateSecretary
            - call: "POST /attendance_records"
              payload: { meeting_id: "${m}", director_id: "${d2}", attendance_mode: "IN_PERSON" }
              as: CorporateSecretary
            - call: "POST /attendance_records"
              payload: { meeting_id: "${m}", director_id: "${d3}", attendance_mode: "IN_PERSON" }
              as: CorporateSecretary
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T10:00:00Z" }
              as: CorporateSecretary
            - call: "POST /meetings/${m}/convene"
              as: BoardChair
              as_user_id: "${d1}"
            - call: "POST /resolutions"
              payload: { corporation_id: "${corp}", meeting_id: "${m}", origin: "MEETING", resolution_type: "ORDINARY", title: "R inv", text: "text" }
              as: CorporateSecretary
              captures: { r: $.data.id }
            - call: "POST /resolutions/${r}/table"
              as: CorporateSecretary
            - call: "POST /resolutions/${r}/open_vote"
              as: BoardChair
              as_user_id: "${d1}"
            - call: "POST /vote_records"
              payload: { resolution_id: "${r}", channel: "MEETING_BALLOT", vote: "FOR" }
              as: Director
              as_user_id: "${d1}"
            - call: "POST /vote_records"
              payload: { resolution_id: "${r}", channel: "MEETING_BALLOT", vote: "AGAINST" }
              as: Director
              as_user_id: "${d2}"
            - call: "POST /vote_records"
              payload: { resolution_id: "${r}", channel: "MEETING_BALLOT", vote: "FOR" }
              as: Director
              as_user_id: "${d3}"
              captures: { v3: $.data.id }
          trigger:
            - call: "POST /vote_records/${v3}/recast"
              payload: { vote: "AGAINST" }
              as: Director
              as_user_id: "${d3}"
          assert:
            - "count(VoteRecord where resolution_id == ${r} AND status == ACTIVE) == 3   # conserved across recast"
            - "Resolution.${r}.for_count == 1 and Resolution.${r}.against_count == 2   # distribution moved, total did not"
            - "VoteRecord.${v3}.status == ACTIVE and VoteRecord.${v3}.recast_count == 1"
            - "VoteRecord.${v3}.vote == AGAINST"

      - name: membership_add_end_conserves_committee_size
        grounds:
          - state_machines.CommitteeMembership.ACTIVE_to_ENDED
          - entities.Committee.fields.active_member_count
        distinguishing_aspect: |
          Conserved quantity: Committee.active_member_count (different quantity than the
          ballot count of the sibling). Add-then-end a membership returns the committee to
          exactly its prior size with no drift in the derived counter.
        test_recipe:
          setup:
            - "Corporation, ADOPTED bylaws, 2 ACTIVE directors D1 D2"
            - "Committee (NOMINATING, quorum_fixed_count=1) ACTIVE with D1 as CHAIR; active_member_count == 1"
          setup_api_calls:
            - call: "POST /corporations"
              payload: { name: "Corp I2", incorporation_state: "DE" }
              as: CorporateSecretary
              captures: { corp: $.data.id, corpv: $.data.version }
            - call: "POST /bylaws"
              payload: { corporation_id: "${corp}", notice_days_regular: 10, notice_days_special: 3, package_lead_days: 5, quorum_percent: 60, quorum_fixed_count: 1, consent_window_days: 10, consent_unanimity_required: true, minute_retention_years: 5, rotation_max_years: 6, board_seat_count: 15 }
              as: CorporateSecretary
              captures: { by: $.data.id }
            - call: "POST /bylaws/${by}/adopt"
              payload: { expected_corporation_version: "${corpv}" }
              as: CorporateSecretary
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D1", email: "d1@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d1: $.data.id }
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D2", email: "d2@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d2: $.data.id }
            - call: "POST /committees"
              payload: { corporation_id: "${corp}", name: "Nom", committee_type: "NOMINATING", charter_text: "charter", quorum_fixed_count: 1 }
              as: CorporateSecretary
              captures: { cm: $.data.id }
            - call: "POST /committees/${cm}/activate"
              as: CorporateSecretary
            - call: "POST /committee_memberships"
              payload: { committee_id: "${cm}", director_id: "${d1}", committee_role: "CHAIR", term_start: "2026-02-01T00:00:00Z", term_end: "2028-02-01T00:00:00Z" }
              as: CorporateSecretary
          trigger:
            - call: "POST /committee_memberships"
              payload: { committee_id: "${cm}", director_id: "${d2}", committee_role: "MEMBER", term_start: "2026-02-01T00:00:00Z", term_end: "2027-02-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { mb2: $.data.id }
            - call: "POST /committee_memberships/${mb2}/end"
              as: CorporateSecretary
          assert:
            - "Committee.${cm}.active_member_count == 1   # add (1->2) then end (2->1) conserves the counter"
            - "CommitteeMembership.${mb2}.status == ENDED and CommitteeMembership.${mb2}.ended_reason == MANUAL"
            - "Committee.${cm}.status == ACTIVE and Committee.${cm}.chair_vacant == false"
