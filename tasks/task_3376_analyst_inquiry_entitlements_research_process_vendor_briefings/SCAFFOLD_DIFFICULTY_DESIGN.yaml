# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3376_analyst_inquiry_entitlements_research_process_vendor_briefings
#
# Machine-readable index of every difficulty feature the scaffold claims to
# exhibit, cross-referenced from §1.1–§1.7 against the nine Difficulty Rules
# of SKILL.md §0.5. Every `grounds:` ref resolves into SCAFFOLD.yaml; every
# `${var}` is bound by an earlier `captures:` in the same instance.
#
# Reusable setup anchors (document-scoped, defined on first use):
#   &k_clock   logical clock at 2026-09-01T00:00:00Z
#   &k_acct10  account with seat_count_contracted 10 / inquiry_allowance_total 10
#   &k_acct4   account with seat_count_contracted 4 / inquiry_allowance_total 4
#   &k_an1     analyst Dana Whitfield, DISTINGUISHED, routes CLOUD_COST + MARKET_OUTLOOK
#   &k_an2     analyst Ravi Menon, SENIOR, route CLOUD_COST
#   &k_ven1    vendor Northwind Analytics
#   &k_ven2    vendor Bluepeak Systems
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: allowance_ledger_consumption_vs_reservation
        grounds:
          - calculations.inquiry_allowance_ledger
          - entities.ClientAccount.fields.remaining_consumed_units
          - entities.ClientAccount.fields.remaining_reserved_units
          - state_machines.InquiryRequest.ROUTED_to_SCHEDULED
        distinguishing_aspect: "Two valid ledger algorithms over the same InquiryRequest rows disagree by exactly the 2 SCHEDULED inquiries: the CONSUMPTION variant reports remaining_consumed_units 7 while the RESERVATION variant reports remaining_reserved_units 5, and the scheduling gate is the only consumer of the reservation variant."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Account with seat_count_contracted 10 and inquiry_allowance_total 10; one ACTIVE seat; one DISTINGUISHED analyst on route CLOUD_COST."
            - "Five inquiries on that account: three COMPLETED on 2026-09-02 and two still SCHEDULED for 2026-09-03."
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &k_acct10
              call: "POST /research/clients"
              payload: { legal_name: "Acme Industrial Group", industry: "Manufacturing", region: "NA", contract_start_utc: "2026-07-01T00:00:00Z", contract_end_utc: "2027-06-30T00:00:00Z", seat_count_contracted: 10, inquiry_allowance_total: 10, reprint_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - &k_an1
              call: "POST /research/analysts"
              payload: { full_name: "Dana Whitfield", practice_area: "CIO_TECH", topic_routes: ["CLOUD_COST", "MARKET_OUTLOOK"], seniority: "DISTINGUISHED", status: "ACTIVE" }
              as: PlatformAdmin
              captures: { an1_id: $.data.id, an1_v: $.data.version }
            - &k_seat
              call: "POST /research/seats"
              payload: { client_account_id: "${acct_id}", seat_email: "nina@acme.example", research_role: "PRACTITIONER", seat_kind: "NAMED" }
              as: ClientAdmin
              as_user_id: "${acct_id}"
              captures: { seat_id: $.data.id, seat_v: $.data.version }
            - &k_seat_act
              call: "POST /research/seats/${seat_id}/activate"
              payload: {}
              as: ClientAdmin
              as_user_id: "${acct_id}"
            - call: "POST /research/inquiry-requests"
              payload: { seat_id: "${seat_id}", topic_route: "CLOUD_COST", question_summary: "How do we sequence a cloud cost programme?", requested_start_utc: "2026-09-02T10:00:00Z", duration_minutes: 45, preparation_notes: "Cost model attached." }
              as: SeatHolder
              as_user_id: "${seat_id}"
              captures: { inq1_id: $.data.id }
            - call: "POST /research/inquiry-requests"
              payload: { seat_id: "${seat_id}", topic_route: "CLOUD_COST", question_summary: "Which commitment model fits us?", requested_start_utc: "2026-09-02T11:00:00Z", duration_minutes: 45, preparation_notes: "Usage export attached." }
              as: SeatHolder
              as_user_id: "${seat_id}"
              captures: { inq2_id: $.data.id }
            - call: "POST /research/inquiry-requests"
              payload: { seat_id: "${seat_id}", topic_route: "CLOUD_COST", question_summary: "How should we govern tagging?", requested_start_utc: "2026-09-02T12:00:00Z", duration_minutes: 30, preparation_notes: "Tag taxonomy attached." }
              as: SeatHolder
              as_user_id: "${seat_id}"
              captures: { inq3_id: $.data.id }
            - call: "POST /research/inquiry-requests"
              payload: { seat_id: "${seat_id}", topic_route: "CLOUD_COST", question_summary: "Who owns the FinOps function?", requested_start_utc: "2026-09-03T10:00:00Z", duration_minutes: 30, preparation_notes: "Org chart attached." }
              as: SeatHolder
              as_user_id: "${seat_id}"
              captures: { inq4_id: $.data.id }
            - call: "POST /research/inquiry-requests"
              payload: { seat_id: "${seat_id}", topic_route: "CLOUD_COST", question_summary: "What benchmark should we target?", requested_start_utc: "2026-09-03T11:00:00Z", duration_minutes: 30, preparation_notes: "Peer benchmark attached." }
              as: SeatHolder
              as_user_id: "${seat_id}"
              captures: { inq5_id: $.data.id }
            - call: "POST /research/inquiry-requests/${inq1_id}/schedule"
              payload: { scheduled_start_utc: "2026-09-02T10:00:00Z" }
              as: Analyst
              as_user_id: "${an1_id}"
            - call: "POST /research/inquiry-requests/${inq2_id}/schedule"
              payload: { scheduled_start_utc: "2026-09-02T11:00:00Z" }
              as: Analyst
              as_user_id: "${an1_id}"
            - call: "POST /research/inquiry-requests/${inq3_id}/schedule"
              payload: { scheduled_start_utc: "2026-09-02T12:00:00Z" }
              as: Analyst
              as_user_id: "${an1_id}"
            - call: "POST /research/inquiry-requests/${inq4_id}/schedule"
              payload: { scheduled_start_utc: "2026-09-03T10:00:00Z" }
              as: Analyst
              as_user_id: "${an1_id}"
            - call: "POST /research/inquiry-requests/${inq5_id}/schedule"
              payload: { scheduled_start_utc: "2026-09-03T11:00:00Z" }
              as: Analyst
              as_user_id: "${an1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T13:00:00Z" }
              as: PlatformAdmin
            - call: "POST /research/inquiry-requests/${inq1_id}/complete"
              payload: { outcome: "COMPLETED", note_delivered: true, note_reference: "NOTE-1" }
              as: Analyst
              as_user_id: "${an1_id}"
            - call: "POST /research/inquiry-requests/${inq2_id}/complete"
              payload: { outcome: "COMPLETED", note_delivered: true, note_reference: "NOTE-2" }
              as: Analyst
              as_user_id: "${an1_id}"
            - call: "POST /research/inquiry-requests/${inq3_id}/complete"
              payload: { outcome: "COMPLETED", note_delivered: true, note_reference: "NOTE-3" }
              as: Analyst
              as_user_id: "${an1_id}"
          trigger:
            - call: "GET /research/clients/${acct_id}"
              payload: {}
              as: ClientAdmin
              as_user_id: "${acct_id}"
          assert:
            - "ClientAccount.${acct_id}.consumed_inquiry_units == 3"
            - "ClientAccount.${acct_id}.reserved_inquiry_units == 2"
            - "ClientAccount.${acct_id}.remaining_consumed_units == 7"
            - "ClientAccount.${acct_id}.remaining_reserved_units == 5"
            - "ClientAccount.${acct_id}.remaining_consumed_units - ClientAccount.${acct_id}.remaining_reserved_units == 2"
            - "ClientAccount.${acct_id}.inquiry_allowance_total == 10"

      - name: evaluation_round_per_dimension_vs_total_only
        grounds:
          - calculations.vendor_evaluation_weighted_score
          - entities.VendorInclusion.fields.weighted_total_score
          - entities.VendorInclusion.fields.dimension_scores
        distinguishing_aspect: "The same five dimension rows yield weighted_total_score 3.86 under the pinned round-per-dimension order and 3.85 under the rejected round-the-total-only order, so the two valid weightings differ by one cent on identical input."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One analyst and one ACTIVE vendor; no document yet."
          setup_api_calls:
            - *k_clock
            - *k_an1
            - &k_ven1
              call: "POST /research/vendors"
              payload: { vendor_name: "Northwind Analytics", hq_region: "NA", employee_count_band: "ENTERPRISE" }
              as: PlatformAdmin
              captures: { ven1_id: $.data.id }
            - &k_doc
              call: "POST /research/documents"
              payload: { title: "Comparative Matrix: Cloud Cost Management", doc_type: "COMPARATIVE_MATRIX", practice_area: "CIO_TECH", lead_analyst_id: "${an1_id}", embargo_days: 14, peer_reviewer_analyst_id: "" }
              as: Analyst
              as_user_id: "${an1_id}"
              captures: { doc_id: $.data.id, doc_v: $.data.version }
          trigger:
            - call: "POST /research/documents/${doc_id}/vendor-inclusions"
              payload: { vendor_id: "${ven1_id}", dimension_scores: [{ dimension: "PRODUCT_CAPABILITY", raw_score: 4.35, weight_pct: 0.30 }, { dimension: "MARKET_EXECUTION", raw_score: 3.80, weight_pct: 0.25 }, { dimension: "CUSTOMER_VOICE", raw_score: 4.10, weight_pct: 0.20 }, { dimension: "INNOVATION_ROADMAP", raw_score: 3.25, weight_pct: 0.15 }, { dimension: "PRICING_TRANSPARENCY", raw_score: 2.90, weight_pct: 0.10 }], inclusion_criteria_met_count: 5, expected_document_version: "${doc_v}", reprint_tier: "NONE", permitted_marketing_use: "NO_USE", reprint_copies_authorized: 0 }
              as: Analyst
              as_user_id: "${an1_id}"
              captures: { inc1_id: $.data.id }
          assert:
            - "VendorInclusion.${inc1_id}.weighted_total_score == 3.86"
            - "VendorInclusion.${inc1_id}.weighted_total_score != 3.85"
            - "VendorInclusion.${inc1_id}.inclusion_status == UNDER_EVALUATION"
            - "the per-dimension points rounded before summing are [1.31, 0.95, 0.82, 0.49, 0.29]"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: utilization_score_nested_min_across_five_inputs
        grounds:
          - calculations.research_utilization_score
          - entities.ClientAccount.fields.utilization_score
          - entities.ClientAccount.fields.utilization_score_active_weighted
          - entities.ClientAccount.fields.renewal_posture
        distinguishing_aspect: "Mode (a): the score is a nested min/max blend of five inputs with a per-component cap, so a partially activated account lands on 82.24 (SEAT_WEIGHTED) and not on the naive sum of the three uncapped ratios."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Account with seat_count_contracted 4 and inquiry_allowance_total 4; four seats of which three stay ACTIVE and one is REVOKED; two COMPLETED inquiries."
          setup_api_calls:
            - *k_clock
            - &k_acct4
              call: "POST /research/clients"
              payload: { legal_name: "Meridian Health Network", industry: "Healthcare", region: "NA", contract_start_utc: "2026-07-01T00:00:00Z", contract_end_utc: "2027-06-30T00:00:00Z", seat_count_contracted: 4, inquiry_allowance_total: 4, reprint_tier: "PREMIUM" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - *k_an1
            - call: "POST /research/seats"
              payload: { client_account_id: "${acct_id}", seat_email: "seat1@meridian.example", research_role: "ARCHITECT", seat_kind: "NAMED" }
              as: ClientAdmin
              as_user_id: "${acct_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /research/seats"
              payload: { client_account_id: "${acct_id}", seat_email: "seat2@meridian.example", research_role: "PRACTITIONER", seat_kind: "NAMED" }
              as: ClientAdmin
              as_user_id: "${acct_id}"
              captures: { s2_id: $.data.id }
            - call: "POST /research/seats"
              payload: { client_account_id: "${acct_id}", seat_email: "seat3@meridian.example", research_role: "PRACTITIONER", seat_kind: "NAMED" }
              as: ClientAdmin
              as_user_id: "${acct_id}"
              captures: { s3_id: $.data.id }
            - call: "POST /research/seats"
              payload: { client_account_id: "${acct_id}", seat_email: "seat4@meridian.example", research_role: "EXECUTIVE_VIEWER", seat_kind: "NAMED" }
              as: ClientAdmin
              as_user_id: "${acct_id}"
              captures: { s4_id: $.data.id }
            - call: "POST /research/seats/${s1_id}/activate"
              payload: {}
              as: ClientAdmin
              as_user_id: "${acct_id}"
            - call: "POST /research/seats/${s2_id}/activate"
              payload: {}
              as: ClientAdmin
              as_user_id: "${acct_id}"
            - call: "POST /research/seats/${s3_id}/activate"
              payload: {}
              as: ClientAdmin
              as_user_id: "${acct_id}"
            - call: "POST /research/seats/${s4_id}/activate"
              payload: {}
              as: ClientAdmin
              as_user_id: "${acct_id}"
            - call: "POST /research/seats/${s4_id}/revoke"
              payload: {}
              as: ClientAdmin
              as_user_id: "${acct_id}"
            - call: "POST /research/inquiry-requests"
              payload: { seat_id: "${s1_id}", topic_route: "CLOUD_COST", question_summary: "Reference architecture review?", requested_start_utc: "2026-09-02T10:00:00Z", duration_minutes: 45, preparation_notes: "Architecture deck attached." }
              as: SeatHolder
              as_user_id: "${s1_id}"
              captures: { inq1_id: $.data.id }
            - call: "POST /research/inquiry-requests"
              payload: { seat_id: "${s1_id}", topic_route: "CLOUD_COST", question_summary: "Vendor shortlist pressure test?", requested_start_utc: "2026-09-02T11:00:00Z", duration_minutes: 45, preparation_notes: "Shortlist attached." }
              as: SeatHolder
              as_user_id: "${s1_id}"
              captures: { inq2_id: $.data.id }
            - call: "POST /research/inquiry-requests/${inq1_id}/schedule"
              payload: { scheduled_start_utc: "2026-09-02T10:00:00Z" }
              as: Analyst
              as_user_id: "${an1_id}"
            - call: "POST /research/inquiry-requests/${inq2_id}/schedule"
              payload: { scheduled_start_utc: "2026-09-02T11:00:00Z" }
              as: Analyst
              as_user_id: "${an1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /research/inquiry-requests/${inq1_id}/complete"
              payload: { outcome: "COMPLETED", note_delivered: true, note_reference: "NOTE-1" }
              as: Analyst
              as_user_id: "${an1_id}"
            - call: "POST /research/inquiry-requests/${inq2_id}/complete"
              payload: { outcome: "COMPLETED", note_delivered: true, note_reference: "NOTE-2" }
              as: Analyst
              as_user_id: "${an1_id}"
          trigger:
            - call: "GET /research/clients/${acct_id}"
              payload: {}
              as: ClientAdmin
              as_user_id: "${acct_id}"
          assert:
            - "ClientAccount.${acct_id}.active_seat_count == 3"
            - "ClientAccount.${acct_id}.revoked_seat_count == 1"
            - "ClientAccount.${acct_id}.utilization_score == 82.24"
            - "ClientAccount.${acct_id}.utilization_score_active_weighted == 90.88"
            - "ClientAccount.${acct_id}.renewal_posture == HEALTHY"
            - "ClientAccount.${acct_id}.utilization_score != 100.00"

      - name: evaluation_dimension_rounding_boundary_cent
        grounds:
          - calculations.vendor_evaluation_weighted_score
          - entities.VendorInclusion.fields.weighted_total_score
        distinguishing_aspect: "Mode (b): nested rounding where the order is pinned — three of the five dimension products land exactly on a half-cent (1.305, 1.025, 0.4875), so rounding per dimension then summing gives 4.06 while summing then rounding once gives 4.04."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One analyst, one ACTIVE vendor and one DRAFT document."
          setup_api_calls:
            - *k_clock
            - *k_an1
            - *k_ven1
            - *k_doc
          trigger:
            - call: "POST /research/documents/${doc_id}/vendor-inclusions"
              payload: { vendor_id: "${ven1_id}", dimension_scores: [{ dimension: "PRODUCT_CAPABILITY", raw_score: 4.35, weight_pct: 0.30 }, { dimension: "MARKET_EXECUTION", raw_score: 4.10, weight_pct: 0.25 }, { dimension: "CUSTOMER_VOICE", raw_score: 4.10, weight_pct: 0.20 }, { dimension: "INNOVATION_ROADMAP", raw_score: 3.25, weight_pct: 0.15 }, { dimension: "PRICING_TRANSPARENCY", raw_score: 4.05, weight_pct: 0.10 }], inclusion_criteria_met_count: 5, expected_document_version: "${doc_v}", reprint_tier: "NONE", permitted_marketing_use: "NO_USE", reprint_copies_authorized: 0 }
              as: Analyst
              as_user_id: "${an1_id}"
              captures: { inc2_id: $.data.id }
          assert:
            - "VendorInclusion.${inc2_id}.weighted_total_score == 4.06"
            - "VendorInclusion.${inc2_id}.weighted_total_score != 4.04"
            - "the per-dimension points are [1.31, 1.03, 0.82, 0.49, 0.41] and their sum is 4.06"

      - name: reprint_fee_bracket_selected_from_pre_discount_total
        grounds:
          - calculations.reprint_license_fee
          - entities.VendorInclusion.fields.reprint_fee_cents
          - entities.VendorInclusion.fields.reprint_copies_used
        distinguishing_aspect: "Mode (c): the volume-discount bracket is keyed on the pre-discount total that already contains the overage, so 250000 base plus 300 overage copies at 900 lands on the 500000 bracket and pays 468000 — re-selecting the bracket from the discounted total would pay the undiscounted 520000."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One analyst, one ACTIVE vendor and one DRAFT document."
          setup_api_calls:
            - *k_clock
            - *k_an1
            - *k_ven1
            - *k_doc
          trigger:
            - call: "POST /research/documents/${doc_id}/vendor-inclusions"
              payload: { vendor_id: "${ven1_id}", dimension_scores: [{ dimension: "PRODUCT_CAPABILITY", raw_score: 4.35, weight_pct: 0.30 }, { dimension: "MARKET_EXECUTION", raw_score: 3.80, weight_pct: 0.25 }, { dimension: "CUSTOMER_VOICE", raw_score: 4.10, weight_pct: 0.20 }, { dimension: "INNOVATION_ROADMAP", raw_score: 3.25, weight_pct: 0.15 }, { dimension: "PRICING_TRANSPARENCY", raw_score: 2.90, weight_pct: 0.10 }], inclusion_criteria_met_count: 5, expected_document_version: "${doc_v}", reprint_tier: "STANDARD", permitted_marketing_use: "FULL_REPRINT", reprint_copies_authorized: 800 }
              as: Analyst
              as_user_id: "${an1_id}"
              captures: { inc3_id: $.data.id }
            - call: "POST /research/vendor-inclusions/${inc3_id}/reprint-copy-adjustments"
              payload: { delta_copies: 800, permitted_marketing_use: "FULL_REPRINT" }
              as: VendorRep
              as_user_id: "${ven1_id}"
          assert:
            - "VendorInclusion.${inc3_id}.reprint_copies_used == 800"
            - "VendorInclusion.${inc3_id}.reprint_fee_cents == 468000"
            - "VendorInclusion.${inc3_id}.reprint_fee_cents != 520000"
            - "the pre-discount total is 250000 + 300 * 900 == 520000 and the bracket selected from it is 0.10"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: inquiry_decline_reroute_cycle
        grounds:
          - state_machines.InquiryRequest.SCHEDULED_to_ROUTED
          - entities.InquiryRequest.fields.declined_analyst_ids
          - entities.InquiryRequest.fields.routing_attempt_count
        distinguishing_aspect: "A cycle on InquiryRequest: SCHEDULED -> ROUTED re-enters the routing selector with the declining analyst excluded, so the inquiry leaves the schedule, releases its reservation and lands on the second-ranked analyst instead of terminating."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Account with allowance 10; one ACTIVE seat; two analysts on route CLOUD_COST (DISTINGUISHED and SENIOR)."
            - "One inquiry created on route CLOUD_COST and scheduled by the DISTINGUISHED analyst."
          setup_api_calls:
            - *k_clock
            - *k_acct10
            - *k_an1
            - &k_an2
              call: "POST /research/analysts"
              payload: { full_name: "Ravi Menon", practice_area: "CIO_TECH", topic_routes: ["CLOUD_COST"], seniority: "SENIOR", status: "ACTIVE" }
              as: PlatformAdmin
              captures: { an2_id: $.data.id }
            - *k_seat
            - *k_seat_act
            - call: "POST /research/inquiry-requests"
              payload: { seat_id: "${seat_id}", topic_route: "CLOUD_COST", question_summary: "Which observability vendor fits our estate?", requested_start_utc: "2026-09-10T15:00:00Z", duration_minutes: 45, preparation_notes: "Estate inventory attached." }
              as: SeatHolder
              as_user_id: "${seat_id}"
              captures: { inq_id: $.data.id }
            - call: "POST /research/inquiry-requests/${inq_id}/schedule"
              payload: { scheduled_start_utc: "2026-09-10T15:00:00Z" }
              as: Analyst
              as_user_id: "${an1_id}"
          trigger:
            - call: "POST /research/inquiry-requests/${inq_id}/decline"
              payload: { decline_reason: "Outside my practice this quarter" }
              as: Analyst
              as_user_id: "${an1_id}"
          assert:
            - "InquiryRequest.${inq_id}.status == ROUTED"
            - "InquiryRequest.${inq_id}.analyst_id == ${an2_id}"
            - "InquiryRequest.${inq_id}.analyst_id != ${an1_id}"
            - "InquiryRequest.${inq_id}.routing_attempt_count == 2"
            - "InquiryRequest.${inq_id}.scheduled_start_utc is null"
            - "InquiryRequest.${inq_id}.declined_analyst_ids == [${an1_id}]"
            - "ClientAccount.${acct_id}.reserved_inquiry_units == 0 and ClientAccount.${acct_id}.remaining_reserved_units == 10"

      - name: document_editorial_and_embargo_parallel_dimensions
        grounds:
          - state_machines.ResearchDocument.CLEARED_to_PUBLISHED
          - state_machines.ResearchDocument.EMBARGOED_to_RELEASED
          - entities.ResearchDocument.fields.embargo_status
          - entities.ResearchDocument.fields.embargo_until
        distinguishing_aspect: "Two independent state dimensions on one ResearchDocument row: the editorial dimension sits at PUBLISHED while the embargo dimension independently crosses EMBARGOED -> RELEASED at exactly embargo_until, so the document is published for a full 14 days while vendor reads stay refused."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One INCLUDED, fact-checked inclusion on a document that has been published with embargo_days 14."
          setup_api_calls:
            - *k_clock
            - *k_an1
            - *k_an2
            - *k_ven1
            - *k_doc
            - &k_inc_include
              call: "POST /research/documents/${doc_id}/vendor-inclusions"
