  - section: cross_cutting_complexity_layers
    instances:
      - name: a_stale_expected_episode_version_blocks_the_authorization_write_until_a_refetch
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.authorization-create-stale-episode
          - validations.priority_17_ERR_STALE_EPISODE_VERSION
          - endpoints.POST_/authorizations
        distinguishing_aspect: "The episode version the coordinator read at creation time is invalidated by an unrelated monitoring-lab write, so replaying it yields ERR_STALE_EPISODE_VERSION 412 with no Authorization created; only a refetched version is accepted, which proves the OCC token is the episode's live version and not a constant."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Patient RH0001 has a PLANNED Infliximab episode; the coordinator captures the episode version returned by the create call."
            - "The infusion nurse then files a CMP monitoring panel for that episode, which flips monitoring_status to CURRENT and increments TherapyEpisode.version, making the captured value stale."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /clinicians"
              payload: { npi: "1234567893", full_name: "Ada Rheum", role_type: "RHEUMATOLOGIST", can_attest_formulary_exception: true }
              as: RegistryAdmin
              captures: { rheum1_id: $.data.id }
            - call: "POST /clinicians"
              payload: { npi: "1234567895", full_name: "Nia Nurse", role_type: "NURSE" }
              as: RegistryAdmin
              captures: { nurse1_id: $.data.id }
            - call: "POST /drugs"
              payload: { name: "Infliximab", molecule_class: "TNFI", route: "IV", formulary_tier: 3, acquisition_cost_cents: 250050, admin_time_minutes: 150, monitoring_panel_type: "CMP", monitoring_panel_interval_days: 90 }
              as: RegistryAdmin
              captures: { ifx_id: $.data.id }
            - call: "POST /payer-plans"
              payload: { name: "Meridian PPO", pharmacy_benefit_enabled: true, medical_benefit_enabled: true, site_of_care_policy: "PREFER_AMBULATORY", coinsurance_pct: 0.175, deductible_remaining_cents: 100000, medical_facility_fee_cents: 12500, hospital_outpatient_multiplier: 1.40, appeal_rounds_allowed: 2, auth_validity_days: 180, step_therapy_classes_required: [] }
              as: RegistryAdmin
              captures: { mer_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "RH0001", full_name: "Pat One", date_of_birth: "1975-04-12", diagnosis_code: "RA_SEROPOSITIVE", registry_consent: true }
              as: RegistryAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /therapy-episodes"
              payload: { patient_id: "${pat_id}", drug_id: "${ifx_id}", payer_plan_id: "${mer_id}", therapy_start_at: "2026-08-01T00:00:00Z", expected_patient_version: "${pat_v}" }
              as: Rheumatologist
              as_user_id: "${rheum1_id}"
              captures: { ep_id: $.data.id, ep_v_stale: $.data.version }
            - call: "POST /monitoring-labs"
              payload: { episode_id: "${ep_id}", panel_type: "CMP", collected_at: "2026-07-25T00:00:00Z", alt_u_l: 30.0, neutrophil_k_ul: 3.20 }
              as: InfusionNurse
              as_user_id: "${nurse1_id}"
          trigger:
            - call: "POST /authorizations"
              payload: { episode_id: "${ep_id}", requested_units: 6, expected_episode_version: "${ep_v_stale}" }
              as: PriorAuthCoordinator
              as_user_id: "pac-alpha"
              captures: { err_stale: $.data.error_id }
            - call: "GET /therapy-episodes/${ep_id}"
              payload: {}
              as: PriorAuthCoordinator
              as_user_id: "pac-alpha"
              captures: { ep_v_fresh: $.data.version }
            - call: "POST /authorizations"
              payload: { episode_id: "${ep_id}", requested_units: 6, expected_episode_version: "${ep_v_fresh}" }
              as: PriorAuthCoordinator
              as_user_id: "pac-alpha"
              captures: { auth_id: $.data.id }
          assert:
            - "${err_stale} == \"ERR_STALE_EPISODE_VERSION\" with HTTP 412"
            - "${ep_v_fresh} == ${ep_v_stale} + 1 (the monitoring-lab write, not the rejected authorization, moved the version)"
            - "immediately after the rejection GET /authorizations?episode_id=${ep_id} returns total_count == 0 and TherapyEpisode.${ep_id}.funding_state == \"UNFUNDED\""
            - "the retry returns HTTP 201 with status == \"DRAFT\", requested_units == 6, units_reserved == 0, appeal_round == 0"
            - "after the retry TherapyEpisode.${ep_id}.funding_state == \"PENDING_AUTH\" and monitoring_status == \"CURRENT\""

      - name: the_calendar_sweep_expires_on_strictly_after_but_flags_renewal_on_or_before
        claim_type: scheduled_actions
        grounds:
