    code: 200
    input: []
    output: UsageReport
    side_effects: ["report_status -> SUBMITTED; snapshot_rate stored"]

  - method: POST
    path: "/usage-reports/{id}/accept"
    description: "Accept a submitted report"
    roles: [RoyaltyOps]
    code: 200
    input: []
    output: UsageReport
    side_effects: ["report_status SUBMITTED -> ACCEPTED"]

  - method: POST
    path: "/usage-reports/{id}/reject"
