      - name: pagination_defaults_and_bounds_are_uniform_across_collections
        claim_type: standard_crud
        grounds:
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - endpoints[GET /market-conduct/insurers]
        distinguishing_aspect: |
          The envelope declares limit, offset, total_count and has_more outside data, so the four
          pagination fields are never confusable with entity fields. The bounds are exclusive on both
          sides - 0 and 101 are both refused while 1 and 100 are accepted - and has_more is derived from
          offset plus returned rows against total_count rather than from the page being full, which is
          the only way an offset past the end can return an empty page with has_more false.
        test_recipe:
          setup:
            - "Three carriers so a two-row page is a genuine partial page."
          setup_api_calls:
            - call: "POST /market-conduct/insurers"
              payload: { name: "Aurora Mutual Insurance Company", naic_code: "10001", annual_premium_written_cents: 1200000000, policy_count_in_force: 40000, confirmed_complaints_12mo: 120, financial_stress_score: 60, consumer_trend_score: 50 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { a_id: "$.data.id" }
            - call: "POST /market-conduct/insurers"
              payload: { name: "Boreal Casualty Company", naic_code: "10002", annual_premium_written_cents: 1200000000, policy_count_in_force: 40000, confirmed_complaints_12mo: 120, financial_stress_score: 60, consumer_trend_score: 50 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { b_id: "$.data.id" }
            - call: "POST /market-conduct/insurers"
              payload: { name: "Cascade Indemnity Group", naic_code: "10003", annual_premium_written_cents: 1200000000, policy_count_in_force: 40000, confirmed_complaints_12mo: 120, financial_stress_score: 60, consumer_trend_score: 50 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { c_id: "$.data.id" }
          trigger:
            - call: "GET /market-conduct/insurers"
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { page_first: "$.data[0].id" }
            - call: "GET /market-conduct/insurers"
              payload: { limit: 2, offset: 0 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { p1_first: "$.data[0].id" }
            - call: "GET /market-conduct/insurers"
              payload: { limit: 2, offset: 2 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { p2_first: "$.data[0].id" }
            - call: "GET /market-conduct/insurers"
              payload: { limit: 2, offset: 99 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
            - call: "GET /market-conduct/insurers"
              payload: { limit: 0 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { err_low: "$.data.error_id" }
            - call: "GET /market-conduct/insurers"
              payload: { limit: 101 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { err_high: "$.data.error_id" }
            - call: "GET /market-conduct/insurers"
              payload: { limit: 100 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
            - call: "GET /market-conduct/insurers"
              payload: { license_status: "SUSPENDED" }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
            - call: "GET /market-conduct/insurers"
              payload: { risk_tier: "ELEVATED", limit: 1 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
          assert:
            - "With no pagination arguments the envelope reports limit == 10 and offset == 0 by default, total_count == 3 and has_more == false"
            - "limit 2 offset 0 returns 2 rows with total_count == 3 and has_more == true"
            - "limit 2 offset 2 returns 1 row with total_count == 3 and has_more == false"
            - "limit 2 offset 99 returns 0 rows with total_count == 3 and has_more == false - an out-of-range offset is not an error"
            - "limit 0 returns 422 ERR_INVALID_REQUEST and limit 101 returns 422 ERR_INVALID_REQUEST"
            - "limit 100 is accepted - the maximum is inclusive"
            - "Filtering to SUSPENDED reports total_count == 0 while all three rows are LICENSED"
            - "total_count reflects the filtered population and not the page: risk_tier ELEVATED with limit 1 returns 1 row but reports total_count == 3, because all three carriers sit at ratio 3.00 and therefore ELEVATED"
            - "limit, offset, total_count and has_more appear in the envelope and never inside data"

