  # =========================================================================
  # Rule 5: Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_special_order_re_quote_from_re_quoted
        grounds:
          - validations[priority=7]
          - validations[priority=18]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SPECIAL_ORDER_INVALID_STATE]
        distinguishing_aspect: |
          Dual-failure request: a Manager tries to re-quote a SpecialOrder
          currently in REQUESTED (invalid FROM state) whose revision_count is
          already 3. The state check (priority 7, category=state) fires
          BEFORE the fiscal check (priority 18, category=business_fiscal).
          Pair: state × business_fiscal.
        test_recipe:
          setup:
            - "SpecialOrder in REQUESTED with revision_count=3 (impossible via legitimate flow; must be seeded)."
            - "Impossible via /_seed — instead we drive the state via the legitimate quote/re-quote cycle so the SO reaches revision_count=3 and status=RE_QUOTED, then try re-quoting from a REQUESTED-styled scenario via a NEW SpecialOrder that hits ONLY the state check (re-quote from REQUESTED)."
            - "Simpler & sufficient — the SO is in status=REQUESTED (never quoted), re-quote attempt hits the state precondition."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: Manager
            - call: "POST /customers/register"
