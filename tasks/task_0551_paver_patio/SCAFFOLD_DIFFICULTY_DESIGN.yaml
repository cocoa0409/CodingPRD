          - state_machines.ProgressDraw.PENDING_to_PAID
        distinguishing_aspect: |
          state (priority 6) vs business_fiscal (priority 10): a single PROGRESS-draw request on a
          DRAFT project both violates the CONTRACTED/IN_PRODUCTION state precondition AND exceeds
          balance (0). The state error ERR_INVALID_STATE (409) wins over ERR_DRAW_EXCEEDS_BALANCE (422).
        test_recipe:
          setup:
            - "Fresh DB. A brand-new DRAFT project (version 1, contract_value 0)."
          setup_api_calls:
