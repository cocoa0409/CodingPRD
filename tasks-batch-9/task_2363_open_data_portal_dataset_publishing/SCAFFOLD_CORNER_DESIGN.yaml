  - section: errors
    instances:
      - name: unknown_path_ids_return_typed_not_found_errors
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - errors.ERR_DEPARTMENT_NOT_FOUND
          - errors.ERR_LICENSE_NOT_FOUND
          - errors.ERR_RUNNER_NOT_FOUND
          - errors.ERR_METADATA_NOT_FOUND
          - errors.ERR_ASSESSMENT_NOT_FOUND
          - errors.ERR_PIPELINE_NOT_FOUND
          - errors.ERR_RUN_NOT_FOUND
          - errors.ERR_VERSION_NOT_FOUND
          - errors.ERR_ISSUE_NOT_FOUND
          - errors.ERR_MEMBER_NOT_FOUND
          - errors.ERR_REQUEST_NOT_FOUND
        distinguishing_aspect: "Each path-parameterised resource has its OWN 404 error_id — a shared generic ERR_NOT_FOUND would fail this instance, because every read below must name the resource type it failed to resolve."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "The database is otherwise empty — no department, licence, runner, dataset, pipeline, run, version, issue, member or request exists"
          setup_api_calls:
