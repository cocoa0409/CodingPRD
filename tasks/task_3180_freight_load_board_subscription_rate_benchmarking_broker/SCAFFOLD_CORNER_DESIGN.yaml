# =============================================================================
# §1.9 Scaffold Corner Design — Task 3180 Freight Load Board
# Breadth coverage of §1.1–§1.7 claims not exercised by §1.8.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: broker_org_create_returns_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - "entities.BrokerOrg"
          - "endpoints.POST_/broker-orgs"
        distinguishing_aspect: "POST with only legal_name + mc_number returns 201 with status ACTIVE, credit_score 70, credit_badge STANDARD, zeroed credit totals, data_contribution_flag false, version 1, and system-minted id/created_at/updated_at."
        test_recipe:
          setup: ["Clock unset (defaults to 2026-09-01T00:00:00Z). Empty database."]
          setup_api_calls: []
          trigger:
            - &c_broker
              call: "POST /broker-orgs"
              payload: { legal_name: "First Call Brokerage", mc_number: "MC-1000" }
              as: PlatformAdmin
              captures: { c_broker_id: $.data.id }
          assert:
            - "201; BrokerOrg.${c_broker_id}.status == ACTIVE, credit_score == 70, credit_badge == STANDARD"
            - "credit_event_count == 0 and included_amount_cents == 0 and under_dispute_amount_cents == 0 and removed_amount_cents == 0"
            - "data_contribution_flag == false and version == 1"
            - "id, created_at, updated_at are present; created_at == 2026-09-01T00:00:00.000Z (default logical clock)"

      - name: broker_org_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - "endpoints.GET_/broker-orgs/{id}"
          - "errors.ERR_ORG_NOT_FOUND"
        distinguishing_aspect: "A well-formed but unallocated UUID yields 404 ERR_ORG_NOT_FOUND on the error envelope, not a generic 400."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /broker-orgs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "404 and err == ERR_ORG_NOT_FOUND; response_type == error with error_id and message present"

      - name: load_post_create_missing_origin_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - "entities.LoadPost.fields.origin"
          - "errors.ERR_INVALID_REQUEST"
        distinguishing_aspect: "origin has source input and no default; omitting it is a 400 ERR_INVALID_REQUEST before any state or fiscal check."
        test_recipe:
          setup: ["Clock 2026-08-01T00:00:00Z. Broker B VERIFIED and subscribed."]
          setup_api_calls:
            - &cc_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - &cc_plan
              call: "POST /subscription-plans"
              payload: { code: "PRO", monthly_posting_allowance: 5, overage_tier1_limit: 2, overage_hard_cap: 2, search_daily_limit: 20, analytics_depth: "LANE_LEVEL", requires_data_contribution: false }
              as: PlatformAdmin
              captures: { cc_plan_id: $.data.id }
            - &cc_broker
              call: "POST /broker-orgs"
              payload: { legal_name: "Required Field Brokers", mc_number: "MC-1100" }
              as: PlatformAdmin
              captures: { cc_broker_id: $.data.id }
            - &cc_sub
              call: "POST /subscriptions"
              payload: { plan_id: "${cc_plan_id}", broker_org_id: "${cc_broker_id}" }
              as: PlatformAdmin
            - &cc_av
              call: "POST /authority-verifications"
              payload: { broker_org_id: "${cc_broker_id}", authority_reference: "MC-1100-AUTH", insurance_windows: [{ effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }] }
              as: BrokerAdmin
              as_user_id: "${cc_broker_id}"
              captures: { cc_av_id: $.data.id }
            - &cc_av_verify
              call: "POST /authority-verifications/${cc_av_id}/verify"
              payload: {}
              as: ComplianceAnalyst
          trigger:
            - call: "POST /load-posts"
              payload: { destination: "HOU", equipment_type: "DRY_VAN", pickup_window_start: "2026-08-02T00:00:00Z", pickup_window_end: "2026-08-05T00:00:00Z", rate_offer_cents: 100000 }
              as: BrokerAdmin
              as_user_id: "${cc_broker_id}"
              captures: { err: $.data.error_id }
          assert:
            - "400 and err == ERR_INVALID_REQUEST; GET /load-posts?broker_org_id=${cc_broker_id} returns 0 rows"

      - name: load_post_create_with_out_of_enum_equipment_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - "entities.LoadPost.fields.equipment_type"
          - "errors.ERR_INVALID_REQUEST"
        distinguishing_aspect: "equipment_type is a closed enum {DRY_VAN, REEFER, FLATBED}; TANKER is rejected 400, not coerced."
        test_recipe:
          setup: ["Clock 2026-08-01T00:00:00Z. Broker B VERIFIED and subscribed."]
          setup_api_calls:
            - *cc_clock
            - *cc_plan
            - *cc_broker
            - *cc_sub
            - *cc_av
            - *cc_av_verify
          trigger:
            - call: "POST /load-posts"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "TANKER", pickup_window_start: "2026-08-02T00:00:00Z", pickup_window_end: "2026-08-05T00:00:00Z", rate_offer_cents: 100000 }
              as: BrokerAdmin
              as_user_id: "${cc_broker_id}"
              captures: { err: $.data.error_id }
          assert:
            - "400 and err == ERR_INVALID_REQUEST"

      - name: subscription_create_with_both_org_ids_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - "entities.Subscription.fields.broker_org_id"
          - "entities.Subscription.fields.carrier_org_id"
          - "errors.ERR_INVALID_REQUEST"
        distinguishing_aspect: "The XOR constraint: supplying both broker_org_id and carrier_org_id (or neither) is 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Clock 2026-08-01T00:00:00Z. A plan, a broker, and a carrier exist."]
          setup_api_calls:
            - *cc_clock
            - *cc_plan
            - *cc_broker
            - &cc_carrier
              call: "POST /carrier-orgs"
              payload: { legal_name: "XOR Carriers", dot_number: "DOT-1100" }
              as: PlatformAdmin
              captures: { cc_carrier_id: $.data.id }
          trigger:
            - call: "POST /subscriptions"
              payload: { plan_id: "${cc_plan_id}", broker_org_id: "${cc_broker_id}", carrier_org_id: "${cc_carrier_id}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "400 and err == ERR_INVALID_REQUEST; GET /subscriptions?broker_org_id=${cc_broker_id} returns 0 rows"

      - name: load_post_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - "endpoints.GET_/load-posts"
          - "response_envelope.pagination_defaults"
        distinguishing_aspect: "Three loads, limit=2: page 1 has total_count 3 and has_more true; offset=2 returns 1 row with has_more false — total_count spans the filtered set, not the page."
        test_recipe:
          setup: ["Clock 2026-08-01T00:00:00Z. Broker B VERIFIED, subscribed, with 3 OPEN loads."]
          setup_api_calls:
            - *cc_clock
            - *cc_plan
            - *cc_broker
            - *cc_sub
            - *cc_av
            - *cc_av_verify
            - call: "POST /load-posts"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "DRY_VAN", pickup_window_start: "2026-08-02T00:00:00Z", pickup_window_end: "2026-08-05T00:00:00Z", rate_offer_cents: 100000 }
              as: BrokerAdmin
              as_user_id: "${cc_broker_id}"
            - call: "POST /load-posts"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "DRY_VAN", pickup_window_start: "2026-08-02T00:00:00Z", pickup_window_end: "2026-08-05T00:00:00Z", rate_offer_cents: 100000 }
              as: BrokerAdmin
              as_user_id: "${cc_broker_id}"
            - call: "POST /load-posts"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "REEFER", pickup_window_start: "2026-08-02T00:00:00Z", pickup_window_end: "2026-08-05T00:00:00Z", rate_offer_cents: 120000 }
              as: BrokerAdmin
              as_user_id: "${cc_broker_id}"
          trigger:
            - call: "GET /load-posts"
              payload: { broker_org_id: "${cc_broker_id}", limit: 2, offset: 0 }
              as: BrokerAdmin
              as_user_id: "${cc_broker_id}"
          assert:
            - "Page 1: 2 rows, total_count == 3, has_more == true"
            - "Page 2 (offset=2, limit=2): 1 row, total_count == 3, has_more == false"
            - "Filter equipment_type=REEFER returns exactly 1 row"
            - "No query params: limit defaults to 10, offset to 0"

      - name: broker_search_rows_integrate_credit_badge_and_authority_status
        claim_type: Computed Fields
        grounds:
          - "entities.LoadPost.fields.broker_credit_badge"
          - "entities.LoadPost.fields.broker_authority_status"
        distinguishing_aspect: "Search rows carry the posting broker's live credit_badge and authority status; after a credit event pushes the broker's score, a fresh search reflects the new badge."
        test_recipe:
          setup: ["Clock 2026-08-01T00:00:00Z. Broker B VERIFIED, subscribed, with 1 OPEN load. Carrier C with subscription exists."]
          setup_api_calls:
            - *cc_clock
            - *cc_plan
            - *cc_broker
            - *cc_sub
            - *cc_av
            - *cc_av_verify
            - &cc_lp_badge
              call: "POST /load-posts"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "DRY_VAN", pickup_window_start: "2026-08-02T00:00:00Z", pickup_window_end: "2026-08-05T00:00:00Z", rate_offer_cents: 100000 }
              as: BrokerAdmin
              as_user_id: "${cc_broker_id}"
              captures: { cc_load_id: $.data.id }
            - *cc_carrier
            - &cc_carrier_sub
              call: "POST /subscriptions"
              payload: { plan_id: "${cc_plan_id}", carrier_org_id: "${cc_carrier_id}" }
              as: PlatformAdmin
          trigger:
            - call: "GET /load-posts"
              payload: { broker_org_id: "${cc_broker_id}" }
              as: CarrierAdmin
              as_user_id: "${cc_carrier_id}"
            - call: "POST /credit-report-events"
              payload: { broker_org_id: "${cc_broker_id}", invoice_amount_cents: 100000, days_to_pay: 60 }
              as: CarrierAdmin
              as_user_id: "${cc_carrier_id}"
            - call: "GET /load-posts"
              payload: { broker_org_id: "${cc_broker_id}" }
              as: CarrierAdmin
              as_user_id: "${cc_carrier_id}"
          assert:
            - "First search row: broker_credit_badge == STANDARD and broker_authority_status == VERIFIED"
            - "After the dtp=60 event (1 event, SIMPLE: avg 60 -> raw 40, confidence 0.1 -> score 67): second search row shows broker_credit_badge == STANDARD (67 >= 60)"
            - "LoadPost.${cc_load_id} row count is 1 in both searches"

  - section: state_machines
    instances:
      - name: load_post_withdrawn_is_terminal_and_cannot_be_booked
        claim_type: invalid_transition
        grounds:
          - "state_machines.LoadPost"
          - "errors.ERR_LOAD_POST_NOT_OPEN"
        distinguishing_aspect: "WITHDRAWN is terminal: booking it fails ERR_LOAD_POST_NOT_OPEN and no booking row is created."
        test_recipe:
          setup: ["Clock 2026-08-01T00:00:00Z. Broker B VERIFIED + subscribed, carrier C VERIFIED + subscribed; load L withdrawn; truck T AVAILABLE."]
          setup_api_calls:
            - *cc_clock
            - *cc_plan
            - *cc_broker
            - *cc_sub
            - *cc_av
            - *cc_av_verify
            - *cc_carrier
            - *cc_carrier_sub
            - &cc_av_c
              call: "POST /authority-verifications"
              payload: { carrier_org_id: "${cc_carrier_id}", authority_reference: "DOT-1100-AUTH", insurance_windows: [{ effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }] }
              as: CarrierAdmin
              as_user_id: "${cc_carrier_id}"
              captures: { cc_av_c_id: $.data.id }
            - &cc_av_c_verify
              call: "POST /authority-verifications/${cc_av_c_id}/verify"
              payload: {}
              as: ComplianceAnalyst
            - &cc_lp_t
              call: "POST /load-posts"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "DRY_VAN", pickup_window_start: "2026-08-02T00:00:00Z", pickup_window_end: "2026-08-05T00:00:00Z", rate_offer_cents: 100000 }
              as: BrokerAdmin
              as_user_id: "${cc_broker_id}"
              captures: { cc_load_t: $.data.id }
            - &cc_tp_t
              call: "POST /truck-posts"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "DRY_VAN", available_from: "2026-08-02T00:00:00Z", available_until: "2026-08-05T00:00:00Z" }
              as: CarrierAdmin
              as_user_id: "${cc_carrier_id}"
              captures: { cc_truck_t: $.data.id }
            - &cc_wd_t
              call: "POST /load-posts/${cc_load_t}/withdraw"
              payload: {}
              as: BrokerAdmin
              as_user_id: "${cc_broker_id}"
          trigger:
            - call: "POST /bookings"
              payload: { load_post_id: "${cc_load_t}", truck_post_id: "${cc_truck_t}", agreed_rate_cents: 99000 }
              as: CarrierAdmin
              as_user_id: "${cc_carrier_id}"
              captures: { err: $.data.error_id }
          assert:
            - "409 and err == ERR_LOAD_POST_NOT_OPEN; GET /bookings?load_post_id=${cc_load_t} returns 0 rows"

      - name: load_post_expires_eagerly_when_clock_passes_pickup_window_end
        claim_type: Valid Transition
        grounds:
          - "state_machines.LoadPost"
          - "endpoints.POST_/_clock/set_current_utc"
        distinguishing_aspect: "Advancing the logical clock to pickup_window_end transitions OPEN -> EXPIRED eagerly; the expired load can no longer be booked and no refund is issued."
        test_recipe:
          setup: ["Clock 2026-08-01T00:00:00Z. Broker B VERIFIED + subscribed; load L OPEN with window [2026-08-02, 2026-08-05)."]
          setup_api_calls:
            - *cc_clock
            - *cc_plan
            - *cc_broker
            - *cc_sub
            - *cc_av
            - *cc_av_verify
            - &cc_lp_e
              call: "POST /load-posts"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "DRY_VAN", pickup_window_start: "2026-08-02T00:00:00Z", pickup_window_end: "2026-08-05T00:00:00Z", rate_offer_cents: 100000 }
              as: BrokerAdmin
              as_user_id: "${cc_broker_id}"
              captures: { cc_load_e: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /load-posts/${cc_load_e}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "LoadPost.${cc_load_e}.status == EXPIRED (clock reaching pickup_window_end expires it; boundary is inclusive of end)"
            - "POST /load-posts/${cc_load_e}/withdraw afterwards would fail with ERR_LOAD_POST_NOT_OPEN"

      - name: booking_complete_creates_booking_sourced_rate_transaction
        claim_type: Side Effect Execution
        grounds:
          - "state_machines.Booking"
          - "entities.Booking.fields.rate_transaction_id"
        distinguishing_aspect: "Completing a booking flips load and truck to COMPLETED and creates a RateTransaction (source BOOKING, kind SPOT, agreed rate) discoverable via GET /rate-transactions?booking_id=."
        test_recipe:
          setup: ["Clock 2026-08-01T00:00:00Z. Broker B + carrier C VERIFIED and subscribed; load booked via truck T, booking BK is BOOKED."]
          setup_api_calls:
            - *cc_clock
            - *cc_plan
            - *cc_broker
            - *cc_sub
            - *cc_av
            - *cc_av_verify
            - *cc_carrier
            - *cc_carrier_sub
            - *cc_av_c
            - *cc_av_c_verify
            - &cc_lp_b
              call: "POST /load-posts"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "DRY_VAN", pickup_window_start: "2026-08-02T00:00:00Z", pickup_window_end: "2026-08-05T00:00:00Z", rate_offer_cents: 100000 }
              as: BrokerAdmin
              as_user_id: "${cc_broker_id}"
              captures: { cc_load_b: $.data.id }
            - &cc_tp_b
              call: "POST /truck-posts"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "DRY_VAN", available_from: "2026-08-02T00:00:00Z", available_until: "2026-08-05T00:00:00Z" }
              as: CarrierAdmin
              as_user_id: "${cc_carrier_id}"
              captures: { cc_truck_b: $.data.id }
            - &cc_bk_b
              call: "POST /bookings"
              payload: { load_post_id: "${cc_load_b}", truck_post_id: "${cc_truck_b}", agreed_rate_cents: 99000 }
              as: CarrierAdmin
              as_user_id: "${cc_carrier_id}"
              captures: { cc_bk_id: $.data.id }
          trigger:
            - call: "POST /bookings/${cc_bk_id}/complete"
              payload: {}
              as: CarrierAdmin
              as_user_id: "${cc_carrier_id}"
          assert:
            - "Booking.${cc_bk_id}.status == COMPLETED and rate_transaction_id is non-null"
            - "LoadPost.${cc_load_b}.status == COMPLETED and TruckPost.${cc_truck_b}.status == COMPLETED"
            - "GET /rate-transactions?booking_id=${cc_bk_id} returns 1 row with source == BOOKING, rate_kind == SPOT, rate_cents == 99000, status == ACCEPTED"

      - name: booking_cancel_restores_load_open_and_truck_available
        claim_type: Side Effect Execution
        grounds:
          - "state_machines.Booking"
          - "state_machines.LoadPost"
          - "state_machines.TruckPost"
        distinguishing_aspect: "Compensation pattern: cancelling a BOOKED booking reopens the load (OPEN + LISTED) and releases the truck to AVAILABLE — both resources revert, nothing lingers."
        test_recipe:
          setup: ["Clock 2026-08-01T00:00:00Z. Broker B + carrier C VERIFIED and subscribed; booking BK is BOOKED."]
          setup_api_calls:
            - *cc_clock
            - *cc_plan
            - *cc_broker
            - *cc_sub
            - *cc_av
            - *cc_av_verify
            - *cc_carrier
            - *cc_carrier_sub
            - *cc_av_c
            - *cc_av_c_verify
            - *cc_lp_b
            - *cc_tp_b
            - *cc_bk_b
          trigger:
            - call: "POST /bookings/${cc_bk_id}/cancel"
              payload: {}
              as: BrokerAdmin
              as_user_id: "${cc_broker_id}"
          assert:
            - "Booking.${cc_bk_id}.status == CANCELLED"
            - "LoadPost.${cc_load_b}.status == OPEN and visibility == LISTED"
            - "TruckPost.${cc_truck_b}.status == AVAILABLE"

      - name: subscription_past_due_cycle_and_terminal_cancel
        claim_type: invalid_transition
        grounds:
          - "state_machines.Subscription"
          - "errors.ERR_SUBSCRIPTION_NOT_ACTIVE"
        distinguishing_aspect: "ACTIVE->PAST_DUE->ACTIVE is a legal cycle; CANCELLED is terminal — record-payment on a CANCELLED subscription fails ERR_SUBSCRIPTION_NOT_ACTIVE."
        test_recipe:
          setup: ["Clock 2026-08-01T00:00:00Z. Broker B with ACTIVE subscription."]
          setup_api_calls:
            - *cc_clock
            - *cc_plan
            - *cc_broker
            - &cc_sub2
              call: "POST /subscriptions"
              payload: { plan_id: "${cc_plan_id}", broker_org_id: "${cc_broker_id}" }
              as: PlatformAdmin
              captures: { cc_sub2_id: $.data.id }
            - &cc_pd
              call: "POST /subscriptions/${cc_sub2_id}/mark-past-due"
              payload: {}
              as: PlatformAdmin
            - &cc_pay
              call: "POST /subscriptions/${cc_sub2_id}/record-payment"
              payload: {}
              as: PlatformAdmin
            - &cc_cancel
              call: "POST /subscriptions/${cc_sub2_id}/cancel"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /subscriptions/${cc_sub2_id}/record-payment"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Cycle succeeded: after mark-past-due status PAST_DUE, after record-payment status ACTIVE"
            - "After cancel: status == CANCELLED; final record-payment returns 409 and err == ERR_SUBSCRIPTION_NOT_ACTIVE"

      - name: fraud_alert_dismissed_is_terminal_and_confirm_rejected
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.FraudAlert"
        distinguishing_aspect: "From DISMISSED (terminal) no transition exists: confirm on a dismissed alert returns 409."
        test_recipe:
          setup: ["Clock 2026-08-01T00:00:00Z. Broker B exists; an OPEN fraud alert targets it; alert is dismissed."]
          setup_api_calls:
            - *cc_clock
            - *cc_broker
            - &cc_fa
              call: "POST /fraud-alerts"
              payload: { alert_type: "IDENTITY_SPOOFING", target_broker_org_id: "${cc_broker_id}", evidence_note: "Lookalike domain registration" }
              as: ComplianceAnalyst
              captures: { cc_fa_id: $.data.id }
            - &cc_fa_dismiss
              call: "POST /fraud-alerts/${cc_fa_id}/dismiss"
              payload: {}
              as: ComplianceAnalyst
          trigger:
            - call: "POST /fraud-alerts/${cc_fa_id}/confirm"
              payload: {}
              as: ComplianceAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "409; FraudAlert.${cc_fa_id}.status remains DISMISSED; BrokerOrg.${cc_broker_id}.status remains ACTIVE"

  - section: calculations
    instances:
      - name: benchmark_input_set_excludes_excluded_and_out_of_window_transactions
        claim_type: Input Set Filtering
        grounds:
          - "calculations.lane_rate_benchmark"
          - "endpoints.POST_/rate-transactions/{id}/exclude"
        distinguishing_aspect: "EXCLUDED transactions and transactions older than 30 days never enter the sample set: excluding one of 5 drops the lane back to 422, and a 31-day-old transaction does not count."
        test_recipe:
          setup: ["Clock 2026-08-01T00:00:00Z. Carrier C with FULL plan; 5 SPOT transactions on lane SEA->PDX DRY_VAN (all 2026-07-20..24, fuel 400); plus 1 SPOT dated 2026-07-01 (>30 days old)."]
          setup_api_calls:
            - *cc_clock
            - &cc_plan_full
              call: "POST /subscription-plans"
              payload: { code: "ENTERPRISE", monthly_posting_allowance: 50, overage_tier1_limit: 10, overage_hard_cap: 20, search_daily_limit: 100, analytics_depth: "FULL", requires_data_contribution: false }
              as: PlatformAdmin
              captures: { cc_plan_full_id: $.data.id }
            - *cc_carrier
            - &cc_carrier_sub2
              call: "POST /subscriptions"
              payload: { plan_id: "${cc_plan_full_id}", carrier_org_id: "${cc_carrier_id}" }
              as: PlatformAdmin
            - &rt_s1
              call: "POST /rate-transactions"
              payload: { origin: "SEA", destination: "PDX", equipment_type: "DRY_VAN", rate_kind: "SPOT", rate_cents: 80000, fuel_price_cents: 400, transaction_date: "2026-07-20T00:00:00Z" }
              as: CarrierAdmin
              as_user_id: "${cc_carrier_id}"
              captures: { rt_s1_id: $.data.id }
            - &rt_s2
              call: "POST /rate-transactions"
