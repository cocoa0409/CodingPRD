              as: ProgramAdministrator
              captures: { pol_id: "$.data.id" }
            - call: "POST /league-policies/${pol_id}/bind"
              payload: {}
              as: ProgramAdministrator
          trigger:
            - call: "POST /league-policies/${pol_id}/bind"
              payload: {}
              as: ProgramAdministrator
          assert:
            - "HTTP 409 with data.error_id == ERR_INVALID_POLICY_STATE (not ERR_POLICY_TERM_OVERLAP: a policy never overlaps itself)"
            - "LeaguePolicy.${pol_id}.status is still BOUND and version is still 2"

      - name: second_sanction_decision_on_a_sanctioned_activity_rejected
        claim_type: idempotency
        grounds:
          - validations[priority=8]
          - errors[ERR_INVALID_ACTIVITY_STATE]
          - state_machines.SanctionedActivity.PENDING_SANCTION_to_SANCTIONED
        distinguishing_aspect: "SANCTIONED is reachable only from PENDING_SANCTION, so a repeated SANCTION decision must fail 409 ERR_INVALID_ACTIVITY_STATE and must not overwrite sanctioning_official_id with the second official's id - which would silently defeat the segregation-of-duties rule at priority 17."
        test_recipe:
