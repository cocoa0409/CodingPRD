          trigger:
            - call: "POST /crayon-works/assortment-specs"
              payload: { name: "Classroom 24-box", kind: CLASSROOM, partner_name: "CrayonEdu Partners", entries: [{ color_id: "${c2_id}", count: 24 }], wholesale_price_cents: 4800 }
