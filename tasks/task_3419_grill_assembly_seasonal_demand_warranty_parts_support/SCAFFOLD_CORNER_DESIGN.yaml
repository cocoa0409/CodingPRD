  - section: cross_cutting_complexity_layers
    instances:
      - name: allocation_create_with_stale_season_version_returns_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[allocation-create-stale-season]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Season.version: after alloc-1 bumps the season to version 4, a second create still carrying version 3 is rejected 412 — two strictly sequential requests, no wall-clock dependence; re-reading the season and retrying succeeds."
        test_recipe:
          setup: ["Season 2026 in ALLOCATION (version 3 after two advances); channels CH-A, CH-B; lot 20; alloc-1 for CH-A created with expected_season_version 3"]
          setup_api_calls:
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons", payload: { name: "Grilling Season 2026", year: 2026, build_start: "2026-01-05T00:00:00Z", allocation_open: "2026-02-01T00:00:00Z", in_season_start: "2026-03-01T00:00:00Z", clearance_start: "2026-08-01T00:00:00Z", season_end: "2026-09-30T00:00:00Z", demand_forecast_units: 1000 }, as: PlannerAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /grillops/models", payload: { model_code: "GX-100", model_family: "GX", model_year: 2026, base_price_cents: 100000, demand_share_bp: 5000 }, as: PlannerAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /grillops/channels", payload: { name: "CH-A", channel_type: "HOME_CENTER", allocation_priority: 10, credit_limit_cents: 100000000 }, as: PlannerAdmin, captures: { chA: "$.data.id" } }
            - { call: "POST /grillops/channels", payload: { name: "CH-B", channel_type: "SPECIALTY_DEALER", allocation_priority: 20, credit_limit_cents: 100000000 }, as: PlannerAdmin, captures: { chB: "$.data.id" } }
            - { call: "POST /grillops/seasons/${s_id}/lots", payload: { model_id: "${m_id}", build_week: "2026-W06", units_built: 20 }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "BUILD" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "ALLOCATION" }, as: PlannerAdmin }
            - { call: "GET /grillops/seasons/${s_id}", as: PlannerAdmin, captures: { sv: "$.data.version" } }
            - { call: "POST /grillops/allocations", payload: { season_id: "${s_id}", channel_account_id: "${chA}", model_id: "${m_id}", allocated_units: 5, expected_season_version: "${sv}" }, as: PlannerAdmin, captures: { a1: "$.data.id" } }
          trigger:
            - { call: "POST /grillops/allocations", payload: { season_id: "${s_id}", channel_account_id: "${chB}", model_id: "${m_id}", allocated_units: 5, expected_season_version: "${sv}" }, as: PlannerAdmin, captures: { err: "$.data.error_id" } }
            - { call: "GET /grillops/seasons/${s_id}", as: PlannerAdmin, captures: { sv2: "$.data.version" } }
            - { call: "POST /grillops/allocations", payload: { season_id: "${s_id}", channel_account_id: "${chB}", model_id: "${m_id}", allocated_units: 5, expected_season_version: "${sv2}" }, as: PlannerAdmin, captures: { a2: "$.data.id" } }
          assert:
            - "captured err == ERR_STALE_VERSION (http 412): the season version advanced by alloc-1's side effect invalidated the writer's view"
            - "captured sv2 == ${sv} + 1 and the retried create succeeds as ${a2} (OCC is a stale-view check, not a lockout)"

      - name: accept_after_revise_with_stale_allocation_version_returns_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[allocation-respond-stale-allocation]", "errors[ERR_STALE_VERSION]", state_machines.Allocation.OFFERED_to_OFFERED]
        distinguishing_aspect: "OCC on Allocation.version where the state machine is BLIND to the conflict: REVISE leaves the allocation OFFERED (same state), so only the version check protects the channel from accepting terms it never saw."
        test_recipe:
          setup: ["Season 2026 in ALLOCATION; channel BigBox; one OFFERED allocation of 5 units (version 1)"]
          setup_api_calls:
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons", payload: { name: "Grilling Season 2026", year: 2026, build_start: "2026-01-05T00:00:00Z", allocation_open: "2026-02-01T00:00:00Z", in_season_start: "2026-03-01T00:00:00Z", clearance_start: "2026-08-01T00:00:00Z", season_end: "2026-09-30T00:00:00Z", demand_forecast_units: 1000 }, as: PlannerAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /grillops/models", payload: { model_code: "GX-100", model_family: "GX", model_year: 2026, base_price_cents: 100000, demand_share_bp: 5000 }, as: PlannerAdmin, captures: { m_id: "$.data.id" } }
