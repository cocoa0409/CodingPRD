            - { call: "POST /plant/production-batches/${b_id}/kit", payload: {}, as: LineOperator }
            - { call: "POST /plant/production-batches/${b_id}/cook", payload: { cooked_mass_kg: 2000 }, as: LineOperator }
            - call: "POST /plant/freezer-cells"
              payload: { cell_code: "FC-1", capacity_kg: 2000, min_load_kg: 200, pull_down_kg_per_hour: 400, sanitation_minutes: 30 }
              as: PlantManager
              captures: { c_id: $.data.id }
            - call: "GET /plant/production-batches/${b_id}"
              payload: {}
              as: ProductionPlanner
              captures: { b_v: $.data.version }
          trigger:
