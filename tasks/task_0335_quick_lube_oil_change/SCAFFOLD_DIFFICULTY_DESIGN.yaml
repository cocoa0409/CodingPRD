              as: ServiceAdvisor
              captures: { veh_a: $.data.id }
            - call: "POST /vehicles"
              payload: { shop_id: "${shop_id}", vin: "VINCASB01", plate: "CSB1", make: "VW", model: "Polo", odometer: 9000 }
              as: ServiceAdvisor
