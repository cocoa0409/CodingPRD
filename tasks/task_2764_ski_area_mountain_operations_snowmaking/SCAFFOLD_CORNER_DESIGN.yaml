# SCAFFOLD_CORNER_DESIGN.yaml - section 1.9 corner-case coverage design
# Task 2764 - Ski Area Mountain Operations & Snowmaking
#
# Companion file to SCAFFOLD.yaml (sections 1.0-1.7) and SCAFFOLD_DIFFICULTY_DESIGN.yaml
# (section 1.8). Every instance below is a corner case derived from the claim-extraction
# guide, one block per guide section. Instances whose behaviour is already exercised by a
# section 1.8 difficulty instance are recorded as excluded_because stubs that cite it by
# name, so the union of the two files is the complete test surface with no duplication.
scaffold_corner_design:
  - section: entities
    instances:
      - name: season_creation_returns_every_declared_field_and_zeroed_ledgers
        claim_type: creation
        grounds:
          - entities.SeasonConfig.fields.season_state
          - entities.SeasonConfig.fields.water_reserved_af
          - endpoints[POST /mountain-ops/seasons]
          - response_envelope.success
        distinguishing_aspect: |
          The root aggregate is the only entity with no parent, so its creation is the one call that
          can be made against an empty database. The corner is that all four running ledgers
          (water_reserved_af, water_used_af, snow_produced_swe_af, open_area_count) must be seeded to
          zero rather than left null, because every later reconciliation identity is stated against
          them, and that the four energy_windows are echoed back in start_hour_utc ASC order.
        test_recipe:
          setup:
            - "Empty database."
            - "Logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MountainOpsDirector
          trigger:
            - call: "POST /mountain-ops/seasons"
              payload: { season_label: "2026-27", base_depth_policy: "MEAN_OF_STAKES", water_right_seasonal_af: 250.000, plant_max_gpm: 6000, snowmaking_kwh_per_af: 620.0, min_patrollers_per_open_area: 2, groom_freshness_hours: 18, energy_windows: [{ code: "OFF_1", start_hour_utc: 0, end_hour_utc: 6, price_usd_per_kwh: 0.062, tier: "OFF_PEAK" }, { code: "MID_1", start_hour_utc: 6, end_hour_utc: 9, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }, { code: "ON_1", start_hour_utc: 9, end_hour_utc: 21, price_usd_per_kwh: 0.187, tier: "ON_PEAK" }, { code: "MID_2", start_hour_utc: 21, end_hour_utc: 24, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }] }
              as: MountainOpsDirector
              captures: { season_id: $.data.id }
          assert:
            - "HTTP 201 and response_type == object."
            - "data.id is a non-empty server-generated string."
            - "data.season_label == '2026-27', data.water_right_seasonal_af == 250.000, data.plant_max_gpm == 6000."
            - "data.snowmaking_kwh_per_af == 620.0."
            - "len(data.energy_windows) == 4 and the entries come back ordered OFF_1, MID_1, ON_1, MID_2."
            - "data.season_state == 'PRESEASON' (the declared initial_state)."
            - "data.water_reserved_af == 0.000 and data.water_used_af == 0.000."
            - "data.snow_produced_swe_af == 0.000 and data.open_area_count == 0."
            - "data.version == 1; data.created_at and data.updated_at are both present."

      - name: lift_creation_echoes_input_and_seeds_both_state_dimensions
        claim_type: creation
        grounds:
          - entities.Lift.fields.service_status
          - entities.Lift.fields.mechanical_status
          - endpoints[POST /mountain-ops/lifts]
        distinguishing_aspect: |
          Lift is the entity that carries two independent state dimensions, so creation must seed
          both of them (service_status CLOSED and mechanical_status INSPECTION_DUE) and leave
          inspection_valid_until null - a brand new lift is unusable until an inspection stamps it,
          which is what makes the very first boot step in every other recipe mandatory.
        test_recipe:
          setup:
            - "A SeasonConfig exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MountainOpsDirector
            - call: "POST /mountain-ops/seasons"
              payload: { season_label: "2026-27", base_depth_policy: "MEAN_OF_STAKES", water_right_seasonal_af: 250.000, plant_max_gpm: 6000, snowmaking_kwh_per_af: 620.0, min_patrollers_per_open_area: 2, groom_freshness_hours: 18, energy_windows: [{ code: "OFF_1", start_hour_utc: 0, end_hour_utc: 6, price_usd_per_kwh: 0.062, tier: "OFF_PEAK" }, { code: "MID_1", start_hour_utc: 6, end_hour_utc: 9, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }, { code: "ON_1", start_hour_utc: 9, end_hour_utc: 21, price_usd_per_kwh: 0.187, tier: "ON_PEAK" }, { code: "MID_2", start_hour_utc: 21, end_hour_utc: 24, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }] }
              as: MountainOpsDirector
              captures: { season_id: $.data.id }
          trigger:
            - call: "POST /mountain-ops/lifts"
              payload: { season_id: "${season_id}", lift_code: "L1", name: "Summit Express", lift_type: "DETACHABLE", wind_hold_threshold_mph: 40.0, hourly_capacity_pph: 1800, required_operator_count: 2 }
              as: LiftOpsManager
              captures: { lift_id: $.data.id }
          assert:
            - "HTTP 201."
            - "data.lift_code == 'L1', data.lift_type == 'DETACHABLE', data.hourly_capacity_pph == 1800."
            - "data.wind_hold_threshold_mph == 40.0 and data.required_operator_count == 2."
            - "data.service_status == 'CLOSED' and data.mechanical_status == 'INSPECTION_DUE'."
            - "data.staffed_operator_count == 0."
            - "data.inspection_valid_until is null and data.last_inspection_at is null and data.last_inspection_result is null."
            - "data.wind_hold_since is null and data.version == 1."

      - name: season_defaults_apply_when_the_three_optional_knobs_are_omitted
        claim_type: defaults
        grounds:
          - entities.SeasonConfig.fields.base_depth_policy
          - entities.SeasonConfig.fields.min_patrollers_per_open_area
          - entities.SeasonConfig.fields.groom_freshness_hours
        distinguishing_aspect: |
          The three omitted fields are exactly the knobs the rest of the system reads as policy:
          base_depth_policy selects the dual-variant depth calculation, min_patrollers_per_open_area
          gates terrain opening, groom_freshness_hours gates it again on time. Omitting all three must
          yield MEAN_OF_STAKES / 2 / 18 rather than null, otherwise every gate downstream is
          undecidable on a minimally specified season.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MountainOpsDirector
          trigger:
            - call: "POST /mountain-ops/seasons"
              payload: { season_label: "2026-27-minimal", water_right_seasonal_af: 120.000, plant_max_gpm: 4000, snowmaking_kwh_per_af: 600.0, energy_windows: [{ code: "OFF_1", start_hour_utc: 0, end_hour_utc: 6, price_usd_per_kwh: 0.062, tier: "OFF_PEAK" }, { code: "MID_1", start_hour_utc: 6, end_hour_utc: 9, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }, { code: "ON_1", start_hour_utc: 9, end_hour_utc: 21, price_usd_per_kwh: 0.187, tier: "ON_PEAK" }, { code: "MID_2", start_hour_utc: 21, end_hour_utc: 24, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }] }
              as: MountainOpsDirector
              captures: { season_id: $.data.id }
          assert:
            - "HTTP 201."
            - "data.base_depth_policy == 'MEAN_OF_STAKES'."
            - "data.min_patrollers_per_open_area == 2."
            - "data.groom_freshness_hours == 18."
            - "data.season_state == 'PRESEASON' and data.water_right_seasonal_af == 120.000."

      - name: terrain_area_retrieval_returns_the_stored_row_with_all_derived_fields_zeroed
        claim_type: retrieval
        grounds:
          - entities.TerrainArea.fields.opening_state
          - entities.TerrainArea.fields.base_depth_in
          - endpoints[GET /mountain-ops/terrain-areas/{id}]
        distinguishing_aspect: |
          TerrainArea carries eleven derived fields fed by four different sources (readings, grooming,
          mitigation, patrol roster). A freshly created area must report every one of them at its zero
          value with opening_state CLOSED and park_state NO_PARK, which is the baseline that the
          readiness ladder in every other recipe is measured against.
        test_recipe:
          setup:
            - "A season with one inspected lift exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MountainOpsDirector
            - call: "POST /mountain-ops/seasons"
              payload: { season_label: "2026-27", base_depth_policy: "MEAN_OF_STAKES", water_right_seasonal_af: 250.000, plant_max_gpm: 6000, snowmaking_kwh_per_af: 620.0, min_patrollers_per_open_area: 2, groom_freshness_hours: 18, energy_windows: [{ code: "OFF_1", start_hour_utc: 0, end_hour_utc: 6, price_usd_per_kwh: 0.062, tier: "OFF_PEAK" }, { code: "MID_1", start_hour_utc: 6, end_hour_utc: 9, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }, { code: "ON_1", start_hour_utc: 9, end_hour_utc: 21, price_usd_per_kwh: 0.187, tier: "ON_PEAK" }, { code: "MID_2", start_hour_utc: 21, end_hour_utc: 24, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }] }
              as: MountainOpsDirector
              captures: { season_id: $.data.id }
            - call: "POST /mountain-ops/lifts"
              payload: { season_id: "${season_id}", lift_code: "L1", name: "Summit Express", lift_type: "DETACHABLE", wind_hold_threshold_mph: 40.0, hourly_capacity_pph: 1800, required_operator_count: 2 }
              as: LiftOpsManager
              captures: { lift_id: $.data.id }
            - call: "POST /mountain-ops/lifts/${lift_id}/inspections"
              payload: { result: "PASS", notes: "daily pre-op" }
              as: LiftOpsManager
            - call: "POST /mountain-ops/terrain-areas"
              payload: { season_id: "${season_id}", serving_lift_id: "${lift_id}", trail_code: "T1", name: "Sunbowl", terrain_class: "BLUE", acres: 18.0, min_open_base_depth_in: 30, avalanche_terrain: false }
              as: MountainOpsDirector
              captures: { area_id: $.data.id }
          trigger:
            - call: "GET /mountain-ops/terrain-areas/${area_id}"
              payload: {  }
              as: GroomingLead
          assert:
            - "HTTP 200."
            - "data.trail_code == 'T1', data.terrain_class == 'BLUE', data.acres == 18.0, data.min_open_base_depth_in == 30."
            - "data.avalanche_terrain is false and data.serving_lift_id == the created lift id."
            - "data.opening_state == 'CLOSED' and data.park_state == 'NO_PARK'."
            - "data.base_depth_in == 0.0 and data.base_depth_stake_count == 0 and data.last_reading_at is null."
            - "data.groom_coverage_pct == 0.0 and data.groom_ready is false and data.last_groomed_at is null."
            - "data.assigned_patroller_count == 0 and data.mitigation_clearance_expires_at is null."
            - "data.park_feature_count == 0 and data.park_risk_score == 0.0 and data.machine_swe_af == 0.000."
            - "data.version == 1."

      - name: terrain_area_listing_paginates_filters_and_reports_total_count
        claim_type: listing
        grounds:
          - endpoints[GET /mountain-ops/terrain-areas]
          - response_envelope.pagination_fields
          - entities.TerrainArea.fields.opening_state
        distinguishing_aspect: |
          Three areas are created and the collection is walked with limit 2. The corner is that
          total_count reports the size of the filtered set (3) and not the size of the page, that
          has_more flips false only on the last page, and that an opening_state filter narrows the set
          while the offset window still applies - the two features must compose, not override each
          other.
        test_recipe:
          setup:
            - "Three terrain areas exist on one season, all still in opening_state CLOSED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MountainOpsDirector
            - call: "POST /mountain-ops/seasons"
              payload: { season_label: "2026-27", base_depth_policy: "MEAN_OF_STAKES", water_right_seasonal_af: 250.000, plant_max_gpm: 6000, snowmaking_kwh_per_af: 620.0, min_patrollers_per_open_area: 2, groom_freshness_hours: 18, energy_windows: [{ code: "OFF_1", start_hour_utc: 0, end_hour_utc: 6, price_usd_per_kwh: 0.062, tier: "OFF_PEAK" }, { code: "MID_1", start_hour_utc: 6, end_hour_utc: 9, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }, { code: "ON_1", start_hour_utc: 9, end_hour_utc: 21, price_usd_per_kwh: 0.187, tier: "ON_PEAK" }, { code: "MID_2", start_hour_utc: 21, end_hour_utc: 24, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }] }
              as: MountainOpsDirector
              captures: { season_id: $.data.id }
            - call: "POST /mountain-ops/lifts"
              payload: { season_id: "${season_id}", lift_code: "L1", name: "Summit Express", lift_type: "DETACHABLE", wind_hold_threshold_mph: 40.0, hourly_capacity_pph: 1800, required_operator_count: 2 }
              as: LiftOpsManager
              captures: { lift_id: $.data.id }
            - call: "POST /mountain-ops/lifts/${lift_id}/inspections"
              payload: { result: "PASS", notes: "daily pre-op" }
              as: LiftOpsManager
            - call: "POST /mountain-ops/terrain-areas"
              payload: { season_id: "${season_id}", serving_lift_id: "${lift_id}", trail_code: "T1", name: "Sunbowl", terrain_class: "BLUE", acres: 18.0, min_open_base_depth_in: 30, avalanche_terrain: false }
              as: MountainOpsDirector
              captures: { a1: $.data.id }
            - call: "POST /mountain-ops/terrain-areas"
              payload: { season_id: "${season_id}", serving_lift_id: "${lift_id}", trail_code: "T2", name: "Northwoods", terrain_class: "BLACK", acres: 12.0, min_open_base_depth_in: 30, avalanche_terrain: false }
              as: MountainOpsDirector
              captures: { a2: $.data.id }
            - call: "POST /mountain-ops/terrain-areas"
              payload: { season_id: "${season_id}", serving_lift_id: "${lift_id}", trail_code: "T3", name: "Cruiser", terrain_class: "GREEN", acres: 8.0, min_open_base_depth_in: 30, avalanche_terrain: false }
              as: MountainOpsDirector
              captures: { a3: $.data.id }
          trigger:
            - call: "GET /mountain-ops/terrain-areas"
              payload: { season_id: "${season_id}", limit: 2, offset: 0 }
              as: GuestServicesAgent
            - call: "GET /mountain-ops/terrain-areas"
              payload: { season_id: "${season_id}", limit: 2, offset: 2 }
              as: GuestServicesAgent
            - call: "GET /mountain-ops/terrain-areas"
              payload: { season_id: "${season_id}", opening_state: "CLOSED", limit: 10, offset: 0 }
              as: GuestServicesAgent
            - call: "GET /mountain-ops/terrain-areas"
              payload: { season_id: "${season_id}", terrain_class: "BLACK" }
              as: GuestServicesAgent
          assert:
            - "Trigger 1: HTTP 200, response_type == array, len(data) == 2, total_count == 3, has_more is true, limit == 2, offset == 0."
            - "Trigger 2: len(data) == 1, total_count == 3, has_more is false, offset == 2."
            - "Trigger 3: len(data) == 3, total_count == 3, has_more is false."
            - "Trigger 4: len(data) == 1, total_count == 1, and the single row has trail_code == 'T2'."
            - "No row appears on both page 1 and page 2."

      - name: listing_applies_the_declared_pagination_defaults_when_limit_is_omitted
        claim_type: listing
        grounds:
          - response_envelope.pagination_defaults
          - endpoints[GET /mountain-ops/terrain-areas]
        distinguishing_aspect: |
          No pagination parameters at all must not mean unpaginated: the envelope declares limit 10
          and offset 0 as defaults, so the response must still carry limit, offset, total_count and
          has_more. This is the corner that separates a missing parameter from an explicit one, and it
          is asserted on a set of 3 rows so a wrong default of 1 or a missing envelope is visible.
        test_recipe:
          setup:
            - "Three terrain areas exist on one season."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MountainOpsDirector
            - call: "POST /mountain-ops/seasons"
              payload: { season_label: "2026-27", base_depth_policy: "MEAN_OF_STAKES", water_right_seasonal_af: 250.000, plant_max_gpm: 6000, snowmaking_kwh_per_af: 620.0, min_patrollers_per_open_area: 2, groom_freshness_hours: 18, energy_windows: [{ code: "OFF_1", start_hour_utc: 0, end_hour_utc: 6, price_usd_per_kwh: 0.062, tier: "OFF_PEAK" }, { code: "MID_1", start_hour_utc: 6, end_hour_utc: 9, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }, { code: "ON_1", start_hour_utc: 9, end_hour_utc: 21, price_usd_per_kwh: 0.187, tier: "ON_PEAK" }, { code: "MID_2", start_hour_utc: 21, end_hour_utc: 24, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }] }
              as: MountainOpsDirector
              captures: { season_id: $.data.id }
            - call: "POST /mountain-ops/lifts"
              payload: { season_id: "${season_id}", lift_code: "L1", name: "Summit Express", lift_type: "DETACHABLE", wind_hold_threshold_mph: 40.0, hourly_capacity_pph: 1800, required_operator_count: 2 }
              as: LiftOpsManager
              captures: { lift_id: $.data.id }
            - call: "POST /mountain-ops/lifts/${lift_id}/inspections"
              payload: { result: "PASS", notes: "daily pre-op" }
              as: LiftOpsManager
            - call: "POST /mountain-ops/terrain-areas"
              payload: { season_id: "${season_id}", serving_lift_id: "${lift_id}", trail_code: "T1", name: "Sunbowl", terrain_class: "BLUE", acres: 18.0, min_open_base_depth_in: 30, avalanche_terrain: false }
              as: MountainOpsDirector
              captures: { a1: $.data.id }
            - call: "POST /mountain-ops/terrain-areas"
              payload: { season_id: "${season_id}", serving_lift_id: "${lift_id}", trail_code: "T2", name: "Sunbowl", terrain_class: "BLUE", acres: 18.0, min_open_base_depth_in: 30, avalanche_terrain: false }
              as: MountainOpsDirector
              captures: { a2: $.data.id }
            - call: "POST /mountain-ops/terrain-areas"
              payload: { season_id: "${season_id}", serving_lift_id: "${lift_id}", trail_code: "T3", name: "Sunbowl", terrain_class: "BLUE", acres: 18.0, min_open_base_depth_in: 30, avalanche_terrain: false }
              as: MountainOpsDirector
              captures: { a3: $.data.id }
          trigger:
            - call: "GET /mountain-ops/terrain-areas"
              payload: { season_id: "${season_id}" }
              as: LiftOpsManager
          assert:
            - "HTTP 200 and response_type == array."
            - "limit == 10, offset == 0 (the declared pagination_defaults)."
            - "total_count == 3 and has_more is false and len(data) == 3."

      - name: terrain_area_fetch_with_unknown_id_returns_terrain_area_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_TERRAIN_AREA_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: |
          A syntactically valid but unknown id must produce the entity-specific 404 rather than the
          generic ERR_RECORD_NOT_FOUND, and it must do so on a read as well as on a write, because the
          same left-to-right path resolution is what every nested route depends on.
        test_recipe:
          setup:
            - "A season exists; no terrain area with the probed id was ever created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MountainOpsDirector
            - call: "POST /mountain-ops/seasons"
              payload: { season_label: "2026-27", base_depth_policy: "MEAN_OF_STAKES", water_right_seasonal_af: 250.000, plant_max_gpm: 6000, snowmaking_kwh_per_af: 620.0, min_patrollers_per_open_area: 2, groom_freshness_hours: 18, energy_windows: [{ code: "OFF_1", start_hour_utc: 0, end_hour_utc: 6, price_usd_per_kwh: 0.062, tier: "OFF_PEAK" }, { code: "MID_1", start_hour_utc: 6, end_hour_utc: 9, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }, { code: "ON_1", start_hour_utc: 9, end_hour_utc: 21, price_usd_per_kwh: 0.187, tier: "ON_PEAK" }, { code: "MID_2", start_hour_utc: 21, end_hour_utc: 24, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }] }
              as: MountainOpsDirector
              captures: { season_id: $.data.id }
          trigger:
            - call: "GET /mountain-ops/terrain-areas/00000000-0000-4000-8000-000000000000"
              payload: {  }
              as: MountainOpsDirector
              captures: { e1: $.data.error_id }
            - call: "POST /mountain-ops/terrain-areas/00000000-0000-4000-8000-000000000000/snow-depth-readings"
              payload: { stake_code: "S1", depth_in: 40.0, measured_at: "2026-08-01T00:00:00Z" }
              as: GroomingLead
              captures: { e2: $.data.error_id }
          assert:
            - "Trigger 1: HTTP 404 with data.error_id == 'ERR_TERRAIN_AREA_NOT_FOUND'."
            - "Trigger 2: HTTP 404 with data.error_id == 'ERR_TERRAIN_AREA_NOT_FOUND' - the nested reading route resolves its parent segment first."
            - "Neither response carries error_id 'ERR_RECORD_NOT_FOUND'."
            - "response_type == error and data.message is a non-empty string on both."

      - name: snowmaking_session_create_missing_gpm_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
          - entities.SnowmakingSession.fields.gpm
        distinguishing_aspect: |
          gpm has source input and no default, so its absence must be a 400 schema rejection at
          priority 5 - before the priority 17 optimistic-concurrency check and before the priority 42
          pump sweep, both of which would otherwise have to reason about a null flow rate. The paired
          positive trigger proves the same body with gpm present is accepted, so the failure is
          attributable to the missing field and not to the surrounding setup.
        test_recipe:
          setup:
            - "An open mountain with one pump house exists; a valid terrain area version is captured."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MountainOpsDirector
            - call: "POST /mountain-ops/seasons"
