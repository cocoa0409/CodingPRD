          setup:
            - "ProgramYear 2026-27 is ACTIVE with current_quarter 1; Account ACCT1 is ACTIVE with balance_cents 229088."
            - "ExpenseCategory MATERIALS (per_year_cap_cents 300000, requires_preapproval false, requires_service_period false) is published."
            - "Provider P4 was screened with flags [ADDRESS_MISMATCH, SHARED_BANK_ACCOUNT], scoring 20 + 25 = 45, so approve landed it in PROBATION with authorized_category_codes [MATERIALS]."
          setup_api_calls:
            - call: "POST /esa/program-years"
              payload: { label: "2026-27", residency_state: "TX", total_seats: 2, window_open_at: "2026-08-15T00:00:00Z", window_close_at: "2026-09-30T23:59:59Z", term_start_date: "2026-08-01", term_end_date: "2027-06-30", base_award_cents: 731500, rollover_cap_pct: 0.25, admin_fee_pct: 0.0175, acceptance_deadline_days: 14, min_assessment_percentile: 40, min_portfolio_artifacts: 6 }
