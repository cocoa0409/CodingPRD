        claim_type: occ_conflict
        grounds: ["concurrency_rules[directive-activate-stale-plan]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Activating a second MEDICAL directive while carrying the pre-first-activate plan version (${plan_v}) -> ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A plan with two DRAFT MEDICAL directives; directive A already activated (plan version advanced to 2)."]
          setup_api_calls:
