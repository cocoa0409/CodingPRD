      - name: forfeit_exceeds_held_returns_422
        claim_type: violation_to_error
        grounds: ["errors[ERR_FORFEIT_EXCEEDS_HELD]", "validations[priority=13]"]
        distinguishing_aspect: "On a RETURNED order with held=1000, forfeit_amount_cents=1500 (> held) → ERR_FORFEIT_EXCEEDS_HELD 422 (isolated from the not-returned guard, since order IS returned)."
        test_recipe:
