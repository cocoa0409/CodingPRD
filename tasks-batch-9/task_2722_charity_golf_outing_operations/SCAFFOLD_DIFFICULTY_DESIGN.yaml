# ===========================================================================
# Scaffold Difficulty Design (Test Targeting Index) - task 2722
# Charity Golf Outing Operations. Companion to SCAFFOLD.yaml; every instance
# grounds in elements already declared in SCAFFOLD.yaml §1.1-§1.7.
# Logical clock default: 2026-08-01T00:00:00Z (see POST /_clock/set_current_utc).
# ===========================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: team_playing_handicap_provisional_vs_locked
        grounds:
          - calculations.team_playing_handicap
          - calculations.course_handicap_conversion
          - state_machines.Outing.OPEN_to_FIELD_LOCKED
          - entities.Player.fields.effective_handicap_index
          - entities.Team.fields.handicap_variant
        distinguishing_aspect: |
          This dual variant lives in the competition domain (Player.handicap_index ->
          Team.team_playing_handicap): the PROVISIONAL variant reads each player's
          handicap_index_at_confirm while the LOCKED variant reads
          effective_handicap_index = max(handicap_index, at_confirm - 3.0), so one
          player who reported a 6.0-stroke improvement after confirmation moves the
          same team from 7.1 to 6.9 rather than to the uncapped 6.8.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Outing 'Fairway Fund Classic', format SCRAMBLE, start_format TEE_TIME, field_capacity_teams 1, play_status OPEN."
            - "CourseContract SIGNED with course_rating 71.4, slope_rating 128, par 72."
            - "One CONFIRMED TEAM registration of 4 players whose handicap_index_at_confirm values are 12.0, 18.4, 8.2 and 24.0, giving course handicaps 13, 20, 9 and 27."
            - "Team 'Birdie Boys' created while the outing is OPEN, so team_playing_handicap is 7.1 under the PROVISIONAL variant."
            - "The 24.0 player then reports a new handicap_index of 18.0 - a 6.0-stroke improvement, above MAX_INDEX_IMPROVEMENT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TournamentDirector
            - call: "POST /outing-ops/outings"
              payload: { name: "Fairway Fund Classic", beneficiary_name: "Northside Youth Fund", format: "SCRAMBLE", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 1, prize_pool_cents: 60000 }
              as: TournamentDirector
              captures: { o_id: $.data.id }
            - call: "POST /outing-ops/contracts"
              payload: { outing_id: "${o_id}", course_name: "Cedar Ridge GC", rate_per_player_cents: 9500, guaranteed_player_count: 4, fnb_minimum_cents: 0, fnb_per_player_cents: 4500, course_rating: 71.4, slope_rating: 128, par: 72, tee_interval_minutes: 10, cart_allowance_count: 4 }
              as: CourseOperations
              captures: { c_id: $.data.id }
            - call: "POST /outing-ops/contracts/${c_id}/lifecycle"
              payload: { action: "SIGN" }
              as: CourseOperations
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${o_id}", code: "TEAM4", kind: "TEAM", price_cents: 120000, player_slots: 4, gsv_cents: 24000, inventory_cap: 10 }
              as: TournamentDirector
              captures: { t_id: $.data.id }
            - call: "POST /outing-ops/outings/${o_id}/play-transition"
              payload: { action: "OPEN_REGISTRATION" }
              as: TournamentDirector
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${o_id}", package_tier_id: "${t_id}", buyer_name: "Alders LLP", player_count: 4 }
              as: TournamentDirector
              captures: { r_id: $.data.id }
            - call: "POST /outing-ops/players"
              payload: { registration_id: "${r_id}", full_name: "P1", handicap_index: 12.0 }
              as: TournamentDirector
              captures: { p1_id: $.data.id }
            - call: "POST /outing-ops/players"
              payload: { registration_id: "${r_id}", full_name: "P2", handicap_index: 18.4 }
              as: TournamentDirector
              captures: { p2_id: $.data.id }
            - call: "POST /outing-ops/players"
              payload: { registration_id: "${r_id}", full_name: "P3", handicap_index: 8.2 }
              as: TournamentDirector
              captures: { p3_id: $.data.id }
            - call: "POST /outing-ops/players"
              payload: { registration_id: "${r_id}", full_name: "P4", handicap_index: 24.0 }
              as: TournamentDirector
              captures: { p4_id: $.data.id }
            - call: "POST /outing-ops/registrations/${r_id}/payment"
              payload: { amount_cents: 120000 }
              as: CharityTreasurer
            - call: "POST /outing-ops/teams"
              payload: { outing_id: "${o_id}", team_name: "Birdie Boys", player_ids: ["${p1_id}", "${p2_id}", "${p3_id}", "${p4_id}"] }
              as: TournamentDirector
              captures: { tm_id: $.data.id }
            - call: "POST /outing-ops/players/${p4_id}/handicap-index"
              payload: { handicap_index: 18.0 }
              as: TournamentDirector
          trigger:
            - call: "POST /outing-ops/outings/${o_id}/play-transition"
              payload: { action: "LOCK_FIELD" }
              as: TournamentDirector
          assert:
            - "Team.${tm_id}.team_playing_handicap == 6.9"
            - "Team.${tm_id}.handicap_variant == LOCKED"
            - "Player.${p4_id}.effective_handicap_index == 21.0"
            - "Player.${p4_id}.course_handicap == 23"
            - "Team.${tm_id}.team_playing_handicap != 6.8 (the value the uncapped 18.0 index would have produced)"
            - "Player.${p1_id}.course_handicap == 13 and Player.${p2_id}.course_handicap == 20 and Player.${p3_id}.course_handicap == 9"

      - name: net_proceeds_provisional_vs_final
        grounds:
          - calculations.net_proceeds_rollup
          - calculations.prize_distribution
          - state_machines.Outing.COLLECTING_to_RECONCILED
          - entities.Outing.fields.proceeds_variant
          - entities.Outing.fields.checked_in_player_count
        distinguishing_aspect: |
          This dual variant lives in the charity-finance domain on the Outing row, a
          different entity domain from the handicap variant: PROVISIONAL bills the 8
          confirmed slots and charges the whole 60000-cent prize pool, while FINAL
          bills the 4 checked-in players floored by guaranteed_player_count 6, charges
          only the 48000 cents actually awarded and picks up a 12000-cent food and
          beverage shortfall, moving net_proceeds_cents from 92000 to 111000.
        test_recipe:
          setup:
            - "Outing with field_capacity_teams 2 and prize_pool_cents 60000; contract rate_per_player_cents 9500, guaranteed_player_count 6, fnb_minimum_cents 30000, fnb_per_player_cents 4500."
            - "Two CONFIRMED TEAM registrations at 120000 cents each, 4 players each, so gross_revenue_cents is 240000 and confirmed_player_slots is 8."
            - "Team ALPHA playing handicap 7.1 (course handicaps 13, 20, 9, 27); team BRAVO playing handicap 9.1 (course handicaps 15, 18, 22, 24)."
            - "Only registration ALPHA checks in, so checked_in_player_count is 4."
            - "Both teams tee off on hole 1 at 12:00Z and 12:10Z, scores are posted and FINALIZE_SCORING ranks ALPHA first on the back-nine matching card, awarding 30000 and 18000 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TournamentDirector
            - call: "POST /outing-ops/outings"
              payload: { name: "Fairway Fund Classic", beneficiary_name: "Northside Youth Fund", format: "SCRAMBLE", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 2, prize_pool_cents: 60000 }
              as: TournamentDirector
              captures: { o_id: $.data.id }
            - call: "POST /outing-ops/contracts"
              payload: { outing_id: "${o_id}", course_name: "Cedar Ridge GC", rate_per_player_cents: 9500, guaranteed_player_count: 6, fnb_minimum_cents: 30000, fnb_per_player_cents: 4500, course_rating: 71.4, slope_rating: 128, par: 72, tee_interval_minutes: 10, cart_allowance_count: 4 }
              as: CourseOperations
              captures: { c_id: $.data.id }
            - call: "POST /outing-ops/contracts/${c_id}/lifecycle"
              payload: { action: "SIGN" }
              as: CourseOperations
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${o_id}", code: "TEAM4", kind: "TEAM", price_cents: 120000, player_slots: 4, gsv_cents: 24000, inventory_cap: 10 }
              as: TournamentDirector
              captures: { t_id: $.data.id }
            - call: "POST /outing-ops/outings/${o_id}/play-transition"
              payload: { action: "OPEN_REGISTRATION" }
              as: TournamentDirector
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${o_id}", package_tier_id: "${t_id}", buyer_name: "Alpha Corp", player_count: 4 }
              as: TournamentDirector
              captures: { ra_id: $.data.id }
            - call: "POST /outing-ops/players"
              payload: { registration_id: "${ra_id}", full_name: "A1", handicap_index: 12.0 }
              as: TournamentDirector
              captures: { a1_id: $.data.id }
            - call: "POST /outing-ops/players"
              payload: { registration_id: "${ra_id}", full_name: "A2", handicap_index: 18.4 }
              as: TournamentDirector
              captures: { a2_id: $.data.id }
            - call: "POST /outing-ops/players"
              payload: { registration_id: "${ra_id}", full_name: "A3", handicap_index: 8.2 }
              as: TournamentDirector
              captures: { a3_id: $.data.id }
            - call: "POST /outing-ops/players"
              payload: { registration_id: "${ra_id}", full_name: "A4", handicap_index: 24.0 }
              as: TournamentDirector
              captures: { a4_id: $.data.id }
            - call: "POST /outing-ops/registrations/${ra_id}/payment"
              payload: { amount_cents: 120000 }
              as: CharityTreasurer
            - call: "POST /outing-ops/teams"
              payload: { outing_id: "${o_id}", team_name: "ALPHA", player_ids: ["${a1_id}", "${a2_id}", "${a3_id}", "${a4_id}"] }
              as: TournamentDirector
              captures: { tma_id: $.data.id }
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${o_id}", package_tier_id: "${t_id}", buyer_name: "Bravo Corp", player_count: 4 }
              as: TournamentDirector
              captures: { rb_id: $.data.id }
            - call: "POST /outing-ops/players"
              payload: { registration_id: "${rb_id}", full_name: "B1", handicap_index: 13.4 }
              as: TournamentDirector
              captures: { b1_id: $.data.id }
            - call: "POST /outing-ops/players"
              payload: { registration_id: "${rb_id}", full_name: "B2", handicap_index: 16.0 }
              as: TournamentDirector
              captures: { b2_id: $.data.id }
            - call: "POST /outing-ops/players"
              payload: { registration_id: "${rb_id}", full_name: "B3", handicap_index: 19.6 }
              as: TournamentDirector
              captures: { b3_id: $.data.id }
            - call: "POST /outing-ops/players"
              payload: { registration_id: "${rb_id}", full_name: "B4", handicap_index: 21.3 }
              as: TournamentDirector
              captures: { b4_id: $.data.id }
            - call: "POST /outing-ops/registrations/${rb_id}/payment"
              payload: { amount_cents: 120000 }
              as: CharityTreasurer
            - call: "POST /outing-ops/teams"
              payload: { outing_id: "${o_id}", team_name: "BRAVO", player_ids: ["${b1_id}", "${b2_id}", "${b3_id}", "${b4_id}"] }
              as: TournamentDirector
              captures: { tmb_id: $.data.id }
            - call: "POST /outing-ops/outings/${o_id}/play-transition"
              payload: { action: "LOCK_FIELD" }
              as: TournamentDirector
            - call: "POST /outing-ops/registrations/${ra_id}/lifecycle"
              payload: { action: "CHECK_IN" }
              as: CourseOperations
            - call: "GET /outing-ops/teams/${tma_id}"
              payload: {}
              as: TournamentDirector
              captures: { tma_v1: $.data.version }
            - call: "POST /outing-ops/teams/${tma_id}/tee-assignment"
              payload: { expected_team_version: "${tma_v1}", wave: "A", starting_hole: 1, tee_time: "2026-09-19T12:00:00Z", cart_number: 1 }
              as: CourseOperations
            - call: "GET /outing-ops/teams/${tmb_id}"
              payload: {}
              as: TournamentDirector
              captures: { tmb_v1: $.data.version }
            - call: "POST /outing-ops/teams/${tmb_id}/tee-assignment"
              payload: { expected_team_version: "${tmb_v1}", wave: "A", starting_hole: 1, tee_time: "2026-09-19T12:10:00Z", cart_number: 2 }
              as: CourseOperations
            - call: "POST /outing-ops/outings/${o_id}/play-transition"
              payload: { action: "START_PLAY" }
              as: TournamentDirector
            - call: "POST /outing-ops/teams/${tma_id}/score"
              payload: { gross_score: 68, gross_back_9: 33, gross_back_6: 22, gross_back_3: 11, gross_hole_18: 4 }
              as: CourseOperations
            - call: "POST /outing-ops/teams/${tmb_id}/score"
              payload: { gross_score: 70, gross_back_9: 35, gross_back_6: 23, gross_back_3: 12, gross_hole_18: 4 }
              as: CourseOperations
            - call: "POST /outing-ops/outings/${o_id}/play-transition"
              payload: { action: "FINALIZE_SCORING" }
              as: TournamentDirector
            - call: "GET /outing-ops/outings/${o_id}"
              payload: {}
              as: CharityTreasurer
              captures: { o_v_scored: $.data.version }
          trigger:
            - call: "POST /outing-ops/outings/${o_id}/finance-transition"
              payload: { action: "RECONCILE", expected_outing_version: "${o_v_scored}" }
              as: CharityTreasurer
          assert:
            - "before the trigger: Outing.${o_id}.proceeds_variant == PROVISIONAL, course_charge_cents == 76000, fnb_shortfall_cents == 0, prize_cost_cents == 60000, direct_costs_cents == 136000, net_proceeds_before_fee_cents == 104000, admin_fee_pct == 0.05, admin_fee_cents == 12000, net_proceeds_cents == 92000"
            - "after the trigger: Outing.${o_id}.proceeds_variant == FINAL"
            - "Outing.${o_id}.course_charge_cents == 57000"
            - "Outing.${o_id}.fnb_shortfall_cents == 12000"
            - "Outing.${o_id}.prize_cost_cents == 48000"
            - "Outing.${o_id}.direct_costs_cents == 117000"
            - "Outing.${o_id}.net_proceeds_before_fee_cents == 123000"
            - "Outing.${o_id}.admin_fee_cents == 12000"
            - "Outing.${o_id}.net_proceeds_cents == 111000"
            - "Outing.${o_id}.gross_revenue_cents == 240000 is identical under both variants"
            - "Team.${tma_id}.prize_award_cents == 30000 and Team.${tmb_id}.prize_award_cents == 18000 and Outing.${o_id}.unclaimed_prize_cents == 12000"

  - rule_id: combinatorial_formula
    instances:
      - name: best_ball_allowance_per_player_rounding_order
        grounds:
          - calculations.team_playing_handicap
          - calculations.course_handicap_conversion
          - entities.Outing.fields.format
          - entities.Team.fields.team_playing_handicap
        distinguishing_aspect: |
          Mode (b) nested rounding where the order matters: the scaffold pins
          "round each player's 90 percent allowance to a whole stroke FIRST, then take
          0.25 of the sum", so course handicaps 8, 9, 10 and 16 give 7 + 8 + 9 + 14 = 38
          and a playing handicap of 9.5, whereas summing first (0.25 * 0.90 * 43) would
          give 9.7.
        test_recipe:
          setup:
            - "Outing format BEST_BALL, field_capacity_teams 1, contract SIGNED with course_rating 71.4, slope_rating 128, par 72."
            - "One CONFIRMED TEAM registration with four players whose indices 7.3, 8.2, 9.1 and 14.4 convert to course handicaps 8, 9, 10 and 16."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TournamentDirector
            - call: "POST /outing-ops/outings"
              payload: { name: "Best Ball Benefit", beneficiary_name: "Northside Youth Fund", format: "BEST_BALL", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 1, prize_pool_cents: 0 }
              as: TournamentDirector
              captures: { o_id: $.data.id }
            - call: "POST /outing-ops/contracts"
              payload: { outing_id: "${o_id}", course_name: "Cedar Ridge GC", rate_per_player_cents: 9500, guaranteed_player_count: 4, fnb_minimum_cents: 0, fnb_per_player_cents: 4500, course_rating: 71.4, slope_rating: 128, par: 72 }
              as: CourseOperations
              captures: { c_id: $.data.id }
            - call: "POST /outing-ops/contracts/${c_id}/lifecycle"
              payload: { action: "SIGN" }
              as: CourseOperations
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${o_id}", code: "TEAM4", kind: "TEAM", price_cents: 120000, player_slots: 4, gsv_cents: 24000, inventory_cap: 10 }
              as: TournamentDirector
              captures: { t_id: $.data.id }
            - call: "POST /outing-ops/outings/${o_id}/play-transition"
              payload: { action: "OPEN_REGISTRATION" }
              as: TournamentDirector
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${o_id}", package_tier_id: "${t_id}", buyer_name: "Rounding Rangers", player_count: 4 }
              as: TournamentDirector
              captures: { r_id: $.data.id }
            - call: "POST /outing-ops/players"
              payload: { registration_id: "${r_id}", full_name: "R1", handicap_index: 7.3 }
              as: TournamentDirector
              captures: { p1_id: $.data.id }
            - call: "POST /outing-ops/players"
              payload: { registration_id: "${r_id}", full_name: "R2", handicap_index: 8.2 }
              as: TournamentDirector
              captures: { p2_id: $.data.id }
            - call: "POST /outing-ops/players"
              payload: { registration_id: "${r_id}", full_name: "R3", handicap_index: 9.1 }
              as: TournamentDirector
              captures: { p3_id: $.data.id }
            - call: "POST /outing-ops/players"
              payload: { registration_id: "${r_id}", full_name: "R4", handicap_index: 14.4 }
              as: TournamentDirector
              captures: { p4_id: $.data.id }
            - call: "POST /outing-ops/registrations/${r_id}/payment"
              payload: { amount_cents: 120000 }
              as: CharityTreasurer
          trigger:
            - call: "POST /outing-ops/teams"
              payload: { outing_id: "${o_id}", team_name: "Rounding Rangers", player_ids: ["${p1_id}", "${p2_id}", "${p3_id}", "${p4_id}"] }
              as: TournamentDirector
              captures: { tm_id: $.data.id }
          assert:
            - "Player.${p1_id}.course_handicap == 8 and Player.${p2_id}.course_handicap == 9 and Player.${p3_id}.course_handicap == 10 and Player.${p4_id}.course_handicap == 16"
            - "Team.${tm_id}.team_playing_handicap == 9.5"
            - "Team.${tm_id}.team_playing_handicap != 9.7 (the sum-then-round order)"
            - "Team.${tm_id}.handicap_variant == PROVISIONAL"

      - name: admin_fee_tier_selected_on_before_fee_applied_to_gross
        grounds:
          - calculations.net_proceeds_rollup
          - entities.Outing.fields.admin_fee_pct
          - entities.Outing.fields.admin_fee_cents
          - entities.Outing.fields.net_proceeds_before_fee_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with a pinned evaluation order: the fee
          RATE is keyed off net_proceeds_before_fee_cents (2000000 -> 0.035) while the fee
          BASE is gross_revenue_cents (2100000 -> 73500), so net_proceeds_cents is
          1926500 - not the 1930000 that keying the rate off the after-fee net would give
          and not the 1995000 that applying the rate to the before-fee net would give.
        test_recipe:
          setup:
            - "Outing with prize_pool_cents 100000 and field_capacity_teams 1."
            - "Contract SIGNED with rate_per_player_cents 9500, guaranteed_player_count 0, fnb_minimum_cents 0, so there are no player-driven costs at all."
            - "A single SPONSOR tier priced at 2100000 cents with player_slots 0 and gsv_cents 0."
            - "One registration at that tier with player_count 0, still PENDING_PAYMENT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TournamentDirector
            - call: "POST /outing-ops/outings"
              payload: { name: "Title Sponsor Cup", beneficiary_name: "Northside Youth Fund", format: "STROKE_PLAY", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 1, prize_pool_cents: 100000 }
              as: TournamentDirector
              captures: { o_id: $.data.id }
            - call: "POST /outing-ops/contracts"
              payload: { outing_id: "${o_id}", course_name: "Cedar Ridge GC", rate_per_player_cents: 9500, guaranteed_player_count: 0, fnb_minimum_cents: 0, fnb_per_player_cents: 4500 }
              as: CourseOperations
              captures: { c_id: $.data.id }
            - call: "POST /outing-ops/contracts/${c_id}/lifecycle"
              payload: { action: "SIGN" }
              as: CourseOperations
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${o_id}", code: "TITLE", kind: "SPONSOR", price_cents: 2100000, player_slots: 0, gsv_cents: 0, inventory_cap: 5 }
              as: TournamentDirector
              captures: { t_id: $.data.id }
            - call: "POST /outing-ops/outings/${o_id}/play-transition"
              payload: { action: "OPEN_REGISTRATION" }
              as: TournamentDirector
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${o_id}", package_tier_id: "${t_id}", buyer_name: "Summit Bank", player_count: 0 }
              as: TournamentDirector
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /outing-ops/registrations/${r_id}/payment"
              payload: { amount_cents: 2100000 }
              as: CharityTreasurer
          assert:
            - "Outing.${o_id}.gross_revenue_cents == 2100000"
            - "Outing.${o_id}.direct_costs_cents == 100000"
            - "Outing.${o_id}.net_proceeds_before_fee_cents == 2000000"
            - "Outing.${o_id}.admin_fee_pct == 0.035"
            - "Outing.${o_id}.admin_fee_cents == 73500"
            - "Outing.${o_id}.net_proceeds_cents == 1926500"
            - "Outing.${o_id}.course_charge_cents == 0 and Outing.${o_id}.fnb_shortfall_cents == 0"

  - rule_id: non_linear_state_machine
    instances:
      - name: outing_field_reopen_cycle_with_independent_finance_dimension
        grounds:
          - state_machines.Outing.OPEN_to_FIELD_LOCKED
          - state_machines.Outing.FIELD_LOCKED_to_OPEN
          - state_machines.Outing.COLLECTING_to_RECONCILED
          - entities.Outing.fields.reopen_count
          - validations[priority=32]
        distinguishing_aspect: |
          The Outing row carries two independent dimensions (play_status and
          finance_status) AND a cycle on the play dimension: OPEN -> FIELD_LOCKED -> OPEN
          may run exactly MAX_FIELD_REOPENS = 2 times, the third reopen is rejected with
          ERR_MAX_REOPENS_EXCEEDED, and none of the six play transitions moves
          finance_status off COLLECTING.
