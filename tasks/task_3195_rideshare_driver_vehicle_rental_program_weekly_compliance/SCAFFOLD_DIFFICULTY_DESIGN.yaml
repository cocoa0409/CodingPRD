              as_user_id: "${d_id}"
          trigger:
            - call: "POST /program/purchase-options/${po_id}/fund-escrow"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
              captures: { weeks_funded: $.data.escrow_weeks_funded, escrow_balance: $.data.escrow_balance_cents }
            - call: "POST /program/purchase-options/${po_id}/complete"
              payload: {}
              as: PlatformAdmin
              captures: { opt_status: $.data.option_status }
          assert:
            - "PurchaseOption.${po_id}.equity_credit_cents == 7687 and PurchaseOption.${po_id}.escrow_required_cents == 1192313"
            - "PurchaseOption.${po_id}.escrow_weeks_funded == 1 and escrow_balance_cents == 1192313"
            - "PurchaseOption.${po_id}.escrow_balance_cents + equity_credit_cents == 1200000, exactly purchase_price_cents, so completion succeeds"
            - "PurchaseOption.${po_id}.option_status == COMPLETED and RentalAgreement.${a_id}.agreement_status == PURCHASED"
            - "ProgramVehicle.${vA_id}.vehicle_status == RETIRED with assigned_driver_id null"
            - "RentalAgreement.${a_id}.total_billed_cents == 76870 unchanged by the purchase"
            - "the count of region CA ProgramVehicle rows in {AVAILABLE, ASSIGNED, MAINTENANCE, RECOVERY} falls by exactly 1 while the RETIRED count rises by exactly 1, leaving their sum unchanged"
