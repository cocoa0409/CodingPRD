    grounds:
    - state_machines.FunctionSpaceHold
    - errors[ERR_HOLD_INVALID_STATE]
    - validations[priority=25]
    distinguishing_aspect: |
      RELEASED is the FunctionSpaceHold terminal state, so the second release must be a 409 ERR_HOLD_INVALID_STATE rather than a silent 200. The follow-up create proves the release actually vacated the interval: the same GRAND_BALLROOM window that would have collided under priority 25 is now accepted.
