              as: SalesAssociate
            - call: "POST /sales"
              payload: { itinerary_id: "${it_20}", channel: "IN_STORE" }
              as: SalesAssociate
              captures: { sale_20: $.data.id, sale_20_v: $.data.version }
            - call: "POST /sales/${sale_20}/lines"
              payload: { product_id: "${p_watch}", qty: 5, expected_sale_version: "${sale_20_v}" }
              as: SalesAssociate
              captures: { line_20: $.data.id }
            - call: "POST /sales/${sale_20}/clear-eligibility"
              payload: {}
              as: SalesAssociate
            - call: "POST /sales/${sale_20}/pickup"
              payload: {}
              as: SalesAssociate
          trigger:
            - call: "POST /sales/${sale_20}/void"
              payload: {}
              as: SalesAssociate
            - call: "GET /bonded-movements"
              payload: { stock_item_id: "${si_watch}", movement_type: "REVERSAL" }
              as: StockController
              captures: { mv_rev: "$.data[0].id", mv_rev_delta: "$.data[0].qty_delta" }
          assert:
            - "ConcessionAgreement.${ag_hkg}.gross_sales_cents == 100000 before the void"
            - "ConcessionAgreement.${ag_hkg}.percentage_rent_cents == 12000 before the void"
            - "ConcessionAgreement.${ag_hkg}.rent_basis == PERCENTAGE before the void"
            - "BondedStockItem.${si_watch}.on_hand_qty == 15 before the void"
            - "BondedStockItem.${si_watch}.duty_suspended_value_cents == 21000 before the void"
            - "the void returns HTTP 200"
            - "Sale.${sale_20}.fulfillment_status == VOIDED"
            - "Sale.${sale_20}.duty_status == REVERSED"
            - "Sale.${sale_20}.exempt_amount_cents == 0"
            - "Sale.${sale_20}.duty_liability_cents == 0"
            - "Sale.${sale_20}.gross_amount_cents == 100000"
            - "Sale.${sale_20}.voided_at == 2026-08-01T00:00:00Z"
            - "${mv_rev_delta} == 5"
            - "BondedMovement.${mv_rev}.source_ref_type == REVERSAL"
            - "BondedStockItem.${si_watch}.on_hand_qty == 20"
            - "BondedStockItem.${si_watch}.available_qty == 20"
            - "BondedStockItem.${si_watch}.duty_suspended_value_cents == 28000"
            - "ConcessionAgreement.${ag_hkg}.gross_sales_cents == 0"
            - "ConcessionAgreement.${ag_hkg}.percentage_rent_cents == 0"
            - "ConcessionAgreement.${ag_hkg}.rent_basis == MINIMUM_GUARANTEE"

      - name: preorder_cancellation_conserves_reserved_capacity_without_touching_on_hand
        conserved_quantity: "BondedStockItem.reserved_qty and the available_qty derived from it, with on_hand_qty and duty_suspended_value_cents held invariant throughout"
        grounds:
          - state_machines.PreOrder.RESERVED_to_CANCELLED
          - calculations.bonded_duty_suspended_value
          - concurrency_rules.preorder-create-stale-stock-item
          - roles.Passenger
        distinguishing_aspect: |
          Endpoint POST /pre-orders/{pre_order_id}/cancel conserves RESERVED CAPACITY, a quantity
          that never touches on_hand_qty: the RESERVATION_RELEASE movement of -25 affects RESERVED
          only, so reserved_qty returns to 0 and available_qty to 100 while on_hand_qty stays 100 and
          duty_suspended_value_cents stays 192000 across the whole reserve-then-cancel cycle - the
          bonded duty exposure is a function of on_hand alone.
        test_recipe:
          setup:
            - "Terminal SIN in SG"
            - "One LISTED LIQUOR product priced 8000 cents at 2400 bps total, 100 units received"
            - "One itinerary departing 2026-08-20T00:00:00Z"
            - "A RESERVED PreOrder of qty 25 for PICKUP_ON_DEPARTURE created by the passenger"
          setup_api_calls:
            - call: "POST /terminals"
              payload: { iata_code: "SIN", name: "Changi T3 Duty Free", country_code: "SG", sealed_bag_regime: "NONE", liquid_limit_ml: 3000 }
              as: TerminalAdmin
              captures: { t_sin: $.data.id }
            - call: "POST /brands"
              payload: { name: "Aurora Spirits", category: "LIQUOR" }
              as: TerminalAdmin
              captures: { b_aurora: $.data.id }
            - call: "POST /products"
              payload: { brand_id: "${b_aurora}", sku: "AUR-WHISKY-700", category: "LIQUOR", unit_price_cents: 8000, duty_rate_bps: 1500, vat_rate_bps: 900, is_liquid: true, liquid_ml: 700, target_nationality_code: "CN", required_nationality_share_bps: 0 }
              as: TerminalAdmin
              captures: { p_whisky: $.data.id }
            - call: "POST /products/${p_whisky}/list"
              payload: {}
              as: TerminalAdmin
            - call: "POST /bonded-stock-items"
              payload: { terminal_id: "${t_sin}", product_id: "${p_whisky}" }
              as: StockController
              captures: { si_whisky: $.data.id }
            - call: "POST /bonded-movements"
              payload: { stock_item_id: "${si_whisky}", movement_type: "RECEIPT", qty_delta: 100 }
              as: StockController
            - call: "POST /itineraries"
              payload: { passenger_ref: "PAX-0021", nationality_code: "CN", boarding_pass_barcode: "BP-0021", departure_terminal_id: "${t_sin}", departure_utc: "2026-08-20T00:00:00Z", destination_country: "AU", final_destination_country: "AU", has_connection: false }
              as: SalesAssociate
              captures: { it_21: $.data.id }
            - call: "GET /bonded-stock-items/${si_whisky}"
              as: StockController
              captures: { si_v0: $.data.version }
            - call: "POST /pre-orders"
              payload: { itinerary_id: "${it_21}", stock_item_id: "${si_whisky}", qty: 25, program: "PICKUP_ON_DEPARTURE", reservation_window_start: "2026-08-10T00:00:00Z", reservation_window_end: "2026-08-12T00:00:00Z", expected_stock_item_version: "${si_v0}" }
              as: Passenger
              as_user_id: "${it_21}"
              captures: { po_21: $.data.id }
          trigger:
            - call: "POST /pre-orders/${po_21}/cancel"
              payload: {}
              as: Passenger
              as_user_id: "${it_21}"
            - call: "GET /bonded-movements"
              payload: { stock_item_id: "${si_whisky}", movement_type: "RESERVATION_RELEASE" }
              as: StockController
              captures: { mv_rel: "$.data[0].id", mv_rel_delta: "$.data[0].qty_delta" }
            - call: "POST /pre-orders/${po_21}/cancel"
              payload: {}
              as: Passenger
              as_user_id: "${it_21}"
          assert:
            - "BondedStockItem.${si_whisky}.on_hand_qty == 100 before the cancel"
            - "BondedStockItem.${si_whisky}.reserved_qty == 25 before the cancel"
            - "BondedStockItem.${si_whisky}.available_qty == 75 before the cancel"
            - "BondedStockItem.${si_whisky}.duty_suspended_value_cents == 192000 before the cancel"
            - "the first cancel returns HTTP 200"
            - "PreOrder.${po_21}.status == CANCELLED"
            - "PreOrder.${po_21}.closed_at == 2026-08-01T00:00:00Z"
            - "${mv_rel_delta} == -25"
            - "BondedMovement.${mv_rel}.affects == RESERVED"
            - "BondedMovement.${mv_rel}.source_ref_type == PRE_ORDER"
            - "BondedMovement.${mv_rel}.source_ref_id == ${po_21}"
            - "BondedStockItem.${si_whisky}.reserved_qty == 0"
            - "BondedStockItem.${si_whisky}.available_qty == 100"
            - "BondedStockItem.${si_whisky}.on_hand_qty == 100"
            - "BondedStockItem.${si_whisky}.duty_suspended_value_cents == 192000"
            - "the second cancel returns HTTP 409 with error_id ERR_PREORDER_NOT_RESERVED"
            - "GET /bonded-movements filtered by stock_item_id ${si_whisky} returns exactly 3 movements"
