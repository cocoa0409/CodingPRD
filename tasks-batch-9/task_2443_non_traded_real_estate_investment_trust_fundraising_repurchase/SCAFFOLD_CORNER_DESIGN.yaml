          trigger:
            - call: "POST /nav-records"
              payload: { share_class_id: "${sc_id}", period_start_date: "2026-08-01", period_end_date: "2026-08-31", gross_asset_value_cents: 27000000, other_liabilities_cents: 0, expected_share_class_version: "${sc_v}" }
              as: SponsorOperator
              captures: { nav_id: $.data.id, nav_price: $.data.nav_per_share_cents }
            - call: "GET /offerings/${off_id}"
              as: SponsorOperator
              captures: { agg_while_draft: $.data.aggregate_nav_cents }
            - call: "POST /nav-records/${nav_id}/status"
              payload: { to_status: "ADVISOR_REVIEW" }
              as: SponsorOperator
            - call: "POST /nav-records/${nav_id}/status"
              payload: { to_status: "ADVISOR_CONFIRMED", advisor_opinion_reference: "IVA-2026-08-LL" }
