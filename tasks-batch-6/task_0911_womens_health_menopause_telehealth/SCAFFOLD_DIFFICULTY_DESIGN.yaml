      - name: prescription_coverage_buffer_conflict
        grounds:
          - validations[priority=12]
          - errors[ERR_COVERAGE_WINDOW_CONFLICT]
          - entities.Prescription.fields.coverage_end_date
          - entities.Prescription.fields.hrt_type
        distinguishing_aspect: "Patient-resource, CLOSED interval with a 7-day BUFFER on same hrt_type: a new ESTROGEN_PATCH window starting only 4 days after the prior window's end collides, while a different hrt_type (PROGESTERONE) does not — buffer semantics distinct from the visit's touching-allowed rule and a different resource entity."
        test_recipe:
          setup:
            - "ACTIVE ESTROGEN_PATCH prescription P1 with coverage 2026-06-01..2026-06-21 (coverage_days 20); clock advanced to 2026-06-25; a completed visit V2 available."
