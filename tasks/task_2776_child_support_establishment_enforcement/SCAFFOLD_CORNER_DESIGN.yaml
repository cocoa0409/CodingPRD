              as: CaseWorker
              captures: { cpb: "$.data.id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Casey Odell", ssn_last4: "6104", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "NONE", supports_second_family: false, has_valid_drivers_license: true }
