              as: StudioPhotographer
            - call: "POST /api/picture-day-sessions/${sess}/open-gallery"
              payload: {}
              as: SchoolCoordinator
          trigger:
            - call: "POST /api/photos/${ph}/match"
              payload: {}
              as: StudioPhotographer
              captures: { err: $.data.error_id }
          assert:
            - "match returns ERR_SESSION_NOT_CAPTURING (409) because PictureDaySession.${sess}.status == GALLERY_OPEN, not CAPTURE_OPEN"
            - "Photo.${ph}.status remains UNMATCHED"

      - name: shipment_dispatch_requires_order_paid
        grounds:
          - state_machines.Shipment.PENDING_to_DISPATCHED
          - entities.PhotoOrder.fields.status
          - validations[priority=11]
        distinguishing_aspect: |
          Entity pair Shipment -> PhotoOrder (a DIFFERENT pair from Photo -> PictureDaySession): a
          Shipment can transition PENDING -> DISPATCHED only when its linked PhotoOrder.status == PAID.
          Here the order is only SUBMITTED, so dispatch is rejected.
        test_recipe:
          setup:
            - "Session GALLERY_OPEN; order O SUBMITTED (NOT paid); a PENDING Shipment with tracking_code created against O (creation allowed; dispatch gated)."
          setup_api_calls:
            - call: "POST /api/picture-day-sessions"
              payload: { school_name: "Olive School", scheduled_date: "2026-05-14T00:00:00Z", gallery_closes_at: "2026-12-31T00:00:00Z", retouch_budget_cents: 0 }
              as: SchoolCoordinator
