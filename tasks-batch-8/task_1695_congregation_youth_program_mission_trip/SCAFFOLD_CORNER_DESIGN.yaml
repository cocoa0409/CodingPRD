            - { call: "POST /youth-ministry/background-checks/${bc}/advance", payload: {to_status: "SCREENING"}, as: ProgramDirector }
            - { call: "POST /youth-ministry/background-checks/${bc}/advance", payload: {to_status: "CLEARED"}, as: ProgramDirector }
          trigger:
            - { call: "POST /youth-ministry/registrations", payload: {trip_id: "${trip}", participant_id: "${p1}", insurance_tier: "NONE", fundraising_goal_cents: 0}, as: Guardian, as_user_id: "guardian-1", captures: {e_draft: $.data.error_id} }
            - { call: "POST /youth-ministry/programs/${prog}/close", as: ProgramDirector, captures: {e_close: $.data.error_id} }
            - { call: "POST /youth-ministry/trips/${trip}/cancel", payload: {}, as: ProgramDirector }
            - { call: "POST /youth-ministry/chaperone-assignments", payload: {trip_id: "${trip}", chaperone_id: "${chap}", role: "LEAD"}, as: ProgramDirector, captures: {e_cancelled: $.data.error_id} }
            - { call: "POST /youth-ministry/programs/${prog}/close", as: ProgramDirector, captures: {prog_status: $.data.status} }
            - { call: "POST /youth-ministry/trips", payload: {program_id: "${prog}", name: "T2", destination_name: "Local", destination_type: "IN_STATE", start_date: "2027-07-01", end_date: "2027-07-02", capacity_youth: 5, base_cost_cents: 100, deposit_cents: 50, chaperone_ratio: 5, registration_open_at: "2026-08-01T00:00:00Z", registration_close_at: "2026-12-01T00:00:00Z", deposit_due_at: "2027-01-15T00:00:00Z", final_payment_due_at: "2027-05-01T00:00:00Z"}, as: ProgramDirector, captures: {e_notopen: $.data.error_id} }
          assert:
