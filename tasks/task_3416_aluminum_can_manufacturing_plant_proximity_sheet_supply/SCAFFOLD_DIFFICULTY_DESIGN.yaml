      - name: forecast_zero_forecast_zero_actual_accuracy_defined_100
        grounds:
          - calculations.forecast_accuracy
          - entities.CustomerForecast.fields.accuracy_pct
          - endpoints.POST_/forecasts/{id}/close
        distinguishing_aspect: |
          Zero-quantity boundary on a different metric and endpoint than the capacity check:
          closing a forecast with forecast_qty == 0 AND actual_qty == 0 must NOT divide by
          zero — accuracy_pct is pinned to exactly 100.00 — while f=5000/a=0 yields 0.00 via
          the max() denominator branch.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Plant; customer; ACTIVE agreement. Two OPEN forecasts: FZ period 2026-06 qty 0; FN period 2026-07 qty 5000."
          setup_api_calls:
