              as: PlatformAdmin
              captures: { att_addon_id: $.data.id }
            - call: "POST /booths"
              payload: { booth_model_id: "${model_id}", asset_tag: "BTH-001" }
              as: OperationsManager
              captures: { booth1_id: $.data.id, booth1_v: $.data.version }
            - call: "POST /booths"
              payload: { booth_model_id: "${model_id}", asset_tag: "BTH-002" }
              as: OperationsManager
              captures: { booth2_id: $.data.id, booth2_v: $.data.version }
            - call: "POST /attendants"
              payload: { full_name: "Sam Staff" }
              as: OperationsManager
