              captures: { pathway_id: "$.data.id" }
          trigger:
            - call: "GET /credit-pathways/${pathway_id}/credit-ledger"
              payload: {}
              as: CreditVerifier
              as_user_id: "u-verifier"
            - call: "GET /facilities/${facility_id}/financial-summary"
              payload: {}
              as: CreditVerifier
              as_user_id: "u-verifier"
