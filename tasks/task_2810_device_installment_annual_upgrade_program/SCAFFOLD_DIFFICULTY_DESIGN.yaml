          - entities.PayoffQuote.fields.past_due_amount_cents
          - entities.PayoffQuote.fields.paid_installment_count_at_quote
          - endpoints.POST_/loans/{id}/payoff-quotes
        distinguishing_aspect: |
          The zero end of the aggregation, on the metric paid_installment_count_at_quote (0)
          and the empty past-due input set, reached through POST /loans/{id}/payoff-quotes on
          a brand-new loan whose first installment is not even due. Every aggregate must
          degenerate cleanly rather than divide by zero or skip: remaining_principal_cents is
          the full 89900, past_due_amount_cents is 0 over an empty set,
          unearned_premium_cents is the entire 23976 and the rebate is
          round_half_up(23976 * 9000 / 10000) == 21578 (the .4 truncation is the precision
          trap, and a naive 0.9 float multiply yields 21578.400000000001), so
          total_payoff_cents == 89900 + 0 + 2500 - 21578 == 70822 — a payoff larger than the
          retail price, which is correct here and is exactly what a clamp-to-retail
          implementation gets wrong.
