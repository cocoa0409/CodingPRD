            - "the 2-bottle slot-linked write-off returns 422 ERR_SLOT_WRITE_OFF_INVALID — a slot write-off is exactly one bottle"
            - "the 1-bottle version returns 201 in state SUBMITTED with cogs_cents 0"
            - "the first approval returns 200 with cogs_cents 2400, drops lot.bottles_on_hand to 5, releases the committed bottle (bottles_committed 0) and moves the slot EXPIRED -> WRITTEN_OFF"
