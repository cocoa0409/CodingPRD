# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of §1.1-§1.7 claims not in §1.8)
# Same 7-point per-instance contract and §1.5 gates as §1.8.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: create_client_account_success
        claim_type: Creation
        grounds: [entities.ClientAccount]
        distinguishing_aspect: "POST /client-accounts with all required fields returns 201 with a server-minted id and zeroed rollup totals."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /client-accounts"
              payload: { name: "Acme", account_code: "C-OK1", reserve_authority_default_cents: 100000000 }
              as: ClaimsManager
              captures: { acct_id: $.data.id }
          assert:
            - "response.status == 201"
            - "ClientAccount.${acct_id}.open_case_reserve_total_cents == 0"
            - "ClientAccount.${acct_id}.gross_incurred_total_cents == 0"

      - name: claim_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Claim]
        distinguishing_aspect: "GET on a well-formed but non-existent claim id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /claims/00000000-0000-0000-0000-000000000000"
              as: ClaimsManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: claim_missing_required_policy_id
        claim_type: Required Fields
        grounds: [entities.Claim.fields.policy_id]
        distinguishing_aspect: "POST /claims without policy_id is rejected ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB (no policy needed to prove the missing-field rejection)."]
          setup_api_calls: []
          trigger:
            - call: "POST /claims"
              payload: { coverage_type: "PROPERTY", loss_date: "2026-06-01T00:00:00Z", reported_date: "2026-06-15T00:00:00Z", claimant_name: "CN", description: "d" }
              as: Adjuster
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: policy_deductible_defaults_zero
        claim_type: Defaults
        grounds: [entities.Policy.fields.deductible_cents, entities.Policy.fields.status]
        distinguishing_aspect: "Omitting deductible_cents applies default 0; with the default clock (2026-07-01) before expiration, status computes ACTIVE."
        test_recipe:
          setup: ["One account."]
          setup_api_calls:
            - call: "POST /client-accounts"
              payload: { name: "Acme", account_code: "C-DF", reserve_authority_default_cents: 100000000 }
              as: ClaimsManager
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /policies"
              payload: { client_account_id: "${acct_id}", policy_number: "P-DF", coverage_limit_cents: 100000000, per_claim_expense_limit_cents: 5000000, effective_date: "2020-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z" }
              as: ClaimsManager
              captures: { policy_id: $.data.id }
          assert:
            - "Policy.${policy_id}.deductible_cents == 0"
            - "Policy.${policy_id}.status == ACTIVE"

      - name: new_claim_computed_fields_zero
        claim_type: Computed Fields
        grounds: [entities.Claim.fields.gross_incurred_cents, entities.Claim.fields.siu_status]
        distinguishing_aspect: "A freshly created claim starts status=INTAKE, siu_status=NONE, gross_incurred_cents=0, net_incurred_cents=0, and copies client_account_id from the policy."
        test_recipe:
          setup: ["One account + policy."]
          setup_api_calls:
            - call: "POST /client-accounts"
              payload: { name: "Acme", account_code: "C-NC", reserve_authority_default_cents: 100000000 }
              as: ClaimsManager
              captures: { acct_id: $.data.id }
            - call: "POST /policies"
              payload: { client_account_id: "${acct_id}", policy_number: "P-NC", coverage_limit_cents: 100000000, deductible_cents: 0, per_claim_expense_limit_cents: 5000000, effective_date: "2020-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z" }
              as: ClaimsManager
              captures: { policy_id: $.data.id }
          trigger:
            - call: "POST /claims"
              payload: { policy_id: "${policy_id}", coverage_type: "PROPERTY", loss_date: "2026-06-01T00:00:00Z", reported_date: "2026-06-15T00:00:00Z", claimant_name: "CN", description: "d" }
              as: Adjuster
              captures: { claim_id: $.data.id }
          assert:
            - "Claim.${claim_id}.status == INTAKE"
            - "Claim.${claim_id}.siu_status == NONE"
            - "Claim.${claim_id}.gross_incurred_cents == 0"
            - "Claim.${claim_id}.net_incurred_cents == 0"
            - "Claim.${claim_id}.client_account_id == ${acct_id}"

      - name: vendor_invalid_enum_type_rejected
        claim_type: Type Constraints
        grounds: [entities.Vendor.fields.vendor_type]
        distinguishing_aspect: "POST /vendors with an illegal vendor_type is rejected ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /vendors"
              payload: { name: "Bad", vendor_type: "WIZARD", credentialed_coverages: ["PROPERTY"] }
              as: ClaimsManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

  - section: state_machines
    instances:
      - name: claim_invalid_transition_intake_to_evaluated
        claim_type: Invalid Transitions
        grounds: [state_machines.Claim]
        distinguishing_aspect: "From INTAKE, requesting EVALUATED (not a declared transition) returns ERR_INVALID_STATE (409); no fields mutate."
        test_recipe:
          setup: ["One INTAKE claim (no assignment yet)."]
          setup_api_calls:
            - call: "POST /client-accounts"
              payload: { name: "Acme", account_code: "C-IV", reserve_authority_default_cents: 100000000 }
              as: ClaimsManager
              captures: { acct_id: $.data.id }
            - call: "POST /policies"
              payload: { client_account_id: "${acct_id}", policy_number: "P-IV", coverage_limit_cents: 100000000, deductible_cents: 0, per_claim_expense_limit_cents: 5000000, effective_date: "2020-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z" }
              as: ClaimsManager
              captures: { policy_id: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${policy_id}", coverage_type: "PROPERTY", loss_date: "2026-06-01T00:00:00Z", reported_date: "2026-06-15T00:00:00Z", claimant_name: "CN", description: "d" }
              as: Adjuster
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /claims/${claim_id}/transition"
              payload: { to_status: "EVALUATED" }
              as: Adjuster
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Claim.${claim_id}.status == INTAKE"

      - name: payment_terminal_lockdown_from_rejected
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Payment.PENDING_APPROVAL_to_REJECTED]
        distinguishing_aspect: "A REJECTED payment is terminal: approving it afterward returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Claim assigned; one payment created then REJECTED."]
          setup_api_calls:
            - call: "POST /client-accounts"
              payload: { name: "Acme", account_code: "C-TL", reserve_authority_default_cents: 100000000 }
              as: ClaimsManager
              captures: { acct_id: $.data.id }
            - call: "POST /policies"
              payload: { client_account_id: "${acct_id}", policy_number: "P-TL", coverage_limit_cents: 100000000, deductible_cents: 0, per_claim_expense_limit_cents: 5000000, effective_date: "2020-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z" }
              as: ClaimsManager
              captures: { policy_id: $.data.id }
            - call: "POST /adjusters"
              payload: { name: "Ada", email: "ada@x.com", authority_limit_cents: 5000000 }
              as: ClaimsManager
              captures: { adj_id: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${policy_id}", coverage_type: "PROPERTY", loss_date: "2026-06-01T00:00:00Z", reported_date: "2026-06-15T00:00:00Z", claimant_name: "CN", description: "d" }
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /assignments"
              payload: { claim_id: "${claim_id}", assignee_type: "ADJUSTER", adjuster_id: "${adj_id}", scope: "FIELD_INSPECTION", inspection_start: "2026-06-16T09:00:00Z", inspection_end: "2026-06-16T11:00:00Z" }
              as: Adjuster
              as_user_id: "${adj_id}"
            - call: "GET /claims/${claim_id}"
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { v1: $.data.version }
            - call: "POST /payments"
              payload: { claim_id: "${claim_id}", payment_type: "INDEMNITY", payee_type: "CLAIMANT", payee_name: "CN", amount_cents: 100000, expected_claim_version: "${v1}" }
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { pay_id: $.data.id }
            - call: "POST /payments/${pay_id}/transition"
              payload: { to_status: "REJECTED" }
              as: ClaimsManager
          trigger:
            - call: "POST /payments/${pay_id}/transition"
              payload: { to_status: "APPROVED" }
              as: ClaimsManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Payment.${pay_id}.status == REJECTED"

      - name: siu_clear_lifts_hold_then_pay
        claim_type: Side Effect Execution
        grounds: [state_machines.SiuReferral.OPEN_to_CLEARED, entities.Claim.fields.siu_status]
        distinguishing_aspect: "Clearing an SIU referral flips Claim.siu_status HELD->CLEARED, after which the previously blocked payment ISSUES successfully."
        test_recipe:
          setup: ["Claim assigned; reserve 300000; payment 300000 APPROVED; SIU referral placed a HELD hold."]
          setup_api_calls:
            - call: "POST /client-accounts"
              payload: { name: "Acme", account_code: "C-SC", reserve_authority_default_cents: 100000000 }
              as: ClaimsManager
              captures: { acct_id: $.data.id }
            - call: "POST /policies"
              payload: { client_account_id: "${acct_id}", policy_number: "P-SC", coverage_limit_cents: 100000000, deductible_cents: 0, per_claim_expense_limit_cents: 5000000, effective_date: "2020-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z" }
              as: ClaimsManager
              captures: { policy_id: $.data.id }
            - call: "POST /adjusters"
              payload: { name: "Ada", email: "ada@x.com", authority_limit_cents: 5000000 }
              as: ClaimsManager
              captures: { adj_id: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${policy_id}", coverage_type: "PROPERTY", loss_date: "2026-06-01T00:00:00Z", reported_date: "2026-06-15T00:00:00Z", claimant_name: "CN", description: "d" }
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /assignments"
              payload: { claim_id: "${claim_id}", assignee_type: "ADJUSTER", adjuster_id: "${adj_id}", scope: "FIELD_INSPECTION", inspection_start: "2026-06-16T09:00:00Z", inspection_end: "2026-06-16T11:00:00Z" }
              as: Adjuster
              as_user_id: "${adj_id}"
            - call: "GET /claims/${claim_id}"
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { v1: $.data.version }
            - call: "POST /reserve-changes"
              payload: { claim_id: "${claim_id}", reserve_type: "INDEMNITY", delta_cents: 300000, reason: "set", expected_claim_version: "${v1}" }
              as: Adjuster
              as_user_id: "${adj_id}"
            - call: "GET /claims/${claim_id}"
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { v2: $.data.version }
            - call: "POST /payments"
              payload: { claim_id: "${claim_id}", payment_type: "INDEMNITY", payee_type: "CLAIMANT", payee_name: "CN", amount_cents: 300000, expected_claim_version: "${v2}" }
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { pay_id: $.data.id }
            - call: "POST /payments/${pay_id}/transition"
              payload: { to_status: "APPROVED" }
              as: Adjuster
              as_user_id: "${adj_id}"
            - call: "POST /siu-referrals"
              payload: { claim_id: "${claim_id}", reason: "flag", place_hold: true }
              as: SiuInvestigator
              captures: { siu_id: $.data.id }
          trigger:
            - call: "POST /siu-referrals/${siu_id}/transition"
              payload: { to_status: "CLEARED" }
              as: SiuInvestigator
            - call: "POST /payments/${pay_id}/transition"
              payload: { to_status: "ISSUED" }
              as: FinanceOfficer
          assert:
            - "Claim.${claim_id}.siu_status == CLEARED"
            - "Payment.${pay_id}.status == ISSUED"
            - "Claim.${claim_id}.paid_indemnity_cents == 300000"

      - name: claim_close_blocked_by_pending_payment
        claim_type: Precondition Enforcement
        grounds: [state_machines.Claim.EVALUATED_to_CLOSED, "errors[ERR_PAYMENT_PENDING]"]
        distinguishing_aspect: "An EVALUATED claim with a PENDING_APPROVAL payment cannot close: ERR_PAYMENT_PENDING (409)."
        test_recipe:
          setup: ["Claim assigned, INVESTIGATING, EVALUATED; one PENDING_APPROVAL payment exists."]
          setup_api_calls:
            - call: "POST /client-accounts"
              payload: { name: "Acme", account_code: "C-PP", reserve_authority_default_cents: 100000000 }
              as: ClaimsManager
              captures: { acct_id: $.data.id }
            - call: "POST /policies"
              payload: { client_account_id: "${acct_id}", policy_number: "P-PP", coverage_limit_cents: 100000000, deductible_cents: 0, per_claim_expense_limit_cents: 5000000, effective_date: "2020-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z" }
              as: ClaimsManager
              captures: { policy_id: $.data.id }
            - call: "POST /adjusters"
              payload: { name: "Ada", email: "ada@x.com", authority_limit_cents: 5000000 }
              as: ClaimsManager
              captures: { adj_id: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${policy_id}", coverage_type: "PROPERTY", loss_date: "2026-06-01T00:00:00Z", reported_date: "2026-06-15T00:00:00Z", claimant_name: "CN", description: "d" }
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /assignments"
              payload: { claim_id: "${claim_id}", assignee_type: "ADJUSTER", adjuster_id: "${adj_id}", scope: "FIELD_INSPECTION", inspection_start: "2026-06-16T09:00:00Z", inspection_end: "2026-06-16T11:00:00Z" }
              as: Adjuster
              as_user_id: "${adj_id}"
            - call: "POST /claims/${claim_id}/transition"
              payload: { to_status: "INVESTIGATING" }
              as: Adjuster
              as_user_id: "${adj_id}"
            - call: "POST /claims/${claim_id}/transition"
              payload: { to_status: "EVALUATED" }
              as: Adjuster
              as_user_id: "${adj_id}"
            - call: "GET /claims/${claim_id}"
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { v1: $.data.version }
            - call: "POST /payments"
              payload: { claim_id: "${claim_id}", payment_type: "INDEMNITY", payee_type: "CLAIMANT", payee_name: "CN", amount_cents: 100000, expected_claim_version: "${v1}" }
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /claims/${claim_id}/transition"
              payload: { to_status: "CLOSED" }
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_PAYMENT_PENDING"
            - "Claim.${claim_id}.status == EVALUATED"

      - name: close_blocked_by_open_subrogation
        claim_type: Precondition Enforcement
        grounds: [state_machines.Claim.EVALUATED_to_CLOSED, "errors[ERR_SUBROGATION_OPEN]"]
        distinguishing_aspect: "An EVALUATED claim with a SubrogationCase in DEMAND_SENT cannot close: ERR_SUBROGATION_OPEN (409)."
        test_recipe:
          setup: ["Claim assigned, INVESTIGATING, EVALUATED; SubrogationCase advanced to DEMAND_SENT."]
          setup_api_calls:
            - call: "POST /client-accounts"
              payload: { name: "Acme", account_code: "C-SO", reserve_authority_default_cents: 100000000 }
              as: ClaimsManager
              captures: { acct_id: $.data.id }
            - call: "POST /policies"
              payload: { client_account_id: "${acct_id}", policy_number: "P-SO", coverage_limit_cents: 100000000, deductible_cents: 0, per_claim_expense_limit_cents: 5000000, effective_date: "2020-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z" }
              as: ClaimsManager
              captures: { policy_id: $.data.id }
            - call: "POST /adjusters"
              payload: { name: "Ada", email: "ada@x.com", authority_limit_cents: 5000000 }
              as: ClaimsManager
              captures: { adj_id: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${policy_id}", coverage_type: "AUTO", loss_date: "2026-06-01T00:00:00Z", reported_date: "2026-06-15T00:00:00Z", claimant_name: "CN", description: "d" }
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /assignments"
              payload: { claim_id: "${claim_id}", assignee_type: "ADJUSTER", adjuster_id: "${adj_id}", scope: "FIELD_INSPECTION", inspection_start: "2026-06-16T09:00:00Z", inspection_end: "2026-06-16T11:00:00Z" }
              as: Adjuster
              as_user_id: "${adj_id}"
            - call: "POST /claims/${claim_id}/transition"
              payload: { to_status: "INVESTIGATING" }
              as: Adjuster
              as_user_id: "${adj_id}"
            - call: "POST /claims/${claim_id}/transition"
              payload: { to_status: "EVALUATED" }
              as: Adjuster
              as_user_id: "${adj_id}"
            - call: "POST /subrogation-cases"
              payload: { claim_id: "${claim_id}", at_fault_party: "X", demand_cents: 100000 }
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subrogation-cases/${sub_id}/transition"
              payload: { to_status: "DEMAND_SENT" }
              as: Adjuster
              as_user_id: "${adj_id}"
          trigger:
            - call: "POST /claims/${claim_id}/transition"
              payload: { to_status: "CLOSED" }
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SUBROGATION_OPEN"

  - section: calculations
    instances:
      - name: subrogation_recovered_pro_rata_allocation
        claim_type: Variant Selection
        grounds: [calculations.subrogation_recovery_allocation]
        distinguishing_aspect: "PRO_RATA variant: with paid_indemnity=600000, paid_expense=400000, recovering 500000 credits recovered_indemnity=round_half_up(500000*600000/1000000)=300000 and recovered_expense=200000 (complement of the §1.8 INDEMNITY_FIRST instance)."
        test_recipe:
          setup: ["Claim assigned; paid_indemnity=600000 (issued payment); paid_expense=400000 (paid vendor invoice, materials 400000); SubrogationCase at NEGOTIATING."]
          setup_api_calls:
            - call: "POST /client-accounts"
              payload: { name: "Acme", account_code: "C-PR", reserve_authority_default_cents: 100000000 }
              as: ClaimsManager
              captures: { acct_id: $.data.id }
            - call: "POST /policies"
              payload: { client_account_id: "${acct_id}", policy_number: "P-PR", coverage_limit_cents: 100000000, deductible_cents: 0, per_claim_expense_limit_cents: 5000000, effective_date: "2020-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z" }
              as: ClaimsManager
              captures: { policy_id: $.data.id }
            - call: "POST /adjusters"
              payload: { name: "Ada", email: "ada@x.com", authority_limit_cents: 5000000 }
              as: ClaimsManager
              captures: { adj_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "IA Co", vendor_type: "INDEPENDENT_ADJUSTER", credentialed_coverages: ["PROPERTY"] }
              as: ClaimsManager
              captures: { vendor_id: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${policy_id}", coverage_type: "PROPERTY", loss_date: "2026-06-01T00:00:00Z", reported_date: "2026-06-15T00:00:00Z", claimant_name: "CN", description: "d" }
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /assignments"
              payload: { claim_id: "${claim_id}", assignee_type: "ADJUSTER", adjuster_id: "${adj_id}", scope: "FIELD_INSPECTION", inspection_start: "2026-06-16T09:00:00Z", inspection_end: "2026-06-16T11:00:00Z" }
              as: Adjuster
              as_user_id: "${adj_id}"
            - call: "POST /assignments"
              payload: { claim_id: "${claim_id}", assignee_type: "VENDOR", vendor_id: "${vendor_id}", scope: "APPRAISAL", inspection_start: "2026-06-17T09:00:00Z", inspection_end: "2026-06-17T11:00:00Z" }
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { vasg_id: $.data.id }
            - call: "GET /claims/${claim_id}"
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { v1: $.data.version }
            - call: "POST /reserve-changes"
              payload: { claim_id: "${claim_id}", reserve_type: "INDEMNITY", delta_cents: 600000, reason: "set", expected_claim_version: "${v1}" }
              as: Adjuster
              as_user_id: "${adj_id}"
            - call: "GET /claims/${claim_id}"
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { v2: $.data.version }
            - call: "POST /payments"
              payload: { claim_id: "${claim_id}", payment_type: "INDEMNITY", payee_type: "CLAIMANT", payee_name: "CN", amount_cents: 600000, expected_claim_version: "${v2}" }
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { pay_id: $.data.id }
            - call: "POST /payments/${pay_id}/transition"
              payload: { to_status: "APPROVED" }
              as: Adjuster
              as_user_id: "${adj_id}"
            - call: "POST /payments/${pay_id}/transition"
              payload: { to_status: "ISSUED" }
              as: FinanceOfficer
            - call: "POST /vendor-invoices"
              payload: { claim_id: "${claim_id}", assignment_id: "${vasg_id}", hours: 0, miles: 0, materials_cents: 400000 }
              as: Vendor
              as_user_id: "${vendor_id}"
              captures: { inv_id: $.data.id }
