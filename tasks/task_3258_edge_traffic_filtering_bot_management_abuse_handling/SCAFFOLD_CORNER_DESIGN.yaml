      - call: POST /api/zones
        payload:
          account_id: ${acc}
          domain_name: np.example.com
          onboarding_type: FULL
          origin_host_email: host@provider.example.com
          dns_records:
          - name: www
            record_type: A
            content: 192.0.2.18
            proxied: true
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          zone: $.data.id
      trigger:
      - call: POST /api/zones/${zone}/verify
        payload: {}
        as: NetworkPlanner
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_UNAUTHORIZED (403)
      - Zone.${zone}.status remains PENDING
- section: cross_cutting_layers
  instances:
  - name: clock_advances_ddos_auto_expiry
    claim_type: rate_threshold_triggers
    grounds:
    - state_machines.DdosEvent
    - calculations.dos_mitigation_effective_trigger
    distinguishing_aspect: An ACTIVATED DdosEvent expires automatically when the logical clock reaches activated_at + 4h; the zone's dos_mitigation_active flips false and traffic-hits unfreeze.
    test_recipe:
      setup:
      - PRO account, ACTIVE zone, one ACTIVATED DdosEvent created at 2026-09-01T00:00:00Z (expires 04:00:00Z), one ACTIVE rate-limit rule threshold 2.
      setup_api_calls:
      - call: POST /api/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/accounts
        payload:
          company_name: Pro Corp
          plan_tier: PRO
          account_email: ops@pro.example.com
        as: PlatformAdmin
        captures:
          acc: $.data.id
      - call: POST /api/zones
        payload:
          account_id: ${acc}
          domain_name: ttl.example.com
          onboarding_type: FULL
          origin_host_email: host@provider.example.com
          dns_records:
          - name: www
            record_type: A
            content: 192.0.2.19
            proxied: true
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          zone: $.data.id
      - call: POST /api/zones/${zone}/verify
        payload: {}
        as: ZoneAdmin
        as_user_id: ${acc}
      - call: PATCH /api/zones/${zone}
        payload:
          traffic_rules:
          - name: rl
            rule_kind: RATE_LIMIT
            expression: (p contains /x)
            action: BLOCK
            rate_limit_threshold_rpm: 2
        as: ZoneAdmin
        as_user_id: ${acc}
      - call: POST /api/zones/${zone}/ddos-events
        payload:
          observed_rps: 8000
          baseline_rps: 100
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          evt: $.data.id
      trigger:
      - call: POST /api/zones/${zone}/traffic-hits
        payload:
          occurred_at: '2026-09-01T03:59:59Z'
          client_ip: 198.51.100.60
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          err_frozen: $.data.error_id
      - call: POST /api/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T04:00:00Z'
        as: PlatformAdmin
      - call: GET /api/ddos-events
        payload:
          zone_id: ${zone}
        as: PlatformAdmin
        captures:
          evt_status: $.data[0].status
      - call: POST /api/zones/${zone}/traffic-hits
        payload:
          occurred_at: '2026-09-01T04:00:01Z'
          client_ip: 198.51.100.60
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          hit_after: $.data.triggered_rule_names
      assert:
      - at 03:59:59 the hit is rejected with error_id == ERR_MITIGATION_ACTIVE (event still ACTIVATED 1 second before expiry)
      - after the 04:00:00 advance, GET /api/ddos-events?zone_id=... shows the event ENDED and GET /api/zones/${zone} shows dos_mitigation_active == false
      - the 04:00:01 hit is accepted (triggered_rule_names == [], count 1 below threshold 2)
  - name: fight_mode_challenge_band_respected
    claim_type: conditional_feature_flags
    grounds:
    - calculations.bot_score_action
    - entities.Zone.fields.bot_fight_mode
    distinguishing_aspect: With bot_fight_mode on and no matching band, a score-20 request gets action_taken BLOCK:FIGHT_MODE while a score-50 request gets ALLOW.
    test_recipe:
      setup:
      - PRO account, ACTIVE zone, fight mode toggled on (no bot_action_bands).
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          company_name: Pro Corp
          plan_tier: PRO
          account_email: ops@pro.example.com
        as: PlatformAdmin
        captures:
          acc: $.data.id
      - call: POST /api/zones
        payload:
          account_id: ${acc}
          domain_name: fight.example.com
          onboarding_type: FULL
          origin_host_email: host@provider.example.com
          dns_records:
          - name: www
            record_type: A
            content: 192.0.2.20
            proxied: true
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          zone: $.data.id
      - call: POST /api/zones/${zone}/verify
        payload: {}
        as: ZoneAdmin
        as_user_id: ${acc}
      - call: PATCH /api/zones/${zone}
        payload:
          bot_fight_mode: true
        as: ZoneAdmin
        as_user_id: ${acc}
      trigger:
      - call: POST /api/zones/${zone}/bot-classifications
        payload:
          request_fingerprint: fp-9
          verified_crawler: false
          client_ip: 203.0.113.70
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          sc_low: $.data.bot_score
          act_low: $.data.action_taken
      - call: POST /api/zones/${zone}/bot-classifications
        payload:
          request_fingerprint: fp-jz9
          verified_crawler: false
          client_ip: 203.0.113.71
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          sc_mid: $.data.bot_score
          act_mid: $.data.action_taken
      assert:
      - bot_score == 20 and action_taken == "BLOCK:FIGHT_MODE" (score in [1,29] with fight mode on)
      - bot_score == 50 and action_taken == "ALLOW" (score above the fight-mode band, no config match)
- section: consistency_model
  instances:
  - name: immediate_consistency_of_cascade_side_effects
    claim_type: immediate
    grounds:
    - state_machines.Zone.ACTIVE_to_MOVED
    distinguishing_aspect: Under immediate consistency, the clock advance that detects delegation drift moves the zone to MOVED and disables both rules atomically — the very next zone read shows the cascade
      complete.
    test_recipe:
      setup:
      - PRO account, ACTIVE zone, two ACTIVE firewall rules.
      setup_api_calls:
      - call: POST /api/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/accounts
        payload:
          company_name: Pro Corp
          plan_tier: PRO
          account_email: ops@pro.example.com
        as: PlatformAdmin
        captures:
          acc: $.data.id
      - call: POST /api/zones
        payload:
          account_id: ${acc}
          domain_name: imm.example.com
          onboarding_type: FULL
          origin_host_email: host@provider.example.com
          dns_records:
          - name: www
            record_type: A
            content: 192.0.2.21
            proxied: true
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          zone: $.data.id
      - call: POST /api/zones/${zone}/verify
        payload: {}
        as: ZoneAdmin
        as_user_id: ${acc}
      - call: PATCH /api/zones/${zone}
        payload:
          traffic_rules:
          - name: r1
            rule_kind: FIREWALL_FILTER
            expression: (p contains /a)
            action: BLOCK
          - name: r2
            rule_kind: FIREWALL_FILTER
            expression: (p contains /b)
            action: ALLOW
        as: ZoneAdmin
        as_user_id: ${acc}
      trigger:
      - call: PATCH /api/zones/${zone}
        payload:
          dns_records:
          - name: www
            record_type: A
            content: 192.0.2.21
            proxied: false
        as: ZoneAdmin
        as_user_id: ${acc}
      - call: POST /api/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:01:00Z'
        as: PlatformAdmin
      - call: GET /api/zones/${zone}
        payload: {}
        as: PlatformAdmin
        captures:
          st: $.data.status
          rules: $.data.traffic_rules
      assert:
      - the read after the clock advance shows status == MOVED
      - the same read shows both traffic_rules items already DISABLED — the cascade is visible with no reconciliation delay
