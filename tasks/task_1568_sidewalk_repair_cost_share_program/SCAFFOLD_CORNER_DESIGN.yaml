      - name: prior_notice_reference_must_be_void
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_INVALID_NOTICE_REFERENCE]
          - entities.RepairNotice.fields.prior_notice_id
        distinguishing_aspect: |
