# =============================================================================
# SCAFFOLD — Parks & Recreation Facility Reservation (Expert band)
# §1.0–§1.7 only. Difficulty/Corner designs live in sibling files.
# =============================================================================

scenario: |
  252. Parks & Recreation Facility Reservation: facility inventory (field/court/pool/pavilion),
  permit application, resident vs non-resident pricing, recurring league booking, double-booking
  conflict, deposit & insurance (COI), cancellation/refund, prime-slot lottery

domain_name: parks-rec-reservation
api_prefix: /
# Flat/hybrid topology: top-level peer collections (/facilities, /patrons, /permits,
# /leagues, /insurance-certificates, /payments, /refunds, /lottery-rounds,
# /lottery-entries) linked by FK, plus a Facility-nested permit sub-collection.

# -----------------------------------------------------------------------------
# Complexity profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency        # OCC on Facility.version for permit-grant supersede races
    - cascading_side_effects        # league cancel -> child permits -> deposit holds -> refunds
    - dual_variant_calculation      # provisional quote at application vs final charge at grant; estimated vs actual refund
    - scheduled_actions             # lottery draw at a future close time; COI expiry sweep via clock advance

  entity_topology: hybrid
  # League -> Permit is a parent/child generation relationship (hierarchical),
  # while Facility, Patron, Permit, COI, Payment, Refund, LotteryRound link by FK (flat/cross-aggregate).

  state_machine_shape: branching
  # Permit: APPLIED -> {GRANTED, WAITLISTED, DENIED} with divergent side-effects;
  # LeagueSeries fork-joins over its child permits; LotteryEntry branches WON/LOST.

  relationship_patterns:
    - one_to_many          # Facility has many Permits; LeagueSeries has many Permits; Patron has many COIs
    - cross_aggregate      # Permit references Facility, Patron, COI, LeagueSeries, LotteryRound
    - many_to_many         # LotteryRound <-> Patron junction via LotteryEntry

  role_model: peer_roles
  # Patron owns their own permits/COIs/entries; RecCoordinator runs grants, lotteries, ops sweeps;
  # FinanceClerk owns payments and refunds. Each role owns distinct resource types.

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---------------------------------------------------------------------------
  - name: Patron
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Patron legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across patrons" }
      - { name: residency, type: enum, source: input, description: "RESIDENT | NON_RESIDENT", constraints: "one of RESIDENT, NON_RESIDENT" }
      - { name: residency_verified, type: boolean, source: system, description: "True once an address proof was accepted; RESIDENT pricing requires this", default: false }
      - { name: standing, type: enum, source: computed, description: "GOOD | PROBATION | BARRED — gates new applications", constraints: "one of GOOD, PROBATION, BARRED", default: GOOD }
      - { name: no_show_strikes, type: integer, source: computed, description: "Count of NO_SHOW permits in trailing window; drives standing", default: 0 }
      - { name: wallet_credit_cents, type: integer, source: computed, description: "Refund credits retained on account when refund_destination=CREDIT", default: 0 }

  # ---------------------------------------------------------------------------
  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Facility name" }
      - { name: facility_type, type: enum, source: input, description: "FIELD | COURT | POOL | PAVILION", constraints: "one of FIELD, COURT, POOL, PAVILION" }
      - { name: status, type: enum, source: computed, description: "OPEN | CLOSED — CLOSED blocks new grants", constraints: "one of OPEN, CLOSED", default: OPEN }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Base non-resident hourly rate in cents" }
      - { name: resident_discount_pct, type: number, source: input, description: "Fractional discount applied for verified residents, e.g. 0.40", constraints: "0 <= x < 1" }
      - { name: prime_multiplier, type: number, source: input, description: "Multiplier applied to hours that fall in the prime window, e.g. 1.5" }
      - { name: prime_start_hour, type: integer, source: input, description: "Prime window start hour [0,24)", constraints: "0 <= x < 24" }
      - { name: prime_end_hour, type: integer, source: input, description: "Prime window end hour (exclusive) (prime_start_hour, 24]", constraints: "prime_start_hour < x <= 24" }
      - { name: buffer_minutes, type: integer, source: input, description: "Mandatory gap enforced between two granted permits on this facility (turnover/cleaning)", default: 0 }
      - { name: deposit_cents, type: integer, source: input, description: "Refundable security deposit required to grant a permit here", default: 0 }
      - { name: requires_coi, type: boolean, source: input, description: "True when a valid COI must be on file at grant time", default: false }
      - { name: min_coi_coverage_cents, type: integer, source: input, description: "Minimum COI coverage_amount_cents required when requires_coi", default: 0 }
      - { name: granted_permit_count, type: integer, source: computed, description: "Count of permits on this facility currently in GRANTED state", default: 0 }

  # ---------------------------------------------------------------------------
  - name: InsuranceCertificate
    parent: null
    common_fields: true
    fields:
      - { name: patron_id, type: string, source: input, description: "FK -> Patron.id; owning patron" }
      - { name: coverage_amount_cents, type: integer, source: input, description: "Liability coverage limit in cents" }
      - { name: effective_date, type: datetime, source: input, description: "Coverage start (ISO 8601)" }
      - { name: expiry_date, type: datetime, source: input, description: "Coverage end (ISO 8601); compared against permit start" }
      - { name: status, type: enum, source: computed, description: "ACTIVE | EXPIRED | REVOKED", constraints: "one of ACTIVE, EXPIRED, REVOKED", default: ACTIVE }

  # ---------------------------------------------------------------------------
  - name: LeagueSeries
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; target facility for every occurrence" }
      - { name: patron_id, type: string, source: input, description: "FK -> Patron.id; organizing patron" }
      - { name: coi_id, type: string, source: input, description: "FK -> InsuranceCertificate.id; COI pinned for the whole series, null if facility does not require one" }
      - { name: weekday, type: integer, source: input, description: "Day of week for each occurrence, 0=Mon..6=Sun", constraints: "0 <= x <= 6" }
      - { name: start_hour, type: integer, source: input, description: "Occurrence start hour [0,24)", constraints: "0 <= x < 24" }
      - { name: duration_minutes, type: integer, source: input, description: "Occurrence duration in minutes", constraints: "x > 0" }
      - { name: first_date, type: datetime, source: input, description: "Date of first occurrence (ISO 8601, midnight UTC)" }
      - { name: occurrences, type: integer, source: input, description: "Number of weekly occurrences to generate", constraints: "1 <= x <= 26" }
      - { name: status, type: enum, source: computed, description: "PENDING | PARTIALLY_GRANTED | GRANTED | CANCELLED", constraints: "one of PENDING, PARTIALLY_GRANTED, GRANTED, CANCELLED", default: PENDING }
      - { name: granted_occurrence_count, type: integer, source: computed, description: "Count of child permits currently in GRANTED state", default: 0 }
      - { name: conflicted_occurrence_count, type: integer, source: computed, description: "Count of child permits in WAITLISTED or DENIED state", default: 0 }

  # ---------------------------------------------------------------------------
  - name: Permit
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; reserved facility" }
      - { name: patron_id, type: string, source: input, description: "FK -> Patron.id; applicant" }
      - { name: coi_id, type: string, source: input, description: "FK -> InsuranceCertificate.id; COI presented for this permit, null when facility does not require one" }
      - { name: league_id, type: string, source: system, description: "FK -> LeagueSeries.id; set when this permit was generated by a league series, else null" }
      - { name: lottery_round_id, type: string, source: system, description: "FK -> LotteryRound.id; set when this permit was granted via a lottery win, else null" }
      - { name: start_at, type: datetime, source: input, description: "Reservation start (ISO 8601 UTC)" }
      - { name: end_at, type: datetime, source: input, description: "Reservation end (ISO 8601 UTC, exclusive)" }
      - { name: is_prime_requested, type: boolean, source: computed, description: "True when [start_at,end_at) overlaps the facility prime window", default: false }
      - { name: status, type: enum, source: computed, description: "APPLIED | GRANTED | WAITLISTED | DENIED | CANCELLED | COMPLETED | NO_SHOW", constraints: "one of APPLIED, GRANTED, WAITLISTED, DENIED, CANCELLED, COMPLETED, NO_SHOW", default: APPLIED }
      - { name: pricing_residency, type: enum, source: computed, description: "Residency tier locked at application time: RESIDENT or NON_RESIDENT", constraints: "one of RESIDENT, NON_RESIDENT" }
      - { name: quoted_fee_cents, type: integer, source: computed, description: "Provisional usage fee computed at application (forward-looking estimate)", default: 0 }
      - { name: final_fee_cents, type: integer, source: computed, description: "Usage fee charged at grant time (chronological/actual), null until granted" }
      - { name: deposit_held_cents, type: integer, source: computed, description: "Deposit amount held on grant, released on completion/cancel per refund policy", default: 0 }
      - { name: refunded_cents, type: integer, source: computed, description: "Total refunded across fee + deposit for this permit", default: 0 }
      - { name: cancelled_lead_hours, type: number, source: computed, description: "Hours between cancellation time and start_at; drives refund tier, null until cancelled" }

  # ---------------------------------------------------------------------------
  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: permit_id, type: string, source: input, description: "FK -> Permit.id; the permit this payment funds" }
      - { name: fee_component_cents, type: integer, source: input, description: "Usage fee portion paid" }
      - { name: deposit_component_cents, type: integer, source: input, description: "Security deposit portion paid" }
      - { name: status, type: enum, source: computed, description: "AUTHORIZED | CAPTURED | VOIDED", constraints: "one of AUTHORIZED, CAPTURED, VOIDED", default: AUTHORIZED }

  # ---------------------------------------------------------------------------
  - name: Refund
    parent: null
    common_fields: true
    fields:
      - { name: permit_id, type: string, source: input, description: "FK -> Permit.id; permit being refunded" }
      - { name: payment_id, type: string, source: input, description: "FK -> Payment.id; source captured payment" }
      - { name: refund_destination, type: enum, source: input, description: "ORIGINAL | CREDIT — ORIGINAL reverses the card, CREDIT adds to wallet_credit_cents", constraints: "one of ORIGINAL, CREDIT" }
      - { name: fee_refund_cents, type: integer, source: computed, description: "Fee portion refunded per cancellation tier", default: 0 }
      - { name: deposit_refund_cents, type: integer, source: computed, description: "Deposit portion refunded (full unless forfeited)", default: 0 }
      - { name: total_refund_cents, type: integer, source: computed, description: "fee_refund_cents + deposit_refund_cents", default: 0 }

  # ---------------------------------------------------------------------------
  - name: LotteryRound
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; facility whose prime slot is allocated" }
      - { name: slot_start_at, type: datetime, source: input, description: "Prime slot start (ISO 8601 UTC)" }
      - { name: slot_end_at, type: datetime, source: input, description: "Prime slot end (ISO 8601 UTC, exclusive)" }
      - { name: opens_at, type: datetime, source: input, description: "Entry window opens (ISO 8601 UTC)" }
      - { name: closes_at, type: datetime, source: input, description: "Entry window closes; draw eligible only after current clock >= closes_at" }
      - { name: status, type: enum, source: computed, description: "OPEN | DRAWN | CANCELLED", constraints: "one of OPEN, DRAWN, CANCELLED", default: OPEN }
      - { name: entry_count, type: integer, source: computed, description: "Number of LotteryEntry rows in ENTERED state", default: 0 }
      - { name: winning_entry_id, type: string, source: computed, description: "Id of the LotteryEntry selected as winner on draw (the WON entry on this same round); null until DRAWN. Resolve via GET /lottery-rounds/{id}/entries and filter status==WON; not a child-FK needing reverse lookup." }

  # ---------------------------------------------------------------------------
  - name: LotteryEntry
    parent: null
    common_fields: true
    fields:
      - { name: lottery_round_id, type: string, source: input, description: "FK -> LotteryRound.id; round entered" }
      - { name: patron_id, type: string, source: input, description: "FK -> Patron.id; entrant" }
      - { name: priority_weight, type: integer, source: computed, description: "Selection weight: RESIDENT verified=2, else 1; lower entry seq breaks ties", default: 1 }
      - { name: entry_seq, type: integer, source: system, description: "Monotonic per-round sequence assigned on entry; deterministic tie-break (ascending)" }
      - { name: status, type: enum, source: computed, description: "ENTERED | WON | LOST | WITHDRAWN", constraints: "one of ENTERED, WON, LOST, WITHDRAWN", default: ENTERED }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  - entity: Permit
    field: status
    initial_state: APPLIED
    terminal_states: [DENIED, CANCELLED, COMPLETED, NO_SHOW]
    transitions:
      - from: APPLIED
        to: GRANTED
        trigger: "POST /facilities/{facility_id}/permits/{permit_id}/grant"
        actor: RecCoordinator
        preconditions:
          - "Facility.status == OPEN"
          - "Patron.standing IN {GOOD, PROBATION}"
          - "No GRANTED permit on the same facility whose [start_at - buffer, end_at + buffer) overlaps this permit's [start_at, end_at) (ERR_DOUBLE_BOOKING)"
          - "If Facility.requires_coi: coi_id present, its InsuranceCertificate.status == ACTIVE, coverage_amount_cents >= Facility.min_coi_coverage_cents, and expiry_date > Permit.start_at (ERR_COI_REQUIRED / ERR_COI_INSUFFICIENT)"
          - "A CAPTURED Payment exists for this permit covering final_fee_cents + Facility.deposit_cents (ERR_PAYMENT_REQUIRED)"
        side_effects:
          - "Compute final_fee_cents via final_grant_fee (chronological/actual) and overwrite the provisional quoted_fee_cents reference"
          - "deposit_held_cents = Facility.deposit_cents"
          - "Facility.granted_permit_count += 1"
          - "If league_id set: recompute LeagueSeries.granted_occurrence_count and roll up LeagueSeries.status (bubble up)"
          - "increments Facility.version by 1"

      - from: APPLIED
        to: WAITLISTED
        trigger: "POST /facilities/{facility_id}/permits/{permit_id}/grant with on_conflict=WAITLIST when a buffer-expanded GRANTED permit overlaps this window"
        actor: RecCoordinator
        preconditions:
          - "Facility.status == OPEN"
          - "Patron.standing IN {GOOD, PROBATION}"
          - "A GRANTED permit's buffer-expanded window overlaps this permit AND the request carried on_conflict=WAITLIST"
          - "NOTE: COI and Payment are NOT required for the WAITLISTED outcome — those gates apply only when the permit is placed into GRANTED"
        side_effects:
          - "Permit retains its quoted_fee_cents; no final_fee_cents set; no deposit held; no facility count change; Facility.version NOT bumped"
          - "If league_id set: LeagueSeries.conflicted_occurrence_count += 1 and status rolls to PARTIALLY_GRANTED"

      - from: APPLIED
        to: DENIED
        trigger: "POST /facilities/{facility_id}/permits/{permit_id}/deny"
        actor: RecCoordinator
        preconditions:
          - "Permit.status == APPLIED"
        side_effects:
          - "If a CAPTURED Payment exists, it is VOIDED and fully reversed (compensation, no cancellation fee)"
          - "If league_id set: LeagueSeries.conflicted_occurrence_count += 1 and status rolls to PARTIALLY_GRANTED"

      - from: WAITLISTED
        to: GRANTED
        trigger: "POST /facilities/{facility_id}/permits/{permit_id}/grant (after the blocking permit freed its slot)"
        actor: RecCoordinator
        preconditions:
          - "No GRANTED permit overlaps [start_at - buffer, end_at + buffer) any longer"
          - "Same COI + payment preconditions as APPLIED->GRANTED"
        side_effects:
          - "Same grant side-effects as APPLIED->GRANTED"
          - "If league_id set: conflicted_occurrence_count -= 1, granted_occurrence_count += 1, status re-rolled"
          - "increments Facility.version by 1"

      - from: GRANTED
        to: CANCELLED
        trigger: "POST /facilities/{facility_id}/permits/{permit_id}/cancel"
        actor: "Patron or RecCoordinator"
        preconditions:
          - "current clock < Permit.start_at (cannot cancel a started/past reservation; use no-show/complete) (ERR_INVALID_STATE)"
        side_effects:
          - "Set cancelled_lead_hours = (start_at - current_clock) in hours"
          - "Compute cancellation refund via cancellation_refund; create a Refund; set refunded_cents"
          - "Forfeited deposit (lead < FORFEIT_LEAD_HOURS) stays captured; refundable portion reverses"
          - "Facility.granted_permit_count -= 1"
          - "If a WAITLISTED permit on the same facility now fits the freed window, it remains WAITLISTED until an explicit grant call (no auto-promote)"
          - "If league_id set: granted_occurrence_count -= 1, status re-rolled"
          - "increments Facility.version by 1"

      - from: APPLIED
        to: CANCELLED
        trigger: "POST /facilities/{facility_id}/permits/{permit_id}/cancel"
        actor: "Patron or RecCoordinator"
        preconditions:
          - "Permit.status == APPLIED (never granted; nothing captured)"
        side_effects:
          - "Full reversal of any AUTHORIZED payment; refunded_cents stays 0 (no fee was ever captured)"

      - from: GRANTED
        to: COMPLETED
        trigger: "POST /facilities/{facility_id}/permits/{permit_id}/complete"
        actor: RecCoordinator
        preconditions:
          - "current clock >= Permit.end_at"
        side_effects:
          - "Release deposit_held_cents back to patron in full (create a Refund with deposit_refund_cents == deposit_held_cents, fee_refund_cents == 0)"
          - "Facility.granted_permit_count -= 1"
          - "increments Facility.version by 1"

      - from: GRANTED
        to: NO_SHOW
        trigger: "POST /facilities/{facility_id}/permits/{permit_id}/no-show"
        actor: RecCoordinator
        preconditions:
          - "current clock >= Permit.end_at"
        side_effects:
          - "Forfeit deposit_held_cents entirely (no Refund created)"
          - "Patron.no_show_strikes += 1; recompute Patron.standing (>= PROBATION_STRIKES -> PROBATION; >= BARRED_STRIKES -> BARRED)"
          - "Facility.granted_permit_count -= 1"
          - "increments Facility.version by 1"

  # ---------------------------------------------------------------------------
  - entity: LeagueSeries
    field: status
    initial_state: PENDING
    terminal_states: [CANCELLED]
    note: "Compound/bubble-up: status derived from child Permit states; CANCELLED is the only manually-terminal state."
    transitions:
      - from: PENDING
        to: PARTIALLY_GRANTED
        trigger: "system (bubble up: at least one child GRANTED and at least one child WAITLISTED/DENIED)"
        actor: system
        preconditions:
          - "0 < granted_occurrence_count < occurrences AND conflicted_occurrence_count > 0"
        side_effects: []

      - from: [PENDING, PARTIALLY_GRANTED]
        to: GRANTED
        trigger: "system (bubble up: every child Permit is GRANTED)"
        actor: system
        preconditions:
          - "granted_occurrence_count == occurrences"
        side_effects: []

      - from: [PENDING, PARTIALLY_GRANTED, GRANTED]
        to: CANCELLED
        trigger: "POST /leagues/{league_id}/cancel"
        actor: "Patron or RecCoordinator"
        preconditions:
          - "LeagueSeries.status != CANCELLED"
        side_effects:
          - "Cascade down: every child Permit not already terminal -> CANCELLED via the permit cancel path (APPLIED->CANCELLED full reverse; GRANTED->CANCELLED with cancellation_refund and deposit handling)"
          - "Each cascaded GRANTED->CANCELLED itself triggers a Refund creation and a Facility.granted_permit_count decrement (transitive)"

  # ---------------------------------------------------------------------------
  - entity: LotteryRound
    field: status
    initial_state: OPEN
    terminal_states: [DRAWN, CANCELLED]
    transitions:
      - from: OPEN
        to: DRAWN
        trigger: "POST /lottery-rounds/{lottery_round_id}/draw"
        actor: RecCoordinator
        preconditions:
          - "current clock >= LotteryRound.closes_at (ERR_LOTTERY_NOT_CLOSED)"
          - "entry_count >= 1 (ERR_LOTTERY_NO_ENTRIES)"
          - "No GRANTED permit already occupies [slot_start_at, slot_end_at) on the facility (ERR_DOUBLE_BOOKING)"
        side_effects:
          - "Select winner by lottery_selection (max priority_weight, tie-break lowest entry_seq); set winning_entry_id"
          - "Winning LotteryEntry -> WON (cross-entity); all other ENTERED entries -> LOST"
          - "Cross-entity: synthesize a GRANTED Permit for the winner on [slot_start_at, slot_end_at) with lottery_round_id set, final_fee_cents via final_grant_fee, deposit_held_cents = Facility.deposit_cents (transitive: Facility.granted_permit_count += 1)"
          - "increments Facility.version by 1"

      - from: OPEN
        to: CANCELLED
        trigger: "POST /lottery-rounds/{lottery_round_id}/cancel"
        actor: RecCoordinator
        preconditions:
          - "LotteryRound.status == OPEN"
        side_effects:
          - "All ENTERED entries -> WITHDRAWN; no permit synthesized"

  # ---------------------------------------------------------------------------
  - entity: LotteryEntry
    field: status
    initial_state: ENTERED
    terminal_states: [WON, LOST, WITHDRAWN]
    transitions:
      - from: ENTERED
        to: WITHDRAWN
        trigger: "POST /lottery-entries/{lottery_entry_id}/withdraw"
        actor: "Patron or RecCoordinator"
        preconditions:
          - "Parent LotteryRound.status == OPEN (ERR_INVALID_STATE)"
        side_effects:
          - "LotteryRound.entry_count -= 1"
      - from: ENTERED
        to: WON
        trigger: "system (round draw selects this entry)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ENTERED
        to: LOST
        trigger: "system (round draw selects a different entry)"
        actor: system
        preconditions: []
        side_effects: []

  # ---------------------------------------------------------------------------
  - entity: InsuranceCertificate
    field: status
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (ops sweep: current clock >= expiry_date)"
        actor: system
        preconditions:
          - "current clock >= expiry_date"
        side_effects:
          - "Cross-entity: every GRANTED Permit pinning this COI whose start_at is still in the future and whose facility requires_coi -> the permit is flagged; no automatic cancel (audit only)"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /insurance-certificates/{coi_id}/revoke"
        actor: RecCoordinator
        preconditions:
          - "InsuranceCertificate.status == ACTIVE"
        side_effects: []

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: permit-grant-stale-facility
    parent_entity: Facility
    write_endpoint: "POST /facilities/{facility_id}/permits/{permit_id}/grant"
    occ_field: "expected_facility_version"
    description: |
      Granting a permit against a Facility whose version has advanced since the
      client last observed it is rejected with a stale-version error. This
      captures the case where another grant (or a lottery draw) has just placed a
      permit into the same prime window — legitimately consuming the slot under
      the double-booking rule — so the current grantor's view of the facility is
      out of date. The loser's expected_facility_version no longer matches.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: lottery-draw-stale-facility
    parent_entity: Facility
    write_endpoint: "POST /lottery-rounds/{lottery_round_id}/draw"
    occ_field: "expected_facility_version"
    description: |
      Drawing a lottery round against a Facility whose version has advanced since
      the client last read it is rejected. Another grant may have just occupied
      the prime slot the round allocates; the draw's view of facility occupancy is
      stale, so its expected_facility_version mismatches and the draw is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: prime_overlap_hours
    trigger: "permit application (POST .../permits) and lottery permit synthesis"
    algorithm: interval_merge
    formula: |
      # Split the requested [start_at, end_at) into prime and non-prime portions
      # against the facility's daily prime window [prime_start_hour, prime_end_hour).
      # Prime window is interpreted per calendar day in UTC; a multi-hour booking
      # may straddle the boundary.
      total_hours       = (end_at - start_at) / 3600 seconds
      prime_hours       = hours of [start_at, end_at) whose wall-clock hour h satisfies
                          prime_start_hour <= h < prime_end_hour   # half-open, strictly < end
      non_prime_hours   = total_hours - prime_hours
      is_prime_requested = (prime_hours > 0)
    input_set: "Single permit's own [start_at, end_at) and parent facility prime window."
    precision: "hours kept as exact rationals; only the final cents amount is rounded"
    constants: {}

  - name: provisional_quote_fee
    trigger: "permit application (POST .../permits) — forward-looking estimate before grant"
    algorithm: forward_looking
    formula: |
      # FORWARD-LOOKING: residency tier is taken from the PATRON's CURRENT residency
      # snapshot at application time, and prime hours are the full REQUESTED window.
      # Rounding order is PINNED: round each component (non-prime, prime) to whole
      # cents independently, THEN sum (round-per-component-then-sum).
      pricing_residency = (Patron.residency == RESIDENT and Patron.residency_verified) ? RESIDENT : NON_RESIDENT
      eff_rate = Facility.hourly_rate_cents
      if pricing_residency == RESIDENT:
          eff_rate = Facility.hourly_rate_cents * (1 - Facility.resident_discount_pct)
      nonprime_cents = round_half_up(non_prime_hours * eff_rate)
      prime_cents    = round_half_up(prime_hours * eff_rate * Facility.prime_multiplier)
      quoted_fee_cents = nonprime_cents + prime_cents
    input_set: "non_prime_hours / prime_hours from prime_overlap_hours; patron residency snapshot at apply time."
    precision: "round_half_up to whole cents PER COMPONENT, then sum (order pinned)"
    constants: {}
    variants:
      - name: forward_looking_provisional
        when: "at application time"
        difference: "Uses residency snapshot at apply time; window is the requested window; this is an ESTIMATE persisted as quoted_fee_cents."

  - name: final_grant_fee
    trigger: "permit grant (APPLIED->GRANTED, WAITLISTED->GRANTED) and lottery permit synthesis"
    algorithm: chronological
    formula: |
      # CHRONOLOGICAL / ACTUAL: re-resolve residency tier from the patron's residency
      # snapshot AS OF THE GRANT MOMENT (residency_verified may have flipped between
      # apply and grant), recompute prime/non-prime hours, and PIN A DIFFERENT
      # ROUNDING ORDER: sum the raw component amounts THEN round once
      # (sum-then-round). This is the dual-variant divergence vs provisional_quote_fee.
      pricing_residency_final = (Patron.residency == RESIDENT and Patron.residency_verified at grant) ? RESIDENT : NON_RESIDENT
      eff_rate = (pricing_residency_final == RESIDENT)
                   ? Facility.hourly_rate_cents * (1 - Facility.resident_discount_pct)
                   : Facility.hourly_rate_cents
      raw = (non_prime_hours * eff_rate) + (prime_hours * eff_rate * Facility.prime_multiplier)
      final_fee_cents = round_half_up(raw)   # SINGLE rounding at the end
    input_set: "Same hours, but residency re-resolved at grant; sum-then-round."
    precision: "round_half_up to whole cents ONCE after summing (order pinned, differs from provisional)"
    constants: {}
    variants:
      - name: chronological_final
        when: "at grant time"
        difference: "Residency re-resolved at grant; sum-then-round (single rounding) vs provisional's round-per-component-then-sum. Identical inputs can yield a different cents total."

  - name: cancellation_refund
    trigger: "GRANTED->CANCELLED (permit cancel, and league-cancel cascade)"
    algorithm: tiered_pricing
    formula: |
      # Multi-factor refund keyed on lead time (hours before start_at) AND whether
      # the deposit is forfeited. Tier boundaries are HALF-OPEN on the high side.
      lead = cancelled_lead_hours = (start_at - current_clock) / 3600
      # Fee refund tier (percent of final_fee_cents):
      if lead >= FULL_REFUND_LEAD_HOURS:        fee_pct = 1.00
      elif lead >= PARTIAL_REFUND_LEAD_HOURS:   fee_pct = 0.50
      else:                                      fee_pct = 0.00
      fee_refund_cents = round_half_up(final_fee_cents * fee_pct)
      # Deposit: refunded in full UNLESS lead < FORFEIT_LEAD_HOURS (late cancel forfeits deposit)
      deposit_refund_cents = (lead >= FORFEIT_LEAD_HOURS) ? deposit_held_cents : 0
      total_refund_cents = fee_refund_cents + deposit_refund_cents
    input_set: "Single permit: final_fee_cents, deposit_held_cents, lead time at cancel."
    precision: "round_half_up to whole cents on fee_refund_cents"
    constants:
      FULL_REFUND_LEAD_HOURS: 168     # >= 7 days => full fee refund
      PARTIAL_REFUND_LEAD_HOURS: 48   # >= 2 days and < 7 days => 50% fee refund
      FORFEIT_LEAD_HOURS: 24          # < 1 day => deposit forfeited
    variants:
      - name: estimated_refund_preview
        when: "GET /permits/{id}/refund-preview before cancelling"
        difference: "Preview uses current_clock at preview time (estimate); actual refund uses current_clock at the cancel mutation. Lead can cross a tier boundary between preview and commit, diverging the numbers."

  - name: patron_standing
    trigger: "GRANTED->NO_SHOW (no_show_strikes increment) and ops sweep"
    algorithm: threshold
    formula: |
      # Threshold cascade on trailing no-show strikes. Boundaries pinned with >=.
      if no_show_strikes >= BARRED_STRIKES:        standing = BARRED
      elif no_show_strikes >= PROBATION_STRIKES:   standing = PROBATION
      else:                                         standing = GOOD
    input_set: "Patron.no_show_strikes (computed count of NO_SHOW permits)."
    precision: "integer comparison"
    constants:
      PROBATION_STRIKES: 2   # >= 2 no-shows => PROBATION (new applications allowed, no grants on prime)
      BARRED_STRIKES: 4      # >= 4 no-shows => BARRED (cannot apply or be granted)

  - name: lottery_selection
    trigger: "lottery round draw (OPEN->DRAWN)"
    algorithm: weighted_scoring
    formula: |
      # Among ENTERED entries, pick the winner deterministically (no randomness in
      # the observable result — selection is by weight then sequence).
      candidates = entries where status == ENTERED
      winner = argmax over candidates by:
                 1) priority_weight DESC   (RESIDENT verified=2 beats NON_RESIDENT/unverified=1)
                 2) entry_seq ASC          (earliest entrant wins ties; entry_seq is the deterministic tie-break)
      # entry_seq is a monotonic per-round counter, NOT the random id.
    input_set: "All LotteryEntry rows for the round with status == ENTERED."
    precision: "integer comparison; deterministic argmax"
    constants:
      WEIGHT_RESIDENT_VERIFIED: 2
      WEIGHT_DEFAULT: 1

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path/body resource id resolves, validated left-to-right in the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "Acting entity_backed Patron owns the targeted permit/COI/entry when the operation is patron-scoped"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Patron-initiated cancel, withdraw, COI create"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_constraint
    check: "OCC: expected_facility_version matches Facility.version on grant / draw"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST .../grant, POST .../draw"

  - priority: 7
    category: business_safety
    check: "Patron.standing != BARRED on apply and on grant (BARRED cannot apply or be granted)"
    error_id: ERR_PATRON_BARRED
    http_status: 403
    applies_to: "POST .../permits, POST .../grant"

  - priority: 8
    category: business_safety
    check: "If Facility.requires_coi at grant: coi_id present, COI ACTIVE, coverage >= min_coi_coverage_cents, expiry_date > start_at"
    error_id: ERR_COI_REQUIRED
    http_status: 422
    applies_to: "POST .../grant"

  - priority: 9
    category: business_safety
    check: "If a COI is presented but coverage_amount_cents < Facility.min_coi_coverage_cents OR expiry_date <= start_at"
    error_id: ERR_COI_INSUFFICIENT
    http_status: 422
    applies_to: "POST .../grant"

  - priority: 10
    category: business_temporal
    check: "Permit window is well-formed: start_at < end_at, both in the future relative to current clock at apply"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST .../permits, league create"

  - priority: 11
    category: business_temporal
    check: "Grant double-booking: no GRANTED permit on the same facility whose buffer-expanded window overlaps; lottery draw: no GRANTED permit overlaps the slot. If on_conflict=WAITLIST is supplied AND a conflict exists, the grant short-circuits to the WAITLISTED outcome (no ERR_DOUBLE_BOOKING, and the COI/payment checks at priority 8/9/15 are SKIPPED because the permit is not being placed into GRANTED)."
    error_id: ERR_DOUBLE_BOOKING
    http_status: 409
    applies_to: "POST .../grant (without on_conflict=WAITLIST), POST .../draw"

  - priority: 12
    category: business_constraint
    check: "PROBATION patron cannot be granted a permit whose window is_prime_requested (prime-slot restriction)"
    error_id: ERR_PROBATION_PRIME_BLOCKED
    http_status: 403
    applies_to: "POST .../grant"

  - priority: 13
    category: business_constraint
    check: "Lottery draw requires current clock >= closes_at and entry_count >= 1"
    error_id: ERR_LOTTERY_NOT_CLOSED
    http_status: 409
    applies_to: "POST .../draw"

  - priority: 14
    category: business_referential
    check: "A patron may hold at most one ENTERED LotteryEntry per LotteryRound (duplicate entry rejected)"
    error_id: ERR_DUPLICATE_ENTRY
    http_status: 409
    applies_to: "POST /lottery-rounds/{id}/entries"

  - priority: 15
    category: business_fiscal
    check: "Grant into GRANTED requires a CAPTURED Payment covering final_fee_cents + Facility.deposit_cents. Not checked when the grant resolves to the WAITLISTED outcome (see priority 11)."
    error_id: ERR_PAYMENT_REQUIRED
    http_status: 422
    applies_to: "POST .../grant (when outcome would be GRANTED)"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Patron ---
  - method: POST
    path: "/patrons"
    description: "Register a patron"
    roles: [RecCoordinator, Patron]
    code: 201
    input: [full_name, email, residency]
    output: Patron
    side_effects: ["standing=GOOD, residency_verified=false, no_show_strikes=0, wallet_credit_cents=0"]

  - method: GET
    path: "/patrons/{patron_id}"
    description: "Get a patron"
    roles: [RecCoordinator, Patron, FinanceClerk]
    code: 200
    input: []
    output: Patron
    side_effects: []

  - method: POST
    path: "/patrons/{patron_id}/verify-residency"
    description: "Mark a patron's residency proof accepted (enables RESIDENT pricing/weight)"
    roles: [RecCoordinator]
    code: 200
    input: []
    output: Patron
    side_effects: ["residency_verified=true (only meaningful when residency==RESIDENT)"]

  - method: GET
    path: "/patrons/{patron_id}/permits"
    description: "List a patron's permits (reverse-reachability for Permit.patron_id)"
    roles: [RecCoordinator, Patron, FinanceClerk]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Permit[]
    side_effects: []

  - method: GET
    path: "/patrons/{patron_id}/insurance-certificates"
    description: "List a patron's COIs (reverse-reachability for InsuranceCertificate.patron_id)"
    roles: [RecCoordinator, Patron]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: InsuranceCertificate[]
    side_effects: []

  # --- Facility ---
  - method: POST
    path: "/facilities"
    description: "Create a facility (inventory item)"
    roles: [RecCoordinator]
    code: 201
    input: [name, facility_type, hourly_rate_cents, resident_discount_pct, prime_multiplier, prime_start_hour, prime_end_hour, "buffer_minutes?", "deposit_cents?", "requires_coi?", "min_coi_coverage_cents?"]
    output: Facility
    side_effects: ["status=OPEN, granted_permit_count=0, version=1"]

  - method: GET
    path: "/facilities/{facility_id}"
    description: "Get a facility"
    roles: [RecCoordinator, Patron, FinanceClerk]
    code: 200
    input: []
    output: Facility
    side_effects: []

  - method: PATCH
    path: "/facilities/{facility_id}"
    description: "Update facility status/config (e.g. close for maintenance)"
    roles: [RecCoordinator]
    code: 200
    input: ["status?", "buffer_minutes?", "deposit_cents?", "requires_coi?", "min_coi_coverage_cents?", "expected_facility_version"]
    output: Facility
    side_effects: ["status transitions OPEN<->CLOSED; increments Facility.version by 1"]

  - method: GET
    path: "/facilities/{facility_id}/permits"
    description: "List permits on a facility (reverse-reachability for Permit.facility_id)"
    roles: [RecCoordinator, Patron, FinanceClerk]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Permit[]
    side_effects: []

  # --- Insurance Certificate (COI) ---
  - method: POST
    path: "/insurance-certificates"
    description: "Upload a Certificate of Insurance"
    roles: [RecCoordinator, Patron]
    code: 201
    input: [patron_id, coverage_amount_cents, effective_date, expiry_date]
    output: InsuranceCertificate
    side_effects: ["status=ACTIVE (or EXPIRED if expiry_date <= current clock)"]

  - method: GET
    path: "/insurance-certificates/{coi_id}"
    description: "Get a COI"
    roles: [RecCoordinator, Patron]
    code: 200
    input: []
    output: InsuranceCertificate
    side_effects: []

  - method: GET
    path: "/insurance-certificates"
    description: "List COIs, filterable by patron (reverse-reachability for InsuranceCertificate.patron_id)"
    roles: [RecCoordinator, Patron]
    code: 200
    input: ["patron_id?", "status?", "limit?", "offset?"]
    output: InsuranceCertificate[]
    side_effects: []

  - method: POST
    path: "/insurance-certificates/{coi_id}/revoke"
    description: "Revoke a COI"
    roles: [RecCoordinator]
    code: 200
    input: []
    output: InsuranceCertificate
    side_effects: ["status -> REVOKED"]

  # --- Permit ---
  - method: POST
    path: "/facilities/{facility_id}/permits"
    description: "Apply for a permit on a facility"
    roles: [RecCoordinator, Patron]
    code: 201
    input: [patron_id, start_at, end_at, "coi_id?"]
    output: Permit
    side_effects:
      - "status=APPLIED"
      - "Compute is_prime_requested via prime_overlap_hours"
      - "Lock pricing_residency and compute quoted_fee_cents via provisional_quote_fee"
      - "ERR_PATRON_BARRED if Patron.standing==BARRED; ERR_INVALID_WINDOW if window malformed/past"

  - method: GET
    path: "/permits/{permit_id}"
    description: "Get a permit"
    roles: [RecCoordinator, Patron, FinanceClerk]
    code: 200
    input: []
    output: Permit
    side_effects: []

  - method: GET
    path: "/permits/{permit_id}/refund-preview"
    description: "Preview the cancellation refund at the current clock (estimated_refund_preview variant)"
    roles: [RecCoordinator, Patron]
    code: 200
    input: []
    output: Refund
    side_effects: ["computes a non-persisted Refund preview via cancellation_refund using current clock"]

  - method: POST
    path: "/facilities/{facility_id}/permits/{permit_id}/grant"
    description: "Grant a permit (APPLIED/WAITLISTED -> GRANTED, or -> WAITLISTED with on_conflict)"
    roles: [RecCoordinator]
    code: 200
    input: ["on_conflict?", "expected_facility_version"]
    output: Permit
    side_effects:
      - "Compute final_fee_cents via final_grant_fee; deposit_held_cents=Facility.deposit_cents"
      - "Facility.granted_permit_count += 1; increments Facility.version by 1"
      - "Bubble up to LeagueSeries when league_id set"

  - method: POST
    path: "/facilities/{facility_id}/permits/{permit_id}/deny"
    description: "Deny a permit (APPLIED -> DENIED)"
    roles: [RecCoordinator]
    code: 200
    input: []
    output: Permit
    side_effects: ["VOID any captured Payment (full reverse); bubble up to LeagueSeries"]

  - method: POST
    path: "/facilities/{facility_id}/permits/{permit_id}/cancel"
    description: "Cancel a permit (APPLIED or GRANTED -> CANCELLED)"
    roles: [RecCoordinator, Patron]
    code: 200
    input: ["refund_destination?"]
    output: Permit
    side_effects:
      - "Set cancelled_lead_hours; compute cancellation_refund; create Refund; set refunded_cents"
      - "Facility.granted_permit_count -= 1 (only if was GRANTED); increments Facility.version by 1 (only if was GRANTED)"
      - "Bubble up to LeagueSeries when league_id set"

  - method: POST
    path: "/facilities/{facility_id}/permits/{permit_id}/complete"
    description: "Mark a granted permit completed after end_at (GRANTED -> COMPLETED)"
    roles: [RecCoordinator]
    code: 200
    input: []
    output: Permit
    side_effects: ["Release deposit in full via a Refund; Facility.granted_permit_count -= 1; increments Facility.version by 1"]

  - method: POST
    path: "/facilities/{facility_id}/permits/{permit_id}/no-show"
    description: "Mark a granted permit a no-show after end_at (GRANTED -> NO_SHOW)"
    roles: [RecCoordinator]
    code: 200
    input: []
    output: Permit
    side_effects: ["Forfeit deposit; Patron.no_show_strikes += 1; recompute standing; Facility.granted_permit_count -= 1; increments Facility.version by 1"]

  # --- Payment ---
  - method: POST
    path: "/permits/{permit_id}/payments"
    description: "Authorize and capture a payment funding a permit's fee + deposit"
    roles: [FinanceClerk, RecCoordinator]
    code: 201
    input: [fee_component_cents, deposit_component_cents]
    output: Payment
    side_effects: ["status=CAPTURED"]

  - method: GET
    path: "/permits/{permit_id}/payments"
    description: "List payments for a permit (reverse-reachability for Payment.permit_id)"
    roles: [FinanceClerk, RecCoordinator, Patron]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

  - method: GET
    path: "/payments/{payment_id}"
    description: "Get a payment"
    roles: [FinanceClerk, RecCoordinator, Patron]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: GET
    path: "/payments"
    description: "List payments, filterable by permit (reverse-reachability for Payment.permit_id)"
    roles: [FinanceClerk, RecCoordinator, Patron]
    code: 200
    input: ["permit_id?", "status?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

  - method: GET
    path: "/refunds/{refund_id}"
    description: "Get a refund"
    roles: [FinanceClerk, RecCoordinator, Patron]
    code: 200
    input: []
    output: Refund
    side_effects: []

  - method: GET
    path: "/permits/{permit_id}/refunds"
    description: "List refunds for a permit (reverse-reachability for Refund.permit_id and Refund.payment_id)"
    roles: [FinanceClerk, RecCoordinator, Patron]
    code: 200
    input: ["limit?", "offset?"]
    output: Refund[]
    side_effects: []

  # --- League Series ---
  - method: POST
    path: "/leagues"
    description: "Create a recurring league series; generates one APPLIED child permit per occurrence"
    roles: [RecCoordinator, Patron]
    code: 201
    input: [facility_id, patron_id, weekday, start_hour, duration_minutes, first_date, occurrences, "coi_id?"]
    output: LeagueSeries
    side_effects:
      - "status=PENDING; generate `occurrences` child Permits (status=APPLIED, league_id set) at weekly cadence"
      - "Each child computes is_prime_requested, pricing_residency, quoted_fee_cents like a standalone apply"

  - method: GET
    path: "/leagues/{league_id}"
    description: "Get a league series"
    roles: [RecCoordinator, Patron, FinanceClerk]
    code: 200
    input: []
    output: LeagueSeries
    side_effects: []

  - method: GET
    path: "/leagues/{league_id}/permits"
    description: "List child permits of a league (reverse-reachability for Permit.league_id)"
    roles: [RecCoordinator, Patron, FinanceClerk]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Permit[]
    side_effects: []

  - method: POST
    path: "/leagues/{league_id}/cancel"
    description: "Cancel an entire league series (cascade-cancel non-terminal child permits)"
    roles: [RecCoordinator, Patron]
    code: 200
    input: ["refund_destination?"]
    output: LeagueSeries
    side_effects:
      - "status -> CANCELLED"
      - "Cascade: each non-terminal child permit -> CANCELLED (GRANTED children run cancellation_refund + Facility.granted_permit_count decrement + Facility.version bump)"

  # --- Lottery ---
  - method: POST
    path: "/lottery-rounds"
    description: "Open a prime-slot lottery round for a facility slot"
    roles: [RecCoordinator]
    code: 201
    input: [facility_id, slot_start_at, slot_end_at, opens_at, closes_at]
    output: LotteryRound
    side_effects: ["status=OPEN, entry_count=0"]

  - method: GET
    path: "/lottery-rounds/{lottery_round_id}"
    description: "Get a lottery round"
    roles: [RecCoordinator, Patron]
    code: 200
    input: []
    output: LotteryRound
    side_effects: []

  - method: POST
    path: "/lottery-rounds/{lottery_round_id}/entries"
    description: "Enter a patron into a lottery round"
    roles: [RecCoordinator, Patron]
    code: 201
    input: [patron_id]
    output: LotteryEntry
    side_effects: ["status=ENTERED; assign entry_seq monotonically; compute priority_weight; LotteryRound.entry_count += 1"]

  - method: GET
    path: "/lottery-rounds/{lottery_round_id}/entries"
    description: "List entries in a round (reverse-reachability for LotteryEntry.lottery_round_id)"
    roles: [RecCoordinator, Patron]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: LotteryEntry[]
    side_effects: []

  - method: GET
    path: "/lottery-entries/{lottery_entry_id}"
    description: "Get a lottery entry"
    roles: [RecCoordinator, Patron]
    code: 200
    input: []
    output: LotteryEntry
    side_effects: []

  - method: POST
    path: "/lottery-entries/{lottery_entry_id}/withdraw"
    description: "Withdraw a lottery entry (ENTERED -> WITHDRAWN)"
    roles: [RecCoordinator, Patron]
    code: 200
    input: []
    output: LotteryEntry
    side_effects: ["LotteryRound.entry_count -= 1"]

  - method: POST
    path: "/lottery-rounds/{lottery_round_id}/draw"
    description: "Draw the winner after close (OPEN -> DRAWN); synthesizes a GRANTED permit"
    roles: [RecCoordinator]
    code: 200
    input: ["expected_facility_version"]
    output: LotteryRound
    side_effects:
      - "Select winner via lottery_selection; set winning_entry_id; winner WON, others LOST"
      - "Synthesize GRANTED Permit on the slot; Facility.granted_permit_count += 1; increments Facility.version by 1"

  - method: POST
    path: "/lottery-rounds/{lottery_round_id}/cancel"
    description: "Cancel a lottery round (OPEN -> CANCELLED)"
    roles: [RecCoordinator]
    code: 200
    input: []
    output: LotteryRound
    side_effects: ["All ENTERED entries -> WITHDRAWN"]

