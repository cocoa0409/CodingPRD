            - "the ${w3_id} close is itself a priority-16 boundary: window_end '2026-08-04T00:00:00Z' EQUALS clock_now, and the close succeeds because the rule is window_end <= clock_now"
            - "Deployment.${d1_id}.health_score_final == 80.00 and health_score_provisional == 80.00 after the recovery"

  - rule_id: cross_entity_state_dependency
    instances:

      - name: version_approve_gated_by_training_dataset_approval_state
        grounds:
          - validations.priority_40
          - errors.ERR_DATASET_NOT_APPROVED
          - state_machines.ModelVersion.PENDING_REVIEW_to_APPROVED
          - calculations.revalidation_schedule
          - calculations.dataset_dependency_counter
        distinguishing_aspect: |
          DEPENDENT: ModelVersion (its PENDING_REVIEW -> APPROVED transition).
          DEPENDENCY: TrainingDataset.approval_state, a DIFFERENT entity reached through
          ModelVersion.training_dataset_id. The version is impeccable on its own terms — correct
          state, correct role, no SoD conflict, complete documentation — and still cannot be
          approved while the snapshot behind it is DRAFT or SUBMITTED. The same request body is
          replayed three times against three different states of the dependency entity and only the
          third succeeds; the dependent entity is left completely untouched by the two rejections.
