  - rule_id: resource_temporal_overlap
    instances:
      - name: turnaround_buffer_on_actor
        grounds:
          - calculations.turnaround_conflict_check
          - validations[priority=14]
        distinguishing_aspect: |
          Resource BackgroundActor with half-open interval + mandatory buffer
          semantics: a new booking whose call_time is exactly 600 minutes after the
          prior booking's expected wrap is ALLOWED (>= boundary), while 599 minutes
          is rejected with ERR_TURNAROUND_VIOLATION.
        test_recipe:
          setup:
            - "Production ACTIVE; nonunion actor ELIGIBLE; call1 booking OFFERED with window [2026-08-10T07:00, 2026-08-10T17:00); call2 (shoot_date 2026-08-11, nonunion_slots 2) PUBLISHED"
          setup_api_calls:
            - { call: "POST /central-casting/productions", payload: { title: "Film T1", studio_code: "STX", payroll_company_name: "EntPay" }, as: AgencyAdmin, captures: { prod: $.data.id } }
            - { call: "POST /central-casting/productions/${prod}/activate", payload: {}, as: AgencyAdmin }
            - { call: "POST /central-casting/actors", payload: { legal_name: "N Turn", union_status: "NONUNION" }, as: AgencyAdmin, captures: { act: $.data.id } }
            - { call: "POST /central-casting/actors/${act}/verify", payload: {}, as: AgencyAdmin }
            - { call: "POST /central-casting/casting-calls", payload: { production_id: "${prod}", shoot_date: "2026-08-10", general_call_time: "2026-08-10T07:00:00Z", scheduled_duration_minutes: 600, location: "Lot 20", union_slots: 0, nonunion_slots: 1, union_rate_cents: 10000, nonunion_rate_cents: 10000 }, as: CastingDirector, captures: { cc1: $.data.id } }
            - { call: "POST /central-casting/casting-calls/${cc1}/publish", payload: {}, as: CastingDirector }
            - { call: "POST /central-casting/bookings", payload: { casting_call_id: "${cc1}", actor_id: "${act}" }, as: CastingAssociate, captures: { bk1: $.data.id } }
            - { call: "POST /central-casting/casting-calls", payload: { production_id: "${prod}", shoot_date: "2026-08-11", general_call_time: "2026-08-11T08:00:00Z", scheduled_duration_minutes: 600, location: "Lot 21", union_slots: 0, nonunion_slots: 2, union_rate_cents: 10000, nonunion_rate_cents: 10000 }, as: CastingDirector, captures: { cc2: $.data.id } }
            - { call: "POST /central-casting/casting-calls/${cc2}/publish", payload: {}, as: CastingDirector }
          trigger:
            - { call: "POST /central-casting/bookings", payload: { casting_call_id: "${cc2}", actor_id: "${act}", call_time: "2026-08-11T03:00:00Z" }, as: CastingAssociate, captures: { bk2: $.data.id, bk2_st: $.data.status } }
            - { call: "POST /central-casting/bookings", payload: { casting_call_id: "${cc2}", actor_id: "${act}", call_time: "2026-08-11T02:59:00Z" }, as: CastingAssociate, captures: { err: $.data.error_id } }
          assert:
            - "Gap exactly 600 minutes (17:00 -> 03:00 next day): booking created, status OFFERED (boundary allowed, >=)"
            - "Gap 599 minutes (17:00 -> 02:59): error_id == ERR_TURNAROUND_VIOLATION, HTTP 409"
            - "Note: second trigger also duplicates the actor on call2, but turnaround p14 fires before duplicate p15"
      - name: holding_area_aggregate_capacity
        grounds:
          - calculations.holding_capacity_check
          - validations[priority=19]
          - errors[ERR_HOLDING_AREA_FULL]
        distinguishing_aspect: |
          Different resource (HoldingArea) and different interval semantics
          (aggregate capacity count, not pairwise buffered overlap): with capacity 1,
          a first check-in occupies the area for the duration [check_in, wrap_out);
          a second check-in while the first is still CHECKED_IN is rejected
          (occupancy == capacity boundary rejects).
        test_recipe:
          setup:
            - "Production ACTIVE; two nonunion actors ELIGIBLE, both bookings CONFIRMED on call (nonunion_slots 2) SHOOTING; holding area capacity 1 exists"
          setup_api_calls:
            - { call: "POST /central-casting/productions", payload: { title: "Film T2", studio_code: "STX", payroll_company_name: "EntPay" }, as: AgencyAdmin, captures: { prod: $.data.id } }
            - { call: "POST /central-casting/productions/${prod}/activate", payload: {}, as: AgencyAdmin }
            - { call: "POST /central-casting/actors", payload: { legal_name: "N One", union_status: "NONUNION" }, as: AgencyAdmin, captures: { a1: $.data.id } }
            - { call: "POST /central-casting/actors/${a1}/verify", payload: {}, as: AgencyAdmin }
            - { call: "POST /central-casting/actors", payload: { legal_name: "N Two", union_status: "NONUNION" }, as: AgencyAdmin, captures: { a2: $.data.id } }
            - { call: "POST /central-casting/actors/${a2}/verify", payload: {}, as: AgencyAdmin }
            - { call: "POST /central-casting/casting-calls", payload: { production_id: "${prod}", shoot_date: "2026-08-10", general_call_time: "2026-08-10T07:00:00Z", scheduled_duration_minutes: 600, location: "Lot 22", union_slots: 0, nonunion_slots: 2, union_rate_cents: 10000, nonunion_rate_cents: 10000 }, as: CastingDirector, captures: { cc: $.data.id } }
            - { call: "POST /central-casting/casting-calls/${cc}/publish", payload: {}, as: CastingDirector }
            - { call: "POST /central-casting/holding-areas", payload: { casting_call_id: "${cc}", name: "Basecamp A", capacity: 1 }, as: CastingAssociate, captures: { ha: $.data.id } }
            - { call: "POST /central-casting/bookings", payload: { casting_call_id: "${cc}", actor_id: "${a1}" }, as: CastingAssociate, captures: { bk1: $.data.id } }
            - { call: "POST /central-casting/bookings/${bk1}/accept", payload: {}, as: BackgroundActor, as_user_id: "${a1}" }
            - { call: "POST /central-casting/bookings", payload: { casting_call_id: "${cc}", actor_id: "${a2}" }, as: CastingAssociate, captures: { bk2: $.data.id } }
            - { call: "POST /central-casting/bookings/${bk2}/accept", payload: {}, as: BackgroundActor, as_user_id: "${a2}" }
            - { call: "POST /central-casting/casting-calls/${cc}/lock", payload: {}, as: CastingDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:55:00Z" }, as: AgencyAdmin }
            - { call: "POST /central-casting/casting-calls/${cc}/start-shooting", payload: {}, as: CastingAssociate }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T07:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /central-casting/bookings/${bk1}/check-in", payload: { holding_area_id: "${ha}" }, as: CastingAssociate }
          trigger:
            - { call: "POST /central-casting/bookings/${bk2}/check-in", payload: { holding_area_id: "${ha}" }, as: CastingAssociate, captures: { err: $.data.error_id } }
            - { call: "GET /central-casting/holding-areas/${ha}", payload: {}, as: CastingAssociate, captures: { occ: $.data.current_occupancy } }
          assert:
            - "error_id == ERR_HOLDING_AREA_FULL (occupancy 1 == capacity 1 rejects the second check-in)"
            - "HoldingArea.${ha}.current_occupancy == 1 after rejection (no partial increment)"
            - "Booking.${bk2}.status remains CONFIRMED"

  - rule_id: compensating_invariant
    instances:
      - name: slot_pool_conservation
        grounds:
          - calculations.slot_accounting
          - entities.CastingCall.fields.slots_available
        distinguishing_aspect: |
          Conserved quantity = headcount slots: union_slots + nonunion_slots ==
          slots_available + active_bookings must hold after every forward action
          (create) and every compensating action (cancel, decline); observed values
          walk 2 -> 1 -> 0 -> 1 -> 0 -> 1 with the invariant intact at each step.
        test_recipe:
          setup:
            - "Production ACTIVE; one SAG_AFTRA and one NONUNION actor ELIGIBLE; call (union_slots 1, nonunion_slots 1) PUBLISHED, slots_available == 2"
          setup_api_calls:
            - { call: "POST /central-casting/productions", payload: { title: "Film I1", studio_code: "STX", payroll_company_name: "EntPay" }, as: AgencyAdmin, captures: { prod: $.data.id } }
            - { call: "POST /central-casting/productions/${prod}/activate", payload: {}, as: AgencyAdmin }
            - { call: "POST /central-casting/actors", payload: { legal_name: "U Inv", union_status: "SAG_AFTRA" }, as: AgencyAdmin, captures: { actU: $.data.id } }
            - { call: "POST /central-casting/actors/${actU}/verify", payload: {}, as: AgencyAdmin }
            - { call: "POST /central-casting/actors", payload: { legal_name: "N Inv", union_status: "NONUNION" }, as: AgencyAdmin, captures: { actN: $.data.id } }
            - { call: "POST /central-casting/actors/${actN}/verify", payload: {}, as: AgencyAdmin }
            - { call: "POST /central-casting/casting-calls", payload: { production_id: "${prod}", shoot_date: "2026-08-10", general_call_time: "2026-08-10T07:00:00Z", scheduled_duration_minutes: 600, location: "Lot 23", union_slots: 1, nonunion_slots: 1, union_rate_cents: 10000, nonunion_rate_cents: 10000 }, as: CastingDirector, captures: { cc: $.data.id } }
            - { call: "POST /central-casting/casting-calls/${cc}/publish", payload: {}, as: CastingDirector }
          trigger:
            - { call: "POST /central-casting/bookings", payload: { casting_call_id: "${cc}", actor_id: "${actU}" }, as: CastingAssociate, captures: { bU: $.data.id } }
            - { call: "GET /central-casting/casting-calls/${cc}", payload: {}, as: CastingAssociate, captures: { s1: $.data.slots_available, u1: $.data.union_bookings_active } }
            - { call: "POST /central-casting/bookings", payload: { casting_call_id: "${cc}", actor_id: "${actN}" }, as: CastingAssociate, captures: { bN: $.data.id } }
            - { call: "GET /central-casting/casting-calls/${cc}", payload: {}, as: CastingAssociate, captures: { s2: $.data.slots_available } }
            - { call: "POST /central-casting/bookings/${bU}/cancel", payload: { reason: "release" }, as: CastingAssociate }
            - { call: "GET /central-casting/casting-calls/${cc}", payload: {}, as: CastingAssociate, captures: { s3: $.data.slots_available } }
            - { call: "POST /central-casting/bookings", payload: { casting_call_id: "${cc}", actor_id: "${actU}" }, as: CastingAssociate, captures: { bU2: $.data.id } }
            - { call: "GET /central-casting/casting-calls/${cc}", payload: {}, as: CastingAssociate, captures: { s4: $.data.slots_available } }
            - { call: "POST /central-casting/bookings/${bU2}/decline", payload: {}, as: BackgroundActor, as_user_id: "${actU}" }
            - { call: "GET /central-casting/casting-calls/${cc}", payload: {}, as: CastingAssociate, captures: { s5: $.data.slots_available } }
          assert:
            - "slots_available sequence: 1, 0, 1, 0, 1 (${s1}==1, ${s2}==0, ${s3}==1, ${s4}==0, ${s5}==1)"
            - "Invariant holds at every step: union_slots(1) + nonunion_slots(1) == slots_available + active bookings"
            - "Compensating pair create<->cancel and create<->decline each restore exactly one slot (no drift)"
      - name: batch_gross_ledger_conservation
        grounds:
          - calculations.payroll_batch_gross
          - entities.PayrollBatch.fields.gross_total_cents
          - entities.Voucher.fields.payroll_batch_id
        distinguishing_aspect: |
          Different conserved quantity = money ledger: batch.gross_total_cents must
          equal the sum of member voucher grosses after every mutation; add (10938)
          then remove (0) then re-add (10938) leaves zero drift, and the invariant
          is over a different field type than the headcount slot invariant.
        test_recipe:
          setup:
            - "Production ACTIVE; issued voucher with gross_total_cents == 10938 (NONUNION rate 10000, duration 600, meal 12:00-12:30, wrap 16:00); OPEN payroll batch exists (version captured)"
          setup_api_calls:
            - { call: "POST /central-casting/productions", payload: { title: "Film I2", studio_code: "STX", payroll_company_name: "EntPay" }, as: AgencyAdmin, captures: { prod: $.data.id } }
            - { call: "POST /central-casting/productions/${prod}/activate", payload: {}, as: AgencyAdmin }
            - { call: "POST /central-casting/actors", payload: { legal_name: "N Led", union_status: "NONUNION" }, as: AgencyAdmin, captures: { act: $.data.id } }
            - { call: "POST /central-casting/actors/${act}/verify", payload: {}, as: AgencyAdmin }
            - { call: "POST /central-casting/casting-calls", payload: { production_id: "${prod}", shoot_date: "2026-08-10", general_call_time: "2026-08-10T07:00:00Z", scheduled_duration_minutes: 600, location: "Lot 24", union_slots: 0, nonunion_slots: 1, union_rate_cents: 10000, nonunion_rate_cents: 10000 }, as: CastingDirector, captures: { cc: $.data.id } }
            - { call: "POST /central-casting/casting-calls/${cc}/publish", payload: {}, as: CastingDirector }
            - { call: "POST /central-casting/bookings", payload: { casting_call_id: "${cc}", actor_id: "${act}" }, as: CastingAssociate, captures: { bk: $.data.id } }
            - { call: "POST /central-casting/bookings/${bk}/accept", payload: {}, as: BackgroundActor, as_user_id: "${act}" }
            - { call: "POST /central-casting/casting-calls/${cc}/lock", payload: {}, as: CastingDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:55:00Z" }, as: AgencyAdmin }
            - { call: "POST /central-casting/casting-calls/${cc}/start-shooting", payload: {}, as: CastingAssociate }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T07:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /central-casting/bookings/${bk}/check-in", payload: {}, as: CastingAssociate }
            - { call: "POST /central-casting/time-events", payload: { booking_id: "${bk}", event_type: "MEAL_OUT", occurred_at: "2026-08-10T12:00:00Z" }, as: CastingAssociate }
            - { call: "POST /central-casting/time-events", payload: { booking_id: "${bk}", event_type: "MEAL_IN", occurred_at: "2026-08-10T12:30:00Z" }, as: CastingAssociate }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T16:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /central-casting/bookings/${bk}/wrap-out", payload: {}, as: CastingAssociate }
            - { call: "GET /central-casting/vouchers", payload: { booking_id: "${bk}" }, as: CastingAssociate, captures: { vc: "$.data[0].id" } }
            - { call: "POST /central-casting/vouchers/${vc}/issue", payload: {}, as: CastingAssociate, as_user_id: "assoc-1" }
            - { call: "POST /central-casting/payroll-batches", payload: { production_id: "${prod}", period_label: "2026-W33" }, as: PayrollCoordinator, as_user_id: "pc-1", captures: { pb: $.data.id, pb_v: $.data.version } }
          trigger:
            - { call: "POST /central-casting/payroll-batches/${pb}/items", payload: { voucher_id: "${vc}", expected_batch_version: "${pb_v}" }, as: PayrollCoordinator, as_user_id: "pc-1", captures: { g1: $.data.gross_total_cents, c1: $.data.voucher_count, pb_v2: $.data.version } }
            - { call: "POST /central-casting/payroll-batches/${pb}/remove-item", payload: { voucher_id: "${vc}" }, as: PayrollCoordinator, as_user_id: "pc-1", captures: { g2: $.data.gross_total_cents, c2: $.data.voucher_count, pb_v3: $.data.version } }
            - { call: "POST /central-casting/payroll-batches/${pb}/items", payload: { voucher_id: "${vc}", expected_batch_version: "${pb_v3}" }, as: PayrollCoordinator, as_user_id: "pc-1", captures: { g3: $.data.gross_total_cents, c3: $.data.voucher_count } }
          assert:
            - "After add: gross_total_cents == 10938 == voucher gross_total_cents, voucher_count == 1"
            - "After remove: gross_total_cents == 0, voucher_count == 0 (compensating action restores exactly)"
            - "After re-add: gross_total_cents == 10938, voucher_count == 1 (no drift across the round trip)"
            - "Voucher.${vc}.payroll_batch_id set after adds and null after remove"
