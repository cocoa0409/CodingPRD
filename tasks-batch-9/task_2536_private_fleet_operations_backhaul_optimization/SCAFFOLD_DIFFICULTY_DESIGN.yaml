            - call: "POST /fleet/replenishment-orders"
              payload: { store_id: "${store_s5_id}", cases: 600, weight_lbs: 13000, requested_window_start: "2026-08-07T00:00:00Z", requested_window_end: "2026-08-07T08:00:00Z", temperature_mode: "DRY", priority: 3 }
