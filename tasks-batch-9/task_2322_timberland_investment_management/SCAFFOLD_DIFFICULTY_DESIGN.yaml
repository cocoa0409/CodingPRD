              payload: {}
              as: ForestManager
              captures: { stand_v3: "$.data.version", ded_after: "$.data.dedicated_tons", avail_after: "$.data.available_tons" }
          assert:
            - "${ded_before} == 500.00 and ${avail_before} == 4147.12"
            - "${ded_status} == RELEASED"
            - "${ded_after} == 0.00 and ${avail_after} == 4647.12"
            - "CarbonDedication.${ded_id}.permanence_end_date == null"
            - "CarbonProject.${proj_id}.dedicated_tons_total == 0.00 and CarbonProject.${proj_id}.buffer_pool_tons == 0.00 and CarbonProject.${proj_id}.status == DRAFT"
            - "Stand.${stand_id}.net_merch_tons == 4647.12 and the five-bucket identity holds with every bucket except available_tons at 0.00"
            - "${stand_v3} is greater than ${stand_v2}, so the pre-release token is now stale for any expected_stand_version"
            - "Fund.${fund_id}.cash_balance_usd == 300000.00"
