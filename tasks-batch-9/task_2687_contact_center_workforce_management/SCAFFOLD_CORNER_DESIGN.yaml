              as: SchedulingManager
              captures: { ag1_id: "$.data.id" }
            - call: "POST /agents"
              payload: { labor_agreement_id: "${la_id}", employee_code: "E-002", full_name: "Agent Two", skills: ["VOICE_EN"], seniority_rank: 2, weekly_contracted_hours: 37.5, hourly_rate_cents: 2400 }
              as: SchedulingManager
              captures: { ag2_id: "$.data.id" }
            - call: "POST /shift-templates"
              payload: { planning_cycle_id: "${cyc_id}", code: "T-1", skill_code: "VOICE_EN", start_time_local: "08:00", duration_minutes: 480, days_of_week: [0], slots_total: 1, unpaid_break_minutes: 30 }
              as: SchedulingManager
              captures: { t_1: "$.data.id" }
            - call: "POST /bid-rounds"
              payload: { planning_cycle_id: "${cyc_id}", code: "R-1", max_reopen_count: 2 }
              as: SchedulingManager
              captures: { r1_id: "$.data.id" }
            - call: "POST /bid-rounds/${r1_id}/status"
              payload: { target_status: "OPEN" }
              as: SchedulingManager
            - call: "POST /shift-bids"
              payload: { bid_round_id: "${r1_id}", agent_id: "${ag1_id}", preference_template_ids: ["${t_1}"] }
              as: Agent
              as_user_id: "${ag1_id}"
              captures: { b1_id: "$.data.id" }
            - call: "POST /bid-rounds/${r1_id}/status"
              payload: { target_status: "SCORING" }
              as: SchedulingManager
            - call: "POST /bid-rounds/${r1_id}/award"
              payload: {}
              as: SchedulingManager
              captures: { r1_status: "$.data.status", r1_rate: "$.data.preference_honor_rate" }
            - call: "GET /shift-templates/${t_1}"
              payload: {}
              as: SchedulingManager
              captures: { slots_awarded_after_r1: "$.data.slots_awarded" }
            - call: "POST /bid-rounds"
              payload: { planning_cycle_id: "${cyc_id}", code: "R-2", max_reopen_count: 2 }
              as: SchedulingManager
              captures: { r2_id: "$.data.id" }
            - call: "POST /bid-rounds/${r2_id}/status"
              payload: { target_status: "OPEN" }
              as: SchedulingManager
            - call: "POST /shift-bids"
              payload: { bid_round_id: "${r2_id}", agent_id: "${ag2_id}", preference_template_ids: ["${t_1}"] }
              as: Agent
              as_user_id: "${ag2_id}"
              captures: { b2_id: "$.data.id" }
