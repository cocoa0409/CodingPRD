        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Requests without a valid X-User-Role are rejected with ERR_UNAUTHENTICATED 401 before any other check (priority 1 beats existence/business)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
