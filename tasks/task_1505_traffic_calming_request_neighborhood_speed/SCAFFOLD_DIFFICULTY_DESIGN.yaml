  # ---------------------------------------------------------------------------
  # Rule 9: compensating_invariant — conserved budget cents (fund vs consent-
  # denial release) vs conserved live-signature count (add vs retract).
  # Different conserved quantities.
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: cycle_budget_conserved_across_fund_and_consent_denial
        grounds:
          - state_machines.TrafficCalmingRequest.RANKING_ELIGIBLE_to_FUNDED
          - state_machines.TrafficCalmingRequest.BALLOT_OPEN_to_CONSENT_DENIED
          - calculations.citywide_ranking_waterfall
          - entities.FundingCycle.fields.budget_available_cents
        distinguishing_aspect: |
          Conserved quantity = cycle budget cents: budget_total_cents ==
          budget_committed_cents + budget_available_cents. The forward action
          (FUNDED at publication: committed 0 -> 10750) paired with its
          compensating action (consent DENIED at tally: allocation released)
          returns committed to 0 and available to 50000 — no drift.
        test_recipe:
          setup:
            - "4-household segment; request requested_budget_cents 10000, certified score 60, FUNDED at 10750 on a 50000-cent cycle"
            - "Ballot open (close 2026-08-10); the single cast vote is AGAINST (quorum 1 met, approval 0%)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CityAdmin }
            - call: "POST /api/segments"
              payload: { name: "Magnolia Ave", speed_limit_mph: 30, household_count: 4, functional_class: "LOCAL", emergency_route: false, crash_count_3yr: 0, pedestrian_generator_count: 0 }
              as: CityAdmin
              captures: { seg: $.data.id }
            - { call: "POST /api/residents", payload: { full_name: "R1", email: "ci1-r1@x.com", street_segment_id: "${seg}", household_ref: "H1" }, as: CityAdmin, captures: { r1: $.data.id } }
            - { call: "POST /api/residents", payload: { full_name: "R2", email: "ci1-r2@x.com", street_segment_id: "${seg}", household_ref: "H2" }, as: CityAdmin, captures: { r2: $.data.id } }
            - { call: "POST /api/residents", payload: { full_name: "R3", email: "ci1-r3@x.com", street_segment_id: "${seg}", household_ref: "H3" }, as: CityAdmin, captures: { r3: $.data.id } }
            - call: "POST /api/requests"
              payload: { street_segment_id: "${seg}", title: "Calm Magnolia Ave", requested_budget_cents: 10000 }
              as: Resident
              as_user_id: "${r1}"
              captures: { req: $.data.id }
            - { call: "POST /api/requests/${req}/open-petition", payload: {}, as: TrafficEngineer }
            - { call: "POST /api/requests/${req}/petition-signatures", payload: {}, as: Resident, as_user_id: "${r1}" }
            - { call: "POST /api/requests/${req}/petition-signatures", payload: {}, as: Resident, as_user_id: "${r2}" }
            - { call: "POST /api/requests/${req}/petition-signatures", payload: {}, as: Resident, as_user_id: "${r3}" }
            - call: "POST /api/requests/${req}/speed-studies"
              payload: { study_type: "INITIAL", window_start_date: "2026-08-03", window_end_date: "2026-08-05" }
              as: TrafficEngineer
              captures: { study: $.data.id }
            - { call: "POST /api/speed-studies/${study}/observations", payload: { observation_date: "2026-08-03", vehicle_count: 3000, p85_speed_mph: 40.0, mean_speed_mph: 33.0 }, as: TrafficEngineer }
            - { call: "POST /api/speed-studies/${study}/observations", payload: { observation_date: "2026-08-04", vehicle_count: 3000, p85_speed_mph: 40.0, mean_speed_mph: 33.0 }, as: TrafficEngineer }
            - { call: "POST /api/speed-studies/${study}/observations", payload: { observation_date: "2026-08-05", vehicle_count: 3000, p85_speed_mph: 40.0, mean_speed_mph: 33.0 }, as: TrafficEngineer }
            - { call: "POST /api/speed-studies/${study}/analyze", payload: {}, as: TrafficEngineer }
            - { call: "POST /api/speed-studies/${study}/certify", payload: {}, as: TrafficEngineer }
            - call: "POST /api/funding-cycles"
              payload: { cycle_year: 2026, budget_total_cents: 50000 }
              as: CityAdmin
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - { call: "POST /api/funding-cycles/${cyc}/publish-ranking", payload: { expected_funding_cycle_version: "${cyc_v}" }, as: CityAdmin }
            - call: "GET /api/funding-cycles/${cyc}"
              payload: {}
              as: CityAdmin
              captures: { committed_funded: $.data.budget_committed_cents, available_funded: $.data.budget_available_cents }
            - call: "GET /api/requests/${req}"
              payload: {}
              as: CityAdmin
              captures: { req_v: $.data.version, alloc_funded: $.data.allocated_cents, status_funded: $.data.status }
            - call: "POST /api/requests/${req}/treatment-plans"
              payload: { treatment_type: "SIGNAGE", estimated_cost_cents: 9000, expected_request_version: "${req_v}" }
              as: TrafficEngineer
              as_user_id: "te-1"
              captures: { plan: $.data.id }
            - { call: "POST /api/treatment-plans/${plan}/submit-for-review", payload: {}, as: TrafficEngineer, as_user_id: "te-1" }
            - { call: "POST /api/treatment-plans/${plan}/approve", payload: {}, as: CityEngineer, as_user_id: "ce-1" }
            - call: "POST /api/requests/${req}/ballots"
              payload: { close_date: "2026-08-10T00:00:00Z" }
              as: TrafficEngineer
              captures: { ballot: $.data.id }
            - { call: "POST /api/ballots/${ballot}/votes", payload: { choice: "AGAINST" }, as: Resident, as_user_id: "${r1}" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: CityAdmin }
            - call: "GET /api/funding-cycles/${cyc}"
              payload: {}
              as: CityAdmin
              captures: { committed_after: $.data.budget_committed_cents, available_after: $.data.budget_available_cents }
            - call: "GET /api/requests/${req}"
              payload: {}
              as: CityAdmin
              captures: { req_status: $.data.status, alloc_after: $.data.allocated_cents }
          assert:
            - "Forward action: after publish, committed == 10750 AND available == 39250 (10750 + 39250 == 50000 == budget_total_cents); request.allocated_cents == 10750, status == FUNDED"
            - "Note: plan approval re-baselined to 9000 + round(675.00) = 9675 before the ballot; the DENIED release compensates the then-current allocation"
            - "Compensating action: after DENIED tally, committed == 0 AND available == 50000 — invariant restored exactly"
            - "request.status == CONSENT_DENIED, allocated_cents == 0, funding_cycle_id == null"

      - name: signature_count_conserved_across_add_and_retract
        grounds:
          - entities.TrafficCalmingRequest.fields.signature_count
          - state_machines.TrafficCalmingRequest.SUBMITTED_to_PETITION_OPEN
        distinguishing_aspect: |
          Conserved quantity = live PetitionSignature row count: after every
          forward/compensating pair, request.signature_count == the number of
          rows returned by GET .../petition-signatures. Three adds then one
          retract leave signature_count at exactly 2, identical to a fresh
          two-signature state — no drift from the retraction.
        test_recipe:
          setup:
            - "10-household segment (required 6); 3 residents; request PETITION_OPEN"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CityAdmin }
            - call: "POST /api/segments"
              payload: { name: "Nutwood St", speed_limit_mph: 30, household_count: 10, functional_class: "LOCAL", emergency_route: false, crash_count_3yr: 0, pedestrian_generator_count: 0 }
              as: CityAdmin
              captures: { seg: $.data.id }
            - { call: "POST /api/residents", payload: { full_name: "R1", email: "ci2-r1@x.com", street_segment_id: "${seg}", household_ref: "H1" }, as: CityAdmin, captures: { r1: $.data.id } }
            - { call: "POST /api/residents", payload: { full_name: "R2", email: "ci2-r2@x.com", street_segment_id: "${seg}", household_ref: "H2" }, as: CityAdmin, captures: { r2: $.data.id } }
            - { call: "POST /api/residents", payload: { full_name: "R3", email: "ci2-r3@x.com", street_segment_id: "${seg}", household_ref: "H3" }, as: CityAdmin, captures: { r3: $.data.id } }
            - call: "POST /api/requests"
              payload: { street_segment_id: "${seg}", title: "Calm Nutwood St", requested_budget_cents: 50000 }
              as: Resident
              as_user_id: "${r1}"
              captures: { req: $.data.id }
            - { call: "POST /api/requests/${req}/open-petition", payload: {}, as: TrafficEngineer }
          trigger:
            - call: "POST /api/requests/${req}/petition-signatures"
              payload: {}
              as: Resident
              as_user_id: "${r1}"
              captures: { sig1: $.data.id }
            - { call: "POST /api/requests/${req}/petition-signatures", payload: {}, as: Resident, as_user_id: "${r2}" }
            - { call: "POST /api/requests/${req}/petition-signatures", payload: {}, as: Resident, as_user_id: "${r3}" }
            - call: "GET /api/requests/${req}"
              payload: {}
              as: TrafficEngineer
              captures: { count3: $.data.signature_count, status3: $.data.status }
            - { call: "DELETE /api/petition-signatures/${sig1}", payload: {}, as: Resident, as_user_id: "${r1}" }
            - call: "GET /api/requests/${req}"
              payload: {}
              as: TrafficEngineer
              captures: { count2: $.data.signature_count }
          assert:
            - "After 3 adds: signature_count == 3 AND status == PETITION_OPEN (3 < 6)"
            - "After retracting sig1 (the compensating action): signature_count == 2 — exactly one less, no drift"
            - "Re-adding the same household after retraction is allowed again (live-row uniqueness, not historical): verified by count semantics above"
