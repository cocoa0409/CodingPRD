  - section: rbac
    instances:
      - name: every_write_rejects_missing_auth_headers_and_unknown_roles_before_any_state_check
        claim_type: unauthenticated_denial
        grounds:
          - validations.priority_1_auth
          - validations.priority_2_auth
          - errors.ERR_MISSING_AUTH_HEADERS
          - errors.ERR_UNKNOWN_ROLE
          - roles
        distinguishing_aspect: |
          Both header failures are 401 and both precede every other check, so an unauthenticated call
          against a room in the WRONG state still answers ERR_MISSING_AUTH_HEADERS rather than the 409 the
          same call would earn once authenticated - and an empty header string is treated as absent, not as
          an unknown role.
        test_recipe:
          setup:
            - "Room RM exists in OPEN, so an authenticated open-staffing call would succeed and an authenticated activate call would fail with a 409."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_SE
            - *C_AW1
            - *C_RM
          trigger:
            - call: "POST /rooms/${rm}/open-staffing"
              payload: {}
              as: "(no X-User-Role header sent)"
            - call: "POST /rooms/${rm}/open-staffing"
              payload: {}
              as: "(X-User-Role sent as an empty string)"
            - call: "POST /rooms/${rm}/open-staffing"
              payload: {}
              as: "Producer"
            - call: "POST /rooms/${rm}/activate"
              payload: {}
              as: "(no X-User-Role header sent)"
            - call: "GET /rooms/${rm}"
              payload: {}
              as: "(no X-User-Role header sent)"
            - *C_OPEN
          assert:
            - "Trigger calls 1 and 2 return 401 ERR_MISSING_AUTH_HEADERS: an empty header is absent, not unknown"
            - "Trigger call 3 returns 401 ERR_UNKNOWN_ROLE - Producer is a real television job title but not one of the five declared roles"
            - "Trigger call 4 returns 401 ERR_MISSING_AUTH_HEADERS and NOT 409: the room is in OPEN, so an authenticated StudioExecutive activate would have been the state error"
            - "Trigger call 5 returns 401 ERR_MISSING_AUTH_HEADERS: reads are authenticated too"
            - "After trigger call 5: WritersRoom.${rm}.status is still OPEN and version == 1 - none of the four refusals mutated anything"
            - "Trigger call 6 returns 200 with status STAFFING and version 2, proving the endpoint was reachable all along"

      - name: cross_role_calls_are_forbidden_on_every_exclusive_operation
        claim_type: cross_role_denial
        grounds:
          - validations.priority_3_auth
          - errors.ERR_ROLE_NOT_PERMITTED
          - roles.StudioExecutive.exclusive_operations
          - roles.Showrunner.exclusive_operations
          - roles.Writer.exclusive_operations
          - roles.GuildAdministrator.exclusive_operations
          - roles.LegalCounsel.exclusive_operations
        distinguishing_aspect: |
          The five roles are peers, not a hierarchy: the StudioExecutive who owns the season cannot open the
          room for staffing or offer a seat, the Showrunner who staffs it cannot activate it or reconfigure
          it, the GuildAdministrator who owns the rate card cannot create a season, and no role but
          LegalCounsel may touch clearance - so ERR_ROLE_NOT_PERMITTED is symmetrical and never overridden
          by seniority.
        test_recipe:
          setup:
            - "The canonical fixture exists through the ACTIVE room, episode EP1 and assignment A1 with M1..M3 delivered."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
