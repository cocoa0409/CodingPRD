# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Sleep Study & Diagnostics Center — task_0409
# Breadth probe over §1.1–§1.7. Same structured-call discipline & §1.5 lint
# gates as §1.8. excluded_because stubs cite §1.8 instances by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_patient_minimal_required_fields
        claim_type: Creation
        grounds:
          - endpoints.POST./patients
          - entities.Patient.fields.full_name
        distinguishing_aspect: "POST /patients with full_name, date_of_birth, insurance_payer -> 201; version==1; baseline_epworth_score defaults to 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { full_name: "Ada Test", date_of_birth: "1990-01-01", insurance_payer: "Acme" }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Patient.${pat_id}.version == 1"
            - "Patient.${pat_id}.baseline_epworth_score == 0"

      - name: create_patient_missing_required_field
        claim_type: Required Fields
        grounds:
          - endpoints.POST./patients
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /patients omitting full_name -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { date_of_birth: "1990-01-01", insurance_payer: "Acme" }
              as: SchedulingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_patient_epworth_out_of_range
        claim_type: Type Constraints
        grounds:
          - entities.Patient.fields.baseline_epworth_score
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "baseline_epworth_score=25 (>24) -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { full_name: "Out Range", date_of_birth: "1990-01-01", insurance_payer: "Acme", baseline_epworth_score: 25 }
              as: SchedulingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: get_patient_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET./patients/{patientId}
          - errors[ERR_PATIENT_NOT_FOUND]
        distinguishing_aspect: "GET /patients/{unknown} -> ERR_PATIENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /patients/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: SchedulingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_PATIENT_NOT_FOUND"

      - name: referral_default_prior_auth_required_true
        claim_type: Defaults
        grounds:
          - entities.Referral.fields.prior_auth_required
          - endpoints.POST./referrals
        distinguishing_aspect: "POST /referrals omitting prior_auth_required -> default true; status SUBMITTED; prior_auth_number null."
        test_recipe:
          setup: ["A patient exists."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Def Pat", date_of_birth: "1985-01-01", insurance_payer: "Acme" }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_npi: "2121212121", requested_modality: "HSAT", clinical_indication: "OSA" }
              as: SchedulingCoordinator
              captures: { ref_id: $.data.id }
          assert:
            - "Referral.${ref_id}.prior_auth_required == true"
            - "Referral.${ref_id}.status == SUBMITTED"
            - "Referral.${ref_id}.prior_auth_number == null"

      - name: referral_bad_modality_enum
        claim_type: Type Constraints
        grounds:
          - entities.Referral.fields.requested_modality
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "requested_modality='BOGUS' -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A patient exists."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "En Um", date_of_birth: "1985-01-01", insurance_payer: "Acme" }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_npi: "2222000022", requested_modality: "BOGUS", clinical_indication: "OSA" }
              as: SchedulingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: referral_unknown_patient_fk
        claim_type: Parent Relationships
        grounds:
          - entities.Referral.fields.patient_id
          - validations[priority=3]
          - errors[ERR_PATIENT_NOT_FOUND]
        distinguishing_aspect: "POST /referrals with non-existent patient_id -> ERR_PATIENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /referrals"
              payload: { patient_id: "00000000-0000-0000-0000-000000000000", referring_provider_npi: "2323232323", requested_modality: "HSAT", clinical_indication: "OSA", prior_auth_required: false }
              as: SchedulingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_PATIENT_NOT_FOUND"

      - name: system_fields_ignored_on_create
        claim_type: System Fields
        grounds:
          - entities.SleepBed.fields.id
          - endpoints.POST./beds
        distinguishing_aspect: "POST /beds: server mints id/created_at/version regardless; status defaults AVAILABLE, turnover_buffer_minutes defaults 60."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /beds"
              payload: { bed_label: "Room-9-Bed-A" }
              as: SchedulingCoordinator
              captures: { bed_id: $.data.id }
          assert:
            - "SleepBed.${bed_id}.status == AVAILABLE"
            - "SleepBed.${bed_id}.turnover_buffer_minutes == 60"
            - "SleepBed.${bed_id}.version == 1"

      - name: computed_severity_snapshot_on_scoring_report
        claim_type: Computed Fields
        grounds:
          - entities.ScoringReport.fields.ahi_snapshot
          - entities.ScoringReport.fields.severity_snapshot
          - calculations.ahi_index
        distinguishing_aspect: "On score, the created DRAFT ScoringReport copies ahi_snapshot==15.0 and severity_snapshot==MODERATE from the StudyOrder (480 min, 120 events)."
        test_recipe:
          setup: ["An HSAT study started (IN_PROGRESS)."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Comp Snap", date_of_birth: "1985-01-01", insurance_payer: "Acme" }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_npi: "2424242424", requested_modality: "HSAT", clinical_indication: "OSA", prior_auth_required: false }
              as: SchedulingCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/approve-auth"
              payload: { prior_auth_number: "PA-24", prior_auth_expires_on: "2026-12-31" }
              as: SchedulingCoordinator
              captures: { ref_v2: $.data.version }
            - call: "POST /study-orders"
              payload: { referral_id: "${ref_id}", modality: "HSAT", expected_referral_version: "${ref_v2}" }
              as: SchedulingCoordinator
              captures: { so_id: $.data.id }
            - call: "POST /study-orders/${so_id}/schedule"
              payload: { night_start_utc: "2026-07-01T22:00:00Z", night_end_utc: "2026-07-02T06:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /study-orders/${so_id}/start"
              payload: {}
              as: SleepTechnologist
              captures: { so_v: $.data.version }
            - call: "POST /study-orders/${so_id}/score"
              payload: { total_recording_minutes: 480, respiratory_event_count: 120, expected_study_order_version: "${so_v}" }
              as: SleepTechnologist
          trigger:
            - call: "GET /study-orders/${so_id}/scoring-reports"
              payload: {}
              as: Physician
              captures: { sr_ahi: "$.data[0].ahi_snapshot", sr_sev: "$.data[0].severity_snapshot" }
          assert:
            - "ScoringReport[0].ahi_snapshot == 15.0"
            - "ScoringReport[0].severity_snapshot == MODERATE"

      - name: list_referrals_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints.GET./referrals
        distinguishing_aspect: "GET /referrals returns array envelope with total_count and has_more pagination fields."
        test_recipe:
          setup: ["One patient and one referral exist."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "List Pat", date_of_birth: "1985-01-01", insurance_payer: "Acme" }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_npi: "2525252525", requested_modality: "HSAT", clinical_indication: "OSA", prior_auth_required: false }
              as: SchedulingCoordinator
              captures: { ref_id: $.data.id }
          trigger:
            - call: "GET /referrals"
              payload: { patient_id: "${pat_id}" }
              as: SchedulingCoordinator
              captures: { body: $.data }
          assert:
            - "response.status == 200"
            - "response.response_type == array"
            - "total_count == 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_referral_blocked_by_active_study
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Referral.SUBMITTED_to_CANCELLED
          - errors[ERR_REFERRAL_HAS_ACTIVE_STUDY]
        distinguishing_aspect: "Referral cancel with a study IN_PROGRESS -> ERR_REFERRAL_HAS_ACTIVE_STUDY (409); referral stays SCHEDULED."
        test_recipe:
          setup: ["An authorized referral whose HSAT study is IN_PROGRESS (referral SCHEDULED)."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Act Stud", date_of_birth: "1985-01-01", insurance_payer: "Acme" }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_npi: "2626262626", requested_modality: "HSAT", clinical_indication: "OSA", prior_auth_required: false }
              as: SchedulingCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/approve-auth"
              payload: { prior_auth_number: "PA-26", prior_auth_expires_on: "2026-12-31" }
              as: SchedulingCoordinator
              captures: { ref_v2: $.data.version }
            - call: "POST /study-orders"
              payload: { referral_id: "${ref_id}", modality: "HSAT", expected_referral_version: "${ref_v2}" }
              as: SchedulingCoordinator
              captures: { so_id: $.data.id }
            - call: "POST /study-orders/${so_id}/schedule"
              payload: { night_start_utc: "2026-07-01T22:00:00Z", night_end_utc: "2026-07-02T06:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /study-orders/${so_id}/start"
              payload: {}
              as: SleepTechnologist
          trigger:
            - call: "POST /referrals/${ref_id}/cancel"
              payload: {}
              as: SchedulingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_REFERRAL_HAS_ACTIVE_STUDY"
            - "Referral.${ref_id}.status == SCHEDULED"

      - name: request_auth_when_not_required_returns_error
        claim_type: invalid_transition
        grounds:
          - state_machines.Referral.SUBMITTED_to_PENDING_AUTH
          - errors[ERR_AUTH_NOT_REQUIRED]
        distinguishing_aspect: "request-auth on a prior_auth_required=false referral -> ERR_AUTH_NOT_REQUIRED (409)."
        test_recipe:
          setup: ["A referral with prior_auth_required false."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "No Auth", date_of_birth: "1985-01-01", insurance_payer: "Acme" }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_npi: "2727272727", requested_modality: "HSAT", clinical_indication: "OSA", prior_auth_required: false }
              as: SchedulingCoordinator
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /referrals/${ref_id}/request-auth"
              payload: {}
              as: SchedulingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_AUTH_NOT_REQUIRED"

      - name: deny_auth_from_authorized_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Referral.PENDING_AUTH_to_DENIED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "deny-auth on an already AUTHORIZED referral -> ERR_INVALID_STATE (409); deny is only valid from PENDING_AUTH."
        test_recipe:
          setup: ["An AUTHORIZED referral (no auth required, approved)."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Already Auth", date_of_birth: "1985-01-01", insurance_payer: "Acme" }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_npi: "2828282828", requested_modality: "HSAT", clinical_indication: "OSA", prior_auth_required: false }
              as: SchedulingCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/approve-auth"
              payload: { prior_auth_number: "PA-28", prior_auth_expires_on: "2026-12-31" }
              as: SchedulingCoordinator
          trigger:
            - call: "POST /referrals/${ref_id}/deny-auth"
              payload: {}
              as: SchedulingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: start_study_from_ordered_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.StudyOrder.SCHEDULED_to_IN_PROGRESS
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "start on an ORDERED (unscheduled) study -> ERR_INVALID_STATE (409); start requires SCHEDULED."
        test_recipe:
          setup: ["An authorized referral with one ORDERED HSAT study (never scheduled)."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Early Start", date_of_birth: "1985-01-01", insurance_payer: "Acme" }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_npi: "2929292929", requested_modality: "HSAT", clinical_indication: "OSA", prior_auth_required: false }
              as: SchedulingCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/approve-auth"
              payload: { prior_auth_number: "PA-29", prior_auth_expires_on: "2026-12-31" }
              as: SchedulingCoordinator
              captures: { ref_v2: $.data.version }
            - call: "POST /study-orders"
              payload: { referral_id: "${ref_id}", modality: "HSAT", expected_referral_version: "${ref_v2}" }
              as: SchedulingCoordinator
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /study-orders/${so_id}/start"
              payload: {}
              as: SleepTechnologist
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: cancel_interpreted_study_not_cancellable
        claim_type: invalid_transition
        grounds:
          - state_machines.StudyOrder.ORDERED_to_CANCELLED
          - errors[ERR_STUDY_NOT_CANCELLABLE]
        distinguishing_aspect: "study cancel from INTERPRETED -> ERR_STUDY_NOT_CANCELLABLE (409); cancel only from ORDERED/SCHEDULED."
        test_recipe:
          setup: ["An interpreted HSAT study (terminal)."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Term Study", date_of_birth: "1985-01-01", insurance_payer: "Acme" }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_npi: "3030303030", requested_modality: "HSAT", clinical_indication: "OSA", prior_auth_required: false }
              as: SchedulingCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/approve-auth"
              payload: { prior_auth_number: "PA-30", prior_auth_expires_on: "2026-12-31" }
              as: SchedulingCoordinator
              captures: { ref_v2: $.data.version }
            - call: "POST /study-orders"
              payload: { referral_id: "${ref_id}", modality: "HSAT", expected_referral_version: "${ref_v2}" }
              as: SchedulingCoordinator
              captures: { so_id: $.data.id }
            - call: "POST /study-orders/${so_id}/schedule"
              payload: { night_start_utc: "2026-07-01T22:00:00Z", night_end_utc: "2026-07-02T06:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /study-orders/${so_id}/start"
              payload: {}
              as: SleepTechnologist
              captures: { so_v: $.data.version }
            - call: "POST /study-orders/${so_id}/score"
              payload: { total_recording_minutes: 480, respiratory_event_count: 240, expected_study_order_version: "${so_v}" }
              as: SleepTechnologist
            - call: "GET /study-orders/${so_id}/scoring-reports"
              payload: {}
              as: Physician
              captures: { sr_id: "$.data[0].id" }
            - call: "POST /scoring-reports/${sr_id}/interpret"
              payload: { interpretation_text: "Severe OSA", physician_recommends_cpap: true }
              as: Physician
          trigger:
            - call: "POST /study-orders/${so_id}/cancel"
              payload: {}
              as: SchedulingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_STUDY_NOT_CANCELLABLE"

      - name: interpret_requires_nonempty_text
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ScoringReport.DRAFT_to_FINALIZED
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "interpret with missing interpretation_text -> ERR_INVALID_REQUEST (422); report stays DRAFT."
        test_recipe:
          setup: ["A SCORED HSAT study with a DRAFT scoring report."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Empty Text", date_of_birth: "1985-01-01", insurance_payer: "Acme" }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_npi: "3131313131", requested_modality: "HSAT", clinical_indication: "OSA", prior_auth_required: false }
              as: SchedulingCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/approve-auth"
              payload: { prior_auth_number: "PA-31", prior_auth_expires_on: "2026-12-31" }
              as: SchedulingCoordinator
              captures: { ref_v2: $.data.version }
            - call: "POST /study-orders"
              payload: { referral_id: "${ref_id}", modality: "HSAT", expected_referral_version: "${ref_v2}" }
              as: SchedulingCoordinator
              captures: { so_id: $.data.id }
            - call: "POST /study-orders/${so_id}/schedule"
              payload: { night_start_utc: "2026-07-01T22:00:00Z", night_end_utc: "2026-07-02T06:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /study-orders/${so_id}/start"
              payload: {}
              as: SleepTechnologist
              captures: { so_v: $.data.version }
            - call: "POST /study-orders/${so_id}/score"
              payload: { total_recording_minutes: 480, respiratory_event_count: 120, expected_study_order_version: "${so_v}" }
              as: SleepTechnologist
            - call: "GET /study-orders/${so_id}/scoring-reports"
              payload: {}
              as: Physician
              captures: { sr_id: "$.data[0].id" }
          trigger:
            - call: "POST /scoring-reports/${sr_id}/interpret"
              payload: { physician_recommends_cpap: true }
              as: Physician
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "ScoringReport.${sr_id}.status == DRAFT"

      - name: titration_pressure_required_on_score
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.StudyOrder.IN_PROGRESS_to_SCORED
          - validations[priority=12]
          - errors[ERR_TITRATION_PRESSURE_REQUIRED]
        distinguishing_aspect: "score on an IN_LAB_TITRATION study without titration_optimal_cmh2o -> ERR_TITRATION_PRESSURE_REQUIRED (422); study stays IN_PROGRESS."
        test_recipe:
          setup: ["An IN_LAB_TITRATION study on a bed, started (IN_PROGRESS)."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Titr No Pres", date_of_birth: "1985-01-01", insurance_payer: "Acme" }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /beds"
              payload: { bed_label: "Room-10-Bed-A", turnover_buffer_minutes: 60 }
              as: SchedulingCoordinator
              captures: { bed_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_npi: "3232323232", requested_modality: "IN_LAB_PSG", clinical_indication: "OSA", prior_auth_required: false }
              as: SchedulingCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/approve-auth"
              payload: { prior_auth_number: "PA-32", prior_auth_expires_on: "2026-12-31" }
              as: SchedulingCoordinator
              captures: { ref_v2: $.data.version }
            - call: "POST /study-orders"
              payload: { referral_id: "${ref_id}", modality: "IN_LAB_TITRATION", expected_referral_version: "${ref_v2}" }
              as: SchedulingCoordinator
              captures: { so_id: $.data.id }
            - call: "POST /study-orders/${so_id}/schedule"
              payload: { night_start_utc: "2026-07-01T22:00:00Z", night_end_utc: "2026-07-02T06:00:00Z", bed_id: "${bed_id}" }
              as: SchedulingCoordinator
            - call: "POST /study-orders/${so_id}/start"
              payload: {}
              as: SleepTechnologist
              captures: { so_v: $.data.version }
          trigger:
            - call: "POST /study-orders/${so_id}/score"
              payload: { total_recording_minutes: 480, respiratory_event_count: 60, expected_study_order_version: "${so_v}" }
              as: SleepTechnologist
              captures: { err: $.data.error_id }
          assert:
