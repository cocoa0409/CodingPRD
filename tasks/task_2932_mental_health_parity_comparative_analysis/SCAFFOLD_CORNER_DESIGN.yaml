              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_id: $.data.id }
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "OUTPATIENT", network_tier: "IN_NETWORK", sub_classification: "OFFICE_VISITS", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_id: $.data.id }
            - call: "POST /parity/nqtl-items"
              payload: { plan_year_id: "${py_id}", classification_id: "${cls_id}", nqtl_type: "PRIOR_AUTHORIZATION", applied_to: "MENTAL_HEALTH_SUD_ONLY", description: "Prior authorization imposed on MH/SUD outpatient visits only." }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { item_id: $.data.id }
            - call: "POST /parity/vendor-requests"
              payload: { administrator_id: "${adm_id}", plan_year_id: "${py_id}", nqtl_item_id: "${item_id}", requested_item_count: 1, requested_submission_types: ["DENIAL_RATES"] }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { vr_id: $.data.id }
          trigger:
            - call: "POST /parity/vendor-requests/${vr_id}/data-submissions"
              payload: { classification_id: "${cls_id}", submission_type: "DENIAL_RATES", mh_denials: 300, mh_adjudicated_claims: 1000, ms_denials: 100, ms_adjudicated_claims: 1000 }
              as: Administrator
              as_user_id: "${adm_id}"
              captures: { sub_id: $.data.id, ratio_in_body: $.data.disparity_ratio, status_in_body: $.data.status }
            - call: "GET /parity/data-submissions/${sub_id}"
              payload: {}
              as: Regulator
              as_user_id: "user-regulator-01"
            - call: "GET /parity/nqtl-items/${item_id}"
              payload: {}
              as: Regulator
              as_user_id: "user-regulator-01"
            - call: "GET /parity/administrators/${adm_id}"
              payload: {}
              as: Regulator
              as_user_id: "user-regulator-01"
          assert:
            - "${status_in_body} == VALIDATED and ${ratio_in_body} == 3.0000 — the creation response already carries the derived verdict"
            - "the immediate GET of the submission returns exactly the same disparity_ratio 3.0000, mh_denial_rate 0.300000, ms_denial_rate 0.100000 and as_applied_flag true"
            - "the immediate GET of the item shows stringency_in_operation_index == 10.00 and stringency_flag == true with no intervening write"
            - "the immediate GET of the administrator shows validated production already counted: outstanding_request_count == 0 and cooperation_score == 100.00"
            - "VendorDataRequest.${vr_id}.fulfillment_status == FULFILLED in the same read, and PlanYear.${py_id}.compliance_posture == AT_RISK (the item is still INVENTORIED)"
