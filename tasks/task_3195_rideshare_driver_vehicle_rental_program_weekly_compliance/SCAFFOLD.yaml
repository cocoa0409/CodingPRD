scenario: |
  Rideshare Driver Vehicle Rental Program & Weekly Compliance (Hertz): driver
  eligibility verification against platform activity and driving record with
  program enrollment, weekly rental pricing including insurance, maintenance and
  mileage allowances with unlimited-mile provisions, vehicle assignment from a
  program-designated fleet with model restrictions and swap procedures, weekly
  renewal and payment collection with delinquency and vehicle recovery, platform
  integration confirming the vehicle qualifies for ride and delivery activity,
  maintenance and damage handling with loaner provisioning to avoid earnings
  interruption, program vehicle utilization and fleet sizing against driver
  demand, transition to purchase options and program exit

domain_name: "rideshare-rental-program"
api_prefix: "/program"

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Driver
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: driver legal name
      - name: email
        type: string
        source: input
        description: driver contact email; unique per driver
        constraints: "unique across Driver.email; case-insensitive comparison"
      - name: platform_driver_id
        type: string
        source: input
        description: external rideshare-platform driver identity used for activity verification
        constraints: "format PLT-<8 alphanumerics>; unique across Driver.platform_driver_id"
      - name: platform_activity_score
        type: integer
        source: input
        description: most recent platform activity score used by eligibility verification
        constraints: "0 <= value <= 100 inclusive"
      - name: driving_record_points
        type: integer
        source: input
        description: accumulated moving-violation points on the driving record (lower is safer)
        constraints: "0 <= value <= 12 inclusive"
      - name: license_class
        type: enum
        source: input
        description: license classification presented at enrollment
        constraints: "one of STANDARD | FOR_HIRE | COMMERCIAL"
      - name: program_driver_tier
        type: enum
        source: input
        description: program tier the driver was admitted at
        constraints: "one of TIER_1 | TIER_2 | TIER_3"
      - name: eligibility_status
        type: enum
        source: computed
        description: derived program eligibility posture recomputed by the driver_eligibility_score calculation
        default: PENDING
        constraints: "one of PENDING | ELIGIBLE | INELIGIBLE | SUSPENDED"

  - name: DriverEnrollment
    parent: null
    common_fields: true
    fields:
      - name: driver_id
        type: string
        source: input
        description: "FK -> Driver.id; the driver being enrolled in the rental program"
      - name: program_tier
        type: enum
        source: input
        description: tier requested for this enrollment
        constraints: "one of TIER_1 | TIER_2 | TIER_3"
      - name: activity_snapshot
        type: integer
        source: computed
        description: platform activity score captured at evaluation time
      - name: record_snapshot
        type: integer
        source: computed
        description: driving record points captured at evaluation time
      - name: eligibility_score
        type: integer
        source: computed
        description: composite 0..100 eligibility score produced by the driver_eligibility_score calculation
        constraints: "0 <= value <= 100 inclusive"
      - name: eligibility_decision
        type: enum
        source: computed
        description: decision recorded at evaluation time
        constraints: "one of APPROVED | DENIED | DEFERRED"
      - name: enrollment_status
        type: enum
        source: computed
        description: enrollment lifecycle state
        default: PENDING_VERIFICATION
        constraints: "one of PENDING_VERIFICATION | ACTIVE | REJECTED | SUSPENDED | WITHDRAWN"
      - name: verified_at
        type: datetime
        source: system
        description: ISO 8601 UTC instant the enrollment was verified; null until verified

  - name: ProgramVehicle
    parent: null
    common_fields: true
    fields:
      - name: vin
        type: string
        source: input
        description: vehicle identification number
        constraints: "17 characters; unique across ProgramVehicle.vin"
      - name: model_name
        type: string
        source: input
        description: program fleet model designation
      - name: model_year
        type: integer
        source: input
        description: model year of the unit
        constraints: "2018 <= value <= 2027 inclusive"
      - name: vehicle_class
        type: enum
        source: input
        description: program class determining which platform activities and models the unit may serve
        constraints: "one of STANDARD | XL | LUXURY | DELIVERY_VAN"
      - name: qualifies_ride
        type: boolean
        source: computed
        description: derived flag stating whether the unit may serve ride activity under its class
      - name: qualifies_delivery
        type: boolean
        source: computed
        description: derived flag stating whether the unit may serve delivery activity under its class
      - name: odometer_miles
        type: integer
        source: input
        description: current program odometer reading of the unit
        constraints: ">= 0; monotonically non-decreasing except through an explicit compensation"
      - name: baseline_odometer_miles
        type: integer
        source: system
        description: odometer reading at program admission, pinned so mileage invariants reconcile
      - name: vehicle_status
        type: enum
        source: computed
        description: fleet asset posture
        default: AVAILABLE
        constraints: "one of AVAILABLE | ASSIGNED | MAINTENANCE | RECOVERY | RETIRED"
      - name: assigned_driver_id
        type: string
        source: computed
        description: "FK -> Driver.id; driver currently holding the unit, null when unassigned"
      - name: region_code
        type: string
        source: input
        description: program region the unit is allocated to
        constraints: "two-letter uppercase region code"

  - name: RentalAgreement
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> DriverEnrollment.id; enrollment authorizing this agreement"
      - name: driver_id
        type: string
        source: input
        description: "FK -> Driver.id; driver holding the rental agreement"
      - name: vehicle_id
        type: string
        source: input
        description: "FK -> ProgramVehicle.id; unit currently assigned to the agreement"
      - name: weekly_rate_cents
        type: integer
        source: input
        description: base weekly program rate in cents
        constraints: ">= 0"
      - name: insurance_premium_cents
        type: integer
        source: input
        description: weekly insurance premium in cents bundled into the renewal
        constraints: ">= 0"
      - name: unlimited_mileage
        type: boolean
        source: input
        description: whether the agreement carries an unlimited-mile provision
        default: false
      - name: mileage_cap_miles
        type: integer
        source: input
        description: weekly included mileage when the agreement is metered; null when unlimited_mileage is true
      - name: maintenance_allowance_miles
        type: integer
        source: input
        description: mileage credited against maintenance wear for the agreement
        constraints: ">= 0"
      - name: compliance_posture
        type: enum
        source: computed
        description: derived posture gating renewal, swap and purchase operations on the agreement
        default: OPEN
        constraints: "one of OPEN | RESTRICTED | FROZEN"
      - name: agreement_status
        type: enum
        source: computed
        description: agreement lifecycle state
        default: DRAFT
        constraints: "one of DRAFT | ACTIVE | RENEWAL_DUE | DELINQUENT | RECOVERY_PENDING | RECOVERED | COMPLETED | PURCHASE_PENDING | PURCHASED"
      - name: current_week_number
        type: integer
        source: computed
        description: ordinal of the most recently opened rental week
        default: 0
      - name: total_billed_cents
        type: integer
        source: computed
        description: cumulative billed amount across settled weeks
        default: 0
      - name: total_waived_cents
        type: integer
        source: computed
        description: cumulative waived amount across weeks removed from billing
        default: 0
      - name: period_start
        type: datetime
        source: input
        description: contractual start instant of the agreement; occupancy interval lower bound
      - name: period_end
        type: datetime
        source: input
        description: contractual end instant of the agreement; occupancy interval upper bound

  - name: RentalWeek
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> RentalAgreement.id; agreement this weekly period belongs to"
      - name: vehicle_id
        type: string
        source: input
        description: "FK -> ProgramVehicle.id; unit the mileage accrued against"
      - name: week_number
        type: integer
        source: computed
        description: ordinal of this week within the agreement
      - name: period_start
        type: datetime
        source: computed
        description: start instant of the weekly period
      - name: period_end
        type: datetime
        source: computed
        description: end instant of the weekly period
      - name: miles_driven
        type: integer
        source: input
        description: miles recorded for the week
        default: 0
        constraints: ">= 0"
      - name: base_charge_cents
        type: integer
        source: computed
        description: base portion of the weekly renewal charge
      - name: insurance_charge_cents
        type: integer
        source: computed
        description: insurance portion of the weekly renewal charge
      - name: mileage_overage_cents
        type: integer
        source: computed
        description: mile overage portion of the weekly renewal charge
      - name: damage_charge_cents
        type: integer
        source: computed
        description: damage liability portion of the weekly renewal charge
      - name: platform_credit_cents
        type: integer
        source: computed
        description: platform activity credit applied against the renewal
      - name: amount_due_cents
        type: integer
        source: computed
        description: net amount owed for the weekly period
        default: 0
      - name: week_status
        type: enum
        source: computed
        description: weekly period lifecycle state
        default: SCHEDULED
        constraints: "one of SCHEDULED | OPEN | DUE | PAID | GRACE | DELINQUENT | DEFERRED | RECOVERED | WAIVED"
      - name: payment_status
        type: enum
        source: computed
        description: independent payment dimension evolving on the same week row
        default: UNPAID
        constraints: "one of UNPAID | PARTIAL | SETTLED | FAILED"
      - name: payment_deadline
        type: datetime
        source: computed
        description: instant the renewal payment becomes due
      - name: grace_deadline
        type: datetime
        source: computed
        description: instant the grace period lapses and the week flips to DELINQUENT

  - name: MaintenanceEvent
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> RentalAgreement.id; agreement the unit was rented under when the event was reported"
      - name: vehicle_id
        type: string
        source: input
        description: "FK -> ProgramVehicle.id; the unit taken out of service"
      - name: event_type
        type: enum
        source: input
        description: nature of the service event
        constraints: "one of SCHEDULED_SERVICE | UNSCHEDULED_REPAIR | DAMAGE_REPAIR"
      - name: odometer_at_service
        type: integer
        source: input
        description: odometer reading when the unit entered service
        constraints: ">= 0"
      - name: downtime_hours
        type: integer
        source: input
        description: hours the unit is expected to remain out of service
        default: 0
        constraints: ">= 0"
      - name: loaner_vehicle_id
        type: string
        source: computed
        description: "FK -> ProgramVehicle.id; loaner unit issued to avoid earnings interruption, null when none issued"
      - name: loaner_deadline
        type: datetime
        source: computed
        description: instant by which the loaner must be returned; null when no loaner is outstanding
      - name: event_status
        type: enum
        source: computed
        description: maintenance event lifecycle state
        default: REPORTED
        constraints: "one of REPORTED | IN_PROGRESS | LOANER_ISSUED | COMPLETED"
      - name: damage_liability_cents
        type: integer
        source: input
        description: damage amount apportioned to the driver for DAMAGE_REPAIR events
        default: 0
        constraints: ">= 0"
      - name: maintenance_allowance_applied_miles
        type: integer
        source: computed
        description: wear miles credited to the maintenance allowance at completion
      - name: earnings_interruption_hours
        type: integer
        source: computed
        description: hours of platform earnings the driver was protected against by a loaner

  - name: RentalPayment
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> RentalAgreement.id; agreement the payment applies to"
      - name: week_id
        type: string
        source: computed
        description: "FK -> RentalWeek.id; the weekly period this payment is applied to"
      - name: amount_cents
        type: integer
        source: input
        description: amount tendered in cents
        constraints: ">= 0"
      - name: coverage_cents
        type: computed
        source: computed
        description: portion of the tender allocated to the weekly amount due
      - name: platform_credit_cents
        type: computed
        source: computed
        description: portion of the tender allocated to platform activity credit
      - name: payment_outcome
        type: enum
        source: input
        description: outcome reported by the collection channel
        constraints: "one of SUCCEEDED | FAILED"
      - name: collected_at
        type: datetime
        source: system
        description: instant the payment attempt was recorded

  - name: PurchaseOption
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> RentalAgreement.id; agreement being converted to a purchase"
      - name: driver_id
        type: string
        source: input
        description: "FK -> Driver.id; driver eligible to elect the option"
      - name: option_status
        type: enum
        source: computed
        description: purchase option lifecycle state
        default: OFFERED
        constraints: "one of OFFERED | ELECTED | ESCROW_FUNDED | COMPLETED | WITHDRAWN"
      - name: purchase_price_cents
        type: integer
        source: input
        description: fixed buyout price quoted by the program
        constraints: ">= 0"
      - name: equity_credit_cents
        type: computed
        source: computed
        description: credit accrued from settled rental periods, net of waived amounts
        default: 0
      - name: escrow_required_cents
        type: integer
        source: computed
        description: recurring weekly escrow amount required while the option is ELECTED
      - name: escrow_balance_cents
        type: integer
        source: computed
        description: escrow balance accumulated by the option
        default: 0
      - name: escrow_weeks_required
        type: integer
        source: input
        description: number of weekly escrow periods required before the option can complete
        constraints: ">= 1"
      - name: escrow_weeks_funded
        type: integer
        source: computed
        description: count of weekly escrow periods already funded
        default: 0
      - name: elected_at
        type: datetime
        source: system
        description: instant the driver elected the option; null until elected

  - name: PlatformIntegration
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> RentalAgreement.id; agreement whose unit is being checked"
      - name: vehicle_id
        type: string
        source: input
        description: "FK -> ProgramVehicle.id; the unit submitted to the platform"
      - name: integration_result
        type: enum
        source: computed
        description: verdict returned to the platform for the submitted unit
        constraints: "one of QUALIFIED | REJECTED_RIDE | REJECTED_DELIVERY | REJECTED_MODEL"
      - name: ride_qualified
        type: boolean
        source: computed
        description: whether the unit was accepted for ride activity
      - name: delivery_qualified
        type: boolean
        source: computed
        description: whether the unit was accepted for delivery activity
      - name: model_restriction_hit
        type: boolean
        source: computed
        description: whether a model restriction prevented full qualification
      - name: checked_at
        type: datetime
        source: system
        description: instant the qualification check was evaluated

  - name: FleetFact
    parent: null
    common_fields: true
    fields:
      - name: region_code
        type: string
        source: input
        description: "two-letter uppercase region code the fact covers"
        constraints: "unique across FleetFact.region_code"
      - name: demand_units
        type: integer
        source: input
        description: driver demand expressed in vehicle units for the region
        constraints: ">= 0"
      - name: active_agreements_count
        type: computed
        source: computed
        description: count of agreements in an occupancy-holding state for the region
      - name: available_fleet_count
        type: computed
        source: computed
        description: count of units available for assignment in the region
      - name: utilization_bps
        type: computed
        source: computed
        description: fleet utilization expressed in basis points
        constraints: "0 <= value <= 20000 inclusive"
      - name: sizing_deficit_units
        type: computed
        source: computed
        description: signed gap between derived fleet units and demand units (positive = under-supplied)
      - name: fleet_fact_status
        type: enum
        source: computed
        description: region fleet posture
        constraints: "one of BALANCED | UNDER_SUPPLIED | OVER_SUPPLIED"

concurrency_rules:
  - rule_id: week-open-stale-agreement
    parent_entity: RentalAgreement
    write_endpoint: "POST /program/weeks"
    occ_field: "expected_agreement_version"
    description: |
      Opening the next weekly period against a RentalAgreement whose version has
      advanced since the client last observed it is rejected, because another
      writer has already opened or settled a period on that agreement and the
      caller's view of the agreement is therefore stale.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
  - rule_id: maintenance-report-stale-vehicle
    parent_entity: ProgramVehicle
    write_endpoint: "POST /program/maintenance-events"
    occ_field: "expected_vehicle_version"
    description: |
      Reporting a maintenance event against a ProgramVehicle whose version has
      advanced since the client last observed it is rejected, because the unit's
      assignment or odometer has moved on and the stale view would otherwise
      take the wrong unit out of service.
    error_id: ERR_STALE_VEHICLE_VERSION
    http_status: 412
  - rule_id: purchase-elect-stale-agreement
    parent_entity: RentalAgreement
    write_endpoint: "POST /program/purchase-options/{id}/elect"
    occ_field: "expected_agreement_version"
    description: |
      Electing a purchase option against a RentalAgreement whose version has
      advanced since the client last observed it is rejected, because the
      agreement's equity credit has been recomputed by a later settlement and
      the caller would otherwise elect against a stale credit balance.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

state_machines:
  - entity: Driver
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: ELIGIBLE
        trigger: "POST /program/enrollments/{id}/verify"
        actor: ComplianceOfficer
        preconditions:
          - "DriverEnrollment.enrollment_status == PENDING_VERIFICATION for the enrollment named by the path"
          - "DriverEnrollment.eligibility_decision == APPROVED"
        side_effects:
          - "DriverEnrollment.enrollment_status -> ACTIVE"
          - "DriverEnrollment.verified_at = logical clock instant"
          - "Driver.program_driver_tier = DriverEnrollment.program_tier"
      - from: PENDING
        to: INELIGIBLE
        trigger: "POST /program/enrollments/{id}/verify"
        actor: ComplianceOfficer
        preconditions:
          - "DriverEnrollment.eligibility_decision == DENIED"
        side_effects:
          - "DriverEnrollment.enrollment_status -> REJECTED"
      - from: ELIGIBLE
        to: SUSPENDED
        trigger: "system: the driver's RentalAgreement.compliance_posture enters FROZEN"
        actor: system
        preconditions:
          - "a RentalAgreement whose driver_id == Driver.id has compliance_posture == FROZEN"
        side_effects:
          - "Driver.eligibility_status -> SUSPENDED"
          - "the DriverEnrollment named by that RentalAgreement.enrollment_id transitions ACTIVE -> SUSPENDED, which is the fourth hop of the grace-lapse cascade"
        note: "hop 3 of the grace-lapse cascade; hop 4 fires from the DriverEnrollment transition this hop triggers"
      - from: SUSPENDED
        to: ELIGIBLE
        trigger: "POST /program/enrollments/{id}/reinstate"
        actor: ComplianceOfficer
        preconditions:
          - "no RentalAgreement whose driver_id == Driver.id has compliance_posture == FROZEN"
          - "DriverEnrollment.enrollment_status == SUSPENDED"
        side_effects:
          - "DriverEnrollment.enrollment_status SUSPENDED -> ACTIVE"
      - from: INELIGIBLE
        to: PENDING
        trigger: "POST /program/enrollments/{id}/re-evaluate"
        actor: ComplianceOfficer
        preconditions:
          - "DriverEnrollment.enrollment_status == REJECTED"
        side_effects:
          - "DriverEnrollment.enrollment_status REJECTED -> PENDING_VERIFICATION"
          - "DriverEnrollment.eligibility_score recomputed by driver_eligibility_score"

  - entity: DriverEnrollment
    initial_state: PENDING_VERIFICATION
    terminal_states: [WITHDRAWN]
    transitions:
      - from: PENDING_VERIFICATION
        to: ACTIVE
        trigger: "POST /program/enrollments/{id}/verify"
        actor: ComplianceOfficer
        preconditions:
          - "DriverEnrollment.eligibility_decision == APPROVED"
          - "Driver.eligibility_status == PENDING for DriverEnrollment.driver_id"
        side_effects:
          - "Driver.eligibility_status PENDING -> ELIGIBLE"
          - "Driver.eligibility_status = SUSPENDED is NOT set by this transition"
          - "DriverEnrollment.verified_at = logical clock instant"
      - from: PENDING_VERIFICATION
        to: REJECTED
        trigger: "POST /program/enrollments/{id}/verify"
        actor: ComplianceOfficer
        preconditions:
          - "DriverEnrollment.eligibility_decision == DENIED"
        side_effects:
          - "Driver.eligibility_status PENDING -> INELIGIBLE"
      - from: REJECTED
        to: PENDING_VERIFICATION
        trigger: "POST /program/enrollments/{id}/re-evaluate"
        actor: ComplianceOfficer
        preconditions:
          - "DriverEnrollment.enrollment_status == REJECTED"
        side_effects:
          - "Driver.eligibility_status INELIGIBLE -> PENDING"
          - "refresh DriverEnrollment.activity_snapshot from Driver.platform_activity_score"
          - "refresh DriverEnrollment.record_snapshot from Driver.driving_record_points"
          - "DriverEnrollment.eligibility_score recomputed by driver_eligibility_score"
        note: "cyclic edge — a rejected enrollment may be re-evaluated against fresh driver data"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: RentalAgreement.compliance_posture enters FROZEN"
        actor: system
        preconditions:
          - "a RentalAgreement with driver_id == this enrollment's Driver has compliance_posture == FROZEN"
        side_effects:
          - "Driver.eligibility_status ELIGIBLE -> SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /program/enrollments/{id}/reinstate"
        actor: ComplianceOfficer
        preconditions:
          - "no RentalAgreement with driver_id == this enrollment's Driver has compliance_posture == FROZEN"
        side_effects:
          - "Driver.eligibility_status SUSPENDED -> ELIGIBLE"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /program/enrollments/{id}/withdraw"
        actor: ComplianceOfficer
        preconditions:
          - "no RentalAgreement with enrollment_id == this enrollment has agreement_status IN {ACTIVE, RENEWAL_DUE, DELINQUENT, RECOVERY_PENDING, PURCHASE_PENDING}"
        side_effects:
          - "Driver.eligibility_status -> INELIGIBLE when the driver holds no other ACTIVE enrollment"
      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "POST /program/enrollments/{id}/withdraw"
        actor: ComplianceOfficer
        preconditions:
          - "RentalAgreement with enrollment_id == this enrollment has no agreement_status in {ACTIVE, RENEWAL_DUE, DELINQUENT, RECOVERY_PENDING, PURCHASE_PENDING}"
        side_effects:
          - "Driver.eligibility_status -> INELIGIBLE when the driver holds no other ACTIVE enrollment"

  - entity: RentalAgreementPosture
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system: outstanding_delinquent_weeks for the agreement transitions 0 -> 1"
        actor: system
        preconditions:
          - "RentalAgreement.compliance_posture == OPEN"
        side_effects:
          - "RentalAgreement.compliance_posture -> RESTRICTED"
      - from: RESTRICTED
        to: OPEN
        trigger: "system: outstanding_delinquent_weeks for the agreement returns to 0"
        actor: system
        preconditions:
          - "RentalAgreement.compliance_posture == RESTRICTED"
        side_effects:
          - "RentalAgreement.compliance_posture -> OPEN"
      - from: RESTRICTED
        to: FROZEN
        trigger: "system: outstanding_delinquent_weeks for the agreement reaches 2"
        actor: system
        preconditions:
          - "RentalAgreement.compliance_posture == RESTRICTED"
          - "outstanding_delinquent_weeks for this agreement >= 2"
        side_effects:
          - "RentalAgreement.compliance_posture -> FROZEN"
          - "Driver.eligibility_status ELIGIBLE -> SUSPENDED for RentalAgreement.driver_id, which is hop 3 of the grace-lapse cascade"
          - "ProgramVehicle.vehicle_status ASSIGNED -> RECOVERY for RentalAgreement.vehicle_id, a direct co-effect of the same posture change rather than a chained hop"
        note: "hop 2 of the grace-lapse cascade; hop 3 fires from the Driver transition this hop triggers, and hop 4 from the DriverEnrollment transition that hop 3 triggers"
      - from: FROZEN
        to: RESTRICTED
        trigger: "system: outstanding_delinquent_weeks for the agreement drops to 1"
        actor: system
        preconditions:
          - "RentalAgreement.compliance_posture == FROZEN"
        side_effects:
          - "RentalAgreement.compliance_posture -> RESTRICTED"

  - entity: RentalAgreement
    initial_state: DRAFT
    terminal_states: [COMPLETED, PURCHASED, RECOVERED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /program/agreements/{id}/activate"
        actor: FleetOpsAgent
        preconditions:
          - "DriverEnrollment.enrollment_status == ACTIVE for RentalAgreement.enrollment_id"
          - "Driver.eligibility_status == ELIGIBLE for RentalAgreement.driver_id"
          - "ProgramVehicle.vehicle_status == AVAILABLE for RentalAgreement.vehicle_id"
        side_effects:
          - "ProgramVehicle.vehicle_status AVAILABLE -> ASSIGNED"
          - "ProgramVehicle.assigned_driver_id = RentalAgreement.driver_id"
          - "ProgramVehicle.baseline_odometer_miles = ProgramVehicle.odometer_miles"
          - "RentalAgreement.compliance_posture -> OPEN"
          - "RentalAgreement.current_week_number = 0"
      - from: ACTIVE
        to: RENEWAL_DUE
        trigger: "POST /program/weeks"
        actor: FleetOpsAgent
        preconditions:
          - "RentalAgreement.agreement_status IN {ACTIVE, RENEWAL_DUE}"
          - "RentalAgreement.compliance_posture != FROZEN"
          - "the period running seven days from the logical clock instant does not extend past RentalAgreement.period_end"
        side_effects:
          - "RentalWeek created in SCHEDULED then auto-transitioned to OPEN within this request"
          - "RentalWeek.week_number = RentalAgreement.current_week_number + 1"
          - "RentalAgreement.current_week_number += 1"
          - "RentalAgreement.agreement_status -> RENEWAL_DUE"
          - "RentalAgreement.version += 1"
      - from: RENEWAL_DUE
        to: RENEWAL_DUE
        trigger: "POST /program/weeks"
        actor: FleetOpsAgent
        preconditions:
          - "RentalAgreement.agreement_status == RENEWAL_DUE"
          - "RentalAgreement.compliance_posture != FROZEN"
          - "the period running seven days from the logical clock instant does not extend past RentalAgreement.period_end"
        side_effects:
          - "RentalWeek created in SCHEDULED then auto-transitioned to OPEN within this request"
          - "RentalWeek.week_number = RentalAgreement.current_week_number + 1"
          - "RentalAgreement.current_week_number += 1"
          - "RentalAgreement.agreement_status stays RENEWAL_DUE"
          - "RentalAgreement.version += 1"
        note: "cyclic edge — an unsettled week blocks movement but does not block opening the next period"
      - from: RENEWAL_DUE
        to: ACTIVE
        trigger: "POST /program/weeks/{id}/payments"
        actor: SupportAgent
        preconditions:
          - "RentalWeek.week_status == DUE or GRACE for the week named by the path"
          - "RentalWeek.payment_status == SETTLED after this payment"
        side_effects:
          - "RentalAgreement.agreement_status -> ACTIVE when no RentalWeek of this agreement has week_status == DELINQUENT"
          - "RentalAgreement.agreement_status -> DELINQUENT when any RentalWeek of this agreement has week_status == DELINQUENT"
          - "recompute purchase_option_equity_credit"
      - from: RENEWAL_DUE
        to: DELINQUENT
        trigger: "POST /program/weeks/{id}/grace-lapse"
        actor: ComplianceOfficer
        preconditions:
          - "RentalWeek.week_status == GRACE for the week named by the path"
          - "logical clock >= RentalWeek.grace_deadline"
        side_effects:
          - "RentalAgreement.agreement_status -> DELINQUENT"
          - "recompute outstanding_delinquent_weeks then apply RentalAgreementPosture transitions"
      - from: DELINQUENT
        to: ACTIVE
        trigger: "POST /program/weeks/{id}/payments"
        actor: SupportAgent
        preconditions:
          - "RentalWeek.week_status == DELINQUENT for the week named by the path"
          - "tendered amount_cents minus applied platform credit >= RentalWeek.amount_due_cents"
        side_effects:
          - "RentalAgreement.agreement_status -> ACTIVE when outstanding_delinquent_weeks becomes 0"
          - "recompute outstanding_delinquent_weeks then apply RentalAgreementPosture transitions"
      - from: DELINQUENT
        to: RECOVERY_PENDING
        trigger: "POST /program/agreements/{id}/escalate-recovery"
        actor: FleetOpsAgent
        preconditions:
          - "RentalAgreement.agreement_status == DELINQUENT"
          - "RentalAgreement.compliance_posture == FROZEN"
          - "outstanding_delinquent_weeks >= 2"
        side_effects:
          - "RentalAgreement.agreement_status -> RECOVERY_PENDING"
          - "DriverEnrollment.enrollment_status -> WITHDRAWN when no RentalAgreement of this enrollment has agreement_status IN {ACTIVE, RENEWAL_DUE, DELINQUENT, RECOVERY_PENDING, PURCHASE_PENDING}"
          - "ProgramVehicle.vehicle_status remains RECOVERY until POST /agreements/{id}/recover returns the unit to AVAILABLE"
      - from: RECOVERY_PENDING
        to: RECOVERED
        trigger: "POST /program/agreements/{id}/recover"
        actor: FleetOpsAgent
        preconditions:
          - "RentalAgreement.agreement_status == RECOVERY_PENDING"
          - "ProgramVehicle.vehicle_status == RECOVERY for RentalAgreement.vehicle_id"
        side_effects:
          - "ProgramVehicle.vehicle_status RECOVERY -> AVAILABLE"
          - "ProgramVehicle.assigned_driver_id = null"
          - "the unit's recovery interval stays open for 24 hours past this instant, in which no maintenance event may be reported against it"
          - "every RentalWeek of this agreement with week_status == DELINQUENT -> RECOVERED"
      - from: RECOVERY_PENDING
        to: ACTIVE
        trigger: "POST /program/weeks/{id}/payments"
        actor: SupportAgent
        preconditions:
          - "RentalAgreement.compliance_posture == FROZEN"
          - "every RentalWeek of this agreement with week_status == DELINQUENT is cured by this payment"
        side_effects:
          - "recompute outstanding_delinquent_weeks then apply RentalAgreementPosture transitions"
          - "ProgramVehicle.vehicle_status RECOVERY -> ASSIGNED when outstanding_delinquent_weeks == 0"
          - "ProgramVehicle.assigned_driver_id = RentalAgreement.driver_id when outstanding_delinquent_weeks == 0"
          - "Driver.eligibility_status SUSPENDED -> ELIGIBLE when outstanding_delinquent_weeks == 0"
        note: "cyclic edge — recovery is reversible by full cure"
      - from: ACTIVE
        to: PURCHASE_PENDING
        trigger: "POST /program/purchase-options/{id}/elect"
        actor: Driver
        preconditions:
          - "RentalAgreement.compliance_posture == OPEN"
          - "outstanding_delinquent_weeks == 0"
          - "PurchaseOption.option_status == OFFERED"
          - "PurchaseOption.agreement_id == RentalAgreement.id"
        side_effects:
          - "every RentalWeek of this agreement with week_status == OPEN transitions to DEFERRED, which is hop 3 of the purchase-election cascade"
          - "purchase_escrow_schedule recomputed"
      - from: PURCHASE_PENDING
        to: ACTIVE
        trigger: "POST /program/purchase-options/{id}/withdraw"
        actor: Driver
        preconditions:
          - "PurchaseOption.option_status == ELECTED"
        side_effects:
          - "PurchaseOption.option_status -> WITHDRAWN"
          - "RentalWeek week_status DEFERRED -> OPEN for the deferred week of this agreement"
          - "RentalAgreement.agreement_status -> ACTIVE"
      - from: PURCHASE_PENDING
        to: PURCHASED
        trigger: "POST /program/purchase-options/{id}/complete"
        actor: PlatformAdmin
        preconditions:
          - "PurchaseOption.escrow_weeks_funded >= PurchaseOption.escrow_weeks_required"
          - "PurchaseOption.escrow_balance_cents + PurchaseOption.equity_credit_cents >= PurchaseOption.purchase_price_cents"
        side_effects:
          - "PurchaseOption.option_status -> COMPLETED"
          - "ProgramVehicle.vehicle_status ASSIGNED -> RETIRED"
          - "ProgramVehicle.assigned_driver_id = null"
          - "RentalAgreement.agreement_status -> PURCHASED"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /program/agreements/{id}/complete"
        actor: FleetOpsAgent
        preconditions:
          - "no RentalWeek of this agreement has week_status IN {DUE, GRACE, DELINQUENT}"
          - "PurchaseOption for this agreement does not have option_status == ELECTED"
        side_effects:
          - "ProgramVehicle.vehicle_status ASSIGNED -> AVAILABLE"
          - "ProgramVehicle.assigned_driver_id = null"
          - "RentalAgreement.agreement_status -> COMPLETED"

  - entity: RentalWeek
    initial_state: SCHEDULED
    terminal_states: [PAID, RECOVERED, WAIVED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "system: auto-transition inside POST /weeks"
        actor: system
        preconditions:
          - "RentalWeek was created by this request"
        side_effects:
          - "RentalWeek.week_status -> OPEN"
          - "RentalWeek.period_start = logical clock instant"
          - "RentalWeek.period_end = period_start + 7 days"
          - "recompute weekly_renewal_charge (provisional variant)"
      - from: OPEN
        to: DUE
        trigger: "POST /program/weeks/{id}/settle"
        actor: ComplianceOfficer
        preconditions:
          - "RentalWeek.week_status == OPEN"
          - "RentalAgreement.compliance_posture != FROZEN for RentalWeek.agreement_id"
          - "miles_driven cycle is closed for this week"
        side_effects:
          - "recompute weekly_renewal_charge (final variant) into base_charge_cents, insurance_charge_cents, mileage_overage_cents, platform_credit_cents"
          - "RentalWeek.damage_charge_cents recomputed by damage_settlement_split"
          - "RentalWeek.amount_due_cents = base + insurance + mileage_overage + damage - platform_credit"
          - "RentalWeek.payment_deadline = period_end"
          - "RentalWeek.grace_deadline = payment_deadline + 72 hours"
          - "RentalWeek.week_status -> DUE"
      - from: DUE
        to: GRACE
        trigger: "POST /program/_clock/set_current_utc crossing RentalWeek.payment_deadline"
        actor: system
        preconditions:
          - "logical clock >= RentalWeek.payment_deadline"
          - "RentalWeek.payment_status != SETTLED"
        side_effects:
          - "RentalWeek.week_status -> GRACE"
      - from: GRACE
        to: DELINQUENT
        trigger: "POST /program/weeks/{id}/grace-lapse"
        actor: ComplianceOfficer
        preconditions:
          - "RentalWeek.week_status == GRACE"
          - "logical clock >= RentalWeek.grace_deadline"
        side_effects:
          - "RentalWeek.week_status -> DELINQUENT"
          - "RentalWeek.payment_status -> FAILED"
          - "recompute outstanding_delinquent_weeks for RentalWeek.agreement_id"
          - "RentalAgreementPosture transitions applied from the recomputed outstanding_delinquent_weeks"
          - "RentalAgreement.agreement_status -> DELINQUENT"
        note: "hop 1 of the depth-3 grace-lapse cascade; hops 2-4 fire from the posture transition this hop triggers"
      - from: DUE
        to: PAID
        trigger: "POST /program/weeks/{id}/payments"
        actor: SupportAgent
        preconditions:
          - "tendered amount_cents minus applied platform credit >= RentalWeek.amount_due_cents"
        side_effects:
          - "RentalWeek.week_status -> PAID"
          - "RentalWeek.payment_status -> SETTLED"
          - "RentalAgreement.total_billed_cents += RentalWeek.amount_due_cents"
          - "recompute purchase_option_equity_credit"
      - from: GRACE
        to: PAID
        trigger: "POST /program/weeks/{id}/payments"
        actor: SupportAgent
        preconditions:
          - "tendered amount_cents minus applied platform credit >= RentalWeek.amount_due_cents"
        side_effects:
          - "RentalWeek.week_status -> PAID"
          - "RentalWeek.payment_status -> SETTLED"
          - "RentalAgreement.total_billed_cents += RentalWeek.amount_due_cents"
          - "recompute purchase_option_equity_credit"
      - from: DELINQUENT
        to: PAID
        trigger: "POST /program/weeks/{id}/payments"
        actor: SupportAgent
        preconditions:
          - "tendered amount_cents minus applied platform credit >= RentalWeek.amount_due_cents"
        side_effects:
          - "RentalWeek.week_status -> PAID"
          - "RentalWeek.payment_status -> SETTLED"
          - "RentalAgreement.total_billed_cents += RentalWeek.amount_due_cents"
          - "recompute outstanding_delinquent_weeks for RentalWeek.agreement_id"
          - "RentalAgreementPosture transitions applied from the recomputed outstanding_delinquent_weeks"
          - "recompute purchase_option_equity_credit"
      - from: DELINQUENT
        to: OPEN
        trigger: "POST /program/weeks/{id}/reopen"
        actor: ComplianceOfficer
        preconditions:
          - "RentalWeek.week_status == DELINQUENT"
          - "RentalAgreement.compliance_posture == RESTRICTED for RentalWeek.agreement_id"
          - "Driver.eligibility_status == ELIGIBLE for RentalAgreement.driver_id"
        side_effects:
          - "RentalWeek.week_status -> OPEN"
          - "RentalWeek.payment_status -> UNPAID"
          - "RentalWeek.payment_deadline = logical clock instant + 7 days"
          - "RentalWeek.grace_deadline = payment_deadline + 72 hours"
          - "recompute outstanding_delinquent_weeks for RentalWeek.agreement_id"
          - "RentalAgreementPosture transitions applied from the recomputed outstanding_delinquent_weeks"
        note: "cyclic edge — an administratively reopened week re-enters the metered cycle"
      - from: OPEN
        to: DEFERRED
        trigger: "POST /program/purchase-options/{id}/elect"
        actor: Driver
        preconditions:
          - "RentalWeek.week_status == OPEN"
          - "RentalWeek.agreement_id == PurchaseOption.agreement_id"
        side_effects:
          - "maintenance of the deferred week is charged at escrow rates"
        note: "hop 2 of the depth-2 purchase-election cascade"
      - from: DEFERRED
        to: OPEN
        trigger: "POST /program/purchase-options/{id}/withdraw"
        actor: Driver
        preconditions:
          - "RentalWeek.week_status == DEFERRED"
          - "PurchaseOption.option_status == WITHDRAWN for RentalWeek.agreement_id after this request"
        side_effects:
          - "RentalWeek.week_status -> OPEN"
          - "RentalWeek.payment_deadline = logical clock instant + 7 days"
          - "RentalWeek.grace_deadline = payment_deadline + 72 hours"
        note: "hop 3 of the purchase-withdrawal reversal, the mirror of the election deferral"
      - from: DUE
        to: WAIVED
        trigger: "POST /program/weeks/{id}/waive"
        actor: PlatformAdmin
        preconditions:
          - "RentalWeek.week_status IN {DUE, GRACE, DELINQUENT}"
          - "PurchaseOption for RentalWeek.agreement_id does not have option_status == ELECTED"
        side_effects:
          - "RentalWeek.week_status -> WAIVED"
          - "RentalAgreement.total_waived_cents += RentalWeek.amount_due_cents"
          - "recompute outstanding_delinquent_weeks for RentalWeek.agreement_id"
          - "RentalAgreementPosture transitions applied from the recomputed outstanding_delinquent_weeks"
          - "recompute purchase_option_equity_credit"
      - from: DELINQUENT
        to: RECOVERED
        trigger: "POST /program/agreements/{id}/recover"
        actor: FleetOpsAgent
        preconditions:
          - "RentalWeek.week_status == DELINQUENT"
          - "RentalAgreement.agreement_status == RECOVERY_PENDING"
        side_effects:
          - "RentalWeek.week_status -> RECOVERED"
      - from: UNPAID_DIMENSION
        to: PARTIAL_DIMENSION
        trigger: "POST /program/weeks/{id}/payments with a tender below amount_due_cents"
        actor: SupportAgent
        preconditions:
          - "RentalWeek.payment_status == UNPAID"
          - "tendered amount_cents > 0"
          - "tendered amount_cents < RentalWeek.amount_due_cents"
        side_effects:
          - "RentalWeek.payment_status -> PARTIAL"
          - "RentalWeek.amount_due_cents -= tendered amount_cents"
          - "RentalWeek coverage_cents recomputed by weekly_renewal_charge"
        note: "payment dimension is independent of the week_status dimension on the same row"
      - from: PARTIAL_DIMENSION
        to: SETTLED_DIMENSION
        trigger: "POST /program/weeks/{id}/payments covering the remaining amount_due_cents"
        actor: SupportAgent
        preconditions:
          - "RentalWeek.payment_status == PARTIAL"
          - "tendered amount_cents >= RentalWeek.amount_due_cents"
        side_effects:
          - "RentalWeek.payment_status -> SETTLED"
      - from: UNPAID_DIMENSION
        to: FAILED_DIMENSION
        trigger: "POST /program/weeks/{id}/payments with payment_outcome FAILED"
        actor: SupportAgent
        preconditions:
          - "RentalWeek.payment_status IN {UNPAID, PARTIAL}"
        side_effects:
          - "RentalWeek.payment_status -> FAILED"
      - from: FAILED_DIMENSION
        to: UNPAID_DIMENSION
        trigger: "POST /program/weeks/{id}/retry-payment"
        actor: SupportAgent
        preconditions:
          - "RentalWeek.payment_status == FAILED"
        side_effects:
          - "RentalWeek.payment_status -> UNPAID"
        note: "cyclic edge on the payment dimension"
      - from: FAILED_DIMENSION
        to: SETTLED_DIMENSION
        trigger: "POST /program/weeks/{id}/retry-payment with payment_outcome SUCCEEDED"
        actor: SupportAgent
        preconditions:
          - "RentalWeek.payment_status == FAILED"
          - "tendered amount_cents >= RentalWeek.amount_due_cents"
        side_effects:
          - "RentalWeek.payment_status -> SETTLED"

  - entity: MaintenanceEvent
    initial_state: REPORTED
    terminal_states: [COMPLETED]
    transitions:
      - from: REPORTED
        to: IN_PROGRESS
        trigger: "POST /program/maintenance-events/{id}/start"
        actor: FleetOpsAgent
        preconditions:
          - "MaintenanceEvent.event_status == REPORTED"
          - "ProgramVehicle.vehicle_status == MAINTENANCE for MaintenanceEvent.vehicle_id"
        side_effects:
          - "MaintenanceEvent.event_status -> IN_PROGRESS"
      - from: REPORTED
        to: COMPLETED
        trigger: "POST /program/maintenance-events/{id}/complete"
        actor: FleetOpsAgent
        preconditions:
          - "MaintenanceEvent.event_status IN {REPORTED, IN_PROGRESS}"
          - "MaintenanceEvent.downtime_hours == 0"
        side_effects:
          - "MaintenanceEvent.event_status -> COMPLETED"
          - "MaintenanceEvent.maintenance_allowance_applied_miles = 0"
          - "ProgramVehicle.vehicle_status MAINTENANCE -> ASSIGNED"
          - "recompute damage_settlement_split into RentalWeek.damage_charge_cents for the open week"
        note: "zero-downtime service path — no loaner is ever issued"
      - from: IN_PROGRESS
        to: LOANER_ISSUED
        trigger: "POST /program/maintenance-events/{id}/issue-loaner"
        actor: FleetOpsAgent
        preconditions:
          - "MaintenanceEvent.event_status == IN_PROGRESS"
          - "MaintenanceEvent.downtime_hours > 24"
          - "RentalAgreement.compliance_posture != FROZEN for MaintenanceEvent.agreement_id"
          - "the loaner candidate pool is non-empty, where the pool is every ProgramVehicle with region_code equal to the agreement's assigned unit's region_code and vehicle_class equal to the agreement's assigned unit's vehicle_class and vehicle_status == AVAILABLE and id != MaintenanceEvent.vehicle_id"
        side_effects:
          - "the loaner is the pool member with the smallest odometer_miles; ties are broken by the earliest created_at, and id is never consulted"
          - "MaintenanceEvent.loaner_vehicle_id = the selected ProgramVehicle.id"
          - "MaintenanceEvent.loaner_deadline = logical clock instant + MaintenanceEvent.downtime_hours"
          - "MaintenanceEvent.event_status -> LOANER_ISSUED"
          - "ProgramVehicle (loaner).vehicle_status AVAILABLE -> ASSIGNED"
          - "ProgramVehicle (loaner).assigned_driver_id = RentalAgreement.driver_id"
          - "MaintenanceEvent.earnings_interruption_hours = 0"
        note: "forward action of the assigned-fleet-units invariant; the loaner replaces the unit taken out of service so the assigned count is conserved. When the candidate pool is empty this transition is unavailable and the request is rejected with ERR_LOANER_UNAVAILABLE; no synthetic or non-conforming unit is ever substituted."
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /program/maintenance-events/{id}/complete"
        actor: FleetOpsAgent
        preconditions:
          - "MaintenanceEvent.downtime_hours > 0"
          - "MaintenanceEvent.downtime_hours <= 24"
        side_effects:
          - "MaintenanceEvent.event_status -> COMPLETED"
          - "ProgramVehicle.vehicle_status MAINTENANCE -> ASSIGNED"
          - "MaintenanceEvent.earnings_interruption_hours = MaintenanceEvent.downtime_hours"
          - "MaintenanceEvent.maintenance_allowance_applied_miles = min(MaintenanceEvent.downtime_hours, RentalAgreement.maintenance_allowance_miles)"
          - "recompute damage_settlement_split into RentalWeek.damage_charge_cents for the open week"
      - from: LOANER_ISSUED
        to: COMPLETED
        trigger: "POST /program/maintenance-events/{id}/complete"
        actor: FleetOpsAgent
        preconditions:
          - "MaintenanceEvent.event_status == LOANER_ISSUED"
          - "MaintenanceEvent.loaner_vehicle_id is set"
        side_effects:
          - "MaintenanceEvent.event_status -> COMPLETED"
          - "ProgramVehicle (loaner).vehicle_status ASSIGNED -> AVAILABLE"
          - "ProgramVehicle (loaner).assigned_driver_id = null"
          - "ProgramVehicle (original).vehicle_status MAINTENANCE -> ASSIGNED"
          - "ProgramVehicle (original).assigned_driver_id = RentalAgreement.driver_id"
          - "MaintenanceEvent.earnings_interruption_hours = 0"
          - "MaintenanceEvent.maintenance_allowance_applied_miles = min(round(MaintenanceEvent.downtime_hours / 8), RentalAgreement.maintenance_allowance_miles)"
          - "recompute damage_settlement_split into RentalWeek.damage_charge_cents for the open week"
        note: "compensating action of the assigned-fleet-units invariant — the loaner is released and the original unit resumes assignment"

  - entity: PurchaseOption
    initial_state: OFFERED
    terminal_states: [COMPLETED, WITHDRAWN]
    transitions:
      - from: OFFERED
        to: ELECTED
        trigger: "POST /program/purchase-options/{id}/elect"
        actor: Driver
        preconditions:
          - "PurchaseOption.option_status == OFFERED"
          - "RentalAgreement.compliance_posture == OPEN for PurchaseOption.agreement_id"
        side_effects:
          - "PurchaseOption.option_status -> ELECTED and elected_at stamped, which is hop 1 of the purchase-election cascade"
          - "RentalAgreement.agreement_status ACTIVE -> PURCHASE_PENDING for PurchaseOption.agreement_id, which is hop 2 of the purchase-election cascade"
        note: "hop 1 of the purchase-election cascade; hop 2 fires from the RentalAgreement transition this hop triggers, and hop 3 from the RentalWeek transition that hop 2 triggers"
      - from: ELECTED
        to: ESCROW_FUNDED
        trigger: "POST /program/purchase-options/{id}/fund-escrow"
        actor: Driver
        preconditions:
          - "PurchaseOption.option_status IN {ELECTED, ESCROW_FUNDED}"
          - "PurchaseOption.escrow_weeks_funded < PurchaseOption.escrow_weeks_required"
        side_effects:
          - "PurchaseOption.escrow_balance_cents += PurchaseOption.escrow_required_cents"
          - "PurchaseOption.escrow_weeks_funded += 1"
          - "PurchaseOption.option_status -> ESCROW_FUNDED"
          - "recompute purchase_option_equity_credit"
          - "PurchaseOption.agreement_id's RentalAgreement.version += 1"
      - from: ESCROW_FUNDED
        to: ELECTED
        trigger: "POST /program/purchase-options/{id}/fund-escrow"
        actor: Driver
        preconditions:
          - "PurchaseOption.escrow_weeks_funded < PurchaseOption.escrow_weeks_required"
        side_effects:
          - "PurchaseOption.escrow_balance_cents += PurchaseOption.escrow_required_cents"
          - "PurchaseOption.escrow_weeks_funded += 1"
        note: "cyclic edge — each funded week returns the option to the pre-funding state until the required count is reached"
      - from: ESCROW_FUNDED
        to: COMPLETED
        trigger: "POST /program/purchase-options/{id}/complete"
        actor: PlatformAdmin
        preconditions:
          - "PurchaseOption.escrow_weeks_funded >= PurchaseOption.escrow_weeks_required"
          - "PurchaseOption.escrow_balance_cents + PurchaseOption.equity_credit_cents >= PurchaseOption.purchase_price_cents"
        side_effects:
          - "PurchaseOption.option_status -> COMPLETED"
      - from: OFFERED
        to: WITHDRAWN
        trigger: "POST /program/purchase-options/{id}/withdraw"
        actor: Driver
        preconditions:
          - "PurchaseOption.option_status IN {OFFERED, ELECTED}"
        side_effects:
          - "PurchaseOption.option_status -> WITHDRAWN"

  - entity: FleetFact
    initial_state: BALANCED
    terminal_states: []
    transitions:
      - from: BALANCED
        to: UNDER_SUPPLIED
        trigger: "POST /program/fleet-facts/{id}/recompute"
        actor: PlatformAdmin
        preconditions:
          - "sizing_deficit_units > 0 after recomputation"
        side_effects:
          - "FleetFact.fleet_fact_status -> UNDER_SUPPLIED"
      - from: BALANCED
        to: OVER_SUPPLIED
        trigger: "POST /program/fleet-facts/{id}/recompute"
        actor: PlatformAdmin
        preconditions:
          - "sizing_deficit_units < 0 after recomputation"
        side_effects:
          - "FleetFact.fleet_fact_status -> OVER_SUPPLIED"
      - from: UNDER_SUPPLIED
        to: BALANCED
        trigger: "POST /program/fleet-facts/{id}/recompute"
        actor: PlatformAdmin
        preconditions:
          - "sizing_deficit_units == 0 after recomputation"
        side_effects:
          - "FleetFact.fleet_fact_status -> BALANCED"
      - from: OVER_SUPPLIED
        to: BALANCED
        trigger: "POST /program/fleet-facts/{id}/recompute"
        actor: PlatformAdmin
        preconditions:
          - "sizing_deficit_units == 0 after recomputation"
        side_effects:
          - "FleetFact.fleet_fact_status -> BALANCED"

calculations:
  - name: weekly_renewal_charge
    trigger: "RentalWeek SCHEDULED -> OPEN (provisional variant) and POST /weeks/{id}/settle (final variant)"
    algorithm: tiered_pricing
    input_set: "exactly one RentalWeek plus its RentalAgreement; only the week named by the request enters the computation"
    formula: |
      # evaluation order is pinned and MUST be followed literally:
      #   base -> insurance -> mileage_overage -> damage_charge -> platform_credit -> amount_due
      base_charge_cents     = agreement.weekly_rate_cents
      insurance_charge_cents = agreement.insurance_premium_cents
      if agreement.unlimited_mileage:
          mileage_overage_cents = 0
      else:
          over = max(0, miles_driven - agreement.mileage_cap_miles)
          mileage_overage_cents = round_half_up(over * MILEAGE_OVERAGE_RATE_CENTS_PER_MILE)
      amount_due_cents = (base_charge_cents + insurance_charge_cents
                          + mileage_overage_cents + damage_charge_cents
                          - platform_credit_cents)
    constants:
      MILEAGE_OVERAGE_RATE_CENTS_PER_MILE: 25
      PLATFORM_CREDIT_CAP_CENTS: 600
    precision: "integer cents throughout; no intermediate rounding except the single round_half_up on mileage_overage_cents"
    variants:
      - name: provisional_at_open
        when: "RentalWeek enters OPEN, before miles are final"
        difference: "mileage_overage_cents = 0 and damage_charge_cents = 0, so amount_due_cents equals weekly_rate_cents + insurance_premium_cents - platform_credit_cents"
      - name: final_at_settlement
        when: "POST /weeks/{id}/settle closes the mile cycle"
        difference: "mileage_overage_cents uses the recorded miles_driven (0 when unlimited_mileage is true) and damage_charge_cents carries the settled damage liability, so the same week yields a strictly larger amount_due_cents than the provisional variant whenever miles_driven exceeds mileage_cap_miles or damage_charge_cents > 0"

  - name: platform_activity_credit
    trigger: "POST /weeks/{id}/settle; also recomputed whenever Driver.platform_activity_score changes via POST /drivers/{id}/activity"
    algorithm: threshold
    input_set: "the Driver named by RentalAgreement.driver_id and the tier band recorded on DriverEnrollment.program_tier; only weeks in state OPEN are recomputed"
    formula: |
      # marginal bands: each point falls in exactly one band; the bands are
      # cumulative, so a point at the boundary is credited at the upper band.
      points = driver.platform_activity_score
      if points < 50:
          credit_cents = 0
      elif points < 75:                       # 50 <= points <= 74
          credit_cents = (points - 50 + 1) * PLATFORM_CREDIT_PER_ACTIVITY_POINT_CENTS
      else:                                    # points >= 75
          credit_cents = (75 - 50) * PLATFORM_CREDIT_PER_ACTIVITY_POINT_CENTS \
                         + (points - 75 + 1) * PLATFORM_CREDIT_PER_ACTIVITY_POINT_CENTS \
                           * TIER_3_CREDIT_MULTIPLIER_NUM \
                           // TIER_3_CREDIT_MULTIPLIER_DEN
      if enrollment.program_tier == "TIER_3":   # tier multiplier applied once, after the band sum
          credit_cents = credit_cents * TIER_3_MULTIPLIER_NUM // TIER_3_MULTIPLIER_DEN
      credit_cents = min(credit_cents, PLATFORM_CREDIT_CAP_CENTS)
    constants:
      PLATFORM_CREDIT_PER_ACTIVITY_POINT_CENTS: 10
      PLATFORM_CREDIT_CAP_CENTS: 600
      PROGRAM_ACTIVITY_FLOOR: 50
      TIER_3_CREDIT_MULTIPLIER_NUM: 3
      TIER_3_CREDIT_MULTIPLIER_DEN: 2
      TIER_3_MULTIPLIER_NUM: 5
      TIER_3_MULTIPLIER_DEN: 4
    precision: "integer cents; floor division is applied at each multiplier step, in the order written; the cap is applied last"
    variants:
      - name: platform_credit
        when: "the credit is derived from the platform activity score alone"
        difference: "credit_cents for platform_activity_score 60 is 110, for 75 is 265, and for 100 is 640 raised from the band sum and then capped to 600"
      - name: renewal_credit
        when: "the credit is derived from the schedule actually billed in RentalPayment rows for the agreement"
        difference: "renewal_credit_cents counts only RentalPayment rows with payment_outcome SUCCEEDED applied to weeks that settled, so a partially tendered week contributes its coverage_cents while a waived week contributes nothing"
    note: "renewal_credit_cents is exposed by GET /agreements/{id}/summary and is never substituted back into RentalWeek.platform_credit_cents, which always carries the platform_credit variant"

  - name: driver_eligibility_score
    trigger: "POST /enrollments and POST /enrollments/{id}/re-evaluate"
    algorithm: weighted_scoring
    input_set: "the Driver named by DriverEnrollment.driver_id; the driving record points are read before any eligibility bonus is applied"
    formula: |
      score = 100
      pts = driver.driving_record_points
      if pts <= 3:
          score -= pts * 5
      elif pts <= 6:
          score -= 3 * 5
          score -= (pts - 3) * 10
      else:
          score -= 3 * 5
          score -= 3 * 10
          score -= (pts - 6) * 20
      score = max(0, score)                     # floor
      activity = driver.platform_activity_score
      if score <= 40 and activity >= 90:        # escalation bonus applied AFTER the floor
          score += 15
      score = min(100, score)                   # ceiling
      # decision mapping, applied after the score is final:
      #   APPROVED  when score >= APPROVE_SCORE_AT_OR_ABOVE and activity >= APPROVE_ACTIVITY_AT_OR_ABOVE
      #   DEFERRED  when score >= APPROVE_SCORE_AT_OR_ABOVE and activity <  APPROVE_ACTIVITY_AT_OR_ABOVE
      #   DENIED    when score <  APPROVE_SCORE_AT_OR_ABOVE
    constants:
      BONUS_REQUIRES_SCORE_AT_OR_BELOW: 40
      BONUS_REQUIRES_ACTIVITY_AT_OR_ABOVE: 90
      BONUS_POINTS: 15
      APPROVE_SCORE_AT_OR_ABOVE: 60
      APPROVE_ACTIVITY_AT_OR_ABOVE: 70
    precision: "integer; floor applied before the escalation bonus, ceiling applied after it"
    variants:
      - name: standard_evaluation
        when: "the driver is evaluated under the ordinary weighting"
        difference: "driving_record_points 4 and activity 95 yields 70, because the escalation bonus requires the floored score to be 40 or less"
      - name: escalated_evaluation
        when: "the bonus applies after the floor"
        difference: "driving_record_points 8 and activity 90 yields 30, because (8-6)*20 is counted after the floor of the first term and the bonus lands on top"

  - name: outstanding_delinquent_weeks
    trigger: "recomputed at the end of any transition that changes a RentalWeek.week_status for the agreement"
    algorithm: aggregation
    input_set: "all RentalWeek rows whose agreement_id equals the agreement, taken regardless of payment_status, counted by their week_status"
    formula: |
      outstanding_delinquent_weeks = count(
          week for week in RentalWeek
          if week.agreement_id == agreement.id and week.week_status == "DELINQUENT")
      # this single integer drives the RentalAgreementPosture transitions:
      #   0 -> OPEN, 1 -> RESTRICTED, >= 2 -> FROZEN
    constants:
      POSTURE_RESTRICTED_AT: 1
      POSTURE_FROZEN_AT: 2
    precision: "exact integer count; no rounding; recalculated from the full week set, never incrementally adjusted"
    variants: []

  - name: platform_qualification_verdict
    trigger: "POST /program/platform-checks and POST /program/platform-checks/{id}"
    algorithm: threshold
    input_set: "the ProgramVehicle named by PlatformIntegration.vehicle_id, read through its vehicle_class"
    formula: |
      ride_qualified     = vehicle.vehicle_class in {STANDARD, XL, LUXURY}
      delivery_qualified = vehicle.vehicle_class in {STANDARD, XL, DELIVERY_VAN}
      model_restriction_hit = not ride_qualified or not delivery_qualified
      # evaluation order pins the verdict so a class failing both predicates is
      # reported as the model restriction rather than as one of the activity rejections
      if ride_qualified and delivery_qualified:      integration_result = QUALIFIED
      elif not ride_qualified and not delivery_qualified: integration_result = REJECTED_MODEL
      elif not ride_qualified:                        integration_result = REJECTED_RIDE
      else:                                           integration_result = REJECTED_DELIVERY
    constants:
      RIDE_CLASSES: 3
      DELIVERY_CLASSES: 3
    precision: "booleans and a single enum output; no numeric rounding"
    variants: []

  - name: damage_settlement_split
    trigger: "POST /maintenance-events/{id}/complete for DAMAGE_REPAIR events"
    algorithm: waterfall_allocation
    input_set: "only MaintenanceEvent rows with event_type DAMAGE_REPAIR and event_status COMPLETED that name the agreement's current open RentalWeek"
    formula: |
      # apportionment order: allowance -> cap. Each bucket takes
      # what it can before the next bucket is touched.
      remaining = maintenance_event.damage_liability_cents
      allowance_applied = min(remaining, agreement.maintenance_allowance_miles
                                        * DAMAGE_ALLOWANCE_CENTS_PER_MILE)
      remaining -= allowance_applied
      driver_liability = min(remaining, DRIVER_DAMAGE_CAP_CENTS)
      week.damage_charge_cents += driver_liability
    constants:
      DAMAGE_ALLOWANCE_CENTS_PER_MILE: 2
      DRIVER_DAMAGE_CAP_CENTS: 50000
    precision: "integer cents; nested min, no rounding"
    variants:
      - name: allowance_waterfall
        when: "the maintenance allowance absorbs part of the damage"
        difference: "for damage_liability_cents 30000 with maintenance_allowance_miles 200 the driver is charged 29600, because 400 of allowance is consumed first"
      - name: allocation_order
        when: "the same damage_liability_cents is presented against a different allowance"
        difference: "for the identical 30000 with maintenance_allowance_miles 0 the driver is charged 30000, pinned as allocation_order so the evaluation order of the two buckets is explicit and testable"

  - name: fleet_sizing_utilization
    trigger: "POST /fleet-facts/{id}/recompute"
    algorithm: aggregation
    input_set: "for the region named by FleetFact.region_code: active_agreements_count covers RentalAgreement rows with agreement_status IN {ACTIVE, RENEWAL_DUE, DELINQUENT, RECOVERY_PENDING, PURCHASE_PENDING}; available_fleet_count covers ProgramVehicle rows with vehicle_status IN {AVAILABLE, RECOVERY}"
    formula: |
      # denominator: program units for the region = assigned + available,
      # counted once each; the two sets are disjoint by construction.
      assigned_units = count(ProgramVehicle where region_code == region
                             and vehicle_status == ASSIGNED)
      active_agreements_count = assigned_units
      available_fleet_count = count(ProgramVehicle where region_code == region
                                    and vehicle_status IN {AVAILABLE, RECOVERY})
      utilization_bps = 0 if (assigned_units + available_fleet_count) == 0 \
                        else (assigned_units * 10000) // (assigned_units + available_fleet_count)
      sizing_deficit_units = demand_units - (assigned_units + available_fleet_count)
    constants:
      SIZE_DEFICIT_BALANCE_CEILING_UNITS: 0
    precision: "integer basis points via floor division; sizing_deficit_units is a signed integer"
    variants:
      - name: counted_units_basis
        when: "utilization is measured over program units only"
        difference: "with 3 assigned and 1 available the deficit is demand_units - 4 and utilization_bps is 7500"
      - name: demand_basis
        when: "the deficit is measured against demand_units instead of the unit set"
        difference: "for the same 3 assigned and 1 available with demand_units 3 the deficit basis reports under-supply of 2 while the counted-unit basis reports a surplus of 1, so the two valid readings disagree on the sign of the fleet posture"

  - name: purchase_option_equity_credit
    trigger: "POST /weeks/{id}/payments on a week that reaches PAID, and POST /weeks/{id}/waive"
    algorithm: aggregation
    input_set: "all RentalWeek rows of the agreement with week_status IN {PAID, WAIVED}, keyed by week_number"
    formula: |
      sum_paid    = sum(week.amount_due_cents for week in weeks where week.week_status == "PAID")
      sum_waived  = sum(week.amount_due_cents for week in weeks where week.week_status == "WAIVED")
      untaxed_subtotal = sum_paid - sum_waived          # subtract waived, then share
      gross = untaxed_subtotal * EQUITY_SHARE_NUM // EQUITY_SHARE_DEN
      equity_credit_cents = round_half_up(gross * 100 / EQUITY_CENTS_DIVISOR) \
                            * (EQUITY_CENTS_DIVISOR // 100)
      equity_credit_cents = max(0, equity_credit_cents)
      option.escrow_required_cents = round_half_up(
          (option.purchase_price_cents - equity_credit_cents) / option.escrow_weeks_required)
    constants:
      EQUITY_SHARE_NUM: 1
      EQUITY_SHARE_DEN: 10
      EQUITY_CENTS_DIVISOR: 100
    precision: "integer cents; the equity rate is applied to the paid-minus-waived subtotal before the divisor step, and the escrow schedule is derived from the resulting equity credit"
    variants:
      - name: equity_credit_basis
        when: "credit accrues from settled periods"
        difference: "two weeks at 39000 and 30100 with none waived yields 6910, because the subtotal 69100 is multiplied by 1/10"
      - name: escrow_schedule_basis
        when: "the recurring escrow amount is derived from the freshly computed equity credit"
        difference: "for a 1,800,000 cent option over 24 weeks with equity credit 6910 the escrow_required_cents is 74662, so re-running the schedule after a later credit recompute changes the recurring amount even though purchase_price_cents is unchanged"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and carrying a role declared in the RBAC matrix"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-ID header present for every role whose identity is entity_backed, and resolving to the id of an existing instance of that entity"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 3
    category: existence
    check: "the request body supplies every required field and no undeclared field"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 4
    category: auth
    check: "the acting X-User-ID owns the target resource, or the role holds override authority; ownership for Driver-owned operations means X-User-ID equals the resource's driver_id"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: ["POST /program/enrollments/{id}/withdraw", "POST /program/purchase-options/{id}/elect", "POST /program/purchase-options/{id}/withdraw", "POST /program/purchase-options/{id}/fund-escrow"]
  - priority: 5
    category: existence
    check: "the resource named by the path exists"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-addressed endpoints"
  - priority: 6
    category: existence
    check: "every foreign key in the request body names an existing row of the referenced entity"
    error_id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http_status: 404
    applies_to: ["POST /program/enrollments", "POST /program/agreements", "POST /program/weeks", "POST /program/maintenance-events", "POST /program/purchase-options", "POST /program/platform-checks", "POST /program/fleet-facts"]
  - priority: 7
    category: state
    check: "the target resource is in a state from which the requested operation is declared"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 8
    category: state
    check: "RentalAgreement.compliance_posture is not FROZEN"
    error_id: ERR_AGREEMENT_FROZEN
    http_status: 409
    applies_to: ["POST /program/weeks", "POST /program/weeks/{id}/settle", "POST /program/maintenance-events", "POST /program/maintenance-events/{id}/issue-loaner", "POST /program/agreements/{id}/complete"]
  - priority: 9
    category: state
    check: "RentalAgreement.compliance_posture is OPEN, which the purchase stream requires in addition to the not-FROZEN gate"
    error_id: ERR_POSTURE_NOT_OPEN
    http_status: 409
    applies_to: ["POST /program/purchase-options", "POST /program/purchase-options/{id}/elect"]
  - priority: 10
    category: state
    check: "the enrollment named by RentalAgreement.enrollment_id has enrollment_status ACTIVE"
    error_id: ERR_ENROLLMENT_NOT_ACTIVE
    http_status: 409
    applies_to: ["POST /program/agreements/{id}/activate"]
  - priority: 11
    category: business_safety
    check: "Driver.driving_record_points is at most 6 at the instant the enrollment is evaluated"
    error_id: ERR_DRIVING_RECORD_INELIGIBLE
    http_status: 422
    applies_to: ["POST /program/enrollments"]
  - priority: 12
    category: business_safety
    check: "Driver.eligibility_status is ELIGIBLE for the driver named by the agreement, because the platform will not dispatch work to a unit held by a driver who is not in good standing"
    error_id: ERR_DRIVER_NOT_ELIGIBLE
    http_status: 422
    applies_to: ["POST /program/platform-checks"]
  - priority: 13
    category: business_safety
    check: "the driver's platform activity score is at least the program activity floor, which the organization's platform configuration delivers as app_ride_enabled"
    error_id: ERR_PLATFORM_ACTIVITY_INSUFFICIENT
    http_status: 422
    applies_to: ["POST /program/enrollments", "POST /program/platform-checks"]
  - priority: 14
    category: business_safety
    check: "Driver.license_class is FOR_HIRE or COMMERCIAL before a unit is assigned or submitted for platform qualification"
    error_id: ERR_DRIVER_NOT_ELIGIBLE
    http_status: 422
    applies_to: ["POST /program/agreements", "POST /program/agreements/{id}/activate", "POST /program/platform-checks"]
  - priority: 15
    category: business_constraint
    check: "the driver does not already hold a ProgramVehicle in ASSIGNED status"
    error_id: ERR_DRIVER_VEHICLE_CONFLICT
    http_status: 409
    applies_to: ["POST /program/agreements", "POST /program/agreements/{id}/activate"]
  - priority: 16
    category: business_constraint
    check: "the ProgramVehicle named by the request has vehicle_status AVAILABLE"
    error_id: ERR_VEHICLE_NOT_AVAILABLE
    http_status: 409
    applies_to: ["POST /program/agreements", "POST /program/agreements/{id}/activate", "POST /program/agreements/{id}/swap"]
  - priority: 17
    category: business_constraint
    check: "the ProgramVehicle.vehicle_class is permitted for the activity the platform requires of it, so a unit that only qualifies for delivery may not be assigned to a ride-only agreement"
    error_id: ERR_MODEL_NOT_QUALIFIED
    http_status: 409
    applies_to: ["POST /program/agreements", "POST /program/agreements/{id}/swap", "POST /program/platform-checks"]
  - priority: 18
    category: business_constraint
    check: "the operation would not leave two RentalWeek rows of the same agreement sharing one week_number"
    error_id: ERR_WEEK_OVERLAP
    http_status: 409
    applies_to: ["POST /program/weeks", "POST /program/agreements/{id}/swap"]
  - priority: 19
    category: business_temporal
    check: "the weekly period that would be opened, running from the logical clock instant for seven days, does not extend past RentalAgreement.period_end"
    error_id: ERR_WEEK_OUTSIDE_AGREEMENT_TERM
    http_status: 422
    applies_to: ["POST /program/weeks"]
  - priority: 20
    category: business_temporal
    check: "the requested rental interval does not collide with an existing occupancy interval on the same ProgramVehicle, where intervals are half-open on period_start and period_end and a new interval starting exactly at an existing interval's period_end does not collide"
    error_id: ERR_VEHICLE_INTERVAL_OVERLAP
    http_status: 409
    applies_to: ["POST /program/agreements", "POST /program/agreements/{id}/swap"]
  - priority: 21
    category: business_temporal
    check: "a maintenance event may not be reported against a unit whose recovery interval is still open, where the recovery interval runs from the instant the vehicle entered RECOVERY through 24 hours after it last returned to AVAILABLE"
    error_id: ERR_MAINTENANCE_WINDOW_CONFLICT
    http_status: 409
    applies_to: ["POST /program/maintenance-events"]
  - priority: 22
    category: business_temporal
    check: "the logical clock is at or past RentalWeek.grace_deadline before the week may be declared delinquent"
    error_id: ERR_GRACE_NOT_LAPSED
    http_status: 422
    applies_to: ["POST /program/weeks/{id}/grace-lapse"]
  - priority: 23
    category: business_safety
    check: "the purchase election is blocked while any RentalWeek of the agreement has week_status DELINQUENT"
    error_id: ERR_PURCHASE_BLOCKED_BY_DELINQUENCY
    http_status: 409
    applies_to: ["POST /program/purchase-options/{id}/elect"]
  - priority: 24
    category: business_constraint
    check: "PurchaseOption.escrow_weeks_funded has reached PurchaseOption.escrow_weeks_required"
    error_id: ERR_ESCROW_INCOMPLETE
    http_status: 422
    applies_to: ["POST /program/purchase-options/{id}/complete"]
  - priority: 25
    category: business_fiscal
    check: "the tendered amount plus the applied platform credit is not less than RentalWeek.amount_due_cents on a tender that is neither a partial tender nor a retry of a failed tender"
    error_id: ERR_PAYMENT_BELOW_AMOUNT_DUE
    http_status: 402
    applies_to: ["POST /program/weeks/{id}/payments", "POST /program/weeks/{id}/retry-payment"]
  - priority: 26
    category: business_fiscal
    check: "the agreement's recovered-week set is still open, so recovery has not already been executed"
    error_id: ERR_RECOVERY_ALREADY_CLOSED
    http_status: 409
    applies_to: ["POST /program/agreements/{id}/recover"]
  - priority: 27
    category: state
    check: "expected_agreement_version matches RentalAgreement.version at the moment the request is served"
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
    applies_to: ["POST /program/weeks", "POST /program/purchase-options/{id}/elect"]
  - priority: 28
    category: state
    check: "expected_vehicle_version matches ProgramVehicle.version at the moment the request is served"
    error_id: ERR_STALE_VEHICLE_VERSION
    http_status: 412
    applies_to: ["POST /program/maintenance-events"]

endpoints:
  - method: POST
    path: "/program/drivers"
    description: "Register a driver record with platform identity, activity score and driving record"
    roles: [PlatformAdmin]
    code: 201
    input: ["full_name", "email", "platform_driver_id", "platform_activity_score", "driving_record_points", "license_class", "program_driver_tier"]
    output: Driver
    side_effects: ["driver created in eligibility_status PENDING"]
  - method: GET
    path: "/program/drivers/{id}"
    description: "Fetch one driver"
    roles: [PlatformAdmin, ComplianceOfficer, FleetOpsAgent, SupportAgent, Driver]
    code: 200
    input: [""]
    output: Driver
    side_effects: []
  - method: GET
    path: "/program/drivers"
    description: "List drivers with filter, sort and pagination"
    roles: [PlatformAdmin, ComplianceOfficer, FleetOpsAgent, SupportAgent]
    code: 200
    input: ["eligibility_status?", "program_driver_tier?", "limit?", "offset?"]
    output: Driver[]
    side_effects: []
  - method: POST
    path: "/program/drivers/{id}/activity"
    description: "Record a new platform activity score and refresh the driver's derived eligibility posture"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: [platform_activity_score]
    output: Driver
    side_effects:
      - "recompute driver_eligibility_score for every non-terminal DriverEnrollment of this driver"
      - "refresh eligibility_status"
  - method: POST
    path: "/program/drivers/{id}/driving-record"
    description: "Record an updated driving record and refresh the driver's derived eligibility posture"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: [driving_record_points]
    output: Driver
    side_effects:
      - "recompute driver_eligibility_score for every non-terminal DriverEnrollment of this driver"
      - "refresh eligibility_status"
  - method: GET
    path: "/program/drivers/{id}/enrollments"
    description: "List the enrollments held by a driver"
    roles: [PlatformAdmin, ComplianceOfficer, FleetOpsAgent, SupportAgent]
    code: 200
    input: []
    output: DriverEnrollment[]
    side_effects: []
  - method: GET
    path: "/program/drivers/{id}/summary"
    description: "Computed read: eligibility posture, enrollment and vehicle assignment at a glance"
    roles: [PlatformAdmin, ComplianceOfficer, SupportAgent, Driver]
    code: 200
    input: [""]
    output: { driver_id: string, eligibility_status: string, active_enrollment_id: string, assigned_vehicle_id: string, outstanding_balance_cents: integer, open_week_number: integer }
    side_effects: []

  - method: POST
    path: "/program/enrollments"
    description: "Enroll a driver into the rental program and evaluate eligibility"
    roles: [ComplianceOfficer]
    code: 201
    input: ["driver_id", "program_tier"]
    output: DriverEnrollment
    side_effects:
      - "activity_snapshot and record_snapshot captured from the Driver"
      - "driver_eligibility_score computed into eligibility_score"
      - "eligibility_decision set to APPROVED, DENIED or DEFERRED"
  - method: GET
    path: "/program/enrollments/{id}"
    description: "Fetch one enrollment"
    roles: [PlatformAdmin, ComplianceOfficer, FleetOpsAgent, SupportAgent, Driver]
    code: 200
    input: [""]
    output: DriverEnrollment
    side_effects: []
  - method: GET
    path: "/program/enrollments"
    description: "List enrollments filtered by driver"
    roles: [PlatformAdmin, ComplianceOfficer, FleetOpsAgent, SupportAgent]
    code: 200
    input: ["driver_id?", "enrollment_status?", "limit?", "offset?"]
    output: DriverEnrollment[]
    side_effects: []
  - method: POST
    path: "/program/enrollments/{id}/verify"
    description: "Verify an evaluated enrollment, admitting or rejecting the driver"
    roles: [ComplianceOfficer]
    code: 200
    input: [""]
    output: DriverEnrollment
    side_effects: ["enrollment_status becomes ACTIVE or REJECTED", "Driver.eligibility_status becomes ELIGIBLE or INELIGIBLE"]
  - method: POST
    path: "/program/enrollments/{id}/re-evaluate"
    description: "Re-evaluate a rejected enrollment against the driver's current platform activity and record"
    roles: [ComplianceOfficer]
    code: 200
    input: [""]
    output: DriverEnrollment
    side_effects: ["enrollment_status returns to PENDING_VERIFICATION", "eligibility_score recomputed"]
  - method: POST
    path: "/program/enrollments/{id}/reinstate"
    description: "Lift a suspension after every agreement held by the driver leaves FROZEN"
    roles: [ComplianceOfficer]
    code: 200
    input: [""]
    output: DriverEnrollment
    side_effects: ["enrollment_status SUSPENDED -> ACTIVE", "Driver.eligibility_status SUSPENDED -> ELIGIBLE"]
  - method: POST
    path: "/program/enrollments/{id}/withdraw"
    description: "Driver withdraws from the program; blocked while an occupancy-holding agreement remains"
    roles: [Driver, ComplianceOfficer]
    code: 200
    input: [""]
    output: DriverEnrollment
    side_effects: ["enrollment_status -> WITHDRAWN", "Driver.eligibility_status -> INELIGIBLE when no other ACTIVE enrollment remains"]

  - method: POST
    path: "/program/vehicles"
    description: "Admit a program fleet unit with its class and odometer reading"
    roles: [FleetOpsAgent]
    code: 201
    input: ["vin", "model_name", "model_year", "vehicle_class", "odometer_miles", "region_code"]
    output: ProgramVehicle
    side_effects: ["baseline_odometer_miles pinned to odometer_miles", "vehicle_status AVAILABLE"]
  - method: GET
    path: "/program/vehicles/{id}"
    description: "Fetch one program vehicle"
    roles: [PlatformAdmin, FleetOpsAgent, ComplianceOfficer, SupportAgent]
    code: 200
    input: [""]
    output: ProgramVehicle
    side_effects: []
  - method: GET
    path: "/program/vehicles"
    description: "List program vehicles filtered by assignment, region or class"
    roles: [PlatformAdmin, FleetOpsAgent, ComplianceOfficer, SupportAgent]
    code: 200
    input: ["assigned_driver_id?", "region_code?", "vehicle_class?", "vehicle_status?", "model_name?", "limit?", "offset?"]
    output: ProgramVehicle[]
    side_effects: []

  - method: POST
    path: "/program/agreements"
    description: "Create a rental agreement, restoring a recurring weekly rate, insurance premium and mileage provisions, and planning the occupancy interval"
    roles: [FleetOpsAgent]
    code: 201
    input: ["enrollment_id", "driver_id", "vehicle_id", "weekly_rate_cents", "insurance_premium_cents", "unlimited_mileage?", "mileage_cap_miles?", "maintenance_allowance_miles", "period_start", "period_end"]
    output: RentalAgreement
    side_effects: ["agreement_status DRAFT", "compliance_posture OPEN", "occupancy interval planned on the vehicle"]
  - method: GET
    path: "/program/agreements/{id}"
    description: "Fetch one rental agreement"
    roles: [PlatformAdmin, FleetOpsAgent, ComplianceOfficer, SupportAgent, Driver]
    code: 200
    input: [""]
    output: RentalAgreement
    side_effects: []
  - method: GET
    path: "/program/agreements"
    description: "List rental agreements filtered by enrollment, driver, vehicle or status"
    roles: [PlatformAdmin, FleetOpsAgent, ComplianceOfficer, SupportAgent]
    code: 200
    input: ["enrollment_id?", "driver_id?", "vehicle_id?", "agreement_status?", "compliance_posture?", "limit?", "offset?"]
    output: RentalAgreement[]
    side_effects: []
  - method: GET
    path: "/program/agreements/{id}/summary"
    description: "Computed read: outstanding weeks, renewal credit, equity credit and escrow schedule for the agreement"
    roles: [PlatformAdmin, FleetOpsAgent, ComplianceOfficer, SupportAgent, Driver]
    code: 200
    input: [""]
    output: { agreement_id: string, agreement_status: string, compliance_posture: string, current_week_number: integer, outstanding_delinquent_weeks: integer, renewal_credit_cents: integer, total_billed_cents: integer, total_waived_cents: integer, equity_credit_cents: integer, escrow_balance_cents: integer }
    side_effects: []
  - method: POST
    path: "/program/agreements/{id}/activate"
    description: "Activate the agreement, taking the vehicle out of the available pool and pinning its baseline odometer"
    roles: [FleetOpsAgent]
    code: 200
    input: [""]
    output: RentalAgreement
    side_effects:
      - "vehicle_status AVAILABLE -> ASSIGNED"
      - "assigned_driver_id set on the vehicle"
      - "baseline_odometer_miles pinned"
  - method: POST
    path: "/program/agreements/{id}/swap"
    description: "Swap the assigned unit for another available program vehicle, respecting model and class restrictions"
    roles: [FleetOpsAgent]
    code: 200
    input: ["new_vehicle_id"]
    output: RentalAgreement
    side_effects:
      - "original vehicle released to AVAILABLE"
      - "new vehicle ASSIGNED and assigned_driver_id set"
      - "baseline_odometer_miles restamped on the new unit"
  - method: POST
    path: "/program/agreements/{id}/complete"
    description: "Close the agreement normally and return the unit to the available pool"
    roles: [FleetOpsAgent]
    code: 200
    input: [""]
    output: RentalAgreement
    side_effects: ["vehicle_status ASSIGNED -> AVAILABLE", "assigned_driver_id cleared"]
  - method: POST
    path: "/program/agreements/{id}/escalate-recovery"
    description: "Escalate a frozen delinquent agreement into recovery"
    roles: [FleetOpsAgent]
    code: 200
    input: [""]
    output: RentalAgreement
    side_effects: ["agreement_status DELINQUENT -> RECOVERY_PENDING"]
  - method: POST
    path: "/program/agreements/{id}/recover"
    description: "Execute vehicle recovery, returning the unit to the available pool and closing the recovered weeks"
    roles: [FleetOpsAgent]
    code: 200
    input: [""]
    output: RentalAgreement
    side_effects: ["vehicle_status RECOVERY -> AVAILABLE", "every DELINQUENT week becomes RECOVERED", "agreement_status -> RECOVERED"]

  - method: POST
    path: "/program/weeks"
