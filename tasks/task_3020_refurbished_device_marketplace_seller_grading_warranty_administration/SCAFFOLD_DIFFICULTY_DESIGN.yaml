- rule_id: non_linear_state_machine
  instances:
  - name: warranty_claim_approved_self_loop_before_terminal
    grounds:
    - state_machines.WarrantyClaim.APPROVED_to_APPROVED
    - state_machines.WarrantyClaim.APPROVED_to_RESOLVED
    - validations[priority=18]
    - validations[priority=19]
    distinguishing_aspect: The claim machine is non-linear because APPROVED carries a self-loop that keeps re-upholding answerable while the identical trigger produces a different error once the claim reaches the terminal RESOLVED state.
    test_recipe:
      setup:
      - clock 2026-12-01T00:00:00Z
      - seller A approved with listing A LISTED
      - one claim upheld for repair and not yet routed
      setup_api_calls:
      - call: POST /v1/_clock/set_current_utc
        as: PlatformAdmin
        payload:
          to_iso8601: '2026-09-02T00:00:00Z'
      - call: POST /v1/grading-definitions
        as: ComplianceReviewer
        payload:
          definition_code: RB3-DEF
          cosmetic_thresholds:
            FLAWLESS: 97
            GOOD: 90
            FAIR: 75
            POOR: 50
          functional_thresholds:
            FULLY_FUNCTIONAL: 95
            MINOR_FAULTS: 80
            MAJOR_FAULTS: 60
          battery_floor_pct: 80
          effective_from: '2026-08-01T00:00:00Z'
        captures:
          def_RB3-DEF: $.data.id
      - call: POST /v1/grading-definitions/${def_RB3-DEF}/activate
        as: ComplianceReviewer
        payload: {}
      - call: POST /v1/sellers
        as: PlatformAdmin
        payload:
          legal_name: Refurb RB3A
          country_code: US
          refurbishment_capacity_units: 500
        captures:
          sid_A: $.data.id
      - call: POST /v1/sellers/${sid_A}/verify-documents
        as: ComplianceReviewer
        payload: {}
      - call: POST /v1/sellers/${sid_A}/audit-records
        as: ComplianceReviewer
        payload:
          audit_scheduled_for: '2026-09-05T00:00:00Z'
          audit_scope_note: battery tear-down and screen swap
          declared_monthly_throughput: 400
        captures:
          aid_A: $.data.id
      - call: POST /v1/audit-records/${aid_A}/transition
        as: ComplianceReviewer
        payload:
          target_state: PASSED
          audit_score: 88
          auditor_user_id: op_auditor
      - call: GET /v1/sellers/${sid_A}
        as: PlatformAdmin
        captures:
          vv_A: $.data.version
      - call: POST /v1/sellers/${sid_A}/listings
        as: Seller
        payload:
          model_code: APL-IP13-128
          imei: '890123456789011'
          cosmetic_grade: GOOD
          functional_grade: MINOR_FAULTS
          battery_health_pct: 88
          carrier_lock_status: UNLOCKED
          part_provenance: OEM_EQUIVALENT
          provenance_doc_digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          list_price_cents: 150000
        as_user_id: ${sid_A}
        captures:
          lid_A: $.data.id
      - call: POST /v1/listings/${lid_A}/review
        as: ComplianceReviewer
        payload:
          decision: APPROVED
          reviewer_user_id: op_reviewer
        captures:
          res_A: $.data.servicing_reservation_id
      - call: POST /v1/sellers/${sid_A}/warranty-claims
        as: Consumer
        payload:
          listing_id: ${lid_A}
          claim_reason_code: BATTERY_SWELL
          evidence_included: true
        captures:
          k1: $.data.id
          v_k1: $.data.version
      - call: POST /v1/warranty-claims/${k1}/evidence
        as: ClaimAdjudicator
        payload:
          diagnostic_evidence_digest: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      - call: POST /v1/warranty-claims/${k1}/adjudicate
        as: ClaimAdjudicator
        payload:
          decision: APPROVED
          resolution_type: REPAIR
          resolution_obligation_cents: 18000
          adjudicator_user_id: op_adjudicator
        captures:
          k1v: $.data.version
      trigger:
      - call: POST /v1/warranty-claims/${k1}/adjudicate
        as: ClaimAdjudicator
        payload:
          decision: APPROVED
          resolution_type: REPAIR
          resolution_obligation_cents: 18000
          adjudicator_user_id: op_adjudicator
        captures:
          e_upheld: $.data.error_id
      - call: POST /v1/warranty-claims/${k1}/route-return
        as: ClaimAdjudicator
        payload:
          return_carrier: CARRIER_A
          return_shipment_cents: 4500
          return_shipment_start: '2026-12-05T00:00:00Z'
          expected_claim_version: ${k1v}
      - call: POST /v1/warranty-claims/${k1}/adjudicate
        as: ClaimAdjudicator
        payload:
          decision: APPROVED
          resolution_type: REPAIR
          resolution_obligation_cents: 18000
          adjudicator_user_id: op_adjudicator
        captures:
          e_term: $.data.error_id
      assert:
      - the second uphold on an APPROVED claim returns error_id ERR_CLAIM_ALREADY_UPHELD
      - the second uphold leaves WarrantyClaim.${k1}.claim_state == APPROVED, so the self-loop is not terminal
      - the routed return succeeds and WarrantyClaim.${k1}.claim_state == RESOLVED
      - the third uphold returns error_id ERR_CLAIM_TERMINAL
      - the same trigger returns two different error ids depending on whether the claim is terminal, which is the non-linear polarity
  - name: device_listing_parent_gated_relisting_loop
    grounds:
    - state_machines.DeviceListing.SUSPENDED_to_UNDER_REVIEW
    - state_machines.DeviceListing.DRAFT_to_WITHDRAWN
    - validations[priority=12]
    distinguishing_aspect: The listing machine has a re-listing loop SUSPENDED to UNDER_REVIEW whose admissibility is decided by the parent seller's onboarding state rather than by any listing field, and the same re-submit is rejected with ERR_SELLER_NOT_APPROVED once the parent is no longer APPROVED.
    test_recipe:
      setup:
