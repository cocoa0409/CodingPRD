  - section: errors
    instances:
      - name: corner_appeal_window_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_APPEAL_WINDOW_CLOSED]"]
        excluded_because:
          difficulty_instance: appeal_window_exactly_sixty_days
          rationale: "ERR_APPEAL_WINDOW_CLOSED is the failing half of that §1.8 boundary instance."
      - name: corner_jd_not_jurisdictional_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_JD_NOT_JURISDICTIONAL]"]
        excluded_because:
          difficulty_instance: submit_requires_jurisdictional_jd
          rationale: "Both JD-gate errors are asserted there."
      - name: corner_aa_not_accepted_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_AA_NOT_ACCEPTED]"]
        excluded_because:
          difficulty_instance: plan_creation_requires_accepted_alternatives
          rationale: "ERR_AA_NOT_ACCEPTED is the first assert of that §1.8 instance."
      - name: corner_active_jd_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_ACTIVE_JD_EXISTS]"]
        excluded_because:
          difficulty_instance: jd_issuance_blocked_by_live_validity_window
          rationale: "ERR_ACTIVE_JD_EXISTS fires twice in that §1.8 instance."
      - name: corner_coverage_conflict_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_COVERAGE_INTERVAL_CONFLICT]"]
        excluded_because:
          difficulty_instance: monitoring_coverage_requires_zero_gap_contiguity
          rationale: "Both gap and overlap firings of ERR_COVERAGE_INTERVAL_CONFLICT are asserted there."
      - name: corner_insufficient_inventory_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_INSUFFICIENT_CREDIT_INVENTORY]"]
        excluded_because:
          difficulty_instance: credit_inventory_exact_availability
          rationale: "Asserted as the over-availability failure of that §1.8 instance."
      - name: corner_bank_not_operational_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_BANK_NOT_OPERATIONAL]"]
        excluded_because:
          difficulty_instance: state_beats_fiscal_on_bank_txn
          rationale: "Asserted as the priority winner there."
      - name: corner_sod_error_at_decision
        claim_type: violation_to_error
        grounds: ["errors[ERR_SEGREGATION_OF_DUTIES]"]
        excluded_because:
          difficulty_instance: safety_beats_referential_on_decision
          rationale: "ERR_SEGREGATION_OF_DUTIES on render-decision is asserted there; the confirm-violation firing is covered by corner_case_opener_cannot_confirm in the rbac section."

