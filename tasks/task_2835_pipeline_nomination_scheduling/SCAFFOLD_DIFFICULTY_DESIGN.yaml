              payload: { cycle_id: "${cyc_id}" }
              as: PipelineScheduler
              captures: { stl_id: "$.data[0].id" }
          assert:
            - "ImbalanceSettlement.${stl_id}.basis_mode == DELIVERED"
            - "ImbalanceSettlement.${stl_id}.scheduled_bbl == 56100.00 and ImbalanceSettlement.${stl_id}.delivered_bbl == 55902.00"
