      - call: POST /aquarium/transfer-requests/${tr_id}/decisions
        payload: {decision: COUNTER, counter_conditions: [QUARANTINE_ON_ARRIVAL]}
        as: ComplianceDirector
        as_user_id: dir-transfer-approver
        captures: {err: $.data.error_id}
      - call: POST /aquarium/transfer-requests/${tr_id}/decisions
        payload: {decision: APPROVE}
        as: PartnerInstitutionLiaison
