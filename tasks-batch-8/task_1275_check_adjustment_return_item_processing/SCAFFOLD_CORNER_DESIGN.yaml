# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests) — task 1275
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_account_applies_defaults
        claim_type: defaults
        grounds: [entities.DepositorAccount]
        distinguishing_aspect: "Creating an account with only required fields yields risk_tier STANDARD, reg_cc_eligible true, status ACTIVE, balances 0, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /bank/accounts"
              payload: { customer_name: "Tara", account_number: "A-2000" }
              as: OperationsAdmin
              captures: { acct_id: $.data.id, tier: $.data.risk_tier, elig: $.data.reg_cc_eligible, st: $.data.status, avail: $.data.available_balance_cents, settled: $.data.settled_balance_cents, ver: $.data.version }
          trigger: []
          assert:
            - "tier == 'STANDARD'"
            - "elig == true"
            - "st == 'ACTIVE'"
            - "avail == 0"
            - "settled == 0"
            - "ver == 1"
      - name: create_account_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.DepositorAccount, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required account_number is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /bank/accounts"
              payload: { customer_name: "NoNum" }
              as: OperationsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_INVALID_REQUEST'"
      - name: account_not_found_returns_error_envelope
        claim_type: not_found
        grounds: [entities.DepositorAccount, "errors[ERR_ACCOUNT_NOT_FOUND]"]
        distinguishing_aspect: "GET with a non-existent account id returns the error envelope with response_type error and ERR_ACCOUNT_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /bank/accounts/00000000-0000-0000-0000-000000000000"
              as: OperationsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_ACCOUNT_NOT_FOUND'"
            - "HTTP status == 404 and the envelope response_type == 'error'"
      - name: duplicate_account_number_rejected
        claim_type: type_constraints
        grounds: [entities.DepositorAccount.fields.account_number, "errors[ERR_DUPLICATE_ACCOUNT_NUMBER]"]
        distinguishing_aspect: "Second account with the same account_number is rejected with ERR_DUPLICATE_ACCOUNT_NUMBER (409)."
        test_recipe:
          setup: ["one account A-2001 exists"]
          setup_api_calls:
            - call: "POST /bank/accounts"
              payload: { customer_name: "Uma", account_number: "A-2001" }
              as: OperationsAdmin
          trigger:
            - call: "POST /bank/accounts"
              payload: { customer_name: "Uma2", account_number: "A-2001" }
              as: OperationsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_DUPLICATE_ACCOUNT_NUMBER'"
      - name: duplicate_routing_number_rejected
        claim_type: type_constraints
        grounds: [entities.ClearingBank.fields.routing_number, "errors[ERR_DUPLICATE_ROUTING_NUMBER]"]
        distinguishing_aspect: "Second clearing bank with the same routing_number is rejected with ERR_DUPLICATE_ROUTING_NUMBER (409)."
        test_recipe:
          setup: ["one clearing bank with routing 222000010 exists"]
          setup_api_calls:
            - call: "POST /bank/clearing-banks"
              payload: { name: "CB X", routing_number: "222000010" }
              as: OperationsAdmin
          trigger:
            - call: "POST /bank/clearing-banks"
              payload: { name: "CB Y", routing_number: "222000010" }
              as: OperationsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_DUPLICATE_ROUTING_NUMBER'"
      - name: ledger_entry_immutable_common_fields_false
        claim_type: immutability
        grounds: [entities.LedgerEntry]
        distinguishing_aspect: "LedgerEntry has common_fields false: reads expose id and created_at but no version or updated_at, and no PUT/PATCH/DELETE endpoint exists for the collection."
        test_recipe:
          setup: ["account with opening_balance_cents 5000 posts one OPENING_CREDIT entry"]
          setup_api_calls:
            - call: "POST /bank/accounts"
              payload: { customer_name: "Vic", account_number: "A-2002", opening_balance_cents: 5000 }
              as: OperationsAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "GET /bank/ledger-entries"
              payload: { depositor_account_id: "${acct_id}" }
              as: OperationsAdmin
              captures: { et: "$.data[0].entry_type", amt: "$.data[0].amount_cents", prov: "$.data[0].provisional" }
          assert:
            - "et == 'OPENING_CREDIT'"
            - "amt == 5000"
            - "prov == false"
            - "the entry object has no 'version' and no 'updated_at' key"

  - section: state_machines
    instances:
      - name: check_item_initial_state_received
        claim_type: initial_state
        grounds: [state_machines.CheckItem]
        distinguishing_aspect: "A newly deposited below-threshold item starts in RECEIVED with presentment_count 0."
        test_recipe:
          setup: ["account and clearing bank exist"]
          setup_api_calls:
            - call: "POST /bank/clearing-banks"
              payload: { name: "CB Init", routing_number: "222000011" }
              as: OperationsAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /bank/accounts"
              payload: { customer_name: "Walt", account_number: "A-2003" }
              as: OperationsAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-INIT", amount_cents: 1000, encoded_amount_cents: 1000, image_quality_score: 90, capture_channel: "ATM" }
              as: ItemProcessor
              captures: { st: $.data.status, cnt: $.data.presentment_count }
          assert:
            - "st == 'RECEIVED'"
            - "cnt == 0"
      - name: pay_from_received_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.CheckItem.PRESENTED_to_PAID, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Pay requires PRESENTED; paying a RECEIVED item fails with ERR_INVALID_STATE and posts no ledger entries."
        test_recipe:
          setup: ["one RECEIVED item"]
          setup_api_calls:
            - call: "POST /bank/clearing-banks"
              payload: { name: "CB Pay", routing_number: "222000012" }
              as: OperationsAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /bank/accounts"
              payload: { customer_name: "Xena", account_number: "A-2004" }
              as: OperationsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-PAY", amount_cents: 1000, encoded_amount_cents: 1000, image_quality_score: 90, capture_channel: "ATM" }
              as: ItemProcessor
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /bank/check-items/${item_id}/pay"
              as: ItemProcessor
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_INVALID_STATE'"
      - name: code_already_coded_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.ReturnEvent.PENDING_CODING_to_CODED]
        distinguishing_aspect: "CODED is terminal for ReturnEvent: a second code call fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["item presented, returned, and already coded NSF"]
          setup_api_calls:
            - call: "POST /bank/clearing-banks"
              payload: { name: "CB CC", routing_number: "222000013" }
              as: OperationsAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /bank/accounts"
              payload: { customer_name: "Yara", account_number: "A-2005", opening_balance_cents: 100000 }
              as: OperationsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-CC", amount_cents: 5000, encoded_amount_cents: 5000, image_quality_score: 90, capture_channel: "ATM" }
              as: ItemProcessor
              captures: { item_id: $.data.id }
            - call: "POST /bank/check-items/${item_id}/present"
              as: ItemProcessor
            - call: "POST /bank/check-items/${item_id}/return-events"
              as: ItemProcessor
              captures: { re1: $.data.id }
            - call: "POST /bank/return-events/${re1}/code"
              payload: { reason_code: "NSF" }
              as: ItemProcessor
          trigger:
            - call: "POST /bank/return-events/${re1}/code"
              payload: { reason_code: "STOP_PAYMENT" }
              as: ItemProcessor
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_INVALID_STATE'"
      - name: terminal_lockdown_return_on_paid_item
        claim_type: terminal_state_lockdown
        grounds: [state_machines.CheckItem.PRESENTED_to_RETURNED]
        distinguishing_aspect: "PAID is terminal: recording a return-event on a PAID item fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["item presented and paid"]
          setup_api_calls:
            - call: "POST /bank/clearing-banks"
              payload: { name: "CB TL", routing_number: "222000014" }
              as: OperationsAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /bank/accounts"
              payload: { customer_name: "Zane", account_number: "A-2006" }
              as: OperationsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-TL", amount_cents: 5000, encoded_amount_cents: 5000, image_quality_score: 90, capture_channel: "ATM" }
              as: ItemProcessor
              captures: { item_id: $.data.id }
            - call: "POST /bank/check-items/${item_id}/present"
              as: ItemProcessor
            - call: "POST /bank/check-items/${item_id}/pay"
              as: ItemProcessor
          trigger:
            - call: "POST /bank/check-items/${item_id}/return-events"
              as: ItemProcessor
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_INVALID_STATE'"
      - name: hold_return_item_decision_cascades
        claim_type: side_effect_execution
        grounds: [state_machines.CheckItem.UNDER_REVIEW_to_DEPOSIT_REJECTED, state_machines.HoldDecision.PENDING_to_DECIDED]
        distinguishing_aspect: "Deciding RETURN_ITEM on the auto hold rejects the deposit: item DEPOSIT_REJECTED, provisional credit reversed (item ledger nets 0), DEPOSIT_REJECTED_NOTICE created, and the LARGE_ITEM_REVIEW case auto-resolves NO_ACTION."
        test_recipe:
          setup: ["large item 600000 UNDER_REVIEW with auto PENDING hold"]
          setup_api_calls:
            - call: "POST /bank/clearing-banks"
              payload: { name: "CB HR", routing_number: "222000015" }
              as: OperationsAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /bank/accounts"
              payload: { customer_name: "Abby", account_number: "A-2007", opening_balance_cents: 0 }
              as: OperationsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-HR", amount_cents: 600000, encoded_amount_cents: 600000, image_quality_score: 90, capture_channel: "BRANCH" }
              as: ItemProcessor
              captures: { item_id: $.data.id }
            - call: "GET /bank/check-items/${item_id}/hold-decisions"
              as: OperationsAdmin
              captures: { hold_id: "$.data[0].id" }
          trigger:
            - call: "POST /bank/hold-decisions/${hold_id}/decide"
              payload: { decision: "RETURN_ITEM" }
              as: AdjustmentAnalyst
              as_user_id: "analyst-1"
            - call: "GET /bank/check-items/${item_id}"
              as: OperationsAdmin
              captures: { item_st: $.data.status }
            - call: "GET /bank/notifications"
              payload: { depositor_account_id: "${acct_id}" }
              as: OperationsAdmin
              captures: { ntype: "$.data[0].notification_type" }
            - call: "GET /bank/accounts/${acct_id}"
              as: OperationsAdmin
              captures: { avail: $.data.available_balance_cents }
          assert:
            - "item_st == 'DEPOSIT_REJECTED'"
            - "avail == 0"
            - "ntype == 'DEPOSIT_REJECTED_NOTICE'"
            - "the LARGE_ITEM_REVIEW case for the item is RESOLVED with disposition NO_ACTION"
      - name: notification_breach_sweep_escalates_case
        claim_type: side_effect_execution
        grounds: [state_machines.CustomerNotification.PENDING_to_BREACHED, state_machines.AdjustmentCase.OPEN_to_ESCALATED]
        distinguishing_aspect: "run-daily after the RETURN_NOTICE due_at (next business day 17:00) flips the notification to BREACHED and bubbles the linked RETURN_ITEM case to ESCALATED."
        test_recipe:
          setup: ["return coded Friday 2026-05-01 (due_at 2026-05-04T17:00:00Z); clock advanced to Tuesday 2026-05-05"]
          setup_api_calls:
            - call: "POST /bank/clearing-banks"
              payload: { name: "CB NB", routing_number: "222000016" }
              as: OperationsAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /bank/accounts"
              payload: { customer_name: "Brett", account_number: "A-2008", opening_balance_cents: 100000 }
              as: OperationsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-NB", amount_cents: 5000, encoded_amount_cents: 5000, image_quality_score: 90, capture_channel: "ATM" }
              as: ItemProcessor
              captures: { item_id: $.data.id }
            - call: "POST /bank/check-items/${item_id}/present"
              as: ItemProcessor
            - call: "POST /bank/check-items/${item_id}/return-events"
              as: ItemProcessor
              captures: { re1: $.data.id }
            - call: "POST /bank/return-events/${re1}/code"
              payload: { reason_code: "NSF" }
              as: ItemProcessor
            - call: "GET /bank/check-items/${item_id}/adjustment-cases"
              as: OperationsAdmin
              captures: { case_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T00:00:00Z" }
              as: OperationsAdmin
          trigger:
            - call: "POST /bank/ops/run-daily"
              as: OperationsAdmin
              captures: { breached: $.data.notifications_breached }
            - call: "GET /bank/notifications"
              payload: { adjustment_case_id: "${case_id}" }
              as: OperationsAdmin
              captures: { nst: "$.data[0].status", ndue: "$.data[0].due_at" }
            - call: "GET /bank/adjustment-cases/${case_id}"
              as: OperationsAdmin
              captures: { cst: $.data.status }
          assert:
            - "breached == 1"
            - "nst == 'BREACHED'"
            - "ndue == '2026-05-04T17:00:00Z'"
            - "cst == 'ESCALATED'"

  - section: calculations
    instances:
      - name: warranty_submit_deadline_boundary
        claim_type: correct_result
        grounds: [entities.WarrantyClaim.fields.deadline_at, calculations.claim_aging_days]
        distinguishing_aspect: "Warranty deadline is inclusive: presented Friday 2026-05-01 with a 7-calendar-day window gives deadline_at 2026-05-08T00:00:00Z — submit at exactly that instant succeeds, submit the next day fails with ERR_WARRANTY_WINDOW_EXPIRED."
        test_recipe:
          setup:
            - "Item with image_quality_score 50 presented at the default clock produced an IMAGE_WARRANTY case; two DRAFT warranty claims created on it"
          setup_api_calls:
            - call: "POST /bank/clearing-banks"
              payload: { name: "CB WD", routing_number: "222000017", warranty_window_days: 7 }
              as: OperationsAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /bank/accounts"
              payload: { customer_name: "Cora", account_number: "A-2009" }
              as: OperationsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-WD", amount_cents: 80000, encoded_amount_cents: 80000, image_quality_score: 50, capture_channel: "MOBILE" }
              as: ItemProcessor
              captures: { item_id: $.data.id }
            - call: "POST /bank/check-items/${item_id}/present"
              as: ItemProcessor
            - call: "GET /bank/check-items/${item_id}/adjustment-cases"
              payload: { case_type: "IMAGE_WARRANTY" }
              as: OperationsAdmin
              captures: { case_id: "$.data[0].id" }
            - call: "POST /bank/adjustment-cases/${case_id}/warranty-claims"
              payload: { claimed_amount_cents: 80000 }
              as: AdjustmentAnalyst
              as_user_id: "analyst-1"
              captures: { wc1: $.data.id, wc_deadline: $.data.deadline_at }
            - call: "POST /bank/adjustment-cases/${case_id}/warranty-claims"
              payload: { claimed_amount_cents: 1000 }
              as: AdjustmentAnalyst
              as_user_id: "analyst-1"
              captures: { wc2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-08T00:00:00Z" }
              as: OperationsAdmin
          trigger:
            - call: "POST /bank/warranty-claims/${wc1}/submit"
              as: AdjustmentAnalyst
              as_user_id: "analyst-1"
              captures: { wc1_status: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-09T00:00:00Z" }
              as: OperationsAdmin
            - call: "POST /bank/warranty-claims/${wc2}/submit"
              as: AdjustmentAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "wc_deadline == '2026-05-08T00:00:00Z'"
            - "wc1_status == 'SUBMITTED'"
            - "err == 'ERR_WARRANTY_WINDOW_EXPIRED'"
      - name: claim_submit_window_boundary
        claim_type: correct_result
        grounds: [entities.ClearingBank.fields.claim_window_business_days, "errors[ERR_CLAIM_WINDOW_EXPIRED]"]
        distinguishing_aspect: "Claim window of 3 business days from Friday 2026-05-01: submit on Wednesday 2026-05-06 (business day 3) succeeds; a different claim submitted Thursday 2026-05-07 fails with ERR_CLAIM_WINDOW_EXPIRED."
        test_recipe:
          setup:
            - "Encoding-error case ASSIGNED with its auto DRAFT claim, plus a second manual DRAFT claim; created at the default Friday clock"
          setup_api_calls:
            - call: "POST /bank/clearing-banks"
              payload: { name: "CB CW", routing_number: "222000018", claim_window_business_days: 3 }
              as: OperationsAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /bank/accounts"
              payload: { customer_name: "Drew", account_number: "A-2010" }
              as: OperationsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-CW", amount_cents: 100000, encoded_amount_cents: 95000, image_quality_score: 90, capture_channel: "BRANCH" }
              as: ItemProcessor
              captures: { item_id: $.data.id }
            - call: "POST /bank/check-items/${item_id}/present"
              as: ItemProcessor
            - call: "GET /bank/check-items/${item_id}/adjustment-cases"
              as: OperationsAdmin
              captures: { case_id: "$.data[0].id", case_v: "$.data[0].version" }
            - call: "POST /bank/adjustment-cases/${case_id}/assign"
              payload: { assigned_analyst_id: "analyst-1", expected_adjustment_case_version: "${case_v}" }
              as: OperationsAdmin
            - call: "GET /bank/adjustment-cases/${case_id}/claims"
              as: OperationsAdmin
              captures: { claim1: "$.data[0].id" }
            - call: "POST /bank/adjustment-cases/${case_id}/claims"
              payload: { claimed_amount_cents: 500 }
              as: AdjustmentAnalyst
              as_user_id: "analyst-1"
              captures: { claim2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-06T00:00:00Z" }
              as: OperationsAdmin
          trigger:
            - call: "POST /bank/adjustment-claims/${claim1}/submit"
              as: AdjustmentAnalyst
              as_user_id: "analyst-1"
              captures: { c1_status: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-07T00:00:00Z" }
              as: OperationsAdmin
            - call: "POST /bank/adjustment-claims/${claim2}/submit"
              as: AdjustmentAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "c1_status == 'SUBMITTED'"
            - "err == 'ERR_CLAIM_WINDOW_EXPIRED'"
      - name: duplicate_presentment_detection_credit
        claim_type: correct_result
        grounds: [state_machines.CheckItem.RECEIVED_to_DUPLICATE_REJECTED, entities.CheckItem.fields.duplicate_of_item_id]
        distinguishing_aspect: "Presenting a second item whose item_reference matches a PRESENTED item rejects the newcomer as DUPLICATE_REJECTED, points duplicate_of_item_id at the original (earliest created_at), reverses its provisional credit (customer made whole), and opens a DUPLICATE_PRESENTMENT case plus DUPLICATE_NOTICE."
        test_recipe:
          setup:
            - "Item A (ref ITM-DUP) presented; item B deposited with the same reference while A is PRESENTED"
          setup_api_calls:
            - call: "POST /bank/clearing-banks"
              payload: { name: "CB Dup", routing_number: "222000019" }
              as: OperationsAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /bank/accounts"
              payload: { customer_name: "Elle", account_number: "A-2011", opening_balance_cents: 0 }
              as: OperationsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-DUP", amount_cents: 30000, encoded_amount_cents: 30000, image_quality_score: 90, capture_channel: "BRANCH" }
              as: ItemProcessor
              captures: { item_a: $.data.id }
            - call: "POST /bank/check-items/${item_a}/present"
              as: ItemProcessor
            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-DUP", amount_cents: 30000, encoded_amount_cents: 30000, image_quality_score: 90, capture_channel: "RDC" }
              as: ItemProcessor
              captures: { item_b: $.data.id }
          trigger:
            - call: "POST /bank/check-items/${item_b}/present"
              as: ItemProcessor
              captures: { b_status: $.data.status, b_dup_of: $.data.duplicate_of_item_id }
            - call: "GET /bank/ledger-entries"
              payload: { check_item_id: "${item_b}" }
              as: OperationsAdmin
            - call: "GET /bank/check-items/${item_b}/adjustment-cases"
              as: OperationsAdmin
              captures: { dup_case_type: "$.data[0].case_type" }
            - call: "GET /bank/accounts/${acct_id}"
              as: OperationsAdmin
              captures: { avail: $.data.available_balance_cents }
          assert:
            - "b_status == 'DUPLICATE_REJECTED'"
            - "b_dup_of == item_a id"
            - "sum of LedgerEntry.amount_cents for item B == 0 (DEPOSIT_CREDIT +30000 then DUPLICATE_REVERSAL_CREDIT -30000)"
            - "dup_case_type == 'DUPLICATE_PRESENTMENT'"
            - "avail == 30000 (only item A's provisional credit remains)"
      - name: hold_expiry_sweep_releases_item
        claim_type: correct_result
        grounds: [state_machines.HoldDecision.PENDING_to_EXPIRED, calculations.hold_window_initial]
