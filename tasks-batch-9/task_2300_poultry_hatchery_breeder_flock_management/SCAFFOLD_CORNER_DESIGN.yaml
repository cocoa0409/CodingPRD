        claim_type: role_denied_other_exclusive_operations
        grounds:
          - roles.HatcheryManager.exclusive_operations
          - roles.FlockManager.exclusive_operations
          - validations.priority_2.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "The roles are peers, not a hierarchy: HatcheryManager (the widest role) is still refused the Veterinarian's lab intake and the FlockManager's placement, and the 403 is returned at priority 2 - before any id resolution - which is why obviously non-existent path ids still yield ERR_FORBIDDEN_ROLE rather than a 404."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T12:00:00Z; the store is otherwise empty. Every call below uses a role that does not own the operation."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T12:00:00Z"}, as: HatcheryManager}
          trigger:
            - {call: "POST /flock-programs", payload: {code: "PX", breed: "ROSS_308", stimulation_week: 21, lighting_steps: [{age_weeks: 21, photoperiod_hours: 12.0}], feed_steps: [{age_weeks: 21, feed_grams_per_hen_day: 150.0}]}, as: FlockManager, captures: {e1: "$.data.error_id"}}
            - {call: "POST /lab-tests", payload: {subject_type: "BREEDER_FLOCK", subject_id: "00000000-0000-0000-0000-0000000000ff", test_code: "SALMONELLA_PULLORUM", collected_at: "2026-07-20T00:00:00Z"}, as: HatcheryManager, captures: {e2: "$.data.error_id"}}
            - {call: "POST /setter-loads/00000000-0000-0000-0000-0000000000ff/start", payload: {}, as: ChickProcessor, captures: {e3: "$.data.error_id"}}
            - {call: "POST /hatcher-loads/00000000-0000-0000-0000-0000000000ff/pull", payload: {hatched_count: 100}, as: IncubationOperator, captures: {e4: "$.data.error_id"}}
            - {call: "POST /placement-orders/00000000-0000-0000-0000-0000000000ff/confirm", payload: {}, as: ChickProcessor, captures: {e5: "$.data.error_id"}}
            - {call: "POST /corrective-actions/00000000-0000-0000-0000-0000000000ff/verify", payload: {outcome: "PASS"}, as: FlockManager, captures: {e6: "$.data.error_id"}}
            - {call: "POST /egg-lots/00000000-0000-0000-0000-0000000000ff/condemn", payload: {reason: "SHELL_QUALITY"}, as: IncubationOperator, captures: {e7: "$.data.error_id"}}
          assert:
            - "All seven calls: HTTP 403 with data.error_id == ERR_FORBIDDEN_ROLE"
            - "None of them returns a 404 even though every path id is unknown: the role gate at priority 2 precedes the not-found check at priority 4"
            - "No rows are created by any of the seven calls: GET /flock-programs/{id} for the attempted code is impossible and GET /lab-tests returns total_count 0"

      - name: unauthenticated_request_rejected
        claim_type: unauthenticated
        grounds:
          - validations.priority_1.ERR_UNAUTHENTICATED
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Identity is checked before authorization: a request that omits the X-User-ID header entirely must be 401 ERR_UNAUTHENTICATED even when its X-Role header names a role that WOULD be allowed to perform the operation, and the clock endpoint is the single documented exemption."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T12:00:00Z."
            - "The two trigger calls below are sent WITHOUT the X-User-ID header; the X-Role header still says FlockManager, a role that owns POST /breeder-flocks."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T12:00:00Z"}, as: HatcheryManager}
          trigger:
            - {call: "GET /breeder-flocks", payload: {}, as: FlockManager, captures: {e1: "$.data.error_id"}}
            - {call: "POST /breeder-flocks", payload: {code: "F9", program_id: "00000000-0000-0000-0000-0000000000ff", breed: "ROSS_308", house_code: "H9", hatch_date: "2026-01-05T00:00:00Z", placed_at: "2026-05-01T00:00:00Z", hen_count: 9000}, as: FlockManager, captures: {e2: "$.data.error_id"}}
          assert:
            - "Both calls (sent with no X-User-ID header): HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "The 401 wins over the missing program (404) and over any body validation (400): priority 1 is first"
            - "POST /_clock/set_current_utc remains callable without authentication, as the error catalog exempts it"

      - name: farm_principal_cross_farm_read_rejected
        claim_type: scoped_principal
        grounds:
          - roles.GrowerFarm.identity
          - validations.priority_3.ERR_FARM_SCOPE_VIOLATION
          - errors.ERR_FARM_SCOPE_VIOLATION
        distinguishing_aspect: "The GrowerFarm principal is entity_backed: the SAME endpoint returns 200 for the order of the farm whose operator_user_id equals the caller's X-User-ID and 403 ERR_FARM_SCOPE_VIOLATION for a sibling farm's order - and its list endpoint silently narrows to one row instead of leaking the other farm."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T12:00:00Z; farm FM1 belongs to u_grower_1 and farm FM2 to u_grower_2, each with one REQUESTED order."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T12:00:00Z"}, as: HatcheryManager}
            - {call: "POST /grower-farms", payload: {code: "FM1", operator_user_id: "u_grower_1", capacity_chicks: 20000}, as: HatcheryManager, captures: {fm1: "$.data.id"}}
            - {call: "POST /grower-farms", payload: {code: "FM2", operator_user_id: "u_grower_2", capacity_chicks: 20000}, as: HatcheryManager, captures: {fm2: "$.data.id"}}
            - {call: "POST /placement-orders", payload: {farm_id: "${fm1}", requested_breed: "ROSS_308", requested_placement_date: "2026-08-22T00:00:00Z", requested_chicks: 5000}, as: HatcheryManager, captures: {o1: "$.data.id"}}
            - {call: "POST /placement-orders", payload: {farm_id: "${fm2}", requested_breed: "ROSS_308", requested_placement_date: "2026-08-22T00:00:00Z", requested_chicks: 4000}, as: HatcheryManager, captures: {o2: "$.data.id"}}
          trigger:
            - {call: "GET /placement-orders/${o1}", payload: {}, as: GrowerFarm, as_user_id: "u_grower_1"}
            - {call: "GET /placement-orders/${o2}", payload: {}, as: GrowerFarm, as_user_id: "u_grower_1", captures: {e1: "$.data.error_id"}}
            - {call: "GET /grower-farms/${fm2}", payload: {}, as: GrowerFarm, as_user_id: "u_grower_1", captures: {e2: "$.data.error_id"}}
            - {call: "POST /placement-orders", payload: {farm_id: "${fm2}", requested_breed: "ROSS_308", requested_placement_date: "2026-08-23T00:00:00Z", requested_chicks: 3000}, as: GrowerFarm, as_user_id: "u_grower_1", captures: {e3: "$.data.error_id"}}
            - {call: "GET /placement-orders", payload: {}, as: GrowerFarm, as_user_id: "u_grower_1"}
          assert:
            - "Own order: HTTP 200 with data.id == ${o1} and farm_id == ${fm1}"
            - "Sibling order: HTTP 403 data.error_id == ERR_FARM_SCOPE_VIOLATION (not 404 - the row exists, the principal is just out of scope)"
            - "Sibling farm read: HTTP 403 ERR_FARM_SCOPE_VIOLATION"
            - "Placing an order on the sibling farm: HTTP 403 ERR_FARM_SCOPE_VIOLATION and no order row is created"
            - "The scoped list returns total_count 1 with only ${o1}; the same list as HatcheryManager returns total_count 2"

      - name: shared_reads_allowed_for_every_listed_role
        claim_type: shared_operations
        grounds:
          - roles.FlockManager.shared_operations
          - roles.IncubationOperator.shared_operations
          - endpoints.GET_/egg-lots/{id}
        distinguishing_aspect: "GET /egg-lots/{id} is declared for four roles, and all four must receive the identical representation - the shared read is not narrowed per role, and no role sees a redacted or reordered payload."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T12:00:00Z; lot L1 is GRADED with 10000 settable eggs."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T12:00:00Z"}, as: HatcheryManager}
            - {call: "POST /flock-programs", payload: {code: "P1", breed: "ROSS_308", stimulation_week: 21, lighting_steps: [{age_weeks: 21, photoperiod_hours: 12.0}, {age_weeks: 24, photoperiod_hours: 14.0}, {age_weeks: 30, photoperiod_hours: 16.0}], feed_steps: [{age_weeks: 21, feed_grams_per_hen_day: 150.0}, {age_weeks: 26, feed_grams_per_hen_day: 168.0}]}, as: HatcheryManager, captures: {p1: "$.data.id"}}
            - {call: "POST /breeder-flocks", payload: {code: "F1", program_id: "${p1}", breed: "ROSS_308", house_code: "H1", hatch_date: "2026-01-05T00:00:00Z", placed_at: "2026-05-01T00:00:00Z", hen_count: 9000}, as: FlockManager, captures: {f1: "$.data.id"}}
            - {call: "POST /lab-tests", payload: {subject_type: "BREEDER_FLOCK", subject_id: "${f1}", test_code: "SALMONELLA_PULLORUM", collected_at: "2026-07-20T00:00:00Z"}, as: Veterinarian, captures: {t1: "$.data.id"}}
            - {call: "POST /lab-tests/${t1}/release", payload: {result: "NEGATIVE"}, as: Veterinarian}
            - {call: "POST /breeder-flocks/${f1}/start-lay", payload: {}, as: FlockManager}
            - {call: "POST /egg-lots", payload: {flock_id: "${f1}", collected_at: "2026-07-30T00:00:00Z", collected_count: 10500}, as: FlockManager, captures: {l1: "$.data.id"}}
            - {call: "POST /egg-lots/${l1}/grade", payload: {grade_a_count: 10000, cracked_count: 300, dirty_count: 150, small_count: 50}, as: FlockManager}
          trigger:
            - {call: "GET /egg-lots/${l1}", payload: {}, as: FlockManager, captures: {v1: "$.data.version"}}
            - {call: "GET /egg-lots/${l1}", payload: {}, as: IncubationOperator, captures: {v2: "$.data.version"}}
            - {call: "GET /egg-lots/${l1}", payload: {}, as: Veterinarian, captures: {v3: "$.data.version"}}
            - {call: "GET /egg-lots/${l1}", payload: {}, as: HatcheryManager, captures: {v4: "$.data.version"}}
          assert:
            - "All four calls: HTTP 200 with data.id == ${l1}, status == GRADED, settable_count == 10000, eggs_remaining == 10000"
            - "${v1} == ${v2} == ${v3} == ${v4}: the shared read does not mutate the row for any role"
            - "POST /_clock/set_current_utc is accepted for every role, as declared in its endpoint roles list"

      - name: error_segregation_of_duties_between_opener_and_releaser
        claim_type: segregation_of_duties
        grounds:
          - validations.priority_9.ERR_SEGREGATION_OF_DUTIES
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / egg_operations_gated_on_flock_egg_hold
          rationale: "That instance ends with the veterinarian who opened the egg hold being refused the release at priority 9, ahead of the clearance check at priority 21; the corrective-action half of the duty split is asserted in the state_machines section."

  - section: cross_cutting_layers
    instances:
      - name: occ_allocation_requires_current_chick_batch_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.chick-batch-allocate-stale-version
          - validations.priority_10.ERR_STALE_VERSION
          - endpoints.POST_/chick-batches/{id}/allocations
        distinguishing_aspect: "The version read before boxing is stale by the time the batch is boxable, so the allocation carrying it must be 412 ERR_STALE_VERSION with zero DeliveryAssignment rows created; the retry with the post-boxing version succeeds and bumps the version again, which is what makes a replay of the successful request impossible."
        test_recipe:
          setup:
            - "Standard fixture through vaccination at 2026-08-22T18:00:00Z (hatched 9000, sexing_cull 450); the version is captured from the vaccinate response, BEFORE boxing."
            - "Farm FM1 is CLEARED with one CONFIRMED ROSS_308 order for 5000 chicks on 2026-08-22."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T12:00:00Z"}, as: HatcheryManager}
