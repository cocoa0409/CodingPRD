errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not allowed for the endpoint, or entity-backed identity mismatch (wrong Conductor / wrong CustomerRep)" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "Path id or body FK id does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, invalid type, or malformed body (e.g., through waybill without miles)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not defined from the resource's current state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version" }
  - { id: ERR_DUPLICATE_REPORTING_MARK, http: 409, condition: "Railcar reporting_mark already registered" }
  - { id: ERR_CALL_TARGET_REQUIRED, http: 400, condition: "CrewCall must reference exactly one of movement_id / switch_job_id" }
  - { id: ERR_MEMBER_NOT_AVAILABLE, http: 409, condition: "CrewMember.status is not AVAILABLE at call creation" }
  - { id: ERR_HOS_DAILY_LIMIT, http: 422, condition: "Rolling 24h on-duty minutes already at 720; no daily capacity remaining" }
  - { id: ERR_HOS_MONTHLY_LIMIT, http: 422, condition: "Monthly on-duty minutes already at 16560; no monthly capacity remaining" }
  - { id: ERR_HOS_REST_REQUIRED, http: 422, condition: "Member has not completed 600 minutes of rest" }
  - { id: ERR_CALL_WINDOW_OVERLAP, http: 409, condition: "Half-open duty window overlaps another non-terminal call of the same member" }
  - { id: ERR_SIDING_AGREEMENT_INACTIVE, http: 422, condition: "Siding maintenance agreement not ACTIVE at order acceptance" }
  - { id: ERR_SIDING_CAPACITY_EXCEEDED, http: 422, condition: "Order quantity exceeds siding capacity_cars" }
  - { id: ERR_CUSTOMER_CREDIT_SUSPENDED, http: 422, condition: "Customer credit_status is SUSPENDED at order acceptance" }
  - { id: ERR_QUANTITY_BELOW_FURNISHED, http: 422, condition: "Amended quantity is below cars already furnished" }
  - { id: ERR_INSUFFICIENT_AVAILABLE_CARS, http: 409, condition: "Fewer eligible railcars than requested furnish count" }
  - { id: ERR_ORDER_NOT_AMENDABLE, http: 409, condition: "PATCH attempted on an order not in PLACED or ACCEPTED" }
  - { id: ERR_CAR_NOT_ON_LINE, http: 409, condition: "Waybill references a car with status INTERCHANGED_OUT, BAD_ORDER, or HELD" }
  - { id: ERR_SEGMENT_NOT_IN_SERVICE, http: 409, condition: "A route segment is RESTRICTED or has an open defect blocking ready/depart/resume" }
  - { id: ERR_INSPECTION_OVERLAP, http: 409, condition: "Inspection day on the same segment within one full day of an existing inspection" }
  - { id: ERR_MOVEMENT_NO_CREW, http: 422, condition: "Movement has no crew call in ACCEPTED or ON_DUTY at ready" }
  - { id: ERR_WAYBILL_NOT_RATED, http: 409, condition: "Movement settle blocked by a linked waybill still in CREATED" }
  - { id: ERR_INTERCHANGE_DUPLICATE, http: 409, condition: "Open RECEIVED event already exists for the railcar" }
  - { id: ERR_INTERCHANGE_DIRECTION_INVALID, http: 409, condition: "DELIVERED reported for a car not on line, or FOREIGN delivery without miles_traveled_on_line" }
  - { id: ERR_FRA_REPORT_REQUIRED, http: 422, condition: "Closing a reportable incident from INVESTIGATING before filing the FRA report" }
  - { id: ERR_INCIDENT_NOT_REPORTABLE, http: 422, condition: "file-fra-report attempted on a non-reportable incident" }
  - { id: ERR_GRANT_NOT_ACTIVE, http: 409, condition: "Milestone submit/approve/pay while the project is not ACTIVE" }
  - { id: ERR_MILESTONE_VALUE_EXCEEDS_AWARD, http: 422, condition: "Sum of non-rejected milestone values would exceed the project award" }
  - { id: ERR_MILESTONE_NOT_SUBMITTED, http: 409, condition: "Approve/reject attempted on a milestone not in SUBMITTED" }
  - { id: ERR_DIVISION_BASIS_INVALID, http: 400, condition: "agreed_pct missing/forbidden for the chosen basis, or waybill not RATED/BILLED" }
  - { id: ERR_DIVISION_EXISTS, http: 409, condition: "A division already exists for the waybill" }

roles:
  - name: SystemAdmin
    description: "Railroad system administrator; owns master data (customers, sidings, railcars, segments, crew roster) and the logical clock"
    identity: opaque
    exclusive_operations: [create/patch customers, create/renew/suspend sidings, create railcars, create crew members, create/change-class track segments, set logical clock]
    shared_operations: [all list/get reads]
  - name: Dispatcher
    description: "Train dispatcher; runs car orders, switching, movements, interchange reporting, incident reporting"
    identity: opaque
    exclusive_operations: [accept/furnish car orders, bad-order/return railcars, plan/assign/complete/annul switch jobs, create/ready/depart/hold/resume/arrive movements, report interchange events, report/investigate incidents, create waybills]
    shared_operations: [all list/get reads]
  - name: CrewCaller
    description: "Crew calling desk; creates and relieves crew calls, corrects HOS timekeeping"
    identity: opaque
    exclusive_operations: [create crew calls, relieve crew calls, adjust-hos]
    shared_operations: [all list/get reads]
  - name: Conductor
    description: "Crew member responding to calls"
    identity: "entity_backed:CrewMember"
    exclusive_operations: [respond to own crew call, report on duty for own crew call]
    shared_operations: [all list/get reads]
  - name: TrackInspector
    description: "Track inspector; schedules, files, and remediates inspections"
    identity: opaque
    exclusive_operations: [create/file/remediate track inspections]
    shared_operations: [all list/get reads]
  - name: SettlementClerk
    description: "Accounting clerk; owns car hire, waybill rating, revenue divisions, movement settlement, milestone payment"
    identity: opaque
    exclusive_operations: [confirm/dispute/resolve interchange, close/settle/dispute/reopen car hire statements, rate waybills, create/agree/dispute/settle revenue divisions, settle movements, pay milestones]
    shared_operations: [all list/get reads]
  - name: RegulatorOfficer
    description: "FRA/grantor agency officer; approves milestone submissions and closes or reopens incidents"
    identity: opaque
    exclusive_operations: [file-fra-report, close/reopen incidents, waive defects, approve/reject grant milestones]
    shared_operations: [all list/get reads]
  - name: CustomerRep
    description: "Shipper representative acting for one Customer"
    identity: "entity_backed:Customer"
    exclusive_operations: [place/amend/cancel/release own car orders, read own demurrage]
    shared_operations: [all list/get reads]
  - name: GrantManager
    description: "Railroad grant program manager; owns projects and submits milestones (segregated from agency approval)"
    identity: opaque
    exclusive_operations: [create/activate/suspend/resume grant projects, create/submit milestones]
    shared_operations: [all list/get reads]
