scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — dual-variant calculations on DIFFERENT entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: next_due_on_therapeutic_cycle_overrides_routine_cycle
        grounds:
          - calculations.next_due_on
          - calculations.snap_forward_scheduled_date
          - entities.Horse.fields.next_due_on
          - entities.Horse.fields.active_prescription_id
          - entities.Appointment.fields.cycle_source
          - state_machines.VetPrescription.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          This dual-variant pair lives on the SCHEDULING domain (Horse x VetPrescription):
          identical completion data yields next_due_on 2026-06-17 under the ROUTINE variant
          (6 routine weeks) and 2026-05-20 under the THERAPEUTIC variant (2 prescribed weeks),
          because a live prescription overrides the routine cycle unconditionally.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-06. Zone A barn serving MON-FRI, one client, one horse with routine_cycle_weeks 6."
            - "A lameness case of severity 2 (below the hold threshold, so the horse stays CLEAR) carrying an ACTIVE prescription with prescribed_cycle_weeks 2 and expires_on 2026-06-30."
            - "A route on 2026-05-06 with one stop, the horse's appointment attached, dispatched and arrived."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barns"
              payload: { name: "Ridgeview", zone: "A", served_weekdays: ["MON", "TUE", "WED", "THU", "FRI"], access_open_minute: 420, access_close_minute: 1020, blackout_dates: [] }
              as: PlatformAdmin
              captures: { barn_a: "$.data.id" }
            - call: "POST /clients"
              payload: { display_name: "Aoi Tanaka", home_barn_id: "${barn_a}", tax_exempt: false }
              as: PlatformAdmin
              captures: { cl1: "$.data.id" }
            - call: "POST /horses"
              payload: { client_id: "${cl1}", barn_id: "${barn_a}", name: "Comet", routine_cycle_weeks: 6, shoe_size_code: "1", requires_sedation: false }
              as: PlatformAdmin
              captures: { h1: "$.data.id" }
            - call: "GET /horses/${h1}/limb-states"
              payload: {}
              as: PlatformAdmin
              captures: { lf: "$.data[0].id", rf: "$.data[1].id", lh: "$.data[2].id", rh: "$.data[3].id" }
            - call: "POST /farriers"
              payload: { display_name: "Kenji Mori", certification_level: "CERTIFIED_THERAPEUTIC", cert_expires_on: "2027-01-01" }
              as: PlatformAdmin
              captures: { fr1: "$.data.id" }
            - call: "POST /shoe-skus"
              payload: { sku_code: "ST-1", size_code: "1", material: "STEEL", price_cents_per_pair: 5600 }
              as: PlatformAdmin
              captures: { sku1: "$.data.id" }
            - call: "GET /inventory-buckets"
              payload: { farrier_id: "${fr1}", sku_id: "${sku1}", location_kind: "VAN" }
              as: PlatformAdmin
              captures: { van1: "$.data[0].id" }
            - call: "POST /inventory-buckets/${van1}/adjust"
              payload: { delta_pairs: 10 }
              as: PlatformAdmin
            - call: "POST /rate-cards"
              payload: { label: "2026 base", effective_from: "2026-01-01", price_trim_cents: 2200, price_reset_cents: 3800, price_new_shoes_cents: 6500, price_corrective_cents: 9800, price_glue_on_cents: 8400, pad_price_cents: 1600, trip_fee_zone_a_cents: 4500, trip_fee_zone_b_cents: 7000, trip_fee_zone_c_cents: 11000 }
              as: PlatformAdmin
              captures: { rc1: "$.data.id" }
            - call: "POST /rate-cards/${rc1}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /lameness-cases"
              payload: { horse_id: "${h1}", reported_on: "2026-05-04", severity: 2 }
              as: Veterinarian
              captures: { lc1: "$.data.id", lc1_v: "$.data.version" }
            - call: "POST /vet-prescriptions"
              payload: { lameness_case_id: "${lc1}", issued_on: "2026-05-04", expires_on: "2026-06-30", limb_scope: ["LF", "RF", "LH", "RH"], prescribed_cycle_weeks: 2 }
              as: Veterinarian
              captures: { rx1: "$.data.id" }
            - call: "POST /vet-prescriptions/${rx1}/activate"
              payload: { expected_lameness_case_version: "${lc1_v}" }
              as: Veterinarian
            - call: "POST /routes"
              payload: { farrier_id: "${fr1}", route_date: "2026-05-06" }
              as: Dispatcher
              captures: { rt1: "$.data.id" }
            - call: "POST /routes/${rt1}/stops"
              payload: { barn_id: "${barn_a}", sequence_index: 1, planned_start_minute: 480 }
              as: Dispatcher
              captures: { st1: "$.data.id" }
            - call: "POST /appointments"
              payload: { horse_id: "${h1}", scheduled_date: "2026-05-06", vet_present: false }
              as: Dispatcher
              captures: { ap1: "$.data.id", ap1_v: "$.data.version" }
            - call: "POST /appointments/${ap1}/service-lines"
              payload: { lines: [{ limb_state_id: "${lf}", service_type: "TRIM" }, { limb_state_id: "${rf}", service_type: "TRIM" }, { limb_state_id: "${lh}", service_type: "TRIM" }, { limb_state_id: "${rh}", service_type: "TRIM" }], expected_appointment_version: "${ap1_v}" }
              as: Dispatcher
              captures: { sl_lf: "$.data[0].id", sl_rf: "$.data[1].id", sl_lh: "$.data[2].id", sl_rh: "$.data[3].id" }
            - call: "GET /routes/${rt1}"
              payload: {}
              as: Dispatcher
              captures: { rt1_v: "$.data.version" }
            - call: "POST /route-stops/${st1}/appointments"
              payload: { appointment_id: "${ap1}", expected_route_version: "${rt1_v}" }
              as: Dispatcher
            - call: "POST /routes/${rt1}/plan"
              payload: {}
              as: Dispatcher
            - call: "POST /routes/${rt1}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-06T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /route-stops/${st1}/arrive"
              payload: {}
              as: Farrier
              as_user_id: "${fr1}"
            - call: "POST /appointments/${ap1}/start"
              payload: {}
              as: Farrier
              as_user_id: "${fr1}"
          trigger:
            - call: "POST /appointments/${ap1}/complete"
              payload: { performed_service_line_ids: ["${sl_lf}", "${sl_rf}", "${sl_lh}", "${sl_rh}"] }
              as: Farrier
              as_user_id: "${fr1}"
          assert:
            - "Horse.${h1}.next_due_on == \"2026-05-20\""
            - "Horse.${h1}.last_completed_on == \"2026-05-06\""
            - "GET /appointments?horse_id=${h1}&status=UNROUTED returns exactly 1 row and that row's scheduled_date == \"2026-05-20\""
            - "that successor row's cycle_source == \"THERAPEUTIC\""
            - "the ROUTINE variant would have produced 2026-06-17; the value 2026-06-17 must NOT appear on Horse.${h1}.next_due_on"

      - name: visit_price_final_prices_off_completion_date_not_scheduled_date
        grounds:
          - calculations.visit_price
          - calculations.effective_rate_card_selection
          - entities.Appointment.fields.estimated_total_cents
          - entities.Invoice.fields.total_cents
          - state_machines.RateCard.ACTIVE_to_SUPERSEDED
        distinguishing_aspect: |
          This dual-variant pair lives on the BILLING domain (Appointment x RateCard x Invoice),
          a different entity domain from the scheduling pair above: identical service lines
          yield estimated_total_cents 37200 under the ESTIMATE variant (card effective at the
          scheduled date 2026-05-04) and Invoice.total_cents 40012 under the FINAL variant
          (card effective at the completion date 2026-05-06).
        test_recipe:
          setup:
            - "Two rate cards: RC1 effective 2026-01-01 with price_new_shoes_cents 6500, RC2 effective 2026-05-05 with price_new_shoes_cents 7000 superseding RC1. Both activated before the attach."
            - "A route on 2026-05-04 with one zone A stop; the horse's appointment carries four NEW_SHOES lines and is attached while the clock reads 2026-05-01."
            - "The clock is then advanced to 2026-05-06 and the visit is completed."
          setup_api_calls:
            - call: "POST /barns"
              payload: { name: "Ridgeview", zone: "A", served_weekdays: ["MON", "TUE", "WED", "THU", "FRI"], access_open_minute: 420, access_close_minute: 1020, blackout_dates: [] }
              as: PlatformAdmin
              captures: { barn_a: "$.data.id" }
            - call: "POST /clients"
              payload: { display_name: "Aoi Tanaka", home_barn_id: "${barn_a}", tax_exempt: false }
              as: PlatformAdmin
              captures: { cl1: "$.data.id" }
            - call: "POST /horses"
              payload: { client_id: "${cl1}", barn_id: "${barn_a}", name: "Comet", routine_cycle_weeks: 6, shoe_size_code: "1", requires_sedation: false }
              as: PlatformAdmin
              captures: { h1: "$.data.id" }
            - call: "GET /horses/${h1}/limb-states"
              payload: {}
              as: PlatformAdmin
              captures: { lf: "$.data[0].id", rf: "$.data[1].id", lh: "$.data[2].id", rh: "$.data[3].id" }
            - call: "POST /farriers"
              payload: { display_name: "Kenji Mori", certification_level: "JOURNEYMAN", cert_expires_on: "2027-01-01" }
              as: PlatformAdmin
              captures: { fr1: "$.data.id" }
            - call: "POST /shoe-skus"
              payload: { sku_code: "ST-1", size_code: "1", material: "STEEL", price_cents_per_pair: 5600 }
              as: PlatformAdmin
              captures: { sku1: "$.data.id" }
            - call: "GET /inventory-buckets"
              payload: { farrier_id: "${fr1}", sku_id: "${sku1}", location_kind: "VAN" }
              as: PlatformAdmin
              captures: { van1: "$.data[0].id" }
            - call: "POST /inventory-buckets/${van1}/adjust"
              payload: { delta_pairs: 10 }
              as: PlatformAdmin
            - call: "POST /rate-cards"
              payload: { label: "2026 base", effective_from: "2026-01-01", price_trim_cents: 2200, price_reset_cents: 3800, price_new_shoes_cents: 6500, price_corrective_cents: 9800, price_glue_on_cents: 8400, pad_price_cents: 1600, trip_fee_zone_a_cents: 4500, trip_fee_zone_b_cents: 7000, trip_fee_zone_c_cents: 11000 }
              as: PlatformAdmin
              captures: { rc1: "$.data.id" }
            - call: "POST /rate-cards/${rc1}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /rate-cards"
              payload: { label: "2026 May uplift", effective_from: "2026-05-05", price_trim_cents: 2400, price_reset_cents: 4000, price_new_shoes_cents: 7000, price_corrective_cents: 10400, price_glue_on_cents: 8900, pad_price_cents: 1700, trip_fee_zone_a_cents: 4800, trip_fee_zone_b_cents: 7400, trip_fee_zone_c_cents: 11600, supersedes_rate_card_id: "${rc1}" }
              as: PlatformAdmin
              captures: { rc2: "$.data.id" }
            - call: "POST /rate-cards/${rc2}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /routes"
              payload: { farrier_id: "${fr1}", route_date: "2026-05-04" }
              as: Dispatcher
              captures: { rt1: "$.data.id" }
            - call: "POST /routes/${rt1}/stops"
              payload: { barn_id: "${barn_a}", sequence_index: 1, planned_start_minute: 480 }
              as: Dispatcher
              captures: { st1: "$.data.id" }
            - call: "POST /appointments"
              payload: { horse_id: "${h1}", scheduled_date: "2026-05-04", vet_present: false }
              as: Dispatcher
              captures: { ap1: "$.data.id", ap1_v: "$.data.version" }
            - call: "POST /appointments/${ap1}/service-lines"
              payload: { lines: [{ limb_state_id: "${lf}", service_type: "NEW_SHOES", sku_id: "${sku1}" }, { limb_state_id: "${rf}", service_type: "NEW_SHOES", sku_id: "${sku1}" }, { limb_state_id: "${lh}", service_type: "NEW_SHOES", sku_id: "${sku1}" }, { limb_state_id: "${rh}", service_type: "NEW_SHOES", sku_id: "${sku1}" }], expected_appointment_version: "${ap1_v}" }
              as: Dispatcher
              captures: { sl_lf: "$.data[0].id", sl_rf: "$.data[1].id", sl_lh: "$.data[2].id", sl_rh: "$.data[3].id" }
            - call: "GET /routes/${rt1}"
              payload: {}
              as: Dispatcher
              captures: { rt1_v: "$.data.version" }
            - call: "POST /route-stops/${st1}/appointments"
              payload: { appointment_id: "${ap1}", expected_route_version: "${rt1_v}" }
              as: Dispatcher
              captures: { est_total: "$.data.estimated_total_cents" }
            - call: "POST /routes/${rt1}/plan"
              payload: {}
              as: Dispatcher
            - call: "POST /routes/${rt1}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-06T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /route-stops/${st1}/arrive"
              payload: {}
              as: Farrier
              as_user_id: "${fr1}"
