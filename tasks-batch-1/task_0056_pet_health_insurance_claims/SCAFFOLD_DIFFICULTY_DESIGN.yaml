              as: Underwriter
              captures: { p2: $.data.id }
            - call: "POST /accounts/${acct}/policies/${p2}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /accounts/${acct}/policies/${p2}/lapse"
              payload: {}
              as: Underwriter
            - call: "POST /accounts/${acct}/policies"
              payload: { pet_name: "Mia2", species: "CAT", base_premium_cents: 3800, annual_deductible_cents: 25000, reimbursement_rate_bps: 8000, annual_cap_cents: 500000, wellness_rider: false, effective_date: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { p3: $.data.id }
          trigger:
