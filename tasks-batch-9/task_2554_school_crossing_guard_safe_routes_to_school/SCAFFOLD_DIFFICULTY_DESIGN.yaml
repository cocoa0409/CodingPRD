              captures: { g1_id: $.data.id }
            - call: "POST /srts/guards/${g1_id}/training"
              payload: { training_date: "2026-08-05", hours: 12, curriculum_code: "SRTS-BASIC" }
              as: CrossingSupervisor
              as_user_id: "sup-1"
            - call: "POST /srts/guards/${g1_id}/equipment"
              payload: { item_type: "HIGH_VIS_VEST", issued_on: "2026-08-06" }
              as: CrossingSupervisor
