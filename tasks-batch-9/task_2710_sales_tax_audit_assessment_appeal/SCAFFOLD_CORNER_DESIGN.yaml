      - name: certificate_rejection_cascade_reaches_the_notice_in_one_request
        claim_type: cascading_side_effects
        grounds: [state_machines.Assessment.transitions.DRAFT_to_DRAFT_STALE, calculations.certificate_deficiency]
        excluded_because:
          difficulty_instance: transitive_cascade / certificate_rejection_four_hop_cascade_stales_the_draft_notice
          rationale: |
            §1.8 already walks the full four-hop chain (certificate REJECTED ->
            Audit.certificate_deficiency_cents -> Audit.projection_status STALE ->
            Assessment DRAFT_STALE) with the intermediate values asserted at every
            hop, which is exactly what this layer's row asks for.

      - name: both_projection_variants_run_on_one_sample
        claim_type: dual_variant_calculation
        grounds: [calculations.sample_projection.variants, entities.Audit.fields.projection_method]
        excluded_because:
          difficulty_instance: dual_variant_calc / projection_variant_ratio_vs_mean_same_sample
          rationale: |
            §1.8 already holds the sample fixed and switches the agreed methodology so
            RATIO_ESTIMATION and MEAN_PER_UNIT produce two different projected
            deficiencies, with the delta asserted as a literal. The layer needs
            nothing further.

      - name: the_penalty_tier_boundary_is_exercised_at_the_cent
        claim_type: rate_threshold_triggers
        grounds: [calculations.penalty_tier, entities.Assessment.fields.penalty_rate_bp]
        excluded_because:
          difficulty_instance: boundary_precision_check / penalty_tier_boundary_at_exactly_one_million_cents
          rationale: |
            §1.8 already tests the tier ladder one cent below, exactly at and one cent
            above 1000000 cents of deficiency, which is the boundary form this layer
            row prescribes; the small-balance ceiling at 5000 is separately pinned by
            small_balance_threshold_inclusive_at_exactly_5000.

