      - name: roll_allocation_gated_by_producing_run_quality_axis
        grounds:
          - state_machines.RollSet.WRAPPED_to_ALLOCATED
          - state_machines.ProductionRun.PROVISIONAL_to_CERTIFIED
          - validations.priority_36
          - errors.ERR_RUN_NOT_CERTIFIED
          - calculations.order_allocation_ledger
