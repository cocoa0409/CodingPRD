              payload: {}
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { dv_t0: $.data.version }
            - call: "POST /drinkware/enforcement-cases/${case_t1}/resolve"
              payload: { outcome: "CONFIRMED_VIOLATION", infraction_category: "BRAND_STANDARD", resolution_notes: "t1", expected_dealer_version: "${dv_t0}" }
              as: ChannelManager
              as_user_id: "cm-1"
            - call: "GET /drinkware/dealers/${c_dealer}"
