            - "SalesOrder.${so_id}.billing_status == VOIDED"
            - "Allocation.${a1_id}.status == RELEASED"
            - "OrderLine.${ol_id}.allocated_length_ft == 0"
            - "OrderLine.${ol_id}.allocation_status == UNALLOCATED"
            - "Reel.${r1_id}.status == IN_STOCK"
