  - rule_id: compensating_invariant
    instances:
      - name: fee_reversal_restores_deposit_balance
        grounds:
          - state_machines.FeeCharge.POSTED_to_REVERSED
          - calculations.deposit_balance
          - entities.Case.fields.deposit_balance_cents
          - entities.Case.fields.posted_fee_cents
        distinguishing_aspect: |
          Conserved quantity = case money: deposit_balance == paid - posted. Posting 200000
          (balance 500000->300000) then reversing returns it to exactly 500000 with posted_fee_cents 0.
        test_recipe:
          setup:
            - "Appointed ARBITRATION case (rate 50000) in HEARING; PAID deposit 500000"
            - "One POSTED FeeCharge of 200000 (4h) => deposit_balance 300000"
          setup_api_calls:
            - call: "POST /neutrals"
              payload: { full_name: "Arb Rev", neutral_type: "ARBITRATOR", hourly_rate_cents: 50000 }
              as: CaseAdministrator
              captures: { n_id: $.data.id }
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "Rev", claim_amount_cents: 2000000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "CLAIMANT", display_name: "A", share_pct: 50 }
              as: CaseAdministrator
              captures: { pA: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "RESPONDENT", display_name: "B", share_pct: 50 }
              as: CaseAdministrator
              captures: { pB: $.data.id }
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "SELECTION" }
              as: CaseAdministrator
              captures: { cv_sel: $.data.version }
            - call: "POST /cases/${c_id}/candidates"
              payload: { neutral_id: "${n_id}", expected_case_version: "${cv_sel}" }
              as: CaseAdministrator
              captures: { cand: $.data.id }
            - call: "POST /candidates/${cand}/disclose"
              payload: { disclosure_text: "none", has_conflict: false }
              as: Neutral
              as_user_id: "${n_id}"
            - call: "POST /candidates/${cand}/transition"
              payload: { to_status: "CLEARED" }
              as: CaseAdministrator
            - call: "GET /cases/${c_id}"
              as: CaseAdministrator
              captures: { cv_pre: $.data.version }
            - call: "POST /cases/${c_id}/appoint"
              payload: { expected_case_version: "${cv_pre}" }
              as: CaseAdministrator
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "HEARING" }
              as: CaseAdministrator
            - call: "POST /deposits"
              payload: { case_id: "${c_id}", amount_cents: 500000 }
              as: CaseAdministrator
              captures: { dep: $.data.id }
            - call: "POST /deposits/${dep}/pay"
              as: Party
              as_user_id: "${pA}"
            - call: "GET /cases/${c_id}"
              as: CaseAdministrator
              captures: { cv_fee: $.data.version }
            - call: "POST /cases/${c_id}/fee-charges"
              payload: { neutral_id: "${n_id}", hours: 4, expected_case_version: "${cv_fee}" }
              as: CaseAdministrator
              captures: { fc: $.data.id }
          trigger:
            - call: "POST /fee-charges/${fc}/reverse"
              as: CaseAdministrator
          assert:
            - "Case.${c_id}.posted_fee_cents == 0"
            - "Case.${c_id}.deposit_balance_cents == 500000"

      - name: strike_withdraw_restores_allowance
        grounds:
          - state_machines.Ranking.ACTIVE_to_WITHDRAWN
          - entities.Party.fields.strikes_used
          - entities.Party.fields.strikes_remaining
          - entities.Case.fields.strikes_per_party
        distinguishing_aspect: |
          Conserved quantity = strike count: strikes_used + strikes_remaining == strikes_per_party (2).
          After two strikes (used 2, remaining 0) withdrawing one returns used 1 / remaining 1.
        test_recipe:
          setup:
            - "SELECTION-phase case (strikes_per_party 2) with two PROPOSED candidates"
            - "Party A has struck both candidates (strikes_used 2, strikes_remaining 0)"
          setup_api_calls:
            - call: "POST /neutrals"
              payload: { full_name: "N1", neutral_type: "ARBITRATOR", hourly_rate_cents: 40000 }
              as: CaseAdministrator
              captures: { n1: $.data.id }
            - call: "POST /neutrals"
              payload: { full_name: "N2", neutral_type: "ARBITRATOR", hourly_rate_cents: 40000 }
              as: CaseAdministrator
              captures: { n2: $.data.id }
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "Strikes", claim_amount_cents: 500000, panel_size: 1, strikes_per_party: 2 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "CLAIMANT", display_name: "A", share_pct: 50 }
              as: CaseAdministrator
              captures: { pA: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "RESPONDENT", display_name: "B", share_pct: 50 }
              as: CaseAdministrator
              captures: { pB: $.data.id }
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "SELECTION" }
              as: CaseAdministrator
              captures: { cv_sel: $.data.version }
            - call: "POST /cases/${c_id}/candidates"
              payload: { neutral_id: "${n1}", expected_case_version: "${cv_sel}" }
              as: CaseAdministrator
              captures: { cand1: $.data.id }
            - call: "GET /cases/${c_id}"
              as: CaseAdministrator
              captures: { cv_a1: $.data.version }
            - call: "POST /cases/${c_id}/candidates"
              payload: { neutral_id: "${n2}", expected_case_version: "${cv_a1}" }
              as: CaseAdministrator
              captures: { cand2: $.data.id }
            - call: "POST /rankings"
              payload: { candidate_id: "${cand1}", party_id: "${pA}", action: "STRIKE" }
              as: Party
              as_user_id: "${pA}"
              captures: { r1: $.data.id }
            - call: "POST /rankings"
              payload: { candidate_id: "${cand2}", party_id: "${pA}", action: "STRIKE" }
              as: Party
              as_user_id: "${pA}"
              captures: { r2: $.data.id }
          trigger:
            - call: "POST /rankings/${r1}/withdraw"
              as: Party
              as_user_id: "${pA}"
          assert:
            - "Party.${pA}.strikes_used == 1"
            - "Party.${pA}.strikes_remaining == 1"
