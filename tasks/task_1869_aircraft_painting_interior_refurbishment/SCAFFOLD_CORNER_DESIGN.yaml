            - { call: "POST /completion/paint-schemes/${sch_a}/submit", payload: {}, as: DesignLead }
            - { call: "POST /completion/paint-schemes/${sch_a}/approve", payload: { expected_program_version: "${prog_v0}" }, as: CustomerRep, as_user_id: "${cust_id}" }
            - { call: "POST /completion/paint-schemes", payload: { program_id: "${prog_id}", drawing_ref: "DWG-1869-B", painted_area_sqft: 2400, coat_count: 2, stripe_pct: 0.10 }, as: DesignLead, captures: { sch_b: $.data.id } }
            - { call: "POST /completion/paint-schemes/${sch_b}/submit", payload: {}, as: DesignLead }
            - { call: "GET /completion/programs/${prog_id}", as: ProgramManager, captures: { prog_v1: $.data.version } }
          trigger:
            - { call: "POST /completion/paint-schemes/${sch_b}/approve", payload: { expected_program_version: "${prog_v1}" }, as: CustomerRep, as_user_id: "${cust_id}", captures: { st_b: $.data.status } }
            - { call: "GET /completion/paint-schemes/${sch_a}", as: DesignLead, captures: { st_a: $.data.status, sup_by: $.data.superseded_by_id } }
            - { call: "GET /completion/programs/${prog_id}", as: ProgramManager, captures: { pinned: $.data.approved_scheme_id } }
            - { call: "POST /completion/paint-schemes/${sch_a}/submit", payload: {}, as: DesignLead, captures: { err: $.data.error_id } }
          assert:
            - "st_b == APPROVED and st_a == SUPERSEDED and sup_by == sch_b"
            - "pinned == sch_b (version pin moved to the new approval)"
            - "err == ERR_INVALID_STATE (SUPERSEDED is terminal)"

