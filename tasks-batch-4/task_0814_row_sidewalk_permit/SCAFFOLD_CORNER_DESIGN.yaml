scaffold_corner_design:
  # ===================================================================
  # Entities
  # ===================================================================
  - section: entities
    instances:
      - name: applicant_creation_returns_fields
        claim_type: creation
        grounds: [entities.Applicant.fields.company_name]
        distinguishing_aspect: "POST /applicants with all required fields returns 201 and echoes company_name/license_number."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /applicants"
              payload: { company_name: "Acme", license_number: "L1", contact_email: "a@x.com" }
              as: PlatformAdmin
              captures: { app: $.data.id }
          assert:
            - "Applicant.${app}.company_name == Acme"
            - "Applicant.${app}.license_number == L1"

      - name: permit_not_found_on_get_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_PERMIT_NOT_FOUND]"]
        distinguishing_aspect: "GET /permits/{unknown-uuid} returns ERR_PERMIT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /permits/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PERMIT_NOT_FOUND"

      - name: permit_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Permit.fields.requested_end_date, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /permits without requested_end_date returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["An applicant and a segment exist."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { company_name: "Acme", license_number: "L1", contact_email: "a@x.com" }
              as: PlatformAdmin
              captures: { app: $.data.id }
            - call: "POST /street-segments"
              payload: { block_label: "Main 100", zone_class: "COMMERCIAL", last_repaved_date: "2020-01-01", roadway_lane_count: 2 }
              as: PlatformAdmin
              captures: { seg: $.data.id }
          trigger:
            - call: "POST /permits"
              payload: { applicant_id: "${app}", street_segment_id: "${seg}", primary_obstruction_type: "LANE", requested_start_date: "2026-04-01" }
              as: Applicant
              as_user_id: "${app}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: street_segment_moratorium_end_computed
        claim_type: computed_fields
        grounds: [entities.StreetSegment.fields.moratorium_end_date, calculations.moratorium_window]
        distinguishing_aspect: "ARTERIAL segment last repaved 2020-01-01 gets moratorium_end_date 2025-01-01 (5-year window)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /street-segments"
              payload: { block_label: "Grand 3", zone_class: "ARTERIAL", last_repaved_date: "2020-01-01", roadway_lane_count: 4 }
              as: PlatformAdmin
              captures: { seg: $.data.id }
          assert:
            - "StreetSegment.${seg}.moratorium_end_date == 2025-01-01"

      - name: street_segment_invalid_zone_enum_rejected
        claim_type: type_constraints
        grounds: [entities.StreetSegment.fields.zone_class, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /street-segments with zone_class INDUSTRIAL (not in enum) returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /street-segments"
              payload: { block_label: "Bad 1", zone_class: "INDUSTRIAL", last_repaved_date: "2020-01-01", roadway_lane_count: 2 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

  # ===================================================================
  # State Machines
  # ===================================================================
  - section: state_machines
    instances:
      - name: permit_initial_state_is_draft
        claim_type: initial_state
        grounds: [entities.Permit.fields.status, state_machines.Permit.DRAFT_to_UNDER_REVIEW]
        distinguishing_aspect: "A freshly created permit starts in DRAFT with version 1."
        test_recipe:
          setup: ["An applicant and a segment exist."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { company_name: "Acme", license_number: "L1", contact_email: "a@x.com" }
              as: PlatformAdmin
              captures: { app: $.data.id }
            - call: "POST /street-segments"
              payload: { block_label: "Main 100", zone_class: "COMMERCIAL", last_repaved_date: "2020-01-01", roadway_lane_count: 2 }
              as: PlatformAdmin
              captures: { seg: $.data.id }
          trigger:
            - call: "POST /permits"
              payload: { applicant_id: "${app}", street_segment_id: "${seg}", primary_obstruction_type: "LANE", requested_start_date: "2026-04-01", requested_end_date: "2026-04-11" }
              as: Applicant
              as_user_id: "${app}"
              captures: { permit: $.data.id }
          assert:
            - "Permit.${permit}.status == DRAFT"
            - "Permit.${permit}.version == 1"

      - name: submit_from_approved_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Permit.DRAFT_to_UNDER_REVIEW, "validations[priority=5]", "errors[ERR_INVALID_PERMIT_STATE]"]
        distinguishing_aspect: "Submitting an APPROVED permit (not DRAFT/RETURNED) returns ERR_INVALID_PERMIT_STATE."
        test_recipe:
          setup: ["A permit approved by the reviewer."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { company_name: "Acme", license_number: "L1", contact_email: "a@x.com" }
              as: PlatformAdmin
              captures: { app: $.data.id }
            - call: "POST /street-segments"
              payload: { block_label: "Main 100", zone_class: "COMMERCIAL", last_repaved_date: "2020-01-01", roadway_lane_count: 2 }
              as: PlatformAdmin
              captures: { seg: $.data.id }
            - call: "POST /permits"
              payload: { applicant_id: "${app}", street_segment_id: "${seg}", primary_obstruction_type: "LANE", requested_start_date: "2026-04-01", requested_end_date: "2026-04-11" }
              as: Applicant
              as_user_id: "${app}"
              captures: { permit: $.data.id }
            - call: "POST /permits/${permit}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${app}"
            - call: "POST /permits/${permit}/decision"
              payload: { outcome: "APPROVED" }
              as: PermitReviewer
              as_user_id: "reviewer-1"
          trigger:
            - call: "POST /permits/${permit}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${app}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_PERMIT_STATE"

      - name: expired_permit_submit_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Permit.ISSUED_to_EXPIRED, "errors[ERR_INVALID_PERMIT_STATE]"]
        distinguishing_aspect: "From terminal EXPIRED, a submit is rejected with ERR_INVALID_PERMIT_STATE."
        test_recipe:
          setup: ["An issued permit (valid_until 2026-04-11) expired after advancing the clock to 2026-04-12."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { company_name: "Acme", license_number: "L1", contact_email: "a@x.com" }
              as: PlatformAdmin
              captures: { app: $.data.id }
            - call: "POST /street-segments"
              payload: { block_label: "Main 100", zone_class: "COMMERCIAL", last_repaved_date: "2020-01-01", roadway_lane_count: 2 }
              as: PlatformAdmin
              captures: { seg: $.data.id }
            - call: "POST /permits"
              payload: { applicant_id: "${app}", street_segment_id: "${seg}", primary_obstruction_type: "LANE", requested_start_date: "2026-04-01", requested_end_date: "2026-04-11" }
              as: Applicant
              as_user_id: "${app}"
              captures: { permit: $.data.id }
            - call: "POST /permits/${permit}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${app}"
            - call: "POST /permits/${permit}/decision"
              payload: { outcome: "APPROVED" }
              as: PermitReviewer
              as_user_id: "reviewer-1"
              captures: { pv_appr: $.data.version }
            - call: "POST /permits/${permit}/traffic-control-plan"
              payload: { device_list: ["CONES"], requires_flaggers: false, setback_ft: 5 }
              as: Applicant
              as_user_id: "${app}"
              captures: { tcp: $.data.id }
            - call: "POST /traffic-control-plans/${tcp}/decision"
              payload: { outcome: "APPROVED" }
              as: PermitReviewer
              as_user_id: "reviewer-1"
            - call: "POST /permits/${permit}/bond"
              payload: { posted_cents: 80000, expected_permit_version: "${pv_appr}" }
              as: Applicant
              as_user_id: "${app}"
              captures: { bond: $.data.id }
            - call: "POST /permits/${permit}/issue"
              payload: {}
              as: PermitReviewer
              as_user_id: "reviewer-2"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /permits/${permit}/expire"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /permits/${permit}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${app}"
              captures: { err: $.data.error_id }
          assert:
            - "Permit.${permit}.status == EXPIRED"
            - "err == ERR_INVALID_PERMIT_STATE"

      - name: tcp_double_approve_idempotency
        claim_type: idempotency
        grounds: [state_machines.TrafficControlPlan.SUBMITTED_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Deciding an already-APPROVED TCP a second time returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["An approved permit with a TCP already APPROVED."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { company_name: "Acme", license_number: "L1", contact_email: "a@x.com" }
              as: PlatformAdmin
              captures: { app: $.data.id }
            - call: "POST /street-segments"
              payload: { block_label: "Main 100", zone_class: "COMMERCIAL", last_repaved_date: "2020-01-01", roadway_lane_count: 2 }
              as: PlatformAdmin
              captures: { seg: $.data.id }
            - call: "POST /permits"
              payload: { applicant_id: "${app}", street_segment_id: "${seg}", primary_obstruction_type: "LANE", requested_start_date: "2026-04-01", requested_end_date: "2026-04-11" }
              as: Applicant
              as_user_id: "${app}"
              captures: { permit: $.data.id }
            - call: "POST /permits/${permit}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${app}"
            - call: "POST /permits/${permit}/decision"
              payload: { outcome: "APPROVED" }
              as: PermitReviewer
              as_user_id: "reviewer-1"
            - call: "POST /permits/${permit}/traffic-control-plan"
              payload: { device_list: ["CONES"], requires_flaggers: false, setback_ft: 5 }
              as: Applicant
              as_user_id: "${app}"
              captures: { tcp: $.data.id }
            - call: "POST /traffic-control-plans/${tcp}/decision"
              payload: { outcome: "APPROVED" }
              as: PermitReviewer
              as_user_id: "reviewer-1"
          trigger:
            - call: "POST /traffic-control-plans/${tcp}/decision"
              payload: { outcome: "APPROVED" }
              as: PermitReviewer
              as_user_id: "reviewer-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: sign_off_from_active_returns_invalid_closure_state
        claim_type: invalid_transition
        grounds: [state_machines.LaneClosure.RESTORATION_PENDING_to_RESTORED, "errors[ERR_INVALID_CLOSURE_STATE]"]
        distinguishing_aspect: "Signing off a closure still ACTIVE (not RESTORATION_PENDING) returns ERR_INVALID_CLOSURE_STATE."
        test_recipe:
          setup: ["Issued permit with a closure ACTIVE (restoration not yet requested)."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { company_name: "Acme", license_number: "L1", contact_email: "a@x.com" }
              as: PlatformAdmin
              captures: { app: $.data.id }
            - call: "POST /street-segments"
              payload: { block_label: "Main 100", zone_class: "COMMERCIAL", last_repaved_date: "2020-01-01", roadway_lane_count: 2 }
              as: PlatformAdmin
              captures: { seg: $.data.id }
            - call: "POST /permits"
              payload: { applicant_id: "${app}", street_segment_id: "${seg}", primary_obstruction_type: "LANE", requested_start_date: "2026-04-01", requested_end_date: "2026-04-11" }
              as: Applicant
              as_user_id: "${app}"
              captures: { permit: $.data.id }
            - call: "POST /permits/${permit}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${app}"
            - call: "POST /permits/${permit}/decision"
              payload: { outcome: "APPROVED" }
              as: PermitReviewer
              as_user_id: "reviewer-1"
              captures: { pv_appr: $.data.version }
            - call: "POST /permits/${permit}/traffic-control-plan"
              payload: { device_list: ["CONES"], requires_flaggers: false, setback_ft: 5 }
              as: Applicant
              as_user_id: "${app}"
              captures: { tcp: $.data.id }
            - call: "POST /traffic-control-plans/${tcp}/decision"
              payload: { outcome: "APPROVED" }
              as: PermitReviewer
              as_user_id: "reviewer-1"
            - call: "POST /permits/${permit}/bond"
              payload: { posted_cents: 80000, expected_permit_version: "${pv_appr}" }
              as: Applicant
              as_user_id: "${app}"
              captures: { bond: $.data.id }
            - call: "POST /permits/${permit}/issue"
              payload: {}
              as: PermitReviewer
              as_user_id: "reviewer-2"
            - call: "POST /permits/${permit}/lane-closures"
              payload: { street_segment_id: "${seg}", obstruction_type: "LANE", start_date: "2026-04-01", end_date: "2026-04-11" }
              as: Applicant
              as_user_id: "${app}"
              captures: { closure: $.data.id }
            - call: "POST /lane-closures/${closure}/activate"
              payload: {}
              as: Applicant
              as_user_id: "${app}"
          trigger:
            - call: "POST /lane-closures/${closure}/sign-off"
              payload: { result: "PASS", assessed_deficiency_cents: 0 }
              as: Inspector
              as_user_id: "inspector-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_CLOSURE_STATE"

  # ===================================================================
  # Calculations
  # ===================================================================
  - section: calculations
    instances:
      - name: bond_required_floor_applied
        claim_type: constants_applied
        grounds: [calculations.bond_required, entities.RestorationBond.fields.required_cents]
        distinguishing_aspect: "For a small RESIDENTIAL LANE permit (est occ 9000), required_cents is the 50000 floor, not 2*9000."
        test_recipe:
          setup: ["An approved RESIDENTIAL LANE permit requested 2026-04-01..2026-04-05."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { company_name: "Acme", license_number: "L1", contact_email: "a@x.com" }
              as: PlatformAdmin
              captures: { app: $.data.id }
            - call: "POST /street-segments"
              payload: { block_label: "Elm 4", zone_class: "RESIDENTIAL", last_repaved_date: "2020-01-01", roadway_lane_count: 2 }
              as: PlatformAdmin
              captures: { seg: $.data.id }
            - call: "POST /permits"
              payload: { applicant_id: "${app}", street_segment_id: "${seg}", primary_obstruction_type: "LANE", requested_start_date: "2026-04-01", requested_end_date: "2026-04-05" }
              as: Applicant
              as_user_id: "${app}"
              captures: { permit: $.data.id }
            - call: "POST /permits/${permit}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${app}"
            - call: "POST /permits/${permit}/decision"
              payload: { outcome: "APPROVED" }
              as: PermitReviewer
              as_user_id: "reviewer-1"
              captures: { pv_appr: $.data.version }
          trigger:
            - call: "POST /permits/${permit}/bond"
              payload: { posted_cents: 50000, expected_permit_version: "${pv_appr}" }
              as: Applicant
              as_user_id: "${app}"
              captures: { bond: $.data.id }
          assert:
            - "RestorationBond.${bond}.required_cents == 50000"

      - name: penalty_first_offense_value
        claim_type: correct_result
        grounds: [calculations.penalty_assessment, entities.ViolationNotice.fields.penalty_cents]
        distinguishing_aspect: "The first violation on an issued permit has penalty_cents 15000 (base, zero prior notices)."
        test_recipe:
          setup: ["An issued COMMERCIAL LANE permit with no prior violations."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { company_name: "Acme", license_number: "L1", contact_email: "a@x.com" }
              as: PlatformAdmin
              captures: { app: $.data.id }
            - call: "POST /street-segments"
              payload: { block_label: "Main 100", zone_class: "COMMERCIAL", last_repaved_date: "2020-01-01", roadway_lane_count: 2 }
              as: PlatformAdmin
              captures: { seg: $.data.id }
            - call: "POST /permits"
              payload: { applicant_id: "${app}", street_segment_id: "${seg}", primary_obstruction_type: "LANE", requested_start_date: "2026-04-01", requested_end_date: "2026-04-11" }
              as: Applicant
              as_user_id: "${app}"
              captures: { permit: $.data.id }
            - call: "POST /permits/${permit}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${app}"
            - call: "POST /permits/${permit}/decision"
              payload: { outcome: "APPROVED" }
              as: PermitReviewer
              as_user_id: "reviewer-1"
              captures: { pv_appr: $.data.version }
            - call: "POST /permits/${permit}/traffic-control-plan"
              payload: { device_list: ["CONES"], requires_flaggers: false, setback_ft: 5 }
              as: Applicant
              as_user_id: "${app}"
              captures: { tcp: $.data.id }
            - call: "POST /traffic-control-plans/${tcp}/decision"
              payload: { outcome: "APPROVED" }
              as: PermitReviewer
              as_user_id: "reviewer-1"
            - call: "POST /permits/${permit}/bond"
              payload: { posted_cents: 80000, expected_permit_version: "${pv_appr}" }
              as: Applicant
              as_user_id: "${app}"
              captures: { bond: $.data.id }
            - call: "POST /permits/${permit}/issue"
              payload: {}
              as: PermitReviewer
              as_user_id: "reviewer-2"
          trigger:
            - call: "POST /permits/${permit}/violations"
              payload: { violation_type: "TCP_VIOLATION" }
              as: EnforcementOfficer
              as_user_id: "officer-1"
              captures: { notice: $.data.id }
          assert:
            - "ViolationNotice.${notice}.penalty_cents == 15000"

  # ===================================================================
  # Validations
  # ===================================================================
  - section: validations
    instances:
      - name: invalid_date_range_violation_to_error
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_INVALID_DATE_RANGE]"]
        distinguishing_aspect: "POST /permits with requested_end_date <= requested_start_date returns ERR_INVALID_DATE_RANGE."
        test_recipe:
          setup: ["An applicant and a segment exist."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { company_name: "Acme", license_number: "L1", contact_email: "a@x.com" }
              as: PlatformAdmin
              captures: { app: $.data.id }
            - call: "POST /street-segments"
              payload: { block_label: "Main 100", zone_class: "COMMERCIAL", last_repaved_date: "2020-01-01", roadway_lane_count: 2 }
              as: PlatformAdmin
              captures: { seg: $.data.id }
          trigger:
            - call: "POST /permits"
              payload: { applicant_id: "${app}", street_segment_id: "${seg}", primary_obstruction_type: "LANE", requested_start_date: "2026-04-10", requested_end_date: "2026-04-01" }
              as: Applicant
              as_user_id: "${app}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_DATE_RANGE"

      - name: flaggers_required_violation_to_error
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_FLAGGERS_REQUIRED]", entities.TrafficControlPlan.fields.flagger_count]
        distinguishing_aspect: "Approving a TCP with requires_flaggers=true and flagger_count 0 returns ERR_FLAGGERS_REQUIRED."
        test_recipe:
          setup: ["An approved permit with a TCP requiring flaggers but flagger_count 0."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { company_name: "Acme", license_number: "L1", contact_email: "a@x.com" }
              as: PlatformAdmin
              captures: { app: $.data.id }
            - call: "POST /street-segments"
              payload: { block_label: "Main 100", zone_class: "COMMERCIAL", last_repaved_date: "2020-01-01", roadway_lane_count: 2 }
              as: PlatformAdmin
              captures: { seg: $.data.id }
            - call: "POST /permits"
              payload: { applicant_id: "${app}", street_segment_id: "${seg}", primary_obstruction_type: "LANE", requested_start_date: "2026-04-01", requested_end_date: "2026-04-11" }
              as: Applicant
              as_user_id: "${app}"
              captures: { permit: $.data.id }
            - call: "POST /permits/${permit}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${app}"
            - call: "POST /permits/${permit}/decision"
              payload: { outcome: "APPROVED" }
              as: PermitReviewer
              as_user_id: "reviewer-1"
            - call: "POST /permits/${permit}/traffic-control-plan"
              payload: { device_list: ["CONES"], requires_flaggers: true, flagger_count: 0, setback_ft: 5 }
              as: Applicant
              as_user_id: "${app}"
              captures: { tcp: $.data.id }
          trigger:
            - call: "POST /traffic-control-plans/${tcp}/decision"
              payload: { outcome: "APPROVED" }
              as: PermitReviewer
              as_user_id: "reviewer-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FLAGGERS_REQUIRED"

      - name: bond_insufficient_violation_to_error
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_BOND_INSUFFICIENT]", calculations.bond_required]
        distinguishing_aspect: "Posting a bond (40000) below required_cents (80000) returns ERR_BOND_INSUFFICIENT."
        test_recipe:
          setup: ["An approved COMMERCIAL LANE permit (est occ 40000, required 80000)."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { company_name: "Acme", license_number: "L1", contact_email: "a@x.com" }
              as: PlatformAdmin
              captures: { app: $.data.id }
            - call: "POST /street-segments"
              payload: { block_label: "Main 100", zone_class: "COMMERCIAL", last_repaved_date: "2020-01-01", roadway_lane_count: 2 }
              as: PlatformAdmin
              captures: { seg: $.data.id }
            - call: "POST /permits"
              payload: { applicant_id: "${app}", street_segment_id: "${seg}", primary_obstruction_type: "LANE", requested_start_date: "2026-04-01", requested_end_date: "2026-04-11" }
              as: Applicant
              as_user_id: "${app}"
              captures: { permit: $.data.id }
            - call: "POST /permits/${permit}/submit"
              payload: {}
              as: Applicant
