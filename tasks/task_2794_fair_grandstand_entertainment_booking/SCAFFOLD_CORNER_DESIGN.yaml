              as: TalentBuyer
              captures: { ar_ab: "$.data.id" }
            - call: "POST /grandstand/offers"
              payload: { fair_edition_id: "${ed_ab}", artist_id: "${ar_ab}", target_stage_id: "${st_ab}", deal_type: "VERSUS", offered_guarantee_cents: 12500000, backend_split_pct: 0.85, backend_breakeven_cents: 6000000, target_show_date: "2026-08-22", load_in_start_utc: "2026-08-22T14:00:00.000Z", load_out_end_utc: "2026-08-22T23:00:00.000Z", response_window_hours: 48 }
              as: TalentBuyer
              captures: { of_ab: "$.data.id" }
            - call: "POST /grandstand/offers/${of_ab}/send"
              payload: {}
              as: TalentBuyer
            - call: "POST /grandstand/offers/${of_ab}/accept"
              payload: {}
              as: TalentAgent
              as_user_id: "agent-hollis"
            - call: "GET /grandstand/show-bookings"
              payload: { offer_id: "${of_ab}" }
              as: TalentBuyer
              captures: { bk_ab: "$.data[0].id" }
            - call: "GET /grandstand/production-advances"
              payload: { booking_id: "${bk_ab}" }
              as: ProductionManager
              captures: { ad_ab: "$.data[0].id" }
            - call: "POST /grandstand/production-advances/${ad_ab}/rider-items"
              payload: { category: "LIGHTING", description: "House wash only", requested_cost_cents: 0, is_critical: false, artist_recoupable: false }
              as: ProductionManager
              captures: { ri_abb: "$.data.id" }
            - call: "GET /grandstand/production-advances/${ad_ab}/rider-items"
              payload: { category: "STAGING" }
              as: ProductionManager
              captures: { ri_aba: "$.data[0].id" }
            - call: "POST /grandstand/rider-items/${ri_aba}/rule"
              payload: { decision: "APPROVED" }
              as: ProductionManager
            - call: "POST /grandstand/rider-items/${ri_abb}/rule"
              payload: { decision: "APPROVED" }
              as: ProductionManager
            - call: "POST /grandstand/production-advances/${ad_ab}/complete"
              payload: {}
              as: ProductionManager
            - call: "GET /grandstand/show-bookings/${bk_ab}"
              payload: {}
