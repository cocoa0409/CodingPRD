scaffold_difficulty_design:
  # ------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: dscr_ttm_vs_t3_quarterly_divergence
        grounds:
          - calculations.dscr_calculation
          - entities.Loan.fields.dscr_basis
          - state_machines.FinancialStatement.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          Two loans carrying identical quarterly NOI series but different
          Loan.dscr_basis produce different DSCR values from the same data
          (TTM trailing-sum 1.1833 vs T3_ANNUALIZED latest-quarter-x4 1.3333),
          and the outcomes diverge: the TTM loan breaches (OPEN, WATCHLIST)
          while the T3 loan conforms (CONFORMING, PERFORMING). Loan-domain
          financial ratio variant.
        test_recipe:
          setup:
            - "Loan A: dscr_basis TTM; Loan B: dscr_basis T3_ANNUALIZED; both principal 1000000000, note_rate 0.06 (annual debt service 60000000), dscr threshold 1.25, ltv threshold 0.90, origination 2025-04-01, maturity 2028-06-30"
            - "Both loans accepted the same four quarterly operating statements (Q2'25-Q1'26) with NOI cents 17000000, 17000000, 17000000, 20000000; clock left at default 2026-08-01T00:00:00Z so no sweep runs"
            - "TTM not computable until the 4th accept; T3 opens breaches on quarters 1-3 (1.1333 < 1.25) then conforms on quarter 4, auto-curing them"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Divergence Holdings", tax_id: "TX-DIV-1", contact_email: "div@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-TTM", original_principal_cents: 1000000000, note_rate: 0.06, origination_date: "2025-04-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.25, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { la_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-T3", original_principal_cents: 1000000000, note_rate: 0.06, origination_date: "2025-04-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.25, ltv_covenant_threshold: 0.90, dscr_basis: "T3_ANNUALIZED", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { lb_id: $.data.id } }
            - { call: "POST /loans/${la_id}/financial-statements", payload: { statement_type: "OPERATING_STATEMENT", period_start: "2025-04-01T00:00:00Z", period_end: "2025-06-30T00:00:00Z", net_operating_income_cents: 17000000 }, as: Borrower, as_user_id: "${b_id}", captures: { sa1: $.data.id } }
            - { call: "POST /financial-statements/${sa1}/review", payload: { decision: "ACCEPT" }, as: MasterServicer }
            - { call: "POST /loans/${la_id}/financial-statements", payload: { statement_type: "OPERATING_STATEMENT", period_start: "2025-07-01T00:00:00Z", period_end: "2025-09-30T00:00:00Z", net_operating_income_cents: 17000000 }, as: Borrower, as_user_id: "${b_id}", captures: { sa2: $.data.id } }
            - { call: "POST /financial-statements/${sa2}/review", payload: { decision: "ACCEPT" }, as: MasterServicer }
            - { call: "POST /loans/${la_id}/financial-statements", payload: { statement_type: "OPERATING_STATEMENT", period_start: "2025-10-01T00:00:00Z", period_end: "2025-12-31T00:00:00Z", net_operating_income_cents: 17000000 }, as: Borrower, as_user_id: "${b_id}", captures: { sa3: $.data.id } }
            - { call: "POST /financial-statements/${sa3}/review", payload: { decision: "ACCEPT" }, as: MasterServicer }
            - { call: "POST /loans/${lb_id}/financial-statements", payload: { statement_type: "OPERATING_STATEMENT", period_start: "2025-04-01T00:00:00Z", period_end: "2025-06-30T00:00:00Z", net_operating_income_cents: 17000000 }, as: Borrower, as_user_id: "${b_id}", captures: { sb1: $.data.id } }
            - { call: "POST /financial-statements/${sb1}/review", payload: { decision: "ACCEPT" }, as: MasterServicer }
            - { call: "POST /loans/${lb_id}/financial-statements", payload: { statement_type: "OPERATING_STATEMENT", period_start: "2025-07-01T00:00:00Z", period_end: "2025-09-30T00:00:00Z", net_operating_income_cents: 17000000 }, as: Borrower, as_user_id: "${b_id}", captures: { sb2: $.data.id } }
            - { call: "POST /financial-statements/${sb2}/review", payload: { decision: "ACCEPT" }, as: MasterServicer }
            - { call: "POST /loans/${lb_id}/financial-statements", payload: { statement_type: "OPERATING_STATEMENT", period_start: "2025-10-01T00:00:00Z", period_end: "2025-12-31T00:00:00Z", net_operating_income_cents: 17000000 }, as: Borrower, as_user_id: "${b_id}", captures: { sb3: $.data.id } }
            - { call: "POST /financial-statements/${sb3}/review", payload: { decision: "ACCEPT" }, as: MasterServicer }
          trigger:
            - { call: "POST /loans/${la_id}/financial-statements", payload: { statement_type: "OPERATING_STATEMENT", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", net_operating_income_cents: 20000000 }, as: Borrower, as_user_id: "${b_id}", captures: { sa4: $.data.id } }
            - { call: "POST /financial-statements/${sa4}/review", payload: { decision: "ACCEPT" }, as: MasterServicer }
            - { call: "POST /loans/${lb_id}/financial-statements", payload: { statement_type: "OPERATING_STATEMENT", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", net_operating_income_cents: 20000000 }, as: Borrower, as_user_id: "${b_id}", captures: { sb4: $.data.id } }
            - { call: "POST /financial-statements/${sb4}/review", payload: { decision: "ACCEPT" }, as: MasterServicer }
            - { call: "GET /loans/${la_id}/covenant-assessments", as: MasterServicer, captures: { a_val: "$.data[0].computed_value" } }
            - { call: "GET /loans/${lb_id}/covenant-assessments", as: MasterServicer, captures: { b_val: "$.data[0].computed_value" } }
            - { call: "GET /loans/${la_id}", as: MasterServicer, captures: { a_posture: $.data.servicing_status } }
            - { call: "GET /loans/${lb_id}", as: MasterServicer, captures: { b_posture: $.data.servicing_status } }
          assert:
            - "Loan A (TTM) newest assessment computed_value == 1.1833 and breach == true and status == OPEN"
            - "Loan B (T3_ANNUALIZED) newest assessment computed_value == 1.3333 and breach == false and status == CONFORMING"
            - "Loan B has exactly 3 CURED assessments plus 1 CONFORMING (auto-cure on conforming reassessment)"
            - "Loan A has exactly 1 assessment (TTM uncomputable for quarters 1-3)"
            - "GET /loans/${la_id} servicing_status == WATCHLIST; GET /loans/${lb_id} servicing_status == PERFORMING"
            - "1.1833 != 1.3333 — identical NOI series, basis variant decides breach vs conform"

      - name: assumption_fee_outstanding_vs_original_divergence
        grounds:
          - calculations.assumption_fee_calculation
          - entities.Loan.fields.assumption_fee_basis
          - state_machines.AssumptionRequest.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Two loans with identical principal/balance but different
          assumption_fee_basis produce different fees at approval
          (OUTSTANDING: 1% of 800000000 = 8000000 vs ORIGINAL: 0.5% of
          1000000000 + 25000 = 5025000). AssumptionRequest-domain fee variant,
          a different entity domain from dscr_ttm_vs_t3_quarterly_divergence.
        test_recipe:
          setup:
            - "Loans C (OUTSTANDING) and D (ORIGINAL): principal 1000000000, current_balance 800000000, thresholds 1.0/0.90, maturity 2028-01-31; each with one property appraised 2000000000 on 2026-06-01"
            - "Each property has a COMPLETED GOOD inspection at clock default 2026-08-01 (within 12 months); no statements, no breaches, payment CURRENT, no leases (estoppel gate vacuous)"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Fee Divergence LP", tax_id: "TX-FEE-1", contact_email: "fee@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-OUT", original_principal_cents: 1000000000, current_balance_cents: 800000000, note_rate: 0.06, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-01-31T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { lc_id: $.data.id, lc_v: $.data.version } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-ORG", original_principal_cents: 1000000000, current_balance_cents: 800000000, note_rate: 0.06, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-01-31T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "ORIGINAL" }, as: MasterServicer, captures: { ld_id: $.data.id, ld_v: $.data.version } }
            - { call: "POST /loans/${lc_id}/properties", payload: { address: "1 Fee St", property_type: "OFFICE", appraised_value_cents: 2000000000, appraisal_date: "2026-06-01T00:00:00Z" }, as: MasterServicer, captures: { pc_id: $.data.id } }
            - { call: "POST /loans/${ld_id}/properties", payload: { address: "2 Fee St", property_type: "OFFICE", appraised_value_cents: 2000000000, appraisal_date: "2026-06-01T00:00:00Z" }, as: MasterServicer, captures: { pd_id: $.data.id } }
            - { call: "POST /inspectors", payload: { full_name: "Ingrid Specter", license_no: "LIC-001" }, as: MasterServicer, captures: { i_id: $.data.id } }
            - { call: "POST /properties/${pc_id}/inspections", payload: { inspector_id: "${i_id}", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T11:00:00Z" }, as: MasterServicer, captures: { ic_id: $.data.id } }
            - { call: "POST /properties/${pd_id}/inspections", payload: { inspector_id: "${i_id}", scheduled_start: "2026-08-01T11:00:00Z", scheduled_end: "2026-08-01T12:00:00Z" }, as: MasterServicer, captures: { id2: $.data.id } }
            - { call: "POST /inspections/${ic_id}/close", payload: { outcome: "COMPLETED", condition_rating: "GOOD" }, as: Inspector, as_user_id: "${i_id}" }
            - { call: "POST /inspections/${id2}/close", payload: { outcome: "COMPLETED", condition_rating: "GOOD" }, as: Inspector, as_user_id: "${i_id}" }
          trigger:
            - { call: "POST /loans/${lc_id}/assumption-requests", payload: { proposed_assumptor_name: "Acquirer One", proposed_assumptor_tax_id: "TX-AQ-1", proposed_net_worth_cents: 5000000000, expected_loan_version: "${lc_v}" }, as: Borrower, as_user_id: "${b_id}", captures: { arc_id: $.data.id } }
            - { call: "POST /assumption-requests/${arc_id}/start-review", as: MasterServicer, payload: {} }
            - { call: "POST /assumption-requests/${arc_id}/decide", payload: { decision: "APPROVE" }, as: MasterServicer, captures: { fee_c: $.data.fee_cents } }
            - { call: "POST /loans/${ld_id}/assumption-requests", payload: { proposed_assumptor_name: "Acquirer Two", proposed_assumptor_tax_id: "TX-AQ-2", proposed_net_worth_cents: 5000000000, expected_loan_version: "${ld_v}" }, as: Borrower, as_user_id: "${b_id}", captures: { ard_id: $.data.id } }
            - { call: "POST /assumption-requests/${ard_id}/start-review", as: MasterServicer, payload: {} }
            - { call: "POST /assumption-requests/${ard_id}/decide", payload: { decision: "APPROVE" }, as: MasterServicer, captures: { fee_d: $.data.fee_cents } }
          assert:
            - "AssumptionRequest on loan C fee_cents == 8000000 (1% of current UPB 800000000, within clamp)"
            - "AssumptionRequest on loan D fee_cents == 5025000 (0.5% of original 1000000000 + 25000 flat)"
            - "fee_c != fee_d — identical balances, fee-basis variant decides the number"
            - "both requests status == APPROVED with approval_expires_at == decided_at + 60 days"

  # ------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: watchlist_risk_score_tiered_with_synergy
        grounds:
          - calculations.watchlist_risk_score
          - state_machines.WatchlistEntry
          - calculations.collection_cadence
        distinguishing_aspect: |
          Mode (a) combinatorial: five inputs (DSCR band, delinquency-days band,
          inspection rating, LTV band, synergy condition) with tiered band
          selection, a conditional +10 synergy branch (days_delinquent >= 30 AND
          current_dscr < 1.00), and a min(100,...) clamp; the exact tiered sum
          45+20+5+10+10 == 90 must be produced and must create exactly one
          RISK_SCORE entry with escalation_review == true (>= 85).
        test_recipe:
          setup:
            - "Loan E: T3 basis, principal 1000000000, balance 700000000, rate 0.06, dscr threshold 1.20, ltv threshold 0.90, origination 2026-04-01, maturity 2028-06-30; property appraised 1000000000 on 2026-06-01 then re-appraised same value to force LTV computation (0.7000 -> band 10)"
            - "Accepted Q2'26 rent roll (occupancy 92.5) and operating statement NOI 14250000 -> DSCR 0.9500 -> OPEN breach (WATCHLIST); score at that moment 45+0+5+10+0=60 < 70, no entry"
            - "Loan marked DELINQUENT at 2026-08-01 (days 0 -> synergy off; score 60, still no entry); clock then advanced to 2026-08-31 -> days_delinquent 30 -> sweep re-eval scores 45+20+5+10+10=90 >= 70 -> entry created"
            - "A FAIR inspection completed afterwards keeps inspection component at 5 -> score unchanged 90, no duplicate entry"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Risk Holdings", tax_id: "TX-RSK-1", contact_email: "risk@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-RSK", original_principal_cents: 1000000000, current_balance_cents: 700000000, note_rate: 0.06, origination_date: "2026-04-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.20, ltv_covenant_threshold: 0.90, dscr_basis: "T3_ANNUALIZED", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { le_id: $.data.id } }
            - { call: "POST /loans/${le_id}/properties", payload: { address: "9 Risk Ave", property_type: "RETAIL", appraised_value_cents: 1000000000, appraisal_date: "2026-06-01T00:00:00Z" }, as: MasterServicer, captures: { pe_id: $.data.id } }
            - { call: "POST /properties/${pe_id}/appraise", payload: { appraised_value_cents: 1000000000, appraisal_date: "2026-06-01T00:00:00Z" }, as: MasterServicer }
            - { call: "POST /loans/${le_id}/financial-statements", payload: { statement_type: "RENT_ROLL", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", occupancy_pct: 92.5 }, as: Borrower, as_user_id: "${b_id}", captures: { rr_id: $.data.id } }
            - { call: "POST /financial-statements/${rr_id}/review", payload: { decision: "ACCEPT" }, as: MasterServicer }
            - { call: "POST /loans/${le_id}/financial-statements", payload: { statement_type: "OPERATING_STATEMENT", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", net_operating_income_cents: 14250000 }, as: Borrower, as_user_id: "${b_id}", captures: { os_id: $.data.id } }
            - { call: "POST /financial-statements/${os_id}/review", payload: { decision: "ACCEPT" }, as: MasterServicer }
            - { call: "POST /loans/${le_id}/payment-status", payload: { to_status: "DELINQUENT" }, as: MasterServicer }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: MasterServicer }
            - { call: "POST /inspectors", payload: { full_name: "Rita Spector", license_no: "LIC-RSK" }, as: MasterServicer, captures: { i_id: $.data.id } }
            - { call: "POST /properties/${pe_id}/inspections", payload: { inspector_id: "${i_id}", scheduled_start: "2026-08-31T09:00:00Z", scheduled_end: "2026-08-31T10:00:00Z" }, as: MasterServicer, captures: { ins_id: $.data.id } }
            - { call: "POST /inspections/${ins_id}/close", payload: { outcome: "COMPLETED", condition_rating: "FAIR" }, as: Inspector, as_user_id: "${i_id}" }
            - { call: "GET /loans/${le_id}/watchlist-entries?criterion=RISK_SCORE", as: MasterServicer, captures: { rsk_score: "$.data[0].risk_score_at_creation" } }
          assert:
            - "exactly one WatchlistEntry with criterion == RISK_SCORE and status == ACTIVE (total_count == 1; no duplicate on later re-eval)"
            - "WatchlistEntry.risk_score_at_creation == 90 (45 DSCR<1.00 + 20 days[30,59] + 5 FAIR + 10 LTV[0.65,0.75) + 10 synergy)"
            - "WatchlistEntry.escalation_review == true (90 >= 85)"
            - "GET /loans/${le_id}: days_delinquent == 30, payment_status == DELINQUENT, servicing_status == WATCHLIST, current_dscr == 0.9500, current_ltv == 0.7000"

      - name: disbursement_retainage_per_line_rounding
        grounds:
          - calculations.disbursement_waterfall
          - state_machines.DisbursementRequest.APPROVED_to_FUNDED
        distinguishing_aspect: |
          Mode (b) combinatorial: nested rounding where order matters — three
          lines of 3333 cents at 10% retainage round per line then sum
          (retain 333 each -> retained 999, funded 9000); sum-then-round would
          give retained 1000 / funded 8999. The scaffold pins per-line-first.
        test_recipe:
          setup:
            - "Loan F clean (thresholds 1.0/0.90, no statements); TI_LC reserve target 0, deposit 10000000 (reserve version becomes 2)"
            - "Draw request: three line items of 3333 cents each, retainage_pct 0.10, approved (held 9999)"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Waterfall Co", tax_id: "TX-WF-1", contact_email: "wf@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-WF", original_principal_cents: 1000000000, note_rate: 0.06, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { lf_id: $.data.id } }
            - { call: "POST /loans/${lf_id}/reserve-accounts", payload: { account_type: "TI_LC", target_balance_cents: 0 }, as: MasterServicer, captures: { rf_id: $.data.id } }
            - { call: "POST /reserve-accounts/${rf_id}/deposits", payload: { amount_cents: 10000000 }, as: Borrower, as_user_id: "${b_id}", captures: { rf_v: $.data.version } }
            - { call: "POST /reserve-accounts/${rf_id}/disbursement-requests", payload: { purpose: "CAPITAL_REPAIR", line_items: [ { description: "roof membrane", amount_cents: 3333 }, { description: "deck repair", amount_cents: 3333 }, { description: "drainage", amount_cents: 3333 } ], retainage_pct: 0.10, expected_reserve_account_version: "${rf_v}" }, as: Borrower, as_user_id: "${b_id}", captures: { dr_id: $.data.id } }
            - { call: "POST /disbursement-requests/${dr_id}/review", payload: { decision: "APPROVE" }, as: MasterServicer }
          trigger:
            - { call: "POST /disbursement-requests/${dr_id}/fund", as: MasterServicer, payload: {}, captures: { funded: $.data.funded_cents, retained: $.data.retained_cents } }
            - { call: "GET /reserve-accounts/${rf_id}", as: MasterServicer, captures: { bal: $.data.balance_cents, held: $.data.held_cents } }
          assert:
            - "DisbursementRequest.funded_cents == 9000 (3 x (3333 - round_half_up(333.3)=333))"
            - "DisbursementRequest.retained_cents == 999 (sum-then-round would produce 1000 — pinned order decides)"
            - "ReserveAccount.balance_cents == 9991000 and held_cents == 0 and retained_cents == 999"
            - "DisbursementRequest.status == FUNDED with funded_at set"

      - name: force_place_premium_evaluation_order
        grounds:
          - calculations.protective_advance_capitalization
          - calculations.ltv_calculation
          - state_machines.InsurancePolicy
        distinguishing_aspect: |
          Mode (c) combinatorial: circular-looking dependency (premium depends
          on balance, balance depends on premium) with pinned single-pass
          evaluation order — premium is computed on the PRE-advance balance
          (2% x 500000000 = 10000000), capitalized once, LTV recomputed once
          (510000000/800000000 = 0.6375); an iterating implementation yields
          10204081+ and fails.
        test_recipe:
          setup:
            - "Loan G: principal == balance 500000000, rate 0.05, ltv threshold 0.75, dscr threshold 1.0; property appraised 800000000 on 2026-05-01; no ACTIVE PROPERTY policy"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Advance Corp", tax_id: "TX-ADV-1", contact_email: "adv@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-ADV", original_principal_cents: 500000000, note_rate: 0.05, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.75, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { lg_id: $.data.id } }
            - { call: "POST /loans/${lg_id}/properties", payload: { address: "5 Advance Blvd", property_type: "INDUSTRIAL", appraised_value_cents: 800000000, appraisal_date: "2026-05-01T00:00:00Z" }, as: MasterServicer, captures: { pg_id: $.data.id } }
          trigger:
            - { call: "POST /properties/${pg_id}/force-place-insurance", payload: { coverage_type: "PROPERTY" }, as: SpecialServicer, captures: { fp_id: $.data.id, fp_prem: $.data.premium_advance_cents } }
            - { call: "GET /loans/${lg_id}", as: MasterServicer, captures: { g_bal: $.data.current_balance_cents, g_ltv: $.data.current_ltv } }
          assert:
            - "InsurancePolicy.force_placed == true and premium_advance_cents == 10000000 (single pass on pre-advance balance)"
            - "InsurancePolicy.coverage_amount_cents == 500000000 (pre-advance balance), start 2026-08-01, end 2027-08-01"
            - "Loan.current_balance_cents == 510000000 and capitalized_advances_cents == 10000000"
            - "Loan.current_ltv == 0.6375 and an LTV CovenantAssessment with computed_value 0.6375, breach == false, status CONFORMING exists"

  # ------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: loan_parallel_dimensions_move_independently
        grounds:
          - state_machines.Loan.CURRENT_to_DELINQUENT
          - state_machines.Loan.PERFORMING_to_WATCHLIST
          - state_machines.CovenantAssessment.OPEN_to_WAIVED
        distinguishing_aspect: |
          Loan carries two independent state dimensions: payment_status
          (CURRENT->DELINQUENT->CURRENT cycle) moves without touching
          servicing_status, and servicing_status (PERFORMING->WATCHLIST->
          PERFORMING via waive) moves independently afterwards — a parallel
          state-machine shape on the Loan entity.
        test_recipe:
          setup:
            - "Loan H: T3 basis, dscr threshold 1.20, principal 1000000000 rate 0.06; accepted Q2'26 operating statement NOI 15000000 -> DSCR 1.0000 < 1.20 -> OPEN breach -> servicing WATCHLIST (statement reviewed by ms_user_1)"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Parallel LLC", tax_id: "TX-PAR-1", contact_email: "par@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-PAR", original_principal_cents: 1000000000, note_rate: 0.06, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.20, ltv_covenant_threshold: 0.90, dscr_basis: "T3_ANNUALIZED", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { lh_id: $.data.id } }
            - { call: "POST /loans/${lh_id}/financial-statements", payload: { statement_type: "OPERATING_STATEMENT", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", net_operating_income_cents: 15000000 }, as: Borrower, as_user_id: "${b_id}", captures: { osh_id: $.data.id } }
            - { call: "POST /financial-statements/${osh_id}/review", payload: { decision: "ACCEPT" }, as: MasterServicer, as_user_id: "ms_user_1" }
            - { call: "GET /loans/${lh_id}/covenant-assessments", as: MasterServicer, captures: { ash_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /loans/${lh_id}/payment-status", payload: { to_status: "DELINQUENT" }, as: MasterServicer, captures: { h_pay1: $.data.payment_status, h_srv1: $.data.servicing_status } }
            - { call: "POST /loans/${lh_id}/payment-status", payload: { to_status: "CURRENT" }, as: MasterServicer, captures: { h_pay2: $.data.payment_status, h_srv2: $.data.servicing_status } }
            - { call: "POST /covenant-assessments/${ash_id}/waive", payload: { waiver_reason: "one-time leasing dip" }, as: SpecialServicer, as_user_id: "ss_user_1" }
            - { call: "GET /loans/${lh_id}", as: MasterServicer, captures: { h_pay3: $.data.payment_status, h_srv3: $.data.servicing_status } }
          assert:
            - "after mark-delinquent: payment_status == DELINQUENT while servicing_status == WATCHLIST (dimensions independent)"
            - "after cure: payment_status == CURRENT while servicing_status still == WATCHLIST (open assessment holds posture)"
            - "after waiver by a different user: assessment status == WAIVED and servicing_status == PERFORMING (bubble-up re-eval)"
            - "waiver by SpecialServicer ss_user_1 accepted because reviewer was ms_user_1 (SoD satisfied)"

      - name: lease_reject_revise_resubmit_cycle
        grounds:
          - state_machines.Lease.REJECTED_to_DRAFT
          - state_machines.Lease.SUBMITTED_to_CONDITIONALLY_APPROVED
          - entities.Lease.fields.lender_approval_required
        distinguishing_aspect: |
          Lease runs a revision cycle DRAFT->SUBMITTED->REJECTED->DRAFT->
          SUBMITTED->CONDITIONALLY_APPROVED->APPROVED on one row — a cyclic
          state machine on the Lease entity, a different entity from the Loan
          parallel-dimension instance.
        test_recipe:
          setup:
            - "Loan I clean; one property; small lease (rent 400000 <= 500000 threshold, sqft 3000, term 36) so lender_approval_required == false and no estoppel gate applies"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Cycle Tenant Prop", tax_id: "TX-CYC-1", contact_email: "cyc@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-CYC", original_principal_cents: 1000000000, note_rate: 0.06, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { li_id: $.data.id } }
            - { call: "POST /loans/${li_id}/properties", payload: { address: "3 Cycle Way", property_type: "OFFICE", appraised_value_cents: 2000000000, appraisal_date: "2026-06-01T00:00:00Z" }, as: MasterServicer, captures: { pi_id: $.data.id } }
            - { call: "POST /properties/${pi_id}/leases", payload: { tenant_name: "Tenant A", suite_ref: "STE-100", commencement_date: "2026-09-01T00:00:00Z", expiry_date: "2029-08-31T00:00:00Z", base_rent_cents_monthly: 400000, sqft: 3000, term_months: 36 }, as: Borrower, as_user_id: "${b_id}", captures: { lease_id: $.data.id } }
            - { call: "POST /leases/${lease_id}/submit", as: Borrower, as_user_id: "${b_id}", payload: {} }
            - { call: "POST /leases/${lease_id}/decide", payload: { decision: "REJECT" }, as: MasterServicer }
          trigger:
            - { call: "POST /leases/${lease_id}/revise", payload: { base_rent_cents_monthly: 410000 }, as: Borrower, as_user_id: "${b_id}", captures: { st_draft: $.data.status } }
            - { call: "POST /leases/${lease_id}/submit", as: Borrower, as_user_id: "${b_id}", payload: {} }
            - { call: "POST /leases/${lease_id}/decide", payload: { decision: "CONDITIONAL", conditions: "repaint suite before commencement" }, as: MasterServicer, captures: { st_cond: $.data.status } }
            - { call: "POST /leases/${lease_id}/decide", payload: { decision: "APPROVE" }, as: MasterServicer, captures: { st_final: $.data.status, rent_final: $.data.base_rent_cents_monthly } }
          assert:
            - "revise moved REJECTED -> DRAFT and applied edit: base_rent_cents_monthly == 410000, conditions cleared"
            - "second submit moved DRAFT -> SUBMITTED (cycle re-entry)"
            - "CONDITIONAL decision -> CONDITIONALLY_APPROVED with conditions recorded"
            - "final APPROVE from CONDITIONALLY_APPROVED -> APPROVED; lender_approval_required == false (410000 <= 500000 and 3000 <= 5000 and 36 <= 60)"

  # ------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: statement_breach_opens_assessment_watchlists_loan_elevates_reserves
        grounds:
          - state_machines.FinancialStatement.SUBMITTED_to_ACCEPTED
          - state_machines.Loan.PERFORMING_to_WATCHLIST
          - entities.ReserveAccount.fields.elevated_retainage
        distinguishing_aspect: |
          Depth-3 chain from a statement review trigger: ACCEPT -> (1) DSCR
          CovenantAssessment created OPEN -> (2) Loan.servicing_status
          PERFORMING->WATCHLIST -> (3) every ReserveAccount.elevated_retainage
          flips true; each link is caused by the previous link's mutation.
        test_recipe:
          setup:
            - "Loan J: T3 basis, dscr threshold 1.25, principal 1000000000 rate 0.06; REPLACEMENT reserve with deposit 100000 (version 2, elevated_retainage false)"
            - "Submitted Q2'26 operating statement NOI 10000000 (DSCR will be 0.6667 < 1.25)"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Cascade One", tax_id: "TX-CAS-1", contact_email: "cas@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-CAS", original_principal_cents: 1000000000, note_rate: 0.06, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.25, ltv_covenant_threshold: 0.90, dscr_basis: "T3_ANNUALIZED", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { lj_id: $.data.id } }
            - { call: "POST /loans/${lj_id}/reserve-accounts", payload: { account_type: "REPLACEMENT", target_balance_cents: 0 }, as: MasterServicer, captures: { rj_id: $.data.id } }
            - { call: "POST /reserve-accounts/${rj_id}/deposits", payload: { amount_cents: 100000 }, as: MasterServicer, captures: { rj_v_pre: $.data.version } }
            - { call: "POST /loans/${lj_id}/financial-statements", payload: { statement_type: "OPERATING_STATEMENT", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", net_operating_income_cents: 10000000 }, as: Borrower, as_user_id: "${b_id}", captures: { osj_id: $.data.id } }
          trigger:
            - { call: "POST /financial-statements/${osj_id}/review", payload: { decision: "ACCEPT" }, as: MasterServicer }
            - { call: "GET /loans/${lj_id}/covenant-assessments", as: MasterServicer, captures: { aj_status: "$.data[0].status", aj_val: "$.data[0].computed_value" } }
            - { call: "GET /loans/${lj_id}", as: MasterServicer, captures: { j_posture: $.data.servicing_status } }
            - { call: "GET /reserve-accounts/${rj_id}", as: MasterServicer, captures: { j_elev: $.data.elevated_retainage, j_rv: $.data.version } }
          assert:
            - "link 1: CovenantAssessment created with computed_value == 0.6667, breach == true, status == OPEN"
            - "link 2: Loan.servicing_status == WATCHLIST (caused by the OPEN assessment, not by the review directly)"
            - "link 3: ReserveAccount.elevated_retainage == true and reserve.version advanced from ${rj_v_pre} (cascade bumped it)"

      - name: inspection_poor_creates_entry_watchlists_loan
        grounds:
          - state_machines.PropertyInspection.SCHEDULED_to_COMPLETED
          - state_machines.WatchlistEntry
          - state_machines.Loan.PERFORMING_to_WATCHLIST
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (inspection completion, not
          statement review): close COMPLETED with POOR -> (1) WatchlistEntry
          ACTIVE (POOR_INSPECTION) created -> (2) Loan.servicing_status
          PERFORMING->WATCHLIST -> (bonus 3) reserves elevated.
        test_recipe:
          setup:
            - "Loan K clean (thresholds 1.0/0.90, property 2000000000); TI_LC reserve present (elevated false); inspector scheduled 2026-08-01 09:00-11:00"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Cascade Two", tax_id: "TX-CAS-2", contact_email: "cas2@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-CAS2", original_principal_cents: 1000000000, note_rate: 0.06, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { lk_id: $.data.id } }
            - { call: "POST /loans/${lk_id}/properties", payload: { address: "7 Cascade Rd", property_type: "HOTEL", appraised_value_cents: 2000000000, appraisal_date: "2026-06-01T00:00:00Z" }, as: MasterServicer, captures: { pk_id: $.data.id } }
            - { call: "POST /loans/${lk_id}/reserve-accounts", payload: { account_type: "TI_LC", target_balance_cents: 0 }, as: MasterServicer, captures: { rk_id: $.data.id } }
            - { call: "POST /inspectors", payload: { full_name: "Cascade Inspector", license_no: "LIC-CAS2" }, as: MasterServicer, captures: { i_id: $.data.id } }
            - { call: "POST /properties/${pk_id}/inspections", payload: { inspector_id: "${i_id}", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T11:00:00Z" }, as: MasterServicer, captures: { ink_id: $.data.id } }
          trigger:
            - { call: "POST /inspections/${ink_id}/close", payload: { outcome: "COMPLETED", condition_rating: "POOR" }, as: Inspector, as_user_id: "${i_id}" }
            - { call: "GET /loans/${lk_id}/watchlist-entries", as: MasterServicer, captures: { k_crit: "$.data[0].criterion" } }
            - { call: "GET /loans/${lk_id}", as: MasterServicer, captures: { k_posture: $.data.servicing_status } }
            - { call: "GET /reserve-accounts/${rk_id}", as: MasterServicer, captures: { k_elev: $.data.elevated_retainage } }
          assert:
            - "link 1: WatchlistEntry ACTIVE with criterion == POOR_INSPECTION and source_ref == inspection id"
            - "link 2: Loan.servicing_status == WATCHLIST (caused by the entry, not by the close directly)"
            - "link 3: ReserveAccount.elevated_retainage == true"

  # ------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: review_decision_state_beats_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=34]
          - state_machines.DisbursementRequest.SUBMITTED_to_REJECTED
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: a draw request already
          REJECTED (state failure) whose amount also exceeds available funds
          (fiscal failure) must surface ERR_INVALID_STATE, because priority 7
          state preconditions run before priority 34 fiscal checks.
        test_recipe:
          setup:
            - "Loan L clean; TI_LC reserve with deposit 1000000 (version 2)"
            - "Draw request amount 5000000 created (SUBMITTED) then reviewed REJECT — the fiscal check does not apply to REJECT, so the rejection succeeds despite insufficient funds; funds remain insufficient"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Priority One", tax_id: "TX-PR1", contact_email: "p1@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-PR1", original_principal_cents: 1000000000, note_rate: 0.06, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { ll_id: $.data.id } }
            - { call: "POST /loans/${ll_id}/reserve-accounts", payload: { account_type: "TI_LC", target_balance_cents: 0 }, as: MasterServicer, captures: { rl_id: $.data.id } }
            - { call: "POST /reserve-accounts/${rl_id}/deposits", payload: { amount_cents: 1000000 }, as: MasterServicer, captures: { rl_v: $.data.version } }
            - { call: "POST /reserve-accounts/${rl_id}/disbursement-requests", payload: { purpose: "TENANT_IMPROVEMENT", line_items: [ { description: "buildout", amount_cents: 5000000 } ], expected_reserve_account_version: "${rl_v}" }, as: Borrower, as_user_id: "${b_id}", captures: { drl_id: $.data.id } }
            - { call: "POST /disbursement-requests/${drl_id}/review", payload: { decision: "REJECT" }, as: MasterServicer }
          trigger:
            - { call: "POST /disbursement-requests/${drl_id}/review", payload: { decision: "APPROVE" }, as: MasterServicer, captures: { err_state_fiscal: $.data.error_id } }
          assert:
            - "second review returns 409 with error_id == ERR_INVALID_STATE (state category wins)"
            - "error_id != ERR_INSUFFICIENT_RESERVE_FUNDS even though 5000000 > available 1000000 (fiscal failure still latent)"
            - "request remains REJECTED; reserve held_cents == 0, balance_cents == 1000000"

      - name: exercise_breach_safety_beats_window_temporal
        grounds:
          - validations[priority=9]
          - validations[priority=30]
          - state_machines.ExtensionOption.AVAILABLE_to_EXERCISED
        distinguishing_aspect: |
          Error-category pair business_safety vs business_temporal: an
          extension exercise attempted with an OPEN covenant breach (safety)
          while also outside the exercise window (temporal) must surface
          ERR_OPEN_COVENANT_BREACH, because priority 9 runs before priority 30.
          A different category pair from review_decision_state_beats_fiscal.
        test_recipe:
          setup:
            - "Loan M: T3 basis, dscr threshold 1.20; accepted Q2'26 operating statement NOI 15000000 -> DSCR 1.0000 < 1.20 -> OPEN breach (WATCHLIST)"
            - "Extension option seq 1 with exercise window [2026-12-01, 2027-03-01], maturity 2027-06-30; clock never advanced from default 2026-08-01 so the option is AVAILABLE but the window has not opened (temporal failure live alongside the breach)"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Priority Two", tax_id: "TX-PR2", contact_email: "p2@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-PR2", original_principal_cents: 1000000000, note_rate: 0.06, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2027-06-30T00:00:00Z", dscr_covenant_threshold: 1.20, ltv_covenant_threshold: 0.90, dscr_basis: "T3_ANNUALIZED", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { lm_id: $.data.id } }
            - { call: "POST /loans/${lm_id}/financial-statements", payload: { statement_type: "OPERATING_STATEMENT", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", net_operating_income_cents: 15000000 }, as: Borrower, as_user_id: "${b_id}", captures: { osm_id: $.data.id } }
            - { call: "POST /financial-statements/${osm_id}/review", payload: { decision: "ACCEPT" }, as: MasterServicer }
            - { call: "POST /loans/${lm_id}/extension-options", payload: { option_seq: 1, exercise_window_start: "2026-12-01T00:00:00Z", exercise_window_end: "2027-03-01T00:00:00Z", extension_months: 12, fee_pct: 0.0025 }, as: MasterServicer, captures: { exm_id: $.data.id } }
          trigger:
            - { call: "POST /extension-options/${exm_id}/exercise", as: Borrower, as_user_id: "${b_id}", payload: {}, captures: { err_safety_temporal: $.data.error_id } }
          assert:
            - "exercise returns 409 with error_id == ERR_OPEN_COVENANT_BREACH (safety category wins)"
            - "error_id != ERR_EXTENSION_WINDOW_CLOSED even though 2026-08-01 < window start 2026-12-01 (temporal failure latent)"
            - "option remains AVAILABLE; loan.maturity_date unchanged 2027-06-30"

  # ------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: dscr_exactly_at_threshold_no_breach
        grounds:
          - calculations.dscr_calculation
          - state_machines.CovenantAssessment
          - entities.CovenantAssessment.fields.breach
        distinguishing_aspect: |
          Ratio-metric boundary on the statement-review endpoint: DSCR exactly
          equal to the threshold (1.2000 == 1.20) is NOT a breach because the
          rule is strict less-than; one cent less of NOI (17999999 -> 1.1999)
          breaches. Boundary sits on a ratio metric via POST
          /financial-statements/{id}/review.
        test_recipe:
          setup:
            - "Loan N: T3 basis, threshold 1.20, principal 1000000000 rate 0.06 (ADS 60000000); NOI 18000000 gives exactly 72000000/60000000 = 1.2000"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Boundary Ratio", tax_id: "TX-BR1", contact_email: "br1@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-BR1", original_principal_cents: 1000000000, note_rate: 0.06, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.20, ltv_covenant_threshold: 0.90, dscr_basis: "T3_ANNUALIZED", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { ln_id: $.data.id } }
            - { call: "POST /loans/${ln_id}/financial-statements", payload: { statement_type: "OPERATING_STATEMENT", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", net_operating_income_cents: 18000000 }, as: Borrower, as_user_id: "${b_id}", captures: { osn_id: $.data.id } }
          trigger:
            - { call: "POST /financial-statements/${osn_id}/review", payload: { decision: "ACCEPT" }, as: MasterServicer }
            - { call: "GET /loans/${ln_id}/covenant-assessments", as: MasterServicer, captures: { n_val: "$.data[0].computed_value", n_breach: "$.data[0].breach" } }
            - { call: "GET /loans/${ln_id}", as: MasterServicer, captures: { n_posture: $.data.servicing_status } }
          assert:
            - "assessment computed_value == 1.2000 with breach == false and status == CONFORMING (>= threshold passes)"
            - "loan servicing_status remains PERFORMING; no WatchlistEntry created"

      - name: disbursement_amount_equals_available_balance
        grounds:
          - validations[priority=34]
          - entities.ReserveAccount.fields.available_cents
          - state_machines.DisbursementRequest.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Money-metric boundary on the disbursement-review endpoint: amount
          exactly equal to available_cents approves (inclusive <=), while one
          cent more is rejected with ERR_INSUFFICIENT_RESERVE_FUNDS. A
          different metric (integer cents) and endpoint from
          dscr_exactly_at_threshold_no_breach.
        test_recipe:
          setup:
            - "Loan O clean; TI_LC reserve deposit 5000000 (version 2)"
            - "Request 1 amount 5000000 approved: available 5000000 >= 5000000 inclusive -> hold consumes everything (available 0)"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Boundary Cash", tax_id: "TX-BC1", contact_email: "bc1@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-BC1", original_principal_cents: 1000000000, note_rate: 0.06, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { lo_id: $.data.id } }
            - { call: "POST /loans/${lo_id}/reserve-accounts", payload: { account_type: "TI_LC", target_balance_cents: 0 }, as: MasterServicer, captures: { ro_id: $.data.id } }
            - { call: "POST /reserve-accounts/${ro_id}/deposits", payload: { amount_cents: 5000000 }, as: MasterServicer, captures: { ro_v2: $.data.version } }
            - { call: "POST /reserve-accounts/${ro_id}/disbursement-requests", payload: { purpose: "LEASING_COMMISSION", line_items: [ { description: "broker fee", amount_cents: 5000000 } ], expected_reserve_account_version: "${ro_v2}" }, as: Borrower, as_user_id: "${b_id}", captures: { dro1_id: $.data.id } }
          trigger:
            - { call: "POST /disbursement-requests/${dro1_id}/review", payload: { decision: "APPROVE" }, as: MasterServicer, captures: { o1_status: $.data.status } }
            - { call: "GET /reserve-accounts/${ro_id}", as: MasterServicer, captures: { ro_held: $.data.held_cents, ro_avail: $.data.available_cents, ro_v4: $.data.version } }
            - { call: "POST /reserve-accounts/${ro_id}/disbursement-requests", payload: { purpose: "CAPITAL_REPAIR", line_items: [ { description: "one cent", amount_cents: 1 } ], expected_reserve_account_version: "${ro_v4}" }, as: Borrower, as_user_id: "${b_id}", captures: { dro2_id: $.data.id } }
            - { call: "POST /disbursement-requests/${dro2_id}/review", payload: { decision: "APPROVE" }, as: MasterServicer, captures: { err_over_by_cent: $.data.error_id } }
          assert:
            - "request 1 (amount == available exactly) APPROVED; reserve held_cents == 5000000, available_cents == 0"
            - "request 2 (1 cent over zero available) -> 422 ERR_INSUFFICIENT_RESERVE_FUNDS"
            - "inclusive boundary: == passes, == + 1 fails"

  # ------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: extension_exercise_gated_by_loan_payment_and_covenant
        grounds:
          - state_machines.ExtensionOption.AVAILABLE_to_EXERCISED
          - validations[priority=10]
          - entities.ExtensionOption.fields.exercised_fee_cents
        distinguishing_aspect: |
          Entity pair ExtensionOption x Loan: the option's AVAILABLE->EXERCISED
          transition is gated on the parent Loan's payment_status dimension
          (DELINQUENT blocks with ERR_LOAN_NOT_CURRENT; curing unblocks) — the
          valid next-state set of one entity depends on another entity's state.
        test_recipe:
          setup:
            - "Loan P clean (thresholds 1.0/0.90, no statements -> no breaches); balance 500000000; option seq 1 window [2026-08-01, 2026-11-30] (clock 2026-08-01 is the inclusive start), extension_months 12, fee_pct 0.0025, maturity 2027-06-30"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Gate One", tax_id: "TX-GT1", contact_email: "g1@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-GT1", original_principal_cents: 500000000, note_rate: 0.06, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2027-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { lp_id: $.data.id } }
            - { call: "POST /loans/${lp_id}/extension-options", payload: { option_seq: 1, exercise_window_start: "2026-08-01T00:00:00Z", exercise_window_end: "2026-11-30T00:00:00Z", extension_months: 12, fee_pct: 0.0025 }, as: MasterServicer, captures: { exp_id: $.data.id } }
            - { call: "POST /loans/${lp_id}/payment-status", payload: { to_status: "DELINQUENT" }, as: MasterServicer }
          trigger:
            - { call: "POST /extension-options/${exp_id}/exercise", as: Borrower, as_user_id: "${b_id}", payload: {}, captures: { err_gate: $.data.error_id } }
            - { call: "POST /loans/${lp_id}/payment-status", payload: { to_status: "CURRENT" }, as: MasterServicer }
            - { call: "POST /extension-options/${exp_id}/exercise", as: Borrower, as_user_id: "${b_id}", payload: {}, captures: { ex_fee: $.data.exercised_fee_cents, ex_status: $.data.status } }
            - { call: "GET /loans/${lp_id}", as: MasterServicer, captures: { p_mat: $.data.maturity_date } }
          assert:
            - "exercise while DELINQUENT -> 409 ERR_LOAN_NOT_CURRENT (loan state gates the option transition)"
            - "after cure to CURRENT, exercise succeeds: status == EXERCISED, exercised_fee_cents == 1250000 (round(500000000 x 0.0025))"
            - "loan.maturity_date == 2028-06-30 (12 calendar months added to 2027-06-30)"

      - name: major_lease_approval_gated_by_estoppel_execution
        grounds:
          - state_machines.Lease.SUBMITTED_to_APPROVED
          - state_machines.EstoppelCertificate.PENDING_to_EXECUTED
          - validations[priority=14]
        distinguishing_aspect: |
          Entity pair Lease x EstoppelCertificate: a lease above the lender-
          approval threshold cannot transition SUBMITTED->APPROVED until a
          linked estoppel is EXECUTED and unexpired — a different entity pair
          from extension_exercise_gated_by_loan_payment_and_covenant.
        test_recipe:
          setup:
            - "Loan Q clean; property; major lease rent 600000 (> 500000 threshold) so lender_approval_required and estoppel_required are true; lease SUBMITTED; estoppel PENDING (due 2026-08-20)"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Gate Two", tax_id: "TX-GT2", contact_email: "g2@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-GT2", original_principal_cents: 1000000000, note_rate: 0.06, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { lq_id: $.data.id } }
            - { call: "POST /loans/${lq_id}/properties", payload: { address: "11 Gate Pl", property_type: "OFFICE", appraised_value_cents: 2000000000, appraisal_date: "2026-06-01T00:00:00Z" }, as: MasterServicer, captures: { pq_id: $.data.id } }
            - { call: "POST /properties/${pq_id}/leases", payload: { tenant_name: "Major Tenant", suite_ref: "STE-200", commencement_date: "2026-09-01T00:00:00Z", expiry_date: "2030-08-31T00:00:00Z", base_rent_cents_monthly: 600000, sqft: 4000, term_months: 48 }, as: Borrower, as_user_id: "${b_id}", captures: { lq_lease: $.data.id } }
            - { call: "POST /leases/${lq_lease}/submit", as: Borrower, as_user_id: "${b_id}", payload: {} }
            - { call: "POST /leases/${lq_lease}/estoppels", payload: { due_date: "2026-08-20T00:00:00Z" }, as: MasterServicer, captures: { est_id: $.data.id } }
          trigger:
            - { call: "POST /leases/${lq_lease}/decide", payload: { decision: "APPROVE" }, as: MasterServicer, captures: { err_est: $.data.error_id } }
            - { call: "POST /estoppels/${est_id}/execute", as: Borrower, as_user_id: "${b_id}", payload: {}, captures: { est_status: $.data.status, est_exp: $.data.expires_at } }
            - { call: "POST /leases/${lq_lease}/decide", payload: { decision: "APPROVE" }, as: MasterServicer, captures: { lease_final: $.data.status } }
          assert:
            - "first APPROVE -> 409 ERR_ESTOPPEL_REQUIRED (estoppel PENDING blocks the lease transition)"
            - "execute sets status EXECUTED with expires_at == 2026-10-30T00:00:00Z (executed 2026-08-01 + 90 days)"
            - "second APPROVE succeeds: lease status == APPROVED"
            - "lease.estoppel_required == true driven by rent 600000 > 500000 threshold"

  # ------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: inspector_half_open_window_adjacency
        grounds:
          - validations[priority=21]
          - entities.PropertyInspection.fields.scheduled_start
        distinguishing_aspect: |
          Interval semantics: half-open [start, end) on the Inspector
          resource — a booking starting exactly at another's end (11:00 after
          09:00-11:00) is allowed, while a 10:30-12:00 booking collides.
          Minute-precision datetime intervals on the Inspector entity.
        test_recipe:
          setup:
            - "Loan R clean; property; inspector with one SCHEDULED inspection 2026-08-03 09:00-11:00"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Overlap One", tax_id: "TX-OV1", contact_email: "o1@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-OV1", original_principal_cents: 1000000000, note_rate: 0.06, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { lr_id: $.data.id } }
            - { call: "POST /loans/${lr_id}/properties", payload: { address: "13 Overlap St", property_type: "RETAIL", appraised_value_cents: 2000000000, appraisal_date: "2026-06-01T00:00:00Z" }, as: MasterServicer, captures: { pr_id: $.data.id } }
            - { call: "POST /inspectors", payload: { full_name: "Otto Verlap", license_no: "LIC-OV1" }, as: MasterServicer, captures: { i_id: $.data.id } }
            - { call: "POST /properties/${pr_id}/inspections", payload: { inspector_id: "${i_id}", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T11:00:00Z" }, as: MasterServicer, captures: { ina_id: $.data.id } }
          trigger:
            - { call: "POST /properties/${pr_id}/inspections", payload: { inspector_id: "${i_id}", scheduled_start: "2026-08-03T11:00:00Z", scheduled_end: "2026-08-03T13:00:00Z" }, as: MasterServicer, captures: { inb_id: $.data.id } }
            - { call: "POST /properties/${pr_id}/inspections", payload: { inspector_id: "${i_id}", scheduled_start: "2026-08-03T10:30:00Z", scheduled_end: "2026-08-03T12:00:00Z" }, as: MasterServicer, captures: { err_conflict: $.data.error_id } }
          assert:
            - "adjacent booking [11:00, 13:00) after [09:00, 11:00) succeeds (201) — half-open adjacency allowed"
            - "booking [10:30, 12:00) -> 409 ERR_INSPECTOR_SCHEDULE_CONFLICT (overlaps both existing windows)"
            - "conflict check ignores non-SCHEDULED inspections (CANCELLED/COMPLETED free the window)"

      - name: insurance_closed_interval_touching_overlap
        grounds:
          - validations[priority=20]
          - entities.InsurancePolicy.fields.end_date
        distinguishing_aspect: |
          Interval semantics: closed date intervals [start_date, end_date] on
          (Property, coverage_type) — a policy starting 2026-12-31 collides
          with one ending 2026-12-31 (shared date counts as overlap), while
          2027-01-01 adjacency is allowed. Date-precision closed intervals on
          InsurancePolicy, different arithmetic from the inspector's half-open
          minute windows.
        test_recipe:
          setup:
            - "Loan S clean, balance 400000000; property; ACTIVE PROPERTY policy [2026-01-01, 2026-12-31] coverage 400000000 (>= balance)"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Overlap Two", tax_id: "TX-OV2", contact_email: "o2@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-OV2", original_principal_cents: 400000000, note_rate: 0.06, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { ls_id: $.data.id } }
            - { call: "POST /loans/${ls_id}/properties", payload: { address: "15 Overlap Ave", property_type: "INDUSTRIAL", appraised_value_cents: 1000000000, appraisal_date: "2026-06-01T00:00:00Z" }, as: MasterServicer, captures: { ps_id: $.data.id } }
            - { call: "POST /properties/${ps_id}/insurance-policies", payload: { coverage_type: "PROPERTY", coverage_amount_cents: 400000000, start_date: "2026-01-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z" }, as: Borrower, as_user_id: "${b_id}", captures: { pol1_id: $.data.id } }
          trigger:
            - { call: "POST /properties/${ps_id}/insurance-policies", payload: { coverage_type: "PROPERTY", coverage_amount_cents: 400000000, start_date: "2026-12-31T00:00:00Z", end_date: "2027-12-31T00:00:00Z" }, as: Borrower, as_user_id: "${b_id}", captures: { err_touch: $.data.error_id } }
            - { call: "POST /properties/${ps_id}/insurance-policies", payload: { coverage_type: "PROPERTY", coverage_amount_cents: 400000000, start_date: "2027-01-01T00:00:00Z", end_date: "2027-12-31T00:00:00Z" }, as: Borrower, as_user_id: "${b_id}", captures: { pol3_id: $.data.id } }
          assert:
            - "policy starting 2026-12-31 -> 409 ERR_COVERAGE_WINDOW_OVERLAP (closed intervals share the endpoint date)"
            - "policy starting 2027-01-01 succeeds (201) — next-day adjacency is disjoint under date semantics"
            - "overlap scope is per coverage_type: a LIABILITY policy over the same dates would not conflict"

  # ------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: approve_then_cancel_conserves_reserve_cash
        grounds:
          - state_machines.DisbursementRequest.APPROVED_to_CANCELLED
          - entities.ReserveAccount.fields.held_cents
        distinguishing_aspect: |
          Conserved quantity: reserve cash. Forward action APPROVE (held += 3M)
          paired with its compensating CANCEL (held -= 3M) leaves
          balance_cents, held_cents, and available_cents identical to
          pre-action values; deposits == balance + funded_out + released holds
          throughout.
        test_recipe:
          setup:
            - "Loan T clean; TI_LC reserve deposit 8000000 (version 2); draw request 3000000 created (version 3)"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Invariant One", tax_id: "TX-IV1", contact_email: "i1@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-IV1", original_principal_cents: 1000000000, note_rate: 0.06, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { lt_id: $.data.id } }
            - { call: "POST /loans/${lt_id}/reserve-accounts", payload: { account_type: "TI_LC", target_balance_cents: 0 }, as: MasterServicer, captures: { rt_id: $.data.id } }
            - { call: "POST /reserve-accounts/${rt_id}/deposits", payload: { amount_cents: 8000000 }, as: MasterServicer, captures: { rt_v: $.data.version } }
            - { call: "POST /reserve-accounts/${rt_id}/disbursement-requests", payload: { purpose: "TENANT_IMPROVEMENT", line_items: [ { description: "suite 400 buildout", amount_cents: 3000000 } ], expected_reserve_account_version: "${rt_v}" }, as: Borrower, as_user_id: "${b_id}", captures: { drt_id: $.data.id } }
          trigger:
            - { call: "POST /disbursement-requests/${drt_id}/review", payload: { decision: "APPROVE" }, as: MasterServicer }
            - { call: "GET /reserve-accounts/${rt_id}", as: MasterServicer, captures: { t_held_mid: $.data.held_cents, t_avail_mid: $.data.available_cents } }
            - { call: "POST /disbursement-requests/${drt_id}/cancel", as: Borrower, as_user_id: "${b_id}", payload: {}, captures: { t_final_status: $.data.status } }
            - { call: "GET /reserve-accounts/${rt_id}", as: MasterServicer, captures: { t_bal: $.data.balance_cents, t_held: $.data.held_cents, t_avail: $.data.available_cents } }
          assert:
            - "mid-flight: held_cents == 3000000, available_cents == 5000000, balance_cents unchanged 8000000 (approval holds, never moves cash)"
            - "after cancel: status == CANCELLED, held_cents == 0, available_cents == 8000000"
            - "invariant: deposits 8000000 == balance 8000000 + funded_out 0 + retainage_released 0 — approve+cancel conserve reserve cash with zero drift"

      - name: force_place_then_cancel_conserves_loan_balance
        grounds:
          - calculations.protective_advance_capitalization
          - state_machines.InsurancePolicy.ACTIVE_to_CANCELLED
          - entities.Loan.fields.current_balance_cents
        distinguishing_aspect: |
          Conserved quantity: loan principal balance. Force-placement
          capitalizes a protective advance (+10000000) and cancelling the
          force-placed policy after replacement coverage reverses exactly the
          recorded premium_advance_cents — current_balance_cents returns to
          500000000 with zero drift. A different conserved quantity (loan UPB)
          from approve_then_cancel_conserves_reserve_cash (reserve cash).
        test_recipe:
          setup:
            - "Loan U: principal == balance 500000000, ltv threshold 0.75; property appraised 800000000 on 2026-05-01; no ACTIVE PROPERTY coverage"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Invariant Two", tax_id: "TX-IV2", contact_email: "i2@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-IV2", original_principal_cents: 500000000, note_rate: 0.05, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.75, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { lu_id: $.data.id } }
            - { call: "POST /loans/${lu_id}/properties", payload: { address: "17 Invariant Ct", property_type: "MULTIFAMILY", appraised_value_cents: 800000000, appraisal_date: "2026-05-01T00:00:00Z" }, as: MasterServicer, captures: { pu_id: $.data.id } }
            - { call: "POST /properties/${pu_id}/force-place-insurance", payload: { coverage_type: "PROPERTY" }, as: SpecialServicer, captures: { fpu_id: $.data.id } }
          trigger:
            - { call: "POST /properties/${pu_id}/insurance-policies", payload: { coverage_type: "PROPERTY", coverage_amount_cents: 510000000, start_date: "2026-08-01T00:00:00Z", end_date: "2027-07-31T00:00:00Z" }, as: Borrower, as_user_id: "${b_id}", captures: { repl_id: $.data.id } }
            - { call: "POST /insurance-policies/${fpu_id}/cancel", as: SpecialServicer, payload: {}, captures: { fp_status: $.data.status } }
            - { call: "GET /loans/${lu_id}", as: MasterServicer, captures: { u_bal: $.data.current_balance_cents, u_adv: $.data.capitalized_advances_cents, u_ltv: $.data.current_ltv } }
          assert:
            - "after force-place: balance was 510000000 with capitalized_advances_cents 10000000"
            - "replacement policy (covering from the force-place start date) is ACTIVE; force-placed policies never block it via overlap"
            - "after cancel: policy CANCELLED, loan.current_balance_cents == 500000000 exactly, capitalized_advances_cents == 0"
            - "invariant: forward advance + compensating reversal conserve Loan.current_balance_cents; current_ltv == 0.6250 recomputed"
