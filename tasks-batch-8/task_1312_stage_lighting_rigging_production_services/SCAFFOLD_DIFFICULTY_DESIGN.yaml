          - entities.Venue.fields.ot1_threshold_hours
        distinguishing_aspect: |
          Numeric-threshold boundary on the overtime metric via the crew-assignment/crew-call
          completion endpoints: at an IATSE venue, 8.00 worked hours bills zero OT1 (charge
          100000 = 8 ST + 2h meal penalty), while 8.01 hours bills 0.01h at 1.5x (charge 100150)
          — the boundary is inclusive of exactly 8.00 for straight time.
