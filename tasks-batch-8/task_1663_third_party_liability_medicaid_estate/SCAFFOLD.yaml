# =============================================================================
# SCAFFOLD — Third-Party Liability & Medicaid Estate Recovery
# §1.0–§1.7 seed tables (difficulty design and corner design live in sibling files)
# =============================================================================

scenario: |
  Third-Party Liability & Medicaid Estate Recovery (state Medicaid recovery unit):
  accident/injury case identification & attorney notification, lien filing &
  statutory lien limits, settlement negotiation & reduction formula, subrogation
  vs reimbursement approach by state, estate recovery claim on probate & hardship
  waiver, tracking of pending litigation & statute of limitations, recovery
  accounting & contractor commission, member communication requirements

domain_name: medicaid-tpl-estate-recovery
api_prefix: /recovery

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: medicaid_id, type: string, source: input, description: "State Medicaid beneficiary identifier; unique across all members" }
      - { name: full_name, type: string, source: input, description: "Member legal full name" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code of the member's Medicaid program; drives recovery_approach" }
      - { name: recovery_approach, type: enum, source: computed, description: "SUBROGATION when state_code IN {MT, WY}; REIMBURSEMENT otherwise. Drives settlement_recovery_amount variant selection" }
      - { name: date_of_death, type: string, source: system, default: null, description: "ISO date (YYYY-MM-DD) recorded by mark-deceased; null while living" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DECEASED" }

  - name: TplCase
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the injured beneficiary" }
      - { name: attorney_name, type: string, source: input, description: "Name of the member's injury-claim attorney of record" }
      - { name: attorney_email, type: string, source: input, description: "Attorney contact email used for attorney notification" }
      - { name: injury_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) of the accident/injury; anchors sol_date and episode dedupe window" }
      - { name: third_party_insurer, type: string, source: input, description: "Name of the liable third party / insurer" }
      - { name: status, type: enum, source: system, description: "IDENTIFIED | ATTORNEY_NOTIFIED | LIEN_FILED | SETTLEMENT_PENDING | RESOLVED | CLOSED_NO_RECOVERY | SOL_EXPIRED" }
      - { name: litigation_status, type: enum, source: system, description: "Parallel dimension: NO_SUIT | SUIT_FILED | JUDGMENT | SUIT_DISMISSED; evolves independently of status" }
      - { name: sol_date, type: string, source: computed, description: "Statute-of-limitations date = injury_date + SOL_YEARS (same calendar date, 3 years later)" }
      - { name: attorney_notified_at, type: datetime, source: system, default: null, description: "Timestamp when attorney notification was recorded" }
      - { name: total_paid_claims_cents, type: integer, source: computed, description: "Sum of paid_amount_cents over ALL ExpenseClaim rows of this case (included or not)" }
      - { name: total_recovered_cents, type: integer, source: computed, description: "Sum of gross_recovery_cents over RecoveryPosting rows with status POSTED on settlements of this case" }

  - name: ExpenseClaim
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> TplCase.id; the injury case this Medicaid paid claim belongs to" }
      - { name: service_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) the medical service was rendered" }
      - { name: paid_amount_cents, type: integer, source: input, description: "Medicaid paid amount in cents; must be > 0" }
      - { name: claim_reference, type: string, source: input, description: "External claim reference from the MMIS feed" }
      - { name: included_in_lien_basis, type: boolean, source: computed, description: "true iff service_date >= case.injury_date (calendar-date comparison); only included rows feed lien_perfected_amount" }

  - name: Lien
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> TplCase.id; case this lien is filed against" }
      - { name: lien_amount_cents, type: integer, source: computed, description: "Perfected lien amount = lien_perfected_amount at filing; replaced by new_amount_cents on amend" }
      - { name: statutory_cap_cents, type: integer, source: system, description: "Snapshot of STATUTORY_LIEN_CAP_CENTS at filing time (audit immutability)" }
      - { name: outstanding_cents, type: integer, source: computed, description: "lien_amount_cents minus sum of gross_recovery_cents over RecoveryPosting rows with status POSTED on this lien" }
      - { name: status, type: enum, source: system, description: "FILED | AMENDED | SATISFIED | RELEASED | EXPIRED" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock timestamp at filing" }
      - { name: amended_count, type: integer, source: system, default: 0, description: "Number of successful amendments" }

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> TplCase.id; case under negotiation" }
      - { name: round_number, type: integer, source: system, default: 1, description: "Negotiation round; increments on every counter transition" }
      - { name: status, type: enum, source: system, description: "OFFERED | COUNTERED | ACCEPTED | REJECTED | DISBURSED" }
      - { name: gross_amount_cents, type: integer, source: input, description: "Gross third-party settlement/offer amount; must be > 0" }
      - { name: attorney_fee_pct, type: number, source: input, description: "Contingency fee fraction, e.g. 0.25; 0 < value < 1" }
      - { name: litigation_costs_cents, type: integer, source: input, description: "Litigation costs off the top; must be >= 0" }
      - { name: offered_by, type: enum, source: input, description: "INSURER | STATE — which side tabled the current offer" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creator; used by segregation-of-duties check on accept" }
      - { name: fee_amount_cents, type: integer, source: computed, description: "round_half_up(gross_amount_cents * attorney_fee_pct)" }
      - { name: cost_share_cents, type: integer, source: computed, description: "Subrogation variant only: min(litigation_costs_cents, round_half_up(pre_cost * COST_SHARE_CAP_PCT)); 0 under REIMBURSEMENT" }
      - { name: state_recovery_cents, type: integer, source: computed, description: "settlement_recovery_amount under the member's recovery_approach; computed at creation AND recomputed at accept against current lien outstanding" }
      - { name: member_net_cents, type: integer, source: computed, description: "gross_amount_cents - fee_amount_cents - litigation_costs_cents - state_recovery_cents" }
      - { name: accepted_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of acceptance" }

  - name: RecoveryPosting
    parent: null
    common_fields: true
    fields:
      - { name: settlement_id, type: string, source: system, description: "FK -> Settlement.id; the accepted settlement this payment applies to" }
      - { name: lien_id, type: string, source: system, description: "FK -> Lien.id; the active lien on the settlement's case at posting creation (snapshot)" }
      - { name: contractor_code, type: string, source: input, description: "Recovery contractor identifier for commission attribution" }
      - { name: gross_recovery_cents, type: integer, source: input, description: "Check amount received from insurer; must be > 0; cumulative per settlement capped by settlement.state_recovery_cents" }
      - { name: commission_cents, type: integer, source: computed, default: null, description: "contractor_commission computed at post; null while PENDING" }
      - { name: net_to_state_cents, type: integer, source: computed, default: null, description: "gross_recovery_cents - commission_cents, computed at post; null while PENDING" }
      - { name: status, type: enum, source: system, description: "PENDING | POSTED | REVERSED" }

  - name: EstateCase
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; decedent whose estate is subject to recovery" }
      - { name: date_of_death, type: string, source: system, description: "Copied from Member.date_of_death at creation" }
      - { name: lifetime_paid_cents, type: integer, source: system, description: "Lifetime Medicaid paid amount reported at mark-deceased (MMIS feed snapshot)" }
      - { name: probate_case_number, type: string, source: system, default: null, description: "Probate docket number captured at file-claim" }
      - { name: exempt_services_cents, type: integer, source: system, default: null, description: "Statutorily exempt service dollars captured at file-claim" }
      - { name: provisional_claim_cents, type: integer, source: computed, description: "estate_claim_amount provisional variant at case opening = lifetime_paid_cents with no offsets" }
      - { name: claim_amount_cents, type: integer, source: computed, default: null, description: "estate_claim_amount final variant at file-claim; null until filed" }
      - { name: claim_outstanding_cents, type: integer, source: computed, description: "claim_amount_cents - total_paid_cents - sum of decided_reduction_cents over APPROVED (non-rescinded) waivers; 0 while OPENED" }
      - { name: total_paid_cents, type: integer, source: system, default: 0, description: "Accumulated estate payments via record-payment" }
      - { name: status, type: enum, source: system, description: "OPENED | CLAIM_FILED | PAID | WAIVED | TIME_BARRED" }

  - name: HardshipWaiver
    parent: null
    common_fields: true
    fields:
      - { name: estate_case_id, type: string, source: system, description: "FK -> EstateCase.id; estate claim this waiver applies to" }
      - { name: waiver_type, type: enum, source: input, description: "FULL | PARTIAL" }
      - { name: household_income_annual_cents, type: integer, source: input, description: "Heir household annual income; must be >= 0" }
      - { name: homestead_value_cents, type: integer, source: input, description: "Assessed homestead value; must be >= 0" }
      - { name: requested_reduction_cents, type: integer, source: input, description: "Required iff waiver_type == PARTIAL; ignored for FULL; must be > 0 when present" }
      - { name: decided_reduction_cents, type: integer, source: computed, default: null, description: "hardship_reduction result at approval; null while PENDING/DENIED" }
      - { name: appeal_count, type: integer, source: system, default: 0, description: "Number of appeals filed; max MAX_APPEALS = 1" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the waiver filer; segregation-of-duties check on approve" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | DENIED | RESCINDED" }

  - name: CommunicationNotice
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; notice recipient" }
      - { name: case_id, type: string, source: system, default: null, description: "FK -> TplCase.id; set for TPL notices (LIEN_FILED_NOTICE, SETTLEMENT_NOTICE, CASE_RESOLUTION_NOTICE), null for estate notices" }
      - { name: estate_case_id, type: string, source: system, default: null, description: "FK -> EstateCase.id; set for estate notices (ESTATE_CLAIM_NOTICE, ESTATE_DECISION_NOTICE), null for TPL notices" }
      - { name: notice_type, type: enum, source: system, description: "LIEN_FILED_NOTICE | SETTLEMENT_NOTICE | CASE_RESOLUTION_NOTICE | ESTATE_CLAIM_NOTICE | ESTATE_DECISION_NOTICE" }
      - { name: status, type: enum, source: system, description: "QUEUED | DELIVERED | FAILED" }
      - { name: due_date, type: string, source: computed, description: "Creation calendar date + NOTICE_DEADLINE_DAYS (30); member communication deadline" }
      - { name: sent_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of the latest send attempt" }
      - { name: is_late, type: boolean, source: computed, default: null, description: "At send: sent calendar date > due_date; null until first send" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Member
    initial_state: ACTIVE
    terminal_states: [DECEASED]
    transitions:
      - from: ACTIVE
        to: DECEASED
        trigger: "POST /recovery/members/{memberId}/mark-deceased"
        actor: EstateRecoveryOfficer
        preconditions:
          - "No EstateCase exists for this member (ERR_ESTATE_CASE_EXISTS)"
        side_effects:
          - "Sets date_of_death and lifetime_paid_cents on Member"
          - "Creates EstateCase (status OPENED) with provisional_claim_cents = estate_claim_amount provisional variant"

  - entity: TplCase
    initial_state: IDENTIFIED
    terminal_states: [RESOLVED, CLOSED_NO_RECOVERY, SOL_EXPIRED]
    note: "Two parallel dimensions on one entity: status (resolution track) x litigation_status (litigation track). litigation events are accepted whenever status is non-terminal."
    transitions:
      - from: IDENTIFIED
        to: ATTORNEY_NOTIFIED
        trigger: "POST /recovery/cases/{caseId}/notify-attorney"
        actor: RecoverySpecialist
        preconditions: []
        side_effects:
          - "attorney_notified_at = current logical clock"

      - from: ATTORNEY_NOTIFIED
        to: LIEN_FILED
        trigger: "POST /recovery/cases/{caseId}/liens"
        actor: RecoverySpecialist
        preconditions:
          - "No Lien with status IN {FILED, AMENDED} exists for this case (ERR_LIEN_ALREADY_EXISTS)"
        side_effects:
          - "Creates Lien with status FILED; lien_amount_cents = lien_perfected_amount"
          - "Creates CommunicationNotice LIEN_FILED_NOTICE (QUEUED) for the member, due_date = creation date + 30 days"

      - from: LIEN_FILED
        to: SETTLEMENT_PENDING
        trigger: "POST /recovery/cases/{caseId}/settlements"
        actor: RecoverySpecialist | RecoverySupervisor
        preconditions:
          - "Current calendar date <= sol_date, else lazy SOL expiry fires (ERR_SOL_EXPIRED)"
          - "A Lien with status IN {FILED, AMENDED} exists for this case (state precondition; ERR_INVALID_STATE_TRANSITION if case left LIEN_FILED)"
          - "No Settlement with status IN {OFFERED, COUNTERED} exists for this case (ERR_NEGOTIATION_IN_PROGRESS)"
          - "OCC: expected_case_version must match case.version (ERR_STALE_VERSION)"
        side_effects:
          - "Creates Settlement OFFERED (round_number = 1); computes fee_amount_cents, cost_share_cents, state_recovery_cents, member_net_cents via settlement_recovery_amount"
          - "increments TplCase.version by 1"

      - from: SETTLEMENT_PENDING
        to: LIEN_FILED
        trigger: "POST /recovery/settlements/{settlementId}/reject"
        actor: RecoverySupervisor
        preconditions:
          - "Settlement status IN {OFFERED, COUNTERED} (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "Settlement -> REJECTED"

      - from: SETTLEMENT_PENDING
        to: RESOLVED
        trigger: "system (automatic when the case's Lien reaches SATISFIED via a RecoveryPosting post)"
        actor: system
        preconditions:
          - "Lien.outstanding_cents == 0 after applying the posting"
        side_effects:
          - "total_recovered_cents recomputed (sum of POSTED postings)"
          - "Creates CommunicationNotice CASE_RESOLUTION_NOTICE (QUEUED), due_date = creation date + 30 days"

      - from: SETTLEMENT_PENDING
        to: RESOLVED
        trigger: "system (not used when lien satisfied before settlement creation; see LIEN_FILED self-coverage)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Alias row documents that RESOLVED is reachable only through lien satisfaction; no direct endpoint."

      - from: IDENTIFIED
        to: CLOSED_NO_RECOVERY
        trigger: "POST /recovery/cases/{caseId}/close"
        actor: RecoverySpecialist | RecoverySupervisor
        preconditions: []
        side_effects: []

      - from: ATTORNEY_NOTIFIED
        to: CLOSED_NO_RECOVERY
        trigger: "POST /recovery/cases/{caseId}/close"
        actor: RecoverySpecialist | RecoverySupervisor
        preconditions: []
        side_effects: []

      - from: LIEN_FILED
        to: ATTORNEY_NOTIFIED
        trigger: "system (revert on POST /recovery/liens/{lienId}/release when case status == LIEN_FILED)"
        actor: system
        preconditions: []
        side_effects: []
        note: "When case status == SETTLEMENT_PENDING a lien release leaves case status unchanged."

      - from: "IDENTIFIED|ATTORNEY_NOTIFIED|LIEN_FILED|SETTLEMENT_PENDING"
        to: SOL_EXPIRED
        trigger: "system (lazy expiry: any write action on the case or its lien/settlement children when current calendar date > sol_date)"
        actor: system
        preconditions:
          - "current calendar date > sol_date"
        side_effects:
          - "Case -> SOL_EXPIRED"
          - "Any Lien with status IN {FILED, AMENDED} on this case -> EXPIRED"
          - "Any Settlement with status IN {OFFERED, COUNTERED} on this case -> REJECTED"

  - entity: TplCaseLitigation
    note: "Parallel dimension litigation_status of TplCase, tracked separately for readability. Driven by POST /recovery/cases/{caseId}/litigation with litigation_event."
    initial_state: NO_SUIT
    terminal_states: []
    transitions:
      - from: NO_SUIT
        to: SUIT_FILED
        trigger: "litigation_event = FILE_SUIT"
        actor: RecoverySpecialist
        preconditions:
          - "Case status NOT IN {RESOLVED, CLOSED_NO_RECOVERY, SOL_EXPIRED} (ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: SUIT_FILED
        to: JUDGMENT
        trigger: "litigation_event = RECORD_JUDGMENT"
        actor: RecoverySpecialist
        preconditions: []
        side_effects: []
      - from: SUIT_FILED
        to: SUIT_DISMISSED
        trigger: "litigation_event = RECORD_DISMISSAL"
        actor: RecoverySpecialist
        preconditions: []
        side_effects: []
      - from: SUIT_DISMISSED
        to: SUIT_FILED
        trigger: "litigation_event = FILE_SUIT (refile after dismissal)"
        actor: RecoverySpecialist
        preconditions:
          - "Case status NOT IN {RESOLVED, CLOSED_NO_RECOVERY, SOL_EXPIRED} (ERR_INVALID_STATE_TRANSITION)"
        side_effects: []

  - entity: Lien
    initial_state: FILED
    terminal_states: [SATISFIED, RELEASED, EXPIRED]
    transitions:
      - from: FILED
        to: AMENDED
        trigger: "POST /recovery/liens/{lienId}/amend"
        actor: RecoverySpecialist
        preconditions:
          - "No negotiation freeze: for every Settlement on the case with status IN {OFFERED, COUNTERED}, current timestamp > settlement.updated_at + NEGOTIATION_FREEZE_DAYS (closed interval — exactly +14 days is still frozen) (ERR_NEGOTIATION_FREEZE)"
          - "Current calendar date <= case.sol_date (ERR_SOL_EXPIRED; lazy SOL expiry fires)"
          - "new_amount_cents <= lien.statutory_cap_cents (ERR_LIEN_EXCEEDS_CAP)"
          - "OCC: expected_lien_version must match lien.version (ERR_STALE_VERSION)"
        side_effects:
          - "lien_amount_cents = new_amount_cents; outstanding_cents recomputed"
          - "amended_count += 1; increments Lien.version by 1"
      - from: AMENDED
        to: AMENDED
        trigger: "POST /recovery/liens/{lienId}/amend"
        actor: RecoverySpecialist
        preconditions:
          - "Same as FILED -> AMENDED"
        side_effects:
          - "lien_amount_cents = new_amount_cents; outstanding_cents recomputed"
          - "amended_count += 1; increments Lien.version by 1"
      - from: FILED
        to: SATISFIED
        trigger: "system (automatic when a RecoveryPosting post drives outstanding_cents to exactly 0)"
        actor: system
        preconditions: []
        side_effects:
          - "Case (TplCase) with status SETTLEMENT_PENDING -> RESOLVED (which itself queues CASE_RESOLUTION_NOTICE)"
      - from: AMENDED
        to: SATISFIED
        trigger: "system (automatic when a RecoveryPosting post drives outstanding_cents to exactly 0)"
        actor: system
        preconditions: []
        side_effects:
          - "Case (TplCase) with status SETTLEMENT_PENDING -> RESOLVED (which itself queues CASE_RESOLUTION_NOTICE)"
      - from: SATISFIED
        to: FILED
        trigger: "system (compensation on POST /recovery/postings/{postingId}/reverse when the reversal reopens a positive outstanding_cents)"
        actor: system
        preconditions: []
        side_effects:
          - "outstanding_cents recomputed (posting excluded from POSTED set)"
          - "Case (TplCase) RESOLVED -> SETTLEMENT_PENDING (compensation)"
      - from: FILED
        to: RELEASED
        trigger: "POST /recovery/liens/{lienId}/release"
        actor: RecoverySupervisor
        preconditions:
          - "No RecoveryPosting with status POSTED exists on this lien (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "If case status == LIEN_FILED: case -> ATTORNEY_NOTIFIED; if SETTLEMENT_PENDING: case status unchanged"
      - from: AMENDED
        to: RELEASED
        trigger: "POST /recovery/liens/{lienId}/release"
        actor: RecoverySupervisor
        preconditions:
          - "No RecoveryPosting with status POSTED exists on this lien (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "If case status == LIEN_FILED: case -> ATTORNEY_NOTIFIED; if SETTLEMENT_PENDING: case status unchanged"
      - from: FILED
        to: EXPIRED
        trigger: "system (lazy SOL expiry cascade from TplCase)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AMENDED
        to: EXPIRED
        trigger: "system (lazy SOL expiry cascade from TplCase)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Settlement
    initial_state: OFFERED
    terminal_states: [REJECTED, DISBURSED]
    transitions:
      - from: OFFERED
        to: COUNTERED
        trigger: "POST /recovery/settlements/{settlementId}/counter"
        actor: RecoverySpecialist | RecoverySupervisor
        preconditions: []
        side_effects:
          - "round_number += 1; gross_amount_cents, attorney_fee_pct, litigation_costs_cents, offered_by replaced from payload"
          - "fee_amount_cents, cost_share_cents, state_recovery_cents, member_net_cents recomputed via settlement_recovery_amount"
      - from: COUNTERED
        to: OFFERED
        trigger: "POST /recovery/settlements/{settlementId}/counter"
        actor: RecoverySpecialist | RecoverySupervisor
        preconditions: []
        side_effects:
          - "round_number += 1; offer fields replaced; derived amounts recomputed"
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /recovery/settlements/{settlementId}/accept"
        actor: RecoverySupervisor
        preconditions:
          - "Segregation of duties: acting X-User-ID != settlement.created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "A Lien on the case has status IN {FILED, AMENDED} (ERR_LIEN_NOT_ACTIVE)"
          - "Current calendar date <= case.sol_date (ERR_SOL_EXPIRED; lazy SOL expiry fires)"
        side_effects:
          - "state_recovery_cents recomputed via settlement_recovery_amount against CURRENT lien outstanding_cents (derived-field reconciliation); fee_amount_cents, cost_share_cents, member_net_cents recomputed"
          - "accepted_at = current logical clock"
          - "Creates CommunicationNotice SETTLEMENT_NOTICE (QUEUED), due_date = creation date + 30 days"
      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /recovery/settlements/{settlementId}/accept"
        actor: RecoverySupervisor
        preconditions:
          - "Same as OFFERED -> ACCEPTED"
        side_effects:
          - "Same as OFFERED -> ACCEPTED"
      - from: OFFERED
        to: REJECTED
        trigger: "POST /recovery/settlements/{settlementId}/reject"
        actor: RecoverySupervisor
        preconditions: []
        side_effects:
          - "Case (TplCase) SETTLEMENT_PENDING -> LIEN_FILED"
      - from: COUNTERED
        to: REJECTED
        trigger: "POST /recovery/settlements/{settlementId}/reject"
        actor: RecoverySupervisor
        preconditions: []
        side_effects:
          - "Case (TplCase) SETTLEMENT_PENDING -> LIEN_FILED"
      - from: OFFERED
        to: REJECTED
        trigger: "system (lazy SOL expiry cascade from TplCase)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COUNTERED
        to: REJECTED
        trigger: "system (lazy SOL expiry cascade from TplCase)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: DISBURSED
        trigger: "system (automatic when the first RecoveryPosting on this settlement transitions to POSTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISBURSED
        to: ACCEPTED
        trigger: "system (compensation on POST /recovery/postings/{postingId}/reverse when no POSTED postings remain on this settlement)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RecoveryPosting
    initial_state: PENDING
    terminal_states: [REVERSED]
    transitions:
      - from: PENDING
        to: POSTED
        trigger: "POST /recovery/postings/{postingId}/post"
        actor: RecoveryAccountant
        preconditions:
          - "Current calendar date <= case.sol_date of the posting's settlement's case (ERR_SOL_EXPIRED; lazy SOL expiry fires)"
        side_effects:
          - "commission_cents = contractor_commission(gross_recovery_cents); net_to_state_cents = gross - commission"
          - "Lien.outstanding_cents -= gross_recovery_cents (lien mutation)"
          - "If lien.outstanding_cents == 0: Lien -> SATISFIED, which cascades TplCase SETTLEMENT_PENDING -> RESOLVED, which queues CASE_RESOLUTION_NOTICE"
          - "Settlement ACCEPTED -> DISBURSED"
          - "TplCase.total_recovered_cents recomputed"
      - from: POSTED
        to: REVERSED
        trigger: "POST /recovery/postings/{postingId}/reverse"
        actor: RecoveryAccountant
        preconditions: []
        side_effects:
          - "Lien.outstanding_cents += gross_recovery_cents (compensation)"
          - "If Lien was SATISFIED: Lien -> FILED, and TplCase RESOLVED -> SETTLEMENT_PENDING"
          - "If no POSTED postings remain on the settlement: Settlement DISBURSED -> ACCEPTED"
          - "TplCase.total_recovered_cents recomputed (posting excluded)"

  - entity: EstateCase
    initial_state: OPENED
    terminal_states: [PAID, WAIVED, TIME_BARRED]
    transitions:
      - from: OPENED
        to: CLAIM_FILED
        trigger: "POST /recovery/estate-cases/{estateCaseId}/file-claim"
        actor: EstateRecoveryOfficer
        preconditions:
          - "Current calendar date <= date_of_death + ESTATE_FILING_DAYS (365), else case -> TIME_BARRED and ERR_ESTATE_FILING_LATE"
        side_effects:
          - "probate_case_number, exempt_services_cents recorded"
          - "claim_amount_cents = estate_claim_amount final variant; claim_outstanding_cents = claim_amount_cents"
          - "Creates CommunicationNotice ESTATE_CLAIM_NOTICE (QUEUED), due_date = creation date + 30 days"
          - "If claim_amount_cents == 0: case transitions immediately to PAID"
      - from: CLAIM_FILED
        to: PAID
        trigger: "system (automatic when record-payment or waiver approval drives claim_outstanding_cents to exactly 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CLAIM_FILED
        to: WAIVED
        trigger: "system (on FULL hardship waiver approval: POST /recovery/waivers/{waiverId}/approve with waiver_type == FULL)"
        actor: system
        preconditions: []
        side_effects:
          - "claim_outstanding_cents = 0"
          - "Creates CommunicationNotice ESTATE_DECISION_NOTICE (QUEUED), due_date = creation date + 30 days"
      - from: WAIVED
        to: CLAIM_FILED
        trigger: "system (compensation on POST /recovery/waivers/{waiverId}/rescind of the approving waiver)"
        actor: system
        preconditions: []
        side_effects:
          - "claim_outstanding_cents restored: claim_amount_cents - total_paid_cents - sum of remaining APPROVED waiver reductions"
      - from: OPENED
        to: TIME_BARRED
        trigger: "system (lazy expiry on file-claim attempted after date_of_death + ESTATE_FILING_DAYS)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: HardshipWaiver
    initial_state: PENDING
    terminal_states: [APPROVED, RESCINDED]
    note: "DENIED is non-terminal: a single appeal (DENIED -> PENDING) is permitted."
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /recovery/waivers/{waiverId}/approve"
        actor: RecoverySupervisor
        preconditions:
          - "Segregation of duties: acting X-User-ID != waiver.created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "FULL waivers: homestead_value_cents <= HOMESTEAD_EXEMPT_CAP_CENTS AND household_income_annual_cents <= INCOME_LIMIT_CENTS (ERR_HARDSHIP_CRITERIA_NOT_MET)"
        side_effects:
          - "decided_reduction_cents = hardship_reduction"
          - "EstateCase.claim_outstanding_cents -= decided_reduction_cents (estate mutation)"
          - "FULL: EstateCase -> WAIVED, which queues ESTATE_DECISION_NOTICE"
          - "PARTIAL: EstateCase stays CLAIM_FILED unless outstanding hits 0 (-> PAID); queues ESTATE_DECISION_NOTICE"
      - from: PENDING
        to: DENIED
        trigger: "POST /recovery/waivers/{waiverId}/deny"
        actor: RecoverySupervisor
        preconditions: []
        side_effects:
          - "Creates CommunicationNotice ESTATE_DECISION_NOTICE (QUEUED), due_date = creation date + 30 days"
      - from: DENIED
        to: PENDING
        trigger: "POST /recovery/waivers/{waiverId}/appeal"
        actor: EstateRecoveryOfficer
        preconditions:
          - "appeal_count < MAX_APPEALS (1) (ERR_APPEAL_LIMIT_REACHED)"
        side_effects:
          - "appeal_count += 1"
      - from: APPROVED
        to: RESCINDED
        trigger: "POST /recovery/waivers/{waiverId}/rescind"
        actor: RecoverySupervisor
        preconditions: []
        side_effects:
          - "EstateCase.claim_outstanding_cents += decided_reduction_cents (compensation)"
          - "If EstateCase was WAIVED: EstateCase -> CLAIM_FILED"

  - entity: CommunicationNotice
    initial_state: QUEUED
    terminal_states: [DELIVERED]
    transitions:
      - from: QUEUED
        to: DELIVERED
        trigger: "POST /recovery/notices/{noticeId}/send with delivery_outcome = DELIVERED"
        actor: RecoverySpecialist
        preconditions: []
        side_effects:
          - "sent_at = current logical clock; is_late = (sent calendar date > due_date)"
      - from: QUEUED
        to: FAILED
        trigger: "POST /recovery/notices/{noticeId}/send with delivery_outcome = FAILED"
        actor: RecoverySpecialist
        preconditions: []
        side_effects:
          - "sent_at = current logical clock; is_late = (sent calendar date > due_date)"
      - from: FAILED
        to: DELIVERED
        trigger: "POST /recovery/notices/{noticeId}/send with delivery_outcome = DELIVERED (retry)"
        actor: RecoverySpecialist
        preconditions: []
        side_effects:
          - "sent_at and is_late recomputed from the retry attempt"
      - from: FAILED
        to: FAILED
        trigger: "POST /recovery/notices/{noticeId}/send with delivery_outcome = FAILED (retry fails again)"
        actor: RecoverySpecialist
        preconditions: []
        side_effects:
          - "sent_at and is_late recomputed from the latest attempt"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: lien-amend-stale-version
    parent_entity: Lien
    write_endpoint: "POST /recovery/liens/{lienId}/amend"
    occ_field: expected_lien_version
    description: |
      Amending a Lien whose version has advanced since the client last observed
      it is rejected. This captures the case where another writer has just
      amended the same lien (each amendment legitimately supersedes the prior
      amount under §1.2), leaving the current writer's view of the lien stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: settlement-create-stale-case
    parent_entity: TplCase
    write_endpoint: "POST /recovery/cases/{caseId}/settlements"
    occ_field: expected_case_version
    description: |
      Creating a Settlement against a TplCase whose version has advanced since
      the client last observed it is rejected. This captures the case where
      another writer has just mutated the case (e.g., added an expense claim,
      changing the lien basis), leaving the current writer's view of the case
      stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: lien_perfected_amount
    trigger: "Lien creation (POST /recovery/cases/{caseId}/liens)"
    algorithm: aggregation
    formula: |
      basis = sum(paid_amount_cents) over ExpenseClaim rows of the case
              WHERE included_in_lien_basis == true
              (included_in_lien_basis: service_date >= case.injury_date, calendar dates)
      lien_amount_cents = min(STATUTORY_LIEN_CAP_CENTS, basis)
    input_set: "ExpenseClaim rows of the case with service_date >= case.injury_date; claims before the injury date are excluded"
    constants:
      STATUTORY_LIEN_CAP_CENTS: 250000
    precision: "integer cents, no rounding"

  - name: settlement_recovery_amount
    trigger: "Settlement creation, counter, and accept (accept recomputes against current lien outstanding)"
    algorithm: constraint_propagation
    formula: |
      Common:
        fee_amount_cents = round_half_up(gross_amount_cents * attorney_fee_pct)
      Variant selection: member.recovery_approach (from Member.state_code).

      REIMBURSEMENT variant:
        net_after_fees = gross_amount_cents - fee_amount_cents - litigation_costs_cents
        ratio_limited  = round_half_up(gross_amount_cents * DEFAULT_MEDICAL_RATIO)
        state_recovery_cents = max(0, min(lien.outstanding_cents, net_after_fees, ratio_limited))
        cost_share_cents = 0

      SUBROGATION variant (evaluation order pinned to break the circular-looking
      dependency between recovery and cost share — cost share is capped by a
      fraction of the PRE-COST recovery, never of the post-deduction value):
        step 1: pre_cost_recovery = min(lien.outstanding_cents, gross_amount_cents)
        step 2: cost_share_cents  = min(litigation_costs_cents,
                                        round_half_up(pre_cost_recovery * COST_SHARE_CAP_PCT))
        step 3: state_recovery_cents = pre_cost_recovery - cost_share_cents

      Both variants:
        member_net_cents = gross_amount_cents - fee_amount_cents
                           - litigation_costs_cents - state_recovery_cents
    input_set: "The settlement's offer fields; the case's active Lien (status IN {FILED, AMENDED}); member.recovery_approach"
    constants:
      DEFAULT_MEDICAL_RATIO: 0.35
      COST_SHARE_CAP_PCT: 0.25
    precision: "integer cents; round_half_up wherever a multiplication yields fractional cents"
    variants:
      - name: reimbursement
        when: "member.recovery_approach == REIMBURSEMENT (state_code NOT IN {MT, WY})"
        difference: "Recovery capped by the statutory medical-portion ratio of the gross settlement and by net-after-fees; attorney fee share and costs reduce recovery through the min() chain"
      - name: subrogation
        when: "member.recovery_approach == SUBROGATION (state_code IN {MT, WY})"
        difference: "State stands in the member's shoes: recovery = min(lien outstanding, gross) minus a cost share capped at 25% of the pre-cost recovery"

  - name: estate_claim_amount
    trigger: "EstateCase creation (provisional) and file-claim (final)"
    algorithm: aggregation
    formula: |
      Provisional (at OPENED):
        provisional_claim_cents = lifetime_paid_cents    # no offsets, conservative upper bound
      Final (at file-claim), evaluation order pinned:
        step 1: tpl_offset_cents = sum(gross_recovery_cents) over RecoveryPosting rows
                 with status POSTED whose settlement belongs to a TplCase of this member
        step 2: claim_amount_cents = max(0, lifetime_paid_cents - tpl_offset_cents
                                          - exempt_services_cents)
      claim_outstanding_cents = claim_amount_cents - total_paid_cents
                                - sum(decided_reduction_cents over APPROVED non-rescinded waivers)
    input_set: "Member.lifetime_paid_cents; POSTED RecoveryPostings across the member's TPL cases; exempt_services_cents from file-claim payload"
    constants: {}
    precision: "integer cents, no rounding"
    variants:
      - name: provisional
        when: "At EstateCase creation (mark-deceased)"
        difference: "Gross lifetime paid amount with no TPL offset and no exempt-services deduction — used for the probate notice upper bound"
      - name: final
        when: "At file-claim"
        difference: "Net enforceable claim after subtracting prior TPL recoveries and statutory exemptions; floored at 0"

  - name: contractor_commission
    trigger: "RecoveryPosting post (PENDING -> POSTED); per-case totals on GET /recovery/cases/{caseId}/accounting-summary"
    algorithm: tiered_pricing
    formula: |
      Per posting, tiered on gross_recovery_cents g:
        tier1 = min(g, COMM_TIER1_CAP_CENTS) * COMM_TIER1_RATE
        tier2 = min(max(g - COMM_TIER1_CAP_CENTS, 0), COMM_TIER2_WIDTH_CENTS) * COMM_TIER2_RATE
        tier3 = max(g - COMM_TIER1_CAP_CENTS - COMM_TIER2_WIDTH_CENTS, 0) * COMM_TIER3_RATE
        commission_cents = round_half_up(tier1 + tier2 + tier3)   # round ONCE per posting
      Rounding order is pinned: each posting's commission is rounded to integer
      cents at post time; period/case totals are the SUM OF PER-POSTING ROUNDED
      commissions, never round(sum(unrounded)). The two orders differ on
      fractional-cent inputs.
      accounting-summary:
        total_recovered_cents     = sum(gross_recovery_cents) over POSTED postings of the case
        total_commission_cents    = sum(commission_cents) over POSTED postings of the case
        total_net_to_state_cents  = total_recovered_cents - total_commission_cents
    input_set: "RecoveryPosting rows of the case with status POSTED (PENDING and REVERSED excluded)"
    constants:
      COMM_TIER1_CAP_CENTS: 100000
      COMM_TIER1_RATE: 0.10
      COMM_TIER2_WIDTH_CENTS: 100000
      COMM_TIER2_RATE: 0.075
      COMM_TIER3_RATE: 0.05
    precision: "integer cents, round_half_up once per posting at post time"

  - name: hardship_reduction
    trigger: "HardshipWaiver approve (PENDING -> APPROVED)"
    algorithm: threshold
    formula: |
      FULL waiver (eligibility gated by validation):
        decided_reduction_cents = estate_case.claim_outstanding_cents
      PARTIAL waiver:
        exposed_equity = max(0, homestead_value_cents - HOMESTEAD_EXEMPT_CAP_CENTS)
        collectible    = max(0, estate_case.claim_outstanding_cents - exposed_equity)
        decided_reduction_cents = min(requested_reduction_cents, collectible)
      (>= 3 inputs with non-linear interaction: conditional branch on
      waiver_type, nested max/min over homestead value, outstanding claim, and
      the requested ceiling)
    input_set: "The waiver's input fields; estate_case.claim_outstanding_cents at approval time"
    constants:
      HOMESTEAD_EXEMPT_CAP_CENTS: 5000000
      INCOME_LIMIT_CENTS: 3000000
      ESTATE_FILING_DAYS: 365
      NOTICE_DEADLINE_DAYS: 30
      SOL_YEARS: 3
      EPISODE_WINDOW_DAYS: 90
      NEGOTIATION_FREEZE_DAYS: 14
      MAX_APPEALS: 1
    precision: "integer cents, no rounding"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Caller role must be listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Request body shape: required fields present, enums valid, amounts > 0 where required (paid_amount_cents, gross_amount_cents, gross_recovery_cents, amount_cents), percentages in (0,1)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 4
    category: existence
    check: "Path resource ids must exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 5
    category: auth
    check: "Segregation of duties: settlement accept and waiver approve require acting X-User-ID != created_by_user_id of the target record"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /recovery/settlements/{settlementId}/accept, POST /recovery/waivers/{waiverId}/approve"

  - priority: 6
    category: state
    check: "Target entity status must permit the transition (case IDENTIFIED for notify-attorney; case ATTORNEY_NOTIFIED for lien filing; case LIEN_FILED for settlement create; lien FILED/AMENDED for amend; lien FILED/AMENDED for release; settlement OFFERED/COUNTERED for counter/accept/reject; posting PENDING for post, POSTED for reverse; estate OPENED for file-claim, CLAIM_FILED for record-payment and waiver create; waiver PENDING for approve/deny, DENIED for appeal, APPROVED for rescind; notice QUEUED/FAILED for send; lien amend on terminal lien rejected as ERR_LIEN_NOT_AMENDABLE; settlement accept without an active lien rejected as ERR_LIEN_NOT_ACTIVE; waiver create / record-payment on non-CLAIM_FILED estate rejected as ERR_CLAIM_NOT_FILED; litigation events blocked on terminal case)"
    error_id: "ERR_INVALID_STATE_TRANSITION | ERR_ATTORNEY_NOT_NOTIFIED | ERR_LIEN_NOT_AMENDABLE | ERR_LIEN_NOT_ACTIVE | ERR_CLAIM_NOT_FILED"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_temporal
    check: "Time-window rules on the logical clock: current calendar date <= case.sol_date for settlement create/accept, lien amend, posting post (ERR_SOL_EXPIRED, fires lazy SOL expiry); lien amend blocked while a settlement on the case is OFFERED/COUNTERED and current timestamp <= settlement.updated_at + 14 days, closed interval (ERR_NEGOTIATION_FREEZE); file-claim requires current date <= date_of_death + 365 days (ERR_ESTATE_FILING_LATE, case -> TIME_BARRED)"
    error_id: "ERR_SOL_EXPIRED | ERR_NEGOTIATION_FREEZE | ERR_ESTATE_FILING_LATE"
    http_status: 409
    applies_to: "settlement create/accept, lien amend, posting post, estate file-claim"

  - priority: 8
    category: business_constraint
    check: "Uniqueness / aggregate constraints: no second TplCase for the same member whose injury_date falls inside [existing.injury_date, existing.injury_date + 90 days) of a non-terminal case — half-open window, exact end allowed (ERR_DUPLICATE_EPISODE_CASE); one active lien per case (ERR_LIEN_ALREADY_EXISTS); one open settlement per case (ERR_NEGOTIATION_IN_PROGRESS); one estate case per member (ERR_ESTATE_CASE_EXISTS); one PENDING waiver per estate case (ERR_WAIVER_PENDING_EXISTS); appeal_count < 1 (ERR_APPEAL_LIMIT_REACHED)"
    error_id: "ERR_DUPLICATE_EPISODE_CASE | ERR_LIEN_ALREADY_EXISTS | ERR_NEGOTIATION_IN_PROGRESS | ERR_ESTATE_CASE_EXISTS | ERR_WAIVER_PENDING_EXISTS | ERR_APPEAL_LIMIT_REACHED"
    http_status: 409
    applies_to: "case create, lien create, settlement create, mark-deceased, waiver create, waiver appeal"

  - priority: 9
    category: business_fiscal
    check: "Money rules: amended lien amount must be <= statutory_cap_cents (ERR_LIEN_EXCEEDS_CAP); FULL waiver approval requires homestead_value_cents <= 5000000 AND household_income_annual_cents <= 3000000 (ERR_HARDSHIP_CRITERIA_NOT_MET); estate record-payment amount_cents <= claim_outstanding_cents (ERR_PAYMENT_EXCEEDS_OUTSTANDING); cumulative gross_recovery_cents of non-REVERSED postings per settlement must be <= settlement.state_recovery_cents (ERR_POSTING_EXCEEDS_RECOVERY)"
    error_id: "ERR_LIEN_EXCEEDS_CAP | ERR_HARDSHIP_CRITERIA_NOT_MET | ERR_PAYMENT_EXCEEDS_OUTSTANDING | ERR_POSTING_EXCEEDS_RECOVERY"
    http_status: 409
    applies_to: "lien amend, waiver approve, estate record-payment, posting create"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Member ---
  - method: POST
    path: "/recovery/members"
    description: "Register a Medicaid member"
    roles: [SystemAdmin]
    code: 201
    input: [medicaid_id, full_name, state_code]
    output: Member
    side_effects: ["status = ACTIVE; recovery_approach derived from state_code"]

  - method: GET
    path: "/recovery/members/{memberId}"
    description: "Get a member"
    roles: [SystemAdmin, RecoverySpecialist, RecoverySupervisor, RecoveryAccountant, EstateRecoveryOfficer]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: POST
    path: "/recovery/members/{memberId}/mark-deceased"
    description: "Record member death; opens the estate recovery case"
    roles: [EstateRecoveryOfficer]
    code: 200
    input: [date_of_death, lifetime_paid_cents]
    output: Member
    side_effects:
      - "Member.status ACTIVE -> DECEASED; increments Member.version by 1"
      - "Creates EstateCase (OPENED) with provisional_claim_cents = lifetime_paid_cents"
      - "ERR_ESTATE_CASE_EXISTS if an EstateCase already exists for the member"

  # --- TplCase ---
  - method: POST
    path: "/recovery/cases"
    description: "Identify a third-party liability accident/injury case"
    roles: [RecoverySpecialist]
    code: 201
    input: [member_id, attorney_name, attorney_email, injury_date, third_party_insurer]
    output: TplCase
    side_effects:
      - "status = IDENTIFIED; litigation_status = NO_SUIT; sol_date = injury_date + 3 years"
      - "ERR_DUPLICATE_EPISODE_CASE on half-open 90-day episode overlap with a non-terminal case of the same member"

  - method: GET
    path: "/recovery/cases/{caseId}"
    description: "Get a TPL case"
    roles: [SystemAdmin, RecoverySpecialist, RecoverySupervisor, RecoveryAccountant, EstateRecoveryOfficer]
    code: 200
    input: []
    output: TplCase
    side_effects: []

  - method: GET
    path: "/recovery/cases"
    description: "List TPL cases with filters"
    roles: [SystemAdmin, RecoverySpecialist, RecoverySupervisor, RecoveryAccountant, EstateRecoveryOfficer]
    code: 200
    input: ["member_id?", "status?"]
    output: "TplCase[]"
    side_effects: []

  - method: POST
    path: "/recovery/cases/{caseId}/notify-attorney"
    description: "Record attorney notification (case IDENTIFIED -> ATTORNEY_NOTIFIED)"
    roles: [RecoverySpecialist]
    code: 200
    input: []
    output: TplCase
    side_effects: ["attorney_notified_at set; increments TplCase.version by 1"]

  - method: POST
    path: "/recovery/cases/{caseId}/expense-claims"
    description: "Add a Medicaid paid claim to the injury case"
    roles: [RecoverySpecialist]
    code: 201
    input: [service_date, paid_amount_cents, claim_reference]
    output: ExpenseClaim
    side_effects:
      - "included_in_lien_basis computed from service_date vs case.injury_date"
      - "TplCase.total_paid_claims_cents recomputed; increments TplCase.version by 1"

  - method: GET
    path: "/recovery/cases/{id}/expense-claims"
    description: "List expense claims of a case"
    roles: [SystemAdmin, RecoverySpecialist, RecoverySupervisor, RecoveryAccountant, EstateRecoveryOfficer]
    code: 200
    input: []
    output: "ExpenseClaim[]"
    side_effects: []

  - method: POST
    path: "/recovery/cases/{caseId}/litigation"
    description: "Record a litigation-track event on the case"
    roles: [RecoverySpecialist]
    code: 200
    input: [litigation_event]
    output: TplCase
    side_effects: ["litigation_status transitions per TplCaseLitigation machine; increments TplCase.version by 1"]

  - method: POST
    path: "/recovery/cases/{caseId}/close"
    description: "Close a case with no recovery (IDENTIFIED/ATTORNEY_NOTIFIED -> CLOSED_NO_RECOVERY)"
    roles: [RecoverySpecialist, RecoverySupervisor]
    code: 200
    input: []
    output: TplCase
    side_effects: ["increments TplCase.version by 1"]

  - method: GET
    path: "/recovery/cases/{caseId}/accounting-summary"
    description: "Computed read: recovery accounting totals for the case (contractor commission reconciliation)"
    roles: [RecoveryAccountant, RecoverySupervisor, SystemAdmin]
    code: 200
    input: []
    output: { total_recovered_cents: integer, total_commission_cents: integer, total_net_to_state_cents: integer, posting_count: integer }
    side_effects: []

  # --- Lien ---
  - method: POST
    path: "/recovery/cases/{caseId}/liens"
    description: "File the statutory lien (case ATTORNEY_NOTIFIED -> LIEN_FILED)"
    roles: [RecoverySpecialist]
    code: 201
    input: []
    output: Lien
    side_effects:
      - "lien_amount_cents = lien_perfected_amount (min of 250000 cap and included-claims sum); statutory_cap_cents snapshot"
      - "Creates LIEN_FILED_NOTICE (QUEUED) for the member"

  - method: GET
    path: "/recovery/liens/{lienId}"
    description: "Get a lien"
    roles: [SystemAdmin, RecoverySpecialist, RecoverySupervisor, RecoveryAccountant, EstateRecoveryOfficer]
    code: 200
    input: []
    output: Lien
    side_effects: []

  - method: GET
    path: "/recovery/liens"
    description: "List liens with filters"
    roles: [SystemAdmin, RecoverySpecialist, RecoverySupervisor, RecoveryAccountant, EstateRecoveryOfficer]
    code: 200
    input: ["case_id?", "status?"]
    output: "Lien[]"
    side_effects: []

  - method: POST
    path: "/recovery/liens/{lienId}/amend"
    description: "Amend the lien amount (OCC-guarded; blocked during negotiation freeze)"
    roles: [RecoverySpecialist]
    code: 200
    input: [new_amount_cents, expected_lien_version]
    output: Lien
    side_effects:
      - "lien_amount_cents = new_amount_cents; outstanding_cents recomputed; amended_count += 1"
      - "increments Lien.version by 1"

  - method: POST
    path: "/recovery/liens/{lienId}/release"
    description: "Release the lien (supervisor)"
    roles: [RecoverySupervisor]
    code: 200
    input: []
    output: Lien
    side_effects:
      - "Lien -> RELEASED"
      - "If case status == LIEN_FILED: case -> ATTORNEY_NOTIFIED; if SETTLEMENT_PENDING: unchanged"

  # --- Settlement ---
  - method: POST
    path: "/recovery/cases/{caseId}/settlements"
    description: "Open settlement negotiation (case LIEN_FILED -> SETTLEMENT_PENDING; OCC on case version)"
    roles: [RecoverySpecialist, RecoverySupervisor]
    code: 201
    input: [gross_amount_cents, attorney_fee_pct, litigation_costs_cents, offered_by, expected_case_version]
    output: Settlement
    side_effects:
      - "Settlement OFFERED round 1; settlement_recovery_amount computed"
      - "increments TplCase.version by 1"

  - method: GET
    path: "/recovery/settlements/{settlementId}"
    description: "Get a settlement"
    roles: [SystemAdmin, RecoverySpecialist, RecoverySupervisor, RecoveryAccountant, EstateRecoveryOfficer]
    code: 200
    input: []
    output: Settlement
    side_effects: []

  - method: GET
    path: "/recovery/settlements"
    description: "List settlements with filters"
    roles: [SystemAdmin, RecoverySpecialist, RecoverySupervisor, RecoveryAccountant, EstateRecoveryOfficer]
    code: 200
    input: ["case_id?", "status?"]
    output: "Settlement[]"
    side_effects: []

  - method: POST
    path: "/recovery/settlements/{settlementId}/counter"
    description: "Counter-offer: OFFERED -> COUNTERED -> OFFERED cycle, round_number += 1"
    roles: [RecoverySpecialist, RecoverySupervisor]
    code: 200
    input: [gross_amount_cents, attorney_fee_pct, litigation_costs_cents, offered_by]
    output: Settlement
    side_effects: ["offer fields replaced; settlement_recovery_amount recomputed"]

  - method: POST
    path: "/recovery/settlements/{settlementId}/accept"
    description: "Accept the settlement (supervisor; segregation of duties vs creator)"
    roles: [RecoverySupervisor]
    code: 200
    input: []
    output: Settlement
    side_effects:
      - "settlement_recovery_amount recomputed against CURRENT lien outstanding (derived-field reconciliation)"
      - "Creates SETTLEMENT_NOTICE (QUEUED)"

  - method: POST
    path: "/recovery/settlements/{settlementId}/reject"
    description: "Reject the settlement (terminal); case returns to LIEN_FILED"
    roles: [RecoverySupervisor]
    code: 200
    input: []
    output: Settlement
    side_effects: ["Case SETTLEMENT_PENDING -> LIEN_FILED"]

  # --- RecoveryPosting ---
  - method: POST
    path: "/recovery/settlements/{settlementId}/postings"
    description: "Record an insurer check against an ACCEPTED settlement (installments allowed)"
    roles: [RecoveryAccountant]
    code: 201
    input: [gross_recovery_cents, contractor_code]
    output: RecoveryPosting
    side_effects:
      - "RecoveryPosting PENDING; lien_id snapshot = case's active lien"
      - "ERR_POSTING_EXCEEDS_RECOVERY if cumulative non-REVERSED postings would exceed settlement.state_recovery_cents"

  - method: GET
    path: "/recovery/postings/{postingId}"
    description: "Get a recovery posting"
    roles: [SystemAdmin, RecoverySpecialist, RecoverySupervisor, RecoveryAccountant, EstateRecoveryOfficer]
    code: 200
    input: []
    output: RecoveryPosting
    side_effects: []

  - method: GET
    path: "/recovery/postings"
    description: "List recovery postings with filters"
    roles: [SystemAdmin, RecoverySpecialist, RecoverySupervisor, RecoveryAccountant, EstateRecoveryOfficer]
    code: 200
    input: ["settlement_id?", "lien_id?", "status?"]
    output: "RecoveryPosting[]"
    side_effects: []

  - method: POST
    path: "/recovery/postings/{postingId}/post"
    description: "Post the payment: computes commission, applies to lien, cascades satisfaction"
    roles: [RecoveryAccountant]
    code: 200
    input: []
    output: RecoveryPosting
    side_effects:
      - "commission_cents / net_to_state_cents computed via contractor_commission"
      - "Lien.outstanding_cents reduced; SATISFIED at exactly 0 -> TplCase RESOLVED -> CASE_RESOLUTION_NOTICE queued"
      - "Settlement ACCEPTED -> DISBURSED"

  - method: POST
    path: "/recovery/postings/{postingId}/reverse"
    description: "Reverse a posted payment (compensating action)"
    roles: [RecoveryAccountant]
    code: 200
    input: []
    output: RecoveryPosting
    side_effects:
      - "Lien.outstanding_cents restored; SATISFIED lien reverts to FILED; RESOLVED case reverts to SETTLEMENT_PENDING"
      - "Settlement DISBURSED -> ACCEPTED when no POSTED postings remain"

  # --- EstateCase ---
  - method: GET
    path: "/recovery/estate-cases/{estateCaseId}"
    description: "Get an estate case"
    roles: [SystemAdmin, RecoverySpecialist, RecoverySupervisor, RecoveryAccountant, EstateRecoveryOfficer]
    code: 200
    input: []
    output: EstateCase
    side_effects: []

  - method: GET
    path: "/recovery/estate-cases"
    description: "List estate cases with filters"
    roles: [SystemAdmin, RecoverySpecialist, RecoverySupervisor, RecoveryAccountant, EstateRecoveryOfficer]
    code: 200
    input: ["member_id?", "status?"]
    output: "EstateCase[]"
    side_effects: []

  - method: POST
    path: "/recovery/estate-cases/{estateCaseId}/file-claim"
    description: "File the probate estate claim (final estate_claim_amount; 365-day filing deadline)"
    roles: [EstateRecoveryOfficer]
    code: 200
    input: [probate_case_number, exempt_services_cents]
    output: EstateCase
    side_effects:
      - "claim_amount_cents = final estate_claim_amount; claim_outstanding_cents = claim_amount_cents"
      - "Creates ESTATE_CLAIM_NOTICE (QUEUED)"
      - "claim_amount_cents == 0 -> immediate PAID"

  - method: POST
    path: "/recovery/estate-cases/{estateCaseId}/record-payment"
    description: "Record an estate payment against the outstanding claim"
    roles: [RecoveryAccountant]
    code: 200
    input: [amount_cents]
    output: EstateCase
    side_effects:
      - "total_paid_cents += amount_cents; claim_outstanding_cents -= amount_cents"
      - "outstanding == 0 -> PAID"

  - method: POST
    path: "/recovery/estate-cases/{estateCaseId}/waivers"
    description: "Apply for a hardship waiver on the estate claim"
    roles: [EstateRecoveryOfficer, RecoverySupervisor]
    code: 201
    input: [waiver_type, household_income_annual_cents, homestead_value_cents, "requested_reduction_cents?"]
    output: HardshipWaiver
    side_effects: ["HardshipWaiver PENDING; ERR_WAIVER_PENDING_EXISTS if one already pending"]

  # --- HardshipWaiver ---
  - method: GET
    path: "/recovery/waivers/{waiverId}"
    description: "Get a hardship waiver"
    roles: [SystemAdmin, RecoverySpecialist, RecoverySupervisor, RecoveryAccountant, EstateRecoveryOfficer]
    code: 200
    input: []
    output: HardshipWaiver
    side_effects: []

  - method: GET
    path: "/recovery/waivers"
    description: "List hardship waivers with filters"
    roles: [SystemAdmin, RecoverySpecialist, RecoverySupervisor, RecoveryAccountant, EstateRecoveryOfficer]
    code: 200
    input: ["estate_case_id?", "status?"]
    output: "HardshipWaiver[]"
    side_effects: []

  - method: POST
    path: "/recovery/waivers/{waiverId}/approve"
    description: "Approve a hardship waiver (supervisor; SoD vs filer; FULL criteria gated)"
    roles: [RecoverySupervisor]
    code: 200
    input: []
    output: HardshipWaiver
    side_effects:
      - "decided_reduction_cents = hardship_reduction"
      - "EstateCase outstanding reduced; FULL -> WAIVED (+ ESTATE_DECISION_NOTICE); PARTIAL stays CLAIM_FILED unless outstanding 0 -> PAID"

  - method: POST
    path: "/recovery/waivers/{waiverId}/deny"
    description: "Deny a hardship waiver"
    roles: [RecoverySupervisor]
    code: 200
    input: []
    output: HardshipWaiver
    side_effects: ["Creates ESTATE_DECISION_NOTICE (QUEUED)"]

  - method: POST
    path: "/recovery/waivers/{waiverId}/appeal"
    description: "Appeal a denied waiver (DENIED -> PENDING; max 1 appeal)"
    roles: [EstateRecoveryOfficer]
    code: 200
    input: []
    output: HardshipWaiver
    side_effects: ["appeal_count += 1"]

  - method: POST
    path: "/recovery/waivers/{waiverId}/rescind"
    description: "Rescind an approved waiver (compensating action restoring the estate claim)"
    roles: [RecoverySupervisor]
    code: 200
    input: []
    output: HardshipWaiver
    side_effects: ["EstateCase.claim_outstanding_cents += decided_reduction_cents; WAIVED estate -> CLAIM_FILED"]

  # --- CommunicationNotice ---
  - method: GET
    path: "/recovery/notices/{noticeId}"
    description: "Get a member communication notice"
    roles: [SystemAdmin, RecoverySpecialist, RecoverySupervisor, RecoveryAccountant, EstateRecoveryOfficer]
    code: 200
    input: []
    output: CommunicationNotice
    side_effects: []

  - method: GET
    path: "/recovery/notices"
    description: "List member communication notices with filters"
    roles: [SystemAdmin, RecoverySpecialist, RecoverySupervisor, RecoveryAccountant, EstateRecoveryOfficer]
    code: 200
    input: ["member_id?", "case_id?", "estate_case_id?", "notice_type?", "status?"]
    output: "CommunicationNotice[]"
    side_effects: []

  - method: POST
    path: "/recovery/notices/{noticeId}/send"
    description: "Send (or retry) a queued/failed notice; records lateness vs due_date"
    roles: [RecoverySpecialist]
    code: 200
    input: [delivery_outcome]
    output: CommunicationNotice
    side_effects: ["status per delivery_outcome; sent_at set; is_late = sent calendar date > due_date"]

  # --- Test-driving clock ---
  - method: POST
    path: "/recovery/_clock/set_current_utc"
    description: "Set the server logical clock (test-driving endpoint). Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Logical clock advanced; expiry/lateness rules are evaluated lazily on subsequent writes"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role is valid but not listed in the endpoint's roles" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required body field missing, invalid enum, non-positive amount where > 0 required, or attorney_fee_pct outside (0,1)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id does not exist" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Actor X-User-ID equals created_by_user_id of the settlement being accepted or the waiver being approved" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Target entity status does not permit the requested transition (generic state precondition)" }
  - { id: ERR_ATTORNEY_NOT_NOTIFIED, http: 409, condition: "Lien filing attempted while case status is IDENTIFIED (attorney notification not yet recorded)" }
  - { id: ERR_LIEN_NOT_AMENDABLE, http: 409, condition: "Lien amend attempted on a lien in SATISFIED, RELEASED, or EXPIRED status" }
  - { id: ERR_LIEN_NOT_ACTIVE, http: 409, condition: "Settlement accept attempted while no lien on the case is FILED or AMENDED" }
  - { id: ERR_CLAIM_NOT_FILED, http: 409, condition: "Waiver create or record-payment attempted on an estate case not in CLAIM_FILED status" }
  - { id: ERR_SOL_EXPIRED, http: 409, condition: "Current calendar date > case.sol_date on settlement create/accept, lien amend, or posting post; fires lazy SOL expiry (case -> SOL_EXPIRED, open lien -> EXPIRED, open settlements -> REJECTED)" }
  - { id: ERR_NEGOTIATION_FREEZE, http: 409, condition: "Lien amend within the closed 14-day freeze window after the latest negotiation activity of an OFFERED/COUNTERED settlement on the case" }
  - { id: ERR_ESTATE_FILING_LATE, http: 409, condition: "file-claim attempted after date_of_death + 365 days; estate case transitions to TIME_BARRED" }
  - { id: ERR_DUPLICATE_EPISODE_CASE, http: 409, condition: "New case injury_date falls inside [existing.injury_date, existing.injury_date + 90 days) of a non-terminal case of the same member (half-open)" }
  - { id: ERR_LIEN_ALREADY_EXISTS, http: 409, condition: "A lien with status FILED or AMENDED already exists for the case" }
  - { id: ERR_NEGOTIATION_IN_PROGRESS, http: 409, condition: "A settlement with status OFFERED or COUNTERED already exists for the case" }
  - { id: ERR_ESTATE_CASE_EXISTS, http: 409, condition: "mark-deceased attempted when an EstateCase already exists for the member" }
  - { id: ERR_WAIVER_PENDING_EXISTS, http: 409, condition: "A hardship waiver with status PENDING already exists for the estate case" }
  - { id: ERR_APPEAL_LIMIT_REACHED, http: 409, condition: "Appeal attempted when appeal_count >= 1" }
  - { id: ERR_HARDSHIP_CRITERIA_NOT_MET, http: 409, condition: "FULL waiver approval with homestead_value_cents > 5000000 or household_income_annual_cents > 3000000" }
  - { id: ERR_LIEN_EXCEEDS_CAP, http: 409, condition: "Amended lien amount exceeds the lien's statutory_cap_cents snapshot" }
  - { id: ERR_PAYMENT_EXCEEDS_OUTSTANDING, http: 409, condition: "Estate record-payment amount_cents > claim_outstanding_cents" }
  - { id: ERR_POSTING_EXCEEDS_RECOVERY, http: 409, condition: "Cumulative non-REVERSED postings on the settlement would exceed settlement.state_recovery_cents" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC mismatch: expected_lien_version / expected_case_version does not match the entity's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Recovery-unit system administrator: registers members and operates the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /recovery/members"
      - "POST /recovery/_clock/set_current_utc"
    shared_operations:
      - "GET read endpoints (all entities)"
      - "GET /recovery/cases/{caseId}/accounting-summary"

  - name: RecoverySpecialist
    description: "TPL caseworker: identifies cases, records attorney notification and litigation, files and amends liens, negotiates settlements, sends member notices"
    identity: opaque
    exclusive_operations:
      - "POST /recovery/cases"
      - "POST /recovery/cases/{caseId}/notify-attorney"
      - "POST /recovery/cases/{caseId}/expense-claims"
      - "POST /recovery/cases/{caseId}/litigation"
      - "POST /recovery/cases/{caseId}/liens"
      - "POST /recovery/liens/{lienId}/amend"
      - "POST /recovery/notices/{noticeId}/send"
    shared_operations:
      - "POST /recovery/cases/{caseId}/close (with RecoverySupervisor)"
      - "POST /recovery/cases/{caseId}/settlements (with RecoverySupervisor)"
      - "POST /recovery/settlements/{settlementId}/counter (with RecoverySupervisor)"
      - "GET read endpoints (all entities)"

  - name: RecoverySupervisor
    description: "Supervisor: accepts/rejects settlements, releases liens, decides hardship waivers; segregation of duties bars acting on own-created records"
    identity: opaque
    exclusive_operations:
      - "POST /recovery/settlements/{settlementId}/accept"
      - "POST /recovery/settlements/{settlementId}/reject"
      - "POST /recovery/liens/{lienId}/release"
      - "POST /recovery/waivers/{waiverId}/approve"
      - "POST /recovery/waivers/{waiverId}/deny"
      - "POST /recovery/waivers/{waiverId}/rescind"
    shared_operations:
      - "POST /recovery/cases/{caseId}/close (with RecoverySpecialist)"
      - "POST /recovery/cases/{caseId}/settlements (with RecoverySpecialist)"
      - "POST /recovery/settlements/{settlementId}/counter (with RecoverySpecialist)"
      - "POST /recovery/estate-cases/{estateCaseId}/waivers (with EstateRecoveryOfficer)"
      - "GET /recovery/cases/{caseId}/accounting-summary"
      - "GET read endpoints (all entities)"

  - name: RecoveryAccountant
    description: "Recovery accountant: records insurer checks, posts and reverses recovery postings, records estate payments, reconciles commission summaries"
    identity: opaque
    exclusive_operations:
      - "POST /recovery/settlements/{settlementId}/postings"
      - "POST /recovery/postings/{postingId}/post"
      - "POST /recovery/postings/{postingId}/reverse"
      - "POST /recovery/estate-cases/{estateCaseId}/record-payment"
    shared_operations:
      - "GET /recovery/cases/{caseId}/accounting-summary"
      - "GET read endpoints (all entities)"

  - name: EstateRecoveryOfficer
    description: "Estate recovery officer: records member death, files probate claims, files and appeals hardship waivers"
    identity: opaque
    exclusive_operations:
      - "POST /recovery/members/{memberId}/mark-deceased"
      - "POST /recovery/estate-cases/{estateCaseId}/file-claim"
      - "POST /recovery/waivers/{waiverId}/appeal"
    shared_operations:
      - "POST /recovery/estate-cases/{estateCaseId}/waivers (with RecoverySupervisor)"
      - "GET read endpoints (all entities)"
