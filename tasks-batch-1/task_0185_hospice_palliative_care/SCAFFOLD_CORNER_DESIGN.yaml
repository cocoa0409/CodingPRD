      - name: valid_coverage_item_passes
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority=10]
          - entities.CoverageItem.fields.coverage_status
          - endpoints["POST /hospice/coverage-items"]
        distinguishing_aspect: "A terminal-dx-related MEDICATION under an ACTIVE plan is adjudicated coverage_status=COVERED (201)."
        test_recipe:
          setup:
            - "Election elected 2026-01-01 with an ACTIVE CarePlan."
