      - name: corner_certificate_tier_gate_and_uniqueness
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "validations[priority=9]", "errors[ERR_CONTRACT_TIER_INELIGIBLE]", "errors[ERR_CERTIFICATE_EXISTS]"]
