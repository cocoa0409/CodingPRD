        distinguishing_aspect: "Immediate consistency: the respond response itself carries sla_breached/credit_granted_cents, and a subsequent read of the family shows the credit already posted — no reconciliation lag."
        test_recipe:
          setup: ["case ACTIVE_SUPPORT; child INFANT; BASIC package ACTIVE; message sent at clock 2026-08-05; clock now 2026-08-10 (120h > 48h SLA)"]
          setup_api_calls:
