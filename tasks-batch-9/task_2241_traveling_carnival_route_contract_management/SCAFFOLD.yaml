scenario: "2241. Traveling Carnival Route & Contract Management (traveling amusement company): route planning across fair and community event contracts with travel time and setup windows, contract terms with revenue splits, guarantees, ride minimums and exclusivity provisions, ride inventory allocation by lot size, power availability and expected attendance, permit and inspection scheduling in each jurisdiction with variable state requirements, workforce management including seasonal labor, housing on the lot and visa program compliance, setup and teardown scheduling with crew assignments and equipment transport permits, ticket and wristband systems with revenue reconciliation per lot, weather closures, refund policy and make-good arrangements with sponsors"
domain_name: "traveling-carnival-route-ops"
api_prefix: ""

complexity_profile:
  difficulty_level: expert_plus          # above §0.4 Expert band: 15 entities, 60 endpoints, 67 errors, 9 calculations, 10 state machines, 51 validations
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by explicit foreign keys in request bodies; URL paths are
  # top-level collections (/route-stops, /contracts, /ride-allocations, …) plus
  # read-only sub-resource lists. No creation endpoint nests a child under a parent
  # path, and RouteStop.previous_stop_id makes the stop table a self-referential chain.

  state_machine_shape: cyclic
  # Contract negotiation rounds (SENT -> COUNTERED -> SENT), inspection re-attempts
  # (SCHEDULED -> FAILED -> SCHEDULED), allocation inspection holds
  # (COMMITTED -> INSPECTION_HELD -> COMMITTED) and settlement disputes
  # (PROVISIONAL -> DISPUTED -> PROVISIONAL) are all true loops. RideAllocation and
  # InspectionOrder additionally branch (fork with divergent side-effect sets), and
  # Route/RouteStop are compound (parent state derived from children).

  relationship_patterns:
    - one_to_many          # Route -> RouteStop, RouteStop -> CrewAssignment/TicketSale/PermitApplication
    - many_to_many         # Ride <-> RouteStop via RideAllocation
    - self_referential     # RouteStop.previous_stop_id -> RouteStop.id (haul chain)
    - cross_aggregate      # Settlement (revenue aggregate) reads Jurisdiction tax + WeatherClosure abatement
    - polymorphic_free     # no polymorphic FKs: every FK names exactly one parent entity

  role_model: segregation_of_duties
  # The negotiator who sends a contract may not execute it; the officer who schedules
  # an inspection may not record its result; the auditor who builds a provisional
  # settlement may not finalize it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - name: state_code
        type: string
        source: input
        description: "Two-letter state code; unique across all Jurisdiction rows"
        constraints: "^[A-Z]{2}$; unique"
      - name: name
        type: string
        source: input
        description: "Human-readable jurisdiction name"
      - name: permit_lead_days
        type: integer
        source: input
        description: "Minimum whole days that must separate permit submission from the stop's open_date"
        constraints: ">= 0"
      - name: requires_state_ride_inspection
        type: boolean
        source: input
        description: "When true, every committed allocation of a ride with requires_state_inspection=true needs a PASSED InspectionOrder with authority=STATE before gates open"
        default: false
      - name: inspection_slot_capacity_per_day
        type: integer
        source: input
        description: "Maximum InspectionOrder rows this jurisdiction accepts per calendar day (half-open UTC day bucket)"
        default: 2
        constraints: ">= 1"
      - name: amusement_tax_pct
        type: number
        source: input
        description: "Percentage of ticket gross remitted to the jurisdiction; applied per sales channel"
        constraints: "0 <= x <= 25, at most 2 decimals"
      - name: max_consecutive_work_days
        type: integer
        source: input
        description: "Maximum consecutive calendar days a single Worker may be scheduled inside this jurisdiction"
        default: 6
        constraints: ">= 1"
      - name: housing_permit_required
        type: boolean
        source: input
        description: "When true, a HOUSING PermitApplication must be APPROVED before any Worker with housing_required=true may be assigned at a stop in this jurisdiction"
        default: false
      - name: permit_fee_cents
        type: integer
        source: input
        description: "Base filing fee charged for every PermitApplication in this jurisdiction"
        constraints: ">= 0"

  - name: Venue
    parent: null
    common_fields: true
    fields:
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; the state whose permit and inspection rules govern this lot"
      - name: name
        type: string
        source: input
        description: "Lot / fairground name"
      - name: city
        type: string
        source: input
        description: "City of the lot"
      - name: lot_area_sqft
        type: integer
        source: input
        description: "Gross lot area in square feet"
        constraints: "> 0"
      - name: power_amps_available
        type: integer
        source: input
        description: "Total service amperage the lot can deliver"
        constraints: "> 0"
      - name: expected_attendance
        type: integer
        source: input
        description: "Fair-authority attendance projection for the full run"
        constraints: ">= 0"
      - name: housing_pads_available
        type: integer
        source: input
        description: "Number of on-lot bunkhouse pads; caps concurrently assigned workers with housing_required=true"
        default: 0
        constraints: ">= 0"
      - name: lot_surface
        type: enum
        source: input
        description: "Ground surface, feeding the setup-hours multiplier"
        constraints: "PAVED | GRAVEL | GRASS"

  - name: Route
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Route/season label"
      - name: season_year
        type: integer
        source: input
        description: "Calendar year the route runs"
        constraints: "2020 <= x <= 2100"
      - name: home_base_state
        type: string
        source: input
        description: "State the units winter in; informational"
      - name: status
        type: enum
        source: system
        description: "Route lifecycle; see §1.2 Route state machine"
        default: DRAFT
        constraints: "DRAFT | SEQUENCED | COMMITTED | IN_PROGRESS | CLOSED"
      - name: stop_count
        type: integer
        source: computed
        description: "Count of RouteStop rows with route_id = this Route and status != DARK"
        default: 0
      - name: total_haul_miles
        type: integer
        source: computed
        description: "Sum of haul_miles_from_previous over RouteStop rows with status != DARK"
        default: 0
      - name: total_travel_hours
        type: number
        source: computed
        description: "Sum of travel_hours_from_previous over RouteStop rows with status != DARK; produced by calculations.route_travel_feasibility"
        default: 0
      - name: total_guaranteed_cents
        type: integer
        source: computed
        description: "Sum of Contract.guarantee_cents over contracts whose route_stop_id belongs to this Route and whose status = EXECUTED (conserved quantity of compensating_invariant guarantee_ledger)"
        default: 0
      - name: closed_stop_count
        type: integer
        source: computed
        description: "Count of RouteStop rows for this Route with status IN {CLOSED, DARK}"
        default: 0

  - name: RouteStop
    parent: null
    common_fields: true
    fields:
      - name: route_id
        type: string
        source: input
        description: "FK -> Route.id; owning route"
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id; the lot being played"
      - name: previous_stop_id
        type: string
        source: input
        description: "FK -> RouteStop.id; the stop the units haul from. null for the first stop of the route; must belong to the same route_id and must not create a cycle"
        default: null
      - name: sequence_index
        type: integer
        source: computed
        description: "Position in the haul chain: 0 for the stop with previous_stop_id = null, then +1 per link walked forward. Recomputed by calculations.route_travel_feasibility"
        default: 0
      - name: haul_miles_from_previous
        type: integer
        source: input
        description: "Road miles from the previous stop's lot to this lot; 0 for the first stop"
        default: 0
        constraints: ">= 0"
      - name: travel_hours_from_previous
        type: number
        source: computed
        description: "Driving + mandated-rest hours produced by calculations.route_travel_feasibility"
        default: 0
      - name: load_in_start
        type: datetime
        source: input
        description: "ISO 8601 UTC instant crews may first enter the lot"
      - name: open_date
        type: datetime
        source: input
        description: "ISO 8601 UTC instant gates open to the public"
      - name: close_date
        type: datetime
        source: input
        description: "ISO 8601 UTC instant of the final operating hour"
      - name: teardown_deadline
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the lot must be clear"
      - name: operating_days
        type: integer
        source: computed
        description: "ceil((close_date - open_date) / 24h), minimum 1"
        default: 1
      - name: scheduled_operating_hours
        type: number
        source: computed
        description: "operating_days * DAILY_OPERATING_HOURS; denominator of weather abatement"
        default: 8
      - name: status
        type: enum
        source: system
        description: "Stop lifecycle; see §1.2 RouteStop state machine"
        default: PLANNED
        constraints: "PLANNED | CONFIRMED | SETUP | OPEN | TEARDOWN | CLOSED | DARK"
      - name: allocated_sqft_used
        type: integer
        source: computed
        description: "Sum of RideAllocation.footprint_charged_sqft over allocations of this stop with status IN {RESERVED, COMMITTED, INSPECTION_HELD, OPERATING} (conserved quantity of compensating_invariant lot_footprint_ledger)"
        default: 0
      - name: power_amps_used
        type: number
        source: computed
        description: "Sum of RideAllocation.power_charged_amps over allocations of this stop with status IN {RESERVED, COMMITTED, INSPECTION_HELD, OPERATING}"
        default: 0
      - name: operating_ride_count
        type: integer
        source: computed
        description: "Count of RideAllocation rows of this stop with status IN {OPERATING, STRUCK}"
        default: 0
      - name: labor_cost_provisional_cents
        type: integer
        source: computed
        description: "Sum of CrewAssignment.cost_cents over assignments of this stop with status IN {SCHEDULED, COMPLETED}; produced by calculations.stop_labor_cost (conserved quantity of compensating_invariant labor_hours_ledger)"
        default: 0
      - name: closure_hours_adjudicated
        type: number
        source: computed
        description: "Merged, clipped closure hours over WeatherClosure rows of this stop with status = ADJUDICATED; produced by calculations.weather_abatement_hours"
        default: 0
      - name: compliance_posture
        type: enum
        source: computed
        description: "Derived gate over this stop's children, produced by calculations.stop_compliance_posture; CLEAR means gates may open"
        default: PERMIT_HOLD
        constraints: "CLEAR | PERMIT_HOLD | INSPECTION_HOLD | LABOR_HOLD"

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - name: route_stop_id
        type: string
        source: input
        description: "FK -> RouteStop.id; the stop this deal covers. At most one Contract per stop with status IN {DRAFT, SENT, COUNTERED, EXECUTED}"
      - name: counterparty_name
        type: string
        source: input
        description: "Fair authority / community event committee name"
      - name: sponsor_name
        type: string
        source: input
        description: "Presenting sponsor entitled to make-good arrangements; null when the deal has no sponsor"
        default: null
      - name: revenue_split_pct_operator
        type: number
        source: input
        description: "Base operator share of taxable ticket net, in percent"
        constraints: "20 <= x <= 70, at most 2 decimals"
      - name: guarantee_cents
        type: integer
        source: input
        description: "Minimum amount owed to the operator under settlement_basis=GREATER_OF"
        default: 0
        constraints: ">= 0"
      - name: ride_minimum_count
        type: integer
        source: input
        description: "Number of rides the operator promised to open; shortfall drives the settlement penalty and the open-gates gate"
        default: 0
        constraints: ">= 0"
      - name: exclusivity
        type: enum
        source: input
        description: "Exclusivity provision granted to the operator; RIDES and FULL forbid a second executed contract on the same Venue whose operating window overlaps"
        default: NONE
        constraints: "NONE | RIDES | FOOD | FULL"
      - name: settlement_basis
        type: enum
        source: input
        description: "GREATER_OF pays max(split net of penalty, effective guarantee); SPLIT_ONLY pays the split net of penalty with no guarantee floor"
        default: GREATER_OF
        constraints: "GREATER_OF | SPLIT_ONLY"
      - name: negotiation_round
        type: integer
        source: system
        description: "Increments by 1 on every COUNTERED transition; VOIDs the contract past MAX_NEGOTIATION_ROUNDS (= 2)"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Contract lifecycle; see §1.2 Contract state machine"
        default: DRAFT
        constraints: "DRAFT | SENT | COUNTERED | EXECUTED | VOID | TERMINATED"
      - name: last_sent_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ContractNegotiator whose send produced the current SENT state; the execute endpoint refuses this same user (segregation of duties)"
        default: null
      - name: executed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the EXECUTED transition"
        default: null

  - name: Ride
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Ride name"
      - name: ride_class
        type: enum
        source: input
        description: "Drives spacing multiplier, power surge factor and operator certification requirement"
        constraints: "MAJOR | FLAT | KIDDIE"
      - name: footprint_sqft
        type: integer
        source: input
        description: "Bare footprint of the ride, before spacing multiplier"
        constraints: "> 0"
      - name: power_amps
        type: integer
        source: input
        description: "Steady-state amperage draw, before startup surge"
        constraints: "> 0"
      - name: crew_size_setup
        type: integer
        source: input
        description: "Workers needed to erect the ride"
        constraints: ">= 1"
      - name: setup_hours
        type: number
        source: input
        description: "Base erection hours on a PAVED lot"
        constraints: "> 0"
      - name: axle_count
        type: integer
        source: input
        description: "Trailer axles; drives the TRANSPORT permit surcharge"
        constraints: ">= 1"
      - name: requires_state_inspection
        type: boolean
        source: input
        description: "When true, the ride needs a PASSED InspectionOrder at every stop in a jurisdiction with requires_state_ride_inspection=true"
        default: true
      - name: status
        type: enum
        source: system
        description: "Inventory posture; ASSIGNED while a non-terminal allocation holds it, OUT_OF_SERVICE after a failed inspection with defects at or above OUT_OF_SERVICE_DEFECT_THRESHOLD (= 3)"
        default: AVAILABLE
        constraints: "AVAILABLE | ASSIGNED | OUT_OF_SERVICE"

  - name: RideAllocation
    parent: null
    common_fields: true
    fields:
      - name: ride_id
        type: string
        source: input
        description: "FK -> Ride.id; the allocated unit"
      - name: route_stop_id
        type: string
        source: input
        description: "FK -> RouteStop.id; the stop the unit plays"
      - name: status
        type: enum
        source: system
        description: "Allocation lifecycle; see §1.2 RideAllocation state machine"
        default: RESERVED
        constraints: "RESERVED | COMMITTED | INSPECTION_HELD | OPERATING | STRUCK | RELEASED"
      - name: footprint_charged_sqft
        type: integer
        source: computed
        description: "ceil(Ride.footprint_sqft * SPACING_MULTIPLIER[ride_class]); produced by calculations.lot_capacity_charge"
      - name: power_charged_amps
        type: number
        source: computed
        description: "Ride.power_amps * (1 + STARTUP_SURGE_PCT[ride_class]/100), rounded half-up to 1 decimal; produced by calculations.lot_capacity_charge"
      - name: occupation_start
        type: datetime
        source: computed
        description: "Copied from RouteStop.load_in_start at creation; left edge of the ride's occupation interval"
      - name: occupation_end
        type: datetime
        source: computed
        description: "Copied from RouteStop.teardown_deadline at creation; right edge of the ride's occupation interval"
      - name: released_at
        type: datetime
        source: system
        description: "Logical-clock instant of the RELEASED transition"
        default: null

  - name: PermitApplication
    parent: null
    common_fields: true
    fields:
      - name: route_stop_id
        type: string
        source: input
        description: "FK -> RouteStop.id; the stop the permit covers"
      - name: permit_type
        type: enum
        source: input
        description: "EVENT gates open-gates, TRANSPORT gates begin-setup, ELECTRICAL is informational, HOUSING gates crew with housing_required=true"
        constraints: "EVENT | TRANSPORT | ELECTRICAL | HOUSING"
      - name: valid_from
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the permit becomes effective"
      - name: valid_until
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the permit lapses; must be > valid_from"
      - name: axles_declared
        type: integer
        source: input
        description: "Total trailer axles declared on a TRANSPORT permit; 0 for other permit types"
        default: 0
        constraints: ">= 0"
      - name: fee_cents
        type: integer
        source: computed
        description: "Jurisdiction.permit_fee_cents + (axles_declared * TRANSPORT_AXLE_SURCHARGE_CENTS (= 1500) when permit_type = TRANSPORT else 0); computed at creation"
      - name: status
        type: enum
        source: system
        description: "Permit lifecycle; see §1.2 PermitApplication state machine"
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | APPROVED | DENIED | EXPIRED"
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the SUBMITTED transition"
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: "Logical-clock instant of the APPROVED/DENIED transition"
        default: null
      - name: denial_reason
        type: string
        source: system
        description: "Free text carried from the JurisdictionOfficer decision when status = DENIED"
        default: null

  - name: InspectionOrder
    parent: null
    common_fields: true
    fields:
      - name: ride_allocation_id
        type: string
        source: input
        description: "FK -> RideAllocation.id; the allocation whose unit is inspected"
      - name: authority
        type: enum
        source: input
        description: "STATE inspections satisfy Jurisdiction.requires_state_ride_inspection; THIRD_PARTY inspections do not"
        constraints: "STATE | THIRD_PARTY"
      - name: scheduled_date
        type: datetime
        source: input
        description: "ISO 8601 UTC instant of the inspection; its half-open UTC day bucket consumes one Jurisdiction.inspection_slot_capacity_per_day slot"
      - name: status
        type: enum
        source: system
        description: "Inspection lifecycle; see §1.2 InspectionOrder state machine"
        default: SCHEDULED
        constraints: "SCHEDULED | PASSED | FAILED"
      - name: attempt_number
        type: integer
        source: computed
        description: "1 + count of InspectionOrder rows on the same ride_allocation_id with status = FAILED at creation time"
        default: 1
      - name: defect_count
        type: integer
        source: system
        description: "Defects recorded by the JurisdictionOfficer result call; 0 on a pass"
        default: 0
      - name: result_recorded_at
        type: datetime
        source: system
        description: "Logical-clock instant of the PASSED/FAILED transition"
        default: null

  - name: Worker
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Worker name"
      - name: employment_type
        type: enum
        source: input
        description: "H2B_VISA workers carry visa_expires_on and are subject to the visa gate"
        constraints: "PERMANENT | SEASONAL_DOMESTIC | H2B_VISA"
      - name: visa_expires_on
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the H-2B authorization lapses; required when employment_type = H2B_VISA, must be null otherwise"
        default: null
      - name: hourly_rate_cents
        type: integer
        source: input
        description: "Straight-time rate used by calculations.stop_labor_cost"
        constraints: "> 0"
      - name: certified_ride_classes
        type: array
        source: input
        description: "Subset of {MAJOR, FLAT, KIDDIE} the worker may operate; RIDE_OPERATOR assignments require the stop to hold at least one operating class the worker is certified for"
        default: []
      - name: housing_required
        type: boolean
        source: input
        description: "When true, each concurrent assignment consumes one Venue.housing_pads_available pad and needs a HOUSING permit in jurisdictions requiring one"
        default: false
      - name: scheduled_hours_total
        type: number
        source: computed
        description: "Sum of CrewAssignment.shift_hours over this worker's assignments with status IN {SCHEDULED, COMPLETED} (conserved quantity of compensating_invariant labor_hours_ledger)"
        default: 0
      - name: worked_days_count
        type: integer
        source: computed
        description: "Count of distinct UTC calendar dates covered by this worker's assignments with status = COMPLETED"
        default: 0
      - name: compliance_status
        type: enum
        source: computed
        description: "Derived from visa_expires_on against the logical clock; produced by calculations.worker_duty_exposure"
        default: CLEAR
        constraints: "CLEAR | VISA_EXPIRING | VISA_LAPSED"

  - name: CrewAssignment
    parent: null
    common_fields: true
    fields:
      - name: route_stop_id
        type: string
        source: input
        description: "FK -> RouteStop.id; the stop worked"
      - name: worker_id
        type: string
        source: input
        description: "FK -> Worker.id; the assigned worker"
      - name: crew_role
        type: enum
        source: input
        description: "SETUP and TEARDOWN shifts may fall outside the operating window; RIDE_OPERATOR requires certification; TICKETING has no certification requirement"
        constraints: "SETUP | RIDE_OPERATOR | TEARDOWN | TICKETING"
      - name: shift_start
        type: datetime
        source: input
        description: "ISO 8601 UTC shift start; half-open interval [shift_start, shift_end)"
      - name: shift_end
        type: datetime
        source: input
        description: "ISO 8601 UTC shift end; must be > shift_start"
      - name: shift_hours
        type: number
        source: computed
        description: "(shift_end - shift_start) in hours, rounded half-up to 2 decimals"
      - name: cost_cents
        type: integer
        source: computed
        description: "Per-assignment labor cost produced by calculations.stop_labor_cost"
      - name: housing_pad_assigned
        type: boolean
        source: computed
        description: "True when Worker.housing_required is true; such assignments consume a Venue pad for the stop's whole load-in-to-teardown window"
        default: false
      - name: status
        type: enum
        source: system
        description: "Assignment lifecycle; see §1.2 CrewAssignment state machine"
        default: SCHEDULED
        constraints: "SCHEDULED | COMPLETED | RELEASED"

  - name: TicketSale
    parent: null
    common_fields: false
    fields:
      - name: route_stop_id
        type: string
        source: input
        description: "FK -> RouteStop.id; the lot the sale belongs to"
      - name: channel
        type: enum
        source: input
        description: "WRISTBAND, SINGLE and PRESALE enter gross; COMP is attendance-only and contributes zero gross"
        constraints: "WRISTBAND | SINGLE | PRESALE | COMP"
      - name: units
        type: integer
        source: input
        description: "Units sold in this batch"
        constraints: "> 0"
      - name: unit_price_cents
        type: integer
        source: input
        description: "Price per unit in cents; must be 0 when channel = COMP and > 0 otherwise"
        constraints: ">= 0"
      - name: gross_cents
        type: integer
        source: computed
        description: "units * unit_price_cents"
      - name: business_date
        type: datetime
        source: input
        description: "ISO 8601 UTC operating date the batch is booked to; must fall inside [open_date, close_date] of the stop"

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; the deal being reconciled"
      - name: variant
        type: enum
        source: system
        description: "PROVISIONAL while the run is open, FINAL after finalize recomputes with the FINAL variant of calculations.stop_settlement"
        default: PROVISIONAL
        constraints: "PROVISIONAL | FINAL"
      - name: status
        type: enum
        source: system
        description: "Settlement lifecycle; see §1.2 Settlement state machine"
        default: PROVISIONAL
        constraints: "PROVISIONAL | DISPUTED | FINAL | SUPERSEDED"
      - name: gross_cents
        type: integer
        source: computed
        description: "Total ticket gross entering this settlement; produced by calculations.stop_settlement step 1"
      - name: tax_cents
        type: integer
        source: computed
        description: "Amusement tax, rounded per channel then summed; produced by calculations.stop_settlement step 2"
      - name: taxable_net_cents
        type: integer
        source: computed
        description: "gross_cents - tax_cents; produced by calculations.stop_settlement step 3"
      - name: effective_operator_pct
        type: number
        source: computed
        description: "Contract.revenue_split_pct_operator plus the volume tier bonus, capped at MAX_OPERATOR_PCT; produced by calculations.stop_settlement step 4"
      - name: split_share_cents
        type: integer
        source: computed
        description: "Operator share of taxable_net_cents at effective_operator_pct; produced by calculations.stop_settlement step 5"
      - name: shortfall_penalty_cents
        type: integer
        source: computed
        description: "Ride-minimum penalty, capped at SHORTFALL_CAP_PCT of split_share_cents; produced by calculations.stop_settlement step 6"
      - name: guarantee_effective_cents
        type: integer
        source: computed
        description: "Guarantee after weather abatement (FINAL variant) or after pro-rating by elapsed operating days (PROVISIONAL variant); produced by calculations.stop_settlement step 7"
      - name: makegood_deduction_cents
        type: integer
        source: computed
        description: "Sum of MakeGoodArrangement.amount_cents for this contract with kind = CASH_REFUND and status = ACCEPTED; always 0 in the PROVISIONAL variant"
        default: 0
      - name: settlement_due_cents
        type: integer
        source: computed
        description: "Amount owed to the operator; produced by calculations.stop_settlement step 8"
      - name: dispute_reason
        type: string
        source: system
        description: "Free text carried from the dispute call when status = DISPUTED"
        default: null
      - name: finalized_at
        type: datetime
        source: system
        description: "Logical-clock instant of the FINAL transition"
        default: null

  - name: WeatherClosure
    parent: null
    common_fields: true
    fields:
      - name: route_stop_id
        type: string
        source: input
        description: "FK -> RouteStop.id; the lot that went down"
      - name: cause
        type: enum
        source: input
        description: "Closure cause; LIGHTNING and WIND are refund-eligible, RAIN and HEAT are make-good-eligible only"
        constraints: "WIND | RAIN | LIGHTNING | HEAT"
      - name: closed_from
        type: datetime
        source: input
        description: "ISO 8601 UTC start of the closure; half-open interval [closed_from, closed_to)"
      - name: closed_to
        type: datetime
        source: input
        description: "ISO 8601 UTC end of the closure; must be > closed_from"
      - name: closure_hours_raw
        type: number
        source: computed
        description: "(closed_to - closed_from) in hours, rounded half-up to 2 decimals, before clipping or merging"
      - name: abated_hours
        type: number
        source: computed
        description: "This row's contribution to RouteStop.closure_hours_adjudicated after clipping to daily operating windows and merging with other ADJUDICATED closures; produced by calculations.weather_abatement_hours"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Closure lifecycle; see §1.2 WeatherClosure state machine"
        default: LOGGED
        constraints: "LOGGED | ADJUDICATED"

  - name: MakeGoodArrangement
    parent: null
    common_fields: true
    fields:
      - name: weather_closure_id
        type: string
        source: input
        description: "FK -> WeatherClosure.id; the adjudicated closure the make-good compensates"
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; the deal whose sponsor is being made whole; must reference the same stop as the closure"
      - name: kind
        type: enum
        source: input
        description: "CASH_REFUND deducts from the FINAL settlement; SPONSOR_CREDIT is booked against next season; BONUS_DAY is in-kind and carries amount_cents = 0"
        constraints: "CASH_REFUND | SPONSOR_CREDIT | BONUS_DAY"
      - name: amount_cents
        type: integer
        source: computed
        description: "Produced by calculations.makegood_amount from the closure's abated hours and the kind multiplier, capped at MAKEGOOD_CAP_PCT of Contract.guarantee_cents"
      - name: status
        type: enum
        source: system
        description: "Make-good lifecycle; see §1.2 MakeGoodArrangement state machine"
        default: PROPOSED
        constraints: "PROPOSED | ACCEPTED | DECLINED"
      - name: responded_at
        type: datetime
        source: system
        description: "Logical-clock instant of the ACCEPTED/DECLINED transition"
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Route
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: SEQUENCED
        trigger: "POST /routes/{id}/sequence"
        actor: RouteManager
        preconditions:
          - "route.status == DRAFT"
          - "count of RouteStop rows with route_id = route.id and status != DARK >= 1, else ERR_ROUTE_HAS_NO_STOPS"
          - "exactly one non-DARK stop has previous_stop_id == null, else ERR_STOP_CHAIN_INVALID"
          - "every non-DARK stop is reachable by walking the previous_stop_id chain forward from that head, no stop is the previous_stop_id of two stops, and no cycle exists, else ERR_STOP_CHAIN_INVALID"
          - "for every chain link i >= 1: (stop[i].load_in_start - stop[i-1].teardown_deadline) in hours >= stop[i].travel_hours_from_previous + LOAD_OUT_BUFFER_HOURS, else ERR_INSUFFICIENT_TRAVEL_WINDOW"
        side_effects:
          - "runs calculations.route_travel_feasibility: writes RouteStop.sequence_index and RouteStop.travel_hours_from_previous on every non-DARK stop of the route"
          - "recomputes Route.stop_count, Route.total_haul_miles, Route.total_travel_hours"
          - "increments Route.version by 1 and refreshes Route.updated_at"
      - from: SEQUENCED
        to: COMMITTED
        trigger: "POST /routes/{id}/commit"
        actor: RouteManager | GeneralManager
        preconditions:
          - "route.status == SEQUENCED"
          - "every non-DARK stop of the route has at least one Contract row with status IN {DRAFT, SENT, COUNTERED, EXECUTED}, else ERR_STOP_NOT_CONTRACTED"
        side_effects:
          - "increments Route.version by 1"
      - from: SEQUENCED
        to: DRAFT
        trigger: "system: POST /route-stops adds a stop to a SEQUENCED route, or POST /route-stops/{id}/cancel darkens a stop of a SEQUENCED route"
        actor: system
        preconditions:
          - "route.status == SEQUENCED"
        side_effects:
          - "resets RouteStop.sequence_index to 0 and RouteStop.travel_hours_from_previous to 0 on every non-DARK stop of the route"
          - "resets Route.total_travel_hours to 0"
        note: "Sequencing is invalidated by any change to the stop set; the route must be re-sequenced before it can be committed."
      - from: COMMITTED
        to: IN_PROGRESS
        trigger: "system: first RouteStop of this route reaches OPEN via POST /route-stops/{id}/open-gates"
        actor: system
        preconditions:
          - "route.status == COMMITTED"
        side_effects:
          - "increments Route.version by 1"
      - from: IN_PROGRESS
        to: CLOSED
        trigger: "system: Route.closed_stop_count reaches Route.stop_count after a stop reaches CLOSED or DARK"
        actor: system
        preconditions:
          - "route.status == IN_PROGRESS"
          - "Route.closed_stop_count == Route.stop_count and Route.stop_count >= 1"
        side_effects:
          - "increments Route.version by 1"

  - entity: RouteStop
    initial_state: PLANNED
    terminal_states: [CLOSED, DARK]
    transitions:
      - from: PLANNED
        to: CONFIRMED
        trigger: "system: Contract for this stop reaches EXECUTED via POST /contracts/{id}/execute"
        actor: system
        preconditions:
          - "stop.status == PLANNED"
          - "route.status == COMMITTED"
        side_effects:
          - "CASCADE hop 2: every RideAllocation of this stop with status == RESERVED transitions to COMMITTED, processed in created_at ASC order (the order matters because the inspection slot selector consumes per-day jurisdiction capacity)"
          - "CASCADE hop 3 (caused by hop 2): each newly COMMITTED allocation sets Ride.status = ASSIGNED and, when Ride.requires_state_inspection AND Venue.Jurisdiction.requires_state_ride_inspection, creates one InspectionOrder (authority = STATE, status = SCHEDULED, attempt_number = 1) whose scheduled_date is picked by the slot selector in calculations.stop_compliance_posture.inspection_slot_selector; when the selector's candidate set is empty the allocation transitions COMMITTED -> INSPECTION_HELD instead and no InspectionOrder row is created"
          - "CASCADE hop 4 (caused by hop 3): recomputes RouteStop.compliance_posture via calculations.stop_compliance_posture"
          - "increments RouteStop.version by 1"
      - from: CONFIRMED
        to: SETUP
        trigger: "POST /route-stops/{id}/begin-setup"
        actor: RouteManager | LotBoss
        preconditions:
          - "stop.status == CONFIRMED"
          - "logical clock >= stop.load_in_start, else ERR_LOAD_IN_NOT_OPEN"
          - "count of RideAllocation rows of this stop with status IN {COMMITTED, INSPECTION_HELD} >= 1, else ERR_NO_COMMITTED_RIDES"
          - "a PermitApplication of this stop with permit_type == TRANSPORT and status == APPROVED exists whose valid_from <= stop.load_in_start and valid_until >= stop.teardown_deadline, else ERR_PERMIT_NOT_APPROVED"
        side_effects:
          - "any PermitApplication of this stop with status == APPROVED and valid_until < logical clock transitions to EXPIRED before the TRANSPORT check runs"
          - "recomputes RouteStop.compliance_posture"
          - "increments RouteStop.version by 1"
      - from: SETUP
        to: OPEN
        trigger: "POST /route-stops/{id}/open-gates"
        actor: RouteManager | LotBoss
        preconditions:
          - "stop.status == SETUP"
          - "logical clock >= stop.open_date, else ERR_GATES_BEFORE_OPEN_DATE"
          - "count of RideAllocation rows of this stop with status == COMMITTED >= Contract.ride_minimum_count of the stop's EXECUTED contract, else ERR_RIDE_MINIMUM_NOT_MET"
          - "RouteStop.compliance_posture == CLEAR after recomputation, else the posture's blocking error (PERMIT_HOLD -> ERR_PERMIT_NOT_APPROVED or ERR_PERMIT_EXPIRED, INSPECTION_HOLD -> ERR_INSPECTION_NOT_PASSED, LABOR_HOLD -> ERR_CREW_COVERAGE_INSUFFICIENT)"
        side_effects:
          - "every RideAllocation of this stop with status == COMMITTED transitions to OPERATING"
          - "recomputes RouteStop.operating_ride_count"
          - "CROSS-ENTITY: Route transitions COMMITTED -> IN_PROGRESS when route.status == COMMITTED"
          - "increments RouteStop.version by 1"
      - from: OPEN
        to: TEARDOWN
        trigger: "POST /route-stops/{id}/teardown"
        actor: RouteManager | LotBoss
        preconditions:
          - "stop.status == OPEN"
          - "logical clock >= stop.close_date, else ERR_TEARDOWN_BEFORE_CLOSE_DATE"
        side_effects:
          - "every RideAllocation of this stop with status == OPERATING transitions to STRUCK"
          - "each struck allocation sets Ride.status = AVAILABLE unless Ride.status == OUT_OF_SERVICE"
          - "recomputes RouteStop.operating_ride_count (counts status IN {OPERATING, STRUCK}, so the value is frozen by teardown)"
          - "increments RouteStop.version by 1"
      - from: TEARDOWN
        to: CLOSED
        trigger: "system: the stop's Settlement reaches FINAL via POST /settlements/{id}/finalize"
        actor: system
        preconditions:
          - "stop.status == TEARDOWN"
        side_effects:
          - "CASCADE hop 2: every CrewAssignment of this stop with status == SCHEDULED transitions to COMPLETED"
          - "CASCADE hop 3 (caused by hop 2): each completed assignment recomputes Worker.worked_days_count for its worker"
          - "recomputes Route.closed_stop_count; Route transitions IN_PROGRESS -> CLOSED when closed_stop_count == stop_count"
          - "increments RouteStop.version by 1"
      - from: PLANNED
        to: DARK
        trigger: "POST /route-stops/{id}/cancel"
        actor: RouteManager | GeneralManager
        preconditions:
          - "stop.status IN {PLANNED, CONFIRMED, SETUP, OPEN}"
          - "no Settlement of the stop's contract has status == FINAL, else ERR_SETTLEMENT_ALREADY_FINAL"
        side_effects:
          - "CASCADE hop 1 (CONDITIONAL BRANCH on the contract's current state): the stop's Contract transitions to TERMINATED when its status == EXECUTED, or to VOID when its status IN {DRAFT, SENT, COUNTERED}"
          - "CASCADE hop 2 (caused by hop 1): Route.total_guaranteed_cents decreases by that contract's guarantee_cents"
          - "every RideAllocation of this stop with status IN {RESERVED, COMMITTED, INSPECTION_HELD, OPERATING} transitions to RELEASED; each release sets Ride.status = AVAILABLE unless the ride is OUT_OF_SERVICE or holds another non-terminal allocation"
          - "every CrewAssignment of this stop with status == SCHEDULED transitions to RELEASED, decreasing Worker.scheduled_hours_total and RouteStop.labor_cost_provisional_cents"
          - "every PermitApplication of this stop with status IN {SUBMITTED, APPROVED} transitions to EXPIRED"
          - "Route transitions SEQUENCED -> DRAFT when route.status == SEQUENCED; recomputes Route.stop_count and Route.closed_stop_count"
          - "increments RouteStop.version by 1"
        note: "Same transition applies from CONFIRMED, SETUP and OPEN; the side-effect set is identical and conditional on each child's current state."
      - from: CONFIRMED
        to: DARK
        trigger: "POST /route-stops/{id}/cancel"
        actor: RouteManager | GeneralManager
        preconditions:
          - "stop.status IN {PLANNED, CONFIRMED, SETUP, OPEN}"
        side_effects:
          - "identical to the PLANNED -> DARK side-effect set"
      - from: SETUP
        to: DARK
        trigger: "POST /route-stops/{id}/cancel"
        actor: RouteManager | GeneralManager
        preconditions:
          - "stop.status IN {PLANNED, CONFIRMED, SETUP, OPEN}"
        side_effects:
          - "identical to the PLANNED -> DARK side-effect set"
      - from: OPEN
        to: DARK
        trigger: "POST /route-stops/{id}/cancel"
        actor: RouteManager | GeneralManager
        preconditions:
          - "stop.status IN {PLANNED, CONFIRMED, SETUP, OPEN}"
        side_effects:
          - "identical to the PLANNED -> DARK side-effect set"

  - entity: Contract
    initial_state: DRAFT
    terminal_states: [VOID, TERMINATED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /contracts/{id}/send"
        actor: ContractNegotiator
        preconditions:
          - "contract.status IN {DRAFT, COUNTERED}"
          - "route.status IN {SEQUENCED, COMMITTED}, else ERR_ROUTE_STATE_INVALID"
          - "contract.negotiation_round < MAX_NEGOTIATION_ROUNDS (= 2), else ERR_NEGOTIATION_ROUNDS_EXHAUSTED"
        side_effects:
          - "sets Contract.last_sent_by_user_id = X-User-ID of the caller"
          - "increments Contract.version by 1"
      - from: COUNTERED
        to: SENT
        trigger: "POST /contracts/{id}/send"
        actor: ContractNegotiator
        preconditions:
          - "contract.status == COUNTERED"
          - "contract.negotiation_round < MAX_NEGOTIATION_ROUNDS (= 2), else ERR_NEGOTIATION_ROUNDS_EXHAUSTED"
        side_effects:
          - "sets Contract.last_sent_by_user_id = X-User-ID of the caller"
          - "increments Contract.version by 1"
        note: "Closes the negotiation loop SENT -> COUNTERED -> SENT."
      - from: SENT
        to: COUNTERED
        trigger: "POST /contracts/{id}/counter"
        actor: ContractNegotiator
        preconditions:
          - "contract.status == SENT"
          - "contract.negotiation_round < MAX_NEGOTIATION_ROUNDS (= 2)"
        side_effects:
          - "increments Contract.negotiation_round by 1"
          - "overwrites revenue_split_pct_operator, guarantee_cents and ride_minimum_count with any values supplied in the request body"
          - "increments Contract.version by 1"
      - from: SENT
        to: VOID
        trigger: "system: the contract's RouteStop transitions to DARK via POST /route-stops/{id}/cancel while the contract has not been executed"
        actor: system
        preconditions:
          - "contract.status IN {DRAFT, SENT, COUNTERED}"
        side_effects:
          - "leaves negotiation_round and every negotiated term unchanged; Route.total_guaranteed_cents is NOT touched because an unexecuted guarantee was never added to it"
          - "increments Contract.version by 1"
        note: "CONDITIONAL CASCADE BRANCH: the same stop-cancel trigger routes an EXECUTED contract to TERMINATED (which does reverse Route.total_guaranteed_cents) and a DRAFT / SENT / COUNTERED contract to VOID. The negotiation loop itself never voids a deal; it dead-ends at COUNTERED once the round budget is spent, and POST /contracts/{id}/send then answers ERR_NEGOTIATION_ROUNDS_EXHAUSTED."
      - from: COUNTERED
        to: VOID
        trigger: "system: the contract's RouteStop transitions to DARK via POST /route-stops/{id}/cancel while the contract has not been executed"
        actor: system
        preconditions:
          - "contract.status IN {DRAFT, SENT, COUNTERED}"
        side_effects:
          - "identical to the SENT -> VOID side-effect set"
      - from: DRAFT
        to: VOID
        trigger: "system: the contract's RouteStop transitions to DARK via POST /route-stops/{id}/cancel while the contract has not been executed"
        actor: system
        preconditions:
          - "contract.status IN {DRAFT, SENT, COUNTERED}"
        side_effects:
          - "identical to the SENT -> VOID side-effect set"
      - from: SENT
        to: EXECUTED
        trigger: "POST /contracts/{id}/execute"
        actor: GeneralManager
        preconditions:
          - "contract.status == SENT"
          - "X-User-ID != contract.last_sent_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "route.status == COMMITTED, else ERR_ROUTE_STATE_INVALID"
          - "stop.status == PLANNED, else ERR_STOP_STATE_INVALID"
          - "no other Contract with status == EXECUTED exists on the same Venue whose stop operating window [open_date, close_date] overlaps this stop's window when either contract's exclusivity IN {RIDES, FULL}, else ERR_EXCLUSIVITY_CONFLICT"
        side_effects:
          - "sets Contract.executed_at = logical clock"
          - "Route.total_guaranteed_cents increases by contract.guarantee_cents"
          - "CASCADE hop 1: RouteStop transitions PLANNED -> CONFIRMED (which itself cascades to allocations, inspections and posture)"
          - "increments Contract.version by 1"
      - from: EXECUTED
        to: TERMINATED
        trigger: "system: the contract's RouteStop transitions to DARK via POST /route-stops/{id}/cancel"
        actor: system
        preconditions:
          - "contract.status == EXECUTED"
        side_effects:
          - "Route.total_guaranteed_cents decreases by contract.guarantee_cents"
          - "increments Contract.version by 1"

  - entity: RideAllocation
    initial_state: RESERVED
    terminal_states: [STRUCK, RELEASED]
    transitions:
      - from: RESERVED
        to: COMMITTED
        trigger: "POST /ride-allocations/{id}/commit, or system when the stop transitions PLANNED -> CONFIRMED"
        actor: LotBoss | system
        preconditions:
          - "allocation.status == RESERVED"
          - "stop.status IN {CONFIRMED, SETUP}, else ERR_STOP_STATE_INVALID"
          - "Ride.status != OUT_OF_SERVICE, else ERR_RIDE_OUT_OF_SERVICE"
        side_effects:
          - "FORK BRANCH A: sets Ride.status = ASSIGNED"
          - "creates one InspectionOrder (authority = STATE, status = SCHEDULED) when Ride.requires_state_inspection AND Jurisdiction.requires_state_ride_inspection, using the inspection_slot_selector; when the selector finds no day with free capacity on or before stop.open_date the allocation transitions COMMITTED -> INSPECTION_HELD and no row is created"
          - "recomputes RouteStop.compliance_posture"
          - "increments RideAllocation.version by 1"
      - from: RESERVED
        to: RELEASED
        trigger: "POST /ride-allocations/{id}/release"
        actor: LotBoss | RouteManager
        preconditions:
          - "allocation.status IN {RESERVED, COMMITTED, INSPECTION_HELD, OPERATING}"
          - "stop.status != CLOSED, else ERR_STOP_STATE_INVALID"
        side_effects:
          - "FORK BRANCH B (divergent from branch A): sets released_at = logical clock; RouteStop.allocated_sqft_used decreases by footprint_charged_sqft and RouteStop.power_amps_used decreases by power_charged_amps"
          - "sets Ride.status = AVAILABLE unless Ride.status == OUT_OF_SERVICE or the ride holds another allocation with status IN {RESERVED, COMMITTED, INSPECTION_HELD, OPERATING}"
          - "creates no InspectionOrder and leaves any existing SCHEDULED InspectionOrder of this allocation untouched (posture ignores inspections of terminal allocations)"
          - "recomputes RouteStop.compliance_posture"
          - "increments RideAllocation.version by 1"
      - from: COMMITTED
        to: RELEASED
        trigger: "POST /ride-allocations/{id}/release"
        actor: LotBoss | RouteManager
        preconditions:
          - "allocation.status IN {RESERVED, COMMITTED, INSPECTION_HELD, OPERATING}"
          - "stop.status != CLOSED"
        side_effects:
          - "identical to the RESERVED -> RELEASED side-effect set"
      - from: INSPECTION_HELD
        to: RELEASED
        trigger: "POST /ride-allocations/{id}/release"
        actor: LotBoss | RouteManager
        preconditions:
          - "allocation.status IN {RESERVED, COMMITTED, INSPECTION_HELD, OPERATING}"
        side_effects:
          - "identical to the RESERVED -> RELEASED side-effect set"
      - from: OPERATING
        to: RELEASED
        trigger: "POST /ride-allocations/{id}/release"
        actor: LotBoss | RouteManager
        preconditions:
          - "allocation.status IN {RESERVED, COMMITTED, INSPECTION_HELD, OPERATING}"
          - "stop.status != CLOSED, else ERR_STOP_STATE_INVALID"
        side_effects:
          - "identical to the RESERVED -> RELEASED side-effect set, plus: recomputes RouteStop.operating_ride_count (the pulled ride stops counting as operated, so the FINAL settlement variant no longer counts it toward the ride minimum)"
        note: "A ride that breaks down mid-run is pulled off the lot. This is the only path by which the FINAL variant's RIDE_COUNT_STATUS_SET can count fewer rides than the PROVISIONAL variant already counted."
      - from: COMMITTED
        to: INSPECTION_HELD
        trigger: "system: an InspectionOrder of this allocation reaches FAILED via POST /inspection-orders/{id}/result"
        actor: system
        preconditions:
          - "allocation.status == COMMITTED"
        side_effects:
          - "sets Ride.status = OUT_OF_SERVICE when the failing InspectionOrder.defect_count >= OUT_OF_SERVICE_DEFECT_THRESHOLD (= 3)"
          - "sets RouteStop.compliance_posture = INSPECTION_HOLD"
          - "increments RideAllocation.version by 1"
      - from: INSPECTION_HELD
        to: COMMITTED
        trigger: "system: a later InspectionOrder of this allocation reaches PASSED via POST /inspection-orders/{id}/result"
        actor: system
        preconditions:
          - "allocation.status == INSPECTION_HELD"
          - "Ride.status != OUT_OF_SERVICE, else the allocation stays INSPECTION_HELD"
        side_effects:
          - "recomputes RouteStop.compliance_posture"
          - "increments RideAllocation.version by 1"
        note: "Closes the loop COMMITTED -> INSPECTION_HELD -> COMMITTED across inspection attempts."
      - from: COMMITTED
        to: OPERATING
        trigger: "system: the stop transitions SETUP -> OPEN via POST /route-stops/{id}/open-gates"
        actor: system
        preconditions:
          - "allocation.status == COMMITTED"
        side_effects:
          - "recomputes RouteStop.operating_ride_count"
          - "increments RideAllocation.version by 1"
      - from: OPERATING
        to: STRUCK
        trigger: "system: the stop transitions OPEN -> TEARDOWN via POST /route-stops/{id}/teardown"
        actor: system
        preconditions:
          - "allocation.status == OPERATING"
        side_effects:
          - "sets Ride.status = AVAILABLE unless Ride.status == OUT_OF_SERVICE"
          - "increments RideAllocation.version by 1"

  - entity: PermitApplication
    initial_state: DRAFT
    terminal_states: [DENIED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /permit-applications/{id}/submit"
        actor: ComplianceClerk
        preconditions:
          - "permit.status == DRAFT"
          - "stop.status IN {PLANNED, CONFIRMED, SETUP}, else ERR_STOP_STATE_INVALID"
          - "floor((stop.open_date - logical clock) / 86400 seconds) >= Jurisdiction.permit_lead_days, else ERR_PERMIT_LEAD_TIME_VIOLATION"
        side_effects:
          - "sets submitted_at = logical clock"
          - "increments PermitApplication.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /permit-applications/{id}/decision with decision = APPROVE"
        actor: JurisdictionOfficer
        preconditions:
          - "permit.status == SUBMITTED"
        side_effects:
          - "sets decided_at = logical clock"
          - "recomputes RouteStop.compliance_posture"
          - "increments PermitApplication.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /permit-applications/{id}/decision with decision = DENY"
        actor: JurisdictionOfficer
        preconditions:
          - "permit.status == SUBMITTED"
          - "denial_reason is present in the request body, else ERR_INVALID_REQUEST"
        side_effects:
          - "sets decided_at = logical clock and denial_reason from the body"
          - "recomputes RouteStop.compliance_posture (EVENT denial drives PERMIT_HOLD)"
          - "increments PermitApplication.version by 1"
      - from: APPROVED
        to: EXPIRED
        trigger: "system: evaluated at the start of POST /route-stops/{id}/begin-setup and POST /route-stops/{id}/open-gates, or when the stop transitions to DARK"
        actor: system
        preconditions:
          - "permit.status == APPROVED"
          - "permit.valid_until < logical clock, or the stop transitioned to DARK"
        side_effects:
          - "recomputes RouteStop.compliance_posture"
          - "increments PermitApplication.version by 1"
      - from: SUBMITTED
        to: EXPIRED
        trigger: "system: the stop transitions to DARK via POST /route-stops/{id}/cancel"
        actor: system
        preconditions:
          - "permit.status == SUBMITTED"
        side_effects:
          - "increments PermitApplication.version by 1"

  - entity: InspectionOrder
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /inspection-orders/{id}/result with result = PASS"
        actor: JurisdictionOfficer
        preconditions:
          - "inspection.status == SCHEDULED"
          - "allocation.status IN {COMMITTED, INSPECTION_HELD}, else ERR_ALLOCATION_NOT_INSPECTABLE"
        side_effects:
          - "FORK BRANCH PASS: sets defect_count = 0 and result_recorded_at = logical clock"
          - "allocation transitions INSPECTION_HELD -> COMMITTED when it was held and Ride.status != OUT_OF_SERVICE"
          - "recomputes RouteStop.compliance_posture (may clear INSPECTION_HOLD)"
          - "increments InspectionOrder.version by 1"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /inspection-orders/{id}/result with result = FAIL"
        actor: JurisdictionOfficer
        preconditions:
          - "inspection.status == SCHEDULED"
          - "allocation.status IN {COMMITTED, INSPECTION_HELD}"
          - "defect_count >= 1 in the request body, else ERR_INVALID_REQUEST"
        side_effects:
          - "FORK BRANCH FAIL (divergent from PASS): sets defect_count from the body and result_recorded_at = logical clock"
          - "allocation transitions COMMITTED -> INSPECTION_HELD"
          - "sets Ride.status = OUT_OF_SERVICE when defect_count >= OUT_OF_SERVICE_DEFECT_THRESHOLD (= 3)"
          - "sets RouteStop.compliance_posture = INSPECTION_HOLD"
          - "increments InspectionOrder.version by 1"
        note: "A re-inspection is a new InspectionOrder row on the same allocation with attempt_number = 1 + count of FAILED rows."

  - entity: CrewAssignment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, RELEASED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "system: the stop transitions TEARDOWN -> CLOSED after its Settlement reaches FINAL"
        actor: system
        preconditions:
          - "assignment.status == SCHEDULED"
        side_effects:
          - "recomputes Worker.worked_days_count for the assignment's worker"
          - "leaves Worker.scheduled_hours_total unchanged (COMPLETED remains inside the scheduled-hours status set)"
          - "increments CrewAssignment.version by 1"
      - from: SCHEDULED
        to: RELEASED
        trigger: "POST /crew-assignments/{id}/cancel, or system when the stop transitions to DARK"
        actor: LotBoss | system
        preconditions:
          - "assignment.status == SCHEDULED"
          - "stop.status != CLOSED, else ERR_STOP_STATE_INVALID"
        side_effects:
          - "COMPENSATION: Worker.scheduled_hours_total decreases by assignment.shift_hours and RouteStop.labor_cost_provisional_cents decreases by assignment.cost_cents, restoring both ledgers to their pre-assignment values"
          - "frees the housing pad when housing_pad_assigned is true"
          - "recomputes RouteStop.compliance_posture (may raise LABOR_HOLD)"
          - "increments CrewAssignment.version by 1"

  - entity: Settlement
    initial_state: PROVISIONAL
    terminal_states: [FINAL, SUPERSEDED]
    transitions:
      - from: PROVISIONAL
        to: DISPUTED
        trigger: "POST /settlements/{id}/dispute"
        actor: ContractNegotiator
        preconditions:
          - "settlement.status == PROVISIONAL"
        side_effects:
          - "sets dispute_reason from the body"
          - "increments Settlement.version by 1"
      - from: DISPUTED
        to: PROVISIONAL
        trigger: "POST /settlements/{id}/reconcile"
        actor: TicketingAuditor
        preconditions:
          - "settlement.status == DISPUTED"
        side_effects:
          - "re-runs calculations.stop_settlement variant PROVISIONAL over the current TicketSale rows and overwrites every computed amount on the row"
          - "clears dispute_reason to null"
          - "increments Settlement.version by 1"
        note: "Closes the loop PROVISIONAL -> DISPUTED -> PROVISIONAL on the same row."
      - from: PROVISIONAL
        to: FINAL
        trigger: "POST /settlements/{id}/finalize"
        actor: GeneralManager
        preconditions:
          - "settlement.status == PROVISIONAL, else ERR_SETTLEMENT_STATE_INVALID"
          - "stop.status == TEARDOWN, else ERR_STOP_STATE_INVALID"
          - "every WeatherClosure of the stop has status == ADJUDICATED, else ERR_CLOSURE_NOT_ADJUDICATED"
          - "every MakeGoodArrangement of the contract has status IN {ACCEPTED, DECLINED}, else ERR_MAKEGOOD_PENDING"
        side_effects:
          - "re-runs calculations.stop_settlement variant FINAL and overwrites every computed amount; sets variant = FINAL and finalized_at = logical clock"
          - "CASCADE hop 1: RouteStop transitions TEARDOWN -> CLOSED (which cascades to crew and worker ledgers and to Route closure)"
          - "increments Settlement.version by 1"
      - from: PROVISIONAL
        to: SUPERSEDED
        trigger: "system: a new Settlement row is created for the same contract via POST /settlements"
        actor: system
        preconditions:
          - "settlement.status IN {PROVISIONAL, DISPUTED}"
        side_effects:
          - "increments Settlement.version by 1"
      - from: DISPUTED
        to: SUPERSEDED
        trigger: "system: a new Settlement row is created for the same contract via POST /settlements"
        actor: system
        preconditions:
          - "settlement.status IN {PROVISIONAL, DISPUTED}"
        side_effects:
          - "increments Settlement.version by 1"

  - entity: WeatherClosure
    initial_state: LOGGED
    terminal_states: [ADJUDICATED]
    transitions:
      - from: LOGGED
        to: ADJUDICATED
        trigger: "POST /weather-closures/{id}/adjudicate"
        actor: GeneralManager
        preconditions:
          - "closure.status == LOGGED"
          - "stop.status IN {OPEN, TEARDOWN}, else ERR_STOP_STATE_INVALID"
        side_effects:
          - "runs calculations.weather_abatement_hours: writes WeatherClosure.abated_hours on this row and recomputes RouteStop.closure_hours_adjudicated over all ADJUDICATED closures of the stop"
          - "increments WeatherClosure.version by 1"

  - entity: MakeGoodArrangement
    initial_state: PROPOSED
    terminal_states: [ACCEPTED, DECLINED]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /make-goods/{id}/respond with response = ACCEPT"
        actor: ContractNegotiator
        preconditions:
          - "makegood.status == PROPOSED"
          - "no Settlement of the contract has status == FINAL, else ERR_SETTLEMENT_ALREADY_FINAL"
        side_effects:
          - "sets responded_at = logical clock"
          - "the amount enters Settlement.makegood_deduction_cents at finalize when kind == CASH_REFUND"
          - "increments MakeGoodArrangement.version by 1"
      - from: PROPOSED
        to: DECLINED
        trigger: "POST /make-goods/{id}/respond with response = DECLINE"
        actor: ContractNegotiator
        preconditions:
          - "makegood.status == PROPOSED"
        side_effects:
          - "sets responded_at = logical clock"
          - "the amount never enters any settlement"
          - "increments MakeGoodArrangement.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: allocation-create-stale-stop
    parent_entity: RouteStop
    write_endpoint: "POST /ride-allocations"
    occ_field: "expected_route_stop_version"
    description: |
      Reserving a ride against a RouteStop whose version has advanced since the
      client last read it is rejected. The client's remaining-capacity view
      (allocated_sqft_used, power_amps_used) is stale, so a reservation that the
      client believes fits may in fact overrun the lot; the server refuses the
      write rather than admitting it on a stale footprint budget.
    error_id: ERR_STALE_ROUTE_STOP_VERSION
    http_status: 412

  - rule_id: settlement-create-stale-contract
    parent_entity: Contract
    write_endpoint: "POST /settlements"
    occ_field: "expected_contract_version"
    description: |
      Creating a provisional Settlement against a Contract whose version has
      advanced since the client last read it is rejected. A new provisional
      settlement legitimately supersedes the prior one, so the operation cannot
      be refused on state grounds; the stale-version check is what stops an
      auditor from superseding a settlement computed from terms they never saw
      (a counter round or a termination has changed the deal in between).
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: route_travel_feasibility
    trigger: "POST /routes/{id}/sequence (writes RouteStop.sequence_index, RouteStop.travel_hours_from_previous, Route.total_travel_hours, Route.total_haul_miles)"
    algorithm: chronological
    formula: |
      # Chain order is structural, never id-based:
      head = the single non-DARK RouteStop of the route with previous_stop_id == null
      chain = [head]; while exists non-DARK stop s with s.previous_stop_id == chain[-1].id: chain.append(s)
      if len(chain) != count(non-DARK stops of the route): raise ERR_STOP_CHAIN_INVALID
      if any non-DARK stop is the previous_stop_id of two or more non-DARK stops: raise ERR_STOP_CHAIN_INVALID

      for i, stop in enumerate(chain):
          stop.sequence_index = i
          raw_drive_hours = stop.haul_miles_from_previous / AVG_HAUL_SPEED_MPH
          rest_blocks     = floor(raw_drive_hours / MAX_DRIVE_HOURS_PER_SHIFT)
          stop.travel_hours_from_previous = round_half_up(
              raw_drive_hours + rest_blocks * MANDATED_REST_HOURS, 2)
          if i >= 1:
              required_gap_hours  = stop.travel_hours_from_previous + LOAD_OUT_BUFFER_HOURS
              available_gap_hours = (stop.load_in_start - chain[i-1].teardown_deadline) / 3600 seconds
              if available_gap_hours < required_gap_hours: raise ERR_INSUFFICIENT_TRAVEL_WINDOW
      route.total_haul_miles   = sum(stop.haul_miles_from_previous for stop in chain)
      route.total_travel_hours = round_half_up(sum(stop.travel_hours_from_previous for stop in chain), 2)
    input_set: "RouteStop rows with route_id = the route and status != DARK; DARK stops are excluded from the chain and from both totals"
    constants:
      AVG_HAUL_SPEED_MPH: 45
      MAX_DRIVE_HOURS_PER_SHIFT: 11
      MANDATED_REST_HOURS: 10
      LOAD_OUT_BUFFER_HOURS: 6
    precision: "hours to 2 decimal places, round_half_up; rest_blocks uses floor on the unrounded ratio"
    variants: []

  - name: lot_capacity_charge
    trigger: "POST /ride-allocations (writes RideAllocation.footprint_charged_sqft, power_charged_amps, occupation_start, occupation_end and re-aggregates RouteStop.allocated_sqft_used / power_amps_used)"
    algorithm: threshold
    formula: |
      footprint_charged_sqft = ceil(Ride.footprint_sqft * SPACING_MULTIPLIER[Ride.ride_class])
      power_charged_amps     = round_half_up(Ride.power_amps * (1 + STARTUP_SURGE_PCT[Ride.ride_class] / 100), 1)
      occupation_start       = RouteStop.load_in_start
      occupation_end         = RouteStop.teardown_deadline

      circulation_reserve_sqft = ceil(Venue.expected_attendance * CIRCULATION_SQFT_PER_ATTENDEE)
      usable_lot_sqft = floor(Venue.lot_area_sqft * USABLE_LOT_PCT / 100) - circulation_reserve_sqft
      allowed_amps    = round_half_up(Venue.power_amps_available * POWER_HEADROOM_PCT / 100, 1)

      # Both gates use <= : exact equality is admitted.
      if RouteStop.allocated_sqft_used + footprint_charged_sqft > usable_lot_sqft: raise ERR_LOT_CAPACITY_EXCEEDED
      if RouteStop.power_amps_used   + power_charged_amps      > allowed_amps:    raise ERR_LOT_POWER_EXCEEDED

      RouteStop.allocated_sqft_used = sum(a.footprint_charged_sqft for a in allocations of the stop
                                         with a.status IN {RESERVED, COMMITTED, INSPECTION_HELD, OPERATING})
      RouteStop.power_amps_used     = round_half_up(sum(a.power_charged_amps for the same status set), 1)
    input_set: "RideAllocation rows of the stop with status IN {RESERVED, COMMITTED, INSPECTION_HELD, OPERATING}; RELEASED and STRUCK allocations release their footprint and amperage"
    constants:
      SPACING_MULTIPLIER: { MAJOR: 1.35, FLAT: 1.20, KIDDIE: 1.10 }
      STARTUP_SURGE_PCT: { MAJOR: 25, FLAT: 15, KIDDIE: 0 }
      USABLE_LOT_PCT: 80
      CIRCULATION_SQFT_PER_ATTENDEE: 0.5
      POWER_HEADROOM_PCT: 90
    precision: "sqft integer via ceil on the product; amps 1 decimal place round_half_up; usable_lot_sqft uses floor on the lot product and ceil on the circulation reserve"
    variants: []

  - name: stop_labor_cost
    trigger: "POST /crew-assignments (writes CrewAssignment.shift_hours, cost_cents, housing_pad_assigned, Worker.scheduled_hours_total and RouteStop.labor_cost_provisional_cents); re-aggregated on POST /crew-assignments/{id}/cancel"
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER: round each assignment to whole cents, THEN sum.
      # The rejected alternative — summing unrounded hour-cost products across the
      # stop's assignments and rounding once at the end — is NOT used and produces
      # a different total.
      shift_hours     = round_half_up((shift_end - shift_start) / 3600 seconds, 2)
      straight_hours  = min(shift_hours, OVERTIME_THRESHOLD_HOURS)
      overtime_hours  = max(0, shift_hours - OVERTIME_THRESHOLD_HOURS)
      base_cents      = round_half_up(straight_hours * Worker.hourly_rate_cents
                                      + overtime_hours * Worker.hourly_rate_cents * OVERTIME_MULTIPLIER, 0)
      premium_cents   = round_half_up(base_cents * RIGGING_PREMIUM_PCT / 100, 0) if crew_role IN {SETUP, TEARDOWN} else 0
      housing_cents   = HOUSING_STIPEND_CENTS_PER_SHIFT if Worker.housing_required else 0
      cost_cents      = base_cents + premium_cents + housing_cents
      housing_pad_assigned = Worker.housing_required

      RouteStop.labor_cost_provisional_cents = sum(a.cost_cents for a in assignments of the stop
                                                   with a.status IN {SCHEDULED, COMPLETED})
      Worker.scheduled_hours_total = round_half_up(sum(a.shift_hours for a in that worker's assignments
                                                       with a.status IN {SCHEDULED, COMPLETED}), 2)
    input_set: "CrewAssignment rows with status IN {SCHEDULED, COMPLETED}; RELEASED assignments are excluded from both aggregates"
    constants:
      OVERTIME_THRESHOLD_HOURS: 10
      OVERTIME_MULTIPLIER: 1.5
      RIGGING_PREMIUM_PCT: 10
      HOUSING_STIPEND_CENTS_PER_SHIFT: 3500
    precision: "hours 2 decimals round_half_up; every money step rounded to whole cents round_half_up at the per-assignment level before summation"
    variants: []

  - name: stop_settlement
    trigger: "POST /settlements (variant PROVISIONAL), POST /settlements/{id}/reconcile (variant PROVISIONAL), POST /settlements/{id}/finalize (variant FINAL)"
    algorithm: tiered_pricing
    formula: |
      # EVALUATION ORDER IS PINNED 1..8. The dependency graph looks circular
      # (the tier bonus depends on taxable_net, which depends on tax; the penalty
      # cap depends on split_share, which depends on the tier bonus; the guarantee
      # floor is compared against the penalised split), so every value below is
      # defined only by the step order given here.

      # 1. per-channel gross, exact integers, no rounding
      for c in [WRISTBAND, SINGLE, PRESALE]:
          channel_gross[c] = sum(s.units * s.unit_price_cents for s in sales with s.channel == c)
      gross_cents = channel_gross[WRISTBAND] + channel_gross[SINGLE] + channel_gross[PRESALE]

      # 2. tax: ROUND PER CHANNEL, THEN SUM (summing first and rounding once is NOT used)
      for c in [WRISTBAND, SINGLE, PRESALE]:
          channel_tax[c] = round_half_up(channel_gross[c] * Jurisdiction.amusement_tax_pct / 100, 0)
      tax_cents = channel_tax[WRISTBAND] + channel_tax[SINGLE] + channel_tax[PRESALE]

      # 3.
      taxable_net_cents = gross_cents - tax_cents

      # 4. volume tier on the POST-TAX net, inclusive lower bounds
      if   taxable_net_cents >= SPLIT_TIER_2_CENTS: bonus_pp = 5.0
      elif taxable_net_cents >= SPLIT_TIER_1_CENTS: bonus_pp = 2.5
      else:                                         bonus_pp = 0.0
      effective_operator_pct = min(Contract.revenue_split_pct_operator + bonus_pp, MAX_OPERATOR_PCT)

      # 5.
      split_share_cents = round_half_up(taxable_net_cents * effective_operator_pct / 100, 0)

      # 6. ride-minimum penalty, capped as a share of the split just computed
      counted_rides   = count(allocations of the stop with status IN RIDE_COUNT_STATUS_SET[variant])
      shortfall_rides = max(0, Contract.ride_minimum_count - counted_rides)
      raw_penalty     = shortfall_rides * RIDE_SHORTFALL_PENALTY_CENTS
      penalty_cap     = round_half_up(split_share_cents * SHORTFALL_CAP_PCT / 100, 0)
      shortfall_penalty_cents = min(raw_penalty, penalty_cap)

      # 7. guarantee floor, variant-specific
      if variant == PROVISIONAL:
          elapsed_days = min(RouteStop.operating_days,
                             max(1, floor((min(clock, RouteStop.close_date) - RouteStop.open_date) / 86400 seconds) + 1))
          guarantee_effective_cents = round_half_up(Contract.guarantee_cents * elapsed_days / RouteStop.operating_days, 0)
          makegood_deduction_cents  = 0
      else:  # FINAL
          abatement_ratio = min(1, RouteStop.closure_hours_adjudicated / RouteStop.scheduled_operating_hours)
          guarantee_effective_cents = round_half_up(Contract.guarantee_cents * (1 - abatement_ratio), 0)
          makegood_deduction_cents  = sum(m.amount_cents for m in make-goods of the contract
                                          with m.kind == CASH_REFUND and m.status == ACCEPTED)

      # 8.
      base_due = split_share_cents - shortfall_penalty_cents
      due      = max(base_due, guarantee_effective_cents) if Contract.settlement_basis == GREATER_OF else base_due
      settlement_due_cents = max(0, due - makegood_deduction_cents)
    input_set: "TicketSale rows with route_stop_id = the contract's stop and channel IN {WRISTBAND, SINGLE, PRESALE} (COMP rows contribute 0 gross and are excluded from every channel bucket); identical for both variants"
    constants:
      SPLIT_TIER_1_CENTS: 2000000
      SPLIT_TIER_2_CENTS: 5000000
      MAX_OPERATOR_PCT: 72.5
      RIDE_SHORTFALL_PENALTY_CENTS: 25000
      SHORTFALL_CAP_PCT: 10
      RIDE_COUNT_STATUS_SET: { PROVISIONAL: [COMMITTED, INSPECTION_HELD, OPERATING], FINAL: [OPERATING, STRUCK] }
    precision: "all money in whole cents, round_half_up at each numbered step; percentages carry 2 decimals"
    variants:
      - name: PROVISIONAL
        when: "POST /settlements and POST /settlements/{id}/reconcile, while the stop is OPEN or TEARDOWN"
        difference: "counts rides forward-looking (COMMITTED, INSPECTION_HELD, OPERATING all count toward the ride minimum), pro-rates the guarantee by elapsed operating days, and ignores every make-good"
      - name: FINAL
        when: "POST /settlements/{id}/finalize, once the stop is TEARDOWN and all closures are adjudicated"
        difference: "counts only rides that actually operated (OPERATING, STRUCK), abates the guarantee by adjudicated closure hours instead of pro-rating by elapsed days, and deducts ACCEPTED CASH_REFUND make-goods — so identical ticket data yields a different settlement_due_cents"

  - name: worker_duty_exposure
    trigger: "POST /crew-assignments (variant SCHEDULED_BASIS gate + Worker.compliance_status), system stop TEARDOWN -> CLOSED (variant WORKED_BASIS audit + Worker.worked_days_count)"
    algorithm: aggregation
    formula: |
      # An assignment covers every UTC calendar date from date(shift_start) to
      # date(shift_end - 1 second), inclusive.
      covered_dates(basis, worker, jurisdiction) =
          union of covered dates over that worker's assignments whose stop's
          Venue.jurisdiction_id == jurisdiction and whose status IN BASIS_STATUS_SET[basis]
      consecutive_days(basis) = length of the longest run of consecutive UTC dates in covered_dates(basis)

      # gate at assignment creation (candidate row included in the union):
      if consecutive_days(SCHEDULED_BASIS, worker, jurisdiction) > Jurisdiction.max_consecutive_work_days:
          raise ERR_CONSECUTIVE_DAYS_EXCEEDED

      Worker.worked_days_count = size of covered_dates(WORKED_BASIS, worker, any jurisdiction)

      # visa exposure, evaluated against the logical clock
      if Worker.employment_type != H2B_VISA:                                 compliance_status = CLEAR
      elif Worker.visa_expires_on < clock:                                   compliance_status = VISA_LAPSED
      elif (Worker.visa_expires_on - clock) <= VISA_EXPIRING_WINDOW_DAYS days: compliance_status = VISA_EXPIRING
      else:                                                                  compliance_status = CLEAR
      # assignment gate: shift_end > Worker.visa_expires_on -> ERR_WORKER_VISA_LAPSED
    input_set: "CrewAssignment rows of the worker filtered by BASIS_STATUS_SET and, for the consecutive-days gate, by the jurisdiction of the assignment's stop"
    constants:
      BASIS_STATUS_SET: { SCHEDULED_BASIS: [SCHEDULED, COMPLETED], WORKED_BASIS: [COMPLETED] }
      VISA_EXPIRING_WINDOW_DAYS: 30
    precision: "whole calendar days in UTC; no rounding"
    variants:
      - name: SCHEDULED_BASIS
        when: "evaluated inside POST /crew-assignments as the consecutive-days gate"
        difference: "counts SCHEDULED and COMPLETED assignments, so a shift that is booked but never worked still consumes a consecutive day"
      - name: WORKED_BASIS
        when: "evaluated when the stop closes, to write Worker.worked_days_count"
        difference: "counts COMPLETED assignments only, so the same worker with the same rows yields a shorter run whenever a booked shift was released or the stop went DARK"

  - name: weather_abatement_hours
    trigger: "POST /weather-closures/{id}/adjudicate (writes WeatherClosure.abated_hours and RouteStop.closure_hours_adjudicated)"
    algorithm: interval_merge
    formula: |
      # daily operating windows, half-open
      windows = [ [open_date + d*24h, open_date + d*24h + DAILY_OPERATING_HOURS h)
                  for d in 0 .. RouteStop.operating_days - 1 ]

      clipped(closure) = intersection of [closure.closed_from, closure.closed_to) with the union of windows

      # merge across ADJUDICATED closures of the stop, processed chronologically
      ordered   = ADJUDICATED closures of the stop sorted by closed_from ASC, then closed_to ASC, then created_at ASC
      intervals = concat(clipped(c) for c in ordered)
      merged    = merge intervals sorted by start ASC then end ASC, joining when next.start <= current.end (gap == 0 merges)
      merged_total_hours = round_half_up(sum(length(m) in hours for m in merged), 2)

      RouteStop.closure_hours_adjudicated = merged_total_hours if merged_total_hours >= ABATEMENT_MIN_HOURS else 0

      # per-row attribution: chronological first-claim, so overlaps never double count
      claimed = empty interval set
      for c in ordered:
          c.abated_hours = round_half_up(length(clipped(c) minus claimed) in hours, 2)
          claimed = claimed union clipped(c)
    input_set: "WeatherClosure rows of the stop with status == ADJUDICATED, including the row being adjudicated by the current call; LOGGED rows contribute nothing"
    constants:
      DAILY_OPERATING_HOURS: 8
      ABATEMENT_MIN_HOURS: 2
    precision: "hours 2 decimals round_half_up; interval arithmetic is half-open [start, end) and adjacency at gap == 0 merges"
    variants: []

  - name: stop_compliance_posture
    trigger: "recomputed at the end of every mutation that touches the stop's PermitApplication, InspectionOrder, RideAllocation or CrewAssignment rows, and read by GET /route-stops/{id}/readiness"
    algorithm: constraint_propagation
    formula: |
      # FIRST MATCH WINS, in exactly this precedence order.
      # 1
      if not exists p in permits of the stop with p.permit_type == EVENT and p.status == APPROVED
             and p.valid_from <= stop.open_date and p.valid_until >= stop.close_date:
          posture = PERMIT_HOLD          # blocking_error_id = ERR_PERMIT_NOT_APPROVED,
                                         # or ERR_PERMIT_EXPIRED when such a permit exists but is EXPIRED
      # 2
      elif exists a in allocations of the stop with a.status IN {RESERVED, COMMITTED, INSPECTION_HELD, OPERATING} such that
             ( a.status == INSPECTION_HELD )
             or ( Ride(a).requires_state_inspection and Jurisdiction.requires_state_ride_inspection
                  and not exists i in inspections of a with i.authority == STATE and i.status == PASSED
                                                        and i.scheduled_date <= stop.open_date ):
          posture = INSPECTION_HOLD      # blocking_error_id = ERR_INSPECTION_NOT_PASSED
      # 3
      elif ( count(assignments of the stop with status == SCHEDULED and crew_role == RIDE_OPERATOR)
             < MIN_OPERATORS_PER_RIDE * count(allocations of the stop with status IN {COMMITTED, OPERATING}) )
           or ( exists assignment of the stop with status == SCHEDULED whose Worker.compliance_status == VISA_LAPSED )
           or ( count(assignments of the stop with status == SCHEDULED and housing_pad_assigned == true)
                > Venue.housing_pads_available ):
          posture = LABOR_HOLD           # blocking_error_id = ERR_CREW_COVERAGE_INSUFFICIENT
      # 4
      else:
          posture = CLEAR                # blocking_error_id = null
    input_set: "children of the stop: PermitApplication (all statuses), InspectionOrder rows of the stop's non-terminal allocations, RideAllocation rows with status IN {RESERVED, COMMITTED, INSPECTION_HELD, OPERATING}, CrewAssignment rows with status == SCHEDULED"
    constants:
      MIN_OPERATORS_PER_RIDE: 1
    precision: "not applicable; enum output"
    variants: []

  - name: inspection_slot_selector
    trigger: "system inspection creation inside the RESERVED -> COMMITTED transition (both the cascaded and the explicit commit path)"
    algorithm: waterfall_allocation
    formula: |
      # eligibility filter: UTC calendar days D with date(stop.load_in_start) <= D <= date(stop.open_date)
      # whose slot usage is below capacity
      used(D) = count(InspectionOrder rows i with status IN {SCHEDULED, PASSED, FAILED}
                      and date(i.scheduled_date) == D
                      and Jurisdiction(i) == Jurisdiction(stop))
      candidates = [ D in that range where used(D) < Jurisdiction.inspection_slot_capacity_per_day ]
      # ranking: earliest day first (calendar days are unique, so the ranking never ties)
      chosen = min(candidates)  ->  scheduled_date = chosen at 14:00:00Z
      # empty-pool fallback: no synthetic row, allocation is held instead
      if candidates is empty: allocation transitions COMMITTED -> INSPECTION_HELD and no InspectionOrder is created
    input_set: "InspectionOrder rows in the same Jurisdiction with status IN {SCHEDULED, PASSED, FAILED}, bucketed by the half-open UTC day of scheduled_date"
    constants:
      SLOT_TIME_OF_DAY_UTC: "14:00:00"
    precision: "day buckets are half-open [D 00:00:00Z, D+1 00:00:00Z)"
    variants: []

  - name: makegood_amount
    trigger: "POST /make-goods (writes MakeGoodArrangement.amount_cents)"
    algorithm: weighted_scoring
    formula: |
      settlement = the Settlement of the contract with status == PROVISIONAL
                   (exactly one exists; creation is rejected otherwise)
      ratio = min(1, WeatherClosure.abated_hours / RouteStop.scheduled_operating_hours)
      base_cents = round_half_up(settlement.split_share_cents * ratio, 0)
      raw_cents  = round_half_up(base_cents * KIND_MULTIPLIER[kind], 0)
      cap_cents  = round_half_up(Contract.guarantee_cents * MAKEGOOD_CAP_PCT / 100, 0)
      already    = sum(m.amount_cents for m in make-goods of the contract with m.status IN {PROPOSED, ACCEPTED})
      if already + min(raw_cents, cap_cents) > cap_cents: raise ERR_MAKEGOOD_CAP_EXCEEDED
      amount_cents = min(raw_cents, cap_cents)
    input_set: "the adjudicated WeatherClosure named in the request, the contract's PROVISIONAL Settlement, and existing make-goods of the contract with status IN {PROPOSED, ACCEPTED}"
    constants:
      KIND_MULTIPLIER: { CASH_REFUND: 1.00, SPONSOR_CREDIT: 1.25, BONUS_DAY: 0.00 }
      MAKEGOOD_CAP_PCT: 30
    precision: "whole cents, round_half_up at each step"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number checked first)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the §1.7 role names"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "when X-User-Role == CrewChief, X-User-ID equals the {id} of the Worker in the path (a crew chief may read only their own assignments)"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "GET /workers/{id}/crew-assignments"

  - priority: 10
    category: existence
    check: "every path resource exists, validated left to right; the mapping is Route -> ERR_ROUTE_NOT_FOUND, RouteStop -> ERR_ROUTE_STOP_NOT_FOUND, Contract -> ERR_CONTRACT_NOT_FOUND, RideAllocation -> ERR_ALLOCATION_NOT_FOUND, PermitApplication -> ERR_PERMIT_NOT_FOUND, InspectionOrder -> ERR_INSPECTION_NOT_FOUND, CrewAssignment -> ERR_ASSIGNMENT_NOT_FOUND, Settlement -> ERR_SETTLEMENT_NOT_FOUND, WeatherClosure -> ERR_CLOSURE_NOT_FOUND, MakeGoodArrangement -> ERR_MAKEGOOD_NOT_FOUND, Worker -> ERR_WORKER_NOT_FOUND"
    error_id: ERR_ROUTE_STOP_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 11
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row (jurisdiction_id, venue_id, route_id, venue_id, previous_stop_id, route_stop_id, ride_id, worker_id, contract_id, ride_allocation_id, weather_closure_id)"
    error_id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http_status: 404
    applies_to: "all POST endpoints carrying a foreign key in the body"

  - priority: 20
    category: business_constraint
    check: "request body schema: required fields present, enums within their declared value sets, numeric ranges honored, shift_end > shift_start, closed_to > closed_from, valid_until > valid_from, unit_price_cents == 0 exactly when channel == COMP, visa_expires_on present exactly when employment_type == H2B_VISA, previous_stop_id belongs to the same route and does not close a cycle, defect_count >= 1 when result == FAIL, denial_reason present when decision == DENY"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 21
    category: business_constraint
    check: "Jurisdiction.state_code is unique across all jurisdictions"
    error_id: ERR_DUPLICATE_JURISDICTION_STATE
    http_status: 409
    applies_to: "POST /jurisdictions"

  - priority: 22
    category: business_constraint
    check: "the target RouteStop has no other Contract row with status IN {DRAFT, SENT, COUNTERED, EXECUTED}"
    error_id: ERR_DUPLICATE_ACTIVE_CONTRACT
    http_status: 409
    applies_to: "POST /contracts"

  - priority: 30
    category: state
    check: "expected_route_stop_version equals the current RouteStop.version"
    error_id: ERR_STALE_ROUTE_STOP_VERSION
    http_status: 412
    applies_to: "POST /ride-allocations"

  - priority: 31
    category: state
    check: "expected_contract_version equals the current Contract.version"
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
    applies_to: "POST /settlements"

  - priority: 32
    category: state
    check: "no Settlement of the contract has status == FINAL when a new settlement row is created or when a make-good response is ACCEPT. This money-closing check runs AHEAD of the RouteStop state gate at priority 41 (the stop is CLOSED precisely because the settlement went FINAL, so reporting the derived stop state would hide the real cause)"
    error_id: ERR_SETTLEMENT_ALREADY_FINAL
    http_status: 409
    applies_to: "POST /settlements, POST /make-goods/{id}/respond"

  - priority: 40
    category: state
    check: "Route is in the state the operation requires: DRAFT for sequence, SEQUENCED for commit, DRAFT or SEQUENCED for stop creation, SEQUENCED or COMMITTED for contract send, COMMITTED for contract execute"
    error_id: ERR_ROUTE_STATE_INVALID
    http_status: 409
    applies_to: "POST /routes/{id}/sequence, POST /routes/{id}/commit, POST /route-stops, POST /contracts/{id}/send, POST /contracts/{id}/execute"

  - priority: 41
    category: state
    check: "RouteStop is in the state the operation requires: PLANNED or CONFIRMED or SETUP for allocation reservation, CONFIRMED for begin-setup, SETUP for open-gates, OPEN for teardown, TEARDOWN for settlement finalize, OPEN or TEARDOWN for ticket sales, closure logging, closure adjudication and settlement creation, not CLOSED for release and crew cancel, PLANNED for contract execute, PLANNED or CONFIRMED or SETUP for permit submit, PLANNED through OPEN for cancel"
    error_id: ERR_STOP_STATE_INVALID
    http_status: 409
    applies_to: "POST /ride-allocations, POST /route-stops/{id}/begin-setup, POST /route-stops/{id}/open-gates, POST /route-stops/{id}/teardown, POST /route-stops/{id}/cancel, POST /route-stops/{id}/ticket-sales, POST /route-stops/{id}/weather-closures, POST /permit-applications/{id}/submit, POST /contracts/{id}/execute, POST /settlements, POST /settlements/{id}/finalize, POST /weather-closures/{id}/adjudicate, POST /ride-allocations/{id}/release, POST /crew-assignments/{id}/cancel"

  - priority: 42
    category: state
    check: "Contract is in the state the operation requires: DRAFT or COUNTERED for send, SENT for counter and execute, EXECUTED for settlement creation"
    error_id: ERR_CONTRACT_STATE_INVALID
    http_status: 409
    applies_to: "POST /contracts/{id}/send, POST /contracts/{id}/counter, POST /contracts/{id}/execute, POST /settlements"

  - priority: 43
    category: state
    check: "RideAllocation is in the state the operation requires: RESERVED for commit, RESERVED or COMMITTED or INSPECTION_HELD for release and for inspection scheduling"
    error_id: ERR_ALLOCATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /ride-allocations/{id}/commit, POST /ride-allocations/{id}/release, POST /inspection-orders"

  - priority: 44
    category: state
    check: "PermitApplication is DRAFT for submit and SUBMITTED for decision; InspectionOrder is SCHEDULED for result; CrewAssignment is SCHEDULED for cancel; WeatherClosure is LOGGED for adjudicate; MakeGoodArrangement is PROPOSED for respond. The error ids are ERR_PERMIT_STATE_INVALID, ERR_INSPECTION_STATE_INVALID, ERR_ASSIGNMENT_STATE_INVALID, ERR_CLOSURE_STATE_INVALID and ERR_MAKEGOOD_STATE_INVALID respectively"
    error_id: ERR_PERMIT_STATE_INVALID
    http_status: 409
    applies_to: "POST /permit-applications/{id}/submit, POST /permit-applications/{id}/decision, POST /inspection-orders/{id}/result, POST /crew-assignments/{id}/cancel, POST /weather-closures/{id}/adjudicate, POST /make-goods/{id}/respond"

  - priority: 45
    category: state
    check: "Settlement is PROVISIONAL for dispute and finalize, DISPUTED for reconcile, and the contract carries a PROVISIONAL row when a new settlement supersedes it; the already-FINAL case is caught earlier at priority 32 as ERR_SETTLEMENT_ALREADY_FINAL"
    error_id: ERR_SETTLEMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /settlements, POST /settlements/{id}/dispute, POST /settlements/{id}/reconcile, POST /settlements/{id}/finalize, POST /make-goods/{id}/respond"

  - priority: 46
    category: state
    check: "the InspectionOrder's RideAllocation is in status COMMITTED or INSPECTION_HELD when a result is recorded"
    error_id: ERR_ALLOCATION_NOT_INSPECTABLE
    http_status: 409
    applies_to: "POST /inspection-orders/{id}/result"

  - priority: 50
    category: auth
    check: "X-User-ID of the executing GeneralManager differs from Contract.last_sent_by_user_id (segregation of duties between sending and executing a deal)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /contracts/{id}/execute"

  - priority: 60
    category: business_safety
    check: "the Ride being allocated or committed is not OUT_OF_SERVICE"
    error_id: ERR_RIDE_OUT_OF_SERVICE
    http_status: 409
    applies_to: "POST /ride-allocations, POST /ride-allocations/{id}/commit"

  - priority: 61
    category: business_safety
    check: "for a RIDE_OPERATOR assignment, Worker.certified_ride_classes contains the ride_class of at least one RideAllocation of the stop with status IN {RESERVED, COMMITTED, INSPECTION_HELD, OPERATING}"
    error_id: ERR_WORKER_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /crew-assignments"

  - priority: 62
    category: business_safety
    check: "the assignment's shift_end is not later than Worker.visa_expires_on when Worker.employment_type == H2B_VISA"
    error_id: ERR_WORKER_VISA_LAPSED
    http_status: 422
    applies_to: "POST /crew-assignments"

  - priority: 63
    category: business_safety
    check: "consecutive_days(SCHEDULED_BASIS) for the worker inside the stop's jurisdiction, including the candidate assignment, does not exceed Jurisdiction.max_consecutive_work_days"
    error_id: ERR_CONSECUTIVE_DAYS_EXCEEDED
    http_status: 422
    applies_to: "POST /crew-assignments"

  - priority: 64
    category: business_safety
    check: "RouteStop.compliance_posture is not INSPECTION_HOLD when gates open (every state-inspection-required allocation has a PASSED STATE InspectionOrder scheduled on or before open_date and no allocation is INSPECTION_HELD)"
    error_id: ERR_INSPECTION_NOT_PASSED
    http_status: 409
    applies_to: "POST /route-stops/{id}/open-gates"

  - priority: 70
    category: business_temporal
    check: "the ride has no other allocation with status IN {RESERVED, COMMITTED, INSPECTION_HELD, OPERATING} whose occupation interval [occupation_start, occupation_end] either overlaps the candidate interval or is separated from it by fewer than (candidate stop or other stop travel_hours_from_previous, whichever stop comes later in its chain) + TRANSPORT_BUFFER_HOURS (= 4) hours"
    error_id: ERR_RIDE_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /ride-allocations"

  - priority: 71
    category: business_temporal
    check: "the worker has no other CrewAssignment with status == SCHEDULED whose half-open interval [shift_start, shift_end) intersects the candidate interval; back-to-back shifts sharing an endpoint are admitted"
    error_id: ERR_CREW_SHIFT_OVERLAP
    http_status: 409
    applies_to: "POST /crew-assignments"

  - priority: 72
    category: business_temporal
    check: "floor((stop.open_date - clock) / 86400 seconds) >= Jurisdiction.permit_lead_days; exact equality is admitted"
    error_id: ERR_PERMIT_LEAD_TIME_VIOLATION
    http_status: 422
    applies_to: "POST /permit-applications/{id}/submit"

  - priority: 73
    category: business_temporal
    check: "the manually scheduled inspection's UTC day bucket has fewer than Jurisdiction.inspection_slot_capacity_per_day InspectionOrder rows with status IN {SCHEDULED, PASSED, FAILED} in the same jurisdiction"
    error_id: ERR_INSPECTION_SLOTS_FULL
    http_status: 409
    applies_to: "POST /inspection-orders"

  - priority: 74
    category: business_temporal
    check: "the travel gap between every pair of chained stops covers travel_hours_from_previous + LOAD_OUT_BUFFER_HOURS"
    error_id: ERR_INSUFFICIENT_TRAVEL_WINDOW
    http_status: 422
    applies_to: "POST /routes/{id}/sequence"

  - priority: 75
    category: business_temporal
    check: "SETUP and TEARDOWN shifts lie inside [stop.load_in_start, stop.teardown_deadline]; RIDE_OPERATOR and TICKETING shifts lie inside [stop.open_date, stop.close_date]"
    error_id: ERR_SHIFT_OUTSIDE_STOP_WINDOW
    http_status: 422
    applies_to: "POST /crew-assignments"

  - priority: 76
    category: business_temporal
    check: "TicketSale.business_date lies inside [stop.open_date, stop.close_date]"
    error_id: ERR_SALE_OUTSIDE_OPERATING_WINDOW
    http_status: 422
    applies_to: "POST /route-stops/{id}/ticket-sales"

  - priority: 77
    category: business_temporal
    check: "the closure interval [closed_from, closed_to) intersects at least one daily operating window of the stop"
    error_id: ERR_CLOSURE_OUTSIDE_OPERATING_WINDOW
    http_status: 422
    applies_to: "POST /route-stops/{id}/weather-closures"

  - priority: 78
    category: business_temporal
    check: "the logical clock has reached the window the gate requires: load_in_start for begin-setup (ERR_LOAD_IN_NOT_OPEN), open_date for open-gates (ERR_GATES_BEFORE_OPEN_DATE), close_date for teardown (ERR_TEARDOWN_BEFORE_CLOSE_DATE)"
    error_id: ERR_LOAD_IN_NOT_OPEN
    http_status: 409
    applies_to: "POST /route-stops/{id}/begin-setup, POST /route-stops/{id}/open-gates, POST /route-stops/{id}/teardown"

  - priority: 80
    category: business_constraint
    check: "the route has at least one non-DARK stop when sequencing"
    error_id: ERR_ROUTE_HAS_NO_STOPS
    http_status: 422
    applies_to: "POST /routes/{id}/sequence"

  - priority: 81
    category: business_constraint
    check: "the previous_stop_id chain has exactly one head, covers every non-DARK stop exactly once, and contains no fork or cycle"
    error_id: ERR_STOP_CHAIN_INVALID
    http_status: 422
    applies_to: "POST /routes/{id}/sequence"

  - priority: 82
    category: business_constraint
    check: "every non-DARK stop of the route carries a Contract with status IN {DRAFT, SENT, COUNTERED, EXECUTED} when the route is committed"
    error_id: ERR_STOP_NOT_CONTRACTED
    http_status: 409
    applies_to: "POST /routes/{id}/commit"

  - priority: 83
    category: business_constraint
    check: "no other EXECUTED Contract on the same Venue has an overlapping [open_date, close_date] window when either contract's exclusivity IN {RIDES, FULL}"
    error_id: ERR_EXCLUSIVITY_CONFLICT
    http_status: 409
    applies_to: "POST /contracts/{id}/execute"

  - priority: 84
    category: business_constraint
    check: "Contract.negotiation_round < MAX_NEGOTIATION_ROUNDS (= 2) when a deal is sent or re-sent; a deal that has already been countered twice dead-ends at COUNTERED"
    error_id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /contracts/{id}/send"

  - priority: 85
    category: business_constraint
    check: "the stop has at least one allocation with status IN {COMMITTED, INSPECTION_HELD} when setup begins"
    error_id: ERR_NO_COMMITTED_RIDES
    http_status: 409
    applies_to: "POST /route-stops/{id}/begin-setup"

  - priority: 86
    category: business_constraint
    check: "count of allocations with status == COMMITTED >= Contract.ride_minimum_count when gates open"
    error_id: ERR_RIDE_MINIMUM_NOT_MET
    http_status: 409
    applies_to: "POST /route-stops/{id}/open-gates"

  - priority: 90
    category: business_fiscal
    check: "RouteStop.allocated_sqft_used + footprint_charged_sqft <= floor(Venue.lot_area_sqft * USABLE_LOT_PCT / 100) - ceil(Venue.expected_attendance * CIRCULATION_SQFT_PER_ATTENDEE)"
    error_id: ERR_LOT_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /ride-allocations"

  - priority: 91
    category: business_fiscal
    check: "RouteStop.power_amps_used + power_charged_amps <= round_half_up(Venue.power_amps_available * POWER_HEADROOM_PCT / 100, 1)"
    error_id: ERR_LOT_POWER_EXCEEDED
    http_status: 422
    applies_to: "POST /ride-allocations"

  - priority: 92
    category: business_fiscal
    check: "count of SCHEDULED assignments of the stop with housing_pad_assigned == true, including the candidate, <= Venue.housing_pads_available"
    error_id: ERR_HOUSING_PADS_EXHAUSTED
    http_status: 422
    applies_to: "POST /crew-assignments"

  - priority: 93
    category: business_fiscal
    check: "already-proposed-or-accepted make-good amounts plus the new amount do not exceed round_half_up(Contract.guarantee_cents * MAKEGOOD_CAP_PCT / 100, 0)"
    error_id: ERR_MAKEGOOD_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /make-goods"

  - priority: 100
    category: business_referential
    check: "an APPROVED TRANSPORT PermitApplication covering [load_in_start, teardown_deadline] exists when setup begins, and an APPROVED EVENT permit covering [open_date, close_date] exists when gates open; a permit that exists but whose valid_until is before the clock yields ERR_PERMIT_EXPIRED instead"
    error_id: ERR_PERMIT_NOT_APPROVED
    http_status: 409
    applies_to: "POST /route-stops/{id}/begin-setup, POST /route-stops/{id}/open-gates"

  - priority: 101
    category: business_referential
    check: "RouteStop.compliance_posture is not LABOR_HOLD when gates open (enough SCHEDULED RIDE_OPERATOR shifts for the committed rides, no VISA_LAPSED worker scheduled, housing pads not oversubscribed)"
    error_id: ERR_CREW_COVERAGE_INSUFFICIENT
    http_status: 409
    applies_to: "POST /route-stops/{id}/open-gates"

  - priority: 102
    category: business_referential
    check: "every WeatherClosure of the stop is ADJUDICATED before the settlement is finalized"
    error_id: ERR_CLOSURE_NOT_ADJUDICATED
    http_status: 409
    applies_to: "POST /settlements/{id}/finalize"

  - priority: 103
    category: business_referential
    check: "every MakeGoodArrangement of the contract has status IN {ACCEPTED, DECLINED} before the settlement is finalized"
    error_id: ERR_MAKEGOOD_PENDING
    http_status: 409
    applies_to: "POST /settlements/{id}/finalize"

  - priority: 104
    category: business_referential
    check: "the contract has exactly one Settlement with status == PROVISIONAL when a make-good is proposed"
    error_id: ERR_NO_PROVISIONAL_SETTLEMENT
    http_status: 409
    applies_to: "POST /make-goods"

  - priority: 105
    category: business_referential
    check: "the referenced WeatherClosure is ADJUDICATED and its route_stop_id equals the contract's route_stop_id"
    error_id: ERR_MAKEGOOD_STOP_MISMATCH
    http_status: 422
    applies_to: "POST /make-goods"

  - priority: 106
    category: business_referential
    check: "kind == CASH_REFUND is admitted only when WeatherClosure.cause IN {WIND, LIGHTNING}; RAIN and HEAT closures may only be compensated with SPONSOR_CREDIT or BONUS_DAY"
    error_id: ERR_REFUND_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /make-goods"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- reference data -------------------------------------------------------
  - method: POST
    path: "/jurisdictions"
    description: "Register a state jurisdiction with its permit, inspection, tax and labor rules"
    roles: [PlatformAdmin]
    code: 201
    input: [state_code, name, permit_lead_days, amusement_tax_pct, permit_fee_cents, "requires_state_ride_inspection?", "inspection_slot_capacity_per_day?", "max_consecutive_work_days?", "housing_permit_required?"]
    output: Jurisdiction
    side_effects: ["none"]

  - method: GET
    path: "/jurisdictions/{id}"
    description: "Read a jurisdiction"
    roles: [PlatformAdmin, RouteManager, GeneralManager, TicketingAuditor, ComplianceClerk]
    code: 200
    input: []
    output: Jurisdiction
    side_effects: []

  - method: POST
    path: "/venues"
    description: "Register a lot inside a jurisdiction"
    roles: [PlatformAdmin]
    code: 201
    input: [jurisdiction_id, name, city, lot_area_sqft, power_amps_available, expected_attendance, lot_surface, "housing_pads_available?"]
    output: Venue
    side_effects: ["none"]

  - method: GET
    path: "/venues/{id}"
    description: "Read a lot"
    roles: [PlatformAdmin, RouteManager, GeneralManager, TicketingAuditor, LotBoss]
    code: 200
    input: []
    output: Venue
    side_effects: []

  - method: GET
    path: "/venues"
    description: "List lots, filterable by jurisdiction"
    roles: [PlatformAdmin, RouteManager, GeneralManager, TicketingAuditor, LotBoss]
    code: 200
    input: ["jurisdiction_id?", "state_code?", "limit?", "offset?"]
    output: Venue[]
    side_effects: []

  - method: POST
    path: "/rides"
    description: "Register a ride in the inventory"
    roles: [PlatformAdmin]
    code: 201
    input: [name, ride_class, footprint_sqft, power_amps, crew_size_setup, setup_hours, axle_count, "requires_state_inspection?"]
    output: Ride
    side_effects: ["none"]

  - method: GET
    path: "/rides/{id}"
    description: "Read a ride, including its inventory status"
    roles: [PlatformAdmin, RouteManager, GeneralManager, TicketingAuditor, LotBoss, SafetyOfficer]
    code: 200
    input: []
    output: Ride
    side_effects: []

  - method: POST
    path: "/workers"
    description: "Register a worker (permanent, seasonal or H-2B visa program)"
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, employment_type, hourly_rate_cents, "visa_expires_on?", "certified_ride_classes?", "housing_required?"]
    output: Worker
    side_effects: ["computes Worker.compliance_status from visa_expires_on against the logical clock"]

  - method: GET
    path: "/workers/{id}"
    description: "Read a worker, including scheduled hours, worked days and visa compliance"
    roles: [PlatformAdmin, RouteManager, GeneralManager, TicketingAuditor, LotBoss, CrewChief]
    code: 200
    input: []
    output: Worker
    side_effects: []

  # --- route planning -------------------------------------------------------
  - method: POST
    path: "/routes"
    description: "Create a season route in DRAFT"
    roles: [RouteManager, PlatformAdmin]
    code: 201
    input: [name, season_year, home_base_state]
    output: Route
    side_effects: ["none"]

  - method: GET
    path: "/routes/{id}"
    description: "Read a route with its computed stop, haul, travel and guarantee aggregates"
    roles: [PlatformAdmin, RouteManager, GeneralManager, TicketingAuditor, ContractNegotiator]
    code: 200
    input: []
    output: Route
    side_effects: []

  - method: POST
    path: "/route-stops"
    description: "Add a stop to a route; previous_stop_id links it into the haul chain"
    roles: [RouteManager]
    code: 201
    input: [route_id, venue_id, load_in_start, open_date, close_date, teardown_deadline, "previous_stop_id?", "haul_miles_from_previous?"]
    output: RouteStop
    side_effects:
      - "computes operating_days and scheduled_operating_hours"
      - "recomputes Route.stop_count and Route.total_haul_miles"
      - "reverts Route SEQUENCED -> DRAFT and clears every stop's sequence_index and travel_hours_from_previous"
      - "computes RouteStop.compliance_posture (PERMIT_HOLD at creation)"

  - method: GET
    path: "/route-stops/{id}"
    description: "Read a stop with its computed capacity, labor, closure and posture fields"
    roles: [PlatformAdmin, RouteManager, GeneralManager, TicketingAuditor, LotBoss, ComplianceClerk]
    code: 200
    input: []
    output: RouteStop
    side_effects: []

  - method: GET
    path: "/route-stops"
    description: "List stops, filterable by route, venue, chain predecessor and status"
    roles: [PlatformAdmin, RouteManager, GeneralManager, TicketingAuditor, LotBoss, ComplianceClerk]
    code: 200
    input: ["route_id?", "venue_id?", "previous_stop_id?", "status?", "limit?", "offset?"]
    output: RouteStop[]
    side_effects: []

  - method: POST
    path: "/routes/{id}/sequence"
    description: "Validate the haul chain and compute travel times; DRAFT -> SEQUENCED"
    roles: [RouteManager]
    code: 200
    input: []
    output: Route
    side_effects:
      - "runs calculations.route_travel_feasibility over the chain"
      - "writes RouteStop.sequence_index and RouteStop.travel_hours_from_previous on every non-DARK stop"
      - "recomputes Route.total_travel_hours, Route.total_haul_miles, Route.stop_count"

  - method: POST
    path: "/routes/{id}/commit"
    description: "Lock the route for execution; SEQUENCED -> COMMITTED"
    roles: [RouteManager, GeneralManager]
    code: 200
    input: []
    output: Route
    side_effects: ["increments Route.version by 1"]

  - method: POST
    path: "/route-stops/{id}/begin-setup"
    description: "Move the lot into setup once load-in opens and the transport permit is approved; CONFIRMED -> SETUP"
    roles: [RouteManager, LotBoss]
    code: 200
    input: []
    output: RouteStop
    side_effects:
      - "expires any APPROVED permit whose valid_until is before the clock"
      - "recomputes RouteStop.compliance_posture"

  - method: POST
    path: "/route-stops/{id}/open-gates"
    description: "Open the midway to the public; SETUP -> OPEN, committed allocations start operating"
    roles: [RouteManager, LotBoss]
    code: 200
    input: []
    output: RouteStop
    side_effects:
      - "every COMMITTED allocation transitions to OPERATING and RouteStop.operating_ride_count is recomputed"
      - "Route transitions COMMITTED -> IN_PROGRESS"
      - "recomputes RouteStop.compliance_posture"

  - method: POST
    path: "/route-stops/{id}/teardown"
    description: "Strike the lot after the final operating hour; OPEN -> TEARDOWN"
    roles: [RouteManager, LotBoss]
    code: 200
    input: []
    output: RouteStop
    side_effects:
      - "every OPERATING allocation transitions to STRUCK and each ride returns to AVAILABLE unless OUT_OF_SERVICE"
      - "freezes RouteStop.operating_ride_count"

  - method: POST
    path: "/route-stops/{id}/cancel"
    description: "Go dark on a lot; cascades to the contract, allocations, crew and permits"
    roles: [RouteManager, GeneralManager]
    code: 200
    input: []
    output: RouteStop
    side_effects:
      - "EXECUTED contract transitions to TERMINATED and Route.total_guaranteed_cents decreases by its guarantee_cents"
      - "non-terminal allocations transition to RELEASED and their rides return to AVAILABLE"
      - "SCHEDULED crew assignments transition to RELEASED, decreasing Worker.scheduled_hours_total and RouteStop.labor_cost_provisional_cents"
      - "SUBMITTED and APPROVED permits transition to EXPIRED"
      - "Route reverts SEQUENCED -> DRAFT and recomputes stop_count / closed_stop_count"

  - method: GET
    path: "/route-stops/{id}/readiness"
    description: "Computed readiness read: the stop's posture, the blocking error id it would raise, and the ride-minimum comparison"
    roles: [PlatformAdmin, RouteManager, GeneralManager, TicketingAuditor, LotBoss, ComplianceClerk]
    code: 200
    input: []
    output: "{ route_stop_id: string, compliance_posture: string, blocking_error_id: string, event_permit_ok: boolean, inspections_ok: boolean, crew_coverage_ok: boolean, committed_ride_count: integer, ride_minimum_required: integer }"
    side_effects: []

  # --- contracts ------------------------------------------------------------
  - method: POST
    path: "/contracts"
    description: "Draft a fair or community event contract for a stop"
    roles: [ContractNegotiator]
    code: 201
    input: [route_stop_id, counterparty_name, revenue_split_pct_operator, "sponsor_name?", "guarantee_cents?", "ride_minimum_count?", "exclusivity?", "settlement_basis?"]
    output: Contract
    side_effects: ["none"]

  - method: GET
    path: "/contracts/{id}"
    description: "Read a contract with its negotiation round and terms"
    roles: [PlatformAdmin, RouteManager, GeneralManager, TicketingAuditor, ContractNegotiator]
    code: 200
    input: []
    output: Contract
    side_effects: []

  - method: GET
    path: "/contracts"
    description: "List contracts, filterable by stop and status"
    roles: [PlatformAdmin, RouteManager, GeneralManager, TicketingAuditor, ContractNegotiator]
    code: 200
    input: ["route_stop_id?", "status?", "limit?", "offset?"]
    output: Contract[]
    side_effects: []

  - method: POST
    path: "/contracts/{id}/send"
    description: "Send the deal to the counterparty; DRAFT or COUNTERED -> SENT and stamps last_sent_by_user_id"
    roles: [ContractNegotiator]
    code: 200
    input: []
    output: Contract
    side_effects: ["sets Contract.last_sent_by_user_id to the caller's X-User-ID"]

  - method: POST
    path: "/contracts/{id}/counter"
    description: "Record the counterparty's counter; SENT -> COUNTERED with new terms, admitted only while the round budget is unspent"
    roles: [ContractNegotiator]
    code: 200
    input: ["revenue_split_pct_operator?", "guarantee_cents?", "ride_minimum_count?"]
    output: Contract
    side_effects:
      - "increments Contract.negotiation_round by 1 and overwrites revenue_split_pct_operator, guarantee_cents and ride_minimum_count with the values supplied in the request body"

  - method: POST
    path: "/contracts/{id}/execute"
    description: "Countersign the deal; SENT -> EXECUTED, confirms the stop and cascades to allocations and inspections"
    roles: [GeneralManager]
    code: 200
    input: []
    output: Contract
    side_effects:
      - "sets executed_at and increases Route.total_guaranteed_cents by guarantee_cents"
      - "RouteStop transitions PLANNED -> CONFIRMED, RESERVED allocations transition to COMMITTED, their rides become ASSIGNED, STATE inspections are created via the slot selector, and the stop's posture is recomputed"

  # --- ride inventory allocation -------------------------------------------
  - method: POST
    path: "/ride-allocations"
    description: "Reserve a ride onto a lot; charges footprint and amperage against the lot budget under optimistic concurrency on the stop"
    roles: [LotBoss]
    code: 201
    input: [ride_id, route_stop_id, expected_route_stop_version]
    output: RideAllocation
    side_effects:
      - "runs calculations.lot_capacity_charge to write footprint_charged_sqft, power_charged_amps, occupation_start, occupation_end"
      - "recomputes RouteStop.allocated_sqft_used and RouteStop.power_amps_used"
      - "increments RouteStop.version by 1"

  - method: GET
    path: "/ride-allocations/{id}"
    description: "Read an allocation"
    roles: [PlatformAdmin, RouteManager, GeneralManager, TicketingAuditor, LotBoss, SafetyOfficer]
    code: 200
    input: []
    output: RideAllocation
    side_effects: []

  - method: GET
    path: "/ride-allocations"
    description: "List allocations, filterable by ride, stop and status"
    roles: [PlatformAdmin, RouteManager, GeneralManager, TicketingAuditor, LotBoss, SafetyOfficer]
    code: 200
    input: ["ride_id?", "route_stop_id?", "status?", "limit?", "offset?"]
    output: RideAllocation[]
    side_effects: []

  - method: POST
    path: "/ride-allocations/{id}/commit"
    description: "Commit a reserved allocation on a confirmed lot; RESERVED -> COMMITTED"
    roles: [LotBoss]
    code: 200
    input: []
    output: RideAllocation
    side_effects:
      - "sets Ride.status = ASSIGNED"
      - "creates a STATE InspectionOrder through the slot selector, or holds the allocation as INSPECTION_HELD when no slot remains"
      - "recomputes RouteStop.compliance_posture"

  - method: POST
    path: "/ride-allocations/{id}/release"
    description: "Release an allocation and return its footprint, amperage and ride to the pool; also the mid-run pull-off path for an OPERATING ride"
    roles: [LotBoss, RouteManager]
    code: 200
    input: []
    output: RideAllocation
    side_effects:
      - "sets released_at, decreases RouteStop.allocated_sqft_used and RouteStop.power_amps_used by the charged amounts"
      - "returns the ride to AVAILABLE when it holds no other non-terminal allocation and is not OUT_OF_SERVICE"
      - "recomputes RouteStop.operating_ride_count and RouteStop.compliance_posture"

  # --- permits --------------------------------------------------------------
  - method: POST
    path: "/permit-applications"
    description: "Draft a jurisdiction permit for a stop; the fee is computed from the jurisdiction and declared axles"
    roles: [ComplianceClerk]
    code: 201
    input: [route_stop_id, permit_type, valid_from, valid_until, "axles_declared?"]
    output: PermitApplication
    side_effects: ["computes fee_cents from Jurisdiction.permit_fee_cents plus the TRANSPORT axle surcharge"]

  - method: GET
    path: "/route-stops/{id}/permit-applications"
    description: "List the permits filed for a stop"
    roles: [PlatformAdmin, RouteManager, GeneralManager, TicketingAuditor, ComplianceClerk, JurisdictionOfficer]
    code: 200
    input: ["permit_type?", "status?", "limit?", "offset?"]
    output: PermitApplication[]
    side_effects: []

  - method: POST
    path: "/permit-applications/{id}/submit"
    description: "File the permit with the jurisdiction; DRAFT -> SUBMITTED, subject to the lead-time rule"
    roles: [ComplianceClerk]
    code: 200
    input: []
    output: PermitApplication
    side_effects: ["sets submitted_at to the logical clock"]

  - method: POST
    path: "/permit-applications/{id}/decision"
    description: "Record the jurisdiction's decision; SUBMITTED -> APPROVED or DENIED"
    roles: [JurisdictionOfficer]
    code: 200
    input: [decision, "denial_reason?"]
    output: PermitApplication
    side_effects:
      - "sets decided_at and, on denial, denial_reason"
      - "recomputes RouteStop.compliance_posture"

  # --- inspections ----------------------------------------------------------
  - method: POST
    path: "/inspection-orders"
    description: "Schedule a ride inspection against an allocation; consumes one jurisdiction slot on the scheduled UTC day"
    roles: [SafetyOfficer]
    code: 201
    input: [ride_allocation_id, authority, scheduled_date]
    output: InspectionOrder
    side_effects:
      - "computes attempt_number as 1 + the number of FAILED inspections on the same allocation"
      - "recomputes RouteStop.compliance_posture"

  - method: GET
    path: "/ride-allocations/{id}/inspections"
    description: "List the inspections ordered against an allocation"
    roles: [PlatformAdmin, RouteManager, GeneralManager, TicketingAuditor, SafetyOfficer, JurisdictionOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: InspectionOrder[]
    side_effects: []

  - method: POST
    path: "/inspection-orders/{id}/result"
    description: "Record the inspecting authority's result; SCHEDULED -> PASSED or FAILED with divergent cascades"
    roles: [JurisdictionOfficer]
    code: 200
    input: [result, "defect_count?"]
    output: InspectionOrder
    side_effects:
      - "PASS: releases an INSPECTION_HELD allocation back to COMMITTED and recomputes the posture"
      - "FAIL: holds the allocation as INSPECTION_HELD, sets the ride OUT_OF_SERVICE at or above the defect threshold, and sets the posture to INSPECTION_HOLD"

  # --- workforce ------------------------------------------------------------
  - method: POST
    path: "/crew-assignments"
    description: "Assign a worker to a shift on a lot; computes labor cost and enforces certification, visa, overlap, consecutive-day and housing rules"
    roles: [LotBoss]
    code: 201
    input: [route_stop_id, worker_id, crew_role, shift_start, shift_end]
    output: CrewAssignment
    side_effects:
      - "runs calculations.stop_labor_cost to write shift_hours, cost_cents, housing_pad_assigned"
      - "increases Worker.scheduled_hours_total and RouteStop.labor_cost_provisional_cents"
      - "recomputes RouteStop.compliance_posture"

  - method: GET
    path: "/route-stops/{id}/crew-assignments"
    description: "List the crew booked on a lot"
    roles: [PlatformAdmin, RouteManager, GeneralManager, TicketingAuditor, LotBoss]
    code: 200
    input: ["crew_role?", "status?", "limit?", "offset?"]
    output: CrewAssignment[]
    side_effects: []

  - method: GET
    path: "/workers/{id}/crew-assignments"
    description: "List a worker's assignments; a CrewChief may read only their own"
    roles: [PlatformAdmin, RouteManager, GeneralManager, TicketingAuditor, LotBoss, CrewChief]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CrewAssignment[]
    side_effects: []

  - method: POST
    path: "/crew-assignments/{id}/cancel"
    description: "Cancel a booked shift and reverse its labor ledgers; SCHEDULED -> RELEASED"
    roles: [LotBoss]
    code: 200
    input: []
    output: CrewAssignment
    side_effects:
      - "decreases Worker.scheduled_hours_total by shift_hours and RouteStop.labor_cost_provisional_cents by cost_cents"
      - "frees the housing pad and recomputes RouteStop.compliance_posture"

  # --- ticketing and settlement --------------------------------------------
  - method: POST
    path: "/route-stops/{id}/ticket-sales"
    description: "Record a wristband, single-ride, presale or comp batch for a lot"
    roles: [TicketingAuditor]
    code: 201
    input: [channel, units, unit_price_cents, business_date]
    output: TicketSale
    side_effects: ["computes gross_cents as units * unit_price_cents"]

  - method: GET
    path: "/route-stops/{id}/ticket-sales"
    description: "List the sales batches booked to a lot"
    roles: [PlatformAdmin, RouteManager, GeneralManager, TicketingAuditor]
    code: 200
    input: ["channel?", "limit?", "offset?"]
    output: TicketSale[]
    side_effects: []

  - method: POST
    path: "/settlements"
    description: "Build a provisional settlement for a contract under optimistic concurrency on the deal; supersedes any prior provisional or disputed row"
    roles: [TicketingAuditor]
    code: 201
    input: [contract_id, expected_contract_version]
    output: Settlement
    side_effects:
      - "runs calculations.stop_settlement variant PROVISIONAL"
      - "transitions any prior Settlement of the contract with status IN {PROVISIONAL, DISPUTED} to SUPERSEDED"
      - "increments Contract.version by 1"

  - method: GET
    path: "/settlements/{id}"
    description: "Read a settlement with every computed amount"
    roles: [PlatformAdmin, RouteManager, GeneralManager, TicketingAuditor, ContractNegotiator]
    code: 200
    input: []
    output: Settlement
    side_effects: []

  - method: GET
    path: "/contracts/{id}/settlements"
    description: "List the settlement rows of a contract, newest last"
    roles: [PlatformAdmin, RouteManager, GeneralManager, TicketingAuditor, ContractNegotiator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Settlement[]
    side_effects: []

  - method: POST
    path: "/settlements/{id}/dispute"
    description: "Counterparty disputes the provisional numbers; PROVISIONAL -> DISPUTED"
    roles: [ContractNegotiator]
    code: 200
    input: [dispute_reason]
    output: Settlement
    side_effects: ["stores dispute_reason"]

  - method: POST
    path: "/settlements/{id}/reconcile"
    description: "Re-run the provisional calculation over the current sales rows; DISPUTED -> PROVISIONAL"
    roles: [TicketingAuditor]
    code: 200
    input: []
    output: Settlement
    side_effects:
      - "re-runs calculations.stop_settlement variant PROVISIONAL and overwrites every computed amount"
      - "clears dispute_reason"

  - method: POST
    path: "/settlements/{id}/finalize"
    description: "Finalize the lot's money; PROVISIONAL -> FINAL with the FINAL variant, then closes the stop"
    roles: [GeneralManager]
    code: 200
    input: []
    output: Settlement
    side_effects:
      - "re-runs calculations.stop_settlement variant FINAL, sets variant = FINAL and finalized_at"
      - "RouteStop transitions TEARDOWN -> CLOSED, SCHEDULED crew assignments transition to COMPLETED, Worker.worked_days_count is recomputed, and Route closes when every stop is terminal"

  # --- weather and make-goods ----------------------------------------------
  - method: POST
    path: "/route-stops/{id}/weather-closures"
    description: "Log a weather closure window against an operating lot"
    roles: [RouteManager, LotBoss]
    code: 201
    input: [cause, closed_from, closed_to]
    output: WeatherClosure
    side_effects: ["computes closure_hours_raw"]

  - method: GET
    path: "/route-stops/{id}/weather-closures"
    description: "List the closures logged against a lot"
    roles: [PlatformAdmin, RouteManager, GeneralManager, TicketingAuditor, LotBoss]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: WeatherClosure[]
    side_effects: []

  - method: GET
    path: "/weather-closures/{id}"
    description: "Read a closure with its raw and abated hours"
    roles: [PlatformAdmin, RouteManager, GeneralManager, TicketingAuditor, LotBoss]
    code: 200
    input: []
    output: WeatherClosure
    side_effects: []

  - method: POST
    path: "/weather-closures/{id}/adjudicate"
    description: "Adjudicate a closure; clips and merges it into the lot's abated hours"
    roles: [GeneralManager]
    code: 200
    input: []
    output: WeatherClosure
    side_effects:
      - "runs calculations.weather_abatement_hours to write abated_hours and RouteStop.closure_hours_adjudicated"

  - method: POST
    path: "/make-goods"
    description: "Propose a sponsor make-good against an adjudicated closure"
    roles: [GeneralManager]
    code: 201
    input: [weather_closure_id, contract_id, kind]
    output: MakeGoodArrangement
    side_effects: ["runs calculations.makegood_amount to write amount_cents"]

  - method: GET
    path: "/contracts/{id}/make-goods"
    description: "List the make-goods proposed under a contract"
    roles: [PlatformAdmin, RouteManager, GeneralManager, TicketingAuditor, ContractNegotiator]
    code: 200
    input: ["status?", "kind?", "limit?", "offset?"]
    output: MakeGoodArrangement[]
    side_effects: []

  - method: GET
    path: "/weather-closures/{id}/make-goods"
    description: "List the make-goods attached to a closure"
    roles: [PlatformAdmin, RouteManager, GeneralManager, TicketingAuditor, ContractNegotiator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: MakeGoodArrangement[]
    side_effects: []

  - method: POST
    path: "/make-goods/{id}/respond"
    description: "Record the sponsor's response; PROPOSED -> ACCEPTED or DECLINED"
    roles: [ContractNegotiator]
    code: 200
    input: [response]
    output: MakeGoodArrangement
    side_effects: ["sets responded_at; an ACCEPTED CASH_REFUND enters the FINAL settlement deduction"]

  # --- test-driving surface -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["re-evaluates Worker.compliance_status on read; no stored state changes"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not a declared §1.7 role"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed on the endpoint, or a CrewChief reads another worker's assignments"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the GeneralManager executing a contract is the same X-User-ID that last sent it"
  - id: ERR_ROUTE_NOT_FOUND
    http: 404
    condition: "the {id} in a /routes path matches no Route"
  - id: ERR_ROUTE_STOP_NOT_FOUND
    http: 404
    condition: "the {id} in a /route-stops path matches no RouteStop"
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "the {id} in a /contracts path matches no Contract"
  - id: ERR_ALLOCATION_NOT_FOUND
    http: 404
    condition: "the {id} in a /ride-allocations path matches no RideAllocation"
  - id: ERR_PERMIT_NOT_FOUND
    http: 404
    condition: "the {id} in a /permit-applications path matches no PermitApplication"
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "the {id} in an /inspection-orders path matches no InspectionOrder"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "the {id} in a /crew-assignments path matches no CrewAssignment"
  - id: ERR_SETTLEMENT_NOT_FOUND
    http: 404
    condition: "the {id} in a /settlements path matches no Settlement"
  - id: ERR_CLOSURE_NOT_FOUND
    http: 404
    condition: "the {id} in a /weather-closures path matches no WeatherClosure"
  - id: ERR_MAKEGOOD_NOT_FOUND
    http: 404
    condition: "the {id} in a /make-goods path matches no MakeGoodArrangement"
  - id: ERR_WORKER_NOT_FOUND
    http: 404
    condition: "the {id} in a /workers path matches no Worker"
  - id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http: 404
    condition: "a foreign key in the request body (jurisdiction_id, venue_id, route_id, previous_stop_id, route_stop_id, ride_id, worker_id, contract_id, ride_allocation_id, weather_closure_id) matches no row"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown enum value, out-of-range number, inverted interval, COMP price rule broken, visa field mismatched, defect_count missing on FAIL, denial_reason missing on DENY, or previous_stop_id from another route"
  - id: ERR_DUPLICATE_JURISDICTION_STATE
    http: 409
    condition: "a Jurisdiction with the same state_code already exists"
  - id: ERR_DUPLICATE_ACTIVE_CONTRACT
    http: 409
    condition: "the stop already carries a Contract with status IN {DRAFT, SENT, COUNTERED, EXECUTED}"
  - id: ERR_STALE_ROUTE_STOP_VERSION
    http: 412
    condition: "expected_route_stop_version does not match the current RouteStop.version"
  - id: ERR_STALE_CONTRACT_VERSION
    http: 412
    condition: "expected_contract_version does not match the current Contract.version"
  - id: ERR_ROUTE_STATE_INVALID
    http: 409
    condition: "the Route is not in the state the operation requires (sequence, commit, stop creation, contract send, contract execute)"
  - id: ERR_STOP_STATE_INVALID
    http: 409
    condition: "the RouteStop is not in the state the operation requires (allocation, setup, gates, teardown, cancel, sales, closures, permit submit, settlement)"
  - id: ERR_CONTRACT_STATE_INVALID
    http: 409
    condition: "the Contract is not in the state the operation requires (send, counter, execute, settlement creation)"
  - id: ERR_ALLOCATION_STATE_INVALID
    http: 409
    condition: "the RideAllocation is not in the state the operation requires (commit, release, inspection scheduling)"
  - id: ERR_PERMIT_STATE_INVALID
    http: 409
    condition: "the PermitApplication is not DRAFT for submit or not SUBMITTED for a decision"
  - id: ERR_INSPECTION_STATE_INVALID
    http: 409
    condition: "the InspectionOrder is not SCHEDULED when a result is recorded"
  - id: ERR_ASSIGNMENT_STATE_INVALID
    http: 409
    condition: "the CrewAssignment is not SCHEDULED when cancelled"
  - id: ERR_CLOSURE_STATE_INVALID
    http: 409
    condition: "the WeatherClosure is not LOGGED when adjudicated"
  - id: ERR_MAKEGOOD_STATE_INVALID
    http: 409
    condition: "the MakeGoodArrangement is not PROPOSED when a response is recorded"
  - id: ERR_SETTLEMENT_STATE_INVALID
    http: 409
    condition: "the Settlement is not PROVISIONAL for dispute/finalize or not DISPUTED for reconcile"
  - id: ERR_SETTLEMENT_ALREADY_FINAL
    http: 409
    condition: "a Settlement of the contract is already FINAL when a new settlement is created or a make-good is accepted"
  - id: ERR_ALLOCATION_NOT_INSPECTABLE
    http: 409
    condition: "the inspected allocation is not COMMITTED or INSPECTION_HELD"
  - id: ERR_RIDE_OUT_OF_SERVICE
    http: 409
    condition: "the ride is OUT_OF_SERVICE when reserved or committed"
  - id: ERR_WORKER_NOT_CERTIFIED
    http: 422
    condition: "a RIDE_OPERATOR assignment names a worker not certified for any ride class allocated to the stop"
  - id: ERR_WORKER_VISA_LAPSED
    http: 422
    condition: "an H-2B worker's shift_end falls after visa_expires_on"
  - id: ERR_CONSECUTIVE_DAYS_EXCEEDED
    http: 422
    condition: "the candidate assignment pushes the worker's scheduled-basis consecutive-day run past the jurisdiction limit"
  - id: ERR_INSPECTION_NOT_PASSED
    http: 409
    condition: "gates are opened while the stop's posture is INSPECTION_HOLD"
  - id: ERR_RIDE_DOUBLE_BOOKED
    http: 409
    condition: "the ride's occupation interval at another stop overlaps the candidate interval or leaves less than the required travel-plus-transport buffer"
  - id: ERR_CREW_SHIFT_OVERLAP
    http: 409
    condition: "the worker already holds a SCHEDULED shift whose half-open interval intersects the candidate shift"
  - id: ERR_PERMIT_LEAD_TIME_VIOLATION
    http: 422
    condition: "the permit is filed fewer than Jurisdiction.permit_lead_days whole days before the stop's open_date"
  - id: ERR_INSPECTION_SLOTS_FULL
    http: 409
    condition: "the jurisdiction's inspection day bucket is already at capacity"
  - id: ERR_INSUFFICIENT_TRAVEL_WINDOW
    http: 422
    condition: "a chained stop's load-in begins before the previous stop's teardown plus travel and load-out buffer"
  - id: ERR_SHIFT_OUTSIDE_STOP_WINDOW
    http: 422
    condition: "the shift falls outside the window its crew_role permits"
  - id: ERR_SALE_OUTSIDE_OPERATING_WINDOW
    http: 422
    condition: "the sale's business_date falls outside [open_date, close_date]"
  - id: ERR_CLOSURE_OUTSIDE_OPERATING_WINDOW
    http: 422
    condition: "the closure interval intersects no daily operating window of the stop"
  - id: ERR_LOAD_IN_NOT_OPEN
    http: 409
    condition: "setup begins before the stop's load_in_start"
  - id: ERR_GATES_BEFORE_OPEN_DATE
    http: 409
    condition: "gates are opened before the stop's open_date"
  - id: ERR_TEARDOWN_BEFORE_CLOSE_DATE
    http: 409
    condition: "teardown starts before the stop's close_date"
  - id: ERR_ROUTE_HAS_NO_STOPS
    http: 422
    condition: "a route with no non-DARK stops is sequenced"
  - id: ERR_STOP_CHAIN_INVALID
    http: 422
    condition: "the previous_stop_id chain has no single head, forks, cycles, or leaves a stop unreachable"
  - id: ERR_STOP_NOT_CONTRACTED
    http: 409
    condition: "a route is committed while some non-DARK stop carries no non-terminal contract"
  - id: ERR_EXCLUSIVITY_CONFLICT
    http: 409
    condition: "an exclusivity provision collides with another executed contract on the same venue in an overlapping window"
  - id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http: 409
    condition: "POST /contracts/{id}/send is called on a COUNTERED contract whose negotiation_round has already reached MAX_NEGOTIATION_ROUNDS (= 2)"
  - id: ERR_NO_COMMITTED_RIDES
    http: 409
    condition: "setup begins with no committed or held allocation on the lot"
  - id: ERR_RIDE_MINIMUM_NOT_MET
    http: 409
    condition: "committed rides are fewer than the contract's ride_minimum_count when gates open"
  - id: ERR_LOT_CAPACITY_EXCEEDED
    http: 422
    condition: "the reservation's charged footprint overruns the lot's usable area net of the circulation reserve"
  - id: ERR_LOT_POWER_EXCEEDED
    http: 422
    condition: "the reservation's charged amperage overruns the lot's service headroom"
  - id: ERR_HOUSING_PADS_EXHAUSTED
    http: 422
    condition: "housing-required assignments on the lot would exceed Venue.housing_pads_available"
  - id: ERR_MAKEGOOD_CAP_EXCEEDED
    http: 422
    condition: "proposed plus accepted make-good amounts would exceed the guarantee-based cap"
  - id: ERR_PERMIT_NOT_APPROVED
    http: 409
    condition: "the TRANSPORT permit is missing at setup or the EVENT permit is missing when gates open"
  - id: ERR_PERMIT_EXPIRED
    http: 409
    condition: "the gating permit exists but its valid_until precedes the logical clock"
  - id: ERR_CREW_COVERAGE_INSUFFICIENT
    http: 409
    condition: "gates are opened while the stop's posture is LABOR_HOLD"
  - id: ERR_CLOSURE_NOT_ADJUDICATED
    http: 409
    condition: "a settlement is finalized while some closure of the stop is still LOGGED"
  - id: ERR_MAKEGOOD_PENDING
    http: 409
    condition: "a settlement is finalized while some make-good of the contract is still PROPOSED"
  - id: ERR_NO_PROVISIONAL_SETTLEMENT
    http: 409
    condition: "a make-good is proposed while the contract has no PROVISIONAL settlement"
  - id: ERR_MAKEGOOD_STOP_MISMATCH
    http: 422
    condition: "the referenced closure is not adjudicated or belongs to a different stop than the contract"
  - id: ERR_REFUND_NOT_ELIGIBLE
    http: 422
    condition: "a CASH_REFUND make-good is proposed against a RAIN or HEAT closure"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Back-office operator who seeds reference data (jurisdictions, venues, rides, workers) and controls the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /jurisdictions"
      - "POST /venues"
      - "POST /rides"
      - "POST /workers"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /routes"
      - "every GET read endpoint"

  - name: RouteManager
    description: "Plans the season route, adds stops, sequences and commits the route, drives the lot lifecycle and logs weather closures"
    identity: "opaque"
    exclusive_operations:
      - "POST /route-stops"
      - "POST /routes/{id}/sequence"
    shared_operations:
      - "POST /routes"
      - "POST /routes/{id}/commit"
      - "POST /route-stops/{id}/begin-setup"
      - "POST /route-stops/{id}/open-gates"
      - "POST /route-stops/{id}/teardown"
      - "POST /route-stops/{id}/cancel"
      - "POST /route-stops/{id}/weather-closures"
      - "POST /ride-allocations/{id}/release"
      - "GET reads on routes, stops, venues, rides, workers, contracts, allocations, settlements, closures"

  - name: ContractNegotiator
    description: "Drafts, sends and counters fair contracts and records counterparty responses; may never countersign a deal they sent"
    identity: "opaque"
    exclusive_operations:
      - "POST /contracts"
      - "POST /contracts/{id}/send"
      - "POST /contracts/{id}/counter"
      - "POST /settlements/{id}/dispute"
      - "POST /make-goods/{id}/respond"
    shared_operations:
      - "GET reads on routes, contracts, settlements, make-goods"

  - name: GeneralManager
    description: "Countersigns deals, commits routes, adjudicates weather, proposes make-goods and finalizes money"
    identity: "opaque"
    exclusive_operations:
      - "POST /contracts/{id}/execute"
      - "POST /settlements/{id}/finalize"
      - "POST /weather-closures/{id}/adjudicate"
      - "POST /make-goods"
    shared_operations:
      - "POST /routes/{id}/commit"
      - "POST /route-stops/{id}/cancel"
      - "every GET read endpoint"

  - name: LotBoss
    description: "Runs the lot: reserves, commits and releases rides, books and cancels crew, drives setup/gates/teardown"
    identity: "opaque"
    exclusive_operations:
      - "POST /ride-allocations"
      - "POST /ride-allocations/{id}/commit"
      - "POST /crew-assignments"
      - "POST /crew-assignments/{id}/cancel"
    shared_operations:
      - "POST /ride-allocations/{id}/release"
      - "POST /route-stops/{id}/begin-setup"
      - "POST /route-stops/{id}/open-gates"
      - "POST /route-stops/{id}/teardown"
      - "POST /route-stops/{id}/weather-closures"
      - "GET reads on stops, venues, rides, workers, allocations, crew, closures"

  - name: SafetyOfficer
    description: "Schedules ride inspections against allocations; never records their outcome"
    identity: "opaque"
    exclusive_operations:
      - "POST /inspection-orders"
    shared_operations:
      - "GET reads on rides, allocations, inspections"

  - name: ComplianceClerk
    description: "Prepares and files jurisdiction permits"
    identity: "opaque"
    exclusive_operations:
      - "POST /permit-applications"
      - "POST /permit-applications/{id}/submit"
    shared_operations:
      - "GET reads on jurisdictions, stops, permits"

  - name: JurisdictionOfficer
    description: "External authority: decides permits and records inspection results"
    identity: "opaque"
    exclusive_operations:
      - "POST /permit-applications/{id}/decision"
      - "POST /inspection-orders/{id}/result"
    shared_operations:
      - "GET reads on permits and inspections"

  - name: TicketingAuditor
    description: "Records ticket and wristband batches, builds and reconciles provisional settlements"
    identity: "opaque"
    exclusive_operations:
      - "POST /route-stops/{id}/ticket-sales"
      - "POST /settlements"
      - "POST /settlements/{id}/reconcile"
    shared_operations:
      - "every GET read endpoint"

  - name: CrewChief
    description: "A worker who leads a crew and may read only their own assignment roster"
    identity: "entity_backed:Worker"
    exclusive_operations: []
    shared_operations:
      - "GET /workers/{id} for their own worker row"
      - "GET /workers/{id}/crew-assignments for their own worker row (X-User-ID must equal the path {id})"
