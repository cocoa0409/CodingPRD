            - "the ONLINE + PREMIUM listing has total_count == 1, has_more == false and its single row id == ${tank_id}"
            - "the STANDARD listing has total_count == 0 and data == [] — the tank_class filter is applied, not ignored"

      - name: corner_nightly_run_on_an_empty_database_reports_all_zero_counters
        claim_type: bulk_action
        grounds: "§1.5 POST /cbb/ops/nightly-run returns the ten integer counters kits_expired, screenings_expired, reservations_expired, excursions_escalated, tanks_entered_maintenance, tanks_exited_maintenance, invoices_advanced_past_due, invoices_advanced_delinquent, accounts_advanced, units_flagged_pending_abandonment."
        distinguishing_aspect: "Degenerate bulk operation: with nothing to sweep the batch must still succeed with HTTP 200 and a fully populated all-zero counter envelope, and running it twice must not drift — the skip-rather-than-fail semantics of the sweep."
        test_recipe:
          setup:
            - "Completely empty database; logical clock set to 2027-01-01T00:00:00Z so every conceivable deadline is already in the past."
            - "No enrollment, kit, screening, reservation, tank, invoice or account rows exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-01T00:00:00Z" }
