            - "after the first trigger GET /park-days/${day_901} → data.reserved_count == 0, data.remaining_slot_count == 100, data.released_count == 1"
            - "second trigger: HTTP 409 with data.error_id == 'ERR_RESERVATION_NOT_CANCELLABLE'"
            - "after the second trigger GET /park-days/${day_901} → data.released_count is still 1 (the refused call moved no counter)"

      - name: billing_run_is_a_bulk_action_that_skips_healthy_passes
        claim_type: bulk_action
        grounds:
          - endpoints[POST /pass-programs/{program_id}/billing-runs]
          - calculations.delinquency_evaluation
        distinguishing_aspect: "One sweep over the whole program returns per-category counts and uses skip rather than rollback semantics: the delinquent plan pass is suspended while the PAY_IN_FULL pass in the same program is left untouched, and the counts report only the rows actually changed."
        test_recipe:
          setup:
            - "Program in SALES_OPEN with PUBLISHED BRONZE."
            - "Pass A bought PAYMENT_PLAN and processed, on a 4-installment plan (down 3000 → 4 x 2625 due 2026-09-01 / 10-01 / 11-01 / 12-01)."
            - "Pass B (a different holder) bought PAY_IN_FULL and processed, billing PAID_IN_FULL with no plan."
          setup_api_calls:
            - call: "POST /pass-programs"
