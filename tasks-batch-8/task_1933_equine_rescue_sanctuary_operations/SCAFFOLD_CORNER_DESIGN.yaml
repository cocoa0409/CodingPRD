  - section: calculations
    instances:
      - name: ration_bcs_factor_boundaries
        claim_type: correct_result
        grounds: [calculations.daily_feed_ration]
        distinguishing_aspect: "BCS factor boundaries: BCS 3 (<= 3 gain branch, capped) -> 25.0 lbs on a 1000-lb horse; BCS 4 (no branch) -> 20.0; BCS 7 (>= 7 reduction branch) -> 16.0. Boundary inclusivity of both branches is pinned."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /rescue-ops/horses", payload: { name: "G", sex: MARE, breed_class: LIGHT, estimated_weight_lbs: 1000, age_years: 6, body_condition_score: 3, training_level: GREEN }, as: IntakeCoordinator, captures: { r_gain: $.data.daily_feed_ration_lbs } }
            - { call: "POST /rescue-ops/horses", payload: { name: "N", sex: MARE, breed_class: LIGHT, estimated_weight_lbs: 1000, age_years: 6, body_condition_score: 4, training_level: GREEN }, as: IntakeCoordinator, captures: { r_neutral: $.data.daily_feed_ration_lbs } }
            - { call: "POST /rescue-ops/horses", payload: { name: "F", sex: MARE, breed_class: LIGHT, estimated_weight_lbs: 1000, age_years: 6, body_condition_score: 7, training_level: GREEN }, as: IntakeCoordinator, captures: { r_reduce: $.data.daily_feed_ration_lbs } }
          assert:
            - "r_gain == 25.0 (min(1000*0.02*1.30 = 26.0, 1000*0.025 = 25.0) -> cap binds)"
            - "r_neutral == 20.0 (no branch at BCS 4)"
            - "r_reduce == 16.0 (1000*0.02*0.80)"

