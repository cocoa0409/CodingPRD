        distinguishing_aspect: "For a STANDARD-tier declared total of 6000000 the haircut result 5880000 exceeds PROVISIONAL_CREDIT_CAP_CENTS, so provisional_credit_cents is capped at exactly 5000000 and the customer's available_balance_cents reads 5000000."
        test_recipe:
          setup:
            - "Vault CV-C21, CustomerAccount ACC-C21 tier STANDARD with all balances 0."
            - "Ticket MAN-C21 with one bag S-C21 declared 6000000 at VAULT_RECEIVED and the ticket VERIFIED."
          setup_api_calls:
            - call: "POST /cash-vault/vaults"
              payload: { vault_code: "CV-C21", name: "Corner Vault TwentyOne" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { v_id: $.data.id }
            - call: "POST /cash-vault/customer-accounts"
              payload: { account_number: "ACC-C21", customer_name: "Corner Casino TwentyOne", tier: "STANDARD", status: "ACTIVE" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { a_id: $.data.id }
            - call: "POST /cash-vault/deposit-tickets"
              payload: { customer_account_id: "${a_id}", vault_id: "${v_id}", courier_manifest_number: "MAN-C21", declared_bag_count: 1 }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
              captures: { t_id: $.data.id }
            - call: "POST /cash-vault/sealed-bags"
              payload: { deposit_ticket_id: "${t_id}", seal_number: "S-C21", bag_type: "CURRENCY", declared_amount_cents: 6000000, declared_note_count: 600, declared_coin_weight_grams: 0 }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
              captures: { b_id: $.data.id }
            - call: "POST /cash-vault/sealed-bags/${b_id}/custody-events"
              payload: { event_type: "PICKUP", location_code: "SITE-CUST", observed_seal_number: "S-C21" }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
            - call: "POST /cash-vault/sealed-bags/${b_id}/custody-events"
              payload: { event_type: "VAULT_RECEIPT", location_code: "CV-C21-DOCK", observed_seal_number: "S-C21" }
              as: VaultTeller
              as_user_id: "u-tel-1"
            - call: "POST /cash-vault/deposit-tickets/${t_id}/verify"
              payload: {}
              as: VaultTeller
              as_user_id: "u-tel-1"
          trigger:
            - call: "POST /cash-vault/deposit-tickets/${t_id}/provisional-credit"
