  - rule_id: resource_temporal_overlap
    instances:
      - name: review_bomb_window_extension_semantics
        grounds:
          - calculations.review_bomb_detection
          - entities.ReviewBombWindow.fields.end_at
        distinguishing_aspect: |
          Half-open interval [start_at, end_at) semantics on ReviewBombWindow:
          a second detection trigger while a window is ACTIVE does NOT create a
          second overlapping window (at most one ACTIVE window per title) — it
          EXTENDS end_at to now + 7 days. Overlap resolution is merge-by-extension,
          not rejection.
