      - name: condemn_from_qa_failed_conditional_cascade
        claim_type: conditional_cascade
        grounds:
          - state_machines.Batch.QA_FAILED_to_CONDEMNED
          - state_machines.BlendingTank.OCCUPIED_to_AWAITING_CIP
        distinguishing_aspect: |
          Condemning a QA_FAILED batch that has no process run and no linked
          production run fires only the applicable side effects: batch ->
          CONDEMNED and tank -> AWAITING_CIP; there is no process run to abort
          and no run to demote (conditional cascade branches simply do not
          exist), and CONDEMNED is terminal.
        test_recipe:
          setup:
            - "Customer; DRAFT formula (allergen NONE); tank; batch QA_FAILED (measured 13.0, outside the +/-0.3 band)"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "CondCo", credit_limit_cents: 500000, minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, captures: { cust_id: $.data.id } }
