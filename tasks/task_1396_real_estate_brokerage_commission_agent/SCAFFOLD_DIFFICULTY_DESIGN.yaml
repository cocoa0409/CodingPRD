  # ------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: enrollment_window_overlap_rejected_adjacency_allowed
        grounds:
          - validations[priority=12]
          - errors[ERR_EFFECTIVE_DATE_REGRESSION]
          - entities.PlanEnrollment.fields.effective_from
        distinguishing_aspect: |
          Interval semantics on PlanEnrollment: half-open [effective_from,
          effective_to) coverage on the agent's plan timeline — gaps are
          allowed, open-ended final coverage is allowed, but overlap is
          rejected (new effective_from must be strictly after the current
          enrollment's); back-to-back adjacency (new from == old to) is the
          only legal seam.
        test_recipe:
          setup:
            - "Agent ACTIVE with enrollment E1 effective 2025-09-01 (ACTIVE)"
          setup_api_calls:
            - call: "POST /brokerage/agents"
              payload: { full_name: "Overlap Owen", email: "owen@x.com", license_number: "LIC-OO1", joined_at: "2025-09-01" }
              as: BrokerAdmin
              captures: { ag_id: $.data.id, ag_v0: $.data.version }
            - call: "POST /brokerage/agents/${ag_id}/activate"
              payload: {}
              as: BrokerAdmin
              captures: { ag_v1: $.data.version }
            - call: "POST /brokerage/plans"
              payload: { name: "P1", royalty_pct: 0.06, royalty_cap_cents: 300000, eo_fee_cents: 6000, transaction_fee_cents: 25000, tiers: [ { threshold_company_dollar_cents: 2500000, broker_split_pct: 0.30 }, { threshold_company_dollar_cents: 0, broker_split_pct: 0.0 } ] }
              as: BrokerAdmin
              captures: { p1: $.data.id }
            - call: "POST /brokerage/plans/${p1}/activate"
              payload: {}
              as: BrokerAdmin
            - call: "POST /brokerage/plans"
              payload: { name: "P2", royalty_pct: 0.06, royalty_cap_cents: 300000, eo_fee_cents: 7000, transaction_fee_cents: 20000, tiers: [ { threshold_company_dollar_cents: 2000000, broker_split_pct: 0.25 }, { threshold_company_dollar_cents: 0, broker_split_pct: 0.0 } ] }
              as: BrokerAdmin
              captures: { p2: $.data.id }
            - call: "POST /brokerage/plans/${p2}/activate"
              payload: {}
              as: BrokerAdmin
            - call: "POST /brokerage/agents/${ag_id}/enrollments"
              payload: { plan_id: "${p1}", effective_from: "2025-09-01", expected_agent_version: "${ag_v1}" }
              as: BrokerAdmin
            - call: "GET /brokerage/agents/${ag_id}"
              payload: {}
              as: BrokerAdmin
              captures: { ag_v2: $.data.version }
          trigger:
            - call: "POST /brokerage/agents/${ag_id}/enrollments"
              payload: { plan_id: "${p2}", effective_from: "2025-09-01", expected_agent_version: "${ag_v2}" }
              as: BrokerAdmin
              captures: { err_same: $.data.error_id }
          assert:
            - "effective_from equal to the current enrollment's -> ERR_EFFECTIVE_DATE_REGRESSION (overlap rejected)"
            - "a legal back-to-back change (effective_from 2026-09-01, the future) would be SCHEDULED — adjacency at the seam is allowed; only overlap/regression is rejected"
            - "E1 remains ACTIVE and untouched"

      - name: anniversary_window_exact_tiling_and_closed_window_rejection
        grounds:
          - calculations.anniversary_window_assignment
          - state_machines.AnniversaryPeriod.OPEN_to_CLOSED
          - errors[ERR_WINDOW_CLOSED]
        distinguishing_aspect: |
          Interval semantics on AnniversaryPeriod — a DIFFERENT resource entity
          than PlanEnrollment and different geometry: windows tile EXACTLY (no
          gaps permitted, fixed one-year length, adjacency required), and
          occupation (posting a settlement) is rejected once the window is
          CLOSED — versus enrollment intervals which permit gaps and have no
          occupation gate.
        test_recipe:
          setup:
            - "Agent joined 2025-03-10, ACTIVE, enrolled effective 2025-03-10 (open-ended)"
            - "Deal RETRO with closing_date 2025-03-15 (window 0: 2025-03-10..2026-03-09) still CLOSED-state-able"
            - "Clock advanced to 2026-04-01 (window 0 closes; window 1 open)"
          setup_api_calls:
            - call: "POST /brokerage/agents"
              payload: { full_name: "Window Wanda", email: "wanda@x.com", license_number: "LIC-WW1", joined_at: "2025-03-10" }
              as: BrokerAdmin
              captures: { ag_id: $.data.id, ag_v0: $.data.version }
            - call: "POST /brokerage/agents/${ag_id}/activate"
              payload: {}
              as: BrokerAdmin
              captures: { ag_v1: $.data.version }
            - call: "POST /brokerage/plans"
              payload: { name: "P1", royalty_pct: 0.06, royalty_cap_cents: 300000, eo_fee_cents: 6000, transaction_fee_cents: 25000, tiers: [ { threshold_company_dollar_cents: 2500000, broker_split_pct: 0.30 }, { threshold_company_dollar_cents: 0, broker_split_pct: 0.0 } ] }
              as: BrokerAdmin
              captures: { p1: $.data.id }
            - call: "POST /brokerage/plans/${p1}/activate"
              payload: {}
              as: BrokerAdmin
            - call: "POST /brokerage/agents/${ag_id}/enrollments"
              payload: { plan_id: "${p1}", effective_from: "2025-03-10", expected_agent_version: "${ag_v1}" }
              as: BrokerAdmin
            - call: "POST /brokerage/deals"
              payload: { agent_id: "${ag_id}", address: "12 Retro Rd", gross_commission_cents: 500000, closing_date: "2025-03-15" }
              as: TransactionCoordinator
              captures: { retro_id: $.data.id }
            - call: "POST /brokerage/deals/${retro_id}/submit"
              payload: {}
              as: TransactionCoordinator
            - call: "POST /brokerage/deals/${retro_id}/close"
              payload: { actual_closing_date: "2025-03-15" }
              as: TransactionCoordinator
            - call: "POST /brokerage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: BrokerAdmin
              captures: { closed_windows: $.data.closed_window_ids }
          trigger:
            - call: "POST /brokerage/deals/${retro_id}/settle"
              payload: {}
              as: TransactionCoordinator
              captures: { err: $.data.error_id }
            - call: "GET /brokerage/anniversary-periods?agent_id=${ag_id}"
