scaffold_difficulty_design:

  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: rental_charge_estimate_vs_final_diverge_on_overdue
        grounds:
          - calculations.rental_charge
          - state_machines.RentalAgreement.ON_RENT_to_RETURNED_PENDING_INSPECTION
          - entities.Reservation.fields.estimated_rental_cents
          - entities.RentalAgreement.fields.final_rental_cents
        distinguishing_aspect: |
          The estimate variant (cost accounting on Reservation) bills the full planned
          interval [start,end]=10 days = 32000, while the final variant (cost accounting
          on RentalAgreement) bills [actual_start, min(actual_return, scheduled_end)] and
          pushes overdue days into late_fee, so on a 3-day-overdue return final_rental_cents
          stays 32000 but late_fee_cents = 18000 — same data, two algorithms, different
          ledger composition.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T08:00:00.000Z."
            - "RateCard rc: daily 4000, weekly 20000, four_week 60000, deposit 50000, waiver_daily 1500, fuel 200/L, cleaning 8000, late_mult 1.5."
            - "Catalog item ci (HEAVY_EQUIPMENT, fuel_capacity 40, requires_delivery false). EquipmentUnit eu (service_due 1000)."
            - "ContractorAccount acct (credit_limit 1000000). Reservation r PICKUP, start 2026-06-01, end 2026-06-10 (10 billed days). Picked up 2026-06-01 -> agreement ag ON_RENT, scheduled_end 2026-06-10."
          setup_api_calls:
            - call: "POST /rental-yard/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00.000Z" }
              as: YardManager
            - call: "POST /rental-yard/rate-cards"
              payload: { name: "Std", daily_rate_cents: 4000, weekly_rate_cents: 20000, four_week_rate_cents: 60000, deposit_cents: 50000, damage_waiver_daily_cents: 1500, fuel_refill_cents_per_liter: 200, cleaning_fee_cents: 8000, late_fee_multiplier: 1.5 }
              as: YardManager
              captures: { rc_id: $.data.id }
            - call: "POST /rental-yard/catalog-items"
              payload: { rate_card_id: "${rc_id}", sku: "MX15", name: "Mini Excavator", category: "HEAVY_EQUIPMENT", requires_delivery: false, fuel_capacity_liters: 40 }
              as: YardManager
              captures: { ci_id: $.data.id }
            - call: "POST /rental-yard/equipment-units"
              payload: { catalog_item_id: "${ci_id}", asset_tag: "EU-1", service_due_at_days: 1000 }
              as: YardManager
              captures: { eu_id: $.data.id, eu_v: $.data.version }
            - call: "POST /rental-yard/contractor-accounts"
              payload: { company_name: "Acme", credit_limit_cents: 1000000 }
              as: YardManager
              captures: { acct_id: $.data.id }
            - call: "POST /rental-yard/reservations"
              payload: { contractor_account_id: "${acct_id}", catalog_item_id: "${ci_id}", equipment_unit_id: "${eu_id}", fulfillment_method: "PICKUP", rental_start_date: "2026-06-01", rental_end_date: "2026-06-10", damage_waiver_opted: false }
              as: RentalAgent
              captures: { r_id: $.data.id, est_rental: $.data.estimated_rental_cents }
            - call: "POST /rental-yard/reservations/${r_id}/pickup"
              payload: {}
              as: RentalAgent
            - call: "GET /rental-yard/rental-agreements?reservation_id=${r_id}"
              payload: {}
              as: RentalAgent
              captures: { ag_id: "$.data[0].id" }
          trigger:
            - call: "POST /rental-yard/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-13T09:00:00.000Z" }
              as: YardManager
            - call: "POST /rental-yard/rental-agreements/${ag_id}/return"
              payload: {}
              as: RentalAgent
              captures: { final_rental: $.data.final_rental_cents, late_fee: $.data.late_fee_cents }
          assert:
            - "Reservation.${r_id}.estimated_rental_cents == 32000"
            - "Reservation.${r_id}.estimated_total_cents == 32000"
            - "RentalAgreement.${ag_id}.final_rental_cents == 32000"
            - "RentalAgreement.${ag_id}.late_fee_cents == 18000"
            - "(RentalAgreement.${ag_id}.final_rental_cents + RentalAgreement.${ag_id}.late_fee_cents) == 50000 which diverges from Reservation.${r_id}.estimated_total_cents == 32000"
        # NOTE: ${ag_id} is the agreement opened by the pickup; discovered via
        # GET /rental-yard/rental-agreements?reservation_id=${r_id} (filtered list).

      - name: account_balance_actual_vs_credit_projection
        grounds:
          - calculations.account_outstanding_balance
          - calculations.account_outstanding_balance.variants.credit_check_projection
          - entities.ContractorAccount.fields.outstanding_balance_cents
          - entities.ContractorAccount.fields.credit_limit_cents
          - validations[priority=13]
        distinguishing_aspect: |
          The base aggregation (sum of all ledger amounts) reports the ContractorAccount's
          realized outstanding_balance_cents = 50000 after a confirm-only deposit hold, while
          the credit_check_projection variant computes a forward-looking would_be_balance =
          outstanding + deposit + estimated_total BEFORE posting — a risk projection on the
          ContractorAccount domain, structurally distinct from rental cost accounting on the
          Reservation/Agreement.
        test_recipe:
          setup:
            - "Clock 2026-06-01. RateCard rc (deposit 50000), item ci (HEAVY, requires_delivery false), unit eu, account acct credit_limit 1000000."
            - "One CONFIRMED reservation posted a DEPOSIT_HOLD +50000, so outstanding_balance_cents == 50000."
          setup_api_calls:
            - call: "POST /rental-yard/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00.000Z" }
              as: YardManager
            - call: "POST /rental-yard/rate-cards"
              payload: { name: "Std", daily_rate_cents: 4000, weekly_rate_cents: 20000, four_week_rate_cents: 60000, deposit_cents: 50000, damage_waiver_daily_cents: 1500, fuel_refill_cents_per_liter: 200, cleaning_fee_cents: 8000, late_fee_multiplier: 1.5 }
              as: YardManager
              captures: { rc_id: $.data.id }
            - call: "POST /rental-yard/catalog-items"
              payload: { rate_card_id: "${rc_id}", sku: "MX15", name: "Mini Excavator", category: "HEAVY_EQUIPMENT", requires_delivery: false, fuel_capacity_liters: 40 }
              as: YardManager
              captures: { ci_id: $.data.id }
            - call: "POST /rental-yard/equipment-units"
              payload: { catalog_item_id: "${ci_id}", asset_tag: "EU-1", service_due_at_days: 1000 }
              as: YardManager
              captures: { eu_id: $.data.id, eu_v: $.data.version }
            - call: "POST /rental-yard/contractor-accounts"
              payload: { company_name: "Acme", credit_limit_cents: 1000000 }
              as: YardManager
              captures: { acct_id: $.data.id }
            - call: "POST /rental-yard/reservations"
              payload: { contractor_account_id: "${acct_id}", catalog_item_id: "${ci_id}", equipment_unit_id: "${eu_id}", fulfillment_method: "PICKUP", rental_start_date: "2026-06-01", rental_end_date: "2026-06-10", damage_waiver_opted: true }
              as: RentalAgent
              captures: { r_id: $.data.id, est_total: $.data.estimated_total_cents }
          trigger:
            - call: "GET /rental-yard/contractor-accounts/${acct_id}"
              payload: {}
              as: YardManager
              captures: { bal: $.data.outstanding_balance_cents }
          assert:
            - "ContractorAccount.${acct_id}.outstanding_balance_cents == 50000"
            - "Reservation.${r_id}.estimated_total_cents == 47000"

  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: rental_charge_tiered_best_rate_cap_selection
        grounds:
          - calculations.rental_charge
          - entities.Reservation.fields.estimated_rental_cents
          - entities.RateCard.fields.weekly_rate_cents
          - entities.RateCard.fields.four_week_rate_cents
        distinguishing_aspect: |
          Mode (a): a >=3-input non-linear tiered selection with nested caps. For 27 billed
          days the greedy decomposition yields 0x4wk + 3wk + 6d, but the day->week cap then
          week->4week cap collapse it to a single 4-week block = 60000, not the naive
          3*20000 + 6*4000 = 84000. Caps applied in PINNED order (day->week first, then
          week->4week).
        test_recipe:
          setup:
            - "Clock 2026-06-01. RateCard daily 4000, weekly 20000, four_week 60000. HEAVY item ci requires_delivery false, unit eu, account acct credit_limit 1000000."
            - "Reservation start 2026-06-01 end 2026-06-27 inclusive = 27 billed days."
          setup_api_calls:
            - call: "POST /rental-yard/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00.000Z" }
              as: YardManager
            - call: "POST /rental-yard/rate-cards"
              payload: { name: "Std", daily_rate_cents: 4000, weekly_rate_cents: 20000, four_week_rate_cents: 60000, deposit_cents: 50000, damage_waiver_daily_cents: 1500, fuel_refill_cents_per_liter: 200, cleaning_fee_cents: 8000, late_fee_multiplier: 1.5 }
              as: YardManager
              captures: { rc_id: $.data.id }
            - call: "POST /rental-yard/catalog-items"
              payload: { rate_card_id: "${rc_id}", sku: "MX15", name: "Mini Excavator", category: "HEAVY_EQUIPMENT", requires_delivery: false, fuel_capacity_liters: 40 }
              as: YardManager
              captures: { ci_id: $.data.id }
            - call: "POST /rental-yard/equipment-units"
              payload: { catalog_item_id: "${ci_id}", asset_tag: "EU-1", service_due_at_days: 1000 }
              as: YardManager
              captures: { eu_id: $.data.id, eu_v: $.data.version }
            - call: "POST /rental-yard/contractor-accounts"
              payload: { company_name: "Acme", credit_limit_cents: 1000000 }
              as: YardManager
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /rental-yard/reservations"
              payload: { contractor_account_id: "${acct_id}", catalog_item_id: "${ci_id}", equipment_unit_id: "${eu_id}", fulfillment_method: "PICKUP", rental_start_date: "2026-06-01", rental_end_date: "2026-06-27", damage_waiver_opted: false }
              as: RentalAgent
              captures: { r_id: $.data.id, est_rental: $.data.estimated_rental_cents }
          assert:
            - "Reservation.${r_id}.estimated_rental_cents == 60000"

      - name: final_total_pinned_evaluation_order_deposit_after_damage
        grounds:
          - calculations.final_total
          - state_machines.RentalAgreement.RETURNED_PENDING_INSPECTION_to_CLOSED_WITH_DAMAGE
          - entities.RentalAgreement.fields.final_total_cents
          - entities.RentalAgreement.fields.deposit_held_cents
        distinguishing_aspect: |
          Mode (c): circular-looking evaluation where the deposit refund line depends on the
          damage charge which depends on the waiver flag; the scaffold pins order 1..7 so
          components (rental 32000, fuel 3000, cleaning 8000, damage 25000) are summed FIRST,
          THEN deposit (50000) is subtracted, giving final_total_cents = 18000 — distinct from
          mode (a) tiered selection.
        test_recipe:
          setup:
            - "Clock 2026-06-01. Item ci HEAVY requires_delivery false, fuel_capacity 40, unit eu service_due 1000, account credit_limit 1000000."
            - "Reservation r PICKUP 2026-06-01..2026-06-10 (10 days), damage_waiver_opted false. Picked up 2026-06-01 -> agreement ag ON_RENT (fuel filled to 40)."
            - "Returned ON-TIME 2026-06-10 (final 10 days, overdue 0)."
          setup_api_calls:
            - call: "POST /rental-yard/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00.000Z" }
              as: YardManager
            - call: "POST /rental-yard/rate-cards"
              payload: { name: "Std", daily_rate_cents: 4000, weekly_rate_cents: 20000, four_week_rate_cents: 60000, deposit_cents: 50000, damage_waiver_daily_cents: 1500, fuel_refill_cents_per_liter: 200, cleaning_fee_cents: 8000, late_fee_multiplier: 1.5 }
              as: YardManager
              captures: { rc_id: $.data.id }
            - call: "POST /rental-yard/catalog-items"
              payload: { rate_card_id: "${rc_id}", sku: "MX15", name: "Mini Excavator", category: "HEAVY_EQUIPMENT", requires_delivery: false, fuel_capacity_liters: 40 }
              as: YardManager
              captures: { ci_id: $.data.id }
            - call: "POST /rental-yard/equipment-units"
              payload: { catalog_item_id: "${ci_id}", asset_tag: "EU-1", service_due_at_days: 1000 }
              as: YardManager
              captures: { eu_id: $.data.id, eu_v: $.data.version }
            - call: "POST /rental-yard/contractor-accounts"
              payload: { company_name: "Acme", credit_limit_cents: 1000000 }
              as: YardManager
              captures: { acct_id: $.data.id }
            - call: "POST /rental-yard/reservations"
              payload: { contractor_account_id: "${acct_id}", catalog_item_id: "${ci_id}", equipment_unit_id: "${eu_id}", fulfillment_method: "PICKUP", rental_start_date: "2026-06-01", rental_end_date: "2026-06-10", damage_waiver_opted: false }
              as: RentalAgent
              captures: { r_id: $.data.id }
            - call: "POST /rental-yard/reservations/${r_id}/pickup"
              payload: {}
              as: RentalAgent
            - call: "GET /rental-yard/rental-agreements?reservation_id=${r_id}"
              payload: {}
              as: RentalAgent
              captures: { ag_id: "$.data[0].id" }
            - call: "POST /rental-yard/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T09:00:00.000Z" }
              as: YardManager
            - call: "POST /rental-yard/rental-agreements/${ag_id}/return"
              payload: {}
              as: RentalAgent
          trigger:
            - call: "POST /rental-yard/return-inspections"
              payload: { rental_agreement_id: "${ag_id}", return_fuel_level_liters: 25, cleanliness: "DIRTY", damage_assessed_cents: 25000 }
              as: Inspector
              captures: { insp_id: $.data.id }
          assert:
            - "RentalAgreement.${ag_id}.final_total_cents == 18000"
            - "RentalAgreement.${ag_id}.agreement_state == CLOSED_WITH_DAMAGE"
            - "ReturnInspection.${insp_id}.fuel_refill_cents == 3000"
            - "ReturnInspection.${insp_id}.net_damage_cents == 25000"
        # ${ag_id}: agreement opened by pickup, discovered via
        # GET /rental-yard/rental-agreements?reservation_id=${r_id}.

  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: agreement_branch_closed_vs_closed_with_damage
        grounds:
          - state_machines.RentalAgreement.RETURNED_PENDING_INSPECTION_to_CLOSED
          - state_machines.RentalAgreement.RETURNED_PENDING_INSPECTION_to_CLOSED_WITH_DAMAGE
          - entities.RentalAgreement.fields.agreement_state
        distinguishing_aspect: |
          RentalAgreement is the branching entity: from RETURNED_PENDING_INSPECTION the
          inspection forks to CLOSED (net_damage 0, unit -> AVAILABLE, no ticket) versus
          CLOSED_WITH_DAMAGE (net_damage > 0, unit -> OUT_OF_SERVICE, DamageCharge + ticket),
          with divergent side-effect sets per branch.
        test_recipe:
          setup:
            - "Two independent agreements ag_clean and ag_dmg, each opened from a PICKUP reservation on its own AVAILABLE unit, both returned ON-TIME 2026-06-10."
          setup_api_calls:
            - call: "POST /rental-yard/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00.000Z" }
              as: YardManager
            - call: "POST /rental-yard/rate-cards"
              payload: { name: "Std", daily_rate_cents: 4000, weekly_rate_cents: 20000, four_week_rate_cents: 60000, deposit_cents: 50000, damage_waiver_daily_cents: 1500, fuel_refill_cents_per_liter: 200, cleaning_fee_cents: 8000, late_fee_multiplier: 1.5 }
              as: YardManager
              captures: { rc_id: $.data.id }
            - call: "POST /rental-yard/catalog-items"
              payload: { rate_card_id: "${rc_id}", sku: "MX15", name: "Mini Excavator", category: "HEAVY_EQUIPMENT", requires_delivery: false, fuel_capacity_liters: 40 }
              as: YardManager
              captures: { ci_id: $.data.id }
            - call: "POST /rental-yard/equipment-units"
              payload: { catalog_item_id: "${ci_id}", asset_tag: "EU-1", service_due_at_days: 1000 }
              as: YardManager
              captures: { eu1_id: $.data.id, eu1_v: $.data.version }
            - call: "POST /rental-yard/equipment-units"
              payload: { catalog_item_id: "${ci_id}", asset_tag: "EU-2", service_due_at_days: 1000 }
              as: YardManager
              captures: { eu2_id: $.data.id, eu2_v: $.data.version }
            - call: "POST /rental-yard/contractor-accounts"
              payload: { company_name: "Acme", credit_limit_cents: 1000000 }
              as: YardManager
              captures: { acct_id: $.data.id }
            - call: "POST /rental-yard/reservations"
              payload: { contractor_account_id: "${acct_id}", catalog_item_id: "${ci_id}", equipment_unit_id: "${eu1_id}", fulfillment_method: "PICKUP", rental_start_date: "2026-06-01", rental_end_date: "2026-06-10", damage_waiver_opted: false }
              as: RentalAgent
              captures: { r1_id: $.data.id }
            - call: "POST /rental-yard/reservations/${r1_id}/pickup"
              payload: {}
              as: RentalAgent
            - call: "POST /rental-yard/reservations"
              payload: { contractor_account_id: "${acct_id}", catalog_item_id: "${ci_id}", equipment_unit_id: "${eu2_id}", fulfillment_method: "PICKUP", rental_start_date: "2026-06-01", rental_end_date: "2026-06-10", damage_waiver_opted: false }
              as: RentalAgent
              captures: { r2_id: $.data.id }
            - call: "POST /rental-yard/reservations/${r2_id}/pickup"
              payload: {}
              as: RentalAgent
            - call: "GET /rental-yard/rental-agreements?reservation_id=${r1_id}"
              payload: {}
              as: RentalAgent
              captures: { ag_clean_id: "$.data[0].id" }
            - call: "GET /rental-yard/rental-agreements?reservation_id=${r2_id}"
              payload: {}
              as: RentalAgent
              captures: { ag_dmg_id: "$.data[0].id" }
            - call: "POST /rental-yard/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T09:00:00.000Z" }
              as: YardManager
            - call: "POST /rental-yard/rental-agreements/${ag_clean_id}/return"
              payload: {}
              as: RentalAgent
            - call: "POST /rental-yard/rental-agreements/${ag_dmg_id}/return"
              payload: {}
              as: RentalAgent
          trigger:
            - call: "POST /rental-yard/return-inspections"
              payload: { rental_agreement_id: "${ag_clean_id}", return_fuel_level_liters: 40, cleanliness: "CLEAN", damage_assessed_cents: 0 }
              as: Inspector
            - call: "POST /rental-yard/return-inspections"
              payload: { rental_agreement_id: "${ag_dmg_id}", return_fuel_level_liters: 40, cleanliness: "CLEAN", damage_assessed_cents: 9000 }
              as: Inspector
          assert:
            - "RentalAgreement.${ag_clean_id}.agreement_state == CLOSED"
            - "EquipmentUnit.${eu1_id}.availability_state == AVAILABLE"
            - "RentalAgreement.${ag_dmg_id}.agreement_state == CLOSED_WITH_DAMAGE"
            - "EquipmentUnit.${eu2_id}.availability_state == OUT_OF_SERVICE"
        # ${ag_clean_id}/${ag_dmg_id}: agreements from r1/r2 pickups, discovered via
        # GET /rental-yard/rental-agreements?reservation_id=${r1_id}/${r2_id}.

      - name: equipment_unit_branch_available_forks_to_on_rent_vs_out_of_service
        grounds:
          - state_machines.EquipmentUnit.AVAILABLE_to_ON_RENT
          - state_machines.EquipmentUnit.AVAILABLE_to_OUT_OF_SERVICE
          - entities.EquipmentUnit.fields.availability_state
        distinguishing_aspect: |
          EquipmentUnit is a second non-linear entity (distinct from RentalAgreement): from
          AVAILABLE it forks to ON_RENT (pickup/dispatch, divergent side-effects: agreement
          opened, fuel filled) versus OUT_OF_SERVICE (maintenance pull, divergent side-effects:
          MaintenanceTicket opened) — a branch with per-edge divergent side-effect sets.
        test_recipe:
          setup:
            - "Two AVAILABLE units eu_rent and eu_svc of the same catalog item."
          setup_api_calls:
            - call: "POST /rental-yard/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00.000Z" }
              as: YardManager
            - call: "POST /rental-yard/rate-cards"
              payload: { name: "Std", daily_rate_cents: 4000, weekly_rate_cents: 20000, four_week_rate_cents: 60000, deposit_cents: 50000, damage_waiver_daily_cents: 1500, fuel_refill_cents_per_liter: 200, cleaning_fee_cents: 8000, late_fee_multiplier: 1.5 }
              as: YardManager
              captures: { rc_id: $.data.id }
            - call: "POST /rental-yard/catalog-items"
              payload: { rate_card_id: "${rc_id}", sku: "MX15", name: "Mini Excavator", category: "HEAVY_EQUIPMENT", requires_delivery: false, fuel_capacity_liters: 40 }
              as: YardManager
              captures: { ci_id: $.data.id }
            - call: "POST /rental-yard/equipment-units"
              payload: { catalog_item_id: "${ci_id}", asset_tag: "EU-RENT", service_due_at_days: 1000 }
              as: YardManager
              captures: { eu_rent_id: $.data.id }
            - call: "POST /rental-yard/equipment-units"
              payload: { catalog_item_id: "${ci_id}", asset_tag: "EU-SVC", service_due_at_days: 1000 }
              as: YardManager
              captures: { eu_svc_id: $.data.id }
            - call: "POST /rental-yard/contractor-accounts"
              payload: { company_name: "Acme", credit_limit_cents: 1000000 }
              as: YardManager
              captures: { acct_id: $.data.id }
            - call: "POST /rental-yard/reservations"
              payload: { contractor_account_id: "${acct_id}", catalog_item_id: "${ci_id}", equipment_unit_id: "${eu_rent_id}", fulfillment_method: "PICKUP", rental_start_date: "2026-06-01", rental_end_date: "2026-06-10", damage_waiver_opted: false }
              as: RentalAgent
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /rental-yard/reservations/${r_id}/pickup"
              payload: {}
              as: RentalAgent
            - call: "POST /rental-yard/maintenance-tickets"
              payload: { equipment_unit_id: "${eu_svc_id}", reason: "SCHEDULED_SERVICE" }
              as: YardManager
              captures: { tk_id: $.data.id }
          assert:
            - "EquipmentUnit.${eu_rent_id}.availability_state == ON_RENT"
            - "EquipmentUnit.${eu_svc_id}.availability_state == OUT_OF_SERVICE"
            - "MaintenanceTicket.${tk_id}.ticket_state == OPEN"

  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: inspection_damage_cascade_depth3_to_maintenance_ticket
        grounds:
          - state_machines.RentalAgreement.RETURNED_PENDING_INSPECTION_to_CLOSED_WITH_DAMAGE
          - state_machines.EquipmentUnit.ON_RENT_to_OUT_OF_SERVICE
          - state_machines.MaintenanceTicket.OPEN_to_RESOLVED
          - entities.MaintenanceTicket.fields.opened_by_agreement_id
        distinguishing_aspect: |
          Depth-3 chain originating at the return-inspection trigger: inspection ->
          RentalAgreement moves to CLOSED_WITH_DAMAGE -> that close drives EquipmentUnit to
          OUT_OF_SERVICE -> the OUT_OF_SERVICE move itself auto-creates a MaintenanceTicket
          (OPEN, DAMAGE_REPAIR, opened_by_agreement_id). Each link is caused by the prior link.
        test_recipe:
          setup:
            - "Agreement ag ON_RENT from a PICKUP reservation on unit eu (service_due 1000), returned on-time 2026-06-10."
          setup_api_calls:
            - call: "POST /rental-yard/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00.000Z" }
