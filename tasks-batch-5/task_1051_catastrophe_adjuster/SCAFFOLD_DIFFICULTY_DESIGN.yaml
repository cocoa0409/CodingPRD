  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: accept_state_beats_referential
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_ASSIGNMENT_NOT_OFFERED]
          - errors[ERR_NO_ACTIVE_LICENSE]
        distinguishing_aspect: |
          Category pair state vs business_referential: an already-DECLINED assignment whose
          adjuster also has no ACTIVE license returns ERR_ASSIGNMENT_NOT_OFFERED (state, priority 7),
          NOT ERR_NO_ACTIVE_LICENSE (business_referential, priority 8).
        test_recipe:
          setup:
            - "Adjuster with a PENDING (never activated) FL license -> no ACTIVE license"
            - "FL/HAIL claim; assignment offered then DECLINED by the owning adjuster"
          setup_api_calls:
            - { call: "POST /adjusters", payload: { full_name: "A9", email: "a9@x.com", adjuster_type: "INDEPENDENT", home_state: "FL" }, as: LicensingAdmin, captures: { adj_id: $.data.id } }
            - { call: "POST /licenses", payload: { adjuster_id: "${adj_id}", state_code: "FL", license_number: "FL-9", license_type: "ALL_LINES", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }, as: LicensingAdmin }
            - { call: "POST /claims", payload: { claim_number: "C-9", policyholder_name: "PH", loss_state: "FL", peril_type: "HAIL", policy_type: "ACV" }, as: DeskExaminer, captures: { claim_id: $.data.id } }
            - { call: "POST /assignments", payload: { claim_id: "${claim_id}", adjuster_id: "${adj_id}" }, as: DeskExaminer, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/decline", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
          trigger:
            - { call: "POST /assignments/${asg_id}/accept", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { err: $.data.error_id } }
          assert:
            - "response_type == error AND data.error_id == ERR_ASSIGNMENT_NOT_OFFERED"
            - "http_status == 409 (state check wins over the 422 license check)"

      - name: confirm_temporal_beats_fiscal
        grounds:
          - validations[priority=9]
          - validations[priority=12]
          - errors[ERR_DEPLOYMENT_WINDOW_OVERLAP]
          - errors[ERR_ROSTER_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Category pair business_temporal vs business_fiscal: confirming a deployment that both
          overlaps the adjuster's existing CONFIRMED window AND would exceed a full roster returns
          ERR_DEPLOYMENT_WINDOW_OVERLAP (temporal, priority 9), NOT ERR_ROSTER_CAPACITY_EXCEEDED (priority 12).
        test_recipe:
          setup:
            - "CatEvent with roster_capacity=1; one adjuster"
            - "Deployment D1 [07-10T09:00,07-10T17:00) CONFIRMED (roster full)"
            - "Deployment D2 for the same adjuster [07-10T12:00,07-10T14:00) still REQUESTED (overlaps D1)"
          setup_api_calls:
            - { call: "POST /adjusters", payload: { full_name: "A10", email: "a10@x.com", adjuster_type: "CAT", home_state: "FL" }, as: LicensingAdmin, captures: { adj_id: $.data.id } }
            - { call: "POST /cat-events", payload: { name: "Delta", peril_type: "HURRICANE", affected_states: ["FL"], roster_capacity: 1 }, as: LicensingAdmin, captures: { ce_id: $.data.id } }
            - { call: "POST /deployments", payload: { adjuster_id: "${adj_id}", cat_event_id: "${ce_id}", start_at: "2026-07-10T09:00:00Z", end_at: "2026-07-10T17:00:00Z" }, as: LicensingAdmin, captures: { d1: $.data.id } }
            - { call: "POST /deployments/${d1}/confirm", payload: {}, as: LicensingAdmin }
            - { call: "POST /deployments", payload: { adjuster_id: "${adj_id}", cat_event_id: "${ce_id}", start_at: "2026-07-10T12:00:00Z", end_at: "2026-07-10T14:00:00Z" }, as: LicensingAdmin, captures: { d2: $.data.id } }
          trigger:
            - { call: "POST /deployments/${d2}/confirm", payload: {}, as: LicensingAdmin, captures: { err: $.data.error_id } }
          assert:
            - "response_type == error AND data.error_id == ERR_DEPLOYMENT_WINDOW_OVERLAP"
            - "CatEvent(${ce_id}).roster_filled_count == 1 (D2 not confirmed)"

  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: fee_tier_boundary_rcv_inclusive
        grounds:
          - calculations.fee_bill_amount
          - entities.FeeSchedule.fields.tier1_max_rcv_cents
        distinguishing_aspect: |
          Numeric threshold on POST /fee-bills: RCV exactly == tier1_max_rcv_cents (5000000) selects
          tier 1 (flat 30000) giving total 155000; RCV at tier1_max+1 would select tier 2 (185000).
          The boundary is inclusive (rcv <= tier1_max => tier1).
