          trigger:
            - { call: "POST /orders/${ord}/estimates", payload: { estimate_kind: "NON_BINDING", estimated_weight_lbs: 8050, packing_services_cents: 0, expected_order_version: "${ord_v}" }, as: BookingAgent, as_user_id: "${ag_b}", captures: { est: $.data.id } }
          assert:
            - "Estimate.${est}.linehaul_cents == 461194 (round_half_up(81 * 4555 * 1.25) = round_half_up(461193.75))"
            - "Estimate.${est}.fuel_surcharge_cents == 34590 (round_half_up(461194 * 0.075) = round_half_up(34589.55))"
            - "Estimate.${est}.estimated_charges_cents == 495784 — component rounding pinned; sum-then-round would give 495783"
