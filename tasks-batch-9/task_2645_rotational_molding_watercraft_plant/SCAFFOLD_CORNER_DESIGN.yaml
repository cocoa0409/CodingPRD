          setup:
            - "Logical clock advanced to 2026-08-01T09:00:00Z. ProductModel PM-CVP (nominal_charge_kg 12.000, min_cooling_minutes 30) with two single-cavity moulds MLD-CVP-1 and MLD-CVP-2 (nominal_charge_kg 12.000, service_interval_cycles 10), oven OV-CVP with 2 arms and changeover_buffer_min 15, bay CB-CVP with 2 slots, site WH-CVA and resin lot LOT-CVP (100.000 kg)."
