      - call: POST /pilotage/pilots
        payload:
          full_name: Pilot One
          license_number: LIC-1
          share_units: 1
        as: AssociationAdmin
        captures:
          p1_id: $.data.id
          p1_v: $.data.version
      - call: POST /pilotage/pilots/${p1_id}/endorsements
        payload:
          endorsement_class: UNLIMITED
          tonnage_cap_gt: 100000
          expires_at: '2027-01-01T00:00:00Z'
          expected_pilot_version: ${p1_v}
        as: AssociationAdmin
      - call: POST /pilotage/pilot-boats
        payload:
          name: Boat A
          capacity_persons: 6
        as: AssociationAdmin
      - call: POST /pilotage/vessel-orders
        payload:
          vessel_name: MV One
          gt: 8000
          draft_dm: 90
          order_type: ARRIVAL
          eta: '2026-08-10T00:00:00Z'
        as: VesselAgent
        as_user_id: agent-1
        captures:
          o1_id: $.data.id
      trigger:
      - call: POST /pilotage/vessel-orders/${o1_id}/dispatch
        payload:
          scheduled_start: '2026-08-10T10:00:00Z'
          scheduled_end: '2026-08-10T11:00:00Z'
        as: Dispatcher
        captures:
          svc: $.data.service_status
          bil: $.data.billing_status
          rc: $.data.recall_count
          ver: $.data.version
      assert:
      - svc == ASSIGNED and bil == UNBILLED and rc == 0 and ver == 1
  - name: incident_dismiss_twice_returns_invalid_state
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.Incident
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: DISMISSED is terminal; dismissing again fails ERR_INVALID_STATE.
    test_recipe:
      setup:
      - MAIN_TARIFF active; P1 endorsed cap 100000; boat BA; A1 ASSIGNED; incident N1 REPORTED then UNDER_REVIEW then DISMISSED
      setup_api_calls:
      - call: POST /pilotage/tariff-schedules
        payload:
          effective_from: '2026-01-01T00:00:00Z'
          tiers:
          - min_gt_exclusive: 0
            max_gt_inclusive: 5000
            rate_cents_per_gt: 20
          draft_surcharge_threshold_dm: 100
          draft_surcharge_pct: 0.15
          detention_free_minutes: 30
          detention_rate_cents_per_minute: 200
          delay_rate_cents_per_minute: 150
        as: AssociationAdmin
      - call: POST /pilotage/pilots
        payload:
          full_name: Pilot One
          license_number: LIC-1
          share_units: 1
        as: AssociationAdmin
        captures:
          p1_id: $.data.id
          p1_v: $.data.version
      - call: POST /pilotage/pilots/${p1_id}/endorsements
        payload:
          endorsement_class: UNLIMITED
          tonnage_cap_gt: 100000
          expires_at: '2027-01-01T00:00:00Z'
          expected_pilot_version: ${p1_v}
        as: AssociationAdmin
      - call: POST /pilotage/pilot-boats
        payload:
          name: Boat A
          capacity_persons: 6
        as: AssociationAdmin
      - call: POST /pilotage/vessel-orders
        payload:
          vessel_name: MV One
          gt: 8000
          draft_dm: 90
          order_type: ARRIVAL
          eta: '2026-08-10T00:00:00Z'
        as: VesselAgent
        as_user_id: agent-1
        captures:
          o1_id: $.data.id
      - call: POST /pilotage/vessel-orders/${o1_id}/dispatch
        payload:
          scheduled_start: '2026-08-10T10:00:00Z'
          scheduled_end: '2026-08-10T11:00:00Z'
        as: Dispatcher
        captures:
          a1_id: $.data.id
      - call: POST /pilotage/incidents
        payload:
          assignment_id: ${a1_id}
          incident_type: CONDUCT
          description: late to launch
        as: Dispatcher
        captures:
          n1_id: $.data.id
      - call: POST /pilotage/incidents/${n1_id}/open-review
        payload: {}
        as: Investigator
      - call: POST /pilotage/incidents/${n1_id}/dismiss
        payload: {}
        as: Investigator
      trigger:
      - call: POST /pilotage/incidents/${n1_id}/dismiss
        payload: {}
        as: Investigator
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_INVALID_STATE
  - name: sm_complete_side_effects_covered
    claim_type: side_effect_execution
    grounds:
    - state_machines.Assignment.ABOARD_to_COMPLETED
    excluded_because:
      difficulty_instance: tariff_provisional_average_vs_final_marginal
      rationale: The §1.8 instance drives ABOARD->COMPLETED and asserts the invoice, order, and billing side effects with literal values.
- section: calculations
  instances:
  - name: calc_provisional_recomputed_on_draft_amendment
    claim_type: correct_result
    grounds:
    - calculations.tariff_base_fee
    - endpoints.PATCH_vessel_orders
    distinguishing_aspect: PATCHing draft_dm 120 -> 90 drops the surcharge leg; provisional fee recomputes from 287500 to 250000 immediately.
    test_recipe:
      setup:
      - MAIN_TARIFF active; O1 gt 25000 draft 120 BOOKED (provisional 287500)
      setup_api_calls:
      - call: POST /pilotage/tariff-schedules
        payload:
          effective_from: '2026-01-01T00:00:00Z'
          tiers:
          - min_gt_exclusive: 0
            max_gt_inclusive: 5000
            rate_cents_per_gt: 20
          - min_gt_exclusive: 5000
            max_gt_inclusive: 20000
            rate_cents_per_gt: 15
          - min_gt_exclusive: 20000
            max_gt_inclusive: null
            rate_cents_per_gt: 10
          draft_surcharge_threshold_dm: 100
          draft_surcharge_pct: 0.15
          detention_free_minutes: 30
          detention_rate_cents_per_minute: 200
          delay_rate_cents_per_minute: 150
        as: AssociationAdmin
      - call: POST /pilotage/vessel-orders
        payload:
          vessel_name: MV Amend
          gt: 25000
          draft_dm: 120
          order_type: ARRIVAL
          eta: '2026-08-10T00:00:00Z'
        as: VesselAgent
        as_user_id: agent-1
        captures:
          o1_id: $.data.id
          o_v: $.data.version
      trigger:
      - call: PATCH /pilotage/vessel-orders/${o1_id}
        payload:
          draft_dm: 90
          expected_order_version: ${o_v}
        as: VesselAgent
        as_user_id: agent-1
        captures:
          prov: $.data.provisional_fee_cents
          ver: $.data.version
      assert:
      - 'prov == 250000 (draft 90 <= 100: no surcharge; 25000 x 10)'
      - ver == 2 (version incremented by the amendment)
  - name: calc_rolling_duty_window_inclusion_boundary
    claim_type: input_set_filtering
    grounds:
    - calculations.fatigue_rolling_duty
    distinguishing_aspect: 'Window inclusion is boundary-inclusive: a completion with actual_end exactly == now - 7d IS counted, so rolling duty reads 60 not 0.'
    test_recipe:
      setup:
      - MAIN_TARIFF active; P1 endorsed cap 100000; boat BA; A1 dispatched window [2026-08-03T22:00Z, 2026-08-03T23:00Z]
      - A1 started at clock 2026-08-03T22:00Z and completed at clock 2026-08-03T23:00Z (duration 60)
      - clock set to 2026-08-10T23:00:00Z -> window start exactly 2026-08-03T23:00:00Z
      setup_api_calls:
      - call: POST /pilotage/tariff-schedules
        payload:
          effective_from: '2026-01-01T00:00:00Z'
          tiers:
          - min_gt_exclusive: 0
            max_gt_inclusive: 5000
            rate_cents_per_gt: 20
          draft_surcharge_threshold_dm: 100
          draft_surcharge_pct: 0.15
          detention_free_minutes: 30
          detention_rate_cents_per_minute: 200
          delay_rate_cents_per_minute: 150
        as: AssociationAdmin
      - call: POST /pilotage/pilots
        payload:
          full_name: Pilot One
          license_number: LIC-1
          share_units: 1
        as: AssociationAdmin
        captures:
          p1_id: $.data.id
          p1_v: $.data.version
      - call: POST /pilotage/pilots/${p1_id}/endorsements
        payload:
          endorsement_class: UNLIMITED
          tonnage_cap_gt: 100000
          expires_at: '2027-01-01T00:00:00Z'
          expected_pilot_version: ${p1_v}
        as: AssociationAdmin
      - call: POST /pilotage/pilot-boats
        payload:
          name: Boat A
          capacity_persons: 6
        as: AssociationAdmin
      - call: POST /pilotage/vessel-orders
        payload:
          vessel_name: MV One
          gt: 8000
          draft_dm: 90
          order_type: ARRIVAL
          eta: '2026-08-03T00:00:00Z'
        as: VesselAgent
        as_user_id: agent-1
        captures:
          o1_id: $.data.id
      - call: POST /pilotage/vessel-orders/${o1_id}/dispatch
        payload:
          scheduled_start: '2026-08-03T22:00:00Z'
          scheduled_end: '2026-08-03T23:00:00Z'
        as: Dispatcher
