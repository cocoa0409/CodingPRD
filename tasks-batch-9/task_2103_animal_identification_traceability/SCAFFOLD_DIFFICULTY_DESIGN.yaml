          Entity pair DeviceSupplier -> TagLot: the TagLot creation is legal in every respect of its
          own (fresh serial range, quantity under the default cap, correct OCC version) and is
          rejected purely because the parent supplier still sits in PENDING_REVIEW.
        test_recipe:
          setup:
            - "Premises P is ACTIVE. Supplier SUPX exists but has never been approved, so its status is PENDING_REVIEW."
          setup_api_calls:
            - call: "POST /producers"
