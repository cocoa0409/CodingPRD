      - name: non_owner_client_cannot_accept_proposal_returns_not_owner
        claim_type: peer_roles
        grounds: [roles, "validations[priority=4]", "errors[ERR_NOT_OWNER]"]
        distinguishing_aspect: "A Client who is NOT the project owner calling accept on a SENT proposal -> 403 ERR_NOT_OWNER (ownership check, distinct from role check)."
        test_recipe:
          setup: ["Two clients; a SENT proposal on a project owned by client A; client B (a valid Client) attempts accept."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Owner A", email: "a@x.com" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Other B", email: "b@x.com" }
              as: PlatformAdmin
              captures: { other_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${owner_id}", site_address: "1 St", region_code: "WEST" }
              as: ProjectManager
              captures: { proj_id: $.data.id, proj_v0: $.data.version }
            - call: "POST /projects/${proj_id}/proposals"
              payload: { labor_hours_estimate: 1.0, expected_project_version: "${proj_v0}" }
              as: SystemsDesigner
              captures: { prop_id: $.data.id }
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/line-items"
              payload: { sku: "X", category: "CONTROLLER", qty: 1, unit_price_cents: 250000 }
              as: SystemsDesigner
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/send"
              payload: {}
              as: SystemsDesigner
          trigger:
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${other_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_OWNER"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: peer_roles
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with an unknown X-User-Role -> 401 ERR_UNAUTHENTICATED (auth precedes everything)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { full_name: "Z", email: "z@x.com" }
              as: Ghost
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHENTICATED"

