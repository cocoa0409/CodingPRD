            - call: "POST /practices"
              payload: { name: "Northside Family Health", office_open_utc_hhmm: "13:00", office_close_utc_hhmm: "22:00", per_minute_rate_millicents: 4225 }
              as: PlatformAdmin
              captures: { practice_a_id: $.data.id }
            - call: "POST /practices"
              payload: { name: "Southside Pediatrics", office_open_utc_hhmm: "13:00", office_close_utc_hhmm: "22:00", per_minute_rate_millicents: 3000 }
              as: PlatformAdmin
              captures: { practice_b_id: $.data.id }
