  - method: GET
    path: "/api/trivia-sessions/{id}/trivia-entries"
    description: "List entries in a session"
    roles: [PlatformAdmin, VenueManager, Host]
    code: 200
    input: []
    output: TriviaEntry[]
    side_effects: []

  - method: POST
    path: "/api/trivia-entries/{entry_id}/answers"
