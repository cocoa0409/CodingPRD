              as: ContentProducer
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/status"
              payload: { to_status: "LIVE" }
              as: ContentProducer
            - call: "POST /players"
              payload: { handle: "tide_pk", region_code: "NA", active_season_id: "${season_id}", is_minor: true, guardian_verified: false }
              as: LiveOpsCommander
              captures: { pk_id: $.data.id }
            - call: "POST /players/${pk_id}/currency-accounts"
              payload: { currency_code: "HARD_GEM" }
              as: LiveOpsCommander
              captures: { pk_gem_id: $.data.id }
            - call: "POST /players"
              payload: { handle: "tide_pa", region_code: "NA", active_season_id: "${season_id}", is_minor: false, guardian_verified: false }
              as: LiveOpsCommander
              captures: { pa_id: $.data.id }
            - call: "POST /players/${pa_id}/currency-accounts"
              payload: { currency_code: "HARD_GEM" }
              as: LiveOpsCommander
              captures: { pa_gem_id: $.data.id }
            - call: "POST /offers"
              payload: { season_id: "${season_id}", offer_type: "LIMITED_TIME", sku: "KID_PACK", price_tier: "T1", list_price_minor: 300, line_items: [{ sku: "KID_COINS", base_price_minor: 300, declared_value_minor: 400, granted_currency_code: "HARD_GEM", granted_amount_minor: 300 }], minor_purchasable: true, window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-20T00:00:00Z" }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
              captures: { kid_id: $.data.id }
            - call: "POST /offers/${kid_id}/submit"
              payload: {}
              as: EconomyDesigner
              as_user_id: "u_designer_1"
            - call: "POST /offers/${kid_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "u_compliance_1"
            - call: "GET /seasons/${season_id}"
              payload: {}
              as: LiveOpsCommander
              captures: { season_v1: $.data.version }
            - call: "POST /offers/${kid_id}/publish"
              payload: { expected_season_version: "${season_v1}" }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
