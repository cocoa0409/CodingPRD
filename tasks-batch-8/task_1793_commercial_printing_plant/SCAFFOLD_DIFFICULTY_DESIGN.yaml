            - "GangRun.${gang}.members length == 0 and version unchanged"

  - rule_id: boundary_precision_check
    instances:
      - name: overrun_cap_inclusive_boundary
        grounds:
          - calculations.overrun_underrun_billing
          - entities.Invoice.fields.billable_quantity
        distinguishing_aspect: |
          Metric: quantity-percentage tolerance. Delivered exactly at the
          inclusive cap Q + floor(Q*5/100) = 10502 bills the full 10502; one
          piece beyond (10503) clamps billable to 10502 — the >= vs > boundary
          changes the billable quantity by exactly one piece. Reached via
          POST /jobs/{id}/record-delivery + POST /invoices.
        test_recipe:
          setup:
            - "Two identical SHIP jobs (standard Q=10002 spec, total 773267), both driven to READY_TO_SHIP"
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Bnd Cust", credit_limit_cents: 100000000, default_tolerance_pct: 5 }, as: PlantManager, captures: { cust: $.data.id } }
            - { call: "POST /paper-stocks", payload: { name: "80G", grade: "COATED", cost_per_sheet_cents: 9, reorder_threshold_sheets: 0, reorder_quantity_sheets: 20000 }, as: PurchasingManager, captures: { stock: $.data.id } }
            - { call: "POST /paper-purchase-orders", payload: { paper_stock_id: "${stock}", ordered_sheets: 50000, cost_per_sheet_cents: 9 }, as: PurchasingManager, captures: { po: $.data.id } }
