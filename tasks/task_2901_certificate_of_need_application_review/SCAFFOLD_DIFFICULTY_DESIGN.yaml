# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Certificate of Need Application & Review — 9 rule_ids x 2 instances = 18.
# Every numeric literal in `assert:` was computed by executing the pinned
# §1.3 formula against the literals pinned in `setup_api_calls`.
# Logical clock starts at 2026-08-01T00:00:00Z (see POST /_clock/set_current_utc).
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: loi_threshold_project_basis_vs_aggregated_same_row_data
        grounds:
          - calculations.loi_review_threshold_determination
          - entities.LetterOfIntent.fields.governing_review_basis
          - entities.LetterOfIntent.fields.aggregate_capital_cost_cents
          - entities.LetterOfIntent.fields.prior_window_loi_count
          - validations[priority=10]
        distinguishing_aspect: |
          Variant divergence on the LetterOfIntent domain (project-review threshold): the
          second letter's own capital_cost_cents 250000000 and bed_delta 3 are both under
          threshold, so PROJECT_BASED yields NON_REVIEWABLE, while AGGREGATED_24_MONTH over
          the applicant's prior letter in the same area yields 550000000 >= 500000000 and
          therefore REVIEWABLE — identical row data, opposite determination.
        test_recipe:
          setup:
            - "One planning area HSA-NORTH and one ACUTE_CARE_BEDS formula exist."
            - "Applicant Northside has one FILED letter of intent in HSA-NORTH filed at 2026-08-01T00:00:00Z for 300000000 cents / 3 beds in cycle 1 (its own thresholds are not met, so it is NON_REVIEWABLE)."
            - "A second cycle for the same area and service type exists whose review window [application_deadline_at, decision_deadline_at] is disjoint from cycle 1's."
            - "The logical clock is at 2026-09-15T00:00:00Z, inside cycle 2's letter-of-intent window and inside the 24-month lookback of the first letter."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /health-service-areas"
              payload: { code: "HSA-NORTH", name: "North Planning Area", population_projection: 54750, existing_licensed_beds: 70 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hsa_id: $.data.id }
            - call: "POST /state-plan-formulas"
              payload: { service_type: "ACUTE_CARE_BEDS", effective_from_date: "2026-01-01", use_rate_per_1000: 100.0, average_length_of_stay_days: 5.0, base_target_occupancy_rate: 0.75, high_volume_target_occupancy_rate: 0.85, high_volume_bed_threshold: 100 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { formula_id: $.data.id }
            - call: "POST /applicants"
              payload: { legal_name: "Northside Hospital", organization_type: "HOSPITAL", contact_email: "filings@northside.example" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { appl_a_id: $.data.id }
            - call: "POST /batching-cycles"
              payload: { hsa_id: "${hsa_id}", formula_id: "${formula_id}", service_type: "ACUTE_CARE_BEDS", loi_deadline_at: "2026-08-10T00:00:00Z", application_deadline_at: "2026-08-20T00:00:00Z", comment_period_closes_at: "2026-08-25T00:00:00Z", intervention_deadline_at: "2026-08-28T00:00:00Z", completeness_deadline_at: "2026-09-05T00:00:00Z", decision_deadline_at: "2026-09-30T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { cycle1_id: $.data.id }
            - call: "POST /letters-of-intent"
              payload: { applicant_id: "${appl_a_id}", hsa_id: "${hsa_id}", batching_cycle_id: "${cycle1_id}", service_type: "ACUTE_CARE_BEDS", project_description: "3-bed acute care addition, phase one", capital_cost_cents: 300000000, bed_delta: 3 }
              as: Applicant
              as_user_id: "${appl_a_id}"
              captures: { loi1_id: $.data.id, loi1_determination: $.data.review_determination, loi1_basis: $.data.governing_review_basis }
            - call: "POST /batching-cycles"
              payload: { hsa_id: "${hsa_id}", formula_id: "${formula_id}", service_type: "ACUTE_CARE_BEDS", loi_deadline_at: "2026-10-01T00:00:00Z", application_deadline_at: "2026-10-05T00:00:00Z", comment_period_closes_at: "2026-10-10T00:00:00Z", intervention_deadline_at: "2026-10-15T00:00:00Z", completeness_deadline_at: "2026-10-20T00:00:00Z", decision_deadline_at: "2026-11-30T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { cycle2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /letters-of-intent"
              payload: { applicant_id: "${appl_a_id}", hsa_id: "${hsa_id}", batching_cycle_id: "${cycle2_id}", service_type: "ACUTE_CARE_BEDS", project_description: "3-bed acute care addition, phase two", capital_cost_cents: 250000000, bed_delta: 3 }
              as: Applicant
              as_user_id: "${appl_a_id}"
              captures: { loi2_id: $.data.id }
          assert:
            - "LetterOfIntent.${loi1_id}.governing_review_basis == PROJECT_BASED"
            - "LetterOfIntent.${loi1_id}.prior_window_loi_count == 0"
            - "LetterOfIntent.${loi1_id}.review_determination == NON_REVIEWABLE"
            - "LetterOfIntent.${loi2_id}.project_basis_reviewable == false"
            - "LetterOfIntent.${loi2_id}.aggregated_basis_reviewable == true"
            - "LetterOfIntent.${loi2_id}.prior_window_loi_count == 1"
            - "LetterOfIntent.${loi2_id}.aggregate_capital_cost_cents == 550000000"
            - "LetterOfIntent.${loi2_id}.aggregate_bed_delta == 6"
            - "LetterOfIntent.${loi2_id}.governing_review_basis == AGGREGATED_24_MONTH"
            - "LetterOfIntent.${loi2_id}.review_determination == REVIEWABLE"

      - name: certificate_expenditure_cash_vs_accrual_same_reports
        grounds:
          - calculations.certificate_cumulative_expenditure
          - entities.Certificate.fields.expenditure_basis
          - entities.Certificate.fields.expenditure_ceiling_cents
          - state_machines.Certificate.WITHIN_LIMIT_to_LIMIT_BREACHED
          - state_machines.Certificate.ISSUED_to_SUSPENDED
        distinguishing_aspect: |
          Variant divergence on a different entity domain (Certificate expenditure control,
          not LetterOfIntent thresholds): two certificates carrying byte-identical progress
          reports end at 850000000 governing / WITHIN_LIMIT under CASH and 1250000000
          governing / LIMIT_BREACHED plus lifecycle SUSPENDED under ACCRUAL.
        test_recipe:
          setup:
            - "Cycle 1 in HSA-NORTH reached DECIDED at 2026-09-10T00:00:00Z with unmet_bed_need_at_open 19; application A (Northside, 12 beds) is APPROVED and application B (Lakeview, 10 beds requested, partial acceptable) is APPROVED_WITH_CONDITIONS with 7 beds."
            - "The clock is at 2026-10-11T00:00:00Z, one day past both applications' appeal_window_closes_at 2026-10-10T00:00:00Z, so certificates may issue."
            - "Certificate A carries expenditure_basis CASH and certificate B carries ACCRUAL; both have approved_expenditure_limit_cents 1000000000, hence expenditure_ceiling_cents 1050000000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /health-service-areas"
              payload: { code: "HSA-NORTH", name: "North Planning Area", population_projection: 54750, existing_licensed_beds: 70 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hsa_id: $.data.id }
            - call: "POST /state-plan-formulas"
              payload: { service_type: "ACUTE_CARE_BEDS", effective_from_date: "2026-01-01", use_rate_per_1000: 100.0, average_length_of_stay_days: 5.0, base_target_occupancy_rate: 0.75, high_volume_target_occupancy_rate: 0.85, high_volume_bed_threshold: 100 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { formula_id: $.data.id }
            - call: "POST /applicants"
              payload: { legal_name: "Northside Hospital", organization_type: "HOSPITAL", contact_email: "filings@northside.example" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { appl_a_id: $.data.id }
            - call: "POST /applicants"
              payload: { legal_name: "Lakeview Medical", organization_type: "HOSPITAL", contact_email: "filings@lakeview.example" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { appl_b_id: $.data.id }
            - call: "POST /batching-cycles"
              payload: { hsa_id: "${hsa_id}", formula_id: "${formula_id}", service_type: "ACUTE_CARE_BEDS", loi_deadline_at: "2026-08-10T00:00:00Z", application_deadline_at: "2026-08-20T00:00:00Z", comment_period_closes_at: "2026-08-25T00:00:00Z", intervention_deadline_at: "2026-08-28T00:00:00Z", completeness_deadline_at: "2026-09-05T00:00:00Z", decision_deadline_at: "2026-09-30T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { cycle_id: $.data.id }
            - call: "POST /letters-of-intent"
              payload: { applicant_id: "${appl_a_id}", hsa_id: "${hsa_id}", batching_cycle_id: "${cycle_id}", service_type: "ACUTE_CARE_BEDS", project_description: "12-bed acute care expansion", capital_cost_cents: 800000000, bed_delta: 12 }
              as: Applicant
              as_user_id: "${appl_a_id}"
              captures: { loi_a_id: $.data.id }
            - call: "POST /letters-of-intent"
              payload: { applicant_id: "${appl_b_id}", hsa_id: "${hsa_id}", batching_cycle_id: "${cycle_id}", service_type: "ACUTE_CARE_BEDS", project_description: "10-bed acute care expansion", capital_cost_cents: 600000000, bed_delta: 10 }
              as: Applicant
              as_user_id: "${appl_b_id}"
              captures: { loi_b_id: $.data.id }
            - call: "POST /applications"
              payload: { loi_id: "${loi_a_id}", requested_bed_count: 12, projected_capital_cost_cents: 800000000, narrative: "Northside 12-bed acute care application", partial_award_acceptable: false }
              as: Applicant
              as_user_id: "${appl_a_id}"
              captures: { app_a_id: $.data.id }
            - call: "POST /applications"
              payload: { loi_id: "${loi_b_id}", requested_bed_count: 10, projected_capital_cost_cents: 600000000, narrative: "Lakeview 10-bed acute care application", partial_award_acceptable: true }
              as: Applicant
              as_user_id: "${appl_b_id}"
              captures: { app_b_id: $.data.id }
            - call: "POST /batching-cycles/${cycle_id}/advance"
              payload: { to_status: "OPEN_FOR_APPLICATIONS" }
              as: IntakeAnalyst
              as_user_id: "intake-1"
            - call: "POST /applications/${app_a_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${appl_a_id}"
            - call: "POST /applications/${app_b_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${appl_b_id}"
            - call: "POST /batching-cycles/${cycle_id}/advance"
              payload: { to_status: "COMPLETENESS_WINDOW" }
              as: IntakeAnalyst
              as_user_id: "intake-1"
            - call: "POST /applications/${app_a_id}/deem-complete"
              payload: {}
              as: IntakeAnalyst
              as_user_id: "intake-1"
            - call: "POST /applications/${app_b_id}/deem-complete"
              payload: {}
              as: IntakeAnalyst
              as_user_id: "intake-1"
            - call: "POST /batching-cycles/${cycle_id}/advance"
              payload: { to_status: "COMPARATIVE_REVIEW" }
              as: IntakeAnalyst
              as_user_id: "intake-1"
            - call: "GET /applications/${app_a_id}"
              as: ReviewAnalyst
              as_user_id: "rev-1"
              captures: { v_a1: $.data.version }
            - call: "POST /score-sheets"
              payload: { application_id: "${app_a_id}", need_conformity_score: 88, financial_feasibility_score: 75, cost_containment_score: 70, access_underserved_score: 90, quality_record_score: 60, expected_application_version: "${v_a1}", narrative: "reviewer 1 on A" }
              as: ReviewAnalyst
              as_user_id: "rev-1"
            - call: "GET /applications/${app_a_id}"
              as: ReviewAnalyst
              as_user_id: "rev-2"
              captures: { v_a2: $.data.version }
            - call: "POST /score-sheets"
              payload: { application_id: "${app_a_id}", need_conformity_score: 91, financial_feasibility_score: 80, cost_containment_score: 65, access_underserved_score: 85, quality_record_score: 62, expected_application_version: "${v_a2}", narrative: "reviewer 2 on A" }
              as: ReviewAnalyst
              as_user_id: "rev-2"
            - call: "GET /applications/${app_a_id}"
              as: ReviewAnalyst
              as_user_id: "rev-3"
              captures: { v_a3: $.data.version }
            - call: "POST /score-sheets"
              payload: { application_id: "${app_a_id}", need_conformity_score: 90, financial_feasibility_score: 78, cost_containment_score: 68, access_underserved_score: 95, quality_record_score: 61, expected_application_version: "${v_a3}", narrative: "reviewer 3 on A" }
              as: ReviewAnalyst
              as_user_id: "rev-3"
            - call: "GET /applications/${app_b_id}"
              as: ReviewAnalyst
              as_user_id: "rev-1"
              captures: { v_b1: $.data.version }
            - call: "POST /score-sheets"
              payload: { application_id: "${app_b_id}", need_conformity_score: 92, financial_feasibility_score: 70, cost_containment_score: 60, access_underserved_score: 80, quality_record_score: 50, expected_application_version: "${v_b1}", narrative: "reviewer 1 on B" }
              as: ReviewAnalyst
              as_user_id: "rev-1"
            - call: "GET /applications/${app_b_id}"
              as: ReviewAnalyst
              as_user_id: "rev-2"
              captures: { v_b2: $.data.version }
            - call: "POST /score-sheets"
              payload: { application_id: "${app_b_id}", need_conformity_score: 93, financial_feasibility_score: 71, cost_containment_score: 61, access_underserved_score: 81, quality_record_score: 51, expected_application_version: "${v_b2}", narrative: "reviewer 2 on B" }
              as: ReviewAnalyst
              as_user_id: "rev-2"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /batching-cycles/${cycle_id}/comparative-decision"
              payload: { decision_note: "Cycle 1 comparative decision" }
              as: DecisionOfficer
              as_user_id: "officer-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-11T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /certificates"
              payload: { application_id: "${app_a_id}", approved_expenditure_limit_cents: 1000000000, implementation_milestone_date: "2027-06-30", expenditure_basis: "CASH", conditions: ["Quarterly progress reporting"], required_completion_pct_at_milestone: 25 }
              as: DecisionOfficer
              as_user_id: "officer-1"
              captures: { cert_a_id: $.data.id, cert_a_v1: $.data.version }
            - call: "POST /certificates"
              payload: { application_id: "${app_b_id}", approved_expenditure_limit_cents: 1000000000, implementation_milestone_date: "2027-06-30", expenditure_basis: "ACCRUAL", conditions: ["Quarterly progress reporting"], required_completion_pct_at_milestone: 25 }
              as: DecisionOfficer
              as_user_id: "officer-1"
              captures: { cert_b_id: $.data.id, cert_b_v1: $.data.version }
            - call: "POST /progress-reports"
              payload: { certificate_id: "${cert_a_id}", period_end_date: "2026-10-31", disbursed_cents: 600000000, obligated_cents: 300000000, physical_completion_pct: 20, expected_certificate_version: "${cert_a_v1}", condition_attestations: ["Quarterly progress reporting"] }
              as: Applicant
              as_user_id: "${appl_a_id}"
            - call: "POST /progress-reports"
              payload: { certificate_id: "${cert_b_id}", period_end_date: "2026-10-31", disbursed_cents: 600000000, obligated_cents: 300000000, physical_completion_pct: 20, expected_certificate_version: "${cert_b_v1}", condition_attestations: ["Quarterly progress reporting"] }
              as: Applicant
              as_user_id: "${appl_b_id}"
            - call: "GET /certificates/${cert_a_id}"
              as: Applicant
              as_user_id: "${appl_a_id}"
              captures: { cert_a_v2: $.data.version }
            - call: "GET /certificates/${cert_b_id}"
              as: Applicant
              as_user_id: "${appl_b_id}"
              captures: { cert_b_v2: $.data.version }
          trigger:
            - call: "POST /progress-reports"
              payload: { certificate_id: "${cert_a_id}", period_end_date: "2026-11-30", disbursed_cents: 250000000, obligated_cents: 100000000, physical_completion_pct: 35, expected_certificate_version: "${cert_a_v2}", condition_attestations: ["Quarterly progress reporting"] }
              as: Applicant
              as_user_id: "${appl_a_id}"
            - call: "POST /progress-reports"
              payload: { certificate_id: "${cert_b_id}", period_end_date: "2026-11-30", disbursed_cents: 250000000, obligated_cents: 100000000, physical_completion_pct: 35, expected_certificate_version: "${cert_b_v2}", condition_attestations: ["Quarterly progress reporting"] }
              as: Applicant
              as_user_id: "${appl_b_id}"
          assert:
            - "Certificate.${cert_a_id}.cumulative_expenditure_cash_cents == 850000000"
            - "Certificate.${cert_a_id}.cumulative_expenditure_accrual_cents == 1250000000"
            - "Certificate.${cert_a_id}.expenditure_ceiling_cents == 1050000000"
            - "Certificate.${cert_a_id}.expenditure_status == WITHIN_LIMIT"
            - "Certificate.${cert_a_id}.lifecycle_status == ISSUED"
            - "Certificate.${cert_b_id}.cumulative_expenditure_cash_cents == 850000000"
            - "Certificate.${cert_b_id}.cumulative_expenditure_accrual_cents == 1250000000"
            - "Certificate.${cert_b_id}.expenditure_status == LIMIT_BREACHED"
            - "Certificate.${cert_b_id}.lifecycle_status == SUSPENDED"
            - "Certificate.${cert_b_id}.lifecycle_status_before_suspension == ISSUED"
            - "Applicant.${appl_b_id}.compliance_strike_count == 1"
            - "Applicant.${appl_a_id}.compliance_strike_count == 0"

  - rule_id: combinatorial_formula
    instances:

      - name: need_methodology_occupancy_tier_pinned_evaluation_order
        grounds:
          - calculations.cycle_need_methodology
          - entities.BatchingCycle.fields.provisional_required_beds
          - entities.BatchingCycle.fields.selected_target_occupancy_rate
          - entities.BatchingCycle.fields.required_beds_final
          - entities.StatePlanFormula.fields.high_volume_bed_threshold
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the occupancy rate is selected from the
          provisional bed requirement while the bed requirement is computed from the
          occupancy rate. Evaluation order is pinned to exactly one base pass then one
          final pass, so provisional_required_beds 100.0000 selects 0.85 and the final
          value 89 does NOT re-select the base rate even though 89 < 100.
        test_recipe:
          setup:
            - "Planning area HSA-NORTH has population_projection 54750 and existing_licensed_beds 70, approved_unimplemented_beds 0."
            - "The ACUTE_CARE_BEDS formula has use_rate_per_1000 100.0, average_length_of_stay_days 5.0, base_target_occupancy_rate 0.75, high_volume_target_occupancy_rate 0.85 and high_volume_bed_threshold 100."
            - "The logical clock is at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /health-service-areas"
              payload: { code: "HSA-NORTH", name: "North Planning Area", population_projection: 54750, existing_licensed_beds: 70 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hsa_id: $.data.id }
            - call: "POST /state-plan-formulas"
              payload: { service_type: "ACUTE_CARE_BEDS", effective_from_date: "2026-01-01", use_rate_per_1000: 100.0, average_length_of_stay_days: 5.0, base_target_occupancy_rate: 0.75, high_volume_target_occupancy_rate: 0.85, high_volume_bed_threshold: 100 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { formula_id: $.data.id }
          trigger:
            - call: "POST /batching-cycles"
              payload: { hsa_id: "${hsa_id}", formula_id: "${formula_id}", service_type: "ACUTE_CARE_BEDS", loi_deadline_at: "2026-08-10T00:00:00Z", application_deadline_at: "2026-08-20T00:00:00Z", comment_period_closes_at: "2026-08-25T00:00:00Z", intervention_deadline_at: "2026-08-28T00:00:00Z", completeness_deadline_at: "2026-09-05T00:00:00Z", decision_deadline_at: "2026-09-30T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { cycle_id: $.data.id }
          assert:
            - "BatchingCycle.${cycle_id}.projected_patient_days == 27375.0000"
            - "BatchingCycle.${cycle_id}.provisional_required_beds == 100.0000"
            - "BatchingCycle.${cycle_id}.selected_target_occupancy_rate == 0.85"
            - "BatchingCycle.${cycle_id}.required_beds_final == 89"
            - "BatchingCycle.${cycle_id}.inventory_beds_at_open == 70"
            - "BatchingCycle.${cycle_id}.unmet_bed_need_at_open == 19"
            - "BatchingCycle.${cycle_id}.unallocated_bed_need == 19"
            - "BatchingCycle.${cycle_id}.pinned_formula_version == 1"

      - name: comparative_score_per_criterion_rounding_before_weighting
        grounds:
          - calculations.application_comparative_score
          - entities.Application.fields.comparative_score
          - entities.Application.fields.score_sheet_count
          - entities.ScoreSheet.fields.need_conformity_score
          - concurrency_rules[score-sheet-revision-stale-application]
        distinguishing_aspect: |
          Mode (b) nested rounding: three sheets whose per-criterion means are 89.6667,
          77.6667, 67.6667, 90.0000 and 61.0000 give exactly 79.70 under the pinned
          round-each-criterion-to-whole-points-then-weight order, whereas weighting the
          unrounded means and rounding only the total gives 79.45.
        test_recipe:
          setup:
            - "Cycle 1 in HSA-NORTH is in COMPARATIVE_REVIEW with a single candidate application A (Northside, 12 beds requested)."
            - "Two ACTIVE score sheets already exist on A: reviewer rev-1 (88/75/70/90/60) and reviewer rev-2 (91/80/65/85/62)."
          setup_api_calls:
            - call: "POST /health-service-areas"
              payload: { code: "HSA-NORTH", name: "North Planning Area", population_projection: 54750, existing_licensed_beds: 70 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hsa_id: $.data.id }
            - call: "POST /state-plan-formulas"
              payload: { service_type: "ACUTE_CARE_BEDS", effective_from_date: "2026-01-01", use_rate_per_1000: 100.0, average_length_of_stay_days: 5.0, base_target_occupancy_rate: 0.75, high_volume_target_occupancy_rate: 0.85, high_volume_bed_threshold: 100 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { formula_id: $.data.id }
            - call: "POST /applicants"
