            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-03", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              captures: { bed_ldr_3: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "OR-01", bed_type: "OR" }
              as: PerinatalSafetyOfficer
              captures: { bed_or_1: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Marisol Vance RN", staff_role: "RN_LABOR_DELIVERY", fetal_monitoring_cert_level: "ADVANCED", credential_expires_at: "2027-06-30T00:00:00Z", or_circulating_qualified: false }
              as: PerinatalSafetyOfficer
              captures: { s_charge: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
