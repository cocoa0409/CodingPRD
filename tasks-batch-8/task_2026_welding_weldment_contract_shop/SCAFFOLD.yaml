    side_effects: ["CASCADE: OPEN ConsumableIssues for lots in oven → VOID; their lots → QUARANTINED"]

  - method: POST
    path: "/weld-shop/shops/{id}/ovens/{ovenId}/bring-online"
    description: "Bring oven online"
    roles: [MaterialController]
    code: 200
    input: []
    output: Oven
    side_effects: []

  # ---------- PQR ----------
  - method: POST
    path: "/weld-shop/shops/{id}/pqrs"
    description: "Create PQR"
    roles: [QCManager]
    code: 201
    input: [pqr_number, process, base_metal_spec, thickness_range_min_mm, thickness_range_max_mm, test_report_id]
    output: PQR
    side_effects: []

  - method: GET
    path: "/weld-shop/shops/{id}/pqrs"
    description: "List PQRs"
    roles: [Any]
    code: 200
    input: []
    output: "PQR[]"
    side_effects: []

  - method: GET
    path: "/weld-shop/shops/{id}/pqrs/{pqrId}"
    description: "Get PQR"
    roles: [Any]
    code: 200
    input: []
    output: PQR
    side_effects: []

  - method: POST
    path: "/weld-shop/shops/{id}/pqrs/{pqrId}/approve"
    description: "Approve PQR"
    roles: [QCManager]
    code: 200
    input: []
    output: PQR
    side_effects: ["PQR.reviewed_by_user_id := X-User-ID", "PQR.version += 1"]

  - method: POST
    path: "/weld-shop/shops/{id}/pqrs/{pqrId}/reject"
    description: "Reject PQR"
    roles: [QCManager]
    code: 200
    input: []
    output: PQR
    side_effects: []

  # ---------- WPS ----------
  - method: POST
    path: "/weld-shop/shops/{id}/wps"
    description: "Create WPS revision"
    roles: [QCManager]
    code: 201
    input: [wps_number, revision, pqr_id, process, base_metal_spec, thickness_min_mm, thickness_max_mm]
    output: WPS
    side_effects: []

  - method: GET
    path: "/weld-shop/shops/{id}/wps"
    description: "List WPS"
    roles: [Any]
    code: 200
    input: []
    output: "WPS[]"
    side_effects: []

  - method: GET
    path: "/weld-shop/shops/{id}/wps/{wpsId}"
    description: "Get WPS"
    roles: [Any]
    code: 200
    input: []
    output: WPS
    side_effects: []

  - method: POST
    path: "/weld-shop/shops/{id}/wps/{wpsId}/approve"
    description: "Approve WPS; OCC via expected_wps_version; triggers supersession cascade"
    roles: [QCManager]
    code: 200
    input: [expected_wps_version]
    output: WPS
    side_effects:
      - "WPS.pinned_pqr_version := PQR.version"
      - "Prior APPROVED WPS of same (shop, wps_number) → SUPERSEDED (cascade)"
      - "In-flight PENDING Joints referencing superseded WPS → ON_HOLD (cascade)"
      - "WelderQualification rows referencing superseded WPS re-evaluated for lapse"
      - "increments WPS.version by 1"

  - method: POST
    path: "/weld-shop/shops/{id}/wps/{wpsId}/reject"
    description: "Reject WPS"
    roles: [QCManager]
    code: 200
    input: []
    output: WPS
    side_effects: []

  # ---------- Welder Qualifications ----------
  - method: POST
    path: "/weld-shop/shops/{id}/welder-qualifications"
    description: "Create qualification"
    roles: [QCManager]
    code: 201
    input: [welder_id, wps_id, process, qualified_at_utc]
    output: WelderQualification
    side_effects: ["status := QUALIFIED", "last_weld_at_utc := qualified_at_utc"]

  - method: GET
    path: "/weld-shop/shops/{id}/welder-qualifications"
    description: "List welder qualifications (filtered by welder_id? or wps_id?)"
    roles: [Any]
    code: 200
    input: ["welder_id?", "wps_id?"]
    output: "WelderQualification[]"
    side_effects: []

  - method: GET
    path: "/weld-shop/shops/{id}/welder-qualifications/{qualId}"
    description: "Get qualification"
    roles: [Any]
    code: 200
    input: []
    output: WelderQualification
    side_effects: []

  - method: POST
    path: "/weld-shop/shops/{id}/welder-qualifications/{qualId}/requalify"
    description: "Requalify LAPSED qualification"
    roles: [QCManager]
    code: 200
    input: []
    output: WelderQualification
    side_effects: ["qualified_at_utc := current_utc", "last_weld_at_utc := current_utc", "status := QUALIFIED"]

  - method: POST
    path: "/weld-shop/shops/{id}/welder-qualifications/{qualId}/revoke"
    description: "Revoke qualification"
    roles: [QCManager]
    code: 200
    input: []
    output: WelderQualification
    side_effects: []

  # ---------- Consumables ----------
  - method: POST
    path: "/weld-shop/shops/{id}/consumable-lots"
    description: "Receive a consumable lot into an oven"
    roles: [MaterialController]
    code: 201
    input: [lot_number, filler_spec, process, received_kg, oven_id]
    output: ConsumableLot
    side_effects: ["oven capacity check", "status := IN_OVEN"]

  - method: GET
    path: "/weld-shop/shops/{id}/consumable-lots"
    description: "List lots"
    roles: [Any]
    code: 200
    input: ["oven_id?", "status?"]
    output: "ConsumableLot[]"
    side_effects: []

  - method: GET
    path: "/weld-shop/shops/{id}/consumable-lots/{lotId}"
    description: "Get lot"
    roles: [Any]
    code: 200
    input: []
    output: ConsumableLot
    side_effects: []

  - method: POST
    path: "/weld-shop/shops/{id}/consumable-lots/{lotId}/rebake"
    description: "Rebake quarantined lot (at most once)"
    roles: [MaterialController]
    code: 200
    input: []
    output: ConsumableLot
    side_effects: ["rebake_count += 1", "exposed_minutes_total := 0", "status := IN_OVEN"]

  - method: POST
    path: "/weld-shop/shops/{id}/consumable-issues"
    description: "Issue consumables from oven to welder"
    roles: [MaterialController]
    code: 201
    input: [lot_id, oven_id, issued_to_welder_id, issued_kg]
    output: ConsumableIssue
    side_effects: ["Lot.remaining_kg -= issued_kg", "Lot.status := ISSUED"]

  - method: GET
    path: "/weld-shop/shops/{id}/consumable-issues"
    description: "List issues (filtered by lot_id? or issued_to_welder_id?)"
    roles: [Any]
    code: 200
    input: ["lot_id?", "issued_to_welder_id?"]
    output: "ConsumableIssue[]"
    side_effects: []

  - method: POST
    path: "/weld-shop/shops/{id}/consumable-issues/{issueId}/return"
    description: "Return unused consumables; accumulates exposure"
    roles: [MaterialController]
    code: 200
    input: []
    output: ConsumableIssue
    side_effects: ["exposure_minutes computed", "lot.exposed_minutes_total += exposure_minutes", "lot.status recomputed (QUARANTINED if SMAW and >= 240)"]

  # ---------- Fixtures ----------
  - method: POST
    path: "/weld-shop/shops/{id}/fixtures"
    description: "Create fixture"
    roles: [ProductionPlanner]
    code: 201
    input: [fixture_code, capacity_weldments, owner_party]
    output: Fixture
    side_effects: []

  - method: GET
    path: "/weld-shop/shops/{id}/fixtures"
    description: "List fixtures"
    roles: [Any]
    code: 200
    input: []
    output: "Fixture[]"
    side_effects: []

  - method: POST
    path: "/weld-shop/shops/{id}/fixtures/{fixtureId}/reserve"
    description: "Reserve fixture"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: Fixture
    side_effects: []

  - method: POST
    path: "/weld-shop/shops/{id}/fixtures/{fixtureId}/release"
    description: "Release fixture"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: Fixture
    side_effects: []

  # ---------- Shop Orders / Weldments ----------
  - method: POST
    path: "/weld-shop/shops/{id}/shop-orders"
    description: "Create shop order"
    roles: [ProductionPlanner]
    code: 201
    input: [po_number, customer_name, promised_ship_date_utc]
    output: ShopOrder
    side_effects: []

  - method: GET
    path: "/weld-shop/shops/{id}/shop-orders"
    description: "List shop orders"
    roles: [Any]
    code: 200
    input: []
    output: "ShopOrder[]"
    side_effects: []

  - method: GET
    path: "/weld-shop/shops/{id}/shop-orders/{orderId}"
    description: "Get shop order"
    roles: [Any]
    code: 200
    input: []
    output: ShopOrder
    side_effects: []

  - method: POST
    path: "/weld-shop/shops/{id}/shop-orders/{orderId}/weldments"
    description: "Create weldment under order"
    roles: [ProductionPlanner]
    code: 201
    input: [weldment_serial, fixture_id, drawing_revision]
    output: Weldment
    side_effects: ["posture := OPEN", "ShopOrder.status := IN_PROGRESS if it was OPEN"]

  - method: GET
    path: "/weld-shop/shops/{id}/shop-orders/{orderId}/weldments"
    description: "List weldments under order"
    roles: [Any]
    code: 200
    input: []
    output: "Weldment[]"
    side_effects: []

  - method: GET
    path: "/weld-shop/shops/{id}/weldments/{weldmentId}"
    description: "Get weldment"
    roles: [Any]
    code: 200
    input: []
    output: Weldment
    side_effects: []

  - method: POST
    path: "/weld-shop/shops/{id}/weldments/{weldmentId}/ship"
    description: "Ship weldment (OCC-gated)"
    roles: [ShippingClerk]
    code: 200
    input: [expected_weldment_version]
    output: Weldment
    side_effects:
      - "signed_off_at_utc := current_utc"
      - "Fixture cascade if last weldment"
      - "ShopOrder cascade if all weldments shipped"
      - "increments Weldment.version by 1"

  - method: POST
    path: "/weld-shop/shops/{id}/weldments/{weldmentId}/cancel"
    description: "Cancel weldment"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: Weldment
    side_effects: ["Joints → CANCELLED", "Inspections voided", "Fixture cascade"]

  - method: POST
    path: "/weld-shop/shops/{id}/weldments/{weldmentId}/clear-repair-review"
    description: "Clear REPAIR_REVIEW posture"
    roles: [QCManager]
    code: 200
    input: []
    output: Weldment
    side_effects: []

  - method: POST
    path: "/weld-shop/shops/{id}/weldments/{weldmentId}/unfreeze"
    description: "Unfreeze FROZEN weldment"
    roles: [QCManager]
    code: 200
    input: []
    output: Weldment
    side_effects: []

  # ---------- Joints ----------
  - method: POST
    path: "/weld-shop/shops/{id}/weldments/{weldmentId}/joints"
    description: "Create joint"
    roles: [WeldLead]
    code: 201
    input: [joint_number, wps_id, base_metal_thickness_mm, required_ndt_methods]
    output: Joint
    side_effects: []

  - method: GET
    path: "/weld-shop/shops/{id}/weldments/{weldmentId}/joints"
    description: "List joints under weldment"
    roles: [Any]
    code: 200
    input: []
    output: "Joint[]"
    side_effects: []

  - method: GET
    path: "/weld-shop/shops/{id}/joints/{jointId}"
    description: "Get joint"
    roles: [Any]
    code: 200
    input: []
    output: Joint
    side_effects: []

  - method: POST
    path: "/weld-shop/shops/{id}/joints/{jointId}/start-fabrication"
    description: "Start fabrication on joint (OCC-gated)"
    roles: [WeldLead]
    code: 200
    input: [expected_joint_version]
    output: Joint
    side_effects:
      - "fabrication_status := IN_PROGRESS"
      - "Fixture cascade to IN_USE on first weldment activity"
      - "increments Joint.version by 1"

  - method: POST
    path: "/weld-shop/shops/{id}/joints/{jointId}/weld-out"
    description: "Mark joint welded out"
    roles: [WeldLead]
    code: 200
    input: []
    output: Joint
    side_effects: ["fabrication_status := WELDED_OUT", "inspection_status := READY_FOR_VT"]

  - method: POST
    path: "/weld-shop/shops/{id}/joints/{jointId}/declare-repair"
    description: "Declare repair after NDT_FAILED"
    roles: [QCManager]
    code: 200
    input: []
    output: Joint
    side_effects: ["inspection_status := REPAIR_REQUIRED", "fabrication_status := IN_PROGRESS"]

  - method: POST
    path: "/weld-shop/shops/{id}/joints/{jointId}/rebind-wps"
    description: "Rebind ON_HOLD joint to new approved WPS"
    roles: [QCManager]
    code: 200
    input: [new_wps_id]
    output: Joint
    side_effects: ["fabrication_status := PENDING"]

  # ---------- Weld Passes ----------
  - method: POST
    path: "/weld-shop/shops/{id}/joints/{jointId}/weld-passes"
    description: "Record a weld pass"
    roles: [Welder]
    code: 201
    input: [welder_id, qualification_id, consumable_lot_id, consumable_used_kg, is_repair]
    output: WeldPass
    side_effects:
      - "WelderQualification.last_weld_at_utc := current_utc; continuity_expires_at_utc recomputed"
      - "ConsumableLot.remaining_kg -= consumable_used_kg"
      - "Weldment.total_pass_count += 1; if is_repair then repair_pass_count += 1"
      - "Weldment.repair_rate_pct recomputed; REPAIR_REVIEW posture trigger"
      - "First pass on Joint: Joint.inspection_status → READY_FOR_VT"

  - method: GET
    path: "/weld-shop/shops/{id}/joints/{jointId}/weld-passes"
    description: "List weld passes for a joint"
    roles: [Any]
    code: 200
    input: []
    output: "WeldPass[]"
    side_effects: []

  # ---------- Distortion ----------
  - method: POST
    path: "/weld-shop/shops/{id}/weldments/{weldmentId}/distortion-reports"
    description: "Report distortion"
    roles: [QualityInspector]
    code: 201
    input: [joint_id, measured_deviation_mm, tolerance_mm]
    output: DistortionReport
    side_effects: ["Weldment.distortion_count += 1", "FROZEN posture trigger if distortion_count >= 2 and any Joint NDT_FAILED"]

  - method: GET
    path: "/weld-shop/shops/{id}/weldments/{weldmentId}/distortion-reports"
    description: "List distortion reports"
    roles: [Any]
    code: 200
    input: []
    output: "DistortionReport[]"
    side_effects: []

  - method: POST
    path: "/weld-shop/shops/{id}/distortion-reports/{reportId}/disposition"
    description: "Disposition distortion (REWORK | USE_AS_IS | SCRAP)"
    roles: [QCManager]
    code: 200
    input: [disposition]
    output: DistortionReport
    side_effects: ["If disposition == SCRAP: parent Weldment → CANCELLED cascade", "If all PENDING distortion reports resolved: Weldment RESTRICTED → OPEN recompute"]

  # ---------- Inspections ----------
  - method: POST
    path: "/weld-shop/shops/{id}/joints/{jointId}/inspections"
    description: "Schedule/record inspection (VT in-house, UT/RT via vendor)"
    roles: [CWI]
    code: 201
    input: [method, scheduled_start_utc, scheduled_end_utc, "vendor_id?", "result?", "result_code?"]
    output: Inspection
    side_effects: ["If method==VT and result==PASS: joint inspection_status → VT_PASSED (or NDT_PASSED if no UT/RT required)", "If method ∈ {UT,RT}: inspection_status := NDT_IN_PROGRESS"]

  - method: GET
    path: "/weld-shop/shops/{id}/joints/{jointId}/inspections"
    description: "List inspections for joint"
    roles: [Any]
    code: 200
    input: []
    output: "Inspection[]"
    side_effects: []

  - method: GET
    path: "/weld-shop/shops/{id}/inspections/{inspectionId}"
    description: "Get inspection"
    roles: [Any]
    code: 200
    input: []
    output: Inspection
    side_effects: []

  - method: POST
    path: "/weld-shop/shops/{id}/inspections/{inspectionId}/record-result"
    description: "Record UT/RT result"
    roles: [CWI]
    code: 200
    input: [result, result_code]
    output: Inspection
    side_effects: ["resulted_at_utc := current_utc", "Joint inspection_status recomputed", "On FAIL: Joint.repair_cycle_count += 1; Weldment distortion_count recompute; possible FROZEN cascade"]

  # ---------- Traveler sign-off ----------
  - method: POST
    path: "/weld-shop/shops/{id}/weldments/{weldmentId}/traveler-sign-offs"
    description: "Record traveler sign-off step"
    roles: [CWI, WeldLead, QualityInspector]
    code: 201
    input: [step_code, "notes?"]
    output: TravelerSignOff
    side_effects: ["If step_code == FINAL: verifies all prior steps exist"]

  - method: GET
    path: "/weld-shop/shops/{id}/weldments/{weldmentId}/traveler-sign-offs"
    description: "List traveler sign-offs for weldment"
    roles: [Any]
    code: 200
    input: []
    output: "TravelerSignOff[]"
