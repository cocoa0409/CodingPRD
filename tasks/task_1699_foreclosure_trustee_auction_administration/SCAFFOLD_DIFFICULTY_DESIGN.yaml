# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Foreclosure Trustee & Auction Administration
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: quote_reinstatement_vs_payoff_divergence
        grounds:
          - calculations.quote_amounts
          - calculations.per_diem_interest
          - entities.Quote.fields.total_cents
        distinguishing_aspect: |
          Same case, same costs, same good_through date: the REINSTATEMENT variant
          totals 1156315 cents (arrears-based) while the PAYOFF variant totals
          41471640 cents (principal-based with 2% penalty) — dual-variant logic on
          the Quote entity domain, distinct from the SurplusClaim waterfall variant.
        test_recipe:
          setup:
            - "Beneficiary; case LN-Q1 (principal 40000000, rate 7.2, monthly 250000, 4 months arrears, late fee 12500/mo, interest paid through 2026-07-01, prepayment penalty applies)"
            - "NOD recorded 2026-08-01 (default clock)"
            - "Cost advances: 35000 APPROVED, 12000 APPROVED, 99999 left SUBMITTED (excluded from costs)"
          setup_api_calls:
            - { call: "POST /api/beneficiaries", payload: { name: "Beneficiary Alpha", reference_code: "BEN-Q1", contact_email: "alpha@ben.example" }, as: TrusteeAdmin, captures: { ben_id: $.data.id } }
            - { call: "POST /api/foreclosure-cases", payload: { beneficiary_id: "${ben_id}", loan_reference: "LN-Q1", borrower_name: "Borrower One", property_address: "1 Default Way", county_code: "CC01", unpaid_principal_balance_cents: 40000000, monthly_payment_cents: 250000, months_in_arrears: 4, late_fee_per_month_cents: 12500, note_rate_pct: 7.2, last_interest_paid_date: "2026-07-01", distribution_method: "STATUTORY_PRIORITY", prepayment_penalty_applies: true }, as: CaseManager, captures: { case_id: $.data.id } }
            - { call: "POST /api/foreclosure-cases/${case_id}/notices-of-default", payload: { recording_date: "2026-08-01", instrument_number: "NOD-Q1" }, as: CaseManager }
            - { call: "POST /api/foreclosure-cases/${case_id}/cost-advances", payload: { category: "PUBLICATION", amount_cents: 35000, incurred_date: "2026-08-01" }, as: Beneficiary, as_user_id: "${ben_id}", captures: { adv1: $.data.id } }
            - { call: "POST /api/foreclosure-cases/${case_id}/cost-advances", payload: { category: "RECORDING", amount_cents: 12000, incurred_date: "2026-08-01" }, as: Beneficiary, as_user_id: "${ben_id}", captures: { adv2: $.data.id } }
            - { call: "POST /api/foreclosure-cases/${case_id}/cost-advances", payload: { category: "LEGAL", amount_cents: 99999, incurred_date: "2026-08-01" }, as: Beneficiary, as_user_id: "${ben_id}" }
            - { call: "POST /api/cost-advances/${adv1}/review", payload: { decision: "APPROVE" }, as: CaseManager }
            - { call: "POST /api/cost-advances/${adv2}/review", payload: { decision: "APPROVE" }, as: CaseManager }
            - { call: "GET /api/foreclosure-cases/${case_id}", as: CaseManager, captures: { case_v1: $.data.version } }
          trigger:
            - { call: "POST /api/foreclosure-cases/${case_id}/quotes", payload: { quote_type: "REINSTATEMENT", good_through_date: "2026-09-15", expected_foreclosure_case_version: "${case_v1}" }, as: CaseManager, captures: { q_re: $.data.id } }
            - { call: "GET /api/foreclosure-cases/${case_id}", as: CaseManager, captures: { case_v2: $.data.version } }
            - { call: "POST /api/foreclosure-cases/${case_id}/quotes", payload: { quote_type: "PAYOFF", good_through_date: "2026-09-15", expected_foreclosure_case_version: "${case_v2}" }, as: CaseManager, captures: { q_po: $.data.id } }
          assert:
            - "Quote.${q_re}.arrears_cents == 1000000 and late_fees_cents == 50000 and costs_cents == 47000"
            - "Quote.${q_re}.interest_cents == 9315 (per-diem 207 x 45 days from 2026-08-01 to 2026-09-15)"
            - "Quote.${q_re}.trustee_fee_cents == 50000 and prepayment_penalty_cents == 0"
            - "Quote.${q_re}.total_cents == 1156315"
            - "Quote.${q_po}.interest_cents == 599640 (per-diem 7890 x 76 days from 2026-07-01 to 2026-09-15)"
            - "Quote.${q_po}.prepayment_penalty_cents == 800000 and trustee_fee_cents == 25000 and arrears_cents == 0"
            - "Quote.${q_po}.total_cents == 41471640"
            - "Quote.${q_re}.status == ISSUED after payoff issuance (supersede is same-type only)"
            - "costs_cents == 47000 proves the 99999 SUBMITTED advance is excluded"

      - name: surplus_waterfall_statutory_vs_prorata
        grounds:
          - calculations.surplus_waterfall
          - calculations.surplus_and_obligations
          - entities.SurplusClaim.fields.paid_cents
        distinguishing_aspect: |
          Identical claims and identical surplus 1640950 cents: STATUTORY_PRIORITY
          pays claim A 1640950 / B 0 / C 0 (filing order within tier), while
          PRO_RATA pays A 1093967 / B 546983 / C 0 (proportional split with
          cent remainder to earliest created_at) — dual-variant logic on the
          SurplusClaim/Disbursement domain, distinct from the Quote variant.
        test_recipe:
          setup:
            - "Two cases LN-W1S (STATUTORY_PRIORITY) and LN-W1P (PRO_RATA), identical loan terms (principal 40000000, rate 7.2, interest paid through 2026-07-01, no prepayment penalty, no cost advances)"
            - "Both driven to SOLD on 2026-11-23 with a single third-party bid of 43000000 (opening 42000000); surplus == 1640950 on each"
            - "Identical claims on each case: A priority 1 approved 2000000 (filed first), B priority 1 approved 1000000 (filed second), C priority 2 approved 900000"
          setup_api_calls:
            - { call: "POST /api/beneficiaries", payload: { name: "Beneficiary Beta", reference_code: "BEN-W1", contact_email: "beta@ben.example" }, as: TrusteeAdmin, captures: { ben_id: $.data.id } }
            - { call: "POST /api/foreclosure-cases", payload: { beneficiary_id: "${ben_id}", loan_reference: "LN-W1S", borrower_name: "Borrower S", property_address: "2 Lien Ln", county_code: "CC01", unpaid_principal_balance_cents: 40000000, monthly_payment_cents: 250000, months_in_arrears: 4, late_fee_per_month_cents: 12500, note_rate_pct: 7.2, last_interest_paid_date: "2026-07-01", distribution_method: "STATUTORY_PRIORITY", prepayment_penalty_applies: false }, as: CaseManager, captures: { cs_id: $.data.id } }
            - { call: "POST /api/foreclosure-cases", payload: { beneficiary_id: "${ben_id}", loan_reference: "LN-W1P", borrower_name: "Borrower P", property_address: "3 Lien Ln", county_code: "CC01", unpaid_principal_balance_cents: 40000000, monthly_payment_cents: 250000, months_in_arrears: 4, late_fee_per_month_cents: 12500, note_rate_pct: 7.2, last_interest_paid_date: "2026-07-01", distribution_method: "PRO_RATA", prepayment_penalty_applies: false }, as: CaseManager, captures: { cp_id: $.data.id } }
            - { call: "POST /api/foreclosure-cases/${cs_id}/notices-of-default", payload: { recording_date: "2026-08-01", instrument_number: "NOD-W1S" }, as: CaseManager }
            - { call: "POST /api/foreclosure-cases/${cp_id}/notices-of-default", payload: { recording_date: "2026-08-01", instrument_number: "NOD-W1P" }, as: CaseManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-30T00:00:00Z" }, as: TrusteeAdmin }
            - { call: "POST /api/foreclosure-cases/${cs_id}/notices-of-trustee-sale", payload: { recording_date: "2026-10-30", instrument_number: "NOTS-W1S" }, as: CaseManager, captures: { nots_s: $.data.id } }
            - { call: "POST /api/foreclosure-cases/${cp_id}/notices-of-trustee-sale", payload: { recording_date: "2026-10-30", instrument_number: "NOTS-W1P" }, as: CaseManager, captures: { nots_p: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-02T00:00:00Z" }, as: TrusteeAdmin }
            - { call: "POST /api/notices-of-trustee-sale/${nots_s}/publications", payload: { run_date: "2026-11-02", newspaper_name: "Daily Journal" }, as: CaseManager, captures: { ps1: $.data.id } }
            - { call: "POST /api/notices-of-trustee-sale/${nots_p}/publications", payload: { run_date: "2026-11-02", newspaper_name: "Daily Journal" }, as: CaseManager, captures: { pp1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-09T00:00:00Z" }, as: TrusteeAdmin }
            - { call: "POST /api/notices-of-trustee-sale/${nots_s}/publications", payload: { run_date: "2026-11-09", newspaper_name: "Daily Journal" }, as: CaseManager, captures: { ps2: $.data.id } }
            - { call: "POST /api/notices-of-trustee-sale/${nots_p}/publications", payload: { run_date: "2026-11-09", newspaper_name: "Daily Journal" }, as: CaseManager, captures: { pp2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-16T00:00:00Z" }, as: TrusteeAdmin }
            - { call: "POST /api/notices-of-trustee-sale/${nots_s}/publications", payload: { run_date: "2026-11-16", newspaper_name: "Daily Journal" }, as: CaseManager, captures: { ps3: $.data.id } }
            - { call: "POST /api/notices-of-trustee-sale/${nots_p}/publications", payload: { run_date: "2026-11-16", newspaper_name: "Daily Journal" }, as: CaseManager, captures: { pp3: $.data.id } }
            - { call: "POST /api/publications/${ps1}/file-affidavit", payload: {}, as: CaseManager }
            - { call: "POST /api/publications/${ps2}/file-affidavit", payload: {}, as: CaseManager }
            - { call: "POST /api/publications/${ps3}/file-affidavit", payload: {}, as: CaseManager }
            - { call: "POST /api/publications/${pp1}/file-affidavit", payload: {}, as: CaseManager }
            - { call: "POST /api/publications/${pp2}/file-affidavit", payload: {}, as: CaseManager }
            - { call: "POST /api/publications/${pp3}/file-affidavit", payload: {}, as: CaseManager }
            - { call: "POST /api/notices-of-trustee-sale/${nots_s}/schedule-sale", payload: { venue_name: "VEN-W1", scheduled_sale_start_at: "2026-11-23T10:00:00Z" }, as: CaseManager, captures: { sale_s: $.data.id } }
            - { call: "POST /api/notices-of-trustee-sale/${nots_p}/schedule-sale", payload: { venue_name: "VEN-W2", scheduled_sale_start_at: "2026-11-23T10:00:00Z" }, as: CaseManager, captures: { sale_p: $.data.id } }
            - { call: "GET /api/foreclosure-cases/${cs_id}", as: CaseManager, captures: { cs_v: $.data.version } }
            - { call: "POST /api/foreclosure-cases/${cs_id}/bidding-instructions", payload: { opening_bid_cents: 42000000, max_bid_cents: 43000000, strategy: "UP_TO_MAX", expected_foreclosure_case_version: "${cs_v}" }, as: Beneficiary, as_user_id: "${ben_id}" }
            - { call: "GET /api/foreclosure-cases/${cp_id}", as: CaseManager, captures: { cp_v: $.data.version } }
            - { call: "POST /api/foreclosure-cases/${cp_id}/bidding-instructions", payload: { opening_bid_cents: 42000000, max_bid_cents: 43000000, strategy: "UP_TO_MAX", expected_foreclosure_case_version: "${cp_v}" }, as: Beneficiary, as_user_id: "${ben_id}" }
            - { call: "POST /api/auction-sales/${sale_s}/bidder-registrations", payload: { bidder_name: "Bidder One", bidder_email: "b1@bid.example", deposit_cents: 1000000 }, as: Auctioneer, captures: { reg_s: $.data.id } }
            - { call: "POST /api/bidder-registrations/${reg_s}/review", payload: { decision: "QUALIFY" }, as: Auctioneer }
            - { call: "POST /api/auction-sales/${sale_p}/bidder-registrations", payload: { bidder_name: "Bidder Two", bidder_email: "b2@bid.example", deposit_cents: 1000000 }, as: Auctioneer, captures: { reg_p: $.data.id } }
            - { call: "POST /api/bidder-registrations/${reg_p}/review", payload: { decision: "QUALIFY" }, as: Auctioneer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-23T10:30:00Z" }, as: TrusteeAdmin }
            - { call: "POST /api/auction-sales/${sale_s}/conduct", payload: {}, as: Auctioneer }
            - { call: "POST /api/auction-sales/${sale_p}/conduct", payload: {}, as: Auctioneer }
            - { call: "POST /api/auction-sales/${sale_s}/bids", payload: { bidder_registration_id: "${reg_s}", amount_cents: 43000000 }, as: ThirdPartyBidder, as_user_id: "${reg_s}" }
            - { call: "POST /api/auction-sales/${sale_p}/bids", payload: { bidder_registration_id: "${reg_p}", amount_cents: 43000000 }, as: ThirdPartyBidder, as_user_id: "${reg_p}" }
            - { call: "POST /api/auction-sales/${sale_s}/close", payload: {}, as: Auctioneer }
            - { call: "POST /api/auction-sales/${sale_p}/close", payload: {}, as: Auctioneer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-01T00:00:00Z" }, as: TrusteeAdmin }
            - { call: "POST /api/foreclosure-cases/${cs_id}/surplus-claims", payload: { claimant_name: "Lien A", claimant_type: "JUNIOR_LIENHOLDER", priority_rank: 1, claimed_amount_cents: 2000000, filed_date: "2026-12-01" }, as: CaseManager, as_user_id: "cm_filer_1", captures: { cl_sa: $.data.id } }
            - { call: "POST /api/foreclosure-cases/${cs_id}/surplus-claims", payload: { claimant_name: "Lien B", claimant_type: "JUNIOR_LIENHOLDER", priority_rank: 1, claimed_amount_cents: 1000000, filed_date: "2026-12-01" }, as: CaseManager, as_user_id: "cm_filer_1", captures: { cl_sb: $.data.id } }
            - { call: "POST /api/foreclosure-cases/${cs_id}/surplus-claims", payload: { claimant_name: "Creditor C", claimant_type: "JUDGMENT_CREDITOR", priority_rank: 2, claimed_amount_cents: 900000, filed_date: "2026-12-01" }, as: CaseManager, as_user_id: "cm_filer_1", captures: { cl_sc: $.data.id } }
            - { call: "POST /api/foreclosure-cases/${cp_id}/surplus-claims", payload: { claimant_name: "Lien A", claimant_type: "JUNIOR_LIENHOLDER", priority_rank: 1, claimed_amount_cents: 2000000, filed_date: "2026-12-01" }, as: CaseManager, as_user_id: "cm_filer_1", captures: { cl_pa: $.data.id } }
            - { call: "POST /api/foreclosure-cases/${cp_id}/surplus-claims", payload: { claimant_name: "Lien B", claimant_type: "JUNIOR_LIENHOLDER", priority_rank: 1, claimed_amount_cents: 1000000, filed_date: "2026-12-01" }, as: CaseManager, as_user_id: "cm_filer_1", captures: { cl_pb: $.data.id } }
            - { call: "POST /api/foreclosure-cases/${cp_id}/surplus-claims", payload: { claimant_name: "Creditor C", claimant_type: "JUDGMENT_CREDITOR", priority_rank: 2, claimed_amount_cents: 900000, filed_date: "2026-12-01" }, as: CaseManager, as_user_id: "cm_filer_1", captures: { cl_pc: $.data.id } }
            - { call: "POST /api/surplus-claims/${cl_sa}/review", payload: { decision: "APPROVE", approved_amount_cents: 2000000 }, as: CaseManager, as_user_id: "cm_reviewer_1" }
            - { call: "POST /api/surplus-claims/${cl_sb}/review", payload: { decision: "APPROVE", approved_amount_cents: 1000000 }, as: CaseManager, as_user_id: "cm_reviewer_1" }
            - { call: "POST /api/surplus-claims/${cl_sc}/review", payload: { decision: "APPROVE", approved_amount_cents: 900000 }, as: CaseManager, as_user_id: "cm_reviewer_1" }
            - { call: "POST /api/surplus-claims/${cl_pa}/review", payload: { decision: "APPROVE", approved_amount_cents: 2000000 }, as: CaseManager, as_user_id: "cm_reviewer_1" }
            - { call: "POST /api/surplus-claims/${cl_pb}/review", payload: { decision: "APPROVE", approved_amount_cents: 1000000 }, as: CaseManager, as_user_id: "cm_reviewer_1" }
            - { call: "POST /api/surplus-claims/${cl_pc}/review", payload: { decision: "APPROVE", approved_amount_cents: 900000 }, as: CaseManager, as_user_id: "cm_reviewer_1" }
          trigger:
            - { call: "POST /api/foreclosure-cases/${cs_id}/distribute-surplus", payload: {}, as: CaseManager, captures: { run_s: $.data.run_index } }
            - { call: "POST /api/foreclosure-cases/${cp_id}/distribute-surplus", payload: {}, as: CaseManager, captures: { run_p: $.data.run_index } }
            - { call: "GET /api/disbursements?surplus_claim_id=${cl_sa}", as: CaseManager, captures: { paid_sa: "$.data[0].amount_cents" } }
            - { call: "GET /api/disbursements?surplus_claim_id=${cl_pa}", as: CaseManager, captures: { paid_pa: "$.data[0].amount_cents" } }
            - { call: "GET /api/disbursements?surplus_claim_id=${cl_pb}", as: CaseManager, captures: { paid_pb: "$.data[0].amount_cents" } }
          assert:
            - "STATUTORY case: SurplusClaim.${cl_sa}.paid_cents == 1640950 and status == APPROVED (partial)"
            - "STATUTORY case: SurplusClaim.${cl_sb}.paid_cents == 0 and SurplusClaim.${cl_sc}.paid_cents == 0"
            - "PRO_RATA case: SurplusClaim.${cl_pa}.paid_cents == 1093967 (floor(1640950*2/3)+1 remainder cent)"
            - "PRO_RATA case: SurplusClaim.${cl_pb}.paid_cents == 546983 and SurplusClaim.${cl_pc}.paid_cents == 0"
            - "captured disbursement amounts: ${paid_sa} == 1640950, ${paid_pa} == 1093967, ${paid_pb} == 546983"
            - "both cases: undistributed_surplus_cents == 0 after the run; identical inputs produce different per-claim payouts across variants"

  - rule_id: combinatorial_formula
    instances:
      - name: trustee_fee_winner_type_min_max_branch
        grounds:
          - calculations.trustee_compensation_fee
          - state_machines.ForeclosureCase.SALE_SCHEDULED_to_SOLD
        distinguishing_aspect: |
          Mode (a) combinatorial: 3 inputs (winning_bid, total_debt_at_close,
          winner_type) with a conditional branch and nested min/max. Third-party
          win at 43000000 bills fee on the bid (215000); beneficiary win at the
          same terms bills fee on total_debt_at_close 41144050 (205720), NOT on
          the 42000000 opening bid (which would give 210000) — proving the branch.
        test_recipe:
          setup:
            - "Two identical cases LN-F1A / LN-F1B (principal 40000000, rate 7.2, interest paid through 2026-07-01, no costs, no penalty), both driven to closed sales on 2026-11-23 with opening bid 42000000"
            - "Case A: one third-party bid 43000000 -> winner THIRD_PARTY"
            - "Case B: no bids -> winner BENEFICIARY at credit bid 42000000"
          setup_api_calls:
            - { call: "POST /api/beneficiaries", payload: { name: "Beneficiary Gamma", reference_code: "BEN-F1", contact_email: "gamma@ben.example" }, as: TrusteeAdmin, captures: { ben_id: $.data.id } }
            - { call: "POST /api/foreclosure-cases", payload: { beneficiary_id: "${ben_id}", loan_reference: "LN-F1A", borrower_name: "Borrower A", property_address: "4 Fee Way", county_code: "CC01", unpaid_principal_balance_cents: 40000000, monthly_payment_cents: 250000, months_in_arrears: 4, late_fee_per_month_cents: 12500, note_rate_pct: 7.2, last_interest_paid_date: "2026-07-01", distribution_method: "STATUTORY_PRIORITY", prepayment_penalty_applies: false }, as: CaseManager, captures: { ca_id: $.data.id } }
            - { call: "POST /api/foreclosure-cases", payload: { beneficiary_id: "${ben_id}", loan_reference: "LN-F1B", borrower_name: "Borrower B", property_address: "5 Fee Way", county_code: "CC01", unpaid_principal_balance_cents: 40000000, monthly_payment_cents: 250000, months_in_arrears: 4, late_fee_per_month_cents: 12500, note_rate_pct: 7.2, last_interest_paid_date: "2026-07-01", distribution_method: "STATUTORY_PRIORITY", prepayment_penalty_applies: false }, as: CaseManager, captures: { cb_id: $.data.id } }
            - { call: "POST /api/foreclosure-cases/${ca_id}/notices-of-default", payload: { recording_date: "2026-08-01", instrument_number: "NOD-F1A" }, as: CaseManager }
            - { call: "POST /api/foreclosure-cases/${cb_id}/notices-of-default", payload: { recording_date: "2026-08-01", instrument_number: "NOD-F1B" }, as: CaseManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-30T00:00:00Z" }, as: TrusteeAdmin }
            - { call: "POST /api/foreclosure-cases/${ca_id}/notices-of-trustee-sale", payload: { recording_date: "2026-10-30", instrument_number: "NOTS-F1A" }, as: CaseManager, captures: { nots_a: $.data.id } }
            - { call: "POST /api/foreclosure-cases/${cb_id}/notices-of-trustee-sale", payload: { recording_date: "2026-10-30", instrument_number: "NOTS-F1B" }, as: CaseManager, captures: { nots_b: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-02T00:00:00Z" }, as: TrusteeAdmin }
            - { call: "POST /api/notices-of-trustee-sale/${nots_a}/publications", payload: { run_date: "2026-11-02", newspaper_name: "Daily Journal" }, as: CaseManager, captures: { pa1: $.data.id } }
            - { call: "POST /api/notices-of-trustee-sale/${nots_b}/publications", payload: { run_date: "2026-11-02", newspaper_name: "Daily Journal" }, as: CaseManager, captures: { pb1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-09T00:00:00Z" }, as: TrusteeAdmin }
            - { call: "POST /api/notices-of-trustee-sale/${nots_a}/publications", payload: { run_date: "2026-11-09", newspaper_name: "Daily Journal" }, as: CaseManager, captures: { pa2: $.data.id } }
            - { call: "POST /api/notices-of-trustee-sale/${nots_b}/publications", payload: { run_date: "2026-11-09", newspaper_name: "Daily Journal" }, as: CaseManager, captures: { pb2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-16T00:00:00Z" }, as: TrusteeAdmin }
            - { call: "POST /api/notices-of-trustee-sale/${nots_a}/publications", payload: { run_date: "2026-11-16", newspaper_name: "Daily Journal" }, as: CaseManager, captures: { pa3: $.data.id } }
            - { call: "POST /api/notices-of-trustee-sale/${nots_b}/publications", payload: { run_date: "2026-11-16", newspaper_name: "Daily Journal" }, as: CaseManager, captures: { pb3: $.data.id } }
            - { call: "POST /api/publications/${pa1}/file-affidavit", payload: {}, as: CaseManager }
            - { call: "POST /api/publications/${pa2}/file-affidavit", payload: {}, as: CaseManager }
            - { call: "POST /api/publications/${pa3}/file-affidavit", payload: {}, as: CaseManager }
            - { call: "POST /api/publications/${pb1}/file-affidavit", payload: {}, as: CaseManager }
            - { call: "POST /api/publications/${pb2}/file-affidavit", payload: {}, as: CaseManager }
            - { call: "POST /api/publications/${pb3}/file-affidavit", payload: {}, as: CaseManager }
            - { call: "POST /api/notices-of-trustee-sale/${nots_a}/schedule-sale", payload: { venue_name: "VEN-F1A", scheduled_sale_start_at: "2026-11-23T10:00:00Z" }, as: CaseManager, captures: { sale_a: $.data.id } }
            - { call: "POST /api/notices-of-trustee-sale/${nots_b}/schedule-sale", payload: { venue_name: "VEN-F1B", scheduled_sale_start_at: "2026-11-23T10:00:00Z" }, as: CaseManager, captures: { sale_b: $.data.id } }
            - { call: "GET /api/foreclosure-cases/${ca_id}", as: CaseManager, captures: { ca_v: $.data.version } }
