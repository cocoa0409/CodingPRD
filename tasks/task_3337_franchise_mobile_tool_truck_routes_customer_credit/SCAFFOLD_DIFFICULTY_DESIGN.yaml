  # ===========================================================================
  # Rule 9 — compensating_invariant  (two DIFFERENT conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: compensating_reserved_units_return_to_zero_after_cancel
        grounds: [state_machines.SalesOrder.DRAFT_to_CONFIRMED, state_machines.SalesOrder.DRAFT_to_CANCELLED, state_machines.SalesOrder.CONFIRMED_to_CANCELLED, calculations.inventory_over_pledge, entities.InventoryPosition.fields.reserved_qty, entities.Route.fields.inventory_at_risk_cents]
        distinguishing_aspect: |
          Conserved quantity = a route product's reserved units. The forward
          transition (DRAFT_to_CONFIRMED) adds the line quantity to
          InventoryPosition.reserved_qty, and its compensating transition
          (CONFIRMED_to_CANCELLED) must remove exactly the same quantity, leaving
          reserved_qty back at 0, remaining_qty back at on_hand_qty, and
          Route.inventory_at_risk_cents back at its pre-confirm value of 0 — no
          drift in the named quantity.
        test_recipe:
          setup:
            - "Franchisee F CERTIFIED; route R1 (mix_plan POWER_TOOLS) IN_SERVICE with a QUALIFIED territory and ACTIVE shop S1"
            - "Technician T ACTIVE at S1; product P1 costs 12000, retails 15000; R1 holds 10 units; T holds an APPROVED account A1 (limit 50000)"
            - "Order O1 carries 4 x P1 and is DRAFT; the pre-confirm observations are reserved_qty 0 and inventory_at_risk_cents 0"
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /retail/franchisees/${f_id}/training", payload: { action: ENROLL, training_points: 45 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/franchisees/${f_id}/routes", payload: { route_code: R1, route_tier: A, zip_codes: [75001], visit_weekday: 1, truck_label: T-01, inventory_invested_cents: 100000, mix_plan: POWER_TOOLS, territory_model: FRANCHISEE_ASSUMED, territory_points: 0 }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/territory", payload: { action: DEVELOP, territory_points: 90 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: ACTIVATE }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/routes/${r1_id}/shop-locations", payload: { shop_name: "Northside Diesel", street_line: "12 Elm", zip_code: "75001" }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { s1_id: "$.data.id" } }
            - { call: "POST /retail/technicians", payload: { full_name: "Dana Reyes", current_shop_location_id: "${s1_id}", credit_line_limit_cents: 100000, months_in_trade: 100, employment_verified: true }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { t_id: "$.data.id" } }
            - { call: "POST /retail/shop-locations/${s1_id}/credit-applications", payload: { technician_id: "${t_id}", requested_limit_cents: 50000, requested_kind: REVOLVING, employment_verified: true, months_in_trade: 100, prior_delinquency_count: 0, decision_source: FRANCHISEE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { ap1_id: "$.data.id" } }
            - { call: "POST /retail/credit-applications/${ap1_id}/status", payload: { action: APPROVE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { ap1_ver: "$.data.version" } }
            - { call: "POST /retail/credit-applications/${ap1_id}/accounts", payload: { expected_application_version: "${ap1_ver}" }, as: CreditOfficer, captures: { a1_id: "$.data.id" } }
            - { call: "POST /retail/products", payload: { sku: P1, product_name: "Torque Wrench", category: POWER_TOOLS, unit_cost_cents: 12000, retail_price_cents: 15000, default_warranty_months: 12, is_new_launch: false }, as: PlatformAdmin, captures: { p1_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/inventory-positions", payload: { product_id: "${p1_id}", on_hand_qty: 10 }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { pos1_id: "$.data.id", pos_reserved_before: "$.data.reserved_qty", pos_remaining_before: "$.data.remaining_qty" } }
            - { call: "POST /retail/_clock/set_current_utc", payload: { current_utc: "2026-09-07T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /retail/routes/${r1_id}/sales-orders", payload: { technician_id: "${t_id}", credit_account_id: "${a1_id}", mix_profile: POWER_TOOLS, lines: [{ product_id: "${p1_id}", quantity: 4, unit_price_cents: 15000, warranty_terms: { type: FORCE1000, months: 12 } }] }, as: RouteSalesRep, as_user_id: "${f_id}", captures: { o1_id: "$.data.id" } }
            - { call: "GET /retail/routes/${r1_id}", payload: {}, as: FranchiseOwner, captures: { r1_risk_before: "$.data.inventory_at_risk_cents" } }
          trigger:
            - { call: "POST /retail/sales-orders/${o1_id}/status", payload: { action: CONFIRM }, as: RouteSalesRep, as_user_id: "${f_id}", captures: { pos_reserved_mid: "$.data.line_count" } }
            - { call: "GET /retail/inventory-positions", payload: { route_id: "${r1_id}", product_id: "${p1_id}" }, as: FranchiseOwner, captures: { pos_after_confirm: "$.data[0].reserved_qty" } }
            - { call: "GET /retail/routes/${r1_id}", payload: {}, as: FranchiseOwner, captures: { r1_risk_mid: "$.data.inventory_at_risk_cents" } }
            - { call: "POST /retail/sales-orders/${o1_id}/status", payload: { action: CANCEL }, as: RouteSalesRep, as_user_id: "${f_id}" }
            - { call: "GET /retail/inventory-positions", payload: { route_id: "${r1_id}", product_id: "${p1_id}" }, as: FranchiseOwner, captures: { pos_after_cancel: "$.data[0].reserved_qty", pos_remaining_after: "$.data[0].remaining_qty" } }
            - { call: "GET /retail/routes/${r1_id}", payload: {}, as: FranchiseOwner, captures: { r1_risk_after: "$.data.inventory_at_risk_cents", r1_over_after: "$.data.over_pledge_cents" } }
          assert:
            - "InventoryPosition.${pos1_id}.reserved_qty == 0 before CONFIRM and Route.${r1_id}.inventory_at_risk_cents == 0"
            - "after CONFIRM, InventoryPosition.${pos1_id}.reserved_qty == 4 and Route.${r1_id}.inventory_at_risk_cents == 48000"
            - "after CANCEL, InventoryPosition.${pos1_id}.reserved_qty == 0 — the compensating transition removed exactly the 4 reserved units"
            - "after CANCEL, InventoryPosition.${pos1_id}.remaining_qty == 10, equal to on_hand_qty"
            - "after CANCEL, Route.${r1_id}.inventory_at_risk_cents == 0 and over_pledge_cents == 0"
            - "SalesOrder.${o1_id}.order_status == CANCELLED and CreditAccount.${a1_id}.principal_balance_cents == 0, so no ledger drift either"

      - name: compensating_payment_reversal_restores_account_ledger_exactly
        grounds: [calculations.payment_allocation, calculations.finance_charge_accrual, state_machines.Payment.BOOKED_to_COLLECTED, state_machines.Payment.COLLECTED_to_REVERSED, entities.CreditAccount.fields.current_balance_cents, entities.CreditAccount.fields.credit_available_cents]
        distinguishing_aspect: |
          Conserved quantity = the account's ledger position (principal plus
          accrued charge plus available headroom). The forward action (COLLECT)
          applies 136 cents to the open finance charge and 19864 cents to
          principal; the compensating action (REVERSE) must un-apply exactly that
          split, restoring accrued_finance_charge_cents to 136,
          principal_balance_cents to 45338 and credit_available_cents to 4662 —
          and reopening the charge that had been closed. Any residue is drift.
        test_recipe:
          setup:
            - "Franchisee F CERTIFIED; route R1 (visit_weekday 1, mix_plan POWER_TOOLS) IN_SERVICE with a QUALIFIED territory and ACTIVE shop S1"
            - "Technician T ACTIVE at S1; product P1 costs 12000, retails 15000; R1 holds 10 units"
            - "T holds an APPROVED FRANCHISEE-sourced REVOLVING application (approved_limit_cents 50000) minted to A1 (ACTIVE)"
            - "Clock 2026-09-07 when O1 (3 x P1, gross 45338) is DELIVERED, so A1.principal_balance_cents is 45338 and credit_available_cents is 4662"
            - "Clock is then 2026-09-14 so the week's accrual of 136 cents is on the account, and a BOOKED 20000-cent payment sits on it for that week"
