              as: PlatformAdmin
            - call: "POST /safe-trade-spots"
              payload: { name: "Mall Kiosk", is_police_verified: false, open_minute_of_day: 480, close_minute_of_day: 1020 }
              as: PlatformAdmin
              captures: { spot_id: $.data.id }
            - call: "POST /members"
              payload: { email: "s@x.com", display_name: "S", role_kind: "SELLER" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /members"
              payload: { email: "b@x.com", display_name: "B", role_kind: "BUYER" }
              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /listings"
              payload: { seller_id: "${s_id}", category_slug: "furniture", title: "Chair", description: "wood", ask_price_cents: 10000, min_acceptable_price_cents: 5000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_v: $.data.version }
            - call: "POST /conversations"
              payload: { listing_id: "${lst_id}", buyer_id: "${b_id}" }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { conv_id: $.data.id }
            - call: "POST /offers"
              payload: { conversation_id: "${conv_id}", amount_cents: 9000 }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { off_id: $.data.id }
            - call: "POST /offers/${off_id}/accept"
              payload: { expected_listing_version: "${lst_v}" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { off_v: $.data.version }
          trigger:
            - call: "POST /meetups"
              payload: { offer_id: "${off_id}", spot_id: "${spot_id}", start_at: "2026-06-02T16:30:00Z", end_at: "2026-06-02T17:30:00Z", expected_offer_version: "${off_v}" }
              as: Buyer
              as_user_id: "${b_id}"
          assert:
            - "response error_id == ERR_OUTSIDE_SPOT_HOURS (end_minute 1050 > close 1020)"
            - "http status == 422"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: reservation_compensation_conserves_open_offer_ledger
        grounds:
          - calculations.compute_open_offer_count
          - state_machines.Meetup.transitions.CONFIRMED_to_CANCELLED
          - state_machines.Offer.transitions.ACCEPTED_to_WITHDRAWN
        distinguishing_aspect: |
          Conserved quantity = listing.open_offer_count (the open-offer ledger). Forward action
          (accept: count 1 -> 0) paired with compensating action (meetup cancel -> ACCEPTED offer
          WITHDRAWN) leaves open_offer_count at 0, AND sale_status returns to AVAILABLE — no drift.
        test_recipe:
          setup:
            - "Clock 08:00; spot open 08:00-18:00; listing published; single buyer offer 9000 accepted (count 1->0); meetup confirmed."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /categories"
              payload: { slug: "furniture", name: "Furniture" }
              as: PlatformAdmin
            - call: "POST /safe-trade-spots"
              payload: { name: "City Hall Lobby", is_police_verified: false, open_minute_of_day: 480, close_minute_of_day: 1080 }
              as: PlatformAdmin
              captures: { spot_id: $.data.id }
            - call: "POST /members"
              payload: { email: "s@x.com", display_name: "S", role_kind: "SELLER" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /members"
              payload: { email: "b@x.com", display_name: "B", role_kind: "BUYER" }
              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /listings"
              payload: { seller_id: "${s_id}", category_slug: "furniture", title: "Desk", description: "oak", ask_price_cents: 10000, min_acceptable_price_cents: 5000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_v: $.data.version }
            - call: "POST /conversations"
              payload: { listing_id: "${lst_id}", buyer_id: "${b_id}" }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { conv_id: $.data.id }
            - call: "POST /offers"
              payload: { conversation_id: "${conv_id}", amount_cents: 9000 }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { off_id: $.data.id }
            - call: "POST /offers/${off_id}/accept"
              payload: { expected_listing_version: "${lst_v}" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { off_v: $.data.version }
            - call: "POST /meetups"
              payload: { offer_id: "${off_id}", spot_id: "${spot_id}", start_at: "2026-06-02T14:00:00Z", end_at: "2026-06-02T15:00:00Z", expected_offer_version: "${off_v}" }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { mt_id: $.data.id }
            - call: "POST /meetups/${mt_id}/confirm"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
          trigger:
            - call: "POST /meetups/${mt_id}/cancel"
              payload: {}
              as: Buyer
              as_user_id: "${b_id}"
            - call: "GET /listings/${lst_id}"
              payload: {}
              as: Member
              as_user_id: "${s_id}"
              captures: { sale: $.data.sale_status, ooc: $.data.open_offer_count, aoid: $.data.accepted_offer_id }
            - call: "GET /offers/${off_id}"
              payload: {}
              as: Member
              as_user_id: "${b_id}"
              captures: { ost: $.data.status }
          assert:
            - "Meetup.${mt_id}.status == CANCELLED"
            - "Offer.${off_id}.status == WITHDRAWN (compensation)"
            - "Listing.${lst_id}.sale_status == AVAILABLE (reservation reverted)"
            - "Listing.${lst_id}.accepted_offer_id == null"
            - "Listing.${lst_id}.open_offer_count == 0 (conserved: accepted offer never re-enters open set)"

      - name: flag_uphold_then_listing_active_flag_count_conserved
        grounds:
          - calculations.compute_open_offer_count
          - state_machines.Flag.transitions.OPEN_to_UPHELD
          - entities.Listing.fields.active_flag_count
        distinguishing_aspect: |
          A DIFFERENT conserved quantity = listing.active_flag_count (the open-flag ledger): at all
          times active_flag_count == count(OPEN flags on the listing). Raising a flag (+1) then
          resolving it UPHELD (-1) returns active_flag_count to its pre-flag value (0), conserving
          the open-flag ledger while upheld_flag_count records the resolution.
        test_recipe:
          setup:
            - "Published listing with active_flag_count 0; a reporter raises one SPAM flag (count 1)."
          setup_api_calls:
            - call: "POST /categories"
              payload: { slug: "furniture", name: "Furniture" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "s@x.com", display_name: "S", role_kind: "SELLER" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /members"
              payload: { email: "r@x.com", display_name: "R", role_kind: "BUYER" }
              as: Anonymous
              captures: { r_id: $.data.id }
            - call: "POST /listings"
              payload: { seller_id: "${s_id}", category_slug: "furniture", title: "Phone", description: "used", ask_price_cents: 10000, min_acceptable_price_cents: 5000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /flags"
              payload: { reporter_id: "${r_id}", target_type: "LISTING", target_listing_id: "${lst_id}", reason: "SPAM" }
              as: Member
              as_user_id: "${r_id}"
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /flags/${f_id}/uphold"
              payload: { resolution_note: "confirmed spam" }
              as: Moderator
            - call: "GET /listings/${lst_id}"
              payload: {}
              as: Member
              as_user_id: "${s_id}"
              captures: { afc: $.data.active_flag_count }
            - call: "GET /members/${s_id}"
              payload: {}
              as: Moderator
              captures: { ufc: $.data.upheld_flag_count }
          assert:
            - "Flag.${f_id}.status == UPHELD"
            - "Listing.${lst_id}.active_flag_count == 0 (open-flag ledger conserved: +1 raise, -1 resolve)"
            - "Member.${s_id}.upheld_flag_count == 1 (resolution recorded separately)"
            - "Member.${s_id}.trust_score == 35 (50 - 15 upheld penalty)"
