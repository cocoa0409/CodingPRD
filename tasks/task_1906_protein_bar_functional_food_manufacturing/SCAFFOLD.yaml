  - QualityManager
  code: 200
  input:
  - status?
  - limit?
  - offset?
  output: LineSlot[]
  side_effects: []
- method: GET
  path: /mfg/lines/{id}/changeovers
  description: List changeover events on a line
  roles:
  - PlantAdmin
