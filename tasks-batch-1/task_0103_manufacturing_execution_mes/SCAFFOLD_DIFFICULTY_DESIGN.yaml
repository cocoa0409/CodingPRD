            - "WorkOrder.${wo_id}.completed_qty == 3"
            - "no PASS TravelerSignoff remains active for ${woop1_id} (op must be re-signed before re-complete)"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: machine_down_beats_traveler_not_signed_on_start_vs_complete
        grounds:
          - validations[priority=7]
          - validations[priority=4]
          - errors[ERR_MACHINE_DOWN]
        distinguishing_aspect: |
          Category pair: state (priority 4, ERR_INVALID_STATE) vs business_safety
          (priority 7, ERR_MACHINE_DOWN). Starting a QUEUED op whose machine is
          DOWN — the op is in a valid 'from' state (QUEUED) so the state check
          passes and ERR_MACHINE_DOWN (priority 7) is returned, not a state error.
        test_recipe:
          setup:
            - "Released WO with one QUEUED op; the op's machine is set DOWN."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "FG-C5A", name: "FG", product_type: "FINISHED_GOOD" }
              as: ManufacturingEngineer
              captures: { fg_id: $.data.id }
            - call: "POST /machines"
              payload: { machine_code: "M-C5A", work_center: "WC1", planned_production_secs: 28800 }
              as: ManufacturingEngineer
              captures: { m_id: $.data.id }
            - call: "POST /routings"
              payload: { product_id: "${fg_id}", routing_code: "RT-C5A" }
              as: ManufacturingEngineer
              captures: { rt_id: $.data.id }
            - call: "POST /routings/${rt_id}/operations"
              payload: { machine_id: "${m_id}", sequence_no: 10, ideal_cycle_time_secs: 100 }
              as: ManufacturingEngineer
            - call: "POST /routings/${rt_id}/release"
              payload: {}
              as: ManufacturingEngineer
            - call: "POST /work-orders"
              payload: { product_id: "${fg_id}", routing_id: "${rt_id}", order_qty: 1 }
              as: ProductionPlanner
              captures: { wo_id: $.data.id, wo_v: $.data.version }
            - call: "POST /work-orders/${wo_id}/release"
              payload: { expected_work_order_version: "${wo_v}" }
              as: ProductionPlanner
            - call: "GET /work-orders/${wo_id}/operations"
              payload: {}
              as: ProductionPlanner
              captures: { woop1_id: "$.data[0].id" }
            - call: "POST /machines/${m_id}/status"
              payload: { status: "DOWN" }
              as: MachineOperator
          trigger:
            - call: "POST /work-order-operations/${woop1_id}/start"
              payload: { units_in: 1 }
              as: MachineOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_MACHINE_DOWN"

      - name: scrap_qty_exceeds_beats_lot_fiscal_when_both_violable
        grounds:
          - validations[priority=13]
          - validations[priority=14]
          - errors[ERR_SCRAP_QTY_EXCEEDS]
        distinguishing_aspect: |
          Category pair: business_constraint (priority 13, ERR_SCRAP_QTY_EXCEEDS)
          vs business_fiscal (priority 14, ERR_INSUFFICIENT_LOT_QTY). A scrap
          disposition request that would exceed the op's available units is
          rejected with ERR_SCRAP_QTY_EXCEEDS (priority 13) before any fiscal lot
          check — a different category pair than instance 1's state/safety pair.
        test_recipe:
          setup:
            - "Released WO order_qty 2, op started with units_in 2; raise a scrap disposition of quantity 5 (> available 2)."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "FG-C5B", name: "FG", product_type: "FINISHED_GOOD", unit_cost_cents: 300 }
              as: ManufacturingEngineer
              captures: { fg_id: $.data.id }
            - call: "POST /machines"
              payload: { machine_code: "M-C5B", work_center: "WC1", planned_production_secs: 28800 }
              as: ManufacturingEngineer
              captures: { m_id: $.data.id }
            - call: "POST /routings"
              payload: { product_id: "${fg_id}", routing_code: "RT-C5B" }
              as: ManufacturingEngineer
              captures: { rt_id: $.data.id }
            - call: "POST /routings/${rt_id}/operations"
              payload: { machine_id: "${m_id}", sequence_no: 10, ideal_cycle_time_secs: 100 }
              as: ManufacturingEngineer
            - call: "POST /routings/${rt_id}/release"
              payload: {}
              as: ManufacturingEngineer
            - call: "POST /work-orders"
              payload: { product_id: "${fg_id}", routing_id: "${rt_id}", order_qty: 2 }
              as: ProductionPlanner
              captures: { wo_id: $.data.id, wo_v: $.data.version }
            - call: "POST /work-orders/${wo_id}/release"
              payload: { expected_work_order_version: "${wo_v}" }
              as: ProductionPlanner
            - call: "GET /work-orders/${wo_id}/operations"
              payload: {}
              as: ProductionPlanner
              captures: { woop1_id: "$.data[0].id" }
            - call: "POST /work-order-operations/${woop1_id}/start"
              payload: { units_in: 2 }
              as: MachineOperator
          trigger:
            - call: "POST /work-order-operations/${woop1_id}/scrap-dispositions"
              payload: { quantity: 5, defect_code: "OVER" }
              as: MachineOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_SCRAP_QTY_EXCEEDS"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: quality_flag_exact_floor_inclusive
        grounds:
          - calculations.machine_quality_flag
          - entities.Machine.fields.quality_flagged
          - entities.MachineRunLog.fields.good_units
        distinguishing_aspect: |
          Numeric threshold boundary on machine quality at exactly QUALITY_FLOOR
          (0.95): one log total 200 good 190 yields Q=0.9500 which DOES flag
          (<=, inclusive), reached through POST /machines/{id}/recompute-oee.
        test_recipe:
          setup:
            - "Machine planned 28800; one log run 10000s total 200 good 190 (Q=0.9500 exactly)."
          setup_api_calls:
            - call: "POST /machines"
              payload: { machine_code: "M-C6A", work_center: "WC1", planned_production_secs: 28800 }
              as: ManufacturingEngineer
              captures: { m_id: $.data.id }
            - call: "POST /machines/${m_id}/run-logs"
              payload: { window_start: "2026-06-01T00:00:00.000Z", window_end: "2026-06-01T04:00:00.000Z", run_time_secs: 10000, total_units: 200, good_units: 190 }
              as: MachineOperator
          trigger:
            - call: "POST /machines/${m_id}/recompute-oee"
              payload: {}
              as: QualityInspector
              captures: { q: $.data.oee_quality, flag: $.data.quality_flagged }
          assert:
            - "Machine.${m_id}.oee_quality == 0.9500"
            - "Machine.${m_id}.quality_flagged == true"

      - name: complete_workorder_with_zero_component_demands_empty_set
        grounds:
          - state_machines.WorkOrder.IN_PROCESS_to_COMPLETED
          - calculations.material_variance
          - entities.WorkOrder.fields.material_variance_cents
        distinguishing_aspect: |
          Empty-set boundary on a different metric/endpoint: a FINISHED_GOOD with
          NO BOM lines explodes to zero ComponentDemand rows, so the actual-cost
          and standard-cost sums are both over the empty set -> material_variance
          == 0 on POST /work-orders/{id}/complete, distinct from the numeric
          quality threshold in instance 1.
        test_recipe:
          setup:
            - "FG with NO bom-lines; single-op RELEASED routing; WO order_qty 1 released; op signed PASS, started, completed."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "FG-C6B", name: "FG", product_type: "FINISHED_GOOD" }
              as: ManufacturingEngineer
              captures: { fg_id: $.data.id }
            - call: "POST /machines"
              payload: { machine_code: "M-C6B", work_center: "WC1", planned_production_secs: 28800 }
              as: ManufacturingEngineer
              captures: { m_id: $.data.id }
            - call: "POST /routings"
              payload: { product_id: "${fg_id}", routing_code: "RT-C6B" }
              as: ManufacturingEngineer
              captures: { rt_id: $.data.id }
            - call: "POST /routings/${rt_id}/operations"
              payload: { machine_id: "${m_id}", sequence_no: 10, ideal_cycle_time_secs: 100 }
              as: ManufacturingEngineer
            - call: "POST /routings/${rt_id}/release"
              payload: {}
              as: ManufacturingEngineer
            - call: "POST /work-orders"
              payload: { product_id: "${fg_id}", routing_id: "${rt_id}", order_qty: 1 }
              as: ProductionPlanner
              captures: { wo_id: $.data.id, wo_v: $.data.version }
            - call: "POST /work-orders/${wo_id}/release"
              payload: { expected_work_order_version: "${wo_v}" }
              as: ProductionPlanner
            - call: "GET /work-orders/${wo_id}/operations"
              payload: {}
              as: ProductionPlanner
              captures: { woop1_id: "$.data[0].id" }
            - call: "POST /work-order-operations/${woop1_id}/signoffs"
              payload: { result: "PASS" }
              as: QualityInspector
            - call: "POST /work-order-operations/${woop1_id}/start"
              payload: { units_in: 1 }
              as: MachineOperator
            - call: "POST /work-order-operations/${woop1_id}/complete"
              payload: { good_qty: 1 }
              as: MachineOperator
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: {}
              as: ProductionPlanner
              captures: { mv: $.data.material_variance_cents }
          assert:
            - "WorkOrder.${wo_id}.material_variance_cents == 0"
            - "WorkOrder.${wo_id}.status == COMPLETED"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: workorder_release_requires_routing_released
        grounds:
          - state_machines.WorkOrder.PLANNED_to_RELEASED
          - validations[priority=6]
          - entities.Routing.fields.status
        distinguishing_aspect: |
          Entity pair WorkOrder->Routing: a WorkOrder can transition PLANNED->
          RELEASED only if its referenced Routing.status == RELEASED; a DRAFT
          routing yields ERR_ROUTING_NOT_RELEASED. Distinct pair from the
          WorkOrderOperation->Machine dependency in instance 2.
        test_recipe:
          setup:
            - "FG with a DRAFT routing (NOT released) carrying one op; WO order_qty 1 PLANNED."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "FG-C7A", name: "FG", product_type: "FINISHED_GOOD" }
              as: ManufacturingEngineer
              captures: { fg_id: $.data.id }
            - call: "POST /machines"
              payload: { machine_code: "M-C7A", work_center: "WC1", planned_production_secs: 28800 }
              as: ManufacturingEngineer
              captures: { m_id: $.data.id }
            - call: "POST /routings"
              payload: { product_id: "${fg_id}", routing_code: "RT-C7A" }
              as: ManufacturingEngineer
              captures: { rt_id: $.data.id }
            - call: "POST /routings/${rt_id}/operations"
              payload: { machine_id: "${m_id}", sequence_no: 10, ideal_cycle_time_secs: 100 }
              as: ManufacturingEngineer
            - call: "POST /work-orders"
              payload: { product_id: "${fg_id}", routing_id: "${rt_id}", order_qty: 1 }
              as: ProductionPlanner
              captures: { wo_id: $.data.id, wo_v: $.data.version }
          trigger:
            - call: "POST /work-orders/${wo_id}/release"
              payload: { expected_work_order_version: "${wo_v}" }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ROUTING_NOT_RELEASED"
            - "WorkOrder.${wo_id}.status == PLANNED"

      - name: workorderoperation_start_requires_machine_not_down
        grounds:
          - state_machines.WorkOrderOperation.QUEUED_to_IN_PROGRESS
          - validations[priority=7]
          - entities.Machine.fields.status
        distinguishing_aspect: |
          Entity pair WorkOrderOperation->Machine: a QUEUED op may start only if
          its referenced Machine.status != DOWN; a DOWN machine yields
          ERR_MACHINE_DOWN. Different entity pair than WorkOrder->Routing in
          instance 1.
        test_recipe:
          setup:
            - "Released WO with one QUEUED op; the op's machine set DOWN."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "FG-C7B", name: "FG", product_type: "FINISHED_GOOD" }
              as: ManufacturingEngineer
              captures: { fg_id: $.data.id }
            - call: "POST /machines"
              payload: { machine_code: "M-C7B", work_center: "WC1", planned_production_secs: 28800 }
              as: ManufacturingEngineer
              captures: { m_id: $.data.id }
            - call: "POST /routings"
              payload: { product_id: "${fg_id}", routing_code: "RT-C7B" }
              as: ManufacturingEngineer
              captures: { rt_id: $.data.id }
            - call: "POST /routings/${rt_id}/operations"
              payload: { machine_id: "${m_id}", sequence_no: 10, ideal_cycle_time_secs: 100 }
              as: ManufacturingEngineer
            - call: "POST /routings/${rt_id}/release"
              payload: {}
              as: ManufacturingEngineer
            - call: "POST /work-orders"
              payload: { product_id: "${fg_id}", routing_id: "${rt_id}", order_qty: 1 }
              as: ProductionPlanner
              captures: { wo_id: $.data.id, wo_v: $.data.version }
            - call: "POST /work-orders/${wo_id}/release"
              payload: { expected_work_order_version: "${wo_v}" }
              as: ProductionPlanner
            - call: "GET /work-orders/${wo_id}/operations"
              payload: {}
              as: ProductionPlanner
              captures: { woop1_id: "$.data[0].id" }
            - call: "POST /machines/${m_id}/status"
              payload: { status: "DOWN" }
              as: MachineOperator
          trigger:
            - call: "POST /work-order-operations/${woop1_id}/start"
              payload: { units_in: 1 }
              as: MachineOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_MACHINE_DOWN"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: machine_runlog_halfopen_overlap_rejected_adjacency_ok
        grounds:
          - validations[priority=9]
          - errors[ERR_RUNLOG_OVERLAP]
          - entities.MachineRunLog.fields.window_start
        distinguishing_aspect: |
          Half-open [start,end) interval semantics on the Machine resource:
          a second run-log [03:00,05:00) overlaps an existing [00:00,04:00) and is
          rejected; but an exactly-adjacent [04:00,06:00) is ACCEPTED (end is
          exclusive). Distinct geometry from the closed-interval+buffer semantics
          on the work center in instance 2.
        test_recipe:
          setup:
            - "Machine planned 28800 with one run-log [00:00,04:00)."
          setup_api_calls:
            - call: "POST /machines"
              payload: { machine_code: "M-C8A", work_center: "WC1", planned_production_secs: 28800 }
              as: ManufacturingEngineer
              captures: { m_id: $.data.id }
            - call: "POST /machines/${m_id}/run-logs"
              payload: { window_start: "2026-06-01T00:00:00.000Z", window_end: "2026-06-01T04:00:00.000Z", run_time_secs: 10000, total_units: 100, good_units: 100 }
              as: MachineOperator
          trigger:
            - call: "POST /machines/${m_id}/run-logs"
              payload: { window_start: "2026-06-01T03:00:00.000Z", window_end: "2026-06-01T05:00:00.000Z", run_time_secs: 5000, total_units: 50, good_units: 50 }
              as: MachineOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_RUNLOG_OVERLAP"

      - name: workcenter_setup_buffer_conflict_closed_interval_plus_buffer
        grounds:
          - validations[priority=10]
          - errors[ERR_SETUP_BUFFER_CONFLICT]
          - entities.Operation.fields.setup_buffer_secs
        distinguishing_aspect: |
          Closed-interval-plus-buffer semantics on the work-center resource: op B's
          scheduled_start must clear op A's scheduled_end + setup_buffer_secs (600s)
          on the same work center; a start only 300s after the prior end violates
          the buffer. Distinct interval arithmetic (buffer-extended boundary) from
          the half-open machine run-log overlap in instance 1.
        test_recipe:
          setup:
            - "FG routing with two ops on the SAME machine/work-center, setup_buffer_secs 600 on op1; WO order_qty 1 released; op1 started [10:00,10:30] and completed; op2 QUEUED."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "FG-C8B", name: "FG", product_type: "FINISHED_GOOD" }
              as: ManufacturingEngineer
              captures: { fg_id: $.data.id }
            - call: "POST /machines"
              payload: { machine_code: "M-C8B", work_center: "WC-SHARED", planned_production_secs: 28800 }
              as: ManufacturingEngineer
              captures: { m_id: $.data.id }
            - call: "POST /routings"
              payload: { product_id: "${fg_id}", routing_code: "RT-C8B" }
              as: ManufacturingEngineer
              captures: { rt_id: $.data.id }
            - call: "POST /routings/${rt_id}/operations"
              payload: { machine_id: "${m_id}", sequence_no: 10, ideal_cycle_time_secs: 100, setup_buffer_secs: 600 }
              as: ManufacturingEngineer
            - call: "POST /routings/${rt_id}/operations"
              payload: { machine_id: "${m_id}", sequence_no: 20, ideal_cycle_time_secs: 100, setup_buffer_secs: 0 }
              as: ManufacturingEngineer
            - call: "POST /routings/${rt_id}/release"
              payload: {}
              as: ManufacturingEngineer
            - call: "POST /work-orders"
              payload: { product_id: "${fg_id}", routing_id: "${rt_id}", order_qty: 1 }
              as: ProductionPlanner
              captures: { wo_id: $.data.id, wo_v: $.data.version }
            - call: "POST /work-orders/${wo_id}/release"
              payload: { expected_work_order_version: "${wo_v}" }
              as: ProductionPlanner
            - call: "GET /work-orders/${wo_id}/operations"
              payload: {}
              as: ProductionPlanner
              captures: { woop1_id: "$.data[0].id", woop2_id: "$.data[1].id" }
            - call: "POST /work-order-operations/${woop1_id}/signoffs"
              payload: { result: "PASS" }
              as: QualityInspector
            - call: "POST /work-order-operations/${woop1_id}/start"
              payload: { scheduled_start: "2026-06-01T10:00:00.000Z", scheduled_end: "2026-06-01T10:30:00.000Z", units_in: 1 }
              as: MachineOperator
            - call: "POST /work-order-operations/${woop1_id}/complete"
              payload: { good_qty: 1 }
              as: MachineOperator
          trigger:
            - call: "POST /work-order-operations/${woop2_id}/start"
              payload: { scheduled_start: "2026-06-01T10:35:00.000Z", scheduled_end: "2026-06-01T11:00:00.000Z", units_in: 1 }
              as: MachineOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SETUP_BUFFER_CONFLICT"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: lot_quantity_conserved_under_issue_then_cancel_reversal
        grounds:
          - state_machines.WorkOrder.RELEASED_to_CANCELLED
          - entities.Lot.fields.on_hand_qty
          - entities.LotIssue.fields.reversed
        distinguishing_aspect: |
          Conserved quantity = lot inventory: for every Lot,
          on_hand_qty + issued_qty == received_qty MUST hold. Issuing 2 then
          cancelling the WO reverses the issue (LotIssue.reversed=true), restoring
          on_hand_qty to the full received_qty 5 with issued_qty back to 0.
        test_recipe:
          setup:
            - "FG with BOM FG->R1 q2 s0 (R1 lot_controlled 100c); RELEASED routing one op; WO order_qty 1 released; Lot L1 received_qty 5; issued 2 to the demand; WO still RELEASED (no op started)."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "FG-C9A", name: "FG", product_type: "FINISHED_GOOD" }
              as: ManufacturingEngineer
              captures: { fg_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "R1-C9A", name: "R1", product_type: "RAW_MATERIAL", unit_cost_cents: 100, lot_controlled: true }
              as: ManufacturingEngineer
              captures: { r1_id: $.data.id }
            - call: "POST /bom-lines"
              payload: { parent_product_id: "${fg_id}", component_product_id: "${r1_id}", quantity_per: 2, scrap_factor_pct: 0 }
              as: ManufacturingEngineer
            - call: "POST /machines"
              payload: { machine_code: "M-C9A", work_center: "WC1", planned_production_secs: 28800 }
              as: ManufacturingEngineer
              captures: { m_id: $.data.id }
            - call: "POST /routings"
              payload: { product_id: "${fg_id}", routing_code: "RT-C9A" }
              as: ManufacturingEngineer
              captures: { rt_id: $.data.id }
            - call: "POST /routings/${rt_id}/operations"
              payload: { machine_id: "${m_id}", sequence_no: 10, ideal_cycle_time_secs: 100 }
              as: ManufacturingEngineer
            - call: "POST /routings/${rt_id}/release"
              payload: {}
              as: ManufacturingEngineer
            - call: "POST /work-orders"
              payload: { product_id: "${fg_id}", routing_id: "${rt_id}", order_qty: 1 }
              as: ProductionPlanner
              captures: { wo_id: $.data.id, wo_v: $.data.version }
            - call: "POST /work-orders/${wo_id}/release"
              payload: { expected_work_order_version: "${wo_v}" }
              as: ProductionPlanner
            - call: "GET /work-orders/${wo_id}/component-demands"
              payload: {}
              as: ProductionPlanner
              captures: { cd_id: "$.data[0].id" }
            - call: "GET /work-orders/${wo_id}/operations"
              payload: {}
              as: ProductionPlanner
              captures: { woop1_id: "$.data[0].id" }
            - call: "POST /lots"
              payload: { product_id: "${r1_id}", lot_code: "L1-C9A", received_qty: 5 }
              as: MachineOperator
              captures: { l1_id: $.data.id }
            - call: "POST /lot-issues"
              payload: { component_demand_id: "${cd_id}", lot_id: "${l1_id}", work_order_operation_id: "${woop1_id}", issued_qty: 2 }
              as: MachineOperator
          trigger:
            - call: "POST /work-orders/${wo_id}/cancel"
              payload: {}
              as: ProductionPlanner
            - call: "GET /lots/${l1_id}"
              payload: {}
              as: MachineOperator
              captures: { oh: $.data.on_hand_qty, iss: $.data.issued_qty }
          assert:
            - "Lot.${l1_id}.on_hand_qty == 5"
            - "Lot.${l1_id}.issued_qty == 0"
            - "Lot.${l1_id}.on_hand_qty + Lot.${l1_id}.issued_qty == Lot.${l1_id}.received_qty"

      - name: wip_quantity_conserved_under_scrap_disposition
        grounds:
          - state_machines.ScrapDisposition.PENDING_to_SCRAPPED
          - entities.WorkOrder.fields.wip_qty
          - entities.WorkOrder.fields.scrapped_qty
        distinguishing_aspect: |
          Conserved quantity = WIP units (different from lot inventory in instance
          1): the invariant started_qty == completed_qty + scrapped_qty + wip_qty
          MUST hold. Starting order_qty 10 then scrapping 3 leaves
          started 10 = completed 0 + scrapped 3 + wip 7.
        test_recipe:
          setup:
            - "FG single-op WO order_qty 10; op started (started_qty 10); raise+SCRAP a disposition of quantity 3."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "FG-C9B", name: "FG", product_type: "FINISHED_GOOD", unit_cost_cents: 400 }
              as: ManufacturingEngineer
              captures: { fg_id: $.data.id }
            - call: "POST /machines"
              payload: { machine_code: "M-C9B", work_center: "WC1", planned_production_secs: 28800 }
              as: ManufacturingEngineer
              captures: { m_id: $.data.id }
            - call: "POST /routings"
              payload: { product_id: "${fg_id}", routing_code: "RT-C9B" }
              as: ManufacturingEngineer
              captures: { rt_id: $.data.id }
            - call: "POST /routings/${rt_id}/operations"
              payload: { machine_id: "${m_id}", sequence_no: 10, ideal_cycle_time_secs: 100 }
              as: ManufacturingEngineer
            - call: "POST /routings/${rt_id}/release"
              payload: {}
              as: ManufacturingEngineer
            - call: "POST /work-orders"
              payload: { product_id: "${fg_id}", routing_id: "${rt_id}", order_qty: 10 }
              as: ProductionPlanner
              captures: { wo_id: $.data.id, wo_v: $.data.version }
            - call: "POST /work-orders/${wo_id}/release"
              payload: { expected_work_order_version: "${wo_v}" }
              as: ProductionPlanner
            - call: "GET /work-orders/${wo_id}/operations"
              payload: {}
              as: ProductionPlanner
              captures: { woop1_id: "$.data[0].id" }
            - call: "POST /work-order-operations/${woop1_id}/start"
              payload: { units_in: 10 }
              as: MachineOperator
            - call: "POST /work-order-operations/${woop1_id}/scrap-dispositions"
              payload: { quantity: 3, defect_code: "BURR" }
              as: MachineOperator
              captures: { sd_id: $.data.id }
          trigger:
            - call: "POST /scrap-dispositions/${sd_id}/disposition"
              payload: { decision: "SCRAP" }
              as: QualityInspector
            - call: "GET /work-orders/${wo_id}"
              payload: {}
              as: ProductionPlanner
              captures: { wip: $.data.wip_qty, scr: $.data.scrapped_qty, started: $.data.started_qty }
          assert:
            - "WorkOrder.${wo_id}.started_qty == 10"
            - "WorkOrder.${wo_id}.scrapped_qty == 3"
            - "WorkOrder.${wo_id}.wip_qty == 7"
            - "WorkOrder.${wo_id}.started_qty == WorkOrder.${wo_id}.completed_qty + WorkOrder.${wo_id}.scrapped_qty + WorkOrder.${wo_id}.wip_qty"
