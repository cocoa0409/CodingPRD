# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 breadth probe for
# task_2932_mental_health_parity_comparative_analysis
#
# Sections and claim_type values are taken verbatim from
# references/claim-extraction-guide.md. Corners already asserted by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because: stubs that name the
# covering §1.8 instance.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # 1. From Table 1 (Entities)
  # ===========================================================================
  - section: entities
    instances:
      - name: administrator_create_returns_every_declared_field_with_defaults_applied
        claim_type: Creation
        grounds:
          - entities.Administrator
          - endpoints.POST_parity_administrators
        distinguishing_aspect: "POST /parity/administrators with only legal_name and contact_email returns 201 with contractual_production_days 45 and every computed cooperation field already initialised."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example" }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id, adm_v: $.data.version }
          assert:
            - "201 with response_type == object and data.id present"
            - "Administrator.${adm_id}.contractual_production_days == 45 (declared default)"
            - "Administrator.${adm_id}.outstanding_request_count == 0 and late_request_count == 0 and breach_count == 0 and regulator_reportable_late_count == 0"
            - "Administrator.${adm_id}.cooperation_score == 100.00 and regulatory_basis_cooperation_score == 100.00 and cooperation_status == COOPERATIVE"
            - "Administrator.${adm_id}.version == 1 and created_at == updated_at"

      - name: plan_year_get_by_id_returns_the_stored_row
        claim_type: Retrieval
        grounds:
          - endpoints.GET_parity_plan_years_id
          - entities.PlanYear
        distinguishing_aspect: "GET /parity/plan-years/{id} echoes every input field and the freshly derived posture fields of the row just created."
        test_recipe:
          setup:
            - "One Administrator and one PlanYear."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_id: $.data.id }
          trigger:
            - call: "GET /parity/plan-years/${py_id}"
              payload: {}
              as: Regulator
              as_user_id: "user-regulator-01"
          assert:
            - "200 with PlanYear.${py_id}.plan_name == Acme Group Health Plan and plan_year_label == 2026"
            - "PlanYear.${py_id}.administrator_id == ${adm_id} and funding_arrangement == SELF_FUNDED"
            - "PlanYear.${py_id}.covered_participant_count == 1200 and remediation_liability_cap_cents == 5000000"
            - "PlanYear.${py_id}.status == OPEN and compliance_posture == COMPLIANT"
            - "PlanYear.${py_id}.open_violation_count == 0, notified_violation_count == 0, failing_parity_test_count == 0, remediation_liability_cents == 0"

      - name: nqtl_item_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_parity_nqtl_items
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /parity/nqtl-items?plan_year_id=&limit=2&offset=0 returns 2 of 3 rows with total_count 3 and has_more true; offset 2 returns the last row with has_more false."
        test_recipe:
          setup:
            - "One Administrator, one PlanYear, one classification, three NqtlItems of three distinct nqtl_types."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_id: $.data.id }
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "OUTPATIENT", network_tier: "IN_NETWORK", sub_classification: "OFFICE_VISITS", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_id: $.data.id }
            - call: "POST /parity/nqtl-items"
              payload: { plan_year_id: "${py_id}", classification_id: "${cls_id}", nqtl_type: "PRIOR_AUTHORIZATION", applied_to: "BOTH", description: "Prior authorization for outpatient office visits." }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { item_1_id: $.data.id }
            - call: "POST /parity/nqtl-items"
              payload: { plan_year_id: "${py_id}", classification_id: "${cls_id}", nqtl_type: "CONCURRENT_REVIEW", applied_to: "BOTH", description: "Concurrent review for outpatient office visits." }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { item_2_id: $.data.id }
            - call: "POST /parity/nqtl-items"
              payload: { plan_year_id: "${py_id}", classification_id: "${cls_id}", nqtl_type: "STEP_THERAPY", applied_to: "BOTH", description: "Step therapy for outpatient office visits." }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { item_3_id: $.data.id }
          trigger:
            - call: "GET /parity/nqtl-items"
              payload: { plan_year_id: "${py_id}", limit: 2, offset: 0 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
            - call: "GET /parity/nqtl-items"
              payload: { plan_year_id: "${py_id}", limit: 2, offset: 2 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
          assert:
            - "first page: response_type == array, 2 rows returned, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "second page: 1 row returned, total_count == 3, has_more == false, offset == 2"
            - "the union of both pages is exactly {${item_1_id}, ${item_2_id}, ${item_3_id}} with no duplicates"
            - "GET /parity/nqtl-items with limit 0 -> 422 ERR_VALIDATION (limit must be within 1..100)"

      - name: get_plan_year_with_unknown_id_returns_plan_year_not_found
        claim_type: Not Found
        grounds:
          - errors.ERR_PLAN_YEAR_NOT_FOUND
          - validations.priority_4_ERR_PLAN_YEAR_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unused UUID in the path yields 404 ERR_PLAN_YEAR_NOT_FOUND, and the error envelope carries response_type error."
        test_recipe:
          setup:
            - "Empty database (no plan year has ever been created)."
          setup_api_calls: []
          trigger:
            - call: "GET /parity/plan-years/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
          assert:
            - "404 with data.error_id == ERR_PLAN_YEAR_NOT_FOUND and response_type == error"
            - "GET /parity/nqtl-items/00000000-0000-4000-8000-000000000000 -> 404 ERR_NQTL_ITEM_NOT_FOUND"
            - "GET /parity/comparative-analyses/00000000-0000-4000-8000-000000000000 -> 404 ERR_ANALYSIS_NOT_FOUND"
            - "GET /parity/vendor-requests/00000000-0000-4000-8000-000000000000 -> 404 ERR_VENDOR_REQUEST_NOT_FOUND"
            - "GET /parity/data-submissions/00000000-0000-4000-8000-000000000000 -> 404 ERR_DATA_SUBMISSION_NOT_FOUND"
            - "GET /parity/corrective-action-plans/00000000-0000-4000-8000-000000000000 -> 404 ERR_CAP_NOT_FOUND"
            - "GET /parity/regulator-requests/00000000-0000-4000-8000-000000000000 -> 404 ERR_REGULATOR_REQUEST_NOT_FOUND"
            - "GET /parity/administrators/00000000-0000-4000-8000-000000000000 -> 404 ERR_ADMINISTRATOR_NOT_FOUND"
            - "GET /parity/classifications/00000000-0000-4000-8000-000000000000 -> 404 ERR_CLASSIFICATION_NOT_FOUND"

      - name: plan_year_create_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - entities.PlanYear.fields.funding_arrangement
          - validations.priority_6_ERR_VALIDATION
        distinguishing_aspect: "Omitting funding_arrangement — an input field with no declared default — yields 422 ERR_VALIDATION and no PlanYear row is created."
        test_recipe:
          setup:
            - "One Administrator."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
          trigger:
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
          assert:
            - "422 with data.error_id == ERR_VALIDATION"
            - "GET /parity/plan-years?administrator_id=${adm_id} returns total_count == 0"
            - "the same payload with funding_arrangement INSURED -> 201"

      - name: classification_defaults_applied_when_optional_fields_omitted
        claim_type: Defaults
        grounds:
          - entities.BenefitClassification.fields.sub_classification
          - entities.BenefitClassification.fields.mh_su_benefits_covered
        distinguishing_aspect: "Omitting sub_classification and mh_su_benefits_covered on an INPATIENT classification stores NONE and true, the declared defaults, rather than null."
        test_recipe:
          setup:
            - "One Administrator and one OPEN PlanYear."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_id: $.data.id }
          trigger:
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "INPATIENT", network_tier: "OUT_OF_NETWORK", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30" }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_id: $.data.id }
          assert:
            - "201 with BenefitClassification.${cls_id}.sub_classification == NONE"
            - "BenefitClassification.${cls_id}.mh_su_benefits_covered == true"
            - "BenefitClassification.${cls_id}.plan_year_id == ${py_id} and version == 1"

      - name: system_and_computed_fields_ignore_client_supplied_values
        claim_type: System Fields
        grounds:
          - entities.CorrectiveActionPlan.fields.status
          - entities.CorrectiveActionPlan.fields.reprocessing_liability_cents
          - entities.CorrectiveActionPlan.fields.approved_by_user_id
        distinguishing_aspect: "A create payload carrying id, status APPROVED and reprocessing_liability_cents 1 is either rejected as ERR_VALIDATION for unknown fields or ignored; the stored row is DRAFT with the server-computed 275000."
        test_recipe:
          setup:
            - "One Administrator, one OPEN PlanYear, one classification, one NqtlItem driven to VIOLATION (disparity_ratio 3.0000, index 10.00) by user-officer-01."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_id: $.data.id }
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "OUTPATIENT", network_tier: "IN_NETWORK", sub_classification: "OFFICE_VISITS", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_id: $.data.id }
            - call: "POST /parity/nqtl-items"
              payload: { plan_year_id: "${py_id}", classification_id: "${cls_id}", nqtl_type: "PRIOR_AUTHORIZATION", applied_to: "MENTAL_HEALTH_SUD_ONLY", description: "Prior authorization for outpatient MH/SUD office visits only." }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { item_id: $.data.id }
            - call: "POST /parity/vendor-requests"
              payload: { administrator_id: "${adm_id}", plan_year_id: "${py_id}", nqtl_item_id: "${item_id}", requested_item_count: 1, requested_submission_types: ["DENIAL_RATES"] }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { vr_id: $.data.id }
            - call: "POST /parity/vendor-requests/${vr_id}/data-submissions"
              payload: { classification_id: "${cls_id}", submission_type: "DENIAL_RATES", mh_denials: 300, mh_adjudicated_claims: 1000, ms_denials: 100, ms_adjudicated_claims: 1000 }
              as: Administrator
              as_user_id: "${adm_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /parity/nqtl-items/${item_id}"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { item_v: $.data.version }
            - call: "POST /parity/comparative-analyses"
              payload: { nqtl_item_id: "${item_id}", factor_count: 2, evidentiary_standard_count: 1, stringency_written_finding: "MORE_STRINGENT_MH", stringency_operation_finding: "MORE_STRINGENT_MH", expected_nqtl_item_version: "${item_v}" }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { ca_id: $.data.id }
            - call: "POST /parity/comparative-analyses/${ca_id}/submit"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
            - call: "GET /parity/plan-years/${py_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { py_v: $.data.version }
            - call: "POST /parity/nqtl-items/${item_id}/determinations"
              payload: { outcome: "VIOLATION", rationale: "MH/SUD-only prior authorization denies at three times the comparable rate.", expected_plan_year_version: "${py_v}" }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
          trigger:
            - call: "POST /parity/corrective-action-plans"
              payload: { nqtl_item_id: "${item_id}", remedy_type: "PROCESS_CHANGE", affected_claims_count: 880, average_claim_cents: 3125, target_completion_date: "2026-12-31" }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cap_id: $.data.id }
          assert:
            - "CorrectiveActionPlan.${cap_id}.status == DRAFT (system field, never taken from input)"
            - "CorrectiveActionPlan.${cap_id}.reprocessing_liability_cents == 275000 (computed, not supplied)"
            - "CorrectiveActionPlan.${cap_id}.approved_by_user_id == null"
            - "CorrectiveActionPlan.${cap_id}.id is server-minted, created_at and updated_at are server-stamped, version == 1"
            - "the same payload extended with status APPROVED and reprocessing_liability_cents 1 -> 422 ERR_VALIDATION (unknown input fields) or, if accepted, the stored row is still DRAFT / 275000"

      - name: classification_enum_and_pairing_constraints_enforced
        claim_type: Type Constraints
        grounds:
          - validations.priority_7_ERR_NETWORK_TIER_MISMATCH
          - validations.priority_8_ERR_SUB_CLASSIFICATION_MISMATCH
          - validations.priority_9_ERR_MEASUREMENT_PERIOD_INVALID
        distinguishing_aspect: "The three shape rules on classification creation fire independently: NOT_APPLICABLE on OUTPATIENT, OFFICE_VISITS on INPATIENT, and end before start each return their own error_id."
        test_recipe:
          setup:
            - "One Administrator and one OPEN PlanYear."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_id: $.data.id }
          trigger:
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "OUTPATIENT", network_tier: "NOT_APPLICABLE", sub_classification: "OFFICE_VISITS", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "INPATIENT", network_tier: "IN_NETWORK", sub_classification: "OFFICE_VISITS", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "EMERGENCY_CARE", network_tier: "NOT_APPLICABLE", measurement_period_start: "2026-06-30", measurement_period_end: "2026-01-01", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "EMERGENCY_CARE", network_tier: "NOT_APPLICABLE", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_ok_id: $.data.id }
          assert:
            - "OUTPATIENT + NOT_APPLICABLE -> 422 ERR_NETWORK_TIER_MISMATCH"
            - "INPATIENT + OFFICE_VISITS -> 422 ERR_SUB_CLASSIFICATION_MISMATCH"
            - "EMERGENCY_CARE with end 2026-01-01 before start 2026-06-30 -> 422 ERR_MEASUREMENT_PERIOD_INVALID"
            - "EMERGENCY_CARE + NOT_APPLICABLE with a well-ordered period -> 201, BenefitClassification.${cls_ok_id}.network_tier == NOT_APPLICABLE and sub_classification == NONE"
            - "benefit_category OUTPATIENT_SURGERY (not in the enum) -> 422 ERR_VALIDATION"

      - name: participant_notice_is_immutable_and_read_only
        claim_type: Immutability
        grounds:
          - entities.ParticipantNotice
          - endpoints.GET_parity_nqtl_items_id_participant_notices
        distinguishing_aspect: "ParticipantNotice declares common_fields false: §1.5 exposes no POST, PATCH or DELETE for it and the returned rows carry no version field, only the six system-stamped fields."
        test_recipe:
          setup:
            - "One NqtlItem driven to VIOLATION so that exactly one ParticipantNotice exists (see the §1.8 cascade instance for the chain)."
            - "This corner asserts only the shape and immutability of the row, not the cascade that produced it."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_id: $.data.id }
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "OUTPATIENT", network_tier: "IN_NETWORK", sub_classification: "OFFICE_VISITS", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_id: $.data.id }
            - call: "POST /parity/nqtl-items"
              payload: { plan_year_id: "${py_id}", classification_id: "${cls_id}", nqtl_type: "PRIOR_AUTHORIZATION", applied_to: "MENTAL_HEALTH_SUD_ONLY", description: "Prior authorization for outpatient MH/SUD office visits only." }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { item_id: $.data.id }
            - call: "POST /parity/vendor-requests"
              payload: { administrator_id: "${adm_id}", plan_year_id: "${py_id}", nqtl_item_id: "${item_id}", requested_item_count: 1, requested_submission_types: ["DENIAL_RATES"] }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { vr_id: $.data.id }
            - call: "POST /parity/vendor-requests/${vr_id}/data-submissions"
              payload: { classification_id: "${cls_id}", submission_type: "DENIAL_RATES", mh_denials: 300, mh_adjudicated_claims: 1000, ms_denials: 100, ms_adjudicated_claims: 1000 }
              as: Administrator
              as_user_id: "${adm_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /parity/nqtl-items/${item_id}"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { item_v: $.data.version }
            - call: "POST /parity/comparative-analyses"
              payload: { nqtl_item_id: "${item_id}", factor_count: 2, evidentiary_standard_count: 1, stringency_written_finding: "MORE_STRINGENT_MH", stringency_operation_finding: "MORE_STRINGENT_MH", expected_nqtl_item_version: "${item_v}" }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { ca_id: $.data.id }
            - call: "POST /parity/comparative-analyses/${ca_id}/submit"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
            - call: "GET /parity/plan-years/${py_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { py_v: $.data.version }
            - call: "POST /parity/nqtl-items/${item_id}/determinations"
              payload: { outcome: "VIOLATION", rationale: "MH/SUD-only prior authorization denies at three times the comparable rate.", expected_plan_year_version: "${py_v}" }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
          trigger:
            - call: "GET /parity/nqtl-items/${item_id}/participant-notices"
              payload: { notice_type: "VIOLATION_DISCLOSURE" }
              as: Regulator
              as_user_id: "user-regulator-01"
          assert:
            - "200 with response_type == array and exactly 1 row, total_count == 1, has_more == false"
            - "the row carries id, nqtl_item_id, notice_type, recipient_count, disclosure_summary, issued_at and source, and NO version and NO updated_at"
            - "notice.disclosure_summary == 'PRIOR_AUTHORIZATION in OUTPATIENT/IN_NETWORK: VIOLATION_DISCLOSURE'"
            - "notice.issued_at == 2026-08-01T00:00:00.000Z (the default logical clock, three fractional digits)"
            - "§1.5 declares no POST, PATCH, PUT or DELETE whose path ends in participant-notices, so the row cannot be created or edited by a client"

      - name: nqtl_item_rejects_a_classification_from_another_plan_year
        claim_type: Parent Relationships
        grounds:
          - validations.priority_12_ERR_CROSS_PLAN_YEAR_REFERENCE
          - errors.ERR_CROSS_PLAN_YEAR_REFERENCE
          - complexity_profile.entity_topology
        distinguishing_aspect: "Flat topology: both FK targets exist, so no 404 fires, but classification_id belongs to a different plan_year_id and the create is refused with ERR_CROSS_PLAN_YEAR_REFERENCE."
        test_recipe:
          setup:
            - "One Administrator and two OPEN PlanYears, each with its own OUTPATIENT / IN_NETWORK / OFFICE_VISITS classification."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026-A", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_a_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026-B", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 900, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_b_id: $.data.id }
            - call: "POST /parity/plan-years/${py_b_id}/classifications"
              payload: { benefit_category: "OUTPATIENT", network_tier: "IN_NETWORK", sub_classification: "OFFICE_VISITS", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_b_id: $.data.id }
          trigger:
            - call: "POST /parity/nqtl-items"
              payload: { plan_year_id: "${py_a_id}", classification_id: "${cls_b_id}", nqtl_type: "PRIOR_AUTHORIZATION", applied_to: "BOTH", description: "Prior authorization recorded against the wrong plan year." }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
            - call: "POST /parity/nqtl-items"
              payload: { plan_year_id: "${py_a_id}", classification_id: "00000000-0000-4000-8000-000000000000", nqtl_type: "PRIOR_AUTHORIZATION", applied_to: "BOTH", description: "Prior authorization against a classification that does not exist." }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
          assert:
            - "cross-plan-year create -> 409 ERR_CROSS_PLAN_YEAR_REFERENCE"
            - "unknown classification_id -> 404 ERR_CLASSIFICATION_NOT_FOUND (existence at priority 5 precedes coherence at priority 12)"
            - "GET /parity/nqtl-items?plan_year_id=${py_a_id} returns total_count == 0"

      - name: nqtl_item_in_a_classification_without_mh_benefits_rejected
        claim_type: Parent Relationships
        grounds:
          - validations.priority_24_ERR_MH_BENEFITS_NOT_COVERED
          - entities.BenefitClassification.fields.mh_su_benefits_covered
        distinguishing_aspect: "The parent classification exists and belongs to the right plan year, but mh_su_benefits_covered is false, so inventorying an NQTL there returns ERR_MH_BENEFITS_NOT_COVERED."
        test_recipe:
