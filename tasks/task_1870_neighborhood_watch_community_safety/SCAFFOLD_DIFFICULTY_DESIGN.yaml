  # =====================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: captain_assign_unassign_conserves_single_active_captain
        grounds:
          - state_machines.BlockCaptainAssignment
          - concurrency_rules[captain-assign-stale-block]
          - validations[priority=12]
        distinguishing_aspect: |
          Conserved quantity: count of ACTIVE BlockCaptainAssignments per block
          (invariant == 1 while captained). Forward action (assign captain B,
          superseding captain A -> RELIEVED) paired with its compensating action
          (relieve B) leaves the block with 0 ACTIVE assignments, and the
          invariant is checkable: exactly the assignments created minus the
          assignments relieved equals the ACTIVE count, with no drift after a
          full forward+compensate cycle.
        test_recipe:
          setup:
            - "Group with 1 REGISTERED block, 2 ACTIVE members m1, m2."
            - "Forward: assign m1 (ACTIVE count 1); supersede with m2 (m1 RELIEVED, ACTIVE count stays 1)."
          setup_api_calls:
            - call: "POST /watch/watch-groups"
              payload: { name: "Inv Watch", precinct_code: "PCT17" }
              as: ProgramCoordinator
              captures: { wg: $.data.id }
            - call: "POST /watch/watch-groups/${wg}/blocks"
              payload: { street_segment: "4-6 Chestnut St", household_count: 6 }
              as: ProgramCoordinator
              captures: { b1: $.data.id }
            - call: "POST /watch/blocks/${b1}/register"
              payload: {}
              as: ProgramCoordinator
              captures: { b1_v: $.data.version }
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${b1}", full_name: "Cap A", contact_channel: "SMS" }
              as: ProgramCoordinator
              captures: { m1: $.data.id }
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${b1}", full_name: "Cap B", contact_channel: "EMAIL" }
              as: ProgramCoordinator
              captures: { m2: $.data.id }
          trigger:
            - call: "POST /watch/blocks/${b1}/captain-assignments"
              payload: { member_id: "${m1}", expected_block_version: "${b1_v}" }
              as: ProgramCoordinator
              captures: { asg1: $.data.id }
            - call: "GET /watch/blocks/${b1}"
              payload: {}
              as: ProgramCoordinator
              captures: { b_v2: $.data.version }
            - call: "POST /watch/blocks/${b1}/captain-assignments"
              payload: { member_id: "${m2}", expected_block_version: "${b_v2}" }
              as: ProgramCoordinator
              captures: { asg2: $.data.id }
            - call: "GET /watch/captain-assignments/${asg1}"
              payload: {}
              as: ProgramCoordinator
              captures: { asg1_st: $.data.assignment_status }
            - call: "POST /watch/captain-assignments/${asg2}/relieve"
              payload: {}
              as: ProgramCoordinator
              captures: { asg2_st: $.data.assignment_status }
            - call: "GET /watch/blocks/${b1}/captain-assignments"
              payload: { assignment_status: "ACTIVE" }
              as: ProgramCoordinator
          assert:
            - "asg1_st == RELIEVED (supersede by the second create relieved the first assignment as a side effect)"
            - "asg2_st == RELIEVED (compensating relieve action)"
            - "the filtered list GET /watch/blocks/${b1}/captain-assignments?assignment_status=ACTIVE returns total_count == 0 — the forward+compensate pair restores the pre-chain ACTIVE count of 0 with zero drift (created 2 assignments == 2 RELIEVED + 0 ACTIVE)"

      - name: alert_send_recall_conserves_materials_inventory
        grounds:
          - state_machines.Alert.QUEUED_to_SENT
          - state_machines.Alert.SENT_to_RECALLED
          - calculations.alert_fanout
