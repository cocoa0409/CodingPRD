    code: 201
    input: [publisher_id, title_id, compensation_model, "monthly_fixed_fee_cents?", "guaranteed_compensation_cents?", "engagement_rate_cents_per_hour?", "monthly_engagement_cap_cents?", term_start_date, term_end_date, add_effective_date]
    output: LicensingDeal
