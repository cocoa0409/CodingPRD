  # ===========================================================================
  # Section 6 — Errors (Table 6): every error code in §1.6 is triggerable.
  # Errors already triggered inside a §1.8 instance (or a §1.9 instance above)
  # are emitted as excluded_because stubs citing the covering instance.
  # ===========================================================================
  - section: errors
    instances:
      # --- Triggered inside §1.8 instances ---
      - name: err_notice_expired_corner
        claim_type: violation_to_error
        grounds: ["errors[ERR_NOTICE_EXPIRED]"]
        excluded_because:
          difficulty_instance: notice_accept_after_response_deadline_rejected
          rationale: "That §1.9 validations instance triggers ERR_NOTICE_EXPIRED directly."
      - name: err_em_review_min_not_met_corner
        claim_type: violation_to_error
        grounds: ["errors[ERR_EM_REVIEW_MIN_NOT_MET]"]
        excluded_because:
          difficulty_instance: em_reviewed_pct_02999_stays_03000_promotes
          rationale: "The accept at reviewed_pct 0.2999 leg triggers ERR_EM_REVIEW_MIN_NOT_MET inside the named §1.8 instance."
      - name: err_no_coverage_plan_for_trip_corner
        claim_type: violation_to_error
        grounds: ["errors[ERR_NO_COVERAGE_PLAN_FOR_TRIP]"]
        excluded_because:
          difficulty_instance: em_trip_accept_gated_on_selection_completed_plan
          rationale: "Triggered by the accept-against-PUBLISHED-plan leg of the named §1.8 instance."
      - name: err_observer_overlap_corner
        claim_type: violation_to_error
        grounds: ["errors[ERR_OBSERVER_OVERLAP]"]
        excluded_because:
          difficulty_instance: observer_closed_interval_touching_dates_overlap
          rationale: "Triggered by the touching-dates deployment create in the named §1.8 instance."
      - name: err_vessel_turnaround_corner
        claim_type: violation_to_error
        grounds: ["errors[ERR_VESSEL_TURNAROUND_VIOLATION]"]
        excluded_because:
          difficulty_instance: vessel_turnaround_requires_full_in_port_day
          rationale: "Triggered by the gap==0 leg of the named §1.8 instance."
      - name: err_commitment_cap_corner
        claim_type: violation_to_error
        grounds: ["errors[ERR_OBSERVER_COMMITMENT_CAP_EXCEEDED]"]
        excluded_because:
          difficulty_instance: observer_commitment_cap_90_allowed_91_rejected
          rationale: "Triggered by the 31-day rejected leg of the named §1.8 instance."
      - name: err_invoice_not_issued_corner
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVOICE_NOT_ISSUED]"]
        excluded_because:
          difficulty_instance: invoice_payment_state_error_beats_fiscal_error
          rationale: "Triggered by the payment-on-DRAFT leg of the named §1.8 instance."
      - name: err_operator_delinquent_corner
