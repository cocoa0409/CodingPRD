  - rule_id: resource_temporal_overlap
    instances:
      - name: the_buffer_belongs_to_the_neighbouring_window_not_the_one_being_approved
        grounds:
          - calculations.zone_window_conflict_geometry
          - validations.priority_88
          - state_machines.InstallWindow.REQUESTED_to_APPROVED
        distinguishing_aspect: |
          Two QUIET windows that share an instant are legal, because QUIET carries
          zero buffers on both sides and the geometry is half-open. The same
          zero-buffer QUIET window becomes illegal when its neighbour is NOISY,
          because the 15-minute pre-access buffer that pushes the conflict window
          backwards is attached to the OTHER row, not to the one being approved.
          An implementation that buffers only the incoming window - the natural
          reading of "compute my effective interval and look for overlaps" -
          approves the fifth call. Two of the three passing approvals touch an
          existing interval exactly, so any inclusive comparison also fails.
        test_recipe:
          setup:
            - "project in phase FABRICATION with a single zone Z-A (max_noise_dba 85.0, dust_settling_buffer_minutes 120)"
            - "conflicts are enforced at approval, not at creation, so every window below is created first and then decided"
