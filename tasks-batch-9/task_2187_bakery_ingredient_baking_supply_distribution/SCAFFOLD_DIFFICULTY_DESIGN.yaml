            - "${zone_status} == SANITATION_LOCKOUT"
            - "${err} == ERR_RELATED_ENTITY_STATE_INVALID"
            - "HTTP status of the trigger call is 409"
            - "the response error_id is NOT ERR_ZONE_LOCKOUT_CONFLICT"
