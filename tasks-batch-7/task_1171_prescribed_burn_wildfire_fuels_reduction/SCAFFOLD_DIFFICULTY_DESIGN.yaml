  - rule_id: combinatorial_formula
    instances:
      - name: required_holding_force_tiered_conditionals
        grounds:
          - calculations.required_holding_force
          - entities.ResourceOrder.fields.required_engines
          - entities.ResourceOrder.fields.required_hand_crews
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction (ceil tiering, fuel factor,
          WUI additive bonus, STEEP multiplicative crew factor, TIMBER conditional dozer).
          Two parcels produce pinned tuples (4/2/0/1) and (10/4/1/2).
        test_recipe:
          setup:
            - "Two approved plans: PA 100ac on BRUSH/MODERATE/non-WUI; PB 150ac on TIMBER/STEEP/WUI (acreage 200)"
          setup_api_calls:
            - { call: "POST /associations", payload: {name: "Assoc", airshed_daily_acres_cap: 500, single_claim_cap_cents: 500000, landowner_liability_cap_cents: 1000000, initial_fund_cents: 10000000}, as: AssociationAdmin }
            - { call: "POST /landowners", payload: {name: "Lo", contact_email: "lo@x.com", liability_waiver_signed: true}, as: AssociationAdmin, captures: {lo: $.data.id} }
            - { call: "POST /burn-bosses", payload: {name: "Boss A", certification_tier: "RXB3"}, as: AssociationAdmin, captures: {bossA: $.data.id} }
            - { call: "POST /burn-bosses", payload: {name: "Boss R", certification_tier: "RXB3"}, as: AssociationAdmin, captures: {bossR: $.data.id} }
            - { call: "POST /parcels", payload: {landowner_id: "${lo}", name: "PA", acreage: 120, fuel_model: "BRUSH", slope_class: "MODERATE", wui_adjacent: false, airshed_id: "ASH-1", drought_index: 10}, as: Landowner, as_user_id: "${lo}", captures: {parcelA: $.data.id, parcelA_v: $.data.version} }
            - { call: "POST /parcels", payload: {landowner_id: "${lo}", name: "PB", acreage: 200, fuel_model: "TIMBER", slope_class: "STEEP", wui_adjacent: true, airshed_id: "ASH-1", drought_index: 5}, as: Landowner, as_user_id: "${lo}", captures: {parcelB: $.data.id, parcelB_v: $.data.version} }
