# =============================================================================
# Smart Parking Lot System — Benchmark Scaffold (v1)
# =============================================================================

scenario: |
  Smart parking lot system: real-time space status management with sensor-based
  occupancy detection, license-plate recognition binding, zone-level availability
  statistics, and reserved-space marking; entry and exit timing and billing with
  entry-time recording, exit-time calculation, billing rules
  (hourly/segmented/daily cap), free-period rules, and special-vehicle exemption
  (emergency/disabled); monthly and stored-value card management with card
  issuance, recharge, validity period, vehicle binding (single/multiple), card
  transfer rules, and expiration handling; space reservation with available-slot
  query, reservation hold time, no-show penalty, cancellation rules, and
  reservation-to-actual-use matching; illegal parking handling with violation
  type classification (overstay/non-paying/blocking/wrong zone), photo evidence
  capture, fine calculation, payment workflow, and tow-away coordination;
  revenue reporting with multi-dimensional aggregation
  (period/zone/billing-type), refund and adjustment handling, partner revenue
  sharing, invoice issuance, and periodic settlement; event-driven
  synchronization with payment, license-plate-recognition gate, and IM systems;
  audit logging for billing adjustments and reservation changes.

domain_name: smart-parking-lot
api_prefix: /lots

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - ops_run_checkpoint
    - scheduled_deferred_actions
    - optimistic_concurrency
  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many        # Lot→Zone→Space, Violation→Fine
    - many_to_many       # Card↔Vehicle (binding), Reservation↔Session (matching)
    - cross_aggregate    # Session→Card, Violation→Vehicle, RevenueEntry→Session/Fine
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ParkingLot
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Display name of the lot" }
      - { name: timezone, type: string, source: input, description: "IANA timezone (e.g. 'America/Los_Angeles') used for daily-cap window boundaries" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Base hourly rate in cents charged per started hour after free period" }
      - { name: daily_cap_cents, type: integer, source: input, description: "Maximum chargeable amount per calendar day (in lot timezone) for a single Session" }
      - { name: free_minutes, type: integer, source: input, description: "Free grace period in minutes from entry; if exit within free_minutes, fee=0", default: 15 }
      - { name: tow_grace_minutes, type: integer, source: input, description: "Buffer minutes after Session exit before Space is re-bookable for a Reservation", default: 5 }
      - { name: reservation_hold_minutes, type: integer, source: input, description: "Hold expiry duration in minutes after Reservation.scheduled_start_at before EXPIRED_NO_SHOW", default: 15 }
      - { name: no_show_penalty_cents, type: integer, source: input, description: "Charge applied to payer when reservation expires unmatched", default: 500 }
      - { name: partner_share_bps, type: integer, source: input, description: "Partner revenue share in basis points (e.g. 2000 = 20.00%)", default: 0 }

  - name: Zone
    parent: ParkingLot
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: system, description: "Owning ParkingLot id" }
      - { name: code, type: string, source: input, description: "Short zone code, unique within lot (e.g. 'A', 'B-VIP')" }
      - { name: zone_type, type: enum, source: input, description: "STANDARD | VIP | DISABLED | EMERGENCY — drives exemption logic", constraints: "values: STANDARD, VIP, DISABLED, EMERGENCY" }
      - { name: total_spaces, type: integer, source: computed, description: "Cached count of child Spaces, updated on Space create/delete" }
      - { name: free_spaces, type: integer, source: computed, description: "Cached count of child Spaces with occupancy_status=FREE AND reservation_lock=UNRESERVED" }

  - name: Space
    parent: Zone
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: system, description: "Owning Zone id" }
      - { name: lot_id, type: string, source: system, description: "Denormalized owning lot id for filtering" }
      - { name: label, type: string, source: input, description: "Space label, unique within zone (e.g. 'A-12')" }
      - { name: occupancy_status, type: enum, source: computed, description: "FREE | OCCUPIED — driven by sensor/LPR events", default: "FREE", constraints: "values: FREE, OCCUPIED" }
      - { name: reservation_lock, type: enum, source: computed, description: "UNRESERVED | RESERVED — set when an active Reservation holds this space", default: "UNRESERVED", constraints: "values: UNRESERVED, RESERVED" }
      - { name: current_session_id, type: string, source: computed, description: "Id of the active Session occupying this space (null when FREE)", default: null }
      - { name: last_exited_at, type: datetime, source: computed, description: "ISO 8601 UTC timestamp of most recent Session exit; used to enforce tow_grace_minutes buffer" }

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: plate, type: string, source: input, description: "Normalized license plate (uppercase, no spaces); globally unique" }
      - { name: kind, type: enum, source: input, description: "REGULAR | EMERGENCY | DISABLED — drives billing exemption", default: "REGULAR", constraints: "values: REGULAR, EMERGENCY, DISABLED" }
      - { name: binding_eligible, type: boolean, source: computed, description: "False when vehicle has any Violation in PENDING or DISPUTED; blocks new card bindings", default: true }
      - { name: open_violation_count, type: integer, source: computed, description: "Count of related Violations with status IN {PENDING, DISPUTED}", default: 0 }

  - name: Card
    parent: null
    common_fields: true
    fields:
      - { name: card_type, type: enum, source: input, description: "MONTHLY | STORED_VALUE — drives billing path", constraints: "values: MONTHLY, STORED_VALUE" }
      - { name: status, type: enum, source: computed, description: "ACTIVE | SUSPENDED | EXPIRED — cyclic ACTIVE↔SUSPENDED, terminal EXPIRED", default: "ACTIVE", constraints: "values: ACTIVE, SUSPENDED, EXPIRED" }
      - { name: holder_ref, type: string, source: input, description: "External holder reference (e.g. customer id from issuer)" }
      - { name: balance_cents, type: integer, source: computed, description: "Current stored value in cents (always 0 for MONTHLY cards)", default: 0 }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Flat monthly fee that exempts bindings from per-session billing (0 for STORED_VALUE)", default: 0 }
      - { name: valid_from, type: datetime, source: input, description: "ISO 8601 UTC start of validity period (inclusive)" }
      - { name: valid_until, type: datetime, source: input, description: "ISO 8601 UTC end of validity period (inclusive — last second of the day)" }
      - { name: bound_vehicle_ids, type: array, source: computed, description: "Vehicle ids currently bound to this card (max 1 for STORED_VALUE, max 4 for MONTHLY)" }
      - { name: auto_pay_enabled, type: boolean, source: input, description: "If true, completed Sessions and Fines bound to this card auto-debit balance/charge", default: false }

  - name: Session
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: system, description: "Lot id of entry gate" }
      - { name: space_id, type: string, source: system, description: "Space assigned at entry (set by gate or operator)" }
      - { name: vehicle_id, type: string, source: system, description: "Vehicle resolved from LPR or supplied plate" }
      - { name: card_id, type: string, source: input, description: "Optional card pinned to this session at entry time", default: null }
      - { name: reservation_id, type: string, source: system, description: "Linked reservation id if entry matched one (else null)", default: null }
      - { name: occupancy_status, type: enum, source: computed, description: "ACTIVE | EXITED — parallel state dimension", default: "ACTIVE", constraints: "values: ACTIVE, EXITED" }
      - { name: payment_status, type: enum, source: computed, description: "UNPAID | PAID | WAIVED | DISPUTED — parallel state dimension", default: "UNPAID", constraints: "values: UNPAID, PAID, WAIVED, DISPUTED" }
      - { name: entry_at, type: datetime, source: system, description: "ISO 8601 UTC entry timestamp recorded at gate-in" }
      - { name: exit_at, type: datetime, source: computed, description: "ISO 8601 UTC exit timestamp; null while ACTIVE" }
      - { name: estimated_fee_cents, type: integer, source: computed, description: "Provisional fee at any read time using now() as exit-clock; recomputed per request, never persisted" }
      - { name: final_fee_cents, type: integer, source: computed, description: "Final billed amount in cents; pinned at exit transition; null while ACTIVE" }
      - { name: billing_kind, type: enum, source: computed, description: "HOURLY | MONTHLY_COVERED | EXEMPT_VEHICLE — pinned at exit", constraints: "values: HOURLY, MONTHLY_COVERED, EXEMPT_VEHICLE" }

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "Target lot id" }
      - { name: zone_id, type: string, source: input, description: "Target zone id (zone_type drives eligibility filter)" }
      - { name: space_id, type: string, source: system, description: "Specific space allocated by selector (set on creation, cleared on cancel/expire)" }
      - { name: vehicle_id, type: string, source: input, description: "Vehicle that will park (must have binding_eligible=true)" }
      - { name: card_id, type: string, source: input, description: "Payer card; required when zone_type=STANDARD with no_show_penalty>0", default: null }
      - { name: scheduled_start_at, type: datetime, source: input, description: "ISO 8601 UTC requested start time" }
      - { name: scheduled_end_at, type: datetime, source: input, description: "ISO 8601 UTC requested end time (must be > scheduled_start_at)" }
      - { name: status, type: enum, source: computed, description: "HELD | MATCHED | EXPIRED_NO_SHOW | CANCELLED — branching with HELD as initial", default: "HELD", constraints: "values: HELD, MATCHED, EXPIRED_NO_SHOW, CANCELLED" }
      - { name: matched_session_id, type: string, source: computed, description: "Set when a Session entry matched this reservation; immutable thereafter", default: null }
      - { name: penalty_charged_cents, type: integer, source: computed, description: "0 unless status=EXPIRED_NO_SHOW (then no_show_penalty_cents) or CANCELLED inside no-cancel window (then half no_show_penalty_cents, rounded HALF_UP)", default: 0 }

  - name: Violation
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "Lot where the violation occurred" }
      - { name: vehicle_id, type: string, source: input, description: "Offending vehicle" }
      - { name: session_id, type: string, source: input, description: "Linked session if any (null for non-session violations e.g. wrong-zone walk-up)", default: null }
      - { name: space_id, type: string, source: input, description: "Space where evidence was captured" }
      - { name: violation_type, type: enum, source: input, description: "OVERSTAY | NON_PAYING | BLOCKING | WRONG_ZONE", constraints: "values: OVERSTAY, NON_PAYING, BLOCKING, WRONG_ZONE" }
      - { name: photo_uri, type: string, source: input, description: "URI of photographic evidence; required for BLOCKING and WRONG_ZONE" }
      - { name: status, type: enum, source: computed, description: "PENDING | PAID | DISPUTED | TOWED_AWAY — DISPUTED → PENDING is the cycle", default: "PENDING", constraints: "values: PENDING, PAID, DISPUTED, TOWED_AWAY" }
      - { name: officer_id, type: string, source: input, description: "Opaque EnforcementOfficer id who issued the violation" }
      - { name: detected_at, type: datetime, source: input, description: "ISO 8601 UTC time at which the violation was observed" }

  - name: Fine
    parent: Violation
    common_fields: false
    fields:
      - { name: violation_id, type: string, source: system, description: "Owning violation id; one Fine per Violation, append-only on creation" }
      - { name: amount_cents, type: integer, source: computed, description: "Computed at Violation creation per fine_amount calc; immutable" }
      - { name: components, type: object, source: computed, description: "Breakdown {base_cents, type_multiplier, repeat_offender_surcharge_cents, photo_required_surcharge_cents}; immutable" }
      - { name: paid_at, type: datetime, source: computed, description: "Set when Violation transitions to PAID; null otherwise", default: null }

  - name: Payment
    parent: null
    common_fields: false
    fields:
      - { name: kind, type: enum, source: input, description: "SESSION_FEE | FINE_PAYMENT | CARD_RECHARGE | NO_SHOW_PENALTY | REFUND", constraints: "values: SESSION_FEE, FINE_PAYMENT, CARD_RECHARGE, NO_SHOW_PENALTY, REFUND" }
      - { name: subject_id, type: string, source: input, description: "Polymorphic — Session.id, Violation.id, Card.id, Reservation.id, or original Payment.id (when REFUND)" }
      - { name: amount_cents, type: integer, source: input, description: "Positive for non-REFUND kinds; positive for REFUND (interpreted as outflow)" }
      - { name: card_id, type: string, source: input, description: "Card used for the payment (null for external-rail payments)", default: null }
      - { name: processed_at, type: datetime, source: system, description: "ISO 8601 UTC time the payment was applied" }
      - { name: external_ref, type: string, source: input, description: "External payment-system reference id; unique when present", default: null }

  - name: RevenueEntry
    parent: null
    common_fields: false
    fields:
      - { name: lot_id, type: string, source: system, description: "Lot id this entry belongs to" }
      - { name: zone_id, type: string, source: system, description: "Originating zone id when applicable", default: null }
      - { name: billing_type, type: enum, source: system, description: "HOURLY | MONTHLY | RESERVATION | NO_SHOW_PENALTY | FINE | REFUND | ADJUSTMENT", constraints: "values: HOURLY, MONTHLY, RESERVATION, NO_SHOW_PENALTY, FINE, REFUND, ADJUSTMENT" }
      - { name: source_kind, type: enum, source: system, description: "SESSION | RESERVATION | VIOLATION | CARD | MANUAL", constraints: "values: SESSION, RESERVATION, VIOLATION, CARD, MANUAL" }
      - { name: source_id, type: string, source: system, description: "Polymorphic id pointing to source entity" }
      - { name: gross_amount_cents, type: integer, source: system, description: "Signed amount (positive = revenue, negative = refund/adjustment) before partner share" }
      - { name: partner_share_cents, type: integer, source: computed, description: "Partner cut per revenue_split calc (always non-negative; 0 for REFUND/ADJUSTMENT)" }
      - { name: house_share_cents, type: integer, source: computed, description: "gross_amount_cents - partner_share_cents (signed)" }
      - { name: settlement_period, type: string, source: system, description: "ISO 'YYYY-MM-DD' day-key in lot timezone at which entry was generated" }
      - { name: notes, type: string, source: input, description: "Adjustment narrative (only set when billing_type=ADJUSTMENT)", default: null }

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - { name: actor_role, type: string, source: system, description: "Role from X-User-Role header" }
      - { name: actor_id, type: string, source: system, description: "X-User-ID at time of action" }
      - { name: action, type: enum, source: system, description: "BILLING_ADJUSTMENT | RESERVATION_CHANGE | FINE_WAIVE | CARD_TRANSFER", constraints: "values: BILLING_ADJUSTMENT, RESERVATION_CHANGE, FINE_WAIVE, CARD_TRANSFER" }
      - { name: subject_kind, type: string, source: system, description: "Entity type acted upon" }
      - { name: subject_id, type: string, source: system, description: "Entity id acted upon" }
      - { name: before, type: object, source: system, description: "Snapshot of mutated fields before the action" }
      - { name: after, type: object, source: system, description: "Snapshot of mutated fields after the action" }
      - { name: reason, type: string, source: input, description: "Required free-text reason supplied by actor" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ----- Space (parallel: occupancy × reservation_lock) -----
  - entity: Space
    field: occupancy_status
    initial_state: FREE
    terminal_states: []
    transitions:
      - from: FREE
        to: OCCUPIED
        trigger: "POST /lots/{lot_id}/sessions (gate-in event)"
        actor: GateSystem
        preconditions:
          - "Space.occupancy_status == FREE"
          - "Either Space.reservation_lock == UNRESERVED, OR an active Reservation for this Space matches the entering Vehicle (matched_session created)"
          - "now() >= Space.last_exited_at + ParkingLot.tow_grace_minutes when last_exited_at is set and reservation_lock == UNRESERVED"
        side_effects:
          - "Space.current_session_id = new Session.id"
          - "Zone.free_spaces decremented"
          - "If matched: Reservation.status FROM HELD TO MATCHED; Reservation.matched_session_id set; Space.reservation_lock UNRESERVED"
      - from: OCCUPIED
        to: FREE
        trigger: "POST /sessions/{session_id}/exit"
        actor: GateSystem
        preconditions:
          - "Session.occupancy_status == ACTIVE for the session referenced by Space.current_session_id"
        side_effects:
          - "Session.occupancy_status FROM ACTIVE TO EXITED"
          - "Session.exit_at = now()"
          - "Session.final_fee_cents pinned by session_billing calculation (final variant)"
          - "Space.last_exited_at = exit_at"
          - "Space.current_session_id = null"
          - "Zone.free_spaces incremented (only when reservation_lock=UNRESERVED)"
          - "If Session.payment_status == UNPAID and Session.card_id has auto_pay_enabled=true: cascade settle_session"

  - entity: Space
    field: reservation_lock
    initial_state: UNRESERVED
    terminal_states: []
    transitions:
      - from: UNRESERVED
        to: RESERVED
        trigger: "POST /lots/{lot_id}/reservations (selector picks this Space)"
        actor: Driver
        preconditions:
          - "No other Reservation for this Space with status=HELD overlapping the requested window"
          - "Space.occupancy_status == FREE OR scheduled_start_at >= Space.last_exited_at + ParkingLot.tow_grace_minutes"
        side_effects:
          - "Reservation.space_id = this Space.id"
      - from: RESERVED
        to: UNRESERVED
        trigger: "Reservation lifecycle (MATCHED, EXPIRED_NO_SHOW, CANCELLED)"
        actor: system
        preconditions:
          - "No other HELD Reservation for this Space"
        side_effects: []

  # ----- Session (parallel: occupancy × payment) -----
  - entity: Session
    field: occupancy_status
    initial_state: ACTIVE
    terminal_states: [EXITED]
    transitions:
      - from: ACTIVE
        to: EXITED
        trigger: "POST /sessions/{session_id}/exit"
        actor: GateSystem
        preconditions:
          - "Session.occupancy_status == ACTIVE"
        side_effects:
          - "exit_at = now()"
          - "billing_kind pinned (HOURLY | MONTHLY_COVERED | EXEMPT_VEHICLE)"
          - "final_fee_cents pinned via session_billing (final variant)"
          - "Space.occupancy_status FROM OCCUPIED TO FREE"

  - entity: Session
    field: payment_status
    initial_state: UNPAID
    terminal_states: [PAID, WAIVED]
    transitions:
      - from: UNPAID
        to: PAID
        trigger: "POST /sessions/{session_id}/pay (driver-initiated) OR cascade from Card.recharge / Session.exit when auto_pay_enabled"
        actor: Driver | system
        preconditions:
          - "Session.occupancy_status == EXITED"
          - "Session.final_fee_cents has been pinned"
          - "Sufficient funds (Card.balance_cents >= final_fee_cents) when paid via STORED_VALUE Card"
        side_effects:
          - "Card.balance_cents debited (STORED_VALUE) by final_fee_cents"
          - "RevenueEntry created with billing_type=HOURLY (or MONTHLY for monthly-covered with $0 entry)"
          - "Payment record created"
      - from: UNPAID
        to: WAIVED
        trigger: "POST /sessions/{session_id}/waive"
        actor: Operator
        preconditions:
          - "Session.occupancy_status == EXITED"
          - "Reason supplied"
        side_effects:
          - "AuditLog action=BILLING_ADJUSTMENT"
          - "RevenueEntry created with billing_type=ADJUSTMENT (gross_amount_cents = -final_fee_cents)"
      - from: UNPAID
        to: DISPUTED
        trigger: "POST /violations (overstay against this session)"
        actor: EnforcementOfficer
        preconditions:
          - "Session.occupancy_status == EXITED"
          - "Violation.violation_type == OVERSTAY and Violation.session_id == this session"
        side_effects:
          - "Vehicle.binding_eligible recomputed (cascade)"
      - from: DISPUTED
        to: UNPAID
        trigger: "PATCH /violations/{violation_id} (status moved off DISPUTED to PENDING by Operator)"
        actor: Operator
        preconditions:
          - "Linked Violation.status == PENDING after this transition"
        side_effects: []
      - from: PAID
        to: UNPAID
        trigger: "POST /payments/{payment_id}/refund"
        actor: Operator
        preconditions:
          - "Payment.kind == SESSION_FEE and Payment.subject_id == this Session.id"
          - "now() <= Payment.processed_at + 7 days"
        side_effects:
          - "RevenueEntry created with billing_type=REFUND (gross_amount_cents = -final_fee_cents)"
          - "Card.balance_cents credited if STORED_VALUE auto-pay was used"
          - "AuditLog action=BILLING_ADJUSTMENT"

  # ----- Reservation (branching with cancel revert path) -----
  - entity: Reservation
    initial_state: HELD
    terminal_states: [MATCHED, EXPIRED_NO_SHOW, CANCELLED]
    transitions:
      - from: HELD
        to: MATCHED
        trigger: "POST /lots/{lot_id}/sessions (gate-in within hold window matches reservation)"
        actor: GateSystem
        preconditions:
          - "Reservation.vehicle_id matches Session.vehicle_id"
          - "now() within [Reservation.scheduled_start_at - 5 minutes, Reservation.scheduled_start_at + ParkingLot.reservation_hold_minutes]"
          - "Space matches Reservation.space_id (or fallback selector if space taken)"
        side_effects:
          - "Reservation.matched_session_id = Session.id"
          - "Space.reservation_lock UNRESERVED"
          - "RevenueEntry created with billing_type=RESERVATION (gross_amount_cents = computed reservation_charge.match_credit, see calc)"
      - from: HELD
        to: EXPIRED_NO_SHOW
        trigger: "POST /_clock/advance crossing scheduled_start_at + reservation_hold_minutes"
        actor: system
        preconditions:
          - "now() >= scheduled_start_at + ParkingLot.reservation_hold_minutes"
          - "matched_session_id is null"
        side_effects:
          - "Reservation.penalty_charged_cents = ParkingLot.no_show_penalty_cents"
          - "Space.reservation_lock UNRESERVED"
          - "Payment created with kind=NO_SHOW_PENALTY (debited from Reservation.card_id when present)"
          - "RevenueEntry created with billing_type=NO_SHOW_PENALTY"
      - from: HELD
        to: CANCELLED
        trigger: "POST /reservations/{reservation_id}/cancel"
        actor: Driver | Operator
        preconditions:
          - "Reservation.status == HELD"
        side_effects:
          - "If now() >= scheduled_start_at - 30 minutes: Reservation.penalty_charged_cents = round(no_show_penalty_cents/2, HALF_UP)"
          - "Else penalty_charged_cents = 0"
          - "Space.reservation_lock UNRESERVED"
          - "If penalty>0: Payment kind=NO_SHOW_PENALTY created; RevenueEntry billing_type=NO_SHOW_PENALTY"
          - "AuditLog action=RESERVATION_CHANGE"

  # ----- Card (cyclic: ACTIVE ↔ SUSPENDED, terminal EXPIRED) -----
  - entity: Card
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /cards/{card_id}/suspend"
        actor: Operator
        preconditions:
          - "Card.status == ACTIVE"
        side_effects:
          - "Pending auto-pays paused; existing bindings retained"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /cards/{card_id}/reactivate"
        actor: Operator
        preconditions:
          - "Card.status == SUSPENDED"
          - "now() < Card.valid_until"
        side_effects:
          - "Auto-pays resume"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_clock/advance crossing valid_until OR POST /_sweep/run"
        actor: system
        preconditions:
          - "now() > Card.valid_until"
        side_effects:
          - "All Vehicle bindings cleared (bound_vehicle_ids = [])"
          - "auto_pay_enabled forced to false"
      - from: SUSPENDED
        to: EXPIRED
        trigger: "POST /_clock/advance crossing valid_until OR POST /_sweep/run"
        actor: system
        preconditions:
          - "now() > Card.valid_until"
        side_effects:
          - "All Vehicle bindings cleared"

  # ----- Violation (cyclic: PENDING ↔ DISPUTED, terminal PAID/TOWED_AWAY) -----
  - entity: Violation
    initial_state: PENDING
    terminal_states: [PAID, TOWED_AWAY]
    transitions:
      - from: PENDING
        to: PAID
        trigger: "POST /violations/{violation_id}/pay"
        actor: Driver
        preconditions:
          - "Violation.status == PENDING"
          - "Payment supplies amount_cents == Fine.amount_cents"
        side_effects:
          - "Fine.paid_at = now()"
          - "Vehicle.open_violation_count decremented"
          - "Vehicle.binding_eligible recomputed: true if open_violation_count == 0"
          - "RevenueEntry created with billing_type=FINE"
          - "If Session linked and Session.payment_status==DISPUTED: Session.payment_status FROM DISPUTED TO UNPAID (cascade)"
      - from: PENDING
        to: DISPUTED
        trigger: "PATCH /violations/{violation_id} body={status: DISPUTED}"
        actor: Driver
        preconditions:
          - "Violation.status == PENDING"
          - "now() <= detected_at + 14 days"
        side_effects:
          - "AuditLog action=BILLING_ADJUSTMENT"
      - from: DISPUTED
        to: PENDING
        trigger: "PATCH /violations/{violation_id} body={status: PENDING}"
        actor: Operator
        preconditions:
          - "Violation.status == DISPUTED"
        side_effects:
          - "AuditLog action=BILLING_ADJUSTMENT"
      - from: PENDING
        to: TOWED_AWAY
        trigger: "POST /violations/{violation_id}/tow"
        actor: Operator
        preconditions:
          - "Violation.status == PENDING"
          - "Violation.violation_type IN (BLOCKING, WRONG_ZONE, OVERSTAY)"
          - "Fine.amount_cents unpaid for >= 24h since detected_at"
        side_effects:
          - "Vehicle.open_violation_count decremented"
          - "If linked Session.occupancy_status == ACTIVE: Session.occupancy_status FROM ACTIVE TO EXITED; Space.occupancy_status FROM OCCUPIED TO FREE; Session.final_fee_cents pinned"
          - "AuditLog action=BILLING_ADJUSTMENT"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two drivers attempt to gate-in at the same FREE space simultaneously"
    guarantee: "At most one Session occupies a Space at a time; loser rejected"
    error_id: ERR_SPACE_OCCUPIED
    http_status: 409
    serialization: "First-writer-wins on Space.current_session_id assignment"
  - scenario: "Two reservations target the same Space with overlapping windows"
    guarantee: "At most one HELD reservation per Space×interval; loser rejected"
    error_id: ERR_RESERVATION_OVERLAP
    http_status: 409
    serialization: "First-writer-wins on (space_id, [scheduled_start_at, scheduled_end_at)) interval"
  - scenario: "Driver pays Session while Operator waives the same Session simultaneously"
    guarantee: "Exactly one transition wins; loser rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Session.payment_status"
  - scenario: "Card recharge and concurrent auto-pay debit"
    guarantee: "Balance updates serialized via OCC; second writer with stale version rejected"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "Card.version increments per write"
  - scenario: "Two operators simultaneously bind the same Vehicle to two different MONTHLY cards"
    guarantee: "A Vehicle can be bound to at most one MONTHLY card; second binding rejected"
    error_id: ERR_VEHICLE_ALREADY_BOUND
    http_status: 409
    serialization: "First-writer-wins on Vehicle→MONTHLY-Card binding edge"

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: session_billing
    trigger: "GET /sessions/{id} (estimate at any read), POST /sessions/{id}/exit (final pin)"
    algorithm: tiered_pricing
    formula: |
      # === Pre-classification ===
      if Vehicle.kind in (EMERGENCY, DISABLED):
          billing_kind = EXEMPT_VEHICLE; fee = 0; return
      if Session.card_id is not null:
          card = Card[Session.card_id]
          if card.card_type == MONTHLY and card.status == ACTIVE
             and Session.vehicle_id in card.bound_vehicle_ids
             and card.valid_from <= Session.entry_at <= card.valid_until:
              billing_kind = MONTHLY_COVERED; fee = 0; return
      billing_kind = HOURLY

      # === Tiered hourly with daily cap and free period ===
      duration_seconds = (exit_clock - entry_at).total_seconds()
      if duration_seconds <= ParkingLot.free_minutes * 60:
          fee_cents = 0; return

      # Split duration into per-calendar-day segments using ParkingLot.timezone.
      # For each calendar day d that the session spans:
      #   segment_seconds_d = min(end_of_day_d, exit_clock) - max(start_of_day_d, entry_at)
      # The free_minutes are consumed only on the FIRST day (the day containing entry_at);
      # subsequent days do not get a fresh free period.
      # For each day:
      #   billable_seconds_d = segment_seconds_d - (free_minutes*60 if d == entry_day else 0)
      #   billable_seconds_d = max(billable_seconds_d, 0)
      #   started_hours_d = ceil(billable_seconds_d / 3600)   # any partial hour rounds UP
      #   raw_d = started_hours_d * ParkingLot.hourly_rate_cents
      #   capped_d = min(raw_d, ParkingLot.daily_cap_cents)
      # fee_cents = sum(capped_d for d in days)
    input_set: "Session entry_at; exit_clock = exit_at if EXITED else now(); Vehicle.kind; Card binding & validity at entry_at; ParkingLot.{hourly_rate_cents, daily_cap_cents, free_minutes, timezone}"
    constants: {}
    precision: "Integer cents; ceil for started-hour count; min() for daily cap; sum is exact integer math"
    variants:
      - name: provisional_estimate
        when: "Session.occupancy_status == ACTIVE — exit_clock = now() at request time"
        difference: "exit_clock recomputed each call; result not persisted; can decrease backwards is impossible (now() monotonic) but can change as free_minutes window expires"
      - name: final_settlement
        when: "Session.occupancy_status == EXITED — exit_clock = pinned exit_at"
        difference: "Pinned at exit transition into Session.final_fee_cents and never recomputed; provisional taken at exit_at - 1ms can differ from final because the started-hour ceil function is discontinuous at hour boundaries"

  - name: stored_value_balance
    trigger: "GET /cards/{id} (read-time), POST /cards/{id}/recharge, Session pay (debit), Fine pay via card, Refund"
    algorithm: chronological
    formula: |
      # Process Payment events for this card in processed_at ascending order
      # (stable secondary sort by Payment.id ascending for tie-break on identical processed_at):
      balance_provisional = 0
      for p in payments_for_card_ordered_chronologically:
          if p.kind == CARD_RECHARGE:        balance_provisional += p.amount_cents
          elif p.kind == SESSION_FEE:        balance_provisional -= p.amount_cents
          elif p.kind == FINE_PAYMENT:       balance_provisional -= p.amount_cents
          elif p.kind == NO_SHOW_PENALTY:    balance_provisional -= p.amount_cents
          elif p.kind == REFUND:             balance_provisional += p.amount_cents
      # balance_finalized is identical math but only includes Payments
      # whose subject lifecycle is in a terminal state (Session.occupancy_status==EXITED,
      # Violation.status in {PAID, TOWED_AWAY}, Reservation.status in {MATCHED, EXPIRED_NO_SHOW, CANCELLED}).
      # Payments whose subject is still mid-lifecycle (e.g. ACTIVE Session pre-paid) are
      # excluded from finalized but included in provisional.
    input_set: "All Payment rows with card_id == this card. Provisional includes every row; finalized excludes rows whose subject lifecycle is non-terminal."
    constants: {}
    precision: "Integer cents; chronological accumulator; tie-break on id asc"
    variants:
      - name: provisional_balance
        when: "GET /cards/{id} returns this as Card.balance_cents alongside finalized_balance_cents"
        difference: "Includes every Payment row; reflects what the driver perceives at the moment"
      - name: finalized_balance
        when: "Used by settlement reports and revenue invariants"
        difference: "Excludes Payments whose subject is mid-lifecycle; therefore can lag provisional but cannot exceed it"

  - name: fine_amount
    trigger: "POST /violations (creation pins amount on the new Fine)"
    algorithm: threshold
    formula: |
      base_cents = TYPE_BASE[Violation.violation_type]   # see constants
      type_multiplier = TYPE_MULTIPLIER[Violation.violation_type]
      photo_required_surcharge_cents = (
          PHOTO_SURCHARGE_CENTS
          if Violation.violation_type in (BLOCKING, WRONG_ZONE)
          else 0
      )
      # Repeat-offender escalation: count Vehicle's prior Violations with status in
      # {PAID, TOWED_AWAY} OR (PENDING and detected_at within last 90 days).
      prior = count of Violation rows for this Vehicle (excluding this one) where:
          (status IN {PAID, TOWED_AWAY}) OR
          (status == PENDING AND detected_at >= now() - 90 days)
      if   prior == 0: repeat_offender_surcharge_cents = 0
      elif prior == 1: repeat_offender_surcharge_cents = REPEAT_TIER1_CENTS
      elif prior == 2: repeat_offender_surcharge_cents = REPEAT_TIER2_CENTS
      else:            repeat_offender_surcharge_cents = REPEAT_TIER3_CENTS

      amount_cents = round(
          base_cents * type_multiplier
          + photo_required_surcharge_cents
          + repeat_offender_surcharge_cents,
          HALF_UP
      )
      # Note: type_multiplier is a Decimal; multiplication done in Decimal,
      # rounded HALF_UP to nearest cent BEFORE adding integer surcharges.
      # Surcharges are integer cents and added without further rounding.
    input_set: "Violation.violation_type; Vehicle prior Violation history filtered by status & 90-day window; constants below"
    constants:
      TYPE_BASE:
        OVERSTAY: 2000        # $20.00
        NON_PAYING: 3000      # $30.00
        BLOCKING: 5000        # $50.00
        WRONG_ZONE: 4000      # $40.00
      TYPE_MULTIPLIER:
        OVERSTAY: 1.0
        NON_PAYING: 1.5
        BLOCKING: 2.0
        WRONG_ZONE: 1.25
      PHOTO_SURCHARGE_CENTS: 1500
      REPEAT_TIER1_CENTS: 1000
      REPEAT_TIER2_CENTS: 2500
      REPEAT_TIER3_CENTS: 5000
    precision: "Multiply base_cents * type_multiplier in Decimal; round HALF_UP to nearest cent; THEN add integer surcharges. Pinning the order prevents 'round-each-component vs round-final' divergence."

  - name: revenue_split
    trigger: "Each RevenueEntry creation"
    algorithm: waterfall_allocation
    formula: |
      # Per-entry, deterministic order:
      #   step 1: compute partner cut for THIS entry only:
      #       partner_share_cents = round(gross_amount_cents * partner_share_bps / 10000, HALF_UP)
      #       (sign-preserving — for negative gross e.g. REFUND, partner share is also negative
      #        BUT clamped to 0 floor: partner_share_cents = max(round(...), 0))
      #   step 2: house_share_cents = gross_amount_cents - partner_share_cents
      # The aggregation 'partner total for a settlement_period' is then
      #   sum(entry.partner_share_cents for entry in period)
      # NOT round(sum(entry.gross_amount_cents) * bps/10000).
      # This pinning matters: with mixed gross signs and >2 entries the two methods diverge
      # by up to (#entries) cents. Per-entry-then-sum is authoritative.
    input_set: "RevenueEntry.gross_amount_cents and ParkingLot.partner_share_bps in effect at entry creation time (snapshot, not live)"
    constants:
      BPS_DENOMINATOR: 10000
    precision: "Per-entry round HALF_UP to integer cents; clamp partner share to [0, gross]; sum-then-aggregate at report time without re-rounding."

  - name: reservation_charge
    trigger: "Reservation lifecycle terminal transition (MATCHED, EXPIRED_NO_SHOW, CANCELLED)"
    algorithm: constraint_propagation
    formula: |
      # Two interdependent values: (effective_charge, billing_type)
      # Their definitions reference each other on first read; pin evaluation order:
      #
      #   step 1 (FIRST): determine billing_type from Reservation.status
      #       if status == MATCHED:           billing_type = RESERVATION
      #       if status == EXPIRED_NO_SHOW:   billing_type = NO_SHOW_PENALTY
      #       if status == CANCELLED:         billing_type = NO_SHOW_PENALTY
      #
      #   step 2 (SECOND): compute effective_charge using the pinned billing_type
      #       if billing_type == RESERVATION:
      #           # Match credit: linked Session.final_fee_cents was charged hourly,
      #           # and reservation grants a discount equal to MATCH_DISCOUNT_BPS of
      #           # min(scheduled_window_hours * hourly_rate_cents, daily_cap_cents).
      #           scheduled_window_hours = ceil(
      #               (scheduled_end_at - scheduled_start_at).total_seconds() / 3600
      #           )
      #           reference_cents = min(
      #               scheduled_window_hours * ParkingLot.hourly_rate_cents,
      #               ParkingLot.daily_cap_cents
      #           )
      #           discount_cents = round(reference_cents * MATCH_DISCOUNT_BPS / 10000, HALF_UP)
      #           # Discount is recorded as a NEGATIVE adjustment RevenueEntry
      #           # so house_share + partner_share net out correctly.
      #           effective_charge = -discount_cents
      #       elif billing_type == NO_SHOW_PENALTY and status == EXPIRED_NO_SHOW:
      #           effective_charge = ParkingLot.no_show_penalty_cents
      #       elif billing_type == NO_SHOW_PENALTY and status == CANCELLED:
      #           # half-penalty inside no-cancel window, else 0
      #           if cancel_at >= scheduled_start_at - 30 minutes:
      #               effective_charge = round(ParkingLot.no_show_penalty_cents / 2, HALF_UP)
      #           else:
      #               effective_charge = 0
      #
      # WITHOUT pinning step 1 first, the discount formula would have to be evaluated
      # before knowing whether MATCHED applies — producing a dangling reference.
    input_set: "Reservation.status, scheduled_{start,end}_at, ParkingLot.{hourly_rate_cents, daily_cap_cents, no_show_penalty_cents}, MATCH_DISCOUNT_BPS, cancel_at when applicable"
    constants:
      MATCH_DISCOUNT_BPS: 1000   # 10.00% off the reference
    precision: "All intermediate rounding HALF_UP at the integer-cents step indicated; no second rounding after."

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: "all endpoints except /healthz"
  - priority: 2
    category: auth
    check: "Role permitted to call this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Resource ids in path resolve, validated left-to-right (lot before zone before space)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterized endpoints"
  - priority: 4
    category: existence
    check: "Foreign key references in request body resolve"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "endpoints that accept *_id in body (e.g. card_id, vehicle_id, reservation_id)"
  - priority: 5
    category: state
    check: "Optimistic concurrency: If-Match header equals current resource version on PATCH/PUT"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "PATCH and PUT endpoints"
  - priority: 6
    category: state
    check: "Target resource is in a state that admits the requested transition (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-mutating endpoints"
  - priority: 7
    category: business_safety
    check: "Vehicle.kind in (EMERGENCY, DISABLED) is exempt from billing AND from violation issuance for OVERSTAY/NON_PAYING (still subject to BLOCKING/WRONG_ZONE)"
    error_id: ERR_EXEMPT_VEHICLE
    http_status: 422
    applies_to: "POST /violations, POST /sessions/{id}/pay"
  - priority: 8
    category: business_referential
    check: "Vehicle.binding_eligible == true required for new Card binding and new Reservation"
    error_id: ERR_VEHICLE_HAS_OPEN_VIOLATIONS
    http_status: 409
    applies_to: "POST /cards/{id}/bind, POST /lots/{id}/reservations"
  - priority: 9
    category: business_constraint
    check: "Reservation interval [scheduled_start_at, scheduled_end_at) does not overlap any existing HELD or MATCHED Reservation on the same Space; back-to-back (touching boundaries) is allowed"
    error_id: ERR_RESERVATION_OVERLAP
    http_status: 409
    applies_to: "POST /lots/{id}/reservations"
  - priority: 10
    category: business_constraint
    check: "Space is bookable: Space.occupancy_status == FREE OR scheduled_start_at >= Space.last_exited_at + ParkingLot.tow_grace_minutes (closed buffer interval)"
    error_id: ERR_SPACE_NOT_BOOKABLE
    http_status: 409
    applies_to: "POST /lots/{id}/reservations, POST /lots/{id}/sessions"
  - priority: 11
    category: business_constraint
    check: "Card binding cardinality: STORED_VALUE max 1 vehicle, MONTHLY max 4 vehicles; a Vehicle may be bound to at most ONE MONTHLY card"
    error_id: ERR_CARD_BINDING_LIMIT
    http_status: 409
    applies_to: "POST /cards/{id}/bind"
  - priority: 12
    category: business_constraint
    check: "Card validity: now() in [valid_from, valid_until]; card status not EXPIRED"
    error_id: ERR_CARD_EXPIRED
    http_status: 409
    applies_to: "POST /cards/{id}/recharge, POST /cards/{id}/bind, POST /sessions/{id}/pay (when card_id used)"
  - priority: 13
    category: business_constraint
    check: "Card transfer: source card status==ACTIVE, target card status==ACTIVE, both belong to same holder_ref; only allowed for STORED_VALUE → STORED_VALUE OR MONTHLY → MONTHLY"
    error_id: ERR_INVALID_CARD_TRANSFER
    http_status: 422
    applies_to: "POST /cards/{id}/transfer"
  - priority: 14
    category: business_safety
    check: "Photo evidence required: Violation.photo_uri non-empty when violation_type IN (BLOCKING, WRONG_ZONE)"
    error_id: ERR_PHOTO_REQUIRED
    http_status: 422
    applies_to: "POST /violations"
  - priority: 15
    category: business_temporal
    check: "Reservation window: scheduled_end_at > scheduled_start_at; scheduled_start_at >= now() - 5 minutes"
    error_id: ERR_INVALID_RESERVATION_WINDOW
    http_status: 422
    applies_to: "POST /lots/{id}/reservations"
  - priority: 16
    category: business_fiscal
    check: "Card.balance_cents >= debit amount when STORED_VALUE card debited (Session pay, Fine pay, NO_SHOW penalty)"
    error_id: ERR_INSUFFICIENT_BALANCE
    http_status: 402
    applies_to: "POST /sessions/{id}/pay, POST /violations/{id}/pay, EXPIRED_NO_SHOW cascade"
  - priority: 17
    category: business_fiscal
    check: "Refund window: now() <= original_payment.processed_at + 7 days"
    error_id: ERR_REFUND_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /payments/{id}/refund"
  - priority: 18
    category: business_constraint
    check: "Audit-required actions (BILLING_ADJUSTMENT, RESERVATION_CHANGE, FINE_WAIVE, CARD_TRANSFER) supply non-empty 'reason' in body"
    error_id: ERR_REASON_REQUIRED
    http_status: 422
    applies_to: "POST /sessions/{id}/waive, PATCH /violations/{id} (status changes), POST /cards/{id}/transfer, PATCH /reservations/{id}"
  - priority: 19
    category: business_constraint
    check: "Pagination: limit in [1,100]; offset >= 0"
    error_id: ERR_BAD_REQUEST
    http_status: 400
    applies_to: "all list endpoints"
  - priority: 20
    category: business_constraint
    check: "License plate normalization: input must match /^[A-Z0-9-]{1,12}$/ after uppercase+strip; uniqueness on Vehicle.plate"
    error_id: ERR_BAD_REQUEST
    http_status: 400
    applies_to: "POST /vehicles"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Lot / Zone / Space (real-time status & config) ---
  - method: POST
    path: "/lots"
    description: "Create a parking lot"
    roles: [Operator]
    code: 201
    input: [name, timezone, hourly_rate_cents, daily_cap_cents, "free_minutes?", "tow_grace_minutes?", "reservation_hold_minutes?", "no_show_penalty_cents?", "partner_share_bps?"]
    output: ParkingLot
    side_effects: []

  - method: GET
    path: "/lots/{lot_id}"
    description: "Read parking lot configuration"
    roles: [Operator, Driver, EnforcementOfficer, ParkingPartner, Auditor]
    code: 200
    input: []
    output: ParkingLot
    side_effects: []

  - method: POST
    path: "/lots/{lot_id}/zones"
    description: "Create a zone within a lot"
    roles: [Operator]
    code: 201
    input: [code, zone_type]
    output: Zone
    side_effects: []

  - method: GET
    path: "/lots/{lot_id}/availability"
    description: "Real-time availability summary by zone, with optional zone_type filter"
    roles: [Operator, Driver, EnforcementOfficer, ParkingPartner, Auditor]
    code: 200
    input: ["zone_type?", "limit?", "offset?"]
    output: "Zone[]"
    side_effects:
      - "Returns total_spaces and free_spaces per zone (free = occupancy_status=FREE AND reservation_lock=UNRESERVED)"

  - method: POST
    path: "/lots/{lot_id}/zones/{zone_id}/spaces"
    description: "Create a space"
    roles: [Operator]
    code: 201
    input: [label]
    output: Space
    side_effects: ["Zone.total_spaces incremented; Zone.free_spaces incremented"]

  - method: GET
    path: "/lots/{lot_id}/zones/{zone_id}/spaces/{space_id}"
    description: "Read a space's real-time status"
    roles: [Operator, Driver, EnforcementOfficer, ParkingPartner, Auditor]
    code: 200
    input: []
    output: Space
    side_effects: []

  # --- Vehicles ---
  - method: POST
    path: "/vehicles"
    description: "Register a vehicle (LPR registration)"
    roles: [Operator, GateSystem]
    code: 201
    input: [plate, "kind?"]
    output: Vehicle
    side_effects: ["plate normalized; binding_eligible=true; open_violation_count=0"]

  - method: GET
    path: "/vehicles/{vehicle_id}"
    description: "Read a vehicle"
    roles: [Operator, Driver, EnforcementOfficer, GateSystem, Auditor]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  # --- Cards ---
  - method: POST
    path: "/cards"
    description: "Issue a card"
    roles: [Operator]
    code: 201
    input: [card_type, holder_ref, valid_from, valid_until, "monthly_fee_cents?", "auto_pay_enabled?"]
    output: Card
    side_effects: ["status=ACTIVE; balance_cents=0; bound_vehicle_ids=[]"]

  - method: GET
    path: "/cards/{card_id}"
    description: "Read a card; balance_cents is provisional, finalized_balance_cents also returned"
    roles: [Operator, Driver, ParkingPartner, Auditor]
    code: 200
    input: []
    output: Card
    side_effects: []

  - method: POST
    path: "/cards/{card_id}/recharge"
    description: "Recharge stored-value card; idempotent on external_ref"
    roles: [Operator, Driver]
    code: 200
    input: [amount_cents, "external_ref?"]
    output: Card
    side_effects:
      - "Payment kind=CARD_RECHARGE created"
      - "balance_cents += amount_cents"
      - "Cascade: settle_unpaid_sessions for vehicles bound to this card if auto_pay_enabled"

  - method: POST
    path: "/cards/{card_id}/bind"
    description: "Bind a vehicle to this card (subject to cardinality and binding_eligible)"
    roles: [Operator]
    code: 200
    input: [vehicle_id]
    output: Card
    side_effects: ["bound_vehicle_ids appended"]

  - method: POST
    path: "/cards/{card_id}/unbind"
    description: "Unbind a vehicle from this card"
    roles: [Operator]
    code: 200
    input: [vehicle_id]
    output: Card
    side_effects: ["bound_vehicle_ids removed"]

  - method: POST
    path: "/cards/{card_id}/suspend"
    description: "Suspend an ACTIVE card (transition ACTIVE → SUSPENDED)"
    roles: [Operator]
    code: 200
    input: []
    output: Card
    side_effects: ["status=SUSPENDED; auto-pays paused"]

  - method: POST
    path: "/cards/{card_id}/reactivate"
    description: "Reactivate a SUSPENDED card (transition SUSPENDED → ACTIVE)"
    roles: [Operator]
    code: 200
    input: []
    output: Card
    side_effects: ["status=ACTIVE"]

  - method: POST
    path: "/cards/{card_id}/transfer"
    description: "Transfer balance and bindings from this card to another card under same holder_ref"
    roles: [Operator]
    code: 200
    input: [target_card_id, reason]
    output: Card
    side_effects:
      - "target.balance_cents += source.balance_cents; source.balance_cents = 0"
      - "Vehicle bindings moved (subject to target's cardinality)"
      - "AuditLog action=CARD_TRANSFER"

  # --- Reservations ---
  - method: POST
    path: "/lots/{lot_id}/reservations"
    description: "Create a reservation; selector picks a Space"
    roles: [Driver, Operator]
    code: 201
    input: [zone_id, vehicle_id, scheduled_start_at, scheduled_end_at, "card_id?"]
    output: Reservation
    side_effects:
      - "Selector eligibility: Space.zone_id==zone_id, occupancy_status==FREE OR scheduled_start_at>=last_exited_at+tow_grace_minutes, no overlapping HELD reservation"
      - "Ranking: Space with smallest label (lex asc); tie-break by Space.id ascending"
      - "Fallback: ERR_NO_SPACE_AVAILABLE when candidate set empty"
      - "Space.reservation_lock RESERVED"

  - method: GET
    path: "/reservations/{reservation_id}"
    description: "Read a reservation"
    roles: [Driver, Operator, ParkingPartner, Auditor]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: PATCH
    path: "/reservations/{reservation_id}"
    description: "Update reservation window or vehicle (HELD only); requires If-Match and reason"
    roles: [Driver, Operator]
    code: 200
    input: ["scheduled_start_at?", "scheduled_end_at?", "vehicle_id?", reason]
    output: Reservation
    side_effects: ["AuditLog action=RESERVATION_CHANGE"]

  - method: POST
    path: "/reservations/{reservation_id}/cancel"
    description: "Cancel a HELD reservation"
    roles: [Driver, Operator]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "Status HELD→CANCELLED"
      - "If now() >= scheduled_start_at - 30 min: half-penalty charged"
      - "Space.reservation_lock UNRESERVED"

  # --- Sessions (entry / exit / pay / waive) ---
  - method: POST
    path: "/lots/{lot_id}/sessions"
    description: "Open a session at a gate (entry). Plate or vehicle_id required; selector picks Space if not supplied"
    roles: [GateSystem, Operator]
    code: 201
    input: ["vehicle_id?", "plate?", "space_id?", "card_id?"]
    output: Session
    side_effects:
      - "If matching HELD Reservation: Reservation MATCHED; Space.reservation_lock UNRESERVED"
      - "Space.occupancy_status FREE→OCCUPIED; Space.current_session_id=session.id"
      - "Zone.free_spaces decremented"

  - method: GET
    path: "/sessions/{session_id}"
    description: "Read a session; estimated_fee_cents recomputed live (provisional variant)"
    roles: [Driver, Operator, ParkingPartner, GateSystem, Auditor]
    code: 200
    input: []
    output: Session
    side_effects: ["session_billing.provisional_estimate run at request time"]

  - method: POST
    path: "/sessions/{session_id}/exit"
    description: "Close a session at gate-out; pins final_fee_cents"
    roles: [GateSystem, Operator]
    code: 200
    input: []
    output: Session
    side_effects:
      - "occupancy_status ACTIVE→EXITED"
      - "final_fee_cents pinned via session_billing.final_settlement"
      - "Space.occupancy_status OCCUPIED→FREE; last_exited_at=exit_at"
      - "If card.auto_pay_enabled: cascade settle_session"

  - method: POST
    path: "/sessions/{session_id}/pay"
    description: "Pay a session fee (driver-initiated or auto-pay cascade)"
    roles: [Driver, Operator]
    code: 200
    input: ["card_id?", "external_ref?"]
    output: Session
    side_effects:
      - "Payment kind=SESSION_FEE; payment_status UNPAID→PAID"
      - "RevenueEntry billing_type=HOURLY (or MONTHLY if billing_kind=MONTHLY_COVERED)"
      - "Card.balance_cents debited if STORED_VALUE"

  - method: POST
    path: "/sessions/{session_id}/waive"
    description: "Operator waives an unpaid session"
    roles: [Operator]
    code: 200
    input: [reason]
    output: Session
    side_effects:
      - "payment_status UNPAID→WAIVED"
      - "RevenueEntry billing_type=ADJUSTMENT (gross_amount = -final_fee_cents)"
      - "AuditLog action=BILLING_ADJUSTMENT"

  # --- Violations / Fines ---
  - method: POST
    path: "/violations"
    description: "Issue a violation; Fine auto-created with computed amount"
    roles: [EnforcementOfficer]
    code: 201
    input: [lot_id, vehicle_id, violation_type, "session_id?", space_id, "photo_uri?", detected_at]
    output: Violation
    side_effects:
      - "Fine created (immutable amount_cents)"
      - "Vehicle.open_violation_count++; Vehicle.binding_eligible=false"
      - "If violation_type==OVERSTAY and session linked & EXITED: Session.payment_status UNPAID→DISPUTED"

  - method: GET
    path: "/violations/{violation_id}"
    description: "Read a violation (Fine returned via expand)"
    roles: [EnforcementOfficer, Driver, Operator, Auditor]
    code: 200
    input: []
    output: Violation
    side_effects: []

  - method: PATCH
    path: "/violations/{violation_id}"
    description: "Move violation between PENDING and DISPUTED (per RBAC); reason required"
    roles: [Driver, Operator]
    code: 200
    input: [status, reason]
    output: Violation
    side_effects:
      - "PENDING→DISPUTED (Driver, within 14 days of detected_at)"
      - "DISPUTED→PENDING (Operator)"
      - "AuditLog action=BILLING_ADJUSTMENT"

  - method: POST
    path: "/violations/{violation_id}/pay"
    description: "Pay the fine; idempotent on external_ref"
    roles: [Driver, Operator]
    code: 200
    input: [amount_cents, "card_id?", "external_ref?"]
    output: Violation
    side_effects:
      - "PENDING→PAID; Fine.paid_at set"
      - "Vehicle.open_violation_count--; binding_eligible recomputed"
      - "RevenueEntry billing_type=FINE"
      - "If linked Session.payment_status==DISPUTED: cascade DISPUTED→UNPAID"

  - method: POST
    path: "/violations/{violation_id}/tow"
    description: "Coordinate tow-away for an unpaid violation older than 24h"
    roles: [Operator]
    code: 200
    input: [reason]
    output: Violation
    side_effects:
      - "PENDING→TOWED_AWAY"
      - "If linked Session ACTIVE: cascade exit (final_fee pinned, Space freed)"
      - "AuditLog action=BILLING_ADJUSTMENT"

  # --- Payments ---
  - method: POST
    path: "/payments/{payment_id}/refund"
    description: "Refund an existing payment within 7-day window"
    roles: [Operator]
    code: 200
    input: [reason]
    output: Payment
    side_effects:
      - "New REFUND Payment created (separate row)"
      - "Subject lifecycle reverted (e.g. Session PAID→UNPAID)"
      - "RevenueEntry billing_type=REFUND (gross_amount = -original.amount)"
      - "Card.balance_cents credited if STORED_VALUE"
      - "AuditLog action=BILLING_ADJUSTMENT"

  # --- Revenue / Settlement ---
  - method: GET
    path: "/lots/{lot_id}/revenue"
    description: "Multi-dimensional revenue aggregation; group_by combination of {period, zone_id, billing_type}"
    roles: [Operator, ParkingPartner, Auditor]
    code: 200
    input: ["from?", "to?", "group_by?", "billing_type?", "limit?", "offset?"]
    output: "RevenueEntry[]"
    side_effects: ["Sums computed via revenue_split.per_entry_then_sum invariant"]

  - method: POST
    path: "/lots/{lot_id}/settlement/run"
    description: "Settle current period: emit invoice + partner-share computation snapshot"
    roles: [Operator]
    code: 200
    input: ["period?"]
    output: "object {invoice_id, period, gross_total_cents, partner_total_cents, house_total_cents}"
    side_effects:
      - "Generates invoice (immutable record)"
      - "settlement_period of subsequent RevenueEntry rows uses next day-key"

  # --- Audit ---
  - method: GET
    path: "/audit-logs"
    description: "List audit log entries; filter by subject_kind/subject_id/action"
    roles: [Auditor, Operator]
    code: 200
    input: ["subject_kind?", "subject_id?", "action?", "limit?", "offset?"]
    output: "AuditLog[]"
    side_effects: []

  # --- Test-driving endpoints (required for testability per §1.5) ---
  - method: POST
    path: "/_clock/advance"
    description: "Advance virtual clock (test driver)"
    roles: [Operator, Auditor]
    code: 200
    input: [to]
    output: "object {now: ISO8601}"
    side_effects:
      - "Triggers eligible Card ACTIVE/SUSPENDED → EXPIRED transitions"
      - "Triggers eligible Reservation HELD → EXPIRED_NO_SHOW transitions"

  - method: POST
    path: "/_sweep/run"
    description: "Run idempotent sweep — recompute Card expirations, Reservation no-shows, denormalized counts"
    roles: [Operator, Auditor]
    code: 200
    input: []
    output: "object {cards_expired: int, reservations_expired: int, zones_recomputed: int}"
    side_effects: ["See description"]

  - method: POST
    path: "/_events/emit"
    description: "Inject an external event (LPR gate, payment-rail callback, IM acknowledgement) for synchronization tests"
    roles: [Operator, Auditor]
    code: 200
    input: [event_kind, payload]
    output: "object {applied: bool, side_effects: array}"
    side_effects:
      - "event_kind=LPR_DETECT: opens session for plate"
      - "event_kind=PAYMENT_CALLBACK: marks Payment external_ref as confirmed"
      - "event_kind=IM_ACK: stamps notification delivery (no state mutation)"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH,                http: 401, condition: "X-User-Role or X-User-ID header missing" }
  - { id: ERR_FORBIDDEN,                   http: 403, condition: "Role not permitted to call this endpoint" }
  - { id: ERR_NOT_FOUND,                   http: 404, condition: "Resource id does not exist or belongs to another lot/scope" }
  - { id: ERR_BAD_REQUEST,                 http: 400, condition: "Malformed request: missing required fields, pagination out of range, plate format invalid" }
  - { id: ERR_VERSION_CONFLICT,            http: 409, condition: "If-Match header value does not equal current version" }
  - { id: ERR_INVALID_STATE,               http: 409, condition: "Resource state does not admit the requested transition" }
  - { id: ERR_SPACE_OCCUPIED,              http: 409, condition: "Space is already OCCUPIED at gate-in" }
  - { id: ERR_SPACE_NOT_BOOKABLE,          http: 409, condition: "Space within tow-grace window or otherwise blocked from new booking" }
  - { id: ERR_RESERVATION_OVERLAP,         http: 409, condition: "Requested reservation interval overlaps an existing HELD/MATCHED reservation on the same space" }
  - { id: ERR_NO_SPACE_AVAILABLE,          http: 409, condition: "Reservation selector candidate set is empty" }
  - { id: ERR_INVALID_RESERVATION_WINDOW,  http: 422, condition: "scheduled_end_at <= scheduled_start_at, or scheduled_start_at too far in the past" }
  - { id: ERR_VEHICLE_HAS_OPEN_VIOLATIONS, http: 409, condition: "Vehicle.binding_eligible is false (open violation)" }
  - { id: ERR_VEHICLE_ALREADY_BOUND,       http: 409, condition: "Vehicle is already bound to a MONTHLY card; cannot bind to second MONTHLY" }
  - { id: ERR_CARD_BINDING_LIMIT,          http: 409, condition: "Cardinality breach: STORED_VALUE>1 vehicles or MONTHLY>4 vehicles" }
  - { id: ERR_CARD_EXPIRED,                http: 409, condition: "Card.status==EXPIRED or now() outside [valid_from, valid_until]" }
  - { id: ERR_INVALID_CARD_TRANSFER,       http: 422, condition: "Source/target card type mismatch, holder_ref mismatch, or non-ACTIVE status" }
  - { id: ERR_INSUFFICIENT_BALANCE,        http: 402, condition: "STORED_VALUE Card.balance_cents below required debit amount" }
  - { id: ERR_REFUND_WINDOW_EXPIRED,       http: 422, condition: "Refund attempted >7 days after Payment.processed_at" }
  - { id: ERR_PHOTO_REQUIRED,              http: 422, condition: "BLOCKING or WRONG_ZONE violation lacks photo_uri" }
  - { id: ERR_EXEMPT_VEHICLE,              http: 422, condition: "Vehicle.kind in (EMERGENCY, DISABLED): blocks billing payment and OVERSTAY/NON_PAYING violations" }
  - { id: ERR_REASON_REQUIRED,             http: 422, condition: "Audit-required action submitted without non-empty reason" }
  - { id: ERR_DUPLICATE_EXTERNAL_REF,      http: 409, condition: "Payment external_ref already used (idempotency)" }
  - { id: ERR_VEHICLE_NOT_BOUND,           http: 409, condition: "Attempt to unbind a vehicle that is not in bound_vehicle_ids" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Operator
    description: "Lot operator who manages lots, zones, spaces, cards, settlements, waivers"
    identity: "opaque"
    exclusive_operations:
      - "POST /lots"
      - "POST /lots/{lot_id}/zones"
      - "POST /lots/{lot_id}/zones/{zone_id}/spaces"
      - "POST /cards"
      - "POST /cards/{id}/suspend"
      - "POST /cards/{id}/reactivate"
      - "POST /cards/{id}/bind"
      - "POST /cards/{id}/unbind"
      - "POST /cards/{id}/transfer"
      - "POST /sessions/{id}/waive"
      - "POST /violations/{id}/tow"
      - "POST /payments/{id}/refund"
      - "POST /lots/{lot_id}/settlement/run"
    shared_operations:
      - "GET endpoints (lot, zone, space, card, session, reservation, violation, audit-logs, revenue)"
      - "POST /vehicles (with GateSystem)"
      - "POST /lots/{lot_id}/reservations (with Driver)"
      - "PATCH /reservations/{id} (with Driver)"
      - "POST /reservations/{id}/cancel (with Driver)"
      - "POST /lots/{lot_id}/sessions (with GateSystem)"
      - "POST /sessions/{id}/exit (with GateSystem)"
      - "POST /sessions/{id}/pay (with Driver)"
      - "PATCH /violations/{id} (DISPUTED→PENDING only)"
      - "POST /violations/{id}/pay (with Driver)"
      - "POST /cards/{id}/recharge (with Driver)"
      - "POST /_clock/advance, POST /_sweep/run, POST /_events/emit (with Auditor)"

  - name: Driver
    description: "Vehicle owner / customer initiating reservations and payments"
    identity: "entity_backed:Vehicle"
    exclusive_operations:
      - "PATCH /violations/{id} (PENDING→DISPUTED only)"
    shared_operations:
      - "POST /lots/{lot_id}/reservations"
      - "PATCH /reservations/{id}"
      - "POST /reservations/{id}/cancel"
      - "POST /sessions/{id}/pay"
      - "POST /violations/{id}/pay"
      - "POST /cards/{id}/recharge"
      - "GET endpoints scoped to own vehicle/cards/sessions/reservations/violations"
    note: "X-User-ID equals Vehicle.id; ownership checks compare X-User-ID to entity.vehicle_id"

  - name: GateSystem
    description: "Automated gate / LPR camera system"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /vehicles"
      - "POST /lots/{lot_id}/sessions"
      - "POST /sessions/{id}/exit"
      - "GET /sessions/{id}, GET /vehicles/{id}, GET /lots/{lot_id}/availability"

  - name: EnforcementOfficer
    description: "Officer who issues violations on patrol"
    identity: "opaque"
    exclusive_operations:
      - "POST /violations"
    shared_operations:
      - "GET /violations/{id}, GET /lots/{lot_id}/availability, GET /vehicles/{id}"

  - name: ParkingPartner
    description: "Revenue-share partner; read-only access to revenue & settlements"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET /lots/{lot_id}/revenue"
      - "GET /lots/{lot_id}, GET /lots/{lot_id}/availability"
      - "GET /cards/{id}, GET /sessions/{id}, GET /reservations/{id}"

  - name: Auditor
    description: "Read-only access to all entities; can run sweeps and clock advance for audits"
    identity: "opaque"
    exclusive_operations:
      - "GET /audit-logs"
    shared_operations:
      - "All GET endpoints"
      - "POST /_clock/advance, POST /_sweep/run, POST /_events/emit (with Operator)"
