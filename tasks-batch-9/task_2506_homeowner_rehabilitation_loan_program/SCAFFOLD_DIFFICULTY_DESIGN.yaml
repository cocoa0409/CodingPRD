  - rule_id: combinatorial_formula
    instances:
      - name: write_up_estimate_pins_round_each_line_then_sum_then_round_contingency
        grounds:
          - calculations.work_write_up_estimate
          - entities.WorkItem.fields.protocol_multiplier
          - entities.WorkItem.fields.line_total_cents
          - entities.WorkWriteUp.fields.base_estimate_cents
          - entities.WorkWriteUp.fields.contingency_cents
          - entities.WorkWriteUp.fields.total_estimate_cents
          - entities.WorkWriteUp.fields.priority_repair_total_cents
          - state_machines.WorkWriteUp.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          This instance is mode (b) — nested rounding where the order changes the cents. The three
          fixture lines 1,234,567 (lead-safe, ×1.15), 987,654 (historic, ×1.12) and 500,001 (×1.00)
          produce base_estimate_cents 3,025,925 and total_estimate_cents 3,328,518 under the pinned
          "round each line, then sum, then round the contingency" order, whereas the rejected
          "sum the raw products, then round" order yields 3,025,926 and 3,328,519 — a one-cent
          divergence that no mode (a) or mode (c) instance in this scaffold can expose.
        test_recipe:
          setup:
            - "one RehabApplication built 1962 in a historic district, so lead_review_required and historic_review_required are both true"
            - "the application has passed ownership verification and its initial standards inspection, so workflow_state is INSPECTED"
            - "a DRAFT WorkWriteUp on that application carries exactly three work items: 1,234,567 with is_lead_hazard_reduction true and priority_class HEALTH_SAFETY; 987,654 with is_historic_sensitive true and priority_class CODE; 500,001 with neither flag and priority_class GENERAL_PROPERTY_IMPROVEMENT"
          setup_api_calls:
            - call: "POST /rehab/program-years"
              payload: { fiscal_year: 2026, ami_median_income_cents: 9000000, max_loan_amount_cents: 7500000, allocation_budget_cents: 50000000 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { py_id: $.data.id }
            - call: "POST /rehab/applicants"
              payload: { program_year_id: "${py_id}", full_name: "Junie Abbott", email: "junie@example.org", household_size: 4, income_calc_method: "PART_5_ANNUAL", wage_income_cents: 7000000, benefit_income_cents: 0, actual_asset_income_cents: 0, household_assets_cents: 5000000, dependents_count: 2, elderly_household: false }
              as: IntakeSpecialist
              as_user_id: "is-1"
              captures: { hh_id: $.data.id }
            - call: "POST /rehab/applicants/${hh_id}/verify-income"
              payload: {}
              as: IntakeSpecialist
              as_user_id: "is-1"
            - call: "POST /rehab/applications"
              payload: { applicant_id: "${hh_id}", address_line1: "9 Canal Row", city: "Fairview", state_code: "OH", year_built: 1962, assessed_value_cents: 14000000, senior_lien_balance_cents: 9000000, historic_district: true, occupancy_type: "OWNER_OCCUPIED_SINGLE", ownership_doc_type: "WARRANTY_DEED" }
              as: IntakeSpecialist
              as_user_id: "is-1"
              captures: { app_id: $.data.id }
