      - name: renew_before_open_renewal_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_INVALID_LEASE_STATE
          - state_machines.GroundLease
        distinguishing_aspect: |
          renew is declared only from RENEWAL_NEGOTIATION, so calling it on an ACTIVE lease returns
          409 ERR_INVALID_LEASE_STATE — and it does so even at the 2026-08-01 clock where the renewal
          window is also closed, because the state gate at priority 10 outranks the temporal gate at
          priority 24.
        test_recipe:
          setup:
            - "Tower RBO has an ACTIVE ground lease ending 2031-05-31 with one unused renewal option."
          setup_api_calls:
            - call: "POST /tower-colo/towers"
              payload: { site_name: "Renew Before Open", structure_type: "MONOPOLE", rated_capacity_load_units: 9000, min_colocation_elevation_ft: 50, max_elevation_ft: 300, ground_space_total_sqft: 9000 }
