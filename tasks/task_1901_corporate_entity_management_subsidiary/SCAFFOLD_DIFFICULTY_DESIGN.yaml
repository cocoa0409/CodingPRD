            - "chart nodes[] entry for ${e2}: look_through_percentage_bps == 5000 (path U->A->E: 8000*5000/10000 = 4000, plus direct 1000)"
            - "chart nodes[] entry for ${a_id}: look_through_percentage_bps == 8000"
            - "DIRECT edge percentage for ${e2} (1000) != LOOK_THROUGH node percentage for ${e2} (5000)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: franchise_tax_tiered_block_ceil
        grounds:
          - calculations.franchise_tax
          - entities.LegalEntity.fields.authorized_shares
        distinguishing_aspect: |
          Mode (a) combinatorial: the SHARES_TIERED formula combines >= 3 inputs
          (authorized_shares, entity_type, jurisdiction.franchise_tax_method)
          with non-linear interaction (conditional nonprofit branch, ceil over
          10000-share blocks, min against TAX_CAP_CENTS). At the block boundary,
          5000 shares assesses 17500 cents while 5001 shares assesses 26000
          cents because ceil(1/10000) = 1 full block.
        test_recipe:
          setup:
            - "J1 and agent AG1 exist"
            - "entity E_lo ACTIVE with authorized_shares 5000; entity E_hi ACTIVE with authorized_shares 5001"
            - "both FRANCHISE_TAX period-2026 filings prepared and submitted at the default clock (no lateness)"
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { code: "US-DE", name: "Delaware", annual_report_due_rule: "FIXED_MONTH_DAY", annual_report_due_month: 12, annual_report_due_day: 31, grace_period_days: 10, franchise_tax_method: "SHARES_TIERED", late_penalty_base_cents: 12500, late_penalty_cap_cents: 50000, penalty_day_counting: "CALENDAR_DAYS", report_fee_cents: 5000, cert_fee_cents: 5000, ra_resignation_notice_days: 30, forfeiture_window_days: 120 }
              as: CorporateSecretary
