          setup:
            - "GRILL WORLD: Recipe PLATE-GRILL ACTIVE / FRESH, MenuItem MI-GRILL-MW ACTIVE in MW with plate_cost_cents 100 and plate_cost_state FRESH; the logical clock stays at 2026-08-01T00:00:00Z so every window is still in the future."
