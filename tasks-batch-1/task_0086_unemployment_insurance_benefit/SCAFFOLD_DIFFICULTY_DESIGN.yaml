scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: base_period_standard_vs_alternate_diverge
        grounds:
          - calculations.base_period_wage_total
          - calculations.monetary_qualification
          - entities.Claim.fields.base_period_method
          - state_machines.Claim.MONETARY_PENDING_to_MONETARILY_ELIGIBLE
        distinguishing_aspect: |
          On the Claim/WageRecord monetary domain: identical WageRecords yield a
          STANDARD base-period total of 250000 (fails the 260000 floor) but an
          ALTERNATE total of 540000 (qualifies) — two valid quarter-set algorithms
          produce different selected wages, WBA, and MBA from the same data.
        test_recipe:
          setup:
            - "One Employer; one Claimant; five WageRecords (one per quarter 2025-Q1..2026-Q1, none disputed)."
            - "Claim filed 2026-04-05 (a 2026-Q2 date) and SUBMITTED to MONETARY_PENDING."
          setup_api_calls:
            - call: "POST /ui/employers"
              payload: { legal_name: "Acme Co", state_account_number: "EA-1001", experience_rate: 0.034, reserve_opening_balance_cents: 100000000 }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /ui/claimants"
              payload: { full_name: "Dana Var", ssn_last4: "1001", date_of_birth: "1990-01-01", is_able_and_available: true }
              as: ProgramAdmin
              captures: { clmt_id: $.data.id }
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_id}", calendar_quarter: "2025-Q1", gross_wages_cents: 10000 }
              as: ProgramAdmin
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_id}", calendar_quarter: "2025-Q2", gross_wages_cents: 50000 }
              as: ProgramAdmin
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_id}", calendar_quarter: "2025-Q3", gross_wages_cents: 60000 }
              as: ProgramAdmin
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_id}", calendar_quarter: "2025-Q4", gross_wages_cents: 130000 }
              as: ProgramAdmin
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_id}", calendar_quarter: "2026-Q1", gross_wages_cents: 300000 }
              as: ProgramAdmin
            - call: "POST /ui/claims"
              payload: { claimant_id: "${clmt_id}", filed_date: "2026-04-05" }
              as: Claimant
              as_user_id: "${clmt_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /ui/claims/${claim_id}/submit"
              payload: {}
              as: Claimant
              as_user_id: "${clmt_id}"
          trigger:
            - call: "POST /ui/determinations"
              payload: { claim_id: "${claim_id}", determination_type: "MONETARY" }
              as: Adjudicator
              captures: { det_id: $.data.id }
          assert:
            - "Claim.${claim_id}.base_period_method == ALTERNATE"
            - "Claim.${claim_id}.status == MONETARILY_ELIGIBLE"
            - "Claim.${claim_id}.weekly_benefit_amount_cents == 11500"
            - "Claim.${claim_id}.maximum_benefit_amount_cents == 270000"
            - "Determination.${det_id}.base_period_total_wages_cents == 540000"
            - "Determination.${det_id}.high_quarter_wages_cents == 300000"
            - "Determination.${det_id}.outcome == ALLOWED"

      - name: employer_charge_single_vs_multi_allocation_diverge
        grounds:
          - calculations.employer_charge_allocation
          - entities.EmployerCharge.fields.charge_amount_cents
          - state_machines.WeeklyCertification.UNPAID_to_PAID
        distinguishing_aspect: |
          On the EmployerCharge/Employer-reserve domain (a different entity domain
          from base-period wage calc): the same 11500 paid benefit allocates as a
          single full-amount charge under the single_employer variant but splits via
          largest-remainder into 6389/5111 under the multi_employer variant — two
          valid allocation algorithms, different per-employer charge_amount_cents.
        test_recipe:
          setup:
            - "Claim D (ALTERNATE, WBA 11500, MBA 270000) MONETARILY_ELIGIBLE with TWO base-period employers: X reported 2026-Q1=300000; Y reported 2025-Q4=130000, 2025-Q3=60000, 2025-Q2=50000 (Y base-period total 240000)."
            - "A week filed with no earnings, adjudicated ELIGIBLE."
          setup_api_calls:
            - call: "POST /ui/employers"
              payload: { legal_name: "Emp X", state_account_number: "EX-1", experience_rate: 0.02, reserve_opening_balance_cents: 100000000 }
              as: ProgramAdmin
              captures: { emp_x: $.data.id }
            - call: "POST /ui/employers"
              payload: { legal_name: "Emp Y", state_account_number: "EY-1", experience_rate: 0.05, reserve_opening_balance_cents: 100000000 }
              as: ProgramAdmin
              captures: { emp_y: $.data.id }
            - call: "POST /ui/claimants"
              payload: { full_name: "Cha Lloc", ssn_last4: "2002", date_of_birth: "1988-02-02" }
              as: ProgramAdmin
              captures: { clmt_id: $.data.id }
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_x}", calendar_quarter: "2026-Q1", gross_wages_cents: 300000 }
              as: ProgramAdmin
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_y}", calendar_quarter: "2025-Q4", gross_wages_cents: 130000 }
              as: ProgramAdmin
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_y}", calendar_quarter: "2025-Q3", gross_wages_cents: 60000 }
              as: ProgramAdmin
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_y}", calendar_quarter: "2025-Q2", gross_wages_cents: 50000 }
              as: ProgramAdmin
            - call: "POST /ui/claims"
              payload: { claimant_id: "${clmt_id}", filed_date: "2026-04-05" }
              as: Claimant
              as_user_id: "${clmt_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /ui/claims/${claim_id}/submit"
              payload: {}
              as: Claimant
              as_user_id: "${clmt_id}"
            - call: "POST /ui/determinations"
              payload: { claim_id: "${claim_id}", determination_type: "MONETARY" }
              as: Adjudicator
            - call: "POST /ui/weekly-certifications"
              payload: { claim_id: "${claim_id}", week_ending_date: "2026-04-11", reported_earnings_cents: 0, work_search_waived: true }
              as: Claimant
              as_user_id: "${clmt_id}"
              captures: { wc_id: $.data.id }
            - call: "POST /ui/weekly-certifications/${wc_id}/adjudicate"
              payload: { decision: "ELIGIBLE" }
              as: Adjudicator
          trigger:
            - call: "POST /ui/weekly-certifications/${wc_id}/pay"
              payload: {}
              as: BenefitPaymentOfficer
          assert:
            - "EmployerCharge for employer ${emp_x} on week ${wc_id} has charge_amount_cents == 6389"
            - "EmployerCharge for employer ${emp_y} on week ${wc_id} has charge_amount_cents == 5111"
            - "sum of charge_amount_cents across both EmployerCharge rows == 11500 (== WeeklyCertification.${wc_id}.payable_amount_cents)"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: weekly_payable_nested_min_max_disregard
        grounds:
          - calculations.weekly_payable_amount
          - entities.WeeklyCertification.fields.payable_amount_cents
          - state_machines.WeeklyCertification.UNPAID_to_PAID
        distinguishing_aspect: |
          Mode (a) non-linear interaction of >=3 inputs: payable =
          min(max(0, WBA - max(0, earnings - max(FLOOR, round(WBA*PCT)))),
          remaining_balance) — nested min/max over WBA, reported_earnings, and
          remaining_balance, with the disregard itself a max(floor, pct).
        test_recipe:
          setup:
            - "Claim S (STANDARD, WBA 30000, MBA 780000) MONETARILY_ELIGIBLE."
            - "A week with reported_earnings 20000, adjudicated ELIGIBLE; remaining balance well above gross payable."
          setup_api_calls:
            - call: "POST /ui/employers"
              payload: { legal_name: "Big Co", state_account_number: "BC-1", experience_rate: 0.03, reserve_opening_balance_cents: 100000000 }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /ui/claimants"
              payload: { full_name: "Pay Test", ssn_last4: "3003", date_of_birth: "1985-03-03" }
              as: ProgramAdmin
              captures: { clmt_id: $.data.id }
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_id}", calendar_quarter: "2025-Q4", gross_wages_cents: 780000 }
              as: ProgramAdmin
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_id}", calendar_quarter: "2025-Q3", gross_wages_cents: 360000 }
              as: ProgramAdmin
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_id}", calendar_quarter: "2025-Q2", gross_wages_cents: 360000 }
              as: ProgramAdmin
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_id}", calendar_quarter: "2025-Q1", gross_wages_cents: 300000 }
              as: ProgramAdmin
            - call: "POST /ui/claims"
              payload: { claimant_id: "${clmt_id}", filed_date: "2026-04-05" }
              as: Claimant
              as_user_id: "${clmt_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /ui/claims/${claim_id}/submit"
              payload: {}
              as: Claimant
              as_user_id: "${clmt_id}"
            - call: "POST /ui/determinations"
              payload: { claim_id: "${claim_id}", determination_type: "MONETARY" }
              as: Adjudicator
            - call: "POST /ui/weekly-certifications"
              payload: { claim_id: "${claim_id}", week_ending_date: "2026-04-11", reported_earnings_cents: 20000, work_search_waived: true }
              as: Claimant
              as_user_id: "${clmt_id}"
              captures: { wc_id: $.data.id }
            - call: "POST /ui/weekly-certifications/${wc_id}/adjudicate"
              payload: { decision: "ELIGIBLE" }
              as: Adjudicator
          trigger:
            - call: "POST /ui/weekly-certifications/${wc_id}/pay"
              payload: {}
              as: BenefitPaymentOfficer
          assert:
            - "WeeklyCertification.${wc_id}.payable_amount_cents == 17500"
            - "WeeklyCertification.${wc_id}.payment_status == PAID"
            - "Claim.${claim_id}.remaining_balance_cents == 762500"

      - name: maximum_benefit_amount_rounding_order_pinned
        grounds:
          - calculations.maximum_benefit_amount
          - calculations.weekly_benefit_amount
          - entities.Claim.fields.maximum_benefit_amount_cents
        distinguishing_aspect: |
          Mode (b) order-of-rounding: MBA pins floor_to_dollar(base_total * 0.5)
          BEFORE the min() with WBA*26 — flooring the wage cap first then taking the
          minimum gives 270000, whereas flooring after a different composition would
          differ; the scaffold fixes flooring-then-min so the result is well-defined.
        test_recipe:
          setup:
            - "Claim D (ALTERNATE: base_total 540000, WBA 11500); MBA must be the wage-capped 270000 (= floor(0.5*540000)) which is below the duration cap 11500*26 = 299000."
          setup_api_calls:
            - call: "POST /ui/employers"
              payload: { legal_name: "Acme Co", state_account_number: "EA-2002", experience_rate: 0.034, reserve_opening_balance_cents: 100000000 }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /ui/claimants"
              payload: { full_name: "Mba Round", ssn_last4: "4004", date_of_birth: "1991-04-04" }
              as: ProgramAdmin
              captures: { clmt_id: $.data.id }
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_id}", calendar_quarter: "2025-Q1", gross_wages_cents: 10000 }
              as: ProgramAdmin
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_id}", calendar_quarter: "2025-Q2", gross_wages_cents: 50000 }
              as: ProgramAdmin
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_id}", calendar_quarter: "2025-Q3", gross_wages_cents: 60000 }
              as: ProgramAdmin
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_id}", calendar_quarter: "2025-Q4", gross_wages_cents: 130000 }
              as: ProgramAdmin
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_id}", calendar_quarter: "2026-Q1", gross_wages_cents: 300000 }
              as: ProgramAdmin
            - call: "POST /ui/claims"
              payload: { claimant_id: "${clmt_id}", filed_date: "2026-04-05" }
              as: Claimant
              as_user_id: "${clmt_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /ui/claims/${claim_id}/submit"
              payload: {}
              as: Claimant
              as_user_id: "${clmt_id}"
          trigger:
            - call: "POST /ui/determinations"
              payload: { claim_id: "${claim_id}", determination_type: "MONETARY" }
              as: Adjudicator
          assert:
            - "Claim.${claim_id}.maximum_benefit_amount_cents == 270000"
            - "Claim.${claim_id}.weekly_benefit_amount_cents == 11500"
            - "Claim.${claim_id}.remaining_balance_cents == 270000"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: appeal_remand_cycle_under_review
        grounds:
          - state_machines.Appeal.UNDER_REVIEW_to_REMANDED
          - state_machines.Appeal.REMANDED_to_UNDER_REVIEW
          - entities.Appeal.fields.remand_count
        distinguishing_aspect: |
          Cycle on the Appeal entity: UNDER_REVIEW -> REMANDED -> UNDER_REVIEW loops,
          incrementing remand_count each loop until MAX_REMANDS; the entity returns to
          a prior state, which a purely linear pipeline cannot.
        test_recipe:
          setup:
            - "A MONETARY DENIED Determination exists; an Appeal SUBMITTED then assigned to a referee (UNDER_REVIEW)."
          setup_api_calls:
            - call: "POST /ui/employers"
              payload: { legal_name: "Rem Co", state_account_number: "RC-1", experience_rate: 0.03, reserve_opening_balance_cents: 100000000 }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /ui/claimants"
              payload: { full_name: "Rem And", ssn_last4: "5005", date_of_birth: "1980-05-05" }
              as: ProgramAdmin
              captures: { clmt_id: $.data.id }
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_id}", calendar_quarter: "2025-Q1", gross_wages_cents: 5000 }
              as: ProgramAdmin
            - call: "POST /ui/claims"
              payload: { claimant_id: "${clmt_id}", filed_date: "2026-04-05" }
              as: Claimant
              as_user_id: "${clmt_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /ui/claims/${claim_id}/submit"
              payload: {}
              as: Claimant
              as_user_id: "${clmt_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ui/determinations"
              payload: { claim_id: "${claim_id}", determination_type: "MONETARY" }
              as: Adjudicator
              as_user_id: "adj-77"
              captures: { det_id: $.data.id }
            - call: "POST /ui/appeals"
              payload: { determination_id: "${det_id}", filed_by: "CLAIMANT", filed_date: "2026-04-20" }
              as: Claimant
              as_user_id: "${clmt_id}"
              captures: { appeal_id: $.data.id }
            - call: "POST /ui/appeals/${appeal_id}/assign"
              payload: { assigned_referee_id: "ref-1" }
              as: AppealsClerk
          trigger:
            - call: "POST /ui/appeals/${appeal_id}/remand"
              payload: {}
              as: Referee
            - call: "POST /ui/appeals/${appeal_id}/assign"
              payload: { assigned_referee_id: "ref-2" }
              as: AppealsClerk
          assert:
            - "Appeal.${appeal_id}.status == UNDER_REVIEW"
            - "Appeal.${appeal_id}.remand_count == 1"

      - name: weekly_certification_parallel_axes_independent
        grounds:
          - entities.WeeklyCertification.fields.adjudication_status
          - entities.WeeklyCertification.fields.payment_status
          - state_machines.WeeklyCertification.PAID_to_OFFSET
          - state_machines.WeeklyCertification.UNPAID_to_PAID
        distinguishing_aspect: |
          Parallel dimensions on the WeeklyCertification entity: payment_status moves
          PAID -> OFFSET (via an overpayment recovery) while adjudication_status stays
          ELIGIBLE — two independent state axes evolving on one row, distinct from the
          Appeal cycle's single-axis loop.
        test_recipe:
          setup:
            - "Claim S MONETARILY_ELIGIBLE; one week adjudicated ELIGIBLE and PAID (payable 30000)."
            - "An ESTABLISHED NONFRAUD Overpayment on the claim (principal 30000)."
          setup_api_calls:
            - call: "POST /ui/employers"
              payload: { legal_name: "Par Co", state_account_number: "PC-1", experience_rate: 0.03, reserve_opening_balance_cents: 100000000 }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /ui/claimants"
              payload: { full_name: "Par Allel", ssn_last4: "6006", date_of_birth: "1979-06-06" }
              as: ProgramAdmin
              captures: { clmt_id: $.data.id }
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_id}", calendar_quarter: "2025-Q4", gross_wages_cents: 780000 }
              as: ProgramAdmin
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_id}", calendar_quarter: "2025-Q3", gross_wages_cents: 360000 }
              as: ProgramAdmin
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_id}", calendar_quarter: "2025-Q2", gross_wages_cents: 360000 }
              as: ProgramAdmin
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_id}", calendar_quarter: "2025-Q1", gross_wages_cents: 300000 }
              as: ProgramAdmin
            - call: "POST /ui/claims"
              payload: { claimant_id: "${clmt_id}", filed_date: "2026-04-05" }
              as: Claimant
              as_user_id: "${clmt_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /ui/claims/${claim_id}/submit"
              payload: {}
              as: Claimant
              as_user_id: "${clmt_id}"
            - call: "POST /ui/determinations"
              payload: { claim_id: "${claim_id}", determination_type: "MONETARY" }
              as: Adjudicator
            - call: "POST /ui/weekly-certifications"
              payload: { claim_id: "${claim_id}", week_ending_date: "2026-04-11", reported_earnings_cents: 0, work_search_waived: true }
              as: Claimant
              as_user_id: "${clmt_id}"
              captures: { wc_id: $.data.id }
            - call: "POST /ui/weekly-certifications/${wc_id}/adjudicate"
              payload: { decision: "ELIGIBLE" }
              as: Adjudicator
            - call: "POST /ui/weekly-certifications/${wc_id}/pay"
              payload: {}
              as: BenefitPaymentOfficer
            - call: "POST /ui/overpayments"
              payload: { claim_id: "${claim_id}", cause: "NONFRAUD", principal_cents: 30000 }
              as: Adjudicator
              captures: { op_id: $.data.id, op_v: $.data.version }
          trigger:
            - call: "POST /ui/overpayments/${op_id}/recoveries"
              payload: { recovery_method: "OFFSET", amount_cents: 30000, weekly_certification_id: "${wc_id}", expected_overpayment_version: "${op_v}" }
              as: BenefitPaymentOfficer
          assert:
            - "WeeklyCertification.${wc_id}.payment_status == OFFSET"
            - "WeeklyCertification.${wc_id}.adjudication_status == ELIGIBLE"
            - "Overpayment.${op_id}.status == SATISFIED"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: pay_week_cascades_balance_then_employer_reserve
        grounds:
          - state_machines.WeeklyCertification.UNPAID_to_PAID
          - calculations.weekly_payable_amount
          - calculations.employer_charge_allocation
          - entities.Claim.fields.remaining_balance_cents
          - entities.Employer.fields.reserve_account_balance_cents
        distinguishing_aspect: |
          Depth-3 chain originating from POST /pay: (A) the week -> PAID, which (B)
          debits Claim.remaining_balance_cents, which itself (C) drives creation of
          EmployerCharge rows that (D) debit Employer.reserve_account_balance_cents.
          Each link is caused by the prior link, not directly by the pay action itself.
        test_recipe:
          setup:
            - "Claim D MONETARILY_ELIGIBLE (WBA 11500, MBA 270000); two base-period employers X (300000) and Y (240000), each reserve opening 100000000."
            - "One week with no earnings, adjudicated ELIGIBLE."
          setup_api_calls:
            - call: "POST /ui/employers"
              payload: { legal_name: "Emp X", state_account_number: "EX-2", experience_rate: 0.02, reserve_opening_balance_cents: 100000000 }
              as: ProgramAdmin
              captures: { emp_x: $.data.id }
            - call: "POST /ui/employers"
              payload: { legal_name: "Emp Y", state_account_number: "EY-2", experience_rate: 0.05, reserve_opening_balance_cents: 100000000 }
              as: ProgramAdmin
              captures: { emp_y: $.data.id }
            - call: "POST /ui/claimants"
              payload: { full_name: "Cas Cade", ssn_last4: "7007", date_of_birth: "1987-07-07" }
              as: ProgramAdmin
              captures: { clmt_id: $.data.id }
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_x}", calendar_quarter: "2026-Q1", gross_wages_cents: 300000 }
              as: ProgramAdmin
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_y}", calendar_quarter: "2025-Q4", gross_wages_cents: 130000 }
              as: ProgramAdmin
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_y}", calendar_quarter: "2025-Q3", gross_wages_cents: 60000 }
              as: ProgramAdmin
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_y}", calendar_quarter: "2025-Q2", gross_wages_cents: 50000 }
              as: ProgramAdmin
            - call: "POST /ui/claims"
              payload: { claimant_id: "${clmt_id}", filed_date: "2026-04-05" }
              as: Claimant
              as_user_id: "${clmt_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /ui/claims/${claim_id}/submit"
              payload: {}
              as: Claimant
              as_user_id: "${clmt_id}"
            - call: "POST /ui/determinations"
              payload: { claim_id: "${claim_id}", determination_type: "MONETARY" }
              as: Adjudicator
            - call: "POST /ui/weekly-certifications"
              payload: { claim_id: "${claim_id}", week_ending_date: "2026-04-11", reported_earnings_cents: 0, work_search_waived: true }
              as: Claimant
              as_user_id: "${clmt_id}"
              captures: { wc_id: $.data.id }
