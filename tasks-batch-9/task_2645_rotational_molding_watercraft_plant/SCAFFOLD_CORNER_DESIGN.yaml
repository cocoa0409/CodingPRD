            - "MoldingCycle.${cyc_b} after the restore: status STILL 'ABORTED' with abort_reason 'STATION_DOWN' and version STILL 3 — restore explicitly does not resurrect aborted cycles"
            - "the replacement cycle on arm 2 at 12:00:00Z: 201, and its mold_id == '${mold_b}' — MLD-SM-CSD-A is excluded because start-oven left it IN_CYCLE, while B is AVAILABLE and free over the new half-open span"
            - "ProductionOrder.${po}.version == 5 after the replacement create — a fresh version was captured for the OCC input, so no 412 was possible"

      # -------------------------------------- Side effect pattern: Conditional cascade
      - name: sm_conditional_cascade_clock_advance_expires_a_lot_only_strictly_after_expires_on
        claim_type: "Side effect pattern: Conditional cascade"
        grounds:
          - state_machines.ResinLot.AVAILABLE_to_EXPIRED
          - state_machines.MoldingCycle.SCHEDULED_to_ABORTED
          - state_machines.ResinCharge.RESERVED_to_RELEASED
          - state_machines.ProductionOrder.IN_PRODUCTION_to_BLOCKED_RESIN
          - endpoints.POST_/_clock/set_current_utc
          - validations[priority=34]
        distinguishing_aspect: "Advancing the clock to exactly the lot's expires_on fires nothing (all four cascade counters read 0), advancing it one day further fires CASCADE-G links 2-5 in one call (counters 1/1/1/1) reaching only the RESERVED charge and only the SCHEDULED cycle, and a third advance fires nothing again because the lot is already EXPIRED."
        test_recipe:
          setup:
            - "LOT-SM-CCG is the ONLY lot qualified for model PM-SM-CCG and carries expires_on '2026-08-05', so the clock steps land on, past and beyond the boundary in that order."
            - "Two cycles draw on it: CYC-A (oven 2026-08-01 09:00-10:00) is STARTED so its charge is CONSUMED and it sits in OVEN_RUNNING, and CYC-B (oven 2026-08-10 09:00-10:00, a disjoint mould span nine days later) is left SCHEDULED with its charge RESERVED."
            - "At the moment of the first clock step the lot reads available 452.000 / reserved 24.000 / consumed 24.000 and the order is IN_PRODUCTION with two accepted cycles against ordered_qty 3."
            - "Every clock step moves strictly forward, so the 'never rolled backward past a recorded actual timestamp' rule is never engaged; CYC-A's recorded actual_oven_start_at stays in the past."
