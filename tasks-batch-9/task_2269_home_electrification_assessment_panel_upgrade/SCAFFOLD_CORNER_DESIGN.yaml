          Stage E (prerequisite) reads Stage D's (capacity) verdict, not merely
          the proposed measure list. HP-DUCT-01 needs only 100 A and IS
          proposed alongside its prerequisite HP-HVAC-01, yet it is
          disqualified PREREQUISITE_MISSING because that prerequisite lost
          Stage D on a 100 A panel. Every line then fails, so approving the
          assessment returns 409 ERR_NO_ELIGIBLE_MEASURES.
        test_recipe:
          setup:
            - "One OPEN program with HP-HVAC-01 (required_panel_capacity_amps 200, anchor, sort 10) and HP-DUCT-01 (HVAC_GROUP, unit 200000, cap 200000, required_panel_capacity_amps 100, prerequisite_measure_code HP-HVAC-01, sort 20)."
            - "A LOW-tier household whose existing panel is only 100 A, and an ENROLLED_ACTIVE contractor."
            - "No panel-upgrade item is proposed, so Stage C leaves effective_panel_amps at 100."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026 Cascading Checks", state_code: "CO", budget_total_cents: 50000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
