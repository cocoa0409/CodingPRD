        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[app-update-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH /apps/{id} with expected_app_version one behind the current version fails 412 ERR_STALE_VERSION; with the current version it succeeds and bumps version."
        test_recipe:
          setup: ["app aCC1 DRAFT at version 1; capture its version"]
          setup_api_calls:
            - call: "POST /developers"
              payload: { company_name: "DCC1", contact_email: "dcc1@x.com", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { dcc1_id: $.data.id }
            - call: "POST /apps"
              payload: { developer_id: "${dcc1_id}", name: "AppCC1", category: "PRODUCTIVITY" }
              as: Developer
              as_user_id: "${dcc1_id}"
              captures: { acc1_id: $.data.id, acc1_v: $.data.version }
          trigger:
            - call: "PATCH /apps/${acc1_id}"
              payload: { name: "AppCC1-renamed", expected_app_version: "${acc1_v}" }
              as: Developer
              as_user_id: "${dcc1_id}"
              captures: { acc1_v2: $.data.version }
            - call: "PATCH /apps/${acc1_id}"
              payload: { name: "AppCC1-stale", expected_app_version: "${acc1_v}" }
              as: Developer
              as_user_id: "${dcc1_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "First PATCH succeeds and version increments to 2"
            - "Second PATCH with the stale version fails error_id == 'ERR_STALE_VERSION' (412)"
      - name: cascading_charge_reversal_updates_invoice_total
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers, state_machines.AppBillingCharge.INVOICED_to_REVERSED]
        excluded_because:
          difficulty_instance: compensating_invariant / charge_reverse_restores_invoice_total_and_lifetime_gross
          rationale: "The reversal cascade and derived-field reconciliation are asserted end-to-end by the named §1.8 instance."
      - name: derived_invoice_total_after_decline_excluded
        claim_type: derived_field_reconciliation
        grounds: [calculations.invoice_total]
        excluded_because:
          difficulty_instance: combinatorial_formula / usage_proration_aggregation_over_mixed_charges
          rationale: "invoice_total correctness over a mixed charge set is asserted by the named §1.8 instance."

  - section: consistency_model
    instances:
      - name: immediate_consistency_invoice_total_in_issue_response
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, calculations.invoice_total]
        distinguishing_aspect: "The issue response itself carries the recomputed total_cents — no re-read needed (immediate consistency)."
        test_recipe:
          setup: ["merchant mIM1 with OPEN invoice invIM1 and one APPROVED charge 2500"]
          setup_api_calls:
            - call: "POST /developers"
              payload: { company_name: "DIM1", contact_email: "dim1@x.com", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { dim1_id: $.data.id }
            - call: "POST /apps"
              payload: { developer_id: "${dim1_id}", name: "AppIM1", category: "MARKETING" }
              as: Developer
              as_user_id: "${dim1_id}"
              captures: { aim1_id: $.data.id }
            - call: "POST /apps/${aim1_id}/versions"
              payload: { semver: "1.0.0" }
              as: Developer
              as_user_id: "${dim1_id}"
              captures: { vim1_id: $.data.id }
            - call: "POST /apps/${aim1_id}/submit"
              payload: {}
              as: Developer
              as_user_id: "${dim1_id}"
            - call: "POST /app-versions/${vim1_id}/approve"
              payload: { reviewer_id: "rev-1" }
              as: Reviewer
            - call: "POST /apps/${aim1_id}/publish"
              payload: {}
              as: Developer
              as_user_id: "${dim1_id}"
            - call: "POST /merchants"
              payload: { shop_domain: "mim1.myshop.com", plan_tier: "BASIC" }
              as: PlatformAdmin
              captures: { mim1_id: $.data.id }
            - call: "POST /installations"
              payload: { app_id: "${aim1_id}", merchant_id: "${mim1_id}" }
              as: Merchant
              as_user_id: "${mim1_id}"
              captures: { instim1_id: $.data.id }
            - call: "POST /installations/${instim1_id}/consent"
              payload: {}
              as: Merchant
              as_user_id: "${mim1_id}"
            - call: "POST /installations/${instim1_id}/billing-charges"
              payload: { charge_type: "ONE_TIME", base_amount_cents: 2500, description: "imm" }
              as: Developer
              as_user_id: "${dim1_id}"
              captures: { cim1_id: $.data.id }
            - call: "POST /billing-charges/${cim1_id}/approve"
              payload: {}
              as: Merchant
              as_user_id: "${mim1_id}"
            - call: "POST /merchants/${mim1_id}/invoices"
              payload: { cycle: "2026-09" }
              as: PlatformAdmin
              captures: { invim1_id: $.data.id, invim1_v: $.data.version }
          trigger:
            - call: "POST /invoices/${invim1_id}/issue"
              payload: { expected_invoice_version: "${invim1_v}" }
              as: PlatformAdmin
              captures: { invim1_total: $.data.total_cents, invim1_status: $.data.status }
          assert:
            - "issue response data.total_cents == 2500 in the SAME response"
            - "issue response data.status == 'ISSUED'"
