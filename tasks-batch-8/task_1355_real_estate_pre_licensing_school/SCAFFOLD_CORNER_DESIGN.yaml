  # --------------------------------------------------------- calculations ---
  - section: calculations
    instances:
      - name: cn_late_fee_boundary_and_cap
        claim_type: constants_applied
        grounds: ["calculations.late_fee_cents", "entities.CreditReport.fields.late_fee_cents"]
        distinguishing_aspect: "Threshold edges: submit exactly on the deadline yields late_days 0 and fee 0; 3 days late yields 8000; 45 days late hits the cap exactly (5000 + 1000*45 == 50000)."
        test_recipe:
          setup: ["LICENSED school; three base reports for disjoint periods 2026-09, 2026-10, 2026-11 (deadlines 2026-10-30, 2026-11-30, 2026-12-30); no certificates (empty line_items)"]
          setup_api_calls:
            - { call: "POST /schools", payload: { school_name: "Lone Star Realty School", school_code: "LSRS", home_state_code: "TX" }, as: SchoolDirector, captures: { sch: $.data.id } }
            - { call: "POST /schools/${sch}/license", as: StateCommission }
            - { call: "POST /credit-reports", payload: { school_id: "${sch}", period_start: "2026-09-01", period_end: "2026-09-30" }, as: ComplianceOfficer, captures: { r1: $.data.id } }
            - { call: "POST /credit-reports", payload: { school_id: "${sch}", period_start: "2026-10-01", period_end: "2026-10-31" }, as: ComplianceOfficer, captures: { r2: $.data.id } }
            - { call: "POST /credit-reports", payload: { school_id: "${sch}", period_start: "2026-11-01", period_end: "2026-11-30" }, as: ComplianceOfficer, captures: { r3: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-30T12:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /credit-reports/${r1}/submit", as: ComplianceOfficer, captures: { d1: $.data.late_days, f1: $.data.late_fee_cents } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-03T12:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /credit-reports/${r2}/submit", as: ComplianceOfficer, captures: { d2: $.data.late_days, f2: $.data.late_fee_cents } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-02-13T12:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /credit-reports/${r3}/submit", as: ComplianceOfficer, captures: { d3: $.data.late_days, f3: $.data.late_fee_cents } }
          assert:
            - "r1 submitted on deadline 2026-10-30: late_days == 0 and late_fee_cents == 0"
            - "r2 submitted 2026-12-03 (deadline 2026-11-30): late_days == 3 and late_fee_cents == 8000"
            - "r3 submitted 2027-02-13 (deadline 2026-12-30): late_days == 45 and late_fee_cents == 50000 (cap binds exactly)"

      - name: cn_report_line_rounding_per_line_then_sum
        claim_type: precision
        grounds: ["calculations.credit_report_line_totals", "entities.CreditReport.fields.total_credit_hours"]
        distinguishing_aspect: "Rounding order pinned per-line: CE hours 7.24 and 0.24 round to 7.0 and 0.0 BEFORE summing (total 7.0); summing raw (7.48) then rounding would give 7.5."
        test_recipe:
          setup: ["LICENSED school; two CE courses (ce_credit_hours 7.24 and 0.24, required 60); two students each COMPLETED with certificates issued at clock default 2026-08-01"]
          setup_api_calls:
            - { call: "POST /schools", payload: { school_name: "Lone Star Realty School", school_code: "LSRS", home_state_code: "TX" }, as: SchoolDirector, captures: { sch: $.data.id } }
            - { call: "POST /schools/${sch}/license", as: StateCommission }
            - { call: "POST /courses", payload: { school_id: "${sch}", course_code: "CE-A", title: "CE Alpha", course_type: "CONTINUING_ED", required_seat_minutes: 60, tuition_cents: 10000, pass_score_pct: 70, completion_deadline_days: 30, ce_credit_hours: 7.24 }, as: SchoolDirector, captures: { crsA: $.data.id } }
            - { call: "POST /courses/${crsA}/approvals", payload: { state_code: "TX" }, as: ComplianceOfficer, captures: { capA: $.data.id } }
            - { call: "POST /approvals/${capA}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /courses/${crsA}/activate", as: SchoolDirector }
            - { call: "POST /courses", payload: { school_id: "${sch}", course_code: "CE-B", title: "CE Beta", course_type: "CONTINUING_ED", required_seat_minutes: 60, tuition_cents: 10000, pass_score_pct: 70, completion_deadline_days: 30, ce_credit_hours: 0.24 }, as: SchoolDirector, captures: { crsB: $.data.id } }
            - { call: "POST /courses/${crsB}/approvals", payload: { state_code: "TX" }, as: ComplianceOfficer, captures: { capB: $.data.id } }
            - { call: "POST /approvals/${capB}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /courses/${crsB}/activate", as: SchoolDirector }
