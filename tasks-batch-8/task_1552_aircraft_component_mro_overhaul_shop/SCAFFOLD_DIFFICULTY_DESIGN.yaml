  # =========================================================================
  # Rule 8 — temporal overlap with DIFFERENT interval semantics on different resources
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: test_cell_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - validations[priority=9]
          - entities.TestCellBooking.fields.start_time
        distinguishing_aspect: |
          Resource TestCell, HALF-OPEN semantics [start,end): a booking starting exactly when
          another ends (14:00 == 14:00) shares no instant and is accepted; shifting one hour
          earlier into the window is rejected ERR_TEST_CELL_OVERLAP.
        test_recipe:
          setup:
            - "Work order READY_FOR_TEST; cell CELL-A; booking B1 [2026-08-03T10:00:00Z, 2026-08-03T14:00:00Z) already BOOKED"
          setup_api_calls:
            - { call: "POST /mro/customers", payload: { name: "AeroAir", certificate_number: "AIR-001", contract_tat_hours: 100, tat_penalty_rate_cents_per_hour: 5000, tat_penalty_cap_pct: 50, credit_limit_cents: 1000000000 }, as: ShopManager, captures: { c_id: $.data.id } }
            - { call: "POST /mro/part-catalog", payload: { part_number: "PN-32-ACT", ata_chapter: "32", is_rotable: true, cmm_reference: "CMM-32-11-01", replacement_value_cents: 10000000, warranty_cycle_limit: 500, warranty_month_limit: 24, flat_overhaul_price_cents: 2000000 }, as: ShopManager, captures: { p_id: $.data.id } }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-U1", ownership: "CUSTOMER", owner_customer_id: "${c_id}", condition_status: "UNSERVICEABLE", custody_status: "OFF_SITE", total_cycles: 4800, cycles_since_overhaul: 300, manufactured_at: "2015-06-01" }, as: CustomerServiceRep, captures: { u1: $.data.id } }
            - { call: "POST /mro/work-orders", payload: { customer_id: "${c_id}", unit_id: "${u1}", work_scope: "OVERHAUL" }, as: CustomerServiceRep, captures: { wo: $.data.id } }
            - { call: "POST /mro/work-orders/${wo}/teardown-complete", payload: {}, as: Technician }
            - { call: "POST /mro/work-orders/${wo}/quote", payload: { labor_estimate_cents: 2000000, parts_estimate_cents: 1000000, scrap_option_ack: false }, as: CustomerServiceRep, captures: { v_q: $.data.version } }
            - { call: "POST /mro/work-orders/${wo}/quote-approval", payload: { expected_work_order_version: "${v_q}" }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /mro/work-orders/${wo}/complete-repair", payload: {}, as: Technician, as_user_id: "tech-1" }
            - { call: "POST /mro/test-cells", payload: { name: "CELL-A", supported_ata_chapters: ["32"], hourly_rate_cents: 100000 }, as: ShopManager, captures: { cell_id: $.data.id } }
            - { call: "POST /mro/test-cells/${cell_id}/bookings", payload: { work_order_id: "${wo}", start_time: "2026-08-03T10:00:00Z", end_time: "2026-08-03T14:00:00Z" }, as: CustomerServiceRep, captures: { bk1: $.data.id } }
          trigger:
            - { call: "POST /mro/test-cells/${cell_id}/bookings", payload: { work_order_id: "${wo}", start_time: "2026-08-03T14:00:00Z", end_time: "2026-08-03T18:00:00Z" }, as: CustomerServiceRep, captures: { bk2: $.data.id, bk2_fee: $.data.fee_cents } }
            - { call: "POST /mro/test-cells/${cell_id}/bookings", payload: { work_order_id: "${wo}", start_time: "2026-08-03T13:00:00Z", end_time: "2026-08-03T15:00:00Z" }, as: CustomerServiceRep, captures: { err: $.data.error_id } }
          assert:
            - "Adjacent booking accepted: bk2 created (14:00 start touches 14:00 end without overlap under half-open semantics), bk2_fee == 400000"
            - "err == 'ERR_TEST_CELL_OVERLAP' with HTTP 409 for [13:00,15:00) which straddles both existing windows"
      - name: lease_day_closed_boundary_day_conflicts
        grounds:
          - validations[priority=11]
          - entities.LeaseAgreement.fields.end_date
          - concurrency_rules[lease-create-stale-unit]
        distinguishing_aspect: |
          Resource ComponentUnit, DAY-CLOSED semantics [start_date, end_date] (different
          resource AND different interval semantics than the half-open cell windows): a new
          lease starting on the existing lease's last day (2026-08-14 vs [08-10, 08-14]) SHARES
          that calendar day and is rejected; the following day is free.
        test_recipe:
          setup:
            - "SHOP pool unit SN-L1 (SERVICEABLE/IN_POOL); customer C; lease L1 ACTIVE for [2026-08-10, 2026-08-14] at 100000 cents/day"
          setup_api_calls:
            - { call: "POST /mro/customers", payload: { name: "AeroAir", certificate_number: "AIR-001", contract_tat_hours: 100, tat_penalty_rate_cents_per_hour: 5000, tat_penalty_cap_pct: 50, credit_limit_cents: 1000000000 }, as: ShopManager, captures: { c_id: $.data.id } }
            - { call: "POST /mro/part-catalog", payload: { part_number: "PN-32-ACT", ata_chapter: "32", is_rotable: true, cmm_reference: "CMM-32-11-01", replacement_value_cents: 10000000, warranty_cycle_limit: 500, warranty_month_limit: 24, flat_overhaul_price_cents: 2000000 }, as: ShopManager, captures: { p_id: $.data.id } }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-L1", ownership: "SHOP", condition_status: "SERVICEABLE", custody_status: "IN_POOL", total_cycles: 3000, cycles_since_overhaul: 50, manufactured_at: "2014-03-01" }, as: CustomerServiceRep, captures: { u_l: $.data.id } }
            - { call: "GET /mro/units/${u_l}", payload: {}, as: CustomerServiceRep, captures: { u_v1: $.data.version } }
            - { call: "POST /mro/lease-agreements", payload: { customer_id: "${c_id}", unit_id: "${u_l}", start_date: "2026-08-10", end_date: "2026-08-14", daily_rate_cents: 100000, expected_unit_version: "${u_v1}" }, as: CustomerServiceRep, captures: { ls1: $.data.id } }
            - { call: "GET /mro/units/${u_l}", payload: {}, as: CustomerServiceRep, captures: { u_v2: $.data.version } }
          trigger:
            - { call: "POST /mro/lease-agreements", payload: { customer_id: "${c_id}", unit_id: "${u_l}", start_date: "2026-08-14", end_date: "2026-08-20", daily_rate_cents: 100000, expected_unit_version: "${u_v2}" }, as: CustomerServiceRep, captures: { err: $.data.error_id } }
            - { call: "POST /mro/lease-agreements", payload: { customer_id: "${c_id}", unit_id: "${u_l}", start_date: "2026-08-15", end_date: "2026-08-20", daily_rate_cents: 100000, expected_unit_version: "${u_v2}" }, as: CustomerServiceRep, captures: { ls3: $.data.id, ls3_st: $.data.status } }
          assert:
            - "err == 'ERR_LEASE_PERIOD_OVERLAP' with HTTP 409 (shared boundary day 2026-08-14 conflicts under closed semantics)"
            - "Rejected create did NOT bump the unit version: the subsequent create with the same expected_unit_version ${u_v2} succeeds (ls3_st == 'ACTIVE')"
            - "GET /mro/lease-agreements?unit_id=${u_l} returns total_count 2"

  # =========================================================================
  # Rule 9 — compensating invariants over DIFFERENT conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: pool_depth_plus_open_exchange_obligations_conserved
        grounds:
          - state_machines.ExchangeAgreement.OPEN_to_FULFILLED
          - state_machines.ExchangeAgreement.FULFILLED_to_CLOSED
          - calculations.pool_unit_selector
        distinguishing_aspect: |
          Conserved quantity: physical pool depth — count(SHOP units of part P with custody
          IN_POOL and condition SERVICEABLE) + count(FULFILLED exchange obligations for P).
          fulfill moves one unit out (1+0 -> 0+1); its compensating NON_BER core-return
          replenishes the pool (0+1 -> 1+0); the sum is 1 at every checkpoint.
        test_recipe:
          setup:
            - "Part PN-32-ACT; exactly one pool unit SN-P1 (cycles_since_overhaul 50); customer core SN-C1; exchange agreement OPEN"
          setup_api_calls:
            - { call: "POST /mro/customers", payload: { name: "AeroAir", certificate_number: "AIR-001", contract_tat_hours: 100, tat_penalty_rate_cents_per_hour: 5000, tat_penalty_cap_pct: 50, credit_limit_cents: 1000000000 }, as: ShopManager, captures: { c_id: $.data.id } }
            - { call: "POST /mro/part-catalog", payload: { part_number: "PN-32-ACT", ata_chapter: "32", is_rotable: true, cmm_reference: "CMM-32-11-01", replacement_value_cents: 10000000, warranty_cycle_limit: 500, warranty_month_limit: 24, flat_overhaul_price_cents: 2000000 }, as: ShopManager, captures: { p_id: $.data.id } }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-P1", ownership: "SHOP", condition_status: "SERVICEABLE", custody_status: "IN_POOL", total_cycles: 3000, cycles_since_overhaul: 50, manufactured_at: "2014-03-01" }, as: CustomerServiceRep, captures: { u_pool: $.data.id } }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-C1", ownership: "CUSTOMER", owner_customer_id: "${c_id}", condition_status: "UNSERVICEABLE", custody_status: "OFF_SITE", total_cycles: 7000, cycles_since_overhaul: 900, manufactured_at: "2012-05-01" }, as: CustomerServiceRep, captures: { u_core: $.data.id } }
            - { call: "POST /mro/exchange-agreements", payload: { customer_id: "${c_id}", part_id: "${p_id}" }, as: CustomerServiceRep, captures: { ex: $.data.id } }
          trigger:
            - { call: "POST /mro/exchange-agreements/${ex}/fulfill", payload: {}, as: CustomerServiceRep, captures: { pool_unit: $.data.pool_unit_id, due: $.data.core_due_date } }
            - { call: "GET /mro/units?part_id=${p_id}&ownership=SHOP&custody_status=IN_POOL&condition_status=SERVICEABLE", payload: {}, as: ShopManager }
            - { call: "POST /mro/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: ShopManager }
            - { call: "POST /mro/exchange-agreements/${ex}/core-return", payload: { core_unit_id: "${u_core}", core_teardown_estimate_cents: 1000000 }, as: Technician }
            - { call: "GET /mro/units?part_id=${p_id}&ownership=SHOP&custody_status=IN_POOL&condition_status=SERVICEABLE", payload: {}, as: ShopManager }
            - { call: "GET /mro/exchange-agreements?part_id=${p_id}&status=FULFILLED", payload: {}, as: ShopManager }
          assert:
            - "Before fulfill: pool depth 1 + FULFILLED obligations 0 == 1"
            - "After fulfill: pool depth 0 + obligations 1 == 1 (pool_unit == ${u_pool}, due == '2026-08-16')"
            - "After NON_BER core-return: pool depth 1 + obligations 0 == 1 — the pair of actions conserves the quantity exactly (no drift)"
      - name: customer_exposure_conserved_across_issue_and_pay
        grounds:
          - calculations.credit_exposure_calc
          - state_machines.Invoice.ISSUED_to_PAID
        distinguishing_aspect: |
          Conserved quantity: monetary exposure — Customer.current_exposure_cents. Issuing the
          work-order invoice debits it by exactly total_cents; paying the same invoice is the
          compensating action and returns exposure to its pre-issue baseline of 0.
        test_recipe:
          setup:
            - "OVERHAUL work order without parts released inside TAT (labor 2000000 + one 4h booking 400000, no penalty); invoice not yet generated"
          setup_api_calls:
            - { call: "POST /mro/customers", payload: { name: "AeroAir", certificate_number: "AIR-001", contract_tat_hours: 100, tat_penalty_rate_cents_per_hour: 5000, tat_penalty_cap_pct: 50, credit_limit_cents: 1000000000 }, as: ShopManager, captures: { c_id: $.data.id } }
            - { call: "POST /mro/part-catalog", payload: { part_number: "PN-32-ACT", ata_chapter: "32", is_rotable: true, cmm_reference: "CMM-32-11-01", replacement_value_cents: 10000000, warranty_cycle_limit: 500, warranty_month_limit: 24, flat_overhaul_price_cents: 2000000 }, as: ShopManager, captures: { p_id: $.data.id } }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-U1", ownership: "CUSTOMER", owner_customer_id: "${c_id}", condition_status: "UNSERVICEABLE", custody_status: "OFF_SITE", total_cycles: 4800, cycles_since_overhaul: 300, manufactured_at: "2015-06-01" }, as: CustomerServiceRep, captures: { u1: $.data.id } }
            - { call: "POST /mro/work-orders", payload: { customer_id: "${c_id}", unit_id: "${u1}", work_scope: "OVERHAUL" }, as: CustomerServiceRep, captures: { wo: $.data.id } }
            - { call: "POST /mro/work-orders/${wo}/teardown-complete", payload: {}, as: Technician }
            - { call: "POST /mro/work-orders/${wo}/quote", payload: { labor_estimate_cents: 2000000, parts_estimate_cents: 1000000, scrap_option_ack: false }, as: CustomerServiceRep, captures: { v_q: $.data.version } }
            - { call: "POST /mro/work-orders/${wo}/quote-approval", payload: { expected_work_order_version: "${v_q}" }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /mro/work-orders/${wo}/complete-repair", payload: {}, as: Technician, as_user_id: "tech-1" }
            - { call: "POST /mro/test-cells", payload: { name: "CELL-A", supported_ata_chapters: ["32"], hourly_rate_cents: 100000 }, as: ShopManager, captures: { cell_id: $.data.id } }
            - { call: "POST /mro/test-cells/${cell_id}/bookings", payload: { work_order_id: "${wo}", start_time: "2026-08-02T01:00:00Z", end_time: "2026-08-02T05:00:00Z" }, as: CustomerServiceRep }
            - { call: "POST /mro/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T02:00:00Z" }, as: ShopManager }
            - { call: "POST /mro/work-orders/${wo}/test-results", payload: { result: "PASS", atp_reference: "ATP-1" }, as: Inspector, as_user_id: "insp-9" }
            - { call: "POST /mro/work-orders/${wo}/release", payload: {}, as: Inspector, as_user_id: "insp-9" }
          trigger:
            - { call: "POST /mro/work-orders/${wo}/invoice", payload: {}, as: CustomerServiceRep, captures: { inv: $.data.id, tot: $.data.total_cents } }
            - { call: "GET /mro/customers/${c_id}", payload: {}, as: ShopManager, captures: { expo_mid: $.data.current_exposure_cents } }
            - { call: "POST /mro/invoices/${inv}/pay", payload: { amount_cents: 2400000 }, as: Customer, as_user_id: "${c_id}", captures: { pay_st: $.data.status } }
            - { call: "GET /mro/customers/${c_id}", payload: {}, as: ShopManager, captures: { expo_end: $.data.current_exposure_cents, hold_end: $.data.credit_hold } }
          assert:
            - "tot == 2400000 (2000000 + 0 + 400000, penalty 0) and expo_mid == 2400000 (issue debits exactly total)"
            - "pay_st == 'PAID' and expo_end == 0 — equals the pre-issue baseline; the ISSUED+PAID pair conserves exposure"
            - "hold_end == false and invariant holds: exposure == sum of ISSUED invoice totals (empty set -> 0)"
