            - call: "POST /airhub/buildups/${bd_id}/seal"
              payload: { expected_buildup_version: "${bd_v_post}" }
              as: LoadPlanner
              captures: { err_under_capacity: $.data.error_id }
          assert:
            - "the zero-tolerance meeting is admitted: ${seal_at_limit} == SEALED at rated_weight_grams 100000 against container_limit_grams 100000"
            - "after onboard the 100100-gram package the buildup reads rated_weight_grams 200100"
            - "the overshoot is refused on the other side: ${err_under_capacity} == ERR_BUILDUP_UNDER_CAPACITY"
            - "Buildup.${bd_id}.status == WEIGHT_BREACH, so the overshoot also flipped the breach state (200100 - 100000 == 100100 > 25000)"
            - "requires_container is true and 100000 >= 100000 - 5000, so the fill tolerance is satisfied and the first seal is not the fill gate failing"

      - name: ground_feeder_turnout_point_touching_intervals_and_departure_ceiling
        grounds:
          - state_machines.GroundFeeder.transitions.SCHEDULED_to_STAGING
          - calculations.feeder_stage_load
          - errors.ERR_FEEDER_WINDOW_CONFLICT
          - errors.ERR_FEEDER_OVER_CAPACITY
          - endpoints.POST_/airhub/feeders/{feeder_id}/begin-staging
        distinguishing_aspect: "Second interval semantics, different resource and different arithmetic: feeder turnout windows are CLOSED-OPEN intervals on a capacity resource, so two feeders whose declared departure minutes differ by exactly window_minutes are REJECTED as overlapping (x + W is the first open instant) and admitted at x + W + 1, and a load exactly at stage_capacity_grams stages fine but breaches the 95% departure ceiling."
        test_recipe:
          setup:
            - "Clock 1400. SDF hub with alternate IND, lane P-01 and S-01, BANK_A with N701UP landed and unloaded, shift N-A, feeders F1 (scheduled 1420, window 10, capacity 100000), F2 (scheduled 1430, window 10), F3 (scheduled 1431, window 10), and GENERAL packages rated 100000 and 90000 grams."
          setup_api_calls:
            - *k_clock
            - *k_alt_hub
            - *k_hub
            - *k_lane_p1
            - *k_lane_s1
            - *k_bank
            - *k_ac1
            - *k_shift
            - *k_clock1400
            - *k_ac1_depart
            - *k_ac1_land
            - *k_bank_unload
            - *k_ac1_begun
            - *k_ac1_done
            - call: "POST /airhub/feeders"
              payload: { hub_id: "${hub_id}", feeder_code: "F-1", origin_station_code: "LEX", scheduled_departure_minutes: 1420, stage_capacity_grams: 100000, window_minutes: 10 }
              as: FeederCoordinator
              captures: { f1_id: $.data.id }
            - call: "POST /airhub/feeders"
              payload: { hub_id: "${hub_id}", feeder_code: "F-2", origin_station_code: "BNA", scheduled_departure_minutes: 1430, stage_capacity_grams: 100000, window_minutes: 10 }
              as: FeederCoordinator
              captures: { f2_id: $.data.id }
            - call: "POST /airhub/feeders"
              payload: { hub_id: "${hub_id}", feeder_code: "F-3", origin_station_code: "CVG", scheduled_departure_minutes: 1431, stage_capacity_grams: 100000, window_minutes: 10 }
              as: FeederCoordinator
              captures: { f3_id: $.data.id }
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-G-0001", commodity_class: "GENERAL", destination_hub_code: "LEX", service_level: "GROUND", planned_weight_grams: 100000, dimension_weight_grams: 100000 }
              as: SortOperator
              captures: { pkg_g1: $.data.id }
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-G-0002", commodity_class: "GENERAL", destination_hub_code: "LEX", service_level: "GROUND", planned_weight_grams: 90000, dimension_weight_grams: 90000 }
              as: SortOperator
              captures: { pkg_g2: $.data.id }
            - call: "POST /airhub/feeders/${f1_id}/begin-staging"
              payload: {}
              as: FeederCoordinator
              captures: { f1_status: $.data.status }
          trigger:
            - call: "POST /airhub/feeders/${f2_id}/begin-staging"
              payload: {}
              as: FeederCoordinator
              captures: { err_conflict_touch: $.data.error_id }
            - call: "POST /airhub/feeders/${f1_id}/stage-package"
              payload: { package_id: "${pkg_g1}" }
              as: FeederCoordinator
            - call: "POST /airhub/feeders/${f1_id}/begin-loading"
              payload: {}
              as: FeederCoordinator
            - call: "POST /airhub/feeders/${f1_id}/depart"
              payload: {}
              as: FeederCoordinator
              captures: { err_over_capacity: $.data.error_id }
            - call: "POST /airhub/feeders/${f2_id}/cancel"
              payload: {}
              as: FeederCoordinator
            - call: "POST /airhub/feeders/${f1_id}/cancel"
              payload: {}
              as: FeederCoordinator
            - call: "POST /airhub/feeders/${f3_id}/begin-staging"
              payload: {}
              as: FeederCoordinator
              captures: { f3_status: $.data.status }
          assert:
            - "the adjacent window is refused: ${err_conflict_touch} == ERR_FEEDER_WINDOW_CONFLICT with departures 1420 and 1430 and window 10 (1420 + 10 == 1430, the first open instant)"
            - "the one-minute-earlier case would have been admitted, so the interval is closed-open"
            - "F-1 staged at ${f1_status} == STAGING with staged_weight_grams 100000, exactly stage_capacity_grams"
            - "the departure is refused on the tighter ceiling: ${err_over_capacity} == ERR_FEEDER_OVER_CAPACITY because 100000 > floor(100000 * 0.95) == 95000"
            - "the same 100000-gram load is compliant while staging and non-compliant at departure, so the two capacity numbers are genuinely different"
            - "the feeder after the gap opens normally: ${f3_status} == STAGING at departure 1431"
            - "GroundFeeder.${f1_id}.status == CANCELLED and staged_weight_grams == 0 after the release"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: money_back_refund_void_restores_hub_live_volume_invariant
        grounds:
          - state_machines.ServiceFailure.transitions.OPEN_to_VOIDED
          - state_machines.Package.transitions.DOWNGRADED_to_COMMITTED
          - calculations.live_planned_package_total
          - validations[priority=11]
          - endpoints.POST_/airhub/failures/{failure_id}/void
        distinguishing_aspect: "A mass invariant over Package.planned_weight_grams: a downgrade paired with its compensating void must leave hub.live_planned_package_total EXACTLY at its pre-sequence value, and the invariant is genuinely non-trivial because an identical sequence that carries the same package onto LOADED first breaks it by the full package weight."
        test_recipe:
          setup:
            - "Clock 1540. SDF hub with alternate IND, lanes P-01, S-01 and P-02, BANK_A with N701UP landed and unloaded, N702UP the outbound move aircraft, shift N-A, a load move M with weight_limit 400000, and a 20000-gram NEXT_DAY_AIR package aboard N701UP."
          setup_api_calls:
            - *k_clock
            - *k_alt_hub
            - *k_hub
            - *k_lane_p1
            - *k_lane_s1
            - *k_lane_p2
            - *k_bank
            - *k_ac1
            - *k_ac2
            - *k_shift
            - *k_clock1400
            - *k_ac1_depart
            - *k_ac1_land
            - *k_bank_unload
            - *k_ac1_begun
            - *k_ac1_done
            - call: "POST /airhub/moves"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac2_id}", weight_limit_grams: 400000 }
              as: LoadPlanner
              captures: { move_id: $.data.id }
            - call: "POST /airhub/moves/${move_id}/plan-load"
              payload: {}
              as: LoadPlanner
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-M-0001", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 20000, dimension_weight_grams: 20000 }
              as: SortOperator
              captures: { pkg_m: $.data.id, pkg_m_v1: $.data.version }
            - call: "GET /airhub/hubs/${hub_id}"
              payload: {}
              as: HubOpsManager
              captures: { total_before: $.data.live_planned_package_total }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T01:40:00Z" }
              as: HubOpsManager
          trigger:
            - call: "POST /airhub/packages/${pkg_m}/downgrade-commitment"
              payload: { expected_package_version: "${pkg_m_v1}" }
              as: CommitmentController
              captures: { after_down: $.data.commitment_status }
            - call: "GET /airhub/hubs/${hub_id}"
              payload: {}
              as: HubOpsManager
              captures: { total_after_down: $.data.live_planned_package_total }
            - call: "GET /airhub/packages/${pkg_m}/failures"
              payload: {}
              as: RefundAdjuster
              captures: { fail_m: "$.data[0].id" }
            - call: "POST /airhub/failures/${fail_m}/void"
              payload: {}
              as: RefundAdjuster
            - call: "GET /airhub/hubs/${hub_id}"
              payload: {}
              as: HubOpsManager
              captures: { total_after_void: $.data.live_planned_package_total }
            - call: "GET /airhub/packages/${pkg_m}"
              payload: {}
              as: CommitmentController
              captures: { after_void: $.data.commitment_status, after_void_final: $.data.final_commitment_minutes }
          assert:
            - "the forward step leaves the invariant untouched: ${total_after_down} == ${total_before} == 20000 and the package is ${after_down} == DOWNGRADED"
            - "the compensating void restores the exact pre-sequence volume: ${total_after_void} == ${total_before} and ${total_after_void} == 20000"
            - "Package.${pkg_m}.commitment_status == COMMITTED and Package.${pkg_m}.final_commitment_minutes is null — no drift in the commitment decision either"
            - "the invariant is non-trivial: had the sequence carried the package onto LOADED before the void, ServiceFailure.${fail_m} could not be voided at all (validations priority 11 requires sort_status != LOADED on the package void path) and the volume would have drifted by the full 20000"
            - "Hub.live_planned_package_total is unchanged across the whole forward-plus-compensating sequence"

      - name: ground_feeder_depart_cancel_restores_staging_lane_invariant
        grounds:
          - state_machines.GroundFeeder.transitions.STAGING_to_CANCELLED
          - calculations.feeder_stage_load
          - errors.ERR_FEEDER_OVER_CAPACITY
          - endpoints.POST_/airhub/feeders/{feeder_id}/cancel
        distinguishing_aspect: "A different conserved quantity — feeder staging-lane grams rather than hub live volume: staging two packages and cancelling must return staged_weight_grams to EXACTLY 0 with both packages back on the sort surface, and the non-trivial half is that the same two packages taken through departure instead leave 0 but with both packages voided rather than restored."
        test_recipe:
          setup:
            - "Clock 1400. SDF hub with alternate IND, lane P-01 and S-01, BANK_A with N701UP landed and unloaded, shift N-A, feeder F1 (scheduled 1420, window 10, capacity 100000), and two GROUND packages rated 50000 grams bound for LEX."
          setup_api_calls:
            - *k_clock
            - *k_alt_hub
            - *k_hub
            - *k_lane_p1
            - *k_lane_s1
            - *k_bank
            - *k_ac1
            - *k_shift
            - *k_clock1400
            - *k_ac1_depart
            - *k_ac1_land
            - *k_bank_unload
            - *k_ac1_begun
            - *k_ac1_done
            - call: "POST /airhub/feeders"
              payload: { hub_id: "${hub_id}", feeder_code: "F-1", origin_station_code: "LEX", scheduled_departure_minutes: 1420, stage_capacity_grams: 100000, window_minutes: 10 }
              as: FeederCoordinator
              captures: { f1_id: $.data.id, f1_v0: $.data.version }
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-P-0001", commodity_class: "GENERAL", destination_hub_code: "LEX", service_level: "GROUND", planned_weight_grams: 50000, dimension_weight_grams: 50000 }
              as: SortOperator
              captures: { pkg_p1: $.data.id }
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-P-0002", commodity_class: "GENERAL", destination_hub_code: "LEX", service_level: "GROUND", planned_weight_grams: 50000, dimension_weight_grams: 50000 }
              as: SortOperator
              captures: { pkg_p2: $.data.id }
            - call: "POST /airhub/feeders/${f1_id}/begin-staging"
              payload: {}
              as: FeederCoordinator
              captures: { f1_v1: $.data.version }
            - call: "GET /airhub/feeders/${f1_id}"
              payload: {}
              as: FeederCoordinator
              captures: { staged_before: $.data.staged_weight_grams }
            - call: "POST /airhub/feeders/${f1_id}/stage-package"
              payload: { package_id: "${pkg_p1}" }
              as: FeederCoordinator
            - call: "POST /airhub/feeders/${f1_id}/stage-package"
              payload: { package_id: "${pkg_p2}" }
              as: FeederCoordinator
          trigger:
            - call: "GET /airhub/feeders/${f1_id}"
              payload: {}
              as: FeederCoordinator
              captures: { staged_loaded: $.data.staged_weight_grams }
            - call: "POST /airhub/feeders/${f1_id}/cancel"
              payload: {}
              as: FeederCoordinator
              captures: { f1_status_after: $.data.status, staged_after: $.data.staged_weight_grams }
            - call: "GET /airhub/packages"
              payload: { staged_feeder_id: "${f1_id}" }
              as: FeederCoordinator
              captures: { still_staged: "$.data" }
            - call: "GET /airhub/packages/${pkg_p1}"
              payload: {}
              as: SortOperator
              captures: { p1_commitment: $.data.commitment_status, p1_handling: $.data.handling_status }
          assert:
            - "the lane starts balanced: ${staged_before} == 0 and rises to ${staged_loaded} == 100000"
            - "the compensating cancel restores the lane exactly: ${staged_after} == 0 and ${staged_after} == ${staged_before}"
            - "GroundFeeder.${f1_id}.status == CANCELLED"
            - "Package.${pkg_p1}.commitment_status == COMMITTED and ${p1_commitment} != VOIDED — the packages were returned, not consumed"
            - "GET /airhub/packages?staged_feeder_id=${f1_id} returns 0 rows, so both packages left the lane"
            - "the conserved quantity is staged_weight_grams, not hub live volume: had the same two packages been taken through depart instead, the lane would also read 0 but both packages would have been VOIDED by the depart side effects"
