    roles: [Coordinator]
    code: 200
    input: []
    output: EligibilitySpan
    side_effects: ["span.voided=true"]

  # ---- Broker ----
  - method: POST
    path: "/brokers"
    description: "Create a Broker; status initialized ACTIVE"
    roles: [Coordinator]
    code: 201
    input: [name, covered_counties, max_modality, free_deadhead_miles, deadhead_rate_cents_per_mile]
    output: Broker
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/brokers/{id}"
    description: "Get a Broker"
    roles: [Coordinator, Broker, Auditor]
    code: 200
    input: []
    output: Broker
    side_effects: []

  - method: POST
    path: "/brokers/{id}/suspend"
    description: "Suspend a Broker; ASSIGNED trips on this broker revert to SCHEDULED"
    roles: [Coordinator]
    code: 200
    input: []
    output: Broker
    side_effects: ["assigned trips SCHEDULED, assignments RELEASED, drivers AVAILABLE"]

  - method: POST
    path: "/brokers/{id}/reinstate"
    description: "Reinstate a suspended Broker"
    roles: [Coordinator]
    code: 200
    input: []
    output: Broker
    side_effects: []

  - method: GET
    path: "/brokers/{id}/drivers"
    description: "List Drivers for a broker (reverse-reachability for Driver.broker_id)"
