              payload: {}
              as: Creator
              as_user_id: "${c_id}"
            - call: "POST /patrons"
              payload: { display_name: "PEXCL", email: "pexcl@x.com" }
              as: Patron
              captures: { p_id: $.data.id }
            - call: "POST /pledges"
              payload: { patron_id: "${p_id}", creator_id: "${c_id}", tier_id: "${plus_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { pl_id: $.data.id }
            - call: "GET /charges?pledge_id=${pl_id}"
              payload: {}
              as: PlatformAdmin
              captures: { ch_id: "$.data[0].id" }
            - call: "POST /charges/${ch_id}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /pledges"
              payload: { patron_id: "${p_id}", creator_id: "${c_id}", tier_id: "${basic_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "First pledge Pledge.${pl_id}.lifecycle_status == ACTIVE (membership interval open)"
            - "Second pledge to the same creator returns 409 ERR_DUPLICATE_PLEDGE (overlapping membership interval rejected)"

      # --- interval semantics 2: rank-slot occupation on the Tier resource (different entity, point-slot geometry) ---
      - name: rto_tier_rank_slot_occupation
        grounds:
          - state_machines.Tier.DRAFT_to_PUBLISHED
          - validations[priority=9]
          - errors[ERR_TIER_RANK_TAKEN]
          - entities.Tier.fields.rank
        distinguishing_aspect: "Rank-slot occupation on the Tier resource (a different resource entity than the Pledge membership interval, and a discrete point-slot geometry rather than a time span): publishing a tier into a rank slot already occupied by a non-RETIRED PUBLISHED tier of the same creator is rejected ERR_TIER_RANK_TAKEN; retiring the occupant frees the slot for a later publish."
        test_recipe:
          setup:
            - "A creator with a PUBLISHED tier at rank 2 and a second DRAFT tier also at rank 2 (the contested slot)."
          setup_api_calls:
            - call: "POST /creators"
              payload: { display_name: "C SLOT", email: "cslot@x.com", payout_account_ref: "acct_slot" }
              as: Creator
              captures: { c_id: $.data.id }
            - call: "POST /tiers"
              payload: { creator_id: "${c_id}", name: "T_A", billing_model: "MONTHLY", rank: 2, monthly_fee_cents: 1500 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { ta_id: $.data.id }
            - call: "POST /tiers/${ta_id}/publish"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
            - call: "POST /tiers"
              payload: { creator_id: "${c_id}", name: "T_B", billing_model: "MONTHLY", rank: 2, monthly_fee_cents: 2000 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { tb_id: $.data.id }
          trigger:
            - call: "POST /tiers/${tb_id}/publish"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Publishing T_B into the occupied rank-2 slot returns 409 ERR_TIER_RANK_TAKEN"
            - "Tier.${ta_id}.status == PUBLISHED and Tier.${tb_id}.status == DRAFT (T_B not published)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      # --- conserved quantity 1: wallet_credit_cents (failed charge refunds wallet) ---
      - name: ci_wallet_conserved_on_failed_charge
        grounds:
          - state_machines.Charge.PENDING_to_FAILED
          - entities.Patron.fields.wallet_credit_cents
          - entities.Charge.fields.wallet_applied_cents
        distinguishing_aspect: "Conserved quantity = Patron.wallet_credit_cents: a charge that consumed wallet credit then FAILED returns exactly wallet_applied_cents to the wallet, so wallet_credit_cents is unchanged across (apply on charge create) + (refund on FAILED)."
        test_recipe:
          setup:
            - "Clock 2026-06-16. Patron has wallet_credit_cents=750 (from a prior refund). A new charge of gross 750 fully consumes the wallet (wallet_applied_cents=750, net=0), then FAILS."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /creators"
              payload: { display_name: "C WAL", email: "cwal@x.com", payout_account_ref: "acct_wal", charge_timing: "UP_FRONT", billing_mode: "MONTHLY" }
              as: Creator
              captures: { c_id: $.data.id }
            - call: "POST /tiers"
              payload: { creator_id: "${c_id}", name: "PLUS", billing_model: "MONTHLY", rank: 1, monthly_fee_cents: 1500 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { tier_id: $.data.id }
            - call: "POST /tiers/${tier_id}/publish"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
            - call: "POST /patrons"
              payload: { display_name: "PWAL", email: "pwal@x.com" }
              as: Patron
              captures: { p_id: $.data.id }
            - call: "POST /pledges"
              payload: { patron_id: "${p_id}", creator_id: "${c_id}", tier_id: "${tier_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { pl_id: $.data.id }
            - call: "GET /charges?pledge_id=${pl_id}"
              payload: {}
              as: PlatformAdmin
              captures: { init_id: "$.data[0].id" }
            - call: "POST /charges/${init_id}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /charges/${init_id}/refund"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
            - call: "POST /charges"
              payload: { pledge_id: "${pl_id}", charge_kind: "CYCLE_RENEWAL", gross_amount_cents: 750 }
              as: PlatformAdmin
              captures: { ch2_id: $.data.id, applied: $.data.wallet_applied_cents }
          trigger:
            - call: "POST /charges/${ch2_id}/settle"
              payload: { outcome: "FAILED" }
              as: PlatformAdmin
            - call: "GET /patrons/${p_id}"
              payload: {}
              as: PlatformAdmin
              captures: { wallet_after: $.data.wallet_credit_cents }
          assert:
            - "ch2 wallet_applied_cents == 750 and net_amount_cents == 0 at create"
            - "After FAILED settle Patron.${p_id}.wallet_credit_cents == 750 (wallet conserved: 750 consumed then 750 returned)"

      # --- conserved quantity 2: Creator.pending_payout_cents (payout sweep + reverse) ---
      - name: ci_pending_payout_conserved_on_payout_reverse
        grounds:
          - state_machines.Payout.PENDING_to_REVERSED
          - calculations.creator_pending_payout
          - entities.Creator.fields.pending_payout_cents
          - entities.Charge.fields.swept_into_payout_id
        distinguishing_aspect: "Conserved quantity = Creator.pending_payout_cents (a different conserved quantity than the wallet): sweeping charges into a payout drops pending_payout to 0, and reversing the payout restores it to the pre-sweep total exactly — no drift."
        test_recipe:
          setup:
            - "Clock 2026-06-01. Creator with two SUCCEEDED charges net 1500 + 800; pending_payout_cents==2300 before sweep."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /creators"
              payload: { display_name: "C REV", email: "crev@x.com", payout_account_ref: "acct_rev", platform_plan: "STARTER", charge_timing: "UP_FRONT", billing_mode: "MONTHLY" }
              as: Creator
              captures: { c_id: $.data.id }
            - call: "POST /tiers"
              payload: { creator_id: "${c_id}", name: "PLUS", billing_model: "MONTHLY", rank: 1, monthly_fee_cents: 1500 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { tier_id: $.data.id }
            - call: "POST /tiers/${tier_id}/publish"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
            - call: "POST /patrons"
              payload: { display_name: "PREV", email: "prev@x.com" }
              as: Patron
              captures: { p_id: $.data.id }
            - call: "POST /pledges"
              payload: { patron_id: "${p_id}", creator_id: "${c_id}", tier_id: "${tier_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { pl_id: $.data.id }
            - call: "GET /charges?pledge_id=${pl_id}"
              payload: {}
              as: PlatformAdmin
              captures: { ch1_id: "$.data[0].id" }
            - call: "POST /charges/${ch1_id}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /charges"
              payload: { pledge_id: "${pl_id}", charge_kind: "CYCLE_RENEWAL", gross_amount_cents: 800 }
              as: PlatformAdmin
              captures: { ch2_id: $.data.id }
            - call: "POST /charges/${ch2_id}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /payouts"
              payload: { creator_id: "${c_id}", cycle_anchor_date: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { payout_id: $.data.id }
          trigger:
            - call: "POST /payouts/${payout_id}/reverse"
              payload: {}
              as: PlatformAdmin
            - call: "GET /creators/${c_id}"
              payload: {}
              as: PlatformAdmin
              captures: { pending_after: $.data.pending_payout_cents }
          assert:
            - "After sweep (before trigger) Creator.${c_id}.pending_payout_cents == 0"
            - "After reverse Creator.${c_id}.pending_payout_cents == 2300 (restored exactly; pending_payout conserved across sweep+reverse)"
            - "Both charges' swept_into_payout_id == null again after reverse"
