      - name: order_beyond_available_returns_budget_would_exceed
        claim_type: violation_to_error
        grounds:
          - "§1.4 priority 14 business_fiscal checks available_cents first and §1.6 declares ERR_BUDGET_WOULD_EXCEED (422); §1.1 BudgetLine.available_cents falls as orders are committed, so the second order sees a reduced ceiling."
        distinguishing_aspect: "Each order is individually inside authorized_cents; only the running available_cents of 400000 makes the second one fail with ERR_BUDGET_WOULD_EXCEED at 422, and the line's committed_cents does not move."
        test_recipe:
          setup:
            - "Empty DB with the logical clock set to 2026-09-01T00:00:00Z; no PreOpeningProgram exists."
            - "Program 'Cobalt Bay Hotel' (120 rooms, construction_start_date 2026-09-01, target_opening_date 2027-05-01, storage_capacity_pallets 40, room_night_ceiling 200, contingency_liability_cap_cents 50000000) in schedule_state PLANNING, commercial_state BOOKING_CLOSED, version 1."
            - "One SETUP BudgetLine authorized 1000000 at version 1 carrying one COMMITTED order of 600000 for 5 pallets (window 2026-09-05..2026-09-15), so committed_cents is 600000 and available_cents 400000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /pre-opening/programs"
              payload: { property_name: "Cobalt Bay Hotel", brand_code: "CBH", room_count: 120, construction_start_date: "2026-09-01", target_opening_date: "2027-05-01", storage_capacity_pallets: 40, relocation_rate_cents: 25000, guarantee_penalty_cents: 150000, room_night_ceiling: 200, contingency_liability_cap_cents: 50000000 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /pre-opening/budget-lines"
              payload: { program_id: "${prog_id}", category: "SETUP", authorized_cents: 1000000 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { bl_setup: "$.data.id", bl_v1: "$.data.version" }
            - call: "POST /pre-opening/ose-orders"
              payload: { program_id: "${prog_id}", budget_line_id: "${bl_setup}", description: "Guest room linen", amount_cents: 600000, pallet_count: 5, delivery_window_start: "2026-09-05", delivery_window_end: "2026-09-15", expected_budget_line_version: "${bl_v1}" }
              as: ProcurementManager
              as_user_id: "pm-1"
              captures: { order_1: "$.data.id" }
            - call: "GET /pre-opening/programs/${prog_id}/budget-lines?category=SETUP"
              payload: {}
              as: ProcurementManager
              as_user_id: "pm-1"
              captures: { bl_v2: "$.data[0].version" }
          trigger:
            - call: "POST /pre-opening/ose-orders"
              payload: { program_id: "${prog_id}", budget_line_id: "${bl_setup}", description: "Banquet chairs", amount_cents: 500000, pallet_count: 4, delivery_window_start: "2026-09-05", delivery_window_end: "2026-09-15", expected_budget_line_version: "${bl_v2}" }
              as: ProcurementManager
              as_user_id: "pm-1"
              captures: { e_budget_exceed: "$.data.error_id" }
          assert:
            - "after the first order the budget line reports committed_cents 600000, spent_cents 0 and available_cents 400000"
            - "response status is 422"
            - "data.error_id == 'ERR_BUDGET_WOULD_EXCEED' (500000 requested against 400000 available)"
            - "the budget line still reports committed_cents 600000 and available_cents 400000 after the rejection"
            - "GET /pre-opening/ose-orders?program_id=${prog_id} returns total_count == 1"

