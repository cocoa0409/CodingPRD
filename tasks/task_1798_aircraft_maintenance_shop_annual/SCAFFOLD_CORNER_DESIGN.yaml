scaffold_corner_design:

  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:
      - name: owner_creation_required_fields_and_default_cap
        claim_type: creation_and_defaults
        grounds:
          - entities.Owner.fields.approval_cap_cents
          - endpoints."POST /api/owners"
        distinguishing_aspect: |
          POST /api/owners with required fields but no approval_cap_cents
          returns 201 and the response carries approval_cap_cents == 50000
          (declared default).
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /api/owners"
              payload: { full_name: "D Owner", email: "d@x.com", phone: "555" }
              as: ShopManager
              captures: { od: $.data.id }
          trigger:
            - call: "GET /api/owners/${od}"
              payload: {}
              as: ShopManager
          assert:
            - "Owner.approval_cap_cents == 50000 (default applied)"
            - "Owner.status == ACTIVE (default)"
            - "Owner.version == 1 (common_fields)"
      - name: owner_creation_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - entities.Owner.fields.email
          - endpoints."POST /api/owners"
        distinguishing_aspect: "Missing required email triggers ERR_VALIDATION (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/owners"
              payload: { full_name: "No Email", phone: "555" }
              as: ShopManager
          assert:
            - "HTTP 400 with error_id ERR_VALIDATION"
      - name: aircraft_tail_number_uniqueness
        claim_type: type_constraints
        grounds:
          - entities.Aircraft.fields.tail_number
        distinguishing_aspect: "Second aircraft with duplicate tail_number is rejected."
        test_recipe:
          setup: ["Owner exists, one aircraft with tail N1"]
          setup_api_calls:
            - call: "POST /api/owners"
              payload: { full_name: "O", email: "o@x.com", phone: "555", approval_cap_cents: 1000 }
              as: ShopManager
              captures: { o: $.data.id }
            - call: "POST /api/aircraft"
              payload: { owner_id: "${o}", tail_number: "N1", make_model: "C172", total_time_hours: 1.0 }
              as: ShopManager
          trigger:
            - call: "POST /api/aircraft"
              payload: { owner_id: "${o}", tail_number: "N1", make_model: "PA28", total_time_hours: 2.0 }
              as: ShopManager
          assert:
            - "HTTP 400 or 409 with error_id ERR_VALIDATION (uniqueness violation)"
      - name: aircraft_not_found
        claim_type: not_found
        grounds:
          - endpoints."GET /api/aircraft/{id}"
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET on non-existent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/aircraft/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ShopManager
          assert:
            - "HTTP 404 with error_id ERR_NOT_FOUND"
      - name: aircraft_computed_posture_field_readonly
        claim_type: computed_fields
        grounds:
          - entities.Aircraft.fields.airworthiness_posture
        distinguishing_aspect: "Client-supplied airworthiness_posture on POST is ignored; server initializes AIRWORTHY."
        test_recipe:
          setup: ["Owner exists"]
          setup_api_calls:
            - call: "POST /api/owners"
              payload: { full_name: "O", email: "o2@x.com", phone: "555", approval_cap_cents: 1000 }
              as: ShopManager
              captures: { o2: $.data.id }
          trigger:
            - call: "POST /api/aircraft"
              payload: { owner_id: "${o2}", tail_number: "NX1", make_model: "C172", total_time_hours: 1.0 }
              as: ShopManager
              captures: { ax: $.data.id }
          assert:
            - "Aircraft.airworthiness_posture == AIRWORTHY regardless of any client hint"
      - name: checklist_item_no_version_field
        claim_type: immutability
        grounds:
          - entities.ChecklistItem
        distinguishing_aspect: "ChecklistItem has common_fields: false — no version field present in GET response."
        test_recipe:
          setup: ["WO with one checklist item"]
          setup_api_calls:
            - call: "POST /api/owners"
              payload: { full_name: "O", email: "oc@x.com", phone: "555", approval_cap_cents: 1000 }
              as: ShopManager
              captures: { occ2: $.data.id }
            - call: "POST /api/aircraft"
              payload: { owner_id: "${occ2}", tail_number: "NC1", make_model: "C172", total_time_hours: 1.0 }
              as: ShopManager
              captures: { ac1: $.data.id }
            - call: "POST /api/mechanics"
              payload: { full_name: "M", certificate_number: "IA-X", certificate_class: "IA", hourly_rate_cents: 100 }
              as: ShopManager
              captures: { mc1: $.data.id }
            - call: "POST /api/hangar-slots"
              payload: { hangar_code: "HH", aircraft_id: "${ac1}", starts_at: "2026-08-10T08:00:00Z", ends_at: "2026-08-10T17:00:00Z", daily_rate_cents: 100 }
              as: ShopManager
              captures: { sc1: $.data.id, sc1v: $.data.version }
            - call: "POST /api/work-orders"
              payload: { aircraft_id: "${ac1}", hangar_slot_id: "${sc1}", opened_by_mechanic_id: "${mc1}", scope_type: "ANNUAL", pricing_mode: "HOURLY", expected_hangar_slot_version: "${sc1v}" }
              as: ShopManager
              captures: { woc1: $.data.id }
            - call: "POST /api/work-orders/${woc1}/checklist-items"
              payload: { item_code: "C-1", description: "d", flat_rate_cents: 1 }
              as: Mechanic
              as_user_id: "${mc1}"
              captures: { ci1: $.data.id }
          trigger:
            - call: "GET /api/work-orders/${woc1}/checklist-items"
              payload: {}
              as: Mechanic
              as_user_id: "${mc1}"
          assert:
            - "Each item in $.data has id, created_at; no version field (common_fields: false)"
      - name: labor_entry_duration_tenths_positive_multiple_of_3
        claim_type: type_constraints
        grounds:
          - entities.LaborEntry.fields.duration_tenths
        distinguishing_aspect: "duration_tenths = 4 (not multiple of 3) rejected; 0 or negative rejected; 3 accepted."
        test_recipe:
          setup: ["WO in IN_PROGRESS"]
          setup_api_calls:
            - call: "POST /api/owners"
              payload: { full_name: "O", email: "ol@x.com", phone: "555", approval_cap_cents: 1000 }
              as: ShopManager
              captures: { ol: $.data.id }
            - call: "POST /api/aircraft"
              payload: { owner_id: "${ol}", tail_number: "NL1", make_model: "C172", total_time_hours: 1.0 }
              as: ShopManager
              captures: { al: $.data.id }
            - call: "POST /api/mechanics"
              payload: { full_name: "M", certificate_number: "IA-L", certificate_class: "IA", hourly_rate_cents: 100 }
              as: ShopManager
              captures: { ml: $.data.id }
            - call: "POST /api/hangar-slots"
              payload: { hangar_code: "HL", aircraft_id: "${al}", starts_at: "2026-08-10T08:00:00Z", ends_at: "2026-08-10T17:00:00Z", daily_rate_cents: 100 }
              as: ShopManager
              captures: { sl: $.data.id, slv: $.data.version }
            - call: "POST /api/work-orders"
              payload: { aircraft_id: "${al}", hangar_slot_id: "${sl}", opened_by_mechanic_id: "${ml}", scope_type: "ANNUAL", pricing_mode: "HOURLY", expected_hangar_slot_version: "${slv}" }
              as: ShopManager
              captures: { wol: $.data.id }
            - call: "POST /api/work-orders/${wol}/schedule"
              payload: {}
              as: ShopManager
            - call: "POST /api/work-orders/${wol}/start"
              payload: {}
              as: Mechanic
              as_user_id: "${ml}"
          trigger:
            - call: "POST /api/work-orders/${wol}/labor-entries"
              payload: { mechanic_id: "${ml}", duration_tenths: 4, notes: "bad" }
              as: Mechanic
              as_user_id: "${ml}"
          assert:
            - "HTTP 400 ERR_VALIDATION — 4 is not a multiple of 3"

  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: workorder_invalid_transition_draft_to_rts
        claim_type: invalid_transition
        grounds:
          - state_machines.WorkOrder
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /return-to-service on DRAFT WO -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["WO in DRAFT"]
          setup_api_calls:
            - call: "POST /api/owners"
              payload: { full_name: "O", email: "ow@x.com", phone: "555", approval_cap_cents: 1000 }
              as: ShopManager
              captures: { ow2: $.data.id }
            - call: "POST /api/aircraft"
              payload: { owner_id: "${ow2}", tail_number: "NW1", make_model: "C172", total_time_hours: 1.0 }
              as: ShopManager
              captures: { aw1: $.data.id }
            - call: "POST /api/mechanics"
              payload: { full_name: "M", certificate_number: "IA-W1", certificate_class: "IA", hourly_rate_cents: 100 }
              as: ShopManager
              captures: { mw1: $.data.id }
            - call: "POST /api/hangar-slots"
              payload: { hangar_code: "HW", aircraft_id: "${aw1}", starts_at: "2026-08-10T08:00:00Z", ends_at: "2026-08-10T17:00:00Z", daily_rate_cents: 100 }
              as: ShopManager
              captures: { sw1: $.data.id, sw1v: $.data.version }
            - call: "POST /api/work-orders"
              payload: { aircraft_id: "${aw1}", hangar_slot_id: "${sw1}", opened_by_mechanic_id: "${mw1}", scope_type: "ANNUAL", pricing_mode: "HOURLY", expected_hangar_slot_version: "${sw1v}" }
              as: ShopManager
              captures: { wow1: $.data.id }
          trigger:
            - call: "POST /api/work-orders/${wow1}/return-to-service"
              payload: {}
              as: Mechanic
              as_user_id: "${mw1}"
          assert:
            - "HTTP 409 ERR_INVALID_STATE — DRAFT cannot jump to RETURNED_TO_SERVICE"
      - name: workorder_terminal_state_lockdown_cancelled
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.WorkOrder
        distinguishing_aspect: "After CANCELLED, no further transitions are accepted."
        test_recipe:
          setup: ["WO CANCELLED"]
          setup_api_calls:
            - call: "POST /api/owners"
              payload: { full_name: "O", email: "ox@x.com", phone: "555", approval_cap_cents: 1000 }
              as: ShopManager
              captures: { ox: $.data.id }
            - call: "POST /api/aircraft"
              payload: { owner_id: "${ox}", tail_number: "NX2", make_model: "C172", total_time_hours: 1.0 }
              as: ShopManager
              captures: { ax2: $.data.id }
            - call: "POST /api/mechanics"
              payload: { full_name: "M", certificate_number: "IA-X2", certificate_class: "IA", hourly_rate_cents: 100 }
              as: ShopManager
              captures: { mx2: $.data.id }
            - call: "POST /api/hangar-slots"
              payload: { hangar_code: "HX", aircraft_id: "${ax2}", starts_at: "2026-08-10T08:00:00Z", ends_at: "2026-08-10T17:00:00Z", daily_rate_cents: 100 }
              as: ShopManager
              captures: { sx2: $.data.id, sx2v: $.data.version }
            - call: "POST /api/work-orders"
              payload: { aircraft_id: "${ax2}", hangar_slot_id: "${sx2}", opened_by_mechanic_id: "${mx2}", scope_type: "ANNUAL", pricing_mode: "HOURLY", expected_hangar_slot_version: "${sx2v}" }
              as: ShopManager
              captures: { wox2: $.data.id }
            - call: "POST /api/work-orders/${wox2}/cancel"
              payload: {}
              as: ShopManager
          trigger:
            - call: "POST /api/work-orders/${wox2}/schedule"
              payload: {}
              as: ShopManager
          assert:
            - "HTTP 409 ERR_INVALID_STATE — CANCELLED is terminal"
      - name: workorder_initial_state_draft
        claim_type: initial_state
        grounds:
          - state_machines.WorkOrder
        distinguishing_aspect: "Newly created WorkOrder starts in DRAFT."
        test_recipe:
          setup: ["owner, aircraft, mechanic, slot"]
          setup_api_calls:
            - call: "POST /api/owners"
              payload: { full_name: "O", email: "oi2@x.com", phone: "555", approval_cap_cents: 1000 }
              as: ShopManager
              captures: { oi2: $.data.id }
            - call: "POST /api/aircraft"
              payload: { owner_id: "${oi2}", tail_number: "NI2", make_model: "C172", total_time_hours: 1.0 }
              as: ShopManager
              captures: { ai2: $.data.id }
            - call: "POST /api/mechanics"
              payload: { full_name: "M", certificate_number: "IA-I2", certificate_class: "IA", hourly_rate_cents: 100 }
              as: ShopManager
              captures: { mi2: $.data.id }
            - call: "POST /api/hangar-slots"
              payload: { hangar_code: "HI", aircraft_id: "${ai2}", starts_at: "2026-08-10T08:00:00Z", ends_at: "2026-08-10T17:00:00Z", daily_rate_cents: 100 }
              as: ShopManager
              captures: { si2: $.data.id, si2v: $.data.version }
          trigger:
            - call: "POST /api/work-orders"
              payload: { aircraft_id: "${ai2}", hangar_slot_id: "${si2}", opened_by_mechanic_id: "${mi2}", scope_type: "ANNUAL", pricing_mode: "HOURLY", expected_hangar_slot_version: "${si2v}" }
              as: ShopManager
              captures: { woi2: $.data.id }
          assert:
            - "WorkOrder.status == DRAFT"
            - "WorkOrder.version == 1"
      - name: discrepancy_verify_requires_segregation_of_duties
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Discrepancy.RECTIFIED_to_VERIFIED
          - errors[ERR_AIRWORTHINESS_BLOCKED]
        distinguishing_aspect: "Same mechanic cannot verify own rectification (SoD)."
        test_recipe:
          setup: ["Discrepancy RECTIFIED by mechanic M"]
          setup_api_calls:
            - call: "POST /api/owners"
              payload: { full_name: "O", email: "os@x.com", phone: "555", approval_cap_cents: 100000 }
              as: ShopManager
              captures: { osd: $.data.id }
            - call: "POST /api/aircraft"
              payload: { owner_id: "${osd}", tail_number: "NS1", make_model: "C172", total_time_hours: 1.0 }
              as: ShopManager
              captures: { asd: $.data.id }
            - call: "POST /api/mechanics"
              payload: { full_name: "M", certificate_number: "IA-SD", certificate_class: "IA", hourly_rate_cents: 100 }
              as: ShopManager
              captures: { msd: $.data.id }
            - call: "POST /api/hangar-slots"
              payload: { hangar_code: "HSD", aircraft_id: "${asd}", starts_at: "2026-08-10T08:00:00Z", ends_at: "2026-08-10T17:00:00Z", daily_rate_cents: 100 }
              as: ShopManager
              captures: { ssd: $.data.id, ssdv: $.data.version }
            - call: "POST /api/work-orders"
              payload: { aircraft_id: "${asd}", hangar_slot_id: "${ssd}", opened_by_mechanic_id: "${msd}", scope_type: "ANNUAL", pricing_mode: "HOURLY", expected_hangar_slot_version: "${ssdv}" }
              as: ShopManager
              captures: { wosd: $.data.id }
            - call: "POST /api/work-orders/${wosd}/schedule"
              payload: {}
              as: ShopManager
            - call: "POST /api/work-orders/${wosd}/start"
              payload: {}
              as: Mechanic
              as_user_id: "${msd}"
            - call: "POST /api/work-orders/${wosd}/checklist-items"
              payload: { item_code: "C-1", description: "i", flat_rate_cents: 1 }
              as: Mechanic
              as_user_id: "${msd}"
              captures: { cisd: $.data.id }
            - call: "POST /api/work-orders/${wosd}/checklist-items/${cisd}/record"
              payload: { result: "FAIL", inspected_by_mechanic_id: "${msd}" }
              as: Mechanic
              as_user_id: "${msd}"
            - call: "POST /api/work-orders/${wosd}/complete-inspection"
              payload: {}
              as: Mechanic
              as_user_id: "${msd}"
            - call: "POST /api/work-orders/${wosd}/submit-for-approval"
              payload: {}
              as: Mechanic
              as_user_id: "${msd}"
            - call: "GET /api/work-orders/${wosd}/discrepancies"
              payload: {}
              as: Mechanic
              as_user_id: "${msd}"
              captures: { dsd: "$.data[0].id" }
            - call: "POST /api/discrepancies/${dsd}/rectify"
              payload: {}
              as: Mechanic
              as_user_id: "${msd}"
          trigger:
            - call: "POST /api/discrepancies/${dsd}/verify"
              payload: { outcome: "PASS", verified_by_mechanic_id: "${msd}" }
              as: Mechanic
              as_user_id: "${msd}"
          assert:
            - "HTTP 422 ERR_AIRWORTHINESS_BLOCKED — same mechanic cannot verify own work"
      - name: part_install_on_pending_discrepancy_invalid
        claim_type: invalid_transition
        grounds:
          - state_machines.Part.RECEIVED_to_INSTALLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Covered by §1.8 cross_entity_state_dependency/part_install_gated_by_discrepancy_status."
        excluded_because:
          difficulty_instance: part_install_gated_by_discrepancy_status
          rationale: "Asserted as failure path of named §1.8 instance."

  # =====================================================================
  # Section: calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: tax_exempts_hangar_fee
        claim_type: correct_result
        grounds:
          - calculations.invoice_total
          - entities.Invoice.fields.tax_cents
        distinguishing_aspect: |
          Tax base = labor + parts + supplies only; hangar_fee_cents is exempt.
          Verified in §1.8 instance invoice_total_pinned_evaluation_order where
          tax = round_half_up(74800 * 0.0825) = 6171 — would be 7417.5 if hangar
          were taxed.
        excluded_because:
          difficulty_instance: invoice_total_pinned_evaluation_order
          rationale: "Tax-base composition asserted as part of the pinned evaluation-order instance."
      - name: labor_charge_flat_rate_ignores_labor_entries
        claim_type: input_set_filtering
        grounds:
          - calculations.labor_charge
        distinguishing_aspect: "Variant B (FLAT_RATE) ignores LaborEntry rows; uses ChecklistItem.flat_rate_cents only."
        excluded_because:
          difficulty_instance: labor_charge_hourly_vs_flat_rate_divergence
          rationale: "Variant selection asserted in the dual-variant difficulty instance."
      - name: posture_calculation_input_set_filtering
        claim_type: input_set_filtering
        grounds:
          - calculations.airworthiness_posture
        distinguishing_aspect: |
          Only APPLICABLE_OPEN ADs ground; PENDING_EVALUATION, COMPLIED,
          NOT_APPLICABLE do not. Only discrepancies in
          {OPEN, PENDING_OWNER_DECISION, APPROVED, RECTIFIED} count toward
          posture; VERIFIED/REJECTED/DEFERRED do not.
        test_recipe:
          setup:
            - "Aircraft with one SB directive PENDING_EVALUATION (not AD); zero open discrepancies"
          setup_api_calls:
            - call: "POST /api/owners"
              payload: { full_name: "O", email: "op2@x.com", phone: "555", approval_cap_cents: 1000 }
              as: ShopManager
              captures: { op2: $.data.id }
            - call: "POST /api/aircraft"
              payload: { owner_id: "${op2}", tail_number: "NP1", make_model: "C172", total_time_hours: 1.0 }
              as: ShopManager
              captures: { ap2: $.data.id }
            - call: "POST /api/directives"
              payload: { aircraft_id: "${ap2}", directive_type: "SB", reference_number: "SB-1", description: "advisory" }
              as: ShopManager
              captures: { sb_dir: $.data.id }
          trigger:
            - call: "GET /api/aircraft/${ap2}"
              payload: {}
              as: ShopManager
          assert:
            - "Aircraft.airworthiness_posture == AIRWORTHY — PENDING_EVALUATION SB does not ground"
            - "SB type also cannot ground even when APPLICABLE_OPEN (only AD can)"

  # =====================================================================
  # Section: validations
  # =====================================================================
  - section: validations
    instances:
      - name: auth_missing_headers_returns_401
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "No X-User-Role header on any endpoint -> 401."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/aircraft"
              payload: {}
              as: Anonymous
          assert:
            - "HTTP 401 ERR_UNAUTHENTICATED"
      - name: rbac_denied_wrong_role_returns_403
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Owner attempting POST /api/owners (ShopManager exclusive) -> 403."
        test_recipe:
          setup: ["owner O exists"]
          setup_api_calls:
            - call: "POST /api/owners"
              payload: { full_name: "O", email: "or@x.com", phone: "555", approval_cap_cents: 1000 }
              as: ShopManager
              captures: { or2: $.data.id }
          trigger:
            - call: "POST /api/owners"
              payload: { full_name: "Bad", email: "bad@x.com", phone: "555", approval_cap_cents: 1 }
              as: Owner
              as_user_id: "${or2}"
          assert:
            - "HTTP 403 ERR_UNAUTHORIZED"
      - name: slot_window_invalid_returns_422
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_INVALID_WINDOW]
        distinguishing_aspect: "ends_at <= starts_at rejected; >30-day slot rejected."
        test_recipe:
          setup: ["owner, aircraft"]
          setup_api_calls:
            - call: "POST /api/owners"
              payload: { full_name: "O", email: "ow3@x.com", phone: "555", approval_cap_cents: 1000 }
              as: ShopManager
              captures: { ow3: $.data.id }
            - call: "POST /api/aircraft"
              payload: { owner_id: "${ow3}", tail_number: "NW3", make_model: "C172", total_time_hours: 1.0 }
              as: ShopManager
              captures: { aw3: $.data.id }
          trigger:
            - call: "POST /api/hangar-slots"
              payload: { hangar_code: "HW3", aircraft_id: "${aw3}", starts_at: "2026-08-10T17:00:00Z", ends_at: "2026-08-10T08:00:00Z", daily_rate_cents: 100 }
              as: ShopManager
          assert:
            - "HTTP 422 ERR_INVALID_WINDOW — ends_at <= starts_at"
      - name: invoice_lock_blocks_labor_entry_after_issue
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_INVOICE_LOCKED]
        distinguishing_aspect: "After Invoice ISSUED, posting labor to the same WO is rejected 409 ERR_INVOICE_LOCKED."
        test_recipe:
          setup: ["WO at RETURNED_TO_SERVICE; Invoice ISSUED"]
          setup_api_calls:
            - call: "POST /api/owners"
              payload: { full_name: "O", email: "ol2@x.com", phone: "555", approval_cap_cents: 100000 }
              as: ShopManager
              captures: { ol2: $.data.id }
            - call: "POST /api/aircraft"
              payload: { owner_id: "${ol2}", tail_number: "NL2", make_model: "C172", total_time_hours: 1.0 }
              as: ShopManager
              captures: { al2: $.data.id }
            - call: "POST /api/mechanics"
              payload: { full_name: "M", certificate_number: "IA-L2", certificate_class: "IA", hourly_rate_cents: 100 }
              as: ShopManager
              captures: { ml2: $.data.id }
            - call: "POST /api/mechanics"
              payload: { full_name: "M2", certificate_number: "IA-L2B", certificate_class: "IA", hourly_rate_cents: 100 }
              as: ShopManager
              captures: { ml2b: $.data.id }
            - call: "POST /api/hangar-slots"
