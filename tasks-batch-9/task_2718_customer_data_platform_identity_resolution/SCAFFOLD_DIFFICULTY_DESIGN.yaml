                  - external_id: "Q2"
                    email_raw: "q2@example.com"
                    phone_raw: "+1 (555) 180-0002"
                    loyalty_number: "LY00001702"
                    first_name: "Ben"
                    last_name: "Bravo"
                    postal_code: "10001"
                    address_line: null
                    event_timestamp: "2026-07-16T11:00:00Z"
                    consent_signals:
                      - { channel: "EMAIL", purpose: "MARKETING", consent_state: "OPT_IN" }
              as: DataEngineer
