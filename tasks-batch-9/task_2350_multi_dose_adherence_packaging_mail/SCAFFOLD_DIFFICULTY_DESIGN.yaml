          - errors.ERR_SEGREGATION_OF_DUTIES
          - endpoints.POST_/pharmacy/pouches/{id}/verification-image
        distinguishing_aspect: |
          Category pair state (13) vs business_safety (18): a request that is BOTH a
          duplicate image and a self-verification by the packer must surface the cheap
          state error, not the compliance error. The two rules sit 5 apart on the ladder
          and no other instance pairs state against business_safety.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "a single-prescription patient whose adjudicated cycle produced a 28-pouch roll"
            - "the roll is PACKED by user tech-01"
            - "pouch_index 1 has already been imaged by user tech-02 (detected 1 == expected 1, so MATCH), so its verification_result is no longer PENDING"
          setup_api_calls:
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
