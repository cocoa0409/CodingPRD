      - name: foreign_keys_are_validated_against_the_flat_topology_before_any_business_rule
        claim_type: Parent Relationships
        grounds:
          - complexity_profile.entity_topology
          - errors.ERR_DEPARTMENT_NOT_FOUND
          - errors.ERR_FACULTY_MEMBER_NOT_FOUND
          - errors.ERR_STUDENT_NOT_FOUND
          - errors.ERR_OFFERING_NOT_FOUND
          - errors.ERR_REPORT_NOT_FOUND
          - validations[priority=10]
        distinguishing_aspect: |
          The topology is flat: every foreign key travels in the request body, so each create must
          resolve each key independently and name the missing entity in the error_id. A faculty create
          under an unknown department must say ERR_DEPARTMENT_NOT_FOUND, an offering with a real
          department but an unknown instructor must say ERR_FACULTY_MEMBER_NOT_FOUND, and a report
          whose offering exists but whose student does not must say ERR_STUDENT_NOT_FOUND - three
          different error_ids from three structurally identical mistakes. Duplicate natural keys are a
          separate 409 family.
