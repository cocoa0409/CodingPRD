      - name: corner_state_rule_outranks_the_fiscal_rule_on_reapproval
        claim_type: priority_ordering
        grounds:
          - validations[priority=40]
          - validations[priority=76]
        excluded_because:
          difficulty_instance: reapprove_allocated_application_returns_invalid_state_not_pool_exhausted
          rationale: "That instance violates the priority-40 state rule and the priority-76 pool rule with a single request and asserts that the state error is returned, which is exactly the priority-ordering claim for this pair."

      - name: corner_safety_rule_outranks_the_referential_rule_on_peer_review
        claim_type: priority_conflict
        grounds:
          - validations[priority=50]
          - validations[priority=62]
        excluded_because:
          difficulty_instance: submit_for_review_naming_preparer_who_is_also_designee_returns_segregation_of_duties
          rationale: "That instance constructs a request violating both the segregation-of-duties rule at priority 50 and the designated-representative rule at priority 62 and pins the priority-50 error, so the ordering between the two categories is already falsifiable."

      - name: corner_temporal_rule_outranks_the_capacity_rule_on_booking
        claim_type: priority_conflict
        grounds:
          - validations[priority=56]
          - validations[priority=66]
        excluded_because:
          difficulty_instance: booking_past_appointment_into_full_site_returns_appointment_in_past
          rationale: "That instance books into a site that is already at capacity with a start instant in the past, so both rules fire and the assertion pins the priority-56 temporal error over the priority-66 capacity error."

      - name: corner_claim_creation_depends_on_the_discharge_document_state
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=43]
        excluded_because:
          difficulty_instance: claim_creation_blocked_while_discharge_document_is_discrepancy_held_and_allowed_after_verification
          rationale: "That instance tests both sides of the cross-entity condition with the same request body - refused while the other entity is in DISCREPANCY_HELD, accepted once it is VERIFIED."

      - name: corner_pool_ceiling_is_an_aggregate_over_prior_approvals
        claim_type: aggregate_validation
        grounds:
          - validations[priority=76]
          - calculations.program_pool_ledger
        excluded_because:
          difficulty_instance: approval_filling_program_pool_to_the_cent_succeeds_while_one_cent_short_is_rejected
          rationale: "That instance approves individually valid applications until the aggregate reaches annual_pool_cents exactly, then shows the next cent over the ceiling being refused, which is the aggregate-validation claim at its boundary."

  - section: endpoints
    instances:
      - name: corner_representative_patch_updates_only_the_supplied_fields
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /cvso/representatives/{id}]
          - endpoints[GET /cvso/representatives/{id}]
        distinguishing_aspect: "A PATCH carrying only full_name rewrites that field, leaves accreditation_number, accreditation_type and accreditation_expires_on untouched, increments version to 2 and does not disturb accreditation_status PENDING; the subsequent GET returns the patched row."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z."
            - "One PENDING Representative with accreditation_number ACC-2849-541 and accreditation_type COUNTY_CVSO."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/representatives"
              payload: { full_name: "Dana Reyes", accreditation_number: "ACC-2849-541", accreditation_type: "COUNTY_CVSO", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
              captures: { rep: $.data.id }
          trigger:
            - call: "PATCH /cvso/representatives/${rep}"
              payload: { full_name: "Dana Reyes-Okafor" }
              as: SystemAdmin
              captures: { name_after: $.data.full_name, ver_after: $.data.version }
            - call: "GET /cvso/representatives/${rep}"
              payload: {}
              as: SystemAdmin
              captures: { name_read: $.data.full_name, num_read: $.data.accreditation_number, type_read: $.data.accreditation_type, status_read: $.data.accreditation_status }
          assert:
            - "HTTP status of the PATCH == 200"
            - "${name_after} == Dana Reyes-Okafor"
            - "${ver_after} == 2"
            - "${name_read} == Dana Reyes-Okafor"
            - "${num_read} == ACC-2849-541"
            - "${type_read} == COUNTY_CVSO"
            - "${status_read} == PENDING"
            - "Representative.${rep}.accreditation_expires_on == 2029-12-31"

      - name: corner_designation_link_requires_both_endpoints_of_the_reference
