              as_user_id: "sysadmin-1"
              captures: { c1_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C002", jurisdiction_id: "${j_id}", centroid_lat: 40.585, centroid_lon: -105.084 }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { c2_id: $.data.id }
          assert:
            - "both calls return status_code == 201"
            - "CoverageCell.${c1_id}.cell_code == \"C001\" and centroid_lat == null and active_assignment_count == 0"
            - "CoverageCell.${c2_id}.cell_code == \"C002\" and centroid_lat == 40.585 and centroid_lon == -105.084"
            - "CoverageCell.${c1_id}.jurisdiction_id == \"${j_id}\" and CoverageCell.${c2_id}.jurisdiction_id == \"${j_id}\""
            - "Jurisdiction.${j_id}.cell_count == 2 and covered_cell_count == 0"
            - "Jurisdiction.${j_id}.gap_pair_count == 6 and forward_gap_pair_count == 6   # 2 cells x 3 service types"
            - "GET /gis/coverage-cells as PermitCoordinator returns status_code 200 with meta.total_count == 2 — every role reads"

  # =========================================================================
  # SECTION: cross_cutting_layers  (guide: one row per declared complexity layer —
  # optimistic_concurrency, cascading_side_effects, dual_variant_calculation,
  # version_pinning_on_approval)
  # =========================================================================
  - section: cross_cutting_layers
    instances:
      - name: stale_road_version_patch_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.road-patch-stale-road
          - validations[priority=8]
          - errors.ERR_STALE_ROAD_VERSION
          - endpoints[PATCH /gis/road-centerlines/{id}]
        distinguishing_aspect: "The patch body is perfectly legal on its own merits; only expected_road_version reveals that the editor never saw the intervening validate. The stale attempt is 412 ERR_STALE_ROAD_VERSION and leaves primary_name, status and version untouched, while the identical body with the current version succeeds and bumps the version to 3."
        test_recipe:
          setup:
            - "One jurisdiction LARCO and one centerline created at version 1, then validated to version 2."
            - "The pre-validate version is captured so the patch can carry a stale value."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id, road_v1: $.data.version }
            - call: "POST /gis/road-centerlines/${road_id}/validate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_v2: $.data.version }
          trigger:
            - call: "PATCH /gis/road-centerlines/${road_id}"
              payload: { expected_road_version: "${road_v1}", primary_name: "N Maple Ave" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { err_id: $.data.error_id }
            - call: "PATCH /gis/road-centerlines/${road_id}"
              payload: { expected_road_version: "${road_v2}", primary_name: "N Maple Ave" }
              as: GisAnalyst
              as_user_id: "analyst-1"
          assert:
            - "the stale patch returns status_code == 412 with ${err_id} == \"ERR_STALE_ROAD_VERSION\""
            - "after the refusal RoadCenterline.${road_id}.primary_name == \"N MAPLE STREET\" and status == \"VALIDATED\" and version == 2"
            - "after the refusal RoadCenterline.${road_id}.qc_dirty == false — a refused write runs no side effect"
            - "the fresh patch returns status_code == 200 with RoadCenterline.${road_id}.version == 3"
            - "RoadCenterline.${road_id}.primary_name == \"N Maple Ave\" and normalized_name == \"N MAPLE AVENUE\""
            - "RoadCenterline.${road_id}.status == \"DRAFT\" and qc_dirty == true — any edit demotes and dirties"
            - "RoadCenterline.${road_id}.from_addr_left == 100 and to_addr_left == 198 — omitted fields are untouched"

      - name: stale_case_version_proposal_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.proposal-create-stale-case
          - validations[priority=8]
          - validations[priority=16]
          - errors.ERR_STALE_CASE_VERSION
        distinguishing_aspect: "Priority 8 outranks priority 16: the OPENER filing a self-counter with a stale expected_case_version gets 412 ERR_STALE_CASE_VERSION rather than 403 ERR_SELF_CONCURRENCE, so the concurrency check is proven to run before the side check; the COUNTERPARTY's identical body then succeeds once it carries version 2."
        test_recipe:
          setup:
            - "One jurisdiction LARCO, one centerline, and two ACTIVE agencies a1 (LAW) and a2 (FIRE)."
            - "One ROAD_NAME case opened by a1 at version 1, with proposal 1 filed by a1 (case version 2)."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Larimer County Sheriff", agency_type: "LAW", jurisdiction_id: "${j_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { a1_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Poudre Fire Authority", agency_type: "FIRE", jurisdiction_id: "${j_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { a2_id: $.data.id }
            - call: "POST /gis/discrepancy-cases"
              payload: { subject_type: "ROAD_NAME", subject_ref_id: "${road_id}", counterparty_agency_id: "${a2_id}", description: "Sheriff and fire disagree on the north prefix" }
              as: AgencyLiaison
              as_user_id: "${a1_id}"
              captures: { case_id: $.data.id, case_v1: $.data.version }
            - call: "POST /gis/discrepancy-cases/${case_id}/proposals"
              payload: { proposed_value: "N MAPLE STREET", expected_case_version: "${case_v1}" }
              as: AgencyLiaison
              as_user_id: "${a1_id}"
              captures: { prop1_id: $.data.id }
            - call: "GET /gis/discrepancy-cases/${case_id}"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${a2_id}"
              captures: { case_v2: $.data.version }
          trigger:
            - call: "POST /gis/discrepancy-cases/${case_id}/proposals"
              payload: { proposed_value: "NORTH MAPLE STREET", expected_case_version: "${case_v1}" }
              as: AgencyLiaison
              as_user_id: "${a1_id}"
              captures: { e1: $.data.error_id }
            - call: "POST /gis/discrepancy-cases/${case_id}/proposals"
              payload: { proposed_value: "MAPLE STREET NORTH", expected_case_version: "${case_v1}" }
              as: AgencyLiaison
              as_user_id: "${a2_id}"
              captures: { e2: $.data.error_id }
            - call: "POST /gis/discrepancy-cases/${case_id}/proposals"
              payload: { proposed_value: "MAPLE STREET NORTH", expected_case_version: "${case_v2}" }
              as: AgencyLiaison
              as_user_id: "${a2_id}"
              captures: { prop2_id: $.data.id }
          assert:
            - "the a1 stale filing returns status_code == 412 with ${e1} == \"ERR_STALE_CASE_VERSION\", NOT ERR_SELF_CONCURRENCE"
            - "the a2 stale filing returns status_code == 412 with ${e2} == \"ERR_STALE_CASE_VERSION\""
            - "after both refusals DiscrepancyCase.${case_id}.round_count == 1 and version == 2 and current_proposal_id == \"${prop1_id}\""
            - "the a2 fresh filing returns status_code == 201"
            - "DiscrepancyCase.${case_id}.status == \"COUNTERED\" and round_count == 2 and version == 3"
            - "DiscrepancyCase.${case_id}.current_proposal_id == \"${prop2_id}\""
            - "DiscrepancyProposal.${prop2_id}.round_number == 2 and proposed_by_side == \"COUNTERPARTY\" and status == \"PENDING\""
            - "DiscrepancyProposal.${prop1_id}.status == \"COUNTERED\" — projection only, the row itself was never rewritten"
            - "GET /gis/discrepancy-cases/${case_id}/proposals returns meta.total_count == 2"

      - name: two_packages_pin_different_versions_of_the_same_address_point
        claim_type: version_pinning_on_approval
        grounds:
          - complexity_profile.complexity_layers.version_pinning_on_approval
          - calculations.package_record_pin_set
          - cascade_rules.PIN_STALENESS_RULE
          - endpoints[GET /gis/provisioning-packages/{id}/records]
        distinguishing_aspect: "The pin is taken at SEAL time and then frozen: the first package keeps pinned_version 3 for the address point even after a later certification moves the live record to 4, while the second package — sealed after that certification — pins 4. The older pin goes STALE rather than silently following the record, and both packages report the same road pin at version 3."
        test_recipe:
          setup:
            - "One jurisdiction LARCO with cell C001 and a PUBLISHED centerline (version 3)."
            - "One PARCEL point at 100 LEFT, geometry true, postal match, ACTIVE (version 2, confidence 96.00)."
            - "Report 1 (ROAD scope, 0 defects) CERTIFIED — stamps the point to version 3."
            - "Package 1 (MAPPING, on report 1) SEALED at that moment."
            - "Report 2 (ROAD scope) generated and CERTIFIED afterwards — stamps the point to version 4."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
            - call: "POST /gis/road-centerlines/${road_id}/validate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/road-centerlines/${road_id}/publish"
              payload: {}
              as: QcCertifier
              as_user_id: "qc-1"
            - call: "POST /gis/address-points"
              payload: { house_number: 100, road_centerline_id: "${road_id}", side: "LEFT", source: "PARCEL", postal_city: "FORT COLLINS", cell_id: "${cell_id}", geometry_verified: true }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { pt_id: $.data.id }
            - call: "POST /gis/address-points/${pt_id}/activate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/qc-validation-reports"
              payload: { scope: "ROAD", road_centerline_id: "${road_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { rep1_id: $.data.id }
            - call: "POST /gis/qc-validation-reports/${rep1_id}/certify"
              payload: {}
              as: QcCertifier
              as_user_id: "qc-1"
            - call: "POST /gis/provisioning-packages"
              payload: { channel: "MAPPING", jurisdiction_id: "${j_id}", qc_report_id: "${rep1_id}" }
              as: ProvisioningOfficer
              as_user_id: "prov-1"
              captures: { pkg1_id: $.data.id }
            - call: "POST /gis/provisioning-packages/${pkg1_id}/seal"
              payload: {}
              as: ProvisioningOfficer
              as_user_id: "prov-1"
            - call: "POST /gis/qc-validation-reports"
              payload: { scope: "ROAD", road_centerline_id: "${road_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { rep2_id: $.data.id }
            - call: "POST /gis/qc-validation-reports/${rep2_id}/certify"
              payload: {}
              as: QcCertifier
              as_user_id: "qc-1"
          trigger:
            - call: "POST /gis/provisioning-packages"
              payload: { channel: "PUBLIC", jurisdiction_id: "${j_id}", qc_report_id: "${rep2_id}" }
              as: ProvisioningOfficer
              as_user_id: "prov-1"
              captures: { pkg2_id: $.data.id }
            - call: "POST /gis/provisioning-packages/${pkg2_id}/seal"
              payload: {}
              as: ProvisioningOfficer
              as_user_id: "prov-1"
          assert:
            - "AddressPoint.${pt_id}.version == 4 and status == \"ACTIVE\" and certified_confidence_score == 96.00"
            - "RoadCenterline.${road_id}.version == 3 and status == \"PUBLISHED\" — the road never moved"
            - "ProvisioningPackage.${pkg1_id}.record_count == 2 and fresh_pin_count == 1 and stale_pin_count == 1 and drift_detected == true"
            - "ProvisioningPackage.${pkg2_id}.record_count == 2 and fresh_pin_count == 2 and stale_pin_count == 0 and drift_detected == false"
            - "GET /gis/provisioning-packages/${pkg1_id}/records with record_type ADDRESS_POINT returns data[0].pinned_version == 3 and data[0].pin_state == \"STALE\""
            - "GET /gis/provisioning-packages/${pkg2_id}/records with record_type ADDRESS_POINT returns data[0].pinned_version == 4 and data[0].pin_state == \"FRESH\""
            - "both packages' ROAD_CENTERLINE record has pinned_version == 3 and pin_state == \"FRESH\""
            - "ProvisioningPackage.${pkg1_id}.status == \"SEALED\" and ProvisioningPackage.${pkg2_id}.status == \"SEALED\""
            - "ProvisioningPackage.${pkg1_id}.package_version == null and ${pkg2_id}.package_version == null — package_version is assigned at publish, not at seal"

      - name: stale_boundary_version_cell_assignment
        claim_type: optimistic_concurrency
        excluded_because:
          difficulty_instance: occ_stale_beats_boundary_window_invalid
          rationale: "The §1.8 priority_pair_validation_conflict instance already exercises concurrency_rules.cell-assignment-stale-boundary end to end: it triggers ERR_STALE_BOUNDARY_VERSION (412) on POST /gis/emergency-service-boundaries/{id}/cell-assignments with a stale expected_boundary_version, proves priority 8 outranks the priority-30 window rule, and then succeeds with the current version."

      - name: multi_level_cascade_verified_end_to_end
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: road_retire_cascades_points_units_pins_package
          rationale: "The §1.8 transitive_cascade instance already walks the full chain (road retire -> base points -> subaddress units -> assignable slot counts -> package pin staleness) and asserts each level, including that terminal children are skipped."

      - name: both_quality_score_variants_produce_their_own_result
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: qc_strict_vs_advisory_quality_score_diverge
          rationale: "The §1.8 dual_variant_calc instance already computes both variants over one defect set, asserts the delta, and shows the strict variant selecting the provisioning tier while the advisory variant is reported only."

  # =========================================================================
  # SECTION: consistency_model  (immediate)
  # =========================================================================
  - section: consistency_model
    instances:
      - name: derived_counters_are_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.coverage_integrity_counters
          - entities.Jurisdiction.cell_count
          - entities.RoadCenterline.assignable_slot_count
        distinguishing_aspect: "Consistency is immediate, not eventual: the response body of the very call that mutates a child already carries the recomputed ancestor counters — creating the first cell returns cell_count 1 and gap_pair_count 3 on the read taken in the same round trip, and activating an address point returns the decremented assignable_slot_count without any refresh step."
        test_recipe:
          setup:
            - "One empty jurisdiction LARCO (cell_count 0, covered_cell_count 0, gap_pair_count 0)."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
          trigger:
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "GET /gis/jurisdictions/${j_id}"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { j_cells: $.data.cell_count }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
            - call: "POST /gis/address-points"
              payload: { house_number: 100, road_centerline_id: "${road_id}", side: "LEFT", source: "PARCEL", postal_city: "FORT COLLINS", cell_id: "${cell_id}", geometry_verified: true }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { pt_id: $.data.id }
          assert:
            - "the cell creation response itself carries CoverageCell.${cell_id}.active_assignment_count == 0"
            - "the immediately following read shows ${j_cells} == 1 with no intervening write"
            - "Jurisdiction.${j_id}.gap_pair_count == 3 and forward_gap_pair_count == 3 and covered_cell_count == 0   # 1 cell x 3 service types"
            - "the centerline creation response carries assignable_slot_count_left == 50 and assignable_slot_count_right == 50"
            - "GET /gis/road-centerlines with jurisdiction_id ${j_id} returns meta.total_count == 1 in the read taken right after that creation"
            - "the address point creation response carries confidence_score == 81.00 and confidence_basis == \"PROVISIONAL\"   # 70 + 12 + 8 + 6 - 15 (DRAFT road)"
            - "RoadCenterline.${road_id}.assignable_slot_count_left == 49 in the read taken right after the point creation — the parent counter is already decremented"
            - "GET /gis/address-points with road_centerline_id ${road_id} returns meta.total_count == 1 immediately, with no refresh call of any kind"
