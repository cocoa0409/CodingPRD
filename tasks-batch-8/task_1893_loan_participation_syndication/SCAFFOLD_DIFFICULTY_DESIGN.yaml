# =============================================================================
# Task 1893: Loan Participation & Syndication Administration
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# 21 instances across the nine Difficulty Rules (§0.5 authoritative)
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: interest_day_count_basis_variants_diverge
        grounds:
          - calculations.interest_accrual
          - entities.Facility.fields.day_count_basis
        distinguishing_aspect: |
          One calculation (interest_accrual on the Facility/Draw domain) carries three
          day-count variants; identical principal (3,000,000) and identical calendar window
          (2026-08-01 -> 2026-08-31, 30 calendar days) yield three different interest pools:
          ACT_360 -> 30000, ACT_365 -> 29589, BASIS_30_360 -> 29000 (29 counted days).
        test_recipe:
          setup:
            - "Three facilities A360/A365/A30, each total_commitment 3,000,000 with one fully-funded participant (3,000,000), one SETTLED draw of 3,000,000 with accrual 2026-08-01..2027-08-01"
            - "One payment of 40,000 REGULAR value_date 2026-08-31 per facility, each with a computed distribution run"
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Basis Borrower", sector: "ENERGY", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac A360", total_commitment_cents: 3000000, currency: "USD", interest_rate_bps: 1200, day_count_basis: "ACT_360", servicing_fee_bps: 25, default_interest_addon_bps: 800, maturity_date: "2031-08-01" }, as: AgentBank, captures: { f360: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac A365", total_commitment_cents: 3000000, currency: "USD", interest_rate_bps: 1200, day_count_basis: "ACT_365", servicing_fee_bps: 25, default_interest_addon_bps: 800, maturity_date: "2031-08-01" }, as: AgentBank, captures: { f365: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac 30360", total_commitment_cents: 3000000, currency: "USD", interest_rate_bps: 1200, day_count_basis: "BASIS_30_360", servicing_fee_bps: 25, default_interest_addon_bps: 800, maturity_date: "2031-08-01" }, as: AgentBank, captures: { f30: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f360}", participant_name: "Solo Lender 360", commitment_cents: 3000000 }, as: AgentBank, captures: { p360: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f365}", participant_name: "Solo Lender 365", commitment_cents: 3000000 }, as: AgentBank, captures: { p365: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f30}", participant_name: "Solo Lender 30", commitment_cents: 3000000 }, as: AgentBank, captures: { p30: $.data.id } }
            - { call: "POST /api/participants/${p360}/commit", payload: {}, as: AgentBank }
            - { call: "POST /api/participants/${p365}/commit", payload: {}, as: AgentBank }
            - { call: "POST /api/participants/${p30}/commit", payload: {}, as: AgentBank }
            - { call: "GET /api/facilities/${f360}", as: AgentBank, captures: { f360_v: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${f360}", draw_amount_cents: 3000000, accrual_start_date: "2026-08-01", accrual_end_date: "2027-08-01", expected_facility_version: "${f360_v}" }, as: AgentBank, captures: { d360: $.data.id } }
            - { call: "GET /api/facilities/${f365}", as: AgentBank, captures: { f365_v: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${f365}", draw_amount_cents: 3000000, accrual_start_date: "2026-08-01", accrual_end_date: "2027-08-01", expected_facility_version: "${f365_v}" }, as: AgentBank, captures: { d365: $.data.id } }
            - { call: "GET /api/facilities/${f30}", as: AgentBank, captures: { f30_v: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${f30}", draw_amount_cents: 3000000, accrual_start_date: "2026-08-01", accrual_end_date: "2027-08-01", expected_facility_version: "${f30_v}" }, as: AgentBank, captures: { d30: $.data.id } }
            - { call: "GET /api/funding_settlements?participant_id=${p360}", as: AgentBank, captures: { s360: '$.data[0].id' } }
            - { call: "GET /api/funding_settlements?participant_id=${p365}", as: AgentBank, captures: { s365: '$.data[0].id' } }
            - { call: "GET /api/funding_settlements?participant_id=${p30}", as: AgentBank, captures: { s30: '$.data[0].id' } }
            - { call: "POST /api/funding_settlements/${s360}/report_wire", payload: { amount_cents: 3000000 }, as: ParticipantLender, as_user_id: "${p360}" }
            - { call: "POST /api/funding_settlements/${s360}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/funding_settlements/${s365}/report_wire", payload: { amount_cents: 3000000 }, as: ParticipantLender, as_user_id: "${p365}" }
            - { call: "POST /api/funding_settlements/${s365}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/funding_settlements/${s30}/report_wire", payload: { amount_cents: 3000000 }, as: ParticipantLender, as_user_id: "${p30}" }
            - { call: "POST /api/funding_settlements/${s30}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/payments", payload: { facility_id: "${f360}", payment_type: "REGULAR", amount_cents: 40000, value_date: "2026-08-31" }, as: Borrower, as_user_id: "${b_id}", captures: { pay360: $.data.id, pay360_v: $.data.version } }
            - { call: "POST /api/payments", payload: { facility_id: "${f365}", payment_type: "REGULAR", amount_cents: 40000, value_date: "2026-08-31" }, as: Borrower, as_user_id: "${b_id}", captures: { pay365: $.data.id, pay365_v: $.data.version } }
            - { call: "POST /api/payments", payload: { facility_id: "${f30}", payment_type: "REGULAR", amount_cents: 40000, value_date: "2026-08-31" }, as: Borrower, as_user_id: "${b_id}", captures: { pay30: $.data.id, pay30_v: $.data.version } }
          trigger:
            - { call: "POST /api/payments/${pay360}/distribution_runs", payload: { expected_payment_version: "${pay360_v}" }, as: AgentBank, captures: { run360: $.data.id, ip360: $.data.interest_pool_cents } }
            - { call: "POST /api/payments/${pay365}/distribution_runs", payload: { expected_payment_version: "${pay365_v}" }, as: AgentBank, captures: { run365: $.data.id, ip365: $.data.interest_pool_cents } }
            - { call: "POST /api/payments/${pay30}/distribution_runs", payload: { expected_payment_version: "${pay30_v}" }, as: AgentBank, captures: { run30: $.data.id, ip30: $.data.interest_pool_cents } }
          assert:
            - "DistributionRun.${run360}.interest_pool_cents == 30000"
            - "DistributionRun.${run365}.interest_pool_cents == 29589"
            - "DistributionRun.${run30}.interest_pool_cents == 29000"
            - "all three interest pools are pairwise distinct for identical principal and calendar window"

      - name: buyback_price_standard_vs_penalty_variants
        grounds:
          - calculations.buyback_price
          - state_machines.BuybackDemand.ACKNOWLEDGED_to_SETTLED
        distinguishing_aspect: |
          Buyback pricing on the participant-exit domain (different entity domain from
          interest accrual): same position priced by STANDARD (MISREPRESENTATION) vs
          PENALTY (SERVICING_BREACH); the PENALTY variant adds floor(outstanding_share * 500bps),
          so two demands produce different prices for comparable positions.
        test_recipe:
          setup:
            - "Facility 10,000,000 with participants P1 6,000,000 / P2 3,000,000 / P3 1,000,000, one SETTLED draw 5,000,000 (2026-08-01); P2 funded 1,500,000, P3 funded 500,000"
            - "Clock at 2026-08-31 so accrued interest materializes to 50,000 at settle"
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Buyback Borrower", sector: "INDUSTRIAL", risk_rating: "SPECULATIVE" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac BB", total_commitment_cents: 10000000, currency: "USD", interest_rate_bps: 1200, day_count_basis: "ACT_360", servicing_fee_bps: 25, default_interest_addon_bps: 800, maturity_date: "2031-08-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P1", commitment_cents: 6000000 }, as: AgentBank, captures: { p1_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P2", commitment_cents: 3000000 }, as: AgentBank, captures: { p2_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P3", commitment_cents: 1000000 }, as: AgentBank, captures: { p3_id: $.data.id } }
            - { call: "POST /api/participants/${p1_id}/commit", payload: {}, as: AgentBank }
            - { call: "POST /api/participants/${p2_id}/commit", payload: {}, as: AgentBank }
            - { call: "POST /api/participants/${p3_id}/commit", payload: {}, as: AgentBank }
            - { call: "GET /api/facilities/${f_id}", as: AgentBank, captures: { f_v: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${f_id}", draw_amount_cents: 5000000, accrual_start_date: "2026-08-01", accrual_end_date: "2027-08-01", expected_facility_version: "${f_v}" }, as: AgentBank, captures: { d_id: $.data.id } }
            - { call: "GET /api/funding_settlements?participant_id=${p1_id}", as: AgentBank, captures: { s1: '$.data[0].id' } }
            - { call: "GET /api/funding_settlements?participant_id=${p2_id}", as: AgentBank, captures: { s2: '$.data[0].id' } }
            - { call: "GET /api/funding_settlements?participant_id=${p3_id}", as: AgentBank, captures: { s3: '$.data[0].id' } }
            - { call: "POST /api/funding_settlements/${s1}/report_wire", payload: { amount_cents: 3000000 }, as: ParticipantLender, as_user_id: "${p1_id}" }
            - { call: "POST /api/funding_settlements/${s1}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/funding_settlements/${s2}/report_wire", payload: { amount_cents: 1500000 }, as: ParticipantLender, as_user_id: "${p2_id}" }
            - { call: "POST /api/funding_settlements/${s2}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/funding_settlements/${s3}/report_wire", payload: { amount_cents: 500000 }, as: ParticipantLender, as_user_id: "${p3_id}" }
            - { call: "POST /api/funding_settlements/${s3}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: AgentBank }
          trigger:
            - { call: "POST /api/buyback_demands", payload: { facility_id: "${f_id}", breach_type: "MISREPRESENTATION" }, as: ParticipantLender, as_user_id: "${p2_id}", captures: { bd2: $.data.id } }
            - { call: "POST /api/buyback_demands/${bd2}/acknowledge", payload: {}, as: AgentBank }
            - { call: "POST /api/buyback_demands/${bd2}/settle", payload: {}, as: AgentBank, captures: { price2: $.data.repurchase_price_cents } }
            - { call: "POST /api/buyback_demands", payload: { facility_id: "${f_id}", breach_type: "SERVICING_BREACH" }, as: ParticipantLender, as_user_id: "${p3_id}", captures: { bd3: $.data.id } }
            - { call: "POST /api/buyback_demands/${bd3}/acknowledge", payload: {}, as: AgentBank }
            - { call: "POST /api/buyback_demands/${bd3}/settle", payload: {}, as: AgentBank, captures: { price3: $.data.repurchase_price_cents } }
          assert:
            - "BuybackDemand.${bd2}.repurchase_price_cents == 1515000 (outstanding 1,500,000 + accrued share 15,000 + penalty 0)"
            - "BuybackDemand.${bd2}.penalty_cents == 0"
            - "BuybackDemand.${bd3}.outstanding_share_cents == 500000"
            - "BuybackDemand.${bd3}.accrued_share_cents == 7140 (P3 share recomputed to 1428 bps after P2 exit)"
            - "BuybackDemand.${bd3}.penalty_cents == 25000"
            - "BuybackDemand.${bd3}.repurchase_price_cents == 532140"
            - "Participant.${p2_id}.status == EXITED and Participant.${p3_id}.status == EXITED"
            - "Facility.${f_id}.committed_cents == 6000000"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (three different modes a, b, c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: waterfall_tiered_allocation_exact_split
        grounds:
          - calculations.waterfall_distribution
          - calculations.servicing_fee_accrual
        distinguishing_aspect: |
          Mode (a): a >=3-input formula with non-linear interaction — sequential min()
          branches across fee/interest/principal tiers, per-participant share splits, and
          remainder-cent allocation; pins the exact 200,000-cent waterfall on a 5,000,000
          draw with shares 6000/3000/1000.
        test_recipe:
          setup:
            - "Facility 10,000,000 with P1 6,000,000 / P2 3,000,000 / P3 1,000,000 (6000/3000/1000 bps), SETTLED draw 5,000,000 from 2026-08-01"
            - "Borrower payment 200,000 REGULAR value_date 2026-08-31 (30 days ACT/360: accrued 50,000; fee 1,041)"
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Water Borrower", sector: "REAL_ESTATE", risk_rating: "INVESTMENT_GRADE" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac WF", total_commitment_cents: 10000000, currency: "USD", interest_rate_bps: 1200, day_count_basis: "ACT_360", servicing_fee_bps: 25, default_interest_addon_bps: 800, maturity_date: "2031-08-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P1", commitment_cents: 6000000 }, as: AgentBank, captures: { p1_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P2", commitment_cents: 3000000 }, as: AgentBank, captures: { p2_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P3", commitment_cents: 1000000 }, as: AgentBank, captures: { p3_id: $.data.id } }
            - { call: "POST /api/participants/${p1_id}/commit", payload: {}, as: AgentBank }
            - { call: "POST /api/participants/${p2_id}/commit", payload: {}, as: AgentBank }
            - { call: "POST /api/participants/${p3_id}/commit", payload: {}, as: AgentBank }
            - { call: "GET /api/facilities/${f_id}", as: AgentBank, captures: { f_v: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${f_id}", draw_amount_cents: 5000000, accrual_start_date: "2026-08-01", accrual_end_date: "2027-08-01", expected_facility_version: "${f_v}" }, as: AgentBank, captures: { d_id: $.data.id } }
            - { call: "GET /api/funding_settlements?participant_id=${p1_id}", as: AgentBank, captures: { s1: '$.data[0].id' } }
            - { call: "GET /api/funding_settlements?participant_id=${p2_id}", as: AgentBank, captures: { s2: '$.data[0].id' } }
            - { call: "GET /api/funding_settlements?participant_id=${p3_id}", as: AgentBank, captures: { s3: '$.data[0].id' } }
            - { call: "POST /api/funding_settlements/${s1}/report_wire", payload: { amount_cents: 3000000 }, as: ParticipantLender, as_user_id: "${p1_id}" }
            - { call: "POST /api/funding_settlements/${s1}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/funding_settlements/${s2}/report_wire", payload: { amount_cents: 1500000 }, as: ParticipantLender, as_user_id: "${p2_id}" }
            - { call: "POST /api/funding_settlements/${s2}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/funding_settlements/${s3}/report_wire", payload: { amount_cents: 500000 }, as: ParticipantLender, as_user_id: "${p3_id}" }
            - { call: "POST /api/funding_settlements/${s3}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/payments", payload: { facility_id: "${f_id}", payment_type: "REGULAR", amount_cents: 200000, value_date: "2026-08-31" }, as: Borrower, as_user_id: "${b_id}", captures: { pay_id: $.data.id, pay_v: $.data.version } }
          trigger:
            - { call: "POST /api/payments/${pay_id}/distribution_runs", payload: { expected_payment_version: "${pay_v}" }, as: AgentBank, captures: { run_id: $.data.id } }
            - { call: "POST /api/distribution_runs/${run_id}/remit", payload: {}, as: AgentBank }
          assert:
            - "DistributionRun.${run_id}.servicing_fee_cents == 1041"
            - "DistributionRun.${run_id}.interest_pool_cents == 50000"
            - "DistributionRun.${run_id}.principal_pool_cents == 148959"
            - "Participant.${p1_id}.cumulative_interest_cents == 30000 and cumulative_principal_cents == 89376"
            - "Participant.${p2_id}.cumulative_interest_cents == 15000 and cumulative_principal_cents == 44688"
            - "Participant.${p3_id}.cumulative_interest_cents == 5000 and cumulative_principal_cents == 14895"
            - "Facility.${f_id}.outstanding_principal_cents == 4851041 and accrued_interest_cents == 0"

      - name: share_bps_floor_then_remainder_rounding
        grounds:
          - calculations.participant_share_bps
          - entities.Participant.fields.share_bps
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — floor per participant first, then
          the residual basis point is allocated by (commitment DESC, created_at ASC); three
          equal commitments of 3,333,333 yield shares 3334/3333/3333 with the remainder bp
          going to the earliest-created participant, not split evenly and not summed-then-rounded.
        test_recipe:
          setup:
            - "Facility total_commitment 9,999,999 with three participants of commitment 3,333,333 each, committed in order P1, P2, P3"
            - "Draw of 1,000,000 created so settlement dues expose the share rounding"
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Round Borrower", sector: "TECHNOLOGY", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Thirds", total_commitment_cents: 9999999, currency: "USD", interest_rate_bps: 1200, day_count_basis: "ACT_360", servicing_fee_bps: 25, default_interest_addon_bps: 800, maturity_date: "2031-08-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P1", commitment_cents: 3333333 }, as: AgentBank, captures: { p1_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P2", commitment_cents: 3333333 }, as: AgentBank, captures: { p2_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P3", commitment_cents: 3333333 }, as: AgentBank, captures: { p3_id: $.data.id } }
            - { call: "POST /api/participants/${p1_id}/commit", payload: {}, as: AgentBank, captures: { p1_share: $.data.share_bps } }
            - { call: "POST /api/participants/${p2_id}/commit", payload: {}, as: AgentBank }
            - { call: "POST /api/participants/${p3_id}/commit", payload: {}, as: AgentBank }
            - { call: "GET /api/facilities/${f_id}", as: AgentBank, captures: { f_v: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${f_id}", draw_amount_cents: 1000000, accrual_start_date: "2026-08-01", accrual_end_date: "2027-08-01", expected_facility_version: "${f_v}" }, as: AgentBank, captures: { d_id: $.data.id } }
          trigger:
            - { call: "GET /api/participants/${p1_id}", as: AgentBank, captures: { sh1: $.data.share_bps } }
            - { call: "GET /api/participants/${p2_id}", as: AgentBank, captures: { sh2: $.data.share_bps } }
            - { call: "GET /api/participants/${p3_id}", as: AgentBank, captures: { sh3: $.data.share_bps } }
            - { call: "GET /api/funding_settlements?participant_id=${p1_id}", as: AgentBank, captures: { due1: '$.data[0].due_cents' } }
            - { call: "GET /api/funding_settlements?participant_id=${p2_id}", as: AgentBank, captures: { due2: '$.data[0].due_cents' } }
            - { call: "GET /api/funding_settlements?participant_id=${p3_id}", as: AgentBank, captures: { due3: '$.data[0].due_cents' } }
          assert:
            - "Participant.${p1_id}.share_bps == 3334 (remainder bp to earliest-created on exact commitment tie)"
            - "Participant.${p2_id}.share_bps == 3333"
            - "Participant.${p3_id}.share_bps == 3333"
            - "share_bps sum == 10000 exactly"
            - "FundingSettlement due_cents == [333400, 333300, 333300] for P1/P2/P3 on the 1,000,000 draw"

      - name: servicing_fee_pre_run_outstanding_evaluation_order
        grounds:
          - calculations.servicing_fee_accrual
          - entities.Facility.fields.last_distribution_value_date
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned by evaluation order — the fee is
          computed on pre-run outstanding with baseline last_distribution_value_date, BEFORE
          the run's principal pool reduces outstanding; second distribution on the same
          facility yields fee 505 (not 1041-style first-run fee and not post-pool outstanding).
        test_recipe:
          setup:
            - "Facility 10,000,000 with P1 6,000,000 / P2 3,000,000 / P3 1,000,000, SETTLED draw 5,000,000 from 2026-08-01"
            - "First payment 200,000 (value 2026-08-31) already remitted: outstanding now 4,851,041, accrued 0, last_distribution_value_date 2026-08-31"
            - "Second payment 100,000 REGULAR value_date 2026-09-15 (15 days later)"
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Fee Borrower", sector: "HEALTHCARE", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Fee", total_commitment_cents: 10000000, currency: "USD", interest_rate_bps: 1200, day_count_basis: "ACT_360", servicing_fee_bps: 25, default_interest_addon_bps: 800, maturity_date: "2031-08-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P1", commitment_cents: 6000000 }, as: AgentBank, captures: { p1_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P2", commitment_cents: 3000000 }, as: AgentBank, captures: { p2_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P3", commitment_cents: 1000000 }, as: AgentBank, captures: { p3_id: $.data.id } }
            - { call: "POST /api/participants/${p1_id}/commit", payload: {}, as: AgentBank }
            - { call: "POST /api/participants/${p2_id}/commit", payload: {}, as: AgentBank }
            - { call: "POST /api/participants/${p3_id}/commit", payload: {}, as: AgentBank }
            - { call: "GET /api/facilities/${f_id}", as: AgentBank, captures: { f_v: $.data.version } }
