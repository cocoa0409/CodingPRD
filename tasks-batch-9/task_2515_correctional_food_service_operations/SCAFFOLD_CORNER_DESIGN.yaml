              payload: { facility_id: "${facility_id}", meal_forecast_id: "${forecast_id}", service_date: "2026-08-01", meal_slot: "LUNCH", trays_served_general: 10, trays_served_segregation: 2, trays_served_satellite: 1, special_diet_trays_served: 0 }
              as: FoodServiceSupervisor
