              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-001"
          trigger:
            - call: "POST /production-runs/${run_r1_id}/complete"
              payload: { actual_quantity_sqm: 10.10, registration_drift_mm: 0.10, curl_deviation_mm: 0.05, emboss_alignment_offset_mm: 0.15, wear_layer_measured_mil: 12.0 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { r1_royalty: $.data.royalty_accrued_cents, r1_waste: $.data.pattern_waste_sqm }
            - call: "POST /production-runs/${run_r2_id}/complete"
