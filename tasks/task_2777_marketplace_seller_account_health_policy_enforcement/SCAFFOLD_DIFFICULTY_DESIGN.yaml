            - "EnforcementAction.${a5}.decay_exempt == true and EnforcementAction.${a5}.policy_category == INTELLECTUAL_PROPERTY"
            - "Seller.${s_id}.severity_points_balance == 40.78   # 5.63 + 7.03 + 8.44 + 9.84 + 9.84, no decay applied to IP points"
