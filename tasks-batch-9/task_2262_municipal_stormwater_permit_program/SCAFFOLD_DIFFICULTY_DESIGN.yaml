          Resource: the ConstructionSite (and, separately, the PostConstructionFacility) as an
          inspection-coverage subject. Interval semantics: a CLOSED [period_start, period_end]
          range where sharing a single endpoint day already counts as an overlap — the opposite
          convention from the half-open sweeping window. The scope is also narrowed by
