# =============================================================================
# 1.9 Scaffold Corner Design — Digital Curriculum Rostering & Single Sign-On
#
# Breadth probe: every testable claim §1.1-§1.7 declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) does not already cover. Sections and
# claim_type values are taken from references/claim-extraction-guide.md; no
# category is invented here.
#
# Shared literal district used by most chains (identical to §1.8 so the two
# files can be transcribed side by side):
#   clock default            2026-08-01T00:00:00Z
#   School  "Northside Elementary" sis SCH-NE / building NE / ELEMENTARY
#   Term    "Fall 2026" school_year 2026, 2026-08-10 .. 2026-12-18,
#           add_drop_cutoff_date 2026-09-15, instructional_days 85,
#           archive_retention_days 90    (total_days = 131)
#   Operators: ro-001 (RosterOperator), dgo-001 (DataGovernanceOfficer),
#              vim-001 (VendorIntegrationManager), ia-001 (IdentityAdmin)
#   Non-existent id literal used by every not-found probe:
#              "00000000-0000-4000-8000-000000000000"
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 — entities  (§1.1, topology graph)
  # ===========================================================================
  - section: entities
    instances:
      - name: school_creation_applies_password_policy_defaults
        claim_type: Defaults
        grounds:
          - entities.School
          - endpoints[POST /rostering/schools]
        distinguishing_aspect: "POST /rostering/schools with only the four required fields returns 201 and every omitted password-policy field falls back to its declared district default (8 / true / 180 / 5 / 72), with status ACTIVE, enrolled_student_count 0 and version 1."
        test_recipe:
          setup:
            - "Empty database; clock at its 2026-08-01T00:00:00Z startup default."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: RosterOperator
              as_user_id: "ro-001"
          trigger:
            - call: "POST /rostering/schools"
              payload: { name: "Northside Elementary", sis_school_id: "SCH-NE", building_code: "NE", grade_band: "ELEMENTARY" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { sch_ne_id: $.data.id }
          assert:
            - "HTTP 201 and the response envelope is { meta, response_type: 'object', data }"
            - "data.status == ACTIVE and data.enrolled_student_count == 0"
            - "data.min_password_length == 8, data.password_requires_mixed_case == true, data.password_max_age_days == 180, data.password_lockout_threshold == 5, data.temp_password_ttl_hours == 72"
            - "data.version == 1 and data.id is a bare UUID with no type prefix"
            - "data.created_at and data.updated_at are ISO 8601 UTC with exactly three fractional digits"

      - name: school_retrieval_returns_stored_entity
        claim_type: Retrieval
        grounds:
          - endpoints[GET /rostering/schools/{school_id}]
          - entities.School
        distinguishing_aspect: "GET /rostering/schools/{school_id} echoes back exactly what POST stored, including a non-default policy override (min_password_length 12) that must survive the round trip."
        test_recipe:
          setup:
            - "One ACTIVE ELEMENTARY building created with min_password_length 12 and temp_password_ttl_hours 24 explicitly supplied."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/schools"
              payload: { name: "Northside Elementary", sis_school_id: "SCH-NE", building_code: "NE", grade_band: "ELEMENTARY", min_password_length: 12, temp_password_ttl_hours: 24 }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { sch_ne_id: $.data.id }
          trigger:
            - call: "GET /rostering/schools/${sch_ne_id}"
              payload: {}
              as: IdentityAdmin
              as_user_id: "ia-001"
          assert:
            - "HTTP 200 and data.id == ${sch_ne_id}"
            - "data.min_password_length == 12 and data.temp_password_ttl_hours == 24 — the supplied overrides, not the 8 / 72 defaults"
            - "data.password_requires_mixed_case == true and data.password_max_age_days == 180 — the omitted fields still defaulted"
            - "data.sis_school_id == 'SCH-NE', data.building_code == 'NE', data.grade_band == ELEMENTARY, data.status == ACTIVE"

      - name: school_listing_paginates_with_total_count
        claim_type: Listing
        grounds:
          - endpoints[GET /rostering/schools]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three buildings stored, GET /rostering/schools?limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns the last row with has_more false — the envelope's pagination contract, not just the row bodies."
        test_recipe:
          setup:
            - "Three ACTIVE buildings: two ELEMENTARY and one HIGH."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/schools"
              payload: { name: "Northside Elementary", sis_school_id: "SCH-NE", building_code: "NE", grade_band: "ELEMENTARY" }
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/schools"
              payload: { name: "Southmeadow Elementary", sis_school_id: "SCH-SM", building_code: "SM", grade_band: "ELEMENTARY" }
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/schools"
              payload: { name: "Central High", sis_school_id: "SCH-CH", building_code: "CH", grade_band: "HIGH" }
              as: RosterOperator
              as_user_id: "ro-001"
          trigger:
            - call: "GET /rostering/schools"
              payload: { limit: 2, offset: 0 }
              as: DataGovernanceOfficer
              as_user_id: "dgo-001"
            - call: "GET /rostering/schools"
              payload: { limit: 2, offset: 2 }
              as: DataGovernanceOfficer
              as_user_id: "dgo-001"
            - call: "GET /rostering/schools"
              payload: { grade_band: "ELEMENTARY" }
              as: DataGovernanceOfficer
              as_user_id: "dgo-001"
          assert:
            - "first page: response_type == 'array', 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "second page: 1 row, total_count == 3, has_more == false"
            - "the grade_band=ELEMENTARY filter returns exactly 2 rows and total_count == 2, and the default limit of 10 and offset of 0 are echoed"

      - name: student_read_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints[GET /rostering/students/{student_id}]
          - errors[ERR_STUDENT_NOT_FOUND]
          - validations[priority=5]
        distinguishing_aspect: "A syntactically valid but non-existent student UUID on the path returns ERR_STUDENT_NOT_FOUND with HTTP 404 — the priority-5 path-existence rung, and it fires even for a role that could read any real student."
        test_recipe:
          setup:
            - "Empty database apart from the clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: RosterOperator
              as_user_id: "ro-001"
          trigger:
            - call: "GET /rostering/students/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 and data.error_id == ERR_STUDENT_NOT_FOUND"
            - "the error envelope is { meta, response_type: 'error', data: { error_id, message } } with a non-empty message"

      - name: student_create_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - endpoints[POST /rostering/students]
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "date_of_birth is a required input with no default; omitting it returns ERR_INVALID_REQUEST (400) and no Student row is created, so School.enrolled_student_count stays 0."
        test_recipe:
          setup:
            - "One ACTIVE ELEMENTARY building, no students."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/schools"
              payload: { name: "Northside Elementary", sis_school_id: "SCH-NE", building_code: "NE", grade_band: "ELEMENTARY" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { sch_ne_id: $.data.id }
          trigger:
            - call: "POST /rostering/students"
              payload: { school_id: "${sch_ne_id}", sis_student_id: "STU-2001", first_name: "Alex", last_name: "Nakamura", grade_level: 4 }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400 and data.error_id == ERR_INVALID_REQUEST"
            - "GET /rostering/students?school_id=${sch_ne_id} returns 0 rows"
            - "School.${sch_ne_id}.enrolled_student_count == 0 and its version is unchanged at 1"

      - name: term_archive_retention_days_default_applied
        claim_type: Defaults
        grounds:
          - entities.Term.fields.archive_retention_days
          - endpoints[POST /rostering/terms]
        distinguishing_aspect: "Omitting archive_retention_days on POST /rostering/terms yields the declared default 90 and archived_access_expires_at null while the term is PLANNED — the default is stored, not merely applied later at rollover."
        test_recipe:
          setup:
            - "Empty database apart from the clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: RosterOperator
              as_user_id: "ro-001"
          trigger:
            - call: "POST /rostering/terms"
              payload: { name: "Fall 2026", school_year: 2026, start_date: "2026-08-10", end_date: "2026-12-18", add_drop_cutoff_date: "2026-09-15", instructional_days: 85 }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { term_id: $.data.id }
          assert:
            - "HTTP 201, data.archive_retention_days == 90 and data.state == PLANNED"
            - "data.archived_access_expires_at == null"
            - "GET /rostering/terms?state=PLANNED returns exactly 1 row"

      - name: section_system_fields_are_server_minted
        claim_type: System Fields
        grounds:
          - entities.Section
          - endpoints[POST /rostering/sections]
        distinguishing_aspect: "Section.status, active_enrollment_count and roster_health are system/computed, not inputs: a section created without primary_teacher_id comes back ACTIVE with count 0 and roster_health UNMATCHED_TEACHER, and its id/created_at/updated_at/version are server-minted."
        test_recipe:
          setup:
            - "One ACTIVE ELEMENTARY building; Term Fall 2026 ACTIVE; no teachers at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/schools"
              payload: { name: "Northside Elementary", sis_school_id: "SCH-NE", building_code: "NE", grade_band: "ELEMENTARY" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { sch_ne_id: $.data.id }
            - call: "POST /rostering/terms"
              payload: { name: "Fall 2026", school_year: 2026, start_date: "2026-08-10", end_date: "2026-12-18", add_drop_cutoff_date: "2026-09-15", instructional_days: 85, archive_retention_days: 90 }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { term_id: $.data.id }
            - call: "POST /rostering/terms/${term_id}/activate"
              payload: {}
              as: RosterOperator
              as_user_id: "ro-001"
          trigger:
            - call: "POST /rostering/sections"
              payload: { school_id: "${sch_ne_id}", term_id: "${term_id}", sis_section_id: "SEC-3001", course_code: "MATH4", subject: "MATH", period_index: 3, meeting_days: ["MON", "WED", "FRI"], max_seats: 5 }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { sec1_id: $.data.id }
          assert:
            - "HTTP 201, data.status == ACTIVE, data.active_enrollment_count == 0, data.roster_health == UNMATCHED_TEACHER, data.primary_teacher_id == null"
            - "data.version == 1 and data.created_at == data.updated_at"
            - "GET /rostering/sections?roster_health=UNMATCHED_TEACHER returns exactly 1 row"

      - name: section_create_invalid_enum_subject_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Section.fields.subject
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "subject is constrained to {MATH, ELA, SCIENCE, SOCIAL_STUDIES, ELECTIVE} and period_index to 1..8: an out-of-enum subject and an out-of-range period_index each return ERR_INVALID_REQUEST (400) rather than being coerced."
        test_recipe:
          setup:
            - "One ACTIVE ELEMENTARY building; Term Fall 2026 ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/schools"
              payload: { name: "Northside Elementary", sis_school_id: "SCH-NE", building_code: "NE", grade_band: "ELEMENTARY" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { sch_ne_id: $.data.id }
            - call: "POST /rostering/terms"
              payload: { name: "Fall 2026", school_year: 2026, start_date: "2026-08-10", end_date: "2026-12-18", add_drop_cutoff_date: "2026-09-15", instructional_days: 85, archive_retention_days: 90 }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { term_id: $.data.id }
            - call: "POST /rostering/terms/${term_id}/activate"
              payload: {}
              as: RosterOperator
              as_user_id: "ro-001"
          trigger:
            - call: "POST /rostering/sections"
              payload: { school_id: "${sch_ne_id}", term_id: "${term_id}", sis_section_id: "SEC-3001", course_code: "PE4", subject: "PHYSICAL_EDUCATION", period_index: 3, meeting_days: ["MON"], max_seats: 5 }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { err: "$.data.error_id" }
            - call: "POST /rostering/sections"
              payload: { school_id: "${sch_ne_id}", term_id: "${term_id}", sis_section_id: "SEC-3002", course_code: "MATH4", subject: "MATH", period_index: 9, meeting_days: ["MON"], max_seats: 5 }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { err2: "$.data.error_id" }
            - call: "POST /rostering/sections"
              payload: { school_id: "${sch_ne_id}", term_id: "${term_id}", sis_section_id: "SEC-3003", course_code: "MATH4", subject: "MATH", period_index: 3, meeting_days: ["SAT"], max_seats: 5 }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { err3: "$.data.error_id" }
          assert:
            - "the PHYSICAL_EDUCATION subject returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "period_index 9 returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST (the declared range is 1..8)"
            - "meeting_days ['SAT'] returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST (the declared set is {MON, TUE, WED, THU, FRI})"
            - "GET /rostering/sections?term_id=${term_id} returns 0 rows — none of the three rejected payloads created anything"

      - name: enrollment_create_with_unknown_section_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Enrollment.fields.section_id
          - validations[priority=7]
          - errors[ERR_SECTION_NOT_FOUND]
        distinguishing_aspect: "A body FK that does not resolve is the priority-7 rung: POST /rostering/enrollments with a non-existent section_id returns ERR_SECTION_NOT_FOUND (404) even though the student_id is perfectly valid, and no Enrollment is created."
        test_recipe:
          setup:
            - "One ACTIVE ELEMENTARY building with one ENROLLED student; Term Fall 2026 ACTIVE; no sections."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/schools"
              payload: { name: "Northside Elementary", sis_school_id: "SCH-NE", building_code: "NE", grade_band: "ELEMENTARY" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { sch_ne_id: $.data.id }
            - call: "POST /rostering/terms"
              payload: { name: "Fall 2026", school_year: 2026, start_date: "2026-08-10", end_date: "2026-12-18", add_drop_cutoff_date: "2026-09-15", instructional_days: 85, archive_retention_days: 90 }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { term_id: $.data.id }
            - call: "POST /rostering/terms/${term_id}/activate"
              payload: {}
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/students"
              payload: { school_id: "${sch_ne_id}", sis_student_id: "STU-2001", first_name: "Alex", last_name: "Nakamura", grade_level: 4, date_of_birth: "2016-05-04" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /rostering/enrollments"
              payload: { section_id: "00000000-0000-4000-8000-000000000000", student_id: "${s1_id}", requested_effective_date: "2026-08-15" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 and data.error_id == ERR_SECTION_NOT_FOUND"
            - "Student.${s1_id}.active_enrollment_count == 0 and GET /rostering/enrollments?student_id=${s1_id} returns 0 rows"

      - name: vendor_app_computed_seat_counters_at_registration
        claim_type: Computed Fields
        grounds:
          - entities.VendorApp.fields.unallocated_seats
          - entities.VendorApp.fields.consumed_seats
          - entities.VendorApp.fields.committed_charge_cents
          - endpoints[POST /rostering/vendor-apps]
        distinguishing_aspect: "A freshly registered licence is DRAFT with unallocated_seats == total_seats, consumed_seats 0, committed_charge_cents 0, sync_health OK and renewal_score null — every seat counter is computed at registration, and no BuildingAllocation exists yet because allocation happens only at activation."
        test_recipe:
          setup:
            - "One ACTIVE ELEMENTARY building with one ENROLLED student; Term Fall 2026 ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: VendorIntegrationManager
              as_user_id: "vim-001"
            - call: "POST /rostering/schools"
              payload: { name: "Northside Elementary", sis_school_id: "SCH-NE", building_code: "NE", grade_band: "ELEMENTARY" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { sch_ne_id: $.data.id }
            - call: "POST /rostering/terms"
              payload: { name: "Fall 2026", school_year: 2026, start_date: "2026-08-10", end_date: "2026-12-18", add_drop_cutoff_date: "2026-09-15", instructional_days: 85, archive_retention_days: 90 }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { term_id: $.data.id }
            - call: "POST /rostering/terms/${term_id}/activate"
              payload: {}
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/students"
              payload: { school_id: "${sch_ne_id}", sis_student_id: "STU-2001", first_name: "Alex", last_name: "Nakamura", grade_level: 4, date_of_birth: "2016-05-04" }
              as: RosterOperator
              as_user_id: "ro-001"
          trigger:
            - call: "POST /rostering/vendor-apps"
              payload: { name: "MathBlast", vendor_code: "MBX", term_id: "${term_id}", rostering_standard: "ONEROSTER_REST_1P2", identifier_strategy: "SIS_ID", username_domain: "apps.district.k12", grade_band_scope: ["ELEMENTARY"], seat_model: "PER_STUDENT", allocation_policy: "PROPORTIONAL_HEADCOUNT", total_seats: 10, price_per_seat_cents: 1000 }
              as: VendorIntegrationManager
              as_user_id: "vim-001"
              captures: { va_id: $.data.id }
          assert:
            - "HTTP 201, data.status == DRAFT, data.unallocated_seats == 10, data.consumed_seats == 0, data.committed_charge_cents == 0, data.sync_health == OK"
            - "data.renewal_score == null and data.renewal_recommendation == null — no AppAccount exists yet"
            - "data.overage_policy == BLOCK and data.unmatched_teacher_policy == HOLD_RUN and data.name_format is its declared default — all three were omitted"
            - "data.created_by_user_id == 'vim-001'"
            - "GET /rostering/building-allocations?vendor_app_id=${va_id} returns 0 rows"

      - name: app_account_junction_reachable_from_both_parents
        claim_type: Listing
        grounds:
          - complexity_profile.entity_topology
          - entities.AppAccount.fields.building_allocation_id
          - entities.AppAccount.fields.student_id
          - endpoints[GET /rostering/app-accounts]
        distinguishing_aspect: "AppAccount is the (BuildingAllocation x subject) junction of a graph topology, so the same row must be findable from either parent: filtering by building_allocation_id and filtering by student_id both return it, and the polymorphic subject leaves teacher_id null."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one ACTIVE ELEMENTARY building with one ENROLLED student; Term Fall 2026 ACTIVE."
            - "An ACTIVE PER_STUDENT licence with total_seats 3 and price_per_seat_cents 1000, so the single building holds all 3 seats."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: IdentityAdmin
              as_user_id: "ia-001"
            - call: "POST /rostering/schools"
              payload: { name: "Northside Elementary", sis_school_id: "SCH-NE", building_code: "NE", grade_band: "ELEMENTARY" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { sch_ne_id: $.data.id }
            - call: "POST /rostering/terms"
              payload: { name: "Fall 2026", school_year: 2026, start_date: "2026-08-10", end_date: "2026-12-18", add_drop_cutoff_date: "2026-09-15", instructional_days: 85, archive_retention_days: 90 }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { term_id: $.data.id }
            - call: "POST /rostering/terms/${term_id}/activate"
              payload: {}
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/students"
              payload: { school_id: "${sch_ne_id}", sis_student_id: "STU-2001", first_name: "Alex", last_name: "Nakamura", grade_level: 4, date_of_birth: "2016-05-04" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { s1_id: $.data.id }
            - call: "POST /rostering/vendor-apps"
              payload: { name: "MathBlast", vendor_code: "MBX", term_id: "${term_id}", rostering_standard: "ONEROSTER_REST_1P2", identifier_strategy: "SIS_ID", username_domain: "apps.district.k12", grade_band_scope: ["ELEMENTARY"], seat_model: "PER_STUDENT", allocation_policy: "PROPORTIONAL_HEADCOUNT", overage_policy: "BLOCK", total_seats: 3, price_per_seat_cents: 1000 }
              as: VendorIntegrationManager
              as_user_id: "vim-001"
              captures: { va_id: $.data.id }
