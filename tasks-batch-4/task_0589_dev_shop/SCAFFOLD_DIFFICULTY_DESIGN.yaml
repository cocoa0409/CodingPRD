scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: burn_rate_approved_only_vs_committed_variant_divergence
        grounds:
          - calculations.engagement_burn_rate
          - entities.Engagement.fields.approved_hours
          - entities.Engagement.fields.burn_ratio
          - endpoints.GET /engagements/{id}/burn-rate
        distinguishing_aspect: |
          Entity domain = Engagement cost accounting. For identical TimeEntry data the persisted
          approved_only variant reports burn_ratio 0.4 while the forward-looking committed variant
          reports 0.6, because the committed variant additionally counts SUBMITTED billable entries.
        test_recipe:
          setup:
            - "T&M Engagement, contract_value 2000.00, budget_hours_cap 10, standard_hourly_rate 200.00, status ACTIVE."
            - "One ACTIVE sprint, one ticket IN_PROGRESS assigned to eng-001."
            - "TimeEntry A: 4.0h APPROVED. TimeEntry B: 2.0h still SUBMITTED."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Acme Corp", billing_email: "ap@acme.test", country_code: "US" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Acme Portal", source_channel: "REFERRAL" }
              as: AccountManager
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/qualify"
              payload: { outcome: "QUALIFY" }
              as: AccountManager
            - call: "POST /engagements/${eng_id}/sow"
              payload: { billing_model: "TIME_AND_MATERIALS", contract_value: 2000.00, budget_hours_cap: 10, standard_hourly_rate: 200.00, start_date: "2026-05-01", end_date: "2026-08-31" }
              as: AccountManager
            - call: "POST /engagements/${eng_id}/sign"
              payload: { signed_by_name: "Ada Client" }
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /sprints"
              payload: { engagement_id: "${eng_id}", name: "Sprint 1", start_date: "2026-05-04", end_date: "2026-05-18" }
              as: DeliveryLead
              captures: { sprint_id: $.data.id }
            - call: "POST /sprints/${sprint_id}/transition"
              payload: { target_status: "ACTIVE" }
              as: DeliveryLead
            - call: "POST /tickets"
              payload: { sprint_id: "${sprint_id}", title: "Checkout flow", estimated_hours: 8, assignee_user_id: "eng-001" }
              as: DeliveryLead
              captures: { t1_id: $.data.id }
            - call: "POST /tickets/${t1_id}/transition"
              payload: { target_status: "IN_PROGRESS" }
              as: Engineer
              as_user_id: "eng-001"
            - call: "POST /time-entries"
              payload: { ticket_id: "${t1_id}", work_date: "2026-05-05", hours: 4.0 }
              as: Engineer
              as_user_id: "eng-001"
              captures: { te_a_id: $.data.id }
            - call: "POST /time-entries/${te_a_id}/review"
              payload: { decision: "APPROVE" }
              as: DeliveryLead
              as_user_id: "pm-001"
            - call: "POST /time-entries"
              payload: { ticket_id: "${t1_id}", work_date: "2026-05-06", hours: 2.0 }
              as: Engineer
              as_user_id: "eng-001"
              captures: { te_b_id: $.data.id }
          trigger:
            - call: "GET /engagements/${eng_id}/burn-rate"
              payload: {}
              as: DeliveryLead
          assert:
            - "burn-rate.approved_hours == 4.0"
            - "burn-rate.burned_cost == 800.00"
            - "burn-rate.burn_ratio == 0.4"
            - "burn-rate.budget_posture == HEALTHY"
            - "burn-rate.committed_hours == 6.0"
            - "burn-rate.committed_burned_cost == 1200.00"
            - "burn-rate.committed_burn_ratio == 0.6"
            - "burn-rate.burn_ratio != burn-rate.committed_burn_ratio"
            - "Engagement.${eng_id}.burn_ratio == 0.4  (the persisted field carries ONLY the approved_only variant)"

      - name: sla_clock_calendar_vs_business_hours_variant_divergence
        grounds:
          - calculations.sla_clock
          - entities.SupportIncident.fields.response_minutes
          - entities.SupportIncident.fields.sla_response_breached
          - state_machines.SupportIncident.OPEN_to_RESPONDED
        distinguishing_aspect: |
          Entity domain = SupportIncident SLA measurement on a maintenance retainer (NOT engagement
          cost accounting). Over the identical opened->responded span 2026-05-01T16:00Z ->
          2026-05-04T10:00Z the SEV1 calendar_clock returns 3960 minutes (breached) while the SEV2
          business_hours_clock returns 120 minutes (not breached).
        test_recipe:
          setup:
            - "Client with a signed FIXED engagement and a GOLD retainer covering 2026-05-01..2026-07-31."
            - "Logical clock at 2026-05-01T16:00:00Z (a Friday); one SEV1 and one SEV2 incident opened at that instant."
            - "Logical clock advanced to 2026-05-04T10:00:00Z (the following Monday)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Northwind", billing_email: "ap@northwind.test", country_code: "US" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Northwind CMS", source_channel: "INBOUND" }
              as: AccountManager
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/qualify"
              payload: { outcome: "QUALIFY" }
              as: AccountManager
            - call: "POST /engagements/${eng_id}/sow"
              payload: { billing_model: "FIXED", contract_value: 50000.00, budget_hours_cap: 200, standard_hourly_rate: 200.00, start_date: "2026-05-01", end_date: "2026-08-31" }
              as: AccountManager
            - call: "POST /engagements/${eng_id}/sign"
              payload: { signed_by_name: "Bo Client" }
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /retainers"
              payload: { client_id: "${client_id}", engagement_id: "${eng_id}", start_date: "2026-05-01", end_date: "2026-07-31", monthly_fee: 4000.00, included_hours: 10, sla_tier: "GOLD" }
              as: AccountManager
              captures: { ret_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /support-incidents"
              payload: { retainer_id: "${ret_id}", severity: "SEV1", summary: "Checkout returns 500" }
              as: ClientContact
              as_user_id: "${client_id}"
              captures: { inc1_id: $.data.id }
            - call: "POST /support-incidents"
              payload: { retainer_id: "${ret_id}", severity: "SEV2", summary: "Admin list is slow" }
              as: ClientContact
              as_user_id: "${client_id}"
              captures: { inc2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T10:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /support-incidents/${inc1_id}/respond"
              payload: {}
              as: Engineer
              as_user_id: "eng-001"
            - call: "POST /support-incidents/${inc2_id}/respond"
              payload: {}
              as: Engineer
              as_user_id: "eng-001"
          assert:
            - "SupportIncident.${inc1_id}.response_minutes == 3960"
            - "SupportIncident.${inc1_id}.sla_response_breached == true   (3960 > SLA_RESPONSE_MINUTES.SEV1 = 60)"
            - "SupportIncident.${inc2_id}.response_minutes == 120   (Fri 16:00-17:00 = 60 + Mon 09:00-10:00 = 60; weekend contributes 0)"
            - "SupportIncident.${inc2_id}.sla_resolution_breached == false"
            - "SupportIncident.${inc2_id}.sla_response_breached == false   (120 <= SLA_RESPONSE_MINUTES.SEV2 = 240)"
            - "SupportIncident.${inc1_id}.status == RESPONDED"
            - "SupportIncident.${inc2_id}.status == RESPONDED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: invoice_per_line_rounding_then_sum_mode_b
        grounds:
          - calculations.invoice_total
          - calculations.engagement_burn_rate
          - entities.Invoice.fields.subtotal
          - entities.Invoice.fields.lines
        distinguishing_aspect: |
          Mode (b) — nested rounding where the ORDER matters. Two T&M lines (1.33h and 2.17h at
          187.55/h) round per-line to 249.44 + 406.98 = subtotal 656.42, whereas summing raw
          products first (656.425) and rounding once yields 656.43. The scaffold pins round-per-line-
          then-sum for invoices, and (deliberately) round-once-on-the-aggregate for burned_cost, so
          the same hours produce Invoice.subtotal 656.42 and Engagement.burned_cost 656.43.
        test_recipe:
          setup:
            - "T&M Engagement, contract_value 100000.00, budget_hours_cap 100, standard_hourly_rate 187.55, status ACTIVE."
            - "One ACTIVE sprint 2026-05-04..2026-05-18 with two tickets, both assigned to eng-001, both IN_PROGRESS."
            - "Ticket A has 1.33 APPROVED billable hours; Ticket B has 2.17 APPROVED billable hours; both on 2026-05-05."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Initech", billing_email: "ap@initech.test", country_code: "US" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Initech Data Platform", source_channel: "PARTNER" }
              as: AccountManager
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/qualify"
              payload: { outcome: "QUALIFY" }
              as: AccountManager
            - call: "POST /engagements/${eng_id}/sow"
              payload: { billing_model: "TIME_AND_MATERIALS", contract_value: 100000.00, budget_hours_cap: 100, standard_hourly_rate: 187.55, start_date: "2026-05-01", end_date: "2026-08-31" }
              as: AccountManager
            - call: "POST /engagements/${eng_id}/sign"
              payload: { signed_by_name: "Cy Client" }
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /sprints"
              payload: { engagement_id: "${eng_id}", name: "Sprint 1", start_date: "2026-05-04", end_date: "2026-05-18" }
              as: DeliveryLead
              captures: { sprint_id: $.data.id }
            - call: "POST /sprints/${sprint_id}/transition"
              payload: { target_status: "ACTIVE" }
              as: DeliveryLead
            - call: "POST /tickets"
              payload: { sprint_id: "${sprint_id}", title: "Auth service", estimated_hours: 4, assignee_user_id: "eng-001" }
              as: DeliveryLead
              captures: { ta_id: $.data.id }
            - call: "POST /tickets"
              payload: { sprint_id: "${sprint_id}", title: "Billing sync", estimated_hours: 4, assignee_user_id: "eng-001" }
              as: DeliveryLead
              captures: { tb_id: $.data.id }
            - call: "POST /tickets/${ta_id}/transition"
              payload: { target_status: "IN_PROGRESS" }
              as: Engineer
              as_user_id: "eng-001"
            - call: "POST /tickets/${tb_id}/transition"
              payload: { target_status: "IN_PROGRESS" }
              as: Engineer
              as_user_id: "eng-001"
            - call: "POST /time-entries"
              payload: { ticket_id: "${ta_id}", work_date: "2026-05-05", hours: 1.33 }
              as: Engineer
              as_user_id: "eng-001"
              captures: { te_a_id: $.data.id }
            - call: "POST /time-entries/${te_a_id}/review"
              payload: { decision: "APPROVE" }
              as: DeliveryLead
              as_user_id: "pm-001"
            - call: "POST /time-entries"
              payload: { ticket_id: "${tb_id}", work_date: "2026-05-05", hours: 2.17 }
              as: Engineer
              as_user_id: "eng-001"
              captures: { te_b_id: $.data.id }
            - call: "POST /time-entries/${te_b_id}/review"
              payload: { decision: "APPROVE" }
              as: DeliveryLead
              as_user_id: "pm-001"
            - call: "GET /engagements/${eng_id}"
              payload: {}
              as: FinanceOfficer
              captures: { e_v: $.data.version }
          trigger:
            - call: "POST /invoices"
              payload: { engagement_id: "${eng_id}", kind: "TIME_AND_MATERIALS", expected_engagement_version: "${e_v}", period_start: "2026-05-01", period_end: "2026-05-31" }
              as: FinanceOfficer
              captures: { inv_id: $.data.id }
          assert:
            - "Invoice.${inv_id}.lines has exactly 2 entries, ordered by Ticket.created_at ASC"
            - "Invoice.${inv_id}.lines[0].amount == 249.44   (round(1.33 * 187.55, 2))"
            - "Invoice.${inv_id}.lines[1].amount == 406.98   (round(2.17 * 187.55, 2))"
            - "Invoice.${inv_id}.subtotal == 656.42   (NOT 656.43 — per-line rounding is pinned before the sum)"
            - "Invoice.${inv_id}.tax == 54.15"
            - "Invoice.${inv_id}.total == 710.57"
            - "Engagement.${eng_id}.burned_cost == 656.43   (aggregate rounding: round(3.5 * 187.55, 2))"
            - "Invoice.${inv_id}.subtotal != Engagement.${eng_id}.burned_cost"

      - name: change_request_quote_tier_keyed_on_labor_subtotal_mode_c
        grounds:
          - calculations.change_request_quote
          - entities.ChangeRequest.fields.quoted_amount
          - state_machines.ChangeRequest.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with a pinned evaluation order. The scope-discount
          tier LOOKS like it should key on the final quoted_amount (which already carries PM overhead
          and the rush fee), but it is pinned to labor_subtotal. With delta_hours 95 at 200.00/h the
          labor_subtotal is 19000.00 (TIER1, 5%) giving quoted_amount 23248.40, whereas keying the
          tier on the gross pre-discount total (24472.00 >= TIER2_FLOOR, 10%) would give 22024.80.
        test_recipe:
          setup:
            - "T&M Engagement, contract_value 100000.00, budget_hours_cap 500, standard_hourly_rate 200.00, status ACTIVE."
            - "A DRAFT ChangeRequest for 95 additional hours with rush = true."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Globex", billing_email: "ap@globex.test", country_code: "US" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Globex Marketplace", source_channel: "OUTBOUND" }
              as: AccountManager
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/qualify"
              payload: { outcome: "QUALIFY" }
              as: AccountManager
            - call: "POST /engagements/${eng_id}/sow"
              payload: { billing_model: "TIME_AND_MATERIALS", contract_value: 100000.00, budget_hours_cap: 500, standard_hourly_rate: 200.00, start_date: "2026-05-01", end_date: "2026-08-31" }
              as: AccountManager
            - call: "POST /engagements/${eng_id}/sign"
              payload: { signed_by_name: "Dee Client" }
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "GET /engagements/${eng_id}"
              payload: {}
              as: DeliveryLead
              captures: { e_v: $.data.version }
            - call: "POST /change-requests"
              payload: { engagement_id: "${eng_id}", title: "Add multi-currency checkout", delta_hours: 95, rush: true, expected_engagement_version: "${e_v}" }
              as: DeliveryLead
              captures: { cr_id: $.data.id }
          trigger:
            - call: "POST /change-requests/${cr_id}/submit"
              payload: {}
              as: DeliveryLead
          assert:
            - "ChangeRequest.${cr_id}.status == SUBMITTED"
            - "ChangeRequest.${cr_id}.quoted_amount == 23248.40"
            - "ChangeRequest.${cr_id}.quoted_amount != 22024.80   (the TIER2 10% discount must NOT be selected; the tier keys on labor_subtotal 19000.00, not on the gross 24472.00)"
            - "Engagement.${eng_id}.contract_value == 100000.00   (submission alone changes no scope)"
            - "Engagement.${eng_id}.budget_hours_cap == 500"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: ticket_rework_cycle_in_qa_to_rework_to_in_progress_to_in_qa
        grounds:
          - state_machines.Ticket.IN_QA_to_REWORK
          - state_machines.Ticket.REWORK_to_IN_PROGRESS
          - state_machines.Ticket.IN_QA_to_DONE
          - entities.Ticket.fields.rework_rounds
        distinguishing_aspect: |
          Entity = Ticket. Genuine cycle IN_QA -> REWORK -> IN_PROGRESS -> IN_QA: the ticket revisits
          IN_QA a second time, rework_rounds increments to 1, and only then can it reach DONE (by a
          non-assignee). No linear pipeline can produce rework_rounds == 1 on a DONE ticket.
        test_recipe:
          setup:
            - "T&M Engagement ACTIVE, one ACTIVE sprint, ticket t1 assigned to eng-001 and already IN_PROGRESS."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Umbrella", billing_email: "ap@umbrella.test", country_code: "US" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Umbrella Intranet", source_channel: "REFERRAL" }
              as: AccountManager
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/qualify"
              payload: { outcome: "QUALIFY" }
              as: AccountManager
            - call: "POST /engagements/${eng_id}/sow"
              payload: { billing_model: "TIME_AND_MATERIALS", contract_value: 2000.00, budget_hours_cap: 10, standard_hourly_rate: 200.00, start_date: "2026-05-01", end_date: "2026-08-31" }
              as: AccountManager
            - call: "POST /engagements/${eng_id}/sign"
              payload: { signed_by_name: "Eve Client" }
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /sprints"
              payload: { engagement_id: "${eng_id}", name: "Sprint 1", start_date: "2026-05-04", end_date: "2026-05-18" }
              as: DeliveryLead
              captures: { sprint_id: $.data.id }
            - call: "POST /sprints/${sprint_id}/transition"
              payload: { target_status: "ACTIVE" }
              as: DeliveryLead
            - call: "POST /tickets"
              payload: { sprint_id: "${sprint_id}", title: "Checkout flow", estimated_hours: 8, assignee_user_id: "eng-001" }
              as: DeliveryLead
              captures: { t1_id: $.data.id }
            - call: "POST /tickets/${t1_id}/transition"
              payload: { target_status: "IN_PROGRESS" }
              as: Engineer
              as_user_id: "eng-001"
          trigger:
            - call: "POST /tickets/${t1_id}/transition"
              payload: { target_status: "IN_QA" }
              as: Engineer
              as_user_id: "eng-001"
            - call: "POST /tickets/${t1_id}/transition"
              payload: { target_status: "REWORK", note: "2 defects found in staging" }
              as: Engineer
              as_user_id: "eng-002"
            - call: "POST /tickets/${t1_id}/transition"
              payload: { target_status: "IN_PROGRESS" }
              as: Engineer
              as_user_id: "eng-001"
            - call: "POST /tickets/${t1_id}/transition"
              payload: { target_status: "IN_QA" }
              as: Engineer
              as_user_id: "eng-001"
            - call: "POST /tickets/${t1_id}/transition"
              payload: { target_status: "DONE" }
              as: Engineer
              as_user_id: "eng-002"
          assert:
            - "Ticket.${t1_id}.status == DONE"
            - "Ticket.${t1_id}.rework_rounds == 1"
            - "Ticket.${t1_id}.actual_hours == 0   (no time was approved during the cycle)"
            - "Ticket.${t1_id}.variance_ratio == 0.0"

      - name: change_request_revision_negotiation_cycle_submitted_to_revision_to_submitted
        grounds:
          - state_machines.ChangeRequest.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.ChangeRequest.REVISION_REQUESTED_to_SUBMITTED
          - state_machines.ChangeRequest.SUBMITTED_to_APPROVED
          - entities.ChangeRequest.fields.revision_rounds
        distinguishing_aspect: |
          Entity = ChangeRequest (a different entity from the Ticket cycle). Negotiation cycle
          SUBMITTED -> REVISION_REQUESTED -> SUBMITTED: the CR re-enters SUBMITTED, revision_rounds
          becomes 1, and the re-submit re-runs change_request_quote before the client approves.
        test_recipe:
          setup:
            - "T&M Engagement ACTIVE, contract_value 100000.00, budget_hours_cap 500, rate 200.00."
            - "A DRAFT ChangeRequest for 30 additional hours, rush = false."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Stark Industries", billing_email: "ap@stark.test", country_code: "US" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Stark Portal", source_channel: "INBOUND" }
              as: AccountManager
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/qualify"
              payload: { outcome: "QUALIFY" }
              as: AccountManager
            - call: "POST /engagements/${eng_id}/sow"
              payload: { billing_model: "TIME_AND_MATERIALS", contract_value: 100000.00, budget_hours_cap: 500, standard_hourly_rate: 200.00, start_date: "2026-05-01", end_date: "2026-08-31" }
              as: AccountManager
            - call: "POST /engagements/${eng_id}/sign"
              payload: { signed_by_name: "Fay Client" }
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "GET /engagements/${eng_id}"
              payload: {}
              as: DeliveryLead
              captures: { e_v: $.data.version }
            - call: "POST /change-requests"
              payload: { engagement_id: "${eng_id}", title: "SSO integration", delta_hours: 30, rush: false, expected_engagement_version: "${e_v}" }
              as: DeliveryLead
              captures: { cr_id: $.data.id }
          trigger:
            - call: "POST /change-requests/${cr_id}/submit"
              payload: {}
              as: DeliveryLead
            - call: "POST /change-requests/${cr_id}/decision"
              payload: { action: "REQUEST_REVISION", note: "Please split the scope" }
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /change-requests/${cr_id}/submit"
              payload: {}
              as: DeliveryLead
            - call: "POST /change-requests/${cr_id}/decision"
              payload: { action: "APPROVE" }
              as: ClientContact
              as_user_id: "${client_id}"
          assert:
            - "ChangeRequest.${cr_id}.status == APPROVED"
            - "ChangeRequest.${cr_id}.revision_rounds == 1"
            - "ChangeRequest.${cr_id}.quoted_amount == 6384.00   (labor 6000.00 -> TIER1 5% -> 5700.00 -> +12% overhead 684.00; rush false)"
            - "Engagement.${eng_id}.contract_value == 106384.00"
            - "Engagement.${eng_id}.budget_hours_cap == 530"
            - "Engagement.${eng_id}.scope_hours_added == 30"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: time_entry_approval_five_link_cascade_to_sprint_freeze
        grounds:
          - state_machines.TimeEntry.SUBMITTED_to_APPROVED
          - calculations.engagement_burn_rate
          - calculations.budget_posture
          - entities.Sprint.fields.spend_frozen
        distinguishing_aspect: |
          Trigger = POST /time-entries/{id}/review (APPROVE). Depth-5 chain where each link is caused
          by the previous one: entry APPROVED -> Ticket.actual_hours 9.0 -> Engagement.burned_cost
          1800.00 / burn_ratio 0.9 -> budget_posture AT_RISK -> Sprint.spend_frozen true. The freeze
          is caused by the posture, which is caused by the ratio, which is caused by the ticket roll-up.
