            - call: "POST /claims"
              payload: { enrollment_id: "${enrollment_id}", line_type: "WATER_SERVICE_LINE", defect_location: "METER_TO_HOME", urgency: "ROUTINE", incident_description: "Occurrence 2: meter-to-home replacement." }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { claim2_id: $.data.id }
            - call: "POST /claims/${claim2_id}/triage-decision"
              payload: { decision: "APPROVE", coverage_note: "Covered." }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { claim2_v: $.data.version }
            - call: "POST /claims/${claim2_id}/dispatches"
              payload: { window_start: "2026-09-10T09:00:00.000Z", expected_claim_version: "${claim2_v}", contractor_id: "${c_a_id}" }
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { d2_id: $.data.id }
            - call: "POST /dispatches/${d2_id}/events"
              payload: { event_type: "ACCEPT" }
              as: NetworkContractor
              as_user_id: "${c_a_id}"
            - call: "POST /dispatches/${d2_id}/events"
              payload: { event_type: "COMPLETE", labor_cents: 400000, materials_cents: 73000 }
              as: NetworkContractor
              as_user_id: "${c_a_id}"
              captures: { d2_paid: $.data.benefit_paid_cents }
            - call: "GET /enrollments/${enrollment_id}"
              payload: {}
              as: RegulatoryAffairs
              as_user_id: "reg-001"
              captures: { used_before: $.data.annual_benefit_used_cents, cap_before: $.data.cap_status }
            - call: "GET /claims/${claim1_id}"
              payload: {}
              as: RegulatoryAffairs
              as_user_id: "reg-001"
              captures: { claim1_paid_before: $.data.benefit_paid_cents, claim1_status_before: $.data.status, claim1_occ_before: $.data.occurrence_used_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /regulator-complaints"
              payload: { partner_id: "${partner_id}", regulator: "PUC", allegation: "Policyholder alleges the restoration allowance was applied below the filed schedule on occurrence 1.", claim_id: "${claim1_id}" }
              as: RegulatoryAffairs
              as_user_id: "reg-001"
              captures: { complaint_id: $.data.id, complaint_v: $.data.version, complaint_due: $.data.response_due_at }
          trigger:
            - call: "POST /regulator-complaints/${complaint_id}/response"
              payload: { response_summary: "Reviewed the restoration schedule; 100000 cents of the allowance was under-applied and is reversed.", disposition: "SUBSTANTIATED", remedy_type: "BENEFIT_REVERSAL", remedy_amount_cents: 100000, expected_complaint_version: "${complaint_v}" }
              as: RegulatoryAffairs
              as_user_id: "reg-001"
              captures: { complaint_status: $.data.status, complaint_remedy: $.data.remedy_type, complaint_amount: $.data.remedy_amount_cents, complaint_responded_at: $.data.responded_at }
          assert:
            - "before - ${d1_paid} == 527000, ${d2_paid} == 473000, ${used_before} == 1000000 and ${cap_before} == ANNUAL_CAP_EXHAUSTED"
            - "before - ${claim1_status_before} == PAID and ${claim1_paid_before} == 527000 and ${claim1_occ_before} == 527000"
            - "before - ${complaint_due} == 2026-09-30T00:00:00.000Z  # full RESPONSE_DAYS.PUC 10: the cited claim is PAID, so the 5-day expedited path must NOT apply"
            - "before - Claim.${claim1_id}.status == PAID and appeal_count == 0  # citing a PAID claim reopens nothing"
            - "after - ${complaint_status} == CLOSED_SUBSTANTIATED, ${complaint_remedy} == BENEFIT_REVERSAL, ${complaint_amount} == 100000 and ${complaint_responded_at} == 2026-09-20T00:00:00.000Z"
            - "compensation is append-only - GET /ledger-entries?enrollment_id=${enrollment_id}&entry_type=BENEFIT_CHARGE still returns total_count == 2 with amount_cents [527000, 473000] unchanged"
            - "compensation is append-only - GET /ledger-entries?enrollment_id=${enrollment_id}&ledger_kind=BENEFIT returns total_count == 3 whose amount_cents are [527000, 473000, -100000] and sum to 900000"
            - "the reversal row has entry_type == BENEFIT_REVERSAL, amount_cents == -100000, claim_id == ${claim1_id} and cap_year_start == 2026-08-05"
            - "headroom restored - Enrollment.${enrollment_id}.annual_benefit_used_cents == 900000 and cap_status == WITHIN_CAP  # 900000 >= 1000000 is false, so the cap dimension walks backwards"
            - "no drift - Claim.${claim1_id}.benefit_paid_cents == 427000  # ledger-derived: 527000 + (-100000)"
            - "no drift - Dispatch.${d1_id}.benefit_paid_cents == 527000 and invoice_total_cents == 567000 and customer_responsibility_cents == 40000  # the frozen settlement is NOT rewritten"
            - "no drift - Claim.${claim2_id}.benefit_paid_cents == 473000, untouched by a reversal aimed at claim 1"
            - "occurrence headroom also reopens - Claim.${claim1_id}.occurrence_used_cents == 427000 against per_occurrence_cap_cents 800000"
            - "Enrollment.${enrollment_id}.annual_benefit_reserved_cents == 0 and both dispatches remain COMPLETED"
            - "Premises.${premises_id}.regulator_hold == false throughout: the complaint cited no enrollment_id, and the closure recomputes it to false anyway"

      - name: contractor_capacity_slot_conserved_across_supersede_and_completion
        grounds:
          - state_machines.Dispatch.ASSIGNED_to_SUPERSEDED
          - state_machines.Claim.DISPATCHED_to_DISPATCHED
          - entities.Contractor.fields.open_dispatch_count
          - entities.Enrollment.fields.annual_benefit_reserved_cents
          - entities.Dispatch.fields.cancellation_reason
          - calculations.dispatch_benefit_settlement.variants.provisional_estimate
          - calculations.dispatch_response_sla
          - endpoints.POST /claims/{claimId}/dispatches
        distinguishing_aspect: |
          Two counters that are incremented and decremented by DIFFERENT operations must net out exactly: the
          supersede releases the old dispatch's slot and reservation while the replacement takes them, so
          open_dispatch_count has to stay at 1 - never 0 (release-only) and never 2 (acquire-only) - even
          though the SAME contractor is on both sides, which is precisely the case an implementation that
          decrements after incrementing gets wrong. The completion then unwinds both counters to zero, and the
          inherited sla_deadline_at proves the compensation did not silently restart the SLA clock.
        test_recipe:
          setup:
            - "Partner Cascadia Water ACTIVE with the Water Line Protect product; one OR premises enrolled DIRECT_BILL on 2026-08-05; coverage ACTIVE after the nightly run at 2026-09-10T08:00:00.000Z."
            - "Contractor Alder Plumbing is ACTIVE in OR (hourly_rate_cents 18000, max_open_dispatches 5, permit_pull_authorized true), so its provisional estimate for a WATER_SERVICE_LINE job is 6 * 18000 + 120000 = 228000."
            - "One ROUTINE WATER_SERVICE_LINE claim is filed at 2026-09-10T08:00:00.000Z and APPROVED, giving sla_deadline_at 2026-09-13T08:00:00.000Z (SLA_HOURS.ROUTINE 72)."
            - "It is dispatched to Alder Plumbing with window_start 2026-09-10T09:00:00.000Z and left in ASSIGNED. The claim is re-read afterwards to pick up the version bumped by APPROVED -> DISPATCHED, because the supersede needs a fresh OCC token."
            - "The replacement window is 2026-09-11T09:00:00.000Z - a different day - so the 45-minute travel buffer cannot fire against the dispatch being superseded while it is still ASSIGNED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /partners"
              payload: { name: "Cascadia Water", utility_type: "WATER", state_code: "OR", brand_approval_required: true, min_days_between_drops: 21, max_mailings_per_year: 2, rate_filing_required: false, bill_insert_supported: true }
              as: PlatformAdmin
              captures: { partner_id: $.data.id, partner_v1: $.data.version }
            - call: "POST /service-line-products"
              payload: { partner_id: "${partner_id}", name: "Water Line Protect", line_type: "WATER_SERVICE_LINE", ownership_boundary: "CURB_STOP", required_owned_segment: "WATER_CURB_STOP_TO_HOME", monthly_price_cents: 2499, waiting_period_days: 30, per_occurrence_cap_cents: 800000, annual_cap_cents: 1000000, permit_covered: true, restoration_covered_scope: "BASIC_BACKFILL", cap_reset_basis: "ENROLLMENT_ANNIVERSARY" }
              as: PlatformAdmin
              captures: { product_id: $.data.id }
            - call: "POST /partners/${partner_id}/status-changes"
              payload: { target_status: "ACTIVE", reason: "Onboarding complete, product filed.", expected_partner_version: "${partner_v1}" }
              as: PlatformAdmin
            - call: "POST /premises"
              payload: { partner_id: "${partner_id}", street_address: "12 Alder St", state_code: "OR", owned_segments: ["WATER_CURB_STOP_TO_HOME"], do_not_mail: false, address_status: "GOOD" }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { premises_id: $.data.id, premises_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /enrollments"
              payload: { premises_id: "${premises_id}", product_id: "${product_id}", billing_mode: "DIRECT_BILL", expected_premises_version: "${premises_v1}", prepaid_amount_cents: 29988 }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { enrollment_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /operations/nightly-run"
              payload: {}
              as: OperationsAdmin
              as_user_id: "ops-001"
            - call: "POST /contractors"
              payload: { name: "Alder Plumbing", state_code: "OR", license_number: "OR-PL-4471", license_expires_on: "2027-12-31", line_types_certified: ["WATER_SERVICE_LINE"], hourly_rate_cents: 18000, sla_compliance_pct: 92, max_open_dispatches: 5, permit_pull_authorized: true }
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { c_a_id: $.data.id, c_a_open_initial: $.data.open_dispatch_count }
            - call: "POST /claims"
              payload: { enrollment_id: "${enrollment_id}", line_type: "WATER_SERVICE_LINE", defect_location: "CURB_STOP_TO_METER", urgency: "ROUTINE", incident_description: "Curb-stop replacement; the first crew has to be swapped out." }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/triage-decision"
              payload: { decision: "APPROVE", coverage_note: "Covered." }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { claim_v_approved: $.data.version }
            - call: "POST /claims/${claim_id}/dispatches"
              payload: { window_start: "2026-09-10T09:00:00.000Z", expected_claim_version: "${claim_v_approved}", contractor_id: "${c_a_id}" }
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { d_old_id: $.data.id, d_old_status: $.data.status, d_old_estimate: $.data.estimated_benefit_cents, d_old_deadline: $.data.sla_deadline_at }
            - call: "GET /contractors/${c_a_id}"
              payload: {}
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { open_after_first: $.data.open_dispatch_count }
            - call: "GET /enrollments/${enrollment_id}"
              payload: {}
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { reserved_after_first: $.data.annual_benefit_reserved_cents, used_after_first: $.data.annual_benefit_used_cents }
            - call: "GET /claims/${claim_id}"
              payload: {}
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { claim_status_dispatched: $.data.status, claim_v_dispatched: $.data.version, claim_deadline: $.data.sla_deadline_at }
          trigger:
            - call: "POST /claims/${claim_id}/dispatches"
              payload: { window_start: "2026-09-11T09:00:00.000Z", expected_claim_version: "${claim_v_dispatched}", contractor_id: "${c_a_id}", supersedes_dispatch_id: "${d_old_id}" }
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { d_new_id: $.data.id, d_new_status: $.data.status, d_new_estimate: $.data.estimated_benefit_cents, d_new_deadline: $.data.sla_deadline_at }
            - call: "GET /contractors/${c_a_id}"
              payload: {}
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { open_after_supersede: $.data.open_dispatch_count }
            - call: "GET /enrollments/${enrollment_id}"
              payload: {}
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { reserved_after_supersede: $.data.annual_benefit_reserved_cents }
            - call: "POST /dispatches/${d_new_id}/events"
              payload: { event_type: "ACCEPT" }
              as: NetworkContractor
              as_user_id: "${c_a_id}"
            - call: "POST /dispatches/${d_new_id}/events"
              payload: { event_type: "COMPLETE", labor_cents: 100000, materials_cents: 50000 }
              as: NetworkContractor
              as_user_id: "${c_a_id}"
              captures: { d_new_paid: $.data.benefit_paid_cents, d_new_customer: $.data.customer_responsibility_cents, d_new_final_status: $.data.status }
            - call: "GET /contractors/${c_a_id}"
              payload: {}
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { open_after_completion: $.data.open_dispatch_count }
            - call: "GET /enrollments/${enrollment_id}"
              payload: {}
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { reserved_after_completion: $.data.annual_benefit_reserved_cents, used_after_completion: $.data.annual_benefit_used_cents }
          assert:
            - "acquire - ${c_a_open_initial} == 0, ${open_after_first} == 1, ${d_old_status} == ASSIGNED and ${d_old_estimate} == 228000"
            - "acquire - ${reserved_after_first} == 228000 and ${used_after_first} == 0  # the provisional reservation is not usage"
            - "acquire - ${claim_status_dispatched} == DISPATCHED, ${claim_v_dispatched} == ${claim_v_approved} + 1 and ${claim_deadline} == 2026-09-13T08:00:00.000Z"
            - "compensate - Dispatch.${d_old_id}.status == SUPERSEDED with cancellation_reason == SUPERSEDED_BY_REDISPATCH, and its benefit_paid_cents is null"
            - "compensate - ${d_new_status} == ASSIGNED and ${d_new_estimate} == 228000  # the replacement re-reserves the same rate-card figure"
            - "CONSERVED - ${open_after_supersede} == 1, not 0 and not 2  # one slot released, one taken, on the SAME contractor"
            - "CONSERVED - ${reserved_after_supersede} == 228000, not 0 and not 456000"
            - "compensate - ${d_new_deadline} == 2026-09-13T08:00:00.000Z == ${d_old_deadline}  # the replacement INHERITS the claim's deadline; re-dispatching never buys more time"
            - "compensate - Claim.${claim_id}.status == DISPATCHED  # the self-loop keeps the claim in place rather than reverting it to APPROVED"
            - "unwind - ${d_new_final_status} == COMPLETED, ${d_new_paid} == 150000 and ${d_new_customer} == 0  # LABOR 100000 + MATERIALS 50000, entirely inside the 800000 occurrence pool"
            - "unwind - ${open_after_completion} == 0 and ${reserved_after_completion} == 0  # both counters return to their pre-dispatch values"
            - "unwind - ${used_after_completion} == 150000 exactly: neither the 228000 reservation nor the superseded dispatch leaked into usage"
            - "GET /ledger-entries?enrollment_id=${enrollment_id}&entry_type=BENEFIT_CHARGE returns total_count == 1 with amount_cents == 150000 and dispatch_id == ${d_new_id}  # the superseded dispatch never posted a row"
            - "GET /dispatches?claim_id=${claim_id} returns total_count == 2 in created_at ASC order: ${d_old_id} in SUPERSEDED and ${d_new_id} in COMPLETED"
            - "Claim.${claim_id}.status == PAID and Claim.${claim_id}.benefit_paid_cents == 150000"
