            - *cd2_demold
            - *cd2_disc
            - *cd2_trim1
            - *cd2_out1
            - *cd2_insp1
            - *cd2_trim2
            - *cd2_out2
            - *cd2_insp2
            - *cd2_whv1
            - *cd2_store1
            - *cd2_whv2
            - *cd2_store2
            - *cd2_cust
            - call: "POST /shipments"
              payload: { shipment_code: "SHP-CD-2", origin_warehouse_id: "${wh}", destination_zone: "Z2", carrier_code: "CARR-CD", trailer_cube_capacity_m3: 3.0000, trailer_max_payload_kg: 100.000 }
