        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Segregation of duties: submitter ana-1 re-appearing with a TaxManager role header but the same X-User-ID is still the same person -> ERR_SEGREGATION_OF_DUTIES."
        test_recipe:
          setup: ["Year 2026; MASTER_FILE doc submitted by X-User-ID ana-1"]
          setup_api_calls:
            - { call: "POST /tp/fiscal_years", payload: { year_index: 2026, group_revenue_eur: 100000000 }, as: GroupTaxAdmin, captures: { fy: $.data.id } }
            - { call: "POST /tp/doc_packages", payload: { fiscal_year_id: "${fy}", doc_type: "MASTER_FILE" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { doc: $.data.id } }
            - { call: "POST /tp/doc_packages/${doc}/submit", payload: {}, as: TaxAnalyst, as_user_id: "ana-1" }
          trigger:
            - { call: "POST /tp/doc_packages/${doc}/approve", payload: {}, as: TaxManager, as_user_id: "ana-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SEGREGATION_OF_DUTIES"
            - "DocPackage.${doc}.status == SUBMITTED (unchanged)"

      - name: same_entity_agreement_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_SAME_LEGAL_ENTITY]"]
        distinguishing_aspect: "provider_entity_id == recipient_entity_id -> ERR_SAME_LEGAL_ENTITY at create."
        test_recipe:
          setup: ["E1 ACTIVE; study exists (content irrelevant — referential check fires first)"]
          setup_api_calls:
            - { call: "POST /tp/legal_entities", payload: { name: "USCo", country_code: "US", functional_currency: "USD" }, as: GroupTaxAdmin, captures: { e1: $.data.id } }
            - { call: "POST /tp/benchmarking_studies", payload: { transaction_type: "SERVICES", region: "EU", vintage_year: 2026, comparables_bp: [300, 400, 500, 600, 700] }, as: TaxAnalyst, as_user_id: "ana-1", captures: { study: $.data.id } }
          trigger:
            - { call: "POST /tp/agreements", payload: { provider_entity_id: "${e1}", recipient_entity_id: "${e1}", transaction_type: "SERVICES", pricing_method: "COST_PLUS", markup_bp: 200, true_up_method: "TO_MEDIAN", benchmarking_study_id: "${study}", effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SAME_LEGAL_ENTITY"

      - name: match_unknown_transaction_returns_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Existence (priority 3) precedes state (priority 4): match on an unknown transaction id -> ERR_NOT_FOUND, not ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /tp/transactions/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/match", payload: {}, as: TaxAnalyst, as_user_id: "ana-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND"

