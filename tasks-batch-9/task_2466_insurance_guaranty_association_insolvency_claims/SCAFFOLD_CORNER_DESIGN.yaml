          - entities.ProofOfClaimTransfer.fields.rejection_reasons
        distinguishing_aspect: "Conversion is skip-not-rollback: of three records the valid PERSONAL_AUTO policy is materialised while the HOMEOWNERS policy (no profile registered) and the orphan CLAIM record are skipped, giving PARTIALLY_CONVERTED with converted_count 1, rejected_count 2 and zero-based reasons [\"1:UNKNOWN_LINE_OF_BUSINESS\", \"2:NO_MATCHING_POLICY\"]."
        test_recipe:
          setup:
            - "Only a PERSONAL_AUTO CoverageProfile is registered; there is no HOMEOWNERS profile."
            - "Insolvency in DECLARED with liquidation_order_date 2026-03-01 and no policies yet."
            - "One ProofOfClaimTransfer in RECEIVED holding three records: a valid PERSONAL_AUTO policy at index 0, a HOMEOWNERS policy at index 1, and a CLAIM at index 2 naming policy_number PA-9999 that no record or row provides."
          setup_api_calls:
            - call: "POST /coverage-profiles"
              payload: { line_of_business: "PERSONAL_AUTO", per_claim_cap_cents: 3000000, per_policy_aggregate_cap_cents: 5000000, unearned_premium_cap_cents: 1000000, refund_priority_class: 2 }
