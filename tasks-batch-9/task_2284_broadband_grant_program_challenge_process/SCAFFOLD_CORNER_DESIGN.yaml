          Four independent gates fire on a single fixture without any award: filing a challenge
          against a DRAFT program's location, recording a capability determination on a REGISTERED
          subgrantee, returning a DRAFT application for cure, and re-ingesting an address_id that is
          already used inside the same program. Crucially the duplicate address is scoped per program,
          so ADDR-0001 exists happily in both programs and only the second insert into the same
          program is refused.
