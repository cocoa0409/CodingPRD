# =============================================================================
# Paint & Sip Event Studio (Painting with a Twist style) — Seed Tables (§1.0–§1.7)
# Difficulty band: Expert
# =============================================================================

scenario: "Paint & Sip Event Studio (Painting with a Twist style): event calendar & seat capacity, public-class vs private-party booking, BYOB/age & waiver, artist & canvas/supply kit, reservation & cancellation/credit, fundraiser/corporate, gift card, walk-in vs reserve"

domain_name: paint-sip-event-studio
api_prefix: /studio-ops

complexity_profile:
  primary_archetype: quota_allocation           # finite seat pool reserved / committed / released
  secondary_archetype: temporal_windowing        # studio-room and artist calendar intervals
  complexity_layers:
    - optimistic_concurrency                     # OCC on StudioEvent.version for seat-grab races
    - cascading_side_effects                     # event cancel -> reservations -> payments/credit chains
    - dual_variant_calculation                   # cancellation credit ladder; fundraiser pledged-vs-settled
    - rate_threshold_triggers                    # group-discount tiers; cancellation-window cutoffs
    - waterfall_allocation                        # gift-card / credit payment waterfall

  entity_topology: flat
  # Peer entities under a neutral /studio-ops prefix linked by FK fields in bodies
  # (StudioEvent.studio_id, Reservation.event_id/customer_id, ArtistAssignment.event_id/artist_id, ...).
  # Many-to-many Artist<->StudioEvent is carried by the ArtistAssignment junction.

  state_machine_shape: branching
  # StudioEvent: branching lifecycle with an OPEN<->FULL cycle. Reservation carries two
  # INDEPENDENT dimensions (booking status x payment status) plus a CONFIRMED->HELD revert.

  relationship_patterns:
    - one_to_many        # Studio->StudioEvent, StudioEvent->Reservation, Reservation->Attendee/Payment
    - many_to_many       # Artist<->StudioEvent via ArtistAssignment
    - cross_aggregate    # GiftCard / Customer credit applied to a Reservation across aggregates

  role_model: peer_roles
  # StudioManager (operates studios/events/artists), Customer (books own reservations),
  # FrontDesk (walk-ins / check-in), opaque PlatformAdmin (clock, seeding, gift cards, override).

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Studio
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Studio (room) display name" }
      - { name: room_capacity_seats, type: integer, source: input, description: "Physical seat capacity of the room; an event in this studio may not declare seats_capacity above this", constraints: ">= 1" }
      - { name: timezone, type: string, source: input, description: "IANA timezone label for display only; all stored timestamps are UTC", default: "America/Chicago" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CLOSED", default: "ACTIVE", constraints: "ACTIVE, CLOSED" }

  - name: Artist
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Artist / instructor name" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Instructor pay rate per hour in cents (informational echo only)", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE; INACTIVE artists cannot receive new assignments", default: "ACTIVE", constraints: "ACTIVE, INACTIVE" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Unique customer email (case-insensitive unique)" }
      - { name: full_name, type: string, source: input, description: "Customer name" }
      - { name: birthdate, type: datetime, source: input, description: "Customer date of birth (date at 00:00:00Z); informational" }
      - { name: credit_balance_cents, type: integer, source: computed, description: "Studio-credit wallet balance; increased by cancellation credits/grants, decreased when spent on a reservation; never negative", default: 0 }
      - { name: credit_redeemed_cents, type: integer, source: computed, description: "Lifetime studio-credit spent on reservations; credit_balance_cents + credit_redeemed_cents is conserved against total credit granted", default: 0 }

  - name: StudioEvent
    parent: null
    common_fields: true
    fields:
      - { name: studio_id, type: string, source: input, description: "FK -> Studio.id; the room hosting this event" }
      - { name: title, type: string, source: input, description: "Painting / class title" }
      - { name: event_type, type: enum, source: input, description: "PUBLIC_CLASS | PRIVATE_PARTY | FUNDRAISER | CORPORATE; fixed at creation", constraints: "PUBLIC_CLASS, PRIVATE_PARTY, FUNDRAISER, CORPORATE" }
      - { name: start_utc, type: datetime, source: input, description: "Event start (UTC, inclusive)" }
      - { name: end_utc, type: datetime, source: input, description: "Event end (UTC, exclusive); must be strictly after start_utc" }
      - { name: seats_capacity, type: integer, source: input, description: "Total bookable seats; must be <= host Studio.room_capacity_seats", constraints: ">= 1" }
      - { name: price_cents_per_seat, type: integer, source: input, description: "List price per seat in cents", constraints: ">= 0" }
      - { name: kit_fee_cents, type: integer, source: input, description: "Canvas/supply-kit fee per seat in cents charged when a reservation opts into kits", default: 0, constraints: ">= 0" }
      - { name: byob_allowed, type: boolean, source: input, description: "If true the event is BYOB; every attendee must be age >= min_age and have a signed waiver before check-in", default: false }
      - { name: min_age, type: integer, source: input, description: "Minimum attendee age in years (caller should pass 21 for BYOB)", default: 0, constraints: ">= 0" }
      - { name: fundraiser_donation_pct, type: integer, source: input, description: "Whole-percent of seat revenue pledged to beneficiary; 1..100 required when event_type=FUNDRAISER, must be 0 otherwise", default: 0, constraints: "0..100" }
      - { name: status, type: enum, source: system, description: "DRAFT | SCHEDULED | OPEN | FULL | CLOSED | CANCELLED", default: "DRAFT", constraints: "DRAFT, SCHEDULED, OPEN, FULL, CLOSED, CANCELLED" }
      - { name: seats_reserved, type: integer, source: computed, description: "Sum of seats over Reservations in status IN {HELD, CONFIRMED, CHECKED_IN}", default: 0 }
      - { name: walk_in_seats, type: integer, source: computed, description: "Sum of party_size over WalkIns in status IN {REGISTERED, CHECKED_IN}", default: 0 }
      - { name: seats_available, type: integer, source: computed, description: "max(0, seats_capacity - seats_reserved - walk_in_seats)", default: 0 }
      - { name: pledged_donation_cents, type: integer, source: computed, description: "Provisional fundraiser donation over HELD+CONFIRMED reservations (0 for non-FUNDRAISER)", default: 0 }
      - { name: settled_donation_cents, type: integer, source: computed, description: "Final fundraiser donation over CHECKED_IN reservations, set when the event CLOSES (0 otherwise)", default: 0 }

  - name: ArtistAssignment
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> StudioEvent.id; the event being staffed" }
      - { name: artist_id, type: string, source: input, description: "FK -> Artist.id; the assigned instructor" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | RELEASED", default: "ASSIGNED", constraints: "ASSIGNED, RELEASED" }

  - name: CanvasKitBatch
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> StudioEvent.id; the event this supply batch stocks" }
      - { name: sku, type: string, source: input, description: "Canvas/supply kit SKU label" }
      - { name: prepared_count, type: integer, source: input, description: "Number of kits prepared for the event", constraints: ">= 0" }
      - { name: consumed_count, type: integer, source: computed, description: "Kits consumed at check-in by reservations/walk-ins that opted into kits; never exceeds prepared_count", default: 0 }

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> StudioEvent.id; the booked event" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the booking customer" }
      - { name: booking_mode, type: enum, source: input, description: "PUBLIC seat booking or PRIVATE whole-party booking; PRIVATE only on PRIVATE_PARTY/CORPORATE events, PUBLIC only on PUBLIC_CLASS/FUNDRAISER", constraints: "PUBLIC, PRIVATE" }
      - { name: seats, type: integer, source: input, description: "Number of seats requested", constraints: ">= 1" }
      - { name: include_supply_kit, type: boolean, source: input, description: "If true each seat receives a canvas/supply kit and is charged kit_fee_cents", default: false }
      - { name: status, type: enum, source: system, description: "Booking dimension: HELD | CONFIRMED | CHECKED_IN | CANCELLED | NO_SHOW", default: "HELD", constraints: "HELD, CONFIRMED, CHECKED_IN, CANCELLED, NO_SHOW" }
      - { name: payment_status, type: enum, source: system, description: "Payment dimension (independent of booking status): UNPAID | PAID | REFUNDED", default: "UNPAID", constraints: "UNPAID, PAID, REFUNDED" }
      - { name: base_cents, type: integer, source: computed, description: "seats * event.price_cents_per_seat before discount", default: 0 }
      - { name: group_discount_pct, type: integer, source: computed, description: "Tiered group discount whole-percent selected from seats", default: 0 }
      - { name: kit_charge_cents, type: integer, source: computed, description: "seats * event.kit_fee_cents when include_supply_kit else 0", default: 0 }
      - { name: total_cents, type: integer, source: computed, description: "Final charge: discounted base + kit_charge_cents", default: 0 }
      - { name: amount_paid_cents, type: integer, source: computed, description: "Sum of Payment.amount_cents for SETTLED payments on this reservation", default: 0 }
      - { name: credit_granted_cents, type: integer, source: computed, description: "Studio credit granted to the customer when this reservation was cancelled (0 until cancellation)", default: 0 }
      - { name: cancelled_at_hours_before, type: integer, source: system, description: "Whole hours between cancellation time and event start_utc, floored (may be negative); null until cancelled", default: null }

  - name: Attendee
    parent: null
    common_fields: false
    fields:
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id; the owning reservation" }
      - { name: full_name, type: string, source: input, description: "Attendee name" }
      - { name: age_years, type: integer, source: input, description: "Attendee age in whole years at event time", constraints: ">= 0" }
      - { name: waiver_signed, type: boolean, source: input, description: "Whether the liability/BYOB waiver is signed for this attendee", default: false }

  - name: WalkIn
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> StudioEvent.id; the event walked into" }
      - { name: party_name, type: string, source: input, description: "Walk-in party display name" }
      - { name: party_size, type: integer, source: input, description: "Number of walk-in seats", constraints: ">= 1" }
      - { name: include_supply_kit, type: boolean, source: input, description: "Whether the walk-in party takes supply kits", default: false }
      - { name: status, type: enum, source: system, description: "REGISTERED | CHECKED_IN | CANCELLED", default: "REGISTERED", constraints: "REGISTERED, CHECKED_IN, CANCELLED" }

  - name: GiftCard
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Redeemable gift-card code (unique)" }
      - { name: issued_value_cents, type: integer, source: input, description: "Face value at issuance in cents; immutable", constraints: ">= 1" }
      - { name: balance_cents, type: integer, source: computed, description: "Remaining redeemable balance; decreases on redemption; never negative", default: 0 }
      - { name: redeemed_cents, type: integer, source: computed, description: "Lifetime redeemed; balance_cents + redeemed_cents == issued_value_cents is conserved", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | DEPLETED; DEPLETED when balance_cents == 0", default: "ACTIVE", constraints: "ACTIVE, DEPLETED" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id; the reservation being paid" }
      - { name: method, type: enum, source: system, description: "GIFT_CARD | STUDIO_CREDIT | CARD; one Payment row per source tapped by the waterfall", constraints: "GIFT_CARD, STUDIO_CREDIT, CARD" }
      - { name: gift_card_id, type: string, source: system, description: "FK -> GiftCard.id; set only for GIFT_CARD payments, else null", default: null }
      - { name: amount_cents, type: integer, source: computed, description: "Amount drawn from this source by the payment waterfall", default: 0 }
      - { name: status, type: enum, source: system, description: "SETTLED | REVERSED", default: "SETTLED", constraints: "SETTLED, REVERSED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: StudioEvent
    field: status
    initial_state: DRAFT
    terminal_states: [CANCELLED, CLOSED]
    note: "Branching lifecycle. FULL auto-derives from seats_available reaching 0 and auto-reverts to OPEN when seats free up (cycle OPEN<->FULL)."
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /studio-ops/events/{id}/schedule"
        actor: StudioManager
        preconditions:
          - "At least one ArtistAssignment in status ASSIGNED references the event"
          - "Host Studio.status == ACTIVE"
          - "No studio-room time conflict with another non-CANCELLED event in the same studio"
        side_effects:
          - "status -> SCHEDULED"
          - "increments StudioEvent.version by 1"

      - from: SCHEDULED
        to: OPEN
        trigger: "POST /studio-ops/events/{id}/open"
        actor: StudioManager
        preconditions:
          - "event.status == SCHEDULED"
        side_effects:
          - "status -> OPEN (bookings now accepted)"
          - "increments StudioEvent.version by 1"

      - from: OPEN
        to: FULL
        trigger: "system (on reservation create / walk-in register when seats_available reaches 0)"
        actor: system
        preconditions:
          - "seats_available == 0 after the seat-consuming mutation"
        side_effects:
          - "status -> FULL"

      - from: FULL
        to: OPEN
        trigger: "system (on reservation / walk-in cancellation when seats_available becomes > 0)"
        actor: system
        preconditions:
          - "seats_available > 0 after the seat-releasing mutation"
        side_effects:
          - "status -> OPEN"

      - from: [OPEN, FULL]
        to: CLOSED
        trigger: "POST /studio-ops/events/{id}/close"
        actor: StudioManager
        preconditions:
          - "logical clock now >= start_utc (event has started or passed) — else ERR_EVENT_NOT_STARTED"
        side_effects:
          - "status -> CLOSED"
          - "Cascade: each Reservation still HELD or CONFIRMED -> NO_SHOW (seats released)"
          - "Each WalkIn still REGISTERED -> CHECKED_IN"
          - "settled_donation_cents computed over CHECKED_IN reservations (FUNDRAISER only)"
          - "increments StudioEvent.version by 1"

      - from: [DRAFT, SCHEDULED, OPEN, FULL]
        to: CANCELLED
        trigger: "POST /studio-ops/events/{id}/cancel"
        actor: StudioManager
        preconditions:
          - "event.status != CLOSED and != CANCELLED"
        side_effects:
          - "status -> CANCELLED"
          - "Cascade hop 1: each Reservation in HELD/CONFIRMED/CHECKED_IN -> CANCELLED with 100% credit (studio-initiated override of the ladder)"
          - "Cascade hop 2: each such Reservation with payment_status==PAID has its SETTLED CARD Payments -> REVERSED and payment_status -> REFUNDED"
          - "Cascade hop 3: each affected Customer.credit_balance_cents increased by the cancelled reservation's total_cents"
          - "Each ArtistAssignment in ASSIGNED -> RELEASED"
          - "Each WalkIn in REGISTERED/CHECKED_IN -> CANCELLED"
          - "increments StudioEvent.version by 1"

  - entity: Reservation
    field: status
    initial_state: HELD
    terminal_states: [CANCELLED, NO_SHOW]
    note: "Booking dimension. payment_status evolves independently (see the Reservation/payment_status machine). CONFIRMED->HELD revert handles payment reversal before check-in."
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /studio-ops/reservations/{id}/confirm"
        actor: [Customer, StudioManager]
        preconditions:
          - "reservation.payment_status == PAID"
          - "parent event.status IN {OPEN, FULL}"
        side_effects:
          - "status -> CONFIRMED"

      - from: CONFIRMED
        to: HELD
        trigger: "system (payment_status drops to UNPAID before check-in)"
        actor: system
        preconditions:
          - "reservation.payment_status != PAID"
        side_effects:
          - "status -> HELD (revert; seats remain reserved)"

      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /studio-ops/reservations/{id}/check-in"
        actor: FrontDesk
        preconditions:
          - "parent event.status IN {OPEN, FULL}"
          - "Attendee count on the reservation equals reservation.seats (else ERR_ATTENDEE_ROSTER_INCOMPLETE)"
          - "If event.byob_allowed: every Attendee has waiver_signed==true AND age_years >= event.min_age (else ERR_WAIVER_OR_AGE_FAIL)"
        side_effects:
          - "status -> CHECKED_IN"
          - "CanvasKitBatch.consumed_count increased by seats when include_supply_kit (capped at prepared_count)"

      - from: [HELD, CONFIRMED]
        to: CANCELLED
        trigger: "POST /studio-ops/reservations/{id}/cancel"
        actor: [Customer, StudioManager]
        preconditions:
          - "parent event.status != CLOSED and != CANCELLED"
        side_effects:
          - "cancelled_at_hours_before computed from clock now and event.start_utc"
          - "credit_granted_cents computed by cancellation_credit_ladder over total_cents"
          - "Cascade hop 2: if payment_status==PAID, SETTLED CARD Payments -> REVERSED and payment_status -> REFUNDED"
          - "Cascade hop 3: customer.credit_balance_cents increased by credit_granted_cents"
          - "status -> CANCELLED (seats released; parent seats_reserved recomputed; event FULL->OPEN if applicable; increments StudioEvent.version by 1)"

      - from: [HELD, CONFIRMED]
        to: NO_SHOW
        trigger: "system (parent event CLOSE while reservation not CHECKED_IN)"
        actor: system
        preconditions:
          - "parent event transitions to CLOSED"
        side_effects:
          - "status -> NO_SHOW (no credit granted; seats released; excluded from settled_donation)"

  - entity: Reservation
    field: payment_status
    initial_state: UNPAID
    terminal_states: []
    note: "Independent payment dimension on the same Reservation row, evolving as a separate state axis from booking status (two parallel state dimensions per Rule 3)."
    transitions:
      - from: UNPAID
        to: PAID
        trigger: "POST /studio-ops/reservations/{id}/pay"
        actor: [Customer, StudioManager]
        preconditions:
          - "reservation.status == HELD or CONFIRMED"
          - "Payment waterfall fully covers total_cents (gift cards + studio credit + card)"
        side_effects:
          - "Creates Payment rows per source tapped (gift_card_payment_waterfall)"
          - "GiftCard.balance_cents/redeemed_cents updated; customer.credit_balance_cents/credit_redeemed_cents updated"
          - "amount_paid_cents recomputed; payment_status -> PAID"

      - from: PAID
        to: REFUNDED
        trigger: "system (reservation or event cancellation reverses CARD payments)"
        actor: system
        preconditions:
          - "reservation moves to CANCELLED"
        side_effects:
          - "SETTLED CARD Payments -> REVERSED; payment_status -> REFUNDED"

      - from: PAID
        to: UNPAID
        trigger: "system (all Payments REVERSED while reservation still HELD)"
        actor: system
        preconditions:
          - "All Payments for the reservation are REVERSED while reservation.status == HELD"
        side_effects:
          - "payment_status -> UNPAID (drives CONFIRMED->HELD revert if it was confirmed)"

  - entity: GiftCard
    field: status
    initial_state: ACTIVE
    terminal_states: [DEPLETED]
    transitions:
      - from: ACTIVE
        to: DEPLETED
        trigger: "system (redemption brings balance_cents to 0)"
        actor: system
        preconditions:
          - "balance_cents == 0 after redemption"
        side_effects:
          - "status -> DEPLETED (no longer tappable by the waterfall)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: reservation-create-stale-event
    parent_entity: StudioEvent
    write_endpoint: "POST /studio-ops/reservations"
    occ_field: "expected_event_version"
    description: |
      Creating a Reservation against a StudioEvent whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another booking has just consumed seats (legitimately advancing the
      event toward FULL), so the current booker's view of remaining seats is
      stale and the reservation must be re-evaluated against fresh capacity.
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: reservation_pricing
    trigger: "Reservation create (POST /studio-ops/reservations)"
    algorithm: tiered_pricing
    formula: |
      base_cents = seats * event.price_cents_per_seat
      group_discount_pct =
          15 if seats >= 8
          10 if 4 <= seats <= 7
          0  if seats <= 3
      # ROUNDING ORDER IS PINNED: apply the percentage discount to the whole-cent
      # base FIRST via integer floor division, THEN add the kit charge
      # ("discount-then-add", NOT "add-then-discount").
      discounted_base = base_cents - (base_cents * group_discount_pct // 100)
      kit_charge_cents = (seats * event.kit_fee_cents) if include_supply_kit else 0
      total_cents = discounted_base + kit_charge_cents
    input_set: "Single reservation's own seats / kit flag against its parent event's price_cents_per_seat and kit_fee_cents."
    constants:
      TIER_LARGE_MIN_SEATS: 8
      TIER_LARGE_PCT: 15
      TIER_MID_MIN_SEATS: 4
      TIER_MID_PCT: 10
    precision: "integer cents; group discount via floor division (round toward zero)"

  - name: cancellation_credit_ladder
    trigger: "Reservation HELD/CONFIRMED -> CANCELLED (customer/manager-initiated)"
    algorithm: threshold
    formula: |
      hours_before = floor((event.start_utc - clock_now) / 3600 seconds)   # may be negative
      cancelled_at_hours_before = hours_before
      pct =
          100 if hours_before >= 48
          50  if 24 <= hours_before < 48
          0   if hours_before < 24
      credit_granted_cents = total_cents * pct // 100
    input_set: "One reservation's total_cents and the clock distance to its event start."
    constants:
      FULL_CREDIT_MIN_HOURS: 48
      HALF_CREDIT_MIN_HOURS: 24
      HALF_CREDIT_PCT: 50
    precision: "integer cents; floor division"
    variants:
      - name: provisional_quote
        when: "GET /studio-ops/reservations/{id}/cancellation-quote (what-if before cancelling)"
        difference: "Computes credit_granted_cents against the CURRENT clock without mutating; the realized credit at actual cancellation may differ once the clock advances into a lower tier."
      - name: studio_initiated_override
        when: "Reservation cancelled as a side effect of StudioEvent -> CANCELLED"
        difference: "Ladder is bypassed: pct is forced to 100 regardless of hours_before (studio-fault full credit)."

  - name: fundraiser_donation
    trigger: "Pledged: recomputed on reservation create/cancel for FUNDRAISER events. Settled: computed once on event CLOSE."
    algorithm: aggregation
    formula: |
      # Provisional (pledged) — forward-looking over still-active bookings:
      pledged_base = sum(r.total_cents for r in event.reservations if r.status IN {HELD, CONFIRMED})
      pledged_donation_cents = event.fundraiser_donation_pct * pledged_base // 100
      # Final (settled) — chronological over actual attendance at close:
      settled_base = sum(r.total_cents for r in event.reservations if r.status == CHECKED_IN)
      settled_donation_cents = event.fundraiser_donation_pct * settled_base // 100
    input_set: "Pledged includes HELD+CONFIRMED; settled includes only CHECKED_IN. Sum-then-multiply order is pinned (aggregate the base first, apply pct once, then floor)."
    constants: {}
    precision: "integer cents; single floor-division multiply (sum base first, then apply pct)"
    variants:
      - name: pledged
        when: "any time before event CLOSE"
        difference: "Input set is HELD+CONFIRMED reservations (optimistic)."
      - name: settled
        when: "at event CLOSE"
        difference: "Input set is CHECKED_IN reservations only (no-shows and cancellations excluded)."

  - name: gift_card_payment_waterfall
    trigger: "POST /studio-ops/reservations/{id}/pay"
    algorithm: waterfall_allocation
    formula: |
      remaining = reservation.total_cents
      # Bucket order is PINNED: (1) gift cards supplied in the request, processed by
      # GiftCard.created_at ASC; (2) studio-credit wallet; (3) card for the remainder.
      for gc in supplied_gift_cards ordered by GiftCard.created_at ASC:
          draw = min(gc.balance_cents, remaining)
          if draw > 0:
              Payment(method=GIFT_CARD, gift_card_id=gc.id, amount_cents=draw)
              gc.balance_cents -= draw; gc.redeemed_cents += draw
              if gc.balance_cents == 0: gc.status = DEPLETED
              remaining -= draw
      if use_studio_credit and customer.credit_balance_cents > 0:
          draw = min(customer.credit_balance_cents, remaining)
          if draw > 0:
              Payment(method=STUDIO_CREDIT, amount_cents=draw)
              customer.credit_balance_cents -= draw; customer.credit_redeemed_cents += draw
              remaining -= draw
      if remaining > 0:
          Payment(method=CARD, amount_cents=remaining); remaining = 0
      # payment succeeds only when remaining reaches 0 (always reachable via CARD)
    input_set: "Ordered gift cards (created_at ASC), then studio credit, then card remainder."
    constants: {}
    precision: "integer cents; exact allocation, no rounding"

  - name: event_seat_ledger
    trigger: "Reservation create/cancel/no-show, WalkIn register/cancel, event close"
    algorithm: aggregation
    formula: |
      seats_reserved  = sum(r.seats for r in reservations if r.status IN {HELD, CONFIRMED, CHECKED_IN})
      walk_in_seats   = sum(w.party_size for w in walkins if w.status IN {REGISTERED, CHECKED_IN})
      seats_available = max(0, seats_capacity - seats_reserved - walk_in_seats)
    input_set: "Active reservations and walk-ins on the event."
    constants: {}
    precision: "integer seats; seats_available floored at 0"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role permitted for the operation per §1.7; entity_backed Customer acting on a reservation must own it (X-User-ID == reservation.customer_id) and must book with own customer_id"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resource exists (studio/event/reservation/artist/gift-card/etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "Request body is well-formed: required fields present, enums valid, integers positive where required, pagination params within bounds"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all

  - priority: 5
    category: business_referential
    check: "Body-referenced FK rows exist: studio_id, event_id, customer_id, artist_id, reservation_id, supplied gift_card_ids"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "event create, reservation create, assignment create, kit-batch create, attendee create, walk-in register, pay"

  - priority: 6
    category: business_constraint
    check: "Unique constraints: customer email (case-insensitive) and gift card code must not collide with an existing row"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "customer create, gift-card create"

  - priority: 7
    category: state
    check: "Target resource in a valid state for the requested transition (event status, reservation booking/payment status, gift card status). For reservation create and walk-in register, the parent StudioEvent.status MUST be IN {OPEN, FULL}."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints, reservation create, walk-in register"

  - priority: 8
    category: state
    check: "Closing an event requires the logical clock now >= event.start_utc"
    error_id: ERR_EVENT_NOT_STARTED
    http_status: 409
    applies_to: "event close"

  - priority: 9
    category: business_constraint
    check: "booking_mode/event_type compatibility: PRIVATE only on PRIVATE_PARTY/CORPORATE; PUBLIC only on PUBLIC_CLASS/FUNDRAISER"
    error_id: ERR_BOOKING_MODE_MISMATCH
    http_status: 422
    applies_to: "reservation create"

  - priority: 10
    category: business_constraint
    check: "Artist must be ACTIVE to receive an assignment"
    error_id: ERR_ARTIST_INACTIVE
    http_status: 422
    applies_to: "assignment create"

  - priority: 11
    category: business_temporal
    check: "Artist double-booking: the artist has no other ASSIGNED assignment on an event whose [start_utc-30m, end_utc+30m) window overlaps this event (30-minute travel buffer; a gap of exactly 30 minutes is allowed)"
    error_id: ERR_ARTIST_DOUBLE_BOOKED
    http_status: 409
    applies_to: "assignment create"

  - priority: 12
    category: business_temporal
    check: "Studio room double-booking: no other non-CANCELLED StudioEvent in the same Studio has a half-open [start_utc, end_utc) window overlapping this event's window (adjacency end==start is allowed)"
    error_id: ERR_STUDIO_TIME_CONFLICT
    http_status: 409
    applies_to: "event create, event schedule"

  - priority: 13
    category: business_safety
    check: "BYOB age/waiver gate at check-in: on a byob_allowed event every Attendee must have waiver_signed==true and age_years >= event.min_age"
    error_id: ERR_WAIVER_OR_AGE_FAIL
    http_status: 422
    applies_to: "reservation check-in"

  - priority: 14
    category: business_constraint
    check: "Attendee roster completeness at check-in: number of Attendee rows equals reservation.seats"
    error_id: ERR_ATTENDEE_ROSTER_INCOMPLETE
    http_status: 422
    applies_to: "reservation check-in"

  - priority: 15
    category: business_constraint
    check: "Payment source health: every gift card supplied to the waterfall must be ACTIVE (non-DEPLETED). Any remainder after gift cards + studio credit is always charged to card, so a well-formed pay never fails on coverage."
    error_id: ERR_GIFT_CARD_DEPLETED
    http_status: 422
    applies_to: "reservation pay"

  - priority: 16
    category: business_fiscal
    check: "Seat capacity: reservation.seats (or walk-in party_size) must not exceed event.seats_available"
    error_id: ERR_INSUFFICIENT_SEATS
    http_status: 409
    applies_to: "reservation create, walk-in register"

  - priority: 17
    category: business_fiscal
    check: "Studio-credit debit via credit-adjustments must not drive credit_balance_cents below 0"
    error_id: ERR_CREDIT_INSUFFICIENT
    http_status: 422
    applies_to: "credit-adjustments"

  - priority: 18
    category: business_fiscal
    check: "OCC: expected_event_version must equal the event's current version on reservation create"
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412
    applies_to: "reservation create"

  - priority: 19
    category: business_constraint
    check: "Event config: seats_capacity <= host Studio.room_capacity_seats; end_utc strictly after start_utc; FUNDRAISER requires fundraiser_donation_pct in 1..100, non-FUNDRAISER requires 0"
    error_id: ERR_INVALID_EVENT_CONFIG
    http_status: 422
    applies_to: "event create"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock to an absolute UTC instant. Server startup default is 2026-04-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ now_utc: datetime }"
    side_effects: ["Logical clock set; subsequent time-gated rules evaluate against it"]

  # ---- Studio ----
  - method: POST
    path: "/studio-ops/studios"
    description: "Create a studio (room)"
    roles: [StudioManager, PlatformAdmin]
    code: 201
    input: [name, room_capacity_seats, "timezone?"]
    output: Studio
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/studio-ops/studios/{id}"
    description: "Get a studio"
    roles: [StudioManager, FrontDesk, Customer, PlatformAdmin]
    code: 200
    input: []
    output: Studio
    side_effects: []

  - method: GET
    path: "/studio-ops/studios"
    description: "List studios (paginated)"
    roles: [StudioManager, FrontDesk, Customer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Studio[]
    side_effects: []

  - method: POST
    path: "/studio-ops/studios/{id}/close"
    description: "Retire a studio room (ACTIVE -> CLOSED); CLOSED studios cannot have new events scheduled"
    roles: [StudioManager, PlatformAdmin]
    code: 200
    input: []
    output: Studio
    side_effects: ["status -> CLOSED"]

  # ---- Artist ----
  - method: POST
    path: "/studio-ops/artists"
    description: "Create an artist (instructor)"
    roles: [StudioManager, PlatformAdmin]
    code: 201
    input: [full_name, hourly_rate_cents]
    output: Artist
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/studio-ops/artists/{id}"
    description: "Get an artist"
    roles: [StudioManager, FrontDesk, PlatformAdmin]
    code: 200
    input: []
    output: Artist
    side_effects: []

  - method: POST
    path: "/studio-ops/artists/{id}/deactivate"
    description: "Mark an artist INACTIVE"
    roles: [StudioManager, PlatformAdmin]
    code: 200
    input: []
    output: Artist
    side_effects: ["status -> INACTIVE"]

  # ---- Customer ----
  - method: POST
    path: "/studio-ops/customers"
    description: "Register a customer"
    roles: [Customer, StudioManager, PlatformAdmin]
    code: 201
    input: [email, full_name, birthdate]
    output: Customer
    side_effects: ["credit_balance_cents=0, credit_redeemed_cents=0"]

  - method: GET
    path: "/studio-ops/customers/{id}"
    description: "Get a customer (with credit wallet)"
    roles: [Customer, StudioManager, PlatformAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/studio-ops/customers/{id}/credit-adjustments"
    description: "Operator grant/debit of studio credit (positive adds, negative debits, never below 0)"
    roles: [StudioManager, PlatformAdmin]
    code: 200
    input: [amount_cents, reason]
    output: Customer
    side_effects: ["credit_balance_cents adjusted; positive grant raises the conserved credit total"]

  # ---- Gift cards ----
  - method: POST
    path: "/studio-ops/gift-cards"
    description: "Issue a gift card"
    roles: [StudioManager, PlatformAdmin]
    code: 201
    input: [code, issued_value_cents]
    output: GiftCard
    side_effects: ["balance_cents=issued_value_cents, redeemed_cents=0, status=ACTIVE"]

  - method: GET
    path: "/studio-ops/gift-cards/{id}"
    description: "Get a gift card"
    roles: [Customer, StudioManager, PlatformAdmin]
    code: 200
    input: []
    output: GiftCard
    side_effects: []

  # ---- Studio events ----
  - method: POST
    path: "/studio-ops/events"
    description: "Create a studio event in DRAFT"
    roles: [StudioManager, PlatformAdmin]
    code: 201
    input: [studio_id, title, event_type, start_utc, end_utc, seats_capacity, price_cents_per_seat, "kit_fee_cents?", "byob_allowed?", "min_age?", "fundraiser_donation_pct?"]
    output: StudioEvent
    side_effects: ["status=DRAFT; rejects studio-room time conflict; validates seats_capacity<=room_capacity_seats and fundraiser config"]

  - method: GET
    path: "/studio-ops/events/{id}"
    description: "Get a studio event (with computed seat ledger and donation fields)"
    roles: [StudioManager, FrontDesk, Customer, PlatformAdmin]
    code: 200
    input: []
    output: StudioEvent
    side_effects: []

  - method: GET
    path: "/studio-ops/events"
    description: "List events (calendar; reverse-reachability for StudioEvent.studio_id)"
    roles: [StudioManager, FrontDesk, Customer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "studio_id?", "status?", "event_type?", "from_utc?", "to_utc?"]
    output: StudioEvent[]
    side_effects: []

  - method: POST
    path: "/studio-ops/events/{id}/schedule"
    description: "Schedule a DRAFT event (requires a staffed artist)"
    roles: [StudioManager, PlatformAdmin]
    code: 200
    input: []
    output: StudioEvent
    side_effects: ["DRAFT->SCHEDULED; re-checks studio-room time conflict; increments version"]

  - method: POST
    path: "/studio-ops/events/{id}/open"
    description: "Open a SCHEDULED event for booking"
    roles: [StudioManager, PlatformAdmin]
    code: 200
    input: []
    output: StudioEvent
    side_effects: ["SCHEDULED->OPEN; increments version"]

  - method: POST
    path: "/studio-ops/events/{id}/close"
    description: "Close an event after it has started"
    roles: [StudioManager, PlatformAdmin]
    code: 200
    input: []
    output: StudioEvent
    side_effects: ["OPEN/FULL->CLOSED; HELD/CONFIRMED reservations->NO_SHOW; REGISTERED walk-ins->CHECKED_IN; settled_donation computed; increments version"]

  - method: POST
    path: "/studio-ops/events/{id}/cancel"
    description: "Cancel an event (studio-initiated; full-credit cascade)"
    roles: [StudioManager, PlatformAdmin]
    code: 200
    input: []
    output: StudioEvent
    side_effects: ["->CANCELLED; reservations->CANCELLED with 100% credit; CARD payments REVERSED; credit wallets credited; assignments RELEASED; walk-ins CANCELLED; increments version"]

  # ---- Artist assignments ----
  - method: POST
    path: "/studio-ops/assignments"
    description: "Assign an artist to an event"
    roles: [StudioManager, PlatformAdmin]
    code: 201
    input: [event_id, artist_id]
    output: ArtistAssignment
    side_effects: ["status=ASSIGNED; rejects artist double-booking within 30m buffer; rejects INACTIVE artist"]

  - method: GET
    path: "/studio-ops/assignments/{id}"
    description: "Get an assignment"
    roles: [StudioManager, FrontDesk, PlatformAdmin]
    code: 200
    input: []
    output: ArtistAssignment
    side_effects: []

  - method: GET
    path: "/studio-ops/assignments"
    description: "List assignments (reverse-reachability for ArtistAssignment.event_id and .artist_id)"
    roles: [StudioManager, FrontDesk, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "event_id?", "artist_id?", "status?"]
    output: ArtistAssignment[]
    side_effects: []

  - method: POST
    path: "/studio-ops/assignments/{id}/release"
    description: "Release an artist assignment"
    roles: [StudioManager, PlatformAdmin]
    code: 200
    input: []
    output: ArtistAssignment
    side_effects: ["ASSIGNED->RELEASED"]

  # ---- Canvas kit batches ----
  - method: POST
    path: "/studio-ops/kit-batches"
    description: "Stock a canvas/supply kit batch for an event"
    roles: [StudioManager, PlatformAdmin]
    code: 201
    input: [event_id, sku, prepared_count]
    output: CanvasKitBatch
    side_effects: ["consumed_count=0"]

  - method: GET
    path: "/studio-ops/kit-batches/{id}"
    description: "Get a kit batch"
    roles: [StudioManager, FrontDesk, PlatformAdmin]
    code: 200
    input: []
    output: CanvasKitBatch
    side_effects: []

  - method: GET
    path: "/studio-ops/kit-batches"
    description: "List kit batches (reverse-reachability for CanvasKitBatch.event_id)"
    roles: [StudioManager, FrontDesk, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "event_id?"]
    output: CanvasKitBatch[]
    side_effects: []

  # ---- Reservations ----
  - method: POST
    path: "/studio-ops/reservations"
    description: "Create a seat reservation (HELD). Requires the parent StudioEvent.status IN {OPEN, FULL} (else ERR_INVALID_STATE; note FULL still rejects on seats). OCC on the parent event."
    roles: [Customer, StudioManager, PlatformAdmin]
    code: 201
    input: [event_id, customer_id, booking_mode, seats, expected_event_version, "include_supply_kit?"]
    output: Reservation
    side_effects: ["status=HELD, payment_status=UNPAID; reservation_pricing computed; event_seat_ledger recomputed; event OPEN->FULL when seats_available hits 0; pledged_donation recomputed (FUNDRAISER); increments StudioEvent.version by 1"]

  - method: GET
    path: "/studio-ops/reservations/{id}"
    description: "Get a reservation"
    roles: [Customer, FrontDesk, StudioManager, PlatformAdmin]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: GET
    path: "/studio-ops/reservations"
    description: "List reservations (reverse-reachability for Reservation.event_id and .customer_id)"
    roles: [FrontDesk, StudioManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "event_id?", "customer_id?", "status?", "payment_status?"]
    output: Reservation[]
    side_effects: []

  - method: GET
    path: "/studio-ops/reservations/{id}/cancellation-quote"
    description: "What-if provisional cancellation credit at the current clock (no mutation)"
    roles: [Customer, StudioManager, PlatformAdmin]
    code: 200
    input: []
    output: "{ hours_before: integer, credit_pct: integer, credit_granted_cents: integer }"
    side_effects: []

  - method: POST
    path: "/studio-ops/reservations/{id}/pay"
    description: "Pay a reservation via gift-card/credit/card waterfall"
    roles: [Customer, StudioManager, PlatformAdmin]
    code: 200
    input: ["gift_card_ids?", "use_studio_credit?"]
    output: Reservation
    side_effects: ["gift_card_payment_waterfall runs; Payment rows SETTLED; gift card + wallet balances updated; payment_status->PAID"]

  - method: POST
    path: "/studio-ops/reservations/{id}/confirm"
    description: "Confirm a paid HELD reservation"
    roles: [Customer, StudioManager, PlatformAdmin]
    code: 200
    input: []
    output: Reservation
    side_effects: ["HELD->CONFIRMED (requires payment_status==PAID)"]

  - method: POST
    path: "/studio-ops/reservations/{id}/check-in"
    description: "Check in a confirmed reservation (BYOB age/waiver gate)"
    roles: [FrontDesk, StudioManager, PlatformAdmin]
    code: 200
    input: []
    output: Reservation
    side_effects: ["CONFIRMED->CHECKED_IN; consumes kits when include_supply_kit"]

  - method: POST
    path: "/studio-ops/reservations/{id}/cancel"
    description: "Cancel a reservation (credit ladder)"
    roles: [Customer, StudioManager, PlatformAdmin]
    code: 200
    input: []
    output: Reservation
    side_effects: ["->CANCELLED; cancellation_credit_ladder computes credit_granted_cents; CARD payments REVERSED->payment_status REFUNDED; customer credit wallet credited; seats released; event FULL->OPEN; increments StudioEvent.version by 1"]

  # ---- Attendees ----
  - method: POST
    path: "/studio-ops/attendees"
    description: "Add an attendee (waiver/age roster) to a reservation"
    roles: [Customer, FrontDesk, StudioManager, PlatformAdmin]
    code: 201
    input: [reservation_id, full_name, age_years, "waiver_signed?"]
    output: Attendee
    side_effects: []

  - method: GET
    path: "/studio-ops/attendees/{id}"
    description: "Get an attendee"
    roles: [Customer, FrontDesk, StudioManager, PlatformAdmin]
    code: 200
    input: []
    output: Attendee
    side_effects: []

  - method: GET
    path: "/studio-ops/attendees"
    description: "List attendees (reverse-reachability for Attendee.reservation_id)"
    roles: [Customer, FrontDesk, StudioManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "reservation_id?"]
    output: Attendee[]
    side_effects: []

  # ---- Payments ----
  - method: GET
    path: "/studio-ops/payments/{id}"
    description: "Get a payment"
    roles: [Customer, StudioManager, PlatformAdmin]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: GET
    path: "/studio-ops/payments"
    description: "List payments (reverse-reachability for Payment.reservation_id and .gift_card_id)"
    roles: [Customer, StudioManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "reservation_id?", "gift_card_id?", "method?", "status?"]
    output: Payment[]
    side_effects: []

  # ---- Walk-ins ----
  - method: POST
    path: "/studio-ops/walk-ins"
    description: "Register a walk-in party (consumes seats immediately)"
    roles: [FrontDesk, StudioManager, PlatformAdmin]
    code: 201
    input: [event_id, party_name, party_size, "include_supply_kit?"]
    output: WalkIn
    side_effects: ["status=REGISTERED; event_seat_ledger recomputed; event OPEN->FULL when seats_available hits 0"]

  - method: GET
    path: "/studio-ops/walk-ins/{id}"
    description: "Get a walk-in"
    roles: [FrontDesk, StudioManager, PlatformAdmin]
    code: 200
    input: []
    output: WalkIn
    side_effects: []

  - method: GET
    path: "/studio-ops/walk-ins"
    description: "List walk-ins (reverse-reachability for WalkIn.event_id)"
    roles: [FrontDesk, StudioManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "event_id?", "status?"]
    output: WalkIn[]
    side_effects: []

  - method: POST
    path: "/studio-ops/walk-ins/{id}/cancel"
    description: "Cancel a walk-in (releases seats)"
    roles: [FrontDesk, StudioManager, PlatformAdmin]
    code: 200
    input: []
    output: WalkIn
    side_effects: ["->CANCELLED; seats released; event FULL->OPEN"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the operation, or Customer acting on a reservation they do not own / booking with another customer_id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource (studio/event/reservation/artist/etc.) does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 422, condition: "Body-referenced entity (studio_id, event_id, customer_id, artist_id, reservation_id, gift_card_ids) does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_BOOKING_MODE_MISMATCH, http: 422, condition: "booking_mode incompatible with event_type (PRIVATE only on PRIVATE_PARTY/CORPORATE; PUBLIC only on PUBLIC_CLASS/FUNDRAISER)" }
  - { id: ERR_ARTIST_DOUBLE_BOOKED, http: 409, condition: "Artist already ASSIGNED to an overlapping event within the 30-minute travel buffer" }
  - { id: ERR_STUDIO_TIME_CONFLICT, http: 409, condition: "Another non-CANCELLED event in the same studio has an overlapping half-open time window" }
  - { id: ERR_WAIVER_OR_AGE_FAIL, http: 422, condition: "Check-in on a BYOB event with an attendee under min_age or without a signed waiver" }
  - { id: ERR_ATTENDEE_ROSTER_INCOMPLETE, http: 422, condition: "Attendee count does not equal reservation.seats at check-in" }
  - { id: ERR_INSUFFICIENT_SEATS, http: 409, condition: "Requested seats / party_size exceed event.seats_available" }
  - { id: ERR_STALE_EVENT_VERSION, http: 412, condition: "expected_event_version does not match the event's current version on reservation create (OCC)" }
  - { id: ERR_INVALID_EVENT_CONFIG, http: 422, condition: "seats_capacity > room_capacity_seats, end_utc<=start_utc, or invalid fundraiser_donation_pct for event_type" }
  - { id: ERR_GIFT_CARD_DEPLETED, http: 422, condition: "A supplied gift card is DEPLETED (zero balance) when tapped by the waterfall" }
  - { id: ERR_ARTIST_INACTIVE, http: 422, condition: "Assigning an INACTIVE artist to an event" }
  - { id: ERR_EVENT_NOT_STARTED, http: 409, condition: "Closing an event before its start_utc (clock now < start_utc)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request: missing required field, bad enum, non-positive seats, bad pagination param" }
  - { id: ERR_DUPLICATE_RESOURCE, http: 409, condition: "Duplicate unique value (customer email, gift card code)" }
  - { id: ERR_CREDIT_INSUFFICIENT, http: 422, condition: "Credit-adjustment debit would drive credit_balance_cents below 0" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: StudioManager
    description: "Operates studios, events, artists, kit batches, gift cards; can act on any reservation on behalf of the studio."
    identity: opaque
    exclusive_operations:
      - "POST /studio-ops/studios — create studio"
      - "POST /studio-ops/artists — create artist; POST .../artists/{id}/deactivate"
      - "POST /studio-ops/events — create event; .../events/{id}/schedule|open|close|cancel"
      - "POST /studio-ops/assignments and .../assignments/{id}/release — staffing"
      - "POST /studio-ops/kit-batches — stock kits"
      - "POST /studio-ops/gift-cards — issue gift card"
      - "POST /studio-ops/customers/{id}/credit-adjustments — adjust studio credit"
    shared_operations:
      - "GET endpoints (studios, events, artists, assignments, reservations, payments, etc.)"
      - "POST /studio-ops/reservations and reservation lifecycle (pay/confirm/cancel) on behalf of a customer"

  - name: Customer
    description: "Books seats for events, pays, confirms, and cancels their own reservations."
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "POST /studio-ops/customers — self-register"
      - "GET /studio-ops/customers/{id} — own profile"
      - "POST /studio-ops/reservations — book seats (customer_id must equal own id)"
      - "POST /studio-ops/reservations/{id}/pay|confirm|cancel — only own reservations"
      - "POST /studio-ops/attendees — own reservation roster"
      - "GET /studio-ops/reservations/{id}/cancellation-quote; GET event/studio calendar"

  - name: FrontDesk
    description: "Operational floor role: registers walk-ins and checks in attendees on the day of the event."
    identity: opaque
    exclusive_operations:
      - "POST /studio-ops/walk-ins — register walk-in; .../walk-ins/{id}/cancel"
      - "POST /studio-ops/reservations/{id}/check-in — check in attendees"
    shared_operations:
      - "GET endpoints for events, reservations, attendees, walk-ins, assignments, kit-batches"

  - name: PlatformAdmin
    description: "Operator/superuser for clock control, seeding, and any operation (superset)."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "All StudioManager, FrontDesk, and Customer operations (operator override)"
