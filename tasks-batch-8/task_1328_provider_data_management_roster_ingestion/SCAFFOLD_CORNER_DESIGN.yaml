scaffold_corner_design:
  # ===================================================================
  # Section: entities — creation, defaults, system/computed fields,
  # enum/type constraints, not-found, parent relationships.
  # ===================================================================
  - section: entities
    instances:
      - name: roster_source_creation_defaults_active
        claim_type: creation
        grounds: [entities.RosterSource.fields.status]
        distinguishing_aspect: "POST /pdm/roster-sources returns 201 with status=ACTIVE and version=1; client-supplied status field is ignored."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
          trigger:
            - call: "POST /pdm/roster-sources"
              payload: { source_code: "E1", display_name: "E1", format: "CSV", precedence_rank: 1, freshness_sla_days: 90 }
              as: DataSteward
              captures: { e1_id: $.data.id, e1_status: $.data.status, e1_v: $.data.version }
          assert:
            - "RosterSource.status == ACTIVE"
            - "RosterSource.version == 1"

      - name: provider_manual_create_initial_score_zero
        claim_type: computed_field
        grounds: [entities.Provider.fields.current_quality_score]
        distinguishing_aspect: "Manual provider create triggers data_quality_scoring; with zero attributes the completeness component is 0 and total_score is deterministic (0+0+20+10=30)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
          trigger:
            - call: "POST /pdm/providers"
              payload: { npi: "1234567893", tin: "123456789", location_key: "LOC1" }
              as: DataSteward
              captures: { p_id: $.data.id, p_score: $.data.current_quality_score }
          assert:
            - "Provider.current_quality_score == 30 (completeness 0 + freshness 0 + conflict 20 + attestation 10)"

      - name: roster_row_system_fields_input_ignored
        claim_type: system_field
        grounds: [entities.RosterRow.fields.row_index]
        distinguishing_aspect: "row_index is system-assigned during parse; any client-supplied row_index is ignored."
        test_recipe:
          setup: ["source + file registered"]
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/roster-sources"
              payload: { source_code: "E2", display_name: "E2", format: "CSV", precedence_rank: 1, freshness_sla_days: 90 }
              as: DataSteward
              captures: { src_e2: $.data.id }
            - call: "POST /pdm/roster-files"
              payload: { roster_source_id: "${src_e2}", external_file_ref: "e2f", declared_row_count: 1, checksum: "e2c" }
              as: IntakeOperator
              as_user_id: "op_intake_1"
              captures: { fe2_id: $.data.id }
          trigger:
            - call: "POST /pdm/roster-files/${fe2_id}/parse"
              payload: {}
              as: IntakeOperator
            - call: "GET /pdm/roster-files/${fe2_id}/roster-rows"
              payload: {}
              as: IntakeOperator
              captures: { row_idx: "$.data[0].row_index" }
          assert:
            - "RosterRow.row_index == 0 (server-assigned)"

      - name: roster_source_enum_format_invalid_rejected
        claim_type: type_constraint
        grounds: [entities.RosterSource.fields.format]
        distinguishing_aspect: "format must be one of CSV|XLSX|JSON|FHIR|FIXED_WIDTH; an out-of-enum value returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
          trigger:
            - call: "POST /pdm/roster-sources"
              payload: { source_code: "E3", display_name: "E3", format: "YAML", precedence_rank: 1, freshness_sla_days: 90 }
              as: DataSteward
              captures: { e3_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: provider_attribute_term_before_effective_rejected
        claim_type: type_constraint
        grounds: ["validations[priority=14]"]
        distinguishing_aspect: "term_date must be strictly > effective_date; term == effective is rejected (zero-length intervals never persist)."
        test_recipe:
          setup: ["provider exists"]
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/providers"
              payload: { npi: "1234567893", tin: "123456789", location_key: "LOC1" }
              as: DataSteward
              captures: { p_e4: $.data.id }
          trigger:
            - call: "POST /pdm/providers/${p_e4}/attributes"
              payload: { attribute_group: "CONTACT", attribute_key: "phone", attribute_value: "V", effective_date: "2026-01-01", term_date: "2026-01-01" }
              as: DataSteward
              captures: { e4_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_DATE_RANGE"

      - name: distribution_item_immutable_no_update_endpoint
        claim_type: immutability
        grounds: [entities.DistributionItem]
        distinguishing_aspect: "DistributionItem has common_fields=false; no PATCH/PUT endpoint exists and GET-by-id is absent — items are readable only via the batch list."
        test_recipe:
          setup: ["a published batch with one item"]
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/providers"
              payload: { npi: "1234567893", tin: "123456789", location_key: "LOC1" }
              as: DataSteward
              captures: { p_e5: $.data.id }
            - call: "POST /pdm/distribution-targets"
              payload: { target_code: "CLAIMS", endpoint_uri: "sftp://c", required_quality_floor: 0 }
              as: DistributionOperator
              captures: { tgt_e5: $.data.id }
            - call: "POST /pdm/distribution-batches"
              payload: { distribution_target_id: "${tgt_e5}" }
              as: DistributionOperator
              captures: { b_e5: $.data.id }
            - call: "POST /pdm/distribution-batches/${b_e5}/publish"
              payload: {}
              as: DistributionOperator
          trigger:
            - call: "GET /pdm/distribution-batches/${b_e5}/items"
              payload: {}
              as: DistributionOperator
          assert:
            - "Items list returns objects WITHOUT updated_at and WITHOUT version (common_fields=false)"

      - name: roster_row_wrong_parent_returns_not_found
        claim_type: parent_relationship
        grounds: [entities.RosterRow.parent]
        distinguishing_aspect: "GET /pdm/roster-files/{id}/roster-rows with a valid row id belonging to a different file returns ERR_NOT_FOUND (parent-chain scoping)."
        test_recipe:
          setup: ["two files F1, F2 each with one row"]
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/roster-sources"
              payload: { source_code: "E6", display_name: "E6", format: "CSV", precedence_rank: 1, freshness_sla_days: 90 }
              as: DataSteward
              captures: { src_e6: $.data.id }
            - call: "POST /pdm/roster-files"
              payload: { roster_source_id: "${src_e6}", external_file_ref: "e6a", declared_row_count: 1, checksum: "e6a" }
              as: IntakeOperator
              as_user_id: "op_intake_1"
              captures: { fe6a: $.data.id }
            - call: "POST /pdm/roster-files/${fe6a}/parse"
              payload: {}
              as: IntakeOperator
          trigger:
            - call: "GET /pdm/roster-files/00000000-0000-0000-0000-000000000000/roster-rows"
              payload: {}
              as: IntakeOperator
              captures: { e6_err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"

  # ===================================================================
  # Section: state_machines — valid/invalid transitions, terminal
  # lockdown, side effects, idempotency, initial state.
  # ===================================================================
  - section: state_machines
    instances:
      - name: roster_file_commit_from_received_invalid
        claim_type: invalid_transition
        grounds: [state_machines.RosterFile.transitions.RECEIVED_to_COMMITTED]
        distinguishing_aspect: "Commit from RECEIVED (skipping parse/normalize/validate) returns ERR_INVALID_STATE; no side effects fire."
        test_recipe:
          setup: ["file in RECEIVED"]
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/roster-sources"
              payload: { source_code: "S1", display_name: "S1", format: "CSV", precedence_rank: 1, freshness_sla_days: 90 }
              as: DataSteward
              captures: { src_s1: $.data.id }
            - call: "POST /pdm/roster-files"
              payload: { roster_source_id: "${src_s1}", external_file_ref: "s1f", declared_row_count: 0, checksum: "s1c" }
              as: IntakeOperator
              as_user_id: "op_intake_1"
              captures: { fs1_id: $.data.id, fs1_v: $.data.version }
          trigger:
            - call: "POST /pdm/roster-files/${fs1_id}/commit"
              payload: { expected_roster_file_version: "${fs1_v}" }
              as: IntakeOperator
              as_user_id: "op_intake_2"
              captures: { s1_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "RosterFile.status == RECEIVED"

      - name: distribution_batch_terminal_acked_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.DistributionBatch]
        distinguishing_aspect: "From ACKED no further transitions exist; publish/fail/discard all return ERR_INVALID_STATE."
        test_recipe:
          setup: ["batch in ACKED"]
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/distribution-targets"
              payload: { target_code: "CLAIMS", endpoint_uri: "sftp://c", required_quality_floor: 0 }
              as: DistributionOperator
              captures: { tgt_s2: $.data.id }
            - call: "POST /pdm/distribution-batches"
              payload: { distribution_target_id: "${tgt_s2}" }
              as: DistributionOperator
              captures: { b_s2: $.data.id }
            - call: "POST /pdm/distribution-batches/${b_s2}/publish"
              payload: {}
              as: DistributionOperator
            - call: "POST /pdm/distribution-batches/${b_s2}/ack"
              payload: {}
              as: DistributionOperator
          trigger:
            - call: "POST /pdm/distribution-batches/${b_s2}/fail"
              payload: { failure_reason: "late" }
              as: DistributionOperator
              captures: { s2_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "DistributionBatch.status == ACKED"

      - name: provider_merged_terminal_no_reinstate
        claim_type: terminal_lockdown
        grounds: [state_machines.Provider]
        distinguishing_aspect: "A MERGED provider cannot be reinstated, suspended, or terminated; all lifecycle endpoints return ERR_INVALID_STATE."
        test_recipe:
          setup: ["providers A and B; B merged into A"]
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/providers"
              payload: { npi: "1234567893", tin: "123456789", location_key: "LOC1" }
              as: DataSteward
              captures: { p_s3a: $.data.id }
            - call: "POST /pdm/providers"
              payload: { npi: "1234567894", tin: "123456789", location_key: "LOC2" }
              as: DataSteward
              captures: { p_s3b: $.data.id, p_s3b_v: $.data.version }
            - call: "POST /pdm/provider-merges"
              payload: { survivor_provider_id: "${p_s3a}", merged_provider_id: "${p_s3b}", rationale: "dup", expected_provider_version: "${p_s3b_v}" }
              as: DataSteward
          trigger:
            - call: "POST /pdm/providers/${p_s3b}/suspend"
              payload: {}
              as: DataSteward
              captures: { s3_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: roster_row_reject_idempotency_second_reject_fails
        claim_type: idempotency
        grounds: [state_machines.RosterRow.transitions]
        distinguishing_aspect: "Rejecting an already-REJECTED row returns ERR_INVALID_STATE (not silent success); terminal states absorb no duplicate triggers."
        test_recipe:
          setup: ["file parsed; row manually rejected"]
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/roster-sources"
              payload: { source_code: "S4", display_name: "S4", format: "CSV", precedence_rank: 1, freshness_sla_days: 90 }
              as: DataSteward
              captures: { src_s4: $.data.id }
            - call: "POST /pdm/roster-files"
              payload: { roster_source_id: "${src_s4}", external_file_ref: "s4f", declared_row_count: 1, checksum: "s4c" }
              as: IntakeOperator
              as_user_id: "op_intake_1"
              captures: { fs4_id: $.data.id }
            - call: "POST /pdm/roster-files/${fs4_id}/parse"
              payload: {}
              as: IntakeOperator
            - call: "GET /pdm/roster-files/${fs4_id}/roster-rows"
              payload: {}
              as: IntakeOperator
              captures: { row_s4: "$.data[0].id" }
            - call: "POST /pdm/roster-rows/${row_s4}/reject"
              payload: { reject_reason: "MALFORMED_NPI" }
              as: IntakeOperator
          trigger:
            - call: "POST /pdm/roster-rows/${row_s4}/reject"
              payload: { reject_reason: "MALFORMED_TIN" }
              as: IntakeOperator
              captures: { s4_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "RosterRow.reject_reason remains MALFORMED_NPI"

      - name: roster_source_inflight_suspend_blocked
        claim_type: precondition_enforcement
        grounds: [state_machines.RosterSource.transitions, "errors[ERR_SOURCE_HAS_INFLIGHT_FILE]"]
        distinguishing_aspect: "Suspend is rejected while any file for the source is in RECEIVED/PARSED/NORMALIZED/VALIDATED."
        test_recipe:
          setup: ["source with one file in RECEIVED"]
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/roster-sources"
              payload: { source_code: "S5", display_name: "S5", format: "CSV", precedence_rank: 1, freshness_sla_days: 90 }
              as: DataSteward
              captures: { src_s5: $.data.id }
            - call: "POST /pdm/roster-files"
              payload: { roster_source_id: "${src_s5}", external_file_ref: "s5f", declared_row_count: 0, checksum: "s5c" }
              as: IntakeOperator
              as_user_id: "op_intake_1"
          trigger:
            - call: "POST /pdm/roster-sources/${src_s5}/suspend"
              payload: {}
              as: DataSteward
              captures: { s5_err: $.data.error_id }
          assert:
            - "error_id == ERR_SOURCE_HAS_INFLIGHT_FILE"
            - "RosterSource.status == ACTIVE"

      - name: roster_file_supersede_requires_replacement
        claim_type: precondition_enforcement
        grounds: ["validations[priority=28]"]
        distinguishing_aspect: "Supersede of a COMMITTED file without a VALIDATED/COMMITTED replacement returns ERR_NO_REPLACEMENT_FILE."
        test_recipe:
          setup: ["file committed; no replacement exists"]
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/roster-sources"
              payload: { source_code: "S6", display_name: "S6", format: "CSV", precedence_rank: 1, freshness_sla_days: 90 }
              as: DataSteward
              captures: { src_s6: $.data.id }
            - call: "POST /pdm/roster-files"
              payload: { roster_source_id: "${src_s6}", external_file_ref: "s6f", declared_row_count: 0, checksum: "s6c" }
              as: IntakeOperator
              as_user_id: "op_intake_1"
              captures: { fs6_id: $.data.id }
            - call: "POST /pdm/roster-files/${fs6_id}/parse"
              payload: {}
              as: IntakeOperator
            - call: "POST /pdm/roster-files/${fs6_id}/normalize"
              payload: {}
              as: IntakeOperator
            - call: "POST /pdm/roster-files/${fs6_id}/validate"
              payload: {}
              as: IntakeOperator
            - call: "GET /pdm/roster-files/${fs6_id}"
              payload: {}
              as: IntakeOperator
              captures: { fs6_v: $.data.version }
            - call: "POST /pdm/roster-files/${fs6_id}/commit"
              payload: { expected_roster_file_version: "${fs6_v}" }
              as: IntakeOperator
              as_user_id: "op_intake_2"
          trigger:
            - call: "POST /pdm/roster-files/${fs6_id}/supersede"
              payload: {}
              as: DataSteward
              captures: { s6_err: $.data.error_id }
          assert:
            - "error_id == ERR_NO_REPLACEMENT_FILE"

  # ===================================================================
  # Section: calculations — correct results, input-set filtering,
  # constants, precision, variant selection, reconciliation.
  # ===================================================================
  - section: calculations
    instances:
      - name: quality_score_completeness_rounding_half_up
        claim_type: precision
        grounds: [calculations.data_quality_scoring]
        distinguishing_aspect: "completeness uses round_half_up exactly once at 40*present/10: present=1 gives 4, present=5 gives 20, present=6 gives 24."
        test_recipe:
          setup: ["provider with exactly 5 of 10 required keys ACTIVE"]
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/providers"
              payload: { npi: "1234567893", tin: "123456789", location_key: "LOC1" }
              as: DataSteward
              captures: { p_c1: $.data.id }
          trigger:
            - call: "POST /pdm/providers/${p_c1}/quality-scores/recompute"
              payload: {}
              as: DataSteward
              captures: { c1_comp: $.data.completeness_component }
          assert:
            - "completeness_component == 0 for a freshly created provider (0 of 10 keys)"

      - name: identity_resolution_tie_break_created_at
        claims: null
        claim_type: correct_result
        grounds: [calculations.identity_resolution]
        distinguishing_aspect: "When two candidates tie at the same match_score in [70,99], the candidate with earliest Provider.created_at wins; id is never consulted."
        test_recipe:
          setup: ["two providers with identical npi and tin but different location_key; row matches both at score 80 (npi+tin)"]
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/roster-sources"
              payload: { source_code: "C2", display_name: "C2", format: "CSV", precedence_rank: 1, freshness_sla_days: 90 }
              as: DataSteward
              captures: { src_c2: $.data.id }
            - call: "POST /pdm/providers"
              payload: { npi: "1234567893", tin: "123456789", location_key: "LOC_A" }
              as: DataSteward
              captures: { p_c2a: $.data.id }
            - call: "POST /pdm/providers"
              payload: { npi: "1234567893", tin: "123456789", location_key: "LOC_B" }
              as: DataSteward
              captures: { p_c2b: $.data.id }
            - call: "POST /pdm/roster-files"
              payload: { roster_source_id: "${src_c2}", external_file_ref: "c2f", declared_row_count: 1, checksum: "c2c" }
              as: IntakeOperator
              as_user_id: "op_intake_1"
              captures: { fc2_id: $.data.id }
            - call: "POST /pdm/roster-files/${fc2_id}/parse"
              payload: {}
              as: IntakeOperator
            - call: "POST /pdm/roster-files/${fc2_id}/normalize"
              payload: {}
              as: IntakeOperator
          trigger:
            - call: "POST /pdm/roster-files/${fc2_id}/validate"
              payload: {}
              as: IntakeOperator
            - call: "GET /pdm/roster-files/${fc2_id}/roster-rows"
              payload: {}
              as: IntakeOperator
              captures: { c2_row_status: "$.data[0].status" }
          assert:
            - "Row status == CONFLICT (two candidates >= 70 triggers ambiguity, tie-break does NOT auto-resolve at 80 each)"

      - name: conflicting_source_precedence_higher_rank_wins
        claim_type: correct_result
        grounds: [calculations.conflicting_source_precedence]
        distinguishing_aspect: "Challenger from a strictly-lower precedence_rank auto-wins: incumbent SUPERSEDED, challenger ACTIVE, no AttributeConflict created."
        test_recipe:
          setup: ["provider with phone from rank-5 source; incoming rank-1 source asserts different phone same effective date"]
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/roster-sources"
              payload: { source_code: "C3LO", display_name: "lo", format: "CSV", precedence_rank: 5, freshness_sla_days: 90 }
              as: DataSteward
              captures: { src_c3lo: $.data.id }
            - call: "POST /pdm/roster-sources"
              payload: { source_code: "C3HI", display_name: "hi", format: "CSV", precedence_rank: 1, freshness_sla_days: 90 }
              as: DataSteward
              captures: { src_c3hi: $.data.id }
            - call: "POST /pdm/providers"
              payload: { npi: "1234567893", tin: "123456789", location_key: "LOC1" }
              as: DataSteward
              captures: { p_c3: $.data.id }
            - call: "POST /pdm/providers/${p_c3}/attributes"
              payload: { attribute_group: "CONTACT", attribute_key: "phone", attribute_value: "LO", effective_date: "2026-08-01" }
              as: DataSteward
              captures: { attr_c3_lo: $.data.id }
          trigger:
            - call: "POST /pdm/providers/${p_c3}/attributes"
              payload: { attribute_group: "CONTACT", attribute_key: "phone", attribute_value: "HI", effective_date: "2026-08-01" }
              as: DataSteward
              captures: { attr_c3_hi: $.data.id }
            - call: "GET /pdm/attribute-conflicts"
              payload: {}
              as: DataSteward
          assert:
            - "challenger (HI) attribute.status == ACTIVE"
            - "incumbent (LO) attribute.status == SUPERSEDED"
            - "AttributeConflict list is empty (auto-resolution, no OPEN record)"

      - name: distribution_snapshot_change_kind_classification
        claim_type: input_set_filtering
        grounds: [calculations.distribution_snapshot_selection]
        distinguishing_aspect: "Snapshot vs latest ACKED baseline: new provider -> ADD; payload-changed -> UPDATE; terminated -> TERM; below-floor -> QUALITY_DROP_EXCLUDED."
        test_recipe:
          setup: ["one ACKED baseline batch containing provider A; A terminated since baseline; new provider B active"]
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/providers"
              payload: { npi: "1234567893", tin: "123456789", location_key: "LOC1" }
              as: DataSteward
              captures: { p_c4a: $.data.id }
            - call: "POST /pdm/distribution-targets"
              payload: { target_code: "CLAIMS", endpoint_uri: "sftp://c", required_quality_floor: 0 }
              as: DistributionOperator
              captures: { tgt_c4: $.data.id }
            - call: "POST /pdm/distribution-batches"
              payload: { distribution_target_id: "${tgt_c4}" }
              as: DistributionOperator
              captures: { b_c4_1: $.data.id }
            - call: "POST /pdm/distribution-batches/${b_c4_1}/publish"
              payload: {}
              as: DistributionOperator
            - call: "POST /pdm/distribution-batches/${b_c4_1}/ack"
              payload: {}
              as: DistributionOperator
            - call: "POST /pdm/providers/${p_c4a}/terminate"
              payload: {}
              as: DataSteward
            - call: "POST /pdm/providers"
              payload: { npi: "1234567894", tin: "123456789", location_key: "LOC2" }
              as: DataSteward
              captures: { p_c4b: $.data.id }
          trigger:
            - call: "POST /pdm/distribution-batches"
              payload: { distribution_target_id: "${tgt_c4}" }
              as: DistributionOperator
              captures: { b_c4_2: $.data.id }
            - call: "POST /pdm/distribution-batches/${b_c4_2}/publish"
              payload: {}
              as: DistributionOperator
            - call: "GET /pdm/distribution-batches/${b_c4_2}/items"
              payload: {}
              as: DistributionOperator
          assert:
            - "Item for provider A has change_kind == TERM"
            - "Item for provider B has change_kind == ADD"
            - "provider_count == 2"

      - name: retro_variant_split_creates_right_half
        claim_type: variant_divergence
        grounds: [calculations.attribute_effective_dating]
        distinguishing_aspect: "retro_with_split variant: incoming retro interval strictly inside an existing interval with a non-null term splits the original into two ACTIVE halves around the newcomer."
        test_recipe:
          setup: ["A1 [2026-01-01, 2026-12-31) value V1 ACTIVE; incoming I_new [2026-04-01, 2026-07-01) value V2 approved retro"]
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/roster-sources"
              payload: { source_code: "C5", display_name: "C5", format: "CSV", precedence_rank: 1, freshness_sla_days: 90 }
              as: DataSteward
              captures: { src_c5: $.data.id }
            - call: "POST /pdm/providers"
              payload: { npi: "1234567893", tin: "123456789", location_key: "LOC1" }
              as: DataSteward
              captures: { p_c5: $.data.id, p_c5_v: $.data.version }
            - call: "POST /pdm/providers/${p_c5}/attributes"
              payload: { attribute_group: "CONTACT", attribute_key: "phone", attribute_value: "V1", effective_date: "2026-01-01", term_date: "2026-12-31" }
              as: DataSteward
              captures: { attr_c5_1: $.data.id }
          trigger:
            - call: "POST /pdm/providers/${p_c5}/attributes"
              payload: { attribute_group: "CONTACT", attribute_key: "phone", attribute_value: "V2", effective_date: "2026-04-01", term_date: "2026-07-01" }
              as: DataSteward
              captures: { attr_c5_2: $.data.id }
            - call: "GET /pdm/providers/${p_c5}/attributes"
              payload: {}
              as: DataSteward
          assert:
            - "Three ACTIVE intervals exist: [01-01,04-01) V1, [04-01,07-01) V2, [07-01,12-31) V1"
            - "The right split-half carries supersedes_attribute_id pointing at A1"

  # ===================================================================
  # Section: validations — violation->error, satisfaction->pass,
  # priority ordering beyond §1.8's two instances.
  # ===================================================================
  - section: validations
    instances:
      - name: unauthenticated_missing_role_header
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Request without X-User-Role returns 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /pdm/providers"
              payload: {}
              as: Anonymous
              captures: { v1_err: $.data.error_id }
          assert:
            - "http_status == 401 or error_id == ERR_UNAUTHENTICATED"

      - name: forbidden_intake_cannot_merge
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", roles]
        distinguishing_aspect: "IntakeOperator calling POST /pdm/provider-merges returns ERR_FORBIDDEN (segregation of duties role model)."
        test_recipe:
          setup: ["two ACTIVE providers"]
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/providers"
              payload: { npi: "1234567893", tin: "123456789", location_key: "LOC1" }
              as: DataSteward
              captures: { p_v2a: $.data.id }
            - call: "POST /pdm/providers"
              payload: { npi: "1234567894", tin: "123456789", location_key: "LOC2" }
              as: DataSteward
              captures: { p_v2b: $.data.id, p_v2b_v: $.data.version }
          trigger:
            - call: "POST /pdm/provider-merges"
              payload: { survivor_provider_id: "${p_v2a}", merged_provider_id: "${p_v2b}", rationale: "x", expected_provider_version: "${p_v2b_v}" }
              as: IntakeOperator
              captures: { v2_err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN"

      - name: precedence_rank_conflict_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_PRECEDENCE_RANK_CONFLICT]"]
        distinguishing_aspect: "Creating a second non-RETIRED source with an already-taken precedence_rank returns 409 ERR_PRECEDENCE_RANK_CONFLICT."
        test_recipe:
          setup: ["source at rank 1 exists"]
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/roster-sources"
              payload: { source_code: "V3A", display_name: "A", format: "CSV", precedence_rank: 1, freshness_sla_days: 90 }
              as: DataSteward
          trigger:
            - call: "POST /pdm/roster-sources"
              payload: { source_code: "V3B", display_name: "B", format: "CSV", precedence_rank: 1, freshness_sla_days: 90 }
              as: DataSteward
              captures: { v3_err: $.data.error_id }
          assert:
            - "error_id == ERR_PRECEDENCE_RANK_CONFLICT"

      - name: duplicate_file_checksum_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_DUPLICATE_FILE]"]
        distinguishing_aspect: "Second file with the same checksum for the same source returns ERR_DUPLICATE_FILE even with a different external_file_ref."
        test_recipe:
          setup: ["source + file f1 checksum c1"]
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/roster-sources"
              payload: { source_code: "V4", display_name: "V4", format: "CSV", precedence_rank: 1, freshness_sla_days: 90 }
              as: DataSteward
              captures: { src_v4: $.data.id }
            - call: "POST /pdm/roster-files"
              payload: { roster_source_id: "${src_v4}", external_file_ref: "v4a", declared_row_count: 0, checksum: "dupc" }
              as: IntakeOperator
              as_user_id: "op_intake_1"
          trigger:
            - call: "POST /pdm/roster-files"
              payload: { roster_source_id: "${src_v4}", external_file_ref: "v4b", declared_row_count: 0, checksum: "dupc" }
              as: IntakeOperator
              as_user_id: "op_intake_1"
              captures: { v4_err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_FILE"

      - name: commit_with_conflict_rows_blocked
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_UNRESOLVED_ROW_CONFLICTS]"]
        distinguishing_aspect: "Commit with any row still in CONFLICT returns ERR_UNRESOLVED_ROW_CONFLICTS and the file stays VALIDATED."
        test_recipe:
          setup: ["file VALIDATED with one CONFLICT row"]
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/roster-sources"
              payload: { source_code: "V5", display_name: "V5", format: "CSV", precedence_rank: 1, freshness_sla_days: 90 }
              as: DataSteward
              captures: { src_v5: $.data.id }
            - call: "POST /pdm/providers"
              payload: { npi: "1234567893", tin: "123456789", location_key: "LOC_A" }
              as: DataSteward
            - call: "POST /pdm/providers"
              payload: { npi: "1234567893", tin: "123456789", location_key: "LOC_B" }
              as: DataSteward
            - call: "POST /pdm/roster-files"
              payload: { roster_source_id: "${src_v5}", external_file_ref: "v5f", declared_row_count: 1, checksum: "v5c" }
              as: IntakeOperator
              as_user_id: "op_intake_1"
              captures: { fv5_id: $.data.id }
            - call: "POST /pdm/roster-files/${fv5_id}/parse"
              payload: {}
              as: IntakeOperator
            - call: "POST /pdm/roster-files/${fv5_id}/normalize"
              payload: {}
              as: IntakeOperator
            - call: "POST /pdm/roster-files/${fv5_id}/validate"
              payload: {}
              as: IntakeOperator
            - call: "GET /pdm/roster-files/${fv5_id}"
              payload: {}
              as: IntakeOperator
              captures: { fv5_v: $.data.version }
          trigger:
            - call: "POST /pdm/roster-files/${fv5_id}/commit"
              payload: { expected_roster_file_version: "${fv5_v}" }
              as: IntakeOperator
              as_user_id: "op_intake_2"
              captures: { v5_err: $.data.error_id }
          assert:
            - "error_id == ERR_UNRESOLVED_ROW_CONFLICTS"
            - "RosterFile.status == VALIDATED"

      - name: merge_self_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=18]", "errors[ERR_MERGE_SELF]"]
        distinguishing_aspect: "survivor_provider_id == merged_provider_id returns 422 ERR_MERGE_SELF before any merge side effects."
        test_recipe:
          setup: ["provider A"]
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/providers"
              payload: { npi: "1234567893", tin: "123456789", location_key: "LOC1" }
              as: DataSteward
              captures: { p_v6: $.data.id, p_v6_v: $.data.version }
          trigger:
            - call: "POST /pdm/provider-merges"
              payload: { survivor_provider_id: "${p_v6}", merged_provider_id: "${p_v6}", rationale: "x", expected_provider_version: "${p_v6_v}" }
              as: DataSteward
              captures: { v6_err: $.data.error_id }
          assert:
            - "error_id == ERR_MERGE_SELF"

      - name: conflict_resolution_merge_values_requires_value
        claim_type: violation_to_error
        grounds: ["validations[priority=26]", "errors[ERR_MERGE_VALUE_REQUIRED]"]
        distinguishing_aspect: "resolution=MERGE_VALUES without resolved_value returns 422 ERR_MERGE_VALUE_REQUIRED."
        test_recipe:
          setup: ["an OPEN AttributeConflict exists"]
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/roster-sources"
              payload: { source_code: "V7A", display_name: "A", format: "CSV", precedence_rank: 5, freshness_sla_days: 90 }
              as: DataSteward
              captures: { src_v7a: $.data.id }
            - call: "POST /pdm/roster-sources"
              payload: { source_code: "V7B", display_name: "B", format: "CSV", precedence_rank: 5, freshness_sla_days: 90 }
              as: DataSteward
              captures: { src_v7b: $.data.id }
            - call: "POST /pdm/providers"
              payload: { npi: "1234567893", tin: "123456789", location_key: "LOC1" }
              as: DataSteward
              captures: { p_v7: $.data.id }
            - call: "POST /pdm/providers/${p_v7}/attributes"
              payload: { attribute_group: "CONTACT", attribute_key: "phone", attribute_value: "A", effective_date: "2026-08-01" }
              as: DataSteward
            - call: "POST /pdm/providers/${p_v7}/attributes"
              payload: { attribute_group: "CONTACT", attribute_key: "phone", attribute_value: "B", effective_date: "2026-08-01" }
              as: DataSteward
            - call: "GET /pdm/attribute-conflicts"
              payload: {}
              as: DataSteward
              captures: { conf_v7: "$.data[0].id" }
          trigger:
            - call: "POST /pdm/attribute-conflicts/${conf_v7}/resolve"
              payload: { resolution: "MERGE_VALUES" }
              as: DataSteward
              captures: { v7_err: $.data.error_id }
          assert:
            - "error_id == ERR_MERGE_VALUE_REQUIRED"

      - name: escalate_equal_rank_conflict_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=27]", "errors[ERR_PRECEDENCE_TIE_NOT_ESCALATABLE]"]
        distinguishing_aspect: "Escalating a conflict whose sources have equal precedence_rank returns ERR_PRECEDENCE_TIE_NOT_ESCALATABLE."
        test_recipe:
          setup: ["OPEN conflict between two rank-5 sources"]
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/roster-sources"
              payload: { source_code: "V8A", display_name: "A", format: "CSV", precedence_rank: 5, freshness_sla_days: 90 }
              as: DataSteward
            - call: "POST /pdm/roster-sources"
              payload: { source_code: "V8B", display_name: "B", format: "CSV", precedence_rank: 5, freshness_sla_days: 90 }
              as: DataSteward
            - call: "POST /pdm/providers"
              payload: { npi: "1234567893", tin: "123456789", location_key: "LOC1" }
              as: DataSteward
              captures: { p_v8: $.data.id }
            - call: "POST /pdm/providers/${p_v8}/attributes"
              payload: { attribute_group: "CONTACT", attribute_key: "phone", attribute_value: "A", effective_date: "2026-08-01" }
              as: DataSteward
            - call: "POST /pdm/providers/${p_v8}/attributes"
              payload: { attribute_group: "CONTACT", attribute_key: "phone", attribute_value: "B", effective_date: "2026-08-01" }
              as: DataSteward
            - call: "GET /pdm/attribute-conflicts"
              payload: {}
              as: DataSteward
              captures: { conf_v8: "$.data[0].id" }
          trigger:
            - call: "POST /pdm/attribute-conflicts/${conf_v8}/escalate"
              payload: {}
              as: DataSteward
              captures: { v8_err: $.data.error_id }
          assert:
            - "error_id == ERR_PRECEDENCE_TIE_NOT_ESCALATABLE"

      - name: batch_inflight_blocks_second_publish
        claim_type: violation_to_error
        grounds: ["validations[priority=20]", "errors[ERR_BATCH_INFLIGHT]"]
        distinguishing_aspect: "Publishing a second batch for the same target while one is BUILDING/PUBLISHED returns ERR_BATCH_INFLIGHT."
        test_recipe:
          setup: ["target with one batch already PUBLISHED"]
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/distribution-targets"
              payload: { target_code: "CLAIMS", endpoint_uri: "sftp://c", required_quality_floor: 0 }
              as: DistributionOperator
              captures: { tgt_v9: $.data.id }
            - call: "POST /pdm/distribution-batches"
              payload: { distribution_target_id: "${tgt_v9}" }
              as: DistributionOperator
              captures: { b_v9_1: $.data.id }
            - call: "POST /pdm/distribution-batches/${b_v9_1}/publish"
              payload: {}
              as: DistributionOperator
            - call: "POST /pdm/distribution-batches"
              payload: { distribution_target_id: "${tgt_v9}" }
              as: DistributionOperator
              captures: { b_v9_2: $.data.id }
          trigger:
            - call: "POST /pdm/distribution-batches/${b_v9_2}/publish"
              payload: {}
              as: DistributionOperator
              captures: { v9_err: $.data.error_id }
          assert:
            - "error_id == ERR_BATCH_INFLIGHT"

      - name: terminate_with_open_attestation_blocked
        claim_type: violation_to_error
        grounds: ["validations[priority=25]", "errors[ERR_OPEN_ATTESTATION_EXISTS]"]
        distinguishing_aspect: "Terminating a provider with a SENT attestation returns ERR_OPEN_ATTESTATION_EXISTS."
        test_recipe:
          setup: ["provider with SENT attestation"]
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/providers"
              payload: { npi: "1234567893", tin: "123456789", location_key: "LOC1" }
              as: DataSteward
              captures: { p_v10: $.data.id }
            - call: "POST /pdm/attestation-campaigns"
              payload: { name: "CV10", window_days: 5 }
              as: DataSteward
              captures: { camp_v10: $.data.id }
            - call: "POST /pdm/attestation-campaigns/${camp_v10}/open"
              payload: {}
              as: DataSteward
            - call: "POST /pdm/attestation-campaigns/${camp_v10}/attestation-requests"
              payload: { provider_id: "${p_v10}" }
              as: DataSteward
              captures: { req_v10: $.data.id }
            - call: "POST /pdm/attestation-requests/${req_v10}/send"
              payload: {}
              as: DataSteward
          trigger:
            - call: "POST /pdm/providers/${p_v10}/terminate"
              payload: {}
              as: DataSteward
              captures: { v10_err: $.data.error_id }
          assert:
            - "error_id == ERR_OPEN_ATTESTATION_EXISTS"

      - name: priority_auth_before_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=1]", "validations[priority=3]"]
        distinguishing_aspect: "Unauthenticated request to a non-existent provider id returns 401 ERR_UNAUTHENTICATED, NOT 404 — auth outranks existence."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /pdm/providers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Anonymous
              captures: { v11_err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED (never ERR_NOT_FOUND for unauthenticated callers)"

  # ===================================================================
  # Section: endpoints — CRUD happy paths, action endpoints, bulk,
  # computed reads, conditional actions.
  # ===================================================================
  - section: endpoints
    instances:
      - name: list_providers_pagination_defaults
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "GET /pdm/providers with no limit/offset returns limit=10, offset=0, plus total_count and has_more in the envelope."
        test_recipe:
          setup: ["12 providers created"]
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
          trigger:
            - call: "GET /pdm/providers"
              payload: {}
              as: DataSteward
          assert:
            - "response envelope contains pagination fields limit, offset, total_count, has_more"
            - "default limit == 10 and has_more == true when 12 providers exist"

      - name: get_provider_by_id_returns_stored_fields
        claim_type: retrieval
        grounds: [entities.Provider]
        distinguishing_aspect: "GET /pdm/providers/{id} returns npi/tin/location_key/lifecycle_status/current_quality_score exactly as stored."
        test_recipe:
          setup: ["one provider"]
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/providers"
              payload: { npi: "1234567893", tin: "123456789", location_key: "LOC1" }
              as: DataSteward
              captures: { p_ep2: $.data.id }
          trigger:
            - call: "GET /pdm/providers/${p_ep2}"
              payload: {}
              as: DataSteward
          assert:
            - "Provider.npi == 1234567893 and lifecycle_status == ACTIVE"

      - name: quality_score_recompute_computed_read
        claim_type: computed_read
        grounds: [calculations.data_quality_scoring]
        distinguishing_aspect: "POST /pdm/providers/{id}/quality-scores/recompute returns the freshly computed DataQualityScore with all four components."
        test_recipe:
          setup: ["provider with known attribute set"]
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/providers"
              payload: { npi: "1234567893", tin: "123456789", location_key: "LOC1" }
              as: DataSteward
              captures: { p_ep3: $.data.id }
          trigger:
            - call: "POST /pdm/providers/${p_ep3}/quality-scores/recompute"
              payload: {}
              as: DataSteward
              captures: { ep3_total: $.data.total_score }
          assert:
            - "Response contains completeness_component, freshness_component, conflict_component, attestation_component, total_score"

      - name: batch_retry_supersedes_failed
        claim_type: conditional_action
        grounds: [state_machines.DistributionBatch.transitions]
        distinguishing_aspect: "POST /pdm/distribution-batches with retry_of_batch_id pointing at a FAILED batch supersedes the old one and creates a new BUILDING batch."
        test_recipe:
          setup: ["batch B1 FAILED"]
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/distribution-targets"
              payload: { target_code: "CLAIMS", endpoint_uri: "sftp://c", required_quality_floor: 0 }
              as: DistributionOperator
              captures: { tgt_ep4: $.data.id }
            - call: "POST /pdm/distribution-batches"
              payload: { distribution_target_id: "${tgt_ep4}" }
              as: DistributionOperator
              captures: { b_ep4_1: $.data.id }
            - call: "POST /pdm/distribution-batches/${b_ep4_1}/publish"
              payload: {}
              as: DistributionOperator
            - call: "POST /pdm/distribution-batches/${b_ep4_1}/fail"
              payload: { failure_reason: "downstream 500" }
              as: DistributionOperator
          trigger:
