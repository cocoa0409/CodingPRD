      - name: validation_appealed_action_must_own_the_cited_plan
        claim_type: cross_entity_validation
        grounds:
          - "validations.priority_130 (ERR_POA_ACTION_MISMATCH)"
          - "endpoints[POST /appeals].side_effects"
        distinguishing_aspect: |
          The seller has one ACCEPTED plan, but it answers action a1; citing it while appealing a2
          is refused at priority 130. a2's rule has requires_poa false, so the milder priority-85
          ERR_POA_NOT_ACCEPTED cannot mask the mismatch, and re-filing the appeal with no
          plan_of_action_id at all succeeds — the citation was optional, its coherence was not.
