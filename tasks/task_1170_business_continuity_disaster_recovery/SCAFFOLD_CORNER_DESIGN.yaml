              as_user_id: "${c2_id}"
              captures: { final_status: $.data.status }
          assert:
            - "setup captures v_status == EXITED and cap_status == GAP_IDENTIFIED (exit cascade)"
            - "first trigger err == ERR_CAPABILITY_HAS_OPEN_GAPS"
            - "after closing the gap, final_status == REMEDIATED"
      - name: readiness_derived_field_reconciliation
        claim_type: derived_field_reconciliation
        grounds: [calculations.attestation_readiness, entities.Attestation.fields.readiness_score]
        distinguishing_aspect: "The DRAFT attestation's readiness_score is reconciled on read: closing one overdue gap between create and GET moves the score 80 -> 90 — the snapshot_payload of a SIGNED attestation, by contrast, never reconciles."
        test_recipe:
          setup:
            - "Clock 2026-06-01; contacts C1 (signer), C2 (committee); process P ACTIVE"
            - "APPROVED BIA rto 4/rpo 1; APPROVED plan 4/1; VALIDATED capability; COMPLETED MET exercise; one OPEN overdue gap (due 2026-05-20)"
