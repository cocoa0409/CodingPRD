            - call: "POST /health-data/privacy-policy-versions/${pol_id}/submit-review"
              payload: {}
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /health-data/privacy-policy-versions/${pol_id}/publish"
              payload: {}
              as: ComplianceApprover
              as_user_id: "ca-1"
