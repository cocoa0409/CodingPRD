  # -------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # -------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: attempt_quiet_hours_half_open
        grounds:
          - calculations.attempt_cadence
          - validations[priority=7]
          - errors[ERR_CAMPAIGN_WINDOW_VIOLATION]
        distinguishing_aspect: |
          Half-open interval semantics on CareGap/Member resource: quiet hours
          are [quiet_hours_end_min, quiet_hours_start_min) local time; an
          attempt at 20:59 is permitted but at 21:00 is blocked (>=
          quiet_hours_start_min). Adjacency at exactly the boundary is
          excluded from the waking window.
        test_recipe:
          setup:
            - "Registry, measure, cohort, panel, member; CALL campaign ACTIVE with quiet_hours_start_min=1260 (21:00), quiet_hours_end_min=480 (08:00)"
            - "Clock set to 2026-05-10T21:00:00Z (exactly at quiet start)"
          setup_api_calls:
            - call: "POST /population-health/registries"
              payload: { name: "RR1", program_year: 2026 }
              as: ProgramAdministrator
              captures: { reg_id: $.data.id }
            - call: "POST /population-health/registries/${reg_id}/measure-definitions"
              payload: { measure_code: "SCR", measure_domain: "SCREENING", lookback_days: 365 }
