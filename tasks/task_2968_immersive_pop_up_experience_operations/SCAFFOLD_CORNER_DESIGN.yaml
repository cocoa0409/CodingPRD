  # ===========================================================================
  # 7. RBAC (§1.7) — role_model: segregation_of_duties
  # ===========================================================================
  - section: rbac
    source_table: "SCAFFOLD.yaml table 7 (roles), 7 roles; complexity_profile.role_model == segregation_of_duties"
    instances:

      - name: each_role_performs_the_operations_it_owns
        claim_type: role_operations_allowed
        grounds:
          - roles.VenueOpsManager
          - roles.LicensingManager
          - roles.LicensorRep
          - roles.ExperienceProducer
          - roles.SafetyOfficer
          - roles.GuestServicesAgent
          - roles.Guest
        distinguishing_aspect: |
          Seven roles and no hierarchy: nobody in this API can do everything, so the positive half of
          the matrix has to be walked role by role. The awkward one is Guest, whose
          exclusive_operations list is EMPTY - all of its power is shared operations bound to its own
          entity id - so an implementation that models permissions as 'role owns endpoints' has
          nowhere to put it, and an implementation that treats an empty exclusive list as no access
          locks paying guests out of the only endpoint they need.
        test_recipe:
          setup:
            - "One venue in NYC with an ISSUED permit and an ACTIVE lease, one kit, one ACTIVE agreement whose licensor_rep_user_id is rep-1, one run with one themed room, and one SUBMITTED creative submission."
