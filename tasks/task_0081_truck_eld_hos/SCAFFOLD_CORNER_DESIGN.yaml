scaffold_corner_design:
  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_driver_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.Driver, endpoints]
        distinguishing_aspect: "POST /eld/drivers with required fields -> 201; response carries id, version==1, status==ACTIVE, current_duty_status==OFF_DUTY, cycle_on_duty_minutes==0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /eld/drivers"
              payload: { license_number: "CDL-Z1", full_name: "Zeta Driver" }
              as: CarrierAdmin
              captures: { d_id: $.data.id }
          assert:
            - "Status 201; Driver.${d_id}.version == 1; status == ACTIVE; current_duty_status == OFF_DUTY; cycle_on_duty_minutes == 0."
      - name: get_driver_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Driver, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /eld/drivers/{id} with a non-existent UUID -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /eld/drivers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CarrierAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Status 404 with data.error_id == ERR_NOT_FOUND."
      - name: create_driver_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Driver.fields.license_number, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /eld/drivers missing license_number -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /eld/drivers"
              payload: { full_name: "No License" }
              as: CarrierAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Status 400 with data.error_id == ERR_INVALID_REQUEST."
      - name: create_driver_default_pc_authorized_false_and_cycle_rule
        claim_type: Defaults
        grounds: [entities.Driver.fields.pc_authorized, entities.Driver.fields.cycle_rule]
        distinguishing_aspect: "Omitting pc_authorized and cycle_rule applies defaults false and SEVENTY_HOUR_8_DAY."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /eld/drivers"
              payload: { license_number: "CDL-Z2", full_name: "Default Driver" }
              as: CarrierAdmin
              captures: { d_id: $.data.id }
          assert:
            - "Driver.${d_id}.pc_authorized == false; cycle_rule == SEVENTY_HOUR_8_DAY; home_terminal_tz_offset_minutes == 0."
      - name: driver_computed_current_duty_status_ignores_input
        claim_type: Computed Fields
        grounds: [entities.Driver.fields.current_duty_status]
        distinguishing_aspect: "current_duty_status is computed from the latest ACTIVE event; supplying it in POST body is ignored (not in input)."
        test_recipe:
          setup: ["Driver D, device BOUND; appends a DRIVING event so current_duty_status derives to DRIVING."]
          setup_api_calls:
            - call: "POST /eld/vehicles"
              payload: { unit_number: "CU1", vin: "CVIN1" }
              as: CarrierAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /eld/devices"
              payload: { serial_number: "CS1", vehicle_id: "${veh_id}" }
              as: CarrierAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /eld/drivers"
              payload: { license_number: "CDL-Z3", full_name: "Computed Driver", home_terminal_tz_offset_minutes: 0 }
              as: CarrierAdmin
              captures: { d_id: $.data.id, d_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: CarrierAdmin
            - call: "POST /eld/devices/${dev_id}/login"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "DRIVING", event_time: "2026-06-01T06:30:00Z", expected_driver_version: "${d_v0}" }
              as: Driver
              as_user_id: "${d_id}"
          trigger:
            - call: "GET /eld/drivers/${d_id}"
              payload: {}
              as: CarrierAdmin
          assert:
            - "Driver.${d_id}.current_duty_status == DRIVING (derived from latest ACTIVE event)."
      - name: create_driver_invalid_cycle_rule_enum_rejected
        claim_type: Type Constraints
        grounds: [entities.Driver.fields.cycle_rule, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "cycle_rule outside {SEVENTY_HOUR_8_DAY, SIXTY_HOUR_7_DAY} -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /eld/drivers"
              payload: { license_number: "CDL-Z4", full_name: "Bad Cycle", cycle_rule: "NINETY_HOUR" }
              as: CarrierAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Status 400 with data.error_id == ERR_INVALID_REQUEST."
      - name: duplicate_license_number_rejected
        claim_type: Type Constraints
        grounds: [entities.Driver.fields.license_number, "errors[ERR_DUPLICATE_LICENSE]", "validations[priority=17]"]
        distinguishing_aspect: "Second Driver with an existing license_number -> 409 ERR_DUPLICATE_LICENSE."
        test_recipe:
          setup: ["A Driver with license_number CDL-DUP exists."]
          setup_api_calls:
            - call: "POST /eld/drivers"
              payload: { license_number: "CDL-DUP", full_name: "First" }
              as: CarrierAdmin
          trigger:
            - call: "POST /eld/drivers"
              payload: { license_number: "CDL-DUP", full_name: "Second" }
              as: CarrierAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Status 409 with data.error_id == ERR_DUPLICATE_LICENSE."
      - name: duplicate_unit_number_rejected
        claim_type: Type Constraints
        grounds: [entities.Vehicle.fields.unit_number, "errors[ERR_DUPLICATE_UNIT]"]
        distinguishing_aspect: "Second Vehicle with an existing unit_number -> 409 ERR_DUPLICATE_UNIT."
        test_recipe:
          setup: ["A Vehicle with unit_number UDUP exists."]
          setup_api_calls:
            - call: "POST /eld/vehicles"
              payload: { unit_number: "UDUP", vin: "VINDUP1" }
              as: CarrierAdmin
          trigger:
            - call: "POST /eld/vehicles"
              payload: { unit_number: "UDUP", vin: "VINDUP2" }
              as: CarrierAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Status 409 with data.error_id == ERR_DUPLICATE_UNIT."
      - name: duplicate_serial_number_rejected
        claim_type: Type Constraints
        grounds: [entities.ELDDevice.fields.serial_number, "errors[ERR_DUPLICATE_SERIAL]"]
        distinguishing_aspect: "Second ELDDevice with an existing serial_number -> 409 ERR_DUPLICATE_SERIAL."
        test_recipe:
          setup: ["A Vehicle exists; an ELDDevice with serial SDUP exists."]
          setup_api_calls:
            - call: "POST /eld/vehicles"
              payload: { unit_number: "USER1", vin: "VINSER1" }
              as: CarrierAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /eld/devices"
              payload: { serial_number: "SDUP", vehicle_id: "${veh_id}" }
              as: CarrierAdmin
          trigger:
            - call: "POST /eld/devices"
              payload: { serial_number: "SDUP", vehicle_id: "${veh_id}" }
              as: CarrierAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Status 409 with data.error_id == ERR_DUPLICATE_SERIAL."
      - name: pc_segment_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.PersonalConveyanceSegment]
        distinguishing_aspect: "PersonalConveyanceSegment has common_fields:false — no update endpoint and no version field; only id and created_at as system fields."
        test_recipe:
          setup: ["Driver D pc_authorized true; a PC DRIVING event then a closing event creates one PersonalConveyanceSegment."]
          setup_api_calls:
            - call: "POST /eld/vehicles"
              payload: { unit_number: "CU2", vin: "CVIN2" }
              as: CarrierAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /eld/devices"
              payload: { serial_number: "CS2", vehicle_id: "${veh_id}" }
              as: CarrierAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /eld/drivers"
              payload: { license_number: "CDL-Z5", full_name: "PC Driver", home_terminal_tz_offset_minutes: 0, pc_authorized: true }
              as: CarrierAdmin
              captures: { d_id: $.data.id, d_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: CarrierAdmin
            - call: "POST /eld/devices/${dev_id}/login"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "DRIVING", special_driving_category: "PERSONAL_CONVEYANCE", event_time: "2026-06-01T06:00:00Z", annotation: "Drove to motel.", expected_driver_version: "${d_v0}" }
              as: Driver
              as_user_id: "${d_id}"
            - call: "GET /eld/drivers/${d_id}"
              payload: {}
              as: CarrierAdmin
              captures: { d_v1: $.data.version }
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "OFF_DUTY", event_time: "2026-06-01T07:30:00Z", expected_driver_version: "${d_v1}" }
              as: Driver
              as_user_id: "${d_id}"
          trigger:
            - call: "GET /eld/pc-segments?driver_id=${d_id}"
              payload: {}
              as: CarrierAdmin
          assert:
            - "Exactly 1 PersonalConveyanceSegment for ${d_id} with minutes_excluded == 90; response objects carry id and created_at but no version field."
      - name: list_drivers_pagination_envelope
        claim_type: Listing
        grounds: [entities.Driver, endpoints]
        distinguishing_aspect: "GET /eld/drivers returns a paginated array with total_count and has_more in meta/pagination fields."
        test_recipe:
          setup: ["Two drivers exist."]
          setup_api_calls:
            - call: "POST /eld/drivers"
              payload: { license_number: "CDL-PG1", full_name: "Page One" }
              as: CarrierAdmin
            - call: "POST /eld/drivers"
              payload: { license_number: "CDL-PG2", full_name: "Page Two" }
              as: CarrierAdmin
          trigger:
            - call: "GET /eld/drivers?limit=1&offset=0"
              payload: {}
              as: CarrierAdmin
          assert:
            - "Response is an array of length 1; total_count == 2; has_more == true."

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: acknowledge_violation_from_already_acknowledged_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.HOSViolation.OPEN_to_ACKNOWLEDGED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second acknowledge on an already-ACKNOWLEDGED violation -> 409 ERR_INVALID_STATE; no side effects."
        test_recipe:
          setup: ["An OPEN DRIVING_11H violation exists; it is acknowledged once."]
          setup_api_calls:
            - call: "POST /eld/vehicles"
              payload: { unit_number: "CU3", vin: "CVIN3" }
              as: CarrierAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /eld/devices"
              payload: { serial_number: "CS3", vehicle_id: "${veh_id}" }
              as: CarrierAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /eld/drivers"
              payload: { license_number: "CDL-Z6", full_name: "Ack Driver", home_terminal_tz_offset_minutes: 0 }
              as: CarrierAdmin
              captures: { d_id: $.data.id, d_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T20:00:00Z" }
              as: CarrierAdmin
            - call: "POST /eld/devices/${dev_id}/login"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "DRIVING", event_time: "2026-06-01T06:30:00Z", expected_driver_version: "${d_v0}" }
              as: Driver
              as_user_id: "${d_id}"
            - call: "GET /eld/drivers/${d_id}"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
              captures: { d_v1: $.data.version }
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "OFF_DUTY", event_time: "2026-06-01T17:31:00Z", expected_driver_version: "${d_v1}" }
              as: Driver
              as_user_id: "${d_id}"
            - call: "GET /eld/hos-violations?driver_id=${d_id}&violation_type=DRIVING_11H&status=OPEN"
              payload: {}
              as: SafetyOfficer
              captures: { v_id: "$.data[0].id" }
            - call: "POST /eld/hos-violations/${v_id}/acknowledge"
              payload: {}
              as: SafetyOfficer
          trigger:
            - call: "POST /eld/hos-violations/${v_id}/acknowledge"
              payload: {}
              as: SafetyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "Status 409 with data.error_id == ERR_INVALID_STATE; HOSViolation.${v_id}.status remains ACKNOWLEDGED."
      - name: resolve_open_violation_without_acknowledge_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.HOSViolation.ACKNOWLEDGED_to_RESOLVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Resolve is only defined from ACKNOWLEDGED; resolving a still-OPEN violation -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["An OPEN DRIVING_11H violation exists (never acknowledged)."]
          setup_api_calls:
            - call: "POST /eld/vehicles"
              payload: { unit_number: "CU4", vin: "CVIN4" }
              as: CarrierAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /eld/devices"
              payload: { serial_number: "CS4", vehicle_id: "${veh_id}" }
              as: CarrierAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /eld/drivers"
              payload: { license_number: "CDL-Z7", full_name: "Resolve Driver", home_terminal_tz_offset_minutes: 0 }
              as: CarrierAdmin
              captures: { d_id: $.data.id, d_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T20:00:00Z" }
              as: CarrierAdmin
            - call: "POST /eld/devices/${dev_id}/login"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "DRIVING", event_time: "2026-06-01T06:30:00Z", expected_driver_version: "${d_v0}" }
              as: Driver
              as_user_id: "${d_id}"
            - call: "GET /eld/drivers/${d_id}"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
              captures: { d_v1: $.data.version }
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "OFF_DUTY", event_time: "2026-06-01T17:31:00Z", expected_driver_version: "${d_v1}" }
              as: Driver
              as_user_id: "${d_id}"
            - call: "GET /eld/hos-violations?driver_id=${d_id}&violation_type=DRIVING_11H&status=OPEN"
              payload: {}
              as: SafetyOfficer
              captures: { v_id: "$.data[0].id" }
          trigger:
            - call: "POST /eld/hos-violations/${v_id}/resolve"
              payload: { resolution_note: "Driver retrained." }
              as: SafetyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "Status 409 with data.error_id == ERR_INVALID_STATE; HOSViolation.${v_id}.status remains OPEN."
      - name: reject_adverse_claim_then_approve_returns_invalid_state
        claim_type: terminal_lockdown
        grounds: [state_machines.AdverseConditionsClaim.PENDING_to_REJECTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REJECTED is terminal; approving a REJECTED claim -> 409 ERR_INVALID_STATE (state check precedes OCC)."
        test_recipe:
          setup: ["Driver D filed an adverse claim for 2026-06-01; it was REJECTED."]
          setup_api_calls:
            - call: "POST /eld/vehicles"
              payload: { unit_number: "CU5", vin: "CVIN5" }
              as: CarrierAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /eld/devices"
              payload: { serial_number: "CS5", vehicle_id: "${veh_id}" }
              as: CarrierAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /eld/drivers"
              payload: { license_number: "CDL-Z8", full_name: "Reject Driver", home_terminal_tz_offset_minutes: 0 }
              as: CarrierAdmin
              captures: { d_id: $.data.id }
            - call: "POST /eld/adverse-claims"
              payload: { driver_id: "${d_id}", log_date: "2026-06-01", reason: "TRAFFIC_INCIDENT", narrative: "Multi-car pileup ahead." }
              as: Driver
              as_user_id: "${d_id}"
              captures: { claim_id: $.data.id, claim_v0: $.data.version }
            - call: "POST /eld/adverse-claims/${claim_id}/reject"
              payload: {}
              as: SafetyOfficer
              captures: { claim_v1: $.data.version }
          trigger:
            - call: "POST /eld/adverse-claims/${claim_id}/approve"
              payload: { expected_adverseconditionsclaim_version: "${claim_v1}" }
              as: SafetyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "Status 409 with data.error_id == ERR_INVALID_STATE; AdverseConditionsClaim.${claim_id}.status remains REJECTED."
      - name: logout_unbound_device_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.ELDDevice.BOUND_to_UNBOUND, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "logout from an UNBOUND device is undefined -> 403 ownership check fails first (bound_driver_id null != acting driver), returning ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["An UNBOUND device exists; Driver D never logged in."]
          setup_api_calls:
            - call: "POST /eld/vehicles"
              payload: { unit_number: "CU6", vin: "CVIN6" }
              as: CarrierAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /eld/devices"
              payload: { serial_number: "CS6", vehicle_id: "${veh_id}" }
              as: CarrierAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /eld/drivers"
              payload: { license_number: "CDL-Z9", full_name: "Logout Driver", home_terminal_tz_offset_minutes: 0 }
              as: CarrierAdmin
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /eld/devices/${dev_id}/logout"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Status 403 with data.error_id == ERR_UNAUTHORIZED (logout ownership check: bound_driver_id null != acting driver)."
      - name: clear_malfunction_on_bound_device_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.ELDDevice.MALFUNCTION_to_UNBOUND, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "clear-malfunction is only defined from MALFUNCTION; calling it on a BOUND device -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Device BOUND to Driver D (never flagged malfunction)."]
          setup_api_calls:
            - call: "POST /eld/vehicles"
              payload: { unit_number: "CU7", vin: "CVIN7" }
              as: CarrierAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /eld/devices"
              payload: { serial_number: "CS7", vehicle_id: "${veh_id}" }
              as: CarrierAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /eld/drivers"
              payload: { license_number: "CDL-Z10", full_name: "Malf Driver", home_terminal_tz_offset_minutes: 0 }
              as: CarrierAdmin
              captures: { d_id: $.data.id }
            - call: "POST /eld/devices/${dev_id}/login"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
          trigger:
            - call: "POST /eld/devices/${dev_id}/clear-malfunction"
              payload: {}
              as: CarrierAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Status 409 with data.error_id == ERR_INVALID_STATE; ELDDevice.${dev_id}.status remains BOUND."
      - name: new_driver_initial_current_duty_status_off_duty
        claim_type: initial_state
        grounds: [entities.Driver.fields.current_duty_status, entities.Driver.fields.status]
        distinguishing_aspect: "A freshly created Driver with no events has current_duty_status == OFF_DUTY and status == ACTIVE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /eld/drivers"
              payload: { license_number: "CDL-Z11", full_name: "Fresh Driver" }
              as: CarrierAdmin
              captures: { d_id: $.data.id }
          assert:
            - "Driver.${d_id}.current_duty_status == OFF_DUTY; status == ACTIVE; cycle_on_duty_minutes == 0."
      - name: malfunction_device_blocks_duty_event_append
        claim_type: guarded_transition
        grounds: [state_machines.DutyStatusEvent.ACTIVE_to_ACTIVE, "validations[priority=7]", "errors[ERR_DEVICE_NOT_BOUND]"]
        distinguishing_aspect: "Appending a duty event through a device that is MALFUNCTION (not BOUND) -> 409 ERR_DEVICE_NOT_BOUND."
        test_recipe:
          setup: ["Device was BOUND to D then flagged MALFUNCTION; D attempts a duty event append."]
          setup_api_calls:
            - call: "POST /eld/vehicles"
              payload: { unit_number: "CU8", vin: "CVIN8" }
              as: CarrierAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /eld/devices"
              payload: { serial_number: "CS8", vehicle_id: "${veh_id}" }
              as: CarrierAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /eld/drivers"
              payload: { license_number: "CDL-Z12", full_name: "Malf2 Driver", home_terminal_tz_offset_minutes: 0 }
              as: CarrierAdmin
              captures: { d_id: $.data.id, d_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: CarrierAdmin
            - call: "POST /eld/devices/${dev_id}/login"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
            - call: "POST /eld/devices/${dev_id}/flag-malfunction"
              payload: {}
              as: CarrierAdmin
          trigger:
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "DRIVING", event_time: "2026-06-01T06:30:00Z", expected_driver_version: "${d_v0}" }
              as: Driver
              as_user_id: "${d_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Status 409 with data.error_id == ERR_DEVICE_NOT_BOUND."
      - name: driver_already_bound_blocks_second_device_login
        claim_type: guarded_transition
        grounds: [state_machines.ELDDevice.UNBOUND_to_BOUND, "errors[ERR_DRIVER_ALREADY_BOUND]"]
        distinguishing_aspect: "A driver already BOUND to one device cannot login to a second device -> 409 ERR_DRIVER_ALREADY_BOUND."
        test_recipe:
