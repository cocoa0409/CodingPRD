            - { call: "POST /npdes/sampling-events/${s_id}/custody-events", payload: { event_type: "TRANSFER", event_at: "2026-08-05T09:10:00Z", from_party: "sampler", to_party: "courier" }, as: FieldSampler }
            - { call: "POST /npdes/sampling-events/${s_id}/custody-events", payload: { event_type: "RECEIVE_LAB", event_at: "2026-08-05T09:20:00Z", from_party: "courier", to_party: "lab" }, as: LabAnalyst }
            - { call: "POST /npdes/sampling-events/${s_id}/custody-events", payload: { event_type: "ANALYSIS_START", event_at: "2026-08-05T09:30:00Z" }, as: LabAnalyst }
            - { call: "POST /npdes/lab-results", payload: { sampling_event_id: "${s_id}", parameter_code: "COPPER", reported_value: 1.5, unit: "MG_L", method_detection_limit: 0.02, flow_mgd: 2.0, analyzed_at: "2026-08-05T09:45:00Z" }, as: LabAnalyst, as_user_id: "analyst-1", captures: { r_id: $.data.id } }
            - { call: "POST /npdes/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /npdes/lab-results/${r_id}/validate", as: LabValidator, as_user_id: "validator-1", captures: { ex_id: $.data.exceedance_id } }
            - { call: "POST /npdes/_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T12:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "GET /npdes/exceedances/${ex_id}", as: Any, captures: { st1: $.data.notification_status } }
            - { call: "POST /npdes/exceedances/${ex_id}/notify", as: ComplianceOfficer, captures: { st2: $.data.notification_status, at: $.data.oral_notified_at } }
          assert:
            - "${st1} == ORAL_OVERDUE (sweep crossed the 24h deadline)"
            - "${st2} == ORAL_NOTIFIED and ${at} == 2026-08-07T12:00:00Z (late notification permitted)"

  # =====================================================================
  # Section 9: consistency model — immediate visibility of mutations and
  # derived-field reconciliation.
  # =====================================================================
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_reflects_mutation
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - entities.Permit.fields.status
        distinguishing_aspect: "Immediate model: the issue response and a follow-up GET both show ACTIVE in the same request timeline (no lag)."
        test_recipe:
          setup:
            - "DRAFT permit fully provisioned (outfall + limit)"
          setup_api_calls:
            - { call: "POST /npdes/permits", payload: { permit_number: "NPDES-CON1", facility_name: "Immediate Mill", receiving_water_body: "Mill River", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2030-12-31T00:00:00Z" }, as: EnvironmentalManager, captures: { p_id: $.data.id } }
            - { call: "POST /npdes/outfalls", payload: { permit_id: "${p_id}", outfall_number: "001" }, as: EnvironmentalManager, captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /npdes/effluent-limits", payload: { outfall_id: "${o_id}", parameter_code: "TSS", limit_type: "DAILY_MAX", limit_value: 10.0, unit: "MG_L", monitoring_frequency: "WEEKLY", effective_from: "2026-01-01T00:00:00Z", expected_outfall_version: "${o_v}" }, as: EnvironmentalManager }
          trigger:
            - { call: "POST /npdes/permits/${p_id}/issue", as: EnvironmentalManager, captures: { st: $.data.status } }
            - { call: "GET /npdes/permits/${p_id}", as: Any, captures: { st2: $.data.status } }
          assert:
            - "${st} == ACTIVE (mutation visible in the same response)"
            - "${st2} == ACTIVE (subsequent read agrees, no reconciliation lag)"

      - name: derived_counters_reconciled_on_verify_compensation
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Permit.fields.open_corrective_action_count
          - entities.Permit.fields.compliance_posture
          - state_machines.CorrectiveAction.COMPLETED_to_VERIFIED
        distinguishing_aspect: "Derived-field reconciliation: verifying the only open corrective action drops open_corrective_action_count to 0 and reverts posture UNDER_CORRECTIVE_ACTION -> GOOD_STANDING in the same request."
        test_recipe:
          setup:
            - "Exceedance-sourced corrective action COMPLETED; permit posture UNDER_CORRECTIVE_ACTION with count 1"
          setup_api_calls:
            - { call: "POST /npdes/permits", payload: { permit_number: "NPDES-CON2", facility_name: "Reconcile Mill", receiving_water_body: "Mill River", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2030-12-31T00:00:00Z" }, as: EnvironmentalManager, captures: { p_id: $.data.id } }
            - { call: "POST /npdes/outfalls", payload: { permit_id: "${p_id}", outfall_number: "001" }, as: EnvironmentalManager, captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /npdes/effluent-limits", payload: { outfall_id: "${o_id}", parameter_code: "COPPER", limit_type: "DAILY_MAX", limit_value: 1.0, unit: "MG_L", monitoring_frequency: "WEEKLY", effective_from: "2026-01-01T00:00:00Z", expected_outfall_version: "${o_v}" }, as: EnvironmentalManager }
            - { call: "POST /npdes/permits/${p_id}/issue", as: EnvironmentalManager }
            - { call: "POST /npdes/sampling-events", payload: { outfall_id: "${o_id}", parameter_code: "COPPER", scheduled_for: "2026-08-05T08:00:00Z" }, as: FieldSampler, captures: { s_id: $.data.id } }
            - { call: "POST /npdes/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /npdes/sampling-events/${s_id}/collect", as: FieldSampler }
            - { call: "POST /npdes/sampling-events/${s_id}/custody-events", payload: { event_type: "TRANSFER", event_at: "2026-08-05T09:10:00Z", from_party: "sampler", to_party: "courier" }, as: FieldSampler }
            - { call: "POST /npdes/sampling-events/${s_id}/custody-events", payload: { event_type: "RECEIVE_LAB", event_at: "2026-08-05T09:20:00Z", from_party: "courier", to_party: "lab" }, as: LabAnalyst }
            - { call: "POST /npdes/sampling-events/${s_id}/custody-events", payload: { event_type: "ANALYSIS_START", event_at: "2026-08-05T09:30:00Z" }, as: LabAnalyst }
            - { call: "POST /npdes/lab-results", payload: { sampling_event_id: "${s_id}", parameter_code: "COPPER", reported_value: 1.5, unit: "MG_L", method_detection_limit: 0.02, flow_mgd: 2.0, analyzed_at: "2026-08-05T09:45:00Z" }, as: LabAnalyst, as_user_id: "analyst-1", captures: { r_id: $.data.id } }
            - { call: "POST /npdes/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /npdes/lab-results/${r_id}/validate", as: LabValidator, as_user_id: "validator-1", captures: { ex_id: $.data.exceedance_id } }
            - { call: "GET /npdes/exceedances/${ex_id}", as: Any, captures: { ca_id: $.data.corrective_action_id } }
            - { call: "POST /npdes/corrective-actions/${ca_id}/start", as: FacilityInspector }
            - { call: "POST /npdes/corrective-actions/${ca_id}/complete", payload: { actual_cost_cents: 5000 }, as: FacilityInspector, as_user_id: "fi-1" }
          trigger:
            - { call: "POST /npdes/corrective-actions/${ca_id}/verify", as: Regulator, as_user_id: "reg-1", captures: { st: $.data.status } }
            - { call: "GET /npdes/permits/${p_id}", as: Any, captures: { cnt: $.data.open_corrective_action_count, post: $.data.compliance_posture } }
          assert:
            - "${st} == VERIFIED"
            - "${cnt} == 0 (action left the open set) and ${post} == GOOD_STANDING (compensating bubble-up)"

      - name: excluded_stub_for_difficulty_coverage
        claim_type: violation_to_error
        grounds:
          - calculations.monthly_average_effluent
        excluded_because:
          difficulty_instance: dmr_monthly_average_arithmetic_vs_flow_weighted
          rationale: "Variant selection and the flow-weighted divergence on summary_lines are asserted by the named §1.8 instance; no separate corner recipe is emitted."
