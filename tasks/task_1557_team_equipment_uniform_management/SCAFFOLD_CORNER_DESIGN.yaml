          trigger:
            - { call: "POST /supplier-contracts/${sc}/close", payload: {}, as: TeamAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /kit-orders/${ord}/cancel", payload: {}, as: EquipmentManager }
