            - call: "GET /ethanol-ops/loading-tracks/dead0000-0000-4000-8000-000000000007"
              payload: {}
              as: PlantManager
              as_user_id: "pm-01"
              captures: { e_track: $.data.error_id }
            - call: "GET /ethanol-ops/unit-train-shipments/dead0000-0000-4000-8000-000000000008"
              payload: {}
              as: PlantManager
              as_user_id: "pm-01"
              captures: { e_shipment: $.data.error_id }
            - call: "GET /ethanol-ops/co-product-sales/dead0000-0000-4000-8000-000000000009"
              payload: {}
              as: PlantManager
              as_user_id: "pm-01"
