              as: LeaveAdministrator
              captures: { rp_owed: "$.data[0].amount_owed", rp_monthly: "$.data[0].monthly_forgiveness", rp_base: "$.data[0].base_amount" }
          assert:
            - "obligation fulfilled_months == 2 and required_months == 6"
            - "pre-breach projected_liability == 66666.67 (proportional variant: round(100000.00 * 4/6, 2))"
            - "repayment base_amount == 100000.00 (net 60000.00 + final coverage 40000.00); monthly_forgiveness == 16666.67"
            - "repayment amount_owed == 66666.66 (chronological variant: 100000.00 - 16666.67*2)"
            - "66666.66 != 66666.67: identical obligation data, two formulas, one cent apart"
