            - "alert_below.accessibility_deficiency_points == 1.05 and accessibility_state == 'ACCESSIBILITY_FAILED'"
            - "alert_above.accessibility_deficiency_points == 0.95 and accessibility_state == 'ACCESSIBILITY_PASSED'"
            - "-26.0 LUFS sits exactly LOUDNESS_TOLERANCE_LU below TARGET_LUFS, so loudness_excess_lu == 0.0 and the coupled term is 0.00 in all three cases"
            - "every alert still has relay_state == 'UNMATCHED_OPTIONAL' — the accessibility dimension moved alone"

