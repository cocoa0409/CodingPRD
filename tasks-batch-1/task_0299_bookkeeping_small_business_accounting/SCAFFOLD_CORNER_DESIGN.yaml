# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage) — task_0299
# Walks references/claim-extraction-guide.md against SCAFFOLD.yaml §1.1–§1.7.
# section: / claim_type: values come from the guide's nine sections.
# excluded_because: stubs cite the §1.8 instance that already covers the corner.
# All formula-derived asserts are pre-computed literals.
# =============================================================================

scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_account_returns_201_with_defaults
        claim_type: Creation
        grounds: ['entities.Account', 'endpoints["POST /ledger/accounts"]']
        distinguishing_aspect: "POST /ledger/accounts with all required fields returns 201; status defaults ACTIVE, posted_balance_cents 0."
        test_recipe:
          setup: ["A Company exists."]
          setup_api_calls:
            - call: "POST /ledger/companies"
              payload: { legal_name: "C", base_currency: "USD", accounting_basis: "ACCRUAL" }
              as: Owner
              as_user_id: "u_owner"
              captures: { co: $.data.id }
          trigger:
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "1000", name: "Cash", account_type: "ASSET", is_cash: true }
              as: Owner
              as_user_id: "u_owner"
              captures: { acct: $.data.id, st: $.data.status, bal: $.data.posted_balance_cents }
          assert:
            - "trigger response HTTP status == 201"
            - "Account.${acct}.status == ACTIVE"
            - "Account.${acct}.posted_balance_cents == 0"
            - "Account.${acct}.version == 1"

      - name: get_account_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ['entities.Account', 'endpoints["GET /ledger/accounts/{accountId}"]', 'errors[ERR_NOT_FOUND]']
        distinguishing_aspect: "GET /ledger/accounts/{random uuid} returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["No account with the queried id exists."]
          setup_api_calls:
            - call: "POST /ledger/companies"
              payload: { legal_name: "C", base_currency: "USD", accounting_basis: "ACCRUAL" }
              as: Owner
              as_user_id: "u_owner"
              captures: { co: $.data.id }
          trigger:
            - call: "GET /ledger/accounts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Owner
              as_user_id: "u_owner"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_NOT_FOUND"
            - "trigger response HTTP status == 404"

      - name: create_account_missing_required_field_rejected
        claim_type: Required Fields
        grounds: ['entities.Account.fields.account_type', 'endpoints["POST /ledger/accounts"]', 'errors[ERR_INVALID_REQUEST]']
        distinguishing_aspect: "POST /ledger/accounts omitting account_type returns ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["A Company exists."]
          setup_api_calls:
            - call: "POST /ledger/companies"
              payload: { legal_name: "C", base_currency: "USD", accounting_basis: "ACCRUAL" }
              as: Owner
              as_user_id: "u_owner"
              captures: { co: $.data.id }
          trigger:
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "1000", name: "Cash" }
              as: Owner
              as_user_id: "u_owner"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_REQUEST"
            - "trigger response HTTP status == 400"

      - name: sub_account_type_mismatch_rejected
        claim_type: Parent Relationships
        grounds: ['entities.Account.fields.parent_account_id', 'validations[priority=9]', 'errors[ERR_ACCOUNT_TYPE_MISMATCH]']
        distinguishing_aspect: "A sub-account with account_type EXPENSE under an ASSET parent is rejected with ERR_ACCOUNT_TYPE_MISMATCH."
        test_recipe:
          setup: ["A Company with one ASSET parent account."]
          setup_api_calls:
            - call: "POST /ledger/companies"
              payload: { legal_name: "C", base_currency: "USD", accounting_basis: "ACCRUAL" }
              as: Owner
              as_user_id: "u_owner"
              captures: { co: $.data.id }
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "1000", name: "Cash", account_type: "ASSET", is_cash: true }
              as: Owner
              as_user_id: "u_owner"
              captures: { parent: $.data.id }
          trigger:
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "1001", name: "Sub", account_type: "EXPENSE", parent_account_id: "${parent}" }
              as: Owner
              as_user_id: "u_owner"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_ACCOUNT_TYPE_MISMATCH"
            - "trigger response HTTP status == 409"

      - name: duplicate_account_code_rejected
        claim_type: Type Constraints
        grounds: ['entities.Account.fields.code', 'validations[priority=21]', 'errors[ERR_DUPLICATE_ACCOUNT_CODE]']
        distinguishing_aspect: "A second ACTIVE account with an in-use code in the same company is rejected with ERR_DUPLICATE_ACCOUNT_CODE."
        test_recipe:
          setup: ["A Company with an ACTIVE account code 1000."]
          setup_api_calls:
            - call: "POST /ledger/companies"
              payload: { legal_name: "C", base_currency: "USD", accounting_basis: "ACCRUAL" }
              as: Owner
              as_user_id: "u_owner"
              captures: { co: $.data.id }
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "1000", name: "Cash", account_type: "ASSET", is_cash: true }
              as: Owner
              as_user_id: "u_owner"
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "1000", name: "Cash2", account_type: "ASSET" }
              as: Owner
              as_user_id: "u_owner"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_DUPLICATE_ACCOUNT_CODE"
            - "trigger response HTTP status == 409"

      - name: computed_field_retained_earnings_starts_zero
        claim_type: Computed Fields
        grounds: [entities.Company.fields.retained_earnings_cents, entities.Company.fields.trial_balance_status]
        distinguishing_aspect: "A freshly created Company reports retained_earnings_cents 0 and trial_balance_status BALANCED regardless of input."
        test_recipe:
          setup: ["No prior state."]
          setup_api_calls: []
          trigger:
            - call: "POST /ledger/companies"
              payload: { legal_name: "C", base_currency: "USD", accounting_basis: "CASH" }
              as: Owner
              as_user_id: "u_owner"
              captures: { co: $.data.id, re: $.data.retained_earnings_cents, tb: $.data.trial_balance_status }
          assert:
            - "Company.${co}.retained_earnings_cents == 0"
            - "Company.${co}.trial_balance_status == BALANCED"

      - name: list_accounts_filtered_by_company_paginated
        claim_type: Listing
        grounds: ['endpoints["GET /ledger/accounts"]', 'entities.Account.fields.company_id']
        distinguishing_aspect: "GET /ledger/accounts?company_id=.. returns a paginated Account[] with total_count and has_more in meta."
        test_recipe:
          setup: ["A Company with two accounts."]
          setup_api_calls:
            - call: "POST /ledger/companies"
              payload: { legal_name: "C", base_currency: "USD", accounting_basis: "ACCRUAL" }
              as: Owner
              as_user_id: "u_owner"
              captures: { co: $.data.id }
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "1000", name: "Cash", account_type: "ASSET", is_cash: true }
              as: Owner
              as_user_id: "u_owner"
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "4000", name: "Rev", account_type: "REVENUE" }
              as: Owner
              as_user_id: "u_owner"
          trigger:
            - call: "GET /ledger/accounts?company_id=${co}"
              payload: {}
              as: Auditor
              as_user_id: "u_aud"
          assert:
            - "trigger response total_count == 2"
            - "trigger response has_more == false"

  # =========================================================================
  - section: state_machines
    instances:
      - name: post_already_posted_entry_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ['state_machines.JournalEntry.DRAFT_to_POSTED', 'errors[ERR_INVALID_STATE]']
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / post_into_nonopen_period_state_vs_fiscal
          rationale: "Re-posting an already-POSTED entry returning ERR_INVALID_STATE is the asserted outcome of that §1.8 instance."

      - name: abandon_then_finalize_reconciliation_invalid_state
        claim_type: Terminal State Lockdown
        grounds: ['state_machines.Reconciliation.IN_PROGRESS_to_ABANDONED', 'state_machines.Reconciliation.IN_PROGRESS_to_RECONCILED', 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "An ABANDONED reconciliation (terminal) cannot be finalized; finalize returns ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["A Company with BankAccount; one CATEGORIZED deposit +50000; a Reconciliation balanced (diff 0) but then ABANDONED."]
          setup_api_calls:
            - call: "POST /ledger/companies"
              payload: { legal_name: "C", base_currency: "USD", accounting_basis: "ACCRUAL" }
              as: Owner
              as_user_id: "u_owner"
              captures: { co: $.data.id, co_v1: $.data.version }
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "1000", name: "Cash", account_type: "ASSET", is_cash: true }
              as: Owner
              as_user_id: "u_owner"
              captures: { cash: $.data.id }
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "4000", name: "Rev", account_type: "REVENUE" }
              as: Owner
              as_user_id: "u_owner"
              captures: { rev: $.data.id }
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "3900", name: "RE", account_type: "EQUITY" }
              as: Owner
              as_user_id: "u_owner"
              captures: { re: $.data.id }
            - call: "POST /ledger/bank-accounts"
              payload: { company_id: "${co}", gl_account_id: "${cash}", nickname: "Checking" }
              as: Owner
              as_user_id: "u_owner"
              captures: { bank: $.data.id, bank_v: $.data.version }
            - call: "PATCH /ledger/companies/${co}"
              payload: { retained_earnings_account_id: "${re}", expected_company_version: "${co_v1}" }
              as: Owner
              as_user_id: "u_owner"
              captures: { co_v2: $.data.version }
            - call: "POST /ledger/accounting-periods"
              payload: { company_id: "${co}", period_label: "2026-01", start_date: "2026-01-01T00:00:00.000Z", end_date: "2026-02-01T00:00:00.000Z", expected_company_version: "${co_v2}" }
              as: Owner
              as_user_id: "u_owner"
              captures: { per: $.data.id }
            - call: "POST /ledger/bank-feed-transactions"
              payload: { company_id: "${co}", bank_account_id: "${bank}", posted_date: "2026-01-10T00:00:00.000Z", amount_cents: 50000, bank_description: "DEP" }
              as: Bookkeeper
              as_user_id: "u_book"
              captures: { txn: $.data.id }
            - call: "POST /ledger/bank-feed-transactions/${txn}/categorize"
              payload: { counter_account_id: "${rev}" }
              as: Bookkeeper
              as_user_id: "u_book"
            - call: "POST /ledger/reconciliations"
              payload: { company_id: "${co}", bank_account_id: "${bank}", statement_start_date: "2026-01-01T00:00:00.000Z", statement_end_date: "2026-02-01T00:00:00.000Z", statement_opening_balance_cents: 0, statement_ending_balance_cents: 50000, included_transaction_ids: [ "${txn}" ] }
              as: Accountant
              as_user_id: "u_acct"
              captures: { rec: $.data.id }
            - call: "POST /ledger/reconciliations/${rec}/abandon"
              payload: {}
              as: Accountant
              as_user_id: "u_acct"
          trigger:
            - call: "POST /ledger/reconciliations/${rec}/finalize"
              payload: { expected_bank_account_version: "${bank_v}" }
              as: Accountant
              as_user_id: "u_acct"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_STATE"
            - "trigger response HTTP status == 409"

      - name: bank_feed_transaction_initial_state_unmatched
        claim_type: Initial State
        grounds: [state_machines.BankFeedTransaction, entities.BankFeedTransaction.fields.status]
        distinguishing_aspect: "A newly imported BankFeedTransaction starts in status UNMATCHED with cleared=false."
        test_recipe:
          setup: ["A Company with BankAccount."]
          setup_api_calls:
            - call: "POST /ledger/companies"
              payload: { legal_name: "C", base_currency: "USD", accounting_basis: "ACCRUAL" }
              as: Owner
              as_user_id: "u_owner"
              captures: { co: $.data.id }
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "1000", name: "Cash", account_type: "ASSET", is_cash: true }
              as: Owner
              as_user_id: "u_owner"
              captures: { cash: $.data.id }
            - call: "POST /ledger/bank-accounts"
              payload: { company_id: "${co}", gl_account_id: "${cash}", nickname: "Checking" }
              as: Owner
              as_user_id: "u_owner"
              captures: { bank: $.data.id }
          trigger:
            - call: "POST /ledger/bank-feed-transactions"
              payload: { company_id: "${co}", bank_account_id: "${bank}", posted_date: "2026-01-10T00:00:00.000Z", amount_cents: -5000, bank_description: "FEE" }
              as: Bookkeeper
              as_user_id: "u_book"
              captures: { txn: $.data.id, st: $.data.status, cl: $.data.cleared }
          assert:
            - "BankFeedTransaction.${txn}.status == UNMATCHED"
            - "BankFeedTransaction.${txn}.cleared == false"

      - name: void_draft_bill_then_approve_invalid_state
        claim_type: Invalid Transitions
        grounds: ['state_machines.Bill.DRAFT_to_VOID', 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "A VOID bill (terminal) cannot be approved; approve returns ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["A Company with a DRAFT bill that is then VOIDed."]
          setup_api_calls:
            - call: "POST /ledger/companies"
              payload: { legal_name: "C", base_currency: "USD", accounting_basis: "ACCRUAL" }
              as: Owner
              as_user_id: "u_owner"
              captures: { co: $.data.id }
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "2000", name: "AP", account_type: "LIABILITY" }
              as: Owner
              as_user_id: "u_owner"
              captures: { ap: $.data.id }
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "6000", name: "Exp", account_type: "EXPENSE" }
              as: Owner
              as_user_id: "u_owner"
              captures: { exp: $.data.id }
            - call: "POST /ledger/vendors"
              payload: { company_id: "${co}", display_name: "V", ap_account_id: "${ap}", is_1099_eligible: false }
              as: Accountant
              as_user_id: "u_acct"
              captures: { ven: $.data.id }
            - call: "POST /ledger/bills"
              payload: { company_id: "${co}", vendor_id: "${ven}", expense_account_id: "${exp}", bill_date: "2026-01-05T00:00:00.000Z", lines: [ { description: "x", amount_cents: 1000, use_taxable: false } ] }
              as: Bookkeeper
              as_user_id: "u_book"
              captures: { bill: $.data.id }
            - call: "POST /ledger/bills/${bill}/void"
              payload: {}
              as: Accountant
              as_user_id: "u_acct"
          trigger:
            - call: "POST /ledger/bills/${bill}/approve"
              payload: {}
              as: Accountant
              as_user_id: "u_acct"
              captures: { err: $.data.error_id }
          assert:
            - "Bill.${bill}.status == VOID"
            - "trigger response error_id == ERR_INVALID_STATE"
            - "trigger response HTTP status == 409"

      - name: closing_entry_direct_void_protected
        claim_type: Invalid Transitions
        grounds: ['state_machines.JournalEntry.POSTED_to_VOIDED', 'entities.JournalEntry.fields.source', 'errors[ERR_CLOSING_ENTRY_PROTECTED]']
        distinguishing_aspect: "Directly voiding a CLOSING-source journal entry is rejected with ERR_CLOSING_ENTRY_PROTECTED (must reopen the period instead)."
        test_recipe:
          setup: ["A Company whose period was closed, producing a CLOSING journal entry; the closing entry id is read from the closed period."]
          setup_api_calls:
            - call: "POST /ledger/companies"
              payload: { legal_name: "C", base_currency: "USD", accounting_basis: "ACCRUAL" }
              as: Owner
              as_user_id: "u_owner"
              captures: { co: $.data.id, co_v1: $.data.version }
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "1100", name: "AR", account_type: "ASSET" }
              as: Owner
              as_user_id: "u_owner"
              captures: { ar: $.data.id }
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "4000", name: "Rev", account_type: "REVENUE" }
              as: Owner
              as_user_id: "u_owner"
              captures: { rev: $.data.id }
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "3900", name: "RE", account_type: "EQUITY" }
              as: Owner
              as_user_id: "u_owner"
              captures: { re: $.data.id }
            - call: "PATCH /ledger/companies/${co}"
              payload: { retained_earnings_account_id: "${re}", expected_company_version: "${co_v1}" }
              as: Owner
              as_user_id: "u_owner"
              captures: { co_v2: $.data.version }
            - call: "POST /ledger/accounting-periods"
              payload: { company_id: "${co}", period_label: "2026-01", start_date: "2026-01-01T00:00:00.000Z", end_date: "2026-02-01T00:00:00.000Z", expected_company_version: "${co_v2}" }
              as: Owner
              as_user_id: "u_owner"
              captures: { per: $.data.id }
            - call: "POST /ledger/journal-entries"
              payload: { company_id: "${co}", period_id: "${per}", entry_date: "2026-01-10T00:00:00.000Z", memo: "sale" }
              as: Bookkeeper
              as_user_id: "u_book"
              captures: { je: $.data.id }
            - call: "POST /ledger/journal-lines"
              payload: { journal_entry_id: "${je}", account_id: "${ar}", debit_cents: 100000 }
              as: Bookkeeper
              as_user_id: "u_book"
            - call: "POST /ledger/journal-lines"
              payload: { journal_entry_id: "${je}", account_id: "${rev}", credit_cents: 100000 }
              as: Bookkeeper
              as_user_id: "u_book"
            - call: "POST /ledger/journal-entries/${je}/post"
              payload: {}
              as: Accountant
              as_user_id: "u_acct"
            - call: "POST /ledger/accounting-periods/${per}/checklist"
              payload: { item: "BANK_RECONCILED", done: true }
              as: Accountant
              as_user_id: "u_acct"
            - call: "POST /ledger/accounting-periods/${per}/checklist"
              payload: { item: "AR_REVIEWED", done: true }
              as: Accountant
              as_user_id: "u_acct"
            - call: "POST /ledger/accounting-periods/${per}/checklist"
              payload: { item: "AP_REVIEWED", done: true }
              as: Accountant
              as_user_id: "u_acct"
            - call: "POST /ledger/accounting-periods/${per}/checklist"
              payload: { item: "SALES_TAX_REVIEWED", done: true }
              as: Accountant
              as_user_id: "u_acct"
            - call: "POST /ledger/accounting-periods/${per}/begin-close"
              payload: {}
              as: Accountant
              as_user_id: "u_acct"
            - call: "POST /ledger/accounting-periods/${per}/post-close"
              payload: {}
              as: Accountant
              as_user_id: "u_acct"
              captures: { cje: $.data.closing_journal_entry_id }
          trigger:
            - call: "POST /ledger/journal-entries/${cje}/void"
              payload: {}
              as: Owner
              as_user_id: "u_owner"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_CLOSING_ENTRY_PROTECTED"
            - "trigger response HTTP status == 409"

  # =========================================================================
  - section: calculations
    instances:
      - name: reconciliation_difference_balanced_zero
        claim_type: Correct Result
        grounds: [calculations.reconciliation_difference, entities.Reconciliation.fields.difference_cents]
        distinguishing_aspect: "Opening 100000, included deposit +50000 and withdrawal -20000 (movement +30000), statement_ending 130000 -> difference_cents == 0."
        test_recipe:
          setup: ["A Company with BankAccount; two CATEGORIZED transactions (deposit +50000, withdrawal -20000)."]
          setup_api_calls:
            - call: "POST /ledger/companies"
              payload: { legal_name: "C", base_currency: "USD", accounting_basis: "ACCRUAL" }
              as: Owner
              as_user_id: "u_owner"
              captures: { co: $.data.id, co_v1: $.data.version }
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "1000", name: "Cash", account_type: "ASSET", is_cash: true }
              as: Owner
              as_user_id: "u_owner"
              captures: { cash: $.data.id }
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "4000", name: "Rev", account_type: "REVENUE" }
              as: Owner
              as_user_id: "u_owner"
              captures: { rev: $.data.id }
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "6000", name: "Exp", account_type: "EXPENSE" }
              as: Owner
              as_user_id: "u_owner"
              captures: { exp: $.data.id }
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "3900", name: "RE", account_type: "EQUITY" }
              as: Owner
              as_user_id: "u_owner"
              captures: { re: $.data.id }
            - call: "POST /ledger/bank-accounts"
              payload: { company_id: "${co}", gl_account_id: "${cash}", nickname: "Checking" }
              as: Owner
              as_user_id: "u_owner"
              captures: { bank: $.data.id }
            - call: "PATCH /ledger/companies/${co}"
              payload: { retained_earnings_account_id: "${re}", expected_company_version: "${co_v1}" }
              as: Owner
              as_user_id: "u_owner"
              captures: { co_v2: $.data.version }
            - call: "POST /ledger/accounting-periods"
              payload: { company_id: "${co}", period_label: "2026-01", start_date: "2026-01-01T00:00:00.000Z", end_date: "2026-02-01T00:00:00.000Z", expected_company_version: "${co_v2}" }
              as: Owner
              as_user_id: "u_owner"
              captures: { per: $.data.id }
            - call: "POST /ledger/bank-feed-transactions"
              payload: { company_id: "${co}", bank_account_id: "${bank}", posted_date: "2026-01-05T00:00:00.000Z", amount_cents: 50000, bank_description: "DEP" }
              as: Bookkeeper
              as_user_id: "u_book"
              captures: { t1: $.data.id }
            - call: "POST /ledger/bank-feed-transactions/${t1}/categorize"
              payload: { counter_account_id: "${rev}" }
              as: Bookkeeper
