              payload: { endorsement_type: "ADDITIONAL_PREMIUM", amount_cents: 60000, effective_date: "2026-09-15" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { sc_end: "$.data.id" }
          trigger:
            - call: "GET /policies/${sc_p1}"
              payload: {}
              as: FinanceAnalyst
              captures: { sc_p1_state: "$.data.status" }
            - call: "GET /policies/${sc_p2}"
              payload: {}
              as: FinanceAnalyst
              captures: { sc_p2_state: "$.data.status" }
            - call: "POST /policies/${sc_p1}/verifications"
              payload: { decision: "CONFIRMED" }
              as: Insurer
              as_user_id: "${sc_insurer}"
              captures: { sc_e_policy_state: "$.data.error_id" }
            - call: "POST /policies/${sc_p2}/verifications"
              payload: { decision: "CONFIRMED" }
              as: Insurer
              as_user_id: "${sc_insurer}"
              captures: { sc_e_dup: "$.data.error_id" }
            - call: "POST /policies/${sc_p1}/reopen-verification"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { sc_e_reopen: "$.data.error_id" }
            - call: "POST /endorsements/${sc_end}/decline"
              payload: { reason: "carrier withdrew the amendment" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { sc_end_declined: "$.data.status" }
            - call: "POST /endorsements/${sc_end}/decline"
              payload: { reason: "declined again by mistake" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { sc_e_end_state: "$.data.error_id" }
            - call: "GET /policies/${sc_p1}/verifications"
              payload: { limit: 50 }
              as: FinanceAnalyst
            - call: "GET /policies/${sc_p2}/verifications"
              payload: { limit: 50 }
              as: FinanceAnalyst
            - call: "GET /policies/${sc_p1}/endorsements"
              payload: { status: "DECLINED", limit: 50 }
              as: FinanceAnalyst
              captures: { sc_dec_id: "$.data[0].id" }
            - call: "GET /agreements/${sc_agr}"
              payload: {}
              as: FinanceAnalyst
              captures: { sc_agr_status: "$.data.status", sc_agr_vpc: "$.data.verified_policy_count" }
          assert:
            - "${sc_p1_state} == 'VERIFIED' (two concurring attestations) and ${sc_p2_state} == 'PENDING_VERIFICATION' (one attestation), and ${sc_agr_vpc} == 1"
            - "THE POLICY'S STATE OUTRANKS THE DUPLICATE CHECK: a repeat carrier attestation on the settled policy gives ${sc_e_policy_state} == 'ERR_POLICY_STATE_INVALID' at HTTP 409 (priority 13), while the same repeat on the open policy gives ${sc_e_dup} == 'ERR_VERIFICATION_ALREADY_RECORDED' at HTTP 409 (priority 21)"
            - "${sc_e_reopen} == 'ERR_POLICY_STATE_INVALID' at HTTP 409 — reopening requires DISPUTED, and a VERIFIED policy reports the POLICY's state rather than the agreement's"
            - "${sc_end_declined} == 'DECLINED' on the first decline, and the second returns ${sc_e_end_state} == 'ERR_ENDORSEMENT_STATE_INVALID' at HTTP 409, naming the endorsement and not its policy or note"
            - "no duplicate rows were written: GET /policies/${sc_p1}/verifications returns total_count == 2, GET /policies/${sc_p2}/verifications returns total_count == 1, and GET /policies/${sc_p1}/endorsements?status=DECLINED returns total_count == 1 with ${sc_dec_id} == ${sc_end}"
            - "${sc_agr_status} == 'PENDING_VERIFICATION' throughout — six refusals left the note exactly where it was"
            - "CODES CLOSED HERE: ERR_POLICY_STATE_INVALID, ERR_VERIFICATION_ALREADY_RECORDED, ERR_ENDORSEMENT_STATE_INVALID"

      - name: error_triggerable_power_of_attorney_and_deficiency_collection_error_walk
        claim_type: error_triggerable
        grounds:
          - validations.priority_34_ERR_NOTICE_WINDOW_OPEN
          - validations.priority_36_ERR_NOTICE_PERIOD_NOT_ELAPSED
          - validations.priority_41_ERR_RESTRUCTURE_NOT_ELIGIBLE
          - validations.priority_40_ERR_OFFSET_EXCEEDS_RESERVE
          - calculations.deficiency_and_agent_chargeback.formula
        distinguishing_aspect: |
          The tail of the note — power of attorney, carrier return, deficiency, chargeback — carries six
          codes that no earlier scenario can reach, because each one needs the previous step to have
          succeeded. The walk drives one 600k note from delinquency to a settled chargeback and probes
          the refusal at every stage: execution one day too early, restructuring after the carriers have
          been asked to cancel (status is still ACTIVE, so this is priority 41 and not priority 11), a
          second return on a request that has already reported, an offset over the reserve, an offset
          over the remainder, an offset against a settled chargeback, and a stale concurrency token
          between two legitimate partial offsets.
