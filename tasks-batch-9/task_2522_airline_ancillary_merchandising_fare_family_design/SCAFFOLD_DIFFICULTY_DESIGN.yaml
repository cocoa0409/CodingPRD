        invariant: |
          total_seats == held_seats + sold_seats + available_seats must hold at every instant,
          and a HELD seat carries no money, so releasing one must move a unit from held_seats to
          available_seats WITHOUT posting any RevenueEntry. After the diversion cascade the
          segment must read held 0, sold 0, available 4 == total 4, and the booking's ledger must
          still be empty - the compensation is purely physical.
        compensating_action: "POST /flights/{id}/irops-waivers with event_type DIVERSION and SEAT in waiver_scope, whose cascade releases the flight's HELD seats with released_reason IROPS_REACCOMMODATION"
        test_recipe:
          setup:
            - "clock at 2026-08-10T09:00:00Z; ECO_LITE is PUBLISHED on DIRECT_WEB and SEAT_EXTRA_LEGROOM (category SEAT) is ACTIVE"
            - "flight AC400 carries one OPEN EXIT_ROW segment rows 12..12 letters A,B,C,D (total_seats 4)"
            - "one HELD booking holds 12A, 12B and 12C, so held_seats is 3 and available_seats is 1"
            - "the booking is never ticketed, so it owns zero RevenueEntry rows"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: OperationsController
              as_user_id: "oc-001"
            - call: "POST /ancillary-products"
              payload: { sku: "BAG_CHECKED_1", name: "First checked bag", category: "BAGGAGE", list_price_cents: 3500, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4100", refundable: false, disclosable_fee: true, product_state: "ACTIVE" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_bag_id: $.data.id }
            - call: "POST /ancillary-products"
              payload: { sku: "SEAT_EXTRA_LEGROOM", name: "Extra legroom seat", category: "SEAT", list_price_cents: 4200, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4200", refundable: true, disclosable_fee: true, product_state: "ACTIVE" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_legroom_id: $.data.id }
            - call: "POST /fare-families"
              payload: { code: "ECO_LITE", name: "Economy Lite", cabin_class: "ECONOMY", base_fare_cents: 12000, bundle_price_cents: 14000, refundability: "NON_REFUNDABLE", change_fee_cents: 7500, boarding_priority_tier: 4 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { f_lite_id: $.data.id }
            - call: "POST /fare-families/${f_lite_id}/attributes"
              payload: { ancillary_product_id: "${p_bag_id}", inclusion: "INCLUDED", included_quantity: 1 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
            - call: "POST /fare-families/${f_lite_id}/submit"
              payload: {}
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
            - call: "POST /fare-families/${f_lite_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: PricingApprover
              as_user_id: "pa-001"
            - call: "POST /distribution-channels"
              payload: { channel_code: "DIRECT_WEB", channel_type: "DIRECT", commission_bp: 0, markup_bp: 0, max_ancillary_price_cents: 20000, supported_categories: ["BAGGAGE", "SEAT", "CHANGE", "BOARDING", "ONBOARD"], parity_required: true }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { ch_direct_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "AC400", origin: "JFK", destination: "SFO", scheduled_departure_utc: "2026-09-16T14:00:00Z", cabin_seat_total: 180 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { fl_id: $.data.id }
            - call: "POST /seat-segments"
              payload: { flight_id: "${fl_id}", ancillary_product_id: "${p_legroom_id}", zone: "EXIT_ROW", row_start: 12, row_end: 12, seat_letters: ["A", "B", "C", "D"], base_price_cents: 2000 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { seg_id: $.data.id }
            - call: "POST /bookings"
              payload: { record_locator: "CONSV1", flight_id: "${fl_id}", fare_family_id: "${f_lite_id}", distribution_channel_id: "${ch_direct_id}", passenger_name: "Conservation Pax" }
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
              captures: { b_id: $.data.id }
            - call: "POST /bookings/${b_id}/seat-assignments"
              payload: { seat_inventory_segment_id: "${seg_id}", row: 12, seat_letter: "A" }
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
              captures: { sa_a_id: $.data.id }
            - call: "POST /bookings/${b_id}/seat-assignments"
              payload: { seat_inventory_segment_id: "${seg_id}", row: 12, seat_letter: "B" }
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
              captures: { sa_b_id: $.data.id }
            - call: "POST /bookings/${b_id}/seat-assignments"
              payload: { seat_inventory_segment_id: "${seg_id}", row: 12, seat_letter: "C" }
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
              captures: { sa_c_id: $.data.id }
          trigger:
            - call: "POST /flights/${fl_id}/irops-waivers"
              payload: { event_type: "DIVERSION", delay_minutes: 0, waiver_scope: ["SEAT"] }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { w_id: $.data.id }
          assert:
            - "before the waiver the segment read total_seats 4, held_seats 3, sold_seats 0, available_seats 1"
            - "all three of SeatAssignment.${sa_a_id}, SeatAssignment.${sa_b_id} and SeatAssignment.${sa_c_id} are RELEASED with released_reason == IROPS_REACCOMMODATION"
            - "conservation restored - SeatInventorySegment.${seg_id} reads held_seats 0, sold_seats 0 and available_seats 4 == total_seats 4"
            - "zero RevenueEntry rows exist for Booking.${b_id}: a HELD seat was never sold, so no REFUND is posted"
            - "IropsWaiver.${w_id}.credited_bookings_count == 0 and credited_amount_cents == 0, because the booking was HELD rather than TICKETED"
            - "Booking.${b_id}.booking_status is still HELD, ancillary_gross_cents == 0 and waiver_applied == false (the flag is set only on TICKETED and CHANGE_PENDING bookings)"
            - "Flight.${fl_id}.irops_state == IRREGULAR with active_waiver_count == 1, and the segment is still OPEN"
