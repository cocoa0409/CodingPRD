            - "Route.${route_id}.status == PLANNING"

      - name: walkout_rejection_then_resubmission_retains_the_incremented_review_round
        claim_type: Idempotency
        grounds:
          - state_machines.FieldWalkout.transitions.SUBMITTED_to_REJECTED
          - state_machines.FieldWalkout.transitions.REJECTED_to_OPEN
          - entities.FieldWalkout.fields.review_round
          - complexity_profile.state_machine_shape
        distinguishing_aspect: "The revert cycle is not a reset: after a REJECTED review the resubmission returns the walkout to SUBMITTED while review_round stays at the incremented value 1 and rejection_reason is retained."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one Route in PLANNING (never scope-locked) with one RouteSegment (400 feet, URBAN_PAVED)"
            - "one FieldWalkout on that segment with one grade-B PoleObservation, submitted and then reviewed REJECTED with reason 'pole count does not match the field sketch', so status is REJECTED and review_round is 1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Harbor Loop", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 250000000 }
              as: RouteEngineer
              captures: { route_id: $.data.id }
            - call: "POST /segments"
              payload: { route_id: "${route_id}", sequence_index: 1, street_name: "Dock Street", municipality_code: "MUN-014", length_feet: 400, terrain_class: "URBAN_PAVED", planned_work_start_on: "2026-09-15", planned_work_end_on: "2026-09-20" }
              as: RouteEngineer
              captures: { seg_id: $.data.id }
            - call: "POST /walkouts"
              payload: { segment_id: "${seg_id}", walked_on: "2026-08-11", obstruction_count: 0, conduit_available_confirmed: false }
              as: FieldSurveyor
              captures: { wo_id: $.data.id }
            - call: "POST /pole-observations"
              payload: { walkout_id: "${wo_id}", pole_tag: "P-001", pole_owner: "TELCO", condition_grade: "B", available_vertical_clearance_in: 45, existing_attachment_count: 2 }
              as: FieldSurveyor
            - call: "POST /walkouts/${wo_id}/submit"
              payload: {}
              as: FieldSurveyor
            - call: "POST /walkouts/${wo_id}/review"
              payload: { decision: "REJECTED", rejection_reason: "pole count does not match the field sketch" }
              as: RouteEngineer
              as_user_id: "eng-alice"
          trigger:
            - call: "POST /walkouts/${wo_id}/submit"
              payload: {}
              as: FieldSurveyor
          assert:
            - "after the setup review, FieldWalkout.${wo_id}.status == REJECTED, review_round == 1 and rejection_reason == pole count does not match the field sketch"
            - "the trigger returns HTTP 200 and FieldWalkout.${wo_id}.status == SUBMITTED"
            - "FieldWalkout.${wo_id}.review_round == 1, unchanged by the resubmission"
            - "FieldWalkout.${wo_id}.rejection_reason == pole count does not match the field sketch, retained for audit"
            - "a review with decision REJECTED and no rejection_reason returns 400 ERR_INVALID_REQUEST"
            - "RouteSegment.${seg_id}.engineering_status == DRAFT throughout, because the rejection cascade had already reset it"

