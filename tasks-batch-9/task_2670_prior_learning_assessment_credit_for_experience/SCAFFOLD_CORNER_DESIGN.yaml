              payload: { learning_outcome_id: "${ocu_id}", points_awarded: 4, narrative: "Exceeds" }
              as: FacultyAssessor
              as_user_id: "${asr1_id}"
            - call: "POST /assessor-assignments/${asg_id}/complete"
              payload: { recommendation: "PASS" }
              as: FacultyAssessor
              as_user_id: "${asr1_id}"
            - call: "GET /students/${stu_id}"
              as: PlaCoordinator
              captures: { stu_v1: "$.data.version" }
          trigger:
            - call: "POST /pla-claims/${claim_id}/award"
              payload: { expected_student_version: "${stu_v1}", credits_awarded: 6 }
              as: PlaCoordinator
          assert:
            - "ArticulationRule.${rule_id}.awarded_credits == 3 while Course.${course_id}.credits == 6 and PlaClaim.${claim_id}.credits_requested == 6"
            - "PlaClaim.${claim_id}.assessment_status == SCORED and verified_coverage_bp == 10000 before the trigger"
            - "the trigger returns status 422 with data.error_id == ERR_AWARD_EXCEEDS_RECOMMENDATION"
            - "the claim stays SCORED, credits_awarded stays null and Student.${stu_id}.pla_credits_awarded stays 0"
            - "awarding credits_awarded 3 with the same expected_student_version returns 200 with credits_awarded == 3, Student.pla_upper_division_committed == 3 and upper_division_remaining == 0"
            - "in a variant whose recommendation carries recommended_level LOWER, the identical award returns 422 ERR_LEVEL_MISMATCH — priority 37 again, checked against the UPPER course level"
            - "in a variant whose program sets pla_upper_division_max_credits 1, awarding 3 passes priority 37 and then returns 409 ERR_UPPER_DIVISION_CAP_EXCEEDED"
            - "in that variant the award is refused outright — credits_awarded stays null and no partial 1-credit award is recorded"

  - section: rbac
    instances:
      - name: unauthenticated_and_unauthorized_calls_are_refused_ahead_of_every_business_rule
        claim_type: role_denial
        grounds:
          - validations[priority 1].ERR_UNAUTHENTICATED
          - validations[priority 2].ERR_UNAUTHORIZED
          - roles.Student
          - roles.PlaCoordinator
          - endpoints[POST /programs]
        distinguishing_aspect: |
          Authentication and authorization sit at priorities 1 and 2, so a Student
          calling a PlaCoordinator-only endpoint gets ERR_UNAUTHORIZED (403) even
          when the path id does not exist — the 404 family at priority 6 is never
          reached — and an entity-backed role whose X-User-ID matches no row gets
          ERR_UNAUTHENTICATED (401) rather than 403.
        test_recipe:
          setup:
            - "Program BSCS and Student S-1001 exist; the Student role is entity_backed:Student and PlaCoordinator is opaque."
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "BSCS", title: "BS Computer Science", total_credits_required: 120, residency_min_credits: 30, pla_max_credits: 30, pla_max_pct_bp: 2500, pla_upper_division_max_credits: 6, allowed_source_types: ["CREDIT_BY_EXAM", "PORTFOLIO", "MILITARY_TRAINING", "INDUSTRY_CREDENTIAL"], status: "ACTIVE" }
              as: PlaCoordinator
              captures: { prog_id: "$.data.id" }
            - call: "POST /students"
              payload: { student_number: "S-1001", full_name: "Ada Reyes", program_id: "${prog_id}", enrollment_status: "MATRICULATED", transfer_credits_accepted: 0, institutional_credits_earned: 60 }
              as: PlaCoordinator
              captures: { stu_id: "$.data.id" }
          trigger:
            - call: "POST /programs"
              payload: { program_code: "BSXX", title: "Self-service program", total_credits_required: 120, residency_min_credits: 30, pla_max_credits: 30, pla_max_pct_bp: 2500, pla_upper_division_max_credits: 6, allowed_source_types: ["PORTFOLIO"], status: "ACTIVE" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { err1: "$.data.error_id" }
          assert:
            - "the trigger returns status 403 with data.error_id == ERR_UNAUTHORIZED — creating programs is a PlaCoordinator exclusive_operation"
            - "GET /programs?limit=10&offset=0 as PlaCoordinator still shows exactly 1 program; the rejected create left nothing"
            - "POST /pla-claims/00000000-0000-4000-8000-000000000000/award as Student returns 403 ERR_UNAUTHORIZED, NOT 404 ERR_CLAIM_NOT_FOUND — priority 2 precedes priority 6"
            - "a request with no X-User-Role header returns 401 ERR_UNAUTHENTICATED"
            - "a request with X-User-Role Student but no X-User-ID returns 401 ERR_UNAUTHENTICATED"
            - "a request with X-User-Role Student and an X-User-ID that matches no Student row returns 401 ERR_UNAUTHENTICATED, not 403"
            - "a request with X-User-Role FacultyAssessor and an X-User-ID that matches no FacultyAssessor row returns 401 ERR_UNAUTHENTICATED"
            - "opaque roles such as PlaCoordinator, Registrar and ArticulationOfficer accept any non-empty X-User-ID"
            - "POST /pla-claims/{claim_id}/transcript-posting as PlaCoordinator returns 403 ERR_UNAUTHORIZED — posting is the Registrar's exclusive operation"

      - name: student_cannot_read_or_act_on_another_students_claim
        claim_type: peer_roles
        grounds:
          - validations[priority 3].ERR_FORBIDDEN_STUDENT_SCOPE
          - roles.Student
          - endpoints[GET /pla-claims/{claim_id}]
          - endpoints[GET /students/{student_id}/graduation-audit]
        distinguishing_aspect: |
          Two students in the same program are peers with disjoint scopes: S-1002
          reading S-1001's claim gets ERR_FORBIDDEN_STUDENT_SCOPE (403) even though
          the Student role IS listed on the endpoint, while the same read by any
          PlaCoordinator succeeds — scope is per-row ownership, not per-role.
        test_recipe:
          setup:
            - "Program BSCS, Course CS150, Students S-1001 and S-1002 in the same program."
            - "S-1001 owns a DRAFT PORTFOLIO claim with a DRAFT portfolio and one artifact."
