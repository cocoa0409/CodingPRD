  # ===========================================================================
  - section: calculations
    instances:
      - name: weekly_ot_accumulation_across_entries
        claim_type: correct_result
        grounds:
          - calculations.labor_cost
        distinguishing_aspect: "WEEKLY_OT input-set filtering: the second entry's split depends on prior same-worker same-week hours in status {SUBMITTED,APPROVED,INVOICED}; a 38h SUBMITTED entry makes a 5h entry split 2 regular / 3 OT."
        test_recipe:
          setup:
            - "WEEKLY_OT project; worker U-2001 has one 38h MW_JOURNEYMAN DAY entry on Monday 2026-08-10 in SUBMITTED status"
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "Weekly Accumulation Job", customer_name: "Acme", site_address: "33 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000, retainage_pct: 0.10, ot_basis: WEEKLY_OT }, as: ProjectManager, captures: { p_wa: $.data.id } }
            - { call: "POST /v1/labor-entries", payload: { project_id: "${p_wa}", worker_ref: "U-2001", classification: MW_JOURNEYMAN, work_date: "2026-08-10", hours_worked: 38, shift: DAY }, as: SiteSupervisor, captures: { le_wa1: $.data.id, wa1_total: $.data.total_cost_cents } }
            - { call: "POST /v1/labor-entries/${le_wa1}/submit", payload: {}, as: SiteSupervisor, as_user_id: sup-1 }
          trigger:
            - { call: "POST /v1/labor-entries", payload: { project_id: "${p_wa}", worker_ref: "U-2001", classification: MW_JOURNEYMAN, work_date: "2026-08-11", hours_worked: 5, shift: DAY }, as: SiteSupervisor, captures: { le_wa2: $.data.id, wa2_reg: $.data.regular_hours, wa2_ot: $.data.overtime_hours, wa2_total: $.data.total_cost_cents } }
          assert:
            - "First entry: regular_hours == 38, overtime_hours == 0, total_cost_cents == 402800 (323000 straight + 79800 fringe)"
            - "Second entry against prior 38h: regular_hours == 2, overtime_hours == 3 (${wa2_reg}/${wa2_ot})"
            - "Second entry total_cost_cents == 65750 (17000 straight + 38250 OT + 10500 fringe) (${wa2_total})"

      - name: night_shift_multiplier_without_ot
        claim_type: constants_applied
        grounds:
          - calculations.labor_cost
        distinguishing_aspect: "NIGHT_SHIFT_MULT 1.10 applies to the straight component of an APPRENTICE (5600) with no OT: round_half_up(8 * 5600 * 1.10) == 49280 plus fringe 16800."
        test_recipe:
          setup: ["DAILY_OT project; no prior entries for worker U-9301"]
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "Night Rate Job", customer_name: "Acme", site_address: "34 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000, retainage_pct: 0.10, ot_basis: DAILY_OT }, as: ProjectManager, captures: { p_ns: $.data.id } }
          trigger:
            - { call: "POST /v1/labor-entries", payload: { project_id: "${p_ns}", worker_ref: "U-9301", classification: MW_APPRENTICE, work_date: "2026-08-10", hours_worked: 8, shift: NIGHT }, as: SiteSupervisor, captures: { le_ns: $.data.id, ns_rate: $.data.base_rate_cents, ns_total: $.data.total_cost_cents } }
          assert:
            - "base_rate_cents == 5600 (${ns_rate}), overtime_hours == 0"
            - "total_cost_cents == 66080 (49280 straight with 1.10 night multiplier + 16800 fringe) (${ns_total})"

      - name: final_invoice_releases_retainage
        claim_type: correct_result
        grounds:
          - calculations.invoice_amount
          - entities.Invoice.fields.retainage_released_cents
        distinguishing_aspect: "A FINAL invoice on a COMPLETED TM project with no new billable work is exempt from ERR_NO_BILLABLE_WORK and pays out the accumulated retainage (26480) as its amount."
        test_recipe:
          setup:
            - "TM project COMPLETED; during COMMISSIONING a PROGRESS invoice for period 2026-08-01..2026-08-31 was created (gross 264800, retainage 26480, amount 238320) covering the 8h labor entry and the 4h executed lift"
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "Final Invoice Job", customer_name: "Acme", site_address: "35 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000, retainage_pct: 0.10, ot_basis: DAILY_OT }, as: ProjectManager, captures: { p_fi: $.data.id } }
            - { call: "POST /v1/safety-plans", payload: { project_id: "${p_fi}", plan_document_ref: "DOC-SP-1", loto_procedure_ref: "DOC-LOTO-1" }, as: SafetyOfficer, captures: { sp_fi: $.data.id } }
            - { call: "POST /v1/safety-plans/${sp_fi}/activate", payload: {}, as: SafetyOfficer }
            - { call: "POST /v1/projects/${p_fi}/advance", payload: {}, as: ProjectManager }
            - { call: "POST /v1/site-surveys", payload: { project_id: "${p_fi}", survey_date: "2026-08-01", anchor_bolt_count: 24, anchor_tolerance_mm: 3.0, anchor_measured_max_deviation_mm: 1.5, overhead_clearance_mm: 6000, foundation_pour_date: "2026-08-01T00:00:00Z" }, as: SiteSupervisor, captures: { ss_fi: $.data.id } }
            - { call: "POST /v1/site-surveys/${ss_fi}/submit", payload: {}, as: SiteSupervisor }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: ProjectManager }
            - { call: "POST /v1/site-surveys/${ss_fi}/review", payload: { outcome: ACCEPTED }, as: ProjectManager }
            - { call: "POST /v1/projects/${p_fi}/advance", payload: {}, as: ProjectManager, captures: { p_fi_v: $.data.version } }
            - { call: "POST /v1/labor-entries", payload: { project_id: "${p_fi}", worker_ref: "U-9401", classification: MW_JOURNEYMAN, work_date: "2026-08-09", hours_worked: 8, shift: DAY }, as: SiteSupervisor, captures: { le_fi: $.data.id } }
            - { call: "POST /v1/labor-entries/${le_fi}/submit", payload: {}, as: SiteSupervisor, as_user_id: sup-1 }
            - { call: "POST /v1/labor-entries/${le_fi}/approve", payload: {}, as: PayrollClerk, as_user_id: pay-1 }
            - { call: "POST /v1/rigging-plans", payload: { project_id: "${p_fi}", expected_project_version: "${p_fi_v}", lift_weight_tons: 40, crane_model: "GROVE GMK5250", planned_crane_capacity_tons: 50, rigging_config: SINGLE_CRANE }, as: SiteSupervisor, captures: { rp_fi: $.data.id } }
            - { call: "POST /v1/rigging-plans/${rp_fi}/submit", payload: {}, as: SiteSupervisor }
            - { call: "POST /v1/rigging-plans/${rp_fi}/review", payload: { outcome: APPROVED }, as: ProjectManager }
            - { call: "POST /v1/lift-permits", payload: { project_id: "${p_fi}", crane_ref: "CR-7", lift_starts_at: "2026-08-10T10:00:00Z", lift_ends_at: "2026-08-10T14:00:00Z", road_permit_required: false }, as: SiteSupervisor, captures: { lp_fi: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T11:00:00Z" }, as: ProjectManager }
            - { call: "POST /v1/lift-permits/${lp_fi}/execute", payload: {}, as: SiteSupervisor }
            - { call: "POST /v1/projects/${p_fi}/advance", payload: {}, as: ProjectManager }
            - { call: "POST /v1/invoices", payload: { project_id: "${p_fi}", kind: PROGRESS, period_start: "2026-08-01", period_end: "2026-08-31" }, as: ProjectManager, captures: { inv_fi1_ret: $.data.retainage_cents } }
            - { call: "POST /v1/commissioning-checklists", payload: { project_id: "${p_fi}", items: [{ item_key: "GROUT", description: "grout cured", required: true }] }, as: ProjectManager, captures: { cc_fi: $.data.id } }
            - { call: "POST /v1/alignment-records", payload: { project_id: "${p_fi}", measurement_point: "PUMP-MOTOR", tolerance_class: PRECISION, measured_offset_mils: 1.5, measured_angular_mils_per_in: 0.4 }, as: SiteSupervisor, captures: { ar_fi: $.data.id } }
            - { call: "POST /v1/alignment-records/${ar_fi}/review", payload: { outcome: ACCEPTED }, as: ProjectManager }
            - { call: "POST /v1/commissioning-checklists/${cc_fi}/check-item", payload: { item_key: "GROUT" }, as: SiteSupervisor }
            - { call: "POST /v1/commissioning-checklists/${cc_fi}/submit", payload: {}, as: ProjectManager }
            - { call: "POST /v1/commissioning-checklists/${cc_fi}/sign-off", payload: {}, as: CustomerRep }
            - { call: "POST /v1/projects/${p_fi}/advance", payload: {}, as: ProjectManager }
          trigger:
            - { call: "POST /v1/invoices", payload: { project_id: "${p_fi}", kind: FINAL, period_start: "2026-09-01", period_end: "2026-09-30" }, as: ProjectManager, captures: { inv_fi2_gross: $.data.gross_cents, inv_fi2_rel: $.data.retainage_released_cents, inv_fi2_amount: $.data.amount_cents } }
          assert:
            - "FINAL invoice: gross_cents == 0 (${inv_fi2_gross}) — the earlier labor entry is INVOICED and no longer eligible"
            - "retainage_released_cents == 26480 (${inv_fi2_rel}) equals the retainage withheld on the PROGRESS invoice (${inv_fi1_ret})"
            - "amount_cents == 26480 (${inv_fi2_amount}) — pure retainage release, exempt from ERR_NO_BILLABLE_WORK"

      - name: lump_sum_second_progress_cumulative
        claim_type: correct_result
        grounds:
          - calculations.invoice_amount
        distinguishing_aspect: "LUMP_SUM gross is cumulative-to-date less previously invoiced gross: second invoice at progress_pct 25 yields gross 750000 (= round(5000000*0.25) - 500000), not 1250000."
        test_recipe:
          setup: ["LUMP_SUM project (contract 5000000, retainage 0.10) MOBILIZED; first PROGRESS invoice at progress_pct 10 already created (gross 500000)"]
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "Progress Job", customer_name: "Beta Foods", site_address: "36 Mill Ave", billing_mode: LUMP_SUM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000, retainage_pct: 0.10, ot_basis: DAILY_OT }, as: ProjectManager, captures: { p_lp: $.data.id } }
            - { call: "POST /v1/safety-plans", payload: { project_id: "${p_lp}", plan_document_ref: "DOC-SP-2", loto_procedure_ref: "DOC-LOTO-2" }, as: SafetyOfficer, captures: { sp_lp: $.data.id } }
            - { call: "POST /v1/safety-plans/${sp_lp}/activate", payload: {}, as: SafetyOfficer }
            - { call: "POST /v1/projects/${p_lp}/advance", payload: {}, as: ProjectManager }
            - { call: "POST /v1/invoices", payload: { project_id: "${p_lp}", kind: PROGRESS, period_start: "2026-08-01", period_end: "2026-08-15", progress_pct: 10 }, as: ProjectManager, captures: { inv_lp1_gross: $.data.gross_cents } }
          trigger:
            - { call: "POST /v1/invoices", payload: { project_id: "${p_lp}", kind: PROGRESS, period_start: "2026-08-16", period_end: "2026-08-31", progress_pct: 25 }, as: ProjectManager, captures: { inv_lp2_gross: $.data.gross_cents, inv_lp2_ret: $.data.retainage_cents, inv_lp2_amount: $.data.amount_cents } }
          assert:
            - "First invoice gross == 500000 (${inv_lp1_gross})"
            - "Second invoice gross_cents == 750000 (${inv_lp2_gross}) — cumulative target 1250000 minus prior gross 500000"
            - "Second invoice retainage_cents == 75000 and amount_cents == 675000"

  # ===========================================================================
  - section: validations
    instances:
      - name: missing_role_header_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request without a valid X-User-Role is rejected 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/projects", payload: { name: "No Role", customer_name: "Acme", site_address: "37 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000 }, as: Anonymous, captures: { ua_err: $.data.error_id } }
          assert:
            - "Response is 401 with error_id ERR_UNAUTHENTICATED (${ua_err})"

      - name: invalid_enum_outcome_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "An outcome value outside {ACCEPTED, REJECTED} on a SUBMITTED survey fails schema validation with ERR_VALIDATION."
        test_recipe:
          setup: ["Project with a SUBMITTED survey"]
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "Enum Job", customer_name: "Acme", site_address: "38 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000 }, as: ProjectManager, captures: { p_ev: $.data.id } }
            - { call: "POST /v1/site-surveys", payload: { project_id: "${p_ev}", survey_date: "2026-08-01", anchor_bolt_count: 24, anchor_tolerance_mm: 3.0, anchor_measured_max_deviation_mm: 1.5, overhead_clearance_mm: 6000, foundation_pour_date: "2026-08-01T00:00:00Z" }, as: SiteSupervisor, captures: { ss_ev: $.data.id } }
            - { call: "POST /v1/site-surveys/${ss_ev}/submit", payload: {}, as: SiteSupervisor }
          trigger:
            - { call: "POST /v1/site-surveys/${ss_ev}/review", payload: { outcome: MAYBE }, as: ProjectManager, captures: { ev_err: $.data.error_id } }
          assert:
            - "Response is 400 with error_id ERR_VALIDATION (${ev_err}); survey remains SUBMITTED"

      - name: nte_exceeded_on_tm_invoice
        claim_type: violation_to_error
        grounds:
          - validations[priority=26]
          - errors[ERR_NTE_EXCEEDED]
        distinguishing_aspect: "TM fiscal gate fires on its own: project in INSTALLING (state-valid), approved gross 114500 vs NTE cap 100000 -> ERR_NTE_EXCEEDED."
        test_recipe:
          setup: ["TM project (NTE 100000) in INSTALLING with one APPROVED 10h MW_JOURNEYMAN DAY entry (114500) on 2026-08-09; no lift permits"]
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "NTE Job", customer_name: "Acme", site_address: "39 Plant Rd", billing_mode: TM, contract_amount_cents: 100000, equipment_hourly_rate_cents: 45000, retainage_pct: 0.10, ot_basis: DAILY_OT }, as: ProjectManager, captures: { p_nt: $.data.id } }
            - { call: "POST /v1/safety-plans", payload: { project_id: "${p_nt}", plan_document_ref: "DOC-SP-1", loto_procedure_ref: "DOC-LOTO-1" }, as: SafetyOfficer, captures: { sp_nt: $.data.id } }
            - { call: "POST /v1/safety-plans/${sp_nt}/activate", payload: {}, as: SafetyOfficer }
            - { call: "POST /v1/projects/${p_nt}/advance", payload: {}, as: ProjectManager }
            - { call: "POST /v1/site-surveys", payload: { project_id: "${p_nt}", survey_date: "2026-08-01", anchor_bolt_count: 24, anchor_tolerance_mm: 3.0, anchor_measured_max_deviation_mm: 1.5, overhead_clearance_mm: 6000, foundation_pour_date: "2026-08-01T00:00:00Z" }, as: SiteSupervisor, captures: { ss_nt: $.data.id } }
            - { call: "POST /v1/site-surveys/${ss_nt}/submit", payload: {}, as: SiteSupervisor }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: ProjectManager }
            - { call: "POST /v1/site-surveys/${ss_nt}/review", payload: { outcome: ACCEPTED }, as: ProjectManager }
            - { call: "POST /v1/projects/${p_nt}/advance", payload: {}, as: ProjectManager }
            - { call: "POST /v1/labor-entries", payload: { project_id: "${p_nt}", worker_ref: "U-9501", classification: MW_JOURNEYMAN, work_date: "2026-08-09", hours_worked: 10, shift: DAY }, as: SiteSupervisor, captures: { le_nt: $.data.id } }
            - { call: "POST /v1/labor-entries/${le_nt}/submit", payload: {}, as: SiteSupervisor, as_user_id: sup-1 }
            - { call: "POST /v1/labor-entries/${le_nt}/approve", payload: {}, as: PayrollClerk, as_user_id: pay-1 }
          trigger:
            - { call: "POST /v1/invoices", payload: { project_id: "${p_nt}", kind: PROGRESS, period_start: "2026-08-09", period_end: "2026-08-09" }, as: ProjectManager, captures: { nt_err: $.data.error_id } }
          assert:
            - "Response error_id == ERR_NTE_EXCEEDED (${nt_err}) — cumulative gross 114500 > NTE 100000"
            - "LaborEntry.${le_nt} remains APPROVED (not marked INVOICED)"

      - name: no_billable_work_on_empty_period
        claim_type: violation_to_error
        grounds:
          - validations[priority=28]
          - errors[ERR_NO_BILLABLE_WORK]
        distinguishing_aspect: "A PROGRESS invoice with no eligible labor or executed lifts in the period fails with ERR_NO_BILLABLE_WORK."
        test_recipe:
          setup: ["TM project MOBILIZED with no labor entries and no lifts"]
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "Empty Bill Job", customer_name: "Acme", site_address: "40 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000, retainage_pct: 0.10, ot_basis: DAILY_OT }, as: ProjectManager, captures: { p_eb: $.data.id } }
            - { call: "POST /v1/safety-plans", payload: { project_id: "${p_eb}", plan_document_ref: "DOC-SP-1", loto_procedure_ref: "DOC-LOTO-1" }, as: SafetyOfficer, captures: { sp_eb: $.data.id } }
            - { call: "POST /v1/safety-plans/${sp_eb}/activate", payload: {}, as: SafetyOfficer }
            - { call: "POST /v1/projects/${p_eb}/advance", payload: {}, as: ProjectManager }
          trigger:
            - { call: "POST /v1/invoices", payload: { project_id: "${p_eb}", kind: PROGRESS, period_start: "2026-08-01", period_end: "2026-08-31" }, as: ProjectManager, captures: { eb_err: $.data.error_id } }
          assert:
            - "Response error_id == ERR_NO_BILLABLE_WORK (${eb_err}); no Invoice row created"

      - name: final_invoice_exists
        claim_type: violation_to_error
        grounds:
          - validations[priority=27]
          - errors[ERR_FINAL_INVOICE_EXISTS]
        distinguishing_aspect: "At most one FINAL invoice per project; the second FINAL attempt fails with ERR_FINAL_INVOICE_EXISTS."
        test_recipe:
          setup: ["TM project COMPLETED with a FINAL invoice already created (full completion chain, then one FINAL invoice)"]
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "Double Final Job", customer_name: "Acme", site_address: "41 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000, retainage_pct: 0.10, ot_basis: DAILY_OT }, as: ProjectManager, captures: { p_df: $.data.id } }
            - { call: "POST /v1/safety-plans", payload: { project_id: "${p_df}", plan_document_ref: "DOC-SP-1", loto_procedure_ref: "DOC-LOTO-1" }, as: SafetyOfficer, captures: { sp_df: $.data.id } }
            - { call: "POST /v1/safety-plans/${sp_df}/activate", payload: {}, as: SafetyOfficer }
            - { call: "POST /v1/projects/${p_df}/advance", payload: {}, as: ProjectManager }
            - { call: "POST /v1/site-surveys", payload: { project_id: "${p_df}", survey_date: "2026-08-01", anchor_bolt_count: 24, anchor_tolerance_mm: 3.0, anchor_measured_max_deviation_mm: 1.5, overhead_clearance_mm: 6000, foundation_pour_date: "2026-08-01T00:00:00Z" }, as: SiteSupervisor, captures: { ss_df: $.data.id } }
            - { call: "POST /v1/site-surveys/${ss_df}/submit", payload: {}, as: SiteSupervisor }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: ProjectManager }
