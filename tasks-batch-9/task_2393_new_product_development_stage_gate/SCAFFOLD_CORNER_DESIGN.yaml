      - name: sm_killed_project_locks_out_further_writes
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.InnovationProject.dev_status.terminal_states
          - errors[ERR_PROJECT_INVALID_STATE]
        distinguishing_aspect: |
          KILLED is terminal for every child-creating route: business cases, formulations and
          gate reviews are all refused, and re-screening is refused too, so the kill cannot be
          undone by replaying the screen that caused it.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-03T00:00:00Z."
            - "A SNACK gate 2 exists so the screening branch is the only difference."
            - "One SNACK project screened at 59.99 and therefore in dev_status KILLED."
