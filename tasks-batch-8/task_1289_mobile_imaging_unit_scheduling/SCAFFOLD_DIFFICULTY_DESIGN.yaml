  - rule_id: resource_temporal_overlap
    instances:
      - name: appointment_turnover_buffer_overlap_semantics
        grounds:
          - calculations.appointment_window_and_overlap
          - errors[ERR_SLOT_OVERLAP]
        distinguishing_aspect: |
          Resource: the SiteDayAssignment service window; semantics: half-open scan intervals
          with a 10-minute trailing turnover buffer per existing appointment. Existing
          09:00-09:30 blocks a new start at 09:35 (09:35 < 09:30+10) but admits 09:40
          (09:40 < 09:40 is false). Distinct interval semantics from the discrete day-capacity
          unit rule.
        test_recipe:
          setup:
            - "Bookable site day with window 08:30-16:00 and one appointment 09:00 + 30 min"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OperationsDirector }
            - { call: "POST /api/facilities", payload: { name: "Hospital A", address: "1 A St", supported_modalities: ["CT"], pad_amps_available: 150, pad_voltage: 480, pad_level_tolerance_deg: 2.0 }, as: OperationsDirector, captures: { fac_a: $.data.id } }
