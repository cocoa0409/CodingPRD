  # ===================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: replacement_score_threshold_inclusive
        grounds:
          - calculations.replacement_score
          - entities.Vehicle.fields.replacement_score
          - entities.Vehicle.fields.lifecycle_status
        distinguishing_aspect: "Numeric-threshold boundary on POST /vehicles/{id}/replacement-evaluation: replacement_score exactly 70.00 flags the vehicle because the comparison is >= (inclusive), whereas 69.73 does not."
        test_recipe:
          setup:
            - "Two vehicles in_service 2010; clock 2026-06-01. Vehicle A odometer 150000 (score 70.00); Vehicle B odometer 149000 (score 69.73)."
          setup_api_calls:
            - call: "POST /vehicle-class-policies"
              payload: { vehicle_class: "SEDAN", assignment_fee_cents_per_month: 30000, mileage_tier1_rate_cents: 50, mileage_tier2_rate_cents: 80, mileage_tier_boundary_miles: 1000, fuel_surcharge_multiplier: 1.1, idle_free_minutes: 60, idle_penalty_cents_per_min: 25, replacement_age_years: 10, replacement_mileage: 150000, replacement_maint_ratio: 0.6 }
              as: FleetAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FleetAdmin
            - call: "POST /vehicles"
              payload: { vin: "VIN-BND-A", vehicle_class: "SEDAN", acquisition_cost_cents: 2000000, in_service_date: "2010-01-01T00:00:00Z" }
              as: FleetAdmin
              captures: { a_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "VIN-BND-B", vehicle_class: "SEDAN", acquisition_cost_cents: 2000000, in_service_date: "2010-01-01T00:00:00Z" }
              as: FleetAdmin
              captures: { b_id: $.data.id }
            - call: "POST /vehicles/${a_id}/fuel-logs"
              payload: { reading_at: "2026-06-01T06:00:00Z", gallons: 1, fuel_cost_cents: 0, odometer_miles: 150000 }
              as: ShopTech
            - call: "POST /vehicles/${b_id}/fuel-logs"
              payload: { reading_at: "2026-06-01T06:00:00Z", gallons: 1, fuel_cost_cents: 0, odometer_miles: 149000 }
              as: ShopTech
          trigger:
            - call: "POST /vehicles/${a_id}/replacement-evaluation"
              payload: {}
              as: FleetAdmin
              captures: { sa: $.data.replacement_score, lca: $.data.lifecycle_status }
            - call: "POST /vehicles/${b_id}/replacement-evaluation"
              payload: {}
              as: FleetAdmin
              captures: { sb: $.data.replacement_score, lcb: $.data.lifecycle_status }
          assert:
            - "Vehicle.${a_id}.replacement_score == 70.00"
            - "Vehicle.${a_id}.lifecycle_status == FLAGGED_FOR_REPLACEMENT"
            - "Vehicle.${b_id}.replacement_score == 69.73"
            - "Vehicle.${b_id}.lifecycle_status == ACTIVE"
      - name: empty_pool_no_vehicle_available
        grounds:
          - calculations.pool_vehicle_selector
          - errors[ERR_NO_VEHICLE_AVAILABLE]
          - state_machines.Reservation.REQUESTED_to_CONFIRMED
        distinguishing_aspect: "Empty-collection boundary on POST /reservations/{id}/confirm: with zero POOL vehicles in existence the candidate set is empty and confirm returns ERR_NO_VEHICLE_AVAILABLE (distinct metric/endpoint from the numeric replacement threshold)."
        test_recipe:
          setup:
            - "SEDAN policy; dept budget 10000000; NO vehicles at all; one REQUESTED reservation."
          setup_api_calls:
            - call: "POST /vehicle-class-policies"
              payload: { vehicle_class: "SEDAN", assignment_fee_cents_per_month: 30000, mileage_tier1_rate_cents: 50, mileage_tier2_rate_cents: 80, mileage_tier_boundary_miles: 1000, fuel_surcharge_multiplier: 1.1, idle_free_minutes: 60, idle_penalty_cents_per_min: 25, replacement_age_years: 10, replacement_mileage: 150000, replacement_maint_ratio: 0.6 }
              as: FleetAdmin
            - call: "POST /departments"
              payload: { name: "Empty", cost_center_code: "CC-500", monthly_budget_cents: 10000000 }
              as: FleetAdmin
              captures: { dep_id: $.data.id }
            - call: "POST /reservations"
              payload: { department_id: "${dep_id}", requested_start: "2026-06-05T09:00:00Z", requested_end: "2026-06-05T13:00:00Z", driver_name: "D", purpose: "x" }
              as: MotorPoolClerk
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: MotorPoolClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NO_VEHICLE_AVAILABLE"
