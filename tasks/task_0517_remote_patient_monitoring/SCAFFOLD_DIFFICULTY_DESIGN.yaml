scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: care_time_provisional_vs_finalized_diverges_on_billing_period
        grounds:
          - calculations.care_time_aggregation
          - entities.BillingPeriod.fields.provisional_total_minutes
          - entities.BillingPeriod.fields.finalized_total_minutes
          - state_machines.BillingPeriod.OPEN_to_FINALIZED
        distinguishing_aspect: |
          The provisional variant on BillingPeriod reflects only activities logged so far (12 after the
          first activity), while the finalized variant, computed at finalize over all three activities,
          equals 30 — the two variants produce different minute totals for the same period entity.
        test_recipe:
          setup:
            - "MEDICARE payer; patient ENROLLED with an ACTIVE care plan and an ACTIVE device; OPEN billing period for 2026-06."
            - "Clock set into 2026-06; one care activity (12 min) logged, then two more (8 min, 10 min) on distinct days."
            - "Clock advanced past 2026-06-30 so the period can be finalized."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Medicare A", payer_type: "MEDICARE", rate_99453_cents: 1965, rate_99454_cents: 4774, rate_99457_cents: 4877 }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_id: "${payer_id}", mrn: "M-DV-1", full_name: "Dana Vu" }
              as: CareCoordinator
              captures: { pid: $.data.id }
            - call: "POST /patients/${pid}/consents"
              payload: { consent_type: "BOTH", effective_at: "2026-05-01T00:00:00Z" }
              as: CareCoordinator
              captures: { consent_id: $.data.id }
            - call: "POST /patients/${pid}/care-plans"
              payload: { diagnosis_code: "I10", goal_text: "BP control", required_care_minutes: 20 }
              as: Physician
              captures: { plan_id: $.data.id }
            - call: "POST /patients/${pid}/care-plans/${plan_id}/activate"
              payload: {}
              as: Physician
            - call: "POST /patients/${pid}/enroll"
              payload: {}
              as: CareCoordinator
            - call: "POST /patients/${pid}/devices"
              payload: { device_type: "BP_CUFF", serial_number: "SN-DV-1" }
              as: CareCoordinator
              captures: { dev_id: $.data.id }
            - call: "POST /patients/${pid}/devices/${dev_id}/activate"
              payload: {}
              as: CareCoordinator
            - call: "POST /patients/${pid}/billing-periods"
              payload: { period_year: 2026, period_month: 6 }
              as: BillingSpecialist
              captures: { bp_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: BillingSpecialist
            - call: "POST /patients/${pid}/care-activities"
              payload: { billing_period_id: "${bp_id}", clinician_user_id: "clin-1", activity_type: "REVIEW", minutes: 12, performed_at: "2026-06-05T09:00:00Z" }
              as: Clinician
            - call: "GET /billing-periods/${bp_id}"
              payload: {}
              as: BillingSpecialist
              captures: { prov_after_first: $.data.provisional_total_minutes }
            - call: "POST /patients/${pid}/care-activities"
              payload: { billing_period_id: "${bp_id}", clinician_user_id: "clin-1", activity_type: "OUTREACH", minutes: 8, performed_at: "2026-06-06T09:00:00Z" }
              as: Clinician
            - call: "POST /patients/${pid}/care-activities"
              payload: { billing_period_id: "${bp_id}", clinician_user_id: "clin-1", activity_type: "EDUCATION", minutes: 10, performed_at: "2026-06-07T09:00:00Z" }
              as: Clinician
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: BillingSpecialist
            - call: "GET /billing-periods/${bp_id}"
              payload: {}
              as: BillingSpecialist
              captures: { bp_v: $.data.version }
          trigger:
            - call: "POST /billing-periods/${bp_id}/finalize"
              payload: { expected_billing_period_version: "${bp_v}" }
              as: BillingSpecialist
              captures: { fin_minutes: $.data.finalized_total_minutes }
          assert:
            - "provisional observed after first activity (${prov_after_first}) == 12"
            - "BillingPeriod.${bp_id}.finalized_total_minutes == 30"
            - "BillingPeriod.${bp_id}.provisional_total_minutes == 30 (after all three activities)"
            - "BillingPeriod.${bp_id}.status == FINALIZED"

      - name: claim_settlement_partial_vs_full_diverges_on_claim
        grounds:
          - calculations.payer_reimbursement_settlement
          - entities.Claim.fields.reimbursed_cents
          - state_machines.Claim.ACCEPTED_to_PARTIALLY_PAID
          - state_machines.Claim.PARTIALLY_PAID_to_PAID
        distinguishing_aspect: |
          Settlement is computed on the Claim entity (a different entity domain than care_time on
          BillingPeriod): a 5000-cent remittance yields the partial variant (PARTIALLY_PAID, outstanding
          6616) while a follow-up 6616-cent remittance yields the full variant (PAID, outstanding 0).
        test_recipe:
          setup:
            - "A FINALIZED period for a fully eligible patient (99453+99454+99457) with finalized_total_cents == 11616, claim submitted and accepted."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Medicare B", payer_type: "MEDICARE", rate_99453_cents: 1965, rate_99454_cents: 4774, rate_99457_cents: 4877, requires_active_consent: false }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
