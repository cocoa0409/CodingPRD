  # ===========================================================================
  # Cross-cutting complexity layers (§1.0 complexity_layers + §1.2.1)
  # optimistic_concurrency | cascading_side_effects
  # dual_variant_calculation | rate_threshold_triggers
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: filing_creation_rejects_a_stale_club_version_and_admits_the_refreshed_one
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[transaction-create-stale-team]
          - validations[priority=10]
          - errors[ERR_STALE_TEAM_VERSION]
          - entities.Team.fields.version
        distinguishing_aspect: "Nothing about the second filing is otherwise objectionable — a club may hold several DRAFT filings at once — so the only signal that the writer never saw the cap moved by the first filing is the stale expected_team_version, which yields ERR_STALE_TEAM_VERSION 412; re-reading the club makes the identical call succeed."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z."
            - "Harbor Kings (cap 500000000) is read at version 1 and two UNROSTERED players exist."
            - "A first SIGNING filing for Ray Alder is created with that version, which advances Team.version to 2 and provisional_cap_committed_cents to 83333333."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
            - call: "POST /teams"
              payload: { name: "Harbor Kings", market_code: "HKG", salary_cap_limit_cents: 500000000, waiver_priority_rank: 1 }
              as: LeagueOfficer
              captures: { oc_team_id: $.data.id, oc_team_v1: $.data.version }
            - call: "POST /players"
              payload: { full_name: "Ray Alder", position: "QB" }
              as: LeagueOfficer
              captures: { oc_p1_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Milo Sarr", position: "WR" }
              as: LeagueOfficer
              captures: { oc_p2_id: $.data.id }
            - call: "POST /transactions"
              payload: { team_id: "${oc_team_id}", player_id: "${oc_p1_id}", transaction_type: "SIGNING", expected_team_version: "${oc_team_v1}", years: 3, base_salary_cents: 80000000, signing_bonus_cents: 10000000, start_season_year: 2026 }
              as: TeamCapAnalyst
              as_user_id: "${oc_team_id}"
              captures: { oc_txn1_id: $.data.id }
