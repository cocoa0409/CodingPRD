            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "00000000-0000-0000-0000-000000000000", reported_issue: "x" }, captures: { e3: $.data.error_id } }
          assert:
            - "e1 == ERR_MODEL_NOT_FOUND"
            - "e2 == ERR_CUSTOMER_NOT_FOUND"
            - "e3 == ERR_UNIT_NOT_FOUND"

      - name: workflow_reference_not_found_fc_part_bay_loaner
        claim_type: violation_to_error
