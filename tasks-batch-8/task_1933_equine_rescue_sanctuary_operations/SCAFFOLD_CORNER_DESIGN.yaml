            - { call: "POST /rescue-ops/adoption-applications/${app}/start-review", payload: {}, as: AdoptionOfficer, as_user_id: "officer-1" }
            - { call: "POST /rescue-ops/home-checks", payload: { application_id: "${app}", scheduled_date: "2026-08-15T10:00:00Z" }, as: AdoptionOfficer, as_user_id: "officer-1", captures: { hc: $.data.id } }
            - { call: "POST /rescue-ops/home-checks/${hc}/complete", payload: { outcome: PASSED }, as: AdoptionOfficer, as_user_id: "officer-1" }
            - { call: "POST /rescue-ops/adoption-applications/${app}/approve", payload: {}, as: AdoptionOfficer, as_user_id: "officer-2" }
            - { call: "POST /rescue-ops/adoption-applications/${app}/pay-fee", payload: { amount_cents: 75000 }, as: Adopter, as_user_id: "${ad}" }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-18T00:00:00Z" }, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/adoption-applications/${app}/finalize", payload: {}, as: AdoptionOfficer, as_user_id: "officer-2" }
            - { call: "GET /rescue-ops/follow-up-visits?application_id=${app}", as: AdoptionOfficer, as_user_id: "officer-1", captures: { fu: "$.data[0].id" } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-09-17T00:00:00Z" }, as: SanctuaryDirector }
          trigger:
            - { call: "POST /rescue-ops/follow-up-visits/${fu}/complete", payload: { outcome: PASSED, findings: "horse thriving" }, as: AdoptionOfficer, as_user_id: "officer-1", captures: { fu_st: $.data.status, fu_out: $.data.outcome } }
            - { call: "GET /rescue-ops/adoption-applications/${app}", as: AdoptionOfficer, as_user_id: "officer-1", captures: { app_st: $.data.status } }
            - { call: "GET /rescue-ops/horses/${h}", as: SanctuaryDirector, captures: { h_st: $.data.status } }
          assert:
            - "fu_st == COMPLETED AND fu_out == PASSED"
            - "app_st == FINALIZED AND h_st == ADOPTED (no cascade on a passed visit)"
            - "remaining SCHEDULED follow-up visits for ${app} unchanged (2 still SCHEDULED)"
