# §1.9 Scaffold Corner Design — breadth coverage of every testable claim in
# SCAFFOLD.yaml §1.1–§1.7 that §1.8 does not already cover. Clock default 2026-08-01T00:00:00Z.
scaffold_corner_design:
  - section: entities
    instances:
      - name: property_creation_returns_all_fields
        claim_type: creation
        grounds: ["entities.Property", "endpoints['POST /api/properties']"]
        distinguishing_aspect: "POST with all 12 policy fields returns 201 with every input echoed plus system id/created_at/version == 1."
        test_recipe:
          setup: ["empty database, default clock 2026-08-01"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id, pv: $.data.version } }
          assert:
            - "response 201; data contains all 12 input fields with the submitted values"
            - "captured pv == 1 and prop is a server-minted UUID; created_at reads 2026-08-01 (default logical clock)"

      - name: tenant_creation_applies_phone_default
        claim_type: defaults
        grounds: ["entities.Tenant.fields.phone"]
        distinguishing_aspect: "Omitting optional phone yields the empty-string default; version starts at 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id, phone: $.data.phone } }
          assert:
            - "captured phone == '' (default applied)"
            - "captured ten is a UUID"

      - name: lease_created_in_draft_with_computed_defaults
        claim_type: initial_state
        grounds: ["state_machines.Lease", "entities.Lease.fields.status"]
        distinguishing_aspect: "A new lease starts in DRAFT with status set by the system even though the caller supplied no status."
        test_recipe:
          setup: ["property and tenant exist"]
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
          trigger:
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { lease: $.data.id, st: $.data.status, lv: $.data.version } }
          assert:
            - "captured st == DRAFT and lv == 1"
            - "move_out_date is null on creation"

      - name: lease_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "Reading a well-formed but nonexistent lease id returns ERR_NOT_FOUND (404), not a 500 or empty object."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/leases/00000000-0000-0000-0000-000000000000", as: PropertyManager, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_NOT_FOUND and HTTP status 404"

      - name: lease_list_filters_by_property_and_status
        claim_type: listing
        grounds: ["endpoints['GET /api/leases']"]
        distinguishing_aspect: "property_id filter returns only that property's leases and the envelope carries total_count/has_more; status filter narrows further."
        test_recipe:
          setup: ["two properties P1 and P2; two leases on P1 (units 101, 102), one on P2 (unit 201); all DRAFT"]
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "P1", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { p1: $.data.id } }
            - { call: "POST /api/properties", payload: { name: "P2", state_code: "WA", posting_priority_policy: "RENT_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { p2: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${p1}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager }
            - { call: "POST /api/leases", payload: { property_id: "${p1}", primary_tenant_id: "${ten}", unit_label: "102", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager }
            - { call: "POST /api/leases", payload: { property_id: "${p2}", primary_tenant_id: "${ten}", unit_label: "201", monthly_rent_cents: 150000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager }
          trigger:
            - { call: "GET /api/leases", payload: { property_id: "${p1}" }, as: PropertyManager }
            - { call: "GET /api/leases", payload: { property_id: "${p1}", status: "ACTIVE" }, as: PropertyManager }
          assert:
            - "first read: response_type array, total_count == 2, has_more == false, both items carry property_id == ${p1}"
            - "second read: total_count == 0 (no ACTIVE leases yet) and data is an empty array"

      - name: charge_computed_outstanding_equals_amount_on_create
        claim_type: computed_fields
        grounds: ["entities.LedgerCharge.fields.outstanding_cents"]
        distinguishing_aspect: "outstanding_cents is computed (== amount_cents with no allocations) and a client-supplied outstanding_cents is rejected as an undeclared field."
        test_recipe:
          setup: ["property, tenant, DRAFT lease exist"]
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { lease: $.data.id } }
          trigger:
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "RENT", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 200000 }, as: LeasingAgent, captures: { rc: $.data.id, out: $.data.outstanding_cents, wv: $.data.waived_cents } }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "DAMAGE_FEE", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 1000, outstanding_cents: 5 }, as: LeasingAgent, captures: { err: $.data.error_id } }
          assert:
            - "captured out == 200000 and wv == 0 (computed, not caller-supplied)"
            - "captured err == ERR_INVALID_REQUEST (undeclared payload field rejected)"

      - name: manual_charge_kind_restriction_rejected
        claim_type: type_constraints
        grounds: ["entities.LedgerCharge.fields.kind", "validations[priority=18]"]
        distinguishing_aspect: "Manual creation with kind LATE_FEE (a system-only kind) fails ERR_INVALID_REQUEST; only RENT and DAMAGE_FEE are manually creatable."
        test_recipe:
          setup: ["property, tenant, DRAFT lease exist"]
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { lease: $.data.id } }
          trigger:
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "LATE_FEE", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 4000 }, as: LeasingAgent, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_REQUEST"

      - name: allocation_rows_carry_no_version_fields
        claim_type: immutability
        grounds: ["entities.PaymentAllocation"]
        distinguishing_aspect: "PaymentAllocation is common_fields:false: read rows expose id and created_at but no version or updated_at, and no endpoint mutates them."
        test_recipe:
          setup: ["property PA, ACTIVE lease, RENT charge 200000 due 2026-08-01, payment 200000 posted"]
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { lease: $.data.id } }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "RENT", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 200000 }, as: LeasingAgent, captures: { rc: $.data.id } }
            - { call: "POST /api/leases/${lease}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "POST /api/payments", payload: { lease_id: "${lease}", tenant_id: "${ten}", channel: "CARD", amount_cents: 200000, received_date: "2026-08-01" }, as: LeasingAgent, captures: { pay: $.data.id } }
            - { call: "POST /api/payments/${pay}/transition", payload: { action: "POST" }, as: LeasingAgent }
          trigger:
            - { call: "GET /api/allocations", payload: { payment_id: "${pay}" }, as: PropertyManager, captures: { alloc: "$.data[0].id" } }
            - { call: "GET /api/allocations/${alloc}", as: PropertyManager }
          assert:
            - "allocation row exposes id, created_at, payment_id, charge_id, direction APPLY, amount_cents 200000, allocation_order 1"
            - "allocation row has no version and no updated_at field"

  - section: state_machines
    instances:
      - name: payment_return_from_pending_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Payment", "errors[ERR_PAYMENT_INVALID_TRANSITION]"]
        distinguishing_aspect: "RETURN is only legal from POSTED; a PENDING payment returns ERR_PAYMENT_INVALID_TRANSITION and return_count stays 0."
        test_recipe:
          setup: ["property PA, ACTIVE lease, RENT 200000 due 2026-08-01, PENDING payment 200000"]
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { lease: $.data.id } }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "RENT", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 200000 }, as: LeasingAgent }
            - { call: "POST /api/leases/${lease}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "POST /api/payments", payload: { lease_id: "${lease}", tenant_id: "${ten}", channel: "ACH", amount_cents: 200000, received_date: "2026-08-01" }, as: LeasingAgent, captures: { pay: $.data.id } }
          trigger:
            - { call: "POST /api/payments/${pay}/transition", payload: { action: "RETURN", reason_code: "NSF", nsf_fee_cents: 3000 }, as: LeasingAgent, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_PAYMENT_INVALID_TRANSITION"
            - "GET /api/payments/${pay} still shows status PENDING and return_count 0 (no partial side effects)"

      - name: payment_return_card_channel_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.Payment.POSTED_to_RETURNED", "errors[ERR_CHANNEL_NOT_RETURNABLE]"]
        distinguishing_aspect: "Only ACH and CHECK payments are returnable; a POSTED CARD payment refuses RETURN with ERR_CHANNEL_NOT_RETURNABLE."
        test_recipe:
          setup: ["property PA, ACTIVE lease, RENT 200000 due 2026-08-01, CARD payment 200000 POSTED"]
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { lease: $.data.id } }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "RENT", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 200000 }, as: LeasingAgent }
            - { call: "POST /api/leases/${lease}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "POST /api/payments", payload: { lease_id: "${lease}", tenant_id: "${ten}", channel: "CARD", amount_cents: 200000, received_date: "2026-08-01" }, as: LeasingAgent, captures: { pay: $.data.id } }
            - { call: "POST /api/payments/${pay}/transition", payload: { action: "POST" }, as: LeasingAgent }
          trigger:
            - { call: "POST /api/payments/${pay}/transition", payload: { action: "RETURN", reason_code: "NSF", nsf_fee_cents: 3000 }, as: LeasingAgent, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_CHANNEL_NOT_RETURNABLE and the payment remains POSTED with the rent charge still PAID"

      - name: notice_serve_from_draft_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.DelinquencyNotice", "errors[ERR_NOTICE_INVALID_TRANSITION]"]
        distinguishing_aspect: "SERVE requires ISSUED; serving a DRAFT notice fails with ERR_NOTICE_INVALID_TRANSITION and records no service fields."
        test_recipe:
          setup: ["property PA, ACTIVE lease, RENT 200000 due 2026-08-01, DRAFT notice covering it"]
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { lease: $.data.id } }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "RENT", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 200000 }, as: LeasingAgent, captures: { rc: $.data.id } }
            - { call: "POST /api/leases/${lease}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "GET /api/leases/${lease}", as: PropertyManager, captures: { lv: $.data.version } }
            - { call: "POST /api/notices", payload: { lease_id: "${lease}", charge_ids: ["${rc}"], expected_lease_version: "${lv}" }, as: PropertyManager, captures: { notice: $.data.id } }
          trigger:
            - { call: "POST /api/notices/${notice}/transition", payload: { action: "SERVE", service_method: "PERSONAL", served_date: "2026-08-01" }, as: PropertyManager, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_NOTICE_INVALID_TRANSITION; served_date and served_by_user_id remain null"

      - name: plan_approve_twice_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.PaymentPlan", "errors[ERR_PLAN_INVALID_TRANSITION]"]
        distinguishing_aspect: "APPROVE from ACTIVE (not DRAFT) fails ERR_PLAN_INVALID_TRANSITION; approval is a one-way gate."
        test_recipe:
          setup: ["property PA, ACTIVE lease, DAMAGE_FEE 10000 due 2026-08-01, plan drafted by LeasingAgent and already APPROVED by PropertyManager"]
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { lease: $.data.id } }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "DAMAGE_FEE", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 10000 }, as: LeasingAgent, captures: { dc: $.data.id } }
            - { call: "POST /api/leases/${lease}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "GET /api/leases/${lease}", as: PropertyManager, captures: { lv: $.data.version } }
            - { call: "POST /api/payment-plans", payload: { lease_id: "${lease}", charge_ids: ["${dc}"], installment_count: 2, first_installment_date: "2026-08-15", expected_lease_version: "${lv}" }, as: LeasingAgent, captures: { plan: $.data.id } }
            - { call: "POST /api/payment-plans/${plan}/transition", payload: { action: "APPROVE" }, as: PropertyManager, captures: { st: $.data.status } }
          trigger:
            - { call: "POST /api/payment-plans/${plan}/transition", payload: { action: "APPROVE" }, as: PropertyManager, captures: { err: $.data.error_id } }
          assert:
            - "captured st == ACTIVE after the first approval"
            - "captured err == ERR_PLAN_INVALID_TRANSITION on the second approval"

      - name: dispute_second_reopen_rejected
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Dispute", "errors[ERR_DISPUTE_REOPEN_EXHAUSTED]"]
        distinguishing_aspect: "The dispute loop is capped at one reopen: after OPEN -> RESOLVED_UPHELD -> REOPENED -> RESOLVED_UPHELD, a second REOPEN fails ERR_DISPUTE_REOPEN_EXHAUSTED, making RESOLVED_UPHELD effectively terminal."
        test_recipe:
          setup: ["property PA, ACTIVE lease, DAMAGE_FEE 50000, tenant dispute that has already been resolved UPHELD and reopened once"]
          setup_api_calls:
