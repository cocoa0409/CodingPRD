      - name: activation_rejected_while_a_crosswalk_is_pending_and_cycle_activation_rejected_by_an_approved_request
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ITEM_PENDING_CODE_UPDATE]
          - errors[ERR_ITEM_HAS_OPEN_REQUEST]
          - errors[ERR_ITEM_PRICE_NOT_CURRENT]
          - validations[priority=46]
          - validations[priority=47]
          - calculations.code_update_crosswalk_price_carry
        distinguishing_aspect: "A mutual standoff between the two governance queues: a MAPPED entry of a CROSSWALK_APPROVED cycle blocks the item's activation (priority 47), and an APPROVED ChangeRequest on that same item blocks the cycle's activation (priority 46, the second applies_to of that error id) — neither queue can jump the other. Implementing the request releases the cycle, whose carried price was frozen at MAP time and therefore overwrites the freshly implemented 360000 with 240000, leaving the item PRICE_STALE so activation now fails one rank lower with ERR_ITEM_PRICE_NOT_CURRENT."
