            - "No SettlementStatement exists for (participant, day): GET /market/statements?operating_day_id&market_participant_id returns an empty array (cancelled award is not 'activity')"

      - name: obligation_recovers_when_outage_cancelled
        claim_type: side_effect_execution
        grounds: [state_machines.OutageReport.APPROVED_to_CANCELLED, state_machines.CapacityObligation.AT_RISK_to_ACTIVE, state_machines.MarginCall.OPEN_to_CURED]
        distinguishing_aspect: "Compensation pattern: cancelling the APPROVED outage reverses the whole approval cascade — availability restored, obligation back to ACTIVE, risk adder removed, margin call cured."
        test_recipe:
          setup:
            - "INVESTMENT_GRADE participant; obligation 10 MW; PARTIAL 50% outage covering the clock approved → AT_RISK, requirement 500000, margin call 400000 OPEN"
          setup_api_calls:
            - { call: "POST /market/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: IsoOperator }
            - call: "POST /market/participants"
              payload: { company_name: "Rec Co", credit_rating_tier: "INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p_id: $.data.id }
            - call: "POST /market/generators"
              payload: { market_participant_id: "${p_id}", unit_name: "U1", pricing_node: "WEST_HUB", capacity_mw: 10 }
              as: IsoOperator
              captures: { g_id: $.data.id }
            - call: "POST /market/obligations"
              payload: { generator_asset_id: "${g_id}", delivery_period: "2026-08", obligated_mw: 10, capacity_rate_cents_per_mw: 1000000 }
              as: IsoOperator
              captures: { ob_id: $.data.id }
            - call: "POST /market/generators/${g_id}/outages"
              payload: { outage_type: "PARTIAL", derate_pct: 50, start_at: "2026-08-05T00:00:00Z", end_at: "2026-08-06T00:00:00Z", reason: "derate" }
              as: Trader
              as_user_id: "${p_id}"
              captures: { out_id: $.data.id }
            - { call: "POST /market/outages/${out_id}/acknowledge", as: IsoOperator }
            - { call: "POST /market/outages/${out_id}/approve", as: IsoOperator }
            - call: "GET /market/obligations/${ob_id}"
              as: IsoOperator
              captures: { ob_st1: $.data.status, ob_exp1: $.data.expected_output_mw }
            - call: "GET /market/margin-calls"
              payload: { market_participant_id: "${p_id}", status: "OPEN" }
              as: IsoOperator
              captures: { mc_id: "$.data[0].id" }
          trigger:
            - { call: "POST /market/outages/${out_id}/cancel", as: Trader, as_user_id: "${p_id}" }
            - call: "GET /market/generators/${g_id}"
              as: IsoOperator
              captures: { g_avail: $.data.availability_mw, g_st: $.data.status }
            - call: "GET /market/obligations/${ob_id}"
              as: IsoOperator
              captures: { ob_st2: $.data.status }
            - call: "GET /market/margin-calls/${mc_id}"
              as: IsoOperator
              captures: { mc_st: $.data.status }
            - call: "GET /market/participants/${p_id}"
              as: IsoOperator
              captures: { p_st: $.data.status, p_req: $.data.collateral_requirement_cents }
          assert:
            - "Before cancel: obligation AT_RISK with expected_output_mw == 5 (min(10, 10×(1−0.5)))"
            - "After cancel: availability_mw == 10, obligation ACTIVE, margin call CURED, participant ACTIVE, requirement 0 — full compensation, no drift"

      - name: generator_decommission_blocked_then_succeeds
        claim_type: precondition_enforcement
        grounds: [state_machines.GeneratorAsset.AVAILABLE_to_DECOMMISSIONED, "errors[ERR_GENERATOR_HAS_OPEN_COMMITMENTS]"]
        distinguishing_aspect: "Decommission is guarded by open commitments: blocked while a DRAFT offer exists, allowed after the DA run expires the offer; a later offer create on the DECOMMISSIONED unit fails the state gate."
        test_recipe:
          setup: ["participant + generator + day with a DRAFT (never submitted) offer"]
          setup_api_calls:
            - { call: "POST /market/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: IsoOperator }
            - call: "POST /market/participants"
              payload: { company_name: "Dec Co", credit_rating_tier: "INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p_id: $.data.id }
            - call: "POST /market/generators"
              payload: { market_participant_id: "${p_id}", unit_name: "U1", pricing_node: "WEST_HUB", capacity_mw: 10 }
              as: IsoOperator
              captures: { g_id: $.data.id }
            - call: "POST /market/operating-days"
              payload: { market_date: "2026-08-03", da_gate_close_at: "2026-08-02T10:30:00Z" }
              as: IsoOperator
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /market/operating-days/${d_id}/offers"
              payload: { generator_asset_id: "${g_id}", offered_mw: 5, offer_price_cents_per_mwh: 5000, expected_operating_day_version: "${d_v}" }
              as: Trader
              as_user_id: "${p_id}"
              captures: { o_id: $.data.id }
            - call: "POST /market/generators/${g_id}/decommission"
              as: Trader
              as_user_id: "${p_id}"
              captures: { e1: $.data.error_id }
            - { call: "POST /market/operating-days/${d_id}/run-day-ahead-market", payload: { node_prices: [] }, as: IsoOperator }
            - call: "POST /market/operating-days"
              payload: { market_date: "2026-08-04", da_gate_close_at: "2026-08-03T10:30:00Z" }
              as: IsoOperator
              captures: { d2: $.data.id, d2_v: $.data.version }
          trigger:
            - call: "POST /market/generators/${g_id}/decommission"
              as: Trader
              as_user_id: "${p_id}"
              captures: { g_st: $.data.status }
            - call: "POST /market/operating-days/${d2}/offers"
              payload: { generator_asset_id: "${g_id}", offered_mw: 5, offer_price_cents_per_mwh: 5000, expected_operating_day_version: "${d2_v}" }
              as: Trader
              as_user_id: "${p_id}"
              captures: { e2: $.data.error_id }
          assert:
            - "First decommission → ERR_GENERATOR_HAS_OPEN_COMMITMENTS (DRAFT offer ${o_id} exists)"
            - "After the DA run expires the DRAFT offer (EXPIRED is terminal): decommission succeeds, status DECOMMISSIONED"
            - "Offer create on the DECOMMISSIONED generator → ERR_GENERATOR_NOT_AVAILABLE"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: imbalance_excludes_telemetry_without_cleared_offer
        claim_type: input_set_filtering
        grounds: [calculations.imbalance_settlement, conventions]
        distinguishing_aspect: "Telemetry for a generator with no CLEARED offer is excluded from settlement — no statement activity arises from meter data alone."
        test_recipe:
          setup: ["participant + generator; gated day; telemetry 24×6 MW; NO offer"]
          setup_api_calls:
            - call: "POST /market/participants"
              payload: { company_name: "Iso Co", credit_rating_tier: "INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p_id: $.data.id }
            - call: "POST /market/generators"
              payload: { market_participant_id: "${p_id}", unit_name: "U1", pricing_node: "WEST_HUB", capacity_mw: 10 }
              as: IsoOperator
              captures: { g_id: $.data.id, g_v: $.data.version }
            - call: "POST /market/operating-days"
              payload: { market_date: "2026-08-03", da_gate_close_at: "2026-08-02T10:30:00Z" }
              as: IsoOperator
              captures: { d_id: $.data.id }
            - { call: "POST /market/operating-days/${d_id}/run-day-ahead-market", payload: { node_prices: [] }, as: IsoOperator }
            - call: "POST /market/generators/${g_id}/telemetry"
              payload: { operating_day_id: "${d_id}", expected_generator_asset_version: "${g_v}", readings: [ { interval_index: 1, actual_mw: 6 }, { interval_index: 2, actual_mw: 6 } ] }
              as: Trader
              as_user_id: "${p_id}"
            - { call: "POST /market/operating-days/${d_id}/close-real-time", payload: { rt_node_prices_prelim: [] }, as: IsoOperator }
            - { call: "POST /market/operating-days/${d_id}/run-preliminary-settlement", as: IsoOperator }
          trigger:
            - call: "GET /market/statements"
              payload: { operating_day_id: "${d_id}", market_participant_id: "${p_id}" }
              as: IsoOperator
          assert:
            - "Statements list is empty — telemetry without a CLEARED offer produces no statement and no imbalance charge"

      - name: da_clearing_price_equality_clears
        claim_type: constants_applied
        grounds: [calculations.da_clearing, entities.DayAheadOffer.fields.cleared_mw]
        distinguishing_aspect: "Threshold boundary of the clearing rule: offer_price == DA LMP clears (inclusive); offer_price == LMP + 1 does not."
        test_recipe:
          setup: ["two generators G1/G2, offers 5 MW at 5300 and 5301; deck WEST_HUB {5000, 200, 100} → LMP 5300"]
          setup_api_calls:
            - call: "POST /market/participants"
              payload: { company_name: "Eq Co", credit_rating_tier: "INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p_id: $.data.id }
            - call: "POST /market/generators"
              payload: { market_participant_id: "${p_id}", unit_name: "U1", pricing_node: "WEST_HUB", capacity_mw: 10 }
              as: IsoOperator
              captures: { g1: $.data.id }
            - call: "POST /market/generators"
              payload: { market_participant_id: "${p_id}", unit_name: "U2", pricing_node: "WEST_HUB", capacity_mw: 10 }
              as: IsoOperator
              captures: { g2: $.data.id }
            - call: "POST /market/operating-days"
              payload: { market_date: "2026-08-03", da_gate_close_at: "2026-08-02T10:30:00Z" }
              as: IsoOperator
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /market/operating-days/${d_id}/offers"
              payload: { generator_asset_id: "${g1}", offered_mw: 5, offer_price_cents_per_mwh: 5300, expected_operating_day_version: "${d_v}" }
              as: Trader
              as_user_id: "${p_id}"
              captures: { o1: $.data.id }
            - { call: "POST /market/offers/${o1}/submit", as: Trader, as_user_id: "${p_id}" }
            - call: "GET /market/operating-days/${d_id}"
              as: IsoOperator
              captures: { d_v2: $.data.version }
            - call: "POST /market/operating-days/${d_id}/offers"
              payload: { generator_asset_id: "${g2}", offered_mw: 5, offer_price_cents_per_mwh: 5301, expected_operating_day_version: "${d_v2}" }
              as: Trader
              as_user_id: "${p_id}"
              captures: { o2: $.data.id }
            - { call: "POST /market/offers/${o2}/submit", as: Trader, as_user_id: "${p_id}" }
          trigger:
            - call: "POST /market/operating-days/${d_id}/run-day-ahead-market"
              payload: { node_prices: [ { node_name: "WEST_HUB", da_energy_cents_per_mwh: 5000, da_congestion_cents_per_mwh: 200, da_loss_cents_per_mwh: 100 } ] }
              as: IsoOperator
            - call: "GET /market/offers/${o1}"
              as: Trader
              as_user_id: "${p_id}"
              captures: { o1_st: $.data.status, o1_mw: $.data.cleared_mw }
            - call: "GET /market/offers/${o2}"
              as: Trader
              as_user_id: "${p_id}"
              captures: { o2_st: $.data.status }
          assert:
            - "Offer at 5300 (== LMP): CLEARED with cleared_mw == 5 — equality clears"
            - "Offer at 5301 (LMP + 1): NOT_CLEARED with cleared_mw == 0"

      - name: capacity_stop_loss_cap_inclusive_boundary
        claim_type: constants_applied
        grounds: [calculations.capacity_stop_loss_close]
        distinguishing_aspect: "Stop-loss cap boundary: accrued penalty exactly == 1.5 × gross is charged IN FULL (inclusive min), forgiven == 0."
        test_recipe:
          setup:
            - "obligation 10 MW @ 10000 (gross 100000, cap 150000); event interval [1,1]; telemetry 7 MW → shortfall 3 × 50000 × 1h = 150000 == cap"
          setup_api_calls:
            - { call: "POST /market/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: IsoOperator }
            - call: "POST /market/participants"
              payload: { company_name: "CapB Co", credit_rating_tier: "INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p_id: $.data.id }
            - call: "POST /market/generators"
              payload: { market_participant_id: "${p_id}", unit_name: "U1", pricing_node: "WEST_HUB", capacity_mw: 10 }
              as: IsoOperator
              captures: { g_id: $.data.id, g_v: $.data.version }
            - call: "POST /market/obligations"
              payload: { generator_asset_id: "${g_id}", delivery_period: "2026-08", obligated_mw: 10, capacity_rate_cents_per_mw: 10000 }
              as: IsoOperator
              captures: { ob_id: $.data.id }
            - call: "POST /market/operating-days"
              payload: { market_date: "2026-08-10", da_gate_close_at: "2026-08-09T10:30:00Z" }
              as: IsoOperator
              captures: { d_id: $.data.id }
            - { call: "POST /market/operating-days/${d_id}/run-day-ahead-market", payload: { node_prices: [] }, as: IsoOperator }
            - call: "POST /market/generators/${g_id}/telemetry"
              payload: { operating_day_id: "${d_id}", expected_generator_asset_version: "${g_v}", readings: [ { interval_index: 1, actual_mw: 7 } ] }
              as: Trader
              as_user_id: "${p_id}"
            - call: "POST /market/operating-days/${d_id}/performance-events"
              payload: { start_interval: 1, end_interval: 1 }
              as: IsoOperator
              captures: { ev_id: $.data.id }
            - { call: "POST /market/events/${ev_id}/activate", as: IsoOperator }
            - { call: "POST /market/events/${ev_id}/complete", as: IsoOperator }
          trigger:
            - { call: "POST /market/obligations/${ob_id}/close", as: IsoOperator }
            - call: "GET /market/obligations/${ob_id}"
              as: IsoOperator
              captures: { ob_ch: $.data.charged_penalty_cents, ob_fg: $.data.forgiven_penalty_cents }
          assert:
            - "charged_penalty_cents == 150000 (accrued == cap → charged in full, inclusive)"
            - "forgiven_penalty_cents == 0"

      - name: resettlement_offsets_single_disputed_line
        claim_type: correct_result
        grounds: [calculations.resettlement_recompute]
        distinguishing_aspect: "Resettlement reduces net by EXACTLY the disputed line's amount (partial correction), unlike the §1.8 full-line wipe — component fields track the offset."
        test_recipe:
          setup: ["settled FINAL statement: DA credit 1200000, congestion 48000, losses 24000, net −1128000; dispute targets ONLY the CONGESTION line (+48000)"]
          setup_api_calls:
            - { call: "POST /market/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: IsoOperator }
            - call: "POST /market/participants"
