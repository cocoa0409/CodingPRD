            - "BusinessUnitPool.${pool_id}.funded_cents == 4000000"
            - "BusinessUnitPool.${pool_id}.allocated_cents == 0"
            - "BusinessUnitPool.${pool_id}.available_cents == 4000000"
            - "BusinessUnitPool.${pool_id}.utilization_pct == 0.00"
            - "BusinessUnitPool.${pool_id}.top_tier_award_count == 0"
            - "BusinessUnitPool.${pool_id}.distribution_status == UNDER_UTILIZED"
            - "BusinessUnitPool.${pool_id}.calibration_status == ALLOCATING"
            - "BonusPlan.${plan_id}.under_utilized_pool_count == 1"
            - "BonusPlan.${plan_id}.over_allocated_pool_count == 0"
            - "BonusPlan.${plan_id}.governance_posture == FLAGGED"

      - name: adjustment_reversal_restores_the_discretionary_budget_ledger
        grounds:
          - "state_machines.DiscretionaryAdjustment: APPROVED -> REVERSED"
          - entities.BonusPlan.fields.discretionary_used_cents
          - entities.ParticipantAward.fields.adjustment_total_cents
          - calculations.pool_distribution_state
          - endpoints."POST /discretionary-adjustments/{adjustmentId}/reverse"
        distinguishing_aspect: |
          Conserved quantity = the plan's discretionary budget ledger
          (discretionary_used_cents) plus the award/pool cents it inflated.
          Reversing an APPROVED adjustment of the entire 225,206 budget must
          walk the whole chain back: discretionary_used_cents 225,206 -> 0,
          award adjustment_total_cents 225,206 -> 0 and final_award_cents
          2,225,206 -> 2,000,000, pool allocated_cents 2,477,261 -> 2,252,055
          with available_cents -225,206 -> 0 and utilization 110.00 -> 100.00,
          distribution_status OVER_ALLOCATED -> WITHIN_GUIDELINES and
          governance_posture FLAGGED -> COMPLIANT. A reversal that only flips
          the adjustment row leaves the budget permanently consumed, so no
          further adjustment could ever be filed.
        test_recipe:
          setup:
            - "CHAIN-A: one unit EAST-V, one plan (weights 50/30/20, discretionary 10.00%), L3 10.00% and L5 20.00% targets, REVENUE (weight 60.00, actual 900) and EBITDA (weight 40.00, actual 95), one pool certified at 100.00, Ada (L5 20,000,000, hired 2025-03-01) and Ben (L3 10,000,000, hired 2026-07-01)."
            - "Certified at blended 80.00 / multiplier 0.5000; funded 2,252,055; discretionary_budget_cents 225,206; both awards allocated (Ada 2,000,000, Ben 252,055) so the pool is WITHIN_GUIDELINES and the plan COMPLIANT."
            - "A documented +225,206 adjustment on Ada's award has already been APPROVED by cc_adj_approver, pushing the pool to OVER_ALLOCATED and the plan to FLAGGED."
          setup_api_calls:
            - call: "POST /business-units"
              payload: { unit_code: "EAST-V", name: "East Region V" }
              as: PlanAdmin
              captures: { east_id: "$.data.id" }
            - call: "POST /bonus-plans"
              payload: { plan_year: 2026, plan_name: "FY26 Adjustment Reversal Plan", plan_period_start: "2026-01-01", plan_period_end: "2027-01-01", payment_date: "2027-03-15", company_weight_pct: 50.00, business_unit_weight_pct: 30.00, individual_weight_pct: 20.00, discretionary_budget_pct: 10.00 }
              as: PlanAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /job-level-targets"
              payload: { plan_id: "${plan_id}", job_level: "L3", target_bonus_pct: 10.00, guideline_min_ratio: 0.25, guideline_max_ratio: 2.00 }
              as: PlanAdmin
            - call: "POST /job-level-targets"
              payload: { plan_id: "${plan_id}", job_level: "L5", target_bonus_pct: 20.00, guideline_min_ratio: 0.25, guideline_max_ratio: 2.00 }
              as: PlanAdmin
            - call: "POST /company-metrics"
              payload: { plan_id: "${plan_id}", metric_code: "REVENUE", weight_pct: 60.00, threshold_value: 900, target_value: 1000, max_value: 1200 }
              as: PlanAdmin
              captures: { rev_id: "$.data.id" }
            - call: "POST /company-metrics"
              payload: { plan_id: "${plan_id}", metric_code: "EBITDA", weight_pct: 40.00, threshold_value: 90, target_value: 100, max_value: 130 }
              as: PlanAdmin
              captures: { ebitda_id: "$.data.id" }
            - call: "POST /bu-pools"
              payload: { plan_id: "${plan_id}", business_unit_id: "${east_id}" }
              as: PlanAdmin
              captures: { pool_id: "$.data.id" }
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", business_unit_id: "${east_id}", employee_code: "E001", full_name: "Ada Long", job_level: "L5", base_salary_cents: 20000000, hire_date: "2025-03-01" }
              as: PlanAdmin
              captures: { p1_id: "$.data.id" }
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", business_unit_id: "${east_id}", employee_code: "E002", full_name: "Ben Short", job_level: "L3", base_salary_cents: 10000000, hire_date: "2026-07-01" }
              as: PlanAdmin
              captures: { p2_id: "$.data.id" }
            - call: "POST /company-metrics/${rev_id}/actual"
              payload: { actual_value: 900, source_note: "audited" }
              as: PlanAdmin
            - call: "POST /company-metrics/${ebitda_id}/actual"
              payload: { actual_value: 95, source_note: "audited" }
              as: PlanAdmin
            - call: "POST /bu-pools/${pool_id}/submit-scorecard"
              payload: { bu_metric_achievement_pct: 100.00, scorecard_narrative: "at plan" }
              as: BusinessUnitManager
              as_user_id: "${east_id}"
            - call: "POST /bu-pools/${pool_id}/scorecard-decision"
              payload: { decision: "CERTIFY" }
              as: CompensationCommittee
              as_user_id: "cc_scorecard"
            - call: "POST /bonus-plans/${plan_id}/target-assignments"
              payload: {}
              as: PlanAdmin
            - call: "POST /bonus-plans/${plan_id}/submit-for-certification"
              payload: {}
              as: PlanAdmin
            - call: "POST /bonus-plans/${plan_id}/certification-decision"
              payload: { decision: "CERTIFY" }
              as: CompensationCommittee
              as_user_id: "cc_certifier"
            - call: "POST /bonus-plans/${plan_id}/fund-pool"
              payload: {}
              as: CompensationCommittee
              as_user_id: "cc_certifier"
            - call: "GET /participant-awards"
              payload: { plan_id: "${plan_id}", participant_id: "${p1_id}" }
              as: PlanAdmin
              captures: { a1_id: "$.data[0].id" }
            - call: "GET /participant-awards"
              payload: { plan_id: "${plan_id}", participant_id: "${p2_id}" }
              as: PlanAdmin
              captures: { a2_id: "$.data[0].id" }
            - call: "GET /bu-pools/${pool_id}"
              payload: {}
              as: BusinessUnitManager
              as_user_id: "${east_id}"
              captures: { pool_v1: "$.data.version" }
            - call: "POST /participant-awards/${a1_id}/propose-allocation"
              payload: { proposed_allocation_cents: 2000000, allocation_rationale: "solid year", expected_pool_version: "${pool_v1}" }
              as: BusinessUnitManager
              as_user_id: "${east_id}"
            - call: "GET /bu-pools/${pool_id}"
              payload: {}
              as: BusinessUnitManager
              as_user_id: "${east_id}"
              captures: { pool_v2: "$.data.version" }
            - call: "POST /participant-awards/${a2_id}/propose-allocation"
              payload: { proposed_allocation_cents: 252055, allocation_rationale: "pro-rated new joiner", expected_pool_version: "${pool_v2}" }
              as: BusinessUnitManager
              as_user_id: "${east_id}"
            - call: "GET /bonus-plans/${plan_id}"
              payload: {}
              as: PlanAdmin
              captures: { plan_v: "$.data.version" }
            - call: "POST /discretionary-adjustments"
              payload: { plan_id: "${plan_id}", award_id: "${a1_id}", adjustment_cents: 225206, justification: "retention risk, committee-sponsored uplift", documentation_ref: "GOV-2026-014", expected_plan_version: "${plan_v}" }
              as: PlanAdmin
              as_user_id: "pa_1"
              captures: { adj_id: "$.data.id" }
            - call: "POST /discretionary-adjustments/${adj_id}/decision"
              payload: { decision: "APPROVE", decision_note: "approved at committee" }
              as: CompensationCommittee
              as_user_id: "cc_adj_approver"
          trigger:
            - call: "POST /discretionary-adjustments/${adj_id}/reverse"
              payload: { decision_note: "reversed after audit query; uplift withdrawn" }
              as: CompensationCommittee
              as_user_id: "cc_adj_approver"
          assert:
            - "DiscretionaryAdjustment.${adj_id}.status == REVERSED"
            - "DiscretionaryAdjustment.${adj_id}.adjustment_cents == 225206"
            - "ParticipantAward.${a1_id}.adjustment_total_cents == 0"
            - "ParticipantAward.${a1_id}.final_award_cents == 2000000"
            - "ParticipantAward.${a1_id}.proposed_allocation_cents == 2000000"
            - "ParticipantAward.${a2_id}.final_award_cents == 252055"
            - "BusinessUnitPool.${pool_id}.allocated_cents == 2252055"
            - "BusinessUnitPool.${pool_id}.available_cents == 0"
            - "BusinessUnitPool.${pool_id}.utilization_pct == 100.00"
            - "BusinessUnitPool.${pool_id}.distribution_status == WITHIN_GUIDELINES"
            - "BonusPlan.${plan_id}.discretionary_used_cents == 0"
            - "BonusPlan.${plan_id}.discretionary_budget_cents == 225206"
            - "BonusPlan.${plan_id}.over_allocated_pool_count == 0"
            - "BonusPlan.${plan_id}.governance_posture == COMPLIANT"

      - name: accrual_reversal_restores_the_ledger_to_the_prior_period_balance
        grounds:
          - "state_machines.AccrualPeriod: POSTED -> REVERSED"
          - calculations.period_accrual_with_burden
          - entities.BonusPlan.fields.accrued_base_cents
          - entities.BonusPlan.fields.accrued_total_cents
          - endpoints."POST /accrual-periods/{periodId}/reverse"
        distinguishing_aspect: |
          Conserved quantity = the accrual ledger on the plan
          (accrued_base_cents / accrued_total_cents). Because the accrual is
          CUMULATIVE, the second period only books the delta (period_accrual
          1,260,274 on a cumulative 2,500,000) and reversing it must return
          the ledger to the first period's balance exactly — 2,500,000 ->
          1,239,726 and 2,691,250 -> 1,334,565 — not to zero and not to
          2,500,000 minus a recomputed full-period amount. An implementation
          that subtracts cumulative_accrual_target_cents instead of
          period_accrual_cents drives accrued_base_cents to 0.
        test_recipe:
          setup:
            - "CHAIN-A entities only (no awards yet): one unit EAST-W, one plan (weights 50/30/20, discretionary 10.00%), L3 and L5 target rows, REVENUE (weight 60.00) and EBITDA (weight 40.00) still DRAFT, one pool, Ada (L5 20,000,000, hired 2025-03-01) and Ben (L3 10,000,000, hired 2026-07-01)."
            - "Accrual basis PARTICIPANT_UNPRORATED = 5,000,000, forecast blended 80.00 -> multiplier 0.5000 -> provisional_pool 2,500,000 in both periods."
            - "Period 1 (2026-01-01..2026-06-30, forecast 60.00) is POSTED: elapsed 181, cumulative 1,239,726, burden 94,839, total 1,334,565."
            - "Period 2 (2026-07-01..2026-12-31, forecast 60.00) is POSTED: elapsed 365, cumulative 2,500,000, period_accrual 1,260,274, burden 96,411, total 1,356,685 — the ledger reads 2,500,000 / 2,691,250."
          setup_api_calls:
            - call: "POST /business-units"
              payload: { unit_code: "EAST-W", name: "East Region W" }
              as: PlanAdmin
              captures: { east_id: "$.data.id" }
            - call: "POST /bonus-plans"
              payload: { plan_year: 2026, plan_name: "FY26 Accrual Reversal Plan", plan_period_start: "2026-01-01", plan_period_end: "2027-01-01", payment_date: "2027-03-15", company_weight_pct: 50.00, business_unit_weight_pct: 30.00, individual_weight_pct: 20.00, discretionary_budget_pct: 10.00 }
              as: PlanAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /job-level-targets"
              payload: { plan_id: "${plan_id}", job_level: "L3", target_bonus_pct: 10.00, guideline_min_ratio: 0.25, guideline_max_ratio: 2.00 }
              as: PlanAdmin
            - call: "POST /job-level-targets"
              payload: { plan_id: "${plan_id}", job_level: "L5", target_bonus_pct: 20.00, guideline_min_ratio: 0.25, guideline_max_ratio: 2.00 }
              as: PlanAdmin
            - call: "POST /company-metrics"
              payload: { plan_id: "${plan_id}", metric_code: "REVENUE", weight_pct: 60.00, threshold_value: 900, target_value: 1000, max_value: 1200 }
              as: PlanAdmin
            - call: "POST /company-metrics"
              payload: { plan_id: "${plan_id}", metric_code: "EBITDA", weight_pct: 40.00, threshold_value: 90, target_value: 100, max_value: 130 }
              as: PlanAdmin
            - call: "POST /bu-pools"
              payload: { plan_id: "${plan_id}", business_unit_id: "${east_id}" }
              as: PlanAdmin
              captures: { pool_id: "$.data.id" }
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", business_unit_id: "${east_id}", employee_code: "E001", full_name: "Ada Long", job_level: "L5", base_salary_cents: 20000000, hire_date: "2025-03-01" }
              as: PlanAdmin
              captures: { p1_id: "$.data.id" }
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", business_unit_id: "${east_id}", employee_code: "E002", full_name: "Ben Short", job_level: "L3", base_salary_cents: 10000000, hire_date: "2026-07-01" }
              as: PlanAdmin
              captures: { p2_id: "$.data.id" }
            - call: "POST /accrual-periods"
              payload: { plan_id: "${plan_id}", period_start: "2026-01-01", period_end: "2026-06-30", forecast_company_achievement_pct: 60.00 }
              as: FinanceController
              captures: { period1: "$.data.id" }
            - call: "POST /accrual-periods/${period1}/post"
              payload: { posting_note: "H1 provisional accrual" }
              as: FinanceController
            - call: "POST /accrual-periods"
              payload: { plan_id: "${plan_id}", period_start: "2026-07-01", period_end: "2026-12-31", forecast_company_achievement_pct: 60.00 }
              as: FinanceController
              captures: { period2: "$.data.id" }
            - call: "POST /accrual-periods/${period2}/post"
              payload: { posting_note: "H2 provisional accrual" }
              as: FinanceController
          trigger:
            - call: "POST /accrual-periods/${period2}/reverse"
              payload: { reversal_reason: "H2 forecast withdrawn pending committee certification" }
              as: FinanceController
          assert:
            - "Before the reversal: AccrualPeriod.${period2}.elapsed_days == 365, AccrualPeriod.${period2}.cumulative_accrual_target_cents == 2500000, AccrualPeriod.${period2}.period_accrual_cents == 1260274, AccrualPeriod.${period2}.burden_cents == 96411, AccrualPeriod.${period2}.total_period_cents == 1356685, BonusPlan.${plan_id}.accrued_base_cents == 2500000, BonusPlan.${plan_id}.accrued_total_cents == 2691250"
            - "AccrualPeriod.${period2}.status == REVERSED"
            - "AccrualPeriod.${period2}.period_accrual_cents == 1260274"
            - "AccrualPeriod.${period1}.status == POSTED"
            - "AccrualPeriod.${period1}.cumulative_accrual_target_cents == 1239726"
            - "AccrualPeriod.${period1}.total_period_cents == 1334565"
            - "BonusPlan.${plan_id}.accrued_base_cents == 1239726"
            - "BonusPlan.${plan_id}.accrued_total_cents == 1334565"
            - "BonusPlan.${plan_id}.true_up_cents == 0"
