            - "FulfillmentAssignment.${a1}.labor_minutes_actual == 25 (09:30:00Z - 09:05:00Z = 1500s, floor(1500/60) = 25)"
            - "FulfillmentAssignment.${a1}.package_type == MEDIUM_BOX and derived_package_type == MEDIUM_BOX"
            - "PackagingSupply.${pg1}.on_hand_units == 1, lifetime_consumed_units == 1, reorder_flag == true (1 <= 1) and version == 2"
            - "FulfillmentAssignment.${a1}.final_cost_cents is still null: the final variant is only written at ship"

      - name: closing_a_departed_pickup_and_departing_a_cancelled_pickup_are_refused
