            - "At exactly 2027-01-14 (issued_at + 90 days): Payout.${pay_st}.status == STALE_UNCASHED and stale_marked_at == 2027-01-14T00:00:00Z (>= boundary, not >)"
            - "Cascade hop 2: Participant.${p_st}.locate_status == FLAGGED_UNCASHED and flagged_at == 2027-01-14T00:00:00Z (uncashed-check identification fired by the payout's own transition)"
            - "Payout.${pay_st}.gross_cents == 150000 and withholding_cents == 30000 and net_cents == 120000 (no money moved by the stale flip; ledger untouched)"

