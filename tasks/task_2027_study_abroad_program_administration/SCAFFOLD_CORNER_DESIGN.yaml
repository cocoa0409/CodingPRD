  # ===========================================================================
  # Calculations (Table 3 claims)
  # ===========================================================================
  - section: calculations
    instances:
      - name: billing_charge_base_case
        claim_type: correct_result
        grounds:
          - calculations.billing_charge_calculation
        excluded_because:
          difficulty_instance: billing_home_tuition_vs_program_fee_charge
          rationale: "Both billing-model variants with literal charge assertions (940000 / 1540000) are exercised there."
      - name: aid_cap_min_branch_boundary
        claim_type: constants_applied
        grounds:
          - calculations.billing_charge_calculation
        excluded_because:
          difficulty_instance: billing_aid_cap_min_branch
          rationale: "The min()-cap branch (aid 1500000 -> capped 1080000, charge 760000) is asserted there."
      - name: credit_rounding_order_pinned
        claim_type: precision
        grounds:
          - calculations.transfer_credit_conversion
        excluded_because:
          difficulty_instance: credit_rounding_per_course_then_sum
          rationale: "Per-course-then-sum rounding (2.5 / 4.0, total 6.5 vs 6.0) is asserted there."
      - name: refund_credit_memo_equals_amount_paid
        claim_type: correct_result
        grounds:
          - calculations.refund_credit_memo
        excluded_because:
          difficulty_instance: billing_outstanding_pay_void_invariant
          rationale: "Void with credit_memo_cents == amount_paid_cents (100000) and outstanding 0 is asserted there."
      - name: seats_taken_excludes_returned
        claim_type: input_set_filtering
        grounds:
          - calculations.seats_taken_aggregation
          - state_machines.Application.ABROAD_to_RETURNED_HOME
        distinguishing_aspect: "seats_taken counts only status IN {COMMITTED, ABROAD}: with one app COMMITTED and another moving ABROAD -> RETURNED_HOME, the counter drops 2 -> 1 on return."
        test_recipe:
          setup: ["FR program OPEN capacity 30; app1 COMMITTED + insured + ABROAD; app2 COMMITTED"]
          setup_api_calls:
            - call: "POST /api/v1/partner-agreements"
              payload: { host_institution: "Universite Lyon", country_code: "FR", effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-12-31T23:59:59Z", credit_conversion_factor: 0.75, insurance_required: true }
              as: ProgramCoordinator
              captures: { agr_id: $.data.id }
            - call: "POST /api/v1/partner-agreements/${agr_id}/activate"
              as: ProgramCoordinator
            - call: "POST /api/v1/programs"
              payload: { partner_agreement_id: "${agr_id}", name: "Lyon Spring 2027", country_code: "FR", host_institution: "Universite Lyon", term: "SPRING", start_date: "2027-01-10T00:00:00Z", end_date: "2027-05-10T00:00:00Z", application_deadline: "2026-11-01T00:00:00Z", capacity: 30, billing_model: "PROGRAM_FEE", program_fee_cents: 1800000, min_gpa: 2.75 }
