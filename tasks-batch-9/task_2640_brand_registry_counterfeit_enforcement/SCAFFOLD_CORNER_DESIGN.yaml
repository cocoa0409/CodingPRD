          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "NO_ACTION closure is only available while litigation_status is NONE, leaves that dimension NONE, rolls case_status up to CLOSED — and a replayed close is ERR_INVALID_STATE because case_status is no longer OPEN."
