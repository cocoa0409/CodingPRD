  - rule_id: resource_temporal_overlap
    instances:
      - name: remediation_windows_half_open_touching_allowed_overlap_rejected
        grounds:
          - validations[priority=39]
          - errors.ERR_REMEDIATION_WINDOW_OVERLAP
          - entities.RemediationProgram.fields.window_start_date
          - entities.RemediationProgram.fields.window_end_date
        interval_semantics: "half-open [window_start_date, window_end_date): new.start == existing.end does NOT overlap"
        resource_entity: RemediationProgram
        distinguishing_aspect: |
          The contended resource is the merchant's remediation calendar and the intervals are
          half-open, so a program starting exactly on the day the previous one ends is accepted while
          one starting a single day earlier is rejected. Treating the windows as closed intervals
          rejects the legal adjacent program.
