            - call: "POST /accreditation/surveys/${rs_u2}/confirm"
              payload: {}
              as: AccreditationOfficer
              captures: { e_nosess: $.data.error_id }
          assert:
            - "e_pending == ERR_CAP_REVIEW_PENDING (422; CAP is EVIDENCE_SUBMITTED at resurvey confirm)"
            - "e_notsub == ERR_SAMPLE_NOT_SUBMITTED (409; sample still OPEN)"
            - "e_caseopen == ERR_APPLICATION_INVALID_STATE (409; case create requires the owning application to be in EVIDENCE_REVIEW or SURVEY_SCHEDULING, but it is CORRECTIVE_ACTION here)"
            - "e_draft == ERR_EDITION_NOT_PUBLISHED (409; edition 2028 still DRAFT)"
            - "e_resub == ERR_EVIDENCE_NOT_RESUBMITTABLE (409; ev1 is ACCEPTED, not REJECTED)"
            - "e_sessc == ERR_SESSION_INVALID_STATE (409; session already COMPLETED)"
            - "e_rep == ERR_ANNUAL_REPORT_NOT_FOUND (404)"
            - "e_ret == ERR_ACTIVE_APPLICATIONS_EXIST (409; plan2 has a DRAFT application)"
            - "e_nosess == ERR_NO_SCHEDULED_SESSIONS (409; second resurvey survey has zero sessions)"
