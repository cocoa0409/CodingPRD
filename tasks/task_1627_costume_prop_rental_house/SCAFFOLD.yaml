# =============================================================================
# Costume & Prop Rental House — benchmark seed tables (v1)
# =============================================================================

scenario: |
  Costume & Prop Rental House (costume/prop rental house): inventory cataloging
  by period/size/category & condition grade, pull list & hold for production
  dates, fitting/alteration policy & restoration on return, damage/loss
  valuation & replacement charge, cleaning cycle & turnaround, long-run
  production rate structure, sourcing/acquisition & deaccession, insurance
  requirements for renters

domain_name: costume-prop-rental-house
api_prefix: /rental-house

complexity_profile:
  primary_archetype: temporal_windowing      # reservation windows, holds, unit buffers
  secondary_archetype: pricing_engine        # long-run rate structure, damage valuation, late fees
  complexity_layers:
    - optimistic_concurrency                 # OCC on Production.version for reservation & pull-list creation
    - cascading_side_effects                 # check-in → pull-list auto-close → production settle; cert expiry → renter suspend → reservation release
    - dual_variant_calculation               # damage valuation & rental rate variants
    - rate_threshold_triggers                # long-run week thresholds, cleaning backlog, credit limit
  entity_topology: flat                      # peer resources under /rental-house, FK references in bodies
  state_machine_shape: cyclic                # unit rotation loop, claim dispute loop, reservation amend loop
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties          # damage claim assessor (WardrobeStaff) cannot post (Accountant)
  consistency_model: immediate               # all side effects visible in the same request

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Renter
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Renter organization name" }
      - { name: renter_type, type: enum, source: input, description: "THEATRE | FILM | EVENT | INDIVIDUAL — drives insurance minimum coverage" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum allowed outstanding balance in cents" }
      - { name: status, type: enum, source: system, description: "PENDING_VERIFICATION | ACTIVE | SUSPENDED; ACTIVE when first cert VERIFIED; SUSPENDED manually or via cert-expiry cascade", default: PENDING_VERIFICATION }
      - { name: outstanding_balance_cents, type: integer, source: computed, default: 0, description: "Sum of balance_cents over this renter's Invoices with status IN {ISSUED, PARTIALLY_PAID}" }
      - { name: credit_hold, type: boolean, source: computed, default: false, description: "= outstanding_balance_cents > credit_limit_cents (strictly greater); gates reservation confirm and pull-list dispatch" }

  - name: InsuranceCertificate
    parent: null
    common_fields: true
    fields:
      - { name: renter_id, type: string, source: input, description: "FK -> Renter.id; owning renter" }
      - { name: insurer_name, type: string, source: input, description: "Insurance company name" }
      - { name: policy_number, type: string, source: input, description: "Policy identifier" }
      - { name: coverage_cents, type: integer, source: input, description: "Per-incident coverage amount; must be >= renter-type minimum to verify" }
      - { name: effective_date, type: string, source: input, description: "ISO date coverage starts" }
      - { name: expiry_date, type: string, source: input, description: "ISO date coverage ends (inclusive)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | VERIFIED | REJECTED | EXPIRED", default: SUBMITTED }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the HouseAdmin who decided; null until decided" }

  - name: RateCard
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Rate card label" }
      - { name: long_run_threshold_weeks, type: integer, source: input, description: "run_weeks >= this (>=, not >) selects LONG_RUN rate variant" }
      - { name: long_run_discount_pct, type: number, source: input, description: "Discount fraction for long-run bookings, e.g. 0.20" }
      - { name: deep_run_threshold_weeks, type: integer, source: input, description: "run_weeks >= this selects the deeper discount tier" }
      - { name: deep_run_discount_pct, type: number, source: input, description: "Discount fraction for deep-run bookings, e.g. 0.30" }
      - { name: late_fee_daily_pct, type: number, source: input, description: "Fraction of the unit daily rate charged per late day, e.g. 0.10" }
      - { name: status, type: enum, source: system, description: "PUBLISHED | SUPERSEDED; creating a new card supersedes the previously PUBLISHED card", default: PUBLISHED }

  - name: Item
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Catalog name, e.g. 'Victorian tailcoat'" }
      - { name: period, type: enum, source: input, description: "ANCIENT | MEDIEVAL | RENAISSANCE | REGENCY | VICTORIAN | EDWARDIAN | TWENTIES | FIFTIES | EIGHTIES | CONTEMPORARY | FANTASY" }
      - { name: category, type: enum, source: input, description: "COSTUME | PROP | SET_DRESSING | WEAPONRY | ACCESSORY — drives cleaning buffer days and base cleaning fee" }
      - { name: size_class, type: enum, source: input, description: "NONE | XS | S | M | L | XL | PLUS — NONE for props/set dressing" }
      - { name: alteration_policy, type: enum, source: input, description: "PROHIBITED | REVERSIBLE_ONLY | TAILORING_ALLOWED — gates fitting authorization types" }
      - { name: replacement_value_cents, type: integer, source: input, description: "Agreed full replacement value; drives AGREED_VALUE claims and insurance coverage comparison" }
      - { name: base_daily_rate_cents, type: integer, source: input, description: "Base rental price per calendar day" }
      - { name: base_weekly_rate_cents, type: integer, source: input, description: "Base rental price per 7-day week" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DEACCESSION_PENDING | DEACCESSIONED (soft-deleted but queryable)", default: ACTIVE }
      - { name: serviceable_unit_count, type: integer, source: computed, default: 0, description: "Count of ItemUnits with status NOT IN {AWAITING_DISPOSAL, DISPOSED} — the pool reservation capacity checks draw on" }

  - name: ItemUnit
    parent: null
    common_fields: true
    fields:
      - { name: item_id, type: string, source: input, description: "FK -> Item.id; catalog item this unit belongs to" }
      - { name: barcode, type: string, source: input, description: "House-unique physical barcode" }
      - { name: condition_grade, type: enum, source: input, description: "A | B | C | D at acquisition; later updated by return assessments; D units are never assigned to pull lists" }
      - { name: acquisition_date, type: string, source: input, description: "ISO date the unit was acquired (sourcing); drives depreciation" }
      - { name: acquisition_cost_cents, type: integer, source: input, description: "Purchase cost; drives DEPRECIATED_REPLACEMENT valuation" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | OUT | CLEANING | REPAIR | AWAITING_DISPOSAL | DISPOSED", default: AVAILABLE }
      - { name: last_returned_date, type: string, source: system, description: "ISO date of last check-in; null if never rented; unit-selector tie-break input" }

  - name: Production
    parent: null
    common_fields: true
    fields:
      - { name: renter_id, type: string, source: input, description: "FK -> Renter.id; renting organization" }
      - { name: title, type: string, source: input, description: "Production title" }
      - { name: rehearsal_start_date, type: string, source: input, description: "ISO date rehearsals begin; reservation windows may not start before this" }
      - { name: performance_start_date, type: string, source: input, description: "ISO date of opening night" }
      - { name: closing_date, type: string, source: input, description: "ISO date of final performance" }
      - { name: return_by_date, type: string, source: computed, description: "= closing_date + STRIKE_ALLOWANCE_DAYS(3); reservation windows may not end after this" }
      - { name: run_weeks, type: integer, source: computed, description: "= floor((closing_date - performance_start_date + 1) / 7)" }
      - { name: long_run, type: boolean, source: computed, description: "Pinned at confirm: run_weeks >= rate_card.long_run_threshold_weeks" }
      - { name: rate_card_id, type: string, source: system, description: "FK -> RateCard.id; pinned at production confirm" }
      - { name: rate_card_version, type: integer, source: system, description: "RateCard.version pinned at confirm; later card supersession does not re-price this production" }
      - { name: status, type: enum, source: system, description: "DRAFT | CONFIRMED | IN_RUN | WRAP | SETTLED | CANCELLED", default: DRAFT }

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id; production this hold belongs to" }
      - { name: item_id, type: string, source: input, description: "FK -> Item.id; catalog item being held" }
      - { name: quantity, type: integer, source: input, description: "Number of units held; must be >= 1" }
      - { name: window_start_date, type: string, source: input, description: "ISO date first day of need (inclusive)" }
      - { name: window_end_date, type: string, source: input, description: "ISO date last day of need (inclusive); must be >= window_start_date" }
      - { name: rate_variant, type: enum, source: computed, description: "LONG_RUN if production.long_run else (WEEKLY if window_days >= 7 else DAILY)" }
      - { name: quoted_charge_cents, type: integer, source: computed, description: "Quote per rental_quote calc; computed at create, recomputed on amend, frozen at confirm" }
      - { name: hold_expires_at, type: string, source: system, description: "Logical clock at creation + HOLD_HOURS(72); HELD reservations past this are EXPIRED by run_daily_ops" }
      - { name: status, type: enum, source: system, description: "HELD | CONFIRMED | RELEASED | EXPIRED | FULFILLED", default: HELD }

  - name: PullList
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id; production being pulled for" }
      - { name: status, type: enum, source: system, description: "DRAFT | PICKING | DISPATCHED | CLOSED | CANCELLED", default: DRAFT }
      - { name: submitted_at, type: string, source: system, description: "Logical timestamp of submit; null until submitted" }
      - { name: dispatched_at, type: string, source: system, description: "Logical timestamp of dispatch; null until dispatched" }

  - name: PullListLine
    parent: null
    common_fields: true
    fields:
      - { name: pull_list_id, type: string, source: system, description: "FK -> PullList.id; owning pull list" }
      - { name: reservation_id, type: string, source: system, description: "FK -> Reservation.id; reservation this line fulfills" }
      - { name: item_unit_id, type: string, source: system, description: "FK -> ItemUnit.id; unit assigned by the selector at pull-list submit" }
      - { name: status, type: enum, source: system, description: "PENDING | PICKED | OUT | RETURNED | DAMAGED | LOST", default: PENDING }
      - { name: due_back_date, type: string, source: system, description: "= reservation.window_end_date; late fees accrue after this date" }
      - { name: returned_at, type: string, source: system, description: "Logical timestamp of check-in; null until returned" }
      - { name: rental_charge_cents, type: integer, source: computed, description: "Per-unit booked charge (round_half_up(quoted_charge_cents / quantity) x condition multiplier), computed at assignment" }
      - { name: late_fee_cents, type: integer, source: computed, default: 0, description: "Computed at check-in or auto-loss: round(late_days x base_daily_rate x condition multiplier x late_fee_daily_pct)" }
      - { name: rental_invoiced, type: boolean, source: system, default: false, description: "True once an invoice generation has swept this line's rental_charge_cents" }
      - { name: late_fee_invoiced, type: boolean, source: system, default: false, description: "True once an invoice generation has swept this line's late_fee_cents (late fees only exist after a terminal return/loss event)" }

  - name: FittingAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: pull_list_line_id, type: string, source: input, description: "FK -> PullListLine.id; line the alteration applies to" }
      - { name: alteration_type, type: enum, source: input, description: "HEM | TAKE_IN | LET_OUT | DYE | DISTRESS | TRIM" }
      - { name: notes, type: string, source: input, description: "Tailor notes", default: "" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | REJECTED | RESTORED", default: REQUESTED }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of deciding HouseAdmin; null until decided" }

  - name: ReturnAssessment
    parent: null
    common_fields: true
    fields:
      - { name: pull_list_line_id, type: string, source: system, description: "FK -> PullListLine.id; exactly one assessment per checked-in line (1:1)" }
      - { name: condition_grade_before, type: enum, source: system, description: "Unit grade at dispatch time (A | B | C | D)" }
      - { name: condition_grade_after, type: enum, source: input, description: "A | B | C | D — grade observed at check-in" }
      - { name: damage_severity, type: enum, source: input, description: "NONE | MINOR | REPAIRABLE | DESTROYED" }
      - { name: restoration_complete, type: boolean, source: input, description: "True when all approved alterations were reversed before return" }
      - { name: late_days, type: integer, source: computed, description: "= max(0, returned_date - due_back_date) in whole days" }
      - { name: assessed_by_user_id, type: string, source: system, description: "X-User-ID of the WardrobeStaff performing check-in" }

  - name: DamageClaim
    parent: null
    common_fields: true
    fields:
      - { name: pull_list_line_id, type: string, source: input, description: "FK -> PullListLine.id; damaged or lost line" }
      - { name: return_assessment_id, type: string, source: input, description: "FK -> ReturnAssessment.id; required for DAMAGE claims, null for LOSS claims" }
      - { name: claim_type, type: enum, source: input, description: "DAMAGE | LOSS; DAMAGE requires line status DAMAGED, LOSS requires line status LOST" }
      - { name: valuation_method, type: enum, source: computed, description: "AGREED_VALUE if renter holds a VERIFIED cert with coverage_cents >= item.replacement_value_cents and expiry_date >= assessment date, else DEPRECIATED_REPLACEMENT; LOSS claims always value at full replacement_value_cents" }
      - { name: assessed_value_cents, type: integer, source: computed, description: "Per damage_valuation calculation" }
      - { name: status, type: enum, source: system, description: "DRAFT | POSTED | DISPUTED | WAIVED", default: DRAFT }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the WardrobeStaff who created the claim" }
      - { name: posted_by_user_id, type: string, source: system, description: "X-User-ID of the Accountant who posted; MUST differ from created_by_user_id (segregation of duties)" }
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id; set when swept into an invoice; null until billed" }

  - name: CleaningTicket
    parent: null
    common_fields: true
    fields:
      - { name: item_unit_id, type: string, source: system, description: "FK -> ItemUnit.id; unit entering the cleaning cycle" }
      - { name: status, type: enum, source: system, description: "QUEUED | IN_CLEANING | INSPECTION | REPAIR | READY", default: QUEUED }
      - { name: requires_repair, type: boolean, source: system, description: "True when check-in damage_severity == REPAIRABLE" }
      - { name: repair_done, type: boolean, source: system, default: false, description: "Set when the ticket passes through REPAIR" }
      - { name: queue_depth_at_creation, type: integer, source: system, description: "Count of tickets with status IN {QUEUED, IN_CLEANING} at creation time" }
      - { name: cleaning_fee_cents, type: integer, source: computed, description: "Base category fee x RUSH_MULTIPLIER(1.5) when queue_depth_at_creation >= BACKLOG_THRESHOLD(10)" }
      - { name: invoiced, type: boolean, source: system, default: false, description: "True once an invoice generation has swept this fee" }
      - { name: queued_at, type: string, source: system, description: "Logical timestamp of creation" }
      - { name: ready_at, type: string, source: system, description: "Logical timestamp of reaching READY; null until then" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id; production being billed" }
      - { name: status, type: enum, source: system, description: "OPEN | ISSUED | PARTIALLY_PAID | PAID | CREDITED | VOID", default: OPEN }
      - { name: rental_charges_cents, type: integer, source: computed, default: 0, description: "Sum of swept PullListLine.rental_charge_cents (per-line rounded values are summed, never re-rounded)" }
      - { name: late_fee_cents, type: integer, source: computed, default: 0, description: "Sum of swept PullListLine.late_fee_cents" }
      - { name: cleaning_charges_cents, type: integer, source: computed, default: 0, description: "Sum of swept CleaningTicket.cleaning_fee_cents" }
      - { name: damage_charges_cents, type: integer, source: computed, default: 0, description: "Sum of swept DamageClaim.assessed_value_cents" }
      - { name: total_cents, type: integer, source: computed, description: "= rental_charges_cents + late_fee_cents + cleaning_charges_cents + damage_charges_cents - credited_cents" }
      - { name: credited_cents, type: integer, source: system, default: 0, description: "Accumulated credit-note amount" }
      - { name: amount_paid_cents, type: integer, source: system, default: 0, description: "Accumulated payments" }
      - { name: balance_cents, type: integer, source: computed, description: "= total_cents - amount_paid_cents" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Renter
    initial_state: PENDING_VERIFICATION
    terminal_states: []
    transitions:
      - from: PENDING_VERIFICATION
        to: ACTIVE
        trigger: "system (automatic when the renter's first InsuranceCertificate is decided VERIFIED)"
        actor: system
        preconditions: []
        side_effects: ["Renter becomes eligible for production confirm / reservation / dispatch operations"]

      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /rental-house/renters/{renterId} with status=SUSPENDED, OR system (run_daily_ops when the renter's last VERIFIED certificate expires)"
        actor: HouseAdmin | system
        preconditions: []
        side_effects:
          - "Cascade: every Reservation with status HELD on this renter's productions -> EXPIRED"
          - "Cascade: every Reservation with status CONFIRMED on this renter's productions -> RELEASED (held quantity freed)"
          - "Reservation confirm and pull-list dispatch now fail with ERR_RENTER_SUSPENDED"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /rental-house/renters/{renterId} with status=ACTIVE, OR system (automatic when a new certificate is decided VERIFIED while SUSPENDED)"
        actor: HouseAdmin | system
        preconditions:
          - "Manual reactivation requires at least one certificate with status VERIFIED and expiry_date >= current logical date (ERR_INSURANCE_NOT_VERIFIED)"
        side_effects: []

  - entity: InsuranceCertificate
    initial_state: SUBMITTED
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /rental-house/insurance-certificates/{certId}/decide with decision=VERIFIED"
        actor: HouseAdmin
        preconditions:
          - "coverage_cents >= renter-type minimum (INSURANCE_MIN_COVERAGE: THEATRE 100000, FILM 500000, EVENT 250000, INDIVIDUAL 50000) else ERR_INSUFFICIENT_COVERAGE"
          - "expiry_date >= current logical date else ERR_CERTIFICATE_EXPIRED"
        side_effects:
          - "decided_by_user_id = X-User-ID"
          - "If renter.status IN {PENDING_VERIFICATION, SUSPENDED}: renter.status -> ACTIVE"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /rental-house/insurance-certificates/{certId}/decide with decision=REJECTED"
        actor: HouseAdmin
        preconditions: []
        side_effects: ["decided_by_user_id = X-User-ID"]

      - from: SUBMITTED
        to: EXPIRED
        trigger: "system (run_daily_ops when expiry_date < current logical date)"
        actor: system
        preconditions: []
        side_effects: []

      - from: VERIFIED
        to: EXPIRED
        trigger: "system (run_daily_ops when expiry_date < current logical date)"
        actor: system
        preconditions: []
        side_effects:
          - "If the renter has no other certificate with status VERIFIED and expiry_date >= current logical date: renter.status -> SUSPENDED (cascade: HELD reservations -> EXPIRED, CONFIRMED reservations -> RELEASED)"

  - entity: RateCard
    initial_state: PUBLISHED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system (automatic when a new RateCard is created)"
        actor: system
        preconditions: []
        side_effects:
          - "Productions already CONFIRMED keep their pinned rate_card_id + rate_card_version and are NOT re-priced"

  - entity: Item
    initial_state: ACTIVE
    terminal_states: [DEACCESSIONED]
    transitions:
      - from: ACTIVE
        to: DEACCESSION_PENDING
        trigger: "POST /rental-house/items/{itemId}/request-deaccession"
        actor: HouseAdmin
        preconditions:
          - "No Reservation for this item with status IN {HELD, CONFIRMED} (ERR_ITEM_HAS_ACTIVE_HOLDS)"
          - "Every ItemUnit of this item has status IN {AVAILABLE, AWAITING_DISPOSAL, DISPOSED} — none OUT, CLEANING, or REPAIR (ERR_DEACCESSION_BLOCKED)"
        side_effects:
          - "Every ItemUnit with status AVAILABLE -> AWAITING_DISPOSAL"
          - "Item no longer appears in default list results (include_deaccessioned=true to see it); new reservations rejected with ERR_ITEM_NOT_RENTABLE"

      - from: DEACCESSION_PENDING
        to: ACTIVE
        trigger: "POST /rental-house/items/{itemId}/cancel-deaccession"
        actor: HouseAdmin
        preconditions: []
        side_effects: ["Every ItemUnit with status AWAITING_DISPOSAL -> AVAILABLE"]

      - from: DEACCESSION_PENDING
        to: DEACCESSIONED
        trigger: "POST /rental-house/items/{itemId}/complete-deaccession"
        actor: HouseAdmin
        preconditions:
          - "Every ItemUnit has status IN {AWAITING_DISPOSAL, DISPOSED} (ERR_DEACCESSION_BLOCKED)"
        side_effects:
          - "Every ItemUnit with status AWAITING_DISPOSAL -> DISPOSED"
          - "serviceable_unit_count recomputed (drops to 0)"

  - entity: ItemUnit
    initial_state: AVAILABLE
    terminal_states: [DISPOSED]
    transitions:
      - from: AVAILABLE
        to: OUT
        trigger: "system (automatic when its PullList transitions to DISPATCHED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: OUT
        to: CLEANING
        trigger: "POST /rental-house/pull-list-lines/{lineId}/check-in with damage_severity IN {NONE, MINOR}"
        actor: WardrobeStaff
        preconditions: []
        side_effects:
          - "condition_grade = assessment condition_grade_after"
          - "last_returned_date = current logical date"
          - "CleaningTicket created (QUEUED, requires_repair=false)"

      - from: OUT
        to: REPAIR
        trigger: "POST /rental-house/pull-list-lines/{lineId}/check-in with damage_severity = REPAIRABLE"
        actor: WardrobeStaff
        preconditions: []
        side_effects:
          - "condition_grade = assessment condition_grade_after"
          - "last_returned_date = current logical date"
          - "CleaningTicket created (QUEUED, requires_repair=true)"

      - from: OUT
        to: DISPOSED
        trigger: "POST /rental-house/pull-list-lines/{lineId}/check-in with damage_severity = DESTROYED, OR POST /rental-house/pull-list-lines/{lineId}/report-lost, OR system (run_daily_ops auto-loss)"
        actor: WardrobeStaff | system
        preconditions: []
        side_effects:
          - "On DESTROYED check-in: condition_grade = condition_grade_after, last_returned_date set, no CleaningTicket is created"
          - "Item.serviceable_unit_count recomputed"

      - from: CLEANING
        to: AVAILABLE
        trigger: "system (automatic when the unit's CleaningTicket reaches READY)"
        actor: system
        preconditions: []
        side_effects: []

      - from: REPAIR
        to: AVAILABLE
        trigger: "system (automatic when the unit's CleaningTicket reaches READY)"
        actor: system
        preconditions: []
        side_effects: []

      - from: AVAILABLE
        to: AWAITING_DISPOSAL
        trigger: "system (cascade from Item request-deaccession)"
        actor: system
        preconditions: []
        side_effects: []

      - from: AWAITING_DISPOSAL
        to: AVAILABLE
        trigger: "system (cascade from Item cancel-deaccession)"
        actor: system
        preconditions: []
        side_effects: []

      - from: AWAITING_DISPOSAL
        to: DISPOSED
        trigger: "system (cascade from Item complete-deaccession)"
        actor: system
        preconditions: []
        side_effects: ["Item.serviceable_unit_count recomputed"]

  - entity: Production
    initial_state: DRAFT
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /rental-house/productions/{productionId}/confirm"
        actor: RenterContact
        preconditions:
          - "renter.status == ACTIVE (ERR_RENTER_SUSPENDED)"
          - "renter has a certificate with status VERIFIED, expiry_date >= return_by_date (ERR_INSURANCE_NOT_VERIFIED)"
          - "a RateCard with status PUBLISHED exists (ERR_RATE_CARD_REQUIRED)"
          - "rehearsal_start_date <= performance_start_date <= closing_date (ERR_DATE_ORDER)"
        side_effects:
          - "Pins rate_card_id + rate_card_version from the PUBLISHED card"
          - "Computes run_weeks, long_run, return_by_date"
          - "increments Production.version by 1"

      - from: CONFIRMED
        to: IN_RUN
        trigger: "system (run_daily_ops when current logical date >= performance_start_date)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_RUN
        to: WRAP
        trigger: "system (run_daily_ops when current logical date > closing_date)"
        actor: system
        preconditions: []
        side_effects: []
        note: "run_daily_ops applies date advancement TRANSITIVELY within a single run: a CONFIRMED production evaluated when date > closing_date moves CONFIRMED -> IN_RUN -> WRAP in that one run, and the WRAP -> SETTLED evaluation then runs in the same pass."

      - from: WRAP
        to: SETTLED
        trigger: "system (evaluated after run_daily_ops, pull-list auto-close, record_payment, or credit_note)"
        actor: system
        preconditions:
          - "Every PullList of this production has status IN {CLOSED, CANCELLED}"
          - "Every Invoice of this production has status IN {PAID, CREDITED, VOID}"
          - "No unbilled charges exist: no PullListLine with rental_invoiced == false and status IN {OUT, RETURNED, DAMAGED, LOST}; no PullListLine with late_fee_invoiced == false and status IN {RETURNED, DAMAGED, LOST}; no POSTED DamageClaim with invoice_id null; no CleaningTicket with invoiced == false"
        side_effects: []

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /rental-house/productions/{productionId}/cancel"
        actor: RenterContact
        preconditions: []
        side_effects:
          - "Cascade: Reservations with status HELD -> RELEASED; status CONFIRMED -> RELEASED"
          - "Cascade: PullLists with status DRAFT -> CANCELLED (none can exist in PICKING from a DRAFT production because submit requires CONFIRMED production)"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /rental-house/productions/{productionId}/cancel"
        actor: RenterContact
        preconditions:
          - "No PullList of this production has status IN {PICKING, DISPATCHED} (ERR_PRODUCTION_HAS_ACTIVE_PULLS)"
        side_effects:
          - "Cascade: Reservations HELD/CONFIRMED -> RELEASED"
          - "Cascade: PullLists DRAFT -> CANCELLED"

  - entity: Reservation
    initial_state: HELD
    terminal_states: [RELEASED, EXPIRED, FULFILLED]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /rental-house/reservations/{reservationId}/confirm"
        actor: RenterContact
        preconditions:
          - "production.status == CONFIRMED (ERR_INVALID_STATE)"
          - "renter.credit_hold == false (ERR_CREDIT_LIMIT_EXCEEDED)"
          - "hold not expired: current logical timestamp <= hold_expires_at (ERR_HOLD_EXPIRED)"
          - "Capacity re-check per availability_for_window (ERR_CAPACITY_EXCEEDED)"
        side_effects: ["quoted_charge_cents frozen (no longer recomputed except via amend)"]

      - from: CONFIRMED
        to: HELD
        trigger: "POST /rental-house/reservations/{reservationId}/amend"
        actor: RenterContact
        preconditions:
          - "New quantity/window pass availability_for_window capacity check (ERR_CAPACITY_EXCEEDED)"
          - "New window within production bounds (ERR_WINDOW_OUT_OF_BOUNDS)"
        side_effects:
          - "quoted_charge_cents recomputed under the production's pinned rate card"
          - "hold_expires_at reset to current logical clock + HOLD_HOURS(72)"
          - "Reservation must be re-confirmed before any new pull-list submit can draw on it"

      - from: HELD
        to: HELD
        trigger: "POST /rental-house/reservations/{reservationId}/amend"
        actor: RenterContact
        preconditions:
          - "Same checks as CONFIRMED amend (capacity, window bounds)"
        side_effects:
          - "quoted_charge_cents recomputed; hold_expires_at reset to now + 72h"

      - from: HELD
        to: RELEASED
        trigger: "POST /rental-house/reservations/{reservationId}/release, OR system (cascade: renter suspension / production cancel)"
        actor: RenterContact | system
        preconditions: []
        side_effects: ["Held quantity freed for overlapping windows"]

      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /rental-house/reservations/{reservationId}/release, OR system (cascade: renter suspension / production cancel)"
        actor: RenterContact | system
        preconditions:
          - "Manual release: no PullListLine with status IN {PENDING, PICKED, OUT} references this reservation (ERR_RESERVATION_IN_USE)"
        side_effects: ["Held quantity freed"]

      - from: HELD
        to: EXPIRED
        trigger: "system (run_daily_ops when current logical timestamp > hold_expires_at), OR system (cascade: renter suspension)"
        actor: system
        preconditions: []
        side_effects: ["Held quantity freed"]

      - from: CONFIRMED
        to: FULFILLED
        trigger: "system (automatic when a pull-list covering this reservation's full quantity is DISPATCHED — units actually left the building)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Submit alone does NOT fulfill: a submitted-but-undispatched reservation stays CONFIRMED (referenced by PENDING/PICKED lines), which is exactly what makes ERR_RESERVATION_IN_USE reachable on manual release."

  - entity: PullList
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PICKING
        trigger: "POST /rental-house/pull-lists/{pullListId}/submit"
        actor: WardrobeStaff
        preconditions:
          - "production.status == CONFIRMED (ERR_INVALID_STATE)"
          - "Production has at least one Reservation with status CONFIRMED not already covered by lines on a pull list with status IN {PICKING, DISPATCHED, CLOSED} (ERR_NOTHING_TO_PULL)"
          - "Unit selector finds enough eligible units for every uncovered CONFIRMED reservation; failure is atomic — no lines created (ERR_NO_UNITS_AVAILABLE)"
        side_effects:
          - "Creates one PullListLine per unit of quantity for each uncovered CONFIRMED reservation, in reservation order (window_start_date ASC, created_at ASC)"
          - "Unit selector assigns item_unit_id per unit_selector calculation; rental_charge_cents computed per line"
          - "submitted_at = current logical timestamp; covered reservations REMAIN CONFIRMED but are now referenced by active lines (manual release -> ERR_RESERVATION_IN_USE)"

      - from: PICKING
        to: DISPATCHED
        trigger: "POST /rental-house/pull-lists/{pullListId}/dispatch"
        actor: WardrobeStaff
        preconditions:
          - "Every line has status PICKED (ERR_LINES_NOT_PICKED)"
          - "renter.status == ACTIVE (ERR_RENTER_SUSPENDED)"
          - "renter.credit_hold == false (ERR_CREDIT_LIMIT_EXCEEDED)"
          - "renter has a certificate with status VERIFIED and expiry_date >= current logical date (ERR_INSURANCE_NOT_VERIFIED)"
        side_effects:
          - "Every line PICKED -> OUT; due_back_date = reservation.window_end_date"
          - "Every assigned unit AVAILABLE -> OUT"
          - "Every covered Reservation CONFIRMED -> FULFILLED"
          - "dispatched_at = current logical timestamp"

      - from: DISPATCHED
        to: CLOSED
        trigger: "system (automatic when every line is terminal IN {RETURNED, DAMAGED, LOST} AND every APPROVED fitting on its lines is RESTORED AND every DAMAGED/LOST line has a DamageClaim with status IN {POSTED, WAIVED})"
        actor: system
        preconditions: []
        side_effects:
          - "Bubble-up: production settle evaluation runs (WRAP + all pull lists terminal + all invoices settled + no unbilled charges -> SETTLED)"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /rental-house/pull-lists/{pullListId}/cancel, OR system (cascade: production cancel)"
        actor: RenterContact | system
        preconditions: []
        side_effects: []

      - from: PICKING
        to: CANCELLED
        trigger: "POST /rental-house/pull-lists/{pullListId}/cancel"
        actor: WardrobeStaff
        preconditions: []
        side_effects:
          - "All lines PENDING/PICKED are deleted; unit assignments released (units were never removed from AVAILABLE)"
          - "Covered reservations stay CONFIRMED (FULFILLED only happens at dispatch, so no rollback is needed)"

  - entity: PullListLine
    initial_state: PENDING
    terminal_states: [RETURNED, DAMAGED, LOST]
    transitions:
      - from: PENDING
        to: PICKED
        trigger: "POST /rental-house/pull-list-lines/{lineId}/pick"
        actor: WardrobeStaff
        preconditions:
          - "pull_list.status == PICKING (ERR_INVALID_STATE)"
        side_effects: []

      - from: PICKED
        to: OUT
        trigger: "system (cascade from pull-list dispatch)"
        actor: system
        preconditions: []
        side_effects: ["due_back_date = reservation.window_end_date"]

      - from: OUT
        to: RETURNED
        trigger: "POST /rental-house/pull-list-lines/{lineId}/check-in with damage_severity = NONE"
        actor: WardrobeStaff
        preconditions:
          - "If the line has a FittingAuthorization with status APPROVED: restoration_complete must be true (ERR_RESTORATION_INCOMPLETE)"
        side_effects:
          - "ReturnAssessment created; late_days and late_fee_cents computed"
          - "Unit OUT -> CLEANING; CleaningTicket created"
          - "If last non-terminal line: pull-list auto-close evaluation"

      - from: OUT
        to: DAMAGED
        trigger: "POST /rental-house/pull-list-lines/{lineId}/check-in with damage_severity IN {MINOR, REPAIRABLE, DESTROYED}"
        actor: WardrobeStaff
        preconditions:
          - "If the line has a FittingAuthorization with status APPROVED: restoration_complete must be true (ERR_RESTORATION_INCOMPLETE)"
        side_effects:
          - "ReturnAssessment created; late_days and late_fee_cents computed"
          - "Unit OUT -> CLEANING (MINOR) / REPAIR (REPAIRABLE) / DISPOSED (DESTROYED); CleaningTicket created except for DESTROYED"
          - "If last non-terminal line: pull-list auto-close evaluation (requires a POSTED or WAIVED claim for this line)"

      - from: OUT
        to: LOST
        trigger: "POST /rental-house/pull-list-lines/{lineId}/report-lost, OR system (run_daily_ops when current logical date > due_back_date + LOST_GRACE_DAYS(7))"
        actor: WardrobeStaff | system
        preconditions: []
        side_effects:
          - "Unit OUT -> DISPOSED; Item.serviceable_unit_count recomputed"
          - "late_fee_cents computed with late_days = LOST_GRACE_DAYS(7) (fixed grace, not open-ended)"
          - "If last non-terminal line: pull-list auto-close evaluation (requires a POSTED or WAIVED LOSS claim)"

  - entity: FittingAuthorization
    initial_state: REQUESTED
    terminal_states: [REJECTED, RESTORED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /rental-house/fitting-authorizations/{fittingId}/decide with decision=APPROVED"
        actor: HouseAdmin
        preconditions:
          - "line status IN {PENDING, PICKED, OUT} (ERR_INVALID_STATE)"
        side_effects: ["decided_by_user_id = X-User-ID"]

      - from: REQUESTED
        to: REJECTED
        trigger: "POST /rental-house/fitting-authorizations/{fittingId}/decide with decision=REJECTED"
        actor: HouseAdmin
        preconditions: []
        side_effects: ["decided_by_user_id = X-User-ID"]

      - from: APPROVED
        to: RESTORED
        trigger: "system (automatic at check-in of the line with restoration_complete = true)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DamageClaim
    initial_state: DRAFT
    terminal_states: [WAIVED]
    transitions:
      - from: DRAFT
        to: POSTED
        trigger: "POST /rental-house/damage-claims/{claimId}/post"
        actor: Accountant
        preconditions:
          - "posted_by (X-User-ID) != created_by_user_id (ERR_SOD_VIOLATION)"
        side_effects: ["posted_by_user_id = X-User-ID; claim becomes sweepable by invoice generation"]

      - from: DRAFT
        to: WAIVED
        trigger: "POST /rental-house/damage-claims/{claimId}/waive"
        actor: Accountant
        preconditions: []
        side_effects: []

      - from: POSTED
        to: DISPUTED
        trigger: "POST /rental-house/damage-claims/{claimId}/dispute"
        actor: RenterContact
        preconditions:
          - "claim.invoice_id is null — billed claims cannot be disputed (ERR_CLAIM_ALREADY_BILLED)"
        side_effects: []

      - from: DISPUTED
        to: POSTED
        trigger: "POST /rental-house/damage-claims/{claimId}/post (re-affirm after dispute)"
        actor: Accountant
        preconditions:
          - "posted_by (X-User-ID) != created_by_user_id (ERR_SOD_VIOLATION)"
        side_effects: []

      - from: DISPUTED
        to: WAIVED
        trigger: "POST /rental-house/damage-claims/{claimId}/waive"
        actor: Accountant
        preconditions: []
        side_effects: []

  - entity: CleaningTicket
    initial_state: QUEUED
    terminal_states: [READY]
    transitions:
      - from: QUEUED
        to: IN_CLEANING
        trigger: "POST /rental-house/cleaning-tickets/{ticketId}/advance"
        actor: WardrobeStaff
        preconditions: []
        side_effects: []

      - from: IN_CLEANING
        to: INSPECTION
        trigger: "POST /rental-house/cleaning-tickets/{ticketId}/advance"
        actor: WardrobeStaff
        preconditions: []
        side_effects: []

      - from: INSPECTION
        to: REPAIR
        trigger: "POST /rental-house/cleaning-tickets/{ticketId}/advance when requires_repair == true and repair_done == false"
        actor: WardrobeStaff
        preconditions: []
        side_effects: []

      - from: INSPECTION
        to: READY
        trigger: "POST /rental-house/cleaning-tickets/{ticketId}/advance when requires_repair == false OR repair_done == true"
        actor: WardrobeStaff
        preconditions: []
        side_effects:
          - "ready_at = current logical timestamp"
          - "Unit CLEANING/REPAIR -> AVAILABLE"

      - from: REPAIR
        to: INSPECTION
        trigger: "POST /rental-house/cleaning-tickets/{ticketId}/advance"
        actor: WardrobeStaff
        preconditions: []
        side_effects: ["repair_done = true"]

  - entity: Invoice
    initial_state: OPEN
    terminal_states: [PAID, CREDITED, VOID]
    transitions:
      - from: OPEN
        to: ISSUED
        trigger: "POST /rental-house/invoices/{invoiceId}/issue"
        actor: Accountant
        preconditions:
          - "total_cents > 0 (ERR_INVOICE_EMPTY)"
        side_effects:
          - "renter.outstanding_balance_cents recomputed (now includes this balance)"
          - "renter.credit_hold recomputed: outstanding_balance_cents > credit_limit_cents (strictly greater)"
          - "Production settle evaluation runs"

      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /rental-house/invoices/{invoiceId}/record-payment with amount_cents < balance_cents"
        actor: Accountant
        preconditions: ["amount_cents >= 1 (ERR_PAYMENT_INVALID)", "amount_cents <= balance_cents (ERR_PAYMENT_EXCEEDS_BALANCE)"]
        side_effects: ["amount_paid_cents += amount_cents; renter.outstanding_balance_cents and credit_hold recomputed"]

      - from: ISSUED
        to: PAID
        trigger: "POST /rental-house/invoices/{invoiceId}/record-payment with amount_cents == balance_cents"
        actor: Accountant
        preconditions: ["amount_cents >= 1", "amount_cents <= balance_cents"]
        side_effects:
          - "amount_paid_cents += amount_cents; renter.outstanding_balance_cents and credit_hold recomputed"
          - "Production settle evaluation runs"

      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /rental-house/invoices/{invoiceId}/record-payment bringing amount_paid_cents == total_cents"
        actor: Accountant
        preconditions: ["amount_cents >= 1", "amount_cents <= balance_cents"]
        side_effects:
          - "renter.outstanding_balance_cents and credit_hold recomputed"
          - "Production settle evaluation runs"

      - from: ISSUED
        to: CREDITED
        trigger: "POST /rental-house/invoices/{invoiceId}/credit-note with amount_cents == balance_cents"
        actor: Accountant
        preconditions: ["amount_cents >= 1 (ERR_CREDIT_INVALID)", "amount_cents <= balance_cents (ERR_CREDIT_EXCEEDS_BALANCE)"]
        side_effects:
          - "credited_cents += amount_cents; total_cents reduced; renter.outstanding_balance_cents and credit_hold recomputed"
          - "Production settle evaluation runs"

      - from: PARTIALLY_PAID
        to: CREDITED
        trigger: "POST /rental-house/invoices/{invoiceId}/credit-note with amount_cents == balance_cents"
        actor: Accountant
        preconditions: ["amount_cents >= 1", "amount_cents <= balance_cents"]
        side_effects:
          - "credited_cents += amount_cents; renter.outstanding_balance_cents and credit_hold recomputed"
          - "Production settle evaluation runs"

      - from: OPEN
        to: VOID
        trigger: "POST /rental-house/invoices/{invoiceId}/credit-note on an OPEN invoice with amount_cents == total_cents (administrative void of an unissued invoice)"
        actor: Accountant
        preconditions: []
        side_effects: ["Lines/claims/tickets swept into this invoice become unbilled again (rental_invoiced=false, late_fee_invoiced=false, invoiced=false, invoice_id=null)"]

# =============================================================================
# Concurrency Rules (OCC — see SKILL.md §1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: reservation-create-stale-production
    parent_entity: Production
    write_endpoint: "POST /rental-house/reservations"
    occ_field: expected_production_version
    description: |
      Creating a Reservation against a Production whose version has advanced
      since the client last observed it is rejected. Reservation creation
      mutates the production aggregate (version bump), so a client holding a
      stale view — e.g. another reservation was just created or the production
      was confirmed in between — must re-read before writing.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: pull-list-create-stale-production
    parent_entity: Production
    write_endpoint: "POST /rental-house/pull-lists"
    occ_field: expected_production_version
    description: |
      Creating a PullList against a Production whose version has advanced
      since the client last observed it is rejected. Pull-list creation
      mutates the production aggregate (version bump); a stale
      expected_production_version means the client missed an intervening
      reservation, confirmation, or pull-list write.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: rental_quote
    trigger: "Reservation create; Reservation amend; reservation confirm re-validates but does not recompute"
    algorithm: tiered_pricing
    formula: |
      window_days = window_end_date - window_start_date + 1          # inclusive calendar days
      rate_variant:
        if production.long_run (pinned flag):            variant = LONG_RUN
        elif window_days >= 7:                           variant = WEEKLY
        else:                                            variant = DAILY
      base charge:
        DAILY:    charge = quantity * base_daily_rate_cents * window_days
        WEEKLY:   charge = quantity * base_weekly_rate_cents * ceil(window_days / 7)
        LONG_RUN: discount = deep_run_discount_pct  if production.run_weeks >= deep_run_threshold_weeks
                             else long_run_discount_pct
                  charge = quantity * base_weekly_rate_cents * ceil(window_days / 7) * (1 - discount)
      quoted_charge_cents = round_half_up(charge)                     # one rounding step, at the reservation level
      All rate inputs (thresholds, discounts, late_fee pct) come from the production's PINNED rate card
      (rate_card_id + rate_card_version), never from the currently PUBLISHED card.
    input_set: "Reservation being priced; its Production (pinned long_run, run_weeks, rate card); Item base rates"
    constants:
      DAYS_PER_WEEK: 7
    precision: "0 decimal places (integer cents), round_half_up at the final step only"
    variants:
      - name: DAILY
        when: "production.long_run == false and window_days < 7"
        difference: "per-calendar-day pricing; cheapest for short windows"
      - name: WEEKLY
        when: "production.long_run == false and window_days >= 7"
        difference: "whole-week pricing, ceil(window_days/7) weeks, no discount"
      - name: LONG_RUN
        when: "production.long_run == true (run_weeks >= long_run_threshold_weeks)"
        difference: "weekly pricing with long_run_discount_pct, or deep_run_discount_pct when run_weeks >= deep_run_threshold_weeks; same window prices lower than WEEKLY"

  - name: line_rental_charge
    trigger: "Pull-list submit (per created PullListLine)"
    algorithm: aggregation
    formula: |
      per_unit = round_half_up(reservation.quoted_charge_cents / reservation.quantity)   # division rounding pinned HERE
      condition_multiplier: A = 1.20, B = 1.00, C = 0.85; grade D units are never assigned
      rental_charge_cents = round_half_up(per_unit * condition_multiplier(unit.condition_grade at assignment))
      Rounding order is PINNED: round per line at assignment; invoice generation sums the stored
      per-line integers and NEVER re-rounds the sum. (Sum-then-round yields a different total:
      e.g. two lines of 2666.4 raw -> per-line 2666+2666 = 5332 vs sum-round 5333.)
    input_set: "One Reservation and one assigned ItemUnit"
    precision: "integer cents, round_half_up per line"

  - name: late_fee
    trigger: "PullListLine check-in and report-lost / auto-loss"
    algorithm: threshold
    formula: |
      late_days = max(0, returned_date - due_back_date)      # whole days; return ON due_back_date => 0
      on report-lost / auto-loss: late_days = LOST_GRACE_DAYS (fixed 7)
      late_fee_cents = round_half_up(late_days * item.base_daily_rate_cents
                                     * condition_multiplier(unit.condition_grade)
                                     * rate_card.late_fee_daily_pct)
    input_set: "The line, its reservation window, the item rate, the pinned rate card"
    constants:
      LOST_GRACE_DAYS: 7
    precision: "integer cents, round_half_up"

  - name: damage_valuation
    trigger: "DamageClaim create (DAMAGE claims; LOSS claims short-circuit to full replacement value)"
    algorithm: weighted_scoring
    formula: |
      age_years = floor((assessment_date - unit.acquisition_date) / 365)         # whole years
      grade_mult (valuation): A = 1.00, B = 0.80, C = 0.60, D = 0.40
      salvage_floor = SALVAGE_FLOOR_PCT * item.replacement_value_cents           # 10%
      DEPRECIATED_REPLACEMENT:
        raw = unit.acquisition_cost_cents * (1 - age_years / USEFUL_LIFE_YEARS)  # USEFUL_LIFE_YEARS = 5
        value = round_half_up(max(raw, salvage_floor) * grade_mult)
      AGREED_VALUE:
        value = round_half_up(item.replacement_value_cents * grade_mult)
      LOSS (either method): value = item.replacement_value_cents                 # total loss, no grade multiplier
      Method selection (DAMAGE only): AGREED_VALUE iff renter holds >= 1 InsuranceCertificate with
        status VERIFIED, coverage_cents >= item.replacement_value_cents (>=, not >), and
        expiry_date >= assessment_date; otherwise DEPRECIATED_REPLACEMENT.
    input_set: "DamageClaim line -> unit, item, renter's certificates at assessment date"
    constants:
      USEFUL_LIFE_YEARS: 5
      SALVAGE_FLOOR_PCT: 0.10
    precision: "integer cents, round_half_up"
    variants:
      - name: DEPRECIATED_REPLACEMENT
        when: "renter's verified coverage < item.replacement_value_cents"
        difference: "straight-line depreciation from acquisition cost over 5 years, grade multiplier, 10% salvage floor; typically much lower than AGREED_VALUE"
      - name: AGREED_VALUE
        when: "renter's verified coverage >= item.replacement_value_cents"
        difference: "full agreed replacement value times grade multiplier; independent of acquisition cost and age"

  - name: availability_for_window
    trigger: "Reservation create, confirm, amend (capacity validation)"
    algorithm: interval_merge
    formula: |
      serviceable = item.serviceable_unit_count               # units NOT IN {AWAITING_DISPOSAL, DISPOSED}
      held = sum(quantity of Reservations r where r.item_id == item.id,
                 r.status IN {HELD, CONFIRMED}, r.id != this reservation,
                 and windows overlap)
      Window overlap uses INCLUSIVE date intervals: [start, end] overlaps [s2, e2] iff
        start <= e2 AND s2 <= end.   (Adjacency: end + 1 day == s2 does NOT overlap; end == s2 DOES.)
      line_allocated = count of PullListLines whose reservation.item_id == item.id,
                 line status IN {PENDING, PICKED, OUT}, and whose reservation window overlaps
      available = serviceable - held - line_allocated
      request is valid iff quantity <= available
    input_set: "Item, all its HELD/CONFIRMED reservations, all active pull-list lines for the item"

  - name: unit_selector
    trigger: "Pull-list submit (per uncovered CONFIRMED reservation, per unit of quantity)"
    algorithm: selector
    formula: |
      Candidate units for a reservation [start, end]:
        - unit.item_id == reservation.item_id
        - unit.status == AVAILABLE
        - unit.condition_grade != D
        - no other PullListLine l references this unit with l.status IN {PENDING, PICKED, OUT}
          where buffered intervals collide:
            occupied(l) = [l.reservation.window_start_date,
                           l.reservation.window_end_date + CLEANING_BUFFER_DAYS(item.category)]
            collision iff start <= occupied_end AND occupied_start <= end
            (per-unit STRICT buffered exclusion — unlike the reservation-level inclusive
             aggregate check, back-to-back windows inside the buffer are rejected)
      Ranking: condition_grade ASC (A first), last_returned_date ASC NULLS FIRST, created_at ASC.
      Take the top `quantity` units. If fewer than `quantity` candidates: submit fails atomically
      with ERR_NO_UNITS_AVAILABLE (no lines created at all).
    input_set: "ItemUnits of the item, their active pull-list lines"
    constants:
      CLEANING_BUFFER_DAYS: { COSTUME: 2, PROP: 1, SET_DRESSING: 1, WEAPONRY: 3, ACCESSORY: 1 }

  - name: cleaning_fee
    trigger: "CleaningTicket creation (at check-in)"
    algorithm: threshold
    formula: |
      base = CLEANING_BASE_FEE_CENTS[item.category]       # COSTUME 1500, PROP 800, SET_DRESSING 1200, WEAPONRY 2500, ACCESSORY 500
      queue_depth = count of CleaningTickets with status IN {QUEUED, IN_CLEANING} at creation time
      cleaning_fee_cents = round_half_up(base * RUSH_MULTIPLIER) if queue_depth >= BACKLOG_THRESHOLD else base
      Boundary: queue_depth == 10 triggers the rush multiplier; 9 does not (>= semantics).
    input_set: "Item category, cleaning ticket backlog at creation time"
    constants:
      CLEANING_BASE_FEE_CENTS: { COSTUME: 1500, PROP: 800, SET_DRESSING: 1200, WEAPONRY: 2500, ACCESSORY: 500 }
      BACKLOG_THRESHOLD: 10
      RUSH_MULTIPLIER: 1.5
    precision: "integer cents, round_half_up"

  - name: invoice_total
    trigger: "Invoice generation; credit-note application"
    algorithm: aggregation
    formula: |
      Evaluation order is PINNED (the naive reading looks circular):
        (1) rental_charges_cents = sum(rental_charge_cents of swept lines)      # pre-rounded per line
        (2) late_fee_cents       = sum(late_fee_cents of swept lines)
        (3) cleaning_charges_cents = sum(cleaning_fee_cents of swept tickets)
        (4) damage_charges_cents = sum(assessed_value_cents of swept POSTED claims)
        (5) total_cents = rental + late + cleaning + damage - credited_cents
        (6) balance_cents = total_cents - amount_paid_cents
      Sweep set at generation (production-scoped):
        - rental charges: PullListLines with status IN {OUT, RETURNED, DAMAGED, LOST} and
          rental_invoiced == false  (rental bills at/after dispatch, before return)
        - late fees: PullListLines with status IN {RETURNED, DAMAGED, LOST} and
          late_fee_invoiced == false  (a line whose rental was already swept can still contribute
          a late fee to a later invoice — the two flags are independent)
        - CleaningTickets with invoiced == false
        - DamageClaims with status POSTED and invoice_id null
      Each swept record is stamped (rental_invoiced / late_fee_invoiced / invoiced = true,
      invoice_id set) atomically with generation.
    input_set: "Production's unbilled lines, tickets, and POSTED claims"
    precision: "integer cents; no further rounding (components already rounded)"

  - name: renter_credit_recompute
    trigger: "Invoice issue, record-payment, credit-note, invoice void"
    algorithm: aggregation
    formula: |
      outstanding_balance_cents = sum(balance_cents of Invoices where invoice.production.renter_id == renter.id
                                    and invoice.status IN {ISSUED, PARTIALLY_PAID})
      credit_hold = outstanding_balance_cents > credit_limit_cents        # STRICTLY greater; == limit does NOT hold
      Pinned evaluation order on record-payment / credit-note:
        (1) mutate invoice.amount_paid_cents / credited_cents
        (2) recompute invoice.balance_cents / total_cents
        (3) recompute renter.outstanding_balance_cents
        (4) recompute renter.credit_hold
      The apparent cycle (invoice balance depends on payments; hold depends on balance; confirm/dispatch
      gating depends on hold) is resolved by always evaluating in the order above within one request.
    input_set: "Renter's invoices"
    precision: "integer cents"

  - name: production_dates
    trigger: "Production confirm"
    algorithm: aggregation
    formula: |
      run_weeks = floor((closing_date - performance_start_date + 1) / 7)     # 55 days -> 7; 56 days -> 8
      return_by_date = closing_date + STRIKE_ALLOWANCE_DAYS                  # 3 days
      long_run = run_weeks >= pinned_rate_card.long_run_threshold_weeks      # >= semantics; == qualifies
    input_set: "Production dates, PUBLISHED rate card"
    constants:
      STRIKE_ALLOWANCE_DAYS: 3

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted on this endpoint per the endpoint's roles list"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "RenterContact requests act only on resources whose renter_id == X-User-ID (production create body, and any production/reservation/pull-list/fitting/invoice/claim reachable through the path or body)"
    error_id: ERR_RENTER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all endpoints when X-User-Role == RenterContact"

  - priority: 4
    category: existence
    check: "Every id in path and body (renter, cert, rate card, item, unit, production, reservation, pull list, line, fitting, assessment, claim, ticket, invoice) exists; validated left-to-right in the path, then body"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 5
    category: state
    check: "Target resource is in a valid from-state for the requested transition (per state machines); covers ERR_INVALID_STATE plus domain state errors: ERR_RENTER_SUSPENDED, ERR_HOLD_EXPIRED, ERR_LINES_NOT_PICKED, ERR_RESERVATION_IN_USE, ERR_PRODUCTION_HAS_ACTIVE_PULLS, ERR_ITEM_HAS_ACTIVE_HOLDS, ERR_CLAIM_ALREADY_BILLED, ERR_SOD_VIOLATION (segregation-of-duties state)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_production_version must equal the current Production.version on reservation and pull-list creation; evaluated here, immediately after state checks and before any business rule"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /rental-house/reservations, POST /rental-house/pull-lists"

  - priority: 7
    category: business_safety
    check: "Insurance and alteration safety policy: certificate verify minimums (ERR_INSUFFICIENT_COVERAGE, ERR_CERTIFICATE_EXPIRED), production-confirm and dispatch insurance gates (ERR_INSURANCE_NOT_VERIFIED), alteration policy gate (ERR_ALTERATION_PROHIBITED)"
    error_id: "ERR_INSUFFICIENT_COVERAGE | ERR_CERTIFICATE_EXPIRED | ERR_INSURANCE_NOT_VERIFIED | ERR_ALTERATION_PROHIBITED"
    http_status: 422
    applies_to: "cert decide, production confirm, pull-list dispatch, fitting create"

  - priority: 8
    category: business_referential
    check: "Referenced objects are usable: item rentable — status == ACTIVE (ERR_ITEM_NOT_RENTABLE); a PUBLISHED rate card exists at production confirm (ERR_RATE_CARD_REQUIRED); one claim per line (ERR_CLAIM_ALREADY_EXISTS); claim type matches line status (ERR_CLAIM_TYPE_MISMATCH); barcode unique house-wide (ERR_DUPLICATE_BARCODE)"
    error_id: "ERR_ITEM_NOT_RENTABLE | ERR_RATE_CARD_REQUIRED | ERR_CLAIM_ALREADY_EXISTS | ERR_CLAIM_TYPE_MISMATCH | ERR_DUPLICATE_BARCODE"
    http_status: 409
    applies_to: "reservation create/amend, production confirm, claim create, unit create"

  - priority: 9
    category: business_temporal
    check: "Date-window rules: window_end_date >= window_start_date and window within [rehearsal_start_date, return_by_date] (ERR_WINDOW_OUT_OF_BOUNDS); production date order rehearsal <= performance <= closing (ERR_DATE_ORDER)"
    error_id: "ERR_WINDOW_OUT_OF_BOUNDS | ERR_DATE_ORDER"
    http_status: 422
    applies_to: "production create/confirm, reservation create/amend"

  - priority: 10
    category: business_constraint
    check: "Capacity and allocation: availability_for_window aggregate check (ERR_CAPACITY_EXCEEDED); unit selector empty pool (ERR_NO_UNITS_AVAILABLE); pull list has uncovered reservations (ERR_NOTHING_TO_PULL); deaccession unit-state gate (ERR_DEACCESSION_BLOCKED); restoration gate at check-in (ERR_RESTORATION_INCOMPLETE); quantity >= 1 (ERR_QUANTITY_INVALID)"
    error_id: "ERR_CAPACITY_EXCEEDED | ERR_NO_UNITS_AVAILABLE | ERR_NOTHING_TO_PULL | ERR_DEACCESSION_BLOCKED | ERR_RESTORATION_INCOMPLETE | ERR_QUANTITY_INVALID"
    http_status: 409
    applies_to: "reservation create/confirm/amend, pull-list submit/cancel, item deaccession, line check-in"

  - priority: 11
    category: business_fiscal
    check: "Money rules last: credit hold gates (ERR_CREDIT_LIMIT_EXCEEDED); invoice issue requires total > 0 / generation requires unbilled charges (ERR_INVOICE_EMPTY); payment/credit amounts within balance (ERR_PAYMENT_INVALID, ERR_PAYMENT_EXCEEDS_BALANCE, ERR_CREDIT_INVALID, ERR_CREDIT_EXCEEDS_BALANCE)"
    error_id: "ERR_CREDIT_LIMIT_EXCEEDED | ERR_INVOICE_EMPTY | ERR_PAYMENT_INVALID | ERR_PAYMENT_EXCEEDS_BALANCE | ERR_CREDIT_INVALID | ERR_CREDIT_EXCEEDS_BALANCE"
    http_status: 402
    applies_to: "reservation confirm, pull-list dispatch, invoice generate/issue/payment/credit-note"

  - priority: 12
    category: existence
    check: "Generic request shape errors (missing required field, wrong type, invalid enum member, malformed date) — lowest priority, only after all business rules pass"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"

# =============================================================================
# Table 5 preamble: Response Envelope (FIXED — verbatim per SKILL §1.0)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock / operations checkpoint ---
  - method: POST
    path: "/rental-house/_clock/set_current_utc"
    description: "Set the server's logical clock (test-driving endpoint). Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z (startup default — never the real wall clock). All date rules (hold expiry, certificate expiry, late fees, production advancement, auto-loss) evaluate against this logical clock."
    roles: [HouseAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Logical clock advanced; no state transitions fire by themselves — run_daily_ops performs the sweep"]

  - method: POST
    path: "/rental-house/run_daily_ops"
    description: "Operations checkpoint against the current logical clock: expire VERIFIED/SUBMITTED certificates past expiry_date (cascading renter suspension + reservation release), expire HELD reservations past hold_expires_at, advance productions (CONFIRMED->IN_RUN at performance_start_date, IN_RUN->WRAP after closing_date), auto-lose lines OUT past due_back_date + LOST_GRACE_DAYS(7), and evaluate production settle."
    roles: [HouseAdmin]
    code: 200
    input: []
    output: "{ current_utc: string, expired_certificate_ids: array, expired_reservation_ids: array, released_reservation_ids: array, advanced_production_ids: array, auto_lost_line_ids: array, settled_production_ids: array }"
    side_effects:
      - "Certificate expiry cascade: VERIFIED cert expires -> renter with no other VERIFIED unexpired cert -> SUSPENDED -> HELD reservations EXPIRED, CONFIRMED reservations RELEASED"
      - "HELD reservation with hold_expires_at < now -> EXPIRED"
      - "Production date advancement and WRAP->SETTLED evaluation"
      - "Line OUT past due_back + 7 days -> LOST; unit -> DISPOSED; late_fee_cents = 7-day grace fee"

  # --- Renters ---
  - method: POST
    path: "/rental-house/renters"
    description: "Register a renter organization (status PENDING_VERIFICATION)"
    roles: [HouseAdmin]
    code: 201
    input: [name, renter_type, credit_limit_cents]
    output: Renter
    side_effects: ["outstanding_balance_cents=0, credit_hold=false"]

  - method: GET
    path: "/rental-house/renters"
    description: "List renters with optional status filter and pagination"
    roles: [HouseAdmin, WardrobeStaff, Accountant, RenterContact]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Renter[]
    side_effects: []

  - method: GET
    path: "/rental-house/renters/{id}"
    description: "Get one renter including computed outstanding_balance_cents and credit_hold"
    roles: [HouseAdmin, WardrobeStaff, Accountant, RenterContact]
    code: 200
    input: []
    output: Renter
    side_effects: []

  - method: PATCH
    path: "/rental-house/renters/{id}"
    description: "Update credit_limit_cents and/or manually suspend/reactivate (status ACTIVE<->SUSPENDED only; reactivation requires a VERIFIED unexpired certificate)"
    roles: [HouseAdmin]
    code: 200
    input: ["credit_limit_cents?", "status?"]
    output: Renter
    side_effects: ["Manual ACTIVE->SUSPENDED triggers the same reservation-release cascade as cert-expiry suspension"]

  # --- Insurance certificates ---
  - method: POST
    path: "/rental-house/renters/{id}/insurance-certificates"
    description: "Submit a certificate for a renter (RenterContact only for own renter_id)"
    roles: [HouseAdmin, RenterContact]
    code: 201
    input: [insurer_name, policy_number, coverage_cents, effective_date, expiry_date]
    output: InsuranceCertificate
    side_effects: ["status=SUBMITTED"]

  - method: GET
    path: "/rental-house/renters/{id}/insurance-certificates"
    description: "List certificates of a renter (FK reverse reachability)"
    roles: [HouseAdmin, WardrobeStaff, Accountant, RenterContact]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: InsuranceCertificate[]
    side_effects: []

  - method: GET
    path: "/rental-house/insurance-certificates/{id}"
    description: "Get one certificate"
    roles: [HouseAdmin, WardrobeStaff, Accountant, RenterContact]
    code: 200
    input: []
    output: InsuranceCertificate
    side_effects: []

  - method: POST
    path: "/rental-house/insurance-certificates/{id}/decide"
    description: "Verify or reject a SUBMITTED certificate; verifying enforces renter-type minimum coverage and expiry; may flip renter to ACTIVE"
    roles: [HouseAdmin]
    code: 200
    input: [decision]
    output: InsuranceCertificate
    side_effects: ["decision=VERIFIED: renter PENDING_VERIFICATION/SUSPENDED -> ACTIVE; sets decided_by_user_id"]

  # --- Rate cards ---
  - method: POST
    path: "/rental-house/rate-cards"
    description: "Publish a new rate card; the previously PUBLISHED card becomes SUPERSEDED (confirmed productions keep their pinned card)"
    roles: [HouseAdmin]
    code: 201
    input: [name, long_run_threshold_weeks, long_run_discount_pct, deep_run_threshold_weeks, deep_run_discount_pct, late_fee_daily_pct]
    output: RateCard
    side_effects: ["Prior PUBLISHED RateCard -> SUPERSEDED"]

  - method: GET
    path: "/rental-house/rate-cards"
    description: "List rate cards"
    roles: [HouseAdmin, WardrobeStaff, Accountant, RenterContact]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RateCard[]
    side_effects: []

  - method: GET
    path: "/rental-house/rate-cards/{id}"
    description: "Get one rate card"
    roles: [HouseAdmin, WardrobeStaff, Accountant, RenterContact]
    code: 200
    input: []
    output: RateCard
    side_effects: []

  # --- Items ---
  - method: POST
    path: "/rental-house/items"
    description: "Create a catalog item (period/category/size/alteration policy, replacement value, base rates)"
    roles: [HouseAdmin]
    code: 201
    input: [name, period, category, size_class, alteration_policy, replacement_value_cents, base_daily_rate_cents, base_weekly_rate_cents]
    output: Item
    side_effects: ["status=ACTIVE, serviceable_unit_count=0"]

  - method: GET
    path: "/rental-house/items"
    description: "List items; filters period/category/size_class/status; DEACCESSIONED items hidden unless include_deaccessioned=true"
    roles: [HouseAdmin, WardrobeStaff, Accountant, RenterContact]
    code: 200
    input: ["period?", "category?", "size_class?", "status?", "include_deaccessioned?", "limit?", "offset?"]
    output: Item[]
    side_effects: []

  - method: GET
    path: "/rental-house/items/{id}"
    description: "Get one item including computed serviceable_unit_count"
    roles: [HouseAdmin, WardrobeStaff, Accountant, RenterContact]
    code: 200
    input: []
    output: Item
    side_effects: []

  - method: POST
    path: "/rental-house/items/{id}/request-deaccession"
    description: "Begin deaccession: requires no HELD/CONFIRMED reservations and all units AVAILABLE/AWAITING_DISPOSAL/DISPOSED; AVAILABLE units -> AWAITING_DISPOSAL"
    roles: [HouseAdmin]
    code: 200
    input: []
    output: Item
    side_effects: ["Item ACTIVE -> DEACCESSION_PENDING; units AVAILABLE -> AWAITING_DISPOSAL"]

  - method: POST
    path: "/rental-house/items/{id}/cancel-deaccession"
    description: "Abort deaccession: item back to ACTIVE; AWAITING_DISPOSAL units back to AVAILABLE"
    roles: [HouseAdmin]
    code: 200
    input: []
    output: Item
    side_effects: ["Item DEACCESSION_PENDING -> ACTIVE; units AWAITING_DISPOSAL -> AVAILABLE"]

  - method: POST
    path: "/rental-house/items/{id}/complete-deaccession"
    description: "Finalize deaccession: all units must be AWAITING_DISPOSAL/DISPOSED; they become DISPOSED and the item becomes DEACCESSIONED"
    roles: [HouseAdmin]
    code: 200
    input: []
    output: Item
    side_effects: ["Item -> DEACCESSIONED; units AWAITING_DISPOSAL -> DISPOSED; serviceable_unit_count -> 0"]

  # --- Item units (sourcing / acquisition) ---
  - method: POST
    path: "/rental-house/items/{id}/units"
    description: "Acquire (source) one physical unit of an item; barcode must be unique house-wide; item must be ACTIVE"
    roles: [HouseAdmin]
    code: 201
    input: [barcode, condition_grade, acquisition_date, acquisition_cost_cents]
    output: ItemUnit
    side_effects: ["status=AVAILABLE; item.serviceable_unit_count += 1"]

  - method: GET
    path: "/rental-house/items/{id}/units"
    description: "List units of an item (FK reverse reachability)"
    roles: [HouseAdmin, WardrobeStaff, Accountant, RenterContact]
    code: 200
    input: ["status?", "condition_grade?", "limit?", "offset?"]
    output: ItemUnit[]
    side_effects: []

  - method: GET
    path: "/rental-house/units/{id}"
    description: "Get one unit"
    roles: [HouseAdmin, WardrobeStaff, Accountant, RenterContact]
    code: 200
    input: []
    output: ItemUnit
    side_effects: []

  # --- Productions ---
  - method: POST
    path: "/rental-house/productions"
    description: "Create a production (DRAFT); RenterContact may only create for own renter_id; date order rehearsal <= performance <= closing"
    roles: [RenterContact]
    code: 201
    input: [renter_id, title, rehearsal_start_date, performance_start_date, closing_date]
    output: Production
    side_effects: ["status=DRAFT, version=1"]

  - method: GET
    path: "/rental-house/productions"
    description: "List productions (FK reverse reachability via renter_id)"
    roles: [HouseAdmin, WardrobeStaff, Accountant, RenterContact]
    code: 200
    input: ["renter_id?", "status?", "rate_card_id?", "limit?", "offset?"]
    output: Production[]
    side_effects: []

  - method: GET
    path: "/rental-house/productions/{id}"
    description: "Get one production including computed run_weeks/long_run/return_by_date and pinned rate card"
    roles: [HouseAdmin, WardrobeStaff, Accountant, RenterContact]
    code: 200
    input: []
    output: Production
    side_effects: []

  - method: POST
    path: "/rental-house/productions/{id}/confirm"
    description: "Confirm a DRAFT production: pins the PUBLISHED rate card (id+version), computes run_weeks/long_run/return_by_date; requires renter ACTIVE and VERIFIED insurance covering return_by_date"
    roles: [RenterContact]
    code: 200
    input: []
    output: Production
    side_effects: ["status DRAFT -> CONFIRMED; rate_card_id + rate_card_version pinned; increments Production.version by 1"]

  - method: POST
    path: "/rental-house/productions/{id}/cancel"
    description: "Cancel a DRAFT/CONFIRMED production; cascades release reservations (HELD/CONFIRMED -> RELEASED) and cancel DRAFT pull lists; CONFIRMED productions with PICKING/DISPATCHED pull lists are rejected"
    roles: [RenterContact]
    code: 200
    input: []
    output: Production
    side_effects: ["status -> CANCELLED; reservation release cascade; DRAFT pull lists -> CANCELLED"]

  # --- Reservations (holds) ---
  - method: POST
    path: "/rental-house/reservations"
    description: "Place a hold: quantity of an item for a production window. OCC-guarded by expected_production_version. Renter must be ACTIVE (ERR_RENTER_SUSPENDED); production must be DRAFT or CONFIRMED; item ACTIVE; window within production bounds; aggregate capacity check per availability_for_window; quote computed (HELD, expires now+72h)"
    roles: [RenterContact]
    code: 201
    input: [production_id, item_id, quantity, window_start_date, window_end_date, expected_production_version]
    output: Reservation
    side_effects: ["status=HELD; rate_variant + quoted_charge_cents computed; hold_expires_at = now + 72h; increments Production.version by 1"]

  - method: GET
    path: "/rental-house/reservations"
    description: "List reservations (FK reverse reachability via production_id / item_id)"
    roles: [HouseAdmin, WardrobeStaff, Accountant, RenterContact]
    code: 200
    input: ["production_id?", "item_id?", "status?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []

  - method: GET
    path: "/rental-house/reservations/{id}"
    description: "Get one reservation"
    roles: [HouseAdmin, WardrobeStaff, Accountant, RenterContact]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: POST
    path: "/rental-house/reservations/{id}/confirm"
    description: "Confirm a HELD reservation: production CONFIRMED, hold unexpired, renter not on credit hold, capacity re-checked; freezes quoted_charge_cents"
    roles: [RenterContact]
    code: 200
    input: []
    output: Reservation
    side_effects: ["status HELD -> CONFIRMED; quote frozen"]

  - method: POST
    path: "/rental-house/reservations/{id}/release"
    description: "Release a HELD/CONFIRMED reservation; CONFIRMED release rejected while active pull-list lines reference it"
    roles: [RenterContact]
    code: 200
    input: []
    output: Reservation
    side_effects: ["status -> RELEASED; held quantity freed"]

  - method: POST
    path: "/rental-house/reservations/{id}/amend"
    description: "Amend quantity/window of a HELD or CONFIRMED reservation; CONFIRMED drops back to HELD (re-quote + fresh 72h hold); re-validates capacity and window bounds"
    roles: [RenterContact]
    code: 200
    input: ["quantity?", "window_start_date?", "window_end_date?"]
    output: Reservation
    side_effects: ["status CONFIRMED -> HELD (or stays HELD); quote recomputed; hold_expires_at reset"]

  # --- Pull lists ---
  - method: POST
    path: "/rental-house/pull-lists"
    description: "Create a DRAFT pull list for a CONFIRMED production; OCC-guarded by expected_production_version"
    roles: [RenterContact]
    code: 201
    input: [production_id, expected_production_version]
    output: PullList
    side_effects: ["status=DRAFT; increments Production.version by 1"]

  - method: GET
    path: "/rental-house/pull-lists"
    description: "List pull lists (FK reverse reachability via production_id)"
    roles: [HouseAdmin, WardrobeStaff, Accountant, RenterContact]
    code: 200
    input: ["production_id?", "status?", "limit?", "offset?"]
    output: PullList[]
    side_effects: []

  - method: GET
    path: "/rental-house/pull-lists/{id}"
    description: "Get one pull list"
    roles: [HouseAdmin, WardrobeStaff, Accountant, RenterContact]
    code: 200
    input: []
    output: PullList
    side_effects: []

  - method: POST
    path: "/rental-house/pull-lists/{id}/submit"
    description: "Submit a DRAFT pull list: atomically creates one PullListLine per unit of every uncovered CONFIRMED reservation and assigns units via unit_selector; any shortfall rejects the whole submit"
    roles: [WardrobeStaff]
    code: 200
    input: []
    output: PullList
    side_effects: ["status DRAFT -> PICKING; lines created (PENDING) with item_unit_id + rental_charge_cents; covered reservations -> FULFILLED; submitted_at set"]

  - method: POST
    path: "/rental-house/pull-lists/{id}/dispatch"
    description: "Dispatch a PICKING pull list: all lines must be PICKED; renter ACTIVE, not on credit hold, with VERIFIED unexpired insurance; lines -> OUT, units -> OUT"
    roles: [WardrobeStaff]
    code: 200
    input: []
    output: PullList
    side_effects: ["status PICKING -> DISPATCHED; lines PICKED -> OUT with due_back_date; units AVAILABLE -> OUT; dispatched_at set"]

  - method: POST
    path: "/rental-house/pull-lists/{id}/cancel"
    description: "Cancel a DRAFT (RenterContact) or PICKING (WardrobeStaff) pull list; PICKING cancel deletes lines, releases unit assignments, rolls FULFILLED reservations back to CONFIRMED; rejected once any line is OUT"
    roles: [RenterContact, WardrobeStaff]
    code: 200
    input: []
    output: PullList
    side_effects: ["status -> CANCELLED; lines deleted; reservations FULFILLED -> CONFIRMED"]

  # --- Pull list lines ---
  - method: GET
    path: "/rental-house/pull-list-lines"
    description: "List lines (FK reverse reachability via pull_list_id / reservation_id / item_unit_id)"
    roles: [HouseAdmin, WardrobeStaff, Accountant, RenterContact]
    code: 200
    input: ["pull_list_id?", "reservation_id?", "item_unit_id?", "status?", "limit?", "offset?"]
    output: PullListLine[]
    side_effects: []

  - method: GET
    path: "/rental-house/pull-list-lines/{id}"
    description: "Get one line"
    roles: [HouseAdmin, WardrobeStaff, Accountant, RenterContact]
    code: 200
    input: []
    output: PullListLine
    side_effects: []

  - method: POST
    path: "/rental-house/pull-list-lines/{id}/pick"
    description: "Mark a PENDING line PICKED (pull list must be PICKING)"
    roles: [WardrobeStaff]
    code: 200
    input: []
    output: PullListLine
    side_effects: ["status PENDING -> PICKED"]

  - method: POST
    path: "/rental-house/pull-list-lines/{id}/check-in"
    description: "Check in an OUT line: creates the ReturnAssessment, computes late fee, moves unit to CLEANING/REPAIR/DISPOSED per damage_severity, creates a CleaningTicket unless DESTROYED, applies approved-fitting restoration gate, and runs pull-list auto-close evaluation"
    roles: [WardrobeStaff]
    code: 200
    input: [condition_grade_after, damage_severity, restoration_complete]
    output: PullListLine
    side_effects: ["line -> RETURNED (NONE) or DAMAGED (MINOR/REPAIRABLE/DESTROYED); ReturnAssessment created; unit status transition; CleaningTicket created unless DESTROYED; APPROVED fittings -> RESTORED when restoration_complete; unit condition_grade updated; pull-list auto-close -> possible production settle cascade"]

  - method: POST
    path: "/rental-house/pull-list-lines/{id}/report-lost"
    description: "Report an OUT line lost: line -> LOST, unit -> DISPOSED, fixed 7-day-grace late fee"
    roles: [WardrobeStaff]
    code: 200
    input: []
    output: PullListLine
    side_effects: ["line -> LOST; unit OUT -> DISPOSED; serviceable_unit_count recomputed; late_fee_cents set; pull-list auto-close evaluation"]

  # --- Return assessments (1:1 per checked-in line) ---
  - method: GET
    path: "/rental-house/pull-list-lines/{id}/assessment"
    description: "Get the assessment for a line (array of 0 or 1 — FK reverse reachability)"
    roles: [HouseAdmin, WardrobeStaff, Accountant, RenterContact]
    code: 200
    input: []
    output: ReturnAssessment[]
    side_effects: []

  # --- Fitting authorizations ---
  - method: POST
    path: "/rental-house/fitting-authorizations"
    description: "Request an alteration on a line (line must be PENDING/PICKED/OUT); item alteration_policy gates: PROHIBITED rejects all, REVERSIBLE_ONLY allows only HEM/TAKE_IN/LET_OUT"
    roles: [RenterContact]
    code: 201
    input: [pull_list_line_id, alteration_type, "notes?"]
    output: FittingAuthorization
    side_effects: ["status=REQUESTED"]

  - method: GET
    path: "/rental-house/fitting-authorizations"
    description: "List fitting authorizations (FK reverse reachability via pull_list_line_id)"
    roles: [HouseAdmin, WardrobeStaff, Accountant, RenterContact]
    code: 200
    input: ["pull_list_line_id?", "status?", "limit?", "offset?"]
    output: FittingAuthorization[]
    side_effects: []

  - method: GET
    path: "/rental-house/fitting-authorizations/{id}"
    description: "Get one fitting authorization"
    roles: [HouseAdmin, WardrobeStaff, Accountant, RenterContact]
    code: 200
    input: []
    output: FittingAuthorization
    side_effects: []

  - method: POST
    path: "/rental-house/fitting-authorizations/{id}/decide"
    description: "Approve or reject a REQUESTED fitting authorization"
    roles: [HouseAdmin]
    code: 200
    input: [decision]
    output: FittingAuthorization
    side_effects: ["status REQUESTED -> APPROVED/REJECTED; decided_by_user_id set"]

  # --- Damage claims ---
  - method: POST
    path: "/rental-house/damage-claims"
    description: "Create a damage/loss claim on a line; valuation_method and assessed_value_cents computed per damage_valuation; one claim per line"
    roles: [WardrobeStaff]
    code: 201
    input: [pull_list_line_id, claim_type, "return_assessment_id?"]
    output: DamageClaim
    side_effects: ["status=DRAFT; valuation computed; created_by_user_id set"]

  - method: GET
    path: "/rental-house/damage-claims"
    description: "List claims (FK reverse reachability via return_assessment_id / pull_list_line_id)"
    roles: [HouseAdmin, WardrobeStaff, Accountant, RenterContact]
    code: 200
    input: ["return_assessment_id?", "pull_list_line_id?", "invoice_id?", "status?", "limit?", "offset?"]
    output: DamageClaim[]
    side_effects: []

  - method: GET
    path: "/rental-house/damage-claims/{id}"
    description: "Get one claim"
    roles: [HouseAdmin, WardrobeStaff, Accountant, RenterContact]
    code: 200
    input: []
    output: DamageClaim
    side_effects: []

  - method: POST
    path: "/rental-house/damage-claims/{id}/post"
    description: "Post a DRAFT or DISPUTED claim (segregation of duties: poster != creator); POSTED claims are swept by invoice generation"
    roles: [Accountant]
    code: 200
    input: []
    output: DamageClaim
    side_effects: ["status -> POSTED; posted_by_user_id set"]

  - method: POST
    path: "/rental-house/damage-claims/{id}/dispute"
    description: "Renter disputes a POSTED claim that has not been billed yet"
    roles: [RenterContact]
    code: 200
    input: []
    output: DamageClaim
    side_effects: ["status POSTED -> DISPUTED"]

  - method: POST
    path: "/rental-house/damage-claims/{id}/waive"
    description: "Waive a DRAFT or DISPUTED claim (no charge will be billed)"
    roles: [Accountant]
    code: 200
    input: []
    output: DamageClaim
    side_effects: ["status -> WAIVED"]

  # --- Cleaning tickets ---
  - method: GET
    path: "/rental-house/units/{id}/cleaning-tickets"
    description: "List cleaning tickets for a unit (FK reverse reachability)"
    roles: [HouseAdmin, WardrobeStaff, Accountant, RenterContact]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CleaningTicket[]
    side_effects: []

  - method: POST
    path: "/rental-house/cleaning-tickets/{id}/advance"
    description: "Advance a ticket one stage: QUEUED->IN_CLEANING->INSPECTION->READY, with INSPECTION->REPAIR->INSPECTION loop when requires_repair; reaching READY returns the unit to AVAILABLE"
    roles: [WardrobeStaff]
    code: 200
    input: []
    output: CleaningTicket
    side_effects: ["stage transition per CleaningTicket machine; READY sets ready_at and unit -> AVAILABLE"]

  # --- Invoices ---
  - method: POST
    path: "/rental-house/invoices/generate"
    description: "Generate an OPEN invoice sweeping the production's unbilled charges (rental for OUT/RETURNED/DAMAGED/LOST lines, late fees, cleaning fees, POSTED claims); empty sweep rejected"
    roles: [Accountant]
    code: 201
    input: [production_id]
    output: Invoice
    side_effects: ["Invoice OPEN with frozen component totals; swept lines/tickets/claims stamped invoiced"]

  - method: GET
    path: "/rental-house/invoices"
    description: "List invoices (FK reverse reachability via production_id)"
    roles: [HouseAdmin, WardrobeStaff, Accountant, RenterContact]
    code: 200
    input: ["production_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  - method: GET
    path: "/rental-house/invoices/{id}"
    description: "Get one invoice"
    roles: [HouseAdmin, WardrobeStaff, Accountant, RenterContact]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: POST
    path: "/rental-house/invoices/{id}/issue"
    description: "Issue an OPEN invoice: adds balance to renter outstanding, recomputes credit_hold, runs production settle evaluation"
    roles: [Accountant]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status OPEN -> ISSUED; renter.outstanding_balance_cents += balance; credit_hold recomputed"]

  - method: POST
    path: "/rental-house/invoices/{id}/record-payment"
    description: "Record a payment against an ISSUED/PARTIALLY_PAID invoice"
    roles: [Accountant]
    code: 200
    input: [amount_cents]
    output: Invoice
    side_effects: ["amount_paid_cents += amount_cents; -> PARTIALLY_PAID or PAID; renter outstanding + credit_hold recomputed; production settle evaluation"]

  - method: POST
    path: "/rental-house/invoices/{id}/credit-note"
    description: "Apply a credit note to an OPEN/ISSUED/PARTIALLY_PAID invoice; full-balance credit settles it (VOID from OPEN, CREDITED otherwise)"
    roles: [Accountant]
    code: 200
    input: [amount_cents, "reason?"]
    output: Invoice
    side_effects: ["credited_cents += amount_cents; total_cents reduced; renter outstanding + credit_hold recomputed; production settle evaluation"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_RENTER_SCOPE_VIOLATION, http: 403, condition: "RenterContact acting on a resource whose renter_id != X-User-ID" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, wrong type, invalid enum member, or malformed date" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource is in a state that does not permit the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_production_version does not match the current Production.version (OCC)" }
  - { id: ERR_RENTER_SUSPENDED, http: 409, condition: "Renter is SUSPENDED (or not yet ACTIVE); operation requires renter.status == ACTIVE" }
  - { id: ERR_INSURANCE_NOT_VERIFIED, http: 422, condition: "No VERIFIED certificate covers the required date (production confirm, dispatch, manual reactivation)" }
  - { id: ERR_INSUFFICIENT_COVERAGE, http: 422, condition: "Certificate coverage_cents below the renter-type minimum at verify time" }
  - { id: ERR_CERTIFICATE_EXPIRED, http: 422, condition: "Certificate expiry_date already past at verify time" }
  - { id: ERR_ALTERATION_PROHIBITED, http: 422, condition: "Item alteration_policy forbids the requested alteration_type (PROHIBITED blocks all; REVERSIBLE_ONLY allows only HEM/TAKE_IN/LET_OUT)" }
  - { id: ERR_RESTORATION_INCOMPLETE, http: 409, condition: "Check-in with an APPROVED fitting not yet restored (restoration_complete must be true)" }
  - { id: ERR_ITEM_NOT_RENTABLE, http: 409, condition: "Item status != ACTIVE (DEACCESSION_PENDING or DEACCESSIONED)" }
  - { id: ERR_ITEM_HAS_ACTIVE_HOLDS, http: 409, condition: "Deaccession requested while HELD/CONFIRMED reservations exist for the item" }
  - { id: ERR_RATE_CARD_REQUIRED, http: 409, condition: "Production confirm with no PUBLISHED rate card" }
  - { id: ERR_WINDOW_OUT_OF_BOUNDS, http: 422, condition: "Reservation window outside [rehearsal_start_date, return_by_date] or end < start" }
  - { id: ERR_DATE_ORDER, http: 422, condition: "Production dates violate rehearsal_start <= performance_start <= closing" }
  - { id: ERR_QUANTITY_INVALID, http: 400, condition: "Reservation quantity < 1" }
  - { id: ERR_HOLD_EXPIRED, http: 409, condition: "Confirm attempted after hold_expires_at" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 409, condition: "Overlapping holds + allocated lines exceed serviceable_unit_count for the item" }
  - { id: ERR_NO_UNITS_AVAILABLE, http: 409, condition: "Unit selector pool empty/short for a reservation at pull-list submit (includes cleaning-buffer conflicts); submit is atomic" }
  - { id: ERR_NOTHING_TO_PULL, http: 409, condition: "Pull-list submit with no uncovered CONFIRMED reservations" }
  - { id: ERR_LINES_NOT_PICKED, http: 409, condition: "Dispatch while any line is still PENDING" }
  - { id: ERR_RESERVATION_IN_USE, http: 409, condition: "Manual release of a CONFIRMED reservation referenced by active pull-list lines" }
  - { id: ERR_PRODUCTION_HAS_ACTIVE_PULLS, http: 409, condition: "Cancel of a CONFIRMED production with PICKING/DISPATCHED pull lists" }
  - { id: ERR_DEACCESSION_BLOCKED, http: 409, condition: "Deaccession request/complete while units are OUT, CLEANING, or REPAIR" }
  - { id: ERR_DUPLICATE_BARCODE, http: 409, condition: "Unit barcode already exists house-wide" }
  - { id: ERR_CLAIM_ALREADY_EXISTS, http: 409, condition: "A DamageClaim already exists for the line" }
  - { id: ERR_CLAIM_TYPE_MISMATCH, http: 409, condition: "claim_type DAMAGE requires line DAMAGED (+ return_assessment_id); LOSS requires line LOST" }
  - { id: ERR_CLAIM_ALREADY_BILLED, http: 409, condition: "Dispute of a claim already swept into an invoice" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "DamageClaim poster X-User-ID equals created_by_user_id (segregation of duties)" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Renter on credit hold (outstanding_balance_cents > credit_limit_cents); reservation confirm and dispatch blocked" }
  - { id: ERR_INVOICE_EMPTY, http: 409, condition: "Invoice generate with an empty sweep set, or issue of a zero-total invoice" }
  - { id: ERR_PAYMENT_INVALID, http: 422, condition: "Payment amount_cents < 1" }
  - { id: ERR_PAYMENT_EXCEEDS_BALANCE, http: 422, condition: "Payment amount_cents > balance_cents" }
  - { id: ERR_CREDIT_INVALID, http: 422, condition: "Credit-note amount_cents < 1" }
  - { id: ERR_CREDIT_EXCEEDS_BALANCE, http: 422, condition: "Credit-note amount_cents > balance_cents" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: HouseAdmin
    description: "Rental-house administrator: catalog, acquisitions, rate cards, insurance decisions, deaccession, fitting decisions, ops checkpoint, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /rental-house/renters, PATCH /rental-house/renters/{id}"
      - "POST /rental-house/insurance-certificates/{id}/decide"
      - "POST /rental-house/rate-cards"
      - "POST /rental-house/items; POST /rental-house/items/{id}/units; deaccession actions"
      - "POST /rental-house/fitting-authorizations/{id}/decide"
      - "POST /rental-house/run_daily_ops; POST /rental-house/_clock/set_current_utc"
    shared_operations:
      - "POST /rental-house/renters/{id}/insurance-certificates (shared with RenterContact)"
      - "All GET / list endpoints"

  - name: WardrobeStaff
    description: "Wardrobe/floor staff: pull-list picking, dispatch, check-in, loss reporting, damage claim creation, cleaning advancement"
    identity: opaque
    exclusive_operations:
      - "POST /rental-house/pull-lists/{id}/submit and /dispatch"
      - "POST /rental-house/pull-list-lines/{id}/pick, /check-in, /report-lost"
      - "POST /rental-house/damage-claims"
      - "POST /rental-house/cleaning-tickets/{id}/advance"
    shared_operations:
      - "POST /rental-house/pull-lists/{id}/cancel (shared with RenterContact — different from-states)"
      - "All GET / list endpoints"

  - name: RenterContact
    description: "Production-company contact; X-User-ID MUST equal the id of the Renter they act for; manages own productions, reservations, pull lists, fitting requests, claim disputes"
    identity: "entity_backed:Renter"
    exclusive_operations:
      - "POST /rental-house/productions, /confirm, /cancel (own renter_id only)"
      - "POST /rental-house/reservations and /confirm, /release, /amend (own)"
      - "POST /rental-house/pull-lists (own)"
      - "POST /rental-house/fitting-authorizations (own lines)"
      - "POST /rental-house/damage-claims/{id}/dispute (own)"
    shared_operations:
      - "POST /rental-house/renters/{id}/insurance-certificates (own renter_id; shared with HouseAdmin)"
      - "POST /rental-house/pull-lists/{id}/cancel (own, DRAFT only; shared with WardrobeStaff)"
      - "All GET / list endpoints (scoped to own renter_id where applicable)"

  - name: Accountant
    description: "House accountant: invoice lifecycle and claim posting/waiving; segregation of duties — may not post a claim they created as WardrobeStaff (same X-User-ID)"
    identity: opaque
    exclusive_operations:
      - "POST /rental-house/invoices/generate, /issue, /record-payment, /credit-note"
      - "POST /rental-house/damage-claims/{id}/post and /waive"
    shared_operations:
      - "All GET / list endpoints"
