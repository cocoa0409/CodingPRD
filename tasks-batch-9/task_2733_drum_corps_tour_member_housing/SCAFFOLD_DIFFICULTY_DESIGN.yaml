            - "TourStop.${stop_id}.meal_cost_cents == 7050 (two NONE-diet members x 3 meals x 1175)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: touching_housing_stays_allowed_while_overlapping_stay_is_rejected
        grounds:
          - validations.priority_54_ERR_MEMBER_ALREADY_HOUSED
          - calculations.housing_bed_night_capacity
          - entities.HousingAssignment.fields.nights
          - entities.FacilityAgreement.fields.occupied_bed_nights
        distinguishing_aspect: |
          Half-open interval semantics on a bed resource: [check_in, check_out) means
          a stay ending 2027-05-20 and a stay starting 2027-05-20 do NOT overlap and
          both may be ACTIVE for the same member, while shifting the second stay one
          day earlier to 2027-05-19 does overlap and is refused. The accepted
          touching pair also has to add its bed-nights exactly once, taking the
          agreement to 25 occupied bed-nights and 11250 cents.
        test_recipe:
          setup:
            - "A 2027 season, a host school with 30 spaces of capacity 12, and a SIGNED SPRING_TRAINING agreement at 450 cents/bed-night with a 0-bed minimum covering 2027-05-10 to 2027-06-05."
            - "Two adult members hold EXECUTED contracts; both are housed in space 1 for 2027-05-10 to 2027-05-20, so the agreement stands at 20 occupied bed-nights and 9000 cents."
