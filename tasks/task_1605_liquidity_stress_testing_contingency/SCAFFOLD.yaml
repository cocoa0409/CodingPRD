    roles: [TreasuryAnalyst, RiskOfficer, TreasuryOps, LiquidityCommittee]
    code: 200
    input: ["playbook_id?", "prerequisite_action_id?", "line_id?", "asset_id?", "status?", "limit?", "offset?"]
    output: PlaybookAction[]
    side_effects: []

  - method: POST
    path: "/liquidity/contingency-playbooks/{id}/capacity-test"
    description: "Run capacity_test; PASSED transitions DRAFT -> TESTED; FAILED stays DRAFT with inline failure detail"
    roles: [RiskOfficer]
    code: 200
    input: []
    output: { result: string, total_estimated_cents: integer, total_realizable_cents: integer, failures: array }
    side_effects: ["on PASSED: playbook DRAFT -> TESTED, tested_at = logical clock"]

  - method: POST
    path: "/liquidity/contingency-playbooks/{id}/approve"
    description: "Approve a TESTED playbook (SoD: approver != creator)"
    roles: [RiskOfficer]
    code: 200
    input: []
    output: ContingencyPlaybook
    side_effects: ["TESTED -> APPROVED; approved_by_user_id = X-User-ID"]

  - method: POST
