              payload: { name: "E1", purchased_seats: 5 }
              as: EnterpriseAdmin
              captures: { ent_id: $.data.id }
            - call: "POST /organizations"
              payload: { enterprise_id: "${ent_id}", login: "org1", plan_tier: "TEAM" }
              as: EnterpriseAdmin
              captures: { org_id: $.data.id }
            - call: "POST /repositories"
              payload: { organization_id: "${org_id}", name: "r1" }
              as: OrgAdmin
              captures: { repo_id: $.data.id }
            - call: "GET /organizations/${org_id}"
              as: Any
              captures: { org_v: $.data.version }
            - call: "POST /organizations/${org_id}/security-entitlements"
              payload: { repository_id: "${repo_id}", product: "SECRET_SCANNING", expected_organization_version: "${org_v}" }
              as: OrgAdmin
          trigger:
            - call: "POST /organizations/${org_id}/security-entitlements"
              payload: { repository_id: "${repo_id}", product: "CODE_SCANNING", expected_organization_version: "${org_v}" }
              as: OrgAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION   # first create bumped Organization.version past the observed ${org_v}"

      - name: occ_stale_version_on_workflow_run_dispatch
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[workflow-run-create-stale-repo]
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Dispatching a run with a repository version stale by one archive/visibility mutation is rejected with 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Enterprise + TEAM Organization + Repository; client observed repo version V before a rename bumped it"]
          setup_api_calls:
            - call: "POST /enterprises"
              payload: { name: "E1", purchased_seats: 5 }
              as: EnterpriseAdmin
              captures: { ent_id: $.data.id }
            - call: "POST /organizations"
              payload: { enterprise_id: "${ent_id}", login: "org1", plan_tier: "TEAM" }
              as: EnterpriseAdmin
              captures: { org_id: $.data.id }
            - call: "POST /repositories"
              payload: { organization_id: "${org_id}", name: "r1" }
              as: OrgAdmin
              captures: { repo_id: $.data.id, repo_v: $.data.version }
            - call: "PATCH /repositories/${repo_id}"
              payload: { name: "r1-renamed" }
              as: OrgAdmin
          trigger:
            - call: "POST /repositories/${repo_id}/workflow-runs"
              payload: { runner_kind: "HOSTED", os_type: "LINUX", requested_minutes: 5, expected_repository_version: "${repo_v}" }
              as: OrgAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION"

      - name: artifact_lazy_expiry_on_clock_sweep
        claim_type: scheduled_actions
        grounds:
          - state_machines.StorageArtifact.RETAINED_to_EXPIRED
          - "endpoints.POST /_clock/set_current_utc"
        distinguishing_aspect: "Advancing the logical clock past expires_at flips a RETAINED artifact to EXPIRED and re-credits consumed_storage_gb — verified through the artifact list after the sweep."
        test_recipe:
          setup: ["Enterprise + TEAM Organization + Repository + artifact retention_days=10 created at 2026-09-01 (expires 2026-09-11)"]
          setup_api_calls:
            - call: "POST /enterprises"
              payload: { name: "E1", purchased_seats: 5 }
              as: EnterpriseAdmin
              captures: { ent_id: $.data.id }
            - call: "POST /organizations"
              payload: { enterprise_id: "${ent_id}", login: "org1", plan_tier: "TEAM" }
              as: EnterpriseAdmin
              captures: { org_id: $.data.id }
            - call: "POST /repositories"
              payload: { organization_id: "${org_id}", name: "r1" }
              as: OrgAdmin
              captures: { repo_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: EnterpriseAdmin
            - call: "POST /repositories/${repo_id}/artifacts"
              payload: { name: "a1", size_mb: 2048, retention_days: 10 }
              as: OrgAdmin
              captures: { art_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: EnterpriseAdmin
            - call: "GET /repositories/${repo_id}/artifacts"
              as: Any
              captures: { st: "$.data[0].status" }
            - call: "GET /organizations/${org_id}"
              as: Any
              captures: { gb: $.data.consumed_storage_gb }
          assert:
            - "st == EXPIRED   # at exactly expires_at the retention window has closed (>= comparison)"
            - "gb == 0.0"

      - name: audit_stream_toggle_cycles_statuses
        claim_type: conditional_feature_flags
        grounds:
          - "endpoints.POST /enterprises/{id}/audit-log-stream/toggle"
          - entities.AuditLogEvent.fields.streamed
        distinguishing_aspect: "Toggle cycles INACTIVE → STREAMING → PAUSED → STREAMING; an event written while STREAMING has streamed=true, while one written while PAUSED has streamed=false."
        test_recipe:
          setup: ["Enterprise exists"]
          setup_api_calls:
            - call: "POST /enterprises"
              payload: { name: "E1", purchased_seats: 5 }
              as: EnterpriseAdmin
              captures: { ent_id: $.data.id }
          trigger:
            - call: "POST /enterprises/${ent_id}/audit-log-stream/toggle"
              payload: {}
              as: EnterpriseAdmin
              captures: { s1: $.data.audit_log_stream_status }
            - call: "POST /enterprises/${ent_id}/sso/transition"
              payload: { action: "CONFIGURE" }
              as: EnterpriseAdmin
            - call: "POST /enterprises/${ent_id}/audit-log-stream/toggle"
              payload: {}
              as: EnterpriseAdmin
              captures: { s2: $.data.audit_log_stream_status }
            - call: "POST /enterprises/${ent_id}/sso/transition"
              payload: { action: "SUSPEND" }
              as: EnterpriseAdmin
              captures: { err2: $.data.error_id }
            - call: "POST /enterprises/${ent_id}/audit-log-stream/toggle"
              payload: {}
              as: EnterpriseAdmin
              captures: { s3: $.data.audit_log_stream_status }
            - call: "GET /enterprises/${ent_id}/audit-log-events"
              payload: {}
              as: EnterpriseAdmin
          assert:
            - "s1 == STREAMING"
            - "s2 == PAUSED"
            - "err2 == ERR_SSO_NOT_ENFORCED   # SUSPEND requires ENFORCED; emitted while PAUSED"
            - "s3 == STREAMING   # cycle continues"
            - "event sso.configuration_started has streamed == true   # written while STREAMING"

  - section: consistency_model
    instances:
      - name: immediate_visibility_of_mutation
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "Immediate consistency: a mutation's effects are visible in a subsequent GET issued after the mutation's response — organization plan change is visible on the next read."
        test_recipe:
          setup: ["Enterprise + Organization"]
          setup_api_calls:
            - call: "POST /enterprises"
              payload: { name: "E1", purchased_seats: 5 }
              as: EnterpriseAdmin
              captures: { ent_id: $.data.id }
            - call: "POST /organizations"
              payload: { enterprise_id: "${ent_id}", login: "org1", plan_tier: "FREE" }
              as: EnterpriseAdmin
              captures: { org_id: $.data.id }
          trigger:
            - call: "GET /organizations/${org_id}"
              as: Any
              captures: { mins: $.data.included_actions_minutes, ver: $.data.version }
          assert:
            - "mins == 500   # creation side effect visible on the very next read"
            - "ver == 1"

