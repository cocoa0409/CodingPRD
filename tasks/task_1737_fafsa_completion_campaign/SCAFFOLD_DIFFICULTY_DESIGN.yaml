            - "Checklist has exactly 4 items with doc_types [STUDENT_ID, STUDENT_TAX_RETURN, PARENT_TAX_RETURN, BANK_STATEMENT], all PENDING"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: confirm_state_beats_background_safety
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_ASSIGNMENT_NOT_ACCEPTED]
          - errors[ERR_BACKGROUND_CHECK_NOT_CLEARED]
        distinguishing_aspect: |
          Category pair (state, business_safety): the confirm target is a
          CANCELLED assignment AND the staff member's background check is
          EXPIRED; priority 5 state must win over priority 6 safety.
        test_recipe:
          setup:
            - "Campaign OPEN; school ENROLLED; DRAFT event; staff initially CLEARED; assignment gone INVITED->ACCEPTED->CONFIRMED->CANCELLED; then background flipped to EXPIRED"
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 100000 }, captures: { camp: $.data.id } }
            - { call: "POST /fafsa/campaigns/${camp}/activate", as: CampaignAdmin }
            - { call: "POST /fafsa/schools", as: CampaignAdmin, payload: { campaign_id: "${camp}", name: "North HS", district_code: "D01", school_code: "SC01" }, captures: { sch: $.data.id } }
            - { call: "POST /fafsa/schools/${sch}/enroll", as: CampaignAdmin }
            - { call: "POST /fafsa/events", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", title: "E1", start_time: "2026-09-10T10:00:00Z", end_time: "2026-09-10T12:00:00Z", capacity: 10, cost_estimate_cents: 1000, required_expert_count: 0, supported_languages: [] }, captures: { ev: $.data.id } }
            - { call: "POST /fafsa/staff-profiles", as: CampaignAdmin, payload: { campaign_id: "${camp}", full_name: "Vol Vic", capabilities: ["EVENT_STAFF"], languages: ["en"] }, captures: { st: $.data.id } }
            - { call: "POST /fafsa/staff-profiles/${st}/background-check", as: CampaignAdmin, payload: { result: "CLEARED" } }
            - { call: "POST /fafsa/staff-assignments", as: SchoolCoordinator, as_user_id: "${sch}", payload: { event_id: "${ev}", staff_profile_id: "${st}", assigned_role: "VOLUNTEER" }, captures: { asg: $.data.id } }
            - { call: "POST /fafsa/staff-assignments/${asg}/accept", as: StaffMember, as_user_id: "${st}" }
            - { call: "POST /fafsa/staff-assignments/${asg}/confirm", as: SchoolCoordinator, as_user_id: "${sch}" }
            - { call: "POST /fafsa/staff-assignments/${asg}/cancel", as: SchoolCoordinator, as_user_id: "${sch}" }
            - { call: "POST /fafsa/staff-profiles/${st}/background-check", as: CampaignAdmin, payload: { result: "EXPIRED" } }
          trigger:
            - { call: "POST /fafsa/staff-assignments/${asg}/confirm", as: SchoolCoordinator, as_user_id: "${sch}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ASSIGNMENT_NOT_ACCEPTED (HTTP 409), NOT ERR_BACKGROUND_CHECK_NOT_CLEARED — state (p5) beats business_safety (p6)"

      - name: assignment_referential_beats_double_booking_temporal
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_CROSS_CAMPAIGN_REFERENCE]
          - errors[ERR_STAFF_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Category pair (business_referential, business_temporal): the create
          request references a staff profile from ANOTHER campaign AND that
          staff member is already double-booked; priority 7 referential must
          win over priority 8 temporal.
        test_recipe:
          setup:
            - "Campaigns A and B both OPEN; schoolA (campaign A) ENROLLED with eventA1 10:00-12:00; schoolB (campaign B) ENROLLED with eventB 11:00-13:00 (overlaps eventA1)"
            - "Staff X belongs to campaign A, background CLEARED, CONFIRMED on eventA1 (so the eventB request is also a temporal overlap)"
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "CA", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 100000 }, captures: { campA: $.data.id } }
            - { call: "POST /fafsa/campaigns/${campA}/activate", as: CampaignAdmin }
