              payload: { student_id: "${stu_id}" }
              as: Registrar
              captures: { pt_id: $.data.id }
            - call: "POST /placement-tests/${pt_id}/score"
              payload: { raw_score: 50 }
              as: Instructor
            - call: "POST /cohorts"
              payload: { name: "B1-Ex", level: "B1", track: "GENERAL", capacity: 5, weekly_hours: 18, term_start: "2026-05-04T00:00:00Z", term_end: "2026-08-01T00:00:00Z", total_sessions: 40, base_tuition_cents: 100000, schedule_block: "MORNING" }
              as: Registrar
