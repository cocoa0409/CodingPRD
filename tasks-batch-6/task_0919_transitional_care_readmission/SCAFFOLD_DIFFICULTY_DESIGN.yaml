            - call: "POST /tcm/payers"
              payload: { name: "Northstar Health", tcm_covered: true, tcm_rate_multiplier: 1.0, coinsurance_rate: 0.2, contact_deadline_basis: "BUSINESS_DAYS" }
              as: ProgramAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /tcm/navigators"
              payload: { full_name: "Nora Vance", active_episode_cap: 5, cap_policy: "COUNT" }
              as: ProgramAdmin
              captures: { nav0_id: $.data.id }
            - call: "POST /tcm/navigators"
              payload: { full_name: "Amir Cole", active_episode_cap: 2, cap_policy: "COUNT" }
              as: ProgramAdmin
              captures: { nava_id: $.data.id }
            - call: "POST /tcm/navigators"
              payload: { full_name: "Bea Lund", active_episode_cap: 2, cap_policy: "WEIGHTED" }
              as: ProgramAdmin
              captures: { navb_id: $.data.id }
            - call: "POST /tcm/patients"
              payload: { external_mrn: "MRN-2001", full_name: "P One", date_of_birth: "1950-01-01" }
              as: ProgramAdmin
              captures: { pat1_id: $.data.id }
            - call: "POST /tcm/patients"
              payload: { external_mrn: "MRN-2002", full_name: "P Two", date_of_birth: "1950-01-02" }
              as: ProgramAdmin
              captures: { pat2_id: $.data.id }
            - call: "POST /tcm/patients"
              payload: { external_mrn: "MRN-2003", full_name: "P Three", date_of_birth: "1950-01-03" }
              as: ProgramAdmin
              captures: { pat3_id: $.data.id }
            - call: "POST /tcm/patients"
              payload: { external_mrn: "MRN-2004", full_name: "P Four", date_of_birth: "1950-01-04" }
              as: ProgramAdmin
              captures: { pat4_id: $.data.id }
            - call: "POST /tcm/referrals"
              payload: { patient_id: "${pat1_id}", facility_id: "${fac_id}", payer_id: "${payer_id}", discharge_date: "2026-05-01", discharge_datetime: "2026-05-01T14:00:00Z", discharge_disposition: "HOME", stay_type: "INPATIENT", length_of_stay_days: 4, admission_acuity: "URGENT", comorbidity_count: 5, prior_ed_visits_6mo: 2, prior_admissions_6mo: 1, social_risk_flags_count: 3 }
              as: IntakeCoordinator
              captures: { ref1_id: $.data.id }
            - call: "POST /tcm/referrals/${ref1_id}/accept"
              payload: { navigator_id: "${nav0_id}" }
              as: IntakeCoordinator
              captures: { ep1_id: $.data.created_episode_id }
            - call: "POST /tcm/referrals"
              payload: { patient_id: "${pat2_id}", facility_id: "${fac_id}", payer_id: "${payer_id}", discharge_date: "2026-05-01", discharge_datetime: "2026-05-01T14:00:00Z", discharge_disposition: "HOME", stay_type: "INPATIENT", length_of_stay_days: 4, admission_acuity: "URGENT", comorbidity_count: 5, prior_ed_visits_6mo: 2, prior_admissions_6mo: 1, social_risk_flags_count: 3 }
              as: IntakeCoordinator
              captures: { ref2_id: $.data.id }
            - call: "POST /tcm/referrals/${ref2_id}/accept"
