            - call: "GET /traffic/orders/${order16b_id}/lines"
              payload: {}
              as: SalesRep
              captures: { line16b_id: "$.data[0].id"}
            - call: "GET /traffic/order-lines/${line16b_id}/spots"
              payload: {}
              as: TrafficManager
              captures: { s16b: "$.data[0].id"}
          trigger:
