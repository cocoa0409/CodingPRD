# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of testable claims not already
# covered by §1.8). Walks the claim-extraction-guide sections against §1.1-§1.7.
# Every setup_api_calls chain drives empty-DB -> precondition using §1.5 only.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_client_success_and_envelope
        claim_type: Creation
        grounds: [entities.Client, endpoints.POST_/clients]
        distinguishing_aspect: "POST /clients with all required fields -> 201; computed ledgers initialize to 0, is_ale=false, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /clients", payload: { legal_name: "Envelope Co", ein: "200000001", industry: "TECH", fiscal_year_end_month: 12 }, as: BenefitsConsultant, captures: { cid: "$.data.id" } }
          assert:
            - "response_type == object"
            - "Client.${cid}.employee_count == 0"
            - "Client.${cid}.is_ale == false"
            - "Client.${cid}.active_premium_total_cents == 0"
            - "Client.${cid}.enrolled_headcount == 0"
            - "Client.${cid}.ytd_commission_cents == 0"
            - "Client.${cid}.version == 1"

      - name: get_client_not_found
        claim_type: Not Found
        grounds: [entities.Client, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /clients/{unknown-uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /clients/00000000-0000-0000-0000-000000000000", payload: {}, as: BenefitsConsultant, captures: { err: "$.data.error_id" } }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_client_missing_required_field_rejected
        claim_type: Required Fields
        grounds: [entities.Client.fields.ein, "errors[ERR_INVALID_FIELD]"]
        distinguishing_aspect: "POST /clients omitting the required ein -> ERR_INVALID_FIELD (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /clients", payload: { legal_name: "No EIN Co", industry: "TECH", fiscal_year_end_month: 12 }, as: BenefitsConsultant, captures: { err: "$.data.error_id" } }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_FIELD"

      - name: create_client_duplicate_ein_rejected
        claim_type: Type Constraints
        grounds: [entities.Client.fields.ein, "errors[ERR_DUPLICATE_EIN]"]
        distinguishing_aspect: "A second POST /clients reusing an existing EIN -> ERR_DUPLICATE_EIN (409)."
        test_recipe:
          setup: ["Empty DB; one client with ein 200000002."]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "First Co", ein: "200000002", industry: "TECH", fiscal_year_end_month: 12 }, as: BenefitsConsultant }
          trigger:
            - { call: "POST /clients", payload: { legal_name: "Dup Co", ein: "200000002", industry: "RETAIL", fiscal_year_end_month: 6 }, as: BenefitsConsultant, captures: { err: "$.data.error_id" } }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_DUPLICATE_EIN"

      - name: census_system_field_input_ignored
        claim_type: System Fields
        grounds: [entities.CensusMember.fields.status]
        distinguishing_aspect: "Client-supplied status in the POST /census-members body is ignored; the server sets status=ACTIVE."
        test_recipe:
          setup: ["Empty DB; one client."]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Ignore Co", ein: "200000003", industry: "TECH", fiscal_year_end_month: 12 }, as: BenefitsConsultant, captures: { cid: "$.data.id" } }
          trigger:
            - { call: "POST /census-members", payload: { client_id: "${cid}", full_name: "New Hire", birth_date: "1992-02-02", annual_salary_cents: 4000000, monthly_contribution_cents: 15000, employment_type: "FULL_TIME" }, as: BenefitsConsultant, captures: { mid: "$.data.id" } }
          assert:
            - "CensusMember.${mid}.status == ACTIVE"

      - name: fte_and_ale_computed_below_threshold
        claim_type: Computed Fields
        grounds: [calculations.fte_and_ale, entities.Client.fields.is_ale, entities.Client.fields.full_time_equivalent_count]
        distinguishing_aspect: "With 2 ACTIVE FULL_TIME members employee_count=2, full_time_equivalent_count=2, is_ale=false (2 < ALE_THRESHOLD 50)."
        test_recipe:
          setup: ["Empty DB; a client with two ACTIVE FULL_TIME members."]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Small Co", ein: "200000004", industry: "RETAIL", fiscal_year_end_month: 12 }, as: BenefitsConsultant, captures: { cid: "$.data.id" } }
            - { call: "POST /census-members", payload: { client_id: "${cid}", full_name: "A", birth_date: "1990-01-01", annual_salary_cents: 4000000, monthly_contribution_cents: 15000, employment_type: "FULL_TIME" }, as: BenefitsConsultant }
          trigger:
            - { call: "POST /census-members", payload: { client_id: "${cid}", full_name: "B", birth_date: "1991-01-01", annual_salary_cents: 4000000, monthly_contribution_cents: 15000, employment_type: "FULL_TIME" }, as: BenefitsConsultant }
          assert:
            - "Client.${cid}.employee_count == 2"
            - "Client.${cid}.full_time_equivalent_count == 2"
            - "Client.${cid}.is_ale == false"

      - name: affordability_both_variants
        claim_type: Computed Fields
        grounds: [calculations.aca_affordability, entities.CensusMember.fields.affordable_rate_of_pay]
        excluded_because:
          difficulty_instance: dual_variant_calc / affordability_rate_of_pay_vs_fpl_on_census_member
          rationale: "The affordability computed fields are asserted by the named §1.8 dual-variant instance."

  # ===========================================================================
  - section: state_machines
    instances:
      - name: terminate_bound_policy_invalid_state_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.Policy.ACTIVE_to_TERMINATED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /policies/{id}/terminate on a BOUND (not yet ACTIVE) policy -> ERR_INVALID_STATE; no ledger change."
        test_recipe:
          setup: ["Empty DB; a BOUND policy (not activated)."]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Bound Co", ein: "200000005", industry: "TECH", fiscal_year_end_month: 12 }, as: BenefitsConsultant, captures: { cid: "$.data.id" } }
            - { call: "POST /campaigns", payload: { client_id: "${cid}", coverage_line: "MEDICAL", target_effective_date: "2026-01-01" }, as: BenefitsConsultant, captures: { camp: "$.data.id" } }
            - { call: "POST /campaigns/${camp}/open", payload: {}, as: BenefitsConsultant }
            - { call: "POST /quotes", payload: { campaign_id: "${camp}", carrier_name: "Acme Health", monthly_premium_cents: 500000, commission_rate_pct: 0.04 }, as: CarrierRep, captures: { q: "$.data.id" } }
            - { call: "POST /quotes/${q}/select", payload: {}, as: BenefitsConsultant }
            - { call: "POST /policies", payload: { client_id: "${cid}", quote_id: "${q}", effective_date: "2026-01-01", expiration_date: "2026-12-31" }, as: BenefitsConsultant, captures: { pol: "$.data.id" } }
          trigger:
            - { call: "POST /policies/${pol}/terminate", payload: {}, as: BenefitsConsultant, captures: { err: "$.data.error_id" } }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"

      - name: filing_terminal_lockdown_after_file
        claim_type: Terminal State Lockdown
        grounds: [state_machines.ComplianceFiling.CERTIFIED_to_FILED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "After a filing reaches FILED, POST /filings/{id}/file again -> ERR_INVALID_STATE (terminal lockdown)."
        test_recipe:
          setup: ["Empty DB; a client with one ACTIVE policy; a filing prepared by officer-a, certified by officer-b, filed on time -> FILED."]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Filed Co", ein: "200000006", industry: "HEALTHCARE", fiscal_year_end_month: 12 }, as: BenefitsConsultant, captures: { cid: "$.data.id" } }
            - { call: "POST /campaigns", payload: { client_id: "${cid}", coverage_line: "MEDICAL", target_effective_date: "2026-01-01" }, as: BenefitsConsultant, captures: { camp: "$.data.id" } }
            - { call: "POST /campaigns/${camp}/open", payload: {}, as: BenefitsConsultant }
            - { call: "POST /quotes", payload: { campaign_id: "${camp}", carrier_name: "Acme Health", monthly_premium_cents: 500000, commission_rate_pct: 0.04 }, as: CarrierRep, captures: { q: "$.data.id" } }
            - { call: "POST /quotes/${q}/select", payload: {}, as: BenefitsConsultant }
            - { call: "POST /policies", payload: { client_id: "${cid}", quote_id: "${q}", effective_date: "2026-01-01", expiration_date: "2026-12-31" }, as: BenefitsConsultant, captures: { pol: "$.data.id" } }
            - { call: "POST /policies/${pol}/activate", payload: {}, as: BenefitsConsultant }
            - { call: "POST /filings", payload: { client_id: "${cid}", filing_type: "FORM_5500", plan_year: 2026, due_date: "2027-07-31T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "officer-a", captures: { fil: "$.data.id" } }
            - { call: "POST /filings/${fil}/prepare", payload: {}, as: ComplianceOfficer, as_user_id: "officer-a" }
            - { call: "POST /filings/${fil}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "officer-b" }
            - { call: "POST /filings/${fil}/file", payload: {}, as: ComplianceOfficer, as_user_id: "officer-b" }
          trigger:
            - { call: "POST /filings/${fil}/file", payload: {}, as: ComplianceOfficer, as_user_id: "officer-b", captures: { err: "$.data.error_id" } }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"

      - name: filing_file_late_sets_late_status
        claim_type: Valid Transition
        grounds: [state_machines.ComplianceFiling.CERTIFIED_to_LATE, entities.ComplianceFiling.fields.status]
        distinguishing_aspect: "Filing a CERTIFIED filing when the logical clock (default 2026-07-01) is past due_date 2026-06-01 -> status LATE (the divergent clock branch)."
        test_recipe:
          setup: ["Empty DB; client with ACTIVE policy; filing due 2026-06-01 prepared by officer-a, certified by officer-b; clock at default 2026-07-01 (past due)."]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Late Co", ein: "200000007", industry: "HEALTHCARE", fiscal_year_end_month: 12 }, as: BenefitsConsultant, captures: { cid: "$.data.id" } }
            - { call: "POST /campaigns", payload: { client_id: "${cid}", coverage_line: "MEDICAL", target_effective_date: "2026-01-01" }, as: BenefitsConsultant, captures: { camp: "$.data.id" } }
            - { call: "POST /campaigns/${camp}/open", payload: {}, as: BenefitsConsultant }
            - { call: "POST /quotes", payload: { campaign_id: "${camp}", carrier_name: "Acme Health", monthly_premium_cents: 500000, commission_rate_pct: 0.04 }, as: CarrierRep, captures: { q: "$.data.id" } }
            - { call: "POST /quotes/${q}/select", payload: {}, as: BenefitsConsultant }
            - { call: "POST /policies", payload: { client_id: "${cid}", quote_id: "${q}", effective_date: "2026-01-01", expiration_date: "2026-12-31" }, as: BenefitsConsultant, captures: { pol: "$.data.id" } }
            - { call: "POST /policies/${pol}/activate", payload: {}, as: BenefitsConsultant }
            - { call: "POST /filings", payload: { client_id: "${cid}", filing_type: "ERISA_SPD", plan_year: 2025, due_date: "2026-06-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "officer-a", captures: { fil: "$.data.id" } }
            - { call: "POST /filings/${fil}/prepare", payload: {}, as: ComplianceOfficer, as_user_id: "officer-a" }
            - { call: "POST /filings/${fil}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "officer-b" }
          trigger:
            - { call: "POST /filings/${fil}/file", payload: {}, as: ComplianceOfficer, as_user_id: "officer-b" }
          assert:
            - "ComplianceFiling.${fil}.status == LATE"

      - name: quote_select_cascade_closes_campaign_declines_siblings
        claim_type: Side Effect Execution
        grounds: [state_machines.CarrierQuote.SUBMITTED_to_SELECTED, state_machines.CarrierQuote.SUBMITTED_to_DECLINED, state_machines.MarketingCampaign.OPEN_to_CLOSED]
        distinguishing_aspect: "Selecting one quote sets it SELECTED, closes the campaign, and declines every sibling SUBMITTED quote."
        test_recipe:
          setup: ["Empty DB; an OPEN campaign with two SUBMITTED quotes."]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Cascade Co", ein: "200000008", industry: "TECH", fiscal_year_end_month: 12 }, as: BenefitsConsultant, captures: { cid: "$.data.id" } }
            - { call: "POST /campaigns", payload: { client_id: "${cid}", coverage_line: "VISION", target_effective_date: "2026-01-01" }, as: BenefitsConsultant, captures: { camp: "$.data.id" } }
            - { call: "POST /campaigns/${camp}/open", payload: {}, as: BenefitsConsultant }
            - { call: "POST /quotes", payload: { campaign_id: "${camp}", carrier_name: "Vision A", monthly_premium_cents: 200000, commission_rate_pct: 0.03 }, as: CarrierRep, captures: { q1: "$.data.id" } }
            - { call: "POST /quotes", payload: { campaign_id: "${camp}", carrier_name: "Vision B", monthly_premium_cents: 210000, commission_rate_pct: 0.03 }, as: CarrierRep, captures: { q2: "$.data.id" } }
          trigger:
            - { call: "POST /quotes/${q1}/select", payload: {}, as: BenefitsConsultant }
          assert:
            - "CarrierQuote.${q1}.status == SELECTED"
            - "CarrierQuote.${q2}.status == DECLINED"
            - "MarketingCampaign.${camp}.status == CLOSED"

      - name: renewal_decline_leaves_policy_premium_unchanged
        claim_type: Compensation
        grounds: [state_machines.Renewal.OPEN_to_DECLINED, entities.Policy.fields.monthly_premium_cents, entities.Policy.fields.renewal_status]
        distinguishing_aspect: "Declining a renewal leaves Policy.monthly_premium_cents unchanged (1000000) and resets renewal_status to NONE — no drift."
        test_recipe:
          setup: ["Empty DB; ACTIVE policy (premium 1000000); OPEN renewal initial_offer 900000."]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Decline Co", ein: "200000009", industry: "TECH", fiscal_year_end_month: 12 }, as: BenefitsConsultant, captures: { cid: "$.data.id" } }
            - { call: "POST /campaigns", payload: { client_id: "${cid}", coverage_line: "MEDICAL", target_effective_date: "2026-01-01" }, as: BenefitsConsultant, captures: { camp: "$.data.id" } }
            - { call: "POST /campaigns/${camp}/open", payload: {}, as: BenefitsConsultant }
            - { call: "POST /quotes", payload: { campaign_id: "${camp}", carrier_name: "Acme Health", monthly_premium_cents: 1000000, commission_rate_pct: 0.04 }, as: CarrierRep, captures: { q: "$.data.id" } }
            - { call: "POST /quotes/${q}/select", payload: {}, as: BenefitsConsultant }
            - { call: "POST /policies", payload: { client_id: "${cid}", quote_id: "${q}", effective_date: "2026-01-01", expiration_date: "2026-12-31" }, as: BenefitsConsultant, captures: { pol: "$.data.id" } }
            - { call: "POST /policies/${pol}/activate", payload: {}, as: BenefitsConsultant, captures: { pv: "$.data.version" } }
            - { call: "POST /renewals", payload: { policy_id: "${pol}", expected_policy_version: "${pv}", initial_offer_premium_cents: 900000 }, as: BenefitsConsultant, captures: { ren: "$.data.id" } }
          trigger:
            - { call: "POST /renewals/${ren}/settle", payload: { action: "DECLINE" }, as: BenefitsConsultant }
          assert:
            - "Renewal.${ren}.status == DECLINED"
            - "Policy.${pol}.monthly_premium_cents == 1000000"
            - "Policy.${pol}.renewal_status == NONE"

      - name: certify_segregation_of_duties_conflict
        claim_type: Precondition Enforcement
        grounds: [state_machines.ComplianceFiling.PREPARED_to_CERTIFIED, "errors[ERR_SEGREGATION_OF_DUTIES]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / safety_beats_referential_on_certify
          rationale: "ERR_SEGREGATION_OF_DUTIES is asserted as the winning error of the named §1.8 instance."

  # ===========================================================================
  - section: validations
    instances:
      - name: bind_policy_expiration_before_effective_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=14]", "errors[ERR_INVALID_FIELD]"]
        distinguishing_aspect: "POST /policies with expiration_date <= effective_date -> ERR_INVALID_FIELD (422)."
        test_recipe:
          setup: ["Empty DB; a SELECTED MEDICAL quote."]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "BadDate Co", ein: "200000010", industry: "TECH", fiscal_year_end_month: 12 }, as: BenefitsConsultant, captures: { cid: "$.data.id" } }
            - { call: "POST /campaigns", payload: { client_id: "${cid}", coverage_line: "MEDICAL", target_effective_date: "2026-01-01" }, as: BenefitsConsultant, captures: { camp: "$.data.id" } }
            - { call: "POST /campaigns/${camp}/open", payload: {}, as: BenefitsConsultant }
            - { call: "POST /quotes", payload: { campaign_id: "${camp}", carrier_name: "Acme Health", monthly_premium_cents: 500000, commission_rate_pct: 0.04 }, as: CarrierRep, captures: { q: "$.data.id" } }
            - { call: "POST /quotes/${q}/select", payload: {}, as: BenefitsConsultant }
          trigger:
            - { call: "POST /policies", payload: { client_id: "${cid}", quote_id: "${q}", effective_date: "2026-12-31", expiration_date: "2026-01-01" }, as: BenefitsConsultant, captures: { err: "$.data.error_id" } }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_FIELD"

      - name: bind_policy_quote_not_selected_rejected
        claim_type: Cross-entity validation
        grounds: ["validations[priority=9]", "errors[ERR_QUOTE_NOT_SELECTED]"]
        distinguishing_aspect: "POST /policies referencing a still-SUBMITTED (not SELECTED) quote -> ERR_QUOTE_NOT_SELECTED (409)."
        test_recipe:
          setup: ["Empty DB; an OPEN campaign with one SUBMITTED (not selected) quote."]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Unsel Co", ein: "200000011", industry: "TECH", fiscal_year_end_month: 12 }, as: BenefitsConsultant, captures: { cid: "$.data.id" } }
            - { call: "POST /campaigns", payload: { client_id: "${cid}", coverage_line: "MEDICAL", target_effective_date: "2026-01-01" }, as: BenefitsConsultant, captures: { camp: "$.data.id" } }
            - { call: "POST /campaigns/${camp}/open", payload: {}, as: BenefitsConsultant }
            - { call: "POST /quotes", payload: { campaign_id: "${camp}", carrier_name: "Acme Health", monthly_premium_cents: 500000, commission_rate_pct: 0.04 }, as: CarrierRep, captures: { q: "$.data.id" } }
          trigger:
            - { call: "POST /policies", payload: { client_id: "${cid}", quote_id: "${q}", effective_date: "2026-01-01", expiration_date: "2026-12-31" }, as: BenefitsConsultant, captures: { err: "$.data.error_id" } }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_QUOTE_NOT_SELECTED"

      - name: election_cross_client_policy_rejected
        claim_type: Cross-entity validation
        grounds: ["validations[priority=10]", "errors[ERR_CLIENT_MISMATCH]"]
        distinguishing_aspect: "An Election whose policy_id belongs to a different client than its window -> ERR_CLIENT_MISMATCH (409)."
        test_recipe:
          setup: ["Empty DB; client X with an OPEN window and a member; client Y with an ACTIVE policy. Election is attempted for X's window/member but Y's policy."]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "ClientX", ein: "200000012", industry: "TECH", fiscal_year_end_month: 12 }, as: BenefitsConsultant, captures: { cx: "$.data.id" } }
            - { call: "POST /clients", payload: { legal_name: "ClientY", ein: "200000013", industry: "TECH", fiscal_year_end_month: 12 }, as: BenefitsConsultant, captures: { cy: "$.data.id" } }
            - { call: "POST /campaigns", payload: { client_id: "${cy}", coverage_line: "MEDICAL", target_effective_date: "2026-01-01" }, as: BenefitsConsultant, captures: { campy: "$.data.id" } }
            - { call: "POST /campaigns/${campy}/open", payload: {}, as: BenefitsConsultant }
            - { call: "POST /quotes", payload: { campaign_id: "${campy}", carrier_name: "Acme Health", monthly_premium_cents: 500000, commission_rate_pct: 0.04 }, as: CarrierRep, captures: { qy: "$.data.id" } }
            - { call: "POST /quotes/${qy}/select", payload: {}, as: BenefitsConsultant }
            - { call: "POST /policies", payload: { client_id: "${cy}", quote_id: "${qy}", effective_date: "2026-01-01", expiration_date: "2026-12-31" }, as: BenefitsConsultant, captures: { poly: "$.data.id" } }
            - { call: "POST /policies/${poly}/activate", payload: {}, as: BenefitsConsultant }
            - { call: "POST /enrollment-windows", payload: { client_id: "${cx}", plan_year: 2026, opens_at: "2026-07-01T00:00:00Z", closes_at: "2026-07-31T00:00:00Z" }, as: BenefitsConsultant, captures: { winx: "$.data.id" } }
            - { call: "POST /enrollment-windows/${winx}/open", payload: {}, as: BenefitsConsultant }
            - { call: "POST /census-members", payload: { client_id: "${cx}", full_name: "X Member", birth_date: "1990-01-01", annual_salary_cents: 5000000, monthly_contribution_cents: 20000, employment_type: "FULL_TIME" }, as: BenefitsConsultant, captures: { mx: "$.data.id" } }
          trigger:
            - { call: "POST /elections", payload: { window_id: "${winx}", census_member_id: "${mx}", policy_id: "${poly}", coverage_tier: "EMPLOYEE_ONLY" }, as: ClientContact, as_user_id: "${cx}", captures: { err: "$.data.error_id" } }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_CLIENT_MISMATCH"

      - name: open_window_before_opens_at_rejected
        claim_type: Temporal validation
        grounds: ["validations[priority=13]", "errors[ERR_WINDOW_NOT_YET_OPEN]", state_machines.EnrollmentWindow.SCHEDULED_to_OPEN]
        distinguishing_aspect: "Opening a window whose opens_at (2026-09-01) is after the clock (default 2026-07-01) -> ERR_WINDOW_NOT_YET_OPEN (409)."
        test_recipe:
          setup: ["Empty DB; a SCHEDULED window opening 2026-09-01; clock at default 2026-07-01."]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Future Co", ein: "200000014", industry: "TECH", fiscal_year_end_month: 12 }, as: BenefitsConsultant, captures: { cid: "$.data.id" } }
            - { call: "POST /enrollment-windows", payload: { client_id: "${cid}", plan_year: 2026, opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-30T00:00:00Z" }, as: BenefitsConsultant, captures: { win: "$.data.id" } }
          trigger:
            - { call: "POST /enrollment-windows/${win}/open", payload: {}, as: BenefitsConsultant, captures: { err: "$.data.error_id" } }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_WINDOW_NOT_YET_OPEN"

      - name: finalize_window_before_closes_at_rejected
        claim_type: Temporal validation
        grounds: ["validations[priority=13]", "errors[ERR_WINDOW_NOT_CLOSED]", state_machines.EnrollmentWindow.OPEN_to_FINALIZED]
        distinguishing_aspect: "Finalizing an OPEN window before the clock reaches closes_at (2026-07-31, clock 2026-07-01) -> ERR_WINDOW_NOT_CLOSED (409)."
        test_recipe:
          setup: ["Empty DB; an OPEN window closing 2026-07-31; clock at default 2026-07-01."]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Early Fin Co", ein: "200000015", industry: "TECH", fiscal_year_end_month: 12 }, as: BenefitsConsultant, captures: { cid: "$.data.id" } }
            - { call: "POST /enrollment-windows", payload: { client_id: "${cid}", plan_year: 2026, opens_at: "2026-07-01T00:00:00Z", closes_at: "2026-07-31T00:00:00Z" }, as: BenefitsConsultant, captures: { win: "$.data.id" } }
            - { call: "POST /enrollment-windows/${win}/open", payload: {}, as: BenefitsConsultant }
          trigger:
            - { call: "POST /enrollment-windows/${win}/finalize", payload: {}, as: BenefitsConsultant, captures: { err: "$.data.error_id" } }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_WINDOW_NOT_CLOSED"

      - name: renewal_accept_below_floor_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=15]", "errors[ERR_PREMIUM_BELOW_FLOOR]", state_machines.Renewal.OPEN_to_AGREED]
        distinguishing_aspect: "Accepting an OPEN renewal whose current offer 400000 is below the floor round(0.5*1000000)=500000 -> ERR_PREMIUM_BELOW_FLOOR (409) (valid state, fiscal check fires alone)."
        test_recipe:
          setup: ["Empty DB; ACTIVE policy (original 1000000, floor 500000); OPEN renewal initial_offer 400000 (below floor)."]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Floor Co", ein: "200000016", industry: "TECH", fiscal_year_end_month: 12 }, as: BenefitsConsultant, captures: { cid: "$.data.id" } }
            - { call: "POST /campaigns", payload: { client_id: "${cid}", coverage_line: "MEDICAL", target_effective_date: "2026-01-01" }, as: BenefitsConsultant, captures: { camp: "$.data.id" } }
            - { call: "POST /campaigns/${camp}/open", payload: {}, as: BenefitsConsultant }
            - { call: "POST /quotes", payload: { campaign_id: "${camp}", carrier_name: "Acme Health", monthly_premium_cents: 1000000, commission_rate_pct: 0.04 }, as: CarrierRep, captures: { q: "$.data.id" } }
            - { call: "POST /quotes/${q}/select", payload: {}, as: BenefitsConsultant }
            - { call: "POST /policies", payload: { client_id: "${cid}", quote_id: "${q}", effective_date: "2026-01-01", expiration_date: "2026-12-31" }, as: BenefitsConsultant, captures: { pol: "$.data.id" } }
            - { call: "POST /policies/${pol}/activate", payload: {}, as: BenefitsConsultant, captures: { pv: "$.data.version" } }
            - { call: "POST /renewals", payload: { policy_id: "${pol}", expected_policy_version: "${pv}", initial_offer_premium_cents: 400000 }, as: BenefitsConsultant, captures: { ren: "$.data.id" } }
          trigger:
            - { call: "POST /renewals/${ren}/settle", payload: { action: "ACCEPT" }, as: BenefitsConsultant, captures: { err: "$.data.error_id" } }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_PREMIUM_BELOW_FLOOR"

