              as: TreasuryImplementer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == 'ERR_INVALID_REQUEST'  # overlapping same-priority schedule on same pattern rejected"

      - name: image_retention_window_vs_request_time
        grounds:
          - entities.ImageRetrievalRequest.fields.retention_expires_at
