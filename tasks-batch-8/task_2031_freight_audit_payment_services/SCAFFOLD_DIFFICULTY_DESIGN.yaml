              as: FapAdmin
              captures: { cl: $.data.id }
            - { call: "POST /fap/clients/${cl}/activate", payload: {}, as: FapAdmin }
            - call: "POST /fap/clients/${cl}/carriers"
              payload: { scac_code: "CARR", legal_name: "Carrier One", country: "US", billing_currency: "USD", remit_email: "r@c.example" }
              as: FapAdmin
              captures: { ca: $.data.id }
            - { call: "POST /fap/carriers/${ca}/approve_onboard", payload: {}, as: FapAdmin }
            - call: "POST /fap/carriers/${ca}/rate-contracts"
              payload:
                name: "C1"
                currency: "USD"
                lanes:
                  - { origin_country: "US", dest_country: "CA", mode: "LTL", weight_breaks: [ { min_kg: 0, rate_per_kg_minor: 150 } ], fuel_surcharge_pct_bp: 1000, accessorials: [ { code: "LIFTGATE", flat_minor: 5000, cap_pct_bp: 2000 } ], minimum_charge_minor: 20000 }
                effective_from: "2026-08-01"
                effective_to: "2026-12-31"
              as: FapAdmin
              captures: { rc: $.data.id, rc_v: $.data.version }
            - { call: "POST /fap/rate-contracts/${rc}/activate", payload: { expected_rate_contract_version: "${rc_v}" }, as: FapAdmin }
            - call: "POST /fap/clients/${cl}/shipments"
              payload: { carrier_id: "${ca}", pro_number: "PRO-1001", ship_date: "2026-08-02", origin_country: "US", dest_country: "CA", mode: "LTL", actual_weight_kg: 500, accessorials_rendered: ["LIFTGATE"] }
              as: AuditAnalyst
              captures: { sh: $.data.id }
            - call: "POST /fap/clients/${cl}/invoices"
              payload: { carrier_id: "${ca}", shipment_id: "${sh}", invoice_number: "INV-0001", invoice_date: "2026-08-03", currency: "USD", billed_total_minor: 87500, lines: [ { charge_code: "BASE_FREIGHT", billed_amount_minor: 75000 }, { charge_code: "FUEL_SURCHARGE", billed_amount_minor: 7500 }, { charge_code: "LIFTGATE", billed_amount_minor: 5000 } ] }
              as: AuditAnalyst
              captures: { inv: $.data.id }
            - { call: "POST /fap/invoices/${inv}/capture", payload: {}, as: AuditAnalyst }
            - { call: "POST /fap/invoices/${inv}/rate", payload: {}, as: AuditAnalyst }
            - { call: "POST /fap/invoices/${inv}/finalize_audit", payload: {}, as: AuditAnalyst }
            - call: "GET /fap/invoices/${inv}/lines"
              payload: {}
              as: FinanceController
              captures: { line: "$.data[0].id" }
            - call: "POST /fap/clients/${cl}/gl-accounts"
              payload: { code: "4000", business_unit: "BU-NORTH", country: "US" }
              as: FinanceController
              captures: { gl1: $.data.id }
            - call: "POST /fap/clients/${cl}/gl-accounts"
              payload: { code: "4100", business_unit: "BU-SOUTH", country: "US" }
              as: FinanceController
              captures: { gl2: $.data.id }
            - call: "POST /fap/clients/${cl}/gl-accounts"
              payload: { code: "4200", business_unit: "BU-WEST", country: "US" }
              as: FinanceController
              captures: { gl3: $.data.id }
            - call: "POST /fap/invoice-lines/${line}/allocations"
              payload: { allocations: [ { gl_account_id: "${gl1}", percentage_bp: 5000 }, { gl_account_id: "${gl2}", percentage_bp: 5000 } ] }
              as: FinanceController
          trigger:
            - call: "GET /fap/invoice-lines/${line}/allocations"
              payload: {}
              as: FinanceController
              captures: { a1: "$.data[0].allocated_minor", a2: "$.data[1].allocated_minor" }
            - { call: "POST /fap/invoice-lines/${line}/allocations", payload: { allocations: [ { gl_account_id: "${gl1}", percentage_bp: 3333 }, { gl_account_id: "${gl2}", percentage_bp: 3333 }, { gl_account_id: "${gl3}", percentage_bp: 3334 } ] }, as: FinanceController }
            - call: "GET /fap/invoice-lines/${line}/allocations"
              payload: {}
              as: FinanceController
              captures: { b1: "$.data[0].allocated_minor", b2: "$.data[1].allocated_minor", b3: "$.data[2].allocated_minor" }
          assert:
            - "First set conserves: 37500 + 37500 == 75000 (sum(allocated) == line amount, sum(bp) == 10000)"
            - "Replace recomputes from scratch: 24998 + 24998 + 25004 == 75000 — no drift across replace"
            - "Remainder rule: round_half_up(75000*0.3333) = 24998 twice; largest-share row (3334bp) absorbs delta -1: 25005 - 1 = 25004"
