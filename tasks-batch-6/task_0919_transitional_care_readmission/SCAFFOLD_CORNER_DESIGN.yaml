scaffold_corner_design:
  - section: entities
    instances:
      - name: create_patient_returns_201_with_all_declared_fields
        claim_type: creation
        grounds:
          - "entities.Patient"
          - "endpoints.POST_/tcm/patients"
        distinguishing_aspect: "A patient created with the four input fields returns 201 and exposes id, created_at, updated_at, version 1 and the three counters at 0."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T16:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /tcm/patients"
              payload: { external_mrn: "MRN-E101", full_name: "Ana Beck", date_of_birth: "1950-01-01", primary_language: "PT" }
              as: ProgramAdmin
              captures: { pat_id: $.data.id }
          assert:
            - "HTTP 201; Patient.${pat_id}.external_mrn == MRN-E101, full_name == Ana Beck, date_of_birth == 1950-01-01, primary_language == PT"
            - "Patient.${pat_id}.open_episode_count == 0, lifetime_episode_count == 0, lifetime_readmission_count == 0"
            - "Patient.${pat_id}.version == 1 and id is a UUID with no type prefix"
            - "The response envelope carries meta.api_request_id, meta.api_request_timestamp and response_type object"

      - name: patient_primary_language_defaults_to_en_when_omitted
        claim_type: defaults
        grounds:
          - "entities.Patient.fields.primary_language"
        distinguishing_aspect: "Omitting primary_language stores the declared default EN rather than null."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T16:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /tcm/patients"
              payload: { external_mrn: "MRN-E102", full_name: "Bo Chen", date_of_birth: "1951-02-02" }
              as: ProgramAdmin
              captures: { pat_id: $.data.id }
          assert:
            - "Patient.${pat_id}.primary_language == EN"

      - name: payer_and_navigator_defaults_applied_when_omitted
        claim_type: defaults
        grounds:
          - "entities.Payer.fields.tcm_rate_multiplier"
          - "entities.Payer.fields.coinsurance_rate"
          - "entities.Payer.fields.contact_deadline_basis"
          - "entities.Navigator.fields.active_episode_cap"
          - "entities.Navigator.fields.cap_policy"
        distinguishing_aspect: "A payer created with only name and tcm_covered defaults to multiplier 1.0, coinsurance 0.2 and BUSINESS_DAYS; a navigator created with only full_name defaults to cap 5 and COUNT."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T16:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /tcm/payers"
              payload: { name: "Bare Plan", tcm_covered: true }
              as: ProgramAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /tcm/navigators"
              payload: { full_name: "Bare Nav" }
              as: ProgramAdmin
              captures: { nav_id: $.data.id }
          assert:
            - "Payer.${payer_id}.tcm_rate_multiplier == 1.0, coinsurance_rate == 0.2, contact_deadline_basis == BUSINESS_DAYS"
            - "Navigator.${nav_id}.active_episode_cap == 5, cap_policy == COUNT, active_episode_count == 0, workload_score == 0, availability_status == AVAILABLE"

      - name: episode_computed_fields_ignore_client_supplied_values
        claim_type: computed_fields
        grounds:
          - "entities.CareEpisode.fields.risk_score"
          - "entities.CareEpisode.fields.status"
          - "endpoints.POST_/tcm/referrals/{referral_id}/accept"
        distinguishing_aspect: "The accept endpoint's only body field is navigator_id; risk_score, risk_tier, status, contact_deadline_at and both period bounds are all server-derived and cannot be supplied."
        test_recipe:
          setup: ["A RECEIVED HIGH-tier referral for a patient with no open episode."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T16:00:00Z" }
              as: ProgramAdmin
            - call: "POST /tcm/facilities"
              payload: { name: "Mercy General", facility_type: "ACUTE_HOSPITAL", network_status: "IN_NETWORK" }
              as: ProgramAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /tcm/payers"
              payload: { name: "Northstar Health", tcm_covered: true, tcm_rate_multiplier: 1.0, coinsurance_rate: 0.2, contact_deadline_basis: "BUSINESS_DAYS" }
              as: ProgramAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /tcm/navigators"
              payload: { full_name: "Nora Vance", active_episode_cap: 5, cap_policy: "COUNT" }
              as: ProgramAdmin
              captures: { nav1_id: $.data.id }
            - call: "POST /tcm/patients"
              payload: { external_mrn: "MRN-E103", full_name: "Cy Doe", date_of_birth: "1952-03-03" }
              as: ProgramAdmin
              captures: { pat1_id: $.data.id }
            - call: "POST /tcm/referrals"
              payload: { patient_id: "${pat1_id}", facility_id: "${fac_id}", payer_id: "${payer_id}", discharge_date: "2026-05-01", discharge_datetime: "2026-05-01T14:00:00Z", discharge_disposition: "HOME", stay_type: "INPATIENT", length_of_stay_days: 4, admission_acuity: "URGENT", comorbidity_count: 5, prior_ed_visits_6mo: 2, prior_admissions_6mo: 1, social_risk_flags_count: 3 }
              as: IntakeCoordinator
              captures: { ref1_id: $.data.id }
          trigger:
            - call: "POST /tcm/referrals/${ref1_id}/accept"
              payload: { navigator_id: "${nav1_id}" }
              as: IntakeCoordinator
              captures: { ep1_id: $.data.created_episode_id }
          assert:
            - "CareEpisode.${ep1_id}.status == INTAKE, record_posture == OPEN, risk_score == 44, risk_tier == HIGH"
            - "CareEpisode.${ep1_id}.service_period_end_date == 2026-05-30 and readmission_window_end_date == 2026-05-31"
            - "CareEpisode.${ep1_id}.contact_status == NOT_STARTED, contact_attempt_count == 0, contact_timely == false, medrec_complete == false, billing_eligible == true"
            - "CareEpisode.${ep1_id}.patient_id == ${pat1_id}, payer_id == ${payer_id}, facility_id == ${fac_id}, referral_id == ${ref1_id}"

      - name: referral_system_fields_are_server_stamped
        claim_type: system_fields
        grounds:
          - "entities.DischargeReferral.fields.referred_at"
          - "entities.DischargeReferral.fields.status"
        distinguishing_aspect: "referred_at is stamped from the logical clock and status starts at RECEIVED; neither appears in the endpoint's input list."
        test_recipe:
          setup: ["Clock set to 2026-05-02T08:30:00Z; facility, payer and patient exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T08:30:00Z" }
              as: ProgramAdmin
            - call: "POST /tcm/facilities"
              payload: { name: "Mercy General", facility_type: "ACUTE_HOSPITAL", network_status: "IN_NETWORK" }
              as: ProgramAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /tcm/payers"
              payload: { name: "Northstar Health", tcm_covered: true, tcm_rate_multiplier: 1.0, coinsurance_rate: 0.2, contact_deadline_basis: "BUSINESS_DAYS" }
              as: ProgramAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /tcm/patients"
              payload: { external_mrn: "MRN-E104", full_name: "Dee Vale", date_of_birth: "1953-04-04" }
              as: ProgramAdmin
              captures: { pat1_id: $.data.id }
          trigger:
            - call: "POST /tcm/referrals"
              payload: { patient_id: "${pat1_id}", facility_id: "${fac_id}", payer_id: "${payer_id}", discharge_date: "2026-05-01", discharge_datetime: "2026-05-01T14:00:00Z", discharge_disposition: "HOME", stay_type: "INPATIENT", length_of_stay_days: 4, admission_acuity: "URGENT", comorbidity_count: 5, prior_ed_visits_6mo: 2, prior_admissions_6mo: 1, social_risk_flags_count: 3 }
              as: IntakeCoordinator
              captures: { ref1_id: $.data.id }
          assert:
            - "DischargeReferral.${ref1_id}.referred_at == 2026-05-02T08:30:00.000Z"
            - "DischargeReferral.${ref1_id}.status == RECEIVED, closure_reason_code == null, created_episode_id == null"

      - name: get_episode_with_unknown_uuid_returns_episode_not_found
        claim_type: not_found
        grounds:
          - "errors[ERR_EPISODE_NOT_FOUND]"
          - "validations[priority=5]"
        distinguishing_aspect: "A syntactically valid but unknown {episode_id} returns 404 ERR_EPISODE_NOT_FOUND rather than the generic resource error."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T16:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /tcm/episodes/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id ERR_EPISODE_NOT_FOUND and response_type error"

      - name: get_navigator_with_unknown_uuid_returns_resource_not_found
        claim_type: not_found
        grounds:
          - "errors[ERR_RESOURCE_NOT_FOUND]"
          - "validations[priority=6]"
        distinguishing_aspect: "Every non-episode path id resolves through the generic 404 ERR_RESOURCE_NOT_FOUND."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T16:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /tcm/navigators/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id ERR_RESOURCE_NOT_FOUND"

      - name: referral_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "Omitting admission_acuity, a required input on POST /tcm/referrals, returns 400 ERR_VALIDATION and creates no row."
        test_recipe:
          setup: ["Facility, payer and patient exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T16:00:00Z" }
              as: ProgramAdmin
            - call: "POST /tcm/facilities"
              payload: { name: "Mercy General", facility_type: "ACUTE_HOSPITAL", network_status: "IN_NETWORK" }
              as: ProgramAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /tcm/payers"
              payload: { name: "Northstar Health", tcm_covered: true, tcm_rate_multiplier: 1.0, coinsurance_rate: 0.2, contact_deadline_basis: "BUSINESS_DAYS" }
              as: ProgramAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /tcm/patients"
              payload: { external_mrn: "MRN-E105", full_name: "Eli Ford", date_of_birth: "1954-05-05" }
              as: ProgramAdmin
              captures: { pat1_id: $.data.id }
          trigger:
            - call: "POST /tcm/referrals"
              payload: { patient_id: "${pat1_id}", facility_id: "${fac_id}", payer_id: "${payer_id}", discharge_date: "2026-05-01", discharge_datetime: "2026-05-01T14:00:00Z", discharge_disposition: "HOME", stay_type: "INPATIENT", length_of_stay_days: 4, comorbidity_count: 5, prior_ed_visits_6mo: 2, prior_admissions_6mo: 1, social_risk_flags_count: 3 }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id ERR_VALIDATION"
            - "GET /tcm/referrals with patient_id ${pat1_id} returns total_count 0"

      - name: observation_referral_missing_length_of_stay_hours_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - "validations[priority=3]"
          - "entities.DischargeReferral.fields.length_of_stay_hours"
        distinguishing_aspect: "stay_type-conditional requiredness - an OBSERVATION referral without length_of_stay_hours fails ERR_VALIDATION even though the field is optional in the endpoint schema."
        test_recipe:
          setup: ["Facility, payer and patient exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T16:00:00Z" }
              as: ProgramAdmin
            - call: "POST /tcm/facilities"
              payload: { name: "Mercy General", facility_type: "ACUTE_HOSPITAL", network_status: "IN_NETWORK" }
              as: ProgramAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /tcm/payers"
              payload: { name: "Northstar Health", tcm_covered: true, tcm_rate_multiplier: 1.0, coinsurance_rate: 0.2, contact_deadline_basis: "BUSINESS_DAYS" }
              as: ProgramAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /tcm/patients"
              payload: { external_mrn: "MRN-E106", full_name: "Fay Gill", date_of_birth: "1955-06-06" }
              as: ProgramAdmin
              captures: { pat1_id: $.data.id }
          trigger:
            - call: "POST /tcm/referrals"
              payload: { patient_id: "${pat1_id}", facility_id: "${fac_id}", payer_id: "${payer_id}", discharge_date: "2026-05-01", discharge_datetime: "2026-05-01T14:00:00Z", discharge_disposition: "HOME", stay_type: "OBSERVATION", admission_acuity: "URGENT", comorbidity_count: 5, prior_ed_visits_6mo: 2, prior_admissions_6mo: 1, social_risk_flags_count: 3 }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id ERR_VALIDATION"

      - name: invalid_enum_value_on_barrier_type_returns_invalid_enum
        claim_type: type_constraints
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_INVALID_ENUM]"
          - "entities.Barrier.fields.barrier_type"
        distinguishing_aspect: "barrier_type is on the exhaustive enum-routing list, so an unknown member returns 400 ERR_INVALID_ENUM rather than ERR_VALIDATION."
        test_recipe:
          setup: ["A HIGH-tier episode owned by nav1."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T16:00:00Z" }
              as: ProgramAdmin
            - call: "POST /tcm/facilities"
              payload: { name: "Mercy General", facility_type: "ACUTE_HOSPITAL", network_status: "IN_NETWORK" }
              as: ProgramAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /tcm/payers"
              payload: { name: "Northstar Health", tcm_covered: true, tcm_rate_multiplier: 1.0, coinsurance_rate: 0.2, contact_deadline_basis: "BUSINESS_DAYS" }
              as: ProgramAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /tcm/navigators"
              payload: { full_name: "Nora Vance", active_episode_cap: 5, cap_policy: "COUNT" }
              as: ProgramAdmin
              captures: { nav1_id: $.data.id }
            - call: "POST /tcm/patients"
              payload: { external_mrn: "MRN-E107", full_name: "Gus Hale", date_of_birth: "1956-07-07" }
              as: ProgramAdmin
              captures: { pat1_id: $.data.id }
            - call: "POST /tcm/referrals"
              payload: { patient_id: "${pat1_id}", facility_id: "${fac_id}", payer_id: "${payer_id}", discharge_date: "2026-05-01", discharge_datetime: "2026-05-01T14:00:00Z", discharge_disposition: "HOME", stay_type: "INPATIENT", length_of_stay_days: 4, admission_acuity: "URGENT", comorbidity_count: 5, prior_ed_visits_6mo: 2, prior_admissions_6mo: 1, social_risk_flags_count: 3 }
              as: IntakeCoordinator
              captures: { ref1_id: $.data.id }
            - call: "POST /tcm/referrals/${ref1_id}/accept"
              payload: { navigator_id: "${nav1_id}" }
              as: IntakeCoordinator
              captures: { ep1_id: $.data.created_episode_id }
          trigger:
            - call: "POST /tcm/episodes/${ep1_id}/barriers"
              payload: { barrier_type: "CHILDCARE", description: "unlisted barrier type" }
              as: CareNavigator
              as_user_id: "${nav1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id ERR_INVALID_ENUM"
            - "GET /tcm/barriers with episode_id ${ep1_id} returns total_count 0"

      - name: list_episodes_paginates_and_filters_by_navigator
        claim_type: listing
        grounds:
          - "endpoints.GET_/tcm/episodes"
          - "response_envelope.pagination_fields"
        distinguishing_aspect: "GET /tcm/episodes honours limit, offset, total_count and has_more, and the navigator_id filter narrows a three-episode set to the two owned by nav1."
        test_recipe:
          setup: ["Three accepted HIGH-tier episodes - two owned by nav1 and one by nav2."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T16:00:00Z" }
              as: ProgramAdmin
            - call: "POST /tcm/facilities"
              payload: { name: "Mercy General", facility_type: "ACUTE_HOSPITAL", network_status: "IN_NETWORK" }
              as: ProgramAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /tcm/payers"
              payload: { name: "Northstar Health", tcm_covered: true, tcm_rate_multiplier: 1.0, coinsurance_rate: 0.2, contact_deadline_basis: "BUSINESS_DAYS" }
              as: ProgramAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /tcm/navigators"
              payload: { full_name: "Nora Vance", active_episode_cap: 5, cap_policy: "COUNT" }
              as: ProgramAdmin
              captures: { nav1_id: $.data.id }
            - call: "POST /tcm/navigators"
              payload: { full_name: "Owen Park", active_episode_cap: 5, cap_policy: "COUNT" }
              as: ProgramAdmin
              captures: { nav2_id: $.data.id }
            - call: "POST /tcm/patients"
              payload: { external_mrn: "MRN-E201", full_name: "H One", date_of_birth: "1950-01-01" }
              as: ProgramAdmin
              captures: { pat1_id: $.data.id }
            - call: "POST /tcm/patients"
              payload: { external_mrn: "MRN-E202", full_name: "H Two", date_of_birth: "1950-01-02" }
              as: ProgramAdmin
              captures: { pat2_id: $.data.id }
            - call: "POST /tcm/patients"
              payload: { external_mrn: "MRN-E203", full_name: "H Three", date_of_birth: "1950-01-03" }
              as: ProgramAdmin
              captures: { pat3_id: $.data.id }
            - call: "POST /tcm/referrals"
              payload: { patient_id: "${pat1_id}", facility_id: "${fac_id}", payer_id: "${payer_id}", discharge_date: "2026-05-01", discharge_datetime: "2026-05-01T14:00:00Z", discharge_disposition: "HOME", stay_type: "INPATIENT", length_of_stay_days: 4, admission_acuity: "URGENT", comorbidity_count: 5, prior_ed_visits_6mo: 2, prior_admissions_6mo: 1, social_risk_flags_count: 3 }
              as: IntakeCoordinator
              captures: { ref1_id: $.data.id }
            - call: "POST /tcm/referrals/${ref1_id}/accept"
              payload: { navigator_id: "${nav1_id}" }
              as: IntakeCoordinator
              captures: { ep1_id: $.data.created_episode_id }
            - call: "POST /tcm/referrals"
              payload: { patient_id: "${pat2_id}", facility_id: "${fac_id}", payer_id: "${payer_id}", discharge_date: "2026-05-01", discharge_datetime: "2026-05-01T14:00:00Z", discharge_disposition: "HOME", stay_type: "INPATIENT", length_of_stay_days: 4, admission_acuity: "URGENT", comorbidity_count: 5, prior_ed_visits_6mo: 2, prior_admissions_6mo: 1, social_risk_flags_count: 3 }
              as: IntakeCoordinator
              captures: { ref2_id: $.data.id }
            - call: "POST /tcm/referrals/${ref2_id}/accept"
              payload: { navigator_id: "${nav1_id}" }
              as: IntakeCoordinator
              captures: { ep2_id: $.data.created_episode_id }
            - call: "POST /tcm/referrals"
              payload: { patient_id: "${pat3_id}", facility_id: "${fac_id}", payer_id: "${payer_id}", discharge_date: "2026-05-01", discharge_datetime: "2026-05-01T14:00:00Z", discharge_disposition: "HOME", stay_type: "INPATIENT", length_of_stay_days: 4, admission_acuity: "URGENT", comorbidity_count: 5, prior_ed_visits_6mo: 2, prior_admissions_6mo: 1, social_risk_flags_count: 3 }
              as: IntakeCoordinator
              captures: { ref3_id: $.data.id }
            - call: "POST /tcm/referrals/${ref3_id}/accept"
              payload: { navigator_id: "${nav2_id}" }
              as: IntakeCoordinator
              captures: { ep3_id: $.data.created_episode_id }
          trigger:
            - call: "GET /tcm/episodes"
              payload: { navigator_id: "${nav1_id}", limit: 1, offset: 0 }
              as: ProgramAdmin
              captures: { first_id: "$.data[0].id" }
            - call: "GET /tcm/episodes"
              payload: { limit: 10, offset: 0 }
              as: ProgramAdmin
          assert:
            - "The filtered call returns exactly 1 row with total_count 2 and has_more true"
            - "The unfiltered call returns 3 rows with total_count 3 and has_more false"
            - "Every returned row carries navigator_id ${nav1_id} in the filtered call"

      - name: risk_assessment_self_reference_discoverable_via_supersedes_filter
        claim_type: parent_relationships
        grounds:
          - "entities.RiskAssessment.fields.supersedes_id"
          - "endpoints.GET_/tcm/risk-assessments"
        distinguishing_aspect: "The self-referential supersedes_id FK is reverse-reachable - filtering GET /tcm/risk-assessments by supersedes_id returns exactly the successor assessment."
        test_recipe:
          setup: ["A MODERATE-tier episode that has been re-assessed once, so two RiskAssessment rows exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T16:00:00Z" }
              as: ProgramAdmin
            - call: "POST /tcm/facilities"
              payload: { name: "Mercy General", facility_type: "ACUTE_HOSPITAL", network_status: "IN_NETWORK" }
              as: ProgramAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /tcm/payers"
              payload: { name: "Northstar Health", tcm_covered: true, tcm_rate_multiplier: 1.0, coinsurance_rate: 0.2, contact_deadline_basis: "BUSINESS_DAYS" }
              as: ProgramAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /tcm/navigators"
              payload: { full_name: "Nora Vance", active_episode_cap: 5, cap_policy: "COUNT" }
              as: ProgramAdmin
              captures: { nav1_id: $.data.id }
            - call: "POST /tcm/patients"
              payload: { external_mrn: "MRN-E301", full_name: "Ida Lund", date_of_birth: "1957-08-08" }
              as: ProgramAdmin
              captures: { pat1_id: $.data.id }
            - call: "POST /tcm/referrals"
