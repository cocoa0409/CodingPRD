  # =========================================================================
  # Section: complexity_layers
  # =========================================================================
  - section: complexity_layers
    instances:
      - name: occ_stale_quote_approval_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[quote-approval-stale-work-order]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Customer reads the quote at version V; a CSR re-quote supersedes it (V+1). Approval carrying expected_work_order_version V is rejected 412 ERR_STALE_VERSION even though the work order is still legitimately QUOTE_SUBMITTED; retry with V+1 succeeds."
        test_recipe:
          setup: ["work order QUOTE_SUBMITTED at version V; re-quoted to V+1"]
          setup_api_calls:
            - { call: "POST /mro/customers", payload: { name: "AeroAir", certificate_number: "AIR-001", contract_tat_hours: 100, tat_penalty_rate_cents_per_hour: 5000, tat_penalty_cap_pct: 50, credit_limit_cents: 1000000000 }, as: ShopManager, captures: { c_id: $.data.id } }
            - { call: "POST /mro/part-catalog", payload: { part_number: "PN-32-ACT", ata_chapter: "32", is_rotable: true, cmm_reference: "CMM-32-11-01", replacement_value_cents: 10000000, warranty_cycle_limit: 500, warranty_month_limit: 24, flat_overhaul_price_cents: 2000000 }, as: ShopManager, captures: { p_id: $.data.id } }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-U1", ownership: "CUSTOMER", owner_customer_id: "${c_id}", condition_status: "UNSERVICEABLE", custody_status: "OFF_SITE", total_cycles: 4800, cycles_since_overhaul: 300, manufactured_at: "2015-06-01" }, as: CustomerServiceRep, captures: { u1: $.data.id } }
            - { call: "POST /mro/work-orders", payload: { customer_id: "${c_id}", unit_id: "${u1}", work_scope: "OVERHAUL" }, as: CustomerServiceRep, captures: { wo: $.data.id } }
            - { call: "POST /mro/work-orders/${wo}/teardown-complete", payload: {}, as: Technician }
            - { call: "POST /mro/work-orders/${wo}/quote", payload: { labor_estimate_cents: 2000000, parts_estimate_cents: 1000000, scrap_option_ack: false }, as: CustomerServiceRep, captures: { v_q1: $.data.version } }
            - { call: "POST /mro/work-orders/${wo}/quote", payload: { labor_estimate_cents: 2100000, parts_estimate_cents: 1000000, scrap_option_ack: false }, as: CustomerServiceRep, captures: { v_q2: $.data.version } }
          trigger:
            - { call: "POST /mro/work-orders/${wo}/quote-approval", payload: { expected_work_order_version: "${v_q1}" }, as: Customer, as_user_id: "${c_id}", captures: { err: $.data.error_id } }
            - { call: "POST /mro/work-orders/${wo}/quote-approval", payload: { expected_work_order_version: "${v_q2}" }, as: Customer, as_user_id: "${c_id}", captures: { st: $.data.status, lab: $.data.labor_charge_cents } }
          assert:
            - "v_q2 == v_q1 + 1 (re-quote self-loop bumps version); err == 'ERR_STALE_VERSION' with HTTP 412 for the stale approval"
            - "st == 'REPAIR_IN_PROGRESS' with lab == 2100000 (the superseding quote is the one approved)"
      - name: occ_stale_lease_create_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[lease-create-stale-unit]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two forward, NON-overlapping leases on one unit: the first create bumps the unit version; a second create still carrying the pre-first version is rejected 412 — no state precondition could catch it because forward leasing an ON_LEASE unit is legal."
        test_recipe:
          setup: ["SHOP pool unit SN-L1 at version V; lease1 [2026-08-10, 2026-08-14] created with expected V"]
          setup_api_calls:
            - { call: "POST /mro/customers", payload: { name: "AeroAir", certificate_number: "AIR-001", contract_tat_hours: 100, tat_penalty_rate_cents_per_hour: 5000, tat_penalty_cap_pct: 50, credit_limit_cents: 1000000000 }, as: ShopManager, captures: { c_id: $.data.id } }
            - { call: "POST /mro/part-catalog", payload: { part_number: "PN-32-ACT", ata_chapter: "32", is_rotable: true, cmm_reference: "CMM-32-11-01", replacement_value_cents: 10000000, warranty_cycle_limit: 500, warranty_month_limit: 24, flat_overhaul_price_cents: 2000000 }, as: ShopManager, captures: { p_id: $.data.id } }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-L1", ownership: "SHOP", condition_status: "SERVICEABLE", custody_status: "IN_POOL", total_cycles: 3000, cycles_since_overhaul: 50, manufactured_at: "2014-03-01" }, as: CustomerServiceRep, captures: { u_l: $.data.id, u_v1: $.data.version } }
            - { call: "POST /mro/lease-agreements", payload: { customer_id: "${c_id}", unit_id: "${u_l}", start_date: "2026-08-10", end_date: "2026-08-14", daily_rate_cents: 100000, expected_unit_version: "${u_v1}" }, as: CustomerServiceRep, captures: { ls1: $.data.id } }
          trigger:
            - { call: "POST /mro/lease-agreements", payload: { customer_id: "${c_id}", unit_id: "${u_l}", start_date: "2026-08-20", end_date: "2026-08-25", daily_rate_cents: 100000, expected_unit_version: "${u_v1}" }, as: CustomerServiceRep, captures: { err: $.data.error_id } }
            - { call: "GET /mro/units/${u_l}", payload: {}, as: CustomerServiceRep, captures: { u_v2: $.data.version } }
            - { call: "POST /mro/lease-agreements", payload: { customer_id: "${c_id}", unit_id: "${u_l}", start_date: "2026-08-20", end_date: "2026-08-25", daily_rate_cents: 100000, expected_unit_version: "${u_v2}" }, as: CustomerServiceRep, captures: { ls2: $.data.id, ls2_st: $.data.status } }
          assert:
            - "err == 'ERR_STALE_VERSION' with HTTP 412 (stale after lease1 bumped the unit version)"
            - "u_v2 == u_v1 + 1; retry with the fresh version succeeds: ls2_st == 'ACTIVE'"
      - name: cascading_side_effects_layer
        claim_type: cascading_side_effects
        grounds: [state_machines.ExchangeAgreement.FULFILLED_to_CLOSED, state_machines.WarrantyClaim.SUBMITTED_to_ACCEPTED]
        excluded_because:
          difficulty_instance: core_return_settlement_chain_depth4
          rationale: "N-level cascade ordering asserted hop-by-hop in difficulty instances core_return_settlement_chain_depth4 and warranty_accept_rework_chain_depth3."
      - name: dual_variant_calculation_layer
        claim_type: dual_variant_calculation
        grounds: [calculations.tat_penalty_calc, calculations.warranty_credit_calc]
        excluded_because:
          difficulty_instance: tat_penalty_adjusted_vs_calendar_variant
          rationale: "Both variants of both calculations are executed and asserted in the two dual_variant_calc difficulty instances."

  # =========================================================================
  # Section: endpoints
  # =========================================================================
  - section: endpoints
    instances:
      - name: response_envelope_object_and_error_shapes
        claim_type: computed_read
        grounds: [response_envelope]
        distinguishing_aspect: "Success envelope carries meta.api_request_id + response_type 'object' with data holding the entity; the 404 path returns response_type 'error' with data.error_id — both envelope shapes verified."
        test_recipe:
          setup: ["one customer exists"]
          setup_api_calls:
            - { call: "POST /mro/customers", payload: { name: "AeroAir", certificate_number: "AIR-001", contract_tat_hours: 100, tat_penalty_rate_cents_per_hour: 5000, tat_penalty_cap_pct: 50, credit_limit_cents: 1000000000 }, as: ShopManager, captures: { c_id: $.data.id } }
          trigger:
            - { call: "GET /mro/customers/${c_id}", payload: {}, as: ShopManager }
            - { call: "GET /mro/work-orders/00000000-0000-4000-8000-000000000000", payload: {}, as: ShopManager, captures: { err: $.data.error_id } }
          assert:
            - "GET success: meta.api_request_id present, response_type == 'object', data.id == ${c_id}"
            - "GET missing: response_type == 'error', data.error_id == 'ERR_WORK_ORDER_NOT_FOUND', HTTP 404"
      - name: work_order_version_increments_visible_via_get
        claim_type: standard_crud
        grounds: [entities.WorkOrder.fields.version, entities.WorkOrder.fields.promised_return_at]
        distinguishing_aspect: "Every mutation bumps version by exactly 1 (create 1, teardown 2, quote 3, approve 4); GET exposes computed promised_return_at == received_at + contract_tat_hours with received_at pinned to the default clock."
        test_recipe:
          setup: ["work order approved; no other mutations"]
          setup_api_calls:
            - { call: "POST /mro/customers", payload: { name: "AeroAir", certificate_number: "AIR-001", contract_tat_hours: 100, tat_penalty_rate_cents_per_hour: 5000, tat_penalty_cap_pct: 50, credit_limit_cents: 1000000000 }, as: ShopManager, captures: { c_id: $.data.id } }
            - { call: "POST /mro/part-catalog", payload: { part_number: "PN-32-ACT", ata_chapter: "32", is_rotable: true, cmm_reference: "CMM-32-11-01", replacement_value_cents: 10000000, warranty_cycle_limit: 500, warranty_month_limit: 24, flat_overhaul_price_cents: 2000000 }, as: ShopManager, captures: { p_id: $.data.id } }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-U1", ownership: "CUSTOMER", owner_customer_id: "${c_id}", condition_status: "UNSERVICEABLE", custody_status: "OFF_SITE", total_cycles: 4800, cycles_since_overhaul: 300, manufactured_at: "2015-06-01" }, as: CustomerServiceRep, captures: { u1: $.data.id } }
            - { call: "POST /mro/work-orders", payload: { customer_id: "${c_id}", unit_id: "${u1}", work_scope: "OVERHAUL" }, as: CustomerServiceRep, captures: { wo: $.data.id, v1: $.data.version } }
            - { call: "POST /mro/work-orders/${wo}/teardown-complete", payload: {}, as: Technician, captures: { v2: $.data.version } }
            - { call: "POST /mro/work-orders/${wo}/quote", payload: { labor_estimate_cents: 2000000, parts_estimate_cents: 1000000, scrap_option_ack: false }, as: CustomerServiceRep, captures: { v3: $.data.version } }
            - { call: "POST /mro/work-orders/${wo}/quote-approval", payload: { expected_work_order_version: "${v3}" }, as: Customer, as_user_id: "${c_id}", captures: { v4: $.data.version } }
          trigger:
            - { call: "GET /mro/work-orders/${wo}", payload: {}, as: ShopManager, captures: { vg: $.data.version, stg: $.data.status, recv: $.data.received_at, prom: $.data.promised_return_at } }
          assert:
            - "v1 == 1, v2 == 2, v3 == 3, v4 == 4 and vg == 4 (exactly one increment per mutation)"
            - "stg == 'REPAIR_IN_PROGRESS'; recv == '2026-08-01T00:00:00Z' (logical clock default); prom == '2026-08-05T04:00:00Z' (received + 100h)"

  # =========================================================================
  # Section: errors
  # =========================================================================
  - section: errors
    instances:
      - name: not_found_sweep_returns_404s
