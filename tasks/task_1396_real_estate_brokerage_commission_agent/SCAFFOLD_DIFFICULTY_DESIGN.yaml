  # ------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: settle_shortfall_cascades_into_later_deal_recovery
        grounds:
          - state_machines.Deal.CLOSED_to_SETTLED
          - calculations.fee_shortfall_and_recovery
          - entities.LedgerEntry
        distinguishing_aspect: |
          Depth-3 chain from trigger POST settle#1: settle of a tiny deal
          accrues a FEE_SHORTFALL (link 1: Deal->Settlement) which posts a
          LedgerEntry and mutates Agent.debit_balance_cents (link 2); a LATER
          deal's settle reads that debit and converts it into
          debit_recovery_cents, shrinking the AGENT leg and growing the COMPANY
          leg of deal #2 (link 3) — each link is caused by the previous, not by
          the original trigger.
        test_recipe:
          setup:
            - "Agent ACTIVE on plan P1; deal TINY gross 5000 closing 2026-01-15 settled first (shortfall 27710); deal BIG gross 2000000 with mentor+team settled second"
          setup_api_calls:
            - call: "POST /brokerage/agents"
              payload: { full_name: "Mentor Mike", email: "mike@x.com", license_number: "LIC-M1", joined_at: "2025-09-01" }
              as: BrokerAdmin
              captures: { mentor_id: $.data.id }
