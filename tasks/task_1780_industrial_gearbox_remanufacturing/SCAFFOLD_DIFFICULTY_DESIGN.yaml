  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency across different entity pairs:
  # (1) RemanOrder start-teardown gated by GearUnit.physical_status
  #     (RemanOrder → GearUnit);
  # (2) WarrantyClaim review gated by RunInTest baseline of the linked order
  #     (WarrantyClaim → RunInTest).
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: teardown_requires_unit_at_shop
        grounds:
          - state_machines.RemanOrder.INTAKE_to_TEARDOWN
          - entities.GearUnit.fields.physical_status
          - "errors[ERR_UNIT_NOT_AT_SHOP]"
        distinguishing_aspect: |
          Pair RemanOrder→GearUnit: start-teardown is rejected with
          ERR_UNIT_NOT_AT_SHOP unless the parent GearUnit's physical_status is
          AT_SHOP — a transition on the order gated by state of a different
          entity (its unit).
        test_recipe:
          setup:
            - "Unit U1 freshly registered, physical_status == IN_SERVICE (never checked in)"
            - "No order exists yet; the cross-entity gate is probed at order creation, which requires AT_SHOP"
          setup_api_calls:
            - call: "POST /reman/customers"
              payload: { legal_name: "Gate Co", credit_limit_cents: 90000000 }
              as: IntakeCoordinator
              captures: { cust_id: $.data.id }
            - call: "POST /reman/customers/${cust_id}/units"
              payload: { serial_number: "GBX-G1", model: "HZ-450", rated_torque_nm: 12000 }
              as: IntakeCoordinator
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /reman/units/${unit_id}/orders"
              payload: { intake_hours: 0, quoted_estimate_cents: 100000, rush: false }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNIT_NOT_AT_SHOP"
            - "http status == 409"
            - "GearUnit.${unit_id}.physical_status == IN_SERVICE (unchanged)"

      - name: warranty_review_requires_completed_order_then_baseline
        grounds:
          - state_machines.WarrantyClaim.OPEN_to_UNDER_REVIEW
          - entities.RunInTest.fields.oil_baseline_established
          - entities.RemanOrder.fields.status
          - "errors[ERR_ORDER_NOT_COMPLETED]"
        distinguishing_aspect: |
          Pair WarrantyClaim→RemanOrder (distinct from instance 1's
          RemanOrder→GearUnit pair): claim review is gated on the linked
          order's state machine — a claim filed while the order is still
          READY_TO_SHIP (run-in PASSED, oil baseline exists, but order not yet
          COMPLETED) is rejected at review with ERR_ORDER_NOT_COMPLETED —
          the claim's valid transition set depends on the linked order's
          state, a cross-entity gate.
        test_recipe:
          setup:
            - "Order O in READY_TO_SHIP (run-in PASSED, baseline exists) but NOT yet COMPLETED"
            - "Customer files warranty claim on O (allowed — claim create needs only the order); review must fail"
          setup_api_calls:
            - call: "POST /reman/customers"
              payload: { legal_name: "Baseline Co", credit_limit_cents: 90000000 }
              as: IntakeCoordinator
              captures: { cust_id: $.data.id }
            - call: "POST /reman/customers/${cust_id}/units"
              payload: { serial_number: "GBX-B1", model: "HZ-450", rated_torque_nm: 12000 }
              as: IntakeCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /reman/units/${unit_id}/check-in"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /reman/units/${unit_id}/orders"
              payload: { intake_hours: 0, quoted_estimate_cents: 10000, rush: false }
              as: IntakeCoordinator
              captures: { order_id: $.data.id }
            - call: "POST /reman/orders/${order_id}/start-teardown"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/findings"
              payload: { component_code: "PINION_1", condition: "REGRINDABLE", severity: 2, notes: "wear" }
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/decisions"
              payload: { component_code: "PINION_1", action: "REGRIND", labor_hours: 2.0, material_cents: 5000 }
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/submit-scope"
