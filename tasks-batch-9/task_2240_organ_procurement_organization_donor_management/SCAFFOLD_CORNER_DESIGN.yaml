      - name: referral_timestamps_before_the_clinical_trigger_are_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority 67]
          - errors.ERR_REFERRAL_BEFORE_TRIGGER
          - entities.DeathReferral.fields.referred_at
        distinguishing_aspect: |
          Two limbs of one temporal rule are checked against the logical clock rather than wall time: a
          trigger_event_at later than the clock (so referred_at would precede it) and a
          death_pronounced_at earlier than the trigger both fail, while the ordered case succeeds and
          stamps referred_at from the clock.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-07T08:00:00Z."
            - "One hospital partner with a 60-minute timely window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T08:00:00Z" }
