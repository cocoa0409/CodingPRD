  - rule_id: resource_temporal_overlap
    instances:
      - name: transfer_agreement_windows_require_one_clear_calendar_day_so_adjacent_is_rejected
        grounds:
          - validations[priority=20]
          - errors[ERR_AGREEMENT_WINDOW_CONFLICT]
          - entities.TransferAgreement.fields.effective_start_date
        distinguishing_aspect: |
          Resource: the (facility, destination hospital, service line) agreement slot. Interval
          semantics: INCLUSIVE CLOSED date windows that must be separated by at least one clear
          calendar day, so a window starting the very next day after an existing window ends (gap 0)
          is rejected while a window starting one day later (gap 1, the whole of 2026-09-01 free) is
          accepted.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T08:00:00Z"
            - "Facility with compliance_posture OPEN"
            - "One agreement with Trinity Regional Hospital for CARDIAC covering 2026-08-01..2026-08-31, so its status is ACTIVE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
            - call: "POST /facilities"
              payload: { name: "Cedar Freestanding ED", state_code: "TX", license_category: "INDEPENDENT_FREESTANDING_ED", license_status: "ACTIVE", observation_bed_count: 2, imaging_scope: ["XRAY", "CT"], lab_scope: ["CBC", "TROPONIN"], pharmacy_scope_tier: "EMERGENCY_ONLY", max_concurrent_physicians: 2 }
              as: FacilityAdministrator
              as_user_id: "admin-1"
              captures: { fac_id: $.data.id, fac_v1: $.data.version }
            - call: "POST /facilities/${fac_id}/disclosure-templates"
              payload: { version_label: "V1", facility_fee_cents: 145000, observation_hourly_cents: 42000, network_status_statement: "OUT_OF_NETWORK_ALL_PLANS", required_signage_elements: ["LICENSE_CATEGORY_SIGN", "FEE_DISCLOSURE_SIGN", "NETWORK_STATUS_SIGN", "NOT_A_URGENT_CARE_SIGN"] }
              as: FacilityAdministrator
              as_user_id: "admin-1"
              captures: { tpl_v1_id: $.data.id }
            - call: "POST /disclosure-templates/${tpl_v1_id}/publish"
              payload: { expected_facility_version: "${fac_v1}" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
            - call: "POST /facilities/${fac_id}/signage-attestations"
              payload: { attested_elements: ["LICENSE_CATEGORY_SIGN", "FEE_DISCLOSURE_SIGN", "NETWORK_STATUS_SIGN", "NOT_A_URGENT_CARE_SIGN"] }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /facilities/${fac_id}/transfer-agreements"
              payload: { destination_hospital_name: "Trinity Regional Hospital", service_line: "CARDIAC", capability_tier: 3, accepts_unstable: true, effective_start_date: "2026-08-01", effective_end_date: "2026-08-31" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
              captures: { ta_current_id: $.data.id }
          trigger:
            - call: "POST /facilities/${fac_id}/transfer-agreements"
              payload: { destination_hospital_name: "Trinity Regional Hospital", service_line: "CARDIAC", capability_tier: 3, accepts_unstable: true, effective_start_date: "2026-09-01", effective_end_date: "2026-09-30" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
            - call: "POST /facilities/${fac_id}/transfer-agreements"
              payload: { destination_hospital_name: "Trinity Regional Hospital", service_line: "CARDIAC", capability_tier: 3, accepts_unstable: true, effective_start_date: "2026-09-02", effective_end_date: "2026-09-30" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
              captures: { ta_next_id: $.data.id }
          assert:
            - "the 2026-09-01 attempt returns error_id == ERR_AGREEMENT_WINDOW_CONFLICT with HTTP 409 (gap of 0 clear days is not enough)"
            - "the 2026-09-02 attempt succeeds because 2026-09-01 is entirely free"
            - "TransferAgreement.${ta_current_id}.status == ACTIVE and TransferAgreement.${ta_next_id}.status == PENDING"
            - "GET /facilities/${fac_id}/transfer-agreements returns total_count == 2"
            - "a further attempt with destination_hospital_name Sabine County Hospital and the same 2026-09-01..2026-09-30 window succeeds, proving the conflict is scoped to the (facility, hospital, service_line) resource"
      - name: physician_shifts_use_half_open_intervals_so_touching_is_free_but_third_overlap_breaks_the_cap
        grounds:
          - validations[priority=21]
          - validations[priority=30]
          - errors[ERR_CLINICIAN_DOUBLE_BOOKED]
          - errors[ERR_COVERAGE_CAPACITY_EXCEEDED]
          - entities.Facility.fields.max_concurrent_physicians
        distinguishing_aspect: |
          A different resource (clinician time and the aggregate physician-concurrency slots) with
          different interval semantics: HALF-OPEN instant intervals [start_utc, end_utc), so a shift
          beginning exactly at another's end_utc does not overlap at all. The aggregate cap of 2
          counts only role_type PHYSICIAN, so a third overlapping physician shift is rejected while an
          identically overlapping ADVANCED_PRACTICE_PROVIDER shift is accepted.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T08:00:00Z"
            - "Facility with max_concurrent_physicians 2 and compliance_posture OPEN"
            - "One PHYSICIAN shift for doc-a on 2026-08-03T08:00:00Z..16:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
            - call: "POST /facilities"
              payload: { name: "Cedar Freestanding ED", state_code: "TX", license_category: "INDEPENDENT_FREESTANDING_ED", license_status: "ACTIVE", observation_bed_count: 2, imaging_scope: ["XRAY", "CT"], lab_scope: ["CBC", "TROPONIN"], pharmacy_scope_tier: "EMERGENCY_ONLY", max_concurrent_physicians: 2 }
              as: FacilityAdministrator
              as_user_id: "admin-1"
              captures: { fac_id: $.data.id, fac_v1: $.data.version }
            - call: "POST /facilities/${fac_id}/disclosure-templates"
              payload: { version_label: "V1", facility_fee_cents: 145000, observation_hourly_cents: 42000, network_status_statement: "OUT_OF_NETWORK_ALL_PLANS", required_signage_elements: ["LICENSE_CATEGORY_SIGN", "FEE_DISCLOSURE_SIGN", "NETWORK_STATUS_SIGN", "NOT_A_URGENT_CARE_SIGN"] }
              as: FacilityAdministrator
              as_user_id: "admin-1"
              captures: { tpl_v1_id: $.data.id }
            - call: "POST /disclosure-templates/${tpl_v1_id}/publish"
              payload: { expected_facility_version: "${fac_v1}" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
            - call: "POST /facilities/${fac_id}/signage-attestations"
              payload: { attested_elements: ["LICENSE_CATEGORY_SIGN", "FEE_DISCLOSURE_SIGN", "NETWORK_STATUS_SIGN", "NOT_A_URGENT_CARE_SIGN"] }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /facilities/${fac_id}/physician-shifts"
              payload: { clinician_user_id: "doc-a", role_type: "PHYSICIAN", board_certified: true, start_utc: "2026-08-03T08:00:00Z", end_utc: "2026-08-03T16:00:00Z" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
              captures: { sh_base_id: $.data.id }
          trigger:
            - call: "POST /facilities/${fac_id}/physician-shifts"
              payload: { clinician_user_id: "doc-a", role_type: "PHYSICIAN", board_certified: true, start_utc: "2026-08-03T16:00:00Z", end_utc: "2026-08-03T20:00:00Z" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
              captures: { sh_touching_id: $.data.id }
            - call: "POST /facilities/${fac_id}/physician-shifts"
              payload: { clinician_user_id: "doc-b", role_type: "PHYSICIAN", board_certified: false, start_utc: "2026-08-03T12:00:00Z", end_utc: "2026-08-03T18:00:00Z" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
              captures: { sh_second_id: $.data.id }
            - call: "POST /facilities/${fac_id}/physician-shifts"
              payload: { clinician_user_id: "doc-c", role_type: "PHYSICIAN", board_certified: true, start_utc: "2026-08-03T10:00:00Z", end_utc: "2026-08-03T14:00:00Z" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
            - call: "POST /facilities/${fac_id}/physician-shifts"
              payload: { clinician_user_id: "doc-c", role_type: "ADVANCED_PRACTICE_PROVIDER", board_certified: false, start_utc: "2026-08-03T10:00:00Z", end_utc: "2026-08-03T14:00:00Z" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
              captures: { sh_app_id: $.data.id }
            - call: "POST /facilities/${fac_id}/physician-shifts"
              payload: { clinician_user_id: "doc-a", role_type: "PHYSICIAN", board_certified: true, start_utc: "2026-08-03T15:00:00Z", end_utc: "2026-08-03T17:00:00Z" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
          assert:
            - "the doc-a 16:00..20:00 shift is accepted: PhysicianShift.${sh_touching_id}.duration_hours == 4.00 (half-open, so it does not overlap the 08:00..16:00 shift)"
            - "the doc-b 12:00..18:00 shift is accepted: PhysicianShift.${sh_second_id}.duration_hours == 6.00 (never more than 2 concurrent physicians)"
            - "the doc-c PHYSICIAN 10:00..14:00 attempt returns error_id == ERR_COVERAGE_CAPACITY_EXCEEDED with HTTP 422 (three physicians would overlap 12:00..14:00)"
            - "the doc-c ADVANCED_PRACTICE_PROVIDER 10:00..14:00 shift over the identical interval is accepted: PhysicianShift.${sh_app_id}.role_type == ADVANCED_PRACTICE_PROVIDER"
            - "the doc-a 15:00..17:00 attempt returns error_id == ERR_CLINICIAN_DOUBLE_BOOKED with HTTP 409, not ERR_COVERAGE_CAPACITY_EXCEEDED, because priority 21 precedes priority 30"
            - "GET /facilities/${fac_id}/physician-shifts?role_type=PHYSICIAN returns total_count == 3 and GET /facilities/${fac_id}/physician-shifts?role_type=ADVANCED_PRACTICE_PROVIDER returns total_count == 1"

  - rule_id: compensating_invariant
    instances:
      - name: award_then_withdrawal_restores_every_claim_money_field_with_zero_drift
        grounds:
          - calculations.award_application
          - state_machines.DisputeCase.AWARDED_to_WITHDRAWN
          - state_machines.Claim.RESOLVED_to_IDR_PENDING
          - entities.Claim.fields.pre_award_allowed_cents
        distinguishing_aspect: |
          Conserved quantity: MONEY on the claim - billed_total_cents must equal
          plan_paid + patient_responsibility + written_off before the award, after the award and
          after the withdrawal, and the withdrawal must restore each of the four money fields to its
          exact pre-award cent value (190000 / 112001 / 77999 / 92500) while clearing the snapshot
          fields to null. No rounding drift is permitted even though the award pass re-ran the
          per-line coinsurance rounding at a different allowed total.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T08:00:00Z"
            - "Facility with compliance_posture OPEN, template facility_fee_cents 145000"
            - "One OUT_OF_NETWORK payer contract under FEDERAL_NSA_ONLY (idr_eligible true) with QPA 190000, coinsurance 0.20, deductible remaining 50000"
            - "One discharged encounter whose RESULTED lines are CT x2 (98000), TROPONIN x2 (31000), ANALGESIC x1 (8500) in that creation order, so billed_total_cents is 282500"
            - "The claim is ADJUDICATED under PROTECTED_NSA: allowed 190000, plan_paid 112001, patient_responsibility 77999, written_off 92500, balance_bill 0"
            - "A dispute case with three exhausted rounds (240000/200000, 235000/205000, 230000/210000) escalated to IDR_INITIATED"
