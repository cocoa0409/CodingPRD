scaffold_corner_design:
  # ===========================================================================
  # Section: entities — creation, defaults, computed fields, type constraints
  # ===========================================================================
  - section: entities
    instances:
      - name: campaign_create_applies_defaults
        claim_type: defaults
        grounds:
          - "entities.Campaign.fields.privacy_mode"
          - "entities.Campaign.fields.status"
        distinguishing_aspect: "Omitting privacy_mode yields STRICT; status is always DRAFT on create regardless of payload."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /toy-drive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /toy-drive/campaigns"
              payload: { season_year: 2026, intake_open_at: "2026-09-01T00:00:00Z", intake_close_at: "2026-10-15T00:00:00Z", gift_return_deadline: "2026-12-10T00:00:00Z", distribution_date: "2026-12-18T00:00:00Z", max_children_per_family: 6, max_gift_value_cents: 20000, min_gift_value_cents: 2000, backfill_budget_cents: 0 }
              as: PlatformAdmin
              captures:
                cid: "$.data.id"
                st: "$.data.status"
                pm: "$.data.privacy_mode"
                ver: "$.data.version"
          assert:
            - "st == DRAFT"
            - "pm == STRICT"
            - "ver == 1"
            - "Campaign.${cid}.backfill_spent_cents == 0"

      - name: campaign_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.Campaign.fields.season_year"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required season_year -> ERR_INVALID_REQUEST (400), not ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /toy-drive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /toy-drive/campaigns"
              payload: { intake_open_at: "2026-09-01T00:00:00Z", intake_close_at: "2026-10-15T00:00:00Z", gift_return_deadline: "2026-12-10T00:00:00Z", distribution_date: "2026-12-18T00:00:00Z", max_children_per_family: 6, max_gift_value_cents: 20000, min_gift_value_cents: 2000, backfill_budget_cents: 0 }
              as: PlatformAdmin
              captures:
                err: "$.data.error_id"
          assert:
            - "err == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: family_computed_duplicate_hash_ignores_client_input
        claim_type: computed_fields
        grounds:
          - "entities.Family.fields.duplicate_hash"
          - "calculations.duplicate_hash"
        distinguishing_aspect: "Client-sent duplicate_hash value is ignored; server recomputes from PII triple and salt."
        test_recipe:
          setup: ["campaign in INTAKE_OPEN, agency active"]
          setup_api_calls:
            - call: "POST /toy-drive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-drive/campaigns"
              payload: { season_year: 2026, intake_open_at: "2026-09-01T00:00:00Z", intake_close_at: "2026-10-15T00:00:00Z", gift_return_deadline: "2026-12-10T00:00:00Z", distribution_date: "2026-12-18T00:00:00Z", max_children_per_family: 6, max_gift_value_cents: 20000, min_gift_value_cents: 2000, backfill_budget_cents: 0 }
              as: PlatformAdmin
              captures:
                camp_id: "$.data.id"
            - call: "POST /toy-drive/agencies"
              payload: { agency_code: "AGC1", legal_name: "Ag C1", referral_quota: 10, contact_email: "c1@x.org" }
              as: PlatformAdmin
              captures:
                ag_id: "$.data.id"
            - call: "POST /toy-drive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-drive/campaigns/${camp_id}/open-intake"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /toy-drive/families"
              payload: { agency_id: "${ag_id}", campaign_id: "${camp_id}", primary_caregiver_name: "P", caregiver_dob: "1990-01-01", household_size: 2, address_text: "1 H", phone_last4: "1111" }
              as: AgencyCoordinator
              as_user_id: "${ag_id}"
              captures:
                fam_id: "$.data.id"
                dh: "$.data.duplicate_hash"
          assert:
            - "dh is a 64-char lowercase hex string"
            - "dh != any client-supplied value (server-computed)"

      - name: child_age_band_computed_not_client_settable
        claim_type: computed_fields
        grounds:
          - "entities.Child.fields.age_band"
          - "calculations.child_age_band"
        distinguishing_aspect: "age_band is derived from dob + distribution_date; client cannot supply it."
        test_recipe:
          setup: ["campaign INTAKE_OPEN, family REFERRED"]
          setup_api_calls:
            - call: "POST /toy-drive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-drive/campaigns"
              payload: { season_year: 2026, intake_open_at: "2026-09-01T00:00:00Z", intake_close_at: "2026-10-15T00:00:00Z", gift_return_deadline: "2026-12-10T00:00:00Z", distribution_date: "2026-12-18T00:00:00Z", max_children_per_family: 6, max_gift_value_cents: 20000, min_gift_value_cents: 2000, backfill_budget_cents: 0 }
              as: PlatformAdmin
              captures:
                camp_id: "$.data.id"
            - call: "POST /toy-drive/agencies"
              payload: { agency_code: "AGC2", legal_name: "Ag C2", referral_quota: 10, contact_email: "c2@x.org" }
              as: PlatformAdmin
              captures:
                ag_id: "$.data.id"
            - call: "POST /toy-drive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-drive/campaigns/${camp_id}/open-intake"
              payload: {}
              as: PlatformAdmin
            - call: "POST /toy-drive/families"
              payload: { agency_id: "${ag_id}", campaign_id: "${camp_id}", primary_caregiver_name: "P", caregiver_dob: "1990-01-01", household_size: 2, address_text: "1 H", phone_last4: "1111" }
              as: AgencyCoordinator
              as_user_id: "${ag_id}"
              captures:
                fam_id: "$.data.id"
          trigger:
            - call: "POST /toy-drive/families/${fam_id}/children"
              payload: { first_name: "c", dob: "2022-06-01", gender: "X", clothing_size: "4T", interest_tags: [] }
              as: AgencyCoordinator
              as_user_id: "${ag_id}"
              captures:
                band: "$.data.age_band"
          assert:
            - "band == PRESCHOOL (4 years old on 2026-12-18)"

      - name: child_invalid_gender_enum_rejected
        claim_type: type_constraints
        grounds:
          - "entities.Child.fields.gender"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "gender outside {F,M,X} rejected at create."
        test_recipe:
          setup: ["campaign INTAKE_OPEN, family REFERRED"]
          setup_api_calls:
            - call: "POST /toy-drive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-drive/campaigns"
              payload: { season_year: 2026, intake_open_at: "2026-09-01T00:00:00Z", intake_close_at: "2026-10-15T00:00:00Z", gift_return_deadline: "2026-12-10T00:00:00Z", distribution_date: "2026-12-18T00:00:00Z", max_children_per_family: 6, max_gift_value_cents: 20000, min_gift_value_cents: 2000, backfill_budget_cents: 0 }
              as: PlatformAdmin
              captures:
                camp_id: "$.data.id"
            - call: "POST /toy-drive/agencies"
              payload: { agency_code: "AGC3", legal_name: "Ag C3", referral_quota: 10, contact_email: "c3@x.org" }
              as: PlatformAdmin
              captures:
                ag_id: "$.data.id"
            - call: "POST /toy-drive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-drive/campaigns/${camp_id}/open-intake"
              payload: {}
              as: PlatformAdmin
            - call: "POST /toy-drive/families"
              payload: { agency_id: "${ag_id}", campaign_id: "${camp_id}", primary_caregiver_name: "P", caregiver_dob: "1990-01-01", household_size: 2, address_text: "1 H", phone_last4: "1111" }
              as: AgencyCoordinator
              as_user_id: "${ag_id}"
              captures:
                fam_id: "$.data.id"
          trigger:
            - call: "POST /toy-drive/families/${fam_id}/children"
              payload: { first_name: "c", dob: "2022-06-01", gender: "Q", clothing_size: "4T", interest_tags: [] }
              as: AgencyCoordinator
              as_user_id: "${ag_id}"
              captures:
                err: "$.data.error_id"
          assert:
            - "err == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: entity_not_found_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET on a random UUID for /families/{id} returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /toy-drive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /toy-drive/families/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures:
                err: "$.data.error_id"
          assert:
            - "err == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: family_audit_event_immutable_no_update_endpoint
        claim_type: immutability
        grounds:
          - "entities.FamilyAuditEvent"
        distinguishing_aspect: "FamilyAuditEvent has common_fields:false and no PUT/PATCH/DELETE endpoint exists for it."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /toy-drive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /toy-drive/families/00000000-0000-0000-0000-000000000000/audit-events"
              payload: {}
              as: PlatformAdmin
              captures:
                err: "$.data.error_id"
          assert:
            - "err == ERR_NOT_FOUND (parent family missing -> 404; audit-events has no independent mutation endpoint)"

      - name: list_endpoint_pagination_defaults
        claim_type: listing
        grounds:
          - "response_envelope.pagination_defaults"
        distinguishing_aspect: "GET /campaigns with no limit/offset uses defaults limit=10, offset=0 and returns has_more."
        test_recipe:
          setup: ["empty DB; one campaign created"]
          setup_api_calls:
            - call: "POST /toy-drive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-drive/campaigns"
              payload: { season_year: 2026, intake_open_at: "2026-09-01T00:00:00Z", intake_close_at: "2026-10-15T00:00:00Z", gift_return_deadline: "2026-12-10T00:00:00Z", distribution_date: "2026-12-18T00:00:00Z", max_children_per_family: 6, max_gift_value_cents: 20000, min_gift_value_cents: 2000, backfill_budget_cents: 0 }
              as: PlatformAdmin
          trigger:
            - call: "GET /toy-drive/campaigns"
              payload: {}
              as: PlatformAdmin
          assert:
            - "response envelope contains pagination fields limit, offset, total_count, has_more"
            - "total_count == 1"
            - "has_more == false"

  # ===========================================================================
  # Section: state_machines — invalid transitions, terminal lockdown, idempotency
  # ===========================================================================
  - section: state_machines
    instances:
      - name: campaign_cannot_skip_from_draft_to_distribution
        claim_type: invalid_transition
        grounds:
          - "state_machines.Campaign"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "DRAFT -> advance is rejected; advance is only defined from MATCHING/DISTRIBUTION_PREP/DISTRIBUTION."
        test_recipe:
          setup: ["campaign in DRAFT"]
          setup_api_calls:
            - call: "POST /toy-drive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-drive/campaigns"
              payload: { season_year: 2026, intake_open_at: "2026-09-01T00:00:00Z", intake_close_at: "2026-10-15T00:00:00Z", gift_return_deadline: "2026-12-10T00:00:00Z", distribution_date: "2026-12-18T00:00:00Z", max_children_per_family: 6, max_gift_value_cents: 20000, min_gift_value_cents: 2000, backfill_budget_cents: 0 }
              as: PlatformAdmin
              captures:
                cid: "$.data.id"
                cv: "$.data.version"
          trigger:
            - call: "POST /toy-drive/campaigns/${cid}/advance"
              payload: { expected_campaign_version: "${cv}" }
              as: PlatformAdmin
              captures:
                err: "$.data.error_id"
          assert:
            - "err == ERR_INVALID_STATE"
            - "HTTP status == 409"
            - "Campaign.${cid}.status remains DRAFT"

      - name: family_terminal_rejected_locks_all_transitions
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Family"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Once REJECTED, every further transition trigger on the family fails."
        test_recipe:
          setup: ["family in REJECTED"]
          setup_api_calls:
            - call: "POST /toy-drive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-drive/campaigns"
              payload: { season_year: 2026, intake_open_at: "2026-09-01T00:00:00Z", intake_close_at: "2026-10-15T00:00:00Z", gift_return_deadline: "2026-12-10T00:00:00Z", distribution_date: "2026-12-18T00:00:00Z", max_children_per_family: 6, max_gift_value_cents: 20000, min_gift_value_cents: 2000, backfill_budget_cents: 0 }
              as: PlatformAdmin
              captures:
                camp_id: "$.data.id"
            - call: "POST /toy-drive/agencies"
              payload: { agency_code: "AGT1", legal_name: "Ag T1", referral_quota: 10, contact_email: "t1@x.org" }
              as: PlatformAdmin
              captures:
                ag_id: "$.data.id"
            - call: "POST /toy-drive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-drive/campaigns/${camp_id}/open-intake"
              payload: {}
              as: PlatformAdmin
            - call: "POST /toy-drive/families"
              payload: { agency_id: "${ag_id}", campaign_id: "${camp_id}", primary_caregiver_name: "P", caregiver_dob: "1990-01-01", household_size: 2, address_text: "1 T", phone_last4: "2222" }
              as: AgencyCoordinator
              as_user_id: "${ag_id}"
              captures:
                fam_id: "$.data.id"
            - call: "POST /toy-drive/families/${fam_id}/begin-review"
              payload: {}
              as: CaseWorker
              as_user_id: "cw_1"
            - call: "POST /toy-drive/families/${fam_id}/reject"
              payload: { verification_note: "no" }
              as: CaseWorker
              as_user_id: "cw_1"
          trigger:
            - call: "POST /toy-drive/families/${fam_id}/verify"
              payload: {}
              as: CaseWorker
              as_user_id: "cw_2"
              captures:
                err: "$.data.error_id"
          assert:
            - "err == ERR_INVALID_STATE"
            - "Family.${fam_id}.status remains REJECTED"

      - name: family_initial_state_is_referred
        claim_type: initial_state
        grounds:
          - "state_machines.Family"
        distinguishing_aspect: "POST /families always creates the row in REFERRED."
        test_recipe:
          setup: ["campaign INTAKE_OPEN, agency active"]
          setup_api_calls:
            - call: "POST /toy-drive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-drive/campaigns"
              payload: { season_year: 2026, intake_open_at: "2026-09-01T00:00:00Z", intake_close_at: "2026-10-15T00:00:00Z", gift_return_deadline: "2026-12-10T00:00:00Z", distribution_date: "2026-12-18T00:00:00Z", max_children_per_family: 6, max_gift_value_cents: 20000, min_gift_value_cents: 2000, backfill_budget_cents: 0 }
              as: PlatformAdmin
              captures:
                camp_id: "$.data.id"
            - call: "POST /toy-drive/agencies"
              payload: { agency_code: "AGT2", legal_name: "Ag T2", referral_quota: 10, contact_email: "t2@x.org" }
              as: PlatformAdmin
              captures:
                ag_id: "$.data.id"
            - call: "POST /toy-drive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-drive/campaigns/${camp_id}/open-intake"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /toy-drive/families"
              payload: { agency_id: "${ag_id}", campaign_id: "${camp_id}", primary_caregiver_name: "P", caregiver_dob: "1990-01-01", household_size: 2, address_text: "1 T", phone_last4: "2222" }
              as: AgencyCoordinator
              as_user_id: "${ag_id}"
              captures:
                st: "$.data.status"
          assert:
            - "st == REFERRED"

      - name: duplicate_flag_dismiss_is_idempotent_on_second_attempt
        claim_type: idempotency
        grounds:
          - "state_machines.DuplicateFlag"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Second dismiss on a DISMISSED flag is rejected with ERR_INVALID_STATE — no double-fire side effects."
        test_recipe:
          setup: ["two families with matching duplicate_hash; flag exists; flag already DISMISSED"]
          setup_api_calls:
            - call: "POST /toy-drive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-drive/campaigns"
              payload: { season_year: 2026, intake_open_at: "2026-09-01T00:00:00Z", intake_close_at: "2026-10-15T00:00:00Z", gift_return_deadline: "2026-12-10T00:00:00Z", distribution_date: "2026-12-18T00:00:00Z", max_children_per_family: 6, max_gift_value_cents: 20000, min_gift_value_cents: 2000, backfill_budget_cents: 0 }
              as: PlatformAdmin
              captures:
                camp_id: "$.data.id"
            - call: "POST /toy-drive/agencies"
              payload: { agency_code: "AGT3", legal_name: "Ag T3", referral_quota: 10, contact_email: "t3@x.org" }
              as: PlatformAdmin
              captures:
                ag_id: "$.data.id"
            - call: "POST /toy-drive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-drive/campaigns/${camp_id}/open-intake"
              payload: {}
              as: PlatformAdmin
            - call: "POST /toy-drive/families"
              payload: { agency_id: "${ag_id}", campaign_id: "${camp_id}", primary_caregiver_name: "Same", caregiver_dob: "1990-05-05", household_size: 2, address_text: "7 Dup", phone_last4: "7777" }
              as: AgencyCoordinator
              as_user_id: "${ag_id}"
              captures:
                fam_a: "$.data.id"
            - call: "POST /toy-drive/families"
              payload: { agency_id: "${ag_id}", campaign_id: "${camp_id}", primary_caregiver_name: "Same", caregiver_dob: "1990-05-05", household_size: 2, address_text: "7 Dup", phone_last4: "7777" }
              as: AgencyCoordinator
              as_user_id: "${ag_id}"
              captures:
                fam_b: "$.data.id"
            - call: "GET /toy-drive/duplicate-flags?family_id=${fam_b}"
              payload: {}
              as: PlatformAdmin
              captures:
                flag_id: "$.data[0].id"
            - call: "POST /toy-drive/duplicate-flags/${flag_id}/dismiss"
              payload: { resolution_note: "ok" }
              as: CaseWorker
              as_user_id: "cw_1"
          trigger:
            - call: "POST /toy-drive/duplicate-flags/${flag_id}/dismiss"
              payload: { resolution_note: "second" }
              as: CaseWorker
              as_user_id: "cw_1"
              captures:
                err: "$.data.error_id"
          assert:
            - "err == ERR_INVALID_STATE"
            - "DuplicateFlag.${flag_id}.status remains DISMISSED"

      - name: slot_checkin_outside_window_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.DistributionSlot.RESERVED_to_CHECKED_IN"
          - "errors[ERR_OUTSIDE_SLOT_WINDOW]"
        distinguishing_aspect: "current_utc < window_start fails ERR_OUTSIDE_SLOT_WINDOW (409), not ERR_INVALID_STATE."
        test_recipe:
          setup: ["slot RESERVED with window 10:00-11:00; clock is at 09:00"]
          setup_api_calls:
            - call: "POST /toy-drive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-drive/campaigns"
              payload: { season_year: 2026, intake_open_at: "2026-09-01T00:00:00Z", intake_close_at: "2026-10-15T00:00:00Z", gift_return_deadline: "2026-12-10T00:00:00Z", distribution_date: "2026-12-18T00:00:00Z", max_children_per_family: 6, max_gift_value_cents: 20000, min_gift_value_cents: 2000, backfill_budget_cents: 0 }
              as: PlatformAdmin
              captures:
                camp_id: "$.data.id"
            - call: "POST /toy-drive/agencies"
              payload: { agency_code: "AGT4", legal_name: "Ag T4", referral_quota: 10, contact_email: "t4@x.org" }
              as: PlatformAdmin
              captures:
                ag_id: "$.data.id"
            - call: "POST /toy-drive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-drive/campaigns/${camp_id}/open-intake"
              payload: {}
              as: PlatformAdmin
            - call: "POST /toy-drive/families"
              payload: { agency_id: "${ag_id}", campaign_id: "${camp_id}", primary_caregiver_name: "P", caregiver_dob: "1990-01-01", household_size: 2, address_text: "1 W", phone_last4: "3333" }
              as: AgencyCoordinator
              as_user_id: "${ag_id}"
              captures:
