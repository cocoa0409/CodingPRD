            - call: "POST /garment-styles/${style_id}/blank-skus"
              payload: { color: "BLACK", size: "L", total_stock_qty: 200 }
              as: ShopManager
              captures: { sku_id: $.data.id }
            - call: "POST /orders"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", requested_ship_date: "2026-06-20T00:00:00.000Z" }
              as: ShopManager
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /orders/${order_id}/lines"
              payload: { garment_style_id: "${style_id}", decoration_method_id: "${method_id}", color: "BLACK", num_locations: 1, num_colors: 1, size_run: { L: 50 } }
              as: ShopManager
            - call: "POST /orders/${order_id}/art-proofs"
              payload: { title: "Front", art_hash: "h1" }
              as: ArtStaff
              captures: { proof_id: $.data.id }
            - call: "POST /orders/${order_id}/art-proofs/${proof_id}/submit"
              payload: {}
              as: ArtStaff
            - call: "POST /orders/${order_id}/art-proofs/${proof_id}/approve"
              payload: { expected_order_version: "${order_v}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: ShopManager
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              payload: {}
              as: ShopManager
            - call: "GET /garment-styles/${style_id}/blank-skus/${sku_id}"
              payload: {}
              as: ShopManager
          assert:
            - "BlankSku.${sku_id}.on_hand_qty == 200 and BlankSku.${sku_id}.reserved_qty == 0 after cancel"
            - "Invariant on_hand_qty + reserved_qty == total_stock_qty == 200 holds (zero drift)"

      - name: customer_deposit_conserved_on_confirm_then_cancel
        grounds:
          - state_machines.Order.DRAFT_to_CONFIRMED
          - state_machines.Order.CONFIRMED_to_CANCELLED
          - entities.Customer.fields.outstanding_deposit_cents
          - entities.Order.fields.deposit_paid_cents
        distinguishing_aspect: "Different conserved quantity = money (deposit cents): confirm charges deposit ceil(grand 119400 * 0.5)=59700 onto Customer.outstanding_deposit_cents (0->59700); cancel refunds it (59700->0) and resets Order.deposit_paid_cents to 0 — the conserved deposit total returns to its 0 baseline."
        test_recipe:
          setup:
            - "Order with line {L:72} num_colors 3 num_locations 2 approved+CONFIRMED; grand_total 119400, deposit 59700 on Customer."
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Ink Co" }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", name: "Acme", email: "a@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /decoration-methods"
              payload: { shop_id: "${shop_id}", method_type: "SCREEN_PRINT", name: "Plastisol", extra_color_run_cents: 75, screen_fee_cents: 2500 }
              as: ShopManager
              captures: { method_id: $.data.id }
            - call: "POST /garment-styles"
