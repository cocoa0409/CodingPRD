            - { call: "POST /mga/programs/${prog}/rate-filings", payload: { state_code: "CA", filing_type: "RATE", base_rates: { ARTISAN: 1500 }, policy_fee_cents: 5000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: MGAUnderwriter, captures: { fil1: $.data.id } }
