scaffold_corner_design:
- section: entities
  instances:
  - name: principal_creation_defaults
    claim_type: creation
    grounds:
    - entities.Principal
    - 'endpoints: POST /principals'
    distinguishing_aspect: All-required-field create returns 201, server-minted UUID id, status defaulted to ACTIVE, version 1, ISO-8601 timestamps.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /principals
        payload:
          name: Apex Shipping
          contact_email: ops@apex.example
          credit_limit_cents: 5000000
        as: AgencyAdmin
        captures:
          p_id: $.data.id
      assert:
      - 201; Principal.${p_id}.status == ACTIVE (default applied)
      - id is a prefix-free UUID; version == 1; created_at/updated_at present with three fractional digits
  - name: principal_not_found
    claim_type: not_found
    grounds:
    - entities.Principal
    - errors[ERR_NOT_FOUND]
    distinguishing_aspect: GET with a well-formed but unknown UUID returns ERR_NOT_FOUND 404.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: GET /principals/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
        as: AgencyOps
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_NOT_FOUND with http 404
  - name: port_call_computed_fields_input_ignored
    claim_type: computed_fields
    grounds:
    - entities.PortCall.fields.alongside_days_estimated
    - entities.PortCall.fields.ops_status
    distinguishing_aspect: 'Client-supplied ops_status/alongside_days_estimated in the create body are ignored: the server computes both.'
    test_recipe:
      setup:
      - principal exists
      setup_api_calls:
      - call: POST /principals
        payload:
          name: Apex
          contact_email: a@x.example
          credit_limit_cents: 0
        as: AgencyAdmin
        captures:
          p_id: $.data.id
      trigger:
      - call: POST /port-calls
        payload:
          principal_id: ${p_id}
          vessel_name: SS Rye
          imo_number: '9000020'
          vessel_gt: 5000
          flag_state: PA
          port_code: NODUE
          eta: '2026-06-01T10:00:00Z'
          etd: '2026-06-03T11:00:00Z'
          cargo_description: general
          ops_status: SAILED
          alongside_days_estimated: 99
        as: AgencyOps
        as_user_id: ops-1
        captures:
          pc_id: $.data.id
      assert:
      - 201; PortCall.${pc_id}.ops_status == NOMINATED (input ignored)
      - alongside_days_estimated == 3 (ceil(49h/24) computed server-side, not 99)
  - name: port_call_missing_required_eta_returns_400
    claim_type: required_fields
    grounds:
    - entities.PortCall.fields.eta
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: Missing required input field eta yields ERR_INVALID_REQUEST 400 (shape check runs after all state/business checks pass).
    test_recipe:
      setup:
      - principal exists
      setup_api_calls:
      - call: POST /principals
        payload:
          name: Apex
          contact_email: a@x.example
          credit_limit_cents: 0
        as: AgencyAdmin
        captures:
          p_id: $.data.id
      trigger:
      - call: POST /port-calls
        payload:
          principal_id: ${p_id}
          vessel_name: SS Rye
          imo_number: '9000020'
          vessel_gt: 5000
          flag_state: PA
          port_code: NODUE
          etd: '2026-06-03T10:00:00Z'
          cargo_description: general
        as: AgencyOps
        as_user_id: ops-1
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_REQUEST with http 400
  - name: notification_invalid_enum_rejected
    claim_type: type_constraints
    grounds:
    - entities.AuthorityNotification.fields.authority_type
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: authority_type outside the declared enum is rejected with ERR_INVALID_REQUEST.
    test_recipe:
      setup:
      - principal + port call exist
      setup_api_calls:
      - call: POST /principals
        payload:
          name: Apex
          contact_email: a@x.example
          credit_limit_cents: 0
        as: AgencyAdmin
        captures:
          p_id: $.data.id
      - call: POST /port-calls
        payload:
          principal_id: ${p_id}
          vessel_name: SS Rye
          imo_number: '9000020'
          vessel_gt: 5000
          flag_state: PA
          port_code: NODUE
          eta: '2026-06-01T10:00:00Z'
          etd: '2026-06-02T10:00:00Z'
          cargo_description: general
        as: AgencyOps
        as_user_id: ops-1
        captures:
          pc_id: $.data.id
      trigger:
      - call: POST /authority-notifications
        payload:
          port_call_id: ${pc_id}
          authority_type: POLICE
          payload_summary: x
        as: AgencyOps
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_REQUEST with http 400
  - name: port_call_listing_pagination
    claim_type: listing
    grounds:
    - 'endpoints: GET /port-calls'
    - response_envelope
    distinguishing_aspect: limit/offset/total_count/has_more follow the fixed envelope defaults (default limit 10; has_more true when more rows exist).
    test_recipe:
      setup:
      - one principal with three port calls
      setup_api_calls:
      - call: POST /principals
        payload:
          name: Apex
          contact_email: a@x.example
          credit_limit_cents: 0
        as: AgencyAdmin
        captures:
          p_id: $.data.id
      - call: POST /port-calls
        payload:
          principal_id: ${p_id}
          vessel_name: V1
          imo_number: '9000101'
          vessel_gt: 5000
          flag_state: PA
          port_code: NODUE
          eta: '2026-06-01T10:00:00Z'
          etd: '2026-06-02T10:00:00Z'
          cargo_description: g
        as: AgencyOps
        as_user_id: ops-1
      - call: POST /port-calls
        payload:
          principal_id: ${p_id}
          vessel_name: V2
          imo_number: '9000102'
          vessel_gt: 5000
          flag_state: PA
          port_code: NODUE
          eta: '2026-06-01T10:00:00Z'
          etd: '2026-06-02T10:00:00Z'
          cargo_description: g
        as: AgencyOps
        as_user_id: ops-1
      - call: POST /port-calls
        payload:
          principal_id: ${p_id}
          vessel_name: V3
          imo_number: '9000103'
          vessel_gt: 5000
          flag_state: PA
          port_code: NODUE
          eta: '2026-06-01T10:00:00Z'
          etd: '2026-06-02T10:00:00Z'
          cargo_description: g
        as: AgencyOps
        as_user_id: ops-1
      trigger:
      - call: GET /port-calls?principal_id=${p_id}&limit=2&offset=0
        as: AgencyOps
      assert:
      - exactly 2 items returned; total_count == 3; has_more == true
      - second page (offset=2) returns 1 item with has_more == false
- section: state_machines
  instances:
  - name: ack_draft_notification_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.AuthorityNotification.SUBMITTED_to_ACKNOWLEDGED
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: acknowledge from DRAFT (skipping SUBMITTED) is rejected; no transition list admits DRAFT -> ACKNOWLEDGED.
    test_recipe:
      setup:
      - call with a DRAFT notification
      setup_api_calls:
      - call: POST /principals
        payload:
          name: Apex
          contact_email: a@x.example
          credit_limit_cents: 0
        as: AgencyAdmin
        captures:
          p_id: $.data.id
      - call: POST /port-calls
        payload:
          principal_id: ${p_id}
          vessel_name: SS Rye
          imo_number: '9000020'
          vessel_gt: 5000
          flag_state: PA
          port_code: NODUE
          eta: '2026-06-01T10:00:00Z'
          etd: '2026-06-02T10:00:00Z'
          cargo_description: g
        as: AgencyOps
        as_user_id: ops-1
        captures:
          pc_id: $.data.id
      - call: POST /authority-notifications
        payload:
          port_call_id: ${pc_id}
          authority_type: CUSTOMS
          payload_summary: x
        as: AgencyOps
        captures:
          n_id: $.data.id
      trigger:
      - call: POST /authority-notifications/${n_id}/acknowledge
        payload:
          authority_reference: X-1
        as: PortAuthority
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_STATE with http 409; status stays DRAFT; authority_reference stays null
  - name: cancel_terminal_service_order_rejected
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.ServiceOrder
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: A COMPLETED (terminal) ServiceOrder rejects cancel; terminal states admit no further transitions.
    test_recipe:
      setup:
      - SO driven ORDERED -> CONFIRMED -> IN_PROGRESS -> COMPLETED
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-06-04T09:30:00Z'
        as: AgencyAdmin
      - call: POST /principals
        payload:
          name: Apex
          contact_email: a@x.example
          credit_limit_cents: 0
        as: AgencyAdmin
        captures:
          p_id: $.data.id
      - call: POST /port-calls
        payload:
          principal_id: ${p_id}
          vessel_name: SS Rye
          imo_number: '9000020'
          vessel_gt: 5000
          flag_state: PA
          port_code: NODUE
          eta: '2026-06-04T08:00:00Z'
          etd: '2026-06-05T08:00:00Z'
          cargo_description: g
        as: AgencyOps
        as_user_id: ops-1
        captures:
          pc_id: $.data.id
      - call: POST /vendors
        payload:
          name: TugCo
          categories:
          - STORES
          contact_email: t@x.example
        as: AgencyAdmin
        captures:
          v_id: $.data.id
      - call: POST /service-orders
        payload:
          port_call_id: ${pc_id}
          kind: TUG
          vendor_id: ${v_id}
          resource_unit: TUG-1
          window_start: '2026-06-04T10:00:00Z'
          window_end: '2026-06-04T11:00:00Z'
          estimated_cents: 20000
        as: AgencyOps
        captures:
          so_id: $.data.id
      - call: POST /service-orders/${so_id}/confirm
        as: VendorRep
        as_user_id: ${v_id}
      - call: POST /service-orders/${so_id}/start
        as: AgencyOps
      - call: POST /service-orders/${so_id}/complete
        payload:
          actual_cents: 21000
        as: AgencyOps
      trigger:
      - call: POST /service-orders/${so_id}/cancel
        as: AgencyOps
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_STATE with http 409; status stays COMPLETED; actual_cents stays 21000
  - name: notification_submit_twice_rejected
    claim_type: idempotency
    grounds:
    - state_machines.AuthorityNotification.DRAFT_to_SUBMITTED
    distinguishing_aspect: Repeating the same trigger (submit) on an already-SUBMITTED notification fails on the second attempt.
    test_recipe:
      setup:
      - call with DRAFT notification
      setup_api_calls:
      - call: POST /principals
        payload:
          name: Apex
          contact_email: a@x.example
          credit_limit_cents: 0
        as: AgencyAdmin
        captures:
          p_id: $.data.id
      - call: POST /port-calls
        payload:
          principal_id: ${p_id}
          vessel_name: SS Rye
          imo_number: '9000020'
          vessel_gt: 5000
          flag_state: PA
          port_code: NODUE
          eta: '2026-06-01T10:00:00Z'
          etd: '2026-06-02T10:00:00Z'
          cargo_description: g
        as: AgencyOps
        as_user_id: ops-1
        captures:
          pc_id: $.data.id
      - call: POST /authority-notifications
        payload:
          port_call_id: ${pc_id}
          authority_type: IMMIGRATION
          payload_summary: x
        as: AgencyOps
        captures:
          n_id: $.data.id
      - call: POST /authority-notifications/${n_id}/submit
        as: AgencyOps
      trigger:
      - call: POST /authority-notifications/${n_id}/submit
        as: AgencyOps
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_STATE; revision_count stays 0; exactly one submission recorded
  - name: request_visa_when_not_required_rejected
    claim_type: precondition_enforcement
    grounds:
    - state_machines.CrewChange.DOCS_VERIFIED_to_VISA_PENDING
    - errors[ERR_VISA_NOT_REQUIRED]
    distinguishing_aspect: The visa branch is conditional on requires_visa == true; requesting a visa on a visa-free crew change fails.
    test_recipe:
      setup:
      - crew change REQUESTED with requires_visa false, docs verified
      setup_api_calls:
      - call: POST /principals
        payload:
          name: Apex
          contact_email: a@x.example
          credit_limit_cents: 0
        as: AgencyAdmin
        captures:
          p_id: $.data.id
      - call: POST /port-calls
        payload:
          principal_id: ${p_id}
          vessel_name: SS Rye
          imo_number: '9000020'
          vessel_gt: 5000
          flag_state: PA
          port_code: NODUE
          eta: '2026-06-01T10:00:00Z'
          etd: '2026-06-02T10:00:00Z'
          cargo_description: g
        as: AgencyOps
        as_user_id: ops-1
        captures:
          pc_id: $.data.id
      - call: POST /crew-changes
        payload:
          port_call_id: ${pc_id}
          full_name: A. Ng
          nationality: SG
          passport_no: S1
          passport_expiry: '2027-01-01T00:00:00Z'
          direction: ON_SIGNER
          requires_visa: false
        as: CrewingAgent
        captures:
          cc_id: $.data.id
      - call: POST /crew-changes/${cc_id}/verify-docs
        as: CrewingAgent
      trigger:
      - call: POST /crew-changes/${cc_id}/request-visa
        as: CrewingAgent
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_VISA_NOT_REQUIRED with http 422; status stays DOCS_VERIFIED
  - name: shore_pass_expiry_and_reissue_cycle
    claim_type: valid_transition
    grounds:
    - state_machines.CrewChange.SHORE_PASS_ISSUED_to_PASS_EXPIRED
    - state_machines.CrewChange.PASS_EXPIRED_to_SHORE_PASS_ISSUED
    distinguishing_aspect: Clock-driven lazy expiry flips SHORE_PASS_ISSUED -> PASS_EXPIRED on read; a fresh issue-shore-pass re-enters SHORE_PASS_ISSUED (loop), and complete from PASS_EXPIRED is impossible
      before re-issue.
    test_recipe:
      setup:
      - visa-free crew change at DOCS_VERIFIED; clock 2026-06-01T10:00
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-06-01T10:00:00Z'
        as: AgencyAdmin
      - call: POST /principals
        payload:
          name: Apex
          contact_email: a@x.example
          credit_limit_cents: 0
        as: AgencyAdmin
        captures:
          p_id: $.data.id
      - call: POST /port-calls
        payload:
          principal_id: ${p_id}
          vessel_name: SS Rye
          imo_number: '9000020'
          vessel_gt: 5000
          flag_state: PA
          port_code: NODUE
          eta: '2026-06-02T10:00:00Z'
          etd: '2026-06-04T10:00:00Z'
          cargo_description: g
        as: AgencyOps
        as_user_id: ops-1
        captures:
          pc_id: $.data.id
      - call: POST /crew-changes
        payload:
          port_call_id: ${pc_id}
          full_name: A. Ng
          nationality: SG
          passport_no: S1
          passport_expiry: '2027-01-01T00:00:00Z'
          direction: OFF_SIGNER
          requires_visa: false
        as: CrewingAgent
        captures:
          cc_id: $.data.id
      - call: POST /crew-changes/${cc_id}/verify-docs
        as: CrewingAgent
      trigger:
      - call: POST /crew-changes/${cc_id}/issue-shore-pass
        payload:
          shore_pass_expires_at: '2026-06-01T12:00:00Z'
        as: CrewingAgent
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-06-01T12:00:01Z'
        as: AgencyAdmin
      - call: GET /crew-changes/${cc_id}
        as: CrewingAgent
      - call: POST /crew-changes/${cc_id}/complete
        as: CrewingAgent
        captures:
          err: $.data.error_id
      - call: POST /crew-changes/${cc_id}/issue-shore-pass
        payload:
          shore_pass_expires_at: '2026-06-03T00:00:00Z'
        as: CrewingAgent
      - call: POST /crew-changes/${cc_id}/complete
        as: CrewingAgent
      assert:
      - 'after clock passes expiry: GET shows status == PASS_EXPIRED (lazy system transition)'
      - 'complete from PASS_EXPIRED: error_id == ERR_INVALID_STATE'
      - re-issue from PASS_EXPIRED succeeds -> SHORE_PASS_ISSUED; subsequent complete -> COMPLETED
  - name: create_notification_on_cancelled_call_rejected
    claim_type: guarded_transitions
    grounds:
    - validations[priority=9]
    - errors[ERR_PORT_CALL_NOT_EDITABLE]
    distinguishing_aspect: Child creation against a CANCELLED parent is rejected with ERR_PORT_CALL_NOT_EDITABLE (cross-entity guard on child create).
    test_recipe:
      setup:
      - port call cancelled from NOMINATED
      setup_api_calls:
      - call: POST /principals
        payload:
          name: Apex
          contact_email: a@x.example
          credit_limit_cents: 0
        as: AgencyAdmin
        captures:
          p_id: $.data.id
      - call: POST /port-calls
        payload:
          principal_id: ${p_id}
          vessel_name: SS Rye
          imo_number: '9000020'
          vessel_gt: 5000
          flag_state: PA
          port_code: NODUE
          eta: '2026-06-01T10:00:00Z'
          etd: '2026-06-02T10:00:00Z'
          cargo_description: g
        as: AgencyOps
        as_user_id: ops-1
        captures:
          pc_id: $.data.id
      - call: POST /port-calls/${pc_id}/cancel
        as: AgencyOps
      trigger:
      - call: POST /authority-notifications
        payload:
          port_call_id: ${pc_id}
          authority_type: CUSTOMS
          payload_summary: x
        as: AgencyOps
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_PORT_CALL_NOT_EDITABLE with http 422
  - name: po_dispute_fork_is_branch_not_error
    claim_type: side_effect_execution
    grounds:
    - state_machines.PurchaseOrder.INVOICED_to_DISPUTED
    - calculations.po_variance_calc
    excluded_because:
      difficulty_instance: po_invoice_dispute_cycle
      rationale: The INVOICED<->DISPUTED fork branches and their divergent side effects are asserted in the named §1.8 instance.
  - name: port_call_auto_terminal_via_children
    claim_type: compound_parent_derivation
    grounds:
    - state_machines.PortCall
    excluded_because:
      difficulty_instance: port_call_cancel_depth3_cascade
      rationale: Parent/child state coupling is exercised via the cancel cascade; no auto-derive rule exists beyond it.
- section: calculations
  instances:
  - name: late_cancel_fee_cutoff_boundary
    claim_type: correct_result
    grounds:
    - calculations.late_cancel_fee_calc
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: 'Threshold boundary: cancellation at exactly window_start - 2h is NOT late (fee 0, strictly-greater comparison); one second later incurs 25% = 5000 cents and appends a CANCELLATION_FEE
      line.'
    test_recipe:
      setup:
      - Two TUG orders on different resource units, window_start 2026-06-05T12:00:00Z, estimated 20000, both CONFIRMED; DA PRO_FORMA exists so fee lines land
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-01T00:00:00Z'
        as: AgencyAdmin
      - call: POST /principals
        payload:
          name: Apex
          contact_email: a@x.example
          credit_limit_cents: 0
        as: AgencyAdmin
        captures:
          p_id: $.data.id
      - call: POST /port-calls
        payload:
          principal_id: ${p_id}
          vessel_name: SS Rye
          imo_number: '9000020'
          vessel_gt: 5000
          flag_state: PA
          port_code: NODUE
          eta: '2026-06-05T08:00:00Z'
          etd: '2026-06-06T08:00:00Z'
          cargo_description: g
        as: AgencyOps
        as_user_id: ops-1
        captures:
          pc_id: $.data.id
          pc_v: $.data.version
      - call: POST /disbursement-accounts
        payload:
          port_call_id: ${pc_id}
          expected_port_call_version: ${pc_v}
        as: AgencyOps
        as_user_id: ops-1
        captures:
          da_id: $.data.id
      - call: POST /vendors
        payload:
          name: TugCo
          categories:
          - STORES
          contact_email: t@x.example
        as: AgencyAdmin
        captures:
          v_id: $.data.id
      - call: POST /service-orders
        payload:
          port_call_id: ${pc_id}
          kind: TUG
          vendor_id: ${v_id}
          resource_unit: TUG-1
          window_start: '2026-06-05T12:00:00Z'
          window_end: '2026-06-05T13:00:00Z'
          estimated_cents: 20000
        as: AgencyOps
        captures:
          so_a: $.data.id
      - call: POST /service-orders
        payload:
          port_call_id: ${pc_id}
          kind: TUG
          vendor_id: ${v_id}
          resource_unit: TUG-2
          window_start: '2026-06-05T12:00:00Z'
          window_end: '2026-06-05T13:00:00Z'
          estimated_cents: 20000
        as: AgencyOps
        captures:
          so_b: $.data.id
      - call: POST /service-orders/${so_a}/confirm
        as: VendorRep
        as_user_id: ${v_id}
      - call: POST /service-orders/${so_b}/confirm
        as: VendorRep
        as_user_id: ${v_id}
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-06-05T10:00:00Z'
        as: AgencyAdmin
      trigger:
      - call: POST /service-orders/${so_a}/cancel
        as: AgencyOps
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-06-05T10:00:01Z'
        as: AgencyAdmin
      - call: POST /service-orders/${so_b}/cancel
        as: AgencyOps
      assert:
      - 'ServiceOrder.${so_a}.cancellation_fee_cents == 0 (exactly at cutoff: not late)'
      - ServiceOrder.${so_b}.cancellation_fee_cents == 5000 (one second inside the cutoff)
      - DA ${da_id} gains exactly one CANCELLATION_FEE DALine with actual_cents == 5000, status ACTUALIZED
      - both mirror lines reversed to estimated_cents == 0
  - name: po_variance_exact_tolerance_boundary
    claim_type: correct_result
    grounds:
    - calculations.po_variance_calc
    - state_machines.PurchaseOrder.DELIVERED_to_INVOICED
    distinguishing_aspect: Exactly 10.0% over (11000 on 10000) is WITHIN tolerance (INVOICED); 11001 crosses to 10.01% and forks to DISPUTED — the boundary is inclusive-below.
