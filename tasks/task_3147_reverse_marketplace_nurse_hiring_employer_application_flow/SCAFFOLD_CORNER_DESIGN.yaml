              as_user_id: "${emp_id}"
            - call: "GET /marketplace/requisitions/${req_id}/matches"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
          assert:
            - "after the first generation the list had exactly 1 row (nurse ${nurse_id})"
