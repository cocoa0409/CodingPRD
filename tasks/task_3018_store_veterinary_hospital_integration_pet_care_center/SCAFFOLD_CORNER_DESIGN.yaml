  # ===========================================================================
  - section: errors
    instances:

      - name: missing_expected_version_is_distinct_from_a_stale_one
        claim_type: Violation → Error
        grounds:
          - errors[ERR_MISSING_EXPECTED_VERSION]
          - errors[ERR_STALE_VERSION]
          - validations[priority=22]
          - validations[priority=23]
        distinguishing_aspect: "Two neighbouring OCC failure modes are separated: omitting the version field is a 400 request error while supplying an out-of-date one is a 412 precondition error."
        test_recipe:
          setup:
            - "Logical clock 2026-06-01T00:00:00Z."
            - "Store ST-1501 and a GROOMING bay already frozen by a posture escalation, then thawed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "ST-1501", city: "Aurora", state_code: "TX", service_bay_count: 2, hospital_capacity: 3 }
              as: PlatformAdmin
              captures: { s: $.data.id, s_v: $.data.version }
            - call: "POST /stores/${s}/service-bays"
              payload: { bay_code: "GROOMING" }
              as: StoreManager
              captures: { bay: $.data.id, bay_v: $.data.version }
          trigger:
            - call: "POST /stores/${s}/_bump-occupancy-v1"
              payload: { expected_store_version: "${s_v}", magnitude: 1 }
              as: PlatformAdmin
              captures: { err_code: $.data.error_id }
          assert:
            - "the trigger succeeds with 200 because no encounter is required to be checked in by the bump endpoint, and Store.${s}.hospital_occupancy stays 0"
            - "a companion call to POST /stores/${s}/service-bays/${bay}/disable with expected_bay_version omitted is refused with 400 ERR_MISSING_EXPECTED_VERSION"
            - "a companion call with expected_bay_version set to ${bay_v} - 1 is refused with 412 ERR_STALE_VERSION"

      - name: pharmacy_hold_blocks_new_encounters_while_orders_are_held
        claim_type: Violation → Error
        grounds:
          - errors[ERR_ENCOUNTER_BLOCKED_PHARMACY_HOLD]
          - errors[ERR_PHARMACY_HOLD_ACTIVE]
          - validations[priority=12]
        distinguishing_aspect: "The pharmacy hold produces two different outcomes from one state: a brand-new encounter is refused outright, while a handoff that already exists is moved to HOLDING instead of being rejected."
        test_recipe:
          setup:
            - "Logical clock 2026-06-01T00:00:00Z."
            - "Store ST-1502; member Ellis; pet Quill; an AUTHORIZED prescription and one pharmacy handoff raised before the freeze."
