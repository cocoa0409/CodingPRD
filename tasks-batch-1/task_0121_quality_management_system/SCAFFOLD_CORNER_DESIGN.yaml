              payload: { title: "sc ncr", source: "SUPPLIER", severity: "MAJOR", defect_qty: 1, unit_cost_cents: 100, part_number: "P-SC", supplier_id: "${sup_id}" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { ncr_id: $.data.id }
            - call: "POST /nonconformance-reports/${ncr_id}/open"
              payload: {}
              as: QualityEngineer
              as_user_id: "${qe_id}"
            - call: "POST /scars"
              payload: { ncr_id: "${ncr_id}", supplier_id: "${sup_id}", due_at: "2026-09-01T00:00:00Z" }
              as: QualityManager
              captures: { scar_id: $.data.id }
            - call: "POST /scars/${scar_id}/transition"
              payload: { action: "ACKNOWLEDGE" }
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /scars/${scar_id}/transition"
              payload: { action: "RESPOND", response_narrative: "first attempt" }
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /scars/${scar_id}/transition"
              payload: { action: "REJECT_RESPONSE" }
              as: QualityManager
          trigger:
            - call: "POST /scars/${scar_id}/transition"
              payload: { action: "RESPOND", response_narrative: "second attempt" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { rc: $.data.rejection_count }
          assert:
            - "http_status == 200"
            - "Scar.${scar_id}.status == RESPONDED"
            - "Scar.${scar_id}.rejection_count == 1"

      # ---- branch sibling: CLOSE_INEFFECTIVE leaves NCR in CAPA_IN_PROGRESS ----
      - name: capa_close_ineffective_no_ncr_cascade
        claim_type: branching
        grounds:
          - state_machines.Capa.EFFECTIVENESS_CHECK_to_CLOSED_INEFFECTIVE
          - state_machines.NonconformanceReport.CAPA_IN_PROGRESS_to_CLOSED
          - entities.Capa.fields.final_effectiveness
        distinguishing_aspect: "Branch sibling of CLOSE_EFFECTIVE: CLOSE_INEFFECTIVE moves the CAPA EFFECTIVENESS_CHECK->CLOSED_INEFFECTIVE (computes final_effectiveness=0.60 from recurred_defects=2/dq=5) but the divergent side-effect set leaves the parent NCR in CAPA_IN_PROGRESS (no cascade to CLOSED)."
        test_recipe:
          setup:
            - "A QualityEngineer and an independent QualityManager and a Supplier exist."
            - "A SUPPLIER NCR (defect_qty=5) is REWORK-dispositioned, a CAPA opened, steps D1/D4(containment=3)/D8(recurred=2) recorded, advanced and VERIFIED into EFFECTIVENESS_CHECK (provisional 0.60 passes the 0.50 gate)."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QE In", email: "qein@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "QM In", email: "qmin@x.com", role: "QUALITY_MANAGER" }
              as: QualityManager
              captures: { qm_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "In Co", code: "IN-SUP" }
              as: QualityManager
              captures: { sup_id: $.data.id }
            - call: "POST /nonconformance-reports"
              payload: { title: "in ncr", source: "SUPPLIER", severity: "MAJOR", defect_qty: 5, unit_cost_cents: 1000, part_number: "P-IN", supplier_id: "${sup_id}", rework_hours: 2.0 }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { ncr_id: $.data.id }
            - call: "POST /nonconformance-reports/${ncr_id}/open"
              payload: {}
              as: QualityEngineer
              as_user_id: "${qe_id}"
            - call: "POST /nonconformance-reports/${ncr_id}/disposition"
              payload: { disposition: "REWORK" }
              as: QualityManager
              as_user_id: "${qm_id}"
            - call: "POST /capas"
              payload: { ncr_id: "${ncr_id}", title: "in 8d" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { capa_id: $.data.id }
            - call: "POST /capas/${capa_id}/steps"
              payload: { discipline: "D1", narrative: "team" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
            - call: "POST /capas/${capa_id}/steps"
              payload: { discipline: "D4", narrative: "root cause", containment_count: 3 }
              as: QualityEngineer
              as_user_id: "${qe_id}"
            - call: "POST /capas/${capa_id}/steps"
              payload: { discipline: "D8", narrative: "monitor", recurred_defects: 2 }
              as: QualityEngineer
              as_user_id: "${qe_id}"
            - call: "POST /capas/${capa_id}/transition"
              payload: { action: "ADVANCE" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
            - call: "POST /capas/${capa_id}/transition"
              payload: { action: "ADVANCE" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
            - call: "POST /capas/${capa_id}/transition"
              payload: { action: "VERIFY" }
              as: QualityManager
              as_user_id: "${qm_id}"
          trigger:
            - call: "POST /capas/${capa_id}/transition"
              payload: { action: "CLOSE_INEFFECTIVE" }
              as: QualityManager
              as_user_id: "${qm_id}"
              captures: { fe: $.data.final_effectiveness }
            - call: "GET /nonconformance-reports/${ncr_id}"
              payload: {}
              as: QualityManager
              as_user_id: "${qm_id}"
          assert:
            - "Capa.${capa_id}.status == CLOSED_INEFFECTIVE"
            - "Capa.${capa_id}.final_effectiveness == 0.60"
            - "NonconformanceReport.${ncr_id}.status == CAPA_IN_PROGRESS"

      # ---- STUBS: state-machine corners already exercised by §1.8 ----
      - name: capa_close_effective_cascade_ncr_to_closed
        claim_type: side_effect_execution
        grounds:
          - state_machines.Capa.EFFECTIVENESS_CHECK_to_CLOSED_EFFECTIVE
          - state_machines.NonconformanceReport.CAPA_IN_PROGRESS_to_CLOSED
        excluded_because:
          difficulty_instance: transitive_cascade / capa_close_cascades_ncr_scar_supplier_depth3
          rationale: "The depth-3 cascade §1.8 instance asserts the full CLOSE_EFFECTIVE -> NCR CLOSED -> Scar RESOLVED -> Supplier rating chain, covering this side-effect-execution corner."

      - name: scar_resolved_via_ncr_closed_cascade
        claim_type: side_effect_execution
        grounds:
          - state_machines.Scar.ACCEPTED_RESPONSE_to_RESOLVED
        excluded_because:
          difficulty_instance: transitive_cascade / capa_close_cascades_ncr_scar_supplier_depth3
          rationale: "Scar ACCEPTED_RESPONSE->RESOLVED is asserted as hop 2 of the named §1.8 depth-3 cascade."

      - name: lot_disposition_reject_tightens_plan
        claim_type: side_effect_execution
        grounds:
          - state_machines.InspectionLot.IN_INSPECTION_to_REJECTED
          - entities.InspectionPlan.fields.severity_mode
        excluded_because:
          difficulty_instance: transitive_cascade / lot_reject_cascades_consecutive_then_tightened_depth2
          rationale: "The NORMAL->TIGHTENED side-effect at 2 consecutive rejects is asserted by the named §1.8 depth-2 cascade instance."

      - name: capa_verification_reject_cycles_back_clears_provisional
        claim_type: cyclic
        grounds:
          - state_machines.Capa.VERIFICATION_to_ROOT_CAUSE
          - entities.Capa.fields.rework_loops
        excluded_because:
          difficulty_instance: non_linear_state_machine / capa_verification_cycle_back_to_root_cause
          rationale: "The cyclic Capa back-edge (rework_loops increment, provisional cleared) is the subject of the named §1.8 instance."

      - name: ncr_disposition_branch_divergent_side_effects
        claim_type: branching
        grounds:
          - state_machines.NonconformanceReport.OPEN_to_DISPOSITIONED
          - entities.NonconformanceReport.fields.disposition
        excluded_because:
          difficulty_instance: non_linear_state_machine / ncr_disposition_branching_fork_divergent_cost
          rationale: "The OPEN->DISPOSITIONED branching fork with divergent cost branches is the subject of the named §1.8 instance."

      - name: lot_disposition_accept_at_acceptance_number
        claim_type: valid_transition
        grounds:
          - state_machines.InspectionLot.IN_INSPECTION_to_ACCEPTED
        excluded_because:
          difficulty_instance: boundary_precision_check / lot_defects_equal_acceptance_number_accepts
          rationale: "The valid IN_INSPECTION->ACCEPTED transition at defects_found==Ac is asserted by the named §1.8 boundary instance."

  # ===========================================================================
  # Section 3 — From Table 3 (Calculations)
  # ===========================================================================
  - section: calculations
    instances:
      # ---- aql_sampling correct result on a DIFFERENT code letter (D) ----
      - name: aql_sampling_code_letter_d_normal_correct_result
        claim_type: correct_result
        grounds:
          - calculations.aql_sampling
          - state_machines.InspectionLot.PENDING_to_IN_INSPECTION
          - entities.InspectionLot.fields.sample_size
          - entities.InspectionLot.fields.acceptance_number
          - entities.InspectionLot.fields.rejection_number
        distinguishing_aspect: "On START, NORMAL plan lot_size=40 (band 26..50 -> code letter D), aql_pct=2.5, GII resolves LOOKUP cell (D,2.5)={n:8,Ac:0}, so sample_size=8, acceptance_number=0, rejection_number=Ac+1=1 — a constants-table lookup distinct from the §1.8 code-letter-F case."
        test_recipe:
          setup:
            - "An Inspector, a Supplier, a ControlPlan and an InspectionPlan(lot_size=40, aql_pct=2.5, GII, NORMAL) exist; a PENDING lot is created."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Insp Cd", email: "inspcd@x.com", role: "INSPECTOR" }
              as: QualityManager
              captures: { insp_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Cd Co", code: "CD-SUP" }
              as: QualityManager
              captures: { sup_id: $.data.id }
            - call: "POST /control-plans"
              payload: { name: "CP Cd", part_number: "P-CD" }
              as: QualityManager
              captures: { cp_id: $.data.id }
            - call: "POST /inspection-plans"
              payload: { name: "IP Cd", control_plan_id: "${cp_id}", part_number: "P-CD", lot_size: 40, aql_pct: 2.5, inspection_level: "GII" }
              as: QualityManager
              captures: { ip_id: $.data.id }
            - call: "POST /inspection-lots"
              payload: { inspection_plan_id: "${ip_id}", supplier_id: "${sup_id}", actual_lot_size: 40 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /inspection-lots/${lot_id}/transition"
              payload: { action: "START" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { n: $.data.sample_size, ac: $.data.acceptance_number, re: $.data.rejection_number }
          assert:
            - "InspectionLot.${lot_id}.sample_size == 8"
            - "InspectionLot.${lot_id}.acceptance_number == 0"
            - "InspectionLot.${lot_id}.rejection_number == 1"
            - "InspectionLot.${lot_id}.severity_mode_used == NORMAL"

      # ---- aql_sampling input_set: code letter uses plan lot_size, not actual_lot_size ----
      - name: aql_sampling_uses_plan_lot_size_not_actual
        claim_type: input_set_filtering
        grounds:
          - calculations.aql_sampling
          - entities.InspectionPlan.fields.lot_size
          - entities.InspectionLot.fields.actual_lot_size
          - entities.InspectionLot.fields.sample_size
        distinguishing_aspect: "The code letter is resolved from the PLAN's nominal lot_size (60 -> band 51..90 -> E), NOT the lot's actual_lot_size (300): (E,1.0)={n:13,Ac:0} so sample_size=13, proving actual_lot_size is excluded from the lookup."
        test_recipe:
          setup:
            - "An Inspector, a Supplier, a ControlPlan and an InspectionPlan(lot_size=60, aql_pct=1.0, GII) exist; a PENDING lot with actual_lot_size=300 is created."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Insp Ls", email: "inspls@x.com", role: "INSPECTOR" }
              as: QualityManager
              captures: { insp_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Ls Co", code: "LS-SUP" }
              as: QualityManager
              captures: { sup_id: $.data.id }
            - call: "POST /control-plans"
              payload: { name: "CP Ls", part_number: "P-LS" }
              as: QualityManager
              captures: { cp_id: $.data.id }
            - call: "POST /inspection-plans"
              payload: { name: "IP Ls", control_plan_id: "${cp_id}", part_number: "P-LS", lot_size: 60, aql_pct: 1.0, inspection_level: "GII" }
              as: QualityManager
              captures: { ip_id: $.data.id }
            - call: "POST /inspection-lots"
              payload: { inspection_plan_id: "${ip_id}", supplier_id: "${sup_id}", actual_lot_size: 300 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /inspection-lots/${lot_id}/transition"
              payload: { action: "START" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { n: $.data.sample_size, ac: $.data.acceptance_number }
          assert:
            - "InspectionLot.${lot_id}.sample_size == 13"
            - "InspectionLot.${lot_id}.acceptance_number == 0"

      # ---- ncr_cost_of_quality SCRAP precision/constants on MINOR (distinct from §1.8 SCRAP/MAJOR) ----
      - name: ncr_cost_of_quality_use_as_is_concession_precision
        claim_type: precision
        grounds:
          - calculations.ncr_cost_of_quality
          - state_machines.NonconformanceReport.OPEN_to_DISPOSITIONED
          - entities.NonconformanceReport.fields.cost_of_quality_cents
        distinguishing_aspect: "USE_AS_IS branch with constants USE_AS_IS_CONCESSION_PCT=0.30 and SEVERITY_WEIGHT MINOR=0.5 applied with round_half_up per line: unit_cost_component=round_half_up(1000*0.30)=300, per-line=round_half_up(300*0.5)=150, sum over defect_qty=3 = 450."
        test_recipe:
          setup:
            - "A QualityEngineer and an independent QualityManager and a Supplier exist; clock 2026-06-15."
            - "A SUPPLIER NCR (severity=MINOR, defect_qty=3, unit_cost_cents=1000) is OPEN; an APPROVED in-window Deviation (max_qty=5) exists for it."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QE Pc", email: "qepc@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "QM Pc", email: "qmpc@x.com", role: "QUALITY_MANAGER" }
              as: QualityManager
              captures: { qm_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Pc Co", code: "PC-SUP" }
              as: QualityManager
              captures: { sup_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: QualityManager
            - call: "POST /nonconformance-reports"
              payload: { title: "pc ncr", source: "SUPPLIER", severity: "MINOR", defect_qty: 3, unit_cost_cents: 1000, part_number: "P-PC", supplier_id: "${sup_id}" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { ncr_id: $.data.id }
            - call: "POST /nonconformance-reports/${ncr_id}/open"
              payload: {}
              as: QualityEngineer
              as_user_id: "${qe_id}"
            - call: "POST /deviations"
              payload: { ncr_id: "${ncr_id}", supplier_id: "${sup_id}", part_number: "P-PC", valid_from: "2026-06-01T00:00:00Z", valid_to: "2026-12-01T00:00:00Z", max_qty: 5 }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /deviations/${dev_id}/transition"
              payload: { action: "APPROVE" }
              as: QualityManager
              as_user_id: "${qm_id}"
          trigger:
            - call: "POST /nonconformance-reports/${ncr_id}/disposition"
              payload: { disposition: "USE_AS_IS" }
              as: QualityManager
              as_user_id: "${qm_id}"
              captures: { coq: $.data.cost_of_quality_cents }
          assert:
            - "NonconformanceReport.${ncr_id}.disposition == USE_AS_IS"
            - "NonconformanceReport.${ncr_id}.cost_of_quality_cents == 450"

      # ---- supplier_quality_rating input_set filtering: only dispositioned lots count ----
      - name: supplier_rating_excludes_pending_and_in_inspection_lots
        claim_type: input_set_filtering
        grounds:
          - calculations.supplier_quality_rating
          - entities.Supplier.fields.lots_inspected
          - entities.Supplier.fields.quality_rating
          - state_machines.InspectionLot.IN_INSPECTION_to_ACCEPTED
        distinguishing_aspect: "Only dispositioned (ACCEPTED/REJECTED) lots enter the rating: one ACCEPTED lot gives lots_inspected=1, lots_rejected=0; a separately created PENDING lot does NOT increment lots_inspected, so lot_factor=1.0 and quality_rating stays 100.00."
        test_recipe:
          setup:
            - "An Inspector and a Supplier and a ControlPlan and an InspectionPlan exist."
            - "One lot is ACCEPTED; a second lot is created and left PENDING (never started/dispositioned)."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Insp If", email: "inspif@x.com", role: "INSPECTOR" }
              as: QualityManager
              captures: { insp_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "If Co", code: "IF-SUP" }
              as: QualityManager
              captures: { sup_id: $.data.id }
            - call: "POST /control-plans"
              payload: { name: "CP If", part_number: "P-IF" }
              as: QualityManager
              captures: { cp_id: $.data.id }
            - call: "POST /inspection-plans"
              payload: { name: "IP If", control_plan_id: "${cp_id}", part_number: "P-IF", lot_size: 120, aql_pct: 4.0, inspection_level: "GII" }
              as: QualityManager
              captures: { ip_id: $.data.id }
            - call: "POST /inspection-lots"
              payload: { inspection_plan_id: "${ip_id}", supplier_id: "${sup_id}", actual_lot_size: 120 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { lot1_id: $.data.id }
            - call: "POST /inspection-lots/${lot1_id}/transition"
              payload: { action: "START" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection-lots/${lot1_id}/transition"
              payload: { action: "DISPOSITION", defects_found: 0 }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection-lots"
              payload: { inspection_plan_id: "${ip_id}", supplier_id: "${sup_id}", actual_lot_size: 120 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { lot2_id: $.data.id }
          trigger:
            - call: "GET /suppliers/${sup_id}"
              payload: {}
              as: QualityManager
              captures: { li: $.data.lots_inspected, qr: $.data.quality_rating }
          assert:
            - "Supplier.${sup_id}.lots_inspected == 1"
            - "Supplier.${sup_id}.lots_rejected == 0"
            - "Supplier.${sup_id}.quality_rating == 100.00"

      # ---- supplier_quality_rating threshold band: DISQUALIFIED below 50 ----
      - name: supplier_rating_band_disqualified_below_probation_at
        claim_type: constants_applied
        grounds:
          - calculations.supplier_quality_rating
          - entities.Supplier.fields.approval_status
          - state_machines.InspectionLot.IN_INSPECTION_to_REJECTED
        distinguishing_aspect: "approval_status band uses constants APPROVE_AT=70, PROBATION_AT=50 inclusively: a supplier with one REJECTED lot (lot_factor=0, base=0.4) scores quality_rating=40.00, below PROBATION_AT=50, so approval_status=DISQUALIFIED."
        test_recipe:
          setup:
            - "An Inspector and a Supplier and a ControlPlan and an InspectionPlan exist; one lot is REJECTED (lots_inspected=1, lots_rejected=1)."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Insp Dq", email: "inspdq@x.com", role: "INSPECTOR" }
              as: QualityManager
              captures: { insp_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Dq Co", code: "DQ-SUP" }
              as: QualityManager
              captures: { sup_id: $.data.id }
            - call: "POST /control-plans"
              payload: { name: "CP Dq", part_number: "P-DQ" }
              as: QualityManager
              captures: { cp_id: $.data.id }
            - call: "POST /inspection-plans"
              payload: { name: "IP Dq", control_plan_id: "${cp_id}", part_number: "P-DQ", lot_size: 120, aql_pct: 4.0, inspection_level: "GII" }
              as: QualityManager
              captures: { ip_id: $.data.id }
            - call: "POST /inspection-lots"
              payload: { inspection_plan_id: "${ip_id}", supplier_id: "${sup_id}", actual_lot_size: 120 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /inspection-lots/${lot_id}/transition"
              payload: { action: "START" }
              as: Inspector
              as_user_id: "${insp_id}"
          trigger:
            - call: "POST /inspection-lots/${lot_id}/transition"
              payload: { action: "DISPOSITION", defects_found: 3 }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "GET /suppliers/${sup_id}"
              payload: {}
              as: QualityManager
              captures: { qr: $.data.quality_rating, ap: $.data.approval_status }
          assert:
            - "Supplier.${sup_id}.quality_rating == 40.00"
            - "Supplier.${sup_id}.approval_status == DISQUALIFIED"

      # ---- capa_effectiveness variant selection: provisional gate blocks VERIFY below 0.50 ----
      - name: capa_provisional_below_gate_blocks_verify
        claim_type: variant_selection
        grounds:
          - calculations.capa_effectiveness
          - state_machines.Capa.VERIFICATION_to_EFFECTIVENESS_CHECK
          - validations[priority=15]
          - entities.Capa.fields.provisional_effectiveness
          - errors[ERR_EFFECTIVENESS_TOO_LOW]
        distinguishing_aspect: "Provisional variant selected at VERIFICATION entry: containment_count=2 / defect_qty=5 = 0.40, below the 0.50 VERIFY gate, so action=VERIFY is rejected with ERR_EFFECTIVENESS_TOO_LOW (409)."
        test_recipe:
          setup:
            - "A QualityEngineer and an independent QualityManager and a Supplier exist."
            - "A SUPPLIER NCR (defect_qty=5) is REWORK-dispositioned, a CAPA opened, D1 + D4(containment_count=2) recorded, advanced to VERIFICATION (provisional_effectiveness=0.40)."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QE Pg", email: "qepg@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "QM Pg", email: "qmpg@x.com", role: "QUALITY_MANAGER" }
              as: QualityManager
              captures: { qm_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Pg Co", code: "PG-SUP" }
              as: QualityManager
              captures: { sup_id: $.data.id }
            - call: "POST /nonconformance-reports"
              payload: { title: "pg ncr", source: "SUPPLIER", severity: "MAJOR", defect_qty: 5, unit_cost_cents: 1000, part_number: "P-PG", supplier_id: "${sup_id}", rework_hours: 2.0 }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { ncr_id: $.data.id }
            - call: "POST /nonconformance-reports/${ncr_id}/open"
              payload: {}
              as: QualityEngineer
              as_user_id: "${qe_id}"
            - call: "POST /nonconformance-reports/${ncr_id}/disposition"
              payload: { disposition: "REWORK" }
              as: QualityManager
              as_user_id: "${qm_id}"
            - call: "POST /capas"
              payload: { ncr_id: "${ncr_id}", title: "pg 8d" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { capa_id: $.data.id }
            - call: "POST /capas/${capa_id}/steps"
              payload: { discipline: "D1", narrative: "team" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
            - call: "POST /capas/${capa_id}/steps"
              payload: { discipline: "D4", narrative: "root cause", containment_count: 2 }
              as: QualityEngineer
              as_user_id: "${qe_id}"
            - call: "POST /capas/${capa_id}/transition"
              payload: { action: "ADVANCE" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
            - call: "POST /capas/${capa_id}/transition"
              payload: { action: "ADVANCE" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
          trigger:
            - call: "POST /capas/${capa_id}/transition"
              payload: { action: "VERIFY" }
              as: QualityManager
              as_user_id: "${qm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Capa.${capa_id}.provisional_effectiveness == 0.40"
            - "response_type == error"
            - "http_status == 409"
            - "data.error_id == ERR_EFFECTIVENESS_TOO_LOW"
            - "Capa.${capa_id}.status == VERIFICATION"

      # ---- STUBS: calculation corners already exercised by §1.8 ----
      - name: capa_effectiveness_dual_variant_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.capa_effectiveness
          - entities.Capa.fields.provisional_effectiveness
          - entities.Capa.fields.final_effectiveness
        excluded_because:
          difficulty_instance: dual_variant_calc / capa_effectiveness_provisional_vs_final
          rationale: "Provisional (0.60) vs final (1.00) divergence on the same CAPA is the subject of the named §1.8 dual-variant instance."

      - name: aql_sampling_variant_divergence_normal_vs_tightened
        claim_type: variant_divergence
        grounds:
          - calculations.aql_sampling
          - entities.InspectionLot.fields.acceptance_number
        excluded_because:
          difficulty_instance: dual_variant_calc / aql_sampling_normal_vs_tightened
          rationale: "NORMAL (Ac=2) vs TIGHTENED (Ac=1) divergence flipping the same defects_found is the subject of the named §1.8 dual-variant instance."

      - name: supplier_quality_rating_correct_three_factor
        claim_type: correct_result
        grounds:
          - calculations.supplier_quality_rating
          - entities.Supplier.fields.quality_rating
        excluded_because:
          difficulty_instance: combinatorial_formula / supplier_quality_rating_three_factor_min_max
          rationale: "The three-factor min/max weighted result (57.00, PROBATION) is computed and asserted by the named §1.8 instance."

      - name: ncr_cost_of_quality_round_order_correct
        claim_type: precision
        grounds:
          - calculations.ncr_cost_of_quality
          - entities.NonconformanceReport.fields.cost_of_quality_cents
        excluded_because:
          difficulty_instance: combinatorial_formula / ncr_cost_of_quality_round_per_line_then_sum
          rationale: "The pinned round-per-line-then-sum order (4500) is computed and asserted by the named §1.8 instance."

      - name: capa_final_effectiveness_correct_from_d8
        claim_type: variant_selection
        grounds:
          - calculations.capa_effectiveness
          - entities.Capa.fields.final_effectiveness
        excluded_because:
          difficulty_instance: dual_variant_calc / capa_effectiveness_provisional_vs_final
          rationale: "Final variant selection at EFFECTIVENESS_CHECK closure (1.00 from D8 recurred_defects=0) is asserted by the named §1.8 dual-variant instance."

  # ===========================================================================
  # Section 4 — From Table 4 (Validations)
  # ===========================================================================
  - section: validations
    instances:
      # ---- priority 1: auth missing headers ----
      - name: missing_user_role_header_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request to POST /suppliers with no X-User-Role header is rejected at priority 1 with ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /suppliers"
              payload: { name: "No Auth", code: "NOAUTH" }
              as: NONE
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "http_status == 401"
            - "data.error_id == ERR_UNAUTHENTICATED"

      # ---- priority 3: path existence left-to-right ----
      - name: transition_nonexistent_lot_not_found
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "POST /inspection-lots/{id}/transition where the path id does not resolve is rejected at priority 3 with ERR_NOT_FOUND (404), before any state check."
        test_recipe:
          setup:
            - "An Inspector exists; no lot with the supplied id exists."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Insp Nf", email: "inspnf@x.com", role: "INSPECTOR" }
              as: QualityManager
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /inspection-lots/00000000-0000-4000-8000-000000000003/transition"
              payload: { action: "START" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "http_status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      # ---- priority 10: RETURN_TO_SUPPLIER on non-SUPPLIER NCR ----
      - name: disposition_return_to_supplier_on_internal_ncr_not_allowed
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - state_machines.NonconformanceReport.OPEN_to_DISPOSITIONED
          - entities.NonconformanceReport.fields.source
          - errors[ERR_DISPOSITION_NOT_ALLOWED]
        distinguishing_aspect: "Dispositioning an OPEN NCR with source=INTERNAL as RETURN_TO_SUPPLIER violates priority 10 (requires source==SUPPLIER) and returns ERR_DISPOSITION_NOT_ALLOWED (409)."
        test_recipe:
          setup:
            - "A QualityEngineer and an independent QualityManager exist; an INTERNAL NCR is OPEN."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QE Da", email: "qeda@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "QM Da", email: "qmda@x.com", role: "QUALITY_MANAGER" }
              as: QualityManager
              captures: { qm_id: $.data.id }
            - call: "POST /nonconformance-reports"
              payload: { title: "internal ncr", source: "INTERNAL", severity: "MAJOR", defect_qty: 2, unit_cost_cents: 1000, part_number: "P-DA" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { ncr_id: $.data.id }
            - call: "POST /nonconformance-reports/${ncr_id}/open"
              payload: {}
              as: QualityEngineer
              as_user_id: "${qe_id}"
          trigger:
            - call: "POST /nonconformance-reports/${ncr_id}/disposition"
              payload: { disposition: "RETURN_TO_SUPPLIER" }
              as: QualityManager
              as_user_id: "${qm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "http_status == 409"
            - "data.error_id == ERR_DISPOSITION_NOT_ALLOWED"
            - "NonconformanceReport.${ncr_id}.status == OPEN"

      # ---- priority 9: USE_AS_IS without any deviation ----
      - name: disposition_use_as_is_without_deviation_required
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - state_machines.NonconformanceReport.OPEN_to_DISPOSITIONED
          - errors[ERR_DEVIATION_REQUIRED]
        distinguishing_aspect: "Dispositioning an OPEN NCR as USE_AS_IS with NO APPROVED in-window Deviation violates priority 9 and returns ERR_DEVIATION_REQUIRED (409)."
        test_recipe:
          setup:
            - "A QualityEngineer and an independent QualityManager and a Supplier exist; clock 2026-06-15; a SUPPLIER NCR is OPEN with no Deviation."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QE Dr2", email: "qedr2@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "QM Dr2", email: "qmdr2@x.com", role: "QUALITY_MANAGER" }
              as: QualityManager
              captures: { qm_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Dr2 Co", code: "DR2-SUP" }
              as: QualityManager
              captures: { sup_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: QualityManager
            - call: "POST /nonconformance-reports"
              payload: { title: "dr2 ncr", source: "SUPPLIER", severity: "MINOR", defect_qty: 2, unit_cost_cents: 1000, part_number: "P-DR2", supplier_id: "${sup_id}" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { ncr_id: $.data.id }
            - call: "POST /nonconformance-reports/${ncr_id}/open"
              payload: {}
              as: QualityEngineer
              as_user_id: "${qe_id}"
          trigger:
            - call: "POST /nonconformance-reports/${ncr_id}/disposition"
              payload: { disposition: "USE_AS_IS" }
              as: QualityManager
              as_user_id: "${qm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "http_status == 409"
            - "data.error_id == ERR_DEVIATION_REQUIRED"
            - "NonconformanceReport.${ncr_id}.status == OPEN"

      # ---- priority 14: revision_no sequence violation on create ----
      - name: revision_create_out_of_sequence_revision_sequence
        claim_type: violation_to_error
        grounds:
          - validations[priority=14]
          - entities.ControlPlanRevision.fields.revision_no
          - errors[ERR_REVISION_SEQUENCE]
        distinguishing_aspect: "Creating a ControlPlanRevision with revision_no=2 against a fresh ControlPlan (current_revision_no=0, expects 1) violates priority 14 and returns ERR_REVISION_SEQUENCE (409)."
        test_recipe:
          setup:
            - "A QualityEngineer and a fresh ControlPlan (current_revision_no=0) exist."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QE Rsq", email: "qersq@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
            - call: "POST /control-plans"
              payload: { name: "CP Rsq", part_number: "P-RSQ" }
              as: QualityManager
              captures: { cp_id: $.data.id }
            - call: "GET /control-plans/${cp_id}"
              payload: {}
              as: QualityManager
              captures: { cp_v0: $.data.version }
          trigger:
            - call: "POST /control-plan-revisions"
              payload: { control_plan_id: "${cp_id}", revision_no: 2, change_summary: "skip one", expected_control_plan_version: "${cp_v0}" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "http_status == 409"
            - "data.error_id == ERR_REVISION_SEQUENCE"

      # ---- priority ordering corner: existence (p3) beats invalid request (p5) ----
      - name: path_not_found_beats_invalid_request_body
        claim_type: priority_ordering
        grounds:
          - validations[priority=3]
          - validations[priority=5]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "A disposition call on a non-existent NCR id AND a malformed body (invalid disposition enum) fails two checks; the lower-priority-number existence check (p3) wins: ERR_NOT_FOUND (404), NOT ERR_INVALID_REQUEST (p5)."
        test_recipe:
          setup:
            - "An independent QualityManager exists; no NCR with the supplied id exists."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QM Po", email: "qmpo@x.com", role: "QUALITY_MANAGER" }
              as: QualityManager
              captures: { qm_id: $.data.id }
          trigger:
            - call: "POST /nonconformance-reports/00000000-0000-4000-8000-000000000004/disposition"
              payload: { disposition: "NOT_A_DISPOSITION" }
              as: QualityManager
              as_user_id: "${qm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "http_status == 404"
            - "data.error_id == ERR_NOT_FOUND"
            - "data.error_id != ERR_INVALID_REQUEST"

      # ---- priority ordering corner: forbidden role (p2) beats existence (p3) ----
      - name: forbidden_role_beats_path_not_found
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "An Inspector calling POST /nonconformance-reports/{id}/disposition (QualityManager-only) on a non-existent NCR id fails both p2 (role) and p3 (existence); the lower-priority-number authorization check wins: ERR_FORBIDDEN_ROLE (403), NOT ERR_NOT_FOUND (p3)."
        test_recipe:
          setup:
            - "An Inspector Personnel exists; no NCR with the supplied id exists."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Insp Fr", email: "inspfr@x.com", role: "INSPECTOR" }
              as: QualityManager
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /nonconformance-reports/00000000-0000-4000-8000-000000000005/disposition"
              payload: { disposition: "REWORK" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "http_status == 403"
            - "data.error_id == ERR_FORBIDDEN_ROLE"
            - "data.error_id != ERR_NOT_FOUND"

      # ---- STUBS: validation corners already exercised by §1.8 ----
      - name: disposition_state_vs_sod_priority
        claim_type: priority_ordering
        grounds:
          - validations[priority=6]
          - validations[priority=8]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / disposition_state_beats_segregation_of_duties
          rationale: "The p6(state) vs p8(SoD) priority conflict on disposition is the subject of the named §1.8 instance."

      - name: scar_ack_state_vs_owner_priority
        claim_type: priority_ordering
        grounds:
          - validations[priority=6]
          - validations[priority=7]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / scar_ack_state_beats_resource_owner
          rationale: "The p6(state) vs p7(referential ownership) priority conflict on SCAR ACKNOWLEDGE is the subject of the named §1.8 instance."

      - name: deviation_overlap_violation
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_DEVIATION_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / deviation_half_open_window_overlap_rejected
          rationale: "The ERR_DEVIATION_OVERLAP half-open-window violation is the subject of the named §1.8 overlap instance."

      - name: auditor_double_booked_violation
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors[ERR_AUDITOR_DOUBLE_BOOKED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / auditor_buffered_window_double_booking_rejected
          rationale: "The ERR_AUDITOR_DOUBLE_BOOKED buffered-window violation is the subject of the named §1.8 overlap instance."

      - name: audit_close_open_findings_violation
        claim_type: violation_to_error
        grounds:
          - validations[priority=13]
          - errors[ERR_AUDIT_HAS_OPEN_FINDINGS]
        excluded_because:
          difficulty_instance: boundary_precision_check / audit_close_with_zero_open_findings_succeeds
          rationale: "The open_finding_count==0 boundary (passing the >0 ERR_AUDIT_HAS_OPEN_FINDINGS guard) is asserted by the named §1.8 boundary instance."

      - name: finding_close_ncr_open_violation
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=6]
          - errors[ERR_FINDING_NCR_OPEN]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / finding_close_requires_escalated_ncr_closed
          rationale: "The ERR_FINDING_NCR_OPEN cross-entity dependency is the subject of the named §1.8 instance."

      - name: use_as_is_deviation_satisfaction_pass
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=9]
          - state_machines.Deviation.REQUESTED_to_APPROVED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / use_as_is_disposition_requires_approved_in_window_deviation
          rationale: "The satisfaction path (APPROVED in-window deviation of sufficient max_qty lets USE_AS_IS succeed) is asserted by the named §1.8 instance."

      - name: capa_close_effectiveness_too_low_final
        claim_type: violation_to_error
        grounds:
          - validations[priority=15]
          - errors[ERR_EFFECTIVENESS_TOO_LOW]
        excluded_because:
          difficulty_instance: dual_variant_calc / capa_effectiveness_provisional_vs_final
          rationale: "The final-effectiveness>=0.80 close gate is exercised by the named §1.8 dual-variant instance (final=1.00 passes); the provisional<0.50 VERIFY gate is separately covered by the calculations-section full instance capa_provisional_below_gate_blocks_verify."

  # ===========================================================================
  # Section 5 — From Table 5 (Endpoints)
  # ===========================================================================
  - section: endpoints
    instances:
      # ---- Computed read: GET supplier surfaces derived counters ----
      - name: computed_read_supplier_summary_counters
        claim_type: computed_read
        grounds:
          - entities.Supplier.fields.lots_inspected
          - entities.Supplier.fields.lots_rejected
          - entities.Supplier.fields.quality_rating
          - state_machines.InspectionLot.IN_INSPECTION_to_ACCEPTED
          - state_machines.InspectionLot.IN_INSPECTION_to_REJECTED
        distinguishing_aspect: "GET /suppliers/{id} returns the computed-read summary: after one ACCEPTED and one REJECTED lot, lots_inspected=2, lots_rejected=1, quality_rating reflects lot_factor=max(0,1-1/2)=0.5 -> base=0.6*0.5+0.4*1.0=0.70 -> 70.00 (APPROVED at the inclusive APPROVE_AT=70)."
        test_recipe:
          setup:
            - "An Inspector and a Supplier and a ControlPlan and an InspectionPlan exist; one lot ACCEPTED, one lot REJECTED."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Insp Cr", email: "inspcr@x.com", role: "INSPECTOR" }
              as: QualityManager
              captures: { insp_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Cr Co", code: "CR-SUP" }
              as: QualityManager
              captures: { sup_id: $.data.id }
            - call: "POST /control-plans"
              payload: { name: "CP Cr", part_number: "P-CR" }
              as: QualityManager
              captures: { cp_id: $.data.id }
            - call: "POST /inspection-plans"
              payload: { name: "IP Cr", control_plan_id: "${cp_id}", part_number: "P-CR", lot_size: 120, aql_pct: 4.0, inspection_level: "GII" }
              as: QualityManager
              captures: { ip_id: $.data.id }
            - call: "POST /inspection-lots"
              payload: { inspection_plan_id: "${ip_id}", supplier_id: "${sup_id}", actual_lot_size: 120 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { lota_id: $.data.id }
            - call: "POST /inspection-lots/${lota_id}/transition"
              payload: { action: "START" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection-lots/${lota_id}/transition"
              payload: { action: "DISPOSITION", defects_found: 0 }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection-lots"
              payload: { inspection_plan_id: "${ip_id}", supplier_id: "${sup_id}", actual_lot_size: 120 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { lotr_id: $.data.id }
            - call: "POST /inspection-lots/${lotr_id}/transition"
              payload: { action: "START" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection-lots/${lotr_id}/transition"
              payload: { action: "DISPOSITION", defects_found: 3 }
              as: Inspector
              as_user_id: "${insp_id}"
          trigger:
            - call: "GET /suppliers/${sup_id}"
              payload: {}
              as: QualityManager
              captures: { li: $.data.lots_inspected, lr: $.data.lots_rejected, qr: $.data.quality_rating }
          assert:
            - "Supplier.${sup_id}.lots_inspected == 2"
            - "Supplier.${sup_id}.lots_rejected == 1"
            - "Supplier.${sup_id}.quality_rating == 70.00"
            - "Supplier.${sup_id}.approval_status == APPROVED"

      # ---- FK reverse-reachability: sub-resource list (Capa.ncr_id) ----
      - name: list_capas_for_ncr_reverse_reachability
        claim_type: standard_crud
        grounds:
          - entities.Capa.fields.ncr_id
          - state_machines.NonconformanceReport.DISPOSITIONED_to_CAPA_IN_PROGRESS
        distinguishing_aspect: "GET /nonconformance-reports/{id}/capas returns Capa[] — the only discovery channel for a CAPA against its NCR; after one CAPA is opened the list has length 1 with matching ncr_id."
        test_recipe:
          setup:
            - "A QualityEngineer, an independent QualityManager, a Supplier, a DISPOSITIONED NCR and one opened CAPA exist."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QE Lc", email: "qelc@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "QM Lc", email: "qmlc@x.com", role: "QUALITY_MANAGER" }
              as: QualityManager
              captures: { qm_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Lc Co", code: "LC-SUP" }
              as: QualityManager
              captures: { sup_id: $.data.id }
            - call: "POST /nonconformance-reports"
              payload: { title: "lc ncr", source: "SUPPLIER", severity: "MAJOR", defect_qty: 5, unit_cost_cents: 1000, part_number: "P-LC", supplier_id: "${sup_id}", rework_hours: 2.0 }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { ncr_id: $.data.id }
            - call: "POST /nonconformance-reports/${ncr_id}/open"
              payload: {}
              as: QualityEngineer
              as_user_id: "${qe_id}"
            - call: "POST /nonconformance-reports/${ncr_id}/disposition"
              payload: { disposition: "REWORK" }
              as: QualityManager
              as_user_id: "${qm_id}"
            - call: "POST /capas"
              payload: { ncr_id: "${ncr_id}", title: "lc 8d" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { capa_id: $.data.id }
          trigger:
            - call: "GET /nonconformance-reports/${ncr_id}/capas"
              payload: {}
              as: QualityManager
              as_user_id: "${qm_id}"
          assert:
            - "response_type == array"
            - "http_status == 200"
            - "len(data.items) == 1"
            - "data.items[0].id == ${capa_id}"
            - "data.items[0].ncr_id == ${ncr_id}"

      # ---- FK reverse-reachability: filtered list (NCR by audit_finding_id) ----
      - name: list_ncrs_filtered_by_audit_finding_id
        claim_type: standard_crud
        grounds:
          - entities.NonconformanceReport.fields.audit_finding_id
          - entities.AuditFinding.fields.raised_ncr_id
          - state_machines.AuditFinding.OPEN_to_NCR_RAISED
        distinguishing_aspect: "GET /nonconformance-reports?audit_finding_id={id} returns NonconformanceReport[] filtered to NCRs escalated from that finding — the forward-resolve channel for AuditFinding.raised_ncr_id; length 1 after one escalation."
        test_recipe:
          setup:
            - "An AUDITOR leads an IN_PROGRESS Audit with one MAJOR finding; a QualityEngineer raises and opens an AUDIT-source NCR against it (finding -> NCR_RAISED)."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Aud Lf", email: "audlf@x.com", role: "AUDITOR" }
              as: QualityManager
              captures: { aud_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "QE Lf", email: "qelf@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
            - call: "POST /audits"
              payload: { title: "lf audit", lead_auditor_id: "${aud_id}", scheduled_from: "2026-07-01T00:00:00Z", scheduled_to: "2026-07-02T00:00:00Z", clause_scope: "8.5" }
              as: Auditor
              as_user_id: "${aud_id}"
              captures: { audit_id: $.data.id }
            - call: "POST /audits/${audit_id}/transition"
              payload: { action: "START" }
              as: Auditor
              as_user_id: "${aud_id}"
            - call: "POST /audits/${audit_id}/findings"
              payload: { clause: "8.5.1", grade: "MAJOR", description: "lf finding" }
              as: Auditor
              as_user_id: "${aud_id}"
              captures: { finding_id: $.data.id }
            - call: "POST /nonconformance-reports"
              payload: { title: "lf ncr", source: "AUDIT", severity: "MAJOR", defect_qty: 2, unit_cost_cents: 1000, part_number: "P-LF", audit_finding_id: "${finding_id}" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { ncr_id: $.data.id }
            - call: "POST /nonconformance-reports/${ncr_id}/open"
              payload: {}
              as: QualityEngineer
              as_user_id: "${qe_id}"
          trigger:
            - call: "GET /nonconformance-reports"
              payload: { audit_finding_id: "${finding_id}" }
              as: QualityManager
          assert:
            - "response_type == array"
            - "http_status == 200"
            - "len(data.items) == 1"
            - "data.items[0].id == ${ncr_id}"
            - "data.items[0].audit_finding_id == ${finding_id}"

      # ---- Action endpoint: inspection-lot DISPOSITION requires defects_found ----
      - name: action_disposition_missing_defects_found_invalid_request
        claim_type: action_endpoint
        grounds:
          - state_machines.InspectionLot.IN_INSPECTION_to_ACCEPTED
          - validations[priority=5]
          - entities.InspectionLot.fields.defects_found
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /inspection-lots/{id}/transition action=DISPOSITION on an IN_INSPECTION lot with defects_found omitted is malformed for the action and returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "An Inspector, a Supplier, a ControlPlan, an InspectionPlan and an IN_INSPECTION lot exist."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Insp Ad", email: "inspad@x.com", role: "INSPECTOR" }
              as: QualityManager
              captures: { insp_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Ad Co", code: "AD-SUP" }
              as: QualityManager
              captures: { sup_id: $.data.id }
            - call: "POST /control-plans"
              payload: { name: "CP Ad", part_number: "P-AD" }
              as: QualityManager
              captures: { cp_id: $.data.id }
            - call: "POST /inspection-plans"
              payload: { name: "IP Ad", control_plan_id: "${cp_id}", part_number: "P-AD", lot_size: 120, aql_pct: 4.0, inspection_level: "GII" }
              as: QualityManager
              captures: { ip_id: $.data.id }
            - call: "POST /inspection-lots"
              payload: { inspection_plan_id: "${ip_id}", supplier_id: "${sup_id}", actual_lot_size: 120 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /inspection-lots/${lot_id}/transition"
              payload: { action: "START" }
              as: Inspector
              as_user_id: "${insp_id}"
          trigger:
            - call: "POST /inspection-lots/${lot_id}/transition"
              payload: { action: "DISPOSITION" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "http_status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"
            - "InspectionLot.${lot_id}.status == IN_INSPECTION"

  # ===========================================================================
  # Section 6 — From Table 6 (Errors)
  # Every error_id is triggerable. Most are covered by full instances above or by
  # §1.8; the remaining unique error_ids are stubbed to the instance that fires
  # them so the catalog is provably exhaustive.
  # ===========================================================================
  - section: errors
    instances:
      - name: err_unauthenticated_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_UNAUTHENTICATED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / disposition_state_beats_segregation_of_duties
          rationale: "ERR_UNAUTHENTICATED is fired by the §1.9 validations instance missing_user_role_header_unauthenticated; this stub records catalog coverage and points at the nearest §1.8 priority-conflict instance that exercises the auth ladder."

      - name: err_forbidden_role_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FORBIDDEN_ROLE]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / disposition_state_beats_segregation_of_duties
          rationale: "ERR_FORBIDDEN_ROLE is fired by the §1.9 validations instance forbidden_role_beats_path_not_found; recorded here for catalog coverage."

      - name: err_not_found_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_NOT_FOUND]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / finding_close_requires_escalated_ncr_closed
          rationale: "ERR_NOT_FOUND is fired by the §1.9 entities instance get_supplier_nonexistent_id_not_found; recorded for catalog coverage."

      - name: err_fk_not_found_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FK_NOT_FOUND]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / use_as_is_disposition_requires_approved_in_window_deviation
          rationale: "ERR_FK_NOT_FOUND is fired by the §1.9 entities instance create_capa_nonexistent_ncr_fk_not_found; recorded for catalog coverage."

      - name: err_invalid_request_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INVALID_REQUEST]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / disposition_state_beats_segregation_of_duties
          rationale: "ERR_INVALID_REQUEST is fired by the §1.9 entities instance create_ncr_missing_severity_invalid_request; recorded for catalog coverage."

      - name: err_invalid_state_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INVALID_STATE]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / disposition_state_beats_segregation_of_duties
          rationale: "ERR_INVALID_STATE is the winning error of the named §1.8 priority-conflict instance and is also fired by several §1.9 invalid-transition instances."

      - name: err_not_resource_owner_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_NOT_RESOURCE_OWNER]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / scar_ack_state_beats_resource_owner
