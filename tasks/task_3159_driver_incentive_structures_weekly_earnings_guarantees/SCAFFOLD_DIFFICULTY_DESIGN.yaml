              payload: { driver_id: "${drv}" }
              as: IncentiveOps
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (program DRAFT gates enrollment creation)"
            - "GET /incentive-programs/${prog}/enrollments returns an empty list"

      - name: statement_publish_requires_settlements_paid_or_void
        grounds:
          - state_machines.EarningsStatement.DRAFT_to_PUBLISHED
          - state_machines.GuaranteeSettlement
