  - name: the_five_opaque_roles_never_bind_a_user_id_so_only_the_role_header_authorises
    claim_type: role_denial
    grounds:
    - roles.ProgramCoordinator identity opaque
    - roles.EdPhysician identity opaque
    - roles.QualityAbstractor identity opaque
    - roles.TransferCoordinator identity opaque
    - roles.CertificationReviewer identity opaque
    - roles.Neurologist identity entity_backed:Neurologist
    distinguishing_aspect: 'Five of the six roles declare identity opaque, which means the X-User-ID is RECORDED and occasionally COMPARED but never registered or authorised: a user id seen for the first time must be accepted, and a user id previously seen under one role must be accepted under a different role on the very next call. Implementations that build a user table and reject unknown ids, or that pin the first role they saw for an id, fail here while passing every other RBAC test. The Neurologist is the declared exception and is the only role whose header must name an existing row.'
