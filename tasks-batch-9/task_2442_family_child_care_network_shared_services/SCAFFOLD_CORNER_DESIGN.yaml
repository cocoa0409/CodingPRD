              captures: { err: $.data.error_id }
          assert:
            - "${agst0} == SENT"
            - "${err} == ERR_FORBIDDEN_ROLE with HTTP 403"
            - "MembershipAgreement.${ag1}.status == SENT and Provider.${p1}.membership_status == PENDING_AGREEMENT"

