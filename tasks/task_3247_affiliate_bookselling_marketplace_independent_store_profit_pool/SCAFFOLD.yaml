scenario: |
  Affiliate Bookselling Marketplace & Independent Store Profit Pool (Bookshop.org): independent bookstore affiliate storefronts earning a share of sales made through their links, a profit pool distributed to participating stores that do not generate direct sales, wholesaler fulfillment where orders ship from a distributor rather than the affiliate store, affiliate onboarding for authors, publications and influencers with commission rates and payout thresholds, list creation and curation tools that drive discovery and attribute sales, order service issues handled centrally while the customer relationship feels local, publisher and wholesaler terms including discount structure and returns, ebook and audiobook partnerships with separate revenue mechanics

domain_name: affiliate-bookselling-marketplace
api_prefix: /bookshop

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Publisher
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Publisher display name" }
      - { name: discount_pct, type: number, source: input, description: "Wholesale discount off list price, 0.00-0.60 inclusive (0.46 = 46% off list)" }
      - { name: returns_allowed, type: boolean, source: input, description: "Whether print returns to the wholesaler are permitted under this publisher's terms" }
      - { name: return_window_days, type: integer, source: input, description: "Days after delivery during which a return may be opened; 0 means no returns even when returns_allowed" }
      - { name: return_credit_pct, type: number, source: input, description: "Fraction of the line's wholesale cost credited back on a credited return, 0.00-1.00" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; books of SUSPENDED publishers cannot be placed on new orders", default: ACTIVE, constraints: "enum: ACTIVE, SUSPENDED" }

  - name: Book
    parent: null
    common_fields: true
    fields:
      - { name: publisher_id, type: string, source: input, description: "FK -> Publisher.id; owning publisher" }
      - { name: isbn, type: string, source: input, description: "ISBN-13, unique across the catalog" }
      - { name: title, type: string, source: input, description: "Display title" }
      - { name: format, type: enum, source: input, description: "PRINT | EBOOK | AUDIOBOOK; determines fulfillment and revenue mechanics", constraints: "enum: PRINT, EBOOK, AUDIOBOOK" }
      - { name: list_price_cents, type: integer, source: input, description: "List price in cents; must be > 0" }
      - { name: ebook_partner_rev_share_pct, type: number, source: input, description: "Required for EBOOK/AUDIOBOOK (0.00-0.50 inclusive): platform share of net revenue kept before affiliate commission; must be null/absent for PRINT", default: null }
      - { name: status, type: enum, source: system, description: "LISTED | DELISTED; DELISTED books cannot be ordered or added to lists", default: LISTED, constraints: "enum: LISTED, DELISTED" }

  - name: AffiliateStore
    parent: null
    common_fields: true
    fields:
      - { name: shop_name, type: string, source: input, description: "Bookstore display name, unique" }
      - { name: slug, type: string, source: input, description: "Storefront URL slug, unique, lowercase-normalized before comparison" }
      - { name: commission_pct, type: number, source: input, description: "Store commission on attributable net sales, 0.10-0.30 inclusive" }
      - { name: pool_opt_in, type: boolean, source: input, description: "Whether the store participates in the monthly profit pool", default: true }
      - { name: payout_threshold_cents, type: integer, source: input, description: "Minimum accrued balance before a payout auto-releases; must be >= 2500", default: 2500 }
      - { name: status, type: enum, source: system, description: "PENDING_ONBOARDING | ACTIVE | SUSPENDED | DEACTIVATED", default: PENDING_ONBOARDING, constraints: "enum: PENDING_ONBOARDING, ACTIVE, SUSPENDED, DEACTIVATED" }
      - { name: activated_at, type: datetime, source: system, description: "Most recent transition into ACTIVE; pool eligibility day counts measure from here", default: null }
      - { name: suspended_at, type: datetime, source: system, description: "Most recent transition into SUSPENDED; null while ACTIVE", default: null }
      - { name: accrued_balance_cents, type: integer, source: computed, description: "Sum of non-reversed CommissionLedgerEntry amounts for this store minus PAID Payout amounts; reconciled on every ledger mutation", default: 0 }

  - name: AffiliatePartner
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Author / publication / influencer display name" }
      - { name: partner_kind, type: enum, source: input, description: "AUTHOR | PUBLICATION | INFLUENCER", constraints: "enum: AUTHOR, PUBLICATION, INFLUENCER" }
      - { name: commission_pct, type: number, source: input, description: "Partner commission on attributable net sales, 0.05-0.15 inclusive" }
      - { name: payout_threshold_cents, type: integer, source: input, description: "Minimum accrued balance before payout; must be >= 1000", default: 1000 }
      - { name: status, type: enum, source: system, description: "APPLIED | APPROVED | ACTIVE | REJECTED | SUSPENDED", default: APPLIED, constraints: "enum: APPLIED, APPROVED, ACTIVE, REJECTED, SUSPENDED" }
      - { name: accrued_balance_cents, type: integer, source: computed, description: "Sum of non-reversed CommissionLedgerEntry amounts minus PAID Payout amounts; reconciled on every ledger mutation", default: 0 }

  - name: BookList
    parent: null
    common_fields: true
    fields:
      - { name: owner_store_id, type: string, source: input, description: "FK -> AffiliateStore.id; lists are store-curated; always set" }
      - { name: title, type: string, source: input, description: "List title" }
      - { name: items, type: array, source: input, description: "Inline array of {book_id, position, curator_note?}; position 1-based and unique within the list; every book must exist and be LISTED; may be empty at creation" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | ARCHIVED; PUBLISHED lists drive discovery and attribution", default: DRAFT, constraints: "enum: DRAFT, PUBLISHED, ARCHIVED" }
      - { name: publish_count, type: integer, source: system, description: "Times this list has entered PUBLISHED, including re-publishes from DRAFT", default: 0 }

  - name: BookOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "Opaque customer handle; for the Customer role, X-User-ID must equal this value (the customer relationship feels local but no Customer entity is persisted)" }
      - { name: home_store_id, type: string, source: input, description: "FK -> AffiliateStore.id; the store the customer relationship feels local to (service branding); may be null", default: null }
      - { name: attributed_store_id, type: string, source: input, description: "FK -> AffiliateStore.id; exactly one of attributed_store_id / attributed_partner_id set — the affiliate whose link drove the sale" }
      - { name: attributed_partner_id, type: string, source: input, description: "FK -> AffiliatePartner.id; exactly one of attributed_store_id / attributed_partner_id set" }
      - { name: source_list_id, type: string, source: input, description: "FK -> BookList.id; list that drove discovery; may be null; when set the list must be PUBLISHED, owned by the attributed store, and the attribution must be store-attribution", default: null }
      - { name: lines, type: array, source: input, description: "Inline array of {book_id, quantity}; quantity >= 1; at least one line; each entry becomes a priced line at placement, indexed 0..n-1 in payload order" }
      - { name: priced_lines, type: array, source: computed, description: "Computed at placement: per-line {book_id, quantity, unit_price_cents, line_total_cents, wholesale_unit_cents, returned_quantity} snapshot in payload order" }
      - { name: payment_status, type: enum, source: system, description: "PENDING | PAID | REFUNDED_PARTIAL | REFUNDED_FULL; parallel dimension independent of fulfillment_status", default: PENDING, constraints: "enum: PENDING, PAID, REFUNDED_PARTIAL, REFUNDED_FULL" }
      - { name: fulfillment_status, type: enum, source: system, description: "DRAFT | PLACED | SENT_TO_WHOLESALER | SHIPPED | DELIVERED | CANCELLED; the wholesaler ships, never the affiliate store", default: DRAFT, constraints: "enum: DRAFT, PLACED, SENT_TO_WHOLESALER, SHIPPED, DELIVERED, CANCELLED" }
      - { name: gross_cents, type: integer, source: computed, description: "Sum of line totals after per-line rounding; pinned order in line_pricing", default: 0 }
      - { name: wholesale_cost_cents, type: integer, source: computed, description: "Sum of per-line wholesale cost using the publisher discount snapshot at placement", default: 0 }
      - { name: platform_margin_cents, type: integer, source: computed, description: "PRINT legs: gross - wholesale_cost - commission; digital legs: gross - platform_keeps - commission; see order_commission_accrual", default: 0 }
      - { name: commission_cents, type: integer, source: computed, description: "Provisional commission at PLACED, final commission at DELIVERED; two variants in order_commission_accrual", default: 0 }
      - { name: refunded_cents, type: integer, source: computed, description: "Cumulative credited refunds from ReturnRequests", default: 0 }
      - { name: retained_cents, type: integer, source: computed, description: "gross_cents - refunded_cents; recomputed on every return credit", default: 0 }
      - { name: delivered_at, type: datetime, source: system, description: "Timestamp of the DELIVERED transition; return windows measured from here", default: null }

  - name: ReturnRequest
    parent: BookOrder
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> BookOrder.id; order being returned against (from the path)" }
      - { name: line_index, type: integer, source: input, description: "0-based index into the order's priced_lines; identifies the line being returned" }
      - { name: quantity, type: integer, source: input, description: "Units to return; >= 1 and <= line quantity minus already-returned quantity" }
      - { name: reason_code, type: enum, source: input, description: "DAMAGED | WRONG_ITEM | UNWANTED", constraints: "enum: DAMAGED, WRONG_ITEM, UNWANTED" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | REJECTED | RECEIVED | CREDITED", default: REQUESTED, constraints: "enum: REQUESTED, APPROVED, REJECTED, RECEIVED, CREDITED" }
      - { name: refund_cents, type: integer, source: computed, description: "Customer refund per return_credit; set at APPROVED" }
      - { name: wholesale_credit_cents, type: integer, source: computed, description: "Wholesaler credit per publisher return_credit_pct; set at CREDITED; always 0 for digital formats" }

  - name: CommissionLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: affiliate_store_id, type: string, source: input, description: "FK -> AffiliateStore.id; exactly one of affiliate_store_id / affiliate_partner_id set" }
      - { name: affiliate_partner_id, type: string, source: input, description: "FK -> AffiliatePartner.id; exactly one of affiliate_store_id / affiliate_partner_id set" }
      - { name: order_id, type: string, source: input, description: "FK -> BookOrder.id; origin order for ORDER_ACCRUAL / COMMISSION_REVERSAL / RETURN_CLAWBACK; null for POOL_DISTRIBUTION / ADJUSTMENT", default: null }
      - { name: pool_distribution_id, type: string, source: input, description: "FK -> ProfitPoolDistribution.id; set only for POOL_DISTRIBUTION entries", default: null }
      - { name: kind, type: enum, source: system, description: "ORDER_ACCRUAL | COMMISSION_REVERSAL | RETURN_CLAWBACK | POOL_DISTRIBUTION | ADJUSTMENT", constraints: "enum: ORDER_ACCRUAL, COMMISSION_REVERSAL, RETURN_CLAWBACK, POOL_DISTRIBUTION, ADJUSTMENT" }
      - { name: amount_cents, type: integer, source: computed, description: "Signed amount; accruals and pool distributions positive, reversals and clawbacks negative" }
      - { name: reversed, type: boolean, source: system, description: "True once superseded by final settlement or reversal; reversed entries are excluded from accrued_balance_cents", default: false }

  - name: ProfitPoolDistribution
    parent: null
    common_fields: true
    fields:
      - { name: period_start, type: datetime, source: input, description: "Inclusive start of the pool period (UTC)" }
      - { name: period_end, type: datetime, source: input, description: "Exclusive end of the pool period (UTC); must be after period_start" }
      - { name: pool_cents, type: integer, source: input, description: "Total platform profit committed to the pool; must be > 0" }
      - { name: share_mode, type: enum, source: input, description: "EQUAL_SPLIT | SALES_WEIGHTED; selects the pool_share variant", constraints: "enum: EQUAL_SPLIT, SALES_WEIGHTED" }
      - { name: status, type: enum, source: system, description: "DRAFT | CALCULATED | APPROVED | DISTRIBUTED | VOID", default: DRAFT, constraints: "enum: DRAFT, CALCULATED, APPROVED, DISTRIBUTED, VOID" }
      - { name: eligible_store_count, type: integer, source: computed, description: "Opted-in stores passing the ACTIVE-days gate; set at CALCULATED", default: 0 }
      - { name: remainder_cents, type: integer, source: computed, description: "Unallocated rounding remainder after per-store floor; credited to exactly one store per pool_share tie-break", default: 0 }
      - { name: share_lines, type: array, source: computed, description: "Computed at CALCULATED: per opted-in non-DEACTIVATED store {store_id, eligible, share_cents}; emptied on recalculate; locked at APPROVED" }

  - name: Payout
    parent: null
    common_fields: true
    fields:
      - { name: affiliate_store_id, type: string, source: system, description: "FK -> AffiliateStore.id; exactly one of affiliate_store_id / affiliate_partner_id set; assigned by the payout_release sweep" }
      - { name: affiliate_partner_id, type: string, source: system, description: "FK -> AffiliatePartner.id; exactly one of affiliate_store_id / affiliate_partner_id set; assigned by the payout_release sweep" }
      - { name: amount_cents, type: integer, source: computed, description: "Accrued balance at the moment the payout is opened; frozen thereafter" }
      - { name: status, type: enum, source: system, description: "PENDING | PROCESSING | PAID | FAILED; FAILED returns to PENDING on retry (cycle)", default: PENDING, constraints: "enum: PENDING, PROCESSING, PAID, FAILED" }
      - { name: failure_reason, type: string, source: system, description: "Populated when status becomes FAILED; cleared on retry", default: null }

  - name: ServiceTicket
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> BookOrder.id; order under dispute" }
      - { name: opened_by_customer_id, type: string, source: input, description: "Opaque customer handle; must equal the order's customer_id and, for the Customer role, X-User-ID" }
      - { name: issue_kind, type: enum, source: input, description: "LATE_SHIPMENT | DAMAGED_ITEM | WRONG_ITEM | BILLING", constraints: "enum: LATE_SHIPMENT, DAMAGED_ITEM, WRONG_ITEM, BILLING" }
      - { name: status, type: enum, source: system, description: "OPEN | IN_REVIEW | RESOLVED | REOPENED | CLOSED; RESOLVED -> REOPENED forms a cycle", default: OPEN, constraints: "enum: OPEN, IN_REVIEW, RESOLVED, REOPENED, CLOSED" }
      - { name: resolved_at, type: datetime, source: system, description: "Timestamp of the most recent IN_REVIEW -> RESOLVED transition; reopen window measured from here", default: null }
      - { name: resolution_note, type: string, source: input, description: "Central service team's note; the customer-facing surface stays branded to the order's home store", default: null }

  - name: Promotion
    parent: null
    common_fields: true
    fields:
      - { name: book_isbn, type: string, source: input, description: "ISBN of the promoted title; must resolve to an existing LISTED book (validated at creation)" }
      - { name: discount_pct, type: number, source: input, description: "Customer-facing discount off list price, 0.05-0.40 inclusive" }
      - { name: window_start, type: datetime, source: input, description: "Closed interval start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Closed interval end (inclusive); must be >= window_start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ACTIVE | ENDED; driven by the logical clock", default: SCHEDULED, constraints: "enum: SCHEDULED, ACTIVE, ENDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: AffiliateStore
    initial_state: PENDING_ONBOARDING
    terminal_states: [DEACTIVATED]
    transitions:
      - from: PENDING_ONBOARDING
        to: ACTIVE
        trigger: "POST /bookshop/stores/{id}/actions with action=activate"
        actor: PlatformAdmin
        preconditions: ["store.status == PENDING_ONBOARDING"]
        side_effects: ["sets activated_at to the logical clock", "clears suspended_at", "increments AffiliateStore.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /bookshop/stores/{id}/actions with action=suspend"
        actor: PlatformAdmin
        preconditions: ["store.status == ACTIVE"]
        side_effects: ["sets suspended_at to the logical clock", "new orders may no longer attribute to the store (enforced at placement)", "increments AffiliateStore.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /bookshop/stores/{id}/actions with action=reactivate"
        actor: PlatformAdmin
        preconditions: ["store.status == SUSPENDED"]
        side_effects: ["sets activated_at to the logical clock (new eligibility epoch)", "clears suspended_at", "increments AffiliateStore.version by 1"]
      - from: ACTIVE
        to: DEACTIVATED
        trigger: "POST /bookshop/stores/{id}/actions with action=deactivate"
        actor: PlatformAdmin
        preconditions: ["store.status == ACTIVE", "store.accrued_balance_cents == 0", "no Payout for this store in PENDING or PROCESSING"]
        side_effects: ["store excluded from all future pool distributions", "increments AffiliateStore.version by 1"]
      - from: SUSPENDED
        to: DEACTIVATED
        trigger: "POST /bookshop/stores/{id}/actions with action=deactivate"
        actor: PlatformAdmin
        preconditions: ["store.status == SUSPENDED", "store.accrued_balance_cents == 0", "no Payout for this store in PENDING or PROCESSING"]
        side_effects: ["increments AffiliateStore.version by 1"]

  - entity: AffiliatePartner
    initial_state: APPLIED
    terminal_states: [REJECTED]
    transitions:
      - from: APPLIED
        to: APPROVED
        trigger: "POST /bookshop/partners/{id}/actions with action=approve"
        actor: PlatformAdmin
        preconditions: ["partner.status == APPLIED"]
        side_effects: ["partner may not yet be attributed on orders"]
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /bookshop/partners/{id}/actions with action=activate"
        actor: PlatformAdmin
        preconditions: ["partner.status == APPROVED"]
        side_effects: ["orders may attribute to the partner"]
      - from: APPLIED
        to: REJECTED
        trigger: "POST /bookshop/partners/{id}/actions with action=reject"
        actor: PlatformAdmin
        preconditions: ["partner.status == APPLIED"]
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /bookshop/partners/{id}/actions with action=suspend"
        actor: PlatformAdmin
        preconditions: ["partner.status == ACTIVE"]
        side_effects: ["new orders may not attribute to the partner", "PENDING payouts for the partner cannot enter PROCESSING until reactivation"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /bookshop/partners/{id}/actions with action=activate"
        actor: PlatformAdmin
        preconditions: ["partner.status == SUSPENDED"]
        side_effects: []

  - entity: BookList
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /bookshop/lists/{id}/actions with action=publish"
        actor: StoreManager
        preconditions: ["list.status == DRAFT", "list has at least 1 item", "owner store status == ACTIVE"]
        side_effects: ["publish_count += 1", "list becomes eligible for order attribution"]
      - from: PUBLISHED
        to: DRAFT
        trigger: "POST /bookshop/lists/{id}/actions with action=unpublish"
        actor: StoreManager
        preconditions: ["list.status == PUBLISHED"]
        side_effects: ["list no longer attributes new orders; existing orders keep their source_list_id"]
      - from: PUBLISHED
        to: ARCHIVED
        trigger: "POST /bookshop/lists/{id}/actions with action=archive"
        actor: StoreManager
        preconditions: ["list.status == PUBLISHED"]
        side_effects: ["items preserved read-only"]
      - from: DRAFT
        to: ARCHIVED
        trigger: "POST /bookshop/lists/{id}/actions with action=archive"
        actor: StoreManager
        preconditions: ["list.status == DRAFT"]
        side_effects: []

  - entity: BookOrder
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PLACED
        trigger: "POST /bookshop/orders/{id}/actions with action=place"
        actor: Customer
        preconditions: ["fulfillment_status == DRAFT", "payment_status == PENDING", "order has >= 1 line", "attributed affiliate status == ACTIVE", "every line's book LISTED and its publisher ACTIVE"]
        side_effects: ["payment_status transitions PENDING -> PAID in the same request", "runs line_pricing then order_commission_accrual (provisional variant) and populates priced_lines", "writes CommissionLedgerEntry kind=ORDER_ACCRUAL to the attributed affiliate", "reconciles affiliate accrued_balance_cents", "payout_release sweep runs for the affiliate"]
      - from: PLACED
        to: SENT_TO_WHOLESALER
        trigger: "POST /bookshop/orders/{id}/actions with action=dispatch"
        actor: WholesalerOps
        preconditions: ["fulfillment_status == PLACED", "payment_status == PAID"]
        side_effects: ["order handed to the distributor; the affiliate store never touches inventory"]
      - from: SENT_TO_WHOLESALER
        to: SHIPPED
        trigger: "POST /bookshop/orders/{id}/actions with action=ship"
        actor: WholesalerOps
        preconditions: ["fulfillment_status == SENT_TO_WHOLESALER"]
        side_effects: []
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /bookshop/orders/{id}/actions with action=deliver"
        actor: WholesalerOps
        preconditions: ["fulfillment_status == SHIPPED"]
        side_effects: ["sets delivered_at to the logical clock", "runs order_commission_accrual (final variant): marks the provisional ORDER_ACCRUAL entry reversed=true and writes a new final ORDER_ACCRUAL entry", "reconciles affiliate accrued_balance_cents", "payout_release sweep runs for the affiliate"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /bookshop/orders/{id}/actions with action=cancel"
        actor: Customer | CustomerService
        preconditions: ["fulfillment_status == DRAFT"]
        side_effects: ["no commission entry was ever written; nothing to claw back"]
      - from: PLACED
        to: CANCELLED
        trigger: "POST /bookshop/orders/{id}/actions with action=cancel"
        actor: Customer | CustomerService
        preconditions: ["fulfillment_status == PLACED", "payment_status == PAID"]
        side_effects: ["payment_status -> REFUNDED_FULL", "refunded_cents := gross_cents and retained_cents := 0", "marks the provisional ORDER_ACCRUAL entry reversed=true and writes CommissionLedgerEntry kind=COMMISSION_REVERSAL for the negative amount", "reconciles affiliate accrued_balance_cents"]

  - entity: ReturnRequest
    initial_state: REQUESTED
    terminal_states: [REJECTED, CREDITED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /bookshop/returns/{id}/actions with action=approve"
        actor: CustomerService
        preconditions: ["status == REQUESTED", "order fulfillment_status == DELIVERED", "PRINT lines: publisher.returns_allowed and logical clock <= delivered_at + publisher.return_window_days", "EBOOK/AUDIOBOOK lines: only DAMAGED or WRONG_ITEM reason codes allowed"]
        side_effects: ["computes refund_cents per return_credit (refund leg)"]
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /bookshop/returns/{id}/actions with action=reject"
        actor: CustomerService
        preconditions: ["status == REQUESTED"]
        side_effects: []
      - from: APPROVED
        to: RECEIVED
        trigger: "POST /bookshop/returns/{id}/actions with action=receive"
        actor: WholesalerOps
        preconditions: ["status == APPROVED"]
        side_effects: ["wholesaler logs physical receipt for PRINT; digital formats transition in the same call"]
      - from: RECEIVED
        to: CREDITED
        trigger: "POST /bookshop/returns/{id}/actions with action=credit"
        actor: FinanceOps
        preconditions: ["status == RECEIVED"]
        side_effects: ["priced_lines[line_index].returned_quantity += quantity", "order.refunded_cents += refund_cents; order.retained_cents -= refund_cents", "order payment_status -> REFUNDED_PARTIAL, or REFUNDED_FULL when refunded_cents == gross_cents", "computes wholesale_credit_cents per return_credit (credit leg)", "writes CommissionLedgerEntry kind=RETURN_CLAWBACK reversing commission proportionally", "reconciles affiliate accrued_balance_cents"]

  - entity: ProfitPoolDistribution
    initial_state: DRAFT
    terminal_states: [DISTRIBUTED, VOID]
    transitions:
      - from: DRAFT
        to: CALCULATED
        trigger: "POST /bookshop/pool-distributions/{id}/actions with action=calculate"
        actor: FinanceOps
        preconditions: ["status == DRAFT", "period_end <= logical clock (period fully elapsed)"]
        side_effects: ["runs pool_eligibility gate then pool_share (variant per share_mode)", "populates share_lines (one per opted-in non-DEACTIVATED store)", "sets eligible_store_count and remainder_cents", "increments ProfitPoolDistribution.version by 1"]
      - from: CALCULATED
        to: DRAFT
        trigger: "POST /bookshop/pool-distributions/{id}/actions with action=recalculate"
        actor: FinanceOps
        preconditions: ["status == CALCULATED"]
        side_effects: ["empties share_lines", "resets eligible_store_count and remainder_cents to 0", "increments ProfitPoolDistribution.version by 1"]
      - from: CALCULATED
        to: APPROVED
        trigger: "POST /bookshop/pool-distributions/{id}/actions with action=approve"
        actor: FinanceOps
        preconditions: ["status == CALCULATED", "expected_distribution_version matches current version (OCC)", "sum of share_lines.share_cents == pool_cents"]
        side_effects: ["locks share_lines", "increments ProfitPoolDistribution.version by 1"]
      - from: APPROVED
        to: DISTRIBUTED
        trigger: "POST /bookshop/pool-distributions/{id}/actions with action=distribute"
        actor: FinanceOps
        preconditions: ["status == APPROVED"]
        side_effects: ["for each eligible share line with share_cents > 0 (ordered by store created_at ASC) writes CommissionLedgerEntry kind=POOL_DISTRIBUTION", "each ledger write reconciles the store's accrued_balance_cents", "after the last ledger write the payout_release sweep opens a Payout for every affiliate whose accrued_balance_cents >= payout_threshold_cents", "increments ProfitPoolDistribution.version by 1"]
      - from: DRAFT
        to: VOID
        trigger: "POST /bookshop/pool-distributions/{id}/actions with action=void"
        actor: FinanceOps
        preconditions: ["status == DRAFT"]
        side_effects: []

  - entity: Payout
    initial_state: PENDING
    terminal_states: [PAID]
    transitions:
      - from: PENDING
        to: PROCESSING
        trigger: "POST /bookshop/payouts/{id}/actions with action=process"
        actor: FinanceOps
        preconditions: ["status == PENDING", "affiliate (store or partner) status == ACTIVE"]
        side_effects: []
      - from: PROCESSING
        to: PAID
        trigger: "POST /bookshop/payouts/{id}/actions with action=mark-paid"
        actor: FinanceOps
        preconditions: ["status == PROCESSING"]
        side_effects: ["affiliate accrued_balance_cents -= amount_cents (ledger-derived balance reconciliation)"]
      - from: PROCESSING
        to: FAILED
        trigger: "POST /bookshop/payouts/{id}/actions with action=fail"
        actor: FinanceOps
        preconditions: ["status == PROCESSING"]
        side_effects: ["sets failure_reason"]
      - from: FAILED
        to: PENDING
        trigger: "POST /bookshop/payouts/{id}/actions with action=retry"
        actor: FinanceOps
        preconditions: ["status == FAILED"]
        side_effects: ["clears failure_reason"]

  - entity: ServiceTicket
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: IN_REVIEW
        trigger: "POST /bookshop/tickets/{id}/actions with action=assign"
        actor: CustomerService
        preconditions: ["status == OPEN"]
        side_effects: []
      - from: IN_REVIEW
        to: RESOLVED
        trigger: "POST /bookshop/tickets/{id}/actions with action=resolve"
        actor: CustomerService
        preconditions: ["status == IN_REVIEW"]
        side_effects: ["sets resolved_at to the logical clock", "customer notification branded to the order's home store (presentation only; no state)"]
      - from: RESOLVED
        to: REOPENED
        trigger: "POST /bookshop/tickets/{id}/actions with action=reopen"
        actor: Customer
        preconditions: ["status == RESOLVED", "logical clock <= resolved_at + 14 days"]
        side_effects: []
      - from: REOPENED
        to: IN_REVIEW
        trigger: "POST /bookshop/tickets/{id}/actions with action=assign"
        actor: CustomerService
        preconditions: ["status == REOPENED"]
        side_effects: []
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /bookshop/tickets/{id}/actions with action=close"
        actor: CustomerService
        preconditions: ["status == RESOLVED"]
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /bookshop/tickets/{id}/actions with action=close"
        actor: CustomerService
        preconditions: ["status == OPEN"]
        side_effects: []

  - entity: Promotion
    initial_state: SCHEDULED
    terminal_states: [ENDED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "system: logical clock reaches window_start (re-evaluated on every POST /bookshop/_clock/set_current_utc and on every read of the promotion)"
        actor: system
        preconditions: ["status == SCHEDULED", "window_start <= logical clock <= window_end"]
        side_effects: ["promotion becomes eligible in line_pricing"]
      - from: ACTIVE
        to: ENDED
        trigger: "system: logical clock passes window_end"
        actor: system
        preconditions: ["status == ACTIVE", "logical clock > window_end"]
        side_effects: []
      - from: SCHEDULED
        to: ENDED
        trigger: "system: logical clock jumps past window_end while still SCHEDULED"
        actor: system
        preconditions: ["status == SCHEDULED", "logical clock > window_end"]
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: pool-approve-stale-version
    parent_entity: ProfitPoolDistribution
    write_endpoint: "POST /bookshop/pool-distributions/{id}/actions"
    occ_field: "expected_distribution_version"
    description: |
      Approving a distribution whose version has advanced since the client last
      observed it is rejected. The version advances on every calculate,
      recalculate, approve, and distribute, so an approve carrying a version
      captured before the latest calculate is stale: the approver's view of the
      share lines no longer matches what would be locked.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: line_pricing
    trigger: "BookOrder DRAFT -> PLACED"
    algorithm: aggregation
    formula: |
      for each line in the order's lines array (processed in payload order;
      the line's index becomes line_index):
        base = Book.list_price_cents
        promo = the Promotion whose book_isbn matches AND status == ACTIVE
                AND window_start <= place_time <= window_end   (closed interval)
        unit_price_cents = base - floor(base * promo.discount_pct) if promo else base
        wholesale_unit_cents =
          PRINT:            floor(Book.list_price_cents * (1 - Publisher.discount_pct))
          EBOOK/AUDIOBOOK:  floor(Book.list_price_cents * DIGITAL_COST_BASIS_PCT)
        line_total_cents = unit_price_cents * quantity
      gross_cents = sum(line_total_cents)      # sum AFTER per-line rounding — pinned order
      wholesale_cost_cents = sum(wholesale_unit_cents * quantity)
      priced_lines populated with the per-line snapshots
    input_set: "All lines of the order at placement; promotions filtered to matching ISBN, status ACTIVE, closed window containment at place time"
    constants:
      DIGITAL_COST_BASIS_PCT: 0.30
    precision: "integer cents; per-line floor before summation (round per line, then sum)"

  - name: order_commission_accrual
    trigger: "BookOrder DRAFT -> PLACED (provisional) and SHIPPED -> DELIVERED (final)"
    algorithm: tiered_pricing
    formula: |
      per priced line, by Book.format:
        PRINT:
          net_line = line_total_cents - wholesale_unit_cents * quantity
          line_commission = floor(net_line * affiliate.commission_pct)
        EBOOK / AUDIOBOOK:
          platform_keeps = floor(line_total_cents * Book.ebook_partner_rev_share_pct)
          line_commission = floor((line_total_cents - platform_keeps) * affiliate.commission_pct)
      commission_cents = sum(line_commission)
      platform_margin_cents =
        sum over PRINT lines of (line_total_cents - wholesale_unit_cents * quantity - line_commission)
        + sum over digital lines of (line_total_cents - platform_keeps - line_commission)
    input_set: "All priced lines; affiliate is the attributed store (commission_pct 0.10-0.30) or partner (0.05-0.15)"
    precision: "integer cents; floor per line before summation"
    variants:
      - name: provisional
        when: "at PLACED"
        difference: "computed against unreturned quantities; written as an ORDER_ACCRUAL entry with reversed=false"
      - name: final
        when: "at DELIVERED"
        difference: "recomputed against the same formula; the provisional entry is marked reversed=true and the final entry supersedes it, so identical inputs can yield different ledger state once a reversal lands between PLACED and DELIVERED"

  - name: return_credit
    trigger: "ReturnRequest REQUESTED -> APPROVED (refund leg) and RECEIVED -> CREDITED (credit leg)"
    algorithm: threshold
    formula: |
      line = order.priced_lines[ReturnRequest.line_index]
      refund_cents (at APPROVED):
        refund_cents = line.unit_price_cents * ReturnRequest.quantity
      wholesale_credit_cents (at CREDITED):
        PRINT:   floor(line.wholesale_unit_cents * quantity * Publisher.return_credit_pct)
        digital: 0
      commission clawback (at CREDITED):
        floor(line's final line_commission * (ReturnRequest.quantity / line.quantity))
        where line_commission = the per-line commission from order_commission_accrual (final variant)
    input_set: "The single ReturnRequest plus its priced line, Book, and Publisher"
    precision: "integer cents; floor at each step"
    variants:
      - name: with_publisher_credit
        when: "PRINT and publisher.returns_allowed == true"
        difference: "wholesale_credit_cents > 0 offsets platform margin"
      - name: digital_no_credit
        when: "EBOOK/AUDIOBOOK"
        difference: "wholesale_credit_cents == 0; the platform absorbs the full refund"

  - name: pool_eligibility
    trigger: "ProfitPoolDistribution DRAFT -> CALCULATED"
    algorithm: threshold
    formula: |
      for each AffiliateStore with pool_opt_in == true and status != DEACTIVATED:
        active_days = count of whole calendar days d in [period_start, period_end)
                      on which the store held status ACTIVE for the entire day,
                      derived from activated_at / suspended_at epochs
                      (a store suspended mid-period loses the days from
                      suspended_at until reactivation)
        eligible = active_days >= MIN_ACTIVE_DAYS
      eligible_store_count = count of eligible stores
    input_set: "AffiliateStore rows with pool_opt_in == true and status != DEACTIVATED at calculate time"
    constants:
      MIN_ACTIVE_DAYS: 14
    precision: "whole days; boundary is >= 14 (a store active exactly 14 days IS eligible)"

  - name: pool_share
    trigger: "ProfitPoolDistribution DRAFT -> CALCULATED, after pool_eligibility"
    algorithm: waterfall_allocation
    formula: |
      EQUAL_SPLIT:
        raw = floor(pool_cents / eligible_store_count)
        every eligible store: share_cents = raw
        remainder_cents = pool_cents - raw * eligible_store_count
        remainder credited to the eligible store with earliest created_at
        (tie-break: created_at ASC)
        (if eligible_store_count == 0: all shares 0, remainder_cents == 0,
         and the pool stays unallocated — approve then fails the sum invariant)
      SALES_WEIGHTED:
        weight(store) = sum of gross_cents over BookOrders attributed to the
                        store with fulfillment_status == DELIVERED and
                        delivered_at in [period_start, period_end)
        total_weight = sum of weight over eligible stores
        if total_weight == 0: fall back to the EQUAL_SPLIT arithmetic
        else: share_cents = floor(pool_cents * weight(store) / total_weight)
        remainder_cents = pool_cents - sum(share_cents)
        remainder credited to the eligible store with the largest weight
        (tie-break: created_at ASC)
      ineligible stores appear in share_lines with share_cents = 0 and eligible = false
    input_set: "share-line candidates from pool_eligibility; DELIVERED BookOrders in the period for the weighted variant"
    precision: "integer cents; floor per store; remainder assigned to exactly one store"
    variants:
      - name: equal_split
        when: "share_mode == EQUAL_SPLIT"
        difference: "ignores sales volume; a store with zero direct sales earns the same as the top seller"
      - name: sales_weighted
        when: "share_mode == SALES_WEIGHTED"
        difference: "proportional to delivered GMV; the same pool and store set yields different per-store amounts than equal_split whenever weights differ"

  - name: payout_release
    trigger: "after any reconciliation that raises accrued_balance_cents (order accrual, pool distribution)"
    algorithm: threshold
    formula: |
      for the affected affiliate:
        if accrued_balance_cents >= payout_threshold_cents
           AND no Payout for this affiliate in PENDING or PROCESSING
           AND affiliate status == ACTIVE:
          open a Payout with amount_cents = accrued_balance_cents (frozen snapshot)
        boundary: balance exactly equal to the threshold DOES release (>=)
    input_set: "the single affiliate whose balance was just reconciled"
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and one of the declared roles", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted for the endpoint and (for action endpoints) for the specific action per the endpoint's role map", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Ownership: StoreManager X-User-ID equals the owning store id; Customer X-User-ID equals the order's customer_id (orders, returns, tickets)", error_id: ERR_FORBIDDEN_OWNER_MISMATCH, http_status: 403, applies_to: "owner-scoped endpoints" }
  - { priority: 4, category: existence, check: "Path parameters resolve to existing resources, validated left to right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: existence, check: "Body foreign keys (publisher_id, attributed_store_id, attributed_partner_id, source_list_id, home_store_id, owner_store_id, book ids inside list items and order lines) resolve to existing rows", error_id: ERR_REFERENCE_NOT_FOUND, http_status: 404, applies_to: "creation endpoints with FK bodies" }
  - { priority: 6, category: business_request, check: "Request body well-formed: required fields present, types correct, enum members within declared sets, isbn/slug uniqueness, list item positions unique, line_index within range of priced_lines", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 7, category: state, check: "State machine precondition for the requested transition (from-state membership and action-specific guards); POST /bookshop/orders/{id}/returns additionally requires order fulfillment_status == DELIVERED", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints and POST /bookshop/orders/{id}/returns" }
  - { priority: 8, category: state, check: "OCC: expected_distribution_version equals the distribution's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /bookshop/pool-distributions/{id}/actions (approve)" }
  - { priority: 9, category: business_safety, check: "Order placement: attributed affiliate status == ACTIVE; suspended or unactivated affiliates cannot earn new attribution", error_id: ERR_AFFILIATE_NOT_ACTIVE, http_status: 422, applies_to: "POST /bookshop/orders/{id}/actions (place); also payout process while affiliate not ACTIVE" }
  - { priority: 10, category: business_safety, check: "Order placement: every line's Book LISTED and its Publisher ACTIVE", error_id: ERR_BOOK_UNAVAILABLE, http_status: 422, applies_to: "POST /bookshop/orders/{id}/actions (place)" }
  - { priority: 11, category: business_constraint, check: "Exactly one affiliate attribution set: XOR(attributed_store_id, attributed_partner_id) on orders", error_id: ERR_ATTRIBUTION_AMBIGUOUS, http_status: 422, applies_to: "POST /bookshop/orders" }
  - { priority: 12, category: business_constraint, check: "source_list_id must reference a PUBLISHED store-owned list whose owner is the attributed store; source_list_id must be null when the order is partner-attributed", error_id: ERR_LIST_ATTRIBUTION_MISMATCH, http_status: 422, applies_to: "POST /bookshop/orders, POST /bookshop/orders/{id}/actions (place)" }
  - { priority: 13, category: business_constraint, check: "Promotion windows on the same ISBN must not overlap and must leave at least a 1-day gap (closed-interval + buffer semantics): new.window_start > existing.window_end + 1 day or new.window_end < existing.window_start - 1 day; ENDED promotions no longer block", error_id: ERR_PROMOTION_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /bookshop/promotions" }
  - { priority: 14, category: business_constraint, check: "Pool distribution periods must not overlap any existing non-VOID distribution: half-open [period_start, period_end) intersection test; back-to-back periods (a.period_end == b.period_start) are allowed", error_id: ERR_POOL_PERIOD_OVERLAP, http_status: 409, applies_to: "POST /bookshop/pool-distributions" }
  - { priority: 15, category: business_temporal, check: "ReturnRequest at creation: PRINT requires logical clock <= delivered_at + publisher.return_window_days; EBOOK/AUDIOBOOK reject reason_code == UNWANTED outright", error_id: ERR_RETURN_WINDOW_CLOSED, http_status: 422, applies_to: "POST /bookshop/orders/{id}/returns" }
  - { priority: 16, category: business_temporal, check: "pool calculate requires period_end <= logical clock; ticket reopen requires logical clock <= resolved_at + 14 days", error_id: ERR_WINDOW_NOT_SATISFIED, http_status: 422, applies_to: "POST /bookshop/pool-distributions/{id}/actions (calculate), POST /bookshop/tickets/{id}/actions (reopen)" }
  - { priority: 17, category: business_fiscal, check: "commission_pct within role band (store 0.10-0.30, partner 0.05-0.15); payout_threshold_cents at or above floor (store 2500, partner 1000); pool_cents > 0; publisher discount_pct within 0.00-0.60; promotion discount_pct within 0.05-0.40", error_id: ERR_COMMERCIAL_TERMS_INVALID, http_status: 422, applies_to: "POST /bookshop/stores, POST /bookshop/partners, POST /bookshop/publishers, POST /bookshop/pool-distributions, POST /bookshop/promotions" }
  - { priority: 18, category: business_fiscal, check: "pool approve: sum(share_lines.share_cents) == pool_cents before locking", error_id: ERR_POOL_SUM_MISMATCH, http_status: 422, applies_to: "POST /bookshop/pool-distributions/{id}/actions (approve)" }
  - { priority: 19, category: business_referential, check: "store deactivate requires accrued_balance_cents == 0 and no Payout in PENDING or PROCESSING", error_id: ERR_STORE_SETTLEMENT_OUTSTANDING, http_status: 422, applies_to: "POST /bookshop/stores/{id}/actions (deactivate)" }
  - { priority: 20, category: business_referential, check: "list publish requires >= 1 item in the inline items array", error_id: ERR_LIST_NOT_PUBLISHABLE, http_status: 422, applies_to: "POST /bookshop/lists/{id}/actions (publish)" }
  - { priority: 21, category: business_referential, check: "ReturnRequest.quantity >= 1 and <= line quantity - line returned_quantity", error_id: ERR_RETURN_QUANTITY_EXCEEDED, http_status: 422, applies_to: "POST /bookshop/orders/{id}/returns" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/bookshop/_clock/set_current_utc", description: "Test-driving endpoint: sets the logical clock. Server startup default is exactly 2026-09-01T00:00:00Z and never falls back to wall-clock.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["re-evaluates Promotion SCHEDULED->ACTIVE, ACTIVE->ENDED, SCHEDULED->ENDED transitions"] }

  - { method: POST, path: "/bookshop/publishers", description: "Register a publisher with wholesale terms", roles: [PlatformAdmin], code: 201, input: [name, discount_pct, returns_allowed, return_window_days, return_credit_pct], output: Publisher, side_effects: [] }
  - { method: GET, path: "/bookshop/publishers/{id}", description: "Fetch a publisher", roles: [PlatformAdmin, WholesalerOps, FinanceOps], code: 200, input: [], output: Publisher, side_effects: [] }
  - { method: GET, path: "/bookshop/publishers/{id}/books", description: "Books of a publisher; reverse-reachability for Book.publisher_id", roles: [PlatformAdmin, WholesalerOps, StoreManager, Partner, Customer], code: 200, input: ["limit?", "offset?"], output: "Book[]", side_effects: [] }
  - { method: POST, path: "/bookshop/books", description: "Add a catalog title", roles: [PlatformAdmin], code: 201, input: [publisher_id, isbn, title, format, list_price_cents, "ebook_partner_rev_share_pct?"], output: Book, side_effects: [] }

  - { method: POST, path: "/bookshop/stores", description: "Onboard an independent bookstore storefront", roles: [PlatformAdmin], code: 201, input: [shop_name, slug, commission_pct, "pool_opt_in?", "payout_threshold_cents?"], output: AffiliateStore, side_effects: [] }
  - { method: GET, path: "/bookshop/stores/{id}", description: "Fetch a store incl. computed accrued_balance_cents", roles: [PlatformAdmin, StoreManager, FinanceOps, CustomerService], code: 200, input: [], output: AffiliateStore, side_effects: [] }
  - { method: GET, path: "/bookshop/stores/{id}/lists", description: "Lists owned by a store; reverse-reachability for BookList.owner_store_id", roles: [PlatformAdmin, StoreManager, Partner, Customer], code: 200, input: ["limit?", "offset?"], output: "BookList[]", side_effects: [] }
  - { method: POST, path: "/bookshop/stores/{id}/actions", description: "Store lifecycle. Role map: activate/suspend/reactivate/deactivate = PlatformAdmin.", roles: [PlatformAdmin], code: 200, input: [action], output: AffiliateStore, side_effects: ["per state_machines.AffiliateStore; increments AffiliateStore.version by 1"] }

  - { method: POST, path: "/bookshop/partners", description: "Author / publication / influencer affiliate application", roles: [PlatformAdmin], code: 201, input: [display_name, partner_kind, commission_pct, "payout_threshold_cents?"], output: AffiliatePartner, side_effects: [] }
  - { method: GET, path: "/bookshop/partners/{id}", description: "Fetch a partner incl. computed accrued_balance_cents", roles: [PlatformAdmin, Partner, FinanceOps], code: 200, input: [], output: AffiliatePartner, side_effects: [] }
  - { method: POST, path: "/bookshop/partners/{id}/actions", description: "Partner lifecycle. Role map: approve/reject/activate/suspend = PlatformAdmin.", roles: [PlatformAdmin], code: 200, input: [action], output: AffiliatePartner, side_effects: ["per state_machines.AffiliatePartner"] }

  - { method: POST, path: "/bookshop/lists", description: "Create a store-curated list with inline items [{book_id, position, curator_note?}]", roles: [StoreManager], code: 201, input: [owner_store_id, title, items], output: BookList, side_effects: [] }
  - { method: POST, path: "/bookshop/lists/{id}/actions", description: "List lifecycle. Role map: publish/unpublish/archive = owning StoreManager.", roles: [StoreManager], code: 200, input: [action], output: BookList, side_effects: ["publish_count += 1 on publish"] }

  - { method: POST, path: "/bookshop/orders", description: "Create an order in DRAFT with attribution and inline lines [{book_id, quantity}]", roles: [Customer], code: 201, input: [customer_id, "home_store_id?", "attributed_store_id?", "attributed_partner_id?", "source_list_id?", lines], output: BookOrder, side_effects: [] }
  - { method: GET, path: "/bookshop/orders/{id}", description: "Fetch an order incl. computed totals and priced_lines", roles: [Customer, CustomerService, PlatformAdmin, FinanceOps, WholesalerOps], code: 200, input: [], output: BookOrder, side_effects: [] }
  - { method: GET, path: "/bookshop/orders", description: "List/filter orders; reverse-reachability for BookOrder.attributed_store_id / attributed_partner_id / source_list_id / home_store_id", roles: [Customer, CustomerService, PlatformAdmin, FinanceOps, WholesalerOps], code: 200, input: ["customer_id?", "attributed_store_id?", "attributed_partner_id?", "source_list_id?", "home_store_id?", "fulfillment_status?", "limit?", "offset?"], output: "BookOrder[]", side_effects: [] }
  - { method: POST, path: "/bookshop/orders/{id}/actions", description: "Order lifecycle. Role map: place = owning Customer; cancel = owning Customer or CustomerService; dispatch/ship/deliver = WholesalerOps.", roles: [Customer, CustomerService, WholesalerOps], code: 200, input: [action], output: BookOrder, side_effects: ["per state_machines.BookOrder incl. commission ledger writes and payout_release sweep"] }
  - { method: POST, path: "/bookshop/orders/{id}/returns", description: "Open a return against a delivered order's priced line", roles: [Customer, CustomerService], code: 201, input: [line_index, quantity, reason_code], output: ReturnRequest, side_effects: [] }
  - { method: GET, path: "/bookshop/orders/{id}/returns", description: "Returns of an order; reverse-reachability for ReturnRequest.order_id", roles: [Customer, CustomerService, PlatformAdmin, WholesalerOps, FinanceOps], code: 200, input: ["limit?", "offset?"], output: "ReturnRequest[]", side_effects: [] }
  - { method: GET, path: "/bookshop/orders/{id}/tickets", description: "Tickets of an order; reverse-reachability for ServiceTicket.order_id", roles: [Customer, CustomerService, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "ServiceTicket[]", side_effects: [] }
  - { method: POST, path: "/bookshop/returns/{id}/actions", description: "Return lifecycle. Role map: approve/reject = CustomerService; receive = WholesalerOps; credit = FinanceOps.", roles: [CustomerService, WholesalerOps, FinanceOps], code: 200, input: [action], output: ReturnRequest, side_effects: ["per state_machines.ReturnRequest incl. clawback ledger entry"] }

  - { method: GET, path: "/bookshop/ledger-entries/{id}", description: "Fetch a commission ledger entry", roles: [PlatformAdmin, StoreManager, Partner, FinanceOps], code: 200, input: [], output: CommissionLedgerEntry, side_effects: [] }
  - { method: GET, path: "/bookshop/ledger-entries", description: "List/filter commission ledger entries; reverse-reachability for CommissionLedgerEntry.affiliate_store_id / affiliate_partner_id / order_id / pool_distribution_id", roles: [PlatformAdmin, StoreManager, Partner, FinanceOps], code: 200, input: ["affiliate_store_id?", "affiliate_partner_id?", "order_id?", "pool_distribution_id?", "kind?", "limit?", "offset?"], output: "CommissionLedgerEntry[]", side_effects: [] }

  - { method: POST, path: "/bookshop/pool-distributions", description: "Open a monthly profit pool distribution (DRAFT)", roles: [FinanceOps], code: 201, input: [period_start, period_end, pool_cents, share_mode], output: ProfitPoolDistribution, side_effects: [] }
  - { method: POST, path: "/bookshop/pool-distributions/{id}/actions", description: "Pool lifecycle; response carries the full distribution incl. share_lines. Role map: calculate/recalculate/approve/distribute/void = FinanceOps. approve requires expected_distribution_version (OCC).", roles: [FinanceOps], code: 200, input: [action, "expected_distribution_version?"], output: ProfitPoolDistribution, side_effects: ["per state_machines.ProfitPoolDistribution; increments version on calculate/recalculate/approve/distribute"] }

  - { method: GET, path: "/bookshop/payouts/{id}", description: "Fetch a payout", roles: [FinanceOps, PlatformAdmin, StoreManager, Partner], code: 200, input: [], output: Payout, side_effects: [] }
  - { method: GET, path: "/bookshop/payouts", description: "List/filter payouts; reverse-reachability for Payout.affiliate_store_id and Payout.affiliate_partner_id. Payouts are opened only by the payout_release sweep.", roles: [FinanceOps, PlatformAdmin, StoreManager, Partner], code: 200, input: ["affiliate_store_id?", "affiliate_partner_id?", "status?", "limit?", "offset?"], output: "Payout[]", side_effects: [] }
  - { method: POST, path: "/bookshop/payouts/{id}/actions", description: "Payout lifecycle. Role map: process/mark-paid/fail/retry = FinanceOps.", roles: [FinanceOps], code: 200, input: [action, "failure_reason?"], output: Payout, side_effects: ["per state_machines.Payout; mark-paid debits affiliate balance"] }

  - { method: POST, path: "/bookshop/tickets", description: "Open a central service ticket on an order (customer-facing branding stays store-local)", roles: [Customer], code: 201, input: [order_id, opened_by_customer_id, issue_kind], output: ServiceTicket, side_effects: [] }
  - { method: POST, path: "/bookshop/tickets/{id}/actions", description: "Ticket lifecycle; response carries the full ticket. Role map: assign/resolve/close = CustomerService; reopen = owning Customer.", roles: [CustomerService, Customer], code: 200, input: [action, "resolution_note?"], output: ServiceTicket, side_effects: ["per state_machines.ServiceTicket; resolve sets resolved_at"] }

  - { method: POST, path: "/bookshop/promotions", description: "Schedule a per-ISBN discount window (closed interval + 1-day buffer conflict rule); response carries the promotion incl. current status", roles: [PlatformAdmin], code: 201, input: [book_isbn, discount_pct, window_start, window_end], output: Promotion, side_effects: [] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role lacks permission for the endpoint or the specific action" }
  - { id: ERR_FORBIDDEN_OWNER_MISMATCH, http: 403, condition: "entity_backed role acts on a resource owned by a different entity, or Customer X-User-ID does not match the order's customer_id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "Body foreign key does not resolve" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request body: missing required field, wrong type, enum outside declared set, duplicate isbn/slug, duplicate list item position, line_index out of range" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition precondition: entity not in an allowed from-state for the action; also return creation against a non-DELIVERED order" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_distribution_version does not match current distribution version (OCC)" }
  - { id: ERR_AFFILIATE_NOT_ACTIVE, http: 422, condition: "Attributed store/partner not ACTIVE at order placement, or payout process attempted while affiliate not ACTIVE" }
  - { id: ERR_BOOK_UNAVAILABLE, http: 422, condition: "Book DELISTED or publisher SUSPENDED at order placement" }
  - { id: ERR_ATTRIBUTION_AMBIGUOUS, http: 422, condition: "Both or neither of store/partner attribution set on an order" }
  - { id: ERR_LIST_ATTRIBUTION_MISMATCH, http: 422, condition: "source_list not PUBLISHED, not owned by the attributed store, or set on a partner-attributed order" }
  - { id: ERR_PROMOTION_WINDOW_CONFLICT, http: 409, condition: "Promotion window overlaps or sits within the 1-day buffer of another non-ENDED promotion on the same ISBN" }
  - { id: ERR_POOL_PERIOD_OVERLAP, http: 409, condition: "Pool period overlaps an existing non-VOID distribution (half-open intersection)" }
  - { id: ERR_RETURN_WINDOW_CLOSED, http: 422, condition: "PRINT return after publisher window, or digital return with UNWANTED reason" }
  - { id: ERR_WINDOW_NOT_SATISFIED, http: 422, condition: "Period not fully elapsed for pool calculate, or ticket reopen window expired" }
  - { id: ERR_COMMERCIAL_TERMS_INVALID, http: 422, condition: "commission_pct outside role band, threshold below floor, pool_cents <= 0, or discount outside its allowed band" }
  - { id: ERR_POOL_SUM_MISMATCH, http: 422, condition: "Share lines do not sum to pool_cents at approve" }
  - { id: ERR_LIST_NOT_PUBLISHABLE, http: 422, condition: "Publish attempted on an empty list" }
  - { id: ERR_RETURN_QUANTITY_EXCEEDED, http: 422, condition: "Return quantity exceeds the unreturned balance of the line" }
  - { id: ERR_STORE_SETTLEMENT_OUTSTANDING, http: 422, condition: "Deactivate with non-zero balance or an open payout" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Marketplace operator; onboards stores/partners, manages catalog and promotions"
    identity: opaque
    exclusive_operations: ["publisher and book catalog management", "store/partner lifecycle actions", "promotion management", "logical clock control"]
    shared_operations: ["read any entity"]
  - name: StoreManager
    description: "Operator of one independent bookstore storefront"
    identity: "entity_backed:AffiliateStore"
    exclusive_operations: ["create and curate own lists (owner_store_id)", "publish/unpublish/archive own lists"]
    shared_operations: ["read own store, orders, ledger entries, payouts"]
  - name: Partner
    description: "Author, publication, or influencer affiliate"
    identity: "entity_backed:AffiliatePartner"
    exclusive_operations: []
    shared_operations: ["read own partner record, ledger entries, payouts", "read books and lists for curation links"]
  - name: Customer
    description: "Buyer; identity is the opaque customer_id handle carried on the order (the relationship feels local to the home store but service is central)"
    identity: opaque
    exclusive_operations: ["create/place/cancel own orders (X-User-ID == order.customer_id)", "open returns on own orders", "open and reopen own service tickets"]
    shared_operations: ["read own orders, returns, tickets, books, lists"]
  - name: CustomerService
    description: "Central service desk handling order issues"
    identity: opaque
    exclusive_operations: ["approve/reject returns", "assign/resolve/close tickets", "cancel customer orders"]
    shared_operations: ["read orders, returns, tickets, stores"]
  - name: WholesalerOps
    description: "Distributor operations; ships orders and receives returned stock"
    identity: opaque
    exclusive_operations: ["dispatch orders", "emit ship/deliver fulfillment actions", "receive returns"]
    shared_operations: ["read orders, books, publishers, returns"]
  - name: FinanceOps
    description: "Finance team; pool distributions, payouts, return crediting"
    identity: opaque
    exclusive_operations: ["profit pool lifecycle", "payout lifecycle", "credit returns"]
    shared_operations: ["read stores, partners, ledger entries, orders"]
