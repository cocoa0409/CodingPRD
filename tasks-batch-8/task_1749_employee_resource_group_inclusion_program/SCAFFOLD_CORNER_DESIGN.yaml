        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "Immediate consistency: a resource created by POST is fully readable with all server-computed fields in the very next GET, no delay."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /v1/venues", payload: { name: "RYW Hall", capacity: 42 }, as: DeiAdmin, captures: { v: $.data.id } }
          trigger:
            - { call: "GET /v1/venues/${v}", payload: {}, as: Employee, as_user_id: "emp_any", captures: { nm: $.data.name, cap: $.data.capacity, vv: $.data.version } }
          assert:
            - "nm == 'RYW Hall' and cap == 42 and vv == 1"
            - "GET is permitted for the Employee role (shared read operations)"
