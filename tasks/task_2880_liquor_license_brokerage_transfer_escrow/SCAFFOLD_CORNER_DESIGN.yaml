              as: PlatformAdmin
            - call: "POST /licenses"
              payload: { county_id: "${c_son}", owner_seller_id: "${s_id}", license_number: "SON-COMP-2", license_class: "CLASS_47_ONSALE_GENERAL", annual_gross_receipts_cents: 40000000, last_active_date: "2026-07-01", last_transfer_price_cents: 21000000 }
              as: PlatformAdmin
            - call: "POST /licenses"
              payload: { county_id: "${c_son}", owner_seller_id: "${s_id}", license_number: "SON-UNPRICED", license_class: "CLASS_47_ONSALE_GENERAL", annual_gross_receipts_cents: 40000000, last_active_date: "2026-07-01" }
              as: PlatformAdmin
            - call: "POST /licenses"
              payload: { county_id: "${c_nap}", owner_seller_id: "${s_id}", license_number: "NAP-COMP-1", license_class: "CLASS_47_ONSALE_GENERAL", annual_gross_receipts_cents: 40000000, last_active_date: "2026-07-01", last_transfer_price_cents: 100000000 }
              as: PlatformAdmin
            - call: "POST /licenses"
              payload: { county_id: "${c_son}", owner_seller_id: "${s_id}", license_number: "SON-SUBJ", license_class: "CLASS_47_ONSALE_GENERAL", annual_gross_receipts_cents: 120000000, last_active_date: "2026-07-01" }
              as: PlatformAdmin
              captures: { lic_id: $.data.id }
            - call: "POST /listings"
              payload: { license_id: "${lic_id}", brokerage_id: "${brk_id}", ask_price_cents: 18500000 }
