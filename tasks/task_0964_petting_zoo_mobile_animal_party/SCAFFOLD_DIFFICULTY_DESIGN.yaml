  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: handwash_station_exact_threshold
        grounds:
          - calculations.handwash_requirement
          - validations[priority=8]
        distinguishing_aspect: |
          Metric = handwash station count at the exact ceil(guests/20) boundary
          (40 guests requires exactly 2 stations, not 3), exercised through the
          CONFIRM endpoint: 1 planned station fails, exactly 2 passes — the
          sibling instance is a hours-before-event metric through the cancel
          endpoint.
        test_recipe:
          setup:
            - "Clock 2026-05-10; PRIVATE customer with VERIFIED 500000c cert; venue requires_handwash_stations=true"
            - "Booking A: 2026-06-17 14:00-16:00, 40 guests / 0 children / 1 planned station, goat CONFIRMED, quoted 17740, deposit 5322 paid"
            - "Booking B: 2026-06-18 14:00-16:00, 40 guests / 0 children / 2 planned stations, goat CONFIRMED, quoted 17740, deposit 5322 paid"
          setup_api_calls:
            - { call: "POST /petting-zoo/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: Operator }
            - { call: "POST /petting-zoo/customers", payload: { email: "c12@x.com", full_name: "Cust Twelve", customer_type: "PRIVATE" }, as: Anonymous, captures: { c12: $.data.id } }
