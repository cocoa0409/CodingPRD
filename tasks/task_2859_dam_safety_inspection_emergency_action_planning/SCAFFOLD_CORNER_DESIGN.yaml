            - "GET /emergency-action-plans/${eap_id}/exercises returns total_count 0 after the failure and accepted_exercise_count == 0"
            - "the second exercise returns HTTP 201 with outcome == ACCEPTED and deficiency_reason null"
            - "EmergencyActionPlan.${eap_id}.accepted_exercise_count == 1, last_accepted_exercise_at == 2026-08-01T00:00:00Z, exercise_current == true"

      - name: fee_adjustment_rejected_for_sign_mismatch_and_zero_amount_returns_invalid_request
        claim_type: priority_ordering
        grounds:
          - validations[priority 40]
          - validations[priority 3]
          - calculations.owner_fee_balance_and_delinquency
          - endpoints[POST /owners/{id}/fee-adjustments]
        distinguishing_aspect: |
          The sign rule is per entry_type in both directions - a positive PAYMENT_RECEIVED and a
          negative CIVIL_PENALTY are both 422 - and a zero amount is caught earlier at priority 3 as
          ERR_INVALID_REQUEST rather than as a sign mismatch, so the two rules are distinguishable.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One owner with an empty ledger and a zero balance."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /owners"
              payload: { legal_name: "Cascade Hydro LLC", owner_type: "PRIVATE", contact_email: "ops@cascadehydro.example", financial_assurance_bond_cents: 50000000 }
              as: ProgramAdmin
              captures: { owner_id: "$.data.id" }
          trigger:
            - call: "POST /owners/${owner_id}/fee-adjustments"
              payload: { entry_type: "PAYMENT_RECEIVED", amount_cents: 5000, memo: "Wrong sign" }
              as: ProgramAdmin
            - call: "POST /owners/${owner_id}/fee-adjustments"
              payload: { entry_type: "CIVIL_PENALTY", amount_cents: -5000, memo: "Wrong sign the other way" }
              as: ProgramAdmin
            - call: "POST /owners/${owner_id}/fee-adjustments"
              payload: { entry_type: "PAYMENT_RECEIVED", amount_cents: 0, memo: "Nothing at all" }
              as: ProgramAdmin
            - call: "POST /owners/${owner_id}/fee-adjustments"
              payload: { entry_type: "CIVIL_PENALTY", amount_cents: 30000, memo: "Correctly signed penalty" }
              as: ProgramAdmin
          assert:
            - "the positive PAYMENT_RECEIVED returns HTTP 422 with error_id ERR_LEDGER_SIGN_MISMATCH"
            - "the negative CIVIL_PENALTY returns HTTP 422 with error_id ERR_LEDGER_SIGN_MISMATCH"
            - "the zero amount returns HTTP 400 with error_id ERR_INVALID_REQUEST, not ERR_LEDGER_SIGN_MISMATCH"
            - "the correctly signed penalty returns HTTP 201 with balance_after_cents == 30000 and sequence_number == 1"
            - "Owner.${owner_id}.fee_balance_cents == 30000 and delinquency_status == DELINQUENT"
            - "GET /owners/${owner_id}/fee-ledger-entries returns total_count 1"

      - name: inspection_rejected_for_an_engineer_not_certified_for_the_hazard_class
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 21]
          - endpoints[POST /inspections]
          - entities.Engineer.fields.certified_hazard_classes
        distinguishing_aspect: |
          Certification is checked against the dam's current hazard_class, so the LOW-only engineer
          who could legally have certified the dam while it was UNCLASSIFIED is refused the
          inspection once the dam is HIGH, while the fully certified engineer is accepted.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "HIGH-hazard dam (A4 certified by the LOW/SIGNIFICANT/HIGH engineer while it was UNCLASSIFIED)."
            - "A third engineer certified for LOW only."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /owners"
              payload: { legal_name: "Cascade Hydro LLC", owner_type: "PRIVATE", contact_email: "ops@cascadehydro.example", financial_assurance_bond_cents: 50000000 }
              as: ProgramAdmin
              captures: { owner_id: "$.data.id" }
            - call: "POST /engineers"
              payload: { full_name: "Dana Reyes", license_number: "PE-44120", license_expires_at: "2029-12-31T00:00:00Z", certified_hazard_classes: ["LOW", "SIGNIFICANT", "HIGH"] }
              as: ProgramAdmin
              captures: { eng_a_id: "$.data.id" }
            - call: "POST /engineers"
              payload: { full_name: "Sam Okoye", license_number: "PE-66330", license_expires_at: "2030-06-30T00:00:00Z", certified_hazard_classes: ["LOW"] }
              as: ProgramAdmin
              captures: { eng_c_id: "$.data.id" }
            - call: "POST /river-reaches"
              payload: { name: "Little Bear Creek Reach 3", channel_capacity_cfs: 1200, downstream_community: "Elk Hollow" }
              as: ProgramAdmin
              captures: { reach_id: "$.data.id" }
            - call: "POST /dams"
              payload: { owner_id: "${owner_id}", river_reach_id: "${reach_id}", name: "Elk Hollow Dam", nid_code: "ST00123", height_ft: 62, gross_storage_acre_ft: 1500, crest_elevation_ft: 1042.5, normal_pool_elevation_ft: 1038.0, year_completed: 1968, registered_at: "2019-04-15T00:00:00Z" }
              as: ProgramAdmin
              captures: { dam_id: "$.data.id" }
            - call: "POST /consequence-assessments"
              payload: { dam_id: "${dam_id}", population_at_risk: 100, habitable_structures: 40, critical_facilities: 10, breach_peak_outflow_cfs: 50000, breach_travel_time_minutes: 10, inundation_area_acres: 900, inundation_map_ref: "IM-2026-D" }
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { a4_id: "$.data.id" }
            - call: "POST /consequence-assessments/${a4_id}/certify"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
          trigger:
            - call: "POST /inspections"
              payload: { dam_id: "${dam_id}", engineer_id: "${eng_c_id}", inspection_type: "PERIODIC", window_start: "2026-08-04T00:00:00Z", window_end: "2026-08-06T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /inspections"
              payload: { dam_id: "${dam_id}", engineer_id: "${eng_a_id}", inspection_type: "PERIODIC", window_start: "2026-08-04T00:00:00Z", window_end: "2026-08-06T00:00:00Z" }
              as: ProgramAdmin
              captures: { insp_id: "$.data.id" }
          assert:
            - "the first POST /inspections returns HTTP 422 with error_id ERR_ENGINEER_NOT_CERTIFIED"
            - "GET /inspections?engineer_id=${eng_c_id} returns total_count 0, so no window was reserved for the refused engineer"
            - "the second POST /inspections returns HTTP 201 with Inspection.${insp_id}.status == SCHEDULED"
            - "ConsequenceAssessment.${a4_id}.status == CERTIFIED, confirming the same LOW-only rule let the UNCLASSIFIED dam be certified by an engineer holding LOW"

      - name: two_violated_rules_report_the_higher_priority_error
        claim_type: priority_ordering
        grounds:
          - validations[priority 14]
          - validations[priority 35]
        distinguishing_aspect: |
          When a state rule and a fiscal rule are both violated the numerically lower priority wins,
          which is only observable if the two errors are distinct.
        excluded_because:
          difficulty_instance: permit_state_conflict_rejected_ahead_of_owner_delinquency
          rationale: |
            That §1.8 priority_pair_validation_conflict instance drives exactly this pair - a
            SUBMITTED permit belonging to a delinquent owner - and then shows the same call
            returning ERR_OWNER_DELINQUENT once only the fiscal violation remains.

      - name: license_expiry_outranks_the_temporal_window_check
        claim_type: priority_ordering
        grounds:
          - validations[priority 20]
          - validations[priority 26]
        distinguishing_aspect: |
          A submission that is both out of window and made by a lapsed licensee must report the
          licensing failure, proving the guard order rather than an evaluation accident.
        excluded_because:
          difficulty_instance: expired_license_rejected_ahead_of_the_inspection_window_check
          rationale: |
            That §1.8 priority_pair_validation_conflict instance advances the clock past the
            engineer's expiry and past window_end in one step, asserts ERR_ENGINEER_LICENSE_EXPIRED,
            and then isolates ERR_OUTSIDE_INSPECTION_WINDOW with a valid licensee.

