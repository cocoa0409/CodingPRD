  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_check_40_beats_rounds_exhausted_70_on_a_third_rebuttal
        grounds:
          - validations.priority_40_state.ERR_REVIEW_NOT_DISPUTABLE
          - validations.priority_70_business_constraint.ERR_REBUTTAL_ROUNDS_EXHAUSTED
          - state_machines.Review.DISPUTED_to_SELECTED
        distinguishing_aspect: |
          Two rules are violated by the same request and both are plausible: after two UPHELD
          rebuttals the Review sits in SELECTED (so the state rule at priority 40 refuses a
          rebuttal) AND rebuttal_round_count has reached program.max_rebuttal_rounds (so the
          cardinality rule at priority 70 also refuses it). The engine must return the priority-40
          error. A naive implementation that checks the round budget first — the more obviously
          "business" rule — returns ERR_REBUTTAL_ROUNDS_EXHAUSTED and fails.
