# =============================================================================
# Task 1275 — Check Adjustment & Return Item Processing (bank item processing)
# =============================================================================

scenario: |
  1275. Check Adjustment & Return Item Processing (bank item processing): return
  reason coding & re-presentment eligibility, encoding error & adjustment claim
  with clearing bank, image quality & warranty claim deadlines, duplicate
  presentment detection & credit, large-item review & hold decision, customer
  notification & fee assessment, expedited recredit under Reg CC, adjustment
  aging & write-off

domain_name: check-adjustment-return-items
api_prefix: /bank

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
    - scheduled_actions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ClearingBank
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Clearing bank display name" }
      - { name: routing_number, type: string, source: input, description: "9-digit routing number; unique across clearing banks" }
      - { name: claim_window_business_days, type: integer, source: input, default: 3, description: "Business days from AdjustmentClaim.created_at within which submit is allowed" }
      - { name: warranty_window_days, type: integer, source: input, default: 7, description: "Calendar days from CheckItem.presented_at within which a WarrantyClaim may be submitted" }
      - { name: daily_claim_capacity, type: integer, source: input, default: 10, description: "Max AdjustmentClaim submissions accepted per business day for this clearing bank" }
      - { name: status, type: enum, source: input, default: "ACTIVE", description: "ACTIVE | SUSPENDED — SUSPENDED blocks present and claim submit" }

  - name: DepositorAccount
    parent: null
    common_fields: true
    fields:
      - { name: customer_name, type: string, source: input, description: "Account holder name" }
      - { name: account_number, type: string, source: input, description: "Unique account number" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | FROZEN — FROZEN set automatically when available_balance_cents < 0, cleared automatically when it returns >= 0" }
      - { name: risk_tier, type: enum, source: input, default: "STANDARD", description: "STANDARD | HIGH_RISK — drives fee multiplier" }
      - { name: reg_cc_eligible, type: boolean, source: input, default: true, description: "Whether expedited recredit under Reg CC may be requested" }
      - { name: opening_balance_cents, type: integer, source: input, default: 0, description: "Opening ledger balance; posts one OPENING_CREDIT LedgerEntry when > 0" }
      - { name: available_balance_cents, type: integer, source: computed, description: "Sum of amount_cents over ALL LedgerEntry rows for this account (provisional and non-provisional)" }
      - { name: settled_balance_cents, type: integer, source: computed, description: "Sum of amount_cents over LedgerEntry rows with provisional == false only" }
      - { name: returned_item_count_30d, type: integer, source: computed, description: "Count of ReturnEvent rows with status CODED whose CheckItem.depositor_account_id == this account and coded_at within trailing 30 calendar days (now-30d, now], inclusive of the event just coded" }

  - name: AccountFreeze
    parent: null
    common_fields: true
    fields:
      - { name: depositor_account_id, type: string, source: system, description: "FK -> DepositorAccount.id; from path" }
      - { name: start_at, type: datetime, source: input, description: "Freeze window start (inclusive) — closed-interval semantics" }
      - { name: end_at, type: datetime, source: input, description: "Freeze window end (inclusive) — closed-interval semantics" }
      - { name: reason, type: string, source: input, description: "Freeze justification" }
      - { name: status, type: enum, source: computed, description: "ACTIVE while start_at <= now <= end_at, else EXPIRED" }

  - name: CheckItem
    parent: null
    common_fields: true
    fields:
      - { name: depositor_account_id, type: string, source: input, description: "FK -> DepositorAccount.id" }
      - { name: clearing_bank_id, type: string, source: input, description: "FK -> ClearingBank.id" }
      - { name: item_reference, type: string, source: input, description: "External item identifier used for duplicate detection" }
      - { name: amount_cents, type: integer, source: input, description: "Face amount of the check" }
      - { name: encoded_amount_cents, type: integer, source: input, description: "MICR-encoded amount; mismatch vs amount_cents discovered at present triggers ENCODING_ERROR case" }
      - { name: image_quality_score, type: integer, source: input, description: "0..100 image quality; < 60 at present triggers IMAGE_WARRANTY case", constraints: "0 <= score <= 100" }
      - { name: capture_channel, type: enum, source: input, description: "BRANCH | ATM | MOBILE | RDC" }
      - { name: status, type: enum, source: system, description: "RECEIVED | UNDER_REVIEW | PRESENTED | PAID | RETURNED | DUPLICATE_REJECTED | DEPOSIT_REJECTED" }
      - { name: is_large_item, type: boolean, source: computed, description: "amount_cents >= 500000" }
      - { name: presentment_count, type: integer, source: system, default: 0, description: "Number of times presented; incremented by present and re-present" }
      - { name: duplicate_of_item_id, type: string, source: system, description: "FK -> CheckItem.id; nullable — set when this item is rejected as a duplicate presentment" , constraints: "nullable" }
      - { name: presented_at, type: datetime, source: system, description: "Logical-clock timestamp of most recent presentment", constraints: "nullable" }
      - { name: paid_at, type: datetime, source: system, description: "Logical-clock timestamp of payment", constraints: "nullable" }

  - name: HoldDecision
    parent: null
    common_fields: true
    fields:
      - { name: check_item_id, type: string, source: system, description: "FK -> CheckItem.id; from path or auto-review cascade" }
      - { name: source, type: enum, source: system, description: "AUTO_LARGE_ITEM | MANUAL" }
      - { name: window_start_at, type: datetime, source: system, description: "Hold window start — half-open [window_start_at, hold_until) semantics" }
      - { name: hold_until, type: datetime, source: system, description: "Hold window end (exclusive). Auto holds: created_at + 2 business days. Manual holds: from input hold_until." }
      - { name: decision, type: enum, source: system, description: "RELEASE_FUNDS | EXTEND_HOLD | RETURN_ITEM — null while PENDING", constraints: "nullable" }
      - { name: decided_at, type: datetime, source: system, constraints: "nullable", description: "When decision was recorded" }
      - { name: decided_by_user_id, type: string, source: system, constraints: "nullable", description: "X-User-ID of the deciding analyst" }
      - { name: status, type: enum, source: system, description: "PENDING | DECIDED | EXPIRED" }

  - name: ReturnEvent
    parent: null
    common_fields: true
    fields:
      - { name: check_item_id, type: string, source: system, description: "FK -> CheckItem.id; from path" }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock time the return was recorded" }
      - { name: reason_code, type: enum, source: input, constraints: "nullable", description: "NSF | STOP_PAYMENT | CLOSED_ACCOUNT | MISSING_ENDORSEMENT | ALTERED_OR_FICTITIOUS | IMAGE_NONCONFORMING | DUPLICATE_PRESENTMENT | REFER_TO_MAKER — set by the code endpoint" }
      - { name: coded_at, type: datetime, source: system, constraints: "nullable", description: "When reason coding occurred" }
      - { name: re_presentment_eligible, type: boolean, source: computed, constraints: "nullable", description: "Computed at coding: true iff reason_code IN {NSF, MISSING_ENDORSEMENT, IMAGE_NONCONFORMING, REFER_TO_MAKER}" }
      - { name: status, type: enum, source: system, description: "PENDING_CODING | CODED" }

  - name: AdjustmentCase
    parent: null
    common_fields: true
    fields:
      - { name: case_type, type: enum, source: system, description: "RETURN_ITEM | ENCODING_ERROR | IMAGE_WARRANTY | DUPLICATE_PRESENTMENT | LARGE_ITEM_REVIEW" }
      - { name: check_item_id, type: string, source: system, description: "FK -> CheckItem.id" }
      - { name: return_event_id, type: string, source: system, constraints: "nullable", description: "FK -> ReturnEvent.id; set for RETURN_ITEM cases" }
      - { name: status, type: enum, source: system, description: "OPEN | ASSIGNED | RESOLVED | REOPENED | ESCALATED | CLOSED" }
      - { name: assigned_analyst_id, type: string, source: system, constraints: "nullable", description: "Opaque analyst user id set by assign" }
      - { name: disposition, type: enum, source: system, constraints: "nullable", description: "CREDIT_CUSTOMER | DEBIT_CUSTOMER | NO_ACTION — set by resolve" }
      - { name: resolution_amount_cents, type: integer, source: system, constraints: "nullable", description: "Amount credited or debited at resolve" }
      - { name: reopen_count, type: integer, source: system, default: 0, description: "Number of times the case has been reopened" }
      - { name: escalated_at, type: datetime, source: system, constraints: "nullable", description: "Set when ops sweep escalates the case" }
      - { name: resolved_at, type: datetime, source: system, constraints: "nullable", description: "Set at resolve" }
      - { name: closed_at, type: datetime, source: system, constraints: "nullable", description: "Set at close (manual or automatic)" }

  - name: AdjustmentClaim
    parent: null
    common_fields: true
    fields:
      - { name: adjustment_case_id, type: string, source: system, description: "FK -> AdjustmentCase.id; from path or auto-create cascade" }
      - { name: clearing_bank_id, type: string, source: system, description: "FK -> ClearingBank.id; copied from the case's CheckItem" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Amount claimed from the clearing bank (auto-created claims: |encoded_amount_cents - amount_cents|)" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator; 'system' when auto-created" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACKNOWLEDGED | SETTLED | DENIED | ESCALATED | WRITTEN_OFF" }
      - { name: submitted_at, type: datetime, source: system, constraints: "nullable", description: "Set at submit" }
      - { name: clearing_bank_ref, type: string, source: input, constraints: "nullable", description: "Reference supplied at acknowledge" }
      - { name: recovered_amount_cents, type: integer, source: input, constraints: "nullable", description: "Recovered amount recorded at settle when outcome == SETTLED" }
      - { name: settled_at, type: datetime, source: system, constraints: "nullable", description: "Set at settle" }
      - { name: aging_calendar_days, type: integer, source: computed, description: "Calendar days from created_at to now (end minus start, whole days)" }
      - { name: aging_business_days, type: integer, source: computed, description: "Business days (Mon-Fri) strictly after created_at's date up to and including today's date" }
      - { name: write_off_reason, type: string, source: input, constraints: "nullable", description: "Recorded at write-off" }
      - { name: written_off_at, type: datetime, source: system, constraints: "nullable", description: "Set at write-off" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: adjustment_case_id, type: string, source: system, description: "FK -> AdjustmentCase.id; from path" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Amount claimed under image warranty" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | HONORED | REJECTED | ESCALATED | WRITTEN_OFF" }
      - { name: deadline_at, type: datetime, source: computed, description: "= CheckItem.presented_at + ClearingBank.warranty_window_days calendar days; submit allowed while now <= deadline_at" }
      - { name: submitted_at, type: datetime, source: system, constraints: "nullable", description: "Set at submit" }
      - { name: recovered_amount_cents, type: integer, source: input, constraints: "nullable", description: "Recorded at settle when outcome == HONORED" }
      - { name: settled_at, type: datetime, source: system, constraints: "nullable", description: "Set at settle" }
      - { name: aging_business_days, type: integer, source: computed, description: "Same business-day algorithm as AdjustmentClaim.aging_business_days" }
      - { name: aging_calendar_days, type: integer, source: computed, description: "Same calendar-day algorithm as AdjustmentClaim.aging_calendar_days" }
      - { name: write_off_reason, type: string, source: input, constraints: "nullable", description: "Recorded at write-off" }
      - { name: written_off_at, type: datetime, source: system, constraints: "nullable", description: "Set at write-off" }

  - name: CustomerNotification
    parent: null
    common_fields: false
    fields:
      - { name: depositor_account_id, type: string, source: system, description: "FK -> DepositorAccount.id" }
      - { name: adjustment_case_id, type: string, source: system, constraints: "nullable", description: "FK -> AdjustmentCase.id" }
      - { name: notification_type, type: enum, source: system, description: "RETURN_NOTICE | CASE_CLOSED | DUPLICATE_NOTICE | DEPOSIT_REJECTED_NOTICE | LARGE_ITEM_HOLD_NOTICE" }
      - { name: message, type: string, source: system, description: "Rendered notice text" }
      - { name: due_at, type: datetime, source: system, description: "created_at advanced to 17:00:00Z on the next business day" }
      - { name: status, type: enum, source: system, description: "PENDING | DELIVERED | BREACHED" }
      - { name: delivered_at, type: datetime, source: system, constraints: "nullable", description: "Set at deliver" }

  - name: FeeAssessment
    parent: null
    common_fields: true
    fields:
      - { name: depositor_account_id, type: string, source: system, description: "FK -> DepositorAccount.id" }
      - { name: adjustment_case_id, type: string, source: system, constraints: "nullable", description: "FK -> AdjustmentCase.id; the RETURN_ITEM case that caused the fee" }
      - { name: return_event_id, type: string, source: system, constraints: "nullable", description: "FK -> ReturnEvent.id; the coded return that caused the fee" }
      - { name: fee_type, type: enum, source: system, description: "RETURN_ITEM_FEE" }
      - { name: amount_cents, type: integer, source: computed, description: "Computed by return_item_fee at coding; posted immediately as FEE_DEBIT" }
      - { name: status, type: enum, source: system, description: "POSTED | WAIVED" }
      - { name: waived_by_user_id, type: string, source: system, constraints: "nullable", description: "X-User-ID of waiving operator" }
      - { name: waive_reason, type: string, source: input, constraints: "nullable", description: "Recorded at waive" }
      - { name: waived_at, type: datetime, source: system, constraints: "nullable", description: "Set at waive" }

  - name: RecreditRequest
    parent: null
    common_fields: true
    fields:
      - { name: depositor_account_id, type: string, source: input, description: "FK -> DepositorAccount.id" }
      - { name: check_item_id, type: string, source: input, description: "FK -> CheckItem.id" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Consumer-claimed amount; must satisfy 0 < claimed <= CheckItem.amount_cents" }
      - { name: reason, type: string, source: input, description: "Recredit justification" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | PROVISIONALLY_CREDITED | CONFIRMED | REVOKED" }
      - { name: principal_amount_cents, type: integer, source: computed, description: "= min(claimed_amount_cents, 250000)" }
      - { name: interest_cents, type: integer, source: computed, description: "Sum over each calendar day from submitted_at to provisioned_at of round_half_up(principal_amount_cents * 0.0002); per-day rounding pinned" }
      - { name: provisional_amount_cents, type: integer, source: computed, description: "= principal_amount_cents + interest_cents" }
      - { name: submitted_at, type: datetime, source: system, description: "Set at creation from logical clock" }
      - { name: provisioned_at, type: datetime, source: system, constraints: "nullable", description: "Set at provisional-credit" }
      - { name: provisioned_late, type: boolean, source: computed, constraints: "nullable", description: "true when provisional credit posted more than 2 business days after submitted_at" }
      - { name: breach_flagged, type: boolean, source: system, default: false, description: "Set true by ops run-daily when still SUBMITTED more than 2 business days after submitted_at" }
      - { name: finalized_at, type: datetime, source: system, constraints: "nullable", description: "Set at finalize" }

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: depositor_account_id, type: string, source: system, description: "FK -> DepositorAccount.id" }
      - { name: entry_type, type: enum, source: system, description: "OPENING_CREDIT | DEPOSIT_CREDIT | PROVISIONAL_REVERSAL | SETTLEMENT_CREDIT | ITEM_RETURN_DEBIT | DUPLICATE_REVERSAL_CREDIT | FEE_DEBIT | FEE_WAIVER_CREDIT | RECREDIT_PROVISIONAL_CREDIT | RECREDIT_CLAWBACK_DEBIT | ADJUSTMENT_CREDIT | ADJUSTMENT_DEBIT" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount; credits positive, debits negative" }
      - { name: provisional, type: boolean, source: system, description: "true for provisional entries (excluded from settled_balance_cents)" }
      - { name: memo, type: string, source: system, constraints: "nullable", description: "Human-readable annotation" }
      - { name: check_item_id, type: string, source: system, constraints: "nullable", description: "FK -> CheckItem.id" }
      - { name: adjustment_case_id, type: string, source: system, constraints: "nullable", description: "FK -> AdjustmentCase.id" }
      - { name: fee_assessment_id, type: string, source: system, constraints: "nullable", description: "FK -> FeeAssessment.id" }
      - { name: recredit_request_id, type: string, source: system, constraints: "nullable", description: "FK -> RecreditRequest.id" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: DepositorAccount
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: FROZEN
        trigger: "system (automatic after any ledger write that leaves available_balance_cents < 0)"
        actor: system
        preconditions: []
        side_effects:
          - "New deposits for this account are rejected with ERR_ACCOUNT_FROZEN while FROZEN"
      - from: FROZEN
        to: ACTIVE
        trigger: "system (automatic after any ledger write that leaves available_balance_cents >= 0)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Cyclic: account can thaw and refreeze any number of times"

  - entity: CheckItem
    initial_state: RECEIVED
    terminal_states: [PAID, DUPLICATE_REJECTED, DEPOSIT_REJECTED]
    transitions:
      - from: RECEIVED
        to: UNDER_REVIEW
        trigger: "system (automatic at creation when is_large_item == true)"
        actor: system
        preconditions: []
        side_effects:
          - "Create HoldDecision(source=AUTO_LARGE_ITEM, status=PENDING, window [created_at, created_at + 2 business days))"
          - "Create AdjustmentCase(case_type=LARGE_ITEM_REVIEW, status=OPEN)"
          - "Create CustomerNotification(notification_type=LARGE_ITEM_HOLD_NOTICE, status=PENDING)"
      - from: UNDER_REVIEW
        to: RECEIVED
        trigger: "POST /bank/hold-decisions/{id}/decide with decision=RELEASE_FUNDS, or system when the PENDING hold expires via run-daily"
        actor: AdjustmentAnalyst
        preconditions:
          - "The decided HoldDecision is the item's latest PENDING hold"
        side_effects:
          - "HoldDecision.status -> DECIDED (decision=RELEASE_FUNDS)"
          - "Provisional DEPOSIT_CREDIT remains in place; funds become presentable"
      - from: UNDER_REVIEW
        to: DEPOSIT_REJECTED
        trigger: "POST /bank/hold-decisions/{id}/decide with decision=RETURN_ITEM"
        actor: AdjustmentAnalyst
        preconditions: []
        side_effects:
          - "HoldDecision.status -> DECIDED"
          - "Post LedgerEntry(PROVISIONAL_REVERSAL, -amount_cents, provisional=true, check_item_id=this item) — nets item ledger to 0"
          - "Create CustomerNotification(notification_type=DEPOSIT_REJECTED_NOTICE, status=PENDING)"
          - "Linked AdjustmentCase(LARGE_ITEM_REVIEW) auto-transitions OPEN -> RESOLVED with disposition NO_ACTION"
      - from: RECEIVED
        to: PRESENTED
        trigger: "POST /bank/check-items/{id}/present (no duplicate detected)"
        actor: ItemProcessor
        preconditions:
          - "CheckItem.status == RECEIVED"
          - "ClearingBank.status == ACTIVE (ERR_CLEARING_BANK_SUSPENDED)"
          - "No other CheckItem with same item_reference in status IN {PRESENTED, PAID} (else DUPLICATE_REJECTED branch fires instead)"
        side_effects:
          - "presented_at = now; presentment_count += 1"
          - "If encoded_amount_cents != amount_cents: create AdjustmentCase(case_type=ENCODING_ERROR, status=OPEN) and AdjustmentClaim(status=DRAFT, claimed_amount_cents = |encoded_amount_cents - amount_cents|, created_by_user_id='system')"
          - "If image_quality_score < 60: create AdjustmentCase(case_type=IMAGE_WARRANTY, status=OPEN)"
      - from: RECEIVED
        to: DUPLICATE_REJECTED
        trigger: "POST /bank/check-items/{id}/present (duplicate detected)"
        actor: ItemProcessor
        preconditions:
          - "Another CheckItem with same item_reference exists in status IN {PRESENTED, PAID}"
        side_effects:
          - "duplicate_of_item_id = id of the matching item (selector: status IN {PRESENTED, PAID}, earliest created_at)"
          - "Post LedgerEntry(DUPLICATE_REVERSAL_CREDIT, -amount_cents, provisional=true) — reverses the provisional DEPOSIT_CREDIT so the customer is made whole (duplicate presentment detection & credit)"
          - "Create AdjustmentCase(case_type=DUPLICATE_PRESENTMENT, status=OPEN)"
          - "Create CustomerNotification(notification_type=DUPLICATE_NOTICE, status=PENDING)"
      - from: PRESENTED
        to: PAID
        trigger: "POST /bank/check-items/{id}/pay"
        actor: ItemProcessor
        preconditions:
          - "CheckItem.status == PRESENTED"
        side_effects:
          - "paid_at = now"
          - "Post LedgerEntry(PROVISIONAL_REVERSAL, -amount_cents, provisional=true)"
          - "Post LedgerEntry(SETTLEMENT_CREDIT, +amount_cents, provisional=false)"
      - from: PRESENTED
        to: RETURNED
        trigger: "POST /bank/check-items/{id}/return-events"
        actor: ItemProcessor
        preconditions:
          - "CheckItem.status == PRESENTED"
        side_effects:
          - "Create ReturnEvent(status=PENDING_CODING, received_at=now)"
          - "Post LedgerEntry(ITEM_RETURN_DEBIT, -amount_cents, provisional=true, check_item_id=this item)"
          - "Create AdjustmentCase(case_type=RETURN_ITEM, status=OPEN, return_event_id=new ReturnEvent.id)"
          - "DepositorAccount balances recompute from ledger; if available_balance_cents < 0 the account auto-transitions ACTIVE -> FROZEN"
      - from: RETURNED
        to: PRESENTED
        trigger: "POST /bank/check-items/{id}/represent"
        actor: ItemProcessor
        preconditions:
          - "CheckItem.status == RETURNED"
          - "Latest ReturnEvent for this item (by created_at) has status == CODED (ERR_INVALID_STATE)"
          - "Latest ReturnEvent.re_presentment_eligible == true (ERR_RE_PRESENTMENT_NOT_ELIGIBLE)"
          - "presentment_count < 2 (ERR_MAX_PRESENTMENTS_EXCEEDED)"
        side_effects:
          - "presentment_count += 1; presented_at = now"
        note: "Cyclic: PRESENTED -> RETURNED -> PRESENTED may repeat until presentment_count reaches 2"

  - entity: ReturnEvent
    initial_state: PENDING_CODING
    terminal_states: [CODED]
    transitions:
      - from: PENDING_CODING
        to: CODED
        trigger: "POST /bank/return-events/{id}/code"
        actor: ItemProcessor
        preconditions:
          - "ReturnEvent.status == PENDING_CODING"
        side_effects:
          - "reason_code recorded; coded_at = now; re_presentment_eligible computed"
          - "Create FeeAssessment(fee_type=RETURN_ITEM_FEE, status=POSTED, amount per return_item_fee) and post LedgerEntry(FEE_DEBIT, -amount_cents, provisional=false, fee_assessment_id=new fee)"
          - "Create CustomerNotification(notification_type=RETURN_NOTICE, status=PENDING, due_at = coded_at advanced to 17:00:00Z on the next business day)"
          - "DepositorAccount balances recompute; if available_balance_cents < 0 the account auto-transitions ACTIVE -> FROZEN"

  - entity: HoldDecision
    initial_state: PENDING
    terminal_states: [DECIDED, EXPIRED]
    transitions:
      - from: PENDING
        to: DECIDED
        trigger: "POST /bank/hold-decisions/{id}/decide"
        actor: AdjustmentAnalyst
        preconditions:
          - "HoldDecision.status == PENDING"
          - "decision == EXTEND_HOLD requires extend_until > current hold_until (ERR_INVALID_REQUEST)"
        side_effects:
          - "decision, decided_at, decided_by_user_id recorded"
          - "RELEASE_FUNDS: CheckItem UNDER_REVIEW -> RECEIVED"
          - "EXTEND_HOLD: hold_until = extend_until; CheckItem remains UNDER_REVIEW"
          - "RETURN_ITEM: CheckItem UNDER_REVIEW -> DEPOSIT_REJECTED with its listed side effects"
      - from: PENDING
        to: EXPIRED
        trigger: "system (run-daily sweep when hold_until <= now)"
        actor: system
        preconditions: []
        side_effects:
          - "If the item is UNDER_REVIEW it auto-transitions to RECEIVED (funds auto-released on expired review)"

  - entity: AdjustmentCase
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: ASSIGNED
        trigger: "POST /bank/adjustment-cases/{id}/assign"
        actor: OperationsAdmin
        preconditions:
          - "expected_adjustment_case_version matches current version (ERR_STALE_VERSION)"
        side_effects:
          - "assigned_analyst_id set; version increments by 1"
      - from: ASSIGNED
        to: ASSIGNED
        trigger: "POST /bank/adjustment-cases/{id}/assign (re-assignment supersedes)"
        actor: OperationsAdmin
        preconditions:
          - "expected_adjustment_case_version matches current version (ERR_STALE_VERSION)"
        side_effects:
          - "assigned_analyst_id replaced; version increments by 1"
      - from: REOPENED
        to: ASSIGNED
        trigger: "POST /bank/adjustment-cases/{id}/assign"
        actor: OperationsAdmin
        preconditions:
          - "expected_adjustment_case_version matches current version (ERR_STALE_VERSION)"
        side_effects:
          - "assigned_analyst_id set; version increments by 1"
      - from: ESCALATED
        to: ASSIGNED
        trigger: "POST /bank/adjustment-cases/{id}/assign"
        actor: OperationsAdmin
        preconditions:
          - "expected_adjustment_case_version matches current version (ERR_STALE_VERSION)"
        side_effects:
          - "assigned_analyst_id set; version increments by 1"
      - from: ASSIGNED
        to: RESOLVED
        trigger: "POST /bank/adjustment-cases/{id}/resolve"
        actor: AdjustmentAnalyst
        preconditions:
          - "X-User-ID == assigned_analyst_id (ERR_NOT_ASSIGNED_ANALYST)"
          - "disposition IN {CREDIT_CUSTOMER, DEBIT_CUSTOMER, NO_ACTION}; amount_cents required and > 0 unless disposition == NO_ACTION (ERR_INVALID_REQUEST)"
        side_effects:
          - "disposition/resolution_amount_cents/resolved_at recorded"
          - "CREDIT_CUSTOMER: post LedgerEntry(ADJUSTMENT_CREDIT, +amount_cents, provisional=false, adjustment_case_id=this case)"
          - "DEBIT_CUSTOMER: post LedgerEntry(ADJUSTMENT_DEBIT, -amount_cents, provisional=false, adjustment_case_id=this case)"
          - "DepositorAccount balances recompute (auto FROZEN/ACTIVE transitions apply)"
      - from: RESOLVED
        to: REOPENED
        trigger: "POST /bank/adjustment-cases/{id}/reopen"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "reopen_count += 1; disposition, resolution_amount_cents, resolved_at cleared"
        note: "Cyclic: RESOLVED -> REOPENED -> ASSIGNED -> RESOLVED may repeat"
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /bank/adjustment-cases/{id}/close, or system when a linked AdjustmentClaim/WarrantyClaim reaches a terminal state and no non-terminal claims remain"
        actor: AdjustmentAnalyst
        preconditions:
          - "All linked AdjustmentClaims in {SETTLED, WRITTEN_OFF} and all linked WarrantyClaims in {HONORED, WRITTEN_OFF} (ERR_CASE_HAS_OPEN_CLAIMS)"
        side_effects:
          - "closed_at recorded"
          - "Create CustomerNotification(notification_type=CASE_CLOSED, status=PENDING)"
      - from: OPEN
        to: ESCALATED
        trigger: "system (run-daily: a linked CustomerNotification transitioned to BREACHED)"
        actor: system
        preconditions: []
        side_effects: ["escalated_at recorded"]
      - from: ASSIGNED
        to: ESCALATED
        trigger: "system (run-daily: a linked CustomerNotification transitioned to BREACHED)"
        actor: system
        preconditions: []
        side_effects: ["escalated_at recorded"]
      - from: REOPENED
        to: ESCALATED
        trigger: "system (run-daily: a linked CustomerNotification transitioned to BREACHED)"
        actor: system
        preconditions: []
        side_effects: ["escalated_at recorded"]

  - entity: AdjustmentClaim
    initial_state: DRAFT
    terminal_states: [SETTLED, WRITTEN_OFF]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /bank/adjustment-claims/{id}/submit"
        actor: AdjustmentAnalyst
        preconditions:
          - "AdjustmentClaim.status == DRAFT (ERR_INVALID_STATE)"
          - "Linked AdjustmentCase.status == ASSIGNED (ERR_INVALID_STATE)"
          - "now is within ClearingBank.claim_window_business_days business days of created_at (ERR_CLAIM_WINDOW_EXPIRED)"
          - "ClearingBank has fewer than daily_claim_capacity claims already submitted on the current business day (ERR_CLEARING_BANK_CAPACITY_EXCEEDED)"
          - "ClearingBank.status == ACTIVE (ERR_CLEARING_BANK_SUSPENDED)"
          - "claimed_amount_cents > 0 (ERR_INVALID_AMOUNT)"
        side_effects: ["submitted_at = now"]
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /bank/adjustment-claims/{id}/acknowledge"
        actor: OperationsAdmin
        preconditions: []
        side_effects: ["clearing_bank_ref recorded"]
      - from: ACKNOWLEDGED
        to: SETTLED
        trigger: "POST /bank/adjustment-claims/{id}/settle with outcome=SETTLED"
        actor: AdjustmentAnalyst
        preconditions:
          - "X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "recovered_amount_cents required and >= 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "recovered_amount_cents and settled_at recorded"
          - "Bubble-up: if linked AdjustmentCase.status == RESOLVED and no non-terminal claims/warranties remain, case auto-transitions RESOLVED -> CLOSED (with CASE_CLOSED notification)"
      - from: ACKNOWLEDGED
        to: DENIED
        trigger: "POST /bank/adjustment-claims/{id}/settle with outcome=DENIED"
        actor: AdjustmentAnalyst
        preconditions:
          - "X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["settled_at recorded"]
      - from: ESCALATED
        to: SETTLED
        trigger: "POST /bank/adjustment-claims/{id}/settle with outcome=SETTLED"
        actor: AdjustmentAnalyst
        preconditions:
          - "X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["recovered_amount_cents and settled_at recorded; case bubble-up as above"]
      - from: ESCALATED
        to: DENIED
        trigger: "POST /bank/adjustment-claims/{id}/settle with outcome=DENIED"
        actor: AdjustmentAnalyst
        preconditions:
          - "X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["settled_at recorded"]
      - from: SUBMITTED
        to: ESCALATED
        trigger: "system (run-daily: aging_business_days >= 10)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACKNOWLEDGED
        to: ESCALATED
        trigger: "system (run-daily: aging_business_days >= 10)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DENIED
        to: WRITTEN_OFF
        trigger: "POST /bank/adjustment-claims/{id}/write-off"
        actor: ComplianceOfficer
        preconditions:
          - "aging_business_days >= 30 (ERR_CLAIM_NOT_AGED_ENOUGH)"
          - "X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "write_off_reason and written_off_at recorded"
          - "Bubble-up: if linked AdjustmentCase.status == RESOLVED and no non-terminal claims/warranties remain, case auto-transitions RESOLVED -> CLOSED and creates CustomerNotification(CASE_CLOSED)"
      - from: ESCALATED
        to: WRITTEN_OFF
        trigger: "POST /bank/adjustment-claims/{id}/write-off"
        actor: ComplianceOfficer
        preconditions:
          - "aging_business_days >= 30 (ERR_CLAIM_NOT_AGED_ENOUGH)"
          - "X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "write_off_reason and written_off_at recorded"
          - "Bubble-up: case auto-close as above"

  - entity: WarrantyClaim
    initial_state: DRAFT
    terminal_states: [HONORED, WRITTEN_OFF]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /bank/warranty-claims/{id}/submit"
        actor: AdjustmentAnalyst
        preconditions:
          - "WarrantyClaim.status == DRAFT (ERR_INVALID_STATE)"
          - "now <= deadline_at (ERR_WARRANTY_WINDOW_EXPIRED)"
        side_effects: ["submitted_at = now"]
      - from: SUBMITTED
        to: HONORED
        trigger: "POST /bank/warranty-claims/{id}/settle with outcome=HONORED"
        actor: AdjustmentAnalyst
        preconditions: ["X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["recovered_amount_cents and settled_at recorded; case bubble-up as for AdjustmentClaim"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /bank/warranty-claims/{id}/settle with outcome=REJECTED"
        actor: AdjustmentAnalyst
        preconditions: ["X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["settled_at recorded"]
      - from: ESCALATED
        to: HONORED
        trigger: "POST /bank/warranty-claims/{id}/settle with outcome=HONORED"
        actor: AdjustmentAnalyst
        preconditions: ["X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["recovered_amount_cents and settled_at recorded; case bubble-up"]
      - from: ESCALATED
        to: REJECTED
        trigger: "POST /bank/warranty-claims/{id}/settle with outcome=REJECTED"
        actor: AdjustmentAnalyst
        preconditions: ["X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["settled_at recorded"]
      - from: SUBMITTED
        to: ESCALATED
        trigger: "system (run-daily: aging_business_days >= 10)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REJECTED
        to: WRITTEN_OFF
        trigger: "POST /bank/warranty-claims/{id}/write-off"
        actor: ComplianceOfficer
        preconditions:
          - "aging_business_days >= 30 (ERR_CLAIM_NOT_AGED_ENOUGH)"
          - "X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["write_off_reason and written_off_at recorded; case bubble-up"]
      - from: ESCALATED
        to: WRITTEN_OFF
        trigger: "POST /bank/warranty-claims/{id}/write-off"
        actor: ComplianceOfficer
        preconditions:
          - "aging_business_days >= 30 (ERR_CLAIM_NOT_AGED_ENOUGH)"
          - "X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["write_off_reason and written_off_at recorded; case bubble-up"]

  - entity: CustomerNotification
    initial_state: PENDING
    terminal_states: [DELIVERED, BREACHED]
    transitions:
      - from: PENDING
        to: DELIVERED
        trigger: "POST /bank/notifications/{id}/deliver"
        actor: CustomerService
        preconditions: []
        side_effects: ["delivered_at = now"]
      - from: PENDING
        to: BREACHED
        trigger: "system (run-daily: now > due_at)"
        actor: system
        preconditions: []
        side_effects:
          - "Linked AdjustmentCase (if in {OPEN, ASSIGNED, REOPENED}) auto-transitions to ESCALATED with escalated_at recorded"

  - entity: FeeAssessment
    initial_state: POSTED
    terminal_states: [WAIVED]
    transitions:
      - from: POSTED
        to: WAIVED
        trigger: "POST /bank/fees/{id}/waive"
        actor: CustomerService
        preconditions:
          - "If actor role == CustomerService: amount_cents <= 2500 (ERR_FEE_WAIVE_LIMIT_EXCEEDED); ComplianceOfficer may waive any amount"
        side_effects:
          - "Post LedgerEntry(FEE_WAIVER_CREDIT, +amount_cents, provisional=false, fee_assessment_id=this fee)"
          - "waived_by_user_id, waive_reason, waived_at recorded"
          - "DepositorAccount balances recompute (auto FROZEN/ACTIVE transitions apply)"

  - entity: RecreditRequest
    initial_state: SUBMITTED
    terminal_states: [CONFIRMED, REVOKED]
    transitions:
      - from: SUBMITTED
        to: PROVISIONALLY_CREDITED
        trigger: "POST /bank/recredit-requests/{id}/provisional-credit"
        actor: CustomerService
        preconditions: []
        side_effects:
          - "principal_amount_cents, interest_cents, provisional_amount_cents computed per recredit_provisional_amount"
          - "Post LedgerEntry(RECREDIT_PROVISIONAL_CREDIT, +provisional_amount_cents, provisional=true, recredit_request_id=this request)"
          - "provisioned_at = now; provisioned_late computed (true when more than 2 business days after submitted_at)"
      - from: PROVISIONALLY_CREDITED
        to: CONFIRMED
        trigger: "POST /bank/recredit-requests/{id}/finalize with outcome=CONFIRMED"
        actor: AdjustmentAnalyst
        preconditions: []
        side_effects: ["finalized_at = now; provisional credit stands"]
      - from: PROVISIONALLY_CREDITED
        to: REVOKED
        trigger: "POST /bank/recredit-requests/{id}/finalize with outcome=REVOKED"
        actor: AdjustmentAnalyst
        preconditions:
          - "now <= submitted_at + 45 calendar days (ERR_FINALIZE_WINDOW_EXPIRED)"
        side_effects:
          - "Post LedgerEntry(RECREDIT_CLAWBACK_DEBIT, -provisional_amount_cents, provisional=true, recredit_request_id=this request) — nets recredit ledger for this request to 0"
          - "finalized_at = now"
          - "DepositorAccount balances recompute (auto FROZEN/ACTIVE transitions apply; balance may go negative)"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: account-update-stale-version
    parent_entity: DepositorAccount
    write_endpoint: "PATCH /bank/accounts/{id}"
    occ_field: "expected_depositor_account_version"
    description: |
      Updating a DepositorAccount whose version has advanced since the client
      last observed it is rejected. The second writer's view of risk_tier /
      reg_cc_eligible is stale, so the update is refused with 412 rather than
      silently overwriting the newer state.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: case-assign-stale-version
    parent_entity: AdjustmentCase
    write_endpoint: "POST /bank/adjustment-cases/{id}/assign"
    occ_field: "expected_adjustment_case_version"
    description: |
      Assigning (or re-assigning) an AdjustmentCase whose version has advanced
      since the client last observed it is rejected. Re-assignment legitimately
      supersedes the prior assignee, so a stale version indicates the client
      missed an intervening assignment or status change and the write is
      refused with 412.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: return_item_fee
    trigger: "ReturnEvent transitions PENDING_CODING -> CODED (fee assessed and posted immediately at coding)"
    algorithm: tiered_pricing
    formula: |
      prior_returns = DepositorAccount.returned_item_count_30d - 1
        # evaluated AFTER this event flips to CODED, so subtract the current event
      base = BASE_FEE_CENTS[reason_code]
      mult = RISK_MULTIPLIER[DepositorAccount.risk_tier]
      component1 = round_half_up(base * mult)              # per-component rounding
      if prior_returns == 0: surcharge = 0
      elif prior_returns IN {1, 2}: surcharge = 500
      else: surcharge = 1500                                # prior_returns >= 3
      fee_cents = component1 + surcharge
    input_set: "The ReturnEvent being coded; its CheckItem's DepositorAccount; prior CODED ReturnEvents for the same account with coded_at in (now-30d, now]"
    constants:
      BASE_FEE_CENTS: { NSF: 2500, STOP_PAYMENT: 0, CLOSED_ACCOUNT: 3000, MISSING_ENDORSEMENT: 0, ALTERED_OR_FICTITIOUS: 0, IMAGE_NONCONFORMING: 0, DUPLICATE_PRESENTMENT: 0, REFER_TO_MAKER: 1500 }
      RISK_MULTIPLIER: { STANDARD: 1.0, HIGH_RISK: 1.5 }
      SURCHARGE_TIER_1_2_CENTS: 500
      SURCHARGE_TIER_3PLUS_CENTS: 1500
      RETURN_COUNT_WINDOW_DAYS: 30
    precision: "integer cents; the base*multiplier component is rounded round_half_up BEFORE the surcharge is added — component-first order is pinned"
    variants: []

  - name: recredit_provisional_amount
    trigger: "RecreditRequest transitions SUBMITTED -> PROVISIONALLY_CREDITED"
    algorithm: aggregation
    formula: |
      principal = min(claimed_amount_cents, RECREDIT_PROVISIONAL_CAP_CENTS)
      days = calendar days from submitted_at's date to provisioned_at's date (end - start, whole days; 0 when same day)
      interest = SUM over each of the `days` elapsed days of round_half_up(principal * DAILY_INTEREST_RATE)
        # PINNED ORDER: round each day's interest to cents first, then sum.
        # The alternative (multiply by days first, round once) yields different cents
        # and is forbidden. E.g. principal 133333, 5 days: per-day 27 -> 135, not 133.
      provisional_amount_cents = principal + interest
    input_set: "The RecreditRequest being provisioned and its claimed_amount_cents, submitted_at, and current logical time"
    constants:
      RECREDIT_PROVISIONAL_CAP_CENTS: 250000
      DAILY_INTEREST_RATE: 0.0002
      RECREDIT_PROVISIONAL_BUSINESS_DAYS: 2
      RECREDIT_FINALIZE_WINDOW_DAYS: 45
      RECREDIT_CLAIM_WINDOW_DAYS: 40
    precision: "integer cents, round_half_up per elapsed day, then summed"
    variants: []

  - name: account_balance_derivation
    trigger: "On every LedgerEntry write for the account and on every account read"
    algorithm: aggregation
    formula: |
      available_balance_cents = SUM(amount_cents) over ALL LedgerEntry rows for the account
      settled_balance_cents  = SUM(amount_cents) over LedgerEntry rows with provisional == false
    input_set: "All LedgerEntry rows whose depositor_account_id == account id (no status filter — LedgerEntry is append-only)"
    constants: {}
    precision: "integer cents, exact"
    variants:
      - name: available_variant
        when: "Gating decisions (deposit freeze check) and customer-facing balance"
        difference: "Includes provisional entries (DEPOSIT_CREDIT, ITEM_RETURN_DEBIT, PROVISIONAL_REVERSAL, RECREDIT_PROVISIONAL_CREDIT, RECREDIT_CLAWBACK_DEBIT)"
      - name: settled_variant
        when: "Settlement reporting and audit reconciliation"
        difference: "Excludes provisional entries; a freshly deposited item raises available but not settled until pay posts SETTLEMENT_CREDIT"

  - name: claim_aging_days
    trigger: "On claim/warranty read, on run-daily sweep, and at write-off precondition evaluation"
    algorithm: chronological
    formula: |
      aging_calendar_days = (today's date - created_at's date) in whole calendar days
      aging_business_days = count of dates D with created_at's date < D <= today's date where D is Monday..Friday
    input_set: "The AdjustmentClaim or WarrantyClaim and the current logical clock date"
    constants:
      CLAIM_ESCALATION_BUSINESS_DAYS: 10
      WRITE_OFF_BUSINESS_DAYS: 30
    precision: "whole days"
    variants:
      - name: business_variant
        when: "Escalation sweep (>= 10) and write-off eligibility (>= 30)"
        difference: "Counts only Mon-Fri dates strictly after creation up to and including today"
      - name: calendar_variant
        when: "Aging reports and audit display"
        difference: "Counts all calendar dates; e.g. a claim created Friday 2026-05-01 read Monday 2026-05-11 has calendar 10 but business 6"

  - name: re_presentment_eligibility
    trigger: "ReturnEvent transitions PENDING_CODING -> CODED"
    algorithm: lookup_mapping
    formula: |
      eligible = reason_code IN {NSF, MISSING_ENDORSEMENT, IMAGE_NONCONFORMING, REFER_TO_MAKER}
      NOT eligible: {STOP_PAYMENT, CLOSED_ACCOUNT, ALTERED_OR_FICTITIOUS, DUPLICATE_PRESENTMENT}
    input_set: "The ReturnEvent being coded"
    constants:
      MAX_PRESENTMENTS: 2
    precision: "boolean"
    variants: []

  - name: large_item_classification
    trigger: "CheckItem creation"
    algorithm: threshold
    formula: |
      is_large_item = (amount_cents >= LARGE_ITEM_THRESHOLD_CENTS)   # exactly 500000 triggers review
    input_set: "The CheckItem being created"
    constants:
      LARGE_ITEM_THRESHOLD_CENTS: 500000
      AUTO_HOLD_BUSINESS_DAYS: 2
      IMAGE_QUALITY_MIN_SCORE: 60
    precision: "boolean; boundary is inclusive (>=)"
    variants: []

  - name: notification_due_at
    trigger: "CustomerNotification creation"
    algorithm: chronological
    formula: |
      due_at = created_at advanced to 17:00:00Z on the next business day (Mon-Fri) strictly after created_at's date
    input_set: "The CustomerNotification being created"
    constants:
      NOTIFICATION_DUE_BUSINESS_DAYS: 1
    precision: "timestamp, second precision"
    variants: []

  - name: hold_window_initial
    trigger: "HoldDecision creation (auto and manual)"
    algorithm: chronological
    formula: |
      AUTO: window = [created_at, created_at advanced by 2 business days, same time-of-day)
      MANUAL: window = [now, input hold_until)
      Overlap test (half-open): a new manual window [s, e) on an item is rejected
      iff there exists another HoldDecision on the same item with status != EXPIRED,
      decision IS NULL or decision != RELEASE_FUNDS, and window [s2, e2) such that
      s < e2 AND s2 < e. Touching windows (e == s2 or s == e2) do NOT overlap.
    input_set: "All HoldDecision rows for the same CheckItem"
    constants:
      AUTO_HOLD_BUSINESS_DAYS: 2
    precision: "timestamp comparison"
    variants: []

  - name: freeze_window_overlap
    trigger: "POST /bank/accounts/{id}/freezes"
    algorithm: interval_merge
    formula: |
      Freeze windows are CLOSED intervals [start_at, end_at].
      A new freeze [s, e] on an account is rejected iff there exists another
      AccountFreeze on the same account with [s2, e2] such that s <= e2 AND s2 <= e.
      Touching windows (e == s2 or s == e2) DO overlap under closed semantics.
    input_set: "All AccountFreeze rows for the same DepositorAccount"
    constants: {}
    precision: "timestamp comparison"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Acting role is in the endpoint's roles list", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Customer role may only access resources whose depositor_account_id equals X-User-ID (entity-backed ownership)", error_id: ERR_FORBIDDEN_OWNERSHIP, http_status: 403, applies_to: "Customer-accessible endpoints (GET item/case/fee/notification/recredit/ledger/freeze/account reads, POST /bank/recredit-requests)" }
  - { priority: 4, category: existence, check: "Path resources exist, validated left-to-right (account before freeze, item before return-event, case before claim, etc.)", error_id: ERR_ACCOUNT_NOT_FOUND, http_status: 404, applies_to: "all parameterized endpoints (per-resource NOT_FOUND errors: ERR_ACCOUNT_NOT_FOUND, ERR_CLEARING_BANK_NOT_FOUND, ERR_ITEM_NOT_FOUND, ERR_CASE_NOT_FOUND, ERR_CLAIM_NOT_FOUND, ERR_WARRANTY_NOT_FOUND, ERR_RETURN_EVENT_NOT_FOUND, ERR_HOLD_NOT_FOUND, ERR_NOTIFICATION_NOT_FOUND, ERR_FEE_NOT_FOUND, ERR_RECREDIT_NOT_FOUND)" }
  - { priority: 5, category: state, check: "OCC: expected_<parent>_version equals the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PATCH /bank/accounts/{id}, POST /bank/adjustment-cases/{id}/assign" }
  - { priority: 6, category: state, check: "State-machine preconditions for the requested transition (includes ERR_INVALID_STATE, ERR_MAX_PRESENTMENTS_EXCEEDED, ERR_RE_PRESENTMENT_NOT_ELIGIBLE, ERR_ACCOUNT_FROZEN for deposits on FROZEN/frozen-window accounts, ERR_CLEARING_BANK_SUSPENDED for present/submit on SUSPENDED bank)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 7, category: business_safety, check: "Segregation of duties and authority: claim/warranty settle or write-off actor != created_by_user_id (ERR_SEGREGATION_OF_DUTIES); resolve actor == assigned_analyst_id (ERR_NOT_ASSIGNED_ANALYST); CustomerService fee waive cap 2500 (ERR_FEE_WAIVE_LIMIT_EXCEEDED)", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "settle, write-off, resolve, waive endpoints" }
  - { priority: 8, category: business_temporal, check: "Deadline windows: claim submit within claim_window_business_days (ERR_CLAIM_WINDOW_EXPIRED); warranty submit by deadline_at (ERR_WARRANTY_WINDOW_EXPIRED); recredit create within 40 days of paid_at (ERR_RECREDIT_WINDOW_EXPIRED); REVOKED finalize within 45 days of submitted_at (ERR_FINALIZE_WINDOW_EXPIRED); write-off only at aging_business_days >= 30 (ERR_CLAIM_NOT_AGED_ENOUGH)", error_id: ERR_CLAIM_WINDOW_EXPIRED, http_status: 422, applies_to: "submit, create, finalize, write-off endpoints" }
  - { priority: 9, category: business_constraint, check: "Structural constraints: freeze overlap (ERR_FREEZE_WINDOW_OVERLAP), hold overlap (ERR_HOLD_WINDOW_OVERLAP), warranty claim only on IMAGE_WARRANTY case (ERR_CASE_TYPE_MISMATCH), one open recredit per item (ERR_RECREDIT_ALREADY_OPEN), account reg_cc_eligible (ERR_RECREDIT_NOT_ELIGIBLE), unique account_number (ERR_DUPLICATE_ACCOUNT_NUMBER), unique routing_number (ERR_DUPLICATE_ROUTING_NUMBER), case close requires terminal children (ERR_CASE_HAS_OPEN_CLAIMS), clearing bank daily capacity (ERR_CLEARING_BANK_CAPACITY_EXCEEDED)", error_id: ERR_FREEZE_WINDOW_OVERLAP, http_status: 409, applies_to: "create/decide/close/submit endpoints" }
  - { priority: 10, category: business_referential, check: "Cross-references coherent: RecreditRequest.check_item_id must belong to RecreditRequest.depositor_account_id (ERR_RECREDIT_ITEM_MISMATCH)", error_id: ERR_RECREDIT_ITEM_MISMATCH, http_status: 422, applies_to: "POST /bank/recredit-requests" }
  - { priority: 11, category: business_fiscal, check: "Amount sanity: claimed amounts > 0 and recredit claimed <= CheckItem.amount_cents (ERR_INVALID_AMOUNT); malformed/missing fields and bad enums (ERR_INVALID_REQUEST, 400)", error_id: ERR_INVALID_AMOUNT, http_status: 422, applies_to: "create/resolve/settle endpoints" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/bank/accounts", description: "Create a depositor account; opening_balance_cents > 0 posts one OPENING_CREDIT LedgerEntry (provisional=false)", roles: [OperationsAdmin], code: 201, input: [customer_name, account_number, "risk_tier?", "reg_cc_eligible?", "opening_balance_cents?"], output: DepositorAccount, side_effects: ["OPENING_CREDIT ledger entry when opening_balance_cents > 0", "version starts at 1"] }
  - { method: GET, path: "/bank/accounts/{id}", description: "Read one account including computed available_balance_cents, settled_balance_cents, returned_item_count_30d", roles: [OperationsAdmin, ItemProcessor, AdjustmentAnalyst, ComplianceOfficer, CustomerService, Customer], code: 200, input: [], output: DepositorAccount, side_effects: [] }
  - { method: GET, path: "/bank/accounts", description: "List accounts with pagination", roles: [OperationsAdmin, ItemProcessor, AdjustmentAnalyst, ComplianceOfficer, CustomerService], code: 200, input: ["status?", "limit?", "offset?"], output: "DepositorAccount[]", side_effects: [] }
  - { method: PATCH, path: "/bank/accounts/{id}", description: "Update risk_tier and/or reg_cc_eligible with OCC on the account version", roles: [OperationsAdmin], code: 200, input: ["risk_tier?", "reg_cc_eligible?", expected_depositor_account_version], output: DepositorAccount, side_effects: ["increments DepositorAccount.version by 1"] }
  - { method: POST, path: "/bank/accounts/{id}/freezes", description: "Place a closed-interval freeze window; overlapping (including touching) windows rejected", roles: [ComplianceOfficer], code: 201, input: [start_at, end_at, reason], output: AccountFreeze, side_effects: [] }
  - { method: GET, path: "/bank/accounts/{id}/freezes", description: "List freezes for an account", roles: [OperationsAdmin, ItemProcessor, AdjustmentAnalyst, ComplianceOfficer, CustomerService, Customer], code: 200, input: ["limit?", "offset?"], output: "AccountFreeze[]", side_effects: [] }
  - { method: POST, path: "/bank/clearing-banks", description: "Register a clearing bank with its deadline windows and daily claim capacity", roles: [OperationsAdmin], code: 201, input: [name, routing_number, "claim_window_business_days?", "warranty_window_days?", "daily_claim_capacity?", "status?"], output: ClearingBank, side_effects: [] }
  - { method: GET, path: "/bank/clearing-banks/{id}", description: "Read one clearing bank", roles: [OperationsAdmin, ItemProcessor, AdjustmentAnalyst, ComplianceOfficer, CustomerService], code: 200, input: [], output: ClearingBank, side_effects: [] }
  - { method: GET, path: "/bank/clearing-banks/{id}/claims", description: "List adjustment claims directed at a clearing bank", roles: [OperationsAdmin, ItemProcessor, AdjustmentAnalyst, ComplianceOfficer, CustomerService], code: 200, input: ["status?", "limit?", "offset?"], output: "AdjustmentClaim[]", side_effects: [] }
  - { method: POST, path: "/bank/check-items", description: "Deposit a check item; posts provisional DEPOSIT_CREDIT; large items (amount_cents >= 500000) auto-transition to UNDER_REVIEW with auto HoldDecision, LARGE_ITEM_REVIEW case, and hold notice", roles: [ItemProcessor], code: 201, input: [depositor_account_id, clearing_bank_id, item_reference, amount_cents, encoded_amount_cents, image_quality_score, capture_channel], output: CheckItem, side_effects: ["LedgerEntry(DEPOSIT_CREDIT, +amount_cents, provisional=true)", "auto UNDER_REVIEW cascade when is_large_item", "ERR_ACCOUNT_FROZEN when account FROZEN or covered by an ACTIVE freeze window"] }
  - { method: GET, path: "/bank/check-items/{id}", description: "Read one check item", roles: [OperationsAdmin, ItemProcessor, AdjustmentAnalyst, ComplianceOfficer, CustomerService, Customer], code: 200, input: [], output: CheckItem, side_effects: [] }
  - { method: GET, path: "/bank/check-items", description: "List check items with filters", roles: [OperationsAdmin, ItemProcessor, AdjustmentAnalyst, ComplianceOfficer, CustomerService], code: 200, input: ["depositor_account_id?", "clearing_bank_id?", "duplicate_of_item_id?", "status?", "limit?", "offset?"], output: "CheckItem[]", side_effects: [] }
  - { method: POST, path: "/bank/check-items/{id}/present", description: "Present a RECEIVED item to its clearing bank; branches to DUPLICATE_REJECTED when a same-reference item is PRESENTED/PAID; auto-creates ENCODING_ERROR case + DRAFT claim on amount mismatch and IMAGE_WARRANTY case when image_quality_score < 60", roles: [ItemProcessor], code: 200, input: [], output: CheckItem, side_effects: ["presentment_count += 1, presented_at = now", "duplicate-detection cascade OR encoding/image case creation"] }
  - { method: POST, path: "/bank/check-items/{id}/pay", description: "Mark a PRESENTED item paid; reverses provisional credit and posts SETTLEMENT_CREDIT", roles: [ItemProcessor], code: 200, input: [], output: CheckItem, side_effects: ["LedgerEntry(PROVISIONAL_REVERSAL, -amount_cents, provisional=true)", "LedgerEntry(SETTLEMENT_CREDIT, +amount_cents, provisional=false)", "paid_at = now"] }
  - { method: POST, path: "/bank/check-items/{id}/return-events", description: "Record a return from the clearing bank; item -> RETURNED, ITEM_RETURN_DEBIT posted, RETURN_ITEM case created; may auto-freeze the account", roles: [ItemProcessor], code: 201, input: [], output: ReturnEvent, side_effects: ["ReturnEvent(PENDING_CODING)", "LedgerEntry(ITEM_RETURN_DEBIT, -amount_cents, provisional=true)", "AdjustmentCase(RETURN_ITEM, OPEN)", "account auto FROZEN when available_balance_cents < 0"] }
  - { method: GET, path: "/bank/check-items/{id}/return-events", description: "List return events for an item", roles: [OperationsAdmin, ItemProcessor, AdjustmentAnalyst, ComplianceOfficer, CustomerService, Customer], code: 200, input: ["limit?", "offset?"], output: "ReturnEvent[]", side_effects: [] }
  - { method: POST, path: "/bank/return-events/{id}/code", description: "Code the return reason; computes re_presentment_eligible, assesses and posts the return-item fee, creates the RETURN_NOTICE notification", roles: [ItemProcessor], code: 200, input: [reason_code], output: ReturnEvent, side_effects: ["FeeAssessment(POSTED) + LedgerEntry(FEE_DEBIT)", "CustomerNotification(RETURN_NOTICE, PENDING)", "account auto FROZEN when available_balance_cents < 0"] }
  - { method: POST, path: "/bank/check-items/{id}/represent", description: "Re-present a RETURNED item whose latest return is CODED and eligible; limited to 2 total presentments", roles: [ItemProcessor], code: 200, input: [], output: CheckItem, side_effects: ["presentment_count += 1", "presented_at = now"] }
  - { method: POST, path: "/bank/check-items/{id}/hold-decisions", description: "Place a manual supplementary hold window [now, hold_until) on a non-terminal item; half-open overlap with an existing active window rejected", roles: [AdjustmentAnalyst], code: 201, input: [hold_until, reason], output: HoldDecision, side_effects: [] }
  - { method: GET, path: "/bank/check-items/{id}/hold-decisions", description: "List hold decisions for an item", roles: [OperationsAdmin, ItemProcessor, AdjustmentAnalyst, ComplianceOfficer, CustomerService], code: 200, input: ["limit?", "offset?"], output: "HoldDecision[]", side_effects: [] }
  - { method: POST, path: "/bank/hold-decisions/{id}/decide", description: "Decide a PENDING hold: RELEASE_FUNDS returns item to RECEIVED, EXTEND_HOLD moves hold_until, RETURN_ITEM rejects the deposit", roles: [AdjustmentAnalyst], code: 200, input: [decision, "extend_until?"], output: HoldDecision, side_effects: ["per-decision CheckItem transitions and cascades per state machine"] }
  - { method: GET, path: "/bank/check-items/{id}/adjustment-cases", description: "List adjustment cases for an item", roles: [OperationsAdmin, ItemProcessor, AdjustmentAnalyst, ComplianceOfficer, CustomerService, Customer], code: 200, input: ["case_type?", "status?", "limit?", "offset?"], output: "AdjustmentCase[]", side_effects: [] }
  - { method: GET, path: "/bank/adjustment-cases/{id}", description: "Read one adjustment case", roles: [OperationsAdmin, ItemProcessor, AdjustmentAnalyst, ComplianceOfficer, CustomerService, Customer], code: 200, input: [], output: AdjustmentCase, side_effects: [] }
  - { method: GET, path: "/bank/adjustment-cases", description: "List adjustment cases with filters", roles: [OperationsAdmin, ItemProcessor, AdjustmentAnalyst, ComplianceOfficer, CustomerService], code: 200, input: ["check_item_id?", "return_event_id?", "case_type?", "status?", "limit?", "offset?"], output: "AdjustmentCase[]", side_effects: [] }
  - { method: POST, path: "/bank/adjustment-cases/{id}/assign", description: "Assign or re-assign an analyst; OCC on case version; allowed from OPEN, ASSIGNED, REOPENED, ESCALATED", roles: [OperationsAdmin], code: 200, input: [assigned_analyst_id, expected_adjustment_case_version], output: AdjustmentCase, side_effects: ["increments AdjustmentCase.version by 1", "status -> ASSIGNED"] }
  - { method: POST, path: "/bank/adjustment-cases/{id}/resolve", description: "Resolve an ASSIGNED case; resolver must be the assignee; posts ADJUSTMENT_CREDIT or ADJUSTMENT_DEBIT per disposition", roles: [AdjustmentAnalyst], code: 200, input: [disposition, "amount_cents?", "resolution_note?"], output: AdjustmentCase, side_effects: ["ledger adjustment entry unless NO_ACTION", "balance recompute may freeze/thaw account"] }
  - { method: POST, path: "/bank/adjustment-cases/{id}/reopen", description: "Reopen a RESOLVED case (cycle back to REOPENED)", roles: [ComplianceOfficer], code: 200, input: [reopen_reason], output: AdjustmentCase, side_effects: ["reopen_count += 1", "resolution fields cleared"] }
  - { method: POST, path: "/bank/adjustment-cases/{id}/close", description: "Manually close a RESOLVED case; all linked claims/warranties must be terminal", roles: [AdjustmentAnalyst, ComplianceOfficer], code: 200, input: [], output: AdjustmentCase, side_effects: ["CustomerNotification(CASE_CLOSED, PENDING)"] }
  - { method: POST, path: "/bank/adjustment-cases/{id}/claims", description: "Manually create a DRAFT adjustment claim on a case", roles: [AdjustmentAnalyst], code: 201, input: [claimed_amount_cents, "description?"], output: AdjustmentClaim, side_effects: [] }
  - { method: GET, path: "/bank/adjustment-cases/{id}/claims", description: "List adjustment claims for a case", roles: [OperationsAdmin, ItemProcessor, AdjustmentAnalyst, ComplianceOfficer, CustomerService], code: 200, input: ["status?", "limit?", "offset?"], output: "AdjustmentClaim[]", side_effects: [] }
  - { method: POST, path: "/bank/adjustment-claims/{id}/submit", description: "Submit a DRAFT claim to the clearing bank inside the claim window and daily capacity", roles: [AdjustmentAnalyst], code: 200, input: [], output: AdjustmentClaim, side_effects: ["submitted_at = now"] }
  - { method: POST, path: "/bank/adjustment-claims/{id}/acknowledge", description: "Record clearing-bank acknowledgment of a SUBMITTED claim", roles: [OperationsAdmin], code: 200, input: ["clearing_bank_ref?"], output: AdjustmentClaim, side_effects: [] }
  - { method: POST, path: "/bank/adjustment-claims/{id}/settle", description: "Settle an ACKNOWLEDGED or ESCALATED claim as SETTLED or DENIED; creator may not settle own claim", roles: [AdjustmentAnalyst], code: 200, input: [outcome, "recovered_amount_cents?"], output: AdjustmentClaim, side_effects: ["case auto-close bubble-up when RESOLVED and all children terminal"] }
  - { method: POST, path: "/bank/adjustment-claims/{id}/write-off", description: "Write off a DENIED or ESCALATED claim aged >= 30 business days; creator may not write off own claim", roles: [ComplianceOfficer], code: 200, input: [write_off_reason], output: AdjustmentClaim, side_effects: ["case auto-close bubble-up with CASE_CLOSED notification"] }
  - { method: POST, path: "/bank/adjustment-cases/{id}/warranty-claims", description: "Create a DRAFT warranty claim; only on IMAGE_WARRANTY cases", roles: [AdjustmentAnalyst], code: 201, input: [claimed_amount_cents], output: WarrantyClaim, side_effects: [] }
  - { method: GET, path: "/bank/adjustment-cases/{id}/warranty-claims", description: "List warranty claims for a case", roles: [OperationsAdmin, ItemProcessor, AdjustmentAnalyst, ComplianceOfficer, CustomerService], code: 200, input: ["status?", "limit?", "offset?"], output: "WarrantyClaim[]", side_effects: [] }
  - { method: POST, path: "/bank/warranty-claims/{id}/submit", description: "Submit a DRAFT warranty claim by its deadline_at", roles: [AdjustmentAnalyst], code: 200, input: [], output: WarrantyClaim, side_effects: ["submitted_at = now"] }
  - { method: POST, path: "/bank/warranty-claims/{id}/settle", description: "Settle a SUBMITTED or ESCALATED warranty claim as HONORED or REJECTED; creator may not settle own claim", roles: [AdjustmentAnalyst], code: 200, input: [outcome, "recovered_amount_cents?"], output: WarrantyClaim, side_effects: ["case auto-close bubble-up"] }
  - { method: POST, path: "/bank/warranty-claims/{id}/write-off", description: "Write off a REJECTED or ESCALATED warranty claim aged >= 30 business days; creator may not write off own claim", roles: [ComplianceOfficer], code: 200, input: [write_off_reason], output: WarrantyClaim, side_effects: ["case auto-close bubble-up"] }
  - { method: GET, path: "/bank/notifications/{id}", description: "Read one customer notification", roles: [OperationsAdmin, ItemProcessor, AdjustmentAnalyst, ComplianceOfficer, CustomerService, Customer], code: 200, input: [], output: CustomerNotification, side_effects: [] }
  - { method: GET, path: "/bank/notifications", description: "List notifications with filters", roles: [OperationsAdmin, ItemProcessor, AdjustmentAnalyst, ComplianceOfficer, CustomerService, Customer], code: 200, input: ["depositor_account_id?", "adjustment_case_id?", "status?", "limit?", "offset?"], output: "CustomerNotification[]", side_effects: [] }
  - { method: POST, path: "/bank/notifications/{id}/deliver", description: "Mark a PENDING notification delivered", roles: [CustomerService], code: 200, input: [], output: CustomerNotification, side_effects: ["delivered_at = now"] }
  - { method: GET, path: "/bank/fees/{id}", description: "Read one fee assessment", roles: [OperationsAdmin, ItemProcessor, AdjustmentAnalyst, ComplianceOfficer, CustomerService, Customer], code: 200, input: [], output: FeeAssessment, side_effects: [] }
  - { method: GET, path: "/bank/fees", description: "List fee assessments with filters", roles: [OperationsAdmin, ItemProcessor, AdjustmentAnalyst, ComplianceOfficer, CustomerService, Customer], code: 200, input: ["depositor_account_id?", "adjustment_case_id?", "return_event_id?", "status?", "limit?", "offset?"], output: "FeeAssessment[]", side_effects: [] }
  - { method: POST, path: "/bank/fees/{id}/waive", description: "Waive a POSTED fee; CustomerService capped at amount_cents <= 2500, ComplianceOfficer uncapped; posts compensating FEE_WAIVER_CREDIT", roles: [CustomerService, ComplianceOfficer], code: 200, input: [waive_reason], output: FeeAssessment, side_effects: ["LedgerEntry(FEE_WAIVER_CREDIT, +amount_cents, provisional=false)", "balance recompute may freeze/thaw account"] }
  - { method: POST, path: "/bank/recredit-requests", description: "Create a Reg CC expedited recredit request for a PAID item within 40 days of paid_at; Customer role restricted to own account", roles: [Customer, CustomerService], code: 201, input: [depositor_account_id, check_item_id, claimed_amount_cents, reason], output: RecreditRequest, side_effects: ["submitted_at = now"] }
  - { method: GET, path: "/bank/recredit-requests/{id}", description: "Read one recredit request", roles: [OperationsAdmin, ItemProcessor, AdjustmentAnalyst, ComplianceOfficer, CustomerService, Customer], code: 200, input: [], output: RecreditRequest, side_effects: [] }
  - { method: GET, path: "/bank/recredit-requests", description: "List recredit requests with filters", roles: [OperationsAdmin, ItemProcessor, AdjustmentAnalyst, ComplianceOfficer, CustomerService, Customer], code: 200, input: ["depositor_account_id?", "check_item_id?", "status?", "limit?", "offset?"], output: "RecreditRequest[]", side_effects: [] }
  - { method: POST, path: "/bank/recredit-requests/{id}/provisional-credit", description: "Grant provisional recredit; computes principal (capped 250000) + per-day-rounded interest; sets provisioned_late when later than 2 business days", roles: [CustomerService], code: 200, input: [], output: RecreditRequest, side_effects: ["LedgerEntry(RECREDIT_PROVISIONAL_CREDIT, +provisional_amount_cents, provisional=true)"] }
  - { method: POST, path: "/bank/recredit-requests/{id}/finalize", description: "Finalize as CONFIRMED (anytime) or REVOKED (only within 45 days of submitted_at); REVOKED posts compensating RECREDIT_CLAWBACK_DEBIT", roles: [AdjustmentAnalyst], code: 200, input: [outcome], output: RecreditRequest, side_effects: ["RECREDIT_CLAWBACK_DEBIT when REVOKED", "balance recompute may freeze/thaw account"] }
  - { method: GET, path: "/bank/ledger-entries/{id}", description: "Read one ledger entry (append-only; no update or delete endpoints exist)", roles: [OperationsAdmin, ItemProcessor, AdjustmentAnalyst, ComplianceOfficer, CustomerService, Customer], code: 200, input: [], output: LedgerEntry, side_effects: [] }
  - { method: GET, path: "/bank/ledger-entries", description: "List ledger entries with filters; Customer restricted to own depositor_account_id", roles: [OperationsAdmin, ItemProcessor, AdjustmentAnalyst, ComplianceOfficer, CustomerService, Customer], code: 200, input: ["depositor_account_id?", "check_item_id?", "adjustment_case_id?", "fee_assessment_id?", "recredit_request_id?", "entry_type?", "limit?", "offset?"], output: "LedgerEntry[]", side_effects: [] }
  - { method: POST, path: "/bank/ops/run-daily", description: "Ops-run checkpoint: escalates claims/warranties with aging_business_days >= 10, breaches notifications past due_at (escalating their cases), expires holds with hold_until <= now (auto-releasing UNDER_REVIEW items to RECEIVED), flags late recredit requests", roles: [OperationsAdmin], code: 200, input: [], output: { claims_escalated: integer, warranties_escalated: integer, notifications_breached: integer, holds_expired: integer, recredits_flagged: integer }, side_effects: ["sweep transitions per state machines"] }
  - { method: POST, path: "/_clock/set_current_utc", description: "Test-driving endpoint: set the logical clock. Startup default is exactly 2026-05-01T00:00:00Z (a Friday); the server MUST NOT use wall-clock time before or after this call.", roles: [OperationsAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["all timestamps, deadlines, and aging computations read this clock"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not in the endpoint's roles list" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Customer role accessing a resource whose depositor_account_id != X-User-ID" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Claim/warranty settle or write-off attempted by the user recorded as created_by_user_id" }
  - { id: ERR_NOT_ASSIGNED_ANALYST, http: 403, condition: "Resolve attempted by an analyst other than assigned_analyst_id" }
  - { id: ERR_FEE_WAIVE_LIMIT_EXCEEDED, http: 403, condition: "CustomerService attempting to waive a fee with amount_cents > 2500" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "Referenced DepositorAccount does not exist" }
  - { id: ERR_CLEARING_BANK_NOT_FOUND, http: 404, condition: "Referenced ClearingBank does not exist" }
  - { id: ERR_ITEM_NOT_FOUND, http: 404, condition: "Referenced CheckItem does not exist" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "Referenced AdjustmentCase does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "Referenced AdjustmentClaim does not exist" }
  - { id: ERR_WARRANTY_NOT_FOUND, http: 404, condition: "Referenced WarrantyClaim does not exist" }
  - { id: ERR_RETURN_EVENT_NOT_FOUND, http: 404, condition: "Referenced ReturnEvent does not exist" }
  - { id: ERR_HOLD_NOT_FOUND, http: 404, condition: "Referenced HoldDecision does not exist" }
  - { id: ERR_NOTIFICATION_NOT_FOUND, http: 404, condition: "Referenced CustomerNotification does not exist" }
  - { id: ERR_FEE_NOT_FOUND, http: 404, condition: "Referenced FeeAssessment does not exist" }
  - { id: ERR_RECREDIT_NOT_FOUND, http: 404, condition: "Referenced RecreditRequest does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, malformed value, invalid enum member, or missing conditional input (e.g. extend_until for EXTEND_HOLD, amount_cents for non-NO_ACTION resolve)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state-machine precondition failure (wrong from-state, terminal-state lockdown, case not ASSIGNED for claim submit, item not PAID for recredit, account CLOSED-like states)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_ACCOUNT_FROZEN, http: 409, condition: "Deposit attempted on an account with status FROZEN or covered by an ACTIVE AccountFreeze window" }
  - { id: ERR_CLEARING_BANK_SUSPENDED, http: 409, condition: "Present or claim-submit attempted against a SUSPENDED clearing bank" }
  - { id: ERR_MAX_PRESENTMENTS_EXCEEDED, http: 409, condition: "Re-present attempted when presentment_count >= 2" }
  - { id: ERR_RE_PRESENTMENT_NOT_ELIGIBLE, http: 409, condition: "Re-present attempted when the latest coded ReturnEvent has re_presentment_eligible == false" }
  - { id: ERR_CLAIM_WINDOW_EXPIRED, http: 422, condition: "Claim submit later than ClearingBank.claim_window_business_days business days after created_at" }
  - { id: ERR_CLAIM_NOT_AGED_ENOUGH, http: 422, condition: "Write-off attempted while aging_business_days < 30" }
  - { id: ERR_WARRANTY_WINDOW_EXPIRED, http: 422, condition: "Warranty submit later than deadline_at" }
  - { id: ERR_RECREDIT_WINDOW_EXPIRED, http: 422, condition: "Recredit request created more than 40 calendar days after CheckItem.paid_at" }
  - { id: ERR_FINALIZE_WINDOW_EXPIRED, http: 422, condition: "Finalize with outcome=REVOKED later than 45 calendar days after submitted_at" }
  - { id: ERR_FREEZE_WINDOW_OVERLAP, http: 409, condition: "New AccountFreeze window overlaps (closed-interval, touching counts) an existing freeze on the same account" }
  - { id: ERR_HOLD_WINDOW_OVERLAP, http: 409, condition: "New manual HoldDecision window overlaps (half-open, touching allowed) an existing active hold window on the same item" }
  - { id: ERR_CLEARING_BANK_CAPACITY_EXCEEDED, http: 409, condition: "Claim submit would exceed ClearingBank.daily_claim_capacity for the current business day" }
  - { id: ERR_CASE_TYPE_MISMATCH, http: 422, condition: "Warranty claim created on a case whose case_type != IMAGE_WARRANTY" }
  - { id: ERR_CASE_HAS_OPEN_CLAIMS, http: 409, condition: "Case close attempted while linked claims or warranties are non-terminal" }
  - { id: ERR_RECREDIT_ALREADY_OPEN, http: 409, condition: "Another RecreditRequest for the same check_item_id is in SUBMITTED or PROVISIONALLY_CREDITED" }
  - { id: ERR_RECREDIT_NOT_ELIGIBLE, http: 422, condition: "DepositorAccount.reg_cc_eligible == false" }
  - { id: ERR_RECREDIT_ITEM_MISMATCH, http: 422, condition: "check_item_id does not belong to depositor_account_id" }
  - { id: ERR_DUPLICATE_ACCOUNT_NUMBER, http: 409, condition: "account_number already exists" }
  - { id: ERR_DUPLICATE_ROUTING_NUMBER, http: 409, condition: "routing_number already exists" }
  - { id: ERR_INVALID_AMOUNT, http: 422, condition: "claimed_amount_cents <= 0, recredit claimed > CheckItem.amount_cents, or claim submit with claimed_amount_cents <= 0" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: OperationsAdmin
    description: "Back-office administrator: master data, case assignment, claim acknowledgment, ops-run checkpoint, logical clock"
    identity: opaque
