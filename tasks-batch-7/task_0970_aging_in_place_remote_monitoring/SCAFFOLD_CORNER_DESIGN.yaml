            - { call: "POST /v1/install-appointments", payload: { senior_id: "${s_bc}", kit_id: "${kit_bc}", installer_id: "${inst_bc}", window_start: "2026-05-01T09:00:00Z", window_end: "2026-05-01T10:00:00Z" }, as: PlatformAdmin, captures: { appt_bc: $.data.id } }
            - { call: "POST /v1/install-appointments/${appt_bc}/confirm", payload: {}, as: Installer, as_user_id: "${inst_bc}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/install-appointments/${appt_bc}/complete", payload: {}, as: Installer, as_user_id: "${inst_bc}" }
            - { call: "POST /v1/subscriptions/${sub_bc}/record-payment", payload: { outcome: "FAILED" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /v1/subscriptions/${sub_bc}/activate", payload: {}, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_BILLING_NOT_CURRENT' (HTTP 409); service stays PROVISIONING"
      - name: feature_gate_blocks_med_schedule_on_basic_plan
        claim_type: conditional_validation
        grounds: ["validations[priority=26]", "errors[ERR_FEATURE_GATED]"]
        distinguishing_aspect: "Conditional validation on plan configuration: medication_reminders_enabled=false makes POST /v1/medication-schedules fail ERR_FEATURE_GATED (422) for an ACTIVE subscription."
        test_recipe:
          setup: ["ESSENTIAL plan (meds disabled); senior ACTIVE with installed kit"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "ESSENTIAL", monthly_fee_cents: 3000, included_motion_sensors: 1, extra_sensor_fee_cents: 99, max_contacts: 3, checkin_interval_hours: 72, medication_reminders_enabled: false, wellness_report_enabled: false, wellness_report_cadence: "NONE" }, as: PlatformAdmin, captures: { plan_fg: $.data.id } }
