            - "Assignment.${asgX}: status == CANCELLED with cancel_reason == DNR_CANCEL (link 2 caused by link 1)"
            - "Absence.${abs1}.fill_status == DISPATCHING (link 3)"
            - "New OFFERED assignment on absence ${abs1} has substitute_id == ${subY} and offer_sequence == 2 (link 4; X excluded by the DNR eligibility filter)"
            - "School.${sch}.coverage_budget_committed_cents == 0 (provisional 40000 released by the DNR cancel)"
            - "Substitute.${subX}.reliability_trailing_score == 90 (only the FLAG_MAJOR -10 event; DNR_CANCEL carries no penalty)"

      - name: self_cancel_score_suspension_cross_school_cascade
        grounds:
          - state_machines.Assignment.ACCEPTED_to_CANCELLED
          - calculations.reliability_scores
          - calculations.suspension_evaluation
          - state_machines.Substitute.ACTIVE_to_SUSPENDED
          - state_machines.Absence.ASSIGNED_to_DISPATCHING
        distinguishing_aspect: |
          Depth-5 cascade from a different trigger than the DNR cascade: substitute self-cancel
          appends a SUB_CANCEL_LATE event; the event drops trailing score below 60 which
          auto-suspends the substitute; suspension cancels the substitute's ACCEPTED assignment
          at a second school; that cancellation reopens that absence; the reopen re-offers it
          to another substitute.
        test_recipe:
          setup:
            - "District with suspension_min_completions 0 (other defaults); schools S1 and S2 budgets 1000000"
            - "Sub A qualified MATH/HIGH and SCIENCE/HIGH; Sub B qualified SCIENCE/HIGH only; both ACTIVE"
            - "Sub A carries 3 MAJOR flags (trailing 70); A holds ACCEPTED assignments A1 (S1, Mon 2026-08-03..Tue 2026-08-04) and A2 (S2, Thu 2026-08-06..Fri 2026-08-07)"
            - "Clock 2026-08-02T12:00:00Z -> cancel of A1 is a late cancel (lead 12h < 24)"
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1", suspension_min_completions: 0 }, as: DistrictAdmin, captures: { dist: $.data.id } }
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S1", coverage_budget_total_cents: 1000000 }, as: DistrictAdmin, captures: { sch1: $.data.id } }
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S2", coverage_budget_total_cents: 1000000 }, as: DistrictAdmin, captures: { sch2: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch1}", full_name: "Teach One", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t1: $.data.id } }
