scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — dual_variant_calc
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: due_date_calendar_vs_business_day_variants
        grounds:
          - calculations.due_date_computation
          - entities.Regulator.fields.deadline_mode
          - entities.TrainingAssignment.fields.base_due_at
        distinguishing_aspect: |
          Deadline domain: two regulators with deadline_mode CALENDAR vs
          BUSINESS_DAYS produce different base_due_at for identical assigned_at
          (Monday 2026-08-03T09:00:00Z) and identical due_in_days=5 —
          2026-08-08T09:00:00Z vs 2026-08-10T09:00:00Z (weekend skipped).
        test_recipe:
          setup:
            - "Clock at Monday 2026-08-03T09:00:00Z"
            - "Regulator REG-CAL (CALENDAR) and REG-BUS (BUSINESS_DAYS), both recordkeeping_years 7"
            - "Curricula CUR-CAL and CUR-BUS, each ACTIVE with an effective version, passing 80, validity 12, evidence NONE"
            - "Role R-DUAL with two INITIAL_ONLY SOFT requirements (due_in_days 5) on the two curricula"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/regulators", payload: { code: "REG-CAL", name: "Calendar Regulator", deadline_mode: "CALENDAR", recordkeeping_years: 7 }, as: ComplianceAdmin, captures: { reg_cal: "$.data.id" } }
            - { call: "POST /compliance/regulators", payload: { code: "REG-BUS", name: "Business Regulator", deadline_mode: "BUSINESS_DAYS", recordkeeping_years: 7 }, as: ComplianceAdmin, captures: { reg_bus: "$.data.id" } }
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_cal}", code: "CUR-CAL", title: "Calendar Course", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE" }, as: ComplianceAdmin, captures: { cur_cal: "$.data.id", cur_cal_v: "$.data.version" } }
            - { call: "POST /compliance/curricula/${cur_cal}/versions", payload: { version_no: 1, effective_from: "2026-08-01T00:00:00Z", content_uri: "uri://cal-v1" }, as: ComplianceAdmin }
            - { call: "PATCH /compliance/curricula/${cur_cal}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur_cal_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_bus}", code: "CUR-BUS", title: "Business Course", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE" }, as: ComplianceAdmin, captures: { cur_bus: "$.data.id", cur_bus_v: "$.data.version" } }
            - { call: "POST /compliance/curricula/${cur_bus}/versions", payload: { version_no: 1, effective_from: "2026-08-01T00:00:00Z", content_uri: "uri://bus-v1" }, as: ComplianceAdmin }
            - { call: "PATCH /compliance/curricula/${cur_bus}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur_bus_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-DUAL", name: "Dual Role" }, as: ComplianceAdmin, captures: { role_id: "$.data.id" } }
            - { call: "POST /compliance/roles/${role_id}/requirements", payload: { curriculum_id: "${cur_cal}", recurrence: "INITIAL_ONLY", due_in_days: 5, criticality: "SOFT" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles/${role_id}/requirements", payload: { curriculum_id: "${cur_bus}", recurrence: "INITIAL_ONLY", due_in_days: 5, criticality: "SOFT" }, as: ComplianceAdmin }
          trigger:
            - { call: "POST /compliance/employees", payload: { employee_no: "E-DUAL-1", full_name: "Dual Hire", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}" }, as: HRAdmin, captures: { emp_id: "$.data.id" } }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${emp_id}", curriculum_id: "${cur_cal}" }, as: ComplianceAdmin, captures: { cal_assigned: "$.data[0].assigned_at", cal_due: "$.data[0].base_due_at" } }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${emp_id}", curriculum_id: "${cur_bus}" }, as: ComplianceAdmin, captures: { bus_due: "$.data[0].base_due_at" } }
          assert:
            - "cal_assigned == \"2026-08-03T09:00:00Z\""
            - "cal_due == \"2026-08-08T09:00:00Z\" (CALENDAR: +5 calendar days)"
            - "bus_due == \"2026-08-10T09:00:00Z\" (BUSINESS_DAYS: Aug 4,5,6,7 then skip Sat/Sun, land Mon Aug 10)"
            - "cal_due != bus_due for identical assigned_at and due_in_days"

      - name: compliance_rate_strict_vs_audit_lenient
        grounds:
          - calculations.compliance_rate
          - entities.AuditReport.fields.metric_variant
          - entities.AuditReport.fields.metrics
        distinguishing_aspect: |
          Population/audit domain (distinct from the deadline domain of the
          sibling instance): over the same population of 2 employees where E2 has
          a SUBMITTED-pending-review assignment, STRICT yields 50.00 while
          AUDIT_LENIENT yields 100.00.
        test_recipe:
          setup:
            - "Regulator REG-POP (CALENDAR, 7y); curriculum CUR-POP ACTIVE (passing 80, NONE)"
            - "Role R-MGMT with no requirements (manager M lives here, excluded from population)"
            - "Role R-REG with one SOFT INITIAL_ONLY requirement (due_in_days 30)"
            - "E1 fully verified; E2 submitted but still PENDING_REVIEW"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/regulators", payload: { code: "REG-POP", name: "Population Regulator", deadline_mode: "CALENDAR", recordkeeping_years: 7 }, as: ComplianceAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_id}", code: "CUR-POP", title: "Population Course", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE" }, as: ComplianceAdmin, captures: { cur_id: "$.data.id", cur_v: "$.data.version" } }
            - { call: "POST /compliance/curricula/${cur_id}/versions", payload: { version_no: 1, effective_from: "2026-08-01T00:00:00Z", content_uri: "uri://pop-v1" }, as: ComplianceAdmin }
            - { call: "PATCH /compliance/curricula/${cur_id}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-MGMT", name: "Management" }, as: ComplianceAdmin, captures: { role_mgmt: "$.data.id" } }
            - { call: "POST /compliance/roles", payload: { code: "R-REG", name: "Regulated" }, as: ComplianceAdmin, captures: { role_reg: "$.data.id" } }
            - { call: "POST /compliance/roles/${role_reg}/requirements", payload: { curriculum_id: "${cur_id}", recurrence: "INITIAL_ONLY", due_in_days: 30, criticality: "SOFT" }, as: ComplianceAdmin }
            - { call: "POST /compliance/employees", payload: { employee_no: "M-001", full_name: "Mgr One", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_mgmt}" }, as: HRAdmin, captures: { mgr_id: "$.data.id" } }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-001", full_name: "Emp One", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_reg}", manager_id: "${mgr_id}" }, as: HRAdmin, captures: { e1: "$.data.id" } }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-002", full_name: "Emp Two", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_reg}", manager_id: "${mgr_id}" }, as: HRAdmin, captures: { e2: "$.data.id" } }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${e1}", curriculum_id: "${cur_id}" }, as: ComplianceAdmin, captures: { a1: "$.data[0].id" } }
            - { call: "POST /compliance/assignments/${a1}/completions", payload: { score_pct: 90, evidence_type: "NONE" }, as: Employee, as_user_id: "${e1}", captures: { c1: "$.data.id" } }
            - { call: "POST /compliance/completions/${c1}/accept", payload: {}, as: ComplianceAdmin }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${e2}", curriculum_id: "${cur_id}" }, as: ComplianceAdmin, captures: { a2: "$.data[0].id" } }
            - { call: "POST /compliance/assignments/${a2}/completions", payload: { score_pct: 90, evidence_type: "NONE" }, as: Employee, as_user_id: "${e2}" }
          trigger:
            - { call: "POST /compliance/audit-reports", payload: { population_spec: { regulator_id: "${reg_id}" }, metric_variant: "STRICT" }, as: Auditor, captures: { strict_pop: "$.data.metrics.population_size", strict_comp: "$.data.metrics.compliant_count", strict_rate: "$.data.metrics.compliance_rate_pct" } }
            - { call: "POST /compliance/audit-reports", payload: { population_spec: { regulator_id: "${reg_id}" }, metric_variant: "AUDIT_LENIENT" }, as: Auditor, captures: { lenient_comp: "$.data.metrics.compliant_count", lenient_rate: "$.data.metrics.compliance_rate_pct" } }
          assert:
            - "strict_pop == 2 (manager excluded: no assignments under REG-POP)"
            - "strict_comp == 1 and strict_rate == 50.00 (SUBMITTED counts as open under STRICT)"
            - "lenient_comp == 2 and lenient_rate == 100.00 (SUBMITTED excluded from open set under AUDIT_LENIENT)"
            - "strict_rate != lenient_rate over identical data"

  # =====================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: escalation_threshold_hard_vs_soft_acceleration
        grounds:
          - calculations.escalation_and_deadline_status
          - entities.RoleRequirement.fields.criticality
          - state_machines.TrainingAssignment.deadline_transitions
        distinguishing_aspect: |
          Mode (a) — >=3 inputs (days overdue, criticality, regulator interval
          config, employee leave status) with a conditional branch: at the same
          clock (5 days + 1 second past due, interval 10), the SOFT assignment is
          OVERDUE while the HARD one is ESCALATED because HARD halves the
          threshold via ceil(10/2)=5.
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00Z; regulator REG-ESC (CALENDAR, interval 10, reminder 7)"
            - "Curricula CUR-H and CUR-S ACTIVE; role R-ESC with reqH (CUR-H, due_in_days 2, HARD) and reqS (CUR-S, due_in_days 2, SOFT)"
            - "Employee E-ESC with two assignments AH (HARD) and AS (SOFT), both due 2026-08-05T09:00:00Z, born DUE_SOON"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/regulators", payload: { code: "REG-ESC", name: "Escalation Regulator", deadline_mode: "CALENDAR", recordkeeping_years: 7, escalation_interval_days: 10, reminder_days_before_due: 7 }, as: ComplianceAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_id}", code: "CUR-H", title: "Hard Course", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE" }, as: ComplianceAdmin, captures: { cur_h: "$.data.id", cur_h_v: "$.data.version" } }
            - { call: "POST /compliance/curricula/${cur_h}/versions", payload: { version_no: 1, effective_from: "2026-08-01T00:00:00Z", content_uri: "uri://h-v1" }, as: ComplianceAdmin }
            - { call: "PATCH /compliance/curricula/${cur_h}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur_h_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_id}", code: "CUR-S", title: "Soft Course", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE" }, as: ComplianceAdmin, captures: { cur_s: "$.data.id", cur_s_v: "$.data.version" } }
            - { call: "POST /compliance/curricula/${cur_s}/versions", payload: { version_no: 1, effective_from: "2026-08-01T00:00:00Z", content_uri: "uri://s-v1" }, as: ComplianceAdmin }
            - { call: "PATCH /compliance/curricula/${cur_s}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur_s_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-ESC", name: "Escalation Role" }, as: ComplianceAdmin, captures: { role_id: "$.data.id" } }
            - { call: "POST /compliance/roles/${role_id}/requirements", payload: { curriculum_id: "${cur_h}", recurrence: "INITIAL_ONLY", due_in_days: 2, criticality: "HARD" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles/${role_id}/requirements", payload: { curriculum_id: "${cur_s}", recurrence: "INITIAL_ONLY", due_in_days: 2, criticality: "SOFT" }, as: ComplianceAdmin }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-ESC-1", full_name: "Esc Emp", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}" }, as: HRAdmin, captures: { emp: "$.data.id" } }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${emp}", curriculum_id: "${cur_h}" }, as: ComplianceAdmin, captures: { ah: "$.data[0].id" } }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${emp}", curriculum_id: "${cur_s}" }, as: ComplianceAdmin, captures: { asg_s: "$.data[0].id" } }
          trigger:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:01Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/_sweeps/run", payload: {}, as: ComplianceAdmin, captures: { sw_notices: "$.data.notices_created", sw_trans: "$.data.assignments_transitioned" } }
            - { call: "GET /compliance/assignments/${ah}", as: ComplianceAdmin, captures: { ah_dl: "$.data.deadline_status" } }
            - { call: "GET /compliance/assignments/${asg_s}", as: ComplianceAdmin, captures: { as_dl: "$.data.deadline_status" } }
            - { call: "GET /compliance/assignments/${ah}/escalations", as: ComplianceAdmin, captures: { ah_l2: "$.data[0].level", ah_l3: "$.data[1].level", ah_k3: "$.data[1].kind" } }
            - { call: "GET /compliance/assignments/${asg_s}/escalations", as: ComplianceAdmin, captures: { as_l2: "$.data[0].level", as_k2: "$.data[0].kind" } }
            - { call: "GET /compliance/employees/${emp}", as: ComplianceAdmin, captures: { emp_blocked: "$.data.compliance_blocked" } }
          assert:
            - "ah_dl == \"ESCALATED\" (HARD: threshold ceil(10/2)=5d; now = due + 5d + 1s)"
            - "as_dl == \"OVERDUE\" (SOFT: threshold 10d; 5d+1s <= 10d) — same clock, different state"
            - "sw_notices == 3 (AH: level-2 + level-3 backfill; AS: level-2; no level-1 because no sweep ever observed DUE_SOON)"
            - "sw_trans == 2"
            - "ah_l2 == 2 and ah_l3 == 3 and ah_k3 == \"ESCALATION_COMPLIANCE\" (list ordered triggered_at ASC, level ASC)"
            - "as_l2 == 2 and as_k2 == \"OVERDUE_MANAGER\""
            - "emp_blocked == true (HARD escalation sets compliance_blocked)"

      - name: audit_weighted_pass_rate_nested_rounding
        grounds:
          - calculations.audit_weighted_first_attempt_pass_rate
          - entities.AuditReport.fields.metrics
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters (distinct from mode (a)
          of the sibling instance): per-curriculum rates rounded to 2dp BEFORE
          the weighted mean yields 85.72 for rates 2/3 (->66.67, weight 3) and
          4/4 (->100.00, weight 4); pooling raw counts first would yield 85.71.
        test_recipe:
          setup:
            - "Regulator REG-W (CALENDAR); curricula CUR-W1 and CUR-W2 ACTIVE (passing 80, NONE)"
            - "Role R-W with SOFT INITIAL_ONLY requirements on both curricula (due_in_days 30)"
            - "Seven employees E-01..E-07 in R-W"
            - "CUR-W1 attempt-1 reviewed records: E-01 accept(90), E-02 accept(90), E-03 reject(90) -> rate 66.67, weight 3"
            - "CUR-W2 attempt-1 reviewed records: E-04..E-07 accept(95) -> rate 100.00, weight 4"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/regulators", payload: { code: "REG-W", name: "Weighted Regulator", deadline_mode: "CALENDAR", recordkeeping_years: 7 }, as: ComplianceAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_id}", code: "CUR-W1", title: "Weighted One", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE" }, as: ComplianceAdmin, captures: { cur1: "$.data.id", cur1_v: "$.data.version" } }
            - { call: "POST /compliance/curricula/${cur1}/versions", payload: { version_no: 1, effective_from: "2026-08-01T00:00:00Z", content_uri: "uri://w1-v1" }, as: ComplianceAdmin }
            - { call: "PATCH /compliance/curricula/${cur1}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur1_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_id}", code: "CUR-W2", title: "Weighted Two", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE" }, as: ComplianceAdmin, captures: { cur2: "$.data.id", cur2_v: "$.data.version" } }
            - { call: "POST /compliance/curricula/${cur2}/versions", payload: { version_no: 1, effective_from: "2026-08-01T00:00:00Z", content_uri: "uri://w2-v1" }, as: ComplianceAdmin }
            - { call: "PATCH /compliance/curricula/${cur2}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur2_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-W", name: "Weighted Role" }, as: ComplianceAdmin, captures: { role_id: "$.data.id" } }
            - { call: "POST /compliance/roles/${role_id}/requirements", payload: { curriculum_id: "${cur1}", recurrence: "INITIAL_ONLY", due_in_days: 30, criticality: "SOFT" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles/${role_id}/requirements", payload: { curriculum_id: "${cur2}", recurrence: "INITIAL_ONLY", due_in_days: 30, criticality: "SOFT" }, as: ComplianceAdmin }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-01", full_name: "Emp 01", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}" }, as: HRAdmin, captures: { e01: "$.data.id" } }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-02", full_name: "Emp 02", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}" }, as: HRAdmin, captures: { e02: "$.data.id" } }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-03", full_name: "Emp 03", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}" }, as: HRAdmin, captures: { e03: "$.data.id" } }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-04", full_name: "Emp 04", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}" }, as: HRAdmin, captures: { e04: "$.data.id" } }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-05", full_name: "Emp 05", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}" }, as: HRAdmin, captures: { e05: "$.data.id" } }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-06", full_name: "Emp 06", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}" }, as: HRAdmin, captures: { e06: "$.data.id" } }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-07", full_name: "Emp 07", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}" }, as: HRAdmin, captures: { e07: "$.data.id" } }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${e01}", curriculum_id: "${cur1}" }, as: ComplianceAdmin, captures: { a01: "$.data[0].id" } }
            - { call: "POST /compliance/assignments/${a01}/completions", payload: { score_pct: 90, evidence_type: "NONE" }, as: Employee, as_user_id: "${e01}", captures: { c01: "$.data.id" } }
            - { call: "POST /compliance/completions/${c01}/accept", payload: {}, as: ComplianceAdmin }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${e02}", curriculum_id: "${cur1}" }, as: ComplianceAdmin, captures: { a02: "$.data[0].id" } }
            - { call: "POST /compliance/assignments/${a02}/completions", payload: { score_pct: 90, evidence_type: "NONE" }, as: Employee, as_user_id: "${e02}", captures: { c02: "$.data.id" } }
            - { call: "POST /compliance/completions/${c02}/accept", payload: {}, as: ComplianceAdmin }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${e03}", curriculum_id: "${cur1}" }, as: ComplianceAdmin, captures: { a03: "$.data[0].id" } }
            - { call: "POST /compliance/assignments/${a03}/completions", payload: { score_pct: 90, evidence_type: "NONE" }, as: Employee, as_user_id: "${e03}", captures: { c03: "$.data.id" } }
            - { call: "POST /compliance/completions/${c03}/reject", payload: { review_note: "evidence unreadable" }, as: ComplianceAdmin }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${e04}", curriculum_id: "${cur2}" }, as: ComplianceAdmin, captures: { a04: "$.data[0].id" } }
            - { call: "POST /compliance/assignments/${a04}/completions", payload: { score_pct: 95, evidence_type: "NONE" }, as: Employee, as_user_id: "${e04}", captures: { c04: "$.data.id" } }
            - { call: "POST /compliance/completions/${c04}/accept", payload: {}, as: ComplianceAdmin }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${e05}", curriculum_id: "${cur2}" }, as: ComplianceAdmin, captures: { a05: "$.data[0].id" } }
            - { call: "POST /compliance/assignments/${a05}/completions", payload: { score_pct: 95, evidence_type: "NONE" }, as: Employee, as_user_id: "${e05}", captures: { c05: "$.data.id" } }
            - { call: "POST /compliance/completions/${c05}/accept", payload: {}, as: ComplianceAdmin }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${e06}", curriculum_id: "${cur2}" }, as: ComplianceAdmin, captures: { a06: "$.data[0].id" } }
            - { call: "POST /compliance/assignments/${a06}/completions", payload: { score_pct: 95, evidence_type: "NONE" }, as: Employee, as_user_id: "${e06}", captures: { c06: "$.data.id" } }
            - { call: "POST /compliance/completions/${c06}/accept", payload: {}, as: ComplianceAdmin }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${e07}", curriculum_id: "${cur2}" }, as: ComplianceAdmin, captures: { a07: "$.data[0].id" } }
            - { call: "POST /compliance/assignments/${a07}/completions", payload: { score_pct: 95, evidence_type: "NONE" }, as: Employee, as_user_id: "${e07}", captures: { c07: "$.data.id" } }
            - { call: "POST /compliance/completions/${c07}/accept", payload: {}, as: ComplianceAdmin }
          trigger:
            - { call: "POST /compliance/audit-reports", payload: { population_spec: { regulator_id: "${reg_id}" }, metric_variant: "STRICT" }, as: Auditor, captures: { w_rate: "$.data.metrics.weighted_first_attempt_pass_rate_pct", w_pop: "$.data.metrics.population_size" } }
          assert:
            - "w_rate == 85.72 — pinned order: (66.67*3 + 100.00*4)/7 = 600.01/7 = 85.715714 -> round_half_up 2dp = 85.72"
            - "w_rate != 85.71 (the pooled-counts order 6/7 = 85.714286 -> 85.71 is NON-CONFORMANT)"
            - "w_pop == 7"

  # =====================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: assignment_parallel_dimensions_revision_loop
        grounds:
          - state_machines.TrainingAssignment
          - entities.TrainingAssignment.fields.progress_status
          - entities.TrainingAssignment.fields.deadline_status
          - calculations.assignment_validity_expiry
        distinguishing_aspect: |
          TrainingAssignment carries two PARALLEL state dimensions plus a
          revision cycle: a reject loops progress SUBMITTED -> IN_PROGRESS while
          deadline_status stays OVERDUE, and once progress reaches terminal
          VERIFIED_COMPLETED the deadline dimension freezes at OVERDUE.
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00Z; regulator REG-LOOP (CALENDAR, interval 10, reminder 7)"
            - "Curriculum CUR-LOOP ACTIVE: passing 80, validity_months 12, max_attempts 3, evidence NONE"
            - "Role R-LOOP with SOFT VALIDITY_CYCLE requirement due_in_days 2; employee E-LOOP has assignment A (due 2026-08-05T09:00:00Z, born DUE_SOON)"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/regulators", payload: { code: "REG-LOOP", name: "Loop Regulator", deadline_mode: "CALENDAR", recordkeeping_years: 7, escalation_interval_days: 10, reminder_days_before_due: 7 }, as: ComplianceAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_id}", code: "CUR-LOOP", title: "Loop Course", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE", max_attempts: 3 }, as: ComplianceAdmin, captures: { cur_id: "$.data.id", cur_v: "$.data.version" } }
            - { call: "POST /compliance/curricula/${cur_id}/versions", payload: { version_no: 1, effective_from: "2026-08-01T00:00:00Z", content_uri: "uri://loop-v1" }, as: ComplianceAdmin }
            - { call: "PATCH /compliance/curricula/${cur_id}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-LOOP", name: "Loop Role" }, as: ComplianceAdmin, captures: { role_id: "$.data.id" } }
            - { call: "POST /compliance/roles/${role_id}/requirements", payload: { curriculum_id: "${cur_id}", recurrence: "VALIDITY_CYCLE", due_in_days: 2, criticality: "SOFT" }, as: ComplianceAdmin }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-LOOP-1", full_name: "Loop Emp", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}" }, as: HRAdmin, captures: { emp: "$.data.id" } }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${emp}", curriculum_id: "${cur_id}" }, as: ComplianceAdmin, captures: { a: "$.data[0].id" } }
          trigger:
            - { call: "GET /compliance/assignments/${a}", as: ComplianceAdmin, captures: { p0: "$.data.progress_status", d0: "$.data.deadline_status" } }
            - { call: "POST /compliance/assignments/${a}/start", payload: {}, as: Employee, as_user_id: "${emp}" }
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T09:00:01Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/_sweeps/run", payload: {}, as: ComplianceAdmin, captures: { sw1_notices: "$.data.notices_created" } }
            - { call: "GET /compliance/assignments/${a}", as: ComplianceAdmin, captures: { p1: "$.data.progress_status", d1: "$.data.deadline_status" } }
            - { call: "POST /compliance/assignments/${a}/completions", payload: { score_pct: 90, evidence_type: "NONE" }, as: Employee, as_user_id: "${emp}", captures: { c1: "$.data.id", late1: "$.data.is_late" } }
            - { call: "GET /compliance/assignments/${a}", as: ComplianceAdmin, captures: { p2: "$.data.progress_status", d2: "$.data.deadline_status" } }
            - { call: "POST /compliance/completions/${c1}/reject", payload: { review_note: "blurry evidence" }, as: ComplianceAdmin }
            - { call: "GET /compliance/assignments/${a}", as: ComplianceAdmin, captures: { p3: "$.data.progress_status", att3: "$.data.attempts_used", d3: "$.data.deadline_status" } }
            - { call: "POST /compliance/assignments/${a}/completions", payload: { score_pct: 92, evidence_type: "NONE" }, as: Employee, as_user_id: "${emp}", captures: { c2: "$.data.id", attno2: "$.data.attempt_no" } }
            - { call: "POST /compliance/completions/${c2}/accept", payload: {}, as: ComplianceAdmin }
            - { call: "GET /compliance/assignments/${a}", as: ComplianceAdmin, captures: { p4: "$.data.progress_status", att4: "$.data.attempts_used", d4: "$.data.deadline_status", ct4: "$.data.completed_at", ex4: "$.data.expires_at" } }
          assert:
            - "p0 == \"ASSIGNED\" and d0 == \"DUE_SOON\" (born inside the 7-day reminder window: due - assigned = 2d)"
            - "p1 == \"IN_PROGRESS\" and d1 == \"OVERDUE\" (sweep moved deadline dimension only; dimensions are independent)"
            - "sw1_notices == 1 (level-2 OVERDUE_MANAGER only; no sweep ever observed DUE_SOON so no level-1)"
            - "p2 == \"SUBMITTED\" and d2 == \"OVERDUE\" (submission moves progress only)"
            - "p3 == \"IN_PROGRESS\" and att3 == 1 and d3 == \"OVERDUE\" (reject loops SUBMITTED -> IN_PROGRESS; cycle, not linear)"
            - "attno2 == 2 (attempt ordinals continue across the loop)"
            - "p4 == \"VERIFIED_COMPLETED\" and att4 == 1 (accept does not consume attempts)"
            - "ct4 == \"2026-08-06T09:00:01Z\" and ex4 == \"2027-08-06T09:00:01Z\" (VALIDITY_CYCLE: +12 calendar months from accept time)"
            - "d4 == \"OVERDUE\" (deadline dimension frozen at last value once progress is terminal)"
            - "late1 == true (submitted strictly after due_at)"

      - name: attestation_exception_denial_cycle
        grounds:
          - state_machines.Attestation
          - state_machines.AttestationException
          - entities.Attestation.fields.status
        distinguishing_aspect: |
          Attestation (a different entity than TrainingAssignment) is CYCLIC via
          the exception path: PENDING -> EXCEPTION_PENDING -> (deny) -> PENDING
          again, after which the employee can still attest; denial is a revert,
          not a terminal state.
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00Z; regulator REG-ATT (CALENDAR); curriculum CUR-ATT ACTIVE (NONE, 80)"
            - "Role R-MGR2 (no requirements) holds manager M; role R-ATT has one SOFT INITIAL_ONLY requirement (due_in_days 30); employee E-ATT reports to M"
            - "Campaign CMP (year 2026, window 2026-08-01T00:00:00Z..2026-09-01T00:00:00Z, statement_version STMT-2026-08) OPEN; attestation ATT for E-ATT is PENDING"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/regulators", payload: { code: "REG-ATT", name: "Att Regulator", deadline_mode: "CALENDAR", recordkeeping_years: 7 }, as: ComplianceAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_id}", code: "CUR-ATT", title: "Att Course", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE" }, as: ComplianceAdmin, captures: { cur_id: "$.data.id", cur_v: "$.data.version" } }
            - { call: "POST /compliance/curricula/${cur_id}/versions", payload: { version_no: 1, effective_from: "2026-08-01T00:00:00Z", content_uri: "uri://att-v1" }, as: ComplianceAdmin }
            - { call: "PATCH /compliance/curricula/${cur_id}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-MGR2", name: "Mgr Role" }, as: ComplianceAdmin, captures: { role_mgr: "$.data.id" } }
            - { call: "POST /compliance/roles", payload: { code: "R-ATT", name: "Att Role" }, as: ComplianceAdmin, captures: { role_id: "$.data.id" } }
            - { call: "POST /compliance/roles/${role_id}/requirements", payload: { curriculum_id: "${cur_id}", recurrence: "INITIAL_ONLY", due_in_days: 30, criticality: "SOFT" }, as: ComplianceAdmin }
            - { call: "POST /compliance/employees", payload: { employee_no: "M-ATT-1", full_name: "Mgr Att", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_mgr}" }, as: HRAdmin, captures: { mgr: "$.data.id" } }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-ATT-1", full_name: "Emp Att", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}", manager_id: "${mgr}" }, as: HRAdmin, captures: { emp: "$.data.id" } }
            - { call: "POST /compliance/campaigns", payload: { year: 2026, regulator_id: "${reg_id}", window_open_at: "2026-08-01T00:00:00Z", window_close_at: "2026-09-01T00:00:00Z", statement_version: "STMT-2026-08" }, as: ComplianceAdmin, captures: { camp: "$.data.id" } }
            - { call: "POST /compliance/campaigns/${camp}/open", payload: {}, as: ComplianceAdmin }
            - { call: "GET /compliance/employees/${emp}/attestations", as: ComplianceAdmin, captures: { att: "$.data[0].id", st0: "$.data[0].status" } }
          trigger:
            - { call: "POST /compliance/attestations/${att}/exceptions", payload: { reason_code: "MEDICAL_LEAVE", detail: "Scheduled surgery in August" }, as: Manager, as_user_id: "${mgr}", captures: { exc: "$.data.id", exc_st: "$.data.status" } }
            - { call: "GET /compliance/attestations/${att}", as: ComplianceAdmin, captures: { st1: "$.data.status" } }
            - { call: "POST /compliance/exceptions/${exc}/deny", payload: { decision_note: "Insufficient justification" }, as: ComplianceAdmin }
            - { call: "GET /compliance/attestations/${att}", as: ComplianceAdmin, captures: { st2: "$.data.status" } }
            - { call: "POST /compliance/attestations/${att}/attest", payload: {}, as: Employee, as_user_id: "${emp}", captures: { st3: "$.data.status", at3: "$.data.attested_at", sv3: "$.data.statement_version_snapshot" } }
          assert:
            - "st0 == \"PENDING\""
            - "exc_st == \"REQUESTED\" and st1 == \"EXCEPTION_PENDING\""
            - "st2 == \"PENDING\" (denial loops the attestation back — cyclic revert)"
            - "st3 == \"ATTESTED\" and at3 == \"2026-08-03T09:00:00Z\" and sv3 == \"STMT-2026-08\""

  # =====================================================================
  # Rule 4 — transitive_cascade (different triggers)
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: role_change_apply_cascade_cancel_void_recompute
        grounds:
          - state_machines.EmployeeRoleChange
          - state_machines.TrainingAssignment.cancel_transition
          - state_machines.CompletionRecord.PENDING_REVIEW_to_VOIDED
          - entities.Employee.fields.current_role_id
        distinguishing_aspect: |
          Depth-3 cascade originating from a ROLE-CHANGE APPLY (sweep step 1):
          employee.current_role_id flip (hop 1) -> old-role-only assignment A1
          CANCELLED while shared-curriculum A2 survives (hop 2) -> A1's
          PENDING_REVIEW completion VOIDED by the cancellation itself (hop 3).
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00Z; regulator REG-RC (CALENDAR)"
            - "Curricula CUR-RC1 and CUR-RC2 ACTIVE (NONE, 80)"
            - "Role R-OLD with req1 (CUR-RC1, HARD) and req2 (CUR-RC2, SOFT); role R-NEW with req3 (CUR-RC2, SOFT — shared curriculum)"
            - "Employee E-RC in R-OLD with A1 (CUR-RC1) SUBMITTED (completion PENDING_REVIEW) and A2 (CUR-RC2) ASSIGNED"
            - "Role change RC to R-NEW effective 2026-08-03T10:00:00Z is SCHEDULED"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/regulators", payload: { code: "REG-RC", name: "RC Regulator", deadline_mode: "CALENDAR", recordkeeping_years: 7 }, as: ComplianceAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_id}", code: "CUR-RC1", title: "RC One", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE" }, as: ComplianceAdmin, captures: { cur1: "$.data.id", cur1_v: "$.data.version" } }
            - { call: "POST /compliance/curricula/${cur1}/versions", payload: { version_no: 1, effective_from: "2026-08-01T00:00:00Z", content_uri: "uri://rc1-v1" }, as: ComplianceAdmin }
            - { call: "PATCH /compliance/curricula/${cur1}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur1_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_id}", code: "CUR-RC2", title: "RC Two", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE" }, as: ComplianceAdmin, captures: { cur2: "$.data.id", cur2_v: "$.data.version" } }
            - { call: "POST /compliance/curricula/${cur2}/versions", payload: { version_no: 1, effective_from: "2026-08-01T00:00:00Z", content_uri: "uri://rc2-v1" }, as: ComplianceAdmin }
            - { call: "PATCH /compliance/curricula/${cur2}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur2_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-OLD", name: "Old Role" }, as: ComplianceAdmin, captures: { r_old: "$.data.id" } }
            - { call: "POST /compliance/roles/${r_old}/requirements", payload: { curriculum_id: "${cur1}", recurrence: "INITIAL_ONLY", due_in_days: 30, criticality: "HARD" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles/${r_old}/requirements", payload: { curriculum_id: "${cur2}", recurrence: "INITIAL_ONLY", due_in_days: 30, criticality: "SOFT" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-NEW", name: "New Role" }, as: ComplianceAdmin, captures: { r_new: "$.data.id" } }
            - { call: "POST /compliance/roles/${r_new}/requirements", payload: { curriculum_id: "${cur2}", recurrence: "INITIAL_ONLY", due_in_days: 30, criticality: "SOFT" }, as: ComplianceAdmin }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-RC-1", full_name: "RC Emp", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${r_old}" }, as: HRAdmin, captures: { emp: "$.data.id" } }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${emp}", curriculum_id: "${cur1}" }, as: ComplianceAdmin, captures: { a1: "$.data[0].id" } }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${emp}", curriculum_id: "${cur2}" }, as: ComplianceAdmin, captures: { a2: "$.data[0].id" } }
            - { call: "POST /compliance/assignments/${a1}/completions", payload: { score_pct: 90, evidence_type: "NONE" }, as: Employee, as_user_id: "${emp}", captures: { c1: "$.data.id" } }
            - { call: "POST /compliance/employees/${emp}/role-changes", payload: { to_role_id: "${r_new}", effective_at: "2026-08-03T10:00:00Z" }, as: HRAdmin, captures: { rc: "$.data.id", rc_st: "$.data.status" } }
          trigger:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/_sweeps/run", payload: {}, as: ComplianceAdmin, captures: { sw_rca: "$.data.role_changes_applied", sw_tr: "$.data.assignments_transitioned" } }
            - { call: "GET /compliance/role-changes/${rc}", as: ComplianceAdmin, captures: { rc_st2: "$.data.status", rc_applied: "$.data.applied_at" } }
            - { call: "GET /compliance/assignments/${a1}", as: ComplianceAdmin, captures: { a1_prog: "$.data.progress_status" } }
            - { call: "GET /compliance/assignments/${a1}/completions", as: ComplianceAdmin, captures: { c1_st: "$.data[0].review_status" } }
            - { call: "GET /compliance/assignments/${a2}", as: ComplianceAdmin, captures: { a2_prog: "$.data.progress_status" } }
            - { call: "GET /compliance/employees/${emp}", as: ComplianceAdmin, captures: { e_role: "$.data.current_role_id" } }
            - { call: "GET /compliance/assignments", payload: { source_role_change_id: "${rc}" }, as: ComplianceAdmin }
          assert:
            - "rc_st == \"SCHEDULED\" at creation (effective_at in the future); rc_st2 == \"APPLIED\" and rc_applied == \"2026-08-03T10:00:00Z\""
            - "sw_rca == 1 and sw_tr == 0 (cascade cancels are not sweep deadline transitions)"
            - "hop 1: e_role == ${r_new}"
            - "hop 2: a1_prog == \"CANCELLED\" (CUR-RC1 not required by R-NEW); a2_prog == \"ASSIGNED\" (shared curriculum CUR-RC2 survives untouched)"
            - "hop 3: c1_st == \"VOIDED\" (the cancellation itself voided the pending completion — caused by hop 2, not by the sweep directly)"
            - "GET /compliance/assignments?source_role_change_id=${rc} -> meta.total_count == 0 (R-NEW's only requirement is covered by surviving A2, so no new assignment is created)"

      - name: hard_escalation_blocks_employee_then_attestation
        grounds:
          - state_machines.TrainingAssignment.deadline_transitions
          - calculations.posture_block_evaluation
          - state_machines.Attestation.PENDING_to_BLOCKED
          - entities.Employee.fields.compliance_blocked
        distinguishing_aspect: |
          Depth-3 cascade originating from a different trigger — a SWEEP
          DEADLINE CROSSING (not a role change): assignment -> ESCALATED (hop 1)
          -> employee.compliance_blocked recomputed true because the requirement
          is HARD (hop 2) -> PENDING attestation under the OPEN campaign ->
          BLOCKED (hop 3).
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00Z; regulator REG-BLK (CALENDAR, interval 10, reminder 7)"
            - "Curriculum CUR-BLK ACTIVE; role R-BLKM (empty) for manager M; role R-BLK with HARD requirement due_in_days 2"
            - "Employee E-BLK with HARD assignment AH due 2026-08-05T09:00:00Z"
            - "Campaign CMP-BLK (window 2026-08-01..2026-09-01) OPEN; attestation ATT for E-BLK is PENDING"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/regulators", payload: { code: "REG-BLK", name: "Block Regulator", deadline_mode: "CALENDAR", recordkeeping_years: 7, escalation_interval_days: 10, reminder_days_before_due: 7 }, as: ComplianceAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_id}", code: "CUR-BLK", title: "Block Course", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE" }, as: ComplianceAdmin, captures: { cur_id: "$.data.id", cur_v: "$.data.version" } }
            - { call: "POST /compliance/curricula/${cur_id}/versions", payload: { version_no: 1, effective_from: "2026-08-01T00:00:00Z", content_uri: "uri://blk-v1" }, as: ComplianceAdmin }
            - { call: "PATCH /compliance/curricula/${cur_id}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-BLKM", name: "Blk Mgr Role" }, as: ComplianceAdmin, captures: { role_mgr: "$.data.id" } }
            - { call: "POST /compliance/roles", payload: { code: "R-BLK", name: "Blk Role" }, as: ComplianceAdmin, captures: { role_id: "$.data.id" } }
            - { call: "POST /compliance/roles/${role_id}/requirements", payload: { curriculum_id: "${cur_id}", recurrence: "INITIAL_ONLY", due_in_days: 2, criticality: "HARD" }, as: ComplianceAdmin }
            - { call: "POST /compliance/employees", payload: { employee_no: "M-BLK-1", full_name: "Blk Mgr", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_mgr}" }, as: HRAdmin, captures: { mgr: "$.data.id" } }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-BLK-1", full_name: "Blk Emp", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}", manager_id: "${mgr}" }, as: HRAdmin, captures: { emp: "$.data.id" } }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${emp}", curriculum_id: "${cur_id}" }, as: ComplianceAdmin, captures: { ah: "$.data[0].id" } }
            - { call: "POST /compliance/campaigns", payload: { year: 2026, regulator_id: "${reg_id}", window_open_at: "2026-08-01T00:00:00Z", window_close_at: "2026-09-01T00:00:00Z", statement_version: "STMT-BLK" }, as: ComplianceAdmin, captures: { camp: "$.data.id" } }
            - { call: "POST /compliance/campaigns/${camp}/open", payload: {}, as: ComplianceAdmin }
            - { call: "GET /compliance/employees/${emp}/attestations", as: ComplianceAdmin, captures: { att: "$.data[0].id", att_st0: "$.data[0].status" } }
          trigger:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:01Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/_sweeps/run", payload: {}, as: ComplianceAdmin, captures: { sw_notices: "$.data.notices_created", sw_tr: "$.data.assignments_transitioned", sw_blocked: "$.data.attestations_blocked" } }
            - { call: "GET /compliance/assignments/${ah}", as: ComplianceAdmin, captures: { ah_dl: "$.data.deadline_status" } }
            - { call: "GET /compliance/employees/${emp}", as: ComplianceAdmin, captures: { emp_blocked: "$.data.compliance_blocked" } }
            - { call: "GET /compliance/attestations/${att}", as: ComplianceAdmin, captures: { att_st: "$.data.status" } }
          assert:
            - "att_st0 == \"PENDING\" before the sweep"
            - "hop 1: ah_dl == \"ESCALATED\" (HARD threshold ceil(10/2)=5d crossed)"
            - "hop 2: emp_blocked == true (HARD escalation recomputes posture)"
            - "hop 3: att_st == \"BLOCKED\" (block cascades to the PENDING attestation under the OPEN campaign)"
            - "sw_tr == 1 and sw_notices == 2 (level-2 + level-3 backfill) and sw_blocked == 1"

  # =====================================================================
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_priority_beats_score_safety_on_submit
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - errors[ERR_ASSIGNMENT_NOT_SUBMITTABLE]
          - errors[ERR_SCORE_BELOW_PASSING]
        distinguishing_aspect: |
          Category pair state (P7) vs business_safety (P11): one request that is
          BOTH not-submittable (assignment already SUBMITTED) AND score-failing
          (10 < 80) must return ERR_ASSIGNMENT_NOT_SUBMITTABLE, proving state
          checks run before regulatory score checks.
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00Z; regulator REG-P5A; curriculum CUR-P5A ACTIVE (passing 80, NONE)"
            - "Role R-P5A with SOFT INITIAL_ONLY requirement (due_in_days 30); employee E-P5A has assignment A already SUBMITTED (score 90 pending review)"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/regulators", payload: { code: "REG-P5A", name: "P5A Regulator", deadline_mode: "CALENDAR", recordkeeping_years: 7 }, as: ComplianceAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_id}", code: "CUR-P5A", title: "P5A Course", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE" }, as: ComplianceAdmin, captures: { cur_id: "$.data.id", cur_v: "$.data.version" } }
            - { call: "POST /compliance/curricula/${cur_id}/versions", payload: { version_no: 1, effective_from: "2026-08-01T00:00:00Z", content_uri: "uri://p5a-v1" }, as: ComplianceAdmin }
            - { call: "PATCH /compliance/curricula/${cur_id}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-P5A", name: "P5A Role" }, as: ComplianceAdmin, captures: { role_id: "$.data.id" } }
            - { call: "POST /compliance/roles/${role_id}/requirements", payload: { curriculum_id: "${cur_id}", recurrence: "INITIAL_ONLY", due_in_days: 30, criticality: "SOFT" }, as: ComplianceAdmin }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-P5A-1", full_name: "P5A Emp", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}" }, as: HRAdmin, captures: { emp: "$.data.id" } }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${emp}", curriculum_id: "${cur_id}" }, as: ComplianceAdmin, captures: { a: "$.data[0].id" } }
            - { call: "POST /compliance/assignments/${a}/completions", payload: { score_pct: 90, evidence_type: "NONE" }, as: Employee, as_user_id: "${emp}" }
          trigger:
            - { call: "POST /compliance/assignments/${a}/completions", payload: { score_pct: 10, evidence_type: "NONE" }, as: Employee, as_user_id: "${emp}", captures: { err: "$.data.error_id" } }
            - { call: "GET /compliance/assignments/${a}", as: ComplianceAdmin, captures: { a_prog: "$.data.progress_status" } }
            - { call: "GET /compliance/assignments/${a}/completions", as: ComplianceAdmin }
          assert:
            - "err == \"ERR_ASSIGNMENT_NOT_SUBMITTABLE\" (state P7 wins over business_safety P11 even though score 10 < 80 also violates ERR_SCORE_BELOW_PASSING)"
            - "a_prog == \"SUBMITTED\" (unchanged)"
            - "GET /compliance/assignments/${a}/completions -> meta.total_count == 1 (no record created by the rejected request)"

      - name: temporal_priority_beats_role_unchanged_constraint
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_RETROACTIVE_LIMIT_EXCEEDED]
          - errors[ERR_ROLE_UNCHANGED]
        distinguishing_aspect: |
          Category pair business_temporal (P8) vs business_constraint (P9) —
          different from the state-vs-safety pair of the sibling instance: a
          role change that is BOTH retroactive beyond 30 days AND targeting the
          current role must return ERR_RETROACTIVE_LIMIT_EXCEEDED.
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00Z; role R-SAME (no requirements); employee E-P5B currently in R-SAME"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-SAME", name: "Same Role" }, as: ComplianceAdmin, captures: { role_id: "$.data.id" } }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-P5B-1", full_name: "P5B Emp", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}" }, as: HRAdmin, captures: { emp: "$.data.id" } }
          trigger:
            - { call: "POST /compliance/employees/${emp}/role-changes", payload: { to_role_id: "${role_id}", effective_at: "2026-06-15T00:00:00Z" }, as: HRAdmin, captures: { err: "$.data.error_id" } }
            - { call: "GET /compliance/role-changes", payload: { employee_id: "${emp}" }, as: ComplianceAdmin }
          assert:
            - "err == \"ERR_RETROACTIVE_LIMIT_EXCEEDED\" (temporal P8 wins: 2026-06-15 is 49 days before now, beyond the 30-day limit; to_role == current role also violates ERR_ROLE_UNCHANGED at P9)"
            - "GET /compliance/role-changes?employee_id=${emp} -> meta.total_count == 0"

  # =====================================================================
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: score_exactly_at_passing_boundary
        grounds:
          - calculations.curriculum_effectiveness
          - entities.CompletionRecord.fields.passed
          - errors[ERR_SCORE_BELOW_PASSING]
        distinguishing_aspect: |
          Numeric score metric on POST /compliance/assignments/{id}/completions:
          score_pct == passing_score_pct (80.00) PASSES (inclusive >=), while
          79.99 is rejected with ERR_SCORE_BELOW_PASSING.
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00Z; regulator REG-B6A; curriculum CUR-B6A ACTIVE (passing_score_pct 80, evidence NONE)"
            - "Role R-B6A with SOFT INITIAL_ONLY requirement (due_in_days 30); employee E-B6A has assignment A ASSIGNED"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/regulators", payload: { code: "REG-B6A", name: "B6A Regulator", deadline_mode: "CALENDAR", recordkeeping_years: 7 }, as: ComplianceAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_id}", code: "CUR-B6A", title: "B6A Course", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE" }, as: ComplianceAdmin, captures: { cur_id: "$.data.id", cur_v: "$.data.version" } }
            - { call: "POST /compliance/curricula/${cur_id}/versions", payload: { version_no: 1, effective_from: "2026-08-01T00:00:00Z", content_uri: "uri://b6a-v1" }, as: ComplianceAdmin }
            - { call: "PATCH /compliance/curricula/${cur_id}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-B6A", name: "B6A Role" }, as: ComplianceAdmin, captures: { role_id: "$.data.id" } }
            - { call: "POST /compliance/roles/${role_id}/requirements", payload: { curriculum_id: "${cur_id}", recurrence: "INITIAL_ONLY", due_in_days: 30, criticality: "SOFT" }, as: ComplianceAdmin }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-B6A-1", full_name: "B6A Emp", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}" }, as: HRAdmin, captures: { emp: "$.data.id" } }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${emp}", curriculum_id: "${cur_id}" }, as: ComplianceAdmin, captures: { a: "$.data[0].id" } }
          trigger:
            - { call: "POST /compliance/assignments/${a}/completions", payload: { score_pct: 79.99, evidence_type: "NONE" }, as: Employee, as_user_id: "${emp}", captures: { err: "$.data.error_id" } }
            - { call: "POST /compliance/assignments/${a}/completions", payload: { score_pct: 80.00, evidence_type: "NONE" }, as: Employee, as_user_id: "${emp}", captures: { ok_id: "$.data.id", ok_passed: "$.data.passed", ok_late: "$.data.is_late" } }
          assert:
            - "err == \"ERR_SCORE_BELOW_PASSING\" (79.99 < 80.00 rejected, no record persisted)"
            - "ok_passed == true (80.00 >= 80.00: equality passes — inclusive lower boundary)"
            - "ok_late == false (2026-08-03 submission is far before due_at)"
            - "assignment progress_status == \"SUBMITTED\" after exactly one persisted record"

      - name: sweep_overdue_requires_strictly_after_due
        grounds:
          - calculations.escalation_and_deadline_status
          - entities.TrainingAssignment.fields.deadline_status
          - entities.EscalationNotice.fields.level
        distinguishing_aspect: |
          Timestamp metric via POST /compliance/_sweeps/run (distinct endpoint
          and metric from the score boundary): at now == due_at exactly the
          assignment is still DUE_SOON (OVERDUE requires strictly now > due_at);
          one second later it flips OVERDUE and the level-2 notice fires.
        test_recipe:
          setup:
            - "Regulator REG-B6B (CALENDAR, interval 10, reminder 7); curriculum CUR-B6B ACTIVE (NONE, 80)"
            - "Role R-B6B with SOFT INITIAL_ONLY requirement due_in_days 2; clock 2026-08-03T09:00:00Z at hire"
            - "Employee E-B6B has assignment A with base_due_at 2026-08-05T09:00:00Z, born DUE_SOON"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/regulators", payload: { code: "REG-B6B", name: "B6B Regulator", deadline_mode: "CALENDAR", recordkeeping_years: 7, escalation_interval_days: 10, reminder_days_before_due: 7 }, as: ComplianceAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_id}", code: "CUR-B6B", title: "B6B Course", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE" }, as: ComplianceAdmin, captures: { cur_id: "$.data.id", cur_v: "$.data.version" } }
            - { call: "POST /compliance/curricula/${cur_id}/versions", payload: { version_no: 1, effective_from: "2026-08-01T00:00:00Z", content_uri: "uri://b6b-v1" }, as: ComplianceAdmin }
            - { call: "PATCH /compliance/curricula/${cur_id}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-B6B", name: "B6B Role" }, as: ComplianceAdmin, captures: { role_id: "$.data.id" } }
            - { call: "POST /compliance/roles/${role_id}/requirements", payload: { curriculum_id: "${cur_id}", recurrence: "INITIAL_ONLY", due_in_days: 2, criticality: "SOFT" }, as: ComplianceAdmin }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-B6B-1", full_name: "B6B Emp", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}" }, as: HRAdmin, captures: { emp: "$.data.id" } }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${emp}", curriculum_id: "${cur_id}" }, as: ComplianceAdmin, captures: { a: "$.data[0].id", a_due: "$.data[0].base_due_at" } }
          trigger:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/_sweeps/run", payload: {}, as: ComplianceAdmin, captures: { n1: "$.data.notices_created", t1: "$.data.assignments_transitioned" } }
            - { call: "GET /compliance/assignments/${a}", as: ComplianceAdmin, captures: { d1: "$.data.deadline_status" } }
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:01Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/_sweeps/run", payload: {}, as: ComplianceAdmin, captures: { n2: "$.data.notices_created", t2: "$.data.assignments_transitioned" } }
            - { call: "GET /compliance/assignments/${a}", as: ComplianceAdmin, captures: { d2: "$.data.deadline_status" } }
            - { call: "GET /compliance/assignments/${a}/escalations", as: ComplianceAdmin, captures: { lv1: "$.data[0].level", k1: "$.data[0].kind", lv2: "$.data[1].level", k2: "$.data[1].kind" } }
          assert:
            - "a_due == \"2026-08-05T09:00:00Z\""
            - "d1 == \"DUE_SOON\" (now == due_at exactly is NOT overdue — strict greater-than)"
            - "n1 == 1 and t1 == 0 (level-1 DUE_SOON reminder fires; no status change at the boundary)"
            - "d2 == \"OVERDUE\" (one second past due flips it)"
            - "n2 == 1 and t2 == 1 (level-2 OVERDUE_MANAGER notice on crossing)"
            - "lv1 == 1 and k1 == \"DUE_SOON_REMINDER\" and lv2 == 2 and k2 == \"OVERDUE_MANAGER\""

  # =====================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: completion_blocked_by_assignment_terminal_state
        grounds:
          - state_machines.TrainingAssignment
          - state_machines.CompletionRecord
          - errors[ERR_ASSIGNMENT_NOT_SUBMITTABLE]
        distinguishing_aspect: |
          Entity pair CompletionRecord -> TrainingAssignment: a completion may
          only be created while the parent assignment's progress_status is in
          {ASSIGNED, IN_PROGRESS}; on a VERIFIED_COMPLETED assignment the
          submission is rejected.
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00Z; regulator REG-X7A; curriculum CUR-X7A ACTIVE (NONE, 80)"
            - "Role R-X7A with SOFT INITIAL_ONLY requirement (due_in_days 30); employee E-X7A's assignment A is VERIFIED_COMPLETED (score 90 accepted)"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/regulators", payload: { code: "REG-X7A", name: "X7A Regulator", deadline_mode: "CALENDAR", recordkeeping_years: 7 }, as: ComplianceAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_id}", code: "CUR-X7A", title: "X7A Course", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE" }, as: ComplianceAdmin, captures: { cur_id: "$.data.id", cur_v: "$.data.version" } }
            - { call: "POST /compliance/curricula/${cur_id}/versions", payload: { version_no: 1, effective_from: "2026-08-01T00:00:00Z", content_uri: "uri://x7a-v1" }, as: ComplianceAdmin }
            - { call: "PATCH /compliance/curricula/${cur_id}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-X7A", name: "X7A Role" }, as: ComplianceAdmin, captures: { role_id: "$.data.id" } }
            - { call: "POST /compliance/roles/${role_id}/requirements", payload: { curriculum_id: "${cur_id}", recurrence: "INITIAL_ONLY", due_in_days: 30, criticality: "SOFT" }, as: ComplianceAdmin }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-X7A-1", full_name: "X7A Emp", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}" }, as: HRAdmin, captures: { emp: "$.data.id" } }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${emp}", curriculum_id: "${cur_id}" }, as: ComplianceAdmin, captures: { a: "$.data[0].id" } }
            - { call: "POST /compliance/assignments/${a}/completions", payload: { score_pct: 90, evidence_type: "NONE" }, as: Employee, as_user_id: "${emp}", captures: { c1: "$.data.id" } }
            - { call: "POST /compliance/completions/${c1}/accept", payload: {}, as: ComplianceAdmin }
          trigger:
            - { call: "POST /compliance/assignments/${a}/completions", payload: { score_pct: 95, evidence_type: "NONE" }, as: Employee, as_user_id: "${emp}", captures: { err: "$.data.error_id" } }
            - { call: "GET /compliance/assignments/${a}/completions", as: ComplianceAdmin }
          assert:
            - "err == \"ERR_ASSIGNMENT_NOT_SUBMITTABLE\" (terminal VERIFIED_COMPLETED parent gates child creation)"
            - "GET /compliance/assignments/${a}/completions -> meta.total_count == 1"

      - name: requirement_create_gated_by_curriculum_status
        grounds:
          - state_machines.Curriculum
          - state_machines.RoleRequirement
          - errors[ERR_CURRICULUM_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair RoleRequirement -> Curriculum (different pair than the
          sibling instance): creating a requirement referencing a DRAFT
          curriculum is rejected; only ACTIVE curricula may be mapped to roles.
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00Z; regulator REG-X7B; curriculum CUR-X7B in DRAFT (has a version but never activated); role R-X7B empty"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/regulators", payload: { code: "REG-X7B", name: "X7B Regulator", deadline_mode: "CALENDAR", recordkeeping_years: 7 }, as: ComplianceAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_id}", code: "CUR-X7B", title: "X7B Course", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE" }, as: ComplianceAdmin, captures: { cur_id: "$.data.id" } }
            - { call: "POST /compliance/curricula/${cur_id}/versions", payload: { version_no: 1, effective_from: "2026-08-01T00:00:00Z", content_uri: "uri://x7b-v1" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-X7B", name: "X7B Role" }, as: ComplianceAdmin, captures: { role_id: "$.data.id" } }
          trigger:
            - { call: "POST /compliance/roles/${role_id}/requirements", payload: { curriculum_id: "${cur_id}", recurrence: "INITIAL_ONLY", due_in_days: 30, criticality: "SOFT" }, as: ComplianceAdmin, captures: { err: "$.data.error_id" } }
            - { call: "GET /compliance/roles/${role_id}/requirements", as: ComplianceAdmin }
          assert:
            - "err == \"ERR_CURRICULUM_NOT_ACTIVE\" (DRAFT curriculum cannot be mapped)"
            - "GET /compliance/roles/${role_id}/requirements -> meta.total_count == 0"

  # =====================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: curriculum_version_half_open_adjacency
        grounds:
          - entities.CurriculumVersion.fields.effective_from
          - entities.CurriculumVersion.fields.effective_to
          - errors[ERR_VERSION_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Half-open [effective_from, effective_to) semantics on
          CurriculumVersion: a new version starting exactly at the previous
          version's effective_to is ACCEPTED (gapless adjacency), while one
          starting before it is rejected.
        test_recipe:
          setup:
            - "Regulator REG-V8A; curriculum CUR-V8A (DRAFT) with V1 covering [2026-01-01T00:00:00Z, 2026-06-01T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /compliance/regulators", payload: { code: "REG-V8A", name: "V8A Regulator", deadline_mode: "CALENDAR", recordkeeping_years: 7 }, as: ComplianceAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_id}", code: "CUR-V8A", title: "V8A Course", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE" }, as: ComplianceAdmin, captures: { cur_id: "$.data.id" } }
            - { call: "POST /compliance/curricula/${cur_id}/versions", payload: { version_no: 1, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-06-01T00:00:00Z", content_uri: "uri://v8a-1" }, as: ComplianceAdmin, captures: { v1: "$.data.id" } }
          trigger:
            - { call: "POST /compliance/curricula/${cur_id}/versions", payload: { version_no: 2, effective_from: "2026-06-01T00:00:00Z", content_uri: "uri://v8a-2" }, as: ComplianceAdmin, captures: { v2: "$.data.id", v2_to: "$.data.effective_to" } }
            - { call: "POST /compliance/curricula/${cur_id}/versions", payload: { version_no: 3, effective_from: "2026-05-15T00:00:00Z", content_uri: "uri://v8a-3" }, as: ComplianceAdmin, captures: { err: "$.data.error_id" } }
            - { call: "GET /compliance/curricula/${cur_id}/versions", as: ComplianceAdmin }
          assert:
            - "V2 created (201): effective_from == V1.effective_to exactly is legal under half-open windows; v2_to == null (open-ended)"
            - "err == \"ERR_VERSION_WINDOW_OVERLAP\" (V3 [2026-05-15, +inf) intersects both V1 and V2)"
            - "GET versions -> meta.total_count == 2"

      - name: leave_closed_interval_buffer_gap
        grounds:
          - entities.LeaveOfAbsence.fields.start_date
          - entities.LeaveOfAbsence.fields.end_date
          - errors[ERR_LEAVE_OVERLAP]
        distinguishing_aspect: |
          Different resource AND different interval semantics than the sibling:
          LeaveOfAbsence uses CLOSED day intervals with a mandatory 1-day buffer
          — a leave starting the very next day (gap < 24h) is rejected, while a
          leave leaving one full calendar day of gap is accepted (under
          half-open semantics the rejected one would have been adjacent-legal).
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00Z; role R-L8B (no requirements); employee E-L8B"
            - "Leave L1 = [2026-08-03T00:00:00Z, 2026-08-07T23:59:59Z] exists and covers the clock (E-L8B is ON_LEAVE)"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-L8B", name: "L8B Role" }, as: ComplianceAdmin, captures: { role_id: "$.data.id" } }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-L8B-1", full_name: "L8B Emp", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}" }, as: HRAdmin, captures: { emp: "$.data.id" } }
            - { call: "POST /compliance/employees/${emp}/leaves", payload: { start_date: "2026-08-03T00:00:00Z", end_date: "2026-08-07T23:59:59Z", reason: "Medical" }, as: HRAdmin, captures: { l1: "$.data.id" } }
            - { call: "GET /compliance/employees/${emp}", as: ComplianceAdmin, captures: { emp_st: "$.data.status" } }
          trigger:
            - { call: "POST /compliance/employees/${emp}/leaves", payload: { start_date: "2026-08-08T00:00:00Z", end_date: "2026-08-10T23:59:59Z", reason: "Extension" }, as: HRAdmin, captures: { err: "$.data.error_id" } }
            - { call: "POST /compliance/employees/${emp}/leaves", payload: { start_date: "2026-08-09T00:00:00Z", end_date: "2026-08-12T23:59:59Z", reason: "Extension 2" }, as: HRAdmin, captures: { l2: "$.data.id" } }
            - { call: "GET /compliance/employees/${emp}/leaves", as: ComplianceAdmin }
          assert:
            - "emp_st == \"ON_LEAVE\" (L1 covers the clock; creation flips status immediately)"
            - "err == \"ERR_LEAVE_OVERLAP\" (start 2026-08-08T00:00:00Z <= end 2026-08-07T23:59:59Z + 1 day: buffer violated)"
            - "L2 created (201): start 2026-08-09 leaves more than one full day after L1's end"
            - "GET leaves -> meta.total_count == 2"

  # =====================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: extension_grant_revoke_conserves_due_at
        grounds:
          - entities.TrainingAssignment.fields.due_at
          - entities.TrainingAssignment.fields.base_due_at
          - entities.TrainingAssignment.fields.active_extension_days
          - concurrency_rules[extension-grant-stale-assignment]
          - concurrency_rules[extension-revoke-stale-assignment]
        distinguishing_aspect: |
          Conserved quantity = the due TIMESTAMP: grant(+7d) followed by revoke
          restores due_at to base_due_at exactly, honoring the pinned invariant
          due_at == base_due_at + active_extension_days days with zero drift.
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00Z; regulator REG-X9A (CALENDAR, reminder 3 so A is born ON_TRACK)"
            - "Curriculum CUR-X9A ACTIVE (NONE, 80); roles R-X9M (empty, manager M) and R-X9A with SOFT INITIAL_ONLY requirement due_in_days 5"
            - "Employee E-X9A (manager M) holds assignment A with base_due_at 2026-08-08T09:00:00Z"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/regulators", payload: { code: "REG-X9A", name: "X9A Regulator", deadline_mode: "CALENDAR", recordkeeping_years: 7, reminder_days_before_due: 3 }, as: ComplianceAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_id}", code: "CUR-X9A", title: "X9A Course", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE" }, as: ComplianceAdmin, captures: { cur_id: "$.data.id", cur_v: "$.data.version" } }
            - { call: "POST /compliance/curricula/${cur_id}/versions", payload: { version_no: 1, effective_from: "2026-08-01T00:00:00Z", content_uri: "uri://x9a-v1" }, as: ComplianceAdmin }
            - { call: "PATCH /compliance/curricula/${cur_id}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-X9M", name: "X9 Mgr Role" }, as: ComplianceAdmin, captures: { role_mgr: "$.data.id" } }
            - { call: "POST /compliance/roles", payload: { code: "R-X9A", name: "X9A Role" }, as: ComplianceAdmin, captures: { role_id: "$.data.id" } }
            - { call: "POST /compliance/roles/${role_id}/requirements", payload: { curriculum_id: "${cur_id}", recurrence: "INITIAL_ONLY", due_in_days: 5, criticality: "SOFT" }, as: ComplianceAdmin }
            - { call: "POST /compliance/employees", payload: { employee_no: "M-X9A-1", full_name: "X9 Mgr", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_mgr}" }, as: HRAdmin, captures: { mgr: "$.data.id" } }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-X9A-1", full_name: "X9A Emp", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}", manager_id: "${mgr}" }, as: HRAdmin, captures: { emp: "$.data.id" } }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${emp}", curriculum_id: "${cur_id}" }, as: ComplianceAdmin, captures: { a: "$.data[0].id", av: "$.data[0].version", ad0: "$.data[0].base_due_at" } }
          trigger:
            - { call: "POST /compliance/assignments/${a}/extensions", payload: { extend_by_days: 7, reason: "Business travel", expected_assignment_version: "${av}" }, as: Manager, as_user_id: "${mgr}", captures: { d1: "$.data.due_at", ae1: "$.data.active_extension_days", av2: "$.data.version", bd1: "$.data.base_due_at" } }
            - { call: "POST /compliance/assignments/${a}/extensions/revoke", payload: { expected_assignment_version: "${av2}" }, as: Manager, as_user_id: "${mgr}", captures: { d2: "$.data.due_at", ae2: "$.data.active_extension_days", bd2: "$.data.base_due_at" } }
          assert:
            - "ad0 == \"2026-08-08T09:00:00Z\""
            - "d1 == \"2026-08-15T09:00:00Z\" and ae1 == 7 and bd1 == \"2026-08-08T09:00:00Z\" (grant: due_at = base + 7d)"
            - "d2 == \"2026-08-08T09:00:00Z\" and ae2 == 0 and bd2 == \"2026-08-08T09:00:00Z\" (revoke restores base exactly — zero drift in the due timestamp)"

      - name: accept_void_conserves_verified_completion_counts
        grounds:
          - state_machines.CompletionRecord.ACCEPTED_to_VOIDED
          - state_machines.TrainingAssignment.VERIFIED_COMPLETED_to_IN_PROGRESS
          - entities.Employee.fields.verified_completed_count
          - calculations.assignment_validity_expiry
        distinguishing_aspect: |
          Conserved quantity = the verified-completion COUNT / posture fields (a
          different quantity type than the due timestamp of the sibling):
          accept(+1) followed by void(-1) returns verified_completed_count to 0,
          progress to IN_PROGRESS, and completed_at/expires_at to null.
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00Z; regulator REG-X9B; curriculum CUR-X9B ACTIVE (NONE, 80, validity_months 6)"
            - "Role R-X9B with SOFT VALIDITY_CYCLE requirement due_in_days 30; employee E-X9B holds assignment A ASSIGNED; verified_completed_count == 0"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/regulators", payload: { code: "REG-X9B", name: "X9B Regulator", deadline_mode: "CALENDAR", recordkeeping_years: 7 }, as: ComplianceAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_id}", code: "CUR-X9B", title: "X9B Course", passing_score_pct: 80, validity_months: 6, evidence_requirement: "NONE" }, as: ComplianceAdmin, captures: { cur_id: "$.data.id", cur_v: "$.data.version" } }
            - { call: "POST /compliance/curricula/${cur_id}/versions", payload: { version_no: 1, effective_from: "2026-08-01T00:00:00Z", content_uri: "uri://x9b-v1" }, as: ComplianceAdmin }
            - { call: "PATCH /compliance/curricula/${cur_id}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-X9B", name: "X9B Role" }, as: ComplianceAdmin, captures: { role_id: "$.data.id" } }
            - { call: "POST /compliance/roles/${role_id}/requirements", payload: { curriculum_id: "${cur_id}", recurrence: "VALIDITY_CYCLE", due_in_days: 30, criticality: "SOFT" }, as: ComplianceAdmin }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-X9B-1", full_name: "X9B Emp", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}" }, as: HRAdmin, captures: { emp: "$.data.id" } }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${emp}", curriculum_id: "${cur_id}" }, as: ComplianceAdmin, captures: { a: "$.data[0].id" } }
          trigger:
            - { call: "POST /compliance/assignments/${a}/completions", payload: { score_pct: 90, evidence_type: "NONE" }, as: Employee, as_user_id: "${emp}", captures: { c1: "$.data.id" } }
            - { call: "POST /compliance/completions/${c1}/accept", payload: {}, as: ComplianceAdmin }
            - { call: "GET /compliance/employees/${emp}", as: ComplianceAdmin, captures: { vc1: "$.data.verified_completed_count" } }
            - { call: "GET /compliance/assignments/${a}", as: ComplianceAdmin, captures: { p1: "$.data.progress_status", ct1: "$.data.completed_at", ex1: "$.data.expires_at" } }
            - { call: "POST /compliance/completions/${c1}/void", payload: { reason: "Evidence audit failure" }, as: ComplianceAdmin, captures: { c1_st: "$.data.review_status" } }
            - { call: "GET /compliance/employees/${emp}", as: ComplianceAdmin, captures: { vc2: "$.data.verified_completed_count" } }
            - { call: "GET /compliance/assignments/${a}", as: ComplianceAdmin, captures: { p2: "$.data.progress_status", ct2: "$.data.completed_at", ex2: "$.data.expires_at" } }
          assert:
            - "vc1 == 1 and p1 == \"VERIFIED_COMPLETED\" and ct1 == \"2026-08-03T09:00:00Z\" and ex1 == \"2027-02-03T09:00:00Z\" (+6 calendar months)"
            - "c1_st == \"VOIDED\""
            - "vc2 == 0 and p2 == \"IN_PROGRESS\" and ct2 == null and ex2 == null (compensation restores the pre-accept values exactly)"
