        grounds:
          - state_machines.Project.PLANNING_to_STOCKING_OPEN
          - errors[ERR_FRAMING_NOT_READY]
        distinguishing_aspect: |
          Numeric threshold boundary on framing_pct_complete via POST
          /supply/projects/{id}/open-stocking: 50 passes (inclusive), 49 fails
          with ERR_FRAMING_NOT_READY.
        test_recipe:
          setup:
            - "Account ACTIVE with two projects, P49 framing=49, P50 framing=50"
            - "Both projects have a locked takeoff (so the open-stocking precondition is isolated to framing_pct_complete)"
          setup_api_calls:
            - call: "POST /supply/contractor-accounts"
