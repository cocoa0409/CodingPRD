              payload: {}
              as: ComplianceOfficer
          assert:
            - "Before the trigger: Appraisal.${m12_ap_id}.status == QUALIFIED, expires_on == '2027-07-15', opinion_midpoint_psf == 40.00, is_controlling == true; Lease.${m12_l_id}.fmv_certification_status == CERTIFIED with certified_fmv_floor_psf == 36.00, certified_fmv_ceiling_psf == 41.98, certified_base_rent_annual == 304000.00, provisional_base_rent_annual == 292000.00, fmv_variance_annual == 12000.00, fmv_variance_pct == 0.0411"
            - "After the close: Appraisal.${m12_ap_id}.status == EXPIRED and is_controlling == false"
