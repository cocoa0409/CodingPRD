# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x 2 instances = 18 instances. All grounds resolve into SCAFFOLD.yaml.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: rebate_estimated_vs_audited_amount
        grounds:
          - calculations.rebate_amounts
          - calculations.rebate_measured_uptime
          - state_machines.RebateClaim.SUBMITTED_to_AUDITED
          - entities.RebateClaim.fields.estimated_amount_cents
          - entities.RebateClaim.fields.audited_amount_cents
        distinguishing_aspect: "On RebateClaim: estimated_amount_cents (reported-uptime path) is 20000 while audited_amount_cents (measured-uptime path) collapses to 0 for the same claim — divergence lives on the claim/grant domain."
        test_recipe:
          setup:
            - "Grant NEVI (min_uptime_pct 97.0, min_ports 1, min_power_kw 150, rate 20 c/kWh, cap 5000000); site; ACTIVE agreement; station enrolled in grant with one 180kW ADA port; station COMMISSIONED."
            - "One CRITICAL WorkOrder opened 2026-05-10 and resolved 2026-05-12 (2880 min downtime) inside claim period 2026-05-01..2026-06-01 (44640 min) → measured uptime 93.55%."
            - "Claim created (reported_energy 1000 kWh, reported_uptime 97.0) and SUBMITTED (estimated 20000)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /grant-programs", payload: { name: "NEVI", program_code: "NEVI", min_uptime_pct: 97.0, min_ports: 1, min_power_kw: 150, reimbursement_rate_cents_per_kwh: 20, reimbursement_cap_cents: 5000000 }, as: ProgramAdmin, captures: { grant_id: "$.data.id" } }
            - { call: "POST /host-sites", payload: { name: "Curb A", address: "1 Main", state_code: "CA", ada_required: false, revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /host-agreements", payload: { site_id: "${site_id}", term_start_date: "2026-05-01T00:00:00Z", term_end_date: "2027-05-01T00:00:00Z", proposed_revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { agr_id: "$.data.id" } }
            - { call: "POST /host-agreements/${agr_id}/propose", payload: {}, as: ProgramAdmin }
            - { call: "POST /host-agreements/${agr_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /stations", payload: { site_id: "${site_id}", grant_id: "${grant_id}", name: "S1", ada_accessible: true }, as: ProgramAdmin, captures: { stn_id: "$.data.id" } }
            - { call: "POST /ports", payload: { station_id: "${stn_id}", connector_type: "CCS2", power_kw: 180, ada_accessible: true }, as: ProgramAdmin, captures: { port_id: "$.data.id" } }
            - { call: "POST /stations/${stn_id}/commission", payload: {}, as: ProgramAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /work-orders", payload: { port_id: "${port_id}", severity: "CRITICAL", description: "connector fault" }, as: FieldTechnician, captures: { wo_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-12T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /work-orders/${wo_id}/resolve", payload: {}, as: FieldTechnician }
            - { call: "GET /stations/${stn_id}", payload: {}, as: ProgramAdmin, captures: { stn_v: "$.data.version" } }
            - { call: "POST /rebate-claims", payload: { station_id: "${stn_id}", grant_id: "${grant_id}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", reported_energy_kwh: 1000, reported_uptime_pct: 97.0, expected_station_version: "${stn_v}" }, as: ProgramAdmin, captures: { claim_id: "$.data.id" } }
            - { call: "POST /rebate-claims/${claim_id}/submit", payload: {}, as: ProgramAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "POST /rebate-claims/${claim_id}/audit", payload: {}, as: ProgramAdmin, as_user_id: "admin-2" }
          assert:
            - "RebateClaim.${claim_id}.estimated_amount_cents == 20000"
            - "RebateClaim.${claim_id}.audited_amount_cents == 0"
            - "RebateClaim.${claim_id}.measured_uptime_pct == 93.55"
            - "RebateClaim.${claim_id}.compliance_status == NON_COMPLIANT"

      - name: revenue_host_share_gross_vs_net
        grounds:
          - calculations.revenue_share_split
          - entities.RevenueStatement.fields.host_share_cents
          - entities.RevenueStatement.fields.basis
          - concurrency_rules[statement-create-stale-site]
        distinguishing_aspect: "On RevenueStatement: identical two-session ledger yields host_share_cents 300 under basis GROSS but 284 under basis NET — divergence lives on the site/statement domain, distinct from the RebateClaim divergence."
        test_recipe:
          setup:
            - "Site (revenue_share_pct 0.15, transaction_fee_pct 0.029, flat 30); station; one 100kW port."
            - "Two FINALIZED OFFPEAK sessions (energy 37.625 kWh each, idle 0) → final_cost 1003 each; gross 2006, per-session fee 59."
          setup_api_calls:
            - { call: "POST /host-sites", payload: { name: "Curb B", address: "2 Main", state_code: "CA", revenue_share_pct: 0.15, transaction_fee_pct: 0.029, transaction_fee_flat_cents: 30 }, as: ProgramAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /stations", payload: { site_id: "${site_id}", name: "S1" }, as: ProgramAdmin, captures: { stn_id: "$.data.id" } }
            - { call: "POST /ports", payload: { station_id: "${stn_id}", connector_type: "CCS2", power_kw: 100 }, as: ProgramAdmin, captures: { port_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T02:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /charging-sessions", payload: { port_id: "${port_id}", driver_id: "drv-1" }, as: Driver, as_user_id: "drv-1", captures: { s1_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T02:30:00Z" }, as: ProgramAdmin }
            - { call: "POST /charging-sessions/${s1_id}/stop", payload: { energy_kwh: 37.625 }, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T02:35:00Z" }, as: ProgramAdmin }
            - { call: "POST /charging-sessions/${s1_id}/finalize", payload: {}, as: ProgramAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T02:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /charging-sessions", payload: { port_id: "${port_id}", driver_id: "drv-1" }, as: Driver, as_user_id: "drv-1", captures: { s2_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T02:30:00Z" }, as: ProgramAdmin }
            - { call: "POST /charging-sessions/${s2_id}/stop", payload: { energy_kwh: 37.625 }, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T02:35:00Z" }, as: ProgramAdmin }
            - { call: "POST /charging-sessions/${s2_id}/finalize", payload: {}, as: ProgramAdmin }
            - { call: "GET /host-sites/${site_id}", payload: {}, as: ProgramAdmin, captures: { site_v1: "$.data.version" } }
          trigger:
            - { call: "POST /revenue-statements", payload: { site_id: "${site_id}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", basis: "GROSS", expected_site_version: "${site_v1}" }, as: ProgramAdmin, captures: { gross_hs: "$.data.host_share_cents", gross_gross: "$.data.gross_revenue_cents" } }
            - { call: "GET /host-sites/${site_id}", payload: {}, as: ProgramAdmin, captures: { site_v2: "$.data.version" } }
            - { call: "POST /revenue-statements", payload: { site_id: "${site_id}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", basis: "NET", expected_site_version: "${site_v2}" }, as: ProgramAdmin, captures: { net_hs: "$.data.host_share_cents" } }
          assert:
            - "RevenueStatement gross_revenue_cents == 2006"
            - "RevenueStatement (basis GROSS) host_share_cents == 300"
            - "RevenueStatement (basis NET) host_share_cents == 284"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: session_energy_cost_tiered_demand_cap
        grounds:
          - calculations.session_energy_cost
          - entities.ChargingSession.fields.energy_cost_cents
          - entities.ChargingSession.fields.tou_period
          - state_machines.ChargingSession.ACTIVE_to_STOPPED
        distinguishing_aspect: "Mode (a): energy_cost_cents = min(round_half_up(energy_kwh*(tou_rate+demand_surcharge)), cap) has 3 interacting inputs (energy 12.5, PEAK rate 48, 180kW demand +5) → 663; tier selection + surcharge + cap are non-linear."
        test_recipe:
          setup:
            - "Site; station; one 180kW port. Session started at PEAK hour 17:00 UTC, stopped with 12.5 kWh."
          setup_api_calls:
            - { call: "POST /host-sites", payload: { name: "Curb C", address: "3 Main", state_code: "CA", revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /stations", payload: { site_id: "${site_id}", name: "S1" }, as: ProgramAdmin, captures: { stn_id: "$.data.id" } }
            - { call: "POST /ports", payload: { station_id: "${stn_id}", connector_type: "CCS2", power_kw: 180 }, as: ProgramAdmin, captures: { port_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T17:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /charging-sessions", payload: { port_id: "${port_id}", driver_id: "drv-1" }, as: Driver, as_user_id: "drv-1", captures: { s_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T17:30:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /charging-sessions/${s_id}/stop", payload: { energy_kwh: 12.5 }, as: Driver, as_user_id: "drv-1" }
          assert:
            - "ChargingSession.${s_id}.tou_period == PEAK"
            - "ChargingSession.${s_id}.energy_cost_cents == 663"
            - "ChargingSession.${s_id}.preliminary_cost_cents == 763"

      - name: revenue_host_share_round_per_session_then_sum
        grounds:
          - calculations.revenue_share_split
          - entities.RevenueStatement.fields.host_share_cents
        distinguishing_aspect: "Mode (b): host_share pins round-per-session-then-sum. Two sessions of 1003c give round(150.45)+round(150.45)=150+150=300, NOT round(2006*0.15)=round(300.9)=301."
        test_recipe:
          setup:
            - "Same two-session 1003c ledger as revenue_host_share_gross_vs_net; GROSS statement generated."
          setup_api_calls:
            - { call: "POST /host-sites", payload: { name: "Curb D", address: "4 Main", state_code: "CA", revenue_share_pct: 0.15, transaction_fee_pct: 0.029, transaction_fee_flat_cents: 30 }, as: ProgramAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /stations", payload: { site_id: "${site_id}", name: "S1" }, as: ProgramAdmin, captures: { stn_id: "$.data.id" } }
            - { call: "POST /ports", payload: { station_id: "${stn_id}", connector_type: "CCS2", power_kw: 100 }, as: ProgramAdmin, captures: { port_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T02:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /charging-sessions", payload: { port_id: "${port_id}", driver_id: "drv-1" }, as: Driver, as_user_id: "drv-1", captures: { s1_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T02:30:00Z" }, as: ProgramAdmin }
            - { call: "POST /charging-sessions/${s1_id}/stop", payload: { energy_kwh: 37.625 }, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T02:35:00Z" }, as: ProgramAdmin }
            - { call: "POST /charging-sessions/${s1_id}/finalize", payload: {}, as: ProgramAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T02:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /charging-sessions", payload: { port_id: "${port_id}", driver_id: "drv-1" }, as: Driver, as_user_id: "drv-1", captures: { s2_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T02:30:00Z" }, as: ProgramAdmin }
            - { call: "POST /charging-sessions/${s2_id}/stop", payload: { energy_kwh: 37.625 }, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T02:35:00Z" }, as: ProgramAdmin }
            - { call: "POST /charging-sessions/${s2_id}/finalize", payload: {}, as: ProgramAdmin }
            - { call: "GET /host-sites/${site_id}", payload: {}, as: ProgramAdmin, captures: { site_v: "$.data.version" } }
          trigger:
            - { call: "POST /revenue-statements", payload: { site_id: "${site_id}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", basis: "GROSS", expected_site_version: "${site_v}" }, as: ProgramAdmin, captures: { hs: "$.data.host_share_cents" } }
          assert:
            - "RevenueStatement host_share_cents == 300"
            - "RevenueStatement session_count == 2"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: port_parallel_axes_occupancy_moves_operational_fixed
        grounds:
          - state_machines.Port.AVAILABLE_to_RESERVED
          - entities.Port.fields.operational_status
          - entities.Port.fields.occupancy_status
        distinguishing_aspect: "Port carries two independent axes: confirming a reservation moves occupancy_status AVAILABLE→RESERVED while operational_status stays IN_SERVICE — parallel dimensions on the Port entity."
        test_recipe:
          setup:
            - "Site; station; one port (IN_SERVICE, AVAILABLE). One PENDING reservation on it."
          setup_api_calls:
            - { call: "POST /host-sites", payload: { name: "Curb E", address: "5 Main", state_code: "CA", revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /stations", payload: { site_id: "${site_id}", name: "S1" }, as: ProgramAdmin, captures: { stn_id: "$.data.id" } }
            - { call: "POST /ports", payload: { station_id: "${stn_id}", connector_type: "CCS2", power_kw: 100 }, as: ProgramAdmin, captures: { port_id: "$.data.id" } }
            - { call: "POST /reservations", payload: { port_id: "${port_id}", driver_id: "drv-1", window_start: "2026-05-04T10:00:00Z", window_end: "2026-05-04T11:00:00Z" }, as: Driver, as_user_id: "drv-1", captures: { r_id: "$.data.id" } }
          trigger:
            - { call: "POST /reservations/${r_id}/confirm", payload: {}, as: Driver, as_user_id: "drv-1" }
          assert:
            - "Port.${port_id}.occupancy_status == RESERVED"
            - "Port.${port_id}.operational_status == IN_SERVICE"

      - name: host_agreement_cyclic_propose_counter_loop
        grounds:
          - state_machines.HostAgreement.PROPOSED_to_COUNTERED
          - state_machines.HostAgreement.COUNTERED_to_PROPOSED
          - entities.HostAgreement.fields.round_count
        distinguishing_aspect: "HostAgreement loops PROPOSED→COUNTERED→PROPOSED→COUNTERED; after two host counters status==COUNTERED and round_count==2 — a cycle on a different entity than Port."
        test_recipe:
          setup:
            - "Site; DRAFT agreement for that site."
          setup_api_calls:
            - { call: "POST /host-sites", payload: { name: "Curb F", address: "6 Main", state_code: "CA", revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /host-agreements", payload: { site_id: "${site_id}", term_start_date: "2026-05-01T00:00:00Z", term_end_date: "2027-05-01T00:00:00Z", proposed_revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { agr_id: "$.data.id" } }
            - { call: "POST /host-agreements/${agr_id}/propose", payload: {}, as: ProgramAdmin }
            - { call: "POST /host-agreements/${agr_id}/counter", payload: { counter_revenue_share_pct: 0.12 }, as: HostOperator, as_user_id: "${site_id}" }
            - { call: "POST /host-agreements/${agr_id}/propose", payload: { proposed_revenue_share_pct: 0.13 }, as: ProgramAdmin }
          trigger:
            - { call: "POST /host-agreements/${agr_id}/counter", payload: { counter_revenue_share_pct: 0.125 }, as: HostOperator, as_user_id: "${site_id}" }
          assert:
            - "HostAgreement.${agr_id}.status == COUNTERED"
            - "HostAgreement.${agr_id}.round_count == 2"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: critical_work_order_cascade_port_session_occupancy
        grounds:
          - state_machines.WorkOrder.(creation)_to_OPEN
          - state_machines.Port.IN_SERVICE_to_OUT_OF_SERVICE
          - state_machines.ChargingSession.ACTIVE_to_ABORTED
        distinguishing_aspect: "One CRITICAL WorkOrder open transitively drives Port→OUT_OF_SERVICE, then that port's ACTIVE session→ABORTED (final_cost 0), then the aborted session frees occupancy→AVAILABLE — 3 chained hops from a work-order trigger."
        test_recipe:
          setup:
            - "Site; station; one port with an ACTIVE session (occupancy OCCUPIED)."
          setup_api_calls:
            - { call: "POST /host-sites", payload: { name: "Curb G", address: "7 Main", state_code: "CA", revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /stations", payload: { site_id: "${site_id}", name: "S1" }, as: ProgramAdmin, captures: { stn_id: "$.data.id" } }
            - { call: "POST /ports", payload: { station_id: "${stn_id}", connector_type: "CCS2", power_kw: 180 }, as: ProgramAdmin, captures: { port_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /charging-sessions", payload: { port_id: "${port_id}", driver_id: "drv-1" }, as: Driver, as_user_id: "drv-1", captures: { s_id: "$.data.id" } }
          trigger:
            - { call: "POST /work-orders", payload: { port_id: "${port_id}", severity: "CRITICAL", description: "arc fault" }, as: FieldTechnician, captures: { wo_id: "$.data.id" } }
          assert:
            - "Port.${port_id}.operational_status == OUT_OF_SERVICE"
            - "ChargingSession.${s_id}.status == ABORTED"
            - "ChargingSession.${s_id}.final_cost_cents == 0"
            - "Port.${port_id}.occupancy_status == AVAILABLE"

      - name: agreement_terminate_cascade_station_port_session
        grounds:
          - state_machines.HostAgreement.ACTIVE_to_TERMINATED
          - state_machines.Station.COMMISSIONED_to_DECOMMISSIONED
          - state_machines.ChargingSession.ACTIVE_to_ABORTED
        distinguishing_aspect: "Terminating an ACTIVE agreement transitively DECOMMISSIONs the site's station, OOS's its ports, and ABORTs each port's active session — 3 chained hops from an agreement trigger (distinct from the work-order cascade)."
        test_recipe:
          setup:
            - "Site; ACTIVE agreement; COMMISSIONED station (no grant); one port with an ACTIVE session."
          setup_api_calls:
            - { call: "POST /host-sites", payload: { name: "Curb H", address: "8 Main", state_code: "CA", revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /host-agreements", payload: { site_id: "${site_id}", term_start_date: "2026-05-01T00:00:00Z", term_end_date: "2027-05-01T00:00:00Z", proposed_revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { agr_id: "$.data.id" } }
            - { call: "POST /host-agreements/${agr_id}/propose", payload: {}, as: ProgramAdmin }
            - { call: "POST /host-agreements/${agr_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /stations", payload: { site_id: "${site_id}", name: "S1" }, as: ProgramAdmin, captures: { stn_id: "$.data.id" } }
            - { call: "POST /ports", payload: { station_id: "${stn_id}", connector_type: "CCS2", power_kw: 180 }, as: ProgramAdmin, captures: { port_id: "$.data.id" } }
            - { call: "POST /stations/${stn_id}/commission", payload: {}, as: ProgramAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /charging-sessions", payload: { port_id: "${port_id}", driver_id: "drv-1" }, as: Driver, as_user_id: "drv-1", captures: { s_id: "$.data.id" } }
          trigger:
            - { call: "POST /host-agreements/${agr_id}/terminate", payload: {}, as: ProgramAdmin }
          assert:
            - "Station.${stn_id}.operational_status == DECOMMISSIONED"
            - "Port.${port_id}.operational_status == OUT_OF_SERVICE"
            - "ChargingSession.${s_id}.status == ABORTED"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: confirm_cancelled_reservation_that_also_overlaps_state_beats_temporal
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - state_machines.Reservation.PENDING_to_CONFIRMED
        distinguishing_aspect: "Confirming a CANCELLED reservation whose window also overlaps a CONFIRMED one: state (priority 6) beats business_temporal (priority 9) → ERR_INVALID_STATE, not ERR_RESERVATION_OVERLAP."
        test_recipe:
          setup:
            - "Site; station; one port. R1 [10:00,11:00) and R2 [10:30,11:30) both PENDING on the port. R2 CONFIRMED (port RESERVED). R1 CANCELLED."
          setup_api_calls:
            - { call: "POST /host-sites", payload: { name: "Curb I", address: "9 Main", state_code: "CA", revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /stations", payload: { site_id: "${site_id}", name: "S1" }, as: ProgramAdmin, captures: { stn_id: "$.data.id" } }
            - { call: "POST /ports", payload: { station_id: "${stn_id}", connector_type: "CCS2", power_kw: 100 }, as: ProgramAdmin, captures: { port_id: "$.data.id" } }
            - { call: "POST /reservations", payload: { port_id: "${port_id}", driver_id: "drv-1", window_start: "2026-05-04T10:00:00Z", window_end: "2026-05-04T11:00:00Z" }, as: Driver, as_user_id: "drv-1", captures: { r1_id: "$.data.id" } }
            - { call: "POST /reservations", payload: { port_id: "${port_id}", driver_id: "drv-1", window_start: "2026-05-04T10:30:00Z", window_end: "2026-05-04T11:30:00Z" }, as: Driver, as_user_id: "drv-1", captures: { r2_id: "$.data.id" } }
            - { call: "POST /reservations/${r2_id}/confirm", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /reservations/${r1_id}/cancel", payload: {}, as: Driver, as_user_id: "drv-1" }
          trigger:
            - { call: "POST /reservations/${r1_id}/confirm", payload: {}, as: Driver, as_user_id: "drv-1", captures: { err: "$.data.error_id" } }
          assert:
            - "response http_status == 409"
            - "response data.error_id == ERR_INVALID_STATE"

      - name: commission_inactive_agreement_and_below_min_ports_referential_beats_constraint
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - state_machines.Station.PENDING_to_COMMISSIONED
        distinguishing_aspect: "Commissioning with a non-ACTIVE agreement AND total_ports below grant.min_ports: business_referential (priority 7) beats business_constraint (priority 10) → ERR_AGREEMENT_NOT_ACTIVE, not ERR_INSUFFICIENT_PORTS."
        test_recipe:
          setup:
            - "Grant (min_ports 2, min_power_kw 150); site; DRAFT agreement (never activated); station enrolled in grant with a single 180kW ADA port (ADA satisfied, ports below min)."
          setup_api_calls:
            - { call: "POST /grant-programs", payload: { name: "NEVI", program_code: "NEVI", min_uptime_pct: 97.0, min_ports: 2, min_power_kw: 150, reimbursement_rate_cents_per_kwh: 20, reimbursement_cap_cents: 5000000 }, as: ProgramAdmin, captures: { grant_id: "$.data.id" } }
            - { call: "POST /host-sites", payload: { name: "Curb J", address: "10 Main", state_code: "CA", ada_required: false, revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /host-agreements", payload: { site_id: "${site_id}", term_start_date: "2026-05-01T00:00:00Z", term_end_date: "2027-05-01T00:00:00Z", proposed_revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { agr_id: "$.data.id" } }
            - { call: "POST /stations", payload: { site_id: "${site_id}", grant_id: "${grant_id}", name: "S1", ada_accessible: true }, as: ProgramAdmin, captures: { stn_id: "$.data.id" } }
            - { call: "POST /ports", payload: { station_id: "${stn_id}", connector_type: "CCS2", power_kw: 180, ada_accessible: true }, as: ProgramAdmin, captures: { port_id: "$.data.id" } }
          trigger:
            - { call: "POST /stations/${stn_id}/commission", payload: {}, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response http_status == 409"
            - "response data.error_id == ERR_AGREEMENT_NOT_ACTIVE"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: idle_fee_grace_boundary_exactly_10_minutes_zero_fee
        grounds:
          - calculations.session_idle_fee
          - entities.ChargingSession.fields.idle_minutes
          - entities.ChargingSession.fields.idle_fee_cents
          - state_machines.ChargingSession.STOPPED_to_FINALIZED
        distinguishing_aspect: "idle_minutes==10 sits exactly on the grace boundary; strict > means idle_fee_cents==0 (11 minutes would charge 40). Metric: idle minutes; endpoint: finalize."
        test_recipe:
          setup:
            - "Site; station; one 100kW port. Session started 12:00, stopped 12:30 (10 kWh), finalized at 12:40 (idle exactly 10 min)."
          setup_api_calls:
            - { call: "POST /host-sites", payload: { name: "Curb K", address: "11 Main", state_code: "CA", revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /stations", payload: { site_id: "${site_id}", name: "S1" }, as: ProgramAdmin, captures: { stn_id: "$.data.id" } }
            - { call: "POST /ports", payload: { station_id: "${stn_id}", connector_type: "CCS2", power_kw: 100 }, as: ProgramAdmin, captures: { port_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T12:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /charging-sessions", payload: { port_id: "${port_id}", driver_id: "drv-1" }, as: Driver, as_user_id: "drv-1", captures: { s_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T12:30:00Z" }, as: ProgramAdmin }
            - { call: "POST /charging-sessions/${s_id}/stop", payload: { energy_kwh: 10.0 }, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T12:40:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /charging-sessions/${s_id}/finalize", payload: {}, as: ProgramAdmin }
          assert:
            - "ChargingSession.${s_id}.idle_minutes == 10"
            - "ChargingSession.${s_id}.idle_fee_cents == 0"

      - name: rebate_uptime_threshold_boundary_exactly_min_passes
        grounds:
          - validations[priority=11]
          - calculations.rebate_amounts
          - state_machines.RebateClaim.DRAFT_to_SUBMITTED
        distinguishing_aspect: "reported_uptime_pct==97.0 exactly equals grant.min_uptime_pct; the >= gate admits it (96.99 → ERR_UPTIME_BELOW_THRESHOLD). Metric: uptime percent; endpoint: submit — a different metric and endpoint than the idle boundary."
        test_recipe:
          setup:
            - "Grant (min_uptime 97.0, min_ports 1, min_power 150, rate 20, cap 5000000); site; ACTIVE agreement; grant station with one 180kW ADA port; COMMISSIONED; DRAFT claim (reported_energy 1000, reported_uptime 97.0)."
          setup_api_calls:
            - { call: "POST /grant-programs", payload: { name: "NEVI", program_code: "NEVI", min_uptime_pct: 97.0, min_ports: 1, min_power_kw: 150, reimbursement_rate_cents_per_kwh: 20, reimbursement_cap_cents: 5000000 }, as: ProgramAdmin, captures: { grant_id: "$.data.id" } }
            - { call: "POST /host-sites", payload: { name: "Curb L", address: "12 Main", state_code: "CA", revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /host-agreements", payload: { site_id: "${site_id}", term_start_date: "2026-05-01T00:00:00Z", term_end_date: "2027-05-01T00:00:00Z", proposed_revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { agr_id: "$.data.id" } }
            - { call: "POST /host-agreements/${agr_id}/propose", payload: {}, as: ProgramAdmin }
            - { call: "POST /host-agreements/${agr_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /stations", payload: { site_id: "${site_id}", grant_id: "${grant_id}", name: "S1", ada_accessible: true }, as: ProgramAdmin, captures: { stn_id: "$.data.id" } }
            - { call: "POST /ports", payload: { station_id: "${stn_id}", connector_type: "CCS2", power_kw: 180, ada_accessible: true }, as: ProgramAdmin, captures: { port_id: "$.data.id" } }
            - { call: "POST /stations/${stn_id}/commission", payload: {}, as: ProgramAdmin }
            - { call: "GET /stations/${stn_id}", payload: {}, as: ProgramAdmin, captures: { stn_v: "$.data.version" } }
            - { call: "POST /rebate-claims", payload: { station_id: "${stn_id}", grant_id: "${grant_id}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", reported_energy_kwh: 1000, reported_uptime_pct: 97.0, expected_station_version: "${stn_v}" }, as: ProgramAdmin, captures: { claim_id: "$.data.id" } }
          trigger:
            - { call: "POST /rebate-claims/${claim_id}/submit", payload: {}, as: ProgramAdmin, as_user_id: "admin-1" }
          assert:
            - "RebateClaim.${claim_id}.status == SUBMITTED"
            - "RebateClaim.${claim_id}.estimated_amount_cents == 20000"
            - "RebateClaim.${claim_id}.compliance_status == COMPLIANT"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: session_start_blocked_by_port_out_of_service
        grounds:
          - state_machines.ChargingSession.AVAILABLE_to_OCCUPIED
          - state_machines.Port.IN_SERVICE_to_OUT_OF_SERVICE
          - validations[priority=10]
        distinguishing_aspect: "Session creation is gated by the Port's operational_status: an OUT_OF_SERVICE port rejects POST /charging-sessions with ERR_PORT_OUT_OF_SERVICE (Session→Port pair)."
        test_recipe:
          setup:
            - "Site; station; one port taken OUT_OF_SERVICE by a technician."
          setup_api_calls:
            - { call: "POST /host-sites", payload: { name: "Curb M", address: "13 Main", state_code: "CA", revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /stations", payload: { site_id: "${site_id}", name: "S1" }, as: ProgramAdmin, captures: { stn_id: "$.data.id" } }
            - { call: "POST /ports", payload: { station_id: "${stn_id}", connector_type: "CCS2", power_kw: 100 }, as: ProgramAdmin, captures: { port_id: "$.data.id" } }
            - { call: "POST /ports/${port_id}/out-of-service", payload: {}, as: FieldTechnician }
          trigger:
            - { call: "POST /charging-sessions", payload: { port_id: "${port_id}", driver_id: "drv-1" }, as: Driver, as_user_id: "drv-1", captures: { err: "$.data.error_id" } }
          assert:
            - "response http_status == 409"
            - "response data.error_id == ERR_PORT_OUT_OF_SERVICE"

      - name: station_commission_blocked_without_active_agreement
        grounds:
          - state_machines.Station.PENDING_to_COMMISSIONED
          - state_machines.HostAgreement.DRAFT_to_PROPOSED
          - validations[priority=7]
        distinguishing_aspect: "Station PENDING→COMMISSIONED is gated by an ACTIVE HostAgreement for its site; with no grant and ADA not required, a DRAFT agreement makes this the sole failing gate → ERR_AGREEMENT_NOT_ACTIVE (Station→HostAgreement pair, distinct from Session→Port)."
        test_recipe:
          setup:
            - "Site (ada_required false); station (no grant, no ports); DRAFT agreement (never activated)."
          setup_api_calls:
            - { call: "POST /host-sites", payload: { name: "Curb N", address: "14 Main", state_code: "CA", ada_required: false, revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /host-agreements", payload: { site_id: "${site_id}", term_start_date: "2026-05-01T00:00:00Z", term_end_date: "2027-05-01T00:00:00Z", proposed_revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { agr_id: "$.data.id" } }
            - { call: "POST /stations", payload: { site_id: "${site_id}", name: "S1" }, as: ProgramAdmin, captures: { stn_id: "$.data.id" } }
          trigger:
            - { call: "POST /stations/${stn_id}/commission", payload: {}, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response http_status == 409"
            - "response data.error_id == ERR_AGREEMENT_NOT_ACTIVE"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: reservation_half_open_overlap_on_port
        grounds:
          - validations[priority=9]
          - state_machines.Reservation.PENDING_to_CONFIRMED
          - entities.Reservation.fields.window_start
          - entities.Reservation.fields.window_end
        distinguishing_aspect: "Reservation overlap uses half-open [window_start,window_end): R2 [10:30,11:30) overlaps CONFIRMED R1 [10:00,11:00) on the same Port → ERR_RESERVATION_OVERLAP (adjacency end==start would be allowed)."
        test_recipe:
          setup:
            - "Site; station; one port. R1 [10:00,11:00) CONFIRMED. R2 [10:30,11:30) PENDING on the same port."
          setup_api_calls:
            - { call: "POST /host-sites", payload: { name: "Curb O", address: "15 Main", state_code: "CA", revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /stations", payload: { site_id: "${site_id}", name: "S1" }, as: ProgramAdmin, captures: { stn_id: "$.data.id" } }
            - { call: "POST /ports", payload: { station_id: "${stn_id}", connector_type: "CCS2", power_kw: 100 }, as: ProgramAdmin, captures: { port_id: "$.data.id" } }
            - { call: "POST /reservations", payload: { port_id: "${port_id}", driver_id: "drv-1", window_start: "2026-05-04T10:00:00Z", window_end: "2026-05-04T11:00:00Z" }, as: Driver, as_user_id: "drv-1", captures: { r1_id: "$.data.id" } }
            - { call: "POST /reservations/${r1_id}/confirm", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /reservations", payload: { port_id: "${port_id}", driver_id: "drv-2", window_start: "2026-05-04T10:30:00Z", window_end: "2026-05-04T11:30:00Z" }, as: Driver, as_user_id: "drv-2", captures: { r2_id: "$.data.id" } }
          trigger:
            - { call: "POST /reservations/${r2_id}/confirm", payload: {}, as: Driver, as_user_id: "drv-2", captures: { err: "$.data.error_id" } }
          assert:
            - "response http_status == 409"
            - "response data.error_id == ERR_RESERVATION_OVERLAP"

      - name: maintenance_window_buffer_overlap_on_station
        grounds:
          - validations[priority=9]
          - entities.MaintenanceWindow.fields.window_start
          - entities.MaintenanceWindow.fields.window_end
        distinguishing_aspect: "MaintenanceWindow overlap on a Station uses a closed interval plus a 60-minute buffer: MW2 starting 30 min after MW1 ends violates the buffer → ERR_MAINTENANCE_WINDOW_OVERLAP (distinct arithmetic and a different resource than the reservation rule)."
        test_recipe:
          setup:
            - "Site; station. MW1 [08:00,10:00] SCHEDULED. MW2 [10:30,12:00] (gap 30 min < 60 buffer)."
          setup_api_calls:
            - { call: "POST /host-sites", payload: { name: "Curb P", address: "16 Main", state_code: "CA", revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /stations", payload: { site_id: "${site_id}", name: "S1" }, as: ProgramAdmin, captures: { stn_id: "$.data.id" } }
            - { call: "POST /maintenance-windows", payload: { station_id: "${stn_id}", window_start: "2026-05-05T08:00:00Z", window_end: "2026-05-05T10:00:00Z", reason: "inspection" }, as: ProgramAdmin, captures: { mw1_id: "$.data.id" } }
          trigger:
            - { call: "POST /maintenance-windows", payload: { station_id: "${stn_id}", window_start: "2026-05-05T10:30:00Z", window_end: "2026-05-05T12:00:00Z", reason: "repair" }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response http_status == 409"
            - "response data.error_id == ERR_MAINTENANCE_WINDOW_OVERLAP"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: session_void_conserves_gross_revenue
        grounds:
          - state_machines.ChargingSession.FINALIZED_to_VOIDED
          - state_machines.ChargingSession.STOPPED_to_FINALIZED
          - entities.HostSite.fields.lifetime_gross_revenue_cents
        distinguishing_aspect: "Voiding a FINALIZED session reverses the exact final_cost_cents (1363) it posted; HostSite.lifetime_gross_revenue_cents returns to its pre-finalize value 0 — conserved quantity is gross revenue (money)."
        test_recipe:
          setup:
            - "Site; station; one 180kW port. Session PEAK 17:00→17:30 (12.5 kWh, energy 663), finalized at 17:55 (idle 25 → fee 600) → final 1363; gross ledger 1363."
          setup_api_calls:
            - { call: "POST /host-sites", payload: { name: "Curb Q", address: "17 Main", state_code: "CA", revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /stations", payload: { site_id: "${site_id}", name: "S1" }, as: ProgramAdmin, captures: { stn_id: "$.data.id" } }
            - { call: "POST /ports", payload: { station_id: "${stn_id}", connector_type: "CCS2", power_kw: 180 }, as: ProgramAdmin, captures: { port_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T17:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /charging-sessions", payload: { port_id: "${port_id}", driver_id: "drv-1" }, as: Driver, as_user_id: "drv-1", captures: { s_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T17:30:00Z" }, as: ProgramAdmin }
            - { call: "POST /charging-sessions/${s_id}/stop", payload: { energy_kwh: 12.5 }, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T17:55:00Z" }, as: ProgramAdmin }
            - { call: "POST /charging-sessions/${s_id}/finalize", payload: {}, as: ProgramAdmin }
            - { call: "GET /host-sites/${site_id}", payload: {}, as: ProgramAdmin, captures: { gross_after_finalize: "$.data.lifetime_gross_revenue_cents" } }
          trigger:
            - { call: "POST /charging-sessions/${s_id}/void", payload: {}, as: ProgramAdmin }
          assert:
            - "ChargingSession.${s_id}.final_cost_cents == 1363"
            - "HostSite.${site_id}.lifetime_gross_revenue_cents == 0"

      - name: reservation_confirm_cancel_conserves_available_ports
        grounds:
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - state_machines.Port.RESERVED_to_AVAILABLE
          - entities.Station.fields.available_ports
        distinguishing_aspect: "Confirm then cancel a reservation is a forward/compensating pair that leaves Station.available_ports back at 1 — conserved quantity is the available-port count (capacity), distinct from the money invariant."
        test_recipe:
          setup:
            - "Site; station; one IN_SERVICE/AVAILABLE port → available_ports 1. Reservation confirmed (port RESERVED → available_ports 0)."
          setup_api_calls:
            - { call: "POST /host-sites", payload: { name: "Curb R", address: "18 Main", state_code: "CA", revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /stations", payload: { site_id: "${site_id}", name: "S1" }, as: ProgramAdmin, captures: { stn_id: "$.data.id" } }
            - { call: "POST /ports", payload: { station_id: "${stn_id}", connector_type: "CCS2", power_kw: 100 }, as: ProgramAdmin, captures: { port_id: "$.data.id" } }
            - { call: "POST /reservations", payload: { port_id: "${port_id}", driver_id: "drv-1", window_start: "2026-05-04T10:00:00Z", window_end: "2026-05-04T11:00:00Z" }, as: Driver, as_user_id: "drv-1", captures: { r_id: "$.data.id" } }
            - { call: "POST /reservations/${r_id}/confirm", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "GET /stations/${stn_id}", payload: {}, as: ProgramAdmin, captures: { avail_reserved: "$.data.available_ports" } }
          trigger:
            - { call: "POST /reservations/${r_id}/cancel", payload: {}, as: Driver, as_user_id: "drv-1" }
          assert:
            - "Port.${port_id}.occupancy_status == AVAILABLE"
            - "Station.${stn_id}.available_ports == 1"
