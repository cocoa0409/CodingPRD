  - rule_id: boundary_precision_check
    instances:
      - name: slope_surcharge_threshold_at_15_exact
        grounds:
          - calculations.line_item_estimate
          - entities.LineItem.fields.grade_slope_pct
          - entities.LineItem.fields.line_material_cost
        distinguishing_aspect: |
          Numeric-threshold boundary on grade_slope_pct: at exactly 15 the surcharge applies (>= 15),
          so a CEDAR/PRIVACY 100 ft NONE line at slope 15 costs round(42.50*100*1.12)=4760.00,
          versus 4250.00 at slope 14 — reachable through the estimate price endpoint.
        test_recipe:
          setup:
            - "Estimate with one CEDAR/PRIVACY line, 100 ft, NONE, grade_slope_pct exactly 15"
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Slope15", email: "s15@x.com", hoa_governed: false }
              as: ProjectManager
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "15 Slope", job_type: "FENCE" }
              as: ProjectManager
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/estimates"
              payload: {}
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /line-items"
              payload: { estimate_id: "${est_id}", work_type: "FENCE", material: "CEDAR", style: "PRIVACY", quantity_units: 100, accessory: "NONE", grade_slope_pct: 15 }
              as: Estimator
              captures: { li_id: $.data.id }
          trigger:
            - call: "POST /projects/${proj_id}/estimates/${est_id}/price"
              payload: {}
              as: Estimator
          assert:
            - "LineItem.${li_id}.line_material_cost == 4760.00"

      - name: empty_estimate_zero_lineitems_rejected_on_price
        grounds:
          - state_machines.Estimate.DRAFT_to_PRICED
          - errors[ERR_EMPTY_ESTIMATE]
        distinguishing_aspect: |
          Empty-collection boundary on a different metric (zero line-item count) and a different
          endpoint (price): pricing an estimate with zero line items is rejected ERR_EMPTY_ESTIMATE,
          unlike the slope numeric threshold above.
        test_recipe:
          setup:
            - "A DRAFT estimate with no line items added"
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Empty E", email: "ee@x.com", hoa_governed: false }
              as: ProjectManager
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
