          - state_machines.Cohort.LOCKED_to_FORMING
          - calculations.waitlist_promotion_selection
        distinguishing_aspect: |
          Depth-4 cascade triggered by a scholar withdrawal: Scholar ->
          WITHDRAWN revokes its ACCEPTED offer (link 1); the revocation
          decrements cohort.seats_committed (link 2); the ledger drop below
          cohort_size flips cohort LOCKED -> FORMING (link 3); the revert fires
          the waitlist sweep which flips nominee W WAITLISTED -> SELECTED and
          mints a fresh OFFERED offer (link 4). Each link is caused by the
          previous one, not by the original request. Sibling cascade
          (cohort_completion_cascade_to_college_probation) is triggered by the
          last scholar reaching a terminal state — a different trigger.
