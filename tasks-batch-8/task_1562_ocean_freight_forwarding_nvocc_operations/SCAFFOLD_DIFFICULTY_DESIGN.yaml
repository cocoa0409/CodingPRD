            - { call: "POST /freight/carrier-contracts/${c}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /freight/voyages", payload: { vessel_name: "EVER GIVEN", voyage_number: "EG101", carrier_contract_id: "${c}", origin_port: "CNSHA", destination_port: "USLAX", etd: "2026-09-01T00:00:00Z", eta: "2026-09-21T00:00:00Z" }, as: OperationsManager, captures: { v1: $.data.id } }
            - { call: "POST /freight/voyages/${v1}/open-for-booking", payload: {}, as: OperationsManager }
            - { call: "POST /freight/voyages", payload: { vessel_name: "EVER GIVEN", voyage_number: "EG102", carrier_contract_id: "${c}", origin_port: "CNSHA", destination_port: "USLAX", etd: "2026-09-15T00:00:00Z", eta: "2026-10-05T00:00:00Z" }, as: OperationsManager, captures: { v2: $.data.id } }
            - { call: "POST /freight/voyages/${v2}/open-for-booking", payload: {}, as: OperationsManager }
            - { call: "POST /freight/bookings", payload: { voyage_id: "${v1}", tariff_id: "${t}", rate_source: "CONTRACT", mode: "LCL", commodity_type: "GENERAL", gross_weight_kg: 4000, volume_cbm: 6.0, terms: "PREPAID" }, as: Shipper, as_user_id: "${s}", captures: { b: $.data.id } }
            - { call: "POST /freight/bookings/${b}/confirm", payload: {}, as: BookingCoordinator }
          trigger:
            - { call: "POST /freight/bookings/${b}/roll", payload: { reason: "shipper schedule change" }, as: Shipper, as_user_id: "${s}", captures: { rc: $.data.rollover_count, rr: $.data.rolled_reason } }
            - { call: "POST /freight/bookings/${b}/rebook", payload: { new_voyage_id: "${v2}" }, as: BookingCoordinator, captures: { est2: $.data.estimated_freight_cents, fee: $.data.pending_rollover_fee_cents, vnew: $.data.voyage_id } }
          assert:
            - "after roll: Booking.${b}.status == ROLLED, rollover_count == 1, rolled_reason == SHIPPER_REQUEST"
            - "after rebook: Booking.${b}.status == CONFIRMED and voyage_id == ${v2} (cycle closed)"
            - "Booking.${b}.estimated_freight_cents == 77400 (fresh quote on same tariff/cargo)"
            - "Booking.${b}.pending_rollover_fee_cents == 150000 (SHIPPER_REQUEST variant adds the fee; carrier-caused variant would leave it 0)"

      - name: invoice_partial_payment_self_loop
        grounds:
