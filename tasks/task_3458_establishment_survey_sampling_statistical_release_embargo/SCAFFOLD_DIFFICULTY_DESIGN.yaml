            - "rm_val == 100 and rm_supp == COMPLEMENTARY (row pass, industry_code ASC: RETAIL row had exactly one suppressed cell; 3.333333 x 30 = 100)"
            - "ms_val == 120 and ms_supp == COMPLEMENTARY (column pass, size_class ASC: SMALL column had exactly one suppressed cell; 10.0 x 12)"
            - "mm_val == 133 and mm_supp == COMPLEMENTARY (MEDIUM column had exactly one suppressed cell after RM was complemented; round_half_up(3.333333 x 40) = 133)"
            - "fixed point reached with zero publishable cells; industry totals remain defined at 200 (RETAIL) and 253 (MANUFACTURING) from the full cell set"

  # ---------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (3 instances, different entities)
  # ---------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: response_report_return_resubmit_cycle
        grounds:
          - state_machines.ResponseReport.SUBMITTED_to_RETURNED
          - state_machines.ResponseReport.RETURNED_to_SUBMITTED
          - state_machines.ResponseReport.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          ResponseReport carries a correction CYCLE (SUBMITTED -> RETURNED ->
          SUBMITTED -> ACCEPTED): the second submission increments submit_count
          and adds a second 15-minute burden charge, so burden is 30, not 15.
          Entity: ResponseReport (distinct from the SurveyCycle and
          ReleaseEvent machines in the sibling instances).
        test_recipe:
          setup:
            - "Program CES (budget 3); frame 2026-Q3 stratum (MANUFACTURING,SMALL,100) frozen; E1 enrolled/accepted"
            - "September cycle COLLECTING (clock 2026-09-01 inside the window)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /survey/programs", payload: { code: "CES", name: "Current Employment Statistics", sample_budget: 3, embargo_window_minutes: 30, annual_burden_budget_minutes: 500 }, as: ProgramAdmin, captures: { prog_v: $.data.version } }
            - { call: "POST /survey/sample-frames", payload: { program_code: "CES", reference_quarter: "2026-Q3", strata: [{ industry_code: MANUFACTURING, size_class: SMALL, frame_unit_count: 100 }], expected_program_version: "${prog_v}" }, as: ProgramAdmin, captures: { frame_id: $.data.id } }
            - { call: "POST /survey/sample-frames/${frame_id}/freeze", payload: {}, as: ProgramAdmin }
            - { call: "POST /survey/establishments", payload: { ein: "11-0000601", name: "Cyc-E1", industry_code: MANUFACTURING, size_class: SMALL }, as: CollectionOfficer, captures: { e1: $.data.id } }
            - { call: "POST /survey/panel-enrollments", payload: { establishment_id: "${e1}", program_code: "CES" }, as: CollectionOfficer, captures: { en1: $.data.id } }
            - { call: "POST /survey/panel-enrollments/${en1}/lifecycle", payload: { action: ACCEPT }, as: Respondent, as_user_id: "${e1}" }
            - { call: "POST /survey/survey-cycles", payload: { program_code: "CES", reference_month: "2026-09" }, as: ProgramAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /survey/survey-cycles/${cyc}/advance", payload: { action: OPEN_COLLECTION }, as: CollectionOfficer }
          trigger:
            - { call: "POST /survey/response-reports", payload: { enrollment_id: "${en1}", cycle_id: "${cyc}", employment: 10 }, as: Respondent, as_user_id: "${e1}", captures: { rep: $.data.id, rep_status0: $.data.report_status } }
            - { call: "POST /survey/response-reports/${rep}/advance", payload: { action: RETURN, return_reason: "unit mismatch" }, as: CollectionOfficer, captures: { rep_status1: $.data.report_status } }
            - { call: "POST /survey/response-reports/${rep}/advance", payload: { action: SUBMIT }, as: Respondent, as_user_id: "${e1}", captures: { rep_status2: $.data.report_status, rep_submits: $.data.submit_count } }
            - { call: "POST /survey/response-reports/${rep}/advance", payload: { action: ACCEPT }, as: CollectionOfficer, captures: { rep_status3: $.data.report_status } }
            - { call: "GET /survey/panel-enrollments/${en1}", payload: {}, as: CollectionOfficer, captures: { burden: $.data.burden_minutes_ytd } }
          assert:
            - "rep_status0 == SUBMITTED (initial state at electronic submission)"
            - "rep_status1 == RETURNED and rep_status2 == SUBMITTED (cycle traversed)"
            - "rep_status3 == ACCEPTED (terminal)"
            - "rep_submits == 2 — resubmission after RETURN is a new submission event"
            - "burden == 30 (2 submissions x 15 minutes each)"

      - name: cycle_revision_loop_publish_reopen_recertify
        grounds:
          - state_machines.SurveyCycle.PUBLISHED_to_REVISION_OPEN
          - state_machines.SurveyCycle.REVISION_OPEN_to_CERTIFIED
          - state_machines.ReleaseEvent.disclosure_APPROVED_to_PENDING
        distinguishing_aspect: |
          SurveyCycle carries a revision CYCLE (PUBLISHED -> REVISION_OPEN ->
          CERTIFIED -> lands back on PUBLISHED because a published release
          exists): reopening flips the release's disclosure dimension back to
          PENDING automatically, and re-certification returns the cycle to
          PUBLISHED rather than CERTIFIED. Entity: SurveyCycle.
        test_recipe:
          setup:
            - "Program CES (budget 3); frame frozen; E1,E2,E3 enrolled/accepted"
            - "September cycle: reports 9,11,8 ACCEPTED (estimate 933); CERTIFIED by analyst-1"
            - "Release created for the cycle (release_at 2026-10-01T13:30:00Z), disclosure APPROVED by officer-7, embargo opened, PUBLISHED"
