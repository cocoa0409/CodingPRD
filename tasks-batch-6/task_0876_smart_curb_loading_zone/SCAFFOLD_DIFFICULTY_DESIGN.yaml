      - name: approve_sod_beats_zone_inactive
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_ZONE_NOT_ACTIVE]
        distinguishing_aspect: "Permit approve where BOTH SoD (approver X-User-ID == reviewer, priority 5) and a SUSPENDED zone (priority 6) fail: ERR_SEGREGATION_OF_DUTIES wins - business_safety vs business_referential."
        test_recipe:
          setup:
            - "Permit UNDER_REVIEW with reviewer_user_id 'u1'; its zone Z1 SUSPENDED; approve attempted by PermitApprover with X-User-ID 'u1' (same as reviewer)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /curb/pricing-policies", payload: { name: "P1", base_rate_cents_per_15min: 200, peak_multiplier_bps: 15000, peak_start_hour: 7, peak_end_hour: 10, surge_tier1_ratio_bps: 5000, surge_tier1_mult_bps: 12500, surge_tier2_ratio_bps: 8000, surge_tier2_mult_bps: 15000 }, as: CurbPlanner, captures: { pol_id: $.data.id } }
            - { call: "POST /curb/zones", payload: { name: "Z1", block_face: "MAIN-100", length_meters: 12, designation: "LOADING", capacity_slots: 5, pricing_policy_id: "${pol_id}" }, as: CurbPlanner, captures: { z1: $.data.id } }
            - { call: "POST /curb/permittees", payload: { legal_name: "Acme", contact_email: "a@x.com", permittee_type: "CARRIER" }, as: PlatformAdmin, captures: { pm_id: $.data.id } }
            - { call: "POST /curb/permits", payload: { permittee_id: "${pm_id}", requested_designation: "LOADING", purpose: "deliveries", zone_ids: ["${z1}"] }, as: Permittee, as_user_id: "${pm_id}", captures: { permit_id: $.data.id } }
            - { call: "POST /curb/permits/${permit_id}/submit", payload: {}, as: Permittee, as_user_id: "${pm_id}" }
            - { call: "POST /curb/permits/${permit_id}/review", payload: {}, as: CurbPlanner, as_user_id: "u1" }
            - { call: "POST /curb/zones/${z1}/status", payload: { target_status: "SUSPENDED" }, as: CurbPlanner, as_user_id: "planner1" }
          trigger:
            - { call: "POST /curb/permits/${permit_id}/approve", payload: {}, as: PermitApprover, as_user_id: "u1", captures: { err: $.data.error_id } }
          assert:
            - "approve returns HTTP 403 with error_id ERR_SEGREGATION_OF_DUTIES (safety priority 5 beats referential priority 6)"
            - "CurbPermit.${permit_id}.status == UNDER_REVIEW (unchanged)"

