        claim_type: derived_field_reconciliation
        grounds: [calculations.net_worth_rollup, entities.Account.fields.cleared_balance_cents]
        distinguishing_aspect: "After posting a -2500 outflow, Account.cleared_balance_cents reconciles from 10000 to 7500 in the same request's downstream read."
        test_recipe:
          setup: ["Household; DEPOSITORY account opening 10000; one PENDING txn -2500"]
          setup_api_calls:
            - call: "POST /households"
              payload: { name: "Acme", owner_email: "o@x.com", owner_display_name: "Owner" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /households/${hh_id}/accounts"
              payload: { institution_name: "Bank", account_type: "DEPOSITORY", opening_balance_cents: 10000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/transactions"
              payload: { amount_cents: -2500, merchant_name: "Store" }
              as: PlatformAdmin
              captures: { txn_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acc_id}/transactions/${txn_id}/post"
              payload: {}
              as: PlatformAdmin
            - call: "GET /households/accounts/${acc_id}"
              payload: {}
              as: HouseholdOwner
              as_user_id: "${owner_id}"
          assert:
            - "Account.${acc_id}.cleared_balance_cents == 7500"
            - "Account.${acc_id}.available_balance_cents == 7500"

