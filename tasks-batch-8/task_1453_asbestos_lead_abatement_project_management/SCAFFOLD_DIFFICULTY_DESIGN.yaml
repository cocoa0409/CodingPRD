  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: manifest_create_void_conserves_manifested_weight
        grounds:
          - entities.Project.fields.manifested_weight_lbs
          - state_machines.WasteManifest.DRAFT_to_VOIDED
          - calculations.manifest_net_weight
        distinguishing_aspect: |
          Conserved quantity is waste mass: with one SEALED manifest (net 96
          lbs) on the project, creating a DRAFT manifest (48 lbs net) and then
          voiding it leaves Project.manifested_weight_lbs == 96 at every
          observation — DRAFT and VOIDED are both outside the aggregation set
          {SEALED, IN_TRANSIT, DELIVERED, CONFIRMED}.
        test_recipe:
          setup:
            - "Project P IN_PROGRESS (canonical chain); Facility F; Manifest M1 (bags 2, gross 100 lbs -> net 96) SEALED so manifested_weight_lbs == 96"
          setup_api_calls:
            - { call: "POST /abatement/projects", payload: { name: "P-INV1", site_address: "19 Ash St", work_type: "RENOVATION", hazard_class: "ASBESTOS", planned_start: "2026-08-11T00:00:00Z", base_abatement_cost_cents: 5000000 }, as: ContractorAdmin, captures: { p_id: "$.data.id" } }
