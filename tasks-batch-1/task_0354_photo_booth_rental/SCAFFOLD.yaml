    output: Booking
    side_effects: ["run calc booth_selector -> set booth_id", "claim booth interval", "if attendant add-on present, run calc attendant_selector and create AttendantAssignment", "recompute calc estimate_quote", "schedule_status DRAFT->CONFIRMED", "increments Booth.version by 1", "increments Booking.version by 1"]

