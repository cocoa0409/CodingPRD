            - call: "POST /issuance-requests"
              payload: { channel: "PHYSICAL", face_value_cents: 6000, store_id: "${store1_id}", rack_id: "${rack1_id}", card_id: "${card_id}", pos_terminal_id: "T-34", packaging_seal_intact: true }
              as: PosAssociate
              captures: { ir_id: $.data.id }
            - call: "POST /issuance-requests/${ir_id}/screen"
              payload: {}
