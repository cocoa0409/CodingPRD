scenario: |
  Public library management system: collection cataloging with bibliographic data entry (MARC standard),
  copy-level management (barcode/location/status), classification by subject (Dewey/CLC), acquisition source
  tracking, and weeding workflow; reader card management with reader registration and identity verification,
  card-type classification (regular/student/senior/temporary), borrowing-quota and validity-period configuration,
  card freeze and reissuance, and reader-status (normal/overdue/blacklisted) management; borrow/renew/reserve/recall
  with borrowing rules (quota/duration by card type), renewal limits, online and on-site reservation,
  reserved-book hold period, recall workflow for reserved or overdue copies, and self-service kiosk integration;
  overdue fine with daily fine rate by category, fine cap per copy, fine waiver rules (system fault/holiday/
  special hardship), payment workflow, and unpaid-fine borrowing restriction; inter-library loan with
  partner-library network, request submission, availability check, transit tracking, loan-period coordination,
  and inter-library settlement; acquisition suggestion with reader-submitted suggestions, librarian review,
  acquisition-decision workflow, suggestion-status feedback, and suggestion-to-acquisition statistics;
  event-driven synchronization with payment, identity verification, and inter-library platforms; audit
  logging for borrowing records and fine adjustments.

domain_name: public-library
api_prefix: /library

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - cascading_side_effects
    - rate_threshold_triggers
    - ops_run_checkpoint
    - compensating_invariant
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: BookTitle
    parent: null
    common_fields: true
    fields:
      - name: marc_control_number
        type: string
        source: input
        description: MARC 001 control number; globally unique
        constraints: "Length 8-20; unique across BookTitle"
      - name: isbn
        type: string
        source: input
        description: ISBN-13
        constraints: "Exactly 13 digits"
      - name: title
        type: string
        source: input
        description: Bibliographic title (MARC 245$a)
      - name: author
        type: string
        source: input
        description: Primary author (MARC 100$a)
      - name: publisher
        type: string
        source: input
        description: Publisher (MARC 260$b)
      - name: publication_year
        type: integer
        source: input
        description: Year of publication
        constraints: "1450 <= publication_year <= current_year"
      - name: classification_scheme
        type: enum
        source: input
        description: Classification scheme used
        constraints: "Values: DEWEY, CLC"
      - name: classification_code
        type: string
        source: input
        description: Subject classification code (e.g., 813.54 or I712.45)
      - name: subject_category
        type: enum
        source: input
        description: Fine-rate category derived from classification
        constraints: "Values: GENERAL, REFERENCE, CHILDREN, RARE"
      - name: acquisition_source
        type: enum
        source: input
        description: How the title was acquired
        constraints: "Values: PURCHASE, DONATION, EXCHANGE, ILL_PURCHASE"
      - name: total_copies
        type: integer
        source: computed
        description: Count of Copy records linked to this title (any status)
        default: 0
      - name: available_copies
        type: integer
        source: computed
        description: Count of Copy records with status == AVAILABLE
        default: 0
      - name: status
        type: enum
        source: computed
        description: Lifecycle of the title; transitions to WITHDRAWN when all copies are WEEDED
        default: ACTIVE
        constraints: "Values: ACTIVE, WITHDRAWN"

  - name: Copy
    parent: BookTitle
    common_fields: true
    fields:
      - name: book_title_id
        type: string
        source: input
        description: Foreign key to BookTitle.id
      - name: barcode
        type: string
        source: input
        description: Physical barcode; globally unique
        constraints: "Unique across Copy"
      - name: location_code
        type: string
        source: input
        description: Shelf location (e.g., A-12-03)
      - name: acquisition_source
        type: enum
        source: input
        description: How this specific copy was acquired
        constraints: "Values: PURCHASE, DONATION, EXCHANGE, ILL_PURCHASE"
      - name: acquired_at
        type: datetime
        source: input
        description: When the copy entered the collection
      - name: weeding_reason
        type: enum
        source: input
        description: Reason for weeding; set only on WEEDED transition
        default: null
        constraints: "Values when set: DAMAGED, LOST, OBSOLETE, LOW_CIRCULATION"
      - name: status
        type: enum
        source: computed
        description: Current operational state
        default: AVAILABLE
        constraints: "Values: AVAILABLE, ON_LOAN, RESERVED, IN_TRANSIT_ILL, WEEDED"

  - name: Reader
    parent: null
    common_fields: true
    fields:
      - name: national_id_hash
        type: string
        source: input
        description: SHA-256 hash of national ID; unique
        constraints: "Length 64; unique across Reader"
      - name: full_name
        type: string
        source: input
        description: Reader's legal name
      - name: identity_verified
        type: boolean
        source: computed
        description: Set true after external identity-verification platform confirms; gates Card issuance
        default: false
      - name: identity_verified_at
        type: datetime
        source: computed
        description: Timestamp when verification event was recorded
        default: null
      - name: status
        type: enum
        source: computed
        description: Aggregate posture across all cards; gates borrowing operations
        default: NORMAL
        constraints: "Values: NORMAL, OVERDUE, BLACKLISTED"
      - name: active_loan_count
        type: integer
        source: computed
        description: Count of Loans with status IN {BORROWED, RENEWED, RECALL_PENDING}
        default: 0
      - name: unpaid_fine_cents
        type: integer
        source: computed
        description: Sum of Fine.outstanding_cents for fines with settlement_status == PENDING
        default: 0

  - name: Card
    parent: Reader
    common_fields: true
    fields:
      - name: reader_id
        type: string
        source: input
        description: Foreign key to Reader.id
      - name: card_number
        type: string
        source: system
        description: Server-minted human-readable card number; unique
        constraints: "Format LIB-YYYY-NNNNNN; unique across Card"
      - name: card_type
        type: enum
        source: input
        description: Card classification determining quota and validity
        constraints: "Values: REGULAR, STUDENT, SENIOR, TEMPORARY"
      - name: max_loans
        type: integer
        source: computed
        description: Borrowing quota derived from card_type at issuance (REGULAR=5, STUDENT=8, SENIOR=4, TEMPORARY=2)
      - name: loan_duration_days
        type: integer
        source: computed
        description: Loan period derived from card_type at issuance (REGULAR=30, STUDENT=60, SENIOR=45, TEMPORARY=14)
      - name: max_renewals
        type: integer
        source: computed
        description: Maximum consecutive renewals per loan derived from card_type (REGULAR=2, STUDENT=3, SENIOR=2, TEMPORARY=0)
      - name: valid_from
        type: datetime
        source: input
        description: Inclusive validity start
      - name: valid_until
        type: datetime
        source: input
        description: Exclusive validity end
      - name: status
        type: enum
        source: computed
        description: Card lifecycle
        default: ACTIVE
        constraints: "Values: ACTIVE, FROZEN, REISSUED, EXPIRED"
      - name: replaced_by_card_id
        type: string
        source: computed
        description: Set on REISSUED transition; points to successor card
        default: null

  - name: Loan
    parent: null
    common_fields: true
    fields:
      - name: copy_id
        type: string
        source: input
        description: Foreign key to Copy.id
      - name: card_id
        type: string
        source: input
        description: Foreign key to Card.id at loan creation
      - name: reader_id
        type: string
        source: computed
        description: Copied from Card.reader_id at loan creation; pinned even if card is later reissued
      - name: borrowed_at
        type: datetime
        source: system
        description: Loan creation timestamp
      - name: due_at
        type: datetime
        source: computed
        description: borrowed_at + Card.loan_duration_days; recomputed on renewal
      - name: returned_at
        type: datetime
        source: system
        description: Return timestamp; null until RETURNED
        default: null
      - name: renewals_used
        type: integer
        source: computed
        description: Count of successful renewals on this loan
        default: 0
      - name: is_recalled
        type: boolean
        source: computed
        description: True when a Recall has been raised against this loan
        default: false
      - name: recall_due_at
        type: datetime
        source: computed
        description: Shortened due date imposed by recall; null unless is_recalled
        default: null
      - name: channel
        type: enum
        source: input
        description: How the loan was created
        constraints: "Values: COUNTER, KIOSK"
      - name: status
        type: enum
        source: computed
        description: Loan lifecycle
        default: BORROWED
        constraints: "Values: BORROWED, RENEWED, RECALL_PENDING, RETURNED, OVERDUE_CLOSED"

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - name: book_title_id
        type: string
        source: input
        description: Title being reserved (any copy of which fulfills the reservation)
      - name: card_id
        type: string
        source: input
        description: Reserving card
      - name: reader_id
        type: string
        source: computed
        description: Copied from Card.reader_id at reservation creation
      - name: channel
        type: enum
        source: input
        description: Submission channel
        constraints: "Values: ONLINE, ON_SITE"
      - name: queue_position
        type: integer
        source: computed
        description: 1-indexed position in FIFO queue for this title at creation time
      - name: held_copy_id
        type: string
        source: computed
        description: Copy assigned when reservation is ready for pickup; null until READY_FOR_PICKUP
        default: null
      - name: hold_expires_at
        type: datetime
        source: computed
        description: Pickup deadline; set when transitioning to READY_FOR_PICKUP
        default: null
      - name: status
        type: enum
        source: computed
        description: Reservation lifecycle
        default: QUEUED
        constraints: "Values: QUEUED, READY_FOR_PICKUP, FULFILLED, EXPIRED, CANCELLED"

  - name: Fine
    parent: Loan
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: computed
        description: Foreign key to Loan.id; one Fine per Loan, created lazily on first accrual
      - name: reader_id
        type: string
        source: computed
        description: Copied from Loan.reader_id
      - name: subject_category
        type: enum
        source: computed
        description: Copied from BookTitle.subject_category at fine creation
        constraints: "Values: GENERAL, REFERENCE, CHILDREN, RARE"
      - name: daily_rate_cents
        type: integer
        source: computed
        description: Daily fine rate derived from subject_category (GENERAL=20, REFERENCE=50, CHILDREN=10, RARE=200)
      - name: fine_cap_cents
        type: integer
        source: computed
        description: Per-copy maximum derived from subject_category (GENERAL=5000, REFERENCE=10000, CHILDREN=2000, RARE=50000)
      - name: accrued_cents
        type: integer
        source: computed
        description: Total accrued amount before any waivers; capped at fine_cap_cents
        default: 0
      - name: waived_cents
        type: integer
        source: computed
        description: Sum of approved waiver amounts
        default: 0
      - name: paid_cents
        type: integer
        source: computed
        description: Sum of successful payment amounts
        default: 0
      - name: outstanding_cents
        type: integer
        source: computed
        description: accrued_cents - waived_cents - paid_cents
        default: 0
      - name: settlement_status
        type: enum
        source: computed
        description: Settlement lifecycle
        default: PENDING
        constraints: "Values: PENDING, SETTLED"

  - name: ILLRequest
    parent: null
    common_fields: true
    fields:
      - name: reader_id
        type: string
        source: input
        description: Requesting reader
      - name: card_id
        type: string
        source: input
        description: Requesting card
      - name: partner_library_code
        type: string
        source: input
        description: Code of partner library; must be in approved partner network
        constraints: "Values: PL_A, PL_B, PL_C"
      - name: target_marc_control_number
        type: string
        source: input
        description: MARC control number requested
      - name: agreed_loan_days
        type: integer
        source: computed
        description: Negotiated loan period; min(partner_max, requester_max) where requester_max=21
      - name: shipping_cost_cents
        type: integer
        source: input
        description: Quoted shipping cost per leg
        constraints: ">= 0"
      - name: handling_fee_cents
        type: integer
        source: computed
        description: Per-leg handling fee (constant 300)
        default: 300
      - name: settlement_total_cents
        type: integer
        source: computed
        description: Final settlement amount computed at SETTLED transition
        default: 0
      - name: in_transit_from
        type: datetime
        source: computed
        description: Start of outbound transit (inclusive)
        default: null
      - name: in_transit_to
        type: datetime
        source: computed
        description: End of return transit (exclusive)
        default: null
      - name: status
        type: enum
        source: computed
        description: ILL lifecycle
        default: SUBMITTED
        constraints: "Values: SUBMITTED, APPROVED, REJECTED, IN_TRANSIT, AT_PARTNER, RETURNED_TRANSIT, SETTLED"

  - name: AcquisitionSuggestion
    parent: null
    common_fields: true
    fields:
      - name: reader_id
        type: string
        source: input
        description: Suggesting reader
      - name: card_id
        type: string
        source: input
        description: Suggesting card
      - name: suggested_isbn
        type: string
        source: input
        description: ISBN-13 of the suggested item
        constraints: "Exactly 13 digits"
      - name: suggested_title
        type: string
        source: input
        description: Title text supplied by suggester
      - name: rationale
        type: string
        source: input
        description: Justification text from the reader
      - name: review_notes
        type: string
        source: input
        description: Librarian notes added on decision
        default: null
      - name: decision_book_title_id
        type: string
        source: computed
        description: Set when an ACQUIRED transition links the resulting BookTitle
        default: null
      - name: status
        type: enum
        source: computed
        description: Suggestion lifecycle
        default: SUBMITTED
        constraints: "Values: SUBMITTED, UNDER_REVIEW, ACQUIRED, DECLINED, DEFERRED"

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - name: event_type
        type: enum
        source: system
        description: Category of audited event
        constraints: "Values: LOAN_CREATED, LOAN_RENEWED, LOAN_RECALLED, LOAN_RETURNED, FINE_ACCRUED, FINE_WAIVED, FINE_PAID, RESERVATION_CREATED, RESERVATION_FULFILLED"
      - name: subject_type
        type: string
        source: system
        description: Entity type the event relates to (e.g., Loan, Fine, Reservation)
      - name: subject_id
        type: string
        source: system
        description: Identifier of the subject entity
      - name: actor_role
        type: string
        source: system
        description: Role that triggered the event (Reader, Librarian, FineOfficer, ILLCoordinator, System)
      - name: actor_id
        type: string
        source: system
        description: X-User-ID at time of event; null for system events
      - name: payload
        type: object
        source: system
        description: Snapshot of relevant fields after the event (e.g., {before, after})
      - name: occurred_at
        type: datetime
        source: system
        description: ISO 8601 UTC timestamp the event was recorded

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Copy
    initial_state: AVAILABLE
    terminal_states: [WEEDED]
    transitions:
      - from: AVAILABLE
        to: ON_LOAN
        trigger: "POST /library/loans"
        actor: Reader or Librarian
        preconditions:
          - "Copy.status == AVAILABLE"
          - "Reader.status == NORMAL"
          - "Reader.unpaid_fine_cents == 0"
        side_effects:
          - "Create Loan with status=BORROWED, due_at = borrowed_at + Card.loan_duration_days"
          - "Recompute BookTitle.available_copies (decrement by 1)"
          - "Append AuditLog with event_type=LOAN_CREATED"
      - from: ON_LOAN
        to: AVAILABLE
        trigger: "POST /library/loans/{id}/return"
        actor: Reader or Librarian
        preconditions:
          - "Loan.status IN {BORROWED, RENEWED, RECALL_PENDING}"
        side_effects:
          - "Transition Loan to RETURNED (if returned_at <= effective due) or OVERDUE_CLOSED (if late)"
          - "If late, finalize Fine.accrued_cents using fine_accrual_final"
          - "Recompute BookTitle.available_copies (increment by 1)"
          - "If Reservation exists with status=QUEUED for the same BookTitle, transition that reservation head to READY_FOR_PICKUP and Copy.status=RESERVED instead of AVAILABLE"
          - "Recompute Reader.active_loan_count and Reader.status"
          - "Append AuditLog with event_type=LOAN_RETURNED"
      - from: AVAILABLE
        to: RESERVED
        trigger: "Reservation promotion (auto, triggered by Loan return when QUEUED head exists)"
        actor: system
        preconditions:
          - "A Reservation with status=QUEUED exists for the same book_title_id"
        side_effects:
          - "Reservation transitions QUEUED -> READY_FOR_PICKUP with hold_expires_at = now + HOLD_PERIOD_HOURS"
          - "Reservation.held_copy_id set to this Copy.id"
      - from: RESERVED
        to: ON_LOAN
        trigger: "POST /library/loans (with reservation_id) before hold_expires_at"
        actor: Reader or Librarian
        preconditions:
          - "Reservation.status == READY_FOR_PICKUP"
          - "Reservation.hold_expires_at > now"
        side_effects:
          - "Reservation transitions to FULFILLED"
          - "Create Loan as in AVAILABLE->ON_LOAN"
      - from: RESERVED
        to: AVAILABLE
        trigger: "POST /library/_sweep/run (when Reservation.hold_expires_at <= now)"
        actor: system
        preconditions:
          - "Reservation.status == READY_FOR_PICKUP and hold_expires_at <= now"
        side_effects:
          - "Reservation transitions to EXPIRED"
          - "If next QUEUED reservation exists for the same title, promote it; else Copy returns to AVAILABLE"
      - from: AVAILABLE
        to: IN_TRANSIT_ILL
        trigger: "POST /library/ill-requests/{id}/dispatch"
        actor: ILLCoordinator
        preconditions:
          - "ILLRequest.status == APPROVED"
          - "Copy.status == AVAILABLE"
        side_effects:
          - "ILLRequest transitions APPROVED -> IN_TRANSIT, in_transit_from = now"
      - from: IN_TRANSIT_ILL
        to: AVAILABLE
        trigger: "POST /library/ill-requests/{id}/return-received"
        actor: ILLCoordinator
        preconditions:
          - "ILLRequest.status == RETURNED_TRANSIT"
        side_effects:
          - "ILLRequest transitions RETURNED_TRANSIT -> SETTLED, settlement_total_cents computed"
      - from: AVAILABLE
        to: WEEDED
        trigger: "POST /library/copies/{id}/weed"
        actor: Librarian
        preconditions:
          - "Copy.status == AVAILABLE"
          - "weeding_reason is set"
        side_effects:
          - "Recompute BookTitle.total_copies and available_copies"
          - "If all copies of BookTitle are WEEDED, BookTitle.status = WITHDRAWN"

  - entity: Card
    initial_state: ACTIVE
    terminal_states: [EXPIRED, REISSUED]
    transitions:
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /library/cards/{id}/freeze"
        actor: Librarian
        preconditions:
          - "Card.status == ACTIVE"
        side_effects:
          - "Recompute Reader.status (no change unless this was the only active card)"
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /library/cards/{id}/unfreeze"
        actor: Librarian
        preconditions:
          - "Card.status == FROZEN"
        side_effects: []
      - from: ACTIVE
        to: REISSUED
        trigger: "POST /library/cards/{id}/reissue"
        actor: Librarian
        preconditions:
          - "Card.status IN {ACTIVE, FROZEN}"
          - "A successor Card is included in the request body"
        side_effects:
          - "Old card.replaced_by_card_id = new Card.id"
          - "All Loans on the old card retain their card_id but Reader.id is unchanged"
      - from: FROZEN
        to: REISSUED
        trigger: "POST /library/cards/{id}/reissue"
        actor: Librarian
        preconditions:
          - "Card.status == FROZEN"
        side_effects:
          - "Same as ACTIVE -> REISSUED"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /library/_sweep/run (when Card.valid_until <= now)"
        actor: system
        preconditions:
          - "Card.valid_until <= now"
        side_effects:
          - "No effect on existing open Loans (they retain card_id and original due dates)"

  - entity: Loan
    initial_state: BORROWED
    terminal_states: [RETURNED, OVERDUE_CLOSED]
    transitions:
      - from: BORROWED
        to: RENEWED
        trigger: "POST /library/loans/{id}/renew"
        actor: Reader or Librarian
        preconditions:
          - "Loan.status == BORROWED"
          - "Loan.renewals_used < Card.max_renewals"
          - "Loan.is_recalled == false"
          - "Reader.status == NORMAL"
          - "Reader.unpaid_fine_cents == 0"
          - "No active Reservation exists for the BookTitle of Loan.copy_id"
        side_effects:
          - "renewals_used += 1"
          - "due_at = max(now, due_at) + Card.loan_duration_days"
          - "Append AuditLog with event_type=LOAN_RENEWED"
      - from: RENEWED
        to: BORROWED
        trigger: "Internal advance after recompute (auto)"
        actor: system
        preconditions: []
        side_effects:
          - "Status normalizes to BORROWED for next-cycle evaluation"
        note: "Conceptual cycle to allow another renewal before terminal RETURNED"
      - from: BORROWED
        to: RECALL_PENDING
        trigger: "POST /library/loans/{id}/recall"
        actor: Librarian
        preconditions:
          - "Loan.status IN {BORROWED, RENEWED}"
          - "Either an active Reservation exists for the BookTitle, OR Loan is overdue (now > due_at)"
        side_effects:
          - "Loan.is_recalled = true"
          - "recall_due_at = min(due_at, now + RECALL_GRACE_DAYS)"
          - "If Reader had multiple active loans none overdue, Reader.status unchanged; otherwise recomputed"
          - "Append AuditLog with event_type=LOAN_RECALLED"
      - from: RENEWED
        to: RECALL_PENDING
        trigger: "POST /library/loans/{id}/recall"
        actor: Librarian
        preconditions: [ "Same as BORROWED -> RECALL_PENDING" ]
        side_effects: [ "Same as BORROWED -> RECALL_PENDING" ]
      - from: BORROWED
        to: RETURNED
        trigger: "POST /library/loans/{id}/return"
        actor: Reader or Librarian
        preconditions:
          - "Loan.status IN {BORROWED, RENEWED}"
          - "returned_at <= effective_due_at (no fine accrued or fine == 0)"
        side_effects:
          - "Copy.status -> AVAILABLE (then possibly RESERVED via promotion cascade)"
          - "Recompute Reader.status"
      - from: BORROWED
        to: OVERDUE_CLOSED
        trigger: "POST /library/loans/{id}/return"
        actor: Reader or Librarian
        preconditions:
          - "returned_at > effective_due_at (late return)"
        side_effects:
          - "Create or finalize Fine using fine_accrual_final; settlement_status=PENDING"
          - "Copy.status -> AVAILABLE (then possibly RESERVED via promotion cascade)"
          - "Recompute Reader.unpaid_fine_cents and Reader.status"
      - from: RENEWED
        to: RETURNED
        trigger: "POST /library/loans/{id}/return"
        actor: Reader or Librarian
        preconditions: ["Same as BORROWED -> RETURNED"]
        side_effects: ["Same as BORROWED -> RETURNED"]
      - from: RENEWED
        to: OVERDUE_CLOSED
        trigger: "POST /library/loans/{id}/return"
        actor: Reader or Librarian
        preconditions: ["Same as BORROWED -> OVERDUE_CLOSED"]
        side_effects: ["Same as BORROWED -> OVERDUE_CLOSED"]
      - from: RECALL_PENDING
        to: RETURNED
        trigger: "POST /library/loans/{id}/return"
        actor: Reader or Librarian
        preconditions:
          - "returned_at <= recall_due_at"
        side_effects: ["Same as BORROWED -> RETURNED"]
      - from: RECALL_PENDING
        to: OVERDUE_CLOSED
        trigger: "POST /library/loans/{id}/return"
        actor: Reader or Librarian
        preconditions:
          - "returned_at > recall_due_at"
        side_effects: ["Same as BORROWED -> OVERDUE_CLOSED"]

  - entity: Reservation
    initial_state: QUEUED
    terminal_states: [FULFILLED, EXPIRED, CANCELLED]
    transitions:
      - from: QUEUED
        to: READY_FOR_PICKUP
        trigger: "Auto on Copy return (cascade from Loan return) or POST /library/_sweep/run"
        actor: system
        preconditions:
          - "A Copy of book_title_id transitions to AVAILABLE and this Reservation is the queue head"
        side_effects:
          - "held_copy_id set; hold_expires_at = now + HOLD_PERIOD_HOURS"
          - "Copy.status set to RESERVED"
      - from: READY_FOR_PICKUP
        to: FULFILLED
        trigger: "POST /library/loans (with reservation_id)"
        actor: Reader or Librarian
        preconditions:
          - "hold_expires_at > now"
          - "Loan acting card.reader_id == Reservation.reader_id"
        side_effects:
          - "Create Loan on held_copy_id (Copy RESERVED -> ON_LOAN)"
      - from: READY_FOR_PICKUP
        to: EXPIRED
        trigger: "POST /library/_sweep/run"
        actor: system
        preconditions:
          - "hold_expires_at <= now"
        side_effects:
          - "Copy returns to AVAILABLE; if next QUEUED exists, promote it (depth-2 cascade)"
      - from: QUEUED
        to: CANCELLED
        trigger: "DELETE /library/reservations/{id}"
        actor: Reader
        preconditions:
          - "Reservation.status == QUEUED"
        side_effects:
          - "Shift queue_position of trailing QUEUED reservations down by 1"
      - from: READY_FOR_PICKUP
        to: CANCELLED
        trigger: "DELETE /library/reservations/{id}"
        actor: Reader
        preconditions:
          - "Reservation.status == READY_FOR_PICKUP"
        side_effects:
          - "Copy RESERVED -> AVAILABLE then potentially promote next QUEUED"

  - entity: Fine
    initial_state: PENDING
    terminal_states: [SETTLED]
    transitions:
      - from: PENDING
        to: PENDING
        trigger: "POST /library/fines/{id}/waive"
        actor: FineOfficer
        preconditions:
          - "Fine.outstanding_cents > 0"
          - "Waiver reason in {SYSTEM_FAULT, HOLIDAY, HARDSHIP}"
          - "Requested waive_cents <= outstanding_cents"
        side_effects:
          - "waived_cents += waive_cents; outstanding_cents recomputed"
          - "Append AuditLog event_type=FINE_WAIVED with before/after snapshot"
          - "If outstanding_cents == 0 then settlement_status -> SETTLED"
        note: "Self-loop until cumulative waivers + payments cover accrued_cents"
      - from: PENDING
        to: PENDING
        trigger: "POST /library/fines/{id}/pay"
        actor: Reader or FineOfficer
        preconditions:
          - "Fine.outstanding_cents > 0"
          - "pay_cents <= outstanding_cents"
          - "External payment event POSTed to /library/_events/emit with type=PAYMENT_CONFIRMED matching this fine"
        side_effects:
          - "paid_cents += pay_cents; outstanding_cents recomputed"
          - "Append AuditLog event_type=FINE_PAID"
          - "If outstanding_cents == 0 then settlement_status -> SETTLED and recompute Reader.unpaid_fine_cents and Reader.status"
      - from: PENDING
        to: SETTLED
        trigger: "When outstanding_cents reaches 0 via waive or pay (auto)"
        actor: system
        preconditions:
          - "accrued_cents == waived_cents + paid_cents"
        side_effects:
          - "Recompute Reader.unpaid_fine_cents and Reader.status (NORMAL if no other unpaid fines and no overdue loans)"

  - entity: ILLRequest
    initial_state: SUBMITTED
    terminal_states: [SETTLED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /library/ill-requests/{id}/approve"
        actor: ILLCoordinator
        preconditions:
          - "Availability event received via POST /library/_events/emit (type=ILL_AVAILABILITY) with available=true"
          - "ILLRequest.status == SUBMITTED"
        side_effects:
          - "agreed_loan_days = min(event.partner_max_days, 21)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /library/ill-requests/{id}/reject"
        actor: ILLCoordinator
        preconditions:
          - "Availability event received with available=false, OR coordinator decides to reject"
        side_effects: []
      - from: APPROVED
        to: IN_TRANSIT
        trigger: "POST /library/ill-requests/{id}/dispatch"
        actor: ILLCoordinator
        preconditions:
          - "ILLRequest.status == APPROVED"
          - "A Copy of target_marc_control_number exists with status=AVAILABLE"
        side_effects:
          - "Copy.status AVAILABLE -> IN_TRANSIT_ILL"
          - "in_transit_from = now"
      - from: IN_TRANSIT
        to: AT_PARTNER
        trigger: "POST /library/_events/emit (type=ILL_DELIVERED)"
        actor: system
        preconditions:
          - "ILLRequest.status == IN_TRANSIT"
        side_effects: []
      - from: AT_PARTNER
        to: RETURNED_TRANSIT
        trigger: "POST /library/_events/emit (type=ILL_RETURN_INITIATED)"
        actor: system
        preconditions:
          - "ILLRequest.status == AT_PARTNER"
          - "now >= in_transit_from + agreed_loan_days days (closed interval start, exclusive end)"
        side_effects: []
      - from: RETURNED_TRANSIT
        to: SETTLED
        trigger: "POST /library/ill-requests/{id}/return-received"
        actor: ILLCoordinator
        preconditions:
          - "ILLRequest.status == RETURNED_TRANSIT"
        side_effects:
          - "Copy.status IN_TRANSIT_ILL -> AVAILABLE (then potentially RESERVED via cascade)"
          - "in_transit_to = now"
          - "settlement_total_cents finalized via ill_settlement_total"

  - entity: AcquisitionSuggestion
    initial_state: SUBMITTED
    terminal_states: [ACQUIRED, DECLINED, DEFERRED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /library/acquisition-suggestions/{id}/start-review"
        actor: Librarian
        preconditions:
          - "AcquisitionSuggestion.status == SUBMITTED"
        side_effects: []
      - from: UNDER_REVIEW
        to: ACQUIRED
        trigger: "POST /library/acquisition-suggestions/{id}/decide (decision=ACQUIRE)"
        actor: Librarian
        preconditions:
          - "Request body includes new_book_title fields (marc_control_number, isbn matching suggested_isbn, classification_scheme, classification_code, subject_category, acquisition_source)"
        side_effects:
          - "Create BookTitle from request body with acquisition_source"
          - "decision_book_title_id set to new BookTitle.id"
      - from: UNDER_REVIEW
        to: DECLINED
        trigger: "POST /library/acquisition-suggestions/{id}/decide (decision=DECLINE)"
        actor: Librarian
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: DEFERRED
        trigger: "POST /library/acquisition-suggestions/{id}/decide (decision=DEFER)"
        actor: Librarian
        preconditions: []
        side_effects: []
      - from: DEFERRED
        to: UNDER_REVIEW
        trigger: "POST /library/acquisition-suggestions/{id}/start-review"
        actor: Librarian
        preconditions:
          - "AcquisitionSuggestion.status == DEFERRED"
        side_effects: []
        note: "Cycle: deferred items can re-enter review"

  - entity: Reader
    initial_state: NORMAL
    terminal_states: []
    transitions:
      - from: NORMAL
        to: OVERDUE
        trigger: "Auto recompute on Loan transitions or POST /library/_sweep/run"
        actor: system
        preconditions:
          - "At least one Loan with status IN {BORROWED, RENEWED, RECALL_PENDING} has effective_due_at < now"
          - "Reader.status != BLACKLISTED"
        side_effects: []
      - from: OVERDUE
        to: NORMAL
        trigger: "Auto recompute"
        actor: system
        preconditions:
          - "No Loan currently overdue AND Reader.unpaid_fine_cents == 0"
          - "Reader.status != BLACKLISTED"
        side_effects: []
      - from: NORMAL
        to: BLACKLISTED
        trigger: "POST /library/readers/{id}/blacklist"
        actor: Admin
        preconditions: []
        side_effects:
          - "All ACTIVE Cards of this reader transition to FROZEN"
      - from: OVERDUE
        to: BLACKLISTED
        trigger: "POST /library/readers/{id}/blacklist"
        actor: Admin
        preconditions: []
        side_effects:
          - "All ACTIVE Cards of this reader transition to FROZEN"
      - from: BLACKLISTED
        to: NORMAL
        trigger: "POST /library/readers/{id}/unblacklist"
        actor: Admin
        preconditions:
          - "Reader.unpaid_fine_cents == 0"
          - "No Loan in {BORROWED, RENEWED, RECALL_PENDING} is overdue"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two readers attempt to borrow the same RESERVED copy after a reservation hold expires"
    guarantee: "At most one Loan is created on the copy; the loser is rejected with COPY_NOT_AVAILABLE"
    error_id: ERR_COPY_NOT_AVAILABLE
    http_status: 409
    serialization: "First-writer-wins on Copy.status transition to ON_LOAN"

  - scenario: "Renew and recall are issued concurrently on the same loan"
    guarantee: "Exactly one succeeds; if recall wins, renew is rejected with LOAN_RECALLED"
    error_id: ERR_LOAN_RECALLED
    http_status: 409
    serialization: "First-writer-wins on Loan.is_recalled flag"

  - scenario: "Two reservations submitted at exactly the same instant for the last available copy"
    guarantee: "Both are accepted but queue_position is strictly ordered by created_at; if tied, by Reservation.id lexicographic"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "Strict serial assignment of queue_position via created_at then id"

  - scenario: "Pay and waive applied concurrently on the same fine causing over-settlement"
    guarantee: "Each operation re-checks outstanding_cents; the second one is rejected when its requested amount exceeds the current outstanding"
    error_id: ERR_FINE_OVERPAYMENT
    http_status: 409
    serialization: "First-writer-wins on Fine.outstanding_cents update"

  - scenario: "Card freeze applied while a loan request on that card is in-flight"
    guarantee: "Loan creation is rejected if the card has transitioned to FROZEN before its commit"
    error_id: ERR_CARD_NOT_ACTIVE
    http_status: 409
    serialization: "Loan creation re-reads Card.status at commit"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: fine_accrual_provisional
    trigger: "Read endpoint GET /library/loans/{id} or GET /library/fines/{id} while Loan is in BORROWED/RENEWED/RECALL_PENDING"
    algorithm: chronological
    formula: |
      effective_due = recall_due_at if is_recalled else due_at
      if now <= effective_due:
        return 0
      days_overdue = ceil((now - effective_due) / 1 day)
      raw_amount = days_overdue * daily_rate_cents
      return min(raw_amount, fine_cap_cents)
    input_set: "A single Loan that is not yet RETURNED/OVERDUE_CLOSED; uses live now() so the same Loan returns different values at different read times."
    constants:
      DAILY_RATE_GENERAL_CENTS: 20
      DAILY_RATE_REFERENCE_CENTS: 50
      DAILY_RATE_CHILDREN_CENTS: 10
      DAILY_RATE_RARE_CENTS: 200
      CAP_GENERAL_CENTS: 5000
      CAP_REFERENCE_CENTS: 10000
      CAP_CHILDREN_CENTS: 2000
      CAP_RARE_CENTS: 50000
    precision: "Integer cents; ceil on days; no rounding required (all-integer)"
    variants:
      - name: with_clock_advance
        when: "Clock has been advanced via POST /library/_clock/advance"
        difference: "now() reflects the simulated clock so days_overdue is deterministic"

  - name: fine_accrual_final
    trigger: "Loan transitions BORROWED/RENEWED/RECALL_PENDING -> OVERDUE_CLOSED via POST /library/loans/{id}/return"
    algorithm: chronological
    formula: |
      effective_due = recall_due_at if is_recalled else due_at
      days_overdue = ceil((returned_at - effective_due) / 1 day)
      if days_overdue <= 0:
        Fine is NOT created
      else:
        raw_amount = days_overdue * daily_rate_cents
        Fine.accrued_cents = min(raw_amount, fine_cap_cents)
    input_set: "A single Loan at the moment of return; uses returned_at (a fixed timestamp) rather than now(), so the result is permanent."
    constants: { reuses fine_accrual_provisional constants }
    precision: "Integer cents; ceil on days; capped before storage"
    variants:
      - name: from_recalled
        when: "Loan.is_recalled == true"
        difference: "Uses recall_due_at instead of due_at, generally producing a HIGHER days_overdue than the provisional reading taken right before recall"
    note: "DUAL-VARIANT vs fine_accrual_provisional: both run the same arithmetic shape, but provisional uses live now() against the current effective_due, while final uses returned_at. For an identical loan read first at T1=due+3d then returned at T2=due+5d, provisional returned 3*rate, final stores 5*rate. The provisional value is never persisted; the final value is."

  - name: ill_settlement_total
    trigger: "ILLRequest transitions RETURNED_TRANSIT -> SETTLED via POST /library/ill-requests/{id}/return-received"
    algorithm: aggregation
    formula: |
      # Two legs: outbound + inbound. Per-leg components are rounded to whole cents
      # BEFORE summation. Each leg = round_half_up(shipping_cost_cents + handling_fee_cents + insurance, 0).
      # insurance = round_half_up(shipping_cost_cents * INSURANCE_RATE_BPS / 10000, 0)
      # settlement_total_cents = leg_outbound + leg_inbound
      INSURANCE_RATE_BPS = 250  # 2.50%
      insurance = round_half_up(shipping_cost_cents * 250 / 10000)
      per_leg = round_half_up(shipping_cost_cents + handling_fee_cents + insurance)
      settlement_total_cents = per_leg + per_leg   # symmetric two legs
    input_set: "One ILLRequest at the moment its return is received."
    constants:
      INSURANCE_RATE_BPS: 250
      LEGS: 2
    precision: "Round HALF_UP per-leg then sum (NOT sum-then-round). Integer cents."
    variants: []
    note: "COMBINATORIAL-FORMULA mode (b): nested rounding where order matters. round-per-leg-then-sum != round(sum-of-legs)."

  - name: borrowing_quota_remaining_strict
    trigger: "GET /library/cards/{id}/quota?mode=strict — used to decide whether a new POST /library/loans should be allowed"
    algorithm: forward_looking
    formula: |
      committed = count(Loan where card_id == Card.id and status IN {BORROWED, RENEWED, RECALL_PENDING})
      reserved = count(Reservation where reader_id == Card.reader_id and status IN {QUEUED, READY_FOR_PICKUP})
      remaining = Card.max_loans - committed - reserved
      return max(0, remaining)
    input_set: "Active loans on this card + active reservations on this reader."
    constants: {}
    precision: "Integer"
    variants:
      - name: chronological
        when: "GET /library/cards/{id}/quota?mode=chronological"
        difference: "Only counts loans (no reservation reserve). remaining = Card.max_loans - committed. Used by audit/report views, not by enforcement."
    note: "DUAL-VARIANT: strict (forward-looking, includes reservations) vs chronological (only committed loans). For a card with max_loans=5, 3 active loans, and 1 active reservation, strict=1 and chronological=2. POST /library/loans uses STRICT."

  - name: reader_status_recompute
    trigger: "Any Loan transition, any Fine transition, or POST /library/_sweep/run"
    algorithm: aggregation
    formula: |
      if Reader.status == BLACKLISTED:
        return BLACKLISTED
      has_overdue = exists(Loan where reader_id == Reader.id
                          and status IN {BORROWED, RENEWED, RECALL_PENDING}
                          and effective_due_at < now)
      has_unpaid = exists(Fine where reader_id == Reader.id and settlement_status == PENDING and outstanding_cents > 0)
      if has_overdue or has_unpaid:
        return OVERDUE
      return NORMAL
    input_set: "All non-terminal Loans and all PENDING Fines for the reader, at the time of recompute."
    constants: {}
    precision: "Boolean derivation; deterministic"
    variants: []

  - name: reservation_priority_assignment
    trigger: "POST /library/reservations creation; also on cascade from Reservation EXPIRED"
    algorithm: chronological
    formula: |
      candidates = Reservations where book_title_id == X and status == QUEUED
      sort ascending by (created_at, id)
      queue_position = index of new reservation + 1 (1-indexed)
    input_set: "Queued reservations on the same BookTitle."
    constants: {}
    precision: "Integer; tie-break on id lexicographic"
    variants: []

  - name: title_copy_aggregates
    trigger: "Any Copy transition (create, status change, weed) or BookTitle creation"
    algorithm: aggregation
    formula: |
      total_copies = count(Copy where book_title_id == X and status != WEEDED) + count(Copy where status == WEEDED)
                   = count(Copy where book_title_id == X)
      available_copies = count(Copy where book_title_id == X and status == AVAILABLE)
    input_set: "All Copy rows for the title."
    constants: {}
    precision: "Integer counts"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is one of Reader, Librarian, FineOfficer, ILLCoordinator, Admin"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role permitted for this endpoint per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "Reader-role requests on resources keyed to a reader must satisfy X-User-ID == Reader.id (or Reader.id of the acting Card)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "Reader endpoints"

  - priority: 4
    category: existence
    check: "All path-referenced resources exist (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: existence
    check: "All body-referenced foreign keys (book_title_id, copy_id, card_id, reservation_id, etc.) resolve to existing records"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all mutations referencing FKs"

  - priority: 6
    category: state
    check: "If request body includes 'version', it must match the resource's current version (OCC)"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all mutations with version field"

  - priority: 7
    category: state
    check: "Target resource is in a state from which the requested transition is declared in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 8
    category: state
    check: "Copy must be in the state required by the transition (e.g., AVAILABLE for loan creation; RESERVED for reservation-pickup loan; AVAILABLE for ILL dispatch)"
    error_id: ERR_COPY_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /library/loans, POST /library/ill-requests/{id}/dispatch, POST /library/copies/{id}/weed"

  - priority: 9
    category: state
    check: "Card.status must be ACTIVE for new loan/renew/reserve operations"
    error_id: ERR_CARD_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /library/loans, POST /library/loans/{id}/renew, POST /library/reservations"

  - priority: 10
    category: state
    check: "Reader.identity_verified must be true for Card issuance"
    error_id: ERR_IDENTITY_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /library/readers/{id}/cards"

  - priority: 11
    category: business_safety
    check: "Reader.status must be NORMAL for new loan/renew (BLACKLISTED rejects unconditionally)"
    error_id: ERR_READER_BLACKLISTED
    http_status: 409
    applies_to: "POST /library/loans, POST /library/loans/{id}/renew"

  - priority: 12
    category: business_fiscal
    check: "Reader.unpaid_fine_cents must equal 0 for new loan or renewal"
    error_id: ERR_UNPAID_FINE
    http_status: 409
    applies_to: "POST /library/loans, POST /library/loans/{id}/renew"

  - priority: 13
    category: business_constraint
    check: "borrowing_quota_remaining_strict(card) > 0 at the moment of loan creation"
    error_id: ERR_QUOTA_EXCEEDED
    http_status: 409
    applies_to: "POST /library/loans"

  - priority: 14
    category: business_constraint
    check: "Loan.renewals_used < Card.max_renewals for renewal"
    error_id: ERR_RENEWAL_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /library/loans/{id}/renew"

  - priority: 15
    category: business_referential
    check: "No active Reservation exists for the BookTitle of this loan when attempting renewal"
    error_id: ERR_RESERVATION_BLOCKS_RENEWAL
    http_status: 409
    applies_to: "POST /library/loans/{id}/renew"

  - priority: 16
    category: business_constraint
    check: "Renew rejected if Loan.is_recalled == true"
    error_id: ERR_LOAN_RECALLED
    http_status: 409
    applies_to: "POST /library/loans/{id}/renew"

  - priority: 17
    category: business_temporal
    check: "Reservation pickup must occur before hold_expires_at; otherwise loan creation is rejected"
    error_id: ERR_HOLD_EXPIRED
    http_status: 409
    applies_to: "POST /library/loans with reservation_id"

  - priority: 18
    category: business_fiscal
    check: "Fine waiver: requested waive_cents <= Fine.outstanding_cents and reason in {SYSTEM_FAULT, HOLIDAY, HARDSHIP}"
    error_id: ERR_INVALID_WAIVER
    http_status: 422
    applies_to: "POST /library/fines/{id}/waive"

  - priority: 19
    category: business_fiscal
    check: "Fine payment: pay_cents <= Fine.outstanding_cents AND matching PAYMENT_CONFIRMED event exists (idempotency_key matches)"
    error_id: ERR_FINE_OVERPAYMENT
    http_status: 409
    applies_to: "POST /library/fines/{id}/pay"

  - priority: 20
    category: business_referential
    check: "ILL partner_library_code must be in {PL_A, PL_B, PL_C}"
    error_id: ERR_UNKNOWN_PARTNER
    http_status: 422
    applies_to: "POST /library/ill-requests"

  - priority: 21
    category: business_temporal
    check: "ILL return-received cannot precede AT_PARTNER + agreed_loan_days (closed start, exclusive end interval semantics on ILLRequest)"
    error_id: ERR_ILL_LOAN_PERIOD_NOT_MET
    http_status: 409
    applies_to: "POST /library/ill-requests/{id}/return-received"

  - priority: 22
    category: business_referential
    check: "Reservation: reader cannot reserve a BookTitle for which they already have an active Reservation or active Loan"
    error_id: ERR_DUPLICATE_RESERVATION
    http_status: 409
    applies_to: "POST /library/reservations"

  - priority: 23
    category: business_constraint
    check: "BookTitle creation: marc_control_number unique, isbn 13 digits, classification_scheme in {DEWEY, CLC}, subject_category in enum set"
    error_id: ERR_INVALID_INPUT
    http_status: 422
    applies_to: "POST /library/book-titles, POST /library/acquisition-suggestions/{id}/decide (decision=ACQUIRE)"

  - priority: 24
    category: business_constraint
    check: "Copy.barcode unique; location_code non-empty"
    error_id: ERR_INVALID_INPUT
    http_status: 422
    applies_to: "POST /library/book-titles/{id}/copies"

  - priority: 25
    category: business_constraint
    check: "Card validity: valid_from < valid_until; card_type in enum set"
    error_id: ERR_INVALID_INPUT
    http_status: 422
    applies_to: "POST /library/readers/{id}/cards"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------- Bibliographic / Copies ----------
  - method: POST
    path: "/library/book-titles"
    description: "Catalog a new bibliographic record (MARC entry)"
    roles: [Librarian]
    code: 201
    input: [marc_control_number, isbn, title, author, publisher, publication_year, classification_scheme, classification_code, subject_category, acquisition_source]
    output: BookTitle
    side_effects: []

  - method: GET
    path: "/library/book-titles"
    description: "List/search bibliographic records"
    roles: [Reader, Librarian, FineOfficer, ILLCoordinator, Admin]
    code: 200
    input: ["limit?", "offset?", "classification_scheme?", "subject_category?", "search?"]
    output: BookTitle[]
    side_effects: []

  - method: GET
    path: "/library/book-titles/{id}"
    description: "Get a bibliographic record"
    roles: [Reader, Librarian, FineOfficer, ILLCoordinator, Admin]
    code: 200
    input: []
    output: BookTitle
    side_effects: []

  - method: POST
    path: "/library/book-titles/{id}/copies"
    description: "Add a physical copy under a title"
    roles: [Librarian]
    code: 201
    input: [barcode, location_code, acquisition_source, acquired_at]
    output: Copy
    side_effects: ["title_copy_aggregates recompute"]

  - method: GET
    path: "/library/book-titles/{id}/copies"
    description: "List copies of a title"
    roles: [Reader, Librarian, FineOfficer, ILLCoordinator, Admin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Copy[]
    side_effects: []

  - method: POST
    path: "/library/copies/{id}/weed"
    description: "Weed (withdraw) a copy"
    roles: [Librarian]
    code: 200
    input: [weeding_reason, "version?"]
    output: Copy
    side_effects: ["title_copy_aggregates recompute", "BookTitle status -> WITHDRAWN if all copies WEEDED"]

  # ---------- Readers / Cards ----------
  - method: POST
    path: "/library/readers"
    description: "Register a reader"
    roles: [Librarian]
    code: 201
    input: [national_id_hash, full_name]
    output: Reader
    side_effects: []

  - method: GET
    path: "/library/readers/{id}"
    description: "Get a reader"
    roles: [Reader, Librarian, FineOfficer, ILLCoordinator, Admin]
    code: 200
    input: []
    output: Reader
    side_effects: []

  - method: POST
    path: "/library/readers/{id}/cards"
    description: "Issue a new card to a verified reader"
    roles: [Librarian]
    code: 201
    input: [card_type, valid_from, valid_until]
    output: Card
    side_effects: ["Server mints card_number; computed quota/duration/renewals applied"]

  - method: POST
    path: "/library/cards/{id}/freeze"
    description: "Freeze a card"
    roles: [Librarian]
    code: 200
    input: ["version?"]
    output: Card
    side_effects: []

  - method: POST
    path: "/library/cards/{id}/unfreeze"
    description: "Unfreeze a card"
    roles: [Librarian]
    code: 200
    input: ["version?"]
    output: Card
    side_effects: []

  - method: POST
    path: "/library/cards/{id}/reissue"
    description: "Issue a successor card; replaces this one"
    roles: [Librarian]
    code: 201
    input: [card_type, valid_from, valid_until, "version?"]
    output: Card
    side_effects: ["Old card.status -> REISSUED, replaced_by_card_id set to new card"]

  - method: POST
    path: "/library/readers/{id}/blacklist"
    description: "Blacklist a reader"
    roles: [Admin]
    code: 200
    input: [reason, "version?"]
    output: Reader
    side_effects: ["All ACTIVE Cards transition to FROZEN; recompute Reader.status -> BLACKLISTED"]

  - method: POST
    path: "/library/readers/{id}/unblacklist"
    description: "Lift blacklist; reader returns to NORMAL/OVERDUE per recompute"
    roles: [Admin]
    code: 200
    input: ["version?"]
    output: Reader
    side_effects: ["reader_status_recompute"]

  # ---------- Loans / Renew / Recall / Return ----------
  - method: POST
    path: "/library/loans"
    description: "Borrow a copy (counter or kiosk); optional reservation_id to fulfill a reservation"
    roles: [Reader, Librarian]
    code: 201
    input: [copy_id, card_id, channel, "reservation_id?"]
    output: Loan
    side_effects:
      - "Copy AVAILABLE/RESERVED -> ON_LOAN"
      - "If reservation_id present, Reservation READY_FOR_PICKUP -> FULFILLED"
      - "title_copy_aggregates recompute"
      - "reader_status_recompute"
      - "AuditLog LOAN_CREATED"

  - method: GET
    path: "/library/loans/{id}"
    description: "Get a loan (includes provisional fine via fine_accrual_provisional)"
    roles: [Reader, Librarian, FineOfficer, Admin]
    code: 200
    input: []
    output: Loan
    side_effects: []

  - method: POST
    path: "/library/loans/{id}/renew"
    description: "Renew a loan; re-enters BORROWED with extended due_at"
    roles: [Reader, Librarian]
    code: 200
    input: ["version?"]
    output: Loan
    side_effects: ["AuditLog LOAN_RENEWED"]

  - method: POST
    path: "/library/loans/{id}/recall"
    description: "Recall an outstanding loan"
    roles: [Librarian]
    code: 200
    input: [reason, "version?"]
    output: Loan
    side_effects: ["Loan.is_recalled=true; recall_due_at set; reader_status_recompute; AuditLog LOAN_RECALLED"]

  - method: POST
    path: "/library/loans/{id}/return"
    description: "Return a loan; if late, finalizes a Fine"
    roles: [Reader, Librarian]
    code: 200
    input: ["returned_at?", "version?"]
    output: Loan
    side_effects:
      - "Loan -> RETURNED or OVERDUE_CLOSED"
      - "Copy -> AVAILABLE (or RESERVED via promotion cascade)"
      - "If late, fine_accrual_final creates Fine"
      - "title_copy_aggregates recompute"
      - "reader_status_recompute"
      - "AuditLog LOAN_RETURNED"

  # ---------- Reservations ----------
  - method: POST
    path: "/library/reservations"
    description: "Create a reservation for a title (online or on-site)"
    roles: [Reader, Librarian]
    code: 201
    input: [book_title_id, card_id, channel]
    output: Reservation
    side_effects:
      - "reservation_priority_assignment sets queue_position"
      - "If a Copy of the title is currently AVAILABLE and this reservation becomes head, cascade Copy AVAILABLE -> RESERVED and Reservation QUEUED -> READY_FOR_PICKUP"

  - method: GET
    path: "/library/reservations/{id}"
    description: "Get a reservation"
    roles: [Reader, Librarian, Admin]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: DELETE
    path: "/library/reservations/{id}"
    description: "Cancel a reservation"
    roles: [Reader, Librarian]
    code: 200
    input: ["version?"]
    output: Reservation
    side_effects: ["If was READY_FOR_PICKUP, Copy RESERVED -> AVAILABLE then promote next QUEUED"]

  # ---------- Fines ----------
  - method: GET
    path: "/library/fines/{id}"
    description: "Get a fine (PENDING/SETTLED)"
    roles: [Reader, FineOfficer, Admin]
    code: 200
    input: []
    output: Fine
    side_effects: []

  - method: POST
    path: "/library/fines/{id}/pay"
    description: "Apply payment to a fine"
    roles: [Reader, FineOfficer]
    code: 200
    input: [pay_cents, idempotency_key, "version?"]
    output: Fine
    side_effects: ["If outstanding reaches 0, settlement_status -> SETTLED; reader_status_recompute; AuditLog FINE_PAID"]

  - method: POST
    path: "/library/fines/{id}/waive"
    description: "Apply a waiver to a fine"
    roles: [FineOfficer]
    code: 200
    input: [waive_cents, reason, "version?"]
    output: Fine
    side_effects: ["If outstanding reaches 0, settlement_status -> SETTLED; reader_status_recompute; AuditLog FINE_WAIVED"]

  # ---------- Inter-Library Loan ----------
  - method: POST
    path: "/library/ill-requests"
    description: "Submit an inter-library loan request"
    roles: [Reader, Librarian, ILLCoordinator]
    code: 201
    input: [card_id, partner_library_code, target_marc_control_number, shipping_cost_cents]
    output: ILLRequest
    side_effects: []

  - method: POST
    path: "/library/ill-requests/{id}/approve"
    description: "Approve an ILL request after availability event"
    roles: [ILLCoordinator]
    code: 200
    input: ["version?"]
    output: ILLRequest
    side_effects: []

  - method: POST
    path: "/library/ill-requests/{id}/reject"
    description: "Reject an ILL request"
    roles: [ILLCoordinator]
    code: 200
    input: [reason, "version?"]
    output: ILLRequest
    side_effects: []

  - method: POST
    path: "/library/ill-requests/{id}/dispatch"
    description: "Dispatch a local Copy to the partner library"
    roles: [ILLCoordinator]
    code: 200
    input: [copy_id, "version?"]
    output: ILLRequest
    side_effects: ["Copy AVAILABLE -> IN_TRANSIT_ILL; in_transit_from set"]

  - method: POST
    path: "/library/ill-requests/{id}/return-received"
    description: "Receive the returning ILL copy and settle"
    roles: [ILLCoordinator]
    code: 200
    input: ["version?"]
    output: ILLRequest
    side_effects: ["Copy IN_TRANSIT_ILL -> AVAILABLE; ill_settlement_total computed; settlement_status SETTLED"]

  # ---------- Acquisition Suggestions ----------
  - method: POST
    path: "/library/acquisition-suggestions"
    description: "Submit an acquisition suggestion"
    roles: [Reader]
    code: 201
    input: [card_id, suggested_isbn, suggested_title, rationale]
    output: AcquisitionSuggestion
    side_effects: []

  - method: POST
    path: "/library/acquisition-suggestions/{id}/start-review"
    description: "Move a suggestion into review (SUBMITTED or DEFERRED -> UNDER_REVIEW)"
    roles: [Librarian]
    code: 200
    input: ["version?"]
    output: AcquisitionSuggestion
    side_effects: []

  - method: POST
    path: "/library/acquisition-suggestions/{id}/decide"
    description: "Decide a suggestion (ACQUIRE/DECLINE/DEFER)"
    roles: [Librarian]
    code: 200
    input: [decision, "review_notes?", "new_book_title?", "version?"]
    output: AcquisitionSuggestion
    side_effects: ["If decision=ACQUIRE, create BookTitle and link decision_book_title_id"]

  - method: GET
    path: "/library/acquisition-suggestions/stats"
    description: "Suggestion-to-acquisition statistics"
    roles: [Librarian, Admin]
    code: 200
    input: []
    output: object
    side_effects: []

  # ---------- Audit log read ----------
  - method: GET
    path: "/library/audit-logs"
    description: "Read audit log entries (loans + fines focus)"
    roles: [Admin]
    code: 200
    input: ["limit?", "offset?", "event_type?", "subject_id?"]
    output: AuditLog[]
    side_effects: []

  # ---------- Quota inspection ----------
  - method: GET
    path: "/library/cards/{id}/quota"
    description: "Inspect borrowing quota in strict (default) or chronological mode"
    roles: [Reader, Librarian]
    code: 200
    input: ["mode?"]
    output: object
    side_effects: []

  # ---------- Test-driving endpoints (REQUIRED for testability of time/system events) ----------
  - method: POST
    path: "/library/_clock/advance"
    description: "Advance the simulated clock by a duration to enable time-gated transitions"
    roles: [Admin]
    code: 200
    input: [iso_duration]
    output: object
    side_effects: ["Subsequent calls observe the new now() for fine_accrual_*, Card.valid_until expiry, hold_expires_at expiry, etc."]

  - method: POST
    path: "/library/_sweep/run"
    description: "Run the periodic ops sweep (reservation expiry, card expiry, reader_status_recompute)"
    roles: [Admin]
    code: 200
    input: []
    output: object
    side_effects:
      - "Expire Reservations whose hold_expires_at <= now (promote next QUEUED in cascade)"
      - "Expire Cards whose valid_until <= now"
      - "Recompute Reader.status for all readers"

  - method: POST
    path: "/library/_events/emit"
    description: "Emit an inbound external event (payment, identity verification, ILL platform)"
    roles: [Admin]
    code: 200
    input: [event_type, payload]
    output: object
    side_effects:
      - "type=PAYMENT_CONFIRMED: enables a subsequent POST /library/fines/{id}/pay with matching idempotency_key"
      - "type=IDENTITY_VERIFIED: sets Reader.identity_verified=true and identity_verified_at"
      - "type=ILL_AVAILABILITY: provides availability decision and partner_max_days for a pending ILLRequest"
      - "type=ILL_DELIVERED: advances ILLRequest IN_TRANSIT -> AT_PARTNER"
      - "type=ILL_RETURN_INITIATED: advances ILLRequest AT_PARTNER -> RETURNED_TRANSIT (gated by loan-period elapsed)"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "Missing X-User-Role or X-User-ID headers"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for the endpoint, or Reader acting on someone else's resource"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path or body resource id not found"
  - id: ERR_INVALID_INPUT
    http: 422
    condition: "Malformed input (missing fields, enum mismatch, range violation, etc.)"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "OCC version mismatch on a mutation"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Transition not declared from the resource's current state"
  - id: ERR_COPY_NOT_AVAILABLE
    http: 409
    condition: "Copy not in the required state for the operation (e.g., AVAILABLE for borrow / ILL dispatch)"
  - id: ERR_CARD_NOT_ACTIVE
    http: 409
    condition: "Card.status != ACTIVE when borrow/renew/reserve attempted"
  - id: ERR_IDENTITY_NOT_VERIFIED
    http: 409
    condition: "Reader.identity_verified == false when issuing a Card"
  - id: ERR_READER_BLACKLISTED
    http: 409
    condition: "Reader.status == BLACKLISTED for any borrowing operation"
  - id: ERR_UNPAID_FINE
    http: 409
    condition: "Reader.unpaid_fine_cents > 0 for borrowing or renewal"
  - id: ERR_QUOTA_EXCEEDED
    http: 409
    condition: "borrowing_quota_remaining_strict <= 0"
  - id: ERR_RENEWAL_LIMIT_REACHED
    http: 409
    condition: "Loan.renewals_used >= Card.max_renewals"
  - id: ERR_RESERVATION_BLOCKS_RENEWAL
    http: 409
    condition: "Active Reservation exists for the BookTitle of the loan being renewed"
  - id: ERR_LOAN_RECALLED
    http: 409
    condition: "Renew attempted on a Loan with is_recalled == true; also concurrency loser when recall wins"
  - id: ERR_HOLD_EXPIRED
    http: 409
    condition: "Reservation.hold_expires_at <= now at pickup time"
  - id: ERR_INVALID_WAIVER
    http: 422
    condition: "Bad waive_cents or invalid reason"
  - id: ERR_FINE_OVERPAYMENT
    http: 409
    condition: "pay_cents/waive_cents exceeds Fine.outstanding_cents (also concurrency loser on simultaneous pay+waive)"
  - id: ERR_UNKNOWN_PARTNER
    http: 422
    condition: "ILLRequest.partner_library_code not in approved list"
  - id: ERR_ILL_LOAN_PERIOD_NOT_MET
    http: 409
    condition: "Return-received called before AT_PARTNER + agreed_loan_days has elapsed"
  - id: ERR_DUPLICATE_RESERVATION
    http: 409
    condition: "Reader already has an active Reservation or active Loan for the same BookTitle"
  - id: ERR_PAYMENT_EVENT_MISSING
    http: 409
    condition: "POST /library/fines/{id}/pay called without a matching PAYMENT_CONFIRMED event for the idempotency_key"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Reader
    description: "Library patron acting as themselves via a card"
    identity: "entity_backed:Reader"
    exclusive_operations:
      - "POST /library/acquisition-suggestions"
    shared_operations:
      - "GET /library/book-titles[/{id}][/copies]"
      - "POST /library/loans (own card)"
      - "POST /library/loans/{id}/renew (own loan)"
      - "POST /library/loans/{id}/return (own loan)"
      - "POST /library/reservations (own card)"
      - "DELETE /library/reservations/{id} (own)"
      - "POST /library/fines/{id}/pay (own fines)"
      - "POST /library/ill-requests (own card)"
      - "GET /library/loans/{id}, GET /library/reservations/{id}, GET /library/fines/{id} (own)"
      - "GET /library/cards/{id}/quota (own)"

  - name: Librarian
    description: "Library staff handling cataloging, circulation, suggestions"
    identity: "opaque"
    exclusive_operations:
      - "POST /library/book-titles"
      - "POST /library/book-titles/{id}/copies"
      - "POST /library/copies/{id}/weed"
      - "POST /library/readers"
      - "POST /library/readers/{id}/cards"
      - "POST /library/cards/{id}/freeze"
      - "POST /library/cards/{id}/unfreeze"
      - "POST /library/cards/{id}/reissue"
      - "POST /library/loans/{id}/recall"
      - "POST /library/acquisition-suggestions/{id}/start-review"
      - "POST /library/acquisition-suggestions/{id}/decide"
      - "GET /library/acquisition-suggestions/stats"
    shared_operations:
      - "POST /library/loans (any card)"
      - "POST /library/loans/{id}/renew (any loan)"
      - "POST /library/loans/{id}/return (any loan)"
      - "POST /library/reservations (any card)"
      - "DELETE /library/reservations/{id} (any)"
      - "POST /library/ill-requests"
      - "GET /library/* read endpoints"

  - name: FineOfficer
    description: "Staff responsible for fine waiver and payment workflow"
    identity: "opaque"
    exclusive_operations:
      - "POST /library/fines/{id}/waive"
    shared_operations:
      - "POST /library/fines/{id}/pay"
      - "GET /library/fines/{id}"
      - "GET /library/book-titles, GET /library/loans/{id}"

  - name: ILLCoordinator
    description: "Inter-library loan coordinator"
    identity: "opaque"
    exclusive_operations:
      - "POST /library/ill-requests/{id}/approve"
      - "POST /library/ill-requests/{id}/reject"
      - "POST /library/ill-requests/{id}/dispatch"
      - "POST /library/ill-requests/{id}/return-received"
    shared_operations:
      - "POST /library/ill-requests"
      - "GET /library/* read endpoints"

  - name: Admin
    description: "Administrative role; owns blacklist, sweeps, clock, events, and audit log"
    identity: "opaque"
    exclusive_operations:
      - "POST /library/readers/{id}/blacklist"
      - "POST /library/readers/{id}/unblacklist"
      - "GET /library/audit-logs"
      - "POST /library/_clock/advance"
      - "POST /library/_sweep/run"
      - "POST /library/_events/emit"
    shared_operations:
      - "GET /library/* read endpoints"
