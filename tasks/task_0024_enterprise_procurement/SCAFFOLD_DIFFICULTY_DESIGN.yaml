scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: quote_scoring_pool_relative_vs_incremental
        grounds:
          - calculations.quote_composite_score
          - state_machines.Quote.SUBMITTED_to_SHORTLISTED
          - endpoints["POST /requirements/{id}/quotes"]
          - endpoints["POST /requirements/{id}/shortlist"]
        distinguishing_aspect: |
          Operates on the Quote entity domain — same input pool can produce two
          different stored composite_score values: incremental_recompute (each
          POST /quotes recomputes pool-relative commercial scores) vs pool_relative
          (POST /shortlist recomputes again across the SUBMITTED pool, overwriting
          earlier stored values for unchanged inputs when the pool composition
          changed in between).
        test_recipe:
          setup:
            - "Create BudgetAccount, three QUALIFIED Suppliers in IT_HARDWARE, Requirement (qty=10) submitted"
            - "POST quote A (price=100, tech=80) → pool {A}, A.commercial=100.00, A.composite=92.00"
            - "POST quote B (price=140, tech=60) → pool {A,B}, A.commercial=100.00, A.composite=92.00; B.commercial=0.00, B.composite=24.00"
          trigger:
            - "POST quote C (price=120, tech=70) → triggers incremental_recompute over pool {A,B,C}"
            - "POST /requirements/{id}/shortlist with quote_ids=[A,B,C] → triggers pool_relative variant"
          assert:
            - "After incremental_recompute: A.commercial_score == 100.00, B.commercial_score == 0.00, C.commercial_score == 50.00"
            - "After incremental_recompute: A.composite_score == 92.00, B.composite_score == 24.00, C.composite_score == 58.00"
            - "After pool_relative shortlist: stored composite_score values unchanged (idempotent), but variants differ in trigger and stored algorithm tag"

      - name: three_way_match_strict_vs_gm_override
        grounds:
          - calculations.three_way_match
          - state_machines.Invoice.SUBMITTED_to_EXCEPTION
          - state_machines.Invoice.EXCEPTION_to_MATCHED
          - endpoints["POST /invoices/{id}/match"]
          - endpoints["POST /invoices/{id}/override"]
        distinguishing_aspect: |
          Operates on the Invoice entity domain (different domain than quote_scoring).
          Same Invoice/PO/Receipt inputs produce two different matching_result
          outcomes: strict_match_finance enforces QTY_TOLERANCE_PCT=0.02 and
          AMT_TOLERANCE_PCT=0.01 and routes to EXCEPTION on miss; gm_override_match
          bypasses thresholds and stamps matching_result.override_by.
        test_recipe:
          setup:
            - "PO with total_amount_cents=11300, requirement.quantity=10 (per-unit=1130 cents)"
            - "Receipt fully ACCEPTED: accepted_quantity=10"
            - "Invoice submitted: invoiced_quantity=9, invoiced_amount_cents=10170, tax_amount_cents=1170, tax_rate_declared=0.13"
          trigger:
            - "POST /invoices/{id}/match → strict variant runs: qty_delta_pct=0.10 > 0.02 → EXCEPTION"
            - "POST /invoices/{id}/override with justification → gm_override_match runs"
          assert:
            - "After /match: Invoice.status == 'EXCEPTION' AND Invoice.matching_result.quantity_match == false"
            - "After /override: Invoice.status == 'MATCHED' AND Invoice.matching_result.override_by is set"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes (a/b/c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: quote_composite_score_mode_a_nonlinear
        grounds:
          - calculations.quote_composite_score
        distinguishing_aspect: |
          Mode (a): formula has 4 inputs (technical_score, unit_price_cents,
          pool min_price, pool max_price) with non-linear interaction —
          commercial score is a pool-relative ratio that depends on min/max
          across siblings, then weighted-summed with technical via W_TECH=0.40
          and W_COMM=0.60. Different pool compositions yield different commercial
          scores for the same unit_price_cents.
        test_recipe:
          setup:
            - "Requirement with 3 SUBMITTED quotes priced 100,120,140 cents and tech 80,70,60"
          trigger:
            - "POST /requirements/{id}/shortlist with all three quotes"
          assert:
            - "Quote(price=100).composite_score == 92.00"
            - "Quote(price=120).composite_score == 58.00"
            - "Quote(price=140).composite_score == 24.00"

      - name: payment_schedule_installment_remainder_mode_b
        grounds:
          - calculations.payment_schedule_generation
          - state_machines.Contract.AWAITING_SIGNATURE_to_EXECUTED
          - endpoints["POST /contracts/{id}/sign"]
          - endpoints["GET /purchase-orders/{id}/payment-schedule"]
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — INSTALLMENT terms with
          total_cents that does not divide cleanly by 100 produce different sums
          if you round each installment independently vs. floor-then-residual.
          The scaffold pins floor((total*percent)/100) per installment with the
          LAST installment absorbing the cents remainder so sum equals total.
        test_recipe:
          setup:
            - "Approved PO with total_amount_cents=10001, INSTALLMENT contract with schedule=[{percent:30,offset_days:0},{percent:70,offset_days:30}]"
          trigger:
            - "Buyer and Supplier sign → Contract -> EXECUTED → payment_schedule_generation runs"
          assert:
            - "PaymentSchedule[0].amount_cents == 3000"   # floor(10001*30/100)
            - "PaymentSchedule[1].amount_cents == 7001"   # remainder
            - "sum(amount_cents) == 10001"

      - name: po_tier_assignment_mode_c_pinned_order
        grounds:
          - calculations.po_tier_assignment
          - state_machines.Requirement.IN_SOURCING_to_AWARDED
          - endpoints["POST /requirements/{id}/award"]
        distinguishing_aspect: |
          Mode (c): circular-looking dependency made well-defined by pinned
          evaluation order. PO.total_amount_cents = quote.unit_price_cents *
          requirement.quantity is computed FIRST and immutably snapshotted on
          the PO; THEN tier is computed from the pinned snapshot; THEN
          ApprovalStep records are emitted per tier. Without the pinning, a
          later quote-price edit could ambiguously change tier.
        test_recipe:
          setup:
            - "Requirement with quantity=10, awarded Quote.unit_price_cents=1000000 (total=10,000,000 cents)"
          trigger:
            - "POST /requirements/{id}/award"
          assert:
            - "PurchaseOrder.total_amount_cents == 10000000"
            - "PurchaseOrder.tier == 'TIER_3'"   # 5,000,000 <= 10,000,000 < 50,000,000
            - "ApprovalStep records exist with stages [DEPARTMENT_HEAD, FINANCE, LEGAL, GENERAL_MANAGER]"
            - "ApprovalStep(stage=FINANCE).mode == 'PARALLEL' AND ApprovalStep(stage=LEGAL).mode == 'PARALLEL'"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: requirement_rework_cycle
        grounds:
          - state_machines.Requirement.REJECTED_to_DRAFT
          - state_machines.Requirement.DRAFT_to_SUBMITTED
          - endpoints["POST /requirements/{id}/rework"]
        distinguishing_aspect: |
          Cycle (revision loop) on Requirement entity: DRAFT → SUBMITTED →
          IN_SOURCING → IN_APPROVAL → REJECTED → DRAFT — the REJECTED → DRAFT
          edge re-enters an earlier state, allowing repeated submission rounds.
        test_recipe:
          setup:
            - "Requirement that was awarded then rejected by approval chain (status=REJECTED)"
          trigger:
            - "POST /requirements/{id}/rework"
            - "POST /requirements/{id}/submit"
          assert:
            - "After /rework: Requirement.status == 'DRAFT' AND Requirement.justification == null"
            - "After /submit: Requirement.status == 'SUBMITTED' AND Requirement.version > 1"

      - name: approval_step_branching_with_escalation
        grounds:
          - state_machines.ApprovalStep.PENDING_to_ESCALATED
          - state_machines.ApprovalStep.ESCALATED_to_APPROVED
          - state_machines.ApprovalStep.PENDING_to_APPROVED
          - state_machines.ApprovalStep.PENDING_to_REJECTED
          - state_machines.ApprovalStep.PENDING_to_SKIPPED
          - endpoints["POST /_clock/advance"]
        distinguishing_aspect: |
          Branching fork on ApprovalStep entity (different entity than
          Requirement): PENDING fans out to {APPROVED, REJECTED, ESCALATED,
          SKIPPED} with divergent side-effects: APPROVED cascades to PO;
          REJECTED cascades and SKIPPEDs siblings; ESCALATED extends deadline
          and reassigns to GM, then re-converges into APPROVED or REJECTED.
        test_recipe:
          setup:
            - "TIER_2 PO in PENDING_APPROVAL with two SERIAL ApprovalSteps (DEPT_HEAD, FINANCE)"
          trigger:
            - "POST /_clock/advance to a timestamp > step.deadline_at of DEPT_HEAD step"
            - "POST /approval-steps/{dept-head-id}/approve as GeneralManager (allowed because step is now ESCALATED)"
          assert:
            - "After clock advance: ApprovalStep(DEPT_HEAD).status == 'ESCALATED'"
            - "After clock advance: ApprovalStep(DEPT_HEAD).assignee_user_id is the GM user; deadline_at extended by 24h"
            - "After approve as GM: ApprovalStep(DEPT_HEAD).status == 'APPROVED' AND ApprovalStep(FINANCE) becomes the active SERIAL step"

      - name: contract_amend_cycle
        grounds:
          - state_machines.Contract.IN_REVIEW_to_DRAFTING
          - state_machines.Contract.AWAITING_SIGNATURE_to_DRAFTING
          - state_machines.Contract.DRAFTING_to_IN_REVIEW
          - endpoints["POST /contracts/{id}/amend"]
        distinguishing_aspect: |
          Cycle on Contract entity (different entity than Requirement and
          ApprovalStep): IN_REVIEW → DRAFTING → IN_REVIEW (or AWAITING_SIGNATURE
          → DRAFTING) — multiple amendment rounds bump current_version each loop
          and clear collected signatures when amending from AWAITING_SIGNATURE.
        test_recipe:
          setup:
            - "Contract in IN_REVIEW with current_version=1"
          trigger:
            - "POST /contracts/{id}/amend with change_reason='legal feedback' → DRAFTING, version=2"
            - "POST /contracts/{id}/submit-for-review → IN_REVIEW"
            - "POST /contracts/{id}/amend with change_reason='supplier feedback' → DRAFTING, version=3"
          assert:
            - "Contract.current_version == 3 after second amendment"
            - "ContractVersion[].count == 3 (v1 snapshot at create, v2 at first amend, v3 at second amend)"
            - "AuditLogEntry with action='CONTRACT_AMENDED' count == 2"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: award_to_budget_to_approval_steps_chain
        grounds:
          - state_machines.Requirement.IN_SOURCING_to_AWARDED
          - state_machines.PurchaseOrder.PENDING_APPROVAL_to_APPROVED
          - state_machines.ApprovalStep.PENDING_to_APPROVED
          - calculations.po_tier_assignment
          - calculations.budget_commitment
          - endpoints["POST /requirements/{id}/award"]
          - endpoints["POST /approval-steps/{id}/approve"]
        distinguishing_aspect: |
          Depth-3 cascade originating from POST /requirements/{id}/award:
          (1) Award mutates Quote (awarded), Requirement (IN_APPROVAL), and
          BudgetAccount.committed_amount_cents += total. (2) The mutation on
          Requirement triggers ApprovalStep generation per tier. (3) The final
          ApprovalStep approval triggers PurchaseOrder -> APPROVED, which is
          itself caused by the prior step's status flip — not by the original
          award call.
        test_recipe:
          setup:
            - "TIER_1 PO setup (total < 500000 cents) so only one DEPT_HEAD step exists"
            - "Single ApprovalStep on the PO is PENDING and assigned to dept_head_user"
          trigger:
            - "POST /approval-steps/{id}/approve as dept_head_user"
          assert:
            - "ApprovalStep.status == 'APPROVED' (link 1)"
            - "PurchaseOrder.status == 'APPROVED' (link 2 — caused by link 1, not by original award)"
            - "Requirement.status == 'APPROVED' (link 3 — caused by PO transition, not the approve call)"

      - name: contract_sign_to_payment_schedule_to_po_chain
        grounds:
          - state_machines.Contract.AWAITING_SIGNATURE_to_EXECUTED
          - state_machines.PurchaseOrder.APPROVED_to_CONTRACTED
          - calculations.payment_schedule_generation
          - endpoints["POST /contracts/{id}/sign"]
        distinguishing_aspect: |
          Depth-2 cascade originating from POST /contracts/{id}/sign (different
          trigger than the award cascade): (1) Final required signature flips
          Contract -> EXECUTED. (2) That Contract transition itself triggers
          payment_schedule_generation AND flips PurchaseOrder -> CONTRACTED;
          the PO flip is caused by the Contract flip, not by the /sign call.
        test_recipe:
          setup:
            - "Contract in AWAITING_SIGNATURE, parties_required=['Buyer','Supplier'], one Buyer signature already collected"
            - "Approved PO with total_amount_cents=10000, ON_DELIVERY terms"
          trigger:
            - "POST /contracts/{id}/sign as Supplier (the final required party)"
          assert:
            - "Contract.status == 'EXECUTED' (link 1)"
            - "PurchaseOrder.status == 'CONTRACTED' (link 2)"
            - "GET /purchase-orders/{id}/payment-schedule returns 1 entry with amount_cents == 10000 (link 2 side-effect)"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_segregation
        grounds:
          - validations[priority=5]
          - validations[priority=7]
        distinguishing_aspect: |
          Pair: state (priority 5, ERR_INVALID_STATE) vs business_safety
          (priority 7, ERR_SEGREGATION_OF_DUTIES). When a user tries to approve
          an ApprovalStep that (a) is already APPROVED and (b) on a PO they
          previously decided, both checks would fail. Priority dictates state
          wins: ERR_INVALID_STATE not ERR_SEGREGATION_OF_DUTIES.
        test_recipe:
          setup:
            - "TIER_2 PO with two SERIAL ApprovalSteps; user_X approved DEPT_HEAD; FINANCE step still PENDING"
            - "DEPT_HEAD step is already APPROVED (terminal)"
          trigger:
            - "POST /approval-steps/{dept-head-id}/approve as user_X (state-violation AND segregation-violation simultaneously)"
          assert:
            - "Response.error_id == 'ERR_INVALID_STATE'"
            - "Response NOT 'ERR_SEGREGATION_OF_DUTIES'"

      - name: business_safety_vs_business_temporal_segregation_vs_deadline
        grounds:
          - validations[priority=7]
          - validations[priority=9]
        distinguishing_aspect: |
          Pair: business_safety (priority 7, ERR_SEGREGATION_OF_DUTIES) vs
          business_temporal (priority 9, ERR_APPROVAL_DEADLINE_PASSED). User
          tries to approve a step they aren't eligible for AND whose deadline
          has passed; segregation wins because it has lower priority number.
        test_recipe:
          setup:
            - "TIER_3 PO; user_X approved DEPT_HEAD step earlier; FINANCE step is PENDING with deadline_at < now()"
          trigger:
            - "POST /approval-steps/{finance-id}/approve as user_X after clock advances past deadline"
          assert:
            - "Response.error_id == 'ERR_SEGREGATION_OF_DUTIES'"
            - "Response NOT 'ERR_APPROVAL_DEADLINE_PASSED'"

      - name: business_referential_vs_business_fiscal_supplier_vs_budget
        grounds:
          - validations[priority=11]
          - validations[priority=14]
        distinguishing_aspect: |
          Pair: business_referential (priority 11, ERR_INSUFFICIENT_QUOTES) vs
          business_fiscal (priority 14, ERR_BUDGET_WOULD_EXCEED). On award,
          when both fewer-than-3 SHORTLISTED and budget-overrun would fail,
          referential check wins.
        test_recipe:
          setup:
            - "BudgetAccount with total=1000000 cents, committed=900000 cents"
            - "Requirement IN_SOURCING with only 2 SHORTLISTED quotes; awarded quote total would be 200000 cents"
          trigger:
            - "POST /requirements/{id}/award (would fail both insufficient quotes and budget exceed)"
          assert:
            - "Response.error_id == 'ERR_INSUFFICIENT_QUOTES'"
            - "Response NOT 'ERR_BUDGET_WOULD_EXCEED'"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: po_tier_boundary_at_500000
        grounds:
          - calculations.po_tier_assignment
          - endpoints["POST /requirements/{id}/award"]
          - entities.PurchaseOrder.fields.tier
        distinguishing_aspect: |
          Numeric threshold crossing on PurchaseOrder.total_amount_cents:
          total < TIER1_MAX_CENTS (500000) → TIER_1; total == 500000 → TIER_2.
          Strict less-than vs less-than-or-equal pinned at the breakpoint.
        test_recipe:
          setup:
            - "Requirement quantity=1; awarded Quote.unit_price_cents=499999"
            - "Sibling test: Requirement quantity=1; awarded Quote.unit_price_cents=500000"
          trigger:
            - "POST /requirements/{id}/award for both"
          assert:
            - "PO(total=499999).tier == 'TIER_1'"
            - "PO(total=500000).tier == 'TIER_2'"

      - name: insufficient_quotes_boundary_at_3
        grounds:
          - validations[priority=11]
          - endpoints["POST /requirements/{id}/award"]
        distinguishing_aspect: |
          Empty/small-collection edge on a different metric (count of
          SHORTLISTED quotes) and different endpoint (POST award rather than
          tier compute): exactly 2 SHORTLISTED → ERR_INSUFFICIENT_QUOTES;
          exactly 3 SHORTLISTED → award succeeds.
        test_recipe:
          setup:
            - "Test A: Requirement with 2 SHORTLISTED quotes"
            - "Test B: Requirement with 3 SHORTLISTED quotes (justification non-empty)"
          trigger:
            - "POST /requirements/{id}/award for each"
          assert:
            - "Test A: response.error_id == 'ERR_INSUFFICIENT_QUOTES'"
            - "Test B: response 201 created; Quote(awarded).status == 'AWARDED'"

      - name: three_way_match_qty_tolerance_boundary
        grounds:
          - calculations.three_way_match
          - validations[priority=16]
          - endpoints["POST /invoices/{id}/match"]
        distinguishing_aspect: |
          Numeric threshold on a different metric (qty_delta_pct) reachable via
          a different endpoint (/invoices/{id}/match): qty_delta_pct == 0.02
          (exactly QTY_TOLERANCE_PCT) PASSES (<=); 0.0201 (> tolerance) FAILS.
        test_recipe:
          setup:
            - "PO total=11300, requirement.quantity=100; receipt fully ACCEPTED with accepted=100"
            - "Test A: invoice.invoiced_quantity=98 (delta 0.02 exactly), invoiced_amount=11074, tax=1274, rate=0.13"
            - "Test B: invoice.invoiced_quantity=97 (delta 0.03 > 0.02), same amounts"
          trigger:
            - "POST /invoices/{id}/match for each"
          assert:
            - "Test A: Invoice.matching_result.quantity_match == true (boundary inclusive)"
            - "Test B: Invoice.status == 'EXCEPTION' AND matching_result.quantity_match == false"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: contract_review_requires_po_approved
        grounds:
          - state_machines.Contract.DRAFTING_to_IN_REVIEW
          - validations[priority=5]
        distinguishing_aspect: |
          Pair Contract→PurchaseOrder: Contract DRAFTING → IN_REVIEW requires
          PurchaseOrder.status == APPROVED. PO in PENDING_APPROVAL blocks
          contract review with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "PurchaseOrder still in PENDING_APPROVAL"
            - "Contract on this PO in DRAFTING"
          trigger:
            - "POST /contracts/{id}/submit-for-review"
          assert:
            - "Response.error_id == 'ERR_INVALID_STATE' (PO not APPROVED)"

      - name: receipt_inspect_requires_po_contracted
        grounds:
          - state_machines.Receipt.DRAFT_to_INSPECTING
          - validations[priority=5]
        distinguishing_aspect: |
          Different entity pair (Receipt→PurchaseOrder, distinct from
          Contract→PurchaseOrder): Receipt DRAFT → INSPECTING requires
          PurchaseOrder.status == CONTRACTED. PO in APPROVED but not yet
          CONTRACTED blocks inspection.
        test_recipe:
          setup:
            - "PO in APPROVED (contract not yet executed)"
            - "Receipt created in DRAFT against this PO"
          trigger:
            - "POST /receipts/{id}/inspect"
          assert:
            - "Response.error_id == 'ERR_INVALID_STATE'"

      - name: payment_apply_requires_invoice_approved_and_schedule_pending
        grounds:
          - state_machines.Payment.APPLIED_to_APPROVED
          - validations[priority=5]
        distinguishing_aspect: |
          Different entity pair (Payment→Invoice and Payment→PaymentSchedule):
          Payment APPLIED → APPROVED requires Invoice.status == APPROVED AND
          PaymentSchedule.status == APPLIED. Cross-entity dependency on a
          different pair than Contract↔PO and Receipt↔PO.
        test_recipe:
          setup:
            - "Invoice in MATCHED (not yet APPROVED)"
            - "PaymentSchedule entry APPLIED via POST /payments"
          trigger:
            - "POST /payments/{id}/approve"
          assert:
            - "Response.error_id == 'ERR_INVALID_STATE'"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: budget_account_capacity_aggregate_overlap
        grounds:
          - validations[priority=14]
          - calculations.budget_commitment
          - concurrency_rules["budget"]
          - endpoints["POST /requirements/{id}/award"]
        distinguishing_aspect: |
          Aggregate-capacity geometry on BudgetAccount resource: an "interval"
          here is a fiscal-year window during which the sum of overlapping PO
          commitments must fit under total_amount_cents. Treatment is
          aggregate-capacity (sum of concurrent reservations <= ceiling),
          distinct from approval-deadline adjacency.
        test_recipe:
          setup:
            - "BudgetAccount.total_amount_cents=1000000, committed=900000"
            - "Two parallel awards each requiring 60000 cents: A and B"
          trigger:
            - "POST /requirements/{a}/award and POST /requirements/{b}/award concurrently (or serially second-after-first)"
          assert:
            - "First award succeeds; committed becomes 960000"
            - "Second award response.error_id == 'ERR_BUDGET_WOULD_EXCEED' (aggregate-capacity rejection)"

      - name: approval_deadline_adjacency_overlap
        grounds:
          - validations[priority=9]
          - state_machines.ApprovalStep.PENDING_to_ESCALATED
          - endpoints["POST /_clock/advance"]
          - endpoints["POST /approval-steps/{id}/approve"]
        distinguishing_aspect: |
          Adjacency-buffer geometry on ApprovalStep resource (different resource
          and different interval semantics from BudgetAccount aggregate
          capacity): an action whose timestamp is exactly at deadline_at
          (boundary adjacency) is in the closed-deadline rejection zone.
          deadline_at uses strict greater-than (deadline_at > now()) so
          equality fails, producing ERR_APPROVAL_DEADLINE_PASSED — different
          interval arithmetic from aggregate capacity.
        test_recipe:
          setup:
            - "ApprovalStep PENDING with deadline_at = T"
          trigger:
            - "POST /_clock/advance to=T"
            - "POST /approval-steps/{id}/approve immediately at clock=T"
          assert:
            - "Response.error_id == 'ERR_APPROVAL_DEADLINE_PASSED' (strict-inequality boundary)"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: budget_commitment_round_trip_invariant
        grounds:
          - calculations.budget_commitment
          - state_machines.Requirement.IN_SOURCING_to_AWARDED
          - state_machines.PurchaseOrder.PENDING_APPROVAL_to_REJECTED
          - state_machines.PurchaseOrder.PENDING_APPROVAL_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: BudgetAccount.committed_amount_cents (cents
          reservation pool). Forward action /award commits +total; compensating
          action (PO rejected via approval reject OR /purchase-orders/{id}/cancel)
          releases -total. Invariant: committed_amount_cents ==
          sum(PO.total_amount_cents for PO in {APPROVED,CONTRACTED,FULFILLED})
          - sum(Payment.amount_cents for Payment in EXECUTED).
        test_recipe:
          setup:
            - "BudgetAccount with total=1000000, committed=0 initially"
            - "Award a Requirement creating PO with total=300000 cents"
          trigger:
            - "(Forward) /award → committed becomes 300000"
            - "(Compensating) POST /approval-steps/{first-step-id}/reject → PO REJECTED"
          assert:
            - "After forward: BudgetAccount.committed_amount_cents == 300000"
            - "After compensating: BudgetAccount.committed_amount_cents == 0"
            - "Invariant holds: committed equals sum(PO totals in {APPROVED,CONTRACTED,FULFILLED}) - sum(executed Payments) == 0"

      - name: receipt_quantity_round_trip_invariant
        grounds:
          - state_machines.Receipt.DRAFT_to_INSPECTING
          - state_machines.Receipt.INSPECTING_to_REJECTED
          - state_machines.Receipt.REJECTED_to_RETURNED
          - validations[priority=13]
          - entities.Receipt.fields.cumulative_accepted_after
        distinguishing_aspect: |
          Different conserved quantity (units of physical goods, not cents):
          accepted_quantity sum across Receipts on a PO. Forward action
          /receipts/{id}/accept increments cumulative; compensating action
          /receipts/{id}/reject + /return on a never-accepted receipt leaves
          cumulative unchanged. Invariant: sum(Receipt.accepted_quantity for
          Receipts in {ACCEPTED,PARTIALLY_ACCEPTED}) is monotone non-decreasing
          and bounded above by Requirement.quantity.
        test_recipe:
          setup:
            - "PO with Requirement.quantity=10; one Receipt (R1) ACCEPTED with accepted_quantity=4"
            - "Second Receipt (R2) DRAFT with received_quantity=6, accepted_quantity=0, quality_rating=10"
          trigger:
            - "POST /receipts/{R2}/inspect"
            - "POST /receipts/{R2}/reject (quality < 60)"
            - "POST /receipts/{R2}/return"
          assert:
            - "Receipt(R1).cumulative_accepted_after == 4 (unchanged across compensation)"
            - "sum(Receipt.accepted_quantity for Receipts in {ACCEPTED,PARTIALLY_ACCEPTED}) == 4 (invariant — REJECTED/RETURNED excluded)"
            - "PO.status remains 'CONTRACTED' (not advanced to FULFILLED, since 4 < 10)"

      - name: payment_execution_invariant
        grounds:
          - state_machines.Payment.APPROVED_to_EXECUTED
          - state_machines.Payment.APPROVED_to_FAILED
          - calculations.budget_commitment
        distinguishing_aspect: |
          Different conserved quantity again (split between committed and
          spent): on Payment EXECUTED, committed decreases by amount and spent
          increases by amount — committed+spent total is invariant per PO.
          Compensating: APPROVED→FAILED restores PaymentSchedule to APPLIED
          without touching committed/spent (no double-spend).
        test_recipe:
          setup:
            - "PO total=10000, fully approved/contracted; PaymentSchedule one entry of 10000; Payment APPROVED"
            - "BudgetAccount.committed=10000, spent=0 before execution"
          trigger:
            - "POST /payments/{id}/execute (success path)"
          assert:
            - "BudgetAccount.committed_amount_cents == 0"
            - "BudgetAccount.spent_amount_cents == 10000"
            - "Invariant: committed + spent attributable to this PO == 10000 (unchanged total reservation)"
