            - "Nomination.${nom_id}.fulfillment_status == AWAITING_SCHEDULE (not left at SCHEDULED, and not rolled back past CONFIRMED)"
            - "DeliveryAsset.${asset_id}.status == AVAILABLE and compliance_score == 100.00 (a cancellation is not a compliance event)"

      - name: receivable_balance_conserved_across_issue_and_void
        grounds:
          - entities.Customer.fields.outstanding_balance_usd
          - entities.Customer.fields.credit_status
          - state_machines.Invoice.PROVISIONAL_to_ISSUED
          - state_machines.Invoice.ISSUED_to_VOID
          - state_machines.Nomination.CLOSED_to_DELIVERED
          - calculations.customer_credit_exposure
        distinguishing_aspect: |
          A monetary conserved quantity on a different entity: Customer.outstanding_balance_usd
          must equal the sum of final_amount_usd over ISSUED and CREDIT_APPLIED invoices only.
          Issuing adds 941193.73 and flips the derived credit_status OK -> HOLD; voiding must
          restore 0.00 and OK exactly, re-open the nomination CLOSED -> DELIVERED and move that
          941193.73 back out of settled receivables into the 894600.00 open-commitment bucket,
          leaving no cent of drift.
        test_recipe:
          setup:
            - "Base fixture with stem 1 delivered and measurement AGREED at 1198.450 mt"
            - "Invoice created but still PROVISIONAL at provisional_amount_usd 941193.73"
            - "Customer credit_limit_usd reduced to 941193.73 by a credit review so the issue will land utilisation on exactly 1.0000"
            - "Logical clock at 2026-08-10T14:30:00Z so the open-commitment valuation uses the 745.50 quote"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
