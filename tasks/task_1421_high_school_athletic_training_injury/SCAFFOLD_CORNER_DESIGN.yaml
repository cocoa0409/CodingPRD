            - { call: "POST /physicals/${ph1}/verify", payload: {}, as: SchoolNurse, as_user_id: "${nr1}" }
            - { call: "POST /baseline-tests", payload: { athlete_id: "${a1}", test_date: "2026-07-10", instrument: SCAT6, symptom_score: 0, memory_index: 95.0, reaction_time_ms: 250.0, balance_errors: 1 }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /injuries", payload: { athlete_id: "${a1}", body_region: KNEE, injury_type: SPRAIN, severity: MINOR, mechanism: "cut", evaluated_at: "2026-07-14T10:00:00Z", restricted_activities: [PRACTICE] }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { inj: $.data.id } }
            - { call: "POST /injuries/${inj}/begin-care", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { inj_v2: $.data.version } }
            - { call: "POST /injuries/${inj}/rtp-protocols", payload: { protocol_type: GRADUATED_6_STAGE, expected_injury_version: "${inj_v2}" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { rtp: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "GET /physicals/${ph1}", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ph_s: $.data.status } }
            - { call: "GET /athletes/${a1}/clearance", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { posture: $.data.participation_posture } }
            - { call: "POST /rtp-protocols/${rtp}/advance", payload: { symptom_check_passed: true }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { err: $.data.error_id } }
          assert:
            - "ph_s == EXPIRED (sweep fired at exactly expires_on, inclusive)"
            - "posture == INELIGIBLE"
            - "err == ERR_PHYSICAL_EXPIRED (http 409; state and dwell were both satisfied, so the safety gate is what fires)"

      - name: budget_fiscal_gate_on_approval
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_BUDGET_EXCEEDED]
          - entities.SupplyBudget.fields.available_cents
        distinguishing_aspect: "The fiscal check fires last and exactly: an order whose extended_cost_cents (2000) exceeds the budget's available_cents (1000) is rejected ERR_BUDGET_EXCEEDED (402) and stays SUBMITTED; a smaller order (500) against the same budget approves cleanly."
        test_recipe:
          setup: ["Budget FY2026 total 1000; item (unit_cost 500); trainer T1 (requester), director AD; order O1 qty 4 @ 500 SUBMITTED, order O2 qty 1 @ 500 SUBMITTED"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Director Dee", role_type: ATHLETIC_DIRECTOR }, as: SystemAdmin, captures: { ad: $.data.id } }
            - { call: "POST /supply-budgets", payload: { fiscal_year: 2026, total_budget_cents: 1000 }, as: SystemAdmin }
            - { call: "POST /supply-items", payload: { item_name: "Splints", category: FIRST_AID, unit: EACH, par_level: 20, reorder_threshold: 5, unit_cost_cents: 500 }, as: SystemAdmin, captures: { item: $.data.id } }
            - { call: "POST /restock-orders", payload: { supply_item_id: "${item}", quantity: 4, unit_cost_cents: 500, fiscal_year: 2026 }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { o1: $.data.id, o1_ext: $.data.extended_cost_cents } }
            - { call: "POST /restock-orders/${o1}/submit", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /restock-orders", payload: { supply_item_id: "${item}", quantity: 1, unit_cost_cents: 500, fiscal_year: 2026 }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { o2: $.data.id } }
            - { call: "POST /restock-orders/${o2}/submit", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}" }
          trigger:
            - { call: "POST /restock-orders/${o1}/approve", payload: {}, as: AthleticDirector, as_user_id: "${ad}", captures: { err: $.data.error_id } }
            - { call: "GET /restock-orders/${o1}", payload: {}, as: SystemAdmin, captures: { o1_s: $.data.status } }
            - { call: "POST /restock-orders/${o2}/approve", payload: {}, as: AthleticDirector, as_user_id: "${ad}", captures: { o2_s: $.data.status } }
            - { call: "GET /supply-budgets", payload: { fiscal_year: 2026 }, as: SystemAdmin, captures: { av: "$.data[0].available_cents" } }
          assert:
            - "o1_ext == 2000"
            - "err == ERR_BUDGET_EXCEEDED (http 402) and o1_s == SUBMITTED (unchanged)"
            - "o2_s == APPROVED (500 <= 1000 available)"
            - "av == 500 after O2 commits"

  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: pagination_limit_offset_interaction
        claim_type: listing
        grounds:
          - response_envelope
        distinguishing_aspect: "limit/offset windowing: 3 athletes with limit=2 yields 2 rows with total_count 3 and has_more true; offset=2 yields the final row with has_more false."
        test_recipe:
          setup: ["Trainer T1; three athletes created"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /athletes", payload: { full_name: "A One", date_of_birth: "2009-01-01", grade: 10, sex: M, primary_sport: SOCCER, team_level: JV, guardian_name: "G1", guardian_user_id: "g-9501" }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /athletes", payload: { full_name: "A Two", date_of_birth: "2009-02-01", grade: 10, sex: F, primary_sport: SOCCER, team_level: JV, guardian_name: "G2", guardian_user_id: "g-9502" }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /athletes", payload: { full_name: "A Three", date_of_birth: "2009-03-01", grade: 11, sex: M, primary_sport: TRACK, team_level: VARSITY, guardian_name: "G3", guardian_user_id: "g-9503" }, as: AthleticTrainer, as_user_id: "${tr1}" }
          trigger:
            - { call: "GET /athletes", payload: { limit: 2, offset: 0 }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { page1_first: "$.data[0].id" } }
            - { call: "GET /athletes", payload: { limit: 2, offset: 2 }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { page2_first: "$.data[0].id" } }
          assert:
            - "page 1 returns exactly 2 rows with envelope total_count == 3 and has_more == true"
            - "page 2 returns exactly 1 row with has_more == false"
            - "page1_first != page2_first (disjoint windows)"

      - name: filtered_list_combination
        claim_type: listing
        grounds:
          - entities.InjuryEvaluation.fields.status
        distinguishing_aspect: "Combined filters athlete_id + status narrow to exactly the matching injury; a second filter injury_type cross-checks orthogonality."
        test_recipe:
          setup: ["Trainer T1; athletes A and B; A has injury I1 (OPEN) and I2 (UNDER_CARE via begin-care); B has injury I3 (OPEN)"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /athletes", payload: { full_name: "Athlete A", date_of_birth: "2009-01-01", grade: 10, sex: M, primary_sport: SOCCER, team_level: JV, guardian_name: "GA", guardian_user_id: "g-9504" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { a1: $.data.id } }
            - { call: "POST /athletes", payload: { full_name: "Athlete B", date_of_birth: "2009-02-01", grade: 11, sex: F, primary_sport: SOCCER, team_level: VARSITY, guardian_name: "GB", guardian_user_id: "g-9505" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { b1: $.data.id } }
            - { call: "POST /injuries", payload: { athlete_id: "${a1}", body_region: KNEE, injury_type: SPRAIN, severity: MINOR, mechanism: "cut", evaluated_at: "2026-07-31T10:00:00Z" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { i1: $.data.id } }
            - { call: "POST /injuries", payload: { athlete_id: "${a1}", body_region: ANKLE_FOOT, injury_type: STRAIN, severity: MINOR, mechanism: "run", evaluated_at: "2026-07-31T11:00:00Z" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { i2: $.data.id } }
            - { call: "POST /injuries/${i2}/begin-care", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /injuries", payload: { athlete_id: "${b1}", body_region: SHOULDER, injury_type: SPRAIN, severity: MODERATE, mechanism: "fall", evaluated_at: "2026-07-31T12:00:00Z" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { i3: $.data.id } }
          trigger:
            - { call: "GET /injuries", payload: { athlete_id: "${a1}", status: OPEN }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { hit1: "$.data[0].id" } }
            - { call: "GET /injuries", payload: { injury_type: SPRAIN }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { spr_first: "$.data[0].id" } }
          assert:
            - "athlete_id+status filter returns exactly 1 row and hit1 == ${i1}"
            - "injury_type=SPRAIN returns exactly 2 rows (${i1} and ${i3})"

      - name: venue_activity_status_defaults
        claim_type: computed_read
        grounds:
          - calculations.heat_activity_tier
          - calculations.lightning_all_clear
        distinguishing_aspect: "A venue with no readings reports the documented empty-set defaults: current_heat_tier NORMAL and lightning_hold_active false."
        test_recipe:
          setup: ["Venue V (OUTDOOR), no readings"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /venues", payload: { venue_name: "Empty Field", venue_type: OUTDOOR, surface: GRASS, address: "8 Rd" }, as: SystemAdmin, captures: { v1: $.data.id } }
          trigger:
            - { call: "GET /venues/${v1}/activity-status", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { tier: $.data.current_heat_tier, hold: $.data.lightning_hold_active } }
          assert:
            - "tier == NORMAL (empty reading set defaults)"
            - "hold == false"

      - name: envelope_shape_on_success_and_error
        claim_type: creation
        grounds:
          - response_envelope
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "Success responses wrap data with meta.api_request_id/api_request_timestamp and response_type 'object'; errors use response_type 'error' with data.error_id and data.message; a malformed id segment produces the generic ERR_NOT_FOUND."
        test_recipe:
          setup: ["Trainer T1; athlete A"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /athletes", payload: { full_name: "Athlete A", date_of_birth: "2009-01-01", grade: 10, sex: M, primary_sport: GOLF, team_level: JV, guardian_name: "GA", guardian_user_id: "g-9506" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { a1: $.data.id } }
          trigger:
            - { call: "GET /athletes/${a1}", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { got_id: $.data.id } }
            - { call: "GET /athletes/not-a-uuid", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { err: $.data.error_id } }
          assert:
            - "success: response_type == 'object', meta.api_request_id present, got_id == ${a1}"
            - "error: response_type == 'error', err == ERR_NOT_FOUND (generic), data.message present"

      - name: valuation_invalid_policy_rejected
        claim_type: violation_to_error
        grounds:
          - calculations.inventory_valuation
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "The valuation policy parameter is a closed enum (FIFO | WAC_RUNNING | WAC_EXACT); policy LIFO fails with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Item I exists"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /supply-items", payload: { item_name: "Tape", category: TAPE, unit: ROLL, par_level: 30, reorder_threshold: 10, unit_cost_cents: 100 }, as: SystemAdmin, captures: { item: $.data.id } }
          trigger:
            - { call: "GET /supply-items/${item}/valuation", payload: { policy: LIFO }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST (policy outside the enum)"

  # ===========================================================================
  # Section: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: event_at_inactive_venue_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_VENUE_INACTIVE]
          - entities.Venue.fields.is_active
        distinguishing_aspect: "Every error must be triggerable: ERR_VENUE_INACTIVE fires when scheduling at a venue created with is_active = false."
        test_recipe:
          setup: ["Trainer T1; venue V created inactive"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /venues", payload: { venue_name: "Closed Pool", venue_type: INDOOR, surface: POOL, address: "9 Rd", is_active: false }, as: SystemAdmin, captures: { v1: $.data.id } }
          trigger:
            - { call: "POST /events", payload: { event_name: "Swim Practice", sport: SWIMMING, team_level: VARSITY, event_type: PRACTICE, venue_id: "${v1}", scheduled_start: "2026-08-02T14:00:00Z", scheduled_end: "2026-08-02T15:00:00Z", expected_attendance: 0 }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_VENUE_INACTIVE (http 422)"

      - name: reopen_reference_requires_closed_prior
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_REFERENCED_INJURY_NOT_CLOSED]
          - entities.InjuryEvaluation.fields.reopen_of_id
          - entities.InjuryEvaluation.fields.recurrence_count
        distinguishing_aspect: "reopen_of_id must reference a CLOSED injury of the same athlete: referencing an OPEN one fails (422); after the prior injury is closed (resolve + 30 days), the recurrence links and inherits recurrence_count + 1."
        test_recipe:
          setup: ["Trainer T1; athlete A; injury I1 (SPRAIN) OPEN"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /athletes", payload: { full_name: "Athlete A", date_of_birth: "2009-05-01", grade: 12, sex: M, primary_sport: FOOTBALL, team_level: VARSITY, guardian_name: "GA", guardian_user_id: "g-9601", guardian_email: "ga@x.com" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { a1: $.data.id } }
            - { call: "POST /injuries", payload: { athlete_id: "${a1}", body_region: KNEE, injury_type: SPRAIN, severity: MODERATE, mechanism: "cut", evaluated_at: "2026-07-31T10:00:00Z", restricted_activities: [PRACTICE] }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { i1: $.data.id } }
          trigger:
            - { call: "POST /injuries", payload: { athlete_id: "${a1}", body_region: KNEE, injury_type: SPRAIN, severity: MODERATE, mechanism: "recurrence attempt", evaluated_at: "2026-07-31T12:00:00Z", reopen_of_id: "${i1}" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { err: $.data.error_id } }
            - { call: "POST /injuries/${i1}/begin-care", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /injuries/${i1}/resolve", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /injuries/${i1}/close", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { i1_s: $.data.status } }
            - { call: "POST /injuries", payload: { athlete_id: "${a1}", body_region: KNEE, injury_type: SPRAIN, severity: MODERATE, mechanism: "true recurrence", evaluated_at: "2026-08-30T09:00:00Z", reopen_of_id: "${i1}" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { i2_rec: $.data.recurrence_count, i2_s: $.data.status } }
          assert:
            - "err == ERR_REFERENCED_INJURY_NOT_CLOSED (I1 was OPEN)"
            - "i1_s == CLOSED after the 30-day window (resolved 2026-08-01T00:00, closed 2026-08-31T00:00)"
            - "i2_s == OPEN and i2_rec == 1 (inherits reopen_of.recurrence_count + 1 = 0 + 1)"

  # ===========================================================================
  # Section: rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: request_missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: "A request with neither X-User-ID nor X-User-Role is rejected at priority 1 with 400 before any role or existence check runs."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - { call: "GET /athletes", payload: {} }
          assert:
            - "rejected with err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (http 400) and no data rows"

      - name: coach_cannot_read_or_write_injuries
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - roles.TeamCoach
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "TeamCoach has schedule/posture reads but no medical-record access: both GET /injuries and POST /injuries fail ERR_FORBIDDEN_ROLE (403) — role check fires before body validation."
        test_recipe:
          setup: ["Coach C1 exists"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Coach Cal", role_type: TEAM_COACH }, as: SystemAdmin, captures: { co1: $.data.id } }
          trigger:
            - { call: "GET /injuries", payload: {}, as: TeamCoach, as_user_id: "${co1}", captures: { err1: $.data.error_id } }
            - { call: "POST /injuries", payload: {}, as: TeamCoach, as_user_id: "${co1}", captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_FORBIDDEN_ROLE"
            - "err2 == ERR_FORBIDDEN_ROLE (rejected at role check, priority 2, despite the empty body)"

      - name: physical_self_verify_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - entities.PreParticipationPhysical.fields.verified_by_staff_id
        distinguishing_aspect: "Segregation of duties: the SchoolNurse who RECORDED a physical cannot also verify it (403 ERR_SEGREGATION_OF_DUTIES); a different nurse verifies successfully."
        test_recipe:
          setup: ["Nurses N1 and N2; athlete A; physical recorded BY N1"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Nurse One", role_type: SCHOOL_NURSE }, as: SystemAdmin, captures: { nr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Nurse Two", role_type: SCHOOL_NURSE }, as: SystemAdmin, captures: { nr2: $.data.id } }
            - { call: "POST /athletes", payload: { full_name: "Athlete A", date_of_birth: "2009-05-01", grade: 10, sex: F, primary_sport: VOLLEYBALL, team_level: JV, guardian_name: "GA", guardian_user_id: "g-9602" }, as: SchoolNurse, as_user_id: "${nr1}", captures: { a1: $.data.id } }
            - { call: "POST /physicals", payload: { athlete_id: "${a1}", exam_date: "2026-07-01", examining_physician_name: "Dr X", outcome: CLEARED, validity_policy: DISTRICT_13MO }, as: SchoolNurse, as_user_id: "${nr1}", captures: { ph1: $.data.id, ph_rec: $.data.recorded_by_staff_id } }
          trigger:
            - { call: "POST /physicals/${ph1}/verify", payload: {}, as: SchoolNurse, as_user_id: "${nr1}", captures: { err: $.data.error_id } }
            - { call: "POST /physicals/${ph1}/verify", payload: {}, as: SchoolNurse, as_user_id: "${nr2}", captures: { ph_s: $.data.status, ph_ver: $.data.verified_by_staff_id } }
          assert:
            - "ph_rec == ${nr1} (recorded_by set from X-User-ID)"
            - "err == ERR_SEGREGATION_OF_DUTIES (recorder cannot verify)"
            - "ph_s == VERIFIED and ph_ver == ${nr2}"

      - name: eap_author_cannot_approve_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - entities.EmergencyActionPlan.fields.approved_by_staff_id
        distinguishing_aspect: "Segregation of duties on the EAP approval chain: the AthleticDirector who authored a plan cannot approve it; a second AthleticDirector can."
        test_recipe:
          setup: ["Directors AD1 (author) and AD2; trainer T1; venue V; EAP authored by AD1, submitted by T1"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Director One", role_type: ATHLETIC_DIRECTOR }, as: SystemAdmin, captures: { ad1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Director Two", role_type: ATHLETIC_DIRECTOR }, as: SystemAdmin, captures: { ad2: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /venues", payload: { venue_name: "Stadium", venue_type: OUTDOOR, surface: GRASS, address: "1 Rd" }, as: SystemAdmin, captures: { v1: $.data.id } }
            - { call: "POST /emergency-action-plans", payload: { venue_id: "${v1}", version_label: "v1", evacuation_route: "Gate A", aed_location: "Lobby", ems_contact: "911", nearest_hospital: "General" }, as: AthleticDirector, as_user_id: "${ad1}", captures: { eap: $.data.id, eap_author: $.data.authored_by_staff_id } }
            - { call: "POST /emergency-action-plans/${eap}/submit", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}" }
          trigger:
            - { call: "POST /emergency-action-plans/${eap}/approve", payload: {}, as: AthleticDirector, as_user_id: "${ad1}", captures: { err: $.data.error_id } }
            - { call: "POST /emergency-action-plans/${eap}/approve", payload: {}, as: AthleticDirector, as_user_id: "${ad2}", captures: { eap_s: $.data.status, eap_appr: $.data.approved_by_staff_id } }
          assert:
            - "eap_author == ${ad1}"
            - "err == ERR_SEGREGATION_OF_DUTIES (author cannot approve)"
            - "eap_s == APPROVED and eap_appr == ${ad2}"

      - name: order_requester_cannot_approve_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - entities.RestockOrder.fields.approved_by_staff_id
        distinguishing_aspect: "Segregation of duties on procurement: an AthleticDirector who requested and submitted an order cannot approve it; a second director's approval succeeds and commits budget."
        test_recipe:
          setup: ["Budget FY2026 (100000); item (cost 500); directors AD1 (requester) and AD2; order qty 4 @ 500 (extended 2000) DRAFT -> SUBMITTED, all by AD1"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Director One", role_type: ATHLETIC_DIRECTOR }, as: SystemAdmin, captures: { ad1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Director Two", role_type: ATHLETIC_DIRECTOR }, as: SystemAdmin, captures: { ad2: $.data.id } }
            - { call: "POST /supply-budgets", payload: { fiscal_year: 2026, total_budget_cents: 100000 }, as: SystemAdmin }
            - { call: "POST /supply-items", payload: { item_name: "Splints", category: FIRST_AID, unit: EACH, par_level: 20, reorder_threshold: 5, unit_cost_cents: 500 }, as: SystemAdmin, captures: { item: $.data.id } }
            - { call: "POST /restock-orders", payload: { supply_item_id: "${item}", quantity: 4, unit_cost_cents: 500, fiscal_year: 2026 }, as: AthleticDirector, as_user_id: "${ad1}", captures: { ord: $.data.id } }
            - { call: "POST /restock-orders/${ord}/submit", payload: {}, as: AthleticDirector, as_user_id: "${ad1}" }
          trigger:
            - { call: "POST /restock-orders/${ord}/approve", payload: {}, as: AthleticDirector, as_user_id: "${ad1}", captures: { err: $.data.error_id } }
            - { call: "POST /restock-orders/${ord}/approve", payload: {}, as: AthleticDirector, as_user_id: "${ad2}", captures: { ord_s: $.data.status, ord_appr: $.data.approved_by_staff_id } }
