  - method: POST
    path: "/v1/program-sessions/{session_id}/close"
    description: "Close a session to new ENROLLED registrations"
    roles: [GardenAdmin, GardenStaff]
    code: 200
    input: []
    output: ProgramSession
    side_effects: ["status OPEN->CLOSED"]

  # ---- Registration ----------------------------------------------------------
  - method: POST
    path: "/v1/registrations"
    description: "Register a participant for a session (ENROLLED if room, else WAITLISTED). Member program discount if membership ACTIVE."
    roles: [Visitor, GardenStaff]
    code: 201
    input: [garden_id, program_session_id, participant_name, "membership_id?"]
    output: Registration
    side_effects: ["program_tuition pricing", "enrolled_count += 1 OR assign waitlist_rank"]

  - method: GET
    path: "/v1/registrations/{registration_id}"
    description: "Read a registration"
    roles: [GardenAdmin, GardenStaff, RentalCoordinator, DevelopmentOfficer, Visitor]
    code: 200
    input: []
    output: Registration
    side_effects: []

  - method: GET
    path: "/v1/registrations"
    description: "List/filter registrations by garden, session, membership, and/or status"
    roles: [GardenAdmin, GardenStaff, RentalCoordinator, DevelopmentOfficer, Visitor]
    code: 200
    input: ["garden_id?", "program_session_id?", "membership_id?", "status?"]
    output: Registration[]
    side_effects: []

  - method: POST
    path: "/v1/registrations/{registration_id}/withdraw"
    description: "Withdraw a registration (frees a seat, promotes head waitlister)"
    roles: [Visitor, GardenStaff]
    code: 200
    input: []
    output: Registration
    side_effects: ["status -> WITHDRAWN", "enrolled_count -= 1 if was ENROLLED", "promote rank-1 waitlister"]

  # ---- Venue -----------------------------------------------------------------
  - method: POST
    path: "/v1/venues"
    description: "Create a rentable venue"
    roles: [GardenAdmin, RentalCoordinator]
    code: 201
    input: [garden_id, name, hourly_rate_cents, "buffer_minutes?", "member_rental_discount_pct?"]
    output: Venue
    side_effects: []

  - method: GET
    path: "/v1/venues/{venue_id}"
    description: "Read a venue"
    roles: [GardenAdmin, GardenStaff, RentalCoordinator, DevelopmentOfficer, Visitor]
    code: 200
    input: []
    output: Venue
    side_effects: []

  - method: GET
    path: "/v1/venues"
    description: "List/filter venues by garden"
    roles: [GardenAdmin, GardenStaff, RentalCoordinator, DevelopmentOfficer, Visitor]
    code: 200
    input: ["garden_id?"]
    output: Venue[]
    side_effects: []

  # ---- Rental ----------------------------------------------------------------
  - method: POST
    path: "/v1/rentals"
    description: "Request a venue rental (quoted_cents computed provisionally)"
    roles: [Visitor, RentalCoordinator]
    code: 201
    input: [garden_id, venue_id, starts_at, ends_at, "membership_id?"]
    output: Rental
    side_effects: ["rental_pricing quoted variant -> quoted_cents; status=REQUESTED"]

  - method: GET
    path: "/v1/rentals/{rental_id}"
    description: "Read a rental"
    roles: [GardenAdmin, GardenStaff, RentalCoordinator, DevelopmentOfficer, Visitor]
    code: 200
    input: []
    output: Rental
    side_effects: []

  - method: GET
    path: "/v1/rentals"
    description: "List/filter rentals by garden, venue, membership, and/or status"
    roles: [GardenAdmin, GardenStaff, RentalCoordinator, DevelopmentOfficer, Visitor]
    code: 200
    input: ["garden_id?", "venue_id?", "membership_id?", "status?"]
    output: Rental[]
    side_effects: []

  - method: POST
    path: "/v1/rentals/{rental_id}/confirm"
    description: "Confirm a requested rental (locks final_cents, checks venue overlap with buffer)"
    roles: [RentalCoordinator]
    code: 200
    input: []
    output: Rental
    side_effects: ["venue overlap check", "rental_pricing final variant -> final_cents; status REQUESTED->CONFIRMED"]

  - method: POST
    path: "/v1/rentals/{rental_id}/reject"
    description: "Reject a requested rental"
    roles: [RentalCoordinator]
    code: 200
    input: []
    output: Rental
    side_effects: ["status REQUESTED->REJECTED"]

  - method: POST
    path: "/v1/rentals/{rental_id}/cancel"
    description: "Cancel a requested or confirmed rental (frees the venue)"
    roles: [Visitor, RentalCoordinator]
    code: 200
    input: []
    output: Rental
    side_effects: ["status -> CANCELLED; venue freed"]

  # ---- Donation --------------------------------------------------------------
  - method: POST
    path: "/v1/donations"
    description: "Record a donation / conservancy gift (computes deductible; accrues conservancy match)"
    roles: [Visitor, DevelopmentOfficer, GardenStaff]
    code: 201
    input: [garden_id, amount_cents, "designation?", "membership_id?"]
    output: Donation
    side_effects: ["donation_deductible calc", "conservancy_match calc if CONSERVANCY -> updates ConservancyFund"]

  - method: GET
    path: "/v1/donations/{donation_id}"
    description: "Read a donation"
    roles: [GardenAdmin, GardenStaff, RentalCoordinator, DevelopmentOfficer, Visitor]
    code: 200
    input: []
    output: Donation
    side_effects: []

  - method: GET
    path: "/v1/donations"
    description: "List/filter donations by garden, membership, designation, and/or status"
    roles: [GardenAdmin, GardenStaff, RentalCoordinator, DevelopmentOfficer, Visitor]
    code: 200
    input: ["garden_id?", "membership_id?", "designation?", "status?"]
    output: Donation[]
    side_effects: []

  - method: POST
    path: "/v1/donations/{donation_id}/void"
    description: "Void a recorded donation (reverses conservancy pledge/match)"
    roles: [DevelopmentOfficer]
    code: 200
    input: []
    output: Donation
    side_effects: ["status RECORDED->VOIDED", "reverse pledged_total_cents and matched_total_cents on ConservancyFund"]

  # ---- ConservancyFund -------------------------------------------------------
  - method: POST
    path: "/v1/conservancy-funds"
    description: "Create the garden's conservancy match campaign fund (one per garden)"
    roles: [DevelopmentOfficer, GardenAdmin]
    code: 201
    input: [garden_id, "match_ratio?", "match_cap_cents?"]
    output: ConservancyFund
    side_effects: ["campaign_status=OPEN; pledged_total_cents=0; matched_total_cents=0"]

  - method: GET
    path: "/v1/conservancy-funds/{fund_id}"
    description: "Read the conservancy fund (pledged/matched totals)"
    roles: [GardenAdmin, GardenStaff, RentalCoordinator, DevelopmentOfficer, Visitor]
    code: 200
    input: []
    output: ConservancyFund
    side_effects: []

  - method: GET
    path: "/v1/conservancy-funds"
    description: "List/filter the conservancy fund(s) for a garden (0 or 1)"
    roles: [GardenAdmin, GardenStaff, RentalCoordinator, DevelopmentOfficer, Visitor]
    code: 200
    input: ["garden_id?"]
    output: ConservancyFund[]
    side_effects: []

  - method: POST
    path: "/v1/conservancy-funds/{fund_id}/close-campaign"
    description: "Close the match campaign (stops further match accrual)"
    roles: [DevelopmentOfficer]
    code: 200
    input: []
    output: ConservancyFund
    side_effects: ["campaign_status OPEN->CLOSED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Visitor X-User-ID is not the owning member of the resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced garden/plan/membership/slot/session/venue/rental/etc. does not exist" }
  - { id: ERR_VALIDATION, http: 422, condition: "Malformed body: missing required field, wrong type, or invalid enum value" }
  - { id: ERR_CROSS_GARDEN_REFERENCE, http: 422, condition: "Body FK target belongs to a different garden than the path garden" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_STALE_MEMBERSHIP_VERSION, http: 412, condition: "expected_membership_version does not match Membership.version on reservation create" }
  - { id: ERR_MEMBERSHIP_NOT_ACTIVE, http: 409, condition: "Operation requires an attached Membership in ACTIVE status (member admission / check-in)" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "ends_at <= starts_at on a slot or rental window" }
  - { id: ERR_HOUSEHOLD_CAP_EXCEEDED, http: 422, condition: "household_member_names length exceeds Garden.household_member_cap, or non-empty for a non-HOUSEHOLD tier" }
  - { id: ERR_INSUFFICIENT_GUEST_PASSES, http: 409, condition: "Reservation guest_heads exceeds Membership.guest_passes_remaining" }
  - { id: ERR_RECIPROCAL_NOT_ELIGIBLE, http: 422, condition: "reciprocal flag set but garden not in a network or membership not from a different network garden" }
  - { id: ERR_VENUE_DOUBLE_BOOKED, http: 409, condition: "Rental confirm collides with an existing CONFIRMED rental within the venue buffer window" }
  - { id: ERR_SLOT_CAPACITY_EXCEEDED, http: 409, condition: "Reservation party_size would push TimeSlot held_count over capacity" }
  - { id: ERR_SESSION_CLOSED, http: 409, condition: "Registration attempted against a CLOSED program session" }
  - { id: ERR_PLAN_INACTIVE, http: 409, condition: "Membership activation/reinstatement against an inactive MembershipPlan" }
  - { id: ERR_RENEWAL_WINDOW_NOT_OPEN, http: 409, condition: "Renew called before the 30-day window and auto_renew is false" }
  - { id: ERR_DONATION_VOIDED, http: 409, condition: "Void called on an already-VOIDED donation" }
  - { id: ERR_CAMPAIGN_CLOSED, http: 409, condition: "Close-campaign called on an already-CLOSED conservancy fund" }
  - { id: ERR_FUND_ALREADY_EXISTS, http: 409, condition: "A conservancy fund already exists for this garden (one per garden)" }
  - { id: ERR_INVALID_HEAD_SPLIT, http: 422, condition: "Reservation head counts negative, all-zero party, or member/guest heads claimed with no attached membership" }
  - { id: ERR_REFUND_NOT_ALLOWED, http: 409, condition: "Event-ticket refund attempted on a ticket not in PURCHASED status" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: GardenAdmin
    description: "Garden operator: manages gardens, catalogs (plans, slots, sessions), and administrative overrides (force lapse)."
    identity: opaque
    exclusive_operations:
      - "POST /gardens — create garden"
      - "POST /v1/membership-plans — create plan"
      - "POST /_clock/set_current_utc — advance logical clock"
    shared_operations:
      - "POST /v1/time-slots, /program-sessions, /venues — catalog creation (with GardenStaff/RentalCoordinator)"
      - "POST /v1/memberships/{id}/lapse — force lapse (with GardenStaff)"
      - "POST /v1/event-tickets/{id}/refund — refund (with GardenStaff)"
      - "POST /v1/conservancy-fund — create fund (with DevelopmentOfficer)"
      - "GET reads — all"

  - name: GardenStaff
    description: "Gate/registrar staff: checks in reservations, manages on-behalf-of operations, catalog support."
    identity: opaque
    exclusive_operations:
      - "POST /v1/reservations/{id}/check-in — gate check-in"
    shared_operations:
      - "POST memberships (+ activate/renew/reinstate/cancel/lapse) on behalf of visitors"
      - "POST reservations / event-tickets / registrations / donations on behalf of visitors"
      - "POST time-slots, program-sessions (+ close) — catalog support"
      - "GET reads — all"

  - name: RentalCoordinator
    description: "Manages venues and the rental approval lifecycle."
    identity: opaque
    exclusive_operations:
      - "POST /v1/rentals/{id}/confirm — confirm rental"
      - "POST /v1/rentals/{id}/reject — reject rental"
    shared_operations:
      - "POST /v1/venues — create venue (with GardenAdmin)"
      - "POST /v1/rentals — request rental (with Visitor)"
      - "POST /v1/rentals/{id}/cancel — cancel rental (with Visitor)"
      - "GET reads — all"

  - name: DevelopmentOfficer
    description: "Manages donations, the conservancy match campaign, and gift voiding."
    identity: opaque
    exclusive_operations:
      - "POST /v1/donations/{id}/void — void a gift"
      - "POST /v1/conservancy-fund/{id}/close-campaign — close campaign"
    shared_operations:
      - "POST /v1/donations — record donation (with Visitor/GardenStaff)"
      - "POST /v1/conservancy-fund — create fund (with GardenAdmin)"
      - "GET reads — all"

  - name: Visitor
    description: "Member or prospective member acting on their own memberships, reservations, registrations, tickets, rentals, and donations. X-User-ID is the member account id."
    identity: entity_backed:Membership
    exclusive_operations: []
    shared_operations:
      - "POST /v1/memberships (+ activate/renew/reinstate/cancel) — own membership lifecycle"
      - "POST /v1/reservations (+ cancel) — own reservations"
      - "POST /v1/event-tickets — buy tickets"
      - "POST /v1/registrations (+ withdraw) — program registration"
      - "POST /v1/rentals (+ cancel) — request/cancel rental"
      - "POST /v1/donations — give"
      - "GET reads — all"
