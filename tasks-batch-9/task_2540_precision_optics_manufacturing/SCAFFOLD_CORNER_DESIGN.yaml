            - "MetrologyReport.${rep2}.stage_figure_budget_waves == 0.0750"
            - "MetrologyReport.${rep2}.verdict == REWORK_REQUIRED"
            - "ProcessRun.${r2}.run_status == REWORK_REQUIRED"
            - "WorkOrder.${w1}.process_status == POLISHING (no declared REWORK transition leaves POLISHING)"
            - "WorkOrder.${w1}.figuring_iteration_count == 0"
            - "WorkOrder.${w1}.cumulative_removal_nm == 1100.0 and remaining_center_thickness_um == 6198.9000"

      - name: process_and_compliance_dimensions_advance_independently
        claim_type: valid_transition
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.WorkOrder.process_status
          - state_machines.WorkOrder.compliance_status
        distinguishing_aspect: |
          The `parallel` shape claim: the fabrication dimension and the export dimension of one work order
          must move on their own triggers and only meet at release-to-assembly, which refuses the order
          until BOTH dimensions are ready.
        excluded_because:
          difficulty_instance: work_order_process_and_compliance_dimensions_advance_independently
          rationale: |
            That §1.8 instance already interleaves the two dimensions on a single work order and asserts
            the full cross-product (COATED with UNCLASSIFIED refused, SCREENED with FIGURE_ACCEPTED
            refused, then CLEARED + COATED admitted), including the ledger move at the join point. A
            §1.9 instance would repeat the same call sequence and the same assertions.

      - name: glass_lot_block_cascades_to_orders_runs_and_instrument_minutes
        claim_type: side_effect_execution
        grounds:
          - state_machines.GlassLot.RELEASED_to_BLOCKED
          - calculations.instrument_minutes_ledger
          - complexity_profile.complexity_layers.cascading_side_effects
        distinguishing_aspect: |
          The Cascade-down claim on GlassLot block: the lot's four declared hops must all fire, in the
          pinned order, across three entity types, and only non-terminal children may be touched.
        excluded_because:
          difficulty_instance: glass_lot_block_cascade_holds_orders_cancels_runs_and_frees_instrument_minutes
          rationale: |
            That §1.8 instance blocks a lot carrying two work orders (one of them already CANCELLED to
            prove terminal children are skipped) with runs on two instruments, and asserts every hop
            plus the exact booked_minutes_total figures. Re-testing it here would add no distinct claim.

      - name: work_order_cancel_reverses_the_blank_reservation_exactly
        claim_type: side_effect_execution
        grounds:
          - state_machines.WorkOrder.BLANKS_RESERVED_to_CANCELLED
          - calculations.blank_conservation_ledger
        distinguishing_aspect: |
          The Compensation claim: cancelling a work order must undo the reservation with no drift, so the
          lot returns to exactly its pre-reservation ledger and the §1.3 invariant still holds.
        excluded_because:
          difficulty_instance: work_order_cancel_restores_glass_lot_blank_conservation
          rationale: |
            That §1.8 instance cancels one of two orders on the same lot and asserts the full
            before/after ledger of both, including that the surviving order's reservation is untouched
            and that the four-way invariant sums to total_blank_count. The corner is the same
            arithmetic.

      - name: documentation_review_rejection_returns_the_package_to_assembling
        claim_type: valid_transition
        grounds:
          - state_machines.DocumentationPackage.SUBMITTED_to_ASSEMBLING
          - calculations.documentation_completeness
        distinguishing_aspect: |
          The cyclic-loop claim on the documentation dimension: a REJECTED review must reopen the package
          for further documents and count the rejection, rather than terminating it.
        excluded_because:
          difficulty_instance: documentation_package_reject_loop_returns_to_assembling
          rationale: |
            That §1.8 instance drives ASSEMBLING -> SUBMITTED -> ASSEMBLING -> SUBMITTED -> APPROVED and
            asserts rejection_count, last_review_note and the completeness recomputation across the
            loop.

      - name: coating_strip_returns_the_run_to_loaded_with_its_spectral_outputs_cleared
        claim_type: valid_transition
        grounds:
          - state_machines.CoatingRun.VERIFIED_FAIL_to_LOADED
          - calculations.spectral_performance_verification
        distinguishing_aspect: |
          The first pass of the strip-and-recoat loop: the run must return to LOADED with its samples and
          all three spectral outputs reset, while the work order stays in COATING.
        excluded_because:
          difficulty_instance: coating_run_strip_and_recoat_cycle_returns_to_loaded
          rationale: |
            That §1.8 instance already asserts the reset of spectral_samples, in_band_sample_count,
            band_average_reflectance_pct, worst_point_reflectance_pct and spectral_verdict on the first
            strip. The §1.9 instance second_strip_beyond_the_cycle_limit_scraps_the_run_and_the_order
            above covers only the distinct claim beyond the limit.

  # =======================================================================
  - section: calculations
    instances:

      - name: blank_reservation_sizing_rounds_the_spare_term_up_per_order
        claim_type: correct_result
        grounds:
          - calculations.blank_conservation_ledger
          - calculations.blank_conservation_ledger.constants.SPARE_BLANK_RATE
          - calculations.blank_conservation_ledger.constants.MIN_SPARE_BLANKS
          - entities.WorkOrder.fields.spare_blank_count
        distinguishing_aspect: |
          Two orders on the same lot pin both halves of the spare formula: element_count 3 gives
          ceil(0.75) == 1 which is also the MIN_SPARE_BLANKS floor, so reserved 4; element_count 8 gives
          ceil(2.0) == 2 with the floor inactive, so reserved 10. A server that rounds 0.75 to 1 by
          banker's or nearest rounding still gets 1 here, but one that truncates to 0 would produce 3 —
          and the lot ledger must end at exactly 6/14/0/0.
        test_recipe:
          setup:
            - "A RELEASED design OD-2540-A (aperture 120.0 mm, RMS 0.0400, tolerance budget 0.0800, transmitted-wavefront budget 0.1050, one 0.0375-wave ACTIVE allocation, verdict PASS) and a RELEASED lot GL-2540-1 with total_blank_count 20."
            - "The lot's version is re-read between the two creates because the first create bumps it (OCC guard on POST /optics/work-orders)."
            - "The logical clock stays at its start value 2026-08-01T00:00:00Z throughout."
          setup_api_calls:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/release"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/glass-lots"
              payload: { lot_code: "GL-2540-1", glass_type: "N-BK7", melt_index_nd: 1.516800, total_blank_count: 20, declared_index_homogeneity_grade: "H2", declared_striae_grade: "A" }
              as: ProcurementOfficer
              captures: { g1: $.data.id }
            - call: "POST /optics/glass-lots/${g1}/certification"
              payload: { measured_index_homogeneity_grade: "H3", measured_striae_grade: "B", certificate_reference: "CERT-2540-1" }
              as: ProcurementOfficer
              captures: { g1v: $.data.version }
          trigger:
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-A", design_id: "${d1}", glass_lot_id: "${g1}", element_count: 3, expected_glass_lot_version: "${g1v}" }
              as: ProcessTechnician
              captures: { w1: $.data.id }
            - call: "GET /optics/glass-lots/${g1}"
              payload: {}
              as: ProcurementOfficer
              captures: { g1v2: $.data.version }
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-B", design_id: "${d1}", glass_lot_id: "${g1}", element_count: 8, expected_glass_lot_version: "${g1v2}" }
              as: ProcessTechnician
              captures: { w2: $.data.id }
            - call: "GET /optics/glass-lots/${g1}"
              payload: {}
              as: ProcurementOfficer
          assert:
            - "both creates return HTTP 201"
            - "WorkOrder.${w1}.spare_blank_count == 1 and reserved_blank_count == 4"
            - "WorkOrder.${w2}.spare_blank_count == 2 and reserved_blank_count == 10"
            - "GlassLot.${g1}.reserved_blank_count == 14"
            - "GlassLot.${g1}.available_blank_count == 6"
            - "GlassLot.${g1}.consumed_blank_count == 0 and scrapped_blank_count == 0"
            - "20 == 6 + 14 + 0 + 0, so the §1.3 blank_conservation_ledger invariant holds"
            - "GlassLot.${g1}.version == 4 (create 1, certification 2, and one bump per work order)"

      - name: retired_tolerance_allocations_are_excluded_from_both_stack_variants
        claim_type: input_set_filtering
        grounds:
          - calculations.tolerance_stack_analysis.input_set
          - endpoints.POST_/optics/tolerance-allocations/{id}/retire
          - entities.ToleranceAllocation.fields.allocation_status
          - endpoints.GET_/optics/optical-designs/{id}/tolerance-allocations
        distinguishing_aspect: |
          The analysis enumerates ACTIVE allocations only: with a 0.0375-wave contributor ACTIVE and a
          0.0400-wave contributor RETIRED the stack must read 0.0375 on both variants, not the 0.0548 /
          0.0775 pair the full set would give — and the retired row must still be listable, so exclusion
          is a filter on the calculation, not a delete.
        test_recipe:
          setup:
            - "A DRAFT design OD-2540-A with two allocations: SURFACE_IRREGULARITY 1.5 waves/unit * 0.0250 units == 0.0375 waves, and a second contributor 1.0 * 0.0400 == 0.0400 waves."
            - "The 0.0400-wave allocation has been retired, so exactly one ACTIVE row remains."
            - "Were the retired row still counted the analysis would give rss sqrt(0.0375^2 + 0.0400^2) == 0.0548 and worst_case 0.0775."
            - "The logical clock stays at its start value 2026-08-01T00:00:00Z throughout."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
              captures: { t1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "WEDGE_ANGLE", sensitivity_waves_per_unit: 1.0, manufacturing_tolerance_units: 0.0400 }
              as: OpticsEngineer
              captures: { t2: $.data.id }
            - call: "POST /optics/tolerance-allocations/${t2}/retire"
              payload: {}
              as: OpticsEngineer
          trigger:
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
            - call: "GET /optics/optical-designs/${d1}"
              payload: {}
              as: OpticsEngineer
            - call: "GET /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { allocation_status: "ACTIVE", limit: 10, offset: 0 }
              as: OpticsEngineer
            - call: "GET /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { allocation_status: "RETIRED", limit: 10, offset: 0 }
              as: OpticsEngineer
          assert:
            - "the analysis returns HTTP 200"
            - "OpticalDesign.${d1}.rss_stack_waves == 0.0375"
            - "OpticalDesign.${d1}.worst_case_stack_waves == 0.0375"
            - "OpticalDesign.${d1}.governing_stack_waves == 0.0375 and allocated_tolerance_waves == 0.0375"
            - "OpticalDesign.${d1}.tolerance_verdict == PASS and design_status == TOLERANCED"
            - "the ACTIVE listing returns total_count == 1 with data[0].id == ${t1} and data[0].contribution_waves == 0.0375"
            - "the RETIRED listing returns total_count == 1 with data[0].id == ${t2} and data[0].contribution_waves == 0.0400"
            - "ToleranceAllocation.${t2}.allocation_status == RETIRED"

      - name: chamber_occupancy_excludes_the_run_that_already_passed_verification
        claim_type: input_set_filtering
        grounds:
          - calculations.chamber_capacity_occupancy.input_set
          - validations.priority_20
          - errors.ERR_CHAMBER_CAPACITY_EXCEEDED
          - state_machines.CoatingRun.DEPOSITED_to_VERIFIED_PASS
        distinguishing_aspect: |
          Occupancy counts only LOADED, DEPOSITED and VERIFIED_FAIL runs: on a one-slot chamber a second
          booking over the identical interval is refused while the first run is DEPOSITED, and the very
          same request is admitted once that run reaches VERIFIED_PASS — the interval arithmetic is
          unchanged, only the input set shrank.
        test_recipe:
          setup:
            - "A RELEASED design OD-2540-A (aperture 120.0 mm, RMS 0.0400, tolerance budget 0.0800, transmitted-wavefront budget 0.1050, one 0.0375-wave ACTIVE allocation, verdict PASS) and a RELEASED lot GL-2540-1 with total_blank_count 20."
            - "Two work orders WO-2540-A and WO-2540-B (element_count 2 each) on the same lot, each carried to FIGURE_ACCEPTED on its own instrument so no metrology window ever conflicts (IF-2540-1 for A, IF-2540-2 for B, both windows 08:00-10:00 and 11:00-12:00)."
            - "Chamber CH-2540-1 has slot_capacity 1. Work order A's coating run holds 2026-08-02T08:00-12:00 and has been deposited (coating_status DEPOSITED)."
            - "The logical clock stays at its start value 2026-08-01T00:00:00Z throughout."
          setup_api_calls:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/release"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/glass-lots"
