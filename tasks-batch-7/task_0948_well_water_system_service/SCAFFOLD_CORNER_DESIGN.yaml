      - name: corner_error_unauthenticated_outranks_role_and_path_existence
        claim_type: Violation to Error
        grounds: ["errors[ERR_UNAUTHENTICATED]", "validations[priority=1]", "gate_precedence.order", "roles"]
        distinguishing_aspect: |
          G1_AUTH is rank 1, so a request whose X-User-Role is absent or is not one of
          the seven declared roles is answered 401 ERR_UNAUTHENTICATED even when the
          same request would ALSO fail G2 (the role is not on the endpoint) and G3 (the
          path id resolves to nothing). Both trigger calls present the non-declared
          role "Anonymous", which stands for a missing or unrecognised X-User-Role
          header. An implementation that resolves the path first answers 404, and one
          that maps unknown roles onto the authorization gate answers 403.
        test_recipe:
          setup: ["Empty database; only the logical clock has been advanced."]
          setup_api_calls:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /water-service/accounts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: Anonymous
