# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x 2 instances = 18 instances. Every grounds[] resolves into SCAFFOLD.yaml.
# All numeric asserts are pre-computed literals (round-half-up, basis 365).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: redemption_payoff_vs_premium_refund_on_certificate
        grounds:
          - calculations.redemption_payoff
          - calculations.investor_escrow
          - state_machines.Certificate.ACTIVE_to_REDEEMED
          - entities.Redemption.fields.total_payoff_cents
        distinguishing_aspect: "redemption_payoff (Certificate domain) computes the OWNER's payoff and excludes any premium when premium_earns_interest=false; the same data under a premium county adds a premium_refund — two valid payoff interpretations on the Certificate domain produce 163065 vs 135082."
        test_recipe:
          setup:
            - "County CA: max 1600bps, bid_down_increment 100, redemption_period 365d, penalty 500bps, sub_tax rate 1600bps, premium disabled, premium_earns_interest false, basis 365."
            - "Parcel base_tax_due 100000c. Listing on an OPEN sale; investor I1 escrow 200000c bids RATE_BID_DOWN 1200bps and wins; certificate issued at 2026-03-01 rate 1200bps."
            - "One sub-tax 50000c posted by holder at 2026-06-01. Redeem at 2026-09-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: CountyTreasurer
            - call: "POST /counties"
              payload: { name: "CA County", state_code: "CA", max_interest_rate_bps: 1600, bid_down_increment_bps: 100, redemption_period_days: 365, sub_tax_interest_rate_bps: 1600, penalty_rate_bps: 500, premium_bidding_enabled: false, premium_earns_interest: false, day_count_basis: 365 }
              as: CountyTreasurer
              captures: { county_id: $.data.id }
            - call: "POST /counties/${county_id}/parcels"
              payload: { apn: "A-1", owner_name: "Owner One", assessed_value_cents: 5000000, base_tax_due_cents: 100000 }
              as: CountyTreasurer
              captures: { parcel_id: $.data.id }
            - call: "POST /investors"
              payload: { legal_name: "Investor One", tax_id: "TIN-1" }
              as: Investor
              captures: { i1_id: $.data.id }
            - call: "POST /investors/${i1_id}/deposits"
              payload: { amount_cents: 200000 }
              as: Investor
              as_user_id: "${i1_id}"
            - call: "POST /counties/${county_id}/sales"
              payload: { sale_name: "Spring Sale", scheduled_at: "2026-03-01T00:00:00Z" }
              as: CountyTreasurer
              captures: { sale_id: $.data.id }
            - call: "POST /counties/${county_id}/sales/${sale_id}/listings"
              payload: { parcel_id: "${parcel_id}" }
              as: CountyTreasurer
              captures: { listing_id: $.data.id, listing_v: $.data.version }
            - call: "POST /counties/${county_id}/sales/${sale_id}/open"
              payload: {}
              as: CountyTreasurer
            - call: "POST /counties/${county_id}/sales/${sale_id}/listings/${listing_id}/bids"
              payload: { investor_id: "${i1_id}", rate_bps: 1200, expected_listing_version: "${listing_v}" }
              as: Investor
              as_user_id: "${i1_id}"
            - call: "POST /counties/${county_id}/sales/${sale_id}/close"
              payload: {}
              as: CountyTreasurer
            - call: "GET /counties/${county_id}/certificates"
              payload: { parcel_id: "${parcel_id}" }
              as: CountyTreasurer
              captures: { cert_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CountyTreasurer
            - call: "GET /counties/${county_id}/certificates/${cert_id}"
              payload: {}
              as: Investor
              as_user_id: "${i1_id}"
              captures: { cert_v: $.data.version }
            - call: "POST /counties/${county_id}/certificates/${cert_id}/sub-taxes"
              payload: { investor_id: "${i1_id}", tax_year: 2026, principal_cents: 50000, expected_certificate_version: "${cert_v}" }
              as: Investor
              as_user_id: "${i1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CountyTreasurer
          trigger:
            - call: "POST /counties/${county_id}/certificates/${cert_id}/redeem"
              payload: {}
              as: CountyTreasurer
              captures: { redemption_id: $.data.id, total: $.data.total_payoff_cents }
          assert:
            - "Redemption.face_interest_cents == 6049"
            - "Redemption.penalty_cents == 5000"
            - "Redemption.sub_tax_interest_cents == 2016"
            - "Redemption.premium_refund_cents == 0"
            - "Redemption.total_payoff_cents == 163065"
            - "Certificate.${cert_id}.status == REDEEMED"

      - name: premium_refund_with_interest_on_premium_county
        grounds:
          - calculations.redemption_payoff
          - calculations.award_winner
          - entities.Certificate.fields.premium_cents
          - entities.Redemption.fields.premium_refund_cents
        distinguishing_aspect: "On a PREMIUM county with premium_earns_interest=true, redemption_payoff returns premium 25000 PLUS its accrued interest 2016 (premium_refund 27016) and face accrues at the county ceiling 1600bps; total 135082 differs from the bid-down variant's 163065 on identical face/dates."
        test_recipe:
          setup:
            - "County FL: max 1600bps, premium enabled, premium_earns_interest true, penalty 0, basis 365, redemption 365d."
            - "Parcel base_tax 100000c. PREMIUM sale; I1 (escrow 200000) bids premium 25000c and wins; certificate rate 1600bps premium 25000c issued 2026-03-01."
            - "No sub-tax. Redeem at 2026-09-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: CountyTreasurer
            - call: "POST /counties"
              payload: { name: "FL County", state_code: "FL", max_interest_rate_bps: 1600, bid_down_increment_bps: 100, redemption_period_days: 365, sub_tax_interest_rate_bps: 1600, penalty_rate_bps: 0, premium_bidding_enabled: true, premium_earns_interest: true, day_count_basis: 365 }
              as: CountyTreasurer
              captures: { county_id: $.data.id }
            - call: "POST /counties/${county_id}/parcels"
              payload: { apn: "B-1", owner_name: "Owner B", assessed_value_cents: 5000000, base_tax_due_cents: 100000 }
              as: CountyTreasurer
              captures: { parcel_id: $.data.id }
            - call: "POST /investors"
              payload: { legal_name: "Investor One", tax_id: "TIN-B1" }
              as: Investor
              captures: { i1_id: $.data.id }
            - call: "POST /investors/${i1_id}/deposits"
              payload: { amount_cents: 200000 }
              as: Investor
              as_user_id: "${i1_id}"
            - call: "POST /counties/${county_id}/sales"
              payload: { sale_name: "Premium Sale", scheduled_at: "2026-03-01T00:00:00Z" }
              as: CountyTreasurer
              captures: { sale_id: $.data.id }
            - call: "POST /counties/${county_id}/sales/${sale_id}/listings"
              payload: { parcel_id: "${parcel_id}" }
              as: CountyTreasurer
              captures: { listing_id: $.data.id, listing_v: $.data.version }
            - call: "POST /counties/${county_id}/sales/${sale_id}/open"
              payload: {}
              as: CountyTreasurer
            - call: "POST /counties/${county_id}/sales/${sale_id}/listings/${listing_id}/bids"
              payload: { investor_id: "${i1_id}", premium_cents: 25000, expected_listing_version: "${listing_v}" }
              as: Investor
              as_user_id: "${i1_id}"
            - call: "POST /counties/${county_id}/sales/${sale_id}/close"
              payload: {}
              as: CountyTreasurer
            - call: "GET /counties/${county_id}/certificates"
              payload: { parcel_id: "${parcel_id}" }
              as: CountyTreasurer
              captures: { cert_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CountyTreasurer
          trigger:
            - call: "POST /counties/${county_id}/certificates/${cert_id}/redeem"
              payload: {}
              as: CountyTreasurer
              captures: { total: $.data.total_payoff_cents }
          assert:
            - "Certificate.${cert_id}.rate_bps == 1600"
            - "Certificate.${cert_id}.premium_cents == 25000"
            - "Redemption.face_interest_cents == 8066"
            - "Redemption.premium_refund_cents == 27016"
            - "Redemption.penalty_cents == 0"
            - "Redemption.total_payoff_cents == 135082"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: subtax_interest_round_per_subtax_then_sum
        grounds:
          - calculations.redemption_payoff
          - calculations.face_interest_days
          - entities.Redemption.fields.sub_tax_interest_cents
        distinguishing_aspect: "Mode (b) nested rounding order: two sub-taxes of 33333c each accruing 30 days yield 438c each; round-per-sub-tax-then-sum = 876 (pinned), whereas sum-then-round = 877 — the scaffold pins per-component rounding so total is 174545, not 174546."
        test_recipe:
          setup:
            - "County GA: max 1600, sub_tax rate 1600, penalty 0, basis 365, redemption 365d, bid-down."
            - "Parcel base_tax 100000c. I1 (escrow 300000) wins RATE_BID_DOWN 1200bps; certificate issued 2026-03-01."
            - "Two sub-taxes principal 33333c each (tax_year 2025 and 2026) both posted 2026-08-31 (30 days before redemption). Redeem 2026-09-30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: CountyTreasurer
            - call: "POST /counties"
              payload: { name: "GA County", state_code: "GA", max_interest_rate_bps: 1600, bid_down_increment_bps: 100, redemption_period_days: 365, sub_tax_interest_rate_bps: 1600, penalty_rate_bps: 0, premium_bidding_enabled: false, premium_earns_interest: false, day_count_basis: 365 }
              as: CountyTreasurer
              captures: { county_id: $.data.id }
            - call: "POST /counties/${county_id}/parcels"
              payload: { apn: "G-1", owner_name: "Owner G", assessed_value_cents: 5000000, base_tax_due_cents: 100000 }
              as: CountyTreasurer
              captures: { parcel_id: $.data.id }
            - call: "POST /investors"
              payload: { legal_name: "Investor One", tax_id: "TIN-G1" }
              as: Investor
              captures: { i1_id: $.data.id }
            - call: "POST /investors/${i1_id}/deposits"
              payload: { amount_cents: 300000 }
              as: Investor
              as_user_id: "${i1_id}"
            - call: "POST /counties/${county_id}/sales"
              payload: { sale_name: "GA Sale", scheduled_at: "2026-03-01T00:00:00Z" }
              as: CountyTreasurer
              captures: { sale_id: $.data.id }
            - call: "POST /counties/${county_id}/sales/${sale_id}/listings"
              payload: { parcel_id: "${parcel_id}" }
              as: CountyTreasurer
              captures: { listing_id: $.data.id, listing_v: $.data.version }
            - call: "POST /counties/${county_id}/sales/${sale_id}/open"
              payload: {}
              as: CountyTreasurer
            - call: "POST /counties/${county_id}/sales/${sale_id}/listings/${listing_id}/bids"
              payload: { investor_id: "${i1_id}", rate_bps: 1200, expected_listing_version: "${listing_v}" }
              as: Investor
              as_user_id: "${i1_id}"
            - call: "POST /counties/${county_id}/sales/${sale_id}/close"
              payload: {}
              as: CountyTreasurer
            - call: "GET /counties/${county_id}/certificates"
              payload: { parcel_id: "${parcel_id}" }
              as: CountyTreasurer
              captures: { cert_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: CountyTreasurer
            - call: "GET /counties/${county_id}/certificates/${cert_id}"
              payload: {}
              as: Investor
              as_user_id: "${i1_id}"
              captures: { cert_v1: $.data.version }
            - call: "POST /counties/${county_id}/certificates/${cert_id}/sub-taxes"
              payload: { investor_id: "${i1_id}", tax_year: 2025, principal_cents: 33333, expected_certificate_version: "${cert_v1}" }
              as: Investor
              as_user_id: "${i1_id}"
            - call: "GET /counties/${county_id}/certificates/${cert_id}"
              payload: {}
              as: Investor
              as_user_id: "${i1_id}"
              captures: { cert_v2: $.data.version }
            - call: "POST /counties/${county_id}/certificates/${cert_id}/sub-taxes"
              payload: { investor_id: "${i1_id}", tax_year: 2026, principal_cents: 33333, expected_certificate_version: "${cert_v2}" }
              as: Investor
              as_user_id: "${i1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T00:00:00Z" }
              as: CountyTreasurer
          trigger:
            - call: "POST /counties/${county_id}/certificates/${cert_id}/redeem"
              payload: {}
              as: CountyTreasurer
              captures: { total: $.data.total_payoff_cents }
          assert:
            - "Redemption.sub_tax_payoff_cents == 66666"
            - "Redemption.sub_tax_interest_cents == 876"
            - "Redemption.face_interest_cents == 7003"
            - "Redemption.total_payoff_cents == 174545"

      - name: minimum_bid_three_input_nonlinear_position
        grounds:
          - calculations.certificate_position
          - calculations.face_interest_days
          - entities.DeedApplication.fields.minimum_bid_cents
        distinguishing_aspect: "Mode (a) >=3-input non-linear formula: minimum_bid combines face-interest(face,rate,396d), penalty(face,penalty_bps), and per-sub-tax interest(principal,sub_rate,304d) summed component-wise plus deed_cost, evaluating to a frozen 204682 — distinct from the round-order axis of the sibling instance."
        test_recipe:
          setup:
            - "County TX: max 1600, sub_tax rate 1600, penalty 500bps, basis 365, redemption 365d, bid-down. premium disabled."
            - "Parcel base_tax 100000c. I1 (escrow 400000) wins 1200bps; certificate issued 2026-03-01."
            - "One sub-tax 50000c posted 2026-06-01. Clock advanced past deadline; deed application filed at 2027-04-01 with deed_cost 30000c."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: CountyTreasurer
            - call: "POST /counties"
              payload: { name: "TX County", state_code: "TX", max_interest_rate_bps: 1600, bid_down_increment_bps: 100, redemption_period_days: 365, sub_tax_interest_rate_bps: 1600, penalty_rate_bps: 500, premium_bidding_enabled: false, premium_earns_interest: false, day_count_basis: 365 }
              as: CountyTreasurer
              captures: { county_id: $.data.id }
            - call: "POST /counties/${county_id}/parcels"
              payload: { apn: "T-1", owner_name: "Owner T", assessed_value_cents: 9000000, base_tax_due_cents: 100000 }
              as: CountyTreasurer
              captures: { parcel_id: $.data.id }
            - call: "POST /investors"
              payload: { legal_name: "Investor One", tax_id: "TIN-T1" }
              as: Investor
              captures: { i1_id: $.data.id }
            - call: "POST /investors/${i1_id}/deposits"
              payload: { amount_cents: 400000 }
              as: Investor
              as_user_id: "${i1_id}"
            - call: "POST /counties/${county_id}/sales"
              payload: { sale_name: "TX Sale", scheduled_at: "2026-03-01T00:00:00Z" }
              as: CountyTreasurer
              captures: { sale_id: $.data.id }
            - call: "POST /counties/${county_id}/sales/${sale_id}/listings"
              payload: { parcel_id: "${parcel_id}" }
              as: CountyTreasurer
              captures: { listing_id: $.data.id, listing_v: $.data.version }
            - call: "POST /counties/${county_id}/sales/${sale_id}/open"
              payload: {}
              as: CountyTreasurer
            - call: "POST /counties/${county_id}/sales/${sale_id}/listings/${listing_id}/bids"
              payload: { investor_id: "${i1_id}", rate_bps: 1200, expected_listing_version: "${listing_v}" }
              as: Investor
              as_user_id: "${i1_id}"
            - call: "POST /counties/${county_id}/sales/${sale_id}/close"
              payload: {}
              as: CountyTreasurer
            - call: "GET /counties/${county_id}/certificates"
              payload: { parcel_id: "${parcel_id}" }
              as: CountyTreasurer
              captures: { cert_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CountyTreasurer
            - call: "GET /counties/${county_id}/certificates/${cert_id}"
              payload: {}
              as: Investor
              as_user_id: "${i1_id}"
              captures: { cert_v: $.data.version }
            - call: "POST /counties/${county_id}/certificates/${cert_id}/sub-taxes"
              payload: { investor_id: "${i1_id}", tax_year: 2026, principal_cents: 50000, expected_certificate_version: "${cert_v}" }
              as: Investor
              as_user_id: "${i1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-01T00:00:00Z" }
              as: CountyTreasurer
          trigger:
            - call: "POST /counties/${county_id}/certificates/${cert_id}/deed-applications"
              payload: { applicant_investor_id: "${i1_id}", deed_cost_cents: 30000 }
              as: Investor
              as_user_id: "${i1_id}"
              captures: { deed_id: $.data.id, min_bid: $.data.minimum_bid_cents }
          assert:
            - "DeedApplication.minimum_bid_cents == 204682"
            - "Certificate.${cert_id}.status == FORECLOSURE_PENDING"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: certificate_foreclosure_revision_loop
        grounds:
          - state_machines.Certificate.ACTIVE_to_FORECLOSURE_PENDING
          - state_machines.Certificate.FORECLOSURE_PENDING_to_ACTIVE
          - state_machines.DeedApplication.FILED_to_CANCELLED
        distinguishing_aspect: "Certificate has a cycle ACTIVE->FORECLOSURE_PENDING->ACTIVE (deed filed then cancelled), a non-linear shape distinct from any A->B->C pipeline, on the Certificate entity."
        test_recipe:
          setup:
            - "County, parcel, certificate issued 2026-03-01, redemption 365d. Clock at 2027-04-01 (past deadline)."
            - "Holder I1 escrow 400000 files a deed application (cert -> FORECLOSURE_PENDING), then treasurer cancels it (cert -> ACTIVE again)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: CountyTreasurer
            - call: "POST /counties"
              payload: { name: "Loop County", state_code: "AZ", max_interest_rate_bps: 1600, bid_down_increment_bps: 100, redemption_period_days: 365, sub_tax_interest_rate_bps: 1600, penalty_rate_bps: 0, premium_bidding_enabled: false, premium_earns_interest: false, day_count_basis: 365 }
              as: CountyTreasurer
              captures: { county_id: $.data.id }
            - call: "POST /counties/${county_id}/parcels"
              payload: { apn: "L-1", owner_name: "Owner L", assessed_value_cents: 5000000, base_tax_due_cents: 100000 }
              as: CountyTreasurer
              captures: { parcel_id: $.data.id }
            - call: "POST /investors"
              payload: { legal_name: "Investor One", tax_id: "TIN-L1" }
              as: Investor
              captures: { i1_id: $.data.id }
            - call: "POST /investors/${i1_id}/deposits"
              payload: { amount_cents: 400000 }
              as: Investor
              as_user_id: "${i1_id}"
            - call: "POST /counties/${county_id}/sales"
              payload: { sale_name: "L Sale", scheduled_at: "2026-03-01T00:00:00Z" }
              as: CountyTreasurer
              captures: { sale_id: $.data.id }
            - call: "POST /counties/${county_id}/sales/${sale_id}/listings"
              payload: { parcel_id: "${parcel_id}" }
              as: CountyTreasurer
              captures: { listing_id: $.data.id, listing_v: $.data.version }
            - call: "POST /counties/${county_id}/sales/${sale_id}/open"
              payload: {}
              as: CountyTreasurer
            - call: "POST /counties/${county_id}/sales/${sale_id}/listings/${listing_id}/bids"
              payload: { investor_id: "${i1_id}", rate_bps: 1200, expected_listing_version: "${listing_v}" }
              as: Investor
              as_user_id: "${i1_id}"
            - call: "POST /counties/${county_id}/sales/${sale_id}/close"
              payload: {}
              as: CountyTreasurer
            - call: "GET /counties/${county_id}/certificates"
              payload: { parcel_id: "${parcel_id}" }
              as: CountyTreasurer
              captures: { cert_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-01T00:00:00Z" }
              as: CountyTreasurer
            - call: "POST /counties/${county_id}/certificates/${cert_id}/deed-applications"
              payload: { applicant_investor_id: "${i1_id}", deed_cost_cents: 30000 }
              as: Investor
              as_user_id: "${i1_id}"
              captures: { deed_id: $.data.id }
          trigger:
            - call: "POST /counties/${county_id}/deed-applications/${deed_id}/cancel"
              payload: {}
              as: CountyTreasurer
          assert:
            - "DeedApplication.${deed_id}.status == CANCELLED"
            - "Certificate.${cert_id}.status == ACTIVE"

      - name: deed_application_branch_award_vs_cancel
        grounds:
          - state_machines.DeedApplication.FILED_to_AWARDED
          - state_machines.DeedApplication.FILED_to_CANCELLED
          - state_machines.Certificate.FORECLOSURE_PENDING_to_DEEDED
        distinguishing_aspect: "DeedApplication is a branching fork: FILED forks to AWARDED (drives Certificate->DEEDED, creates surplus) or CANCELLED (drives Certificate->ACTIVE) with divergent side-effect sets — non-linear on a different entity (DeedApplication) than the cycle instance (Certificate)."
        test_recipe:
          setup:
            - "Certificate FORECLOSURE_PENDING with a FILED deed application minimum_bid 204682. Clock 2027-04-01."
            - "Treasurer awards with sale_price 250000 -> DeedApplication AWARDED, Certificate DEEDED, surplus 45318 created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: CountyTreasurer
            - call: "POST /counties"
              payload: { name: "Branch County", state_code: "TX", max_interest_rate_bps: 1600, bid_down_increment_bps: 100, redemption_period_days: 365, sub_tax_interest_rate_bps: 1600, penalty_rate_bps: 500, premium_bidding_enabled: false, premium_earns_interest: false, day_count_basis: 365 }
              as: CountyTreasurer
              captures: { county_id: $.data.id }
            - call: "POST /counties/${county_id}/parcels"
              payload: { apn: "BR-1", owner_name: "Owner BR", assessed_value_cents: 9000000, base_tax_due_cents: 100000 }
              as: CountyTreasurer
              captures: { parcel_id: $.data.id }
            - call: "POST /investors"
              payload: { legal_name: "Investor One", tax_id: "TIN-BR1" }
              as: Investor
