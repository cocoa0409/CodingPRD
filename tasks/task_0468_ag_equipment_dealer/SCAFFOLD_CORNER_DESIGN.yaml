        claim_type: Violation → Error
        grounds: ["validations[priority=4]", "errors[ERR_INVALID_REQUEST]", entities.Deal.fields.sale_price_cents]
        distinguishing_aspect: "Quoting a Deal with sale_price_cents 0 (violates > 0) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["a Customer and an AVAILABLE Unit"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Neg Cust", customer_type: "RETAIL" }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { stock_number: "S-NG-1", condition: "NEW", model_code: "5045E", serial_number: "SN-NG-1", dealer_cost_cents: 3000000, list_price_cents: 4000000 }
              as: DealerAdmin
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /deals"
              payload: { unit_id: "${unit_id}", customer_id: "${cust_id}", deal_type: "SALE", sale_price_cents: 0 }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "response code == 422"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: tradein_not_offered_cannot_attach_to_deal
        claim_type: Cross-entity validation
        grounds: ["validations[priority=9]", "errors[ERR_TRADEIN_NOT_OFFERED]", state_machines.TradeIn]
        distinguishing_aspect: "Quoting a Deal referencing a TradeIn still in APPRAISED (not OFFERED) is rejected with ERR_TRADEIN_NOT_OFFERED."
        test_recipe:
          setup: ["a Customer, an AVAILABLE Unit, an APPRAISED (not offered) TradeIn"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "TN Cust", customer_type: "RETAIL" }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { stock_number: "S-TN-1", condition: "NEW", model_code: "6R165", serial_number: "SN-TN-1", dealer_cost_cents: 6000000, list_price_cents: 8000000 }
              as: DealerAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust_id}", model_code: "6155M", serial_number: "SN-TNTR-1", engine_hours: 500, condition_grade: "GOOD", base_value_cents: 3000000 }
              as: SalesRep
              captures: { ti_id: $.data.id }
          trigger:
            - call: "POST /deals"
              payload: { unit_id: "${unit_id}", customer_id: "${cust_id}", deal_type: "SALE", sale_price_cents: 8000000, tradein_id: "${ti_id}" }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TRADEIN_NOT_OFFERED"
            - "TradeIn.${ti_id}.status == APPRAISED"

