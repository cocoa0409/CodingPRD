              as: WorkforceAnalyst
              captures: { fga_id: "$.data.id" }
            - call: "POST /forecast-groups/${fga_id}/interval-plans"
              payload: { service_date: "2026-09-07" }
              as: WorkforceAnalyst
              captures: { ip0_id: "$.data[0].id" }
            - call: "POST /planning-cycles/${cyc_id}/posture"
              payload: { target_posture: "REQUIREMENTS_LOCKED" }
              as: CapacityPlanner
            - call: "POST /shift-templates"
              payload: { planning_cycle_id: "${cyc_id}", code: "T-MON", skill_code: "VOICE_EN", start_time_local: "08:00", duration_minutes: 480, days_of_week: [0], slots_total: 1, unpaid_break_minutes: 30 }
              as: SchedulingManager
              captures: { t_mon: "$.data.id" }
