              as: EquipmentController
            - call: "POST /ocean-billing/containers/${cntr_j}/issue-invoice"
              payload: {}
              as: BillingAgent
              captures: { inv_j: $.data.id }
            - call: "POST /ocean-billing/invoices/${inv_j}/disputes"
              payload: { dispute_reason: "FREE_TIME_MISCALC", contested_amount_cents: 45000, evidence_window_start: "2026-09-02T00:00:00Z", evidence_window_end: "2026-09-04T00:00:00Z", evidence_summary: "miscomputation" }
              as: CustomerRep
              as_user_id: "${acct_j}"
              captures: { dsp_j: $.data.id }
            - call: "POST /ocean-billing/disputes/${dsp_j}/withdraw"
              payload: {}
