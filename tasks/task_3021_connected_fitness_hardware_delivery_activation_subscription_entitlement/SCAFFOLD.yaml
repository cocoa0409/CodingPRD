# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header is absent, or X-User-Role is not a declared role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "The caller's role is not permitted for this operation, or an entity_backed role addresses a resource it does not own" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "A required input field is absent, an unknown field is supplied, or a value violates its declared type or enum domain" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "A path id or body foreign key does not resolve to an existing row" }
  - { id: ERR_MEMBERSHIP_STALE_VERSION, http: 412, condition: "expected_membership_version differs from the membership's current version" }
  - { id: ERR_DEVICE_STALE_VERSION, http: 412, condition: "expected_device_version differs from the device's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "The target resource is not in a state that admits the requested transition" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "A transition is requested from a terminal state (TERMINATED membership, SOLD batch, PAID_OFF plan, RESOLVED service order, ARCHIVED session)" }
  - { id: ERR_POSTURE_RESTRICTED, http: 409, condition: "The membership posture is RESTRICTED or FROZEN and the operation creates a new hardware order or a new financing plan" }
  - { id: ERR_CONCURRENT_LIMIT_EXCEEDED, http: 409, condition: "Beginning or restoring a stream would push active_user_count past concurrent_limit_effective and no non-owner eviction candidate exists" }
  - { id: ERR_STAIR_CAP_EXCEEDED, http: 409, condition: "stair_flights exceeds 5 while has_elevator is false, so the stagger-carry safety cap would be breached" }
  - { id: ERR_TEMPORAL_OVERLAP, http: 409, condition: "The proposed half-open window overlaps an existing open window on the same crew or the same instructor" }
  - { id: ERR_LICENSE_WINDOW_INVALID, http: 409, condition: "The session window is not contained in the instructor licensing window, or license_starts_at is not before starts_at" }
  - { id: ERR_WINDOW_NOT_OPEN, http: 409, condition: "The logical clock sits outside the session, appointment or library window required for the operation" }
  - { id: ERR_RESCHEDULE_LIMIT, http: 409, condition: "An appointment already carrying four completed reschedules is rescheduled again" }
  - { id: ERR_PAUSE_WINDOW_INVALID, http: 409, condition: "Pause end is not after pause start, or the requested pause exceeds 60 days" }
  - { id: ERR_UNPAID_FINANCING_BLOCK, http: 409, condition: "Pause, reactivation or new financing is attempted while unpaid_financing_count is at least 1" }
  - { id: ERR_SAFETY_DISABLE_FORBIDDEN, http: 409, condition: "Any request that would clear safety_gate_open or set FinancingPlan.safety_disable_latched to true is refused" }
  - { id: ERR_PART_SKU_MISMATCH, http: 409, condition: "The reserved part's compatible_sku differs from the device's hardware_sku" }
  - { id: ERR_PART_MISMATCH_SAFETY, http: 409, condition: "A safety-critical fault would be resolved with an incompatible or absent part" }
  - { id: ERR_PART_SAFETY_STOCK, http: 409, condition: "The reservation would drop on_hand_qty below safety_stock_qty" }
  - { id: ERR_PART_INSUFFICIENT, http: 409, condition: "on_hand_qty is zero and the fault is COSMETIC, so the service order parks in DISPATCH_PENDING_PART" }
  - { id: ERR_PART_REQUIRED_FOR_SCHEDULING, http: 409, condition: "A COSMETIC service order is scheduled with no part reserved" }
  - { id: ERR_DEVICE_SERIAL_MISMATCH, http: 409, condition: "The serial supplied to the link endpoint differs from the device's registered serial" }
  - { id: ERR_DEVICE_NOT_ON_MEMBERSHIP, http: 409, condition: "The device referenced by an enrollment or order does not belong to the addressed membership" }
  - { id: ERR_ORDER_MEMBERSHIP_MISMATCH, http: 409, condition: "The hardware order and the membership addressed by a financing plan or activation do not agree" }
  - { id: ERR_CERTIFYING_DEVICE_NOT_ELIGIBLE, http: 409, condition: "The refurbishment source device is neither DECOMMISSIONED nor itself resale-originated" }
  - { id: ERR_CERTIFICATION_CHAIN_EXCEEDED, http: 409, condition: "The certification lineage depth would exceed 3" }
  - { id: ERR_CERTIFICATION_CYCLE, http: 409, condition: "The certification lineage self-loops on the source device" }
  - { id: ERR_WARRANTY_RESET_NOT_ELIGIBLE, http: 409, condition: "A resale warranty reset is attempted on a device whose provenance_source is not RESALE" }
  - { id: ERR_CLASS_CAPACITY_EXCEEDED, http: 409, condition: "An ON_DEMAND enrollment is attempted outside the library window or against an unpublishable session" }
  - { id: ERR_CONTENT_LOCKED, http: 409, condition: "The device content_access_allowed is false because the membership posture is FROZEN or the device carries an entitlement lock" }
  - { id: ERR_OWNER_ALREADY_EXISTS, http: 409, condition: "A second OWNER household user is added to the same membership" }
  - { id: ERR_INSTALLMENT_COUNT_EXCEEDED, http: 409, condition: "term_months is not in {6, 12, 24}, or an installment is paid beyond term_months" }
  - { id: ERR_PLAN_ALREADY_PAID_OFF, http: 409, condition: "An installment is paid against a PAID_OFF plan" }
  - { id: ERR_REFUND_DISPUTE_DENIED, http: 409, condition: "A redemptive credit is requested against an order whose refund dispute resolution is DENIED (fiscal priority: this check outranks the purchase-block gate)" }
  - { id: ERR_PURCHASE_BLOCKED, http: 409, condition: "The membership posture is RESTRICTED or FROZEN, so a new purchase or redemptive credit is refused" }
  - { id: ERR_DISPATCH_DEVICE_NOT_OPERATIONAL, http: 409, condition: "A repair is scheduled for a device whose activation_status is DECOMMISSIONED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: MembershipOwner
    description: "Household owner acting on their own membership and its children"
    identity: "entity_backed:Membership"
    exclusive_operations:
      - "POST /fitness/memberships/{membershipId}/pause, resume, cancel, reactivate, activate"
      - "POST /fitness/memberships/{membershipId}/household-users"
      - "POST /fitness/class-enrollments/{enrollmentId}/complete and /drop"
      - "POST /fitness/hardware-orders/{orderId}/cancel"
    shared_operations:
      - "POST /fitness/class-enrollments"
      - "POST /fitness/service-orders"
      - "GET /fitness/memberships/{membershipId}/summary and all owner-scoped reads"

  - name: ServiceTechnician
    description: "Field crew who performs delivery, installation, parts reservation and repair"
    identity: "opaque"
    exclusive_operations:
      - "POST /fitness/delivery-appointments/{appointmentId}/start, complete, fail, reschedule"
      - "POST /fitness/service-orders/{serviceOrderId}/start-repair"
      - "POST /fitness/refurb-batches/{batchId}/open inspection and certify"
    shared_operations:
      - "POST /fitness/devices/{deviceId}/link"
      - "POST /fitness/service-orders/{serviceOrderId}/reserve-part and /schedule and /resolve and /fail-repair"
      - "POST /fitness/delivery-appointments and /schedule"

  - name: Instructor
    description: "Class instructor who owns a licensing window and the class library entries under it"
    identity: "opaque"
    exclusive_operations:
      - "POST /fitness/class-sessions/{sessionId}/publish and /cancel"
      - "POST /fitness/class-sessions"
    shared_operations:
      - "GET /fitness/class-sessions/{sessionId}/leaderboard"

  - name: PlatformAdmin
    description: "Operations administrator covering parts inventory, underwriting, refurbishment resale and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /fitness/parts-inventory and /restock"
      - "POST /fitness/refurb-batches/{batchId}/list and /sell"
      - "POST /fitness/financing-plans/{planId}/installments/fail and /rolling-correction"
      - "POST /fitness/_run_ops and /fitness/_clock/set_current_utc"
    shared_operations:
      - "POST /fitness/financing-plans"
      - "POST /fitness/memberships/{membershipId}/* lifecycle actions"
      - "every read endpoint"

  - name: Anonymous
    description: "Unauthenticated caller, permitted only to consume a verification token that was already issued"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /fitness/household-users/{userId}/verify"
