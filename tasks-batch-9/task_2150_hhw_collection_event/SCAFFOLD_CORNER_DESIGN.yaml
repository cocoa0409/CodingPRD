        claim_type: role_denied_ops
        grounds: ["roles.UnloadTech", "roles.EventCoordinator", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "POST /hhw/sites is an EventCoordinator-exclusive operation, so an UnloadTech attempt returns ERR_UNAUTHORIZED_ROLE (403) and stores nothing."
        test_recipe:
          setup: ["One program"]
