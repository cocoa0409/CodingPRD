            - call: "POST /ei/provider-authorizations"
              payload: { ifsp_service_id: "${svc_id}", provider_id: "${prov1_id}", start_date: "2026-04-01", end_date: "2026-04-30", authorized_units: 24 }
              as: ProgramAdmin
              captures: { authA_id: $.data.id }
          trigger:
            - call: "POST /ei/provider-authorizations"
              payload: { ifsp_service_id: "${svc_id}", provider_id: "${prov2_id}", start_date: "2026-04-30", end_date: "2026-05-31", authorized_units: 12 }
              as: ProgramAdmin
            - call: "POST /ei/provider-authorizations"
              payload: { ifsp_service_id: "${svc_id}", provider_id: "${prov3_id}", start_date: "2026-04-30", end_date: "2026-05-31", authorized_units: 12 }
              as: ProgramAdmin
            - call: "GET /ei/provider-authorizations?ifsp_service_id=${svc_id}"
              as: ProgramAdmin
          assert:
            - "First trigger call: response.error.error_id == \"ERR_PROVIDER_CREDENTIAL_EXPIRED\" with HTTP 422, NOT ERR_AUTHORIZATION_WINDOW_OVERLAP, because priority 31 precedes priority 43"
            - "Second trigger call: response.error.error_id == \"ERR_AUTHORIZATION_WINDOW_OVERLAP\" with HTTP 409, proving the constraint rule is reachable once the credential rule passes"
            - "Third trigger call: the list contains exactly one ProviderAuthorization, the pre-existing ${authA_id}"
            - "IFSPService.${svc_id}.units_committed == 24 and units_pool_remaining == 72, unchanged by both rejections"
            - "ProviderAuthorization.${authA_id}.status == \"ACTIVE\" with authorized_units == 24 and units_remaining == 24"

  # ===========================================================================
  # RULE 6 — boundary_precision_check
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: caseload_cap_exact_equality_admits_assignment
        grounds:
          - validations[priority 49 -> ERR_CASELOAD_CAP_EXCEEDED]
          - calculations.coordinator_auto_selection
          - calculations.coordinator_caseload_aggregates
          - endpoints[POST /ei/referrals/{referralId}/assign-coordinator]
          - endpoints[GET /ei/service-coordinators/{coordinatorId}/caseload-summary]
        distinguishing_aspect: |
          This instance sits exactly ON the caseload ceiling: with a 3.00-point coordinator, the second
          1.50-point case lands on 3.00 and MUST be admitted because the cap comparison is inclusive,
          while the third case is refused. It also pins the posture ladder at equality (AT_CAP, not
          NEAR_CAP and not OVER) and the 4-decimal utilization value 1.0000. An implementation using
          a strict less-than comparison fails the admitted case; one using >= for OVER mislabels the
          posture. The other boundary instances test a day-count threshold and an empty input set.
        test_recipe:
          setup:
            - "One ACTIVE coordinator in CNT_A speaking EN with max_weighted_caseload_points 3.00."
            - "Three children born 2024-06-15, all in CNT_A, so no case earns the transition-window term."
            - "Three referrals received 2026-03-02 in CNT_A with interpreter_required false, so each pre-plan case is worth exactly 1.50 points."
            - "Referral 1 is already assigned, leaving weighted_caseload_points at 1.50 and utilization_ratio at 0.5000."
            - "Logical clock at 2026-03-02T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/service-coordinators"
              payload: { full_name: "Dana Reyes", county_code: "CNT_A", language_codes: ["EN"], max_weighted_caseload_points: 3.00 }
              as: ProgramAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /ei/children"
              payload: { first_name: "Ada", last_name: "Nolan", date_of_birth: "2024-06-15", county_code: "CNT_A", primary_language: "EN" }
              as: IntakeSpecialist
              captures: { child1_id: $.data.id }
            - call: "POST /ei/children"
              payload: { first_name: "Bram", last_name: "Ostro", date_of_birth: "2024-06-15", county_code: "CNT_A", primary_language: "EN" }
              as: IntakeSpecialist
              captures: { child2_id: $.data.id }
            - call: "POST /ei/children"
              payload: { first_name: "Cleo", last_name: "Prine", date_of_birth: "2024-06-15", county_code: "CNT_A", primary_language: "EN" }
              as: IntakeSpecialist
              captures: { child3_id: $.data.id }
            - call: "POST /ei/referrals"
              payload: { child_id: "${child1_id}", primary_referral_source: "PHYSICIAN", referral_received_date: "2026-03-02", county_code: "CNT_A", presenting_concern: "Expressive language delay noted at the 20-month well-child visit", interpreter_required: false }
              as: IntakeSpecialist
              captures: { ref1_id: $.data.id }
            - call: "POST /ei/referrals"
              payload: { child_id: "${child2_id}", primary_referral_source: "PARENT", referral_received_date: "2026-03-02", county_code: "CNT_A", presenting_concern: "Parent reports the child is not yet walking independently", interpreter_required: false }
              as: IntakeSpecialist
              captures: { ref2_id: $.data.id }
            - call: "POST /ei/referrals"
              payload: { child_id: "${child3_id}", primary_referral_source: "CHILD_CARE", referral_received_date: "2026-03-02", county_code: "CNT_A", presenting_concern: "Child care staff report limited peer interaction and few words", interpreter_required: false }
              as: IntakeSpecialist
              captures: { ref3_id: $.data.id }
            - call: "POST /ei/referrals/${ref1_id}/assign-coordinator"
              payload: { coordinator_id: "${coord_id}" }
              as: ProgramAdmin
          trigger:
            - call: "POST /ei/referrals/${ref2_id}/assign-coordinator"
              payload: { coordinator_id: "${coord_id}" }
              as: ProgramAdmin
            - call: "GET /ei/service-coordinators/${coord_id}/caseload-summary"
              as: ProgramAdmin
            - call: "POST /ei/referrals/${ref3_id}/assign-coordinator"
              payload: { coordinator_id: "${coord_id}" }
              as: ProgramAdmin
          assert:
            - "First trigger call succeeds: Referral.${ref2_id}.status == \"EVALUATION_PENDING\" with coordinator_id == ${coord_id} and case_weight_points == 1.50"
            - "ServiceCoordinator.${coord_id}.weighted_caseload_points == 3.00, exactly equal to max_weighted_caseload_points"
            - "ServiceCoordinator.${coord_id}.utilization_ratio == 1.0000 and active_case_count == 2"
            - "Second trigger call: response.data.caseload_posture == \"AT_CAP\" (not NEAR_CAP, not OVER) and response.data.headroom_points == 0.00"
            - "Third trigger call: response.error.error_id == \"ERR_CASELOAD_CAP_EXCEEDED\" with HTTP 409"
            - "Referral.${ref3_id}.status == \"INTAKE\" with coordinator_id == null and case_weight_points == 0"
            - "ServiceCoordinator.${coord_id}.weighted_caseload_points == 3.00 and active_case_count == 2 after the rejection"

      - name: lea_notification_lead_days_exactly_90_is_timely
        grounds:
          - calculations.transition_notification_timeliness
          - entities.TransitionPlan.fields.notification_lead_days
          - entities.TransitionPlan.fields.notification_compliance
          - endpoints[POST /ei/transition-plans/{transitionPlanId}/notify-lea]
        distinguishing_aspect: |
          This instance straddles the MINIMUM_LEAD_DAYS threshold by a single day using two children
          whose birthdays differ by three days: a lead of exactly 90 days (2026-10-17 to 2027-01-15)
          is TIMELY because the comparison is inclusive, while 89 days (2026-10-21 to 2027-01-18) is
          LATE. Both notifications are sent in the same request pair against the same clock, so the
          only difference is the day count itself. The other boundary instances test an inclusive
          points comparison and an empty aggregation set.
        test_recipe:
          setup:
            - "One coordinator in CNT_A with a 12.00-point ceiling."
            - "Child 1 born 2024-01-15 (third birthday 2027-01-15) and child 2 born 2024-01-18 (third birthday 2027-01-18), both in CNT_A."
            - "Both cases carried to ACTIVE_SERVICES on 2026-09-01 with one HOME service line each."
            - "Logical clock advanced to 2026-10-21T09:00:00Z, which is 86 and 89 days before the two third birthdays, so the 270-day transition window is open for both."
            - "Each case has a DRAFT TransitionPlan with conference_held_date 2026-10-15 and transition_steps_count 3, so priority 35 is satisfied."
