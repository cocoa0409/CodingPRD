      - name: contractor_suspension_reinstatement_cycle_versus_terminal_rejection
        grounds:
          - state_machines.Contractor.ENROLLED_ACTIVE_to_SUSPENDED
          - state_machines.Contractor.SUSPENDED_to_ENROLLED_ACTIVE
          - state_machines.Contractor.PENDING_ENROLLMENT_to_ENROLLMENT_REJECTED
          - entities.Contractor.fields.suspension_reason
          - endpoints.POST_/contractors/{id}/suspension
        distinguishing_aspect: |
          Non-linearity on the Contractor aggregate, and of a third shape: a
          two-node CYCLE (ENROLLED_ACTIVE <-> SUSPENDED) that can be entered
          by two different triggers writing two different suspension_reason
          values, contrasted against a TERMINAL sibling state
          (ENROLLMENT_REJECTED) from which the very same reinstate call is
          refused. Neither counters nor parallel dimensions are involved.
        test_recipe:
          setup:
            - "An OPEN program with quality_suspension_threshold 70."
            - "Catalog: HP-HVAC-01 unit 800000 / cap 800000 / HVAC_GROUP / 200 A / anchor."
            - "Contractor A enrolled ENROLLED_ACTIVE with quality_score_rolling 100 and completed_inspection_count 0."
            - "Contractor B left in ENROLLMENT_REJECTED by a REJECT enrollment decision."
            - "A LOW-tier household, an APPROVED assessment and a DRAFT project of contractor A, plus one SCHEDULED SPOT inspection of that project (a SPOT result on a non-PAID project changes no money, so only the quality score moves)."
