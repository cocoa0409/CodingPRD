            - "LiabilityPeriod.${period_id}.version == ${p_v1} — the rejected replay did not bump the version"
            - "LiabilityPeriod.${period_id}.close_note == first and only close"
            - "LiabilityPeriod.${period_id}.restatement_count == 0 and restated_at == null"

      - name: settle_on_released_hold_is_rejected
