              as: PlatformAdmin
            - call: "POST /distribution-centers"
              payload: { code: "BOS", region: "NORTHEAST", local_zone: "America/New_York", local_cutoff_time: "06:00:00", utc_offset_minutes: -240, inbound_capacity_units: 10, transit_seconds: 86400 }
              as: PlatformAdmin
              captures: { bos_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_name: "Riverside Machine", delivery_zone: "America/New_York", home_region: "NORTHEAST" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "PS-1001", description: "Posture threshold item", material_spec: "steel", long_tail: false, unit_price_cents: 1000, unit_weight_kg: 0.10, curation_bundle_size: 20, curated_dimension_json: { nominal_length_mm: 10, nominal_width_mm: 10, nominal_height_mm: 10, drawing_revision: 1 } }
              as: CatalogCurator
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/attributes"
              payload: { attribute_name: "Grade", attribute_value: "8.8", unit_of_measure: "n/a" }
              as: CatalogCurator
            - call: "POST /curation-reviews"
              payload: { item_ids: ["${item_id}"] }
              as: CatalogCurator
            - call: "POST /stock"
              payload: { item_id: "${item_id}", dc_id: "${bos_id}", account_id: "${acct_id}", on_hand_units: 20, daily_demand_units: 2, inbound_daily_units: 2 }
              as: DCManager
              captures: { stock_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", lines: [{ item_id: "${item_id}", quantity: 1 }, { item_id: "${item_id}", quantity: 1 }, { item_id: "${item_id}", quantity: 1 }, { item_id: "${item_id}", quantity: 1 }, { item_id: "${item_id}", quantity: 1 }, { item_id: "${item_id}", quantity: 1 }, { item_id: "${item_id}", quantity: 1 }, { item_id: "${item_id}", quantity: 1 }, { item_id: "${item_id}", quantity: 1 }] }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/release"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_v: $.data.version }
          trigger:
            - call: "GET /distribution-centers/${bos_id}"
              payload: {}
              as: DCManager
            - call: "POST /orders/${order_id}/allocate"
              payload: { expected_order_version: "${order_v}" }
              as: CustomerAccount
              as_user_id: "${acct_id}"
            - call: "GET /distribution-centers/${bos_id}"
              payload: {}
              as: DCManager
            - call: "POST /orders/${order_id}/cancel"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
            - call: "GET /distribution-centers/${bos_id}"
              payload: {}
              as: DCManager
          assert:
            - "before the allocation, DistributionCenter.${bos_id}.inbound_reserved_units == 0 and operations_posture == OPEN"
            - "after the allocation, DistributionCenter.${bos_id}.inbound_reserved_units == 9 and operations_posture == RESTRICTED, because 9 is exactly the inclusive threshold ceil(10 * 0.90)"
            - "the threshold is inclusive: 9 reserved units already reads RESTRICTED while 8 would still read OPEN"
            - "after the cancel, DistributionCenter.${bos_id}.inbound_reserved_units == 0 and operations_posture == OPEN"
            - "InventoriedStock.${stock_id}.reserved_units returns to 0 after the cancel"

