              as: ProgramAdministrator
              captures: { pol_id: "$.data.id" }
            - call: "POST /league-policies/${pol_id}/cancel"
              payload: { cancel_reason: "league withdrew the application before the season opened" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /league-policies/${pol_id}/bind"
              payload: {}
