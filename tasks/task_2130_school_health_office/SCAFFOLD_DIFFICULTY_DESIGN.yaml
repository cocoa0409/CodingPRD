            - "MedicationStockLot.${lot_id}.quantity_on_hand == 5"
            - "MedicationStockLot.${lot_id}.quantity_reserved == 0"

      - name: conflict_d_coverage_overlap_outranks_nurse_hours_exceeded
        grounds:
          - validations[priority=33]
          - validations[priority=47]
          - errors[ERR_COVERAGE_OVERLAP]
          - errors[ERR_NURSE_HOURS_EXCEEDED]
          - calculations.nurse_minute_conservation
        distinguishing_aspect: |
          Error-category pair = `business_temporal` (priority 33,
          ERR_COVERAGE_OVERLAP) versus `business_fiscal` (priority 47,
          ERR_NURSE_HOURS_EXCEEDED) — a different pair from conflict A's
          `state` vs `business_safety`. One create violates both: the requested
          MON 900-1200 block overlaps the existing MON 480-960 block at the same
          school AND its 300 minutes exceed the nurse's 120 remaining uncommitted
          minutes; the temporal row must win.
        test_recipe:
          setup:
            - "School HOO09 and one RN whose weekly_contracted_minutes is 600."
            - "One existing CoverageAssignment MON [480, 960) at that school consuming 480 minutes, leaving committed_weekly_minutes 480 and uncommitted_weekly_minutes 120."
            - "Logical clock left at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Hoover Elementary", building_code: "HOO09", cot_capacity: 2, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /health-office/nurses"
              payload: { full_name: "Nils Bray", credential: "RN", weekly_contracted_minutes: 600, delegation_authorized: false }
              as: DistrictHealthAdmin
              captures: { rn_id: $.data.id }
            - call: "POST /health-office/coverage-assignments"
              payload: { nurse_id: "${rn_id}", school_id: "${sch_id}", weekday: "MON", start_minute: 480, end_minute: 960, effective_from: "2026-07-01T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { cov1_id: $.data.id }
            - call: "GET /health-office/nurses/${rn_id}"
              payload: {}
              as: DistrictHealthAdmin
              captures: { uncommitted_before: $.data.uncommitted_weekly_minutes }
          trigger:
            - call: "POST /health-office/coverage-assignments"
              payload: { nurse_id: "${rn_id}", school_id: "${sch_id}", weekday: "MON", start_minute: 900, end_minute: 1200, effective_from: "2026-07-01T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_COVERAGE_OVERLAP"
            - "data.error_id != ERR_NURSE_HOURS_EXCEEDED"
            - "Nurse.${rn_id}.committed_weekly_minutes == 480"
            - "Nurse.${rn_id}.uncommitted_weekly_minutes == 120"
            - "Nurse.${rn_id}.weekly_contracted_minutes == 600"
            - "GET /health-office/coverage-assignments?nurse_id=${rn_id} returns total_count == 1"

  - rule_id: boundary_precision_check
    instances:

      - name: triage_exactly_85_admits_ems_transport_83_does_not
        grounds:
          - calculations.visit_triage_score
          - validations[priority=28]
          - errors[ERR_EMS_DISPOSITION_NOT_JUSTIFIED]
          - entities.HealthVisit.fields.requires_ems_review
          - state_machines.HealthVisit.IN_ASSESSMENT_to_DISPOSITIONED
        distinguishing_aspect: |
          Metric = the numeric triage_score threshold, exercised through POST
          /health-office/health-visits/{id}/dispose: a visit scoring EXACTLY 85
          sets requires_ems_review true and its EMS_TRANSPORT disposition is
          accepted, while an otherwise identical visit scoring 83 is refused with
          ERR_EMS_DISPOSITION_NOT_JUSTIFIED. `>= 85` passes at the boundary where
          `> 85` would fail.
        test_recipe:
          setup:
            - "School EMS19 (cot_capacity 3) with one RN on an ACTIVE Monday block and NO medication stock lots, so stock_protocol_status is DEPLETED and coverage_posture is LIMITED (coverage_penalty 8)."
            - "Two ENROLLED students with identical profiles: allergy_severity ANAPHYLAXIS, chronic_condition_codes [ASTHMA], immunization_status NONCOMPLIANT, so both carry intake_risk_score 70 and risk_tier CRITICAL."
            - "Clock at 2026-08-03T09:00:00Z. Visit A is URGENT / MEDICATION (40 + 12 + min(25, 20+15) + 8 = 85). Visit B is URGENT / INJURY (40 + 10 + 25 + 8 = 83). Both have been assessed."
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Emerson Middle", building_code: "EMS19", cot_capacity: 3, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /health-office/nurses"
              payload: { full_name: "Rita Nolan", credential: "RN", weekly_contracted_minutes: 2400, delegation_authorized: false }
              as: DistrictHealthAdmin
              captures: { rn_id: $.data.id }
            - call: "POST /health-office/coverage-assignments"
              payload: { nurse_id: "${rn_id}", school_id: "${sch_id}", weekday: "MON", start_minute: 480, end_minute: 960, effective_from: "2026-07-01T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { cov_id: $.data.id }
            - call: "POST /health-office/students"
              payload: { school_id: "${sch_id}", full_name: "Kit Alvarez", grade_level: 6, date_of_birth: "2014-08-09T00:00:00Z", allergy_severity: "ANAPHYLAXIS", chronic_condition_codes: ["ASTHMA"], immunization_status: "NONCOMPLIANT" }
              as: DistrictHealthAdmin
              captures: { stu_a_id: $.data.id }
            - call: "POST /health-office/students"
              payload: { school_id: "${sch_id}", full_name: "Lia Novak", grade_level: 6, date_of_birth: "2014-10-25T00:00:00Z", allergy_severity: "ANAPHYLAXIS", chronic_condition_codes: ["ASTHMA"], immunization_status: "NONCOMPLIANT" }
              as: DistrictHealthAdmin
              captures: { stu_b_id: $.data.id }
            - call: "POST /health-office/_clock/set_current_utc"
