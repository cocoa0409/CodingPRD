          Zero-and-unit-count boundary on a different metric (the audit positive
          count) reached through a different endpoint
          (POST /sterilization/qualifications/{id}/dose-audits): 0 positives is a
          PASS with a 90-day interval, exactly 1 positive is a CONDITIONAL_PASS
          with a 30-day interval, and exactly 2 positives is a FAIL with a null
          interval - three verdicts separated by a single unit of a count.
