  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_member_version_on_upgrade
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[upgrade-stale-member]", "errors[ERR_STALE_MEMBER_VERSION]"]
        distinguishing_aspect: "A POST /members/{id}/upgrade carrying expected_member_version one behind the current Member.version is rejected with ERR_STALE_MEMBER_VERSION (412); a freeze between the read and the upgrade bumped the version."
        test_recipe:
          setup:
            - "BASIC(3000), PREMIUM(8000) plans. ACTIVE member; a freeze+unfreeze bumps Member.version so a stale upgrade fails."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier_code: "BASIC", monthly_fee_cents: 3000, weekly_uv_session_cap: 0 }
              as: SalonManager
              captures: { basic_id: $.data.id }
            - call: "POST /membership-plans"
              payload: { tier_code: "PREMIUM", monthly_fee_cents: 8000, weekly_uv_session_cap: 0 }
              as: SalonManager
              captures: { prem_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingSystem
            - call: "POST /members"
              payload: { full_name: "OCC Member", date_of_birth: "1990-01-01T00:00:00Z", skin_type: "IV", plan_id: "${basic_id}" }
              as: FrontDeskStaff
              captures: { m_id: $.data.id }
            - call: "POST /_billing/charge-first-dues"
              payload: { member_id: "${m_id}", outcome: "SUCCEEDED" }
              as: BillingSystem
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: BillingSystem
              captures: { v_act: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T00:00:00Z" }
              as: BillingSystem
            - call: "POST /members/${m_id}/freeze"
              payload: { expected_member_version: "${v_act}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { v_frozen: $.data.version }
            - call: "POST /members/${m_id}/unfreeze"
              payload: { expected_member_version: "${v_frozen}" }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /members/${m_id}/upgrade"
              payload: { new_plan_id: "${prem_id}", expected_member_version: "${v_act}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 412"
            - "response.data.error_id == ERR_STALE_MEMBER_VERSION"

      - name: occ_correct_version_upgrade_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[upgrade-stale-member]", entities.Member.fields.version]
        distinguishing_aspect: "A POST /members/{id}/upgrade carrying the current Member.version succeeds (200) and increments Member.version by 1."
        test_recipe:
          setup:
            - "BASIC(3000), PREMIUM(8000) plans. ACTIVE member; client uses the up-to-date version."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier_code: "BASIC", monthly_fee_cents: 3000, weekly_uv_session_cap: 0 }
              as: SalonManager
              captures: { basic_id: $.data.id }
            - call: "POST /membership-plans"
              payload: { tier_code: "PREMIUM", monthly_fee_cents: 8000, weekly_uv_session_cap: 0 }
              as: SalonManager
              captures: { prem_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingSystem
            - call: "POST /members"
              payload: { full_name: "OCC OK Member", date_of_birth: "1990-01-01T00:00:00Z", skin_type: "IV", plan_id: "${basic_id}" }
              as: FrontDeskStaff
              captures: { m_id: $.data.id }
            - call: "POST /_billing/charge-first-dues"
              payload: { member_id: "${m_id}", outcome: "SUCCEEDED" }
              as: BillingSystem
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: BillingSystem
              captures: { v_act: $.data.version }
            - call: "POST /_billing/set-upgrade-outcome"
              payload: { member_id: "${m_id}", outcome: "SUCCEEDED" }
              as: BillingSystem
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T00:00:00Z" }
              as: BillingSystem
          trigger:
            - call: "POST /members/${m_id}/upgrade"
              payload: { new_plan_id: "${prem_id}", expected_member_version: "${v_act}" }
