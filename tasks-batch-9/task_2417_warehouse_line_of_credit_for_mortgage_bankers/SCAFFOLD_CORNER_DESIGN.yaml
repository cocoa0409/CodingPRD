          Every one of the thirteen declared output fields is pinned in one call against a
          book that contains a live advance AND a purchased one, so the two conservation
          identities are checkable simultaneously:
          ledger_debit_total - ledger_credit_total == outstanding_principal_cents ==
          advance_outstanding_sum_cents. A purchased advance must contribute to BOTH ledger
