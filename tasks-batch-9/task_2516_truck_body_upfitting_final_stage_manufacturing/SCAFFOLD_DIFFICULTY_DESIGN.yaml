              as: PlantAdmin
              captures: { es_hoist: "$.data.id" }
            - call: "POST /upfit/customers"
              payload: { name: "Metro Fleet Services", account_code: "MFS-001", fleet_contact_email: "fleet@metro.example" }
              as: PlantAdmin
              captures: { cust: "$.data.id" }
            - call: "POST /upfit/build-configurations"
              payload: { config_code: "CFG-DUMP-B", chassis_model_id: "${cm_b}", body_spec_id: "${bs_dump}", standardization_tier: "CUSTOM" }
              as: UpfitEngineer
              as_user_id: "eng-1"
              captures: { cfg: "$.data.id" }
            - call: "POST /upfit/build-configurations/${cfg}/publish"
              payload: {}
              as: UpfitEngineer
              as_user_id: "eng-1"
            - call: "POST /upfit/chassis"
              payload: { vin: "1FDUF4HT0BB20003", chassis_model_id: "${cm_b}", ownership: "POOL_STOCK", availability_date: "2026-08-10" }
              as: PlantAdmin
              captures: { ch: "$.data.id" }
            - call: "POST /upfit/chassis/${ch}/inspect"
              payload: { measured_front_axle_weight_lb: 4180, measured_rear_axle_weight_lb: 2320 }
              as: InstallTechnician
              as_user_id: "tech-1"
