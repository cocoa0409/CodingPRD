  # -----------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: assign_result_visible_immediately
        claim_type: immediate
        grounds: [entities.Plot.fields.status, entities.Plot.fields.current_assignment_id]
        distinguishing_aspect: "Immediately after assign, GET /plots/{id} shows status ASSIGNED and current_assignment_id set to the new assignment in the same request cycle."
        test_recipe:
          setup: ["a MEDIUM plot just assigned"]
          setup_api_calls:
            - call: "POST /gardens"
              payload: { name: "Now Garden", season_label: "2026-MAIN", season_start: "2026-03-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z" }
              as: GardenManager
              captures: { garden_id: "$.data.id" }
            - call: "POST /plots"
              payload: { garden_id: "${garden_id}", label: "N-1", size: "MEDIUM" }
              as: GardenManager
              captures: { plot_id: "$.data.id", plot_v: "$.data.version" }
            - call: "POST /gardeners"
              payload: { full_name: "Now Er", email: "now@example.com" }
              as: GardenManager
              captures: { g_id: "$.data.id" }
            - call: "POST /plots/${plot_id}/assign"
              payload: { gardener_id: "${g_id}", expected_plot_version: "${plot_v}" }
              as: GardenManager
              captures: { asg_id: "$.data.id" }
          trigger:
