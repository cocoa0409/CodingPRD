# ==============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Task 2607 — Fire Apparatus & Ambulance Body Manufacturing
# Nine §0.5 rule_ids x 2 instances = 18 instances. Every numeric literal in an
# `assert:` was computed by executing the §1.3 formula and its `constants:`.
# Logical clock starts at 2026-08-01T00:00:00Z unless a call moves it.
# ==============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: award_locked_versus_delivery_year_escalation_price
        grounds:
          - calculations.unit_award_price
          - entities.UnitOrder.fields.price_cents
          - entities.WarrantyStartup.fields.final_price_cents
          - entities.WarrantyStartup.fields.price_variance_cents
          - state_machines.UnitOrder.FINAL_INSPECTED_to_DELIVERED
        distinguishing_aspect: |
          The two variants of unit_award_price disagree on the same unit because
          award_year_locked compounds whole-year escalation ((1+i/100)**2) while
          delivery_year_actual applies simple pro-rata monthly escalation over 34
          months; the identical program basis therefore yields price_cents 68276000
          and final_price_cents 70279166, a pinned price_variance_cents of 2003166.
        test_recipe:
          setup:
            - "ApparatusProgram base_year 2024, base_unit_price_cents 62500000, escalation_index_pct_per_year 4.0, contract_ceiling_cents 400000000, status ACTIVE"
            - "one RELEASED BidSpecification with a single mandatory clause answered COMPLY (compliance_score_strict 100.00, restrictive_clause_ratio_pct 0.00)"
            - "one PUMPER UnitOrder awarded for award_year 2026 (price_cents 68276000, weight_status WITHIN_LIMITS), driven to build_status FINAL_INSPECTED with certification_status CERTIFIED and open_change_order_count 0"
            - "logical clock moved to 2026-11-01T00:00:00Z immediately before delivery"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Metro FD 2024-2029 Apparatus", agency_name: "Metro Fire District", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 3, contract_ceiling_cents: 400000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /specifications"
              payload: { program_id: "${prog_id}", title: "Pumper spec rev A" }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { spec_id: $.data.id }
            - call: "POST /specifications/${spec_id}/clauses"
              payload: { clause_code: "C1", category: "CHASSIS", requirement_text: "Custom cab chassis, four-door", mandatory: true, is_restrictive: false }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { c1_id: $.data.id }
            - call: "POST /compliance-entries"
              payload: { specification_id: "${spec_id}", clause_id: "${c1_id}", response: "COMPLY" }
              as: BodyEngineer
              as_user_id: "eng-1"
            - call: "POST /specifications/${spec_id}/submit-review"
              as: PurchasingOfficer
              as_user_id: "po-author"
            - call: "POST /specifications/${spec_id}/release"
              as: PurchasingOfficer
              as_user_id: "po-releaser"
            - call: "POST /unit-orders"
              payload: { program_id: "${prog_id}", specification_id: "${spec_id}", unit_type: "PUMPER", award_year: 2026, gvwr_kg: 17000, front_axle_rating_kg: 6800, rear_axle_rating_kg: 10110, base_curb_front_kg: 5200, base_curb_rear_kg: 7000, crew_seat_count: 4, weight_calc_engineer_user_id: "eng-1" }
              as: PurchasingOfficer
              as_user_id: "po-releaser"
              captures: { unit_id: $.data.id }
            - call: "POST /plant-bays"
              payload: { name: "Bay A", max_concurrent_visitors: 10 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { bay_id: $.data.id }
            - call: "POST /inspection-trips"
              payload: { unit_order_id: "${unit_id}", plant_bay_id: "${bay_id}", trip_type: "PRE_CONSTRUCTION", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T16:00:00Z", committee_size: 4 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { trip_pre_id: $.data.id }
            - call: "POST /inspection-trips/${trip_pre_id}/hold"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /slot-lines"
              payload: { supplier_name: "Freightline Custom Chassis", component_type: "CHASSIS", total_slot_count: 2 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { line_id: $.data.id, line_v: $.data.version }
            - call: "POST /chassis-reservations"
              payload: { program_id: "${prog_id}", slot_line_id: "${line_id}", unit_order_id: "${unit_id}", slot_start_date: "2026-09-01T00:00:00Z", slot_end_date: "2026-09-15T00:00:00Z", reserved_price_cents: 30000000, expiry_at: "2026-12-01T00:00:00Z", expected_slot_line_version: "${line_v}" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { res_id: $.data.id }
            - call: "POST /chassis-reservations/${res_id}/confirm"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /unit-orders/${unit_id}/start-production"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /inspection-trips"
              payload: { unit_order_id: "${unit_id}", plant_bay_id: "${bay_id}", trip_type: "MID_CONSTRUCTION", scheduled_start: "2026-09-20T08:00:00Z", scheduled_end: "2026-09-20T16:00:00Z", committee_size: 4 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { trip_mid_id: $.data.id }
            - call: "POST /inspection-trips/${trip_mid_id}/hold"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /certification-tests"
              payload: { unit_order_id: "${unit_id}", test_standard: "NFPA_1901" }
              as: ThirdPartyTester
              as_user_id: "tester-1"
              captures: { test_id: $.data.id }
            - call: "POST /certification-tests/${test_id}/record-result"
              payload: { result: "PASS", signed_by_user_id: "eng-2" }
              as: ThirdPartyTester
              as_user_id: "tester-1"
            - call: "POST /unit-orders/${unit_id}/final-inspection"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /unit-orders/${unit_id}/deliver"
              payload: { delivery_date: "2026-11-01T00:00:00Z", training_hours: 8.0, warranty_months: 24 }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /warranty-startups?unit_order_id=${unit_id}"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ws_id: "$.data[0].id", ws_final: "$.data[0].final_price_cents" }
          assert:
            - "UnitOrder.${unit_id}.price_cents == 68276000 (award_year_locked: escalated 67600000, bond tier 2 fee 676000) and is unchanged by delivery"
            - "WarrantyStartup.${ws_id}.final_price_cents == 70279166 (delivery_year_actual: months_elapsed 34, escalated 69583333, bond tier 2 fee 695833)"
            - "WarrantyStartup.${ws_id}.price_variance_cents == 2003166"
            - "WarrantyStartup.${ws_id}.status == PENDING_TRAINING and warranty_start_date == 2026-12-01 (delivery_date + 30 deferral days, training_hours 8.0 < 16.0)"
            - "WarrantyStartup.${ws_id}.warranty_end_date == 2028-12-01"
            - "ApparatusProgram.${prog_id}.committed_cents == 68276000 — the delivery variance is deliberately NOT posted to the ledger"

      - name: strict_versus_provisional_compliance_score_release_gate
        grounds:
          - calculations.compliance_readiness_score
          - entities.BidSpecification.fields.compliance_score_strict
          - entities.BidSpecification.fields.compliance_score_provisional
          - validations[priority=46]
          - errors.ERR_SPEC_COMPLIANCE_BELOW_THRESHOLD
        distinguishing_aspect: |
          On one BidSpecification whose four clauses weigh 8, the strict variant
          scores the PENDING mandatory EXCEPTION as non-compliant (5/8 = 62.50)
          while the provisional variant scores it as compliant (8/8 = 100.00), and
          the release gate reads compliance_score_strict only — so a specification
          reporting a perfect provisional score is still rejected.
        test_recipe:
          setup:
            - "ApparatusProgram ACTIVE"
            - "one UNDER_REVIEW BidSpecification with clauses C1 mandatory (COMPLY), C2 optional (COMPLY), C3 optional (COMPLY), C4 mandatory (EXCEPTION, disposition PENDING) — total_weight 8, restrictive_clause_ratio_pct 0.00"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "County EMS Ambulance Program", agency_name: "County EMS", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 2, contract_ceiling_cents: 400000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /specifications"
              payload: { program_id: "${prog_id}", title: "Ambulance spec rev A" }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { spec_id: $.data.id }
            - call: "POST /specifications/${spec_id}/clauses"
              payload: { clause_code: "C1", category: "PATIENT_COMPARTMENT", requirement_text: "Type I module, 170 inch", mandatory: true, is_restrictive: false }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { c1_id: $.data.id }
            - call: "POST /specifications/${spec_id}/clauses"
              payload: { clause_code: "C2", category: "ELECTRICAL", requirement_text: "Multiplex electrical system", mandatory: false, is_restrictive: false }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { c2_id: $.data.id }
            - call: "POST /specifications/${spec_id}/clauses"
              payload: { clause_code: "C3", category: "PAINT", requirement_text: "Two-tone paint scheme", mandatory: false, is_restrictive: false }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { c3_id: $.data.id }
            - call: "POST /specifications/${spec_id}/clauses"
              payload: { clause_code: "C4", category: "CHASSIS", requirement_text: "Dual rear wheel chassis, 14500 lb GVWR", mandatory: true, is_restrictive: false }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { c4_id: $.data.id }
            - call: "POST /compliance-entries"
              payload: { specification_id: "${spec_id}", clause_id: "${c1_id}", response: "COMPLY" }
              as: BodyEngineer
              as_user_id: "eng-1"
            - call: "POST /compliance-entries"
              payload: { specification_id: "${spec_id}", clause_id: "${c2_id}", response: "COMPLY" }
              as: BodyEngineer
              as_user_id: "eng-1"
            - call: "POST /compliance-entries"
              payload: { specification_id: "${spec_id}", clause_id: "${c3_id}", response: "COMPLY" }
              as: BodyEngineer
              as_user_id: "eng-1"
            - call: "POST /compliance-entries"
              payload: { specification_id: "${spec_id}", clause_id: "${c4_id}", response: "EXCEPTION", exception_text: "Single rear wheel chassis offered" }
              as: BodyEngineer
              as_user_id: "eng-1"
              captures: { entry4_id: $.data.id }
            - call: "POST /specifications/${spec_id}/submit-review"
              as: PurchasingOfficer
              as_user_id: "po-author"
          trigger:
            - call: "GET /specifications/${spec_id}"
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { strict_before: $.data.compliance_score_strict, prov_before: $.data.compliance_score_provisional }
            - call: "POST /specifications/${spec_id}/release"
              as: PurchasingOfficer
              as_user_id: "po-releaser"
              captures: { err: $.data.error_id }
          assert:
            - "BidSpecification.${spec_id}.compliance_score_strict == 62.50 (compliant weight 5 of total_weight 8)"
            - "BidSpecification.${spec_id}.compliance_score_provisional == 100.00 (the PENDING mandatory EXCEPTION counts as compliant)"
            - "the release attempt returns 422 with error_id ERR_SPEC_COMPLIANCE_BELOW_THRESHOLD despite the provisional score being 100.00"
            - "BidSpecification.${spec_id}.status remains UNDER_REVIEW and released_by_user_id remains null"
            - "after POST /compliance-entries/${entry4_id}/dispose with disposition ACCEPTED, compliance_score_strict == 100.00 and the same release call succeeds with status RELEASED"

  - rule_id: combinatorial_formula
    instances:

      - name: change_order_per_line_rounding_beats_sum_then_round
        grounds:
          - calculations.change_order_price_delta
          - entities.ChangeOrder.fields.line_items
          - entities.ChangeOrder.fields.price_delta_cents
          - concurrency_rules[change-order-create-stale-unit]
        distinguishing_aspect: |
          price_delta_cents composes three line items through two nested
          round_half_up steps each (markup, then conditional 6.5% tax) in request
          array order, so the pinned per-line rounding yields exactly 2446181 while
          the naive sum-then-round-once path yields 2446182 — a one-cent spread that
          only the declared order reproduces.
        test_recipe:
          setup:
            - "ApparatusProgram ACTIVE with base_unit_price_cents 62500000, base_year 2024, contract_ceiling_cents 400000000"
            - "one RELEASED specification and one PUMPER UnitOrder (price_cents 68276000, build_status SPEC_LOCKED, open_change_order_count 0)"
            - "one SCHEDULED PRE_CONSTRUCTION InspectionTrip on that unit for the change order to cite"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Metro FD 2024-2029 Apparatus", agency_name: "Metro Fire District", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 3, contract_ceiling_cents: 400000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /specifications"
              payload: { program_id: "${prog_id}", title: "Pumper spec rev A" }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { spec_id: $.data.id }
            - call: "POST /specifications/${spec_id}/clauses"
              payload: { clause_code: "C1", category: "PUMP", requirement_text: "1500 gpm single stage pump", mandatory: true, is_restrictive: false }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { c1_id: $.data.id }
            - call: "POST /compliance-entries"
              payload: { specification_id: "${spec_id}", clause_id: "${c1_id}", response: "COMPLY" }
              as: BodyEngineer
              as_user_id: "eng-1"
            - call: "POST /specifications/${spec_id}/submit-review"
              as: PurchasingOfficer
              as_user_id: "po-author"
            - call: "POST /specifications/${spec_id}/release"
              as: PurchasingOfficer
              as_user_id: "po-releaser"
            - call: "POST /unit-orders"
              payload: { program_id: "${prog_id}", specification_id: "${spec_id}", unit_type: "PUMPER", award_year: 2026, gvwr_kg: 17000, front_axle_rating_kg: 6800, rear_axle_rating_kg: 10110, base_curb_front_kg: 5200, base_curb_rear_kg: 7000, crew_seat_count: 4, weight_calc_engineer_user_id: "eng-1" }
              as: PurchasingOfficer
              as_user_id: "po-releaser"
              captures: { unit_id: $.data.id }
            - call: "POST /plant-bays"
              payload: { name: "Bay A", max_concurrent_visitors: 10 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { bay_id: $.data.id }
            - call: "POST /inspection-trips"
              payload: { unit_order_id: "${unit_id}", plant_bay_id: "${bay_id}", trip_type: "PRE_CONSTRUCTION", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T16:00:00Z", committee_size: 4 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { trip_pre_id: $.data.id }
            - call: "GET /unit-orders/${unit_id}"
              as: CustomerCommitteeRep
              as_user_id: "${prog_id}"
              captures: { unit_v: $.data.version }
          trigger:
            - call: "POST /change-orders"
              payload: { unit_order_id: "${unit_id}", inspection_trip_id: "${trip_pre_id}", line_items: [ { description: "Compartment shelving", quantity: 3, unit_cost_cents: 133333, markup_pct: 12.5, is_taxable: true }, { description: "LED scene lights", quantity: 7, unit_cost_cents: 45555, markup_pct: 7.5, is_taxable: false }, { description: "Foam proportioner", quantity: 1, unit_cost_cents: 1250005, markup_pct: 22.0, is_taxable: true } ], weight_delta_front_kg: 0, weight_delta_rear_kg: 0, expected_unit_order_version: "${unit_v}" }
              as: CustomerCommitteeRep
              as_user_id: "${prog_id}"
              captures: { co_id: $.data.id }
          assert:
            - "ChangeOrder.${co_id}.price_delta_cents == 2446181 (lines 479249 + 342801 + 1624131)"
            - "ChangeOrder.${co_id}.price_delta_cents != 2446182 — the sum-then-round-once path is rejected"
            - "ChangeOrder.${co_id}.status == DRAFT and revision_count == 0"
            - "UnitOrder.${unit_id}.open_change_order_count == 1 and change_order_total_cents == 0 (a DRAFT change order is not in the APPROVED input set)"
            - "ApparatusProgram.${prog_id}.committed_cents == 68276000 — unchanged by an unapproved change order"

      - name: performance_bond_tier_keyed_on_subtotal_not_total
        grounds:
          - calculations.unit_award_price
          - entities.UnitOrder.fields.price_cents
          - validations[priority=53]
          - errors.ERR_ESCALATION_YEAR_OUT_OF_RANGE
        distinguishing_aspect: |
          unit_award_price composes escalation, option premium and a tiered
          performance-bond rate where step 5 keys the tier on the SUBTOTAL even
          though the bond fee is itself a component of the total: at subtotal
          exactly 50000000 the tier-1 rate 1.25% gives price_cents 50625000, whereas
          keying the tier on the total would pick tier 2 and give 50500000.
        test_recipe:
          setup:
            - "ApparatusProgram base_year 2026, base_unit_price_cents 50000000, escalation_index_pct_per_year 4.0, contract_ceiling_cents 400000000, status ACTIVE"
            - "one RELEASED specification on that program"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Boundary Bond Program", agency_name: "Harbor Fire Authority", base_year: 2026, base_unit_price_cents: 50000000, escalation_index_pct_per_year: 4.0, max_option_units: 2, contract_ceiling_cents: 400000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /specifications"
              payload: { program_id: "${prog_id}", title: "Aerial spec rev A" }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { spec_id: $.data.id }
            - call: "POST /specifications/${spec_id}/clauses"
              payload: { clause_code: "C1", category: "AERIAL", requirement_text: "100 ft rear-mount aerial ladder", mandatory: true, is_restrictive: false }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { c1_id: $.data.id }
            - call: "POST /compliance-entries"
              payload: { specification_id: "${spec_id}", clause_id: "${c1_id}", response: "COMPLY" }
              as: BodyEngineer
              as_user_id: "eng-1"
            - call: "POST /specifications/${spec_id}/submit-review"
              as: PurchasingOfficer
              as_user_id: "po-author"
            - call: "POST /specifications/${spec_id}/release"
              as: PurchasingOfficer
              as_user_id: "po-releaser"
          trigger:
            - call: "POST /unit-orders"
              payload: { program_id: "${prog_id}", specification_id: "${spec_id}", unit_type: "AERIAL", award_year: 2026, gvwr_kg: 27000, front_axle_rating_kg: 11000, rear_axle_rating_kg: 16500, base_curb_front_kg: 9800, base_curb_rear_kg: 14440, crew_seat_count: 3, weight_calc_engineer_user_id: "eng-1" }
              as: PurchasingOfficer
              as_user_id: "po-releaser"
              captures: { unit_a_id: $.data.id, unit_a_price: $.data.price_cents }
            - call: "POST /unit-orders"
              payload: { program_id: "${prog_id}", specification_id: "${spec_id}", unit_type: "AERIAL", award_year: 2027, gvwr_kg: 27000, front_axle_rating_kg: 11000, rear_axle_rating_kg: 16500, base_curb_front_kg: 9800, base_curb_rear_kg: 14440, crew_seat_count: 3, weight_calc_engineer_user_id: "eng-1" }
              as: PurchasingOfficer
              as_user_id: "po-releaser"
              captures: { unit_b_id: $.data.id }
          assert:
            - "UnitOrder.${unit_a_id}.price_cents == 50625000 (years_elapsed 0, subtotal 50000000 == BOND_TIER_1_MAX_CENTS, tier 1 rate 1.25%, fee 625000)"
            - "UnitOrder.${unit_a_id}.price_cents != 50500000 — keying the bond tier on the total instead of the subtotal is rejected"
            - "UnitOrder.${unit_b_id}.price_cents == 52520000 (years_elapsed 1, escalated 52000000, subtotal crosses into tier 2 rate 1.00%, fee 520000)"
            - "UnitOrder.${unit_a_id}.front_axle_load_kg == 10410, rear_axle_load_kg == 15870, gross_weight_kg == 26280, weight_status == WITHIN_LIMITS"
            - "ApparatusProgram.${prog_id}.committed_cents == 103145000 and status remains ACTIVE (soft ceiling 360000000 not reached)"
            - "a third award with award_year 2032 is rejected 422 ERR_ESCALATION_YEAR_OUT_OF_RANGE (base_year + 5 == 2031)"

  - rule_id: non_linear_state_machine
    instances:

      - name: certification_retest_cycle_leaves_build_dimension_frozen
        grounds:
          - state_machines.UnitOrder.IN_TESTING_to_REJECTED_TESTING
          - state_machines.UnitOrder.REJECTED_TESTING_to_IN_TESTING
          - state_machines.CertificationTest.SUBMITTED_to_FAILED
          - entities.UnitOrder.fields.certification_status
          - entities.UnitOrder.fields.build_status
          - validations[priority=14]
        distinguishing_aspect: |
          UnitOrder runs two independent dimensions: certification_status cycles
          NOT_SUBMITTED -> IN_TESTING -> REJECTED_TESTING -> IN_TESTING -> CERTIFIED
          across two CertificationTest rows while build_status stays pinned at
          MID_CON_HELD for every hop, and the REJECTED_TESTING re-entry is the only
          way back into IN_TESTING.
        test_recipe:
          setup:
            - "ApparatusProgram ACTIVE, one RELEASED specification, one PUMPER UnitOrder"
            - "the unit driven to build_status MID_CON_HELD (PRE_CONSTRUCTION trip HELD, chassis reservation CONFIRMED, production started, MID_CONSTRUCTION trip HELD) with certification_status NOT_SUBMITTED"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Metro FD 2024-2029 Apparatus", agency_name: "Metro Fire District", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 3, contract_ceiling_cents: 400000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              as: ProgramAdmin
              as_user_id: "admin-1"
