# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — Task 0646
# Nine §0.5 rules × ≥2 instances each. Every grounds[] resolves into SCAFFOLD.yaml.
# All formula-derived asserts are literals pre-computed by code.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: session_pack_settle_vs_provisional_balance
        grounds:
          - calculations.session_pack_balance
          - state_machines.SessionPack.ACTIVE_to_REFUNDED
          - state_machines.Engagement.ACTIVE_to_ENDED
          - entities.Engagement.fields.wallet_credit_cents
        distinguishing_aspect: |
          Same pack, two algorithms on the SessionPack/Engagement domain: provisional sessions_remaining
          counts BOOKED seats as committed (3 remaining) while the settle-at-end variant treats only
          COMPLETED/NO_SHOW/LATE_CANCELLED as consumed and refunds the rest, yielding a 40000c refund (4 seats)
          not the naive 30000c (3 seats) — a 10000c divergence.
        test_recipe:
          setup:
            - "Trainer T, client C ASSESSED, SESSION_PACK engagement E (ACTIVE)"
            - "SessionPack P: total_sessions=5, price_cents=50000 -> per_session_value_cents=10000"
            - "Two bookings on P: B1 COMPLETED, B2 BOOKED -> sessions_committed=2, sessions_remaining=3 (provisional)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /trainers"
              payload: { full_name: "T", email: "t1@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /clients"
              payload: { trainer_id: "${t_id}", full_name: "C", email: "c1@x.com", sex: "MALE", birth_year: 1996, height_cm: 180 }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/submit-intake"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /clients/${c_id}/assess"
              payload: {}
              as: Trainer
              as_user_id: "${t_id}"
              captures: { c_ver: $.data.version }
            - call: "POST /engagements"
              payload: { client_id: "${c_id}", billing_model: "SESSION_PACK", expected_client_version: "${c_ver}" }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { e_id: $.data.id }
            - call: "POST /engagements/${e_id}/session-packs"
              payload: { total_sessions: 5, price_cents: 50000 }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { p_id: $.data.id, p_ver: $.data.version }
            - call: "POST /bookings"
              payload: { engagement_id: "${e_id}", start_utc: "2026-06-02T10:00:00Z", end_utc: "2026-06-02T11:00:00Z", session_pack_id: "${p_id}", expected_session_pack_version: "${p_ver}" }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { b1_id: $.data.id }
            - call: "GET /session-packs/${p_id}"
              payload: {}
              as: Trainer
              as_user_id: "${t_id}"
              captures: { p_ver2: $.data.version }
            - call: "POST /bookings"
              payload: { engagement_id: "${e_id}", start_utc: "2026-06-03T10:00:00Z", end_utc: "2026-06-03T11:00:00Z", session_pack_id: "${p_id}", expected_session_pack_version: "${p_ver2}" }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { b2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T11:30:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${b1_id}/complete"
              payload: {}
              as: Trainer
              as_user_id: "${t_id}"
          trigger:
            - call: "POST /engagements/${e_id}/end"
              payload: {}
              as: Trainer
              as_user_id: "${t_id}"
          assert:
            - "Engagement.${e_id}.wallet_credit_cents == 40000"
            - "Engagement.${e_id}.status == ENDED"
            - "SessionPack.${p_id}.status == REFUNDED"
            - "Booking.${b2_id}.status == CANCELLED"

      - name: macro_targets_provisional_vs_locked
        grounds:
          - calculations.macro_plan_targets
          - state_machines.MacroPlan.PROVISIONAL_to_LOCKED
          - state_machines.CheckIn.SUBMITTED_to_ASSESSED
          - entities.MacroPlan.fields.target_calories
        distinguishing_aspect: |
          Dual-variant on the MacroPlan domain (distinct from session-pack domain): a PROVISIONAL plan recomputes
          target_calories from Client.latest_weight_kg on each assessed check-in (2207 -> 2182 after weight 80->78),
          whereas a LOCKED plan stays frozen at 2207, so identical post-check-in inputs diverge by 25 kcal.
        test_recipe:
          setup:
            - "Client C MALE birth_year 1996 height 180; clock 2026-06-01 so age=30"
            - "One ASSESSED check-in weight 80 -> latest_weight_kg=80; PROVISIONAL macro plan FAT_LOSS/MODERATE -> target_calories 2207"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /trainers"
              payload: { full_name: "T", email: "t2@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /clients"
              payload: { trainer_id: "${t_id}", full_name: "C", email: "c2@x.com", sex: "MALE", birth_year: 1996, height_cm: 180 }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/submit-intake"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /clients/${c_id}/assess"
              payload: {}
              as: Trainer
              as_user_id: "${t_id}"
              captures: { c_ver: $.data.version }
            - call: "POST /engagements"
              payload: { client_id: "${c_id}", billing_model: "ONLINE_SUBSCRIPTION", expected_client_version: "${c_ver}", monthly_fee_cents: 6000, cycle_start_utc: "2026-06-01T00:00:00Z" }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { e_id: $.data.id }
            - call: "POST /engagements/${e_id}/check-ins"
              payload: { measured_at: "2026-06-01T08:00:00Z", weight_kg: 80, window_start_utc: "2026-05-25T00:00:00Z", window_end_utc: "2026-06-01T00:00:00Z" }
              as: Client
              as_user_id: "${c_id}"
              captures: { ci1_id: $.data.id }
            - call: "POST /check-ins/${ci1_id}/assess"
              payload: {}
              as: Trainer
              as_user_id: "${t_id}"
            - call: "POST /engagements/${e_id}/macro-plans"
              payload: { goal: "FAT_LOSS", activity_level: "MODERATE" }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { mp_id: $.data.id }
          trigger:
            - call: "POST /engagements/${e_id}/check-ins"
              payload: { measured_at: "2026-06-08T08:00:00Z", weight_kg: 78, window_start_utc: "2026-06-01T00:00:00Z", window_end_utc: "2026-06-08T00:00:00Z" }
              as: Client
              as_user_id: "${c_id}"
              captures: { ci2_id: $.data.id }
            - call: "POST /check-ins/${ci2_id}/assess"
              payload: {}
              as: Trainer
              as_user_id: "${t_id}"
          assert:
            - "MacroPlan.${mp_id}.target_calories == 2182"
            - "MacroPlan.${mp_id}.status == PROVISIONAL"
            - "Client.${c_id}.latest_weight_kg == 78"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: macro_plan_nonlinear_multiinput
        grounds:
          - calculations.macro_plan_targets
          - entities.MacroPlan.fields.protein_g
          - entities.MacroPlan.fields.carb_g
          - entities.MacroPlan.fields.fat_g
        distinguishing_aspect: |
          Mode (a): >=3 inputs (weight, height, age, sex, activity_level, goal) with non-linear branch selection —
          sex picks the BMR constant, activity_level picks the multiplier, goal picks BOTH the calorie factor and the
          macro split, and grams divide by 4 (protein/carb) vs 9 (fat). Male/80kg/180cm/age30/MODERATE/FAT_LOSS ->
          2207 kcal, 221p/166c/74f.
        test_recipe:
          setup:
            - "Client MALE birth_year 1996 (age 30 at clock 2026-06-01) height 180; latest_weight_kg 80 from ASSESSED check-in"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /trainers"
              payload: { full_name: "T", email: "t3@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /clients"
              payload: { trainer_id: "${t_id}", full_name: "C", email: "c3@x.com", sex: "MALE", birth_year: 1996, height_cm: 180 }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/submit-intake"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /clients/${c_id}/assess"
              payload: {}
              as: Trainer
              as_user_id: "${t_id}"
              captures: { c_ver: $.data.version }
            - call: "POST /engagements"
              payload: { client_id: "${c_id}", billing_model: "ONLINE_SUBSCRIPTION", expected_client_version: "${c_ver}", monthly_fee_cents: 6000, cycle_start_utc: "2026-06-01T00:00:00Z" }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { e_id: $.data.id }
            - call: "POST /engagements/${e_id}/check-ins"
              payload: { measured_at: "2026-06-01T08:00:00Z", weight_kg: 80, window_start_utc: "2026-05-25T00:00:00Z", window_end_utc: "2026-06-01T00:00:00Z" }
              as: Client
              as_user_id: "${c_id}"
              captures: { ci_id: $.data.id }
            - call: "POST /check-ins/${ci_id}/assess"
              payload: {}
              as: Trainer
              as_user_id: "${t_id}"
          trigger:
            - call: "POST /engagements/${e_id}/macro-plans"
              payload: { goal: "FAT_LOSS", activity_level: "MODERATE" }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { mp_id: $.data.id }
          assert:
            - "MacroPlan.${mp_id}.target_calories == 2207"
            - "MacroPlan.${mp_id}.protein_g == 221"
            - "MacroPlan.${mp_id}.carb_g == 166"
            - "MacroPlan.${mp_id}.fat_g == 74"

      - name: invoice_round_per_line_then_sum
        grounds:
          - calculations.package_invoice_total
          - endpoints["POST /engagements/{engagementId}/session-packs/invoice"]
        distinguishing_aspect: |
          Mode (b): rounding order is pinned to round-per-line then sum then tax. Three lines list_price 201 @ 0.50
          each round to 101 (sum 303), not the sum-then-round 302; tax round(303*0.0875)=27 gives total 330, whereas
          the sum-then-round path would wrongly yield 328.
        test_recipe:
          setup:
            - "Trainer T, ASSESSED client C, SESSION_PACK engagement E (ACTIVE)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /trainers"
              payload: { full_name: "T", email: "t4@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /clients"
              payload: { trainer_id: "${t_id}", full_name: "C", email: "c4@x.com", sex: "FEMALE", birth_year: 1998, height_cm: 168 }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/submit-intake"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /clients/${c_id}/assess"
              payload: {}
              as: Trainer
              as_user_id: "${t_id}"
              captures: { c_ver: $.data.version }
            - call: "POST /engagements"
              payload: { client_id: "${c_id}", billing_model: "SESSION_PACK", expected_client_version: "${c_ver}" }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /engagements/${e_id}/session-packs/invoice"
              payload: { line_items: [ { list_price_cents: 201, discount_pct: 0.50 }, { list_price_cents: 201, discount_pct: 0.50 }, { list_price_cents: 201, discount_pct: 0.50 } ] }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { sub: $.data.subtotal_cents, tax: $.data.tax_cents, tot: $.data.invoice_total_cents }
          assert:
            - "$.data.subtotal_cents == 303"
            - "$.data.tax_cents == 27"
            - "$.data.invoice_total_cents == 330"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: engagement_active_pause_resume_cycle
        grounds:
          - state_machines.Engagement.ACTIVE_to_PAUSED
          - state_machines.Engagement.PAUSED_to_ACTIVE
          - entities.Engagement.fields.pause_reason
        distinguishing_aspect: |
          Cyclic ACTIVE<->PAUSED on the Engagement entity: pause sets pause_reason=MANUAL, resume returns to ACTIVE
          and resets pause_reason=NONE, and the cycle can repeat — not a one-way linear pipeline.
        test_recipe:
          setup:
            - "ASSESSED client C, ONLINE_SUBSCRIPTION engagement E (ACTIVE)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /trainers"
              payload: { full_name: "T", email: "t5@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /clients"
              payload: { trainer_id: "${t_id}", full_name: "C", email: "c5@x.com", sex: "MALE", birth_year: 1990, height_cm: 175 }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/submit-intake"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /clients/${c_id}/assess"
              payload: {}
              as: Trainer
              as_user_id: "${t_id}"
              captures: { c_ver: $.data.version }
            - call: "POST /engagements"
              payload: { client_id: "${c_id}", billing_model: "ONLINE_SUBSCRIPTION", expected_client_version: "${c_ver}", monthly_fee_cents: 6000, cycle_start_utc: "2026-06-01T00:00:00Z" }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { e_id: $.data.id }
            - call: "POST /engagements/${e_id}/pause"
              payload: {}
              as: Trainer
              as_user_id: "${t_id}"
            - call: "POST /engagements/${e_id}/resume"
              payload: {}
              as: Trainer
              as_user_id: "${t_id}"
          trigger:
            - call: "POST /engagements/${e_id}/pause"
              payload: {}
              as: Trainer
              as_user_id: "${t_id}"
          assert:
            - "Engagement.${e_id}.status == PAUSED"
            - "Engagement.${e_id}.pause_reason == MANUAL"

      - name: checkin_submitted_revision_cycle
        grounds:
          - state_machines.CheckIn.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.CheckIn.REVISION_REQUESTED_to_SUBMITTED
          - entities.CheckIn.fields.adherence_score
        distinguishing_aspect: |
          Cyclic SUBMITTED<->REVISION_REQUESTED on the CheckIn entity (a different entity than the Engagement cycle):
          request-revision and resubmit loop, and resubmit recomputes adherence_score over the window.
        test_recipe:
          setup:
            - "ONLINE_SUBSCRIPTION engagement E ACTIVE; a SUBMITTED check-in CI with empty window (no logs)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /trainers"
              payload: { full_name: "T", email: "t6@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /clients"
              payload: { trainer_id: "${t_id}", full_name: "C", email: "c6@x.com", sex: "FEMALE", birth_year: 1995, height_cm: 165 }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/submit-intake"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /clients/${c_id}/assess"
              payload: {}
              as: Trainer
              as_user_id: "${t_id}"
              captures: { c_ver: $.data.version }
            - call: "POST /engagements"
              payload: { client_id: "${c_id}", billing_model: "ONLINE_SUBSCRIPTION", expected_client_version: "${c_ver}", monthly_fee_cents: 6000, cycle_start_utc: "2026-06-01T00:00:00Z" }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { e_id: $.data.id }
            - call: "POST /engagements/${e_id}/check-ins"
              payload: { measured_at: "2026-06-01T08:00:00Z", weight_kg: 64, window_start_utc: "2026-05-25T00:00:00Z", window_end_utc: "2026-06-01T00:00:00Z" }
              as: Client
              as_user_id: "${c_id}"
              captures: { ci_id: $.data.id }
            - call: "POST /check-ins/${ci_id}/request-revision"
              payload: {}
              as: Trainer
              as_user_id: "${t_id}"
          trigger:
            - call: "POST /check-ins/${ci_id}/resubmit"
              payload: { weight_kg: 63 }
              as: Client
              as_user_id: "${c_id}"
          assert:
            - "CheckIn.${ci_id}.status == SUBMITTED"
            - "CheckIn.${ci_id}.adherence_score == 0"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: booking_depletes_pack_pauses_engagement
        grounds:
          - state_machines.Booking.BOOKED_to_BOOKED
          - state_machines.SessionPack.ACTIVE_to_DEPLETED
          - state_machines.Engagement.ACTIVE_to_PAUSED
          - calculations.session_pack_balance
        distinguishing_aspect: |
          Depth-3 cascade from POST /bookings: the committing Booking (A) drives SessionPack sessions_remaining to 0
          which transitions the pack ACTIVE->DEPLETED (B); B itself bubbles up to transition the parent Engagement
          ACTIVE->PAUSED with pause_reason=PACK_DEPLETED (C). Each link is caused by the prior link.
        test_recipe:
          setup:
            - "SESSION_PACK engagement E ACTIVE; pack P total_sessions=1 (one seat)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /trainers"
              payload: { full_name: "T", email: "t7@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /clients"
              payload: { trainer_id: "${t_id}", full_name: "C", email: "c7@x.com", sex: "MALE", birth_year: 1992, height_cm: 178 }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/submit-intake"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /clients/${c_id}/assess"
              payload: {}
              as: Trainer
              as_user_id: "${t_id}"
              captures: { c_ver: $.data.version }
            - call: "POST /engagements"
              payload: { client_id: "${c_id}", billing_model: "SESSION_PACK", expected_client_version: "${c_ver}" }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { e_id: $.data.id }
            - call: "POST /engagements/${e_id}/session-packs"
              payload: { total_sessions: 1, price_cents: 10000 }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { p_id: $.data.id, p_ver: $.data.version }
          trigger:
            - call: "POST /bookings"
              payload: { engagement_id: "${e_id}", start_utc: "2026-06-05T10:00:00Z", end_utc: "2026-06-05T11:00:00Z", session_pack_id: "${p_id}", expected_session_pack_version: "${p_ver}" }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { b_id: $.data.id }
          assert:
            - "SessionPack.${p_id}.sessions_remaining == 0"
            - "SessionPack.${p_id}.status == DEPLETED"
            - "Engagement.${e_id}.status == PAUSED"
            - "Engagement.${e_id}.pause_reason == PACK_DEPLETED"

      - name: no_show_strike_suspends_privilege
        grounds:
          - state_machines.Booking.BOOKED_to_NO_SHOW
          - calculations.no_show_strikes_and_privilege
          - entities.Client.fields.no_show_strikes
          - entities.Client.fields.booking_privilege
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (POST /bookings/{id}/mark-no-show): the Booking BOOKED->NO_SHOW
          transition (A) recomputes Client.no_show_strikes to 3 (B), and that count reaching NO_SHOW_STRIKE_LIMIT
          flips Client.booking_privilege ALLOWED->SUSPENDED (B's threshold consequence). Distinct propagation pattern
          from the pack-depletion chain.
        test_recipe:
          setup:
            - "SESSION_PACK engagement E ACTIVE; pack total_sessions=5 price 50000 (per_session 10000)"
            - "Two prior NO_SHOW bookings already recorded (strikes=2); a third BOOKED booking B3 whose end is in the past"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /trainers"
              payload: { full_name: "T", email: "t8@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /clients"
              payload: { trainer_id: "${t_id}", full_name: "C", email: "c8@x.com", sex: "MALE", birth_year: 1992, height_cm: 178 }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/submit-intake"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /clients/${c_id}/assess"
              payload: {}
              as: Trainer
              as_user_id: "${t_id}"
              captures: { c_ver: $.data.version }
            - call: "POST /engagements"
              payload: { client_id: "${c_id}", billing_model: "SESSION_PACK", expected_client_version: "${c_ver}" }
              as: Trainer
