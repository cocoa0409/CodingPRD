              as: BuyingPointAdmin
              captures: { bp: $.data.id }
            - { call: "POST /buying-points/warehouses", payload: { buying_point_id: "${bp}", name: "WH-G", compartment: GENERAL, capacity_tons: 400 }, as: BuyingPointAdmin }
            - call: "POST /buying-points/growers"
              payload: { name: "Grower One", farm_number: "F-1001" }
              as: BuyingPointAdmin
              captures: { g1: $.data.id }
            - call: "POST /buying-points/loads"
