            - "data.state == 'OFFERED'"
            - "GET /pre-opening/programs/${prog_id}/hiring-plans shows the ROOMS plan at offered_count 1"

      - name: third_offer_beyond_headcount_target_returns_headcount_exceeded
        claim_type: aggregate_validation
        grounds:
          - "§1.6 ERR_HEADCOUNT_EXCEEDED (422) fires when a new Hire would push the plan's offered_count above headcount_target; each individual offer is well formed, so only the collective count breaches the limit."
        distinguishing_aspect: "Each hire is individually valid; only the collective count breaches headcount_target 2, so the third create returns ERR_HEADCOUNT_EXCEEDED at 422 while offered_count stays 2."
        test_recipe:
