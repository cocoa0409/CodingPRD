      - name: governance_generations_must_be_active_not_merely_drafted
        claim_type: triggerability
        grounds:
          - errors.ERR_NO_ACTIVE_THRESHOLD_CONFIG
          - errors.ERR_NO_ACTIVE_CONSENT_POLICY
          - validations.priority_29
          - validations.priority_15
          - state_machines.MatchThresholdConfig.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          A DRAFT generation must not satisfy either governance gate. With a DRAFT-only threshold config,
          contributing a record returns ERR_NO_ACTIVE_THRESHOLD_CONFIG; activating that same config makes
          the identical request succeed. With a DRAFT-only consent policy, recording a directive on the
          resulting cluster returns ERR_NO_ACTIVE_CONSENT_POLICY even though the request is otherwise
          perfect - correct expected_cluster_version, resolvable cluster, well-formed scope - and
          activating the policy makes the identical request succeed.
        test_recipe:
          setup:
            - "One participant at CONFORMANCE_TESTING. One threshold config and one consent policy exist, both left in DRAFT."
          setup_api_calls:
            - call: "POST /hie/participants"
              payload: { legal_name: "Oakhurst Valley Hospital", org_type: "HOSPITAL", declared_annual_patient_volume: 60000, primary_contact_email: "hie@oakhurst.example" }
