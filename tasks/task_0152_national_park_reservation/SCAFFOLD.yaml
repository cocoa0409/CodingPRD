scenario: |
  National Park Reservations (Recreation.gov style): timed entry, lottery permits (Half Dome/Wave),
  Backcountry permits, campground reservations and waitlist, America the Beautiful Pass, Group Site.

domain_name: national-park-reservation
api_prefix: /parks

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - ops_run_checkpoint
    - dual_variant_calculation
    - waterfall_allocation
    - scheduled_deferred_actions
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Park
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Park display name (e.g., "Yosemite National Park").
        constraints: 1..120 chars, unique
      - name: code
        type: string
        source: input
        description: Short park code (uppercase A-Z and digits).
        constraints: 2..10 chars, unique, ^[A-Z0-9]+$
      - name: timezone
        type: string
        source: input
        description: IANA timezone of the park, used to interpret daily entry windows.
        constraints: e.g., "America/Los_Angeles"
      - name: timed_entry_daily_capacity
        type: integer
        source: input
        description: Maximum number of vehicles admitted across all timed-entry windows in one local day.
        constraints: ">= 0"
      - name: timed_entry_window_minutes
        type: integer
        source: input
        description: Length of each timed-entry window in minutes.
        default: 60
        constraints: must evenly divide 1440
      - name: status
        type: enum
        source: computed
        description: Operational posture of the park; FROZEN blocks all new reservations and lottery draws.
        constraints: "{OPEN, RESTRICTED, FROZEN}"

  - name: Visitor
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: Unique visitor email used for authentication identity.
        constraints: RFC5322; unique
      - name: full_name
        type: string
        source: input
        description: Visitor's full name.
        constraints: 1..120 chars
      - name: wallet_balance_cents
        type: integer
        source: computed
        description: Credit balance in USD cents available for booking fees; debited on confirmation, credited on refunds.
        default: 0
        constraints: ">= 0"
      - name: lottery_strikes
        type: integer
        source: computed
        description: No-show strike count for lottery permits in the current calendar year; 3 strikes block new lottery entries.
        default: 0
        constraints: 0..3

  - name: AmericaTheBeautifulPass
    parent: Visitor
    common_fields: true
    fields:
      - name: visitor_id
        type: string
        source: input
        description: Owning visitor's id.
      - name: pass_type
        type: enum
        source: input
        description: Pass class; controls fee waivers and group restrictions.
        constraints: "{ANNUAL, SENIOR_ANNUAL, SENIOR_LIFETIME, MILITARY, ACCESS, VOLUNTEER, FOURTH_GRADE}"
      - name: serial
        type: string
        source: system
        description: Server-minted serial code printed on the pass.
        constraints: 12 chars, unique
      - name: valid_from
        type: datetime
        source: input
        description: First UTC instant the pass is valid for entry-fee waiver.
      - name: valid_until
        type: datetime
        source: input
        description: Last UTC instant the pass is valid; SENIOR_LIFETIME stores a sentinel far-future date.
      - name: status
        type: enum
        source: computed
        description: Lifecycle state of the pass.
        constraints: "{ACTIVE, EXPIRED, REVOKED}"

  - name: Campground
    parent: Park
    common_fields: true
    fields:
      - name: park_id
        type: string
        source: input
        description: Owning park id.
      - name: name
        type: string
        source: input
        description: Campground name within the park.
        constraints: 1..120 chars, unique within park
      - name: standard_site_count
        type: integer
        source: input
        description: Number of standard individual campsites (each accommodates 1..6 occupants).
        constraints: ">= 0"
      - name: group_site_count
        type: integer
        source: input
        description: Number of group sites (each accommodates 7..40 occupants).
        constraints: ">= 0"
      - name: nightly_standard_fee_cents
        type: integer
        source: input
        description: Per-night fee for a standard site, in USD cents.
        constraints: ">= 0"
      - name: nightly_group_fee_cents
        type: integer
        source: input
        description: Per-night fee for a group site, in USD cents.
        constraints: ">= 0"
      - name: max_consecutive_nights
        type: integer
        source: input
        description: Maximum consecutive nights one party may book in a rolling window.
        default: 14
        constraints: 1..30
      - name: waitlist_window_hours
        type: integer
        source: input
        description: Hours before check-in during which waitlist promotion runs.
        default: 24
        constraints: 1..168

  - name: LotteryPermit
    parent: Park
    common_fields: true
    fields:
      - name: park_id
        type: string
        source: input
        description: Owning park id.
      - name: name
        type: string
        source: input
        description: Permit name (e.g., "Half Dome Cables", "The Wave").
        constraints: 1..80 chars, unique within park
      - name: lottery_open_at
        type: datetime
        source: input
        description: UTC instant when the application window opens.
      - name: lottery_close_at
        type: datetime
        source: input
        description: UTC instant when the application window closes; draw runs after this.
      - name: draw_at
        type: datetime
        source: input
        description: UTC instant when the draw is scheduled to execute.
      - name: hike_date
        type: datetime
        source: input
        description: Date the permit grants access (00:00 in park-local time).
      - name: daily_slot_count
        type: integer
        source: input
        description: Number of award slots offered for hike_date.
        constraints: ">= 1"
      - name: per_application_max_party
        type: integer
        source: input
        description: Maximum party size allowed on a single application.
        default: 6
        constraints: 1..12
      - name: application_fee_cents
        type: integer
        source: input
        description: Non-refundable fee per application, in USD cents.
        constraints: ">= 0"
      - name: permit_fee_cents
        type: integer
        source: input
        description: Fee charged per awarded slot when the visitor accepts.
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: Lottery lifecycle state.
        constraints: "{OPEN, CLOSED, DRAWN, ARCHIVED}"

  - name: BackcountryZone
    parent: Park
    common_fields: true
    fields:
      - name: park_id
        type: string
        source: input
        description: Owning park id.
      - name: name
        type: string
        source: input
        description: Zone name (e.g., "Lyell Canyon").
        constraints: 1..80 chars, unique within park
      - name: nightly_quota_people
        type: integer
        source: input
        description: Cap on overnight people in the zone per night.
        constraints: ">= 0"
      - name: ranger_buffer_minutes
        type: integer
        source: input
        description: Mandatory minimum gap (in minutes) between consecutive permits exiting and entering the zone at the same trailhead.
        default: 30
        constraints: 0..720
      - name: per_party_fee_cents
        type: integer
        source: input
        description: Flat permit fee in USD cents per party regardless of nights.
        constraints: ">= 0"
  - name: TimedEntryReservation
    parent: Park
    common_fields: true
    fields:
      - name: park_id
        type: string
        source: input
        description: Owning park id.
      - name: visitor_id
        type: string
        source: input
        description: Reserving visitor id.
      - name: vehicle_plate
        type: string
        source: input
        description: Vehicle license plate; uppercased on persist.
        constraints: 1..10 chars
      - name: entry_date_local
        type: string
        source: input
        description: Park-local date (YYYY-MM-DD) of the entry.
      - name: window_start_local
        type: string
        source: input
        description: Window start in park-local HH:MM. Must align on a window boundary.
      - name: window_end_local
        type: string
        source: computed
        description: Window end in park-local HH:MM; window_start_local + Park.timed_entry_window_minutes.
      - name: pass_id
        type: string
        source: input
        description: Optional AmericaTheBeautifulPass id used to waive entry fees.
        default: null
      - name: entry_fee_cents
        type: integer
        source: computed
        description: Fee charged in USD cents; 0 if a valid pass is supplied.
      - name: status
        type: enum
        source: computed
        description: Reservation lifecycle state.
        constraints: "{HELD, CONFIRMED, CANCELLED, USED, NO_SHOW}"
      - name: held_until
        type: datetime
        source: computed
        description: UTC instant when an unpaid HELD reservation auto-expires (15 minutes after creation).

  - name: CampgroundReservation
    parent: Campground
    common_fields: true
    fields:
      - name: campground_id
        type: string
        source: input
        description: Owning campground id.
      - name: visitor_id
        type: string
        source: input
        description: Reserving visitor id.
      - name: site_kind
        type: enum
        source: input
        description: Site class to reserve.
        constraints: "{STANDARD, GROUP}"
      - name: party_size
        type: integer
        source: input
        description: Total occupants; STANDARD requires 1..6, GROUP requires 7..40.
        constraints: 1..40
      - name: check_in_date_local
        type: string
        source: input
        description: Park-local check-in date (YYYY-MM-DD).
      - name: check_out_date_local
        type: string
        source: input
        description: Park-local check-out date (YYYY-MM-DD); strictly after check_in.
      - name: nights
        type: integer
        source: computed
        description: Number of nights (check_out - check_in).
      - name: nightly_rate_cents
        type: integer
        source: computed
        description: Per-night fee in USD cents snapshotted at confirmation.
      - name: total_fee_cents
        type: integer
        source: computed
        description: nights * nightly_rate_cents + booking_fee_cents (see calc booking_total).
      - name: status
        type: enum
        source: computed
        description: Reservation lifecycle state.
        constraints: "{HELD, CONFIRMED, CANCELLED, NO_SHOW, COMPLETED}"
      - name: held_until
        type: datetime
        source: computed
        description: UTC instant the HELD slot auto-expires (15 minutes after creation).
      - name: refund_cents
        type: integer
        source: computed
        description: Final refund amount in USD cents recorded on cancellation; 0 until cancelled.
        default: 0

  - name: WaitlistEntry
    parent: Campground
    common_fields: false
    fields:
      - name: campground_id
        type: string
        source: input
        description: Campground the visitor is queued for.
      - name: visitor_id
        type: string
        source: input
        description: Waiting visitor id.
      - name: site_kind
        type: enum
        source: input
        description: Site class requested.
        constraints: "{STANDARD, GROUP}"
      - name: check_in_date_local
        type: string
        source: input
        description: Desired park-local check-in date.
      - name: nights
        type: integer
        source: input
        description: Number of nights requested.
        constraints: 1..14
      - name: priority_score
        type: integer
        source: computed
        description: Tie-break score = floor((created_at - epoch) seconds / 60); lower wins.
      - name: status
        type: enum
        source: computed
        description: Waitlist entry state.
        constraints: "{WAITING, PROMOTED, EXPIRED, CANCELLED}"
      - name: promoted_reservation_id
        type: string
        source: computed
        description: CampgroundReservation id created on PROMOTED; null otherwise.
        default: null

  - name: LotteryApplication
    parent: LotteryPermit
    common_fields: true
    fields:
      - name: lottery_permit_id
        type: string
        source: input
        description: LotteryPermit this application targets.
      - name: visitor_id
        type: string
        source: input
        description: Applying visitor id.
      - name: party_size
        type: integer
        source: input
        description: Number of slots requested if awarded; must be <= LotteryPermit.per_application_max_party.
        constraints: 1..12
      - name: rank_seed
        type: integer
        source: system
        description: Server-minted unsigned 64-bit pseudo-random seed used as the lottery rank key (lower wins).
      - name: application_fee_cents
        type: integer
        source: computed
        description: Snapshot of LotteryPermit.application_fee_cents at submission; non-refundable.
      - name: status
        type: enum
        source: computed
        description: Application state.
        constraints: "{SUBMITTED, WAITLISTED, AWARDED, ACCEPTED, DECLINED, FORFEITED}"
      - name: award_expires_at
        type: datetime
        source: computed
        description: UTC instant the AWARDED state auto-forfeits if not accepted (72h after draw).

  - name: BackcountryPermit
    parent: BackcountryZone
    common_fields: true
    fields:
      - name: zone_id
        type: string
        source: input
        description: BackcountryZone id.
      - name: visitor_id
        type: string
        source: input
        description: Lead applicant visitor id.
      - name: party_size
        type: integer
        source: input
        description: Total people in the party.
        constraints: 1..15
      - name: entry_datetime_local
        type: datetime
        source: input
        description: Park-local entry timestamp at the trailhead.
      - name: exit_datetime_local
        type: datetime
        source: input
        description: Park-local exit timestamp; must be strictly after entry.
      - name: nights
        type: integer
        source: computed
        description: Number of overnight nights occupied (date diff between entry-date and exit-date in park-local).
      - name: fee_cents
        type: integer
        source: computed
        description: per_party_fee_cents + booking_fee_cents recorded at confirmation.
      - name: status
        type: enum
        source: computed
        description: Permit lifecycle.
        constraints: "{HELD, CONFIRMED, CANCELLED, USED}"
      - name: held_until
        type: datetime
        source: computed
        description: UTC instant the HELD permit auto-expires (15 minutes after creation).

  - name: LedgerEntry
    parent: Visitor
    common_fields: false
    fields:
      - name: visitor_id
        type: string
        source: input
        description: Visitor the entry belongs to.
      - name: kind
        type: enum
        source: input
        description: Movement type.
        constraints: "{DEPOSIT, FEE_CHARGE, FEE_REFUND, LOTTERY_FEE, PERMIT_FEE, ADJUSTMENT}"
      - name: amount_cents
        type: integer
        source: input
        description: Signed delta in USD cents (positive = credit to wallet, negative = debit).
      - name: reference_kind
        type: enum
        source: input
        description: Entity class the ledger entry is paired with.
        constraints: "{TimedEntryReservation, CampgroundReservation, BackcountryPermit, LotteryApplication, None}"
      - name: reference_id
        type: string
        source: input
        description: Id of the paired entity, or null for DEPOSIT/ADJUSTMENT.
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: TimedEntryReservation
    initial_state: HELD
    terminal_states: [CANCELLED, USED, NO_SHOW]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /parks/{park_id}/timed-entry/{id}/confirm"
        actor: Visitor
        preconditions:
          - "TimedEntryReservation.status == HELD"
          - "now() < TimedEntryReservation.held_until"
          - "Park.status == OPEN"
          - "Visitor.wallet_balance_cents >= TimedEntryReservation.entry_fee_cents"
        side_effects:
          - "Debit Visitor.wallet_balance_cents by entry_fee_cents (writes a LedgerEntry kind=FEE_CHARGE)"
          - "TimedEntryReservation.status set to CONFIRMED"
      - from: HELD
        to: CANCELLED
        trigger: "POST /parks/{park_id}/timed-entry/{id}/cancel OR clock advance past held_until"
        actor: Visitor | system
        preconditions:
          - "TimedEntryReservation.status == HELD"
        side_effects:
          - "Release timed-entry capacity for the (date, window) pair"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /parks/{park_id}/timed-entry/{id}/cancel"
        actor: Visitor
        preconditions:
          - "TimedEntryReservation.status == CONFIRMED"
          - "now() < entry_window_start (park-local converted to UTC)"
        side_effects:
          - "Refund applied per calc timed_entry_refund (LedgerEntry kind=FEE_REFUND)"
          - "Release timed-entry capacity for the (date, window) pair"
      - from: CONFIRMED
        to: USED
        trigger: "POST /parks/{park_id}/timed-entry/{id}/check-in"
        actor: ParkRanger
        preconditions:
          - "TimedEntryReservation.status == CONFIRMED"
          - "park-local now is within [window_start_local, window_end_local]"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /_sweep/run (after window_end_local + 60min has passed)"
        actor: system
        preconditions:
          - "TimedEntryReservation.status == CONFIRMED"
          - "park-local now > window_end_local + 60min"
        side_effects:
          - "No refund issued"

  - entity: CampgroundReservation
    initial_state: HELD
    terminal_states: [CANCELLED, NO_SHOW, COMPLETED]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /campgrounds/{id}/reservations/{id}/confirm"
        actor: Visitor
        preconditions:
          - "CampgroundReservation.status == HELD"
          - "now() < CampgroundReservation.held_until"
          - "Park.status IN {OPEN, RESTRICTED}"
          - "Visitor.wallet_balance_cents >= total_fee_cents"
          - "If site_kind == GROUP, Visitor.lottery_strikes < 3 (group sites refused to strike-flagged accounts)"
        side_effects:
          - "Debit Visitor.wallet_balance_cents by total_fee_cents (LedgerEntry kind=FEE_CHARGE)"
          - "CampgroundReservation.status set to CONFIRMED"
      - from: HELD
        to: CANCELLED
        trigger: "POST /campgrounds/{id}/reservations/{id}/cancel OR clock advance past held_until"
        actor: Visitor | system
        preconditions:
          - "CampgroundReservation.status == HELD"
        side_effects:
          - "Release site occupancy for [check_in_date_local, check_out_date_local)"
          - "Trigger waitlist promotion sweep on that campground via calc waitlist_promote (cascade depth 2)"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /campgrounds/{id}/reservations/{id}/cancel"
        actor: Visitor
        preconditions:
          - "CampgroundReservation.status == CONFIRMED"
          - "park-local now < check_in_date_local 16:00"
        side_effects:
          - "Refund credited via calc campground_refund (LedgerEntry kind=FEE_REFUND)"
          - "Release site occupancy for the booked range"
          - "Trigger waitlist promotion (cascade): waitlist_promote may create a CampgroundReservation in HELD for the next eligible WaitlistEntry, which itself transitions WaitlistEntry to PROMOTED"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /_sweep/run after check_out_date_local 11:00 park-local has passed"
        actor: system
        preconditions:
          - "CampgroundReservation.status == CONFIRMED"
          - "park-local now >= check_out_date_local 11:00"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /_sweep/run after check_in_date_local 23:00 park-local with no check-in"
        actor: system
        preconditions:
          - "CampgroundReservation.status == CONFIRMED"
          - "park-local now >= check_in_date_local + 23:00 and no check-in event recorded"
        side_effects:
          - "Visitor.lottery_strikes incremented by 1 (cascade: hits Visitor entity)"
          - "Release site occupancy for remaining nights"
          - "Trigger waitlist promotion sweep on that campground"

  - entity: LotteryApplication
    initial_state: SUBMITTED
    terminal_states: [DECLINED, FORFEITED, ACCEPTED]
    transitions:
      - from: SUBMITTED
        to: AWARDED
        trigger: "POST /lottery-permits/{id}/draw OR scheduled draw_at via clock advance"
        actor: system
        preconditions:
          - "LotteryPermit.status == CLOSED"
          - "Park.status != FROZEN"
          - "ranked by rank_seed ASC, total awarded slots so far + party_size <= LotteryPermit.daily_slot_count"
        side_effects:
          - "LotteryPermit.status set to DRAWN"
          - "award_expires_at set to draw_at + 72h"
      - from: SUBMITTED
        to: WAITLISTED
        trigger: "POST /lottery-permits/{id}/draw OR scheduled draw_at"
        actor: system
        preconditions:
          - "LotteryPermit.status == CLOSED"
          - "ranked at position where running total + party_size would exceed daily_slot_count"
      - from: AWARDED
        to: ACCEPTED
        trigger: "POST /lottery-applications/{id}/accept"
        actor: Visitor
        preconditions:
          - "LotteryApplication.status == AWARDED"
          - "now() < award_expires_at"
          - "Visitor.wallet_balance_cents >= permit_fee_cents * party_size"
        side_effects:
          - "Debit Visitor.wallet_balance_cents by permit_fee_cents * party_size (LedgerEntry kind=PERMIT_FEE)"
      - from: AWARDED
        to: DECLINED
        trigger: "POST /lottery-applications/{id}/decline"
        actor: Visitor
        preconditions:
          - "LotteryApplication.status == AWARDED"
        side_effects:
          - "Free slot returned to LotteryPermit; first WAITLISTED application with lowest rank_seed promoted to AWARDED (cascade depth 3): LotteryApplication -> LotteryPermit slot pool -> next LotteryApplication.status flip"
      - from: AWARDED
        to: FORFEITED
        trigger: "POST /_sweep/run after award_expires_at"
        actor: system
        preconditions:
          - "LotteryApplication.status == AWARDED"
          - "now() >= award_expires_at"
        side_effects:
          - "Visitor.lottery_strikes incremented by 1"
          - "Slot returned to pool; first WAITLISTED application promoted to AWARDED"
      - from: ACCEPTED
        to: FORFEITED
        trigger: "POST /lottery-applications/{id}/no-show (ranger-recorded after hike_date)"
        actor: ParkRanger
        preconditions:
          - "LotteryApplication.status == ACCEPTED"
          - "park-local now > hike_date 23:59"
        side_effects:
          - "No refund of permit_fee"
          - "Visitor.lottery_strikes incremented by 1"

  - entity: BackcountryPermit
    initial_state: HELD
    terminal_states: [CANCELLED, USED]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /backcountry-zones/{id}/permits/{id}/confirm"
        actor: Visitor
        preconditions:
          - "BackcountryPermit.status == HELD"
          - "now() < BackcountryPermit.held_until"
          - "Park.status == OPEN"
          - "Visitor.wallet_balance_cents >= fee_cents"
          - "No overlap with another CONFIRMED BackcountryPermit in the same zone where the ranger buffer is violated (see calc backcountry_overlap)"
        side_effects:
          - "Debit Visitor.wallet_balance_cents by fee_cents (LedgerEntry kind=FEE_CHARGE)"
          - "Zone usage for each overnight night incremented by party_size"
      - from: HELD
        to: CANCELLED
        trigger: "POST /backcountry-zones/{id}/permits/{id}/cancel OR clock advance past held_until"
        actor: Visitor | system
        preconditions:
          - "BackcountryPermit.status == HELD"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /backcountry-zones/{id}/permits/{id}/cancel"
        actor: Visitor
        preconditions:
          - "BackcountryPermit.status == CONFIRMED"
          - "park-local now < entry_datetime_local"
        side_effects:
          - "Refund per calc backcountry_refund"
          - "Zone usage decremented by party_size for each released night"
      - from: CONFIRMED
        to: USED
        trigger: "POST /backcountry-zones/{id}/permits/{id}/check-out (after exit_datetime_local)"
        actor: ParkRanger
        preconditions:
          - "BackcountryPermit.status == CONFIRMED"
          - "park-local now >= exit_datetime_local"

  - entity: Park
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "POST /parks/{id}/restrict"
        actor: ParkAdmin
        preconditions:
          - "Park.status == OPEN"
        side_effects:
          - "Block new TimedEntryReservation creation"
          - "Block new BackcountryPermit creation"
          - "Existing CampgroundReservation creations still allowed"
      - from: RESTRICTED
        to: OPEN
        trigger: "POST /parks/{id}/reopen"
        actor: ParkAdmin
        preconditions:
          - "Park.status == RESTRICTED"
      - from: OPEN
        to: FROZEN
        trigger: "POST /parks/{id}/freeze"
        actor: ParkAdmin
        preconditions:
          - "Park.status IN {OPEN, RESTRICTED}"
        side_effects:
          - "Block ALL new reservation/permit/lottery creation in park"
          - "Block lottery draws — POST /lottery-permits/{id}/draw rejects with ERR_PARK_FROZEN"
          - "Existing CONFIRMED reservations retained; cancellation still allowed"
      - from: RESTRICTED
        to: FROZEN
        trigger: "POST /parks/{id}/freeze"
        actor: ParkAdmin
        preconditions:
          - "Park.status == RESTRICTED"
      - from: FROZEN
        to: OPEN
        trigger: "POST /parks/{id}/reopen"
        actor: ParkAdmin
        preconditions:
          - "Park.status == FROZEN"

  - entity: WaitlistEntry
    initial_state: WAITING
    terminal_states: [PROMOTED, EXPIRED, CANCELLED]
    transitions:
      - from: WAITING
        to: PROMOTED
        trigger: "Cascade from CampgroundReservation cancel OR POST /_sweep/run within waitlist_window_hours"
        actor: system
        preconditions:
          - "WaitlistEntry.status == WAITING"
          - "Campground site availability exists for site_kind on requested nights"
          - "now() within waitlist_window_hours of check_in_date_local"
        side_effects:
          - "Server creates a CampgroundReservation in HELD for this visitor (held_until = now + 4h)"
          - "WaitlistEntry.promoted_reservation_id set"
      - from: WAITING
        to: EXPIRED
        trigger: "POST /_sweep/run after park-local check_in_date_local 18:00"
        actor: system
        preconditions:
          - "WaitlistEntry.status == WAITING"
          - "park-local now >= check_in_date_local 18:00"
      - from: WAITING
        to: CANCELLED
        trigger: "DELETE /campgrounds/{id}/waitlist/{id}"
        actor: Visitor
        preconditions:
          - "WaitlistEntry.status == WAITING"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two visitors race to HOLD the last standard site for the same nights at the same campground"
    guarantee: "Exactly one HOLD succeeds; loser receives ERR_CAMPGROUND_FULL"
    error_id: ERR_CAMPGROUND_FULL
    http_status: 409
    serialization: "First-writer-wins on Campground.standard_site_count atomic counter for the date range"

  - scenario: "Two visitors race to HOLD the last timed-entry slot in the same (date, window)"
    guarantee: "Exactly one HOLD succeeds; loser receives ERR_TIMED_ENTRY_FULL"
    error_id: ERR_TIMED_ENTRY_FULL
    http_status: 409
    serialization: "First-writer-wins on (park_id, entry_date_local, window_start_local) counter"

  - scenario: "Visitor confirms a HELD reservation while system sweep expires it"
    guarantee: "Exactly one transition wins; if sweep wins first, visitor receives ERR_INVALID_STATE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on reservation.status from HELD"

  - scenario: "Two PATCH updates to the same Campground with stale version"
    guarantee: "Higher version writes; stale version rejected"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "Optimistic concurrency on Campground.version"

  - scenario: "Two simultaneous draws POSTed against the same LotteryPermit"
    guarantee: "Exactly one draw runs; second rejected"
    error_id: ERR_LOTTERY_ALREADY_DRAWN
    http_status: 409
    serialization: "First-writer-wins on LotteryPermit.status transition CLOSED->DRAWN"

  - scenario: "Visitor accepts and declines the same AWARDED lottery application concurrently"
    guarantee: "Exactly one transition wins; the loser receives ERR_INVALID_STATE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on LotteryApplication.status from AWARDED"

  - scenario: "Two BackcountryPermit HOLD requests overlap the same ranger-buffer window at the same trailhead"
    guarantee: "Exactly one HOLD wins; the loser receives ERR_RANGER_BUFFER_VIOLATION"
    error_id: ERR_RANGER_BUFFER_VIOLATION
    http_status: 409
    serialization: "First-writer-wins on BackcountryZone (entry_datetime_local) interval-tree insert"

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: timed_entry_refund
    trigger: "On TimedEntryReservation.status transition CONFIRMED -> CANCELLED via cancel endpoint"
    algorithm: tiered_pricing
    formula: |
      let hours = (entry_window_start_utc - now_utc) / 3600.0
      let base = entry_fee_cents
      if hours >= 168:        # >= 7 days out
          refund = base                         # 100%
      elif hours >= 48:       # >= 48h and < 7d
          refund = floor(base * 0.50)           # 50%
      else:                   # < 48h
          refund = 0
      # final write: CampgroundReservation/TimedEntryReservation.refund_cents = refund
      # LedgerEntry FEE_REFUND amount = +refund
    input_set: "TimedEntryReservation.entry_fee_cents, entry_date_local, window_start_local, Park.timezone"
    constants:
      FULL_WINDOW_HOURS: 168
      HALF_WINDOW_HOURS: 48
      HALF_RATE: 0.50
    precision: "integer cents, floor"
    variants:
      - name: pass_waived
        when: "TimedEntryReservation.pass_id is non-null and pass is ACTIVE at entry_date_local"
        difference: "entry_fee_cents was 0 at confirm so refund is always 0 regardless of timing"

  - name: campground_refund
    trigger: "On CampgroundReservation.status transition CONFIRMED -> CANCELLED via cancel endpoint"
    algorithm: tiered_pricing
    formula: |
      let total = total_fee_cents
      let nightly = nightly_rate_cents
      let booking_fee = BOOKING_FEE_CENTS  # 800
      let hours = (check_in_datetime_park_local_utc - now_utc) / 3600.0
      if hours >= 336:                    # >= 14 days out
          refund = total - booking_fee    # forfeits 8.00 booking fee
      elif hours >= 72:                   # >= 3 days
          refund = floor((total - booking_fee) * 0.50)
      elif hours >= 24:                   # >= 24h
          refund = floor((nightly * 1) * 0.0)  # one night forfeit equivalent, see variant
          refund = max(0, total - booking_fee - nightly)
      else:
          refund = 0
      # Write CampgroundReservation.refund_cents = refund
    input_set: "CampgroundReservation.total_fee_cents, nightly_rate_cents, check_in_date_local, Park.timezone"
    constants:
      BOOKING_FEE_CENTS: 800
      FOURTEEN_DAY_HOURS: 336
      THREE_DAY_HOURS: 72
      ONE_DAY_HOURS: 24
      HALF_RATE: 0.50
    precision: "integer cents, floor; 'floor per intermediate' — apply floor to the percentage step BEFORE adding any other component"
    variants:
      - name: group_site_strict
        when: "CampgroundReservation.site_kind == GROUP"
        difference: |
          For group sites, the booking_fee is always forfeit AND a one-night non-refundable deposit
          is held regardless of timing: refund = max(0, total - booking_fee - nightly_rate_cents).
          This produces a strictly lower refund than the STANDARD variant on identical inputs whenever
          the standard variant would have returned more than (total - booking_fee - nightly).

  - name: booking_total
    trigger: "On CampgroundReservation creation (HOLD)"
    algorithm: aggregation
    formula: |
      nights = date_diff(check_out_date_local, check_in_date_local)
      nightly_rate = (site_kind == STANDARD) ? Campground.nightly_standard_fee_cents
                                             : Campground.nightly_group_fee_cents
      site_total = nightly_rate * nights
      booking_fee = BOOKING_FEE_CENTS
      # ROUNDING ORDER PINNED: tax is applied to (site_total + booking_fee) ROUNDED first, then floored
      pre_tax = site_total + booking_fee     # both are already integer cents
      total = pre_tax + floor(pre_tax * TAX_RATE)   # floor after multiplication
      # Write CampgroundReservation.nights, nightly_rate_cents, total_fee_cents
    input_set: "Campground fees, site_kind, date range"
    constants:
      BOOKING_FEE_CENTS: 800
      TAX_RATE: 0.08
    precision: "integer cents; floor AFTER multiplying tax; never floor each nightly rate"

  - name: backcountry_overlap
    trigger: "On BackcountryPermit transition HELD -> CONFIRMED"
    algorithm: interval_merge
    formula: |
      # Half-open intervals [entry, exit) on the same zone with ranger buffer:
      # New permit [a, b) collides with existing [c, d) iff
      #     a < d + buffer   AND   c < b + buffer
      # where buffer = BackcountryZone.ranger_buffer_minutes converted to seconds.
      # Closed-on-left, open-on-right; equality at b == c PASSES iff the gap >= buffer.
      # ALSO check nightly_quota_people per overnight night:
      #   for each night N covered by the permit (entry-date .. exit-date - 1),
      #   sum(party_size of confirmed permits overlapping N) + new.party_size <= nightly_quota_people
      # Reject with ERR_RANGER_BUFFER_VIOLATION on time-collision; ERR_BACKCOUNTRY_FULL on quota.
    input_set: "All CONFIRMED BackcountryPermit rows in the same zone whose [entry, exit) overlaps the new permit's window expanded by ranger_buffer_minutes on both sides"
    constants: {}
    precision: "minute granularity (truncate sub-minute components on input)"

  - name: lottery_draw
    trigger: "POST /lottery-permits/{id}/draw OR clock advance past draw_at"
    algorithm: waterfall_allocation
    formula: |
      eligible = LotteryApplications where lottery_permit_id == id AND status == SUBMITTED
                                       AND applicant Visitor.lottery_strikes < 3
      sorted = eligible ORDER BY rank_seed ASC, created_at ASC (tie-break)
      remaining = LotteryPermit.daily_slot_count
      for app in sorted:
        if remaining >= app.party_size:
          app.status = AWARDED; remaining -= app.party_size
        else:
          app.status = WAITLISTED
      LotteryPermit.status = DRAWN
    input_set: "All SUBMITTED applications for the lottery, with applicant strike count"
    constants:
      MAX_STRIKES: 3
    precision: "integer slot count; tie-break (rank_seed, created_at) lexicographic"

  - name: backcountry_refund
    trigger: "On BackcountryPermit transition CONFIRMED -> CANCELLED"
    algorithm: threshold
    formula: |
      let hours = (entry_datetime_local_as_utc - now_utc) / 3600.0
      if hours >= 168:    refund = fee_cents
      elif hours >= 24:   refund = floor(fee_cents * 0.50)
      else:               refund = 0
    input_set: "BackcountryPermit.fee_cents, entry_datetime_local, Park.timezone"
    constants:
      FULL_WINDOW_HOURS: 168
      HALF_WINDOW_HOURS: 24
      HALF_RATE: 0.50
    precision: "integer cents, floor"

  - name: waitlist_promote
    trigger: "Cascade after CampgroundReservation HELD/CONFIRMED -> CANCELLED OR POST /_sweep/run within waitlist_window_hours"
    algorithm: chronological
    formula: |
      # For each campground that just freed inventory for site_kind in nights [d1, d2):
      eligible = WaitlistEntry where campground_id == ... AND status == WAITING
                                  AND site_kind == freed_kind
                                  AND date_overlap(check_in_date_local + nights, [d1, d2))
                                  AND now within waitlist_window_hours of check_in_date_local
      sorted = eligible ORDER BY priority_score ASC, created_at ASC
      for w in sorted:
        if site_kind capacity available for entire [w.check_in, w.check_in + w.nights):
          create CampgroundReservation in HELD for visitor; held_until = now + PROMOTION_HOLD_HOURS h
          w.status = PROMOTED; w.promoted_reservation_id = new_reservation.id
          break  # one promotion per cancellation event
    input_set: "WaitlistEntry rows for the campground in WAITING status"
    constants:
      PROMOTION_HOLD_HOURS: 4
    precision: "integer minutes for priority_score tie-break"

# =============================================================================
# 1.4 Validation Rules Table (ordered)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted to invoke this endpoint per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path parameters resolve to existing entities, validated left-to-right (park, then campground, then reservation, etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "Target resource is in a status that permits this operation (e.g., HOLD only confirmable from HELD)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 5
    category: state
    check: "Park.status permits the operation: FROZEN blocks ALL creation; RESTRICTED blocks timed-entry and backcountry creation"
    error_id: ERR_PARK_FROZEN
    http_status: 409
    applies_to: "POST /parks/{id}/timed-entry, POST /lottery-permits/{id}/draw, POST /backcountry-zones/{id}/permits, POST /campgrounds/{id}/reservations"

  - priority: 6
    category: business_safety
    check: "Visitor.lottery_strikes < 3 when creating a LotteryApplication"
    error_id: ERR_STRIKE_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /lottery-permits/{id}/applications"

  - priority: 7
    category: business_safety
    check: "GROUP CampgroundReservation requires Visitor.lottery_strikes < 3 (group-site denial precedes capacity check)"
    error_id: ERR_STRIKE_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /campgrounds/{id}/reservations when site_kind=GROUP"

  - priority: 8
    category: business_referential
    check: "TimedEntryReservation.pass_id (if present) belongs to the requesting Visitor and pass.status == ACTIVE at entry_date_local"
    error_id: ERR_PASS_INVALID
    http_status: 422
    applies_to: "POST /parks/{id}/timed-entry, PATCH timed-entry"

  - priority: 9
    category: business_temporal
    check: "TimedEntryReservation entry_date_local is within 30 days of now (park-local) and not in the past"
    error_id: ERR_OUT_OF_BOOKING_WINDOW
    http_status: 422
    applies_to: "POST /parks/{id}/timed-entry"

  - priority: 10
    category: business_temporal
    check: "TimedEntryReservation.window_start_local aligns to a boundary multiple of Park.timed_entry_window_minutes"
    error_id: ERR_WINDOW_MISALIGNED
    http_status: 422
    applies_to: "POST /parks/{id}/timed-entry"

  - priority: 11
    category: business_constraint
    check: "CampgroundReservation party_size matches site_kind: STANDARD requires 1..6; GROUP requires 7..40"
    error_id: ERR_PARTY_SIZE_INVALID
    http_status: 422
    applies_to: "POST /campgrounds/{id}/reservations"

  - priority: 12
    category: business_temporal
    check: "CampgroundReservation nights (check_out - check_in) <= Campground.max_consecutive_nights and > 0"
    error_id: ERR_STAY_TOO_LONG
    http_status: 422
    applies_to: "POST /campgrounds/{id}/reservations"

  - priority: 13
    category: business_constraint
    check: "BackcountryPermit ranger-buffer overlap: time-collision check is reported via ERR_RANGER_BUFFER_VIOLATION (checked BEFORE nightly_quota_people)"
    error_id: ERR_RANGER_BUFFER_VIOLATION
    http_status: 409
    applies_to: "POST /backcountry-zones/{id}/permits/{id}/confirm"

  - priority: 14
    category: business_constraint
    check: "BackcountryPermit nightly_quota_people not exceeded across overnight nights"
    error_id: ERR_BACKCOUNTRY_FULL
    http_status: 409
    applies_to: "POST /backcountry-zones/{id}/permits/{id}/confirm"

  - priority: 15
    category: business_constraint
    check: "TimedEntryReservation: remaining daily capacity > 0 for (park, date, window)"
    error_id: ERR_TIMED_ENTRY_FULL
    http_status: 409
    applies_to: "POST /parks/{id}/timed-entry"

  - priority: 16
    category: business_constraint
    check: "CampgroundReservation: site_kind inventory available for full date range"
    error_id: ERR_CAMPGROUND_FULL
    http_status: 409
    applies_to: "POST /campgrounds/{id}/reservations"

  - priority: 17
    category: business_fiscal
    check: "Visitor.wallet_balance_cents >= computed fee at confirm time"
    error_id: ERR_INSUFFICIENT_FUNDS
    http_status: 402
    applies_to: "POST .../confirm, POST /lottery-applications/{id}/accept"

  - priority: 18
    category: business_constraint
    check: "LotteryApplication.party_size <= LotteryPermit.per_application_max_party"
    error_id: ERR_PARTY_SIZE_INVALID
    http_status: 422
    applies_to: "POST /lottery-permits/{id}/applications"

  - priority: 19
    category: business_temporal
    check: "LotteryApplication submission time strictly within [lottery_open_at, lottery_close_at)"
    error_id: ERR_LOTTERY_CLOSED
    http_status: 422
    applies_to: "POST /lottery-permits/{id}/applications"

  - priority: 20
    category: business_constraint
    check: "OCC: provided version equals current entity version on PATCH"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH endpoints"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ----- Clock / Sweep (test driver) -----
  - method: POST
    path: "/_clock/advance"
    description: "Advance virtual clock to the given ISO8601 UTC instant; required to reach time-gated states without wall-clock waits."
    roles: [SystemOperator]
    code: 200
    input: [target_iso]
    output: object
    side_effects: ["No automatic transitions; sweep is separate"]

  - method: POST
    path: "/_sweep/run"
    description: "Run the deferred-action sweep: expire HELD reservations, sweep AWARDED forfeits, mark NO_SHOW/COMPLETED, promote waitlist, transition Parks. Idempotent within an instant."
    roles: [SystemOperator]
    code: 200
    input: []
    output: object
    side_effects:
      - "Expire HELD TimedEntryReservation/CampgroundReservation/BackcountryPermit past held_until"
      - "Forfeit AWARDED LotteryApplications past award_expires_at; promote next WAITLISTED"
      - "Transition CONFIRMED CampgroundReservation to NO_SHOW or COMPLETED per timing"
      - "Promote eligible WaitlistEntries within waitlist_window_hours"

  - method: POST
    path: "/visitors/{visitor_id}/wallet/deposit"
    description: "Deposit funds into the visitor wallet (test setup)."
    roles: [SystemOperator, Visitor]
    code: 201
    input: [amount_cents]
    output: LedgerEntry

  # ----- Parks -----
  - method: POST
    path: "/parks"
    description: "Create a park."
    roles: [ParkAdmin]
    code: 201
    input: [name, code, timezone, timed_entry_daily_capacity, "timed_entry_window_minutes?"]
    output: Park

  - method: GET
    path: "/parks"
    description: "List parks with pagination."
    roles: [ParkAdmin, Visitor, ParkRanger, SystemOperator]
    code: 200
    input: []
    output: "Park[]"

  - method: GET
    path: "/parks/{park_id}"
    description: "Read a park."
    roles: [ParkAdmin, Visitor, ParkRanger, SystemOperator]
    code: 200
    input: []
    output: Park

  - method: PATCH
    path: "/parks/{park_id}"
    description: "Update park configuration with OCC."
    roles: [ParkAdmin]
    code: 200
    input: [version, "name?", "timed_entry_daily_capacity?", "timed_entry_window_minutes?"]
    output: Park

  - method: POST
    path: "/parks/{park_id}/restrict"
    description: "Move Park OPEN -> RESTRICTED."
    roles: [ParkAdmin]
    code: 200
    input: []
    output: Park

  - method: POST
    path: "/parks/{park_id}/freeze"
    description: "Move Park to FROZEN."
    roles: [ParkAdmin]
    code: 200
    input: []
    output: Park

  - method: POST
    path: "/parks/{park_id}/reopen"
    description: "Move Park back to OPEN."
    roles: [ParkAdmin]
    code: 200
    input: []
    output: Park

  # ----- Visitors / Passes -----
  - method: POST
    path: "/visitors"
    description: "Create a visitor account."
    roles: [SystemOperator]
    code: 201
    input: [email, full_name]
    output: Visitor

  - method: GET
    path: "/visitors/{visitor_id}"
    description: "Read visitor (including computed wallet_balance_cents and lottery_strikes)."
    roles: [SystemOperator, Visitor]
    code: 200
    input: []
    output: Visitor

  - method: POST
    path: "/visitors/{visitor_id}/passes"
    description: "Issue an America the Beautiful Pass to a visitor."
    roles: [ParkAdmin]
    code: 201
    input: [pass_type, valid_from, valid_until]
    output: AmericaTheBeautifulPass

  - method: GET
    path: "/visitors/{visitor_id}/passes"
    description: "List a visitor's passes."
    roles: [SystemOperator, Visitor, ParkAdmin]
    code: 200
    input: []
    output: "AmericaTheBeautifulPass[]"

  - method: POST
    path: "/visitors/{visitor_id}/passes/{pass_id}/revoke"
    description: "Revoke an active pass; future entries cannot use it."
    roles: [ParkAdmin]
    code: 200
    input: []
    output: AmericaTheBeautifulPass

  # ----- Timed Entry -----
  - method: POST
    path: "/parks/{park_id}/timed-entry"
    description: "Create a HELD timed-entry reservation."
    roles: [Visitor]
    code: 201
    input: [vehicle_plate, entry_date_local, window_start_local, "pass_id?"]
    output: TimedEntryReservation
    side_effects: ["Decrement remaining (park, date, window) capacity counter"]

  - method: POST
    path: "/parks/{park_id}/timed-entry/{id}/confirm"
    description: "Confirm a HELD reservation by paying the entry fee."
    roles: [Visitor]
    code: 200
    input: []
    output: TimedEntryReservation
    side_effects: ["LedgerEntry FEE_CHARGE; wallet debit"]

  - method: POST
    path: "/parks/{park_id}/timed-entry/{id}/cancel"
    description: "Cancel a HELD or CONFIRMED reservation; refund per calc timed_entry_refund."
    roles: [Visitor]
    code: 200
    input: []
    output: TimedEntryReservation
    side_effects: ["LedgerEntry FEE_REFUND (if applicable); capacity released"]

  - method: POST
    path: "/parks/{park_id}/timed-entry/{id}/check-in"
    description: "Ranger marks the reservation USED at the gate during the window."
    roles: [ParkRanger]
    code: 200
    input: []
    output: TimedEntryReservation

  - method: GET
    path: "/parks/{park_id}/timed-entry"
    description: "List timed-entry reservations (admin/ranger) or own (visitor)."
    roles: [ParkAdmin, ParkRanger, Visitor]
    code: 200
    input: []
    output: "TimedEntryReservation[]"

  # ----- Campgrounds & Reservations -----
  - method: POST
    path: "/parks/{park_id}/campgrounds"
    description: "Create a campground under a park."
    roles: [ParkAdmin]
    code: 201
    input: [name, standard_site_count, group_site_count, nightly_standard_fee_cents, nightly_group_fee_cents, "max_consecutive_nights?", "waitlist_window_hours?"]
    output: Campground

  - method: GET
    path: "/parks/{park_id}/campgrounds"
    description: "List campgrounds in a park."
    roles: [ParkAdmin, Visitor, ParkRanger]
    code: 200
    input: []
    output: "Campground[]"

  - method: POST
    path: "/campgrounds/{campground_id}/reservations"
    description: "Create a HELD campground reservation."
    roles: [Visitor]
    code: 201
    input: [site_kind, party_size, check_in_date_local, check_out_date_local]
    output: CampgroundReservation
    side_effects: ["booking_total calc populates nights, nightly_rate_cents, total_fee_cents; inventory counter decremented"]

  - method: POST
    path: "/campgrounds/{campground_id}/reservations/{id}/confirm"
    description: "Confirm a HELD campground reservation by paying total_fee_cents."
    roles: [Visitor]
    code: 200
    input: []
    output: CampgroundReservation
    side_effects: ["LedgerEntry FEE_CHARGE; wallet debit"]

  - method: POST
    path: "/campgrounds/{campground_id}/reservations/{id}/cancel"
    description: "Cancel; refund per calc campground_refund; cascades waitlist promotion."
    roles: [Visitor]
    code: 200
    input: []
    output: CampgroundReservation
    side_effects: ["LedgerEntry FEE_REFUND; inventory released; waitlist_promote may run (cascade depth >= 2)"]

  - method: POST
    path: "/campgrounds/{campground_id}/reservations/{id}/check-in"
    description: "Ranger records arrival; required to avoid NO_SHOW."
    roles: [ParkRanger]
    code: 200
    input: []
    output: CampgroundReservation

  - method: GET
    path: "/campgrounds/{campground_id}/reservations"
    description: "List reservations for a campground."
    roles: [ParkAdmin, ParkRanger, Visitor]
    code: 200
    input: []
    output: "CampgroundReservation[]"

  # ----- Waitlist -----
  - method: POST
    path: "/campgrounds/{campground_id}/waitlist"
    description: "Join the waitlist for a campground/date/site_kind."
    roles: [Visitor]
    code: 201
    input: [site_kind, check_in_date_local, nights]
    output: WaitlistEntry

  - method: GET
    path: "/campgrounds/{campground_id}/waitlist"
    description: "List waitlist entries (ranger/admin: all; visitor: own)."
    roles: [ParkAdmin, ParkRanger, Visitor]
    code: 200
    input: []
    output: "WaitlistEntry[]"

  - method: DELETE
    path: "/campgrounds/{campground_id}/waitlist/{id}"
    description: "Cancel a waitlist entry (visitor leaves the queue)."
    roles: [Visitor]
    code: 204
    input: []
    output: null

  # ----- Lottery -----
  - method: POST
    path: "/parks/{park_id}/lottery-permits"
    description: "Create a lottery permit (e.g., Half Dome, The Wave) for a future hike_date."
    roles: [ParkAdmin]
    code: 201
    input: [name, lottery_open_at, lottery_close_at, draw_at, hike_date, daily_slot_count, per_application_max_party, application_fee_cents, permit_fee_cents]
    output: LotteryPermit

  - method: GET
    path: "/parks/{park_id}/lottery-permits"
    description: "List lottery permits for a park."
    roles: [ParkAdmin, Visitor, ParkRanger]
    code: 200
    input: []
    output: "LotteryPermit[]"

  - method: POST
    path: "/lottery-permits/{id}/applications"
    description: "Submit a lottery application; wallet is debited application_fee_cents (non-refundable)."
    roles: [Visitor]
    code: 201
    input: [party_size]
    output: LotteryApplication
    side_effects: ["LedgerEntry LOTTERY_FEE; rank_seed assigned"]

  - method: POST
    path: "/lottery-permits/{id}/draw"
    description: "Trigger the lottery draw (idempotent: must be CLOSED, not yet DRAWN)."
    roles: [ParkAdmin, SystemOperator]
    code: 200
    input: []
    output: LotteryPermit
    side_effects: ["Applications transitioned to AWARDED/WAITLISTED per lottery_draw calc"]

  - method: GET
    path: "/lottery-permits/{permit_id}/applications"
    description: "List applications under a permit (admin sees all; visitor sees own)."
    roles: [ParkAdmin, Visitor]
    code: 200
    input: []
    output: "LotteryApplication[]"

  - method: POST
    path: "/lottery-applications/{id}/accept"
    description: "Accept an AWARDED slot; wallet debited permit_fee_cents * party_size."
    roles: [Visitor]
    code: 200
    input: []
    output: LotteryApplication

  - method: POST
    path: "/lottery-applications/{id}/decline"
    description: "Decline an AWARDED slot; slot returned to pool and next WAITLISTED promoted."
    roles: [Visitor]
    code: 200
    input: []
    output: LotteryApplication

  - method: POST
    path: "/lottery-applications/{id}/no-show"
    description: "Ranger marks an ACCEPTED application a no-show after hike_date; strike incremented."
    roles: [ParkRanger]
    code: 200
    input: []
    output: LotteryApplication

  # ----- Backcountry -----
  - method: POST
    path: "/parks/{park_id}/backcountry-zones"
    description: "Create a backcountry zone."
    roles: [ParkAdmin]
    code: 201
    input: [name, nightly_quota_people, "ranger_buffer_minutes?", per_party_fee_cents]
    output: BackcountryZone

  - method: GET
    path: "/parks/{park_id}/backcountry-zones"
    description: "List backcountry zones in a park."
    roles: [ParkAdmin, Visitor, ParkRanger]
    code: 200
    input: []
    output: "BackcountryZone[]"

  - method: POST
    path: "/backcountry-zones/{zone_id}/permits"
    description: "Create a HELD backcountry permit."
    roles: [Visitor]
    code: 201
    input: [party_size, entry_datetime_local, exit_datetime_local]
    output: BackcountryPermit

  - method: POST
    path: "/backcountry-zones/{zone_id}/permits/{id}/confirm"
    description: "Confirm a HELD backcountry permit; runs backcountry_overlap; debits wallet."
    roles: [Visitor]
    code: 200
    input: []
    output: BackcountryPermit
    side_effects: ["LedgerEntry FEE_CHARGE; zone usage incremented"]

  - method: POST
    path: "/backcountry-zones/{zone_id}/permits/{id}/cancel"
    description: "Cancel; refund per backcountry_refund."
    roles: [Visitor]
    code: 200
    input: []
    output: BackcountryPermit
    side_effects: ["LedgerEntry FEE_REFUND; zone usage decremented"]

  - method: POST
    path: "/backcountry-zones/{zone_id}/permits/{id}/check-out"
    description: "Ranger marks the permit USED at exit."
    roles: [ParkRanger]
    code: 200
    input: []
    output: BackcountryPermit

  - method: GET
    path: "/visitors/{visitor_id}/ledger"
    description: "List ledger entries for the visitor (audit trail)."
    roles: [SystemOperator, Visitor]
    code: 200
    input: []
    output: "LedgerEntry[]"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Caller's role is not permitted for the endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced entity does not exist (validated left-to-right in path)"
  - id: ERR_VALIDATION
    http: 422
    condition: "Generic schema or value-range violation on input fields"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Provided version does not match current entity version"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity is not in a status that permits this transition"
  - id: ERR_PARK_FROZEN
    http: 409
    condition: "Park.status == FROZEN blocks the operation"
  - id: ERR_PARK_RESTRICTED
    http: 409
    condition: "Park.status == RESTRICTED blocks the operation (timed-entry / backcountry create)"
  - id: ERR_OUT_OF_BOOKING_WINDOW
    http: 422
    condition: "Requested date outside the allowed booking window (timed-entry: 30-day rolling)"
  - id: ERR_WINDOW_MISALIGNED
    http: 422
    condition: "window_start_local does not align to a multiple of Park.timed_entry_window_minutes"
  - id: ERR_TIMED_ENTRY_FULL
    http: 409
    condition: "Remaining timed-entry slots for (park, date, window) is zero"
  - id: ERR_CAMPGROUND_FULL
    http: 409
    condition: "No site_kind inventory available across requested nights"
  - id: ERR_BACKCOUNTRY_FULL
    http: 409
    condition: "Nightly_quota_people would be exceeded on at least one overnight night"
  - id: ERR_RANGER_BUFFER_VIOLATION
    http: 409
    condition: "Backcountry permit overlaps ranger_buffer_minutes window of an existing permit at the trailhead"
  - id: ERR_PASS_INVALID
    http: 422
    condition: "Referenced pass missing, expired, revoked, or owned by another visitor"
  - id: ERR_PARTY_SIZE_INVALID
    http: 422
    condition: "Party size out of allowed range for site_kind or lottery permit"
  - id: ERR_STAY_TOO_LONG
    http: 422
    condition: "Requested nights exceed Campground.max_consecutive_nights"
  - id: ERR_INSUFFICIENT_FUNDS
    http: 402
    condition: "Visitor.wallet_balance_cents < computed fee at confirm time"
  - id: ERR_LOTTERY_CLOSED
    http: 422
    condition: "Submission outside [lottery_open_at, lottery_close_at)"
  - id: ERR_LOTTERY_ALREADY_DRAWN
    http: 409
    condition: "Lottery already in DRAWN state when draw is invoked"
  - id: ERR_STRIKE_LIMIT_REACHED
    http: 422
    condition: "Visitor.lottery_strikes >= 3"
  - id: ERR_AWARD_EXPIRED
    http: 409
    condition: "AWARDED slot already past award_expires_at"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Visitor
    description: "Individual member of the public who books reservations, applies to lotteries, and holds passes."
    identity: "entity_backed:Visitor"
    exclusive_operations:
      - "POST /parks/{park_id}/timed-entry"
      - "POST /campgrounds/{campground_id}/reservations"
      - "POST /lottery-permits/{id}/applications"
      - "POST /backcountry-zones/{zone_id}/permits"
      - "POST /lottery-applications/{id}/accept|decline"
      - "POST /campgrounds/{campground_id}/waitlist"
      - "DELETE /campgrounds/{campground_id}/waitlist/{id}"
    shared_operations:
      - "GET on parks/campgrounds/zones/lottery-permits/passes"
      - "GET /visitors/{visitor_id}/ledger (own only)"
      - "POST /visitors/{visitor_id}/wallet/deposit (own only)"
      - "POST */confirm and */cancel on own reservations/permits"

  - name: ParkAdmin
    description: "Park operations role: provisions parks, campgrounds, zones, lottery permits; issues/revokes passes; runs Park status transitions."
    identity: "opaque"
    exclusive_operations:
      - "POST /parks"
      - "PATCH /parks/{park_id}"
      - "POST /parks/{park_id}/restrict|freeze|reopen"
      - "POST /parks/{park_id}/campgrounds"
      - "POST /parks/{park_id}/backcountry-zones"
      - "POST /parks/{park_id}/lottery-permits"
      - "POST /visitors/{visitor_id}/passes"
      - "POST /visitors/{visitor_id}/passes/{pass_id}/revoke"
    shared_operations:
      - "POST /lottery-permits/{id}/draw (with SystemOperator)"
      - "GET on all park-scoped resources"

  - name: ParkRanger
    description: "On-the-ground field staff who check in/out reservations and permits and record no-shows."
    identity: "opaque"
    exclusive_operations:
      - "POST /parks/{park_id}/timed-entry/{id}/check-in"
      - "POST /campgrounds/{campground_id}/reservations/{id}/check-in"
      - "POST /backcountry-zones/{zone_id}/permits/{id}/check-out"
      - "POST /lottery-applications/{id}/no-show"
    shared_operations:
      - "GET on all park-scoped resources"

  - name: SystemOperator
    description: "Backend operator / test driver. Runs deferred-action sweeps, advances clock, manages visitor wallet credits."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/advance"
      - "POST /_sweep/run"
      - "POST /visitors"
    shared_operations:
      - "POST /lottery-permits/{id}/draw (with ParkAdmin)"
      - "POST /visitors/{visitor_id}/wallet/deposit (any visitor)"
      - "GET on all resources"
