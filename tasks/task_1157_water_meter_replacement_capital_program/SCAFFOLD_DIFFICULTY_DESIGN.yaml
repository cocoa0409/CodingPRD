            - { call: "POST /api/appointments", payload: { work_order_id: "${wo}", slot_date: "2026-05-06", window: "AM", expected_work_order_version: "${wo_s1}" }, as: Scheduler, captures: { appt1: $.data.id } }
            - { call: "POST /api/appointments/${appt1}/no-access", payload: {}, as: FieldContractor, as_user_id: "${contr}" }
            # strike 2
