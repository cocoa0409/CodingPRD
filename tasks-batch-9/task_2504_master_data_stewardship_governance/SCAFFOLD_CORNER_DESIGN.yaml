          - entities.QualityRule.fields.weight_points
        distinguishing_aspect: "Each rule's weight is individually legal (1..100); only the SUM over the domain's ACTIVE rules is capped at 100, and the cap is inclusive - 40 + 40 + 30 must be refused while 40 + 40 + 20 lands exactly on 100 and is accepted."
        test_recipe:
          setup:
            - "DRAFT-STEWARDED domain CUSTOMER with ACTIVE rules QR1 (40 pts) and QR2 (40 pts)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: GovernanceAdmin
            - call: "POST /mdm/domains"
              payload: { code: "CUSTOMER", name: "Customer Master", classification_level: "INTERNAL", notification_lead_days_floor: 5, expected_attribute_count: 5 }
              as: GovernanceAdmin
              captures: { dom_id: $.data.id, dom_v1: $.data.version }
