  # ---------------- intake ------------------------------------------------------------------------
  - method: POST
    path: "/applicants"
    description: "Register a rider record. All conduct and eligibility mirrors start at their declared defaults."
    roles: [IntakeClerk, AccessibilityOfficeAdmin]
    code: 201
    input: ["full_name", "date_of_birth", "residence_zone", "mobility_aid?", "primary_language?", "home_agency_name?"]
    output: Applicant
    side_effects:
      - "current_eligibility_status = NONE; service_status = ACTIVE; version = 1"
  - method: POST
    path: "/applications"
    description: "Open an intake packet in DRAFT for one applicant."
    roles: [Applicant, IntakeClerk]
    code: 201
    input: ["applicant_id", "application_type", "functional_answers", "claimed_conditions?"]
    output: Application
    side_effects:
      - "status = DRAFT; version = 1"
      - "rejected with ERR_DUPLICATE_OPEN_APPLICATION when the applicant already has a non-DETERMINED application"
  - method: POST
    path: "/applications/{id}/submit"
    description: "Submit or resubmit an intake packet; starts (or restarts) the 21-day statutory window."
    roles: [Applicant, IntakeClerk]
    code: 200
    input: ["functional_answers?"]
    output: Application
    side_effects:
      - "state_machines.Application DRAFT -> SUBMITTED or RETURNED_INCOMPLETE -> SUBMITTED"
      - "completeness_established_at = submitted_at (RESET on resubmission); determination_due_date = +21 days"
      - "resubmission_count += 1 on the cycle edge; missing_items = []"
      - "increments Application.version by 1"
  - method: POST
    path: "/applications/{id}/return-incomplete"
    description: "Return a submitted packet to the rider with a list of missing items; stops the statutory clock."
    roles: [IntakeClerk]
    code: 200
    input: [missing_items]
    output: Application
    side_effects:
      - "state_machines.Application SUBMITTED -> RETURNED_INCOMPLETE"
      - "completeness_established_at = null; determination_due_date = null"
      - "increments Application.version by 1"
  - method: POST
    path: "/applications/{id}/verifications"
    description: "Request professional verification of the claimed functional limitations."
    roles: [IntakeClerk]
    code: 201
    input: [provider_name, provider_type, provider_license_number]
    output: ProfessionalVerification
    side_effects:
      - "ProfessionalVerification created with status REQUESTED, requested_at = clock now"
      - "state_machines.Application SUBMITTED -> PENDING_VERIFICATION, or the PENDING_VERIFICATION self-loop on re-request"
      - "increments Application.version by 1"
  - method: POST
    path: "/applications/{id}/verifications/{verification_id}/receive"
    description: "Record the professional's response. outcome ACCEPTED advances the packet to ASSESSMENT_REQUIRED; outcome INSUFFICIENT keeps it in PENDING_VERIFICATION."
    roles: [IntakeClerk]
    code: 200
    input: ["outcome", "attests_conditions?", "attests_permanent?", "insufficiency_reason?"]
    output: ProfessionalVerification
    side_effects:
      - "status = RECEIVED or INSUFFICIENT; received_at = clock now; wait_days computed"
      - "Application.verification_excluded_days += wait_days (shrinks days_pending_net_agency only)"
      - "on ACCEPTED: Application.attests_permanent = verification.attests_permanent; Application.status = ASSESSMENT_REQUIRED"
      - "increments Application.version by 1"

  # ---------------- assessment scheduling and transport -------------------------------------------
  - method: POST
    path: "/assessment-slots"
    description: "Publish an in-person assessment slot staffed by one evaluator; enforces the 15-minute evaluator turnaround buffer."
    roles: [AccessibilityOfficeAdmin]
    code: 201
    input: ["site_name", "evaluator_user_id", "starts_at", "ends_at", "capacity", "site_is_wheelchair_accessible?"]
    output: AssessmentSlot
    side_effects:
      - "booked_count = 0; status = OPEN"
      - "rejected with ERR_EVALUATOR_SLOT_CONFLICT per calculations.evaluator_slot_conflict"
  - method: POST
    path: "/vehicles"
    description: "Register an accessible vehicle available for assessment rides."
    roles: [AccessibilityOfficeAdmin]
    code: 201
    input: ["vehicle_number", "wheelchair_positions?", "ambulatory_seats?", "status?"]
    output: Vehicle
    side_effects:
      - "open_wheelchair_reservations = 0; open_ambulatory_reservations = 0"
  - method: POST
    path: "/applications/{id}/assessments"
    description: "Book an in-person functional assessment into a slot. Supplying rescheduled_from_assessment_id books the replacement for a prior NO_SHOW or agency cancellation."
    roles: [IntakeClerk]
    code: 201
    input: ["slot_id", "requires_wheelchair_position?", "rescheduled_from_assessment_id?"]
    output: FunctionalAssessment
    side_effects:
      - "FunctionalAssessment created (attendance_status SCHEDULED, scoring_status NOT_STARTED)"
      - "AssessmentSlot.booked_count += 1; status = FULL when booked_count == capacity"
      - "state_machines.Application ASSESSMENT_REQUIRED -> ASSESSMENT_SCHEDULED"
      - "on reschedule: Application.applicant_delay_days += whole days between the prior slot start and this slot start"
      - "increments Application.version by 1"
  - method: POST
    path: "/transportation-bookings"
    description: "Reserve the agency-provided ride to an assessment; enforces vehicle accessibility and half-open window capacity."
    roles: [IntakeClerk, AccessibilityOfficeAdmin]
    code: 201
    input: ["assessment_id", "vehicle_id", "pickup_window_start", "pickup_window_end", "requires_wheelchair_position?"]
    output: TransportationBooking
    side_effects:
      - "status = RESERVED"
      - "Vehicle.open_wheelchair_reservations += 1 when requires_wheelchair_position, else open_ambulatory_reservations += 1"
      - "rejected with ERR_VEHICLE_NOT_ACCESSIBLE before ERR_VEHICLE_WINDOW_CONFLICT (priority 40 before 60)"
  - method: POST
    path: "/transportation-bookings/{id}/cancel"
    description: "Cancel a reserved ride and release the vehicle lane."
    roles: [IntakeClerk, AccessibilityOfficeAdmin]
    code: 200
    input: [cancelled_reason]
    output: TransportationBooking
    side_effects:
      - "state_machines.TransportationBooking RESERVED -> CANCELLED"
      - "the matching Vehicle open-reservation counter is decremented back to its pre-booking value"
  - method: POST
    path: "/assessments/{id}/attendance"
    description: "Record attendance at the in-person assessment. ATTENDED completes the reserved ride; NO_SHOW releases the slot, closes the ride and returns the packet to ASSESSMENT_REQUIRED."
    roles: [Evaluator, AccessibilityOfficeAdmin]
    code: 200
    input: [attendance_status]
    output: FunctionalAssessment
    side_effects:
      - "attendance dimension transition per state_machines.FunctionalAssessment (state_field attendance_status)"
      - "RESERVED bookings on this assessment -> COMPLETED / NO_SHOW_CLOSED / CANCELLED with vehicle counters released"
      - "NO_SHOW and CANCELLED_BY_AGENCY: AssessmentSlot.booked_count -= 1 and Application.status = ASSESSMENT_REQUIRED"
      - "increments Application.version by 1"
  - method: POST
    path: "/assessments/{id}/scores"
    description: "Record the evaluator's observed scores and derive the recommended eligibility category. Re-scoring before sign-off is allowed."
    roles: [Evaluator]
    code: 200
    input: ["board_alight_score", "wayfinding_score", "distance_meters_walked", "heat_sensitivity_flag", "evaluator_notes?"]
    output: FunctionalAssessment
    side_effects:
      - "scoring dimension NOT_STARTED|SCORED -> SCORED; scored_by_user_id = acting X-User-ID"
      - "recommended_category and recommended_term_days from calculations.recommended_eligibility_category"
  - method: POST
    path: "/assessments/{id}/sign-off"
    description: "Independent specialist sign-off on the evaluator's scores; the signer must differ from the scorer."
    roles: [EligibilitySpecialist]
    code: 200
    input: []
    output: FunctionalAssessment
    side_effects:
      - "scoring dimension SCORED -> SIGNED_OFF; signed_off_by_user_id = acting X-User-ID"
      - "bubble-up: Application.status ASSESSMENT_SCHEDULED -> ASSESSMENT_COMPLETE"
      - "increments Application.version by 1"

  # ---------------- determination -----------------------------------------------------------------
  - method: POST
    path: "/applications/{id}/determinations"
    description: "Draft a determination for a signed-off packet, optionally with nested trip conditions. Requires the Application version the client last observed."
    roles: [EligibilitySpecialist]
    code: 201
    input: ["expected_application_version", "category", "effective_date", "rationale", "trip_conditions?"]
    output: Determination
    side_effects:
      - "Determination created with status DRAFT, applicant_id copied from the Application, determined_by_user_id = acting X-User-ID"
      - "each trip_conditions entry ({condition_type, comparator, threshold_value?, note?}) becomes an immutable TripCondition; trip_condition_count set accordingly"
      - "rejected with ERR_STALE_APPLICATION_VERSION (412) when expected_application_version != Application.version"
      - "increments Application.version by 1"
  - method: POST
    path: "/determinations/{id}/issue"
    description: "Issue a drafted determination: supersedes prior grants, updates the rider's eligibility mirrors, auto-creates a travel-training referral for CONDITIONAL grants and closes any visitor record."
    roles: [EligibilitySpecialist]
    code: 200
    input: []
    output: Determination
    side_effects:
      - "state_machines.Determination DRAFT -> ISSUED; term_days and expires_at per calculations.determination_term_and_expiry"
      - "prior ISSUED determinations of this applicant -> SUPERSEDED"
      - "Applicant.current_eligibility_status / eligibility_category / active_determination_id updated"
      - "CONDITIONAL: TravelTrainingReferral created with referral_reason CONDITIONAL_ELIGIBILITY_AUTO, status REFERRED"
      - "ACTIVE VisitorEligibility records of this applicant -> SUPERSEDED_BY_LOCAL"
      - "Application.status = DETERMINED; increments Application.version by 1"
  - method: POST
    path: "/determinations/{id}/trip-eligibility-check"
    description: "Evaluate one requested trip against the determination's trip-by-trip conditions and return the ordered list of satisfied conditions."
    roles: [Applicant, IntakeClerk, EligibilitySpecialist, AccessibilityOfficeAdmin]
    code: 200
    input: ["trip_date", "forecast_heat_index_f?", "precipitation_flag?", "path_barrier_flag?", "is_night_trip?", "route_familiarity?", "origin_distance_to_stop_meters?"]
    output: { eligible: boolean, applied_condition_ids: array, denial_reason: string, evaluated_condition_count: integer, category: string }
    side_effects:
      - "read-only; no entity is mutated"
      - "evaluated per calculations.trip_by_trip_eligibility_evaluation"

  # ---------------- appeal ------------------------------------------------------------------------
  - method: POST
    path: "/appeals"
    description: "File an appeal against an issued determination within 60 days of its effective date; continued service applies while the appeal is open."
    roles: [Applicant, AccessibilityOfficeAdmin]
    code: 201
    input: ["determination_id", "grounds", "request_hearing?"]
    output: Appeal
    side_effects:
      - "status = FILED; filed_at = clock now; filing_deadline_date = effective_date + 60 days"
      - "Determination.under_appeal = true; Applicant.continued_service_during_appeal = true"
      - "rejected with ERR_DETERMINATION_NOT_APPEALABLE (priority 32) before ERR_APPEAL_WINDOW_CLOSED (priority 62)"
  - method: POST
    path: "/appeals/{id}/assign-reviewer"
    description: "Assign an independent reviewer who took no part in the determination."
    roles: [AccessibilityOfficeAdmin]
    code: 200
    input: [reviewer_user_id]
    output: Appeal
    side_effects:
      - "state_machines.Appeal FILED -> REVIEWER_ASSIGNED"
      - "rejected with ERR_REVIEWER_NOT_INDEPENDENT when reviewer_user_id equals Determination.determined_by_user_id or the scoring evaluator"
  - method: POST
    path: "/appeals/{id}/hearing"
    description: "Open the review. Supplying hearing_at schedules an in-person hearing (HEARING_SCHEDULED, reached only for request_hearing == true); omitting it opens the paper review and reaches HEARD immediately."
    roles: [IndependentReviewer]
    code: 200
    input: ["hearing_at?"]
    output: Appeal
    side_effects:
      - "hearing branch: status = HEARING_SCHEDULED, hearing_at recorded"
      - "paper branch: status = HEARD, heard_at = clock now, decision_due_date = +30 days"
  - method: POST
    path: "/appeals/{id}/decision"
    description: "Record the independent reviewer's disposition. OVERTURNED/MODIFIED vacates the determination, issues an APPEAL_REMEDY successor, rewrites the rider's eligibility mirrors and auto-refers CONDITIONAL grants to travel training."
    roles: [IndependentReviewer]
    code: 200
    input: ["outcome", "granted_category?", "decision_note?"]
    output: Appeal
    side_effects:
      - "state_machines.Appeal HEARD -> DECIDED (4-hop cascade on OVERTURNED/MODIFIED)"
      - "the successor Determination is discoverable only via GET /determinations?applicant_id=&origin=APPEAL_REMEDY"
      - "the auto-created referral is discoverable only via GET /travel-training-referrals?applicant_id="

  # ---------------- conduct, due process ---------------------------------------------------------
  - method: POST
    path: "/trip-events"
    description: "Ingest one completed, missed or cancelled trip for a rider; recomputes all conduct mirrors and may auto-propose a suspension when the thresholds are crossed."
    roles: [ConductOfficer, AccessibilityOfficeAdmin]
    code: 201
    input: [applicant_id, trip_date, event_type]
    output: TripEvent
    side_effects:
      - "recorded_at = clock now; points_assessed per calculations.no_show_points_balance"
      - "Applicant conduct mirrors recomputed: both point variants, chargeable_miss_count_90d, scheduled_trip_count_90d, no_show_ratio_pct"
      - "auto-proposal: when no_show_points_event_basis >= 6 AND chargeable_miss_count_90d >= 3 AND no_show_ratio_pct > 10.0 and no proceeding of this applicant is in {PROPOSED, NOTICE_SENT, RIDER_RESPONDED, RESPONSE_LAPSED, UPHELD_PENDING, ACTIVE}, a SuspensionProceeding is created with origin AUTO_THRESHOLD, status PROPOSED, proposed_by_user_id null"
      - "increments Applicant.version by 1"
  - method: POST
    path: "/trip-events/{id}/excuse"
    description: "Excuse a recorded miss for reasons beyond the rider's control; the event stays in the denominator and leaves the numerator."
    roles: [ConductOfficer, AccessibilityOfficeAdmin]
    code: 200
    input: [excuse_reason]
    output: TripEvent
    side_effects:
      - "excused = true; points_assessed = 0"
      - "all Applicant conduct mirrors recomputed (ratio denominator unchanged)"
      - "increments Applicant.version by 1"
  - method: POST
    path: "/applicants/{id}/suspension-proceedings"
    description: "Manually propose a suspension for a pattern of missed trips. Requires the Applicant version the client last observed; a newer proposal voids any still-PROPOSED one."
    roles: [ConductOfficer]
    code: 201
    input: ["expected_applicant_version", "review_window_end_date", "grounds_note?"]
    output: SuspensionProceeding
    side_effects:
      - "SuspensionProceeding created with status PROPOSED, origin MANUAL, proposed_by_user_id = acting X-User-ID, points_at_proposal = Applicant.no_show_points_event_basis"
      - "every other SuspensionProceeding of this applicant with status == PROPOSED -> VOID"
      - "rejected with ERR_STALE_APPLICANT_VERSION (412) when expected_applicant_version != Applicant.version"
      - "increments Applicant.version by 1"
  - method: POST
    path: "/suspension-proceedings/{id}/send-notice"
    description: "Send the written suspension notice and open the 14-day due-process response window."
    roles: [ConductOfficer]
    code: 200
    input: []
    output: SuspensionProceeding
    side_effects:
      - "state_machines.SuspensionProceeding PROPOSED -> NOTICE_SENT"
      - "notice_sent_at = clock now; response_deadline_date = +14 days"
  - method: POST
    path: "/suspension-proceedings/{id}/respond"
    description: "Record the rider's written response inside the due-process window."
    roles: [Applicant]
    code: 200
    input: [rider_response_note]
    output: SuspensionProceeding
    side_effects:
      - "state_machines.SuspensionProceeding NOTICE_SENT -> RIDER_RESPONDED; rider_response_at = clock now"
  - method: POST
    path: "/suspension-proceedings/{id}/decide"
    description: "Decide the proceeding after due process. UPHELD applies the escalating duration ladder; RESCINDED closes it with zero days. The decider must differ from the proposer."
    roles: [ConductOfficer]
    code: 200
    input: ["decision", "suspension_start_date?"]
    output: SuspensionProceeding
    side_effects:
      - "UPHELD: status = UPHELD_PENDING, duration_days per calculations.suspension_duration_ladder, suspension_end_date computed"
      - "UPHELD: Applicant.prior_upheld_suspension_count += 1; Applicant.suspension_days_ledger_total += duration_days"
      - "RESCINDED: status = RESCINDED, duration_days 0, days_served 0, days_forgiven 0"
      - "rejected with ERR_DUE_PROCESS_INCOMPLETE (priority 47) before ERR_SUSPENSION_UNSUPPORTED (priority 48)"
      - "increments Applicant.version by 1"
  - method: POST
    path: "/suspension-proceedings/{id}/rescind"
    description: "Rescind a suspension mid-service; the unserved balance is forgiven and the day ledger stays conserved."
    roles: [ConductOfficer, AccessibilityOfficeAdmin]
    code: 200
    input: []
    output: SuspensionProceeding
    side_effects:
      - "state_machines.SuspensionProceeding ACTIVE -> VOID (or UPHELD_PENDING -> VOID with days_served 0)"
      - "days_served frozen; days_forgiven = duration_days - days_served; Applicant.suspension_days_ledger_total unchanged"
      - "Applicant.service_status = ACTIVE"
      - "increments Applicant.version by 1"

  # ---------------- travel training and visitor eligibility --------------------------------------
  - method: POST
    path: "/applicants/{id}/travel-training-referrals"
    description: "Refer a rider to fixed-route travel training; the rider must hold an ISSUED CONDITIONAL or TEMPORARY determination."
    roles: [EligibilitySpecialist, TravelTrainer, AccessibilityOfficeAdmin]
    code: 201
    input: ["referral_reason", "determination_id?"]
    output: TravelTrainingReferral
    side_effects:
      - "status = REFERRED; referral_response_deadline_date = date(created_at) + 14 days"
      - "rejected with ERR_CATEGORY_NOT_TRAINABLE when the applicant's ISSUED determination is UNCONDITIONAL or INELIGIBLE, or absent"
  - method: POST
    path: "/travel-training-referrals/{id}/response"
    description: "Record the rider's response to the referral: ENROLLED or DECLINED."
    roles: [Applicant, TravelTrainer]
    code: 200
    input: [decision]
    output: TravelTrainingReferral
    side_effects:
      - "state_machines.TravelTrainingReferral REFERRED -> ENROLLED or REFERRED -> DECLINED"
      - "ENROLLED re-checks the cross-entity category guard at response time"
  - method: POST
    path: "/travel-training-referrals/{id}/complete"
    description: "Record post-training competency. A score >= 80 confirms fixed-route competency and suppresses COGNITIVE_UNFAMILIAR_ROUTE trip conditions."
    roles: [TravelTrainer]
    code: 200
    input: [fixed_route_competency_score]
    output: TravelTrainingReferral
    side_effects:
      - "state_machines.TravelTrainingReferral ENROLLED -> COMPLETED; completed_at = clock now"
      - "score >= 80: Applicant.fixed_route_competency_confirmed = true and the ISSUED Determination.fixed_route_competency_confirmed = true"
      - "increments Applicant.version by 1"
  - method: POST
    path: "/applicants/{id}/visitor-eligibilities"
    description: "Grant visitor eligibility to an out-of-area rider presenting home-agency certification; 21 service days per rolling 365 days."
    roles: [IntakeClerk, AccessibilityOfficeAdmin]
    code: 201
    input: [home_agency_name, home_agency_certification_provided, visit_start_date]
    output: VisitorEligibility
    side_effects:
      - "status = ACTIVE; service_dates = []; days_used_365 = 0; days_remaining_365 = 21"
      - "Applicant.current_eligibility_status = VISITOR when the applicant holds no ISSUED determination"
      - "rejected with ERR_NOT_OUT_OF_AREA (priority 53) before ERR_LOCAL_ELIGIBILITY_EXISTS (priority 54)"
  - method: POST
    path: "/visitor-eligibilities/{id}/service-days"
    description: "Record one visitor service day against the rolling 365-day allowance."
    roles: [IntakeClerk, AccessibilityOfficeAdmin]
    code: 200
    input: [service_date]
    output: VisitorEligibility
    side_effects:
      - "service_date appended (idempotent on duplicates) per calculations.visitor_days_accounting"
      - "days_used_365 and days_remaining_365 recomputed; status -> EXHAUSTED at 21"
      - "rejected with ERR_VISITOR_DAYS_EXHAUSTED when the window already holds 21 distinct days"

  # ---------------- clock and deferred sweep ------------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, which every deadline, window and expiry rule reads. Before the first call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [AccessibilityOfficeAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects:
      - "no entity is mutated; subsequent requests evaluate every temporal rule against the new instant"
  - method: POST
    path: "/_ops/day-close"
    description: "Advance every deferred obligation to the current logical clock in five pinned steps: (1) hearings held, (2) suspension due-process and service windows, (3) determination expiry with its 3-hop cascade, (4) 21-day presumptive eligibility grants, (5) overdue appeal continued-service extension. Step 3 runs before step 4 and the ordering is outcome-changing."
    roles: [AccessibilityOfficeAdmin]
    code: 200
    input: []
    output: { appeals_heard_count: integer, proceedings_advanced_count: integer, determinations_expired_count: integer, referrals_withdrawn_count: integer, presumptive_granted_count: integer, appeals_overdue_count: integer }
    side_effects:
      - "step 1: Appeal HEARING_SCHEDULED -> HEARD when hearing_at <= now; decision_due_date = +30 days"
      - "step 2: SuspensionProceeding NOTICE_SENT -> RESPONSE_LAPSED, UPHELD_PENDING -> ACTIVE, ACTIVE -> SERVED, with Applicant.service_status kept in sync"
      - "step 3: Determination ISSUED -> EXPIRED plus the 3-hop cascade to Applicant mirrors and TravelTrainingReferral WITHDRAWN"
      - "step 4: presumptive eligibility granted when days_pending_statutory >= 21 and the applicant holds no ISSUED determination at that moment"
      - "step 5: HEARD appeals past decision_due_date get continued_service_extended = true and the rider returns to PRESUMPTIVE"
      - "idempotent at a fixed clock: a second call at the same instant changes nothing"

errors:
  # ---- authentication / authorization ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the eight declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "acting as Applicant on a resource whose owning applicant_id differs from X-User-ID"
  - id: ERR_NOT_ASSIGNED_REVIEWER
    http: 403
    condition: "acting as IndependentReviewer on an appeal whose reviewer_user_id differs from X-User-ID"

  # ---- existence ----
  - id: ERR_APPLICANT_NOT_FOUND
    http: 404
    condition: "no Applicant with the supplied id"
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "no Application with the supplied id"
  - id: ERR_VERIFICATION_NOT_FOUND
    http: 404
    condition: "no ProfessionalVerification with the supplied id, or it does not belong to the application in the path"
  - id: ERR_SLOT_NOT_FOUND
    http: 404
    condition: "no AssessmentSlot with the supplied id"
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "no FunctionalAssessment with the supplied id (also raised for an unknown rescheduled_from_assessment_id)"
  - id: ERR_VEHICLE_NOT_FOUND
    http: 404
    condition: "no Vehicle with the supplied id"
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "no TransportationBooking with the supplied id"
  - id: ERR_DETERMINATION_NOT_FOUND
    http: 404
    condition: "no Determination with the supplied id"
  - id: ERR_APPEAL_NOT_FOUND
    http: 404
    condition: "no Appeal with the supplied id"
  - id: ERR_TRIP_EVENT_NOT_FOUND
    http: 404
    condition: "no TripEvent with the supplied id"
  - id: ERR_PROCEEDING_NOT_FOUND
    http: 404
    condition: "no SuspensionProceeding with the supplied id"
  - id: ERR_REFERRAL_NOT_FOUND
    http: 404
    condition: "no TravelTrainingReferral with the supplied id"
  - id: ERR_VISITOR_RECORD_NOT_FOUND
    http: 404
    condition: "no VisitorEligibility with the supplied id"

  # ---- request shape ----
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, undeclared enum value, out-of-range number (score outside 0..4, competency score outside 0..100, negative distance), malformed ISO instant/date, or interval with start >= end"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset < 0"

  # ---- state ----
  - id: ERR_INVALID_APPLICATION_STATE
    http: 409
    condition: "the Application's status has no declared transition for the requested trigger"
  - id: ERR_VERIFICATION_STATE_INVALID
    http: 409
    condition: "receiving a response for a ProfessionalVerification whose status is not REQUESTED"
  - id: ERR_INVALID_ASSESSMENT_STATE
    http: 409
    condition: "attendance/scores/sign-off attempted from the wrong attendance_status or scoring_status pair"
  - id: ERR_DETERMINATION_ALREADY_ISSUED
    http: 409
    condition: "issuing a Determination that is not DRAFT, or whose Application already has an ISSUED determination"
  - id: ERR_DETERMINATION_NOT_APPEALABLE
    http: 409
    condition: "filing an appeal against a Determination whose status is not ISSUED"
  - id: ERR_DETERMINATION_NOT_ACTIVE
    http: 409
    condition: "trip-by-trip eligibility check against a Determination whose status is not ISSUED"
  - id: ERR_APPEAL_STATE_INVALID
    http: 409
    condition: "assign-reviewer / hearing / decision attempted from the wrong Appeal status"
  - id: ERR_PROCEEDING_STATE_INVALID
    http: 409
    condition: "send-notice / respond / decide / rescind attempted from the wrong SuspensionProceeding status"
  - id: ERR_REFERRAL_STATE_INVALID
    http: 409
    condition: "response attempted on a non-REFERRED referral, or complete attempted on a non-ENROLLED referral"
  - id: ERR_BOOKING_NOT_CANCELLABLE
    http: 409
    condition: "cancelling a TransportationBooking whose status is not RESERVED"
  - id: ERR_VISITOR_RECORD_INACTIVE
    http: 409
    condition: "recording a service day on a VisitorEligibility whose status is not ACTIVE"

  # ---- optimistic concurrency ----
  - id: ERR_STALE_APPLICATION_VERSION
    http: 412
    condition: "expected_application_version does not equal the Application's current version"
  - id: ERR_STALE_APPLICANT_VERSION
    http: 412
    condition: "expected_applicant_version does not equal the Applicant's current version"

  # ---- safety / accessibility / segregation of duties ----
  - id: ERR_VEHICLE_OUT_OF_SERVICE
    http: 409
    condition: "booking a ride on a Vehicle whose status is OUT_OF_SERVICE"
  - id: ERR_VEHICLE_NOT_ACCESSIBLE
    http: 422
    condition: "a wheelchair-position ride requested on a Vehicle with wheelchair_positions == 0"
  - id: ERR_SITE_NOT_ACCESSIBLE
    http: 422
    condition: "a wheelchair-position assessment scheduled into a slot whose site_is_wheelchair_accessible is false"
  - id: ERR_SIGNOFF_NOT_INDEPENDENT
    http: 422
    condition: "the signing X-User-ID equals FunctionalAssessment.scored_by_user_id"
  - id: ERR_REVIEWER_NOT_INDEPENDENT
    http: 422
    condition: "the assigned reviewer_user_id equals the contested Determination.determined_by_user_id or the scoring evaluator's user id"
  - id: ERR_DECIDER_NOT_INDEPENDENT
    http: 422
    condition: "the deciding X-User-ID equals SuspensionProceeding.proposed_by_user_id"
  - id: ERR_DUE_PROCESS_INCOMPLETE
    http: 422
    condition: "upholding a suspension whose notice was never sent, or whose status is not RIDER_RESPONDED / RESPONSE_LAPSED"
  - id: ERR_SUSPENSION_UNSUPPORTED
    http: 422
    condition: "upholding a suspension while the recomputed conduct record fails any of points >= 6, chargeable misses >= 3, ratio > 10.0"

  # ---- cross-entity referential ----
  - id: ERR_ASSESSMENT_NOT_SIGNED_OFF
    http: 422
    condition: "drafting a Determination before the ATTENDED FunctionalAssessment reaches scoring_status SIGNED_OFF"
  - id: ERR_CONDITIONAL_REQUIRES_CONDITIONS
    http: 422
    condition: "category CONDITIONAL drafted with no trip_conditions entries"
  - id: ERR_UNCONDITIONAL_FORBIDS_CONDITIONS
    http: 422
    condition: "category UNCONDITIONAL or INELIGIBLE drafted with one or more trip_conditions entries"
  - id: ERR_CATEGORY_NOT_TRAINABLE
    http: 422
    condition: "referring or enrolling an applicant whose ISSUED determination is not CONDITIONAL or TEMPORARY (or who has none)"
  - id: ERR_NOT_OUT_OF_AREA
    http: 422
    condition: "visitor eligibility requested for an applicant whose residence_zone is IN_SERVICE_AREA, or without home-agency certification"
  - id: ERR_LOCAL_ELIGIBILITY_EXISTS
    http: 422
    condition: "visitor eligibility requested for an applicant who already holds an ISSUED non-INELIGIBLE determination"
  - id: ERR_GRANTED_CATEGORY_MISMATCH
    http: 422
    condition: "granted_category supplied with outcome UPHELD, or omitted with outcome OVERTURNED / MODIFIED"
  - id: ERR_HEARING_REQUIRED
    http: 422
    condition: "hearing_at omitted on an appeal whose request_hearing is true"
  - id: ERR_HEARING_NOT_REQUESTED
    http: 422
    condition: "hearing_at supplied on an appeal whose request_hearing is false"

  # ---- constraint satisfaction ----
  - id: ERR_DUPLICATE_OPEN_APPLICATION
    http: 409
    condition: "opening a second Application for an applicant who already has one whose status is not DETERMINED"
  - id: ERR_VERIFICATION_PENDING
    http: 409
    condition: "requesting a new verification while one for the same Application is still REQUESTED"
  - id: ERR_EVALUATOR_SLOT_CONFLICT
    http: 409
    condition: "the new slot falls within 15 minutes of another slot staffed by the same evaluator (closed intervals plus buffer; back-to-back conflicts)"
  - id: ERR_SLOT_FULL
    http: 409
    condition: "booking an assessment into an AssessmentSlot whose booked_count == capacity"
  - id: ERR_VEHICLE_WINDOW_CONFLICT
    http: 409
    condition: "the requested half-open pickup window would push the vehicle's RESERVED bookings in that lane past capacity (adjacent windows never conflict)"
  - id: ERR_VISITOR_DAYS_EXHAUSTED
    http: 409
    condition: "the rolling 365-day window ending on the requested service_date already holds 21 distinct service days"

  # ---- temporal ----
  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 422
    condition: "date(filed_at) is later than Determination.effective_date + 60 days"
  - id: ERR_SLOT_IN_PAST
    http: 422
    condition: "publishing or booking an AssessmentSlot whose starts_at is not strictly after the logical clock now"
  - id: ERR_PICKUP_WINDOW_LATE
    http: 422
    condition: "pickup_window_end is later than the assessment slot's starts_at"
  - id: ERR_TRIP_DATE_FUTURE
    http: 422
    condition: "TripEvent.trip_date is later than date(logical clock now)"
  - id: ERR_RESPONSE_WINDOW_CLOSED
    http: 422
    condition: "a suspension response arrives after response_deadline_date, or a referral response arrives after referral_response_deadline_date"
  - id: ERR_SERVICE_DATE_OUT_OF_RANGE
    http: 422
    condition: "a visitor service_date precedes visit_start_date or exceeds date(logical clock now) + 90 days"
  - id: ERR_SUSPENSION_START_IN_PAST
    http: 422
    condition: "suspension_start_date precedes date(logical clock now) on an UPHELD decision"

roles:
  - name: Applicant
    description: "The rider (or their representative) applying for, appealing, or responding on their own paratransit eligibility."
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /appeals — file an appeal against one's own issued determination"
      - "POST /suspension-proceedings/{id}/respond — submit the written due-process response"
    shared_operations:
      - "POST /applications, POST /applications/{id}/submit (shared with IntakeClerk)"
      - "POST /travel-training-referrals/{id}/response (shared with TravelTrainer)"
      - "POST /determinations/{id}/trip-eligibility-check (shared with staff roles)"
      - "read endpoints restricted to the acting applicant's own records via ERR_NOT_RESOURCE_OWNER"
  - name: IntakeClerk
    description: "Accessibility-office intake staff who assemble packets, chase professional verification, book assessments and arrange the provided ride."
    identity: opaque
    exclusive_operations:
      - "POST /applications/{id}/return-incomplete"
      - "POST /applications/{id}/verifications"
      - "POST /applications/{id}/verifications/{verification_id}/receive"
      - "POST /applications/{id}/assessments"
    shared_operations:
      - "POST /applications, POST /applications/{id}/submit (shared with Applicant)"
      - "POST /transportation-bookings, POST /transportation-bookings/{id}/cancel (shared with AccessibilityOfficeAdmin)"
      - "POST /applicants, POST /applicants/{id}/visitor-eligibilities, POST /visitor-eligibilities/{id}/service-days (shared with AccessibilityOfficeAdmin)"
  - name: Evaluator
    description: "Clinician or trained assessor who conducts the in-person functional assessment and records observed scores. May never sign off on their own scores."
    identity: opaque
    exclusive_operations:
      - "POST /assessments/{id}/scores"
    shared_operations:
      - "POST /assessments/{id}/attendance (shared with AccessibilityOfficeAdmin)"
      - "read access to slots, assessments and applicant records"
  - name: EligibilitySpecialist
    description: "Determining official who signs off on assessment scores, drafts and issues determinations. Barred from reviewing appeals of their own determinations."
    identity: opaque
    exclusive_operations:
      - "POST /assessments/{id}/sign-off"
      - "POST /applications/{id}/determinations"
      - "POST /determinations/{id}/issue"
    shared_operations:
      - "POST /applicants/{id}/travel-training-referrals (shared with TravelTrainer and AccessibilityOfficeAdmin)"
      - "POST /determinations/{id}/trip-eligibility-check"
  - name: IndependentReviewer
    description: "Reviewer with no part in the original determination who hears the appeal and records its disposition."
    identity: opaque
    exclusive_operations:
      - "POST /appeals/{id}/hearing"
      - "POST /appeals/{id}/decision"
    shared_operations:
      - "read access to applications, assessments, determinations, appeals and suspension proceedings"
  - name: ConductOfficer
    description: "Officer who ingests trip outcomes, excuses misses, proposes suspensions and decides them. A proposer may never decide their own proposal."
    identity: opaque
    exclusive_operations:
      - "POST /applicants/{id}/suspension-proceedings"
      - "POST /suspension-proceedings/{id}/send-notice"
      - "POST /suspension-proceedings/{id}/decide"
    shared_operations:
      - "POST /trip-events, POST /trip-events/{id}/excuse (shared with AccessibilityOfficeAdmin)"
      - "POST /suspension-proceedings/{id}/rescind (shared with AccessibilityOfficeAdmin)"
  - name: TravelTrainer
    description: "Fixed-route travel-training instructor who enrolls riders and records post-training competency."
    identity: opaque
    exclusive_operations:
      - "POST /travel-training-referrals/{id}/complete"
    shared_operations:
      - "POST /applicants/{id}/travel-training-referrals (shared with EligibilitySpecialist and AccessibilityOfficeAdmin)"
      - "POST /travel-training-referrals/{id}/response (shared with Applicant)"
  - name: AccessibilityOfficeAdmin
    description: "Office administrator who publishes assessment slots and vehicles, assigns independent reviewers, and drives the logical clock and the deferred-obligation sweep."
    identity: opaque
    exclusive_operations:
      - "POST /assessment-slots"
      - "POST /vehicles"
      - "POST /appeals/{id}/assign-reviewer"
      - "POST /_clock/set_current_utc"
      - "POST /_ops/day-close"
    shared_operations:
      - "POST /applicants (shared with IntakeClerk)"
      - "POST /appeals (shared with Applicant, for walk-in filings)"
      - "POST /assessments/{id}/attendance (shared with Evaluator)"
      - "POST /transportation-bookings, POST /transportation-bookings/{id}/cancel (shared with IntakeClerk)"
      - "POST /trip-events, POST /trip-events/{id}/excuse, POST /suspension-proceedings/{id}/rescind (shared with ConductOfficer)"
      - "POST /applicants/{id}/travel-training-referrals, POST /applicants/{id}/visitor-eligibilities, POST /visitor-eligibilities/{id}/service-days"
