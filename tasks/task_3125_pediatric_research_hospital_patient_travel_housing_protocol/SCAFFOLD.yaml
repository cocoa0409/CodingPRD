    side_effects: ["status = ACTIVE", "sessions_delivered = 0", "no ResearchFund balance moves"]
  - method: POST
    path: "/programs/enrollments/{id}/milestones"
    description: "Register a protocol milestone for this enrollment"
    roles: [ProtocolCoordinator]
    code: 201
    input: [milestone_sequence, description, requires_main_campus, target_at]
    output: ProtocolMilestone
    side_effects: ["status = PENDING"]
  - method: POST
    path: "/programs/enrollments/{id}/travel-arrangements"
    description: "Request a travel leg for this enrollment"
    roles: [PatientSupportOfficer]
    code: 201
    input: [mode, traveler_count, departure_at, "return_at?", trip_reason, "is_required_travel?", "placed_coverages?"]
    output: TravelArrangement
    side_effects: ["status = REQUESTED", "family_day_units computed", "transport_cost_cents computed"]

  # --- Family-support pledges --------------------------------------------------
  - method: POST
    path: "/programs/family-support-pledges"
    description: "Open a family-support pledge for an enrollment"
    roles: [PatientSupportOfficer]
    code: 201
    input: [enrollment_id, patient_support_budget_cents]
    output: FamilySupportPledge
    side_effects: ["status = ACTIVE", "covered_days initialized from the enrollment's already-billed housing nights", "ClinicalProtocol.reserved_cents is left unchanged; pledges ride on the family-support ledger, not on the protocol reservation"]
  - method: GET
    path: "/programs/family-support-pledges"
    description: "List family-support pledges"
    roles: [Any]
    code: 200
    input: ["enrollment_id?", "status?", "limit?", "offset?"]
    output: "FamilySupportPledge[]"
    side_effects: []
  - method: GET
    path: "/programs/family-support-pledges/{id}"
    description: "Get a family-support pledge"
    roles: [Any]
    code: 200
    input: []
    output: FamilySupportPledge
    side_effects: []
  - method: POST
    path: "/programs/family-support-pledges/{id}/accrue"
    description: "Accrue family-support days on an active pledge"
    roles: [PatientSupportOfficer]
    code: 200
    input: [days]
    output: FamilySupportPledge
    side_effects:
      - "covered_days += days"
      - "provisional_settled_cents recomputed by provisional_family_day_charge"
      - "ClinicalProtocol.committed_cents recomputed"
  - method: POST
    path: "/programs/family-support-pledges/{id}/settle"
    description: "Settle a pledge at its final per-traveler-day rate"
    roles: [PatientSupportOfficer]
    code: 200
    input: []
    output: FamilySupportPledge
    side_effects:
      - "final_settled_cents computed by final_family_day_charge"
      - "billing_permitted_cents computed by family_support_allocation"
      - "ResearchFund.patient_support_balance_cents -= final_settled_cents"
      - "status -> SETTLED_FINAL"
  - method: POST
    path: "/programs/family-support-pledges/{id}/void"
    description: "Void an active pledge and release its protocol reservation"
    roles: [PatientSupportOfficer]
    code: 200
    input: []
    output: FamilySupportPledge
    side_effects: ["status -> VOIDED", "ClinicalProtocol.reserved_cents adjusted", "increments ClinicalProtocol.version by 1"]

  # --- Travel arrangements -----------------------------------------------------
  - method: GET
    path: "/programs/travel-arrangements"
    description: "List travel legs"
    roles: [Any]
    code: 200
    input: ["enrollment_id?", "status?", "mode?", "limit?", "offset?"]
    output: "TravelArrangement[]"
    side_effects: []
  - method: GET
    path: "/programs/travel-arrangements/{id}"
    description: "Get a travel leg"
    roles: [Any]
    code: 200
    input: []
    output: TravelArrangement
    side_effects: []
  - method: POST
    path: "/programs/travel-arrangements/{id}/confirm"
    description: "Confirm a requested travel leg and stamp its eligibility instant"
    roles: [PatientSupportOfficer]
    code: 200
    input: []
    output: TravelArrangement
    side_effects: ["status -> CONFIRMED", "eligibility_confirmed_at stamped"]
  - method: POST
    path: "/programs/travel-arrangements/{id}/disburse"
    description: "Disburse a confirmed travel leg, booking the family-day and research-day charges"
    roles: [PatientSupportOfficer]
    code: 200
    input: []
    output: TravelArrangement
    side_effects:
      - "status -> DISBURSED"
      - "transport_cost_cents recomputed by final_family_day_charge"
      - "ResearchFund.patient_support_balance_cents -= transport_cost_cents"
      - "the enrollment's pledge covered_days increased by the leg's billed days"
      - "ClinicalProtocol.committed_cents increased by the research-day accrual"
      - "on a protocol carrying a review lock the research stimulus is added to ResearchFund.research_balance_cents"
  - method: POST
    path: "/programs/travel-arrangements/{id}/reverse-disbursement"
    description: "Reverse a disbursed travel leg, refunding the family-support pool and releasing the research accrual"
    roles: [PatientSupportOfficer]
    code: 200
    input: [reversal_reason]
    output: TravelArrangement
    side_effects:
      - "status -> CANCELLED"
      - "ResearchFund.patient_support_balance_cents += the leg's transport_cost_cents"
      - "ClinicalProtocol.committed_cents -= the leg's research-day accrual"
      - "the enrollment's pledge covered_days reduced by the leg's billed days"
      - "transport_cost_cents reset to 0"
      - "increments ClinicalProtocol.version by 1"
  - method: POST
    path: "/programs/travel-arrangements/{id}/cancel"
    description: "Cancel a requested or confirmed travel leg"
    roles: [PatientSupportOfficer]
    code: 200
    input: []
    output: TravelArrangement
    side_effects: ["status -> CANCELLED"]

