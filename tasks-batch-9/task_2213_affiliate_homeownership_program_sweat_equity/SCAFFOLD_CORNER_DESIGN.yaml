      - name: selection_scoring_preliminary_and_final_variant_divergence
        claim_type: variant_divergence
        grounds: [calculations.household_selection_scoring, "calculations.household_selection_scoring.variants.PRELIMINARY", "calculations.household_selection_scoring.variants.FINAL", entities.ApplicantHousehold.fields.score_basis]
        excluded_because:
          difficulty_instance: selection_scoring_preliminary_vs_final_income_basis
          rationale: "The named §1.8 instance screens on self-reported figures, asserts the PRELIMINARY need and ability scores with a null composite, then re-scores on the verified basis at referral and at the decision, asserting the divergent FINAL values and the overwrite (never a blend). Variant Divergence, Variant Selection and Reconciliation for this calculation are all observed there."

      - name: development_cost_cash_and_full_fmv_variant_divergence
        claim_type: variant_divergence
        grounds: [calculations.development_cost_basis, "calculations.development_cost_basis.variants.CASH_BASIS", "calculations.development_cost_basis.variants.FULL_FMV_BASIS", entities.BuildSite.fields.total_development_cost_cents, entities.BuildSite.fields.cash_cost_cents]
        excluded_because:
          difficulty_instance: development_cost_cash_basis_vs_full_fmv_basis
          rationale: "The named §1.8 instance posts a mixed ledger of cash and donated-material cost entries and asserts both bases from the same rows, including the donated fair-market-value delta that separates them. A §1.9 duplicate would restate the same divergence."

  # ===========================================================================
  # SECTION 4 — From Table 4 (Validations)
  # One instance per §1.4 row not already exercised by §1.8, carrying the
  # Violation -> Error and (where a second fixture makes it cheap)
  # Satisfaction -> Pass claims, plus the Priority Ordering, Cross-entity,
  # Temporal, Aggregate and Conditional patterns. Rows whose only error is
  # owned by a §1.8 instance are stubbed at the end of the section.
  # ===========================================================================
  - section: validations
    instances:

      - name: documentation_gate_is_checked_before_the_ami_band_at_referral
        claim_type: priority_ordering
        grounds: ["validations[priority=13]", "validations[priority=14]", errors.ERR_DOCUMENTATION_INCOMPLETE, entities.ApplicantHousehold.fields.documentation_status, "state_machines.ApplicantHousehold.selection_status.SCREENING_to_COMMITTEE_REVIEW"]
        distinguishing_aspect: "A household that violates BOTH referral gates at once — its file is unverified AND its verified income is 0.8333 of area median — must surface priority 13's ERR_DOCUMENTATION_INCOMPLETE (409), not priority 14's ERR_INCOME_OUT_OF_BAND (422). A second household differing only in income_documents_received passes the same endpoint, so the fixture also proves the gate is the flag and not the income."
        setup_note: "documentation_status only becomes VERIFIED when income_documents_received is true AND both verified_* values are supplied, so passing the verified figures with the flag false leaves the row at SUBMITTED while still writing the out-of-band income."
        test_recipe:
          setup:
            - "Canonical program (ami_median_income_cents 6000000). Household D is submitted and screened with verified_annual_income_cents 5000000 but income_documents_received false, so documentation_status is still SUBMITTED and its FINAL-basis ami_pct would be 0.8333. Household V is identical except income_documents_received is true and its verified income is 3000000."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
            - { call: "POST /homeownership/households", payload: { program_id: "${prog_id}", household_name: "Doss", household_size: 4, current_bedroom_count: 1, habitability_deficiency_count: 3, self_reported_annual_income_cents: 5200000, self_reported_housing_cost_cents: 150000, monthly_debt_payment_cents: 30000, credit_score: 640, on_time_housing_payment_months: 24 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { hh_doc: $.data.id } }
            - { call: "POST /homeownership/household-members", payload: { household_id: "${hh_doc}", full_name: "Dara Doss", relationship: "APPLICANT", birth_date: "1985-03-15T00:00:00.000Z", is_adult_occupant: true }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/households/${hh_doc}/submit", payload: { attestation_signed: true }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/households/${hh_doc}/screen", payload: { income_documents_received: false, verified_annual_income_cents: 5000000, verified_housing_cost_cents: 100000, screening_notes: "Pay stubs still outstanding" }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/households", payload: { program_id: "${prog_id}", household_name: "Vela", household_size: 4, current_bedroom_count: 1, habitability_deficiency_count: 3, self_reported_annual_income_cents: 3600000, self_reported_housing_cost_cents: 150000, monthly_debt_payment_cents: 30000, credit_score: 640, on_time_housing_payment_months: 24 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { hh_ok: $.data.id } }
            - { call: "POST /homeownership/household-members", payload: { household_id: "${hh_ok}", full_name: "Vera Vela", relationship: "APPLICANT", birth_date: "1986-06-06T00:00:00.000Z", is_adult_occupant: true }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/households/${hh_ok}/submit", payload: { attestation_signed: true }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/households/${hh_ok}/screen", payload: { income_documents_received: true, verified_annual_income_cents: 3000000, verified_housing_cost_cents: 100000 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
          trigger:
            - { call: "POST /homeownership/households/${hh_doc}/committee-referral", payload: { referral_memo: "Attempted referral on an unverified file" }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { e_doc: $.data.error_id } }
            - { call: "GET /homeownership/households/${hh_doc}", as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/households/${hh_ok}/committee-referral", payload: { referral_memo: "File verified, referred to committee" }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
          assert:
            - "Violation: HTTP 409 and ${e_doc} == ERR_DOCUMENTATION_INCOMPLETE — priority 13 outranks priority 14, so the 422 band error is never reached even though 5000000 / 6000000 == 0.8333 is outside [0.3000, 0.8000]"
            - "${hh_doc} re-read: selection_status is still SCREENING, documentation_status == SUBMITTED, verified_annual_income_cents == 5000000 (the screen did write it) and sweat_equity_required_hours is still null"
            - "Satisfaction: ${hh_ok} referral returns HTTP 200 with selection_status == COMMITTEE_REVIEW and sweat_equity_required_hours == 12.0 — the same endpoint passes once documentation_status is VERIFIED and ami_pct is 0.5"

      - name: duplicate_review_and_veto_documentation_rules_on_reviews
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "validations[priority=17]", errors.ERR_DUPLICATE_REVIEW, errors.ERR_VETO_REASON_REQUIRED, "endpoints.POST /homeownership/selection-reviews", "endpoints.POST /homeownership/selection-reviews/{id}/retract"]
        distinguishing_aspect: "Three refusals on one endpoint that are easy to conflate: a second SUBMITTED review by the same reviewer on the same dimension (409), a VETO_WILLINGNESS carrying no documented_reason (422), and a VETO_WILLINGNESS on the NEED dimension (422) — plus the retraction that makes the duplicate legal again."
        setup_note: "Only the VETO-without-reason half of ERR_VETO_REASON_REQUIRED is probed. The catalog's other half (a DENIED selection-decision omitting denial_reason_code) is unreachable because POST /households/{id}/selection-decision declares only decision_minutes as input."
        test_recipe:
          setup:
            - "Canonical program with one household referred to committee (verified 3000000 cents, ami_pct 0.5, documentation VERIFIED). committee-alice has already filed one SUBMITTED NEED review scoring 80."
          setup_api_calls:
