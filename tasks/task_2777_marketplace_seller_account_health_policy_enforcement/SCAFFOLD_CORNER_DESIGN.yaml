# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 2777 — Marketplace Seller Account Health & Policy Enforcement
#
# Breadth probe. The taxonomy is references/claim-extraction-guide.md: the nine
# guide sections are the `section:` values and the per-section rows are the
# `claim_type:` values. §1.8 (SCAFFOLD_DIFFICULTY_DESIGN.yaml) is the depth
# probe; a corner already asserted there is emitted here as an
# `excluded_because:` stub naming the §1.8 instance.
#
# Conventions shared with §1.8:
#   * every chain sets the logical clock first (POST /_clock/set_current_utc as
#     ComplianceOfficer co-1); all datetimes carry exactly 3 fractional digits.
#   * fixture user ids: inv-1 / inv-2 PolicyInvestigator, ar-1 AppealReviewer,
#     co-1 / co-2 ComplianceOfficer. A Seller caller's X-User-ID is the seller id.
#   * every seller registers with a unique tax_id_hash, payout_bank_token,
#     address_fingerprint and email domain, so no unintended RelatedAccountLink
#     is minted unless the instance is about related-account detection.
#   * `expected_seller_version` / `expected_enforcement_action_version` are always
#     re-read from a server response immediately before the OCC-bearing call, so
#     the priority-90 rule never masks the error under test.
#   * error triggers capture `err_code: $.data.error_id`.
#   * GET list endpoints return `Entity[]`, so list captures use `$.data[0].field`.
#
# Every literal in an `assert:` line was computed from the cited §1.3 formula and
# the §1.3 constants against the fixture pinned in `setup:`.

scaffold_corner_design:

  # =========================================================================
  # SECTION 1 — Entities (§1.1)
  # =========================================================================
  - section: entities
    instances:

      - name: entity_seller_registration_returns_every_declared_field_with_defaults
        claim_type: creation
        grounds:
          - "entities.Seller"
          - "endpoints[POST /sellers]"
          - "state_machines.Seller.enforcement_state.initial_state"
          - "state_machines.Seller.disbursement_state.initial_state"
        distinguishing_aspect: |
          A first registration on an empty database must return 201 with EVERY §1.1 Seller field
          populated to its declared default — both posture dimensions at their initial states, all
          four money fields at 0, severity_points_balance 0.00, and health_score / metric_tier
          explicitly null (a seller who has never been evaluated is not "100.00 / HEALTHY").
          email_domain is derived from email, not supplied.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "Empty database: no other Seller row exists, so related-account detection finds no candidate."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001", device_fingerprint: "DEV-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
          assert:
            - "HTTP 201"
            - "response_type == object and data.id is a non-empty string"
            - "Seller.${s_id}.legal_name == Harbor Tools LLC"
            - "Seller.${s_id}.email == ops@harbor-tools.example"
            - "Seller.${s_id}.email_domain == harbor-tools.example   # computed from email, never supplied"
            - "Seller.${s_id}.enforcement_state == ACTIVE"
            - "Seller.${s_id}.disbursement_state == NORMAL"
            - "Seller.${s_id}.severity_points_balance == 0.00"
            - "Seller.${s_id}.health_score == null   # never evaluated, NOT 100.00"
            - "Seller.${s_id}.metric_tier == null   # never evaluated, NOT HEALTHY"
            - "Seller.${s_id}.available_balance_cents == 0"
            - "Seller.${s_id}.held_balance_cents == 0"
            - "Seller.${s_id}.lifetime_credited_cents == 0"
            - "Seller.${s_id}.lifetime_debited_cents == 0"
            - "Seller.${s_id}.open_defect_claim_units == 0"
            - "Seller.${s_id}.reinstated_count == 0"
            - "Seller.${s_id}.registration_risk_flag == false"
            - "Seller.${s_id}.root_seller_id == null"
            - "Seller.${s_id}.ban_reason == null"
            - "Seller.${s_id}.version == 1"
            - "Seller.${s_id}.created_at == 2026-08-01T00:00:00.000Z   # logical clock, not wall clock"
            - "no RelatedAccountLink row exists"
            - "no Notification row exists for ${s_id}"

      - name: entity_seller_retrieval_returns_the_stored_row_in_the_success_envelope
        claim_type: retrieval
        grounds:
          - "endpoints[GET /sellers/{id}]"
          - "response_envelope.success"
          - "entities.Seller"
        distinguishing_aspect: |
          GET /sellers/{id} returns the persisted row unchanged inside the §1.0 success envelope
          (meta.api_request_id + meta.api_request_timestamp present, response_type "object", the
          row under data) — a read must not recompute or mutate posture, so version stays 1.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "One registered seller, untouched since registration."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
          trigger:
            - call: "GET /sellers/${s_id}"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v_read: $.data.version }
          assert:
            - "HTTP 200"
            - "response_type == object"
            - "meta.api_request_id is present and meta.api_request_timestamp is present"
            - "data.id == ${s_id}"
            - "Seller.${s_id}.legal_name == Harbor Tools LLC"
            - "Seller.${s_id}.enforcement_state == ACTIVE and Seller.${s_id}.disbursement_state == NORMAL"
            - "${v_read} == 1   # a read never bumps version"

      - name: entity_seller_list_returns_pagination_envelope_and_honours_state_filter
        claim_type: listing
        grounds:
          - "endpoints[GET /sellers]"
          - "response_envelope.pagination_fields"
          - "response_envelope.pagination_defaults"
        distinguishing_aspect: |
          Three sellers exist; limit=2 must return exactly 2 rows with total_count 3 and
          has_more true, and offset=2 must return the last row with has_more false. The
          enforcement_state filter narrows the count itself (not just the page), so
          ?enforcement_state=WATCHLIST returns total_count 0 while all three sellers are ACTIVE.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "Three registered sellers, each with unique tax/bank/address/email-domain signals, all ACTIVE / NORMAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_a: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Ridgeline Supply LLC", email: "ops@ridgeline-supply.example", tax_id_hash: "TAX-RS-0002", payout_bank_token: "BANK-RS-0002", address_fingerprint: "ADDR-RS-0002" }
              as: Anonymous
              captures: { s_b: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Quarry Lane Goods LLC", email: "ops@quarry-lane.example", tax_id_hash: "TAX-QL-0003", payout_bank_token: "BANK-QL-0003", address_fingerprint: "ADDR-QL-0003" }
              as: Anonymous
              captures: { s_c: $.data.id }
          trigger:
            - call: "GET /sellers"
              payload: { limit: 2, offset: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { first_id: "$.data[0].id" }
            - call: "GET /sellers"
              payload: { limit: 2, offset: 2 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /sellers"
              payload: { enforcement_state: "WATCHLIST" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /sellers"
              payload: { enforcement_state: "ACTIVE", limit: 100 }
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "first page: HTTP 200, response_type == array, len(data) == 2, total_count == 3, has_more == true"
            - "${first_id} is one of ${s_a} / ${s_b} / ${s_c}"
            - "second page: len(data) == 1, total_count == 3, has_more == false, offset honoured"
            - "WATCHLIST filter: len(data) == 0, total_count == 0, has_more == false   # the filter narrows total_count, not just the page"
            - "ACTIVE filter: len(data) == 3, total_count == 3, has_more == false"

      - name: entity_unknown_seller_id_returns_seller_not_found
        claim_type: not_found
        grounds:
          - "validations.priority_30 (path existence)"
          - "errors[ERR_SELLER_NOT_FOUND]"
          - "endpoints[GET /sellers/{id}]"
        distinguishing_aspect: |
          A syntactically valid but unknown seller id on a path-templated read returns the
          entity-specific 404 code ERR_SELLER_NOT_FOUND (priority 30), not a generic 400 and not
          an empty 200 body.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "One unrelated seller exists so the collection is non-empty."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
          trigger:
            - call: "GET /sellers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { err_code: $.data.error_id }
            - call: "GET /sellers/00000000-0000-4000-8000-000000000000/listings"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { err_code_2: $.data.error_id }
          assert:
            - "HTTP 404 and ${err_code} == ERR_SELLER_NOT_FOUND"
            - "response_type == error and data.message is a non-empty string"
            - "sub-resource list on an unknown parent: HTTP 404 and ${err_code_2} == ERR_SELLER_NOT_FOUND   # not an empty 200 page"
            - "Seller.${s_id} is unaffected"

      - name: entity_missing_required_input_field_is_rejected
        claim_type: required_fields
        grounds:
          - "validations.priority_70 (ERR_INVALID_REQUEST)"
          - "endpoints[POST /listings].input"
          - "endpoints[POST /policy-rules].input"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: |
          Every §1.5 input token without a `?` suffix is mandatory: omitting Listing.sku or
          PolicyRule.base_severity_weight fails at priority 70 with ERR_INVALID_REQUEST (400) and
          persists nothing — the collections stay empty.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "One registered seller; no listing and no policy rule exists yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /listings"
              payload: { seller_id: "${s_id}", title: "Titanium Pry Bar 18in", category_code: "TOOLS-HAND" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { err_code: $.data.error_id }
            - call: "POST /policy-rules"
              payload: { code: "LA-REQ-1", category: "LISTING_ACCURACY", removal_scope: "ACCOUNT" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err_code_2: $.data.error_id }
            - call: "GET /sellers/${s_id}/listings"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "GET /policy-rules"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "missing sku: HTTP 400 and ${err_code} == ERR_INVALID_REQUEST"
            - "missing base_severity_weight: HTTP 400 and ${err_code_2} == ERR_INVALID_REQUEST"
            - "listings list: total_count == 0   # nothing was persisted"
            - "policy-rules list: total_count == 0"

      - name: entity_policy_rule_defaults_requires_poa_and_derives_decay_exempt
        claim_type: defaults
        grounds:
          - "entities.PolicyRule.fields.requires_poa"
          - "entities.PolicyRule.fields.decay_exempt"
          - "endpoints[POST /policy-rules].side_effects"
        distinguishing_aspect: |
          requires_poa is an optional input defaulting to true, while decay_exempt is NOT an input
          at all: it is derived true exactly for INTELLECTUAL_PROPERTY and RESTRICTED_PRODUCT and
          false for every other category. Omitting requires_poa on a LISTING_ACCURACY rule
          therefore yields requires_poa true / decay_exempt false, and an RESTRICTED_PRODUCT rule
          yields decay_exempt true even though nothing in the request mentions decay.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "Empty policy catalogue."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /policy-rules"
              payload: { code: "LA-DEF-1", category: "LISTING_ACCURACY", base_severity_weight: 2.00, removal_scope: "ACCOUNT" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_la: $.data.id }
            - call: "POST /policy-rules"
              payload: { code: "IP-DEF-1", category: "INTELLECTUAL_PROPERTY", base_severity_weight: 3.00, removal_scope: "LISTING", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_ip: $.data.id }
            - call: "POST /policy-rules"
              payload: { code: "RP-DEF-1", category: "RESTRICTED_PRODUCT", base_severity_weight: 1.50, removal_scope: "LISTING" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_rp: $.data.id }
            - call: "POST /policy-rules"
              payload: { code: "SP-DEF-1", category: "SHIPPING_PERFORMANCE", base_severity_weight: 2.50, removal_scope: "ACCOUNT" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_sp: $.data.id }
          assert:
            - "HTTP 201 on all four"
            - "PolicyRule.${rule_la}.requires_poa == true   # default applied, not supplied"
            - "PolicyRule.${rule_la}.decay_exempt == false"
            - "PolicyRule.${rule_ip}.requires_poa == false   # explicit false overrides the default"
            - "PolicyRule.${rule_ip}.decay_exempt == true   # derived from INTELLECTUAL_PROPERTY"
            - "PolicyRule.${rule_rp}.decay_exempt == true   # derived from RESTRICTED_PRODUCT"
            - "PolicyRule.${rule_rp}.requires_poa == true"
            - "PolicyRule.${rule_sp}.decay_exempt == false   # SHIPPING_PERFORMANCE is not exempt"
            - "PolicyRule.${rule_la}.version == 1"

      - name: entity_optional_defaults_applied_on_snapshot_and_listing
        claim_type: defaults
        grounds:
          - "entities.MetricSnapshot.fields.source"
          - "entities.Listing.fields.restricted_flag"
          - "entities.Listing.fields.state"
          - "entities.Listing.fields.suppressed_by_suspension"
          - "entities.Listing.fields.removal_policy_category"
        distinguishing_aspect: |
          A second defaults instance in a different entity pair: MetricSnapshot.source defaults to
          PLATFORM_PIPELINE (which also decides which overlap partition the window joins), and a
          Listing created without restricted_flag starts ACTIVE / restricted_flag false /
          suppressed_by_suspension false / removal_policy_category null.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "One registered seller with no listings and no snapshots."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /metric-snapshots"
              payload: { seller_id: "${s_id}", window_start: "2026-07-01T00:00:00.000Z", window_end: "2026-08-01T00:00:00.000Z", order_volume: 500, delivered_or_refunded_volume: 480, defect_claims_pending: 3, defect_claims_substantiated: 2, late_shipments: 10, pre_fulfillment_cancellations: 5, shipments_total: 490, shipments_with_valid_tracking: 485 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { snap_id: $.data.id }
            - call: "POST /listings"
              payload: { seller_id: "${s_id}", sku: "HT-PRY-18", title: "Titanium Pry Bar 18in", category_code: "TOOLS-HAND" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { l_id: $.data.id }
          assert:
            - "HTTP 201 on both"
            - "MetricSnapshot.${snap_id}.source == PLATFORM_PIPELINE   # default applied"
            - "Listing.${l_id}.restricted_flag == false"
            - "Listing.${l_id}.state == ACTIVE   # §1.2 Listing initial_state"
            - "Listing.${l_id}.suppressed_by_suspension == false"
            - "Listing.${l_id}.removal_policy_category == null"
            - "Seller.${s_id}.open_defect_claim_units == 3   # recomputed from the newest snapshot's defect_claims_pending"
            - "Seller.${s_id}.version == 2   # POST /metric-snapshots increments it once; POST /listings does not"

      - name: entity_seller_health_fields_follow_the_latest_evaluation
        claim_type: computed_fields
        grounds:
          - "entities.Seller.fields.health_score"
          - "entities.Seller.fields.metric_tier"
          - "endpoints[POST /sellers/{id}/health-evaluations].side_effects"
          - "calculations.health_score"
          - "calculations.metric_tier"
        distinguishing_aspect: |
          health_score / metric_tier are computed mirrors of the MOST RECENT HealthEvaluation, not
          an average and not a high-water mark: a HEALTHY first evaluation (100.00) is overwritten
          by a second evaluation over a widened input set that scores 78.75 / AT_RISK, and the
          seller's version advances once per snapshot and once per evaluation (1 -> 5).
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "Snapshot A [2026-05-01, 2026-06-01): order_volume 1000, delivered_or_refunded 1000, pending 0, substantiated 0, late 0, cancellations 0, shipments 1000, valid tracking 1000 -> every rate clean."
            - "Evaluation 1 sees only A (it is the only row in the 90-day lookback): odr_final 0.0000, late 0.0000, cancellation 0.0000, tracking 1.0000, no breaches, health_score 100.00, HEALTHY."
            - "Snapshot B [2026-07-01, 2026-08-01): same volumes but 30 substantiated claims."
            - "Evaluation 2 sees BOTH rows (EVAL_MAX_SNAPSHOTS 2): odr_final = 30 / 2000 = 0.0150 -> ORDER_DEFECT_RATE breaches; ratio_odr = (0.0150 - 0.01) / 0.01 = 0.5; penalty 42.50 x 0.5 = 21.25; health_score 78.75; 1 breach and score < 80 -> AT_RISK."
            - "No SHIPPING_PERFORMANCE / ACCOUNT rule exists, but the tier is never BREACHING here so no auto-violation question arises."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /metric-snapshots"
              payload: { seller_id: "${s_id}", window_start: "2026-05-01T00:00:00.000Z", window_end: "2026-06-01T00:00:00.000Z", order_volume: 1000, delivered_or_refunded_volume: 1000, defect_claims_pending: 0, defect_claims_substantiated: 0, late_shipments: 0, pre_fulfillment_cancellations: 0, shipments_total: 1000, shipments_with_valid_tracking: 1000, source: "PLATFORM_PIPELINE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /sellers/${s_id}/health-evaluations"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { ev1: $.data.id, ev1_score: $.data.health_score, ev1_tier: $.data.metric_tier }
            - call: "POST /metric-snapshots"
              payload: { seller_id: "${s_id}", window_start: "2026-07-01T00:00:00.000Z", window_end: "2026-08-01T00:00:00.000Z", order_volume: 1000, delivered_or_refunded_volume: 1000, defect_claims_pending: 0, defect_claims_substantiated: 30, late_shipments: 0, pre_fulfillment_cancellations: 0, shipments_total: 1000, shipments_with_valid_tracking: 1000, source: "PLATFORM_PIPELINE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /sellers/${s_id}/health-evaluations"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { ev2: $.data.id }
          assert:
            - "HTTP 201"
            - "${ev1_score} == 100.00 and ${ev1_tier} == HEALTHY   # first evaluation"
            - "HealthEvaluation.${ev2}.input_snapshot_count == 2"
            - "HealthEvaluation.${ev2}.input_window_start == 2026-05-01T00:00:00.000Z"
            - "HealthEvaluation.${ev2}.input_window_end == 2026-08-01T00:00:00.000Z"
            - "HealthEvaluation.${ev2}.odr_provisional == 0.0300   # latest snapshot only: (0 + 30) / 1000"
            - "HealthEvaluation.${ev2}.odr_final == 0.0150   # 30 / (1000 + 1000)"
            - "HealthEvaluation.${ev2}.odr_variant_delta == 0.0150"
            - "HealthEvaluation.${ev2}.health_score == 78.75   # 100.00 - round2(42.50 x 0.5)"
            - "HealthEvaluation.${ev2}.metric_tier == AT_RISK"
            - "HealthEvaluation.${ev2}.breached_metrics == [ORDER_DEFECT_RATE]"
            - "Seller.${s_id}.health_score == 78.75   # mirrors the LATEST evaluation, not an average of 100.00 and 78.75 (89.38)"
            - "Seller.${s_id}.metric_tier == AT_RISK"
            - "Seller.${s_id}.version == 5   # 1 at registration + 2 snapshots + 2 evaluations"
            - "Seller.${s_id}.enforcement_state == ACTIVE   # metric tier never touches the enforcement dimension"

      - name: entity_health_evaluation_and_snapshot_rows_are_immutable_history
        claim_type: immutability
        grounds:
          - "entities.HealthEvaluation.common_fields (false)"
          - "entities.MetricSnapshot.common_fields (false)"
          - "endpoints[GET /health-evaluations]"
        distinguishing_aspect: |
          The two `common_fields: false` entities are append-only evidence rows: §1.5 declares no
          PUT / PATCH / DELETE for either, they carry no version and no updated_at, and a second
          evaluation over the same input set files a NEW row rather than restating the first one —
          so the evaluation list grows to 2 with both rows carrying identical computed values.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "One seller with one clean snapshot [2026-07-01, 2026-08-01): order_volume 800, delivered_or_refunded 800, pending 0, substantiated 4, late 8, cancellations 4, shipments 800, valid tracking 790."
            - "odr_final = 4 / 800 = 0.0050 (< 0.01), late 8 / 800 = 0.0100 (< 0.04), cancellation 4 / 800 = 0.0050 (< 0.025), tracking 790 / 800 = 0.9875 (>= 0.95) -> no breaches, health_score 100.00, HEALTHY."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /metric-snapshots"
              payload: { seller_id: "${s_id}", window_start: "2026-07-01T00:00:00.000Z", window_end: "2026-08-01T00:00:00.000Z", order_volume: 800, delivered_or_refunded_volume: 800, defect_claims_pending: 0, defect_claims_substantiated: 4, late_shipments: 8, pre_fulfillment_cancellations: 4, shipments_total: 800, shipments_with_valid_tracking: 790, source: "PLATFORM_PIPELINE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { snap_id: $.data.id }
            - call: "POST /sellers/${s_id}/health-evaluations"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { ev1: $.data.id, ev1_at: $.data.evaluated_at }
          trigger:
            - call: "POST /sellers/${s_id}/health-evaluations"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { ev2: $.data.id }
            - call: "GET /health-evaluations"
              payload: { seller_id: "${s_id}", metric_tier: "HEALTHY", limit: 10 }
              as: AppealReviewer
              as_user_id: "ar-1"
          assert:
            - "HTTP 201 on the second evaluation"
            - "${ev2} != ${ev1}   # a new immutable row, not an update of the first"
            - "evaluation list: total_count == 2, has_more == false"
            - "HealthEvaluation.${ev1}.health_score == 100.00 and HealthEvaluation.${ev1}.metric_tier == HEALTHY"
            - "HealthEvaluation.${ev2}.health_score == 100.00 and HealthEvaluation.${ev2}.metric_tier == HEALTHY"
            - "${ev1_at} == 2026-08-01T00:00:00.000Z"
            - "HealthEvaluation rows expose no `version` and no `updated_at` field (common_fields false)"
            - "MetricSnapshot.${snap_id} exposes no `version` and no `updated_at` field"
            - "§1.5 declares no PUT / PATCH / DELETE endpoint for HealthEvaluation or MetricSnapshot"
            - "Seller.${s_id}.version == 4   # 1 + snapshot + 2 evaluations"

      - name: entity_metric_snapshot_type_constraints_are_rejected
        claim_type: type_constraints
        grounds:
          - "entities.MetricSnapshot.fields.source.constraints"
          - "entities.MetricSnapshot.fields.window_end.constraints"
          - "entities.MetricSnapshot.fields.shipments_with_valid_tracking.constraints"
          - "validations.priority_70 (ERR_INVALID_REQUEST)"
        distinguishing_aspect: |
          Four different §1.1 constraint kinds on one entity all land on ERR_INVALID_REQUEST (400)
          at priority 70: an out-of-range enum (source), a violated inter-field ordering
          (window_end must be strictly after window_start — equality is not enough), a violated
          inter-field bound (shipments_with_valid_tracking <= shipments_total) and a negative
          count. None of them creates a row, so the seller's version never moves.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "One registered seller with no snapshots (version 1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /metric-snapshots"
              payload: { seller_id: "${s_id}", window_start: "2026-07-01T00:00:00.000Z", window_end: "2026-08-01T00:00:00.000Z", order_volume: 100, delivered_or_refunded_volume: 100, defect_claims_pending: 0, defect_claims_substantiated: 0, late_shipments: 0, pre_fulfillment_cancellations: 0, shipments_total: 100, shipments_with_valid_tracking: 100, source: "GUESSTIMATE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err_enum: $.data.error_id }
            - call: "POST /metric-snapshots"
              payload: { seller_id: "${s_id}", window_start: "2026-07-01T00:00:00.000Z", window_end: "2026-07-01T00:00:00.000Z", order_volume: 100, delivered_or_refunded_volume: 100, defect_claims_pending: 0, defect_claims_substantiated: 0, late_shipments: 0, pre_fulfillment_cancellations: 0, shipments_total: 100, shipments_with_valid_tracking: 100 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err_window: $.data.error_id }
            - call: "POST /metric-snapshots"
              payload: { seller_id: "${s_id}", window_start: "2026-07-01T00:00:00.000Z", window_end: "2026-08-01T00:00:00.000Z", order_volume: 100, delivered_or_refunded_volume: 100, defect_claims_pending: 0, defect_claims_substantiated: 0, late_shipments: 0, pre_fulfillment_cancellations: 0, shipments_total: 100, shipments_with_valid_tracking: 101 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err_bound: $.data.error_id }
            - call: "POST /metric-snapshots"
              payload: { seller_id: "${s_id}", window_start: "2026-07-01T00:00:00.000Z", window_end: "2026-08-01T00:00:00.000Z", order_volume: -1, delivered_or_refunded_volume: 100, defect_claims_pending: 0, defect_claims_substantiated: 0, late_shipments: 0, pre_fulfillment_cancellations: 0, shipments_total: 100, shipments_with_valid_tracking: 100 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err_negative: $.data.error_id }
            - call: "GET /sellers/${s_id}/metric-snapshots"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "bad enum: HTTP 400 and ${err_enum} == ERR_INVALID_REQUEST"
            - "window_end == window_start: HTTP 400 and ${err_window} == ERR_INVALID_REQUEST   # 'strictly after', so equality fails"
            - "valid tracking above shipments_total: HTTP 400 and ${err_bound} == ERR_INVALID_REQUEST"
            - "negative order_volume: HTTP 400 and ${err_negative} == ERR_INVALID_REQUEST"
            - "snapshot list: total_count == 0"
            - "Seller.${s_id}.version == 1 and Seller.${s_id}.open_defect_claim_units == 0"

      - name: entity_violation_system_fields_are_server_generated
        claim_type: system_fields
        grounds:
          - "entities.Violation.fields.state"
          - "entities.Violation.fields.auto_generated"
          - "entities.Violation.fields.detected_at"
          - "entities.Violation.fields.adjudicated_at"
          - "endpoints[POST /violations].side_effects"
        distinguishing_aspect: |
          A manually filed Violation gets its identity and history from the server, not the
          client: state is the §1.2 initial_state REPORTED, auto_generated is false (only the
          BREACHING evaluation cascade sets it true), detected_at is the LOGICAL clock reading
          rather than wall-clock time, and adjudicated_at / decision_note stay null until
          adjudication.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "PolicyRule LA-SYS-1 (LISTING_ACCURACY, base 2.00, removal_scope ACCOUNT, requires_poa false) so no listing_id is required."
            - "One registered seller, ACTIVE / NORMAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "LA-SYS-1", category: "LISTING_ACCURACY", base_severity_weight: 2.00, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_la: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_la}", reporter_type: "BUYER", evidence_reference: "EV-HT-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1: $.data.id }
          assert:
            - "HTTP 201"
            - "Violation.${v1}.state == REPORTED   # §1.2 initial_state"
            - "Violation.${v1}.auto_generated == false"
            - "Violation.${v1}.detected_at == 2026-08-01T00:00:00.000Z   # logical clock"
            - "Violation.${v1}.adjudicated_at == null"
            - "Violation.${v1}.decision_note == null"
            - "Violation.${v1}.listing_id == null"
            - "Violation.${v1}.created_at == 2026-08-01T00:00:00.000Z and Violation.${v1}.version == 1"
            - "Seller.${s_id}.disbursement_state == NORMAL   # filing alone does not gate funds; only open-investigation does"

      - name: entity_body_foreign_keys_are_validated_left_to_right_and_return_not_found
        claim_type: foreign_key_validation
        grounds:
          - "complexity_profile.entity_topology (flat)"
          - "validations.priority_40 (body FK existence)"
          - "errors[ERR_SELLER_NOT_FOUND]"
          - "errors[ERR_POLICY_RULE_NOT_FOUND]"
        distinguishing_aspect: |
          In a flat topology every FK in the body is resolved before any business rule runs, and
          the §1.4 priority-40 rule fixes the ORDER: fields are checked in the order §1.5 declares
          them, so a request with BOTH an unknown seller_id and an unknown policy_rule_id reports
          ERR_SELLER_NOT_FOUND (the earlier field), never ERR_POLICY_RULE_NOT_FOUND.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "PolicyRule LA-FK-1 (LISTING_ACCURACY, base 2.00, ACCOUNT, requires_poa false) and one registered seller both exist, so each request has exactly the intended bad reference."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "LA-FK-1", category: "LISTING_ACCURACY", base_severity_weight: 2.00, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_la: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /violations"
              payload: { seller_id: "00000000-0000-4000-8000-00000000000a", policy_rule_id: "${rule_la}", reporter_type: "BUYER", evidence_reference: "EV-FK-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { err_seller: $.data.error_id }
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "00000000-0000-4000-8000-00000000000b", reporter_type: "BUYER", evidence_reference: "EV-FK-0002" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { err_rule: $.data.error_id }
            - call: "POST /violations"
              payload: { seller_id: "00000000-0000-4000-8000-00000000000a", policy_rule_id: "00000000-0000-4000-8000-00000000000b", reporter_type: "BUYER", evidence_reference: "EV-FK-0003" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { err_both: $.data.error_id }
            - call: "GET /violations"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
          assert:
            - "unknown seller_id: HTTP 404 and ${err_seller} == ERR_SELLER_NOT_FOUND"
            - "unknown policy_rule_id: HTTP 404 and ${err_rule} == ERR_POLICY_RULE_NOT_FOUND"
            - "both unknown: HTTP 404 and ${err_both} == ERR_SELLER_NOT_FOUND   # declared input order decides, not alphabetical or rule-first"
            - "${err_both} != ERR_POLICY_RULE_NOT_FOUND"
            - "violations list: total_count == 0"

      - name: entity_seller_open_defect_claim_units_mirrors_newest_snapshot
        claim_type: computed_fields
        grounds:
          - "entities.Seller.fields.open_defect_claim_units"
          - "endpoints[POST /metric-snapshots].side_effects"
          - "calculations.reserve_requirement_cents.input_set"
        excluded_because:
          difficulty_instance: dual_variant_calc / reserve_rolling_vs_claim_exposure_diverge_on_identical_seller_state
          rationale: "That §1.8 instance pins open_defect_claim_units == 21 from the filed snapshot and then multiplies it through the CLAIM_EXPOSURE basis, so the recompute-on-snapshot claim is asserted there as a precondition and again in the resulting cents."

      - name: entity_seller_severity_points_balance_is_recomputed_not_accumulated
        claim_type: computed_fields
        grounds:
          - "entities.Seller.fields.severity_points_balance"
          - "calculations.severity_points_balance"
        excluded_because:
          difficulty_instance: compensating_invariant / appeal_grant_restores_severity_balance_and_posture_exactly
          rationale: "That §1.8 instance asserts the balance falling back to its pre-action value after a grant, which is only possible if the field is recomputed from scratch over the non-vacated action set rather than incremented."

  # =========================================================================
  # SECTION 2 — State Machines (§1.2)
  # =========================================================================
  - section: state_machines
    instances:

      - name: state_new_action_and_new_plan_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - "state_machines.EnforcementAction.initial_state (ISSUED)"
          - "state_machines.PlanOfAction.initial_state (SUBMITTED)"
          - "endpoints[POST /plans-of-action].side_effects"
        distinguishing_aspect: |
          Two freshly created rows must sit in their §1.2 initial_state with their history fields
          empty: the action is ISSUED (never ACKNOWLEDGED, never UPHELD) with acknowledged_at and
          resolution_reason null, and the first plan for that action is SUBMITTED with
          revision_count 0 — 0, not 1 — plus deadline_at = action.issued_at + POA_DEADLINE_DAYS
          (2026-08-01 + 17d = 2026-08-18), which is 13 days EARLIER than the appeal deadline
          2026-08-31, so the two clocks cannot be confused.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "PolicyRule LA-INIT-1: LISTING_ACCURACY, base_severity_weight 2.00, removal_scope ACCOUNT, requires_poa defaulted to true."
            - "One seller; one BUYER-reported violation carried to SUBSTANTIATED so an action may be issued."
            - "First offence: prior_same_category 0 -> repeat_factor 1.00, metric_tier null -> severity_points_applied = round2(2.00) = 2.00; prior_balance 0.00 -> post_balance 2.00 < LADDER_RESTRICT_POINTS 4.00 -> rung WARNING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "LA-INIT-1", category: "LISTING_ACCURACY", base_severity_weight: 2.00, removal_scope: "ACCOUNT" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_la: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_la}", reporter_type: "BUYER", evidence_reference: "EV-INIT-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1: $.data.id }
            - call: "POST /violations/${v1}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /violations/${v1}/adjudicate"
              payload: { outcome: "SUBSTANTIATED", decision_note: "Two SKUs described a different generation of the tool than shipped." }
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v1}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { a1: $.data.id, a1_state: $.data.state, a1_type: $.data.action_type }
            - call: "GET /enforcement-actions/${a1}"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { av: $.data.version }
          trigger:
            - call: "POST /plans-of-action"
              payload: { enforcement_action_id: "${a1}", root_cause: "The July catalogue import mapped supplier part numbers onto the wrong generation of two SKUs.", corrective_measures: ["Corrected the two affected listings and re-verified every SKU from the same import batch."], preventive_measures: ["Added a part-number diff gate that blocks any catalogue import whose mapping changes an existing SKU generation."], expected_enforcement_action_version: "${av}" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { p1: $.data.id }
          assert:
            - "HTTP 201"
            - "${a1_state} == ISSUED   # §1.2 EnforcementAction.initial_state"
            - "${a1_type} == WARNING"
            - "EnforcementAction.${a1}.severity_points_applied == 2.00"
            - "EnforcementAction.${a1}.ladder_rung_computed == WARNING and EnforcementAction.${a1}.override_applied == false"
            - "EnforcementAction.${a1}.acknowledged_at == null and EnforcementAction.${a1}.resolution_reason == null"
            - "EnforcementAction.${a1}.issued_at == 2026-08-01T00:00:00.000Z"
            - "EnforcementAction.${a1}.appeal_deadline_at == 2026-08-31T00:00:00.000Z   # issued_at + APPEAL_WINDOW_DAYS 30"
            - "${av} == 1"
            - "PlanOfAction.${p1}.state == SUBMITTED   # §1.2 PlanOfAction.initial_state"
            - "PlanOfAction.${p1}.revision_count == 0   # first plan, so 0 and not 1"
            - "PlanOfAction.${p1}.submitted_at == 2026-08-01T00:00:00.000Z"
            - "PlanOfAction.${p1}.deadline_at == 2026-08-18T00:00:00.000Z   # action.issued_at + POA_DEADLINE_DAYS 17"
            - "PlanOfAction.${p1}.reviewed_by_user_id == null and PlanOfAction.${p1}.review_notes == null"
            - "EnforcementAction.${a1}.version == 2   # plan creation increments the parent action"
            - "Seller.${s_id}.severity_points_balance == 2.00 and Seller.${s_id}.enforcement_state == WATCHLIST"

      - name: state_acknowledge_moves_issued_action_to_acknowledged
        claim_type: valid_transition
        grounds:
          - "state_machines.EnforcementAction.transitions.ISSUED_to_ACKNOWLEDGED"
          - "endpoints[POST /enforcement-actions/{id}/acknowledge]"
        distinguishing_aspect: |
          The ISSUED -> ACKNOWLEDGED edge is the seller's own act: it records acknowledged_at,
          bumps only the action's version, and explicitly does NOT stop the appeal clock
          (appeal_deadline_at stays 2026-08-31) and does NOT touch the seller's posture, which
          remains WATCHLIST / RESERVE_HELD off the unchanged 2.00 point balance.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "PolicyRule LA-ACK-1 (LISTING_ACCURACY, base 2.00, ACCOUNT, requires_poa false) so no plan is in play."
            - "One seller with one SUBSTANTIATED violation and one issued WARNING action (severity 2.00, balance 2.00, seller WATCHLIST / RESERVE_HELD)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "LA-ACK-1", category: "LISTING_ACCURACY", base_severity_weight: 2.00, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_la: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_la}", reporter_type: "BUYER", evidence_reference: "EV-ACK-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1: $.data.id }
            - call: "POST /violations/${v1}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /violations/${v1}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v1}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /enforcement-actions/${a1}/acknowledge"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { ack_state: $.data.state, ack_at: $.data.acknowledged_at, ack_v: $.data.version }
          assert:
            - "HTTP 200"
            - "${ack_state} == ACKNOWLEDGED"
            - "${ack_at} == 2026-08-01T00:00:00.000Z"
            - "${ack_v} == 2   # the action's own version moved once"
            - "EnforcementAction.${a1}.appeal_deadline_at == 2026-08-31T00:00:00.000Z   # acknowledgement does not stop the appeal clock"
            - "EnforcementAction.${a1}.resolution_reason == null"
            - "Seller.${s_id}.severity_points_balance == 2.00"
            - "Seller.${s_id}.enforcement_state == WATCHLIST and Seller.${s_id}.disbursement_state == RESERVE_HELD   # unchanged by acknowledgement"

      - name: state_decide_before_start_review_returns_invalid_state
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Appeal.transitions.UNDER_REVIEW_to_GRANTED.preconditions"
          - "state_machines.Appeal.transitions.SUBMITTED_to_UNDER_REVIEW"
          - "validations.priority_85"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: |
          The appeal review is a two-step approval chain: only an UNDER_REVIEW appeal may be
          decided, so deciding a SUBMITTED appeal is refused with ERR_INVALID_STATE (409) even
          though the caller holds the right role and the payload is perfect. After the refusal the
          appeal is still SUBMITTED and the appealed action is still ISSUED — a rejected decision
          must not half-apply.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "PolicyRule LA-PRE-1 (LISTING_ACCURACY, base 2.00, ACCOUNT, requires_poa false) so the appeal needs no accepted plan."
            - "One seller with an issued WARNING action and an appeal in state SUBMITTED (start-review not yet called)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "LA-PRE-1", category: "LISTING_ACCURACY", base_severity_weight: 2.00, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_la: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_la}", reporter_type: "BUYER", evidence_reference: "EV-PRE-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1: $.data.id }
            - call: "POST /violations/${v1}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /violations/${v1}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v1}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { a1: $.data.id }
            - call: "POST /appeals"
              payload: { enforcement_action_id: "${a1}", grounds: "The two listings were corrected within an hour of the buyer report and no order shipped against the wrong description." }
              as: Seller
