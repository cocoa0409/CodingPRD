# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# HR Case Management & Employee Relations Investigations
# Nine Difficulty Rules x >= 2 instances each (>= 18 instances total).
# Every grounds ref resolves into SCAFFOLD.yaml §1.1–§1.7.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc: two dual-variant calculations on DIFFERENT
  # entity domains (CredibilityAssessment vs TrendSnapshot).
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: credibility_variants_diverge_on_same_inputs
        grounds:
          - calculations.credibility_score
          - entities.CredibilityAssessment.fields.score_corroboration
          - entities.CredibilityAssessment.fields.score_recency
          - entities.CredibilityAssessment.fields.active_variant
        distinguishing_aspect: |
          Dual-variant logic on the CredibilityAssessment domain: identical
          inputs (corroboration_count=3, contradiction_count=0,
          account_age_days=10) produce score_corroboration=0.80 versus
          score_recency=0.63 — the variants diverge because only the
          RECENCY_WEIGHTED variant applies the recency decay term and uses
          the lower corroboration weight.
        test_recipe:
          setup:
            - "Logical clock at the startup default 2026-08-01T00:00:00Z."
            - "Intake channel CH1 (HOTLINE, default HARASSMENT/MEDIUM, sla 5), reporter employee R, subject employee S, LEVEL_3 investigator INV (max_active_cases 5) exist."
            - "A case C exists in INVESTIGATING assigned to INV."
          setup_api_calls:
            - call: "POST /er/intake-channels"
              payload: { channel_code: "HOTLINE", display_name: "Ethics Hotline", default_category: "HARASSMENT", default_severity: "MEDIUM", sla_business_days: 5 }
              as: ERManager
              captures: { ch1: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "R-001", full_name: "Reporter One", email: "r1@example.com", location_code: "SF", department: "Ops", hire_date: "2020-01-15T00:00:00Z" }
              as: ERManager
              captures: { emp_r: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "S-001", full_name: "Subject One", email: "s1@example.com", location_code: "SF", department: "Ops", hire_date: "2019-03-01T00:00:00Z" }
              as: ERManager
              captures: { emp_s: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "I-001", full_name: "Investigator One", email: "i1@example.com", location_code: "HQ", department: "ER", hire_date: "2018-06-01T00:00:00Z" }
              as: ERManager
              captures: { emp_i: $.data.id }
            - call: "POST /er/investigators"
              payload: { employee_id: "${emp_i}", certification_level: "LEVEL_3", max_active_cases: 5 }
              as: ERManager
              captures: { inv1: $.data.id }
            - call: "POST /er/cases"
              payload: { intake_channel_id: "${ch1}", reporter_employee_id: "${emp_r}", subject_employee_id: "${emp_s}", category: "HARASSMENT", severity: "MEDIUM" }
              as: ERManager
              captures: { case1: $.data.id, case1_v: $.data.version }
            - call: "POST /er/cases/${case1}/assign"
              payload: { investigator_id: "${inv1}", expected_case_version: "${case1_v}" }
              as: ERManager
            - call: "POST /er/cases/${case1}/begin-investigation"
              payload: {}
              as: Investigator
              as_user_id: "${inv1}"
          trigger:
            - call: "POST /er/cases/${case1}/credibility-assessments"
              payload: { subject_employee_id: "${emp_s}", corroboration_count: 3, contradiction_count: 0, account_age_days: 10 }
              as: Investigator
              as_user_id: "${inv1}"
              captures: { ca_id: $.data.id, ca_sc: $.data.score_corroboration, ca_sr: $.data.score_recency, ca_variant: $.data.active_variant }
          assert:
            - "CredibilityAssessment.${ca_id}.score_corroboration == 0.80"
            - "CredibilityAssessment.${ca_id}.score_recency == 0.63"
            - "CredibilityAssessment.${ca_id}.score_corroboration != CredibilityAssessment.${ca_id}.score_recency"
            - "CredibilityAssessment.${ca_id}.active_variant == CORROBORATION_WEIGHTED"

      - name: trend_window_variants_diverge_on_same_cases
        grounds:
          - calculations.trend_case_rate
          - entities.TrendSnapshot.fields.window_kind
          - entities.TrendSnapshot.fields.case_rate_per_100
        distinguishing_aspect: |
          Dual-variant logic on the TrendSnapshot domain (distinct from the
          CredibilityAssessment domain of the sibling instance): the SAME two
          closed cases in location SF yield case_rate_per_100 = 40.00 under
          ROLLING_90D (denominator = 5 ACTIVE employees) versus 25.00 under
          CALENDAR_QUARTER (denominator = 5 ACTIVE + 3 ON_LEAVE = 8).
        test_recipe:
          setup:
            - "Clock set to 2026-08-01T00:00:00Z to construct fixtures, then advanced to 2026-08-20T00:00:00Z before snapshot computation (as_of)."
            - "Location SF has 5 ACTIVE employees (e1..e5) and 3 ON_LEAVE employees (e6..e8), all hired 2020-01-01."
            - "Two cases against subject e1 closed with closed_at inside both windows; each closure decremented its investigator count."
            - "To reach CLOSED twice with minimal fixtures, both cases go through the full pipeline: assign -> begin -> completed interview -> admitted evidence -> finding -> substantiate UNSUBSTANTIATED (credibility-consistent without assessments) -> action -> calibration quorum by two other investigators -> notices SENT -> close."
          setup_api_calls:
            - call: "POST /er/intake-channels"
              payload: { channel_code: "WEB_PORTAL", display_name: "Web Portal", default_category: "POLICY_VIOLATION", default_severity: "LOW", sla_business_days: 10 }
              as: ERManager
              captures: { ch1: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "E-101", full_name: "Subject A", email: "e101@example.com", location_code: "SF", department: "Sales", hire_date: "2020-01-01T00:00:00Z" }
              as: ERManager
              captures: { e1: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "E-102", full_name: "Emp Two", email: "e102@example.com", location_code: "SF", department: "Sales", hire_date: "2020-01-01T00:00:00Z" }
              as: ERManager
            - call: "POST /er/employees"
              payload: { employee_number: "E-103", full_name: "Emp Three", email: "e103@example.com", location_code: "SF", department: "Sales", hire_date: "2020-01-01T00:00:00Z" }
              as: ERManager
            - call: "POST /er/employees"
              payload: { employee_number: "E-104", full_name: "Emp Four", email: "e104@example.com", location_code: "SF", department: "Sales", hire_date: "2020-01-01T00:00:00Z" }
              as: ERManager
            - call: "POST /er/employees"
              payload: { employee_number: "E-105", full_name: "Emp Five", email: "e105@example.com", location_code: "SF", department: "Sales", hire_date: "2020-01-01T00:00:00Z" }
              as: ERManager
            - call: "POST /er/employees"
              payload: { employee_number: "E-106", full_name: "Emp Six", email: "e106@example.com", location_code: "SF", department: "Sales", hire_date: "2020-01-01T00:00:00Z", employment_status: "ON_LEAVE" }
              as: ERManager
            - call: "POST /er/employees"
              payload: { employee_number: "E-107", full_name: "Emp Seven", email: "e107@example.com", location_code: "SF", department: "Sales", hire_date: "2020-01-01T00:00:00Z", employment_status: "ON_LEAVE" }
              as: ERManager
            - call: "POST /er/employees"
              payload: { employee_number: "E-108", full_name: "Emp Eight", email: "e108@example.com", location_code: "SF", department: "Sales", hire_date: "2020-01-01T00:00:00Z", employment_status: "ON_LEAVE" }
              as: ERManager
            - call: "POST /er/employees"
              payload: { employee_number: "R-101", full_name: "Reporter A", email: "r101@example.com", location_code: "HQ", department: "HR", hire_date: "2020-01-01T00:00:00Z" }
              as: ERManager
              captures: { rep1: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "I-101", full_name: "Inv Lead", email: "i101@example.com", location_code: "HQ", department: "ER", hire_date: "2018-01-01T00:00:00Z" }
              as: ERManager
              captures: { ei1: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "I-102", full_name: "Inv Peer1", email: "i102@example.com", location_code: "HQ", department: "ER", hire_date: "2018-01-01T00:00:00Z" }
              as: ERManager
              captures: { ei2: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "I-103", full_name: "Inv Peer2", email: "i103@example.com", location_code: "HQ", department: "ER", hire_date: "2018-01-01T00:00:00Z" }
              as: ERManager
              captures: { ei3: $.data.id }
            - call: "POST /er/investigators"
              payload: { employee_id: "${ei1}", certification_level: "LEVEL_3", max_active_cases: 10 }
              as: ERManager
              captures: { inv1: $.data.id }
            - call: "POST /er/investigators"
              payload: { employee_id: "${ei2}", certification_level: "LEVEL_3", max_active_cases: 10 }
              as: ERManager
              captures: { inv2: $.data.id }
            - call: "POST /er/investigators"
              payload: { employee_id: "${ei3}", certification_level: "LEVEL_3", max_active_cases: 10 }
              as: ERManager
              captures: { inv3: $.data.id }
            - call: "POST /er/cases"
              payload: { intake_channel_id: "${ch1}", reporter_employee_id: "${rep1}", subject_employee_id: "${e1}", category: "POLICY_VIOLATION", severity: "LOW" }
              as: ERManager
              captures: { c1: $.data.id, c1_v: $.data.version }
            - call: "POST /er/cases/${c1}/assign"
              payload: { investigator_id: "${inv1}", expected_case_version: "${c1_v}" }
              as: ERManager
            - call: "POST /er/cases/${c1}/begin-investigation"
              payload: {}
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/cases/${c1}/interviews"
              payload: { interviewee_employee_id: "${e1}", scheduled_start: "2026-07-27T10:00:00Z", scheduled_end: "2026-07-27T11:00:00Z" }
              as: Investigator
              as_user_id: "${inv1}"
              captures: { iv1: $.data.id }
            - call: "POST /er/interviews/${iv1}/complete"
              payload: { documentation_text: "Interviewed the subject at length regarding the alleged policy violation and captured their full account of events." }
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/cases/${c1}/evidence-items"
              payload: { submitted_by_employee_id: "${rep1}", evidence_type: "EMAIL", description: "Email thread showing the policy breach timeline." }
              as: Investigator
              as_user_id: "${inv1}"
              captures: { ev1: $.data.id }
            - call: "POST /er/evidence-items/${ev1}/begin-review"
              payload: {}
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/evidence-items/${ev1}/admit"
              payload: { weight: 0.8 }
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/cases/${c1}/findings"
              payload: { rationale_text: "Based on the admitted email evidence and the completed subject interview, the allegation could not be substantiated on the balance of probabilities." }
              as: Investigator
              as_user_id: "${inv1}"
              captures: { f1: $.data.id }
            - call: "POST /er/findings/${f1}/substantiate"
              payload: { outcome: "UNSUBSTANTIATED" }
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/findings/${f1}/actions"
              payload: { action_type: "NO_ACTION", severity_points: 0, justification: "No action is warranted because the allegation was not substantiated." }
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/findings/${f1}/submit-for-calibration"
              payload: {}
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/findings/${f1}/approve"
              payload: {}
              as: Investigator
              as_user_id: "${inv2}"
            - call: "POST /er/findings/${f1}/approve"
              payload: {}
              as: Investigator
              as_user_id: "${inv3}"
            - call: "POST /er/cases/${c1}/closure-notices"
              payload: { recipient_employee_id: "${e1}", recipient_role: "SUBJECT", confidentiality_tier: "TIER_2_LIMITED", body_text: "The investigation concerning you has concluded. The allegation was not substantiated." }
              as: ERManager
              captures: { n1s: $.data.id }
            - call: "POST /er/cases/${c1}/closure-notices"
              payload: { recipient_employee_id: "${rep1}", recipient_role: "REPORTER", confidentiality_tier: "TIER_1_SUMMARY", body_text: "Thank you for your report. The investigation has concluded." }
              as: ERManager
              captures: { n1r: $.data.id }
            - call: "POST /er/closure-notices/${n1s}/send"
              payload: {}
              as: ERManager
            - call: "POST /er/closure-notices/${n1r}/send"
              payload: {}
              as: ERManager
            - call: "GET /er/cases/${c1}"
              as: ERManager
              captures: { c1_v2: $.data.version }
            - call: "POST /er/cases/${c1}/close"
              payload: { expected_case_version: "${c1_v2}" }
              as: ERManager
            - call: "POST /er/cases"
              payload: { intake_channel_id: "${ch1}", reporter_employee_id: "${rep1}", subject_employee_id: "${e1}", category: "POLICY_VIOLATION", severity: "LOW" }
              as: ERManager
              captures: { c2: $.data.id, c2_v: $.data.version }
            - call: "POST /er/cases/${c2}/assign"
              payload: { investigator_id: "${inv1}", expected_case_version: "${c2_v}" }
              as: ERManager
            - call: "POST /er/cases/${c2}/begin-investigation"
              payload: {}
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/cases/${c2}/interviews"
              payload: { interviewee_employee_id: "${e1}", scheduled_start: "2026-07-28T10:00:00Z", scheduled_end: "2026-08-04T11:00:00Z" }
              as: Investigator
              as_user_id: "${inv1}"
              captures: { iv2: $.data.id }
            - call: "POST /er/interviews/${iv2}/complete"
              payload: { documentation_text: "Second interview documenting the subject account of the second reported policy violation in full detail." }
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/cases/${c2}/evidence-items"
              payload: { submitted_by_employee_id: "${rep1}", evidence_type: "CHAT_LOG", description: "Chat export corroborating the second report." }
              as: Investigator
              as_user_id: "${inv1}"
              captures: { ev2: $.data.id }
            - call: "POST /er/evidence-items/${ev2}/begin-review"
              payload: {}
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/evidence-items/${ev2}/admit"
              payload: { weight: 0.7 }
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/cases/${c2}/findings"
              payload: { rationale_text: "The chat log and interview together do not establish that a policy violation occurred on the balance of probabilities." }
              as: Investigator
              as_user_id: "${inv1}"
              captures: { f2: $.data.id }
            - call: "POST /er/findings/${f2}/substantiate"
              payload: { outcome: "UNSUBSTANTIATED" }
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/findings/${f2}/actions"
              payload: { action_type: "NO_ACTION", severity_points: 0, justification: "No action warranted; allegation unsubstantiated after full review." }
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/findings/${f2}/submit-for-calibration"
              payload: {}
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/findings/${f2}/approve"
              payload: {}
              as: Investigator
              as_user_id: "${inv2}"
            - call: "POST /er/findings/${f2}/approve"
              payload: {}
              as: Investigator
              as_user_id: "${inv3}"
            - call: "POST /er/cases/${c2}/closure-notices"
              payload: { recipient_employee_id: "${e1}", recipient_role: "SUBJECT", confidentiality_tier: "TIER_2_LIMITED", body_text: "The second investigation concerning you has concluded without substantiation." }
              as: ERManager
              captures: { n2s: $.data.id }
            - call: "POST /er/cases/${c2}/closure-notices"
              payload: { recipient_employee_id: "${rep1}", recipient_role: "REPORTER", confidentiality_tier: "TIER_1_SUMMARY", body_text: "Thank you for your second report. The investigation has concluded." }
              as: ERManager
              captures: { n2r: $.data.id }
            - call: "POST /er/closure-notices/${n2s}/send"
              payload: {}
              as: ERManager
            - call: "POST /er/closure-notices/${n2r}/send"
              payload: {}
              as: ERManager
            - call: "GET /er/cases/${c2}"
              as: ERManager
              captures: { c2_v2: $.data.version }
            - call: "POST /er/cases/${c2}/close"
              payload: { expected_case_version: "${c2_v2}" }
              as: ERManager
            - call: "POST /er/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: ERManager
          trigger:
            - call: "POST /er/trend-snapshots"
              payload: { scope_type: "LOCATION", scope_key: "SF", window_kind: "ROLLING_90D" }
              as: HRAnalyst
              captures: { ts_roll: $.data.id, ts_roll_rate: $.data.case_rate_per_100 }
            - call: "POST /er/trend-snapshots"
              payload: { scope_type: "LOCATION", scope_key: "SF", window_kind: "CALENDAR_QUARTER" }
              as: HRAnalyst
              captures: { ts_q: $.data.id, ts_q_rate: $.data.case_rate_per_100 }
          assert:
            - "TrendSnapshot.${ts_roll}.closed_case_count == 2"
            - "TrendSnapshot.${ts_roll}.case_rate_per_100 == 40.00"
            - "TrendSnapshot.${ts_q}.closed_case_count == 2"
            - "TrendSnapshot.${ts_q}.case_rate_per_100 == 25.00"
            - "TrendSnapshot.${ts_roll}.case_rate_per_100 != TrendSnapshot.${ts_q}.case_rate_per_100"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula: two instances in DIFFERENT modes.
  # Instance 1: mode (a) — >=3 inputs, nested min/max, tier selection
  #             (action_calibration).
  # Instance 2: mode (b) — nested rounding order pinned (trend_case_rate
  #             rollup: sum-unrounded-then-round vs round-then-sum).
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: action_calibration_nested_minmax_median
        grounds:
          - calculations.action_calibration
          - entities.Finding.fields.calibration_score
          - state_machines.Finding.approval_status=CALIBRATED_to_approval_status=APPROVED
        distinguishing_aspect: |
          Mode (a) combinatorial formula: action_calibration combines >= 3
          inputs (historical accepted max severity_points per finding, the
          proposed max, and the severity-keyed fallback) through nested
          max()/median()/abs()/min-max clamping; with history [20, 40, 60]
          (median 40) and proposed_max 70 the pinned output is
          calibration_score == 0.70, and the PROPOSED 70-point action flips
          to ACCEPTED while the 20-point action flips to SUPERSEDED.
        test_recipe:
          setup:
            - "Three historical APPROVED findings in category HARASSMENT with ACCEPTED action severity_points 20, 40, 60 (within trailing 365 days)."
            - "A fourth HARASSMENT case has reached CALIBRATION with two PROPOSED actions: WRITTEN_WARNING (20 pts) and SUSPENSION (70 pts)."
            - "Two non-author investigators INV2, INV3 exist to supply the quorum; INV1 is the author."
            - "Clock at 2026-08-20T00:00:00Z for all approvals so history falls inside the trailing 365-day window."
          setup_api_calls:
            - call: "POST /er/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ERManager
            - call: "POST /er/intake-channels"
              payload: { channel_code: "HR_DIRECT", display_name: "HR Direct", default_category: "HARASSMENT", default_severity: "HIGH", sla_business_days: 20 }
              as: ERManager
              captures: { ch1: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "R-201", full_name: "Reporter B", email: "r201@example.com", location_code: "LA", department: "Ops", hire_date: "2019-01-01T00:00:00Z" }
              as: ERManager
              captures: { rep: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "S-201", full_name: "Subject B", email: "s201@example.com", location_code: "LA", department: "Ops", hire_date: "2019-01-01T00:00:00Z" }
              as: ERManager
              captures: { sub: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "I-201", full_name: "Inv Author", email: "i201@example.com", location_code: "HQ", department: "ER", hire_date: "2018-01-01T00:00:00Z" }
              as: ERManager
              captures: { ei1: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "I-202", full_name: "Inv Cal1", email: "i202@example.com", location_code: "HQ", department: "ER", hire_date: "2018-01-01T00:00:00Z" }
              as: ERManager
              captures: { ei2: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "I-203", full_name: "Inv Cal2", email: "i203@example.com", location_code: "HQ", department: "ER", hire_date: "2018-01-01T00:00:00Z" }
              as: ERManager
              captures: { ei3: $.data.id }
            - call: "POST /er/investigators"
              payload: { employee_id: "${ei1}", certification_level: "LEVEL_3", max_active_cases: 10 }
              as: ERManager
              captures: { inv1: $.data.id }
            - call: "POST /er/investigators"
              payload: { employee_id: "${ei2}", certification_level: "LEVEL_3", max_active_cases: 10 }
              as: ERManager
              captures: { inv2: $.data.id }
            - call: "POST /er/investigators"
              payload: { employee_id: "${ei3}", certification_level: "LEVEL_3", max_active_cases: 10 }
              as: ERManager
              captures: { inv3: $.data.id }
            # --- historical case 1: accepted action 20 pts ---
            - call: "POST /er/cases"
              payload: { intake_channel_id: "${ch1}", reporter_employee_id: "${rep}", subject_employee_id: "${sub}", category: "HARASSMENT", severity: "MEDIUM" }
              as: ERManager
              captures: { h1: $.data.id, h1_v: $.data.version }
            - call: "POST /er/cases/${h1}/assign"
              payload: { investigator_id: "${inv1}", expected_case_version: "${h1_v}" }
              as: ERManager
            - call: "POST /er/cases/${h1}/begin-investigation"
              payload: {}
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/cases/${h1}/interviews"
              payload: { interviewee_employee_id: "${sub}", scheduled_start: "2026-07-27T09:00:00Z", scheduled_end: "2026-07-27T10:00:00Z" }
              as: Investigator
              as_user_id: "${inv1}"
              captures: { h1_iv: $.data.id }
            - call: "POST /er/interviews/${h1_iv}/complete"
              payload: { documentation_text: "Historical case one subject interview fully documented with all material statements recorded verbatim." }
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/cases/${h1}/evidence-items"
              payload: { submitted_by_employee_id: "${rep}", evidence_type: "DOCUMENT", description: "Historical case one supporting document." }
              as: Investigator
              as_user_id: "${inv1}"
              captures: { h1_ev: $.data.id }
            - call: "POST /er/evidence-items/${h1_ev}/begin-review"
              payload: {}
