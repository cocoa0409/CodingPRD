scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: feequote_estimate_vs_final_diverge_on_schedule_republish
        grounds:
          - calculations.fee_quote_estimate
          - calculations.fee_quote_final
          - entities.FeeQuote.fields.variant
          - entities.FeeQuote.fields.total_cents
          - state_machines.Transaction.APPROVED_to_COMPLETED
        distinguishing_aspect: "ESTIMATE freezes the FeeSchedule at quote time; FINAL re-pins the ACTIVE schedule at completion — a republished 625->700 bps tax rate makes the FINAL total (76000) differ from the ESTIMATE total (68500) on identical Transaction inputs. This is cost accounting on FeeQuote/Transaction."
        test_recipe:
          setup:
            - "PlatformAdmin publishes FeeSchedule for CA with use_tax_rate_bps=625."
            - "RETAIL Account in CA; one TRANSFER Transaction declared_price_cents=1000000, trade_in 0, no expedite; documents VERIFIED; ESTIMATE quote computed (total 68500)."
            - "Transaction driven all the way to APPROVED; then admin republishes CA schedule with use_tax_rate_bps=700 BEFORE completion."
          setup_api_calls:
            - call: "POST /dmv/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dmv/fee-schedules"
              payload: { state_code: "CA", title_fee_cents: 2000, registration_fee_cents: 8500, transfer_fee_cents: 1500, lien_recording_fee_cents: 1000, use_tax_rate_bps: 625, trade_in_credit_allowed: true }
              as: PlatformAdmin
              captures: { sched_v1_id: $.data.id }
            - call: "POST /dmv/accounts"
              payload: { account_type: "RETAIL", legal_name: "Buyer One", state_code: "CA" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /dmv/transactions"
              payload: { account_id: "${acct_id}", transaction_type: "TRANSFER", vin: "1HGCM82633A004352", declared_price_cents: 1000000, trade_in_allowance_cents: 0, expedite: false }
              as: IntakeClerk
              captures: { txn_id: $.data.id, txn_v0: $.data.version }
            - call: "POST /dmv/documents"
              payload: { transaction_id: "${txn_id}", checklist_code: "TITLE_CERT", file_ref: "f1" }
              as: IntakeClerk
              captures: { d1_id: $.data.id }
            - call: "POST /dmv/documents"
              payload: { transaction_id: "${txn_id}", checklist_code: "BILL_OF_SALE", file_ref: "f2" }
              as: IntakeClerk
              captures: { d2_id: $.data.id }
            - call: "POST /dmv/documents"
              payload: { transaction_id: "${txn_id}", checklist_code: "ID_PROOF", file_ref: "f3" }
              as: IntakeClerk
              captures: { d3_id: $.data.id }
            - call: "POST /dmv/documents/${d1_id}/verify"
              payload: { decision: "VERIFIED" }
              as: IntakeClerk
            - call: "POST /dmv/documents/${d2_id}/verify"
              payload: { decision: "VERIFIED" }
              as: IntakeClerk
            - call: "POST /dmv/documents/${d3_id}/verify"
              payload: { decision: "VERIFIED" }
              as: IntakeClerk
            - call: "POST /dmv/transactions/${txn_id}/verify-documents"
              payload: {}
              as: IntakeClerk
              captures: { txn_v1: $.data.version }
            - call: "POST /dmv/transactions/${txn_id}/quote"
              payload: { expected_transaction_version: "${txn_v1}" }
              as: FeeAnalyst
              captures: { est_quote_id: $.data.id, est_total: $.data.total_cents }
            - call: "POST /dmv/transactions/${txn_id}/submit"
              payload: {}
              as: IntakeClerk
              captures: { sub_id: $.data.id }
            - call: "POST /dmv/runner-trips"
              payload: { dmv_office_code: "CA-DMV-01", capacity: 5, window_start_at: "2026-04-01T09:00:00Z", window_end_at: "2026-04-01T12:00:00Z" }
              as: RunnerDispatcher
              captures: { trip_id: $.data.id, trip_v0: $.data.version }
            - call: "POST /dmv/runner-trips/${trip_id}/legs"
              payload: { submission_id: "${sub_id}", expected_runnertrip_version: "${trip_v0}" }
              as: RunnerDispatcher
            - call: "POST /dmv/runner-trips/${trip_id}/dispatch"
              payload: {}
              as: RunnerDispatcher
            - call: "POST /dmv/runner-trips/${trip_id}/return"
              payload: {}
              as: RunnerDispatcher
            - call: "POST /dmv/submissions/${sub_id}/decision"
              payload: { outcome: "ACCEPTED" }
              as: RunnerDispatcher
            - call: "POST /dmv/fee-schedules"
              payload: { state_code: "CA", title_fee_cents: 2000, registration_fee_cents: 8500, transfer_fee_cents: 1500, lien_recording_fee_cents: 1000, use_tax_rate_bps: 700, trade_in_credit_allowed: true }
              as: PlatformAdmin
          trigger:
            - call: "POST /dmv/transactions/${txn_id}/complete"
              payload: {}
              as: FeeAnalyst
              captures: { final_total: $.data.active_quote_id }
          assert:
            - "FeeQuote ${est_quote_id}.total_cents == 68500 and variant == ESTIMATE and status == SUPERSEDED"
            - "the FINAL FeeQuote for ${txn_id} has total_cents == 76000 and variant == FINAL and status == SETTLED"
            - "the FINAL total (76000) != the ESTIMATE total (68500)"

      - name: account_balance_postpaid_vs_prepaid_variant
        grounds:
          - calculations.account_balance
          - entities.Account.fields.outstanding_balance_cents
          - entities.Account.fields.credit_terms
          - state_machines.Transaction.APPROVED_to_COMPLETED
        distinguishing_aspect: "account_balance is ledger reconciliation on Account (a different entity domain than FeeQuote cost accounting): the postpaid (FLEET credit_terms) variant leaves outstanding_balance_cents == the SETTLED total after completion, while the prepaid (RETAIL) variant requires a CHARGE Payment that nets the balance to 0."
        test_recipe:
          setup:
            - "Two CA accounts on the SAME FeeSchedule (use_tax 625): a FLEET account with credit_terms=true, credit_limit 100000, and a RETAIL account."
            - "Each opens a REGISTRATION (state_fees 8500, no tax) and is driven to COMPLETED. FLEET ytd=0 so no discount: total 13000. RETAIL same total 13000."
            - "RETAIL records a CHARGE Payment of 13000 at completion; FLEET does not."
          setup_api_calls:
            - call: "POST /dmv/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dmv/fee-schedules"
              payload: { state_code: "CA", title_fee_cents: 2000, registration_fee_cents: 8500, transfer_fee_cents: 1500, lien_recording_fee_cents: 1000, use_tax_rate_bps: 625, trade_in_credit_allowed: true }
              as: PlatformAdmin
            - call: "POST /dmv/accounts"
              payload: { account_type: "FLEET", legal_name: "Fleet Co", state_code: "CA", credit_terms: true, credit_limit_cents: 100000 }
              as: PlatformAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /dmv/transactions"
              payload: { account_id: "${fleet_id}", transaction_type: "REGISTRATION", vin: "1HGCM82633A004352", declared_price_cents: 0, expedite: false }
              as: IntakeClerk
              captures: { f_txn_id: $.data.id }
            - call: "POST /dmv/documents"
              payload: { transaction_id: "${f_txn_id}", checklist_code: "ID_PROOF", file_ref: "f1" }
              as: IntakeClerk
              captures: { f_d1: $.data.id }
            - call: "POST /dmv/documents"
              payload: { transaction_id: "${f_txn_id}", checklist_code: "INSURANCE", file_ref: "f2" }
              as: IntakeClerk
              captures: { f_d2: $.data.id }
            - call: "POST /dmv/documents/${f_d1}/verify"
              payload: { decision: "VERIFIED" }
              as: IntakeClerk
            - call: "POST /dmv/documents/${f_d2}/verify"
              payload: { decision: "VERIFIED" }
              as: IntakeClerk
            - call: "POST /dmv/transactions/${f_txn_id}/verify-documents"
              payload: {}
              as: IntakeClerk
              captures: { f_txn_v1: $.data.version }
            - call: "POST /dmv/transactions/${f_txn_id}/quote"
              payload: { expected_transaction_version: "${f_txn_v1}" }
              as: FeeAnalyst
            - call: "POST /dmv/transactions/${f_txn_id}/submit"
              payload: {}
              as: IntakeClerk
              captures: { f_sub: $.data.id }
            - call: "POST /dmv/runner-trips"
              payload: { dmv_office_code: "CA-DMV-01", capacity: 5, window_start_at: "2026-04-01T09:00:00Z", window_end_at: "2026-04-01T12:00:00Z" }
              as: RunnerDispatcher
              captures: { f_trip: $.data.id, f_trip_v0: $.data.version }
            - call: "POST /dmv/runner-trips/${f_trip}/legs"
              payload: { submission_id: "${f_sub}", expected_runnertrip_version: "${f_trip_v0}" }
              as: RunnerDispatcher
            - call: "POST /dmv/runner-trips/${f_trip}/dispatch"
              payload: {}
              as: RunnerDispatcher
            - call: "POST /dmv/runner-trips/${f_trip}/return"
              payload: {}
              as: RunnerDispatcher
            - call: "POST /dmv/submissions/${f_sub}/decision"
              payload: { outcome: "ACCEPTED" }
              as: RunnerDispatcher
          trigger:
            - call: "POST /dmv/transactions/${f_txn_id}/complete"
              payload: {}
              as: FeeAnalyst
          assert:
            - "Account.${fleet_id}.outstanding_balance_cents == 13000 (postpaid: completion adds the SETTLED total, no CHARGE)"
            - "Account.${fleet_id}.status == ACTIVE (13000 <= credit_limit 100000)"
            - "Account.${fleet_id}.ytd_completed_count == 1"

  # =====================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: title_quote_nested_minmax_with_tradein_and_expedite_mode_a
        grounds:
          - calculations.fee_quote_estimate
          - entities.Transaction.fields.declared_price_cents
          - entities.Transaction.fields.trade_in_allowance_cents
          - entities.Transaction.fields.expedite
          - entities.FeeSchedule.fields.trade_in_credit_allowed
        distinguishing_aspect: "Mode (a): >=3 inputs with non-linear interaction — taxable base = max(0, declared - trade_in) gated on trade_in_credit_allowed, tax = base*bps, plus conditional expedite surcharge branch; the formula is not a flat sum. RETAIL TITLE declared 2000000, trade 500000, expedite true, bps 625 -> total 106250."
        test_recipe:
          setup:
            - "CA FeeSchedule use_tax 625, title_fee 2000, trade_in_credit_allowed true."
            - "RETAIL CA account; TITLE Transaction declared_price_cents=2000000, trade_in_allowance_cents=500000, expedite=true, in DRAFT."
          setup_api_calls:
            - call: "POST /dmv/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dmv/fee-schedules"
              payload: { state_code: "CA", title_fee_cents: 2000, registration_fee_cents: 8500, transfer_fee_cents: 1500, lien_recording_fee_cents: 1000, use_tax_rate_bps: 625, trade_in_credit_allowed: true }
              as: PlatformAdmin
            - call: "POST /dmv/accounts"
              payload: { account_type: "RETAIL", legal_name: "Buyer Two", state_code: "CA" }
              as: PlatformAdmin
              captures: { acct2_id: $.data.id }
            - call: "POST /dmv/transactions"
              payload: { account_id: "${acct2_id}", transaction_type: "TITLE", vin: "1HGCM82633A004352", declared_price_cents: 2000000, trade_in_allowance_cents: 500000, expedite: true }
              as: IntakeClerk
              captures: { t2_id: $.data.id, t2_v0: $.data.version }
          trigger:
            - call: "POST /dmv/transactions/${t2_id}/quote"
              payload: { expected_transaction_version: "${t2_v0}" }
              as: FeeAnalyst
              captures: { q_tax: $.data.tax_cents, q_total: $.data.total_cents }
          assert:
            - "FeeQuote.tax_cents == 93750 (max(0, 2000000-500000)=1500000 * 625bps)"
            - "FeeQuote.state_fees_cents == 2000"
            - "FeeQuote.service_fee_cents == 10500 (4500 base + 6000 expedite, no discount)"
            - "FeeQuote.total_cents == 106250"

      - name: service_fee_sum_then_round_order_mode_b
        grounds:
          - calculations.fee_quote_estimate
          - calculations.fleet_volume_discount
          - entities.FeeQuote.fields.service_fee_cents
        distinguishing_aspect: "Mode (b): nested rounding where order matters — service fee at the 1250 bps (ytd>=20) tier with expedite+1 rework is round((4500+6000+2500)*0.875)=round(11375.0... )=11375 under the PINNED sum-then-round, whereas round-each-then-sum gives 11376. The scaffold pins sum-then-round, so 11375 is correct and 11376 is the trap."
        test_recipe:
          setup:
            - "CA FeeSchedule use_tax 625, registration_fee 8500."
            - "FLEET CA account with ytd_completed_count == 20 (tier 1250 bps) reached by completing 20 prior REGISTRATION transactions; credit_limit high enough to stay ACTIVE."
            - "A 21st REGISTRATION Transaction with expedite=true that has already been REJECTED once (rejection_round=1) and re-verified, in DRAFT/QUOTED with rework surcharge applicable."
          setup_api_calls:
            - call: "POST /dmv/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dmv/fee-schedules"
              payload: { state_code: "CA", title_fee_cents: 2000, registration_fee_cents: 8500, transfer_fee_cents: 1500, lien_recording_fee_cents: 1000, use_tax_rate_bps: 625, trade_in_credit_allowed: true }
              as: PlatformAdmin
            - call: "POST /dmv/accounts"
              payload: { account_type: "FLEET", legal_name: "Big Fleet", state_code: "CA", credit_terms: true, credit_limit_cents: 100000000 }
              as: PlatformAdmin
              captures: { bf_id: $.data.id }
            - call: "POST /dmv/_inject/account_counters"
              payload: { account_id: "${bf_id}", ytd_completed_count: 20 }
              as: PlatformAdmin
              captures: { bf_v: $.data.version }
            - call: "POST /dmv/transactions"
              payload: { account_id: "${bf_id}", transaction_type: "REGISTRATION", vin: "1HGCM82633A004352", declared_price_cents: 0, expedite: true }
              as: IntakeClerk
              captures: { bf_txn: $.data.id, bf_txn_v0: $.data.version }
            - call: "POST /dmv/_inject/rejection_round"
              payload: { transaction_id: "${bf_txn}", rejection_round: 1 }
              as: PlatformAdmin
              captures: { bf_txn_v1: $.data.version }
          trigger:
            - call: "POST /dmv/transactions/${bf_txn}/quote"
              payload: { expected_transaction_version: "${bf_txn_v1}" }
              as: FeeAnalyst
              captures: { bf_svc: $.data.service_fee_cents, bf_total: $.data.total_cents }
          assert:
            - "FeeQuote.service_fee_cents == 11375 (sum-then-round of (4500+6000+2500)*8750/10000), NOT 11376"
            - "FeeQuote.state_fees_cents == 8500"
            - "FeeQuote.total_cents == 19875"

  # =====================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: transaction_rework_cycle_rejected_back_to_submitted
        grounds:
          - state_machines.Transaction.SUBMITTED_to_REJECTED
          - state_machines.Transaction.REJECTED_to_SUBMITTED
          - entities.Transaction.fields.rejection_round
        distinguishing_aspect: "Cyclic shape on Transaction: SUBMITTED->REJECTED->SUBMITTED revisits SUBMITTED; rejection_round increments to 1 on the first DMV rejection and the loop re-enters SUBMITTED with a fresh QUEUED Submission. (Entity: Transaction.)"
        test_recipe:
          setup:
            - "CA FeeSchedule; RETAIL CA account; REGISTRATION Transaction driven to SUBMITTED via a runner leg, trip RETURNED."
            - "DMV records DMV_REJECTED -> Transaction REJECTED, rejection_round 1, document_status INCOMPLETE; clerk re-verifies docs; analyst re-quotes."
          setup_api_calls:
            - call: "POST /dmv/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dmv/fee-schedules"
              payload: { state_code: "CA", title_fee_cents: 2000, registration_fee_cents: 8500, transfer_fee_cents: 1500, lien_recording_fee_cents: 1000, use_tax_rate_bps: 625, trade_in_credit_allowed: true }
              as: PlatformAdmin
            - call: "POST /dmv/accounts"
              payload: { account_type: "RETAIL", legal_name: "Rework Cust", state_code: "CA" }
              as: PlatformAdmin
              captures: { rw_acct: $.data.id }
            - call: "POST /dmv/transactions"
              payload: { account_id: "${rw_acct}", transaction_type: "REGISTRATION", vin: "1HGCM82633A004352", declared_price_cents: 0, expedite: false }
              as: IntakeClerk
              captures: { rw_txn: $.data.id }
            - call: "POST /dmv/documents"
              payload: { transaction_id: "${rw_txn}", checklist_code: "ID_PROOF", file_ref: "f1" }
              as: IntakeClerk
              captures: { rw_d1: $.data.id }
            - call: "POST /dmv/documents"
              payload: { transaction_id: "${rw_txn}", checklist_code: "INSURANCE", file_ref: "f2" }
              as: IntakeClerk
              captures: { rw_d2: $.data.id }
            - call: "POST /dmv/documents/${rw_d1}/verify"
              payload: { decision: "VERIFIED" }
              as: IntakeClerk
            - call: "POST /dmv/documents/${rw_d2}/verify"
              payload: { decision: "VERIFIED" }
              as: IntakeClerk
            - call: "POST /dmv/transactions/${rw_txn}/verify-documents"
              payload: {}
              as: IntakeClerk
              captures: { rw_v1: $.data.version }
            - call: "POST /dmv/transactions/${rw_txn}/quote"
              payload: { expected_transaction_version: "${rw_v1}" }
              as: FeeAnalyst
            - call: "POST /dmv/transactions/${rw_txn}/submit"
              payload: {}
              as: IntakeClerk
              captures: { rw_sub1: $.data.id }
            - call: "POST /dmv/runner-trips"
              payload: { dmv_office_code: "CA-DMV-01", capacity: 5, window_start_at: "2026-04-01T09:00:00Z", window_end_at: "2026-04-01T12:00:00Z" }
              as: RunnerDispatcher
              captures: { rw_trip: $.data.id, rw_trip_v0: $.data.version }
            - call: "POST /dmv/runner-trips/${rw_trip}/legs"
              payload: { submission_id: "${rw_sub1}", expected_runnertrip_version: "${rw_trip_v0}" }
              as: RunnerDispatcher
            - call: "POST /dmv/runner-trips/${rw_trip}/dispatch"
              payload: {}
              as: RunnerDispatcher
            - call: "POST /dmv/runner-trips/${rw_trip}/return"
              payload: {}
              as: RunnerDispatcher
            - call: "POST /dmv/submissions/${rw_sub1}/decision"
              payload: { outcome: "DMV_REJECTED", rejection_reason: "Illegible insurance card" }
              as: RunnerDispatcher
            - call: "POST /dmv/documents/${rw_d2}/verify"
              payload: { decision: "VERIFIED" }
              as: IntakeClerk
            - call: "POST /dmv/transactions/${rw_txn}/verify-documents"
              payload: {}
              as: IntakeClerk
              captures: { rw_v2: $.data.version }
            - call: "POST /dmv/transactions/${rw_txn}/quote"
              payload: { expected_transaction_version: "${rw_v2}" }
              as: FeeAnalyst
          trigger:
            - call: "POST /dmv/transactions/${rw_txn}/submit"
              payload: {}
              as: IntakeClerk
              captures: { rw_sub2: $.data.id }
          assert:
            - "Transaction.${rw_txn}.lifecycle_status == SUBMITTED (re-entered after the cycle)"
            - "Transaction.${rw_txn}.rejection_round == 1"
            - "Submission ${rw_sub1}.submission_status == SUPERSEDED and ${rw_sub2}.submission_status == QUEUED"

      - name: runnertrip_fork_join_dispatch_and_close
        grounds:
          - state_machines.RunnerTrip.PLANNED_to_DISPATCHED
          - state_machines.RunnerTrip.RETURNED_to_CLOSED
          - entities.RunnerLeg.fields.leg_status
        distinguishing_aspect: "Branching fork-join on RunnerTrip (a different entity than Transaction): dispatch fans out FILED to ALL attached legs (fork), and close requires EVERY leg RESOLVED (join). Two legs both become FILED on one dispatch, and close is blocked until both are RESOLVED."
        test_recipe:
          setup:
            - "CA FeeSchedule; one RETAIL account with two REGISTRATION transactions, each driven to a QUEUED Submission."
            - "One RunnerTrip capacity 5; both submissions attached as two legs; trip dispatched (both legs FILED) and RETURNED."
          setup_api_calls:
            - call: "POST /dmv/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dmv/fee-schedules"
              payload: { state_code: "CA", title_fee_cents: 2000, registration_fee_cents: 8500, transfer_fee_cents: 1500, lien_recording_fee_cents: 1000, use_tax_rate_bps: 625, trade_in_credit_allowed: true }
              as: PlatformAdmin
            - call: "POST /dmv/accounts"
              payload: { account_type: "RETAIL", legal_name: "Two Txn", state_code: "CA" }
              as: PlatformAdmin
              captures: { tt_acct: $.data.id }
            - call: "POST /dmv/transactions"
              payload: { account_id: "${tt_acct}", transaction_type: "REGISTRATION", vin: "1HGCM82633A004352", declared_price_cents: 0, expedite: false }
              as: IntakeClerk
              captures: { tt_txnA: $.data.id }
            - call: "POST /dmv/documents"
              payload: { transaction_id: "${tt_txnA}", checklist_code: "ID_PROOF", file_ref: "a1" }
              as: IntakeClerk
              captures: { tt_a_d1: $.data.id }
            - call: "POST /dmv/documents"
              payload: { transaction_id: "${tt_txnA}", checklist_code: "INSURANCE", file_ref: "a2" }
              as: IntakeClerk
              captures: { tt_a_d2: $.data.id }
            - call: "POST /dmv/documents/${tt_a_d1}/verify"
              payload: { decision: "VERIFIED" }
              as: IntakeClerk
            - call: "POST /dmv/documents/${tt_a_d2}/verify"
              payload: { decision: "VERIFIED" }
              as: IntakeClerk
            - call: "POST /dmv/transactions/${tt_txnA}/verify-documents"
              payload: {}
              as: IntakeClerk
              captures: { tt_a_v1: $.data.version }
            - call: "POST /dmv/transactions/${tt_txnA}/quote"
              payload: { expected_transaction_version: "${tt_a_v1}" }
              as: FeeAnalyst
            - call: "POST /dmv/transactions/${tt_txnA}/submit"
              payload: {}
              as: IntakeClerk
              captures: { tt_subA: $.data.id }
            - call: "POST /dmv/transactions"
              payload: { account_id: "${tt_acct}", transaction_type: "REGISTRATION", vin: "2HGCM82633A004353", declared_price_cents: 0, expedite: false }
              as: IntakeClerk
              captures: { tt_txnB: $.data.id }
            - call: "POST /dmv/documents"
              payload: { transaction_id: "${tt_txnB}", checklist_code: "ID_PROOF", file_ref: "b1" }
              as: IntakeClerk
              captures: { tt_b_d1: $.data.id }
            - call: "POST /dmv/documents"
              payload: { transaction_id: "${tt_txnB}", checklist_code: "INSURANCE", file_ref: "b2" }
              as: IntakeClerk
              captures: { tt_b_d2: $.data.id }
            - call: "POST /dmv/documents/${tt_b_d1}/verify"
              payload: { decision: "VERIFIED" }
              as: IntakeClerk
            - call: "POST /dmv/documents/${tt_b_d2}/verify"
              payload: { decision: "VERIFIED" }
