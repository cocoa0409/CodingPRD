# =============================================================================
# PRD Benchmark Scaffold — Sleep Laboratory Scoring & Interpretation
# =============================================================================

scenario: |
  Sleep Laboratory Scoring & Interpretation (AASM-accredited sleep lab): study scheduling (in-lab vs home) & insurance authorization, technologist night staffing & bed assignment, raw study scoring & scorer inter-rater reliability, physician interpretation queue & turnaround, split-night protocol decision rules, therapy titration & prescription generation, DME order handoff & follow-up, accreditation & quality metrics

domain_name: sleep-lab-scoring
api_prefix: ""            # flat topology: all collections are top-level (e.g. /patients, /sleep-studies)

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  clock_note: |
    All server-stamped timestamps (created_at, updated_at, signed_at,
    acquisition_completed_at, dispatched_at, delivered_at, adjudicated_at, ...)
    read the logical clock. The logical clock starts at exactly
    2026-08-01T00:00:00Z and advances only via POST /_clock/set_current_utc.
    Date comparisons (scheduled_date, window_start/window_end, shift_date)
    compare against the UTC calendar date of the logical clock.

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: mrn, type: string, source: input, description: "Medical record number; unique across the lab (ERR_DUPLICATE_MRN)" }
      - { name: full_name, type: string, source: input, description: "Patient legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD" }

  - name: ReferralOrder
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; ordering patient" }
      - { name: ordering_provider_name, type: string, source: input, description: "Referring provider name" }
      - { name: requested_study_type, type: enum, source: input, description: "PSG_DIAGNOSTIC | HST | SPLIT_NIGHT | TITRATION_PAP" }
      - { name: icd10_primary, type: string, source: input, description: "Primary ICD-10 referral code" }
      - { name: priority, type: enum, source: input, default: ROUTINE, description: "ROUTINE | STAT; STAT switches turnaround SLA to calendar variant" }
      - { name: no_show_count, type: integer, source: system, default: 0, description: "Cumulative no-shows; >= 2 forces NEEDS_PROVIDER_REVIEW" }
      - { name: status, type: enum, source: system, description: "RECEIVED | AUTH_IN_PROGRESS | AUTHORIZED | AUTH_DENIED | SCHEDULED | NEEDS_PROVIDER_REVIEW | FULFILLED | CANCELLED | EXPIRED" }

  - name: InsuranceAuthorization
    parent: ReferralOrder
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> ReferralOrder.id; order this authorization belongs to" }
      - { name: payer_name, type: string, source: input, description: "Payer name" }
      - { name: authorization_number, type: string, source: input, description: "Payer-issued authorization number" }
      - { name: approved_nights, type: integer, source: input, description: "Number of study nights authorized (1..2)" }
      - { name: window_start, type: string, source: input, description: "First authorized service date YYYY-MM-DD (inclusive)" }
      - { name: window_end, type: string, source: input, description: "Last authorized service date YYYY-MM-DD (inclusive); must be >= window_start" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock timestamp of the payer decision; null until decided" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | DENIED | SUPERSEDED | EXPIRED | WITHDRAWN" }

  - name: Bed
    parent: null
    common_fields: true
    fields:
      - { name: room_label, type: string, source: input, description: "Unique room/bed label" }
      - { name: titration_capable, type: boolean, source: input, default: false, description: "Bed wired for PAP titration equipment" }
      - { name: is_active, type: boolean, source: input, default: true, description: "Schedulable flag" }

  - name: Technologist
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Technologist name" }
      - { name: credential, type: enum, source: input, description: "RPSGT | CPSGT" }
      - { name: is_active, type: boolean, source: input, default: true, description: "Employed/schedulable flag" }

  - name: Scorer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Scorer name" }
      - { name: credential, type: enum, source: input, description: "RPSGT | RST" }
      - { name: npi, type: string, source: input, description: "National Provider Identifier; used for scorer-vs-interpreter segregation of duties" }
      - { name: reliability_pool, type: boolean, source: input, default: false, description: "Enrolled in the inter-rater reliability program" }
      - { name: is_active, type: boolean, source: input, default: true, description: "Assignable flag" }
      - { name: consecutive_nonconcordant, type: integer, source: system, default: 0, description: "Consecutive adjudicated non-concordant rescore cases" }
      - { name: rolling_agreement_index, type: number, source: computed, description: "Rolling mean of per-case epoch_percent_agreement over the scorer's last 5 adjudicated cases as rescorer; null until >= 3 adjudicated cases" }
      - { name: reliability_status, type: enum, source: system, description: "PROVISIONAL | CONSISTENT | WATCH | REMEDIATION" }

  - name: Physician
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Physician name" }
      - { name: npi, type: string, source: input, description: "National Provider Identifier; compared against scoring task scorer npi" }
      - { name: board_certified, type: boolean, source: input, default: false, description: "Sleep-board certification flag" }
      - { name: is_active, type: boolean, source: input, default: true, description: "Assignable flag" }

  - name: StaffingAssignment
    parent: null
    common_fields: true
    fields:
      - { name: technologist_id, type: string, source: input, description: "FK -> Technologist.id; assigned technologist" }
      - { name: shift_date, type: string, source: input, description: "Night worked, YYYY-MM-DD" }
      - { name: patient_capacity, type: integer, source: input, default: 2, description: "Max in-lab patients this technologist covers (1..4; AASM 2:1 default)" }
      - { name: confirmed_at, type: datetime, source: system, description: "Logical-clock timestamp of confirmation; null until CONFIRMED" }
      - { name: status, type: enum, source: system, description: "PLANNED | CONFIRMED | CANCELLED" }

  - name: SleepStudy
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: order_id, type: string, source: input, description: "FK -> ReferralOrder.id; authorizing order" }
      - { name: bed_id, type: string, source: input, description: "FK -> Bed.id; required for PSG_DIAGNOSTIC/SPLIT_NIGHT/TITRATION_PAP, forbidden for HST" }
      - { name: study_type, type: enum, source: input, description: "PSG_DIAGNOSTIC | HST | SPLIT_NIGHT | TITRATION_PAP; must equal order.requested_study_type" }
      - { name: scheduled_date, type: string, source: input, description: "Night of study YYYY-MM-DD" }
      - { name: split_outcome, type: enum, source: system, description: "CONVERT_TO_TITRATION | CONTINUE_DIAGNOSTIC; null until split-decision recorded" }
      - { name: split_diagnostic_minutes, type: integer, source: system, description: "Diagnostic minutes observed at split decision; null until decided" }
      - { name: split_partial_ahi, type: number, source: system, description: "Partial AHI observed during diagnostic portion; null until decided" }
      - { name: acquisition_completed_at, type: datetime, source: system, description: "Logical-clock timestamp when acquisition completed; null until then" }
      - { name: total_recording_time_minutes, type: integer, source: input, description: "TRT minutes recorded at complete-acquisition (>= 60)" }
      - { name: titration_final_pressure_cm, type: number, source: input, description: "Ending PAP pressure in cm H2O; required at complete-acquisition for TITRATION_PAP and for SPLIT_NIGHT with split_outcome CONVERT_TO_TITRATION" }
      - { name: leak_95th_l_min, type: number, source: input, description: "95th percentile mask leak L/min; required together with titration_final_pressure_cm" }
      - { name: accepted_ahi, type: number, source: computed, description: "AHI snapshot from the ACCEPTED PRIMARY ScoringTask (in-lab types); null until accept" }
      - { name: accepted_rdi, type: number, source: computed, description: "RDI snapshot from the ACCEPTED PRIMARY ScoringTask (in-lab types); null until accept" }
      - { name: accepted_rei, type: number, source: computed, description: "REI snapshot from the ACCEPTED PRIMARY ScoringTask (HST); null until accept" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | SCORING_QUEUED | SCORING_IN_PROGRESS | SCORED | INTERPRETATION_IN_PROGRESS | INTERPRETED | REPORT_FINALIZED | NO_SHOW | CANCELLED | TECHNICAL_FAILURE" }

  - name: ScoringTask
    parent: SleepStudy
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> SleepStudy.id" }
      - { name: scorer_id, type: string, source: input, description: "FK -> Scorer.id; assigned scorer" }
      - { name: assignment_kind, type: enum, source: input, description: "PRIMARY | RELIABILITY_RESCORE" }
      - { name: obstructive_apneas, type: integer, source: input, description: "Scored obstructive apnea count (>= 0); set at submit" }
      - { name: central_apneas, type: integer, source: input, description: "Scored central apnea count (>= 0); set at submit" }
      - { name: mixed_apneas, type: integer, source: input, description: "Scored mixed apnea count (>= 0); set at submit" }
      - { name: hypopneas, type: integer, source: input, description: "Scored hypopnea count (>= 0); set at submit" }
      - { name: reras, type: integer, source: input, description: "Scored RERA count (>= 0); set at submit" }
      - { name: epochs_total, type: integer, source: input, description: "Total 30-second epochs staged (> 0); set at submit" }
      - { name: total_sleep_time_minutes, type: integer, source: input, description: "TST minutes; required > 0 at submit for in-lab study types; must be omitted for HST" }
      - { name: total_recording_time_minutes, type: integer, source: input, description: "TRT minutes; required > 0 at submit for HST; for in-lab types optional and, when present, must be >= total_sleep_time_minutes" }
      - { name: ahi, type: number, source: computed, description: "Apnea-hypopnea index per ahi_rdi_rei_computation; null for HST" }
      - { name: rdi, type: number, source: computed, description: "Respiratory disturbance index including RERAs; null for HST" }
      - { name: rei, type: number, source: computed, description: "Respiratory event index over recording time (HST only); null for in-lab types" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of latest submit" }
      - { name: returned_reason, type: string, source: system, description: "Physician reason on last return; null otherwise" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | IN_PROGRESS | SUBMITTED | ACCEPTED | RETURNED_FOR_REVISION | RECALLED" }

  - name: InterpretationReport
    parent: SleepStudy
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> SleepStudy.id" }
      - { name: physician_id, type: string, source: system, description: "FK -> Physician.id; author (from X-User-ID at creation)" }
      - { name: primary_scoring_task_id, type: string, source: input, description: "FK -> ScoringTask.id; the ACCEPTED PRIMARY task being interpreted" }
      - { name: diagnosis_code, type: string, source: input, description: "Physician diagnosis ICD-10" }
      - { name: index_at_interpretation, type: number, source: computed, description: "Index used for severity: accepted AHI for in-lab, accepted REI for HST; set at sign" }
      - { name: severity, type: enum, source: computed, description: "NORMAL | MILD | MODERATE | SEVERE per severity_classification; set at sign" }
      - { name: turnaround_business_hours, type: number, source: computed, description: "Weekday 08:00-17:00 UTC hours from acquisition_completed_at to signed_at; 1 decimal round_half_up" }
      - { name: turnaround_calendar_hours, type: number, source: computed, description: "Wall hours from acquisition_completed_at to signed_at; 1 decimal round_half_up" }
      - { name: sla_breached, type: boolean, source: computed, description: "ROUTINE: turnaround_business_hours > 48.0; STAT: turnaround_calendar_hours > 24.0" }
      - { name: signed_at, type: datetime, source: system, description: "Logical-clock timestamp of sign; null until SIGNED" }
      - { name: finalized_at, type: datetime, source: system, description: "Logical-clock timestamp of first finalize" }
      - { name: addendum_count, type: integer, source: system, default: 0, description: "Number of addendum cycles opened" }
      - { name: status, type: enum, source: system, description: "DRAFT | SIGNED | FINALIZED | ADDENDUM_OPEN | SUPERSEDED" }

  - name: TherapyPrescription
    parent: InterpretationReport
    common_fields: true
    fields:
      - { name: report_id, type: string, source: input, description: "FK -> InterpretationReport.id" }
      - { name: study_id, type: string, source: system, description: "FK -> SleepStudy.id; denormalized from the report at creation" }
      - { name: device_type, type: enum, source: input, description: "CPAP | APAP | BIPAP" }
      - { name: cpap_pressure_cm, type: number, source: input, description: "Required for CPAP: 4.0..20.0 in 0.5 steps" }
      - { name: apap_min_cm, type: number, source: input, description: "Required for APAP: 4.0 <= apap_min_cm < apap_max_cm <= 20.0, 0.5 steps" }
      - { name: apap_max_cm, type: number, source: input, description: "Required for APAP; see apap_min_cm" }
      - { name: bipap_ipap_cm, type: number, source: input, description: "Required for BIPAP: 4.0 <= bipap_epap_cm < bipap_ipap_cm <= 25.0, 0.5 steps" }
      - { name: bipap_epap_cm, type: number, source: input, description: "Required for BIPAP; see bipap_ipap_cm" }
      - { name: mask_type, type: enum, source: input, description: "NASAL | FULL_FACE | NASAL_PILLOWS" }
      - { name: humidification, type: boolean, source: input, default: true, description: "Heated humidification included" }
      - { name: ordered_at, type: datetime, source: system, description: "Logical-clock timestamp of ordering; null until ORDERED" }
      - { name: status, type: enum, source: system, description: "DRAFT | ORDERED | FULFILLED | CANCELLED | SUPERSEDED" }

  - name: DmeOrder
    parent: TherapyPrescription
    common_fields: true
    fields:
      - { name: prescription_id, type: string, source: input, description: "FK -> TherapyPrescription.id" }
      - { name: vendor_name, type: string, source: input, description: "DME vendor name" }
      - { name: dispatched_at, type: datetime, source: system, description: "Logical-clock timestamp of dispatch" }
      - { name: delivered_at, type: datetime, source: system, description: "Logical-clock timestamp of delivery; null until DELIVERED" }
      - { name: follow_up_usage_hours_avg, type: number, source: input, description: "Average nightly usage hours over the 30-day follow-up window; set at record-follow-up" }
      - { name: follow_up_compliant_nights_percent, type: number, source: input, description: "Percent of nights with >= 4h usage over the 30-day window; set at record-follow-up" }
      - { name: adherence_compliant, type: boolean, source: computed, description: "usage >= 4.0 AND compliant_nights_percent >= 70.0; null until follow-up" }
      - { name: resolution_action, type: enum, source: system, description: "CONTINUE_THERAPY | ESCALATE_TO_PHYSICIAN; null until resolve-adherence" }
      - { name: status, type: enum, source: system, description: "DISPATCHED | DELIVERED | DECLINED | CANCELLED | FOLLOW_UP_PASSED | ADHERENCE_REVIEW | FOLLOW_UP_RESOLVED" }

  - name: InterRaterCase
    parent: SleepStudy
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> SleepStudy.id" }
      - { name: primary_task_id, type: string, source: input, description: "FK -> ScoringTask.id; ACCEPTED PRIMARY reference task" }
      - { name: rescore_task_id, type: string, source: input, description: "FK -> ScoringTask.id; ACCEPTED RELIABILITY_RESCORE task under evaluation" }
      - { name: epochs_concordant, type: integer, source: input, description: "Epochs staged identically by both scorers (0..rescore_task.epochs_total); supplied at adjudicate" }
      - { name: ahi_primary, type: number, source: computed, description: "Snapshot of primary task index (AHI in-lab, REI for HST) at adjudication" }
      - { name: ahi_rescore, type: number, source: computed, description: "Snapshot of rescore task index at adjudication" }
      - { name: ahi_delta, type: number, source: computed, description: "|ahi_primary - ahi_rescore|, 2 decimals round_half_up" }
      - { name: percent_agreement, type: number, source: computed, description: "epochs_concordant / rescore_task.epochs_total * 100, 2 decimals round_half_up" }
      - { name: concordant, type: boolean, source: computed, description: "ahi_delta <= 2.0 AND percent_agreement >= 85.0" }
      - { name: adjudicated_at, type: datetime, source: system, description: "Logical-clock timestamp of adjudication" }
      - { name: status, type: enum, source: system, description: "OPEN | ADJUDICATED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: ReferralOrder
    initial_state: RECEIVED
    terminal_states: [FULFILLED, CANCELLED, EXPIRED]
    transitions:
      - from: RECEIVED
        to: AUTH_IN_PROGRESS
        trigger: POST /referral-orders/{orderId}/authorizations
        actor: Scheduler
        preconditions:
          - "order.status IN {RECEIVED, AUTH_DENIED, AUTHORIZED} (ERR_ORDER_NOT_AUTHORIZABLE_STATE)"
          - "window_end >= window_start (ERR_AUTH_WINDOW_INVALID)"
          - "OCC: expected_referral_order_version == order.version (ERR_STALE_VERSION)"
        side_effects:
          - "InsuranceAuthorization created with status SUBMITTED"
          - "Prior authorizations of this order in SUBMITTED or APPROVED -> SUPERSEDED"
          - "Increments ReferralOrder.version by 1"
      - from: AUTH_DENIED
        to: AUTH_IN_PROGRESS
        trigger: POST /referral-orders/{orderId}/authorizations
        actor: Scheduler
        preconditions: ["same as RECEIVED -> AUTH_IN_PROGRESS"]
        side_effects: ["same as RECEIVED -> AUTH_IN_PROGRESS"]
      - from: AUTHORIZED
        to: AUTH_IN_PROGRESS
        trigger: POST /referral-orders/{orderId}/authorizations
        actor: Scheduler
        preconditions: ["same as RECEIVED -> AUTH_IN_PROGRESS"]
        side_effects:
          - "same as RECEIVED -> AUTH_IN_PROGRESS (re-authorization supersedes the live APPROVED auth; already-scheduled studies are grandfathered)"
      - from: AUTH_IN_PROGRESS
        to: AUTHORIZED
        trigger: POST /authorizations/{authorizationId}/decision outcome=APPROVED
        actor: Scheduler
        preconditions:
          - "authorization.status == SUBMITTED (ERR_AUTH_NOT_PENDING)"
        side_effects:
          - "authorization.status -> APPROVED, decided_at = logical clock (this mutation triggers the order flip)"
          - "order.status -> AUTHORIZED"
      - from: AUTH_IN_PROGRESS
        to: AUTH_DENIED
        trigger: POST /authorizations/{authorizationId}/decision outcome=DENIED
        actor: Scheduler
        preconditions:
          - "authorization.status == SUBMITTED (ERR_AUTH_NOT_PENDING)"
        side_effects:
          - "authorization.status -> DENIED, decided_at = logical clock"
          - "order.status -> AUTH_DENIED"
      - from: AUTHORIZED
        to: SCHEDULED
        trigger: POST /sleep-studies
        actor: Scheduler
        preconditions: []
        side_effects: ["order.status -> SCHEDULED"]
      - from: SCHEDULED
        to: FULFILLED
        trigger: system (study complete-acquisition)
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: AUTHORIZED
        trigger: system (study cancelled / technical-failure / no-show with no_show_count < 2)
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: NEEDS_PROVIDER_REVIEW
        trigger: system (study no-show causing no_show_count to reach 2)
        actor: system
        preconditions: []
        side_effects: ["further scheduling blocked while in this state"]
      - from: NEEDS_PROVIDER_REVIEW
        to: AUTHORIZED
        trigger: POST /referral-orders/{orderId}/provider-review action=REINSTATE
        actor: Scheduler
        preconditions:
          - "order.status == NEEDS_PROVIDER_REVIEW (ERR_ORDER_NOT_REVIEWABLE)"
        side_effects: ["no_show_count -> 0"]
      - from: NEEDS_PROVIDER_REVIEW
        to: CANCELLED
        trigger: POST /referral-orders/{orderId}/provider-review action=CANCEL
        actor: Scheduler
        preconditions:
          - "order.status == NEEDS_PROVIDER_REVIEW (ERR_ORDER_NOT_REVIEWABLE)"
        side_effects: ["authorization in SUBMITTED/APPROVED -> WITHDRAWN"]
      - from: AUTHORIZED
        to: EXPIRED
        trigger: system (POST /_clock/set_current_utc advance makes current date > window_end of the APPROVED authorization)
        actor: system
        preconditions: ["authorization APPROVED and current clock date > authorization.window_end"]
        side_effects: ["authorization APPROVED -> EXPIRED"]
      - from: RECEIVED
        to: CANCELLED
        trigger: POST /referral-orders/{orderId}/cancel
        actor: Scheduler
        preconditions: ["no linked SleepStudy in IN_PROGRESS (ERR_ORDER_HAS_ACTIVE_STUDY)"]
        side_effects: ["authorization in SUBMITTED/APPROVED -> WITHDRAWN", "linked SleepStudy in SCHEDULED -> CANCELLED"]
      - from: AUTH_IN_PROGRESS
        to: CANCELLED
        trigger: POST /referral-orders/{orderId}/cancel
        actor: Scheduler
        preconditions: ["no linked SleepStudy in IN_PROGRESS (ERR_ORDER_HAS_ACTIVE_STUDY)"]
        side_effects: ["authorization in SUBMITTED/APPROVED -> WITHDRAWN"]
      - from: AUTH_DENIED
        to: CANCELLED
        trigger: POST /referral-orders/{orderId}/cancel
        actor: Scheduler
        preconditions: []
        side_effects: []
      - from: AUTHORIZED
        to: CANCELLED
        trigger: POST /referral-orders/{orderId}/cancel
        actor: Scheduler
        preconditions: ["no linked SleepStudy in IN_PROGRESS (ERR_ORDER_HAS_ACTIVE_STUDY)"]
        side_effects: ["authorization APPROVED -> WITHDRAWN"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: POST /referral-orders/{orderId}/cancel
        actor: Scheduler
        preconditions: ["no linked SleepStudy in IN_PROGRESS (ERR_ORDER_HAS_ACTIVE_STUDY)"]
        side_effects: ["authorization APPROVED -> WITHDRAWN", "linked SleepStudy in SCHEDULED -> CANCELLED"]

  - entity: InsuranceAuthorization
    initial_state: SUBMITTED
    terminal_states: [DENIED, SUPERSEDED, EXPIRED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: POST /authorizations/{authorizationId}/decision outcome=APPROVED
        actor: Scheduler
        preconditions: ["authorization.status == SUBMITTED (ERR_AUTH_NOT_PENDING)"]
        side_effects: ["decided_at = logical clock", "parent order AUTH_IN_PROGRESS -> AUTHORIZED"]
      - from: SUBMITTED
        to: DENIED
        trigger: POST /authorizations/{authorizationId}/decision outcome=DENIED
        actor: Scheduler
        preconditions: ["authorization.status == SUBMITTED (ERR_AUTH_NOT_PENDING)"]
        side_effects: ["decided_at = logical clock", "parent order AUTH_IN_PROGRESS -> AUTH_DENIED"]
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: system (a new authorization is created on the same order)
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: SUPERSEDED
        trigger: system (a new authorization is created on the same order)
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: EXPIRED
        trigger: system (clock advance past window_end while parent order is AUTHORIZED)
        actor: system
        preconditions: []
        side_effects: ["parent order AUTHORIZED -> EXPIRED"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: system (parent order cancelled)
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: WITHDRAWN
        trigger: system (parent order cancelled or provider-review CANCEL)
        actor: system
        preconditions: []
        side_effects: []

  - entity: StaffingAssignment
    initial_state: PLANNED
    terminal_states: [CANCELLED]
    transitions:
      - from: PLANNED
        to: CONFIRMED
        trigger: POST /staffing-assignments/{staffingAssignmentId}/confirm
        actor: SleepTechnologist
        preconditions:
          - "X-User-ID == assignment.technologist_id (ERR_STAFFING_NOT_OWN)"
          - "assignment.status == PLANNED (ERR_STAFFING_INVALID_STATE)"
        side_effects: ["confirmed_at = logical clock"]
      - from: PLANNED
        to: CANCELLED
        trigger: POST /staffing-assignments/{staffingAssignmentId}/cancel
        actor: LabDirector
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: POST /staffing-assignments/{staffingAssignmentId}/cancel
        actor: LabDirector
        preconditions:
          - "cancelling must not make scheduled in-lab studies for shift_date exceed the remaining CONFIRMED capacity (ERR_CAPACITY_WOULD_BE_VIOLATED)"
        side_effects: []

  - entity: SleepStudy
    initial_state: SCHEDULED
    terminal_states: [REPORT_FINALIZED, CANCELLED, NO_SHOW, TECHNICAL_FAILURE]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: POST /sleep-studies/{studyId}/check-in
        actor: SleepTechnologist
        preconditions:
          - "study.status == SCHEDULED (ERR_STUDY_NOT_IN_PROGRESS)"
          - "current logical-clock UTC date == scheduled_date (ERR_STUDY_NOT_TONIGHT)"
        side_effects: []
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: POST /sleep-studies/{studyId}/split-decision
        actor: SleepTechnologist
        preconditions:
          - "study.status == IN_PROGRESS (ERR_STUDY_NOT_IN_PROGRESS)"
          - "study_type == SPLIT_NIGHT (ERR_SPLIT_NOT_APPLICABLE)"
          - "split_outcome IS NULL (ERR_SPLIT_ALREADY_DECIDED)"
          - "intended_outcome == CONVERT_TO_TITRATION requires split_night_eligibility (safety before thresholds; see validations); intended_outcome == CONTINUE_DIAGNOSTIC skips the eligibility gate"
        side_effects:
          - "split_outcome <- intended_outcome; split_diagnostic_minutes and split_partial_ahi stored"
        note: "Self-loop records the protocol branch; decision is one-shot."
      - from: IN_PROGRESS
        to: SCORING_QUEUED
        trigger: POST /sleep-studies/{studyId}/complete-acquisition
        actor: SleepTechnologist
        preconditions:
          - "study.status == IN_PROGRESS (ERR_STUDY_NOT_IN_PROGRESS)"
          - "SPLIT_NIGHT requires split_outcome set (ERR_SPLIT_DECISION_REQUIRED)"
          - "TITRATION_PAP, or SPLIT_NIGHT with split_outcome == CONVERT_TO_TITRATION, require titration_final_pressure_cm and leak_95th_l_min (ERR_INVALID_REQUEST)"
          - "total_recording_time_minutes >= 60 (ERR_INVALID_REQUEST)"
        side_effects:
          - "acquisition_completed_at = logical clock"
          - "parent order SCHEDULED -> FULFILLED"
      - from: SCORING_QUEUED
        to: SCORING_IN_PROGRESS
        trigger: system (a PRIMARY ScoringTask transitions ASSIGNED/RETURNED_FOR_REVISION -> IN_PROGRESS)
        actor: system
        preconditions: []
        side_effects: []
      - from: SCORING_IN_PROGRESS
        to: SCORED
        trigger: system (the PRIMARY ScoringTask transitions SUBMITTED -> ACCEPTED)
        actor: system
        preconditions: []
        side_effects: ["accepted_ahi/accepted_rdi/accepted_rei snapshot from the accepted task per ahi_rdi_rei_computation"]
      - from: SCORED
        to: INTERPRETATION_IN_PROGRESS
        trigger: POST /interpretation-reports
        actor: InterpretingPhysician
        preconditions:
          - "a live report in {SIGNED, FINALIZED, ADDENDUM_OPEN} for this study -> ERR_FINAL_REPORT_EXISTS (checked first within state group)"
          - "study.status IN {SCORED, INTERPRETATION_IN_PROGRESS} (ERR_STUDY_NOT_SCORED)"
          - "OCC: expected_sleep_study_version == study.version (ERR_STALE_VERSION)"
        side_effects: ["increments SleepStudy.version by 1", "existing DRAFT report -> SUPERSEDED"]
      - from: INTERPRETATION_IN_PROGRESS
        to: INTERPRETATION_IN_PROGRESS
        trigger: POST /interpretation-reports (superseding create while a DRAFT report exists)
        actor: InterpretingPhysician
        preconditions: ["same as SCORED -> INTERPRETATION_IN_PROGRESS"]
        side_effects: ["increments SleepStudy.version by 1", "existing DRAFT report -> SUPERSEDED"]
        note: "Self-loop: study status unchanged on a superseding report creation."
      - from: INTERPRETATION_IN_PROGRESS
        to: INTERPRETED
        trigger: system (report DRAFT -> SIGNED)
        actor: system
        preconditions: []
        side_effects: []
      - from: INTERPRETED
        to: REPORT_FINALIZED
        trigger: system (report SIGNED -> FINALIZED)
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: NO_SHOW
        trigger: POST /sleep-studies/{studyId}/no-show
        actor: Scheduler | SleepTechnologist
        preconditions: ["study.status == SCHEDULED (ERR_STUDY_NOT_IN_PROGRESS)"]
        side_effects:
          - "order.no_show_count += 1"
          - "that counter mutation triggers: if no_show_count >= 2 then order SCHEDULED -> NEEDS_PROVIDER_REVIEW, else order SCHEDULED -> AUTHORIZED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: POST /sleep-studies/{studyId}/cancel
        actor: Scheduler
        preconditions: ["study.status == SCHEDULED (ERR_STUDY_NOT_IN_PROGRESS)"]
        side_effects: ["if order.status == SCHEDULED then order -> AUTHORIZED"]
      - from: IN_PROGRESS
        to: TECHNICAL_FAILURE
        trigger: POST /sleep-studies/{studyId}/technical-failure
        actor: SleepTechnologist
        preconditions: ["study.status == IN_PROGRESS (ERR_STUDY_NOT_IN_PROGRESS)"]
        side_effects: ["if order.status == SCHEDULED then order -> AUTHORIZED (reschedulable)"]

  - entity: ScoringTask
    initial_state: ASSIGNED
    terminal_states: [ACCEPTED, RECALLED]
    transitions:
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: POST /scoring-tasks/{scoringTaskId}/start
        actor: Scorer
        preconditions:
          - "X-User-ID == task.scorer_id (ERR_NOT_TASK_OWNER)"
          - "task.status IN {ASSIGNED, RETURNED_FOR_REVISION} (ERR_TASK_NOT_STARTABLE)"
        side_effects: ["if assignment_kind == PRIMARY: study SCORING_QUEUED -> SCORING_IN_PROGRESS"]
      - from: RETURNED_FOR_REVISION
        to: IN_PROGRESS
        trigger: POST /scoring-tasks/{scoringTaskId}/start
        actor: Scorer
        preconditions: ["same as ASSIGNED -> IN_PROGRESS"]
        side_effects: []
        note: "Revision loop: study already SCORING_IN_PROGRESS."
      - from: IN_PROGRESS
        to: SUBMITTED
        trigger: POST /scoring-tasks/{scoringTaskId}/submit
        actor: Scorer
        preconditions:
          - "X-User-ID == task.scorer_id (ERR_NOT_TASK_OWNER)"
          - "task.status == IN_PROGRESS (ERR_TASK_NOT_SUBMITTABLE)"
          - "event counts >= 0, epochs_total > 0; in-lab: total_sleep_time_minutes > 0 required; HST: total_sleep_time_minutes omitted and total_recording_time_minutes > 0 required (ERR_INVALID_REQUEST)"
        side_effects:
          - "ahi/rdi/rei computed per ahi_rdi_rei_computation"
          - "submitted_at = logical clock"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: POST /scoring-tasks/{scoringTaskId}/accept
        actor: InterpretingPhysician
        preconditions:
          - "task.status == SUBMITTED (ERR_TASK_NOT_SUBMITTED)"
          - "study state is consistent with the task kind (guaranteed reachable: a SUBMITTED PRIMARY implies study SCORING_IN_PROGRESS; a RELIABILITY_RESCORE exists only on SCORED-or-later studies)"
        side_effects:
          - "if assignment_kind == PRIMARY: study SCORING_IN_PROGRESS -> SCORED with index snapshots"
      - from: SUBMITTED
        to: RETURNED_FOR_REVISION
        trigger: POST /scoring-tasks/{scoringTaskId}/return
        actor: InterpretingPhysician
        preconditions:
          - "task.status == SUBMITTED (ERR_TASK_NOT_SUBMITTED)"
          - "reason length >= 10 characters (ERR_INSUFFICIENT_REASON)"
        side_effects: ["returned_reason stored"]
      - from: ASSIGNED
        to: RECALLED
        trigger: system (scorer enters REMEDIATION reliability_status)
        actor: system
        preconditions: []
        side_effects: ["if assignment_kind == PRIMARY: study SCORING_IN_PROGRESS -> SCORING_QUEUED"]
      - from: IN_PROGRESS
        to: RECALLED
        trigger: system (scorer enters REMEDIATION reliability_status)
        actor: system
        preconditions: []
        side_effects: ["if assignment_kind == PRIMARY: study SCORING_IN_PROGRESS -> SCORING_QUEUED"]
      - from: RETURNED_FOR_REVISION
        to: RECALLED
        trigger: system (scorer enters REMEDIATION reliability_status)
        actor: system
        preconditions: []
        side_effects: ["if assignment_kind == PRIMARY: study SCORING_IN_PROGRESS -> SCORING_QUEUED"]

  - entity: InterpretationReport
    initial_state: DRAFT
    terminal_states: [FINALIZED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: POST /interpretation-reports/{interpretationReportId}/sign
        actor: InterpretingPhysician
        preconditions:
          - "X-User-ID == report.physician_id (ERR_NOT_REPORT_AUTHOR)"
          - "report.status == DRAFT (ERR_REPORT_INVALID_STATE)"
          - "physician.npi != scorer.npi of the ACCEPTED PRIMARY task (ERR_SOD_REPORT_SCORER)"
        side_effects:
          - "signed_at = logical clock; severity and index_at_interpretation per severity_classification"
          - "turnaround_business_hours / turnaround_calendar_hours / sla_breached per interpretation_turnaround"
          - "study INTERPRETATION_IN_PROGRESS -> INTERPRETED"
      - from: SIGNED
        to: FINALIZED
        trigger: POST /interpretation-reports/{interpretationReportId}/finalize
        actor: InterpretingPhysician
        preconditions:
          - "X-User-ID == report.physician_id (ERR_NOT_REPORT_AUTHOR)"
          - "report.status == SIGNED (ERR_REPORT_INVALID_STATE)"
        side_effects: ["finalized_at = logical clock", "study INTERPRETED -> REPORT_FINALIZED"]
      - from: FINALIZED
        to: ADDENDUM_OPEN
        trigger: POST /interpretation-reports/{interpretationReportId}/open-addendum
        actor: InterpretingPhysician
        preconditions:
          - "X-User-ID == report.physician_id (ERR_NOT_REPORT_AUTHOR)"
          - "report.status == FINALIZED (ERR_REPORT_INVALID_STATE)"
        side_effects: ["addendum_count += 1"]
      - from: ADDENDUM_OPEN
        to: FINALIZED
        trigger: POST /interpretation-reports/{interpretationReportId}/close-addendum
        actor: InterpretingPhysician
        preconditions:
          - "X-User-ID == report.physician_id (ERR_NOT_REPORT_AUTHOR)"
          - "report.status == ADDENDUM_OPEN (ERR_REPORT_INVALID_STATE)"
        side_effects: []
      - from: DRAFT
        to: SUPERSEDED
        trigger: system (a new InterpretationReport is created for the same study)
        actor: system
        preconditions: []
        side_effects: []

  - entity: TherapyPrescription
    initial_state: DRAFT
    terminal_states: [FULFILLED, CANCELLED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ORDERED
        trigger: POST /therapy-prescriptions/{therapyPrescriptionId}/order
        actor: InterpretingPhysician
        preconditions:
          - "X-User-ID == author report.physician_id (ERR_NOT_REPORT_AUTHOR)"
          - "rx.status == DRAFT (ERR_RX_INVALID_STATE)"
        side_effects: ["ordered_at = logical clock"]
      - from: DRAFT
        to: CANCELLED
        trigger: POST /therapy-prescriptions/{therapyPrescriptionId}/cancel
        actor: InterpretingPhysician
        preconditions: ["X-User-ID == author report.physician_id (ERR_NOT_REPORT_AUTHOR)", "rx.status IN {DRAFT, ORDERED} (ERR_RX_INVALID_STATE)"]
        side_effects: ["linked DmeOrder in DISPATCHED -> CANCELLED"]
      - from: ORDERED
        to: CANCELLED
        trigger: POST /therapy-prescriptions/{therapyPrescriptionId}/cancel
        actor: InterpretingPhysician
        preconditions: ["same as DRAFT -> CANCELLED"]
        side_effects: ["linked DmeOrder in DISPATCHED -> CANCELLED"]
      - from: DRAFT
        to: SUPERSEDED
        trigger: system (a new TherapyPrescription is created on the same report)
        actor: system
        preconditions: []
        side_effects: ["linked DmeOrder in DISPATCHED -> CANCELLED"]
      - from: ORDERED
        to: SUPERSEDED
        trigger: system (a new TherapyPrescription is created on the same report)
        actor: system
        preconditions: []
        side_effects: ["linked DmeOrder in DISPATCHED -> CANCELLED"]
      - from: ORDERED
        to: FULFILLED
        trigger: system (linked DmeOrder DISPATCHED -> DELIVERED)
        actor: system
        preconditions: []
        side_effects: []

  - entity: DmeOrder
    initial_state: DISPATCHED
    terminal_states: [FOLLOW_UP_PASSED, FOLLOW_UP_RESOLVED, DECLINED, CANCELLED]
    transitions:
      - from: DISPATCHED
        to: DELIVERED
        trigger: POST /dme-orders/{dmeOrderId}/deliver
        actor: DmeCoordinator
        preconditions: ["dme.status == DISPATCHED (ERR_DME_INVALID_STATE)"]
        side_effects: ["delivered_at = logical clock", "prescription ORDERED -> FULFILLED"]
      - from: DISPATCHED
        to: DECLINED
        trigger: POST /dme-orders/{dmeOrderId}/decline
        actor: DmeCoordinator
        preconditions: ["dme.status == DISPATCHED (ERR_DME_INVALID_STATE)"]
        side_effects: []
      - from: DISPATCHED
        to: CANCELLED
        trigger: POST /dme-orders/{dmeOrderId}/cancel
        actor: DmeCoordinator
        preconditions: ["dme.status == DISPATCHED (ERR_DME_INVALID_STATE)"]
        side_effects: []
      - from: DELIVERED
        to: FOLLOW_UP_PASSED
        trigger: POST /dme-orders/{dmeOrderId}/record-follow-up (compliant)
        actor: DmeCoordinator
        preconditions: ["dme.status == DELIVERED (ERR_DME_INVALID_STATE)"]
        side_effects: ["adherence_compliant = true per dme_adherence_compliance"]
      - from: DELIVERED
        to: ADHERENCE_REVIEW
        trigger: POST /dme-orders/{dmeOrderId}/record-follow-up (non-compliant)
        actor: DmeCoordinator
        preconditions: ["dme.status == DELIVERED (ERR_DME_INVALID_STATE)"]
        side_effects: ["adherence_compliant = false per dme_adherence_compliance"]
      - from: ADHERENCE_REVIEW
        to: FOLLOW_UP_RESOLVED
        trigger: POST /dme-orders/{dmeOrderId}/resolve-adherence
        actor: DmeCoordinator
        preconditions: ["dme.status == ADHERENCE_REVIEW (ERR_DME_INVALID_STATE)"]
        side_effects: ["resolution_action stored"]

  - entity: InterRaterCase
    initial_state: OPEN
    terminal_states: [ADJUDICATED]
    transitions:
      - from: OPEN
        to: ADJUDICATED
        trigger: POST /inter-rater-cases/{interRaterCaseId}/adjudicate
        actor: LabDirector
        preconditions:
          - "case.status == OPEN (ERR_CASE_INVALID_STATE)"
          - "0 <= epochs_concordant <= rescore_task.epochs_total (ERR_INVALID_REQUEST)"
        side_effects:
          - "percent_agreement, ahi_primary, ahi_rescore, ahi_delta, concordant per inter_rater_agreement; adjudicated_at = logical clock"
          - "rescorer Scorer.consecutive_nonconcordant reset to 0 when concordant else += 1"
          - "that counter mutation triggers Scorer reliability recompute per inter_rater_agreement (rolling window over this scorer's last 5 adjudicated cases as rescorer; status PROVISIONAL/CONSISTENT/WATCH/REMEDIATION)"
          - "when the scorer ENTERS REMEDIATION: every ScoringTask of this scorer in ASSIGNED/IN_PROGRESS/RETURNED_FOR_REVISION -> RECALLED, and each recalled PRIMARY task's study SCORING_IN_PROGRESS -> SCORING_QUEUED"

# =============================================================================
# Table 2.1: Concurrency Rules (OCC only; see SKILL.md §1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: auth-submit-stale-order
    parent_entity: ReferralOrder
    write_endpoint: POST /referral-orders/{orderId}/authorizations
    occ_field: expected_referral_order_version
    description: |
      Creating an InsuranceAuthorization against a ReferralOrder whose version
      has advanced beyond expected_referral_order_version is rejected: another
      authorization may already have been created (which legitimately
      supersedes the prior one), so this client's view of the order is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: report-create-stale-study
    parent_entity: SleepStudy
    write_endpoint: POST /interpretation-reports
    occ_field: expected_sleep_study_version
    description: |
      Creating an InterpretationReport against a SleepStudy whose version has
      advanced beyond expected_sleep_study_version is rejected: a report
      created in the interim legitimately supersedes the prior DRAFT, so this
      client's view of the study is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: rx-create-stale-report
    parent_entity: InterpretationReport
    write_endpoint: POST /therapy-prescriptions
    occ_field: expected_interpretation_report_version
    description: |
      Creating a TherapyPrescription against an InterpretationReport whose
      version has advanced beyond expected_interpretation_report_version is
      rejected: a prescription created in the interim legitimately supersedes
      the prior active one, so this client's view of the report is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: ahi_rdi_rei_computation
    trigger: "ScoringTask submit; snapshot copied to SleepStudy on PRIMARY accept"
    algorithm: aggregation
    formula: |
      events = obstructive_apneas + central_apneas + mixed_apneas + hypopneas
      In-lab (PSG_DIAGNOSTIC | SPLIT_NIGHT | TITRATION_PAP):
        ahi = round_half_up(events * 60 / total_sleep_time_minutes, 1)
        rdi = round_half_up((events + reras) * 60 / total_sleep_time_minutes, 1)
        rei = null
      Home (HST):
        rei = round_half_up(events * 60 / total_recording_time_minutes, 1)
        ahi = null, rdi = null
    input_set: "The submitting ScoringTask's own event counts and time bases"
    precision: "1 decimal place, round_half_up (11.25 -> 11.3, never banker's rounding)"
    variants:
      - name: ahi_inlab
        when: "study_type in {PSG_DIAGNOSTIC, SPLIT_NIGHT, TITRATION_PAP}"
        difference: "Denominator is total_sleep_time_minutes (sleep-based index)"
      - name: rei_hst
        when: "study_type == HST"
        difference: "Denominator is total_recording_time_minutes (recording-based index); identical event counts yield a strictly smaller index when recording time exceeds sleep time"

  - name: severity_classification
    trigger: "InterpretationReport sign"
    algorithm: threshold
    formula: |
      idx = study.accepted_rei when study_type == HST else study.accepted_ahi
      index_at_interpretation = idx
      severity = NORMAL   when idx < 5.0
               = MILD     when 5.0 <= idx < 15.0
               = MODERATE when 15.0 <= idx < 30.0
               = SEVERE   when idx >= 30.0
      Boundaries are inclusive on the higher band (>= 15.0 is MODERATE).
    input_set: "The ACCEPTED PRIMARY ScoringTask snapshot on the study"
    constants:
      MILD_MIN: 5.0
      MODERATE_MIN: 15.0
      SEVERE_MIN: 30.0
    precision: "comparison against the 1-decimal index"

  - name: split_night_eligibility
    trigger: "POST /sleep-studies/{studyId}/split-decision on a SPLIT_NIGHT study"
    algorithm: threshold
    formula: |
      central exclusion: central_predominance_flag == true  -> reject (ERR_SPLIT_CENTRAL_PREDOMINANCE)
      minutes floor:     diagnostic_minutes_observed < 120  -> reject (ERR_SPLIT_MIN_DIAGNOSTIC_NOT_MET)
      ahi gate:          partial_ahi_observed >= 40.0       -> auto-eligible
                         20.0 <= partial_ahi_observed < 40.0 -> eligible ONLY when override_reason present (len >= 10)
                         partial_ahi_observed < 20.0        -> reject (ERR_SPLIT_AHI_THRESHOLD_NOT_MET)
      time budget:       remaining_minutes_available < 180  -> reject (ERR_SPLIT_INSUFFICIENT_REMAINING)
      eligible -> split_outcome = CONVERT_TO_TITRATION
      when 20.0 <= partial_ahi_observed < 40.0 and override_reason is absent -> reject (ERR_SPLIT_AHI_THRESHOLD_NOT_MET)
      intended_outcome == CONTINUE_DIAGNOSTIC -> record split_outcome = CONTINUE_DIAGNOSTIC with no
      eligibility gate (the four threshold inputs are still stored)
      Note: partial_ahi_observed in [20,40) WITH a valid override still requires minutes floor and time budget to pass.
      All four inputs interact: the same partial_ahi yields different outcomes depending on minutes, remaining time, and flags.
    input_set: "The split-decision request payload on an IN_PROGRESS SPLIT_NIGHT study"
    constants:
      MIN_DIAG_MINUTES: 120
      AHI_AUTO_THRESHOLD: 40.0
      AHI_OVERRIDE_THRESHOLD: 20.0
      MIN_TITRATION_MINUTES: 180
    precision: "exact integer/1-decimal comparisons; >= inclusive"

  - name: titration_pressure_recommendation
    trigger: "GET /sleep-studies/{studyId}/titration-recommendation"
    algorithm: constraint_propagation
    formula: |
      Preconditions: study_type TITRATION_PAP, or SPLIT_NIGHT with split_outcome == CONVERT_TO_TITRATION;
      a PRIMARY ScoringTask ACCEPTED exists; else ERR_TITRATION_RECOMMENDATION_UNAVAILABLE.
      raw = study.titration_final_pressure_cm
      residual_ahi = study.accepted_ahi
      ahi_adjustment = 1.0 when residual_ahi >= 10.0
                     = 0.5 when 5.0 <= residual_ahi < 10.0
                     = 0.0 when residual_ahi < 5.0
      band = LOW when raw <= 10.0 else HIGH            # band is computed from RAW only
      leak_adjustment = (LOW  band and study.leak_95th_l_min > 24.0) -> 0.5
                        (HIGH band and study.leak_95th_l_min > 36.0) -> 1.0
                        otherwise -> 0.0
      pinned evaluation order: raw -> band(raw) -> ahi_adjustment + leak_adjustment -> sum -> clamp -> round
      recommended = clamp(raw + ahi_adjustment + leak_adjustment, 4.0, 20.0)
      recommended_cpap_cm = round to nearest 0.5, round_half_up (e.g. 11.26 -> 11.5, 11.24 -> 11.0)
      The band MUST NOT be recomputed after adjustment (circular-looking dependency pinned).
    input_set: "The study's titration_final_pressure_cm, leak_95th_l_min, and accepted_ahi"
    constants:
      PRESSURE_MIN: 4.0
      PRESSURE_MAX: 20.0
      LOW_BAND_MAX: 10.0
      LEAK_THRESHOLD_LOW: 24.0
      LEAK_THRESHOLD_HIGH: 36.0
    precision: "0.5 cm H2O steps, round_half_up"

  - name: inter_rater_agreement
    trigger: "POST /inter-rater-cases/{interRaterCaseId}/adjudicate"
    algorithm: weighted_scoring
    formula: |
      Per case (stored on InterRaterCase at adjudication):
        idx_primary = primary_task.rei when study HST else primary_task.ahi
        idx_rescore = rescore_task.rei when study HST else rescore_task.ahi
        ahi_delta = round_half_up(|idx_primary - idx_rescore|, 2)
        percent_agreement = round_half_up(epochs_concordant * 100 / rescore_task.epochs_total, 2)
        concordant = (ahi_delta <= 2.0) AND (percent_agreement >= 85.0)
      Rescorer counters:
        concordant -> consecutive_nonconcordant = 0; else += 1
      Rolling index (over this scorer's ADJUDICATED cases AS RESCORER,
      ordered adjudicated_at ASC with tie-break created_at ASC, last 5):
        PINNED ROUNDING ORDER: rolling_agreement_index =
          round_half_up(mean of the per-case percent_agreement values AS STORED
          (each already rounded to 2 decimals), 2)
        (Averaging raw unrounded ratios instead is the forbidden alternative order.)
        null when fewer than 3 adjudicated cases.
      Status recompute after each adjudication:
        REMEDIATION when consecutive_nonconcordant >= 2 (regardless of case count)
                    OR (case count >= 3 AND rolling_agreement_index < 80.0)
        CONSISTENT  when case count >= 3 AND rolling_agreement_index >= 90.0
                    AND consecutive_nonconcordant < 2
        WATCH       when case count >= 3 AND 80.0 <= rolling_agreement_index < 90.0
                    AND consecutive_nonconcordant < 2
        PROVISIONAL otherwise (fewer than 3 adjudicated cases and consecutive < 2)
      Entering REMEDIATION fires the recall cascade on the ScoringTask machine.
    input_set: "The two referenced ACCEPTED ScoringTasks and the rescorer's adjudicated InterRaterCase history"
    constants:
      CONCORDANCE_DELTA_MAX: 2.0
      CONCORDANCE_AGREEMENT_MIN: 85.0
      ROLLING_WINDOW: 5
      MIN_CASES_FOR_STATUS: 3
      CONSISTENT_MIN: 90.0
      WATCH_MIN: 80.0
      REMEDIATION_CONSECUTIVE: 2
    precision: "2 decimals, round_half_up, applied per-case BEFORE the rolling mean (pinned order)"

  - name: interpretation_turnaround
    trigger: "InterpretationReport sign"
    algorithm: chronological
    formula: |
      start = study.acquisition_completed_at, end = report.signed_at (logical clock, UTC)
      calendar variant:
        turnaround_calendar_hours = round_half_up((end - start) in whole minutes / 60, 1)
      business variant (lab business window: Monday-Friday 08:00:00Z-17:00:00Z UTC;
      Saturdays and Sundays contribute zero):
        accumulate the intersection of [start, end] with each weekday's [08:00, 17:00]
        in whole minutes; turnaround_business_hours = round_half_up(minutes / 60, 1)
      sla_breached (order.priority == ROUTINE): turnaround_business_hours > 48.0
      sla_breached (order.priority == STAT):    turnaround_calendar_hours > 24.0
      Boundary: exactly 48.0 business (ROUTINE) or exactly 24.0 calendar (STAT) is NOT a breach.
    input_set: "study.acquisition_completed_at, report.signed_at, order.priority"
    constants:
      ROUTINE_SLA_BUSINESS_HOURS: 48.0
      STAT_SLA_CALENDAR_HOURS: 24.0
      BUSINESS_DAY_START: "08:00:00Z"
      BUSINESS_DAY_END: "17:00:00Z"
    precision: "1 decimal, round_half_up on whole-minute totals"
    variants:
      - name: calendar_hours
        when: "order.priority == STAT breach verdict; always computed and stored"
        difference: "Counts every wall-clock hour including nights and weekends"
      - name: business_hours
        when: "order.priority == ROUTINE breach verdict; always computed and stored"
        difference: "Counts only weekday 08:00-17:00 UTC hours; the same interval spanning a weekend yields a far smaller value than the calendar variant"

  - name: night_staffing_capacity
    trigger: "POST /sleep-studies (in-lab types); POST /staffing-assignments/{id}/cancel from CONFIRMED"
    algorithm: aggregation
    formula: |
      capacity(date) = sum of patient_capacity over StaffingAssignment
                       with shift_date == date AND status == CONFIRMED
      occupied(date) = count of SleepStudy with scheduled_date == date,
                       bed_id IS NOT NULL, status IN {SCHEDULED, IN_PROGRESS}
      Schedule check:  occupied(scheduled_date) + 1 <= capacity(scheduled_date)
      Cancel check (CONFIRMED assignment with capacity c on date):
                       occupied(date) <= capacity(date) - c
    input_set: "StaffingAssignment rows for the date; non-terminal in-lab SleepStudy rows for the date"
    precision: "integer comparison; boundary inclusive (occupied == capacity is full)"

  - name: dme_adherence_compliance
    trigger: "POST /dme-orders/{dmeOrderId}/record-follow-up"
    algorithm: threshold
    formula: |
      adherence_compliant = (usage_hours_avg >= 4.0) AND (follow_up_compliant_nights_percent >= 70.0)
      compliant  -> DmeOrder FOLLOW_UP_PASSED
      otherwise  -> ADHERENCE_REVIEW
      Boundaries are inclusive: exactly 4.0 hours and exactly 70.0 percent pass.
    input_set: "record-follow-up payload on a DELIVERED DmeOrder"
    constants:
      MIN_USAGE_HOURS: 4.0
      MIN_COMPLIANT_NIGHTS_PERCENT: 70.0
    precision: "1-decimal inputs compared exactly"

  - name: auth_nights_consumption
    trigger: "POST /sleep-studies"
    algorithm: aggregation
    formula: |
      consumed(order) = count of SleepStudy with order_id == order.id
                        AND status IN {SCHEDULED, IN_PROGRESS, SCORING_QUEUED,
                        SCORING_IN_PROGRESS, SCORED, INTERPRETATION_IN_PROGRESS,
                        INTERPRETED, REPORT_FINALIZED}
      (NO_SHOW, CANCELLED, TECHNICAL_FAILURE do not consume a night.)
      Scheduling requires consumed(order) < approved_nights of the order's APPROVED
      authorization (ERR_AUTH_NIGHTS_EXHAUSTED).
    input_set: "Non-terminal-plus-completed studies of the order; the APPROVED authorization"
    precision: "integer comparison"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path and body-referenced ids exist, validated left-to-right (path first, then body FKs in declaration order)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints
  - priority: 4
    category: business_constraint
    check: "Request shape: required fields present, enum members valid, numeric ranges and steps valid (approved_nights 1..2; patient_capacity 1..4; total_recording_time_minutes >= 60; device-specific prescription fields per device_type; window_end >= window_start; mrn unique; return reason >= 10 chars)"
    error_id: ERR_INVALID_REQUEST / ERR_RX_DEVICE_FIELDS_INVALID / ERR_AUTH_WINDOW_INVALID / ERR_DUPLICATE_MRN / ERR_INSUFFICIENT_REASON
    http_status: 400
    applies_to: all mutation endpoints
  - priority: 5
    category: auth
    check: "Ownership: X-User-ID equals task.scorer_id (start/submit), report.physician_id (sign/finalize/addenda/rx actions), assignment.technologist_id (confirm)"
    error_id: ERR_NOT_TASK_OWNER / ERR_NOT_REPORT_AUTHOR / ERR_STAFFING_NOT_OWN
    http_status: 403
    applies_to: ownership-guarded endpoints
  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version equals the parent's current version (checked before state preconditions)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /referral-orders/{orderId}/authorizations, POST /interpretation-reports, POST /therapy-prescriptions"
  - priority: 7
    category: state
    check: "Entity state preconditions per §1.2 machines (order authorizable/reviewable, auth pending, staffing planned, study in correct phase, split applicable/undecided/required, task startable/submittable/submitted, report signable, rx orderable, dme actionable, case open, scorer reinstatable)"
    error_id: ERR_ORDER_NOT_AUTHORIZABLE_STATE / ERR_AUTH_NOT_PENDING / ERR_ORDER_NOT_REVIEWABLE / ERR_STAFFING_INVALID_STATE / ERR_STUDY_NOT_IN_PROGRESS / ERR_SPLIT_NOT_APPLICABLE / ERR_SPLIT_ALREADY_DECIDED / ERR_SPLIT_DECISION_REQUIRED / ERR_STUDY_NOT_SCORABLE / ERR_TASK_NOT_STARTABLE / ERR_TASK_NOT_SUBMITTABLE / ERR_TASK_NOT_SUBMITTED / ERR_TASK_TERMINAL (terminal ACCEPTED/RECALLED fires this ahead of the specific guards) / ERR_STUDY_NOT_SCORED / ERR_REPORT_INVALID_STATE / ERR_RX_INVALID_STATE / ERR_DME_INVALID_STATE / ERR_CASE_INVALID_STATE / ERR_SCORER_NOT_REMEDIATION / ERR_ORDER_NOT_AUTHORIZED
    http_status: 409
    applies_to: state-machine endpoints
  - priority: 8
    category: business_safety
    check: "Clinical safety and segregation of duties: split central-predominance exclusion; reliability rescorer != primary scorer; report signer npi != primary scorer npi"
    error_id: ERR_SPLIT_CENTRAL_PREDOMINANCE / ERR_SOD_PRIMARY_SCORER / ERR_SOD_REPORT_SCORER
    http_status: 422
    applies_to: "POST /sleep-studies/{id}/split-decision, POST /scoring-tasks (RELIABILITY_RESCORE), POST /interpretation-reports/{id}/sign"
  - priority: 9
    category: business_referential
    check: "Referential coherence: order.patient_id == study patient_id; study_type == order.requested_study_type; bed required for in-lab / forbidden for HST; bed active; bed titration_capable for TITRATION_PAP and SPLIT_NIGHT; scorer active and pool membership for rescores; task belongs to study; case tasks reference same study with correct kinds; report.primary_scoring_task_id is the ACCEPTED PRIMARY of the study"
    error_id: ERR_STUDY_TYPE_MISMATCH / ERR_BED_REQUIRED_FOR_IN_LAB / ERR_BED_NOT_ALLOWED_FOR_HST / ERR_BED_INACTIVE / ERR_BED_NOT_TITRATION_CAPABLE / ERR_SCORER_NOT_IN_POOL / ERR_SCORER_IN_REMEDIATION / ERR_INVALID_PRIMARY_TASK / ERR_CASE_TASKS_INVALID / ERR_THERAPY_NOT_INDICATED
    http_status: 422
    applies_to: creation endpoints and case adjudication
  - priority: 10
    category: business_temporal
    check: "Temporal windows: scheduled_date within APPROVED authorization [window_start, window_end] inclusive; check-in date == scheduled_date per logical clock"
    error_id: ERR_AUTH_WINDOW_VIOLATION / ERR_STUDY_NOT_TONIGHT
    http_status: 422
    applies_to: "POST /sleep-studies, POST /sleep-studies/{id}/check-in"
  - priority: 11
    category: business_constraint
    check: "Resource conflicts and uniqueness: bed-night pairwise exclusion (same bed_id + scheduled_date with status IN {SCHEDULED, IN_PROGRESS}); one non-CANCELLED StaffingAssignment per (technologist_id, shift_date); one non-terminal PRIMARY ScoringTask per study; one non-terminal DmeOrder per prescription; one InterRaterCase per rescore_task_id"
    error_id: ERR_BED_NIGHT_CONFLICT / ERR_TECH_DOUBLE_BOOKED / ERR_PRIMARY_TASK_EXISTS / ERR_DME_ORDER_ACTIVE / ERR_CASE_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /sleep-studies, POST /staffing-assignments, POST /scoring-tasks, POST /dme-orders, POST /inter-rater-cases"
  - priority: 12
    category: business_constraint
    check: "Aggregate capacity: occupied(scheduled_date) + 1 <= confirmed capacity per night_staffing_capacity; CONFIRMED staffing cancel capacity guard"
    error_id: ERR_CAPACITY_EXCEEDED / ERR_CAPACITY_WOULD_BE_VIOLATED
    http_status: 422
    applies_to: "POST /sleep-studies (in-lab), POST /staffing-assignments/{id}/cancel"
  - priority: 13
    category: business_fiscal
    check: "Authorized-nights quota: consumed(order) < approved_nights per auth_nights_consumption"
    error_id: ERR_AUTH_NIGHTS_EXHAUSTED
    http_status: 422
    applies_to: POST /sleep-studies

# =============================================================================
# Table 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Patients / Orders / Authorizations ---
  - { method: POST, path: "/patients", description: "Register a patient", roles: [Scheduler], code: 201, input: [mrn, full_name, date_of_birth], output: Patient, side_effects: [] }
  - { method: GET, path: "/patients/{patientId}", description: "Get a patient", roles: [Scheduler, SleepTechnologist, Scorer, InterpretingPhysician, DmeCoordinator, LabDirector], code: 200, input: [], output: Patient, side_effects: [] }
  - { method: POST, path: "/referral-orders", description: "Create a referral order for a patient", roles: [Scheduler], code: 201, input: [patient_id, ordering_provider_name, requested_study_type, icd10_primary, "priority?"], output: ReferralOrder, side_effects: ["status RECEIVED"] }
  - { method: GET, path: "/referral-orders", description: "List referral orders (filtered)", roles: [Scheduler, SleepTechnologist, Scorer, InterpretingPhysician, DmeCoordinator, LabDirector], code: 200, input: ["patient_id?", "status?"], output: "ReferralOrder[]", side_effects: [] }
  - { method: GET, path: "/referral-orders/{orderId}", description: "Get a referral order", roles: [Scheduler, SleepTechnologist, Scorer, InterpretingPhysician, DmeCoordinator, LabDirector], code: 200, input: [], output: ReferralOrder, side_effects: [] }
  - { method: POST, path: "/referral-orders/{orderId}/authorizations", description: "Submit an insurance authorization (supersedes any live SUBMITTED/APPROVED auth); OCC on order version", roles: [Scheduler], code: 201, input: [payer_name, authorization_number, approved_nights, window_start, window_end, expected_referral_order_version], output: InsuranceAuthorization, side_effects: ["auth SUBMITTED", "order -> AUTH_IN_PROGRESS", "increments ReferralOrder.version by 1", "prior SUBMITTED/APPROVED auths -> SUPERSEDED"] }
  - { method: GET, path: "/authorizations", description: "List authorizations (filtered)", roles: [Scheduler, SleepTechnologist, Scorer, InterpretingPhysician, DmeCoordinator, LabDirector], code: 200, input: ["order_id?", "status?"], output: "InsuranceAuthorization[]", side_effects: [] }
  - { method: GET, path: "/authorizations/{authorizationId}", description: "Get an authorization", roles: [Scheduler, SleepTechnologist, Scorer, InterpretingPhysician, DmeCoordinator, LabDirector], code: 200, input: [], output: InsuranceAuthorization, side_effects: [] }
  - { method: POST, path: "/authorizations/{authorizationId}/decision", description: "Record payer decision on a SUBMITTED authorization", roles: [Scheduler], code: 200, input: [outcome], output: InsuranceAuthorization, side_effects: ["auth APPROVED|DENIED", "order -> AUTHORIZED|AUTH_DENIED"] }
  - { method: POST, path: "/referral-orders/{orderId}/provider-review", description: "Resolve a NEEDS_PROVIDER_REVIEW order", roles: [Scheduler], code: 200, input: [action], output: ReferralOrder, side_effects: ["REINSTATE -> AUTHORIZED and no_show_count 0; CANCEL -> CANCELLED and live auth WITHDRAWN"] }
  - { method: POST, path: "/referral-orders/{orderId}/cancel", description: "Cancel a non-terminal order", roles: [Scheduler], code: 200, input: [], output: ReferralOrder, side_effects: ["order CANCELLED", "live auth WITHDRAWN", "SCHEDULED studies CANCELLED"] }

  # --- Beds / Staff / Staffing ---
  - { method: POST, path: "/beds", description: "Register a lab bed", roles: [LabDirector], code: 201, input: [room_label, "titration_capable?"], output: Bed, side_effects: [] }
  - { method: POST, path: "/technologists", description: "Register a technologist", roles: [LabDirector], code: 201, input: [full_name, credential], output: Technologist, side_effects: [] }
  - { method: POST, path: "/scorers", description: "Register a scorer", roles: [LabDirector], code: 201, input: [full_name, credential, npi, "reliability_pool?"], output: Scorer, side_effects: ["reliability_status PROVISIONAL"] }
  - { method: GET, path: "/scorers/{scorerId}", description: "Get a scorer (reliability telemetry)", roles: [Scheduler, SleepTechnologist, Scorer, InterpretingPhysician, DmeCoordinator, LabDirector], code: 200, input: [], output: Scorer, side_effects: [] }
  - { method: POST, path: "/scorers/{scorerId}/reinstate", description: "Reinstate a REMEDIATION scorer to PROVISIONAL and reset counters", roles: [LabDirector], code: 200, input: [], output: Scorer, side_effects: ["reliability_status PROVISIONAL", "consecutive_nonconcordant 0"] }
  - { method: POST, path: "/physicians", description: "Register an interpreting physician", roles: [LabDirector], code: 201, input: [full_name, npi, "board_certified?"], output: Physician, side_effects: [] }
  - { method: POST, path: "/staffing-assignments", description: "Plan a technologist night shift", roles: [LabDirector], code: 201, input: [technologist_id, shift_date, "patient_capacity?"], output: StaffingAssignment, side_effects: ["status PLANNED"] }
  - { method: GET, path: "/staffing-assignments", description: "List staffing assignments (filtered)", roles: [Scheduler, SleepTechnologist, Scorer, InterpretingPhysician, DmeCoordinator, LabDirector], code: 200, input: ["technologist_id?", "shift_date?", "status?"], output: "StaffingAssignment[]", side_effects: [] }
  - { method: GET, path: "/staffing-assignments/{staffingAssignmentId}", description: "Get a staffing assignment", roles: [Scheduler, SleepTechnologist, Scorer, InterpretingPhysician, DmeCoordinator, LabDirector], code: 200, input: [], output: StaffingAssignment, side_effects: [] }
  - { method: POST, path: "/staffing-assignments/{staffingAssignmentId}/confirm", description: "Assigned technologist confirms the shift", roles: [SleepTechnologist], code: 200, input: [], output: StaffingAssignment, side_effects: ["status CONFIRMED"] }
  - { method: POST, path: "/staffing-assignments/{staffingAssignmentId}/cancel", description: "Cancel a staffing assignment (capacity-guarded)", roles: [LabDirector], code: 200, input: [], output: StaffingAssignment, side_effects: ["status CANCELLED"] }

  # --- Sleep Studies ---
  - { method: POST, path: "/sleep-studies", description: "Schedule a study against an AUTHORIZED order", roles: [Scheduler], code: 201, input: [patient_id, order_id, study_type, scheduled_date, "bed_id?"], output: SleepStudy, side_effects: ["status SCHEDULED", "order AUTHORIZED -> SCHEDULED"] }
  - { method: GET, path: "/sleep-studies", description: "List sleep studies (filtered)", roles: [Scheduler, SleepTechnologist, Scorer, InterpretingPhysician, DmeCoordinator, LabDirector], code: 200, input: ["patient_id?", "order_id?", "bed_id?", "status?", "scheduled_date?"], output: "SleepStudy[]", side_effects: [] }
  - { method: GET, path: "/sleep-studies/{studyId}", description: "Get a sleep study", roles: [Scheduler, SleepTechnologist, Scorer, InterpretingPhysician, DmeCoordinator, LabDirector], code: 200, input: [], output: SleepStudy, side_effects: [] }
  - { method: POST, path: "/sleep-studies/{studyId}/check-in", description: "Check the patient in on the scheduled night", roles: [SleepTechnologist], code: 200, input: [], output: SleepStudy, side_effects: ["status IN_PROGRESS"] }
  - { method: POST, path: "/sleep-studies/{studyId}/split-decision", description: "Record the split-night protocol decision (one-shot self-loop). intended_outcome CONTINUE_DIAGNOSTIC records the branch without eligibility checks; CONVERT_TO_TITRATION runs the full split_night_eligibility gate.", roles: [SleepTechnologist], code: 200, input: [intended_outcome, diagnostic_minutes_observed, partial_ahi_observed, central_predominance_flag, remaining_minutes_available, "override_reason?"], output: SleepStudy, side_effects: ["split_outcome stored"] }
  - { method: POST, path: "/sleep-studies/{studyId}/complete-acquisition", description: "Complete acquisition; study enters SCORING_QUEUED and the order is fulfilled", roles: [SleepTechnologist], code: 200, input: [total_recording_time_minutes, "titration_final_pressure_cm?", "leak_95th_l_min?"], output: SleepStudy, side_effects: ["status SCORING_QUEUED", "acquisition_completed_at set", "order SCHEDULED -> FULFILLED"] }
  - { method: POST, path: "/sleep-studies/{studyId}/no-show", description: "Mark a scheduled study as no-show", roles: [Scheduler, SleepTechnologist], code: 200, input: [], output: SleepStudy, side_effects: ["status NO_SHOW", "order.no_show_count += 1 with threshold cascade"] }
  - { method: POST, path: "/sleep-studies/{studyId}/cancel", description: "Cancel a scheduled study", roles: [Scheduler], code: 200, input: [], output: SleepStudy, side_effects: ["status CANCELLED", "order SCHEDULED -> AUTHORIZED"] }
  - { method: POST, path: "/sleep-studies/{studyId}/technical-failure", description: "Fail an in-progress study for technical reasons", roles: [SleepTechnologist], code: 200, input: [], output: SleepStudy, side_effects: ["status TECHNICAL_FAILURE", "order SCHEDULED -> AUTHORIZED"] }
  - { method: GET, path: "/sleep-studies/{studyId}/titration-recommendation", description: "Computed CPAP pressure recommendation for titration studies per titration_pressure_recommendation", roles: [InterpretingPhysician], code: 200, input: [], output: { recommended_cpap_cm: number, raw_pressure_cm: number, residual_ahi: number, leak_95th_l_min: number }, side_effects: [] }

  # --- Scoring ---
  - { method: POST, path: "/scoring-tasks", description: "Assign a scoring task (PRIMARY or RELIABILITY_RESCORE)", roles: [LabDirector], code: 201, input: [study_id, scorer_id, assignment_kind], output: ScoringTask, side_effects: ["status ASSIGNED"] }
  - { method: GET, path: "/scoring-tasks", description: "List scoring tasks (filtered)", roles: [Scheduler, SleepTechnologist, Scorer, InterpretingPhysician, DmeCoordinator, LabDirector], code: 200, input: ["study_id?", "scorer_id?", "status?"], output: "ScoringTask[]", side_effects: [] }
  - { method: GET, path: "/scoring-tasks/{scoringTaskId}", description: "Get a scoring task", roles: [Scheduler, SleepTechnologist, Scorer, InterpretingPhysician, DmeCoordinator, LabDirector], code: 200, input: [], output: ScoringTask, side_effects: [] }
  - { method: POST, path: "/scoring-tasks/{scoringTaskId}/start", description: "Scorer starts (or resumes after return) a task", roles: [Scorer], code: 200, input: [], output: ScoringTask, side_effects: ["status IN_PROGRESS", "PRIMARY: study -> SCORING_IN_PROGRESS"] }
  - { method: POST, path: "/scoring-tasks/{scoringTaskId}/submit", description: "Scorer submits epoch-level counts; indexes computed", roles: [Scorer], code: 200, input: [obstructive_apneas, central_apneas, mixed_apneas, hypopneas, reras, epochs_total, "total_sleep_time_minutes?", "total_recording_time_minutes?"], output: ScoringTask, side_effects: ["status SUBMITTED", "ahi/rdi/rei computed"] }
  - { method: POST, path: "/scoring-tasks/{scoringTaskId}/accept", description: "Physician accepts a submitted task", roles: [InterpretingPhysician], code: 200, input: [], output: ScoringTask, side_effects: ["status ACCEPTED", "PRIMARY: study -> SCORED with index snapshots"] }
  - { method: POST, path: "/scoring-tasks/{scoringTaskId}/return", description: "Physician returns a submitted task for revision", roles: [InterpretingPhysician], code: 200, input: [reason], output: ScoringTask, side_effects: ["status RETURNED_FOR_REVISION"] }

  # --- Interpretation ---
  - { method: POST, path: "/interpretation-reports", description: "Create a report draft for a SCORED study (supersedes existing DRAFT); OCC on study version", roles: [InterpretingPhysician], code: 201, input: [study_id, primary_scoring_task_id, diagnosis_code, expected_sleep_study_version], output: InterpretationReport, side_effects: ["status DRAFT", "study SCORED -> INTERPRETATION_IN_PROGRESS", "increments SleepStudy.version by 1", "existing DRAFT report -> SUPERSEDED"] }
  - { method: GET, path: "/interpretation-reports", description: "List reports (filtered)", roles: [Scheduler, SleepTechnologist, Scorer, InterpretingPhysician, DmeCoordinator, LabDirector], code: 200, input: ["study_id?", "physician_id?", "primary_scoring_task_id?"], output: "InterpretationReport[]", side_effects: [] }
  - { method: GET, path: "/interpretation-reports/{interpretationReportId}", description: "Get a report", roles: [Scheduler, SleepTechnologist, Scorer, InterpretingPhysician, DmeCoordinator, LabDirector], code: 200, input: [], output: InterpretationReport, side_effects: [] }
  - { method: POST, path: "/interpretation-reports/{interpretationReportId}/sign", description: "Author signs the report; severity, turnaround and SLA computed", roles: [InterpretingPhysician], code: 200, input: [], output: InterpretationReport, side_effects: ["status SIGNED", "study -> INTERPRETED"] }
  - { method: POST, path: "/interpretation-reports/{interpretationReportId}/finalize", description: "Author finalizes a signed report", roles: [InterpretingPhysician], code: 200, input: [], output: InterpretationReport, side_effects: ["status FINALIZED", "study -> REPORT_FINALIZED"] }
  - { method: POST, path: "/interpretation-reports/{interpretationReportId}/open-addendum", description: "Author opens an addendum on a finalized report", roles: [InterpretingPhysician], code: 200, input: [], output: InterpretationReport, side_effects: ["status ADDENDUM_OPEN", "addendum_count += 1"] }
  - { method: POST, path: "/interpretation-reports/{interpretationReportId}/close-addendum", description: "Author closes the addendum", roles: [InterpretingPhysician], code: 200, input: [], output: InterpretationReport, side_effects: ["status FINALIZED"] }

  # --- Therapy prescriptions / DME ---
  - { method: POST, path: "/therapy-prescriptions", description: "Create a therapy prescription on a SIGNED/FINALIZED report (supersedes active rx); OCC on report version", roles: [InterpretingPhysician], code: 201, input: [report_id, device_type, mask_type, "cpap_pressure_cm?", "apap_min_cm?", "apap_max_cm?", "bipap_ipap_cm?", "bipap_epap_cm?", "humidification?", expected_interpretation_report_version], output: TherapyPrescription, side_effects: ["status DRAFT", "increments InterpretationReport.version by 1", "existing DRAFT/ORDERED rx -> SUPERSEDED"] }
  - { method: GET, path: "/therapy-prescriptions", description: "List prescriptions (filtered)", roles: [Scheduler, SleepTechnologist, Scorer, InterpretingPhysician, DmeCoordinator, LabDirector], code: 200, input: ["report_id?", "study_id?"], output: "TherapyPrescription[]", side_effects: [] }
  - { method: GET, path: "/therapy-prescriptions/{therapyPrescriptionId}", description: "Get a prescription", roles: [Scheduler, SleepTechnologist, Scorer, InterpretingPhysician, DmeCoordinator, LabDirector], code: 200, input: [], output: TherapyPrescription, side_effects: [] }
  - { method: POST, path: "/therapy-prescriptions/{therapyPrescriptionId}/order", description: "Author orders the prescription", roles: [InterpretingPhysician], code: 200, input: [], output: TherapyPrescription, side_effects: ["status ORDERED"] }
  - { method: POST, path: "/therapy-prescriptions/{therapyPrescriptionId}/cancel", description: "Author cancels the prescription", roles: [InterpretingPhysician], code: 200, input: [], output: TherapyPrescription, side_effects: ["status CANCELLED", "DISPATCHED DmeOrder -> CANCELLED"] }
  - { method: POST, path: "/dme-orders", description: "Dispatch a DME order for an ORDERED prescription", roles: [DmeCoordinator], code: 201, input: [prescription_id, vendor_name], output: DmeOrder, side_effects: ["status DISPATCHED", "dispatched_at set"] }
  - { method: GET, path: "/dme-orders", description: "List DME orders (filtered)", roles: [Scheduler, SleepTechnologist, Scorer, InterpretingPhysician, DmeCoordinator, LabDirector], code: 200, input: ["prescription_id?", "status?"], output: "DmeOrder[]", side_effects: [] }
  - { method: GET, path: "/dme-orders/{dmeOrderId}", description: "Get a DME order", roles: [Scheduler, SleepTechnologist, Scorer, InterpretingPhysician, DmeCoordinator, LabDirector], code: 200, input: [], output: DmeOrder, side_effects: [] }
  - { method: POST, path: "/dme-orders/{dmeOrderId}/deliver", description: "Vendor delivered and set up the device", roles: [DmeCoordinator], code: 200, input: [], output: DmeOrder, side_effects: ["status DELIVERED", "prescription ORDERED -> FULFILLED"] }
  - { method: POST, path: "/dme-orders/{dmeOrderId}/decline", description: "Vendor declines the order", roles: [DmeCoordinator], code: 200, input: [], output: DmeOrder, side_effects: ["status DECLINED"] }
  - { method: POST, path: "/dme-orders/{dmeOrderId}/cancel", description: "Coordinator cancels a dispatched order", roles: [DmeCoordinator], code: 200, input: [], output: DmeOrder, side_effects: ["status CANCELLED"] }
  - { method: POST, path: "/dme-orders/{dmeOrderId}/record-follow-up", description: "Record 30-day adherence follow-up; branches on compliance", roles: [DmeCoordinator], code: 200, input: [usage_hours_avg, compliant_nights_percent], output: DmeOrder, side_effects: ["status FOLLOW_UP_PASSED or ADHERENCE_REVIEW", "adherence_compliant stored"] }
  - { method: POST, path: "/dme-orders/{dmeOrderId}/resolve-adherence", description: "Resolve an adherence review", roles: [DmeCoordinator], code: 200, input: [action], output: DmeOrder, side_effects: ["status FOLLOW_UP_RESOLVED", "resolution_action stored"] }

  # --- Inter-rater reliability / QA ---
  - { method: POST, path: "/inter-rater-cases", description: "Open a reliability case pairing an ACCEPTED PRIMARY and an ACCEPTED RELIABILITY_RESCORE task", roles: [LabDirector], code: 201, input: [study_id, primary_task_id, rescore_task_id], output: InterRaterCase, side_effects: ["status OPEN"] }
  - { method: GET, path: "/inter-rater-cases", description: "List reliability cases (filtered)", roles: [Scheduler, SleepTechnologist, Scorer, InterpretingPhysician, DmeCoordinator, LabDirector], code: 200, input: ["study_id?", "primary_task_id?", "rescore_task_id?"], output: "InterRaterCase[]", side_effects: [] }
  - { method: GET, path: "/inter-rater-cases/{interRaterCaseId}", description: "Get a reliability case", roles: [Scheduler, SleepTechnologist, Scorer, InterpretingPhysician, DmeCoordinator, LabDirector], code: 200, input: [], output: InterRaterCase, side_effects: [] }
  - { method: POST, path: "/inter-rater-cases/{interRaterCaseId}/adjudicate", description: "Adjudicate a case; computes agreement and cascades scorer reliability status", roles: [LabDirector], code: 200, input: [epochs_concordant], output: InterRaterCase, side_effects: ["status ADJUDICATED", "agreement metrics computed", "scorer reliability cascade per inter_rater_agreement"] }
  - { method: GET, path: "/quality-metrics/summary", description: "Accreditation quality dashboard: turnaround SLA compliance and inter-rater concordance (2 decimals round_half_up; empty denominators report 100.00)", roles: [LabDirector], code: 200, input: [], output: { reports_signed_total: integer, sla_breached_total: integer, sla_compliance_percent: number, cases_adjudicated_total: integer, cases_concordant_total: integer, inter_rater_concordant_percent: number, scorers_in_remediation_total: integer }, side_effects: [] }

  # --- Test-driving clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any call the clock reads this default (never wall-clock). Advancing past an APPROVED authorization's window_end expires it and its AUTHORIZED order.", roles: [LabDirector], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["clock set", "auth/order expiry sweep"] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-ID / X-User-Role headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid field, bad enum member, out-of-range or off-step numeric" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version" }
  - { id: ERR_NOT_TASK_OWNER, http: 403, condition: "Scoring task action by a scorer other than task.scorer_id" }
  - { id: ERR_NOT_REPORT_AUTHOR, http: 403, condition: "Report/prescription action by a physician other than the report author" }
  - { id: ERR_STAFFING_NOT_OWN, http: 403, condition: "Confirm by a technologist other than the assigned one" }
  - { id: ERR_SOD_PRIMARY_SCORER, http: 422, condition: "RELIABILITY_RESCORE assigned to the same scorer as the ACCEPTED PRIMARY task" }
  - { id: ERR_SOD_REPORT_SCORER, http: 422, condition: "Report signer npi equals the ACCEPTED PRIMARY task scorer's npi" }
  - { id: ERR_ORDER_NOT_AUTHORIZABLE_STATE, http: 409, condition: "Authorization submit requires order in RECEIVED/AUTH_DENIED/AUTHORIZED" }
  - { id: ERR_AUTH_NOT_PENDING, http: 409, condition: "Decision requires authorization in SUBMITTED" }
  - { id: ERR_AUTH_WINDOW_INVALID, http: 400, condition: "window_end earlier than window_start" }
  - { id: ERR_DUPLICATE_MRN, http: 400, condition: "Patient mrn already registered" }
  - { id: ERR_ORDER_NOT_AUTHORIZED, http: 409, condition: "Scheduling requires order status AUTHORIZED" }
  - { id: ERR_ORDER_HAS_ACTIVE_STUDY, http: 409, condition: "Order cancel blocked by an IN_PROGRESS study" }
  - { id: ERR_ORDER_NOT_REVIEWABLE, http: 409, condition: "provider-review requires NEEDS_PROVIDER_REVIEW" }
  - { id: ERR_AUTH_WINDOW_VIOLATION, http: 422, condition: "scheduled_date outside the APPROVED authorization window (checked before bed conflict)" }
  - { id: ERR_STUDY_TYPE_MISMATCH, http: 422, condition: "study_type differs from order.requested_study_type" }
  - { id: ERR_BED_REQUIRED_FOR_IN_LAB, http: 400, condition: "In-lab study types require bed_id" }
  - { id: ERR_BED_NOT_ALLOWED_FOR_HST, http: 400, condition: "HST studies must not carry bed_id" }
  - { id: ERR_BED_INACTIVE, http: 422, condition: "Referenced bed is inactive" }
  - { id: ERR_BED_NOT_TITRATION_CAPABLE, http: 422, condition: "TITRATION_PAP / SPLIT_NIGHT require a titration_capable bed" }
  - { id: ERR_BED_NIGHT_CONFLICT, http: 409, condition: "Bed already occupied on scheduled_date by a SCHEDULED/IN_PROGRESS study" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 422, condition: "Scheduled in-lab studies would exceed CONFIRMED technologist capacity for the night" }
  - { id: ERR_CAPACITY_WOULD_BE_VIOLATED, http: 422, condition: "Cancelling a CONFIRMED assignment would leave scheduled studies above remaining capacity" }
  - { id: ERR_AUTH_NIGHTS_EXHAUSTED, http: 422, condition: "Order has consumed all approved_nights" }
  - { id: ERR_TECH_DOUBLE_BOOKED, http: 409, condition: "Technologist already has a non-CANCELLED assignment on shift_date" }
  - { id: ERR_STAFFING_INVALID_STATE, http: 409, condition: "Confirm requires PLANNED; cancel requires PLANNED or CONFIRMED" }
  - { id: ERR_STUDY_NOT_TONIGHT, http: 422, condition: "Check-in date (logical clock) differs from scheduled_date" }
  - { id: ERR_STUDY_NOT_IN_PROGRESS, http: 409, condition: "Operation requires study IN_PROGRESS (or SCHEDULED for check-in/no-show/cancel)" }
  - { id: ERR_SPLIT_NOT_APPLICABLE, http: 409, condition: "split-decision requires study_type SPLIT_NIGHT" }
  - { id: ERR_SPLIT_ALREADY_DECIDED, http: 409, condition: "split_outcome already recorded" }
  - { id: ERR_SPLIT_DECISION_REQUIRED, http: 409, condition: "SPLIT_NIGHT acquisition cannot complete before split-decision" }
  - { id: ERR_SPLIT_CENTRAL_PREDOMINANCE, http: 422, condition: "Central-predominant tracing excludes split-night titration" }
  - { id: ERR_SPLIT_MIN_DIAGNOSTIC_NOT_MET, http: 422, condition: "diagnostic_minutes_observed < 120" }
  - { id: ERR_SPLIT_AHI_THRESHOLD_NOT_MET, http: 422, condition: "partial_ahi_observed < 40 without qualification (>= 20 with override_reason)" }
  - { id: ERR_SPLIT_INSUFFICIENT_REMAINING, http: 422, condition: "remaining_minutes_available < 180" }
  - { id: ERR_STUDY_NOT_SCORABLE, http: 409, condition: "Scoring task creation requires study SCORING_QUEUED (PRIMARY) or SCORED and beyond (RESCORE)" }
  - { id: ERR_PRIMARY_TASK_EXISTS, http: 409, condition: "A non-terminal PRIMARY ScoringTask already exists for the study" }
  - { id: ERR_SCORER_IN_REMEDIATION, http: 422, condition: "Scorer in REMEDIATION may not receive new assignments" }
  - { id: ERR_SCORER_NOT_IN_POOL, http: 422, condition: "RELIABILITY_RESCORE requires reliability_pool scorer" }
  - { id: ERR_TASK_NOT_STARTABLE, http: 409, condition: "start requires ASSIGNED or RETURNED_FOR_REVISION" }
  - { id: ERR_TASK_NOT_SUBMITTABLE, http: 409, condition: "submit requires IN_PROGRESS" }
  - { id: ERR_TASK_NOT_SUBMITTED, http: 409, condition: "accept/return require SUBMITTED" }
  - { id: ERR_TASK_TERMINAL, http: 409, condition: "Action on ACCEPTED or RECALLED task" }
  - { id: ERR_INSUFFICIENT_REASON, http: 400, condition: "return reason shorter than 10 characters" }
  - { id: ERR_STUDY_NOT_SCORED, http: 409, condition: "Report creation requires study SCORED or INTERPRETATION_IN_PROGRESS (supersede of a DRAFT)" }
  - { id: ERR_INVALID_PRIMARY_TASK, http: 422, condition: "primary_scoring_task_id is not the ACCEPTED PRIMARY task of the study" }
  - { id: ERR_FINAL_REPORT_EXISTS, http: 409, condition: "A SIGNED/FINALIZED/ADDENDUM_OPEN report already exists for the study" }
  - { id: ERR_REPORT_INVALID_STATE, http: 409, condition: "Report action requires DRAFT (sign), SIGNED (finalize/rx), FINALIZED (open-addendum/rx), or ADDENDUM_OPEN (close)" }
  - { id: ERR_TITRATION_RECOMMENDATION_UNAVAILABLE, http: 409, condition: "Study is not a titration context or has no ACCEPTED PRIMARY task" }
  - { id: ERR_THERAPY_NOT_INDICATED, http: 422, condition: "Severity NORMAL does not support PAP prescription" }
  - { id: ERR_RX_DEVICE_FIELDS_INVALID, http: 400, condition: "Device-specific fields missing or inconsistent (CPAP pressure 4..20 step 0.5; APAP 4 <= min < max <= 20; BIPAP 4 <= epap < ipap <= 25)" }
  - { id: ERR_RX_INVALID_STATE, http: 409, condition: "rx action requires DRAFT (order) or DRAFT/ORDERED (cancel) or ORDERED (dme dispatch)" }
  - { id: ERR_DME_ORDER_ACTIVE, http: 409, condition: "A non-terminal DmeOrder already exists for the prescription" }
  - { id: ERR_DME_INVALID_STATE, http: 409, condition: "DME action requires DISPATCHED/DELIVERED/ADHERENCE_REVIEW respectively" }
  - { id: ERR_CASE_ALREADY_EXISTS, http: 409, condition: "An InterRaterCase already references this rescore_task_id" }
  - { id: ERR_CASE_TASKS_INVALID, http: 422, condition: "Case tasks must be ACCEPTED, of kinds PRIMARY and RELIABILITY_RESCORE, on the same study, by different scorers" }
  - { id: ERR_CASE_INVALID_STATE, http: 409, condition: "adjudicate requires OPEN" }
  - { id: ERR_SCORER_NOT_REMEDIATION, http: 409, condition: "reinstate requires reliability_status REMEDIATION" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: Scheduler
    description: "Intake/scheduling coordinator: patients, referral orders, authorizations, scheduling, no-show/cancel"
    identity: opaque
    exclusive_operations:
      - "POST /patients"
      - "POST /referral-orders"
      - "POST /referral-orders/{id}/authorizations"
      - "POST /authorizations/{id}/decision"
      - "POST /referral-orders/{id}/provider-review"
      - "POST /referral-orders/{id}/cancel"
      - "POST /sleep-studies"
      - "POST /sleep-studies/{id}/cancel"
    shared_operations:
      - "POST /sleep-studies/{id}/no-show (with SleepTechnologist)"
      - "All GET list/single endpoints"
  - name: SleepTechnologist
    description: "Night technologist: confirms own shifts, runs acquisition, split decisions"
    identity: "entity_backed:Technologist"
    exclusive_operations:
      - "POST /staffing-assignments/{id}/confirm (own assignment only)"
      - "POST /sleep-studies/{id}/check-in"
      - "POST /sleep-studies/{id}/split-decision"
      - "POST /sleep-studies/{id}/complete-acquisition"
      - "POST /sleep-studies/{id}/technical-failure"
    shared_operations:
      - "POST /sleep-studies/{id}/no-show (with Scheduler)"
      - "All GET list/single endpoints"
  - name: Scorer
    description: "Registered sleep scorer: starts and submits own scoring tasks"
    identity: "entity_backed:Scorer"
    exclusive_operations:
      - "POST /scoring-tasks/{id}/start (own task only)"
      - "POST /scoring-tasks/{id}/submit (own task only)"
      - "POST /scoring-tasks/{id}/return is NOT theirs — see InterpretingPhysician"
    shared_operations:
      - "All GET list/single endpoints"
  - name: InterpretingPhysician
    description: "Board-certified sleep physician: accepts/returns scoring, authors reports and prescriptions"
    identity: "entity_backed:Physician"
    exclusive_operations:
      - "POST /scoring-tasks/{id}/accept"
      - "POST /scoring-tasks/{id}/return"
      - "POST /interpretation-reports"
      - "POST /interpretation-reports/{id}/sign|finalize|open-addendum|close-addendum (author only)"
      - "POST /therapy-prescriptions"
      - "POST /therapy-prescriptions/{id}/order|cancel (author only)"
      - "GET /sleep-studies/{id}/titration-recommendation"
    shared_operations:
      - "All GET list/single endpoints"
  - name: DmeCoordinator
    description: "DME liaison: dispatch, delivery, adherence follow-up"
    identity: opaque
    exclusive_operations:
      - "POST /dme-orders"
      - "POST /dme-orders/{id}/deliver|decline|cancel|record-follow-up|resolve-adherence"
    shared_operations:
      - "All GET list/single endpoints"
  - name: LabDirector
    description: "AASM medical director: beds/staff/staffing administration, scoring assignment, inter-rater program, quality metrics, clock"
    identity: opaque
    exclusive_operations:
      - "POST /beds, POST /technologists, POST /scorers, POST /physicians"
      - "POST /scorers/{id}/reinstate"
      - "POST /staffing-assignments, POST /staffing-assignments/{id}/cancel"
      - "POST /scoring-tasks"
      - "POST /inter-rater-cases, POST /inter-rater-cases/{id}/adjudicate"
      - "GET /quality-metrics/summary"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET list/single endpoints"
