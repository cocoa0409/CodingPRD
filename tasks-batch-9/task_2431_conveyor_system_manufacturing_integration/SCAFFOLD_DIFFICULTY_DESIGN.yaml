            - call: "POST /change-orders/${co_r}/submit"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-001"
            - call: "GET /projects/${proj_r}"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-001"
              captures: { proj_r_v1: $.data.version }
          trigger:
            - call: "POST /change-orders/${co_r}/review-decision"
              payload: { decision: "REQUEST_REVISION", expected_project_version: "${proj_r_v1}", decision_comment: "Round 1 rework" }
              as: CustomerRep
              as_user_id: "cust-rep-77"
            - call: "POST /change-orders/${co_r}/submit"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-001"
            - call: "GET /projects/${proj_r}"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-001"
              captures: { proj_r_v2: $.data.version }
            - call: "POST /change-orders/${co_r}/review-decision"
              payload: { decision: "REQUEST_REVISION", expected_project_version: "${proj_r_v2}", decision_comment: "Round 2 rework" }
              as: CustomerRep
              as_user_id: "cust-rep-77"
            - call: "POST /change-orders/${co_r}/submit"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-001"
            - call: "GET /projects/${proj_r}"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-001"
              captures: { proj_r_v3: $.data.version }
            - call: "POST /change-orders/${co_r}/review-decision"
              payload: { decision: "REQUEST_REVISION", expected_project_version: "${proj_r_v3}", decision_comment: "Round 3 rework" }
              as: CustomerRep
              as_user_id: "cust-rep-77"
          assert:
            - "the third review-decision returns 409 with error_id ERR_CHANGE_ORDER_ROUND_LIMIT"
            - "ChangeOrder.${co_r}.round_no == 3 (unchanged by the refused decision)"
            - "ChangeOrder.${co_r}.status == SUBMITTED (the refused decision leaves it submitted, not REVISION_REQUESTED)"
            - "Project.${proj_r}.commercial_status == CHANGE_PENDING"
            - "Project.${proj_r}.contract_value_cents == 243600000 (no approval, so no repricing)"

      - name: project_delivery_and_commercial_dimensions_advance_independently
        grounds:
          - state_machines.Project.CLEAN_to_CHANGE_PENDING
          - state_machines.Project.DESIGN_FROZEN_to_IN_FABRICATION
          - entities.Project.fields.delivery_status
          - entities.Project.fields.commercial_status
        distinguishing_aspect: |
          A single Project row carries two orthogonal dimensions: submitting a change order moves
          commercial_status CLEAN -> CHANGE_PENDING while delivery_status stays DESIGN_FROZEN, and releasing a
          lot then moves delivery_status DESIGN_FROZEN -> IN_FABRICATION while commercial_status stays
          CHANGE_PENDING — neither dimension gates or is gated by the other.
        test_recipe:
          setup:
            - "Project frozen: delivery_status DESIGN_FROZEN, commercial_status CLEAN."
            - "One FabricationLot in PLANNED and one ChangeOrder in DRAFT with scope_delta_cph 0."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Northstar Grocers", facility_code: "DC-ATL-04", customer_rep_user_id: "cust-rep-77", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000, service_tier: "PREMIUM" }
              as: ProjectDirector
              as_user_id: "pd-001"
              captures: { proj_p: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_p}", segment_code: "IB-01", equipment_class: "BELT", rated_capacity_cph: 1500, availability_pct: 96, source_share_bps: 10000 }
              as: DesignEngineer
              captures: { seg_p1: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_p}", segment_code: "TR-02", equipment_class: "ROLLER", rated_capacity_cph: 1400, availability_pct: 95 }
              as: DesignEngineer
              captures: { seg_p2: $.data.id }
            - call: "POST /flow-links"
              payload: { project_id: "${proj_p}", from_segment_id: "${seg_p1}", to_segment_id: "${seg_p2}", split_share_bps: 10000 }
              as: DesignEngineer
            - call: "POST /projects/${proj_p}/simulations"
              payload: { method: "DEGRADED_AVAILABILITY" }
              as: DesignEngineer
            - call: "POST /projects/${proj_p}/design-freeze"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-001"
            - call: "POST /staging-bays"
              payload: { bay_code: "BAY-3", concurrent_capacity: 2 }
              as: ShopSupervisor
              captures: { bay_p: $.data.id }
            - call: "POST /fabrication-lots"
              payload: { project_id: "${proj_p}", lot_code: "LOT-300", staging_bay_id: "${bay_p}", segment_codes: ["IB-01"], occupancy_start_utc: "2026-08-03T00:00:00Z", occupancy_end_utc: "2026-08-07T00:00:00Z" }
              as: ShopSupervisor
              captures: { lot_p: $.data.id }
            - call: "POST /change-orders"
              payload: { project_id: "${proj_p}", title: "Add spiral chute", scope_delta_cph: 0, price_delta_cents: 2000000, schedule_delta_days: 2 }
              as: ProjectDirector
              as_user_id: "pd-001"
              captures: { co_p: $.data.id }
          trigger:
            - call: "POST /change-orders/${co_p}/submit"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-001"
            - call: "POST /fabrication-lots/${lot_p}/start-fabrication"
              payload: {}
              as: ShopSupervisor
          assert:
            - "after the submit call, Project.${proj_p}.commercial_status == CHANGE_PENDING and Project.${proj_p}.delivery_status == DESIGN_FROZEN"
            - "after the start-fabrication call, Project.${proj_p}.delivery_status == IN_FABRICATION"
            - "after the start-fabrication call, Project.${proj_p}.commercial_status == CHANGE_PENDING (unchanged)"
            - "FabricationLot.${lot_p}.status == FABRICATING"
            - "ChangeOrder.${co_p}.status == SUBMITTED"

  # =========================================================================
  # Rule 4 — transitive_cascade
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: change_order_approval_cascades_design_simulation_window_lot_hold
        grounds:
          - state_machines.ChangeOrder.SUBMITTED_to_APPROVED
          - state_machines.SimulationRun.COMPLETE_to_STALE
          - state_machines.CutoverWindow.SCHEDULED_to_BLOCKED_STALE_DESIGN
          - state_machines.FabricationLot.FAT_PASSED_to_HOLD
          - state_machines.Project.DESIGN_FROZEN_to_DESIGN
        distinguishing_aspect: |
          Depth 4 through four distinct entity types, each link caused by the previous one and none by the
          trigger directly: approving a scope-bearing ChangeOrder bumps Project.design_version (link 1), which
          staleness-marks the COMPLETE SimulationRun (link 2), whose absence blocks the SCHEDULED CutoverWindow
          (link 3), which in turn puts the FAT_PASSED FabricationLot on HOLD (link 4). A fresh compliant
          simulation then walks links 3 and 4 back.
        test_recipe:
          setup:
            - "Project with delivery_status IN_FABRICATION, design_version 4, commercial_status CLEAN, contract_value_cents 243600000."
            - "One COMPLETE DEGRADED_AVAILABILITY SimulationRun with design_version_at_run 4 and effective_throughput_cph 1330."
            - "One FabricationLot in FAT_PASSED and one SiteZone in LIVE_LEGACY."
            - "One CutoverWindow in SCHEDULED referencing that lot and zone."
            - "One ChangeOrder in SUBMITTED with scope_delta_cph 120 and price_delta_cents 18000000."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Northstar Grocers", facility_code: "DC-ATL-04", customer_rep_user_id: "cust-rep-77", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000, service_tier: "PREMIUM" }
              as: ProjectDirector
              as_user_id: "pd-001"
              captures: { proj_x: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_x}", segment_code: "IB-01", equipment_class: "BELT", rated_capacity_cph: 1500, availability_pct: 96, source_share_bps: 10000 }
              as: DesignEngineer
              captures: { seg_x1: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_x}", segment_code: "TR-02", equipment_class: "ROLLER", rated_capacity_cph: 1400, availability_pct: 95 }
              as: DesignEngineer
              captures: { seg_x2: $.data.id }
            - call: "POST /flow-links"
              payload: { project_id: "${proj_x}", from_segment_id: "${seg_x1}", to_segment_id: "${seg_x2}", split_share_bps: 10000 }
              as: DesignEngineer
            - call: "POST /projects/${proj_x}/simulations"
              payload: { method: "DEGRADED_AVAILABILITY" }
              as: DesignEngineer
              captures: { sim_x1: $.data.id }
            - call: "POST /projects/${proj_x}/design-freeze"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-001"
            - call: "POST /staging-bays"
              payload: { bay_code: "BAY-4", concurrent_capacity: 2 }
              as: ShopSupervisor
              captures: { bay_x: $.data.id }
            - call: "POST /fabrication-lots"
              payload: { project_id: "${proj_x}", lot_code: "LOT-400", staging_bay_id: "${bay_x}", segment_codes: ["IB-01", "TR-02"], occupancy_start_utc: "2026-08-03T00:00:00Z", occupancy_end_utc: "2026-08-07T00:00:00Z" }
              as: ShopSupervisor
              captures: { lot_x: $.data.id }
            - call: "POST /fabrication-lots/${lot_x}/start-fabrication"
              payload: {}
              as: ShopSupervisor
            - call: "POST /fabrication-lots/${lot_x}/stage"
              payload: {}
              as: ShopSupervisor
              captures: { lot_x_v: $.data.version }
            - call: "POST /fat-tests"
              payload: { fabrication_lot_id: "${lot_x}", expected_fabrication_lot_version: "${lot_x_v}", measured_cph: 1320, defect_count: 1 }
              as: ShopSupervisor
            - call: "POST /site-zones"
              payload: { project_id: "${proj_x}", zone_code: "Z-INBOUND", throughput_share_bps: 10000, protected_shift_start_minute: 480, protected_shift_end_minute: 1080, buffer_minutes: 60 }
              as: SiteManager
              captures: { zone_x: $.data.id }
            - call: "POST /cutover-windows"
              payload: { project_id: "${proj_x}", site_zone_id: "${zone_x}", fabrication_lot_id: "${lot_x}", start_utc: "2026-08-10T19:00:00Z", end_utc: "2026-08-10T23:00:00Z" }
              as: SiteManager
              captures: { win_x: $.data.id }
            - call: "POST /change-orders"
              payload: { project_id: "${proj_x}", title: "Add second sorter loop", scope_delta_cph: 120, price_delta_cents: 18000000, schedule_delta_days: 21 }
              as: ProjectDirector
              as_user_id: "pd-001"
              captures: { co_x: $.data.id }
            - call: "POST /change-orders/${co_x}/submit"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-001"
            - call: "GET /projects/${proj_x}"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-001"
              captures: { proj_x_v: $.data.version, design_v_before: $.data.design_version }
          trigger:
            - call: "POST /change-orders/${co_x}/review-decision"
              payload: { decision: "APPROVE", expected_project_version: "${proj_x_v}", decision_comment: "Second sorter approved" }
              as: CustomerRep
              as_user_id: "cust-rep-77"
            - call: "POST /projects/${proj_x}/simulations"
              payload: { method: "DEGRADED_AVAILABILITY" }
              as: DesignEngineer
              captures: { sim_x2: $.data.id }
          assert:
            - "after the review-decision call, ChangeOrder.${co_x}.status == APPROVED and Project.${proj_x}.contract_value_cents == 263676000"
            - "link 1: Project.${proj_x}.design_version == ${design_v_before} + 1 and Project.${proj_x}.delivery_status == DESIGN and Project.${proj_x}.design_frozen_at is null"
            - "link 2: SimulationRun.${sim_x1}.status == STALE"
            - "link 3: CutoverWindow.${win_x}.status == BLOCKED_STALE_DESIGN"
            - "link 4: FabricationLot.${lot_x}.status == HOLD"
            - "after the second simulation call, SimulationRun.${sim_x2}.effective_throughput_cph == 1330 and SimulationRun.${sim_x2}.status == COMPLETE"
            - "restoration: CutoverWindow.${win_x}.status == SCHEDULED and FabricationLot.${lot_x}.status == STAGED (the lot loses its FAT credit and must be re-tested)"
            - "SimulationRun.${sim_x1}.status == STALE (a stale run is never revived by the new run)"

      - name: third_fat_failure_cascades_window_cancellation_to_project_rebaseline
        grounds:
          - state_machines.FabricationLot.STAGED_to_SCRAPPED
          - state_machines.CutoverWindow.SCHEDULED_to_CANCELLED_LOT_SCRAPPED
          - state_machines.Project.IN_FABRICATION_to_REBASELINE_REQUIRED
          - state_machines.Project.REBASELINE_REQUIRED_to_IN_FABRICATION
        distinguishing_aspect: |
          Depth 3 rooted in a shop-floor test rather than a commercial decision: the third failing FatTest
          scraps the lot (link 1), the scrapped lot cancels its SCHEDULED CutoverWindow (link 2), and that
          cancellation drives Project.delivery_status IN_FABRICATION -> REBASELINE_REQUIRED (link 3) — a
          different trigger entity and a different terminal entity than the change-order cascade.
        test_recipe:
          setup:
            - "Project frozen then IN_FABRICATION with required_throughput_cph 1250 (fat_target_cph 1313)."
            - "One FabricationLot in STAGED with fat_attempt_count 2 after two recorded FAIL tests."
            - "One SiteZone LIVE_LEGACY and one CutoverWindow SCHEDULED referencing that lot."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Northstar Grocers", facility_code: "DC-ATL-04", customer_rep_user_id: "cust-rep-77", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000, service_tier: "PREMIUM" }
              as: ProjectDirector
              as_user_id: "pd-001"
              captures: { proj_y: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_y}", segment_code: "IB-01", equipment_class: "BELT", rated_capacity_cph: 1500, availability_pct: 96, source_share_bps: 10000 }
              as: DesignEngineer
              captures: { seg_y1: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_y}", segment_code: "TR-02", equipment_class: "ROLLER", rated_capacity_cph: 1400, availability_pct: 95 }
              as: DesignEngineer
