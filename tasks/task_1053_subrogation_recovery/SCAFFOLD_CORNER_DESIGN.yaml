              as_user_id: "mgr-1"
              captures: { carrier_id: $.data.id }
            - call: "POST /subro/adverse-parties"
              payload: { name: "Adv OCC", adverse_carrier_name: "Rival Insurance", is_arbitration_eligible: true, policy_limit_cents: 5000000 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { ap_id: $.data.id }
            - call: "POST /subro/claims"
              payload: { carrier_id: "${carrier_id}", adverse_party_id: "${ap_id}", claim_reference: "CLM-OCC", loss_date: "2026-05-01T00:00:00Z", paid_loss_cents: 2500000, deductible_cents: 500000, total_damages_cents: 4000000, statute_deadline: "2028-01-01T00:00:00Z" }
              as: CarrierUser
              as_user_id: "${carrier_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /subro/claims/${claim_id}/assess-liability"
              payload: { liability_pct: 80 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
            - call: "POST /subro/claims/${claim_id}/demands"
              payload: { amount_demanded_cents: 3000000 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
            - call: "GET /subro/claims/${claim_id}"
              payload: {}
              as: Any
              as_user_id: "mgr-1"
              captures: { claim_v: $.data.version }
            - call: "POST /subro/claims/${claim_id}/settlements"
              payload: { settled_amount_cents: 1000000, expected_claim_version: "${claim_v}" }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /subro/claims/${claim_id}/settlements"
              payload: { settled_amount_cents: 1200000, expected_claim_version: "${claim_v}" }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { err: $.data.error_id }
          assert:
            - "response http status == 412"
            - "data.error_id == ERR_STALE_CLAIM_VERSION"

      - name: settlement_supersede_prior_proposed_positive
        claim_type: cascading_side_effects
        grounds: [state_machines.Settlement.PROPOSED_to_SUPERSEDED, entities.Claim.fields.version]
        distinguishing_aspect: "Proposing a second settlement with the fresh claim version moves the prior PROPOSED settlement to SUPERSEDED while the new one is PROPOSED."
        test_recipe:
          setup: ["Claim in DEMAND_ISSUED with one PROPOSED settlement s1"]
          setup_api_calls:
            - call: "POST /subro/carriers"
              payload: { name: "Acme Mutual", naic_code: "12345", commission_rate_bps: 2500, commission_basis: "NET" }
              as: RecoveryManager
              as_user_id: "mgr-1"
              captures: { carrier_id: $.data.id }
            - call: "POST /subro/adverse-parties"
              payload: { name: "Adv SUP", adverse_carrier_name: "Rival Insurance", is_arbitration_eligible: true, policy_limit_cents: 5000000 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { ap_id: $.data.id }
            - call: "POST /subro/claims"
              payload: { carrier_id: "${carrier_id}", adverse_party_id: "${ap_id}", claim_reference: "CLM-SUP", loss_date: "2026-05-01T00:00:00Z", paid_loss_cents: 2500000, deductible_cents: 500000, total_damages_cents: 4000000, statute_deadline: "2028-01-01T00:00:00Z" }
              as: CarrierUser
              as_user_id: "${carrier_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /subro/claims/${claim_id}/assess-liability"
              payload: { liability_pct: 80 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
            - call: "POST /subro/claims/${claim_id}/demands"
              payload: { amount_demanded_cents: 3000000 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
            - call: "GET /subro/claims/${claim_id}"
              payload: {}
              as: Any
              as_user_id: "mgr-1"
              captures: { claim_v1: $.data.version }
            - call: "POST /subro/claims/${claim_id}/settlements"
              payload: { settled_amount_cents: 1000000, expected_claim_version: "${claim_v1}" }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { s1_id: $.data.id }
            - call: "GET /subro/claims/${claim_id}"
              payload: {}
              as: Any
              as_user_id: "mgr-1"
              captures: { claim_v2: $.data.version }
          trigger:
            - call: "POST /subro/claims/${claim_id}/settlements"
              payload: { settled_amount_cents: 1200000, expected_claim_version: "${claim_v2}" }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { s2_id: $.data.id }
          assert:
            - "Settlement.${s1_id}.status == SUPERSEDED"
            - "Settlement.${s2_id}.status == PROPOSED"

      - name: payment_clear_cascade_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.RecoveryPayment.RECEIVED_to_CLEARED]
        excluded_because:
          difficulty_instance: transitive_cascade / payment_clear_recovers_claim_and_creates_reimbursement
          rationale: "The full clear cascade (payment -> claim RECOVERED -> reimbursement) is that §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_consistency_claim_read_after_create
        claim_type: immediate
        grounds: [entities.Claim, endpoints]
        distinguishing_aspect: "A claim is fully readable via GET immediately after POST in a separate request, reflecting all referral fields (immediate consistency)."
        test_recipe:
          setup: ["ACTIVE carrier + adverse party"]
          setup_api_calls:
            - call: "POST /subro/carriers"
              payload: { name: "Acme Mutual", naic_code: "12345", commission_rate_bps: 2500, commission_basis: "NET" }
              as: RecoveryManager
              as_user_id: "mgr-1"
              captures: { carrier_id: $.data.id }
            - call: "POST /subro/adverse-parties"
              payload: { name: "Adv IC", adverse_carrier_name: "Rival Insurance", is_arbitration_eligible: true, policy_limit_cents: 5000000 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { ap_id: $.data.id }
            - call: "POST /subro/claims"
              payload: { carrier_id: "${carrier_id}", adverse_party_id: "${ap_id}", claim_reference: "CLM-IC", loss_date: "2026-05-01T00:00:00Z", paid_loss_cents: 2500000, deductible_cents: 500000, total_damages_cents: 4000000, statute_deadline: "2028-01-01T00:00:00Z" }
              as: CarrierUser
              as_user_id: "${carrier_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "GET /subro/claims/${claim_id}"
              payload: {}
              as: Any
              as_user_id: "reader-1"
              captures: { pl: $.data.paid_loss_cents }
          assert:
            - "Claim.${claim_id}.paid_loss_cents == 2500000"
            - "Claim.${claim_id}.deductible_cents == 500000"
