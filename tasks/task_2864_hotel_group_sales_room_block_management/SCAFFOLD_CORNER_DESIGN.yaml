  - name: negative_net_benefit_requires_an_override_reason
    claim_type: conditional_validation
    grounds:
    - validations[priority=31]
    - errors[ERR_DISPLACEMENT_NET_BENEFIT_NEGATIVE]
    - calculations.displacement_cost
    - entities.DisplacementAnalysis.fields.verdict
    distinguishing_aspect: |
      On a nearly sold-out house (total_rooms 400, transient demand 400, ADR 60000) the group displaces 4 rooms a night: 12 displaced room nights at 60000 is 720000 against group revenue 590400 plus an ancillary projection of 4 * 3 * 4500 = 54000, so net_benefit_cents is -75600 and the verdict is OVERRIDE_REQUIRED. APPROVE must then be refused until a non-blank override_reason is supplied — the rule is conditional on the computed verdict, not on the role — and the refusal must not consume the lead version, which is why the retry reuses the same expected_lead_version.
    test_recipe:
      setup:
      - clock 2026-08-01T00:00:00Z; CORPORATE account; three InventoryDay rows for 2026-11-09..11 with
        total_rooms 400, transient_demand_rooms 400 and transient_adr_cents 60000; a QUALIFIED lead (score
        35, room-night value 590400) with a PENDING FORECAST_BASED analysis requested by rm-001
