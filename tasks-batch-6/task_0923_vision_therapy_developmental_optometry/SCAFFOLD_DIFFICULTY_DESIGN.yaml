      - name: kit_stock_conserved_across_checkout_then_lost_return
        grounds:
          - conservation_invariants.INVARIANT-2
          - calculations.kit_damage_fee
          - state_machines.KitLoan.REQUESTED_to_CHECKED_OUT
          - state_machines.KitLoan.CHECKED_OUT_to_RETURNED
        distinguishing_aspect: |
          Conserved quantity 2 is physical kit units, a different kind of quantity from visit units:
          checkout moves one unit from on_hand_qty to on_loan_qty and a LOST return moves it on to
          retired_qty, so initial_qty == on_hand_qty + on_loan_qty + dispensed_qty + retired_qty holds at
          both observation points even though the unit never comes back to the shelf.
