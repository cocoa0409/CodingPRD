    code: 200
    input: ["wristband_id?", "reservation_id?", "resort_id?", "limit?", "offset?"]
    output: ArcadeCreditGrant[]
    side_effects: []

  - method: GET
    path: "/resorts/{resort_id}/water-quality-logs/{log_id}"
    description: "Get a water quality reading"
    roles: [platform_ops, AquaticsManager]
    code: 200
    input: []
    output: WaterQualityLog
    side_effects: []

  - method: GET
    path: "/resorts/{resort_id}/admissions/{admission_event_id}"
    description: "Get a gate admission or exit event"
    roles: [platform_ops, FrontDesk, GateAttendant, AquaticsManager]
    code: 200
    input: []
    output: AdmissionEvent
    side_effects: []


errors:

  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header absent, or the role is not recognised"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Acting role is not permitted for the operation, or an entity-backed role does not own the resource it is mutating"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "The path id or a referenced foreign key does not exist under the named resort"

  - id: ERR_GROUP_OWNERSHIP_MISMATCH
    http: 403
    condition: "Acting Group role's X-User-ID does not equal the id of the GroupBooking referenced by group_booking_id"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing or malformed required field, or a value outside its declared constraint"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state that permits the requested transition"

  - id: ERR_POOL_CLOSED
    http: 409
    condition: "Resort.pool_posture is CLOSED because a WaterQualityLog with log_status=FAIL and superseded_at null stands"

  - id: ERR_WATER_QUALITY_OUT_OF_RANGE
    http: 422
    condition: "pH outside [7.2, 7.8], free chlorine outside [1.0, 3.0] ppm, or turbidity above 1.0 NTU"

  - id: ERR_SHIFT_ROTATION_VIOLATION
    http: 409
    condition: "A lifeguard shift breaches the rotation roster: the staffer lacks the attraction's required certification, the shift exceeds rotation_minutes + LIFEGUARD_MAX_CONSECUTIVE_MINUTES, or it overlaps or abuts a COMPLETED shift for the same staffer within LIFEGUARD_ROTATION_BUFFER_MINUTES"

  - id: ERR_ATTRACTION_NOT_OPEN
    http: 409
    condition: "Attraction.attraction_status is CLOSED, or it posts fewer than Attraction.min_occupancy_units staffers on the rotation roster"

  - id: ERR_PARK_CAPACITY_EXCEEDED
    http: 409
    condition: "occupancy_units for the service date would exceed Resort.park_capacity_occupancy_units"

  - id: ERR_DAY_PASS_CAP_EXCEEDED
    http: 409
    condition: "day_pass_reserved_units for the service date would exceed Resort.day_pass_cap_units"

  - id: ERR_DAY_PASS_UNITS_EXHAUSTED
    http: 409
    condition: "A day pass is admitted with fewer RESERVED units remaining than the presenting wristband consumes"

  - id: ERR_ARCADE_LIMIT_EXCEEDED
    http: 402
    condition: "The arcade amount would push Wristband.arcade_credit_spent_cents above arcade_credit_limit_cents"

  - id: ERR_ROOM_CHARGE_DISABLED
    http: 409
    condition: "Wristband.room_charge_enabled is false, so the band cannot post room charges or arcade credits"

  - id: ERR_WRISTBAND_NOT_ACTIVE
    http: 409
    condition: "The presented wristband's wristband_status is not ACTIVE or its access_status is not GRANTED at a gate or arcade post"

  - id: ERR_WRISTBAND_ALREADY_REISSUED
    http: 409
    condition: "The presented wristband carries a non-null superseded_by_wristband_id and cannot be re-issued again"

  - id: ERR_HELD_UNITS_NOT_RELEASABLE
    http: 409
    condition: "Wristband.arcade_credit_spent_cents is greater than 0, so the band cannot be re-issued"

  - id: ERR_ACCOUNT_LIEN_OUTSTANDING
    http: 409
    condition: "The linked Reservation still carries a wristband whose arcade_credit_spent_cents is greater than zero at check-out, so the account cannot be closed out"

  - id: ERR_DECLINED_AUTHORIZATION
    http: 402
    condition: "External gate authorisation declined the package charge (emitted on Reservation create when the authorizing gate refuses the package or day-pass total)"

  - id: ERR_CABANA_DOUBLE_BOOKED
    http: 409
    condition: "An existing CabanaBooking with cabana_booking_status IN {HELD, BOOKED} occupies the same cabana and service date with an overlapping [start_minute, end_minute)"

  - id: ERR_CABANA_OCCUPIED
    http: 409
    condition: "GroupBooking.group_status is not CONFIRMED, or the cabana cannot be transitioned while its current occupation stands"

  - id: ERR_CABANA_UNITS_UNAVAILABLE
    http: 409
    condition: "member_units would exceed Cabana.capacity_units for the requested occupation"

  - id: ERR_GROUP_SPLIT_ADMISSION
    http: 409
    condition: "A second group member is admitted under the same group booking after another member of that group has already been admitted; all of a group's member units are admitted at once"

  - id: ERR_GROUP_MINIMUM_NOT_MET
    http: 409
    condition: "GroupBooking.group_kind is BIRTHDAY and GroupBooking.member_count is below the party minimum"

  - id: ERR_SERVICE_DATE_OUT_OF_RANGE
    http: 409
    condition: "service_date is more than 365 days after the resort's current service date"

  - id: ERR_PAYMENT_DECLINED
    http: 409
    condition: "Deposit amount plus what is already paid is below the group's requirement (ERR_PAYMENT_DECLINED), or the authorizing gateway refused the charge (ERR_DECLINED_AUTHORIZATION, returned with 402)"

  - id: ERR_NO_ELIGIBLE_SESSION
    http: 409
    condition: "The named activity session cannot seat the requested attendee count and no alternative session in the resort can"

  - id: ERR_STALE_RESORT_VERSION
    http: 412
    condition: "expected_resort_version does not match Resort.version"

  - id: ERR_STALE_CABANA_VERSION
    http: 412
    condition: "expected_cabana_version does not match Cabana.version"

  - id: ERR_DUPLICATE_READING_AT_INSTANT
    http: 409
    condition: "A WaterQualityLog already exists for the same attraction at the same sampled_at instant"

roles:

  - name: platform_ops
    description: "Resort operations administrator: creates properties, room types, attractions, and activity inventory, runs housekeeping, and applies corrections. Opaque operator ids are used for audit only; override powers are synchronous and owner-only, so they are listed as exclusive_operations rather than shared ones."
    identity: "opaque"
    exclusive_operations:
      - "POST /resorts — Create resort"
      - "PUT /resorts/{resort_id} — Edit capacity ceilings"
      - "POST /resorts/{resort_id}/managers — Add a rotation-roster entry"
      - "POST .../room-types — Create room type"
      - "POST .../cabanas — Create cabana"
      - "POST .../activities — Create activity session"
      - "POST .../cabana-bookings/{cabana_booking_id}/release — Release a booked cabana"
      - "POST .../cabana-bookings/expire_holds — Lapse advance holds past expiry"
      - "POST /resorts/{resort_id}/_clock/set_current_utc — Set the logical clock"
      - "POST /resorts/{resort_id}/_payments/simulate — Simulate the deposit gateway"
    shared_operations:
      - "GET /resorts/{resort_id} — Get resort"
      - "GET .../capacity and .../attendance-capacity — Capacity ledger"
      - "GET — every list and detail read endpoint"
      - "POST .../cabana-bookings/{cabana_booking_id}/cancel — Cancel a cabana occupation"
      - "POST .../group-bookings/{group_booking_id}/cancel — Cancel a group booking"
      - "POST .../activity-bookings/{activity_booking_id}/cancel — Cancel an activity booking"

  - name: FrontDesk
    description: "Front-desk agent at a resort property: books rooms and day passes, checks guests in and out, issues and revokes wristbands, and posts corrections to wristband state."
    identity: "opaque"
    exclusive_operations:
      - "POST /resorts/{resort_id}/reservations — Book a room package"
      - "PUT /resorts/{resort_id}/reservations/{reservation_id} — Edit a RESERVED booking"
      - "POST .../reservations/{reservation_id}/check_in — Check in"
      - "POST .../reservations/{reservation_id}/check_out — Check out"
      - "POST .../reservations/{reservation_id}/cancel — Cancel a booking"
      - "POST /resorts/{resort_id}/reservations/{reservation_id}/arcade-credits — Post an arcade credit against a folio"
      - "POST .../wristbands/{wristband_id}/reissue — Re-issue a wristband"
    shared_operations:
      - "GET — every list and detail read endpoint"
      - "POST /resorts/{resort_id}/day-passes — Sell day passes"
      - "POST .../day-passes/{day_pass_id}/void — Void a day pass"
      - "POST /resorts/{resort_id}/wristbands — Issue a wristband"
      - "POST .../wristbands/{wristband_id}/activate — Activate a wristband"
      - "POST .../wristbands/{wristband_id}/revoke — Revoke a wristband"
      - "POST .../wristbands/{wristband_id}/arcade-redeem — Post an arcade redemption"

  - name: AquaticsManager
    description: "Aquatics manager: schedules and rotates lifeguards, records water quality readings, and holds closure authority. Rotation and closure commands may only be issued for a property named by their role and description."
    identity: "opaque"
    exclusive_operations:
      - "POST /resorts/{resort_id}/water-quality-logs — Record a water quality reading"
      - "POST .../water-quality-logs/{log_id}/supersede — Supersede a standing FAIL reading"
    shared_operations:
      - "GET — every list and detail read endpoint"
      - "POST .../lifeguard-shifts — Schedule a shift"
      - "POST .../lifeguard-shifts/{shift_id}/start — Start a shift"
      - "POST .../lifeguard-shifts/{shift_id}/rotate — Rotate a staffer"
      - "POST .../lifeguard-shifts/{shift_id}/resume — Resume a staffer"
      - "POST .../lifeguard-shifts/{shift_id}/complete — Complete a shift"
      - "POST .../attractions — Create an attraction"
      - "POST .../attractions/{attraction_id}/run_ops — Run attractions housekeeping"
      - "POST .../wristbands/{wristband_id}/revoke — Revoke a wristband on a closure"

  - name: GateAttendant
    description: "Gate attendant: posts admissions and exits at the waterpark entrance and activates wristbands presented at the gate. Admission and exit events may only be posted for a wristband belonging to the same resort."
    identity: "opaque"
    exclusive_operations:
      - "POST /resorts/{resort_id}/admissions — Post a gate admission or exit"
    shared_operations:
      - "GET — every list and detail read endpoint"
      - "POST .../wristbands/{wristband_id}/activate — Activate a wristband at the gate"

  - name: Group
    description: "Group organiser: the entity-backed owner of a GroupBooking. A Group may only act on cabana bookings, activity bookings, and group members that belong to its own GroupBooking; the server compares X-User-ID to GroupBooking.id."
    identity: "entity_backed:GroupBooking"
    exclusive_operations:
      - "POST /resorts/{resort_id}/cabana-bookings — Place a cabana hold for a group"
      - "POST .../cabana-bookings/{cabana_booking_id}/confirm — Confirm a held cabana"
      - "POST .../group-bookings/{group_booking_id}/deposits — Record a deposit payment"
      - "POST .../group-bookings/{group_booking_id}/confirm — Confirm a group booking"
      - "POST .../activity-bookings/{activity_booking_id}/confirm — Confirm an activity booking"
      - "POST /resorts/{resort_id}/group-members — Register a group member"
      - "POST /resorts/{resort_id}/reservations — Book a room package under the group"
      - "POST /resorts/{resort_id}/activity-bookings — Book attendees into a session"
    shared_operations:
      - "GET — reads scoped to the caller's own GroupBooking"
      - "POST .../cabana-bookings/{cabana_booking_id}/cancel — Cancel an own cabana occupation"
      - "POST .../group-bookings/{group_booking_id}/cancel — Cancel an own group booking"
      - "POST .../activity-bookings/{activity_booking_id}/cancel — Cancel an own activity booking"
      - "POST .../day-passes — Buy day passes for group guests"

  - name: Anonymous
    description: "Casual caller on the public website: reads public resort and attraction inventory and pays for arcade play against an already-issued wristband. X-User-ID is required for this role but no audit id is pinned, so callers may pass any value; the role cannot mutate rooms, capacity, or staffing."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET /resorts/{resort_id} — Get resort"
      - "GET .../room-types, .../attractions, .../activities, .../cabanas — Public inventory reads"
      - "GET .../wristbands/{wristband_id} — Read an own wristband"
      - "POST .../reservations/{reservation_id}/arcade-credits — Post an arcade credit against a folio"
      - "POST .../wristbands/{wristband_id}/arcade-grants — Post an arcade credit against a wristband"