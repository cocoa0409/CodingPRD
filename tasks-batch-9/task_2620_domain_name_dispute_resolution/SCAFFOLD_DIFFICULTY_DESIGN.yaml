  - rule_id: cross_entity_state_dependency
    instances:

      - name: respondent_notification_is_gated_on_the_domain_row_being_locked
        grounds:
          - validations[priority=53].ERR_DOMAIN_NOT_LOCKED
          - state_machines.DomainName.LOCKED_to_UNLOCKED
          - state_machines.Case.NOTIFICATION_PENDING_to_COMMENCED
          - calculations.response_deadline_projection
          - endpoints.POST_/udrp/domains/{id}/lock
        distinguishing_aspect: |
          Whether a notification may be dispatched is decided by a field on a DomainName row that the
          request never mentions: the case is in NOTIFICATION_PENDING and nothing about it changes,
          yet POST /udrp/cases/{id}/notifications flips from success to ERR_DOMAIN_NOT_LOCKED purely
          because the registrar moved DomainName.lock_status from LOCKED to UNLOCKED, and flips back
          when the lock is reapplied. The dependency runs Case -> DomainName across a
          registrar-controlled entity, so an implementation that only consults the case's own status
          passes every case-level assertion and still fails here.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z throughout."
            - "Registrar IANA-2010 ACTIVE; domain gated.example under it."
            - "Complainant Gated Ltd (country_code FR) files a single-member case; 150000 paid; cleared by cm-002."
            - "The registrar answers the verification with lock_applied true, so DomainName.lock_status is LOCKED and the case is NOTIFICATION_PENDING."
          setup_api_calls:
            - call: "POST /udrp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
            - call: "POST /udrp/registrars"
              payload: { name: "Regis Twenty", iana_id: "IANA-2010", contact_email: "abuse@registwenty.example", verification_response_hours: 48 }
              as: ProviderAdmin
              captures: { reg_id: "$.data.id" }
            - call: "POST /udrp/domains"
              payload: { domain_name: "gated.example", registrar_id: "${reg_id}", registrant_name_public: "Gated Holder", registrant_email_public: "gated@proxy.example", registration_date: "2021-11-11T00:00:00Z", expiry_date: "2027-11-11T00:00:00Z" }
              as: ProviderAdmin
              captures: { dom_id: "$.data.id" }
            - call: "POST /udrp/complainants"
              payload: { legal_name: "Gated Ltd", country_code: "FR", email: "ip@gated.example" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { cpl_id: "$.data.id" }
            - call: "POST /udrp/cases"
              payload: { complainant_id: "${cpl_id}", domain_id: "${dom_id}", mutual_jurisdiction: "US", remedy_requested: "TRANSFER", panel_election: "SINGLE" }
              as: Complainant
              as_user_id: "${cpl_id}"
              captures: { case_id: "$.data.id" }
            - call: "POST /udrp/cases/${case_id}/grounds"
              payload: { ground_type: "TRADEMARK_RIGHTS", assertion_text: "GATED is a registered UK mark.", evidence_count: 1, similarity_claim: "IDENTICAL" }
              as: Complainant
              as_user_id: "${cpl_id}"
            - call: "POST /udrp/cases/${case_id}/grounds"
              payload: { ground_type: "NO_LEGITIMATE_INTEREST", assertion_text: "No licence exists.", evidence_count: 1 }
              as: Complainant
              as_user_id: "${cpl_id}"
            - call: "POST /udrp/cases/${case_id}/grounds"
              payload: { ground_type: "BAD_FAITH", assertion_text: "The registrant redirected traffic to a rival.", evidence_count: 1 }
              as: Complainant
              as_user_id: "${cpl_id}"
            - call: "POST /udrp/cases/${case_id}/fee-transactions"
              payload: { kind: "FILING_FEE", payer: "COMPLAINANT", amount_cents: 150000, reference: "WIRE-2010" }
              as: CaseManager
              as_user_id: "cm-001"
            - call: "POST /udrp/cases/${case_id}/compliance-clearance"
              payload: { reviewer_notes: "Compliant." }
              as: CaseManager
              as_user_id: "cm-002"
            - call: "GET /udrp/cases/${case_id}/registrar-verifications"
              payload: {}
              as: CaseManager
              as_user_id: "cm-002"
              captures: { ver_id: "$.data[0].id" }
            - call: "POST /udrp/cases/${case_id}/registrar-verifications/${ver_id}/response"
              payload: { lock_applied: true, verified_registrant_name: "Gated Registrant", verified_registrant_email: "registrant@gated.example", registrar_remarks: "Lock applied on receipt." }
              as: RegistrarAgent
              as_user_id: "${reg_id}"
              captures: { lock_after_verification: "$.data.id" }
          trigger:
            - call: "POST /udrp/domains/${dom_id}/lock"
              payload: { lock_status: "UNLOCKED" }
              as: RegistrarAgent
              as_user_id: "${reg_id}"
              captures: { lock_state: "$.data.lock_status", dom_ver: "$.data.version" }
            - call: "POST /udrp/cases/${case_id}/notifications"
              payload: { channel: "EMAIL", address: "registrant@gated.example" }
              as: CaseManager
              as_user_id: "cm-001"
            - call: "POST /udrp/domains/${dom_id}/lock"
              payload: { lock_status: "LOCKED" }
              as: RegistrarAgent
              as_user_id: "${reg_id}"
            - call: "POST /udrp/cases/${case_id}/notifications"
              payload: { channel: "EMAIL", address: "registrant@gated.example" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { notif_id: "$.data.id", attempt: "$.data.attempt_number" }
          assert:
            - "After the verification response: DomainName.${dom_id}.lock_status == LOCKED and Case.${case_id}.status == NOTIFICATION_PENDING"
            - "After the registrar releases the lock: DomainName.${dom_id}.lock_status == UNLOCKED and DomainName.version incremented, while Case.${case_id}.status is still NOTIFICATION_PENDING and Case.version is unchanged"
            - "The notification attempted while the domain is UNLOCKED returns ERR_DOMAIN_NOT_LOCKED with HTTP 409"
            - "That refusal creates no RespondentNotification row: GET /udrp/cases/${case_id}/notifications returns meta.total_count == 0"
            - "That refusal leaves Case.${case_id}.provisional_response_due_at null and response_due_at null"
            - "After the lock is reapplied, the identical notification succeeds with HTTP 201: RespondentNotification.${notif_id}.status == DISPATCHED, attempt_number == 1, channel EMAIL, dispatched_at == 2026-08-01T00:00:00Z"
            - "Case.${case_id}.status == COMMENCED and provisional_response_due_at == 2026-08-21T00:00:00Z (EMAIL transmission allowance 0 plus 20 days)"
            - "Case.${case_id}.response_due_at == 2026-08-21T00:00:00Z and deadline_variant_applied == PROVISIONAL"
            - "A RegistrarAgent whose X-User-ID is not ${reg_id} calling POST /udrp/domains/${dom_id}/lock returns ERR_REGISTRAR_MISMATCH with HTTP 403"

      - name: casting_a_vote_requires_an_accepted_seat_on_that_very_case
        grounds:
          - roles.Panelist
          - validations[priority=28].ERR_NOT_SEAT_HOLDER
          - validations[priority=68].ERR_VOTE_ALREADY_CAST
          - entities.PanelVote.fields.voter_panelist_id
          - endpoints.POST_/udrp/decisions/{id}/votes
        distinguishing_aspect: |
          The right to write a PanelVote lives on a third entity: not on the caller's role, not on the
          Decision, but on the PanelistAppointment row that links this panelist to this case in status
          ACCEPTED. A second roster panelist with a perfectly valid Panelist identity is refused with
          ERR_NOT_SEAT_HOLDER at 403, and the seated panelist's second attempt is refused with
