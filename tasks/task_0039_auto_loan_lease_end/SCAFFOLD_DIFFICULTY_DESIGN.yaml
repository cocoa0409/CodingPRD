# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2 instances = 18 instances. Grounds resolve into SCAFFOLD.yaml §1.1-§1.7.
# All numeric asserts pre-computed against the canonical RateCard "2026-Q2":
#   tier_1_min_fico=740, tier_2_min_fico=680, tier_3_min_fico=620 (below=TIER_4)
#   tier_1_apr=0.0399, tier_2_apr=0.0599, tier_3_apr=0.0899, tier_4_apr=0.1499
#   lease_money_factor=0.00125, default_rate_apr=0.2499, lease_tax_rate=0.0725
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: loan_payoff_actuarial_vs_gross_diverge
        grounds:
          - calculations.loan_payoff_quote
          - calculations.loan_principal_balance
          - entities.Loan.fields.principal_balance_cents
          - state_machines.Loan.CURRENT_to_PAID_OFF
        distinguishing_aspect: "On a Loan domain: actuarial payoff (remaining scheduled principal) and gross payoff (monthly*remaining periods) differ for the same loan after 12 payments — 2039020 vs 2209440."
        test_recipe:
          setup:
            - "Active RateCard 2026-Q2; Customer fico 760 (TIER_1); Vehicle sale_price 3000000; Loan financed 2500000, term 60, monthly 46030; 12 scheduled payments posted."
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "2026-Q2", tier_1_min_fico: 740, tier_2_min_fico: 680, tier_3_min_fico: 620, tier_1_apr: 0.0399, tier_2_apr: 0.0599, tier_3_apr: 0.0899, tier_4_apr: 0.1499, lease_money_factor: 0.00125, default_rate_apr: 0.2499, lease_tax_rate: 0.0725 }
              as: FinanceManager
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: FinanceManager
            - call: "POST /customers"
              payload: { full_name: "Ada Borrower", email: "ada@x.com", fico_score: 760 }
              as: FinanceManager
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "VIN-A1", make_model: "Acme Sedan LX", msrp_cents: 3200000, sale_price_cents: 3000000, residual_value_cents: 1850000 }
              as: FinanceManager
              captures: { veh_id: $.data.id }
            - call: "POST /loans"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", down_payment_cents: 500000, term_months: 60, gap_insurance: false }
              as: FinanceManager
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/payments"
              payload: { amount_cents: 46030, kind: "SCHEDULED" }
              as: Borrower
              as_user_id: "${cust_id}"
            - call: "POST /loans/${loan_id}/payments"
              payload: { amount_cents: 46030, kind: "SCHEDULED" }
              as: Borrower
              as_user_id: "${cust_id}"
            - call: "POST /loans/${loan_id}/payments"
              payload: { amount_cents: 46030, kind: "SCHEDULED" }
              as: Borrower
              as_user_id: "${cust_id}"
            - call: "POST /loans/${loan_id}/payments"
              payload: { amount_cents: 46030, kind: "SCHEDULED" }
              as: Borrower
              as_user_id: "${cust_id}"
            - call: "POST /loans/${loan_id}/payments"
              payload: { amount_cents: 46030, kind: "SCHEDULED" }
              as: Borrower
              as_user_id: "${cust_id}"
            - call: "POST /loans/${loan_id}/payments"
              payload: { amount_cents: 46030, kind: "SCHEDULED" }
              as: Borrower
              as_user_id: "${cust_id}"
            - call: "POST /loans/${loan_id}/payments"
              payload: { amount_cents: 46030, kind: "SCHEDULED" }
              as: Borrower
              as_user_id: "${cust_id}"
            - call: "POST /loans/${loan_id}/payments"
              payload: { amount_cents: 46030, kind: "SCHEDULED" }
              as: Borrower
              as_user_id: "${cust_id}"
            - call: "POST /loans/${loan_id}/payments"
              payload: { amount_cents: 46030, kind: "SCHEDULED" }
              as: Borrower
              as_user_id: "${cust_id}"
            - call: "POST /loans/${loan_id}/payments"
              payload: { amount_cents: 46030, kind: "SCHEDULED" }
              as: Borrower
              as_user_id: "${cust_id}"
            - call: "POST /loans/${loan_id}/payments"
              payload: { amount_cents: 46030, kind: "SCHEDULED" }
              as: Borrower
              as_user_id: "${cust_id}"
            - call: "POST /loans/${loan_id}/payments"
              payload: { amount_cents: 46030, kind: "SCHEDULED" }
              as: Borrower
              as_user_id: "${cust_id}"
          trigger:
            - call: "GET /loans/${loan_id}/payoff-quote"
              payload: {}
              as: Borrower
              as_user_id: "${cust_id}"
              captures: { act: $.data.actuarial_payoff_cents, gross: $.data.gross_payoff_cents }
          assert:
            - "actuarial_payoff_cents == 2039020"
            - "gross_payoff_cents == 2209440"
            - "unearned_interest_cents == 170420"

      - name: lease_end_return_vs_purchase_diverge
        grounds:
          - calculations.lease_end_settlement
          - entities.LeaseEndSettlement.fields.total_due_cents
          - state_machines.Lease.MATURING_to_RETURNED
          - state_machines.Lease.MATURING_to_PURCHASED
        distinguishing_aspect: "On a Lease domain (different entity than loan payoff): identical matured lease yields total_due 145094 under RETURN vs 1880000 under PURCHASE — divergent algorithms, divergent results."
        test_recipe:
          setup:
            - "Active RateCard 2026-Q2; two identical matured leases L1, L2 (sale 3200000 down 0, residual 1850000, term 36, allowance 12000, per_mile 22.5, disposition 39500, purchase_fee 30000)."
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "2026-Q2", tier_1_min_fico: 740, tier_2_min_fico: 680, tier_3_min_fico: 620, tier_1_apr: 0.0399, tier_2_apr: 0.0599, tier_3_apr: 0.0899, tier_4_apr: 0.1499, lease_money_factor: 0.00125, default_rate_apr: 0.2499, lease_tax_rate: 0.0725 }
              as: FinanceManager
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: FinanceManager
            - call: "POST /customers"
              payload: { full_name: "Bo Lessee", email: "bo@x.com", fico_score: 760 }
              as: FinanceManager
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "VIN-L1", make_model: "Acme Wagon", msrp_cents: 3400000, sale_price_cents: 3200000, residual_value_cents: 1850000 }
              as: FinanceManager
              captures: { veh1_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "VIN-L2", make_model: "Acme Wagon", msrp_cents: 3400000, sale_price_cents: 3200000, residual_value_cents: 1850000 }
              as: FinanceManager
              captures: { veh2_id: $.data.id }
            - call: "POST /leases"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh1_id}", down_payment_cents: 0, term_months: 36, annual_mileage_allowance: 12000, per_mile_overage_rate_cents: 22.5, disposition_fee_cents: 39500, purchase_option_fee_cents: 30000, gap_insurance: false }
              as: FinanceManager
              captures: { lease1_id: $.data.id }
            - call: "POST /leases"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh2_id}", down_payment_cents: 0, term_months: 36, annual_mileage_allowance: 12000, per_mile_overage_rate_cents: 22.5, disposition_fee_cents: 39500, purchase_option_fee_cents: 30000, gap_insurance: false }
              as: FinanceManager
              captures: { lease2_id: $.data.id }
            - call: "POST /leases/${lease1_id}/mature"
              payload: {}
              as: FinanceManager
              captures: { l1_v: $.data.version }
            - call: "POST /leases/${lease2_id}/mature"
              payload: {}
              as: FinanceManager
              captures: { l2_v: $.data.version }
          trigger:
            - call: "POST /lease-end-settlements"
              payload: { lease_id: "${lease1_id}", election: "RETURN", odometer_miles: 40693, expected_lease_version: "${l1_v}", per_year_excess_miles: [1501, 1701, 1491] }
              as: Borrower
              as_user_id: "${cust_id}"
              captures: { ret_total: $.data.total_due_cents }
            - call: "POST /lease-end-settlements"
              payload: { lease_id: "${lease2_id}", election: "PURCHASE", odometer_miles: 38000, expected_lease_version: "${l2_v}" }
              as: Borrower
              as_user_id: "${cust_id}"
              captures: { pur_total: $.data.total_due_cents }
          assert:
            - "RETURN settlement total_due_cents == 145094"
            - "PURCHASE settlement total_due_cents == 1880000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: lease_monthly_evaluation_order_pinned
        grounds:
          - calculations.lease_monthly_payment
          - entities.Lease.fields.monthly_payment_cents
          - entities.Lease.fields.base_monthly_cents
        distinguishing_aspect: "Mode (c) circular-looking/evaluation-order: depreciation_fee + finance_fee computed unrounded, base and tax each rounded from the SAME unrounded sum then added -> 43813 + 3176 = 46989 (taxing a pre-rounded base would diverge)."
        test_recipe:
          setup:
            - "Active RateCard 2026-Q2 (money_factor 0.00125, tax 0.0725); Vehicle sale 3200000 residual 1850000; Lease down 0, term 36."
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "2026-Q2", tier_1_min_fico: 740, tier_2_min_fico: 680, tier_3_min_fico: 620, tier_1_apr: 0.0399, tier_2_apr: 0.0599, tier_3_apr: 0.0899, tier_4_apr: 0.1499, lease_money_factor: 0.00125, default_rate_apr: 0.2499, lease_tax_rate: 0.0725 }
              as: FinanceManager
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: FinanceManager
            - call: "POST /customers"
              payload: { full_name: "Cy Lessee", email: "cy@x.com", fico_score: 760 }
              as: FinanceManager
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "VIN-C1", make_model: "Acme Wagon", msrp_cents: 3400000, sale_price_cents: 3200000, residual_value_cents: 1850000 }
              as: FinanceManager
              captures: { veh_id: $.data.id }
          trigger:
            - call: "POST /leases"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", down_payment_cents: 0, term_months: 36, annual_mileage_allowance: 12000, per_mile_overage_rate_cents: 22.5, disposition_fee_cents: 39500, purchase_option_fee_cents: 30000, gap_insurance: false }
              as: FinanceManager
              captures: { lease_id: $.data.id }
          assert:
            - "Lease.base_monthly_cents == 43813"
            - "Lease.monthly_payment_cents == 46989"

      - name: lease_mileage_overage_round_per_year_then_sum
        grounds:
          - calculations.lease_mileage_overage
          - entities.LeaseEndSettlement.fields.mileage_overage_cents
          - state_machines.Lease.MATURING_to_RETURNED
        distinguishing_aspect: "Mode (b) nested rounding order (different mode than the lease_monthly evaluation-order instance): per_year_excess_miles [1501,1701,1491] * 22.5 rounded PER year then summed = 105594, vs sum-then-round = 105593."
        test_recipe:
          setup:
            - "Active RateCard; matured Lease (per_mile 22.5, term 36)."
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "2026-Q2", tier_1_min_fico: 740, tier_2_min_fico: 680, tier_3_min_fico: 620, tier_1_apr: 0.0399, tier_2_apr: 0.0599, tier_3_apr: 0.0899, tier_4_apr: 0.1499, lease_money_factor: 0.00125, default_rate_apr: 0.2499, lease_tax_rate: 0.0725 }
              as: FinanceManager
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: FinanceManager
            - call: "POST /customers"
              payload: { full_name: "Di Lessee", email: "di@x.com", fico_score: 760 }
              as: FinanceManager
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "VIN-D1", make_model: "Acme Wagon", msrp_cents: 3400000, sale_price_cents: 3200000, residual_value_cents: 1850000 }
              as: FinanceManager
              captures: { veh_id: $.data.id }
            - call: "POST /leases"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", down_payment_cents: 0, term_months: 36, annual_mileage_allowance: 12000, per_mile_overage_rate_cents: 22.5, disposition_fee_cents: 39500, purchase_option_fee_cents: 30000, gap_insurance: false }
              as: FinanceManager
              captures: { lease_id: $.data.id }
            - call: "POST /leases/${lease_id}/mature"
              payload: {}
              as: FinanceManager
              captures: { l_v: $.data.version }
          trigger:
            - call: "POST /lease-end-settlements"
              payload: { lease_id: "${lease_id}", election: "RETURN", odometer_miles: 40693, expected_lease_version: "${l_v}", per_year_excess_miles: [1501, 1701, 1491] }
              as: Borrower
              as_user_id: "${cust_id}"
              captures: { ov: $.data.mileage_overage_cents }
          assert:
            - "LeaseEndSettlement.mileage_overage_cents == 105594"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: loan_current_delinquent_cure_cycle
        grounds:
          - state_machines.Loan.CURRENT_to_DELINQUENT
          - state_machines.Loan.DELINQUENT_to_CURRENT
          - entities.Loan.fields.missed_payment_count
        distinguishing_aspect: "Loan entity exhibits a cycle CURRENT->DELINQUENT->CURRENT (cure loop); after cure the loan is CURRENT again with missed_payment_count reset to 0."
        test_recipe:
          setup:
            - "Active RateCard; Customer TIER_1; Loan CURRENT monthly 46030; one missed payment makes it DELINQUENT."
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "2026-Q2", tier_1_min_fico: 740, tier_2_min_fico: 680, tier_3_min_fico: 620, tier_1_apr: 0.0399, tier_2_apr: 0.0599, tier_3_apr: 0.0899, tier_4_apr: 0.1499, lease_money_factor: 0.00125, default_rate_apr: 0.2499, lease_tax_rate: 0.0725 }
              as: FinanceManager
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: FinanceManager
            - call: "POST /customers"
              payload: { full_name: "Ed Borrower", email: "ed@x.com", fico_score: 760 }
              as: FinanceManager
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "VIN-E1", make_model: "Acme Sedan", msrp_cents: 3200000, sale_price_cents: 3000000, residual_value_cents: 1850000 }
              as: FinanceManager
              captures: { veh_id: $.data.id }
            - call: "POST /loans"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", down_payment_cents: 500000, term_months: 60, gap_insurance: false }
              as: FinanceManager
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/miss-payment"
              payload: {}
              as: FinanceManager
          trigger:
            - call: "POST /loans/${loan_id}/payments"
              payload: { amount_cents: 46030, kind: "SCHEDULED" }
              as: Borrower
              as_user_id: "${cust_id}"
              captures: { lf: $.data.late_fee_cents }
            - call: "GET /loans/${loan_id}"
              payload: {}
              as: Borrower
              as_user_id: "${cust_id}"
              captures: { st: $.data.status, mc: $.data.missed_payment_count }
          assert:
            - "Loan.status == CURRENT"
            - "Loan.missed_payment_count == 0"
            - "Payment.late_fee_cents == 2500"

      - name: lease_maturing_branching_fork_join
        grounds:
          - state_machines.Lease.MATURING_to_RETURNED
          - state_machines.Lease.MATURING_to_PURCHASED
          - state_machines.Lease.MATURING_to_RENEWED
          - state_machines.Lease.RENEWED_to_SETTLED
        distinguishing_aspect: "Lease entity (different from Loan) forks from MATURING into RENEWED with a divergent side-effect set (mints a new ACTIVE lease), then joins to terminal SETTLED."
        test_recipe:
          setup:
            - "Active RateCard; matured Lease ready for election."
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "2026-Q2", tier_1_min_fico: 740, tier_2_min_fico: 680, tier_3_min_fico: 620, tier_1_apr: 0.0399, tier_2_apr: 0.0599, tier_3_apr: 0.0899, tier_4_apr: 0.1499, lease_money_factor: 0.00125, default_rate_apr: 0.2499, lease_tax_rate: 0.0725 }
              as: FinanceManager
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: FinanceManager
            - call: "POST /customers"
              payload: { full_name: "Fi Lessee", email: "fi@x.com", fico_score: 760 }
              as: FinanceManager
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "VIN-F1", make_model: "Acme Wagon", msrp_cents: 3400000, sale_price_cents: 3200000, residual_value_cents: 1850000 }
              as: FinanceManager
              captures: { veh_id: $.data.id }
            - call: "POST /leases"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", down_payment_cents: 0, term_months: 36, annual_mileage_allowance: 12000, per_mile_overage_rate_cents: 22.5, disposition_fee_cents: 39500, purchase_option_fee_cents: 30000, gap_insurance: false }
              as: FinanceManager
              captures: { lease_id: $.data.id }
            - call: "POST /leases/${lease_id}/mature"
              payload: {}
              as: FinanceManager
              captures: { l_v: $.data.version }
          trigger:
            - call: "POST /lease-end-settlements"
              payload: { lease_id: "${lease_id}", election: "RENEW", odometer_miles: 35000, expected_lease_version: "${l_v}", renew_term_months: 24 }
              as: Borrower
              as_user_id: "${cust_id}"
              captures: { new_lease: $.data.renewed_lease_id }
            - call: "GET /leases/${lease_id}"
              payload: {}
              as: Borrower
              as_user_id: "${cust_id}"
              captures: { st: $.data.status }
          assert:
            - "Lease.status == SETTLED"
            - "LeaseEndSettlement.renewed_lease_id is non-null"
            - "LeaseEndSettlement.total_due_cents == 0"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: payoff_cascade_balance_vehicle_version
        grounds:
          - state_machines.Loan.CURRENT_to_PAID_OFF
          - entities.Vehicle.fields.status
          - entities.Loan.fields.principal_balance_cents
        distinguishing_aspect: "Depth >= 3 from POST /loans/{id}/payoff: payoff posts a PAYOFF Payment -> Loan.status PAID_OFF + principal_balance_cents 0 -> Vehicle.status flips to AVAILABLE (chain links each caused by prior)."
        test_recipe:
          setup:
            - "Active RateCard; Customer TIER_1; Loan CURRENT financed 2500000 monthly 46030, no payments made (payoff = financed 2500000)."
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "2026-Q2", tier_1_min_fico: 740, tier_2_min_fico: 680, tier_3_min_fico: 620, tier_1_apr: 0.0399, tier_2_apr: 0.0599, tier_3_apr: 0.0899, tier_4_apr: 0.1499, lease_money_factor: 0.00125, default_rate_apr: 0.2499, lease_tax_rate: 0.0725 }
              as: FinanceManager
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: FinanceManager
            - call: "POST /customers"
              payload: { full_name: "Gus Borrower", email: "gus@x.com", fico_score: 760 }
              as: FinanceManager
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "VIN-G1", make_model: "Acme Sedan", msrp_cents: 3200000, sale_price_cents: 3000000, residual_value_cents: 1850000 }
              as: FinanceManager
              captures: { veh_id: $.data.id }
            - call: "POST /loans"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", down_payment_cents: 500000, term_months: 60, gap_insurance: false }
              as: FinanceManager
              captures: { loan_id: $.data.id, loan_v: $.data.version }
          trigger:
            - call: "POST /loans/${loan_id}/payoff"
              payload: { amount_cents: 2500000, expected_loan_version: "${loan_v}" }
              as: Borrower
              as_user_id: "${cust_id}"
            - call: "GET /vehicles/${veh_id}"
              payload: {}
              as: FinanceManager
              captures: { vstat: $.data.status }
          assert:
            - "Loan.status == PAID_OFF"
            - "Loan.principal_balance_cents == 0"
            - "Vehicle.status == AVAILABLE"

      - name: default_cascade_vehicle_and_gap_waiver
        grounds:
          - state_machines.Loan.DELINQUENT_to_DEFAULT
          - calculations.gap_deficiency_waiver
          - entities.Vehicle.fields.status
        distinguishing_aspect: "Depth >= 2 from a DIFFERENT trigger (POST /loans/{id}/default): default -> Vehicle.status AVAILABLE (repossession) AND gap deficiency waiver fires; distinct propagation pattern from the payoff cascade."
        test_recipe:
          setup:
            - "Active RateCard; Customer TIER_1; Loan with gap_insurance true, financed 2500000 (no payments), driven DELINQUENT with 3 missed payments."
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "2026-Q2", tier_1_min_fico: 740, tier_2_min_fico: 680, tier_3_min_fico: 620, tier_1_apr: 0.0399, tier_2_apr: 0.0599, tier_3_apr: 0.0899, tier_4_apr: 0.1499, lease_money_factor: 0.00125, default_rate_apr: 0.2499, lease_tax_rate: 0.0725 }
              as: FinanceManager
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: FinanceManager
            - call: "POST /customers"
              payload: { full_name: "Hal Borrower", email: "hal@x.com", fico_score: 760 }
              as: FinanceManager
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "VIN-H1", make_model: "Acme Sedan", msrp_cents: 3200000, sale_price_cents: 3000000, residual_value_cents: 1850000 }
              as: FinanceManager
              captures: { veh_id: $.data.id }
            - call: "POST /loans"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", down_payment_cents: 500000, term_months: 60, gap_insurance: true }
              as: FinanceManager
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/miss-payment"
              payload: {}
              as: FinanceManager
