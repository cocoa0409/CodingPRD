              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 with error_id == ERR_INVALID_STATE_TRANSITION - there is no ACTIVE -> ACTIVE edge"
            - "LoyaltyProgram.${prog_id}.current_breakage_rate_bp is STILL 1800 - the refused call did not re-seed it to 2500"
            - "LoyaltyProgram.${prog_id}.version == ${prog_v2}, unchanged by the refused call"
            - "The same rejection applies to a second suspend on a SUSPENDED program and to a second submit on a SUBMITTED estimate: repeating a completed transition is an error, not a no-op"

      - name: state_program_closed_is_terminal_and_locks_all_transitions
        claim_type: Terminal State Lockdown
        grounds:
