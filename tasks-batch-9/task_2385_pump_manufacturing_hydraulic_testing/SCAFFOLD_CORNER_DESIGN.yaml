          - endpoints["GET /pump-models/{id}"]
        distinguishing_aspect: |
          Every one of the eight roles lists every GET endpoint as a shared operation, so the hydraulic
          catalogue is readable by the foundry, the test bay, the warranty desk and the planner alike -
