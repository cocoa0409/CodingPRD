# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Birthday Party & Kids' Venue Booking — EXPERT band.
# 9 Difficulty Rules × 2 instances = 18 instances. Every grounds ref resolves
# into SCAFFOLD.yaml §1.1–§1.6; every setup_api_calls chain is empty-DB executable.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      # --- Instance 1: estimate (quote) vs settlement (final) on Booking ---
      - name: dvc_quote_estimate_vs_settlement_peak
        grounds:
          - calculations.booking_quote_total
          - calculations.booking_final_total
          - entities.Booking.fields.quote_total_cents
          - entities.Booking.fields.final_total_cents
          - state_machines.Booking.CONFIRMED_to_COMPLETED
        distinguishing_aspect: |
          The estimate prices overage on the live (net-current) children_count (9 -> quote 48000),
          while the settlement prices overage on the PEAK realized count from the roster replay
          (14 -> final 55500); both run on the Booking entity but the two algorithms (forward_looking
          vs chronological) produce a 7500-cent divergence for identical line items.
        test_recipe:
          setup:
            - "Venue V (weather_dependent false), Room R (max_capacity 20, buffer 30), Package P (base 30000, included 8, per_extra 1500, deposit_pct 0.25, base_duration 120)."
            - "Booking B created children=8; add CAKE(4500) + CHARACTER(12000); HELD; host+entertainer+cook staffed; 8 waivers signed; paid 46500 (full of quote); CONFIRMED."
            - "Roster: +6 children (->14), then -5 children (->9). Pay 9000 more to clear settlement balance. Clock advanced past event_end."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", weather_dependent: false }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", name: "R", max_capacity: 20, buffer_minutes: 30 }
              as: VenueManager
              captures: { r_id: $.data.id }
            - call: "POST /packages"
              payload: { venue_id: "${v_id}", theme: "Dino", base_price_cents: 30000, included_children: 8, per_extra_child_cents: 1500, base_duration_minutes: 120, deposit_pct: 0.25 }
              as: VenueManager
              captures: { p_id: $.data.id }
            - call: "POST /staff-members"
              payload: { venue_id: "${v_id}", full_name: "Host H", skills: ["HOST"] }
              as: VenueManager
              captures: { sm_host: $.data.id }
            - call: "POST /staff-members"
              payload: { venue_id: "${v_id}", full_name: "Ent E", skills: ["ENTERTAINER"] }
              as: VenueManager
              captures: { sm_ent: $.data.id }
            - call: "POST /staff-members"
              payload: { venue_id: "${v_id}", full_name: "Cook C", skills: ["COOK"] }
              as: VenueManager
              captures: { sm_cook: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T09:00:00Z" }
              as: Coordinator
            - call: "POST /bookings"
              payload: { room_id: "${r_id}", package_id: "${p_id}", event_start_utc: "2026-07-01T10:00:00Z", children_count: 8 }
              as: Coordinator
              captures: { b_id: $.data.id }
            - call: "POST /bookings/${b_id}/add-ons"
              payload: { kind: "CAKE", unit_price_cents: 4500, quantity: 1 }
              as: Coordinator
            - call: "POST /bookings/${b_id}/add-ons"
              payload: { kind: "CHARACTER", unit_price_cents: 12000, quantity: 1 }
              as: Coordinator
            - call: "POST /bookings/${b_id}/hold"
              payload: {}
              as: Coordinator
            - call: "POST /bookings/${b_id}/staff-assignments"
              payload: { staff_member_id: "${sm_host}", role_on_event: "HOST" }
              as: Coordinator
            - call: "POST /bookings/${b_id}/staff-assignments"
              payload: { staff_member_id: "${sm_ent}", role_on_event: "ENTERTAINER" }
              as: Coordinator
            - call: "POST /bookings/${b_id}/staff-assignments"
              payload: { staff_member_id: "${sm_cook}", role_on_event: "COOK" }
              as: Coordinator
            - call: "POST /bookings/${b_id}/waivers"
              payload: { child_name: "c1", guardian_signature: "sig" }
              as: Coordinator
              captures: { w1: $.data.id }
            - call: "POST /bookings/${b_id}/waivers/${w1}/sign"
              payload: { guardian_signature: "sig" }
              as: Coordinator
            - call: "POST /bookings/${b_id}/payments"
              payload: { direction: "CHARGE", amount_cents: 46500, purpose: "BALANCE" }
              as: FinanceClerk
            - call: "POST /bookings/${b_id}/confirm"
              payload: {}
              as: Coordinator
            - call: "POST /bookings/${b_id}/guest-parties"
              payload: { children_delta: 6, reason: "more kids" }
              as: Coordinator
            - call: "POST /bookings/${b_id}/guest-parties"
              payload: { children_delta: -5, reason: "fewer kids" }
              as: Coordinator
            - call: "POST /bookings/${b_id}/payments"
              payload: { direction: "CHARGE", amount_cents: 9000, purpose: "BALANCE" }
              as: FinanceClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T13:00:00Z" }
              as: Coordinator
          trigger:
            - call: "POST /bookings/${b_id}/complete"
              payload: {}
              as: Coordinator
              captures: { final_total: $.data.final_total_cents, quote_total: $.data.quote_total_cents }
          assert:
            - "Booking.${b_id}.quote_total_cents == 48000"
            - "Booking.${b_id}.final_total_cents == 55500"
            - "Booking.${b_id}.status == COMPLETED"
            - "Booking.${b_id}.final_total_cents != Booking.${b_id}.quote_total_cents"

      # --- Instance 2: cancellation refund tiered (forfeit deposit) vs full ---
      - name: dvc_cancellation_refund_forfeit_vs_full
        grounds:
          - calculations.cancellation_refund
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - entities.Booking.fields.deposit_due_cents
          - entities.Payment.fields.purpose
        distinguishing_aspect: |
          Cancelling a CONFIRMED booking inside the 72h forfeiture window withholds deposit_due_cents
          (paid 46500, deposit 11625 -> refund 34875), whereas the full-refund variant returns the
          entire 46500 — a different conserved-money variant than the booking_quote/final pair, keyed
          on event-clock distance rather than headcount replay.
        test_recipe:
          setup:
            - "Venue/Room/Package as instance 1. Booking confirmed, paid full 46500 (quote 46500 with CAKE+CHARACTER, children 8)."
            - "Clock set 12h before event_start (inside 72h window) so deposit_forfeit variant applies."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V2", weather_dependent: false }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", name: "R2", max_capacity: 20, buffer_minutes: 30 }
              as: VenueManager
              captures: { r_id: $.data.id }
            - call: "POST /packages"
              payload: { venue_id: "${v_id}", theme: "Dino", base_price_cents: 30000, included_children: 8, per_extra_child_cents: 1500, base_duration_minutes: 120, deposit_pct: 0.25 }
              as: VenueManager
              captures: { p_id: $.data.id }
            - call: "POST /staff-members"
              payload: { venue_id: "${v_id}", full_name: "Host H", skills: ["HOST"] }
              as: VenueManager
              captures: { sm_host: $.data.id }
            - call: "POST /staff-members"
              payload: { venue_id: "${v_id}", full_name: "Ent E", skills: ["ENTERTAINER"] }
              as: VenueManager
              captures: { sm_ent: $.data.id }
            - call: "POST /staff-members"
              payload: { venue_id: "${v_id}", full_name: "Cook C", skills: ["COOK"] }
              as: VenueManager
              captures: { sm_cook: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T09:00:00Z" }
              as: Coordinator
            - call: "POST /bookings"
              payload: { room_id: "${r_id}", package_id: "${p_id}", event_start_utc: "2026-07-01T10:00:00Z", children_count: 8 }
              as: Coordinator
              captures: { b_id: $.data.id }
            - call: "POST /bookings/${b_id}/add-ons"
              payload: { kind: "CAKE", unit_price_cents: 4500, quantity: 1 }
              as: Coordinator
            - call: "POST /bookings/${b_id}/add-ons"
              payload: { kind: "CHARACTER", unit_price_cents: 12000, quantity: 1 }
              as: Coordinator
            - call: "POST /bookings/${b_id}/hold"
              payload: {}
              as: Coordinator
            - call: "POST /bookings/${b_id}/staff-assignments"
              payload: { staff_member_id: "${sm_host}", role_on_event: "HOST" }
              as: Coordinator
            - call: "POST /bookings/${b_id}/staff-assignments"
              payload: { staff_member_id: "${sm_ent}", role_on_event: "ENTERTAINER" }
              as: Coordinator
            - call: "POST /bookings/${b_id}/staff-assignments"
              payload: { staff_member_id: "${sm_cook}", role_on_event: "COOK" }
              as: Coordinator
            - call: "POST /bookings/${b_id}/waivers"
              payload: { child_name: "c1", guardian_signature: "sig" }
              as: Coordinator
              captures: { w1: $.data.id }
            - call: "POST /bookings/${b_id}/waivers/${w1}/sign"
              payload: { guardian_signature: "sig" }
              as: Coordinator
            - call: "POST /bookings/${b_id}/payments"
              payload: { direction: "CHARGE", amount_cents: 46500, purpose: "BALANCE" }
              as: FinanceClerk
            - call: "POST /bookings/${b_id}/confirm"
              payload: {}
              as: Coordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-30T22:00:00Z" }
              as: Coordinator
          trigger:
            - call: "POST /bookings/${b_id}/cancel"
              payload: {}
              as: Coordinator
          assert:
            - "Booking.${b_id}.status == CANCELLED"
            - "Booking.${b_id}.amount_paid_cents == 11625"
            - "Booking.${b_id}.payment_status == DEPOSIT_PAID"
            - "A SETTLED REFUND Payment with purpose CANCELLATION_REFUND and amount_cents == 34875 exists on Booking.${b_id}"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      # --- Mode (c): circular-looking dependency, pinned evaluation order ---
      - name: cf_deposit_balance_eval_order
        grounds:
          - calculations.deposit_due_amount
          - calculations.booking_quote_total
          - entities.Booking.fields.deposit_due_cents
          - entities.Booking.fields.balance_due_cents
          - state_machines.Booking.QUOTE_DRAFT_to_HELD
        distinguishing_aspect: |
          Mode (c): deposit_due depends on quote_total, balance_due depends on quote_total and
          amount_paid (NOT on deposit_due), so the apparent quote<->deposit<->balance cycle is broken
          by the pinned order quote -> deposit -> balance; with quote 46500 and deposit_pct 0.25,
          ceil(46500*0.25)=11625 and balance=46500-0=46500 at HELD.
        test_recipe:
          setup:
            - "Venue/Room/Package (deposit_pct 0.25). Booking children 8 + CAKE 4500 + CHARACTER 12000 -> quote 46500, no payments. Move to HELD."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V3", weather_dependent: false }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", name: "R3", max_capacity: 20, buffer_minutes: 30 }
              as: VenueManager
              captures: { r_id: $.data.id }
            - call: "POST /packages"
              payload: { venue_id: "${v_id}", theme: "Dino", base_price_cents: 30000, included_children: 8, per_extra_child_cents: 1500, base_duration_minutes: 120, deposit_pct: 0.25 }
              as: VenueManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T09:00:00Z" }
              as: Coordinator
            - call: "POST /bookings"
              payload: { room_id: "${r_id}", package_id: "${p_id}", event_start_utc: "2026-07-01T10:00:00Z", children_count: 8 }
              as: Coordinator
              captures: { b_id: $.data.id }
            - call: "POST /bookings/${b_id}/add-ons"
              payload: { kind: "CAKE", unit_price_cents: 4500, quantity: 1 }
              as: Coordinator
            - call: "POST /bookings/${b_id}/add-ons"
              payload: { kind: "CHARACTER", unit_price_cents: 12000, quantity: 1 }
              as: Coordinator
          trigger:
            - call: "POST /bookings/${b_id}/hold"
              payload: {}
              as: Coordinator
              captures: { dep: $.data.deposit_due_cents, bal: $.data.balance_due_cents }
          assert:
            - "Booking.${b_id}.quote_total_cents == 46500"
            - "Booking.${b_id}.deposit_due_cents == 11625"
            - "Booking.${b_id}.balance_due_cents == 46500"

      # --- Mode (a): >=3 inputs, non-linear room window geometry ---
      - name: cf_room_window_geometry_half_open
        grounds:
          - calculations.room_window_occupancy
          - entities.Room.fields.buffer_minutes
          - entities.Booking.fields.event_end_utc
          - state_machines.Booking.QUOTE_DRAFT_to_HELD
        distinguishing_aspect: |
          Mode (a): the conflict predicate combines >=3 inputs (candidate start, existing
          end_with_buffer, Room.buffer_minutes) with non-linear AND-of-inequalities; a second hold
          starting exactly at the first booking's 12:30 buffer edge is ACCEPTED (half-open), proving
          the geometry rather than a flat threshold.
        test_recipe:
          setup:
            - "Room buffer 30. Booking A held at 10:00 (occ [10:00,12:30)). Booking B created starting 12:30 (adjacent)."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V4", weather_dependent: false }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", name: "R4", max_capacity: 20, buffer_minutes: 30 }
              as: VenueManager
              captures: { r_id: $.data.id }
            - call: "POST /packages"
              payload: { venue_id: "${v_id}", theme: "Dino", base_price_cents: 30000, included_children: 8, per_extra_child_cents: 1500, base_duration_minutes: 120, deposit_pct: 0.25 }
              as: VenueManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T09:00:00Z" }
              as: Coordinator
            - call: "POST /bookings"
              payload: { room_id: "${r_id}", package_id: "${p_id}", event_start_utc: "2026-07-01T10:00:00Z", children_count: 8 }
              as: Coordinator
              captures: { a_id: $.data.id }
            - call: "POST /bookings/${a_id}/hold"
              payload: {}
              as: Coordinator
            - call: "POST /bookings"
              payload: { room_id: "${r_id}", package_id: "${p_id}", event_start_utc: "2026-07-01T12:30:00Z", children_count: 8 }
              as: Coordinator
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /bookings/${b_id}/hold"
              payload: {}
              as: Coordinator
          assert:
            - "Booking.${b_id}.status == HELD"
            - "Booking.${b_id}.event_end_utc == 2026-07-01T14:30:00Z"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      # --- Booking cyclic weather branch (CONFIRMED->WEATHER_HOLD->RESCHEDULED->CONFIRMED) ---
      - name: nlsm_booking_weather_reschedule_cycle
        grounds:
          - state_machines.Booking.CONFIRMED_to_WEATHER_HOLD
          - state_machines.Booking.WEATHER_HOLD_to_RESCHEDULED
          - state_machines.Booking.RESCHEDULED_to_CONFIRMED
          - entities.Booking.fields.reschedule_count
        distinguishing_aspect: |
          The Booking machine forms a cycle CONFIRMED->WEATHER_HOLD->RESCHEDULED->CONFIRMED with
          reschedule_count incrementing each loop; this is non-linear on the Booking entity (distinct
          from the Waiver branch below).
        test_recipe:
          setup:
            - "Weather-eligible booking (OUTDOOR room, weather_dependent venue) CONFIRMED, clock before event_start."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Vw", weather_dependent: true }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", name: "Rw", room_kind: "OUTDOOR", max_capacity: 20, buffer_minutes: 30 }
              as: VenueManager
              captures: { r_id: $.data.id }
            - call: "POST /packages"
              payload: { venue_id: "${v_id}", theme: "Dino", base_price_cents: 30000, included_children: 8, per_extra_child_cents: 1500, base_duration_minutes: 120, deposit_pct: 0.25 }
              as: VenueManager
              captures: { p_id: $.data.id }
            - call: "POST /staff-members"
              payload: { venue_id: "${v_id}", full_name: "Host H", skills: ["HOST"] }
              as: VenueManager
              captures: { sm_host: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T09:00:00Z" }
              as: Coordinator
            - call: "POST /bookings"
              payload: { room_id: "${r_id}", package_id: "${p_id}", event_start_utc: "2026-07-01T10:00:00Z", children_count: 8 }
              as: Coordinator
              captures: { b_id: $.data.id }
            - call: "POST /bookings/${b_id}/hold"
              payload: {}
              as: Coordinator
            - call: "POST /bookings/${b_id}/staff-assignments"
              payload: { staff_member_id: "${sm_host}", role_on_event: "HOST" }
              as: Coordinator
            - call: "POST /bookings/${b_id}/waivers"
              payload: { child_name: "c1", guardian_signature: "sig" }
              as: Coordinator
              captures: { w1: $.data.id }
            - call: "POST /bookings/${b_id}/waivers/${w1}/sign"
              payload: { guardian_signature: "sig" }
              as: Coordinator
            - call: "POST /bookings/${b_id}/payments"
              payload: { direction: "CHARGE", amount_cents: 7500, purpose: "DEPOSIT" }
              as: FinanceClerk
            - call: "POST /bookings/${b_id}/confirm"
              payload: {}
              as: Coordinator
              captures: { v_pre: $.data.version }
            - call: "POST /bookings/${b_id}/weather-hold"
              payload: {}
              as: Coordinator
              captures: { v_wh: $.data.version }
          trigger:
            - call: "PATCH /bookings/${b_id}/reschedule"
              payload: { event_start_utc: "2026-07-05T10:00:00Z", expected_booking_version: "${v_wh}" }
              as: Coordinator
            - call: "POST /bookings/${b_id}/confirm"
              payload: {}
              as: Coordinator
          assert:
            - "Booking.${b_id}.status == CONFIRMED"
            - "Booking.${b_id}.reschedule_count == 1"
            - "Booking.${b_id}.event_start_utc == 2026-07-05T10:00:00Z"
            - "Booking.${b_id}.event_end_utc == 2026-07-05T12:00:00Z"

      # --- Waiver branch (DRAFT->SIGNED->DRAFT plus DRAFT/SIGNED->VOIDED) ---
      - name: nlsm_waiver_sign_revoke_branch
        grounds:
          - state_machines.Waiver.DRAFT_to_SIGNED
          - state_machines.Waiver.SIGNED_to_DRAFT
          - entities.Booking.fields.waivers_signed
        distinguishing_aspect: |
          The Waiver machine has a revert edge SIGNED->DRAFT (sign then revoke), a non-linear shape on
          a different entity than Booking; waivers_signed rises to 1 then falls back to 0.
        test_recipe:
          setup:
            - "HELD booking with one DRAFT waiver."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Vx", weather_dependent: false }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", name: "Rx", max_capacity: 20, buffer_minutes: 30 }
              as: VenueManager
              captures: { r_id: $.data.id }
            - call: "POST /packages"
              payload: { venue_id: "${v_id}", theme: "Dino", base_price_cents: 30000, included_children: 8, per_extra_child_cents: 1500, base_duration_minutes: 120, deposit_pct: 0.25 }
              as: VenueManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T09:00:00Z" }
              as: Coordinator
            - call: "POST /bookings"
              payload: { room_id: "${r_id}", package_id: "${p_id}", event_start_utc: "2026-07-01T10:00:00Z", children_count: 8 }
              as: Coordinator
              captures: { b_id: $.data.id }
            - call: "POST /bookings/${b_id}/hold"
              payload: {}
              as: Coordinator
            - call: "POST /bookings/${b_id}/waivers"
              payload: { child_name: "c1", guardian_signature: "sig" }
              as: Coordinator
              captures: { w1: $.data.id }
            - call: "POST /bookings/${b_id}/waivers/${w1}/sign"
              payload: { guardian_signature: "sig" }
              as: Coordinator
          trigger:
            - call: "POST /bookings/${b_id}/waivers/${w1}/revoke"
              payload: {}
              as: Coordinator
          assert:
            - "Waiver.${w1}.status == DRAFT"
            - "Booking.${b_id}.waivers_signed == 0"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      # --- Depth>=3: cancel -> refund payment -> amount_paid recompute -> payment_status REFUNDED ---
      - name: tc_cancel_refund_paymentstatus_chain
        grounds:
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - calculations.amount_paid_reconcile
          - calculations.payment_status_derive
          - entities.Payment.fields.purpose
          - entities.Booking.fields.payment_status
        distinguishing_aspect: |
          Cancel (A) synthesizes a CANCELLATION_REFUND Payment (B); that payment's settlement triggers
          amount_paid_reconcile on the Booking (C); the new amount_paid (0) drives payment_status_derive
          to REFUNDED (D) — a depth-3+ chain where each link is caused by the prior, originating from
          the cancel transition.
        test_recipe:
          setup:
            - "CONFIRMED booking, paid full 46500, clock >=72h before event_start so full refund fires."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Vtc", weather_dependent: false }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", name: "Rtc", max_capacity: 20, buffer_minutes: 30 }
              as: VenueManager
              captures: { r_id: $.data.id }
            - call: "POST /packages"
              payload: { venue_id: "${v_id}", theme: "Dino", base_price_cents: 30000, included_children: 8, per_extra_child_cents: 1500, base_duration_minutes: 120, deposit_pct: 0.25 }
              as: VenueManager
              captures: { p_id: $.data.id }
            - call: "POST /staff-members"
              payload: { venue_id: "${v_id}", full_name: "Host H", skills: ["HOST"] }
              as: VenueManager
              captures: { sm_host: $.data.id }
            - call: "POST /staff-members"
              payload: { venue_id: "${v_id}", full_name: "Ent E", skills: ["ENTERTAINER"] }
              as: VenueManager
              captures: { sm_ent: $.data.id }
            - call: "POST /staff-members"
              payload: { venue_id: "${v_id}", full_name: "Cook C", skills: ["COOK"] }
              as: VenueManager
              captures: { sm_cook: $.data.id }
