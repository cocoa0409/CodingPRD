    instances:
      - name: occ_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[membership-upgrade-stale-version]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Two strictly sequential upgrades: the first (expected version v) succeeds and bumps Membership.version; the second carrying the same expected version v is rejected ERR_STALE_VERSION 412."
        test_recipe:
          setup: ["M1 CLASSIC ACTIVE with PLUS and PREMIER tiers defined; client observed version at membership read"]
          setup_api_calls:
            - call: "POST /motor-club/clubs"
              payload: { club_code: "NCA", name: "NorCal Auto", territory_state_codes: ["CA"], default_arrival_target_minutes: 45 }
              as: ClubAdmin
              captures: { club1: $.data.id }
            - call: "POST /motor-club/tiers"
              payload: { code: "CLASSIC", annual_dues_cents: 5000, included_tow_miles: 5, annual_call_cap: 4, lockout_benefit_cents: 5500, battery_service_included: false, household_member_price_cents: 2500, overage_rate_cents_per_mile: 650, upgrade_waiting_days: 3, rank: 1 }
              as: ClubAdmin
            - call: "POST /motor-club/tiers"
              payload: { code: "PLUS", annual_dues_cents: 9000, included_tow_miles: 100, annual_call_cap: 4, lockout_benefit_cents: 6500, battery_service_included: true, household_member_price_cents: 3500, overage_rate_cents_per_mile: 650, upgrade_waiting_days: 3, rank: 2 }
              as: ClubAdmin
            - call: "POST /motor-club/tiers"
              payload: { code: "PREMIER", annual_dues_cents: 15000, included_tow_miles: 200, annual_call_cap: 6, lockout_benefit_cents: 7500, battery_service_included: true, household_member_price_cents: 4500, overage_rate_cents_per_mile: 600, upgrade_waiting_days: 7, rank: 3 }
              as: ClubAdmin
            - call: "POST /motor-club/memberships"
              payload: { home_club_id: "${club1}", primary_member_name: "Pat Primary", primary_member_email: "pat@x.com", tier_code: "CLASSIC" }
              as: MemberServicesRep
              captures: { m1: $.data.id, m1v: $.data.version }
          trigger:
            - call: "POST /motor-club/memberships/${m1}/upgrade"
              payload: { target_tier_code: "PLUS", expected_membership_version: "${m1v}" }
              as: MemberServicesRep
              captures: { m1_tier: $.data.tier_code, m1v2: $.data.version }
            - call: "POST /motor-club/memberships/${m1}/upgrade"
              payload: { target_tier_code: "PREMIER", expected_membership_version: "${m1v}" }
              as: MemberServicesRep
              captures: { err1: $.data.error_id }
          assert:
            - "first upgrade succeeds: tier_code == PLUS and version == ${m1v} + 1"
            - "second upgrade with the stale expected version: error_id == ERR_STALE_VERSION, http 412"
            - "Membership.${m1}.tier_code remains PLUS after the rejected write"
      - name: occ_dispatch_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[service-call-dispatch-stale-version]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "After a dispatch-then-fail cycle returns the call to REQUESTED (advancing its version twice), a redispatch carrying the ORIGINAL creation-time version is rejected ERR_STALE_VERSION 412 while the state precondition (REQUESTED) still holds — isolating the OCC check from the state check."
        test_recipe:
          setup: ["Call REQUESTED (v captured at creation); one dispatch succeeds then fails, returning the call to REQUESTED with an advanced version"]
          setup_api_calls:
            - call: "POST /motor-club/clubs"
              payload: { club_code: "NCA", name: "NorCal Auto", territory_state_codes: ["CA"], default_arrival_target_minutes: 45 }
              as: ClubAdmin
              captures: { club1: $.data.id }
            - call: "POST /motor-club/tiers"
              payload: { code: "CLASSIC", annual_dues_cents: 5000, included_tow_miles: 5, annual_call_cap: 4, lockout_benefit_cents: 5500, battery_service_included: false, household_member_price_cents: 2500, overage_rate_cents_per_mile: 650, upgrade_waiting_days: 3, rank: 1 }
              as: ClubAdmin
            - call: "POST /motor-club/memberships"
              payload: { home_club_id: "${club1}", primary_member_name: "Pat Primary", primary_member_email: "pat@x.com", tier_code: "CLASSIC" }
              as: MemberServicesRep
              captures: { m1: $.data.id }
            - call: "POST /motor-club/memberships/${m1}/household-members"
              payload: { full_name: "Pat Primary", relationship: "SPOUSE", date_of_birth: "1980-01-01T00:00:00Z", is_primary: true }
              as: MemberServicesRep
              captures: { hm1: $.data.id }
            - call: "POST /motor-club/providers"
              payload: { servicing_club_id: "${club1}", name: "NCA Fleet 1", provider_kind: "OWNED", capabilities: ["TOW"], home_base_state_code: "CA", sla_multiplier: 1.0, shift_start_minute: 0, shift_end_minute: 0, max_concurrent_dispatches: 2 }
              as: ClubAdmin
            - call: "POST /motor-club/service-calls"
              payload: { membership_id: "${m1}", requesting_member_id: "${hm1}", service_type: "TOW", breakdown_location_state: "CA", requested_tow_miles: 5 }
              as: Dispatcher
              captures: { c1: $.data.id, c1v: $.data.version }
            - call: "POST /motor-club/service-calls/${c1}/dispatch"
              payload: { expected_service_call_version: "${c1v}" }
              as: Dispatcher
              captures: { d1: $.data.id }
            - call: "POST /motor-club/dispatches/${d1}/fail"
              payload: { failure_reason: "PROVIDER_DECLINED" }
              as: ProviderOps
          trigger:
            - call: "POST /motor-club/service-calls/${c1}/dispatch"
              payload: { expected_service_call_version: "${c1v}" }
              as: Dispatcher
              captures: { err1: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION and http status == 412 (call is REQUESTED again, so the state precondition passes and the OCC check is what fires)"
            - "exactly one Dispatch exists for ${c1} and it is FAILED"
      - name: downgrade_proration_credit_computed
        claim_type: derived_field_reconciliation
        grounds:
          - "calculations.tier_change_proration"
        distinguishing_aspect: "Downgrade PLUS(9000) -> CLASSIC(5000) at elapsed 200 days credits round(9000x165/365) - round(5000x165/365) = 4068 - 2260 = 1808 to account_credit_cents, computed with per-factor rounding before subtraction."
        test_recipe:
          setup: ["M1 PLUS enrolled 2026-09-01; clock at 2027-03-20 (elapsed exactly 200 days)"]
          setup_api_calls:
            - call: "POST /motor-club/clubs"
              payload: { club_code: "NCA", name: "NorCal Auto", territory_state_codes: ["CA"], default_arrival_target_minutes: 45 }
              as: ClubAdmin
              captures: { club1: $.data.id }
            - call: "POST /motor-club/tiers"
              payload: { code: "CLASSIC", annual_dues_cents: 5000, included_tow_miles: 5, annual_call_cap: 4, lockout_benefit_cents: 5500, battery_service_included: false, household_member_price_cents: 2500, overage_rate_cents_per_mile: 650, upgrade_waiting_days: 3, rank: 1 }
              as: ClubAdmin
            - call: "POST /motor-club/tiers"
              payload: { code: "PLUS", annual_dues_cents: 9000, included_tow_miles: 100, annual_call_cap: 4, lockout_benefit_cents: 6500, battery_service_included: true, household_member_price_cents: 3500, overage_rate_cents_per_mile: 650, upgrade_waiting_days: 3, rank: 2 }
              as: ClubAdmin
            - call: "POST /motor-club/memberships"
              payload: { home_club_id: "${club1}", primary_member_name: "Pat Primary", primary_member_email: "pat@x.com", tier_code: "PLUS" }
              as: MemberServicesRep
              captures: { m1: $.data.id, m1v: $.data.version }
            - call: "POST /motor-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-20T00:00:00Z" }
              as: ClubAdmin
          trigger:
            - call: "POST /motor-club/memberships/${m1}/downgrade"
              payload: { target_tier_code: "CLASSIC", expected_membership_version: "${m1v}" }
              as: MemberServicesRep
              captures: { m1_credit: $.data.account_credit_cents, m1_tier: $.data.tier_code }
          assert:
            - "Membership.${m1}.account_credit_cents == 1808 (downgrade credit with pinned per-factor rounding)"
            - "Membership.${m1}.tier_code == CLASSIC and term dates unchanged (tier change never resets the term)"
            - "GET /motor-club/memberships/${m1}/membershipEvents contains a DOWNGRADE event with from_tier PLUS, to_tier CLASSIC"
      - name: dispatch_selector_owned_preference_and_created_at_tiebreak
        claim_type: selector_policy
        grounds:
          - "calculations.dispatch_provider_selection"
        distinguishing_aspect: "With one OWNED and one CONTRACTED provider both eligible, OWNED wins regardless of creation order; two OWNED providers tie-break by earlier created_at (id never consulted)."
        test_recipe:
          setup: ["CONTRACTED provider created FIRST, OWNED provider created second; single call dispatched"]
          setup_api_calls:
            - call: "POST /motor-club/clubs"
              payload: { club_code: "NCA", name: "NorCal Auto", territory_state_codes: ["CA"], default_arrival_target_minutes: 45 }
              as: ClubAdmin
              captures: { club1: $.data.id }
            - call: "POST /motor-club/tiers"
              payload: { code: "CLASSIC", annual_dues_cents: 5000, included_tow_miles: 5, annual_call_cap: 4, lockout_benefit_cents: 5500, battery_service_included: false, household_member_price_cents: 2500, overage_rate_cents_per_mile: 650, upgrade_waiting_days: 3, rank: 1 }
              as: ClubAdmin
            - call: "POST /motor-club/memberships"
              payload: { home_club_id: "${club1}", primary_member_name: "Pat Primary", primary_member_email: "pat@x.com", tier_code: "CLASSIC" }
              as: MemberServicesRep
              captures: { m1: $.data.id }
            - call: "POST /motor-club/memberships/${m1}/household-members"
              payload: { full_name: "Pat Primary", relationship: "SPOUSE", date_of_birth: "1980-01-01T00:00:00Z", is_primary: true }
              as: MemberServicesRep
              captures: { hm1: $.data.id }
            - call: "POST /motor-club/providers"
