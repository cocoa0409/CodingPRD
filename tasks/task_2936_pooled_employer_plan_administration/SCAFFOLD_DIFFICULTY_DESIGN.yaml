          setup:
            - "Plan 001 ACTIVE with an acknowledged 3(16) recordkeeper and 403(a) trustee."
            - "Employers Palisade (13 participants) and Quarry (4 participants), both ACTIVE with APPROVED elections."
            - "One VALIDATED batch of 8500000 for each employer, both withheld 2026-08-03 and therefore due 2026-08-12 under the 7-business-day small-plan rule."
