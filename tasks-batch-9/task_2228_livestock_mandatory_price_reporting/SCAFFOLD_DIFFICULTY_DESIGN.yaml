# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2228_livestock_mandatory_price_reporting
#
# 9 rule_id blocks / 25 instances.
# Every literal in an `assert:` line was produced by executing the referenced
# §1.3 formula against the pinned fixture inputs.
# Logical clock starts at 2026-08-01T00:00:00Z (see POST /_clock/set_current_utc).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: head_vs_weight_weighted_market_average
        grounds:
          - calculations.market_report_aggregation
          - entities.MarketReport.fields.weighting_variant
          - entities.MarketReport.fields.weighted_average_price_per_cwt
          - state_machines.MarketReport.AGG_PENDING_to_AGG_COMPUTED
        distinguishing_aspect: |
          Domain: published price statistics on MarketReport. The same five accepted
          transactions produce 285.61 under HEAD_WEIGHTED (weights = head_count) and
          285.83 under WEIGHT_WEIGHTED (weights = head_count * avg_carcass_weight_cwt),
          a 0.22 divergence on identical input rows.
        test_recipe:
          setup:
            - "Three reporting entities (Alpha, Bravo, Cattle Coop), each with one CATTLE plant and an ACTIVE MANDATORY 2026 registration."
            - "One OPEN weekly CATTLE LIVE_ANIMAL window covering 2026-08-03..2026-08-10 with guideline params 3 / 70.00 / 1000."
            - "Three ACCEPTED submissions: Alpha 200 head NEGOTIATED @279.75/8.60 cwt plus 300 head FORMULA @292.25/9.40 cwt; Bravo 200 head NEGOTIATED_GRID @285.50/8.80 cwt plus 300 head PACKER_OWNED @288.00/9.00 cwt; Cattle Coop 250 head NEGOTIATED @282.40/8.20 cwt."
            - "Window ledger therefore reads accepted_submission_count 3 and total_head_reported 1250."
            - "Two MarketReport shells exist on that window for category LIVE_STEER_HEIFER, one HEAD_WEIGHTED and one WEIGHT_WEIGHTED, both purchase_type_filter ALL_PRICED."
          setup_api_calls:
            - call: "POST /reporting-entities"
              payload: { legal_name: "Alpha Packing", entity_type: "PACKER", species_scope: "CATTLE" }
              as: ProgramAdmin
              captures: { ent_a: $.data.id }
            - call: "POST /reporting-entities"
              payload: { legal_name: "Bravo Beef", entity_type: "PACKER", species_scope: "CATTLE" }
              as: ProgramAdmin
              captures: { ent_b: $.data.id }
            - call: "POST /reporting-entities"
              payload: { legal_name: "Cattle Coop", entity_type: "PACKER_PROCESSOR", species_scope: "CATTLE" }
              as: ProgramAdmin
              captures: { ent_c: $.data.id }
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_a}", plant_code: "EST-101", species: "CATTLE", annual_head_history: { "2021": 120000, "2022": 124000, "2023": 126000, "2024": 128000, "2025": 132000 }, boxed_beef_volume_lbs_prior_year: 2500000, forward_commitment_cap_head: 3000 }
              as: ProgramAdmin
              captures: { plant_a: $.data.id }
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_b}", plant_code: "EST-202", species: "CATTLE", annual_head_history: { "2021": 100000, "2022": 110000, "2023": 120000, "2024": 130000, "2025": 150000 }, boxed_beef_volume_lbs_prior_year: 0, forward_commitment_cap_head: 1000 }
              as: ProgramAdmin
              captures: { plant_b: $.data.id }
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_c}", plant_code: "EST-303", species: "CATTLE", annual_head_history: { "2021": 125000, "2022": 125000, "2023": 125000, "2024": 125000, "2025": 125000 }, boxed_beef_volume_lbs_prior_year: 0, forward_commitment_cap_head: 1000 }
              as: ProgramAdmin
              captures: { plant_c: $.data.id }
            - call: "POST /registrations"
              payload: { reporting_entity_id: "${ent_a}", determination_year: 2026, basis_variant: "FIVE_YEAR_AVERAGE" }
              as: ProgramAdmin
              captures: { reg_a: $.data.id }
            - call: "POST /registrations/${reg_a}/determine"
              payload: {}
              as: ProgramAdmin
            - call: "POST /registrations/${reg_a}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /registrations"
              payload: { reporting_entity_id: "${ent_b}", determination_year: 2026, basis_variant: "PRIOR_YEAR_ACTUAL" }
              as: ProgramAdmin
              captures: { reg_b: $.data.id }
            - call: "POST /registrations/${reg_b}/determine"
              payload: {}
              as: ProgramAdmin
            - call: "POST /registrations/${reg_b}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /registrations"
              payload: { reporting_entity_id: "${ent_c}", determination_year: 2026, basis_variant: "FIVE_YEAR_AVERAGE" }
              as: ProgramAdmin
              captures: { reg_c: $.data.id }
            - call: "POST /registrations/${reg_c}/determine"
              payload: {}
              as: ProgramAdmin
            - call: "POST /registrations/${reg_c}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /reporting-windows"
              payload: { species: "CATTLE", report_class: "LIVE_ANIMAL", frequency: "WEEKLY", period_start: "2026-08-03T00:00:00Z", period_end: "2026-08-10T00:00:00Z", submission_deadline_utc: "2026-08-11T15:00:00Z", correction_deadline_utc: "2026-08-18T15:00:00Z", publication_release_utc: "2026-08-12T12:00:00Z", min_reporter_count: 3, max_single_reporter_share_pct: 70.00, min_reported_head: 1000 }
              as: ProgramAdmin
              captures: { win_1: $.data.id }
            - call: "GET /reporting-windows/${win_1}"
              payload: {}
              as: ProgramAdmin
              captures: { wv_1: $.data.version }
            - call: "POST /submissions"
              payload: { plant_id: "${plant_a}", reporting_window_id: "${win_1}", expected_window_version: "${wv_1}" }
              as: ReporterAgent
              as_user_id: "${ent_a}"
              captures: { sub_a: $.data.id }
            - call: "POST /submissions/${sub_a}/transactions"
              payload: { purchase_type: "NEGOTIATED", head_count: 200, avg_net_price_per_cwt: 279.75, avg_carcass_weight_cwt: 8.60 }
              as: ReporterAgent
              as_user_id: "${ent_a}"
            - call: "POST /submissions/${sub_a}/transactions"
              payload: { purchase_type: "FORMULA", head_count: 300, avg_net_price_per_cwt: 292.25, avg_carcass_weight_cwt: 9.40, formula_base_reference: "CME_LIVE_CATTLE_INDEX" }
              as: ReporterAgent
              as_user_id: "${ent_a}"
            - call: "POST /submissions/${sub_a}/submit"
              payload: {}
              as: ReporterAgent
              as_user_id: "${ent_a}"
            - call: "GET /reporting-windows/${win_1}"
              payload: {}
              as: ProgramAdmin
              captures: { wv_2: $.data.version }
            - call: "POST /submissions"
              payload: { plant_id: "${plant_b}", reporting_window_id: "${win_1}", expected_window_version: "${wv_2}" }
              as: ReporterAgent
              as_user_id: "${ent_b}"
              captures: { sub_b: $.data.id }
            - call: "POST /submissions/${sub_b}/transactions"
              payload: { purchase_type: "NEGOTIATED_GRID", head_count: 200, avg_net_price_per_cwt: 285.50, avg_carcass_weight_cwt: 8.80, grid_premium_discount_per_cwt: 3.25 }
              as: ReporterAgent
              as_user_id: "${ent_b}"
            - call: "POST /submissions/${sub_b}/transactions"
              payload: { purchase_type: "PACKER_OWNED", head_count: 300, avg_net_price_per_cwt: 288.00, avg_carcass_weight_cwt: 9.00 }
              as: ReporterAgent
              as_user_id: "${ent_b}"
            - call: "POST /submissions/${sub_b}/submit"
              payload: {}
              as: ReporterAgent
              as_user_id: "${ent_b}"
            - call: "GET /reporting-windows/${win_1}"
              payload: {}
              as: ProgramAdmin
              captures: { wv_3: $.data.version }
            - call: "POST /submissions"
              payload: { plant_id: "${plant_c}", reporting_window_id: "${win_1}", expected_window_version: "${wv_3}" }
              as: ReporterAgent
              as_user_id: "${ent_c}"
              captures: { sub_c: $.data.id }
            - call: "POST /submissions/${sub_c}/transactions"
              payload: { purchase_type: "NEGOTIATED", head_count: 250, avg_net_price_per_cwt: 282.40, avg_carcass_weight_cwt: 8.20 }
              as: ReporterAgent
              as_user_id: "${ent_c}"
            - call: "POST /submissions/${sub_c}/submit"
              payload: {}
              as: ReporterAgent
              as_user_id: "${ent_c}"
            - call: "POST /submissions/${sub_a}/review"
              payload: { decision: "ACCEPT", review_note: "clean" }
              as: MarketAnalyst
            - call: "POST /submissions/${sub_b}/review"
              payload: { decision: "ACCEPT", review_note: "clean" }
              as: MarketAnalyst
            - call: "POST /submissions/${sub_c}/review"
              payload: { decision: "ACCEPT", review_note: "clean" }
              as: MarketAnalyst
            - call: "POST /market-reports"
              payload: { reporting_window_id: "${win_1}", category: "LIVE_STEER_HEIFER", weighting_variant: "HEAD_WEIGHTED", purchase_type_filter: "ALL_PRICED" }
              as: MarketAnalyst
              captures: { rep_head: $.data.id }
            - call: "POST /market-reports"
              payload: { reporting_window_id: "${win_1}", category: "LIVE_STEER_HEIFER", weighting_variant: "WEIGHT_WEIGHTED", purchase_type_filter: "ALL_PRICED" }
              as: MarketAnalyst
              captures: { rep_weight: $.data.id }
          trigger:
            - call: "POST /market-reports/${rep_head}/compute"
              payload: {}
              as: MarketAnalyst
            - call: "POST /market-reports/${rep_weight}/compute"
              payload: {}
              as: MarketAnalyst
          assert:
            - "MarketReport.${rep_head}.weighted_average_price_per_cwt == 285.61"
            - "MarketReport.${rep_weight}.weighted_average_price_per_cwt == 285.83"
            - "MarketReport.${rep_head}.weighted_average_price_per_cwt != MarketReport.${rep_weight}.weighted_average_price_per_cwt"
            - "MarketReport.${rep_head}.total_head == 1250 and MarketReport.${rep_weight}.total_head == 1250"
            - "MarketReport.${rep_head}.price_low_per_cwt == 279.75 and MarketReport.${rep_head}.price_high_per_cwt == 292.25"
            - "MarketReport.${rep_weight}.price_low_per_cwt == 279.75 and MarketReport.${rep_weight}.price_high_per_cwt == 292.25"
            - "MarketReport.${rep_head}.reporter_count == 3 and MarketReport.${rep_head}.max_reporter_share_pct == 40.00"
            - "MarketReport.${rep_head}.source_submission_count == 3"
            - "MarketReport.${rep_head}.aggregation_state == COMPUTED and MarketReport.${rep_head}.disclosure_state == UNREVIEWED"
            - "ReportingWindow.${win_1}.total_head_reported == 1250 and ReportingWindow.${win_1}.accepted_submission_count == 3"

      - name: five_year_average_vs_prior_year_threshold
        grounds:
          - calculations.reporter_threshold_determination
          - entities.Registration.fields.basis_variant
          - entities.Registration.fields.measured_head
          - entities.Registration.fields.determination_outcome
          - state_machines.Registration.UNDER_APPEAL_to_DETERMINED
        distinguishing_aspect: |
          Domain: regulatory eligibility on Registration (head volume, not price).
          Bravo's identical plant history measures 122000 head under FIVE_YEAR_AVERAGE
          (EXEMPT, below the 125000 CATTLE floor) and 150000 head under
          PRIOR_YEAR_ACTUAL (MANDATORY) — the variant flips the firm's legal status,
          not merely a published number.
        test_recipe:
          setup:
            - "Bravo Beef exists with one CATTLE plant whose annual_head_history is 2021:100000, 2022:110000, 2023:120000, 2024:130000, 2025:150000."
            - "A 2026 Registration on the FIVE_YEAR_AVERAGE basis has already been determined and appealed, so it sits in UNDER_APPEAL with appeal_count 1."
          setup_api_calls:
            - call: "POST /reporting-entities"
              payload: { legal_name: "Bravo Beef", entity_type: "PACKER", species_scope: "CATTLE" }
              as: ProgramAdmin
              captures: { ent_b: $.data.id }
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_b}", plant_code: "EST-202", species: "CATTLE", annual_head_history: { "2021": 100000, "2022": 110000, "2023": 120000, "2024": 130000, "2025": 150000 }, boxed_beef_volume_lbs_prior_year: 0, forward_commitment_cap_head: 1000 }
              as: ProgramAdmin
              captures: { plant_b: $.data.id }
            - call: "POST /registrations"
              payload: { reporting_entity_id: "${ent_b}", determination_year: 2026, basis_variant: "FIVE_YEAR_AVERAGE" }
              as: ProgramAdmin
              captures: { reg_b: $.data.id }
            - call: "POST /registrations/${reg_b}/determine"
              payload: {}
              as: ProgramAdmin
            - call: "POST /registrations/${reg_b}/appeal"
              payload: { appeal_reason: "five-year basis understates current volume" }
              as: ReporterAgent
              as_user_id: "${ent_b}"
          trigger:
            - call: "POST /registrations/${reg_b}/redetermine"
              payload: { basis_variant: "PRIOR_YEAR_ACTUAL" }
              as: ProgramAdmin
          assert:
            - "After determine (FIVE_YEAR_AVERAGE) Registration.${reg_b}.measured_head == 122000 and determination_outcome == EXEMPT"
            - "After redetermine (PRIOR_YEAR_ACTUAL) Registration.${reg_b}.measured_head == 150000 and determination_outcome == MANDATORY"
            - "Registration.${reg_b}.threshold_head == 125000 in both determinations"
            - "Registration.${reg_b}.status == DETERMINED and appeal_count == 1"
            - "POST /registrations/${reg_b}/activate now returns 200 (MANDATORY), whereas it returned ERR_ENTITY_EXEMPT (409) while the outcome was EXEMPT"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: penalty_multiplier_chain_with_capped_nonlinear_uplift
        grounds:
          - calculations.penalty_assessment_amount
          - entities.PenaltyAssessment.fields.repeat_multiplier
          - entities.PenaltyAssessment.fields.volume_factor
          - entities.PenaltyAssessment.fields.assessed_amount_cents
          - validations[priority=35]
        distinguishing_aspect: |
          Mode (a): five interacting inputs (base constant selected by violation_type,
          day tier, recidivism tier keyed on a COUNT of prior non-waived rows of the
          same type, a nested min() volume uplift over the governing registration's
          measured_head, and a state-branch surcharge), then round-to-cents BEFORE the
          nested min() cap — the third NON_REGISTRATION row computes raw 2252000 and
          is clamped to 2000000, so the cap is what the test observes.
        test_recipe:
          setup:
            - "Delta Packing exists with one CATTLE plant whose five-year history averages 126000 head, and an ACTIVE MANDATORY 2026 registration with measured_head 126000."
            - "Two NON_REGISTRATION assessments already stand against Delta in status ASSESSED: the first at repeat_index 0 (1126000 cents) and the second at repeat_index 1 (1689000 cents)."
            - "Delta's delinquency_points therefore reads 16 (TIER_1) and outstanding_penalty_cents reads 2815000."
          setup_api_calls:
            - call: "POST /reporting-entities"
              payload: { legal_name: "Delta Packing", entity_type: "PACKER", species_scope: "CATTLE" }
              as: ProgramAdmin
              captures: { ent_d: $.data.id }
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_d}", plant_code: "EST-404", species: "CATTLE", annual_head_history: { "2021": 120000, "2022": 124000, "2023": 126000, "2024": 128000, "2025": 132000 }, boxed_beef_volume_lbs_prior_year: 0, forward_commitment_cap_head: 1000 }
              as: ProgramAdmin
              captures: { plant_d: $.data.id }
            - call: "POST /registrations"
              payload: { reporting_entity_id: "${ent_d}", determination_year: 2026, basis_variant: "FIVE_YEAR_AVERAGE" }
              as: ProgramAdmin
              captures: { reg_d: $.data.id }
            - call: "POST /registrations/${reg_d}/determine"
              payload: {}
              as: ProgramAdmin
            - call: "POST /registrations/${reg_d}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "GET /reporting-entities/${ent_d}"
              payload: {}
              as: PenaltyOfficer
              as_user_id: "officer-1"
              captures: { ev_1: $.data.version }
            - call: "POST /penalty-assessments"
              payload: { reporting_entity_id: "${ent_d}", violation_type: "NON_REGISTRATION", expected_reporting_entity_version: "${ev_1}" }
              as: PenaltyOfficer
              as_user_id: "officer-1"
              captures: { pen_1: $.data.id }
            - call: "GET /reporting-entities/${ent_d}"
              payload: {}
              as: PenaltyOfficer
              as_user_id: "officer-1"
              captures: { ev_2: $.data.version }
            - call: "POST /penalty-assessments"
              payload: { reporting_entity_id: "${ent_d}", violation_type: "NON_REGISTRATION", expected_reporting_entity_version: "${ev_2}" }
              as: PenaltyOfficer
              as_user_id: "officer-1"
              captures: { pen_2: $.data.id }
            - call: "GET /reporting-entities/${ent_d}"
              payload: {}
              as: PenaltyOfficer
              as_user_id: "officer-1"
              captures: { ev_3: $.data.version }
          trigger:
            - call: "POST /penalty-assessments"
              payload: { reporting_entity_id: "${ent_d}", violation_type: "NON_REGISTRATION", expected_reporting_entity_version: "${ev_3}" }
              as: PenaltyOfficer
              as_user_id: "officer-1"
              captures: { pen_3: $.data.id }
          assert:
            - "PenaltyAssessment.${pen_1}.assessed_amount_cents == 1126000 with repeat_index == 0 and repeat_multiplier == 1.00"
            - "PenaltyAssessment.${pen_2}.assessed_amount_cents == 1689000 with repeat_index == 1 and repeat_multiplier == 1.50"
            - "PenaltyAssessment.${pen_3}.repeat_index == 2 and repeat_multiplier == 2.00"
            - "PenaltyAssessment.${pen_3}.base_amount_cents == 1000000 and volume_factor == 1.126 and day_tier_multiplier == 1.00 and suspension_surcharge == 1.00"
            - "PenaltyAssessment.${pen_3}.assessed_amount_cents == 2000000 (raw 2252000 clamped by PER_ASSESSMENT_CAP_CENTS)"
            - "PenaltyAssessment.${pen_3}.delinquency_tier_at_assessment == TIER_1 and points == 8"
            - "ReportingEntity.${ent_d}.assessed_penalty_cents == 4815000 and outstanding_penalty_cents == 4815000 and delinquency_points == 24"
            - "Registration.${reg_d}.status == SUSPENDED with suspended_reason == DELINQUENCY_TIER_BREACH"

      - name: per_record_round_then_sum_line_value
        grounds:
          - calculations.submission_reported_totals
          - entities.TransactionRecord.fields.line_value_dollars
          - entities.Submission.fields.reported_value_dollars
          - calculations.market_report_aggregation
        distinguishing_aspect: |
          Mode (b): two transactions each worth exactly 2427.1750 dollars. The pinned
          order rounds at the record (2427.18 each) and then sums to 4854.36; the
          rejected order would sum to 4854.35 — a one-cent divergence the audit
          comparison keys on. The market aggregation calculation pins the OPPOSITE
          order (unrounded products, single final rounding), so the scaffold carries
          both orders and the implementation cannot apply one rule everywhere.
        test_recipe:
          setup:
            - "Alpha Packing with one CATTLE plant and an ACTIVE MANDATORY 2026 registration."
            - "One OPEN weekly CATTLE LIVE_ANIMAL window."
            - "One DRAFT submission for that plant and window."
          setup_api_calls:
            - call: "POST /reporting-entities"
              payload: { legal_name: "Alpha Packing", entity_type: "PACKER", species_scope: "CATTLE" }
              as: ProgramAdmin
              captures: { ent_a: $.data.id }
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_a}", plant_code: "EST-101", species: "CATTLE", annual_head_history: { "2021": 120000, "2022": 124000, "2023": 126000, "2024": 128000, "2025": 132000 }, boxed_beef_volume_lbs_prior_year: 2500000, forward_commitment_cap_head: 3000 }
              as: ProgramAdmin
              captures: { plant_a: $.data.id }
            - call: "POST /registrations"
              payload: { reporting_entity_id: "${ent_a}", determination_year: 2026, basis_variant: "FIVE_YEAR_AVERAGE" }
              as: ProgramAdmin
              captures: { reg_a: $.data.id }
            - call: "POST /registrations/${reg_a}/determine"
              payload: {}
              as: ProgramAdmin
            - call: "POST /registrations/${reg_a}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /reporting-windows"
              payload: { species: "CATTLE", report_class: "LIVE_ANIMAL", frequency: "WEEKLY", period_start: "2026-08-03T00:00:00Z", period_end: "2026-08-10T00:00:00Z", submission_deadline_utc: "2026-08-11T15:00:00Z", correction_deadline_utc: "2026-08-18T15:00:00Z", publication_release_utc: "2026-08-12T12:00:00Z", min_reporter_count: 3, max_single_reporter_share_pct: 70.00, min_reported_head: 1000 }
              as: ProgramAdmin
              captures: { win_1: $.data.id }
            - call: "GET /reporting-windows/${win_1}"
              payload: {}
              as: ProgramAdmin
              captures: { wv_1: $.data.version }
            - call: "POST /submissions"
              payload: { plant_id: "${plant_a}", reporting_window_id: "${win_1}", expected_window_version: "${wv_1}" }
              as: ReporterAgent
              as_user_id: "${ent_a}"
              captures: { sub_a: $.data.id }
          trigger:
            - call: "POST /submissions/${sub_a}/transactions"
              payload: { purchase_type: "NEGOTIATED", head_count: 1, avg_net_price_per_cwt: 285.55, avg_carcass_weight_cwt: 8.50 }
              as: ReporterAgent
              as_user_id: "${ent_a}"
              captures: { tx_1: $.data.submission_id }
            - call: "POST /submissions/${sub_a}/transactions"
              payload: { purchase_type: "NEGOTIATED", head_count: 1, avg_net_price_per_cwt: 285.55, avg_carcass_weight_cwt: 8.50 }
              as: ReporterAgent
              as_user_id: "${ent_a}"
          assert:
            - "Each TransactionRecord of ${sub_a} has line_value_dollars == 2427.18"
            - "Submission.${sub_a}.reported_value_dollars == 4854.36"
            - "Submission.${sub_a}.reported_value_dollars != 4854.35 (the sum-then-round result)"
            - "Submission.${sub_a}.reported_cwt == 17.00 and reported_head == 2"
            - "Submission.${sub_a}.reported_pounds == 0 and reported_load_count == 0"

      - name: tier_read_before_own_points_then_doubling
        grounds:
          - calculations.delinquency_points_and_tier
          - entities.PenaltyAssessment.fields.delinquency_tier_at_assessment
          - entities.PenaltyAssessment.fields.points
          - entities.PenaltyAssessment.fields.suspension_surcharge
          - entities.ReportingEntity.fields.delinquency_points
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned by evaluation order — the
          assessed amount depends on the tier, the tier depends on the point total,
          and the point total depends on this very row. The order is: read
          points_before (24) -> tier TIER_2 -> surcharge from the registration status
          as of that read (SUSPENDED, 1.25) -> amount 703750 -> only THEN add
          doubled points (5 * 2 = 10) for a new total of 34. An implementation that
          adds its own points first would report TIER_2 doubling off 34 and a
          different ledger.
        test_recipe:
          setup:
            - "Delta Packing with one CATTLE plant (five-year average 126000 head) and a 2026 registration."
            - "Delta filed one submission with 400 head NEGOTIATED @284.00/8.50 cwt (booked reported_head 400, reported_value_dollars 965600.00), which was ACCEPTED."
            - "A ComplianceAuditor opened the case as auditor-1 and a different auditor (auditor-2) finalized it with verified_head 380 and verified_value_dollars 965600.00, so the case sits in DISCREPANCY with finding MATERIAL_HEAD and the submission was cascaded to UNDER_CORRECTION."
            - "Three NON_REGISTRATION assessments then brought delinquency_points to 24 (TIER_2) and suspended the registration."
          setup_api_calls:
            - call: "POST /reporting-entities"
