              as: ProgramAdmin
          trigger:
            - call: "POST /bone-density/scan-appointments/${appt1_id}/cancel"
              payload: {}
              as: Scheduler
          assert:
            - "ScanAppointment.${appt1_id}.status == CANCELLED"
