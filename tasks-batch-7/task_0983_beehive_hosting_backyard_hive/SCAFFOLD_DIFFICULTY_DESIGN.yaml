            - { call: "POST /api/agreements/${ag}/sign", payload: {}, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { hv1: $.data.id } }
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { hv2: $.data.id } }
          trigger:
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { err: $.data.error_id } }
            - { call: "POST /api/enrollments", payload: { host_id: "${h}", course_code: "HOST-101" }, as: Host, as_user_id: "${h}", captures: { en1: $.data.id } }
            - { call: "POST /api/enrollments/${en1}/complete", payload: { quiz_score: 85 }, as: PlatformOps }
            - { call: "POST /api/enrollments", payload: { host_id: "${h}", course_code: "ADV-201" }, as: Host, as_user_id: "${h}", captures: { en2: $.data.id } }
            - { call: "POST /api/enrollments/${en2}/complete", payload: { quiz_score: 92 }, as: PlatformOps }
            - { call: "GET /api/sites/${site}", payload: {}, as: PlatformOps, captures: { cap_after: $.data.effective_capacity_hives } }
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { hv3: $.data.id } }
          assert:
            - "captured ${err} == ERR_SITE_CAPACITY_EXCEEDED at occupancy 2 == capacity 2 (inclusive reject)"
            - "captured ${cap_after} == 3 (base 2 + 1 for COMPLETED ADV-201)"
            - "retry after the bonus succeeds: Hive.${hv3} created with lifecycle_status ACTIVE"

      - name: moisture_exact_18_6_no_penalty
        grounds:
          - calculations.net_harvest_kg
        distinguishing_aspect: |
          Metric: moisture percent, via POST /api/harvests. The penalty triggers strictly above
