      - name: corner_execute_requires_network_approval
        claim_type: Violation → Error
        grounds: ["validations[priority=27]", "errors.ERR_NETWORK_APPROVAL_PENDING"]
        excluded_because:
          difficulty_instance: non_linear_state_machine / agreement_execution_and_network_dimensions_advance_independently
          rationale: "Execution refused at PENDING_NETWORK and again at NETWORK_REJECTED is asserted there."
      - name: corner_carriage_term_overlap_on_slot
        claim_type: Temporal validation
        grounds: ["validations[priority=31]", "errors.ERR_CARRIAGE_TERM_OVERLAP"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / carriage_term_half_open_overlap_on_station_distributor_slot
          rationale: "The half-open overlap rule and the adjacent-term pass are asserted there."
