  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers, depths >=3 and >=2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: expenditure_flag_to_member_freeze
        grounds:
          - state_machines.ExpenditureReport.SUBMITTED_to_FLAGGED
          - state_machines.ComplianceAudit.OPEN_to_FINDINGS_ISSUED
          - state_machines.ComplianceAudit.FINDINGS_ISSUED_to_ESCALATED
          - state_machines.GrantAward.ACTIVE_to_SUSPENDED
          - calculations.posture_recompute
        distinguishing_aspect: |
          Depth-3 chain triggered by flag: report FLAGGED -> audit created ->
          findings issued -> (escalate) award SUSPENDED and clawback credited
          to cycle pools -> member posture forced FROZEN. Each link caused by
          the previous one, not by the original flag.
        test_recipe:
          setup:
            - "CHARTERED member m1 with an ACTIVE award aw1 (total 100000: formula 60000 + competitive 40000, match verified), disbursement of 80000 POSTED, one expenditure report SUBMITTED for 70000"
