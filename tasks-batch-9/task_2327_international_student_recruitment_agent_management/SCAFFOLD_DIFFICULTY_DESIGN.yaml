            - "ApplicationDocument.${d_flag_id}.fraud_index == 60 and .verification_state == \"FLAGGED\""
            - "ApplicationDocument.${d_pass_id}.fraud_index == 55 and .verification_state == \"PENDING\""
            - "neither document's fraud_signals contains \"HASH_DUPLICATE\""
            - "StudentApplication.${a1_id}.integrity_hold == true"
            - "Agency.${ag1_id}.reviewed_document_count == 1 (only the FLAGGED document counts as reviewed; the PENDING one does not)"
            - "Agency.${ag1_id}.confirmed_fraud_document_count == 0 and .rolling_risk_score == 0.00 (a flag alone is not a confirmed incident)"

      - name: scorecard_composite_platinum_band_at_exactly_zero_point_eight_five
        grounds:
