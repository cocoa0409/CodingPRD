            - { call: "POST /oncology/simulation-appointments/${sim_a}/complete", payload: { patient_weight_kg: 80.0 }, as: RadiationTherapist, as_user_id: "rtt_a" }
            - { call: "POST /oncology/treatment-courses/${crs}/contour-sets", payload: { set_label: "CT1", target_volumes: ["PTV"], oar_structures: ["Cord"] }, as: RadiationOncologist, as_user_id: "onc_a", captures: { cs: $.data.id } }
            - { call: "POST /oncology/contour-sets/${cs}/submit", payload: {}, as: RadiationOncologist, as_user_id: "onc_a" }
            - { call: "POST /oncology/contour-sets/${cs}/approve", payload: {}, as: RadiationOncologist, as_user_id: "onc_b" }
            - { call: "GET /oncology/treatment-courses/${crs}", payload: {}, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs_v: $.data.version } }
            - { call: "POST /oncology/treatment-courses/${crs}/treatment-plans", payload: { contour_set_id: "${cs}", target_total_dose_cGy: 4000, planned_fractions: 8, expected_course_version: "${crs_v}" }, as: MedicalDosimetrist, as_user_id: "dos_a", captures: { pl: $.data.id } }
            - { call: "POST /oncology/treatment-plans/${pl}/dose-constraints", payload: { structure_name: "Cord", constraint_type: "MAX_DOSE", limit_cGy: 4500, evaluated_value_cGy: 4500 }, as: MedicalDosimetrist, as_user_id: "dos_a", captures: { dc: $.data.id, dc_sat: $.data.satisfied } }
          trigger:
            - { call: "POST /oncology/treatment-plans/${pl}/submit-for-check", payload: {}, as: MedicalDosimetrist, as_user_id: "dos_a", captures: { pl_st: $.data.status } }
          assert:
            - "dc_sat == true (evaluated_value_cGy 4500 == limit_cGy 4500 satisfies the inclusive boundary)"
            - "pl_st == PENDING_PRIMARY_CHECK (submit-for-check accepted with a boundary-equal constraint)"
  # ===================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: deliver_blocked_when_machine_down
        grounds:
          - state_machines.FractionSession.SCHEDULED_to_DELIVERED
          - state_machines.TreatmentMachine.OPERATIONAL_to_DOWN
          - entities.TreatmentMachine.fields.status
        distinguishing_aspect: |
          Pair FractionSession x TreatmentMachine: a SCHEDULED session whose linac is DOWN cannot be
          delivered (ERR_MACHINE_NOT_OPERATIONAL) even though the session, course, and plan are all
          in deliverable states; the session itself survives the downtime cascade because its
          start_time precedes the logical clock.
        test_recipe:
          setup:
            - "IMRT course 2000/10 ON_TREATMENT: 1 fraction DELIVERED (2026-08-03), 1 SCHEDULED 2026-08-05T09:00 on Linac-X1"
            - "Logical clock set to 2026-08-06T00:00:00Z (after the scheduled start, so the cascade spares the session)"
            - "Linac-X1 then set DOWN"
          setup_api_calls:
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-XS-1", full_name: "Cross One", date_of_birth: "1961-01-01" }, as: Scheduler, captures: { pat: $.data.id } }
            - { call: "POST /oncology/patients/${pat}/treatment-courses", payload: { diagnosis_code: "C61", intent: "CURATIVE", technique: "IMRT", prescribed_total_dose_cGy: 2000, planned_fractions: 10 }, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs: $.data.id } }
