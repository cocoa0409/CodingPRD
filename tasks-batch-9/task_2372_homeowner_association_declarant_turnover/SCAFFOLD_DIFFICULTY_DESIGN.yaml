          assert:
            - "trigger returns 200"
            - "DefectClaim.${claim_id}.reserve_subtotal_cents == 1950000"
            - "DefectClaim.${claim_id}.litigation_admin_fee_cents == 234000"
            - "DefectClaim.${claim_id}.reserved_amount_cents == 2184000"
            - "DefectClaim.${claim_id}.litigation_admin_fee_cents != 175500"
            - "Association.${assoc_id}.reserve_claim_committed_cents == 2184000"
            - "Association.${assoc_id}.reserve_claim_available_cents == 816000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: turnover_case_governance_reaches_owner_control_while_subsidy_still_active
        grounds:
          - state_machines.TurnoverCase.DECLARANT_CONTROL_to_ELECTION_CALLED
          - state_machines.TurnoverCase.ELECTION_CALLED_to_ELECTION_HELD
          - state_machines.TurnoverCase.ELECTION_HELD_to_OWNER_CONTROL
          - calculations.turnover_posture_derivation
          - calculations.governance_seat_ledger
          - entities.TurnoverCase.fields.turnover_posture
        distinguishing_aspect: |
          Parallel shape: the governance dimension walks DECLARANT_CONTROL -> ELECTION_CALLED ->
          ELECTION_HELD -> OWNER_CONTROL to its terminal state while financial_status never leaves
          SUBSIDY_ACTIVE, and the derived turnover_posture is NOT a copy of either dimension — it reads
          TRANSITION_RESTRICTED at (ELECTION_CALLED, SUBSIDY_ACTIVE) and OWNER_CONTROL_OPEN at
          (OWNER_CONTROL, SUBSIDY_ACTIVE), a combination no single-dimension state machine can express.
        test_recipe:
          setup:
            - "Association 'Elmgate' with fixed_turnover_date 2026-07-01T00:00:00Z, no components, no lots, no vendor contracts."
            - "TurnoverCase with total_seats 5, so owner_elected_seats_required becomes ceil(5*2/3) = 4 once the trigger is certified."
            - "No RecordsTransferItem rows at all, so records_transfer_completeness_pct is vacuously 100.00."
            - "Logical clock at its default 2026-08-01T00:00:00Z, already past the fixed turnover date."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Elmgate", total_planned_lots: 12, turnover_threshold_pct: 75.00, fixed_turnover_date: "2026-07-01T00:00:00Z", statute_of_repose_years: 10, reserve_pool_cents: 400000, reserve_claim_pool_cents: 1000000, declarant_monthly_subsidy_cents: 80000 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/turnover-cases"
              payload: { association_id: "${assoc_id}", total_seats: 5 }
              as: PlatformAdmin
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /hoa/turnover-cases/${case_id}/certify-trigger"
              payload: { trigger_basis: "FIXED_DATE" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/directors"
              payload: { turnover_case_id: "${case_id}", full_name: "Owner Director One", seat_type: "OWNER_ELECTED" }
              as: ElectionInspector
              as_user_id: "inspector-1"
              captures: { dir1_id: $.data.id }
            - call: "POST /hoa/directors"
              payload: { turnover_case_id: "${case_id}", full_name: "Owner Director Two", seat_type: "OWNER_ELECTED" }
              as: ElectionInspector
              as_user_id: "inspector-1"
            - call: "POST /hoa/directors"
              payload: { turnover_case_id: "${case_id}", full_name: "Owner Director Three", seat_type: "OWNER_ELECTED" }
              as: ElectionInspector
              as_user_id: "inspector-1"
            - call: "POST /hoa/directors"
              payload: { turnover_case_id: "${case_id}", full_name: "Owner Director Four", seat_type: "OWNER_ELECTED" }
              as: ElectionInspector
              as_user_id: "inspector-1"
            - call: "POST /hoa/turnover-cases/${case_id}/advance"
              payload: { dimension: "GOVERNANCE" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
          assert:
            - "after the certify-trigger call: TurnoverCase.${case_id}.governance_status == ELECTION_CALLED, financial_status == SUBSIDY_ACTIVE, turnover_posture == TRANSITION_RESTRICTED, owner_elected_seats_required == 4"
            - "after the third director call: TurnoverCase.${case_id}.governance_status == ELECTION_CALLED and owner_elected_seats == 3, so three of four seats do not bubble up"
            - "after the fourth director call: TurnoverCase.${case_id}.governance_status == ELECTION_HELD and owner_elected_seats == 4"
            - "after the advance call: TurnoverCase.${case_id}.governance_status == OWNER_CONTROL"
            - "TurnoverCase.${case_id}.financial_status == SUBSIDY_ACTIVE unchanged throughout"
            - "TurnoverCase.${case_id}.turnover_posture == OWNER_CONTROL_OPEN"
            - "TurnoverCase.${case_id}.vacant_seats == 1 and declarant_appointed_seats == 0"
            - "TurnoverCase.${case_id}.records_transfer_completeness_pct == 100.00"

      - name: defect_claim_negotiation_cycle_reentry_and_round_cap
        grounds:
          - state_machines.DefectClaim.NOTICED_to_REJECTED_BY_DEVELOPER
          - state_machines.DefectClaim.REJECTED_BY_DEVELOPER_to_INVESTIGATING
          - state_machines.DefectClaim.INVESTIGATING_to_NOTICED
          - entities.DefectClaim.fields.negotiation_round
          - validations[priority=14]
          - errors.ERR_NEGOTIATION_ROUNDS_EXHAUSTED
        distinguishing_aspect: |
          Cyclic shape: the claim re-enters INVESTIGATING three separate times through
          NOTICED -> REJECTED_BY_DEVELOPER -> REINVESTIGATE, incrementing negotiation_round 0 -> 1 -> 2 -> 3
          while repose_deadline is NOT reset by any re-entry, and the loop is terminated by
          MAX_NEGOTIATION_ROUNDS rather than by a state, so the fourth REINVESTIGATE is refused with
          ERR_NEGOTIATION_ROUNDS_EXHAUSTED even though the from-state REJECTED_BY_DEVELOPER is legal.
        test_recipe:
          setup:
            - "Association 'Fernhollow' with statute_of_repose_years 8."
