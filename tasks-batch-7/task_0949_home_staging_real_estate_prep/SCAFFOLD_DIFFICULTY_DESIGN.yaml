            - "Listing.${listing_id}.under_contract_at == 2026-06-01T00:00:00.000Z"
            - "Listing.${listing_id}.closed_at is null"

      - name: consultation_revision_loop_increments_revision_count
        grounds:
          - state_machines.Consultation.SCOPE_SUBMITTED_to_SCOPE_REJECTED
          - state_machines.Consultation.SCOPE_REJECTED_to_SCOPE_DRAFTED
          - entities.Consultation.fields.revision_count
        distinguishing_aspect: |
          A CYCLE on a DIFFERENT entity from the Listing: Consultation loops
          SCOPE_DRAFTED -> SCOPE_SUBMITTED -> SCOPE_REJECTED -> SCOPE_DRAFTED and lands back
          in SCOPE_DRAFTED with revision_count 1, then reaches SCOPE_APPROVED on the second
          pass — a revision loop, not a re-run of a linear pipeline.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z; a HELD consultation on a VACANT property with one PACKAGE_ROOM scope item."
          setup_api_calls: &cons_held
            - call: "POST /staging/_clock/set_current_utc"
