              as: HarvestSupervisor
            - call: "GET /fields/${f_id}"
              payload: {}
              as: FarmManager
              captures: { f_v2: $.data.version }
            - call: "POST /harvest-batches"
              payload: { field_id: "${f_id}", grade: "PREMIUM", pallet_count: 10, shortfall_slabs: 0, shortfall_rolls: 0, scheduled_date: "2026-08-03", expected_field_version: "${f_v2}" }
              as: HarvestSupervisor
            - call: "POST /customers"
              payload: { full_name: "Aria Nguyen", email: "aria@example.com", phone: "555-0101", freight_zone: 2, address: "12 Oak Ln" }
              as: SalesRep
