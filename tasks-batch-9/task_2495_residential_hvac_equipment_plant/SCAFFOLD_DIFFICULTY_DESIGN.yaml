      - name: warehouse_peak_overlap_refuses_25_pallets_that_adjacency_would_admit
        grounds:
          - calculations.warehouse_pallet_occupancy
          - validations.warehouse-capacity
          - entities.Warehouse.fields.pallet_capacity
          - state_machines.WarehouseReservation.CREATE_to_ACTIVE
        distinguishing_aspect: |
          Capacity is a day-wise peak over overlapping half-open intervals, not a sum over the season
          and not a check of the request day alone. A 25-pallet reservation that overlaps an existing
          30-pallet reservation by two days pushes the peak to 55 against a 50-pallet building and is
          refused; the identical 25 pallets starting on the day the first reservation ends are
          accepted, because the intervals only touch.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, outside every reservation interval used here."
            - "Warehouse WH-1 with pallet_capacity 50."
            - "A RELEASED STANDARD-tier A1 platform with two pre-season lots at DRAFT."
            - "One ACTIVE reservation of 30 pallets from 2026-11-02 to 2026-11-12."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plant/refrigerant-programs"
              payload: { refrigerant_code: "R-410A", gwp: 2088, flammability_class: "A1", manufacture_cutoff_utc: "2027-01-01T00:00:00Z", sell_through_deadline_utc: "2027-07-01T00:00:00Z" }
              as: PlantAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /plant/warehouses"
              payload: { name: "WH-1", pallet_capacity: 50 }
              as: PlantAdmin
              captures: { wh_id: $.data.id }
            - call: "POST /plant/product-platforms"
              payload: { model_code: "LX-2400-A1", efficiency_tier: "STANDARD", refrigerant_program_id: "${prog_id}", rated_capacity_btuh: 24000, rated_eer: 11.80, rated_seer2: 14.60, compressor_part_number: "CMP-2T-A1", control_board_part_number: "CTL-4X" }
              as: DesignEngineer
              as_user_id: "user-de-1"
              captures: { plat_id: $.data.id }
            - call: "POST /plant/product-platforms/${plat_id}/submit-engineering-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "user-de-1"
            - call: "POST /plant/product-platforms/${plat_id}/release"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "user-re-1"
            - call: "POST /plant/build-orders"
              payload: { platform_id: "${plat_id}", quantity_units: 60, scheduled_start_utc: "2026-11-02T06:00:00Z", is_preseason: true }
              as: ProductionPlanner
              captures: { bo1_id: $.data.id }
            - call: "POST /plant/build-orders"
              payload: { platform_id: "${plat_id}", quantity_units: 50, scheduled_start_utc: "2026-11-10T06:00:00Z", is_preseason: true }
              as: ProductionPlanner
              captures: { bo2_id: $.data.id }
            - call: "POST /plant/warehouse-reservations"
              payload: { warehouse_id: "${wh_id}", build_order_id: "${bo1_id}", start_date: "2026-11-02", end_date: "2026-11-12", pallet_units: 30 }
              as: ProductionPlanner
              captures: { res1_id: $.data.id }
          trigger:
            - call: "POST /plant/warehouse-reservations"
              payload: { warehouse_id: "${wh_id}", build_order_id: "${bo2_id}", start_date: "2026-11-10", end_date: "2026-11-20", pallet_units: 25 }
              as: ProductionPlanner
              captures: { err_id: $.data.error_id }
            - call: "POST /plant/warehouse-reservations"
              payload: { warehouse_id: "${wh_id}", build_order_id: "${bo2_id}", start_date: "2026-11-12", end_date: "2026-11-20", pallet_units: 25 }
              as: ProductionPlanner
              captures: { res2_id: $.data.id }
          assert:
            - "First trigger call: HTTP 409 with ${err_id} == ERR_WAREHOUSE_CAPACITY_EXCEEDED - the day-wise peak on 2026-11-10 and 2026-11-11 would be 55 against a capacity of 50"
            - "After the refusal GET /plant/warehouses/${wh_id}/reservations?status=ACTIVE returns exactly 1 record, ${res1_id}"
            - "Second trigger call, same 25 pallets shifted to start on the first reservation's exclusive end date: HTTP 201"
            - "GET /plant/warehouses/${wh_id}/occupancy?on_date=2026-11-11 returns occupancy_units == 30 and GET /plant/warehouses/${wh_id}/occupancy?on_date=2026-11-12 returns occupancy_units == 25 - never 55"
            - "GET /plant/warehouses/${wh_id}/occupancy?window_start=2026-11-01&window_end=2026-12-01 returns peak_occupancy_units == 30"
            - "GET /plant/warehouses/${wh_id}/reservations?status=ACTIVE now returns 2 records, ${res1_id} and ${res2_id}"

  - rule_id: compensating_invariant
    instances:
      - name: order_cancellation_restores_supply_conservation_identity
        grounds:
          - state_machines.DistributorOrder.PENDING_to_CANCELLED
          - state_machines.AllocationLine.RESERVED_to_RELEASED
          - state_machines.ComponentSupply.EXHAUSTED_to_ACTIVE
          - calculations.supply_effective_capacity
          - entities.ComponentSupply.fields.available_units
        distinguishing_aspect: |
          Cancelling the order is the exact inverse of allocating it: two RESERVED lines are released,
          both supply rows walk EXHAUSTED back to ACTIVE, reserved_units returns to 0 and
          available_units back to 100, and the conserved identity effective_allocatable_units ==
          available_units + reserved_units + committed_units holds again on both rows. An
          implementation that decrements available_units on allocate without recomputing it on
          release leaves the pool permanently short.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A RELEASED HIGH-tier A2L platform CERTIFIED for SOUTHEAST, whose ACTIVE standard is the only one on file."
            - "For supply month 2026-11: compressor lot 100 units and control-board lot 100 units, both PRIORITY_WATERFALL."
            - "A SOUTHEAST order for 100 units created by user-dr-1 and fully allocated, so both supply rows are EXHAUSTED with available_units 0 and reserved_units 100."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plant/refrigerant-programs"
              payload: { refrigerant_code: "R-454B", gwp: 466, flammability_class: "A2L", manufacture_cutoff_utc: "2027-01-01T00:00:00Z", sell_through_deadline_utc: "2027-07-01T00:00:00Z" }
              as: PlantAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /plant/regional-standards"
              payload: { region_code: "SOUTHEAST", min_seer2_standard: 14.30, min_seer2_high: 15.20, min_seer2_premium: 16.00, effective_from_utc: "2026-01-01T00:00:00Z" }
              as: PlantAdmin
              captures: { std_se_id: $.data.id }
            - call: "POST /plant/product-platforms"
              payload: { model_code: "HX-3600-A2L", efficiency_tier: "HIGH", refrigerant_program_id: "${prog_id}", rated_capacity_btuh: 36000, rated_eer: 12.50, rated_seer2: 15.80, compressor_part_number: "CMP-5T-A2L", control_board_part_number: "CTL-9X", max_charge_grams: 1800 }
              as: DesignEngineer
              as_user_id: "user-de-1"
              captures: { plat_id: $.data.id }
            - call: "POST /plant/product-platforms/${plat_id}/submit-engineering-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "user-de-1"
            - call: "POST /plant/product-platforms/${plat_id}/release"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "user-re-1"
              captures: { plat_v_released: $.data.version }
            - call: "POST /plant/certification-records"
              payload: { platform_id: "${plat_id}", region_code: "SOUTHEAST", rated_seer2_submitted: 15.80, expected_platform_version: "${plat_v_released}" }
              as: CertificationEngineer
              as_user_id: "user-ce-1"
              captures: { cert_id: $.data.id }
            - call: "POST /plant/certification-records/${cert_id}/submit"
              payload: {}
              as: CertificationEngineer
              as_user_id: "user-ce-1"
            - call: "POST /plant/certification-records/${cert_id}/decide"
              payload: { decision: "CERTIFIED" }
              as: RegulatoryAuditor
              as_user_id: "user-ra-1"
            - call: "POST /plant/component-supplies"
              payload: { component_type: "COMPRESSOR", part_number: "CMP-5T-A2L", supplier_lot_code: "LOT-CMP-51", supply_month: "2026-11", total_allocatable_units: 100, allocation_policy: "PRIORITY_WATERFALL" }
              as: SupplyPlanner
              captures: { cmp_id: $.data.id, cmp_v0: $.data.version }
            - call: "POST /plant/component-supplies"
              payload: { component_type: "CONTROL_BOARD", part_number: "CTL-9X", supplier_lot_code: "LOT-CTL-77", supply_month: "2026-11", total_allocatable_units: 100, allocation_policy: "PRIORITY_WATERFALL" }
              as: SupplyPlanner
              captures: { ctl_id: $.data.id }
            - call: "POST /plant/distributor-orders"
              payload: { distributor_code: "DIST-SE-1", platform_id: "${plat_id}", region_code: "SOUTHEAST", requested_units: 100, priority_score: 75, requested_delivery_month: "2026-11" }
              as: DistributorRep
              as_user_id: "user-dr-1"
              captures: { ord_id: $.data.id }
            - call: "POST /plant/distributor-orders/${ord_id}/allocate"
              payload: { expected_component_supply_version: "${cmp_v0}" }
              as: SupplyPlanner
          trigger:
            - call: "POST /plant/distributor-orders/${ord_id}/cancel"
              payload: { reason: "Distributor withdrew the pre-season order" }
