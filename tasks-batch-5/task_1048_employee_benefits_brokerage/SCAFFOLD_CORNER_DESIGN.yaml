            - { call: "POST /census-members", payload: { client_id: "${cid}", full_name: "Only Member", birth_date: "1990-01-01", annual_salary_cents: 4000000, monthly_contribution_cents: 15000, employment_type: "PART_TIME" }, as: BenefitsConsultant, captures: { mid: "$.data.id" } }
          trigger:
            - { call: "GET /census-members", payload: { client_id: "${cid}" }, as: BenefitsConsultant }
          assert:
            - "response_type == array"
            - "data[0].id == ${mid}"

