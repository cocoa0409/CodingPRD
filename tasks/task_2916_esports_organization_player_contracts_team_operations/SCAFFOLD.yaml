  # --- ContractOffer --------------------------------------------------------
  - method: POST
    path: "/contract-offers"
    description: "Send a contract offer to a player; optionally supersedes an earlier open offer"
    roles: [GeneralManager]
    code: 201
    input: [organization_id, player_id, base_salary_cents, term_months, prize_split_player_pct_bp, streaming_hours_per_week, tax_residency_code, "signing_bonus_cents?", "buyout_multiplier_bp?", "supersedes_offer_id?"]
    output: ContractOffer
    side_effects: ["sent_at stamped from the logical clock", "expires_at = sent_at + League.offer_response_window_hours", "round_number set to 1", "any offer named by supersedes_offer_id moves SENT|COUNTERED -> SUPERSEDED"]
  - method: GET
    path: "/contract-offers/{id}"
    description: "Read one offer; lazy expiry is applied before the read is served"
    roles: [LeagueAdmin, GeneralManager, PlayerAgent]
    code: 200
    input: []
    output: ContractOffer
    side_effects: ["SENT|COUNTERED -> EXPIRED when current_utc >= expires_at"]
  - method: GET
    path: "/contract-offers"
    description: "List offers filtered by organization, player, supersede chain or status (FK reverse for all three ContractOffer keys)"
    roles: [LeagueAdmin, GeneralManager, PlayerAgent]
    code: 200
    input: ["organization_id?", "player_id?", "supersedes_offer_id?", "offer_status?", "limit?", "offset?"]
    output: ContractOffer[]
    side_effects: ["lazy expiry applied to every offer in the result page"]
  - method: POST
    path: "/contract-offers/{id}/counter"
    description: "Agent counters the offer with revised salary, prize split and streaming terms"
    roles: [PlayerAgent]
    code: 200
    input: [counter_base_salary_cents, counter_prize_split_player_pct_bp, counter_streaming_hours_per_week, "counter_note?"]
    output: ContractOffer
    side_effects: ["offer_status SENT -> COUNTERED", "round_number incremented", "version incremented"]
  - method: POST
    path: "/contract-offers/{id}/revise"
    description: "Organization answers a counter with new headline terms, restarting the response window"
    roles: [GeneralManager]
    code: 200
    input: [base_salary_cents, prize_split_player_pct_bp, streaming_hours_per_week]
    output: ContractOffer
    side_effects: ["offer_status COUNTERED -> SENT", "sent_at re-stamped and expires_at recomputed", "counter_* fields cleared", "version incremented"]
  - method: POST
    path: "/contract-offers/{id}/accept"
    description: "Agent accepts the offer, creating the PlayerContract and consuming provisional cap space"
    roles: [PlayerAgent]
    code: 201
    input: [effective_at]
    output: PlayerContract
    side_effects: ["offer_status -> ACCEPTED", "PlayerContract created ACTIVE/COMPLIANT with the offer's terms copied and frozen", "ends_at = effective_at + term_months * 30 days", "provisional_cap_charge_cents frozen per calculations.salary_cap_charge PRORATED_REMAINING_TERM", "Organization.committed_salary_cents and active_roster_count increased per calculations.org_salary_commitment", "Player -> SIGNED with current_organization_id set", "sibling SENT|COUNTERED offers for the same player -> SUPERSEDED"]
  - method: POST
    path: "/contract-offers/{id}/decline"
    description: "Agent declines the offer"
    roles: [PlayerAgent]
    code: 200
    input: ["decline_note?"]
    output: ContractOffer
    side_effects: ["offer_status SENT|COUNTERED -> DECLINED", "version incremented"]

