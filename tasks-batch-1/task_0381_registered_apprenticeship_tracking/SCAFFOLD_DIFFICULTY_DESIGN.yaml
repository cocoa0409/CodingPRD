# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Registered Apprenticeship Tracking (DOL) — Expert
#
# 9 rule_ids x 2 instances = 18 instances. Every grounds ref resolves into
# SCAFFOLD.yaml §1.1–§1.7. Every setup_api_calls/trigger call resolves to a
# §1.5 endpoint with a §1.7 role and §1.5-conforming payload; every ${var} is
# bound by an earlier captures: line; OCC version inputs reference a ${var}.
#
# Reusable wage-step ladder used throughout (base_journeyworker_wage_cents=4000):
#   step 1: threshold 0  hrs, pct 0.50 -> wage 2000c
#   step 2: threshold 8  hrs, pct 0.65 -> wage 2600c
#   step 3: threshold 16 hrs, pct 0.80 -> wage 3200c
#   step 4: threshold 24 hrs, pct 0.95 -> wage 3800c
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: wage_step_hours_vs_competency_variant_diverges
        grounds:
          - calculations.wage_step_determination
          - entities.ApprenticeAgreement.fields.current_wage_step
          - entities.ApprenticeAgreement.fields.current_hourly_wage_cents
          - entities.ApprenticeshipProgram.fields.completion_type
        distinguishing_aspect: |
          Identical apprentice data (8 approved OJT hours + 1 approved milestone) yields
          current_wage_step=2 / wage 2600c under a HOURS_BASED program but step=1 / wage 2000c
          under a COMPETENCY_BASED program — the divergence lives on ApprenticeAgreement wage.
        test_recipe:
          setup:
            - "Sponsor S; one QUALIFIED journeyworker JW_H and one QUALIFIED journeyworker JW_C."
            - "Apprentices AP_H and AP_C under S."
            - "HOURS_BASED program PROG_H (ratio 4) with the 4-step wage ladder + 1 milestone M_H; ACTIVE."
            - "COMPETENCY_BASED program PROG_C (ratio 4) with the SAME 4-step wage ladder + 1 milestone M_C; ACTIVE."
            - "Agreement AGR_H (PROG_H) ACTIVE; agreement AGR_C (PROG_C) ACTIVE."
            - "Each agreement has one APPROVED OJT entry crediting 8 hours and one APPROVED milestone attainment."
          setup_api_calls:
            - call: "POST /apprenticeship/sponsors"
              payload: { legal_name: "Acme Trades", ein: "12-3456789", contact_email: "s@acme.test" }
              as: Sponsor
              captures: { s_id: $.data.id }
            - call: "POST /apprenticeship/journeyworkers"
              payload: { sponsor_id: "${s_id}", full_name: "JW H" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { jwh_id: $.data.id }
            - call: "POST /apprenticeship/journeyworkers/${jwh_id}/qualify"
              payload: {}
              as: Sponsor
              as_user_id: "${s_id}"
            - call: "POST /apprenticeship/journeyworkers"
              payload: { sponsor_id: "${s_id}", full_name: "JW C" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { jwc_id: $.data.id }
            - call: "POST /apprenticeship/journeyworkers/${jwc_id}/qualify"
              payload: {}
              as: Sponsor
              as_user_id: "${s_id}"
            - call: "POST /apprenticeship/apprentices"
              payload: { sponsor_id: "${s_id}", full_name: "AP H", gender: "MALE", race_ethnicity: "WHITE" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { aph_id: $.data.id }
            - call: "POST /apprenticeship/apprentices"
              payload: { sponsor_id: "${s_id}", full_name: "AP C", gender: "FEMALE", race_ethnicity: "BLACK" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { apc_id: $.data.id }
            - call: "POST /apprenticeship/programs"
              payload: { sponsor_id: "${s_id}", occupation_code: "47-2111.00", occupation_title: "Electrician", completion_type: "HOURS_BASED", ojt_hours_required: 16, rti_hours_required: 8, base_journeyworker_wage_cents: 4000, journeyman_ratio: 4 }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { progh_id: $.data.id }
            - call: "POST /apprenticeship/wage-steps"
              payload: { program_id: "${progh_id}", step_number: 1, ojt_hours_threshold: 0, wage_pct: 0.50 }
              as: Sponsor
              as_user_id: "${s_id}"
            - call: "POST /apprenticeship/wage-steps"
              payload: { program_id: "${progh_id}", step_number: 2, ojt_hours_threshold: 8, wage_pct: 0.65 }
              as: Sponsor
              as_user_id: "${s_id}"
            - call: "POST /apprenticeship/wage-steps"
              payload: { program_id: "${progh_id}", step_number: 3, ojt_hours_threshold: 16, wage_pct: 0.80 }
              as: Sponsor
              as_user_id: "${s_id}"
            - call: "POST /apprenticeship/wage-steps"
              payload: { program_id: "${progh_id}", step_number: 4, ojt_hours_threshold: 24, wage_pct: 0.95 }
              as: Sponsor
              as_user_id: "${s_id}"
            - call: "POST /apprenticeship/milestones"
              payload: { program_id: "${progh_id}", sequence: 1, title: "Safety Cert" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { mh_id: $.data.id }
            - call: "POST /apprenticeship/programs/${progh_id}/activate"
              payload: {}
              as: RegistrationAgency
              captures: { progh_v: $.data.version }
            - call: "POST /apprenticeship/programs"
              payload: { sponsor_id: "${s_id}", occupation_code: "47-2111.00", occupation_title: "Electrician", completion_type: "COMPETENCY_BASED", ojt_hours_required: 16, rti_hours_required: 8, base_journeyworker_wage_cents: 4000, journeyman_ratio: 4 }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { progc_id: $.data.id }
            - call: "POST /apprenticeship/wage-steps"
              payload: { program_id: "${progc_id}", step_number: 1, ojt_hours_threshold: 0, wage_pct: 0.50 }
              as: Sponsor
              as_user_id: "${s_id}"
            - call: "POST /apprenticeship/wage-steps"
              payload: { program_id: "${progc_id}", step_number: 2, ojt_hours_threshold: 8, wage_pct: 0.65 }
              as: Sponsor
              as_user_id: "${s_id}"
            - call: "POST /apprenticeship/wage-steps"
              payload: { program_id: "${progc_id}", step_number: 3, ojt_hours_threshold: 16, wage_pct: 0.80 }
              as: Sponsor
              as_user_id: "${s_id}"
            - call: "POST /apprenticeship/wage-steps"
              payload: { program_id: "${progc_id}", step_number: 4, ojt_hours_threshold: 24, wage_pct: 0.95 }
              as: Sponsor
              as_user_id: "${s_id}"
            - call: "POST /apprenticeship/milestones"
              payload: { program_id: "${progc_id}", sequence: 1, title: "Safety Cert" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { mc_id: $.data.id }
            - call: "POST /apprenticeship/programs/${progc_id}/activate"
              payload: {}
              as: RegistrationAgency
              captures: { progc_v: $.data.version }
            - call: "POST /apprenticeship/agreements"
              payload: { program_id: "${progh_id}", apprentice_id: "${aph_id}", journeyworker_id: "${jwh_id}", start_date: "2026-01-01" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { agrh_id: $.data.id }
            - call: "POST /apprenticeship/agreements/${agrh_id}/register"
              payload: { expected_program_version: "${progh_v}" }
              as: Sponsor
              as_user_id: "${s_id}"
            - call: "POST /apprenticeship/agreements/${agrh_id}/activate"
              payload: {}
              as: Sponsor
              as_user_id: "${s_id}"
            - call: "POST /apprenticeship/agreements"
              payload: { program_id: "${progc_id}", apprentice_id: "${apc_id}", journeyworker_id: "${jwc_id}", start_date: "2026-01-01" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { agrc_id: $.data.id }
            - call: "POST /apprenticeship/agreements/${agrc_id}/register"
              payload: { expected_program_version: "${progc_v}" }
              as: Sponsor
              as_user_id: "${s_id}"
            - call: "POST /apprenticeship/agreements/${agrc_id}/activate"
              payload: {}
              as: Sponsor
              as_user_id: "${s_id}"
            - call: "POST /apprenticeship/ojt-entries"
              payload: { agreement_id: "${agrh_id}", work_date: "2026-02-01", start_time: 480, end_time: 960, credited_hours: 8 }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { ojth_id: $.data.id }
            - call: "POST /apprenticeship/ojt-entries/${ojth_id}/approve"
              payload: {}
              as: TrainingCoordinator
            - call: "POST /apprenticeship/milestone-attainments"
              payload: { agreement_id: "${agrh_id}", milestone_id: "${mh_id}", attained_on: "2026-02-02" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { math_id: $.data.id }
            - call: "POST /apprenticeship/milestone-attainments/${math_id}/approve"
              payload: {}
              as: TrainingCoordinator
            - call: "POST /apprenticeship/ojt-entries"
              payload: { agreement_id: "${agrc_id}", work_date: "2026-02-01", start_time: 480, end_time: 960, credited_hours: 8 }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { ojtc_id: $.data.id }
            - call: "POST /apprenticeship/ojt-entries/${ojtc_id}/approve"
              payload: {}
              as: TrainingCoordinator
            - call: "POST /apprenticeship/milestone-attainments"
              payload: { agreement_id: "${agrc_id}", milestone_id: "${mc_id}", attained_on: "2026-02-02" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { matc_id: $.data.id }
            - call: "POST /apprenticeship/milestone-attainments/${matc_id}/approve"
              payload: {}
              as: TrainingCoordinator
          trigger:
            - call: "GET /apprenticeship/agreements/${agrh_id}"
              payload: {}
              as: Sponsor
              as_user_id: "${s_id}"
            - call: "GET /apprenticeship/agreements/${agrc_id}"
              payload: {}
              as: Sponsor
              as_user_id: "${s_id}"
          assert:
            - "ApprenticeAgreement.${agrh_id}.current_wage_step == 2"
            - "ApprenticeAgreement.${agrh_id}.current_hourly_wage_cents == 2600"
            - "ApprenticeAgreement.${agrc_id}.current_wage_step == 1"
            - "ApprenticeAgreement.${agrc_id}.current_hourly_wage_cents == 2000"

      - name: eeo_completion_rate_registered_vs_active_cohort_diverges
        grounds:
          - calculations.eeo_completion_rate
          - entities.EEOReport.fields.completion_rate_pct
          - entities.EEOReport.fields.total_apprentices
          - entities.EEOReport.fields.cohort_basis
        distinguishing_aspect: |
          For the same program (1 COMPLETED, 1 CANCELLED, 2 ACTIVE agreements), the EEOReport
          completion_rate_pct is 25.0 under REGISTERED_COHORT (denominator 4) but 33.33 under
          ACTIVE_COHORT (denominator 3) — the dual variant lives on the EEOReport/program domain,
          distinct from the ApprenticeAgreement wage variant above.
        test_recipe:
          setup:
            - "ACTIVE HOURS_BASED program PROG with ratio 8 (so 4 slots available) under sponsor S."
            - "One QUALIFIED journeyworker; four apprentices AP1..AP4."
            - "Four agreements: AGR1 COMPLETED, AGR2 CANCELLED, AGR3 ACTIVE, AGR4 ACTIVE."
            - "AGR1 met completion (16 OJT hours approved + 8 RTI hours) before completion."
          setup_api_calls:
            - call: "POST /apprenticeship/sponsors"
              payload: { legal_name: "Cohort Co", ein: "22-2222222", contact_email: "c@x.test" }
              as: Sponsor
              captures: { s_id: $.data.id }
            - call: "POST /apprenticeship/journeyworkers"
              payload: { sponsor_id: "${s_id}", full_name: "JW1" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { jw_id: $.data.id }
            - call: "POST /apprenticeship/journeyworkers/${jw_id}/qualify"
              payload: {}
              as: Sponsor
              as_user_id: "${s_id}"
            - call: "POST /apprenticeship/apprentices"
              payload: { sponsor_id: "${s_id}", full_name: "AP1", gender: "MALE", race_ethnicity: "WHITE" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { ap1_id: $.data.id }
            - call: "POST /apprenticeship/apprentices"
              payload: { sponsor_id: "${s_id}", full_name: "AP2", gender: "FEMALE", race_ethnicity: "BLACK" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { ap2_id: $.data.id }
            - call: "POST /apprenticeship/apprentices"
              payload: { sponsor_id: "${s_id}", full_name: "AP3", gender: "MALE", race_ethnicity: "ASIAN" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { ap3_id: $.data.id }
            - call: "POST /apprenticeship/apprentices"
              payload: { sponsor_id: "${s_id}", full_name: "AP4", gender: "FEMALE", race_ethnicity: "HISPANIC" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { ap4_id: $.data.id }
            - call: "POST /apprenticeship/programs"
              payload: { sponsor_id: "${s_id}", occupation_code: "49-9021.00", occupation_title: "HVAC", completion_type: "HOURS_BASED", ojt_hours_required: 16, rti_hours_required: 8, base_journeyworker_wage_cents: 4000, journeyman_ratio: 8 }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { prog_id: $.data.id }
            - call: "POST /apprenticeship/wage-steps"
              payload: { program_id: "${prog_id}", step_number: 1, ojt_hours_threshold: 0, wage_pct: 0.50 }
              as: Sponsor
              as_user_id: "${s_id}"
            - call: "POST /apprenticeship/programs/${prog_id}/activate"
              payload: {}
              as: RegistrationAgency
              captures: { v0: $.data.version }
            - call: "POST /apprenticeship/agreements"
              payload: { program_id: "${prog_id}", apprentice_id: "${ap1_id}", journeyworker_id: "${jw_id}", start_date: "2026-01-01" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { agr1_id: $.data.id }
            - call: "POST /apprenticeship/agreements/${agr1_id}/register"
              payload: { expected_program_version: "${v0}" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { v1: $.data.version }
            - call: "POST /apprenticeship/agreements/${agr1_id}/activate"
              payload: {}
              as: Sponsor
              as_user_id: "${s_id}"
            - call: "POST /apprenticeship/ojt-entries"
              payload: { agreement_id: "${agr1_id}", work_date: "2026-02-01", start_time: 0, end_time: 600, credited_hours: 16 }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /apprenticeship/ojt-entries/${o1_id}/approve"
              payload: {}
              as: TrainingCoordinator
            - call: "POST /apprenticeship/rti-records"
              payload: { agreement_id: "${agr1_id}", course_code: "RTI-101", session_date: "2026-02-02", instruction_hours: 8 }
              as: TrainingCoordinator
            - call: "POST /apprenticeship/agreements/${agr1_id}/complete"
              payload: {}
              as: RegistrationAgency
            - call: "GET /apprenticeship/programs/${prog_id}"
              payload: {}
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { v2: $.data.version }
            - call: "POST /apprenticeship/agreements"
              payload: { program_id: "${prog_id}", apprentice_id: "${ap2_id}", journeyworker_id: "${jw_id}", start_date: "2026-01-01" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { agr2_id: $.data.id }
            - call: "POST /apprenticeship/agreements/${agr2_id}/register"
              payload: { expected_program_version: "${v2}" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { v3: $.data.version }
            - call: "POST /apprenticeship/agreements/${agr2_id}/cancel"
              payload: {}
              as: Sponsor
              as_user_id: "${s_id}"
            - call: "GET /apprenticeship/programs/${prog_id}"
              payload: {}
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { v4: $.data.version }
            - call: "POST /apprenticeship/agreements"
              payload: { program_id: "${prog_id}", apprentice_id: "${ap3_id}", journeyworker_id: "${jw_id}", start_date: "2026-01-01" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { agr3_id: $.data.id }
            - call: "POST /apprenticeship/agreements/${agr3_id}/register"
              payload: { expected_program_version: "${v4}" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { v5: $.data.version }
            - call: "POST /apprenticeship/agreements/${agr3_id}/activate"
              payload: {}
              as: Sponsor
              as_user_id: "${s_id}"
            - call: "POST /apprenticeship/agreements"
              payload: { program_id: "${prog_id}", apprentice_id: "${ap4_id}", journeyworker_id: "${jw_id}", start_date: "2026-01-01" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { agr4_id: $.data.id }
            - call: "POST /apprenticeship/agreements/${agr4_id}/register"
              payload: { expected_program_version: "${v5}" }
              as: Sponsor
              as_user_id: "${s_id}"
            - call: "POST /apprenticeship/agreements/${agr4_id}/activate"
              payload: {}
              as: Sponsor
              as_user_id: "${s_id}"
          trigger:
