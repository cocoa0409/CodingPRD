        grounds:
          - state_machines.SimpDocument.DRAFT_to_SUBMITTED
          - state_machines.SimpDocument.SUBMITTED_to_ACCEPTED
          - validations[priority=29]
          - errors.ERR_SIMP_STATE_INVALID
        distinguishing_aspect: |
          Submitting the same document twice is NOT idempotent: the second submit from
          SUBMITTED is refused, and amendment_count stays 0 -- the counter only advances on the
          DEFICIENT -> SUBMITTED amendment edge, so a re-submit that silently succeeded would
          corrupt the amendment history.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z"
            - "Red Snapper SupplierLot in intake_status RECEIVED"
            - "SimpDocument in status SUBMITTED after one submit"
          setup_api_calls:
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ChainAdmin
            - call: "POST /seafood-ops/counters"
              payload: { store_number: "4120", department_name: "Seafood Service Counter", case_slot_count: 6 }
              as: ChainAdmin
              captures: { counter_id: $.data.id }
            - call: "POST /seafood-ops/suppliers"
              payload: { name: "Gulf Bay Dealers", permit_number: "PERMIT-8801" }
              as: ChainAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /seafood-ops/species"
              payload: { market_name: "Red Snapper", scientific_name: "Lutjanus campechanus", acceptable_market_names: ["Red Snapper"], simp_covered: true, high_risk_substitution: true, sustainability_program_eligible: false }
              as: ChainAdmin
              captures: { snapper_id: $.data.id }
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${snapper_id}", lot_code: "SNP-0801-D", harvest_method: "WILD_TRAP", production_method: "WILD", origin_country_code: "MX", previously_frozen: false, fresh_claim: false, received_weight_kg: 15.000, unit_cost_cents_per_kg: 2600, retail_price_cents_per_kg: 3400, cooked_retail_price_cents_per_kg: 3800 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /seafood-ops/simp-documents"
              payload: { lot_id: "${lot_id}", harvesting_vessel_name: "Estrella del Golfo", harvest_date: "2026-07-20T00:00:00Z", landing_date: "2026-07-22T00:00:00Z", chain_of_custody_ref: "COC-55210" }
              as: SupplierRep
              as_user_id: "${supplier_id}"
              captures: { doc_id: $.data.id }
            - call: "POST /seafood-ops/simp-documents/${doc_id}/submit"
              payload: {}
              as: SupplierRep
              as_user_id: "${supplier_id}"
          trigger:
            - call: "POST /seafood-ops/simp-documents/${doc_id}/submit"
              payload: { chain_of_custody_ref: "COC-55210-REV2" }
              as: SupplierRep
              as_user_id: "${supplier_id}"
              captures: { e_repeat: $.data.error_id }
          assert:
            - "trigger returns HTTP 409 with ${e_repeat} == ERR_SIMP_STATE_INVALID"
            - "SimpDocument.${doc_id}.status == SUBMITTED"
            - "SimpDocument.${doc_id}.amendment_count == 0"
            - "SimpDocument.${doc_id}.chain_of_custody_ref == \"COC-55210\""
            - "SimpDocument.${doc_id}.reviewed_at == null"

      - name: parallel_dimensions_move_independently_on_the_lot
        claim_type: parallel
        grounds:
          - state_machines.SupplierLot.intake_status
          - state_machines.SupplierLot.label_status
          - state_machines.SupplierLot.chargeback_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / supplier_lot_three_parallel_dimensions_independent
          rationale: "The named §1.8 instance already drives all three SupplierLot dimensions and asserts the combined state after each independent move."

      - name: advertisement_fork_join_requires_both_branches
        claim_type: branching
        grounds:
          - state_machines.AdvertisedItem.status.DRAFT_to_APPROVED
          - state_machines.AdvertisedItem.cool_review_status
          - state_machines.AdvertisedItem.claim_review_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / advertised_item_fork_join_two_review_branches
          rationale: "The named §1.8 instance already asserts that the join to APPROVED fires only once both review dimensions are cleared, and that either rejection forces REJECTED."

      - name: sample_dispute_loop_terminates_at_the_retest_bound
        claim_type: cyclic
        grounds:
          - state_machines.VerificationSample.DISPUTED_to_IN_LAB
          - validations[priority=33]
          - errors.ERR_RETEST_LIMIT_REACHED
        excluded_because:
          difficulty_instance: non_linear_state_machine / verification_sample_dispute_retest_cycle_bounded
          rationale: "The named §1.8 instance already walks the MISMATCH -> DISPUTED -> IN_LAB loop twice and asserts ERR_RETEST_LIMIT_REACHED on the third dispute."

  # ===========================================================================
  - section: calculations
    instances:
      - name: sampling_plan_counts_only_candidate_lots_and_high_risk_species
        claim_type: input_set_filtering
        grounds:
          - calculations.verification_sampling_plan
          - entities.Counter.fields.last_cycle_required_samples
          - entities.Species.fields.high_risk_substitution
        distinguishing_aspect: |
          The candidate set is filtered on BOTH dimensions -- intake_status IN {CASED, HELD}
          and label_status IN {UNVERIFIED, RELABELED} -- so a third lot left in RECEIVED must
          not contribute, and only the one high-risk candidate feeds the divisor: 1 + ceil(1/3)
          + 0 = 2 required samples with a max rolling risk index of 0.00.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z"
            - "Atlantic Cod (not high risk) cased into slot 1 and Gulf Grouper (high risk, not import-monitored) cased into slot 2, both label_status UNVERIFIED"
            - "a third Atlantic Cod lot left in intake_status RECEIVED, which is outside the candidate set"
            - "Supplier has taken no samples, so substitution_risk_index_rolling is 0.00"
          setup_api_calls:
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ChainAdmin
            - call: "POST /seafood-ops/counters"
              payload: { store_number: "4120", department_name: "Seafood Service Counter", case_slot_count: 6 }
              as: ChainAdmin
              captures: { counter_id: $.data.id }
            - call: "POST /seafood-ops/suppliers"
              payload: { name: "Gulf Bay Dealers", permit_number: "PERMIT-8801" }
              as: ChainAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /seafood-ops/species"
              payload: { market_name: "Atlantic Cod", scientific_name: "Gadus morhua", acceptable_market_names: ["Atlantic Cod", "Cod"], simp_covered: false, high_risk_substitution: false, sustainability_program_eligible: true }
              as: ChainAdmin
              captures: { cod_id: $.data.id }
            - call: "POST /seafood-ops/species"
              payload: { market_name: "Gulf Grouper", scientific_name: "Mycteroperca jordani", acceptable_market_names: ["Gulf Grouper", "Grouper"], simp_covered: false, high_risk_substitution: true, sustainability_program_eligible: false }
              as: ChainAdmin
              captures: { grouper_id: $.data.id }
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${cod_id}", lot_code: "COD-0801-A", harvest_method: "WILD_LONGLINE", production_method: "WILD", origin_country_code: "US", previously_frozen: false, fresh_claim: true, received_weight_kg: 10.000, unit_cost_cents_per_kg: 1700, retail_price_cents_per_kg: 2450, cooked_retail_price_cents_per_kg: 2600 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { cod_lot: $.data.id }
            - call: "POST /seafood-ops/lots/${cod_lot}/case"
              payload: { case_slot: 1 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${grouper_id}", lot_code: "GRP-0801-A", harvest_method: "WILD_TRAP", production_method: "WILD", origin_country_code: "MX", previously_frozen: false, fresh_claim: false, received_weight_kg: 12.000, unit_cost_cents_per_kg: 2400, retail_price_cents_per_kg: 3200, cooked_retail_price_cents_per_kg: 3500 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { grouper_lot: $.data.id }
            - call: "POST /seafood-ops/lots/${grouper_lot}/case"
              payload: { case_slot: 2 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${cod_id}", lot_code: "COD-0801-B", harvest_method: "WILD_LONGLINE", production_method: "WILD", origin_country_code: "US", previously_frozen: false, fresh_claim: true, received_weight_kg: 10.000, unit_cost_cents_per_kg: 1700, retail_price_cents_per_kg: 2450, cooked_retail_price_cents_per_kg: 2600 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { uncased_lot: $.data.id }
            - call: "GET /seafood-ops/counters/${counter_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
              captures: { counter_v: $.data.version }
          trigger:
            - call: "POST /seafood-ops/counters/${counter_id}/close-verification-cycle"
              payload: { expected_counter_version: "${counter_v}" }
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
          assert:
            - "Counter.${counter_id}.last_cycle_required_samples == 2"
            - "Counter.${counter_id}.last_cycle_required_samples != 3"
            - "Counter.${counter_id}.last_cycle_max_supplier_risk_index == 0.00"
            - "Counter.${counter_id}.verification_cycle_index == 1"
            - "SupplierLot.${uncased_lot}.intake_status == RECEIVED"
            - "Counter.${counter_id}.posture == OPEN"

      - name: cold_chain_replay_is_chronological_not_arrival_ordered
        claim_type: correct_result
        grounds:
          - calculations.cold_chain_exposure
          - entities.ColdChainExcursion.fields.started_at
          - entities.ColdChainExcursion.fields.exposure_minutes
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          The excursion is a full chronological replay of the slot's breach set, not an
          incremental fold over arrival order: posting the 15:30 breach FIRST and the 13:00
          breach second must still yield started_at 13:00, exposure_minutes 150 and severity
          MAJOR, and a later compliant 4.0 C reading must not close the excursion.
        test_recipe:
          setup:
            - "logical clock advanced to 2026-08-01T16:00:00Z"
            - "Atlantic Cod SupplierLot cased into slot 1"
            - "no reading has been taken yet, so no excursion exists"
          setup_api_calls:
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ChainAdmin
            - call: "POST /seafood-ops/counters"
              payload: { store_number: "4120", department_name: "Seafood Service Counter", case_slot_count: 6 }
              as: ChainAdmin
              captures: { counter_id: $.data.id }
            - call: "POST /seafood-ops/suppliers"
              payload: { name: "Gulf Bay Dealers", permit_number: "PERMIT-8801" }
              as: ChainAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /seafood-ops/species"
              payload: { market_name: "Atlantic Cod", scientific_name: "Gadus morhua", acceptable_market_names: ["Atlantic Cod", "Cod"], simp_covered: false, high_risk_substitution: false, sustainability_program_eligible: true }
              as: ChainAdmin
              captures: { cod_id: $.data.id }
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${cod_id}", lot_code: "COD-0801-A", harvest_method: "WILD_LONGLINE", production_method: "WILD", origin_country_code: "US", previously_frozen: false, fresh_claim: true, received_weight_kg: 10.000, unit_cost_cents_per_kg: 1700, retail_price_cents_per_kg: 2450, cooked_retail_price_cents_per_kg: 2600 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /seafood-ops/lots/${lot_id}/case"
              payload: { case_slot: 1 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T16:00:00Z" }
              as: ChainAdmin
          trigger:
            - call: "POST /seafood-ops/ice-bed-readings"
              payload: { counter_id: "${counter_id}", case_slot: 1, reading_at: "2026-08-01T15:30:00Z", temperature_c: 4.8, taken_by_user_id: "assoc-7" }
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "POST /seafood-ops/ice-bed-readings"
              payload: { counter_id: "${counter_id}", case_slot: 1, reading_at: "2026-08-01T13:00:00Z", temperature_c: 5.0, taken_by_user_id: "assoc-7" }
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "POST /seafood-ops/ice-bed-readings"
              payload: { counter_id: "${counter_id}", case_slot: 1, reading_at: "2026-08-01T15:45:00Z", temperature_c: 4.0, taken_by_user_id: "assoc-7" }
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "GET /seafood-ops/excursions"
              payload: { counter_id: "${counter_id}", case_slot: 1 }
              as: ComplianceOfficer
              as_user_id: "officer-cold-5"
              captures: { exc_id: "$.data[0].id", exc_started: "$.data[0].started_at", exc_ended: "$.data[0].ended_at", exc_minutes: "$.data[0].exposure_minutes", exc_severity: "$.data[0].severity", exc_peak: "$.data[0].peak_temperature_c" }
          assert:
            - "exactly 1 ColdChainExcursion exists for Counter.${counter_id} and case_slot 1"
            - "${exc_started} == 2026-08-01T13:00:00Z"
            - "${exc_ended} == 2026-08-01T15:30:00Z"
            - "${exc_minutes} == 150"
            - "${exc_severity} == MAJOR"
            - "${exc_peak} == 5.0"
            - "ColdChainExcursion.${exc_id}.status == OPEN after the compliant 4.0 C reading"
            - "the 4.0 C reading has breach == false"
            - "SupplierLot.${lot_id}.intake_status == HELD"

      - name: severity_bands_apply_the_declared_minute_constants
        claim_type: constants_applied
        grounds:
          - calculations.cold_chain_exposure
          - entities.ColdChainExcursion.fields.severity
        distinguishing_aspect: |
          MINOR_MAX_MINUTES is inclusive: an exposure of exactly 60 minutes is still MINOR and
          61 minutes is MAJOR, so the band comparison must be <= rather than <, on the same
          excursion as it accumulates further breaching readings.
        test_recipe:
          setup:
            - "logical clock advanced to 2026-08-01T16:00:00Z"
            - "Counter with 6 slots and no lot in slot 2, so no lot is held by the excursion"
            - "no reading has been taken yet"
          setup_api_calls:
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T16:00:00Z" }
              as: ChainAdmin
            - call: "POST /seafood-ops/counters"
              payload: { store_number: "4120", department_name: "Seafood Service Counter", case_slot_count: 6 }
              as: ChainAdmin
              captures: { counter_id: $.data.id }
          trigger:
            - call: "POST /seafood-ops/ice-bed-readings"
              payload: { counter_id: "${counter_id}", case_slot: 2, reading_at: "2026-08-01T13:00:00Z", temperature_c: 4.5, taken_by_user_id: "assoc-7" }
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "POST /seafood-ops/ice-bed-readings"
              payload: { counter_id: "${counter_id}", case_slot: 2, reading_at: "2026-08-01T14:00:00Z", temperature_c: 4.6, taken_by_user_id: "assoc-7" }
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "GET /seafood-ops/excursions"
              payload: { counter_id: "${counter_id}", case_slot: 2 }
              as: ComplianceOfficer
              as_user_id: "officer-cold-5"
              captures: { exc_id: "$.data[0].id", minutes_at_boundary: "$.data[0].exposure_minutes", severity_at_boundary: "$.data[0].severity" }
            - call: "POST /seafood-ops/ice-bed-readings"
              payload: { counter_id: "${counter_id}", case_slot: 2, reading_at: "2026-08-01T14:01:00Z", temperature_c: 4.7, taken_by_user_id: "assoc-7" }
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "GET /seafood-ops/excursions"
              payload: { counter_id: "${counter_id}", case_slot: 2 }
              as: ComplianceOfficer
              as_user_id: "officer-cold-5"
              captures: { minutes_past_boundary: "$.data[0].exposure_minutes", severity_past_boundary: "$.data[0].severity" }
          assert:
            - "${minutes_at_boundary} == 60 and ${severity_at_boundary} == MINOR"
            - "${minutes_past_boundary} == 61 and ${severity_past_boundary} == MAJOR"
            - "${severity_at_boundary} != MAJOR"
            - "exactly 1 ColdChainExcursion exists for Counter.${counter_id} and case_slot 2"
            - "ColdChainExcursion.${exc_id}.peak_temperature_c == 4.7 and status == OPEN"
            - "Counter.${counter_id}.open_excursion_count == 1 and Counter.${counter_id}.posture == RESTRICTED"

      - name: shrink_variants_diverge_on_the_same_event
        claim_type: variant_divergence
        grounds:
          - calculations.shrink_valuation.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / shrink_dual_variant_provisional_vs_final_diverge
          rationale: "The named §1.8 instance asserts both variant outputs on one ShrinkEvent and the exact delta between them."

      - name: risk_index_variant_is_selected_by_context
        claim_type: variant_selection
        grounds:
          - calculations.substitution_risk_index.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / supplier_risk_index_rolling_vs_lifetime_diverge
          rationale: "The named §1.8 instance asserts that the ROLLING_CYCLE variant drives the sampling plan while the LIFETIME variant drives Supplier.status."

      - name: shrink_ledger_reconciles_on_variant_switch
        claim_type: reconciliation
        grounds:
          - calculations.shrink_valuation
          - entities.Counter.fields.shrink_net_cents
        excluded_because:
          difficulty_instance: compensating_invariant / counter_shrink_ledger_zeroes_after_post_then_reverse
          rationale: "The named §1.8 instance asserts the provisional/final/recovery identity on the counter ledger after the switch and after its reversal."

      - name: per_line_rounding_precision_is_pinned
        claim_type: precision
        grounds:
          - calculations.shrink_valuation.precision
        excluded_because:
          difficulty_instance: combinatorial_formula / shrink_valuation_per_line_rounding_order
          rationale: "The named §1.8 instance contrasts the pinned per-line rounding total against the sum-then-round-once alternative."

      - name: goodwill_tiers_are_keyed_on_the_pre_credit_subtotal
        claim_type: tiered_pricing
        grounds:
          - calculations.supplier_chargeback_assessment
        excluded_because:
          difficulty_instance: boundary_precision_check / goodwill_tier_boundary_at_exactly_fifty_thousand
          rationale: "The named §1.8 instance tests the inclusive-low tier boundary at exactly 50000 and the tier-1 trap value."

  # ===========================================================================
  - section: validations
    instances:
      - name: lot_receipt_rejects_conflicting_frozen_and_fresh_claims
        claim_type: violation_error
        grounds:
          - validations[priority=38]
          - errors.ERR_FROZEN_DISCLOSURE_CONFLICT
          - entities.SupplierLot.fields.previously_frozen
          - entities.SupplierLot.fields.fresh_claim
        distinguishing_aspect: |
          The two disclosure flags are individually legal and jointly illegal: previously_frozen
          true with fresh_claim true is refused at receipt, while previously_frozen true with
          fresh_claim false is accepted -- the conflict is a pair rule, not a field rule.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z"
            - "Counter, Supplier and Atlantic Cod Species registered"
          setup_api_calls:
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ChainAdmin
            - call: "POST /seafood-ops/counters"
              payload: { store_number: "4120", department_name: "Seafood Service Counter", case_slot_count: 6 }
              as: ChainAdmin
              captures: { counter_id: $.data.id }
            - call: "POST /seafood-ops/suppliers"
              payload: { name: "Gulf Bay Dealers", permit_number: "PERMIT-8801" }
              as: ChainAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /seafood-ops/species"
              payload: { market_name: "Atlantic Cod", scientific_name: "Gadus morhua", acceptable_market_names: ["Atlantic Cod", "Cod"], simp_covered: false, high_risk_substitution: false, sustainability_program_eligible: true }
              as: ChainAdmin
              captures: { cod_id: $.data.id }
          trigger:
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${cod_id}", lot_code: "COD-0801-F", harvest_method: "WILD_LONGLINE", production_method: "WILD", origin_country_code: "US", previously_frozen: true, fresh_claim: true, received_weight_kg: 10.000, unit_cost_cents_per_kg: 1700, retail_price_cents_per_kg: 2450, cooked_retail_price_cents_per_kg: 2600 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { e_conflict: $.data.error_id }
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${cod_id}", lot_code: "COD-0801-F", harvest_method: "WILD_LONGLINE", production_method: "WILD", origin_country_code: "US", previously_frozen: true, fresh_claim: false, received_weight_kg: 10.000, unit_cost_cents_per_kg: 1700, retail_price_cents_per_kg: 2450, cooked_retail_price_cents_per_kg: 2600 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { ok_lot: $.data.id }
          assert:
            - "trigger call 1 returns HTTP 422 with ${e_conflict} == ERR_FROZEN_DISCLOSURE_CONFLICT"
            - "no SupplierLot row was created by trigger call 1"
            - "trigger call 2 returns HTTP 201"
            - "SupplierLot.${ok_lot}.previously_frozen == true and fresh_claim == false and intake_status == RECEIVED"

      - name: relabel_guards_species_then_market_name_then_accepts
        claim_type: satisfaction_pass
        grounds:
          - validations[priority=39]
          - validations[priority=40]
          - errors.ERR_RELABEL_SPECIES_MISMATCH
          - errors.ERR_MARKET_NAME_NOT_ACCEPTABLE
          - state_machines.SupplierLot.label_status.MISMATCHED_to_RELABELED
        distinguishing_aspect: |
          Relabelling has two independent referential guards that must both be satisfied before
          the transition fires: the corrected species must equal the species the lab actually
          observed (naming the original species is refused) and the corrected market name must
          be a member of that species' acceptable_market_names list (borrowing the old species'
          legal name is refused). Only the third attempt reaches RELABELED.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z"
            - "Atlantic Cod (acceptable names Atlantic Cod / Cod) and Pacific Cod (acceptable names Pacific Cod / True Cod) registered"
            - "Atlantic Cod SupplierLot cased into slot 1 with a PUBLISHED CaseLabel"
            - "VerificationSample driven DRAFT -> IN_LAB -> MISMATCH with observed_species_id == Pacific Cod, so label_status is MISMATCHED"
          setup_api_calls:
            - call: "POST /seafood-ops/_clock/set_current_utc"
