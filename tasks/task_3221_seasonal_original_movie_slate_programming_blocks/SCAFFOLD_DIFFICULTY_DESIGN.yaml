            - call: "POST /slate/seasons"
              payload: { studio_id: "${studio_id}", year: 2027, label: "Countdown", required_title_count: 2, air_window_start: "2027-11-01T00:00:00Z", air_window_end: "2027-12-31T00:00:00Z", delivery_deadline: "2027-10-01T00:00:00Z", max_shoot_days: 100 }
              as: PlatformAdmin
              captures: { season_id: $.data.id }
            - call: "POST /slate/seasons/${season_id}/lock"
              payload: {}
              as: ProgrammingExec
              captures: { sv: $.data.version }
            - call: "POST /slate/titles"
              payload: { season_id: "${season_id}", name: "T1", genre: "ROMANCE", tone_rating: "WARM", content_flags: [], duration_minutes: 90 }
              as: SlatePlanner
              captures: { t1: $.data.id }
            - call: "POST /slate/titles/${t1}/approve"
              payload: { expected_season_version: "${sv}" }
              as: SlatePlanner
              captures: { sv2: $.data.version }
            - call: "POST /slate/titles"
              payload: { season_id: "${season_id}", name: "T2", genre: "COMEDY", tone_rating: "GENTLE", content_flags: [], duration_minutes: 90 }
              as: SlatePlanner
              captures: { t2: $.data.id }
            - call: "POST /slate/titles/${t2}/approve"
              payload: { expected_season_version: "${sv2}" }
              as: SlatePlanner
            - call: "POST /slate/titles/${t2}/cancel"
              payload: {}
              as: SlatePlanner
            - call: "POST /slate/talent"
              payload: { studio_id: "${studio_id}", stage_name: "Holly Star", availability_windows: [{ start: "2027-03-01T00:00:00Z", end: "2027-06-01T00:00:00Z" }] }
              as: TalentAgent
              captures: { talent_id: $.data.id }
            - call: "POST /slate/deals"
              payload: { talent_id: "${talent_id}", season_id: "${season_id}", picture_commitment: 2 }
              as: TalentAgent
              as_user_id: "${talent_id}"
              captures: { deal_id: $.data.id }
            - call: "POST /slate/locations"
              payload: { studio_id: "${studio_id}", name: "Stage 1", blackout_windows: [] }
              as: ProductionManager
              captures: { loc_id: $.data.id }
            - call: "POST /slate/production-slots"
              payload: { title_id: "${t1}", location_id: "${loc_id}", shoot_start: "2027-03-10T00:00:00Z", shoot_end: "2027-03-20T00:00:00Z", shoot_days: 10 }
              as: ProductionManager
              captures: { slot1: $.data.id }
            - call: "POST /slate/production-slots/${slot1}/wrap"
              payload: {}
              as: ProductionManager
            - call: "POST /slate/castings"
              payload: { title_id: "${t1}", talent_id: "${talent_id}" }
              as: TalentAgent
              as_user_id: "${talent_id}"
              captures: { c1: $.data.id }
            - call: "POST /slate/castings/${c1}/confirm"
              payload: {}
              as: TalentAgent
              as_user_id: "${talent_id}"
            - call: "POST /slate/titles/${t1}/deliver"
              payload: {}
              as: ProductionManager
            - call: "POST /slate/program-blocks"
              payload: { season_id: "${season_id}", name: "Friday Premieres", block_start: "2027-11-05T00:00:00Z", premiere_cadence_days: 7, max_encores_per_title: 3, min_minutes_between_airings: 1440 }
