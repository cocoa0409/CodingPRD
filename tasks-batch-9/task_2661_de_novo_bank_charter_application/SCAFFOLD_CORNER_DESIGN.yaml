      - name: error_clock_cannot_move_backwards
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CLOCK_NOT_MONOTONIC]
          - validations[priority=72]
          - endpoints[POST /de-novo/_clock/set_current_utc]
        distinguishing_aspect: >
          The clock is monotonic non-decreasing: one second earlier than now is 422, while re-setting
          it to exactly the current instant is accepted, so the rule is 'at or after', not 'after'.
        test_recipe:
          setup:
            - "An empty database. The logical clock has been moved from its 2026-08-01T00:00:00Z default"
            - "to 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /de-novo/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /de-novo/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T23:59:59Z" }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
            - call: "POST /de-novo/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /de-novo/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:01Z" }
              as: PlatformAdmin
          assert:
            - "the first call returns 422 with $.data.error_id == ERR_CLOCK_NOT_MONOTONIC"
            - "the second call returns 200 with current_utc == 2026-09-01T00:00:00Z - the equality case is allowed"
            - "the third call returns 200 with current_utc == 2026-09-01T00:00:01Z"
      - name: error_window_end_equal_to_start_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_WINDOW_END_NOT_AFTER_START]
          - validations[priority=67]
          - endpoints[POST /de-novo/conversion-windows]
          - entities.ConversionWindow.fields.duration_hours
        distinguishing_aspect: >
          A zero-length window is refused 422 because window_end_utc must be STRICTLY after
          window_start_utc, and the minimal accepted window is one second longer - here a one-hour
          window that reports duration_hours 1.00.
        test_recipe:
          setup:
            - "The logical clock has been moved to 2026-06-01T12:00:00Z."
            - "One OrganizingGroup at stage ORGANIZING with a SIGNED CRITICAL CORE_PROCESSING"
            - "VendorContract whose active_window_count is 0 and whose version is captured as ${vc_v}."
          setup_api_calls:
            - call: "POST /de-novo/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /de-novo/organizing-groups"
              payload: { proposed_bank_name: "Cascade Charter Bank", home_state_code: "WA", charter_type: "NATIONAL", target_opening_date: "2027-03-01T00:00:00Z" }
              as: CharterCounsel
              captures: { g_id: $.data.id }
            - call: "POST /de-novo/vendor-contracts"
              payload: { group_id: "${g_id}", service_domain: "CORE_PROCESSING", vendor_name: "Meridian Core Systems", annual_cost_cents: 90000000, contract_term_months: 60, due_diligence_score: 88, criticality: "CRITICAL" }
              as: CharterCounsel
              captures: { vc_id: $.data.id }
            - call: "POST /de-novo/vendor-contracts/${vc_id}/advance"
              payload: { target_status: "SELECTED" }
              as: CharterCounsel
            - call: "POST /de-novo/vendor-contracts/${vc_id}/advance"
              payload: { target_status: "SIGNED" }
              as: CharterCounsel
            - call: "GET /de-novo/vendor-contracts/${vc_id}"
              payload: {}
              as: CharterCounsel
              captures: { vc_v: $.data.version }
          trigger:
            - call: "POST /de-novo/conversion-windows"
              payload: { vendor_contract_id: "${vc_id}", expected_vendor_contract_version: "${vc_v}", window_start_utc: "2026-06-02T12:00:00Z", window_end_utc: "2026-06-02T12:00:00Z" }
              as: CharterCounsel
              captures: { err_id: $.data.error_id }
            - call: "POST /de-novo/conversion-windows"
              payload: { vendor_contract_id: "${vc_id}", expected_vendor_contract_version: "${vc_v}", window_start_utc: "2026-06-02T12:00:00Z", window_end_utc: "2026-06-02T13:00:00Z" }
              as: CharterCounsel
              captures: { w_id: $.data.id }
          assert:
            - "the first call returns 422 with $.data.error_id == ERR_WINDOW_END_NOT_AFTER_START"
            - "after the first call VendorContract.${vc_id}.active_window_count == 0"
            - "after the first call VendorContract.${vc_id}.version == ${vc_v} - the refused call bumps nothing"
            - "the second call returns 201 and ConversionWindow.${w_id}.status == RESERVED"
            - "ConversionWindow.${w_id}.duration_hours == 1.00"
            - "VendorContract.${vc_id}.active_window_count == 1"
  - section: rbac
    instances:
      - name: rbac_escrow_agent_may_post_a_funding_event
        claim_type: exclusive_operation_permitted
        grounds:
          - roles[EscrowAgent]
          - endpoints[POST /de-novo/subscriptions/{subscription_id}/funding]
          - state_machines.Subscription.funding_state=PLEDGED_to_funding_state=FUNDED
          - calculations.escrow_position
        distinguishing_aspect: >
          EscrowAgent is the only role on the funding endpoint's roles list, and exercising that
          exclusive right works end to end: the PLEDGED subscription becomes FUNDED and the raise's
          funded_gross_cents rises to 1,000,000,000 while cleared_escrow_cents stays 0 because the
          row has not been screened.
        test_recipe:
          setup:
            - "One OrganizingGroup at stage ORGANIZING with one OPEN CapitalRaise (price 1000 cents per"
            - "share, minimum_gross_cents 4,100,000,000)."
            - "One Subscription of 1,000,000 shares in funding_state PLEDGED and clearance_state"
            - "UNSCREENED, so funded_gross_cents and cleared_escrow_cents are both 0."
          setup_api_calls:
            - call: "POST /de-novo/organizing-groups"
              payload: { proposed_bank_name: "Cascade Charter Bank", home_state_code: "WA", charter_type: "NATIONAL", target_opening_date: "2027-03-01T00:00:00Z" }
              as: CharterCounsel
              captures: { g_id: $.data.id }
