              payload: { slot_id: "${slot_id}", inspection_type: "ROUGH", scheduled_start: "2026-07-01T09:00:00Z", scheduled_end: "2026-07-01T10:00:00Z" }
              as: Applicant
              captures: { insp1_id: $.data.id }
          trigger:
            - call: "POST /permits/${permit_id}/inspections"
              payload: { slot_id: "${slot_id}", inspection_type: "ROUGH", scheduled_start: "2026-07-01T11:00:00Z", scheduled_end: "2026-07-01T12:00:00Z" }
              as: Applicant
              captures: { err: $.data.error_id }
          assert:
            - "InspectionSlot.${slot_id}.booked_count == 1"
            - "response error_id == ERR_SLOT_CAPACITY_FULL"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: slot_booked_count_conserved_schedule_then_cancel
        grounds:
          - state_machines.Inspection.SCHEDULED_to_CANCELLED
          - calculations.slot_booked_count
          - entities.InspectionSlot.fields.booked_count
        distinguishing_aspect: |
          Conserved quantity = InspectionSlot.booked_count (slot capacity occupancy): the forward
          action (schedule, +1) paired with its compensating action (cancel, -1) leaves
          booked_count exactly at its pre-schedule value. Pinned invariant: booked_count ==
          count(Inspection where slot_id==slot.id and inspection_status in {SCHEDULED,PASSED,FAILED});
          after schedule-then-cancel it returns to 0.
        test_recipe:
          setup:
            - "ISSUED permit; Inspector + slot (max 3, booked_count 0); one ROUGH scheduled (booked_count 1)."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "City16", code_edition: "IBC-2021", valuation_fee_rate_per_1000: 10, square_foot_rate: 120, plan_review_fee_pct: 0.65, minimum_permit_fee: 100 }
              as: BuildingOfficial
              captures: { jur_id: $.data.id }
            - call: "POST /contractors"
              payload: { business_name: "Acme16", license_number: "L-18", license_status: "ACTIVE", license_expiry: "2030-01-01T00:00:00Z", bond_amount: 20000, bond_status: "VERIFIED" }
              as: PermitClerk
              captures: { con_id: $.data.id }
            - call: "POST /plan-reviewers"
              payload: { full_name: "Rev L", cert_number: "C-12" }
              as: BuildingOfficial
              captures: { rev_id: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Insp L", badge_number: "B-8" }
              as: BuildingOfficial
              captures: { insp_id: $.data.id }
            - call: "POST /inspection-slots"
              payload: { inspector_id: "${insp_id}", window_start: "2026-07-01T08:00:00Z", window_end: "2026-07-01T17:00:00Z", max_inspections: 3 }
              as: BuildingOfficial
              captures: { slot_id: $.data.id }
            - call: "POST /permits"
              payload: { jurisdiction_id: "${jur_id}", contractor_id: "${con_id}", work_class: "REPAIR", fee_method: "VALUATION", declared_valuation: 2000 }
              as: Applicant
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/reviews"
              payload: { reviewer_id: "${rev_id}" }
              as: PlanReviewer
              as_user_id: "${rev_id}"
              captures: { review_id: $.data.id }
            - call: "POST /reviews/${review_id}/decide"
              payload: { decision: "APPROVED" }
              as: PlanReviewer
              as_user_id: "${rev_id}"
            - call: "POST /permits/${permit_id}/payments"
              payload: { amount: 165.00 }
              as: Applicant
            - call: "GET /permits/${permit_id}"
              payload: {}
              as: PermitClerk
              captures: { pv: $.data.version }
            - call: "POST /permits/${permit_id}/issue"
              payload: { expected_permit_application_version: "${pv}" }
              as: PermitClerk
            - call: "POST /permits/${permit_id}/inspections"
              payload: { slot_id: "${slot_id}", inspection_type: "ROUGH", scheduled_start: "2026-07-01T09:00:00Z", scheduled_end: "2026-07-01T10:00:00Z" }
              as: Applicant
              captures: { insp_id_row: $.data.id }
          trigger:
            - call: "POST /inspections/${insp_id_row}/cancel"
              payload: {}
              as: Applicant
          assert:
            - "Inspection.${insp_id_row}.inspection_status == CANCELLED"
            - "InspectionSlot.${slot_id}.booked_count == 0"

      - name: active_certificate_count_conserved_issue_then_revoke
        grounds:
          - state_machines.Inspection.SCHEDULED_to_PASSED
          - state_machines.CertificateOfOccupancy.ISSUED_to_REVOKED
          - entities.CertificateOfOccupancy.fields.co_status
        distinguishing_aspect: |
          Conserved quantity = count of ISSUED CertificateOfOccupancy for the permit (a different
          conserved-quantity type from slot occupancy): the forward action (FINAL PASS cascades a
          CofO, ISSUED-count 0->1) paired with its compensating action (revoke, ISSUED-count
          1->0) returns count(CofO where permit_id==permit.id and co_status==ISSUED) to its
          starting value 0.
        test_recipe:
          setup:
            - "ISSUED permit with PASSED ROUGH and a passed FINAL that cascaded one ISSUED CertificateOfOccupancy (active certificate count == 1)."
          setup_api_calls:
