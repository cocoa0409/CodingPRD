    code: 200
    input: []
    output: Submittal
    side_effects: []

  - method: POST
    path: "/submittals/{id}/review"
    description: "Commissioning authority records a design-review decision"
    roles: [CxAuthority]
    code: 200
    input: [decision, comment]
    output: Submittal
    side_effects: ["APPROVED_AS_NOTED opens an S4 DESIGN_REVIEW issue", "a REVISE_AND_RESUBMIT decision on review_round 3 opens an S2 SUBMITTAL issue and writes escalation_issue_id"]

  - method: POST
    path: "/submittals/{id}/resubmit"
    description: "Design team resubmits a rejected submittal, opening a new review round"
    roles: [DesignTeam]
    code: 200
    input: ["title?"]
    output: Submittal
    side_effects: ["status = RECEIVED", "review_round incremented"]

  # --------------------------------------------------------- EquipmentUnit
  - method: POST
    path: "/equipment-units"
    description: "Register a piece of equipment in the commissioning scope"
    roles: [PlatformAdmin, CxAuthority]
    code: 201
    input: [project_id, tag, system_type, criticality, contract_value_cents, weight_units]
    output: EquipmentUnit
    side_effects: ["install_status = NOT_INSTALLED, verification_status = UNVERIFIED, blocking_issue_count = 0", "recomputes CxProject.acceptance_completion_score (the denominator grew)"]

  - method: GET
    path: "/equipment-units"
    description: "List equipment"
    roles: [PlatformAdmin, CxAuthority, Contractor, DesignTeam, OwnerRepresentative]
    code: 200
    input: ["project_id?", "install_status?", "verification_status?", "limit?", "offset?"]
    output: "EquipmentUnit[]"
    side_effects: []

  - method: GET
    path: "/equipment-units/{id}"
    description: "Read one equipment unit with both of its state dimensions"
    roles: [PlatformAdmin, CxAuthority, Contractor, DesignTeam, OwnerRepresentative]
    code: 200
    input: []
    output: EquipmentUnit
    side_effects: []

  - method: POST
    path: "/equipment-units/{id}/install-status"
    description: "Advance the installation dimension (NOT_INSTALLED -> INSTALLED -> STARTED_UP, or -> REMOVED)"
    roles: [Contractor]
    code: 200
    input: [install_status]
    output: EquipmentUnit
    side_effects: ["REMOVED cancels every SCHEDULED or IN_PROGRESS FunctionalTest of the unit and drops it out of the acceptance_completion_score denominator"]

  # ----------------------------------------------- PrefunctionalChecklist
  - method: POST
    path: "/prefunctional-checklists"
    description: "Open a pre-functional checklist for one equipment unit"
    roles: [CxAuthority]
    code: 201
    input: [equipment_id, template_code]
