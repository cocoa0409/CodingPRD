  # =====================================================================
  # RULE 2 — combinatorial formulas across different modes
  #   2a: mode (b) nested rounding order
  #   2b: mode (c) circular-looking surcharge/level dependency
  #   2c: mode (a) non-linear max-over-paths with conditional edge filter
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: readiness_round_each_contribution_then_sum_yields_99_99
        grounds:
          - calculations.runbook_readiness_score
          - state_machines.Runbook.IN_REVIEW_to_VALIDATED
          - entities.Runbook.fields.readiness_score
          - entities.RunbookStep.fields.weight
        distinguishing_aspect: |
          Mode (b): the scaffold pins "round each step contribution to 2dp, then sum, never round the
          sum". Three equally weighted (10/10/20 replaced by 10/10/10) steps validated at age 0 give
          33.33 + 33.33 + 33.33 == 99.99, whereas the rejected sum-then-round order would give
          100.00 — a one-cent divergence that only the pinned order produces.
        test_recipe:
          setup:
            - "The people, sites, applications, assets, RG-1 group and dependency edges of the standard fixture exist and the clock stands at 2026-08-01T00:00:00Z."
            - "Runbook rb1 on RG-1 holds exactly three steps of weight 10 each (total_weight 30), all owned by op1."
            - "All three steps are VALIDATED at 2026-08-01T00:00:00Z, so every step_score is 100.00 and every age_days is 0."
          setup_api_calls:
            - *b01
            - *b02
            - *b03
            - *b04
            - *b05
            - *b06
            - *b07
            - *b08
            - *b09
            - *b10
            - *b11
            - *b12
            - *b13
            - *b14
            - *b15
            - *b16
            - *b17
            - *b18
            - *b19
            - *b20
            - *b21
            - *b22
            - *b23
            - *b24
            - *b25
