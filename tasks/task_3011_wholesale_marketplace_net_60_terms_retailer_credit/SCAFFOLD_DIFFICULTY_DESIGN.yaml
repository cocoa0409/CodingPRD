  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: payout_fail_compensates_balance
        grounds:
          - state_machines.Payout.SCHEDULED_to_PROCESSING
          - state_machines.Payout.PROCESSING_to_SCHEDULED
          - entities.Brand.fields.payout_balance_cents
        distinguishing_aspect: |
          Conserved quantity: Brand.payout_balance_cents. The forward action
          (process-due: balance -= net_cents) paired with its compensating action
          (fail: balance += net_cents) MUST return the balance to exactly its
          pre-processing value — 72500 before, 72500 after the fail.
        test_recipe:
          setup:
            - "a VERIFIED retailer with credit account; ACTIVE brand with payout_delay_days 7"
            - "an opening marketplace order 5x20000 = 100000 shipped at the default clock: payout net 75000 (25% commission) credited, balance 75000"
            - "the payout moved to PROCESSING via process-due at T0+7d (balance 75000 - 75000 = 0... wait: opening commission 25000 -> net 75000; balance after shipment credit 75000; after PROCESSING debit 0)"
          setup_api_calls:
            - call: "POST /wholesale/retailers"
              payload: { legal_name: "Pay Retail", store_type: "ONLINE", address: "19 Settle St", lat: 56.0, lng: -121.0, storefront_proof_url: "https://proof/19", resale_certificate_no: "RC-19" }
              as: Anonymous
              captures: { r_id: $.data.id }
            - call: "POST /wholesale/retailers/${r_id}/documents/review"
              payload: { document_type: "STOREFRONT_PROOF", decision: "CONFIRM" }
              as: PlatformAdmin
            - call: "POST /wholesale/retailers/${r_id}/documents/review"
              payload: { document_type: "RESALE_CERT", decision: "CONFIRM" }
              as: PlatformAdmin
            - call: "POST /wholesale/retailers/${r_id}/verify"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /wholesale/credit-accounts"
              payload: { retailer_id: "${r_id}" }
              as: PlatformAdmin
            - call: "POST /wholesale/brands"
              payload: { name: "Brand P", contact_email: "p@b.com", min_order_value_cents: 1000, default_case_pack_size: 1, lead_time_days: 0, payout_delay_days: 7 }
              as: Brand
              captures: { b_id: $.data.id }
            - call: "POST /wholesale/brands/${b_id}/activate"
              payload: {}
              as: Brand
              as_user_id: "${b_id}"
            - call: "POST /wholesale/orders"
              payload: { retailer_id: "${r_id}", brand_id: "${b_id}", lines: [{ sku: "S1", unit_price_cents: 20000, qty: 5 }] }
              as: Retailer
              as_user_id: "${r_id}"
              captures: { o_id: $.data.id }
            - call: "POST /wholesale/orders/${o_id}/ship"
              payload: {}
              as: Brand
              as_user_id: "${b_id}"
            - call: "GET /wholesale/payouts"
              payload: { order_id: "${o_id}" }
              as: PlatformAdmin
              captures: { p_id: "$.data[0].id", p_net: "$.data[0].net_cents" }
            - call: "GET /wholesale/brands/${b_id}"
              payload: {}
              as: PlatformAdmin
              captures: { bal_before: $.data.payout_balance_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wholesale/payouts/process-due"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /wholesale/payouts/${p_id}/fail"
              payload: {}
              as: PlatformAdmin
            - call: "GET /wholesale/brands/${b_id}"
              payload: {}
              as: PlatformAdmin
              captures: { bal_after: $.data.payout_balance_cents }
          assert:
            - "Payout.${p_id}.net_cents == 75000 (gross 100000 - commission 25000 at 2500 bps)"
            - "Brand.${b_id}.payout_balance_cents == 75000 after shipment, == 0 after PROCESSING debit, == 75000 again after fail compensation"
            - "Payout.${p_id}.status == SCHEDULED after the fail (retry-eligible)"
      - name: write_off_preserves_brand_payout
        grounds:
          - state_machines.Invoice.OVERDUE_to_WRITTEN_OFF
          - entities.Brand.fields.payout_balance_cents
        distinguishing_aspect: |
          Conserved quantity of a different type: the brand's accrued payout is
          decoupled from retailer collection risk — a forward action that destroys
          retailer-side value (invoice write-off of the full 200000 balance)
          paired with the payout lifecycle (PROCESSING -> PAID completion) MUST
          leave Brand.payout_balance_cents exactly at its post-completion value
          with zero clawback.
        test_recipe:
          setup:
            - "a VERIFIED retailer with credit account; ACTIVE brand (payout_delay 7)"
            - "an opening order 10x20000 = 200000 shipped at T0; payout (net 150000) processed and PAID at T0+7d; balance back to 0"
            - "the invoice (200000) aged past due and past due+30d"
          setup_api_calls:
            - call: "POST /wholesale/retailers"
              payload: { legal_name: "Default Retail", store_type: "BRICK_AND_MORTAR", address: "20 Risk Rd", lat: 57.0, lng: -122.0, storefront_proof_url: "https://proof/20", resale_certificate_no: "RC-20" }
              as: Anonymous
              captures: { r_id: $.data.id }
            - call: "POST /wholesale/retailers/${r_id}/documents/review"
              payload: { document_type: "STOREFRONT_PROOF", decision: "CONFIRM" }
              as: PlatformAdmin
            - call: "POST /wholesale/retailers/${r_id}/documents/review"
              payload: { document_type: "RESALE_CERT", decision: "CONFIRM" }
              as: PlatformAdmin
            - call: "POST /wholesale/retailers/${r_id}/verify"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /wholesale/credit-accounts"
              payload: { retailer_id: "${r_id}" }
              as: PlatformAdmin
            - call: "POST /wholesale/brands"
              payload: { name: "Brand Q", contact_email: "q@b.com", min_order_value_cents: 1000, default_case_pack_size: 1, lead_time_days: 0, payout_delay_days: 7 }
              as: Brand
              captures: { b_id: $.data.id }
            - call: "POST /wholesale/brands/${b_id}/activate"
              payload: {}
              as: Brand
              as_user_id: "${b_id}"
            - call: "POST /wholesale/orders"
              payload: { retailer_id: "${r_id}", brand_id: "${b_id}", lines: [{ sku: "S1", unit_price_cents: 20000, qty: 10 }] }
              as: Retailer
              as_user_id: "${r_id}"
              captures: { o_id: $.data.id }
            - call: "POST /wholesale/orders/${o_id}/ship"
              payload: {}
              as: Brand
              as_user_id: "${b_id}"
            - call: "GET /wholesale/orders/${o_id}/invoice"
              payload: {}
              as: PlatformAdmin
              captures: { inv_id: "$.data[0].id" }
            - call: "GET /wholesale/payouts"
              payload: { order_id: "${o_id}" }
              as: PlatformAdmin
              captures: { p_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wholesale/payouts/process-due"
              payload: {}
              as: PlatformAdmin
            - call: "POST /wholesale/payouts/${p_id}/complete"
              payload: {}
              as: PlatformAdmin
            - call: "GET /wholesale/brands/${b_id}"
              payload: {}
              as: PlatformAdmin
              captures: { bal_pre_wo: $.data.payout_balance_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /wholesale/invoices/${inv_id}/write-off"
              payload: {}
              as: PlatformAdmin
            - call: "GET /wholesale/brands/${b_id}"
              payload: {}
              as: PlatformAdmin
              captures: { bal_post_wo: $.data.payout_balance_cents }
          assert:
            - "Invoice.${inv_id}.status == WRITTEN_OFF with balance_cents 200000 uncollected"
            - "Payout.${p_id}.status == PAID (settled 2026-09-08, before the invoice even fell due)"
            - "Brand.${b_id}.payout_balance_cents == 0 both before and after the write-off — the write-off destroys retailer-side value only, with exactly zero brand-side drift"
