            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: FirmAdmin }
            - { call: "POST /intake/engagement-letters/${letter}/transition", payload: { action: "COUNTERSIGN" }, as: Client, as_user_id: "${p_c}", captures: { l_status: $.data.status } }
            - { call: "POST /intake/matters/${m1}/parties", payload: { party_id: "${p_a}", role_in_matter: "ADVERSE" }, as: IntakeSpecialist }
          trigger:
