    side_effects: ["status := DRAFT"]
  - method: GET
    path: "/show-scenes/{id}"
    description: "Reads one scene with its quality score and hold state"
    roles: [OwnerRep, CreativeDirector, ShowProgrammer, ContractorPM, ProgramAdmin]
    code: 200
    input: []
    output: ShowScene
    side_effects: []
  - method: GET
    path: "/show-scenes"
    description: "Filtered scene list: by project, by predecessor scene, by validating rehearsal run, or by status"
    roles: [OwnerRep, CreativeDirector, ShowProgrammer, ContractorPM, ProgramAdmin]
    code: 200
    input: ["project_id?", "follows_scene_id?", "validating_rehearsal_run_id?", "status?", "limit?", "offset?"]
    output: ShowScene[]
    side_effects: []
  - method: POST
    path: "/show-scenes/{id}/sequence"
    description: "Locks the scene into the running order"
    roles: [CreativeDirector]
    code: 200
    input: [sequence_index, "follows_scene_id?"]
    output: ShowScene
    side_effects: ["sequence_index and follows_scene_id recorded", "status := SEQUENCED", "increments ShowScene.version by 1"]
  - method: POST
    path: "/show-scenes/{id}/program"
    description: "Records the four discipline show-quality scores and rolls the program score up"
