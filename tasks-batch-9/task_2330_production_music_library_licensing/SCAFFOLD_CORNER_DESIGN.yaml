      - name: uniqueness_source_and_schema_guards_refuse_malformed_writes
        claim_type: type_constraints
        grounds:
          - errors[ERR_LEDGER_SOURCE_NOT_MANUAL]
          - errors[ERR_TIER_CODE_DUPLICATE]
          - validations[priority=48].search_profile_weights_sum_100
          - validations[priority=21].coverage_dates_ordered
          - validations[priority=1].schema_and_type_validation
        distinguishing_aspect: |
          The four "shape" guards that live outside the workflow are checked together, each with its own id:
          a workflow-only ledger source_type, a duplicate rate-card code, weights that miss 100 by ten, and
          both the equal-dates and reversed-dates forms of an invalid coverage window — with two plain
          schema failures (unknown enum member, absent required field) proving they do NOT collapse into
          the specific ids.
        test_recipe:
          setup:
            - "One composer and one licensee; the search profile has never been written."
          setup_api_calls:
            - call: "POST /music-library/composers"
              payload: { display_name: "Nadia Okoro", pro_affiliation: "ASCAP" }
              as: CatalogAdmin
              captures: { c1: $.data.id }
