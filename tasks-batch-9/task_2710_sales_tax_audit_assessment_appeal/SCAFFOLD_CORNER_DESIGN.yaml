      - name: info_variance_bp_rounds_half_up_at_two_and_a_half_basis_points
        claim_type: Precision
        grounds: [calculations.taxpayer_risk_score.precision, entities.Taxpayer.fields.info_variance_bp, endpoints.POST /information-returns]
        distinguishing_aspect: |
          reported_total_cents 400000 against matched_total_cents 399900 gives
          delta 100 and 100*10000/400000 = exactly 2.5 basis points. round_half_up
          must store info_variance_bp 3; truncation and banker's rounding both store
          2. The score itself is coarse enough to hide the difference
          (round_half_up((60*3 + 40*5000)/1000) = 200 either way), so the component
          field is the only place the rounding mode is observable.
        test_recipe:
          setup:
            - "One taxpayer with delinquent_period_count 2 and no returns yet."
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { legal_name: "Halfpoint Hardware LLC", permit_number: "P-2710-C5", industry_naics_code: "444140", filing_frequency: "MONTHLY", gross_receipts_annual_cents: 100000000, delinquent_period_count: 2 }
