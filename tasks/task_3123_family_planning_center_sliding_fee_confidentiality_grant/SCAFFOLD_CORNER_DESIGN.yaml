  # ===========================================================================
  - section: validations
    instances:
      - name: confidential_minor_claim_submit_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=6]
          - errors.ERR_CONFIDENTIAL_SERVICE_CANNOT_BILL
        distinguishing_aspect: "A minor patient's claim is created with confidential_suppression true and billed_cents 0; submitting it to a payer is rejected with 422 ERR_CONFIDENTIAL_SERVICE_CANNOT_BILL — grant confidentiality rules forbid generating an EOB."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01 -> 2026-09-10T10:00:00Z. Standard setup. Patient born 2011-06-01 (minor), insurance_policy_id POL-MIN; tier D assessment; completed encounter; DRAFT claim."
