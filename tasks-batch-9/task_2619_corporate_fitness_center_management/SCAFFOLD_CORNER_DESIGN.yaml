  # ===========================================================================
  # 2. From Table 2 (State Machines)
  # ===========================================================================
  - section: state_machines
    instances:

      - name: contract_client_decision_return_increments_revision_round
        claim_type: valid_transition
        grounds:
          - state_machines.ClientContract.DRAFT_to_PENDING_CLIENT_APPROVAL
          - state_machines.ClientContract.PENDING_CLIENT_APPROVAL_to_DRAFT
          - entities.ClientContract.fields.revision_round
        distinguishing_aspect: |
          The revision loop is unbounded and counted: each RETURN moves the
          contract back to DRAFT and increments revision_round by exactly 1, so
          after submit/RETURN/submit/RETURN the contract is DRAFT with
          revision_round == 2 and approved_at still null. An implementation that
          resets the counter on re-submit, or that treats RETURN as a rejection
          into a terminal state, fails.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one COST_PLUS contract with an ACTIVE_DUTY SITE_MANAGER (so submit's precondition holds), submitted once."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: OperatorAdmin
            - call: "POST /client-contracts"
              payload: { client_name: "Northwind Manufacturing", site_code: "NWM-01", fee_structure: "COST_PLUS", staffing_model: "OPERATOR_EMPLOYED", budgeted_staff_fte: 3.5, participation_target_pct: 35, term_start_on: "2026-07-01", term_end_on: "2027-06-30", not_to_exceed_cents: 5000000 }
              as: OperatorAdmin
              captures: { c_id: $.data.id }
            - call: "POST /staff-members"
              payload: { contract_id: "${c_id}", full_name: "Dana Reed", role_type: "SITE_MANAGER", employment_type: "OPERATOR_EMPLOYED", hourly_cost_cents: 5200 }
              as: OperatorAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /staff-credentials"
              payload: { staff_member_id: "${mgr_id}", credential_type: "CPR_AED", issuer: "American Heart Association", credential_number: "AHA-771", expires_on: "2027-06-30" }
              as: OperatorAdmin
              captures: { mgr_cred_id: $.data.id }
            - call: "POST /staff-credentials/${mgr_cred_id}/verify"
              payload: { decision: "ACCEPT" }
              as: OperatorAdmin
            - call: "POST /client-contracts/${c_id}/submit"
              payload: {}
              as: OperatorAdmin
          trigger:
            - call: "POST /client-contracts/${c_id}/client-decision"
              payload: { decision: "RETURN", comment: "Raise the participation target to 40." }
              as: ClientSponsor
              as_user_id: "${c_id}"
            - call: "POST /client-contracts/${c_id}/submit"
              payload: {}
              as: OperatorAdmin
            - call: "POST /client-contracts/${c_id}/client-decision"
              payload: { decision: "RETURN", comment: "Second pass: fix the fee schedule." }
              as: ClientSponsor
              as_user_id: "${c_id}"
          assert:
            - "First RETURN -> HTTP 200 AND ClientContract.${c_id}.status == \"DRAFT\" AND revision_round == 1"
            - "Re-submit -> HTTP 200 AND ClientContract.${c_id}.status == \"PENDING_CLIENT_APPROVAL\" AND revision_round still 1"
            - "Second RETURN -> HTTP 200 AND ClientContract.${c_id}.status == \"DRAFT\" AND revision_round == 2"
            - "ClientContract.${c_id}.approved_at == null throughout AND ytd_billed_cents == 0"

      - name: submit_without_active_site_manager_returns_422
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ClientContract.DRAFT_to_PENDING_CLIENT_APPROVAL.preconditions
          - validations[priority 33].ERR_SITE_MANAGER_REQUIRED
          - errors.ERR_SITE_MANAGER_REQUIRED
        distinguishing_aspect: |
          The submit precondition is role-specific, not headcount-specific: a
          contract staffed only with a GROUP_EX_INSTRUCTOR is still rejected with
          422 ERR_SITE_MANAGER_REQUIRED, and the contract must remain DRAFT.
          Adding one SITE_MANAGER (ACTIVE_DUTY on creation) makes the same call
          succeed, which proves the rule reads role_type and not staff count.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one COST_PLUS contract whose only staff member is a GROUP_EX_INSTRUCTOR."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: OperatorAdmin
            - call: "POST /client-contracts"
              payload: { client_name: "Northwind Manufacturing", site_code: "NWM-01", fee_structure: "COST_PLUS", staffing_model: "OPERATOR_EMPLOYED", budgeted_staff_fte: 3.5, participation_target_pct: 35, term_start_on: "2026-07-01", term_end_on: "2027-06-30", not_to_exceed_cents: 5000000 }
              as: OperatorAdmin
              captures: { c_id: $.data.id }
            - call: "POST /staff-members"
              payload: { contract_id: "${c_id}", full_name: "Ravi Patel", role_type: "GROUP_EX_INSTRUCTOR", employment_type: "OPERATOR_EMPLOYED", hourly_cost_cents: 4700 }
              as: OperatorAdmin
              captures: { inst1_id: $.data.id }
          trigger:
            - call: "POST /client-contracts/${c_id}/submit"
              payload: {}
              as: OperatorAdmin
            - call: "POST /staff-members"
              payload: { contract_id: "${c_id}", full_name: "Dana Reed", role_type: "SITE_MANAGER", employment_type: "OPERATOR_EMPLOYED", hourly_cost_cents: 5200 }
              as: OperatorAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /client-contracts/${c_id}/submit"
              payload: {}
              as: OperatorAdmin
          assert:
            - "First submit -> HTTP 422 AND data.error_id == \"ERR_SITE_MANAGER_REQUIRED\""
            - "After the rejection ClientContract.${c_id}.status == \"DRAFT\" AND version unchanged"
            - "StaffMember.${mgr_id}.duty_status == \"ACTIVE_DUTY\" on creation (no verification step needed for this precondition)"
            - "Second submit -> HTTP 200 AND ClientContract.${c_id}.status == \"PENDING_CLIENT_APPROVAL\""

      - name: offering_close_with_open_sessions_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ProgramOffering.ACTIVE_to_CLOSED.preconditions
          - validations[priority 12].ERR_OPEN_SESSIONS
          - errors.ERR_OPEN_SESSIONS
          - calculations.program_attainment
        distinguishing_aspect: |
          CLOSE is guarded by the offering's own children: one SCHEDULED session
          is enough for 409 ERR_OPEN_SESSIONS, and the offering must still be
          ACTIVE afterwards. Cancelling that session (CANCELLED_CLIENT is not an
          open status) unblocks the identical call, which then recomputes
          final_attainment_pct from counted participation only — 0 here.
