  # ===========================================================================
  - section: calculations
    instances:

      - name: close_rate_excludes_cancelled_transactions_from_the_denominator
        claim_type: Input Set Filtering
        grounds:
          - calculations.agent_close_rate
          - entities.Agent.fields.close_rate
          - state_machines.Transaction.transitions.ASSIGNED_to_CANCELLED
        distinguishing_aspect: "Cancelled transactions leave close_rate's denominator entirely, so an agent with one close and one cancellation reports 1.0 rather than 0.5 — the input set filter, not the arithmetic, is what the test isolates."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One region with target_client_ratio 5.0, one lead agent, two assigned clients."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /regions"
              payload: { name: "Puget Sound", service_area_codes: ["98101", "98102"], traditional_commission_pct: 0.025, target_client_ratio: 5.0 }
              as: PlatformAdmin
