            - "PointLot.${lot_ok_id}.tier_benefit_expense_cents == 0 and promo_expense_cents == 240 (round_half_up((300 - 100) * 1200 / 1000)) - the whole uplift is promotional"

      - name: valid_sensitivity_band_must_straddle_the_measured_rate
        claim_type: Violation -> Error
        grounds:
          - validations[priority=87]
          - calculations.breakage_sensitivity_bands
        distinguishing_aspect: "The band is validated against the rate the server just MEASURED, not against the submitted inputs, and both inclusive bounds are tested: a band entirely above the rate and one entirely below are both refused, while a degenerate band equal to the rate on both sides is accepted."
