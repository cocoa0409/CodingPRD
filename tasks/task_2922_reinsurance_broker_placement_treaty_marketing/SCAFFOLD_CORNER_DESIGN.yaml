              captures: { charlie: $.data.id }
            - call: "POST /reinsurers"
              payload: { name: "Delta Re", security_rating: "A", capacity_limit_minor: 5000000000, max_line_pct: 100.0000, lead_authorised: false }
              as: PlatformAdmin
