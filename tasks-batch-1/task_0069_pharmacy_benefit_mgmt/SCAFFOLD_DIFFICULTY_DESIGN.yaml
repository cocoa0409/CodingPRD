scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: accumulator_reconcile_on_reversal_vs_adjudication
        grounds:
          - calculations.acc_deductible_met
          - calculations.acc_oop_met
          - state_machines.Claim.PAID_to_REVERSED
          - entities.Member.fields.deductible_met_cents
        distinguishing_aspect: |
          Operates on the Member entity domain: the on_adjudication variant
          builds deductible_met_cents by chronological replay INCLUDING the new
          claim, while the on_reversal variant rebuilds it EXCLUDING the reversed
          claim — a full chronological recompute, not a subtraction, so a later
          claim's deductible portion shifts (C2 goes 23500 -> 30000 after C1 is
          reversed). Distinct from the rebate dual-variant which lives on RebateAccrual.
        test_recipe:
          setup:
            - "Plan: deductible 50000c, oop_max 200000c, T2 copay 3500c."
            - "One member, two ACTIVE TIER_2 retail drugs each ingredient_cost 30000c."
            - "Member files C1 (drug D1) then C2 (drug D2), both PAID; member.deductible_met=50000, oop_met=53500."
          setup_api_calls:
            - call: "POST /pbm/_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: PlanAdmin
            - call: "POST /pbm/plans"
              payload: { name: "P", plan_year: 2026, deductible_cents: 50000, oop_max_cents: 200000, tier_copay_cents: { TIER_1: 1000, TIER_2: 3500, TIER_3: 7000, SPECIALTY: 25000 } }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pbm/formulary-drugs"
              payload: { plan_id: "${plan_id}", ndc: "D1", drug_name: "D1", tier: "TIER_2", ingredient_cost_cents: 30000 }
              as: PlanAdmin
              captures: { d1: $.data.id }
            - call: "POST /pbm/formulary-drugs"
              payload: { plan_id: "${plan_id}", ndc: "D2", drug_name: "D2", tier: "TIER_2", ingredient_cost_cents: 30000 }
              as: PlanAdmin
              captures: { d2: $.data.id }
            - call: "POST /pbm/members"
              payload: { plan_id: "${plan_id}", full_name: "M" }
              as: PlanAdmin
              captures: { m: $.data.id }
            - call: "POST /pbm/claims"
              payload: { member_id: "${m}", formulary_drug_id: "${d1}", days_supply: 30, pharmacy_type: "RETAIL" }
              as: PharmacyProvider
              captures: { c1: $.data.id }
            - call: "POST /pbm/claims"
              payload: { member_id: "${m}", formulary_drug_id: "${d2}", days_supply: 30, pharmacy_type: "RETAIL" }
              as: PharmacyProvider
              captures: { c2: $.data.id }
          trigger:
            - call: "POST /pbm/claims/${c1}/reverse"
              payload: {}
              as: PharmacyProvider
          assert:
            - "Claim.${c1}.adjudication_status == REVERSED"
            - "Claim.${c2}.member_pay_cents == 23500"
            - "Member.${m}.deductible_met_cents == 30000"
            - "Member.${m}.oop_met_cents == 30000"

      - name: rebate_provisional_delete_vs_finalized_clawback
        grounds:
          - calculations.calc_rebate_accrual
          - calculations.calc_rebate_clawback
          - state_machines.RebateAccrual.PROVISIONAL_to_FINALIZED
          - state_machines.RebateAccrual.FINALIZED_to_CLAWED_BACK
          - entities.RebateAccrual.fields.clawback_cents
        distinguishing_aspect: |
          Operates on the RebateAccrual entity domain: reversing a claim whose
          accrual is still PROVISIONAL DELETES the accrual (clawback 0, claim
          rebate_status NONE), whereas reversing a claim whose accrual was
          FINALIZED produces clawback_cents = round_half_up(12000 * 0.5) = 6000
          and CLAWED_BACK. Different subject and different divergence from the
          Member accumulator dual-variant.
        test_recipe:
          setup:
            - "Plan with a RebateAgreement (clawback_pct 0.5)."
            - "TIER_2 drug, rebate_per_fill 4000c; member files a 90-day mail claim, PAID, accrual 12000c PROVISIONAL."
            - "PlanAdmin finalizes rebates, accrual -> FINALIZED."
          setup_api_calls:
            - call: "POST /pbm/_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00.000Z" }
              as: PlanAdmin
            - call: "POST /pbm/plans"
              payload: { name: "P", plan_year: 2026, deductible_cents: 0, oop_max_cents: 200000, tier_copay_cents: { TIER_1: 1000, TIER_2: 3500, TIER_3: 7000, SPECIALTY: 25000 }, mail_order_copay_multiplier: 2.0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - call: "POST /pbm/rebate-agreements"
              payload: { plan_id: "${plan_id}", manufacturer_name: "Acme", clawback_pct: 0.5 }
              as: PlanAdmin
            - call: "POST /pbm/formulary-drugs"
              payload: { plan_id: "${plan_id}", ndc: "RB", drug_name: "RB", tier: "TIER_2", ingredient_cost_cents: 30000, rebate_per_fill_cents: 4000 }
              as: PlanAdmin
              captures: { drug: $.data.id }
            - call: "POST /pbm/members"
              payload: { plan_id: "${plan_id}", full_name: "M" }
              as: PlanAdmin
              captures: { m: $.data.id }
            - call: "POST /pbm/claims"
              payload: { member_id: "${m}", formulary_drug_id: "${drug}", days_supply: 90, pharmacy_type: "MAIL_ORDER" }
              as: PharmacyProvider
              captures: { claim: $.data.id }
            - call: "POST /pbm/plans/${plan_id}/finalize-rebates"
              payload: { expected_benefit_plan_version: "${plan_v}" }
              as: PlanAdmin
          trigger:
            - call: "POST /pbm/claims/${claim}/reverse"
              payload: {}
              as: PharmacyProvider
          assert:
            - "Claim.${claim}.rebate_status == CLAWED_BACK"
            - "RebateAccrual[claim_id=${claim}].status == CLAWED_BACK"
            - "RebateAccrual[claim_id=${claim}].clawback_cents == 6000"
            - "RebateAccrual[claim_id=${claim}].accrued_cents == 12000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: member_pay_waterfall_deductible_copay_oop
        grounds:
          - calculations.calc_member_pay
          - calculations.calc_gross_cost
          - entities.Claim.fields.member_pay_cents
          - entities.BenefitPlan.fields.tier_copay_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs (remaining_deductible, tier copay, remaining_oop)
          with nested min and a branch on pharmacy_type. With a SPECIALTY claim
          on a member whose deductible is already met (ded_met=50000, oop_met=50000),
          member_pay_cents = min(0 + 25000 copay, remaining_oop 150000) = 25000.
        test_recipe:
          setup:
            - "Plan: deductible 50000c, oop_max 200000c, SPECIALTY copay 25000c."
            - "Member primed to ded_met=50000, oop_met=50000 by a prior PAID T3 claim (gross 50000)."
            - "Specialty drug, specialty pharmacy claim filed."
          setup_api_calls:
            - call: "POST /pbm/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: PlanAdmin
            - call: "POST /pbm/plans"
              payload: { name: "P", plan_year: 2026, deductible_cents: 50000, oop_max_cents: 200000, tier_copay_cents: { TIER_1: 1000, TIER_2: 3500, TIER_3: 7000, SPECIALTY: 25000 } }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pbm/formulary-drugs"
              payload: { plan_id: "${plan_id}", ndc: "PRIME", drug_name: "Prime T3", tier: "TIER_3", ingredient_cost_cents: 50000 }
              as: PlanAdmin
              captures: { prime: $.data.id }
            - call: "POST /pbm/formulary-drugs"
              payload: { plan_id: "${plan_id}", ndc: "SPEC", drug_name: "Spec", tier: "SPECIALTY", ingredient_cost_cents: 200000, is_specialty: true }
              as: PlanAdmin
              captures: { spec: $.data.id }
            - call: "POST /pbm/members"
              payload: { plan_id: "${plan_id}", full_name: "M" }
              as: PlanAdmin
              captures: { m: $.data.id }
            - call: "POST /pbm/claims"
              payload: { member_id: "${m}", formulary_drug_id: "${prime}", days_supply: 30, pharmacy_type: "RETAIL" }
              as: PharmacyProvider
          trigger:
            - call: "POST /pbm/claims"
              payload: { member_id: "${m}", formulary_drug_id: "${spec}", days_supply: 30, pharmacy_type: "SPECIALTY" }
              as: PharmacyProvider
              captures: { claim: $.data.id }
          assert:
            - "Claim.${claim}.adjudication_status == PAID"
            - "Claim.${claim}.gross_cost_cents == 200000"
            - "Claim.${claim}.member_pay_cents == 25000"
            - "Claim.${claim}.plan_paid_cents == 175000"

      - name: mail_order_copay_single_rounded_product_not_summed_fills
        grounds:
          - calculations.calc_member_pay
          - entities.BenefitPlan.fields.mail_order_copay_multiplier
          - entities.Claim.fields.days_supply
        distinguishing_aspect: |
          Mode (b): the 90-day mail copay is ONE rounded product
          round_half_up(base_copay 3500 * multiplier 2.0) = 7000, NOT three
          summed 30-day copays (3 * 3500 = 10500). The scaffold pins the
          aggregation/rounding order: multiply-then-round once, not per-30-day
          fill. Member has deductible met so the copay is the entire member_pay.
        test_recipe:
          setup:
            - "Plan: deductible 50000c, oop_max 200000c, T2 copay 3500c, mail multiplier 2.0."
            - "Member primed to ded_met=50000 (prior PAID T3 gross-50000 claim)."
            - "TIER_2 drug filled 90-day MAIL_ORDER."
          setup_api_calls:
            - call: "POST /pbm/_clock/set"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: PlanAdmin
            - call: "POST /pbm/plans"
              payload: { name: "P", plan_year: 2026, deductible_cents: 50000, oop_max_cents: 200000, tier_copay_cents: { TIER_1: 1000, TIER_2: 3500, TIER_3: 7000, SPECIALTY: 25000 }, mail_order_copay_multiplier: 2.0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pbm/formulary-drugs"
              payload: { plan_id: "${plan_id}", ndc: "PRIME", drug_name: "Prime T3", tier: "TIER_3", ingredient_cost_cents: 50000 }
              as: PlanAdmin
              captures: { prime: $.data.id }
            - call: "POST /pbm/formulary-drugs"
              payload: { plan_id: "${plan_id}", ndc: "MAILD", drug_name: "Mail T2", tier: "TIER_2", ingredient_cost_cents: 30000 }
              as: PlanAdmin
              captures: { md: $.data.id }
            - call: "POST /pbm/members"
              payload: { plan_id: "${plan_id}", full_name: "M" }
              as: PlanAdmin
              captures: { m: $.data.id }
            - call: "POST /pbm/claims"
              payload: { member_id: "${m}", formulary_drug_id: "${prime}", days_supply: 30, pharmacy_type: "RETAIL" }
              as: PharmacyProvider
          trigger:
            - call: "POST /pbm/claims"
              payload: { member_id: "${m}", formulary_drug_id: "${md}", days_supply: 90, pharmacy_type: "MAIL_ORDER" }
              as: PharmacyProvider
              captures: { claim: $.data.id }
          assert:
            - "Claim.${claim}.adjudication_status == PAID"
            - "Claim.${claim}.gross_cost_cents == 90000"
            - "Claim.${claim}.member_pay_cents == 7000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: pa_deny_appeal_approve_cycle
        grounds:
          - state_machines.PriorAuthorization.PENDING_REVIEW_to_DENIED
          - state_machines.PriorAuthorization.DENIED_to_APPEALED
          - state_machines.PriorAuthorization.APPEALED_to_APPROVED
          - entities.PriorAuthorization.fields.status
        distinguishing_aspect: |
          Branching-with-revert on the PriorAuthorization entity: PENDING_REVIEW
          forks to DENIED, then the revert edge DENIED->APPEALED loops back, and
          APPEALED forks again to APPROVED. The PA visits a non-linear path no
          linear pipeline can express. Distinct entity from the Claim parallel-
          dimension instance.
        test_recipe:
          setup:
            - "Plan, member, drug; one PA submitted PENDING_REVIEW by reviewer U_REV."
            - "MedicalDirector U_DIR denies it, reviewer appeals it, director re-approves."
          setup_api_calls:
            - call: "POST /pbm/plans"
              payload: { name: "P", plan_year: 2026, deductible_cents: 0, oop_max_cents: 200000, tier_copay_cents: { TIER_1: 1000, TIER_2: 3500, TIER_3: 7000, SPECIALTY: 25000 } }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pbm/formulary-drugs"
              payload: { plan_id: "${plan_id}", ndc: "X", drug_name: "X", tier: "TIER_2", ingredient_cost_cents: 30000, pa_required: true }
              as: PlanAdmin
              captures: { drug: $.data.id }
            - call: "POST /pbm/members"
              payload: { plan_id: "${plan_id}", full_name: "M" }
              as: PlanAdmin
              captures: { m: $.data.id }
            - call: "POST /pbm/prior-authorizations"
              payload: { member_id: "${m}", formulary_drug_id: "${drug}", authorized_fills: 1, valid_through_date: "2026-12-31T00:00:00.000Z" }
              as: PharmacistReviewer
              as_user_id: "U_REV"
              captures: { pa: $.data.id, pa_v0: $.data.version }
            - call: "POST /pbm/prior-authorizations/${pa}/decide"
              payload: { decision: "DENY", expected_prior_authorization_version: "${pa_v0}" }
              as: MedicalDirector
              as_user_id: "U_DIR"
              captures: { pa_v1: $.data.version }
            - call: "POST /pbm/prior-authorizations/${pa}/appeal"
              payload: {}
              as: PharmacistReviewer
              as_user_id: "U_REV"
              captures: { pa_v2: $.data.version }
          trigger:
            - call: "POST /pbm/prior-authorizations/${pa}/decide"
              payload: { decision: "APPROVE", expected_prior_authorization_version: "${pa_v2}" }
              as: MedicalDirector
              as_user_id: "U_DIR"
          assert:
            - "PriorAuthorization.${pa}.status == APPROVED"
            - "PriorAuthorization.${pa}.approved_quantity_remaining == 1"
            - "PriorAuthorization.${pa}.decided_by_user_id == U_DIR"

      - name: claim_parallel_adjudication_and_rebate_dimensions
        grounds:
          - entities.Claim.fields.adjudication_status
          - entities.Claim.fields.rebate_status
          - state_machines.Claim.PAID_to_REVERSED
          - calculations.calc_rebate_accrual
        distinguishing_aspect: |
          Parallel state dimensions on one Claim row: adjudication_status
          (SUBMITTED->PAID->REVERSED) and rebate_status (NONE->ACCRUED->CLAWED_BACK)
          evolve independently. After PAID the claim is (PAID, ACCRUED); after a
          post-finalization reversal it is (REVERSED, CLAWED_BACK) — two axes, not
          one linear chain. Distinct entity from the PA branching instance.
        test_recipe:
          setup:
            - "Plan with RebateAgreement (clawback_pct 1.0); rebate drug rebate_per_fill 4000c."
            - "Member files a 30-day retail claim, PAID -> (PAID, ACCRUED), accrual 4000c PROVISIONAL."
            - "PlanAdmin finalizes rebates."
          setup_api_calls:
            - call: "POST /pbm/_clock/set"
              payload: { to_iso8601: "2026-05-01T00:00:00.000Z" }
              as: PlanAdmin
            - call: "POST /pbm/plans"
              payload: { name: "P", plan_year: 2026, deductible_cents: 0, oop_max_cents: 200000, tier_copay_cents: { TIER_1: 1000, TIER_2: 3500, TIER_3: 7000, SPECIALTY: 25000 } }
              as: PlanAdmin
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - call: "POST /pbm/rebate-agreements"
              payload: { plan_id: "${plan_id}", manufacturer_name: "Acme", clawback_pct: 1.0 }
              as: PlanAdmin
            - call: "POST /pbm/formulary-drugs"
              payload: { plan_id: "${plan_id}", ndc: "RB", drug_name: "RB", tier: "TIER_1", ingredient_cost_cents: 10000, rebate_per_fill_cents: 4000 }
              as: PlanAdmin
              captures: { drug: $.data.id }
            - call: "POST /pbm/members"
              payload: { plan_id: "${plan_id}", full_name: "M" }
              as: PlanAdmin
              captures: { m: $.data.id }
            - call: "POST /pbm/claims"
              payload: { member_id: "${m}", formulary_drug_id: "${drug}", days_supply: 30, pharmacy_type: "RETAIL" }
              as: PharmacyProvider
              captures: { claim: $.data.id }
            - call: "POST /pbm/plans/${plan_id}/finalize-rebates"
              payload: { expected_benefit_plan_version: "${plan_v}" }
              as: PlanAdmin
          trigger:
            - call: "POST /pbm/claims/${claim}/reverse"
              payload: {}
              as: PharmacyProvider
          assert:
            - "Claim.${claim}.adjudication_status == REVERSED"
            - "Claim.${claim}.rebate_status == CLAWED_BACK"
            - "RebateAccrual[claim_id=${claim}].clawback_cents == 4000"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: claim_paid_consumes_pa_last_fill_auto_expires
        grounds:
          - state_machines.Claim.SUBMITTED_to_PAID
          - state_machines.PriorAuthorization.APPROVED_to_EXPIRED
          - entities.PriorAuthorization.fields.approved_quantity_remaining
        distinguishing_aspect: |
          Depth-3 cascade from the claim-create trigger: POST /claims (A) sets
          Claim PAID -> that PAID side effect decrements PA.approved_quantity_remaining
          to 0 (B) -> reaching 0 triggers PA auto-transition APPROVED->EXPIRED (C).
          Each link is caused by the prior link, not by the original action.
          Originates from a DIFFERENT trigger than the reversal cascade below.
        test_recipe:
          setup:
            - "Plan, member, PA-required drug; APPROVED PA with authorized_fills=1 (approved_quantity_remaining=1)."
          setup_api_calls:
            - call: "POST /pbm/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: PlanAdmin
            - call: "POST /pbm/plans"
              payload: { name: "P", plan_year: 2026, deductible_cents: 0, oop_max_cents: 200000, tier_copay_cents: { TIER_1: 1000, TIER_2: 3500, TIER_3: 7000, SPECIALTY: 25000 } }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pbm/formulary-drugs"
              payload: { plan_id: "${plan_id}", ndc: "PA1", drug_name: "PA Drug", tier: "TIER_2", ingredient_cost_cents: 30000, pa_required: true }
              as: PlanAdmin
              captures: { drug: $.data.id }
            - call: "POST /pbm/members"
              payload: { plan_id: "${plan_id}", full_name: "M" }
              as: PlanAdmin
              captures: { m: $.data.id }
            - call: "POST /pbm/prior-authorizations"
              payload: { member_id: "${m}", formulary_drug_id: "${drug}", authorized_fills: 1, valid_through_date: "2026-12-31T00:00:00.000Z" }
              as: PharmacistReviewer
              as_user_id: "U_REV"
              captures: { pa: $.data.id, pa_v0: $.data.version }
            - call: "POST /pbm/prior-authorizations/${pa}/decide"
              payload: { decision: "APPROVE", expected_prior_authorization_version: "${pa_v0}" }
              as: MedicalDirector
              as_user_id: "U_DIR"
          trigger:
            - call: "POST /pbm/claims"
              payload: { member_id: "${m}", formulary_drug_id: "${drug}", days_supply: 30, pharmacy_type: "RETAIL", prior_auth_id: "${pa}" }
              as: PharmacyProvider
              captures: { claim: $.data.id }
          assert:
            - "Claim.${claim}.adjudication_status == PAID"
            - "PriorAuthorization.${pa}.approved_quantity_remaining == 0"
            - "PriorAuthorization.${pa}.status == EXPIRED"

      - name: claim_reverse_unwinds_copay_card_to_active
        grounds:
          - state_machines.Claim.PAID_to_REVERSED
          - calculations.calc_copay_card_draw
          - entities.CopayCard.fields.benefit_used_cents
          - entities.CopayCard.fields.status
        distinguishing_aspect: |
          Depth-2 cascade from the claim-REVERSE trigger: POST /claims/{id}/reverse
          (A) recomputes CopayCard.benefit_used_cents downward (B) which drops it
          below max_benefit_cents and flips CopayCard.status EXHAUSTED->ACTIVE (C
          is the same recompute's consequence). Originates from a DIFFERENT
          trigger (reverse) than the PA-expiry cascade (create).
        test_recipe:
          setup:
            - "Plan deductible 0; SPECIALTY drug copay 25000c; copay card max 20000c for member+drug."
            - "Member files a specialty claim, PAID; card draws 20000 -> EXHAUSTED; member_pay 25000."
          setup_api_calls:
            - call: "POST /pbm/_clock/set"
              payload: { to_iso8601: "2026-07-01T00:00:00.000Z" }
              as: PlanAdmin
            - call: "POST /pbm/plans"
              payload: { name: "P", plan_year: 2026, deductible_cents: 0, oop_max_cents: 200000, tier_copay_cents: { TIER_1: 1000, TIER_2: 3500, TIER_3: 7000, SPECIALTY: 25000 } }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pbm/formulary-drugs"
              payload: { plan_id: "${plan_id}", ndc: "SP", drug_name: "Spec", tier: "SPECIALTY", ingredient_cost_cents: 200000, is_specialty: true }
              as: PlanAdmin
              captures: { drug: $.data.id }
            - call: "POST /pbm/members"
              payload: { plan_id: "${plan_id}", full_name: "M" }
              as: PlanAdmin
              captures: { m: $.data.id }
            - call: "POST /pbm/copay-cards"
              payload: { member_id: "${m}", formulary_drug_id: "${drug}", max_benefit_cents: 20000 }
              as: PlanAdmin
              captures: { card: $.data.id }
            - call: "POST /pbm/claims"
              payload: { member_id: "${m}", formulary_drug_id: "${drug}", days_supply: 30, pharmacy_type: "SPECIALTY", copay_card_id: "${card}" }
              as: PharmacyProvider
              captures: { claim: $.data.id }
          trigger:
            - call: "POST /pbm/claims/${claim}/reverse"
              payload: {}
              as: PharmacyProvider
          assert:
            - "Claim.${claim}.adjudication_status == REVERSED"
            - "CopayCard.${card}.benefit_used_cents == 0"
            - "CopayCard.${card}.status == ACTIVE"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: segregation_beats_stale_version_on_pa_decide
        grounds:
          - validations[priority=5]
          - validations[priority=14]
          - concurrency_rules[pa-decide-stale-version]
        distinguishing_aspect: |
          business_safety (priority 5, ERR_SEGREGATION_OF_DUTIES) vs
          business_constraint OCC (priority 14, ERR_STALE_VERSION). A decide call
          where the director equals the submitter AND carries a stale
          expected_prior_authorization_version returns the higher-priority
          ERR_SEGREGATION_OF_DUTIES (403), not ERR_STALE_VERSION.
        test_recipe:
          setup:
            - "PA submitted PENDING_REVIEW by user U_SELF (a MedicalDirector-capable id used as reviewer)."
            - "The same user U_SELF tries to decide it with a deliberately stale version."
          setup_api_calls:
            - call: "POST /pbm/plans"
              payload: { name: "P", plan_year: 2026, deductible_cents: 0, oop_max_cents: 200000, tier_copay_cents: { TIER_1: 1000, TIER_2: 3500, TIER_3: 7000, SPECIALTY: 25000 } }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pbm/formulary-drugs"
              payload: { plan_id: "${plan_id}", ndc: "X", drug_name: "X", tier: "TIER_2", ingredient_cost_cents: 30000, pa_required: true }
              as: PlanAdmin
              captures: { drug: $.data.id }
            - call: "POST /pbm/members"
              payload: { plan_id: "${plan_id}", full_name: "M" }
              as: PlanAdmin
              captures: { m: $.data.id }
            - call: "POST /pbm/prior-authorizations"
              payload: { member_id: "${m}", formulary_drug_id: "${drug}", authorized_fills: 1, valid_through_date: "2026-12-31T00:00:00.000Z" }
              as: PharmacistReviewer
              as_user_id: "U_SELF"
              captures: { pa: $.data.id, pa_v0: $.data.version }
          trigger:
            - call: "POST /pbm/prior-authorizations/${pa}/decide"
              payload: { decision: "APPROVE", expected_prior_authorization_version: "${pa_v0} - 1" }
              as: MedicalDirector
              as_user_id: "U_SELF"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "PriorAuthorization.${pa}.status == PENDING_REVIEW"

      - name: inactive_resource_beats_pa_required_on_claim
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - entities.Member.fields.status
        distinguishing_aspect: |
          state (priority 6, ERR_INACTIVE_RESOURCE) vs business_safety (priority 9,
          ERR_PA_REQUIRED). A claim for a TERMINATED member on a PA-required drug
          with NO prior_auth_id violates both; the higher-priority
          ERR_INACTIVE_RESOURCE (409) wins. Different category pair than the
          decide conflict.
        test_recipe:
          setup:
            - "Plan, PA-required drug, member then TERMINATED."
            - "Claim filed for that member with no PA referenced."
          setup_api_calls:
            - call: "POST /pbm/_clock/set"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlanAdmin
            - call: "POST /pbm/plans"
              payload: { name: "P", plan_year: 2026, deductible_cents: 0, oop_max_cents: 200000, tier_copay_cents: { TIER_1: 1000, TIER_2: 3500, TIER_3: 7000, SPECIALTY: 25000 } }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pbm/formulary-drugs"
              payload: { plan_id: "${plan_id}", ndc: "PAX", drug_name: "PA X", tier: "TIER_2", ingredient_cost_cents: 30000, pa_required: true }
              as: PlanAdmin
              captures: { drug: $.data.id }
            - call: "POST /pbm/members"
              payload: { plan_id: "${plan_id}", full_name: "M" }
              as: PlanAdmin
              captures: { m: $.data.id }
            - call: "POST /pbm/members/${m}/terminate"
              payload: {}
              as: PlanAdmin
          trigger:
            - call: "POST /pbm/claims"
              payload: { member_id: "${m}", formulary_drug_id: "${drug}", days_supply: 30, pharmacy_type: "RETAIL" }
              as: PharmacyProvider
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INACTIVE_RESOURCE"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: oop_max_clamp_exact_remaining
        grounds:
          - calculations.calc_member_pay
          - calculations.acc_oop_met
          - entities.BenefitPlan.fields.oop_max_cents
        distinguishing_aspect: |
          Numeric threshold metric on POST /claims: with oop_met at exactly
          195000 (remaining 5000) a SPECIALTY claim whose uncapped member_pay
          would be 25000 is clamped to exactly 5000 (min(25000, 5000)). Tests the
          OOP ceiling boundary, distinct metric/endpoint from the copay-card
          empty-remaining edge.
        test_recipe:
          setup:
            - "Plan deductible 0, oop_max 200000, SPECIALTY copay 25000c."
            - "Member primed to oop_met=195000 via prior PAID specialty claims (no card)."
            - "A further specialty claim is filed; uncapped copay 25000 must clamp to 5000."
          setup_api_calls:
            - call: "POST /pbm/_clock/set"
              payload: { to_iso8601: "2026-09-01T00:00:00.000Z" }
              as: PlanAdmin
            - call: "POST /pbm/plans"
              payload: { name: "P", plan_year: 2026, deductible_cents: 0, oop_max_cents: 200000, tier_copay_cents: { TIER_1: 1000, TIER_2: 3500, TIER_3: 7000, SPECIALTY: 25000 } }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pbm/formulary-drugs"
              payload: { plan_id: "${plan_id}", ndc: "BIG", drug_name: "Big", tier: "SPECIALTY", ingredient_cost_cents: 195000, is_specialty: true }
              as: PlanAdmin
              captures: { big: $.data.id }
            - call: "POST /pbm/formulary-drugs"
              payload: { plan_id: "${plan_id}", ndc: "SMALL", drug_name: "Small", tier: "SPECIALTY", ingredient_cost_cents: 200000, is_specialty: true }
              as: PlanAdmin
              captures: { small: $.data.id }
            - call: "POST /pbm/members"
              payload: { plan_id: "${plan_id}", full_name: "M" }
              as: PlanAdmin
              captures: { m: $.data.id }
            - call: "POST /pbm/claims"
              payload: { member_id: "${m}", formulary_drug_id: "${big}", days_supply: 30, pharmacy_type: "SPECIALTY" }
              as: PharmacyProvider
          trigger:
            - call: "POST /pbm/claims"
              payload: { member_id: "${m}", formulary_drug_id: "${small}", days_supply: 30, pharmacy_type: "SPECIALTY" }
              as: PharmacyProvider
              captures: { claim: $.data.id }
          assert:
            - "Claim.${claim}.adjudication_status == PAID"
            - "Claim.${claim}.member_pay_cents == 5000"
            - "Member.${m}.oop_met_cents == 200000"

      - name: copay_card_exhausted_zero_remaining_draw
        grounds:
          - calculations.calc_copay_card_draw
          - entities.CopayCard.fields.benefit_used_cents
          - entities.CopayCard.fields.status
        distinguishing_aspect: |
          Zero-remaining / EXHAUSTED edge metric on POST /copay-cards + POST /claims:
          a card whose benefit_used_cents == max_benefit_cents has remaining 0, so
          calc_copay_card_draw yields min(member_pay, 0) = 0. Tested by REJECTING a
          claim that names an already-EXHAUSTED card (ERR_COPAY_CARD_INVALID).
          Different metric and endpoint than the OOP clamp.
        test_recipe:
          setup:
            - "Plan deductible 0, SPECIALTY copay 25000c; copay card max 20000c."
            - "First specialty claim draws the card to 20000 -> EXHAUSTED."
            - "A second specialty claim names the same EXHAUSTED card."
          setup_api_calls:
            - call: "POST /pbm/_clock/set"
              payload: { to_iso8601: "2026-10-01T00:00:00.000Z" }
              as: PlanAdmin
            - call: "POST /pbm/plans"
              payload: { name: "P", plan_year: 2026, deductible_cents: 0, oop_max_cents: 500000, tier_copay_cents: { TIER_1: 1000, TIER_2: 3500, TIER_3: 7000, SPECIALTY: 25000 } }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pbm/formulary-drugs"
              payload: { plan_id: "${plan_id}", ndc: "SP", drug_name: "Spec", tier: "SPECIALTY", ingredient_cost_cents: 200000, is_specialty: true }
              as: PlanAdmin
              captures: { drug: $.data.id }
            - call: "POST /pbm/members"
              payload: { plan_id: "${plan_id}", full_name: "M" }
              as: PlanAdmin
              captures: { m: $.data.id }
            - call: "POST /pbm/copay-cards"
              payload: { member_id: "${m}", formulary_drug_id: "${drug}", max_benefit_cents: 20000 }
              as: PlanAdmin
              captures: { card: $.data.id }
            - call: "POST /pbm/claims"
              payload: { member_id: "${m}", formulary_drug_id: "${drug}", days_supply: 30, pharmacy_type: "SPECIALTY", copay_card_id: "${card}" }
              as: PharmacyProvider
          trigger:
            - call: "POST /pbm/claims"
              payload: { member_id: "${m}", formulary_drug_id: "${drug}", days_supply: 30, pharmacy_type: "SPECIALTY", copay_card_id: "${card}" }
              as: PharmacyProvider
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_COPAY_CARD_INVALID"
            - "CopayCard.${card}.status == EXHAUSTED"
            - "CopayCard.${card}.benefit_used_cents == 20000"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: claim_requires_pa_approved_state
        grounds:
          - state_machines.Claim.SUBMITTED_to_PAID
          - state_machines.PriorAuthorization.PENDING_REVIEW_to_APPROVED
          - validations[priority=9]
          - entities.PriorAuthorization.fields.status
        distinguishing_aspect: |
          Claim->PriorAuthorization pair: a claim on a pa_required drug can only
          go PAID when the referenced PA.status == APPROVED. Referencing a PA still
          in PENDING_REVIEW yields ERR_PA_REQUIRED; the same PA once APPROVED lets
          the claim pay. Distinct entity pair from Claim->BenefitPlan.
        test_recipe:
          setup:
            - "Plan, PA-required drug, member; PA submitted but left PENDING_REVIEW."
          setup_api_calls:
            - call: "POST /pbm/_clock/set"
              payload: { to_iso8601: "2026-11-01T00:00:00.000Z" }
              as: PlanAdmin
            - call: "POST /pbm/plans"
              payload: { name: "P", plan_year: 2026, deductible_cents: 0, oop_max_cents: 200000, tier_copay_cents: { TIER_1: 1000, TIER_2: 3500, TIER_3: 7000, SPECIALTY: 25000 } }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pbm/formulary-drugs"
              payload: { plan_id: "${plan_id}", ndc: "PA", drug_name: "PA", tier: "TIER_2", ingredient_cost_cents: 30000, pa_required: true }
              as: PlanAdmin
              captures: { drug: $.data.id }
            - call: "POST /pbm/members"
              payload: { plan_id: "${plan_id}", full_name: "M" }
              as: PlanAdmin
              captures: { m: $.data.id }
            - call: "POST /pbm/prior-authorizations"
              payload: { member_id: "${m}", formulary_drug_id: "${drug}", authorized_fills: 1, valid_through_date: "2026-12-31T00:00:00.000Z" }
              as: PharmacistReviewer
              as_user_id: "U_REV"
              captures: { pa: $.data.id }
          trigger:
            - call: "POST /pbm/claims"
              payload: { member_id: "${m}", formulary_drug_id: "${drug}", days_supply: 30, pharmacy_type: "RETAIL", prior_auth_id: "${pa}" }
              as: PharmacyProvider
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_PA_REQUIRED"

      - name: claim_requires_plan_active_state
        grounds:
          - state_machines.Claim.SUBMITTED_to_PAID
          - validations[priority=6]
          - entities.BenefitPlan.fields.status
        distinguishing_aspect: |
          Claim->BenefitPlan pair: a claim cannot go PAID when its plan is
          ARCHIVED (ERR_INACTIVE_RESOURCE). Distinct entity pair from
          Claim->PriorAuthorization.
        test_recipe:
          setup:
            - "Plan with a drug and member, then the plan is ARCHIVED."
          setup_api_calls:
            - call: "POST /pbm/_clock/set"
              payload: { to_iso8601: "2026-11-15T00:00:00.000Z" }
              as: PlanAdmin
            - call: "POST /pbm/plans"
              payload: { name: "P", plan_year: 2026, deductible_cents: 0, oop_max_cents: 200000, tier_copay_cents: { TIER_1: 1000, TIER_2: 3500, TIER_3: 7000, SPECIALTY: 25000 } }
              as: PlanAdmin
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - call: "POST /pbm/formulary-drugs"
              payload: { plan_id: "${plan_id}", ndc: "Y", drug_name: "Y", tier: "TIER_1", ingredient_cost_cents: 10000 }
              as: PlanAdmin
              captures: { drug: $.data.id }
            - call: "POST /pbm/members"
              payload: { plan_id: "${plan_id}", full_name: "M" }
              as: PlanAdmin
              captures: { m: $.data.id }
            - call: "POST /pbm/plans/${plan_id}/archive"
              payload: {}
              as: PlanAdmin
          trigger:
            - call: "POST /pbm/claims"
              payload: { member_id: "${m}", formulary_drug_id: "${drug}", days_supply: 30, pharmacy_type: "RETAIL" }
              as: PharmacyProvider
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INACTIVE_RESOURCE"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: refill_too_soon_supply_window_overlap
        grounds:
          - validations[priority=12]
          - entities.Claim.fields.supply_end_date
          - entities.Claim.fields.fill_date
        distinguishing_aspect: |
          Half-open supply-window overlap on the (Member, FormularyDrug) resource:
          a second 30-day fill whose fill_date (2026-01-15) is strictly inside the
          first fill's window [2026-01-01, 2026-01-31) is rejected
          ERR_REFILL_TOO_SOON. Interval semantics: strict-less-than upper bound
          (adjacency at the boundary is allowed). Different resource and arithmetic
          than the PA validity-window rule.
        test_recipe:
          setup:
            - "Plan deductible 0; one drug; member files a 30-day fill on 2026-01-01."
            - "A second fill of the same drug is attempted on 2026-01-15 (inside the window)."
          setup_api_calls:
            - call: "POST /pbm/_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: PlanAdmin
            - call: "POST /pbm/plans"
              payload: { name: "P", plan_year: 2026, deductible_cents: 0, oop_max_cents: 200000, tier_copay_cents: { TIER_1: 1000, TIER_2: 3500, TIER_3: 7000, SPECIALTY: 25000 } }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pbm/formulary-drugs"
              payload: { plan_id: "${plan_id}", ndc: "Z", drug_name: "Z", tier: "TIER_1", ingredient_cost_cents: 10000 }
              as: PlanAdmin
              captures: { drug: $.data.id }
            - call: "POST /pbm/members"
              payload: { plan_id: "${plan_id}", full_name: "M" }
              as: PlanAdmin
              captures: { m: $.data.id }
            - call: "POST /pbm/claims"
              payload: { member_id: "${m}", formulary_drug_id: "${drug}", days_supply: 30, pharmacy_type: "RETAIL" }
              as: PharmacyProvider
              captures: { first: $.data.id }
            - call: "POST /pbm/_clock/set"
              payload: { to_iso8601: "2026-01-15T00:00:00.000Z" }
              as: PlanAdmin
          trigger:
            - call: "POST /pbm/claims"
              payload: { member_id: "${m}", formulary_drug_id: "${drug}", days_supply: 30, pharmacy_type: "RETAIL" }
              as: PharmacyProvider
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_REFILL_TOO_SOON"

      - name: pa_validity_window_exclusive_upper_bound
        grounds:
          - validations[priority=10]
          - entities.PriorAuthorization.fields.valid_through_date
          - entities.Claim.fields.fill_date
        distinguishing_aspect: |
          Exclusive-upper-bound window on the PriorAuthorization resource: a claim
          whose fill_date equals the PA's valid_through_date (2026-03-01) is
          rejected ERR_PA_WINDOW_EXPIRED because the window [decided,
          valid_through_date) is half-open at the top. Different resource and
          boundary geometry (single point-in-window vs supply-window collision)
          than refill-too-soon.
        test_recipe:
          setup:
            - "Plan, PA-required drug, APPROVED PA with valid_through_date 2026-03-01."
            - "Clock set to exactly 2026-03-01; a claim is filed naming that PA."
          setup_api_calls:
            - call: "POST /pbm/_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00.000Z" }
              as: PlanAdmin
            - call: "POST /pbm/plans"
              payload: { name: "P", plan_year: 2026, deductible_cents: 0, oop_max_cents: 200000, tier_copay_cents: { TIER_1: 1000, TIER_2: 3500, TIER_3: 7000, SPECIALTY: 25000 } }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pbm/formulary-drugs"
              payload: { plan_id: "${plan_id}", ndc: "PAW", drug_name: "PA W", tier: "TIER_2", ingredient_cost_cents: 30000, pa_required: true }
              as: PlanAdmin
              captures: { drug: $.data.id }
            - call: "POST /pbm/members"
              payload: { plan_id: "${plan_id}", full_name: "M" }
              as: PlanAdmin
              captures: { m: $.data.id }
            - call: "POST /pbm/prior-authorizations"
              payload: { member_id: "${m}", formulary_drug_id: "${drug}", authorized_fills: 1, valid_through_date: "2026-03-01T00:00:00.000Z" }
              as: PharmacistReviewer
              as_user_id: "U_REV"
              captures: { pa: $.data.id, pa_v0: $.data.version }
            - call: "POST /pbm/prior-authorizations/${pa}/decide"
              payload: { decision: "APPROVE", expected_prior_authorization_version: "${pa_v0}" }
              as: MedicalDirector
              as_user_id: "U_DIR"
            - call: "POST /pbm/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: PlanAdmin
          trigger:
            - call: "POST /pbm/claims"
              payload: { member_id: "${m}", formulary_drug_id: "${drug}", days_supply: 30, pharmacy_type: "RETAIL", prior_auth_id: "${pa}" }
              as: PharmacyProvider
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_PA_WINDOW_EXPIRED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reverse_restores_member_accumulators_to_zero
        grounds:
          - state_machines.Claim.SUBMITTED_to_PAID
          - state_machines.Claim.PAID_to_REVERSED
          - calculations.acc_deductible_met
          - calculations.acc_oop_met
          - entities.Member.fields.deductible_met_cents
        distinguishing_aspect: |
          Conserved quantity = Member.deductible_met_cents + Member.oop_met_cents.
          Invariant: pinned over Member fields as
          (deductible_met_cents AFTER reverse == deductible_met_cents BEFORE the
          PAID claim) AND (oop_met_cents likewise). A single PAID-then-REVERSED
          cycle on a fresh member must leave both accumulators at exactly 0 — no
          drift. Different conserved quantity than the copay-card benefit invariant.
        test_recipe:
          setup:
            - "Plan deductible 50000, oop_max 200000; fresh member; one T2 retail drug ingredient 30000."
            - "Member files one claim (PAID): deductible_met=30000, oop_met=30000."
          setup_api_calls:
            - call: "POST /pbm/_clock/set"
              payload: { to_iso8601: "2026-04-15T00:00:00.000Z" }
              as: PlanAdmin
            - call: "POST /pbm/plans"
              payload: { name: "P", plan_year: 2026, deductible_cents: 50000, oop_max_cents: 200000, tier_copay_cents: { TIER_1: 1000, TIER_2: 3500, TIER_3: 7000, SPECIALTY: 25000 } }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pbm/formulary-drugs"
              payload: { plan_id: "${plan_id}", ndc: "T2", drug_name: "T2", tier: "TIER_2", ingredient_cost_cents: 30000 }
              as: PlanAdmin
              captures: { drug: $.data.id }
            - call: "POST /pbm/members"
              payload: { plan_id: "${plan_id}", full_name: "M" }
              as: PlanAdmin
              captures: { m: $.data.id }
            - call: "POST /pbm/claims"
              payload: { member_id: "${m}", formulary_drug_id: "${drug}", days_supply: 30, pharmacy_type: "RETAIL" }
              as: PharmacyProvider
              captures: { claim: $.data.id }
          trigger:
            - call: "POST /pbm/claims/${claim}/reverse"
              payload: {}
              as: PharmacyProvider
          assert:
            - "Member.${m}.deductible_met_cents == 0"
            - "Member.${m}.oop_met_cents == 0"

      - name: reverse_restores_copay_card_benefit_and_pa_fill
        grounds:
          - state_machines.Claim.PAID_to_REVERSED
          - calculations.calc_copay_card_draw
          - entities.CopayCard.fields.benefit_used_cents
          - entities.PriorAuthorization.fields.approved_quantity_remaining
        distinguishing_aspect: |
          Conserved quantity = CopayCard.benefit_used_cents (and, jointly, the
          PA's approved_quantity_remaining). Invariant pinned over entity fields:
          after a PAID-then-REVERSED cycle, CopayCard.benefit_used_cents returns to
          its pre-claim value (0) AND PA.approved_quantity_remaining returns to its
          pre-claim value (1). Different conserved quantities (card dollars + PA
          fill count) than the member-accumulator invariant.
        test_recipe:
          setup:
            - "Plan deductible 0; PA-required SPECIALTY drug copay 25000c; APPROVED PA authorized_fills=2; copay card max 20000c."
            - "Member files a specialty claim consuming the PA and drawing the card (PAID): PA remaining 1, card used 20000."
          setup_api_calls:
            - call: "POST /pbm/_clock/set"
              payload: { to_iso8601: "2026-05-15T00:00:00.000Z" }
              as: PlanAdmin
            - call: "POST /pbm/plans"
              payload: { name: "P", plan_year: 2026, deductible_cents: 0, oop_max_cents: 500000, tier_copay_cents: { TIER_1: 1000, TIER_2: 3500, TIER_3: 7000, SPECIALTY: 25000 } }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pbm/formulary-drugs"
              payload: { plan_id: "${plan_id}", ndc: "SPA", drug_name: "Spec PA", tier: "SPECIALTY", ingredient_cost_cents: 200000, is_specialty: true, pa_required: true }
              as: PlanAdmin
              captures: { drug: $.data.id }
            - call: "POST /pbm/members"
              payload: { plan_id: "${plan_id}", full_name: "M" }
              as: PlanAdmin
              captures: { m: $.data.id }
            - call: "POST /pbm/copay-cards"
              payload: { member_id: "${m}", formulary_drug_id: "${drug}", max_benefit_cents: 20000 }
              as: PlanAdmin
              captures: { card: $.data.id }
            - call: "POST /pbm/prior-authorizations"
              payload: { member_id: "${m}", formulary_drug_id: "${drug}", authorized_fills: 2, valid_through_date: "2026-12-31T00:00:00.000Z" }
              as: PharmacistReviewer
              as_user_id: "U_REV"
              captures: { pa: $.data.id, pa_v0: $.data.version }
            - call: "POST /pbm/prior-authorizations/${pa}/decide"
              payload: { decision: "APPROVE", expected_prior_authorization_version: "${pa_v0}" }
              as: MedicalDirector
              as_user_id: "U_DIR"
            - call: "POST /pbm/claims"
              payload: { member_id: "${m}", formulary_drug_id: "${drug}", days_supply: 30, pharmacy_type: "SPECIALTY", prior_auth_id: "${pa}", copay_card_id: "${card}" }
              as: PharmacyProvider
              captures: { claim: $.data.id }
          trigger:
            - call: "POST /pbm/claims/${claim}/reverse"
              payload: {}
              as: PharmacyProvider
          assert:
            - "Claim.${claim}.adjudication_status == REVERSED"
            - "CopayCard.${card}.benefit_used_cents == 0"
            - "PriorAuthorization.${pa}.approved_quantity_remaining == 2"
