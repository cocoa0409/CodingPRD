# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids / 24 instances. Every instance grounds in SCAFFOLD.yaml 1.1-1.7.
# Logical clock starts at 2026-08-01T00:00:00Z on every fresh server.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: book_balance_as_issued_vs_as_sighted_diverge
        grounds:
          - calculations.premises_tag_book_balance
          - entities.ReconciliationRun.fields.basis
          - entities.ReconciliationRun.fields.book_unapplied_count
          - state_machines.ReconciliationRun.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          This dual variant lives in the tag-inventory accounting domain (TagLot/Premises counters):
          AS_ISSUED follows the devices and reports 8 unapplied at the COW_CALF premises, while
          AS_SIGHTED follows the observations and reports 5 at the MARKET premises whose lot
          counters would have said 7 - the two bases read different source tables entirely.
        test_recipe:
          setup:
            - "One producer owns premises C (COW_CALF, ACTIVE) and premises M (MARKET, ACTIVE)."
            - "Supplier AFNA is APPROVED. Lot L_C (serials ...001-...010, quantity 10) is issued to C; lot L_M (serials ...011-...020, quantity 10) is issued to M."
            - "Two devices from L_C are applied to animals born at M; three devices from L_M are applied to animals born at M. C therefore has applied_count 2 on its own lot and zero TAG_APPLIED sightings; M has five TAG_APPLIED sightings and applied_count 3 on its own lot."
            - "Logical clock never leaves 2026-08-01T00:00:00Z, so all five applications sit inside the period 2026-08-01..2026-08-31."
          setup_api_calls:
            - call: "POST /producers"
              payload: { legal_name: "Cedar Ridge Cattle", contact_email: "ops@cedarridge.example", state_code: "TX" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { prod_a: $.data.id }
            - call: "POST /premises"
              payload: { producer_id: "${prod_a}", pin: "TXC0001", operation_type: "COW_CALF", state_code: "TX", capacity: 100 }
              as: Producer
              as_user_id: "${prod_a}"
              captures: { prem_c: $.data.id }
            - call: "POST /premises"
              payload: { producer_id: "${prod_a}", pin: "TXM0001", operation_type: "MARKET", state_code: "TX", capacity: 100 }
              as: Producer
              as_user_id: "${prod_a}"
              captures: { prem_m: $.data.id }
            - call: "POST /premises/${prem_c}/approve"
              payload: {}
              as: StateAnimalHealthOfficial
              as_user_id: "saho-tx-1"
            - call: "POST /premises/${prem_m}/approve"
              payload: {}
              as: StateAnimalHealthOfficial
              as_user_id: "saho-tx-1"
            - call: "POST /device-suppliers"
              payload: { company_name: "AllFlex North", supplier_code: "AFNA" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { sup_a: $.data.id }
            - call: "POST /device-suppliers/${sup_a}/approve"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-apr"
              captures: { sup_a_v: $.data.version }
            - call: "POST /tag-lots"
              payload: { supplier_id: "${sup_a}", premises_id: "${prem_c}", serial_start: 100000000001, serial_end: 100000000010, expected_supplier_version: "${sup_a_v}" }
              as: DeviceSupplierRep
              as_user_id: "${sup_a}"
              captures: { lot_c: $.data.id }
            - call: "GET /device-suppliers/${sup_a}"
              payload: {}
              as: DeviceSupplierRep
              as_user_id: "${sup_a}"
              captures: { sup_a_v2: $.data.version }
            - call: "POST /tag-lots"
              payload: { supplier_id: "${sup_a}", premises_id: "${prem_m}", serial_start: 100000000011, serial_end: 100000000020, expected_supplier_version: "${sup_a_v2}" }
              as: DeviceSupplierRep
              as_user_id: "${sup_a}"
              captures: { lot_m: $.data.id }
            - call: "POST /tag-lots/${lot_c}/apply-tag"
              payload: { ain: "840100000000001", species: "BOVINE", birth_date: "2026-03-01", birth_premises_id: "${prem_m}" }
              as: Producer
              as_user_id: "${prod_a}"
            - call: "POST /tag-lots/${lot_c}/apply-tag"
              payload: { ain: "840100000000002", species: "BOVINE", birth_date: "2026-03-02", birth_premises_id: "${prem_m}" }
              as: Producer
              as_user_id: "${prod_a}"
            - call: "POST /tag-lots/${lot_m}/apply-tag"
              payload: { ain: "840100000000011", species: "BOVINE", birth_date: "2026-03-03", birth_premises_id: "${prem_m}" }
              as: Producer
              as_user_id: "${prod_a}"
            - call: "POST /tag-lots/${lot_m}/apply-tag"
              payload: { ain: "840100000000012", species: "BOVINE", birth_date: "2026-03-04", birth_premises_id: "${prem_m}" }
              as: Producer
              as_user_id: "${prod_a}"
            - call: "POST /tag-lots/${lot_m}/apply-tag"
              payload: { ain: "840100000000013", species: "BOVINE", birth_date: "2026-03-05", birth_premises_id: "${prem_m}" }
              as: Producer
              as_user_id: "${prod_a}"
            - call: "GET /premises/${prem_c}"
              payload: {}
              as: Producer
              as_user_id: "${prod_a}"
              captures: { prem_c_v: $.data.version }
            - call: "POST /reconciliation-runs"
              payload: { premises_id: "${prem_c}", period_start: "2026-08-01", period_end: "2026-08-31", expected_premises_version: "${prem_c_v}" }
              as: Producer
              as_user_id: "${prod_a}"
              captures: { rr_c: $.data.id }
            - call: "GET /premises/${prem_m}"
              payload: {}
              as: Producer
              as_user_id: "${prod_a}"
              captures: { prem_m_v: $.data.version }
            - call: "POST /reconciliation-runs"
              payload: { premises_id: "${prem_m}", period_start: "2026-08-01", period_end: "2026-08-31", expected_premises_version: "${prem_m_v}" }
              as: Producer
              as_user_id: "${prod_a}"
              captures: { rr_m: $.data.id }
          trigger:
            - call: "POST /reconciliation-runs/${rr_c}/submit"
              payload: { physical_unapplied_count: 8 }
              as: Producer
              as_user_id: "${prod_a}"
            - call: "POST /reconciliation-runs/${rr_m}/submit"
              payload: { physical_unapplied_count: 5 }
              as: Producer
              as_user_id: "${prod_a}"
          assert:
            - "ReconciliationRun.${rr_c}.basis == AS_ISSUED"
            - "ReconciliationRun.${rr_c}.book_unapplied_count == 8"
            - "ReconciliationRun.${rr_c}.variance_count == 0"
            - "ReconciliationRun.${rr_m}.basis == AS_SIGHTED"
            - "ReconciliationRun.${rr_m}.book_unapplied_count == 5"
            - "ReconciliationRun.${rr_m}.variance_count == 0"
            - "TagLot.${lot_m}.applied_count == 3 (the AS_ISSUED reading of premises M would have been 7, not 5)"
            - "TagLot.${lot_c}.unapplied_count == 8"

      - name: trace_scope_strict_interval_vs_premises_window_diverge
        grounds:
          - calculations.trace_scope_projection
          - entities.TraceRequest.fields.variant_applied
          - entities.TraceRequest.fields.hits
          - state_machines.TraceRequest.SUBMITTED_to_RUNNING
        distinguishing_aspect: |
          This dual variant lives in the epidemiological domain (Animal residency intervals), not
          in inventory accounting: over one identical sighting graph STRICT_INTERVAL returns
          hit_count 0 because animal B left premises 2 three days before the index arrived, while
          PREMISES_WINDOW widens the index residency by 14 days and returns hit_count 1.
        test_recipe:
          setup:
            - "Producer owns premises P1 (COW_CALF, TX), P2 (FEEDLOT, TX) and P3 (FEEDLOT, TX), all ACTIVE."
            - "Index animal A was tagged at P1 on 2026-08-01, departed 2026-08-09 and was received at P2 on 2026-08-10; it is still resident there."
            - "Animal B was tagged at P2 on 2026-08-05, departed 2026-08-07 and was received at P3 the same instant, so B's residency at P2 is [2026-08-05, 2026-08-07)."
            - "Clock stands at 2026-08-12T00:00:00Z when both traces are opened and run."
          setup_api_calls:
            - call: "POST /producers"
              payload: { legal_name: "Brazos Feeders", contact_email: "ops@brazos.example", state_code: "TX" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { prod_b: $.data.id }
            - call: "POST /premises"
              payload: { producer_id: "${prod_b}", pin: "TXP0001", operation_type: "COW_CALF", state_code: "TX", capacity: 50 }
              as: Producer
              as_user_id: "${prod_b}"
              captures: { p1: $.data.id }
            - call: "POST /premises"
              payload: { producer_id: "${prod_b}", pin: "TXP0002", operation_type: "FEEDLOT", state_code: "TX", capacity: 50 }
              as: Producer
              as_user_id: "${prod_b}"
              captures: { p2: $.data.id }
            - call: "POST /premises"
              payload: { producer_id: "${prod_b}", pin: "TXP0003", operation_type: "FEEDLOT", state_code: "TX", capacity: 50 }
              as: Producer
              as_user_id: "${prod_b}"
              captures: { p3: $.data.id }
            - call: "POST /premises/${p1}/approve"
              payload: {}
              as: StateAnimalHealthOfficial
              as_user_id: "saho-tx-1"
            - call: "POST /premises/${p2}/approve"
              payload: {}
              as: StateAnimalHealthOfficial
              as_user_id: "saho-tx-1"
            - call: "POST /premises/${p3}/approve"
              payload: {}
              as: StateAnimalHealthOfficial
              as_user_id: "saho-tx-1"
            - call: "POST /device-suppliers"
              payload: { company_name: "AllFlex North", supplier_code: "AFNA" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { sup_b: $.data.id }
            - call: "POST /device-suppliers/${sup_b}/approve"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-apr"
              captures: { sup_b_v: $.data.version }
            - call: "POST /tag-lots"
              payload: { supplier_id: "${sup_b}", premises_id: "${p1}", serial_start: 100000000001, serial_end: 100000000100, expected_supplier_version: "${sup_b_v}" }
              as: DeviceSupplierRep
              as_user_id: "${sup_b}"
              captures: { lot_b: $.data.id }
            - call: "POST /tag-lots/${lot_b}/apply-tag"
              payload: { ain: "840100000000001", species: "BOVINE", birth_date: "2026-02-01", birth_premises_id: "${p1}" }
              as: Producer
              as_user_id: "${prod_b}"
              captures: { an_a: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
            - call: "POST /tag-lots/${lot_b}/apply-tag"
              payload: { ain: "840100000000002", species: "BOVINE", birth_date: "2026-02-02", birth_premises_id: "${p2}" }
              as: Producer
              as_user_id: "${prod_b}"
              captures: { an_b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
            - call: "POST /movement-events"
              payload: { animal_id: "${an_b}", origin_premises_id: "${p2}", destination_premises_id: "${p3}", departed_at: "2026-08-07T00:00:00Z" }
              as: Producer
              as_user_id: "${prod_b}"
              captures: { mv_b: $.data.id }
            - call: "POST /movement-events/${mv_b}/receive"
              payload: { arrived_at: "2026-08-07T00:00:00Z" }
              as: Producer
              as_user_id: "${prod_b}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-09T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
            - call: "POST /movement-events"
              payload: { animal_id: "${an_a}", origin_premises_id: "${p1}", destination_premises_id: "${p2}", departed_at: "2026-08-09T00:00:00Z" }
              as: Producer
              as_user_id: "${prod_b}"
              captures: { mv_a: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
            - call: "POST /movement-events/${mv_a}/receive"
              payload: { arrived_at: "2026-08-10T00:00:00Z" }
              as: Producer
              as_user_id: "${prod_b}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
            - call: "POST /trace-requests"
              payload: { index_animal_id: "${an_a}", pathogen_class: "DIRECT_CONTACT", direction: "BOTH", lookback_days: 30, max_hops: 3 }
              as: FederalTraceAnalyst
              as_user_id: "fta-1"
              captures: { tr_dc: $.data.id }
            - call: "POST /trace-requests"
              payload: { index_animal_id: "${an_a}", pathogen_class: "ENVIRONMENTAL", direction: "BOTH", lookback_days: 30, max_hops: 3 }
              as: FederalTraceAnalyst
              as_user_id: "fta-1"
              captures: { tr_env: $.data.id }
          trigger:
            - call: "POST /trace-requests/${tr_dc}/run"
              payload: {}
              as: FederalTraceAnalyst
              as_user_id: "fta-1"
            - call: "POST /trace-requests/${tr_env}/run"
              payload: {}
              as: FederalTraceAnalyst
              as_user_id: "fta-1"
          assert:
            - "TraceRequest.${tr_dc}.variant_applied == STRICT_INTERVAL"
            - "TraceRequest.${tr_dc}.hit_count == 0"
            - "TraceRequest.${tr_env}.variant_applied == PREMISES_WINDOW"
            - "TraceRequest.${tr_env}.hit_count == 1"
            - "TraceRequest.${tr_env}.hits[0].animal_id == ${an_b}"
            - "TraceRequest.${tr_env}.hits[0].premises_id == ${p2}"
            - "TraceRequest.${tr_env}.hits[0].hop_depth == 1"
            - "TraceRequest.${tr_env}.hits[0].responded == false"
            - "Animal.${an_b}.trace_status == TRACE_HIT after the ENVIRONMENTAL run and was NORMAL after the DIRECT_CONTACT run"

  - rule_id: combinatorial_formula
    instances:

      - name: issuance_fee_discount_tier_keyed_on_subtotal_then_surcharge
        grounds:
          - calculations.tag_lot_issuance_fee
          - calculations.supplier_conformance_score
          - entities.TagLot.fields.fee_cents
          - entities.TagLot.fields.surcharge_cents
          - entities.DeviceSupplier.fields.probation
        distinguishing_aspect: |
          Mode (c): the fee looks circular because the surcharge is a percentage of the discounted
          total while the discount tier is described against "the total". The scaffold pins the tier
          to the PRE-surcharge subtotal, so lot 2 must land on 107692 cents; keying the tier on the
          post-surcharge total or applying the 4% before the 5% discount produces a different integer.
        test_recipe:
          setup:
            - "Supplier AFNA is APPROVED and has issued lot 1 of 4000 devices (subtotal 193000, tier 0.12, no surcharge, fee 169840)."
            - "Six defect reports are then filed, so with issued_tag_count 4000 the score is 100 - 12*(6/4.0) = 82.00, probation is true and issuance_cap is 2000."
            - "Lot 2 asks for exactly 2000 devices on an abutting serial range - the cap boundary."
          setup_api_calls:
            - call: "POST /producers"
              payload: { legal_name: "Panhandle Cattle", contact_email: "ops@panhandle.example", state_code: "TX" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { prod_f: $.data.id }
            - call: "POST /premises"
              payload: { producer_id: "${prod_f}", pin: "TXF0001", operation_type: "FEEDLOT", state_code: "TX", capacity: 500 }
              as: Producer
              as_user_id: "${prod_f}"
              captures: { prem_f: $.data.id }
            - call: "POST /premises/${prem_f}/approve"
              payload: {}
              as: StateAnimalHealthOfficial
              as_user_id: "saho-tx-1"
            - call: "POST /device-suppliers"
              payload: { company_name: "AllFlex North", supplier_code: "AFNA" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { sup_f: $.data.id }
            - call: "POST /device-suppliers/${sup_f}/approve"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-apr"
              captures: { sup_f_v: $.data.version }
            - call: "POST /tag-lots"
              payload: { supplier_id: "${sup_f}", premises_id: "${prem_f}", serial_start: 100000000001, serial_end: 100000004000, expected_supplier_version: "${sup_f_v}" }
              as: DeviceSupplierRep
              as_user_id: "${sup_f}"
              captures: { lot_f1: $.data.id }
            - call: "POST /device-suppliers/${sup_f}/defect-reports"
              payload: { defect_count: 6, note: "retention clip failures" }
              as: StateAnimalHealthOfficial
              as_user_id: "saho-tx-1"
              captures: { sup_f_v2: $.data.version, sup_f_score_pre: $.data.conformance_score }
          trigger:
            - call: "POST /tag-lots"
              payload: { supplier_id: "${sup_f}", premises_id: "${prem_f}", serial_start: 100000004001, serial_end: 100000006000, expected_supplier_version: "${sup_f_v2}" }
              as: DeviceSupplierRep
              as_user_id: "${sup_f}"
              captures: { lot_f2: $.data.id }
          assert:
            - "TagLot.${lot_f1}.quantity == 4000"
            - "TagLot.${lot_f1}.fee_cents == 169840"
            - "TagLot.${lot_f1}.discount_pct_applied == 0.12"
            - "TagLot.${lot_f1}.surcharge_cents == 0"
            - "${sup_f_score_pre} == 82.00"
            - "TagLot.${lot_f2}.quantity == 2000"
            - "TagLot.${lot_f2}.discount_pct_applied == 0.05"
            - "TagLot.${lot_f2}.surcharge_cents == 4142"
            - "TagLot.${lot_f2}.fee_cents == 107692"
            - "DeviceSupplier.${sup_f}.conformance_score == 88.00 after lot 2 (issued_tag_count 6000), yet TagLot.${lot_f2}.surcharge_cents stays 4142 because the fee froze the pre-request probation state"
            - "DeviceSupplier.${sup_f}.probation == false after lot 2"
            - "DeviceSupplier.${sup_f}.issuance_cap == 5000 after lot 2"

      - name: incentive_award_rounds_each_premises_line_then_sums
        grounds:
          - calculations.incentive_award_amount
          - entities.IncentiveAward.fields.line_items
          - entities.IncentiveAward.fields.awarded_cents
          - state_machines.Producer.NOT_ENROLLED_to_ENROLLED
        distinguishing_aspect: |
          Mode (b): nested rounding order. Two ACTIVE premises of 2 head each at tier_factor 1.00 and
          compliance_multiplier 1.25 give an exact line value of 342.5 cents; rounding per line then
          summing yields 686, while summing first and rounding once yields 685. The scaffold pins
          per-line rounding, so 686 is the only correct answer.
        test_recipe:
          setup:
            - "Producer owns premises A and premises B, both ACTIVE, with two ACTIVE animals each (4 head total -> TIER_1, tier_factor 1.00)."
            - "The producer has reported no movement events, so on_time_movement_pct is 100.00 and compliance_multiplier is 1.25."
            - "The producer is ENROLLED. Clock never leaves 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /producers"
              payload: { legal_name: "Twin Creek Ranch", contact_email: "ops@twincreek.example", state_code: "KS" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { prod_i: $.data.id }
            - call: "POST /premises"
              payload: { producer_id: "${prod_i}", pin: "KSA0001", operation_type: "COW_CALF", state_code: "KS", capacity: 60 }
              as: Producer
              as_user_id: "${prod_i}"
              captures: { prem_ia: $.data.id }
            - call: "POST /premises"
              payload: { producer_id: "${prod_i}", pin: "KSB0001", operation_type: "COW_CALF", state_code: "KS", capacity: 60 }
              as: Producer
              as_user_id: "${prod_i}"
              captures: { prem_ib: $.data.id }
            - call: "POST /premises/${prem_ia}/approve"
              payload: {}
              as: StateAnimalHealthOfficial
              as_user_id: "saho-ks-1"
            - call: "POST /premises/${prem_ib}/approve"
              payload: {}
              as: StateAnimalHealthOfficial
              as_user_id: "saho-ks-1"
            - call: "POST /device-suppliers"
              payload: { company_name: "Y-Tex Devices", supplier_code: "YTEX" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { sup_i: $.data.id }
            - call: "POST /device-suppliers/${sup_i}/approve"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-apr"
              captures: { sup_i_v: $.data.version }
            - call: "POST /tag-lots"
              payload: { supplier_id: "${sup_i}", premises_id: "${prem_ia}", serial_start: 100000000001, serial_end: 100000000010, expected_supplier_version: "${sup_i_v}" }
              as: DeviceSupplierRep
              as_user_id: "${sup_i}"
              captures: { lot_i: $.data.id }
            - call: "POST /tag-lots/${lot_i}/apply-tag"
              payload: { ain: "840100000000001", species: "BOVINE", birth_date: "2026-01-10", birth_premises_id: "${prem_ia}" }
              as: Producer
              as_user_id: "${prod_i}"
            - call: "POST /tag-lots/${lot_i}/apply-tag"
              payload: { ain: "840100000000002", species: "BOVINE", birth_date: "2026-01-11", birth_premises_id: "${prem_ia}" }
              as: Producer
              as_user_id: "${prod_i}"
            - call: "POST /tag-lots/${lot_i}/apply-tag"
              payload: { ain: "840100000000003", species: "BOVINE", birth_date: "2026-01-12", birth_premises_id: "${prem_ib}" }
              as: Producer
              as_user_id: "${prod_i}"
            - call: "POST /tag-lots/${lot_i}/apply-tag"
              payload: { ain: "840100000000004", species: "BOVINE", birth_date: "2026-01-13", birth_premises_id: "${prem_ib}" }
              as: Producer
              as_user_id: "${prod_i}"
            - call: "POST /producers/${prod_i}/enroll"
              payload: {}
              as: Producer
              as_user_id: "${prod_i}"
          trigger:
            - call: "POST /incentive-awards"
              payload: { producer_id: "${prod_i}", period_start: "2026-07-01", period_end: "2026-09-30" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { award_i: $.data.id }
          assert:
            - "IncentiveAward.${award_i}.head_count_snapshot == 4"
            - "IncentiveAward.${award_i}.tier_factor == 1.00"
            - "IncentiveAward.${award_i}.compliance_multiplier == 1.25"
            - "IncentiveAward.${award_i}.line_items has length 2, ordered by Premises.created_at ASC, so line_items[0].premises_id == ${prem_ia}"
            - "IncentiveAward.${award_i}.line_items[0].line_cents == 343"
            - "IncentiveAward.${award_i}.line_items[1].line_cents == 343"
            - "IncentiveAward.${award_i}.awarded_cents == 686 (sum-then-round would have produced 685)"
            - "IncentiveAward.${award_i}.status == ACCRUED"

