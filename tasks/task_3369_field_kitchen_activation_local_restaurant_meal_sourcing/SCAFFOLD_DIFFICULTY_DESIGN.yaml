  - rule_id: transitive_cascade
    instances:
      - name: kitchen_suspension_aborts_runs_skips_stops_and_alerts_sites
        grounds:
          - state_machines.FieldKitchen.OPERATIONAL_to_SUSPENDED
          - state_machines.DistributionRun.transitions
          - state_machines.DistributionStop.PENDING_to_SKIPPED
          - state_machines.DistributionSite.transitions
        distinguishing_aspect: |
          One FieldKitchen suspension propagates three hops in a chain where each hop is caused by the
          previous one: the kitchen's LOADING run becomes ABORTED, that run's PENDING stops become
          SKIPPED, and each site whose SKIPPED count then exceeds its DELIVERED count becomes
          SERVICE_ALERT - the site mutation is caused by the stop mutation, not by the suspension call.
        test_recipe:
          setup:
            - "Incident ${inc_id} is ACTIVE"
            - "FieldKitchen ${fk_id} is OPERATIONAL"
            - "DistributionSites ${s1} and ${s2} are REGISTERED with access_constraint OPEN"
            - "DistributionRun ${run_id} is LOADING with two PENDING stops, one per site"
          setup_api_calls:
            - call: "POST /field-ops/incidents"
              payload: { name: "Central Valley Floods", country_code: "US", disaster_type: "FLOOD", severity_level: 4, target_daily_meals: 12000, funding_ceiling_cents: 5000000 }
