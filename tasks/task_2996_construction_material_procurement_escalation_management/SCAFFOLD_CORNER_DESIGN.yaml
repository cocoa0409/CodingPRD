  - name: conditional_cascade_cancel_lands_the_package_in_sourcing_stalled
    claim_type: conditional_cascade
    grounds:
    - state_machines.PurchaseCommitment.COMMITTED_to_CANCELLED
    - state_machines.MaterialPackage.BOUGHT_OUT_to_SOURCING_STALLED
    - state_machines.Quote.CONVERTED_to_EXPIRED
    distinguishing_aspect: 'The cancel cascade branches on the clock, not on a flag: because the clock has passed the quote''s expires_at the CONVERTED quote is released to EXPIRED rather than back to OPEN, so open_quote_count after the hop is 0 and the package lands in SOURCING_STALLED — the opposite branch of the same edge pair.'
    test_recipe:
      setup:
      - Clause EXECUTED with baseline_index_value 310.00; the clause never lapses because EXECUTED is terminal
      - A non-early-buyout steel PO COMMITTED at 1150000.00 with delivery_posture still SCHEDULED
      - Clock advanced to 2026-09-20, past the quote's expires_at of 2026-09-15; the clock sweep leaves the CONVERTED quote alone (hop 1 only touches OPEN quotes) and the EXECUTED clause cannot lapse, so nothing was voided
