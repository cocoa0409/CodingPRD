      - name: an_rn_display_mode_on_a_brand_with_no_rn_number_fails_the_identity_gate
        claim_type: error_triggerable
        grounds:
          - errors.ERR_IDENTITY_DISCLOSURE_MISSING
          - validations[priority=58]
          - calculations.label_market_compliance
        distinguishing_aspect: "The identity gate reaches outside the label into the responsible brand of record: the label is flawless in itself, and the identical label approves once the display mode is switched to COMPANY_NAME, because the brand does carry a non-blank legal_name - so the failure is attributable only to the missing RN on the brand, and only because the US market sets requires_identity_disclosure true."
