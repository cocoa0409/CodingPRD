            - "Project.${proj_id}.payment_state == DEPOSIT_HELD"
            - "Project.${proj_id}.destage_eligible == false"
            - "Project.${proj_id}.fiscal_hold == false"

  - rule_id: transitive_cascade
    instances:

      - name: pickup_complete_seven_hop_closeout_cascade
        grounds:
          - state_machines.Pickup.IN_PROGRESS_to_COMPLETED
          - state_machines.InventoryPull.COMMITTED_to_RELEASED
          - state_machines.PullLine.DEPLOYED_to_RETURNED
          - state_machines.InventoryItem.DEPLOYED_to_AVAILABLE
          - state_machines.RentalOrder.DELIVERED_to_RETURNED
          - state_machines.Lease.ENDING_to_ENDED
          - state_machines.Deposit.HELD_to_APPLIED
        distinguishing_aspect: |
          A DEPTH-7 CHAIN in which each hop is caused by the PREVIOUS hop, not by the
          original call: pickup completion releases the pull; the pull's release returns its
          lines; the lines' return frees the owned units and the vendor order; the vendor
          order's return ends the lease; the lease's end materialises the invoice; the
          invoice's materialisation runs the deposit waterfall; the deposit's application
          advances the project to PICKED_UP and the property to DESTAGED.
        test_recipe:
          setup:
            - "The canonical VACANT project, term complete, pickup IN_PROGRESS at 2026-10-13T09:00:00Z with no outstanding assessments."
          setup_api_calls: *v_staged
          trigger:
            - call: "POST /staging/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-08T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staging/leases/${lease_id}/mark-term-complete"
              payload: {}
              as: StagingCoordinator
            - call: "POST /staging/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-13T09:00:00Z" }
              as: PlatformAdmin
            - call: "GET /staging/pickups?project_id=${proj_id}"
              payload: {}
              as: StagingCoordinator
              captures: { pickup_id: "$.data[0].id" }
            - call: "POST /staging/pickups/${pickup_id}/start"
              payload: {}
              as: StagingCoordinator
            - call: "POST /staging/pickups/${pickup_id}/complete"
              payload: {}
              as: StagingCoordinator
          assert:
            - "Pickup.${pickup_id}.state == COMPLETED"
            - "InventoryPull.${pull_id}.state == RELEASED"
            - "PullLine.${line_a}.state == RETURNED"
            - "InventoryItem.${item_a}.status == AVAILABLE"
            - "RentalOrder.${ro_id}.state == RETURNED"
            - "Lease.${lease_id}.state == ENDED"
            - "Deposit.${dep_id}.state == APPLIED"
            - "Project.${proj_id}.workflow_state == PICKED_UP"
            - "Property.${prop_id}.prep_state == DESTAGED"

      - name: fall_out_of_escrow_four_hop_restage_cascade
        grounds:
          - state_machines.Listing.UNDER_CONTRACT_to_BACK_ON_MARKET
          - state_machines.Project.DESTAGE_PENDING_to_RESTAGE_REQUIRED
          - state_machines.Pickup.SCHEDULED_to_CANCELLED
          - state_machines.Lease.ENDING_to_ACTIVE
          - calculations.restage_availability_recheck
        distinguishing_aspect: |
          A SECOND cascade from a DIFFERENT trigger (the listing falling out of escrow
          rather than a pickup completing) and of DEPTH 4: the listing's regression re-opens
          the project; the project's re-opening cancels the pickup; the pickup's cancellation
          reverts the lease to ACTIVE; the lease's reversion forces the pull's fill_rate to
          be re-derived.
        test_recipe:
          setup:
            - "The canonical VACANT project staged, listing driven UNDER_CONTRACT so the project is DESTAGE_PENDING with a SCHEDULED pickup."
          setup_api_calls: *v_staged
          trigger:
            - call: "POST /staging/listings/${listing_id}/under-contract"
              payload: {}
              as: ListingAgent
              as_user_id: "${agent_id}"
            - call: "GET /staging/pickups?project_id=${proj_id}"
              payload: {}
              as: StagingCoordinator
              captures: { pickup_id: "$.data[0].id" }
            - call: "POST /staging/listings/${listing_id}/fall-out-of-escrow"
              payload: {}
              as: ListingAgent
              as_user_id: "${agent_id}"
          assert:
            - "Listing.${listing_id}.listing_state == BACK_ON_MARKET"
            - "Listing.${listing_id}.fallout_count == 1"
            - "Project.${proj_id}.workflow_state == RESTAGE_REQUIRED"
            - "Project.${proj_id}.restage_count == 1"
            - "Project.${proj_id}.destage_eligible == false"
            - "Pickup.${pickup_id}.state == CANCELLED"
            - "Lease.${lease_id}.state == ACTIVE"

      - name: under_contract_three_hop_destage_eligibility_cascade
        grounds:
          - state_machines.Listing.ACTIVE_to_UNDER_CONTRACT
          - state_machines.Project.STAGED_to_DESTAGE_PENDING
          - state_machines.Lease.ACTIVE_to_ENDING
          - calculations.pickup_window
        distinguishing_aspect: |
          A DEPTH-3 chain from a THIRD trigger: the listing going under contract moves the
          project to DESTAGE_PENDING; the project's move ends the lease term; the lease's
          ENDING derives the pickup window and auto-creates the Pickup at
          pickup_window_start — 2026-06-15T09:00:00Z, five days after the CLOCK rather than
          after the lease's own end_date, because this is an early de-stage.
        test_recipe:
          setup:
            - "The canonical VACANT project staged at 2026-06-10T09:00:00Z with lease end_date 2026-10-08T09:00:00Z."
          setup_api_calls: *v_staged
          trigger:
            - call: "POST /staging/listings/${listing_id}/under-contract"
              payload: {}
              as: ListingAgent
              as_user_id: "${agent_id}"
            - call: "GET /staging/pickups?project_id=${proj_id}"
              payload: {}
              as: StagingCoordinator
              captures: { pickup_id: "$.data[0].id" }
          assert:
            - "Project.${proj_id}.workflow_state == DESTAGE_PENDING"
            - "Project.${proj_id}.destage_eligible == true"
            - "Lease.${lease_id}.state == ENDING"
            - "Lease.${lease_id}.billed_cycles == 4"
            - "Lease.${lease_id}.pickup_window_start == 2026-06-15T09:00:00.000Z"
            - "Lease.${lease_id}.pickup_window_end == 2026-06-22T09:00:00.000Z"
            - "Pickup.${pickup_id}.state == SCHEDULED"
            - "Pickup.${pickup_id}.scheduled_at == 2026-06-15T09:00:00.000Z"

  - rule_id: priority_pair_validation_conflict
    instances:

      - name: unauthorized_role_beats_missing_project_returns_unauthorized
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_PROJECT_NOT_FOUND]
        distinguishing_aspect: |
          PAIR (auth rung 4, existence rung 5). One request violates both: a
          WarehouseManager — a role absent from the authorize endpoint's roles — targets a
          project id that does not exist. G2 precedes G3, so the answer is
          ERR_UNAUTHORIZED (403), never ERR_PROJECT_NOT_FOUND (404).
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned at 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /staging/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /staging/projects/9f1e0c2b-4a5d-4e61-8c9b-11e7b6a0f1d2/authorize"
              payload: {}
              as: WarehouseManager
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 403"
            - "response.data.error_id == ERR_UNAUTHORIZED"

      - name: missing_tier_beats_unapproved_scope_returns_tier_not_found
        grounds:
          - validations[priority=9]
          - validations[priority=38]
          - errors[ERR_TIER_NOT_FOUND]
          - errors[ERR_SCOPE_NOT_APPROVED]
        distinguishing_aspect: |
          PAIR (existence rung 9, business_safety rung 38) — a DIFFERENT pair from the
          auth/existence conflict above. The create-project body names a package_tier_id
          that does not exist AND a consultation still in SCOPE_DRAFTED; G3 precedes G8, so
          the answer is ERR_TIER_NOT_FOUND (404), never ERR_SCOPE_NOT_APPROVED (409).
        test_recipe:
          setup:
            - "A consultation in state SCOPE_DRAFTED (one scope item added, never submitted or approved)."
          setup_api_calls: *cons_held
          trigger:
            - call: "POST /staging/projects"
              payload: { property_id: "${prop_id}", consultation_id: "${cons_id}", listing_id: "${listing_id}", package_tier_id: "6b0f9d31-2c44-4a08-9b7e-33a1c4e5d600", payer_client_id: "${seller_id}", payer_type: "SELLER" }
              as: StagingCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 404"
            - "response.data.error_id == ERR_TIER_NOT_FOUND"
            - "Consultation.${cons_id}.state == SCOPE_DRAFTED"

      - name: stale_lease_version_beats_zero_cycle_request_returns_stale_version
        grounds:
          - validations[priority=36]
          - validations[priority=45]
          - concurrency_rules[extension-request-stale-lease]
          - errors[ERR_STALE_LEASE_VERSION]
          - errors[ERR_PARTIAL_CYCLE_EXTENSION]
        distinguishing_aspect: |
          PAIR (state rung 36 under G7, business_constraint rung 45 under G8) — a THIRD
          distinct pair. The extension request carries BOTH a stale expected_lease_version
          and requested_cycles 0; G7 precedes G8, so the answer is
          ERR_STALE_LEASE_VERSION (412), never ERR_PARTIAL_CYCLE_EXTENSION (422).
        test_recipe:
          setup:
            - "The canonical VACANT project with an ACTIVE lease whose version has been read."
          setup_api_calls: *v_staged
          trigger:
            - call: "GET /staging/leases/${lease_id}"
              payload: {}
              as: StagingCoordinator
              captures: { lease_v: "$.data.version" }
            - call: "POST /staging/leases/${lease_id}/extensions"
              payload: { requested_cycles: 0, expected_lease_version: "${lease_v} - 1" }
              as: StagingCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 412"
            - "response.data.error_id == ERR_STALE_LEASE_VERSION"
            - "Lease.${lease_id}.billed_cycles == 4"

      - name: expired_service_window_beats_uncollected_deposit_returns_window_expired
        grounds:
          - validations[priority=63]
          - validations[priority=66]
          - errors[ERR_SERVICE_WINDOW_EXPIRED]
          - errors[ERR_DEPOSIT_NOT_HELD]
        distinguishing_aspect: |
          PAIR (business_temporal rung 63 under G9, business_fiscal rung 66 under G10) — a
          FOURTH distinct pair. Scheduling a visit both past service_window_end_date and
          before the deposit is collected returns ERR_SERVICE_WINDOW_EXPIRED (409) because
          G9 precedes G10, never ERR_DEPOSIT_NOT_HELD (402).
        test_recipe:
          setup:
            - "An OCCUPIED project authorized at 2026-06-01T00:00:00Z, so service_window_end_date is 2026-07-16T00:00:00Z."
            - "Its Deposit is still in state REQUIRED — never collected."
