        test_recipe:
          setup:
            - "Ceremony reached AUDIT_LOCKED; batch created and one diploma queued (pinned SUMMA); then reopen-audit returned posture to AUDIT_OPEN (allowed because no batch is RELEASED/PRINTED)"
          setup_api_calls:
