          assert:
            - "threshold-1: SubmissionLot.${lot39_id}.sample_size == 39 and valuation_variant == FULL_COUNT"
            - "threshold: SubmissionLot.${lot40_id}.sample_size == 40 and valuation_variant == FULL_COUNT (not 4, and not SAMPLED_EXTRAPOLATION)"
            - "threshold+1: SubmissionLot.${lot41_id}.sample_size == 5 and valuation_variant == SAMPLED_EXTRAPOLATION (ceil_div(41 * 10, 100) == 5)"
