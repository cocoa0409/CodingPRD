  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: order_quantity_half_up_rounding
        claim_type: precision
        grounds: [calculations.order_quantity]
        distinguishing_aspect: "Requested quantity rounds half-up to 2 decimals: 3.0 cfs x 7 h x 0.0826 = 1.7346 -> 1.73, pinning the AF_PER_CFS_HOUR constant and rounding mode."
