            - call: "POST /organizations"
              payload: { name: "Org X", service_categories: ["LEGAL"], referral_capacity: 5, contact_email: "x@org.test" }
              as: CenterAdmin
              captures: { orgx_id: $.data.id }
            - call: "POST /referrals"
