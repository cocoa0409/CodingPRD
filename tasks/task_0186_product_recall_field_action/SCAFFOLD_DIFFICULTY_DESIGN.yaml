            - call: "POST /recalls/${rc}/affected-lots"
              payload: { lot_id: "${lot}", expected_recall_version: "${rc_v0}" }
              as: RecallCoordinator
            - call: "POST /recalls/${rc}/classify"
              payload: {}
              as: RecallCoordinator
            - call: "POST /regulatory-reports"
              payload: { recall_id: "${rc}", report_kind: "INITIAL" }
              as: RecallCoordinator
              captures: { rep: $.data.id }
            - call: "POST /regulatory-reports/${rep}/submit"
