            - "EXACTLY AT the ceiling: the GB PERFORMANCE line has gross_cents exactly 100000 == ADMIN_TIER_1_CEILING_CENTS, so the strict `<` fails and ADMIN_TIER_2_BPS 900 applies: admin_fee_cents 9000, net_cents 91000."
