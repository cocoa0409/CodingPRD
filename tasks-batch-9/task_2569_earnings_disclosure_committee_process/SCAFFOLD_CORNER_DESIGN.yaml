          assert:
            - "${tight_slack_b} == 0 and ${tight_slack_c} == 0 for the FILING milestone ending 2026-08-10T12:00:00Z: no business day lies strictly after 08-10 through 08-10, and the 5.5 remaining hours truncate to 0 whole calendar days"
            - "${loose_slack_b} == 2 and ${loose_slack_c} == 3 for the FILING milestone ending 2026-08-06T18:00:00Z: business days 08-07 (Friday) and 08-10 (Monday) count, 08-08 and 08-09 are the weekend, and 3 days 23.5 hours truncate to 3"
            - "the first DECLARE_FILING_READY returns 409 ERR_CERTIFICATIONS_INCOMPLETE, NOT ERR_MILESTONE_SLACK_EXHAUSTED, although min_slack_days_business is already 0: ${slack_b_1} == 0 while ${unsigned_1} == [CEO_302, CFO_302]"
            - "${blocking_1} == [ERR_CERTIFICATIONS_INCOMPLETE, ERR_MILESTONE_SLACK_EXHAUSTED] — ascending §1.4 priority order (44 then 45), so its first element is exactly the code the transition returned; ${eligible_1} == false"
            - "after both signatures ${unsigned_2} == [] and ${blocking_2} == [ERR_MILESTONE_SLACK_EXHAUSTED], with ${slack_b_2} == 0 and ${slack_c_2} == 0"
            - "the second DECLARE_FILING_READY returns 409 ERR_MILESTONE_SLACK_EXHAUSTED"
            - "STARTing the tight milestone does NOT help — IN_PROGRESS is still inside the {PLANNED, IN_PROGRESS} slack input set, so the third DECLARE_FILING_READY returns 409 ERR_MILESTONE_SLACK_EXHAUSTED again"
            - "after the tight milestone reaches COMPLETE it drops out of the aggregate and only the loose FILING milestone remains open: ${slack_b_3} == 2, ${slack_c_3} == 3, ${blocking_3} == [] and ${eligible_3} == true"
            - "the fourth DECLARE_FILING_READY succeeds with ${cyc_status_ready} == FILING_READY"
            - "${acc1} == FORM_10Q-FY2026-Q2-1 and ${late1} == false (filed_utc 2026-08-01T00:00:00Z is before the 2026-08-10T17:30:00Z deadline)"
            - "${mat_pct} == 5.83 and ${classification} == RESTATEMENT under IRON_CURTAIN ((400000 + 300000) / 12000000 * 100 = 5.8333 rounded to 5.83, at or above the 5.0 restatement threshold)"
            - "the cascaded deficiency reads ${def_score} == 3.50, ${def_sev} == SIGNIFICANT_DEFICIENCY and ${def_weight} == 7.00: max(5.83, 40 * 500000/10000000 = 2.00) = 5.83, times the 0.6 compensating credit = 3.498 -> 3.50, times the SIGNIFICANT_DEFICIENCY factor 2.0 = 7.00"
            - "${cyc_weight} == 7.00 and ${cyc_stage} == RESTATEMENT_DECLARED"
            - "the amending filing while the deficiency is OPEN returns 409 ERR_DEFICIENCY_OPEN — and NOT ERR_INVALID_STATE, because FILED -> AMENDED is a declared edge"
            - "after mitigation ${def_status} == MITIGATED, ${cyc_weight_after} == 0.00, ${corr_status} == CLOSED and ${cyc_stage_after} == REMEDIATED"
            - "the retried amending filing now succeeds: ${acc2} == FORM_10Q-FY2026-Q2-2, ${filing1_status} == AMENDED_SUPERSEDED and ${cyc_status_amended} == AMENDED"
            - "Amendment No. 2 pointed back at the ORIGINAL filing returns 409 ERR_AMENDMENT_TARGET_INVALID (that filing is AMENDED_SUPERSEDED, not SUBMITTED) and NOT ERR_ENTITY_TERMINAL, per the scope note on §1.4 priority 12"
            - "pointed at the SUBMITTED Amendment No. 1 it succeeds: ${acc3} == FORM_10Q-FY2026-Q2-3, ${filing2_status} == AMENDED_SUPERSEDED, ${cyc_status_final} == AMENDED (the self-edge leaves the status unchanged) and ${cycle_v4} is strictly greater than ${cycle_v3}"

  # ===================================================================
  # SECTION 7 — RBAC (§1.7)
  # Seven roles: ComplianceAdmin (identity: opaque) plus six entity_backed:CommitteeMember
  # roles. role_model is `segregation_of_duties`.
  # ===================================================================
  - section: rbac
    instances:

      - name: probe_missing_auth_headers_and_unknown_roles_are_rejected_before_any_state_check
        claim_type: authentication
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - validations[priority=3]
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - roles[ComplianceAdmin].identity
        distinguishing_aspect: |
          §1.4 priority 1 requires BOTH headers on EVERY request "except GET endpoints, which still require
          both" — i.e. reads are not anonymous, which is the clause most implementations skip. The three
          403 layers are then separated: priority 2 rejects a string that is not one of the seven declared
          roles, priority 2 also rejects a real role absent from the endpoint's own roles list, and
          priority 3 rejects an entity_backed role whose X-User-ID resolves to no CommitteeMember — while
          ComplianceAdmin, whose identity is `opaque`, is exempt from that resolution and must still be
          served with an arbitrary user id. All three share one error code but not one cause, and every
          one of them must fire ahead of the 404 for a well-formed but non-existent path id.
        test_recipe:
          setup:
            - "One charter and one FY2026-Q2 cycle exist; no other state is needed because none of these probes gets past the auth band."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Auth Probe Charter", version_label: "2026.1", min_quorum_count: 1, required_functions: ["FINANCE"] }
              as: ComplianceAdmin
              captures: { charter_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Nora Finance", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { fin_id: $.data.id }
            - call: "POST /disclosure/reporting-cycles"
              payload: { fiscal_period_label: "FY2026-Q2", form_type: "FORM_10Q", period_end_date: "2026-06-30", filer_status: "LARGE_ACCELERATED", materiality_base_amount: 10000000, charter_id: "${charter_id}", internal_buffer_days: 5 }
              as: ComplianceAdmin
              captures: { cycle_id: $.data.id }
          trigger:
            - call: "GET /disclosure/charters"
              payload: { limit: 10, offset: 0 }
              as: "(X-User-Role header omitted entirely; X-User-ID: admin-1)"
              expect_error: { http: 401, error_id: ERR_UNAUTHENTICATED }
            - call: "GET /disclosure/charters"
              payload: { limit: 10, offset: 0 }
              as: "ComplianceAdmin with the X-User-ID header omitted entirely"
              expect_error: { http: 401, error_id: ERR_UNAUTHENTICATED }
            - call: "GET /disclosure/charters"
              payload: { limit: 10, offset: 0 }
              as: "ComplianceAdmin with X-User-ID set to the empty string"
              expect_error: { http: 401, error_id: ERR_UNAUTHENTICATED }
            - call: "GET /disclosure/charters"
              payload: { limit: 10, offset: 0 }
              as: "Auditor (a role name that is not one of the seven declared roles), X-User-ID: someone-1"
              expect_error: { http: 403, error_id: ERR_ROLE_NOT_PERMITTED }
            - call: "POST /disclosure/charters"
              payload: { name: "Smuggled Charter", version_label: "2026.9", min_quorum_count: 1, required_functions: ["FINANCE"] }
              as: Controller
              as_user_id: "${fin_id}"
              expect_error: { http: 403, error_id: ERR_ROLE_NOT_PERMITTED }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/milestones"
              payload: { kind: "CLOSE", planned_start_utc: "2026-08-01T00:00:00Z", planned_end_utc: "2026-08-03T00:00:00Z" }
              as: Controller
              as_user_id: "00000000-0000-4000-8000-0000000000aa"
              expect_error: { http: 403, error_id: ERR_ROLE_NOT_PERMITTED }
            - call: "POST /disclosure/milestones/00000000-0000-4000-8000-0000000000bb/transitions"
              payload: { action: "START" }
              as: Controller
              as_user_id: "00000000-0000-4000-8000-0000000000aa"
              expect_error: { http: 403, error_id: ERR_ROLE_NOT_PERMITTED }
            - call: "GET /disclosure/charters"
              payload: { limit: 10, offset: 0 }
              as: ComplianceAdmin
              as_user_id: "ops-console-7"
          assert:
            - "omitting X-User-Role returns 401 ERR_UNAUTHENTICATED even on a GET"
            - "omitting X-User-ID returns 401 ERR_UNAUTHENTICATED even for the opaque ComplianceAdmin role, and an empty-string X-User-ID is treated as absent"
            - "the unknown role name Auditor returns 403 ERR_ROLE_NOT_PERMITTED, not 401"
            - "Controller on the ComplianceAdmin-exclusive POST /disclosure/charters returns 403 ERR_ROLE_NOT_PERMITTED"
            - "Controller with an X-User-ID that matches no CommitteeMember returns 403 ERR_ROLE_NOT_PERMITTED (priority 3), and the same unresolvable id against a NON-EXISTENT milestone id still returns 403 — the auth band outranks the 404 at priority 6"
            - "ComplianceAdmin with the arbitrary X-User-ID `ops-console-7` returns HTTP 200: an opaque identity is never resolved against CommitteeMember"

      - name: every_role_reaches_its_own_exclusive_write_and_cannot_reach_another_roles
        claim_type: role_permissions
        grounds:
          - roles[ComplianceAdmin].exclusive_operations
          - roles[DisclosureCommitteeChair].exclusive_operations
          - roles[Controller].exclusive_operations
          - roles[LegalCounsel].exclusive_operations
          - roles[InvestorRelations].exclusive_operations
          - roles[CertifyingOfficer].exclusive_operations
          - roles[BusinessLeader].exclusive_operations
          - validations[priority=2]
        distinguishing_aspect: |
          A round-robin over all seven roles: each one performs one operation from its OWN
          exclusive_operations list successfully, and is then refused one operation drawn from a DIFFERENT
          role's exclusive list with 403 ERR_ROLE_NOT_PERMITTED. Because §1.7 is a peer segregation model
          rather than a hierarchy, the refusals run in BOTH directions across every pair probed — the Chair
          cannot open the close calendar and the Controller cannot assign sub-certifications — so an
          implementation that grants the Chair or the ComplianceAdmin a super-user override fails. The
          CertifyingOfficer's own exclusive write (signing) is exercised positively in the errors-section
          instance filing_readiness_and_amendment_guards_fire_in_sequence_on_a_single_cycle, so only its
          refusal direction is probed here.
        test_recipe:
          setup:
            - "An ADOPTED charter carrying one member per function: FINANCE (voting), LEGAL (voting), INVESTOR_RELATIONS (voting), an is_officer FINANCE member, and an OPERATIONS business leader."
            - "A FY2026-Q2 FORM_10Q cycle in CLOSE_OPEN with a CLOSE milestone, one PENDING sub-certification held by the OPERATIONS member, and one DRAFT CALL_SCRIPT document authored by the INVESTOR_RELATIONS member."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Role Matrix Charter", version_label: "2026.1", min_quorum_count: 3, required_functions: ["FINANCE", "LEGAL", "INVESTOR_RELATIONS"] }
              as: ComplianceAdmin
              captures: { charter_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Nora Finance", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { fin_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Owen Legal", function: "LEGAL", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { legal_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Ivy Relations", function: "INVESTOR_RELATIONS", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { ir_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Rhea Chief", function: "FINANCE", is_officer: true, voting: true }
              as: ComplianceAdmin
              captures: { ceo_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Bo Ops", function: "OPERATIONS", is_officer: false, voting: false }
              as: ComplianceAdmin
              captures: { ops_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/transitions"
              payload: { action: "ADOPT" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
            - call: "POST /disclosure/reporting-cycles"
              payload: { fiscal_period_label: "FY2026-Q2", form_type: "FORM_10Q", period_end_date: "2026-06-30", filer_status: "LARGE_ACCELERATED", materiality_base_amount: 10000000, charter_id: "${charter_id}", internal_buffer_days: 5 }
              as: ComplianceAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/milestones"
              payload: { kind: "CLOSE", planned_start_utc: "2026-08-01T00:00:00Z", planned_end_utc: "2026-08-03T00:00:00Z" }
              as: Controller
              as_user_id: "${fin_id}"
              captures: { close_ms_id: $.data.id }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/transitions"
              payload: { action: "OPEN_CLOSE" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/sub-certifications"
              payload: { cycle_id: "${cycle_id}", member_id: "${ops_id}", scope_area: "OPERATIONS", due_utc: "2026-08-04T17:00:00Z" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
              captures: { sc_id: $.data.id }
            - call: "GET /disclosure/reporting-cycles/${cycle_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { cycle_v: $.data.version }
            - call: "POST /disclosure/documents"
              payload: { cycle_id: "${cycle_id}", doc_type: "CALL_SCRIPT", title: "Q2 Earnings Call Script", author_member_id: "${ir_id}", safe_harbor_present: true, expected_cycle_version: "${cycle_v}" }
              as: InvestorRelations
              as_user_id: "${ir_id}"
              captures: { doc_id: $.data.id, doc_v: $.data.version }
            - call: "POST /disclosure/officer-certifications"
              payload: { cycle_id: "${cycle_id}", officer_member_id: "${ceo_id}", cert_type: "CEO_302" }
              as: ComplianceAdmin
              captures: { cert_id: $.data.id }
          trigger:
            - call: "POST /disclosure/documents/${doc_id}/qa-items"
              payload: { question_text: "How should we frame the warranty accrual change?", topic: "MARGIN", risk_tier: "HIGH" }
              as: InvestorRelations
              as_user_id: "${ir_id}"
              captures: { qa_id: $.data.id }
            - call: "POST /disclosure/qa-items/${qa_id}/clear"
              payload: { clearance_note: "Approved wording with a forward-looking qualifier." }
              as: LegalCounsel
              as_user_id: "${legal_id}"
              captures: { qa_status: $.data.status }
            - call: "POST /disclosure/sub-certifications/${sc_id}/transitions"
              payload: { action: "SUBMIT" }
              as: BusinessLeader
              as_user_id: "${ops_id}"
              captures: { sc_status: $.data.status }
            - call: "POST /disclosure/milestones/${close_ms_id}/transitions"
              payload: { action: "START" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/sub-certifications"
              payload: { cycle_id: "${cycle_id}", member_id: "${fin_id}", scope_area: "REVENUE", due_utc: "2026-08-04T17:00:00Z" }
              as: Controller
              as_user_id: "${fin_id}"
              expect_error: { http: 403, error_id: ERR_ROLE_NOT_PERMITTED }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/milestones"
              payload: { kind: "REVIEW", planned_start_utc: "2026-08-05T00:00:00Z", planned_end_utc: "2026-08-06T00:00:00Z" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
              expect_error: { http: 403, error_id: ERR_ROLE_NOT_PERMITTED }
            - call: "POST /disclosure/documents/${doc_id}/tie-out-items"
              payload: { line_label: "Total revenue", reported_value: 4120000, source_record_value: 4120000, tolerance_bp: 25, preparer_member_id: "${fin_id}", expected_document_version: "${doc_v}" }
              as: LegalCounsel
              as_user_id: "${legal_id}"
              expect_error: { http: 403, error_id: ERR_ROLE_NOT_PERMITTED }
            - call: "POST /disclosure/qa-items/${qa_id}/clear"
              payload: { clearance_note: "Investor relations self-clearance attempt." }
              as: InvestorRelations
              as_user_id: "${ir_id}"
              expect_error: { http: 403, error_id: ERR_ROLE_NOT_PERMITTED }
            - call: "POST /disclosure/officer-certifications/${cert_id}/sign"
              payload: { attestation_text: "A business leader attempting an officer signature." }
              as: BusinessLeader
              as_user_id: "${ops_id}"
              expect_error: { http: 403, error_id: ERR_ROLE_NOT_PERMITTED }
            - call: "POST /disclosure/filings"
              payload: { cycle_id: "${cycle_id}", document_id: "${doc_id}" }
              as: CertifyingOfficer
              as_user_id: "${ceo_id}"
              expect_error: { http: 403, error_id: ERR_ROLE_NOT_PERMITTED }
            - call: "POST /disclosure/documents/${doc_id}/transitions"
              payload: { action: "SUBMIT_REVIEW" }
              as: ComplianceAdmin
              expect_error: { http: 403, error_id: ERR_ROLE_NOT_PERMITTED }
            - call: "POST /disclosure/documents/${doc_id}/transitions"
              payload: { action: "SUBMIT_REVIEW" }
              as: InvestorRelations
              as_user_id: "${ir_id}"
              captures: { doc_status: $.data.status }
          assert:
            - "every positive write lands: the IR member's qa-item is created, ${qa_status} == CLEARED after the LEGAL member clears it, ${sc_status} == SUBMITTED after the OPERATIONS member submits, the Controller's milestone START succeeds, and ${doc_status} == IN_REVIEW after the IR member's shared SUBMIT_REVIEW"
            - "Controller assigning a sub-certification returns 403 ERR_ROLE_NOT_PERMITTED (Chair-exclusive) and the Chair creating a milestone returns 403 ERR_ROLE_NOT_PERMITTED (Controller-exclusive) — the refusals run in both directions between peers"
            - "LegalCounsel creating a tie-out item, InvestorRelations clearing a question, BusinessLeader signing a certification, CertifyingOfficer submitting a filing and ComplianceAdmin driving a document transition all return 403 ERR_ROLE_NOT_PERMITTED"
            - "no row is created or advanced by any of the seven refusals: the milestone list still holds exactly the CLOSE milestone and the cycle still has exactly one sub-certification"

      - name: function_gate_outranks_action_gate_and_both_are_distinct_from_the_role_list_check
        claim_type: role_permissions
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_MEMBER_FUNCTION_MISMATCH]
          - errors[ERR_ROLE_ACTION_MISMATCH]
          - roles[DisclosureCommitteeChair].constraints
          - roles[InvestorRelations].constraints
          - roles[BusinessLeader].constraints
        distinguishing_aspect: |
          Three 403s that are easy to conflate are pulled apart. Priority 2 asks "is this role listed on
          this endpoint", priority 4 asks "does the acting member's FUNCTION match the role it claims", and
          priority 5 asks "is this ACTION open to that role on a multi-action endpoint". The decisive probe
          is a member whose function is LEGAL acting as Controller AND invoking the Chair-only
          DECLARE_FILING_READY: two rules are violated at once and the answer must be
          ERR_MEMBER_FUNCTION_MISMATCH, because priority 4 precedes priority 5. The Chair's own gate is
          `voting == true` rather than a function, so the non-voting OPERATIONS member is refused with the
          same code from a completely different predicate.
        test_recipe:
          setup:
            - "The same charter shape as the role-matrix instance: FINANCE, LEGAL and INVESTOR_RELATIONS voting members plus a NON-voting OPERATIONS member; charter ADOPTED; cycle in CLOSE_OPEN with a CLOSE milestone; one PENDING sub-certification held by the OPERATIONS member; one IN_REVIEW PERIODIC_FILING document authored by the FINANCE member."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Function Gate Charter", version_label: "2026.1", min_quorum_count: 3, required_functions: ["FINANCE", "LEGAL", "INVESTOR_RELATIONS"] }
              as: ComplianceAdmin
              captures: { charter_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Nora Finance", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { fin_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Owen Legal", function: "LEGAL", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { legal_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Ivy Relations", function: "INVESTOR_RELATIONS", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { ir_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Bo Ops", function: "OPERATIONS", is_officer: false, voting: false }
              as: ComplianceAdmin
              captures: { ops_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/transitions"
              payload: { action: "ADOPT" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
            - call: "POST /disclosure/reporting-cycles"
              payload: { fiscal_period_label: "FY2026-Q2", form_type: "FORM_10Q", period_end_date: "2026-06-30", filer_status: "LARGE_ACCELERATED", materiality_base_amount: 10000000, charter_id: "${charter_id}", internal_buffer_days: 5 }
              as: ComplianceAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/milestones"
              payload: { kind: "CLOSE", planned_start_utc: "2026-08-01T00:00:00Z", planned_end_utc: "2026-08-03T00:00:00Z" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/transitions"
              payload: { action: "OPEN_CLOSE" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/sub-certifications"
              payload: { cycle_id: "${cycle_id}", member_id: "${ops_id}", scope_area: "OPERATIONS", due_utc: "2026-08-04T17:00:00Z" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
              captures: { sc_id: $.data.id }
            - call: "GET /disclosure/reporting-cycles/${cycle_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { cycle_v: $.data.version }
            - call: "POST /disclosure/documents"
              payload: { cycle_id: "${cycle_id}", doc_type: "PERIODIC_FILING", title: "Form 10-Q FY2026-Q2", author_member_id: "${fin_id}", expected_cycle_version: "${cycle_v}" }
              as: Controller
              as_user_id: "${fin_id}"
              captures: { doc_id: $.data.id }
            - call: "POST /disclosure/documents/${doc_id}/transitions"
              payload: { action: "SUBMIT_REVIEW" }
              as: Controller
              as_user_id: "${fin_id}"
          trigger:
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/milestones"
              payload: { kind: "REVIEW", planned_start_utc: "2026-08-05T00:00:00Z", planned_end_utc: "2026-08-06T00:00:00Z" }
              as: Controller
              as_user_id: "${legal_id}"
              expect_error: { http: 403, error_id: ERR_MEMBER_FUNCTION_MISMATCH }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/transitions"
              payload: { action: "DECLARE_FILING_READY" }
              as: Controller
              as_user_id: "${legal_id}"
              expect_error: { http: 403, error_id: ERR_MEMBER_FUNCTION_MISMATCH }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/transitions"
              payload: { action: "DECLARE_FILING_READY" }
              as: Controller
              as_user_id: "${fin_id}"
              expect_error: { http: 403, error_id: ERR_ROLE_ACTION_MISMATCH }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/transitions"
              payload: { action: "OPEN_REVIEW" }
              as: DisclosureCommitteeChair
              as_user_id: "${ops_id}"
              expect_error: { http: 403, error_id: ERR_MEMBER_FUNCTION_MISMATCH }
            - call: "POST /disclosure/documents/${doc_id}/transitions"
              payload: { action: "APPROVE" }
              as: InvestorRelations
              as_user_id: "${ir_id}"
              expect_error: { http: 403, error_id: ERR_ROLE_ACTION_MISMATCH }
            - call: "POST /disclosure/documents/${doc_id}/transitions"
              payload: { action: "SUBMIT_REVIEW" }
              as: InvestorRelations
              as_user_id: "${legal_id}"
              expect_error: { http: 403, error_id: ERR_MEMBER_FUNCTION_MISMATCH }
            - call: "POST /disclosure/sub-certifications/${sc_id}/transitions"
              payload: { action: "WITHDRAW" }
              as: BusinessLeader
              as_user_id: "${ops_id}"
              expect_error: { http: 403, error_id: ERR_ROLE_ACTION_MISMATCH }
            - call: "POST /disclosure/sub-certifications/${sc_id}/transitions"
              payload: { action: "SUBMIT" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
              expect_error: { http: 403, error_id: ERR_ROLE_ACTION_MISMATCH }
            - call: "POST /disclosure/sub-certifications/${sc_id}/transitions"
              payload: { action: "WITHDRAW" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
              captures: { sc_status: $.data.status }
          assert:
            - "the LEGAL member acting as Controller on a milestone create returns 403 ERR_MEMBER_FUNCTION_MISMATCH"
            - "the LEGAL member acting as Controller AND invoking DECLARE_FILING_READY returns 403 ERR_MEMBER_FUNCTION_MISMATCH — priority 4 outranks priority 5, so the function answer wins over the action answer"
            - "the FINANCE member acting as Controller with the same DECLARE_FILING_READY action returns 403 ERR_ROLE_ACTION_MISMATCH: only the actor changed, so the two codes are proven distinct"
            - "the NON-voting OPERATIONS member acting as DisclosureCommitteeChair returns 403 ERR_MEMBER_FUNCTION_MISMATCH even for the SHARED OPEN_REVIEW action — the Chair gate is voting == true, not a function"
            - "InvestorRelations invoking APPROVE returns 403 ERR_ROLE_ACTION_MISMATCH, while the LEGAL member claiming InvestorRelations on the permitted SUBMIT_REVIEW action returns 403 ERR_MEMBER_FUNCTION_MISMATCH"
            - "BusinessLeader invoking WITHDRAW returns 403 ERR_ROLE_ACTION_MISMATCH and DisclosureCommitteeChair invoking SUBMIT returns 403 ERR_ROLE_ACTION_MISMATCH — the two sub-certification actions are split between the two roles that share the endpoint"
            - "the Chair's own WITHDRAW succeeds: ${sc_status} == WITHDRAWN, so none of the six refusals damaged the row"

      - name: same_user_cannot_prepare_and_review_the_same_tie_out_line
        claim_type: segregation_of_duties
        grounds: ["validations[priority=17]", "errors[ERR_SOD_SELF_REVIEW]"]
        excluded_because:
          difficulty_instance: recused_self_reviewer_reports_seat_invalid_not_self_review
          rationale: |
            The §1.7 role_model `segregation_of_duties` row asks for "same user cannot do step A and step B".
            That §1.8 instance already drives it end to end on the tie-out preparer/reviewer pair: the same
            member is refused as its own reviewer, the refusal is first masked by ERR_MEMBER_SEAT_INVALID
            while the seat is RECUSED, and after REINSTATE the identical request returns
            ERR_SOD_SELF_REVIEW at 409. The document-author axis of the same model is covered by the
            errors-section instance both_segregation_of_duties_gates_fire_and_a_second_actor_gets_past_them.

  # ===================================================================
  # SECTION 8 — CROSS-CUTTING COMPLEXITY LAYERS
  # complexity_profile.complexity_layers = [optimistic_concurrency,
  # cascading_side_effects, dual_variant_calculation, rate_threshold_triggers].
  # §1.2.1 declares exactly two concurrency_rules, and each gets its own instance.
  # ===================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_expected_cycle_version_blocks_a_document_create_and_the_fresh_one_lands
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[document-create-stale-cycle]
          - errors[ERR_STALE_CYCLE_VERSION]
          - endpoints[POST /disclosure/documents]
        distinguishing_aspect: |
          The §1.2.1 rule document-create-stale-cycle guards a CREATE, not an update, and the version it
          guards belongs to the PARENT cycle — which a completely unrelated write bumps. Here the staleness
          is produced by a sub-certification assignment, an operation that touches no document at all: the
          client's cycle version is invalidated by someone else's write to a sibling aggregate. The retry
          with the same (now consumed) version must fail again, because the successful document create
          itself increments the cycle version, so a client cannot replay one accepted token twice.
        test_recipe:
          setup:
            - "An ADOPTED charter with a FINANCE and a LEGAL voting member; a FY2026-Q2 FORM_10Q cycle in CLOSE_OPEN with a CLOSE milestone."
            - "The cycle version is read BEFORE the interfering write, so the captured token is provably stale by one."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "OCC Cycle Charter", version_label: "2026.1", min_quorum_count: 2, required_functions: ["FINANCE", "LEGAL"] }
              as: ComplianceAdmin
              captures: { charter_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Nora Finance", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { fin_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Owen Legal", function: "LEGAL", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { legal_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/transitions"
              payload: { action: "ADOPT" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
            - call: "POST /disclosure/reporting-cycles"
              payload: { fiscal_period_label: "FY2026-Q2", form_type: "FORM_10Q", period_end_date: "2026-06-30", filer_status: "LARGE_ACCELERATED", materiality_base_amount: 10000000, charter_id: "${charter_id}", internal_buffer_days: 5 }
              as: ComplianceAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/milestones"
              payload: { kind: "CLOSE", planned_start_utc: "2026-08-01T00:00:00Z", planned_end_utc: "2026-08-03T00:00:00Z" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/transitions"
              payload: { action: "OPEN_CLOSE" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "GET /disclosure/reporting-cycles/${cycle_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { cycle_v_old: $.data.version }
            - call: "POST /disclosure/sub-certifications"
              payload: { cycle_id: "${cycle_id}", member_id: "${fin_id}", scope_area: "REVENUE", due_utc: "2026-08-04T17:00:00Z" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
          trigger:
            - call: "POST /disclosure/documents"
              payload: { cycle_id: "${cycle_id}", doc_type: "PERIODIC_FILING", title: "Form 10-Q FY2026-Q2", author_member_id: "${fin_id}", expected_cycle_version: "${cycle_v_old}" }
              as: Controller
              as_user_id: "${fin_id}"
              expect_error: { http: 412, error_id: ERR_STALE_CYCLE_VERSION }
            - call: "GET /disclosure/reporting-cycles/${cycle_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { cycle_v_new: $.data.version }
            - call: "POST /disclosure/documents"
              payload: { cycle_id: "${cycle_id}", doc_type: "PERIODIC_FILING", title: "Form 10-Q FY2026-Q2", author_member_id: "${fin_id}", expected_cycle_version: "${cycle_v_new}" }
              as: Controller
              as_user_id: "${fin_id}"
              captures: { doc_id: $.data.id }
            - call: "GET /disclosure/reporting-cycles/${cycle_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { cycle_v_after: $.data.version }
            - call: "POST /disclosure/documents"
              payload: { cycle_id: "${cycle_id}", doc_type: "EARNINGS_RELEASE", title: "Q2 Earnings Release", author_member_id: "${fin_id}", safe_harbor_present: true, expected_cycle_version: "${cycle_v_new}" }
              as: Controller
              as_user_id: "${fin_id}"
              expect_error: { http: 412, error_id: ERR_STALE_CYCLE_VERSION }
            - call: "GET /disclosure/documents"
              payload: { cycle_id: "${cycle_id}", limit: 10, offset: 0 }
              as: ComplianceAdmin
          assert:
            - "the create carrying ${cycle_v_old} returns HTTP 412 ERR_STALE_CYCLE_VERSION and no DraftDocument row is written"
            - "${cycle_v_new} == ${cycle_v_old} + 1 — the sub-certification assignment, which touches no document, is what invalidated the token"
            - "the create carrying ${cycle_v_new} returns 201 with status DRAFT, revision_round 0, tie_out_status NOT_STARTED and version 1"
            - "${cycle_v_after} == ${cycle_v_new} + 1: the document create itself increments the parent cycle's version"
            - "replaying ${cycle_v_new} for a second document returns 412 ERR_STALE_CYCLE_VERSION — one token, one write"
            - "the final document list holds exactly ONE row, so neither rejected create left a partial record"

      - name: stale_expected_document_version_blocks_a_tie_out_create_after_its_own_sibling_write
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[tieout-create-stale-document]
          - errors[ERR_STALE_DOCUMENT_VERSION]
          - endpoints[POST /disclosure/documents/{id}/tie-out-items]
          - calculations.tie_out_variance_and_tolerance_escalation
        distinguishing_aspect: |
          The second §1.2.1 rule is the self-invalidating case: creating a tie-out item bumps the parent
          DOCUMENT's version, so the token that just worked is stale for the very next line of the same
          schedule. This is exactly why the token may never be hardcoded — the client must re-read between
          consecutive appends. The rule is also the reason staleness matters here rather than being
          cosmetic: each create re-derives every sibling's effective_tolerance_bp from the document-wide
          tier multiplier, so a writer holding an old view would silently re-classify lines it never read.
        test_recipe:
          setup:
            - "An ADOPTED charter with a FINANCE and a LEGAL voting member; a cycle in CLOSE_OPEN; one DRAFT PERIODIC_FILING document whose version is captured at creation."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "OCC Document Charter", version_label: "2026.1", min_quorum_count: 2, required_functions: ["FINANCE", "LEGAL"] }
              as: ComplianceAdmin
              captures: { charter_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Nora Finance", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { fin_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Owen Legal", function: "LEGAL", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { legal_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/transitions"
              payload: { action: "ADOPT" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
            - call: "POST /disclosure/reporting-cycles"
              payload: { fiscal_period_label: "FY2026-Q2", form_type: "FORM_10Q", period_end_date: "2026-06-30", filer_status: "LARGE_ACCELERATED", materiality_base_amount: 10000000, charter_id: "${charter_id}", internal_buffer_days: 5 }
              as: ComplianceAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/milestones"
              payload: { kind: "CLOSE", planned_start_utc: "2026-08-01T00:00:00Z", planned_end_utc: "2026-08-03T00:00:00Z" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/transitions"
              payload: { action: "OPEN_CLOSE" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "GET /disclosure/reporting-cycles/${cycle_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { cycle_v: $.data.version }
            - call: "POST /disclosure/documents"
              payload: { cycle_id: "${cycle_id}", doc_type: "PERIODIC_FILING", title: "Form 10-Q FY2026-Q2", author_member_id: "${fin_id}", expected_cycle_version: "${cycle_v}" }
              as: Controller
              as_user_id: "${fin_id}"
              captures: { doc_id: $.data.id, doc_v0: $.data.version }
          trigger:
            - call: "POST /disclosure/documents/${doc_id}/tie-out-items"
              payload: { line_label: "Total revenue", reported_value: 4120000, source_record_value: 4120000, tolerance_bp: 25, preparer_member_id: "${fin_id}", expected_document_version: "${doc_v0}" }
              as: Controller
              as_user_id: "${fin_id}"
              captures: { to1_id: $.data.id }
            - call: "POST /disclosure/documents/${doc_id}/tie-out-items"
              payload: { line_label: "Operating income", reported_value: 1030000, source_record_value: 1030000, tolerance_bp: 40, preparer_member_id: "${fin_id}", expected_document_version: "${doc_v0}" }
              as: Controller
              as_user_id: "${fin_id}"
              expect_error: { http: 412, error_id: ERR_STALE_DOCUMENT_VERSION }
            - call: "GET /disclosure/documents/${doc_id}"
              payload: {}
              as: Controller
              as_user_id: "${fin_id}"
              captures: { doc_v1: $.data.version, tie_status_1: $.data.tie_out_status }
            - call: "POST /disclosure/documents/${doc_id}/tie-out-items"
              payload: { line_label: "Operating income", reported_value: 1030000, source_record_value: 1030000, tolerance_bp: 40, preparer_member_id: "${fin_id}", expected_document_version: "${doc_v1}" }
              as: Controller
              as_user_id: "${fin_id}"
              captures: { to2_id: $.data.id }
            - call: "GET /disclosure/documents/${doc_id}"
              payload: {}
              as: Controller
              as_user_id: "${fin_id}"
              captures: { doc_v2: $.data.version, tie_status_2: $.data.tie_out_status, tier_2: $.data.tie_out_tier_multiplier, variance_2: $.data.tie_out_total_variance_bp }
            - call: "GET /disclosure/tie-out-items"
              payload: { document_id: "${doc_id}", limit: 10, offset: 0 }
              as: Controller
              as_user_id: "${fin_id}"
          assert:
            - "the first append with ${doc_v0} succeeds; the second append reusing ${doc_v0} returns HTTP 412 ERR_STALE_DOCUMENT_VERSION"
            - "${doc_v1} == ${doc_v0} + 1 — the first append bumped the parent document itself, which is what made the token stale"
            - "the retry with ${doc_v1} succeeds and ${doc_v2} == ${doc_v1} + 1"
            - "${tie_status_1} == PASSED and ${tie_status_2} == PASSED with ${variance_2} == 0 and ${tier_2} == 1.00 — both lines match their source records exactly"
            - "the tie-out list holds exactly TWO rows, both MATCHED: the rejected append wrote nothing, so no third line and no duplicated Operating income line exists"

      - name: cascading_side_effects_across_five_hops_from_a_tie_out_break
        claim_type: cascading_side_effects
        grounds: [calculations.tie_out_variance_and_tolerance_escalation, state_machines.DraftDocument.APPROVED_to_CHANGES_REQUESTED]
        excluded_because:
          difficulty_instance: tie_out_break_on_approved_document_cascades_five_hops_to_revoked_certifications
          rationale: |
            The `cascading_side_effects` row asks for an N-level chain verified end to end with ordering
            sensitivity. That §1.8 instance walks the longest chain the scaffold declares — tie-out FAILED
            -> document APPROVED -> CHANGES_REQUESTED -> cycle FILING_READY -> REVIEW_OPEN -> every
            OfficerCertification SIGNED -> REVOKED — asserting each hop's row state and the cycle
            aggregates after it. Two further multi-hop chains are covered by
            material_event_reassessment_cascades_three_hops_and_reverses_certification_eligibility and
            seat_vacancy_cascades_four_hops_and_raises_coverage_by_shrinking_the_denominator, and the
            correction cascade with its compensating reversal by
            correction_rescission_reverses_the_deficiency_weight_and_the_restatement_stage_but_not_the_filing.

      - name: dual_variant_calculation_delta_on_switching_the_variant
        claim_type: dual_variant_calculation
        grounds: [calculations.cycle_milestone_slack]
        excluded_because:
          difficulty_instance: milestone_slack_calendar_versus_business_day_variant_divergence
          rationale: |
            The `dual_variant_calculation` row asks that both variants produce their expected results and
            that the delta on switching is correct. Both declared variant pairs are already driven from
            identical stored data in §1.8: cycle_milestone_slack CALENDAR_DAY versus BUSINESS_DAY (7 versus
            5 on one milestone, with only the business-day variant gating DECLARE_FILING_READY) in that
            instance, and correction_materiality_classification ROLLOVER versus IRON_CURTAIN (4.00 ->
            REVISION versus 5.83 -> RESTATEMENT) in
            correction_materiality_rollover_versus_iron_curtain_variant_divergence.

      - name: rate_threshold_trigger_at_the_coverage_boundary
        claim_type: rate_threshold_triggers
        grounds: [calculations.certification_coverage_pct]
        excluded_because:
          difficulty_instance: certification_coverage_weighted_sum_before_division_not_average_of_percentages
          rationale: |
            The only rate/threshold trigger in the scaffold is certification_coverage_pct against
            COVERAGE_REQUIRED_PCT (100.00), plus the severity and materiality tier cut-offs. That §1.8
            instance drives the coverage ratio across the boundary with weighted rows (61.11 under the
            pinned order versus 50.00 under the forbidden per-scope average) and shows the signature gate
            flipping from ERR_CERT_COVERAGE_INSUFFICIENT to accepted, while
            tie_out_variance_exactly_on_effective_tolerance_matches_and_one_bp_more_fails and
            filing_stamped_exactly_on_statutory_deadline_is_not_late pin the remaining `>=` / `>` cut-offs.

  # ===================================================================
  # SECTION 9 — CONSISTENCY MODEL (§1.0: consistency_model = immediate)
  # ===================================================================
  - section: consistency_model
    instances:

      - name: every_derived_field_is_visible_in_the_same_response_and_the_very_next_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.certification_coverage_pct
          - calculations.subcert_scope_weight
          - entities.DraftDocument.fields.qa_gate_status
          - entities.ReportingCycle.fields.open_material_event_count
        distinguishing_aspect: |
          `immediate` means every derived field and every cascade hop is already settled in the response of
          the call that caused it — there is no queue, no recompute-on-read and no eventual convergence.
          The probe therefore reads each aggregate from BOTH sides: the mutating response and the next GET
          must agree exactly, including the empty-set convention (coverage reads 0.00, never 100.00, while
          both rows are still PENDING) and the mid-way value 54.55, which only exists between the two
          submissions. Cross-entity derived state is checked the same way: a HIGH question flips the parent
          document's qa_gate_status to BLOCKED in the same request that creates the question, and a logged
          material event raises the grandparent cycle's open_material_event_count in the same request.
        test_recipe:
          setup:
            - "An ADOPTED charter with FINANCE, LEGAL and INVESTOR_RELATIONS voting members; a FY2026-Q2 FORM_10Q cycle in CLOSE_OPEN with a CLOSE milestone."
            - "Two PENDING sub-certifications: REVENUE (base weight 30) held by the FINANCE member and LEGAL_CONTINGENCY (base weight 25) held by the LEGAL member, both non-officers with exception_severity NONE, so total_assigned_scope_weight is 55.00."
            - "One DRAFT CALL_SCRIPT document authored by the INVESTOR_RELATIONS member with safe_harbor_present true and qa_gate_status CLEARED (zero questions)."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Consistency Charter", version_label: "2026.1", min_quorum_count: 3, required_functions: ["FINANCE", "LEGAL", "INVESTOR_RELATIONS"] }
              as: ComplianceAdmin
              captures: { charter_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Nora Finance", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { fin_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Owen Legal", function: "LEGAL", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { legal_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Ivy Relations", function: "INVESTOR_RELATIONS", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { ir_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/transitions"
              payload: { action: "ADOPT" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
            - call: "POST /disclosure/reporting-cycles"
              payload: { fiscal_period_label: "FY2026-Q2", form_type: "FORM_10Q", period_end_date: "2026-06-30", filer_status: "LARGE_ACCELERATED", materiality_base_amount: 10000000, charter_id: "${charter_id}", internal_buffer_days: 5 }
              as: ComplianceAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/milestones"
              payload: { kind: "CLOSE", planned_start_utc: "2026-08-01T00:00:00Z", planned_end_utc: "2026-08-03T00:00:00Z" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/transitions"
              payload: { action: "OPEN_CLOSE" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/sub-certifications"
              payload: { cycle_id: "${cycle_id}", member_id: "${fin_id}", scope_area: "REVENUE", due_utc: "2026-08-04T17:00:00Z" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
              captures: { sc_rev_id: $.data.id, sc_rev_weight: $.data.scope_weight }
            - call: "POST /disclosure/sub-certifications"
              payload: { cycle_id: "${cycle_id}", member_id: "${legal_id}", scope_area: "LEGAL_CONTINGENCY", due_utc: "2026-08-04T17:00:00Z" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
              captures: { sc_leg_id: $.data.id, sc_leg_weight: $.data.scope_weight }
            - call: "GET /disclosure/reporting-cycles/${cycle_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { cov_0: $.data.certification_coverage_pct, total_0: $.data.total_assigned_scope_weight, cycle_v: $.data.version }
            - call: "POST /disclosure/documents"
              payload: { cycle_id: "${cycle_id}", doc_type: "CALL_SCRIPT", title: "Q2 Earnings Call Script", author_member_id: "${ir_id}", safe_harbor_present: true, expected_cycle_version: "${cycle_v}" }
              as: InvestorRelations
              as_user_id: "${ir_id}"
              captures: { doc_id: $.data.id, gate_0: $.data.qa_gate_status }
          trigger:
            - call: "POST /disclosure/sub-certifications/${sc_rev_id}/transitions"
              payload: { action: "SUBMIT" }
              as: BusinessLeader
              as_user_id: "${fin_id}"
              captures: { sc_rev_status: $.data.status }
            - call: "GET /disclosure/reporting-cycles/${cycle_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { cov_1: $.data.certification_coverage_pct, total_1: $.data.total_assigned_scope_weight }
            - call: "POST /disclosure/sub-certifications/${sc_leg_id}/transitions"
              payload: { action: "SUBMIT" }
              as: BusinessLeader
              as_user_id: "${legal_id}"
              captures: { sc_leg_status: $.data.status }
            - call: "GET /disclosure/reporting-cycles/${cycle_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { cov_2: $.data.certification_coverage_pct, total_2: $.data.total_assigned_scope_weight }
            - call: "GET /disclosure/sub-certifications"
              payload: { cycle_id: "${cycle_id}", status: "SUBMITTED", limit: 10, offset: 0 }
              as: ComplianceAdmin
            - call: "POST /disclosure/documents/${doc_id}/qa-items"
              payload: { question_text: "Why did the warranty accrual assumption change this quarter?", topic: "MARGIN", risk_tier: "HIGH" }
              as: InvestorRelations
              as_user_id: "${ir_id}"
              captures: { qa_id: $.data.id, qa_status_0: $.data.status }
            - call: "GET /disclosure/documents/${doc_id}"
              payload: {}
              as: InvestorRelations
              as_user_id: "${ir_id}"
              captures: { gate_1: $.data.qa_gate_status }
            - call: "POST /disclosure/qa-items/${qa_id}/clear"
              payload: { clearance_note: "Cleared with a forward-looking statement qualifier." }
              as: LegalCounsel
              as_user_id: "${legal_id}"
              captures: { qa_status_1: $.data.status }
            - call: "GET /disclosure/documents/${doc_id}"
              payload: {}
              as: InvestorRelations
              as_user_id: "${ir_id}"
              captures: { gate_2: $.data.qa_gate_status }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/material-events"
              payload: { category: "LITIGATION_JUDGMENT", occurred_utc: "2026-07-20T00:00:00Z", discovered_utc: "2026-07-28T00:00:00Z", magnitude_amount: 800000, description: "Adverse judgment in a supplier dispute" }
              as: LegalCounsel
              as_user_id: "${legal_id}"
              captures: { ev_id: $.data.id, ev_score: $.data.severity_score, ev_status: $.data.assessment_status }
            - call: "GET /disclosure/reporting-cycles/${cycle_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { open_events: $.data.open_material_event_count }
          assert:
            - "${sc_rev_weight} == 30.00 and ${sc_leg_weight} == 25.00 straight out of the creating responses, and ${total_0} == 55.00 with ${cov_0} == 0.00 — the empty-numerator convention, not 100.00"
            - "${sc_rev_status} == SUBMITTED, and the very next read gives ${cov_1} == 54.55 (30.00 / 55.00 * 100 rounded once) with ${total_1} == 55.00 unchanged"
            - "${sc_leg_status} == SUBMITTED and ${cov_2} == 100.00 with ${total_2} == 55.00 — no lag, no recompute-on-demand, and no drift in the conserved total across two submissions"
            - "the filtered list returns exactly 2 SUBMITTED rows in the same breath, so list projections are as fresh as the by-id reads"
            - "${gate_0} == CLEARED on the freshly created script (zero questions), ${qa_status_0} == BLOCKED for the HIGH question, and ${gate_1} == BLOCKED — the parent document's derived gate moved inside the child's creating request"
            - "${qa_status_1} == CLEARED and ${gate_2} == CLEARED immediately afterwards"
            - "${ev_score} == 8.00 (800000 / 10000000 * 100) with ${ev_status} == UNASSESSED, and ${open_events} == 1 on the grandparent cycle in the very next read"
