    output: ReductionTarget[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_INVALID_PAGINATION]

  - method: GET
    path: /reduction-targets/{id}/attainment
    purpose: Computed read exposing BOTH variant results side by side for the same target, so the dual-variant divergence is directly observable.
