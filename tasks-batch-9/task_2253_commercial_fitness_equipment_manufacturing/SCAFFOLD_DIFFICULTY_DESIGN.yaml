- rule_id: non_linear_state_machine
  instances:
  - name: revision_rework_loop_required_between_test_failed_and_qualify
    grounds:
    - state_machines.ModelRevision.IN_TESTING_to_TEST_FAILED
    - state_machines.ModelRevision.TEST_FAILED_to_DRAFT
    - state_machines.ModelRevision.DRAFT_to_IN_TESTING
    - state_machines.ModelRevision.IN_TESTING_to_QUALIFIED
    - entities.DurabilityTestRun.fields.superseded_by_rework
    - entities.ModelRevision.fields.rework_count
    - validations[priority=11]
    - errors[ERR_INVALID_STATE_TRANSITION]
    distinguishing_aspect: 'TEST_FAILED has no edge to QUALIFIED: the revision must traverse the cyclic TEST_FAILED -> DRAFT -> IN_TESTING -> QUALIFIED loop, and the rework edge zeroes both cycle variants
      by stamping superseded_by_rework on the pre-rework runs, so the final QUALIFIED row shows verified_cycle_count == 500000 from the single post-rework run rather than 850000 from all three.'
    test_recipe:
      setup:
      - Logical clock at the default 2026-08-01T00:00:00Z throughout.
      - T900 Treadmill is FULL_COMMERCIAL, so revision T900-R1 has min_required_cycles 500000.
      - 'T900-R1 has two COMPLETED runs: PASSED 200000 then FAILED at 150000, so verified_cycle_count == 350000 and the revision was pushed to TEST_FAILED.'
      - rework_count is 0 and REWORK_LIMIT is 3.
      - No run is RESERVED or RUNNING.
      setup_api_calls:
      - call: POST /equipment-models
        payload: {name: T900 Treadmill, category: CARDIO, duty_class: FULL_COMMERCIAL, unit_list_price_cents: 479950, shipping_weight_kg: 212.5, allowed_finish_codes: [GRAPHITE, ARCTIC_WHITE, CLUB_RED]}
        as: ProductEngineer
        captures: {m1: $.data.id, m1_v: $.data.version}
      - call: POST /model-revisions
        payload: {equipment_model_id: '${m1}', revision_code: T900-R1, target_cycle_count: 600000, expected_equipment_model_version: '${m1_v}'}
        as: ProductEngineer
        captures: {r1: $.data.id}
      - call: POST /model-revisions/${r1}/submit-for-testing
        payload: {}
        as: ProductEngineer
      - call: POST /test-rigs
        payload: {name: RIG-A, parallel_station_count: 2, supported_duty_classes: [FULL_COMMERCIAL, INSTITUTIONAL]}
        as: ProductEngineer
        captures: {g1: $.data.id}
      - call: POST /test-runs
        payload: {model_revision_id: '${r1}', test_rig_id: '${g1}', window_start: '2026-08-02T00:00:00Z', window_end: '2026-08-06T12:00:00Z', target_cycles: 300000}
        as: ProductEngineer
        captures: {x1: $.data.id}
      - call: POST /test-runs/${x1}/start
        payload: {}
        as: ProductEngineer
      - call: POST /test-runs/${x1}/complete
        payload: {outcome: PASSED, achieved_cycles: 200000}
        as: ProductEngineer
      - call: POST /test-runs
        payload: {model_revision_id: '${r1}', test_rig_id: '${g1}', window_start: '2026-08-06T00:00:00Z', window_end: '2026-08-10T12:00:00Z', target_cycles: 300000}
        as: ProductEngineer
        captures: {x2: $.data.id}
      - call: POST /test-runs/${x2}/start
        payload: {}
        as: ProductEngineer
      - call: POST /test-runs/${x2}/complete
        payload: {outcome: FAILED, failure_cycle_count: 150000}
        as: ProductEngineer
      - call: POST /model-revisions/${r1}/qualify
        payload: {}
        as: ProductEngineer
        captures: {err_qualify: $.data.error_id}
      - call: POST /model-revisions/${r1}/rework
        payload: {rework_note: frame weld fixture revised}
        as: ProductEngineer
      - call: GET /model-revisions/${r1}/qualification-report
        payload: {}
        as: ProductEngineer
      - call: POST /model-revisions/${r1}/submit-for-testing
        payload: {}
        as: ProductEngineer
      - call: POST /test-runs
        payload: {model_revision_id: '${r1}', test_rig_id: '${g1}', window_start: '2026-08-10T00:00:00Z', window_end: '2026-08-14T12:00:00Z', target_cycles: 500000}
        as: ProductEngineer
        captures: {x3: $.data.id}
      - call: POST /test-runs/${x3}/start
        payload: {}
        as: ProductEngineer
      - call: POST /test-runs/${x3}/complete
        payload: {outcome: PASSED, achieved_cycles: 500000}
        as: ProductEngineer
      trigger:
      - call: POST /model-revisions/${r1}/qualify
        payload: {}
        as: ProductEngineer
      - call: GET /model-revisions/${r1}
        payload: {}
        as: ProductEngineer
      assert:
      - The setup qualify attempt from TEST_FAILED returned 409 with error_id ERR_INVALID_STATE_TRANSITION
      - POST /model-revisions/${r1}/rework returned 200 and moved ModelRevision.${r1}.status to DRAFT with rework_count == 1
      - DurabilityTestRun.${x1}.superseded_by_rework == true and DurabilityTestRun.${x2}.superseded_by_rework == true
      - Immediately after the rework, GET /model-revisions/${r1}/qualification-report returned verified_cycle_count 0, projected_cycle_count 0, completed_run_count 0
      - POST /model-revisions/${r1}/qualify returns 200 and ModelRevision.${r1}.status == QUALIFIED
      - ModelRevision.${r1}.verified_cycle_count == 500000 (only DurabilityTestRun.${x3} counts)
      - ModelRevision.${r1}.projected_cycle_count == 500000
      - ModelRevision.${r1}.verified_cycle_count != 850000 (the pre-rework evidence is never re-admitted)
      - ModelRevision.${r1}.rework_count == 1 and ModelRevision.${r1}.qualified_at == 2026-08-01T00:00:00Z
      - EquipmentModel.${m1}.lifecycle_status == PRE_RELEASE and EquipmentModel.${m1}.released_revision_count == 0
