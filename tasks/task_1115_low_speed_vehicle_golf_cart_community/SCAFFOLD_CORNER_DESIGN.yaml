      - name: dispatch_requires_eligible_holder
        claim_type: violation_to_error
        grounds: ["errors[ERR_HOLDER_NOT_ELIGIBLE]", "validations[priority=8]"]
        distinguishing_aspect: "ERR_HOLDER_NOT_ELIGIBLE trigger: a PENDING_VERIFICATION holder (never verified) cannot book a fleet dispatch even for an AVAILABLE vehicle and a free window."
        test_recipe:
