          setup:
            - "Clock 2026-08-01; SMALL area capacity 4; member A active with VERIFIED LARGE dog and membership; A then suspended via confirmed SEVERE report"
          setup_api_calls:
            - call: "POST /dog-park/_clock/set_current_utc"
