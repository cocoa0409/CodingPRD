              as: Author
              as_user_id: "${au_id}"
              captures: { m_id: $.data.id }
            - call: "GET /journals/${j_id}"
              as: SystemAdmin
              captures: { j_recv_before: $.data.apc_receivable_cents, j_waived_before: $.data.apc_waived_cents }
            - call: "GET /manuscripts/${m_id}"
              as: ProductionStaff
              captures: { m_v: $.data.version }
            - call: "POST /manuscripts/${m_id}/apc-invoices"
