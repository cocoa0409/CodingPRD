    roles: [EnrollmentOfficer, PlatformAdmin]
    code: 201
    input: [student_id, attendance_date, synchronous_minutes, engagement_check_ins]
    output: AttendanceRecord
    side_effects:
      - "compute attendance_status via calculations.attendance_determination"
      - "if attendance_status == ABSENT_UNEXCUSED: recompute student.truancy_unexcused_count and student.truancy_flag"
  - method: GET
    path: /vks/attendance/{id}
    description: "Fetch one attendance record"
    roles: [PlatformAdmin, EnrollmentOfficer]
    code: 200
    input: []
    output: AttendanceRecord
    side_effects: []
  - method: GET
    path: /vks/students/{id}/attendance
    description: "List attendance records of a student"
    roles: [PlatformAdmin, EnrollmentOfficer]
    code: 200
    input: ['limit?', 'offset?', 'attendance_status?']
    output: AttendanceRecord[]
    side_effects: []
  - method: POST
    path: /vks/attendance/{id}/excuse
