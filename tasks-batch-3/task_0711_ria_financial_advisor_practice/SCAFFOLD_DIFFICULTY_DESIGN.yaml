  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_segregation_on_ips_approve
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - state_machines.InvestmentPolicyStatement.PROPOSED_to_APPROVED
        distinguishing_aspect: |
          On POST /investment-policy-statements/{id}/state action=APPROVE against a DRAFT IPS submitted by the
          proposing advisor (so both the state precondition priority 5 and the segregation-of-duties priority 6
          would fail), the lower-numbered state check wins: ERR_INVALID_STATE (409), not ERR_SEGREGATION_OF_DUTIES.
          Error-category pair = state vs business_referential.
        test_recipe:
          setup:
            - "A DRAFT IPS (never proposed) for a KYC-verified client, targeting a published portfolio."
          setup_api_calls:
            - call: "POST /portfolios"
              payload: { name: "Bal", model_equity_pct: 60, target_weights: [ {sleeve: "EQ", target_pct: 60}, {sleeve: "FI", target_pct: 40} ] }
              as: Advisor
              captures: { pf_id: $.data.id }
            - call: "POST /portfolios/${pf_id}/publish"
              payload: {}
              as: Advisor
            - call: "POST /fee-schedules"
              payload: { name: "Std", tiers: [ {upper_bound_cents: null, annual_rate_bps: 100} ], minimum_annual_fee_cents: 0 }
              as: BillingAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /households"
              payload: { name: "HH", lead_advisor_id: "adv-1", fee_schedule_id: "${sched_id}" }
              as: Advisor
              captures: { hh_id: $.data.id }
            - call: "POST /clients"
              payload: { household_id: "${hh_id}", full_name: "C", date_of_birth: "1980-01-01", risk_capacity_score: 60, risk_tolerance_score: 60 }
              as: Advisor
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/state"
              payload: { action: "VERIFY_KYC" }
              as: Advisor
            - call: "POST /investment-policy-statements"
              payload: { client_id: "${c_id}", target_portfolio_id: "${pf_id}", max_equity_pct: 80, drift_tolerance_bps: 500 }
              as: Advisor
              captures: { ips_id: $.data.id }
          trigger:
            - call: "POST /investment-policy-statements/${ips_id}/state"
              payload: { action: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == ERR_INVALID_STATE (state priority 5 beats segregation priority 6)"

      - name: existence_beats_mandate_on_ips_propose
        grounds:
          - validations[priority=4]
          - validations[priority=7]
          - state_machines.InvestmentPolicyStatement.DRAFT_to_PROPOSED
        distinguishing_aspect: |
          Creating an IPS that references a non-existent target_portfolio_id is rejected at body-FK existence
          (priority 4, ERR_REFERENCE_NOT_FOUND 422) before any mandate/publish check (priority 7,
          ERR_IPS_MANDATE_VIOLATION) can run. Error-category pair = existence vs business_safety — distinct
          pairing from the state-vs-referential conflict above.
        test_recipe:
          setup:
            - "A KYC-verified client; no portfolio is created, so target_portfolio_id is a fabricated non-existent id."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { name: "Std", tiers: [ {upper_bound_cents: null, annual_rate_bps: 100} ], minimum_annual_fee_cents: 0 }
              as: BillingAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /households"
              payload: { name: "HH", lead_advisor_id: "adv-1", fee_schedule_id: "${sched_id}" }
              as: Advisor
              captures: { hh_id: $.data.id }
            - call: "POST /clients"
              payload: { household_id: "${hh_id}", full_name: "C", date_of_birth: "1980-01-01", risk_capacity_score: 60, risk_tolerance_score: 60 }
              as: Advisor
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/state"
              payload: { action: "VERIFY_KYC" }
              as: Advisor
          trigger:
            - call: "POST /investment-policy-statements"
              payload: { client_id: "${c_id}", target_portfolio_id: "00000000-0000-4000-8000-000000000000", max_equity_pct: 10, drift_tolerance_bps: 500 }
              as: Advisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 and data.error_id == ERR_REFERENCE_NOT_FOUND (existence priority 4 beats mandate priority 7)"

