              as: LicensingManager
              captures: {p2: $.data.id}
            - call: "POST /legal-research/accounts"
              payload: {org_name: "OC Co", account_type: LAW_FIRM, cost_recovery_enabled: false}
              as: LicensingManager
              captures: {a_id: $.data.id}
            - call: "POST /legal-research/subscriptions"
              payload: {account_id: "${a_id}", plan_id: "${p1}", period_start: "2026-09-01", period_end: "2026-10-01", seats_total: 2}
              as: LicensingManager
              captures: {s_id: $.data.id}
