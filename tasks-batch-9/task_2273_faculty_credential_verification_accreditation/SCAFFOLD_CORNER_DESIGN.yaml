            - *c_roster_df_gen
          assert:
            - "CourseAssignment.${asn_m_df_id}.status == SUPERSEDED with superseded_by_assignment_id == ${asn_x_df_id}; CourseAssignment.${asn_x_id}.status == WITHDRAWN"
            - "FacultyRoster.${roster_df_id}.total_assignment_count == 1 and distinct_faculty_count == 1 — three assignment rows exist but two are in terminal statuses"
            - "FacultyRoster.${roster_df_id}.flagged_exception_count == 1, terminal_qualified_headcount == 0, credit_hours_total == 3, credit_hours_terminal_qualified == 0"
            - "FacultyRoster.${roster_df_id}.adequacy_ratio_snapshot == 0.0000 (HEADCOUNT 0/1) with blocking_reason_codes == [EXCEPTIONS_OUTSTANDING, ADEQUACY_BELOW_MINIMUM] in exactly that order and certification_readiness == BLOCKED"
            - "FacultyMember.${fac_m_id}.assigned_credit_hours == 0 and FacultyMember.${fac_x_id}.assigned_credit_hours == 3 — the ledger follows the same exclusion rule"
            - "Program.${prog_df_id}.unqualified_assignment_count == 1"

      - name: adequacy_ratio_rounds_to_four_decimals_on_the_credit_hour_basis
        claim_type: precision
        grounds:
          - calculations.program_faculty_adequacy
          - endpoints[GET /programs/{programId}/adequacy]
          - entities.FacultyRoster.fields.adequacy_ratio_snapshot
        distinguishing_aspect: |
          A non-terminating quotient pins the declared precision: 1 terminal credit hour out of 3
          is 0.333333..., which must be stored and reported as exactly 0.3333 (four decimals,
          round_half_up) — not 0.33, not 0.3333333 — and the read endpoint must expose the raw
          numerator and denominator that produced it.
        test_recipe:
          setup:
            - "The COURSEWORK_18 / CREDIT_HOUR_COVERAGE program (min_terminal_ratio 0.60) has a 1-credit Journalism section on WEDNESDAY and a 2-credit Journalism section on THURSDAY."
            - "Morgan Ellis (Journalism MASTERS) holds the 1-credit section and is VERIFIED_QUALIFIED / TERMINAL_DEGREE; Alex Stone (Public Relations MASTERS only) holds the 2-credit section and is EXCEPTION_FLAGGED."
            - "The roster for (COURSEWORK_18 program, 2026FA) has been generated."
          setup_api_calls:
            - *c_clock
            - *c_comm
            - *c_journ
            - *c_pr
            - *c_prog_df
            - *c_prog_cw
            - *c_term
            - *c_term_open
            - *c_fac_m
            - *c_rec_m_journ
            - *c_tr_m_journ
            - *c_vf_m_journ
            - *c_fac_x
            - *c_rec_x_pr
            - *c_tr_x_pr
            - *c_vf_x_pr
            - &c_sec_cw_1cr
              call: "POST /course-sections"
              payload: { course_code: "JOUR190", title: "Newsroom Lab", program_id: "${prog_cw_id}", term_id: "${term_id}", discipline_id: "${journ_id}", course_level: LOWER_DIVISION, credit_hours: 1, delivery_mode: IN_PERSON, building_code: "HALL-A", meeting_days: ["WE"], meeting_start_minute: 540, meeting_end_minute: 600 }
              as: ProgramDean
              as_user_id: "${prog_cw_id}"
              captures: { sec_cw_1cr_id: $.data.id, sec_cw_1cr_v: $.data.version }
            - &c_sec_cw_2cr
              call: "POST /course-sections"
              payload: { course_code: "JOUR191", title: "Media Ethics", program_id: "${prog_cw_id}", term_id: "${term_id}", discipline_id: "${journ_id}", course_level: LOWER_DIVISION, credit_hours: 2, delivery_mode: IN_PERSON, building_code: "HALL-A", meeting_days: ["TH"], meeting_start_minute: 540, meeting_end_minute: 660 }
              as: ProgramDean
              as_user_id: "${prog_cw_id}"
              captures: { sec_cw_2cr_id: $.data.id, sec_cw_2cr_v: $.data.version }
            - &c_asn_m_1cr
              call: "POST /course-assignments"
              payload: { course_section_id: "${sec_cw_1cr_id}", faculty_member_id: "${fac_m_id}", assignment_role: INSTRUCTOR_OF_RECORD, expected_section_version: "${sec_cw_1cr_v}" }
              as: ProgramDean
              as_user_id: "${prog_cw_id}"
              captures: { asn_m_1cr_id: $.data.id }
            - &c_asn_x_2cr
              call: "POST /course-assignments"
              payload: { course_section_id: "${sec_cw_2cr_id}", faculty_member_id: "${fac_x_id}", assignment_role: INSTRUCTOR_OF_RECORD, expected_section_version: "${sec_cw_2cr_v}" }
              as: ProgramDean
              as_user_id: "${prog_cw_id}"
              captures: { asn_x_2cr_id: $.data.id }
            - &c_roster_cw
              call: "POST /faculty-rosters"
              payload: { program_id: "${prog_cw_id}", term_id: "${term_id}" }
              as: AccreditationLiaison
              as_user_id: "liaison-01"
              captures: { roster_cw_id: $.data.id }
            - &c_roster_cw_gen
              call: "POST /faculty-rosters/${roster_cw_id}/generate"
              payload: {}
              as: AccreditationLiaison
