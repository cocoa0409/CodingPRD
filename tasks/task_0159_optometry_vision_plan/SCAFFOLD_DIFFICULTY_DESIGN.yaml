            - call: "POST /encounters/${enc0_id}/finalize"
              payload: {}
              as: Optometrist
              as_user_id: "${od_id}"
            - call: "POST /recall-reminders"
              payload: { patient_id: "${pat_id}", channel: "EMAIL" }
              as: FrontDesk
              captures: { rem_id: $.data.id }
            - call: "POST /recall-reminders/${rem_id}/send"
