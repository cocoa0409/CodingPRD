  # =============================================================================
  # RULE 9 — compensating_invariant
  # Differentiation required by §0.5: DIFFERENT conserved quantities. Instance 1 conserves
  # Destination.remaining_daily_hash_quota (hash units, a rechargeable ledger) across a
  # dispatch/pause/resume/pause cycle; instance 2 conserves SUM(Profile.lifetime_value_cents) over
  # non-MERGED_AWAY profiles (money, a redistributed total) across a confirmed merge.
  # =============================================================================
  - rule_id: compensating_invariant
    instances:
      - name: hash_quota_conserved_by_dispatch_pause_resume_cycle
        grounds:
          - entities.Destination.fields.remaining_daily_hash_quota
          - state_machines.Activation.DISPATCHED_to_PAUSED
          - state_machines.Activation.PAUSED_to_ACTIVE
          - endpoints[POST /cdp/activations/{activationId}/pause]
          - endpoints[POST /cdp/activations/{activationId}/resume]
        distinguishing_aspect: |
          Conserved quantity: HASH UNITS. Destination.remaining_daily_hash_quota must satisfy
          remaining == daily_hash_quota - SUM(dispatched_hash_count over activations in
          {DISPATCHED, ACTIVE, UNDERPERFORMING}) at every step, so a full
          dispatch -> pause -> resume -> pause cycle returns it to exactly 500 with no drift and
          without any date-based quota reset.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z and left there, so no retention run and no UTC-date rollover can reset the quota."
            - "One SourceSystem QUOTA_SRC and one PROMOTED batch of two fully valid records in postal 10001, each with an EMAIL/MARKETING OPT_IN signal, so two RESOLVED / NORMAL profiles with EMAIL activatable exist."
            - "One ACTIVE EMAIL Destination DEST_QUOTA with daily_hash_quota 500, min_audience_size 1, min_match_rate 0.10 and cooldown_minutes 0."
            - "One APPROVED Segment SEG_QUOTA with criteria postal_code EQ 10001 (member_count 2)."
            - "One DRAFT Activation on DEST_QUOTA for the window 2026-08-02T00:00:00Z..2026-08-02T02:00:00Z."
