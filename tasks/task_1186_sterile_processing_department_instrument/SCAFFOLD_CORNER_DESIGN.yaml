  - section: calculations
    instances:
      - name: loaner_due_by_tier_boundary
        claim_type: threshold
        grounds:
          - "calculations.loaner_intake_deadline"
          - "entities.LoanerSet.fields.due_by"
        distinguishing_aspect: "The BULK_THRESHOLD 10 boundary: tray_count 9 yields the 24h lead (due_by 2026-05-19T12:00:00Z) while tray_count 10 yields the 48h lead (due_by 2026-05-18T12:00:00Z) for the same case start."
        test_recipe:
          setup: ["case CLT with scheduled_start_at 2026-05-20T12:00:00Z"]
          setup_api_calls:
            - { call: "POST /spd/or-cases", payload: { case_number: "C-LT", surgeon: "Dr L", scheduled_start_at: "2026-05-20T12:00:00Z", scheduled_end_at: "2026-05-20T14:00:00Z", priority: "ELECTIVE" }, as: OrScheduler, captures: { clt: "$.data.id" } }
          trigger:
            - { call: "POST /spd/loaner-sets", payload: { vendor: "VendorMed", case_id: "${clt}", tray_count: 9 }, as: OrScheduler, captures: { d9: "$.data.due_by" } }
            - { call: "POST /spd/loaner-sets", payload: { vendor: "VendorMed", case_id: "${clt}", tray_count: 10 }, as: OrScheduler, captures: { d10: "$.data.due_by" } }
          assert:
            - "d9 == 2026-05-19T12:00:00Z (24h standard lead, 9 < 10)"
            - "d10 == 2026-05-18T12:00:00Z (48h bulk lead, 10 >= 10)"

      - name: loaner_receive_exactly_at_due_is_on_time
        claim_type: boundary_edge
        grounds:
          - "calculations.loaner_intake_deadline"
          - "state_machines.LoanerSet.BOOKED_to_LATE_RECEIVED"
          - "entities.LoanerSet.fields.received_late"
        distinguishing_aspect: "The lateness comparison is strict: receive at now == due_by lands RECEIVED (received_late false); one minute later lands LATE_RECEIVED (received_late true)."
        test_recipe:
          setup: ["technician A; case CLR (start 2026-05-10T09:00:00Z); loaners LA and LB (tray_count 2 each, due_by 2026-05-09T09:00:00Z)"]
          setup_api_calls:
            - { call: "POST /spd/technicians", payload: { name: "Tech A", certification_level: 2, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { ta: "$.data.id" } }
            - { call: "POST /spd/or-cases", payload: { case_number: "C-LR", surgeon: "Dr L", scheduled_start_at: "2026-05-10T09:00:00Z", scheduled_end_at: "2026-05-10T10:00:00Z", priority: "ELECTIVE" }, as: OrScheduler, captures: { clr: "$.data.id" } }
            - { call: "POST /spd/loaner-sets", payload: { vendor: "VendorMed", case_id: "${clr}", tray_count: 2 }, as: OrScheduler, captures: { la: "$.data.id" } }
            - { call: "POST /spd/loaner-sets", payload: { vendor: "VendorMed", case_id: "${clr}", tray_count: 2 }, as: OrScheduler, captures: { lb: "$.data.id" } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-09T09:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /spd/loaner-sets/${la}/receive", as: SpdTechnician, as_user_id: "${ta}", captures: { sa: "$.data.status", la1: "$.data.received_late" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-09T09:01:00Z" }, as: FacilityAdmin }
            - { call: "POST /spd/loaner-sets/${lb}/receive", as: SpdTechnician, as_user_id: "${ta}", captures: { sb: "$.data.status", lb1: "$.data.received_late" } }
          assert:
            - "At now == due_by: sa == RECEIVED and la1 == false (equality is on time)"
            - "At now == due_by + 60s: sb == LATE_RECEIVED and lb1 == true"

