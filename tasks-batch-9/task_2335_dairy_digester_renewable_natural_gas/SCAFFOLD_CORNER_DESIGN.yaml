        grounds:
          - validations[priority=240]
          - errors[ERR_RESERVE_TARGET_EXCEEDED]
          - entities.DigesterFacility.fields.reserve_balance_cents
        distinguishing_aspect: >
          One rule carries two clauses under a single error id: an over-funding of
          4500000 against a 4000000 target is rejected, and so is a zero-cent deposit,
          and neither attempt moves reserve_balance_cents off 0.
        test_recipe:
          setup:
            - "Canonical plant with an unfunded reserve (target 4000000 cents, balance 0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
