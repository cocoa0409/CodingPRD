scaffold_difficulty_design:

  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: project_cost_estimate_vs_actual_divergence
        grounds:
          - calculations.project_cost
          - entities.ResearchProject.fields.estimated_cost_cents
          - entities.ResearchProject.fields.actual_cost_cents
        distinguishing_aspect: |
          On ResearchProject: the estimate variant sums RecordSearch.estimated_hours (planned work)
          while the actual variant sums ACTIVE billable TimeEntry.hours (logged work), so the same
          project yields estimated_cost_cents 174000 != actual_cost_cents 158000.
        test_recipe:
          setup:
            - "BASIC_PACKAGE project, package_price_cents 150000, budget_hours 2, ACTIVE"
            - "one COMPLETED RecordSearch with estimated_hours 5"
            - "one ACTIVE billable TimeEntry of 3 hours"
          setup_api_calls:
            - call: "POST /genealogy/clients"
              payload: { name: "Alice Client", email: "alice@x.com", tier: "STANDARD" }
              as: ProjectManager
              captures: { client_id: $.data.id }
            - call: "POST /genealogy/researchers"
              payload: { name: "Rob Researcher", email: "rob@x.com", hourly_rate_cents: 9000 }
              as: ProjectManager
              captures: { researcher_id: $.data.id }
            - call: "POST /genealogy/projects"
              payload: { client_id: "${client_id}", lead_researcher_id: "${researcher_id}", title: "Smith line", objective: "Trace Smith paternal line", package_type: "BASIC_PACKAGE", package_price_cents: 150000, budget_hours: 2, target_person_count: 1 }
              as: ProjectManager
              captures: { project_id: $.data.id }
            - call: "POST /genealogy/projects/${project_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /genealogy/record-searches"
              payload: { project_id: "${project_id}", repository_name: "State Archive", search_terms: "Smith 1880", estimated_hours: 5 }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { search_id: $.data.id }
            - call: "POST /genealogy/record-searches/${search_id}/complete"
              payload: { outcome: "COMPLETED", result_summary: "Found census entry" }
              as: Researcher
              as_user_id: "${researcher_id}"
            - call: "POST /genealogy/time-entries"
              payload: { project_id: "${project_id}", hours: 3, activity_type: "RESEARCH", billable: true }
              as: Researcher
              as_user_id: "${researcher_id}"
          trigger:
            - call: "GET /genealogy/projects/${project_id}"
              payload: {}
              as: ProjectManager
          assert:
            - "ResearchProject.${project_id}.estimated_cost_cents == 174000"
            - "ResearchProject.${project_id}.actual_cost_cents == 158000"
            - "ResearchProject.${project_id}.estimated_cost_cents != ResearchProject.${project_id}.actual_cost_cents"

      - name: person_confidence_provisional_vs_verified_divergence
        grounds:
          - calculations.person_confidence
          - entities.Person.fields.provisional_confidence
          - entities.Person.fields.confidence_score
        distinguishing_aspect: |
          On Person (different entity domain from project cost): provisional variant counts all
          non-disputed citations while verified variant counts only VERIFIED citations, so a person
          with 1 VERIFIED PRIMARY + 1 UNVERIFIED SECONDARY has provisional_confidence 0.83 but
          confidence_score 0.50.
        test_recipe:
          setup:
            - "ACTIVE project with a COMPLETED search and a DRAFT person"
            - "citation A: PRIMARY, VERIFIED; citation B: SECONDARY, UNVERIFIED"
          setup_api_calls:
            - call: "POST /genealogy/clients"
              payload: { name: "C", email: "c2@x.com" }
              as: ProjectManager
              captures: { client_id: $.data.id }
            - call: "POST /genealogy/researchers"
              payload: { name: "R", email: "r2@x.com", hourly_rate_cents: 9000 }
              as: ProjectManager
              captures: { researcher_id: $.data.id }
            - call: "POST /genealogy/projects"
              payload: { client_id: "${client_id}", lead_researcher_id: "${researcher_id}", title: "P2", objective: "obj", package_type: "BASIC_PACKAGE", package_price_cents: 100000, budget_hours: 10 }
              as: ProjectManager
              captures: { project_id: $.data.id }
            - call: "POST /genealogy/projects/${project_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /genealogy/persons"
              payload: { project_id: "${project_id}", full_name: "John Smith" }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { person_id: $.data.id }
            - call: "POST /genealogy/record-searches"
              payload: { project_id: "${project_id}", repository_name: "Archive", search_terms: "Smith", estimated_hours: 1 }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { search_id: $.data.id }
            - call: "POST /genealogy/record-searches/${search_id}/complete"
              payload: { outcome: "COMPLETED" }
              as: Researcher
              as_user_id: "${researcher_id}"
            - call: "POST /genealogy/citations"
              payload: { record_search_id: "${search_id}", person_id: "${person_id}", citation_text: "Birth record", source_type: "VITAL_RECORD", quality: "PRIMARY" }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { cit_a_id: $.data.id }
            - call: "POST /genealogy/citations/${cit_a_id}/verify"
              payload: {}
              as: Researcher
              as_user_id: "${researcher_id}"
            - call: "POST /genealogy/citations"
              payload: { record_search_id: "${search_id}", person_id: "${person_id}", citation_text: "Census", source_type: "CENSUS", quality: "SECONDARY" }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { cit_b_id: $.data.id }
          trigger:
            - call: "GET /genealogy/persons/${person_id}"
              payload: {}
              as: ProjectManager
          assert:
            - "Person.${person_id}.provisional_confidence == 0.83"
            - "Person.${person_id}.confidence_score == 0.50"

  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: milestone_invoice_amount_tier_surcharge_cap_mode_a
        grounds:
          - calculations.milestone_invoice_amount
          - entities.Milestone.fields.invoiced_amount_cents
          - entities.Client.fields.tier
          - entities.ResearchProject.fields.priority
        distinguishing_aspect: |
          Mode (a) non-linear formula with 3 inputs and conditional branches + min cap:
          invoiced_amount_cents = min(round_half_up(base*(1-tier_discount)) + rush_surcharge,
          round_half_up(base*1.5)). With base 100000, client.tier PREMIUM (0.10), project.priority
          RUSH: 90000 + 5000 = 95000, capped by 150000 -> 95000.
        test_recipe:
          setup:
            - "PREMIUM client, RUSH project, milestone base 100000 readied via accepted deliverable"
          setup_api_calls:
            - call: "POST /genealogy/clients"
              payload: { name: "Premium C", email: "prem@x.com", tier: "PREMIUM" }
              as: ProjectManager
              captures: { client_id: $.data.id }
            - call: "POST /genealogy/researchers"
              payload: { name: "R3", email: "r3@x.com", hourly_rate_cents: 9000 }
              as: ProjectManager
              captures: { researcher_id: $.data.id }
            - call: "POST /genealogy/projects"
              payload: { client_id: "${client_id}", lead_researcher_id: "${researcher_id}", title: "P3", objective: "obj", package_type: "BASIC_PACKAGE", package_price_cents: 100000, budget_hours: 10, priority: "RUSH" }
              as: ProjectManager
              captures: { project_id: $.data.id }
            - call: "POST /genealogy/projects/${project_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /genealogy/milestones"
              payload: { project_id: "${project_id}", title: "M1", amount_cents: 100000, sequence_no: 1 }
              as: ProjectManager
              captures: { milestone_id: $.data.id }
            - call: "POST /genealogy/deliverables"
              payload: { project_id: "${project_id}", deliverable_type: "RESEARCH_REPORT", milestone_id: "${milestone_id}" }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { deliverable_id: $.data.id }
            - call: "POST /genealogy/deliverables/${deliverable_id}/submit"
              payload: {}
              as: Researcher
              as_user_id: "${researcher_id}"
            - call: "POST /genealogy/deliverables/${deliverable_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /genealogy/milestones/${milestone_id}/invoice"
              payload: {}
              as: ProjectManager
          assert:
            - "Milestone.${milestone_id}.invoiced_amount_cents == 95000"
            - "Milestone.${milestone_id}.status == INVOICED"

      - name: project_billable_amount_per_milestone_rounding_mode_b
        grounds:
          - calculations.project_billable_amount
          - entities.Milestone.fields.line_total_cents
          - entities.ResearchProject.fields.billable_amount_cents
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: agency fee is rounded per milestone THEN
          summed. Two milestones each invoiced 12340 give fee round_half_up(925.5)=926, line 13266,
          billable 26532 -- whereas round_half_up(sum(24680)*0.075)=1851 gives 26531. The scaffold
          pins per-milestone rounding, so billable_amount_cents == 26532.
        test_recipe:
          setup:
            - "STANDARD client, STANDARD project, two milestones each base 12340 invoiced via accepted deliverables"
          setup_api_calls:
            - call: "POST /genealogy/clients"
              payload: { name: "Std C", email: "std@x.com", tier: "STANDARD" }
              as: ProjectManager
              captures: { client_id: $.data.id }
            - call: "POST /genealogy/researchers"
              payload: { name: "R4", email: "r4@x.com", hourly_rate_cents: 9000 }
              as: ProjectManager
              captures: { researcher_id: $.data.id }
            - call: "POST /genealogy/projects"
              payload: { client_id: "${client_id}", lead_researcher_id: "${researcher_id}", title: "P4", objective: "obj", package_type: "BASIC_PACKAGE", package_price_cents: 100000, budget_hours: 10, priority: "STANDARD" }
              as: ProjectManager
              captures: { project_id: $.data.id }
            - call: "POST /genealogy/projects/${project_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /genealogy/milestones"
              payload: { project_id: "${project_id}", title: "M1", amount_cents: 12340, sequence_no: 1 }
              as: ProjectManager
              captures: { m1_id: $.data.id }
            - call: "POST /genealogy/deliverables"
              payload: { project_id: "${project_id}", deliverable_type: "RESEARCH_REPORT", milestone_id: "${m1_id}" }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /genealogy/deliverables/${d1_id}/submit"
              payload: {}
              as: Researcher
              as_user_id: "${researcher_id}"
            - call: "POST /genealogy/deliverables/${d1_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /genealogy/milestones/${m1_id}/invoice"
              payload: {}
              as: ProjectManager
            - call: "POST /genealogy/milestones"
              payload: { project_id: "${project_id}", title: "M2", amount_cents: 12340, sequence_no: 2 }
              as: ProjectManager
              captures: { m2_id: $.data.id }
            - call: "POST /genealogy/deliverables"
              payload: { project_id: "${project_id}", deliverable_type: "FAMILY_TREE", milestone_id: "${m2_id}" }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { d2_id: $.data.id }
            - call: "POST /genealogy/deliverables/${d2_id}/submit"
              payload: {}
              as: Researcher
              as_user_id: "${researcher_id}"
            - call: "POST /genealogy/deliverables/${d2_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /genealogy/milestones/${m2_id}/invoice"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "GET /genealogy/projects/${project_id}"
              payload: {}
              as: ProjectManager
          assert:
            - "Milestone.${m1_id}.line_total_cents == 13266"
            - "Milestone.${m2_id}.line_total_cents == 13266"
            - "ResearchProject.${project_id}.billable_amount_cents == 26532"

  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: person_verified_reopen_cycle
        grounds:
          - state_machines.Person.VERIFIED_to_UNDER_REVIEW
          - state_machines.SourceCitation.VERIFIED_to_DISPUTED
          - entities.Person.fields.verification_status
        distinguishing_aspect: |
          Person is cyclic: after reaching VERIFIED, disputing a supporting citation drops
          verified_citation_count below 2 and drives the back edge VERIFIED->UNDER_REVIEW -- a cycle,
          not a linear pipeline.
        test_recipe:
          setup:
            - "person VERIFIED via 2 PRIMARY VERIFIED citations, then one citation disputed"
          setup_api_calls:
            - call: "POST /genealogy/clients"
              payload: { name: "C5", email: "c5@x.com" }
              as: ProjectManager
              captures: { client_id: $.data.id }
            - call: "POST /genealogy/researchers"
              payload: { name: "R5", email: "r5@x.com", hourly_rate_cents: 9000 }
              as: ProjectManager
              captures: { researcher_id: $.data.id }
            - call: "POST /genealogy/projects"
              payload: { client_id: "${client_id}", lead_researcher_id: "${researcher_id}", title: "P5", objective: "obj", package_type: "BASIC_PACKAGE", package_price_cents: 100000, budget_hours: 10, target_person_count: 1 }
              as: ProjectManager
              captures: { project_id: $.data.id }
            - call: "POST /genealogy/projects/${project_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /genealogy/persons"
              payload: { project_id: "${project_id}", full_name: "Mary Jones" }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { person_id: $.data.id }
            - call: "POST /genealogy/persons/${person_id}/submit-review"
              payload: {}
              as: Researcher
              as_user_id: "${researcher_id}"
            - call: "POST /genealogy/record-searches"
              payload: { project_id: "${project_id}", repository_name: "Archive", search_terms: "Jones", estimated_hours: 1 }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { search_id: $.data.id }
            - call: "POST /genealogy/record-searches/${search_id}/complete"
              payload: { outcome: "COMPLETED" }
              as: Researcher
              as_user_id: "${researcher_id}"
            - call: "POST /genealogy/citations"
              payload: { record_search_id: "${search_id}", person_id: "${person_id}", citation_text: "Birth", source_type: "VITAL_RECORD", quality: "PRIMARY" }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { cit1_id: $.data.id }
            - call: "POST /genealogy/citations/${cit1_id}/verify"
              payload: {}
              as: Researcher
              as_user_id: "${researcher_id}"
            - call: "POST /genealogy/citations"
              payload: { record_search_id: "${search_id}", person_id: "${person_id}", citation_text: "Marriage", source_type: "CHURCH", quality: "PRIMARY" }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { cit2_id: $.data.id }
            - call: "POST /genealogy/citations/${cit2_id}/verify"
              payload: {}
              as: Researcher
              as_user_id: "${researcher_id}"
          trigger:
            - call: "POST /genealogy/citations/${cit1_id}/dispute"
              payload: { reason: "Conflicting evidence found" }
              as: Researcher
              as_user_id: "${researcher_id}"
          assert:
            - "Person.${person_id}.verification_status == UNDER_REVIEW"
            - "Person.${person_id}.verified_citation_count == 1"
            - "ResearchProject.${project_id}.verified_person_count == 0"

      - name: document_request_parallel_dimensions_independent
        grounds:
          - state_machines.DocumentRequest.retrieval_status=REQUESTED_to_retrieval_status=RETRIEVED
          - entities.DocumentRequest.fields.retrieval_status
          - entities.DocumentRequest.fields.translation_status
        distinguishing_aspect: |
          DocumentRequest has two independent state axes: advancing retrieval_status to RETRIEVED
          leaves translation_status at PENDING unchanged, proving the dimensions evolve independently
          (parallel, not linear).
        test_recipe:
          setup:
            - "document request created with needs_translation true (retrieval REQUESTED, translation PENDING)"
          setup_api_calls:
            - call: "POST /genealogy/clients"
              payload: { name: "C6", email: "c6@x.com" }
              as: ProjectManager
              captures: { client_id: $.data.id }
            - call: "POST /genealogy/researchers"
              payload: { name: "R6", email: "r6@x.com", hourly_rate_cents: 9000 }
              as: ProjectManager
              captures: { researcher_id: $.data.id }
            - call: "POST /genealogy/repositories"
              payload: { name: "Bavaria Archive", location: "Munich" }
              as: ProjectManager
              captures: { repo_id: $.data.id }
            - call: "POST /genealogy/projects"
              payload: { client_id: "${client_id}", lead_researcher_id: "${researcher_id}", title: "P6", objective: "obj", package_type: "BASIC_PACKAGE", package_price_cents: 100000, budget_hours: 10 }
              as: ProjectManager
              captures: { project_id: $.data.id }
            - call: "POST /genealogy/projects/${project_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /genealogy/document-requests"
              payload: { project_id: "${project_id}", repository_id: "${repo_id}", document_type: "Birth certificate", source_language: "German", needs_translation: true }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { doc_id: $.data.id }
          trigger:
            - call: "POST /genealogy/document-requests/${doc_id}/update-retrieval"
              payload: { outcome: "RETRIEVED" }
              as: Researcher
              as_user_id: "${researcher_id}"
          assert:
            - "DocumentRequest.${doc_id}.retrieval_status == RETRIEVED"
            - "DocumentRequest.${doc_id}.translation_status == PENDING"

  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: citation_verify_cascades_to_research_complete_depth4
        grounds:
          - state_machines.SourceCitation.UNVERIFIED_to_VERIFIED
          - state_machines.Person.UNDER_REVIEW_to_VERIFIED
          - entities.ResearchProject.fields.verified_person_count
          - entities.ResearchProject.fields.research_status
        distinguishing_aspect: |
          Verifying the 2nd citation fires a 4-hop transitive chain: citation VERIFIED -> Person
          confidence recompute -> Person UNDER_REVIEW->VERIFIED -> project.verified_person_count++ ->
          research_status RESEARCH_COMPLETE (target_person_count 1). Each hop is caused by the prior.
        test_recipe:
          setup:
            - "project target_person_count 1; person UNDER_REVIEW with exactly 1 VERIFIED PRIMARY citation and a 2nd UNVERIFIED PRIMARY citation"
          setup_api_calls:
            - call: "POST /genealogy/clients"
              payload: { name: "C7", email: "c7@x.com" }
              as: ProjectManager
              captures: { client_id: $.data.id }
            - call: "POST /genealogy/researchers"
              payload: { name: "R7", email: "r7@x.com", hourly_rate_cents: 9000 }
              as: ProjectManager
              captures: { researcher_id: $.data.id }
            - call: "POST /genealogy/projects"
              payload: { client_id: "${client_id}", lead_researcher_id: "${researcher_id}", title: "P7", objective: "obj", package_type: "BASIC_PACKAGE", package_price_cents: 100000, budget_hours: 10, target_person_count: 1 }
              as: ProjectManager
              captures: { project_id: $.data.id }
            - call: "POST /genealogy/projects/${project_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /genealogy/persons"
              payload: { project_id: "${project_id}", full_name: "Eli Ford" }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { person_id: $.data.id }
            - call: "POST /genealogy/persons/${person_id}/submit-review"
              payload: {}
              as: Researcher
              as_user_id: "${researcher_id}"
            - call: "POST /genealogy/record-searches"
              payload: { project_id: "${project_id}", repository_name: "Archive", search_terms: "Ford", estimated_hours: 1 }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { search_id: $.data.id }
            - call: "POST /genealogy/record-searches/${search_id}/complete"
              payload: { outcome: "COMPLETED" }
              as: Researcher
              as_user_id: "${researcher_id}"
            - call: "POST /genealogy/citations"
              payload: { record_search_id: "${search_id}", person_id: "${person_id}", citation_text: "Birth", source_type: "VITAL_RECORD", quality: "PRIMARY" }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { cit1_id: $.data.id }
            - call: "POST /genealogy/citations/${cit1_id}/verify"
              payload: {}
              as: Researcher
              as_user_id: "${researcher_id}"
            - call: "POST /genealogy/citations"
              payload: { record_search_id: "${search_id}", person_id: "${person_id}", citation_text: "Baptism", source_type: "CHURCH", quality: "PRIMARY" }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { cit2_id: $.data.id }
          trigger:
            - call: "POST /genealogy/citations/${cit2_id}/verify"
              payload: {}
              as: Researcher
              as_user_id: "${researcher_id}"
          assert:
            - "Person.${person_id}.verification_status == VERIFIED"
            - "ResearchProject.${project_id}.verified_person_count == 1"
            - "ResearchProject.${project_id}.research_status == RESEARCH_COMPLETE"

      - name: deliverable_accept_cascades_to_ready_amount_depth3
        grounds:
          - state_machines.Deliverable.SUBMITTED_to_ACCEPTED
          - state_machines.Milestone.PENDING_to_READY
          - entities.ResearchProject.fields.ready_milestone_amount_cents
        distinguishing_aspect: |
          Different trigger from the citation cascade: accepting a deliverable chains deliverable
          ACCEPTED -> linked Milestone PENDING->READY -> project.ready_milestone_amount_cents
          recompute (3 hops). Milestone amount 40000 -> ready_milestone_amount_cents 40000.
        test_recipe:
          setup:
            - "ACTIVE project; PENDING milestone amount 40000 linked to a SUBMITTED deliverable"
          setup_api_calls:
            - call: "POST /genealogy/clients"
              payload: { name: "C8", email: "c8@x.com" }
              as: ProjectManager
              captures: { client_id: $.data.id }
            - call: "POST /genealogy/researchers"
              payload: { name: "R8", email: "r8@x.com", hourly_rate_cents: 9000 }
              as: ProjectManager
              captures: { researcher_id: $.data.id }
            - call: "POST /genealogy/projects"
              payload: { client_id: "${client_id}", lead_researcher_id: "${researcher_id}", title: "P8", objective: "obj", package_type: "BASIC_PACKAGE", package_price_cents: 100000, budget_hours: 10 }
              as: ProjectManager
              captures: { project_id: $.data.id }
            - call: "POST /genealogy/projects/${project_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /genealogy/milestones"
              payload: { project_id: "${project_id}", title: "M1", amount_cents: 40000, sequence_no: 1 }
              as: ProjectManager
              captures: { m_id: $.data.id }
            - call: "POST /genealogy/deliverables"
              payload: { project_id: "${project_id}", deliverable_type: "FAMILY_TREE", milestone_id: "${m_id}" }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { d_id: $.data.id }
            - call: "POST /genealogy/deliverables/${d_id}/submit"
              payload: {}
              as: Researcher
              as_user_id: "${researcher_id}"
