        claim_type: ownership_enforced
        grounds:
          - "roles"
          - "errors[ERR_NOT_RESOURCE_OWNER]"
          - "validations[priority=3]"
        distinguishing_aspect: "Customer whose X-User-ID != the account's id creating a will-call order returns ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
          setup: ["Two accounts A and B, each with a tank; Customer acts as A's id against B's account."]
          setup_api_calls:
            - call: "POST /accounts"
