              payload: { bid_id: "${bid_b}", expected_shift_version: "${sv}" }
              as: Manager
              as_user_id: "mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_STALE_SHIFT_VERSION"
            - "http_status == 412"

