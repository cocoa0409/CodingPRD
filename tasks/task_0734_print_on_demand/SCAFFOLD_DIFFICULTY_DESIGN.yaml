              payload: { storefront_id: "${sf_id}", listing_id: "${listing_id}", buyer_email: "buy@x.com", ship_country_code: "US", item_count: 1, is_sample: false }
              as: Anonymous
              captures: { order_id: $.data.id }
            - call: "POST /pod/orders/${order_id}/authorize"
              payload: {}
              as: PlatformAdmin
            # Now regress the Design back to MOCKUP_READY for reject: we need a NEW mockup-ready design
            # attached to the SAME listing. But design_id is fixed on listing. Alternative: create a fresh
            # listing under a NEW mockup-ready design. Restart chain with a second design/listing.
            - call: "POST /pod/creators/${creator_id}/designs"
