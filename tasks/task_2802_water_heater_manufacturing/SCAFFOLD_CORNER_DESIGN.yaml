            - call: "POST /mfg/lining-inspections"
              payload: { tank_lot_id: "${tl_id}", inspection_type: "HOLIDAY", sample_size: 6, holiday_count: 4, scrap_quantity: 10, expected_tank_lot_version: "${fa_v1}" }
