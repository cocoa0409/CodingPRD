              captures: { new_acct: $.data.opened_account_id }
          assert:
            - "Application.${app_c}.status == APPROVED"
            - "GET /accounts/${new_acct} -> Account.origin_application_id == ${app_c}"
            - "GET /accounts/${new_acct}/owners -> exactly one owner with ownership_role == PRIMARY, customer_id == ${cust_c}, is_active == true"
            - "GET /customers/${cust_c} -> Customer.cip_status == VERIFIED"

      - name: escheat_sweep_cascades_to_stop_expiry
        grounds:
          - state_machines.Account.DORMANT_to_ESCHEATED
          - state_machines.StopPayment.ACTIVE_to_EXPIRED
          - entities.EscheatEvent.fields.swept_amount_cents
          - entities.Transaction.fields.txn_type
        distinguishing_aspect: |
          Depth-3 cascade from RUN-ESCHEAT-SWEEP: the sweep creates an EscheatEvent (link 1),
          which posts an ESCHEAT_SWEEP debit driving ledger_balance_cents -> 0 (link 2), and the
          account reaching ESCHEATED forces every ACTIVE StopPayment on it to EXPIRED (link 3).
          Each link follows from the prior; originates from a different trigger than the approve
          cascade above.
        test_recipe:
          setup:
            - "A DORMANT account opened 2020-01-01 with ledger 40000, an ACTIVE stop on check 7001, inactive past the 1095-day escheat threshold."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2020-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /apy-tiers"
              payload: { code: "CHK_STD", product_type: "CHECKING", min_balance_cents: 0, annual_rate_bps: 0 }
              as: ComplianceOfficer
