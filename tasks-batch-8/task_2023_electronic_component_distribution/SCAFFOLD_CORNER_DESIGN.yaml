              as: DistributorAdmin
              captures: { cust_rd: $.data.id }
            - call: "POST /design-registrations"
              payload: { customer_id: "${cust_rd}", part_id: "${part_rd}", end_customer_name: "EndCo", registered_cost_cents: 700, max_registered_qty: 10, valid_from: "2026-08-01", valid_to: "2026-12-31" }
