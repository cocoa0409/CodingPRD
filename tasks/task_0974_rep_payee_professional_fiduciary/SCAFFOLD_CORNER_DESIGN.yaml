      - name: court_order_amount_exceeded_on_release
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_COURT_ORDER_EXCEEDED]"]

        distinguishing_aspect: "A GRANTED, unexpired, correctly-typed order still caps the amount: 30000 against a 25000 limit fails with ERR_COURT_ORDER_EXCEEDED at release."
