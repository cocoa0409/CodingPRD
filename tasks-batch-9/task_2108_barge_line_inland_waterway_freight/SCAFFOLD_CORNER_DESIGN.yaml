      - name: fleeting_billable_day_ceiling_at_exactly_twenty_four_hours
        claim_type: Precision
        grounds:
          - calculations.fleeting_fee_assessment
          - entities.FleetingAssignment.fields.billable_days
          - state_machines.FleetingAssignment.RESERVED_to_RELEASED
        distinguishing_aspect: "Billable days round UP from the exact occupancy: a release at exactly 24 hours is one day (75000 cents) while a release one minute later is two days (90000 cents), and the switch fee is charged exactly once in both cases."
        test_recipe:
          setup: ["Berth Cairo Harbor with capacity 4 at 15000 cents per barge-day and a 60000-cent switch fee; two hulls each reserved from 2026-08-18T00:00:00Z."]
          setup_api_calls:
            - call: "POST /fleeting-berths"
              payload: { harbor_name: "Cairo Harbor", river_mile: 955.0, capacity_barges: 4, daily_fee_cents_per_barge: 15000, switch_fee_cents: 60000 }
              as: WaterwayAdmin
              captures: { fb_id: $.data.id }
            - call: "POST /barges"
              payload: { hull_number: "BL-7001", capacity_tons: 1750, light_draft_feet: 1.5, tons_per_inch_immersion: 17.0 }
              as: WaterwayAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /barges"
