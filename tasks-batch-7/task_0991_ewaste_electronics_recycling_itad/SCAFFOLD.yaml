# =============================================================================
# Task 0991 — E-Waste & Electronics Recycling (ITAD) scaffold seed tables
# =============================================================================

scenario: |
  generate task hard than expert level! 991. E-Waste & Electronics Recycling (ITAD): item & data-destruction, pickup/drop & manifest, certified-recycler chain-of-custody, resale/refurb vs recycle, business (ITAD) account & reporting, fee vs buyback, compliance (R2/e-Stewards), certificate

domain_name: ewaste-itad-recycling
api_prefix: /itad

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - selector_policy
  entity_topology: hybrid          # Account→Manifest→Item tree, cross-cutting Recycler/Batch/Certificate/Ledger
  state_machine_shape: parallel    # Item carries processing_status × data_status; cyclic refurb/return loops elsewhere
  relationship_patterns:
    - one_to_many
    - self_referential             # Settlement.supersedes_settlement_id
    - polymorphic                  # CustodyEvent.subject_*
    - cross_aggregate              # Item.recycle_batch_id, Certificate spans Item/Batch
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: BusinessAccount
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Legal company name of the ITAD customer" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: tier, type: enum, source: input, default: STANDARD, description: "STANDARD | VOLUME | ENTERPRISE — set at creation, later auto-upgraded (never downgraded) by lifetime_diverted_kg thresholds; ENTERPRISE lowers sale commission" , constraints: "enum {STANDARD, VOLUME, ENTERPRISE}" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | CLOSED — lifecycle of the account", constraints: "enum {ACTIVE, SUSPENDED, CLOSED}" }
      - { name: credit_balance_cents, type: integer, source: computed, description: "Running balance = sum of all LedgerEntry.amount_cents for this account; positive = platform owes the customer" }
      - { name: lifetime_diverted_kg, type: number, source: computed, description: "Sum of weight_kg over all of the account's Items that reached COMPLETE (resale or recycle path)" }

  - name: Recycler
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Downstream recycler legal name" }
      - { name: certification_standard, type: enum, source: input, description: "R2 | E_STEWARDS — certification scheme the recycler is audited under", constraints: "enum {R2, E_STEWARDS}" }
      - { name: certification_expires_at, type: datetime, source: input, description: "Instant the certification lapses; a delivery scheduled at or after this instant is rejected (expiry-exclusive)" }
      - { name: accepted_categories, type: array, source: input, description: "Non-empty subset of item categories the recycler accepts: LAPTOP | DESKTOP | SERVER | PHONE | TABLET | MONITOR | BATTERY | OTHER" }
      - { name: daily_intake_capacity_kg, type: number, source: input, description: "Max total gross weight the recycler accepts per calendar delivery day; strictly-greater overflow rejected, exact fit allowed" }
      - { name: violation_count, type: integer, source: input, default: 0, description: "Recorded downstream compliance violations (0..10 considered by scoring)", constraints: "integer >= 0" }
      - { name: total_processed_kg, type: number, source: computed, description: "Sum of gross_weight_kg over batches that reached PROCESSED for this recycler" }
      - { name: risk_score, type: number, source: computed, description: "Recycler selection score per calculations.recycler_selection_score, evaluated against the ACTIVE CompliancePolicy weight set; 2 decimal places" }

  - name: CompliancePolicy
    parent: null
    common_fields: true
    fields:
      - { name: standard, type: enum, source: input, description: "R2 | E_STEWARDS — the certification standard this policy parametrizes", constraints: "enum {R2, E_STEWARDS}" }
      - { name: sanitization_methods_allowed, type: array, source: input, description: "Non-empty subset of CRYPTO_ERASE | NIST_CLEAR | NIST_PURGE | PHYSICAL_DESTROY permitted while this policy is active" }
      - { name: export_allowed, type: boolean, source: input, description: "Whether downstream export shipments are permitted while this policy is active (e-Stewards: false)" }
      - { name: resale_requires_verified_sanitization, type: boolean, source: input, description: "When true, listing a data-bearing item requires data_status VERIFIED" }
      - { name: is_active, type: boolean, source: input, default: false, description: "Exactly one policy is active platform-wide; creating with is_active=true deactivates all others" }
      - { name: weight_cert_freshness, type: number, source: input, description: "Selector weight for certification freshness component (0..1)" }
      - { name: weight_volume, type: number, source: input, description: "Selector weight for processed-volume component (0..1)" }
      - { name: weight_violations, type: number, source: input, description: "Selector weight for violation-free component (0..1)" }

  - name: Manifest
    parent: BusinessAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> BusinessAccount.id; owning ITAD customer" }
      - { name: mode, type: enum, source: input, description: "PICKUP | DROPOFF — PICKUP requires pickup_route and incurs a flat pickup fee", constraints: "enum {PICKUP, DROPOFF}" }
      - { name: pickup_route, type: string, source: input, required: false, description: "Route identifier for PICKUP manifests; required iff mode=PICKUP; route windows on the same route are half-open [scheduled_start, scheduled_end) and must not overlap" }
      - { name: scheduled_start, type: datetime, source: input, description: "Window start for the pickup/drop-off appointment" }
      - { name: scheduled_end, type: datetime, source: input, description: "Window end; must be strictly after scheduled_start and strictly after the current clock at schedule time" }
      - { name: declared_item_count, type: integer, source: input, description: "Customer-declared expected asset count; integer >= 1" }
      - { name: received_item_count, type: integer, source: computed, description: "Count of Items scanned into this manifest" }
      - { name: discrepancy_flag, type: boolean, source: computed, description: "received_item_count != declared_item_count" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SCHEDULED | RECEIVED | RECONCILED | CLOSED | CANCELLED", constraints: "enum {DRAFT, SCHEDULED, RECEIVED, RECONCILED, CLOSED, CANCELLED}" }

  - name: Item
    parent: Manifest
    common_fields: true
    fields:
      - { name: manifest_id, type: string, source: input, description: "FK -> Manifest.id; intake manifest" }
      - { name: serial_number, type: string, source: input, description: "Asset serial number; unique per manifest" , constraints: "unique within manifest_id" }
      - { name: category, type: enum, source: input, description: "LAPTOP | DESKTOP | SERVER | PHONE | TABLET | MONITOR | BATTERY | OTHER", constraints: "enum of 8 device categories" }
      - { name: weight_kg, type: number, source: input, description: "Item gross weight in kg, > 0, up to 3 decimal places" }
      - { name: data_bearing, type: boolean, source: input, description: "True when the device carries storage requiring sanitization" }
      - { name: hazmat_flag, type: boolean, source: input, description: "True for hazardous material handling (batteries, CRT glass); adds flat surcharge" }
      - { name: declared_grade, type: enum, source: input, description: "A | B | C | D cosmetic/functional grade used by QUOTE valuation", constraints: "enum {A, B, C, D}" }
      - { name: disposition, type: enum, source: system, default: NONE, description: "NONE | RESALE | REFURB | RECYCLE — routing decided at triage", constraints: "enum {NONE, RESALE, REFURB, RECYCLE}" }
      - { name: processing_status, type: enum, source: system, default: INTAKE, description: "INTAKE | FOR_RESALE | FOR_REFURB | FOR_RECYCLE | LISTED | SOLD | BATCHED | DOWNSTREAM | COMPLETE — physical disposition dimension", constraints: "enum of 9 processing states" }
      - { name: data_status, type: enum, source: system, description: "NOT_REQUIRED | PENDING | SANITIZED | VERIFIED — parallel data-sanitization dimension; initialized PENDING when data_bearing else NOT_REQUIRED", constraints: "enum {NOT_REQUIRED, PENDING, SANITIZED, VERIFIED}" }
      - { name: recycle_batch_id, type: string, source: system, required: false, description: "FK -> RecycleBatch.id; set while BATCHED/DOWNSTREAM, null otherwise" }
      - { name: provisional_value_cents, type: integer, source: computed, description: "QUOTE-variant estimated value per calculations.settlement_valuation (0 for RECYCLE disposition)" }
      - { name: final_value_cents, type: integer, source: computed, description: "FINAL-variant realized value: net sale proceeds for sold items, else 0" }

  - name: DataSanitization
    parent: Item
    common_fields: true
    fields:
      - { name: item_id, type: string, source: input, description: "FK -> Item.id; sanitized device" }
      - { name: method, type: enum, source: input, description: "CRYPTO_ERASE | NIST_CLEAR | NIST_PURGE | PHYSICAL_DESTROY — must be allowed by the ACTIVE CompliancePolicy", constraints: "enum of 4 sanitization methods" }
      - { name: outcome, type: enum, source: input, description: "PASS | FAIL — technician-reported attempt outcome", constraints: "enum {PASS, FAIL}" }
      - { name: logged_by_id, type: string, source: system, description: "X-User-ID of the DestructionTechnician who logged the attempt" }
      - { name: verified_by_id, type: string, source: system, required: false, description: "X-User-ID of the ComplianceOfficer who verified; must differ from logged_by_id" }
      - { name: status, type: enum, source: system, default: LOGGED, description: "LOGGED | VERIFIED | REJECTED", constraints: "enum {LOGGED, VERIFIED, REJECTED}" }

  - name: ResaleListing
    parent: Item
    common_fields: true
    fields:
      - { name: item_id, type: string, source: input, description: "FK -> Item.id; listed device" }
      - { name: asking_price_cents, type: integer, source: input, description: "List price in cents; must be >= floor_price_cents" }
      - { name: floor_price_cents, type: integer, source: input, description: "Minimum accepted sale price in cents; >= 0" }
      - { name: channel, type: enum, source: input, description: "B2B_AUCTION | RETAIL", constraints: "enum {B2B_AUCTION, RETAIL}" }
      - { name: sale_price_cents, type: integer, source: input, required: false, description: "Realized sale price in cents, set by the sell action" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SOLD | RETURNED | WITHDRAWN — RETURNED may re-activate", constraints: "enum {ACTIVE, SOLD, RETURNED, WITHDRAWN}" }

  - name: RecycleBatch
    parent: null
    common_fields: true
    fields:
      - { name: recycler_id, type: string, source: system, description: "FK -> Recycler.id; downstream recycler — supplied by client or chosen by the selector policy when omitted at creation" }
      - { name: scheduled_delivery_date, type: datetime, source: input, description: "Planned delivery instant; drives certification-validity and daily-capacity checks" }
      - { name: is_export, type: boolean, source: input, description: "True when the shipment leaves the country; rejected when the ACTIVE policy forbids export" }
      - { name: status, type: enum, source: system, default: STAGING, description: "STAGING | IN_TRANSIT | DELIVERED | PROCESSED", constraints: "enum {STAGING, IN_TRANSIT, DELIVERED, PROCESSED}" }
      - { name: gross_weight_kg, type: number, source: computed, description: "Sum of weight_kg over contained items; 3 decimal places" }
      - { name: item_count, type: integer, source: computed, description: "Count of contained items" }

  - name: CustodyEvent
    parent: null
    common_fields: false
    fields:
      - { name: subject_type, type: enum, source: input, description: "MANIFEST | ITEM | BATCH — polymorphic subject kind", constraints: "enum {MANIFEST, ITEM, BATCH}" }
      - { name: subject_id, type: string, source: input, description: "Id of the subject entity (interpreted per subject_type; not a single-entity FK)" }
      - { name: event_type, type: enum, source: input, description: "RECEIVED_FACILITY | TRANSFERRED | SHIPPED_DOWNSTREAM | DELIVERED_DOWNSTREAM | PROCESSED", constraints: "enum of 5 custody event types" }
      - { name: from_location, type: string, source: input, required: false, description: "Origin location free text" }
      - { name: to_location, type: string, source: input, required: false, description: "Destination location free text" }
      - { name: actor_id, type: string, source: system, description: "X-User-ID that performed the custody action" }

  - name: Certificate
    parent: null
    common_fields: true
    fields:
      - { name: cert_type, type: enum, source: input, description: "DATA_DESTRUCTION | RECYCLING — CODD per item, COR per batch", constraints: "enum {DATA_DESTRUCTION, RECYCLING}" }
      - { name: item_id, type: string, source: input, required: false, description: "FK -> Item.id; set iff cert_type=DATA_DESTRUCTION" }
      - { name: batch_id, type: string, source: system, required: false, description: "FK -> RecycleBatch.id; set iff cert_type=RECYCLING (auto-issued at batch processing)" }
      - { name: certificate_number, type: string, source: system, description: "Server-minted human-readable number, format CERT-<8 uppercase hex>" }
      - { name: issued_by_id, type: string, source: system, description: "X-User-ID of issuing ComplianceOfficer, or 'system' for auto-issued COR" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "ISSUED | VOIDED", constraints: "enum {ISSUED, VOIDED}" }

  - name: Settlement
    parent: Manifest
    common_fields: true
    fields:
      - { name: manifest_id, type: string, source: input, description: "FK -> Manifest.id; settled manifest" }
      - { name: kind, type: enum, source: system, default: QUOTE, description: "QUOTE — provisional estimate, recomputed on demand; FINAL — realized totals at finalization", constraints: "enum {QUOTE, FINAL}" }
      - { name: status, type: enum, source: system, default: QUOTE_OPEN, description: "QUOTE_OPEN | SUPERSEDED | FINALIZED | PAID | VOIDED", constraints: "enum {QUOTE_OPEN, SUPERSEDED, FINALIZED, PAID, VOIDED}" }
      - { name: supersedes_settlement_id, type: string, source: system, required: false, description: "FK -> Settlement.id; the QUOTE_OPEN settlement this one replaces, if any" }
      - { name: gross_buyback_cents, type: integer, source: computed, description: "Sum of per-line item values per calculations.settlement_valuation (rounded per line, then summed)" }
      - { name: total_fees_cents, type: integer, source: computed, description: "Sum of per-line recycling + sanitization fees (rounded per line, then summed), plus flat pickup fee when mode=PICKUP" }
      - { name: volume_rebate_cents, type: integer, source: computed, description: "Rebate per calculations.settlement_net_rebate over the pinned evaluation order" }
      - { name: net_amount_cents, type: integer, source: computed, description: "gross_buyback_cents - total_fees_cents + volume_rebate_cents; positive = platform pays customer (buyback), negative = customer owes fees" }

  - name: LedgerEntry
    parent: BusinessAccount
    common_fields: false
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> BusinessAccount.id; ledger owner" }
      - { name: settlement_id, type: string, source: system, description: "FK -> Settlement.id; settlement that produced this entry" }
      - { name: entry_type, type: enum, source: system, description: "BUYBACK_CREDIT | FEE_DEBIT | BONUS_CREDIT | PAYOUT_DEBIT | REVERSAL", constraints: "enum of 5 ledger entry types" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount; credits positive, debits negative" }
      - { name: balance_after_cents, type: integer, source: system, description: "Account credit_balance_cents immediately after posting this entry (chronological running balance)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: BusinessAccount
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /itad/accounts/{id} with status=SUSPENDED"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "increments BusinessAccount.version by 1"
        note: "Suspended accounts cannot create manifests (ERR_ACCOUNT_SUSPENDED); existing manifests unaffected."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /itad/accounts/{id} with status=ACTIVE"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "increments BusinessAccount.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "PATCH /itad/accounts/{id} with status=CLOSED"
        actor: PlatformAdmin
        preconditions:
          - "every Manifest of the account is in {CLOSED, CANCELLED} (ERR_INVALID_STATE)"
          - "credit_balance_cents == 0 (ERR_INVALID_STATE)"
        side_effects:
          - "increments BusinessAccount.version by 1"

  - entity: Manifest
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /itad/manifests/{id}/schedule"
        actor: LogisticsCoordinator
        preconditions:
          - "owning BusinessAccount.status == ACTIVE (ERR_ACCOUNT_SUSPENDED)"
          - "scheduled_end strictly after current clock (ERR_WINDOW_IN_PAST)"
          - "if mode=PICKUP: no other Manifest in {SCHEDULED, RECEIVED} on the same pickup_route with overlapping half-open window [scheduled_start, scheduled_end) (ERR_ROUTE_WINDOW_CONFLICT); adjacency (end == start) is allowed"
        side_effects:
          - "increments Manifest.version by 1"
      - from: SCHEDULED
        to: RECEIVED
        trigger: "POST /itad/manifests/{id}/receive"
        actor: IntakeOperator
        preconditions: []
        side_effects:
          - "writes CustodyEvent {subject_type: MANIFEST, subject_id: manifest.id, event_type: RECEIVED_FACILITY}"
          - "increments Manifest.version by 1"
      - from: RECEIVED
        to: RECONCILED
        trigger: "POST /itad/manifests/{id}/reconcile"
        actor: IntakeOperator
        preconditions:
          - "received_item_count >= 1 (ERR_MANIFEST_EMPTY)"
          - "received_item_count == declared_item_count (ERR_MANIFEST_ITEM_COUNT_MISMATCH)"
          - "no Item of this manifest in processing_status INTAKE (ERR_INVALID_STATE)"
        side_effects:
          - "increments Manifest.version by 1"
      - from: RECONCILED
        to: CLOSED
        trigger: "POST /itad/manifests/{id}/close"
        actor: AccountManager
        preconditions:
          - "at least one Settlement exists for the manifest and every non-SUPERSEDED Settlement is in {PAID, VOIDED} (ERR_CLOSE_SETTLEMENT_UNPAID)"
        side_effects:
          - "increments Manifest.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /itad/manifests/{id}/cancel"
        actor: AccountManager
        preconditions:
          - "received_item_count == 0 (ERR_MANIFEST_HAS_ITEMS)"
        side_effects:
          - "increments Manifest.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /itad/manifests/{id}/cancel"
        actor: AccountManager
        preconditions:
          - "received_item_count == 0 (ERR_MANIFEST_HAS_ITEMS)"
        side_effects:
          - "increments Manifest.version by 1"

  - entity: Item
    initial_state: INTAKE
    terminal_states: [COMPLETE]
    note: "Two parallel dimensions on one entity: processing_status (this machine) and data_status (sanitization dimension). data_status evolves independently: PENDING -> SANITIZED on PASS outcome -> VERIFIED on verification; verification REJECT returns SANITIZED -> PENDING. Gates: listing and batching require data_status in {NOT_REQUIRED, VERIFIED}."
    transitions:
      - from: INTAKE
        to: FOR_RESALE
        trigger: "POST /itad/items/{id}/triage with disposition=RESALE"
        actor: IntakeOperator
        preconditions:
          - "owning Manifest.status == RECEIVED (ERR_MANIFEST_NOT_RECEIVED)"
        side_effects:
          - "disposition := RESALE; provisional_value_cents recomputed per settlement_valuation QUOTE variant"
      - from: INTAKE
        to: FOR_REFURB
        trigger: "POST /itad/items/{id}/triage with disposition=REFURB"
        actor: IntakeOperator
        preconditions:
          - "owning Manifest.status == RECEIVED (ERR_MANIFEST_NOT_RECEIVED)"
        side_effects:
          - "disposition := REFURB; provisional_value_cents recomputed"
      - from: INTAKE
        to: FOR_RECYCLE
        trigger: "POST /itad/items/{id}/triage with disposition=RECYCLE"
        actor: IntakeOperator
        preconditions:
          - "owning Manifest.status == RECEIVED (ERR_MANIFEST_NOT_RECEIVED)"
        side_effects:
          - "disposition := RECYCLE; provisional_value_cents := 0"
      - from: FOR_REFURB
        to: FOR_RESALE
        trigger: "POST /itad/items/{id}/triage with disposition=RESALE (refurb QA passed, reroute to resale)"
        actor: IntakeOperator
        preconditions:
          - "owning Manifest.status == RECEIVED (ERR_MANIFEST_NOT_RECEIVED)"
        side_effects:
          - "disposition := RESALE; provisional_value_cents recomputed"
      - from: FOR_REFURB
        to: FOR_RECYCLE
        trigger: "POST /itad/items/{id}/triage with disposition=RECYCLE (refurb uneconomical)"
        actor: IntakeOperator
        preconditions:
          - "owning Manifest.status == RECEIVED (ERR_MANIFEST_NOT_RECEIVED)"
        side_effects:
          - "disposition := RECYCLE; provisional_value_cents := 0"
      - from: FOR_RESALE
        to: FOR_RECYCLE
        trigger: "POST /itad/items/{id}/triage with disposition=RECYCLE (resale abandoned)"
        actor: IntakeOperator
        preconditions:
          - "owning Manifest.status == RECEIVED (ERR_MANIFEST_NOT_RECEIVED)"
        side_effects:
          - "disposition := RECYCLE; provisional_value_cents := 0"
      - from: FOR_RESALE
        to: LISTED
        trigger: "POST /itad/listings (creates ACTIVE ResaleListing)"
        actor: IntakeOperator
        preconditions:
          - "when data_bearing: data_status VERIFIED if the ACTIVE policy resale_requires_verified_sanitization is true (strict default when no policy active), else data_status in {SANITIZED, VERIFIED} (ERR_DATA_SANITIZATION_UNVERIFIED)"
        side_effects: []
      - from: LISTED
        to: SOLD
        trigger: "POST /itad/listings/{listing_id}/sell"
        actor: IntakeOperator
        preconditions: []
        side_effects:
          - "final_value_cents := sale_price_cents - round_half_up(sale_price_cents * commission_rate(account.tier)) computed per line"
      - from: SOLD
        to: FOR_RESALE
        trigger: "POST /itad/listings/{listing_id}/return"
        actor: IntakeOperator
        preconditions: []
        side_effects:
          - "final_value_cents := 0; any QUOTE_OPEN Settlement of the owning manifest is recomputed (QUOTE variant re-run, settlement.version incremented)"
      - from: LISTED
        to: FOR_RESALE
        trigger: "POST /itad/listings/{listing_id}/withdraw"
        actor: IntakeOperator
        preconditions: []
        side_effects: []
      - from: FOR_RESALE
        to: LISTED
        trigger: "POST /itad/listings/{listing_id}/relist (RETURNED listing re-activates)"
        actor: IntakeOperator
        preconditions: []
        side_effects: []
      - from: FOR_RECYCLE
        to: BATCHED
        trigger: "POST /itad/recycle-batches/{batch_id}/items"
        actor: LogisticsCoordinator
        preconditions:
          - "data_status in {NOT_REQUIRED, VERIFIED} (ERR_DATA_SANITIZATION_UNVERIFIED)"
        side_effects:
          - "recycle_batch_id := batch id"
          - "writes CustodyEvent {subject_type: ITEM, subject_id: item.id, event_type: TRANSFERRED, to_location: 'batch:'+batch.id}"
      - from: BATCHED
        to: FOR_RECYCLE
        trigger: "DELETE /itad/recycle-batches/{batch_id}/items/{item_id}"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects:
          - "recycle_batch_id := null"
      - from: BATCHED
        to: DOWNSTREAM
        trigger: "POST /itad/recycle-batches/{batch_id}/ship"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects: []
      - from: DOWNSTREAM
        to: COMPLETE
        trigger: "POST /itad/recycle-batches/{batch_id}/process"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "BusinessAccount.lifetime_diverted_kg += item.weight_kg (link 2 of process cascade)"
          - "if lifetime_diverted_kg crosses a tier threshold (>= 1000 kg VOLUME, >= 5000 kg ENTERPRISE, >= boundary inclusive), BusinessAccount.tier upgrades (never downgrades) (link 3 of process cascade)"
          - "writes CustodyEvent {subject_type: ITEM, subject_id: item.id, event_type: PROCESSED}"
      - from: SOLD
        to: COMPLETE
        trigger: "POST /itad/settlements/{id}/finalize (cascade over the manifest's SOLD items)"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "BusinessAccount.lifetime_diverted_kg += item.weight_kg (resale counts as diversion)"

  - entity: DataSanitization
    initial_state: LOGGED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: LOGGED
        to: VERIFIED
        trigger: "POST /itad/sanitizations/{id}/verify with verdict=APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "X-User-ID != logged_by_id (ERR_SEGREGATION_OF_DUTIES)"
          - "outcome == PASS (ERR_INVALID_STATE: a FAIL attempt cannot be verified)"
        side_effects:
          - "verified_by_id := X-User-ID"
          - "Item.data_status := VERIFIED"
      - from: LOGGED
        to: REJECTED
        trigger: "POST /itad/sanitizations/{id}/verify with verdict=REJECT"
        actor: ComplianceOfficer
        preconditions:
          - "X-User-ID != logged_by_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "verified_by_id := X-User-ID"
          - "Item.data_status := PENDING (retry loop: a new DataSanitization may be logged)"

  - entity: ResaleListing
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: SOLD
        trigger: "POST /itad/listings/{id}/sell"
        actor: IntakeOperator
        preconditions:
          - "sale_price_cents >= floor_price_cents (ERR_FLOOR_PRICE_VIOLATION)"
        side_effects:
          - "Item LISTED -> SOLD with per-line final_value_cents computed"
      - from: SOLD
        to: RETURNED
        trigger: "POST /itad/listings/{id}/return"
        actor: IntakeOperator
        preconditions:
          - "no Settlement of the owning manifest in {FINALIZED, PAID} (ERR_SETTLEMENT_ALREADY_FINALIZED)"
        side_effects:
          - "Item SOLD -> FOR_RESALE (link 1 of return cascade)"
          - "any QUOTE_OPEN Settlement of the owning manifest is recomputed (link 2 of return cascade)"
      - from: RETURNED
        to: ACTIVE
        trigger: "POST /itad/listings/{id}/relist"
        actor: IntakeOperator
        preconditions:
          - "Item.processing_status == FOR_RESALE (ERR_INVALID_STATE)"
        side_effects:
          - "Item FOR_RESALE -> LISTED"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /itad/listings/{id}/withdraw"
        actor: IntakeOperator
        preconditions: []
        side_effects:
          - "Item LISTED -> FOR_RESALE"

  - entity: RecycleBatch
    initial_state: STAGING
    terminal_states: [PROCESSED]
    transitions:
      - from: STAGING
        to: IN_TRANSIT
        trigger: "POST /itad/recycle-batches/{id}/ship"
        actor: LogisticsCoordinator
        preconditions:
          - "item_count >= 1 (ERR_BATCH_EMPTY)"
          - "Recycler.certification_expires_at strictly after scheduled_delivery_date (ERR_RECYCLER_CERT_EXPIRED)"
          - "daily capacity: sum of gross_weight_kg over this recycler's batches in {IN_TRANSIT, DELIVERED, PROCESSED} sharing this batch's scheduled_delivery calendar day, plus this batch's gross_weight_kg, must be <= daily_intake_capacity_kg; exact equality allowed (ERR_RECYCLER_DAILY_CAPACITY_EXCEEDED)"
        side_effects:
          - "every contained Item BATCHED -> DOWNSTREAM"
          - "writes CustodyEvent {subject_type: BATCH, subject_id: batch.id, event_type: SHIPPED_DOWNSTREAM}"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /itad/recycle-batches/{id}/deliver"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "writes CustodyEvent {subject_type: BATCH, subject_id: batch.id, event_type: DELIVERED_DOWNSTREAM}"
      - from: DELIVERED
        to: PROCESSED
        trigger: "POST /itad/recycle-batches/{id}/process"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "every contained Item DOWNSTREAM -> COMPLETE (link 1)"
          - "Recycler.total_processed_kg += gross_weight_kg"
          - "auto-issues Certificate {cert_type: RECYCLING, batch_id: batch.id, status: ISSUED, issued_by_id: 'system'}"
          - "each item completion bubbles into BusinessAccount.lifetime_diverted_kg and possible tier upgrade (links 2-3, see Item DOWNSTREAM->COMPLETE)"
          - "writes CustodyEvent {subject_type: BATCH, subject_id: batch.id, event_type: PROCESSED}"

  - entity: Settlement
    initial_state: QUOTE_OPEN
    terminal_states: [SUPERSEDED, PAID, VOIDED]
    transitions:
      - from: QUOTE_OPEN
        to: SUPERSEDED
        trigger: "POST /itad/manifests/{id}/settlements (system: a new QUOTE supersedes the prior QUOTE_OPEN one)"
        actor: system
        preconditions: []
        side_effects:
          - "new Settlement.supersedes_settlement_id := this settlement's id"
      - from: QUOTE_OPEN
        to: FINALIZED
        trigger: "POST /itad/settlements/{id}/finalize"
        actor: PlatformAdmin
        preconditions:
          - "kind == QUOTE (a FINAL record is never re-finalized)"
          - "owning Manifest.status == RECONCILED (ERR_INVALID_STATE)"
          - "every Item of the manifest in processing_status in {SOLD, COMPLETE} (ERR_FINALIZE_ITEMS_PENDING)"
        side_effects:
          - "kind := FINAL; FINAL variant of settlement_valuation computes gross_buyback_cents, total_fees_cents; settlement_net_rebate computes volume_rebate_cents and net_amount_cents"
          - "every SOLD Item of the manifest -> COMPLETE"
          - "posts LedgerEntry BUYBACK_CREDIT (+gross) when gross != 0, then FEE_DEBIT (-fees) when fees != 0, then BONUS_CREDIT (+rebate) when rebate != 0, each with running balance_after_cents; BusinessAccount.credit_balance_cents += net_amount_cents"
      - from: FINALIZED
        to: PAID
        trigger: "POST /itad/settlements/{id}/pay"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "posts LedgerEntry PAYOUT_DEBIT (-net_amount_cents); BusinessAccount.credit_balance_cents -= net_amount_cents"
      - from: FINALIZED
        to: VOIDED
        trigger: "POST /itad/settlements/{id}/void"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "posts one REVERSAL LedgerEntry per finalize-posted entry with negated amount; BusinessAccount.credit_balance_cents returns to its pre-finalize value exactly (compensating invariant)"

  - entity: Certificate
    initial_state: ISSUED
    terminal_states: [VOIDED]
    transitions:
      - from: ISSUED
        to: VOIDED
        trigger: "POST /itad/certificates/{id}/void"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "voided certificates are excluded from sustainability-report certificates_issued count"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: manifest-amend-stale-version
    parent_entity: Manifest
    write_endpoint: "PATCH /itad/manifests/{id}"
    occ_field: "expected_manifest_version"
    description: |
      Amending a DRAFT manifest whose version has advanced since the client last
      observed it is rejected. The client's view of the manifest window/route is
      stale, so the amendment is refused rather than silently overwriting another
      writer's change.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: settlement-requote-stale-manifest
    parent_entity: Manifest
    write_endpoint: "POST /itad/manifests/{id}/settlements"
    occ_field: "expected_manifest_version"
    description: |
      Creating a QUOTE settlement against a manifest whose version has advanced
      since the client last observed it is rejected. A new QUOTE legitimately
      supersedes the prior QUOTE_OPEN settlement, so the create is guarded by the
      manifest version the client based its figures on.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: settlement_valuation
    trigger: "QUOTE variant: on POST /itad/manifests/{id}/settlements and on return-cascade recompute; FINAL variant: on POST /itad/settlements/{id}/finalize"
    algorithm: aggregation
    formula: |
      Per-line item value (integer cents, round_half_up per line, THEN summed):
        RESALE/REFURB-routed item:
          QUOTE variant: if item.processing_status == SOLD: line_value = item.final_value_cents (realized)
                         else: line_value = round_half_up(BASE_VALUE_CENTS[category] * GRADE_MULT[declared_grade])
          FINAL variant: if item reached COMPLETE via sale: line_value = item.final_value_cents
                         (final_value_cents = sale_price_cents - round_half_up(sale_price_cents * COMMISSION_RATE[account.tier]))
                         else (item COMPLETE via recycling, or unsold): line_value = 0
        RECYCLE-routed item: line_value = 0 in both variants
      gross_buyback_cents = sum of line_value over all items of the manifest
      Input-set filter: QUOTE counts items with disposition in {RESALE, REFURB}
        regardless of processing_status; FINAL counts only items in
        processing_status COMPLETE, using realized values (SOLD items are moved
        to COMPLETE by the finalize transition before FINAL totals compute).
    input_set: "All Items of the manifest; QUOTE includes disposition in {RESALE, REFURB} at estimate, FINAL includes only COMPLETE items at realized value"
    constants:
      BASE_VALUE_CENTS: { LAPTOP: 40000, DESKTOP: 25000, SERVER: 120000, PHONE: 15000, TABLET: 18000, MONITOR: 8000, BATTERY: 0, OTHER: 5000 }
      GRADE_MULT: { A: 1.0, B: 0.7, C: 0.4, D: 0.1 }
      COMMISSION_RATE: { STANDARD: 0.15, VOLUME: 0.15, ENTERPRISE: 0.10 }
    precision: "integer cents; round_half_up applied per line before summation (pinned order: round-then-sum)"
    variants:
      - name: QUOTE
        when: "manifest received/reconciled but items not yet finalized"
        difference: "values are catalog estimates BASE_VALUE_CENTS x GRADE_MULT for unsold items; SOLD items already contribute realized final_value_cents"
      - name: FINAL
        when: "settlement finalization, all items terminal"
        difference: "values are realized net proceeds (sale minus per-line commission) for items sold, 0 otherwise"

  - name: item_recycling_fee
    trigger: "QUOTE settlement creation/recompute and FINAL finalization (fees component); per RECYCLE-routed item"
    algorithm: tiered_pricing
    formula: |
      fee_cents(item) =
          CATEGORY_BASE_FEE_CENTS[category]
        + round_half_up(weight_kg * WEIGHT_PER_KG_RATE[tier(weight_kg)])
        + (HAZMAT_SURCHARGE_CENTS if hazmat_flag else 0)
      where tier(weight_kg): w < 5.0 -> LIGHT (120 cents/kg);
                             5.0 <= w <= 20.0 -> MID (90 cents/kg);
                             w > 20.0 -> HEAVY (60 cents/kg)
      (average rate over the whole weight, tier selected by the item's total
      weight; boundaries 5.0 and 20.0 both land in MID).
      Sanitization fee (charged once per data-bearing item, both variants):
        QUOTE: SANITIZATION_FEE_CENTS[NIST_CLEAR] (default assumption)
        FINAL: SANITIZATION_FEE_CENTS[method of the item's latest VERIFIED DataSanitization]
      Pickup fee (per manifest, both variants): PICKUP_FEE_CENTS when mode=PICKUP else 0.
      total_fees_cents = sum of per-line fees (each already integer cents) + pickup fee
    input_set: "Items of the manifest with disposition == RECYCLE for recycling fees; all data-bearing items for sanitization fees; manifest mode for pickup fee"
    constants:
      CATEGORY_BASE_FEE_CENTS: { LAPTOP: 800, DESKTOP: 1000, SERVER: 2500, PHONE: 300, TABLET: 400, MONITOR: 1200, BATTERY: 1500, OTHER: 900 }
      WEIGHT_PER_KG_RATE: { LIGHT: 120, MID: 90, HEAVY: 60 }
      HAZMAT_SURCHARGE_CENTS: 2000
      SANITIZATION_FEE_CENTS: { CRYPTO_ERASE: 500, NIST_CLEAR: 700, NIST_PURGE: 1000, PHYSICAL_DESTROY: 1500 }
      PICKUP_FEE_CENTS: 15000
    precision: "integer cents; weight component round_half_up to whole cents per line; lines summed after rounding"

  - name: settlement_net_rebate
    trigger: "settlement finalization (FINAL) and QUOTE creation (same rule applied to QUOTE components)"
    algorithm: constraint_propagation
    formula: |
      Pinned evaluation order (breaks the apparent circularity — the rebate tier
      is keyed on the pre-rebate net, never on the post-rebate net):
        1. gross = gross_buyback_cents           (from settlement_valuation)
        2. fees  = total_fees_cents              (from item_recycling_fee)
        3. pre_rebate_net = gross - fees
        4. rebate_tier = GOLD if pre_rebate_net >= 500000
                         else SILVER if pre_rebate_net >= 100000
                         else NONE            (>= boundaries inclusive)
        5. volume_rebate_cents = round_half_up(pre_rebate_net * REBATE_RATE[rebate_tier])
           (only when pre_rebate_net > 0; non-positive pre-rebate net yields 0 rebate)
        6. net_amount_cents = pre_rebate_net + volume_rebate_cents
    input_set: "the settlement's computed gross and fee totals"
    constants:
      REBATE_RATE: { GOLD: 0.05, SILVER: 0.02, NONE: 0.0 }
      GOLD_FLOOR_CENTS: 500000
      SILVER_FLOOR_CENTS: 100000
    precision: "integer cents, round_half_up"

  - name: recycler_selection_score
    trigger: "on GET /itad/recyclers/{id} (risk_score field) and during selector-policy recycler choice at POST /itad/recycle-batches when recycler_id is omitted"
    algorithm: weighted_scoring
    formula: |
      days_remaining = whole days from current clock to certification_expires_at (floor of the seconds delta / 86400; negative allowed)
      cert_freshness = min(1, max(0, days_remaining / 365))
      volume_factor  = min(1, total_processed_kg / 10000)
      violation_free = max(0, 1 - violation_count / 10)
      risk_score = round_half_up_2dp( 100 * ( w_cert * cert_freshness
                                            + w_volume * volume_factor
                                            + w_viol * violation_free ) )
      weights (w_cert, w_volume, w_viol) come from the ACTIVE CompliancePolicy
      (weight_cert_freshness, weight_volume, weight_violations).
      Selector policy (when recycler_id omitted at batch creation):
        eligibility: Recycler.certification_expires_at strictly after scheduled_delivery_date
        ranking: risk_score DESC
        tie-break: total_processed_kg DESC, then created_at ASC (never id)
        empty pool: ERR_NO_ELIGIBLE_RECYCLER
    input_set: "all Recycler entities; policy weights from the single ACTIVE CompliancePolicy"
    constants:
      CERT_HORIZON_DAYS: 365
      VOLUME_SATURATION_KG: 10000
      VIOLATION_SATURATION: 10
    precision: "2 decimal places, round_half_up"
    variants:
      - name: r2_weighted
        when: "ACTIVE policy standard == R2 (e.g. weights 0.5 / 0.2 / 0.3)"
        difference: "certification freshness dominates; the same recycler stats produce a different score and possibly a different selector winner"
      - name: estewards_weighted
        when: "ACTIVE policy standard == E_STEWARDS (e.g. weights 0.3 / 0.2 / 0.5)"
        difference: "violation-free record dominates; ranking can flip versus r2_weighted for identical recycler stats"

  - name: sustainability_metrics
    trigger: "on GET /itad/accounts/{id}/sustainability-report"
    algorithm: aggregation
    formula: |
      total_items           = count of the account's Items (all processing states)
      total_weight_kg       = sum of weight_kg over those items (3dp)
      diverted_weight_kg    = sum of weight_kg over items in processing_status COMPLETE
      diversion_rate_pct    = round_half_up_2dp(100 * diverted_weight_kg / total_weight_kg); 0.0 when total_weight_kg == 0
      resale_proceeds_cents = sum of final_value_cents over COMPLETE items whose disposition in {RESALE, REFURB}
      recycling_fees_cents  = sum of item_recycling_fee line fees over COMPLETE items with disposition RECYCLE (FINAL fee basis)
      certificates_issued   = count of Certificate with cert_type DATA_DESTRUCTION, status ISSUED, on items of this account (VOIDED excluded)
    input_set: "account's Items (any state), their COMPLETE subset, and ISSUED DATA_DESTRUCTION certificates"
    constants: {}
    precision: "weights 3dp; rate 2dp round_half_up; money integer cents"

  - name: account_tier_threshold
    trigger: "every Item transition into COMPLETE (recycle process cascade or settlement finalize)"
    algorithm: threshold
    formula: |
      lifetime_diverted_kg += item.weight_kg   (running accumulation per completion)
      tier_target = ENTERPRISE if lifetime_diverted_kg >= 5000
                    else VOLUME if lifetime_diverted_kg >= 1000
                    else STANDARD            (>= boundaries inclusive; exactly 1000.0 triggers VOLUME)
      BusinessAccount.tier := max(current tier, tier_target) in rank order STANDARD < VOLUME < ENTERPRISE (never downgraded)
    input_set: "the completing item and its owning BusinessAccount"
    constants:
      VOLUME_THRESHOLD_KG: 1000
      ENTERPRISE_THRESHOLD_KG: 5000
    precision: "weight compared at 3 decimal places"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-Role is listed in the endpoint's roles", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "path ids resolve left-to-right (account, manifest, item, batch, settlement, listing, sanitization, certificate, recycler)", error_id: ERR_*_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: auth, check: "ownership: AccountManager may only touch its own account and resources beneath it (account_id == X-User-ID, or resource's manifest.account_id == X-User-ID)", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "AccountManager-facing endpoints" }
  - { priority: 5, category: business_constraint, check: "request body schema: required fields present, types match, enum members valid, weight_kg > 0, declared_item_count >= 1, asking_price_cents >= floor_price_cents, pickup_route present iff mode=PICKUP, scheduled_end > scheduled_start", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all mutating endpoints" }
  - { priority: 6, category: state, check: "OCC: expected_manifest_version equals Manifest.version on PATCH /itad/manifests/{id} and POST /itad/manifests/{id}/settlements", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["PATCH /itad/manifests/{id}", "POST /itad/manifests/{id}/settlements"] }
  - { priority: 7, category: state, check: "target resource state precondition of the transition (e.g. manifest DRAFT for schedule, batch STAGING for item add/remove, listing ACTIVE for sell, sanitization LOGGED for verify, settlement FINALIZED for pay/void, terminal states reject everything)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "action endpoints" }
  - { priority: 8, category: state, check: "batch item add/remove requires batch STAGING", error_id: ERR_BATCH_NOT_STAGING, http_status: 409, applies_to: ["POST /itad/recycle-batches/{id}/items", "DELETE /itad/recycle-batches/{id}/items/{item_id}"] }
  - { priority: 9, category: state, check: "triage requires owning manifest RECEIVED", error_id: ERR_MANIFEST_NOT_RECEIVED, http_status: 409, applies_to: ["POST /itad/items/{id}/triage"] }
  - { priority: 10, category: state, check: "sell requires listing ACTIVE", error_id: ERR_LISTING_NOT_ACTIVE, http_status: 409, applies_to: ["POST /itad/listings/{id}/sell"] }
  - { priority: 11, category: state, check: "pay/void require settlement FINALIZED", error_id: ERR_SETTLEMENT_NOT_FINALIZED, http_status: 409, applies_to: ["POST /itad/settlements/{id}/pay", "POST /itad/settlements/{id}/void"] }
  - { priority: 12, category: business_safety, check: "segregation of duties: sanitization verifier X-User-ID must differ from logged_by_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: ["POST /itad/sanitizations/{id}/verify"] }
  - { priority: 13, category: business_safety, check: "data gate: adding a data-bearing item to a batch or issuing a CODD always requires data_status VERIFIED; listing a data-bearing item requires VERIFIED when the ACTIVE policy resale_requires_verified_sanitization is true (strict default, also when no policy is active), and requires SANITIZED or VERIFIED when the flag is false", error_id: ERR_DATA_SANITIZATION_UNVERIFIED, http_status: 422, applies_to: ["POST /itad/listings", "POST /itad/recycle-batches/{id}/items", "POST /itad/items/{id}/certificates"] }
  - { priority: 14, category: business_safety, check: "export ban: batch is_export=true rejected while ACTIVE policy export_allowed=false", error_id: ERR_EXPORT_NOT_ALLOWED, http_status: 422, applies_to: ["POST /itad/recycle-batches"] }
  - { priority: 15, category: business_safety, check: "sanitization method must be in the ACTIVE policy's sanitization_methods_allowed", error_id: ERR_SANITIZATION_METHOD_NOT_ALLOWED, http_status: 422, applies_to: ["POST /itad/items/{id}/sanitizations"] }
  - { priority: 16, category: business_referential, check: "account must be ACTIVE to create a manifest", error_id: ERR_ACCOUNT_SUSPENDED, http_status: 422, applies_to: ["POST /itad/manifests", "POST /itad/manifests/{id}/schedule"] }
  - { priority: 17, category: business_referential, check: "recycler must list the item's category in accepted_categories", error_id: ERR_RECYCLER_CATEGORY_UNSUPPORTED, http_status: 422, applies_to: ["POST /itad/recycle-batches/{id}/items"] }
  - { priority: 18, category: business_referential, check: "batch add requires item disposition == RECYCLE and processing_status == FOR_RECYCLE", error_id: ERR_ITEM_NOT_RECYCLE_ROUTED, http_status: 422, applies_to: ["POST /itad/recycle-batches/{id}/items"] }
  - { priority: 19, category: business_referential, check: "listing return requires no settlement of the manifest in {FINALIZED, PAID}", error_id: ERR_SETTLEMENT_ALREADY_FINALIZED, http_status: 422, applies_to: ["POST /itad/listings/{id}/return"] }
  - { priority: 20, category: business_referential, check: "selector policy: no eligible recycler for the requested delivery date", error_id: ERR_NO_ELIGIBLE_RECYCLER, http_status: 422, applies_to: ["POST /itad/recycle-batches"] }
  - { priority: 21, category: business_temporal, check: "schedule requires scheduled_end strictly after current clock", error_id: ERR_WINDOW_IN_PAST, http_status: 422, applies_to: ["POST /itad/manifests/{id}/schedule"] }
  - { priority: 22, category: business_temporal, check: "pickup route half-open window overlap on the same pickup_route among manifests in {SCHEDULED, RECEIVED}; adjacency allowed", error_id: ERR_ROUTE_WINDOW_CONFLICT, http_status: 409, applies_to: ["POST /itad/manifests/{id}/schedule"] }
  - { priority: 23, category: business_temporal, check: "recycler certification_expires_at must be strictly after the batch scheduled_delivery_date, at creation and again at ship", error_id: ERR_RECYCLER_CERT_EXPIRED, http_status: 422, applies_to: ["POST /itad/recycle-batches", "POST /itad/recycle-batches/{id}/ship"] }
  - { priority: 24, category: business_temporal, check: "recycler daily intake: total gross weight of batches in {IN_TRANSIT, DELIVERED, PROCESSED} for the same recycler and delivery calendar day plus this batch must be <= daily_intake_capacity_kg (equality allowed)", error_id: ERR_RECYCLER_DAILY_CAPACITY_EXCEEDED, http_status: 422, applies_to: ["POST /itad/recycle-batches/{id}/ship"] }
  - { priority: 25, category: business_constraint, check: "reconcile requires received_item_count >= 1", error_id: ERR_MANIFEST_EMPTY, http_status: 422, applies_to: ["POST /itad/manifests/{id}/reconcile"] }
  - { priority: 26, category: business_constraint, check: "reconcile requires received_item_count == declared_item_count", error_id: ERR_MANIFEST_ITEM_COUNT_MISMATCH, http_status: 422, applies_to: ["POST /itad/manifests/{id}/reconcile"] }
  - { priority: 27, category: business_constraint, check: "cancel requires received_item_count == 0", error_id: ERR_MANIFEST_HAS_ITEMS, http_status: 422, applies_to: ["POST /itad/manifests/{id}/cancel"] }
  - { priority: 28, category: business_constraint, check: "ship requires item_count >= 1", error_id: ERR_BATCH_EMPTY, http_status: 422, applies_to: ["POST /itad/recycle-batches/{id}/ship"] }
  - { priority: 29, category: business_constraint, check: "finalize requires every manifest item in {SOLD, COMPLETE}", error_id: ERR_FINALIZE_ITEMS_PENDING, http_status: 422, applies_to: ["POST /itad/settlements/{id}/finalize"] }
  - { priority: 30, category: business_constraint, check: "close requires every non-SUPERSEDED settlement in {PAID, VOIDED} and at least one settlement", error_id: ERR_CLOSE_SETTLEMENT_UNPAID, http_status: 422, applies_to: ["POST /itad/manifests/{id}/close"] }
  - { priority: 31, category: business_fiscal, check: "sale_price_cents >= floor_price_cents on sell", error_id: ERR_FLOOR_PRICE_VIOLATION, http_status: 422, applies_to: ["POST /itad/listings/{id}/sell"] }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/itad/accounts", description: "Create a business ITAD account", roles: [PlatformAdmin], code: 201, input: [company_name, contact_email, "tier?"], output: BusinessAccount, side_effects: ["status ACTIVE, tier default STANDARD, balances zero"] }
  - { method: GET, path: "/itad/accounts/{id}", description: "Read one account incl. computed credit_balance_cents and lifetime_diverted_kg", roles: [PlatformAdmin, AccountManager, ComplianceOfficer], code: 200, input: [], output: BusinessAccount, side_effects: [] }
  - { method: PATCH, path: "/itad/accounts/{id}", description: "Update tier and/or drive status transitions (SUSPENDED/ACTIVE/CLOSED)", roles: [PlatformAdmin], code: 200, input: ["tier?", "status?"], output: BusinessAccount, side_effects: ["account state machine", "increments BusinessAccount.version by 1"] }
  - { method: GET, path: "/itad/accounts/{id}/manifests", description: "List manifests of an account, ordered created_at ASC", roles: [PlatformAdmin, AccountManager], code: 200, input: ["status?", "limit?", "offset?"], output: "Manifest[]", side_effects: [] }
  - { method: GET, path: "/itad/accounts/{id}/ledger-entries", description: "List ledger entries of an account, ordered created_at ASC", roles: [PlatformAdmin, AccountManager], code: 200, input: ["limit?", "offset?"], output: "LedgerEntry[]", side_effects: [] }
  - { method: GET, path: "/itad/accounts/{id}/sustainability-report", description: "Computed ESG/compliance report per calculations.sustainability_metrics", roles: [PlatformAdmin, AccountManager, ComplianceOfficer], code: 200, input: [], output: { total_items: integer, total_weight_kg: number, diverted_weight_kg: number, diversion_rate_pct: number, resale_proceeds_cents: integer, recycling_fees_cents: integer, certificates_issued: integer }, side_effects: [] }
  - { method: POST, path: "/itad/recyclers", description: "Register a certified downstream recycler", roles: [ComplianceOfficer], code: 201, input: [name, certification_standard, certification_expires_at, accepted_categories, daily_intake_capacity_kg, "violation_count?"], output: Recycler, side_effects: [] }
  - { method: GET, path: "/itad/recyclers/{id}", description: "Read one recycler incl. computed risk_score (vs ACTIVE policy weights) and total_processed_kg", roles: [PlatformAdmin, ComplianceOfficer, LogisticsCoordinator], code: 200, input: [], output: Recycler, side_effects: ["risk_score computed per recycler_selection_score"] }
  - { method: GET, path: "/itad/recyclers/{id}/recycle-batches", description: "List batches routed to a recycler", roles: [PlatformAdmin, ComplianceOfficer, LogisticsCoordinator], code: 200, input: ["status?", "limit?", "offset?"], output: "RecycleBatch[]", side_effects: [] }
  - { method: POST, path: "/itad/compliance-policies", description: "Create a compliance policy; creating with is_active=true deactivates all others", roles: [PlatformAdmin], code: 201, input: [standard, sanitization_methods_allowed, export_allowed, resale_requires_verified_sanitization, is_active, weight_cert_freshness, weight_volume, weight_violations], output: CompliancePolicy, side_effects: ["if is_active: all other policies is_active := false"] }
  - { method: GET, path: "/itad/compliance-policies", description: "List compliance policies, ordered created_at ASC", roles: [PlatformAdmin, ComplianceOfficer], code: 200, input: ["limit?", "offset?"], output: "CompliancePolicy[]", side_effects: [] }
  - { method: POST, path: "/itad/manifests", description: "Create a DRAFT manifest for an account (AccountManager acts on own account only)", roles: [AccountManager], code: 201, input: [account_id, mode, "pickup_route?", "scheduled_start?", "scheduled_end?", declared_item_count], output: Manifest, side_effects: ["status DRAFT"] }
  - { method: GET, path: "/itad/manifests/{id}", description: "Read one manifest", roles: [PlatformAdmin, AccountManager, IntakeOperator, LogisticsCoordinator], code: 200, input: [], output: Manifest, side_effects: [] }
  - { method: PATCH, path: "/itad/manifests/{id}", description: "Amend a DRAFT manifest (window/route/declared count) under OCC", roles: [AccountManager], code: 200, input: [expected_manifest_version, "pickup_route?", "scheduled_start?", "scheduled_end?", "declared_item_count?"], output: Manifest, side_effects: ["OCC per concurrency_rules[manifest-amend-stale-version]", "increments Manifest.version by 1"] }
  - { method: POST, path: "/itad/manifests/{id}/schedule", description: "DRAFT -> SCHEDULED with route-window overlap and window-in-past checks", roles: [LogisticsCoordinator], code: 200, input: [], output: Manifest, side_effects: ["increments Manifest.version by 1"] }
  - { method: POST, path: "/itad/manifests/{id}/receive", description: "SCHEDULED -> RECEIVED; writes RECEIVED_FACILITY custody event", roles: [IntakeOperator], code: 200, input: [], output: Manifest, side_effects: ["custody event", "increments Manifest.version by 1"] }
  - { method: POST, path: "/itad/manifests/{id}/reconcile", description: "RECEIVED -> RECONCILED after count and triage checks", roles: [IntakeOperator], code: 200, input: [], output: Manifest, side_effects: ["increments Manifest.version by 1"] }
  - { method: POST, path: "/itad/manifests/{id}/close", description: "RECONCILED -> CLOSED once settlements are PAID/VOIDED", roles: [AccountManager], code: 200, input: [], output: Manifest, side_effects: ["increments Manifest.version by 1"] }
  - { method: POST, path: "/itad/manifests/{id}/cancel", description: "DRAFT/SCHEDULED -> CANCELLED (only with zero scanned items)", roles: [AccountManager], code: 200, input: [], output: Manifest, side_effects: ["increments Manifest.version by 1"] }
  - { method: POST, path: "/itad/manifests/{id}/items", description: "Scan/pre-declare an item into a manifest (allowed in DRAFT and RECEIVED)", roles: [IntakeOperator], code: 201, input: [serial_number, category, weight_kg, data_bearing, hazmat_flag, declared_grade], output: Item, side_effects: ["item INTAKE; data_status PENDING if data_bearing else NOT_REQUIRED", "received_item_count recomputed", "increments Manifest.version by 1"] }
  - { method: GET, path: "/itad/manifests/{id}/items", description: "List items of a manifest", roles: [PlatformAdmin, AccountManager, IntakeOperator, LogisticsCoordinator, ComplianceOfficer], code: 200, input: ["processing_status?", "limit?", "offset?"], output: "Item[]", side_effects: [] }
  - { method: GET, path: "/itad/manifests/{id}/settlements", description: "List settlements of a manifest", roles: [PlatformAdmin, AccountManager, IntakeOperator], code: 200, input: ["limit?", "offset?"], output: "Settlement[]", side_effects: [] }
  - { method: GET, path: "/itad/items/{id}", description: "Read one item", roles: [PlatformAdmin, AccountManager, IntakeOperator, LogisticsCoordinator, ComplianceOfficer, DestructionTechnician], code: 200, input: [], output: Item, side_effects: [] }
  - { method: POST, path: "/itad/items/{id}/triage", description: "Route an item: INTAKE -> FOR_<disposition>, plus FOR_REFURB/FOR_RESALE reroutes", roles: [IntakeOperator], code: 200, input: [disposition], output: Item, side_effects: ["item state machine", "provisional_value_cents recompute", "increments Item.version by 1"] }
  - { method: POST, path: "/itad/items/{id}/sanitizations", description: "Log a data-destruction attempt on a triaged data-bearing item", roles: [DestructionTechnician], code: 201, input: [method, outcome], output: DataSanitization, side_effects: ["record LOGGED with logged_by_id := X-User-ID", "item.data_status := SANITIZED when outcome=PASS (stays PENDING on FAIL)"] }
  - { method: GET, path: "/itad/items/{id}/sanitizations", description: "List sanitization records of an item", roles: [PlatformAdmin, ComplianceOfficer, DestructionTechnician, IntakeOperator], code: 200, input: ["limit?", "offset?"], output: "DataSanitization[]", side_effects: [] }
  - { method: POST, path: "/itad/sanitizations/{id}/verify", description: "Verify (APPROVE) or reject (REJECT) a LOGGED sanitization; verifier must differ from logger", roles: [ComplianceOfficer], code: 200, input: [verdict], output: DataSanitization, side_effects: ["sanitization state machine", "item.data_status VERIFIED on APPROVE, PENDING on REJECT"] }
  - { method: POST, path: "/itad/items/{id}/certificates", description: "Issue a Certificate of Data Destruction (cert_type must be DATA_DESTRUCTION)", roles: [ComplianceOfficer], code: 201, input: [cert_type], output: Certificate, side_effects: ["certificate ISSUED with server-minted certificate_number"] }
  - { method: GET, path: "/itad/items/{id}/certificates", description: "List certificates of an item", roles: [PlatformAdmin, ComplianceOfficer, AccountManager, IntakeOperator], code: 200, input: ["limit?", "offset?"], output: "Certificate[]", side_effects: [] }
  - { method: POST, path: "/itad/listings", description: "Create an ACTIVE resale listing for a FOR_RESALE item", roles: [IntakeOperator], code: 201, input: [item_id, asking_price_cents, floor_price_cents, channel], output: ResaleListing, side_effects: ["item FOR_RESALE -> LISTED"] }
  - { method: GET, path: "/itad/items/{id}/listings", description: "List listings of an item", roles: [PlatformAdmin, IntakeOperator, AccountManager], code: 200, input: ["limit?", "offset?"], output: "ResaleListing[]", side_effects: [] }
  - { method: POST, path: "/itad/listings/{id}/sell", description: "ACTIVE -> SOLD at sale_price_cents (>= floor)", roles: [IntakeOperator], code: 200, input: [sale_price_cents], output: ResaleListing, side_effects: ["item LISTED -> SOLD", "per-line final_value_cents computed"] }
  - { method: POST, path: "/itad/listings/{id}/return", description: "SOLD -> RETURNED; item back to FOR_RESALE; QUOTE recomputed", roles: [IntakeOperator], code: 200, input: [], output: ResaleListing, side_effects: ["return cascade (item revert, QUOTE recompute)"] }
  - { method: POST, path: "/itad/listings/{id}/relist", description: "RETURNED -> ACTIVE (cycle); item back to LISTED", roles: [IntakeOperator], code: 200, input: [], output: ResaleListing, side_effects: ["item FOR_RESALE -> LISTED"] }
  - { method: POST, path: "/itad/listings/{id}/withdraw", description: "ACTIVE -> WITHDRAWN (terminal); item back to FOR_RESALE", roles: [IntakeOperator], code: 200, input: [], output: ResaleListing, side_effects: ["item LISTED -> FOR_RESALE"] }
  - { method: POST, path: "/itad/recycle-batches", description: "Create a STAGING batch; recycler_id optional — selector policy picks by risk_score when omitted", roles: [LogisticsCoordinator], code: 201, input: ["recycler_id?", scheduled_delivery_date, is_export], output: RecycleBatch, side_effects: ["selector policy per recycler_selection_score when recycler_id omitted"] }
  - { method: GET, path: "/itad/recycle-batches/{id}", description: "Read one batch", roles: [PlatformAdmin, LogisticsCoordinator, ComplianceOfficer], code: 200, input: [], output: RecycleBatch, side_effects: [] }
  - { method: GET, path: "/itad/recycle-batches/{id}/items", description: "List items in a batch", roles: [PlatformAdmin, LogisticsCoordinator, ComplianceOfficer], code: 200, input: ["limit?", "offset?"], output: "Item[]", side_effects: [] }
  - { method: POST, path: "/itad/recycle-batches/{id}/items", description: "Add a FOR_RECYCLE item to a STAGING batch", roles: [LogisticsCoordinator], code: 200, input: [item_id], output: RecycleBatch, side_effects: ["item FOR_RECYCLE -> BATCHED", "gross_weight_kg/item_count recompute", "custody TRANSFERRED event", "increments RecycleBatch.version by 1"] }
  - { method: DELETE, path: "/itad/recycle-batches/{id}/items/{item_id}", description: "Remove an item from a STAGING batch (compensating action)", roles: [LogisticsCoordinator], code: 204, input: [], output: null, side_effects: ["item BATCHED -> FOR_RECYCLE", "gross_weight_kg/item_count recompute", "increments RecycleBatch.version by 1"] }
  - { method: POST, path: "/itad/recycle-batches/{id}/ship", description: "STAGING -> IN_TRANSIT; cert validity and daily-capacity checks; items -> DOWNSTREAM", roles: [LogisticsCoordinator], code: 200, input: [], output: RecycleBatch, side_effects: ["items BATCHED -> DOWNSTREAM", "custody SHIPPED_DOWNSTREAM event", "increments RecycleBatch.version by 1"] }
  - { method: POST, path: "/itad/recycle-batches/{id}/deliver", description: "IN_TRANSIT -> DELIVERED (downstream receipt acknowledgment)", roles: [ComplianceOfficer], code: 200, input: [], output: RecycleBatch, side_effects: ["custody DELIVERED_DOWNSTREAM event", "increments RecycleBatch.version by 1"] }
  - { method: POST, path: "/itad/recycle-batches/{id}/process", description: "DELIVERED -> PROCESSED; full completion cascade incl. COR auto-issue and tier check", roles: [ComplianceOfficer], code: 200, input: [], output: RecycleBatch, side_effects: ["process cascade links 1-3 per state machine", "increments RecycleBatch.version by 1"] }
  - { method: GET, path: "/itad/recycle-batches/{id}/certificates", description: "List certificates of a batch (the auto-issued COR)", roles: [PlatformAdmin, ComplianceOfficer, LogisticsCoordinator], code: 200, input: ["limit?", "offset?"], output: "Certificate[]", side_effects: [] }
  - { method: POST, path: "/itad/manifests/{id}/settlements", description: "Create/recalculate a QUOTE settlement under OCC; supersedes the prior QUOTE_OPEN", roles: [IntakeOperator], code: 201, input: [expected_manifest_version], output: Settlement, side_effects: ["OCC per concurrency_rules[settlement-requote-stale-manifest]", "prior QUOTE_OPEN -> SUPERSEDED with supersedes link", "QUOTE variant computes gross_buyback_cents/total_fees_cents/volume_rebate_cents/net_amount_cents", "increments Manifest.version by 1"] }
  - { method: GET, path: "/itad/settlements/{id}", description: "Read one settlement", roles: [PlatformAdmin, AccountManager, IntakeOperator], code: 200, input: [], output: Settlement, side_effects: [] }
  - { method: GET, path: "/itad/settlements", description: "List settlements (supports supersedes-chain lookup)", roles: [PlatformAdmin, AccountManager, IntakeOperator], code: 200, input: ["supersedes_settlement_id?", "limit?", "offset?"], output: "Settlement[]", side_effects: [] }
  - { method: POST, path: "/itad/settlements/{id}/finalize", description: "QUOTE_OPEN -> FINALIZED; FINAL variant, SOLD items -> COMPLETE, ledger posting", roles: [PlatformAdmin], code: 200, input: [], output: Settlement, side_effects: ["finalize side effects per state machine (items, ledger, balance)"] }
  - { method: POST, path: "/itad/settlements/{id}/pay", description: "FINALIZED -> PAID; posts PAYOUT_DEBIT clearing the credited net", roles: [PlatformAdmin], code: 200, input: [], output: Settlement, side_effects: ["PAYOUT_DEBIT ledger entry", "credit_balance_cents -= net_amount_cents"] }
  - { method: POST, path: "/itad/settlements/{id}/void", description: "FINALIZED -> VOIDED; posts negating REVERSAL entries (compensating invariant)", roles: [PlatformAdmin], code: 200, input: [], output: Settlement, side_effects: ["REVERSAL ledger entries restore pre-finalize balance"] }
  - { method: GET, path: "/itad/settlements/{id}/ledger-entries", description: "List ledger entries produced by a settlement, ordered created_at ASC", roles: [PlatformAdmin, AccountManager], code: 200, input: ["limit?", "offset?"], output: "LedgerEntry[]", side_effects: [] }
  - { method: POST, path: "/itad/certificates/{id}/void", description: "ISSUED -> VOIDED", roles: [ComplianceOfficer], code: 200, input: [], output: Certificate, side_effects: ["excluded from sustainability-report certificates_issued"] }
  - { method: GET, path: "/itad/custody-events", description: "Query the append-only custody trail by subject, ordered created_at ASC", roles: [PlatformAdmin, ComplianceOfficer, IntakeOperator, LogisticsCoordinator, AccountManager], code: 200, input: [subject_type, subject_id, "limit?", "offset?"], output: "CustodyEvent[]", side_effects: [] }
  - { method: POST, path: "/itad/_clock/set_current_utc", description: "Test-driving logical clock. Server startup default is exactly 2026-05-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock time.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["sets the logical clock used by all temporal validations and score computations"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "role not permitted on endpoint, or AccountManager touching another account's resource" }
  - { id: ERR_VALIDATION, http: 400, condition: "missing required field, type mismatch, invalid enum member, weight_kg <= 0, declared_item_count < 1, asking < floor, missing pickup_route for PICKUP, scheduled_end <= scheduled_start" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "no BusinessAccount with the given id" }
  - { id: ERR_RECYCLER_NOT_FOUND, http: 404, condition: "no Recycler with the given id" }
  - { id: ERR_MANIFEST_NOT_FOUND, http: 404, condition: "no Manifest with the given id" }
  - { id: ERR_ITEM_NOT_FOUND, http: 404, condition: "no Item with the given id" }
  - { id: ERR_BATCH_NOT_FOUND, http: 404, condition: "no RecycleBatch with the given id" }
  - { id: ERR_SETTLEMENT_NOT_FOUND, http: 404, condition: "no Settlement with the given id" }
  - { id: ERR_LISTING_NOT_FOUND, http: 404, condition: "no ResaleListing with the given id" }
  - { id: ERR_SANITIZATION_NOT_FOUND, http: 404, condition: "no DataSanitization with the given id" }
  - { id: ERR_CERTIFICATE_NOT_FOUND, http: 404, condition: "no Certificate with the given id" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_manifest_version does not match the manifest's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "generic state precondition failure: transition not allowed from the current state, terminal-state lockdown, account close with open manifests/balance, verify of a FAIL outcome" }
  - { id: ERR_BATCH_NOT_STAGING, http: 409, condition: "batch item add/remove attempted while batch not STAGING" }
  - { id: ERR_MANIFEST_NOT_RECEIVED, http: 409, condition: "triage attempted while owning manifest not RECEIVED" }
  - { id: ERR_LISTING_NOT_ACTIVE, http: 409, condition: "sell attempted on a listing not ACTIVE" }
  - { id: ERR_SETTLEMENT_NOT_FINALIZED, http: 409, condition: "pay/void attempted on a settlement not FINALIZED" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "sanitization verifier X-User-ID equals logged_by_id" }
  - { id: ERR_DATA_SANITIZATION_UNVERIFIED, http: 422, condition: "data-bearing item listed, batched, or CODD-issued without data_status VERIFIED" }
  - { id: ERR_EXPORT_NOT_ALLOWED, http: 422, condition: "is_export batch created while the ACTIVE policy forbids export" }
  - { id: ERR_SANITIZATION_METHOD_NOT_ALLOWED, http: 422, condition: "sanitization method not in the ACTIVE policy's allowed list" }
  - { id: ERR_ACCOUNT_SUSPENDED, http: 422, condition: "manifest creation against a SUSPENDED account" }
  - { id: ERR_RECYCLER_CATEGORY_UNSUPPORTED, http: 422, condition: "item category not in the batch recycler's accepted_categories" }
  - { id: ERR_ITEM_NOT_RECYCLE_ROUTED, http: 422, condition: "batch add of an item whose disposition is not RECYCLE or not in FOR_RECYCLE" }
  - { id: ERR_SETTLEMENT_ALREADY_FINALIZED, http: 422, condition: "listing return (or new QUOTE) attempted while a settlement of the manifest is FINALIZED or PAID" }
  - { id: ERR_NO_ELIGIBLE_RECYCLER, http: 422, condition: "selector pool empty: no recycler with certification strictly valid at scheduled_delivery_date" }
  - { id: ERR_WINDOW_IN_PAST, http: 422, condition: "schedule attempted with scheduled_end not strictly after the current clock" }
  - { id: ERR_ROUTE_WINDOW_CONFLICT, http: 409, condition: "PICKUP manifest window overlaps another SCHEDULED/RECEIVED manifest on the same pickup_route (half-open overlap; adjacency allowed)" }
  - { id: ERR_RECYCLER_CERT_EXPIRED, http: 422, condition: "recycler certification not strictly valid at the batch scheduled_delivery_date (checked at batch creation and at ship)" }
  - { id: ERR_RECYCLER_DAILY_CAPACITY_EXCEEDED, http: 422, condition: "shipping would push the recycler's same-day accepted gross weight strictly above daily_intake_capacity_kg" }
  - { id: ERR_MANIFEST_EMPTY, http: 422, condition: "reconcile attempted with zero scanned items" }
  - { id: ERR_MANIFEST_ITEM_COUNT_MISMATCH, http: 422, condition: "reconcile attempted with received_item_count != declared_item_count (and >= 1 item present)" }
  - { id: ERR_MANIFEST_HAS_ITEMS, http: 422, condition: "cancel attempted after items were scanned into the manifest" }
  - { id: ERR_BATCH_EMPTY, http: 422, condition: "ship attempted with zero items in the batch" }
  - { id: ERR_FINALIZE_ITEMS_PENDING, http: 422, condition: "finalize attempted while any manifest item is outside {SOLD, COMPLETE}" }
  - { id: ERR_CLOSE_SETTLEMENT_UNPAID, http: 422, condition: "close attempted with no settlement or a non-SUPERSEDED settlement outside {PAID, VOIDED}" }
  - { id: ERR_FLOOR_PRICE_VIOLATION, http: 422, condition: "sale_price_cents below floor_price_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator: accounts, compliance policies, settlement finalization/payout/void, logical clock"
    identity: opaque
    exclusive_operations: ["POST /itad/accounts", "PATCH /itad/accounts/{id}", "POST /itad/compliance-policies", "POST /itad/settlements/{id}/finalize", "POST /itad/settlements/{id}/pay", "POST /itad/settlements/{id}/void", "POST /itad/_clock/set_current_utc"]
    shared_operations: ["read endpoints across all resources"]
  - name: ComplianceOfficer
    description: "Certification and audit authority: recycler registry, sanitization verification, certificates, downstream delivery/processing acknowledgment"
    identity: opaque
    exclusive_operations: ["POST /itad/recyclers", "POST /itad/sanitizations/{id}/verify", "POST /itad/items/{id}/certificates", "POST /itad/certificates/{id}/void", "POST /itad/recycle-batches/{id}/deliver", "POST /itad/recycle-batches/{id}/process"]
    shared_operations: ["GET reads on recyclers, policies, items, batches, certificates, custody events, reports"]
  - name: AccountManager
    description: "Business customer contact: creates/amends manifests for their own account, closes manifests, reads own ledger/reports"
    identity: "entity_backed:BusinessAccount"
    exclusive_operations: ["POST /itad/manifests", "PATCH /itad/manifests/{id}", "POST /itad/manifests/{id}/close", "POST /itad/manifests/{id}/cancel"]
    shared_operations: ["GET reads on own account, manifests, items, settlements, ledger, report, custody events"]
  - name: IntakeOperator
    description: "Facility intake staff: receives and reconciles manifests, scans and triages items, runs resale listings, drafts settlement quotes"
    identity: opaque
    exclusive_operations: ["POST /itad/manifests/{id}/receive", "POST /itad/manifests/{id}/reconcile", "POST /itad/manifests/{id}/items", "POST /itad/items/{id}/triage", "POST /itad/listings", "POST /itad/listings/{id}/sell", "POST /itad/listings/{id}/return", "POST /itad/listings/{id}/relist", "POST /itad/listings/{id}/withdraw", "POST /itad/manifests/{id}/settlements"]
    shared_operations: ["GET reads on manifests, items, settlements, custody events"]
  - name: DestructionTechnician
    description: "Data-destruction technician: logs sanitization attempts; may never verify own work (segregation of duties)"
    identity: opaque
    exclusive_operations: ["POST /itad/items/{id}/sanitizations"]
    shared_operations: ["GET /itad/items/{id}", "GET /itad/items/{id}/sanitizations"]
  - name: LogisticsCoordinator
    description: "Logistics planner: schedules manifests, builds and ships downstream recycle batches"
    identity: opaque
    exclusive_operations: ["POST /itad/manifests/{id}/schedule", "POST /itad/recycle-batches", "POST /itad/recycle-batches/{id}/items", "DELETE /itad/recycle-batches/{id}/items/{item_id}", "POST /itad/recycle-batches/{id}/ship"]
    shared_operations: ["GET reads on manifests, recyclers, batches, items, custody events"]
