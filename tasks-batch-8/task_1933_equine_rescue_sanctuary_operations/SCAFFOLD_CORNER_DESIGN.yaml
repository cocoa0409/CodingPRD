      - name: over_receipt_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=24]", "errors[ERR_OVER_RECEIPT]", state_machines.PurchaseOrder]
        distinguishing_aspect: "Receiving past the ordered quantity fails ERR_OVER_RECEIPT; receiving exactly the remainder closes the order (PARTIALLY_RECEIVED -> RECEIVED)."
        test_recipe:
          setup: ["PurchaseOrder PO: 100 lbs GRAIN @ 10 cents, ORDERED; 60 lbs already received"]
          setup_api_calls:
            - { call: "POST /rescue-ops/purchase-orders", payload: { feed_type: GRAIN, quantity_lbs: 100, unit_cents_per_lb: 10 }, as: BarnManager, captures: { po: $.data.id } }
            - { call: "POST /rescue-ops/purchase-orders/${po}/mark-ordered", payload: {}, as: BarnManager }
            - { call: "POST /rescue-ops/purchase-orders/${po}/receive", payload: { quantity_received_lbs: 60, expiry_date: "2026-10-01T00:00:00Z" }, as: BarnManager, captures: { st1: $.data.status } }
          trigger:
            - { call: "POST /rescue-ops/purchase-orders/${po}/receive", payload: { quantity_received_lbs: 50, expiry_date: "2026-10-02T00:00:00Z" }, as: BarnManager, captures: { err: $.data.error_id } }
            - { call: "POST /rescue-ops/purchase-orders/${po}/receive", payload: { quantity_received_lbs: 40, expiry_date: "2026-10-02T00:00:00Z" }, as: BarnManager, captures: { st2: $.data.status, recv: $.data.received_lbs } }
          assert:
            - "st1 == PARTIALLY_RECEIVED after 60/100"
            - "err == ERR_OVER_RECEIPT (60 + 50 > 100)"
            - "st2 == RECEIVED AND recv == 100 (exact remainder accepted)"

