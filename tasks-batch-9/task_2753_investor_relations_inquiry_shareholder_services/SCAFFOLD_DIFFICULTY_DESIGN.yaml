  - rule_id: resource_temporal_overlap
    instances:
      - name: contact_meeting_buffer_thirty_minute_gap_is_allowed
        grounds:
          - validations[priority=14]
          - errors[ERR_CONTACT_DOUBLE_BOOKED]
          - entities.MeetingRequest.fields.requested_slot_start
          - endpoints[POST /meeting-requests]
        distinguishing_aspect: |
          Contact is the occupied resource and the interval arithmetic is half-open with a symmetric
          30-minute buffer: against a stored 14:00-14:30 slot a new 14:59-15:29 slot collides
          (14:59 < 15:00 = stored_end + 30min) while a new 15:00-15:30 slot with a gap of exactly
          30 minutes is accepted — adjacency at the buffer edge is legal.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Issuer BUF with one INSTITUTIONAL_HOLDER contact holding 20,000 shares, nda_on_file true."
            - "One CONFERENCE event OPEN_FOR_REQUESTS, window 2026-09-01T13:00:00Z to 2026-09-01T18:00:00Z, slot_minutes 30, capacity_slots 5."
            - "The contact already holds a REQUESTED request for 14:00-14:30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
            - call: "POST /companies"
              payload: { ticker: "BUF", legal_name: "Buffer Semantics Corp", shares_outstanding: 1000000 }
