              as: CarrierAdmin
              as_user_id: "${carrier2_id}"
            - call: "POST /credit-report-events"
              payload: { broker_org_id: "${broker_r_id}", invoice_amount_cents: 100000, days_to_pay: 80 }
              as: CarrierAdmin
              as_user_id: "${carrier2_id}"
            - call: "POST /credit-report-events"
              payload: { broker_org_id: "${broker_r_id}", invoice_amount_cents: 100000, days_to_pay: 80 }
              as: CarrierAdmin
              as_user_id: "${carrier2_id}"
            - call: "POST /credit-report-events"
              payload: { broker_org_id: "${broker_r_id}", invoice_amount_cents: 100000, days_to_pay: 80 }
              as: CarrierAdmin
              as_user_id: "${carrier2_id}"
            - call: "POST /credit-report-events"
              payload: { broker_org_id: "${broker_r_id}", invoice_amount_cents: 100000, days_to_pay: 80 }
