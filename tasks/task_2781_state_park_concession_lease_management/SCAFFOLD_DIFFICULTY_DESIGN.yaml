  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: bond_penal_sum_conserved_across_draw_then_full_reinstatement
        grounds:
          - state_machines.PerformanceBond.ACTIVE_to_PARTIALLY_DRAWN
          - state_machines.PerformanceBond.PARTIALLY_DRAWN_to_ACTIVE
          - state_machines.ComplianceAction.NOTICE_ISSUED_to_BOND_DRAW_ORDERED
          - constants.BOND_SUFFICIENCY_PCT
          - entities.PerformanceBond.fields.available_balance_cents
          - entities.PerformanceBond.fields.drawn_total_cents
          - entities.PerformanceBond.fields.penal_sum_cents
        distinguishing_aspect: |
          The conserved quantity is the bond's penal sum: available_balance_cents +
          drawn_total_cents must equal penal_sum_cents after the draw AND after the
          reinstatement, and penal_sum_cents itself must never move. An implementation that
          "restores" the bond by re-adding the reinstatement to penal_sum_cents, or that
          debits penal_sum_cents on the draw, breaks the identity even though every status
          transition looks right.
        test_recipe:
          setup:
            - "The canonical ACTIVE lease with an ACTIVE bond of penal_sum 3,000,000 (required_amount 3,000,000, so the sufficiency floor is 50% of 3,000,000 = 1,500,000)."
            - "An officer-issued OPERATING_STANDARD compliance action on the lease with cure_deadline 2027-03-04T00:00:00Z and no reconciliation_id, which turned the lease DEFICIENT."
            - "The clock is moved to 2027-03-05, one day past the cure deadline, and the officer orders a 1,000,000 draw: 3,000,000 - 1,000,000 = 2,000,000 which is still at or above the 1,500,000 floor, so the bond lands in PARTIALLY_DRAWN and no default is declared."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
