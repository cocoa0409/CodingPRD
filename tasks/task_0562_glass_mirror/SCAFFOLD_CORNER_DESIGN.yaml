  # ==========================================================================
  - section: rbac
    instances:
      - name: estimator_cannot_create_account_returns_forbidden
        claim_type: peer_roles
        grounds: [roles.Estimator, roles.ShopAdmin, "endpoints POST /contractor-accounts"]
        distinguishing_aspect: "Estimator calling POST /contractor-accounts (ShopAdmin-exclusive) -> ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /contractor-accounts"
              payload: { company_name: "Acme", tier: "SILVER", credit_limit_cents: 100000 }
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN"

      - name: contractor_cannot_accept_other_accounts_quote
        claim_type: peer_roles
        grounds: [roles.Contractor, "validations[priority=2]"]
        distinguishing_aspect: "Contractor whose X-User-ID != quote.contractor_account_id accepting the quote -> ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["A SENT quote on account A; a second account B exists."]
          setup_api_calls:
            - call: "POST /contractor-accounts"
              payload: { company_name: "AcmeA", tier: "SILVER", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { acctA_id: $.data.id, acctA_v0: $.data.version }
            - call: "POST /contractor-accounts"
              payload: { company_name: "AcmeB", tier: "SILVER", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { acctB_id: $.data.id }
            - call: "POST /quotes"
              payload: { contractor_account_id: "${acctA_id}" }
              as: Estimator
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/line-items"
              payload: { product_type: "TABLETOP", glass_type: "ANNEALED", thickness_mm: 12, width_in: 40, height_in: 20, quantity: 1 }
              as: Estimator
            - call: "POST /quotes/${q_id}/send"
              payload: {}
              as: Estimator
          trigger:
            - call: "POST /quotes/${q_id}/accept"
              payload: { expected_account_version: "${acctA_v0}" }
              as: Contractor
              as_user_id: "${acctB_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN"

      - name: missing_role_header_returns_unauthenticated
        claim_type: peer_roles
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no/unknown X-User-Role -> ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /jobs"
              payload: {}
              as: Nobody
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHENTICATED"
            - "HTTP status == 401"

  # ==========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_account_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[accept-stale-account]", "errors[ERR_STALE_ACCOUNT_VERSION]"]
        distinguishing_aspect: "After accepting quote A (account.version 1->2), accepting a different SENT quote B still carrying expected_account_version=1 -> ERR_STALE_ACCOUNT_VERSION (412)."
        test_recipe:
          setup: ["One account with two SENT quotes A and B; A accepted first (account version now 2)."]
          setup_api_calls:
            - call: "POST /contractor-accounts"
              payload: { company_name: "Acme", tier: "SILVER", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /quotes"
              payload: { contractor_account_id: "${acct_id}" }
              as: Estimator
              captures: { qA_id: $.data.id }
            - call: "POST /quotes/${qA_id}/line-items"
              payload: { product_type: "TABLETOP", glass_type: "ANNEALED", thickness_mm: 12, width_in: 40, height_in: 20, quantity: 1 }
              as: Estimator
            - call: "POST /quotes/${qA_id}/send"
              payload: {}
              as: Estimator
            - call: "POST /quotes"
              payload: { contractor_account_id: "${acct_id}" }
              as: Estimator
              captures: { qB_id: $.data.id }
            - call: "POST /quotes/${qB_id}/line-items"
              payload: { product_type: "TABLETOP", glass_type: "ANNEALED", thickness_mm: 12, width_in: 40, height_in: 20, quantity: 1 }
              as: Estimator
            - call: "POST /quotes/${qB_id}/send"
              payload: {}
              as: Estimator
            - call: "POST /quotes/${qA_id}/accept"
              payload: { expected_account_version: "${acct_v0}" }
              as: Contractor
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /quotes/${qB_id}/accept"
              payload: { expected_account_version: "${acct_v0}" }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_ACCOUNT_VERSION"
            - "HTTP status == 412"

      - name: version_increments_on_account_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.ContractorAccount.fields.version, "endpoints POST /contractor-accounts/{id}/set-status"]
        distinguishing_aspect: "ContractorAccount.version starts at 1 and becomes 2 after a set-status mutation."
        test_recipe:
          setup: ["A fresh account (version 1)."]
          setup_api_calls:
            - call: "POST /contractor-accounts"
              payload: { company_name: "Acme", tier: "SILVER", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { acct_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /contractor-accounts/${acct_id}/set-status"
              payload: { status: "ON_HOLD" }
              as: ShopAdmin
              captures: { v1: $.data.version, st: $.data.status }
          assert:
            - "ContractorAccount.${acct_id}.version == 2"
            - "ContractorAccount.${acct_id}.status == ON_HOLD"

      - name: job_cancel_cascade_releases_furnace_and_credit
        claim_type: cascading_side_effects
        grounds: [state_machines.Job.status_ACTIVE_to_CANCELLED]
        excluded_because:
          difficulty_instance: "compensating_invariant / credit_used_conserved_accept_then_cancel"
          rationale: "Credit release on job cancel is asserted by the named §1.8 invariant instance."

