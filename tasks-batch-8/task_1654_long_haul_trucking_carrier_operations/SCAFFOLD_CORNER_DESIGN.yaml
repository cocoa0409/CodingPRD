            - { call: "POST /settlements/${stl}/mark-paid", payload: {}, as: PayrollClerk, as_user_id: "payroll-2", captures: { s3: $.data.status } }
            - { call: "POST /settlements/${stl}/reject", payload: {}, as: PayrollClerk, as_user_id: "payroll-2", captures: { err: $.data.error_id } }
          assert:
            - "lifecycle: ${s1} == PENDING_APPROVAL, ${s2} == APPROVED (${appr} == payroll-2), ${s3} == PAID"
            - "PAID terminal: captured ${err} == ERR_SETTLEMENT_NOT_PENDING_APPROVAL"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_version_increments_on_mutation
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[driver-patch-stale-version]", "entities.Driver"]
        distinguishing_aspect: "Driver.version increments by exactly 1 on every mutation, including cascaded ones: create 1 -> PATCH 2 -> suspend (with its own cascade) 3."
        test_recipe:
          setup: ["driver created (version captured)"]
          setup_api_calls:
            - { call: "POST /drivers", payload: { cdl_number: "CDL-X1", full_name: "X One", home_terminal: "DAL", pay_model: "MILEAGE", pay_rate_cents_per_mile: 62, hired_at: "2025-01-01T00:00:00Z", last_home_at: "2026-07-28T00:00:00Z" }, as: FleetAdmin, captures: { drv: $.data.id, v1: $.data.version } }
          trigger:
            - { call: "PATCH /drivers/${drv}", payload: { home_terminal: "FTW", expected_driver_version: "${v1}" }, as: FleetAdmin, captures: { v2: $.data.version } }
            - { call: "POST /drivers/${drv}/suspend", payload: {}, as: SafetyOfficer, captures: { v3: $.data.version } }
          assert:
            - "captured ${v1} == 1, ${v2} == 2, ${v3} == 3 (suspend bumps version too)"

      - name: trip_patch_replan_occ_recompute
        claim_type: derived_field_reconciliation
        grounds: ["concurrency_rules[trip-replan-stale-version]", "calculations.driver_trip_pay", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH on PLANNED trip recomputes the derived provisional pay ((900+200)*62 = 68200) and bumps version 1->2; a stale replay of the captured version -> 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["F1 chain through trip creation (provisional 63240, version 1)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: FleetAdmin }
            - { call: "POST /customers", payload: { name: "Acme Foods" }, as: FleetAdmin, captures: { cust: $.data.id } }
            - { call: "POST /lanes", payload: { origin_state: "TX", destination_state: "GA", loaded_miles: 900, rpm_floor_cents: 200 }, as: LoadPlanner, captures: { lane: $.data.id } }
            - { call: "POST /state-fuel-rates", payload: { state_code: "US-NATIONAL", tax_cents_per_gallon: 0, avg_pump_price_cents: 450, effective_from: "2026-01-01T00:00:00Z" }, as: FleetAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-X2", full_name: "X Two", home_terminal: "DAL", pay_model: "MILEAGE", pay_rate_cents_per_mile: 62, hired_at: "2025-01-01T00:00:00Z", last_home_at: "2026-07-28T00:00:00Z" }, as: FleetAdmin, captures: { drv: $.data.id } }
            - { call: "POST /tractors", payload: { unit_number: "T-X2", home_terminal: "DAL", odometer_miles: 100000, current_state_code: "TX", tank_capacity_gallons: 200, current_fuel_gallons: 150 }, as: FleetAdmin, captures: { tr: $.data.id } }
            - { call: "POST /loads", payload: { customer_id: "${cust}", lane_id: "${lane}", rate_cents: 250000, weight_lbs: 42000, pickup_appt_at: "2026-08-02T08:00:00Z", delivery_appt_at: "2026-08-03T18:00:00Z" }, as: LoadPlanner, captures: { load: $.data.id } }
            - { call: "POST /loads/${load}/screen", payload: {}, as: LoadPlanner }
            - { call: "POST /loads/${load}/accept", payload: {}, as: LoadPlanner }
            - { call: "POST /trips", payload: { load_id: "${load}", driver_id: "${drv}", tractor_id: "${tr}", planned_deadhead_miles: 120, planned_start_at: "2026-08-02T06:00:00Z", route_states: [ { state_code: "TX", miles: 1020 } ] }, as: Dispatcher, captures: { trip: $.data.id, tv: $.data.version, prov0: $.data.provisional_pay_cents } }
          trigger:
            - { call: "PATCH /trips/${trip}", payload: { planned_deadhead_miles: 200, expected_trip_version: "${tv}" }, as: Dispatcher, captures: { tv2: $.data.version, prov1: $.data.provisional_pay_cents } }
            - { call: "PATCH /trips/${trip}", payload: { planned_deadhead_miles: 300, expected_trip_version: "${tv}" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "replan: ${prov0} == 63240 -> ${prov1} == 68200 ((900+200)*62), version ${tv2} == 2"
            - "stale replay: captured ${err} == ERR_STALE_VERSION"

      - name: settlement_recalculate_occ_and_adjustment_absorbed
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[settlement-recalc-stale-version]", "calculations.settlement_gross_pay", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Recalculate applies manual_adjustment_cents 5000 (subtotal 66600 -> 71600) and the guarantee top-up RE-COMPUTES against it (53400 -> 48400, gross pinned 120000); stale version replay -> 412."
        test_recipe:
          setup: ["F1 full chain through invoice issue (trip pay 65100, share 1500); DRAFT settlement exists (top_up 53400, gross 120000, version 1)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: FleetAdmin }
            - { call: "POST /customers", payload: { name: "Acme Foods" }, as: FleetAdmin, captures: { cust: $.data.id } }
            - { call: "POST /lanes", payload: { origin_state: "TX", destination_state: "GA", loaded_miles: 900, rpm_floor_cents: 200 }, as: LoadPlanner, captures: { lane: $.data.id } }
            - { call: "POST /state-fuel-rates", payload: { state_code: "US-NATIONAL", tax_cents_per_gallon: 0, avg_pump_price_cents: 450, effective_from: "2026-01-01T00:00:00Z" }, as: FleetAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-X3", full_name: "X Three", home_terminal: "DAL", pay_model: "MILEAGE", pay_rate_cents_per_mile: 62, hired_at: "2025-01-01T00:00:00Z", last_home_at: "2026-07-28T00:00:00Z" }, as: FleetAdmin, captures: { drv: $.data.id } }
            - { call: "POST /tractors", payload: { unit_number: "T-X3", home_terminal: "DAL", odometer_miles: 100000, current_state_code: "TX", tank_capacity_gallons: 200, current_fuel_gallons: 150 }, as: FleetAdmin, captures: { tr: $.data.id } }
            - { call: "POST /loads", payload: { customer_id: "${cust}", lane_id: "${lane}", rate_cents: 250000, weight_lbs: 42000, pickup_appt_at: "2026-08-02T08:00:00Z", delivery_appt_at: "2026-08-03T18:00:00Z" }, as: LoadPlanner, captures: { load: $.data.id } }
            - { call: "POST /loads/${load}/screen", payload: {}, as: LoadPlanner }
            - { call: "POST /loads/${load}/accept", payload: {}, as: LoadPlanner }
            - { call: "POST /trips", payload: { load_id: "${load}", driver_id: "${drv}", tractor_id: "${tr}", planned_deadhead_miles: 120, planned_start_at: "2026-08-02T06:00:00Z", route_states: [ { state_code: "TX", miles: 1020 } ] }, as: Dispatcher, captures: { trip: $.data.id } }
            - { call: "POST /trips/${trip}/dispatch", payload: {}, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T21:00:00Z" }, as: FleetAdmin }
            - { call: "POST /trips/${trip}/check-calls", payload: { kind: "ARRIVED_PICKUP", occurred_at: "2026-08-02T07:50:00Z", state_code: "TX", odometer_miles: 100120 }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /trips/${trip}/check-calls", payload: { kind: "DEPARTED_PICKUP", occurred_at: "2026-08-02T10:00:00Z", state_code: "TX", odometer_miles: 100120 }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /trips/${trip}/check-calls", payload: { kind: "ARRIVED_DELIVERY", occurred_at: "2026-08-03T17:00:00Z", state_code: "GA", odometer_miles: 101050 }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /trips/${trip}/check-calls", payload: { kind: "DELIVERED", occurred_at: "2026-08-03T21:00:00Z", state_code: "GA", odometer_miles: 101050 }, as: Driver, as_user_id: "${drv}" }
            - { call: "GET /loads/${load}/accessorials", payload: {}, as: Dispatcher, captures: { acc: "$.data[0].id" } }
            - { call: "POST /accessorials/${acc}/submit", payload: {}, as: Dispatcher }
            - { call: "POST /accessorials/${acc}/approve", payload: {}, as: LoadPlanner }
            - { call: "POST /loads/${load}/invoice", payload: {}, as: LoadPlanner, captures: { inv: $.data.id } }
            - { call: "POST /invoices/${inv}/issue", payload: {}, as: LoadPlanner }
            - { call: "POST /settlements", payload: { driver_id: "${drv}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-08T00:00:00Z" }, as: PayrollClerk, as_user_id: "payroll-1", captures: { stl: $.data.id, sv: $.data.version, top0: $.data.guarantee_top_up_cents } }
          trigger:
            - { call: "POST /settlements/${stl}/recalculate", payload: { manual_adjustment_cents: 5000, expected_settlement_version: "${sv}" }, as: PayrollClerk, as_user_id: "payroll-1", captures: { adj: $.data.manual_adjustment_cents, top1: $.data.guarantee_top_up_cents, gross1: $.data.gross_pay_cents, sv2: $.data.version } }
            - { call: "POST /settlements/${stl}/recalculate", payload: { manual_adjustment_cents: 7000, expected_settlement_version: "${sv}" }, as: PayrollClerk, as_user_id: "payroll-1", captures: { err: $.data.error_id } }
          assert:
            - "recalc: ${adj} == 5000, ${top1} == 48400 (120000 - (66600+5000)), ${gross1} == 120000 (top-up absorbs the adjustment), ${sv2} == 2 (was ${sv} == 1, ${top0} == 53400)"
            - "stale replay: captured ${err} == ERR_STALE_VERSION"

      - name: cascade_updates_version_and_score
        claim_type: derived_field_reconciliation
        grounds: ["calculations.driver_safety_score", "entities.Driver.fields.safety_score"]
        distinguishing_aspect: "Derived-field reconciliation: creating a safety event recomputes the denormalized safety_score (100 -> 90) and bumps the parent Driver version/updated_at in the same request."
        test_recipe:
          setup: ["driver created (v1, score 100, updated_at captured)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: FleetAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-X4", full_name: "X Four", home_terminal: "DAL", pay_model: "MILEAGE", pay_rate_cents_per_mile: 62, hired_at: "2025-01-01T00:00:00Z", last_home_at: "2026-07-28T00:00:00Z" }, as: FleetAdmin, captures: { drv: $.data.id, v1: $.data.version, u1: $.data.updated_at } }
          trigger:
            - { call: "POST /drivers/${drv}/safety-events", payload: { kind: "INSPECTION_VIOLATION", severity_points: 10, occurred_at: "2026-07-15T00:00:00Z" }, as: SafetyOfficer, captures: { sev: $.data.id } }
            - { call: "GET /drivers/${drv}", payload: {}, as: SafetyOfficer, captures: { v2: $.data.version, s2: $.data.safety_score, u2: $.data.updated_at } }
          assert:
            - "${s2} == 90, ${v2} == ${v1} + 1 (== 2), ${u2} != ${u1} (cascaded recompute touches the parent row)"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_read_after_transition
        claim_type: immediate_visibility
        grounds: ["complexity_profile", "state_machines.Load.SCREENED_to_ACCEPTED"]
        distinguishing_aspect: "Immediate consistency: the accept response AND a subsequent GET both show ACCEPTED with recomputed fuel_surcharge_cents 20769 and projected_margin_cents 63769 — no asynchronous lag."
        test_recipe:
          setup: ["F1 refdata; load SCREENED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: FleetAdmin }
            - { call: "POST /customers", payload: { name: "Acme Foods" }, as: FleetAdmin, captures: { cust: $.data.id } }
            - { call: "POST /lanes", payload: { origin_state: "TX", destination_state: "GA", loaded_miles: 900, rpm_floor_cents: 200 }, as: LoadPlanner, captures: { lane: $.data.id } }
            - { call: "POST /state-fuel-rates", payload: { state_code: "US-NATIONAL", tax_cents_per_gallon: 0, avg_pump_price_cents: 450, effective_from: "2026-01-01T00:00:00Z" }, as: FleetAdmin }
            - { call: "POST /loads", payload: { customer_id: "${cust}", lane_id: "${lane}", rate_cents: 250000, weight_lbs: 42000, pickup_appt_at: "2026-08-02T08:00:00Z", delivery_appt_at: "2026-08-03T18:00:00Z" }, as: LoadPlanner, captures: { load: $.data.id } }
            - { call: "POST /loads/${load}/screen", payload: {}, as: LoadPlanner }
          trigger:
            - { call: "POST /loads/${load}/accept", payload: {}, as: LoadPlanner, captures: { st: $.data.status, fsc: $.data.fuel_surcharge_cents } }
            - { call: "GET /loads/${load}", payload: {}, as: LoadPlanner, captures: { gst: $.data.status, gm: $.data.projected_margin_cents } }
          assert:
            - "write response: ${st} == ACCEPTED, ${fsc} == 20769"
            - "immediate re-read: ${gst} == ACCEPTED, ${gm} == 63769"


