      - name: dismiss_with_adjudicated_dominance_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_MARKET_DOMINANCE_PRESENT]
        distinguishing_aspect: "Outcome DISMISSED while the adjudicated ratio is 1.8571 (>= 1.8000) is refused with ERR_MARKET_DOMINANCE_PRESENT — the Board cannot dismiss for want of dominance what the verified record proves dominant."
        test_recipe:
