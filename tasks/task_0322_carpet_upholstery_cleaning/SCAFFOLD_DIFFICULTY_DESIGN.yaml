# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Carpet & Upholstery Cleaning — Expert tier
# 9 rule_ids × 2 instances = 18 difficulty instances.
# Every literal in `assert:` was computed against SCAFFOLD.yaml §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dual_variant_quote_vs_settle_heavy_job
        grounds:
          - calculations.quoted_price
          - calculations.settled_price
          - state_machines.CleaningJob.QUOTED_to_BOOKED
          - entities.CleaningJob.fields.quoted_price_cents
          - entities.CleaningJob.fields.settled_price_cents
        distinguishing_aspect: |
          Same three HEAVY rooms produce quoted_price_cents=24000 (forward, no
          escalation) but settled_price_cents=28000 (chronological, +4000 heavy
          escalation since heavy_rooms==3 >= HEAVY_ESCALATION_COUNT) — dual
          variants on the CleaningJob cost-accounting domain.
        test_recipe:
          setup:
            - "ACTIVE customer; ACTIVE STEAM catalog base_rate=50/sqft; STEAM crew buffer 30; one-off job with 3 HEAVY rooms (100/120/80 sqft), no add-ons, no plan, no move_furniture"
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Quote Settle", email: "qs@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /service-catalogs"
              payload: { service_type: "STEAM", base_rate_cents_per_sqft: 50, stain_addon_cents: 2500, pet_addon_cents: 1800, protectant_cents_per_sqft: 12, move_furniture_flat_cents: 3000, dry_time_minutes: 240 }
              as: ServiceManager
              captures: { cat_id: $.data.id }
            - call: "POST /crews"
              payload: { crew_name: "Rig-1", supported_service_type: "STEAM", turnaround_buffer_minutes: 30 }
              as: Dispatcher
              captures: { crew_id: $.data.id, crew_v: $.data.version }
            - call: "POST /cleaning-jobs"
              payload: { customer_id: "${cust_id}", service_catalog_id: "${cat_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
            - call: "POST /cleaning-jobs/${job_id}/rooms"
              payload: { area_label: "Living Room", area_sqft: 100, soiling_level: "HEAVY" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /cleaning-jobs/${job_id}/rooms"
              payload: { area_label: "Den", area_sqft: 120, soiling_level: "HEAVY" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /cleaning-jobs/${job_id}/rooms"
              payload: { area_label: "Hall", area_sqft: 80, soiling_level: "HEAVY" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /cleaning-jobs/${job_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { quoted: $.data.quoted_price_cents }
            - call: "POST /cleaning-jobs/${job_id}/book"
              payload: { crew_id: "${crew_id}", start_minute: 600, end_minute: 720, expected_crew_version: "${crew_v}" }
              as: Dispatcher
            - call: "POST /cleaning-jobs/${job_id}/start"
              payload: {}
              as: Dispatcher
            - call: "POST /cleaning-jobs/${job_id}/complete"
              payload: { completed_at_minute: 800 }
              as: Dispatcher
          trigger:
            - call: "POST /cleaning-jobs/${job_id}/invoice"
              payload: {}
              as: Billing
              captures: { inv_id: $.data.id, settled: $.data.amount_due_cents }
          assert:
            - "CleaningJob.${job_id}.quoted_price_cents == 24000"
            - "CleaningJob.${job_id}.settled_price_cents == 28000"
            - "Invoice.${inv_id}.amount_due_cents == 28000"

      - name: dual_variant_protectant_price_order_sensitivity
        grounds:
          - calculations.addon_line_price
          - entities.AddOn.fields.line_price_cents
          - entities.CleaningJob.fields.total_sqft
        distinguishing_aspect: |
          A PROTECTANT add-on created while total_sqft==0 (before any room)
          prices to line_price_cents=0; the same add-on created after a 300-sqft
          room prices to 3600 — dual-variant order sensitivity on the AddOn
          domain, distinct from the CleaningJob cost domain in instance 1.
        test_recipe:
          setup:
            - "Two draft jobs on the same STEAM catalog (protectant 12/sqft); job EARLY gets PROTECTANT before any room, job LATE gets a 300-sqft room then PROTECTANT"
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Order Sens", email: "os@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /service-catalogs"
              payload: { service_type: "STEAM", base_rate_cents_per_sqft: 50, stain_addon_cents: 2500, pet_addon_cents: 1800, protectant_cents_per_sqft: 12, move_furniture_flat_cents: 3000, dry_time_minutes: 240 }
              as: ServiceManager
              captures: { cat_id: $.data.id }
            - call: "POST /cleaning-jobs"
              payload: { customer_id: "${cust_id}", service_catalog_id: "${cat_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_early: $.data.id }
            - call: "POST /cleaning-jobs"
              payload: { customer_id: "${cust_id}", service_catalog_id: "${cat_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_late: $.data.id }
            - call: "POST /cleaning-jobs/${job_late}/rooms"
              payload: { area_label: "Great Room", area_sqft: 300, soiling_level: "LIGHT" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /cleaning-jobs/${job_early}/add-ons"
              payload: { addon_type: "PROTECTANT" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { addon_early: $.data.id, price_early: $.data.line_price_cents }
            - call: "POST /cleaning-jobs/${job_late}/add-ons"
              payload: { addon_type: "PROTECTANT" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { addon_late: $.data.id, price_late: $.data.line_price_cents }
          assert:
            - "AddOn.${addon_early}.line_price_cents == 0"
            - "AddOn.${addon_late}.line_price_cents == 3600"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: combinatorial_mode_a_nonlinear_quote_with_discount
        grounds:
          - calculations.quoted_price
          - calculations.addon_line_price
          - entities.CleaningJob.fields.move_furniture
          - entities.RecurringPlan.fields.cadence
        distinguishing_aspect: |
          Mode (a): quoted_price combines >=3 interacting inputs (per-room
          soiling-tiered base, two add-on lines, a once-per-job move-furniture
          flat, and a cadence-keyed percentage discount applied to the summed
          pre-discount) — non-linear because the discount multiplies the whole
          aggregate. Inputs: rooms_subtotal=16250, stain=2500, protectant=3600,
          furn=3000, pre=25350, 15% discount=3803 => quoted=21547.
        test_recipe:
          setup:
            - "MONTHLY recurring plan; STEAM catalog; move_furniture job with a 200-sqft LIGHT room, a 100-sqft MODERATE room, a STAIN add-on, and a PROTECTANT add-on (added after rooms)"
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Combo A", email: "comboa@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /service-catalogs"
              payload: { service_type: "STEAM", base_rate_cents_per_sqft: 50, stain_addon_cents: 2500, pet_addon_cents: 1800, protectant_cents_per_sqft: 12, move_furniture_flat_cents: 3000, dry_time_minutes: 240 }
              as: ServiceManager
              captures: { cat_id: $.data.id }
            - call: "POST /recurring-plans"
              payload: { customer_id: "${cust_id}", cadence: "MONTHLY" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /cleaning-jobs"
              payload: { customer_id: "${cust_id}", service_catalog_id: "${cat_id}", recurring_plan_id: "${plan_id}", move_furniture: true }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
            - call: "POST /cleaning-jobs/${job_id}/rooms"
              payload: { area_label: "Living", area_sqft: 200, soiling_level: "LIGHT" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /cleaning-jobs/${job_id}/rooms"
              payload: { area_label: "Office", area_sqft: 100, soiling_level: "MODERATE" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /cleaning-jobs/${job_id}/add-ons"
              payload: { addon_type: "STAIN" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /cleaning-jobs/${job_id}/add-ons"
              payload: { addon_type: "PROTECTANT" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /cleaning-jobs/${job_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { quoted: $.data.quoted_price_cents }
          assert:
            - "CleaningJob.${job_id}.quoted_price_cents == 21547"
            - "CleaningJob.${job_id}.total_sqft == 300"

      - name: combinatorial_mode_b_round_then_sum_order
        grounds:
          - calculations.quoted_price
          - entities.RoomAssessment.fields.area_sqft
          - entities.RoomAssessment.fields.soiling_level
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned to round-each-room-then-sum.
          Three rooms at rate=7, 3 sqft, MODERATE (x1.25) each compute 26.25 ->
          round_half_up to 26 per room -> sum 78. The forbidden sum-then-round
          path (78.75 -> 79) is excluded; assert pins 78 to prove the order.
        test_recipe:
          setup:
            - "STEAM catalog base_rate=7/sqft; one-off job, no plan, no add-ons, no move_furniture; three identical 3-sqft MODERATE rooms"
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Combo B", email: "combob@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /service-catalogs"
              payload: { service_type: "STEAM", base_rate_cents_per_sqft: 7, stain_addon_cents: 2500, pet_addon_cents: 1800, protectant_cents_per_sqft: 12, move_furniture_flat_cents: 3000, dry_time_minutes: 240 }
              as: ServiceManager
              captures: { cat_id: $.data.id }
            - call: "POST /cleaning-jobs"
              payload: { customer_id: "${cust_id}", service_catalog_id: "${cat_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
            - call: "POST /cleaning-jobs/${job_id}/rooms"
              payload: { area_label: "R1", area_sqft: 3, soiling_level: "MODERATE" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /cleaning-jobs/${job_id}/rooms"
              payload: { area_label: "R2", area_sqft: 3, soiling_level: "MODERATE" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /cleaning-jobs/${job_id}/rooms"
              payload: { area_label: "R3", area_sqft: 3, soiling_level: "MODERATE" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /cleaning-jobs/${job_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { quoted: $.data.quoted_price_cents }
          assert:
            - "CleaningJob.${job_id}.quoted_price_cents == 78"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: nonlinear_guarantee_claim_fork_join
        grounds:
          - state_machines.GuaranteeClaim.FILED_to_GRANTED
          - state_machines.GuaranteeClaim.FILED_to_DENIED
          - entities.GuaranteeClaim.fields.reclean_job_id
        distinguishing_aspect: |
          GuaranteeClaim branches FILED -> {GRANTED, DENIED} with divergent
          side-effect sets: GRANTED creates a re-clean job + wallet credit,
          DENIED creates neither. Two claims on equivalent completed jobs take
          opposite branches; reclean_job_id is non-null only for GRANTED.
        test_recipe:
          setup:
            - "Two completed STEAM jobs (one 1-LIGHT-room each) for one customer; a FILED claim on each, both within the dry-time guarantee window"
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Fork Join", email: "fj@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /service-catalogs"
              payload: { service_type: "STEAM", base_rate_cents_per_sqft: 50, stain_addon_cents: 2500, pet_addon_cents: 1800, protectant_cents_per_sqft: 12, move_furniture_flat_cents: 3000, dry_time_minutes: 240 }
              as: ServiceManager
              captures: { cat_id: $.data.id }
            - call: "POST /crews"
              payload: { crew_name: "Rig-FJ", supported_service_type: "STEAM", turnaround_buffer_minutes: 30 }
              as: Dispatcher
              captures: { crew_id: $.data.id, crew_v: $.data.version }
            - call: "POST /cleaning-jobs"
              payload: { customer_id: "${cust_id}", service_catalog_id: "${cat_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_g: $.data.id }
            - call: "POST /cleaning-jobs/${job_g}/rooms"
              payload: { area_label: "RmG", area_sqft: 100, soiling_level: "LIGHT" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /cleaning-jobs/${job_g}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /cleaning-jobs/${job_g}/book"
              payload: { crew_id: "${crew_id}", start_minute: 0, end_minute: 120, expected_crew_version: "${crew_v}" }
              as: Dispatcher
            - call: "GET /crews/${crew_id}"
              payload: {}
              as: Dispatcher
              captures: { crew_v_after_g: $.data.version }
            - call: "POST /cleaning-jobs/${job_g}/start"
              payload: {}
              as: Dispatcher
            - call: "POST /cleaning-jobs/${job_g}/complete"
              payload: { completed_at_minute: 200 }
              as: Dispatcher
            - call: "POST /cleaning-jobs"
              payload: { customer_id: "${cust_id}", service_catalog_id: "${cat_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_d: $.data.id }
            - call: "POST /cleaning-jobs/${job_d}/rooms"
              payload: { area_label: "RmD", area_sqft: 100, soiling_level: "LIGHT" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /cleaning-jobs/${job_d}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /cleaning-jobs/${job_d}/book"
              payload: { crew_id: "${crew_id}", start_minute: 300, end_minute: 420, expected_crew_version: "${crew_v_after_g}" }
              as: Dispatcher
            - call: "POST /cleaning-jobs/${job_d}/start"
              payload: {}
              as: Dispatcher
            - call: "POST /cleaning-jobs/${job_d}/complete"
              payload: { completed_at_minute: 500 }
              as: Dispatcher
            - call: "POST /guarantee-claims"
              payload: { cleaning_job_id: "${job_g}", reason: "still dirty", filed_at_minute: 300 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_g: $.data.id }
            - call: "POST /guarantee-claims"
              payload: { cleaning_job_id: "${job_d}", reason: "buyer remorse", filed_at_minute: 600 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_d: $.data.id }
          trigger:
            - call: "POST /guarantee-claims/${claim_g}/grant"
              payload: {}
              as: ServiceManager
              captures: { reclean_id: $.data.reclean_job_id }
            - call: "POST /guarantee-claims/${claim_d}/deny"
              payload: {}
              as: ServiceManager
          assert:
            - "GuaranteeClaim.${claim_g}.status == GRANTED"
            - "GuaranteeClaim.${claim_g}.reclean_job_id != null"
            - "GuaranteeClaim.${claim_d}.status == DENIED"
            - "GuaranteeClaim.${claim_d}.reclean_job_id == null"
            - "Customer.${cust_id}.wallet_credit_cents == 2000"

      - name: nonlinear_scheduled_slot_reschedule_cycle
        grounds:
          - state_machines.ScheduledSlot.RESERVED_to_RELEASED
          - state_machines.CleaningJob.QUOTED_to_BOOKED
          - entities.CleaningJob.fields.scheduled_slot_id
        distinguishing_aspect: |
          ScheduledSlot is cyclic via reschedule: a BOOKED job releases its
          current RESERVED slot and reserves a fresh one, repointing
          scheduled_slot_id — a loop on a different entity (ScheduledSlot) than
          the GuaranteeClaim fork-join. After one reschedule the original slot
          is RELEASED and a distinct slot is RESERVED.
        test_recipe:
          setup:
            - "A BOOKED job on crew Rig-RS at [600,720); reschedule it to [900,1020)"
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Reschedule", email: "rs@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /service-catalogs"
              payload: { service_type: "STEAM", base_rate_cents_per_sqft: 50, stain_addon_cents: 2500, pet_addon_cents: 1800, protectant_cents_per_sqft: 12, move_furniture_flat_cents: 3000, dry_time_minutes: 240 }
              as: ServiceManager
              captures: { cat_id: $.data.id }
            - call: "POST /crews"
              payload: { crew_name: "Rig-RS", supported_service_type: "STEAM", turnaround_buffer_minutes: 30 }
              as: Dispatcher
              captures: { crew_id: $.data.id, crew_v: $.data.version }
            - call: "POST /cleaning-jobs"
              payload: { customer_id: "${cust_id}", service_catalog_id: "${cat_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
            - call: "POST /cleaning-jobs/${job_id}/rooms"
              payload: { area_label: "Rm", area_sqft: 100, soiling_level: "LIGHT" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /cleaning-jobs/${job_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /cleaning-jobs/${job_id}/book"
              payload: { crew_id: "${crew_id}", start_minute: 600, end_minute: 720, expected_crew_version: "${crew_v}" }
              as: Dispatcher
              captures: { slot_first: $.data.scheduled_slot_id }
            - call: "GET /crews/${crew_id}"
              payload: {}
              as: Dispatcher
              captures: { crew_v2: $.data.version }
          trigger:
            - call: "POST /cleaning-jobs/${job_id}/reschedule"
              payload: { crew_id: "${crew_id}", start_minute: 900, end_minute: 1020, expected_crew_version: "${crew_v2}" }
              as: Dispatcher
              captures: { slot_second: $.data.scheduled_slot_id }
          assert:
            - "CleaningJob.${job_id}.scheduled_slot_id != ${slot_first}"
            - "ScheduledSlot.${slot_first}.status == RELEASED"
            - "ScheduledSlot.${slot_second}.status == RESERVED"
            - "CleaningJob.${job_id}.lifecycle_status == BOOKED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cascade_grant_to_reclean_job_to_room_copy
        grounds:
          - state_machines.GuaranteeClaim.FILED_to_GRANTED
          - entities.CleaningJob.fields.origin_job_id
          - entities.RoomAssessment.fields.cleaning_job_id
          - entities.WalletLedgerEntry.fields.delta_cents
        distinguishing_aspect: |
          Depth-3 cascade originating at claim GRANT: grant (A) creates a
          re-clean CleaningJob (B); the new job's existence drives copying each
          origin RoomAssessment onto it (C); each link is caused by the prior
          one, not directly by the grant call.
        test_recipe:
          setup:
            - "A COMPLETED STEAM job with TWO rooms (LIGHT 100 + MODERATE 150) for one customer; a FILED claim within the window"
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cascade Grant", email: "cg@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /service-catalogs"
              payload: { service_type: "STEAM", base_rate_cents_per_sqft: 50, stain_addon_cents: 2500, pet_addon_cents: 1800, protectant_cents_per_sqft: 12, move_furniture_flat_cents: 3000, dry_time_minutes: 240 }
              as: ServiceManager
              captures: { cat_id: $.data.id }
            - call: "POST /crews"
              payload: { crew_name: "Rig-CG", supported_service_type: "STEAM", turnaround_buffer_minutes: 30 }
              as: Dispatcher
              captures: { crew_id: $.data.id, crew_v: $.data.version }
            - call: "POST /cleaning-jobs"
              payload: { customer_id: "${cust_id}", service_catalog_id: "${cat_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_o: $.data.id }
            - call: "POST /cleaning-jobs/${job_o}/rooms"
              payload: { area_label: "Living", area_sqft: 100, soiling_level: "LIGHT" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /cleaning-jobs/${job_o}/rooms"
              payload: { area_label: "Stairs", area_sqft: 150, soiling_level: "MODERATE" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /cleaning-jobs/${job_o}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /cleaning-jobs/${job_o}/book"
              payload: { crew_id: "${crew_id}", start_minute: 600, end_minute: 720, expected_crew_version: "${crew_v}" }
              as: Dispatcher
            - call: "POST /cleaning-jobs/${job_o}/start"
              payload: {}
              as: Dispatcher
            - call: "POST /cleaning-jobs/${job_o}/complete"
              payload: { completed_at_minute: 800 }
              as: Dispatcher
            - call: "POST /guarantee-claims"
              payload: { cleaning_job_id: "${job_o}", reason: "resoiled", filed_at_minute: 900 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /guarantee-claims/${claim_id}/grant"
              payload: {}
              as: ServiceManager
              captures: { reclean_id: $.data.reclean_job_id }
          assert:
            - "CleaningJob.${reclean_id}.origin_job_id == ${job_o}"
            - "CleaningJob.${reclean_id}.lifecycle_status == DRAFT"
            - "GET /cleaning-jobs/${reclean_id}/rooms returns 2 RoomAssessment rows"
            - "Customer.${cust_id}.wallet_credit_cents == 2000"

      - name: cascade_void_invoice_to_billing_to_wallet_refund
        grounds:
          - state_machines.Invoice.OPEN_to_VOID
          - state_machines.CleaningJob.billing_status
          - entities.WalletLedgerEntry.fields.delta_cents
          - calculations.invoice_wallet_application
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (invoice VOID, not claim
          grant): void (A) resets the job's billing_status to UNBILLED (B), and
          because wallet was applied at issuance, void writes a compensating
          INVOICE_REFUND WalletLedgerEntry restoring the credit (B'). Distinct
          propagation pattern from instance 1's create-cascade.
        test_recipe:
          setup:
