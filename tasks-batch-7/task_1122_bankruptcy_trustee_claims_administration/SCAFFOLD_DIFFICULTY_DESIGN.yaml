              captures: { claim_id: $.data.id }
            - call: "POST /trustee/claims/${claim_id}/review"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/claims/${claim_id}/allow"
              payload: {}
