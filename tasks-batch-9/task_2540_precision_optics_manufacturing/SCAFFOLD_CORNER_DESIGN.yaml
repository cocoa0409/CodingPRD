      - name: a_denied_licence_blocks_every_order_of_that_design_and_leaves_the_others_alone
        claim_type: cascading_side_effects
        grounds:
          - state_machines.WorkOrder.compliance_status.SCREENED_to_BLOCKED
          - conventions.governing_export_classification
          - errors.ERR_EXPORT_CLASSIFICATION_MISSING
          - errors.ERR_EXPORT_CLASSIFICATION_EXISTS
          - validations.priority_8
        distinguishing_aspect: |
          One licence denial fans out over an unbounded set of rows in one request: both work orders of
          the denied design are blocked in created_at ASC order regardless of whether they stood in
          UNCLASSIFIED or SCREENED, while the order of the other design keeps its CLEARED status. Hop 3 is
          necessarily vacuous on the denial path — an assembly can only own a component of an order that
          reached RELEASED_TO_ASSEMBLY, which demands CLEARED, which on a LICENSE_REQUIRED design demands
          an approval that a single classification cannot also deny — so the assembly hop is exercised by
          the revocation instance instead. The denial also strips the design of its governing
          classification, so a fresh order can be opened and then refused at the screen with
          ERR_EXPORT_CLASSIFICATION_MISSING, and a new classification may now be created because the
          uniqueness rule counts only rows that are not LICENSE_DENIED.
        test_recipe:
          setup:
            - "Two RELEASED designs on the same lot: OD-2540-A (aperture 120.0, RMS 0.0400) and OD-2540-B (aperture 110.0, RMS 0.0450), both export-controlled."
            - "One RELEASED lot GL-2540-1 with 20 blanks certified H3/B; each work order reserves 3 blanks."
            - "Design A carries a governing ExportClassification for DE with license_required true (classification_status LICENSE_REQUIRED); design B carries one for AU, which is licence-exempt, so its status is EXEMPT_CLEARED."
            - "Three work orders exist in created_at ASC order: WO-2540-A1 on design A (screened, so SCREENED), WO-2540-A2 on design A (never screened, so UNCLASSIFIED) and WO-2540-B1 on design B (screened against the exempt classification, so CLEARED)."
            - "The logical clock stays at its start value 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/release"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-B", aperture_mm: 110.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0450, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d2: $.data.id }
            - call: "POST /optics/optical-designs/${d2}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d2}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d2}/release"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/glass-lots"
              payload: { lot_code: "GL-2540-1", glass_type: "N-BK7", melt_index_nd: 1.516800, total_blank_count: 20, declared_index_homogeneity_grade: "H2", declared_striae_grade: "A" }
              as: ProcurementOfficer
              captures: { g1: $.data.id }
            - call: "POST /optics/glass-lots/${g1}/certification"
              payload: { measured_index_homogeneity_grade: "H3", measured_striae_grade: "B", certificate_reference: "CERT-2540-1" }
              as: ProcurementOfficer
              captures: { g1v: $.data.version }
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-A1", design_id: "${d1}", glass_lot_id: "${g1}", element_count: 2, expected_glass_lot_version: "${g1v}" }
              as: ProcessTechnician
              captures: { w1: $.data.id }
            - call: "GET /optics/glass-lots/${g1}"
              payload: {}
              as: ProcurementOfficer
              captures: { g1v2: $.data.version }
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-A2", design_id: "${d1}", glass_lot_id: "${g1}", element_count: 2, expected_glass_lot_version: "${g1v2}" }
              as: ProcessTechnician
              captures: { w2: $.data.id }
            - call: "GET /optics/glass-lots/${g1}"
              payload: {}
              as: ProcurementOfficer
              captures: { g1v3: $.data.version }
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-B1", design_id: "${d2}", glass_lot_id: "${g1}", element_count: 2, expected_glass_lot_version: "${g1v3}" }
              as: ProcessTechnician
              captures: { w3: $.data.id }
            - call: "POST /optics/export-classifications"
              payload: { design_id: "${d1}", destination_country: "DE" }
              as: ExportComplianceOfficer
              as_user_id: "eco-001"
              captures: { x1: $.data.id }
            - call: "POST /optics/export-classifications"
              payload: { design_id: "${d2}", destination_country: "AU" }
              as: ExportComplianceOfficer
              as_user_id: "eco-001"
              captures: { x2: $.data.id }
            - call: "POST /optics/work-orders/${w1}/compliance-screen"
              payload: {}
              as: ExportComplianceOfficer
              as_user_id: "eco-001"
            - call: "POST /optics/work-orders/${w3}/compliance-screen"
              payload: {}
              as: ExportComplianceOfficer
              as_user_id: "eco-001"
          trigger:
            - call: "POST /optics/export-classifications/${x1}/license-decision"
              payload: { decision: "DENIED" }
              as: ExportComplianceOfficer
              as_user_id: "eco-002"
            - call: "GET /optics/work-orders/${w1}"
              payload: {}
              as: ProcessTechnician
            - call: "GET /optics/work-orders/${w2}"
              payload: {}
              as: ProcessTechnician
            - call: "GET /optics/work-orders/${w3}"
              payload: {}
              as: ProcessTechnician
            - call: "GET /optics/glass-lots/${g1}"
              payload: {}
              as: ProcurementOfficer
              captures: { g1v4: $.data.version }
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-A3", design_id: "${d1}", glass_lot_id: "${g1}", element_count: 2, expected_glass_lot_version: "${g1v4}" }
              as: ProcessTechnician
              captures: { w4: $.data.id }
            - call: "POST /optics/work-orders/${w4}/compliance-screen"
              payload: {}
              as: ExportComplianceOfficer
              as_user_id: "eco-001"
            - call: "POST /optics/export-classifications"
              payload: { design_id: "${d1}", destination_country: "GB" }
              as: ExportComplianceOfficer
              as_user_id: "eco-001"
              captures: { x3: $.data.id }
            - call: "POST /optics/work-orders/${w4}/compliance-screen"
              payload: {}
              as: ExportComplianceOfficer
              as_user_id: "eco-001"
            - call: "GET /optics/work-orders/${w4}"
              payload: {}
              as: ProcessTechnician
            - call: "GET /optics/optical-designs/${d1}/export-classifications"
              payload: { limit: 10, offset: 0 }
              as: ExportComplianceOfficer
              as_user_id: "eco-001"
            - call: "GET /optics/work-orders"
              payload: { compliance_status: "BLOCKED", limit: 10, offset: 0 }
              as: ExportComplianceOfficer
              as_user_id: "eco-001"
          assert:
            - "the denial returns HTTP 200 with ExportClassification.${x1}.classification_status == LICENSE_DENIED, license_number null and decided_by_user_id eco-002"
            - "WorkOrder.${w1}.compliance_status == BLOCKED although it stood in SCREENED"
            - "WorkOrder.${w2}.compliance_status == BLOCKED although it stood in UNCLASSIFIED and was never screened"
            - "WorkOrder.${w3}.compliance_status == CLEARED, untouched: the cascade is scoped by design_id"
            - "the process_status of all four orders is still BLANKS_RESERVED, so the cascade stayed inside the compliance dimension"
            - "the fresh order WO-2540-A3 is created UNCLASSIFIED even though its design's only classification is LICENSE_DENIED: the create endpoint declares no export gate"
            - "screening WO-2540-A3 returns HTTP 409 with error_id ERR_EXPORT_CLASSIFICATION_MISSING, since every classification of design A is now LICENSE_DENIED and the design has no governing row"
            - "creating a new classification for design A with destination GB returns HTTP 201 with classification_status EXEMPT_CLEARED and not ERR_EXPORT_CLASSIFICATION_EXISTS: priority 22 counts only rows that are not LICENSE_DENIED"
            - "re-screening WO-2540-A3 now returns HTTP 200 and WorkOrder.${w4}.compliance_status == CLEARED, straight past SCREENED, because the governing row is EXEMPT_CLEARED"
            - "the design's classification list holds exactly 2 rows, ${x1} in LICENSE_DENIED and ${x3} in EXEMPT_CLEARED"
            - "the BLOCKED-filtered work-order list holds exactly 2 rows, ${w1} then ${w2}, in created_at ASC order: the two blocked orders stay blocked, the new classification does not un-block them"

      - name: the_two_spectral_variants_are_computed_and_persisted_side_by_side
        claim_type: dual_variant_calculation
        grounds:
          - calculations.spectral_performance_verification
          - entities.CoatingRun.band_average_reflectance_pct
          - entities.CoatingRun.worst_point_reflectance_pct
        distinguishing_aspect: |
          The second dual-variant pair of the domain: one spectral payload yields an in-band average and a
          worst in-band point that are both stored, and the verdict is FAIL when either variant crosses
          its own limit.
        excluded_because:
          difficulty_instance: coating_spectral_band_average_and_worst_point_variants_diverge_on_coating_run
          rationale: |
            That §1.8 instance supplies a payload whose average is comfortably inside 0.5000 while a
            single point exceeds 1.2000, asserts both persisted variants and the FAIL verdict, and then
            shows the opposite divergence, so nothing is left for a separate corner instance.

      - name: scrapping_a_released_order_reaches_back_into_an_aligned_assembly
        claim_type: cascading_side_effects
        grounds:
          - state_machines.WorkOrder.RELEASED_TO_ASSEMBLY_to_SCRAPPED
          - calculations.assembly_transmitted_wavefront
          - calculations.blank_conservation_ledger
        distinguishing_aspect: |
          The deepest cascade in the model — the only path on which the component-void and assembly-demote
          hops are not vacuous — with its four hops pinned in order.
        excluded_because:
          difficulty_instance: post_release_scrap_cascade_voids_component_and_demotes_aligned_assembly
          rationale: |
            That §1.8 instance scraps an order that had already been kitted into an ALIGNED assembly and
            asserts hop order 1 -> 2 -> 3 -> 4: the ledger write-off, the VOIDED component, the
            recomputed wavefront outputs over the remaining ACTIVE components and the demotion back to
            MOUNTED.

  # =======================================================================
  - section: consistency_model
    instances:

      - name: the_blank_ledger_is_already_correct_in_the_response_that_changed_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.blank_conservation_ledger
          - entities.GlassLot.available_blank_count
          - endpoints.POST_/optics/work-orders
        distinguishing_aspect: |
          There is no refresh endpoint and no settling delay anywhere in this API: the work-order create
          response already carries its own frozen reserved_blank_count, the very next read of the lot
          already shows the decremented availability, and the sufficiency check of the immediately
          following create is made against that new figure — a four-blank lot admits an order needing four
          and refuses the next one in the same request sequence, with no read in between.
        test_recipe:
          setup:
            - "A RELEASED design OD-2540-A and a RELEASED lot GL-2540-4 with total_blank_count 4 certified H3/B, so available_blank_count is 4."
            - "The first order has element_count 3 and therefore reserves 3 + max(1, ceil(0.75)) == 4 blanks, exactly the availability."
            - "The second order has element_count 1 and would reserve 2."
            - "The logical clock stays at its start value 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/release"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/glass-lots"
              payload: { lot_code: "GL-2540-4", glass_type: "N-BK7", melt_index_nd: 1.516800, total_blank_count: 4, declared_index_homogeneity_grade: "H2", declared_striae_grade: "A" }
              as: ProcurementOfficer
              captures: { g1: $.data.id }
            - call: "POST /optics/glass-lots/${g1}/certification"
              payload: { measured_index_homogeneity_grade: "H3", measured_striae_grade: "B", certificate_reference: "CERT-2540-1" }
              as: ProcurementOfficer
              captures: { g1v: $.data.version }
          trigger:
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-A", design_id: "${d1}", glass_lot_id: "${g1}", element_count: 3, expected_glass_lot_version: "${g1v}" }
              as: ProcessTechnician
              captures: { w1: $.data.id }
            - call: "GET /optics/glass-lots/${g1}"
              payload: {}
              as: ProcurementOfficer
              captures: { g1v2: $.data.version }
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-B", design_id: "${d1}", glass_lot_id: "${g1}", element_count: 1, expected_glass_lot_version: "${g1v2}" }
              as: ProcessTechnician
            - call: "GET /optics/glass-lots/${g1}"
              payload: {}
              as: ProcurementOfficer
            - call: "GET /optics/work-orders/${w1}"
              payload: {}
              as: ProcessTechnician
          assert:
            - "the create response itself reports reserved_blank_count 4 and spare_blank_count 1 without any further read"
            - "the lot read immediately after reports reserved_blank_count 4 and available_blank_count 0: no propagation delay and no second call was needed to settle it"
            - "the second create is refused with HTTP 409 ERR_INSUFFICIENT_BLANKS, so the gate was evaluated against the availability produced microseconds earlier"
            - "the closing lot read still reports available_blank_count 0 and reserved_blank_count 4, identical to the earlier read"
            - "the work-order read reports the same reserved_blank_count 4 that the create response carried, so the frozen value and the derived ledger agree"
            - "GlassLot.${g1}.lot_status == RELEASED: the lot is not DEPLETED, because reserved_blank_count is not 0"

      - name: align_and_licence_effects_are_visible_to_the_next_read_with_no_settling_step
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.assembly_transmitted_wavefront
          - endpoints.GET_/optics/assemblies/{id}/release-readiness
          - state_machines.WorkOrder.compliance_status.SCREENED_to_CLEARED
        distinguishing_aspect: |
          Two multi-row effects are checked for immediacy in one sequence: the licence approval updates
          the work order of another entity and the next read of that order already shows CLEARED, and the
          align response itself carries all five recomputed wavefront outputs, which the release-readiness
          computed read — evaluated from scratch over the component rows — reproduces to the last decimal
          in the immediately following call.
        test_recipe:
          setup:
            - "A RELEASED design OD-2540-A (aperture 120.0 mm, RMS 0.0400, tolerance budget 0.0800, transmitted-wavefront budget 0.1050, one ACTIVE 0.0375-wave allocation, verdict PASS) and a RELEASED lot GL-2540-1 with total_blank_count 20 certified H3/B."
            - "Interferometer IF-2540-1 calibrated at the clock's start value with base_uncertainty_waves 0.0010, so capability_ratio_at_scheduling is 0.0500."
            - "WO-2540-1 (element_count 2) is COATED and SCREENED against a LICENSE_REQUIRED classification for DE; no licence decision has been taken."
            - "The two components to be kitted carry 0.0600 and 0.0400 waves with decenter 10.0 um and tilt 1.0 arcmin each, so the align must yield element_rss 0.0721, centration 0.0204, subtotal 0.0925, derate 0.0060 and total 0.0985 against a 0.1050 budget."
            - "The logical clock stays at its start value 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/release"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/glass-lots"
              payload: { lot_code: "GL-2540-1", glass_type: "N-BK7", melt_index_nd: 1.516800, total_blank_count: 20, declared_index_homogeneity_grade: "H2", declared_striae_grade: "A" }
              as: ProcurementOfficer
              captures: { g1: $.data.id }
            - call: "POST /optics/glass-lots/${g1}/certification"
              payload: { measured_index_homogeneity_grade: "H3", measured_striae_grade: "B", certificate_reference: "CERT-2540-1" }
