        grounds: [complexity_profile.consistency_model, entities.Campaign.fields.contracted_cents]
        distinguishing_aspect: "Immediate consistency: the confirm response itself and a follow-up GET both show contracted_cents 1150000 and the locked net; no reconciliation lag."
        test_recipe:
