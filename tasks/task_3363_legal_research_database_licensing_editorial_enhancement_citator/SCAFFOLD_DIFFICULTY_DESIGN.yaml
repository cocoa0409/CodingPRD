      - name: citator_empty_reference_set_collapses_to_green
        grounds:
          - calculations.citator_signal_derivation
          - state_machines.CitingReference.ACTIVE_to_INACTIVE
        distinguishing_aspect: |
          Empty-collection boundary on the eligible-reference metric via the
          removal-order transition endpoint: after the ONLY negative reference to B
          flips INACTIVE, the eligible set is EMPTY and the pinned rule yields score 0
          and signal GREEN — the score must not retain its previous RED value.
          Different metric (set emptiness vs numeric quota) and different endpoint
          (removal transition + document read vs invoice generation).
        test_recipe:
          setup:
            - "B published; A published citing B OVERRULED/EXAMINED (B: score 100, RED); SEAL order on A effective 2026-09-01..2026-09-30; clock 2026-09-15"
          setup_api_calls:
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-09-05T00:00:00Z"}, as: PlatformAdmin}
            - call: "POST /legal-research/documents"
              payload: {source_type: COURT, jurisdiction_code: "CA9", document_type: CASE, title: "B v. Empty", raw_citation_string: "810 F.3d 10", decision_date: "2026-01-10"}
              as: ContentIngester
              captures: {doc_b: $.data.id}
            - {call: "POST /legal-research/documents/${doc_b}/publish", payload: {references: []}, as: ContentIngester}
            - call: "POST /legal-research/documents"
              payload: {source_type: COURT, jurisdiction_code: "CA9", document_type: CASE, title: "A v. Gone", raw_citation_string: "811 F.3d 20", decision_date: "2026-02-10"}
              as: ContentIngester
              captures: {doc_a: $.data.id}
            - call: "POST /legal-research/documents/${doc_a}/publish"
              payload: {references: [{cited_document_id: "${doc_b}", treatment: OVERRULED, depth: EXAMINED}]}
              as: ContentIngester
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-09-15T00:00:00Z"}, as: PlatformAdmin}
            - call: "POST /legal-research/removal-orders"
              payload: {document_id: "${doc_a}", scope: SEAL, effective_from: "2026-09-01", effective_until: "2026-09-30", reason: "Seal"}
              as: ComplianceOfficer
              captures: {ord_id: $.data.id}
          trigger:
            - {call: "POST /legal-research/removal-orders/${ord_id}/transition", payload: {target_status: APPLIED}, as: ComplianceOfficer}
          assert:
            - "eligible reference set for ${doc_b} is empty (sole reference is INACTIVE)"
            - "PrimaryDocument.${doc_b}.citator_score == 0 (empty set -> 0, not the stale 100)"
            - "PrimaryDocument.${doc_b}.citator_signal == GREEN"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: headnote_submit_gated_by_document_ingestion
        grounds:
          - state_machines.Headnote.DRAFT_to_IN_REVIEW
          - validations[priority=19]
          - errors[ERR_DOCUMENT_NOT_PUBLISHED]
        distinguishing_aspect: |
          Pair Headnote -> PrimaryDocument: the headnote's DRAFT -> IN_REVIEW
          transition is legal only when the DOCUMENT's ingestion axis is PUBLISHED;
          on a RECEIVED document the submit is rejected with
          ERR_DOCUMENT_NOT_PUBLISHED. The other instance crosses the
          UsageEvent -> Subscription pair.
        test_recipe:
          setup:
            - "Document D created but never published (ingestion RECEIVED, visibility PUBLIC); headnote H drafted on D"
          setup_api_calls:
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-09-05T00:00:00Z"}, as: PlatformAdmin}
            - call: "POST /legal-research/documents"
              payload: {source_type: AGENCY, jurisdiction_code: "US", document_type: REGULATION, title: "Unpublished Reg", raw_citation_string: "82 Fed. Reg. 100", decision_date: "2026-04-01"}
              as: ContentIngester
              captures: {doc_id: $.data.id}
            - call: "POST /legal-research/documents/${doc_id}/headnotes"
              payload: {topic_code: TAX, headnote_text: "H", synopsis_text: "S"}
              as: AttorneyEditor
              as_user_id: "ed-author-1"
              captures: {hn_id: $.data.id}
          trigger:
            - {call: "POST /legal-research/headnotes/${hn_id}/submit", payload: {}, as: AttorneyEditor, as_user_id: "ed-author-1", captures: {err: $.data.error_id}}
          assert:
            - "error_id == ERR_DOCUMENT_NOT_PUBLISHED"
            - "Headnote.${hn_id}.status remains DRAFT"

      - name: usage_event_gated_by_subscription_status
        grounds:
          - validations[priority=21]
          - state_machines.Subscription.ACTIVE_to_SUSPENDED
          - errors[ERR_SUBSCRIPTION_NOT_ACTIVE]
        distinguishing_aspect: |
          Pair UsageEvent -> Subscription: recording a metered event is legal only
          while the seat's subscription is ACTIVE; after a manual SUSPENDED transition
          the same event is rejected with ERR_SUBSCRIPTION_NOT_ACTIVE. Different
          entity pair from the headnote/document instance.
        test_recipe:
          setup:
            - "ACTIVE subscription with seated user U; subscription then manually SUSPENDED (seats NOT released)"
          setup_api_calls:
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-09-10T00:00:00Z"}, as: PlatformAdmin}
            - call: "POST /legal-research/plans"
              payload: {name: "Gate Plan", practice_area: LITIGATION, jurisdiction_scope: STATE, firm_size_tier: SOLO, billing_model: FLAT_RATE, scope_enforcement: SOFT, government_only: false, cost_recovery_allowed: false, monthly_fee_cents: 1000, included_searches: 5, included_doc_views: 5, overage_search_fee_cents: 100, overage_doc_view_fee_cents: 100, volume_discount_pct: 0.1, discount_threshold_overage_units: 10}
              as: LicensingManager
              captures: {p_id: $.data.id}
            - call: "POST /legal-research/accounts"
              payload: {org_name: "Gate Firm", account_type: LAW_FIRM, cost_recovery_enabled: false}
              as: LicensingManager
              captures: {a_id: $.data.id}
            - call: "POST /legal-research/subscriptions"
              payload: {account_id: "${a_id}", plan_id: "${p_id}", period_start: "2026-09-01", period_end: "2026-10-01", seats_total: 1}
              as: LicensingManager
              captures: {s_id: $.data.id}
            - {call: "POST /legal-research/subscriptions/${s_id}/seats", payload: {action: ASSIGN, user_email: "g@gate.com", user_full_name: "Gate User"}, as: FirmAdmin, as_user_id: "${a_id}"}
            - {call: "GET /legal-research/users", payload: {account_id: "${a_id}"}, as: FirmAdmin, as_user_id: "${a_id}", captures: {u_id: "$.data[0].id"}}
            - {call: "POST /legal-research/subscriptions/${s_id}/status", payload: {target_status: SUSPENDED}, as: LicensingManager}
          trigger:
            - {call: "POST /legal-research/usage-events", payload: {event_type: SEARCH, practice_area_tag: LITIGATION}, as: Researcher, as_user_id: "${u_id}", captures: {err: $.data.error_id}}
          assert:
            - "error_id == ERR_SUBSCRIPTION_NOT_ACTIVE"
            - "no UsageEvent row is recorded for ${u_id} (GET /legal-research/usage-events?user_id=${u_id} returns total_count == 0)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: license_exclusivity_half_open_adjacency_allowed
        grounds:
          - validations[priority=32]
          - entities.LicenseAgreement.fields.exclusive
          - errors[ERR_LICENSE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [window_start, window_end) on LicenseAgreement.
          An exclusive LITIGATION agreement starting exactly at the prior window_end
          (2027-01-01) is ACCEPTED (adjacency is not overlap), while one starting
          2026-12-31 interior-overlaps and is rejected. The removal-order instance
          uses closed-interval semantics on a different resource.
        test_recipe:
          setup:
            - "Existing ACTIVE exclusive LITIGATION agreement W1 with window [2026-01-01, 2027-01-01)"
          setup_api_calls:
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-09-05T00:00:00Z"}, as: PlatformAdmin}
            - call: "POST /legal-research/license-agreements"
              payload: {work_title: "Treatise One", author_name: "Author A", practice_area: LITIGATION, royalty_basis: PER_VIEW, per_view_fee_cents: 45, exclusive: true, window_start: "2026-01-01", window_end: "2027-01-01"}
              as: LicensingManager
              captures: {w1_id: $.data.id}
          trigger:
            - call: "POST /legal-research/license-agreements"
              payload: {work_title: "Treatise Two", author_name: "Author B", practice_area: LITIGATION, royalty_basis: PER_VIEW, per_view_fee_cents: 50, exclusive: true, window_start: "2027-01-01", window_end: "2028-01-01"}
              as: LicensingManager
              captures: {w2_id: $.data.id}
            - call: "POST /legal-research/license-agreements"
              payload: {work_title: "Treatise Three", author_name: "Author C", practice_area: LITIGATION, royalty_basis: REVENUE_SHARE, revenue_share_bps: 200, exclusive: true, window_start: "2026-12-31", window_end: "2027-06-01"}
              as: LicensingManager
              captures: {err: $.data.error_id}
            - call: "POST /legal-research/license-agreements"
              payload: {work_title: "Treatise Four", author_name: "Author D", practice_area: TAX, royalty_basis: PER_VIEW, per_view_fee_cents: 60, exclusive: true, window_start: "2026-06-01", window_end: "2026-12-01"}
              as: LicensingManager
              captures: {w4_id: $.data.id}
          assert:
            - "adjacent agreement ${w2_id} created (201): half-open windows treat window_end == window_start as non-overlapping"
            - "overlapping agreement rejected: error_id == ERR_LICENSE_WINDOW_OVERLAP (interior intersection with ${w1_id})"
            - "different-practice-area agreement ${w4_id} created (201): exclusivity is scoped per practice_area"

      - name: removal_order_closed_interval_adjacency_rejected
        grounds:
          - validations[priority=33]
          - entities.RemovalOrder.fields.effective_until
          - errors[ERR_REMOVAL_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: CLOSED [effective_from, effective_until] on RemovalOrder —
          adjacency (next effective_from == prior effective_until) COUNTS as overlap and
          is rejected, the opposite geometric treatment from the license-agreement
          half-open rule; the resource is also different (RemovalOrder on a document
          vs LicenseAgreement on a practice area).
        test_recipe:
          setup:
            - "Published document D; existing RECEIVED removal order O1 on D with CLOSED window [2026-09-01, 2026-09-30]"
          setup_api_calls:
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-09-05T00:00:00Z"}, as: PlatformAdmin}
            - call: "POST /legal-research/documents"
              payload: {source_type: COURT, jurisdiction_code: "FL", document_type: CASE, title: "Window v. Order", raw_citation_string: "900 So.3d 1", decision_date: "2026-02-01"}
              as: ContentIngester
              captures: {doc_id: $.data.id}
            - {call: "POST /legal-research/documents/${doc_id}/publish", payload: {references: []}, as: ContentIngester}
            - call: "POST /legal-research/removal-orders"
              payload: {document_id: "${doc_id}", scope: SEAL, effective_from: "2026-09-01", effective_until: "2026-09-30", reason: "O1"}
              as: ComplianceOfficer
              captures: {o1_id: $.data.id}
          trigger:
            - call: "POST /legal-research/removal-orders"
              payload: {document_id: "${doc_id}", scope: REMOVE, effective_from: "2026-09-30", effective_until: "2026-10-15", reason: "O2 adjacent"}
              as: ComplianceOfficer
              captures: {err: $.data.error_id}
            - call: "POST /legal-research/removal-orders"
              payload: {document_id: "${doc_id}", scope: REMOVE, effective_from: "2026-10-01", effective_until: "2026-10-31", reason: "O3 disjoint"}
              as: ComplianceOfficer
              captures: {o3_id: $.data.id}
          assert:
            - "adjacent order rejected: error_id == ERR_REMOVAL_WINDOW_OVERLAP (closed interval: 2026-09-30 is inside [2026-09-01, 2026-09-30])"
            - "disjoint order ${o3_id} created (201): [2026-10-01, 2026-10-31] shares no date with O1"

  - rule_id: compensating_invariant
    instances:
      - name: seat_assign_release_conserves_seats_used
        grounds:
          - entities.Subscription.fields.seats_used
          - entities.SubscriberUser.fields.seat_status
          - state_machines.Subscription
        distinguishing_aspect: |
          Conserved quantity: seat occupancy — Subscription.seats_used ==
          |{u : u.seat_subscription_id == subscription.id AND u.seat_status == ACTIVE}|.
          ASSIGN followed by RELEASE of the same user returns seats_used to its exact
          pre-ASSIGN value and leaves the user seatless; no drift. The other invariant
          conserves the citator reference set — a different quantity type.
        test_recipe:
          setup:
            - "ACTIVE subscription with seats_total 2; baseline seats_used == 0"
          setup_api_calls:
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-09-05T00:00:00Z"}, as: PlatformAdmin}
            - call: "POST /legal-research/plans"
              payload: {name: "Seat Plan", practice_area: LITIGATION, jurisdiction_scope: STATE, firm_size_tier: SMALL, billing_model: FLAT_RATE, scope_enforcement: SOFT, government_only: false, cost_recovery_allowed: false, monthly_fee_cents: 1000, included_searches: 5, included_doc_views: 5, overage_search_fee_cents: 100, overage_doc_view_fee_cents: 100, volume_discount_pct: 0.1, discount_threshold_overage_units: 10}
              as: LicensingManager
              captures: {p_id: $.data.id}
            - call: "POST /legal-research/accounts"
              payload: {org_name: "Seat Firm", account_type: LAW_FIRM, cost_recovery_enabled: false}
              as: LicensingManager
              captures: {a_id: $.data.id}
            - call: "POST /legal-research/subscriptions"
              payload: {account_id: "${a_id}", plan_id: "${p_id}", period_start: "2026-09-01", period_end: "2026-10-01", seats_total: 2}
              as: LicensingManager
              captures: {s_id: $.data.id, s_v0: $.data.version}
            - {call: "GET /legal-research/subscriptions/${s_id}", as: LicensingManager}
          trigger:
            - {call: "POST /legal-research/subscriptions/${s_id}/seats", payload: {action: ASSIGN, user_email: "s1@seat.com", user_full_name: "Seat One"}, as: FirmAdmin, as_user_id: "${a_id}"}
            - {call: "GET /legal-research/users", payload: {account_id: "${a_id}"}, as: FirmAdmin, as_user_id: "${a_id}", captures: {u_id: "$.data[0].id"}}
            - {call: "POST /legal-research/subscriptions/${s_id}/seats", payload: {action: RELEASE, user_id: "${u_id}"}, as: FirmAdmin, as_user_id: "${a_id}"}
          assert:
            - "after ASSIGN: Subscription.${s_id}.seats_used == 1 and GET /legal-research/users?seat_subscription_id=${s_id} total_count == 1"
            - "after RELEASE: Subscription.${s_id}.seats_used == 0 (== pre-ASSIGN baseline)"
            - "after RELEASE: SubscriberUser.${u_id}.seat_status == NONE and seat_subscription_id == null"
            - "invariant holds at every step: seats_used == count of users with seat_status == ACTIVE on ${s_id}"

      - name: removal_apply_reverse_restores_citator_quantities
        grounds:
          - state_machines.CitingReference.ACTIVE_to_INACTIVE
          - state_machines.CitingReference.INACTIVE_to_ACTIVE
          - calculations.citator_signal_derivation
        distinguishing_aspect: |
          Conserved quantity: the ACTIVE citation-reference set and its derived signal.
          APPLIED deactivates exactly the k references of the sealed document; REVERSED
          reactivates exactly those k (via deactivated_by_order_id), restoring the cited
          document's citator_score and citator_signal to their pre-apply values —
          a different conserved quantity than the seat-count invariant.
        test_recipe:
          setup:
            - "B published; A published citing B OVERRULED/EXAMINED -> B: score 100, signal RED, 1 ACTIVE reference (baseline captured)"
            - "SEAL order O on A [2026-09-01, 2026-09-30]; clock 2026-09-15"
          setup_api_calls:
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-09-05T00:00:00Z"}, as: PlatformAdmin}
            - call: "POST /legal-research/documents"
              payload: {source_type: COURT, jurisdiction_code: "CA9", document_type: CASE, title: "B v. Restore", raw_citation_string: "910 F.3d 10", decision_date: "2026-01-10"}
              as: ContentIngester
              captures: {doc_b: $.data.id}
            - {call: "POST /legal-research/documents/${doc_b}/publish", payload: {references: []}, as: ContentIngester}
            - call: "POST /legal-research/documents"
              payload: {source_type: COURT, jurisdiction_code: "CA9", document_type: CASE, title: "A v. Reverse", raw_citation_string: "911 F.3d 20", decision_date: "2026-02-10"}
              as: ContentIngester
              captures: {doc_a: $.data.id}
            - call: "POST /legal-research/documents/${doc_a}/publish"
              payload: {references: [{cited_document_id: "${doc_b}", treatment: OVERRULED, depth: EXAMINED}]}
              as: ContentIngester
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-09-15T00:00:00Z"}, as: PlatformAdmin}
            - call: "POST /legal-research/removal-orders"
              payload: {document_id: "${doc_a}", scope: SEAL, effective_from: "2026-09-01", effective_until: "2026-09-30", reason: "O"}
              as: ComplianceOfficer
              captures: {ord_id: $.data.id}
          trigger:
            - {call: "POST /legal-research/removal-orders/${ord_id}/transition", payload: {target_status: APPLIED}, as: ComplianceOfficer}
            - {call: "POST /legal-research/removal-orders/${ord_id}/transition", payload: {target_status: REVERSED}, as: ComplianceOfficer}
          assert:
            - "after APPLIED: ACTIVE references citing ${doc_b} == 0; ${doc_b}.citator_score == 0; ${doc_b}.citator_signal == GREEN; ${doc_a}.visibility_status == SEALED"
            - "after REVERSED: ACTIVE references citing ${doc_b} == 1 (== pre-apply baseline) with deactivated_by_order_id == null"
            - "after REVERSED: ${doc_b}.citator_score == 100 and citator_signal == RED (exactly the pre-apply values)"
            - "after REVERSED: ${doc_a}.visibility_status == PUBLIC"
