            - call: "POST /soaring/aircraft"
              payload: { registration: "N017G", kind: "GLIDER", annual_due_date: "2027-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { gs2: $.data.id, gs2_ver: $.data.version }
            - call: "POST /soaring/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T12:00:00Z" }
              as: ClubAdmin
            - call: "POST /soaring/reservations"
              payload: { aircraft_id: "${gs2}", member_id: "${ms2}", start_at: "2026-09-03T10:00:00Z", end_at: "2026-09-03T12:00:00Z", expected_aircraft_version: "${gs2_ver}" }
              as: Member
              as_user_id: "${ms2}"
              captures: { rs2: $.data.id }
          trigger:
            - call: "POST /soaring/members/${ms2}/suspend"
              payload: {}
              as: ClubAdmin
          assert:
            - "Member.${ms2}.status == SUSPENDED and suspension_reason == MANUAL"
            - "Reservation.${rs2}.status == CANCELLED (cascade; no late fee on admin cascade cancels)"

      - name: payment_reinstates_arrears_suspension
        claim_type: side_effect_execution
        grounds: [state_machines.Member.SUSPENDED_to_ACTIVE, constants.ARREARS_THRESHOLD_CENTS]
        distinguishing_aspect: "A member auto-suspended at ARREARS (balance 20000 after dues) is automatically reinstated to ACTIVE when a payment drops the balance below 20000; suspension_reason clears."
        test_recipe:
          setup: ["member MAR on tier dues 20000; ops-day close posts dues -> balance 20000 -> auto-suspend ARREARS; then payment 1 cent"]
          setup_api_calls:
            - call: "POST /soaring/tiers"
              payload: { tier_code: "ARR", monthly_dues_cents: 20000, tow_fee_discount_pct: 0.0, included_tows_per_month: 0 }
              as: ClubAdmin
              captures: { tarr: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Arrears Member", tier_id: "${tarr}" }
              as: ClubAdmin
              captures: { mar: $.data.id }
            - call: "POST /soaring/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /soaring/ops-day/close"
              payload: {}
              as: ClubAdmin
          trigger:
            - call: "POST /soaring/members/${mar}/payments"
              payload: { amount_cents: 1 }
              as: ClubAdmin
          assert:
            - "after close: Member.${mar}.status == SUSPENDED and suspension_reason == ARREARS and account_balance_cents == 20000 (balance >= threshold)"
            - "after payment of 1 cent: balance 19999 < 20000 -> status == ACTIVE and suspension_reason == null"

      - name: maintenance_record_restores_currency
        claim_type: side_effect_execution
        grounds: [state_machines.Aircraft.GROUNDED_to_AIRWORTHY, 'endpoints."POST /soaring/aircraft/{id}/maintenance-records"']
        distinguishing_aspect: "An INSPECTION_100H record on an INSPECTION_OVERDUE-grounded glider resets hours_since_inspection to 0 and returns the airframe to AIRWORTHY (system-grounded, not MANUAL, so the record itself ungrounds)."
        test_recipe:
          setup: ["glider GM AIRWORTHY; fly one 6000-minute flight (100.0h) reconciled -> the land itself grounds it at 100.0 (immediate currency re-check); then log INSPECTION_100H"]
          setup_api_calls:
            - call: "POST /soaring/tiers"
              payload: { tier_code: "MX", monthly_dues_cents: 0, tow_fee_discount_pct: 0.0, included_tows_per_month: 99 }
              as: ClubAdmin
              captures: { tmx: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Maint Pilot", tier_id: "${tmx}" }
              as: ClubAdmin
              captures: { mm: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Maint Tow", tier_id: "${tmx}", is_tow_pilot: true }
              as: ClubAdmin
              captures: { tm: $.data.id }
            - call: "POST /soaring/aircraft"
              payload: { registration: "N018G", kind: "GLIDER", annual_due_date: "2027-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { gm: $.data.id, gm_ver: $.data.version }
            - call: "POST /soaring/aircraft"
              payload: { registration: "N019T", kind: "TOW_PLANE", annual_due_date: "2027-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { tpm: $.data.id }
            - call: "POST /soaring/tow-slots"
              payload: { tow_plane_id: "${tpm}", tow_pilot_id: "${tm}", start_at: "2026-08-19T08:00:00Z", end_at: "2026-08-19T23:00:00Z", capacity: 3 }
              as: ClubAdmin
              captures: { sm: $.data.id, sm_ver: $.data.version }
            - call: "POST /soaring/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-19T08:10:00Z" }
              as: ClubAdmin
            - call: "POST /soaring/reservations"
              payload: { aircraft_id: "${gm}", member_id: "${mm}", start_at: "2026-08-19T08:00:00Z", end_at: "2026-08-19T23:00:00Z", expected_aircraft_version: "${gm_ver}" }
              as: Member
              as_user_id: "${mm}"
              captures: { rm: $.data.id }
            - call: "POST /soaring/reservations/${rm}/checkout"
              payload: {}
              as: Member
              as_user_id: "${mm}"
            - call: "POST /soaring/flights"
              payload: { reservation_id: "${rm}", tow_slot_id: "${sm}", release_altitude_ft: 1500, takeoff_at: "2026-08-19T08:15:00Z", expected_tow_slot_version: "${sm_ver}" }
              as: Member
