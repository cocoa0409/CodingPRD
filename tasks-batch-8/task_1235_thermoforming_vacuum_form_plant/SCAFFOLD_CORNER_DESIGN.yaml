# =============================================================================
# Task 1235: Thermoforming & Vacuum-Form Plant — §1.9 Corner Design
# Breadth coverage of every §1.1-§1.7 claim not already probed by §1.8.
# Logical clock default 2026-05-01T00:00:00Z; cert window 2026-04-01..2026-09-01
# is valid at the default clock unless an instance sets the clock.
# =============================================================================

scaffold_corner_design:
  # -------------------------------------------------------------------------
  - section: entities
    instances:
      - name: lot_create_applies_computed_defaults
        claim_type: creation
        grounds: ["entities.MaterialLot", "endpoints: \"POST /material-lots\""]
        distinguishing_aspect: "A lot created with all required fields lands in QUARANTINE with zeroed computed balances and available_kg == quantity_kg."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /material-lots", payload: { lot_code: "L-D1", resin_type: PETG, gauge_mm: 1.500, cleanliness_grade_required: FOOD, quantity_kg: 12.500, unit_cost_per_kg: 11.25 }, as: MaterialsPlanner, captures: { lot_id: $.data.id, st: $.data.status, av: $.data.available_kg, al: $.data.allocated_kg, co: $.data.consumed_kg, ver: $.data.version } }
          trigger: []
          assert:
            - "MaterialLot.${lot_id}.status == QUARANTINE (captured ${st})"
            - "allocated_kg == 0 and consumed_kg == 0 (captured ${al} / ${co})"
            - "available_kg == 12.500 == quantity_kg (captured ${av})"
            - "version == 1 (captured ${ver})"
      - name: order_create_computes_required_material
        claim_type: computed_fields
        grounds: ["entities.ProductionOrder.fields.required_material_kg", "calculations.required_material"]
        distinguishing_aspect: "required_material_kg is server-computed as round(100 x 0.050 x 1.18, 3) == 5.900 and is_prototype_order defaults to false when omitted (production tool order)."
        test_recipe:
          setup: ["PRODUCTION tool and ACTIVE stock spec exist"]
          setup_api_calls:
            - { call: "POST /tools", payload: { tool_code: "T-D2", part_number: "P-D2C", tool_type: FORM_MOLD, min_gauge_mm: 1.000, max_gauge_mm: 3.000, cleanliness_grade: INDUSTRIAL, prototype_cost: 1000.00 }, as: ToolingEngineer, captures: { tool_id: $.data.id } }
            - { call: "POST /tools/${tool_id}/complete-prototype", as: ToolingEngineer }
            - { call: "POST /tools/${tool_id}/submit-qualification", as: ToolingEngineer }
            - { call: "POST /cleanliness-certificates", payload: { subject_type: TOOL, subject_id: "${tool_id}", grade: INDUSTRIAL, issued_at: "2026-04-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector }
            - { call: "POST /tools/${tool_id}/approve-production", payload: { production_cost: 8000.00, rated_lifetime_shots: 80000 }, as: ToolingEngineer }
            - { call: "POST /packaging-specs", payload: { spec_code: "S-D2C", spec_type: STOCK, cleanliness_grade: INDUSTRIAL, per_pack_cost: 0.30 }, as: PackagingEngineer, captures: { spec_id: $.data.id } }
          trigger:
            - { call: "POST /production-orders", payload: { order_code: "O-D2", part_number: "P-D2C", resin_type: PETG, ordered_qty: 100, required_gauge_mm: 1.500, cleanliness_grade: INDUSTRIAL, spec_nominal_wall_mm: 1.300, spec_min_wall_mm: 1.230, nominal_part_weight_kg: 0.050, std_cycle_time_s: 30, std_machine_rate_per_hour: 55.00, tool_id: "${tool_id}", packaging_spec_id: "${spec_id}" }, as: ProductionScheduler, captures: { order_id: $.data.id, req_kg: $.data.required_material_kg, proto: $.data.is_prototype_order, sched: $.data.schedule_status, qual: $.data.quality_status } }
          assert:
            - "ProductionOrder.${order_id}.required_material_kg == 5.900 (captured ${req_kg})"
            - "is_prototype_order == false (default applied; captured ${proto})"
            - "schedule_status == QUEUED and quality_status == PENDING (captured ${sched} / ${qual})"
      - name: order_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting ordered_qty (a required input) is rejected with ERR_INVALID_REQUEST before any state or business check."
        test_recipe:
          setup: ["PRODUCTION tool and ACTIVE stock spec exist"]
          setup_api_calls:
            - { call: "POST /tools", payload: { tool_code: "T-D3", part_number: "P-D3", tool_type: FORM_MOLD, min_gauge_mm: 1.000, max_gauge_mm: 3.000, cleanliness_grade: INDUSTRIAL, prototype_cost: 1000.00 }, as: ToolingEngineer, captures: { tool_id: $.data.id } }
            - { call: "POST /tools/${tool_id}/complete-prototype", as: ToolingEngineer }
            - { call: "POST /packaging-specs", payload: { spec_code: "S-D3", spec_type: STOCK, cleanliness_grade: INDUSTRIAL, per_pack_cost: 0.30 }, as: PackagingEngineer, captures: { spec_id: $.data.id } }
          trigger:
            - { call: "POST /production-orders", payload: { order_code: "O-D3", part_number: "P-D3", resin_type: PETG, required_gauge_mm: 1.500, cleanliness_grade: INDUSTRIAL, spec_nominal_wall_mm: 1.300, spec_min_wall_mm: 1.230, nominal_part_weight_kg: 0.050, std_cycle_time_s: 30, std_machine_rate_per_hour: 55.00, tool_id: "${tool_id}", packaging_spec_id: "${spec_id}", is_prototype_order: true }, as: ProductionScheduler, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (captured ${err})"
      - name: create_lot_ignores_client_supplied_version_input_ignored
        claim_type: system_fields
        grounds: ["entities.MaterialLot.fields.version"]
        distinguishing_aspect: "Client-supplied system fields (id, version) are ignored: the server mints its own id and version starts at 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /material-lots", payload: { lot_code: "L-D4", resin_type: ABS, gauge_mm: 2.000, cleanliness_grade_required: INDUSTRIAL, quantity_kg: 5.000, unit_cost_per_kg: 8.00, id: "client-supplied-id", version: 99 }, as: MaterialsPlanner, captures: { lot_id: $.data.id, ver: $.data.version } }
          assert:
            - "MaterialLot id != 'client-supplied-id' (server-minted ${lot_id})"
            - "version == 1 (captured ${ver})"
      - name: tools_list_pagination_envelope
        claim_type: listing
        grounds: ["response_envelope", "endpoints: \"GET /tools\""]
        distinguishing_aspect: "GET /tools?limit=1 with two tools returns exactly one row and exposes the envelope pagination fields total_count == 2 and has_more == true."
        test_recipe:
          setup: ["two tools exist"]
          setup_api_calls:
            - { call: "POST /tools", payload: { tool_code: "T-D5A", part_number: "P-D5A", tool_type: FORM_MOLD, min_gauge_mm: 1.000, max_gauge_mm: 3.000, cleanliness_grade: INDUSTRIAL, prototype_cost: 1000.00 }, as: ToolingEngineer }
            - { call: "POST /tools", payload: { tool_code: "T-D5B", part_number: "P-D5B", tool_type: TRIM_FIXTURE, min_gauge_mm: 0.500, max_gauge_mm: 2.000, cleanliness_grade: FOOD, prototype_cost: 800.00 }, as: ToolingEngineer }
          trigger:
            - { call: "GET /tools", payload: { limit: 1 }, as: Any, captures: { first_id: "$.data[0].id" } }
          assert:
            - "response data array length == 1 (first element id ${first_id})"
            - "envelope pagination fields report total_count == 2 and has_more == true with limit == 1, offset == 0"
      - name: certificate_inverted_window_returns_invalid_request
        claim_type: type_constraints
        grounds: ["entities.CleanlinessCertificate.fields.expires_at", "validations[priority=3]"]
        distinguishing_aspect: "expires_at <= issued_at violates the window constraint and is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["a QUARANTINE lot exists"]
          setup_api_calls:
            - { call: "POST /material-lots", payload: { lot_code: "L-D6", resin_type: PETG, gauge_mm: 1.500, cleanliness_grade_required: INDUSTRIAL, quantity_kg: 5.000, unit_cost_per_kg: 8.00 }, as: MaterialsPlanner, captures: { lot_id: $.data.id } }
          trigger:
            - { call: "POST /cleanliness-certificates", payload: { subject_type: MATERIAL_LOT, subject_id: "${lot_id}", grade: INDUSTRIAL, issued_at: "2026-06-01T00:00:00Z", expires_at: "2026-05-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (captured ${err})"
  # -------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: tool_created_in_draft_initial_state
        claim_type: initial_state
        grounds: ["state_machines.Tool"]
        distinguishing_aspect: "New tools start in DRAFT with drawing_revision 1 and shots_used 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /tools", payload: { tool_code: "T-S1", part_number: "P-S1", tool_type: MATCHED_SET, min_gauge_mm: 1.000, max_gauge_mm: 3.000, cleanliness_grade: MEDICAL, prototype_cost: 3000.00 }, as: ToolingEngineer, captures: { tool_id: $.data.id, st: $.data.status, dr: $.data.drawing_revision, su: $.data.shots_used } }
          trigger: []
          assert:
            - "Tool.${tool_id}.status == DRAFT (captured ${st})"
            - "drawing_revision == 1 and shots_used == 0 (captured ${dr} / ${su})"
      - name: approve_production_from_draft_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Tool.DRAFT", "errors[ERR_INVALID_TOOL_TRANSITION]"]
        distinguishing_aspect: "approve-production from DRAFT (skipping PROTOTYPE and QUALIFICATION) is rejected with ERR_INVALID_TOOL_TRANSITION; the tool remains DRAFT."
        test_recipe:
          setup: ["tool in DRAFT"]
          setup_api_calls:
            - { call: "POST /tools", payload: { tool_code: "T-S2", part_number: "P-S2", tool_type: FORM_MOLD, min_gauge_mm: 1.000, max_gauge_mm: 3.000, cleanliness_grade: INDUSTRIAL, prototype_cost: 1000.00 }, as: ToolingEngineer, captures: { tool_id: $.data.id } }
          trigger:
            - { call: "POST /tools/${tool_id}/approve-production", payload: { production_cost: 8000.00, rated_lifetime_shots: 80000 }, as: ToolingEngineer, captures: { err: $.data.error_id } }
            - { call: "GET /tools/${tool_id}", as: Any, captures: { st: $.data.status } }
          assert:
            - "error_id == ERR_INVALID_TOOL_TRANSITION (captured ${err})"
            - "Tool.${tool_id}.status == DRAFT (captured ${st})"
      - name: batch_decide_before_target_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.RegrindBatch", "errors[ERR_INVALID_BATCH_STATE]"]
        distinguishing_aspect: "decide on an ACCEPTING batch (target not yet reached) is rejected with ERR_INVALID_BATCH_STATE even when the decider is a different planner than the creator (SoD satisfied, state is not)."
        test_recipe:
          setup: ["batch RB-E (target 2.000kg) in ACCEPTING with no scrap certified"]
          setup_api_calls:
            - { call: "POST /regrind-batches", payload: { batch_code: "RB-E", resin_type: PETG, source_grade: INDUSTRIAL, target_kg: 2.000 }, as: MaterialsPlanner, as_user_id: planner-1, captures: { rb_id: $.data.id } }
          trigger:
            - { call: "POST /regrind-batches/${rb_id}/decide", payload: { decision: CERTIFIED, certified_grade: INDUSTRIAL }, as: MaterialsPlanner, as_user_id: planner-2, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_BATCH_STATE (captured ${err})"
      - name: stage_on_cancelled_order_rejected
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.ProductionOrder(schedule_status)", "errors[ERR_INVALID_ORDER_STATE]"]
        distinguishing_aspect: "CANCELLED is terminal: stage with a fresh OCC version still fails with ERR_INVALID_ORDER_STATE."
        test_recipe:
          setup: ["order O-S4 created then cancelled from QUEUED"]
          setup_api_calls:
            - { call: "POST /tools", payload: { tool_code: "T-S4", part_number: "P-S4", tool_type: FORM_MOLD, min_gauge_mm: 1.000, max_gauge_mm: 3.000, cleanliness_grade: INDUSTRIAL, prototype_cost: 1000.00 }, as: ToolingEngineer, captures: { tool_id: $.data.id } }
            - { call: "POST /tools/${tool_id}/complete-prototype", as: ToolingEngineer }
            - { call: "POST /packaging-specs", payload: { spec_code: "S-S4", spec_type: STOCK, cleanliness_grade: INDUSTRIAL, per_pack_cost: 0.30 }, as: PackagingEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /production-orders", payload: { order_code: "O-S4", part_number: "P-S4", resin_type: PETG, ordered_qty: 50, required_gauge_mm: 1.500, cleanliness_grade: INDUSTRIAL, spec_nominal_wall_mm: 1.300, spec_min_wall_mm: 1.230, nominal_part_weight_kg: 0.050, std_cycle_time_s: 30, std_machine_rate_per_hour: 55.00, tool_id: "${tool_id}", packaging_spec_id: "${spec_id}", is_prototype_order: true }, as: ProductionScheduler, captures: { order_id: $.data.id } }
            - { call: "POST /production-orders/${order_id}/cancel", as: ProductionScheduler }
            - { call: "GET /production-orders/${order_id}", as: Any, captures: { o_ver: $.data.version } }
          trigger:
            - { call: "POST /production-orders/${order_id}/stage", payload: { expected_production_order_version: "${o_ver}" }, as: ProductionScheduler, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_ORDER_STATE (captured ${err})"
      - name: first_run_creation_flips_order_to_running
        claim_type: side_effect_execution
        grounds: ["state_machines.ProductionOrder(schedule_status).STAGED_to_RUNNING", "endpoints: \"POST /forming-runs\""]
        distinguishing_aspect: "The order's first forming run creation auto-advances schedule_status STAGED -> RUNNING and bumps the order version."
        test_recipe:
          setup: ["order O-S5 STAGED with full 5.900kg virgin coverage; station ST-S5 free"]
          setup_api_calls:
            - { call: "POST /material-lots", payload: { lot_code: "L-S5", resin_type: PETG, gauge_mm: 1.500, cleanliness_grade_required: INDUSTRIAL, quantity_kg: 10.000, unit_cost_per_kg: 10.00 }, as: MaterialsPlanner, captures: { lot_id: $.data.id } }
            - { call: "POST /cleanliness-certificates", payload: { subject_type: MATERIAL_LOT, subject_id: "${lot_id}", grade: INDUSTRIAL, issued_at: "2026-04-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector }
            - { call: "POST /tools", payload: { tool_code: "T-S5", part_number: "P-S5", tool_type: FORM_MOLD, min_gauge_mm: 1.000, max_gauge_mm: 3.000, cleanliness_grade: INDUSTRIAL, prototype_cost: 1000.00 }, as: ToolingEngineer, captures: { tool_id: $.data.id } }
            - { call: "POST /tools/${tool_id}/complete-prototype", as: ToolingEngineer }
            - { call: "POST /tools/${tool_id}/submit-qualification", as: ToolingEngineer }
            - { call: "POST /cleanliness-certificates", payload: { subject_type: TOOL, subject_id: "${tool_id}", grade: INDUSTRIAL, issued_at: "2026-04-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector }
            - { call: "POST /tools/${tool_id}/approve-production", payload: { production_cost: 8000.00, rated_lifetime_shots: 80000 }, as: ToolingEngineer }
            - { call: "POST /packaging-specs", payload: { spec_code: "S-S5", spec_type: STOCK, cleanliness_grade: INDUSTRIAL, per_pack_cost: 0.30 }, as: PackagingEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /machine-resources", payload: { resource_code: "ST-S5", resource_type: FORMING_STATION, cleanliness_grade: INDUSTRIAL, machine_rate_per_hour: 55.00 }, as: ProductionScheduler, captures: { station_id: $.data.id } }
            - { call: "POST /production-orders", payload: { order_code: "O-S5", part_number: "P-S5", resin_type: PETG, ordered_qty: 100, required_gauge_mm: 1.500, cleanliness_grade: INDUSTRIAL, spec_nominal_wall_mm: 1.300, spec_min_wall_mm: 1.230, nominal_part_weight_kg: 0.050, std_cycle_time_s: 30, std_machine_rate_per_hour: 55.00, tool_id: "${tool_id}", packaging_spec_id: "${spec_id}", is_prototype_order: false }, as: ProductionScheduler, captures: { order_id: $.data.id } }
            - { call: "POST /material-allocations", payload: { production_order_id: "${order_id}", source_type: VIRGIN_LOT, lot_id: "${lot_id}", qty_kg: 5.900 }, as: ProductionScheduler }
            - { call: "GET /production-orders/${order_id}", as: Any, captures: { o_ver: $.data.version } }
            - { call: "POST /production-orders/${order_id}/stage", payload: { expected_production_order_version: "${o_ver}" }, as: ProductionScheduler }
          trigger:
            - { call: "POST /forming-runs", payload: { production_order_id: "${order_id}", station_id: "${station_id}", planned_start: "2026-05-02T10:00:00Z", planned_end: "2026-05-02T10:30:00Z", oven_temp_c: 180.0, cycle_time_s: 30, shots_planned: 10 }, as: ProductionScheduler, captures: { run_id: $.data.id, run_st: $.data.status } }
            - { call: "GET /production-orders/${order_id}", as: Any, captures: { sched: $.data.schedule_status } }
          assert:
            - "FormingRun.${run_id}.status == SCHEDULED (captured ${run_st})"
            - "ProductionOrder.${order_id}.schedule_status == RUNNING (captured ${sched}) — auto-flip side effect"
      - name: lot_block_cascades_allocations_to_review
        claim_type: side_effect_execution
        grounds: ["state_machines.MaterialLot.CERTIFIED_to_BLOCKED", "state_machines.MaterialAllocation.RESERVED_to_REVIEW"]
        distinguishing_aspect: "Blocking a CERTIFIED lot pushes its RESERVED allocations to REVIEW (cross-entity cascade) while orders are left untouched."
        test_recipe:
          setup: ["CERTIFIED lot L-S6 with a 2.000kg RESERVED allocation on a QUEUED order"]
          setup_api_calls:
            - { call: "POST /material-lots", payload: { lot_code: "L-S6", resin_type: PETG, gauge_mm: 1.500, cleanliness_grade_required: INDUSTRIAL, quantity_kg: 10.000, unit_cost_per_kg: 10.00 }, as: MaterialsPlanner, captures: { lot_id: $.data.id } }
            - { call: "POST /cleanliness-certificates", payload: { subject_type: MATERIAL_LOT, subject_id: "${lot_id}", grade: INDUSTRIAL, issued_at: "2026-04-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector }
            - { call: "POST /tools", payload: { tool_code: "T-S6", part_number: "P-S6", tool_type: FORM_MOLD, min_gauge_mm: 1.000, max_gauge_mm: 3.000, cleanliness_grade: INDUSTRIAL, prototype_cost: 1000.00 }, as: ToolingEngineer, captures: { tool_id: $.data.id } }
            - { call: "POST /tools/${tool_id}/complete-prototype", as: ToolingEngineer }
            - { call: "POST /packaging-specs", payload: { spec_code: "S-S6", spec_type: STOCK, cleanliness_grade: INDUSTRIAL, per_pack_cost: 0.30 }, as: PackagingEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /production-orders", payload: { order_code: "O-S6", part_number: "P-S6", resin_type: PETG, ordered_qty: 50, required_gauge_mm: 1.500, cleanliness_grade: INDUSTRIAL, spec_nominal_wall_mm: 1.300, spec_min_wall_mm: 1.230, nominal_part_weight_kg: 0.050, std_cycle_time_s: 30, std_machine_rate_per_hour: 55.00, tool_id: "${tool_id}", packaging_spec_id: "${spec_id}", is_prototype_order: true }, as: ProductionScheduler, captures: { order_id: $.data.id } }
            - { call: "POST /material-allocations", payload: { production_order_id: "${order_id}", source_type: VIRGIN_LOT, lot_id: "${lot_id}", qty_kg: 2.000 }, as: ProductionScheduler, captures: { alloc_id: $.data.id } }
          trigger:
            - { call: "POST /material-lots/${lot_id}/block", as: MaterialsPlanner, captures: { lot_st: $.data.status } }
            - { call: "GET /material-allocations/${alloc_id}", as: Any, captures: { alloc_st: $.data.status } }
          assert:
            - "MaterialLot.${lot_id}.status == BLOCKED (captured ${lot_st})"
            - "MaterialAllocation.${alloc_id}.status == REVIEW (captured ${alloc_st})"
  # -------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: certificate_expiry_half_open_boundary
        claim_type: correct_result
        grounds: ["calculations.certificate_validity", "errors[ERR_CERTIFICATE_INVALID]", "endpoints: \"POST /_clock/set_current_utc"]
        distinguishing_aspect: "Certificate validity is half-open [issued_at, expires_at) under the logical clock: an allocation succeeds one second before expiry and fails with ERR_CERTIFICATE_INVALID at exactly expires_at."
        test_recipe:
          setup:
            - "Lot L-C1 (INDUSTRIAL-required, 10.000kg) CERTIFIED by a cert valid 2026-04-01T00:00:00Z .. 2026-06-01T00:00:00Z"
            - "QUEUED order O-C1 (INDUSTRIAL, prototype tool)"
          setup_api_calls:
            - { call: "POST /material-lots", payload: { lot_code: "L-C1", resin_type: PETG, gauge_mm: 1.500, cleanliness_grade_required: INDUSTRIAL, quantity_kg: 10.000, unit_cost_per_kg: 10.00 }, as: MaterialsPlanner, captures: { lot_id: $.data.id } }
            - { call: "POST /cleanliness-certificates", payload: { subject_type: MATERIAL_LOT, subject_id: "${lot_id}", grade: INDUSTRIAL, issued_at: "2026-04-01T00:00:00Z", expires_at: "2026-06-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector }
            - { call: "POST /tools", payload: { tool_code: "T-C1", part_number: "P-C1", tool_type: FORM_MOLD, min_gauge_mm: 1.000, max_gauge_mm: 3.000, cleanliness_grade: INDUSTRIAL, prototype_cost: 1000.00 }, as: ToolingEngineer, captures: { tool_id: $.data.id } }
            - { call: "POST /tools/${tool_id}/complete-prototype", as: ToolingEngineer }
            - { call: "POST /packaging-specs", payload: { spec_code: "S-C1", spec_type: STOCK, cleanliness_grade: INDUSTRIAL, per_pack_cost: 0.30 }, as: PackagingEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /production-orders", payload: { order_code: "O-C1", part_number: "P-C1", resin_type: PETG, ordered_qty: 50, required_gauge_mm: 1.500, cleanliness_grade: INDUSTRIAL, spec_nominal_wall_mm: 1.300, spec_min_wall_mm: 1.230, nominal_part_weight_kg: 0.050, std_cycle_time_s: 30, std_machine_rate_per_hour: 55.00, tool_id: "${tool_id}", packaging_spec_id: "${spec_id}", is_prototype_order: true }, as: ProductionScheduler, captures: { order_id: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-31T23:59:59Z" }, as: Any }
            - { call: "POST /material-allocations", payload: { production_order_id: "${order_id}", source_type: VIRGIN_LOT, lot_id: "${lot_id}", qty_kg: 1.000 }, as: ProductionScheduler, captures: { alloc_ok: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Any }
            - { call: "POST /material-allocations", payload: { production_order_id: "${order_id}", source_type: VIRGIN_LOT, lot_id: "${lot_id}", qty_kg: 1.000 }, as: ProductionScheduler, captures: { err: $.data.error_id } }
          assert:
            - "One second before expiry the allocation succeeds (id ${alloc_ok})"
            - "At exactly expires_at the allocation fails: error == ERR_CERTIFICATE_INVALID (captured ${err}) — half-open window boundary"
      - name: order_cost_constants_applied
        claim_type: constants_applied
        grounds: ["calculations.order_cost"]
        excluded_because:
          difficulty_instance: "dual_variant_calc / order_cost_provisional_vs_final_divergence"
          rationale: "SETUP_FEE 250.00, per-shot tooling 0.1000 and material pricing are asserted there as literals 369.00 / 379.00."
      - name: wall_thickness_precision_rounding
        claim_type: precision
        grounds: ["calculations.wall_thickness_distribution"]
        excluded_because:
          difficulty_instance: "combinatorial_formula / wall_thickness_per_measurement_rounding_order"
          rationale: "3dp HALF_UP per-measurement rounding and 2dp deviation precision are asserted there as literals 1.231 / 1.240 / 5.31."
      - name: blend_input_set_filtering
        claim_type: input_set_filtering
        grounds: ["calculations.regrind_blend_plan"]
        excluded_because:
          difficulty_instance: "combinatorial_formula / regrind_blend_cap_nested_min_gate"
          rationale: "Cumulative RESERVED-regrind input set (0.800 accepted, 0.100 rejected at 0.885 cap) is exercised there."
