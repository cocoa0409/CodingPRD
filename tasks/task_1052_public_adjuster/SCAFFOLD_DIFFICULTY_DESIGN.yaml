# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances = 18 instances. Grounds resolve into
# SCAFFOLD.yaml (SCAFFOLD_ prefix omitted). All setup_api_calls drive from
# empty-DB using only declared endpoints; the logical clock defaults to
# 2026-07-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: fee_provisional_estimate_vs_final_recovery_diverge
        grounds:
          - calculations.fee_assessment
          - entities.Claim.fields.provisional_fee_cents
          - entities.Claim.fields.final_fee_cents
          - state_machines.Claim.OFFER_RECEIVED_to_SETTLED
          - state_machines.Claim.SETTLED_to_PAID
        distinguishing_aspect: |
          The provisional fee is computed on the PA's ACV estimate (8000000 -> 800000)
          while the final fee is computed on the actual recovery (7000000 -> 700000);
          the two variants live on the Claim/Contract fee-accounting domain and produce
          different cents for the same claim.
        test_recipe:
          setup:
            - "An ACTIVE contract at fee_pct 0.10 (cap 0.10); a filed claim with pa_acv_estimate 8000000; carrier offer 7000000 accepted; a single cleared payment of 7000000 drives the claim to PAID."
          setup_api_calls:
            - { call: "POST /v1/adjusters", payload: { full_name: "Ada PA", firm_name: "Advocate LLC", email: "ada@x.com" }, as: FirmPrincipal, captures: { adj: $.data.id } }
            - { call: "POST /v1/licenses", payload: { adjuster_id: "${adj}", state_code: "TX", license_number: "TX-1", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: FirmPrincipal }
            - { call: "POST /v1/clients", payload: { full_name: "Cy Client", email: "cy@x.com", mailing_state: "TX" }, as: FirmPrincipal, captures: { cli: $.data.id } }
            - { call: "POST /v1/policies", payload: { client_id: "${cli}", carrier_name: "Acme", policy_number: "P1", policy_type: "HO3", coverage_limit_cents: 100000000, deductible_cents: 100000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: FirmPrincipal, captures: { pol: $.data.id } }
            - { call: "POST /v1/contracts", payload: { client_id: "${cli}", adjuster_id: "${adj}", loss_state_code: "TX", fee_pct: 0.10, statutory_cap_pct: 0.10, prior_advance_cents: 0 }, as: FirmPrincipal, captures: { con: $.data.id } }
            - { call: "POST /v1/contracts/${con}/sign", payload: {}, as: Client, as_user_id: "${cli}" }
            - { call: "POST /v1/contracts/${con}/activate", payload: {}, as: FirmPrincipal }
            - { call: "POST /v1/claims", payload: { policy_id: "${pol}", contract_id: "${con}", date_of_loss: "2026-06-15T00:00:00Z", loss_state_code: "TX", peril_type: "WIND", pa_rcv_estimate_cents: 10000000, depreciation_pct: 0.20 }, as: PublicAdjuster, as_user_id: "${adj}", captures: { clm: $.data.id } }
            - { call: "POST /v1/claims/${clm}/file", payload: {}, as: PublicAdjuster, as_user_id: "${adj}" }
            - { call: "POST /v1/claims/${clm}/record-offer", payload: { offer_cents: 7000000 }, as: Carrier }
            - { call: "POST /v1/claims/${clm}/accept-settlement", payload: {}, as: PublicAdjuster, as_user_id: "${adj}" }
            - { call: "POST /v1/payments", payload: { claim_id: "${clm}", amount_cents: 7000000, payment_type: "INITIAL" }, as: Carrier, captures: { pay: $.data.id } }
            - { call: "POST /v1/payments/${pay}/clear", payload: {}, as: Carrier }
          trigger:
            - { call: "GET /v1/claims/${clm}", payload: {}, as: FirmPrincipal }
          assert:
            - "Claim.${clm}.status == PAID"
            - "Claim.${clm}.provisional_fee_cents == 800000"
            - "Claim.${clm}.final_fee_cents == 700000"
            - "Claim.${clm}.provisional_fee_cents != Claim.${clm}.final_fee_cents"

      - name: policy_exposure_forward_vs_booked_diverge
        grounds:
          - calculations.policy_exposure
          - entities.Policy.fields.forward_exposure_cents
          - entities.Policy.fields.committed_cents
          - state_machines.Claim.DRAFT_to_FILED
          - state_machines.Claim.OFFER_RECEIVED_to_SETTLED
        distinguishing_aspect: |
          On the Policy domain, forward exposure sums ACV estimates over every non-terminal
          claim (8000000 + 6000000 = 14000000) while booked exposure counts only settled
          claims at their committed settlement (5000000); the two algorithms diverge on the
          same policy.
        test_recipe:
          setup:
            - "One policy with two claims on the same active contract: claim A filed (ACV 8000000, open), claim B settled at 5000000 (ACV 6000000)."
          setup_api_calls:
            - { call: "POST /v1/adjusters", payload: { full_name: "Ada PA", firm_name: "Advocate LLC", email: "ada@x.com" }, as: FirmPrincipal, captures: { adj: $.data.id } }
            - { call: "POST /v1/licenses", payload: { adjuster_id: "${adj}", state_code: "TX", license_number: "TX-1", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: FirmPrincipal }
            - { call: "POST /v1/clients", payload: { full_name: "Cy Client", email: "cy@x.com", mailing_state: "TX" }, as: FirmPrincipal, captures: { cli: $.data.id } }
            - { call: "POST /v1/policies", payload: { client_id: "${cli}", carrier_name: "Acme", policy_number: "P1", policy_type: "HO3", coverage_limit_cents: 100000000, deductible_cents: 100000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: FirmPrincipal, captures: { pol: $.data.id } }
            - { call: "POST /v1/contracts", payload: { client_id: "${cli}", adjuster_id: "${adj}", loss_state_code: "TX", fee_pct: 0.10, statutory_cap_pct: 0.10 }, as: FirmPrincipal, captures: { con: $.data.id } }
            - { call: "POST /v1/contracts/${con}/sign", payload: {}, as: Client, as_user_id: "${cli}" }
            - { call: "POST /v1/contracts/${con}/activate", payload: {}, as: FirmPrincipal }
            - { call: "POST /v1/claims", payload: { policy_id: "${pol}", contract_id: "${con}", date_of_loss: "2026-06-15T00:00:00Z", loss_state_code: "TX", peril_type: "WIND", pa_rcv_estimate_cents: 10000000, depreciation_pct: 0.20 }, as: PublicAdjuster, as_user_id: "${adj}", captures: { clmA: $.data.id } }
            - { call: "POST /v1/claims/${clmA}/file", payload: {}, as: PublicAdjuster, as_user_id: "${adj}" }
            - { call: "POST /v1/claims", payload: { policy_id: "${pol}", contract_id: "${con}", date_of_loss: "2026-06-20T00:00:00Z", loss_state_code: "TX", peril_type: "HAIL", pa_rcv_estimate_cents: 7500000, depreciation_pct: 0.20 }, as: PublicAdjuster, as_user_id: "${adj}", captures: { clmB: $.data.id } }
            - { call: "POST /v1/claims/${clmB}/file", payload: {}, as: PublicAdjuster, as_user_id: "${adj}" }
            - { call: "POST /v1/claims/${clmB}/record-offer", payload: { offer_cents: 5000000 }, as: Carrier }
            - { call: "POST /v1/claims/${clmB}/accept-settlement", payload: {}, as: PublicAdjuster, as_user_id: "${adj}" }
          trigger:
            - { call: "GET /v1/policies/${pol}", payload: {}, as: FirmPrincipal }
          assert:
            - "Policy.${pol}.forward_exposure_cents == 14000000"
            - "Policy.${pol}.committed_cents == 5000000"
            - "Policy.${pol}.remaining_limit_cents == 95000000"
            - "Policy.${pol}.forward_exposure_cents != Policy.${pol}.committed_cents"

  - rule_id: combinatorial_formula
    instances:
      - name: disbursement_waterfall_fee_then_advance_recoup_then_client
        grounds:
          - calculations.disbursement_waterfall
          - entities.Disbursement.fields.fee_cents
          - entities.Disbursement.fields.advance_recoup_cents
          - entities.Disbursement.fields.client_cents
          - state_machines.Payment.RECEIVED_to_CLEARED
        distinguishing_aspect: |
          Mode (a): the waterfall has 3 inputs (gross 8000000, effective_pct 0.10, advance
          outstanding 500000) with a nested min — fee 800000 first, then advance recoup
          min(7200000,500000)=500000, then client 6700000.
        test_recipe:
          setup:
            - "Active contract with prior_advance_cents 500000; claim settled at 8000000; one payment of 8000000 cleared, creating the disbursement."
          setup_api_calls:
            - { call: "POST /v1/adjusters", payload: { full_name: "Ada PA", firm_name: "Advocate LLC", email: "ada@x.com" }, as: FirmPrincipal, captures: { adj: $.data.id } }
            - { call: "POST /v1/licenses", payload: { adjuster_id: "${adj}", state_code: "TX", license_number: "TX-1", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: FirmPrincipal }
            - { call: "POST /v1/clients", payload: { full_name: "Cy Client", email: "cy@x.com", mailing_state: "TX" }, as: FirmPrincipal, captures: { cli: $.data.id } }
            - { call: "POST /v1/policies", payload: { client_id: "${cli}", carrier_name: "Acme", policy_number: "P1", policy_type: "HO3", coverage_limit_cents: 100000000, deductible_cents: 100000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: FirmPrincipal, captures: { pol: $.data.id } }
            - { call: "POST /v1/contracts", payload: { client_id: "${cli}", adjuster_id: "${adj}", loss_state_code: "TX", fee_pct: 0.10, statutory_cap_pct: 0.10, prior_advance_cents: 500000 }, as: FirmPrincipal, captures: { con: $.data.id } }
            - { call: "POST /v1/contracts/${con}/sign", payload: {}, as: Client, as_user_id: "${cli}" }
            - { call: "POST /v1/contracts/${con}/activate", payload: {}, as: FirmPrincipal }
            - { call: "POST /v1/claims", payload: { policy_id: "${pol}", contract_id: "${con}", date_of_loss: "2026-06-15T00:00:00Z", loss_state_code: "TX", peril_type: "WIND", pa_rcv_estimate_cents: 10000000, depreciation_pct: 0.20 }, as: PublicAdjuster, as_user_id: "${adj}", captures: { clm: $.data.id } }
            - { call: "POST /v1/claims/${clm}/file", payload: {}, as: PublicAdjuster, as_user_id: "${adj}" }
            - { call: "POST /v1/claims/${clm}/record-offer", payload: { offer_cents: 8000000 }, as: Carrier }
            - { call: "POST /v1/claims/${clm}/accept-settlement", payload: {}, as: PublicAdjuster, as_user_id: "${adj}" }
            - { call: "POST /v1/payments", payload: { claim_id: "${clm}", amount_cents: 8000000, payment_type: "INITIAL" }, as: Carrier, captures: { pay: $.data.id } }
            - { call: "POST /v1/payments/${pay}/clear", payload: {}, as: Carrier }
          trigger:
            - { call: "GET /v1/disbursements", payload: { claim_id: "${clm}" }, as: FirmPrincipal, captures: { dis: "$.data[0].id" } }
          assert:
            - "Disbursement.${dis}.gross_cents == 8000000"
            - "Disbursement.${dis}.fee_cents == 800000"
            - "Disbursement.${dis}.advance_recoup_cents == 500000"
            - "Disbursement.${dis}.client_cents == 6700000"

      - name: final_fee_per_payment_rounding_beats_aggregate_rounding
        grounds:
          - calculations.total_fee_rounding
          - entities.Claim.fields.final_fee_cents
          - state_machines.Payment.RECEIVED_to_CLEARED
          - state_machines.Claim.SETTLED_to_PAID
        distinguishing_aspect: |
          Mode (b): rounding order is pinned per-payment — two payments of 12345 yield
          round(1234.5)+round(1234.5)=2470, whereas rounding the aggregate would give
          round(2469.0)=2469; the final fee must be 2470.
        test_recipe:
          setup:
            - "Claim settled at 24690; two cleared payments of 12345 each drive the claim to PAID."
          setup_api_calls:
            - { call: "POST /v1/adjusters", payload: { full_name: "Ada PA", firm_name: "Advocate LLC", email: "ada@x.com" }, as: FirmPrincipal, captures: { adj: $.data.id } }
            - { call: "POST /v1/licenses", payload: { adjuster_id: "${adj}", state_code: "TX", license_number: "TX-1", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: FirmPrincipal }
            - { call: "POST /v1/clients", payload: { full_name: "Cy Client", email: "cy@x.com", mailing_state: "TX" }, as: FirmPrincipal, captures: { cli: $.data.id } }
            - { call: "POST /v1/policies", payload: { client_id: "${cli}", carrier_name: "Acme", policy_number: "P1", policy_type: "HO3", coverage_limit_cents: 100000000, deductible_cents: 100000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: FirmPrincipal, captures: { pol: $.data.id } }
            - { call: "POST /v1/contracts", payload: { client_id: "${cli}", adjuster_id: "${adj}", loss_state_code: "TX", fee_pct: 0.10, statutory_cap_pct: 0.10 }, as: FirmPrincipal, captures: { con: $.data.id } }
            - { call: "POST /v1/contracts/${con}/sign", payload: {}, as: Client, as_user_id: "${cli}" }
            - { call: "POST /v1/contracts/${con}/activate", payload: {}, as: FirmPrincipal }
            - { call: "POST /v1/claims", payload: { policy_id: "${pol}", contract_id: "${con}", date_of_loss: "2026-06-15T00:00:00Z", loss_state_code: "TX", peril_type: "WATER", pa_rcv_estimate_cents: 30000000, depreciation_pct: 0.20 }, as: PublicAdjuster, as_user_id: "${adj}", captures: { clm: $.data.id } }
            - { call: "POST /v1/claims/${clm}/file", payload: {}, as: PublicAdjuster, as_user_id: "${adj}" }
            - { call: "POST /v1/claims/${clm}/record-offer", payload: { offer_cents: 24690 }, as: Carrier }
            - { call: "POST /v1/claims/${clm}/accept-settlement", payload: {}, as: PublicAdjuster, as_user_id: "${adj}" }
            - { call: "POST /v1/payments", payload: { claim_id: "${clm}", amount_cents: 12345, payment_type: "INITIAL" }, as: Carrier, captures: { pay1: $.data.id } }
            - { call: "POST /v1/payments/${pay1}/clear", payload: {}, as: Carrier }
            - { call: "POST /v1/payments", payload: { claim_id: "${clm}", amount_cents: 12345, payment_type: "INITIAL" }, as: Carrier, captures: { pay2: $.data.id } }
            - { call: "POST /v1/payments/${pay2}/clear", payload: {}, as: Carrier }
          trigger:
            - { call: "GET /v1/claims/${clm}", payload: {}, as: FirmPrincipal }
          assert:
            - "Claim.${clm}.status == PAID"
            - "Claim.${clm}.amount_recovered_cents == 24690"
            - "Claim.${clm}.final_fee_cents == 2470"

  - rule_id: non_linear_state_machine
    instances:
      - name: claim_offer_counter_offer_negotiation_cycle
        grounds:
          - state_machines.Claim.OFFER_RECEIVED_to_NEGOTIATING
          - state_machines.Claim.NEGOTIATING_to_OFFER_RECEIVED
          - entities.Claim.fields.negotiation_round
        distinguishing_aspect: |
          Cycle on the Claim entity: OFFER_RECEIVED -> NEGOTIATING (counter) -> OFFER_RECEIVED
          (new offer) returns to the same state with negotiation_round advanced to 3.
        test_recipe:
          setup:
            - "A filed claim that receives an offer, is countered, then receives a second offer."
          setup_api_calls:
            - { call: "POST /v1/adjusters", payload: { full_name: "Ada PA", firm_name: "Advocate LLC", email: "ada@x.com" }, as: FirmPrincipal, captures: { adj: $.data.id } }
            - { call: "POST /v1/licenses", payload: { adjuster_id: "${adj}", state_code: "TX", license_number: "TX-1", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: FirmPrincipal }
            - { call: "POST /v1/clients", payload: { full_name: "Cy Client", email: "cy@x.com", mailing_state: "TX" }, as: FirmPrincipal, captures: { cli: $.data.id } }
            - { call: "POST /v1/policies", payload: { client_id: "${cli}", carrier_name: "Acme", policy_number: "P1", policy_type: "HO3", coverage_limit_cents: 100000000, deductible_cents: 100000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: FirmPrincipal, captures: { pol: $.data.id } }
            - { call: "POST /v1/contracts", payload: { client_id: "${cli}", adjuster_id: "${adj}", loss_state_code: "TX", fee_pct: 0.10, statutory_cap_pct: 0.10 }, as: FirmPrincipal, captures: { con: $.data.id } }
            - { call: "POST /v1/contracts/${con}/sign", payload: {}, as: Client, as_user_id: "${cli}" }
            - { call: "POST /v1/contracts/${con}/activate", payload: {}, as: FirmPrincipal }
            - { call: "POST /v1/claims", payload: { policy_id: "${pol}", contract_id: "${con}", date_of_loss: "2026-06-15T00:00:00Z", loss_state_code: "TX", peril_type: "WIND", pa_rcv_estimate_cents: 10000000, depreciation_pct: 0.20 }, as: PublicAdjuster, as_user_id: "${adj}", captures: { clm: $.data.id } }
            - { call: "POST /v1/claims/${clm}/file", payload: {}, as: PublicAdjuster, as_user_id: "${adj}" }
            - { call: "POST /v1/claims/${clm}/record-offer", payload: { offer_cents: 5000000 }, as: Carrier }
            - { call: "POST /v1/claims/${clm}/counter", payload: { counter_cents: 6000000 }, as: PublicAdjuster, as_user_id: "${adj}" }
          trigger:
            - { call: "POST /v1/claims/${clm}/record-offer", payload: { offer_cents: 5500000 }, as: Carrier }
          assert:
            - "Claim.${clm}.status == OFFER_RECEIVED"
            - "Claim.${clm}.negotiation_round == 3"
            - "Claim.${clm}.carrier_offer_cents == 5500000"
            - "Claim.${clm}.pa_counter_cents == 6000000"

      - name: appraisal_disagree_umpire_branch_to_award
        grounds:
          - state_machines.Appraisal.APPRAISERS_NAMED_to_UMPIRE_SELECTED
          - state_machines.Appraisal.UMPIRE_SELECTED_to_AWARDED
          - state_machines.Appraisal.APPRAISERS_NAMED_to_AWARDED
          - state_machines.Claim.IN_APPRAISAL_to_SETTLED
        distinguishing_aspect: |
          Branching fork-join on the Appraisal entity (distinct from Claim): when appraiser
          amounts differ (8000000 vs 6000000) the umpire branch is taken (select-umpire ->
          render-award 7000000 in range), diverging from the agree branch that skips the umpire.
        test_recipe:
          setup:
            - "A claim in IN_APPRAISAL with an appraisal INVOKED after a carrier offer; appraisers disagree (PA 8000000, carrier 6000000)."
          setup_api_calls:
            - { call: "POST /v1/adjusters", payload: { full_name: "Ada PA", firm_name: "Advocate LLC", email: "ada@x.com" }, as: FirmPrincipal, captures: { adj: $.data.id } }
            - { call: "POST /v1/licenses", payload: { adjuster_id: "${adj}", state_code: "TX", license_number: "TX-1", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: FirmPrincipal }
            - { call: "POST /v1/clients", payload: { full_name: "Cy Client", email: "cy@x.com", mailing_state: "TX" }, as: FirmPrincipal, captures: { cli: $.data.id } }
            - { call: "POST /v1/policies", payload: { client_id: "${cli}", carrier_name: "Acme", policy_number: "P1", policy_type: "HO3", coverage_limit_cents: 100000000, deductible_cents: 100000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: FirmPrincipal, captures: { pol: $.data.id } }
            - { call: "POST /v1/contracts", payload: { client_id: "${cli}", adjuster_id: "${adj}", loss_state_code: "TX", fee_pct: 0.10, statutory_cap_pct: 0.10 }, as: FirmPrincipal, captures: { con: $.data.id } }
            - { call: "POST /v1/contracts/${con}/sign", payload: {}, as: Client, as_user_id: "${cli}" }
            - { call: "POST /v1/contracts/${con}/activate", payload: {}, as: FirmPrincipal }
            - { call: "POST /v1/claims", payload: { policy_id: "${pol}", contract_id: "${con}", date_of_loss: "2026-06-15T00:00:00Z", loss_state_code: "TX", peril_type: "FIRE", pa_rcv_estimate_cents: 10000000, depreciation_pct: 0.20 }, as: PublicAdjuster, as_user_id: "${adj}", captures: { clm: $.data.id } }
            - { call: "POST /v1/claims/${clm}/file", payload: {}, as: PublicAdjuster, as_user_id: "${adj}" }
            - { call: "POST /v1/claims/${clm}/record-offer", payload: { offer_cents: 6000000 }, as: Carrier }
            - { call: "POST /v1/appraisals", payload: { claim_id: "${clm}" }, as: PublicAdjuster, as_user_id: "${adj}", captures: { app: $.data.id } }
            - { call: "POST /v1/appraisals/${app}/name-appraisers", payload: { pa_appraiser_name: "Pat", pa_appraiser_amount_cents: 8000000, carrier_appraiser_name: "Casey", carrier_appraiser_amount_cents: 6000000 }, as: PublicAdjuster, as_user_id: "${adj}" }
            - { call: "POST /v1/appraisals/${app}/select-umpire", payload: { umpire_name: "Uma" }, as: PublicAdjuster, as_user_id: "${adj}" }
          trigger:
            - { call: "POST /v1/appraisals/${app}/render-award", payload: { award_cents: 7000000 }, as: PublicAdjuster, as_user_id: "${adj}" }
          assert:
            - "Appraisal.${app}.status == AWARDED"
            - "Appraisal.${app}.award_cents == 7000000"
            - "Appraisal.${app}.umpire_name == Uma"
            - "Claim.${clm}.status == SETTLED"
            - "Claim.${clm}.settlement_amount_cents == 7000000"

  - rule_id: transitive_cascade
    instances:
      - name: payment_clear_cascade_paid_completed_disbursed
        grounds:
          - state_machines.Payment.RECEIVED_to_CLEARED
          - state_machines.Claim.SETTLED_to_PAID
          - state_machines.Contract.ACTIVE_to_COMPLETED
          - entities.Disbursement.fields.status
        distinguishing_aspect: |
          Depth-3 cascade from Payment clear: clearing the payment (A) drives Claim SETTLED->PAID
          (B), whose PAID transition drives Contract ACTIVE->COMPLETED and materialises a PENDING
          Disbursement (C) — each link caused by the previous.
        test_recipe:
          setup:
            - "Claim settled at 8000000; one payment of 8000000 recorded (RECEIVED), not yet cleared."
          setup_api_calls:
            - { call: "POST /v1/adjusters", payload: { full_name: "Ada PA", firm_name: "Advocate LLC", email: "ada@x.com" }, as: FirmPrincipal, captures: { adj: $.data.id } }
            - { call: "POST /v1/licenses", payload: { adjuster_id: "${adj}", state_code: "TX", license_number: "TX-1", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: FirmPrincipal }
            - { call: "POST /v1/clients", payload: { full_name: "Cy Client", email: "cy@x.com", mailing_state: "TX" }, as: FirmPrincipal, captures: { cli: $.data.id } }
            - { call: "POST /v1/policies", payload: { client_id: "${cli}", carrier_name: "Acme", policy_number: "P1", policy_type: "HO3", coverage_limit_cents: 100000000, deductible_cents: 100000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: FirmPrincipal, captures: { pol: $.data.id } }
            - { call: "POST /v1/contracts", payload: { client_id: "${cli}", adjuster_id: "${adj}", loss_state_code: "TX", fee_pct: 0.10, statutory_cap_pct: 0.10 }, as: FirmPrincipal, captures: { con: $.data.id } }
            - { call: "POST /v1/contracts/${con}/sign", payload: {}, as: Client, as_user_id: "${cli}" }
            - { call: "POST /v1/contracts/${con}/activate", payload: {}, as: FirmPrincipal }
