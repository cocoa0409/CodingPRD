            - "DeliveryWave.${wave_3}.status == FORMING"
            - "GET /delivery-waves?dock_bay_id=${bay_id} returns total_count == 3"
            - "DeliveryWave.${wave_4}.load_start == 2026-08-05T09:30:00.000Z"
            - "DeliveryWave.${wave_4}.status == FORMING"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: slot_capacity_conserved_across_book_and_cancel
        grounds:
          - calculations.slot_capacity_ledger
          - state_machines.SlotBooking.HELD_to_CONFIRMED
          - state_machines.SlotBooking.CONFIRMED_to_RELEASED
          - entities.DeliverySlot.fields.available_units
          - entities.DeliverySlot.fields.withheld_units
        distinguishing_aspect: |
          The identity total_capacity_units == withheld_units + held_units + confirmed_units +
          available_units holds at all three checkpoints of a book -> confirm -> cancel round trip
          on a slot with a non-zero withheld_units of 2: 10 == 2+5+0+3 after booking, 10 == 2+0+5+3
          after confirm, and 10 == 2+0+0+8 after cancel. The cancel is the exact compensating
          action, so available_units returns to its pre-booking value of 8 with zero drift and the
          withheld 2 units are never absorbed.
        test_recipe:
          setup:
            - "One slot on R1 with total_capacity_units 10 and withheld_units 2, so available_units starts at 8 and effective capacity is 8."
            - "One BASIC customer on R1 whose order carries one line of ordered_qty 2 (merchandise_subtotal_cents 1400)."
            - "The customer has booked 5 units (HELD, then CONFIRMED), leaving held_units 0, confirmed_units 5 and available_units 3, and the order SLOTTED / AUTHORIZED at 1999."
            - "The order is not in any wave."
          setup_api_calls:
            - call: "POST /delivery-routes"
              payload: { route_code: "R1", service_area_name: "North", van_capacity_totes: 40, base_delivery_fee_cents: 599, per_km_cost_cents: 150 }
              as: FulfillmentAdmin
              captures: { route_id: $.data.id }
            - call: "POST /grid-zones"
              payload: { zone_code: "A1", temperature_zone: "AMBIENT", bot_count: 4 }
              as: FulfillmentAdmin
              captures: { zone_amb: $.data.id }
            - call: "POST /inventory-skus"
              payload: { sku_code: "AMB-1", name: "Pasta", grid_zone_id: "${zone_amb}", temperature_zone: "AMBIENT", substitution_group_code: "DRY", is_catchweight: false, unit_price_cents: 700, physical_units: 100 }
              as: FulfillmentAdmin
              captures: { sku_amb: $.data.id }
            - call: "POST /delivery-slots"
              payload: { route_id: "${route_id}", window_start: "2026-08-05T10:00:00.000Z", window_end: "2026-08-05T12:00:00.000Z", total_capacity_units: 10, withheld_units: 2 }
              as: FulfillmentAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /customer-accounts"
              payload: { email: "ann@x.test", full_name: "Ann Basic", loyalty_tier: "BASIC", home_route_id: "${route_id}" }
              as: FulfillmentAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /customer-orders"
              payload: { stop_distance_km: 2.03 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /customer-orders/${order_id}/lines"
              payload: { sku_id: "${sku_amb}", ordered_qty: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "GET /customer-orders/${order_id}"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_v: $.data.version }
            - call: "POST /slot-bookings"
              payload: { delivery_slot_id: "${slot_id}", customer_order_id: "${order_id}", units: 5, expected_order_version: "${order_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /slot-bookings/${booking_id}/confirm"
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /customer-orders/${order_id}/cancel"
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "DeliverySlot.${slot_id}.total_capacity_units == 10"
            - "DeliverySlot.${slot_id}.withheld_units == 2"
            - "DeliverySlot.${slot_id}.held_units == 0"
            - "DeliverySlot.${slot_id}.confirmed_units == 0"
            - "DeliverySlot.${slot_id}.available_units == 8"
            - "DeliverySlot.${slot_id}.surge_multiplier == 1.00"
            - "SlotBooking.${booking_id}.status == RELEASED"
            - "SlotBooking.${booking_id}.units == 5"
            - "CustomerOrder.${order_id}.fulfillment_status == CANCELLED"
            - "CustomerOrder.${order_id}.billing_status == REVERSED"
            - "CustomerOrder.${order_id}.authorized_amount_cents == 1999"
            - "OrderLine.${line_id}.line_status == CANCELLED"

      - name: sku_on_hand_conserved_across_allocation_and_cancel
        grounds:
          - calculations.sku_unit_ledger
          - state_machines.PickTask.QUEUED_to_CANCELLED
          - entities.InventorySku.fields.allocated_units
          - entities.InventorySku.fields.on_hand_units
          - entities.PickTask.fields.allocated_units
        distinguishing_aspect: |
          The identity physical_units == on_hand_units + allocated_units holds across a forward
          allocation and its exact reversal: start-picking moves 3 units from on_hand (100 -> 97)
          into allocated (0 -> 3) WITHOUT touching physical_units, and cancelling the task returns
          them precisely (allocated 0, on_hand 100) while physical_units never moves from 100. A
          naive implementation that decrements physical_units at allocation cannot restore 100.
        test_recipe:
          setup:
            - "One AMBIENT SKU with physical_units 100, allocated_units 0 and on_hand_units 100."
            - "One BASIC customer with a CONFIRMED order carrying one line of ordered_qty 3 (merchandise_subtotal_cents 2100)."
            - "The order has been slotted into a wave and start-picking has run, so exactly one QUEUED PickTask exists with allocated_units 3, the SKU reads allocated_units 3 / on_hand_units 97, and physical_units is still 100."
            - "No tote has been bound to the task."
          setup_api_calls:
            - call: "POST /delivery-routes"
              payload: { route_code: "R1", service_area_name: "North", van_capacity_totes: 40, base_delivery_fee_cents: 599, per_km_cost_cents: 150 }
              as: FulfillmentAdmin
              captures: { route_id: $.data.id }
            - call: "POST /grid-zones"
              payload: { zone_code: "A1", temperature_zone: "AMBIENT", bot_count: 4 }
              as: FulfillmentAdmin
              captures: { zone_amb: $.data.id }
            - call: "POST /pick-stations"
              payload: { station_code: "S1", temperature_zone_capability: ["AMBIENT"], max_concurrent_totes: 4 }
              as: FulfillmentAdmin
              captures: { station_id: $.data.id }
            - call: "POST /inventory-skus"
              payload: { sku_code: "AMB-1", name: "Pasta", grid_zone_id: "${zone_amb}", temperature_zone: "AMBIENT", substitution_group_code: "DRY", is_catchweight: false, unit_price_cents: 700, physical_units: 100 }
              as: FulfillmentAdmin
              captures: { sku_amb: $.data.id }
            - call: "POST /delivery-slots"
              payload: { route_id: "${route_id}", window_start: "2026-08-05T10:00:00.000Z", window_end: "2026-08-05T12:00:00.000Z", total_capacity_units: 10, withheld_units: 0 }
              as: FulfillmentAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /customer-accounts"
              payload: { email: "ann@x.test", full_name: "Ann Basic", loyalty_tier: "BASIC", home_route_id: "${route_id}" }
              as: FulfillmentAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /customer-orders"
              payload: { stop_distance_km: 2.03 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /customer-orders/${order_id}/lines"
              payload: { sku_id: "${sku_amb}", ordered_qty: 3 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "GET /customer-orders/${order_id}"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_v: $.data.version }
            - call: "POST /slot-bookings"
              payload: { delivery_slot_id: "${slot_id}", customer_order_id: "${order_id}", units: 1, expected_order_version: "${order_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /slot-bookings/${booking_id}/confirm"
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /delivery-waves"
              payload: { route_id: "${route_id}", delivery_slot_id: "${slot_id}", wave_code: "W1", cutoff_at: "2026-08-05T08:00:00.000Z" }
              as: WavePlanner
              as_user_id: "planner-1"
              captures: { wave_id: $.data.id }
            - call: "POST /delivery-waves/${wave_id}/slot-orders"
              payload: { customer_order_id: "${order_id}" }
              as: WavePlanner
              as_user_id: "planner-1"
            - call: "POST /delivery-waves/${wave_id}/start-picking"
              as: WavePlanner
              as_user_id: "planner-1"
            - call: "GET /pick-tasks"
              payload: { order_line_id: "${line_id}" }
              as: PickOperator
              as_user_id: "picker-1"
              captures: { task_id: "$.data[0].id", task_alloc: "$.data[0].allocated_units" }
          trigger:
            - call: "POST /pick-tasks/${task_id}/cancel"
              as: PickOperator
              as_user_id: "picker-1"
          assert:
            - "${task_alloc} == 3"
            - "PickTask.${task_id}.status == CANCELLED"
            - "InventorySku.${sku_amb}.physical_units == 100"
            - "InventorySku.${sku_amb}.allocated_units == 0"
            - "InventorySku.${sku_amb}.on_hand_units == 100"
            - "OrderLine.${line_id}.line_status == PENDING"
            - "OrderLine.${line_id}.picked_units == null"
            - "CustomerOrder.${order_id}.merchandise_subtotal_cents == 2100"
            - "CustomerOrder.${order_id}.order_total_cents == 2699"
            - "DeliveryWave.${wave_id}.status == PICKING"
            - "DeliveryWave.${wave_id}.posture == OPEN"
