            - "MonthlyReturn.${d_ret_id}.interest_cents == 0 and penalty_cents == 0 and total_remittance_cents == 6181"
            - "ReturnSchedule.${d_sch_und}.total_gallons == 200.02 and line_count == 2"
            - "Licensee.${dist_id}.balance_cents == 6181 and exactly one LedgerEntry of entry_type RETURN_TAX exists for the licensee"
            - "Licensee.${dist_id}.late_filing_count == 0"

      - name: late_filing_interest_then_penalty_tier_then_floor
        grounds:
          - calculations.return_penalty_and_interest
          - calculations.monthly_return_tax_due
          - entities.MonthlyReturn.fields.days_late
          - entities.MonthlyReturn.fields.interest_cents
          - entities.MonthlyReturn.fields.penalty_cents
          - entities.Licensee.fields.late_filing_count
        distinguishing_aspect: |
          Mode (c) - an apparently circular dependency with a pinned resolution order: interest is
          keyed on tax alone (6181 * 0.00025 * 15 -> 23), the penalty percentage is keyed on the
          tax+interest subtotal (6204 at the 5% tier -> 310), and the statutory floor then overrides
          the tier result (max(5000, 310) -> 5000), giving total_remittance_cents 11204; computing
          the penalty before interest, or skipping the floor, yields a different number.
        test_recipe:
          setup:
            - "Identical licensee and schedule fixture to return_tax_due_single_rounding_per_product (tax_due_cents 6181)."
            - "The clock is moved to 2026-10-05T00:00:00Z before filing, i.e. 14 days and 1 second past the 2026-09-20T23:59:59Z due instant, so days_late ceils to 15."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Northline Fuel Supply LLC", fein: "41-1000001", license_type: "SUPPLIER", mailing_state: "MN", gross_net_election: "NET" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id, sup_v0: $.data.version }
            - call: "POST /mft/licensees/${sup_id}/bonds"
              payload: { amount_cents: 1500000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${sup_v0}" }
              as: LicensingOfficer
            - call: "POST /mft/licensees/${sup_id}/activate"
              payload: {}
              as: LicensingOfficer
            - call: "POST /mft/licensees"
              payload: { legal_name: "Ridgeway Fuel Distribution Inc", fein: "41-1000002", license_type: "DISTRIBUTOR", mailing_state: "MN", gross_net_election: "NET" }
              as: LicensingOfficer
              captures: { dist_id: $.data.id, dist_v0: $.data.version }
            - call: "POST /mft/licensees/${dist_id}/bonds"
              payload: { amount_cents: 1500000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${dist_v0}" }
              as: LicensingOfficer
            - call: "POST /mft/licensees/${dist_id}/activate"
              payload: {}
              as: LicensingOfficer
            - call: "POST /mft/returns"
              payload: { licensee_id: "${dist_id}", period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { d_ret_id: $.data.id }
            - call: "POST /mft/returns/${d_ret_id}/schedules"
              payload: { schedule_code: "SCH_2_RECEIVED_TAX_UNPAID", product_code: "UNDYED_DIESEL", total_gallons: 200.02 }
              as: ReturnsExaminer
              captures: { d_sch_und: $.data.id }
            - call: "POST /mft/schedules/${d_sch_und}/lines"
              payload: { counterparty_licensee_id: "${sup_id}", transaction_type: "PURCHASE", gallons: 100.01, document_date: "2026-08-07", bill_of_lading_number: "BOL-D2-UND-001" }
              as: ReturnsExaminer
            - call: "POST /mft/schedules/${d_sch_und}/lines"
              payload: { counterparty_licensee_id: "${sup_id}", transaction_type: "PURCHASE", gallons: 100.01, document_date: "2026-08-08", bill_of_lading_number: "BOL-D2-UND-002" }
              as: ReturnsExaminer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T00:00:00Z" }
              as: ReturnsExaminer
          trigger:
            - call: "POST /mft/returns/${d_ret_id}/file"
              payload: { attest_name: "D. Ridgeway" }
              as: ReturnsExaminer
          assert:
            - "MonthlyReturn.${d_ret_id}.days_late == 15"
            - "MonthlyReturn.${d_ret_id}.tax_due_cents == 6181"
            - "MonthlyReturn.${d_ret_id}.interest_cents == 23"
            - "MonthlyReturn.${d_ret_id}.penalty_cents == 5000 (the 5% tier on the 6204 subtotal computes 310, which the 5000 floor overrides)"
            - "MonthlyReturn.${d_ret_id}.total_remittance_cents == 11204"
            - "Licensee.${dist_id}.balance_cents == 11204"
            - "GET /mft/licensees/${dist_id}/ledger-entries returns exactly three rows: RETURN_TAX +6181, INTEREST +23, PENALTY +5000"
            - "Licensee.${dist_id}.late_filing_count == 1"

  - rule_id: non_linear_state_machine
    instances:
      - name: licensee_suspend_reactivate_cycle_doubles_then_restores_bond_requirement
        grounds:
          - state_machines.Licensee.ACTIVE_to_SUSPENDED
          - state_machines.Licensee.SUSPENDED_to_ACTIVE
          - state_machines.BondInstrument.ACTIVE_to_RELEASED
          - calculations.licensee_bond_requirement
          - validations[priority=502]
          - errors[ERR_BOND_DEFICIENCY_BLOCKS_ACTIVATION]
        distinguishing_aspect: |
          Entity is Licensee and the non-linearity is a re-entrant cycle ACTIVE -> SUSPENDED -> ACTIVE
          whose guard is financial, not positional: suspension doubles required_bond_cents from
          1500000 to 3000000 and the return edge is refused with ERR_BOND_DEFICIENCY_BLOCKS_ACTIVATION
          until a superseding 3000000 bond is posted, after which the same state is re-entered with
          required_bond_cents back at 1500000 - so the entity's field values differ on each visit to
          ACTIVE while the status label is identical.
        test_recipe:
          setup:
            - "One SUPPLIER created with no filed returns, so avg_monthly_tax_liability_cents is the assumed 500000 and required_bond_cents is 1500000."
            - "A single 1600000 bond posted and the licensee activated (deficiency 0 at the 1.0 multiplier)."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Northline Fuel Supply LLC", fein: "41-1000001", license_type: "SUPPLIER", mailing_state: "MN", gross_net_election: "NET" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id, sup_v0: $.data.version }
            - call: "POST /mft/licensees/${sup_id}/bonds"
              payload: { amount_cents: 1600000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${sup_v0}" }
              as: LicensingOfficer
              captures: { bond1_id: $.data.id }
            - call: "POST /mft/licensees/${sup_id}/activate"
              payload: {}
              as: LicensingOfficer
          trigger:
            - call: "POST /mft/licensees/${sup_id}/suspend"
              payload: { reason: "Unreported gallons referral pending" }
              as: LicensingOfficer
              captures: { sup_v_susp: $.data.version }
            - call: "POST /mft/licensees/${sup_id}/activate"
              payload: {}
              as: LicensingOfficer
            - call: "POST /mft/licensees/${sup_id}/bonds"
              payload: { amount_cents: 3000000, surety_name: "Granite Surety Co", effective_date: "2026-07-15", expected_licensee_version: "${sup_v_susp}" }
              as: LicensingOfficer
              captures: { bond2_id: $.data.id }
            - call: "POST /mft/licensees/${sup_id}/activate"
              payload: {}
              as: LicensingOfficer
          assert:
            - "after the suspend call: Licensee.${sup_id}.status == SUSPENDED, required_bond_cents == 3000000, posted_bond_cents == 1600000, bond_deficiency_cents == 1400000"
            - "the first activate attempt returns 422 with error_id == ERR_BOND_DEFICIENCY_BLOCKS_ACTIVATION and Licensee.${sup_id}.status stays SUSPENDED"
            - "BondInstrument.${bond1_id}.status == RELEASED with release_reason == SUPERSEDED_BY_NEW_BOND once bond2 is posted"
            - "BondInstrument.${bond2_id}.status == ACTIVE and amount_cents == 3000000"
            - "after bond2 the SUSPENDED licensee shows required_bond_cents == 3000000, posted_bond_cents == 3000000, bond_deficiency_cents == 0"
            - "the second activate returns 200 and Licensee.${sup_id}.status == ACTIVE"
            - "on the second visit to ACTIVE: required_bond_cents == 1500000 (multiplier back to 1.0), posted_bond_cents == 3000000, bond_deficiency_cents == 0"
            - "Licensee.${sup_id}.dyed_violation_count == 0, so ERR_DYED_VIOLATION_HOLD never fires on this path"
            - "Licensee.${sup_id}.balance_cents == 0 throughout (bond movements post no LedgerEntry)"

      - name: audit_case_parallel_dimensions_with_response_round_cycle
        grounds:
          - state_machines.AuditCase.TAXPAYER_RESPONSE_to_FIELDWORK
          - state_machines.AuditCase.PRELIM_FINDINGS_to_CLOSED
          - state_machines.AuditCase.NONE_to_ISSUED
          - state_machines.AuditCase.ISSUED_to_FINAL
          - entities.AuditCase.fields.response_rounds
          - validations[priority=81]
          - errors[ERR_ASSESSMENT_PENDING_DISPOSITION]
          - calculations.assessment_amounts
        distinguishing_aspect: |
          Entity is AuditCase and the non-linearity is two independent dimensions on one row plus a
          bounded cycle: case_status walks OPEN -> FIELDWORK -> PRELIM_FINDINGS -> TAXPAYER_RESPONSE ->
          FIELDWORK (response_rounds 0 -> 1) while assessment_status moves NONE -> ISSUED -> FINAL, and
          the single coupling point rejects the close with ERR_ASSESSMENT_PENDING_DISPOSITION while the
          assessment is still ISSUED.
        test_recipe:
          setup:
            - "One ACTIVE, fully bonded DISTRIBUTOR subject."
            - "Logical clock at 2026-11-19T23:59:59Z, exactly 60 days after the 2026-09-20T23:59:59Z due instant of period 2026-08."
            - "One AuditCase opened by AuditManager aud-01 over 2026-08..2026-08 with selection_method ROADSIDE_REFERRAL (case_status OPEN, assessment_status NONE, response_rounds 0)."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Ridgeway Fuel Distribution Inc", fein: "41-1000002", license_type: "DISTRIBUTOR", mailing_state: "MN", gross_net_election: "NET" }
              as: LicensingOfficer
              captures: { dist_id: $.data.id, dist_v0: $.data.version }
            - call: "POST /mft/licensees/${dist_id}/bonds"
              payload: { amount_cents: 1500000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${dist_v0}" }
              as: LicensingOfficer
            - call: "POST /mft/licensees/${dist_id}/activate"
              payload: {}
              as: LicensingOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-19T23:59:59Z" }
              as: AuditManager
              as_user_id: "aud-01"
            - call: "POST /mft/audit-cases"
              payload: { subject_licensee_id: "${dist_id}", selection_method: "ROADSIDE_REFERRAL", period_start_month: "2026-08", period_end_month: "2026-08" }
              as: AuditManager
              as_user_id: "aud-01"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /mft/audit-cases/${case_id}/advance"
              payload: { to_status: "FIELDWORK" }
              as: AuditManager
              as_user_id: "aud-01"
            - call: "POST /mft/audit-cases/${case_id}/advance"
              payload: { to_status: "PRELIM_FINDINGS" }
              as: AuditManager
              as_user_id: "aud-01"
            - call: "POST /mft/audit-cases/${case_id}/advance"
              payload: { to_status: "TAXPAYER_RESPONSE" }
              as: AuditManager
              as_user_id: "aud-01"
            - call: "POST /mft/audit-cases/${case_id}/advance"
              payload: { to_status: "FIELDWORK" }
              as: AuditManager
              as_user_id: "aud-01"
            - call: "POST /mft/audit-cases/${case_id}/advance"
              payload: { to_status: "PRELIM_FINDINGS" }
              as: AuditManager
              as_user_id: "aud-01"
            - call: "POST /mft/audit-cases/${case_id}/assessments"
              payload: { additional_tax_cents: 250000, evasion_indicator: false }
              as: TaxSupervisor
              as_user_id: "sup-01"
            - call: "POST /mft/audit-cases/${case_id}/advance"
              payload: { to_status: "CLOSED" }
              as: AuditManager
              as_user_id: "aud-01"
            - call: "POST /mft/audit-cases/${case_id}/finalize"
              payload: {}
              as: TaxSupervisor
              as_user_id: "sup-01"
            - call: "POST /mft/audit-cases/${case_id}/advance"
              payload: { to_status: "CLOSED" }
              as: AuditManager
              as_user_id: "aud-01"
          assert:
            - "after the fourth advance: AuditCase.${case_id}.case_status == FIELDWORK and response_rounds == 1, while assessment_status is still NONE (the dimensions moved independently)"
            - "AuditCase.${case_id}.assessment_penalty_cents == 25000 (10% negligence on 250000)"
            - "AuditCase.${case_id}.assessment_interest_cents == 3750 (250000 * 0.00025 * 60 days)"
            - "AuditCase.${case_id}.assessed_total_cents == 278750 and assessed_by_user_id == sup-01"
            - "the first CLOSED advance returns 409 with error_id == ERR_ASSESSMENT_PENDING_DISPOSITION and case_status stays PRELIM_FINDINGS"
            - "after finalize: AuditCase.${case_id}.assessment_status == FINAL with no new LedgerEntry appended"
            - "the second CLOSED advance returns 200: AuditCase.${case_id}.case_status == CLOSED and assessment_status == FINAL"
            - "Licensee.${dist_id}.open_audit_count == 0 and balance_cents == 278750"
            - "GET /mft/licensees/${dist_id}/ledger-entries returns exactly one row of entry_type ASSESSMENT with amount_cents 278750"

  - rule_id: transitive_cascade
    instances:
      - name: second_dyed_positive_cascades_penalty_to_suspension_to_bond_to_refund_hold
        grounds:
          - state_machines.RoadsideInspection.RECORDED_to_PENALTY_ASSESSED
          - state_machines.Licensee.ACTIVE_to_SUSPENDED
          - state_machines.RefundClaim.SUBMITTED_to_HELD
          - calculations.dyed_fuel_penalty
          - calculations.licensee_bond_requirement
          - entities.Licensee.fields.dyed_violation_count
          - entities.RefundClaim.fields.hold_reason
        distinguishing_aspect: |
          Depth-4 chain triggered by POST /mft/roadside-inspections: hop 1 assesses a 300000-cent
          repeat-offence penalty and pushes dyed_violation_count to 2, hop 1 CAUSES hop 2 (the licensee
          flips ACTIVE -> SUSPENDED), hop 2 CAUSES hop 3 (required_bond_cents doubles to 3000000 and
          bond_deficiency_cents becomes 1400000), and hop 3 CAUSES hop 4 (the pending refund claim moves
          to HELD with hold_reason BOND_DEFICIENCY) - each hop is impossible without its predecessor.
        test_recipe:
          setup:
            - "One ACTIVE SUPPLIER counterparty; one DISTRIBUTOR with a 1600000 bond, activated."
            - "Clock at 2026-09-05T00:00:00Z; the distributor's 2026-08 return is FILED with SCH_2 GASOLINE 17482.52 gallons (tax_due_cents exactly 500000) and SCH_1 UNDYED_DIESEL 2000.00 gallons, so required_bond_cents is 1500000 and deficiency 0."
            - "One SUBMITTED OFF_ROAD refund claim for 2026-08 of 1000.00 gallons (refund_amount_cents 30900)."
            - "One earlier POSITIVE roadside inspection dated 2026-09-02 with 150.00 gallons in tank: penalty 150000, dyed_violation_count 1, licensee still ACTIVE."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Northline Fuel Supply LLC", fein: "41-1000001", license_type: "SUPPLIER", mailing_state: "MN", gross_net_election: "NET" }
