scenario: 'Precision Agriculture Data Platform, Machine Connectivity & Dealer Activation (John Deere): machine telematics
  connectivity with modem provisioning, subscription activation and data plan management, field boundary, prescription and
  as-applied data flowing between office software and machine displays, grower data ownership and sharing permissions with
  agronomists, cooperatives and equipment dealers, dealer role in activation, remote diagnostics and software update delivery
  with customer consent, automated guidance and section control licensing with feature unlocks purchased per machine, machine
  data used for warranty, uptime prediction and parts recommendation, third-party software integration through published interfaces
  with certification, right-to-repair pressure affecting diagnostic tool availability

  '
domain_name: precision-ag-connectivity
api_prefix: /agdata
complexity_profile:
  primary_archetype: access_control_matrix
  secondary_archetype: workflow_orchestration
  complexity_layers:
  - optimistic_concurrency
  - cascading_side_effects
  - dual_variant_calculation
  - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
  - one_to_many
  - self_referential
  - cross_aggregate
  role_model: delegated_authority
  consistency_model: immediate
entities:
- name: Organization
  parent: null
  common_fields: true
  fields:
  - name: name
    type: string
    source: input
    description: Grower organization display name
  - name: region_code
    type: string
    source: input
    description: Home jurisdiction code, e.g. US-IA
  - name: right_to_repair_enabled
    type: boolean
    source: input
    default: false
    description: Whether the org's jurisdiction forces open diagnostic access for independent technicians
  - name: independent_session_max_minutes
    type: integer
    source: input
    default: 60
    description: Documentation cap recorded for independent-technician sessions in this org
  - name: status
    type: enum
    source: system
    default: ACTIVE
    constraints: 'enum: ACTIVE | SUSPENDED'
    description: Organization lifecycle; SUSPENDED cascades to plans, grants, sessions and in-flight deliveries
- name: Dealer
  parent: null
  common_fields: true
  fields:
  - name: dealer_code
    type: string
    source: input
    constraints: unique across all dealers
    description: Dealer code
  - name: name
    type: string
    source: input
    description: Dealership name
  - name: region_code
    type: string
    source: input
    description: Dealer home jurisdiction code
  - name: service_tier
    type: enum
    source: input
    constraints: 'enum: STANDARD | PREMIUM'
    description: Dealer service tier; drives the warranty labor cap
  - name: status
    type: enum
    source: system
    default: ACTIVE
    constraints: 'enum: ACTIVE | SUSPENDED'
    description: SUSPENDED dealers cannot activate machines, open sessions, or create claims
  - name: warranty_reserve_cents
    type: integer
    source: system
    default: 0
    description: Sum of claim_amount_cents over this dealer's claims in SUBMITTED or APPROVED
  - name: warranty_paid_cents
    type: integer
    source: system
    default: 0
    description: Sum of payout_cents over this dealer's SETTLED claims
- name: Machine
  parent: null
  common_fields: true
  fields:
  - name: organization_id
    type: string
    source: input
    description: FK -> Organization.id; owning grower organization
  - name: serial_number
    type: string
    source: input
    constraints: unique across all machines
    description: Factory serial number
  - name: model_code
    type: string
    source: input
    description: Machine model code; software packages target exactly one model_code
  - name: selling_dealer_id
    type: string
    source: input
    description: FK -> Dealer.id; dealer of record
  - name: manufacture_date
    type: string
    source: input
    description: ISO date (YYYY-MM-DD); drives warranty age bracket in whole months, floored
  - name: modem_imei
    type: string
    source: input
    constraints: unique across all machines
    description: Telematics modem IMEI
  - name: modem_status
    type: enum
    source: system
    default: UNPROVISIONED
    constraints: 'enum: UNPROVISIONED | PROVISIONING | PROVISION_FAILED | PROVISIONED'
    description: Modem provisioning dimension, parallel to lifecycle_status
  - name: provisioning_attempts
    type: integer
    source: system
    default: 0
    description: Number of provisioning begins; begin is rejected at PROVISIONING_MAX_ATTEMPTS
  - name: modem_firmware_version
    type: string
    source: system
    default: null
    description: Firmware version last reported installed by a verified UpdateDelivery
  - name: lifecycle_status
    type: enum
    source: system
    default: REGISTERED
    constraints: 'enum: REGISTERED | ACTIVATED | IN_SERVICE'
    description: Lifecycle dimension; REGISTERED -> ACTIVATED via dealer activation, ACTIVATED -> IN_SERVICE on first accepted
      telemetry batch
  - name: connectivity_posture
    type: enum
    source: computed
    constraints: 'enum: OFFLINE | NO_PLAN | PLAN_SUSPENDED | THROTTLED | EXHAUSTED | CONNECTED'
    description: Derived gate posture recomputed and stored on every modem/plan/usage mutation; precedence OFFLINE < NO_PLAN
      < PLAN_SUSPENDED < EXHAUSTED < THROTTLED < CONNECTED as listed in calculations.machine_connectivity_posture
  - name: active_license_count
    type: integer
    source: computed
    default: 0
    description: Count of this machine's FeatureLicenses in PURCHASED, ACTIVATED or SUSPENDED
  - name: activating_dealer_id
    type: string
    source: system
    default: null
    description: FK -> Dealer.id; dealer that performed activation (null until ACTIVATED)
  - name: activated_at
    type: datetime
    source: system
    default: null
    description: Timestamp of dealer activation
- name: DataPlan
  parent: null
  common_fields: true
  fields:
  - name: organization_id
    type: string
    source: input
    description: FK -> Organization.id; billing organization (must equal the machine's organization_id)
  - name: machine_id
    type: string
    source: input
    description: FK -> Machine.id; covered machine; at most one plan per machine in PENDING, ACTIVE or SUSPENDED
  - name: tier
    type: enum
    source: input
    constraints: 'enum: BASIC | STANDARD | UNLIMITED'
    description: Data plan tier; drives monthly_price_cents and monthly cap
  - name: proration_method
    type: enum
    source: input
    constraints: 'enum: CALENDAR_DAY | THIRTY_DAY'
    description: Proration variant for mid-cycle tier changes; immutable after creation
  - name: status
    type: enum
    source: system
    default: PENDING
    constraints: 'enum: PENDING | ACTIVE | SUSPENDED'
    description: Plan lifecycle; no terminal state
  - name: monthly_price_cents
    type: integer
    source: system
    description: Price for the current tier from TIER_PRICE_CENTS
  - name: used_mb
    type: number
    source: system
    default: 0
    description: Accumulated payload_mb of accepted telemetry batches in the current cycle
  - name: usage_posture
    type: enum
    source: computed
    default: NORMAL
    constraints: 'enum: NORMAL | THROTTLED | EXHAUSTED'
    description: Usage dimension derived from used_mb against the tier cap; recomputed on ingest, change-tier and cycle rollover
  - name: cycle_anchor_day
    type: integer
    source: system
    default: null
    description: Day-of-month of activation; anchors each billing cycle
  - name: cycle_start_date
    type: string
    source: system
    default: null
    description: ISO date when the current cycle began
  - name: last_proration_charge_cents
    type: integer
    source: system
    default: null
    description: Signed prorated charge of the most recent change-tier (negative = credit)
- name: FieldBoundary
  parent: null
  common_fields: true
  fields:
  - name: organization_id
    type: string
    source: input
    description: FK -> Organization.id; owning organization
  - name: name
    type: string
    source: input
    description: Field name
  - name: season_year
    type: integer
    source: input
    description: Crop season year
  - name: area_hectares
    type: number
    source: input
    description: Field area in hectares (2 decimal places)
  - name: status
    type: enum
    source: system
    default: DRAFT
    constraints: 'enum: DRAFT | ACTIVE | ARCHIVED'
    description: Only ACTIVE fields accept new prescriptions; ARCHIVED blocks new prescriptions
- name: Prescription
  parent: null
  common_fields: true
  fields:
  - name: organization_id
    type: string
    source: input
    description: FK -> Organization.id; must equal the field's organization_id
  - name: field_boundary_id
    type: string
    source: input
    description: FK -> FieldBoundary.id; target field (must be ACTIVE)
  - name: machine_id
    type: string
    source: input
    description: FK -> Machine.id; target machine display (must belong to organization_id)
  - name: crop_type
    type: enum
    source: input
    constraints: 'enum: CORN | SOY | WHEAT | COTTON'
    description: Crop type
  - name: zones
    type: array
    source: input
    constraints: non-empty array of { zone_id, rate_l_per_ha, area_ha }; rate and area > 0 with at most 2 decimals
    description: Variable-rate zones; len(zones) > 1 requires an ACTIVATED SECTION_CONTROL license on the machine at send
      time
  - name: valid_from
    type: datetime
    source: input
    description: Validity window start (inclusive)
  - name: valid_until
    type: datetime
    source: input
    description: Validity window end (inclusive); send requires now <= valid_until
  - name: status
    type: enum
    source: system
    default: DRAFT
    constraints: 'enum: DRAFT | APPROVED | SENT | ACKNOWLEDGED | SUPERSEDED'
    description: Prescription lifecycle with a DRAFT<->APPROVED revision loop
  - name: revision
    type: integer
    source: system
    default: 1
    description: Incremented each time APPROVED -> DRAFT via revise
  - name: total_product_liters
    type: number
    source: computed
    default: null
    description: Sum of per-zone quantities, each zone rounded to 2 decimals HALF_UP before summing (calculations.prescription_product_totals)
  - name: weighted_avg_rate_l_per_ha
    type: number
    source: computed
    default: null
    description: total_product_liters / sum(zone area), 3 decimals HALF_UP
  - name: superseded_by_id
    type: string
    source: system
    default: null
    description: FK -> Prescription.id; set when another prescription of the same field is sent while this one is SENT
  - name: applied_total_liters
    type: number
    source: system
    default: null
    description: As-applied total reported by the machine on report-as-applied
  - name: applied_coverage_ha
    type: number
    source: system
    default: null
    description: As-applied coverage reported by the machine
  - name: applied_at
    type: datetime
    source: system
    default: null
    description: Timestamp of the as-applied report
- name: DataShareGrant
  parent: null
  common_fields: true
  fields:
  - name: organization_id
    type: string
    source: input
    description: FK -> Organization.id; granting organization (grower is the data owner)
  - name: grantee_type
    type: enum
    source: input
    constraints: 'enum: AGRONOMIST | COOPERATIVE | DEALER | THIRD_PARTY_APP'
    description: Grantee kind; maps to roles AGRONOMIST->Agronomist, COOPERATIVE->CoopAnalyst, DEALER->DealerTechnician, THIRD_PARTY_APP->PartnerApp
  - name: grantee_ref_id
    type: string
    source: input
    description: Opaque grantee identifier; must equal the caller's X-User-ID when the mapped role exercises the grant
  - name: scopes
    type: array
    source: input
    constraints: non-empty subset of { TELEMATICS, AGRONOMIC, DIAGNOSTICS }
    description: Granted data scopes
  - name: valid_from
    type: datetime
    source: input
    description: Grant validity start (inclusive, closed interval)
  - name: valid_until
    type: datetime
    source: input
    description: Grant validity end (inclusive, closed interval)
  - name: status
    type: enum
    source: system
    default: ACTIVE
    constraints: 'enum: ACTIVE | SUSPENDED | REVOKED | EXPIRED'
    description: ACTIVE<->SUSPENDED by the grower; REVOKED terminal; EXPIRED by the logical clock when now >= valid_until
- name: ConsentTicket
  parent: null
  common_fields: true
  fields:
  - name: organization_id
    type: string
    source: input
    description: FK -> Organization.id; organization asked for consent
  - name: machine_id
    type: string
    source: input
    description: FK -> Machine.id; machine the consent covers
  - name: ticket_type
    type: enum
    source: input
    constraints: 'enum: REMOTE_DIAGNOSTIC | SOFTWARE_UPDATE'
    description: What the consent authorizes
  - name: requester_ref_id
    type: string
    source: input
    description: 'Who asked: a Dealer.id, an IndependentTechnician X-User-ID, or the literal ''platform'' for update deliveries'
  - name: status
    type: enum
    source: system
    default: REQUESTED
    constraints: 'enum: REQUESTED | GRANTED | DENIED | CONSUMED | EXPIRED | REVOKED'
    description: Consent lifecycle; CONSUMED exactly once per bound session or delivery
  - name: expires_at
    type: datetime
    source: system
    description: created_at + CONSENT_TTL_HOURS hours; clock-set flips REQUESTED/GRANTED tickets with now >= expires_at to
      EXPIRED
  - name: granted_at
    type: datetime
    source: system
    default: null
    description: When the grower granted
  - name: bound_session_id
    type: string
    source: system
    default: null
    description: Diagnostic session that consumed this ticket (query sessions via GET /diagnostic-sessions?consent_ticket_id=)
  - name: bound_delivery_id
    type: string
    source: system
    default: null
    description: Update delivery this ticket was minted for (query deliveries via GET /update-deliveries?consent_ticket_id=)
- name: DiagnosticSession
  parent: null
  common_fields: true
  fields:
  - name: machine_id
    type: string
    source: input
    description: FK -> Machine.id; diagnosed machine; at most one OPEN session per machine
  - name: organization_id
    type: string
    source: system
    description: FK -> Organization.id; copied from the machine at creation
  - name: dealer_id
    type: string
    source: system
    default: null
    description: FK -> Dealer.id; set when opened by a DealerTechnician, null for independent technicians
  - name: consent_ticket_id
    type: string
    source: input
    description: FK -> ConsentTicket.id; GRANTED REMOTE_DIAGNOSTIC ticket for this machine, consumed on open
  - name: technician_kind
    type: enum
    source: system
    constraints: 'enum: DEALER | INDEPENDENT'
    description: Derived from caller role at creation
  - name: diagnostic_detail_level
    type: enum
    source: computed
    constraints: 'enum: EXTENDED | BASIC'
    description: EXTENDED for dealer sessions; BASIC for independent technicians (right-to-repair tiering)
  - name: status
    type: enum
    source: system
    default: OPEN
    constraints: 'enum: OPEN | CLOSED'
    description: Session lifecycle
  - name: opened_at
    type: datetime
    source: system
    description: When the session opened
  - name: closed_at
    type: datetime
    source: system
    default: null
    description: When the session closed
  - name: closed_reason
    type: enum
    source: system
    default: null
    constraints: 'enum: COMPLETED | ACCESS_WITHDRAWN'
    description: COMPLETED on explicit close; ACCESS_WITHDRAWN when an organization suspension cascade closes it
  - name: fault_found
    type: boolean
    source: input
    default: null
    description: Reported on close
- name: SoftwarePackage
  parent: null
  common_fields: true
  fields:
  - name: package_code
    type: string
    source: input
    constraints: unique across all packages
    description: Package identifier
  - name: target_model_code
    type: string
    source: input
    description: Only machines with this model_code may receive the package
  - name: firmware_version
    type: string
    source: input
    description: Version string stamped onto the machine's modem on install
  - name: size_mb
    type: integer
    source: input
    description: Package size
  - name: mandatory
    type: boolean
    source: input
    description: Mandatory packages may download while the machine is THROTTLED; optional ones require CONNECTED
  - name: status
    type: enum
    source: system
    default: DRAFT
    constraints: 'enum: DRAFT | PUBLISHED | WITHDRAWN'
    description: Only PUBLISHED packages accept deliveries; withdrawal cancels pending deliveries and revokes their consent
      tickets
- name: UpdateDelivery
  parent: null
  common_fields: true
  fields:
  - name: machine_id
    type: string
    source: input
    description: FK -> Machine.id; target machine (must be ACTIVATED or IN_SERVICE)
  - name: package_id
    type: string
    source: input
    description: FK -> SoftwarePackage.id; must be PUBLISHED and model-compatible
  - name: consent_ticket_id
    type: string
    source: system
    description: FK -> ConsentTicket.id; SOFTWARE_UPDATE ticket minted at creation (requester_ref_id 'platform')
  - name: status
    type: enum
    source: system
    default: AWAITING_CONSENT
    constraints: 'enum: AWAITING_CONSENT | CONSENT_GRANTED | DOWNLOADING | INSTALLED | FAILED | DECLINED | CANCELLED'
    description: Delivery lifecycle with a FAILED -> DOWNLOADING consent-preserving retry loop
  - name: download_attempts
    type: integer
    source: system
    default: 0
    description: Incremented on every start-download
  - name: failure_reason
    type: string
    source: system
    default: null
    description: Free-text from report-failed, or CONNECTIVITY_LOST when a plan/org suspension cascade fails the download
  - name: installed_at
    type: datetime
    source: system
    default: null
    description: When install was reported
- name: FeatureLicense
  parent: null
  common_fields: true
  fields:
  - name: machine_id
    type: string
    source: input
    description: FK -> Machine.id; licenses are purchased per machine
  - name: feature_code
    type: enum
    source: input
    constraints: 'enum: AUTO_GUIDANCE | SECTION_CONTROL | VARIABLE_RATE_SPREAD | TELEMATICS_PREMIUM'
    description: Feature unlocked; at most one non-REVOKED license per (machine_id, feature_code)
  - name: license_type
    type: enum
    source: input
    constraints: 'enum: PERPETUAL | TERM'
    description: PERPETUAL never expires; TERM expires term_months after activation
  - name: term_months
    type: integer
    source: input
    default: null
    description: Required when license_type == TERM; ignored for PERPETUAL
  - name: fee_cents
    type: integer
    source: computed
    description: Bundle-discounted fee per calculations.license_bundle_fee
  - name: status
    type: enum
    source: system
    default: PURCHASED
    constraints: 'enum: PURCHASED | ACTIVATED | SUSPENDED | REVOKED | EXPIRED'
    description: License lifecycle; EXPIRED via clock for TERM licenses past expires_at
  - name: activated_at
    type: datetime
    source: system
    default: null
    description: First activation timestamp
  - name: expires_at
    type: datetime
    source: system
    default: null
    description: 'TERM licenses: activated_at + term_months'
- name: WarrantyClaim
  parent: null
  common_fields: true
  fields:
  - name: machine_id
    type: string
    source: input
    description: FK -> Machine.id; claimed machine (must be IN_SERVICE)
  - name: organization_id
    type: string
    source: system
    description: FK -> Organization.id; copied from the machine at creation
  - name: dealer_id
    type: string
    source: system
    description: FK -> Dealer.id; creating DealerTechnician's dealer
  - name: claim_amount_cents
    type: integer
    source: input
    constraints: '> 0'
    description: Total claimed amount; reserved on the dealer at submit
  - name: parts_amount_cents
    type: integer
    source: input
    constraints: '>= 0 and <= claim_amount_cents'
    description: Parts portion of the claim
  - name: description
    type: string
    source: input
    description: Failure description
  - name: status
    type: enum
    source: system
    default: DRAFT
    constraints: 'enum: DRAFT | SUBMITTED | APPROVED | DENIED | SETTLED'
    description: Claim lifecycle
  - name: coverage_pct_applied
    type: number
    source: system
    default: null
    description: Age-bracket coverage fraction used at decide time
  - name: payout_cents
    type: integer
    source: computed
    default: null
    description: Approved payout per calculations.warranty_payout_allocation; null until APPROVED
  - name: decided_at
    type: datetime
    source: system
    default: null
    description: Decision timestamp
  - name: settled_at
    type: datetime
    source: system
    default: null
    description: Settlement timestamp
- name: IntegrationPartner
  parent: null
  common_fields: true
  fields:
  - name: name
    type: string
    source: input
    description: Third-party software vendor name
  - name: api_quota_calls_per_day
    type: integer
    source: input
    constraints: '> 0'
    description: Certified API quota per UTC day for data-pull
  - name: status
    type: enum
    source: system
    default: REGISTERED
    constraints: 'enum: REGISTERED | CERTIFICATION_REVIEW | CERTIFIED | EXPIRED'
    description: Certification lifecycle with fail-back and expiry-recertification cycles
  - name: certification_expires_on
    type: string
    source: system
    default: null
    description: ISO date = certification date + CERT_VALIDITY_DAYS; clock-set flips CERTIFIED -> EXPIRED when now's date
      >= this date
  - name: calls_today
    type: integer
    source: system
    default: 0
    description: data-pull calls counted against the quota for calls_window_date
  - name: calls_window_date
    type: string
    source: system
    default: null
    description: UTC date the calls_today counter belongs to; clock-set resets the counter when the date changes
state_machines:
- entity: Organization
  initial_state: ACTIVE
  terminal_states: []
  transitions:
  - from: ACTIVE
    to: SUSPENDED
    trigger: POST /agdata/organizations/{id}/suspend
    actor: PlatformAdmin
    preconditions: []
    side_effects:
    - Every ACTIVE DataPlan with organization_id == this org transitions ACTIVE -> SUSPENDED (cascade link 1)
    - Each plan suspension recomputes Machine.connectivity_posture of its machine to PLAN_SUSPENDED (cascade link 2)
    - Each machine whose posture becomes PLAN_SUSPENDED forces every DOWNLOADING UpdateDelivery on it to FAILED with failure_reason
      CONNECTIVITY_LOST (cascade link 3)
    - Every ACTIVE DataShareGrant with organization_id == this org transitions ACTIVE -> SUSPENDED (fan-out)
    - Every OPEN DiagnosticSession on the org's machines transitions OPEN -> CLOSED with closed_reason ACCESS_WITHDRAWN (fan-out)
  - from: SUSPENDED
    to: ACTIVE
    trigger: POST /agdata/organizations/{id}/resume
    actor: PlatformAdmin
    preconditions: []
    side_effects:
    - 'No automatic revival: plans stay SUSPENDED, grants stay SUSPENDED, deliveries stay FAILED; each child must be resumed
      individually'
    - Increments Organization.version
- entity: Dealer
  initial_state: ACTIVE
  terminal_states: []
  transitions:
  - from: ACTIVE
    to: SUSPENDED
    trigger: POST /agdata/dealers/{id}/suspend
    actor: PlatformAdmin
    preconditions: []
    side_effects:
    - Existing OPEN sessions and SUBMITTED claims are unaffected; the suspension blocks NEW machine activations, session creation
      and claim creation by this dealer
- entity: Machine
  initial_state: REGISTERED
  terminal_states: []
  note: 'Two parallel state dimensions live on this entity: lifecycle_status (REGISTERED -> ACTIVATED -> IN_SERVICE) and modem_status
    (UNPROVISIONED -> PROVISIONING -> PROVISIONED | PROVISION_FAILED -> PROVISIONING retry). connectivity_posture is a stored
    derived gate recomputed on every modem/plan/usage mutation per calculations.machine_connectivity_posture.'
  transitions:
  - from: REGISTERED
    to: ACTIVATED
    trigger: POST /agdata/machines/{id}/activate
    actor: DealerTechnician
    preconditions:
    - Caller dealer (X-User-ID) is ACTIVE (ERR_DEALER_SUSPENDED)
    - Owning Organization is ACTIVE (ERR_ORG_SUSPENDED)
    - modem_status == PROVISIONED (ERR_MODEM_NOT_PROVISIONED)
    - A DataPlan for this machine exists with status == ACTIVE (ERR_PLAN_NOT_ACTIVE)
    side_effects:
    - activating_dealer_id = caller dealer id; activated_at = now
  - from: ACTIVATED
    to: IN_SERVICE
    trigger: system (automatic on the first accepted telemetry-ingest batch)
    actor: system
    preconditions:
    - The ingested batch is accepted (posture CONNECTED or THROTTLED)
    side_effects: []
  - from: UNPROVISIONED
    to: PROVISIONING
    trigger: POST /agdata/machines/{id}/provision-modem
    actor: DealerTechnician | PlatformAdmin
    note: modem_status dimension
    preconditions:
    - provisioning_attempts < PROVISIONING_MAX_ATTEMPTS (ERR_PROVISIONING_ATTEMPTS_EXHAUSTED)
    side_effects:
    - provisioning_attempts += 1
  - from: PROVISION_FAILED
    to: PROVISIONING
    trigger: POST /agdata/machines/{id}/provision-modem
    actor: DealerTechnician | PlatformAdmin
    note: modem_status dimension; the retry loop
    preconditions:
    - provisioning_attempts < PROVISIONING_MAX_ATTEMPTS (ERR_PROVISIONING_ATTEMPTS_EXHAUSTED)
    side_effects:
    - provisioning_attempts += 1
  - from: PROVISIONING
    to: PROVISIONED
    trigger: POST /agdata/machines/{id}/modem-provisioning-events with outcome PROVISION_SUCCEEDED
    actor: System
    note: modem_status dimension
    preconditions: []
    side_effects:
    - Recompute connectivity_posture (OFFLINE -> NO_PLAN if no ACTIVE plan exists, CONNECTED if an ACTIVE plan with NORMAL
      usage exists)
  - from: PROVISIONING
    to: PROVISION_FAILED
    trigger: POST /agdata/machines/{id}/modem-provisioning-events with outcome PROVISION_FAILED
    actor: System
    note: modem_status dimension
    preconditions: []
    side_effects: []
- entity: DataPlan
  initial_state: PENDING
  terminal_states: []
  note: 'Parallel dimensions: status (PENDING/ACTIVE/SUSPENDED) and usage_posture (NORMAL/THROTTLED/EXHAUSTED, derived from
    used_mb vs tier cap per calculations.data_usage_posture).'
  transitions:
  - from: PENDING
    to: ACTIVE
    trigger: POST /agdata/data-plans/{id}/activate
    actor: GrowerManager
    preconditions:
    - Owning Organization is ACTIVE (ERR_ORG_SUSPENDED)
    side_effects:
    - cycle_anchor_day = day-of-month of now; cycle_start_date = date of now
    - Recompute the machine's connectivity_posture
  - from: ACTIVE
    to: SUSPENDED
    trigger: POST /agdata/data-plans/{id}/suspend
    actor: GrowerManager | PlatformAdmin
    preconditions: []
    side_effects:
    - Recompute the machine's connectivity_posture to PLAN_SUSPENDED
    - Every DOWNLOADING UpdateDelivery on the machine transitions DOWNLOADING -> FAILED with failure_reason CONNECTIVITY_LOST
  - from: SUSPENDED
    to: ACTIVE
    trigger: POST /agdata/data-plans/{id}/resume
    actor: GrowerManager
    preconditions:
    - Owning Organization is ACTIVE (ERR_ORG_SUSPENDED)
    side_effects:
    - Recompute the machine's connectivity_posture
  - from: ACTIVE
    to: ACTIVE
    trigger: POST /agdata/data-plans/{id}/change-tier
    actor: GrowerManager
    note: 'Self-transition: tier and monthly_price_cents change, status stays ACTIVE'
    preconditions:
    - new_tier != tier (ERR_TIER_CHANGE_INVALID)
    - expected_plan_version == current version (ERR_STALE_PLAN_VERSION)
    side_effects:
    - tier = new_tier; monthly_price_cents = TIER_PRICE_CENTS[new_tier]
    - last_proration_charge_cents = calculations.plan_proration result
    - Recompute usage_posture against the new tier cap and the machine's connectivity_posture
    - Increments DataPlan.version
- entity: FieldBoundary
  initial_state: DRAFT
  terminal_states:
  - ARCHIVED
  transitions:
  - from: DRAFT
    to: ACTIVE
    trigger: POST /agdata/field-boundaries/{id}/activate
    actor: GrowerManager
    preconditions: []
    side_effects: []
  - from: ACTIVE
    to: ARCHIVED
    trigger: POST /agdata/field-boundaries/{id}/archive
    actor: GrowerManager
    preconditions:
    - No Prescription with field_boundary_id == this field in DRAFT, APPROVED or SENT (ERR_FIELD_HAS_OPEN_PRESCRIPTIONS)
    side_effects: []
- entity: Prescription
  initial_state: DRAFT
  terminal_states:
  - ACKNOWLEDGED
  - SUPERSEDED
  transitions:
  - from: DRAFT
    to: APPROVED
    trigger: POST /agdata/prescriptions/{id}/approve
    actor: GrowerManager
    preconditions: []
    side_effects: []
  - from: APPROVED
    to: DRAFT
    trigger: POST /agdata/prescriptions/{id}/revise
    actor: GrowerManager | Agronomist
    note: Revision loop
    preconditions: []
    side_effects:
    - revision += 1
  - from: APPROVED
    to: SENT
    trigger: POST /agdata/prescriptions/{id}/send-to-machine
    actor: GrowerManager | Agronomist
    preconditions:
    - Owning Organization is ACTIVE (ERR_ORG_SUSPENDED)
    - Machine.connectivity_posture == CONNECTED (ERR_MACHINE_POSTURE_BLOCKED)
    - now <= valid_until (ERR_PRESCRIPTION_EXPIRED)
    - 'If len(zones) > 1: the machine holds a FeatureLicense with feature_code == SECTION_CONTROL in ACTIVATED (ERR_FEATURE_NOT_LICENSED)'
    side_effects:
    - Every other Prescription of the same field_boundary_id currently SENT transitions SENT -> SUPERSEDED with superseded_by_id
      = this prescription (cascade)
  - from: SENT
    to: ACKNOWLEDGED
    trigger: POST /agdata/prescriptions/{id}/report-as-applied
    actor: System
    preconditions: []
    side_effects:
    - applied_total_liters, applied_coverage_ha, applied_at recorded (the as-applied data flowing back from the machine display)
- entity: DataShareGrant
  initial_state: ACTIVE
  terminal_states:
  - REVOKED
  - EXPIRED
  transitions:
  - from: ACTIVE
    to: SUSPENDED
    trigger: POST /agdata/data-share-grants/{id}/suspend
    actor: GrowerManager
    preconditions: []
    side_effects: []
  - from: SUSPENDED
    to: ACTIVE
    trigger: POST /agdata/data-share-grants/{id}/resume
    actor: GrowerManager
    preconditions:
    - now <= valid_until (ERR_INVALID_STATE_TRANSITION)
    side_effects: []
  - from: ACTIVE
    to: REVOKED
    trigger: POST /agdata/data-share-grants/{id}/revoke
    actor: GrowerManager
    preconditions: []
    side_effects: []
  - from: SUSPENDED
    to: REVOKED
    trigger: POST /agdata/data-share-grants/{id}/revoke
    actor: GrowerManager
    preconditions: []
    side_effects: []
  - from: ACTIVE
    to: EXPIRED
    trigger: system (POST /agdata/_clock/set_current_utc when now >= valid_until)
    actor: system
    preconditions: []
    side_effects: []
  - from: SUSPENDED
    to: EXPIRED
    trigger: system (POST /agdata/_clock/set_current_utc when now >= valid_until)
    actor: system
    preconditions: []
    side_effects: []
- entity: ConsentTicket
  initial_state: REQUESTED
  terminal_states:
  - DENIED
  - CONSUMED
  - EXPIRED
  - REVOKED
  transitions:
  - from: REQUESTED
    to: GRANTED
    trigger: POST /agdata/consent-tickets/{id}/grant
    actor: GrowerManager
    preconditions:
    - Owning Organization is ACTIVE (ERR_ORG_SUSPENDED)
    side_effects:
    - granted_at = now
    - The bound UpdateDelivery (bound_delivery_id), if still AWAITING_CONSENT, transitions AWAITING_CONSENT -> CONSENT_GRANTED
  - from: REQUESTED
    to: DENIED
    trigger: POST /agdata/consent-tickets/{id}/deny
    actor: GrowerManager
    preconditions: []
    side_effects:
    - The bound UpdateDelivery, if still AWAITING_CONSENT, transitions AWAITING_CONSENT -> DECLINED
  - from: GRANTED
    to: CONSUMED
    trigger: system (automatic when a DiagnosticSession opens with this ticket, or on the first start-download of the bound
      UpdateDelivery)
    actor: system
    preconditions: []
    side_effects:
    - bound_session_id set when consumed by a session
  - from: REQUESTED
    to: EXPIRED
    trigger: system (POST /agdata/_clock/set_current_utc when now >= expires_at)
    actor: system
    preconditions: []
    side_effects: []
  - from: GRANTED
    to: EXPIRED
    trigger: system (POST /agdata/_clock/set_current_utc when now >= expires_at)
    actor: system
    preconditions: []
    side_effects: []
  - from: REQUESTED
    to: REVOKED
    trigger: 'system (cascade: the bound UpdateDelivery is CANCELLED by a package withdrawal)'
    actor: system
    preconditions: []
    side_effects: []
  - from: GRANTED
    to: REVOKED
    trigger: 'system (cascade: the bound UpdateDelivery is CANCELLED by a package withdrawal)'
    actor: system
    preconditions: []
    side_effects: []
- entity: DiagnosticSession
  initial_state: OPEN
  terminal_states:
  - CLOSED
  transitions:
  - from: OPEN
    to: CLOSED
    trigger: POST /agdata/diagnostic-sessions/{id}/close
    actor: DealerTechnician | IndependentTechnician
    preconditions:
    - 'Caller is the opener: dealer sessions require X-User-ID == dealer_id; independent sessions require X-User-ID == the
      ticket''s requester_ref_id (ERR_DATA_ACCESS_DENIED)'
    side_effects:
    - closed_at = now; closed_reason = COMPLETED; fault_found recorded
  - from: OPEN
    to: CLOSED
    trigger: 'system (cascade: owning Organization suspended)'
    actor: system
    preconditions: []
    side_effects:
    - closed_at = now; closed_reason = ACCESS_WITHDRAWN
- entity: SoftwarePackage
  initial_state: DRAFT
  terminal_states:
  - WITHDRAWN
  transitions:
  - from: DRAFT
    to: PUBLISHED
    trigger: POST /agdata/software-packages/{id}/publish
    actor: PlatformAdmin
    preconditions: []
    side_effects: []
  - from: PUBLISHED
    to: WITHDRAWN
    trigger: POST /agdata/software-packages/{id}/withdraw
    actor: PlatformAdmin
    preconditions: []
    side_effects:
    - Every UpdateDelivery with package_id == this package in AWAITING_CONSENT or CONSENT_GRANTED transitions to CANCELLED
      (cascade link 1)
    - Each cancelled delivery's ConsentTicket in REQUESTED or GRANTED transitions to REVOKED (cascade link 2)
- entity: UpdateDelivery
  initial_state: AWAITING_CONSENT
  terminal_states:
  - INSTALLED
  - DECLINED
  - CANCELLED
  transitions:
  - from: AWAITING_CONSENT
    to: CONSENT_GRANTED
    trigger: system (side effect of POST /agdata/consent-tickets/{id}/grant on the bound ticket)
    actor: system
    preconditions: []
    side_effects: []
  - from: AWAITING_CONSENT
    to: DECLINED
    trigger: system (side effect of POST /agdata/consent-tickets/{id}/deny on the bound ticket)
    actor: system
    preconditions: []
    side_effects: []
  - from: CONSENT_GRANTED
    to: DOWNLOADING
    trigger: POST /agdata/update-deliveries/{id}/start-download
    actor: System
    preconditions:
    - Machine.connectivity_posture == CONNECTED, or (posture == THROTTLED and the package is mandatory) (ERR_MACHINE_POSTURE_BLOCKED)
    side_effects:
    - download_attempts += 1
    - Bound ConsentTicket transitions GRANTED -> CONSUMED (exactly once; retries do not re-consume)
  - from: FAILED
    to: DOWNLOADING
    trigger: POST /agdata/update-deliveries/{id}/start-download
    actor: System
    note: 'Consent-preserving retry loop: no new ticket is minted and the CONSUMED ticket is not touched'
    preconditions:
    - Machine.connectivity_posture == CONNECTED, or (posture == THROTTLED and the package is mandatory) (ERR_MACHINE_POSTURE_BLOCKED)
    side_effects:
    - download_attempts += 1
  - from: DOWNLOADING
    to: INSTALLED
    trigger: POST /agdata/update-deliveries/{id}/report-installed
    actor: System
    preconditions: []
    side_effects:
    - installed_at = now; Machine.modem_firmware_version = package firmware_version
  - from: DOWNLOADING
    to: FAILED
    trigger: POST /agdata/update-deliveries/{id}/report-failed
    actor: System
    preconditions: []
    side_effects:
    - failure_reason = payload failure_reason
  - from: DOWNLOADING
    to: FAILED
    trigger: 'system (cascade: the machine''s ACTIVE plan is suspended, or the owning Organization is suspended)'
    actor: system
    preconditions: []
    side_effects:
    - failure_reason = CONNECTIVITY_LOST
  - from: AWAITING_CONSENT
    to: CANCELLED
    trigger: 'system (cascade: package withdrawal)'
    actor: system
    preconditions: []
    side_effects:
    - Bound ConsentTicket in REQUESTED or GRANTED transitions to REVOKED
  - from: CONSENT_GRANTED
    to: CANCELLED
    trigger: 'system (cascade: package withdrawal)'
    actor: system
    preconditions: []
    side_effects:
    - Bound ConsentTicket in REQUESTED or GRANTED transitions to REVOKED
- entity: FeatureLicense
  initial_state: PURCHASED
