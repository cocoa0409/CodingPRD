  # ===========================================================================
  # RULE 9 — compensating_invariant over DIFFERENT conserved quantities
  #   9a: conserved quantity = SEATS (integer counters across the district
  #       pool, the buildings and the borrow ledger).
  #   9b: conserved quantity = CENTS (committed vs refunded charge), which is
  #       deliberately conserved only INSIDE the add/drop window.
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: seat_conservation_across_provision_and_release
        grounds:
          - calculations.seat_admission_capacity
          - calculations.building_seat_allocation
          - state_machines.AppAccount.RESERVED_or_ACTIVE_to_RELEASED
          - entities.BuildingAllocation.fields.consumed_seats
          - entities.BuildingAllocation.fields.borrowed_seats
          - entities.VendorApp.fields.unallocated_seats
          - entities.VendorApp.fields.consumed_seats
        distinguishing_aspect: "The conserved quantity is SEATS: the identity total_seats == unallocated_seats + sum(allocated_seats) + sum(borrowed_seats) and VendorApp.consumed_seats == sum(BuildingAllocation.consumed_seats) must hold after every single call, including the POOL_FALLBACK borrow that moves a seat out of the district pool and the releases that hand it back. After the full provision-then-release round trip every counter returns to its exact baseline with zero drift."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; two ACTIVE ELEMENTARY buildings, NE with three ENROLLED students and SM with two; Term Fall 2026 ACTIVE."
            - "An ACTIVE PER_STUDENT licence with total_seats 6, price_per_seat_cents 1000, allocation_policy FIXED_BUILDING_BLOCKS with block_seats 2 and overage_policy POOL_FALLBACK — so NE gets 2, SM gets 2 and unallocated_seats settles at 2, which is the borrowable district pool."
            - "Baseline before any provisioning: NE consumed 0 borrowed 0, SM consumed 0 borrowed 0, VendorApp consumed_seats 0, unallocated_seats 2, committed_charge_cents 0."
          setup_api_calls:
