  - section: cross_cutting_layers
    instances:
      - name: reprice_rejects_stale_pricebook_version
        claim_type: "optimistic_concurrency"
        grounds: ["concurrency_rules.[reprice-stale-pricebook-task-version]", "validations[priority=23]", "calculations.pricebook_revision_selection"]
        distinguishing_aspect: "The OCC claim on reprice: a first reprice advances the task revision's version, so a second reprice still carrying the version read before it is refused with 412 by two strictly sequential calls."
        test_recipe:
          setup:
            - "one branch, one HVAC technician, one PUBLISHED HVAC task revision 1 at 100000 cents on an appointment, plus a PUBLISHED revision 2 at 120000 cents"
          setup_api_calls:
            - call: "POST /api/branches"
