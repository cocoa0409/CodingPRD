        distinguishing_aspect: |
          Entity pair CreditMemo x FillCycle. The memo's own transition is gated on the
          identity and lifecycle position of the cycle being adjudicated: the cycle that
          MINTED the credit can never consume it, so the credit sits ISSUED until a
          different, later cycle of the same patient adjudicates. The dependency is on
          entity IDENTITY plus state, not on a workflow status like PENDING_AUTHORIZATION.
        test_recipe:
          setup:
