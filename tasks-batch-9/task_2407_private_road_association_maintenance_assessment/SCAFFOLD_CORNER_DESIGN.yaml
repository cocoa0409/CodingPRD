              as: RoadCommissioner
              as_user_id: "rc-1"
              captures: { seg_id: $.data.id }
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB153-P01", frontage_feet: 240, usage_class: "RESIDENTIAL_YEAR_ROUND", trips_per_day: 4, covenant_recorded: true }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { pa_id: $.data.id, pa_v: $.data.version }
            - call: "POST /members"
              payload: { parcel_id: "${pa_id}", owner_name: "A. Whitcomb", deed_book_page: "DB153-P01", deed_recorded_date: "2019-04-11" }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { ma_id: $.data.id }
            - call: "POST /members/${ma_id}/verify-deed"
              payload: { verified_deed_book_page: "DB153-P01" }
              as: AssociationSecretary
              as_user_id: "sec-1"
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB153-P02", frontage_feet: 100, usage_class: "RESIDENTIAL_YEAR_ROUND", trips_per_day: 2, covenant_recorded: true }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { pb_id: $.data.id }
            - call: "POST /members"
              payload: { parcel_id: "${pb_id}", owner_name: "B. Okafor", deed_book_page: "DB153-P02", deed_recorded_date: "2020-06-02" }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { mb_id: $.data.id }
            - call: "POST /members/${mb_id}/verify-deed"
              payload: { verified_deed_book_page: "DB153-P02" }
              as: AssociationSecretary
              as_user_id: "sec-1"
            - call: "POST /parcels/${pb_id}/subdivide"
              payload: { children: [ { deed_book_page: "DB153-P02A", frontage_feet: 60 }, { deed_book_page: "DB153-P02B", frontage_feet: 40 } ] }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { pb_v2: "$.data.parent_parcel.version" }
            - call: "POST /assessment-rolls"
              payload: { association_id: "${assoc_id}", fiscal_year: 2026, fy_start_date: "2026-01-01", fy_end_date: "2026-12-31", budget_requirement_cents: 4000000, method_variant: "FRONTAGE_WEIGHTED" }
