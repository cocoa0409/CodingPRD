      - name: corner_appeal_period_transition_applies_default_end_date
        claim_type: valid_transition
        grounds:
          - state_machines.MapPanel.PRELIMINARY_to_APPEAL_OPEN
          - endpoints.POST_/flood-zone/map-panels/{map_panel_id}/appeal-period
        distinguishing_aspect: "Opening the appeal period on a sequence-2 PRELIMINARY panel with no body moves it to APPEAL_OPEN and stamps appeal_period_end_date at clock + APPEAL_PERIOD_DAYS (90) = 2026-10-30."
        test_recipe:
          setup:
            - "community with panel seq 1 EFFECTIVE and a seq 2 successor created PRELIMINARY (revision_sequence >= 2 is the transition's precondition)"
          setup_api_calls:
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAnalyst
            - call: "POST /flood-zone/communities"
              payload: { community_id_code: "125129", name: "Coastal County FL", state_code: "FL" }
              as: ProviderAnalyst
              captures: { c_fl_id: $.data.id }
            - call: "POST /flood-zone/map-panels"
              payload: { community_id: "${c_fl_id}", map_panel_number: "12086C0312K", revision_sequence: 1, zone_code: "AE", base_flood_elevation_ft: 7.75, effective_date: "2020-06-05T00:00:00Z" }
              as: AgencyOfficer
              captures: { p1_id: $.data.id }
            - call: "POST /flood-zone/map-panels"
              payload: { community_id: "${c_fl_id}", map_panel_number: "12086C0312K", revision_sequence: 2, zone_code: "VE", base_flood_elevation_ft: 12.50, effective_date: "2027-04-28T00:00:00Z", supersedes_panel_id: "${p1_id}", study_case_number: "26-04-1234P" }
              as: AgencyOfficer
              captures: { p2_id: $.data.id, p2_initial_status: $.data.revision_status }
          trigger:
            - call: "POST /flood-zone/map-panels/${p2_id}/appeal-period"
              payload: {}
              as: AgencyOfficer
              captures: { p2_status: $.data.revision_status, p2_appeal_end: $.data.appeal_period_end_date }
          assert:
            - "before the trigger MapPanel.${p2_id}.revision_status == PRELIMINARY and .revision_round == 0 (sequence >= 2 panels are NOT created EFFECTIVE)"
            - "after the trigger MapPanel.${p2_id}.revision_status == APPEAL_OPEN and .appeal_period_end_date == 2026-10-30T00:00:00Z (2026-08-01 + 90 days)"
            - "MapPanel.${p2_id}.lfd_issued_at == null and .superseded_at == null"
            - "MapPanel.${p1_id}.revision_status == EFFECTIVE - opening an appeal period on the successor does not disturb the panel in force"
            - "an explicit appeal_period_end_date in the body overrides the default, so the field is a defaulted input rather than a pure computation"

