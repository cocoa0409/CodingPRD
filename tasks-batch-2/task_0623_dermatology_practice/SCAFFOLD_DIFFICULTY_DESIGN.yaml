              as: FrontDesk
              captures: { b1_id: $.data.id, room_v1: $.data.version }
          trigger:
            - call: "POST /procedure-bookings"
              payload: { room_id: "${room_id}", provider_id: "${prov_id}", encounter_id: "${enc_id}", procedure_kind: "EXCISION", start_at: "2026-01-14T11:00:00Z", end_at: "2026-01-14T11:45:00Z", expected_room_version: "${room_v1}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_ROOM_INTERVAL_CONFLICT"

      - name: provider_double_booked_closed_interval_touching
        grounds:
          - validations[priority=10.5]
          - entities.ProcedureBooking.fields.provider_id
          - entities.ProcedureBooking.fields.start_at
        distinguishing_aspect: |
          Provider resource (different resource entity from Room) with CLOSED,
