          issue is defined only from DRAFT, so the replay is refused with 409
          ERR_INVOICE_NOT_IN_EXPECTED_STATE - ISSUED is not terminal, so
          ERR_ALREADY_TERMINAL would be wrong - and the payment clock is not restarted:
          due_date stays 2026-12-31T00:00:00Z, exactly 30 days after the first issue.
        test_recipe:
          setup:
            - "a DRAFT invoice of 2,354,000 cents on a campaign funded with exactly that amount"
            - "the clock stands at 2026-12-01T00:00:00Z and the invoice has been issued once"
          setup_api_calls:
