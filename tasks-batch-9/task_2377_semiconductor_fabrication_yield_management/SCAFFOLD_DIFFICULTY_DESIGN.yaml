      - name: capacity_tier_boundary_at_exactly_seventy_percent_utilisation
        grounds:
          - calculations.wafer_start_capacity_commitment
          - state_machines.WaferStartPlan.DRAFT_to_COMMITTED
          - endpoints[POST /fab/wafer-start-plans/{id}/commit]
        distinguishing_aspect: |
          Metric: pre-surcharge utilisation against TIER_2_MIN (0.70), an inclusive lower bound on
          a ratio that must be rounded to 4 decimal places before comparison. Endpoint:
          POST /fab/wafer-start-plans/{id}/commit. Two plans over the same 7.0 h flow with 50
          planned starts differ only in capacity_budget_hours: 500.0 gives 350.00 / 500.0 =
          0.7000 exactly, landing in TIER_2 (12 percent, 42.00 h), while 501.0 gives 0.6986 and
          drops a whole tier to TIER_1 (5 percent, 17.50 h) — a 24.50 h swing from a 1.0 h
          change in the denominator.
        test_recipe:
          setup:
            - "FLOW-A RELEASED with seq 10 LITHO 2.0h, seq 20 ETCH 3.0h and seq 30 LITHO 2.0h, so total_standard_hours is 7.0."
            - "PLAN-A is DRAFT: 50 planned starts, capacity_budget_hours 500.0."
            - "PLAN-B is DRAFT: 50 planned starts, capacity_budget_hours 501.0, same flow and product family."
            - "No lots exist, so neither plan has released starts."
            - "The logical clock is untouched and reads 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /fab/recipes"
              payload: { recipe_code: "LITHO-100", tool_type: "LITHO", target_value: 50.00, qual_expiry_days: 100 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { r_litho: $.data.id }
            - call: "POST /fab/recipes"
              payload: { recipe_code: "ETCH-100", tool_type: "ETCH", target_value: 100.00, qual_expiry_days: 100 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { r_etch: $.data.id }
            - call: "POST /fab/process-flows"
              payload: { flow_code: "FLOW-A", product_family: "LOGIC_N5" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { flow_a: $.data.id }
            - call: "POST /fab/process-flows/${flow_a}/steps"
              payload: { recipe_id: "${r_litho}", step_seq: 10, step_name: "LITHO-1", standard_hours: 2.0, metrology_required: false }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { s10: $.data.id }
            - call: "POST /fab/process-flows/${flow_a}/steps"
              payload: { recipe_id: "${r_etch}", step_seq: 20, step_name: "ETCH-1", standard_hours: 3.0, metrology_required: false }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { s20: $.data.id }
            - call: "POST /fab/process-flows/${flow_a}/steps"
              payload: { recipe_id: "${r_litho}", step_seq: 30, step_name: "LITHO-2", standard_hours: 2.0, metrology_required: false }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { s30: $.data.id }
            - call: "POST /fab/process-flows/${flow_a}/release"
              payload: {}
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { flow_tsh: $.data.total_standard_hours }
            - call: "POST /fab/wafer-start-plans"
              payload: { flow_id: "${flow_a}", product_family: "LOGIC_N5", week_start_date: "2026-08-03T00:00:00Z", planned_wafer_starts: 50, capacity_budget_hours: 500.0, cycle_time_target_days: 30.0 }
              as: FabPlanner
              as_user_id: "u_fp_1"
              captures: { plan_a: $.data.id }
            - call: "POST /fab/wafer-start-plans"
              payload: { flow_id: "${flow_a}", product_family: "LOGIC_N5", week_start_date: "2026-08-10T00:00:00Z", planned_wafer_starts: 50, capacity_budget_hours: 501.0, cycle_time_target_days: 30.0 }
              as: FabPlanner
              as_user_id: "u_fp_1"
              captures: { plan_b: $.data.id }
          trigger:
            - call: "POST /fab/wafer-start-plans/${plan_a}/commit"
              payload: {}
              as: FabPlanner
              as_user_id: "u_fp_1"
              captures: { tier_a: $.data.commitment_tier, sur_a: $.data.surcharge_hours, com_a: $.data.committed_hours, st_a: $.data.status }
            - call: "POST /fab/wafer-start-plans/${plan_b}/commit"
              payload: {}
              as: FabPlanner
              as_user_id: "u_fp_1"
              captures: { tier_b: $.data.commitment_tier, sur_b: $.data.surcharge_hours, com_b: $.data.committed_hours, st_b: $.data.status }
          assert:
            - "${flow_tsh} == 7.0"
            - "${tier_a} == TIER_2"
            - "${sur_a} == 42.00"
            - "${com_a} == 392.00"
            - "${st_a} == COMMITTED"
            - "${tier_b} == TIER_1"
            - "${sur_b} == 17.50"
            - "${com_b} == 367.50"
            - "${st_b} == COMMITTED"
            - "${tier_a} != ${tier_b}"
            - "${sur_a} != ${sur_b}"

      - name: requal_threshold_boundary_at_exactly_seventy_risk_score
        grounds:
          - calculations.recipe_change_risk_score
          - entities.RecipeChangeRequest.fields.requires_full_requal
          - endpoints[POST /fab/recipes/{id}/change-requests]
        distinguishing_aspect: |
          Metric: risk_score against REQUAL_THRESHOLD (70.00), an inclusive lower bound reached
          only after the score is rounded to 2 decimal places. Endpoint:
          POST /fab/recipes/{id}/change-requests — a third distinct metric and endpoint. A
          CRITICAL change of 100.00 -> 104.00 scores exactly 70.00 and sets requires_full_requal
          true; 100.00 -> 103.99 scores 69.975, rounds to 69.98 and leaves it false. Implementations
          that compare before rounding, or use a strict `>`, get the first case wrong.
        test_recipe:
          setup:
            - "Recipe ETCH-100 exists with target_value 100.00, status QUALIFIED, revision 1."
            - "Recipe ETCH-200 exists with target_value 100.00, status QUALIFIED, revision 1."
            - "No process flow, plan or lot exists, so impact_lot_count is 0 for both notices and the score is purely class weight plus the continuous delta term."
            - "The logical clock is untouched and reads 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /fab/recipes"
              payload: { recipe_code: "ETCH-100", tool_type: "ETCH", target_value: 100.00, qual_expiry_days: 100 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { r1: $.data.id }
            - call: "POST /fab/recipes"
              payload: { recipe_code: "ETCH-200", tool_type: "ETCH", target_value: 100.00, qual_expiry_days: 100 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { r2: $.data.id }
          trigger:
            - call: "POST /fab/recipes/${r1}/change-requests"
              payload: { change_class: "CRITICAL", proposed_target: 104.00, justification: "Four percent etch depth increase" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { cr1: $.data.id, score1: $.data.risk_score, requal1: $.data.requires_full_requal, impact1: $.data.impact_lot_count }
            - call: "POST /fab/recipes/${r2}/change-requests"
              payload: { change_class: "CRITICAL", proposed_target: 103.99, justification: "Three-point-nine-nine percent etch depth increase" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { cr2: $.data.id, score2: $.data.risk_score, requal2: $.data.requires_full_requal, impact2: $.data.impact_lot_count }
          assert:
            - "${impact1} == 0"
            - "${impact2} == 0"
            - "${score1} == 70.00"
            - "${requal1} == true"
            - "${score2} == 69.98"
            - "${requal2} == false"
            - "${requal1} != ${requal2}"
            - "RecipeChangeRequest.${cr1}.status == SUBMITTED"
            - "RecipeChangeRequest.${cr2}.status == SUBMITTED"
            - "RecipeChangeRequest.${cr1}.revision_round == 0"

  # =====================================================================
  # R7 — cross_entity_state_dependency
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: track_in_blocked_while_the_steps_recipe_is_restricted
        grounds:
          - validations[priority=25]
          - state_machines.Recipe.QUALIFIED_to_RESTRICTED
          - state_machines.Recipe.RESTRICTED_to_QUALIFIED
          - calculations.recipe_change_risk_score
        distinguishing_aspect: |
          Entity pair StepRun x Recipe: whether a StepRun may be created depends on the status of
          a Recipe two hops away (ProcessStep.recipe_id), not on anything about the lot, the
          operator or the chamber. Approving a change notice flips ETCH/LITHO recipe LITHO-100 to
          RESTRICTED and the identical track-in call that would have succeeded now returns
          ERR_RECIPE_RESTRICTED; implementing the notice (risk 13.25, so no full requalification)
          returns the recipe to QUALIFIED and the very same call succeeds.
        test_recipe:
          setup:
            - "FLOW-A RELEASED while LITHO-100 was still QUALIFIED, with seq 10 LITHO 2.0h and seq 20 ETCH 3.0h."
            - "LITHO-1/CH_L1 QUALIFIED against LITHO-100 at 2026-08-01T00:00:00Z, available_capacity_hours 720.00; operator OP-001 certified and GOWNED."
            - "PLAN-A COMMITTED; LOT-001 (3 wafers, STANDARD) released at current_step_seq 0 with hold_state NONE."
            - "Change notice CR-1 (MINOR, 50.00 -> 50.50) authored by u_pe_1 scores 13.25 (10.00 class + 2.50 delta + 0.75 impact for the single affected lot), so requires_full_requal is false."
            - "CR-1 has been APPROVED by u_qm_1, which puts LITHO-100 into RESTRICTED."
            - "The logical clock is untouched and reads 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /fab/recipes"
              payload: { recipe_code: "LITHO-100", tool_type: "LITHO", target_value: 50.00, qual_expiry_days: 100 }
