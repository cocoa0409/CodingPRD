  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_purchase_version_blocks_a_second_cutting_test
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[cutting-test-stale-purchase]
          - endpoints[POST /meat-ops/cutting-tests]
          - errors[ERR_STALE_PARENT_VERSION]
        distinguishing_aspect: "Opening the first cutting test bumps PrimalPurchase.version to 2, so a second POST that replays the version 1 the client first observed is refused with ERR_STALE_PARENT_VERSION (412) and creates nothing; re-reading the purchase and sending version 2 succeeds and bumps the purchase to 3."
        test_recipe:
          setup:
            - "Department 'Meat 41' at default config; purchase P1 (gross 100.0 lb, shrink 1.5 lb) is RECEIVED at version 1."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { dept_id: $.data.id }
            - call: "POST /meat-ops/primal-purchases"
              payload: { department_id: "${dept_id}", primal_code: "BEEF_RIBEYE_LIP_ON", product_class: "WHOLE_MUSCLE", country_of_origin: "USA", vendor_name: "Prairie Packing", gross_weight_lb: 100.0, invoice_cost_cents: 84000, freight_cost_cents: 2500, vendor_allowance_cents: 500, receiving_shrink_lb: 1.5, received_at: "2026-08-05T06:00:00Z" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { p1_id: $.data.id, p1_v: $.data.version }
          trigger:
            - call: "POST /meat-ops/cutting-tests"
              payload: { primal_purchase_id: "${p1_id}", test_weight_lb: 98.5, expected_primal_purchase_version: "${p1_v}" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { t1_id: $.data.id, t1_status: $.data.status }
            - call: "POST /meat-ops/cutting-tests"
              payload: { primal_purchase_id: "${p1_id}", test_weight_lb: 98.5, expected_primal_purchase_version: "${p1_v}" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { err_stale: $.data.error_id }
            - call: "GET /meat-ops/primal-purchases/${p1_id}"
              payload: {}
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { p1_v2: $.data.version }
            - call: "POST /meat-ops/cutting-tests"
              payload: { primal_purchase_id: "${p1_id}", test_weight_lb: 98.5, expected_primal_purchase_version: "${p1_v2}" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { t2_id: $.data.id, t2_status: $.data.status }
            - call: "GET /meat-ops/primal-purchases/${p1_id}/cutting-tests"
              payload: { limit: 10, offset: 0 }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { tests_total: $.meta.total_count }
            - call: "GET /meat-ops/primal-purchases/${p1_id}"
              payload: {}
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { p1_v3: $.data.version, p1_status: $.data.status, p1_unalloc: $.data.unallocated_cost_cents }
          assert:
            - "${p1_v} == 1 at creation and ${t1_status} == DRAFT — the first test is accepted on the observed version"
            - "${err_stale} == ERR_STALE_PARENT_VERSION with HTTP 412 — the replayed version 1 is refused"
            - "${p1_v2} == 2 — exactly one bump from the accepted test, so the refused call had no side effect"
            - "${t2_status} == DRAFT and ${tests_total} == 2 — the refused attempt created nothing, the re-read attempt created the second test"
            - "${p1_v3} == 3, ${p1_status} == RECEIVED and ${p1_unalloc} == 86000 — the DRAFT sibling is not superseded and the ledger is still fully unallocated"

      - name: replayed_item_version_blocks_a_second_price_activation
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[price-activation-stale-item]
          - endpoints[POST /meat-ops/retail-items/{id}/price-activations]
          - errors[ERR_STALE_PARENT_VERSION]
          - state_machines.RetailItem.PRICED_to_PRICED
        distinguishing_aspect: "The re-activation path exists (PRICED -> PRICED catches active_price_per_lb_cents up to final_price_per_lb_cents), so the OCC field is the only guard: replaying the version observed before the first activation returns ERR_STALE_PARENT_VERSION (412) and leaves active_price_per_lb_cents at 1989, while the freshly read version is accepted."
        test_recipe:
          setup:
            - "Department 'Meat 41' at default config; clock at 2026-08-05T08:00:00Z."
            - "Purchase P1 (net 98.50 lb, landed total 86000) carries APPROVED CuttingTest T1 whose SALABLE_CUT line (62.0 lb @1450) points at RIB01; the GRIND_TRIM line is 18.5 lb @420 lean 78.0 and the FAT_BONE_LOSS line is 18.0 lb."
            - "RIB01 is PROPOSED at 2149 before activation."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { dept_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T08:00:00Z" }
