            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "${blk}", sample_date: "2026-07-20", generic_ecoli_mpn: 40 }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
            - call: "POST /berry-ops/crews"
              payload: { name: "CREW-V21", labor_program: "DOMESTIC", supervisor_user_id: "sup-1", planned_head_count: 1, contract_start_date: "2026-07-01", contract_end_date: "2026-09-30" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { crew: $.data.id }
            - call: "POST /berry-ops/harvest-windows"
              payload: { block_id: "${blk}", crew_id: "${crew}", start_at: "2026-08-03T06:00:00Z", end_at: "2026-08-03T14:00:00Z", forecast_brix: 8.5, planned_volume_lbs: 150.00, piece_rate_cents_per_clamshell: 45, clamshell_net_weight_lbs: 1.00 }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { win: $.data.id }
            - call: "POST /berry-ops/fruit-lots"
              payload: { harvest_window_id: "${win}", block_id: "${blk}", pick_date: "2026-08-03", variety: "STRAWBERRY", grade: "A", clamshell_count: 50, clamshell_net_weight_lbs: 1.00, pack_completed_at: "2026-08-03T12:00:00Z", field_pulp_temp_f: 62.0 }
              as: PackhouseOperator
              as_user_id: "pack-1"
              captures: { lot: $.data.id }
            - call: "POST /berry-ops/buyer-commitments"
              payload: { buyer_name: "Buyer V21", buyer_user_id: "buyer-8", variety: "STRAWBERRY", volume_commitment_lbs: 200.00, price_cents_per_lb: 400, shelf_life_guarantee_days: 5, window_start_date: "2026-08-01", window_end_date: "2026-08-10" }
              as: SalesManager
              as_user_id: "sales-1"
              captures: { com: $.data.id, cv: $.data.version }
          trigger:
            - call: "POST /berry-ops/lot-allocations"
              payload: { fruit_lot_id: "lot-does-not-exist", buyer_commitment_id: "${com}", allocated_lbs: 20.00, expected_buyer_commitment_version: "${cv}" }
              as: SalesManager
              as_user_id: "sales-1"
              captures: { err_a: $.data.error_id }
            - call: "POST /berry-ops/lot-allocations"
              payload: { fruit_lot_id: "${lot}", buyer_commitment_id: "com-does-not-exist", allocated_lbs: 20.00, expected_buyer_commitment_version: "${cv}" }
              as: SalesManager
              as_user_id: "sales-1"
              captures: { err_b: $.data.error_id }
            - call: "POST /berry-ops/lot-allocations"
              payload: { fruit_lot_id: "${lot}", buyer_commitment_id: "${com}", allocated_lbs: 20.00, expected_buyer_commitment_version: "${cv}" }
              as: SalesManager
              as_user_id: "sales-1"
              captures: { alloc: $.data.id }
          assert:
            - "the first trigger is HTTP 404 with ${err_a} == ERR_LOT_NOT_FOUND"
            - "the second trigger is HTTP 404 with ${err_b} == ERR_COMMITMENT_NOT_FOUND"
            - "the third trigger is HTTP 201 and LotAllocation.${alloc}.status == RESERVED and LotAllocation.${alloc}.allocated_lbs == 20.00"
            - "GET /berry-ops/lot-allocations with fruit_lot_id ${lot} returns total_count == 1 and the row id ${alloc}"
            - "GET /berry-ops/lot-allocations with buyer_commitment_id ${com} returns total_count == 1 and the row id ${alloc}"
            - "FruitLot.${lot}.allocated_lbs == 20.00 and FruitLot.${lot}.available_lbs == 30.00 and FruitLot.${lot}.disposition_status == RESERVED"
            - "BuyerCommitment.${com}.committed_lbs == 20.00 and BuyerCommitment.${com}.open_lbs == 180.00 and BuyerCommitment.${com}.version == 2"

