              payload: { expected_funding_cycle_version: "${cyc_v}" }
              as: AffiliateStaff
              captures: { run: $.data.id }
            - call: "POST /rebuild/selection-runs/${run}/apply"
              payload: {}
              as: AffiliateStaff
            - call: "GET /rebuild/projects"
              payload: { application_id: "${app}" }
              as: Any
              captures: { proj: "$.data[0].id", proj_v: "$.data[0].version" }
            - call: "GET /rebuild/scope-items"
              payload: { assessment_id: "${asm}" }
              as: Any
              captures: { si_keep: "$.data[0].id", si_drop: "$.data[1].id" }
            - call: "POST /rebuild/projects/${proj}/scope-amendments"
              payload: { expected_project_version: "${proj_v}", drop_item_ids: ["${si_drop}"] }
              as: AffiliateStaff
              captures: { ver_after: $.data.version }
          trigger:
            - call: "POST /rebuild/projects/${proj}/scope-amendments"
              payload: { expected_project_version: "${proj_v}", drop_item_ids: ["${si_keep}"] }
              as: AffiliateStaff
              captures: { err: $.data.error_id }
          assert:
            - "ver_after == ${proj_v} + 1 (the first amendment bumped the version)"
            - "err == ERR_STALE_VERSION and the HTTP status is 412"
            - "ScopeItem.${si_keep}.status == INCLUDED (the rejected second amendment changed nothing)"

      - name: pledged_commitment_withdrawal_leaves_pool_untouched
        claim_type: cascading_side_effects
        grounds:
          - state_machines.SponsorshipCommitment.PLEDGED_to_WITHDRAWN
          - calculations.funding_cycle_ledger
        distinguishing_aspect: "Withdrawing a merely-PLEDGED commitment is cascade-free by construction: pool/available figures are identical before and after, and no project is deferred — the contrast case for the RECEIVED/ALLOCATED cascade."
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Cycle budget 1000000; one selected project (envelope 115000, available 885000); one PLEDGED commitment of 500000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rebuild/funding-cycles"
              payload: { name: "FY27", fiscal_year: 2027, total_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { cyc: $.data.id }
            - call: "POST /rebuild/sponsors"
              payload: { name: "Maybe Corp", contact_email: "m@x.example" }
              as: PlatformAdmin
              captures: { sp: $.data.id }
            - call: "POST /rebuild/commitments"
              payload: { sponsor_id: "${sp}", funding_cycle_id: "${cyc}", amount_cents: 500000 }
              as: AffiliateStaff
              captures: { com: $.data.id }
            - call: "POST /rebuild/applications"
              payload: { funding_cycle_id: "${cyc}", homeowner_name: "Calm Site", date_of_birth: "1990-01-01", household_size: 1, household_income_cents: 1000000, is_veteran: false, has_disability: false, ownership_doc_provided: true, occupancy_doc_provided: true, address: "41 Calm St" }
              as: Anonymous
              captures: { app: $.data.id }
            - call: "PATCH /rebuild/applications/${app}"
              payload: { status: "UNDER_VERIFICATION" }
              as: AffiliateStaff
            - call: "PATCH /rebuild/applications/${app}"
              payload: { status: "VERIFIED" }
              as: AffiliateStaff
            - call: "POST /rebuild/assessments"
              payload: { application_id: "${app}", scheduled_on: "2026-09-02" }
              as: AffiliateStaff
              captures: { asm: $.data.id }
            - call: "POST /rebuild/assessments/${asm}/complete"
              payload: { safety_hazard_max_severity: 0, accessibility_needs_count: 0, scope_items: [{ category: "GENERAL", required_trade: "NONE", volunteer_performable: true, requires_permit: false, est_low_cents: 100000, est_high_cents: 100000, description: "paint" }] }
              as: Assessor
            - call: "PATCH /rebuild/assessments/${asm}"
              payload: { status: "SCOPED" }
              as: AffiliateStaff
            - call: "PATCH /rebuild/applications/${app}"
              payload: { status: "CANDIDATE" }
              as: AffiliateStaff
            - call: "PATCH /rebuild/funding-cycles/${cyc}"
              payload: { status: "SELECTION_OPEN" }
              as: PlatformAdmin
              captures: { cyc_v: $.data.version }
            - call: "POST /rebuild/funding-cycles/${cyc}/selection-runs"
              payload: { expected_funding_cycle_version: "${cyc_v}" }
              as: AffiliateStaff
              captures: { run: $.data.id }
            - call: "POST /rebuild/selection-runs/${run}/apply"
              payload: {}
              as: AffiliateStaff
            - call: "GET /rebuild/funding-cycles/${cyc}"
              payload: {}
              as: Any
              captures: { avail_pre: $.data.available_cents, pool_pre: $.data.pool_cents }
            - call: "GET /rebuild/projects"
              payload: { application_id: "${app}" }
              as: Any
              captures: { proj: "$.data[0].id" }
          trigger:
            - call: "PATCH /rebuild/commitments/${com}"
              payload: { status: "WITHDRAWN" }
              as: AffiliateStaff
            - call: "GET /rebuild/funding-cycles/${cyc}"
              payload: {}
              as: Any
              captures: { avail_post: $.data.available_cents, pool_post: $.data.pool_cents }
            - call: "GET /rebuild/projects/${proj}"
              payload: {}
              as: Any
              captures: { proj_status: $.data.status }
          assert:
            - "pool_pre == 1000000 and pool_post == 1000000 (PLEDGED funds never entered the pool)"
            - "avail_pre == 885000 and avail_post == 885000"
            - "proj_status is unchanged (no deferral cascade fires for a PLEDGED withdrawal)"

