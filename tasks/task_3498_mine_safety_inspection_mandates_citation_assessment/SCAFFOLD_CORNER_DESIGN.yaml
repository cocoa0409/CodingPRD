            - *mk_mine_ug
            - *mk_insp1
            - *mk_spot_feb10
            - *mk_review1
            - *mk_start1
            - *clk_feb10_0900
            - call: "POST /msha/citations"
              payload: { inspection_id: "${insp1}", mine_id: "${m_id}", standard_code: "30 CFR 75.500", kind: "CITATION", negligence: "MODERATE", gravity_likelihood: "REASONABLY_LIKELY", gravity_severity: "SERIOUS", persons_affected: 2, significant_and_substantial: false, repeat_violation: false }
              as: Inspector
              as_user_id: "${i1}"
              captures: { cit1: $.data.id, cv1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-12T09:00:00Z" }
              as: MSHAAdmin
            - call: "POST /msha/citations/${cit1}/extend-abatement"
              payload: { justification: "parts on order" }
              as: OperatorRep
              as_user_id: "${op_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-13T09:00:00Z" }
              as: MSHAAdmin
          trigger:
            - call: "POST /msha/contests"
              payload: { citation_id: "${cit1}", expected_citation_version: "${cv1}", grounds: "stale view of the citation" }
              as: OperatorRep
              as_user_id: "${op_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response is 412 with error_id ERR_STALE_VERSION"
            - "Citation.${cit1}.contest_status remains UNCONTESTED and no Contest is created"

      - name: citation_version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds:
          - entities.Citation
        distinguishing_aspect: "version starts at 1 and increments exactly once per mutation: issuance 1, abate 2, verify 3 — the common-fields contract is observable end to end on a single citation."
        test_recipe:
          setup:
            - "Citation issued and then carried through abate and verify."
          setup_api_calls:
            - *clk_feb10_0800
