          - state_machines.ArtworkRound.APPROVED_to_INVALIDATED
        excluded_because:
          difficulty_instance: transitive_cascade / ingredient_substitution_five_hop_cascade
          rationale: "The five-hop cost-change -> cost-model -> specification -> artwork -> claim -> item cascade with its exact per-hop field values is the entire subject of that §1.8 instance."

