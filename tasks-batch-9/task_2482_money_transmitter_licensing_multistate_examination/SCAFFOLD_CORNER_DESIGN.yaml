# §1.9 Scaffold Corner Design — breadth probe for
# task_2482_money_transmitter_licensing_multistate_examination.
# Sections and claim_type values are taken verbatim from
# skills/prd-bench-scaffold-generator/references/claim-extraction-guide.md.
# The logical clock starts at 2026-08-01T00:00:00Z in every recipe below and only
# POST /_clock/set_current_utc moves it.
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_jurisdiction_persists_reference_config
        claim_type: Creation
        grounds:
          - entities.Jurisdiction
          - endpoints[POST /jurisdictions]
        distinguishing_aspect: "POST /jurisdictions with all eleven declared inputs returns 201 and echoes every stored reference value, including bond_cap_cents and call_report_frequency."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /jurisdictions"
              payload: { state_code: "CA", name: "California DFPI", min_net_worth_cents: 50000000, base_bond_cents: 5000000, per_delegate_bond_cents: 100000, bond_cap_cents: 40000000, response_window_days: 15, renewal_fee_cents: 500000, assessment_rate_bps: 25, call_report_frequency: "QUARTERLY", participates_in_multistate: true }
              as: PlatformAdmin
              captures: { ca_id: "$.data.id" }
          assert:
            - "HTTP 201; response_type == object and meta.api_request_id is present"
            - "Jurisdiction.${ca_id}.state_code == CA and name == California DFPI"
            - "Jurisdiction.${ca_id}.min_net_worth_cents == 50000000, base_bond_cents == 5000000, per_delegate_bond_cents == 100000, bond_cap_cents == 40000000"
            - "Jurisdiction.${ca_id}.response_window_days == 15, renewal_fee_cents == 500000, assessment_rate_bps == 25"
            - "Jurisdiction.${ca_id}.call_report_frequency == QUARTERLY and participates_in_multistate == true"

      - name: jurisdiction_omitted_participation_flag_defaults_to_true
        claim_type: Defaults
        grounds:
          - entities.Jurisdiction.fields.participates_in_multistate
        distinguishing_aspect: "Omitting the only optional input participates_in_multistate yields true, not false and not null."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /jurisdictions"
              payload: { state_code: "NV", name: "Nevada FID", min_net_worth_cents: 10000000, base_bond_cents: 1000000, per_delegate_bond_cents: 50000, bond_cap_cents: 20000000, response_window_days: 30, renewal_fee_cents: 245000, assessment_rate_bps: 10, call_report_frequency: "ANNUAL" }
              as: PlatformAdmin
              captures: { nv_id: "$.data.id" }
          assert:
            - "HTTP 201; Jurisdiction.${nv_id}.participates_in_multistate == true"
            - "Jurisdiction.${nv_id}.call_report_frequency == ANNUAL"

      - name: jurisdiction_response_carries_no_version_or_updated_at
        claim_type: Immutability
        grounds:
          - entities.Jurisdiction
        distinguishing_aspect: "Jurisdiction declares common_fields false, so its create response exposes id and created_at but NO version and NO updated_at, and §1.5 declares no update or delete endpoint for it."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /jurisdictions"
              payload: { state_code: "TX", name: "Texas DOB", min_net_worth_cents: 100000000, base_bond_cents: 30000000, per_delegate_bond_cents: 250000, bond_cap_cents: 60000000, response_window_days: 10, renewal_fee_cents: 750000, assessment_rate_bps: 40, call_report_frequency: "QUARTERLY", participates_in_multistate: true }
              as: PlatformAdmin
              captures: { tx_id: "$.data.id" }
          assert:
            - "HTTP 201; data.id is present and data.created_at is present"
            - "data has no version key and no updated_at key"
            - "no PATCH, PUT or DELETE endpoint exists for /jurisdictions/{id} in the API surface"

      - name: new_licensee_starts_with_vacuous_coverage_defaults
        claim_type: Defaults
        grounds:
          - entities.Licensee.fields.coverage_ratio_bps
          - entities.Licensee.fields.coverage_posture
          - entities.Licensee.fields.control_chain_status
          - entities.Licensee.fields.active_license_count
        distinguishing_aspect: "A licensee created with only legal_name and ein reads reported_tangible_net_worth_cents 0, coverage_ratio_bps 10000 and coverage_posture COMPLIANT — the zero-obligation ratio is the vacuous 10000, not 0."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /licensees"
              payload: { legal_name: "Meridian Transfer LLC", ein: "74-1100001" }
              as: LicensingManager
              captures: { lic_id: "$.data.id", lic_v: "$.data.version" }
          assert:
            - "HTTP 201; Licensee.${lic_id}.reported_tangible_net_worth_cents == 0 and net_worth_statement_date is null"
            - "Licensee.${lic_id}.aggregate_outstanding_obligations_cents == 0, eligible_investment_value_cents == 0, book_investment_value_cents == 0"
            - "Licensee.${lic_id}.coverage_ratio_bps == 10000 and coverage_posture == COMPLIANT"
            - "Licensee.${lic_id}.consecutive_failed_test_count == 0, control_chain_status == VERIFIED, active_license_count == 0"
            - "${lic_v} == 1"

      - name: licensee_without_ein_rejects_with_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=30]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting the required input ein returns ERR_INVALID_REQUEST (400) and persists no Licensee row."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /licensees"
              payload: { legal_name: "Meridian Transfer LLC" }
              as: LicensingManager
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "data.message is a non-empty string and response_type == error"
            - "no Licensee row exists"

      - name: second_licensee_with_same_ein_rejects_with_duplicate_ein
        claim_type: Type Constraints
        grounds:
          - validations[priority=101]
          - errors[ERR_DUPLICATE_EIN]
          - entities.Licensee.fields.ein
        distinguishing_aspect: "Licensee.ein is globally unique: a second POST /licensees carrying an EIN already on file returns ERR_DUPLICATE_EIN (409) even when legal_name differs."
        test_recipe:
          setup: ["One licensee on file with ein 74-1100001."]
          setup_api_calls:
            - call: "POST /licensees"
              payload: { legal_name: "Meridian Transfer LLC", ein: "74-1100001", reported_tangible_net_worth_cents: 500000000, net_worth_statement_date: "2026-06-30T00:00:00Z" }
              as: LicensingManager
              captures: { lic_id: "$.data.id" }
          trigger:
            - call: "POST /licensees"
              payload: { legal_name: "Meridian Payments Inc", ein: "74-1100001" }
              as: LicensingManager
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 409 with error_id == ERR_DUPLICATE_EIN"
            - "exactly 1 Licensee row exists and its legal_name is still Meridian Transfer LLC"

      - name: second_jurisdiction_with_same_state_code_rejects
        claim_type: Type Constraints
        grounds:
          - validations[priority=102]
          - errors[ERR_DUPLICATE_STATE_CODE]
          - entities.Jurisdiction.fields.state_code
        distinguishing_aspect: "Jurisdiction.state_code is unique: a second CA row is refused with ERR_DUPLICATE_STATE_CODE (409) even with different fee configuration."
        test_recipe:
          setup: ["Jurisdiction CA on file."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "CA", name: "California DFPI", min_net_worth_cents: 50000000, base_bond_cents: 5000000, per_delegate_bond_cents: 100000, bond_cap_cents: 40000000, response_window_days: 15, renewal_fee_cents: 500000, assessment_rate_bps: 25, call_report_frequency: "QUARTERLY", participates_in_multistate: true }
              as: PlatformAdmin
              captures: { ca_id: "$.data.id" }
          trigger:
            - call: "POST /jurisdictions"
              payload: { state_code: "CA", name: "California DFPI (duplicate)", min_net_worth_cents: 60000000, base_bond_cents: 6000000, per_delegate_bond_cents: 100000, bond_cap_cents: 40000000, response_window_days: 15, renewal_fee_cents: 500000, assessment_rate_bps: 25, call_report_frequency: "QUARTERLY", participates_in_multistate: true }
              as: PlatformAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 409 with error_id == ERR_DUPLICATE_STATE_CODE"
            - "Jurisdiction.${ca_id}.min_net_worth_cents is still 50000000"

      - name: unknown_licensee_id_returns_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=40]
          - errors[ERR_LICENSEE_NOT_FOUND]
        distinguishing_aspect: "A well-formed but unknown UUID on GET /licensees/{id} returns ERR_LICENSEE_NOT_FOUND (404), not 400 and not an empty 200."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /licensees/00000000-0000-0000-0000-000000000000"
              as: LicensingManager
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 404 with error_id == ERR_LICENSEE_NOT_FOUND"
            - "response_type == error and data.message is a non-empty string"

      - name: new_investment_holding_is_server_marked_held
        claim_type: Computed Fields
        grounds:
          - entities.InvestmentHolding.fields.status
          - entities.InvestmentHolding.fields.age_days
          - endpoints[POST /investment-holdings]
        distinguishing_aspect: "status is source computed and is set to HELD by the server on creation, and the optional age_days defaults to 0 when omitted."
        test_recipe:
          setup: ["One licensee on file."]
          setup_api_calls:
            - call: "POST /licensees"
              payload: { legal_name: "Meridian Transfer LLC", ein: "74-1100001", reported_tangible_net_worth_cents: 500000000, net_worth_statement_date: "2026-06-30T00:00:00Z" }
              as: LicensingManager
              captures: { lic_id: "$.data.id" }
          trigger:
            - call: "POST /investment-holdings"
              payload: { licensee_id: "${lic_id}", asset_class: "CASH", counterparty_name: "First Republic Trust", book_value_cents: 4000000, market_value_cents: 4000000 }
              as: ComplianceOfficer
              captures: { h_id: "$.data.id" }
          assert:
            - "HTTP 201; InvestmentHolding.${h_id}.status == HELD and age_days == 0"
            - "Licensee.${lic_id}.book_investment_value_cents == 4000000 and eligible_investment_value_cents == 4000000"
            - "Licensee.${lic_id}.coverage_ratio_bps == 10000 (obligations are 0, so the ratio is the vacuous 10000)"

      - name: investment_holding_with_negative_book_value_rejects
        claim_type: Type Constraints
        grounds:
          - validations[priority=30]
          - entities.InvestmentHolding.fields.book_value_cents
        distinguishing_aspect: "book_value_cents is constrained >= 0, so -1 returns ERR_INVALID_REQUEST (400) and no holding is created."
        test_recipe:
          setup: ["One licensee on file."]
          setup_api_calls:
            - call: "POST /licensees"
              payload: { legal_name: "Meridian Transfer LLC", ein: "74-1100001", reported_tangible_net_worth_cents: 500000000, net_worth_statement_date: "2026-06-30T00:00:00Z" }
              as: LicensingManager
              captures: { lic_id: "$.data.id" }
          trigger:
            - call: "POST /investment-holdings"
              payload: { licensee_id: "${lic_id}", asset_class: "CASH", counterparty_name: "First Republic Trust", book_value_cents: -1, market_value_cents: 4000000 }
              as: ComplianceOfficer
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "GET /licensees/${lic_id}/investment-holdings returns 0 rows"
            - "Licensee.${lic_id}.book_investment_value_cents == 0"

      - name: authorization_with_expiry_before_effective_rejects
        claim_type: Type Constraints
        grounds:
          - validations[priority=30]
          - entities.DelegateAuthorization.fields.expiry_date
        distinguishing_aspect: "expiry_date is constrained >= effective_date, so an inverted window returns ERR_INVALID_REQUEST (400) before any state or overlap rule is consulted."
        test_recipe:
          setup:
            - "Jurisdiction CA; licensee with an ACTIVE CA license; one delegate in ONBOARDING."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "CA", name: "California DFPI", min_net_worth_cents: 50000000, base_bond_cents: 5000000, per_delegate_bond_cents: 100000, bond_cap_cents: 40000000, response_window_days: 15, renewal_fee_cents: 500000, assessment_rate_bps: 25, call_report_frequency: "QUARTERLY", participates_in_multistate: true }
              as: PlatformAdmin
              captures: { ca_id: "$.data.id" }
            - call: "POST /licensees"
              payload: { legal_name: "Meridian Transfer LLC", ein: "74-1100001", reported_tangible_net_worth_cents: 500000000, net_worth_statement_date: "2026-06-30T00:00:00Z" }
              as: LicensingManager
              captures: { lic_id: "$.data.id" }
            - call: "POST /license-applications"
              payload: { licensee_id: "${lic_id}", jurisdiction_id: "${ca_id}", license_class: "MONEY_TRANSMISSION", projected_annual_volume_cents: 90000000, new_product_narrative: "Domestic P2P transfers." }
              as: LicensingManager
              captures: { app_id: "$.data.id" }
            - call: "POST /license-applications/${app_id}/submit"
              payload: {}
              as: LicensingManager
            - call: "POST /license-applications/${app_id}/review-actions"
              payload: { action: "START_REVIEW" }
              as: StateRegulator
              as_user_id: "${ca_id}"
            - call: "POST /license-applications/${app_id}/review-actions"
              payload: { action: "APPROVE" }
              as: StateRegulator
              as_user_id: "${ca_id}"
            - call: "GET /state-licenses?application_id=${app_id}"
              as: LicensingManager
              captures: { lic_ca_id: "$.data[0].id" }
            - call: "POST /state-licenses/${lic_ca_id}/bond"
              payload: { amount_cents: 5000000, bond_issuer: "Atlas Surety", effective_date: "2026-08-01T00:00:00Z" }
              as: LicensingManager
            - call: "POST /delegates"
              payload: { licensee_id: "${lic_id}", legal_name: "Sunrise Checks Inc", delegate_type: "AUTHORIZED_DELEGATE" }
              as: LicensingManager
              captures: { del_id: "$.data.id" }
          trigger:
            - call: "POST /delegate-authorizations"
              payload: { delegate_id: "${del_id}", state_license_id: "${lic_ca_id}", effective_date: "2026-10-01T00:00:00Z", expiry_date: "2026-09-01T00:00:00Z", monthly_volume_cap_cents: 5000000 }
              as: LicensingManager
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "GET /delegate-authorizations?delegate_id=${del_id} returns 0 rows"
            - "Delegate.${del_id}.status == ONBOARDING and authorized_state_count == 0"

      - name: control_person_parent_from_another_licensee_rejects
        claim_type: Parent Relationships
        grounds:
          - validations[priority=80]
          - errors[ERR_CROSS_LICENSEE_REFERENCE]
          - entities.ControlPerson.fields.parent_control_person_id
        distinguishing_aspect: "parent_control_person_id must belong to the same Licensee: pointing at another licensee's control person returns ERR_CROSS_LICENSEE_REFERENCE (422), not a 404."
        test_recipe:
          setup: ["Two licensees; licensee A has one control person on file."]
          setup_api_calls:
            - call: "POST /licensees"
              payload: { legal_name: "Meridian Transfer LLC", ein: "74-1100001", reported_tangible_net_worth_cents: 500000000, net_worth_statement_date: "2026-06-30T00:00:00Z" }
              as: LicensingManager
              captures: { lic_a_id: "$.data.id" }
            - call: "POST /licensees"
              payload: { legal_name: "Halcyon Remit Corp", ein: "74-1100002", reported_tangible_net_worth_cents: 400000000, net_worth_statement_date: "2026-06-30T00:00:00Z" }
              as: LicensingManager
              captures: { lic_b_id: "$.data.id" }
            - call: "POST /control-persons"
              payload: { licensee_id: "${lic_a_id}", full_name: "Northgate HoldCo", role_title: "ENTITY_HOLDER", direct_ownership_bps: 6000 }
              as: LicensingManager
              captures: { cp_a_id: "$.data.id" }
          trigger:
            - call: "POST /control-persons"
              payload: { licensee_id: "${lic_b_id}", full_name: "Priya Raman", role_title: "ENTITY_HOLDER", direct_ownership_bps: 4000, parent_control_person_id: "${cp_a_id}" }
              as: LicensingManager
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 422 with error_id == ERR_CROSS_LICENSEE_REFERENCE"
            - "GET /control-persons?licensee_id=${lic_b_id} returns 0 rows"
            - "Licensee.${lic_b_id}.control_chain_status == VERIFIED (unchanged)"

      - name: control_person_chain_deeper_than_five_links_rejects
        claim_type: Parent Relationships
        grounds:
          - validations[priority=106]
          - errors[ERR_CONTROL_CHAIN_CYCLE]
          - calculations.control_person_ownership_attribution
        distinguishing_aspect: "MAX_CHAIN_DEPTH is 5: the fifth row of a parent chain is accepted and the sixth (which would sit six links from the root) returns ERR_CONTROL_CHAIN_CYCLE (422)."
        test_recipe:
          setup: ["One licensee with a five-deep ControlPerson chain (root plus four descendants)."]
          setup_api_calls:
            - call: "POST /licensees"
              payload: { legal_name: "Meridian Transfer LLC", ein: "74-1100001", reported_tangible_net_worth_cents: 500000000, net_worth_statement_date: "2026-06-30T00:00:00Z" }
              as: LicensingManager
              captures: { lic_id: "$.data.id" }
            - call: "POST /control-persons"
              payload: { licensee_id: "${lic_id}", full_name: "Tier 1 HoldCo", role_title: "ENTITY_HOLDER", direct_ownership_bps: 10000 }
              as: LicensingManager
              captures: { cp1_id: "$.data.id" }
            - call: "POST /control-persons"
              payload: { licensee_id: "${lic_id}", full_name: "Tier 2 HoldCo", role_title: "ENTITY_HOLDER", direct_ownership_bps: 10000, parent_control_person_id: "${cp1_id}" }
              as: LicensingManager
              captures: { cp2_id: "$.data.id" }
            - call: "POST /control-persons"
              payload: { licensee_id: "${lic_id}", full_name: "Tier 3 HoldCo", role_title: "ENTITY_HOLDER", direct_ownership_bps: 10000, parent_control_person_id: "${cp2_id}" }
              as: LicensingManager
              captures: { cp3_id: "$.data.id" }
            - call: "POST /control-persons"
              payload: { licensee_id: "${lic_id}", full_name: "Tier 4 HoldCo", role_title: "ENTITY_HOLDER", direct_ownership_bps: 10000, parent_control_person_id: "${cp3_id}" }
              as: LicensingManager
              captures: { cp4_id: "$.data.id" }
            - call: "POST /control-persons"
              payload: { licensee_id: "${lic_id}", full_name: "Tier 5 HoldCo", role_title: "ENTITY_HOLDER", direct_ownership_bps: 10000, parent_control_person_id: "${cp4_id}" }
              as: LicensingManager
              captures: { cp5_id: "$.data.id" }
          trigger:
            - call: "POST /control-persons"
              payload: { licensee_id: "${lic_id}", full_name: "Tier 6 HoldCo", role_title: "ENTITY_HOLDER", direct_ownership_bps: 10000, parent_control_person_id: "${cp5_id}" }
              as: LicensingManager
              captures: { err_id: "$.data.error_id" }
          assert:
            - "the five setup rows were all accepted; ControlPerson.${cp5_id}.effective_ownership_bps == 10000 and attributed_ownership_bps == 10000"
            - "trigger: HTTP 422 with error_id == ERR_CONTROL_CHAIN_CYCLE"
            - "GET /control-persons?licensee_id=${lic_id} returns exactly 5 rows"

      - name: authorization_joining_delegate_and_license_of_two_licensees_rejects
        claim_type: graph
        grounds:
          - validations[priority=80]
          - errors[ERR_CROSS_LICENSEE_REFERENCE]
          - entities.DelegateAuthorization
        distinguishing_aspect: "DelegateAuthorization is the junction of Delegate x StateLicense; both endpoints of the edge must sit under one Licensee, so a delegate of licensee B under a license of licensee A returns ERR_CROSS_LICENSEE_REFERENCE (422)."
        test_recipe:
          setup:
            - "Jurisdiction CA; licensee A with an ACTIVE CA license; licensee B with one delegate."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "CA", name: "California DFPI", min_net_worth_cents: 50000000, base_bond_cents: 5000000, per_delegate_bond_cents: 100000, bond_cap_cents: 40000000, response_window_days: 15, renewal_fee_cents: 500000, assessment_rate_bps: 25, call_report_frequency: "QUARTERLY", participates_in_multistate: true }
              as: PlatformAdmin
              captures: { ca_id: "$.data.id" }
            - call: "POST /licensees"
              payload: { legal_name: "Meridian Transfer LLC", ein: "74-1100001", reported_tangible_net_worth_cents: 500000000, net_worth_statement_date: "2026-06-30T00:00:00Z" }
              as: LicensingManager
              captures: { lic_a_id: "$.data.id" }
            - call: "POST /license-applications"
              payload: { licensee_id: "${lic_a_id}", jurisdiction_id: "${ca_id}", license_class: "MONEY_TRANSMISSION", projected_annual_volume_cents: 90000000, new_product_narrative: "Domestic P2P transfers." }
              as: LicensingManager
              captures: { app_id: "$.data.id" }
            - call: "POST /license-applications/${app_id}/submit"
              payload: {}
              as: LicensingManager
            - call: "POST /license-applications/${app_id}/review-actions"
              payload: { action: "START_REVIEW" }
              as: StateRegulator
              as_user_id: "${ca_id}"
            - call: "POST /license-applications/${app_id}/review-actions"
              payload: { action: "APPROVE" }
              as: StateRegulator
              as_user_id: "${ca_id}"
            - call: "GET /state-licenses?application_id=${app_id}"
              as: LicensingManager
              captures: { lic_ca_id: "$.data[0].id" }
            - call: "POST /state-licenses/${lic_ca_id}/bond"
              payload: { amount_cents: 5000000, bond_issuer: "Atlas Surety", effective_date: "2026-08-01T00:00:00Z" }
              as: LicensingManager
            - call: "POST /licensees"
              payload: { legal_name: "Halcyon Remit Corp", ein: "74-1100002", reported_tangible_net_worth_cents: 400000000, net_worth_statement_date: "2026-06-30T00:00:00Z" }
              as: LicensingManager
              captures: { lic_b_id: "$.data.id" }
            - call: "POST /delegates"
              payload: { licensee_id: "${lic_b_id}", legal_name: "Foreign Agent LLC", delegate_type: "AGENT" }
              as: LicensingManager
              captures: { del_b_id: "$.data.id" }
          trigger:
            - call: "POST /delegate-authorizations"
              payload: { delegate_id: "${del_b_id}", state_license_id: "${lic_ca_id}", effective_date: "2026-09-01T00:00:00Z", expiry_date: "2027-08-31T00:00:00Z", monthly_volume_cap_cents: 5000000 }
              as: LicensingManager
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 422 with error_id == ERR_CROSS_LICENSEE_REFERENCE"
            - "GET /delegate-authorizations?state_license_id=${lic_ca_id} returns 0 rows"
            - "StateLicense.${lic_ca_id}.active_delegate_count == 0 and bond_requirement_cents == 5000000"

      - name: investment_holdings_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /licensees/{id}/investment-holdings]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three holdings on file, limit 2 offset 0 returns 2 rows with total_count 3 and has_more true; offset 2 returns the last row with has_more false."
        test_recipe:
          setup: ["One licensee with three HELD investment holdings."]
          setup_api_calls:
            - call: "POST /licensees"
              payload: { legal_name: "Meridian Transfer LLC", ein: "74-1100001", reported_tangible_net_worth_cents: 500000000, net_worth_statement_date: "2026-06-30T00:00:00Z" }
              as: LicensingManager
              captures: { lic_id: "$.data.id" }
            - call: "POST /investment-holdings"
