              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/room-types"
              payload: { code: "KING", name: "King Room", physical_capacity_units: 10, master_description_hash: "kingv1", master_image_count: 5 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "OTA1", channel_kind: "OTA_PUBLIC", commission_bp: 1750, sell_adjustment_bp: 0, allows_member_rate: true, geo_market_codes: ["US-CA"] }
              as: PlatformAdmin
              captures: { ota1_id: $.data.id }
            - call: "POST /distribution/channels/${ota1_id}/connections"
              payload: { protocol: "JSON_PUSH", endpoint_url: "https://ota1.example.com/ari", heartbeat_interval_minutes: 15 }
              as: ChannelOpsEngineer
              captures: { ota1_conn_id: $.data.id }
            - call: "POST /distribution/channel-connections/${ota1_conn_id}/activate"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "BAR", rate_class: "PUBLIC", base_amount_cents: 25000, floor_amount_cents: 18000, ceiling_amount_cents: 40000 }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /distribution/rate-plans/${bar_id}/activate"
              payload: {}
              as: RevenueManager
            - call: "POST /distribution/rate-plans/${bar_id}/promotions"
              payload: { code: "MEMBER10", promo_kind: "MEMBER_RATE", discount_kind: "PERCENT", discount_bp: 1000, start_date: "2026-09-01", end_date: "2026-09-30" }
              as: RevenueManager
              captures: { member10_id: $.data.id }
            - call: "POST /distribution/promotions/${member10_id}/submit"
              payload: {}
              as: RevenueManager
              as_user_id: "rm-1"
            - call: "POST /distribution/promotions/${member10_id}/approve"
              payload: {}
              as: RevenueDirector
              as_user_id: "rd-1"
            - call: "POST /distribution/rate-plans/${bar_id}/promotions"
              payload: { code: "GEO10USD", promo_kind: "GEO_OFFER", discount_kind: "AMOUNT", discount_amount_cents: 1000, start_date: "2026-09-10", end_date: "2026-09-11", geo_market_codes: ["US-CA"] }
              as: RevenueManager
              captures: { geo10_id: $.data.id }
            - call: "POST /distribution/promotions/${geo10_id}/submit"
              payload: {}
              as: RevenueManager
              as_user_id: "rm-1"
            - call: "POST /distribution/promotions/${geo10_id}/approve"
              payload: {}
              as: RevenueDirector
              as_user_id: "rd-1"
            - call: "POST /distribution/room-types/${king_id}/inventory-days"
              payload: { stay_date: "2026-09-10" }
              as: RevenueManager
            - call: "POST /distribution/room-types/${king_id}/inventory-days"
              payload: { stay_date: "2026-09-11" }
              as: RevenueManager
            - call: "POST /distribution/room-types/${king_id}/inventory-days"
              payload: { stay_date: "2026-09-12" }
              as: RevenueManager
          trigger:
            - call: "POST /distribution/reservations"
              payload: { channel_id: "${ota1_id}", rate_plan_id: "${bar_id}", room_type_id: "${king_id}", arrival_date: "2026-09-10", nights: 3, member_flag: true, geo_market_code: "US-CA" }
              as: RevenueManager
              captures: { res_a_id: $.data.id }
          assert:
            - "Reservation.${res_a_id}.departure_date == 2026-09-13 (computed as arrival_date + nights, never supplied)"
            - "Reservation.${res_a_id}.nightly_breakdown == [{stay_date: 2026-09-10, sell_rate_cents: 21500, commissionable_cents: 21500, commission_cents: 3763}, {stay_date: 2026-09-11, sell_rate_cents: 21500, commissionable_cents: 21500, commission_cents: 3763}, {stay_date: 2026-09-12, sell_rate_cents: 22500, commissionable_cents: 22500, commission_cents: 3938}] (GEO10USD covers only 2026-09-10 and 2026-09-11)"
            - "Reservation.${res_a_id}.gross_amount_cents == 65500"
            - "Reservation.${res_a_id}.commission_amount_cents == 11464, NOT 11463 (round_half_up per night then sum, never once on the gross)"
            - "Reservation.${res_a_id}.net_amount_cents == 54036"
            - "Reservation.${res_a_id}.loyalty_credit_cents == 2161 (tier 400bp because 50000 <= gross 65500 < 70000, applied to net)"

      - name: package_loyalty_tier_keyed_on_gross_then_credit_on_net
        grounds:
          - calculations.package_loyalty_credit
          - calculations.reservation_charge_breakdown
          - calculations.resolved_base_amount
          - entities.RatePlan.fields.package_inclusion_cents
        distinguishing_aspect: |
          Mode (c) evaluation order: E2 reads GROSS 71000 to pick tier 600bp and E4 applies it to
          NET 59450 for a credit of 3567; keying the tier on net (59450 -> 400bp) gives 2378 and
          commissioning the 2500 inclusion gives commission 12426 - each ordering error is a
          distinct observable number on the same reservation.
        test_recipe:
          setup:
            - "Property HTL-SFO, room type KING, channel OTA1 (commission_bp 1750) with a HEALTHY connection."
            - "Rate plan BAR ACTIVE at 25000; child plan PKG ACTIVE: PACKAGE, parent BAR, offset_kind AMOUNT +8000, floor 20000, ceiling 60000, package_inclusion_cents 2500 -> resolved_base_amount_cents 33000, nightly sell 35500."
            - "No promotions exist, so every night prices identically."
            - "Inventory days open for 2026-09-10 and 2026-09-11; clock at 2026-08-25."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/room-types"
              payload: { code: "KING", name: "King Room", physical_capacity_units: 10, master_description_hash: "kingv1", master_image_count: 5 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "OTA1", channel_kind: "OTA_PUBLIC", commission_bp: 1750, sell_adjustment_bp: 0, allows_member_rate: true, geo_market_codes: ["US-CA"] }
              as: PlatformAdmin
              captures: { ota1_id: $.data.id }
            - call: "POST /distribution/channels/${ota1_id}/connections"
              payload: { protocol: "JSON_PUSH", endpoint_url: "https://ota1.example.com/ari", heartbeat_interval_minutes: 15 }
              as: ChannelOpsEngineer
              captures: { ota1_conn_id: $.data.id }
            - call: "POST /distribution/channel-connections/${ota1_conn_id}/activate"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "BAR", rate_class: "PUBLIC", base_amount_cents: 25000, floor_amount_cents: 18000, ceiling_amount_cents: 40000 }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /distribution/rate-plans/${bar_id}/activate"
              payload: {}
              as: RevenueManager
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "PKG", rate_class: "PACKAGE", parent_rate_plan_id: "${bar_id}", offset_kind: "AMOUNT", offset_amount_cents: 8000, package_inclusion_cents: 2500, floor_amount_cents: 20000, ceiling_amount_cents: 60000 }
              as: RevenueManager
              captures: { pkg_id: $.data.id }
            - call: "POST /distribution/rate-plans/${pkg_id}/activate"
              payload: {}
              as: RevenueManager
            - call: "POST /distribution/room-types/${king_id}/inventory-days"
              payload: { stay_date: "2026-09-10" }
              as: RevenueManager
            - call: "POST /distribution/room-types/${king_id}/inventory-days"
              payload: { stay_date: "2026-09-11" }
              as: RevenueManager
          trigger:
            - call: "POST /distribution/reservations"
              payload: { channel_id: "${ota1_id}", rate_plan_id: "${pkg_id}", room_type_id: "${king_id}", arrival_date: "2026-09-10", nights: 2 }
              as: RevenueManager
              captures: { res_pkg_id: $.data.id }
          assert:
            - "RatePlan.${pkg_id}.derivation_depth == 1 and RatePlan.${pkg_id}.resolved_base_amount_cents == 33000"
            - "Reservation.${res_pkg_id}.nightly_breakdown == [{stay_date: 2026-09-10, sell_rate_cents: 35500, commissionable_cents: 33000, commission_cents: 5775}, {stay_date: 2026-09-11, sell_rate_cents: 35500, commissionable_cents: 33000, commission_cents: 5775}] (the 2500 inclusion is added at S6, outside the clamp and outside the commissionable base)"
            - "Reservation.${res_pkg_id}.gross_amount_cents == 71000"
            - "Reservation.${res_pkg_id}.commission_amount_cents == 11550, NOT 12426 (the 2500 package inclusion is never commissionable)"
            - "Reservation.${res_pkg_id}.net_amount_cents == 59450"
            - "Reservation.${res_pkg_id}.loyalty_credit_cents == 3567, NOT 2378 (tier read from gross 71000 >= 70000 -> 600bp, then applied to net 59450)"
            - "Reservation.${res_pkg_id}.gross_amount_cents == Reservation.${res_pkg_id}.net_amount_cents + Reservation.${res_pkg_id}.commission_amount_cents"

  # =====================================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: connection_cycles_healthy_degraded_healthy_then_suspends_and_resuspends
        grounds:
          - state_machines.ChannelConnection.HEALTHY_to_DEGRADED
          - state_machines.ChannelConnection.DEGRADED_to_HEALTHY
          - state_machines.ChannelConnection.DEGRADED_to_DEGRADED
          - state_machines.ChannelConnection.DEGRADED_to_SUSPENDED
          - state_machines.ChannelConnection.SUSPENDED_to_DEGRADED
          - calculations.connection_health_scoring
        distinguishing_aspect: |
          Cyclic shape with a streak-dependent branch: the SAME trigger (an ERROR heartbeat) from the
          SAME state (DEGRADED) lands in DEGRADED when the streak reaches 2 and in SUSPENDED when it
          reaches 3, and the connection traverses HEALTHY -> DEGRADED -> HEALTHY -> DEGRADED ->
          SUSPENDED -> DEGRADED -> SUSPENDED, visiting DEGRADED three times and SUSPENDED twice.
        test_recipe:
          setup:
            - "Property HTL-SFO with channel OTA1 and one ChannelConnection in PENDING (JSON_PUSH, heartbeat_interval_minutes 15)."
            - "No allotments and no mappings exist, so the suspension cascade has nothing to recall - the test isolates the connection axis."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "OTA1", channel_kind: "OTA_PUBLIC", commission_bp: 1750 }
              as: PlatformAdmin
              captures: { ota1_id: $.data.id }
            - call: "POST /distribution/channels/${ota1_id}/connections"
              payload: { protocol: "JSON_PUSH", endpoint_url: "https://ota1.example.com/ari", heartbeat_interval_minutes: 15 }
              as: ChannelOpsEngineer
              captures: { conn_id: $.data.id }
          trigger:
            - call: "POST /distribution/channel-connections/${conn_id}/activate"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/channel-connections/${conn_id}/heartbeats"
              payload: { status: "ERROR", failure_code: "TIMEOUT" }
              as: ChannelOpsEngineer
            - call: "POST /distribution/channel-connections/${conn_id}/heartbeats"
              payload: { status: "OK" }
              as: ChannelOpsEngineer
            - call: "POST /distribution/channel-connections/${conn_id}/heartbeats"
              payload: { status: "ERROR", failure_code: "TIMEOUT" }
              as: ChannelOpsEngineer
            - call: "POST /distribution/channel-connections/${conn_id}/heartbeats"
              payload: { status: "ERROR", failure_code: "SCHEMA_ERROR" }
              as: ChannelOpsEngineer
            - call: "POST /distribution/channel-connections/${conn_id}/heartbeats"
              payload: { status: "ERROR", failure_code: "AUTH_REJECTED" }
              as: ChannelOpsEngineer
            - call: "POST /distribution/channel-connections/${conn_id}/revalidate"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/channel-connections/${conn_id}/heartbeats"
              payload: { status: "ERROR", failure_code: "TIMEOUT" }
              as: ChannelOpsEngineer
          assert:
            - "After activate: connection_state == HEALTHY, consecutive_failures == 0, suspended_at == null"
            - "After ERROR #1: connection_state == DEGRADED, consecutive_failures == 1, last_failure_code == TIMEOUT"
            - "After OK: connection_state == HEALTHY, consecutive_failures == 0, last_failure_code == null (the cycle closes back to HEALTHY, not to PENDING)"
            - "After ERROR #2: connection_state == DEGRADED, consecutive_failures == 1"
            - "After ERROR #3: connection_state == DEGRADED (self-loop), consecutive_failures == 2, last_failure_code == SCHEMA_ERROR"
            - "After ERROR #4: connection_state == SUSPENDED, consecutive_failures == 3, suspended_at == 2026-08-25T00:00:00.000Z, last_failure_code == AUTH_REJECTED"
            - "After revalidate: connection_state == DEGRADED, consecutive_failures == 2 (CONNECTION_FAILURE_SUSPEND_THRESHOLD - 1), suspended_at still non-null"
            - "After ERROR #5: connection_state == SUSPENDED again, consecutive_failures == 3 - one single failure re-suspends a revalidated connection"
            - "ChannelConnection.${conn_id}.version == 9 (created at 1, then 8 accepted writes)"

      - name: promotion_approval_and_distribution_axes_advance_independently
        grounds:
          - state_machines.Promotion.DRAFT_to_SUBMITTED
          - state_machines.Promotion.SUBMITTED_to_APPROVED
          - state_machines.Promotion.NOT_LOADED_to_LOADING
          - state_machines.Promotion.LOADING_to_LOADED
          - entities.Promotion.fields.approval_status
          - entities.Promotion.fields.distribution_status
        distinguishing_aspect: |
          Parallel shape: the promotion is loaded and reaches distribution_status LOADED while its
          approval_status is still DRAFT then SUBMITTED, and only afterwards reaches APPROVED - the
          four observed combined states are (DRAFT, LOADING), (SUBMITTED, LOADING),
          (SUBMITTED, LOADED) and (APPROVED, LOADED), proving neither axis gates the other.
        test_recipe:
          setup:
            - "Property HTL-SFO, room type KING, channel OTA1 with a HEALTHY connection, rate plan BAR ACTIVE at 25000."
            - "One VERIFIED, IN_PARITY channel mapping BAR x OTA1 x KING (hash kingv1, 5 images)."
            - "One promotion MEMBER10 on BAR in approval_status DRAFT and distribution_status NOT_LOADED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
