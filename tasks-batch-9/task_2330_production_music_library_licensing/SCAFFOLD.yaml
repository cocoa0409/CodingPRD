# =============================================================================
# task_2330 — Production Music Library Licensing (production music library)
# Seed tables §1.0–§1.7. Difficulty design → SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# Corner design    → SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2330. Production Music Library Licensing (production music library): composer agreements with
  work-for-hire versus royalty splits and exclusivity terms, catalog metadata tagging across mood,
  genre, instrumentation and tempo with search relevance tuning, license tier structure by media
  type, distribution scale and term with blanket and per-use options, blanket agreements with
  broadcasters and production companies with usage reporting requirements, cue sheet collection and
  performance royalty registration with rights societies, sync request handling with custom edits,
  stems and alternate lengths, unauthorized use detection through audio fingerprinting with claim
  and settlement, composer royalty accounting and statement generation

domain_name: production-music-library
api_prefix: /music-library

complexity_profile:
  difficulty_band: expert_plus          # above §0.4 Expert: 15 entities, 75 endpoints, 9 calculations,
                                        # 11 state machines across 9 entities (Composition and
                                        # BlanketAgreement each carry two independent axes; 4 cyclic,
                                        # 2 branching), 2 OCC rules, 5-deep cascade, 20 validations
  primary_archetype: pricing_engine
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: graph
  # Compositions, Licenses, CueSheets, UsageReports and RoyaltyLedgerEntries form a cross-aggregate
  # web: a CueSheet hangs off either a License or a UsageReport, its cues point back at arbitrary
  # Compositions, and ledger entries point polymorphically at License / CueSheet / UsageReport /
  # InfringementClaim. No single containment tree exists; every path is a flat collection.

  state_machine_shape: parallel
  # Composition carries two independent axes (catalog_status × availability_status) and
  # BlanketAgreement carries two more (coverage_status × reporting_status). SyncRequest is cyclic
  # (QUOTED→REVISION_REQUESTED→QUOTED) *and* branching (ACCEPTED→{EDIT_IN_PROGRESS,DELIVERED}),
  # ComposerAgreement is cyclic (ACTIVE→AMENDMENT_PENDING→ACTIVE), InfringementClaim is branching.

  relationship_patterns:
    - one_to_many          # Composer → ComposerAgreement → Composition
    - many_to_many         # CueSheet.cues[] ↔ Composition (a sheet cites many works, a work appears on many sheets)
    - cross_aggregate      # CueSheet attaches to either a License or a UsageReport
    - polymorphic          # RoyaltyLedgerEntry.source_ref_id discriminated by source_type

  role_model: segregation_of_duties
  # The RoyaltyAccountant user who FINALIZED a statement may not be the user who PAYS it.
  # LicensingAgent quotes but cannot accept a quote; Licensee accepts but cannot quote.
  # RightsManager owns agreements/claims/society traffic; CatalogAdmin owns metadata and delivery.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Composer
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Composer credit name as it appears on cue sheets" }
      - { name: pro_affiliation, type: enum, source: input, default: NONE, description: "Performing-rights society the composer is registered with", constraints: "ASCAP | BMI | SESAC | PRS | NONE" }
      - { name: payee_country, type: string, source: input, default: "US", description: "ISO-3166 alpha-2 country used for statement withholding audit" }
      - { name: tax_withholding_pct, type: number, source: input, default: 0.30, description: "Withholding rate applied to post-recoupment statement amounts", constraints: "0.00–0.50, exactly 2 decimals" }
      - { name: accrued_unpaid_cents, type: integer, source: computed, description: "sum(RoyaltyLedgerEntry.amount_cents) WHERE composer_id = this.id AND statement_id IS NULL AND source_type NOT IN {ADVANCE, ADVANCE_RECOUP}" }
      - { name: outstanding_advance_cents, type: integer, source: computed, description: "-1 * sum(RoyaltyLedgerEntry.amount_cents) WHERE composer_id = this.id AND source_type IN {ADVANCE, ADVANCE_RECOUP} (ADVANCE amounts are negative, ADVANCE_RECOUP positive); floor 0" }
      - { name: lifetime_paid_cents, type: integer, source: computed, description: "sum(RoyaltyStatement.net_payable_cents) WHERE composer_id = this.id AND status = PAID" }
      - { name: latest_statement_period_end, type: datetime, source: computed, description: "period_end of this composer's RoyaltyStatement rows ordered by period_end DESC, first row; null when the composer has no statement" }

  - name: ComposerAgreement
    parent: Composer
    common_fields: true
    fields:
      - { name: composer_id, type: string, source: input, description: "FK -> Composer.id; the signing composer" }
      - { name: agreement_type, type: enum, source: input, description: "WORK_FOR_HIRE (buyout, no royalty split) | ROYALTY_SPLIT" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Lifecycle state", constraints: "DRAFT | PENDING_SIGNATURE | ACTIVE | AMENDMENT_PENDING | TERMINATED" }
      - { name: writer_share_pct, type: number, source: input, description: "Composer's writer share of performance royalties; writer_share_pct + publisher_share_pct MUST equal 100", constraints: "0.00–100.00, 2 decimals" }
      - { name: publisher_share_pct, type: number, source: input, description: "Library's publisher share of performance royalties" }
      - { name: sync_fee_share_pct, type: number, source: input, description: "Composer's share of License.final_fee_cents and of infringement settlements; MUST be 0 when agreement_type = WORK_FOR_HIRE" }
      - { name: buyout_fee_cents, type: integer, source: input, default: 0, description: "One-time work-for-hire buyout; MUST be > 0 when agreement_type = WORK_FOR_HIRE and MUST be 0 when agreement_type = ROYALTY_SPLIT" }
      - { name: exclusivity, type: enum, source: input, description: "EXCLUSIVE (library is sole licensor of the works under this agreement) | NON_EXCLUSIVE" }
      - { name: holdback_days, type: integer, source: input, default: 0, description: "Days appended after an exclusive License.term_end during which the work stays blocked", constraints: "0–365" }
      - { name: advance_cents, type: integer, source: input, default: 0, description: "Recoupable advance; an ADVANCE ledger entry of -advance_cents is appended when the agreement is signed", constraints: ">= 0" }
      - { name: blanket_opt_in, type: boolean, source: input, default: true, description: "When false, works under this agreement may not be cited on blanket UsageReport cue sheets" }
      - { name: pending_writer_share_pct, type: number, source: system, description: "Proposed writer share while status = AMENDMENT_PENDING; null otherwise" }
      - { name: pending_publisher_share_pct, type: number, source: system, description: "Proposed publisher share while status = AMENDMENT_PENDING; null otherwise" }
      - { name: pending_sync_fee_share_pct, type: number, source: system, description: "Proposed sync-fee share while status = AMENDMENT_PENDING; null otherwise" }
      - { name: pending_holdback_days, type: integer, source: system, description: "Proposed holdback while status = AMENDMENT_PENDING; null otherwise" }
      - { name: amendment_round, type: integer, source: system, default: 0, description: "Count of ACCEPTED amendments; incremented on each accepted amendment decision" }
      - { name: signed_at, type: datetime, source: system, description: "Logical-clock instant of the signature; null before signing" }
      - { name: terminated_at, type: datetime, source: system, description: "Logical-clock instant of termination; null unless status = TERMINATED" }

  - name: Composition
    parent: null
    common_fields: true
    fields:
      - { name: composer_id, type: string, source: input, description: "FK -> Composer.id; writer of the work" }
      - { name: agreement_id, type: string, source: input, description: "FK -> ComposerAgreement.id; governs splits, exclusivity and holdback for this work" }
      - { name: title, type: string, source: input, description: "Work title" }
      - { name: duration_sec, type: integer, source: input, description: "Master duration in seconds", constraints: "1–3600" }
      - { name: tempo_bpm, type: integer, source: input, description: "Tempo in beats per minute", constraints: "40–240" }
      - { name: genre, type: enum, source: input, description: "Primary genre facet", constraints: "CINEMATIC | ROCK | ELECTRONIC | JAZZ | FOLK | HIPHOP | CLASSICAL" }
      - { name: mood_tags, type: array, source: input, description: "Mood facet values, 0–5 distinct members (may be empty at ingest; cataloging requires at least 1 — see ERR_METADATA_INCOMPLETE)", constraints: "members of {UPLIFTING, HOPEFUL, EPIC, DARK, TENSE, CALM, QUIRKY}" }
      - { name: instrumentation, type: array, source: input, description: "Instrumentation facet values, 0–6 distinct members (may be empty at ingest; cataloging requires at least 1 — see ERR_METADATA_INCOMPLETE)", constraints: "members of {PIANO, STRINGS, BRASS, GUITAR, SYNTH, PERCUSSION, VOCALS}" }
      - { name: catalog_status, type: enum, source: system, default: INGESTED, description: "Catalog axis (independent of availability_status)", constraints: "INGESTED | CATALOGED | RETIRED" }
      - { name: availability_status, type: enum, source: system, default: AVAILABLE, description: "Rights axis (independent of catalog_status)", constraints: "AVAILABLE | RESTRICTED | WITHDRAWN" }
      - { name: active_license_count, type: integer, source: computed, description: "count(License) WHERE composition_id = this.id AND status IN {ISSUED, ACTIVE}" }
      - { name: exclusive_block_until, type: datetime, source: computed, description: "max(License.exclusive_block_until) over License WHERE composition_id = this.id AND is_exclusive = true AND status IN {ISSUED, ACTIVE}; null when that set is empty" }
      - { name: open_claim_count, type: integer, source: computed, description: "count(InfringementClaim) WHERE composition_id = this.id AND status IN {NOTICED, DISPUTED}" }
      - { name: lifetime_performance_credits, type: number, source: computed, description: "sum over CueSheet WHERE status IN {REGISTERED, ACCEPTED_BY_SOCIETY} of credits_by_composition[this.id]; 2 decimals" }
      - { name: relevance_score, type: number, source: computed, description: "Search relevance, 2 decimals; populated ONLY in GET /music-library/compositions/search responses and null in every other response" }

  - name: CatalogSearchProfile
    parent: null
    common_fields: true
    comment: "Singleton configuration row (exactly one exists). PUT creates it on first call and replaces it afterwards."
    fields:
      - { name: weight_mood, type: integer, source: input, description: "Mood facet weight", constraints: "0–100; weight_mood + weight_genre + weight_instrumentation + weight_tempo MUST equal 100" }
      - { name: weight_genre, type: integer, source: input, description: "Genre facet weight", constraints: "0–100" }
      - { name: weight_instrumentation, type: integer, source: input, description: "Instrumentation facet weight", constraints: "0–100" }
      - { name: weight_tempo, type: integer, source: input, description: "Tempo facet weight", constraints: "0–100" }
      - { name: tempo_tolerance_bpm, type: integer, source: input, default: 20, description: "BPM distance at which tempo proximity reaches 0", constraints: "1–60" }
      - { name: restricted_availability_factor, type: number, source: input, default: 0.60, description: "Multiplier applied to the weighted facet score of compositions whose availability_status = RESTRICTED", constraints: "0.00–1.00, 2 decimals" }

  - name: LicenseTier
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Rate-card code; unique across LicenseTier" }
      - { name: media_type, type: enum, source: input, description: "Media the tier prices", constraints: "BROADCAST_TV | ONLINE_AD | FILM | CORPORATE | GAME" }
      - { name: allowed_scales, type: array, source: input, description: "Distribution scales this tier may be quoted at, 1–3 distinct members", constraints: "members of {LOCAL, NATIONAL, WORLDWIDE}" }
      - { name: base_rate_cents, type: integer, source: input, description: "Rate-card base before media/scale/term factors", constraints: "> 0" }
      - { name: min_term_months, type: integer, source: input, default: 1, description: "Smallest quotable term", constraints: "1–120" }
      - { name: max_term_months, type: integer, source: input, default: 120, description: "Largest quotable term; >= min_term_months", constraints: "1–120" }
      - { name: per_use_eligible, type: boolean, source: input, default: true, description: "Whether PER_USE licenses may cite this tier" }
      - { name: blanket_eligible, type: boolean, source: input, default: false, description: "Whether BLANKET licenses may cite this tier" }

  - name: Licensee
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Licensee legal entity name" }
      - { name: licensee_type, type: enum, source: input, description: "BROADCASTER | PRODUCTION_COMPANY | AGENCY | GAME_STUDIO" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Ceiling on committed_spend_cents + reserved_spend_cents", constraints: ">= 0" }
      - { name: committed_spend_cents, type: integer, source: computed, description: "sum(License.final_fee_cents) WHERE licensee_id = this.id AND status IN {ISSUED, ACTIVE}" }
      - { name: reserved_spend_cents, type: integer, source: computed, description: "sum(SyncRequest.quoted_fee_cents) WHERE licensee_id = this.id AND status IN {QUOTED, ACCEPTED, EDIT_IN_PROGRESS} AND license_id IS NULL (issuance moves the amount from reserved to committed)" }
      - { name: credit_available_cents, type: integer, source: computed, description: "credit_limit_cents - committed_spend_cents - reserved_spend_cents (may be negative only through credit_limit_cents reduction, never through issuance)" }

  - name: SyncRequest
    parent: null
    common_fields: true
    fields:
      - { name: composition_id, type: string, source: input, description: "FK -> Composition.id; the requested work" }
      - { name: licensee_id, type: string, source: input, description: "FK -> Licensee.id; requesting licensee, MUST equal X-User-ID for role Licensee" }
      - { name: tier_id, type: string, source: input, description: "FK -> LicenseTier.id; rate card the quote is priced from" }
      - { name: media_type, type: enum, source: input, description: "Requested media", constraints: "BROADCAST_TV | ONLINE_AD | FILM | CORPORATE | GAME" }
      - { name: distribution_scale, type: enum, source: input, description: "Requested distribution scale", constraints: "LOCAL | NATIONAL | WORLDWIDE" }
      - { name: requested_term_start, type: datetime, source: input, description: "First day of the requested term (date at 00:00:00Z)" }
      - { name: requested_term_months, type: integer, source: input, description: "Term length in whole months", constraints: "1–120" }
      - { name: exclusive_requested, type: boolean, source: input, default: false, description: "Whether the licensee wants media/scale exclusivity for the term" }
      - { name: custom_edit_requested, type: boolean, source: input, default: false, description: "Whether a custom edit pass is required before delivery" }
      - { name: stems_requested, type: boolean, source: input, default: false, description: "Whether multitrack stems are part of the deliverable" }
      - { name: alternate_lengths_sec, type: array, source: input, default: [], description: "Requested alternate cut-down lengths in seconds, 0–4 members", constraints: "each member 5–300" }
      - { name: rush_requested, type: boolean, source: input, default: false, description: "Whether a rush surcharge applies" }
      - { name: brief_note, type: string, source: input, description: "Free-text creative brief; null when omitted" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "Lifecycle state", constraints: "SUBMITTED | UNDER_REVIEW | QUOTED | REVISION_REQUESTED | ACCEPTED | EDIT_IN_PROGRESS | DELIVERED | DECLINED" }
      - { name: revision_round, type: integer, source: system, default: 0, description: "Number of REVISION_REQUESTED entries so far; hard cap 3" }
      - { name: quoted_fee_cents, type: integer, source: computed, description: "PROVISIONAL variant of license_fee_quote, recomputed on every QUOTED entry; null before the first quote" }
      - { name: quoted_spend_basis_cents, type: integer, source: computed, description: "Licensee.committed_spend_cents observed at quote time plus this quote's pre_discount_cents" }
      - { name: quoted_discount_pct, type: number, source: computed, description: "Volume discount rate selected from quoted_spend_basis_cents, 2 decimals" }
      - { name: quote_expires_at, type: datetime, source: computed, description: "Quote instant + quote_valid_days days; null before the first quote" }
      - { name: license_id, type: string, source: system, description: "FK -> License.id; the License issued from this request; null until issuance" }
      - { name: decline_reason, type: string, source: system, description: "Reason recorded on DECLINED; the literal CATALOG_WITHDRAWN when set by agreement-termination cascade" }
      - { name: delivered_asset_count, type: integer, source: system, description: "Assets handed over at delivery; null before DELIVERED" }

  - name: License
    parent: null
    common_fields: true
    fields:
      - { name: sync_request_id, type: string, source: input, description: "FK -> SyncRequest.id; null for license_mode = BLANKET" }
      - { name: composition_id, type: string, source: input, description: "FK -> Composition.id; licensed work" }
      - { name: licensee_id, type: string, source: system, description: "FK -> Licensee.id; copied from the SyncRequest or from BlanketAgreement.licensee_id" }
      - { name: tier_id, type: string, source: system, description: "FK -> LicenseTier.id; rate card used" }
      - { name: blanket_agreement_id, type: string, source: input, description: "FK -> BlanketAgreement.id; null for license_mode = PER_USE" }
      - { name: license_mode, type: enum, source: input, description: "PER_USE (priced from an accepted SyncRequest) | BLANKET (covered by a BlanketAgreement, zero fee)" }
      - { name: media_type, type: enum, source: system, description: "Licensed media", constraints: "BROADCAST_TV | ONLINE_AD | FILM | CORPORATE | GAME" }
      - { name: distribution_scale, type: enum, source: system, description: "Licensed scale", constraints: "LOCAL | NATIONAL | WORLDWIDE" }
      - { name: is_exclusive, type: boolean, source: system, description: "True only when license_mode = PER_USE and the source SyncRequest had exclusive_requested = true" }
      - { name: term_start, type: datetime, source: system, description: "First day of term (date at 00:00:00Z)" }
      - { name: term_months, type: integer, source: system, description: "Term length in whole months" }
      - { name: term_end, type: datetime, source: computed, description: "term_start + term_months calendar months - 1 day (date at 00:00:00Z); inclusive last day of term" }
      - { name: exclusive_block_until, type: datetime, source: computed, description: "term_end + ComposerAgreement.holdback_days days when is_exclusive = true; equals term_end when is_exclusive = false" }
      - { name: final_fee_cents, type: integer, source: computed, description: "FINAL variant of license_fee_quote evaluated at issuance; 0 when license_mode = BLANKET" }
      - { name: final_spend_basis_cents, type: integer, source: computed, description: "Licensee.committed_spend_cents observed at issuance plus this license's pre_discount_cents" }
      - { name: final_discount_pct, type: number, source: computed, description: "Volume discount rate selected from final_spend_basis_cents, 2 decimals" }
      - { name: composer_sync_share_cents, type: integer, source: computed, description: "round_half_up(final_fee_cents * ComposerAgreement.sync_fee_share_pct / 100); the SYNC_FEE ledger amount" }
      - { name: collected_amount_cents, type: integer, source: system, default: 0, description: "Cash received against final_fee_cents" }
      - { name: collected_at, type: datetime, source: system, description: "Logical-clock instant at which collected_amount_cents first reached final_fee_cents; null while short-paid" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "Lifecycle state", constraints: "ISSUED | ACTIVE | EXPIRED | REVOKED" }
      - { name: revoke_reason, type: string, source: system, description: "Reason recorded on REVOKED; null otherwise" }

  - name: BlanketAgreement
    parent: null
    common_fields: true
    fields:
      - { name: licensee_id, type: string, source: input, description: "FK -> Licensee.id; broadcaster or production company under blanket" }
      - { name: coverage_start, type: datetime, source: input, description: "Inclusive first day of coverage (date at 00:00:00Z)" }
      - { name: coverage_end, type: datetime, source: input, description: "EXCLUSIVE end of coverage (date at 00:00:00Z); coverage is the half-open interval [coverage_start, coverage_end)" }
      - { name: annual_fee_cents, type: integer, source: input, description: "Annual blanket fee", constraints: "> 0" }
      - { name: reporting_cadence, type: enum, source: input, description: "MONTHLY (1-month periods) | QUARTERLY (3-month periods)" }
      - { name: usage_cap_minutes, type: integer, source: input, description: "Included usage minutes per coverage term before overage bills", constraints: ">= 0" }
      - { name: pool_share_pct, type: number, source: input, description: "Percentage of the fee (and of overage) that funds the composer distribution pool", constraints: "0.00–100.00, 2 decimals" }
      - { name: coverage_status, type: enum, source: system, default: DRAFT, description: "Coverage axis (independent of reporting_status)", constraints: "DRAFT | ACTIVE | EXPIRED | TERMINATED" }
      - { name: reporting_status, type: enum, source: system, default: COMPLIANT, description: "Reporting axis (independent of coverage_status)", constraints: "COMPLIANT | DELINQUENT" }
      - { name: reported_minutes_ytd, type: integer, source: computed, description: "sum(UsageReport.reported_minutes_total) WHERE blanket_agreement_id = this.id AND status = ACCEPTED" }
      - { name: overage_minutes, type: integer, source: computed, description: "max(0, reported_minutes_ytd - usage_cap_minutes)" }
      - { name: overage_cents, type: integer, source: computed, description: "overage_minutes * OVERAGE_RATE_CENTS_PER_MINUTE" }
      - { name: pool_distributed_cents, type: integer, source: computed, description: "sum(UsageReport.pool_distributable_cents) WHERE blanket_agreement_id = this.id AND status = ACCEPTED" }
      - { name: pool_admin_fee_cents, type: integer, source: computed, description: "sum(UsageReport.pool_admin_fee_cents) WHERE blanket_agreement_id = this.id AND status = ACCEPTED" }
      - { name: delinquent_since, type: datetime, source: system, description: "Logical-clock instant reporting_status became DELINQUENT; null while COMPLIANT" }

  - name: UsageReport
    parent: BlanketAgreement
    common_fields: true
    fields:
      - { name: blanket_agreement_id, type: string, source: input, description: "FK -> BlanketAgreement.id; the reporting agreement" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive first day of the reporting period; MUST equal a cadence period boundary derived from coverage_start" }
      - { name: period_end, type: datetime, source: input, description: "Inclusive last day of the reporting period (period boundary + cadence - 1 day)" }
      - { name: status, type: enum, source: system, default: DUE, description: "Lifecycle state", constraints: "DUE | SUBMITTED | ACCEPTED | REJECTED" }
      - { name: reported_minutes_total, type: integer, source: computed, description: "ceil(sum(CueSheet.total_seconds over CueSheet WHERE usage_report_id = this.id AND status IN {REGISTERED, ACCEPTED_BY_SOCIETY}) / 60)" }
      - { name: reported_credits_total, type: number, source: computed, description: "sum(CueSheet.total_credits) over CueSheet WHERE usage_report_id = this.id AND status IN {REGISTERED, ACCEPTED_BY_SOCIETY}; 2 decimals" }
      - { name: pool_cents, type: integer, source: computed, description: "Gross pool funded by this period, set at acceptance; 0 while status != ACCEPTED" }
      - { name: pool_admin_fee_cents, type: integer, source: computed, description: "Administration retention taken off the gross pool, set at acceptance" }
      - { name: pool_distributable_cents, type: integer, source: computed, description: "pool_cents - pool_admin_fee_cents, set at acceptance" }
      - { name: pool_allocations, type: array, source: computed, description: "Objects {composition_id, credits, allocation_cents} produced at acceptance; sum(allocation_cents) == pool_distributable_cents exactly" }
      - { name: rejection_reason, type: string, source: system, description: "Reason recorded on REJECTED; null otherwise" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock instant of the latest submission; null while DUE" }
      - { name: accepted_at, type: datetime, source: system, description: "Logical-clock instant of acceptance; null unless status = ACCEPTED" }
      - { name: resubmission_count, type: integer, source: system, default: 0, description: "Number of submissions after the first (REJECTED → SUBMITTED loops)" }

  - name: CueSheet
    parent: null
    common_fields: true
    fields:
      - { name: license_id, type: string, source: input, description: "FK -> License.id; set for per-use reporting, null for blanket reporting" }
      - { name: usage_report_id, type: string, source: input, description: "FK -> UsageReport.id; set for blanket reporting, null for per-use reporting" }
      - { name: production_title, type: string, source: input, description: "Programme or production the cues were used in" }
      - { name: broadcast_date, type: datetime, source: input, description: "Date of first transmission (date at 00:00:00Z)" }
      - { name: market_tier, type: enum, source: input, description: "Market weighting of the transmission", constraints: "NETWORK | CABLE | LOCAL | DIGITAL" }
      - { name: cues, type: array, source: input, description: "1–20 objects {composition_id, usage_type, duration_sec}; composition_id must be an existing Composition.id, usage_type in {THEME, FEATURE, BACKGROUND, LOGO}, duration_sec 1–3600; elements are validated in array order" }
      - { name: status, type: enum, source: system, default: COLLECTED, description: "Lifecycle state", constraints: "COLLECTED | REGISTERED | ACCEPTED_BY_SOCIETY | REJECTED_BY_SOCIETY" }
      - { name: cue_credit_breakdown, type: array, source: computed, description: "Objects {composition_id, usage_type, duration_sec, credits} in cues[] order; credits rounded per cue to 2 decimals" }
      - { name: total_credits, type: number, source: computed, description: "Sum of cue_credit_breakdown[].credits (per-cue rounded values summed, never the unrounded sum), 2 decimals" }
      - { name: total_seconds, type: integer, source: computed, description: "sum(cues[].duration_sec)" }
      - { name: credits_by_composition, type: object, source: computed, description: "Map composition_id -> summed per-cue rounded credits for that work on this sheet" }
      - { name: society_reference, type: string, source: system, description: "Rights-society submission reference recorded at registration; null before REGISTERED" }
      - { name: registration_round, type: integer, source: system, default: 0, description: "Number of REGISTERED entries so far (re-registration after society rejection increments it)" }
      - { name: registered_at, type: datetime, source: system, description: "Logical-clock instant of the latest registration; null before REGISTERED" }
      - { name: rejection_reason, type: string, source: system, description: "Society rejection reason; null unless status = REJECTED_BY_SOCIETY" }

  - name: FingerprintMatch
    parent: null
    common_fields: false
    comment: "Append-only detection event from the audio-fingerprinting vendor. Immutable: no update endpoint, no version field."
    fields:
      - { name: composition_id, type: string, source: input, description: "FK -> Composition.id; the work the fingerprint matched" }
      - { name: source_platform, type: enum, source: input, description: "Where the unlicensed use was observed", constraints: "UGC_VIDEO | BROADCAST | THEATRICAL | PODCAST" }
      - { name: source_reference, type: string, source: input, description: "Vendor-side locator of the detected use" }
      - { name: matched_seconds, type: integer, source: input, description: "Seconds of the work detected in the source", constraints: "1–7200" }
      - { name: confidence_pct, type: number, source: input, description: "Fingerprint confidence", constraints: "0.0–100.0, 1 decimal" }
      - { name: detected_at, type: datetime, source: system, description: "Logical-clock instant at ingest" }

  - name: InfringementClaim
    parent: null
    common_fields: true
    fields:
      - { name: composition_id, type: string, source: system, description: "FK -> Composition.id; copied from the cited FingerprintMatch" }
      - { name: fingerprint_match_id, type: string, source: input, description: "FK -> FingerprintMatch.id; the detection the claim is built on" }
      - { name: status, type: enum, source: system, default: DETECTED, description: "Lifecycle state", constraints: "DETECTED | NOTICED | DISPUTED | SETTLED | ESCALATED" }
      - { name: statutory_amount_cents, type: integer, source: computed, description: "Capped statutory settlement figure computed at claim creation from the match" }
      - { name: settlement_floor_cents, type: integer, source: computed, description: "round_half_up(statutory_amount_cents * NEGOTIATED_FLOOR_PCT); minimum acceptable NEGOTIATED amount" }
      - { name: settlement_amount_cents, type: integer, source: system, description: "Agreed amount recorded at settlement; null before SETTLED" }
      - { name: settlement_basis, type: enum, source: system, description: "STATUTORY | NEGOTIATED; null before SETTLED" }
      - { name: settlement_collected, type: boolean, source: system, default: false, description: "True when the settlement payment was received at settlement time" }
      - { name: composer_share_cents, type: integer, source: computed, description: "round_half_up(settlement_amount_cents * ComposerAgreement.sync_fee_share_pct / 100); null before SETTLED" }
      - { name: notice_channel, type: string, source: system, description: "Channel the takedown notice was sent through; null before NOTICED" }
      - { name: dispute_note, type: string, source: system, description: "Counter-notice text; null unless the claim entered DISPUTED" }
      - { name: escalation_note, type: string, source: system, description: "Litigation referral note; null unless status = ESCALATED" }
      - { name: noticed_at, type: datetime, source: system, description: "Logical-clock instant of NOTICED; null before" }
      - { name: settled_at, type: datetime, source: system, description: "Logical-clock instant of SETTLED; null before" }

  - name: RoyaltyStatement
    parent: Composer
    common_fields: true
    fields:
      - { name: composer_id, type: string, source: input, description: "FK -> Composer.id; statement payee" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive first day of the statement period (date at 00:00:00Z)" }
      - { name: period_end, type: datetime, source: input, description: "Inclusive last day of the statement period (date at 00:00:00Z); the sweep window ends at period_end + 23:59:59.999" }
      - { name: basis, type: enum, source: input, description: "ACCRUAL (sweep by accrual_recognized_at) | CASH (sweep by cash_recognized_at)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Lifecycle state", constraints: "DRAFT | FINALIZED | PAID" }
      - { name: gross_cents, type: integer, source: computed, description: "Sum of swept RoyaltyLedgerEntry.amount_cents under the selected basis" }
      - { name: recouped_cents, type: integer, source: computed, description: "min(gross_cents, Composer.outstanding_advance_cents) at creation" }
      - { name: withholding_cents, type: integer, source: computed, description: "round_half_up((gross_cents - recouped_cents) * Composer.tax_withholding_pct)" }
      - { name: net_payable_cents, type: integer, source: computed, description: "gross_cents - recouped_cents - withholding_cents" }
      - { name: line_count, type: integer, source: computed, description: "Count of RoyaltyLedgerEntry rows swept into this statement, excluding the ADVANCE_RECOUP entry it creates" }
      - { name: payout_status, type: enum, source: computed, description: "NO_ACTIVITY when gross_cents = 0; HELD_BELOW_MINIMUM when net_payable_cents < MIN_PAYOUT_CENTS; PAYABLE otherwise", constraints: "PAYABLE | HELD_BELOW_MINIMUM | NO_ACTIVITY" }
      - { name: finalized_by_user_id, type: string, source: system, description: "X-User-ID that finalized; null while DRAFT" }
      - { name: paid_by_user_id, type: string, source: system, description: "X-User-ID that paid; MUST differ from finalized_by_user_id" }
      - { name: payment_reference, type: string, source: system, description: "Remittance reference recorded at payment; null before PAID" }
      - { name: finalized_at, type: datetime, source: system, description: "Logical-clock instant of finalization; null while DRAFT" }
      - { name: paid_at, type: datetime, source: system, description: "Logical-clock instant of payment; null before PAID" }

  - name: RoyaltyLedgerEntry
    parent: Composer
    common_fields: false
    comment: "Append-only royalty ledger. Immutable except for statement_id, which is stamped once when a statement sweeps the entry."
    fields:
      - { name: composer_id, type: string, source: input, description: "FK -> Composer.id; ledger owner" }
      - { name: statement_id, type: string, source: system, description: "FK -> RoyaltyStatement.id; null while unswept, stamped exactly once when a statement includes the entry" }
      - { name: source_type, type: enum, source: input, description: "Economic origin of the entry", constraints: "SYNC_FEE | SYNC_FEE_REVERSAL | PERFORMANCE | PERFORMANCE_REVERSAL | BLANKET_POOL | SETTLEMENT | ADVANCE | ADVANCE_RECOUP | ADJUSTMENT" }
      - { name: source_ref_id, type: string, source: system, description: "Polymorphic origin id discriminated by source_type: License.id for SYNC_FEE and SYNC_FEE_REVERSAL, CueSheet.id for PERFORMANCE and PERFORMANCE_REVERSAL, UsageReport.id for BLANKET_POOL, InfringementClaim.id for SETTLEMENT, ComposerAgreement.id for ADVANCE, RoyaltyStatement.id for ADVANCE_RECOUP, null for ADJUSTMENT" }
      - { name: amount_cents, type: integer, source: input, description: "Signed amount; negative for ADVANCE, SYNC_FEE_REVERSAL and PERFORMANCE_REVERSAL, positive for every other source_type" }
      - { name: accrual_recognized_at, type: datetime, source: system, description: "Logical-clock instant the obligation was recognized (issuance, registration, acceptance, settlement)" }
      - { name: cash_recognized_at, type: datetime, source: system, description: "Logical-clock instant the underlying money was collected; null while uncollected" }
      - { name: memo, type: string, source: input, description: "Free-text ledger memo" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: ComposerAgreement
    field: status
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: PENDING_SIGNATURE
        trigger: "POST /music-library/composer-agreements/{agreement_id}/submit-for-signature"
        preconditions:
          - "status = DRAFT"
        side_effects:
          - "no ledger or catalog effect"
      - from: PENDING_SIGNATURE
        to: ACTIVE
        trigger: "POST /music-library/composer-agreements/{agreement_id}/sign"
        preconditions:
          - "status = PENDING_SIGNATURE"
          - "X-User-ID equals composer_id (role Composer) else ERR_COMPOSER_IDENTITY_MISMATCH"
        side_effects:
          - "sets signed_at to the current logical clock"
          - "when advance_cents > 0: appends one RoyaltyLedgerEntry {composer_id, source_type: ADVANCE, source_ref_id: this agreement id, amount_cents: -advance_cents, accrual_recognized_at: clock, cash_recognized_at: clock, memo: 'SIGNING_ADVANCE'} which raises Composer.outstanding_advance_cents by advance_cents"
          - "when agreement_type = WORK_FOR_HIRE and buyout_fee_cents > 0: appends one RoyaltyLedgerEntry {source_type: ADJUSTMENT, amount_cents: buyout_fee_cents, memo: 'WORK_FOR_HIRE_BUYOUT'} which raises Composer.accrued_unpaid_cents"
      - from: ACTIVE
        to: AMENDMENT_PENDING
        trigger: "POST /music-library/composer-agreements/{agreement_id}/amendments"
        preconditions:
          - "status = ACTIVE"
          - "amendment_round < 3 else ERR_AMENDMENT_LIMIT_REACHED"
          - "proposed_writer_share_pct + proposed_publisher_share_pct = 100 else ERR_SHARE_SPLIT_NOT_100"
        side_effects:
          - "copies the proposal into pending_writer_share_pct, pending_publisher_share_pct, pending_sync_fee_share_pct, pending_holdback_days; effective share fields are untouched while AMENDMENT_PENDING"
      - from: AMENDMENT_PENDING
        to: ACTIVE
        trigger: "POST /music-library/composer-agreements/{agreement_id}/amendment-decision (decision = ACCEPT | REJECT)"
        preconditions:
          - "status = AMENDMENT_PENDING"
          - "X-User-ID equals composer_id (role Composer) else ERR_COMPOSER_IDENTITY_MISMATCH"
        side_effects:
          - "decision = ACCEPT: copies each pending_* value into the matching effective field, increments amendment_round by 1, then clears all pending_* to null"
          - "decision = REJECT: clears all pending_* to null and leaves amendment_round and every effective field unchanged"
          - "either decision returns the entity to ACTIVE, so the cycle ACTIVE → AMENDMENT_PENDING → ACTIVE may repeat until amendment_round reaches 3"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /music-library/composer-agreements/{agreement_id}/terminate"
        preconditions:
          - "status = ACTIVE"
        side_effects:
          - "sets terminated_at to the current logical clock"
          - "CASCADE step 2 — because the agreement is TERMINATED: every Composition WHERE agreement_id = this.id AND availability_status IN {AVAILABLE, RESTRICTED} moves to availability_status = WITHDRAWN, processed in created_at ASC order"
          - "CASCADE step 3 — because those Compositions are WITHDRAWN: every SyncRequest WHERE composition_id references one of them AND status IN {SUBMITTED, UNDER_REVIEW, QUOTED, REVISION_REQUESTED} moves to status = DECLINED with decline_reason = 'CATALOG_WITHDRAWN', processed in created_at ASC order"
          - "CASCADE step 4 — because those SyncRequests left {QUOTED, ACCEPTED, EDIT_IN_PROGRESS}: each affected Licensee.reserved_spend_cents and Licensee.credit_available_cents are recomputed and the Licensee.version increments once per affected licensee"
          - "License rows already in ISSUED or ACTIVE are NOT revoked by termination and keep their term and fee"
      - from: AMENDMENT_PENDING
        to: TERMINATED
        trigger: "POST /music-library/composer-agreements/{agreement_id}/terminate"
        preconditions:
          - "status = AMENDMENT_PENDING"
        side_effects:
          - "clears all pending_* to null, then applies the same CASCADE steps 2–4 as the ACTIVE → TERMINATED transition"

  - entity: Composition
    field: catalog_status
    initial_state: INGESTED
    terminal_states: [RETIRED]
    shape: linear
    comment: "Catalog axis. Independent of availability_status: a RETIRED work may still be AVAILABLE-flagged history, and a CATALOGED work may be WITHDRAWN."
    transitions:
      - from: INGESTED
        to: CATALOGED
        trigger: "POST /music-library/compositions/{composition_id}/catalog"
        preconditions:
          - "catalog_status = INGESTED"
          - "ComposerAgreement referenced by agreement_id has status = ACTIVE else ERR_AGREEMENT_NOT_ACTIVE"
          - "mood_tags has at least 1 member AND instrumentation has at least 1 member else ERR_METADATA_INCOMPLETE"
        side_effects:
          - "the work becomes eligible for GET /music-library/compositions/search and for SyncRequest creation"
      - from: INGESTED
        to: RETIRED
        trigger: "POST /music-library/compositions/{composition_id}/retire"
        preconditions:
          - "catalog_status IN {INGESTED, CATALOGED}"
          - "active_license_count = 0 else ERR_COMPOSITION_HAS_ACTIVE_LICENSES"
        side_effects:
          - "sets availability_status = WITHDRAWN on the same entity (the two axes are set independently but retirement always withdraws)"
      - from: CATALOGED
        to: RETIRED
        trigger: "POST /music-library/compositions/{composition_id}/retire"
        preconditions:
          - "catalog_status IN {INGESTED, CATALOGED}"
          - "active_license_count = 0 else ERR_COMPOSITION_HAS_ACTIVE_LICENSES"
        side_effects:
          - "sets availability_status = WITHDRAWN"
          - "the work disappears from GET /music-library/compositions/search results"

  - entity: Composition
    field: availability_status
    initial_state: AVAILABLE
    terminal_states: [WITHDRAWN]
    shape: cyclic
    comment: "Rights axis, driven by infringement claims and agreement termination; loops AVAILABLE → RESTRICTED → AVAILABLE."
    transitions:
      - from: AVAILABLE
        to: RESTRICTED
        trigger: "POST /music-library/infringement-claims/{claim_id}/notice"
        preconditions:
          - "availability_status = AVAILABLE"
          - "the claim's composition_id references this composition"
        side_effects:
          - "RESTRICTED works keep appearing in search but their weighted facet score is multiplied by CatalogSearchProfile.restricted_availability_factor"
          - "RESTRICTED works may still be licensed NON-exclusively; exclusive_requested issuance is refused with ERR_ACTIVE_CLAIM_BLOCKS_LICENSE"
      - from: RESTRICTED
        to: AVAILABLE
        trigger: "POST /music-library/infringement-claims/{claim_id}/settle or POST /music-library/infringement-claims/{claim_id}/escalate"
        preconditions:
          - "availability_status = RESTRICTED"
          - "after the claim transition, Composition.open_claim_count = 0 (no other claim on this work is in NOTICED or DISPUTED)"
        side_effects:
          - "search scoring returns to the unmultiplied weighted facet score"
      - from: AVAILABLE
        to: WITHDRAWN
        trigger: "POST /music-library/composer-agreements/{agreement_id}/terminate (cascade step 2) or POST /music-library/compositions/{composition_id}/retire"
        preconditions:
          - "availability_status IN {AVAILABLE, RESTRICTED}"
        side_effects:
          - "excluded from search, from SyncRequest creation and from cue-sheet crediting"
      - from: RESTRICTED
        to: WITHDRAWN
        trigger: "POST /music-library/composer-agreements/{agreement_id}/terminate (cascade step 2) or POST /music-library/compositions/{composition_id}/retire"
        preconditions:
          - "availability_status IN {AVAILABLE, RESTRICTED}"
        side_effects:
          - "excluded from search, from SyncRequest creation and from cue-sheet crediting"

  - entity: SyncRequest
    field: status
    initial_state: SUBMITTED
    terminal_states: [DELIVERED, DECLINED]
    shape: branching
    comment: "Cyclic on QUOTED → REVISION_REQUESTED → QUOTED (max 3 rounds) and branching on ACCEPTED → {EDIT_IN_PROGRESS, DELIVERED}."
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /music-library/sync-requests/{sync_request_id}/review"
        preconditions:
          - "status = SUBMITTED"
        side_effects: ["none"]
      - from: UNDER_REVIEW
        to: QUOTED
        trigger: "POST /music-library/sync-requests/{sync_request_id}/quote"
        preconditions:
          - "status IN {UNDER_REVIEW, REVISION_REQUESTED}"
          - "Composition.catalog_status = CATALOGED AND Composition.availability_status IN {AVAILABLE, RESTRICTED} else ERR_COMPOSITION_NOT_LICENSABLE"
          - "requested_term_months within [LicenseTier.min_term_months, LicenseTier.max_term_months] else ERR_TERM_OUTSIDE_TIER_RANGE"
        side_effects:
          - "computes quoted_fee_cents with the PROVISIONAL variant of license_fee_quote, plus quoted_spend_basis_cents and quoted_discount_pct"
          - "sets quote_expires_at = current logical clock + quote_valid_days days (default 14)"
          - "raises Licensee.reserved_spend_cents by quoted_fee_cents and lowers Licensee.credit_available_cents by the same amount"
      - from: REVISION_REQUESTED
        to: QUOTED
        trigger: "POST /music-library/sync-requests/{sync_request_id}/quote"
        preconditions:
          - "status IN {UNDER_REVIEW, REVISION_REQUESTED}"
        side_effects:
          - "recomputes quoted_fee_cents from the revised term / scale / exclusivity, replacing the previous reservation on the Licensee (old quoted_fee_cents removed, new one added)"
      - from: QUOTED
        to: REVISION_REQUESTED
        trigger: "POST /music-library/sync-requests/{sync_request_id}/request-revision"
        preconditions:
          - "status = QUOTED"
          - "revision_round < 3 else ERR_REVISION_LIMIT_REACHED"
          - "X-User-ID equals licensee_id (role Licensee) else ERR_LICENSEE_MISMATCH"
        side_effects:
          - "increments revision_round by 1"
          - "applies any supplied revised_term_months, revised_distribution_scale, revised_exclusive_requested to the request"
          - "clears quoted_fee_cents, quoted_spend_basis_cents, quoted_discount_pct and quote_expires_at to null and releases the Licensee reservation"
      - from: QUOTED
        to: ACCEPTED
        trigger: "POST /music-library/sync-requests/{sync_request_id}/accept"
        preconditions:
          - "status = QUOTED"
          - "X-User-ID equals licensee_id (role Licensee) else ERR_LICENSEE_MISMATCH"
          - "current logical clock <= quote_expires_at else ERR_QUOTE_EXPIRED"
        side_effects:
          - "the reservation stays on the Licensee until a License is issued from this request"
      - from: ACCEPTED
        to: EDIT_IN_PROGRESS
        trigger: "POST /music-library/sync-requests/{sync_request_id}/start-edit"
        preconditions:
          - "status = ACCEPTED"
          - "custom_edit_requested = true OR stems_requested = true OR alternate_lengths_sec has at least 1 member else ERR_NO_EDIT_WORK_REQUESTED"
        side_effects: ["none"]
      - from: ACCEPTED
        to: DELIVERED
        trigger: "POST /music-library/sync-requests/{sync_request_id}/deliver"
        preconditions:
          - "status IN {ACCEPTED, EDIT_IN_PROGRESS}"
          - "custom_edit_requested = false AND stems_requested = false AND alternate_lengths_sec is empty when arriving from ACCEPTED else ERR_EDIT_PASS_REQUIRED"
          - "license_id is not null (a License must have been issued) else ERR_LICENSE_NOT_ISSUED"
          - "delivered_asset_count >= 1 else ERR_VALIDATION"
        side_effects:
          - "records delivered_asset_count"
      - from: EDIT_IN_PROGRESS
        to: DELIVERED
        trigger: "POST /music-library/sync-requests/{sync_request_id}/deliver"
        preconditions:
          - "status IN {ACCEPTED, EDIT_IN_PROGRESS}"
          - "license_id is not null else ERR_LICENSE_NOT_ISSUED"
          - "delivered_asset_count >= 1 + (1 when stems_requested else 0) + count(alternate_lengths_sec) else ERR_DELIVERABLE_COUNT_SHORT"
        side_effects:
          - "records delivered_asset_count; the Licensee reservation was already released at License issuance, so no credit figure moves here"
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /music-library/sync-requests/{sync_request_id}/decline or agreement-termination cascade step 3"
        preconditions:
          - "status IN {SUBMITTED, UNDER_REVIEW, QUOTED, REVISION_REQUESTED}"
        side_effects:
          - "records decline_reason and releases any Licensee reservation"
      - from: UNDER_REVIEW
        to: DECLINED
        trigger: "POST /music-library/sync-requests/{sync_request_id}/decline or agreement-termination cascade step 3"
        preconditions:
          - "status IN {SUBMITTED, UNDER_REVIEW, QUOTED, REVISION_REQUESTED}"
        side_effects:
          - "records decline_reason and releases any Licensee reservation"
      - from: QUOTED
        to: DECLINED
        trigger: "POST /music-library/sync-requests/{sync_request_id}/decline or agreement-termination cascade step 3"
        preconditions:
          - "status IN {SUBMITTED, UNDER_REVIEW, QUOTED, REVISION_REQUESTED}"
        side_effects:
          - "records decline_reason, lowers Licensee.reserved_spend_cents by quoted_fee_cents and raises Licensee.credit_available_cents by the same amount"
      - from: REVISION_REQUESTED
        to: DECLINED
        trigger: "POST /music-library/sync-requests/{sync_request_id}/decline or agreement-termination cascade step 3"
        preconditions:
          - "status IN {SUBMITTED, UNDER_REVIEW, QUOTED, REVISION_REQUESTED}"
        side_effects:
          - "records decline_reason"

  - entity: License
    field: status
    initial_state: ISSUED
    terminal_states: [EXPIRED, REVOKED]
    shape: linear
    transitions:
      - from: ISSUED
        to: ACTIVE
        trigger: "POST /music-library/licenses/{license_id}/activate"
        preconditions:
          - "status = ISSUED"
          - "current logical clock date >= term_start else ERR_TERM_NOT_STARTED"
        side_effects:
          - "no change to Licensee.committed_spend_cents (ISSUED already counts toward it)"
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc (to_iso8601 date > term_end)"
        preconditions:
          - "status IN {ISSUED, ACTIVE}"
          - "current logical clock date > term_end"
        side_effects:
          - "lowers Licensee.committed_spend_cents by final_fee_cents and raises Licensee.credit_available_cents by the same amount"
          - "removes the work's exclusive block once no other exclusive License in {ISSUED, ACTIVE} covers it, so Composition.exclusive_block_until is recomputed"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc (to_iso8601 date > term_end)"
        preconditions:
          - "status IN {ISSUED, ACTIVE}"
          - "current logical clock date > term_end"
        side_effects:
          - "lowers Licensee.committed_spend_cents by final_fee_cents and recomputes Composition.exclusive_block_until and Composition.active_license_count"
      - from: ISSUED
        to: REVOKED
        trigger: "POST /music-library/licenses/{license_id}/revoke"
        preconditions:
          - "status IN {ISSUED, ACTIVE}"
        side_effects:
          - "records revoke_reason"
          - "appends one RoyaltyLedgerEntry {source_type: SYNC_FEE_REVERSAL, source_ref_id: this license id, amount_cents: -composer_sync_share_cents, accrual_recognized_at: clock, cash_recognized_at: clock when the original SYNC_FEE entry had cash_recognized_at set else null} so Composer.accrued_unpaid_cents returns to its pre-issuance value"
          - "lowers Licensee.committed_spend_cents by final_fee_cents and recomputes Composition.active_license_count and Composition.exclusive_block_until"
          - "the reversal entry is appended even when the original SYNC_FEE entry has already been swept into a FINALIZED or PAID statement; swept entries are never mutated"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /music-library/licenses/{license_id}/revoke"
        preconditions:
          - "status IN {ISSUED, ACTIVE}"
        side_effects:
          - "identical to the ISSUED → REVOKED side effects"

  - entity: BlanketAgreement
    field: coverage_status
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED]
    shape: linear
    comment: "Coverage axis. Independent of reporting_status: an ACTIVE agreement can be DELINQUENT, and an EXPIRED agreement keeps whatever reporting_status it had."
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /music-library/blanket-agreements/{blanket_agreement_id}/activate"
        preconditions:
          - "coverage_status = DRAFT"
          - "current logical clock date < coverage_end else ERR_COVERAGE_WINDOW_PASSED"
        side_effects:
          - "BLANKET-mode License issuance becomes possible while reporting_status = COMPLIANT"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc (to_iso8601 date >= coverage_end)"
        preconditions:
          - "coverage_status = ACTIVE"
          - "current logical clock date >= coverage_end (the interval is half-open)"
        side_effects:
          - "BLANKET-mode License issuance is refused with ERR_BLANKET_NOT_ACTIVE"
          - "already-issued BLANKET licenses are untouched"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /music-library/blanket-agreements/{blanket_agreement_id}/terminate"
        preconditions:
          - "coverage_status IN {DRAFT, ACTIVE}"
        side_effects:
          - "every UsageReport WHERE blanket_agreement_id = this.id AND status = DUE moves to REJECTED with rejection_reason = 'BLANKET_TERMINATED', processed in created_at ASC order"
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /music-library/blanket-agreements/{blanket_agreement_id}/terminate"
        preconditions:
          - "coverage_status IN {DRAFT, ACTIVE}"
        side_effects:
          - "no reports exist to reject when the agreement never activated"

  - entity: BlanketAgreement
    field: reporting_status
    initial_state: COMPLIANT
    terminal_states: []
    shape: cyclic
    comment: "Reporting axis, re-evaluated on every clock advance; loops COMPLIANT → DELINQUENT → COMPLIANT."
    transitions:
      - from: COMPLIANT
        to: DELINQUENT
        trigger: "POST /_clock/set_current_utc"
        preconditions:
          - "coverage_status = ACTIVE"
          - "at least one cadence period P derived from coverage_start satisfies: current logical clock > P.period_end + REPORT_GRACE_DAYS days AND no UsageReport for this agreement with period_start = P.period_start has status IN {SUBMITTED, ACCEPTED}"
        side_effects:
          - "sets delinquent_since to the current logical clock"
          - "BLANKET-mode License issuance is refused with ERR_BLANKET_NOT_ACTIVE while DELINQUENT"
      - from: DELINQUENT
        to: COMPLIANT
        trigger: "POST /music-library/usage-reports/{usage_report_id}/submit"
        preconditions:
          - "every cadence period P whose period_end + REPORT_GRACE_DAYS days is before the current logical clock now has a UsageReport with status IN {SUBMITTED, ACCEPTED}"
        side_effects:
          - "clears delinquent_since to null"

  - entity: UsageReport
    field: status
    initial_state: DUE
    terminal_states: [ACCEPTED]
    shape: cyclic
    comment: "REJECTED → SUBMITTED loop is unbounded; ACCEPTED is terminal."
    transitions:
      - from: DUE
        to: SUBMITTED
        trigger: "POST /music-library/usage-reports/{usage_report_id}/submit"
        preconditions:
          - "status IN {DUE, REJECTED}"
          - "X-User-ID equals BlanketAgreement.licensee_id (role Licensee) else ERR_LICENSEE_MISMATCH"
          - "at least one CueSheet has usage_report_id = this.id else ERR_REPORT_HAS_NO_CUE_SHEETS"
        side_effects:
          - "sets submitted_at to the current logical clock"
          - "recomputes BlanketAgreement.reporting_status (may move DELINQUENT → COMPLIANT)"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /music-library/usage-reports/{usage_report_id}/submit"
        preconditions:
          - "status IN {DUE, REJECTED}"
        side_effects:
          - "increments resubmission_count by 1, sets submitted_at, clears rejection_reason to null"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /music-library/usage-reports/{usage_report_id}/reject"
        preconditions:
          - "status = SUBMITTED"
        side_effects:
          - "records rejection_reason; no pool is computed and no ledger entry is appended"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /music-library/usage-reports/{usage_report_id}/accept"
        preconditions:
          - "status = SUBMITTED"
          - "BlanketAgreement.coverage_status IN {ACTIVE, EXPIRED} else ERR_BLANKET_NOT_ACTIVE"
        side_effects:
          - "CASCADE step 1: sets status = ACCEPTED and accepted_at, and freezes reported_minutes_total and reported_credits_total from the attached CueSheet rows whose status IN {REGISTERED, ACCEPTED_BY_SOCIETY}"
          - "CASCADE step 2 — because this report is now ACCEPTED: BlanketAgreement.reported_minutes_ytd is recomputed over ACCEPTED reports"
          - "CASCADE step 3 — because reported_minutes_ytd changed: BlanketAgreement.overage_minutes and overage_cents are recomputed with the blanket_overage calculation"
          - "CASCADE step 4 — because overage_cents changed: this report's pool_cents, pool_admin_fee_cents, pool_distributable_cents and pool_allocations are computed with the blanket_pool_distribution calculation, which folds the overage increment produced in step 3 into the pool"
          - "CASCADE step 5 — because pool_allocations exist: one BLANKET_POOL RoyaltyLedgerEntry is appended per allocation for the composition's composer with amount_cents = round_half_up(allocation_cents * ComposerAgreement.writer_share_pct / 100), source_ref_id = this report id, accrual_recognized_at = clock and cash_recognized_at = clock, which raises each Composer.accrued_unpaid_cents; entries are appended in pool_allocations order"

  - entity: CueSheet
    field: status
    initial_state: COLLECTED
    terminal_states: []
    shape: cyclic
    comment: "REJECTED_BY_SOCIETY → REGISTERED loop is unbounded; performance credits are added on registration and reversed on society rejection."
    transitions:
      - from: COLLECTED
        to: REGISTERED
        trigger: "POST /music-library/cue-sheets/{cue_sheet_id}/register"
        preconditions:
          - "status IN {COLLECTED, REJECTED_BY_SOCIETY}"
          - "total_credits > 0 else ERR_CUE_SHEET_HAS_NO_CREDITS"
          - "every cues[].composition_id references a Composition whose composer has pro_affiliation != NONE else ERR_COMPOSER_NOT_AFFILIATED"
        side_effects:
          - "records society_reference and registered_at, increments registration_round by 1"
          - "raises Composition.lifetime_performance_credits for every work on the sheet"
          - "appends one PERFORMANCE RoyaltyLedgerEntry per credited composer with amount_cents = round_half_up(performance_royalty_cents * ComposerAgreement.writer_share_pct / 100), accrual_recognized_at = clock and cash_recognized_at = null (society money is not yet collected)"
      - from: REJECTED_BY_SOCIETY
        to: REGISTERED
        trigger: "POST /music-library/cue-sheets/{cue_sheet_id}/register"
        preconditions:
          - "status IN {COLLECTED, REJECTED_BY_SOCIETY}"
        side_effects:
          - "identical to COLLECTED → REGISTERED, with registration_round incremented again"
      - from: REGISTERED
        to: ACCEPTED_BY_SOCIETY
        trigger: "POST /music-library/cue-sheets/{cue_sheet_id}/society-decision (decision = ACCEPT)"
        preconditions:
          - "status = REGISTERED"
        side_effects:
          - "stamps cash_recognized_at = current logical clock on every PERFORMANCE RoyaltyLedgerEntry whose source_ref_id = this sheet id and whose cash_recognized_at is null, which is the only mutation ever applied to a ledger entry other than statement_id"
      - from: REGISTERED
        to: REJECTED_BY_SOCIETY
        trigger: "POST /music-library/cue-sheets/{cue_sheet_id}/society-decision (decision = REJECT)"
        preconditions:
          - "status = REGISTERED"
          - "rejection_reason is supplied else ERR_VALIDATION"
        side_effects:
          - "appends one PERFORMANCE_REVERSAL RoyaltyLedgerEntry per previously credited composer with amount_cents = -1 * the amount of the PERFORMANCE entry it compensates"
          - "the sheet leaves {REGISTERED, ACCEPTED_BY_SOCIETY}, so Composition.lifetime_performance_credits for every work on the sheet returns to its pre-registration value"

  - entity: InfringementClaim
    field: status
    initial_state: DETECTED
    terminal_states: [SETTLED, ESCALATED]
    shape: branching
    transitions:
      - from: DETECTED
        to: NOTICED
        trigger: "POST /music-library/infringement-claims/{claim_id}/notice"
        preconditions:
          - "status = DETECTED"
          - "FingerprintMatch.confidence_pct >= NOTICE_CONFIDENCE_MIN_PCT else ERR_CONFIDENCE_BELOW_NOTICE_THRESHOLD"
        side_effects:
          - "records notice_channel and noticed_at"
          - "moves Composition.availability_status from AVAILABLE to RESTRICTED"
      - from: NOTICED
        to: DISPUTED
        trigger: "POST /music-library/infringement-claims/{claim_id}/dispute"
        preconditions:
          - "status = NOTICED"
        side_effects:
          - "records dispute_note; the work stays RESTRICTED"
      - from: NOTICED
        to: SETTLED
        trigger: "POST /music-library/infringement-claims/{claim_id}/settle"
        preconditions:
          - "status IN {NOTICED, DISPUTED}"
          - "settlement_basis = STATUTORY, or settlement_basis = NEGOTIATED with negotiated_amount_cents >= settlement_floor_cents else ERR_SETTLEMENT_BELOW_FLOOR"
        side_effects:
          - "records settlement_amount_cents, settlement_basis, settlement_collected and settled_at, and computes composer_share_cents"
          - "appends one SETTLEMENT RoyaltyLedgerEntry with amount_cents = composer_share_cents, accrual_recognized_at = clock and cash_recognized_at = clock when payment_received = true else null"
          - "returns Composition.availability_status from RESTRICTED to AVAILABLE when open_claim_count reaches 0"
      - from: DISPUTED
        to: SETTLED
        trigger: "POST /music-library/infringement-claims/{claim_id}/settle"
        preconditions:
          - "status IN {NOTICED, DISPUTED}"
        side_effects:
          - "identical to NOTICED → SETTLED"
      - from: DISPUTED
        to: ESCALATED
        trigger: "POST /music-library/infringement-claims/{claim_id}/escalate"
        preconditions:
          - "status = DISPUTED"
        side_effects:
          - "records escalation_note; no ledger entry is appended"
          - "returns Composition.availability_status from RESTRICTED to AVAILABLE when open_claim_count reaches 0"

  - entity: RoyaltyStatement
    field: status
    initial_state: DRAFT
    terminal_states: [PAID]
    shape: linear
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /music-library/royalty-statements/{statement_id}/finalize"
        preconditions:
          - "status = DRAFT"
          - "payout_status != NO_ACTIVITY else ERR_STATEMENT_NO_ACTIVITY"
        side_effects:
          - "records finalized_by_user_id from X-User-ID and finalized_at"
          - "the swept RoyaltyLedgerEntry rows keep statement_id = this.id and can never be swept again"
      - from: FINALIZED
        to: PAID
        trigger: "POST /music-library/royalty-statements/{statement_id}/pay"
        preconditions:
          - "status = FINALIZED"
          - "payout_status = PAYABLE else ERR_STATEMENT_NOT_PAYABLE"
          - "X-User-ID differs from finalized_by_user_id else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "records paid_by_user_id, payment_reference and paid_at"
          - "raises Composer.lifetime_paid_cents by net_payable_cents"

# =============================================================================
# §1.2.1 Concurrency Rules (optimistic concurrency control only)
# =============================================================================
concurrency_rules:
  - name: license_issuance_guards_composition_rights
    parent_entity: Composition
    occ_field: expected_composition_version
    write_endpoint: "POST /music-library/licenses"
    error_id: ERR_COMPOSITION_VERSION_CONFLICT
    status_code: 412
    description: >
      Issuing a License reads the work's rights picture (exclusive_block_until, availability_status,
      active_license_count) and then writes a new License, so the caller MUST pass
      expected_composition_version. The request is refused with 412 when that value differs from the
      Composition's current version. A caller that read the composition, then observed an
      intervening exclusive issuance on the same work, holds a stale version and is refused;
      re-reading the composition and retrying with the fresh version succeeds only if the rights
      picture still permits the license. Every successful issuance increments Composition.version.

  - name: statement_generation_guards_composer_ledger
    parent_entity: Composer
    occ_field: expected_composer_version
    write_endpoint: "POST /music-library/royalty-statements"
    error_id: ERR_COMPOSER_VERSION_CONFLICT
    status_code: 412
    description: >
      Creating a RoyaltyStatement sweeps every unswept RoyaltyLedgerEntry in the period and stamps
      statement_id on each, so the caller MUST pass expected_composer_version. The request is
      refused with 412 when that value differs from the Composer's current version, which changes
      whenever the composer's ledger or advance position moves. This prevents a statement built
      from a ledger snapshot the caller no longer holds. Every successful statement creation
      increments Composer.version.

# =============================================================================
# §1.3 Calculation Rules
# =============================================================================
calculations:

  - name: license_fee_quote
    entity: SyncRequest / License
    output_fields: [SyncRequest.quoted_fee_cents, SyncRequest.quoted_spend_basis_cents, SyncRequest.quoted_discount_pct, License.final_fee_cents, License.final_spend_basis_cents, License.final_discount_pct]
    algorithm_type: tiered_pricing
    trigger: "POST /music-library/sync-requests/{sync_request_id}/quote (PROVISIONAL) and POST /music-library/licenses (FINAL)"
    formula: |
      STEP 1 (single rounding of the multiplicative core, factors applied in this exact order):
        core = LicenseTier.base_rate_cents
               * MEDIA_FACTOR[media_type]
               * SCALE_FACTOR[distribution_scale]
               * TERM_FACTOR(term_months)
               * (EXCLUSIVITY_FACTOR when exclusive_requested = true else 1)
               * (RUSH_FACTOR when rush_requested = true else 1)
        core_cents = round_half_up(core)            # rounded exactly once, before any addon is added
      STEP 2 (integer addons, never rounded):
        addons_cents = (CUSTOM_EDIT_FEE_CENTS when custom_edit_requested)
                     + (STEMS_FEE_CENTS when stems_requested)
                     + count(alternate_lengths_sec) * ALT_LENGTH_FEE_CENTS
        pre_discount_cents = core_cents + addons_cents
      STEP 3 (volume discount selected from the licensee's spend basis):
        spend_basis_cents = Licensee.committed_spend_cents (variant-specific snapshot) + pre_discount_cents
        discount_pct      = DISCOUNT_TIERS lookup on spend_basis_cents
        fee_cents         = pre_discount_cents - round_half_up(pre_discount_cents * discount_pct / 100)
      TERM_FACTOR(term_months): term_months <= 3 -> 0.70; 4–12 -> 1.00; 13–36 -> 1.45; 37–120 -> 1.90
    constants:
      MEDIA_FACTOR: { BROADCAST_TV: 1.30, ONLINE_AD: 1.75, FILM: 2.20, CORPORATE: 0.85, GAME: 1.40 }
      SCALE_FACTOR: { LOCAL: 0.60, NATIONAL: 1.00, WORLDWIDE: 1.90 }
      EXCLUSIVITY_FACTOR: 1.65
      RUSH_FACTOR: 1.20
      CUSTOM_EDIT_FEE_CENTS: 45000
      STEMS_FEE_CENTS: 30000
      ALT_LENGTH_FEE_CENTS: 12000
      DISCOUNT_TIERS: "spend_basis_cents < 500000 -> 0.00 | 500000–1499999 -> 5.00 | 1500000–2999999 -> 10.00 | >= 3000000 -> 15.00"
    variants:
      - name: PROVISIONAL
        used_when: "the quote is produced by POST /music-library/sync-requests/{sync_request_id}/quote"
        differs_by: "spend_basis_cents adds Licensee.committed_spend_cents observed at the quote instant and IGNORES Licensee.reserved_spend_cents entirely"
      - name: FINAL
        used_when: "the License is created by POST /music-library/licenses"
        differs_by: "spend_basis_cents adds Licensee.committed_spend_cents observed at the issuance instant, which includes every License issued to this licensee after the quote was produced; the recomputed discount tier can differ from quoted_discount_pct and License.final_fee_cents then differs from SyncRequest.quoted_fee_cents"
    reconciliation: "License.final_fee_cents (not quoted_fee_cents) is what enters Licensee.committed_spend_cents and what the composer's SYNC_FEE ledger entry is derived from; the quote figure is never back-patched."
    precision: "cents, integers only; round_half_up at STEP 1 and at the discount subtraction; discount_pct carried at 2 decimals"
    determinism: "factors are applied in the documented order and the core is rounded exactly once; no floating-point accumulation of the addons"
    worked_example: |
      base 600000, FILM, NATIONAL, 24 months, non-exclusive, no rush, no addons:
        core = 600000 * 2.20 * 1.00 * 1.45 = 1914000 -> pre_discount_cents = 1914000
        PROVISIONAL with committed 0        -> basis 1914000 -> 10.00% -> 1914000 - 191400 = 1722600
        FINAL with committed 1105562        -> basis 3019562 -> 15.00% -> 1914000 - 287100 = 1626900

  - name: cue_performance_credits
    entity: CueSheet
    output_fields: [CueSheet.cue_credit_breakdown, CueSheet.total_credits, CueSheet.credits_by_composition]
    algorithm_type: weighted_scoring
    trigger: "POST /music-library/cue-sheets (computed at creation from cues[])"
    formula: |
      for each cue in cues[] in array order:
        credits_cue = round_half_up( (cue.duration_sec / 30) * USAGE_WEIGHT[cue.usage_type] * MARKET_WEIGHT[market_tier], 2 )
      total_credits            = sum of the PER-CUE ROUNDED credits (never round_half_up of the unrounded sum)
      credits_by_composition[c] = sum of the per-cue rounded credits whose composition_id = c
    constants:
      USAGE_WEIGHT: { THEME: 1.00, FEATURE: 0.65, BACKGROUND: 0.35, LOGO: 0.10 }
      MARKET_WEIGHT: { NETWORK: 1.00, CABLE: 0.65, LOCAL: 0.40, DIGITAL: 0.25 }
    precision: "credits carried at exactly 2 decimals; rounding happens once PER CUE, before any summation"
    determinism: "cues are evaluated in cues[] array order; the breakdown array mirrors that order"
    worked_example: |
      market_tier NETWORK, three cues on the same work at 45 seconds each:
        THEME      45/30 * 1.00 * 1.00 = 1.5    -> 1.50
        FEATURE    45/30 * 0.65 * 1.00 = 0.975  -> 0.98
        BACKGROUND 45/30 * 0.35 * 1.00 = 0.525  -> 0.53
      total_credits = 1.50 + 0.98 + 0.53 = 3.01  (round_half_up of the unrounded sum 3.000 would give 3.00)

  - name: performance_royalty_cents
    entity: RoyaltyLedgerEntry
    output_fields: [RoyaltyLedgerEntry.amount_cents for source_type PERFORMANCE]
    algorithm_type: aggregation
    trigger: "POST /music-library/cue-sheets/{cue_sheet_id}/register"
    formula: |
      per composer on the sheet (two-step rounding, in this order):
        composer_credits = sum over that composer's works of CueSheet.credits_by_composition[work]   # 2 decimals
        gross_cents      = round_half_up(composer_credits * CREDIT_VALUE_CENTS)                      # step 1
        writer_cents     = round_half_up(gross_cents * ComposerAgreement.writer_share_pct / 100)      # step 2
      One PERFORMANCE entry is appended per composer with amount_cents = writer_cents.
      The publisher remainder (gross_cents - writer_cents) is retained by the library and never ledgered.
    constants:
      CREDIT_VALUE_CENTS: 1250
    input_set: "only works whose governing ComposerAgreement.status = ACTIVE and whose composer.pro_affiliation != NONE are credited"
    precision: "two roundings: credits->cents, then cents->writer share; collapsing them into one multiplication is incorrect"
    determinism: "composers are processed in ascending Composer.created_at order so entry order is stable"
    worked_example: |
      composer_credits 3.01, writer_share_pct 50.00:
        gross_cents  = round_half_up(3.01 * 1250) = round_half_up(3762.5) = 3763
        writer_cents = round_half_up(3763 * 0.50) = round_half_up(1881.5) = 1882
      (a single-step round_half_up(3.01 * 1250 * 0.50) = round_half_up(1881.25) = 1881 is wrong)

  - name: blanket_overage
    entity: BlanketAgreement
    output_fields: [BlanketAgreement.overage_minutes, BlanketAgreement.overage_cents]
    algorithm_type: threshold
    trigger: "POST /music-library/usage-reports/{usage_report_id}/accept (cascade step 3)"
    formula: |
      reported_minutes_ytd = sum(UsageReport.reported_minutes_total) over reports of this agreement with status = ACCEPTED
      overage_minutes      = max(0, reported_minutes_ytd - usage_cap_minutes)
      overage_cents        = overage_minutes * OVERAGE_RATE_CENTS_PER_MINUTE
      overage_increment_cents (consumed by blanket_pool_distribution) = overage_cents after this acceptance - overage_cents before it
      Each report's reported_minutes_total = ceil(sum of attached CueSheet.total_seconds / 60), so partial minutes round UP per report and never carry between reports.
      Reporting-compliance companion (drives the BlanketAgreement.reporting_status axis of §1.2, not the money):
        period P is overdue at instant T when T > P.period_end + REPORT_GRACE_DAYS days AND no UsageReport
        for this agreement with period_start = P.period_start has status IN {SUBMITTED, ACCEPTED}
    constants:
      OVERAGE_RATE_CENTS_PER_MINUTE: 450
      REPORT_GRACE_DAYS: 15
    precision: "whole minutes; ceiling is applied per report, not on the year-to-date second total"
    determinism: "reported_minutes_ytd depends only on ACCEPTED reports, so acceptance order does not change the final total, but overage_increment_cents (and therefore the pool of each report) does depend on acceptance order"
    worked_example: |
      usage_cap_minutes 3; report 1 has 165 attached seconds -> ceil(165/60) = 3 minutes -> ytd 3, overage_minutes 0 (at the cap, not over it)
      report 2 has 60 seconds -> 1 minute -> ytd 4 -> overage_minutes 1 -> overage_cents 450 -> overage_increment_cents 450

  - name: blanket_pool_distribution
    entity: UsageReport
    output_fields: [UsageReport.pool_cents, UsageReport.pool_admin_fee_cents, UsageReport.pool_distributable_cents, UsageReport.pool_allocations]
    algorithm_type: waterfall_allocation
    trigger: "POST /music-library/usage-reports/{usage_report_id}/accept (cascade step 4)"
    formula: |
      cadence_fraction     = 1/12 for MONTHLY, 1/4 for QUARTERLY (exact rational, no intermediate rounding)
      pool_cents           = round_half_up(BlanketAgreement.annual_fee_cents * pool_share_pct / 100 * cadence_fraction)
                             + round_half_up(overage_increment_cents * pool_share_pct / 100)
      pool_admin_fee_cents = round_half_up(pool_cents * POOL_ADMIN_PCT / 100)
      pool_distributable_cents = pool_cents - pool_admin_fee_cents
      eligible works = distinct cues[].composition_id over CueSheet rows attached to this report whose
                       status IN {REGISTERED, ACCEPTED_BY_SOCIETY} and whose governing
                       ComposerAgreement.blanket_opt_in = true
      credits_i      = summed credits_by_composition[work] across those sheets
      total_credits  = sum(credits_i)
      floor_i        = floor(pool_distributable_cents * credits_i / total_credits)
      remainder      = pool_distributable_cents - sum(floor_i)
      the first `remainder` works, ordered by credits_i DESC then Composition.created_at ASC then id ASC,
      each receive exactly 1 additional cent
      allocation_cents_i = floor_i + (1 when the work is in that head slice else 0)
      INVARIANT: sum(allocation_cents_i) = pool_distributable_cents exactly, for every input
      When the eligible set is empty: pool_allocations = [], pool_cents and pool_admin_fee_cents are still
      computed, and pool_distributable_cents is retained by the library with no ledger entries appended.
    constants:
      POOL_ADMIN_PCT: 15.00
    precision: "integer cents; floor for the proportional share and largest-remainder for the residue, so no cent is created or destroyed"
    determinism: "credits DESC, then created_at ASC, then id ASC — never entity id order alone and never insertion order"
    worked_example: |
      annual_fee 4800000, pool_share 25.00, MONTHLY -> pool_cents = 100000; admin 15000; distributable 85000
      works A (3.01 credits) and B (0.65 credits), total 3.66
        floor_A = floor(85000 * 3.01 / 3.66) = 69904 ; floor_B = floor(85000 * 0.65 / 3.66) = 15095
        remainder = 85000 - 84999 = 1 -> A (higher credits) -> A 69905, B 15095, sum 85000

  - name: statement_settlement
    entity: RoyaltyStatement
    output_fields: [RoyaltyStatement.gross_cents, RoyaltyStatement.recouped_cents, RoyaltyStatement.withholding_cents, RoyaltyStatement.net_payable_cents, RoyaltyStatement.line_count, RoyaltyStatement.payout_status]
    algorithm_type: aggregation
    trigger: "POST /music-library/royalty-statements"
    formula: |
      window = [period_start 00:00:00.000Z, period_end 23:59:59.999Z]  (both endpoints inclusive)
      sweep set = RoyaltyLedgerEntry WHERE composer_id = input composer_id
                    AND statement_id IS NULL
                    AND source_type NOT IN {ADVANCE, ADVANCE_RECOUP}
                    AND (variant-specific timestamp) within window
      gross_cents      = sum(amount_cents) over the sweep set   (reversal entries reduce it)
      line_count       = count of the sweep set
      recouped_cents   = min(max(gross_cents, 0), Composer.outstanding_advance_cents)
      withholding_cents = round_half_up((gross_cents - recouped_cents) * Composer.tax_withholding_pct)
      net_payable_cents = gross_cents - recouped_cents - withholding_cents
      payout_status     = NO_ACTIVITY when gross_cents = 0
                          HELD_BELOW_MINIMUM when net_payable_cents < MIN_PAYOUT_CENTS
                          PAYABLE otherwise
      Creation side effects: every swept entry gets statement_id stamped, and when recouped_cents > 0 one
      ADVANCE_RECOUP entry (amount_cents = +recouped_cents, statement_id = this statement) is appended so
      Composer.outstanding_advance_cents falls by exactly recouped_cents.
    constants:
      MIN_PAYOUT_CENTS: 2500
    variants:
      - name: ACCRUAL
        used_when: "basis = ACCRUAL"
        differs_by: "the window is tested against accrual_recognized_at, so obligations recognized in the period are included even when no money has been collected (for example a PERFORMANCE entry from a cue sheet registered but not yet accepted by the society)"
      - name: CASH
        used_when: "basis = CASH"
        differs_by: "the window is tested against cash_recognized_at and entries whose cash_recognized_at IS NULL are excluded entirely, so uncollected obligations are deferred to a later period"
    reconciliation: "an entry excluded by CASH in one period is swept by a later CASH statement once cash_recognized_at is stamped; because statement_id is stamped exactly once, no entry can be paid twice under either basis"
    precision: "withholding rounded half-up exactly once, on the POST-recoupment base"
    determinism: "sweep order is created_at ASC; gross is independent of that order but line_count and the stamped set are pinned by it"
    worked_example: |
      entries SYNC_FEE 156000 (cash stamped in period), PERFORMANCE 1882 (cash null), SETTLEMENT 90000 (cash stamped),
      outstanding advance 150000, tax_withholding_pct 0.30:
        ACCRUAL gross 247882 -> recoup 150000 -> withholding round_half_up(29364.6) = 29365 -> net 68517 -> PAYABLE
        CASH    gross 246000 -> recoup 150000 -> withholding 28800                        -> net 67200 -> PAYABLE

  - name: search_relevance_score
    entity: Composition
    output_fields: [Composition.relevance_score]
    algorithm_type: weighted_scoring
    trigger: "GET /music-library/compositions/search"
    formula: |
      eligible pool = Composition WHERE catalog_status = CATALOGED AND availability_status IN {AVAILABLE, RESTRICTED}
      present facets = the query parameters actually supplied among {mood_tags, genre, instrumentation, tempo_bpm}
        match_mood  = |query.mood_tags        INTERSECT composition.mood_tags|      / |query.mood_tags|
        match_genre = 1 when query.genre = composition.genre else 0
        match_instr = |query.instrumentation  INTERSECT composition.instrumentation| / |query.instrumentation|
        match_tempo = max(0, 1 - |composition.tempo_bpm - query.tempo_bpm| / CatalogSearchProfile.tempo_tolerance_bpm)
      weighted = 100 * SUM(weight_f * match_f over present facets) / SUM(weight_f over present facets)
                 # absent facets are dropped and the remaining weights are renormalized
      availability_factor = CatalogSearchProfile.restricted_availability_factor when availability_status = RESTRICTED else 1.00
      recency_factor      = RECENCY_BOOST when (current logical clock - created_at) <= RECENCY_BOOST_DAYS days else 1.00
      relevance_score = round_half_up(weighted * availability_factor * recency_factor, 2)   # rounded exactly once
      ranking: relevance_score DESC, then created_at ASC, then id ASC
      When no facet parameter is supplied every eligible work scores 0.00 and the ranking degenerates to created_at ASC.
      When the eligible pool is empty the response is an empty array with total_count 0.
    constants:
      RECENCY_BOOST: 1.10
      RECENCY_BOOST_DAYS: 90
    precision: "2 decimals, rounded once at the very end; the score may exceed 100.00 when the recency boost applies"
    determinism: "facet weights come from the singleton CatalogSearchProfile at request time, so a profile change re-scores every subsequent search"
    worked_example: |
      profile 40/25/20/15, tolerance 20; query mood [EPIC, DARK], genre CINEMATIC, instrumentation [STRINGS, BRASS], tempo 120
        work A (moods EPIC/DARK/TENSE, CINEMATIC, STRINGS/BRASS/PERCUSSION, 130 bpm, AVAILABLE, created 10 days ago):
          weighted = 100 * (40*1 + 25*1 + 20*1 + 15*0.5) / 100 = 92.50 -> * 1.00 * 1.10 = 101.75
        work B (moods CALM, JAZZ, PIANO, 118 bpm, AVAILABLE, created 200 days ago):
          weighted = 100 * (40*0 + 25*0 + 20*0 + 15*0.9) / 100 = 13.50 -> 13.50
        work C (identical facets to A but availability RESTRICTED, created 200 days ago): 92.50 * 0.60 = 55.50

  - name: infringement_statutory_amount
    entity: InfringementClaim
    output_fields: [InfringementClaim.statutory_amount_cents, InfringementClaim.settlement_floor_cents, InfringementClaim.composer_share_cents]
    algorithm_type: threshold
    trigger: "POST /music-library/infringement-claims (amounts) and POST /music-library/infringement-claims/{claim_id}/settle (composer share)"
    formula: |
      confidence_factor(confidence_pct): >= 95.0 -> 1.00 | 85.0–94.9 -> 0.75 | 70.0–84.9 -> 0.50 | < 70.0 -> claim creation refused
      statutory_amount_cents  = min(STATUTORY_CAP_CENTS,
                                    round_half_up(FingerprintMatch.matched_seconds
                                                  * PLATFORM_RATE_CENTS_PER_SEC[source_platform]
                                                  * confidence_factor))
      settlement_floor_cents  = round_half_up(statutory_amount_cents * NEGOTIATED_FLOOR_PCT / 100)
      settlement_amount_cents = statutory_amount_cents when settlement_basis = STATUTORY
                                negotiated_amount_cents when settlement_basis = NEGOTIATED (refused below settlement_floor_cents)
      composer_share_cents    = round_half_up(settlement_amount_cents * ComposerAgreement.sync_fee_share_pct / 100)
    constants:
      PLATFORM_RATE_CENTS_PER_SEC: { UGC_VIDEO: 1000, BROADCAST: 4500, THEATRICAL: 9000, PODCAST: 1500 }
      STATUTORY_CAP_CENTS: 15000000
      NEGOTIATED_FLOOR_PCT: 30.00
      CLAIM_CONFIDENCE_MIN_PCT: 70.0
      NOTICE_CONFIDENCE_MIN_PCT: 85.0
    precision: "integer cents; the cap is applied AFTER rounding, so a capped claim reports exactly STATUTORY_CAP_CENTS"
    determinism: "the confidence band is closed on its lower bound (85.0 belongs to the 0.75 band, 84.9 to the 0.50 band)"
    worked_example: |
      THEATRICAL, 400 matched seconds, confidence 99.0 -> factor 1.00 -> 3600000; floor = 1080000
      THEATRICAL, 2000 matched seconds, confidence 99.0 -> 18000000 -> capped to 15000000; floor = 4500000
      UGC_VIDEO, 120 matched seconds, confidence 85.0 -> factor 0.75 -> 90000 ; at 84.9 -> factor 0.50 -> 60000

  - name: licensee_credit_exposure
    entity: Licensee
    output_fields: [Licensee.committed_spend_cents, Licensee.reserved_spend_cents, Licensee.credit_available_cents]
    algorithm_type: aggregation
    trigger: "recomputed on every quote, revision, decline, issuance, revocation and expiry"
    formula: |
      committed_spend_cents = sum(License.final_fee_cents)      WHERE licensee_id = this.id AND status IN {ISSUED, ACTIVE}
      reserved_spend_cents  = sum(SyncRequest.quoted_fee_cents)  WHERE licensee_id = this.id
                                AND status IN {QUOTED, ACCEPTED, EDIT_IN_PROGRESS} AND license_id IS NULL
      credit_available_cents = credit_limit_cents - committed_spend_cents - reserved_spend_cents
      Gate at quote time    : committed + reserved + this quote's fee_cents <= credit_limit_cents (equality allowed)
      Gate at issuance time : committed + License.final_fee_cents           <= credit_limit_cents (equality allowed)
      A License issued from a SyncRequest moves the amount from reserved to committed in the same request, so the
      two figures never double-count the same deal.
    constants: {}
    precision: "integer cents"
    determinism: "both figures are pure aggregates over current entity states, so replaying the same events in any order yields the same numbers"
    worked_example: |
      credit_limit 490000; quote 1 fee 390000 -> reserved 390000, available 100000
      quote 2 fee 100000 -> reserved 490000, available 0 (accepted at exactly the limit)
      a further quote of any amount is refused with ERR_CREDIT_LIMIT_EXCEEDED

# =============================================================================
# §1.4 Validation Rules — evaluated in ascending `priority`; the FIRST violated
# rule determines the response. Every priority value is unique, so the expected
# error_id is fully determined even when many rules are violated at once.
# =============================================================================
validations:

  - { priority: 1,  name: schema_and_type_validation, category: schema, applies_to: "every write endpoint", condition: "a required field is absent, a field has the wrong JSON type, an enum value is outside its declared set, a numeric value is outside its declared range, or an array exceeds its member bounds", error_id: ERR_VALIDATION, status_code: 422 }
  - { priority: 2,  name: path_entity_exists, category: existence, applies_to: "every endpoint with a path parameter", condition: "the id in the path matches no row of the addressed entity", error_id: "ERR_<ENTITY>_NOT_FOUND", status_code: 404 }
  - { priority: 3,  name: body_reference_exists, category: existence, applies_to: "every write endpoint carrying a foreign key in the body", condition: "a body foreign key matches no row of the referenced entity (checked in the field order declared in §1.1, and for cues[] in array order)", error_id: "ERR_<ENTITY>_NOT_FOUND", status_code: 404 }
  - { priority: 4,  name: role_permitted, category: authorization, applies_to: "every endpoint", condition: "the X-User-Role header is absent or is not listed in the endpoint's roles", error_id: ERR_UNAUTHORIZED, status_code: 403 }
  - { priority: 5,  name: licensee_ownership, category: authorization, applies_to: "POST /music-library/sync-requests, /accept, /request-revision, POST /music-library/usage-reports, /submit, POST /music-library/cue-sheets", condition: "X-User-Role = Licensee and the target row's licensee (directly or through BlanketAgreement / License) is not X-User-ID", error_id: ERR_LICENSEE_MISMATCH, status_code: 403 }
  - { priority: 6,  name: composer_ownership, category: authorization, applies_to: "POST /music-library/composer-agreements/{agreement_id}/sign, /amendment-decision, GET /music-library/composers/{composer_id}/royalty-preview, GET /music-library/royalty-ledger-entries", condition: "X-User-Role = Composer and the addressed composer is not X-User-ID", error_id: ERR_COMPOSER_IDENTITY_MISMATCH, status_code: 403 }
  - { priority: 7,  name: segregation_of_duties_payment, category: authorization, applies_to: "POST /music-library/royalty-statements/{statement_id}/pay", condition: "X-User-ID equals RoyaltyStatement.finalized_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, status_code: 403 }
  - { priority: 8,  name: occ_composition_version, category: concurrency, applies_to: "POST /music-library/licenses", condition: "expected_composition_version differs from the referenced Composition.version", error_id: ERR_COMPOSITION_VERSION_CONFLICT, status_code: 412 }
  - { priority: 9,  name: occ_composer_version, category: concurrency, applies_to: "POST /music-library/royalty-statements", condition: "expected_composer_version differs from the referenced Composer.version", error_id: ERR_COMPOSER_VERSION_CONFLICT, status_code: 412 }
  - { priority: 10, name: target_state_precondition, category: state, applies_to: "every action endpoint in §1.2", condition: "the target row's state field is not in the transition's declared from-set", error_id: "ERR_<ENTITY>_STATE_INVALID", status_code: 409 }
  - { priority: 11, name: agreement_share_split_sums_100, category: business_rule, applies_to: "POST /music-library/composer-agreements, POST /music-library/composer-agreements/{agreement_id}/amendments", condition: "writer_share_pct + publisher_share_pct != 100.00 (proposed_* on amendments)", error_id: ERR_SHARE_SPLIT_NOT_100, status_code: 422 }
  - { priority: 12, name: work_for_hire_terms_consistent, category: business_rule, applies_to: "POST /music-library/composer-agreements", condition: "agreement_type = WORK_FOR_HIRE with sync_fee_share_pct != 0 or buyout_fee_cents = 0, or agreement_type = ROYALTY_SPLIT with buyout_fee_cents != 0", error_id: ERR_WORK_FOR_HIRE_TERMS_INVALID, status_code: 422 }
  - { priority: 13, name: governing_agreement_active, category: cross_entity, applies_to: "POST /music-library/compositions/{composition_id}/catalog, POST /music-library/sync-requests/{sync_request_id}/quote", condition: "the Composition's governing ComposerAgreement.status != ACTIVE", error_id: ERR_AGREEMENT_NOT_ACTIVE, status_code: 409 }
  - { priority: 14, name: composition_licensable, category: cross_entity, applies_to: "POST /music-library/sync-requests, POST /music-library/sync-requests/{sync_request_id}/quote, POST /music-library/licenses", condition: "Composition.catalog_status != CATALOGED or Composition.availability_status = WITHDRAWN", error_id: ERR_COMPOSITION_NOT_LICENSABLE, status_code: 409 }
  - { priority: 15, name: active_claim_blocks_exclusive, category: cross_entity, applies_to: "POST /music-library/licenses", condition: "the SyncRequest had exclusive_requested = true and the Composition has open_claim_count > 0 (a claim in NOTICED or DISPUTED); non-exclusive issuance on a RESTRICTED work is allowed", error_id: ERR_ACTIVE_CLAIM_BLOCKS_LICENSE, status_code: 409 }
  - { priority: 16, name: quote_freshness, category: temporal, applies_to: "POST /music-library/sync-requests/{sync_request_id}/accept, POST /music-library/licenses", condition: "the current logical clock is later than SyncRequest.quote_expires_at", error_id: ERR_QUOTE_EXPIRED, status_code: 409 }
  - { priority: 17, name: exclusivity_window_free, category: temporal, applies_to: "POST /music-library/licenses", condition: "Composition.exclusive_block_until is not null and the new License.term_start <= Composition.exclusive_block_until (the block day itself is still blocked)", error_id: ERR_EXCLUSIVE_WINDOW_CONFLICT, status_code: 409 }
  - { priority: 18, name: license_term_within_agreement, category: temporal, applies_to: "POST /music-library/licenses", condition: "license_mode = BLANKET and term_start is outside [BlanketAgreement.coverage_start, BlanketAgreement.coverage_end)", error_id: ERR_TERM_OUTSIDE_COVERAGE, status_code: 422 }
  - { priority: 19, name: blanket_available_for_issuance, category: cross_entity, applies_to: "POST /music-library/licenses (license_mode = BLANKET), POST /music-library/usage-reports/{usage_report_id}/accept", condition: "BlanketAgreement.coverage_status != ACTIVE, or reporting_status = DELINQUENT at issuance time", error_id: ERR_BLANKET_NOT_ACTIVE, status_code: 409 }
  - { priority: 20, name: blanket_coverage_no_overlap, category: temporal, applies_to: "POST /music-library/blanket-agreements", condition: "another BlanketAgreement for the same licensee_id with coverage_status IN {DRAFT, ACTIVE} has a coverage interval that overlaps [coverage_start, coverage_end); intervals are half-open so touching endpoints do not overlap", error_id: ERR_BLANKET_COVERAGE_OVERLAP, status_code: 409 }
  - { priority: 21, name: coverage_dates_ordered, category: schema, applies_to: "POST /music-library/blanket-agreements", condition: "coverage_end <= coverage_start", error_id: ERR_COVERAGE_DATES_INVALID, status_code: 422 }
  - { priority: 22, name: report_period_matches_cadence, category: temporal, applies_to: "POST /music-library/usage-reports", condition: "period_start is not a cadence boundary derived from coverage_start, or period_end != period_start + cadence - 1 day, or the period lies outside the coverage interval", error_id: ERR_REPORT_PERIOD_INVALID, status_code: 422 }
  - { priority: 23, name: report_period_not_duplicated, category: aggregate, applies_to: "POST /music-library/usage-reports", condition: "another UsageReport for the same blanket_agreement_id has the same period_start and status IN {DUE, SUBMITTED, ACCEPTED}", error_id: ERR_REPORT_PERIOD_DUPLICATE, status_code: 409 }
  - { priority: 24, name: cue_sheet_single_parent, category: schema, applies_to: "POST /music-library/cue-sheets", condition: "license_id and usage_report_id are both supplied or both absent (exactly one is required)", error_id: ERR_CUE_SHEET_PARENT_INVALID, status_code: 422 }
  - { priority: 25, name: cue_composition_covered, category: cross_entity, applies_to: "POST /music-library/cue-sheets", condition: "for a license_id parent, a cues[] element cites a composition other than License.composition_id; for a usage_report_id parent, a cues[] element cites a composition whose availability_status = WITHDRAWN or whose governing agreement has blanket_opt_in = false; elements are checked in array order", error_id: ERR_CUE_COMPOSITION_NOT_COVERED, status_code: 409 }
  - { priority: 26, name: tier_mode_compatible, category: business_rule, applies_to: "POST /music-library/licenses", condition: "license_mode = PER_USE and LicenseTier.per_use_eligible = false, or license_mode = BLANKET and LicenseTier.blanket_eligible = false", error_id: ERR_TIER_INCOMPATIBLE, status_code: 422 }
  - { priority: 27, name: tier_scale_allowed, category: business_rule, applies_to: "POST /music-library/sync-requests, POST /music-library/sync-requests/{sync_request_id}/request-revision", condition: "distribution_scale is not a member of LicenseTier.allowed_scales, or media_type != LicenseTier.media_type", error_id: ERR_SCALE_NOT_ALLOWED_FOR_TIER, status_code: 422 }
  - { priority: 28, name: term_within_tier_range, category: business_rule, applies_to: "POST /music-library/sync-requests/{sync_request_id}/quote", condition: "requested_term_months is outside [LicenseTier.min_term_months, LicenseTier.max_term_months]", error_id: ERR_TERM_OUTSIDE_TIER_RANGE, status_code: 422 }
  - { priority: 29, name: credit_limit_not_exceeded, category: aggregate, applies_to: "POST /music-library/sync-requests/{sync_request_id}/quote, POST /music-library/licenses", condition: "at quote time committed_spend_cents + reserved_spend_cents + this quote's fee_cents > credit_limit_cents; at issuance time committed_spend_cents + final_fee_cents > credit_limit_cents (equality is allowed in both cases)", error_id: ERR_CREDIT_LIMIT_EXCEEDED, status_code: 409 }
  - { priority: 30, name: revision_cap, category: aggregate, applies_to: "POST /music-library/sync-requests/{sync_request_id}/request-revision", condition: "revision_round is already 3", error_id: ERR_REVISION_LIMIT_REACHED, status_code: 409 }
  - { priority: 31, name: amendment_cap, category: aggregate, applies_to: "POST /music-library/composer-agreements/{agreement_id}/amendments", condition: "amendment_round is already 3", error_id: ERR_AMENDMENT_LIMIT_REACHED, status_code: 409 }
  - { priority: 32, name: edit_work_requested, category: business_rule, applies_to: "POST /music-library/sync-requests/{sync_request_id}/start-edit", condition: "custom_edit_requested = false and stems_requested = false and alternate_lengths_sec is empty", error_id: ERR_NO_EDIT_WORK_REQUESTED, status_code: 409 }
  - { priority: 33, name: edit_pass_required_before_delivery, category: business_rule, applies_to: "POST /music-library/sync-requests/{sync_request_id}/deliver", condition: "status = ACCEPTED while custom_edit_requested = true or stems_requested = true or alternate_lengths_sec is non-empty (the edit pass was skipped)", error_id: ERR_EDIT_PASS_REQUIRED, status_code: 409 }
  - { priority: 34, name: license_issued_before_delivery, category: cross_entity, applies_to: "POST /music-library/sync-requests/{sync_request_id}/deliver", condition: "SyncRequest.license_id is null", error_id: ERR_LICENSE_NOT_ISSUED, status_code: 409 }
  - { priority: 35, name: deliverable_count_complete, category: business_rule, applies_to: "POST /music-library/sync-requests/{sync_request_id}/deliver", condition: "delivered_asset_count < 1 + (1 when stems_requested) + count(alternate_lengths_sec)", error_id: ERR_DELIVERABLE_COUNT_SHORT, status_code: 422 }
  - { priority: 36, name: metadata_complete_for_cataloging, category: business_rule, applies_to: "POST /music-library/compositions/{composition_id}/catalog", condition: "mood_tags is empty or instrumentation is empty", error_id: ERR_METADATA_INCOMPLETE, status_code: 409 }
  - { priority: 37, name: retire_requires_no_active_licenses, category: aggregate, applies_to: "POST /music-library/compositions/{composition_id}/retire", condition: "active_license_count > 0", error_id: ERR_COMPOSITION_HAS_ACTIVE_LICENSES, status_code: 409 }
  - { priority: 38, name: cue_sheet_has_credits, category: business_rule, applies_to: "POST /music-library/cue-sheets/{cue_sheet_id}/register", condition: "total_credits = 0.00", error_id: ERR_CUE_SHEET_HAS_NO_CREDITS, status_code: 409 }
  - { priority: 39, name: composer_affiliated_for_registration, category: cross_entity, applies_to: "POST /music-library/cue-sheets/{cue_sheet_id}/register", condition: "any cited composition's composer has pro_affiliation = NONE", error_id: ERR_COMPOSER_NOT_AFFILIATED, status_code: 409 }
  - { priority: 40, name: report_has_cue_sheets, category: aggregate, applies_to: "POST /music-library/usage-reports/{usage_report_id}/submit", condition: "no CueSheet has usage_report_id = this report", error_id: ERR_REPORT_HAS_NO_CUE_SHEETS, status_code: 409 }
  - { priority: 41, name: claim_confidence_minimum, category: business_rule, applies_to: "POST /music-library/infringement-claims", condition: "FingerprintMatch.confidence_pct < 70.0", error_id: ERR_CONFIDENCE_BELOW_CLAIM_THRESHOLD, status_code: 422 }
  - { priority: 42, name: one_claim_per_match, category: aggregate, applies_to: "POST /music-library/infringement-claims", condition: "another InfringementClaim already cites this fingerprint_match_id", error_id: ERR_MATCH_ALREADY_CLAIMED, status_code: 409 }
  - { priority: 43, name: notice_confidence_minimum, category: business_rule, applies_to: "POST /music-library/infringement-claims/{claim_id}/notice", condition: "FingerprintMatch.confidence_pct < 85.0", error_id: ERR_CONFIDENCE_BELOW_NOTICE_THRESHOLD, status_code: 409 }
  - { priority: 44, name: settlement_floor, category: business_rule, applies_to: "POST /music-library/infringement-claims/{claim_id}/settle", condition: "settlement_basis = NEGOTIATED and negotiated_amount_cents < settlement_floor_cents (equality is allowed), or settlement_basis = NEGOTIATED with negotiated_amount_cents absent", error_id: ERR_SETTLEMENT_BELOW_FLOOR, status_code: 422 }
  - { priority: 45, name: statement_period_no_overlap, category: temporal, applies_to: "POST /music-library/royalty-statements", condition: "another RoyaltyStatement for the same composer_id has a period that overlaps [period_start, period_end] (both inclusive)", error_id: ERR_STATEMENT_PERIOD_OVERLAP, status_code: 409 }
  - { priority: 46, name: statement_has_activity, category: business_rule, applies_to: "POST /music-library/royalty-statements/{statement_id}/finalize", condition: "payout_status = NO_ACTIVITY", error_id: ERR_STATEMENT_NO_ACTIVITY, status_code: 409 }
  - { priority: 47, name: statement_payable, category: business_rule, applies_to: "POST /music-library/royalty-statements/{statement_id}/pay", condition: "payout_status != PAYABLE (HELD_BELOW_MINIMUM or NO_ACTIVITY)", error_id: ERR_STATEMENT_NOT_PAYABLE, status_code: 409 }
  - { priority: 48, name: search_profile_weights_sum_100, category: business_rule, applies_to: "PUT /music-library/search-profile", condition: "weight_mood + weight_genre + weight_instrumentation + weight_tempo != 100", error_id: ERR_WEIGHTS_NOT_100, status_code: 422 }
  - { priority: 49, name: coverage_window_not_passed, category: temporal, applies_to: "POST /music-library/blanket-agreements/{blanket_agreement_id}/activate", condition: "the current logical clock date >= coverage_end", error_id: ERR_COVERAGE_WINDOW_PASSED, status_code: 409 }
  - { priority: 50, name: license_term_started, category: temporal, applies_to: "POST /music-library/licenses/{license_id}/activate", condition: "the current logical clock date < term_start", error_id: ERR_TERM_NOT_STARTED, status_code: 409 }
  - { priority: 51, name: payment_not_over_collected, category: business_rule, applies_to: "POST /music-library/licenses/{license_id}/record-payment", condition: "collected_amount_cents + amount_cents > final_fee_cents, or amount_cents <= 0", error_id: ERR_PAYMENT_EXCEEDS_FEE, status_code: 422 }

# =============================================================================
# §1.5 API Endpoint Table
# Logical clock: every timestamp the service writes comes from a logical clock that
# starts at 2026-08-01T00:00:00Z and only moves when POST /_clock/set_current_utc is
# called. No endpoint reads the wall clock.
# =============================================================================
endpoints:

  # ---- test-driving clock (only endpoint outside the api_prefix) --------------
  - method: POST
    path: /_clock/set_current_utc
    roles: [CatalogAdmin, RightsManager, LicensingAgent, RoyaltyAccountant]
    input: [to_iso8601]
    output: "{ current_utc: string, expired_license_ids: array, expired_blanket_agreement_ids: array, delinquent_blanket_agreement_ids: array }"
    status_code: 200
    description: "Sets the logical clock. Time may only move forward; a to_iso8601 earlier than the current value is refused with ERR_CLOCK_REWIND (422)."
    side_effects:
      - "every License with status IN {ISSUED, ACTIVE} whose term_end is before the new date moves to EXPIRED, in created_at ASC order, releasing Licensee.committed_spend_cents"
      - "every BlanketAgreement with coverage_status = ACTIVE whose coverage_end is at or before the new date moves to EXPIRED"
      - "every BlanketAgreement with coverage_status = ACTIVE that has an unreported cadence period past its grace window moves reporting_status to DELINQUENT and records delinquent_since"

  # ---- Composer --------------------------------------------------------------
  - method: POST
    path: /music-library/composers
    roles: [CatalogAdmin, RightsManager]
    input: [display_name, "pro_affiliation?", "payee_country?", "tax_withholding_pct?"]
    output: Composer
    status_code: 201
    side_effects: ["creates the composer with accrued_unpaid_cents 0, outstanding_advance_cents 0, lifetime_paid_cents 0 and version 1"]

  - method: GET
    path: /music-library/composers/{composer_id}
    roles: [CatalogAdmin, RightsManager, LicensingAgent, RoyaltyAccountant, Composer]
    input: []
    output: Composer
    status_code: 200
    side_effects: []

  - method: GET
    path: /music-library/composer-agreements/{agreement_id}
    roles: [CatalogAdmin, RightsManager, RoyaltyAccountant, Composer]
    input: []
    output: ComposerAgreement
    status_code: 200
    side_effects: []

  - method: GET
    path: /music-library/composer-agreements
    roles: [CatalogAdmin, RightsManager, RoyaltyAccountant, Composer]
    input: ["composer_id?", "status?", "agreement_type?", "limit?", "offset?"]
    output: ComposerAgreement[]
    status_code: 200
    description: "Reverse lookup for ComposerAgreement.composer_id. Role Composer sees only its own rows."
    side_effects: []

  - method: GET
    path: /music-library/composers/{composer_id}/royalty-preview
    roles: [RoyaltyAccountant, Composer]
    input: [period_start, period_end, "basis?"]
    output: "{ basis: string, accrual_gross_cents: integer, cash_gross_cents: integer, gross_cents: integer, included_entry_count: integer, outstanding_advance_cents: integer, projected_recoup_cents: integer, projected_withholding_cents: integer, projected_net_cents: integer, projected_payout_status: string }"
    status_code: 200
    description: "Computed read that evaluates statement_settlement for the window WITHOUT creating a statement or stamping any entry. accrual_gross_cents and cash_gross_cents are always both returned so the two variants can be compared on identical data; gross_cents / projected_* follow the basis parameter (default ACCRUAL)."
    side_effects: ["none — no entity is written and Composer.version does not change"]

  # ---- ComposerAgreement -----------------------------------------------------
  - method: POST
    path: /music-library/composer-agreements
    roles: [RightsManager]
    input: [composer_id, agreement_type, writer_share_pct, publisher_share_pct, sync_fee_share_pct, "buyout_fee_cents?", exclusivity, "holdback_days?", "advance_cents?", "blanket_opt_in?"]
    output: ComposerAgreement
    status_code: 201
    side_effects: ["creates the agreement in DRAFT with amendment_round 0 and every pending_* field null"]

  - method: POST
    path: /music-library/composer-agreements/{agreement_id}/submit-for-signature
    roles: [RightsManager]
    input: []
    output: ComposerAgreement
    status_code: 200
    side_effects: ["DRAFT → PENDING_SIGNATURE"]

  - method: POST
    path: /music-library/composer-agreements/{agreement_id}/sign
    roles: [Composer]
    input: [signature_name]
    output: ComposerAgreement
    status_code: 200
    side_effects:
      - "PENDING_SIGNATURE → ACTIVE and records signed_at"
      - "appends the ADVANCE ledger entry when advance_cents > 0 and the WORK_FOR_HIRE_BUYOUT ADJUSTMENT entry when buyout_fee_cents > 0, which changes Composer.outstanding_advance_cents / accrued_unpaid_cents and increments Composer.version"

  - method: POST
    path: /music-library/composer-agreements/{agreement_id}/amendments
    roles: [RightsManager]
    input: [proposed_writer_share_pct, proposed_publisher_share_pct, proposed_sync_fee_share_pct, "proposed_holdback_days?"]
    output: ComposerAgreement
    status_code: 200
    side_effects: ["ACTIVE → AMENDMENT_PENDING and stores the proposal in the pending_* fields without touching the effective fields"]

  - method: POST
    path: /music-library/composer-agreements/{agreement_id}/amendment-decision
    roles: [Composer]
    input: [decision]
    output: ComposerAgreement
    status_code: 200
    description: "decision is ACCEPT or REJECT."
    side_effects:
      - "AMENDMENT_PENDING → ACTIVE"
      - "ACCEPT copies every pending_* value into its effective field and increments amendment_round; REJECT discards the proposal and leaves amendment_round unchanged; both clear pending_* to null"

  - method: POST
    path: /music-library/composer-agreements/{agreement_id}/terminate
    roles: [RightsManager]
    input: [reason]
    output: ComposerAgreement
    status_code: 200
    side_effects:
      - "status → TERMINATED, terminated_at recorded"
      - "cascade steps 2–4 of §1.2: governed Compositions → WITHDRAWN, their open SyncRequests → DECLINED with decline_reason CATALOG_WITHDRAWN, affected Licensee credit figures recomputed"

