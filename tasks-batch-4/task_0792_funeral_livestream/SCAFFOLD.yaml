# =============================================================================
# Funeral Live-Stream & Tribute Service — seed tables (SCAFFOLD.yaml)
# §1.0–§1.7 + preamble. Difficulty: Expert.
# =============================================================================

scenario: "Funeral Live-Stream & Tribute Service: service scheduling & venue/tech, stream setup & multi-camera/audio, guest-link & privacy/password, memorial page & guestbook/donation, recording/edit & delivery, tribute video & photo, vendor (funeral-home) account, on-call support"

domain_name: funeral-livestream
# Flat topology: every entity is a top-level collection linked by foreign keys,
# so api_prefix is the empty namespace and every collection root is "/<segment>".
api_prefix: ""

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: parallel   # ServiceOrder has broadcast × settlement axes; TributeVideo is cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate
  difficulty: Expert

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: FuneralHome
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Funeral home (vendor) display name" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email for the vendor account" }
      - { name: stream_credit_balance, type: integer, source: system, default: 0, description: "Prepaid live-stream credits. Seeded from initial_credits at create; +credit_amount on grant; -1 when an order is SCHEDULED; +1 when a SCHEDULED order is CANCELLED. Never negative." }
      - { name: donations_pledged_cents, type: integer, source: computed, description: "Read-only provisional total: sum of gross_amount_cents over Donations of this home whose status IN {PLEDGED, SETTLED}" }
      - { name: donations_net_cents, type: integer, source: computed, description: "Read-only settled total: sum of net_amount_cents over Donations of this home whose status == SETTLED" }

  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: home_id, type: string, source: input, description: "FK -> FuneralHome.id" }
      - { name: name, type: string, source: input, description: "Venue / chapel name" }
      - { name: capacity, type: integer, source: input, description: "In-person seating capacity (informational)" }
      - { name: turnaround_minutes, type: integer, source: input, description: "Cleanup/turnaround buffer in minutes applied on BOTH sides of every VenueBooking window when detecting venue time conflicts" }

  - name: Operator
    parent: null
    common_fields: true
    fields:
      - { name: home_id, type: string, source: input, description: "FK -> FuneralHome.id" }
      - { name: full_name, type: string, source: input, description: "Tech / on-call operator name" }
      - { name: skill, type: enum, source: input, description: "CAMERA | AUDIO | SUPPORT" }
      - { name: duty_status, type: enum, source: system, default: "OFF_DUTY", description: "OFF_DUTY | ON_DUTY; toggled via POST /operators/{id}/duty" }

  - name: ServiceOrder
    parent: null
    common_fields: true
    fields:
      - { name: home_id, type: string, source: input, description: "FK -> FuneralHome.id" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id" }
      - { name: decedent_name, type: string, source: input, description: "Name of the person the service memorializes" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned broadcast start (ISO 8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Planned broadcast end (ISO 8601 UTC); must be strictly after scheduled_start" }
      - { name: expected_viewers, type: integer, source: input, default: 0, description: "Estimated peak guest viewer count (informational)" }
      - { name: priority_support, type: boolean, source: input, default: false, description: "Whether on-call priority support surcharge applies to the final invoice" }
      - { name: camera_count, type: integer, source: input, default: 1, description: "Number of stream cameras, 1..4 inclusive", constraints: "1 <= camera_count <= 4" }
      - { name: audio_source, type: enum, source: input, default: "HOUSE_SYSTEM", description: "HOUSE_SYSTEM | EXTERNAL_MIXER | SINGLE_MIC" }
      - { name: stream_status, type: enum, source: system, default: "PENDING", description: "Tech readiness axis: PENDING | READY | FAILED. SET_STREAM_READY/SET_STREAM_FAILED transitions." }
      - { name: broadcast_status, type: enum, source: system, default: "DRAFT", description: "Broadcast axis (independent of settlement): DRAFT | SCHEDULED | LIVE | ENDED | CANCELLED" }
      - { name: settlement_status, type: enum, source: system, default: "UNBILLED", description: "Billing axis (independent of broadcast): UNBILLED | INVOICED | PAID | VOID" }
      - { name: actual_start, type: datetime, source: system, description: "Logical-clock instant stamped at GO_LIVE; null before" }
      - { name: actual_end, type: datetime, source: system, description: "Logical-clock instant stamped at END; null before" }
      - { name: estimated_cost_cents, type: integer, source: computed, description: "Read-only forward estimate computed at SCHEDULE from the SCHEDULED duration (see calculations.service_billing, estimated variant)" }
      - { name: final_invoice_cents, type: integer, source: computed, description: "Read-only actual invoice computed at INVOICE from the ACTUAL duration (see calculations.service_billing, final variant)" }
      - { name: recording_status, type: enum, source: system, default: "NONE", description: "NONE | RAW | EDITING | READY | DELIVERED. NONE->RAW auto at END." }
      - { name: recording_duration_minutes, type: integer, source: computed, description: "Read-only ceil((actual_end - actual_start)/60 seconds); 0 while actual_end is null" }
      - { name: delivery_email, type: string, source: input, description: "Recording delivery address; required to DELIVER_RECORDING" }
      - { name: privacy_mode, type: enum, source: input, default: "PASSWORD", description: "PUBLIC | PASSWORD | INVITE_ONLY" }
      - { name: access_password, type: string, source: input, description: "Plain guest-link password when privacy_mode == PASSWORD; null otherwise" }
      - { name: access_token, type: string, source: system, description: "Server-minted opaque guest-link token" }
      - { name: failed_access_count, type: integer, source: system, default: 0, description: "Count of wrong-password /access attempts; stops incrementing once access_locked" }
      - { name: access_locked, type: boolean, source: computed, description: "Read-only true once failed_access_count >= MAX_FAILED_ACCESS_ATTEMPTS (see calculations.access_lockout)" }
      - { name: memorial_status, type: enum, source: system, default: "DRAFT", description: "Memorial page axis: DRAFT | PUBLISHED | ARCHIVED" }
      - { name: headline, type: string, source: input, description: "Memorial page headline text" }
      - { name: donation_goal_cents, type: integer, source: input, default: 0, description: "Fundraising goal shown on the memorial page (informational)" }
      - { name: donations_net_cents, type: integer, source: computed, description: "Read-only: sum of net_amount_cents over this order's Donations whose status == SETTLED" }
      - { name: guestbook_entry_count, type: integer, source: computed, description: "Read-only count of this order's GuestbookEntries whose status == APPROVED" }

  - name: VenueBooking
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> ServiceOrder.id" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id" }
      - { name: home_id, type: string, source: system, description: "FK -> FuneralHome.id; copied from the order at create" }
      - { name: window_start, type: datetime, source: input, description: "Reservation start (ISO 8601 UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Reservation end (ISO 8601 UTC); must be strictly after window_start" }
      - { name: status, type: enum, source: system, default: "HELD", description: "HELD | CONFIRMED | RELEASED" }

  - name: CameraAssignment
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> ServiceOrder.id; the assignment covers the order's [scheduled_start, scheduled_end) window" }
      - { name: operator_id, type: string, source: input, description: "FK -> Operator.id" }
      - { name: home_id, type: string, source: system, description: "FK -> FuneralHome.id; copied from the order at create" }
      - { name: role, type: enum, source: input, description: "CAMERA | AUDIO | SUPPORT" }
      - { name: status, type: enum, source: system, default: "ASSIGNED", description: "ASSIGNED | RELEASED" }

  - name: GuestbookEntry
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> ServiceOrder.id" }
      - { name: author_name, type: string, source: input, description: "Guest display name" }
      - { name: message, type: string, source: input, description: "Condolence message body" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | APPROVED | HIDDEN" }

  - name: Donation
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> ServiceOrder.id" }
      - { name: home_id, type: string, source: system, description: "FK -> FuneralHome.id; copied from the order at create" }
      - { name: donor_name, type: string, source: input, description: "Donor display name" }
      - { name: gross_amount_cents, type: integer, source: input, description: "Pledged gross amount in cents; must be > 0" }
      - { name: fee_cents, type: integer, source: computed, description: "Read-only per-donation processing fee: round_half_up(gross_amount_cents * FEE_PCT) + FEE_FLAT_CENTS (see calculations.donation_ledger)" }
      - { name: net_amount_cents, type: integer, source: computed, description: "Read-only gross_amount_cents - fee_cents" }
      - { name: status, type: enum, source: system, default: "PLEDGED", description: "PLEDGED | SETTLED | REFUNDED" }

  - name: TributeVideo
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> ServiceOrder.id" }
      - { name: title, type: string, source: input, description: "Tribute video / photo-montage title" }
      - { name: photo_count, type: integer, source: input, description: "Number of photos in the montage" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | CHANGES_REQUESTED | APPROVED | PUBLISHED (cyclic review loop)" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Increments by 1 on each CHANGES_REQUESTED -> SUBMITTED resubmission" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- ServiceOrder: PARALLEL dimensions (broadcast_status × settlement_status)
  #      plus tech (stream_status), recording (recording_status) and memorial
  #      (memorial_status) sub-axes that evolve independently on the same row. ----
  - entity: ServiceOrder
    initial_state: "DRAFT"        # broadcast_status initial; settlement_status starts UNBILLED, stream PENDING, recording NONE, memorial DRAFT
    terminal_states: [CANCELLED]  # CANCELLED voids the row; ENDED+PAID is the successful resting state
    transitions:
      # -- broadcast axis --
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /service-orders/{id}/transitions {action: SCHEDULE}"
        actor: FuneralHome
        preconditions:
          - "broadcast_status == DRAFT (ERR_ORDER_NOT_DRAFT)"
          - "a VenueBooking of this order has status == CONFIRMED (ERR_VENUE_NOT_CONFIRMED)"
          - "stream_status == READY (ERR_STREAM_NOT_READY)"
          - "home.stream_credit_balance >= 1 (ERR_INSUFFICIENT_STREAM_CREDITS)"
        side_effects:
          - "home.stream_credit_balance -= 1"
          - "estimated_cost_cents = service_billing(estimated variant) over SCHEDULED duration"
      - from: SCHEDULED
        to: LIVE
        trigger: "POST /service-orders/{id}/transitions {action: GO_LIVE}"
        actor: FuneralHome
        preconditions:
          - "broadcast_status == SCHEDULED (ERR_ORDER_NOT_SCHEDULED)"
          - "stream_status == READY (ERR_STREAM_NOT_READY)"
        side_effects:
          - "actual_start = current logical-clock UTC instant"
      - from: LIVE
        to: ENDED
        trigger: "POST /service-orders/{id}/transitions {action: END}"
        actor: FuneralHome
        preconditions:
          - "broadcast_status == LIVE (ERR_ORDER_NOT_LIVE)"
        side_effects:
          - "actual_end = current logical-clock UTC instant"
          - "recording_status NONE -> RAW"
          - "recording_duration_minutes = ceil((actual_end - actual_start)/60s)"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /service-orders/{id}/transitions {action: CANCEL}"
        actor: FuneralHome
        preconditions:
          - "broadcast_status IN {DRAFT, SCHEDULED} (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "settlement_status -> VOID"
          - "cascade: every VenueBooking of this order in {HELD, CONFIRMED} -> RELEASED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /service-orders/{id}/transitions {action: CANCEL}"
        actor: FuneralHome
        preconditions:
          - "broadcast_status IN {DRAFT, SCHEDULED} (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "home.stream_credit_balance += 1 (refund the credit consumed at SCHEDULE)"
          - "settlement_status -> VOID"
          - "cascade: every VenueBooking of this order in {HELD, CONFIRMED} -> RELEASED (which itself cascades to CameraAssignments)"
      # -- settlement axis (independent of broadcast axis) --
      - from: UNBILLED
        to: INVOICED
        trigger: "POST /service-orders/{id}/transitions {action: INVOICE}"
        actor: FuneralHome
        preconditions:
          - "broadcast_status == ENDED (ERR_ORDER_NOT_ENDED)"
          - "settlement_status == UNBILLED (ERR_ORDER_NOT_UNBILLED)"
        side_effects:
          - "final_invoice_cents = service_billing(final variant) over ACTUAL duration"
      - from: INVOICED
        to: PAID
        trigger: "POST /service-orders/{id}/transitions {action: PAY}"
        actor: FuneralHome
        preconditions:
          - "settlement_status == INVOICED (ERR_ORDER_NOT_INVOICED)"
        side_effects: []
      # -- tech (stream_status) sub-axis --
      - from: PENDING
        to: READY
        trigger: "POST /service-orders/{id}/transitions {action: SET_STREAM_READY}"
        actor: Operator
        preconditions:
          - "stream_status IN {PENDING, FAILED} (ERR_STREAM_INVALID_STATE)"
        side_effects: []
      - from: READY
        to: FAILED
        trigger: "POST /service-orders/{id}/transitions {action: SET_STREAM_FAILED}"
        actor: Operator
        preconditions:
          - "stream_status IN {PENDING, READY} (ERR_STREAM_INVALID_STATE)"
        side_effects: []
      # -- recording sub-axis --
      - from: RAW
        to: EDITING
        trigger: "POST /service-orders/{id}/transitions {action: START_EDIT}"
        actor: FuneralHome
        preconditions:
          - "recording_status == RAW (ERR_RECORDING_INVALID_STATE)"
        side_effects: []
      - from: EDITING
        to: READY
        trigger: "POST /service-orders/{id}/transitions {action: MARK_RECORDING_READY}"
        actor: FuneralHome
        preconditions:
          - "recording_status == EDITING (ERR_RECORDING_INVALID_STATE)"
        side_effects: []
      - from: READY
        to: DELIVERED
        trigger: "POST /service-orders/{id}/transitions {action: DELIVER_RECORDING}"
        actor: FuneralHome
        preconditions:
          - "recording_status == READY (ERR_RECORDING_INVALID_STATE)"
          - "delivery_email is non-null (ERR_DELIVERY_EMAIL_MISSING)"
        side_effects: []
      # -- memorial sub-axis --
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /service-orders/{id}/transitions {action: PUBLISH_MEMORIAL}"
        actor: FuneralHome
        preconditions:
          - "memorial_status == DRAFT (ERR_MEMORIAL_INVALID_STATE)"
        side_effects: []
        note: "memorial axis; PUBLISHED gates guest donations and guestbook posts"
      - from: PUBLISHED
        to: ARCHIVED
        trigger: "POST /service-orders/{id}/transitions {action: ARCHIVE_MEMORIAL}"
        actor: FuneralHome
        preconditions:
          - "memorial_status == PUBLISHED (ERR_MEMORIAL_INVALID_STATE)"
        side_effects: []

  # ---- VenueBooking: linear with release; overlap-checked at create ----
  - entity: VenueBooking
    initial_state: "HELD"
    terminal_states: [RELEASED]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /venue-bookings/{id}/confirm"
        actor: FuneralHome
        preconditions:
          - "status == HELD (ERR_BOOKING_NOT_HELD)"
        side_effects: []
      - from: HELD
        to: RELEASED
        trigger: "system (cascade from ServiceOrder CANCEL)"
        actor: system
        preconditions: []
        side_effects:
          - "cascade: every CameraAssignment of the booking's order in status ASSIGNED -> RELEASED"
      - from: CONFIRMED
        to: RELEASED
        trigger: "system (cascade from ServiceOrder CANCEL)"
        actor: system
        preconditions: []
        side_effects:
          - "cascade: every CameraAssignment of the booking's order in status ASSIGNED -> RELEASED"

  # ---- CameraAssignment: assign/release; operator overlap-checked at create ----
  - entity: CameraAssignment
    initial_state: "ASSIGNED"
    terminal_states: [RELEASED]
    transitions:
      - from: ASSIGNED
        to: RELEASED
        trigger: "system (cascade from VenueBooking RELEASED)"
        actor: system
        preconditions: []
        side_effects: []

  # ---- Donation: pledge -> settle -> refund; ledger sync on order & home ----
  - entity: Donation
    initial_state: "PLEDGED"
    terminal_states: [REFUNDED]
    transitions:
      - from: PLEDGED
        to: SETTLED
        trigger: "POST /donations/{id}/transitions {action: SETTLE}"
        actor: PlatformAdmin
        preconditions:
          - "status == PLEDGED (ERR_DONATION_NOT_PLEDGED)"
        side_effects:
          - "fee_cents and net_amount_cents finalized (donation_ledger per-donation rounding)"
          - "cascade: order.donations_net_cents recomputed; that recompute cascades to home.donations_net_cents"
      - from: PLEDGED
        to: REFUNDED
        trigger: "POST /donations/{id}/transitions {action: REFUND}"
        actor: PlatformAdmin
        preconditions:
          - "status IN {PLEDGED, SETTLED} (ERR_DONATION_NOT_REFUNDABLE)"
        side_effects: []
      - from: SETTLED
        to: REFUNDED
        trigger: "POST /donations/{id}/transitions {action: REFUND}"
        actor: PlatformAdmin
        preconditions:
          - "status IN {PLEDGED, SETTLED} (ERR_DONATION_NOT_REFUNDABLE)"
        side_effects:
          - "compensating: order.donations_net_cents -= this donation's net_amount_cents; that recompute cascades to home.donations_net_cents (net conserved)"

  # ---- GuestbookEntry: moderation ----
  - entity: GuestbookEntry
    initial_state: "PENDING"
    terminal_states: [HIDDEN]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /guestbook-entries/{id}/moderation {decision: APPROVE}"
        actor: FuneralHome
        preconditions:
          - "status == PENDING (ERR_GUESTBOOK_INVALID_STATE)"
        side_effects:
          - "order.guestbook_entry_count recomputed (count of APPROVED)"
      - from: PENDING
        to: HIDDEN
        trigger: "POST /guestbook-entries/{id}/moderation {decision: HIDE}"
        actor: FuneralHome
        preconditions:
          - "status IN {PENDING, APPROVED} (ERR_GUESTBOOK_INVALID_STATE)"
        side_effects: []
      - from: APPROVED
        to: HIDDEN
        trigger: "POST /guestbook-entries/{id}/moderation {decision: HIDE}"
        actor: FuneralHome
        preconditions:
          - "status IN {PENDING, APPROVED} (ERR_GUESTBOOK_INVALID_STATE)"
        side_effects:
          - "order.guestbook_entry_count recomputed (count of APPROVED)"

  # ---- TributeVideo: CYCLIC review loop ----
  - entity: TributeVideo
    initial_state: "DRAFT"
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /tribute-videos/{id}/transitions {action: SUBMIT}"
        actor: FuneralHome
        preconditions:
          - "status == DRAFT (ERR_TRIBUTE_INVALID_TRANSITION)"
        side_effects: []
      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /tribute-videos/{id}/transitions {action: REQUEST_CHANGES}"
        actor: PlatformAdmin
        preconditions:
          - "status == SUBMITTED (ERR_TRIBUTE_INVALID_TRANSITION)"
        side_effects: []
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /tribute-videos/{id}/transitions {action: SUBMIT}"
        actor: FuneralHome
        preconditions:
          - "status == CHANGES_REQUESTED (ERR_TRIBUTE_INVALID_TRANSITION)"
        side_effects:
          - "revision_count += 1"
        note: "cycle back-edge — the revision loop"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /tribute-videos/{id}/transitions {action: APPROVE}"
        actor: PlatformAdmin
        preconditions:
          - "status == SUBMITTED (ERR_TRIBUTE_INVALID_TRANSITION)"
        side_effects: []
      - from: APPROVED
        to: PUBLISHED
        trigger: "POST /tribute-videos/{id}/transitions {action: PUBLISH}"
        actor: FuneralHome
        preconditions:
          - "status == APPROVED (ERR_TRIBUTE_INVALID_TRANSITION)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: booking-create-stale-order
    parent_entity: ServiceOrder
    write_endpoint: "POST /venue-bookings"
    occ_field: "expected_order_version"
    description: |
      Creating a VenueBooking against a ServiceOrder whose version has advanced
      since the client last observed it is rejected. A new booking legitimately
      supersedes any prior HELD booking for the same order, so a second create
      that still carries the pre-supersede version is operating on a stale view
      of the order and must be refused rather than silently creating a duplicate
      reservation.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: service_billing
    trigger: "estimated variant at SCHEDULE (POST .../transitions SCHEDULE); final variant at INVOICE (POST .../transitions INVOICE)"
    algorithm: tiered_pricing
    formula: |
      # duration_minutes:
      #   estimated variant -> ceil((scheduled_end - scheduled_start)/60s)
      #   final     variant -> recording_duration_minutes (from ACTUAL clock instants)
      overage = max(0, duration_minutes - INCLUDED_MINUTES)
      tier1 = min(overage, OVERAGE_TIER1_MINUTES) * OVERAGE_TIER1_RATE_CENTS
      tier2 = max(0, overage - OVERAGE_TIER1_MINUTES) * OVERAGE_TIER2_RATE_CENTS
      surcharge = PRIORITY_SUPPORT_SURCHARGE_CENTS if priority_support else 0
      cost = BASE_FEE_CENTS + PER_CAMERA_CENTS * camera_count + tier1 + tier2 + surcharge
    input_set: "Single ServiceOrder. Estimated uses SCHEDULED duration at SCHEDULE; final uses ACTUAL (recording_duration_minutes) at INVOICE."
    constants:
      BASE_FEE_CENTS: 15000
      PER_CAMERA_CENTS: 5000
      INCLUDED_MINUTES: 120
      OVERAGE_TIER1_MINUTES: 60          # first 60 overage minutes at tier1 rate
      OVERAGE_TIER1_RATE_CENTS: 100      # per minute
      OVERAGE_TIER2_RATE_CENTS: 150      # per minute beyond the first 60 overage minutes
      PRIORITY_SUPPORT_SURCHARGE_CENTS: 10000
    precision: "integer cents; overage boundary is strict — duration_minutes == INCLUDED_MINUTES yields zero overage; overage begins at INCLUDED_MINUTES + 1"
    variants:
      - name: estimated
        when: "computed at SCHEDULE, written to estimated_cost_cents"
        difference: "duration_minutes derived from scheduled_start/scheduled_end"
      - name: final
        when: "computed at INVOICE, written to final_invoice_cents"
        difference: "duration_minutes = recording_duration_minutes (actual). Diverges from estimated whenever the broadcast ran longer/shorter than scheduled."

  - name: donation_ledger
    trigger: "fee/net finalized at SETTLE; pledged/net rollups recomputed on any Donation status change"
    algorithm: aggregation
    formula: |
      # Per-donation fee, rounded HALF-UP per donation BEFORE summing:
      fee_cents = round_half_up(gross_amount_cents * FEE_PCT) + FEE_FLAT_CENTS
      net_amount_cents = gross_amount_cents - fee_cents
      # Rollups (per order, then bubbled to home):
      order.donations_net_cents = SUM(d.net_amount_cents for d in order.donations if d.status == SETTLED)
      home.donations_net_cents  = SUM(d.net_amount_cents for d in home.donations  if d.status == SETTLED)
      home.donations_pledged_cents = SUM(d.gross_amount_cents for d in home.donations if d.status IN {PLEDGED, SETTLED})
    input_set: "SETTLED donations for the net rollups; PLEDGED+SETTLED for the pledged rollup."
    constants:
      FEE_PCT: 0.029
      FEE_FLAT_CENTS: 30
    precision: "integer cents; round HALF-UP the percentage fee PER DONATION, then sum nets (NOT sum grosses then apply one fee)"
    variants:
      - name: pledged
        when: "home.donations_pledged_cents / provisional total"
        difference: "sum of GROSS over PLEDGED+SETTLED, no fee deducted"
      - name: net
        when: "home.donations_net_cents & order.donations_net_cents / settled total"
        difference: "sum of NET (after per-donation fee) over SETTLED only. Diverges from pledged by the fee total and the status filter."

  - name: recording_duration
    trigger: "at END, from actual_start/actual_end"
    algorithm: threshold
    formula: |
      if actual_end is null: recording_duration_minutes = 0
      else: recording_duration_minutes = ceil((actual_end - actual_start) total_seconds / 60)
    input_set: "single ServiceOrder's actual clock instants"
    precision: "integer minutes, ceiling"

  - name: stream_credit_ledger
    trigger: "credit grant, SCHEDULE (consume), CANCEL of a SCHEDULED order (refund)"
    algorithm: aggregation
    formula: |
      home.stream_credit_balance =
        initial_credits
        + SUM(grant.credit_amount)
        - COUNT(orders currently or historically SCHEDULED-consumed and not yet refunded)
        + COUNT(SCHEDULED->CANCELLED refunds)
      # Invariant: a SCHEDULE immediately followed by CANCEL of the same order
      # leaves stream_credit_balance identical to its pre-SCHEDULE value.
    input_set: "single FuneralHome"
    precision: "integer credits, never below 0"

  - name: access_lockout
    trigger: "each wrong-password POST /service-orders/{id}/access"
    algorithm: threshold
    formula: |
      on wrong password and not access_locked: failed_access_count += 1
      access_locked = (failed_access_count >= MAX_FAILED_ACCESS_ATTEMPTS)
      # Boundary: locked becomes true at EXACTLY MAX_FAILED_ACCESS_ATTEMPTS (>=), not one later.
    input_set: "single ServiceOrder guest link"
    constants:
      MAX_FAILED_ACCESS_ATTEMPTS: 5
    precision: "integer count; lock threshold uses >= (5th wrong attempt locks)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted to invoke this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every resource id in the path exists, validated left-to-right"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all id-bearing endpoints

  - priority: 4
    category: business_referential
    check: "Tenant isolation: for FuneralHome/Operator actors, the target resource's home_id must equal the acting home (or the operator's home). Cross-tenant access denied."
    error_id: ERR_CROSS_TENANT_FORBIDDEN
    http_status: 403
    applies_to: all owned-resource write & read-by-id endpoints

  - priority: 5
    category: business_constraint
    check: "Input shape: required fields present; scheduled_end > scheduled_start and window_end > window_start (ERR_INVALID_TIME_RANGE); 1 <= camera_count <= 4 (ERR_INVALID_CAMERA_COUNT); gross_amount_cents > 0 (ERR_INVALID_DONATION_AMOUNT); unknown/invalid enum -> ERR_VALIDATION"
    error_id: "ERR_VALIDATION | ERR_INVALID_TIME_RANGE | ERR_INVALID_CAMERA_COUNT | ERR_INVALID_DONATION_AMOUNT"
    http_status: 422
    applies_to: create endpoints and transition inputs

  - priority: 6
    category: state
    check: "Target resource/axis is in the correct state for the requested transition"
    error_id: "ERR_ORDER_NOT_DRAFT | ERR_ORDER_NOT_SCHEDULED | ERR_ORDER_NOT_LIVE | ERR_ORDER_NOT_ENDED | ERR_ORDER_NOT_UNBILLED | ERR_ORDER_NOT_INVOICED | ERR_ORDER_NOT_CANCELLABLE | ERR_BOOKING_NOT_HELD | ERR_DONATION_NOT_PLEDGED | ERR_DONATION_NOT_REFUNDABLE | ERR_GUESTBOOK_INVALID_STATE | ERR_TRIBUTE_INVALID_TRANSITION | ERR_RECORDING_INVALID_STATE | ERR_STREAM_INVALID_STATE | ERR_MEMORIAL_INVALID_STATE | ERR_ACCESS_LOCKED"
    http_status: 409
    applies_to: all transition endpoints (ERR_ACCESS_LOCKED also on POST /service-orders/{id}/access)

  - priority: 7
    category: business_referential
    check: "Cross-entity readiness: SCHEDULE requires a CONFIRMED VenueBooking (ERR_VENUE_NOT_CONFIRMED) and stream_status READY (ERR_STREAM_NOT_READY); guest Donation & GuestbookEntry creation require memorial_status == PUBLISHED (ERR_MEMORIAL_NOT_PUBLISHED)"
    error_id: "ERR_VENUE_NOT_CONFIRMED | ERR_STREAM_NOT_READY | ERR_MEMORIAL_NOT_PUBLISHED"
    http_status: 409
    applies_to: "POST /service-orders/{id}/transitions (SCHEDULE); POST /donations; POST /guestbook-entries"

  - priority: 8
    category: business_safety
    check: "Camera assignment requires the target Operator to be ON_DUTY"
    error_id: ERR_OPERATOR_OFF_DUTY
    http_status: 409
    applies_to: "POST /camera-assignments"

  - priority: 9
    category: business_temporal
    check: "Resource time conflicts. Venue: reject when the new booking window, expanded by venue.turnaround_minutes on BOTH sides, intersects an existing HELD/CONFIRMED booking on the same venue (ERR_VENUE_TIME_CONFLICT). Operator: reject when the assignment's order window overlaps (strict, no buffer, exact adjacency allowed) another ASSIGNED assignment's order window for the same operator (ERR_OPERATOR_TIME_CONFLICT)."
    error_id: "ERR_VENUE_TIME_CONFLICT | ERR_OPERATOR_TIME_CONFLICT"
    http_status: 409
    applies_to: "POST /venue-bookings; POST /camera-assignments"

  - priority: 10
    category: business_constraint
    check: "Guest-link password check on POST /service-orders/{id}/access: wrong password (while not locked) -> ERR_INVALID_ACCESS_PASSWORD"
    error_id: ERR_INVALID_ACCESS_PASSWORD
    http_status: 403
    applies_to: "POST /service-orders/{id}/access"

  - priority: 11
    category: business_fiscal
    check: "SCHEDULE requires home.stream_credit_balance >= 1"
    error_id: ERR_INSUFFICIENT_STREAM_CREDITS
    http_status: 402
    applies_to: "POST /service-orders/{id}/transitions (SCHEDULE)"

  - priority: 12
    category: business_referential
    check: "OCC: POST /venue-bookings expected_order_version must equal the current ServiceOrder.version"
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
    applies_to: "POST /venue-bookings"

# =============================================================================
# §1.5 API Endpoint Table (35 endpoints)
# =============================================================================
endpoints:
  # ---- FuneralHome ----
  - method: POST
    path: "/funeral-homes"
    description: "Create a funeral-home (vendor) account"
    roles: [PlatformAdmin]
    code: 201
    input: [name, contact_email, "initial_credits?"]
    output: FuneralHome
    side_effects: ["stream_credit_balance = initial_credits (default 0); donations_* = 0"]

  - method: GET
    path: "/funeral-homes/{id}"
    description: "Get a funeral-home account"
    roles: [FuneralHome, PlatformAdmin]
    code: 200
    input: []
    output: FuneralHome
    side_effects: []

  - method: POST
    path: "/funeral-homes/{id}/credit-grants"
    description: "Grant prepaid stream credits to a funeral home"
    roles: [PlatformAdmin]
    code: 200
    input: [credit_amount]
    output: FuneralHome
    side_effects: ["stream_credit_balance += credit_amount"]

  # ---- Venue ----
  - method: POST
    path: "/venues"
    description: "Create a venue for a funeral home"
    roles: [FuneralHome, PlatformAdmin]
    code: 201
    input: [home_id, name, capacity, turnaround_minutes]
    output: Venue
    side_effects: []

  - method: GET
    path: "/venues"
    description: "List venues (filter by home_id)"
    roles: [FuneralHome, PlatformAdmin]
    code: 200
    input: ["home_id?", "limit?", "offset?"]
    output: "Venue[]"
    side_effects: []

  - method: GET
    path: "/venues/{id}"
    description: "Get a venue"
    roles: [FuneralHome, PlatformAdmin]
    code: 200
    input: []
    output: Venue
    side_effects: []

  # ---- Operator ----
  - method: POST
    path: "/operators"
    description: "Create a tech / on-call operator for a funeral home"
    roles: [FuneralHome, PlatformAdmin]
    code: 201
    input: [home_id, full_name, skill]
    output: Operator
    side_effects: ["duty_status = OFF_DUTY"]

  - method: GET
    path: "/operators"
    description: "List operators (filter by home_id)"
    roles: [FuneralHome, PlatformAdmin]
    code: 200
    input: ["home_id?", "limit?", "offset?"]
    output: "Operator[]"
    side_effects: []

  - method: GET
    path: "/operators/{id}"
    description: "Get an operator"
    roles: [FuneralHome, PlatformAdmin]
    code: 200
    input: []
    output: Operator
    side_effects: []

  - method: POST
    path: "/operators/{id}/duty"
    description: "Set operator on/off duty"
    roles: [Operator, FuneralHome, PlatformAdmin]
    code: 200
    input: [duty_status]
    output: Operator
    side_effects: ["duty_status set to ON_DUTY or OFF_DUTY"]

  # ---- ServiceOrder ----
  - method: POST
    path: "/service-orders"
    description: "Create a funeral live-stream service order"
    roles: [FuneralHome, PlatformAdmin]
    code: 201
    input: [home_id, venue_id, decedent_name, scheduled_start, scheduled_end, "expected_viewers?", "priority_support?", "camera_count?", "audio_source?", "privacy_mode?", "access_password?", "headline?", "donation_goal_cents?", "delivery_email?"]
    output: ServiceOrder
    side_effects: ["broadcast_status=DRAFT; settlement_status=UNBILLED; stream_status=PENDING; recording_status=NONE; memorial_status=DRAFT; access_token minted; failed_access_count=0"]

  - method: GET
    path: "/service-orders"
    description: "List service orders (filter by home_id, venue_id)"
    roles: [FuneralHome, PlatformAdmin]
    code: 200
    input: ["home_id?", "venue_id?", "limit?", "offset?"]
    output: "ServiceOrder[]"
    side_effects: []

  - method: GET
    path: "/service-orders/{id}"
    description: "Get a service order"
    roles: [FuneralHome, PlatformAdmin]
    code: 200
    input: []
    output: ServiceOrder
    side_effects: []

  - method: POST
    path: "/service-orders/{id}/transitions"
    description: "Drive a ServiceOrder axis transition. action ∈ {SCHEDULE, GO_LIVE, END, CANCEL, INVOICE, PAY, SET_STREAM_READY, SET_STREAM_FAILED, START_EDIT, MARK_RECORDING_READY, DELIVER_RECORDING, PUBLISH_MEMORIAL, ARCHIVE_MEMORIAL}"
    roles: [FuneralHome, Operator, PlatformAdmin]
    code: 200
    input: [action, "delivery_email?"]
    output: ServiceOrder
    side_effects: ["per §1.2 transition for the given action (credit consume/refund, actual_start/end stamping, recording spawn, cost calcs, cascades)"]

  - method: POST
    path: "/service-orders/{id}/access"
    description: "Guest attempts the private link with a password; increments failed_access_count / locks per calculations.access_lockout"
    roles: [Guest]
    code: 200
    input: [password]
    output: ServiceOrder
    side_effects: ["on wrong password (unlocked): failed_access_count += 1; access_locked recomputed"]

  # ---- VenueBooking ----
  - method: POST
    path: "/venue-bookings"
    description: "Reserve a venue window for a service order (supersedes any prior HELD booking of the order). OCC-guarded on the order's version."
    roles: [FuneralHome, PlatformAdmin]
    code: 201
    input: [order_id, venue_id, window_start, window_end, expected_order_version]
    output: VenueBooking
    side_effects: ["status=HELD; home_id copied from order; increments ServiceOrder.version by 1; any prior HELD booking of the order -> RELEASED"]

  - method: GET
    path: "/venue-bookings"
    description: "List venue bookings (filter by order_id, venue_id, home_id)"
    roles: [FuneralHome, PlatformAdmin]
    code: 200
    input: ["order_id?", "venue_id?", "home_id?", "limit?", "offset?"]
    output: "VenueBooking[]"
    side_effects: []

  - method: GET
    path: "/venue-bookings/{id}"
    description: "Get a venue booking"
    roles: [FuneralHome, PlatformAdmin]
    code: 200
    input: []
    output: VenueBooking
    side_effects: []

  - method: POST
    path: "/venue-bookings/{id}/confirm"
    description: "Confirm a held venue booking"
    roles: [FuneralHome, PlatformAdmin]
    code: 200
    input: []
    output: VenueBooking
    side_effects: ["status HELD -> CONFIRMED"]

  # ---- CameraAssignment ----
  - method: POST
    path: "/camera-assignments"
    description: "Assign an operator to a service order's stream window"
    roles: [FuneralHome, PlatformAdmin]
    code: 201
    input: [order_id, operator_id, role]
    output: CameraAssignment
    side_effects: ["status=ASSIGNED; home_id copied from order; operator ON_DUTY & operator time-conflict checks run"]

  - method: GET
    path: "/camera-assignments"
    description: "List camera assignments (filter by order_id, operator_id, home_id)"
    roles: [FuneralHome, PlatformAdmin]
    code: 200
    input: ["order_id?", "operator_id?", "home_id?", "limit?", "offset?"]
    output: "CameraAssignment[]"
    side_effects: []

  - method: GET
    path: "/camera-assignments/{id}"
    description: "Get a camera assignment"
    roles: [FuneralHome, PlatformAdmin]
    code: 200
    input: []
    output: CameraAssignment
    side_effects: []

  # ---- GuestbookEntry ----
  - method: POST
    path: "/guestbook-entries"
    description: "Guest posts a condolence entry (requires published memorial page)"
    roles: [Guest]
    code: 201
    input: [order_id, author_name, message]
    output: GuestbookEntry
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/guestbook-entries"
    description: "List guestbook entries (filter by order_id)"
    roles: [FuneralHome, PlatformAdmin]
    code: 200
    input: ["order_id?", "limit?", "offset?"]
    output: "GuestbookEntry[]"
    side_effects: []

  - method: GET
    path: "/guestbook-entries/{id}"
    description: "Get a guestbook entry"
    roles: [FuneralHome, PlatformAdmin]
    code: 200
    input: []
    output: GuestbookEntry
    side_effects: []

  - method: POST
    path: "/guestbook-entries/{id}/moderation"
    description: "Moderate a guestbook entry. decision ∈ {APPROVE, HIDE}"
    roles: [FuneralHome, PlatformAdmin]
    code: 200
    input: [decision]
    output: GuestbookEntry
    side_effects: ["status transition per decision; order.guestbook_entry_count recomputed"]

  # ---- Donation ----
  - method: POST
    path: "/donations"
    description: "Guest pledges a donation (requires published memorial page)"
    roles: [Guest]
    code: 201
    input: [order_id, donor_name, gross_amount_cents]
    output: Donation
    side_effects: ["status=PLEDGED; home_id copied from order; home.donations_pledged_cents recomputed"]

  - method: GET
    path: "/donations"
    description: "List donations (filter by order_id, home_id)"
    roles: [FuneralHome, PlatformAdmin]
    code: 200
    input: ["order_id?", "home_id?", "limit?", "offset?"]
    output: "Donation[]"
    side_effects: []

  - method: GET
    path: "/donations/{id}"
    description: "Get a donation"
    roles: [FuneralHome, PlatformAdmin]
    code: 200
    input: []
    output: Donation
    side_effects: []

  - method: POST
    path: "/donations/{id}/transitions"
    description: "Settle or refund a donation. action ∈ {SETTLE, REFUND}"
    roles: [PlatformAdmin]
    code: 200
    input: [action]
    output: Donation
    side_effects: ["per §1.2: fee/net finalize on SETTLE and ledger rollups cascade to order & home; REFUND of a SETTLED donation compensates the rollups"]

  # ---- TributeVideo ----
  - method: POST
    path: "/tribute-videos"
    description: "Create a tribute video / photo montage for a service order"
    roles: [FuneralHome, PlatformAdmin]
    code: 201
    input: [order_id, title, photo_count]
    output: TributeVideo
    side_effects: ["status=DRAFT; revision_count=0"]

  - method: GET
    path: "/tribute-videos"
    description: "List tribute videos (filter by order_id)"
    roles: [FuneralHome, PlatformAdmin]
    code: 200
    input: ["order_id?", "limit?", "offset?"]
    output: "TributeVideo[]"
    side_effects: []

  - method: GET
    path: "/tribute-videos/{id}"
    description: "Get a tribute video"
    roles: [FuneralHome, PlatformAdmin]
    code: 200
    input: []
    output: TributeVideo
    side_effects: []

  - method: POST
    path: "/tribute-videos/{id}/transitions"
    description: "Drive the tribute review loop. action ∈ {SUBMIT, REQUEST_CHANGES, APPROVE, PUBLISH}"
    roles: [FuneralHome, PlatformAdmin]
    code: 200
    input: [action]
    output: TributeVideo
    side_effects: ["per §1.2 TributeVideo transitions; SUBMIT from CHANGES_REQUESTED increments revision_count"]

  # ---- Test-driving: logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock (test-driving). Default before any call is 2026-03-01T00:00:00Z; the clock never falls back to wall-clock time. GO_LIVE/END stamp actual_start/actual_end from this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "null"
    side_effects: ["logical clock set to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # -- auth / existence --
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role missing/invalid" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for this endpoint" }
  - { id: ERR_CROSS_TENANT_FORBIDDEN, http: 403, condition: "Actor's home does not own the target resource" }
  - { id: ERR_FUNERAL_HOME_NOT_FOUND, http: 404, condition: "funeral-home id does not exist" }
  - { id: ERR_VENUE_NOT_FOUND, http: 404, condition: "venue id does not exist" }
  - { id: ERR_OPERATOR_NOT_FOUND, http: 404, condition: "operator id does not exist" }
  - { id: ERR_SERVICE_ORDER_NOT_FOUND, http: 404, condition: "service-order id does not exist" }
  - { id: ERR_VENUE_BOOKING_NOT_FOUND, http: 404, condition: "venue-booking id does not exist" }
  - { id: ERR_CAMERA_ASSIGNMENT_NOT_FOUND, http: 404, condition: "camera-assignment id does not exist" }
  - { id: ERR_GUESTBOOK_ENTRY_NOT_FOUND, http: 404, condition: "guestbook-entry id does not exist" }
  - { id: ERR_DONATION_NOT_FOUND, http: 404, condition: "donation id does not exist" }
  - { id: ERR_TRIBUTE_VIDEO_NOT_FOUND, http: 404, condition: "tribute-video id does not exist" }
  # -- input constraint --
  - { id: ERR_VALIDATION, http: 422, condition: "missing required field or invalid enum value" }
  - { id: ERR_INVALID_TIME_RANGE, http: 422, condition: "end not strictly after start (scheduled_* or window_*)" }
  - { id: ERR_INVALID_CAMERA_COUNT, http: 422, condition: "camera_count outside 1..4" }
  - { id: ERR_INVALID_DONATION_AMOUNT, http: 422, condition: "gross_amount_cents <= 0" }
  # -- state --
  - { id: ERR_ORDER_NOT_DRAFT, http: 409, condition: "SCHEDULE requires broadcast_status == DRAFT" }
  - { id: ERR_ORDER_NOT_SCHEDULED, http: 409, condition: "GO_LIVE requires broadcast_status == SCHEDULED" }
  - { id: ERR_ORDER_NOT_LIVE, http: 409, condition: "END requires broadcast_status == LIVE" }
  - { id: ERR_ORDER_NOT_ENDED, http: 409, condition: "INVOICE requires broadcast_status == ENDED" }
  - { id: ERR_ORDER_NOT_UNBILLED, http: 409, condition: "INVOICE requires settlement_status == UNBILLED" }
  - { id: ERR_ORDER_NOT_INVOICED, http: 409, condition: "PAY requires settlement_status == INVOICED" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "CANCEL requires broadcast_status IN {DRAFT, SCHEDULED}" }
  - { id: ERR_BOOKING_NOT_HELD, http: 409, condition: "confirm requires booking status == HELD" }
  - { id: ERR_STREAM_INVALID_STATE, http: 409, condition: "stream sub-axis transition invalid from current stream_status" }
  - { id: ERR_RECORDING_INVALID_STATE, http: 409, condition: "recording sub-axis transition invalid from current recording_status" }
  - { id: ERR_MEMORIAL_INVALID_STATE, http: 409, condition: "memorial sub-axis transition invalid from current memorial_status" }
  - { id: ERR_DELIVERY_EMAIL_MISSING, http: 409, condition: "DELIVER_RECORDING with null delivery_email" }
  - { id: ERR_DONATION_NOT_PLEDGED, http: 409, condition: "SETTLE requires donation status == PLEDGED" }
  - { id: ERR_DONATION_NOT_REFUNDABLE, http: 409, condition: "REFUND requires donation status IN {PLEDGED, SETTLED}" }
  - { id: ERR_GUESTBOOK_INVALID_STATE, http: 409, condition: "moderation invalid from current guestbook status" }
  - { id: ERR_TRIBUTE_INVALID_TRANSITION, http: 409, condition: "tribute action invalid from current status" }
  - { id: ERR_ACCESS_LOCKED, http: 409, condition: "guest link already locked (failed_access_count >= MAX_FAILED_ACCESS_ATTEMPTS)" }
  # -- cross-entity readiness --
  - { id: ERR_VENUE_NOT_CONFIRMED, http: 409, condition: "SCHEDULE requires a CONFIRMED VenueBooking for the order" }
  - { id: ERR_STREAM_NOT_READY, http: 409, condition: "SCHEDULE/GO_LIVE require stream_status == READY" }
  - { id: ERR_MEMORIAL_NOT_PUBLISHED, http: 409, condition: "guest donation/guestbook requires memorial_status == PUBLISHED" }
  # -- safety / temporal --
  - { id: ERR_OPERATOR_OFF_DUTY, http: 409, condition: "camera assignment requires operator ON_DUTY" }
  - { id: ERR_VENUE_TIME_CONFLICT, http: 409, condition: "venue booking window (± turnaround buffer) intersects an existing HELD/CONFIRMED booking on the venue" }
  - { id: ERR_OPERATOR_TIME_CONFLICT, http: 409, condition: "operator already ASSIGNED on an order whose window overlaps this order's window (exact adjacency allowed)" }
  # -- guest-link constraint --
  - { id: ERR_INVALID_ACCESS_PASSWORD, http: 403, condition: "wrong guest-link password while not locked" }
  # -- fiscal / concurrency --
  - { id: ERR_INSUFFICIENT_STREAM_CREDITS, http: 402, condition: "SCHEDULE requires home.stream_credit_balance >= 1" }
  - { id: ERR_STALE_ORDER_VERSION, http: 412, condition: "POST /venue-bookings expected_order_version != current ServiceOrder.version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FuneralHome
    description: "Vendor account. Owns and manages its venues, operators, orders, bookings, camera assignments, memorial/tribute/recording lifecycle, and guestbook moderation."
    identity: "entity_backed:FuneralHome"
    exclusive_operations:
      - "POST /venues — create venue"
      - "POST /operators — create operator"
      - "POST /service-orders — create order"
      - "POST /service-orders/{id}/transitions — order lifecycle (SCHEDULE/GO_LIVE/END/CANCEL/INVOICE/PAY/recording/memorial)"
      - "POST /venue-bookings — reserve venue window"
      - "POST /venue-bookings/{id}/confirm — confirm booking"
      - "POST /camera-assignments — assign operator"
      - "POST /guestbook-entries/{id}/moderation — moderate guestbook"
      - "POST /tribute-videos — create tribute"
      - "POST /tribute-videos/{id}/transitions — SUBMIT/PUBLISH (FuneralHome side of the review loop)"
    shared_operations:
      - "GET on all owned collections and resources (venues, operators, service-orders, venue-bookings, camera-assignments, guestbook-entries, donations, tribute-videos, funeral-homes/{own id})"

  - name: Operator
    description: "Tech / on-call operator. Sets own duty status and drives stream readiness; can operate the broadcast."
    identity: "entity_backed:Operator"
    exclusive_operations:
      - "POST /operators/{id}/duty — set own duty status"
    shared_operations:
      - "POST /service-orders/{id}/transitions — SET_STREAM_READY/SET_STREAM_FAILED/GO_LIVE/END (shared with FuneralHome)"

  - name: PlatformAdmin
    description: "Platform operator. Grants credits, creates vendor accounts, settles/refunds donations, and reviews tribute submissions. Override authority across tenants."
    identity: "opaque"
    exclusive_operations:
      - "POST /funeral-homes — create vendor account"
      - "POST /funeral-homes/{id}/credit-grants — grant credits"
      - "POST /donations/{id}/transitions — SETTLE/REFUND donations"
      - "POST /tribute-videos/{id}/transitions — REQUEST_CHANGES/APPROVE (reviewer side)"
