# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3073_merchant_acquiring_program_closed_loop_network_economics
#
# Breadth probe: every testable claim §1.1–§1.7 declares that §1.8 does not
# already exercise. Corners §1.8 covers appear as `excluded_because:` stubs.
# `name` is unique across the union of §1.8 and §1.9.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: merchant_list_filter_by_acceptance_status_excludes_other_states
        claim_type: Listing
        grounds:
          - endpoints.GET_/network/merchants
          - entities.Merchant.fields.acceptance_status
        distinguishing_aspect: "A status-filtered merchant list returns only rows in the requested enum state and reports total_count for the filtered set, while the unfiltered list returns every row regardless of status."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One MEDIUM USD category, one PROSPECT merchant and one ACCEPTED merchant."
          setup_api_calls:
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkIssuer
            - call: "POST /network/industry-categories"
              payload: { industry_code: "USD-5812", industry_name: "USD Dining", risk_tier: "MEDIUM", base_discount_rate_bps: 250, high_risk_flag: false }
              as: NetworkAcquirer
              captures: { ic_el: $.data.id }
            - call: "POST /network/merchants"
              payload: { industry_category_id: "${ic_el}", merchant_name: "List Merchant A", region_code: "US-NE", acquisition_channel: "DIRECT" }
              as: NetworkAcquirer
              captures: { m_la: $.data.id, m_la_v: $.data.version }
            - call: "POST /network/merchants"
              payload: { industry_category_id: "${ic_el}", merchant_name: "List Merchant B", region_code: "US-NE", acquisition_channel: "DIRECT" }
              as: NetworkAcquirer
            - call: "POST /network/merchants/${m_la}/accept"
              payload: { expected_merchant_version: "${m_la_v}" }
              as: NetworkAcquirer
          trigger:
            - call: "GET /network/merchants"
              payload: { acceptance_status: "PROSPECT" }
              as: NetworkAcquirer
          assert:
            - "the response status is 200 and response_type is array"
            - "the filtered list returns exactly 1 row, merchant B, with total_count == 1 and has_more == false"
            - "GET /network/merchants with no filter returns exactly 2 rows with total_count == 2"
            - "the returned rows carry acceptance_status PROSPECT (B) and ACCEPTED (A) respectively"

      - name: merchant_delete_moves_to_terminal_suppressed_and_blocks_transitions
        claim_type: Immutability
        grounds:
          - endpoints.DELETE_/network/merchants/{merchant_id}
          - state_machines.Merchant.PROSPECT_to_SUPPRESSED
        distinguishing_aspect: "Deleting a merchant is the operator archive action: it drives acceptance_status to the terminal SUPPRESSED state, after which no acceptance transition succeeds, while a GET by id still returns the archived row."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One MEDIUM USD category and one PROSPECT merchant."
          setup_api_calls:
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkIssuer
            - call: "POST /network/industry-categories"
              payload: { industry_code: "USD-5812", industry_name: "USD Dining", risk_tier: "MEDIUM", base_discount_rate_bps: 250, high_risk_flag: false }
              as: NetworkAcquirer
              captures: { ic_del: $.data.id }
            - call: "POST /network/merchants"
              payload: { industry_category_id: "${ic_del}", merchant_name: "Archive Merchant", region_code: "US-NE", acquisition_channel: "DIRECT" }
              as: NetworkAcquirer
              captures: { m_del: $.data.id, m_del_v: $.data.version }
          trigger:
            - call: "DELETE /network/merchants/${m_del}"
              payload: {}
              as: NetworkCompliance
              captures: { m_del_status: $.data.acceptance_status }
            - call: "POST /network/merchants/${m_del}/accept"
              payload: { expected_merchant_version: "${m_del_v}" }
              as: NetworkAcquirer
              captures: { del_err: $.data.error_id }
          assert:
            - "the delete response is 200 with acceptance_status == SUPPRESSED"
            - "GET /network/merchants/${m_del} still returns the row with acceptance_status == SUPPRESSED"
            - "the follow-up accept is rejected: status 409, error_id ERR_INVALID_STATE"

      - name: cardmember_create_applies_card_product_defaults
        claim_type: Defaults
        grounds:
          - entities.CardMember.fields.annual_fee_cents
          - entities.CardMember.fields.lounge_access_tier
          - endpoints.POST_/network/cardmembers
        distinguishing_aspect: "Registration applies product-driven defaults: annual_fee_cents is set from the card product (PLATINUM → 69500), the member starts PENDING with lounge_access_tier NONE and reward_points_balance 0."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkIssuer
          trigger:
            - call: "POST /network/cardmembers"
              payload: { member_name: "Defaults Member", card_product: "PLATINUM" }
              as: NetworkIssuer
              captures: { cm_df: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "CardMember.${cm_df}.card_product == PLATINUM and annual_fee_cents == 69500"
            - "CardMember.${cm_df}.member_status == PENDING and lounge_access_tier == NONE"
            - "CardMember.${cm_df}.reward_points_balance == 0 and version == 1"

      - name: settlement_computed_post_refund_field_ignores_client_input
        claim_type: Computed Fields
        grounds:
          - entities.Settlement.fields.post_refund_volume_cents
          - endpoints.POST_/network/merchants/{merchant_id}/settlements
        distinguishing_aspect: "post_refund_volume_cents is computed from gross minus refund and is never taken from the request; a full refund yields the zero boundary (0), not the gross figure."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A HIGH-risk USD category and an ACTIVE DIRECT merchant."
          setup_api_calls:
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkIssuer
            - call: "POST /network/industry-categories"
              payload: { industry_code: "USD-5812", industry_name: "USD Dining", risk_tier: "HIGH", base_discount_rate_bps: 250, high_risk_flag: true }
              as: NetworkAcquirer
              captures: { ic_cf: $.data.id }
            - call: "POST /network/merchants"
              payload: { industry_category_id: "${ic_cf}", merchant_name: "Computed Merchant", region_code: "US-NE", acquisition_channel: "DIRECT" }
              as: NetworkAcquirer
              captures: { m_cf: $.data.id, m_cf_v: $.data.version }
            - call: "POST /network/merchants/${m_cf}/accept"
              payload: { expected_merchant_version: "${m_cf_v}" }
              as: NetworkAcquirer
            - call: "POST /network/merchants/${m_cf}/activate"
              payload: {}
              as: NetworkAcquirer
          trigger:
            - call: "POST /network/merchants/${m_cf}/settlements"
              payload: { settlement_cycle: 1, gross_volume_cents: 100000, refund_volume_cents: 100000 }
              as: NetworkSettlementOps
              captures: { s_cf: $.data.id }
          assert:
            - "the response status is 201"
            - "Settlement.${s_cf}.post_refund_volume_cents == 0 (full refund hits the zero boundary)"
            - "Settlement.${s_cf}.gross_volume_cents == 100000 and refund_volume_cents == 100000"
            - "Settlement.${s_cf}.funding_batch_seq == 1 and settlement_status == CAPTURED"

      - name: cardmember_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/network/cardmembers/{cardmember_id}
          - errors.ERR_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated member id yields a 404 ERR_NOT_FOUND without leaking any member fields."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. No card member has been created."
          setup_api_calls:
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkIssuer
          trigger:
            - call: "GET /network/cardmembers/2f9c1a44-0000-4000-8000-000000000000"
              payload: {}
              as: NetworkIssuer
              captures: { nf_err: $.data.error_id }
          assert:
            - "the response status is 404 and response_type is error"
            - "the error_id is ERR_NOT_FOUND"
            - "the error body carries no member fields (no member_name, no card_product)"

      - name: merchant_create_missing_required_name_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints.POST_/network/merchants
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Omitting the required merchant_name field is rejected with ERR_INVALID_REQUEST and creates no merchant row."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One MEDIUM USD category."
          setup_api_calls:
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkIssuer
            - call: "POST /network/industry-categories"
              payload: { industry_code: "USD-5812", industry_name: "USD Dining", risk_tier: "MEDIUM", base_discount_rate_bps: 250, high_risk_flag: false }
              as: NetworkAcquirer
              captures: { ic_rq: $.data.id }
          trigger:
            - call: "POST /network/merchants"
              payload: { industry_category_id: "${ic_rq}", region_code: "US-NE", acquisition_channel: "DIRECT" }
              as: NetworkAcquirer
              captures: { rq_err: $.data.error_id }
          assert:
            - "the response status is 400 and the error_id is ERR_INVALID_REQUEST"
            - "GET /network/merchants returns 0 rows — no merchant was created"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: merchant_accept_from_active_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Merchant.PROSPECT_to_ACCEPTED
          - state_machines.Merchant.ACCEPTED_to_ACTIVE
        distinguishing_aspect: "The accept trigger is only declared from PROSPECT; invoking it on an ACTIVE merchant is not a declared transition and yields ERR_INVALID_STATE with no field changes."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A MEDIUM USD category and an ACTIVE DIRECT merchant."
          setup_api_calls:
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkIssuer
            - call: "POST /network/industry-categories"
              payload: { industry_code: "USD-5812", industry_name: "USD Dining", risk_tier: "MEDIUM", base_discount_rate_bps: 250, high_risk_flag: false }
              as: NetworkAcquirer
              captures: { ic_s1: $.data.id }
            - call: "POST /network/merchants"
              payload: { industry_category_id: "${ic_s1}", merchant_name: "State Merchant 1", region_code: "US-NE", acquisition_channel: "DIRECT" }
              as: NetworkAcquirer
              captures: { m_s1: $.data.id, m_s1_v: $.data.version }
            - call: "POST /network/merchants/${m_s1}/accept"
              payload: { expected_merchant_version: "${m_s1_v}" }
              as: NetworkAcquirer
              captures: { m_s1_v2: $.data.version }
            - call: "POST /network/merchants/${m_s1}/activate"
              payload: {}
              as: NetworkAcquirer
              captures: { m_s1_v3: $.data.version }
          trigger:
            - call: "POST /network/merchants/${m_s1}/accept"
              payload: { expected_merchant_version: "${m_s1_v3}" }
              as: NetworkAcquirer
              captures: { s1_err: $.data.error_id }
          assert:
            - "the response status is 409 and the error_id is ERR_INVALID_STATE"
            - "GET /network/merchants/${m_s1} still shows acceptance_status == ACTIVE"

      - name: merchant_suppressed_state_blocks_every_acceptance_transition
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Merchant
          - endpoints.DELETE_/network/merchants/{merchant_id}
        distinguishing_aspect: "From the terminal SUPPRESSED state no declared transition exists, so accept, activate and mark-dormant all fail with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A MEDIUM USD category and a PROSPECT merchant archived to SUPPRESSED."
          setup_api_calls:
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkIssuer
            - call: "POST /network/industry-categories"
              payload: { industry_code: "USD-5812", industry_name: "USD Dining", risk_tier: "MEDIUM", base_discount_rate_bps: 250, high_risk_flag: false }
              as: NetworkAcquirer
              captures: { ic_s2: $.data.id }
            - call: "POST /network/merchants"
              payload: { industry_category_id: "${ic_s2}", merchant_name: "State Merchant 2", region_code: "US-NE", acquisition_channel: "DIRECT" }
              as: NetworkAcquirer
              captures: { m_s2: $.data.id }
            - call: "DELETE /network/merchants/${m_s2}"
              payload: {}
              as: NetworkCompliance
          trigger:
            - call: "POST /network/merchants/${m_s2}/activate"
              payload: {}
              as: NetworkAcquirer
              captures: { s2_err: $.data.error_id }
            - call: "POST /network/merchants/${m_s2}/mark-dormant"
              payload: {}
              as: NetworkAcquirer
              captures: { s2_err2: $.data.error_id }
          assert:
            - "the activate call returns 409 ERR_INVALID_STATE"
            - "the mark-dormant call returns 409 ERR_INVALID_STATE"
            - "GET /network/merchants/${m_s2} still shows acceptance_status == SUPPRESSED"

      - name: complaint_created_starts_filed_and_take_up_is_idempotent_guarded
        claim_type: Initial State
        grounds:
          - entities.AcceptanceComplaint.fields.complaint_status
          - state_machines.AcceptanceComplaint.FILED_to_UNDER_REVIEW
        distinguishing_aspect: "A filed complaint starts FILED; taking it up once moves it to UNDER_REVIEW and a second take-up is rejected by the state precondition."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A MEDIUM USD category, an ACTIVE merchant and an active member."
          setup_api_calls:
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkIssuer
            - call: "POST /network/industry-categories"
              payload: { industry_code: "USD-5812", industry_name: "USD Dining", risk_tier: "MEDIUM", base_discount_rate_bps: 250, high_risk_flag: false }
              as: NetworkAcquirer
              captures: { ic_s3: $.data.id }
            - call: "POST /network/merchants"
              payload: { industry_category_id: "${ic_s3}", merchant_name: "State Merchant 3", region_code: "US-NE", acquisition_channel: "DIRECT" }
              as: NetworkAcquirer
              captures: { m_s3: $.data.id, m_s3_v: $.data.version }
            - call: "POST /network/merchants/${m_s3}/accept"
              payload: { expected_merchant_version: "${m_s3_v}" }
              as: NetworkAcquirer
            - call: "POST /network/merchants/${m_s3}/activate"
              payload: {}
              as: NetworkAcquirer
            - call: "POST /network/cardmembers"
              payload: { member_name: "Member State 3", card_product: "GOLD" }
              as: NetworkIssuer
              captures: { cm_s3: $.data.id }
            - call: "POST /network/cardmembers/${cm_s3}/activate"
              payload: {}
              as: NetworkIssuer
          trigger:
            - call: "POST /network/complaints"
              payload: { merchant_id: "${m_s3}", cardmember_id: "${cm_s3}", complaint_type: "MERCHANT_NOT_ACCEPTED" }
              as: CardMember
              as_user_id: "${cm_s3}"
              captures: { cmp_s3: $.data.id }
            - call: "POST /network/complaints/${cmp_s3}/take-up"
              payload: {}
              as: NetworkService
              captures: { cmp_s3_status: $.data.complaint_status }
            - call: "POST /network/complaints/${cmp_s3}/take-up"
              payload: {}
              as: NetworkService
              captures: { cmp_s3_err: $.data.error_id }
          assert:
            - "the new complaint starts complaint_status == FILED with version == 1"
            - "the first take-up returns complaint_status == UNDER_REVIEW"
            - "the second take-up returns 409 ERR_INVALID_STATE (FILED is required, not UNDER_REVIEW)"

      - name: dispute_response_below_amount_minimum_returns_forbidden
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Dispute.OPEN_to_MERCHANT_RESPONDED
          - errors.ERR_RESPOND_AMOUNT_TOO_LOW
        distinguishing_aspect: "The merchant response precondition requires amount_cents >= 50000; a 10000-cent dispute is rejected with ERR_RESPOND_AMOUNT_TOO_LOW and stays OPEN."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An ACTIVE merchant, an active member, and an OPEN dispute of 10000 cents."
          setup_api_calls:
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkIssuer
            - call: "POST /network/industry-categories"
              payload: { industry_code: "USD-5812", industry_name: "USD Dining", risk_tier: "MEDIUM", base_discount_rate_bps: 250, high_risk_flag: false }
              as: NetworkAcquirer
              captures: { ic_s4: $.data.id }
            - call: "POST /network/merchants"
              payload: { industry_category_id: "${ic_s4}", merchant_name: "State Merchant 4", region_code: "US-NE", acquisition_channel: "DIRECT" }
              as: NetworkAcquirer
              captures: { m_s4: $.data.id, m_s4_v: $.data.version }
            - call: "POST /network/merchants/${m_s4}/accept"
              payload: { expected_merchant_version: "${m_s4_v}" }
              as: NetworkAcquirer
            - call: "POST /network/merchants/${m_s4}/activate"
              payload: {}
              as: NetworkAcquirer
            - call: "POST /network/cardmembers"
              payload: { member_name: "Member State 4", card_product: "GOLD" }
              as: NetworkIssuer
              captures: { cm_s4: $.data.id }
            - call: "POST /network/cardmembers/${cm_s4}/activate"
              payload: {}
              as: NetworkIssuer
            - call: "POST /network/disputes"
              payload: { cardmember_id: "${cm_s4}", original_merchant_id: "${m_s4}", final_merchant_id: "${m_s4}", amount_cents: 10000 }
              as: CardMember
              as_user_id: "${cm_s4}"
              captures: { d_s4: $.data.id }
          trigger:
            - call: "POST /network/disputes/${d_s4}/respond"
              payload: {}
              as: Merchant
              as_user_id: "${m_s4}"
              captures: { s4_err: $.data.error_id }
          assert:
            - "the response status is 403 and the error_id is ERR_RESPOND_AMOUNT_TOO_LOW"
            - "Dispute.${d_s4}.dispute_status == OPEN"
            - "Dispute.${d_s4}.priority == STANDARD (10000 < 50000)"

      - name: merchant_suppress_terminates_offers_and_reverses_settlements
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Merchant.ACTIVE_to_SUPPRESSED
        excluded_because:
          difficulty_instance: payment_reversal_cascade_depth2
          rationale: "The suppression side-effect chain (offers terminated, settlements reversed) is asserted as the named §1.8 cascade instance, so this corner is already covered."

  # ===========================================================================
  - section: calculations
    instances:

      - name: trailing_volume_provisional_counts_unsettled_captures
        claim_type: Variant Divergence
        grounds:
          - calculations.trailing_90d_billed_volume
          - entities.Merchant.fields.rolling_90d_settled_volume_cents
        distinguishing_aspect: "A single CAPTURED (not yet settled) settlement of 500000 is counted by the PROVISIONAL trailing-volume field but excluded by the FINAL field, so the two stored volumes differ by exactly the pending amount."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A HIGH-risk USD category and an ACTIVE DIRECT merchant with one captured settlement of 500000 cents."
          setup_api_calls:
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkIssuer
            - call: "POST /network/industry-categories"
              payload: { industry_code: "USD-5812", industry_name: "USD Dining", risk_tier: "HIGH", base_discount_rate_bps: 250, high_risk_flag: true }
              as: NetworkAcquirer
              captures: { ic_c1: $.data.id }
            - call: "POST /network/merchants"
              payload: { industry_category_id: "${ic_c1}", merchant_name: "Calc Merchant 1", region_code: "US-NE", acquisition_channel: "DIRECT" }
              as: NetworkAcquirer
              captures: { m_c1: $.data.id, m_c1_v: $.data.version }
            - call: "POST /network/merchants/${m_c1}/accept"
              payload: { expected_merchant_version: "${m_c1_v}" }
              as: NetworkAcquirer
            - call: "POST /network/merchants/${m_c1}/activate"
              payload: {}
              as: NetworkAcquirer
            - call: "POST /network/merchants/${m_c1}/settlements"
              payload: { settlement_cycle: 1, gross_volume_cents: 500000, refund_volume_cents: 0 }
              as: NetworkSettlementOps
              captures: { s_c1: $.data.id }
          trigger:
            - call: "GET /network/merchants/${m_c1}"
              payload: {}
              as: NetworkAcquirer
          assert:
            - "Merchant.${m_c1}.rolling_90d_billed_volume_cents == 500000 (provisional includes the CAPTURED settlement)"
            - "Merchant.${m_c1}.rolling_90d_settled_volume_cents == 0 (final counts SETTLED only)"
            - "Settlement.${s_c1}.settlement_status == CAPTURED"

      - name: high_risk_reserve_ratchets_to_the_floor_of_settled_volume
        claim_type: Constants Applied
        grounds:
          - calculations.merchant_reserve
          - entities.Merchant.fields.reserve_required_cents
        distinguishing_aspect: "For a HIGH risk_tier merchant the reserve floor is RESERVE_FLOOR_BPS (500) of SETTLED trailing volume: once a settlement settles, the reserve is 500 bps of 10000000 = 500000 cents and is withheld into reserve_held_cents."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A HIGH-risk USD category and an ACTIVE DIRECT merchant with two captured settlements of 10000000 cents each in batches 1 and 2."
            - "Batch 2 is finalized, which settles the batch-1 settlement."
          setup_api_calls:
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkIssuer
            - call: "POST /network/industry-categories"
              payload: { industry_code: "USD-5812", industry_name: "USD Dining", risk_tier: "HIGH", base_discount_rate_bps: 250, high_risk_flag: true }
              as: NetworkAcquirer
              captures: { ic_c2: $.data.id }
            - call: "POST /network/merchants"
              payload: { industry_category_id: "${ic_c2}", merchant_name: "Calc Merchant 2", region_code: "US-NE", acquisition_channel: "DIRECT" }
              as: NetworkAcquirer
              captures: { m_c2: $.data.id, m_c2_v: $.data.version }
            - call: "POST /network/merchants/${m_c2}/accept"
              payload: { expected_merchant_version: "${m_c2_v}" }
              as: NetworkAcquirer
            - call: "POST /network/merchants/${m_c2}/activate"
              payload: {}
              as: NetworkAcquirer
            - call: "POST /network/merchants/${m_c2}/settlements"
              payload: { settlement_cycle: 1, gross_volume_cents: 10000000, refund_volume_cents: 0 }
              as: NetworkSettlementOps
              captures: { s_c2a: $.data.id }
            - call: "POST /network/merchants/${m_c2}/settlements"
              payload: { settlement_cycle: 2, gross_volume_cents: 10000000, refund_volume_cents: 0 }
              as: NetworkSettlementOps
              captures: { s_c2b: $.data.id }
          trigger:
            - call: "POST /network/merchants/${m_c2}/funding/batches/2/finalize"
              payload: {}
              as: NetworkSettlementOps
          assert:
            - "Settlement.${s_c2a}.settlement_status == SETTLED (promoted by the strictly later batch 2 finalize)"
            - "Merchant.${m_c2}.rolling_90d_settled_volume_cents == 10000000"
            - "Merchant.${m_c2}.reserve_required_cents == 500000 (500 bps of the settled volume)"
            - "Merchant.${m_c2}.volume_tier == FIXED and applied_discount_rate_bps == 188 after settled volume crossed VOLUME_THRESHOLD_CENTS"

      - name: acceptance_gap_excludes_non_acceptance_decline_reasons
        claim_type: Input Set Filtering
        grounds:
          - calculations.acceptance_gap_window
          - entities.DeclinedAttempt.fields.decline_reason
        distinguishing_aspect: "The rollup counts only MERCHANT_NOT_ACCEPTED declines; FRAUD_SUSPECT declines inside the same window are excluded from both the count and the volume."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A MEDIUM USD category and a merchant in region US-NE."
            - "Four declines inside the window: two MERCHANT_NOT_ACCEPTED (100000 each) and two FRAUD_SUSPECT (1000000 each)."
          setup_api_calls:
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkIssuer
            - call: "POST /network/industry-categories"
              payload: { industry_code: "USD-5812", industry_name: "USD Dining", risk_tier: "MEDIUM", base_discount_rate_bps: 250, high_risk_flag: false }
              as: NetworkAcquirer
              captures: { ic_c3: $.data.id }
            - call: "POST /network/merchants"
              payload: { industry_category_id: "${ic_c3}", merchant_name: "Calc Merchant 3", region_code: "US-NE", acquisition_channel: "DIRECT" }
              as: NetworkAcquirer
              captures: { m_c3: $.data.id }
            - call: "POST /network/merchants/${m_c3}/declined-attempts"
              payload: { card_product: "PLATINUM", attempted_amount_cents: 100000, decline_reason: "MERCHANT_NOT_ACCEPTED", occurred_at: "2026-08-10T00:00:00Z" }
              as: NetworkAcquirer
            - call: "POST /network/merchants/${m_c3}/declined-attempts"
              payload: { card_product: "PLATINUM", attempted_amount_cents: 100000, decline_reason: "MERCHANT_NOT_ACCEPTED", occurred_at: "2026-08-11T00:00:00Z" }
              as: NetworkAcquirer
            - call: "POST /network/merchants/${m_c3}/declined-attempts"
              payload: { card_product: "GOLD", attempted_amount_cents: 1000000, decline_reason: "FRAUD_SUSPECT", occurred_at: "2026-08-12T00:00:00Z" }
              as: NetworkAcquirer
            - call: "POST /network/merchants/${m_c3}/declined-attempts"
              payload: { card_product: "GOLD", attempted_amount_cents: 1000000, decline_reason: "FRAUD_SUSPECT", occurred_at: "2026-08-13T00:00:00Z" }
              as: NetworkAcquirer
          trigger:
            - call: "POST /network/acceptance-gaps/rollup"
              payload: { region_code: "US-NE", industry_category_id: "${ic_c3}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-31T00:00:00Z", window_days: 30 }
              as: NetworkAcquirer
              captures: { gap_c3: $.data.id }
          assert:
            - "AcceptanceGap.${gap_c3}.decline_count == 2 (only MERCHANT_NOT_ACCEPTED)"
            - "AcceptanceGap.${gap_c3}.declined_volume_cents == 200000 (the two 100000 declines; the 2000000 of fraud declines excluded)"
            - "AcceptanceGap.${gap_c3}.qualified_status == BELOW_THRESHOLD (2 < the minimum of 3)"

      - name: dispute_priority_standard_below_the_amount_boundary
        claim_type: Precision
        grounds:
          - entities.Dispute.fields.priority
        excluded_because:
          difficulty_instance: dispute_priority_crosses_at_exact_amount
          rationale: "The 49999/50000 boundary on dispute priority is asserted as the named §1.8 boundary instance."

  # ===========================================================================
  - section: validations
    instances:

      - name: offer_create_with_unknown_field_returns_invalid_request
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "An unknown body field on offer creation is rejected with ERR_INVALID_REQUEST rather than silently ignored."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An ACTIVE merchant."
          setup_api_calls:
            - call: "POST /network/_clock/set_current_utc"
