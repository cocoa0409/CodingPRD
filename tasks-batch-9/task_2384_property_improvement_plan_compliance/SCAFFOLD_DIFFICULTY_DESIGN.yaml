              payload: { resolution: "REVISE", revised_cost_cents: 9000000, panel_decision_note: "Re-scoped after the millwork survey; the owner's figure is accepted." }
              as: BrandManager
              as_user_id: "bm-001"
          assert:
            - "link 1: PipItem.${item_a_id}.approved_cost_cents == 9000000 while PipItem.${item_a_id}.brand_estimated_cost_cents == 4000000"
            - "link 2: PipItem.${item_a_id}.item_funding_cents == 10642500 and PipPlan.${plan_id}.funding_requirement_cents == 16555000"
            - "link 2: PipItem.${item_a_id}.priority_rank == 1 and PipItem.${item_b_id}.priority_rank == 2 (the ranks swapped)"
            - "link 3: PipPlan.${plan_id}.funding_gap_cents == 5912500 and CapitalBudget.${budget_id}.status == UNDERFUNDED"
            - "link 4: Property.${prop_id}.compliance_risk_score == 75 and Property.${prop_id}.compliance_posture == AT_RISK"
            - "link 5: FranchiseeAccount.${fr_id}.standing == WATCH"
            - "GET /pip/compliance-ledger-entries?plan_id=${plan_id} contains one entry with entry_type == COST_REVISED and delta_cents == 5000000"
            - "PipPlan.${plan_id}.status == OWNER_ACKNOWLEDGED (the cascade never touches the lifecycle dimension) and PipPlan.${plan_id}.dispute_state == DISPUTE_RESOLVED_REVISED"

