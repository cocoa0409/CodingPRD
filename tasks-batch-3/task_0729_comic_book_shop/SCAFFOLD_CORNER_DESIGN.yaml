        claim_type: Listing
        grounds: [endpoints, entities.ComicIssue]
        distinguishing_aspect: "GET /api/comic-issues returns a paginated array envelope with total_count and has_more."
        test_recipe:
          setup: ["One series with two issues."]
          setup_api_calls:
            - call: "POST /api/comic-series"
              payload: { title: "Lst", publisher: "Acme" }
