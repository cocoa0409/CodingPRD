              captures: { c_bpd100: "$.data.id" }
            - call: "POST /panel-shop/components"
              payload: { part_number: "CON-5", component_class: "CONTACTOR", unit_cost_cents: 8000, lead_time_days: 5, sccr_ka: 5, heat_dissipation_w: 20 }
              as: QAManager
