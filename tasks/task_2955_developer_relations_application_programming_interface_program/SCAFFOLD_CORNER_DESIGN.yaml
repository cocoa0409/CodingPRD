          One representative exclusive operation per role is exercised in a single run, which
          proves the role table is wired end to end rather than merely restrictive: the
          anonymous self-registration surface works without any prior identity, the developer
          acts on its own row, and the three operator roles each reach their own verb on the
          same application and case.
