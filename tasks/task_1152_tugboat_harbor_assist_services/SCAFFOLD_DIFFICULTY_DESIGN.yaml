scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_provisional_vs_final_standby_divergence
        grounds:
          - calculations.invoice_charge
          - calculations.standby_blocks
          - state_machines.Invoice.PROVISIONAL_to_FINALIZED
          - entities.Invoice.fields.variant_basis
        distinguishing_aspect: |
          Same job data priced twice: the PROVISIONAL invoice (SCHEDULED basis, standby forced to 0)
          totals 740000 cents while the FINALIZED invoice (ACTUAL basis, actual_start 45 minutes late)
          totals 765000 cents — the dual variant lives on the Invoice/fiscal domain.
        test_recipe:
          setup:
            - "Tariff TAR-DOCK-01 (DOCKING, base 500000, free standby 30, 15-min blocks at 25000, no surcharge)"
            - "Vessel MV Aurora (DWT 40000, LOA 180.0) -> required bollard pull 60.0"
            - "Tug Atlas (bollard 60.0, hourly 120000) with a current PASSED gear inspection"
            - "Job scheduled 2026-06-01T08:00:00Z-10:00:00Z, CONFIRMED, assignment CONFIRMED, pilot booking CONFIRMED, DISPATCHED"
            - "Logical clock advanced to 2026-06-01T08:45:00Z before start (45-minute standby)"
          setup_api_calls:
            - call: "POST /api/tugs"
              payload: { name: "Tug Atlas", bollard_pull_tons: 60.0, horsepower: 5000, hourly_rate_cents: 120000, insured_value_cents: 20000000 }
              as: PortAdmin
              captures: { tug_a: $.data.id }
            - call: "POST /api/vessels"
              payload: { name: "MV Aurora", imo_number: "IMO9074729", deadweight_tonnage: 40000, loa_meters: 180.0 }
              as: PortAdmin
              captures: { v1: $.data.id }
            - call: "POST /api/pilots"
              payload: { name: "Pilot Reyes", license_class: "CLASS_I" }
              as: PortAdmin
              captures: { p1: $.data.id }
            - call: "POST /api/tariff-rates"
              payload: { tariff_code: "TAR-DOCK-01", maneuver_type: "DOCKING", base_fee_cents: 500000, standby_block_rate_cents: 25000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z", free_standby_minutes: 30, standby_block_minutes: 15, weather_surcharge_pct: 0 }
              as: PortAdmin
              captures: { t1: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PortAdmin
            - call: "POST /api/job-orders"
              payload: { vessel_id: "${v1}", tariff_rate_id: "${t1}", maneuver_type: "DOCKING", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T10:00:00Z" }
              as: VesselAgent
              as_user_id: "${v1}"
              captures: { job1: $.data.id }
            - call: "POST /api/job-orders/${job1}/confirm"
              payload: {}
              as: PortDispatcher
              captures: { job_v2: $.data.version }
            - call: "POST /api/gear-inspections"
              payload: { tug_id: "${tug_a}", inspection_item: "TOW_LINE", outcome: "PASSED", inspected_at: "2026-05-01T00:00:00Z", next_due_at: "2026-12-31T00:00:00Z" }
              as: MarineSurveyor
            - call: "POST /api/tug-assignments"
              payload: { job_order_id: "${job1}", tug_id: "${tug_a}", window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T10:00:00Z", expected_job_order_version: "${job_v2}" }
              as: PortDispatcher
              captures: { asg1: $.data.id }
            - call: "POST /api/tug-assignments/${asg1}/confirm"
              payload: {}
              as: TugCaptain
              as_user_id: "${tug_a}"
            - call: "POST /api/pilot-bookings"
              payload: { job_order_id: "${job1}", pilot_id: "${p1}", window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T10:00:00Z" }
              as: PortDispatcher
              captures: { pb1: $.data.id }
            - call: "POST /api/pilot-bookings/${pb1}/confirm"
              payload: {}
              as: Pilot
              as_user_id: "${p1}"
            - call: "POST /api/job-orders/${job1}/dispatch"
              payload: {}
              as: PortDispatcher
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:45:00Z" }
              as: PortAdmin
            - call: "POST /api/job-orders/${job1}/start"
              payload: {}
              as: PortDispatcher
            - call: "POST /api/job-orders/${job1}/complete"
              payload: {}
              as: PortDispatcher
          trigger:
            - call: "GET /api/invoices"
              payload: { job_order_id: "${job1}" }
              as: PortDispatcher
              captures: { inv1: "$.data[0].id", inv1_prov_total: "$.data[0].total_cents", inv1_v: "$.data[0].version" }
            - call: "POST /api/invoices/${inv1}/finalize"
              payload: { expected_invoice_version: "${inv1_v}" }
              as: PortDispatcher
              captures: { inv1_final_total: $.data.total_cents, inv1_basis: $.data.variant_basis }
          assert:
            - "Invoice.${inv1}.total_cents at PROVISIONAL (captured inv1_prov_total) == 740000"
            - "Invoice.${inv1}.standby_minutes at PROVISIONAL == 0"
            - "After finalize: Invoice.${inv1}.total_cents == 765000 (500000 base + 240000 tug hire + 25000 standby = 1 block of ceil((45-30)/15))"
            - "Invoice.${inv1}.variant_basis == ACTUAL"
            - "JobOrder.${job1}.status == INVOICED"

      - name: liability_per_incident_vs_per_voyage_divergence
        grounds:
          - calculations.liability_settlement
          - entities.DamageClaim.fields.liability_variant
          - state_machines.DamageClaim.transitions
        distinguishing_aspect: |
          Identical claimed_amount_cents (12000000) produces payout 9000000 under PER_INCIDENT
          (cap = max(10000000, 0.5 * 20000000) = 10000000) versus 10800000 under PER_VOYAGE
          (cap = max(10000000, 20 * 740000) = 14800000) — the dual variant lives on the
          DamageClaim/liability domain, a different entity domain from the Invoice variant.
        test_recipe:
          setup:
            - "Job completed on schedule (clock 2026-06-01T08:00:00Z at start) so provisional invoice total is 740000"
            - "Two MINOR incidents on Tug Atlas linked to the job, both left REPORTED"
            - "Claim C1 filed BEFORE invoice finalization; claim C2 (on incident I2) filed AFTER finalization"
          setup_api_calls:
            - call: "POST /api/tugs"
              payload: { name: "Tug Atlas", bollard_pull_tons: 60.0, horsepower: 5000, hourly_rate_cents: 120000, insured_value_cents: 20000000 }
              as: PortAdmin
              captures: { tug_a: $.data.id }
            - call: "POST /api/vessels"
              payload: { name: "MV Aurora", imo_number: "IMO9074729", deadweight_tonnage: 40000, loa_meters: 180.0 }
              as: PortAdmin
              captures: { v1: $.data.id }
            - call: "POST /api/pilots"
              payload: { name: "Pilot Reyes", license_class: "CLASS_I" }
              as: PortAdmin
              captures: { p1: $.data.id }
            - call: "POST /api/tariff-rates"
              payload: { tariff_code: "TAR-DOCK-01", maneuver_type: "DOCKING", base_fee_cents: 500000, standby_block_rate_cents: 25000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z", free_standby_minutes: 30, standby_block_minutes: 15, weather_surcharge_pct: 0 }
              as: PortAdmin
              captures: { t1: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PortAdmin
            - call: "POST /api/job-orders"
              payload: { vessel_id: "${v1}", tariff_rate_id: "${t1}", maneuver_type: "DOCKING", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T10:00:00Z" }
              as: VesselAgent
              as_user_id: "${v1}"
              captures: { job1: $.data.id }
            - call: "POST /api/job-orders/${job1}/confirm"
              payload: {}
              as: PortDispatcher
              captures: { job_v2: $.data.version }
            - call: "POST /api/gear-inspections"
              payload: { tug_id: "${tug_a}", inspection_item: "TOW_LINE", outcome: "PASSED", inspected_at: "2026-05-01T00:00:00Z", next_due_at: "2026-12-31T00:00:00Z" }
              as: MarineSurveyor
            - call: "POST /api/tug-assignments"
              payload: { job_order_id: "${job1}", tug_id: "${tug_a}", window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T10:00:00Z", expected_job_order_version: "${job_v2}" }
              as: PortDispatcher
              captures: { asg1: $.data.id }
            - call: "POST /api/tug-assignments/${asg1}/confirm"
              payload: {}
              as: TugCaptain
              as_user_id: "${tug_a}"
            - call: "POST /api/pilot-bookings"
              payload: { job_order_id: "${job1}", pilot_id: "${p1}", window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T10:00:00Z" }
              as: PortDispatcher
              captures: { pb1: $.data.id }
            - call: "POST /api/pilot-bookings/${pb1}/confirm"
              payload: {}
              as: Pilot
              as_user_id: "${p1}"
            - call: "POST /api/job-orders/${job1}/dispatch"
              payload: {}
              as: PortDispatcher
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: PortAdmin
            - call: "POST /api/job-orders/${job1}/start"
              payload: {}
              as: PortDispatcher
            - call: "POST /api/job-orders/${job1}/complete"
              payload: {}
              as: PortDispatcher
            - call: "POST /api/incidents"
              payload: { tug_id: "${tug_a}", job_order_id: "${job1}", incident_type: "GEAR_FAILURE", severity: "MINOR", occurred_at: "2026-06-01T09:30:00Z", description: "Tow line parted, no damage" }
              as: TugCaptain
              as_user_id: "${tug_a}"
              captures: { inc1: $.data.id }
          trigger:
            - call: "POST /api/damage-claims"
              payload: { incident_id: "${inc1}", vessel_id: "${v1}", claimed_amount_cents: 12000000 }
              as: VesselAgent
              as_user_id: "${v1}"
              captures: { claim1: $.data.id, claim1_variant: $.data.liability_variant, claim1_cap: $.data.liability_cap_cents, claim1_payout: $.data.payout_cents }
            - call: "GET /api/invoices"
              payload: { job_order_id: "${job1}" }
              as: PortDispatcher
              captures: { inv1: "$.data[0].id", inv1_v: "$.data[0].version" }
            - call: "POST /api/invoices/${inv1}/finalize"
              payload: { expected_invoice_version: "${inv1_v}" }
              as: PortDispatcher
            - call: "POST /api/incidents"
              payload: { tug_id: "${tug_a}", job_order_id: "${job1}", incident_type: "CONTACT_DAMAGE", severity: "MINOR", occurred_at: "2026-06-01T09:45:00Z", description: "Minor contact with fender" }
              as: TugCaptain
              as_user_id: "${tug_a}"
              captures: { inc2: $.data.id }
            - call: "POST /api/damage-claims"
              payload: { incident_id: "${inc2}", vessel_id: "${v1}", claimed_amount_cents: 12000000 }
              as: VesselAgent
              as_user_id: "${v1}"
              captures: { claim2: $.data.id, claim2_variant: $.data.liability_variant, claim2_cap: $.data.liability_cap_cents, claim2_payout: $.data.payout_cents }
          assert:
            - "DamageClaim.${claim1}.liability_variant == PER_INCIDENT"
            - "DamageClaim.${claim1}.liability_cap_cents == 10000000 (max(10000000, round(0.5*20000000)))"
            - "DamageClaim.${claim1}.payout_cents == 9000000 (min(12000000,10000000) - round(0.10*10000000))"
            - "DamageClaim.${claim2}.liability_variant == PER_VOYAGE"
            - "DamageClaim.${claim2}.liability_cap_cents == 14800000 (max(10000000, 20*740000))"
            - "DamageClaim.${claim2}.payout_cents == 10800000 (min(12000000,14800000) - round(0.10*12000000))"
            - "DamageClaim.${claim1}.payout_cents != DamageClaim.${claim2}.payout_cents for identical claimed_amount_cents"

  - rule_id: combinatorial_formula
    instances:
      - name: required_bollard_pull_three_input_floor_and_multiplier
        grounds:
          - calculations.required_bollard_pull
          - entities.JobOrder.fields.required_bollard_pull_tons
        distinguishing_aspect: |
          Mode (a) combinatorial: three inputs (deadweight_tonnage, maneuver_type factor tier,
          loa_meters threshold) interact non-linearly — the LOA multiplier branch fires only when
          loa > 200, and the max() floor clamps a small vessel to 20.0.
        test_recipe:
          setup:
            - "Vessel A: DWT 60000, LOA 210.0, DOCKING job -> base 90.0 then LOA branch x1.25"
            - "Vessel B: DWT 15000, LOA 150.0, SHIFTING job -> base 15.0 then floor clamps to 20.0"
          setup_api_calls:
            - call: "POST /api/vessels"
              payload: { name: "MV Titan", imo_number: "IMO1111111", deadweight_tonnage: 60000, loa_meters: 210.0 }
              as: PortAdmin
              captures: { va: $.data.id }
            - call: "POST /api/vessels"
              payload: { name: "MV Sprite", imo_number: "IMO2222222", deadweight_tonnage: 15000, loa_meters: 150.0 }
              as: PortAdmin
              captures: { vb: $.data.id }
            - call: "POST /api/tariff-rates"
              payload: { tariff_code: "TAR-DOCK-01", maneuver_type: "DOCKING", base_fee_cents: 500000, standby_block_rate_cents: 25000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }
              as: PortAdmin
              captures: { td: $.data.id }
            - call: "POST /api/tariff-rates"
              payload: { tariff_code: "TAR-SHIFT-01", maneuver_type: "SHIFTING", base_fee_cents: 100000, standby_block_rate_cents: 10000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }
              as: PortAdmin
              captures: { ts: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PortAdmin
            - call: "POST /api/job-orders"
              payload: { vessel_id: "${va}", tariff_rate_id: "${td}", maneuver_type: "DOCKING", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T10:00:00Z" }
              as: VesselAgent
              as_user_id: "${va}"
              captures: { job_a: $.data.id, req_a: $.data.required_bollard_pull_tons }
            - call: "POST /api/job-orders"
              payload: { vessel_id: "${vb}", tariff_rate_id: "${ts}", maneuver_type: "SHIFTING", scheduled_start: "2026-06-02T08:00:00Z", scheduled_end: "2026-06-02T09:00:00Z" }
              as: VesselAgent
              as_user_id: "${vb}"
              captures: { job_b: $.data.id, req_b: $.data.required_bollard_pull_tons }
          trigger:
            - call: "GET /api/job-orders/${job_a}"
              payload: {}
              as: PortDispatcher
              captures: { req_a2: $.data.required_bollard_pull_tons }
          assert:
            - "JobOrder.${job_a}.required_bollard_pull_tons == 112.5 (60000*1.5/1000=90.0, loa 210 > 200 so x1.25)"
            - "JobOrder.${job_b}.required_bollard_pull_tons == 20.0 (15000*1.0/1000=15.0 clamped by MIN_BOLLARD_PULL_TONS floor)"

      - name: invoice_per_line_rounding_then_sum
        grounds:
          - calculations.invoice_charge
        distinguishing_aspect: |
          Mode (b) nested rounding: two tug lines of 100001 cents/h x 0.33h = 33000.33 each are
          rounded half-up per line (33000) BEFORE summation, giving 66000; the rejected
          sum-then-round order would give 66001. The scaffold pins per-line-then-sum.
        test_recipe:
          setup:
            - "Tariff TAR-SHIFT-RR: SHIFTING, base_fee_cents 0, standby block 15 min at 25000, no surcharge"
            - "Vessel MV Sprite (DWT 10000, LOA 100.0) -> required bollard pull 20.0"
            - "Tugs R1 and R2, each hourly_rate_cents 100001, bollard 25.0, both with current PASSED gear inspections"
            - "Job 2026-06-01T08:00:00Z-09:00:00Z; assignment R1 window 08:00-08:20, assignment R2 window 08:20-08:40; pilot confirmed; clock exactly 08:00:00Z at start (zero standby)"
          setup_api_calls:
            - call: "POST /api/tugs"
              payload: { name: "Tug R1", bollard_pull_tons: 25.0, horsepower: 2200, hourly_rate_cents: 100001, insured_value_cents: 8000000 }
              as: PortAdmin
              captures: { tug_r1: $.data.id }
            - call: "POST /api/tugs"
              payload: { name: "Tug R2", bollard_pull_tons: 25.0, horsepower: 2200, hourly_rate_cents: 100001, insured_value_cents: 8000000 }
              as: PortAdmin
              captures: { tug_r2: $.data.id }
            - call: "POST /api/vessels"
              payload: { name: "MV Sprite", imo_number: "IMO2222222", deadweight_tonnage: 10000, loa_meters: 100.0 }
              as: PortAdmin
              captures: { vb: $.data.id }
            - call: "POST /api/pilots"
              payload: { name: "Pilot Reyes", license_class: "CLASS_I" }
              as: PortAdmin
              captures: { p1: $.data.id }
            - call: "POST /api/tariff-rates"
              payload: { tariff_code: "TAR-SHIFT-RR", maneuver_type: "SHIFTING", base_fee_cents: 0, standby_block_rate_cents: 25000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z", free_standby_minutes: 30, standby_block_minutes: 15, weather_surcharge_pct: 0 }
              as: PortAdmin
              captures: { tr: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PortAdmin
            - call: "POST /api/job-orders"
              payload: { vessel_id: "${vb}", tariff_rate_id: "${tr}", maneuver_type: "SHIFTING", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T09:00:00Z" }
              as: VesselAgent
              as_user_id: "${vb}"
              captures: { job1: $.data.id }
            - call: "POST /api/job-orders/${job1}/confirm"
              payload: {}
              as: PortDispatcher
              captures: { job_v2: $.data.version }
            - call: "POST /api/gear-inspections"
              payload: { tug_id: "${tug_r1}", inspection_item: "TOW_LINE", outcome: "PASSED", inspected_at: "2026-05-01T00:00:00Z", next_due_at: "2026-12-31T00:00:00Z" }
              as: MarineSurveyor
            - call: "POST /api/gear-inspections"
              payload: { tug_id: "${tug_r2}", inspection_item: "TOW_LINE", outcome: "PASSED", inspected_at: "2026-05-01T00:00:00Z", next_due_at: "2026-12-31T00:00:00Z" }
              as: MarineSurveyor
            - call: "POST /api/tug-assignments"
              payload: { job_order_id: "${job1}", tug_id: "${tug_r1}", window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T08:20:00Z", expected_job_order_version: "${job_v2}" }
              as: PortDispatcher
              captures: { asg1: $.data.id }
            - call: "GET /api/job-orders/${job1}"
              payload: {}
              as: PortDispatcher
              captures: { job_v3: $.data.version }
            - call: "POST /api/tug-assignments"
              payload: { job_order_id: "${job1}", tug_id: "${tug_r2}", window_start: "2026-06-01T08:20:00Z", window_end: "2026-06-01T08:40:00Z", expected_job_order_version: "${job_v3}" }
              as: PortDispatcher
              captures: { asg2: $.data.id }
            - call: "POST /api/tug-assignments/${asg1}/confirm"
              payload: {}
              as: TugCaptain
              as_user_id: "${tug_r1}"
            - call: "POST /api/tug-assignments/${asg2}/confirm"
              payload: {}
              as: TugCaptain
              as_user_id: "${tug_r2}"
            - call: "POST /api/pilot-bookings"
              payload: { job_order_id: "${job1}", pilot_id: "${p1}", window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T09:00:00Z" }
              as: PortDispatcher
              captures: { pb1: $.data.id }
            - call: "POST /api/pilot-bookings/${pb1}/confirm"
              payload: {}
              as: Pilot
              as_user_id: "${p1}"
            - call: "POST /api/job-orders/${job1}/dispatch"
              payload: {}
              as: PortDispatcher
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: PortAdmin
            - call: "POST /api/job-orders/${job1}/start"
              payload: {}
              as: PortDispatcher
          trigger:
            - call: "POST /api/job-orders/${job1}/complete"
              payload: {}
              as: PortDispatcher
            - call: "GET /api/invoices"
              payload: { job_order_id: "${job1}" }
              as: PortDispatcher
              captures: { inv1: "$.data[0].id", inv_total: "$.data[0].total_cents", inv_tug_hire: "$.data[0].tug_hire_cents" }
          assert:
            - "Invoice.${inv1}.tug_hire_cents == 66000 (2 x round_half_up(100001 * 0.33) = 2 x 33000)"
            - "Invoice.${inv1}.total_cents == 66000 (base 0, standby 0, surcharge 0) — sum-then-round would give 66001 and MUST NOT be produced"

      - name: liability_cap_before_deductible_evaluation_order
        grounds:
          - calculations.liability_settlement
        distinguishing_aspect: |
          Mode (c) pinned evaluation order: cap is computed first, min(claimed, cap) second,
          deductible is 10% of the CAPPED amount third, payout = capped - deductible last.
          Claimed 12000000 with PER_INCIDENT cap 10000000 yields payout 9000000; applying the
          deductible to the uncapped claim before the cap would wrongly yield 10000000.
        test_recipe:
          setup:
            - "Tug Atlas insured_value_cents 20000000 (PER_INCIDENT cap = max(10000000, 10000000) = 10000000)"
            - "MINOR incident with no job link; claim of 12000000 filed while incident REPORTED"
          setup_api_calls:
            - call: "POST /api/tugs"
              payload: { name: "Tug Atlas", bollard_pull_tons: 60.0, horsepower: 5000, hourly_rate_cents: 120000, insured_value_cents: 20000000 }
              as: PortAdmin
              captures: { tug_a: $.data.id }
            - call: "POST /api/vessels"
              payload: { name: "MV Aurora", imo_number: "IMO9074729", deadweight_tonnage: 40000, loa_meters: 180.0 }
              as: PortAdmin
              captures: { v1: $.data.id }
            - call: "POST /api/incidents"
              payload: { tug_id: "${tug_a}", incident_type: "GEAR_FAILURE", severity: "MINOR", occurred_at: "2026-06-01T09:30:00Z", description: "Tow line abrasion" }
              as: TugCaptain
              as_user_id: "${tug_a}"
              captures: { inc1: $.data.id }
          trigger:
            - call: "POST /api/damage-claims"
              payload: { incident_id: "${inc1}", vessel_id: "${v1}", claimed_amount_cents: 12000000 }
              as: VesselAgent
              as_user_id: "${v1}"
              captures: { claim1: $.data.id, cap: $.data.liability_cap_cents, ded: $.data.deductible_cents, payout: $.data.payout_cents }
          assert:
