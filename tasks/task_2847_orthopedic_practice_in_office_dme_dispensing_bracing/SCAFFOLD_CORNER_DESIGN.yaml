      - name: corner_prior_auth_lifecycle_constraints_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=44]
          - validations[priority=45]
          - validations[priority=46]
          - errors[ERR_PRIOR_AUTH_ALREADY_EXISTS]
          - errors[ERR_APPEAL_LIMIT_REACHED]
          - errors[ERR_APPROVED_UNITS_EXCEED_REQUEST]
          - state_machines.PriorAuthRequest.PENDED_to_SUBMITTED
          - endpoints[POST /dme/encounters/{id}/prior-auth-requests]
          - endpoints[POST /dme/prior-auth-requests/{id}/decision]
          - endpoints[POST /dme/prior-auth-requests/{id}/appeal]
        distinguishing_aspect: |
          Three authorization-book constraints that are easy to conflate. The
          approved-units rule (priority 46) is a range check against THIS
          request's requested_units, so 3 approved against 1 requested is
          refused even though 3 is a perfectly ordinary unit count. The
          "already exists" rule (priority 44) has a second, non-obvious half:
          it also refuses a request for a product whose requires_prior_auth is
          false, so the error name covers "this encounter must not have a
          PriorAuthRequest at all". The appeal limit (priority 45) is counted
          in appeal_round, not in the number of decisions: after two accepted
          appeals the third is refused while the request itself is still in a
          perfectly appealable status, which separates the limit rule from the
          status rule at priority 22.
        test_recipe:
          setup:
            - "one accredited SPINE clinic, one physician, one patient, one attested supplier"
            - "one product that requires prior authorization and one that does not"
            - "encounter 1 (auth product, 2 units) has a request that was pended, appealed, pended, appealed and pended again, so appeal_round is 2 and status is PENDED"
            - "encounter 2 (non-auth product) is verified and has no request; encounter 3 (auth product, 1 unit) has a fresh SUBMITTED request"
