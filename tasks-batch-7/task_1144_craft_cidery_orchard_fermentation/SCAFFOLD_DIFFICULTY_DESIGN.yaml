  # =======================================================================
  # Rule 8: Resource temporal-overlap conflicts across different interval semantics
  # =======================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: press_window_overlap_adjacent_allowed
        grounds:
          - calculations.press_window_overlap
          - validations[priority=10]
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [start, end). pb_a runs
          [08:00, 12:00) (240 min); pb_b scheduled at exactly 12:00 with 60
          min window — adjacent, no overlap; both allowed to be PRESSING
          sequentially. A pb_c scheduled at 11:30 with 60 min window
          overlaps pb_a and is rejected with ERR_PRESS_WINDOW_CONFLICT.
        test_recipe:
          setup:
            - "Two press batches pb_a (08:00+240min) and pb_b (12:00+60min)"
            - "Lots to support both"
          setup_api_calls:
            - call: "POST /cidery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cidery/varieties"
              payload: { code: "V14", tannin_g_per_l: 1.0, brix_at_harvest: 13.0, acidity_g_per_l: 6.0, is_bittersweet: false }
              as: OrchardManager
              captures: { v14: $.data.id }
            - call: "POST /cidery/contracts"
              payload: { grower_name: "G14", region_code: "NY", season_year: 2026, committed_weight_lbs: 400, price_per_lb_cents: 90, shortfall_penalty_cents_per_lb: 30 }
              as: OrchardManager
              captures: { c14: $.data.id, c14_v: $.data.version }
            - call: "POST /cidery/contracts/${c14}/activate"
              payload: { expected_contract_version: "${c14_v}" }
              as: OrchardManager
            - call: "POST /cidery/contracts/${c14}/harvest-lots"
              payload: { variety_id: "${v14}", received_at: "2026-09-19T10:00:00Z", weight_lbs: 200, measured_brix: 13.0, measured_tannin_g_per_l: 1.0 }
              as: OrchardManager
              captures: { h14a: $.data.id }
            - call: "POST /cidery/contracts/${c14}/harvest-lots"
              payload: { variety_id: "${v14}", received_at: "2026-09-19T11:00:00Z", weight_lbs: 200, measured_brix: 13.0, measured_tannin_g_per_l: 1.0 }
              as: OrchardManager
              captures: { h14b: $.data.id }
            - call: "POST /cidery/press-batches"
              payload:
                scheduled_press_date: "2026-09-20T08:00:00Z"
                press_window_minutes: 240
                blend_lines:
                  - { harvest_lot_id: "${h14a}", weight_lbs: 200, position: 1 }
              as: CellarLead
              captures: { pb_a: $.data.id }
            - call: "POST /cidery/press-batches"
              payload:
                scheduled_press_date: "2026-09-20T12:00:00Z"   # adjacent to pb_a end
                press_window_minutes: 60
                blend_lines:
                  - { harvest_lot_id: "${h14b}", weight_lbs: 200, position: 1 }
              as: CellarLead
              captures: { pb_b: $.data.id }
            - call: "POST /cidery/press-batches/${pb_a}/start"
              payload: {}
              as: CellarLead
          trigger:
            # Adjacent window — half-open semantics => no conflict
            - call: "POST /cidery/press-batches/${pb_b}/start"
              payload: {}
              as: CellarLead
              captures: { pb_b_started: $.data }
          assert:
            - "pb_b_started.status == PRESSING   # adjacent allowed (half-open)"

      - name: license_annual_window_spanning_calendar_year
        grounds:
          - calculations.license_volume_cap_check
          - entities.LicensePermit.fields.volume_used_liters
        distinguishing_aspect: |
          DIFFERENT interval semantics: aggregate capacity over a calendar
          year window (not geometric overlap). License cap=100 L per
          calendar year; year boundary at 2027-01-01 resets volume_used.
          Two 60 L runs in 2026 fail on the second; the same 60 L in 2027
          succeeds because the year window reset.
