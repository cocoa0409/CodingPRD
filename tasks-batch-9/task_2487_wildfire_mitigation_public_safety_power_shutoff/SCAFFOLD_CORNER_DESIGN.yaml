              as: CommunityLiaison
              captures: { e_cu2: $.data.error_id }
            - call: "GET /patrol-assignments"
              payload: { circuit_id: "00000000-0000-4000-8000-000000000000" }
              as: FieldPatrolSupervisor
              captures: { e_ci: $.data.error_id }
          assert:
            - "the seven path reads return 404 with ERR_WEATHER_STATION_NOT_FOUND, ERR_CUSTOMER_NOT_FOUND, ERR_NOTIFICATION_BATCH_NOT_FOUND, ERR_NOTIFICATION_RECORD_NOT_FOUND, ERR_MITIGATION_PROJECT_NOT_FOUND, ERR_RESOURCE_CENTER_NOT_FOUND and ERR_PLAN_FILING_NOT_FOUND in that order"
            - "the exclude returns 404 ERR_EVENT_SCOPE_NOT_FOUND even though its body is well formed"
            - "the three unknown query filters return 404 ERR_NOTIFICATION_BATCH_NOT_FOUND, ERR_CUSTOMER_NOT_FOUND and ERR_CIRCUIT_NOT_FOUND"
            - "every one of the eleven responses has response_type error with both error_id and message populated"

