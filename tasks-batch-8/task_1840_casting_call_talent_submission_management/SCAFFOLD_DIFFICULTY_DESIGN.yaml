              payload: { weekly_rate_cents: 1000000, guarantee_cents: 800000, expires_at: "2026-08-20T00:00:00Z" }
              as: CastingDirector
              captures: { offer_r1: $.data.id, offer_r1_v: $.data.version }
          trigger:
            # agent counters round 1 -> creates round 2
            - call: "POST /casting/offers/${offer_r1}/counter"
              payload: { weekly_rate_cents: 1200000, guarantee_cents: 900000, expires_at: "2026-08-21T00:00:00Z", expected_offer_version: "${offer_r1_v}" }
