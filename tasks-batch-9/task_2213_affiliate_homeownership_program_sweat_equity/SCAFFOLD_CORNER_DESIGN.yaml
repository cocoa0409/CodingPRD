      - name: general_seats_fill_while_partner_seats_need_a_site_assignment
        claim_type: violation_to_error
        grounds: ["validations[priority=30]", errors.ERR_SHIFT_ROLE_FULL, errors.ERR_PARTNER_MEMBER_NOT_ON_SITE, entities.ConstructionShift.fields.volunteer_slots, entities.BuildSite.fields.assigned_household_id, "endpoints.POST /homeownership/shift-assignments"]
        distinguishing_aspect: "One rule, two very different seat economics: GENERAL_VOLUNTEER seats are capped at volunteer_slots, while HOMEOWNER_PARTNER seats are uncapped but gated on the member's household being the site's assigned_household_id. The fixture exhausts the general cap, is refused a partner seat for a household with no claim on the site, then wins the same partner seat once a mortgage application pins assigned_household_id — proving the partner refusal was about the site link and not about capacity."
        test_recipe:
          setup:
            - "Canonical program with one READY_TO_BUILD site whose assigned_household_id is still null. Household A is SELECTED (composite 91.0) and holds one adult APPLICANT; household B is a separate DRAFT intake in the same program with its own adult APPLICANT. Two adult volunteers hold waivers to 2027-12-31. A single-seat shift on 2026-08-05T08:00 to 12:00 is OPEN with volunteer one CONFIRMED, so confirmed_general_count is 1 against volunteer_slots of 1."
