            - call: "POST /care/service-authorizations"
              payload: { care_plan_id: "${cp}", vendor_id: "${vnd}", expected_care_plan_version: "${cp_v_a}", coverage_start: "2026-09-01T08:00:00Z", coverage_end: "2026-09-01T16:00:00Z", concurrent_caregivers: 2, hourly_cost_cents: 4000 }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { auth_1: $.data.id }
            - call: "PATCH /care/service-authorizations/${auth_1}/state"
              payload: { to_state: "AUTHORIZED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
            - call: "GET /care/care-plans/${cp}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { cp_v_b: $.data.version }
            - call: "POST /care/service-authorizations"
              payload: { care_plan_id: "${cp}", vendor_id: "${vnd}", expected_care_plan_version: "${cp_v_b}", coverage_start: "2026-09-01T08:00:00Z", coverage_end: "2026-09-01T16:00:00Z", concurrent_caregivers: 1, hourly_cost_cents: 4000 }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { auth_2: $.data.id }
            - call: "GET /care/care-plans/${cp}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { cp_v_c: $.data.version }
            - call: "POST /care/service-authorizations"
              payload: { care_plan_id: "${cp}", vendor_id: "${vnd}", expected_care_plan_version: "${cp_v_c}", coverage_start: "2026-09-01T16:00:00Z", coverage_end: "2026-09-01T20:00:00Z", concurrent_caregivers: 2, hourly_cost_cents: 4000 }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { auth_3: $.data.id }
            - call: "GET /care/care-plans/${cp}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { cp_v_d: $.data.version }
            - call: "POST /care/service-authorizations"
