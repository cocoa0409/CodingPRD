            - call: "POST /api/communities/${alpha_id}/content-decisions"
              payload: { auto_detection_backlog_item_id: "${item_role}", decision_outcome: "BAN_ISSUED", decision_confidence: 0.90, dissection_band: 0, precedent_approval_count: 0 }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                dec_role: $.data.id
          trigger:
            - call: "POST /api/community-administration/brigade-escalations"
              payload: { cluster_id: "${cluster_id}", sanction_ladder: "BAN" }
              as: Account
              as_user_id: "user-x"
              captures:
                error_escalate: $.data.error_id
            - call: "POST /api/community-administration/decision-revisions"
              payload: { decision_id: "${dec_role}" }
              as: Account
              as_user_id: "user-x"
              captures:
                error_revise: $.data.error_id
          assert:
            - "the escalation attempt returns 403 with error_escalate == ERR_FORBIDDEN_ROLE"
            - "the revision attempt returns 403 with error_revise == ERR_FORBIDDEN_ROLE"
            - "BrigadingCluster.${cluster_id}.status == DETECTED"
            - "ContentDecision.${dec_role}.status == RECORDED"

      - name: entity_backed_moderator_identity_is_read_from_the_team_rows
        claim_type: "peer_roles"
        grounds:
          - roles.Moderator.identity
          - roles.Account.identity
          - entities.Moderator.fields.moderator_account_id
          - endpoints.GET_/api/communities/{id}/moderators
        distinguishing_aspect: "Account and Moderator are both entity_backed, so the same X-User-ID acts as Moderator when it appears on a row of the community's team and as Account when it does not; the ownership check resolves through the moderator rows rather than through the header value alone."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community founded by mod-alpha, with mod-beta appointed as a regular moderator."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha" }
              as: Account
              as_user_id: "mod-alpha"
              captures:
                alpha_id: $.data.id
                alpha_v: $.data.version
            - call: "POST /api/communities/${alpha_id}/moderators"
              payload: { moderator_account_id: "mod-beta", display_name: "Mod Beta", moderator_role: "REGULAR_MODERATOR", expected_community_version: "${alpha_v}" }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                beta_row: $.data.id
          trigger:
            - call: "GET /api/communities/${alpha_id}/moderators"
              payload: { status: "ACTIVE" }
              as: Moderator
              as_user_id: "mod-beta"
          assert:
            - "the response status is 200 and returns exactly 2 rows"
            - "the row ${beta_row} reports moderator_account_id == \"mod-beta\" and status ACTIVE with moderator_role REGULAR_MODERATOR"
            - "the founding moderator row reports moderator_account_id == \"mod-alpha\", is_top_moderator true and top_rank 1"
            - "the same X-User-ID mod-beta is accepted as Account on POST /api/communities/${alpha_id}/posts because the Account role is entity_backed on the account rather than on the team"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: optimistic_concurrency_stale_version_on_protest_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[protest-create-stale-community]
          - endpoints.POST_/api/communities/{id}/protests
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "The protest create carries expected_community_version, so a create sent with a version the client observed before an intervening write is refused with 412 ERR_STALE_VERSION even though a protest legitimately supersedes the previous access-mode intent."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community whose version was 1 at creation and is 3 after two later writes."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha" }
              as: Account
              as_user_id: "mod-alpha"
              captures:
                alpha_id: $.data.id
            - call: "GET /api/communities/${alpha_id}/moderators"
              payload: {}
              as: PlatformAdmin
              captures:
                alpha_v: $.data[0].version
                mod_a_row: $.data[0].id
            - call: "POST /api/communities/${alpha_id}/rules"
              payload: { rule_code: "R-1", rule_text: "Be civil", rule_band: 1, is_sitewide_floor: false, expected_community_version: "${alpha_v}" }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                alpha_v2: $.data.version
            - call: "POST /api/communities/${alpha_id}/rules"
              payload: { rule_code: "R-2", rule_text: "No spam", rule_band: 1, is_sitewide_floor: false, expected_community_version: "${alpha_v2}" }
              as: Moderator
              as_user_id: "mod-alpha"
          trigger:
            - call: "POST /api/communities/${alpha_id}/protests"
              payload: { requested_access_mode: "READ_ONLY", conflicting_cross_power_account_ids: [], expected_community_version: "${alpha_v}" }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                error_id: $.data.error_id
          assert:
            - "the response status is 412 and error_id == ERR_STALE_VERSION"
            - "GET /api/communities/${alpha_id}/protests returns 0 rows"
            - "GET /api/communities/${alpha_id} reports version 4, one more than the observed value that succeeded last"
            - "Community.${alpha_id}.state == ACTIVE"

      - name: cascade_ordering_within_one_decision_request
        claim_type: cascading_side_effects
        grounds:
          - endpoints.POST_/api/communities/{id}/content-decisions
          - state_machines.Community.ACTIVE_to_ACTIVE
          - state_machines.ContentReport.OPEN_to_RESOLVED
          - entities.Community.fields.health_index
        distinguishing_aspect: "One decision request fans out in a fixed order: the backlog item is consumed before the report resolves, the report resolves before the health recompute reads the OPEN set, and the health recompute runs before the posture gate, so the community sees the post-decision health and not the pre-decision value."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community with one OPEN tier-1 report, an ACTIVE top moderator and an OPEN backlog item keyed to that report's source."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha" }
              as: Account
              as_user_id: "mod-alpha"
              captures:
                alpha_id: $.data.id
            - call: "POST /api/communities/${alpha_id}/posts"
              payload: { author_account_id: "u-target", title: "Title", body: "Body", post_type: "TEXT" }
              as: Account
              as_user_id: "u-target"
              captures:
                post_id: $.data.id
            - call: "POST /api/communities/${alpha_id}/content-reports"
              payload: { content_source_type: "POST", content_source_id: "${post_id}", reporter_account_id: "rep-1", report_reason_code: "SPAM", resolution_tier: 1 }
              as: Account
              as_user_id: "rep-1"
              captures:
                rep_id: $.data.id
            - call: "POST /api/communities/${alpha_id}/automated-detection-backlog-items"
              payload: { source_type: "POST", source_id: "${post_id}", subject_account_id: "u-target", signal_severity_band: 3, detection_confidence: 0.80, overlap_ratio: 0.20, published_at_utc: "2026-09-12T00:00:00Z" }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                item_id: $.data.id
          trigger:
            - call: "POST /api/communities/${alpha_id}/content-decisions"
              payload: { auto_detection_backlog_item_id: "${item_id}", decision_outcome: "REMOVE", decision_confidence: 0.80, dissection_band: 0, precedent_approval_count: 0 }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                dec_id: $.data.id
          assert:
            - "the response status is 201"
            - "GET /api/communities/${alpha_id}/automated-detection-backlog-items/${item_id} reports status == CONSUMED"
            - "ContentReport.${rep_id}.status == RESOLVED"
            - "GET /api/communities/${alpha_id}/content-reports?status=OPEN returns 0 rows"
            - "GET /api/communities/${alpha_id} reports open_report_weight == 0.00 and health_index == 100.00"
            - "Community.${alpha_id}.state == ACTIVE because the post-decision health never crossed the restriction gate"

      - name: derived_field_reconciliation_after_a_late_report
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Community.fields.open_report_weight
          - entities.Community.fields.health_index
          - endpoints.POST_/api/communities/{id}/content-reports
        distinguishing_aspect: "The denormalized open_report_weight and health_index are reconciled on every report write rather than being cached at creation, so a report filed after the community was read immediately changes both values."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community whose health was read at 100.00, then one tier-2 report filed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha" }
              as: Account
              as_user_id: "mod-alpha"
              captures:
                alpha_id: $.data.id
          trigger:
            - call: "GET /api/communities/${alpha_id}"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/communities/${alpha_id}/content-reports"
              payload: { content_source_type: "COMMENT", content_source_id: "cmt-late", reporter_account_id: "rep-late", report_reason_code: "IMPERSONATION", resolution_tier: 2 }
              as: Account
              as_user_id: "rep-late"
              captures:
                rep_late: $.data.id
            - call: "GET /api/communities/${alpha_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "the first read reports open_report_weight == 0.00 and health_index == 100.00"
            - "the second read reports open_report_weight == 0.50 and health_index == 99.50"
            - "GET /api/communities/${alpha_id}/content-reports?status=OPEN returns exactly 1 row, the report ${rep_late}"

      - name: soft_archival_keeps_children_queryable
        claim_type: soft_delete
        grounds:
          - state_machines.Community.QUARANTINED_to_ARCHIVED
          - endpoints.GET_/api/communities
          - endpoints.GET_/api/communities/{id}/moderators
        distinguishing_aspect: "Archiving deactivates the community and its children but leaves every row queryable, so the archived community still appears in an unfiltered list while its team reports zero ACTIVE moderators."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One community already quarantined by the sanction gate and then archived."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Archive", description: "To be archived" }
              as: Account
              as_user_id: "mod-arch"
              captures:
                arch_id: $.data.id
            - call: "POST /api/community-administration/account-sanctions"
              payload: { account_id: "u-arch-1", community_id: "${arch_id}", decision_outcome: "BAN_ISSUED" }
              as: PlatformAdmin
            - call: "POST /api/community-administration/account-sanctions"
              payload: { account_id: "u-arch-2", community_id: "${arch_id}", decision_outcome: "BAN_ISSUED" }
              as: PlatformAdmin
            - call: "POST /api/community-administration/institution-negotiations"
              payload: { community_id: "${arch_id}" }
              as: PlatformAdmin
            - call: "POST /api/community-administration/archivals"
              payload: { community_id: "${arch_id}" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/communities"
              payload: {}
              as: Anonymous
          assert:
            - "Community.${arch_id}.state == ARCHIVED and it still appears in the unfiltered list"
            - "GET /api/communities?state=ARCHIVED returns exactly 1 row, the community ${arch_id}"
            - "GET /api/communities/${arch_id}/moderators?status=ACTIVE returns 0 rows"
            - "GET /api/communities/${arch_id}/moderators returns exactly 1 row, the archived founding moderator"
            - "Community.${arch_id}.restricted_since_utc != null"

      - name: conditional_posture_gate_on_declared_maturity
        claim_type: conditional_feature_flags
        grounds:
          - entities.Community.fields.is_over_18
          - entities.Post.fields.is_over_18
          - entities.CommunityRule.fields.rule_band
          - errors[ERR_RULE_CONFLICT]
        distinguishing_aspect: "The rule band that may be written depends on the community's declared maturity flag, so a band-3 adult rule is accepted inside an over-18 community and refused as a floor conflict inside an all-ages one even though the payload is otherwise identical."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One over-18 community with an ACTIVE top moderator."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/NightShift", description: "Adults only", is_over_18: true }
              as: Account
              as_user_id: "mod-night"
              captures:
                night_id: $.data.id
                night_v: $.data.version
            - call: "POST /api/communities"
              payload: { name: "r/AllAges", description: "All ages", is_over_18: false }
              as: Account
              as_user_id: "mod-day"
              captures:
                day_id: $.data.id
                day_v: $.data.version
          trigger:
            - call: "POST /api/communities/${night_id}/rules"
              payload: { rule_code: "R-18", rule_text: "Adults only content", rule_band: 3, is_sitewide_floor: true, expected_community_version: "${night_v}" }
              as: Moderator
              as_user_id: "mod-night"
              captures:
                rule_ok: $.data.id
            - call: "POST /api/communities/${day_id}/rules"
              payload: { rule_code: "R-18", rule_text: "Adults only content", rule_band: 3, is_sitewide_floor: true, expected_community_version: "${day_v}" }
              as: Moderator
              as_user_id: "mod-day"
              captures:
                error_id: $.data.error_id
          assert:
            - "the over-18 write succeeds with status 201 and CommunityRule.${rule_ok}.rule_band == 3"
            - "the all-ages write returns 409 with error_id == ERR_RULE_CONFLICT"
            - "GET /api/communities/${day_id}/rules returns 0 rows"
            - "Community.${night_id}.active_rule_count == 1 and Community.${day_id}.active_rule_count == 0"

      - name: community_quarantine_floor_is_inclusive_at_exactly_forty
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.community_health_index
          - calculations.brigade_penalty_points
          - entities.Community.fields.health_index
          - state_machines.Community.RESTRICTED_to_QUARANTINED
          - endpoints.POST_/api/community-administration/brigade-escalations
        distinguishing_aspect: "The quarantine floor is inclusive at exactly 40.00 and the denormalized health_index is reconciled on the escalation that crosses it, so two escalated clusters of band 5 at overlap 1.00 drive a RESTRICTED community to 40.00 and into QUARANTINED, while the same community one hundredth higher would stay RESTRICTED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community with two ACTIVE moderators, one published post, three account-wide sanctions that have already moved it into RESTRICTED, and one escalated brigade cluster of band 5 at overlap 1.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Pinned", description: "Pinned community" }
              as: Account
              as_user_id: "mod-pin"
              captures:
                pin_id: $.data.id
                pin_v: $.data.version
            - call: "POST /api/communities/${pin_id}/moderators"
              payload: { moderator_account_id: "mod-pin-two", display_name: "Mod Pin Two", moderator_role: "REGULAR_MODERATOR", expected_community_version: "${pin_v}" }
              as: Moderator
              as_user_id: "mod-pin"
              captures:
                pin_v3: $.data.version
            - call: "POST /api/community-administration/account-sanctions"
              payload: { account_id: "u-pin-target", community_id: "${pin_id}", decision_outcome: "BAN_ISSUED" }
              as: PlatformAdmin
              captures:
                pin_san_1: $.data.id
            - call: "POST /api/community-administration/account-sanctions"
              payload: { account_id: "u-pin-target", community_id: "${pin_id}", decision_outcome: "MUTE_ISSUED" }
              as: PlatformAdmin
              captures:
                pin_san_2: $.data.id
            - call: "POST /api/community-administration/account-sanctions"
              payload: { account_id: "u-pin-target", community_id: "${pin_id}", decision_outcome: "WARNING_ISSUED" }
              as: PlatformAdmin
              captures:
                pin_san_3: $.data.id
            - call: "POST /api/communities/${pin_id}/brigade-clusters"
              payload: { internal_link_count: 10, external_link_count: 10, participant_count: 10, legitimate_participant_count: 0 }
              as: Moderator
              as_user_id: "mod-pin"
              captures:
                cluster_pin_a: $.data.id
            - call: "POST /api/community-administration/brigade-escalations"
              payload: { cluster_id: "${cluster_pin_a}", sanction_ladder: "BAN" }
              as: PlatformAdmin
            - call: "POST /api/communities/${pin_id}/brigade-clusters"
              payload: { internal_link_count: 10, external_link_count: 10, participant_count: 10, legitimate_participant_count: 0 }
              as: Moderator
              as_user_id: "mod-pin"
              captures:
                cluster_pin_b: $.data.id
          trigger:
            - call: "POST /api/community-administration/brigade-escalations"
              payload: { cluster_id: "${cluster_pin_b}", sanction_ladder: "BAN" }
              as: PlatformAdmin
            - call: "GET /api/communities/${pin_id}"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /api/communities/${pin_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Community.${pin_id}.account_sanction_index gate having been met put the community in RESTRICTED before the second escalation"
            - "after the second escalation Community.${pin_id}.health_index == 40.00 exactly, because 100.00 - 2 * min(5 * (1 + floor(1.00 * 10)), 30) is 40.00"
            - "Community.${pin_id}.state == QUARANTINED, because the 40.00 floor is inclusive and a health of 40.01 would have stayed RESTRICTED"
            - "Community.${pin_id}.inactive_moderator_count == 0 and Community.${pin_id}.open_report_weight == 0.00"
            - "after POST /_clock/set_current_utc to 2027-01-16T00:00:00Z the clock is 123 days past both moderators' baseline, so inactive_moderator_count == 2 and health_index == 35.00"
            - "Community.${pin_id}.state == QUARANTINED still, because the quarantine floor was crossed before the inactivity penalty was added"
            - "GET /api/communities/${pin_id}/moderators?status=ACTIVE returns 2 rows"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: immediate_consistency_of_sanction_effects_within_the_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/api/communities/{id}/content-decisions
          - entities.Community.fields.applying_sanction_count
          - entities.Account.fields.karma_points
          - entities.AccountSanction.fields.account_wide_enforcement_counted
        distinguishing_aspect: "consistency_model is immediate, so the sanction synthesized inside the decision request is already counted when the next read is served, and the synthesized row carries account_wide_enforcement_counted false with sanction_date_utc equal to the logical clock exactly."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community with an ACTIVE top moderator and an OPEN backlog item."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha" }
              as: Account
              as_user_id: "mod-alpha"
              captures:
                alpha_id: $.data.id
            - call: "POST /api/communities/${alpha_id}/automated-detection-backlog-items"
              payload: { source_type: "POST", source_id: "src-now", subject_account_id: "u-now", signal_severity_band: 4, detection_confidence: 0.85, overlap_ratio: 0.20, published_at_utc: "2026-09-12T00:00:00Z" }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                item_now: $.data.id
          trigger:
            - call: "POST /api/communities/${alpha_id}/content-decisions"
              payload: { auto_detection_backlog_item_id: "${item_now}", decision_outcome: "MUTE_ISSUED", decision_confidence: 0.85, dissection_band: 0, precedent_approval_count: 0 }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                dec_now: $.data.id
          assert:
            - "the decision response is 201 with ContentDecision.${dec_now}.effective_enforcement_tier == 4"
            - "a community read issued immediately after reports applying_sanction_count == 1 and enforcement_tier == 1"
            - "an account read issued immediately after reports Account.u-now.karma_points == 100 because a MUTE counts karma only once it is counted account-wide or 30 days old"
            - "Account.u-now.account_sanction_index == 0.00 while the sanction is fresh and uncounted"
            - "GET /api/accounts/u-now/sanctions?status=ACTIVE returns exactly 1 row whose account_wide_enforcement_counted == false and whose sanction_date_utc == \"2026-09-15T00:00:00Z\""
            - "after POST /_clock/set_current_utc to 2026-10-16T00:00:00Z the same read reports account_sanction_index == 1.00 because 31 days have now passed"

  # ===========================================================================
  # Stubs: corners already carried by a §1.8 instance
  # ===========================================================================
  - section: state_machines
    instances:

      - name: stub_succession_revert_cycle_covered_by_difficulty_instance
        claim_type: "Invalid Transitions"
        grounds:
          - state_machines.TeamSuccession.HANDOVER_BLOCKED_to_PENDING_HANDOVER
        excluded_because:
          difficulty_instance: succession_dispute_block_and_revert_cycle
          rationale: "The revert cycle and its round counting are asserted directly by that §1.8 instance."

  - section: validations
    instances:

      - name: stub_segregation_of_duties_pairing_covered_by_difficulty_instance
        claim_type: Priority Ordering
        grounds:
          - validations[priority=3]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        excluded_because:
          difficulty_instance: segregation_of_duties_precedes_existence
          rationale: "The priority-3 versus priority-4 dual-failure ordering is that §1.8 instance's whole assertion."

      - name: stub_stale_version_pairing_covered_by_difficulty_instance
        claim_type: Priority Ordering
        grounds:
          - validations[priority=5]
          - errors[ERR_STALE_VERSION]
        excluded_because:
          difficulty_instance: stale_version_precedes_invalid_state
          rationale: "The priority-5 versus priority-6 dual-failure ordering is that §1.8 instance's whole assertion."

  - section: cross_cutting_complexity_layers
    instances:

      - name: stub_reinstatement_condition_set_covered_by_difficulty_instance
        claim_type: cascading_side_effects
        grounds:
          - errors[ERR_REINSTATEMENT_CONDITIONS_UNMET]
          - state_machines.Community.RESTRICTED_to_ACTIVE
          - endpoints.POST_/api/communities/{id}/reinstatement-requests
