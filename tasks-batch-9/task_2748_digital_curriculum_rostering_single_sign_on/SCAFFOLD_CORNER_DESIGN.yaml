  # ===========================================================================
  # SECTION 2 — state_machines  (§1.2, shape parallel, 7 machines)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: term_initial_state_is_planned_and_rollover_from_planned_rejected
        claim_type: Initial State
        grounds:
          - state_machines[Term].initial_state
          - state_machines[Term].transitions[ACTIVE -> ROLLED_OVER]
          - errors[ERR_TERM_NOT_ACTIVE]
        distinguishing_aspect: "A newly created Term is PLANNED, and rollover — the only transition out of ACTIVE — is refused from PLANNED with ERR_TERM_NOT_ACTIVE (409) even when the clock is already past end_date, so the state guard is checked before the window guard."
        test_recipe:
          setup:
            - "Clock at 2026-12-20T00:00:00Z (already past end_date 2026-12-18)."
            - "One PLANNED term that was never activated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/terms"
              payload: { name: "Fall 2026", school_year: 2026, start_date: "2026-08-10", end_date: "2026-12-18", add_drop_cutoff_date: "2026-09-15", instructional_days: 85, archive_retention_days: 90 }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { term_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-12-20T00:00:00Z" }
              as: RosterOperator
              as_user_id: "ro-001"
          trigger:
            - call: "POST /rostering/terms/${term_id}/rollover"
              payload: {}
              as: DataGovernanceOfficer
              as_user_id: "dgo-001"
              captures: { err: "$.data.error_id" }
          assert:
            - "the created term had data.state == PLANNED (initial_state) and data.archived_access_expires_at == null"
            - "the rollover returns HTTP 409 with data.error_id == ERR_TERM_NOT_ACTIVE — not ERR_TERM_WINDOW_CLOSED, which would be the wrong rung"
            - "GET /rostering/terms/${term_id} still shows state == PLANNED and archived_access_expires_at == null"

      - name: term_activate_after_end_date_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines[Term].transitions[PLANNED -> ACTIVE]
          - errors[ERR_TERM_WINDOW_CLOSED]
        distinguishing_aspect: "The PLANNED -> ACTIVE precondition is clock date <= end_date: activating on 2026-12-18 (exactly end_date) succeeds, and a second PLANNED term activated on 2026-12-19 returns ERR_TERM_WINDOW_CLOSED (422) — an inclusive boundary on the activation side."
        test_recipe:
          setup:
            - "Two PLANNED terms with the same window 2026-08-10 .. 2026-12-18."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/terms"
              payload: { name: "Fall 2026", school_year: 2026, start_date: "2026-08-10", end_date: "2026-12-18", add_drop_cutoff_date: "2026-09-15", instructional_days: 85, archive_retention_days: 90 }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { term_a_id: $.data.id }
            - call: "POST /rostering/terms"
              payload: { name: "Fall 2026 Alt", school_year: 2026, start_date: "2026-08-10", end_date: "2026-12-18", add_drop_cutoff_date: "2026-09-15", instructional_days: 85, archive_retention_days: 90 }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { term_b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-12-18T23:59:59Z" }
              as: RosterOperator
              as_user_id: "ro-001"
          trigger:
            - call: "POST /rostering/terms/${term_a_id}/activate"
              payload: {}
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-12-19T00:00:00Z" }
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/terms/${term_b_id}/activate"
              payload: {}
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { err: "$.data.error_id" }
          assert:
            - "term A activates with HTTP 200, data.state == ACTIVE and data.version == 2 — clock date == end_date is inside the window"
            - "term B returns HTTP 422 with data.error_id == ERR_TERM_WINDOW_CLOSED"
            - "GET /rostering/terms/${term_b_id} still shows state == PLANNED and version == 1"

