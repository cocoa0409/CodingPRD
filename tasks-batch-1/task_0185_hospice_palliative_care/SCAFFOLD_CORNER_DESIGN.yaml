          - errors[ERR_SERVICE_DATE_OUT_OF_RANGE]
          - endpoints["POST /hospice/care-days"]
        distinguishing_aspect: "Posting a care-day with service_date before election_date returns ERR_SERVICE_DATE_OUT_OF_RANGE (422)."
        test_recipe:
          setup:
            - "Election elected 2026-01-10; clock 2026-01-10."
          setup_api_calls:
            - call: "POST /hospice/providers"
