scaffold_difficulty_design:

  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: overtime_standard_vs_storm
        grounds:
          - calculations.overtime_pay
          - entities.Callout.fields.pay_cents
          - entities.StormEvent.fields.severity
        distinguishing_aspect: |
          Same hours_worked=10 and hourly_rate_cents=4000 yields pay_cents 44000 under STANDARD
          (MODERATE storm) versus 56000 under STORM_MODE (SEVERE storm); the dual variant lives on
          the Operator/Callout labor domain.
        test_recipe:
          setup:
            - "One operator at 4000 cents/hr; a MODERATE storm and a SEVERE storm; one ISSUED callout under each (windows 16h apart so no rest violation)."
          setup_api_calls:
            - call: "POST /operators"
              payload: { full_name: "Op Std", badge_number: "B1", cdl_class: "B", hourly_rate_cents: 4000 }
              as: YardManager
              captures: { op_id: $.data.id }
            - call: "POST /storm-events"
              payload: { name: "Moderate", severity: "MODERATE", forecast_start_at: "2026-02-10T00:00:00Z", forecast_end_at: "2026-02-11T00:00:00Z" }
              as: DispatchSupervisor
              captures: { storm_mod: $.data.id }
            - call: "POST /storm-events"
              payload: { name: "Severe", severity: "SEVERE", forecast_start_at: "2026-02-11T00:00:00Z", forecast_end_at: "2026-02-12T00:00:00Z" }
              as: DispatchSupervisor
              captures: { storm_sev: $.data.id }
            - call: "POST /storm-events/${storm_mod}/callouts"
              payload: { operator_id: "${op_id}", window_start_at: "2026-02-10T00:00:00Z", window_end_at: "2026-02-10T08:00:00Z" }
              as: DispatchSupervisor
              captures: { co_std: $.data.id }
            - call: "POST /storm-events/${storm_sev}/callouts"
              payload: { operator_id: "${op_id}", window_start_at: "2026-02-11T00:00:00Z", window_end_at: "2026-02-11T08:00:00Z" }
              as: DispatchSupervisor
              captures: { co_storm: $.data.id }
          trigger:
            - call: "POST /callouts/${co_std}/complete"
              payload: { hours_worked: 10 }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /callouts/${co_storm}/complete"
              payload: { hours_worked: 10 }
              as: Operator
              as_user_id: "${op_id}"
          assert:
            - "Callout.${co_std}.pay_mode == STANDARD"
            - "Callout.${co_std}.pay_cents == 44000"
            - "Callout.${co_storm}.pay_mode == STORM_MODE"
            - "Callout.${co_storm}.pay_cents == 56000"

      - name: cost_estimate_vs_actual
        grounds:
          - calculations.cost_per_event
          - entities.CostReport.fields.total_cost_cents
          - entities.CostReport.fields.variant
        distinguishing_aspect: |
          Identical storm data yields CostReport total_cost_cents 49000 for ESTIMATE versus 64500 for
          ACTUAL; the dual variant lives on the StormEvent/CostReport cost domain, a different entity
          domain than the Operator overtime calculation.
        test_recipe:
          setup:
            - "SEVERE storm, ARTERIAL route (2.0 lane-miles), COMBO vehicle, operator at 4000/hr with a COMPLETED callout (window 8h, pay 56000); one IN_PROGRESS assignment planned_material_tons=2.0 with one RECORDED SALT application of 1.0 ton."
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Yard", salt_tons_on_hand: 100, brine_gallons_on_hand: 1000 }
              as: YardManager
              captures: { dep: $.data.id }
            - call: "POST /vehicles"
              payload: { home_depot_id: "${dep}", unit_number: "T1", vehicle_type: "COMBO" }
              as: YardManager
              captures: { veh: $.data.id }
            - call: "POST /operators"
              payload: { full_name: "Op A", badge_number: "B2", cdl_class: "A", hourly_rate_cents: 4000 }
              as: YardManager
              captures: { op: $.data.id }
            - call: "POST /routes"
              payload: { name: "Main St", tier: "ARTERIAL", lane_miles: 2.0, zone: "Z1" }
              as: DispatchSupervisor
              captures: { rt: $.data.id }
            - call: "POST /storm-events"
              payload: { name: "Blizzard", severity: "SEVERE", forecast_start_at: "2026-02-10T00:00:00Z", forecast_end_at: "2026-02-11T00:00:00Z" }
              as: DispatchSupervisor
              captures: { st: $.data.id }
            - call: "POST /storm-events/${st}/callouts"
              payload: { operator_id: "${op}", window_start_at: "2026-02-10T00:00:00Z", window_end_at: "2026-02-10T08:00:00Z" }
              as: DispatchSupervisor
              captures: { co: $.data.id }
            - call: "POST /callouts/${co}/complete"
              payload: { hours_worked: 10 }
              as: Operator
              as_user_id: "${op}"
            - call: "POST /storm-events/${st}/activate"
              payload: {}
              as: DispatchSupervisor
            - call: "GET /storm-events/${st}"
              payload: {}
              as: DispatchSupervisor
              captures: { v: $.data.version }
            - call: "POST /storm-events/${st}/assignments"
              payload: { route_id: "${rt}", vehicle_id: "${veh}", operator_id: "${op}", assignment_type: "PLOWING", window_start_at: "2026-02-10T01:00:00Z", window_end_at: "2026-02-10T05:00:00Z", planned_material_tons: 2.0, expected_storm_event_version: "${v}" }
              as: DispatchSupervisor
              captures: { asg: $.data.id }
            - call: "POST /assignments/${asg}/start"
              payload: {}
              as: DispatchSupervisor
            - call: "POST /assignments/${asg}/applications"
              payload: { depot_id: "${dep}", material_type: "SALT", salt_tons: 1.0, lane_miles_treated: 2.0, pavement_temp_f: 15 }
              as: Operator
              as_user_id: "${op}"
          trigger:
            - call: "POST /storm-events/${st}/cost-reports"
              payload: { variant: "ESTIMATE" }
              as: DispatchSupervisor
              captures: { cr_est: $.data.id }
            - call: "POST /storm-events/${st}/cost-reports"
              payload: { variant: "ACTUAL" }
              as: DispatchSupervisor
              captures: { cr_act: $.data.id }
          assert:
            - "CostReport.${cr_est}.total_material_cost_cents == 17000"
            - "CostReport.${cr_est}.total_labor_cost_cents == 32000"
            - "CostReport.${cr_est}.total_cost_cents == 49000"
            - "CostReport.${cr_act}.total_material_cost_cents == 8500"
            - "CostReport.${cr_act}.total_labor_cost_cents == 56000"
            - "CostReport.${cr_act}.total_cost_cents == 64500"

  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: material_rate_tiered_nonlinear
        grounds:
          - calculations.material_application_requirement
          - entities.MaterialApplication.fields.recommended_salt_tons
          - entities.Route.fields.tier
        distinguishing_aspect: |
          recommended_salt_tons = lane_miles_treated * 0.15 * temperature_factor(temp) * tier_multiplier(tier)
          combines three inputs with a tiered (non-linear) temperature factor; an ARTERIAL route at 15F
          over 2.0 lane-miles yields 0.39 — mode (a), a >=3-input formula with non-linear tier selection.
        test_recipe:
          setup:
            - "IN_PROGRESS assignment on an ARTERIAL route; operator owns it; depot has salt."
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Yard", salt_tons_on_hand: 100, brine_gallons_on_hand: 1000 }
              as: YardManager
              captures: { dep: $.data.id }
            - call: "POST /vehicles"
              payload: { home_depot_id: "${dep}", unit_number: "T1", vehicle_type: "COMBO" }
              as: YardManager
              captures: { veh: $.data.id }
            - call: "POST /operators"
              payload: { full_name: "Op A", badge_number: "B2", cdl_class: "A", hourly_rate_cents: 4000 }
              as: YardManager
              captures: { op: $.data.id }
            - call: "POST /routes"
              payload: { name: "Main St", tier: "ARTERIAL", lane_miles: 2.0, zone: "Z1" }
              as: DispatchSupervisor
              captures: { rt: $.data.id }
            - call: "POST /storm-events"
              payload: { name: "Blizzard", severity: "SEVERE", forecast_start_at: "2026-02-10T00:00:00Z", forecast_end_at: "2026-02-11T00:00:00Z" }
              as: DispatchSupervisor
              captures: { st: $.data.id }
            - call: "POST /storm-events/${st}/callouts"
              payload: { operator_id: "${op}", window_start_at: "2026-02-10T00:00:00Z", window_end_at: "2026-02-10T08:00:00Z" }
              as: DispatchSupervisor
              captures: { co: $.data.id }
            - call: "POST /storm-events/${st}/activate"
              payload: {}
              as: DispatchSupervisor
            - call: "GET /storm-events/${st}"
              payload: {}
              as: DispatchSupervisor
              captures: { v: $.data.version }
            - call: "POST /storm-events/${st}/assignments"
              payload: { route_id: "${rt}", vehicle_id: "${veh}", operator_id: "${op}", assignment_type: "PLOWING", window_start_at: "2026-02-10T01:00:00Z", window_end_at: "2026-02-10T05:00:00Z", planned_material_tons: 2.0, expected_storm_event_version: "${v}" }
              as: DispatchSupervisor
              captures: { asg: $.data.id }
            - call: "POST /assignments/${asg}/start"
              payload: {}
              as: DispatchSupervisor
          trigger:
            - call: "POST /assignments/${asg}/applications"
              payload: { depot_id: "${dep}", material_type: "SALT", salt_tons: 0.5, lane_miles_treated: 2.0, pavement_temp_f: 15 }
              as: Operator
              as_user_id: "${op}"
              captures: { app: $.data.id }
          assert:
            - "MaterialApplication.${app}.recommended_salt_tons == 0.39"

      - name: cost_material_round_per_line
        grounds:
          - calculations.cost_per_event
          - entities.CostReport.fields.total_material_cost_cents
          - entities.MaterialApplication.fields.salt_tons
        distinguishing_aspect: |
          Two SALT applications of 1.2345 tons each cost 10493 cents per line (round-half-up per line),
          summing to 20986; sum-then-round would give 20987. The calc pins round-per-line-then-sum —
          mode (b), where rounding order changes the result.
        test_recipe:
          setup:
            - "IN_PROGRESS assignment; depot with >= 2.469 salt tons; two RECORDED SALT applications of 1.2345 tons each; no COMPLETED callouts (labor 0)."
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Yard", salt_tons_on_hand: 100, brine_gallons_on_hand: 1000 }
              as: YardManager
              captures: { dep: $.data.id }
            - call: "POST /vehicles"
              payload: { home_depot_id: "${dep}", unit_number: "T1", vehicle_type: "COMBO" }
              as: YardManager
              captures: { veh: $.data.id }
            - call: "POST /operators"
              payload: { full_name: "Op A", badge_number: "B2", cdl_class: "A", hourly_rate_cents: 4000 }
              as: YardManager
              captures: { op: $.data.id }
            - call: "POST /routes"
              payload: { name: "Main St", tier: "ARTERIAL", lane_miles: 2.0, zone: "Z1" }
              as: DispatchSupervisor
              captures: { rt: $.data.id }
            - call: "POST /storm-events"
              payload: { name: "Blizzard", severity: "SEVERE", forecast_start_at: "2026-02-10T00:00:00Z", forecast_end_at: "2026-02-11T00:00:00Z" }
              as: DispatchSupervisor
              captures: { st: $.data.id }
            - call: "POST /storm-events/${st}/callouts"
              payload: { operator_id: "${op}", window_start_at: "2026-02-10T00:00:00Z", window_end_at: "2026-02-10T08:00:00Z" }
              as: DispatchSupervisor
              captures: { co: $.data.id }
            - call: "POST /storm-events/${st}/activate"
              payload: {}
              as: DispatchSupervisor
            - call: "GET /storm-events/${st}"
              payload: {}
              as: DispatchSupervisor
              captures: { v: $.data.version }
            - call: "POST /storm-events/${st}/assignments"
              payload: { route_id: "${rt}", vehicle_id: "${veh}", operator_id: "${op}", assignment_type: "PLOWING", window_start_at: "2026-02-10T01:00:00Z", window_end_at: "2026-02-10T05:00:00Z", planned_material_tons: 0, expected_storm_event_version: "${v}" }
              as: DispatchSupervisor
              captures: { asg: $.data.id }
            - call: "POST /assignments/${asg}/start"
              payload: {}
              as: DispatchSupervisor
            - call: "POST /assignments/${asg}/applications"
              payload: { depot_id: "${dep}", material_type: "SALT", salt_tons: 1.2345, lane_miles_treated: 2.0, pavement_temp_f: 15 }
              as: Operator
              as_user_id: "${op}"
            - call: "POST /assignments/${asg}/applications"
              payload: { depot_id: "${dep}", material_type: "SALT", salt_tons: 1.2345, lane_miles_treated: 2.0, pavement_temp_f: 15 }
              as: Operator
              as_user_id: "${op}"
          trigger:
            - call: "POST /storm-events/${st}/cost-reports"
              payload: { variant: "ACTUAL" }
              as: DispatchSupervisor
              captures: { cr: $.data.id }
          assert:
            - "CostReport.${cr}.total_material_cost_cents == 20986"
            - "CostReport.${cr}.total_labor_cost_cents == 0"
            - "CostReport.${cr}.total_cost_cents == 20986"

  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: storm_parallel_axes
        grounds:
          - state_machines.StormEvent.PLANNED_to_ACTIVE
          - state_machines.StormEvent.OPEN_to_FINALIZED
          - entities.StormEvent.fields.billing_status
        distinguishing_aspect: |
          StormEvent carries two independent axes on one row: operational_status PLANNED->ACTIVE->CLOSED
          and billing_status OPEN->FINALIZED. finalize-billing advances only the billing axis and leaves
          operational_status CLOSED — parallel state dimensions, not a linear pipeline.
        test_recipe:
          setup:
            - "A storm that has been activated then closed (operational_status CLOSED, billing_status still OPEN)."
          setup_api_calls:
            - call: "POST /storm-events"
              payload: { name: "S1", severity: "LIGHT", forecast_start_at: "2026-02-10T00:00:00Z", forecast_end_at: "2026-02-11T00:00:00Z" }
              as: DispatchSupervisor
              captures: { st: $.data.id }
            - call: "POST /storm-events/${st}/activate"
              payload: {}
              as: DispatchSupervisor
            - call: "POST /storm-events/${st}/close"
              payload: {}
              as: DispatchSupervisor
          trigger:
            - call: "POST /storm-events/${st}/finalize-billing"
              payload: {}
              as: DispatchSupervisor
          assert:
            - "StormEvent.${st}.billing_status == FINALIZED"
            - "StormEvent.${st}.operational_status == CLOSED"

      - name: complaint_reopen_cycle
        grounds:
          - state_machines.Complaint.RESOLVED_to_REOPENED
          - state_machines.Complaint.REOPENED_to_INVESTIGATING
          - entities.Complaint.fields.status
        distinguishing_aspect: |
          A Complaint cycles OPEN->INVESTIGATING->RESOLVED->REOPENED->INVESTIGATING; the reopen edge
          returns a resolved (terminal-looking) complaint to an active state, a cycle no linear pipeline
          allows. Different entity than the StormEvent parallel machine.
        test_recipe:
          setup:
            - "A complaint against a route in a storm, moved OPEN->INVESTIGATING->RESOLVED."
          setup_api_calls:
            - call: "POST /routes"
              payload: { name: "Elm St", tier: "RESIDENTIAL", lane_miles: 1.0, zone: "Z2" }
              as: DispatchSupervisor
              captures: { rt: $.data.id }
            - call: "POST /storm-events"
              payload: { name: "S1", severity: "LIGHT", forecast_start_at: "2026-02-10T00:00:00Z", forecast_end_at: "2026-02-11T00:00:00Z" }
              as: DispatchSupervisor
              captures: { st: $.data.id }
            - call: "POST /complaints"
              payload: { route_id: "${rt}", storm_event_id: "${st}", address: "12 Elm St", complaint_type: "MISSED_STREET" }
              as: CitizenServices
              captures: { cmp: $.data.id }
            - call: "POST /complaints/${cmp}/investigate"
              payload: { confirm_missed: true }
              as: CitizenServices
            - call: "POST /complaints/${cmp}/resolve"
              payload: {}
              as: CitizenServices
          trigger:
            - call: "POST /complaints/${cmp}/reopen"
              payload: {}
              as: CitizenServices
            - call: "POST /complaints/${cmp}/investigate"
              payload: {}
              as: CitizenServices
          assert:
            - "Complaint.${cmp}.status == INVESTIGATING"
            - "Complaint.${cmp}.missed_street_confirmed == true"

  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: storm_close_releases_vehicle
        grounds:
          - state_machines.StormEvent.ACTIVE_to_CLOSED
          - state_machines.RouteAssignment.IN_PROGRESS_to_COMPLETED
          - entities.Vehicle.fields.status
        distinguishing_aspect: |
          Closing the storm (A) transitions its IN_PROGRESS assignment to COMPLETED (B, caused by A),
          and reaching COMPLETED releases the vehicle to AVAILABLE (C, caused by B): a 3-entity chain
          StormEvent -> RouteAssignment -> Vehicle where each hop is caused by the previous.
        test_recipe:
          setup:
            - "ACTIVE storm with one IN_PROGRESS assignment; its vehicle is ASSIGNED (reserved)."
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Yard", salt_tons_on_hand: 100, brine_gallons_on_hand: 1000 }
              as: YardManager
              captures: { dep: $.data.id }
            - call: "POST /vehicles"
              payload: { home_depot_id: "${dep}", unit_number: "T1", vehicle_type: "COMBO" }
              as: YardManager
              captures: { veh: $.data.id }
            - call: "POST /operators"
              payload: { full_name: "Op A", badge_number: "B2", cdl_class: "A", hourly_rate_cents: 4000 }
              as: YardManager
              captures: { op: $.data.id }
            - call: "POST /routes"
              payload: { name: "Main St", tier: "ARTERIAL", lane_miles: 2.0, zone: "Z1" }
              as: DispatchSupervisor
              captures: { rt: $.data.id }
            - call: "POST /storm-events"
              payload: { name: "Blizzard", severity: "SEVERE", forecast_start_at: "2026-02-10T00:00:00Z", forecast_end_at: "2026-02-11T00:00:00Z" }
              as: DispatchSupervisor
              captures: { st: $.data.id }
            - call: "POST /storm-events/${st}/callouts"
              payload: { operator_id: "${op}", window_start_at: "2026-02-10T00:00:00Z", window_end_at: "2026-02-10T08:00:00Z" }
              as: DispatchSupervisor
              captures: { co: $.data.id }
            - call: "POST /storm-events/${st}/activate"
              payload: {}
              as: DispatchSupervisor
            - call: "GET /storm-events/${st}"
              payload: {}
              as: DispatchSupervisor
              captures: { v: $.data.version }
            - call: "POST /storm-events/${st}/assignments"
              payload: { route_id: "${rt}", vehicle_id: "${veh}", operator_id: "${op}", assignment_type: "PLOWING", window_start_at: "2026-02-10T01:00:00Z", window_end_at: "2026-02-10T05:00:00Z", planned_material_tons: 2.0, expected_storm_event_version: "${v}" }
              as: DispatchSupervisor
              captures: { asg: $.data.id }
            - call: "POST /assignments/${asg}/start"
              payload: {}
              as: DispatchSupervisor
          trigger:
            - call: "POST /storm-events/${st}/close"
              payload: {}
              as: DispatchSupervisor
          assert:
            - "StormEvent.${st}.operational_status == CLOSED"
            - "RouteAssignment.${asg}.status == COMPLETED"
            - "Vehicle.${veh}.status == AVAILABLE"

      - name: assignment_cancel_credits_depot
        grounds:
          - state_machines.RouteAssignment.IN_PROGRESS_to_CANCELLED
          - state_machines.MaterialApplication.RECORDED_to_VOIDED
          - entities.Depot.fields.salt_tons_on_hand
        distinguishing_aspect: |
          Cancelling an IN_PROGRESS assignment (A) voids its RECORDED application (B, caused by A) and the
          void credits the depot's salt_tons_on_hand back (C, caused by B): a 3-entity chain
          RouteAssignment -> MaterialApplication -> Depot from a different trigger than storm close.
        test_recipe:
          setup:
            - "IN_PROGRESS assignment with one RECORDED SALT application of 10.0 tons; depot salt debited from 100 to 90."
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Yard", salt_tons_on_hand: 100, brine_gallons_on_hand: 1000 }
              as: YardManager
              captures: { dep: $.data.id }
            - call: "POST /vehicles"
              payload: { home_depot_id: "${dep}", unit_number: "T1", vehicle_type: "COMBO" }
              as: YardManager
              captures: { veh: $.data.id }
            - call: "POST /operators"
              payload: { full_name: "Op A", badge_number: "B2", cdl_class: "A", hourly_rate_cents: 4000 }
              as: YardManager
              captures: { op: $.data.id }
            - call: "POST /routes"
              payload: { name: "Main St", tier: "ARTERIAL", lane_miles: 2.0, zone: "Z1" }
              as: DispatchSupervisor
              captures: { rt: $.data.id }
            - call: "POST /storm-events"
              payload: { name: "Blizzard", severity: "SEVERE", forecast_start_at: "2026-02-10T00:00:00Z", forecast_end_at: "2026-02-11T00:00:00Z" }
              as: DispatchSupervisor
              captures: { st: $.data.id }
            - call: "POST /storm-events/${st}/callouts"
              payload: { operator_id: "${op}", window_start_at: "2026-02-10T00:00:00Z", window_end_at: "2026-02-10T08:00:00Z" }
              as: DispatchSupervisor
              captures: { co: $.data.id }
            - call: "POST /storm-events/${st}/activate"
              payload: {}
              as: DispatchSupervisor
            - call: "GET /storm-events/${st}"
              payload: {}
              as: DispatchSupervisor
              captures: { v: $.data.version }
            - call: "POST /storm-events/${st}/assignments"
              payload: { route_id: "${rt}", vehicle_id: "${veh}", operator_id: "${op}", assignment_type: "PLOWING", window_start_at: "2026-02-10T01:00:00Z", window_end_at: "2026-02-10T05:00:00Z", planned_material_tons: 10.0, expected_storm_event_version: "${v}" }
              as: DispatchSupervisor
              captures: { asg: $.data.id }
            - call: "POST /assignments/${asg}/start"
              payload: {}
              as: DispatchSupervisor
            - call: "POST /assignments/${asg}/applications"
              payload: { depot_id: "${dep}", material_type: "SALT", salt_tons: 10.0, lane_miles_treated: 2.0, pavement_temp_f: 15 }
              as: Operator
              as_user_id: "${op}"
              captures: { app: $.data.id }
          trigger:
            - call: "POST /assignments/${asg}/cancel"
              payload: {}
              as: DispatchSupervisor
          assert:
            - "RouteAssignment.${asg}.status == CANCELLED"
            - "MaterialApplication.${app}.status == VOIDED"
            - "Depot.${dep}.salt_tons_on_hand == 100.00"
            - "Vehicle.${veh}.status == AVAILABLE"

  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_over_fiscal_on_application
        grounds:
          - validations[priority=6]
          - validations[priority=13]
          - errors[ERR_ASSIGNMENT_NOT_IN_PROGRESS]
          - errors[ERR_INSUFFICIENT_MATERIAL]
        distinguishing_aspect: |
          An application on a still-PLANNED assignment requesting more salt than the depot holds returns
          the priority-6 state error ERR_ASSIGNMENT_NOT_IN_PROGRESS, not the priority-13 fiscal error
          ERR_INSUFFICIENT_MATERIAL: category state beats category business_fiscal.
        test_recipe:
          setup:
