scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: hardship_basis_variant_flips_verdict_on_identical_option
        grounds:
          - calculations.undue_hardship_assessment
          - calculations.option_net_cost
          - entities.UndueHardshipAssessment.fields.assessment_basis
          - entities.UndueHardshipAssessment.fields.hardship_verdict
          - state_machines.AccommodationOption.PROPOSED_to_CLEARED
          - state_machines.AccommodationOption.PROPOSED_to_HARDSHIP_BLOCKED
        distinguishing_aspect: |
          Two byte-identical AccommodationOption rows on the same case produce
          hardship_score 78.38 / UNDUE under SITE_LOCAL and 17.74 / NOT_UNDUE
          under EMPLOYER_WIDE, driving the same option-status fork to opposite
          branches; this is the financial-hardship entity domain
          (AccommodationOption / UndueHardshipAssessment), distinct from the
          TrialPeriod performance domain of the sibling instance.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z."
            - "PUBLISHED JobProfile 'WH-OP-1' with department_annual_budget_cents 1500000 and employer_annual_budget_cents 800000000, carrying exactly two ACTIVE essential functions of criticality_weight 5 each."
            - "Employee E-1001 in department OPS pinned to that profile, plus people manager M-2001 in the same department."
            - "Case for E-1001 with disability_obvious true, advanced to HARDSHIP_REVIEW, carrying two identical PROPOSED options OPT-HOIST-A and OPT-HOIST-B (one_time 100003, recurring 4315, 30 implementation days) that each cover only EF-LIFT, so coverage_ratio is 0.500000 on both."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ComplianceAuditor
            - call: "POST /job-profiles"
              payload: { job_code: "WH-OP-1", title: "Warehouse Operator", department_code: "OPS", department_annual_budget_cents: 1500000, employer_annual_budget_cents: 800000000 }
              as: AccommodationCoordinator
              captures: { jp_id: $.data.id }
            - call: "POST /job-profiles/${jp_id}/essential-functions"
              payload: { function_code: "EF-LIFT", description: "Lift 50 lb totes to shoulder height", criticality_weight: 5, frequency_per_week: 20, is_essential: true, marginal_reassignable: false }
              as: AccommodationCoordinator
              captures: { ef_lift_id: $.data.id }
            - call: "POST /job-profiles/${jp_id}/essential-functions"
              payload: { function_code: "EF-SCAN", description: "Operate the scanner terminal", criticality_weight: 5, frequency_per_week: 30, is_essential: true, marginal_reassignable: false }
              as: AccommodationCoordinator
              captures: { ef_scan_id: $.data.id }
            - call: "POST /job-profiles/${jp_id}/publish"
              payload: { profile_version_label: "2026.1" }
              as: AccommodationCoordinator
            - call: "POST /employees"
              payload: { employee_number: "E-1001", full_name: "Dana Ruiz", department_code: "OPS", job_title: "Warehouse Operator", hire_date: "2023-04-01", job_profile_id: "${jp_id}", is_people_manager: false, annual_salary_cents: 5200000 }
              as: AccommodationCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /employees"
              payload: { employee_number: "M-2001", full_name: "Lee Park", department_code: "OPS", job_title: "Operations Manager", hire_date: "2019-02-11", job_profile_id: "${jp_id}", is_people_manager: true, annual_salary_cents: 9800000 }
              as: AccommodationCoordinator
              captures: { mgr_id: $.data.id }
            - call: "POST /accommodation-requests"
              payload: { employee_id: "${emp_id}", request_channel: "WRITTEN", requested_accommodation_text: "Lift assist device for tote handling", disability_obvious: true }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { req_id: $.data.id }
            - call: "POST /accommodation-requests/${req_id}/advance"
              payload: { target_stage: "FUNCTION_ANALYSIS" }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
            - call: "POST /accommodation-requests/${req_id}/function-analyses"
              payload: { essential_function_id: "${ef_lift_id}", can_perform_unaided: false, limitation_severity: 4, proposed_treatment: "PERFORM_WITH_AID" }
              as: Manager
              as_user_id: "${mgr_id}"
            - call: "POST /accommodation-requests/${req_id}/function-analyses"
              payload: { essential_function_id: "${ef_scan_id}", can_perform_unaided: true, limitation_severity: 0, proposed_treatment: "NOT_LIMITED" }
              as: Manager
              as_user_id: "${mgr_id}"
            - call: "POST /accommodation-requests/${req_id}/advance"
              payload: { target_stage: "OPTION_EXPLORATION" }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
            - call: "POST /accommodation-requests/${req_id}/options"
              payload: { option_code: "OPT-HOIST-A", category: "EQUIPMENT", one_time_cost_cents: 100003, recurring_monthly_cost_cents: 4315, implementation_days: 30, coverage_function_ids: ["${ef_lift_id}"] }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
              captures: { opt_a_id: $.data.id, opt_a_net: $.data.option_net_cost_cents }
            - call: "POST /accommodation-requests/${req_id}/options"
              payload: { option_code: "OPT-HOIST-B", category: "EQUIPMENT", one_time_cost_cents: 100003, recurring_monthly_cost_cents: 4315, implementation_days: 30, coverage_function_ids: ["${ef_lift_id}"] }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
              captures: { opt_b_id: $.data.id }
            - call: "POST /accommodation-requests/${req_id}/advance"
              payload: { target_stage: "HARDSHIP_REVIEW" }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
            - call: "GET /accommodation-options/${opt_a_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "FIN-1"
              captures: { opt_a_v: $.data.version }
            - call: "GET /accommodation-options/${opt_b_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "FIN-1"
              captures: { opt_b_v: $.data.version }
          trigger:
            - call: "POST /accommodation-options/${opt_a_id}/hardship-assessments"
              payload: { assessment_basis: "SITE_LOCAL", expected_option_version: "${opt_a_v}" }
              as: FinanceOfficer
              as_user_id: "FIN-1"
              captures: { uha_a_id: $.data.id, score_a: $.data.hardship_score }
            - call: "POST /accommodation-options/${opt_b_id}/hardship-assessments"
              payload: { assessment_basis: "EMPLOYER_WIDE", expected_option_version: "${opt_b_v}" }
              as: FinanceOfficer
              as_user_id: "FIN-1"
              captures: { uha_b_id: $.data.id, score_b: $.data.hardship_score }
          assert:
            - "AccommodationOption.${opt_a_id}.option_net_cost_cents == 150636"
            - "AccommodationOption.${opt_b_id}.option_net_cost_cents == 150636"
            - "UndueHardshipAssessment.${uha_a_id}.assessed_net_cost_cents == 150636 and UndueHardshipAssessment.${uha_b_id}.assessed_net_cost_cents == 150636"
            - "UndueHardshipAssessment.${uha_a_id}.denominator_cents == 1500000"
            - "UndueHardshipAssessment.${uha_a_id}.budget_ratio == 0.100424"
            - "UndueHardshipAssessment.${uha_a_id}.budget_ratio_norm == 100.0"
            - "UndueHardshipAssessment.${uha_a_id}.disruption_index == 50.0"
            - "UndueHardshipAssessment.${uha_a_id}.lag_norm == 50.0"
            - "UndueHardshipAssessment.${uha_a_id}.raw_hardship_score == 82.5"
            - "UndueHardshipAssessment.${uha_a_id}.mitigation_credit_rate == 0.05"
            - "UndueHardshipAssessment.${uha_a_id}.hardship_score == 78.38"
            - "UndueHardshipAssessment.${uha_a_id}.hardship_verdict == UNDUE"
            - "UndueHardshipAssessment.${uha_b_id}.denominator_cents == 800000000"
            - "UndueHardshipAssessment.${uha_b_id}.budget_ratio == 0.000188"
            - "UndueHardshipAssessment.${uha_b_id}.budget_ratio_norm == 0.376"
            - "UndueHardshipAssessment.${uha_b_id}.raw_hardship_score == 17.74"
            - "UndueHardshipAssessment.${uha_b_id}.mitigation_credit_rate == 0.0"
            - "UndueHardshipAssessment.${uha_b_id}.hardship_score == 17.74"
            - "UndueHardshipAssessment.${uha_b_id}.hardship_verdict == NOT_UNDUE"
            - "AccommodationOption.${opt_a_id}.status == HARDSHIP_BLOCKED"
            - "AccommodationOption.${opt_b_id}.status == CLEARED"
            - "AccommodationRequest.${req_id}.blocked_option_count == 1 and AccommodationRequest.${req_id}.cleared_option_count == 1"

      - name: trial_scoring_mode_variant_flips_effectiveness_outcome
        grounds:
          - calculations.trial_effectiveness
          - entities.TrialPeriod.fields.scoring_mode
          - entities.TrialPeriod.fields.effectiveness_score
          - entities.EffectivenessReview.fields.review_composite
        distinguishing_aspect: |
          Two TrialPeriod rows fed the identical three-review sequence
          (composites 4.0000, 6.0000, 9.0000 in that chronological order)
          settle at effectiveness_score 7.10 under LATEST_WEIGHTED and 6.33
          under CUMULATIVE_MEAN, straddling EFFECTIVE_THRESHOLD 7.00; this is
          the TrialPeriod performance domain, distinct from the financial
          hardship domain of the sibling instance.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z, PUBLISHED JobProfile 'CS-AGENT-1' with one ACTIVE essential function EF-CALLS of weight 5."
            - "Two employees E-2101 and E-2102 in department CS pinned to that profile, plus people manager M-2103 in CS."
            - "Each employee has a granted case whose selected option fully covers EF-CALLS, and an ACTIVE trial running 2026-09-01..2026-11-30; trial one uses scoring_mode LATEST_WEIGHTED and trial two uses CUMULATIVE_MEAN."
            - "Both trials already carry two reviews recorded on 2026-09-15 (4/4/40) and 2026-10-15 (6/6/60)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ComplianceAuditor
            - call: "POST /job-profiles"
              payload: { job_code: "CS-AGENT-1", title: "Support Agent", department_code: "CS", department_annual_budget_cents: 1500000, employer_annual_budget_cents: 800000000 }
              as: AccommodationCoordinator
              captures: { jp2_id: $.data.id }
            - call: "POST /job-profiles/${jp2_id}/essential-functions"
              payload: { function_code: "EF-CALLS", description: "Handle inbound support calls", criticality_weight: 5, frequency_per_week: 35, is_essential: true, marginal_reassignable: false }
              as: AccommodationCoordinator
              captures: { ef_calls_id: $.data.id }
            - call: "POST /job-profiles/${jp2_id}/publish"
              payload: { profile_version_label: "2026.1" }
              as: AccommodationCoordinator
            - call: "POST /employees"
              payload: { employee_number: "E-2101", full_name: "Ana Silva", department_code: "CS", job_title: "Support Agent", hire_date: "2022-05-16", job_profile_id: "${jp2_id}", is_people_manager: false, annual_salary_cents: 4800000 }
              as: AccommodationCoordinator
              captures: { emp1_id: $.data.id }
            - call: "POST /employees"
              payload: { employee_number: "E-2102", full_name: "Bo Chen", department_code: "CS", job_title: "Support Agent", hire_date: "2022-06-01", job_profile_id: "${jp2_id}", is_people_manager: false, annual_salary_cents: 4800000 }
              as: AccommodationCoordinator
              captures: { emp2_id: $.data.id }
            - call: "POST /employees"
              payload: { employee_number: "M-2103", full_name: "Kim Ortiz", department_code: "CS", job_title: "Support Manager", hire_date: "2018-03-05", job_profile_id: "${jp2_id}", is_people_manager: true, annual_salary_cents: 9100000 }
              as: AccommodationCoordinator
              captures: { mgr2_id: $.data.id }
            - call: "POST /accommodation-requests"
              payload: { employee_id: "${emp1_id}", request_channel: "WRITTEN", requested_accommodation_text: "Noise-cancelling headset", disability_obvious: true }
              as: Employee
              as_user_id: "${emp1_id}"
              captures: { req1_id: $.data.id }
            - call: "POST /accommodation-requests/${req1_id}/advance"
              payload: { target_stage: "FUNCTION_ANALYSIS" }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
            - call: "POST /accommodation-requests/${req1_id}/function-analyses"
              payload: { essential_function_id: "${ef_calls_id}", can_perform_unaided: false, limitation_severity: 3, proposed_treatment: "PERFORM_WITH_AID" }
              as: Manager
              as_user_id: "${mgr2_id}"
            - call: "POST /accommodation-requests/${req1_id}/advance"
              payload: { target_stage: "OPTION_EXPLORATION" }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
            - call: "POST /accommodation-requests/${req1_id}/options"
              payload: { option_code: "OPT-HEADSET", category: "EQUIPMENT", one_time_cost_cents: 40000, recurring_monthly_cost_cents: 0, implementation_days: 10, coverage_function_ids: ["${ef_calls_id}"] }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
              captures: { opt1_id: $.data.id }
            - call: "POST /accommodation-requests/${req1_id}/advance"
              payload: { target_stage: "HARDSHIP_REVIEW" }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
            - call: "GET /accommodation-options/${opt1_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "FIN-1"
              captures: { opt1_v: $.data.version }
            - call: "POST /accommodation-options/${opt1_id}/hardship-assessments"
              payload: { assessment_basis: "SITE_LOCAL", expected_option_version: "${opt1_v}" }
              as: FinanceOfficer
              as_user_id: "FIN-1"
            - call: "POST /accommodation-requests/${req1_id}/advance"
              payload: { target_stage: "DECISION_PENDING" }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
            - call: "POST /accommodation-requests/${req1_id}/decide"
              payload: { decision: "GRANT_WITH_TRIAL", selected_option_id: "${opt1_id}" }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
            - call: "POST /trial-periods"
              payload: { request_id: "${req1_id}", option_id: "${opt1_id}", start_date: "2026-09-01", end_date: "2026-11-30", checkin_cadence_days: 14, scoring_mode: "LATEST_WEIGHTED" }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
              captures: { tp1_id: $.data.id }
            - call: "POST /accommodation-requests"
              payload: { employee_id: "${emp2_id}", request_channel: "WRITTEN", requested_accommodation_text: "Noise-cancelling headset", disability_obvious: true }
              as: Employee
              as_user_id: "${emp2_id}"
              captures: { req2_id: $.data.id }
            - call: "POST /accommodation-requests/${req2_id}/advance"
              payload: { target_stage: "FUNCTION_ANALYSIS" }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
            - call: "POST /accommodation-requests/${req2_id}/function-analyses"
              payload: { essential_function_id: "${ef_calls_id}", can_perform_unaided: false, limitation_severity: 3, proposed_treatment: "PERFORM_WITH_AID" }
              as: Manager
              as_user_id: "${mgr2_id}"
            - call: "POST /accommodation-requests/${req2_id}/advance"
              payload: { target_stage: "OPTION_EXPLORATION" }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
            - call: "POST /accommodation-requests/${req2_id}/options"
              payload: { option_code: "OPT-HEADSET", category: "EQUIPMENT", one_time_cost_cents: 40000, recurring_monthly_cost_cents: 0, implementation_days: 10, coverage_function_ids: ["${ef_calls_id}"] }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
              captures: { opt2_id: $.data.id }
            - call: "POST /accommodation-requests/${req2_id}/advance"
              payload: { target_stage: "HARDSHIP_REVIEW" }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
            - call: "GET /accommodation-options/${opt2_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "FIN-1"
              captures: { opt2_v: $.data.version }
            - call: "POST /accommodation-options/${opt2_id}/hardship-assessments"
              payload: { assessment_basis: "SITE_LOCAL", expected_option_version: "${opt2_v}" }
              as: FinanceOfficer
              as_user_id: "FIN-1"
            - call: "POST /accommodation-requests/${req2_id}/advance"
              payload: { target_stage: "DECISION_PENDING" }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
            - call: "POST /accommodation-requests/${req2_id}/decide"
              payload: { decision: "GRANT_WITH_TRIAL", selected_option_id: "${opt2_id}" }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
            - call: "POST /trial-periods"
              payload: { request_id: "${req2_id}", option_id: "${opt2_id}", start_date: "2026-09-01", end_date: "2026-11-30", checkin_cadence_days: 14, scoring_mode: "CUMULATIVE_MEAN" }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
              captures: { tp2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ComplianceAuditor
            - call: "POST /_ops/daily-sweep"
              payload: {}
              as: ComplianceAuditor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T08:00:00Z" }
              as: ComplianceAuditor
            - call: "POST /trial-periods/${tp1_id}/effectiveness-reviews"
              payload: { employee_rating: 4, manager_rating: 4, objective_metric_pct: 40 }
              as: Manager
              as_user_id: "${mgr2_id}"
            - call: "POST /trial-periods/${tp2_id}/effectiveness-reviews"
              payload: { employee_rating: 4, manager_rating: 4, objective_metric_pct: 40 }
              as: Manager
              as_user_id: "${mgr2_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T08:00:00Z" }
              as: ComplianceAuditor
            - call: "POST /trial-periods/${tp1_id}/effectiveness-reviews"
              payload: { employee_rating: 6, manager_rating: 6, objective_metric_pct: 60 }
              as: Manager
              as_user_id: "${mgr2_id}"
            - call: "POST /trial-periods/${tp2_id}/effectiveness-reviews"
              payload: { employee_rating: 6, manager_rating: 6, objective_metric_pct: 60 }
              as: Manager
              as_user_id: "${mgr2_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T08:00:00Z" }
              as: ComplianceAuditor
          trigger:
            - call: "POST /trial-periods/${tp1_id}/effectiveness-reviews"
              payload: { employee_rating: 9, manager_rating: 9, objective_metric_pct: 90 }
              as: Manager
              as_user_id: "${mgr2_id}"
              captures: { rev1_composite: $.data.review_composite }
            - call: "POST /trial-periods/${tp2_id}/effectiveness-reviews"
              payload: { employee_rating: 9, manager_rating: 9, objective_metric_pct: 90 }
              as: Manager
              as_user_id: "${mgr2_id}"
            - call: "GET /trial-periods/${tp1_id}"
              payload: {}
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
              captures: { score1: $.data.effectiveness_score }
            - call: "GET /trial-periods/${tp2_id}"
              payload: {}
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
              captures: { score2: $.data.effectiveness_score }
          assert:
            - "EffectivenessReview review_composite values on both trials are 4.0, 6.0 and 9.0 in review_date order"
            - "TrialPeriod.${tp1_id}.review_count == 3 and TrialPeriod.${tp2_id}.review_count == 3"
            - "TrialPeriod.${tp1_id}.effectiveness_score == 7.10"
            - "TrialPeriod.${tp2_id}.effectiveness_score == 6.33"
            - "TrialPeriod.${tp1_id}.status == UNDER_REVIEW and TrialPeriod.${tp2_id}.status == UNDER_REVIEW"
            - "TrialPeriod.${tp1_id}.effectiveness_score >= 7.00 while TrialPeriod.${tp2_id}.effectiveness_score < 7.00, so resolve outcome EFFECTIVE is permitted on tp1 and rejected with ERR_TRIAL_OUTCOME_MISMATCH on tp2"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: option_net_cost_rounds_each_component_before_summing
        grounds:
          - calculations.option_net_cost
          - entities.AccommodationOption.fields.option_net_cost_cents
          - entities.AccommodationOption.fields.one_time_cost_cents
          - entities.AccommodationOption.fields.recurring_monthly_cost_cents
        distinguishing_aspect: |
          Combinatorial mode (b), nested rounding order: one_time 100003 gives
          74002.22 cents and recurring 4315 x 24 gives 76634.40 cents, so
          round-then-sum yields exactly 150636 while the forbidden
          sum-then-round yields 150637 — a one-cent divergence that pins the
          order; the sibling instance exercises mode (c) instead.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z."
            - "PUBLISHED JobProfile 'FAC-TECH-1' in department FAC with one ACTIVE essential function EF-CLIMB of weight 5."
            - "Employee E-3001 and people manager M-3002 both in department FAC."
            - "Case for E-3001 with disability_obvious true, advanced to OPTION_EXPLORATION with its single function analysis recorded."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ComplianceAuditor
            - call: "POST /job-profiles"
              payload: { job_code: "FAC-TECH-1", title: "Facilities Technician", department_code: "FAC", department_annual_budget_cents: 1500000, employer_annual_budget_cents: 800000000 }
              as: AccommodationCoordinator
              captures: { jp3_id: $.data.id }
            - call: "POST /job-profiles/${jp3_id}/essential-functions"
              payload: { function_code: "EF-CLIMB", description: "Climb fixed ladders to roof plant", criticality_weight: 5, frequency_per_week: 12, is_essential: true, marginal_reassignable: false }
              as: AccommodationCoordinator
              captures: { ef_climb_id: $.data.id }
            - call: "POST /job-profiles/${jp3_id}/publish"
              payload: { profile_version_label: "2026.1" }
              as: AccommodationCoordinator
            - call: "POST /employees"
              payload: { employee_number: "E-3001", full_name: "Rae Njoku", department_code: "FAC", job_title: "Facilities Technician", hire_date: "2021-09-13", job_profile_id: "${jp3_id}", is_people_manager: false, annual_salary_cents: 6100000 }
              as: AccommodationCoordinator
              captures: { emp3_id: $.data.id }
            - call: "POST /employees"
              payload: { employee_number: "M-3002", full_name: "Iris Vogel", department_code: "FAC", job_title: "Facilities Manager", hire_date: "2017-01-09", job_profile_id: "${jp3_id}", is_people_manager: true, annual_salary_cents: 10200000 }
              as: AccommodationCoordinator
              captures: { mgr3_id: $.data.id }
            - call: "POST /accommodation-requests"
