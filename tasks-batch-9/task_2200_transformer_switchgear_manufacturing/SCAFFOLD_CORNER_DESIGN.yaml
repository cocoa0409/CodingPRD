            - "The same call with witness_party_id ${party_b_id} returns HTTP 201, and GET /factory-acceptance-tests/${fat_id}/witness-assignments as WitnessCoordinator then returns a data array of length 2."

      - name: submit_action_on_unknown_adjustment_id_returns_adjustment_not_found
        claim_type: violation_to_error
        grounds:
          - validations[P10]
          - errors[ERR_ADJUSTMENT_NOT_FOUND]
          - endpoints[submit_escalation_adjustment]
        distinguishing_aspect: "Existence (P10) is evaluated before any state rule on every /escalation-adjustments/{id}/** action, so a syntactically valid but unknown id yields 404 ERR_ADJUSTMENT_NOT_FOUND and never a 409 state error."
        test_recipe:
          setup:
            - "No escalation adjustments exist."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: POST /escalation-adjustments/00000000-0000-4000-8000-0000000000a1/submit
              payload: {}
              as: ContractAdmin
          assert:
            - "HTTP 404 with data.error_id == \"ERR_ADJUSTMENT_NOT_FOUND\"."

      - name: adjustment_creation_naming_an_unknown_clause_returns_clause_not_found
        claim_type: violation_to_error
        grounds:
          - validations[P9]
          - validations[P32]
          - errors[ERR_CLAUSE_NOT_FOUND]
          - endpoints[create_escalation_adjustment]
        distinguishing_aspect: "A body-carried foreign key is subject to the same existence sweep as a path id: an unknown escalation_clause_id fails at P9 with 404 ERR_CLAUSE_NOT_FOUND, ahead of the P32 version check and the P68 index-window checks, even though the order itself exists and has no clause at all."
        test_recipe:
          setup:
            - "One order exists with no escalation clause attached."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
            - call: POST /engineered-orders
              payload:
                order_number: "ORD-CORNER-E10"
                customer_name: "Riverbend Utility"
                product_family: "POWER_TRANSFORMER"
